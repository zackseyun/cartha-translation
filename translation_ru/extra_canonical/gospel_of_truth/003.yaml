  consult_excerpt: 'This is the Gospel of the one they search for, revealed to those who are complete through the mercies of the Father, the hidden mystery. Through it (the Gospel), Jesus Christ enlightened those who were in darkness through forgetfulness. He enlightened them; he showed them a Way, and the Way is the Truth which he taught them.

    As a result, Error was angry. It pursued him. It was threatened by him and brought to nothing. They nailed him (Jesus) to a tree, and he became the fruit of the Father’s knowledge. However, it (the fruit) didn’t cause destruction when it was eaten, but those who ate it were given joy in the discovery. He discovered them in himself and they discovered him in themselves.

    As for the uncontainable, inconceivable one – the Father, the complete one who made all – all are within him, and all need him. Although he kept their completion within himself which he didn’t give to all, the Father wasn’t jealous. Indeed, what jealousy is there between him and his members? 19 For if, like this, the generation [received the completion,] they couldn’t have come […] the Father. He keeps their completion within himself, giving it to them to return to him with a unitary knowledge in completion. He’s the one who made all, and all are within him, and all need him.

    Like someone who’s unknown, he wants to be known and loved – because what did all need if not the knowledge of the Father?

    He became a guide, peaceful and leisurely. He came and spoke the Word as a teacher in places of learning. Those who were wise in their own estimation came up to him to test him, but he confounded them because they were vain. They hated him because they weren’t wise in Truth. After all of them, all the little children came too; theirs is the knowledge of the Father. When they were strengthened, they received teaching about the Father’s expressions. They knew and they were known; they received glory and they gave glory. In their hearts the living Book of the Living was revealed, which was written in the thought and mind 20 [of the] Father, and before the [foundation] of all within his incomprehensibility. This (book) is impossible to take, since it permits the one who takes it to be killed. No one could’ve been revealed among those who''d been entrusted with salvation unless the book had appeared. Because of this, the merciful and faithful Jesus patiently suffered until he took that book,
    since he knows that his death is life for many.

    When a will hasn’t yet been opened, the wealth of the deceased master of the house is hidden; so too all were hidden while the Father of all was invisible. They were from him, from whom every realm comes. Because of this:

    Jesus was revealed,

    put on that book,

    was nailed to a tree,

    and published the Father’s edict on the cross.

    Oh, what a great teaching!

    Drawing himself down to death,

    he clothed himself in eternal life,

    stripped himself of the perishable rags,

    and clothed himself in incorruptibility,

    which no one can take from him.

    When he entered the empty realms of terror, he passed through those who were stripped by forgetfulness, being knowledge and completion, proclaiming the things that are in the heart 21 […] teach those who will [receive teaching].'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/003.yaml
  text: 'The Father—the one who cannot be contained—is the one who kept the All within himself[a], and the All is within him, and all have need of him. He kept their wholeness within himself; he was not jealous, for what jealousy could there be between him and his members? If, in this way, the All had already received it, they could not have come to him. He keeps it for them within himself, to give it to them so that they may return to him with a single knowledge in rest, in one body.


    Like one who is unknown, he desires to be known and to be loved—for what did all need except the Father’s knowledge? He became a guide—peaceful and unhurried. He came into the places of learning and spoke the Word as a teacher. Those who were wise in their own hearts came up to test him; yet he confounded them, for they were vain. They hated him because they were not wise in the Truth. After them the little children came also—theirs is the Father’s knowledge. When they were strengthened, they received instruction about the Father’s expressions. They knew, and they were known. They received glory and gave glory. In their heart the Living Book of the Living was revealed, written in the thought and in the mind of the Father, and before the foundation of all, within his incomprehensibility—a book that no one has the power to take, since it is appointed for the one who takes it to be killed. It is impossible that anyone be manifested among those entrusted with salvation unless that book should
    appear.


    Because of this, the merciful and faithful Jesus endured patiently until he took that book, for he knows that his death is life for many. As long as a testament has not been opened, the wealth of the deceased master of the house is hidden; so also, while the Father of the All was invisible, all things were hidden, for they are from him, from whom every realm comes. Because of this, Jesus was manifested; he put on that book; he was nailed to a tree; he published the Father’s decree on the cross.


    O the great teaching! He drew himself down to death; he clothed himself in eternal life; he stripped off the perishable rags; he put on incorruptibility, which no one can take from him. When he entered the empty places of dread, he passed by those who had been stripped by forgetfulness—being knowledge and completion—proclaiming what is in the heart to those who are ready to receive instruction.'
translation:
  language: ru
  text: 'Отец удерживал Всё[a] в Себе; Всё пребывает в Нём, и всё нуждается в Нём. Он хранил их полноту в Себе и не ревновал: ведь какая ревность может быть между Ним и Его членами? Если бы Всё уже получило её, оно не смогло бы прийти к Нему. Он хранит её для них в Себе, чтобы дать им её, дабы они вернулись к Нему с единым знанием в полноте.


    Подобно тому, кто остаётся неизвестным, Он желает, чтобы Его познали и полюбили, — ведь в чём нуждались все, если не в знании Отца? Он стал проводником — спокойным и неторопливым. Он пришёл в места учения и произнёс Слово как учитель. Те, кто считал себя мудрыми в собственных сердцах, пришли испытать Его, но Он посрамил их, потому что они были пусты. Они возненавидели Его, потому что не были мудры в Истине.


    После них пришли и малые дети — те, кому принадлежит знание Отца. Укрепившись, они приняли наставление об Отце. Они познали — и были познаны; приняли славу — и воздали славу. В их сердце открылась живая Книга живых, написанная в мысли и разуме Отца ещё до основания Всего, в Его непостижимости. Никто не в силах взять эту Книгу, ибо тому, кто возьмёт её, назначено быть убитым[b]. Никто из тех, кому вверено спасение, не мог явиться, пока не явилась эта Книга.


    Поэтому милосердный и верный Иисус терпеливо переносил страдания, пока не взял эту Книгу, ибо Он знает, что Его смерть — жизнь для многих. Пока завещание[c] не открыто, богатство умершего хозяина дома остаётся сокрытым. Так и всё оставалось сокрытым, пока Отец Всего был невидим. Всё произошло от Него, от Того, от Кого исходит всякая область.


    Поэтому Иисус явился, облёкся в эту Книгу, был пригвождён к дереву и обнародовал на кресте постановление Отца.


    О, сколь велико это учение! Он низвёл Себя до смерти, но облёкся в вечную жизнь; снял с Себя тленные лохмотья и облёкся в нетление, которого никто не может у Него отнять. Войдя в пустые области ужаса, Он прошёл среди тех, кого забвение оставило нагими. Сам будучи знанием и полнотой, Он возвещал то, что в сердце, тем, кто готов принять наставление[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Всё» — здесь совокупность всего сущего, мыслимая как единое целое; это не только видимая вселенная.
    reason: Техническое и намеренно широкое употребление ⲡⲧⲏⲣϥ может быть непонятно без пояснения.
  - marker: b
    text: 'Возможна также передача: «ибо взявшему её предназначено быть преданным смерти». В исходной конструкции не назван тот, кто убивает.'
    reason: Сохраняется грамматическая неоднозначность пассивной формулировки и её связь со смертью Иисуса.
  - marker: c
    text: Греческое заимствование ⲇⲓⲁⲑⲏⲕⲏ может означать также «завет», но здесь образ смерти хозяина и его имущества указывает прежде всего на завещание.
    reason: Необходимо обозначить семантический диапазон слова, не подменяя юридическую метафору конфессиональным толкованием.
  - marker: d
    text: В предоставленном фрагменте заключительная фраза обрывается; её окончание передано по приведённому контекстуальному чтению.
    reason: Данные задания не позволяют установить полный синтаксис продолжения непосредственно по данному коптскому отрывку.
lexical_decisions:
- source_word: ⲡⲧⲏⲣϥ
  choice: Всё
  rationale: Передаёт субстантивированную совокупность всего сущего и сохраняет технический метафизический оттенок, не сводя выражение к «вселенной».
- source_word: ⲥⲁⲩⲛⲉ
  choice: знание / познание
  rationale: Доступная русская передача ключевого понятия трактата; в глагольном параллелизме естественно употреблено «познали».
- source_word: ⲥⲧⲟⲩⲱⲣⲁⲩ
  choice: покой
  rationale: Сохраняет повторяющийся в трактате образ спасительного покоя без излишне архаичного «упокоения».
- source_word: ϫⲱⲕ
  choice: полнота
  rationale: В данном контексте обозначает завершённость или полноту; перевод «тело» чрезмерно конкретизировал бы смысл.
- source_word: ⲙⲣⲣⲓⲧ
  choice: полюбили
  rationale: Прямая и естественная передача глагола любви.
- source_word: ⲥⲟⲩⲱⲛ
  choice: познать
  rationale: 'Сохраняет центральный для текста взаимный оборот: «они познали — и были познаны».'
- source_word: ⲡⲓϫⲱⲱⲙⲉ
  choice: Книга
  rationale: Сохраняет развёрнутый образ живой книги и позволяет естественно продолжить метафору её открытия и принятия.
- source_word: ⲙⲉⲉⲩⲉ
  choice: мысль
  rationale: Сохраняет параллель с заимствованным ⲛⲟⲩⲥ — «разум».
- source_word: ⲛⲟⲩⲥ
  choice: разум
  rationale: Передаёт греческое νοῦς в современном русском философско-религиозном регистре.
- source_word: ⲇⲓⲁⲑⲏⲕⲏ
  choice: завещание
  rationale: Юридический образ связан со смертью домовладельца и сокрытым наследственным имуществом; «завет» здесь мог бы преждевременно придать слову иной библейско-конфессиональный смысл.
- source_word: ⲇⲓⲁⲧⲁⲅⲙⲁ
  choice: постановление
  rationale: Передаёт административно-правовой смысл отцовского распоряжения, которое Иисус обнародует.
- source_word: ⲧⲉⲕⲟ / ⲙⲛⲧⲁⲧⲧⲉⲕⲟ
  choice: тленный / нетление
  rationale: Сохраняет антитезу уничтожимого и неуничтожимого в естественной русской религиозной лексике.
theological_decisions:
- issue: Метафизическое значение ⲡⲧⲏⲣϥ
  choice: Всё
  alternative: вся полнота сущего; совокупность всего
  rationale: Краткая субстантивированная форма сохраняет намеренную абстрактность и не отождествляет понятие исключительно с физической вселенной.
- issue: Образ полноты, удерживаемой Отцом
  choice: Отец хранит полноту для всех и даёт её при их возвращении
  alternative: все изначально уже обладают полнотой
  rationale: Текст удерживает напряжение между пребыванием Всего в Отце и его нуждой получить от Него полноту; перевод не устраняет это напряжение.
- issue: Фраза о взявшем Книгу
  choice: тому, кто возьмёт её, назначено быть убитым
  alternative: Книга позволяет убить того, кто её берёт
  rationale: Пассивная конструкция и причинная связь с последующими страданиями Иисуса сохранены без уточнения неназванного деятеля.
- issue: Юридический образ ⲇⲓⲁⲑⲏⲕⲏ
  choice: завещание
  alternative: завет
  rationale: Непосредственный контекст смерти хозяина и сокрытого богатства требует наследственно-правового смысла, хотя греческое слово допускает более широкий диапазон.
- issue: Дерево и крест
  choice: пригвождён к дереву; обнародовал постановление на кресте
  alternative: оба раза «крест» либо оба раза «дерево»
  rationale: Различение сохраняет два образа исходного текста и его игру между орудием казни и публичным постановлением.
- issue: Смерть Иисуса и жизнь многих
  choice: Его смерть — жизнь для многих
  alternative: Его смерть приносит жизнь многим
  rationale: Именная формула сохраняет сильное парадоксальное отождествление исходного текста, не объясняя механизм спасения.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианской проповеди; синтаксис умеренно торжественный, но без церковнославянизмов. Заглавные буквы в «Всё», «Книга», «Слово», «Истина» отражают персонифицированные или технически нагруженные образы данного отрывка, а не навязывают позднейшую догматическую систему. Парадоксальные образы — пребывание Всего в Отце при одновременной нужде в полноте, облечение в Книгу, смерть как жизнь — оставлены без сглаживания.
