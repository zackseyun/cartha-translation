revisions:
- from: 'Отец — Тот, Кого невозможно вместить, — удерживал Всё в Себе[a]. Всё пребывает в Нём, и все нуждаются в Нём. Он удерживал их полноту в Себе и не ревновал: ведь какая ревность может быть между Ним и Его членами? Если бы Всё уже получило полноту, оно не смогло бы прийти к Нему. Он хранит её для них в Себе, чтобы дать им её и привести их обратно к Себе — к единому знанию, к покою и полноте.


    Подобно тому, кто остаётся неизвестным, Он желает, чтобы Его познали и полюбили, — ведь в чём нуждались все, если не в знании Отца? Он стал проводником — спокойным и неторопливым. Он пришёл в места учения и произнёс Слово как учитель. Те, кто был мудр в собственном сердце, пришли испытать Его, но Он посрамил их, потому что они были пусты. Они возненавидели Его, потому что не были мудры в Истине.


    После них пришли и малые дети — те, кому принадлежит знание Отца. Укрепившись, они приняли наставление о проявлениях Отца. Они познали — и были познаны; приняли славу — и воздали славу. В их сердце открылась живая Книга живых, написанная в мысли и разуме Отца ещё до основания Всего, в Его непостижимости. Никто не в силах взять эту Книгу, ибо тому, кто возьмёт её, назначено быть убитым[b]. Никто из тех, кому вверено спасение, не мог явиться, пока не явилась эта Книга.


    Поэтому милосердный и верный Иисус терпеливо переносил страдания, пока не взял эту Книгу, ибо Он знает, что Его смерть — жизнь для многих. Пока завещание[c] не открыто, богатство умершего хозяина дома остаётся сокрытым. Так и всё оставалось сокрытым, пока Отец Всего был невидим. Всё произошло от Него, от Того, от Кого исходит всякая область.


    Поэтому Иисус явился, облёкся в эту Книгу, был пригвождён к дереву и обнародовал на кресте постановление Отца.


    О, сколь велико это учение! Он низвёл Себя до смерти, но облёкся в вечную жизнь; снял с Себя тленные лохмотья и облёкся в нетление, которого никто не может у Него отнять. Войдя в пустые области ужаса, Он прошёл среди тех, кого забвение оставило нагими. Сам будучи знанием и полнотой, Он возвещал сокровенное в сердце тем, кто готов принять наставление[d].'
  to: 'Отец удерживал Всё[a] в Себе; Всё пребывает в Нём, и всё нуждается в Нём. Он хранил их полноту в Себе и не ревновал: ведь какая ревность может быть между Ним и Его членами? Если бы Всё уже получило её, оно не смогло бы прийти к Нему. Он хранит её для них в Себе, чтобы дать им её, дабы они вернулись к Нему с единым знанием в полноте.


    Подобно тому, кто остаётся неизвестным, Он желает, чтобы Его познали и полюбили, — ведь в чём нуждались все, если не в знании Отца? Он стал проводником — спокойным и неторопливым. Он пришёл в места учения и произнёс Слово как учитель. Те, кто считал себя мудрыми в собственных сердцах, пришли испытать Его, но Он посрамил их, потому что они были пусты. Они возненавидели Его, потому что не были мудры в Истине.


    После них пришли и малые дети — те, кому принадлежит знание Отца. Укрепившись, они приняли наставление об Отце. Они познали — и были познаны; приняли славу — и воздали славу. В их сердце открылась живая Книга живых, написанная в мысли и разуме Отца ещё до основания Всего, в Его непостижимости. Никто не в силах взять эту Книгу, ибо тому, кто возьмёт её, назначено быть убитым[b]. Никто из тех, кому вверено спасение, не мог явиться, пока не явилась эта Книга.


    Поэтому милосердный и верный Иисус терпеливо переносил страдания, пока не взял эту Книгу, ибо Он знает, что Его смерть — жизнь для многих. Пока завещание[c] не открыто, богатство умершего хозяина дома остаётся сокрытым. Так и всё оставалось сокрытым, пока Отец Всего был невидим. Всё произошло от Него, от Того, от Кого исходит всякая область.


    Поэтому Иисус явился, облёкся в эту Книгу, был пригвождён к дереву и обнародовал на кресте постановление Отца.


    О, сколь велико это учение! Он низвёл Себя до смерти, но облёкся в вечную жизнь; снял с Себя тленные лохмотья и облёкся в нетление, которого никто не может у Него отнять. Войдя в пустые области ужаса, Он прошёл среди тех, кого забвение оставило нагими. Сам будучи знанием и полнотой, Он возвещал то, что в сердце, тем, кто готов принять наставление[d].'
