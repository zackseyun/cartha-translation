  rationale: После слов о любимых детях в предоставленном распознавании следует огромная последовательность декоративных знаков, а затем крайне сомнительный текст. Он не образует надёжно засвидетельствованного непрерывного окончания «Евангелия истины» и, вероятно, является артефактом OCR или захватом постороннего материала. Источник недостаточен для публикации этого абзаца как подлинного текста.
