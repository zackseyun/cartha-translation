  revised_text: "Над всеми архонтами он поставил архонта, которым никто не повелевает. Он — господин их всех, а именно лицо, которое Слово создало своей мыслью как подобие Отца Всецелого.[a] Поэтому он украшен всяким <именем>, подобным ему, ибо обладает всеми качествами и славными свойствами. Потому его и называют «Отцом», «Богом», «Демиургом», «Царём», «Судьёй», «Местом», «Обителью» и «Законом». Слово пользуется им как рукой, чтобы приводить в порядок то, что внизу, и как устами, чтобы возвещать то, что должно быть предсказано. Он говорил и устраивал; увидев же, что (его дела) велики, хороши и дивны, он возликовал и возрадовался, словно [] в своих мыслях сам изрёк и совершил их, не ведая, что движение в нём исходит от Духа, который направляет его согласно предопределению делать всё, чего ему случается пожелать.\n\n\n      Говоря о том, что произошло от него, он сделал так, что всё это возникло по подобию духовных мест, о которых мы прежде упоминали, рассуждая об образах. Он <делал> больше,\
    \ чем просто трудился: поскольку его поставили отцом его замысла спасения, он порождал не только через самого себя и семена, но также [через] избранного Духа, который сойдёт [через него] в нижние области. Он делает [больше], чем просто произносит собственные духовные слова, <но> делает это сокровенно — через Духа, который взывает и порождает то, что превосходит его собственную природу.[b] Поскольку по своей природе он является Богом и Отцом и носит все прочие почётные наименования, он решил, что они принадлежат ему по собственной природе.\n\n\n      Для послушных ему он основал покой, а для непослушных <также установил> наказания. С ним пребывают рай и царство, а также всё прочее, пребывающее в эоне, который предшествовал ему. Они ценнее копий благодаря своей связи с мыслью. Эта связь подобна [] тени и одеянию, ибо он не способен видеть, каким образом всё существующее существует в действительности.\n\n\n      Он поставил работников и слуг помогать ему в том, что он будет делать и говорить,\
    \ ибо всюду, где он действовал, он оставлял своё лицо с его прекрасным именем, производя и произнося всё, что созерцает. Из собственной сущности [он] установил на своём месте видимые образы света и [те] (невидимые) духовные [места]. Так всякое место повсюду было украшено им, отражая образ того, кто их поместил, и таким образом они были утверждены. Хотя райские обители, царства, места покоя, обещания и множества слуг, исполняющих его волю, — властвующие господа, они поставлены ниже господина, который их назначил.\n\n\n      Выслушав его таким образом, он поставил светила, <составляющие> источник <мироустройства>, над устройством нижних областей.[c] Так невидимый Дух побуждал его, чтобы он [] склонился к управлению через собственного слугу, которым также пользовался как рукой, как <устами> и даже как своим лицом. Он установил порядок, угрозы и страх, чтобы действовавшие по неведению […] могли сохранять [отведённое им] место, ибо они прикованы к своим местам [цепями] стоящих над ними архонтов.\n\
    \n\n      Вся природа материи [разделена] на три разряда. Духовное Слово произвело [первые] силы из воображения и гордыни и поставило их первыми по духовному чину. Те [силы], которые они породили из властолюбия, оно поставило в средний [чин], потому что они [следовательно] <стали> властолюбивыми силами, чтобы господствовать и силой отдавать принудительные повеления устроению, находящемуся ниже них. Тех же, кто возник из зависти, ревности и всякого иного порождения подобных склонностей, оно поставило в рабский чин — управлять крайними пределами и повелевать всем существующим и всяким рождением. От них происходят [существа], несущие болезни, которые внезапно убивают, и стремящиеся порождать, хотя в месте, откуда они произошли и куда снова возвратятся, они были ничем. Поэтому он поставил над ними властные силы, непрестанно воздействующие на материю, чтобы [] потомство существующих также непрестанно существовало, ибо в этом их слава."
