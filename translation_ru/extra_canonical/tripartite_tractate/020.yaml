translation:
  language: ru
  text: 'Над всеми архонтами он поставил архонта, которым никто не повелевает. Он — господин их всех, а именно образ, который Слово создало своей мыслью как подобие Отца Всецелого.[a] Поэтому он украшен всяким <именем>, уподобляющим его Отцу, ибо обладает всеми качествами и славными свойствами. Потому его и называют «Отцом», «Богом», «Демиургом», «Царём», «Судьёй», «Местом», «Обителью» и «Законом». Слово пользуется им как рукой, чтобы устроить творение нижних областей, и как устами, чтобы возвещать то, чему надлежит быть предсказанным. Он говорил и всё устраивал; увидев же, что [его дела] велики, хороши и дивны, он возликовал и возрадовался, словно [] сам задумал, изрёк и совершил их, не ведая, что движение в нём исходит от Духа, который направляет его согласно предопределению, так что тот делает всё, чего ему случается пожелать.


    Он говорил о том, что произошло от него, и всё это возникало по подобию духовных мест, о которых мы прежде упоминали, рассуждая об образах. Он <не только> трудился: поскольку его поставили отцом его замысла спасения, он порождал не только через самого себя и семена, но также [через] избранного Духа, который сойдёт [через него] в нижние области. Он <не только> произносит собственные духовные слова, <но> делает это сокровенно — через Духа, который взывает и порождает то, что превосходит его собственную природу.[b] Поскольку по своей природе он является Богом и Отцом и носит все прочие почётные наименования, он решил, что они принадлежат ему по собственной природе.


    Для послушных ему он основал покой, а для непослушных <также установил> наказания. С ним пребывают рай и царство, а также всё прочее, пребывающее в эоне, который существовал прежде него. Они ценнее своих копий благодаря связи с мыслью. Эта связь подобна [] тени и одеянию, ибо он не способен видеть, каким образом всё существующее существует в действительности.


    Он поставил работников и слуг помогать ему в том, что он будет делать и говорить, ибо всюду, где он действовал, он оставлял свой образ с его прекрасным именем, создавая и произнося всё, что созерцал. Из собственной сущности [он] установил на своём месте видимые образы света и [невидимые] духовные [места]. Так всякое место повсюду было украшено им, отражая образ того, кто их разместил, и таким образом они были утверждены. Хотя райские обители, царства, места покоя, обещания и множества слуг, исполняющих его волю, — властвующие господа, они поставлены ниже господина, который их назначил.


    Выслушав его таким образом, он поставил светила, <составляющие> начало <мироустройства>, над устройством нижних областей.[c] Так невидимый Дух побуждал его, чтобы он [] склонился к управлению через собственного слугу, которым также пользовался как рукой, как <устами> и даже как своим образом. Он установил порядок, угрозы и страх, чтобы действовавшие по неведению […] могли удерживать [отведённое им] место, ибо они прикованы к своим местам [цепями] стоящих над ними архонтов.


    Вся природа материи [разделена] на три разряда. Первые силы духовное Слово произвело из воображения и гордыни и поставило их первыми по духовному чину. Те [силы], которые первые породили из властолюбия, оно поставило в средний [чин], потому что они <стали> властолюбивыми силами, чтобы господствовать и силой отдавать принудительные повеления устроению, находящемуся ниже них. Тех же, кто возник из зависти, ревности и всякого иного порождения подобных склонностей, оно поставило в рабский чин — управлять крайними пределами и повелевать всем существующим и всяким рождением. От них происходят [существа], несущие болезни, которые внезапно убивают, и стремящиеся порождать, хотя в месте, откуда они произошли и куда снова возвратятся, они были ничем. Поэтому он поставил над ними властные силы, непрестанно воздействующие на материю, чтобы [] потомство существующих также непрестанно существовало, ибо в этом их слава.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Отец Всецелого» — буквальное обозначение Отца всей полноты существующего; термин имеет специальный смысл в космологии трактата.
    reason: Пояснение непривычного технического выражения без его догматического переопределения.
  - marker: b
    text: Неясно, чья именно «собственная природа» имеется в виду — действующего через Духа или самого Духа.
    reason: Сохранение подлинной местоименной неоднозначности свидетеля.
  - marker: c
    text: В этом предложении неясно, к кому относятся местоимения «его» и «он»; перевод сохраняет эту неопределённость.
    reason: Предотвращает молчаливое отождествление действующего лица со Словом, Демиургом или Духом.
lexical_decisions:
- source_word: archon
  choice: архонт
  rationale: Сохранён принятый русский термин для космологических правителей в гностических текстах; перевод «властитель» стёр бы специальное значение.
- source_word: the Word
  choice: Слово
  rationale: Передаёт персонифицированный богословский термин и сохраняет его отличие от обычной речи.
- source_word: Father of the Totalities
  choice: Отец Всецелого
  rationale: «Всецелое» сохраняет техническую идею совокупной полноты и не подменяет её более конфессионально нагруженным термином.
- source_word: Demiurge
  choice: Демиург
  rationale: Сохранён общеупотребительный термин данной космологии без добавления оценочного толкования.
- source_word: repose
  choice: покой / место покоя
  rationale: Выбор передаёт состояние и область упокоения; по контексту использованы обе естественные русские формы.
- source_word: aeon
  choice: эон
  rationale: Сохранён технический космологический термин, а не сведён к одному значению «век».
- source_word: system
  choice: мироустройство
  rationale: В контексте обозначает упорядоченную космическую систему; «мироустройство» естественнее буквального «система».
- source_word: powers
  choice: силы
  rationale: Сохраняет неоднозначность между способностями и личностными космическими силами.
theological_decisions:
- issue: Отношение Демиурга к высшему Духу
  choice: Сохранено, что Демиург действует в неведении, будучи направляем Духом согласно предопределению.
  alternative: Истолковать его либо как полностью самостоятельного злого творца, либо как сознательно послушного служителя.
  rationale: Свидетельство удерживает напряжение между реальной деятельностью Демиурга, его неведением и скрытым водительством Духа.
- issue: Божественные титулы Демиурга
  choice: Титулы переданы прямо и без оговорок, а ошибочное присвоение обозначено последующим утверждением текста.
  alternative: Заключить титулы в отчуждающие кавычки или назвать их ложными в самом перечне.
  rationale: Источник сначала приписывает титулы, а затем объясняет его ошибочное понимание их происхождения; перевод не должен заранее разрешать это напряжение.
- issue: Превосхождение собственной природы в порождении
  choice: Сохранено неоднозначное местоимение «его собственной природы».
  alternative: Явно отнести природу к Демиургу либо к Духу.
  rationale: На основании данного свидетеля референт не вполне ясен; уточнение было бы интерпретацией.
- issue: Смена субъектов в разделе о светилах и слуге
  choice: Неоднозначные местоимения «он/его» сохранены.
  alternative: Подставить «Слово», «Демиург» или «Дух» в каждом случае.
  rationale: Текстуальная основа содержит неясные переходы между субъектами, которые нельзя уверенно устранить без коптского анализа.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным регистром. Технические термины «архонт», «Демиург» и «эон» сохранены. Угловые скобки отмечают редакционные восстановления, квадратные — лакуны или дополнения свидетеля; многоточие в квадратных скобках сохранено. Черновик основан на предоставленном англоязычном публичном свидетеле; прямая сверка с коптским оригиналом ещё требуется.
