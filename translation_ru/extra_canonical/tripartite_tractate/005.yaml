    Тот, кого Он возвысил, чтобы тот стал светом для произошедших от Него, тот, от кого они получают своё имя, — это полный, всецелый и совершенный Сын. Он произвёл Его соединённым с тем, что вышло из Него, [] […] причастным славе […] Целокупности, сообразной с […], благодаря которой каждый [может] принять это в себя, хотя прежде, чем они были приняты ею, никто из них не обладал таким величием. Они же существуют лишь частично в Его собственном способе бытия, облике и величии. [Они] могут видеть Его и говорить о [том, что] знают о Нём, потому что носят друг друга[d], потому что способны постичь [Его]. Его же способ бытия, напротив, ни с чем не сравним, так что Отец мог принимать честь от каждого и открывать Себя, несмотря на Свою несравненность. Сокрытый и невидимый, Он вызывает у них мысленное изумление. Поэтому величие Его возвышенности обнаруживается, когда они говорят о Нём и созерцают Его, воспевая Его за богатство Его сладости[e].'
