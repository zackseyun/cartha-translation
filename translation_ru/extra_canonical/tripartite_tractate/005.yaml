base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/005.yaml
  text: 'The Father brought forth the All like a small child, like a drop from a spring, like a blossom from [a vine], like [a flower], like a <planting> [. . .], so that it needed to obtain [nourishment] and growth and perfection. He held it back for a season. The one who conceived of it from the first instant of the beginning possessed and beheld it from the first instant of the beginning, but he <concealed> it for those who were the first to originate from him. Not from envy, but that the aeons could not receive their perfection (prematurely) from the first instant of the beginning and could not lift up themselves to the glory (that belongs solely to) the Father, and could not suppose that they possess all this from themselves. Instead, just as he willed to allow them to be able to come into being, so that they could also come into being as perfect entities, at the time of his choosing he granted them the perfect idea of generosity toward them.


    The one he raised up to be a light to those who originated from himself, the one from whom they derive their name, he is the full, complete and perfect Son. He produced him mixed with what emerged out of him, [] [. . .] sharing in the glory [. . .] the Totality, congruent with [. . .], by means of which each is [able] to receive it to [himself], although each did not have this greatness before they were received by it. They, instead, exist only partially in his proper mode and form and greatness. [They] are able to see him and speak of [what they] know about him, because they wear each other, because they are able to grasp [him]. By contrast, [his] mode of being is without comparison, so that the Father could receive honor from each one and could reveal himself, despite his incomparability. Concealed and unseen, they wonder at him in mind. The greatness of his exaltedness is consequently manifested when they speak of him and behold him, hymning him for the riches of his sweetness.'
translation:
  language: ru
  text: 'Отец произвёл Всё[a], подобное малому ребёнку, капле из источника, побегу [виноградной лозы], [цветку], <насаждению> […], так что ему надлежало обрести [питание], рост и совершенство. На некоторое время Он удержал его. Тот, кто замыслил его с самого первого мгновения начала, с самого первого мгновения начала обладал им и созерцал его, но <скрыл> его от тех, кто первым произошёл от Него. Не из зависти, но потому, что эоны[b] не могли с самого первого мгновения начала получить своё совершенство (преждевременно), не могли вознести себя до славы, (принадлежащей одному лишь) Отцу, и не могли подумать, будто обладают всем этим сами от себя. Напротив, как Он пожелал дать им возможность возникнуть, чтобы они могли также стать совершенными сущностями, так в избранное Им время Он даровал им совершенное знание[c] о Своей щедрости к ним.


    Тот, кого Он возвысил, чтобы тот стал светом для произошедших от Него, тот, от кого они получают своё имя, — это полный, всецелый и совершенный Сын. Он произвёл Его соединённым с тем, что вышло из Него, [] […] причастным славе […] Всё, сообразное с […], посредством чего каждый [может] принять это в себя, хотя прежде, чем они были приняты этим, никто из них не обладал таким величием. Сами же они существуют лишь отчасти в свойственных Ему образе бытия, облике и величии. [Они] могут видеть Его и говорить о [том, что] знают о Нём, потому что облекаются друг в друга[d], потому что способны постичь [Его]. Его же образ бытия, напротив, ни с чем не сравним, так что Отец может принять честь от каждого и открыть Себя, несмотря на Свою несравненность. Сокрытым и невидимым они дивятся Ему в своём уме. Поэтому величие Его возвышенности обнаруживается, когда они говорят о Нём и созерцают Его, воспевая Его за богатство Его сладости[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Всё» — терминологическое обозначение всеобщей полноты или совокупности; точный объём понятия здесь не вполне ясен.
    reason: Предотвращает ошибочное понимание как обычного местоимения и сохраняет смысловую открытость.
  - marker: b
    text: Эоны — возникшие от Отца вечные сущности или области бытия в понятийном языке трактата; слово также может иметь временной оттенок.
    reason: Технический термин незнаком многим современным читателям и не имеет одного бесспорного русского эквивалента.
  - marker: c
    text: Буквально свидетель допускает перевод «совершенное представление» или «совершенную мысль» о щедрости.
    reason: Отмечает лексическую неопределённость посредующего английского свидетельства.
  - marker: d
    text: 'Необычное выражение источника; возможно также: «носят друг друга». Его точный смысл неясен.'
    reason: Сохраняет трудность повреждённого или концептуально насыщенного места, не навязывая толкования.
  - marker: e
    text: То есть за изобильную сладость, благость и желанность того, что исходит от Него; метафора сохранена.
    reason: Поясняет непривычную для современного русского богословского стиля метафору без её замены.
lexical_decisions:
- source_word: the All / the Totality
  choice: Всё
  rationale: Сохраняет субстантивированное обозначение совокупной полноты и не сводит его заранее ни к миру, ни к отдельному техническому термину; прописная буква отмечает терминологическое употребление.
- source_word: aeons
  choice: эоны
  rationale: Транслитерация сохраняет специфический понятийный язык трактата и избегает неточного сведения к векам или периодам времени.
- source_word: produced / brought forth
  choice: произвёл
  rationale: Передаёт каузативное происхождение без добавления оттенка физического рождения; повтор сохранён там, где свидетель употребляет тот же глагол.
- source_word: perfect idea
  choice: совершенное знание
  rationale: В данном контексте речь, вероятно, о сообщённом постижении или представлении; «знание» естественнее по-русски, но неопределённость отмечена сноской.
- source_word: mode of being
  choice: образ бытия
  rationale: Выражает онтологический смысл и остаётся понятным современному читателю.
- source_word: sweetness
  choice: сладость
  rationale: Сохранена образность и характерный для текста язык благости, без рационализирующей замены на «доброту» или «благость».
theological_decisions:
- issue: Статус «Всего» как личности, совокупности или полноты
  choice: Субстантивированное «Всё» с грамматическим средним родом
  alternative: «Всеединство», «Полнота» или «совокупность всего»
  rationale: Свидетель допускает терминологическую многозначность; перевод не отождествляет «Всё» заранее с конкретной системой эманаций.
- issue: Причина отсрочки совершенства эонов
  choice: Сохранена синтаксическая связь с невозможностью преждевременного совершенства, присвоения славы Отца и самомнения
  alternative: Истолковать отсрочку как наказание или испытание
  rationale: Текст прямо отвергает зависть и объясняет задержку педагогически, но не называет её наказанием.
- issue: Отношение Сына к произошедшему от Отца
  choice: «соединённым с тем, что вышло из Него»
  alternative: «смешанным»
  rationale: «Соединённым» избегает нежелательной материальной окраски, однако не устраняет идею сопричастности; буквальная возможность указана в сноске.
- issue: Неясное «they wear each other»
  choice: «облекаются друг в друга»
  alternative: «носят друг друга»
  rationale: Сохранена необычная взаимная образность без попытки догматически объяснить её как взаимопроникновение или тождество.
translation_notes:
  register: 'Современный литературный русский с достоинством трактатного и гимнического стиля. Прописные местоимения при именовании Отца и Сына применены для ясности референции. Квадратные скобки, пустые скобки, многоточия и угловые скобки сохранены как редакционные сигналы. Перевод предварительный: выполнен по предоставленному публичному английскому свидетельству; требуется сверка с коптским текстом NHC I,5.'
