base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/016.yaml
  text: 'When the deficient Word became enlightened, his Fullness came into being. He escaped from those who had troubled him at first. He disentangled himself from them. He stripped off that prideful thought. When those who had at first disobeyed him prostrated and humbled themselves before him, he became mingled with the Repose.


    And <he> rejoiced because of the visitation of his visiting brothers. He glorified and praised those who had shown themselves to be a help to him. He gave thanks for escaping from those who had rebelled against him, and he esteemed and honored the Greatness and those who were determined to reveal themselves to him. He generated living images of the living figures. They are pleasing and good because they come from living things and resemble them in beauty, yet they are not equal to them in truth, because they do not come from a unification between him who produced them [] and the one who revealed himself to him. Even so, he works in wisdom and knowledge, completely mingling the Word with himself. Therefore, those produced from him are great, just as He Who Is is truly great.


    After he marveled at the beauty of those <who> had appeared to him, he declared his gratitude for this visitation. The Word carried out this work with the help of those who aided him, because of the firmness of those who had come into being through him, so that they could obtain something good. For he remembered to pray for the plan of salvation for all those whom he had produced, which was made firm in order to establish them.


    Therefore, those whom he purposefully produced are on chariots, like those who came into being, those who appeared so that they could pass through every place of what is below, so that each of them could be granted the place appropriate to his nature.


    This is destructive for those of the likeness, but beneficial for those of the memory—a revelation of those from the decision of the aeons, which was a unity and a mercy—whereas they are only seeds that have not yet reached full existence.


    The one who appeared was a face of the Father and of the harmony. He was a garment of all graces and food for those whom the Word produced while praying, glorifying, and praising. This is the one he glorified and praised [] while gazing at those whom he beseeched, so that he could perfect them with the images he had produced.


    The Word increased their mutual assistance and their hope in the promise, because they possess joy, a wealth of repose, and unsullied delights. Bestowing perfection with vision as the goal, he generated those whom he had remembered at first, when they were not yet with him. He remains in hope and faith in the perfect Father, as do the Totalities. It is revealed to him before he intermingles with it, so that those who have come into being would not perish by gazing upon the light, since they are unable to bear the great, lofty stature.'
translation:
  language: ru
  text: 'Когда ущербный Слово был просвещён, возникла его Полнота. Он избавился от тех, кто поначалу причинял ему смятение. Он освободился от них и совлёк с себя эту горделивую мысль. Когда те, кто поначалу не повиновался ему, пали ниц и смирились перед ним, он соединился с Покоем.


    И <он>[a] возрадовался посещению пришедших к нему братьев. Он прославил и восхвалил тех, кто, как оказалось, помогал ему. Он возблагодарил за избавление от восставших против него, высоко почтил Величие и тех, кто решился явить себя ему. Он породил живые образы живых прообразов. Они прекрасны и благостны, потому что происходят от живого и подобны ему красотой, но не равны ему в истинности, ибо возникли не из единения породившего их [] с тем, кто явил себя ему.[b] И всё же он действует в мудрости и знании, всецело соединяя Слово с собой. Поэтому рождённые от него велики, как истинно велик Тот, Кто Есть.


    Подивившись красоте тех, <кто>[c] явился ему, он выразил благодарность за это посещение. Слово совершило это дело с помощью тех, кто помогал ему, благодаря твёрдости возникших через него, чтобы они могли обрести некое благо. Ведь он вспомнил о том, что нужно молиться о замысле спасения для всех, кого он породил, — замысле, утверждённом для того, чтобы утвердить их.


    Поэтому те, кого он намеренно породил, находятся на колесницах, подобно тем, кто возник, — тем, кто явился, чтобы пройти через всякое место нижнего мира, дабы каждому было даровано место, соответствующее его природе.


    Это губительно для принадлежащих подобию, но благотворно для принадлежащих памяти: это откровение тех, кто происходит от решения эонов, которое было единством и милостью, тогда как сами они — лишь семена, ещё не достигшие полноты бытия.[d]


    Явившийся был ликом Отца и гармонии. Он был облачением всех даров благодати и пищей для тех, кого Слово породило, молясь, прославляя и восхваляя. Это тот, кого он прославлял и восхвалял [], взирая на тех, за кого молил, чтобы усовершить их посредством порождённых им образов.[e]


    Слово умножило их взаимную помощь и надежду на обещанное, ибо они обладают радостью, богатством покоя и незапятнанными наслаждениями. Даруя совершенство, цель которого — созерцание, он породил тех, о ком вспомнил вначале, когда их ещё не было с ним. Он, как и Всеобщности, пребывает в надежде и вере в совершенного Отца. Оно открывается ему прежде, чем он соединится с ним,[f] чтобы возникшие не погибли, взирая на свет, поскольку они не способны вынести столь великого и возвышенного величия.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Угловые скобки отмечают слово, восстановленное редактором; в рукописном тексте оно прямо не сохранилось.
    reason: Сохранение сигнала редакторского восполнения из источника.
  - marker: b
    text: Квадратные скобки отмечают повреждение или утрату текста. Поэтому синтаксическая связь и точный смысл фразы остаются не вполне ясными.
    reason: Сохранение лакуны и связанной с ней неопределённости.
  - marker: c
    text: Слово «кто» восстановлено редактором.
    reason: Сохранение угловых скобок исходного свидетельства.
  - marker: d
    text: Выражения «принадлежащие подобию», «принадлежащие памяти» и связь последующих частей предложения, вероятно, имеют специальный космологический смысл, который нельзя уверенно уточнить по доступному свидетельству.
    reason: Предупреждение о подлинной лексической и синтаксической неоднозначности.
  - marker: e
    text: В этом месте рукопись повреждена; не вполне ясно, к кому относятся отдельные местоимения и как связаны части предложения.
    reason: Сохранение сигнала лакуны и местоименной неоднозначности.
  - marker: f
    text: 'Референты местоимений «оно» и «ним» неясны: контекст допускает связь с совершенством, Отцом, светом или иной ранее названной реальностью.'
    reason: Предотвращение молчаливого разрешения богословски значимой неоднозначности.
lexical_decisions:
- source_word: Word
  choice: Слово
  rationale: Сохранён технический и персонифицированный смысл Логоса; мужской род местоимений отражает персонажную референцию источника, несмотря на средний грамматический род русского существительного.
- source_word: Fullness
  choice: Полнота
  rationale: Передаёт гностический технический термин без подмены более конфессионально нагруженным толкованием.
- source_word: Repose
  choice: Покой
  rationale: Сохранена персонификация посредством прописной буквы и основной смысл состояния покоя.
- source_word: living figures
  choice: живые прообразы
  rationale: «Прообразы» естественно противопоставляются порождённым «образам» и передают отношение подобия, не утверждая полного тождества.
- source_word: He Who Is
  choice: Тот, Кто Есть
  rationale: Сохраняет титульную формулу существования и её возвышенный регистр.
- source_word: aeons
  choice: эоны
  rationale: Сохранён историко-религиозный технический термин.
- source_word: Totalities
  choice: Всеобщности
  rationale: Прописная буква и абстрактное множественное число сохраняют космологически-технический характер обозначения.
- source_word: vision
  choice: созерцание
  rationale: В данном мистико-интеллектуальном контексте точнее простого физического «видения».
- source_word: what is below
  choice: нижний мир
  rationale: Естественная русская передача пространственно-космологического обозначения без отождествления с адом.
theological_decisions:
- issue: Грамматический род персонифицированного Слова
  choice: Сохранены мужские местоимения «он/ему»
  alternative: 'Согласовать со средним родом: «оно/ему»'
  rationale: Источник представляет Слово как действующее лицо мужской референции; полное русское грамматическое согласование могло бы затушевать эту особенность.
- issue: Статус Полноты, Покоя, Величия и Всеобщностей
  choice: Переданы с прописной буквы как технические или персонифицированные реалии
  alternative: Передать со строчной буквы как обычные абстрактные существительные
  rationale: Так сохраняется космологическая структура текста без догматического уточнения природы этих реалий.
- issue: Неясная классификация «подобия» и «памяти»
  choice: Буквально сохранены выражения «принадлежащие подобию» и «принадлежащие памяти»
  alternative: Истолковать их как конкретные духовные классы существ
  rationale: Контекст не позволяет уверенно разрешить техническую неоднозначность, поэтому она не устранена переводом.
- issue: Местоименная неоднозначность в заключении
  choice: Сохранено «Оно открывается ему… он соединится с ним» с примечанием
  alternative: 'Назвать референты прямо: например, «Отец открывается Слову»'
  rationale: Английское свидетельство не устанавливает референты однозначно; экспликация внесла бы богословское толкование.
- issue: «План спасения»
  choice: «замысел спасения»
  alternative: «домостроительство спасения»
  rationale: Современная и понятная формулировка сохраняет целенаправленность, не вводя позднейший конфессиональный термин.
translation_notes:
  register: Современный литературный русский с достоинством трактатного и мистико-философского регистра. Технические космологические обозначения сохранены, но синтаксис по возможности сделан доступным. Проект основан на предоставленном публично-доступном английском свидетельстве; прямая сверка с коптским текстом Nag Hammadi Codex I,5 ещё требуется. Квадратные и угловые скобки источника сохранены и разъяснены сносками.
