lexical_decisions:
- source_word: Word
  choice: Слово
  rationale: Сохранён персонифицированный технический термин с прописной буквы.
- source_word: Totalities
  choice: Всеобщности
  rationale: Передаёт множественное число и космологический характер термина, не отождествляя его автоматически со «всем сущим».
- source_word: Fullness
  choice: Полнота
  rationale: Сохранён традиционный и прозрачный эквивалент технического понятия, с прописной буквы.
- source_word: aeons
  choice: эоны
  rationale: Транслитерация сохраняет специальное космологическое значение и не сводит термин только к временным эпохам.
- source_word: beings of the memory
  choice: существа памяти
  rationale: Буквальная формулировка сохраняет неясность технического выражения свидетеля.
- source_word: adorned
  choice: привело в порядок / украсило
  rationale: В первом употреблении выбран естественный космогонический оборот «привело в порядок»; в последующих сохранено «украсило», чтобы передать повтор исходного глагола и композиционную структуру.
- source_word: conversion
  choice: обращение
  rationale: Сохраняет возможный смысл поворота или перемены без уточнения, идёт ли речь о покаянии, возвращении или ином обращении.
theological_decisions:
- issue: Неясные местоименные отсылки в первом абзаце
  choice: Сохранены местоимения «он», «того», «него» без подстановки именованных субъектов.
  alternative: Отождествить действующих лиц со Словом, явившимся или иной космологической фигурой.
  rationale: Свидетель не разрешает отсылки однозначно; богословская идентификация была бы интерпретационным добавлением.
- issue: Фраза о первенстве Отца и существовании «после него»
  choice: Синтаксическая напряжённость сохранена максимально близко к свидетелю.
  alternative: Перестроить фразу так, чтобы однозначно определить, кто существовал первым и после кого.
  rationale: Текстуальная или переводческая неясность имеет богословские последствия; её нельзя молча устранять.
- issue: Слово как грамматический субъект
  choice: 'Использован средний род: «оно».'
  alternative: Мужской род «он» как личностно-богословская интерпретация Логоса.
  rationale: В русском языке «Слово» среднего рода; личностный статус выражается прописной буквой и действиями, без нарушения естественной грамматики.
- issue: Связь силы, образа, Полноты и Слова в заключительном абзаце
  choice: Сохранено чтение, при котором «образ» отделяет Полноту от Слова.
  alternative: Истолковать «силу» или иной субъект как отделяющий.
  rationale: Такова ближайшая синтаксическая связь в предоставленном свидетеле, хотя смысл остаётся трудным.
translation_notes:
  register: 'Современный литературный русский язык с достоинством и умеренной формальностью. Космологические технические термины («Слово», «Всеобщности», «Полнота», «Церковь») сохранены с прописной буквы. Перевод предварительный: выполнен по предоставленному англоязычному публичному свидетелю, поскольку прямая сверка с коптским источником ещё не проведена. Лакуны и редакторские восстановления вынесены в маркированные примечания.'
