translation:
  language: ru
  text: 'Надлежало, [a] ввиду принесённой им молитвы и последовавшего за ней обращения, чтобы одни погибли, другие получили пользу, а третьи были отделены. Прежде всего он приготовил наказание непокорных, воспользовавшись силой от того, кто явился и от кого он получил власть над всем, чтобы быть отделённым от него. Он — тот, кто внизу, и он остаётся отделённым от Возвышенного, пока не приготовит вовне для всего замысел спасения и не отведёт каждому предназначенное ему место.


    Слово прежде всего утвердило себя, когда привело Всеобщности в порядок, став основополагающим началом, причиной и правителем возникшего, подобно тому как Отец, причина утверждения, первым стал существовать после него.[b] Оно создало предсуществующие образы, которые произвело с благодарением и прославлением.


    Затем оно украсило место для тех, кого произвело во славе. Это место называется «Рай», «Наслаждение», «Радость, полная пищи» и «Радость предсуществующих».[c] Оно хранит образ всех благ, пребывающих в Полноте.


    Затем оно украсило царство, словно город, наполненный всем приятным, а именно братолюбием и щедростью в изобилии, преисполненной [d] святыми духами и могучими силами, которые властвуют над ними и которые Слово могущественно произвело и утвердило.


    Следующим предназначенным для украшения было место Церкви, собирающейся здесь. Оно имеет образ Церкви, пребывающей в эонах, для прославления Отца.


    После этого оно украсило место для веры и послушания, происходящих от надежды. Слово получило их, когда явился свет.


    Затем оно украсило место устремления к молитве и молению. За этим последовали прощение и слово о том, кому предстояло явиться.


    Всякое духовное место существует в духовной силе. Эти места отличаются от существ памяти, потому что их сила утверждена в образе, который отделяет Полноту от Слова. Напротив, сила, действующая в пророчестве о будущем, направляет существ памяти, возникших ради предсуществующего.[e] Благодаря этому они не смешиваются с тем, что обретает бытие через видение пребывающего с ним.'
