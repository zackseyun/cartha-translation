review_pass:
  verdict: revise
  source_fidelity: 'Сверка возможна только с предоставленным английским публичным свидетельством; прямой коптский контроль отложен. В целом передача близка к свидетельству и бережно сохраняет лакуны и редакционные дополнения. Однако «for <his> thought» переведено как «за <его> замысел», что неоправданно сужает «thought» и меняет связь: исходник допускает «прославить Отца за/ради <его> мысли», а не обязательно «за замысел». Также «in a unified way» передано «в единстве», что может быть приемлемо, но «единым образом» ближе к наречному обороту свидетельства. «They possess <him> concealed within a thought» лучше не превращать в запятую с возможным отнесением к эонам; естественнее: «Они обладают <им>, сокрытым в мысли», но это оставлено как текстологически отмеченная неясность.'
  naturalness: 'Русский в целом литературен и соответствует возвышенному философско-богословскому регистру. «Стоянки на пути» несколько конкретизирует нейтральное «places» и звучит как дорожные привалы; «этапы на пути» или «места на пути» точнее. «Школу, в которой учатся должному поведению» естественнее, чем «школу, в которой учатся должному поведению» уже в тексте, но исходное «school of training for behavior» передано приемлемо. Следует также убрать неестественную связку «тогда как ... эоны удостоены знать»: «тогда как эоны достойны того, чтобы через его Дух знать...» ближе к witness, хотя по-русски лучше «тогда как через его Дух им дано узнать».'
  terminology: «Эоны», «Отец», «Дух», «Ум» и «Всеобщности» последовательно сохранены. «Первозданная сущность» приемлема для primal essence. «Неведомого» допустимо, но у witness стоит «unknown one»; «Непознанного» может ошибочно предполагать лишь временную непознанность, поэтому «Неведомого» удачно. «Соединиться» умеренно передаёт mixing with, не добавляя физикализма. Для form «образ» сохраняет нужную широту.
  issues:
  - severity: medium
    issue: «<его> замысел» вместо «<его> мысли»
    rationale: Английское свидетельство имеет thought и не уточняет, что это намерение или план. «Замысел» интерпретирует термин и снимает отмеченную в примечании неоднозначность.
  - severity: low
    issue: «Стоянки на пути»
    rationale: «Places on the path» не обязательно означает остановки или привалы. «Этапы на пути» передаёт функцию промежуточных пунктов, не добавляя образа стоянки.
  - severity: low
    issue: «в единстве» для «in a unified way»
    rationale: Русское «единым образом» точнее сохраняет наречный характер формулы и не переосмысляет её как пребывание в некотором единстве.
  - severity: low
