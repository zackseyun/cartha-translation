base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/009.yaml
  text: 'The whole system of the aeons has a love and longing to discover the Father perfectly and completely, and this is their unrestricted unity. Although the Father reveals himself eternally, he did not desire that they know him automatically. Instead, he allows himself to be grasped through searching, while reserving his unsearchable primal essence to himself. The Father gave the aeons basic desires because they form places along the path that leads to him, like a school that trains conduct. He has given them:


    faith in him and prayer to the one they do not see,

    and a strong hope in the one they do not grasp,

    and a fruitful love that looks toward what it does not see,

    and a worthy understanding of the eternal mind,

    and a blessing of wealth and freedom,

    and an understanding that longs to glorify the Father for <his> thought.


    [] By his will, the exalted Father is known through the Spirit that breathes within the Totalities. He even gives them the idea of searching for the unknown one, as when a pleasant aroma makes someone search for its source, because the Father’s aroma surpasses natural aromas. His sweetness gives the aeons indescribable pleasure and produces in them the idea of joining with him, who desires them to know him in a unified way, and of helping one another in the Spirit planted within them. Although a great weight presses down on them, they are renewed in an indescribable way. They cannot be separated from that in which they have been placed in a way they cannot grasp. They will not speak but will remain silent concerning the Father’s glory, concerning the one who can speak. Nevertheless, they will receive a form from him.


    Although speech cannot describe him, he revealed [himself.] They possess <him>, concealed within a thought. This is why the aeons remain silent about how the Father exists in his form, his essence, and his greatness, [] while the aeons are worthy to know through his Spirit that he cannot be named or comprehended. Through his spirit—the trace of seeking him—he gives them the ability to grasp him and speak about him. Each aeon is a name, <that is>, each one is a quality and power of the Father, because he exists in many names that are mixed together and are in harmony with one another. He can be spoken of because of the riches of speech. In the same way, although the Father is a single name because of his unity, he possesses countless qualities and names.'
translation:
  language: ru
  text: 'Вся совокупность эонов исполнена любви и стремления вполне и совершенно познать Отца, и в этом состоит их ничем не сдерживаемое единство. Хотя Отец вечно открывает себя, он не пожелал, чтобы они познали его сами собой: он допускает, чтобы его постигали в поиске, оставляя за собой свою неисследимую первозданную сущность. Отец наделил эоны основными стремлениями, потому что они образуют стоянки на пути, ведущем к нему, словно школу, в которой учатся должному поведению. Он даровал им:


    веру в него и молитву к тому, кого они не видят,


    и крепкую надежду на того, кого они не постигают,


    и плодотворную любовь, обращённую к тому, чего она не видит,


    и достойное понимание вечного Ума,


    и благословение богатства и свободы,


    и разумение, стремящееся прославить Отца за <его> замысел.[a]


    [...][b] По своей воле возвышенный Отец становится познаваем через Дух, дышащий во Всеобщностях.[c] Он даже внушает им мысль искать Неведомого — подобно тому как приятное благоухание побуждает человека искать его источник, ведь благоухание Отца превосходит естественные ароматы. Его сладость доставляет эонам неизречённое наслаждение и рождает в них мысль соединиться с тем, кто желает, чтобы они познали его в единстве, а также помогать друг другу в Духе, насаждённом в них. Хотя на них давит великая тяжесть, они обновляются неизречённым образом, ибо не могут быть отделены от того, в чём они помещены непостижимым для них образом. Они не станут говорить, но будут безмолвствовать о славе Отца, о том, кто способен говорить; и всё же от него они обретут образ.[d]


    Хотя речь не может его описать, он открыл [себя].[e] Они обладают <им>, сокрытым в мысли.[f] Поэтому эоны безмолвствуют о том, как Отец пребывает в своём образе, своей сущности и своём величии [...],[g] тогда как через его Дух эоны удостоены знать, что его невозможно ни назвать, ни постичь. Посредством своего духа — следа поиска его — он даёт им способность постигать его и говорить о нём. Каждый эон есть имя, <то есть> каждый есть свойство и сила Отца, ибо он существует во множестве имён, соединённых и согласованных друг с другом. О нём можно говорить благодаря богатству речи. Так и Отец, будучи единым именем вследствие своего единства, обладает бесчисленными свойствами и именами.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Угловые скобки отмечают слово, восстановленное или внесённое издателями свидетельства: «<его>». Синтаксис последней строки допускает и иное понимание связи «мысли» с прославлением Отца.'
    reason: Сохранение текстологического сигнала и смысловой неоднозначности.
  - marker: b
    text: В свидетельстве перед этим предложением обозначена лакуна; её объём и содержание не установлены.
    reason: Явно отметить повреждение рукописной традиции вместо бесшовного соединения текста.
  - marker: c
    text: «Всеобщности» передаёт специальное собирательное обозначение полноты божественных реальностей; возможна передача «Целостности» или «совокупности всего».
    reason: Пояснение непривычного космологического термина.
  - marker: d
    text: Фраза о безмолвии, «том, кто способен говорить», и обретении образа синтаксически неясна в доступном свидетельстве; перевод сохраняет эту неясность.
    reason: Не допустить ложной уверенности в определении субъекта и связей предложения.
  - marker: e
    text: Квадратные скобки в «[себя]» отмечают редакционное восстановление в свидетельстве.
    reason: Сохранение исходного текстологического сигнала.
  - marker: f
    text: Угловые скобки в «<им>» отмечают редакционное дополнение; без него фраза допускает более обрывочное прочтение.
    reason: Сохранение текстологической прозрачности.
  - marker: g
    text: Здесь в свидетельстве отмечена ещё одна лакуна.
    reason: Указать место утраты текста.
lexical_decisions:
- source_word: aeons
  choice: эоны
  rationale: Сохраняется технический термин гностического трактата; замена на «века» или «вечности» исказила бы здесь значение персонифицированных божественных реальностей.
- source_word: whole system / Totalities
  choice: вся совокупность / Всеобщности
  rationale: Различены обычное собирательное выражение в начале и, вероятно, специальный космологический термин во втором абзаце; прописная буква отмечает терминологический характер последнего.
- source_word: discovery / know
  choice: познать / становится познаваем
  rationale: В контексте речь не просто об обнаружении, а о достижении знания Отца. Формулировки сохраняют различие между деятельным поиском эонов и откровением по воле Отца.
- source_word: grasped
  choice: постигать
  rationale: «Постигать» естественно передаёт интеллектуально-духовное схватывание и сохраняет напряжение между доступностью в поиске и непостижимостью сущности.
- source_word: primal essence
  choice: первозданная сущность
  rationale: Передаёт первичность сущности без введения поздней конфессиональной терминологии.
- source_word: places on the path
  choice: стоянки на пути
  rationale: Сохраняет пространственную метафору этапов пути; «места» по-русски звучало бы неясно.
- source_word: eternal mind
  choice: вечный Ум
  rationale: Прописная буква допускает, что это космологическая или божественная реальность, не навязывая окончательной идентификации.
- source_word: thought
  choice: замысел / мысль
  rationale: В первой спорной строке «замысел» лучше передаёт возможную направленную мысль Отца; позднее «мысль» сохраняет внутреннее когнитивное значение.
- source_word: aroma / sweetness
  choice: благоухание / сладость
  rationale: Сохранены обе чувственные метафоры исходного свидетельства и их различие.
- source_word: mixing with
  choice: соединиться с
  rationale: Естественная русская передача, не устраняющая идею тесного приобщения, но избегающая неуместного физического оттенка «смешаться».
- source_word: form
  choice: образ
  rationale: «Образ» сохраняет многозначность формы, облика и определённости; более техническое «форма» могло бы чрезмерно сузить смысл.
- source_word: trace
  choice: след
  rationale: Формально сохраняется необычная авторская метафора «следа поиска», не исправляемая догадкой.
theological_decisions:
- issue: Отец открывается вечно, но не желает автоматического знания
  choice: «не пожелал, чтобы они познали его сами собой»
  alternative: «не желал, чтобы они познали его автоматически»
  rationale: Передано богословское напряжение между откровением и необходимостью поиска, но устранён современный механистический оттенок слова «автоматически».
- issue: Непознаваемость Отца и возможность говорить о нём
  choice: Сохранены рядом утверждения о невозможности назвать и постичь Отца и о дарованной способности постигать его и говорить о нём
  alternative: Развести их как абсолютную непознаваемость сущности и частичное познание проявлений
  rationale: Текст сам создаёт напряжение и не формулирует систематического разрешения; перевод не должен вносить его извне.
- issue: Дух / дух
  choice: Прописная буква в явных упоминаниях «Духа», строчная в выражении «своего духа — следа поиска»
  alternative: Везде «Дух»
  rationale: Сохранена возможная разница между космологическим Духом и описательным употреблением, отражённая свидетельством; идентичность не навязывается.
- issue: «тот, кто способен говорить»
  choice: Сохранена двусмысленная конструкция без явного отождествления с Отцом или иным субъектом
  alternative: «об Отце, который один способен говорить»
  rationale: Синтаксис свидетельства неясен, поэтому перевод не разрешает референцию местоимения догматически.
- issue: Каждый эон как имя, свойство и сила Отца
  choice: Передано прямо, без ослабления до символического наименования
  alternative: «каждый эон представляет одно из имён»
  rationale: Прямая онтологическая формулировка принадлежит самому трактату; парафраз мог бы снять его характерное богословское утверждение.
- issue: Множественность имён при единстве Отца
  choice: Сохранено парадоксальное выражение «будучи единым именем… обладает бесчисленными… именами»
  alternative: «будучи единым, обладает множеством имён»
  rationale: Необычная связь единства, имени и множества является частью аргумента и не должна сглаживаться.
translation_notes:
  register: 'Современный литературный русский язык с достоинством философско-богословского трактата. Специальные термины «эоны», «Всеобщности» и «Ум» сохранены там, где их замена бытовыми словами могла бы стереть космологический смысл. Синтаксис умеренно упрощён ради ясности, однако парадоксы, повторения и подлинные неясности не устранены. Проект предварительный: он основан на предоставленном англоязычном публичном свидетельстве, поскольку непосредственная сверка с коптским текстом ещё ожидается.'
