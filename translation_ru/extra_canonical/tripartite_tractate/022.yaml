translation:
  language: ru
  text: 'Когда два чина — [те, что] справа, и те, что слева, — соединяются друг с другом посредством находящейся между ними мысли, которая даёт им общий замысел спасения, оба начинают действовать с одинаковой страстью: те, что справа, подражают тем, что слева, а те, что слева, — тем, что справа. Иногда, когда злой чин по неразумию начинает творить зло, <мудрый> чин, приняв мужской облик, подражает ему и тоже творит зло, словно и он является силой зла. В другое время, когда мудрый чин начинает совершать добрые дела, <неразумный> чин, подражая ему, также старается делать добро.


    Так всё устраивается посредством подобных [] деяний и возникает таким образом, что сходное и несходное становятся похожи друг на друга. Поэтому необученные не могут познать причину существующего и выдвигают различные объяснения. Одни говорят, что существующее получило бытие от провидения. Это те, кто видит порядок и стройность в движениях творения. Другие говорят, что бытие происходит от чего-то чуждого. Это те, кто видит <различие> и зло, порождённое беззаконием сил. Иные говорят, что существующее возникает по судьбе. Это те, кто был поглощён данным вопросом. Ещё одни говорят, что всё дело в природе, а другие — что в случае. Но большинство тех, чьё понимание достигает лишь видимых стихий, не знает ничего за их пределами.


    Греческие мудрецы и варвары дошли в познании лишь до сил, получивших бытие через воображение и пустую мысль, <а также> до тех, кто произошёл от них вследствие борьбы и действующего среди них мятежного своеволия. Поэтому, говоря о том, что они считали мудростью, они были обмануты <подобием>. Они думали, что достигли истины, [], тогда как достигли заблуждения. Это заблуждение касалось не только малозначительных наименований: сами силы преградили им путь, убедив их, будто они <познали> Всё.[a]


    Вследствие этого чин вступил в борьбу с самим собой из-за надменной вражды [потомка] архонта, который [выше] и существовал прежде него. Поэтому все во всём разошлись между собой: в философии, видах врачевания, разрядах риторики, видах музыки и построениях логики — всё стало мнениями и теориями. Так возобладало <многословие>, и <они> пришли в смятение, поскольку не могли объяснить <тех>, кто обладает властью и дал им их теории.


    Что же касается возникшего среди <народа> евреев — писаний, созданных вещественными [силами], <чей> пример перенимают греки, и всего, что они задумали, чтобы выразить это, — силы справа <…>, вдохновившие их рассуждать <посредством> слов и самопредставления. Так они начали свой путь к достижению истины, пользуясь действовавшей в них смесью различных сил.[b]


    Затем они достигли чина несмешанных сил, <прежде чем> достигли того, кто утверждён по подобию Отца. Он невидим не [] <по своей> природе, но потому, что мудрость скрывает его, чтобы сохранить образ Того, Кто поистине невидим. Поэтому многие ангелы не смогли удостоиться его видения. Люди из еврейского народа, о которых мы говорили прежде, — праведники и пророки — ничего не мыслили и не говорили ни по воображению, ни через обманчивый образ, ни из тёмного умствования. Напротив, каждый, силой, действовавшей в нём, внимательно относясь к увиденному и услышанному, говорил точно. Они говорили согласно друг с другом и единодушно, подобно действовавшим в них [силам], потому что сохраняли своё <единство> и взаимное согласие. И прежде всего потому, что они прославляли того, кто был превыше них, и того, кто был больше них, кто существовал и был поставлен, поскольку они нуждались в нём.


    Это духовное Слово произвело среди них, как среди нуждающихся в Возвышенном, надежду и исполненное ожидания упование согласно мысли, которая есть семя спасения, и просвещающее слово, которое есть память, вместе с его потомством и истечениями — праведниками и пророками, о которых мы говорили прежде. Они хранят хвалу своих отцов и их свидетельство о великом. Они возникли [] с исполненным надежды ожиданием и вниманием; в них было посеяно <то> семя молитвы и поиска, которое сеется во многих, искавших укрепления. Оно обнаруживает себя и побуждает их любить Возвышенного и провозглашать, что всё это принадлежит Единому и Единственному.


    Когда они говорили, в них действовало нечто единое. Однако их видения и слова были различны из-за различия тех, кто сообщал им видения и слова. Поэтому внимавшие сказанному ими ничего из этого не отвергли, но приняли писания, толкуя их по-разному. Это привело к возникновению различных течений, существующих среди иудеев и поныне. Одни говорят, что Бог един — Тот, Кто говорил в древних писаниях. Другие говорят, что он множествен; третьи — что Бог прост и по природе есть единый Ум. Иные говорят, что его деяния связаны с происхождением добра и зла. Другие же утверждают, что он сам — творец возникшего, а иные — что [] он творил посредством ангелов. Подобное разнообразие представлений отражает разнообразие форм и богатство видов Писания, породившего их учител<ей> Закона.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Всё» здесь, вероятно, употреблено как термин для совокупности всей реальности. Прямую сверку с коптским текстом ещё предстоит выполнить.
    reason: Поясняет терминологическую капитализацию и предварительный характер решения.
  - marker: b
    text: Синтаксис этого места повреждён или неполон; перевод сохраняет обрывистость свидетельства. Слова «[силы]» добавлены по контексту и отмечены квадратными скобками.
    reason: Предупреждает читателя о текстовой лакуне и не выдаёт реконструкцию за несомненный текст.
lexical_decisions:
- source_word: orders
  choice: чины
  rationale: Сохраняет идею упорядоченных разрядов космических сил; «порядки» в русском звучало бы менее естественно и могло бы означать правила или состояние дел.
- source_word: powers
  choice: силы
  rationale: Передаёт космологические сущности без преждевременного отождествления с ангелами или властями.
- source_word: Totality
  choice: Всё
  rationale: Заглавная буква отмечает терминологический, всеобъемлющий смысл и не навязывает более специального термина вроде «Плерома».
- source_word: archon
  choice: архонт
  rationale: Сохранён технический термин трактата, поскольку нейтральные «правитель» или «властитель» могли бы скрыть его космологическое значение.
- source_word: simulacrum
  choice: подобие
  rationale: Передаёт обманчивое подобие без тяжеловесного заимствования «симулякр»; восстановительный статус сохранён угловыми скобками.
- source_word: material ones
  choice: вещественные [силы]
  rationale: «Вещественные» соответствует космологическому противопоставлению материального и духовного; слово «силы» добавлено в квадратных скобках как контекстуальное пояснение.
- source_word: spiritual Word
  choice: духовное Слово
  rationale: Сохраняет возможный персонифицированный или космологический смысл и исходную неопределённость.
- source_word: emanations
  choice: истечения
  rationale: Передаёт процесс происхождения, не импортируя позднейшую специализированную терминологию.
- source_word: barbarians
  choice: варвары
  rationale: Исторический термин сохранён как обозначение негреков в античном контексте, а не как современная нравственная оценка.
theological_decisions:
- issue: Статус лица, утверждённого по подобию Отца
  choice: Сохранена формулировка «тот, кто утверждён по подобию Отца» без идентификации.
  alternative: Отождествить его с конкретной фигурой трактата или христианской традиции.
  rationale: Свидетель в данном отрывке не называет его прямо; идентификация сняла бы подлинную неоднозначность.
- issue: Единство и множественность Бога в иудейских толкованиях
  choice: Все перечисленные позиции переданы как различные мнения без согласования или богословской коррекции.
  alternative: Переформулировать множественность как множественность действий, лиц или проявлений.
  rationale: Отрывок намеренно фиксирует напряжение между конкурирующими толкованиями.
- issue: Происхождение добра и зла
  choice: Сохранено нейтральное «его деяния связаны с происхождением добра и зла».
  alternative: Уточнить, что Бог лишь допускает зло или непосредственно создаёт его.
  rationale: Источник не разрешает причинно-богословскую неоднозначность.
- issue: Творение через ангелов
  choice: Передано как отдельная представленная позиция, без её одобрения или осуждения.
  alternative: Свести к обычному учению о служебном участии ангелов.
  rationale: Текст перечисляет различающиеся школы мнений, а не формулирует единое учение.
