lexical_decisions:
- source_word: Totalities
  choice: Совокупности
  rationale: Передаёт множественное собирательное понятие и отличает его от «всей Совокупности» далее по тексту; термин сохранён с прописной буквы как элемент трактатной космологии.
- source_word: existent one
  choice: Сущий
  rationale: Краткое субстантивированное обозначение сохраняет онтологический смысл «того, кто существует», не отождествляя его дополнительно с именем, которого свидетель не даёт.
- source_word: emanation
  choice: истечение
  rationale: «Истечение» естественно сочетается с последующим образом источника и передаёт происхождение без пространственного отделения; более техническая «эманация» оставлена вне основного текста ради доступности.
- source_word: age / aeons
  choice: век / эоны
  rationale: 'Различение сохранено: в сравнении речь идёт о временном «веке», а во втором разделе — о персонифицированных космологических «эонах».'
- source_word: Fullness / Fullnesses
  choice: Полнота / Полноты
  rationale: Терминологически последовательно передаёт особое космологическое понятие, сохраняя необычное множественное число там, где оно стоит в свидетельстве.
- source_word: grasp
  choice: постичь
  rationale: Передаёт умственное постижение и сохраняет словесную связь между способностью постигать век истины и желанием постичь Отца.
theological_decisions:
- issue: Отношение порождённых к Отцу в выражении «become him»
  choice: «стать им»
  alternative: «стать подобными ему»
  rationale: Сохранено сильное и неоднозначное утверждение свидетеля; добавление идеи подобия ослабило бы его и внесло бы отсутствующее толкование.
- issue: Самопорождение эонов
  choice: «породили самих себя» и «порождает самого себя»
  alternative: «возникли сами»
  rationale: Сохранён парадоксальный язык порождения, важный для богословской напряжённости отрывка, без рационализирующего сглаживания.
- issue: Непостижимость Отца и желание постичь его
  choice: Оба утверждения сохранены рядом без согласования
  alternative: Пояснить, что постижение возможно лишь частично
  rationale: Текст намеренно удерживает напряжение между непостижимостью Отца и позволенным желанием постичь его; степень возможного постижения не уточняется.
- issue: Референты местоимений во втором абзаце
  choice: Неоднозначные местоименные связи в основном сохранены
  alternative: Назвать каждого участника («эон», «высший эон», «брат»)
  rationale: Свидетель не позволяет надёжно установить все референты; их явное именование создало бы ложную определённость.
translation_notes:
  register: Современный литературный русский язык с достоинством трактатного стиля. Специальные космологические термины («эоны», «Полнота», «Совокупности») сохранены, но синтаксис по возможности сделан прозрачным. Неясные места, лакуны и редакторские дополнения свидетеля не сглажены; прописные буквы помогают различать терминологические употребления.
