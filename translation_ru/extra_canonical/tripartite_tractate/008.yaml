translation:
  language: ru
  text: 'И он не открыл Всеобщностям сразу все разнообразные свойства и не открыл тем, кто произошёл от него, своего равенства самому себе. Все произошедшие от него, <которые> суть эоны эонов, […][a] поскольку они [суть] истечения и порождения <его> рождающей природы, в силу собственной рождающей природы также <порождают> во славу Отца, ибо он — причина, утвердившая их. Как мы уже говорили, он создаёт эоны как корни, источники и отцов. Его они и прославляют, потому что он обладает знанием и мудростью и потому что Всеобщности осознали, что произошли от знания и мудрости Всеобщности.


    Если бы принадлежащие Всеобщности воздавали славу сообразно личным <способностям> каждого эона, произведённое ими было бы лишь бледным отражением Отца, который есть Всеобщность. Поэтому в песне славы и силой его единства, из которого они произошли, они были приведены к соединению, смешению и единству друг с другом. Из собрания Полноты они принесли Отцу достойное прославление — единый и вместе с тем множественный образ, поскольку он был создан во славу Единого и поскольку они приблизились к тому, кто сам есть Всеобщности.


    Это была хвала [эонов] тому, кто произвёл Всеобщности как начаток бессмертных и как вечного. Ибо они вышли из живых эонов совершенными и полными благодаря Совершенному и Полному; и благодаря общению полнота и совершенство тех, кто прославлял совершенным образом, остались неповреждёнными — подобно совершенному Отцу, который, будучи прославляем, слышит и прославление, прославляющее [его, чтобы] явить, что и они — то, что есть он.


    Основанием второй чести, оказанной им, стало то, что возвратилось к ним от Отца, когда они познали дар, позволивший им приносить плод друг среди друга для Отца. Поэтому, как они <были> славно произведены ради Отца, так и в самом прославлении явились совершенными.


    Они стали отцами третьего прославления, соответствующего свободе и силе, которые были рождены вместе с ними и дали им способность прославлять сообща и прославлять по отдельности, по собственной воле. Они были первым и вторым прославлениями, и оба совершенны и полны, поскольку являют совершенного и полного Отца и те совершенные сущности, которые возникли из прославления Совершенного. Но плод третьего прославления заключает в себе волю каждого из эонов и каждое из свойств и сил Отца. Этот плод полон и совершен постольку, поскольку слава, которую эоны желают и могут воздать Отцу, исходит и от их общего согласия, и от каждого из них по отдельности. Именно это он любит и над этим проявляет свою силу, ибо через это прославляется Отец. Поэтому они — умы умов, оказывающиеся словами слов, старцы старцев и степени степеней, возвышающиеся друг над другом.


    У каждого, кто воздаёт славу, есть своё место, своё возвышение, своя обитель и свой покой, заключающие в себе приносимую им славу. Все прославляющие Отца обладают вечным рождением, рождая при взаимном содействии друг другу, поскольку истечения бесконечны и неизмеримы и поскольку в Отце нет и следа зависти к тем, кто произошёл от него, когда они рождают нечто равное ему или подобное ему: ведь он существует во Всеобщностях, рождая и открывая себя. Кого пожелает, он делает отцом — и воистину является его Отцом; кого пожелает, делает богом — и воистину является его Богом; и он делает их Всеобщностями, <для которых> он — Всеобщность. […][b] Строго говоря, там пребывают все великие имена — те, к которым причастны ангелы, возникшие в мире вместе с архонтами, хотя никакого подобия вечным существам у них нет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Знак […] обозначает утрату или неразборчивое место рукописи; слова в угловых скобках восстановлены переводчиками, а слова в квадратных скобках добавлены или восстановлены там, где текст повреждён либо грамматически неполон.
    reason: Читателю необходимо различать сохранившийся текст и редакционные восстановления.
  - marker: b
    text: Перед заключительным предложением в рукописном свидетельстве имеется лакуна, поэтому логическая связь с предыдущей фразой может быть неполной.
    reason: Предупреждает, что резкий переход может быть следствием утраты текста.
lexical_decisions:
- source_word: Totalities / Totality
  choice: Всеобщности / Всеобщность
  rationale: Сохранено различие множественного и единственного числа важного технического термина; «Всеобщность» передаёт идею целого, не смешивая её с «Полнотой».
- source_word: Fullness
  choice: Полнота
  rationale: Устойчивый и понятный эквивалент термина, отличённый от «Всеобщности».
- source_word: aeons
  choice: эоны
  rationale: Сохранён технический термин древнего космологического рассуждения вместо его конфессионального истолкования.
- source_word: emanations
  choice: истечения
  rationale: Передаёт образ происхождения из источника и не превращает метафизическое понятие в биологическое рождение.
- source_word: procreative nature
  choice: рождающая природа
  rationale: Естественно по-русски передаёт производящую способность, сохраняя повторяющуюся лексику рождения и порождения.
- source_word: self-equality
  choice: равенство самому себе
  rationale: Сохранена необычная и потенциально техническая формулировка без подмены её «неизменностью» или «тождеством».
- source_word: archons
  choice: архонты
  rationale: Транслитерация сохраняет историко-религиозный термин и не навязывает более узкое значение «правители».
theological_decisions:
- issue: Соотношение Отца, Всеобщности и Всеобщностей
  choice: Сохранены формулы «Отец, который есть Всеобщность» и «кто сам есть Всеобщности» без гармонизации.
  alternative: Свести обе формулы к «всё» либо пояснить их как тождество Бога и мироздания.
  rationale: Исходное свидетельство намеренно использует напряжённые формулы единства и множественности; перевод не должен разрешать их доктринально.
- issue: Рождение эонами равного или подобного Отцу
  choice: 'Передано буквально: «рождают нечто равное ему или подобное ему».'
  alternative: Ослабить до «отражающего его» или уточнить онтологический статус порождённого.
  rationale: Текст допускает сильное утверждение, а последующий контекст связывает его с отсутствием зависти Отца; это напряжение сохранено.
- issue: Наименование существ «богом»
  choice: 'Сохранено: «кого пожелает, делает богом».'
  alternative: Перевести как «божественным» или писать «Богом».
  rationale: Строчная форма передаёт предикативное и производное именование, не отождествляя названного с Отцом и не устраняя исходную формулировку.
- issue: Неясный референт выражения о начатке и вечном
  choice: 'Синтаксис оставлен близким к свидетельству: «тому, кто произвёл Всеобщности как начаток бессмертных и как вечного».'
  alternative: Однозначно отнести «начаток» и «вечного» либо к производителю, либо к Всеобщностям.
  rationale: Без прямой сверки с коптским текстом определённое разрешение референта было бы преждевременным.
translation_notes:
  register: Современный литературный русский с достоинством трактатного стиля. Длинные периоды умеренно расчленены, но повторения ключевых слов «слава/прославление», «полный/совершенный», «рождать/порождать» сохранены как часть аргументации. Черновик основан на предоставленном публичном английском свидетельстве; прямая сверка с коптским оригиналом ещё требуется.
