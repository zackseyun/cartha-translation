review_pass:
  verdict: revise
  source_fidelity: Черновик в целом последовательно следует предоставленному английскому свидетельству и сохраняет технические термины, повторы, лакуны и редакционные восстановления. Прямая сверка с коптским текстом в предоставленных материалах невозможна; поэтому спорные референты не разрешаются. Однако несколько мест требуют более точной передачи синтаксических отношений свидетельства.
  naturalness: Русский текст в основном литературен, но отдельные обороты («друг среди друга», «стали отцами», «над этим проявляет свою силу») либо неестественны, либо неточно смещают смысл. Редакция ниже исправляет их, не упрощая намеренно трудный трактатный стиль.
  terminology: Термины «Всеобщность/Всеобщности», «Полнота», «эоны», «архонты», «истечения», «Отец» сохранены. «Сущности» заменено нейтральным «всё совершенное», поскольку английское witness говорит лишь о “perfect things” и не требует онтологического уточнения.
  issues:
  - severity: medium
    issue: «Они стали отцами третьего прославления»
    rationale: В свидетельстве стоит простое прошедшее “They were fathers”, а «стали» добавляет значение перехода в новое состояние, которого источник не выражает.
  - severity: medium
    issue: «приносить плод друг среди друга для Отца»
    rationale: Оборот неестественен по-русски и неясно передаёт взаимный характер действия (“among each other for the Father”).
  - severity: medium
    issue: «те совершенные сущности»
    rationale: «Сущности» вводит метафизическое определение, отсутствующее в witness (“those perfect things”); предпочтительна нейтральная формула.
  - severity: low
    issue: «над этим проявляет свою силу»
    rationale: Формулировка сглаживает “exerts power over”. «Осуществляет над этим власть» точнее передаёт отношение власти, сохраняя трудность исходного высказывания.
  - severity: low
    issue: Заключительная формула о великих именах
    rationale: «Там пребывают все великие имена» менее точно, чем «там сохраняются/предназначены все великие имена» для “are reserved there”; также связь ангелов с этими именами лучше передать без расширительного «причастны».
