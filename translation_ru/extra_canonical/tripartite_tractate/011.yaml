translation:
  language: ru
  text: 'Одному из эонов пришло на мысль попытаться постичь непостижимость и воздать ей славу, и в особенности — неизреченности Отца. Поскольку он — Слово из единства, он един, [однако] он не из единства Всецелых[a] и не от того, кто произвёл их, то есть от произведшего Всецелое, а именно Отца. Этот эон был одним из тех, кому была дана мудрость, чья мысль существовала прежде и посредством неё они производили желаемое. Поэтому он получил врождённую мудрость, чтобы исследовать сокрытое основание, ибо он — плод мудрости. Свободная воля, рождённая вместе со Всецелыми, стала причиной того, что он совершил […] желаемое, и никто его не удержал.


    Намерение того, кто есть Слово, было благим. Когда он был произведён, он поспешил прославить Отца, хотя <он> желал невозможного: произвести совершенное существо из единения, в котором не участвовал, не имея на то повеления. Этот эон был последним, кого <произвели> при взаимном содействии, и был мал по величине. И прежде чем породить что-либо ради прославления воли и в согласии со Всецелыми, он щедро устремился вперёд из преизобильной любви и направился к тому, что окружает совершенную славу, ибо Слово было произведено не вне воли Отца, то есть не без неё оно выступило.


    Однако Отец произвёл его ради тех, кого считал подобающим произвести. Отец и Всецелые удалились от него, чтобы утвердился предел, положенный Отцом, ибо это совершается не постижением непостижимого, но волей […] Отца. Кроме того, это произошло для того, чтобы возникшее могло стать замыслом спасения, которому предстояло раскрыться и который <не> мог не раскрыться, дабы явить Полноту[b]. Поэтому не следует говорить об этом деянии Слова дурно; однако уместно сказать, что это деяние Слова стало причиной замысла спасения, которому предстояло раскрыться.


    Слово породило само себя совершенным и единым, довольствуясь этим ради желанной им славы Отца. Но тех, кого оно хотело крепко удержать, оно породило как тени, образы и подобия. Оно не могло смотреть на свет, но всматривалось в глубину и сомневалось. Из этого возникло разделение, сильно его потревожившее, и удаление, вызванное его сомнением в себе и разделением, забвением себя, незнанием себя и <того>, что существует.


    Его самовозвышение и уверенность, что оно может постичь непостижимое, затвердели и укоренились в нём. Однако эти немощи оставались при нём, пока оно было вне себя из-за сомнения в себе, ибо <ему не удалось достичь> слав Отца, чья возвышенность неподражаема. Оно не достигло этого, потому что не могло постичь её.


    Тот, кого оно произвело само по себе […] как единого эона, поспешил ввысь, к своим, и этот его родич в Полноте оставил того, кто возник в недостаточности, вместе с теми, кого тот произвёл воображаемым образом, потому что они ему не принадлежат. После того как он произвёл себя совершенным — тот, кто действительно произвёл самого себя, — он ослабел, подобно женской природе, оставляющей свою мужскую пару. Из того, что было в нём недостаточным, возникло порождённое его мыслью и гордостью; но благодаря тому, что было в нём совершенным, он покинул это и [поднялся] ввысь, к своим. Он пребывал в Полноте как напоминание ему, поскольку [был спасён от своей гордости].


    Поспешивший ввысь и притянувший его к себе не были бесплодны: произведя плод в Полноте, они низложили возникшее в недостаточности. Возникшее из горделивой мысли подобно Полнотам: это их подобия, образы, тени и призраки, лишённые разума и света, принадлежащие пустой мысли, потому что ничто их не произвело. […] Поэтому их конец будет соответствовать их началу: то, чего никогда не было, возвратится к тому, чего никогда не будет. И всё же они считают себя более великими, сильными и [почётными], чем имена, [которые украшают] их и чьими тенями они являются. Они подобны [увиденному кем-то] прекрасному отражению, ведь лик образа обычно получает красоту от того, что в нём отражается.


    Они думали, что существуют сами по себе и не имеют источника, потому что не видели ничего другого, существовавшего прежде них. Поэтому они жили в неповиновении и совершали мятежные поступки, не смиряясь перед тем, ради кого возникли. Они желали повелевать друг другом и господствовать друг над другом [в] своём честолюбивом стремлении к славе, тогда как заключённая в них слава содержала причину будущего устроения[c]. Поскольку [они —] подобия того, что вверху, <они> вознеслись из жажды власти — каждый сообразно великому имени, тенью которого он является, и каждый полагал себя выше своих сотоварищей.


    Мысль этих других не была бесплодной: как у <тех>, чьими тенями они являются, каждая мысль становится сыном, […] так и то, о чём думают они, становится их потомством. Поэтому они произвели множество потомков: бойцов, воинов, смутьянов, непокорных мятежников, властолюбцев и всякое другое существо такого рода, произошедшее от них.


    Слово стало причиной возникновения этого множества и всё более недоумевало и изумлялось. Вместо совершенства оно увидело недостаточность; вместо единения — разделение; вместо твёрдости — [слабости]; вместо [покоя] — волнения. Оно [не могло] ни заставить их перестать [любить] волнение, ни уничтожить его. Оно было [совершенно] бессильно; его Всецелое и его [совершенство] оставили его.


    Возникшие в неведении о самих себе не знали ни Полнот, из которых произошли, ни причины своего существования. Находясь в таком неустойчивом состоянии, Слово не смогло произвести ничего другого, подобного истечениям[d], пребывающим в Полноте, — славам, существующим во славу Отца. Вместо этого оно произвело […] малых и слабых существ, ограниченных немощами, которые сковывали и его.


    Подобие, оставшееся в этом состоянии одно, было причиной тех, кто изначально не был причиной собственного существования. Находившийся в этом недостаточном состоянии продолжал производить недостаточных существ, пока не вынес приговор и не осудил произведённых им неразумных существ. Он боролся с ними, пока они не были уничтожены, — именно те, кто противился осуждению, [когда] гнев преследовал их.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Всецелые» — условная передача специального обозначения совокупности духовных сущностей; в свидетельстве стоит множественное Totalities.
    reason: Необычная русская форма требует пояснения и сохраняет различие числа.
  - marker: b
    text: «Полнота» — специальный космологический термин; нередко передаётся как «Плерома».
