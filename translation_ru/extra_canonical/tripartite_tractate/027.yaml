    Так они должны были вкусить злые вещи и посредством них некоторое время упражняться […], чтобы навеки обрести [наслаждение благами].[d] [Здесь утрата текста.][e] Они выставляют себя, а враги постоянно отвергают и злословят их; сами же они считают это украшением и дивным знаком возвышенного. Это должно было показать, что незнание тех, кто не знает Отца, возникло по их собственной вине, в отличие от его силы, благодаря которой они могли обрести знание о нём.


