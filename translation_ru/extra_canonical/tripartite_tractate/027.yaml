    reason: Пояснить техническое и неоднозначное выражение.
  - marker: d
    text: 'В этом предложении рукопись повреждена: многоточие обозначает утрату, а слова «наслаждение благом» являются восстановлением.'
    reason: Разграничить сохранившийся и реконструированный текст.
  - marker: e
    text: Перед следующим предложением имеется ещё одна лакуна.
    reason: Сохранить второй пустой сигнал повреждения из свидетельства.
  - marker: f
    text: 'Синтаксическая связь неясна: «Предсуществующий» может быть ещё одним наименованием знания, пути либо отдельного лица.'
    reason: Сохранить подлинную грамматическую и богословскую неоднозначность.
  - marker: g
    text: 'Концовка парадоксальна: буквально речь идёт о тех, кто оставил предназначенное им величие. Не исключено повреждение текста или иное понимание связи слов.'
    reason: Предупредить о неясности, не исправляя её истолкованием.
lexical_decisions:
- source_word: Fullness
  choice: Полнота
  rationale: Сохранён характерный технический термин трактата без конфессионального истолкования.
- source_word: Totalities
  choice: Все совокупности
  rationale: Передаёт множественное и собирательное значение; необычность выражения сохранена как особенность космологической терминологии.
- source_word: knowledge
  choice: знание
  rationale: Последовательно сохранена ключевая лексическая связь во всём фрагменте.
- source_word: ignorance
  choice: незнание
  rationale: Выбрано нейтральное «незнание», а не нравственно окрашенное «невежество».
- source_word: sweetness
  choice: сладость
  rationale: Сохранён конкретный метафорический образ, хотя по-русски он звучит необычно.
- source_word: the pre-existent one
  choice: Предсуществующий
  rationale: Субстантивированная форма сохраняет личностную либо титульную возможность прочтения.
- source_word: plan of salvation
  choice: замысел спасения
  rationale: Естественная современная формулировка, не вводящая специальной конфессиональной терминологии.
theological_decisions:
- issue: Неясные референты мужских местоимений
  choice: В основном сохранить чередование «он/его», уточнив «Отец» лишь там, где это нужно для русской грамматики и связности
  alternative: Повсеместно заменить местоимения именами «Отец» и предполагаемого явленного лица
  rationale: Источник допускает неоднозначность; полное уточнение навязало бы интерпретацию.
- issue: Отец как «причина незнания»
  choice: Сохранить напряжённое утверждение без смягчения
  alternative: Перефразировать как допущение незнания
  rationale: Текст прямо связывает проявление Отца с причиной незнания и одновременно с произведением знания.
- issue: Непознаваемость Отца и даруемое знание о нём
  choice: Сохранить оба утверждения рядом
  alternative: Развести их как знание сущности и знание через откровение
  rationale: Такое разграничение возможно, но в данном свидетельстве явно не сформулировано.
- issue: Вкусить зло как часть предведения
  choice: Передать буквально, не оправдывая и не осуждая этот замысел дополнительными словами
  alternative: Истолковать зло исключительно как педагогически допущенное испытание
  rationale: Сохранена богословская напряжённость исходного свидетельства.
- issue: Отказ от предназначенного величия ведёт к возрастанию
  choice: Сохранить парадоксальную формулировку
  alternative: Исправить её в сторону отказа от ложного величия
  rationale: Уточнение вида величия не подтверждается данным английским свидетельством.
