translation:
  language: ru
  text: 'Отец знал его заранее, потому что ещё до того, как возникло что-либо, тот пребывал в его мыслях, где Отец имел также и тех, ради кого открыл его. Он возложил недостаток на то, что сохраняется лишь в течение преходящих времён, ради славы своей Полноты. То, что он оставался неведомым, побудило его явить свою доброту, [даровав знание о себе].[a]


    [Здесь утрата текста.][b] Так он обрёл знание о нём как о проявлении его благоволения и откровении богатства его сладости — второй славы. Итак, он явился также причиной незнания, хотя сам производит знание: он — сокровенная и непостижимая Премудрость, в которой знание сохраняется до конца, когда Все совокупности[c] исчерпают себя в поисках Бога Отца, которого никто не постиг собственной мудростью или силой. Он благоволит даровать им знание великого дара превосходной мысли, чтобы они непрестанно благодарили его. Согласно своему непоколебимому замыслу, он вечно открывает себя тем, кто по его воле был сочтён достойным знания Отца — непознаваемого по своей природе. В своём предведении Отец замыслил, чтобы они могли обрести знание и всякое сопутствующее ему благо, вместе с тем вкусив незнание и причиняемые им страдания.


    Так они должны были вкусить зло и через него некоторое время упражняться […], чтобы навеки обрести [наслаждение благом].[d] [Здесь утрата текста.][e] Они выставляют себя напоказ, а враги постоянно отвергают и злословят их; сами же они считают это украшением и дивным знаком возвышенного. Это должно было показать, что незнание тех, кто не знает Отца, возникло по их собственной вине, в отличие от его силы, благодаря которой они могли обрести знание о нём.


    Это знание по праву называется «знанием всякой возможной мысли» и «сокровищем». А если говорить о ещё большем возрастании знания, оно есть откровение тех, кто был познан в начале, путь к единству и Предсуществующий.[f] В итоге возрастают в величии те, кто оставил величие, предназначенное им в замысле спасения согласно [божественной] воле, чтобы конец стал подобен началу.[g]'
