- source_word: knowledge
  choice: знание
  rationale: Передаёт гностический контекст, не добавляя конфессионально нагруженного толкования.
- source_word: form
  choice: образ
  rationale: Естественное русское соответствие, сохраняющее неопределённость между формой, обликом и явленным образом.
- source_word: orders
  choice: чины
  rationale: Обозначает упорядоченные разряды существ и звучит уместно в возвышенном религиозно-философском тексте.
- source_word: beings of memory
  choice: существа памяти
  rationale: Формально сохраняет необычный технический оборот свидетеля, не подменяя его догадочным термином.
- source_word: those of the likeness
  choice: существа подобия
  rationale: Передаёт название категории существ и избегает неясного субстантивированного «те, кто от подобия».
- source_word: repose
  choice: покой
  rationale: Сохраняет духовный и эсхатологический оттенок, не сужая его до отдыха.
- source_word: fell outside
  choice: оказался вовне
  rationale: Сохраняет пространственно-онтологическую метафору и её намеренную неясность.
theological_decisions:
- issue: Личность действующего лица, обозначенного восстановленным местоимением
  choice: Сохранено «<он>»
  alternative: Назвать действующего «Сыном»
  rationale: Заголовок указывает на Сына, но сам фрагмент сохраняет местоименную неопределённость и текстологический знак восстановления.
- issue: Значение «the one who was deficient»
  choice: «тот, кто был несовершенен»
  alternative: «тот, кому недоставало полноты» / «ущербный»
  rationale: Формулировка сохраняет идею недостаточности без уничижительного оттенка и без внесения технического понятия полноты, отсутствующего в свидетеле.
- issue: Отношение существ к явившемуся
  choice: «свидетелями, уверовавшими в <него>»
  alternative: «свидетелями, убеждёнными относительно <него>»
  rationale: Передаёт смысл persuaded естественно по-русски, сохраняя восстановленное дополнение и не уточняя содержание веры.
- issue: Роль в замысле спасения
  choice: «послужили замыслу спасения»
  alternative: «были полезны в плане спасения»
  rationale: Сохраняет парадокс невольного участия в спасительном замысле, не утверждая их сознательного содействия.
