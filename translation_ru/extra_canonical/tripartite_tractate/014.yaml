base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/014.yaml
  text: 'The fall experienced by the aeons of the Father of the Totalities happened only as if it were their own experience, planned by the Father with care, generosity, and great kindness. [] […] the Totality, to teach them about [the deficiency] through the one [from whom alone they] all received power to remove deficiencies.


    His own [order came] into being from <him> who hastened on high, from what produced itself from him, and from complete perfection. The one who hastened on high became an intercessor for the deficient one, together with the emanation of the aeons that had come into being in agreement with the things that exist. When he prayed to them, because they were united, they joyfully and eagerly agreed, in harmonious accord, to help the deficient one. They assembled and pleaded with the Father of generous intention that help would come from the Father above, for his glory, because there was no other way for the deficient one to become perfect except by the will of the Fullness of the Father. He had moved it toward himself, revealing and bestowing <it> on the deficient one.


    From the harmony that had come into being through their joyful inclination, they produced the fruit as an offspring of that harmony, a unity possessed by the Totalities, revealing the face of the Father. The aeons thought about the Father as they glorified him and prayed for help for their brother, asking that the Father would join with them. In this way, they eagerly and joyfully produced the fruit. He then revealed the manifestation of the agreement arising from their mutual union, who is his beloved Son. [] The Son in whom the Totalities are well pleased clothed them with himself as with a garment, imparting perfection to the deficient one and giving strength to the perfect ones. Strictly speaking, he is called “Savior,” “Redeemer,” “the Well-Pleasing One,” “the Beloved,” “the Paraclete,” “the Christ,” and “the Light for the Appointed Ones.” He is congruent with those who produced him because he became the names of the places granted to him. But what other name can be given to him
    except “the Son”? As we said before, this is because he is the knowledge of the Father, whom he desired that they know.


    The aeons generated both the face of the Father whom they glorify, as we wrote earlier, and their own face, because the aeons who glorify generated <his> appearance and their own face. They were formed as his army, like the army of a king, because the beings from the thought possess a powerful unity and a harmony blended together. They were produced in a complex form so that the one who would receive help could behold those for whom he had interceded. He also beholds the one who bestowed it on him. The fruit of the agreement with him that we mentioned earlier is subordinate to the power of the Totalities, because the Father was able to place the Totalities within him: those who existed beforehand, those who are, and those who will be. [] He revealed those whom the Father had placed within him, not giving them away but entrusting them to him. He carried out the universal plan of salvation with the authority granted to him from the beginning and with the power needed for the work. In this
    way, he began to accomplish his revelation.


    The one in whom the Father dwells and in whom the Totalities dwell <was> created before the one who is without sight. He taught him about those who sought their sight through the radiance of the perfect light. First, he perfected him in unspeakable joy. He perfected him for his own sake as a perfect one, and he also bestowed on him what is appropriate for each individual. This is the nature of the first joy.'
translation:
  language: ru
  text: 'Падение, пережитое эонами Отца всех Совокупностей, произошло лишь так, словно это было их собственное переживание; Отец предусмотрел его с заботой, благодеянием и великой добротой. […] […] Совокупность — чтобы через того, [от кого одного все они] получили силу устранять недостатки, научить их понимать [недостаток].[a]


    Его собственный [порядок возник] из <того>, кто устремился ввысь, из того, что само произвело себя из него, и из совершенной полноты. Устремившийся ввысь стал ходатаем за испытывающего недостаток вместе с исхождением эонов, возникшим в согласии с существующим. Когда он обратился к ним с просьбой, они, будучи едины, радостно и ревностно согласились в полном единодушии помочь испытывающему недостаток. Они собрались и стали молить Отца, чьи намерения благотворны, чтобы свыше, от Отца, пришла помощь — к его славе. Ведь испытывающий недостаток никак иначе не мог достичь совершенства, кроме как по воле Полноты Отца, которую он привлёк к себе, открывая и даруя <её> испытывающему недостаток.[b]


    Из согласия, возникшего благодаря их радостной устремлённости, они произвели плод — порождение этого согласия, единство, которым обладали Совокупности и которое являло лик Отца. О нём размышляли эоны, прославляя его и молясь о помощи своему брату; они просили, чтобы Отец соединился с ними. Так они ревностно и радостно произвели плод. Тогда он явил зримое выражение согласия, рождённого их взаимным единением, — своего возлюбленного Сына. […] Сын, которым были довольны Совокупности, облёк их в себя, словно в одежду, даруя совершенство испытывающему недостаток и укрепляя совершенных. В собственном смысле его называют «Спасителем», «Искупителем», «Благоугодным», «Возлюбленным», «Утешителем», «Христом» и «Светом для избранных». Он сообразен тем, кто произвёл его, потому что стал именами мест, дарованных ему. Но какое иное имя можно ему дать, кроме имени «Сын»? Ведь, как мы уже сказали, он есть знание об Отце, которого Отец пожелал им познать.[c]


    Эоны породили и лик Отца, которого они прославляют, как мы писали прежде, и свой собственный лик, ибо прославляющие эоны породили <его> образ и свой лик. Они были устроены как его войско, словно войско царя, потому что существа, происшедшие из мысли, обладают могучим единодушием и слитной гармонией. Они были произведены в сложном образе, чтобы тот, кому предстояло получить помощь, мог увидеть тех, за кого он ходатайствовал. Он видит также и того, кто даровал ему эту помощь. Упомянутый нами прежде плод согласия с ним подчинён силе Совокупностей, потому что Отец смог вместить в него Совокупности: существовавших прежде, существующих ныне и тех, кто будет существовать. […] Он открыл тех, кого Отец поместил в него, не отдавая их, но вверяя их ему. Наделённый от начала властью и силой для этого дела, он осуществил всеобщий замысел спасения. Так он начал совершать своё откровение.


    Тот, в ком обитает Отец и в ком обитают Совокупности, <был> создан прежде лишённого зрения. Он поведал ему о тех, кто благодаря сиянию совершенного света искал способности видеть. Сначала он сделал его совершенным в неизреченной радости. Он сделал его совершенным ради него самого, как совершенного, и также даровал ему то, что подобает каждому в отдельности. Таково свойство первой радости.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Многоточия обозначают утрату текста рукописи; слова в квадратных скобках восстановлены переводчиками свидетельства, а слова в угловых скобках добавлены для восстановления предполагаемого смысла.
    reason: Читателю необходимо объяснить текстологические знаки, сохранённые из повреждённого свидетельства.
  - marker: b
    text: В повреждённом и синтаксически трудном месте неясно, к кому относится местоимение «он» и что именно обозначает «её».
    reason: Сохраняет реальную референциальную неоднозначность вместо её молчаливого разрешения.
  - marker: c
    text: 'Последнюю часть можно синтаксически понять и иначе: «он есть знание Отца, которого он пожелал, чтобы они познали».'
    reason: Отмечает неоднозначность местоимений и отношений между Отцом, Сыном и познанием.
lexical_decisions:
- source_word: aeons
  choice: эоны
  rationale: Закрепившийся русский термин для сущностей гностической космологии; транслитерация сохраняет специальное значение и не подменяет его словом «века».
- source_word: the Totality / the Totalities
  choice: Совокупность / Совокупности
  rationale: Сохранено различие единственного и множественного числа и отвлечённо-космологический характер термина; прописная буква отмечает его терминологическое употребление.
- source_word: the Fullness
  choice: Полнота
  rationale: Передаёт отдельный от «Совокупностей» технический термин и избегает преждевременного отождествления с Плеромой без прямой проверки коптского текста.
- source_word: deficient one / deficiency
  choice: испытывающий недостаток / недостаток
  rationale: Передаёт состояние нехватки, не превращая его носителя в морально порочного или физически неполноценного.
- source_word: intercessor
  choice: ходатай
  rationale: Достоинное и понятное обозначение того, кто обращается с просьбой за другого; соответствует последующему описанию молитвы.
- source_word: Paraclete
  choice: Утешитель
  rationale: Выбрано традиционно узнаваемое русское соответствие, но без уточнения личности или конфессионального истолкования.
- source_word: emanation
  choice: исхождение
  rationale: Передаёт происхождение из источника в метафизическом контексте и звучит естественнее буквального «эманация» для широкого читателя.
theological_decisions:
- issue: Соотношение Отца, Сына и коллективного порождения эонов
  choice: Сохранено утверждение, что плод произведён согласным единением эонов и назван возлюбленным Сыном
  alternative: Согласовать формулировки с позднейшими тринитарными схемами или представить Сына исключительно непосредственным творением Отца
  rationale: Текст содержит собственное напряжённое космологическое описание; перевод не должен исправлять его в пользу какой-либо конфессиональной системы.
- issue: Неясный субъект в выражении «которую он привлёк к себе»
  choice: Сохранено местоимение «он» без явного определения субъекта
  alternative: Назвать субъектом либо Отца, либо испытывающего недостаток
  rationale: Английское свидетельство не разрешает референцию однозначно, а прямое исследование коптского источника ещё не проведено.
- issue: «Он есть знание об Отце»
  choice: Сохранена предикация знания Сыну
  alternative: Ослабить до «он сообщает знание об Отце»
  rationale: Источник формулирует тождество, а не только посредническую функцию; богословское напряжение следует сохранить.
- issue: Создание носителя Отца и Совокупностей
  choice: Переведено «<был> создан» с сохранением редакторских угловых скобок
  alternative: Заменить на «существовал» или «был рождён»
  rationale: Свидетельство прямо передаёт created и отмечает восстановленный элемент; замена внесла бы онтологическое толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством трактатного и молитвенно-космологического регистра. Длинные периоды умеренно расчленены, но повтор ключевых терминов и логическая плотность оригинального свидетельства сохранены. Проект основан на предоставленном англоязычном публичном свидетельстве; прямая сверка с коптским текстом Nag Hammadi Codex I,5 остаётся необходимой. Текстологические обозначения сохранены, а пропуск унифицирован как многоточие в квадратных скобках.
