review_pass:
  verdict: revise
  source_fidelity: 'Прямая сверка с коптским текстом ещё не представлена, поэтому проверка выполнена по данному английскому свидетельству. Исправлены две безопасные точки: восстановлено различие между текстологическими сигналами «[] […]» в начале фрагмента и устранено смешение «complete perfection» с техническим термином «Fullness/Полнота». Также снято необоснованное разрешение неоднозначного «he desired» в предложении о знании Отца.'
  naturalness: Текст в целом литературен и сохраняет высокий трактатный регистр. Несколько формулировок уточнены для более естественного русского синтаксиса без сглаживания намеренной абстрактности свидетельства.
  terminology: «Эоны», «Совокупность/Совокупности», «Полнота», «ходатай», «исхождение» и «Утешитель» сохранены последовательно. «Совершенная полнота» заменена на «совершенное совершенство», поскольку в этом месте английское свидетельство не употребляет техническое Fullness.
  issues:
  - severity: medium
    issue: Начальные текстологические обозначения переданы как «[…] […]» вместо «[] […]».
    rationale: В свидетельстве первый пустой квадратный блок и последующее многоточие различены. Их следует сохранять буквально, а не унифицировать.
  - severity: medium
    issue: «from the complete perfection» переведено как «из совершенной полноты».
    rationale: Это смешивает обычное выражение complete perfection с отдельным термином Fullness, который в том же отрывке передан как «Полнота».
  - severity: medium
    issue: 'Фраза о Сыне как знании Отца разрешает неоднозначное местоимение: «которого Отец пожелал им познать».'
    rationale: Английское свидетельство оставляет субъект he неопределённым. В основном тексте следует сохранить местоименную неоднозначность, отметив её в примечании.
  revised_text: 'Падение, пережитое эонами Отца всех Совокупностей, произошло лишь так, словно это было их собственное переживание; оно было предусмотрено Отцом с заботой, благодеянием и великой добротой. [] […] Совокупность — чтобы через того, [от кого одного все они] получили силу устранять недостатки, научить их понимать [недостаток].[a]



    Его собственный [порядок возник] из <того>, кто устремился ввысь, из того, что само произвело себя из него, и из совершенного совершенства. Устремившийся ввысь стал ходатаем за испытывающего недостаток вместе с исхождением эонов, возникшим в согласии с существующим. Когда он обратился к ним с просьбой, они, будучи едины, радостно и ревностно согласились в полном единодушии помочь испытывающему недостаток. Они собрались и стали молить Отца, чьи намерения благотворны, чтобы свыше, от Отца, пришла помощь — к его славе. Ведь испытывающий недостаток никак иначе не мог достичь совершенства, кроме как по воле Полноты Отца, которую он привлёк к себе, открывая и даруя <её> испытывающему недостаток.[b]



    Из согласия, возникшего благодаря их радостной устремлённости, они произвели плод — порождение этого согласия, единство, которым обладали Совокупности и которое являло лик Отца. О нём размышляли эоны, прославляя его и молясь о помощи своему брату; они просили, чтобы Отец соединился с ними. Так они ревностно и радостно произвели плод. Тогда он явил зримое выражение согласия, рождённого их взаимным единением, — своего возлюбленного Сына. [] Сын, которым были довольны Совокупности, облёк их в себя, словно в одежду, даруя совершенство испытывающему недостаток и укрепляя совершенных. Собственно, его называют «Спасителем», «Искупителем», «Благоугодным», «Возлюбленным», «Утешителем», «Христом» и «Светом для избранных». Он сообразен тем, кто произвёл его, потому что стал именами мест, дарованных ему. Но какое иное имя можно ему дать, кроме имени «Сын»? Ведь, как мы уже сказали, он есть знание Отца, которого он пожелал, чтобы они познали.[c]



    Эоны породили и лик Отца, которого они прославляют, как мы писали прежде, и свой собственный лик, ибо прославляющие эоны породили <его> образ и свой лик. Они были устроены как его войско, словно войско царя, потому что существа, происшедшие из мысли, обладают могучим единодушием и слитной гармонией. Они были произведены в сложной форме, чтобы тот, кому предстояло получить помощь, мог увидеть тех, за кого он ходатайствовал. Он видит также и того, кто даровал ему эту помощь. Упомянутый нами прежде плод согласия с ним подчинён силе Совокупностей, потому что Отец смог вместить в него Совокупности: существовавших прежде, существующих ныне и тех, кто будет существовать. [] Он открыл тех, кого Отец поместил в него, не отдавая их, но вверяя их ему. Наделённый от начала властью и силой для этого дела, он осуществил всеобщий замысел спасения. Так он начал совершать своё откровение.



    Тот, в ком обитает Отец и в ком обитают Совокупности, <был> создан прежде лишённого зрения. Он поведал ему о тех, кто благодаря сиянию совершенного света искал зрения. Сначала он сделал его совершенным в неизреченной радости. Он сделал его совершенным ради него самого, как совершенного, и также даровал ему то, что подобает каждому в отдельности. Таково свойство первой радости.'
