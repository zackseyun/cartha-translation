    reason: Отразить квадратные скобки английского свидетеля без создания неудобочитаемого русского текста.
  - marker: в
    text: 'Возможен и иной синтаксический смысл: «что, собственно говоря, именуется “эонами эонов”». Проверка по коптскому тексту ещё требуется.'
    reason: Сохранить неоднозначность числа и референта в предварительном свидетельстве.
  - marker: г
    text: Перед словами «на Сыне» в рукописном тексте имеется лакуна.
    reason: Сохранить отмеченное свидетелем повреждение текста.
lexical_decisions:
- source_word: Church
  choice: Церковь
  rationale: Сохранён основной экклезиологический термин свидетеля с прописной буквы, поскольку здесь Церковь представлена как предвечная совокупность.
- source_word: only son
  choice: единственный сын
  rationale: Передаёт буквальный смысл, не подменяя его более конфессионально нагруженным термином «Единородный» при отсутствии проверки коптского источника.
- source_word: unbegotten
  choice: нерождён
  rationale: Сохраняет метафизическое утверждение свидетеля и его напряжение применительно к Сыну, не исправляя текст по более привычной догматической формуле.
- source_word: offspring
  choice: порождения
  rationale: Нейтральнее, чем «потомство», для множества духовных сущностей, происходящих от Отца и Сына.
- source_word: aeons
  choice: эоны
  rationale: Сохранён технический термин данного космологического контекста, а не обобщающее «веки».
- source_word: reposes
  choice: покоится
  rationale: Сохраняет образ пребывания и опоры, не уточняя неявно характер отношения.
theological_decisions:
- issue: Предвечное существование Церкви наряду с Сыном
  choice: Утверждение передано прямо и без смягчения.
  alternative: Истолковать Церковь как существовавшую лишь в замысле Бога.
  rationale: Такое уточнение отсутствует в предоставленном свидетеле и разрешило бы его онтологическую неоднозначность.
- issue: Сын назван нерождённым и безначальным
  choice: Формулировка сохранена буквально по смыслу.
  alternative: Заменить на «рождён прежде веков» или согласовать с позднейшей догматической терминологией.
  rationale: Перевод не должен импортировать конфессиональное согласование или устранять напряжение исходного свидетеля.
- issue: Отец постигает Себя как Сына
  choice: Парадоксальное высказывание сохранено.
  alternative: Переформулировать как «постигает Сына» или «мыслит о Сыне».
  rationale: Альтернатива молча исправила бы богословски трудное место, тогда как основание для такого исправления без проверки коптского текста отсутствует.
- issue: «Эоны эонов» как обозначение членов Церкви
  choice: Сохранена связь множественного «они именуются» с множеством предвечных лиц.
  alternative: Согласовать с единственным числом и отнести название к Церкви в целом.
  rationale: Английский свидетель синтаксически неоднозначен; выбранное чтение лучше согласуется с непосредственно предшествующим множеством, но отмечено в сноске как предварительное.
translation_notes:
  register: 'Современный литературный русский язык с достоинством трактатного, метафизического рассуждения. Синтаксис по возможности упрощён для ясности, но парадоксы и неоднозначности не сглажены. Проект предварительный: он основан на предоставленном англоязычном свидетельстве; непосредственная сверка с коптским текстом Nag Hammadi Codex I,5 ожидается.'
