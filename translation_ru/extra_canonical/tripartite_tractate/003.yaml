  terminology: «Церковь», «эоны», «нерождён», «безначален» и «нетленные святые духи» сохранены. «Единство» точнее передаёт «a unity», чем предикативное «един». Капитализация личных местоимений сохраняется в отношении Отца и Сына; местоимение в заключительном «ибо такова его природа» оставлено со строчной буквы, чтобы не устранять синтаксическую неясность свидетеля.
