translation:
  language: ru
  text: 'Не только Сын существовал от начала — Церковь также существовала от начала. Если кто-нибудь из-за загадочности этого предмета думает, будто понимание того, что Сын — единственный сын, противоречит этому утверждению, то это не так. Подобно тому как [а] Отец един и открыл Себя как Отца лишь Самому Себе, так и Сын оказался братом лишь Самому Себе, поскольку Он нерождён и не имеет начала. Отец дивится Себе [как] Отцу и воздаёт [Себе славу], честь и [любовь].[б] Кроме того, Он постигает Себя как Сына — в согласии со свойствами безначальности и бесконечности. Так это положение подтверждается.


    Его бесчисленные и беспредельные порождения неотделимы от Него. Существующие произошли от Сына и Отца, словно поцелуи тех, кто целует друг друга с благой и ненасытимой мыслью: объятие одно, хотя и заключает в себе множество поцелуев. Смысл в том, что Церковь состоит из множества тех, кто существовал прежде эонов; собственно говоря, они именуются «эонами эонов».[в] Таково свойство нетленных святых духов, на которых покоится Сын, ибо такова Его природа, подобно Отцу, Который также покоится [г] на Сыне.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: а
    text: В рукописном тексте перед словами об Отце имеется лакуна; утраченные слова не восстанавливаются.
    reason: Сохранить сигнал повреждения рукописи, переданный пустыми квадратными скобками в свидетеле.
