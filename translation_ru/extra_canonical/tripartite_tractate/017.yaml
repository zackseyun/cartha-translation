  footnotes:
  - marker: a
    text: В рукописном свидетельстве в этом месте отмечена лакуна.
    reason: Обозначает утрату текста, представленную в исходном свидетельстве знаком [].
  - marker: b
    text: 'Форма слова в свидетельстве не вполне ясна: возможно как единственное число «мысль», так и множественное «мысли».'
    reason: Сохраняет редакционную неопределённость формы thought<s>.
  - marker: c
    text: В рукописном свидетельстве после этой фразы отмечена лакуна.
    reason: Обозначает утрату текста, представленную в исходном свидетельстве знаком [].
  - marker: d
    text: В рукописном свидетельстве в этом месте отмечена лакуна.
    reason: Обозначает утрату текста, представленную в исходном свидетельстве знаком [].
  - marker: e
    text: Синтаксис этого предложения и референты местоимений неясны; перевод сохраняет возможную альтернативу, не выбирая окончательного толкования.
    reason: Предупреждает читателя о подлинной текстовой и смысловой неоднозначности.
lexical_decisions:
- source_word: Word
  choice: Слово
  rationale: Сохранён технический и персонализированный титул; средний род русского слова последовательно определяет местоимения там, где референтом явно служит Слово.
- source_word: Aeon
  choice: Эон
  rationale: Транслитерация сохраняет специальное космологическое значение и не сводит термин просто к «веку».
- source_word: Place
  choice: Место
  rationale: Буквальный титул сохранён с прописной буквы как именование духовной области.
- source_word: Synagogue of Salvation
  choice: Собрание спасения
  rationale: Передаёт базовое значение «собрание» и избегает неоправданного отождествления технического термина с позднейшим зданием или институтом.
- source_word: Storehouse
  choice: Хранилище
  rationale: Естественное русское слово, сохраняющее образ места хранения и покоя.
- source_word: Fullness
  choice: Полнота
  rationale: Традиционно понятная и семантически точная передача специального термина; прописная буква отмечает космологический статус.
- source_word: Totalities
  choice: Совокупности
  rationale: Сохранено отличие от «Полноты»; множественное число отражает форму свидетельства и не устраняет терминологическую напряжённость.
- source_word: energy
  choice: действующая в них сила
  rationale: В контексте обозначает проявленную действенность, а не современную физическую энергию; развёрнутая передача делает противопоставление сущности понятнее.
- source_word: plan of salvation
  choice: замысел спасения
  rationale: Передаёт упорядоченное спасительное устроение без привнесения узкоконфессиональной терминологии.
- source_word: passions
  choice: страсти
  rationale: Сохраняет аскетико-философский смысл состояний или претерпеваний, прямо связанных текстом с немощью.
theological_decisions:
- issue: Род и личностность Слова
  choice: Использован грамматический средний род там, где референтом является «Слово», без устранения личностного характера действий.
  alternative: Повсеместно употреблять мужской род по аналогии с Логосом или Сыном.
  rationale: Русская грамматика требует согласования со словом «Слово», тогда как мужской род мог бы преждевременно разрешить меняющиеся и местами неясные референции оригинала.
- issue: Отношение Эона к Сыну
  choice: Формула «обладал именем Сына, его сущностью, силой и обликом» сохранена без утверждения полного тождества.
  alternative: Перевести так, будто Эон прямо и однозначно является Сыном.
  rationale: Свидетельство говорит об обладании именем и свойствами; перевод не должен усиливать онтологическое утверждение.
- issue: Гендерная символика
  choice: Сохранено противопоставление «мужских форм» и «немощи, которая есть женственность».
  alternative: Смягчить или истолковать выражение как чисто грамматическую метафору.
  rationale: Это реальная, хотя и трудная, богословско-космологическая напряжённость текста; её нельзя скрывать редакционным пересказом.
- issue: Церковь как небесное собрание
  choice: Техническое имя передано как «Церковь», а поясняющее «assembly» — как «собрание».
  alternative: В обоих случаях использовать «церковь» либо «собрание».
  rationale: Различение сохраняет игру между именем и его объяснением, не отождествляя автоматически небесную реальность с земной институцией.
- issue: Преждевременное происхождение эонов
  choice: 'Сохранена синтаксическая альтернатива: «одним… или из единения».'
  alternative: Выбрать один способ происхождения как авторское учение.
  rationale: Текстовое свидетельство допускает неясность связи и референта; она оставлена открытой.
- issue: Будущие семена и приход Спасителя
  choice: Семена представлены как предназначенные для служения при приходе Спасителя и его спутников.
  alternative: Отождествить семена с конкретной конфессиональной группой или историческими лицами.
  rationale: Источник таких отождествлений не даёт, поэтому они не импортированы.
translation_notes:
  register: Современный литературный русский язык с dignified, но доступным синтаксисом. Специальные космологические наименования даны с прописной буквы; тяжёлые периоды умеренно расчленены без упрощения логики. Угловые скобки сохранены как редакционные восстановления, квадратные лакуны вынесены в сноски. Поскольку прямой анализ коптского текста ожидается, проект остаётся источниково осторожным и основан на предоставленном публичном английском свидетельстве.
