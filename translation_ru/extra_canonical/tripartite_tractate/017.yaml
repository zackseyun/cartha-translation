translation:
  language: ru
  text: 'Мысль Слова, которое вновь обрело устойчивость и стало владычествовать над теми, кто возник через него, была названа «Эоном» и «Местом» для всех, кого оно произвело согласно решению, а также тем, что называется «Собранием спасения», потому что оно исцелило себя от рассеяния, то есть от множественности мыслей, и возвратилось к единой мысли. Оно также называется «Хранилищем» — из-за покоя, который обрело и даровало лишь самому себе. [a] Оно называется и «Невестой» — из-за радости того, кто отдал себя ему в надежде на плод союза, того самого, кто явился ему. Оно называется и «Царством» — из-за обретённой им твёрдости, когда оно радовалось власти над теми, кто воевал против него. И оно называется «Радостью Господа» — из-за ликования, в которое [оно] облеклось. Свет пребывает с ним, воздавая ему за принадлежащие ему блага — то есть за мысль [или: мысли] о свободе.[b]


    Эон, о котором мы говорили прежде, выше двух порядков тех, кто сражается друг с другом. Он не принадлежит к тем, кто осуществляет власть, и не имеет отношения к немощам и слабостям — к тому, что относится к памяти и подобию. То, куда Слово поместило себя, было всецело радостным эоном: он обладал обликом вещества, но вместе с тем и природой своей причины — того, что было явлено, — поскольку являлся образом пребывающих в Полноте, возникших из богатства отрады Того, Кто Есть.


    Кроме того, радуясь лицу того, кто явил себя, его <отраде>, ожиданию и обещанию того, о чём он просил, он обладал именем Сына, его сущностью, силой и обликом. Это тот, кого он любил и в ком находил отраду, [c] тот, за кого с любовью возносились молитвы. Этот эон был светом, стремлением утвердиться, готовностью учиться и оком, способным видеть; всё это он получил от возвышенных. Кроме того, он был мудростью для его мысли, обращённой против находящихся ниже в замысле спасения, словом для речи и совершенством прочих подобных вещей.


    А у тех, кто вместе с ним обрёл облик по образу Полноты, родители — те, кто явил себя; каждый из них является подобием одного из образов. Будучи мужскими формами и происходя не от немощи, которая есть женственность, они происходят от того, кто уже избежал немощи. <Они> носят имя «Церковь», потому что своим согласием подобны согласию собрания тех, кто стал явным. Возникшее по образу света также совершенно, поскольку оно — образ единственного существующего света, то есть Совокупностей. Хотя оно ниже того, чьим образом является, оно всё же обладает его нераздельностью, ибо оно — лик нераздельного света.


    Однако возникшие по образу каждого из эонов по своей сущности являются тем, о чём мы говорили прежде, но по действующей в них силе они неравны, потому что в каждом из них она пребывает по-разному. В единении друг с другом они равны, [d] однако каждый <эон> сохранил присущие ему <особенности>. Поэтому у них есть страсти, а страсть есть немощь: ведь они были произведены не из единства Полноты, но преждевременно — одним, ещё до того, как он получил это от Отца, или из единения с Его Совокупностью и волей.[e]


    И всё же это послужило на благо будущему замыслу спасения. Им было позволено пройти через нижние места, потому что эти места не могут принять их внезапного прихода — только по одному. Их приход необходим, потому что через них всё будет приведено к завершению.


    Кратко говоря, Слово получило видение всего: тех, кто был, тех, кто есть ныне, и тех, кто будет, — потому что ему вверен замысел спасения всего существующего. Некоторые уже достигли бытия, поскольку этому соответствовал замысел. Семена же, которым ещё предстоит возникнуть, оно сохранило в себе ради обещания, относящегося к задуманному им, — обещания будущих семян. И оно произвело своё потомство, то есть откровение задуманного им. Однако до времени обещанным семенам не давали возникнуть, потому что они предназначены для служения тогда, когда придёт Спаситель и его спутники — первые в познании и славе Отца.'
