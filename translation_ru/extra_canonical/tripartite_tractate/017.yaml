  source_fidelity: 'Прямой коптский контроль пока невозможен: предоставлен лишь английский свидетельский перевод, поэтому сверка выполнена прежде всего с ним. В целом проект точно передаёт терминологию и сохраняет лакуны, редакционные добавления и неясные референты. Однако несколько мест требуют правки ради грамматики и более точного отражения английской синтаксической неоднозначности, особенно в описании преждевременного происхождения эонов и в заключительной фразе о приходе Спасителя и его спутников.'
  naturalness: 'Регистр в целом соответствует современному литературному русскому. Исправлены неестественные или грамматически неудачные обороты: «то, куда Слово поместило себя», «преждевременно — одним», а также согласование в «придёт Спаситель и его спутники».'
