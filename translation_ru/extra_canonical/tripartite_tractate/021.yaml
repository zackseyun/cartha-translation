translation:
  language: ru
  text: 'Материя, чья форма текуча, служит причиной слепоты, которая господствует посредством сил [. . .] в них всё это [. . .], когда они вместе порождают и [уничтожаются]. Мысль, помещённая между принадлежащими к [правой стороне и] принадлежащими к левой, есть сила [подражания]. Все, кого первые желают создать, подобны проекции тени, следующей за телом; это <и составляет> корни видимых творений.[a]


    Всё устроение образов, отображений и подобий было подготовлено ради нуждающихся в воспитании, наставлении и формировании, которое даётся посредством зеркала, чтобы малое могло расти шаг за шагом. По этой причине он создал человека последним, сперва приготовив и предоставив людям то, что создал ради них.


    Сотворение человека произошло так же, как и всего остального. Невидимым образом духовное Слово приводило их в движение, доводя их до завершения через Демиурга [] и его ангельских служителей, которые вместе с Самонадеянностью и её архонтами участвовали в формировании. Люди подобны тени земли, чтобы быть подобными [тем], кто отсечён от Совокупностей.[b] Они — создания всех их: принадлежащих к правой стороне и принадлежащих к левой; каждый чин придавал [человеку форму так же, как] некогда была (сформирована) сама Совокупность.


    [Форма], созданная Словом, была несовершенной, словно [поражённая] немощью, потому что он привёл её к [забвению], неведению, [недостаточности] и всякой иной немощи. Ведь Слово дало лишь первоначальную форму — <то, что оно дало ему> в неведении через Демиурга, — чтобы человек узнал, что существует нечто возвышенное и что он нуждается [в нём]. Это пророк назвал «живым Духом», «дыханием возвышенных эонов» и «невидимым»; это и есть живая душа, которая оживила тело, прежде безжизненное, а безжизненность есть неведение.


    Поэтому следует считать, что душа первого человека произошла от духовного Слова, тогда как Творец полагал, что создал её сам. Вдохнутое прошло через него, словно через уста.


    Из собственной сущности Творец также ниспослал души, поскольку и [он] обладает силой порождения, [] <будучи> произведён от отображения Отца. Принадлежащие к левой стороне тоже создали свой особый род человека, потому что и они обладают подобием <бытия>.


    Духовная сущность едина и представляет собой одно отображение, [а] её немощь — состояние [многих] форм. Состояние сущности душевных двойственно: она обладает знанием и восхваляет Возвышенного, но <также> склоняется ко злу из-за склонности Самонадеянности. Что же до сущности материальных, её образ существования различен и принимает несколько форм; это была немощь, возобладавшая во многих видах склонностей.[c]


    Итак, первый человек — многообразное образование, многообразное творение и вместилище принадлежащих к левой и к правой сторонам, а также духовное Слово, чьи устремления разделены между двумя сущностями, от которых оно получает своё бытие.


    Вот почему сказано, что для него был насаждён рай, чтобы он мог питаться плодами трёх видов деревьев: ведь это сад трёх чинов, дарующий наслаждение. Благородная и избранная сущность в нём была выше <творения>, и это <причиняло> им ущерб. Поэтому они дали заповедь, угрожая, что его постигнет великая опасность, [] то есть смерть. Ему позволили вкушать и наслаждаться лишь дурными деревьями, но с другого дерева — дерева двойственности — он не позволил [ему] есть, и тем более с дерева жизни. Чтобы человек не обрёл чести, [равной] их чести, и чтобы [он не . . .] их.


    Злая сила, называемая «змеем», — тот, кто хитрее всех злых сил, — ввела человека в заблуждение по замыслу принадлежащих памяти и желаниям. Она побудила его нарушить заповедь, чтобы он умер. И его изгнали оттуда, лишив всех тамошних наслаждений.


    Таково изгнание, которым они наказали его: он был удалён от наслаждений принадлежащих подобию и принадлежащих отображению. Но на деле это было действием провидения, чтобы люди поняли: наслаждения длятся лишь краткое время, в отличие от вечного места покоя. Дух предопределил это действие, заранее замыслив, чтобы человек испытал великое зло — смерть, то есть полное неведение о Совокупности, — а также вкусил все проистекающие из неё бедствия; и чтобы после страстей, тревог и всего, что от них происходит, он обрёл величайшее [] благо — вечную жизнь, то есть полное познание Совокупностей и обретение всякого блага.


    Из-за непослушания первого человека воцарилась смерть. Она убивала каждого человека, пока обладала [властью] и господствовала; эту власть как царство она получила ради <упомянутого выше> замысла спасения, по воле Отца.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Квадратные скобки и многоточия обозначают повреждения или утраты текста; угловые скобки — редакционные восполнения; круглые скобки сохраняют пояснительные элементы исходного свидетельства.
    reason: Нужно объяснить читателю все сохранённые текстологические сигналы.
  - marker: b
    text: «Совокупность/Совокупности» — техническое обозначение полноты высшей реальности в космологии трактата.
    reason: Термин необычен в современном русском и иначе может быть понят как простая сумма предметов.
  - marker: c
    text: «Духовные», «душевные» и «материальные» здесь обозначают три класса сущности в понятийной системе трактата.
    reason: Поясняет специальную антропологическую классификацию, не навязывая ей позднейшей конфессиональной интерпретации.
lexical_decisions:
- source_word: Demiurge
  choice: Демиург
  rationale: Сохранён технический термин трактата, отличаемый от «Творца» там, где свидетель использует Creator.
- source_word: Totalities / Totality
  choice: Совокупности / Совокупность
  rationale: Передаёт специальное космологическое понятие без отождествления с более поздним конфессиональным термином «Плерома».
- source_word: soulish ones
  choice: душевные
  rationale: Сохраняет трёхчастное различение духовного, душевного и материального и звучит приемлемо в философско-религиозном русском регистре.
- source_word: presumption
  choice: Самонадеянность
  rationale: Прописная буква отражает персонифицированный космологический субъект; слово сохраняет смысл дерзкой самоуверенности.
- source_word: representation
  choice: отображение
  rationale: Отличено от «образа» и «подобия», чтобы сохранить терминологический ряд images, representations, likenesses.
- source_word: Word
  choice: Слово
  rationale: Сохранён личностно-космологический титул с прописной буквы без преждевременного догматического уточнения.
theological_decisions:
- issue: Происхождение души первого человека
  choice: Сохранено напряжение между действием духовного Слова и ошибочным предположением Творца
  alternative: Свести обоих к единому действующему субъекту
  rationale: Текст намеренно различает истинный источник души и представление Творца о собственном авторстве.
- issue: Изгнание как наказание и провидение
  choice: 'Сохранены оба утверждения: наказание со стороны сил и действие провидения'
  alternative: Истолковать изгнание только как зло либо только как спасительное благо
  rationale: Двойная оценка является существенным богословским напряжением отрывка.
- issue: Роль змея
  choice: Змей назван злой силой, действующей по чужому замыслу
  alternative: Представить змея освободителем или самостоятельным главным виновником
  rationale: Ни одна из таких конкретизаций не подтверждается данным свидетельством.
- issue: Смерть и замысел спасения
  choice: Сохранено парадоксальное получение смертью царства ради замысла спасения по воле Отца
  alternative: Ослабить причинную связь или устранить волю Отца
  rationale: Заключительная фраза прямо удерживает эту трудную связь, которую нельзя конфессионально сглаживать.
translation_notes:
  register: Современный литературный русский с достоинством позднеантичного философско-религиозного трактата. Синтаксис умеренно упрощён для ясности, но повторения и терминологические различия сохранены. Черновик основан на предоставленном англоязычном публичном свидетельстве; прямая сверка с коптским оригиналом ещё требуется.
