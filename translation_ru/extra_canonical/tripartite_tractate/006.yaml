base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/006.yaml
  text: '<...> Just as the wondrous acts of the silences are eternal generations and intellectual offspring, so the qualities of the Word are spiritual emanations. Because they belong to speech, [] both [the wondrous acts] and the qualities are seeds and thoughts of his offspring, living and eternal roots that appear as self-originating offspring. They exist as minds and spiritual offspring for the glory of the Father.


    [Being] spirits and minds, they do not need sound or speech, nor do they need to perform [an act] to obtain what they wish to [have done]. Instead, following the pattern of [the Father’s] own existence, [those] who originate from him beget whatever they wish. And he has child<ren>: the one of whom they think and speak, toward whom they move, in whom they subsist, and to whom they sing hymns to glorify him. For this is their power of procreation, resembling those from whom they originated and consistent with their shared assistance, since they help one another as those who are unbegotten do.


    The Father, in keeping with his exalted place above the Totalities, is unknown and ungraspable. He possesses such greatness and magnitude that, if it were revealed suddenly and immediately, it would destroy all the lofty beings among the aeons who originated from him. Therefore, he restrained his strength and his infinite resources, which constitute his [] being, [remaining] unspeakable and unnameable, exalted above every mind and all speech.


    Yet this is the one who stretched himself out, and what he stretched out formed a foundation, a place, and a dwelling for the universe. One of his names is the One by Whom, because he is the Father of All. Through his labor on behalf of the existing ones, he sowed within them the thought of searching for him. The wealth of their [. . .] is that they grasp that he exists and inquire into what was existent.'
translation:
  language: ru
  text: '<…> И как дивные деяния безмолвий — это вечные порождения и умопостигаемые потомки, так и свойства Слова — духовные истечения. Поскольку они относятся к речи, [] и [дивные деяния], и свойства — семена и мысли его потомков, живые вечные корни, являющиеся как саморождённые потомки. Они существуют как умы и духовные потомки во славу Отца.


    [Будучи] духами и умами, они не нуждаются ни в звуке, ни в речи; им не нужно совершать [какое-либо действие], чтобы получить желаемое. Напротив, следуя образцу собственного бытия [Отца], [те], кто происходит от Него, порождают всё, что пожелают. И у Него есть дитя<дети>[a] — Тот, о Ком они думают и говорят, к Кому устремляются, в Ком пребывают и Кому поют гимны, прославляя Его. Ибо такова их сила порождения: она подобна силе тех, от кого они произошли, и согласуется с их взаимной поддержкой, поскольку они помогают друг другу, как и нерождённые.


    Отец, пребывающий на Своём возвышенном месте над Совокупностями[b], неведом и непостижим. Его величие и мощь таковы, что, если бы они открылись внезапно и сразу, то уничтожили бы всех возвышенных существ среди эонов, произошедших от Него. Поэтому Он удержал Свою силу и Свои неисчерпаемые богатства, составляющие Его [] бытие, [оставаясь] неизречённым и безымянным, превыше всякого ума и всякой речи.


    И всё же именно Он распростёр Себя, и то, что Он распростёр, стало основанием, местом и обителью для вселенной. Одно из Его имён — «Тот, через Кого»[c], потому что Он — Отец всего. Своим трудом ради существующих Он посеял в них мысль искать Его. Их богатство [. . .] в том, что они постигают: Он существует, — и исследуют то, что существовало.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Форма «дитя<дети>» сохраняет редакционную помету свидетельства: число слова в повреждённом месте не вполне определённо.'
    reason: Текстологическая неопределённость влияет на синтаксис и смысл следующей фразы.
  - marker: b
    text: «Совокупности» — техническое обозначение полноты или совокупностей божественной области; в данном месте слово стоит во множественном числе.
    reason: Нужно пояснить необычное нарицательное слово, не заменяя его конфессионально нагруженным эквивалентом.
  - marker: c
    text: 'Буквально: «Тот, посредством Кого»; необычная форма передана как имя-титул.'
    reason: Имя в источнике синтаксически необычно и допускает оттенок посредничества.
lexical_decisions:
- source_word: acts of wonder by the silences
  choice: дивные деяния безмолвий
  rationale: Сохраняет необычную множественную персонификацию «безмолвий» и не сводит выражение к обычным чудесам.
- source_word: intellectual offspring
  choice: умопостигаемые потомки
  rationale: Передаёт связь с областью ума, избегая современного смысла «интеллектуальное потомство».
- source_word: qualities of the Word
  choice: свойства Слова
  rationale: «Свойства» нейтрально сохраняет метафизическое значение qualities; «Слово» оформлено как титул.
- source_word: spiritual emanations
  choice: духовные истечения
  rationale: «Истечения» естественно передаёт образ происхождения, не подменяя его термином конкретной позднейшей системы.
- source_word: subsist
  choice: пребывают
  rationale: Сохраняет онтологический оттенок, оставаясь понятным современному читателю.
- source_word: Totalities
  choice: Совокупности
  rationale: Сохраняет техническое множественное число и отличие от последующего «всего».
- source_word: aeons
  choice: эоны
  rationale: Устоявшаяся передача технического термина в гностическом контексте.
- source_word: the One by Whom
  choice: Тот, через Кого
  rationale: Сохраняет инструментально-посредническое значение имени и его намеренную необычность.
theological_decisions:
- issue: Единственное или множественное число в повреждённой форме child<ren>
  choice: дитя<дети>
  alternative: дети
  rationale: Редакционный сигнал источника сохранён, поскольку он влияет на возможное понимание следующего единственного числа.
- issue: Референт единственного числа «the one» после child<ren>
  choice: Тот, о Ком…
  alternative: тот, о ком…
  rationale: Заглавная буква отражает явную направленность хвалы и пребывания, но текст не отождествляется с какой-либо поздней догматической формулой.
- issue: Сокрушительное откровение величия Отца
  choice: если бы они открылись… уничтожили бы
  alternative: если бы оно открылось… уничтожило бы
  rationale: Множественное число естественно соотносит действие с парой «величие и мощь», не разрешая метафизическое напряжение текста.
- issue: unbegotten во множественном числе
  choice: нерождённые
  alternative: Нерождённые
  rationale: Строчная буква не превращает описательную категорию в установленное собственное имя.
- issue: what was existent
  choice: то, что существовало
  alternative: Сущего
  rationale: Сохранена временная и референциальная неопределённость исходного свидетельства без внесения платонизирующего термина.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным метафизическим регистром. Сохранены угловые скобки, квадратные скобки, лакуны и многоточия исходного свидетельства. Поскольку прямая сверка с коптским текстом ещё не проведена, решения остаются предварительными и основаны на предоставленном публичном английском свидетельстве.
