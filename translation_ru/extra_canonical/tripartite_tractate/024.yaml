  text: 'Out of an inclination toward mercy, our Savior became the same as those for whose sake he appeared had become through an instinctive passion—namely, flesh and soul, which constantly rule over them, so that they are destroyed and die. Yet those who [came into being] [] [as] invisible and invisibly, he taught about himself invisibly. He not only took on <himself> the death of those he intended to save, but also embraced the smallness into which they had fallen when they were <born> with body and soul, because he chose to be born as a child with body and soul. He shared in all the other conditions shared by those who had fallen, even though they possessed the light and he was exalted above them, because he chose to be conceived without sin, impurity, or corruption. He was begotten into physical life while dwelling in life, because it had been determined that both would equally become body and soul on account of the passion and shifting inclination from the Word, who had stirred himself
    in conversion.


    But according to the plan of salvation, it was he <who> took upon himself the results of the things we mentioned before—namely, what came into being from the illuminating vision and the firm thought of the Word after his self-conversion, after he stirred himself. This is how those who, like him, assumed body and soul, as well as establishment, stability, and wisdom. It had been determined beforehand that they would come together with the coming of the Savior, which had also been determined beforehand. Only when the Savior had made the decision did they also come. Thus they came, far surpassing in their fleshly emanation those who had been produced from the deficiency, [] because this was how they too underwent bodily emanation, as did the Savior, through the revelation of their union with him.


    These are those of a single substance, namely, the spiritual substance. The plan of salvation, however, is diverse: this is one thing, and that is another. Some emerge from passion and division and need healing. Others issue from the prayer that heals the sick and are appointed to treat the fallen. These are the apostles and the preachers of the message. They are the students of the Savior and the instructors of those who need teaching.


    Why, then, do they also share in the same passions as those who were produced from passion, if, according to the plan of salvation, they were produced in one body with <the> Savior, who did not share in such passions? The Savior was an image of a single entity, being the Totality in bodily form. Consequently, he preserved the pattern of inseparability, from which impassability comes. But they are images of each one who was revealed. This is why they embrace separation from their pattern, since they took on form for the planting that exists beneath heaven and that also [] shares in the evil prevailing in the places they have reached. For the will held the Totality captive under sin, so that by will he could show mercy to the Totality and they could be saved, since the one who is singular is chosen to give life, while all the rest need salvation.


    Because of this, he was the first among those to receive the grace of bestowing the gifts proclaimed by those whom he considered worthy of preaching to others. For <the> seed of the promise of Jesus Christ was put in place, whose revelation and union we have served. The promise made teaching possible, including the return to what they had been in the beginning. They possess a drop inclining them to return to it. This is what they call “redemption,” which is release from captivity and the attainment of freedom.


    The captivity is that of those who were enslaved to ignorance. In contrast, freedom is knowledge of the truth that existed before ignorance and prevails eternally, without beginning and without end. It is what is good, a cure for everything, and a release from the enslaving nature that caused suffering to those who had been produced in a lowly thought of emptiness—the nature of the evil inclination, [] through the thought that degrades them into lust for control. From the wealth of grace that looked upon the children, they received the treasure of freedom. Freedom casts down passion and destroys those things that it had earlier cast away from itself when the Word separated them from himself. He destined them for destruction until <the> the plan of salvation ends, and he allowed them to continue to exist because they too were useful for the things that had been predetermined.'
translation:
  language: ru
  text: 'Из склонности к милосердию наш Спаситель стал таким же, какими вследствие непроизвольной страсти стали те, ради кого он явился, — то есть плотью и душой, которые постоянно господствуют над ними, так что они гибнут и умирают. А тех, кто [возник]… [как] невидимые и невидимым образом[a], он невидимо учил о самом себе. Он не только принял на себя[b] смерть тех, кого намеревался спасти, но принял и их малость, до которой они ниспали, когда родились[b] с телом и душой, ибо он благоволил родиться младенцем с телом и душой. Он разделил и все прочие состояния тех, кто пал, хотя они обладали светом, а он был превознесён над ними, ибо благоволил быть зачатым без греха, нечистоты и тления. Он был рождён для телесной жизни, пребывая в Жизни, потому что было определено, чтобы оба[c] в равной мере стали телом и душой вследствие страсти и изменчивого уклонения от Слова, которое пробудилось, обратившись.


    Но ради замысла спасения именно он принял на себя[b] последствия того, о чём мы говорили прежде, — того, что возникло из просвещающего видения и твёрдой мысли Слова после того, как оно обратилось к самому себе и пробудилось. Таковы те, кто, подобно ему, принял тело и душу, а также утверждённость, стойкость и мудрость. Было предопределено, что они придут вместе с пришествием Спасителя, которое тоже было предопределено. Лишь когда Спаситель принял решение, пришли и они. Итак, в своём плотском истечении они явились, намного превосходя тех, кто был порождён недостатком…[d] Ведь и они, подобно Спасителю, претерпели телесное истечение через откровение об их единении с ним.


    Они — одной сущности, а именно духовной. Однако замысел спасения многообразен: одно — это, другое — то. Одни происходят из страсти и разделения и нуждаются в исцелении. Другие исходят из молитвы, исцеляющей больных, и поставлены врачевать падших. Это апостолы и вестники благой вести. Они — ученики Спасителя и наставники тех, кто нуждается в учении.


    Почему же тогда и они разделяют те же страсти, что и порождённые страстью, если по замыслу спасения они были порождены в одном теле со Спасителем[b], который таким страстям не был причастен? Спаситель был образом единого сущего, будучи Всецелостью в телесном виде. Поэтому он сохранил образец нераздельности, из которой происходит неподверженность страданию[e]. Они же — образы каждого из явленных. Поэтому они допускают отделение от своего образца, ведь они приняли облик ради насаждения, которое существует под небом и также…[d] причастно злу, господствующему в тех местах, которых они достигли. Ибо воля удержала Всецелость в плену под властью греха, чтобы по своей воле он мог явить милость Всецелости и чтобы они могли спастись, поскольку один, единственный, избран даровать жизнь, тогда как все остальные нуждаются в спасении.


    Поэтому он первым среди них получил благодать раздавать дары, о которых возвещали те, кого он счёл достойными проповедовать другим. Ибо было посеяно семя обетования Иисуса Христа[b], откровению и единению которого мы послужили. Обетование сделало возможным учение, в том числе возвращение к тому, чем они были в начале, поскольку в них есть капля, склоняющая их вернуться к этому. Именно это они называют «искуплением» — освобождением из плена и обретением свободы.


    Этот плен — удел порабощённых неведением. Свобода же — познание истины, которая существовала прежде неведения и вечно пребывает без начала и конца. Она есть благо, исцеление от всего и освобождение от порабощающей природы, причинявшей страдания тем, кто был порождён низменной мыслью о пустоте, — природы злого уклонения…[d] посредством мысли, унижающей их до жажды господства. Из богатства благодати, воззревшей на детей, они получили сокровище свободы. Свобода низлагает страсть и уничтожает то, что прежде отринуло от себя[f], когда Слово отделило это от себя. Он предназначил их к уничтожению, пока не завершится замысел спасения[b], и позволил им продолжать существовать, потому что и они были полезны для предопределённого.


    [a] Текст рукописи в этом месте повреждён; связь слов и точное восстановление неясны.

    [b] Слово или выражение восстановлено издателями в повреждённом либо неполном месте текста.

    [c] Неясно, к каким именно двум сторонам относится слово «оба».

    [d] В рукописи здесь лакуна.

    [e] Буквально и в терминологическом смысле: состояние, не испытывающее страстей или страдания.

    [f] Место синтаксически неясно: в доступном свидетельстве субъект действия может пониматься иначе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Текст рукописи в этом месте повреждён; связь слов и точное восстановление неясны.
    reason: Сохраняет заметную читателю лакуну и не создаёт ложной уверенности в реконструкции.
  - marker: b
    text: Слово или выражение восстановлено издателями в повреждённом либо неполном месте текста.
    reason: Отмечает редакторские дополнения, обозначенные угловыми скобками в свидетельстве.
  - marker: c
    text: Неясно, к каким именно двум сторонам относится слово «оба».
    reason: Сохраняет референциальную неоднозначность выражения both.
  - marker: d
    text: В рукописи здесь лакуна.
    reason: Обозначает явные пропуски исходного свидетельства.
  - marker: e
    text: 'Буквально и в терминологическом смысле: состояние, не испытывающее страстей или страдания.'
    reason: Поясняет семантическую широту impassability и связь с предшествующим словом «страсти».
  - marker: f
    text: 'Место синтаксически неясно: в доступном свидетельстве субъект действия может пониматься иначе.'
    reason: Не позволяет русской грамматике скрыть неясность субъекта в заключительном абзаце.
lexical_decisions:
- source_word: Savior
  choice: Спаситель
  rationale: Устоявшийся и понятный русский богословский эквивалент, соответствующий функции фигуры в трактате.
- source_word: flesh and soul
  choice: плоть и душа / тело и душа
  rationale: «Плоть» сохранена там, где выражена антропологическая характеристика; «тело» употреблено в контекстах рождения и принятия телесного облика для естественности русского текста.
- source_word: plan of salvation
  choice: замысел спасения
  rationale: Передаёт устроение или домостроительный план, не навязывая поздней конфессиональной терминологии.
- source_word: Word
  choice: Слово
  rationale: Сохранён персонифицированный технический термин с прописной буквы.
- source_word: Totality
  choice: Всецелость
  rationale: Техническое обозначение совокупной полноты передано последовательно и отличено от обычного «всё».
- source_word: emanation
  choice: истечение
  rationale: Сохранён метафизический образ происхождения, а не нейтрализован словами «рождение» или «возникновение».
- source_word: impassability
  choice: неподверженность страданию
  rationale: Передаёт смысл без неестественного для широкого читателя термина «бесстрастие»; сноска сохраняет терминологическую широту.
- source_word: redemption
  choice: искупление
  rationale: Устоявшийся эквивалент, причём сам текст непосредственно поясняет его как освобождение из плена.
- source_word: knowledge
  choice: познание
  rationale: Подчёркивает обретённое и действенное знание истины, не вводя непереведённый термин «гносис».
- source_word: planting
  choice: насаждение
  rationale: Сохранена необычная метафора исходного свидетельства вместо её истолковывающей замены.
theological_decisions:
- issue: Участие Спасителя в человеческом состоянии
  choice: Сохранено различие между принятием смерти и малости, разделением состояний падших и зачатием без греха, нечистоты и тления.
  alternative: Свести изложение к поздней формуле о двух природах или к определённой доктрине воплощения.
  rationale: Текст обладает собственной антропологией и христологическим напряжением; перевод не должен подменять их конфессиональной систематизацией.
- issue: Техническое понятие единой духовной сущности
  choice: «Одной сущности, а именно духовной».
  alternative: «Единосущны» или «имеют одну природу».
  rationale: «Единосущны» могло бы преждевременно импортировать никейскую терминологию; аналитическая формулировка ближе к доступному свидетельству.
- issue: Всецелость и единственный податель жизни
  choice: Сохранены необычные формулировки о пленении Всецелости и избрании одного, единственного, даровать жизнь.
  alternative: Уточнить референты и согласовать высказывание с определённой сотериологией.
  rationale: Референты и логическая связь в свидетельстве не вполне ясны, поэтому напряжение оставлено открытым.
- issue: Свобода как познание истины
  choice: Определение сохранено буквально по смыслу, без замены на оправдание, освящение или иной систематический термин.
  alternative: Истолковать свободу в рамках конкретной конфессиональной схемы спасения.
  rationale: Автор сам связывает плен с неведением, а свободу — с познанием предвечной истины.
- issue: Место о воле
  choice: «Воля удержала Всецелость в плену… чтобы по своей воле он мог явить милость».
  alternative: Отождествить «волю» с конкретным лицом или исправить смену грамматического субъекта.
  rationale: Доступное английское свидетельство сохраняет неясность субъекта; перевод не разрешает её без коптской проверки.
translation_notes:
  register: 'Современный литературный русский язык с возвышенным, но общедоступным регистром. Необычные метафизические термины сохранены там, где они несут смысловую нагрузку, и не заменены конфессиональными формулами. Проект предварительный: он основан на предоставленном общедоступном английском свидетельстве; прямая сверка с коптским текстом Наг-Хаммади I,5 ещё требуется.'
