  source_fidelity: Сверка возможна только с предоставленным английским свидетельством; прямая проверка коптского текста пока недоступна. В целом передача близка к свидетельству и корректно сохраняет лакуны, редакторские дополнения и ряд референциальных неясностей. Однако в заключительном абзаце русская фраза ошибочно делает «то, что… отринуло» субъектом действия, тогда как свидетельство говорит, что свобода ранее отбросила эти вещи от себя. Также несколько формулировок уточнены для более точной передачи образов и синтаксических связей свидетельства.
