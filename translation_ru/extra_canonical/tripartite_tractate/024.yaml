  revised_text: 'Из склонности к милосердию наш Спаситель стал таким же, какими вследствие инстинктивной страсти стали те, ради кого он явился, — то есть плотью и душой, которые постоянно господствуют над ними, так что они гибнут и умирают. А тех, кто [возник]… [как] невидимые и невидимым образом[a], он невидимо учил о самом себе. Он не только принял на себя[b] смерть тех, кого намеревался спасти, но принял и их малость, до которой они ниспали, когда родились[b] с телом и душой, ибо он благоволил родиться младенцем с телом и душой. Он разделил и все прочие состояния тех, кто пал, хотя они обладали светом, а он был превознесён над ними, ибо благоволил быть зачатым без греха, нечистоты и тления. Он был порождён к телесной жизни, пребывая в Жизни, потому что было определено, чтобы оба[c] в равной мере стали телом и душой вследствие страсти и изменчивого уклонения от Слова, которое пробудилось в обращении.


    Но ради замысла спасения именно он принял на себя[b] последствия того, о чём мы говорили прежде, — того, что возникло из просвещающего видения и твёрдой мысли Слова после того, как оно обратилось к самому себе и пробудилось. Таковы те, кто, подобно ему, принял тело и душу, а также утверждённость, стойкость и мудрость. Было предопределено, что они придут вместе с пришествием Спасителя, которое тоже было предопределено. Лишь когда Спаситель принял решение, пришли и они. Итак, в своём плотском истечении они явились, намного превосходя тех, кто был порождён недостатком…[d] Ведь и они, подобно Спасителю, претерпели телесное истечение через откровение об их единении с ним.


    Они — одной сущности, а именно духовной. Однако замысел спасения многообразен: одно — это, другое — то. Одни происходят из страсти и разделения и нуждаются в исцелении. Другие исходят из молитвы, исцеляющей больных, и поставлены врачевать падших. Это апостолы и вестники благой вести. Они — ученики Спасителя и наставники тех, кто нуждается в учении.


    Почему же тогда и они разделяют те же страсти, что и порождённые страстью, если по замыслу спасения они были порождены в одном теле со Спасителем[b], который таким страстям не был причастен? Спаситель был образом единого сущего, будучи Всецелостью в телесном виде. Поэтому он сохранил образец нераздельности, из которой происходит неподверженность страданию[e]. Они же — образы каждого из явленных. Поэтому они допускают отделение от своего образца, ведь они приняли облик ради насаждения, которое существует под небом и также…[d] причастно злу, господствующему в тех местах, которых они достигли. Ибо воля удержала Всецелость в плену под властью греха, чтобы по своей воле он мог явить милость Всецелости и чтобы они могли спастись, поскольку один, единственный, избран даровать жизнь, тогда как все остальные нуждаются в спасении.


    Поэтому он первым среди них получил благодать раздавать дары, возвещаемые теми, кого он счёл достойными проповедовать другим. Ибо было положено семя обетования Иисуса Христа[b], откровению и единению которого мы послужили. Обетование сделало возможным учение, в том числе возвращение к тому, чем они были в начале, поскольку в них есть капля, склоняющая их вернуться к этому. Именно это они называют «искуплением» — освобождением из плена и обретением свободы.


