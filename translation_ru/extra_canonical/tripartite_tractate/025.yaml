base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/025.yaml
  text: 'Humans came to be divided into three natural categories: the spiritual, the soulish, and the material. These correspond to the Word’s threefold inclination, from which the material, the soulish, and the spiritual were produced. Each of the three natural categories is known by its fruit. They were not known at first, however, but only when the Savior came, shone upon the saints, and revealed which category each one belonged to.


    The spiritual category is like light from light and spirit from spirit. When its head appeared, it immediately hurried toward its proper category. Suddenly it grew a body for its head and immediately received knowledge through the revelation.


    The soulish category, by contrast, is like light from fire. It was hesitant to recognize [] the one who appeared to it and even more hesitant to hurry toward him through faith. Instead, although a voice instructed it, <it> was satisfied, because it was not far from the hope of the promise. It received, as it were, assurance of the things to come in the form of a pledge.


    The material category, by contrast, is alien in every way, because it resembles darkness and rejects the light that shines, since its manifestation extinguishes it. Because it did not welcome his <coming>, it is <immoderate> and full of spite toward the revelation of the Lord.


    The spiritual category will receive complete salvation in every respect. The material category will be destroyed in every respect, as happens to an adversary. Because of its middle position, both in the way it was produced and in its nature, the soulish category is duality, corresponding to its inclination toward both good and evil. What has been determined for it is ambiguous <…> and its complete escape <from> what is good.


    Those whom the Word produced according to the preexistent pattern in his thought, when he remembered the Exalted One and prayed for salvation, received salvation immediately. [Because] of the saving thought, they were saved completely by what it produced. The same applies to [the ones] whom these produced in their turn, [] whether angels or humans. Because they acknowledge that one exists who is more exalted than they are, and because they pray and seek after him, they too will receive the same salvation received by those who were produced, since they come from the good inclination. They were assigned the service of proclaiming the Savior’s future coming and his revelation after he had come. Whether angels or humans, when he appointed them to this service, they truly received the nature of their being.


    By contrast, those who came from the thought of lust for control, who came into being through the blow struck by his opponents, were produced by that thought. Since they are mixed, they will receive an ambiguous end. Those who cast off the lust for control that was granted to them only for a time and for particular periods, who glorify the Lord of glory, and who renounce their anger, will receive the reward for their humility, which is unending existence.


    By contrast, those who are arrogant because of their lust for ambition, who love passing glory, and who forget that authority was delegated to them only for particular periods and times—and who therefore did not confess that the Son of God [] is the Lord of all and Savior, and did not renounce their anger or stop imitating the evil ones—will suffer retribution for their ignorance and foolish passion, together with those who have gone astray and wandered away.


    Even more evil are those who committed improper acts against the Lord, as the powers of the left did against him, even putting him to death. They said to themselves, “We will become masters of the Totality if the one proclaimed king of the Totality is killed.” They worked toward this end—the humans and angels who do not belong to the good inclination of those on the right, but come from the mixture. They chose self-glory, even though it is only passing glory and lust, while the way to eternal repose is through humility (that results in) salvation, being of those who are to be saved, those on the right.


    After they praise the Lord, consider what is pleasing to the Church, and sing the hymn of the humble together with her as fully as possible, doing what pleases her, they will share in her sufferings and anguish like those who consider what is good for the Church. They will receive a share in her hope. This applies [] to humans and angels.


    The path of those belonging to the order of the left leads to destruction, because they not only rejected the Lord and devised an evil plot against him, but also directed their hatred, envy, and jealousy against the Church. This is the reason for the condemnation of those who have troubled the Church, even inciting themselves to create <trials> for the Church.'
translation:
  language: ru
  text: 'Люди разделились на три природные категории: духовных, душевных и материальных.[a] Они соответствуют тройственному устремлению Слова, от которого произошли материальные, душевные и духовные. Каждая из трёх природных категорий узнаётся по своему плоду. Однако с самого начала они ещё не были распознаны — это произошло лишь тогда, когда пришёл Спаситель, воссиял над святыми и открыл, к какой категории принадлежит каждый.


    Духовная категория подобна свету от света и духу от духа. Когда явилась её глава, она тотчас устремилась к <своей категории>. Внезапно она стала телом для своей главы и сразу же обрела знание через откровение.


    Душевная же категория подобна свету от огня. Она медлила признать [] того, кто ей явился, и ещё более медлила устремиться к нему через веру. Но хотя голос наставлял её, <она> довольствовалась этим, потому что находилась недалеко от надежды, заключённой в обещании: она получила как бы залог, удостоверяющий грядущее.


    Материальная же категория во всём чужда свету, потому что подобна тьме и отвергает сияющий свет, ведь его явление уничтожает её. И поскольку она не приняла его <пришествия>, она <не знает меры> и исполнена злобы против откровения Господа.


    Духовная категория во всех отношениях обретёт полное спасение. Материальная категория во всех отношениях будет уничтожена, как уничтожают противника. Душевная же категория из-за своего промежуточного положения — как по происхождению, так и по природе — двойственна, что соответствует её склонности и к добру, и ко злу. Поэтому определённая для неё участь неоднозначна <…>, как и её полное удаление <от> добра.[b]


    Те, кого Слово произвело по предсуществовавшему образцу в своей мысли, обрели спасение сразу же, когда оно вспомнило о Превознесённом и помолилось о спасении. [Благодаря] спасительной мысли они были полностью спасены тем, что она произвела. То же относится и к [тем], кого они, в свою очередь, произвели, [] — будь то ангелы или люди. Признавая, что существует Тот, кто превыше их, молясь и стремясь к нему, они тоже обретут то же спасение, какое обрели произведённые прежде, потому что происходят от доброго устремления. Им было поручено возвещать будущее пришествие Спасителя и его откровение после того, как он пришёл. Будь то ангелы или люди, когда он назначил их на это служение, они действительно обрели природу своего бытия.


    Те же, кто произошёл от мысли, жаждавшей властвовать, и возник от удара, нанесённого его противниками, были порождены этой мыслью. Поскольку они смешанны, их конечная участь будет неоднозначной. Те, кто отвергнет жажду власти, данной им лишь на время и на определённые сроки, прославит Господа славы и отречётся от своего гнева, получат награду за смирение — нескончаемое существование.


    Но те, кто превозносится из-за честолюбивой жажды, любит преходящую славу и забывает, что власть была доверена им лишь на определённые сроки и времена, — и потому не исповедует, что Сын Божий [] есть Господь всего и Спаситель, не отрекается от своего гнева и не перестаёт подражать злым, — понесут воздаяние за своё неведение и безрассудную страсть вместе с теми, кто заблудился и уклонился от пути.


    Ещё хуже те, кто совершил недолжное против Господа, как поступили с ним силы левой стороны, даже предав его смерти. Они рассуждали: «Мы станем владыками Целого,[c] если будет убит тот, кто провозглашён царём Целого». Ради этого и действовали люди и ангелы, принадлежащие не к доброму устремлению тех, кто справа, а к смешению. Они избрали собственную славу, хотя она — лишь преходящая слава и вожделение. Путь же к вечному покою лежит через смирение, <ведущее к> спасению, через принадлежность к тем, кому предстоит спастись, — к тем, кто справа.


    Когда они прославят Господа, помыслят о том, что угодно Церкви, и вместе с ней, насколько возможно полно, воспоют гимн смиренных, поступая угодно ей, они разделят её страдания и скорби, как те, кто заботится о благе Церкви, и получат долю в её надежде. Это относится [] и к людям, и к ангелам.


    Путь принадлежащих к чину левой стороны ведёт к погибели, потому что они не только отвергли Господа и замыслили против него зло, но и обратили свою ненависть, зависть и ревность против Церкви. В этом причина осуждения тех, кто причинял Церкви страдания, даже побуждая самих себя создавать для неё <испытания>.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Названия «духовные», «душевные» и «материальные» обозначают три категории в собственной системе трактата; их не следует автоматически отождествлять с позднейшими конфессиональными классификациями.
    reason: Предотвращает анахроническую богословскую гармонизацию ключевых терминов.
  - marker: b
    text: В этом месте текст повреждён, а синтаксическая связь неясна; угловые скобки и многоточие сохраняют признаки реконструкции и лакуны в доступном свидетельстве.
    reason: Честно отмечает существенную текстовую неопределённость, влияющую на смысл участи душевной категории.
  - marker: c
    text: «Целое» — технически окрашенное обозначение совокупности всего сущего в космологии трактата.
    reason: Поясняет непривычное русское употребление без подмены термина более узким толкованием.
lexical_decisions:
- source_word: spiritual / soulish / material
  choice: духовные / душевные / материальные
  rationale: Сохранена трёхчастная терминология свидетельства без сведения «душевного» к «психическому» или «материального» к морально отрицательному понятию.
- source_word: inclination
  choice: устремление; в отдельных контекстах — склонность
  rationale: «Устремление» передаёт деятельную направленность мысли Слова, а «склонность» естественнее там, где речь идёт о выборе между добром и злом.
- source_word: Word
  choice: Слово
  rationale: Сохранено личностное и титульное употребление с прописной буквы без дополнительного отождествления, которого данный фрагмент прямо не формулирует.
- source_word: Totality
  choice: Целое
  rationale: Технически окрашенный термин передан буквально и единообразно, без замены на «вселенную», «мир» или «Плерому».
- source_word: head / body
  choice: глава / тело
  rationale: Сохранена телесно-экклезиологическая образность и её непривычная логика, а не устранена пересказом.
- source_word: right / left
  choice: те, кто справа / силы (чин) левой стороны
  rationale: Сохранена пространственная символика текста без конфессиональной или систематической расшифровки.
theological_decisions:
- issue: Неодинаковая участь трёх категорий
  choice: Сохранить категорические формулировки о спасении, уничтожении и неоднозначной участи
  alternative: Смягчить их как описание свободного нравственного выбора каждого человека
  rationale: Смягчение устранило бы космологическое и антропологическое напряжение самого трактата.
- issue: Двойственность душевной категории
  choice: Оставить «участь неоднозначна» и повреждённую фразу об удалении от добра
  alternative: Истолковать её как однозначную возможность спасения или гибели
  rationale: Свидетельство не позволяет уверенно восстановить связный и однозначный вывод.
- issue: Отношение смирения к спасению
  choice: Передать повреждённую связь как «смирение, <ведущее к> спасению»
  alternative: Утверждать, что смирение само по себе является причиной или основанием спасения
  rationale: Угловые скобки сохраняют редакционную реконструкцию и не превращают её в бесспорную догматическую формулу.
- issue: Сын Божий как Господь всего и Спаситель
  choice: Сохранить исповедальную формулу без расширения
  alternative: Дополнить её позднейшими соборными определениями
  rationale: Перевод не должен вносить в текст формулировки, которых во фрагменте нет.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным синтаксисом. Повторы категориальных названий сохранены ради структуры рассуждения. Квадратные скобки, угловые скобки и многоточие воспроизводят сигналы повреждений и редакционных восстановлений в предоставленном англоязычном свидетельстве. Поскольку прямая сверка с коптским текстом ещё не выполнена, формулировки остаются предварительными и не скрывают спорные места.
