  verdict: revise
  source_fidelity: 'Прямая сверка с коптским текстом в материалах не представлена; поэтому проверка ограничена данным английским свидетельством и English POB. В целом смысл передан близко, а сигналы лакун и реконструкций преимущественно сохранены. Однако несколько мест либо меняют образ, либо неоправданно уточняют/ослабляют свидетельство: «во всём чужда свету» вместо «во всём чужда»; «уничтожают противника» вместо сравнения участи с участью противника; «обратили ... против Церкви» вместо «направили ... на Церковь».'
  naturalness: 'Русский в целом литературный и читаемый, но встречаются шероховатости согласования и управления: «кто произошёл ... и возник» при множественном подлежащем; «прославит» и «отречётся» после «те, кто»; «честолюбивая жажда»; «как те, кто заботится» в сравнении, где лучше сохранить значение «подобно тем, кто принимает во внимание». Исправления ниже сохраняют торжественный, но современный регистр.'
  terminology: 'Ключевые термины сохранены удачно: «Слово», «душевные», «материальные», «Целое», «те, кто справа/левой стороны». «Превознесённый» допустим для Exalted One. Терминологически желательно последовательно передавать good inclination как «доброе устремление», а не приписывать материальной категории отчуждённость именно «свету», чего свидетельство не говорит.'
  issues:
