    issue: Добавлено смысловое уточнение в описании материальной категории.
    rationale: 'Фраза «Материальная же категория во всём чужда свету» сужает witness: «is alien in every way» не содержит дополнения «свету». Следующее придаточное уже объясняет образ через тьму и отвержение света.'
