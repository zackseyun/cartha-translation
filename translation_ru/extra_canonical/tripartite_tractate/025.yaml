  revised_text: 'Люди разделились на три природные категории: духовных, душевных и материальных.[a] Они соответствуют тройственному устремлению Слова, от которого произошли материальные, душевные и духовные. Каждая из трёх природных категорий узнаётся по своему плоду. Однако с самого начала они ещё не были распознаны — это произошло лишь тогда, когда пришёл Спаситель, воссиял над святыми и открыл, к какой категории принадлежит каждый.


    Духовная категория подобна свету от света и духу от духа. Когда явилась её глава, она тотчас устремилась к <своей категории>. Внезапно она стала телом для своей главы и сразу же обрела знание через откровение.


    Душевная же категория подобна свету от огня. Она медлила признать [] того, кто ей явился, и ещё более медлила устремиться к нему через веру. Но хотя голос наставлял её, <она> довольствовалась этим, потому что находилась недалеко от надежды обещания: она получила, так сказать, удостоверение грядущего в виде залога.


    Материальная же категория во всём чужда, потому что подобна тьме и отвергает сияющий свет, ведь его явление уничтожает её. И поскольку она не приняла его <пришествия>, она <не знает меры> и исполнена злобы против откровения Господа.


    Духовная категория во всех отношениях обретёт полное спасение. Материальная категория во всех отношениях будет уничтожена, как бывает с противником. Душевная же категория из-за своего промежуточного положения — как по происхождению, так и по природе — двойственна, что соответствует её склонности и к добру, и ко злу. А определённое для неё неоднозначно <…>, как и её полное удаление <от> добра.[b]


    Те, кого Слово произвело по предсуществовавшему образцу в своей мысли, обрели спасение сразу же, когда оно вспомнило о Превознесённом и помолилось о спасении. [Благодаря] спасительной мысли они были полностью спасены тем, что она произвела. То же относится и к [тем], кого они, в свою очередь, произвели, [] — будь то ангелы или люди. Признавая, что существует Тот, кто превыше их, молясь и стремясь к нему, они тоже обретут то же спасение, какое обрели произведённые прежде, потому что происходят от доброго устремления. Им было поручено возвещать будущее пришествие Спасителя и его откровение после того, как он пришёл. Будь то ангелы или люди, когда он назначил их на это служение, они действительно обрели природу своего бытия.


    Те же, кто произошёл от мысли, жаждавшей властвовать, и возникли от удара, нанесённого его противниками, были порождены этой мыслью. Поскольку они смешанны, их конечная участь будет неоднозначной. Те, кто отвергнут жажду власти, данную им лишь на время и на определённые сроки, прославят Господа славы и отрекутся от своего гнева, получат награду за смирение — нескончаемое существование.


    Но те, кто превозносится из-за жажды честолюбия, любит преходящую славу и забывает, что власть была доверена им лишь на определённые сроки и времена, — и потому не исповедует, что Сын Божий [] есть Господь всего и Спаситель, не отрекается от своего гнева и не перестаёт подражать злым, — понесут воздаяние за своё неведение и безрассудную страсть вместе с теми, кто заблудился и уклонился от пути.


    Ещё хуже те, кто совершил недолжное против Господа, как поступили с ним силы левой стороны, даже предав его смерти. Они рассуждали: «Мы станем владыками Целого,[c] если будет убит тот, кто провозглашён царём Целого». Ради этого и действовали люди и ангелы, принадлежащие не к доброму устремлению тех, кто справа, а к смешению. Они избрали собственную славу, хотя она — лишь преходящая слава и вожделение. Путь же к вечному покою лежит через смирение, <ведущее к> спасению, через принадлежность к тем, кому предстоит спастись, — к тем, кто справа.


    Когда они прославят Господа, помыслят о том, что угодно Церкви, и вместе с ней, насколько возможно полно, воспоют гимн смиренных, поступая угодно ей, они разделят её страдания и скорби, подобно тем, кто принимает во внимание благо Церкви, и получат долю в её надежде. Это относится [] и к людям, и к ангелам.


    Путь принадлежащих к чину левой стороны ведёт к погибели, потому что они не только отвергли Господа и замыслили против него зло, но и направили свою ненависть, зависть и ревность на Церковь. В этом причина осуждения тех, кто тревожил Церковь, даже побуждая самих себя создавать для неё <испытания>.'
