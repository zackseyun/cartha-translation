review_pass:
  verdict: revise
  source_fidelity: Проверка выполнена по предоставленному английскому свидетельству; прямая сверка с коптским текстом остаётся необходимой. В целом сохранены технический термин «Целокупности», парадоксальные предикации и обозначения лакун. Однако несколько формулировок черновика либо меняют смысловую связь, либо создают в русском ложное утверждение.
  naturalness: 'Регистр в целом удачен: современная литературная религиозно-философская проза без конфессиональной гармонизации. Исправлены неестественные либо двусмысленно-ошибочные обороты («неразделим, как тело», «простёр себя», «посредством которого обладает знанием»).'
  terminology: «Целокупности» следует сохранить как технический термин во множественном числе. «Сын», «Отец», «Возвышенный», «промысл» и «образ» переданы последовательно. Строчная буква в «бог существующих» сохраняет характер наименования в перечислении и не навязывает интерпретацию.
  issues:
  - severity: medium
    issue: «дать Целокупностям знание»
    rationale: Свидетель говорит «beget and produce knowledge for the Totalities»; «дать ... знание» превращает производство/порождение знания в простую передачу знания адресатам.
  - severity: high
    issue: «Он неразделим, как тело»
    rationale: В русском это читается как утверждение, что тело неразделимо. Свидетель сопоставляет его с телом как с тем, что может быть разделено; требуется отрицание возможности разделить его подобным образом.
  - severity: medium
    issue: «не превращается в имена, которые замышляет»
    rationale: '«Замышляет» вводит оттенок намерения и заговора, отсутствующий в «conceives of». Нейтральнее и точнее: «мыслит».'
  - severity: medium
    issue: «око, посредством которого обладает знанием»
    rationale: 'Оборот грамматически и семантически неясен: не выражено, кто именно обладает знанием. Следует прямо передать инструментальное значение: «око, которым он познаёт».'
  - severity: low
    issue: «выводит их наружу»
    rationale: Физически-пространственная метафора слишком сильна для «brings forth» и не поддерживается свидетельством. «Выводит их в проявленность» сохраняет движение к явлению, не отождествляя его с рождением.
  revised_text: 'Вот тот, кто был дан им для насыщения, питания, радости и богатства просвещения, заключающего в себе его совместное действие, его знание и его соединение с ними. Именно он называется и есть Сын, потому что он — Целокупности[a]; они знают, кто он, и знают, что он покрывает их одеяниями. Это тот, кого называют «Сыном», тот, чьё существование они постигают и кого искали. Это тот, кто существует как Отец, о ком они не могут говорить и кого не способны постичь. Это первый, кто возник. Никто не может ни постичь, ни уразуметь его. Да и может ли кто-нибудь приблизиться к Возвышенному, к тому, кто, строго говоря, предсуществует? Однако все имена, которые мыслятся […] или произносятся о нём, употребляются ради почитания, как указание на него, — сообразно способности каждого прославлять его.



    Тот, кто произошёл от него, когда он простёрся, чтобы породить и произвести знание для Целокупностей, — он […] всякое имя без лжи и, строго говоря, он — единственный первый, человек от Отца, тот, кого я [называю]:



    образом без образа,



    телом без тела,



    невидимым лицом,



    неизречённым словом,



    непостижимым умом,



    источником, текущим из него,



    корнем насаждённых


    и богом существующих;



    светом тех, кого он просвещает,



    любовью тех, кого он любит,



    промыслом тех, кого он ведёт своим промыслом,



    мудростью тех, кого он сделал мудрыми,



    силой тех, кого он наделил силой,



    собранием <тех>, кого он собирает к себе,



    откровением искомого,



    оком видящих,



    дыханием дышащих,



    жизнью живых,



    единством тех, кто соединён с Целокупностями.



