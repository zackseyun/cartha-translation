translation:
  language: ru
  text: 'Вот тот, кто был дан им для насыщения, питания и радости, а также для богатства просвещения, которое включает его совместный труд, его знание и его соединение с ними. Именно он и называется Сыном, и действительно является Сыном, потому что он — Все Целокупности[a]; и они знают, кто он и что он покрывает их одеяниями. Это тот, кого называют «Сыном», тот, чьё существование они постигают и кого искали. Это тот, кто существует как Отец, о ком они не могут говорить и кого не способны постичь. Это первый, кто возник. Никто не может ни постичь, ни уразуметь его. Да и может ли кто-нибудь приблизиться к Возвышенному, к тому, кто, строго говоря, предсуществует? Однако все имена, которые мыслятся […] или произносятся о нём, употребляются ради почитания, как указание на него, — сообразно способности каждого прославлять его.


    Тот, кто произошёл от него, когда он простёр себя, чтобы родить и дать Целокупностям знание, — он […] всякое имя без лжи и, строго говоря, он — единственный первый, человек от Отца, тот, кого я [называю]:


    образом без образа,


    телом без тела,


    невидимым лицом,


    неизречённым словом,


    непостижимым умом,


    источником, текущим из него,


    корнем насаждённых


    и богом существующих;


    светом тех, кого он просвещает,


    любовью тех, кого он любит,


    промыслом тех, кого он ведёт своим промыслом,


    мудростью тех, кого он сделал мудрыми,


    силой тех, кого он наделил силой,


    собранием <тех>, кого он собирает к себе,


    откровением искомого,


    оком видящих,


    дыханием дышащих,


    жизнью живых,


    единством тех, кто соединён с Целокупностями.


    Всё это пребывает в едином, поскольку он полностью облекается во всё это, и всё же его никогда не называют одним-единственным именем. И в этом едином образе бытия они в равной мере суть единое и Целокупности. Он неразделим, как тело, и не расчленяется согласно полученным им именам, словно в одном отношении он — одно, а в […] другом — [нечто иное]. И он не изменяется в […], не превращается в имена, которые замышляет, становясь то одним, то другим: сейчас одним, а в иное время — чем-то иным. Напротив, до самого конца он всецело остаётся самим собой. [Он есть] одновременно и вечно все Целокупности без исключения. Он — тот, кто заключает их всех в себе. Он явил Отца Целокупностям. Более того, он и есть Целокупности, потому что он — собственное самопознание и всякое качество и сила. И [он] сам [есть] око, посредством которого обладает знанием, всецело созерцая себя в самом себе и обладая Сыном и образом.


    Поэтому его силы и качества неисчислимы и неслыханны — таков способ, каким он порождает их. Неисчислимы и неотделимы те, кого порождают его слова; таковы же его наставления и его Целокупности. Он знает их — тех, кто является тем же, что и он сам, — потому что они пребывают в едином имени и все говорят посредством него. И он выводит их наружу, чтобы они обнаружили, что существуют сообразно своим особым качествам, но единым образом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Целокупности» — техническое обозначение совокупности божественных реальностей или полнот в понятийном мире трактата. Множественное число оригинального свидетельства сохранено.
    reason: Необычный термин необходим для последовательности перевода, но нуждается в кратком пояснении современному читателю.
lexical_decisions:
- source_word: Totalities
  choice: Целокупности
  rationale: Сохранён технический характер термина и его множественное число; «всё» или «полнота» чрезмерно сгладили бы специфическую космологическую лексику трактата.
- source_word: mixing with them / mingled
  choice: соединение с ними / соединён
  rationale: «Смешение» звучит в современном русском преимущественно вещественно; «соединение» сохраняет идею сопричастности без навязывания её точной метафизики.
- source_word: the human from the Father
  choice: человек от Отца
  rationale: Формально сохранена необычная антропологическая формула; она не заменена конфессионально нагруженными титулами.
- source_word: providence
  choice: промысл
  rationale: Литературный религиозно-философский эквивалент, позволяющий воспроизвести однокоренную конструкцию «промыслом… ведёт своим промыслом».
- source_word: single one / single name
  choice: единый / единое имя
  rationale: «Единый» передаёт онтологический смысл лучше, чем числовое «один», при этом различие контекстов сохранено.
- source_word: brings forth
  choice: выводит их наружу
  rationale: Передаёт движение к проявленности и не отождествляет это действие без достаточных оснований с рождением, уже названным ранее.
theological_decisions:
- issue: Отношение Сына к Целокупностям
  choice: «он — Все Целокупности» и далее «он и есть Целокупности»
  alternative: «он содержит все полноты»
  rationale: Сохранено прямое отождествление свидетеля, а не ослаблено до отношения вместилища или обладания.
- issue: Формула существования как Отца
  choice: «тот, кто существует как Отец»
  alternative: «тот, кто есть Отец»
  rationale: Сохранена некоторая смысловая напряжённость английского свидетельства, не устраняющая возможного различия между образом существования и простым тождеством.
- issue: «первый, кто возник» и предсуществование
  choice: Обе формулы сохранены рядом без гармонизации
  alternative: Истолковать «возник» как явление или рождение
  rationale: Текст сам удерживает напряжение между возникновением первого и строгим предсуществованием Возвышенного; перевод не должен разрешать его догматически.
- issue: «бог существующих»
  choice: Строчная буква в поэтическом перечне
  alternative: «Бог существующих»
  rationale: Фраза передаётся как предикативное наименование внутри ряда; регистр рукописного свидетеля не позволяет уверенно превращать его в собственное имя.
- issue: Обладание Сыном и образом
  choice: «обладая Сыном и образом»
  alternative: «имея сына и форму»
  rationale: Сохранено различие титула «Сын» и многозначного «образ» без попытки объяснить внутренние отношения.
translation_notes:
  register: Современный литературный русский с достоинством религиозно-философской прозы. Риторические повторы и парадоксальные формулы сохранены. Квадратные скобки и многоточия отмечают лакуны или восстановления в предоставленном свидетельстве; угловые скобки — редакционно восполненное слово. Черновик подготовлен по публичному английскому свидетельству; прямая сверка с коптским текстом остаётся необходимой.
