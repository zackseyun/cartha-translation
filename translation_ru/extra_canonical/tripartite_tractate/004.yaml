translation:
  language: ru
  text: '[. . .] Церковь существует в тех качествах и свойствах, в которых существуют Отец и Сын, как я сказал вначале. Поэтому она пребывает в рождениях бесчисленных эонов[a]. Благодаря тем качествам и свойствам, в которых [существует] Церковь, эоны также порождают неисчислимым образом. Ибо эти эоны [составляют] единство Церкви, которое они [образуют] друг с другом, [с теми, кто] произошёл от [них], и с Сыном, ради славы которого они существуют.


    Поэтому ум не может постичь <их>, поскольку он — совершенство того места. И речь не может их описать, потому что они неизреченны, неименуемы и непостижимы. Лишь они сами могут называть и постигать себя, потому что они не укоренены в здешних местах. Пребывающие в том месте неизреченны и неисчислимы в строе, [который есть] и [образ], и мера, ликование и радость нерождённого, безымянного, неименуемого, непостижимого, невидимого, немыслимого. Такова полнота отцовства, благодаря которой его богатства становятся рождением.


    [] [. . .] эонов вечно пребывали в мысли, потому что Отец был для них словно мыслью и местом. Когда их поколения были утверждены, тот, кто всем властвует, пожелал овладеть тем, чего недоставало в [. . .], и породить это; и он породил тех, кто [находился внутри] него. Но поскольку он [таков, каков] он есть, [он остаётся] источником, который не иссякает от обильно текущей из него воды.


    Пока они пребывали в мысли Отца, то есть в сокрытой глубине, глубина знала их, но они не могли познать глубину, в которой пребывали. Они не могли познать ни самих себя, ни что-либо иное. Иными словами, они пребывали с Отцом, существуя не ради самих себя. Они существовали лишь подобно семени, и оказалось, что их существование подобно существованию плода во чреве. Он породил их словно словом: они пребывали в семенном виде, а те, кого ему предстояло породить, ещё не получили от него бытия.


    [] Отец первым помыслил о них. Он посеял мысль, словно семя, не только для того, чтобы они существовали ради него, но и чтобы они существовали ради самих себя, чтобы затем они существовали в его мысли как существа, способные познавать, и существовали также ради самих себя. Чтобы они могли познать то, что существует ради них, он щедро [даровал им] первоначальный облик; а чтобы они могли познать, [кто такой Отец], существующий ради них, он через голос даровал им имя «Отец», возвестив, что всё существующее существует благодаря этому имени, которое принадлежит им. Ведь они обрели бытие благодаря величию, пребывающему в имени, — величию, которого они не распознали. Пока младенец находится во чреве, у него есть всё необходимое для него самого, но он ещё не видит того, кто посеял его. Поэтому единственной их задачей было искать Отца, признавая, что он существует, и непрестанно желая обнаружить существующее.


    Но поскольку совершенный Отец благ и поскольку он не <закрыл> себя от них, оставив их навечно существовать лишь в его мысли, а даровал им также обрести бытие ради самих себя, он дал им и дар познать то, что есть, — того, кто вечно знает самого себя. [] [. . .] обрести облик, [чтобы познать], что Сущий[b] существует, — подобно людям, которые, рождаясь в этом месте, выходят на свет, чтобы увидеть тех, кто их породил.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эоны — «веки» или вечные области/сущности в космологическом языке трактата; термин оставлен в транслитерации, чтобы сохранить его специальный смысл.
    reason: Обычному читателю специальное значение слова «эон» может быть неясно.
  - marker: b
    text: «Сущий» передаёт выражение «Тот, Кто Есть». Прямой перевод с коптской рукописи ещё требует проверки; настоящий вариант основан на указанном публичном английском свидетельстве.
    reason: Поясняет титульный термин и честно обозначает ограничение источниковой базы.
lexical_decisions:
- source_word: Church
  choice: Церковь
  rationale: Сохранён основной экклезиологический термин свидетеля и его персонифицированный характер; написание с прописной буквы отличает космическую Церковь данного трактата от обычного собрания.
- source_word: aeons
  choice: эоны
  rationale: Транслитерация сохраняет специальный космологический смысл и не сводит термин к обычным «векам».
- source_word: qualities and attributes
  choice: качества и свойства
  rationale: Сохранена смысловая парность без искусственного догматического уточнения.
- source_word: depth
  choice: глубина
  rationale: Буквальный и контекстуально значимый образ сохранён; в месте, где глубина выступает как знающий субъект, неоднозначность не устранена.
- source_word: spermatic form / spermatic seed
  choice: семенной вид / семя
  rationale: Передаёт эмбриологическую и порождающую метафорику в dignified современном русском без излишне медицинского оттенка.
- source_word: He Who Is
  choice: Сущий
  rationale: Лаконично передаёт титульное обозначение существующего; прописная буква сохраняет его референцию к высшему божественному субъекту.
- source_word: paternity
  choice: отцовство
  rationale: Сохранено абстрактное понятие, а не заменено толкованием вроде «Отчая природа».
theological_decisions:
- issue: Онтологический статус Церкви и эонов
  choice: Сохранить язык существования, рождения и единства без поясняющей систематизации
  alternative: Пересказать как определённую гностическую эманационную схему
  rationale: Текст сам выражает отношения образно и местами повреждённо; перевод не должен навязывать позднейшую реконструкцию системы.
- issue: Неясный референт местоимения в «he being the perfection of that place»
  choice: «поскольку он — совершенство того места»
  alternative: Назвать конкретного субъекта, например Отца, Сына или ум
  rationale: Свидетель допускает синтаксическую неоднозначность, которую нельзя надёжно разрешить без завершённой проверки коптского текста.
- issue: Фраза о существовании Отца «ради них»
  choice: Сохранить симметричную формулировку «Отец, существующий ради них»
  alternative: Ослабить до «Отец, являющийся им» или истолковать как промыслительное действие
  rationale: Так сохраняется вызывающее богословское напряжение исходного свидетельства без исправления в пользу привычной доктринальной формулы.
- issue: «the one who knows himself eternally»
  choice: «того, кто вечно знает самого себя»
  alternative: Отождествить его в тексте непосредственно с Отцом или Сущим
  rationale: Местоименная связь в повреждённом контексте не вполне однозначна; эксплицитное отождествление было бы интерпретацией.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным философско-богословским регистром. Сохранены абзацы, лакуны [. . .], пустые скобки [], квадратные скобки редакционных восстановлений и угловые скобки редакционных дополнений/исправлений английского свидетеля. Избегались архаизмы, конфессионально нагруженные уточнения и сглаживание намеренно парадоксальных утверждений. Поскольку прямая сверка с коптским источником обозначена как ожидающая выполнения, решения являются публикационным черновиком по предоставленному публичному английскому свидетельству.
