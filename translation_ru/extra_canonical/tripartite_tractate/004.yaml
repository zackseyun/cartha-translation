review_pass:
  verdict: revise
  source_fidelity: Прямая сверка с коптским текстом в предоставленных материалах обозначена как незавершённая; поэтому проверка выполнена по английскому свидетельству и английской POB-версии. Исправлены несколько мест, где русский текст либо утрачивал редакционное восстановление («[них и]»), либо создавал ненужную грамматическую/референтную определённость. Лакуны, квадратные и угловые скобки сохранены.
  naturalness: 'Регистрово перевод удачен, однако отдельные фразы требовали выправления: «не укоренены в здешних местах» заменено на соответствующее указательному «в этих местах»; «строй» и ряд абстрактных определений переданы более прозрачно; исправлено грамматически невозможное сочетание «[...] эонов вечно пребывали».'
  terminology: «Церковь», «Отец», «Сын», «эоны», «глубина», «отцовство» и «Сущий» сохранены. «Первоначальный облик» заменён на «первоначальный образ» как более точная передача initial form. Не вводится конфессиональное истолкование космологического языка.
  issues:
  - severity: medium
    issue: Утрачен элемент редакционного восстановления в первой фразе об эонах и Сыне.
    rationale: В свидетельстве стоит «from [them and] with the Son». В черновике «от [них], и с Сыном» не сохраняет восстановленное «and» внутри скобок и меняет синтаксическую связь. Исправлено на «от [них и] вместе с Сыном».
  - severity: medium
    issue: Грамматически несогласованное начало повреждённого абзаца.
    rationale: '«[] [. . .] эонов вечно пребывали» содержит родительный множественного числа «эонов» при личной форме множественного числа. Поскольку подлежащее утрачено в лакуне, глагол поставлен в единственном числе, согласуемом с подразумеваемым утраченным существительным: «[...] эонов вечно пребывал в мысли».'
  - severity: low
    issue: «Здешних местах» сужает указательное «these places».
    rationale: «Здешних» означает места здесь, тогда как свидетель говорит «these places». Использовано нейтральное «этих местах».
  - severity: low
    issue: Перечень характеристик «system» недостаточно ясно передавал завершающее «one».
    rationale: Добавлено «Единого» в конце цепочки определений, чтобы не потерять субстантивированное «one» английского свидетельства; синтаксическая трудность исходника при этом сохранена.
  revised_text: "[. . .] Церковь существует в тех качествах и свойствах, в которых существуют Отец и Сын, как я сказал вначале. Поэтому она пребывает в рождениях бесчисленных эонов[a]. Благодаря тем качествам и свойствам, в которых [существует] Церковь, эоны также порождают неисчислимым образом. Ибо эти эоны [составляют] единство Церкви, которое они [образуют] друг с другом и [с теми], кто произошёл от [них и] вместе с Сыном, ради славы которого они существуют.\n\n\n      Поэтому ум не может постичь <их>, ибо он — совершенство того места. И речь не может их описать, потому что они неизреченны, неименуемы и непостижимы. Лишь они сами могут называть и постигать себя, потому что они не укоренены в этих местах. Пребывающие в том месте неизреченны и неисчислимы в устройстве, [которое есть] и [способ], и измерение, ликование и радость Нерождённого, безымянного, неименуемого, непостижимого, невидимого, немыслимого Единого. Такова полнота отцовства, благодаря которой его богатства становятся рождением.\n\
    \n\n      [] [. . .] эонов вечно пребывал в мысли, потому что Отец был для них словно мыслью и местом. Когда их поколения были утверждены, тот, кто всем властвует, пожелал овладеть тем, чего недоставало в [. . .], и породить это; и он породил тех, кто [находился внутри] него. Но поскольку он [таков, каков] он есть, [он остаётся] источником, который не иссякает от обильно текущей из него воды.\n\n\n      Пока они пребывали в мысли Отца, то есть в сокрытой глубине, глубина знала их, но они не могли познать глубину, в которой пребывали. Они не могли познать ни самих себя, ни что-либо иное. Иными словами, они пребывали с Отцом, существуя не ради самих себя. Они существовали лишь подобно семени, и оказалось, что их существование подобно существованию плода во чреве. Он породил их словно словом: они пребывали в семенном виде, а те, кого ему предстояло породить, ещё не получили от него бытия.\n\n\n      [] Отец первым помыслил о них. Он посеял мысль, словно семя, не только для того, чтобы они\
    \ существовали ради него, но и чтобы они существовали ради самих себя, чтобы затем они существовали в его мысли как познающие существа и существовали также ради самих себя. Чтобы они могли познать то, что существует ради них, он щедро [даровал им] первоначальный образ; а чтобы они могли познать, [кто такой Отец], существующий ради них, он даровал им через голос имя «Отец», возвестив им, что всё существующее существует благодаря этому имени, которое принадлежит им. Ведь они обрели бытие благодаря возвышению, пребывающему в имени, — возвышению, которого они не распознали. Пока младенец находится во чреве, у него есть всё необходимое для него самого, но он ещё не видит того, кто посеял его. Поэтому единственной их задачей было искать Отца, признавая, что он существует, и непрестанно желая открыть то, что существует.\n\n\n      Но поскольку совершенный Отец благ и поскольку он не <закрыл> себя от них, оставив их навечно существовать лишь в его мысли, а даровал им также обрести бытие ради\
