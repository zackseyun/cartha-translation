review_pass:
  verdict: revise
  source_fidelity: 'По предоставленному английскому свидетельству перевод в целом точно передаёт цепочки отрицательных атрибутов, парадокс самопорождения, титулы «Первенец» и «единственный Сын», а также лакуны в квадратных скобках. Однако в описании Сына фраза «о Нём Он безмолвствует» меняет синтаксическую соотнесённость: свидетельство включает «remaining silent about him» в ряд характеристик Сына после «he has a Son». Более безопасно сохранить этот ряд без перенесения безмолвия на Отца. Прямое сверение с коптским источником остаётся необходимым, поскольку предоставлена английская свидетельская версия.'
  naturalness: 'Регистр в основном удачен: современный литературный русский с уместно возвышенной философско-богословской лексикой. В исправленном тексте «неохватимый» точнее передаёт отличное от «непостижимый» свойство и лучше соотносится с невозможностью охватить мыслью. Несколько синтаксических связок выровнены без устранения намеренной неопределённости повреждённого текста.'
  terminology: «Совокупности» с пояснительной сноской, «саморождён», «Первенец» и «единственный Сын» сохранены. «Нерождённый» сохранён для unbegotten, а «саморождён» — для self-begotten; эти термины не следует гармонизировать. «Пища» оставлена для необычного sustenance, чтобы не сгладить образ свидетельства.
  issues:
  - severity: medium
    issue: Смена референта в предложении о безмолвии Сына
    rationale: 'Черновик: «Так у Него есть Сын, пребывающий в Нём; о Нём Он безмолвствует». Это делает Отца субъектом безмолвия. В английском свидетельстве оборот «remaining silent about him» стоит в последовательности определений Сына; перевод должен по возможности сохранить именно эту синтаксическую связь, не вводя толкование.'
  - severity: low
    issue: «Неуловимый» для ungraspable
    rationale: «Неуловимый» обычно значит трудно обнаружимый или ускользающий, тогда как здесь речь об отсутствии возможности охватить мыслью. «Неохватимый» точнее сохраняет различие с «непостижимый».
  - severity: low
    issue: «Стал известен» ослабляет повтор познания
    rationale: Witness употребляет know / become known в тесной связи с непознаваемостью. «Стал познан» сохраняет этот лексический мотив.
  revised_text: 'Итак, если Он непостижим, то Его невозможно познать; никакая мысль не может Его охватить, ничто не может Его увидеть, никакие слова не могут Его выразить, никакая рука не может Его коснуться. Лишь Он знает Себя таким, каков Он [] есть, и знает, каковы Его облик, Его величие и Его мера. Поскольку Он способен мыслить Себя, видеть Себя, именовать Себя и постигать Себя, Он — единственный, у кого собственные ум, око, уста и облик равнозначны собственному бытию. И потому Он есть то, что Он мыслит, то, что видит, то, что изрекает и что постигает, сам будучи немыслимым, невыразимым, неохватимым и неизменным; а то, что Он мыслит, видит и изрекает, то, что Он помыслил, есть пища — радостная, истинная, приятная и дарующая покой. Он превосходит всякую мудрость и превыше всякого ума, всякой славы, всякой красоты, всякой сладости, всякого величия, всякой глубины и всякой высоты.



    Непознаваемый по природе, обладающий всеми великими свойствами, которые я перечислил, Он может, если из богатства Своей сладости пожелает даровать знание, позволяющее познать Его. Его сила совершить это — Его воля. И всё же Великий безмолвно удерживает Себя — Тот, кто выводит Совокупности[a] к их вечному существованию.



    [] Строго говоря, Он рождает Себя неизречённым образом, ибо лишь Он саморождён: Он зачат от Себя и знает Себя таким, каков Он есть. Из Своего бесконечного величия, неисследимой мудрости, неизмеримой силы и сладости, недоступной вкусу, Он производит всё, что достойно Его почтения, славы, чести и хвалы. Он являет Себя в образе порождения, принимая славу и хвалу, честь и любовь; и Он прославляет и восхваляет Себя, воздавая Себе честь и любовь. Так у Него есть Сын, пребывающий в Нём, безмолвствующий о Нём, неизречённый в Неизречённом, невидимый в Невидимом, неохватимый в Неохватимом, непостижимый в Непостижимом.



    Так Сын вечно существует в Отце. Как мы объяснили прежде, Отец нерождённым образом знает Себя в Себе — Тот, кто родил Себя мыслью; мысль о Нём есть восприятие [] Себя, [. . .] Его вечной природы. Однако, строго говоря, это — безмолвие, мудрость и дар, если это надлежит именовать именно так. Как Отец, строго говоря, существует — прежде Него [никого другого не было], и кроме [Него] нет иного нерождённого, — так и [Сын], строго говоря, существует: прежде Него никого другого не было, и после Него не будет другого сына. Поэтому Он — Первенец и единственный Сын. Он Первенец, потому что прежде Него никого нет, и Он единственный Сын, потому что после Него никого не будет. Кроме того, у Него есть плод, который невозможно познать из-за его превосходящего всё величия. И всё же из богатства Своей сладости Он пожелал, чтобы Его плод был познан. Он явил неизъяснимую силу и соединил её с великим богатством Своей щедрости.'
