translation:
  language: ru
  text: 'Итак, если Он непостижим, то Его невозможно познать; никакая мысль не может Его охватить, ничто не может Его увидеть, никакие слова не могут Его выразить, никакая рука не может Его коснуться. Лишь Он знает Себя таким, каков Он [] есть, и знает, каковы Его облик, Его величие и Его мера. Поскольку Он способен мыслить Себя, видеть Себя, именовать Себя и постигать Себя, Он — единственный, у кого собственные ум, око, уста и облик равнозначны собственному бытию. И потому Он есть то, что Он мыслит, то, что видит, то, что изрекает и что постигает, сам будучи немыслимым, невыразимым, неуловимым и неизменным; а то, что Он мыслит, видит и изрекает, то, что Он помыслил, есть пища — радостная, истинная, приятная и дарующая покой. Он превосходит всякую мудрость и превыше всякого ума, всякой славы, всякой красоты, всякой сладости, всякого величия, всякой глубины и всякой высоты.


    Непознаваемый по природе, обладающий всеми великими свойствами, которые я перечислил, Он может, если пожелает по богатству Своей сладости даровать знание, позволяющее познать Его. Его сила совершить это — Его воля. И всё же Великий безмолвно удерживает Себя — Тот, кто выводит Совокупности[a] к их вечному существованию.


    [] Строго говоря, Он рождает Себя неизречённым образом, ибо лишь Он саморождён: Он зачат от Себя и знает Себя таким, каков Он есть. Из Своего бесконечного величия, неисследимой мудрости, неизмеримой силы и сладости, недоступной вкусу, Он производит всё, что достойно Его почтения, славы, чести и хвалы. Он являет Себя в образе рождения, принимая славу и хвалу, честь и любовь; и Он прославляет и восхваляет Себя, воздавая Себе честь и любовь. Так у Него есть Сын, пребывающий в Нём; о Нём Он безмолвствует. Сын неизречён в Неизречённом, невидим в Невидимом, неуловим в Неуловимом, непостижим в Непостижимом.


    Так Сын вечно существует в Отце. Как мы объяснили прежде, Отец нерождённым образом знает Себя в Себе — Тот, кто родил Себя мыслью; мысль о Нём есть восприятие [] Себя, [. . .] Его вечной природы. Однако, строго говоря, это — безмолвие, мудрость и дар, если так можно назвать это верно. Как Отец, строго говоря, существует — прежде Него [никого другого не было], и кроме [Него] нет иного нерождённого, — так и [Сын], строго говоря, существует: прежде Него никого другого не было, и после Него не будет другого сына. Поэтому Он — Первенец и единственный Сын. Он Первенец, потому что прежде Него никого нет, и Он единственный Сын, потому что после Него никого не будет. Кроме того, у Него есть плод, который невозможно познать из-за его превосходящего всё величия. И всё же по богатству Своей сладости Он пожелал, чтобы Его плод стал известен. Он явил неизъяснимую силу и соединил её с великим богатством Своей щедрости.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Совокупности» — особый термин трактата для полноты или совокупности сущих реальностей; здесь сохранён без дальнейшего истолкования.
    reason: Термин необычен для современного русского читателя и имеет специальное космологическое значение.
lexical_decisions:
- source_word: incomprehensible / ungraspable
  choice: непостижимый / неуловимый
  rationale: Сохранено различие между невозможностью постичь разумом и невозможностью охватить или удержать мыслью.
- source_word: scale
  choice: мера
  rationale: «Мера» естественна для возвышенной философско-богословской прозы и не сводит выражение к физическому размеру.
- source_word: sustenance
  choice: пища
  rationale: Передаёт образ того, что питает и поддерживает, не устраняя необычность исходной фразы.
- source_word: Totalities
  choice: Совокупности
  rationale: Термин сохранён как особое космологическое обозначение и отмечен сноской, без конфессионального истолкования.
- source_word: self-begotten
  choice: саморождён
  rationale: Компактно сохраняет парадоксальную терминологию свидетельства.
- source_word: projects himself
  choice: являет Себя
  rationale: Избегает неестественного буквального «проецирует», сохраняя смысл исхождения или проявления без догматического уточнения.
- source_word: subsisting in him
  choice: пребывающий в Нём
  rationale: Современное и dignified выражение, не навязывающее поздней технической онтологической терминологии.
- source_word: Firstborn
  choice: Первенец
  rationale: Сохраняет традиционно узнаваемый и буквальный титул.
theological_decisions:
- issue: Самопорождение Отца и рождение Сына
  choice: Парадоксальные формулировки сохранены без систематического согласования.
  alternative: Переформулировать их в терминах определённой тринитарной системы.
  rationale: Текст содержит собственное метафизическое напряжение; перевод не должен разрешать его посредством поздней конфессиональной доктрины.
- issue: Референт местоимений в описании мысли Отца
  choice: 'Сохранён синтаксически напряжённый ход: «Отец… Тот, кто родил Себя мыслью».'
  alternative: Однозначно отнести рождение к Сыну или отождествить мысль с Сыном.
  rationale: Английское свидетельство и повреждение текста не позволяют безопасно устранить неоднозначность.
- issue: «Единственный Сын» и утверждение, что после Него не будет другого сына
  choice: Передано буквально, без гармонизации с иными богословскими корпусами.
  alternative: Использовать «Единородный» и истолковать фразу через каноническую терминологию.
  rationale: «Единственный Сын» точнее сохраняет разъяснение самого трактата и не импортирует дополнительную семантику.
- issue: Сын «прежде которого никого не было»
  choice: Фраза сохранена, хотя рядом Отец описан сходным образом.
  alternative: Добавить уточнение «из сотворённых» или иерархически переиначить фразу.
  rationale: Подобное уточнение отсутствует в предоставленном свидетельстве и устранило бы подлинное напряжение текста.
translation_notes:
  register: 'Современный литературный русский язык с возвышенным философско-богословским регистром. Повторы и параллелизм сохранены как существенная черта текста. Квадратные скобки и многоточие передают лакуны и редакторские восстановления предоставленного свидетельства. Проект предварительный: прямое сопоставление с коптским текстом ещё требуется.'
