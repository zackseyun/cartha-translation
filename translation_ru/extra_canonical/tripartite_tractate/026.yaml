id: TRIP.026
reference: Tripartite Tractate — The Election, the Calling, the Restoration, and the Redemption
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  text: 'The Election participates in the nature and the body of the Savior. It is like a bridal chamber because of its unity and its union with him, because above all it was for its sake that Christ came. By contrast, the Calling is positioned for those who rejoice in the bridal chamber, and who are glad and happy over the union of the bridegroom and the bride. In this way, the place the Calling will obtain is the aeon of the images, where the Word is yet to unite with the Fullness. And because of this, the Human of the Church was joyful and glad, and he hopes for her. He comprises spirit, soul, and body, congruent with the one who made the plan of salvation.


    Within (the Human) was a human who was a unity, because he was the Totality, and he was all of them. And he possessed what issued from the [Father], which [] the places could receive. He also possessed the limbs we mentioned before. When the redemption was proclaimed, the Perfect Human at once obtained the knowledge of how to return speedily to his unity, to the place from which he originated. He returned joyfully to the place from which he had originated, to the place from which he had issued forth.


    However, his limbs needed a place for schooling, as is in the places prepared to supply it with the images and archetypes like a mirror, until all the limbs of the body of the Church <are joined> in the same place and obtain the restoration at the same time, through the manifestation of the entire body, <…> the restoration to the Fullness.


    It possesses a primary shared harmony and union, which is the harmony belonging to the Father until the Totalities attain a face like his. The restoration at the end, though, <will occur> after the Totality is unveiled in him who is the Son, who is the redemption, that is, the path toward the incomprehensible Father, that is, the return to the pre-existent, and (after) the Totalities reveal themselves in that one, in the proper way, who is the path to the ungraspable, unspeakable, [] unseen, and incomprehensible one, so that it attains redemption.


    It will be a liberation not just from the control of those <of> the left, and not just an escape from the power of those of the right, of which we believed we were slaves and sons, from whom no one flees without quickly being caught by them again. The redemption is instead also an ascent <to> the degrees in the Fullness, and to those who obtained names, and who grasped them in accord with the ability of each aeon. And it is an entrance into what is silent, without need for voice, or for knowledge, conceptualization, or for enlightenment, but (where) all things are light, all being radiant without the need for enlightenment.


    Angels as well as humans need redemption, as does the image and the Fullnesses of the aeons and the wondrously radiant powers. Even the Son himself, who is the model for the redemption of the Totality, [needed] redemption, too, [] because he became human, subjecting himself to everything necessary to us in the flesh, who are his Church. When he then first attained redemption through the Word that had descended on him, all the rest attained redemption from him by embracing him for themselves. This is because those who received the one who had (already) received, (naturally) received what was in him.


    Among fleshly humans, redemption began [being] bestowed when his firstborn, and his love, the fleshly Son, and the heavenly angels were deemed deserving to form a fellowship with him on the earth, which is why he is called “the angelic redemption of the Father,” consoling those who had grieved for the sake of the knowledge of the Totality, because he was the first to have this gift bestowed on him before anyone else.'
