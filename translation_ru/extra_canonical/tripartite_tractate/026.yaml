base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/026.yaml
  text: 'The Election shares in the nature and body of the Savior. It is like a bridal chamber because of its unity and union with him, since it was above all for its sake that Christ came. By contrast, the Calling is appointed for those who rejoice in the bridal chamber and are glad and happy about the union of the bridegroom and the bride. In this way, the place the Calling will receive is the aeon of the images, where the Word has yet to unite with the Fullness. Because of this, the Human of the Church was joyful and glad, and he hopes for her. He consists of spirit, soul, and body, corresponding to the one who made the plan of salvation.


    Within (the Human) was a human who was a unity, because he was the Totality, and he was all of them. He possessed what came from the [Father], which [] the places could receive. He also possessed the limbs we mentioned earlier. When the redemption was proclaimed, the Perfect Human immediately gained the knowledge of how to return quickly to his unity, to the place from which he originated. He joyfully returned to the place from which he had originated, the place from which he had come forth.


    However, his limbs needed a place of instruction, as is in the places prepared to provide it with the images and archetypes like a mirror, until all the limbs of the body of the Church <are joined> in the same place and receive the restoration at the same time, through the manifestation of the entire body, <…> the restoration to the Fullness.


    It possesses a primary shared harmony and union, which is the harmony belonging to the Father, until the Totalities acquire a face like his. The restoration at the end, however, <will occur> after the Totality is unveiled in him who is the Son, who is the redemption—that is, the path toward the incomprehensible Father, that is, the return to the pre-existent—and (after) the Totalities reveal themselves in that one, in the proper way, who is the path to the ungraspable, unspeakable, [] unseen, and incomprehensible one, so that it attains redemption.


    It will be a liberation not only from the control of those <of> the left, and not only an escape from the power of those of the right, whose servants and sons we believed ourselves to be, and from whom no one escapes without quickly being caught by them again. Instead, redemption is also an ascent <to> the degrees in the Fullness and to those who received names and grasped them according to the ability of each aeon. It is also an entrance into what is silent, with no need for voice, knowledge, conceptualization, or enlightenment, but (where) all things are light, all radiant without any need for enlightenment.


    Angels as well as humans need redemption, as do the image, the Fullnesses of the aeons, and the wondrously radiant powers. Even the Son himself, who is the model for the redemption of the Totality, [needed] redemption too, [] because he became human, subjecting himself to everything necessary to us in the flesh, who are his Church. When he then first attained redemption through the Word that had descended upon him, all the rest attained redemption from him by embracing him for themselves. This is because those who received the one who had (already) received naturally received what was in him.


    Among fleshly humans, redemption began [being] bestowed when his firstborn, his love, the fleshly Son, and the heavenly angels were considered worthy to form a fellowship with him on the earth. This is why he is called “the angelic redemption of the Father,” consoling those who had grieved for the sake of the knowledge of the Totality, because he was the first to have this gift bestowed upon him, before anyone else.'
translation:
  language: ru
  text: 'Избрание причастно природе и телу Спасителя. Оно подобно брачному чертогу благодаря своему единству и соединению с ним, ведь прежде всего ради него и пришёл Христос. Призвание же предназначено для тех, кто радуется брачному чертогу, ликует и веселится о соединении жениха и невесты. Поэтому местом, которое получит Призвание, станет эон образов, где Слову ещё предстоит соединиться с Полнотой. И потому Человек Церкви ликовал и радовался и возлагает надежду на неё. Он состоит из духа, души и тела, соответствуя тому, кто составил замысел спасения.


    Внутри (Человека) был человек, представлявший собой единство, потому что он был Всем[a] и был всеми ими. Он обладал тем, что произошло от [Отца] и что [] места могли вместить. Он обладал также членами, о которых мы говорили прежде. Когда было возвещено искупление, Совершенный Человек тотчас обрёл знание о том, как быстро возвратиться к своему единству, в место своего происхождения. С радостью он возвратился туда, откуда произошёл, в место, из которого вышел.


    Однако его членам требовалось место обучения — подобное тем местам, которые приготовлены, чтобы, словно в зеркале, давать образы и первообразы, — пока все члены тела Церкви <не соединятся> в одном месте и одновременно не обретут восстановления через явление всего тела, <…> восстановления в Полноте.


    Оно обладает изначальной общей гармонией и единством — гармонией, принадлежащей Отцу, — пока все совокупности не обретут лик, подобный его лику. Но окончательное восстановление <произойдёт> после того, как Всё откроется в том, кто есть Сын, кто есть искупление, то есть путь к непостижимому Отцу, иначе говоря, возвращение к Предсуществующему; и (после того, как) все совокупности должным образом явят себя в том, кто есть путь к неуловимому, неизреченному, [] невидимому и непостижимому, чтобы оно достигло искупления.


    Это будет освобождение не только от власти тех, кто <слева>, и не только избавление от силы тех, кто справа, чьими рабами и сыновьями мы считали себя и от кого никто не убегает, не будучи вскоре снова ими пойман. Напротив, искупление — это также восхождение <к> ступеням в Полноте и к тем, кто получил имена и постиг их в меру способности каждого эона. Это также вхождение в безмолвное, где не нужны ни голос, ни знание, ни понятие, ни просвещение, но (где) всё есть свет и всё сияет, не нуждаясь в просвещении.


    И ангелам, и людям необходимо искупление; оно необходимо также образу, Полнотам эонов и дивно сияющим силам. Даже сам Сын, являющий собой образец искупления Всего, [нуждался][b] в искуплении, [] потому что стал человеком и подчинил себя всему, что необходимо нам во плоти, — нам, которые составляют его Церковь. И когда он первым обрёл искупление через Слово, сошедшее на него, все остальные обрели от него искупление, приняв его как своего. Ведь те, кто принял уже получившего, тем самым получили то, что было в нём.


    Среди людей во плоти искупление начало [дароваться], когда его первенец, его любовь, Сын по плоти и небесные ангелы были признаны достойными вступить с ним в общение на земле. Поэтому он и назван «ангельским искуплением Отца»: он утешает тех, кто скорбел ради познания Всего, поскольку этот дар был дан ему первому, прежде всех остальных.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Всё» здесь — техническое обозначение целокупности; оно намеренно отличено от «Полноты». Множественная форма далее передана как «совокупности».
    reason: Разъясняет необычное субстантивированное слово и сохраняет терминологическое различие свидетеля.
  - marker: b
    text: Слово «нуждался» восстановлено в используемом английском свидетеле; квадратные скобки отмечают редакционное восполнение повреждённого или неясного текста.
    reason: Отмечает текстуальную неуверенность в богословски значимом месте, не устраняя самого утверждения.
lexical_decisions:
- source_word: Election
  choice: Избрание
  rationale: Сохранён персонифицированный технический термин и его отличие от Призвания.
- source_word: Calling
  choice: Призвание
  rationale: Передаёт техническое обозначение группы или порядка, не сводя его к самому акту призыва.
- source_word: Fullness
  choice: Полнота
  rationale: Буквальный и понятный русский эквивалент; прописная буква отмечает специальное космологическое употребление.
- source_word: Totality / Totalities
  choice: Всё / все совокупности
  rationale: Сохранено отличие от Полноты; единственное число передано субстантивированным «Всё», а множественное — «совокупности», чтобы не стирать грамматическое различие свидетеля.
- source_word: aeon
  choice: эон
  rationale: Сохранён традиционный технический термин, поскольку нейтральное «век» исказило бы космологический смысл.
- source_word: Human of the Church
  choice: Человек Церкви
  rationale: Сохранена необычная титульная конструкция и прописная буква, без истолковывающей перифразы.
- source_word: redemption
  choice: искупление
  rationale: Последовательно отличено от restoration («восстановление») и liberation («освобождение»).
- source_word: archetypes
  choice: первообразы
  rationale: Естественный русский философско-богословский эквивалент, сохраняющий противопоставление образам.
- source_word: what is silent
  choice: безмолвное
  rationale: 'Субстантивированная форма сохраняет неопределённость: речь может идти о состоянии, области или реальности.'
theological_decisions:
- issue: Утверждение о том, что Сын нуждался в искуплении
  choice: 'Сохранено буквально: «Даже сам Сын… [нуждался] в искуплении»'
  alternative: Смягчить до «участвовал в искуплении» или отнести нужду только к принятой им плоти
  rationale: Свидетель формулирует богословски напряжённое утверждение прямо; перевод не должен согласовывать его с позднейшими доктринальными системами.
- issue: Отношение Всего к Полноте
  choice: Термины разведены как «Всё» и «Полнота»
  alternative: Передавать оба словом «полнота»
  rationale: Их отождествление уничтожило бы различие, явно поддерживаемое английским свидетелем, и заранее разрешило бы космологическую неоднозначность.
- issue: «Те, кто слева» и «те, кто справа»
  choice: Сохранены обе группы без нравственной или ангелологической идентификации
  alternative: Назвать их злыми и добрыми силами
  rationale: Сам отрывок говорит об освобождении от власти обеих сторон и не даёт основания навязывать им конфессионально заданные роли.
- issue: Референт местоимения в «возлагает надежду на неё»
  choice: Сохранено местоимение женского рода без уточнения
  alternative: Явно назвать Церковь или Призвание
  rationale: В ближайшем контексте возможно более одного женского референта; свидетель не позволяет уверенно снять неоднозначность.
- issue: «Ангельское искупление Отца»
  choice: Сохранена родительная конструкция
  alternative: Развернуть как «искупление, посланное Отцом ангелам»
  rationale: Родительный падеж допускает несколько отношений, как и свидетель; истолковывающая развёртка была бы чрезмерной.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Технические космологические названия даны с прописной буквы. Квадратные скобки, пустые скобки, угловые скобки, круглые скобки и многоточие сохранены как текстологические и редакционные сигналы английского публичного свидетеля. Прямой пересмотр по коптскому тексту ещё не выполнен, поэтому спорные синтаксические связи не были самовольно нормализованы.
