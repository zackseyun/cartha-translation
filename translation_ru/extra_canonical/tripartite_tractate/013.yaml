lexical_decisions:
- source_word: lust for control
  choice: жажда власти
  rationale: Передаёт настойчивое стремление господствовать естественным современным русским выражением, не ослабляя отрицательной окраски.
- source_word: orders
  choice: чины
  rationale: Сохраняет смысл упорядоченных разрядов или иерархических групп в космологическом контексте; «порядки» звучало бы менее естественно.
- source_word: the Word
  choice: Слово
  rationale: Сохраняет персонифицированный богословско-космологический термин и его возможную связь с Логосом, не добавляя толкования.
- source_word: memory
  choice: память
  rationale: Буквально сохраняет абстрактную космологическую категорию, несмотря на её непривычность по-русски.
- source_word: Fullnesses
  choice: Полноты
  rationale: Сохраняет множественное число и специальный космологический смысл, не сводя выражение к единственной «Плероме».
- source_word: deficient
  choice: ущербен
  rationale: Передаёт состояние недостаточности или изъяна, оставляя открытым точный метафизический смысл.
theological_decisions:
- issue: Статус Слова
  choice: 'Персонификация и средний грамматический род сохранены: «Слово... оно»'
  alternative: «Логос... он»
  rationale: Свидетель использует Word; перевод «Слово» сохраняет традиционную смысловую связь, но не импортирует более узкую интерпретацию через транслитерацию.
- issue: Неясная связь света, жизни и братской любви в финале
  choice: Слово «свет» повторено после тире как вероятный носитель определения «рождённый»
  alternative: Отнести «рождённый» к жизни или к восходящему персонажу
  rationale: Синтаксис английского свидетеля неоднозначен. Повтор делает русский текст читаемым, однако сноска отмечает нерешённость референции.
- issue: «Тот, кто взошёл ввысь» и «тот, кто был ущербен»
  choice: Оставлены как два грамматически различимых, но не идентифицированных референта
  alternative: Отождествить их или назвать конкретными космологическими фигурами
  rationale: Свидетель не даёт достаточных оснований для конфессионального или систематического отождествления.
