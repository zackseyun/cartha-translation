  verdict: revise
  source_fidelity: 'В целом переданы последовательность аргумента, специальная терминология и все видимые сигналы лакун. Однако в нескольких местах черновик чрезмерно интерпретирует свидетель: «чин подобных им» подменяет «тех, кто такого рода»; в повреждённом месте [against] внесено не засвидетельствованное «[противостояние]»; «зависть… возобладали» меняет нейтральное «последовали/наступили». В финале повтор «свет» однозначно делает свет «рождённым», хотя английское свидетельство допускает иной синтаксический охват; ближайшая конструкция связывает «рождённую» с жизнью, но примечание должно отмечать нерешённость.'
  naturalness: Русский литературный и в основном естественный. Исправления делают фрагментарный участок более прозрачным, не заполняя лакуны догадками, и устраняют неудачное «затопили» в пользу менее чрезмерной метафоры «оказались наводнены».
  terminology: «Жажда власти», «чины», «Слово», «память», «Полноты» и «неведение» уместны для данного космологического текста. «Более достойными» несколько сужает honorable; «более почитаемыми» точнее передаёт сравнительный статус без моральной оценки.
  issues:
  - severity: medium
    issue: Интерпретативная замена в повреждённом фрагменте
    rationale: Английское свидетельство сохраняет восстановление [against], тогда как «[противостояние]» превращает предлог в содержательное существительное и добавляет смысл.
  - severity: medium
    issue: «Возобладали» вместо succeeded
    rationale: «Succeeded» здесь означает, что перечисленные состояния последовали/наступили; «возобладали» вводит идею победы или господства, отсутствующую в свидетельстве.
  - severity: medium
    issue: Финальная синтаксическая неоднозначность устранена без необходимости
    rationale: Повтор «свет, рождённый…» выбирает свет как носитель определения. Более близкое чтение английской пунктуации связывает «begotten» с жизнью, но примечание должно сохранять возможность иных связей.
  - severity: low
    issue: «Чин подобных им» добавляет референт
    rationale: Those of this kind означает «тех, кто такого рода»; местоимение «им» в русском создаёт связь, которой свидетель прямо не устанавливает.
  revised_text: "Другие были сильнее в жажде власти, потому что были более почитаемы [] прежних, восставших против них. Те отказались смириться, думая, что произошли сами от себя, не имея начала, и что в отношении порождения именно они первыми породили других. Два чина воевали друг с другом, сражаясь за власть в силу своего образа бытия. В результате они оказались наводнены силами и природами, отображающими взаимную борьбу, исполненными жажды власти и всего ей подобного. Из-за них пустая любовь к славе побуждала их жаждать власти, хотя ни один из них не обладал возвышенной мыслью и не распознавал её.\n\n\n      Силы этой мысли были приготовлены вместе с <именами> предсуществующих <сущих>, образами которых они являются.[a] Чин тех, кто такого рода, пребывал во взаимном согласии. Однако они сражались против чина принадлежащих подобию, тогда как чин принадлежащих подобию воевал против подобий и в ярости выступал против них. [] Отсюда это [произошло ... их] собственное [против] друг друга; многие\
    \ [...] необходимость расположила их [...] чтобы они могли одолеть [...] он не переставал [...] и последовали их зависть и [их] ярость, насилие, вожделение и неведение, порождая разнообразные виды материи и различные силы, во множестве смешанные между собой. Между тем Слово, ставшее причиной их порождения, в своей мысли ожидало откровения [надежды], которая должна была прийти к нему свыше.\n\n\n      Пробудившись к действию, Слово обрело надежду и ожидание Возвышенного. От принадлежащих тени оно совершенно отдалилось, потому что они воевали против него и нисколько не смирялись перед ним; зато оно обрело покой среди принадлежавших памяти. Что же до возникших через память, Слово незримо и согласно их природе произвело того, кто взошёл ввысь, вспоминая того, кто был ущербен, пока свет не воссиял на него свыше, даруя жизнь, рождённую мыслью о братской любви среди предсуществующих Полнот.[b]"
