  yaml_path: translation/extra_canonical/tripartite_tractate/001.yaml
  text: '[] When discussing exalted matters, it is fitting to begin with the Father, the root of the Totality, from whom we have received the gift of speaking about him. Before anything besides him came into being, he existed.


    Like a number, the Father is one, because he comes first and is alone in himself. Yet he does not resemble someone who is merely one. If he did, how could he be a father? For whenever a father exists, the name “son” follows. The one who is the Father alone resembles the root of a tree with branches and fruit. Strictly speaking, he is called a father because he is incomparable and unchanging. This is why, strictly speaking, he is one and is a god, since no one stands in relation to him as a god, because no one is his father. For he is unbegotten: no one else begot him, and no one else created him. Anyone who is someone else’s father or creator also has a father and a creator. Certainly, he can be the father and creator of someone who came into being from him and whom he created. But, strictly speaking, he is not a father and is not a god, because there was [] someone who [begot and] created him. Therefore, strictly speaking, only he is Father and God who has had no one beget him. As for
    the Totalities, he is the one who begot and created them.


    He has no beginning and no end, but it is not merely that he has no end. Because he is unbegotten, he is deathless. Yet he is also unchanging in his eternal being, in his self-identity, in what established him, and in what makes him great. He will never be separated from what makes him exist, and no one will compel him to bring forth any intention he has never willed. No one originated the Father’s existence, and so he is unchanging. No one can separate him from his own being and self-identity, in which he exists, or from his greatness, which is why no one can comprehend him. It is impossible for anyone to change his form into something different, to lower him, to change him, or to diminish him. This is <how>, in the fullness of truth, he is the unchangeable and invariable one, with immutability as his garments. It is not merely that he is called “Beginningless” and “Endless”; he was not born, nor will he die. Thus, just as he is without beginning and without end in the way he exists,
    so [] in his greatness he cannot be reached. He is incomprehensible in his wisdom, unfathomable in his power, and unknowable in his sweetness.


    Strictly speaking, only he who is good—the unbegotten Father and the wholly perfect one—is full of his offspring, of every virtue, and of everything valuable. He possesses still more, including the absence of all spite, so that one may find that all who possess anything owe it to him, because he bestows it. Yet he is unattainable and tireless in his giving, rich in the gifts he gives and at rest in the favors he lavishes.


    His category, form, and great scale are such that none have been with him from the beginning. There is no place where he dwells, from which he proceeds, or into which he enters. There is no primal form that he uses as a pattern when he works. No difficulty accompanies him in anything he does, nor is any matter available for him to use in creating what <he> creates. There is no substance inhering in him that he uses to beget whatever he begets, nor is there any coworker accompanying him in his work. To claim anything like this is ignorance. Instead, one should declare that he is good, without defect, perfect, [] entire, since he is the Totality.


    None of the names that are thought or spoken, seen or understood, apply to him, no matter how immensely majestic, glorifying, and reverential they may be. Such names may, however, be spoken for his glory and honor, according to the ability of those who glorify him. As for what inheres in his existence, being, and form, the mind cannot conceive of him, words cannot express him, eyes cannot behold him, and no one can comprehend him. This is because of his unsearchable greatness, his ungraspable depth, his limitless height, and his unlimited <extension>.


    This is the character of what is unbegotten: it does not extend or join itself to anything as something limited does. Instead, he has a character without possessing a face or form, things that can be comprehended through perception. This is why he is incomprehensible.'
translation:
  language: ru
  text: '[] Рассуждая о возвышенном, подобает начать с Отца — корня Всецелого, от которого мы получили дар говорить о нём. Прежде чем возникло что-либо помимо него, он уже существовал.


    Подобно числу, Отец един, потому что он первый и пребывает один. И всё же он не подобен тому, кто просто один. Если бы он был таким, как мог бы он быть отцом? Ведь где есть отец, там следует и имя «сын». Но Единый, который один есть Отец, подобен корню дерева с ветвями и плодами. В собственном смысле он именуется Отцом, потому что он несравним и неизменен. Поэтому в собственном смысле он един и он — Бог: никто не соотносится с ним как с богом, ибо никто не является его отцом. Ведь он нерождён: никто иной не родил его и никто иной не создал его. Всякий же, кто является отцом или создателем другого, сам также имеет отца и создателя. Конечно, он может быть отцом и создателем того, кто произошёл от него и кого он создал; однако такой, строго говоря, не есть отец и не есть бог, потому что был [] некто, кто [родил и] создал его. Поэтому лишь тот в собственном смысле есть Отец и Бог, кого никто не рождал. Что же касается Всецелостей[a], то именно он родил и создал их.


    У него нет ни начала, ни конца, но дело не только в том, что у него нет конца. Поскольку он нерождён, он бессмертен; однако он также неизменен в своём вечном бытии, в своей тождественности себе, в том, что утвердило его, и в том, что делает его великим. Он никогда не будет отделён от того, благодаря чему существует, и никто не принудит его осуществить намерение, которого он никогда не желал. Никто не положил начала бытию Отца, и потому он неизменен. Никто не может отделить его от собственного бытия и тождественности себе, в которых он существует, ни от его величия, из-за которого никто не может постичь его. И невозможно, чтобы кто-либо придал его облику иной вид, унизил его, изменил или умалил. Вот <как> в полноте истины он пребывает неизменным и непреложным, облечённый в неизменность, словно в одежды. Он не только называется «Безначальным» и «Бесконечным»: он не был рождён и не умрёт. Итак, как в своём существовании он не имеет начала и конца, так [] в своём величии он недостижим: непостижим
    в своей мудрости, неисследим в своей силе и непознаваем в своей благости[b].


    В собственном смысле лишь он, Благой — нерождённый Отец и всецело Совершенный, — исполнен своего потомства, всех добродетелей и всего ценного. Но он обладает и ещё большим, в том числе полным отсутствием злобы, так что становится ясно: все, кто чем-либо обладает, обязаны этим ему, ибо он всё дарует. И хотя сам он недостижим, он не утомляется дарить: он богат дарами, которые подаёт, и пребывает в покое среди изливаемых им благодеяний.


    Его природа, облик и безмерное величие таковы, что никто не был с ним от начала. Нет места, где он обитал бы, откуда выходил бы или куда входил бы. Нет и первообраза, которым он пользовался бы как образцом в своих делах. Что бы он ни делал, ничто не представляет для него трудности; нет и вещества, которым он мог бы воспользоваться, создавая то, что <он> создаёт. Нет в нём и какой-либо сущности, которой он пользовался бы, рождая то, что рождает; нет и соработника, который помогал бы ему в его деле. Утверждать что-либо подобное — невежество. Напротив, следует говорить, что он благ, без изъяна, совершенен, [] целостен, поскольку он — Всецелое[c].


    Ни одно из имён — мыслимых или произносимых, видимых или постигаемых — к нему неприменимо, сколь бы величественным, прославляющим и благоговейным оно ни было. Однако такие имена можно произносить ради его славы и чести — в меру способности тех, кто прославляет его. Что же до присущего его существованию, бытию и облику, то ум не может помыслить его, слова не могут выразить его, глаза не могут увидеть его и никто не может постичь его. Причина тому — его неисследимое величие, непостижимая глубина, безграничная высота и беспредельная <протяжённость>[d].


    Таково свойство нерождённого: оно не простирается к чему-либо и не соединяется с чем-либо так, как нечто ограниченное. Напротив, ему присуща определённость[e], но нет у него лица или облика — того, что постигается восприятием. Поэтому он непостижим.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Всецелости» — множественное число специального термина трактата; вероятно, речь обо всех полнотах или совокупностях сущего. Точное значение требует сверки с коптским текстом.
    reason: Сохранить необычное число и космологическую неоднозначность термина.
  - marker: b
    text: 'Буквально в английском свидетельстве: «в своей сладости»; слово может обозначать благость, приятность или милостивую привлекательность.'
    reason: Отразить лексическую неоднозначность при естественном основном переводе.
  - marker: c
    text: «Всецелое» здесь отнесено к самому Отцу, тогда как выше он назван корнем Всецелого. Это напряжение сохранено как черта текста.
    reason: Не позволить читателю принять различие за редакционную непоследовательность перевода.
  - marker: d
    text: Слово «протяжённость» восстановлено издателями; угловые скобки обозначают редакционное восполнение.
    reason: Объяснить сигнал восстановления повреждённого текста.
  - marker: e
    text: В английском свидетельстве здесь стоит многозначное «character» — «свойство», «характер» или «определённость». Смысл фразы не вполне ясен.
    reason: Прямой анализ коптского источника ещё не выполнен, поэтому неясность не следует скрывать.
lexical_decisions:
- source_word: the Totality / the Totalities
  choice: Всецелое / Всецелости
  rationale: Сохраняется специальная космологическая лексика трактата и различие единственного и множественного числа; «всё» или «совокупность» чрезмерно упрощали бы термин.
- source_word: unbegotten
  choice: нерождённый
  rationale: Формально передаёт отсутствие рождения или происхождения, не подменяя его более конфессионально нагруженным термином.
- source_word: strictly speaking
  choice: в собственном смысле; строго говоря
  rationale: Оба естественных русских соответствия передают авторское разграничение абсолютного и относительного употребления имён.
- source_word: self-identity
  choice: тождественность себе
  rationale: Философски точное и при этом понятное обозначение неизменного совпадения с самим собой.
- source_word: sweetness
  choice: благость
  rationale: Буквальная «сладость» в современном русском звучала бы телесно и неестественно; «благость» передаёт положительное, притягательное качество, но отмечено как неоднозначное.
- source_word: category and form and great scale
  choice: природа, облик и безмерное величие
  rationale: Буквальная «категория» здесь непонятна обычному читателю; контекст описывает способ бытия и величие Отца. Неясность исходного свидетельства отражена в решении без догматической конкретизации.
- source_word: matter
  choice: вещество
  rationale: Передаёт идею отсутствия предсуществующего материала для творения.
- source_word: extension
  choice: протяжённость
  rationale: Сохраняет пространственно-философский оттенок восстановленного слова и угловые скобки.
- source_word: character
  choice: свойство; определённость
  rationale: В заключительном абзаце английское свидетельство повторяет многозначное слово; варианты выбраны по синтаксису, без превращения его в физическую форму.
theological_decisions:
- issue: Отец назван «a god», а затем «Father and God»
  choice: «он — Бог» и «Отец и Бог»
  alternative: «он — бог»
  rationale: В русском отсутствие артикля не выражается; контекст говорит об абсолютном Отце и Боге. При этом последующее рассуждение о соотнесённости сохранено и не сглажено.
- issue: 'Парадокс: тот, у кого есть создатель, «не есть отец и не есть бог» в собственном смысле'
  choice: Сохранить формулировку без гармонизации
  alternative: Пояснить её как различие абсолютного и относительного отцовства
  rationale: Трактат намеренно развивает напряжённое различение собственно и производно именуемого; пояснение в тексте навязало бы толкование.
- issue: Отец одновременно корень Всецелого и сам Всецелое
  choice: Сохранить оба утверждения
  alternative: Унифицировать их, назвав Отца источником всего
  rationale: Так сохраняется метафизическое напряжение текста, а не разрешается редакционно.
- issue: «what established him» при утверждении нерождённости Отца
  choice: «в том, что утвердило его»
  alternative: «в собственной утверждённости»
  rationale: Сохраняется трудная и потенциально парадоксальная формулировка свидетельства; без коптской сверки её нельзя безопасно переосмыслить.
- issue: Отсутствие образца, материи, внутренней сущности и соработника
  choice: Передать каждое отрицание отдельно
  alternative: Сжать до утверждения о творении из ничего
  rationale: Формула creatio ex nihilo была бы богословским обобщением; исходный текст перечисляет несколько самостоятельных отрицаний.
- issue: Неприменимость имён при допустимости их произнесения
  choice: Сохранить апофатическое напряжение
  alternative: Уточнить, что имена лишь аналогичны
  rationale: Текст допускает имена ради хвалы, но не формулирует позднейшую теорию аналогии.
translation_notes:
  register: 'Современный литературный русский с возвышенным философско-богословским регистром. Синтаксис по возможности упрощён для ясности, но повторения, апофатические ряды и парадоксы сохранены. Квадратные скобки передают лакуны или повреждения рукописи, угловые — редакционные восстановления. Проект предварительный: предоставленное основание является публичным английским свидетельством; необходима прямая сверка с коптским текстом Nag Hammadi Codex I,5.'
