base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/023.yaml
  text: 'The prophets, however, spoke nothing by their own will. Instead, each of them spoke about the things he saw and heard concerning the proclamation of the Savior. What he proclaimed—and the central theme of their proclamation—was what each one said about the coming of the Savior: that it would arrive. At times the prophets speak about it as though he has yet to be born, while at other times it is as though the Savior speaks through their mouths, saying that the Savior will arrive and show favor to those who did not know him. Accordingly, they did not all say everything in the same way. Rather, through the power given to each one to speak about him and about the place he saw, each thought that the Savior would be born from that place and would come from there. Accordingly, none of them knew where he would come from or who would beget him. They were worthy to speak only of this: that he would be born and would suffer. As for his pre-existence and his eternal existence as unbegotten,
    incapable of suffering <…> not from the Word, who came into being in flesh, [] it never entered their thoughts.


    And this is the message they were inspired to deliver concerning his flesh that would appear. It is said that his birth was like the birth of all of them, but that, above all else, it was from the spiritual Word, the cause of the things that have come into being. The one from whom the Savior received his flesh did indeed beget him in the form of a seed, at the revelation of the light, in agreement with the promised word of his revelation, <being> indeed the state of <a> seed of <what was>, though begotten last. However, the one whom the Father ordained to manifest salvation through him, who is the fulfillment of the promise, when he descended into life, he was given every means necessary for his descent. His Father is one, the only one who is truly a father to him: the unseen and unknowable one, ungraspable by nature, who alone is God and who, by his will and his gift, has granted that he could be seen, known, and grasped.'
translation:
  language: ru
  text: 'Однако пророки ничего не говорили по собственной воле: каждый из них говорил о том, что видел и слышал в связи с возвещением Спасителя. То, что он возвещал, — и главная тема их возвещения — заключалось в сказанном каждым о пришествии Спасителя: что оно наступит.[a] Иногда пророки говорят об этом так, словно ему ещё предстоит родиться, а иногда — словно сам Спаситель говорит их устами, возвещая, что Спаситель придёт и окажет милость тем, кто его не знал. Поэтому не все они говорили обо всём одинаково. Напротив, благодаря данной каждому силе говорить о нём и о том месте, которое он видел, каждый полагал, что именно там родится Спаситель и оттуда он придёт. Поэтому никто из них не знал, откуда он придёт и кто его породит. Они были удостоены говорить лишь о том, что он родится и будет страдать. Что же до его предсуществования и вечного бытия как нерождённого, не способного страдать, <…> не от Слова, ставшего плотью, [] — это никогда не приходило им на ум.[b]


    И вот весть, которую они были вдохновлены передать о его плоти, которой предстояло явиться. Сказано, что его рождение было подобно рождению всех их, но прежде всего оно было от духовного Слова — причины всего возникшего. Тот, от кого Спаситель получил свою плоть, действительно породил его в образе семени при откровении света, в согласии с обещанным словом его откровения, <будучи> действительно состоянием <некоего> семени <того, что было>, хотя и рождённым последним.[c] Однако тому, кого Отец предназначил явить через него спасение и кто есть исполнение обещания, при его нисхождении в жизнь было дано всё необходимое для этого нисхождения.[d] Его Отец — один, единственный, кто поистине является ему Отцом: невидимый, непознаваемый, по природе непостижимый, единственный Бог, который по своей воле и своему дару позволил, чтобы его можно было увидеть, познать и постичь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимения в этом предложении колеблются между возвещающим лицом и возвещаемым пришествием; перевод сохраняет этот переход.
    reason: Предупредить читателя о реальной местоименной неоднозначности свидетельства.
  - marker: b
    text: Угловые скобки, многоточие и пустые квадратные скобки передают признаки утраты текста или редакторского восстановления в использованном свидетельстве; синтаксис отрывка поэтому остаётся неполным.
    reason: Обозначить повреждение источника и не выдавать реконструкцию за достоверный текст.
  - marker: c
    text: Фраза о «состоянии семени» крайне неясна и сохранена почти буквально; слова в угловых скобках являются редакторским восполнением использованного свидетельства.
    reason: Сохранить неясность повреждённого текста и прозрачность редакторских дополнений.
  - marker: d
    text: В сложной конструкции «тот, кого Отец предназначил» и последующие местоимения могут пониматься по-разному; перевод следует наиболее непосредственной грамматической связи, не устраняя неоднозначности полностью.
    reason: Зафиксировать возможную смену или неясность референта без догматического разрешения.
lexical_decisions:
- source_word: Savior
  choice: Спаситель
  rationale: Устоявшийся и понятный русский религиозный термин, сохраняющий титульный характер слова.
- source_word: proclamation
  choice: возвещение
  rationale: Передаёт публичное провозглашение и избегает чрезмерно конфессионально окрашенного «проповедь».
- source_word: pre-existence
  choice: предсуществование
  rationale: Точный современный богословско-философский термин для бытия до земного явления.
- source_word: unbegotten
  choice: нерождённый
  rationale: Формально сохраняет противопоставление последующим упоминаниям рождения и порождения.
- source_word: impassible
  choice: не способный страдать
  rationale: Понятнее обычному читателю, чем специализированное «бесстрастный», и в контексте непосредственно связано с утверждением, что Спаситель будет страдать.
- source_word: spiritual Word
  choice: духовное Слово
  rationale: Сохраняет терминологическую и возможную ипостасную значимость «Слова», не истолковывая её дополнительно.
- source_word: beget
  choice: породить
  rationale: Сохраняет причинно-родительную лексику текста и отличается от обычного описательного «родить».
- source_word: grasped / ungraspable
  choice: постичь / непостижимый
  rationale: Сохраняет смысловую перекличку противоположных характеристик на естественном русском языке.
theological_decisions:
- issue: Колебание между пришествием как событием и Спасителем как лицом
  choice: Сохранены переходы от среднего рода «оно наступит» к мужскому «он придёт»
  alternative: Унифицировать всё как личное пришествие Спасителя
  rationale: Свидетель различает приход/пришествие и самого Спасителя; сглаживание устранило бы подлинную неоднозначность.
- issue: Повреждённое высказывание о предсуществовании и Слове
  choice: Синтаксис не исправлен догматически; знаки повреждения сохранены
  alternative: Реконструировать связное утверждение о нерождённом Слове или Спасителе
  rationale: Текст в этом месте фрагментарен, поэтому уверенная реконструкция могла бы внести отсутствующее в источнике учение.
- issue: Отношение плоти Спасителя к родителю и духовному Слову
  choice: 'Сохранены оба утверждения: плоть получена от породившего его, а рождение прежде всего — от духовного Слова'
  alternative: Развести человеческое и божественное рождение поясняющей терминологией
  rationale: Источник оставляет напряжение между уровнями происхождения; перевод не должен навязывать позднейшую христологическую схему.
- issue: Референт местоимения в заключительной фразе
  choice: «его можно было увидеть, познать и постичь»
  alternative: «Он мог быть увиден, познан и постигнут» либо отнести местоимение к Спасителю
  rationale: Местоименная связь остаётся потенциально неоднозначной; русский перевод следует ближайшему референту — Богу/Отцу — без дополнительного толкования.
translation_notes:
  register: 'Современный литературный русский язык с dignified религиозно-философским регистром. Синтаксис по возможности упрощён для ясности, но терминологические повторы и напряжения исходного свидетельства сохранены. Проект предварительный: он основан на предоставленном англоязычном публичном свидетельстве; прямая сверка с коптским текстом Наг-Хаммади I,5 ещё необходима.'
