translation:
  language: ru
  text: 'Однако он был <помощником> и избавителем от их заблуждения и мятежа, потому что от него [происходит] обращение, называемое «покаянием». Это случилось, [когда] Слово [изменило] своё мнение и образ мыслей. Отвернувшись от зла, оно обратилось к благому. После обращения оно вспомнило тех, кто существует, и молитву за того, кто посредством благого обратил самого себя. Сначала оно помолилось тому, кто пребывает в Полноте, и вспомнило его, затем — своих братьев, каждого по отдельности и одновременно всех вместе, но прежде всех — Отца.


    [a] Совместная молитва помогла ему возвратиться <к> самому себе и ко Всеединству, потому что вспомнить тех, кто существовал от начала, его побудило то, что и о нём самом вспомнили. Это была далёкая мысль, которая зовёт издалека и возвращает его.


    Вся его молитва и всё памятование заключали в себе несколько сил, согласных с упомянутым прежде пределом, потому что ничто в его мысли не бесплодно. Эти силы были благими и превосходили силы подобия, ведь силы подобия также принадлежат [тёмной] природе. То, чем они стали, возникло из обманчивого представления о сходстве и [тщеславной мысли] гордыни; возникли они и из [мысли], которая первой познала их. А прежние существа — чему они подобны? Они подобны <забвению> и глубокому сну — людям, которых тревожат тяжёлые сновидения и которых во сне <кто-то> преследует и мучит. Другие же для него подобны озарённым светом существам, ожидающим восхода солнца, ибо они увидели в нём сны, которые и вправду сладостны.


    Тотчас [b] истечения мысли <прекратились>: у них больше не было ни сущности, ни чести, [ибо] <они> не равны тем, кто существовал прежде. Если же они и превосходили [силы] подобия, то возвышались над ними лишь потому, что действовали с добрым намерением: они произошли не от возникшей немощи. Доброе намерение принадлежало <тому, кто> после молитвы искал Предсуществующего и возвышался к благому. Он посеял в них стремление искать Предсуществующего, исполненного славы, и молиться ему; посеял в них способность помышлять [о нём] и понимать, что прежде них существовало нечто большее, чем они сами, хотя они и не знали, что это было. Породив согласие и взаимную любовь, благодаря этой мысли они действовали в единстве и единодушии, поскольку от единства и единодушия получили своё существование.'
