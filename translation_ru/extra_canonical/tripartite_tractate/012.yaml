    Тотчас [b] истечения мысли <прекратились>: у них больше не было ни сущности, ни чести, [ибо] <они> не равны тем, кто существовал прежде. Если же они и превосходили подобия, то возвышались над ними лишь потому, что действовали с добрым намерением: они произошли не от возникшей немощи. Доброе намерение принадлежало <тому, кто> после молитвы искал Предсуществующего и возвышался к благому. Он посеял в них стремление искать Предсуществующего, исполненного славы, и молиться ему; посеял в них способность помышлять [о нём] и способность думать, что прежде них существовало нечто большее, чем они сами, хотя они и не знали, что это было. Породив согласие и взаимную любовь, они, исходя из этой мысли, действовали в единстве и единодушии, поскольку от единства и единодушия получили своё существование.'
