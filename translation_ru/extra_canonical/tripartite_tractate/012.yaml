lexical_decisions:
- source_word: conversion called “repentance”
  choice: обращение, называемое «покаянием»
  rationale: 'Сохранены оба смысловых компонента: поворот/обращение и его наименование как покаяния, без сведения одного понятия к другому.'
- source_word: the Word
  choice: Слово
  rationale: Передано традиционным русским эквивалентом с прописной буквы; средний род местоимений поддерживает грамматическое согласование без навязывания личного рода.
- source_word: Fullness
  choice: Полнота
  rationale: Сохранён технический космологический термин с прописной буквы.
- source_word: Totality
  choice: Всеединство
  rationale: Выбрано отличное от «Полноты» обозначение, передающее совокупное целое и не стирающее терминологическое различие.
- source_word: powers
  choice: силы
  rationale: Прямой и естественный эквивалент, способный обозначать как способности, так и сущностные силы в контексте трактата.
- source_word: likeness
  choice: подобие
  rationale: Сохранено отвлечённое существительное и неоднозначность между сходством и особым разрядом существ.
- source_word: emanations
  choice: истечения
  rationale: Передаёт образ происхождения или излияния, не вводя позднейшую транслитерацию как обязательный доктринальный термин.
- source_word: pre-existent glorious one
  choice: Предсуществующий, исполненный славы
  rationale: Субстантивированное обозначение сохранено как титул, а характеристика славы передана без конфессионального уточнения референта.
theological_decisions:
- issue: Кто является субъектом обращения и молитвы
  choice: В первом абзаце субъект обозначен как «Слово» и далее местоимением среднего рода; при последующем переходе свидетельства к мужскому роду сохранено «он/ему».
  alternative: Повсюду унифицировать субъект как «он» либо как «Слово/оно».
  rationale: Свидетельство содержит напряжение в референции и грамматическом оформлении; его не следует молча устранять.
- issue: Соотношение обращения и покаяния
  choice: «обращение, называемое “покаянием”»
  alternative: Просто «покаяние».
  rationale: Формулировка сохраняет пояснительную конструкцию источника и не отождествляет без остатка два понятия.
- issue: Причина памятования
  choice: «его побудило то, что и о нём самом вспомнили»
  alternative: «потому что он сам был помянут/предопределён».
  rationale: Сохранён пассив и неопределённость действующего лица, без догматического определения того, кто вспомнил о нём.
- issue: Статус сил подобия и последующих сил
  choice: Сохранено сравнительное превосходство при одновременной оговорке об их ограниченности.
  alternative: Представить позднейшие силы однозначно добрыми или однозначно злыми.
  rationale: Текст удерживает сложную градацию происхождения, намерения и онтологического статуса.
- issue: Референт «того, кто обратил самого себя»
  choice: Сохранена возвратная формулировка без отождествления с Отцом, Словом или иным существом.
  alternative: Явно назвать референта.
  rationale: Свидетельство не даёт достаточного основания для устранения неоднозначности.
translation_notes:
  register: Современный литературный русский с достоинством трактатного, богословско-философского изложения. Угловые скобки сохранены для редакторских восполнений, квадратные — для повреждённых или реконструированных мест; пустые лакуны вынесены в маркированные примечания. Поскольку прямой анализ коптского текста ещё не выполнен, формулировки остаются предварительными и опираются на указанное англоязычное публичное свидетельство.
