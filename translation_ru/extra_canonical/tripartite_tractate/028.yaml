review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод точно следует предоставленному английскому свидетельству; прямое сопоставление с коптским текстом пока невозможно, поскольку в материалах оно прямо обозначено как pending. Требуется исправить передачу двух лакун: в первом случае знак [] был заменён маркером сноски, а во втором лакуна должна оставаться видимой перед названием «свет». Также следует точнее передать «a single name» и «unspeakable and ungraspable face».'
  naturalness: Регистр в целом удачен и соответствует современному литературному русскому. Исправлены неестественное «одеянием, которого носящие» и избыточное «безмолвная тишина»; несколько фраз перестроены без сглаживания смысловой и текстологической неопределённости.
  terminology: «Совокупности», «искупление», «брачный чертог», «познание» и «бессмертие» сохранены. Формула «Отец [и] Бог» и редакционные обозначения сохранены без конфессионального истолкования.
