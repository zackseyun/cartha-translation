    rationale: В английском свидетельстве после «single name of the gospel» стоит самостоятельное []; в черновике вместо него поставлен только маркер [a]. Сноска не должна заменять текстологическое обозначение.
  - severity: medium
    issue: Лакуна перед «светом» передана только сноской, а не в тексте.
    rationale: Исходное свидетельство содержит [] непосредственно перед названием «the light». Для сохранения повреждённости текста знак должен остаться в основном тексте.
  - severity: low
    issue: «составляют единое имя» чрезмерно объясняет связку «[which] are a single name».
    rationale: «суть единое имя» ближе к свидетельству и сохраняет его грамматическое напряжение между множественным и единственным числом.
  - severity: low
    issue: «одеянием, <которого> носящие его не снимают» грамматически неудачно.
    rationale: После «одеянием» требуется винительное «<которое>»; это безопасная языковая правка без изменения редакционной реставрации.
  - severity: low
    issue: «лик, который невозможно выразить и постичь» ослабляет «unspeakable».
    rationale: «Неизречённый и непостижимый лик» точнее передаёт пару предикатов свидетельства.
