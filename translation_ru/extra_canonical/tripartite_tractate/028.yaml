    text: В рукописном свидетельстве в этом месте имеется лакуна; её объём и утраченные слова неизвестны.
    reason: Объясняет знак текстовой утраты, не восполняя содержание догадкой.
  - marker: b
    text: Перед выражением «светом, который не заходит» в тексте имеется лакуна.
    reason: Сохраняет указание на повреждение текста в месте, где синтаксическая связь может быть неполной.
  - marker: c
    text: Фраза повреждена и остаётся неясной; многоточие в угловых скобках отмечает утраченный текст.
    reason: Предупреждает читателя, что трудность последней фразы обусловлена состоянием свидетельства, а не сознательным сглаживанием перевода.
lexical_decisions:
- source_word: Totalities / Totality
  choice: Совокупности / Совокупность
  rationale: Сохранён характерный для трактата технический термин и различие множественного и единственного числа; «полноты» могло бы преждевременно отождествить его с иным устоявшимся термином.
- source_word: redemption
  choice: искупление
  rationale: Передаёт религиозно-сотериологический смысл и остаётся естественным для литературного русского языка.
- source_word: profession of faith
  choice: исповедуют веру / исповедал в вере
  rationale: Сохраняет публично-свидетельственный оттенок исповедания, не сводя выражение к простому утверждению.
- source_word: bridal chamber
  choice: брачный чертог
  rationale: Достоинный и понятный сакральный образ, точнее сохраняющий символическое значение, чем бытовое «спальня».
- source_word: deathlessness
  choice: бессмертие
  rationale: Естественный русский эквивалент, сохраняющий пояснение к «вечной жизни».
- source_word: intricate
  choice: многообразно сплетённому
  rationale: Передаёт сложную взаимосвязанность без отрицательной коннотации слова «запутанный».
- source_word: knowledge
  choice: познание
  rationale: Сохраняет процессуально-духовный оттенок, не вводя отдельно термин «гнозис».
theological_decisions:
- issue: Единство имён Отца, Сына и Святого Духа
  choice: «эти имена, [которые] составляют единое имя»
  alternative: «эти имена, [то есть] единое имя»
  rationale: Сохранены грамматическое напряжение между множественным и единственным числом и редакционные скобки; формула не перетолкована конфессионально.
- issue: «Отец (и) Бог»
  choice: «Отец [и] Бог»
  alternative: «Бог Отец»
  rationale: Не сглажена неясная связь слов и не создана более привычная догматическая формула, отсутствующая в свидетельстве.
- issue: Взаимное единение Отца и верующего
  choice: «чтобы Отец стал един с ним… стать единым с Ним в познании»
  alternative: «чтобы он соединился с Отцом»
  rationale: Сохранено направление действия и взаимность исходного свидетельства без объяснения природы единства.
- issue: Субъект в образе брачного чертога
  choice: «тех, [кого] <Он познал и кто> познал Его»
  alternative: «тех, кто познал друг друга»
  rationale: Сохранены восстановленный текст, местоименный субъект и богословская двусмысленность.
- issue: Таинство и метафора крещения
  choice: Все наименования оставлены как последовательные названия одного крещения
  alternative: Истолковать их как отдельные обряды или ступени
  rationale: Текст сам связывает образы с одним истинным крещением; дополнительная сакраментальная система не импортирована.
translation_notes:
  register: Современный литературный русский с достоинством позднеантичного богословско-мистического трактата. Синтаксис умеренно упрощён для ясности, но повторения, парадоксы и технические образы сохранены. Квадратные скобки отмечают редакционную неопределённость или лакуны, угловые — восстановленный либо явно отсутствующий текст. Поскольку прямой разбор коптского источника ещё не выполнен, draft основан на предоставленном публичном английском свидетельстве и должен считаться предварительным.
