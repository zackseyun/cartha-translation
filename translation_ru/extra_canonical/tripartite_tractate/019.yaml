source:
  text: 'The beings of the memory located outside are humble, maintaining the representation of the Fullness, particularly on account of the mutual participation in the names that adorn them. The conversion results in humility toward the beings of the memory, and also having humility toward them is the law of judgment, being condemnation and anger.


    Having humility toward them is also the power that places those apart who fall beneath them, dispatching them far away. It prevents them [] [from] spreading out over the beings of the memory and the conversion. This (power) comprises fear, confusion, oblivion, bewilderment, ignorance, and (the things) that have come into being through imagination in the way a likeness does. In addition, the exalted names are bestowed on these things that indeed were lowly. Knowledge <is lacking for those> who were produced from them through pride, lust for control, disobedience, and falsity.


    On each <of> them he bestowed a name, because the two orders subsist in a name. Those who belong to the memory and to the representation are called “Those of the Right,” “Soulish,” “the Fiery Ones,” and “Those of the Middle.” Those who belong to the prideful thought and to the likeness are called “Those of the Left,” “Material,” “the Dark Ones,” and “the Last Ones.”


    After the Word founded each in their order, namely, the images and the representations and the likenesses, he preserved the aeon of the images pure against all who struggle against it, because it is a place of joy. To those of the memory, however, he revealed the thought he had stripped from himself, wishing to move them into a material union, to supply for them a system and an abode, so that they could also produce a desire to weaken the lure of evil for them. This was so that they could cease excessively delighting in the glory of their surroundings and so remaining in exile, but could instead recognize the infirmity they suffer. [] In this way, they could beget love and an unceasing search for the one who can heal them of this feebleness. To make them assume a form, he placed the word of beauty over those who belong to the likeness, placing over them the law of judgment as well. He further placed over them the powers which the roots had produced [in] their lust for control. The Word
    was pleased with them because they are useful in the plan of salvation, so he [chose] these to be rulers over them. This was so that by the assistance of the beautiful word, or by the threat of the [law], or by the sway of lust for control, the order could be protected from those who would lower it to evil.


    The Word knows the shared lust for control among the two orders. To these and to everyone else, he kindly granted their wish, giving to each the appropriate rank for command so that each would be a ruler over a place and an activity, deferring to those of higher order, to command the activity of the lower places, exerting control in agreement with his mode of being. The result was that among the angels [] and archangels there are leaders and subordinates in positions of rule and subjection, while the activities are diverse and of different kinds.


    Each of the archons with his race and his privileges enjoys that to which his lot has entitled him. Agreeing with the manner of their appearance, each stood at his post, being charged with the plan of salvation. And none lacks kingship over them from the end of the heavens to the end of the [earth], to every region of the [earth], and those beneath the earth. There are kings, there are lords, and those who are given commands, some for overseeing punishment, others for overseeing justice, still others for granting repose and healing, others for instruction, others for keeping watch.'
