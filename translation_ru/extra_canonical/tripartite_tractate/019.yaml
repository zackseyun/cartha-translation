base_translation:
  language: en
  yaml_path: translation/extra_canonical/tripartite_tractate/019.yaml
  text: 'The beings of memory who are located outside are humble, preserving the representation of the Fullness, especially because they share in the names that adorn them. Conversion results in humility toward the beings of memory, and humility toward them is also the law of judgment, which consists of condemnation and anger.


    Humility toward them is also the power that separates those who fall beneath them and sends them far away. It prevents them [] [from] spreading over the beings of memory and conversion. This power consists of fear, confusion, oblivion, bewilderment, ignorance, and the things that have come into being through imagination, as a likeness does. In addition, exalted names are bestowed on these things that were actually lowly. Knowledge <is lacking for those> who were produced from them through pride, lust for control, disobedience, and falsity.


    He bestowed a name on each <of> them, because the two orders exist in a name. Those who belong to memory and representation are called “Those of the Right,” “Soulish,” “the Fiery Ones,” and “Those of the Middle.” Those who belong to the prideful thought and the likeness are called “Those of the Left,” “Material,” “the Dark Ones,” and “the Last Ones.”


    After the Word established each in its own order—namely, the images, the representations, and the likenesses—he kept the aeon of the images pure from all who struggle against it, because it is a place of joy. To those of memory, however, he revealed the thought that he had stripped from himself. He wished to move them into a material union and to provide them with an ordered system and a dwelling place, so that they might also produce a desire to weaken evil’s attraction for them. In this way, they could cease taking excessive delight in the glory of their surroundings and thus remaining in exile, and instead recognize the infirmity from which they suffer. [] In this way, they could produce love and an unceasing search for the one who can heal them of this weakness. To make them take on a form, he placed the word of beauty over those who belong to the likeness, and he also placed the law of judgment over them. He further placed over them the powers that the roots had produced [in] their
    lust for control. The Word was pleased with them because they are useful in the plan of salvation, so he [chose] them to be rulers over them. This was so that, with the help of the beautiful word, by the threat of the [law], or through the influence of the lust for control, the order might be protected from those who would bring it down into evil.


    The Word knows the lust for control shared by the two orders. To them and to everyone else, he kindly granted their desire, giving each one the appropriate rank of command. Thus, each would rule over a place and an activity, deferring to those of a higher order while commanding the activity of the lower places and exercising control in accordance with his mode of being. As a result, among the angels [] and archangels there are leaders and subordinates in positions of rule and submission, while their activities are diverse and of different kinds.


    Each of the archons, together with his race and privileges, enjoys what his allotted portion has entitled him to. In keeping with the manner of their appearance, each one stood at his post, entrusted with the plan of salvation. None lacks kingship over them, from the end of the heavens to the end of the [earth], throughout every region of the [earth], and among those beneath the earth. There are kings and lords, as well as those who receive commands: some oversee punishment, others oversee justice, still others grant rest and healing, others provide instruction, and others keep watch.'
translation:
  language: ru
  text: '**Два порядка**


    Существа памяти, находящиеся вовне, смиренны и сохраняют отображение Полноты, особенно благодаря взаимному участию в украшающих их именах. Обращение ведёт к смирению перед существами памяти; и смирение перед ними есть также закон суда, то есть осуждение и гнев.


    Смирение перед ними есть также сила, которая отделяет тех, кто оказывается ниже них, и отсылает их далеко прочь. Она не даёт им [a] распространяться на существ памяти и обращения. Эта сила включает страх, смятение, забвение, растерянность, неведение и то, что возникло посредством воображения, как возникает подобие. Кроме того, этим вещам, которые в действительности были низкими, даются возвышенные имена. <Тем, кто> произошёл от них вследствие гордости, властолюбия, непослушания и лжи, недостаёт знания.[b]


    Каждому <из> них он дал имя,[c] потому что оба порядка существуют в имени. Принадлежащие памяти и отображению называются «Правыми», «Душевными», «Огненными» и «Средними». Принадлежащие горделивому помыслу и подобию называются «Левыми», «Материальными», «Тёмными» и «Последними».


    После того как Слово утвердило каждого в его порядке — образы, отображения и подобия, — оно сохранило эон образов чистым от всех, кто борется против него, ибо это место радости. Но существам памяти оно открыло помысл, который сняло с себя. Оно желало привести их к материальному единению, дать им упорядоченное устройство и обитель, чтобы в них возникло желание ослабить привлекательность зла для них. Тогда они перестали бы чрезмерно услаждаться славой того, что их окружает, и тем самым оставаться в изгнании, а вместо этого осознали бы немощь, от которой страдают. [d] Так в них могли бы зародиться любовь и непрестанный поиск того, кто способен исцелить их от этой слабости. Чтобы они обрели форму, Слово поставило слово красоты над принадлежащими подобию, а также поставило над ними закон суда. Кроме того, оно поставило над ними силы, которые корни породили [в] своём властолюбии.[e] Слово благоволило к ним, потому что они полезны в замысле спасения, и потому [избрало] их правителями над ними.[f]
    Это было сделано для того, чтобы с помощью прекрасного слова, угрозой [закона] или воздействием властолюбия порядок был защищён от тех, кто низвёл бы его ко злу.[g]


    Слово знает властолюбие, общее для обоих порядков. Им и всем прочим оно благосклонно даровало желаемое, дав каждому подобающий ранг власти, чтобы каждый господствовал над определённым местом и делом, подчинялся принадлежащим к высшему порядку, распоряжался деятельностью нижних мест и осуществлял власть согласно своему образу бытия. Поэтому среди ангелов [h] и архангелов есть начальствующие и подчинённые, занимающие положения власти и подчинения, а их дела разнообразны и различны по роду.


    Каждый из архонтов вместе со своим родом и своими преимуществами наслаждается тем, на что даёт ему право выпавший жребий. Сообразно тому, как они появились, каждый занял свой пост, и ему был вверен замысел спасения. И нигде не отсутствует царская власть над ними — от края небес до края [земли], во всякой области [земли] и среди тех, кто под землёй.[i] Есть цари и господа, а также получающие повеления: одни надзирают за наказанием, другие — за правосудием, третьи даруют покой и исцеление, иные наставляют, а иные несут стражу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В источнике перед словом, соответствующим «распространяться», имеется лакуна; восстановлена только синтаксическая связь.
    reason: Сохранить сигнал повреждения рукописи и не скрывать неопределённость утраченного текста.
  - marker: b
    text: Слова «Тем, кто» восстановлены издателями; конструкция о недостатке знания остаётся текстуально не вполне уверенной.
    reason: Отметить угловые скобки английского свидетельства и не выдавать восстановление за несомненный текст.
  - marker: c
    text: Слово «из» в выражении «каждому из них» является восстановлением.
    reason: Сохранить указание свидетельства на редакционное дополнение.
  - marker: d
    text: Здесь в рукописи имеется лакуна.
    reason: Обозначить возможный смысловой разрыв между осознанием немощи и возникновением любви.
  - marker: e
    text: Предлог «в» восстановлен в повреждённом месте.
    reason: Отразить квадратные скобки исходного свидетельства.
  - marker: f
    text: Глагол «избрало» восстановлен; местоименные отсылки в этом предложении допускают более одного понимания.
    reason: Сохранить повреждение текста и реальную неоднозначность того, кто поставлен над кем.
  - marker: g
    text: Слово «закона» восстановлено в лакуне.
    reason: Отметить текстуальную неуверенность при очевидной связи с ранее упомянутым законом суда.
  - marker: h
    text: После слова «ангелов» в рукописи имеется лакуна.
    reason: Показать, что перечень или синтаксическая связь могли быть полнее.
  - marker: i
    text: Оба вхождения слова «земли» находятся в повреждённых местах и восстановлены.
    reason: Сохранить сигналы реконструкции географического перечня.
lexical_decisions:
- source_word: Fullness
  choice: Полнота
  rationale: Сохранён устойчивый термин для обозначения метафизической полноты; прописная буква отмечает его специальное употребление.
- source_word: representation
  choice: отображение
  rationale: Передаёт производное воспроизведение первообраза и отличается от «образа» и «подобия», которые в тексте образуют отдельные категории.
- source_word: conversion
  choice: обращение
  rationale: Сохраняет возможность понимать термин и как поворот, и как духовное обращение, не уточняя направление сверх свидетельства.
- source_word: Word
  choice: Слово
  rationale: Традиционный и понятный эквивалент; грамматический средний род последовательно сохранён в местоименных отсылках.
- source_word: Soulish
  choice: Душевные
  rationale: Передаёт техническое обозначение порядка, связанного с душой, без замены конфессионально нагруженным толкованием.
- source_word: Material
  choice: Материальные
  rationale: Ясный современный эквивалент названия противоположного порядка; сохранена терминологическая параллельность другим именам.
- source_word: aeon
  choice: эон
  rationale: Сохранён специальный космологический термин, поскольку замена на «век» или «мир» преждевременно сняла бы неоднозначность.
- source_word: archons
  choice: архонты
  rationale: Транслитерация сохраняет специальное обозначение космических властителей и отличает их от более общих «правителей».
- source_word: plan of salvation
  choice: замысел спасения
  rationale: «Замысел» естественнее по-русски и не навязывает значения заранее составленной административной схемы.
- source_word: lust for control
  choice: властолюбие
  rationale: Кратко и естественно передаёт страстное стремление господствовать; повтор термина сохранён как смысловая связь раздела.
theological_decisions:
- issue: Статус двух порядков и данных им властей
  choice: 'Передать их функции без морального упрощения: Слово допускает их властолюбие и использует эти силы в замысле спасения.'
  alternative: Назвать один порядок однозначно добрым, а другой однозначно злым.
  rationale: Свидетельство сохраняет напряжение между низостью, властолюбием и полезностью этих сил; перевод не должен разрешать его конфессиональным толкованием.
- issue: Грамматическое обозначение Слова
  choice: Использовать «оно» в соответствии с русским средним родом слова «Слово».
  alternative: Использовать «он», подчёркивая личностное или христологическое прочтение.
  rationale: Так сохраняется буквальная лексическая форма и не вводится сверх данного отрывка более определённая идентификация.
- issue: «Закон суда» как осуждение и гнев
  choice: Сохранить формулу и пояснительное «то есть», не смягчая её.
  alternative: Истолковать суд как исправительное наказание или окончательный приговор.
  rationale: Источник оставляет характер и цель суда неразрешёнными.
- issue: Царская власть над архонтами и областями
  choice: 'Сформулировать без указания конкретного единственного царя: «нигде не отсутствует царская власть над ними».'
  alternative: Назвать Слово или высшее божество непосредственным царём каждой области.
  rationale: Синтаксис английского свидетельства неясен, а прямой обзор коптского текста ещё не выполнен; осторожная формулировка сохраняет неопределённость.
translation_notes:
  register: Современный литературный русский с достоинством трактатного стиля. Технические термины («Полнота», «эон», «архонты») сохранены, но синтаксис по возможности сделан доступным обычному читателю. Повторы ключевых слов намеренно не устранены. Проект основан на предоставленном публичнодоступном английском свидетельстве; прямой разбор коптского текста Nag Hammadi Codex I,5 ещё требуется, поэтому повреждения и редакционные восстановления явно отмечены.
