review_pass:
  verdict: revise
  source_fidelity: 'Прямая сверка с коптским текстом невозможна: предоставлен только английский публично-доступный свидетель, прямо обозначенный как промежуточная основа. По этому свидетельству чередование лакун, квадратных скобок, уведомлений об утраченных строках и синтаксическая неясность в целом сохранены. Однако «перенёс [Христос]» неоправданно сужает многозначное английское bore до страдания/претерпевания; безопаснее передать его без этого смыслового добавления как «то, что [Христос] принёс».'
  naturalness: 'Русский текст в целом литературен, но отдельные обороты нуждаются в правке: «не дадут своих имён» менее естественно, чем «не назовут своих имён»; «при приготовлении» неудачно в отвлечённом контексте; заключительная конструкция с субстантивированным «исполненный любящей милости» грамматически тяжела. Уточнение «тот, кто исполнен любящей милости» сохраняет неопределённость референта.'
  terminology: «Порождение», «вещественные», «брачный чертог», «Искупитель» и «старейшины» допустимы. «Полное восстановление» сохраняет формулировку свидетеля без доктринальной конкретизации. Строчные местоимения в заключительной доксологии не навязывают конфессионального решения о референте повреждённого синтаксиса.
  issues:
  - severity: medium
    issue: «перенёс [Христос]» для bore
    rationale: Этот выбор добавляет значение претерпевания, которого английский свидетель не фиксирует однозначно; в столь фрагментарном месте это небезопасное сужение.
  - severity: low
    issue: «не дадут своих [имён]»
    rationale: При сохранении смысла естественнее по-русски «не назовут своих [имён]».
  - severity: low
    issue: Неестественная заключительная формула «кого объемлет исполненный любящей милости»
    rationale: В английском имеется субстантивированное one; явное «тот, кто» делает русский синтаксис нормативным, не определяя, кто именно имеется в виду.
  - severity: low
    issue: Заглавные местоимения в повреждённом месте
    rationale: «Он», «Себя», «Свою», «Его» визуально усиливают определённость референта, тогда как свидетель оставляет синтаксис и соотнесение неясными.
  revised_text: 'Такова полная природа порождения, совершившегося благодаря тому, что [Христос] принёс, когда он воссиял над ними [светом], который явил: […] подобно его […] которое будет […] подобно его […], причём единственное различие, [которое] существует среди тех, кто был…


    (утрачено 5 строк)


    […] те, кто существует […] через […], как [я] уже говорил, тогда как вещественные будут оставлены до конца, чтобы быть уничтоженными, потому что они не назовут своих [имён], если ещё раз возвратятся к тому, чего [не будет]. Как они были […] их не было […], однако они были полезны [в то] время, когда обитали среди них, хотя в начале они не были […]. Затем […] поступать иначе посредством власти, которой они обладали при подготовке, [чтобы] противостоять им.


    Хотя я постоянно пользуюсь этими словами, [я не постиг] мыслей. Некоторые старейшины […] ему величие.


