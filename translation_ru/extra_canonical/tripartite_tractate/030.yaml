translation:
  language: ru
  text: 'Такова полная природа порождения, совершившегося благодаря тому, что перенёс [Христос], когда воссиял над ними [светом], который явил: […] подобно его […] которое будет […] подобно его […], причём единственное различие, [которое] существует среди тех, кто был…


    (утрачено 5 строк)


    […] те, кто существует […] через […], как [я] уже говорил, тогда как вещественные будут оставлены до конца, чтобы быть уничтоженными, потому что они не дадут своих [имён], если ещё раз возвратятся к тому, чего [не будет]. Как они были […] их не было […], однако они приносили пользу [в то] время, когда обитали среди них, хотя в начале они не были […]. Затем […] поступать иначе посредством власти, которой они обладали при приготовлении, [чтобы] противостоять им.


    Хотя я постоянно пользуюсь этими словами, [я не постиг] мыслей. Некоторые старейшины […] ему величие.


    (утрачено 5 или 6 строк)


    […] всякий […] ангел […] слова [и] звук трубы, возвещающий великое и полное восстановление от сияющего востока, в брачном [чертоге], который есть любовь Бога [Отца], согласно силе, которая […] величия […], сладость […] его, ибо Он открывает Себя величиям […] Свою благость […] хвалу, царство и [славу] через [Иисуса Христа], Господа, Спасителя, Искупителя всех, кого объемлет исполненный любящей милости, через [Его] Святого Духа, отныне, во все поколения, во веки веков. Аминь.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: begetting
  choice: порождение
  rationale: Сохраняет отвлечённо-онтологический оттенок термина и не сужает его до физического рождения.
- source_word: material ones
  choice: вещественные
  rationale: Передаёт категориальное обозначение группы, не добавляя конфессионально обусловленного толкования.
- source_word: complete restoration
  choice: полное восстановление
  rationale: Нейтрально передаёт идею возвращения к целостности, не подменяя её более узким богословским термином.
- source_word: bridal chamber
  choice: брачный чертог
  rationale: Сохраняет устойчивый образ древнего текста и его символическую насыщенность.
- source_word: Redeemer
  choice: Искупитель
  rationale: Естественный и традиционно понятный русский эквивалент, отличный от «Спасителя» в той же титулатуре.
- source_word: elders
  choice: старейшины
  rationale: Сохраняет возможное значение авторитетных старших лиц, не конкретизируя их церковную должность как «пресвитеров».
theological_decisions:
- issue: Кто назван «исполненным любящей милости» в заключительной доксологии
  choice: Сохранена грамматическая неопределённость формулой «кого объемлет исполненный любящей милости»
  alternative: Отнести определение прямо к Отцу, Христу или Святому Духу
  rationale: Повреждённый и синтаксически неясный свидетель не позволяет надёжно установить референт; перевод не должен искусственно разрешать богословскую неоднозначность.
- issue: Статус «вещественных» и их уничтожение
  choice: Передано буквально как судьба обозначенной в тексте категории
  alternative: Истолковать как уничтожение материи, тел или определённого класса людей
  rationale: Контекст фрагментарен; конкретизация внесла бы в текст частное доктринальное прочтение.
- issue: «Великое и полное восстановление»
  choice: Сохранена универсально звучащая, но не разъяснённая формула
  alternative: Передать как всеобщее спасение или апокатастасис
  rationale: Такие варианты богословски конкретнее доступного свидетельства и преждевременно снимают смысловое напряжение.
translation_notes:
  register: 'Современный литературный русский с достоинством позднеантичного богословского трактата. Квадратные скобки и многоточия сохраняют редакторские восстановления и лакуны; уведомления об утраченных строках переведены. Посторонние элементы веб-страницы исключены. Проект предварительный: предоставлен английский публично-доступный свидетель, а непосредственная сверка с коптским текстом ещё не выполнена.'
