translation:
  language: ru
  text: 'Хотя об Избрании можно было бы сказать ещё многое [a] и сказать об этом было бы уместно, всё же нам следует больше <сказать> о принадлежащих к Призванию, которых называют стоящими справа, поскольку забыть о них было бы неправильно. Прежде мы говорили о них подробно, словно этого было достаточно. Почему же тогда мы говорили о них лишь отчасти?


    Я сказал, что все происшедшие от Слова — будь то от суда над злыми, или от ярости, которая борется с ними, или от обращения прочь от них, то есть возвращения к Возвышенным, или от молитвы и памяти о предсуществующих, или от надежды и веры в то, что их спасение может быть [обретено] добрыми делами, — все они были признаны достойными, потому что происходят от добрых устремлений, а причиной их рождения стала мысль от Того, Кто Есть.


    Я также сказал, что, прежде чем Слово по своей воле незримо соединилось с ними, Возвышенный даровал им упомянутую ранее мысль, поскольку они [вняли] ей [b], — мысль, ставшую причиной их существования. Когда <они> были спасены, они не превозносились, будто до них ничего не существовало. Напротив, они исповедали, что их существование имеет начало, и что они желают познать того, кто существовал прежде них.


    Я также сказал, что при откровении света, явившегося подобно молнии, они пали ниц и засвидетельствовали, что он явился ради их спасения.


    Я сказал, что благо получат не только происшедшие от Слова: даже те, кого они породили согласно добрым устремлениям, насладятся покоем благодаря богатству дара. Даже порождённые желанием властвовать, в которых есть семя властолюбия, получат награду за добрые дела, если они содействовали имеющим доброе устремление и если сознательно пожелают оставить пустую любовь к увядающей славе, чтобы соблюсти заповедь Господа [c] славы. Тогда вместо преходящей и ничтожной почести они унаследуют вечное Царство.


    Нам пришлось вернуться к сказанному прежде. Теперь же, чтобы изложить связное рассуждение, мы должны сопоставить причины, следствия и <свидетельства> относительно того, могут ли стоящие справа — как несмешанные, так и смешанные — получить дар спасения и покоя. Поэтому в убедительном рассуждении мы должны показать это, исходя из образа их веры.


    Если мы исповедуем Царство во Христе, <то> устраняем всё многообразие форм, неравенство и переменчивость. Ибо в конце вновь наступит единство, каким единством было начало: там нет ни мужского, ни женского, ни раба, ни свободного, ни обрезания, ни необрезания, ни ангела, ни человека, но Христос — всё во всём. Как может оказаться существующим тот, кто не существовал в начале? И <какова> природа того, кто не был рабом, если он займёт место вместе со [d] свободным? Они даже удостоятся непосредственного видения, и им не придётся верить, что всё обстоит именно так, лишь на основании краткого слова, услышанного от голоса.


    Ведь восстановление того, что некогда было, есть единство. И даже если некоторые возвышены согласно замыслу спасения, поставлены над причинами существующего, приводят в действие множество природных сил и наслаждаются ими — будь то ангелы или люди, — они достигнут Царства, утверждения и спасения.


    А причины таковы. Явившиеся во плоти непоколебимо уверовали, что он — Сын неведомого Бога, от века неизреченного, которого никто не мог увидеть. Они отвергли своих богов, перед которыми прежде падали ниц, и господ на небе и на земле. Ещё прежде, чем <он> был вознесён, когда он был ещё младенцем, они свидетельствовали, что он уже проповедует. И когда он [как] мёртвый лежал в гробнице, ангелы верили, что он жив, [даже получая] жизнь [e] от умершего.


    Множество священнодействий и чудес, которые они совершали в [языческих] храмах, теперь сменилось служением другому — Христу. Исповедание Христа дало им силу совершить эту перемену, побуждая их поспешно приблизиться к нему. Прежнюю, языческую подготовку они получили лишь для того, чтобы впоследствии отвергнуть её ради того, кому в этом нижнем месте — мире — не <воздавали почести>. Но, отвергнув языческих богов, [они обрели] Христа. Они поняли, что он пришёл из [возвышенного] места, [из которого] и они пришли вместе с ним, — места божественного владычества. Имена тех, кому они поклонялись, о ком заботились и кому служили, были даны им лишь взаймы; теперь они перенесли эти имена на того, к кому те по праву относятся.


    Однако лишь после его вознесения они узнали, что он — их Господь, над которым нет господина. Они передали ему свои царства, поднялись [со своих] престолов, оставив их, и сложили свои венцы. Но он открылся им по причинам, о которых мы уже говорили: ради их исцеления и их [обращения к] доброй мысли о [...] [f] спутнике и ангелах [...], а также ради множества добрых дел, совершённых ими для неё. Поэтому им были поручены служения на благо избранных: возносить их беззаконие на небо для вечного суда с неоспоримым и безошибочным [приговором]. Они продолжают действовать ради них, пока все не вступят в земную жизнь и не уйдут из неё, а их тела [останутся] на земле. Они служат всем их [...], делая [себя] причастными их страданиям, гонениям и опасностям, которые постигали святых сильнее, чем других.


    Что же до слуг злого <начала>: поскольку зло достойно уничтожения <…>, — твёрдо благодаря [общей жизни], которая превыше всех миров и которая есть их добрая мысль и братство.[g]


    И Церковь вспомнит их как истинных друзей и верных служителей, когда получит искупление от того, кто [даёт им] награду — радость, царящую в брачном [покое], и [..., что] обитает в её доме [...], что пребывает в мысли [...], и то, чем она обязана [...] [h] Христу, который обитает с нею, [а также] исполненное ожидания упование на Отца [всей] Полноты, потому что она даст им ангелов для наставления и служения.


