  revised_text: 'Хотя об Избрании можно было бы сказать ещё многое [a] и сказать об этом было бы уместно, всё же нам следует больше <сказать> о принадлежащих к Призванию, которых называют стоящими справа, поскольку забыть о них было бы неправильно. Прежде мы говорили о них подробно, словно этого было достаточно. Почему же тогда мы говорили о них лишь отчасти?


