- source_word: ⲛⲉⲛⲧⲁⲩⲧⲛ̄ⲛⲟⲟⲩ
  choice: те, кого послали
  rationale: Форма связана с глаголом ⲧⲛ̄ⲛⲟⲟⲩ «посылать», а не с глаголом «видеть»; безличное множественное число естественно передаётся русской пассивной конструкцией.
- source_word: ⲡⲓⲛⲁ
  choice: знак
  rationale: По предложенному чтению слово обозначает «знак»; «метка» остаётся возможной альтернативой.
- source_word: ⲧⲁⲧⲧⲱⲱⲛ ⲉⲃⲟⲗ
  choice: указывающий
  rationale: Перевод следует наиболее вероятному в предоставленном разборе значению «указывать, выделять», не подменяя неуверенное чтение более гладкой реконструкцией.
- source_word: ϩⲛ ⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: среди мёртвых
  rationale: Предлог ϩⲛ перед множественным обозначением лиц естественно передаётся как «среди».
- source_word: ⲭⲉ
  choice: но
  rationale: Передаёт возможный противительный переход к следующему самоопределению; значение частицы в данном повреждённом контексте не вполне надёжно.
- source_word: ⲁⲛⲟⲕ ⲡⲉⲧ
  choice: я — тот, кто…
  rationale: Сохраняет эмфатическую формулу и открытый относительный оборот, обрывающийся на границе фрагмента.
theological_decisions:
- issue: Идентичность «посланных» и характер «знака»
  choice: Не уточнять, кто послал названных лиц и кого либо что выделяет знак
  alternative: Истолковать их как определённый класс небесных посланников, а знак — как знак воскресения или разделения
