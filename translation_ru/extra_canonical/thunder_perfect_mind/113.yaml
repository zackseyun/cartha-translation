    reason: lexical_alternative
  - marker: b
    text: Чтение этой строки по предоставленному OCR ненадёжно. «Знак» можно также передать как «метка», а выражение «указывающий» — как «выводящий», «выделяющий» или «разделяющий». Низкая уверенность выравнивания не позволяет безоговорочно отождествить строку с консультационным текстом о «знаке буквы».
    reason: textual_variant
