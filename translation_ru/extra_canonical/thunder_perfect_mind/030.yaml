lexical_decisions:
- source_word: 'ⲙⲡⲣⲕⲁⲁⲧ (в OCR: ⲉⲧⲛⲕⲁⲁⲧ)'
  choice: Не оставляйте меня
  rationale: Отрицательный императив с глаголом «оставлять»; обращение во множественном числе соответствует форме исходного текста. OCR в начале отрывка повреждён, поэтому чтение восстановлено по контексту и засвидетельствованному тексту памятника.
- source_word: 'ⲉⲓⲛⲏϫ ⲉⲃⲟⲗ (в OCR: ⲉⲉⲓⲛⲏⲩ ⲉⲃⲟⲗ)'
  choice: выброшенной прочь
  rationale: Сочетание передаёт состояние отверженности или выброшенности наружу. Женский род согласован с женским голосом произведения; «прочь» сохраняет направительное значение ⲉⲃⲟⲗ.
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: вы найдёте меня
  rationale: Прямое и естественное соответствие конструкции будущего времени с глаголом «находить».
- source_word: ϩⲛ ⲙⲙⲛⲧⲣⲙⲁⲟ
  choice: в богатстве
  rationale: Абстрактное существительное обозначает богатство или состоятельность. Буквальное «в богатстве» сохраняет намеренно парадоксальное противопоставление отверженности и богатства, не превращая выражение без достаточных оснований в «среди богатых».
theological_decisions:
- issue: Связь отверженности говорящей с её обнаружением «в богатстве»
  choice: Сохранить парадокс без поясняющего истолкования
  alternative: Передать как «вы найдёте меня среди богатых» или объяснить богатство духовно
  rationale: Исходный текст допускает смысловую напряжённость и не уточняет, материально ли богатство, духовно или метафорично; перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с лаконичным, торжественным звучанием. Форма «выброшенной прочь» намеренно сохраняет резкость образа и женский голос говорящей; синтаксический парадокс оригинала не сглажен.
