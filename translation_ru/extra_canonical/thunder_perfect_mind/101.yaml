revisions:
- from: '**17.** Освободите себя.[a] А если вы освободитесь от него,[b] кто сможет схватить вас? Ведь то, что внутри вас, — то же, что и снаружи, и тот, кто создаёт снаружи, — тот же, кто создаёт внутри.'
  to: '**17.** Освободитесь.[a] А если вы освободитесь от него,[b] кто сможет схватить вас? Ведь ваше внутреннее — ваше внешнее, и тот, кто формирует внешнее, формирует и внутреннее.'
  rationale: Правка устраняет русскую синтаксическую неоднозначность в финальном противопоставлении «внешнее — внутреннее» и делает начальный императив естественным. Неясный референт местоимения сохранён в тексте и отмечен сноской.
