base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/101.yaml
  text: Release yourselves.[a] Or if you release yourselves from him, who will be able to seize you? For your inside is your outside,[b] and the one who fashions the outside is the one who fashions the inside.
translation:
  language: ru
  text: '**17.** Освободитесь.[a] А если вы освободитесь от него,[b] кто сможет схватить вас? Ведь ваше внутреннее — ваше внешнее, и тот, кто формирует внешнее, формирует и внутреннее.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Отпустите себя», «дайте себе уйти».'
    reason: lexical_alternative
  - marker: b
    text: 'Местоимение можно понять и безлично: «от этого» или «из этого»; его референт в данном отрывке не назван.'
    reason: referential_ambiguity
lexical_decisions:
- source_word: ⲕⲁ ⲧⲏⲛⲉ ⲉⲃⲟⲗ
  choice: освободите себя
  rationale: Конструкция ⲕⲁ … ⲉⲃⲟⲗ означает «отпустить, освободить»; возвратное местоимение передано как «себя». Это соответствует непосредственному синтаксису отрывка и не смешивает ⲕⲁ с греческим καλέω.
- source_word: ⲁⲙⲁϩⲧⲉ
  choice: схватить
  rationale: Глагол выражает овладение, захват или удержание. «Схватить» естественно продолжает образ освобождения и сохраняет его конкретность.
- source_word: ⲡⲉⲧⲛⲥⲁϩⲟⲩⲛ / ⲡⲉⲧⲛⲥⲁⲃⲃⲟⲗ
  choice: то, что внутри вас / то же, что и снаружи
  rationale: ⲥⲁϩⲟⲩⲛ и ⲥⲁⲃⲃⲟⲗ здесь являются пространственными обозначениями внутреннего и внешнего, а не глаголом «понимать». Русская парная конструкция сохраняет парадокс исходного текста.
- source_word: ⲣⲡⲗⲁⲥⲥⲉ
  choice: создаёт
  rationale: Греческое заимствование πλάσσειν означает «лепить, формировать, создавать». Нейтральное «создаёт» звучит естественно и не добавляет отсутствующего в отрывке специального богословского смысла.
theological_decisions:
- issue: Тождество внутреннего и внешнего
  choice: «то, что внутри вас, — то же, что и снаружи»
  alternative: «ваша внутренняя сторона есть ваша внешняя сторона»
  rationale: Выбрана понятная современная формулировка, которая сохраняет прямое отождествление и не объясняет его метафизически.
- issue: Лицо или предмет, от которого освобождаются
  choice: «от него» с примечанием
  alternative: «из него» / «от этого»
  rationale: Коптская местоименная форма допускает отсылку как к лицу, так и к предмету либо состоянию; перевод не должен догматически устанавливать референт.
translation_notes:
  register: Современный литературный русский с кратким, афористичным синтаксисом. Повтор «снаружи — внутри» и параллель «тот же, кто…» сохраняют поэтическую симметрию источника. Нумерация блока оставлена по заданному reference.
