base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/118.yaml
  text: 'And there are ignorances,

    and passions that are about to come,

    and pleasures toward you[a],

    and a power that you will take[b],

    a clear‑mindedness[c]—

    they will run up into their emptiness[d].'
translation:
  language: ru
  text: '**2.** И разные виды неведения,

    и грядущие страсти,

    и удовольствия — на время[a] —

    овладеют ими[b], пока они не протрезвеют[c]

    и не побегут вверх, в свою пустоту[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Коптское выражение, разорванное в OCR переносом строки (ⲡⲣⲟⲥ ⲡⲉ / ⲟⲩⲉⲓϣ), здесь прочитано как «на время». При ином членении возможно: «к вам, и сила…».'
    reason: textual_and_syntactic_alternative
  - marker: b
    text: «Овладеют ими» — вероятное прочтение ⲉⲧⲛⲁϩⲧⲉ ⲙⲙⲟⲟⲩ. Значение глагола может быть также передано как «схватят», а субъект и границы относительного оборота не вполне ясны.
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «пока они не станут трезвыми (ясными умом)». Форма глагольная; существительное «трезвение» было бы менее точным.'
    reason: lexical_and_grammatical_note
  - marker: d
    text: «Пустоту» — вероятное значение ⲕⲏⲛⲏ; возможно также понимание «бедность, нищета».
    reason: lexical_alternative
lexical_decisions:
- source_word: ϩⲉⲛⲙⲛⲧⲁⲧⲁⲙⲁϩⲧⲉ
  choice: разные виды неведения
  rationale: Префикс ⲙⲛⲧ- образует отвлечённое существительное со значением «незнание, неведение», а ϩⲉⲛ указывает на неопределённое множественное число. Буквальное «неведения» по-русски неестественно, поэтому множественность передана как «разные виды».
- source_word: ϩⲉⲛⲡⲁⲑⲟⲥ ⲉⲧϣⲁⲉⲓⲏⲧ
  choice: грядущие страсти
  rationale: Греческое заимствование πάθος в этическом перечне естественно означает «страсти», а относительная конструкция с будущим значением передана причастием «грядущие».
- source_word: ϩⲉⲛⲏⲇⲟⲛⲏ
  choice: удовольствия
  rationale: Греческое ἡδονή обычно означает чувственные или эмоциональные удовольствия; нейтральное «удовольствия» сохраняет этическую напряжённость без усиления смысла.
- source_word: ⲡⲣⲟⲥ ⲡⲉⲟⲩⲉⲓϣ
  choice: на время
  rationale: Последовательность, разделённая переносом строки как ⲡⲣⲟⲥ ⲡⲉ / ⲟⲩⲉⲓϣ, вероятнее читается слитно по синтаксису как «на время», а не как предлог без объекта плюс отдельное «сила».
- source_word: ⲉⲧⲛⲁϩⲧⲉ ⲙⲙⲟⲟⲩ
  choice: овладеют ими
  rationale: Будущая относительная форма и объектное местоимение множественного числа допускают смысл «которые овладеют ими». «Овладеют» лучше передаёт воздействие перечисленных страстей и удовольствий, чем менее определённое «возьмут».
- source_word: ϣⲁⲛⲧⲟⲩⲛⲏⲫⲉ
  choice: пока они не протрезвеют
  rationale: Форма является глагольной и восходит к греческому νήφω — «быть трезвым, прийти в ясное состояние ума». Русское «протрезвеют» сохраняет одновременно прямой и переносный оттенки.
- source_word: ⲛⲥⲉ ⲡⲱⲧ ⲉϩⲣⲁⲓ
  choice: и не побегут вверх
  rationale: ⲡⲱⲧ может значить «бежать» или «убегать»; нейтральное «побегут» не решает без достаточных оснований, идёт ли речь о движении или бегстве. ⲉϩⲣⲁⲓ передано явно как «вверх».
- source_word: ⲉⲡⲟⲩⲕⲏⲛⲏ
  choice: в свою пустоту
  rationale: ⲕⲏⲛⲏ, вероятно связанное с греческим κενός/κενή, естественно передаётся словом «пустота»; притяжательная форма ⲡⲟⲩ- — как «свою» при совпадающем субъекте.
theological_decisions:
- issue: Синтаксическое членение ⲡⲣⲟⲥ ⲡⲉ / ⲟⲩⲉⲓϣ
  choice: Читать как единое выражение «на время»
  alternative: «к вам, и сила…»
  rationale: Перенос строки в OCR, вероятно, искусственно разорвал ⲡⲉⲟⲩⲉⲓϣ «время». Такое чтение даёт связную коптскую конструкцию и не требует восполнять отсутствующий объект после ⲡⲣⲟⲥ.
- issue: Субъект действия «овладеют»
  choice: Перечисленные неведения, страсти и удовольствия
  alternative: 'Не названное в отрывке «вы» как субъект: «которую вы возьмёте»'
  rationale: Форма ⲙⲙⲟⲟⲩ естественно читается как объект третьего лица множественного числа «ими», а не как «это»; вместе с последующим «пока они не протрезвеют» это создаёт последовательную референцию, хотя повреждённость и низкая надёжность выравнивания не позволяют считать разбор бесспорным.
translation_notes:
  register: Современный литературный русский с ритмикой возвышенной речи. Сохранены перечисление, образ движения вверх и неоднозначность слова «пустота». Из-за низкой надёжности выравнивания OCR перевод опирается прежде всего на внутренний синтаксис коптского отрывка; начальное одиночное ⲟⲩ сочтено концом слова из предыдущей строки и отдельно не переводится.
