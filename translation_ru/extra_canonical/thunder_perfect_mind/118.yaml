review_pass:
  verdict: revise
  source_fidelity: 'Черновик существенно расходится с представленным коптским отрывком: он сливает ⲡⲣⲟⲥ ⲡⲉ и ⲟⲩⲉⲓϣ в не подтверждённое источником «на время», меняет ⲟⲩⲉⲓϣ («сила») на часть этой фразы и подменяет ⲙⲙⲟ («его/её, это») формой ⲙⲙⲟⲟⲩ («их»). Глагольную форму ⲡⲱⲧ следует сохранить, а ⲉⲧⲛⲁϩⲧⲉ — не превращать без основания в «овладеют ими».'
  naturalness: Предлагаемая редакция сохраняет ритм перечня и современный литературный русский. «Состояния неведения» передаёт множественность отвлечённого коптского существительного более естественно, чем изолированное «неведения».
  terminology: ⲡⲁⲑⲟⲥ передано как «страсти», ⲏⲇⲟⲛⲏ — как «удовольствия», ⲛⲏⲫⲉ — глагольно («протрезвеют»), без доктринального усиления. Неоднозначности OCR и синтаксиса отмечены в сносках, а не разрешены путём изменения текста.
  issues:
  - severity: high
    issue: Неподтверждённое чтение «на время»
    rationale: В источнике после ⲡⲣⲟⲥ ⲡⲉ следует отдельное ⲟⲩⲉⲓϣ («сила»). Черновик устраняет это слово как самостоятельный член перечня, хотя английский аудиторский след также сохраняет «a power».
  - severity: high
    issue: Подмена грамматических лиц и ролей в «овладеют ими»
    rationale: Источник содержит ⲉⲧⲛⲁϩⲧⲉ ⲙⲙⲟ, для которого аудит фиксирует вероятное «которую вы примете/возьмёте это». Черновиковое «овладеют ими» опирается на отсутствующую форму множественного объекта и меняет субъект.
  - severity: medium
    issue: Неверная функция ϣⲁⲛⲧⲟⲩⲛⲏⲫⲉ
    rationale: Это глагольная форма со значением «пока/когда они не протрезвеют, не станут ясными умом», а не основание для причинно-временной конструкции, связывающей перечисленные явления как субъект «овладеют».
  - severity: low
    issue: «Разные виды» добавляет классификацию
    rationale: Неопределённое множественное число ϩⲉⲛ передаёт множественность, но не требует добавлять «разные виды».
  revised_text: '**2.** И состояния неведения,


