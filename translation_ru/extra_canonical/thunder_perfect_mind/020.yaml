base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/020.yaml
  text: Why[a], you who hate me, do you love me, and hate those who love me? You who deny me, confess me[b], and you who confess me, deny me[e][d][c]. You who say—
translation:
  language: ru
  text: 'Почему[a] вы, ненавидящие меня, любите меня и ненавидите тех, кто любит меня?


    Те, кто отрекается от меня, исповедуют меня[b], а те, кто исповедует меня, отрекаются от меня[c]. Те, кто говорит…[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Перед вопросом в рукописном отрывке стоит неясное ⲡⲁⲣⲁⲛ, вероятно перешедшее из предыдущей строки; оно здесь не переведено. Сочетание ⲉⲧⲃⲉ ⲟⲩ означает «почему?».
    reason: textual_alignment
  - marker: b
    text: «Исповедуют» передаёт ϩⲟⲙⲟⲗⲟⲅⲉⲓ (греч. ὁμολογέω); возможны также «признают» или «провозглашают».
    reason: lexical_alternative
  - marker: c
    text: «Отрекаются» передаёт ⲁⲣⲛⲁ; в зависимости от регистра возможны также «отвергают» или «отрицают».
    reason: lexical_alternative
  - marker: d
    text: Фраза обрывается на словах «те, кто говорит» и продолжается в следующем отрывке.
    reason: source_fragment
lexical_decisions:
- source_word: ⲉⲧⲃⲉ ⲟⲩ
  choice: почему
  rationale: Сочетание ⲉⲧⲃⲉ ⲟⲩ образует вопрос «почему?», а не вводит тему «о тех, кто…».
- source_word: ⲙⲟⲥⲧⲉ
  choice: ненавидеть
  rationale: Прямое и стилистически нейтральное соответствие, сохраняющее резкий контраст с «любить».
- source_word: ⲙⲉ
  choice: любить
  rationale: В данном месте ⲙⲉ означает «любить»; это подтверждается параллелизмом с ⲙⲟⲥⲧⲉ «ненавидеть».
- source_word: ⲁⲣⲛⲁ
  choice: отрекаться / отречься
  rationale: Передаёт личное отречение от говорящей и естественно противопоставляется исповеданию; возможны также «отрицать» и «отвергать».
- source_word: ϩⲟⲙⲟⲗⲟⲅⲉⲓ
  choice: исповедовать
  rationale: Сохраняет сильный смысл открытого признания или провозглашения, присущий греческому заимствованию ὁμολογέω; «признавать» было бы более нейтрально.
- source_word: ⲉⲣϩⲟⲙⲟⲗⲟⲅⲉⲓ / ⲉⲣⲁⲣⲛⲁ
  choice: исповедуйте / отрекитесь
  rationale: Формы с ⲉⲣ- здесь поняты как повелительные; поэтому параллельные относительные обороты переданы как обращения, за которыми следуют повеления.
- source_word: ⲛⲉⲧϫⲉ
  choice: вы, говорящие
  rationale: Относительная конструкция продолжает ряд обращений; незавершённость исходного отрывка сохранена многоточием.
theological_decisions:
- issue: Соотношение отречения и исповедания
  choice: 'Сохранены парадоксальные повеления: отрекающимся велено исповедовать, а исповедующим — отречься.'
  alternative: 'Понять формы как повествовательные: «отрекающиеся исповедуют, а исповедующие отрекаются».'
  rationale: Повелительное значение ⲉⲣ- лучше объясняет грамматику и обращение ⲛⲉⲧ-; парадокс не сглаживается богословским толкованием.
translation_notes:
  register: Современный литературный русский язык с торжественным риторическим ритмом. Повторения «меня», «любите», «ненавидите», «исповедующие» и «отрекающиеся» намеренно сохранены ради параллелизма исходного текста; архаичные местоимения и искусственно церковнославянская лексика не используются.
