  rationale: Глагол со значением «слышать, слушать» ожидается в первом параллельном повелении. «Слушайте» естественно передаёт направленное внимание к говорящей, но сам глагол в данном фрагменте OCR не сохранился.
- source_word: ⲭⲣⲟⲉⲓ
  choice: в кротости
  rationale: «Кротость» — ясное современное обозначение мягкости и незлобия; форма с предлогом сохраняет параллелизм и намеренно необычное противопоставление следующей строке.
- source_word: ⲕⲁⲁⲥ
  choice: учитесь
  rationale: Глагол допускает значения «учиться» и «быть наученным». Возвратная форма естественна в русском повелении и соответствует параллельной структуре.
- source_word: ⲉⲣⲟⲓ
  choice: у меня
  rationale: При глаголе «учиться» коптское предложное сочетание естественно передаётся по-русски как «учиться у меня».
- source_word: ⲧⲉⲣⲟⲟⲩ
  choice: в суровости
  rationale: «Суровость» сохраняет смысл жёсткости и резкую антитезу с «кротостью», не сводя её к физической шероховатости.
