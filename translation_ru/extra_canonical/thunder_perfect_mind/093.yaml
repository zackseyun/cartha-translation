base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/093.yaml
  text: 'The calling of my name—it is I.

    I am the crying out, and I am the hearing.

    You hear me in your calling of me; you call me with a sound you …'
translation:
  language: ru
  text: 'Зов моего имени — это я.


    Я — крик, и я — слышание.


    Вы слышите меня, когда зовёте меня; вы зовёте меня звуком, который произносите…[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Конец строки повреждён и переходит на следующую страницу: в OCR читается «ϩⲛ ⲟⲩⲡ…», затем «ⲉⲧⲉⲧⲛⲧⲁⲩⲟ» («который вы произносите»). Существительное перед разрывом восстановить с уверенностью нельзя; возможны значения «звук», «голос» или «зов».'
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲡⲱϣ(ⲥ) ⲙ̄ⲡⲁⲣⲁⲛ
  choice: зов моего имени
  rationale: В данном чтении слово связано с ⲱϣ — «кричать, звать, возглашать», а не просто обозначает звук. «Зов» сохраняет мотив призывания и поэтическую краткость.
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: это я
  rationale: Эмфатическое копульное утверждение передано естественной русской формулой, сохраняющей резкий ритм исходного текста.
- source_word: ⲁϣⲕⲁⲕ ⲉⲃⲟⲗ
  choice: крик
  rationale: Форма восходит к глаголу «кричать, восклицать»; субстантивированное «крик» отражает номинальный и парадоксальный характер самоопределения.
- source_word: ⲥⲱⲧⲙ̄
  choice: слышание
  rationale: 'Передано как название действия, а не как «тот, кого слышат»: это согласуется с исправленным чтением субстантивированного инфинитива и сохраняет параллель «крик — слышание».'
- source_word: ⲧⲉⲧⲛⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: вы слышите меня
  rationale: Прямое обращение во втором лице множественного числа передано без добавления оттенка послушания, которого глагол здесь не требует.
- source_word: ⲙⲟⲩⲧⲉ ⲉⲣⲟⲓ
  choice: зовёте меня
  rationale: Глагол может значить «звать, называть»; «зовёте» поддерживает словесную перекличку с первой строкой.
- source_word: ϩⲛ ⲟⲩⲡ… ⲉⲧⲉⲧⲛⲧⲁⲩⲟ
  choice: звуком, который произносите…
  rationale: Фрагментарное чтение допускает существительное со значением звука, голоса или зова; нейтральное «звук» оставлено с многоточием и текстологической сноской.
theological_decisions:
- issue: Отождествление говорящей одновременно с криком и слышанием
  choice: сохранить два прямых именных самоопределения
  alternative: перефразировать как «я кричу и я слышу» либо «меня слышат»
  rationale: Исходная парадоксальность является смысловой чертой поэмы; перевод не должен устранять напряжение, распределяя действия между субъектом и объектом.
translation_notes:
  register: Современный литературный русский с кратким, торжественным и парадоксальным ритмом. Повтор «я» и лексическая цепочка «зов — крик — зовёте» сохранены; искусственно архаическая и конфессионально окрашенная лексика не вводилась.
