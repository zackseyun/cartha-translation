translation:
  language: ru
  text: 'Познайте меня — пусть познают меня.[a]


    Ибо я — знание и незнание.


    Я — стыд и смелость говорить открыто.[b]


    Я бесстыдна; я застенчива.[c]


    Я — сила, и…[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начальную строку из-за слитного написания и возможной сегментации также понимают как: «Пусть мудрые будут мудры» или «Мудрые, будьте мудры».'
    reason: textual_and_grammatical_ambiguity
  - marker: b
    text: Коптское ⲡⲁⲣⲣⲏⲥⲓⲁ, заимствованное из греческого, может означать свободу и откровенность речи, прямоту или уверенную публичную смелость.
    reason: lexical_alternative
  - marker: c
    text: Слово ϫⲓⲡⲏⲧ отличается от слова «стыд» в предыдущей строке и может передавать стыдливость, застенчивость или скромность.
    reason: lexical_alternative
  - marker: d
    text: Последнее «и» относится к продолжению фразы в следующем фрагменте.
    reason: segment_boundary
lexical_decisions:
- source_word: ⲥⲟⲩⲱⲛⲧ ⲙⲁⲣⲟⲩⲥⲟⲩⲱⲛⲧ
  choice: Познайте меня — пусть познают меня
  rationale: 'В данном контексте ⲥⲟⲩⲱⲛ с объектным суффиксом -ⲧ естественно понимать как «познать меня», а ⲙⲁⲣⲟⲩ передаёт побуждение третьего лица: «пусть они познают меня». OCR-слитность допускает иную сегментацию, поэтому неоднозначность отмечена.'
- source_word: ⲡⲥⲟⲟⲩⲛ / ⲧⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ
  choice: знание / незнание
  rationale: Сохраняется прямой парадокс двух абстрактных существительных; «незнание» стилистически точнее воспроизводит морфологическую антитезу, чем более оценочное «невежество».
- source_word: ⲡϣⲓⲡⲉ
  choice: стыд
  rationale: Основное значение слова и естественная русская пара к последующему понятию открытой смелости.
- source_word: ⲧⲡⲁⲣⲣⲏⲥⲓⲁ
  choice: дерзновенная открытость
  rationale: Греческое заимствование παρρησία обозначает свободную, открытую и уверенную речь; сочетание передаёт и смелость, и речевую откровенность, не сводя слово к простой дерзости.
- source_word: ⲟⲩⲁⲧϣⲓⲡⲉ / ⲟⲩϫⲓⲡⲏⲧ
  choice: я бесстыдна / я стыжусь
  rationale: Сохраняются параллелизм и личная форма рефрена. Второй термин отличен от ϣⲓⲡⲉ и может указывать на застенчивость или стыдливость; русское «стыжусь» естественно удерживает противопоставление.
- source_word: ⲛⲁϣⲧⲉ
  choice: сила
  rationale: Здесь слово означает силу, крепость или твёрдость, а не страх. Выбрано наиболее естественное существительное в формуле самоотождествления.
- source_word: ⲁⲩⲱ
  choice: и…
  rationale: Союз завершает данный фрагмент и показывает, что высказывание продолжается за его пределами.
theological_decisions:
- issue: Парадоксальные самоотождествления говорящей
  choice: Сохранить антиномии буквально, без богословского согласования
  alternative: Истолковать отрицательные понятия метафорически или снять противоречия
  rationale: Источник намеренно соединяет противоположности; перевод не должен заранее определять личность говорящей или навязывать конфессиональное объяснение.
- issue: Грамматический род говорящей
  choice: Использовать женские формы там, где русский язык требует рода
  alternative: Перестроить строки так, чтобы полностью избегать рода
  rationale: Произведение традиционно представляет речь женского голоса, а русские формы «бесстыдна» естественно передают номинальные самоописания; при этом источник в данной строке не маркирует род столь же явно.
translation_notes:
  register: Современный литературный русский язык с достоинством и ритмической краткостью исходных формул. Повтор «Я —» и парадоксы сохранены; для женского голоса употреблены естественные русские формы. Многоточие обозначает незавершённость сегмента, а не лакуну.
