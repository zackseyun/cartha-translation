base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/005.yaml
  text: Be watchful,[1] and as for your hearing, do not be deaf to me in any place or in any other thought[2]; and do not be ignorant of me. For I am the first[a][2], and I am the last.
translation:
  language: ru
  text: '**5.** Бодрствуйте,[a] и пусть слух ваш не будет глух ко мне ни в каком месте и ни в какой иной мысли;[b] и не будьте в неведении обо мне. Ибо я — первая, и я — последняя.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Будьте настороже»; «Будьте внимательны».'
    reason: Лексема допускает оттенки бдительности, осторожности и сосредоточенного внимания.
  - marker: b
    text: Разбивка этой части по строкам и её синтаксическое присоединение не вполне надёжны; фразу можно теснее связать либо с предшествующим, либо с последующим увещанием.
    reason: Предоставленный коптский текст является выровненным OCR-фрагментом со средней уверенностью привязки строк.
lexical_decisions:
- source_word: ⲧⲱⲉⲓ
  choice: Бодрствуйте
  rationale: Повеление призывает к бдительности и вниманию; «бодрствуйте» сохраняет торжественный увещательный тон и остаётся понятным современному читателю.
- source_word: ⲡⲉⲧⲛⲥⲱⲧⲙ … ⲙⲡⲣⲣⲁⲧⲥⲱⲧⲙ
  choice: слухом своим не будьте глухи
  rationale: Передаёт «ваш слух» и отрицательное повеление с ⲣ-ⲁⲧ-ⲥⲱⲧⲙ — «не быть неслышащими/глухими», не превращая его в положительное «слушайте».
- source_word: ⲉⲣⲟⲉⲓ
  choice: ко мне
  rationale: При русском «быть глухим» адресат естественно выражается сочетанием «ко мне».
- source_word: ⲕⲁⲧⲁ ⲙⲁ
  choice: ни в каком месте
  rationale: Контекстуально передаёт засвидетельствованное обстоятельственное значение выражения — «в любом/каждом месте»; при отрицании естественно «ни в каком месте».
- source_word: ⲕⲁⲧⲁ ⲛⲕⲉⲟⲩⲙⲉⲩⲉ
  choice: ни в какой иной мысли
  rationale: Сохраняет необычную параллель «место — мысль» и семантику ⲙⲉⲩⲉ как мысли, не сводя её без достаточных оснований к мнению или пониманию.
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: не оставайтесь в неведении обо мне
  rationale: Идиоматично передаёт запрет «не будьте незнающими меня», сохраняя тему знания о говорящей и не ослабляя её до простого «не игнорируйте».
- source_word: ⲧϣⲟⲣⲡ
  choice: первая
  rationale: Форма с женским артиклем и женская предикативная конструкция указывают на женский род говорящей; сохранена буквальная первая часть пары.
- source_word: ⲑⲁⲉ
  choice: последняя
  rationale: Женская форма и параллелизм с «первая» требуют женского рода; значение «последняя» сохраняет формулу самоотождествления.
- source_word: ⲁⲛⲟⲕ … ⲁⲛⲟⲕ
  choice: я … и я
  rationale: Повтор местоимения воспроизведён ради исходного параллелизма и эмфатического ритма.
theological_decisions:
- issue: Род говорящего в формуле «первая и последняя»
  choice: я — первая, и я — последняя
  alternative: я — первый и последний
  rationale: Коптские формы грамматически женские. Мужской род мог бы привнести знакомую каноническую формулу ценой утраты явного рода исходного текста.
- issue: Необычная связь места и мысли
  choice: ни в каком месте и ни в какой иной мысли
  alternative: нигде и ни при каком ином понимании
  rationale: Выбран более формально близкий вариант, чтобы не устранять смысловое напряжение и не навязывать тексту определённую эпистемологическую трактовку.
translation_notes:
  register: Современный литературный русский с торжественным, но не архаизированным ритмом. Странное сочетание «место — мысль» сохранено намеренно. Женский род говорящей передан явно в соответствии с коптской грамматикой. Все примечания обозначены буквенными маркерами в основном тексте.
