  text: For I am the first and the last[a][b].
translation:
  language: ru
  text: '**1.** Ибо я — первая и последняя[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ср. Ис. 44:6; Откр. 22:13, где встречаются сходные формулы: «Я первый и Я последний».'
    reason: cross_reference
  - marker: b
    text: ⲑⲁⲉ можно также перевести как «конец». Здесь выбрано «последняя», чтобы сохранить параллелизм выражения.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲅⲁⲣ
  choice: ибо
  rationale: Причинная частица связывает самоутверждение с предшествующим наставлением; «ибо» сохраняет логическую связь и придаёт фразе естественное торжественное звучание.
- source_word: ⲁⲛⲟⲕ … ⲧⲉ
  choice: я —
  rationale: Местоимение вместе с женской связкой выражает отождествление; в русском настоящем времени нулевая связка и тире естественно передают формулу «я есть».
- source_word: ⲧϣⲟⲣⲡ
  choice: первая
  rationale: Слово означает «первая» или «начало»; форма «первая» сохраняет титульное употребление, параллелизм и женский род исходной конструкции.
- source_word: ⲁⲩⲱ
  choice: и
  rationale: Простой соединительный союз сохраняет уравновешенную структуру пары.
- source_word: ⲑⲁⲉ
  choice: последняя
  rationale: В паре с ⲧϣⲟⲣⲡ это чтение сохраняет симметричную формулу «первая и последняя», хотя возможно и значение «конец».
theological_decisions:
- issue: Род говорящей в формуле самоотождествления
  choice: 'женский род: «первая и последняя»'
  alternative: нейтрализованная формула «начало и конец»
  rationale: Копульная форма ⲧⲉ и артикли женского рода грамматически представляют говорящую как женщину; перевод не должен устранять эту особенность или преждевременно отождествлять голос с иной фигурой.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной ритмикой. «Ибо» передаёт причинную связь; строчная «я» не навязывает говорящей божественный статус сверх того, что выражено в самом отрывке.
