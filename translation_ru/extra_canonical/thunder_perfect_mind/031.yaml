lexical_decisions:
- source_word: ⲕⲁⲁⲧ
  choice: оставляете меня
  rationale: Форма восходит к ⲕⲱ «оставлять, покидать» с местоименным объектом 1-го лица; перевод «внимать» здесь морфологически не обоснован.
- source_word: ⲉⲉⲓⲛⲏⲩ ⲉⲃⲟⲗ
  choice: когда я выхожу
  rationale: Оборот прочитан как обстоятельственная форма 1-го лица единственного числа («когда/по мере того как я выхожу»), а не как повелительное множественного числа.
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: вы найдёте меня
  rationale: Будущая форма 2-го лица множественного числа с ϭⲓⲛⲉ передаёт достижение результата — «найдёте», а не действие поиска.
- source_word: ⲙⲙⲛⲧⲣⲙⲁⲟ
  choice: среди богатства
  rationale: Абстрактное существительное от ⲣⲙⲁⲟ здесь естественно обозначает богатство или состоятельность; предлог ϩⲛ передан как «среди».
- source_word: ⲟⲩⲇⲉ ⲙⲡⲣⲛⲁⲩ ⲉⲣⲟⲉⲓ
  choice: И не смотрите на меня
  rationale: ⲙⲡⲣ- — отрицательная повелительная конструкция, а ⲛⲁⲩ ⲉ- означает «смотреть на».
- source_word: ⲛⲉⲧⲧⲁ…
  choice: те, кто в почёте
  rationale: Окончание отрывка, вероятно, содержит начало перенесённого на следующую строку ⲛⲉⲧⲧⲁⲉⲓⲏⲩ — «те, кто почитаем/в почёте»; выбран естественный русский эквивалент.
