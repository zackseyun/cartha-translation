lexical_decisions:
- source_word: ⲉⲧⲃⲉ ⲟⲩ
  choice: почему
  rationale: В исправленном, соответствующем данному сегменту коптском тексте это обычное вопросительное сочетание «почему, по какой причине».
- source_word: ⲧⲉⲧⲛⲙⲉⲥⲧⲉ
  choice: вы ненавидите
  rationale: Форма второго лица множественного числа передаёт прямое обращение к группе слушателей.
- source_word: ⲧⲁϩⲟⲧⲉ
  choice: мой страх
  rationale: Буквально «мой страх»; сохраняется намеренная двусмысленность между испытываемым говорящей страхом и страхом, который она внушает.
- source_word: ⲧⲉⲧⲛⲥⲁϩⲟⲩ
  choice: вы проклинаете
  rationale: Прямой современный эквивалент коптского глагола в форме второго лица множественного числа.
- source_word: ⲙⲡⲁϣⲟⲩϣⲟⲩ
  choice: мою гордость
  rationale: Передаёт значение «гордость, хвастовство» без добавления нравственной оценки, которой сам парадоксический контекст прямо не разрешает.
theological_decisions:
- issue: Двусмысленность выражения «мой страх»
  choice: Сохранить буквальное «мой страх»
  alternative: «страх передо мной» или «страх, который я внушаю»
  rationale: Коптская притяжательная конструкция сама по себе не уточняет, является ли говорящая субъектом или объектом страха; уточнение неоправданно снимало бы напряжение текста.
- issue: Оценочная окраска «гордости»
  choice: «моя гордость»
  alternative: «моё хвастовство» или «моё величие»
  rationale: «Гордость» сохраняет возможную как положительную, так и отрицательную окраску и не навязывает конфессионального истолкования.
