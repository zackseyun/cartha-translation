base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/085.yaml
  text: 'Vision and self-control

    of the heart[a], existing within me—

    I am the hearing that is attainable to everyone[d][c][b],

    and the speech that cannot be grasped.'
translation:
  language: ru
  text: '**1.** Видение и самообладание

    сердца[a], пребывающие во мне[d], —

    я — слышание, доступное каждому[b],

    и речь, которую невозможно уловить[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начало иногда переводят как «светильник сердца», однако в представленном OCR-тексте читаются греческие заимствования ϩⲟⲣⲁⲥⲓⲥ («видение») и ⲧⲉⲅⲕⲣⲁⲧⲓⲁ («самообладание»).
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «доступное» (ⲉⲧϣⲏⲡ), может также означать «имеющееся для всех» или «приходящее ко всем»; речь может идти скорее о свободном доступе, чем о достижении собственными усилиями.
    reason: lexical_alternative
  - marker: c
    text: '«Невозможно уловить» можно также передать как «невозможно постичь» или «невозможно схватить»: выражение допускает как телесный, так и познавательный смысл.'
    reason: lexical_alternative
  - marker: d
    text: 'Иное членение: «сердца, которое во мне». Однако грамматический род коптской относительной формы указывает скорее на «видение и самообладание», а не на «сердце».'
    reason: previous_rendering
lexical_decisions:
- source_word: ϩⲟⲣⲁⲥⲓⲥ
  choice: видение
  rationale: Греческое заимствование ὅρασις означает «видение, зрение»; «видение» сохраняет здесь отвлечённый и внутренний оттенок восприятия.
- source_word: ⲧⲉⲅⲕⲣⲁⲧⲓⲁ
  choice: самообладание
  rationale: Греческое заимствование ἐγκράτεια передаёт владение собой, сдержанность; «самообладание» ясно и естественно в современном русском языке.
- source_word: ⲙⲫⲏⲧ
  choice: сердца
  rationale: Предлог ⲙ- прочитан как показатель родительного отношения; дальнейшее ⲛϩⲏⲧ выражает внутреннее пребывание.
- source_word: ⲉⲥϣⲟⲟⲡ ⲛϩⲏⲧ ⲁⲛⲟⲕ
  choice: пребывающие во мне
  rationale: Глагол ϣⲟⲟⲡ означает «быть, существовать, присутствовать». Относительная форма женского рода синтаксически относится к предшествующим понятиям, а не к слову «сердце»; русское множественное число естественно охватывает оба однородных существительных.
- source_word: ⲡⲥⲱⲧⲙ
  choice: слышание
  rationale: Субстантивированная форма глагола «слышать»; намеренно сохранено конкретное «слышание», образующее парадоксальную пару с «речью».
- source_word: ⲉⲧϣⲏⲡ
  choice: доступное
  rationale: Контекст допускает значения доступности, достижимости или того, что приходит к человеку. «Доступное» естественно выражает открытость для каждого, не превращая её в человеческое достижение.
- source_word: ⲛⲟⲩⲟⲛ ⲛⲓⲙ
  choice: каждому
  rationale: Универсальное выражение «всякому, каждому»; дательный падеж согласуется с «доступное».
- source_word: ⲡϣⲁϫⲉ
  choice: речь
  rationale: Слово может означать речь, высказывание или слово; «речь» лучше всего сохраняет смысловую связь со «слышанием».
- source_word: ⲉⲧⲉ ⲙⲁⲧϣⲉ
  choice: которую невозможно уловить
  rationale: '«Уловить» в русском языке сохраняет телесно-познавательную двойственность: речь нельзя ни поймать, ни вполне воспринять или понять.'
theological_decisions:
- issue: Отнесение оборота «пребывающие во мне»
  choice: К «видению и самообладанию»
  alternative: К «сердцу»
  rationale: Женская форма коптского относительного показателя согласуется с предшествующими существительными греческого происхождения; слово «сердце» в коптском мужского рода и потребовало бы иной формы. Альтернативное членение сохранено в примечании как история перевода, но не внесено в основной текст.
- issue: Парадокс доступного слышания и неуловимой речи
  choice: Сохранить без богословского пояснения
  alternative: Истолковать как особое откровение или внутренний голос
  rationale: Источник формулирует напряжённый поэтический парадокс и не указывает однозначно на конкретную конфессиональную трактовку.
translation_notes:
  register: Современный литературный русский язык с достоинством и поэтической сжатостью оригинала. Необычное существительное «слышание» сохранено ради параллели и парадокса с «речью»; синтаксис слегка возвышенный, но понятный обычному читателю.
