base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/078.yaml
  text: 'Those who exist outside my association are ignorant of me[a],

    and those who exist in my substance are the ones who know me.

    Those who are close to me have been ignorant of me,

    and those who are far away from me are the ones who have known me.

    On the day when I am close to you, you are far away from me,

    and on the day when you are close to me, I am far away from you.'
translation:
  language: ru
  text: 'Те, кто пребывает вне общения со мной, не знают меня[a],

    а те, кто пребывает в моей сущности, — те знают меня.


    Те, кто рядом со мной, не знали меня,

    а те, кто далеко от меня, — те познали меня.


    В тот день, когда я близка к вам, вы далеки от меня,

    а в тот день, когда вы близки ко мне, я далека от вас[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Коптское ⲥⲩⲛⲟⲩⲥⲓⲁ, заимствованное из греческого συνουσία, может означать совместное пребывание, общение, сообщество или близость.
    reason: lexical_alternative
  - marker: b
    text: Предоставленный OCR-фрагмент обрывается в начале последней параллельной строки; её окончание восстановлено по симметрии высказывания и засвидетельствованному тексту этого места.
    reason: textual_reconstruction
lexical_decisions:
- source_word: ϩⲛ ⲧⲁⲥⲩⲛⲟⲩⲥⲓⲁ
  choice: в общении со мной
  rationale: Греческое заимствование συνουσία обозначает совместное пребывание, общение или сообщество. Естественное русское «общение со мной» сохраняет идею со-бытия и не смешивает её со следующей ⲟⲩⲥⲓⲁ, «сущностью».
- source_word: 'ⲛⲧⲁⲟⲩⲥⲓⲁ (OCR: ⲛⲧⲁ ⲟⲩⲁ)'
  choice: в моей сущности
  rationale: За OCR-разрывом, вероятно, стоит греческое заимствование οὐσία. «Сущность» передаёт онтологический смысл и сохраняет намеренный контраст с συνουσία.
- source_word: ⲥⲉⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: не знают меня
  rationale: Конструкция буквально выражает состояние незнания; простой оборот сохраняет повтор ключевого глагола «знать» и парадоксальную симметрию.
- source_word: ⲛⲉⲧⲙⲏⲛ ⲉⲣⲟⲉⲓ
  choice: те, кто рядом со мной
  rationale: ⲙⲏⲛ выражает пребывание или постоянство; в данном противопоставлении удалённым речь идёт о находящихся рядом.
- source_word: ⲛⲉⲧⲟⲩⲏⲏⲩ ⲛⲥⲁⲛⲃⲟⲗ ⲙⲙⲟⲉⲓ
  choice: те, кто далеко от меня
  rationale: Передано пространственное противопоставление близости и удалённости без попытки истолковать его метафизически.
- source_word: ⲛⲉⲛⲧⲁⲩⲥⲟⲩⲱⲛⲧ
  choice: те познали меня
  rationale: Форма с ⲛⲧⲁⲩ указывает на завершённое действие. «Познали» сохраняет отличие от настоящего времени и возвышенный, но понятный регистр.
- source_word: ⲉⲓϩⲏⲛ
  choice: я близка
  rationale: Говорящая в произведении представлена женским голосом; русская краткая форма неизбежно маркирует род, в отличие от коптского оригинала.
theological_decisions:
- issue: Различие между συνουσία и οὐσία
  choice: «общение со мной» и «моя сущность»
  alternative: «моё присутствие» и «моё естество»
  rationale: Выбранные слова не отождествляют отношение к говорящей с пребыванием в её сущности и тем самым сохраняют напряжение исходного параллелизма.
- issue: Знание говорящей близкими и далёкими
  choice: Сохранён буквальный парадокс без поясняющего толкования
  alternative: Истолковать близость и дальность как духовные состояния
  rationale: Текст не объясняет природу близости и удалённости; конфессиональное или метафизическое разрешение парадокса было бы привнесением.
translation_notes:
  register: Современный литературный русский с торжественной ритмикой и сохранением анафор «те, кто» и «в тот день». Женские формы «близка/далека» обусловлены женским голосом произведения. Местоимение «вы» оставляет обращение коллективным и не вводит не подтверждённой фамильярности.
