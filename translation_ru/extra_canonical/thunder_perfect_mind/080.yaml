translation:
  language: ru
  text: 'Я — мир,

    но из-за меня пришла война[a];

    я — чужеземка[b] и гражданка.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «возникла война» — с оттенком начала, вспышки войны.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «чужая». Слово может обозначать как чужеземца, так и незнакомца; «чужеземка» яснее противопоставлено «гражданке». Представленный коптский OCR-фрагмент, вероятно, смещён: в нём читаются не относящиеся к этой строке греческие заимствования («наказание», «природа», «творение», «души»).'
    reason: lexical_and_alignment_note
lexical_decisions:
- source_word: ϩⲓⲣⲏⲛⲏ (греч. εἰρήνη)
  choice: мир
  rationale: Прямой и естественный эквивалент, сохраняющий резкую антитезу с «войной».
- source_word: ⲡⲟⲗⲉⲙⲟⲥ (греч. πόλεμος)
  choice: война
  rationale: Сохраняет максимальную силу парадокса «мир — война»; «конфликт» был бы слабее.
- source_word: ⲉⲧⲃⲉ ⲁⲛⲟⲕ
  choice: из-за меня
  rationale: Естественно передаёт причинное значение, не приписывая причине положительной цели.
- source_word: ⲝⲉⲛⲟⲥ (греч. ξένος)
  choice: чужеземка
  rationale: Подчёркивает гражданско-правовую противоположность слову «гражданка» и согласуется с женским голосом произведения.
- source_word: ⲡⲟⲗⲓⲧⲏⲥ (греч. πολίτης)
  choice: гражданка
  rationale: Наиболее точно сохраняет гражданскую категорию и контраст с «чужеземкой».
- source_word: ⲉⲓ (перфективная форма глагола «приходить»)
  choice: пришла
  rationale: Передаёт завершившееся наступление войны; вариант «возникла» также возможен.
