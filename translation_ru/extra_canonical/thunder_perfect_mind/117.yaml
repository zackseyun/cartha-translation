  text: The one who will judge me at the end—judge him! You who are in many sins, and intemperances, and empty passions, and temporary pleasures!
translation:
  language: ru
  text: Тот, кто будет судить меня по закону[a], — судите его[b]! Вы, погрязшие во многих грехах, в невоздержанности, в пустых страстях и мимолётных удовольствиях[c]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В OCR стоит неясное ⲛⲉⲗⲟⲥ. Здесь принято вероятное чтение ⲛⲟⲙⲟⲥ — «закон»; возможно также исправление на ⲧⲉⲗⲟⲥ — «конец».
    reason: textual_variant
  - marker: b
    text: 'Слова между первой фразой и обращением сильно искажены в OCR. Перевод следует вероятной реконструкции: «судите его! О вы, кто…».'
    reason: alignment_note
  - marker: c
    text: Конец отрывка оборван. «Мимолётные» передаёт вероятное продолжение греческого заимствования πρόσκαιρος — «временный, недолговечный».
    reason: textual_reconstruction
lexical_decisions:
- source_word: ⲕⲣⲓⲛⲉ
  choice: судить / судите
  rationale: Греческое заимствование κρίνω имеет здесь судебно-нравственный смысл. В повреждённом переходе наиболее вероятно повторение глагола в повелительном наклонении.
- source_word: 'ⲛⲟⲙⲟⲥ (OCR: ⲛⲉⲗⲟⲥ)'
  choice: закон
  rationale: Чтение «закон» лучше объясняет OCR и согласуется с ближайшим контекстом; предложенное чтение ⲧⲉⲗⲟⲥ «конец» требует менее вероятного исправления.
- source_word: ⲉⲛⲁϣⲱⲟⲩ
  choice: многих
  rationale: Форма выражает множественность и относится к «грехам».
- source_word: ⲛⲟⲃⲉ
  choice: грехах
  rationale: Обычное нравственно-религиозное значение сахидского слова.
- source_word: ⲙⲛⲧⲁⲧⲁⲙⲁϩⲧⲉ
  choice: невоздержанности
  rationale: Буквально обозначает отсутствие владения или контроля над собой; «неведение» здесь этимологически и контекстуально менее вероятно.
- source_word: 'ⲡⲁⲑⲟⲥ ⲉⲧϣⲟⲩⲉⲓⲧ (OCR: ⲉⲧϣⲁⲉⲓⲏⲧ)'
  choice: пустых страстях
  rationale: Исправленное чтение «пустые» убедительнее OCR-чтения, истолкованного как «возрастающие»; πάθος в перечне пороков передано как «страсти».
- source_word: 'ⲏⲇⲟⲛⲏ ⲡⲣⲟⲥⲕⲁⲓⲣⲟⲥ (OCR обрывается: ⲏⲇⲟⲛⲏ ⲡⲣⲟⲥ ⲡⲉ)'
  choice: мимолётных удовольствиях
  rationale: Фрагмент, вероятно, содержит греческое πρόσκαιρος «временный, недолговечный» при ἡδονή «удовольствие»; «мимолётные» естественно передаёт смысл по-русски.
- source_word: ϣⲟⲟⲡ ϩⲛ
  choice: погрязшие во
  rationale: Буквально «находящиеся/пребывающие в». В русском перечне пороков «погрязшие во» ясно и энергично выражает устойчивое пребывание, не меняя нравственной направленности фразы.
theological_decisions:
- issue: 'Основание суда: закон или конец'
  choice: по закону
  alternative: в конце
  rationale: Контекстуальная реконструкция ⲛⲟⲙⲟⲥ объясняет повреждённое OCR-чтение ⲛⲉⲗⲟⲥ и продолжает тему суда по закону; богословское содержание не следует перестраивать на основании менее вероятного чтения τέλος.
- issue: Смена повествования на обращение
  choice: сохранено резкое повеление «судите его!» и прямое обращение
  alternative: 'будущее изъявительное: «будет судить тех, кто…»'
  rationale: Реконструкция повреждённого участка указывает на повелительную форму и обращение; сохранение драматического перелома соответствует риторике произведения.
translation_notes:
  register: Современный литературный русский с торжественной, обличительной интонацией. Резкий переход от относительной конструкции к повелению и прямому обращению сохранён. «Погрязшие» выбрано вместо буквального «находящиеся», чтобы фраза звучала естественно и передавала нравственную силу контекста.
