base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/082.yaml
  text: 'I am the union and the dissolution[a];

    I am the abiding[d][c][b],

    and I am the dissolution.'
translation:
  language: ru
  text: 'Я — соединение и разъединение[a];


    Я — пребывание[b],


    и Я — разъединение.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально здесь названы соединение (или связывание) и развязывание, распускание; последнее можно также передать как «распад» или «расторжение».
    reason: lexical_alternative
  - marker: b
    text: Слово ⲙⲟⲛⲏ может означать «пребывание», «обитание», «жилище» или «покой».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲡⲱⲧⲣ
  choice: соединение
  rationale: Передаёт значение соединения, связывания или единения и сохраняет противопоставление последующему «разъединению».
- source_word: ⲡⲕⲱⲗⲉⲃⲟⲗ / ⲡⲕⲱⲗ
  choice: разъединение
  rationale: Глагольное сочетание ⲕⲱⲗ ⲉⲃⲟⲗ выражает развязывание, распускание или разложение; «разъединение» естественно по-русски и образует ясную антитезу с «соединением». Краткая форма во втором случае передана так же ввиду параллелизма.
- source_word: ⲧⲙⲟⲛⲏ
  choice: пребывание
  rationale: Греческое заимствование monē может означать пребывание, обитание, жилище или покой. Абстрактное «пребывание» соответствует форме ряда самоотождествлений и контрастирует с разъединением.
- source_word: ⲁⲩⲱ
  choice: и
  rationale: Сохраняет простой сочинительный строй и ритмический параллелизм источника.
theological_decisions:
- issue: Парадоксальное самоотождествление с противоположностями
  choice: 'Сохранить без поясняющего согласования: «соединение и разъединение»'
  alternative: Ослабить противоречие, истолковав одно из понятий метафорически
  rationale: Источник намеренно соединяет противоположные определения; перевод не должен устранять эту богословскую и риторическую напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткие именные формулы и повтор «Я —» сохраняют торжественный, парадоксальный ритм оригинала. Конечное ⲁⲛⲟⲕ в OCR-фрагменте, вероятно, начинает следующую формулу и поэтому в данный сегмент не включено.
