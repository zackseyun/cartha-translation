  language: ru
  text: '**4.** Я — жена[a] и дева[b][c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Коптское ⲥϩⲓⲙⲉ может означать «женщина» или «жена». Здесь «жена» усиливает парадокс в сочетании с «девой»; возможен и более нейтральный перевод «женщина».
    reason: lexical_alternative
  - marker: b
    text: ⲡⲁⲣⲑⲉⲛⲟⲥ — заимствованное из греческого слово со значением «дева», «девственница»; последнее является более прямым, но менее поэтичным вариантом перевода.
    reason: lexical_alternative
  - marker: c
    text: В распознанном тексте слово ⲡⲁⲣⲑⲉⲛⲟⲥ разделено переносом строки (ⲡⲁⲣ | ⲑⲉⲛⲟⲥ), поэтому границы данного фрагмента установлены со средней степенью уверенности.
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Я —
  rationale: Сохраняет повторяющуюся формулу самоименования и её торжественный ритм; именная конструкция с тире естественна для современного русского языка.
- source_word: ⲧⲉⲥϩⲓⲙⲉ
  choice: жена
  rationale: ⲥϩⲓⲙⲉ может означать и «женщина», и «жена»; брачное значение яснее сохраняет намеренный парадокс в сочетании с ⲡⲁⲣⲑⲉⲛⲟⲥ.
- source_word: ⲁⲩⲱ
  choice: и
  rationale: Обычный сочинительный союз, сохраняющий краткость и параллелизм исходной пары.
- source_word: ⲧⲡⲁⲣⲑⲉⲛⲟⲥ
  choice: дева
  rationale: Греческое заимствование обычно обозначает деву, девственницу; «дева» передаёт смысл лаконично и в возвышенном поэтическом регистре, не устраняя контраста с «женой».
