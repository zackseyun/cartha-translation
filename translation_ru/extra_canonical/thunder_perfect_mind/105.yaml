base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/105.yaml
  text: 'You look on me[a], cast out from yourselves,

    and you are defeated.

    Listen to me, you hearers,

    and learn my words,

    you who know me[g][f][e][d][c][b].

    I am...'
translation:
  language: ru
  text: '**3.** Вы смотрите на меня, изгнав меня из своей среды[a],

    и терпите поражение.

    Слушайте меня, слушающие,

    и учитесь моим словам[b],

    вы, знающие меня.

    Я…[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Чтение и членение этой фразы не вполне надёжны из-за состояния текста и OCR; возможны иные реконструкции.
    reason: textual_uncertainty
  - marker: b
    text: В OCR здесь стоит форма, похожая на «в моей душе», однако исправленное чтение даёт «моим словам»; глагол означает «получать наставление, учиться».
    reason: ocr_correction
  - marker: c
    text: Высказывание продолжается за пределами данного отрывка.
    reason: segment_boundary
lexical_decisions:
- source_word: ⲧⲉⲧⲛⲛⲁⲩ ⲉⲣⲟⲓ
  choice: вы смотрите на меня
  rationale: Обычная саидская конструкция со значением «видеть / смотреть на». «Смотрите» сохраняет непосредственность обращения без архаического оттенка.
- source_word: ⲙⲡⲉⲧⲛⲥⲁⲛϩⲟⲩ ⲛⲟⲩⲟⲛϩ ⲉⲃⲟⲗ
  choice: изгнав меня из своей среды
  rationale: Текст этого места и его членение не вполне надёжны; перевод следует контекстуальному прочтению, отражённому в проверенном консультационном слое, но не делает спорную фразу основанием для богословского вывода.
- source_word: ⲧⲉⲧⲛⲣⲥⲱⲧⲉ
  choice: терпите поражение
  rationale: Буквы на переносе следует соединять как конструкцию с ⲣ-ⲥⲱⲧⲉ — «быть побеждёнными / потерпеть неудачу», а не отделять ⲣⲥⲱ как «восклицать».
- source_word: ⲥⲱⲧⲙ ⲉⲣⲟⲓ ⲛⲁⲕⲣⲟⲁⲧⲏⲥ
  choice: слушайте меня, слушающие
  rationale: Императивное обращение передано прямо; греческое заимствование ἀκροατής означает слушателя. Повтор корня по-русски сохраняет риторическую фигуру оригинала.
- source_word: ⲛⲧⲉⲧⲛⲭⲓⲥⲃⲱ ⲉⲛⲁⲯⲩⲭⲏ
  choice: и учитесь моим словам
  rationale: С учётом исправления OCR фраза понимается как ϫⲓ-ⲥⲃⲱ «получать наставление, учиться» и ⲛⲁ-ϣⲁϫⲉ «мои слова», а не как «клеветать в душе».
- source_word: ⲛⲉⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: вы, знающие меня
  rationale: Относительная группа понята как звательное обращение, параллельное предшествующему «слушающие».
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: Я…
  rationale: Формула начинает следующую самохарактеристику, обрывающуюся на границе отрывка; добавление «та самая» или «единая» неоправданно завершило бы незавершённую мысль.
theological_decisions:
- issue: Самоидентификация говорящей в конце отрывка
  choice: Сохранить незавершённое «Я…»
  alternative: «Я — та самая» / «Я есмь»
  rationale: Граница сегмента разрывает продолжающееся высказывание. Перевод не должен превращать его в самостоятельную формулу и тем самым придавать ему дополнительный богословский смысл.
translation_notes:
  register: Современный литературный русский язык с торжественным ритмом поэтической речи. Сохранены параллелизм и повтор «слушайте — слушающие»; архаизмы и конфессионально окрашенные формулы не вводятся.
