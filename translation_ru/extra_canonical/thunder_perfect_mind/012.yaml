base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/012.yaml
  text: I am the midwife and she who does not give birth[a]. I am the comfort of my labor pains. I am the bride and the bridegroom[d][c][b]. I am the mother of my father and the sister of my husband.
translation:
  language: ru
  text: На свадьбе[a] я — повитуха и та, что не рожает. Я — утешение в моих родовых муках. Я — невеста и мать[b]. Я — сестра и женщина[c]. Я — мать…[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальные слова, по-видимому, означают «на свадьбе» или «в браке», однако OCR-форма существительного не вполне надёжна.
    reason: textual_uncertainty
  - marker: b
    text: В доступном OCR здесь буквально читается «невеста и мать». В распространённой реконструкции этого места стоит «невеста и жених»; чтение требует сверки с факсимиле.
    reason: alternative_reading
  - marker: c
    text: Коптское слово может означать как «женщина», так и «жена». Из-за неполного и, вероятно, искажённого OCR-контекста в основном тексте сохранено более широкое значение.
    reason: lexical_alternative
  - marker: d
    text: Отрывок обрывается после слов «мать» и незавершённой связки «…кого/чего»; продолжение по этому фрагменту восстановить нельзя.
    reason: incomplete_source
