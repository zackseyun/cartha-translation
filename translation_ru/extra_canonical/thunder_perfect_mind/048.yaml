base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/048.yaml
  text: And you have called me “Lawlessness.” I am she whom you pursued[a]; and I am the one you have seized; I am she whom you scattered[g][f][e][d][c][b], and you have known.
translation:
  language: ru
  text: 'И вы назвали меня «Беззаконием».

    Я — та, за которой вы гнались,

    и я — та, которую вы схватили.

    Я — та, которую вы рассеяли,[a]

    и вы познали.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение можно также передать как «разослали» или «разогнали». Здесь оно означает отправление наружу и рассеяние, а не «возгласили».
    reason: lexical_alternative
  - marker: b
    text: Доступный OCR-текст читается как «и вы познали». Возможно близкое графическое чтение «и вы собрали», которое образовало бы антитезу к «рассеяли», однако оно не принято без проверки рукописи.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲙⲟⲩⲧⲉ
  choice: назвали
  rationale: Обычный смысл глагола — «называть, давать имя». В данном утвердительном перфекте передаёт обвинительное наименование говорящей.
- source_word: ⲁⲛⲟⲙⲓⲁ
  choice: Беззаконие
  rationale: Греческое заимствование anomia означает отсутствие или нарушение закона. «Беззаконие» сохраняет резкость имени-обвинения, не сужая его до отдельного проступка.
- source_word: ⲡⲱⲧ ⲛⲥⲱⲥ
  choice: гнались за которой
  rationale: Буквально конструкция означает «бежать/гнаться за ней»; местоимение женского рода возобновляет относительное «та», а не указывает на ошибку OCR.
- source_word: ⲙⲁϩⲧⲉ
  choice: схватили
  rationale: Передаёт сильное значение «схватить, завладеть, удержать» естественным современным русским языком.
- source_word: ϫⲟⲟⲩ ⲉⲃⲟⲗ
  choice: рассеяли
  rationale: Здесь ϫⲟⲟⲩ означает «послать», а сочетание с ⲉⲃⲟⲗ допускает значение «разослать, рассеять»; его не следует смешивать с похожим выражением «возгласить».
- source_word: ⲥⲟⲟⲩⲛ
  choice: познали
  rationale: Перевод следует представленному чтению OCR со значением «знать, познать» и сохраняет утвердительный перфект; объект в доступном отрывке не выражен.
theological_decisions:
- issue: Парадокс между преследованием, схватыванием, рассеянием и познанием говорящей
  choice: Сохранена последовательность без поясняющей гармонизации
  alternative: Добавить объект «меня» или истолковать познание как признание
  rationale: Коптский текст оставляет объект последнего глагола невыраженным в данном отрывке; добавление сняло бы подлинную грамматическую и смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с торжественным анафорическим повтором «Я — та». Женский род говорящей и прямое обращение во множественном числе сохранены. Пунктуация подчёркивает ритм речи, не добавляя отсутствующих логических связей.
