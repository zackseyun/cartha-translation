lexical_decisions:
- source_word: ϣⲟⲟⲡ ⲛⲧⲏⲏⲧⲉ
  choice: Я среди вас
  rationale: ϣⲟⲟⲡ передаёт состояние или присутствие («быть, находиться»), а ⲛⲧⲏⲏⲧⲉ — нахождение среди адресатов. Такая формулировка естественна по-русски и не добавляет отсутствующего в коптском смысла.
- source_word: ⲧⲏⲛⲉ
  choice: вас / себя
  rationale: Это объектное местоимение 2-го лица множественного числа, а не существительное «хлеб». В первом повреждённом обороте по контексту адресатов уместно возвратное «себя»; в вопросах — «вас».
- source_word: ⲕⲁ ⲧⲏⲛⲉ ⲉⲃⲟⲗ
  choice: освободит вас
  rationale: Сочетание ⲕⲁ…ⲉⲃⲟⲗ имеет значение отпускания или освобождения. «Освободит» сохраняет смысл и естественно повторяется в следующем условном обороте.
- source_word: ⲛϩⲏⲧϥ
  choice: из него
  rationale: Предлог с суффиксом 3-го лица мужского рода указывает на некий мужского рода референт; из-за лакуны его нельзя надёжно отождествить.
- source_word: ⲛⲓⲙ ⲡⲉⲧⲛⲁϣ
  choice: кто сможет […]?
  rationale: ⲛⲓⲙ вводит вопрос «кто?», а ⲛⲁϣ выражает будущую способность; продолжение утрачено.
theological_decisions:
- issue: Референт выражения ⲛϩⲏⲧϥ
  choice: Сохранено неопределённое «из него»
  alternative: Уточнить референт, например «из этого места» или «из мира»
  rationale: Предшествующее существительное повреждено, поэтому богословское или космологическое отождествление было бы необоснованным.
- issue: Личность освобождающего
  choice: Сохранено местоимение «он» без пояснения
  alternative: Назвать Бога, Спасителя или другого деятеля
  rationale: Текст не называет субъекта; перевод не должен устранять эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с кратким, риторически напряжённым синтаксисом. Лакуны обозначены квадратными скобками; намеренно сохранены обрывочность и неопределённость исходного фрагмента. Номер блока оставлен как редакционный ориентир.
