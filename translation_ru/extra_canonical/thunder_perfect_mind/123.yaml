lexical_decisions:
- source_word: ⲡⲉⲧⲛⲁϣⲱⲡⲉ
  choice: тот, кто возникнет
  rationale: Субстантивированная относительная конструкция с будущим временем и глаголом ϣⲱⲡⲉ («возникать, становиться, происходить»). Мужская форма ⲡⲉⲧ естественнее всего передаётся как «тот, кто»; «возникнет» сохраняет значение появления/начала бытия, не уточняя, кем он станет.
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: Я —
  rationale: Прямая передача копульной формулы самоотождествления. Тире создаёт естественную для современного русского языка именную конструкцию и сохраняет торжественную повторность.
- source_word: ⲧⲉⲥⲩⲛⲅⲛⲱⲙⲏ
  choice: прощение
  rationale: Греческое заимствование συγγνώμη может означать прощение, помилование или снисхождение. «Прощение» — наиболее ясный и контекстуально вероятный русский эквивалент, при этом варианты отмечены в сноске.
- source_word: ⲁⲩⲱ
  choice: и
  rationale: Обычный коптский сочинительный союз; «и» сохраняет повторяющийся ритм исходного фрагмента.
theological_decisions:
- issue: Самоотождествление говорящей с ⲥⲩⲛⲅⲛⲱⲙⲏ
  choice: Я — прощение
  alternative: Я дарую прощение
  rationale: Исходный текст содержит именное отождествление, а не утверждение о действии. Перевод не заменяет парадоксальную формулу богословским истолкованием.
- issue: Личный или безличный референт ⲡⲉⲧⲛⲁϣⲱⲡⲉ
  choice: тот, кто возникнет
  alternative: то, что произойдёт
  rationale: Мужской субстантивирующий элемент поддерживает личное прочтение, но возможная безличная трактовка сохранена в сноске, поскольку контекст OCR-фрагмента ненадёжен.
