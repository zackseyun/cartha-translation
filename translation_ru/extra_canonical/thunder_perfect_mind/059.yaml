translation:
  language: ru
  text: '**14.** Я — та, кого не учили[a][b],


    а вы учитесь у меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «необученная» или «не получившая наставления». Формулировка «та, кого не учили» передаёт характеристику говорящей как не получившей учения, не сводя её к отсутствию формального образования.'
    reason: lexical_alternative
  - marker: b
    text: Приведённый распознанный фрагмент рукописи содержит также слова, связанные со «стыдом / бесстыдством» и «малостью»; вероятно, они относятся к соседним строкам. Поскольку уверенность в построчном сопоставлении средняя, здесь они не отражены.
    reason: alignment_note
lexical_decisions:
- source_word: ⲉⲧϩⲁⲉⲓⲏⲟⲩ
  choice: неучёная
  rationale: 'Форма передаёт характеристику говорящей как не получившей наставления или учения и сохраняет парадокс: та, которую считают неучёной, сама становится учительницей. Женский род согласован с образом говорящей во всём произведении.'
- source_word: ⲛⲧⲉⲧⲛⲧⲱⲡ
  choice: вы учитесь
  rationale: Сохранено обращение ко множеству слушателей. Хотя ⲛⲧⲉⲧⲛ- может иметь будущее или интенциональное значение, настоящее время естественно передаёт обобщённый, афористический смысл строки.
- source_word: ⲉⲃⲟⲗ ϩⲛ
  choice: у меня
  rationale: В сочетании с глаголом учения русское «учиться у кого-либо» естественно передаёт исходную направленность «от, из» и звучит яснее буквального «учиться от меня».
