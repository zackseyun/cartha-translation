base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/084.yaml
  text: '...is the one who sees what comes before me[A]. I am the light.

    I have not gone out — I, I —.B

    a non-darkness and the root of darkness is from within me.

    I am the desire of a vision,

    and the self-control of the heart that exists within me[d][c][b][a][E][D][C][B],

    I am the hearing that is acceptable to everyone.'
translation:
  language: ru
  text: '**9.** …тот, кто видит идущее ко мне.[a]


    Я — свет.


    Я не вышла — я, я.[b]


    Я — не-тьма,


    и корень тьмы — изнутри меня.


    Я — желание видения


    и самообладание сердца, пребывающее во мне.


    Я — слышание, приемлемое для всех.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предполагаемое выравнивание этого блока ожидало парадокс о близости и удалённости, однако приведённый коптский OCR-фрагмент содержит последовательность о свете, тьме и способностях. Перевод следует именно приведённому фрагменту; его начало и чтение первой строки остаются не вполне надёжными.
    reason: alignment_note
  - marker: b
    text: Сочетание ⲙⲡⲕⲱ ⲉⲃⲟⲗ допускает как повествовательное понимание («я не вышла»), так и запретительное («не выходи»). Здесь выбрано первое, поскольку оно согласуется с окружающими заявлениями «Я — …».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉⲧⲛⲁⲩ ⲉⲧⲛⲏⲟⲩ ⲉϩⲣⲁⲓ ⲉⲧⲟⲟⲧ
  choice: тот, кто видит идущее ко мне
  rationale: Передаёт зрительное восприятие и направленность движения к говорящей, не добавляя отсутствующего в данном фрагменте адресата; начальное многоточие отмечает, что отрывок начинается внутри предложения.
- source_word: ⲫⲱⲧ
  choice: свет
  rationale: Сохраняет краткую и выразительную декларацию, принятую в консультационном тексте; OCR-форма может быть неточной, однако ближайший контекст противопоставляет свет и тьму.
- source_word: ⲙⲡⲕⲱ ⲉⲃⲟⲗ
  choice: не вышла
  rationale: Отрицательное завершённое действие лучше соответствует череде заявлений от первого лица; женский род согласован с образом говорящей в произведении. Возможное запретительное прочтение отмечено в сноске.
- source_word: ⲟⲩⲁⲧⲛⲟⲕⲉ
  choice: не-тьма
  rationale: Дефис сохраняет нарочитую привативную форму исходного слова и парадокс, не сглаживая его до «отсутствия тьмы».
- source_word: ⲧⲛⲟⲩⲛⲉ ⲙⲡⲛⲟⲕⲉ ⲟⲩⲉⲃⲟⲗ ⲛϩⲏⲧ ⲧⲉ
  choice: корень тьмы — изнутри меня
  rationale: Разбирает ⲧⲛⲟⲩⲛⲉ как «корень», последующее сочетание как генитив «тьмы», а ⲉⲃⲟⲗ ⲛϩⲏⲧ как «изнутри меня».
- source_word: ⲧⲉⲡⲓⲑⲩⲙⲓⲁ ⲛⲟⲩϩⲟⲣⲁⲥⲓⲥ
  choice: желание видения
  rationale: Сочетание ⲛ- с неопределённым артиклем ⲟⲩ- понимается как «желание видения», а не как заимствованное νοῦς «ум».
- source_word: ⲧⲉⲅⲕⲣⲁⲧⲓⲁ ⲙⲫⲏⲧ ⲉⲥϣⲟⲟⲡ ⲛϩⲏⲧ
  choice: самообладание сердца, пребывающего во мне
  rationale: Сохраняет связь «самообладания» с «сердцем» и относит фразу «пребывающего во мне» к сердцу, следуя грамматическому роду коптского относительного местоимения.
- source_word: ⲡⲥⲱⲧⲙ ⲉⲧϣⲏⲡ ⲛⲟⲩⲟⲛ
  choice: слышание, приемлемое для всех
  rationale: Абстрактное «слышание» поддерживает ряд способностей; ⲉⲧϣⲏⲡ передано как «приемлемое», а ⲛⲟⲩⲟⲛ — как «для всех».
theological_decisions:
- issue: Источник тьмы внутри говорящей
  choice: Сохранено прямое утверждение «корень тьмы — изнутри меня»
  alternative: Сгладить до противопоставления внешней и внутренней тьмы либо истолковать метафорически
  rationale: Текст намеренно удерживает парадокс света, не-тьмы и корня тьмы; перевод не должен заранее разрешать его богословский смысл.
- issue: Образ говорящей
  choice: 'Форма прошедшего времени дана в женском роде: «не вышла»'
  alternative: Использовать грамматически нейтрализующую перестройку
  rationale: Женская самопрезентация является устойчивой чертой произведения; выбор рода не вводит конфессионального толкования.
translation_notes:
  register: Современный литературный русский с торжественным, но ясным ритмом. Повтор «я, я», необычные абстрактные существительные и парадоксальное «не-тьма» сохранены как стилистически значимые черты источника; синтаксис слегка упорядочен лишь ради читаемости.
