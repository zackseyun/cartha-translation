base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/060.yaml
  text: 'But out of shame, receive me to yourselves in shamelessness;

    and out of shamelessness and shame, reprove my members among yourselves;

    and approach yourselves.'
translation:
  language: ru
  text: 'Но из стыда примите меня к себе в бесстыдстве;

    и из бесстыдства и стыда порицайте мои члены среди вас[a];

    и приблизьтесь к самим себе[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Члены» может означать части тела, участников некоторого целого или составные части; коптский текст не позволяет уверенно выбрать одно значение.
    reason: lexical_ambiguity
  - marker: b
    text: 'Буквально — «направьте своё приближение внутрь, к самим себе»; возможный смысл: «обратитесь внутрь себя».'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ϭⲉ
  choice: но
  rationale: Дискурсивная частица связывает высказывание с предшествующим контекстом; «но» естественно передаёт продолжение с оттенком противопоставления.
- source_word: ϣⲓⲡⲉ
  choice: стыд
  rationale: Основное значение существительного здесь — «стыд»; оно образует намеренную парадоксальную пару с «бесстыдством».
- source_word: ϣⲟⲡⲧ
  choice: примите меня
  rationale: Форма понимается как повелительное наклонение от ϣⲱⲡ с объектным суффиксом первого лица, а не как описание отношения к говорящей.
- source_word: ⲙⲛⲧⲁⲧϣⲓⲡⲉ
  choice: бесстыдство
  rationale: Привативное образование буквально обозначает отсутствие стыда; прямой перевод сохраняет антитезу и её провокационное напряжение.
- source_word: ϫⲡⲓⲟ
  choice: порицайте
  rationale: Повелительная форма означает «порицать, укорять, обличать»; «порицайте» сохраняет прямой смысл без излишне судебного оттенка.
- source_word: ⲙⲉⲗⲟⲥ
  choice: члены
  rationale: Греческое заимствование μέλος может обозначать член тела или участника/составную часть. Русское «члены» сохраняет эту многозначность.
- source_word: ⲧⲓ ⲟⲩⲟⲉⲓ ⲉ-
  choice: приблизьтесь
  rationale: Коптская идиома выражает приближение; возвратная конструкция передаёт направленность действия «к самим себе».
theological_decisions:
- issue: Парадокс стыда и бесстыдства
  choice: Сохранена буквальная антитеза «из стыда… в бесстыдстве» и «из бесстыдства и стыда».
  alternative: Истолковать пару как «в презрении и почёте».
  rationale: В данном синтаксическом прочтении слова естественно означают «стыд» и «бесстыдство»; богословское или этическое напряжение текста не следует сглаживать толкованием.
- issue: Значение «моих членов»
  choice: Оставлено «мои члены» с примечанием о возможных смыслах.
  alternative: Уточнить как «части моего тела» или «моих последователей».
  rationale: Источник не разрешает однозначно телесное, коллективное или метафорическое понимание, поэтому конкретизация внесла бы интерпретацию в основной текст.
- issue: Обращение к самим себе
  choice: 'Передано буквально: «приблизьтесь к самим себе».'
  alternative: Истолковать как «войдите в себя» или «обратитесь внутрь себя».
  rationale: Более гладкие варианты усиливают психологическое или мистическое толкование, которого сама неоднозначная конструкция прямо не устанавливает.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повелительной интонацией. Синтаксический параллелизм и парадоксальная пара «стыд — бесстыдство» сохранены; неоднозначные образы не разъясняются в основном тексте.
