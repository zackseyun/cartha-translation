  source_fidelity: 'Русский текст верно следует серии коптских императивов: «примите меня», «порицайте мои члены», «приблизьтесь к самим себе». Антитетическая пара ϣⲓⲡⲉ / ⲙⲛⲧⲁⲧϣⲓⲡⲉ передана без догматического сглаживания как «стыд / бесстыдство». Формула «к самим себе» сохраняет намеренно необычную направленность заключительного выражения и не навязывает психологического истолкования.'
