translation:
  language: ru
  text: 'Будьте осторожны, когда речь идёт о моей слабости[a].


    Я же — та, что пребывает во всяком страхе

    и что есть сила в трепете[b].


    Я — та, что…[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «Будьте осторожны из-за моей немощи» или «Остерегайтесь моей слабости».'
    reason: Лексика и синтаксическая связь допускают несколько близких оттенков.
  - marker: b
    text: В рукописном чтении, переданном OCR как ⲡⲛⲏϣⲁⲧ, вероятно, следует распознать ⲡⲛⲁϣⲧ — «сила»; ⲥⲧⲱⲧ означает «трепет, дрожь».
    reason: Текстологическая неопределённость OCR существенно влияет на перевод.
  - marker: c
    text: Фраза в данном отрывке обрывается и, вероятно, продолжается в следующей строке рукописи.
    reason: Граница предоставленного фрагмента оставляет относительное предложение незавершённым.
lexical_decisions:
- source_word: ⲧⲛ̄ⲥⲁϩⲟⲩ
  choice: Будьте осмотрительны
  rationale: Глагол передаёт призыв к благоразумию, осторожности или настороженности; «будьте осмотрительны» естественно звучит по-русски и сохраняет увещевательный тон.
- source_word: ⲙ̄ⲡⲁϣⲟⲩϣⲟⲩ
  choice: в отношении моей слабости
  rationale: ϣⲟⲩϣⲟⲩ означает слабость, немощь; предлог передаёт отношение к предмету. Формулировка сохраняет необычность исходной мысли и не вводит неподтверждённое значение «хвастовство».
- source_word: ⲧⲉⲧϣⲟⲟⲡ ⲛ̄ⲛ̄ⲫⲟⲃⲟⲥ ⲧⲏⲣⲟⲩ
  choice: та, что пребывает во всяком страхе
  rationale: Женская относительная форма указывает на говорящую; ϣⲟⲟⲡ обозначает бытие или присутствие, а ⲧⲏⲣⲟⲩ при множественном существительном допускает распределительное «во всяком страхе».
- source_word: ⲡⲛⲏϣⲁⲧ ⲛ̄ⲟⲩⲥⲧⲱⲧ
  choice: сила в трепете
  rationale: С учётом вероятного искажения OCR ⲡⲛⲏϣⲁⲧ вместо ⲡⲛⲁϣⲧ выражение означает «сила в трепете»; ⲥⲧⲱⲧ — «трепет, дрожь», а не «сердце».
- source_word: ⲁⲛⲟⲕ ⲧⲉ ⲧⲉⲧ
  choice: Я — та, что…
  rationale: ⲧⲉ — женская связка, а начавшаяся относительная форма обрывается вместе с фрагментом; многоточие сохраняет незавершённость.
theological_decisions:
- issue: Парадоксальное соединение слабости, страха, силы и трепета
  choice: Сохранить парадокс без поясняющего истолкования
  alternative: Сгладить противопоставления или истолковать их как конкретное богословское учение
  rationale: Поэтическое высказывание намеренно удерживает противоположности; источник не даёт оснований разрешать напряжение в пользу определённой конфессиональной системы.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным ритмом. Повтор формулы «Я — та, что…» и парадоксальные образы сохранены; архаизмы и конфессионально окрашенные толкования не вводятся.
