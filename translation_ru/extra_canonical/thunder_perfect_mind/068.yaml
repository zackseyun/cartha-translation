lexical_decisions:
- source_word: ⲧⲉⲧⲉⲧⲱⲃⲡ … ⲁⲛⲟⲕ
  choice: Почему же вы презираете меня
  rationale: OCR здесь повреждён. С учётом исправленного чтения ⲧⲉⲧⲛⲧⲱⲃⲡ ⲟⲩⲛ ⲙⲙⲟⲓ передаётся обращённый к множественному «вы» вопрос о презрении; частица ⲟⲩⲛ отражена словом «же».
- source_word: ⲛⲛⲉⲧ ⲛⲉⲣⲙⲛⲥⲁⲛⲁⲓ
  choice: среди малых
  rationale: Фраза характеризует людей через малость; «малых» сохраняет возможность понимать её как малый возраст, незначительность или низкое положение.
- source_word: ⲡⲛⲟⲩⲥ
  choice: Ум
  rationale: Греческое заимствование νοῦς обозначает ум или мыслящее начало. «Ум» понятно современному читателю и сохраняет философскую весомость; прописная буква указывает на самоименование говорящей фигуры.
- source_word: ⲧⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: мой Покой
  rationale: Форма содержит притяжательный показатель первого лица и греческое ἀνάπαυσις. «Покой» естественно передаёт отдых и состояние упокоения, не устраняя необычную конструкцию «Я — … и мой Покой».
- source_word: ⲡⲥⲟⲟⲩⲛ
  choice: знание
  rationale: Прямой эквивалент коптского существительного со значением знания или познания.
- source_word: ⲙⲡⲁⲅⲉⲛⲟⲥ (реконструкция повреждённого OCR ⲙⲡⲁⲅⲓⲛⲉ ⲛⲥⲱ)
  choice: моего рода
  rationale: 'Контекстуально засвидетельствованное чтение понимает повреждённую последовательность как греческое γένος с притяжательным показателем: «моего рода», а не как «моего поиска».'
theological_decisions:
- issue: Персонификация Ума и Покоя
  choice: Сохранить формулу «Я — Ум и мой Покой» без догматического пояснения
  alternative: Сгладить до «Я — Ум и Покой» либо истолковать Ум как конкретную божественную ипостась
  rationale: Источник содержит намеренно парадоксальную притяжательную конструкцию. Перевод сохраняет её богословское напряжение и не приписывает тексту позднейшую конфессиональную схему.
- issue: «Знание моего рода»
  choice: Сохранить родовую лексику без объяснения природы этого рода
  alternative: Передать как «познание моей божественной природы»
  rationale: Такой вариант не вносит отсутствующее в строке определение «божественной» и оставляет открытым смысл γένος.
translation_notes:
  register: Современный литературный русский с кратким, торжественным синтаксисом. Парадоксальные самоопределения сохранены, а не стилистически исправлены. Множественное «вы» отражает реконструируемую коптскую форму; философские самоименования «Ум» и «Покой» даны с прописной буквы.
