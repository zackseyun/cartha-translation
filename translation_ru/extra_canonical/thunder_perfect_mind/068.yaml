base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/068.yaml
  text: Why do you despise me among those who are small? I am the Mind[a], and my Rest[f][e][d][c][b]. You are the knowledge of my kind
translation:
  language: ru
  text: '**5.** Почему же вы презираете меня среди тех, кто мал?[a] Я — Ум[b] и мой Покой. Вы — знание моего рода.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Коптский текст в данном OCR-фрагменте повреждён. Перевод следует исправленному чтению со смыслом «вы презираете меня … среди тех, кто мал». Это может указывать на детей, юных или людей, считающихся незначительными.
    reason: textual_and_lexical_alternative
  - marker: b
    text: 'Или: «Разум», «Нус». Коптское ⲡⲛⲟⲩⲥ заимствовано из греческого νοῦς.'
    reason: lexical_alternative
  - marker: c
    text: «Моего рода» следует реконструкции повреждённого OCR как ⲙⲡⲁⲅⲉⲛⲟⲥ. Чтение прежде предлагавшегося здесь выражения «моего поиска» ненадёжно.
