translation:
  language: ru
  text: '**17.** И когда вы скроетесь[a][b][c],


    я — та, которую увидят.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'ⲥⲙⲓⲛⲉ может также означать «стать малым, умалиться». Тогда возможен перевод: «И когда вы умалитесь, я — та, которую увидят».'
    reason: lexical_alternative
  - marker: b
    text: В приведённом фрагменте встречаются также выражения, приблизительно означающие «в начале творения» и «видимый облик малого ребёнка»; вероятно, они относятся к соседним строкам. Здесь, согласно разметке блока, переведено только противопоставление сокрытия и видимости.
    reason: alignment_note
  - marker: c
    text: 'Если стоящее далее ⲙⲡⲣⲙⲉⲥⲧⲱⲥ относится к этой строке, возможен иной разбор: «И не скрывайтесь: я — та, которую увидят».'
    reason: alternative_reading
lexical_decisions:
- source_word: ⲥⲙⲓⲛⲉ
  choice: скроетесь
  rationale: Передаёт принятое в разметке возвратное значение и сохраняет поэтическое противопоставление между теми, кто скрывается, и говорящей, которую увидят. Возможное значение «станете малы / умалитесь» отмечено в сноске.
- source_word: ⲙⲓⲉ
  choice: которую увидят
  rationale: Сохраняет значение видимости или явленности и результирующий пассивный смысл, не сводя выражение к добровольному действию «явлюсь».
- source_word: ⲁⲩⲱ
  choice: и
  rationale: Простой соединительный союз поддерживает накопительный ритм речи и не добавляет отсутствующего в источнике резкого противопоставления.
theological_decisions:
- issue: Род говорящей в конструкции «я — та»
  choice: женский род
  alternative: нейтральное «именно меня увидят»
  rationale: Во всём произведении говорит женский персонифицированный голос; женская форма естественна по-русски и не вводит дополнительного вероучительного отождествления.
- issue: Соотношение сокрытия и явления
  choice: сохранить парадокс без объяснения
  alternative: истолковать явление как следствие умаления адресатов
  rationale: Неясная и напряжённая связь двух частей принадлежит поэтике текста; перевод не должен превращать её в однозначное богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным поэтическим синтаксисом. Формула «я — та» сохраняет характер повторяющейся речи от первого лица; «которую увидят» передаёт пассивную явленность и контраст со «скроетесь». Из-за средней уверенности автоматической привязки все существенные альтернативы вынесены в сноски.
