translation:
  language: ru
  text: '**10.** Вы слышите меня в том, как вы меня призываете[a], — в некоем […], которое вы произносите[b]. Вы не услышали[c]. Я — защита[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в вашем призывании меня». Глагол допускает также переводы «обращаетесь ко мне» и «призываете меня».'
    reason: lexical_alternative
  - marker: b
    text: 'После слов «в некоем» источник повреждён или обрезан: сохранилось лишь начало слова ⲡ—. Поэтому предмет произнесения не восстанавливается предположительно.'
    reason: textual_damage
  - marker: c
    text: 'Коптская форма означает отрицательное завершённое действие: «вы не услышали», а не «если вы не услышали». Намеренное напряжение между «слышите» и «не услышали» сохранено.'
    reason: grammar_and_ambiguity
  - marker: d
    text: ⲁⲡⲟⲗⲟⲅⲓⲁ — греческое заимствование со значениями «защита», «оправдательная речь» или «ответ».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲧⲉⲧⲛⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: вы слышите меня
  rationale: Форма ⲧⲉⲧⲛⲥⲱⲧⲙ — настоящее время, а не повелительное наклонение. ⲥⲱⲧⲙ допускает значения «слышать» и «слушать»; здесь «слышите» естественно сочетается с последующим отрицательным совершенным «не услышали».
- source_word: ϩⲛ ⲛⲉⲧⲛ ⲙⲟⲩⲧⲉ ⲉⲣⲟⲓ
  choice: когда зовёте меня
  rationale: Последовательность передаёт действие адресатов — их обращение или призывание говорящей. Русское «когда зовёте меня» естественно выражает обстоятельственную связь, не сводя смысл к наречению именем.
- source_word: ϩⲛ ⲟⲩⲡ… ⲉⲧⲉⲧⲛⲧⲁⲩⲟ
  choice: в некоем […], которое произносите
  rationale: После неопределённого артикля и начальной буквы ⲡ слово утрачено или обрезано; относительная форма ⲉⲧⲉⲧⲛⲧⲁⲩⲟ означает «которое вы произносите/изрекаете». Род местоимения в русском условно согласован с подразумеваемым утраченным словом среднего рода.
- source_word: ⲙⲡⲉⲧⲛⲥⲱⲧⲙ
  choice: вы не услышали
  rationale: Это отрицательный перфект, а не условное предложение. Перевод сохраняет резкий временной и смысловой контраст с «вы слышите».
- source_word: ⲧⲁⲡⲟⲗⲟⲅⲓⲁ
  choice: защита
  rationale: Греческое заимствование ἀπολογία может обозначать защиту, ответ или оправдательную речь. «Защита» сохраняет основной судебно-апологетический оттенок и остаётся понятной современному читателю.
theological_decisions:
- issue: Характер самоотождествления говорящей с ⲁⲡⲟⲗⲟⲅⲓⲁ
  choice: Я — защита
  alternative: Я — ответ / оправдание
  rationale: Не уточняется, кого или что говорящая защищает и в каком именно смысле. Краткая именная формула сохраняет открытость образа и характерный для произведения ряд парадоксальных самоопределений.
translation_notes:
  register: Современный литературный русский с торжественной, но прозрачной интонацией. Повтор «слышите / не услышали» и краткая формула «Я — защита» сохранены ради ритма и парадоксальности оригинала; лакуна обозначена явно и не восполнена догадкой.
