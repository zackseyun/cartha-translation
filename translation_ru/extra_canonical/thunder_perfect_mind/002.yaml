base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/002.yaml
  text: 'Consider me[1], and I found myself among those who seek me,

    you who watch for me—you yourselves;[3]

    and you hearers, listen to me.

    You who are troubled in heart, receive me to yourselves[d][c][b][a][4][3][2],

    and do not turn away from me.[4]'
translation:
  language: ru
  text: '**2.** Думайте обо мне — и я нашла себя среди тех, кто ищет меня.[a]


    Вы, бодрствующие в ожидании меня, — вы сами;


    и вы, слушающие, слушайте меня.


    Вы, чьи сердца смятены, примите меня к себе


    и не бегите от меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В рукописном чтении, отражённом OCR, стоит форма первого лица: «и я нашла себя среди тех, кто ищет меня». Из-за последовательности повелений и сочетания с «теми, кто ищет меня» возможна поправка или иное понимание: «и найдите меня среди тех, кто ищет меня».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  choice: Думайте обо мне
  rationale: Императив передаёт прямой призыв; «думайте» естественно выражает диапазон значений «думать, размышлять, принимать во внимание», не придавая фразе искусственно религиозного оттенка.
- source_word: ⲁⲓϭⲓⲛⲉ ⲙⲙⲟⲓ
  choice: я оказалась
  rationale: Передаёт засвидетельствованную в OCR форму перфекта первого лица «я нашла себя / оказалась», но избегает русского оборота «нашла себя», который мог бы ошибочно подразумевать психологическое самопознание. Альтернативное императивное прочтение отмечено в сноске.
- source_word: ⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲓ
  choice: тех, кто ищет меня
  rationale: Прямо передаёт причастно-относительную конструкцию и обычное значение «искать».
- source_word: ⲧⲉⲧⲛⲉⲣⲟⲉⲓⲥ ... ⲉⲣⲟⲓ
  choice: бодрствующие в ожидании меня
  rationale: ⲣⲟⲉⲓⲥ означает «бодрствовать, быть настороже, стеречь», а не «знать»; оборот с «в ожидании» естественно передаёт направленность действия на говорящую.
- source_word: ⲉⲧⲏⲩⲧⲛ
  choice: вы сами
  rationale: Сохранено эмфатическое самостоятельное местоимение и его риторическое усиление.
- source_word: ⲛⲣⲉϥⲥⲱⲧⲙ ... ⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: вы, слушающие, слушайте меня
  rationale: Агентивное существительное во множественном числе передано как обращение; повтор корня сохраняет настойчивую риторику оригинала.
- source_word: ⲛⲉⲧⲧⲟϣⲧ ⲉⲃⲟⲗ ϩⲏⲧ
  choice: чьи сердца смятены
  rationale: Естественный русский оборот сохраняет внутреннюю тревогу или смятение, выраженные сочетанием со словом «сердце».
- source_word: ϣⲟⲡⲧ ⲉⲣⲱⲧⲛ
  choice: примите меня к себе
  rationale: Форма распознана как императив от ϣⲱⲡ «принимать, брать» с объектным суффиксом первого лица, а не как призыв «будьте сильны».
- source_word: ⲙⲡⲣⲡⲱⲧ ⲛⲥⲱⲓ
  choice: не бегите от меня
  rationale: 'Сохранён конкретный образ отрицательного императива: ⲡⲱⲧ буквально означает «бежать, убегать».'
theological_decisions:
- issue: Род говорящей в форме прошедшего времени
  choice: 'женский род: «я оказалась»'
  alternative: избежать родовой маркировки посредством перестройки фразы
  rationale: Коптская форма первого лица сама по себе рода не обозначает, однако произведение последовательно представляет говорящий голос как женский; русский литературный синтаксис требует выбора рода в прошедшем времени. Это грамматическое решение, а не внесение конфессионального толкования.
translation_notes:
  register: Современный литературный русский с достоинством оракульной речи. Сохранены прямые обращения, повторы и парадоксальная смена между повелением и утверждением; синтаксис слегка упорядочен для ясного чтения без устранения текстовой неоднозначности.
