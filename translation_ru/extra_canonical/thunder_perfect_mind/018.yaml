base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/018.yaml
  text: '[...] and the one who boasts brings these to me[a]. I am the silence that is incomprehensible, and the thought whose remembrance is great. I am the voice whose sound is manifold[f][e][d][c][b], and the word that is multiple.'
translation:
  language: ru
  text: '**13.** […] и тот, кто хвалится этим, приносит мне всё это.[a]


    Я — безмолвие, которое невозможно постичь,


    и мысль, память о которой велика.[b]


    Я — голос, звучание которого многообразно,[c]


    и слово, которое многообразно.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начало строки сохранилось или распознано неуверенно; многоточие отмечает отсутствующий предшествующий контекст. Местоимение в выражении «хвалится этим» не уточняет, к чему именно относится «этим»; оборот также можно понять как «приносит всё это для меня».
    reason: textual_uncertainty
  - marker: b
    text: 'Буквально возможно также: «мысль, чьё воспоминание велико»; необычная формулировка оригинала допускает более одного понимания связи между мыслью и памятью.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «голос, чьи звуки многочисленны»; речь может идти как о множестве звуков, так и об их многообразии.'
    reason: lexical_alternative
  - marker: d
    text: В оригинале стоит греческое заимствование λόγος. Конец фразы в предоставленном отрывке обрывается, поэтому «многообразно» опирается на сохранившееся указание на множественность и на продолжение, засвидетельствованное в выверенном тексте.
    reason: source_truncation
lexical_decisions:
- source_word: ⲡⲉⲧϣⲟⲩⲟⲩϣⲟⲩ ⲙⲙⲟϥ
  choice: тот, кто хвалится собой
  rationale: Возвратная конструкция с интенсивной формой глагола естественно передаёт самовосхваление; это лучше соответствует коптскому, чем прежнее «тот, кто кричит».
- source_word: ⲡⲕⲁⲣⲱϥ
  choice: безмолвие
  rationale: Форма разбирается как выражение со значением «молчать, хранить безмолвие», а не как «потомок»; абстрактное «безмолвие» сохраняет парадоксальный ряд самоопределений.
- source_word: ⲉⲧⲉⲙⲁⲩⲧⲁϩⲟϥ
  choice: которое невозможно постичь
  rationale: ⲧⲁϩⲟ имеет значения «достигать, схватывать»; в отношении безмолвия русское «постичь» естественно объединяет образы недостижимости и непостижимости.
- source_word: ⲧⲉⲡⲓⲛⲟⲓⲁ
  choice: мысль
  rationale: Это греческое заимствование ἐπίνοια; «мысль» — ясный современный эквивалент без внесения специального доктринального смысла.
- source_word: ⲉⲧⲉⲛⲁϣⲉ ⲡⲉⲥⲣⲡⲙⲉⲉⲩⲉ
  choice: память о которой велика
  rationale: Передаёт ⲛⲁϣⲉ «велика» и конструкцию ⲣ-ⲡ-ⲙⲉⲉⲩⲉ «помнить, вспоминать», сохраняя необычность исходного выражения.
- source_word: ⲧⲉⲥⲙⲏ
  choice: голос
  rationale: Коптское ⲥⲙⲏ обозначает голос или звук; в данном параллелизме «голос» наиболее естественен.
- source_word: ⲉⲧⲉⲛⲁϣⲱⲥ ϩⲣⲟⲟⲩ
  choice: у которого много звучаний
  rationale: Передаёт множественность звука без искусственного уточнения, идёт ли речь о тонах, голосах или отзвуках.
- source_word: ⲡⲗⲟⲅⲟⲥ
  choice: слово
  rationale: Греческое λόγος передано обычным русским соответствием; строчная буква не навязывает христологического отождествления, которого сам фрагмент однозначно не устанавливает.
- source_word: ⲉⲧⲉ ⲛⲁϣⲉ
  choice: которое многообразно
  rationale: Сохраняет идею множественности в оборванном конце отрывка и создаёт естественную русскую параллель к множеству звучаний.
theological_decisions:
- issue: Следует ли писать «Слово» с прописной буквы как богословский титул?
  choice: слово
  alternative: Слово
  rationale: Хотя ⲗⲟⲅⲟⲥ может иметь возвышенные и богословские оттенки, данный контекст не требует отождествления говорящей с Логосом определённой традиции. Строчная буква сохраняет смысловую открытость.
- issue: Как понимать непостижимость безмолвия?
  choice: невозможно постичь
  alternative: невозможно достичь
  rationale: «Постичь» естественно для абстрактного безмолвия, но также сохраняет семантическую связь со «схватить/достичь»; перевод не объясняет причину непостижимости и сохраняет парадокс.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. Повтор «Я —» и параллельные именные формулы сохранены как основа ритма. Необычные сочетания «память… велика» и «много звучаний» намеренно не сглажены полностью, чтобы удержать парадоксальность и смысловую напряжённость коптского текста.
