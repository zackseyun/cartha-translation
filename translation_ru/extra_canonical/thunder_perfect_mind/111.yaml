  yaml_path: translation/extra_canonical/thunder_perfect_mind/111.yaml
  text: 'to him who created me[a].

    I am the one who will cry out his name.

    Look then at his words,

    and all the writings that have been completed.

    Listen therefore, you hearers,

    and you yourselves also[c][b], the angels'
translation:
  language: ru
  text: 'тому, кто сотворил меня.


    Я — та, что возгласит его имя.


    Итак, посмотрите на его слова


    и на все писания, которые были завершены.


    Итак, слушайте, слушатели,


    а также вы, все ангелы…[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Последнее слово и фраза далее обрываются в предоставленной выдержке; «ангелы» — наиболее вероятное восстановление начала ⲛ̄ⲁⲅⲅⲉ…. Синтаксическая связь финального обращения с последующим утраченным текстом остаётся неопределённой.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲡⲉⲛⲧⲁϥⲧⲁⲙⲓⲟⲓ
  choice: кто сотворил меня
  rationale: Относительная конструкция с ⲧⲁⲙⲓⲟ передаёт действие создания; начальная фраза синтаксически продолжает предшествующий контекст.
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: Я — та
  rationale: Копульная формула подчёркивает самоотождествление говорящей; женский род согласован с женским голосом произведения, тогда как коптская форма сама по себе рода здесь не выражает.
- source_word: ⲧⲛⲁⲭⲱ ⲙ̄ⲡⲉϥⲣⲁⲛ ⲉⲃⲟⲗ
  choice: что возгласит его имя
  rationale: Будущая форма и выражение с ⲉⲃⲟⲗ указывают на открытое произнесение или провозглашение имени; «возгласит» сохраняет возвышенный поэтический регистр.
- source_word: ϣⲁϫⲉ
  choice: слова
  rationale: В данном повелительном контексте речь идёт о словах названного лица; множественное число соответствует восстановленному чтению контекста и естественно по-русски.
- source_word: ⲛⲉⲥϩⲁⲓ (вероятное чтение вместо OCR ⲛⲉⲥⲙⲏ)
  choice: писания
  rationale: По исправленному чтению это «написанное, писания», а не «голоса/слух»; выбор учитывает повреждённый OCR и последовательность «слова — писания».
- source_word: ⲛⲁⲕⲣⲟⲁⲧⲏⲥ
  choice: слушатели
  rationale: Греческое заимствование ἀκροατής прямо обозначает слушателей и поддерживает повеление «слушайте».
- source_word: ⲛ̄ⲁⲅⲅⲉ…
  choice: ангелы
  rationale: Оборванное в выдержке слово естественно восстанавливается как «ангелы»; незавершённость отрывка отмечена многоточием и сноской.
theological_decisions:
- issue: Род самоназвания говорящей
  choice: 'женский род: «Я — та»'
  alternative: нейтральное «Я — тот, кто» или просто «Я возглашу»
  rationale: В произведении говорит персонифицированный женский голос; женский род сохраняет литературную идентичность говорящей, не добавляя конфессионального толкования.
- issue: Референт местоимения «его»
  choice: сохранить «его» без отождествления
  alternative: назвать Бога, Творца или иное лицо
  rationale: Источник не определяет здесь референта однозначно; конкретизация устранила бы подлинную контекстуальную неопределённость.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим ритмом. Повтор «Итак» сохраняет последовательность коптских частиц ϭⲉ. Отрывок начинается и заканчивается внутри предложения, что отражено строчной начальной буквой и многоточием.
