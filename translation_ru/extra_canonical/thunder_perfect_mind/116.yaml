  naturalness: Фраза «вы, кто повинуется» грамматически возможна, но в современном литературном русском звучит тяжеловесно и тавтологично рядом с «Будьте послушны».
  terminology: «Послушны» допустимо лишь как выбранное, но спорное истолкование ⲟⲩⲁⲁⲧ. Сноска корректно отмечает альтернативу, однако «одни» неточно передаёт возможное качественное значение «одинокие/уединённые».
