    rationale: Сам источник предупреждает, что сопоставление сделано по краю страницы и имеет низкую уверенность. OCR после начальных слов содержит иной синтаксический материал; его нельзя одновременно считать смежным и использовать для обоснования перевода.
  - severity: medium
