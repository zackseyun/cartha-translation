base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/045.yaml
  text: 'Greeks and barbarians[a],

    I am the one whose image is great in Egypt,

    and the one who has no image among the barbarians.

    I am she whom they hated in every place[d][c][b],

    and she whom they loved.'
translation:
  language: ru
  text: '**10.** Эллины и варвары[a],


    Я — та, чей образ велик[b] в Египте,


    и та, у которой нет образа среди варваров.


    Я — та, которую ненавидели повсюду[c],


    и та, которую любили.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Варвары» — историческое обозначение народов, не говоривших по-гречески; здесь оно образует традиционную пару с «эллинами», а не служит современной оценкой их культуры.
    reason: historical_term
  - marker: b
    text: 'Коптское выражение можно понимать как «чей образ велик» или как указание на множественность: «чьи образы многочисленны».'
    reason: lexical_ambiguity
  - marker: c
    text: 'Буквально: «в каждом месте». Чтение «ненавидели» поддерживается противопоставлением следующему «любили»; написание исходного слова допускает некоторую текстовую неуверенность.'
    reason: alternative_reading
lexical_decisions:
- source_word: ⲉⲗⲗⲏⲛ ⲙⲛ ⲛⲃⲁⲣⲃⲁⲣⲟⲥ
  choice: эллины и варвары
  rationale: Сохраняется традиционная греко-коптская антитеза между эллинами и неэллинами; «эллины» точнее исторически и стилистически, чем современные «греки».
- source_word: ⲧⲉⲧⲛⲁϣⲉ ⲡⲉⲥⲉⲓⲛⲉ
  choice: та, чей образ велик
  rationale: ⲉⲓⲛⲉ означает «образ, подобие», а ⲛⲁϣⲉ передаёт величину или множественность. Основной текст следует наиболее естественному русскому соответствию, а смысловая неоднозначность отмечена в сноске.
- source_word: ϩⲛ ⲕⲏⲙⲉ
  choice: в Египте
  rationale: Передаёт географическое название ⲕⲏⲙⲉ ясным современным русским эквивалентом.
- source_word: ⲧⲉⲧⲉ ⲙⲛⲧⲉⲥ ⲉⲓⲛⲉ
  choice: та, у которой нет образа
  rationale: Конструкция содержит отрицательное обладание («у неё нет») и существительное ⲉⲓⲛⲉ «образ», а не морфологическое отрицание слова «молчание».
- source_word: ⲛⲧⲁⲩⲙⲉⲥⲧⲱⲥ
  choice: которую ненавидели
  rationale: Контраст с последующим «любили» поддерживает значение «ненавидели»; женский объект явно выражен в русском для сохранения голоса произведения.
- source_word: ϩⲛ ⲙⲁ ⲛⲓⲙ
  choice: повсюду
  rationale: Естественно передаёт идиому «в каждом месте» и относится к глаголу «ненавидели».
- source_word: ⲛⲧⲁⲩⲙⲉⲣⲓⲧⲥ
  choice: которую любили
  rationale: Сохраняет прямую антитезу «ненавидели — любили» и женский объект исходной формы.
theological_decisions:
- issue: Парадокс наличия великого образа в Египте и отсутствия образа среди варваров
  choice: Сохранить обе формулы рядом без объяснения личности говорящей и без богословского истолкования слова «образ».
  alternative: Истолковать «образ» как культовое изображение, проявление божества или духовное подобие.
  rationale: Источник намеренно строит загадочное самоописание; конкретизация устранила бы подлинную смысловую напряжённость и внесла бы внешнюю доктрину.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим ритмом. Повтор «Я — та» сохраняет анафорическую структуру и женский голос. Историзм «эллины» выбран ради достоинства и соответствия античному контексту; потенциально резкое «варвары» снабжено пояснением.
