base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/050.yaml
  text: '...outwardly[a], and you knew me inwardly. I am she before whom you were ashamed, and you were shameless. I, I am godless, and I am the virgin[b], her God.'
translation:
  language: ru
  text: '…снаружи[a], и вы узнали меня изнутри.

    Я — та, которой вы стыдились,

    и со мной вы были бесстыдны.

    Я — та, кто не празднует,

    и та, у которой много празднеств.[b]

    Я, я — безбожная,

    и я — та, чей Бог велик.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начало отрывка обрезано, поэтому перевод начинается с многоточия. Кроме того, привязка этого OCR-фрагмента к сегменту 050 лишь приблизительна: предоставленный коптский текст не содержит ожидаемой пары «ненавидят повсюду / любят повсюду».'
    reason: alignment_note
  - marker: b
    text: 'Строка сильно искажена распознаванием текста. Перевод следует принятому восстановлению параллели: «та, кто не празднует, / та, у которой много празднеств».'
    reason: textual_uncertainty
  - marker: c
    text: Конец строки в OCR неполон или искажён; «велик» восстановлено по известному чтению этого места. Буквально предшествующая формула означает «я — безбожная», а следующая — «я — та, чей Бог велик».
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲉⲃⲟⲗ / ϩⲧⲉϩⲟⲩⲛ
  choice: снаружи / изнутри
  rationale: Передаёт пространственную антитезу внешнего и внутреннего; начало первой фразы утрачено или искажено в OCR, поэтому сохранено начальное многоточие.
- source_word: ⲁⲧⲉⲧⲛⲥⲟⲟⲩⲛ
  choice: вы узнали
  rationale: Перфектная форма второго лица множественного числа передана завершённым действием; объект «меня» восстановлен по синтаксису и засвидетельствованному тексту этого места.
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Я — та
  rationale: Сохраняет женский род говорящей и повторяющуюся формулу самоотождествления.
- source_word: ϣⲓⲡⲉ
  choice: стыдились
  rationale: Нейтрально и прямо передаёт мотив стыда, не уточняя без достаточных оснований, был ли это стыд «за неё» или стыд перед ней.
- source_word: ⲣⲁⲧϣⲓⲡⲉ
  choice: были бесстыдны
  rationale: Сохраняет резкую словесную антитезу «стыдились / были бесстыдны».
- source_word: ⲟⲩⲁⲧⲛⲟⲩⲧⲉ
  choice: безбожная
  rationale: Привативное ⲁⲧ- при ⲛⲟⲩⲧⲉ означает отсутствие Бога или благочестия; «безбожная» сохраняет провокационный парадокс с последующей строкой о её Боге.
- source_word: ⲡⲉⲥⲛⲟⲩⲧⲉ
  choice: её Бог / чей Бог
  rationale: Притяжательная форма третьего лица женского рода естественно передана относительным оборотом «та, чей Бог…».
theological_decisions:
- issue: Парадокс между «безбожная» и упоминанием её Бога
  choice: Сохранить обе формулы буквально и не примирять их толкованием
  alternative: Передать ⲟⲩⲁⲧⲛⲟⲩⲧⲉ как «нечестивая» или объяснить разные значения слова «Бог»
  rationale: Поэма намеренно строится на напряжённых самопротивопоставлениях; поясняющая гармонизация внесла бы отсутствующую в источнике доктрину.
- issue: Адресат стыда в ϣⲓⲡⲉ ϩⲏⲧⲥ
  choice: «которой вы стыдились»
  alternative: «перед которой вы стыдились» или «за которую вам было стыдно»
  rationale: Русская формулировка сохраняет возможную направленность стыда на говорящую, не делая однозначным, стыдились ли её или испытывали стыд в её присутствии.
- issue: Неясная праздничная строка в OCR
  choice: Восстановить засвидетельствованную антитезу «не празднует / много празднеств» с примечанием
  alternative: Опустить строку либо следовать ошибочному чтению OCR
  rationale: OCR здесь явно искажён, однако последовательность и параллелизм известного коптского текста поддерживают праздничную антитезу; читателю открыто сообщается о состоянии свидетельства.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным ритмом. Повторы «Я — та» и «Я, я» сохранены как композиционный приём; парадоксы не сглажены. Местоимения обращения оставлены со строчной буквы как множественное число, а «Бог» написано с прописной в соответствии с прямым обозначением божества, без конфессионального уточнения.
