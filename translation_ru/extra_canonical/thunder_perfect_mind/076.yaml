lexical_decisions:
- source_word: ⲧⲉⲧⲟⲩⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲙⲙⲟⲥ
  choice: та, которую они презирают
  rationale: Женская относительная конструкция сохранена в соответствии с женским голосом речи; греческое заимствование передано обычным русским глаголом «презирать».
- source_word: ϩⲛ ⲟⲩϣⲱϣ
  choice: осыпая насмешками
  rationale: Передаёт сопутствующее выражение презрения естественным русским оборотом, не превращая его в отдельное самостоятельное утверждение.
- source_word: ⲁⲛⲟⲕ ⲧⲉ ϯⲣⲏⲛⲏ
  choice: Я — мир
  rationale: Сохраняет повторяющуюся формулу самоотождествления и прямой парадоксический контраст с войной.
- source_word: ⲡⲡⲟⲗⲉⲙⲟⲥ
  choice: война
  rationale: Прямое и контекстуально точное соответствие греческому заимствованию πόλεμος.
- source_word: ϣⲱⲡⲉ ⲉⲧⲃⲏⲏⲧ
  choice: из-за меня возникла
  rationale: Сохраняет явную причинную связь и значение появления или возникновения, выраженное глаголом ϣⲱⲡⲉ.
- source_word: ⲁⲩⲱ
  choice: и
  rationale: Передано как обычный соединительный союз; в данном месте источник не требует противительного «но».
theological_decisions:
- issue: Парадокс между миром и возникновением войны
  choice: 'Сохранена прямая причинная формулировка: «из-за меня возникла война».'
  alternative: «вокруг меня началась война» или иное смягчение причинности
  rationale: Источник прямо использует причинный предлог ⲉⲧⲃⲏⲏⲧ; богословское напряжение нельзя устранять поясняющим перефразированием.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Начальное «и» сохранено, поскольку фрагмент продолжает предшествующее перечисление. Женский род относительной конструкции передаёт грамматику коптского текста.
