  register: Современный литературный русский с торжественным, ритмичным синтаксисом. Краткие параллельные строки сохраняют литанийный характер и резкие парадоксы оригинала. «Дерзновение» выбрано как понятное, но возвышенное слово; архаические синтаксические обороты и конфессиональная терминология не вводились.
