base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/025.yaml
  text: 'The shame and the boldness[a].

    I am shameless; I am ashamed.

    I am hard, and I am trembling.

    I am the war and the peace; within me they are.

    I am she[g][f][e][d][c][b]; heed me.'
translation:
  language: ru
  text: 'Стыд и дерзновение[a].


    Я бесстыдна; я стыжусь[b].


    Я тверда — и я трепещу[c].


    Я — война и мир.


    Внимайте мне[d].


    Я — опозоренная[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое заимствование ⲡⲁⲣⲣⲏⲥⲓⲁ означает также «открытая речь», «прямота» или «смелость говорить».
    reason: lexical_alternative
  - marker: b
    text: Переданная OCR форма ⲟⲩϫⲓⲡⲏⲧ ненадёжна; по контексту и принятому восстановлению здесь читается утверждение «я стыжусь», противопоставленное «я бесстыдна».
    reason: textual_uncertainty
  - marker: c
    text: Буквально возможен диапазон «я сильна (или сурова), и я — трепет (или страх)». OCR второго выражения повреждён; перевод передаёт наиболее вероятную антитезу.
    reason: textual_uncertainty
  - marker: d
    text: OCR ошибочно сливает слова. Вероятное чтение ⲧⲓ ϩⲧⲏⲧⲛ ⲉⲣⲟⲉⲓ — идиоматический призыв «обратите на меня внимание», буквально близкий к «отдайте мне ваше сердце».
    reason: alignment_note
  - marker: e
    text: Последнее слово в OCR ненадёжно. Здесь принято чтение со значением «подвергшаяся позору, опозоренная»; следующее парное определение, известное по более полному тексту, не добавлено, поскольку оно находится за границей данного отрывка.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲡϣⲓⲡⲉ
  choice: стыд
  rationale: Сахидское ϣⲓⲡⲉ означает «стыд», что подтверждается последующим privativum ⲁⲧϣⲓⲡⲉ «бесстыдна»; перевод «молчание» здесь ошибочен.
- source_word: ⲧⲡⲁⲣⲣⲏⲥⲓⲁ
  choice: дерзновение
  rationale: Греческое заимствование παρρησία обозначает открытость и смелость речи. «Дерзновение» сохраняет возвышенный регистр и противопоставление стыду, не сводя смысл только к разговорной «смелости».
- source_word: ⲟⲩⲁⲧϣⲓⲡⲉ
  choice: бесстыдна
  rationale: Привативная приставка ⲁⲧ- с ϣⲓⲡⲉ буквально выражает отсутствие стыда. Женская форма согласована с женским голосом и последующим ⲁⲛⲟⲕ ⲧⲉ.
- source_word: ⲟⲩϫⲓⲡⲏⲧ
  choice: я стыжусь
  rationale: OCR-форма, вероятно, искажает чтение со значением «стыдиться» и образует намеренный парадокс с ⲁⲧϣⲓⲡⲉ. Глагольная русская формулировка естественно передаёт это состояние.
- source_word: ⲟⲩⲛⲁϣⲧⲉ
  choice: тверда
  rationale: ⲛⲁϣⲧⲉ имеет смысловой диапазон «твёрдый, сильный, суровый». «Тверда» сохраняет предикативный характер и контраст с трепетом.
- source_word: ⲟⲩⲣⲙⲧⲉ
  choice: я трепещу
  rationale: OCR, по-видимому, искажает форму со значением трепета или страха. Перевод сохраняет парадокс силы и дрожи, не превращая его в объяснение.
- source_word: ⲡⲓⲡⲟⲗⲉⲙⲟⲥ
  choice: война
  rationale: Прямое соответствие греческому заимствованию πόλεμος и естественная антитеза миру.
- source_word: ϯⲣⲏⲛⲏ
  choice: мир
  rationale: Прямое соответствие греческому заимствованию εἰρήνη; в данном контексте означает мир как противоположность войне.
- source_word: ⲧⲓ ϩⲧⲏⲧⲛ ⲉⲣⲟⲉⲓ
  choice: Внимайте мне
  rationale: При восстановлении границ слов OCR-последовательность передаёт идиому «обратите ко мне сердце/внимание», а не утверждение «они внутри меня».
- source_word: ⲧⲣⲁⲉⲓⲏⲟⲩ
  choice: униженная
  rationale: Форма понимается как обозначение той, которая подверглась бесчестью или унижению. Сохраняется самостоятельное утверждение, видимое в данном отрывке, без добавления продолжения за его пределами.
theological_decisions:
- issue: Парадоксальные самоотождествления говорящей
  choice: 'Сохранить несовместимые на первый взгляд утверждения без гармонизации: бесстыдна/стыжусь, тверда/трепещу, война/мир.'
  alternative: Истолковать пары как последовательные состояния, разные роли или метафоры.
  rationale: Источник намеренно строит речь на неразрешённых антитезах; поясняющая гармонизация внесла бы в текст отсутствующее толкование.
- issue: Грамматический род голоса
  choice: Использовать женские формы «бесстыдна», «тверда», «униженная».
  alternative: Применить гендерно-нейтральные существительные или мужской род.
  rationale: Коптское ⲁⲛⲟⲕ ⲧⲉ в заключительной строке прямо маркирует говорящую как женское лицо, а женский голос характерен для всего произведения.
