base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/015.yaml
  text: My father[a], and the sister of my husband—and he is my offspring. I am the servant of my husband[e][d][c][b], and I am the Lady.
translation:
  language: ru
  text: '…моего отца и сестра моего мужа; а он — моё дитя.[a]

    Я — служанка моего мужа, и я — госпожа.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «моё порождение» или «моё потомство». Начало данного отрывка продолжает фразу, начатую в предшествующей строке рукописи.'
    reason: Фиксирует лексическую широту ⲡⲁϫⲡⲟ и фрагментарность начала предоставленного отрывка.
  - marker: b
    text: 'Возможный более сильный перевод: «Я — рабыня моего мужа, и я — владычица». Коптский текст намеренно противопоставляет зависимое и властное положение.'
    reason: Сохраняет диапазон значений ϩⲙϩⲁⲗ и ϫⲟⲉⲓⲥ, не перегружая основной текст.
lexical_decisions:
- source_word: ⲡⲁⲉⲓⲱⲧ
  choice: моего отца
  rationale: Форма означает «мой отец», но в данном отрывке она, по-видимому, завершает начатую ранее именную конструкцию; родительный падеж сохраняет видимую синтаксическую связь с утраченным здесь началом.
- source_word: ⲧⲥⲱⲛⲉ ⲙⲡⲁϩⲁⲓ
  choice: сестра моего мужа
  rationale: ⲥⲱⲛⲉ означает «сестра», а ⲙⲡⲁϩⲁⲓ — «моего мужа»; гендерные отношения сохранены явно.
- source_word: ⲛⲧⲟϥ ⲡⲉ ⲡⲁϫⲡⲟ
  choice: а он — моё дитя
  rationale: ⲛⲧⲟϥ ⲡⲉ — «он есть», а ⲡⲁϫⲡⲟ обозначает моё порождение или потомство. «Дитя» естественно передаёт конкретное лицо и сохраняет парадокс родства.
- source_word: ⲧϩⲙϩⲁⲗ
  choice: служанка
  rationale: ϩⲙϩⲁⲗ означает слугу или раба; женский артикль требует женской формы. «Служанка» сохраняет противопоставление госпоже без излишнего усиления до «рабыни».
- source_word: ⲧϫⲟⲉⲓⲥ
  choice: госпожа
  rationale: Женская форма соответствующего слова со значением «господин, владыка»; «госпожа» естественно противопоставлена «служанке» и не вносит брачной семантики.
theological_decisions:
- issue: Парадокс подчинения и власти
  choice: «служанка… госпожа»
  alternative: «рабыня… владычица»
  rationale: Выбрана нейтральная и современная пара, точно сохраняющая внутреннее противопоставление, но не усиливающая социально-богословские оттенки сверх коптского текста.
- issue: Отношение мужа к говорящей
  choice: «моё дитя»
  alternative: «моё потомство»
  rationale: Текст утверждает обратное родственное отношение — муж является её порождением. Формулировка сохраняет парадокс и не превращает существительное в обозначение того, кто породил её.
translation_notes:
  register: Современный литературный русский с торжественной ритмикой повторяемого «я —». Многоточие в начале честно отмечает, что предоставленный коптский фрагмент начинается внутри синтаксической конструкции. Родственные и гендерные обозначения переданы прямо; парадоксы не сглажены.
