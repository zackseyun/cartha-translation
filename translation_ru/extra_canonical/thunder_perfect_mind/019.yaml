base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/019.yaml
  text: I am the voice whose sound is manifold[a], and the word whose appearance is manifold. I am the utterance of my name. Why, you who hate me, do you love me[g][f][e][d][c][b], and hate those who love me?
translation:
  language: ru
  text: '**14.** Я — голос, чьё звучание многообразно, и Слово, чей облик многообразен. Я — изречение моего имени.[a] Почему вы, ненавидящие меня, любите меня и ненавидите тех, кто любит меня?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальный фрагмент OCR перед словами «Я — голос» повреждён и, по-видимому, представляет собой остаток предыдущей строки; в основной текст этого отрывка он не включён.
    reason: textual_note
lexical_decisions:
- source_word: ⲧⲉⲥⲙⲏ
  choice: голос
  rationale: Обычное значение коптского ⲥⲙⲏ; согласуется с последующим упоминанием звучания.
- source_word: ⲉⲧⲉⲛⲁϣⲱⲥ ϩⲣⲟⲟⲩ
  choice: чьё звучание многообразно
  rationale: Передаёт множественность или многообразие звука естественным русским оборотом, не превращая ϩⲣⲟⲟⲩ в указание на возраст или время суток.
- source_word: ⲡⲗⲟⲅⲟⲥ
  choice: Слово
  rationale: Передаёт греческое заимствование λόγος привычным русским соответствием и сохраняет его философско-богословский оттенок.
- source_word: ⲉⲧⲉ ⲛⲁϣⲉ ⲡⲉϥⲉⲓⲛⲉ
  choice: чей облик многообразен
  rationale: ⲉⲓⲛⲉ здесь означает вид или облик, а конструкция указывает на его множественность, не на волю или желание.
- source_word: ⲡϣⲁϫⲉ ⲙ̄ⲡⲁⲣⲁⲛ
  choice: изречение моего имени
  rationale: «Изречение» отличает ⲡϣⲁϫⲉ от предшествующего ⲡⲗⲟⲅⲟⲥ и сохраняет связь речи с именем.
- source_word: ⲉⲧⲃⲉ ⲟⲩ
  choice: почему
  rationale: Это вопросительное сочетание вводит парадоксальный вопрос, а не причинный оборот «из-за».
- source_word: ⲙⲟⲥⲧⲉ / ⲙⲉ
  choice: ненавидеть / любить
  rationale: Прямые соответствия сохраняют резкую риторическую антитезу исходного текста.
theological_decisions:
- issue: Передача ⲡⲗⲟⲅⲟⲥ
  choice: Слово
  alternative: Логос
  rationale: «Слово» понятно современному читателю и сохраняет традиционный широкий смысл; транслитерация «Логос» могла бы преждевременно навязать более узкое философское прочтение.
- issue: Парадокс любви и ненависти
  choice: Сохранён без пояснительного сглаживания
  alternative: Истолковать любовь как желание или признание
  rationale: Текст намеренно сталкивает любовь и ненависть; перевод не разрешает это богословское и риторическое напряжение.
translation_notes:
  register: Современный литературный русский с торжественным, афористическим ритмом. Параллелизм «голос — Слово — изречение» и заключительная антитеза сохранены; архаизация ограничена словом «изречение», выбранным ради смыслового различения речевых терминов.
