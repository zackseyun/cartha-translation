base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/051.yaml
  text: 'And I am she whose festivals are many[a]. I, I am a godless one,

    and I am she whose God is great.

    I am the one you have pondered,

    and you have scorned me.

    I am an unlearned one[f][e][d][c][b],

    and they learn.'
translation:
  language: ru
  text: 'И я — та, у которой много праздников.[a]


    Я, я — без Бога,


    и я — та, чей Бог велик.[b]


    Я — та, о которой вы размышляли,


    и вы презрели меня.


    Я — неучёная,


    и они учатся.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начало строки дошло в данном OCR-извлечении в неясном виде. Перевод «та, у которой много праздников» отражает вероятное разделение и восстановление коптских слов; буквальное чтение распознанной последовательности ненадёжно.
    reason: textual_uncertainty
  - marker: b
    text: 'В OCR стоит слитная и, по-видимому, искажённая последовательность. Вероятное чтение даёт: «та, чей Бог велик». Без восстановления видимый текст можно было бы понять иначе, поэтому неопределённость отмечена явно.'
    reason: textual_uncertainty
  - marker: c
    text: Выражение ϫⲓⲥⲃⲱ ⲉⲃⲟⲗ буквально связано с «получением учения»; здесь оно идиоматически передано словом «учатся». В приведённом отрывке не сказано прямо «учатся у меня».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲟⲩⲁⲧⲛⲟⲩⲧⲉ
  choice: без Бога
  rationale: Привативное ⲁⲧ- с ⲛⲟⲩⲧⲉ буквально обозначает отсутствие Бога. «Без Бога» сохраняет парадокс со следующей строкой и не привносит современных философских ассоциаций слова «атеистка» или нравственно-осуждающего оттенка слова «безбожница».
- source_word: ⲧⲉ ⲛⲁϣⲉ ⲡⲉⲥⲛⲟⲩⲧⲉ (предполагаемое чтение за OCR ⲧⲉⲛϣⲉ ⲡⲉⲥⲛⲟⲩⲧⲉ)
  choice: та, чей Бог велик
  rationale: Чтение как относительной конструкции «та, чей Бог велик» даёт грамматически и риторически связную антитезу к «без Бога». Формулировка сохраняет женский голос и не отождествляет говорящую с Богом.
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  choice: о которой вы размышляли
  rationale: ⲙⲉⲉⲩⲉ означает думать или размышлять, а ⲉⲣⲟⲓ — «обо мне». Русская относительная конструкция естественно передаёт коптское возобновляющее местоимение.
- source_word: ϣⲟⲥⲧ
  choice: презрели
  rationale: Глагол означает презирать, отвергать или относиться с пренебрежением. Перфектный префикс ⲁ-ⲧⲉⲧⲛ- передан прошедшим временем множественного числа; дополнение «меня» восстановлено из непосредственного контекста.
- source_word: ⲁⲧⲥⲃⲱ
  choice: неучёная
  rationale: Привативное ⲁⲧ- плюс ⲥⲃⲱ «учение, обучение» образует «необученная, неучёная». Выбор сохраняет словесную связь со следующим «учатся».
- source_word: ϫⲓⲥⲃⲱ ⲉⲃⲟⲗ
  choice: учатся
  rationale: Сочетание буквально связано с «получением учения» и идиоматически означает «учиться». Частица ⲉⲃⲟⲗ отдельно не выражена, поскольку здесь она завершает или усиливает глагольное значение.
theological_decisions:
- issue: Парадокс «без Бога / чей Бог велик»
  choice: Сохранить обе формулы без согласования или догматического объяснения
  alternative: Истолковать первую как «безбожница» в нравственном смысле либо вторую как прямое самоотождествление с Богом
  rationale: Текст намеренно строится на противоречивых самоопределениях. Перевод не должен заранее устранять напряжение или вводить конфессиональное толкование.
- issue: Регистр слова ⲛⲟⲩⲧⲉ
  choice: «Бог» с прописной буквы в обеих соотнесённых формулах
  alternative: «бог» со строчной буквы
  rationale: Контекст говорит о единственном Боге, принадлежащем говорящей, однако грамматика сама по себе не решает богословскую идентичность. Прописная буква соответствует русской издательской норме без дополнительного уточнения личности Бога.
translation_notes:
  register: Современный литературный русский с торжественным ритмом и параллелизмом исходной речи. Повтор «Я, я» сохранён как риторическое усиление. Женский род последовательно передаёт форму коптского местоименного сказуемого. Короткие строки удерживают антитетическую структуру; архаизмы и конфессиональная терминология не вводятся.
