translation:
  language: ru
  text: 'Я — та, что не соблюдает праздников[a],


    и я — та, чьи праздники многочисленны[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Праздник» можно также передать как «пир» или «празднество»; вероятно, здесь стоит греческое заимствование ἑορτή.
    reason: lexical_alternative
  - marker: b
