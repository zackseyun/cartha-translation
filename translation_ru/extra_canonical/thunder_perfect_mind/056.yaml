lexical_decisions:
- source_word: ⲙⲛⲧⲁⲧ(ⲉⲟⲣⲧⲏ)
  choice: не празднует ни одного праздника
  rationale: Предположительно, это сочетание отрицательно-привативного образования с греческим заимствованием ἑορτή («праздник»). Русское выражение естественно передаёт отсутствие участия в праздновании и сохраняет конкретный культовый смысл.
- source_word: ϩⲛ ⲟⲩ ⲕⲁϩ
  choice: множество
  rationale: Предварительно понимается как указание на многочисленность или изобилие. Слово «множество» сохраняет парадоксальный контраст с первым полустишием, не уточняя спорную степень количества.
- source_word: ⲁⲩⲱ
  choice: и
  rationale: Простой сочинительный союз, связывающий две парадоксально противопоставленные части.
- source_word: ⲡⲁⲓ … (относительная конструкция)
  choice: Я — та, что / Я — та, у которой
  rationale: Конструкция «Я — та» сохраняет женский род голоса и повторную формулу самообъявления; во второй строке оборот «у которой» звучит по-русски естественно при именном выражении множества праздников.
