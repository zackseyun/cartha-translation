  text: '**13.** Я — та, о которой вы размышляли,[a] но вы отвергли меня.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «положили [это] в своём сердце обо мне»; возможно также: «обдумывали меня», «обратили ко мне свои помыслы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «изгнали меня», «выбросили меня». Сочетание ⲧⲱⲡ ⲉⲃⲟⲗ нередко выражает удаление или изгнание.'
    reason: lexical_alternative
  - marker: c
    text: 'В распознанном фрагменте рукописи видны и дополнительные выражения — «из знания», «в местах под небом» и, возможно, «в суде». Из-за средней надёжности выравнивания они здесь не переведены: вероятно, они относятся к соседним строкам.'
    reason: alignment_note
lexical_decisions:
- source_word: ⲕⲁϩ ⲛϩⲏⲧ (с ϣⲟⲡ)
  choice: о которой вы размышляли
  rationale: Оборот обозначает намеренное внутреннее обдумывание. «Размышляли» естественно звучит по-русски и сохраняет смысл сосредоточенной мысли; буквальный образ сердца вынесен в примечание.
- source_word: ϩⲏⲧ
  choice: внутренняя мысль; в примечании — «сердце»
  rationale: В саидском коптском слово может обозначать средоточие как мысли, так и намерения. Основной текст передаёт когнитивный оттенок, а примечание сохраняет исходный образ.
- source_word: ⲧⲱⲡ ⲉⲃⲟⲗ
  choice: отвергли
  rationale: Сочетание может означать изгнание или выбрасывание. В данном противопоставлении «размышляли — отвергли» глагол «отвергли» передаёт и личное неприятие, и активную силу действия.
theological_decisions:
- issue: Род говорящей
  choice: та
  alternative: тот / безродовая перестройка
  rationale: В произведении речь ведёт женский голос, поэтому русское «та» сохраняет явное самоуказание говорящей и согласуется с ближайшим литературным контекстом, не добавляя доктринального толкования.
- issue: Связь между частями высказывания
  choice: но
  alternative: и
  rationale: Коптский союз допускает простое присоединение, однако здесь две части образуют явное смысловое противопоставление. «Но» естественно передаёт напряжение между размышлением о говорящей и её отвержением.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной формой самопровозглашения. Сохранены парадокс и напряжение между внутренним размышлением и последующим отвержением; неясности лексики и выравнивания отражены в примечаниях.
