  text: 'And do not make me known in another place or in another time. Do not make me known. Do not make me known in another place or in another time.

    For I am the one who has come to be, and the one who will come to be.

    I am Forbearance, and the one who will come to be.

    I am Forbearance, and the one who will come to be.

    I am Forbearance[f][e][d][c][b], and the one who will come to be.'
translation:
  language: ru
  text: 'И не будьте в неведении обо мне в другом месте или в другое время.[a] Не будьте в неведении обо мне. Не будьте в неведении обо мне в другом месте или в другое время.[b]


    Ибо Я — та, что возникла, и та, что возникнет.[c]


    Я — Снисхождение, и та, что возникнет.


    Я — Снисхождение, и та, что возникнет.


    Я — Снисхождение,[d] и та, что возникнет.[e]'
  philosophy: optimal-equivalence
  footnotes:
