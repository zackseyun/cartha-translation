lexical_decisions:
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: не оставайтесь в неведении обо мне
  rationale: ⲙⲡⲣ- выражает запрет, а ⲣ-ⲁⲧ-ⲥⲟⲟⲩⲛ буквально означает «быть без знания, не знать». Поэтому оборот передан как запрет пребывать в неведении, а не как «не делайте меня известной».
- source_word: ⲕⲉⲙⲁ
  choice: иное место
  rationale: Сочетание ⲕⲉ «другой, иной» и ⲙⲁ «место».
- source_word: ⲕⲉⲟⲩⲟⲉⲓϣ
  choice: иное время
  rationale: ⲟⲩⲟⲉⲓϣ здесь означает «время, пора»; чтение «толпа» лексически не соответствует данному слову.
- source_word: ϣⲱⲡⲉ
  choice: возникла / возникнет
  rationale: Глагол охватывает значения «случиться, стать, возникнуть, прийти к бытию». «Возникнуть» сохраняет бытийный оттенок и подходит как к завершённому, так и к будущему действию.
- source_word: ⲥⲩⲛⲅⲛⲱⲙⲏ
  choice: Снисхождение
  rationale: Греческое заимствование συγγνώμη может обозначать снисходительность, прощение, уступку, согласие или понимание. «Снисхождение» сохраняет смысл терпимой мягкости и необычность самоназвания.
theological_decisions:
- issue: Грамматический род самоназвания говорящей
  choice: «та, что возникла»
  alternative: «тот, кто возник»
  rationale: Хотя коптская относительная конструкция формально мужского рода, голос всего произведения представлен как женский, а ближайшее самоназвание допускает женское согласование в русском. Это решение относится к литературной связности, а не к догматическому истолкованию.
- issue: Онтологический оттенок ϣⲱⲡⲉ
  choice: «возникла / возникнет»
  alternative: «была / будет» или «стала / станет»
  rationale: Перевод не превращает формулу в утверждение о вечном существовании и не сводит её к простому событию; сохраняется напряжение между становлением и бытием.
translation_notes:
  register: Современный литературный русский с торжественным ритмом самопровозглашения. Заглавные буквы в «Я» и «Снисхождение» подчёркивают формульное самоназвание, не добавляя конфессиональной интерпретации. Синтаксические повторы сохранены, поскольку они присутствуют в предоставленном источнике, хотя OCR и выравнивание ненадёжны.
