translation:
  language: ru
  text: 'Я — та[a], что обретается в тех, кто боится[b],

    и я — сила[c] в трепете.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Женская форма «та» отражает устойчивый женский голос «Грома» во всём трактате; само коптское местоимение ⲁⲛⲟⲕ грамматического рода не выражает.
    reason: cultural_note
  - marker: b
    text: 'Коптская относительная конструкция указывает на людей — «тех, кто боится»; встречается также отвлечённое прочтение: «во всех страхах».'
    reason: lexical_alternative
  - marker: c
    text: Слово «сила» предполагается по параллелизму и другим текстовым свидетельствам, но в данном OCR-фрагменте оно читается неясно.
    reason: alignment_note
lexical_decisions:
- source_word: ϩⲛ
  choice: в
  rationale: Основное местное значение предлога; «в» сохраняет краткость и внутренний характер парадокса.
- source_word: ⲛⲉⲧⲛϣⲟϫⲛⲉ
  choice: тех, кто боится
  rationale: Относительная конструкция указывает скорее на людей, испытывающих страх, чем на отвлечённые «страхи».
- source_word: ϯⲛⲁⲕⲣⲣⲱ
  choice: обретается
  rationale: Хотя форма содержит показатель будущего, в череде самоопределений она выражает общее, вневременное утверждение. «Обретается» передаёт значение нахождения без тяжеловесной пассивной конструкции.
- source_word: ⲁⲛⲟⲕ
  choice: Я — та / я
  rationale: Явное местоимение сохранено ради анафоры и ритма поэтических самоопределений; женский род следует устойчивому женскому голосу трактата, а не грамматическому роду самого местоимения.
- source_word: ⲛⲉⲧⲕⲗⲏϣ
  choice: в трепете
  rationale: Выбрано отвлечённое прочтение, создающее парадокс «сила в трепете»; грамматически возможно и личное прочтение «в тех, кто трепещет».
- source_word: ⲟⲩϩⲟⲟⲩ (восстанавливается)
  choice: сила
  rationale: Существительное неразборчиво в данном OCR-фрагменте, но ожидается по параллелизму и другим свидетельствам текста; «сила» естественно передаёт значение мощи и сохраняет контраст с трепетом.
theological_decisions:
- issue: Женский род говорящего голоса
  choice: «Я — та»
  alternative: Гендерно невыраженное «Я»
  rationale: Коптское ⲁⲛⲟⲕ само по себе рода не обозначает, однако во всём трактате говорящий голос последовательно представлен как женский. Это литературно-грамматическое решение не вводит дополнительного богословского отождествления.
- issue: Соотношение силы и трепета
  choice: Сохранён парадокс «сила в трепете»
  alternative: Разъясняющее «сила для тех, кто трепещет»
  rationale: Источник допускает напряжение между силой и трепетом; перевод не устраняет его посредством богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством и лаконичным поэтическим ритмом. Повтор «я» и синтаксический параллелизм сохранены; архаизмы и конфессионально окрашенные формулы не использованы.
