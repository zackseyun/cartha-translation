review_pass:
  verdict: revise
  source_fidelity: 'Черновик не соответствует приведённому коптскому фрагменту. Английская контрольная версия («found in those who are afraid … strength in trembling») относится к иной части трактата и не может быть приоритетной: в данном OCR читаются «ваши замыслы/советы», будущее «я умолкну», «среди молчащих», «открою/явлю свои слова», а затем обращение к грекам и «варвар». Начало фрагмента обрывает предшествующий вопрос, поэтому это следует передать многоточием, не реконструируя отсутствующие слова как основной текст.'
  naturalness: Предлагаемая правка сохраняет лаконичный, возвышенный, но современный литературный строй. «Умолкну среди молчащих» воспроизводит повтор и парадокс оригинала; «варварка» естественно согласует этноним с устойчиво женским голосом произведения.
  terminology: «Замыслы» передаёт ⲛⲉⲧⲛϣⲟϫⲛⲉ в его контексте совета/намерения. «Варварка» оставляет исторически нагруженный этноним, не заменяя его интерпретирующим «чужеземка». Женский род отражает литературный голос трактата, тогда как коптская форма сама по себе рода не маркирует.
  issues:
  - severity: high
    issue: Текст перевода передаёт другой отрывок.
    rationale: В коптском OCR отсутствуют «страх», «трепет» и ожидаемое «сила»; вместо них видны последовательности, соответствующие молчанию, явлению/откровению слов, грекам и варвару. Низкая уверенность автоматического выравнивания и английская audit trail не отменяют приоритета исходного текста.
  - severity: medium
    issue: Сноски a–c привязаны к словам и решениям, которых в данном источниковом фрагменте нет.
    rationale: Они создают впечатление текстовой опоры для «та», «боится» и «сила», хотя эти элементы не соответствуют доступному коптскому тексту.
  - severity: medium
    issue: Начальная граница фрагмента не отмечена.
    rationale: Текст начинается с предложной группы «в ваших замыслах», очевидно продолжающей предыдущий вопрос; перевод не должен выдавать эту группу за самостоятельное полное высказывание.
  revised_text: '…в ваших замыслах?[a] Ибо я умолкну среди молчащих,

    и открою свои слова.


    Почему же вы ненавидите меня, греки? Потому что я — варварка?[b]'
  revised_footnotes:
