  source_fidelity: 'Перевод в целом верно передаёт будущую форму «вы найдёте меня», «величие», запрет и контраст с «самыми малыми местами». Однако «выходящую среди тех» неточно передаёт сочетание ⲉⲃⲟⲗ ϩⲛ: при глаголе движения ⲉⲃⲟⲗ предлог ϩⲛ естественнее понимать как исходную точку — «из среды / от».'
  naturalness: Фраза «Не смотрите на меня, выходящую среди тех, кто в почёте» синтаксически возможна, но тяжеловесна и неестественна для современного литературного русского. Личная временная конструкция «когда я выхожу из среды тех, кого почитают» яснее и сохраняет женский голос говорящей без искусственного причастного оборота.
  terminology: «Величие» удачно сохраняет абстрактный характер ⲙⲛⲧⲣⲙⲁⲟ и не подменяет его богатством. «Те, кого почитают» точнее, чем разговорно-сословное «те, кто в почёте», передаёт относительную конструкцию от «почитать». «Самые малые места» допустимо оставить как намеренно буквальное, поэтическое выражение.
