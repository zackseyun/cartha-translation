  yaml_path: translation/extra_canonical/thunder_perfect_mind/032.yaml
  text: And you will find me in greatness; and do not look at me going out among those who are honored, and in the least places look for me.
translation:
  language: ru
  text: И вы найдёте меня в величии[a]. Не смотрите на меня, когда я выхожу из среды тех, кого почитают[b]; ищите меня в самых малых местах[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Коптское ⲙⲙⲛⲧⲣⲙⲁⲟ буквально указывает на «величие»; в зависимости от контекста слово также связывают с высоким положением или богатством.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из среды тех, кого почитают». Сочетание, переданное как «когда я выхожу», может также обозначать появление или выступление; связь ⲉⲃⲟⲗ ϩⲛ допускает оттенок выхода «из среды» этих людей.'
    reason: lexical_and_syntactic_ambiguity
  - marker: c
    text: Последние слова в предоставленном OCR-фрагменте искажены. Здесь принято восстановление со значением «ищите меня», а предшествующие слова прочитаны как единое сочетание «самые малые места». Традиционный перевод этого отрывка — «Внемлите моей бедности и моему богатству» — отражает иное соотнесение текста.
    reason: textual_alignment_note
lexical_decisions:
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: вы найдёте меня
  rationale: Будущая форма 2-го лица множественного числа с ϭⲓⲛⲉ, обычно означающим «найти, обнаружить», и прямым дополнением ⲙⲙⲟⲉⲓ «меня».
- source_word: ϩⲛ ⲙⲙⲛⲧⲣⲙⲁⲟ
  choice: в величии
  rationale: Абстрактное существительное с ⲙⲛⲧ- передаёт состояние величия; «богатство» возможно в более широком смысловом поле, но менее точно соответствует форме.
- source_word: ⲟⲩⲇⲉ ⲙⲡⲣⲛⲁⲩ ⲉⲣⲟⲉⲓ
  choice: не смотрите на меня
  rationale: Запретительная конструкция ⲙⲡⲣ- с глаголом ⲛⲁⲩ «смотреть, видеть» и объектом «на меня».
- source_word: ⲉⲉⲓⲛⲏⲩ ⲉⲃⲟⲗ
  choice: выходящую
  rationale: Сочетание выражает движение наружу — «выходить, являться»; причастие естественно связывается в русском с говорящей, обозначенной формой женского рода во всём произведении.
- source_word: ⲛⲉⲧⲧⲁⲉⲓⲏⲩ
  choice: те, кто в почёте
  rationale: 'Форма понимается как множественная относительная конструкция со стативом от ⲧⲁⲉⲓⲟ «почитать»: буквально «те, кого почитают».'
- source_word: ⲛⲉⲗⲁⲭⲓⲥⲧⲟⲥ ⲧⲟⲡⲟⲥ
  choice: самые малые места
  rationale: Греческие заимствования ἐλάχιστος и τόπος образуют сочетание «наименьшие/самые малые места»; буквальная передача сохраняет намеренный контраст с величием и почётом.
- source_word: ⲛ̄ⲧⲉ ⲧⲏⲥ ⲱⲕ ⲉⲛⲥⲱⲉⲓ
  choice: ищите меня
  rationale: OCR здесь, вероятно, искажает чтение ⲛⲧⲉⲧⲛϭⲱϣⲧ ⲛⲥⲱⲉⲓ — «вы смотрите/ищете меня»; по контексту выбран повелительный смысл «ищите меня».
theological_decisions:
- issue: Парадокс присутствия говорящей в величии и одновременно в самых малых местах
  choice: Сохранён прямой контраст без богословского объяснения
  alternative: Истолковать «величие» как богатство, а «малые места» как бедность или унижение
  rationale: Текст строится на напряжённом параллелизме; конкретизация в категориях богатства и бедности сузила бы возможный смысл и опиралась бы на традиционное изложение, а не на данный коптский фрагмент.
translation_notes:
  register: Современный литературный русский с достоинством и умеренной формальностью. Сохранены обращение во множественном числе, женский голос говорящей и парадоксальный контраст. «Самые малые места» намеренно несколько необычно по-русски, поскольку точнее передаёт формальную структуру коптского выражения, чем истолковывающие варианты «низшие» или «презренные места».
