translation:
  language: ru
  text: 'Гром. Совершенный Ум.


    Я была послана из Силы[a],

    и пришла[b] к тем, кто размышляет обо мне,

    и была найдена[c] среди тех, кто ищет меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова, соответствующие выражению «из Силы», в данном фрагменте OCR не видны; перевод следует обычному чтению полного текста. Наличие артикля и точный оттенок — «из Силы» или «от Силы» — по этому отрывку проверить нельзя.
    reason: alignment_note
  - marker: b
    text: 'В предоставленном OCR стоит ⲛⲧⲁⲓⲥⲱⲧⲙ — «я была услышана». Во многих изданиях читается ⲛⲧⲁⲓⲉⲓ — «я пришла». При подтверждении первого чтения строка переводилась бы: «и меня услышали те, кто размышляет обо мне».'
    reason: alternative_reading
  - marker: c
    text: 'Оборот ⲁⲓϭⲓⲛⲉ ⲙⲙⲟⲓ допускает несколько пониманий: «я была найдена», «я нашла себя» или «меня нашли». В тексте выбрано пассивное чтение ради параллелизма, но неоднозначность сохраняется в примечании.'
    reason: alternative_reading
lexical_decisions:
- source_word: ⲧⲃⲣⲟⲛⲧⲏ
  choice: Гром
  rationale: Передаёт греческое заимствование βροντή буквально и сохраняет краткость заглавия.
- source_word: ⲛⲟⲩⲥ
  choice: Ум
  rationale: Наиболее прямой и понятный эквивалент греческого νοῦς; сохраняет необычную форму эпитета в заглавии.
- source_word: ⲛⲧⲉⲗⲉⲓⲟⲥ
  choice: Совершенный
  rationale: Буквально передаёт греческое τέλειος и согласуется с существительным «Ум».
- source_word: ⲧⲁⲛⲧⲁⲟⲩⲟⲉⲓ ... ⲉⲃⲟⲗ
  choice: Я была послана
  rationale: Сохраняет пассивное значение и направленность движения наружу. Русская форма женского рода соответствует женскому голосу произведения, хотя первое лицо в коптском само по себе рода не обозначает.
- source_word: (восстанавливаемое по полному тексту обозначение силы)
  choice: из Силы
  rationale: Сохраняет значение происхождения — «из/от Силы» — и прописной буквой отмечает возможное титульное употребление, не превращая его однозначно в имя собственное.
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ
  choice: размышляет обо мне
  rationale: Естественно передаёт вдумчивое, созерцательное значение ⲙⲉⲉⲩⲉ, не придавая выражению излишне специального религиозного оттенка.
- source_word: ⲛⲧⲁⲓⲥⲱⲧⲙ (OCR) / ⲛⲧⲁⲓⲉⲓ (принятое чтение)
  choice: пришла
  rationale: Следует принятому в изданиях чтению «я пришла»; засвидетельствованное OCR чтение «я была услышана» сохранено в примечании как реальная текстовая неопределённость.
- source_word: ⲁⲓϭⲓⲛⲉ ⲙⲙⲟⲓ ϩⲛ ⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲓ
  choice: была найдена среди тех, кто ищет меня
  rationale: Сохраняет параллелизм строк и традиционное пассивное понимание; возможные возвратное и активное толкования отмечены в примечании.
theological_decisions:
- issue: Статус «Силы»
  choice: Сила с прописной буквы, без дополнительного определения
  alternative: сила; Могущество; божественная Сила
  rationale: Прописная буква передаёт вероятную титульность, но перевод не уточняет природу или личностный статус Силы и не привносит конфессионального толкования.
- issue: Род говорящего голоса
  choice: 'Женский род: «была послана», «пришла», «была найдена»'
  alternative: Перестроить фразы так, чтобы избежать указания рода
  rationale: В коптском формы первого лица не маркируют род, однако дальнейший текст явно строит женский голос. Русский язык требует рода в выбранных точных формах прошедшего времени; женский род сохраняет литературную целостность произведения без утверждения о природе говорящей.
translation_notes:
  register: Современный литературный русский с кратким, торжественным и ритмически параллельным синтаксисом. Заглавие намеренно сохраняет непривычное соположение «Гром. Совершенный Ум». Лексика понятна широкому читателю и не насыщена поздней конфессиональной терминологией.
