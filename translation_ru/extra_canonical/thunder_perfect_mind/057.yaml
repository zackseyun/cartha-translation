    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲉⲓⲉⲃⲟⲗ
  choice: я вышла
  rationale: Обычное коптское сочетание со значением выхода или появления. Женский род соответствует женскому голосу произведения, хотя сама коптская форма рода не выражает.
- source_word: ⲕⲁϩ
  choice: земля
  rationale: ⲕⲁϩ означает «земля, почва», а не «тьма»; для «тьмы» ожидалось бы ⲕⲁⲕⲉ.
- source_word: ⲛⲧⲉⲧⲛϣⲟⲟⲡ ⲉⲃⲟⲗ
  choice: вы стали явными
  rationale: Сочетание ϣⲟⲟⲡ «быть, становиться» с ⲉⲃⲟⲗ передаёт становление или явленность; сохранено обращение во множественном числе.
- source_word: ⲉⲡⲓⲥⲧⲏⲙ
  choice: знание
  rationale: Греческое заимствование ἐπιστήμη прежде всего означает знание; выбран нейтральный термин без привнесения специального доктринального смысла.
- source_word: ⲕⲁϩ ⲛϩⲏⲧ
  choice: земля — у вас в сердце
  rationale: Передана внутренняя локализация и сохранён резкий образ земли в сердце; тире делает фразу естественнее по-русски, не сглаживая её необычность.
- source_word: ⲛⲧⲉⲧⲛϣⲟⲡ
  choice: вы принимаете
  rationale: Форма восходит к ϣⲱⲡ «принимать, брать, приобретать», а не к глаголу «искать».
- source_word: ⲛⲉⲃⲟⲗ
  choice: тех, кто снаружи
  rationale: Форма понята как субстантивированное множественное обозначение внешних, а не только как наречие «снаружи».
- source_word: ϩⲛϩⲉⲛⲧⲟⲡⲟⲥ
  choice: по разным местам
  rationale: Греческое заимствование τόπος имеет конкретное значение «место»; неопределённый множественный артикль естественно передан словом «разным».
- source_word: ⲧⲉ ⲡⲁⲓ ⲙⲙⲟⲉⲓ
  choice: вот что принадлежит мне
  rationale: OCR и сегментация начала неуверенны. Перевод сохраняет указательно-притяжательный смысл, не вводя предположительного существительного «голос» или «речение».
theological_decisions:
- issue: Расхождение OCR-отрывка с распространённой строкой о безбожии и великом Боге
  choice: Переводить засвидетельствованный здесь OCR-отрывок о земле, знании и внешних
  alternative: «Я безбожна, и я та, чей Бог велик»
  rationale: Предоставленный коптский отрывок не содержит слов, соответствующих «безбожна» и «Бог велик»; вероятна несогласованность сегментации. Подмена текста известной строкой скрыла бы проблему источника.
- issue: Грамматический род говорящей
  choice: 'Женский род: «я вышла»'
  alternative: Избежать выражения рода посредством настоящего времени или номинальной конструкции
  rationale: В произведении говорит женская фигура; женский род естественен в русском и согласуется с контекстом, хотя коптская глагольная форма сама по себе рода не маркирует.
