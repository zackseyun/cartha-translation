base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/057.yaml
  text: 'This is mine:

    I came forth in an earth[a],

    and you came to be manifest in knowledge;

    an earth is in your heart—you receive those outside[c][b], in places.'
translation:
  language: ru
  text: '**12.** Вот что принадлежит мне:[a]


    Я вышла из земли,[b]


    а вы стали явными в знании;


    земля — у вас в сердце, и вы принимаете тех, кто снаружи, по разным местам.[c]'
  philosophy: optimal-equivalence
