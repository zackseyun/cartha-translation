  yaml_path: translation/extra_canonical/thunder_perfect_mind/072.yaml
  text: 'The voice of the angels who were sent forth in the word[a], and of the gods,

    the gods that go out by means of the counsel;

    and the spirits of humans who exist with me,

    and the women who exist within[m][l][k][j][i][h][g][f][e][d][c][b].

    I am she — you [pl.] ...'
translation:
  language: ru
  text: '**9.** [Голос?][a] ангелов, посланных в Слове,[b] и богов —

    богов, исходящих по замыслу;[c]

    и духов людей, пребывающих со мной,

    и женщин, пребывающих внутри.[d]

    Я — та, которую вы…[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальное ⲥⲓⲥ неясно и, возможно, сохранилось или распознано неполно. Перевод «голос» предположителен; предлагалось также понимать форму как указание на тишину или молчание.
    reason: Неуверенное чтение начала OCR-фрагмента.
  - marker: b
    text: 'Буквально возможно также: «в слове» или «в Логосе».'
    reason: Сохранение смыслового диапазона греческого заимствования λόγος.
  - marker: c
    text: Слово ⲛⲟⲩⲧⲉ в коптском может обозначать как «Бога», так и «бога»; здесь повтор и построение фразы скорее указывают на множественное число. ⲡϣⲟϫⲛⲉ означает «совет», «замысел» или «решение».
    reason: Грамматическая и богословски значимая неоднозначность.
  - marker: d
    text: 'Буквально: «во внутренности» или «в сердце»; из отрывка неясно, внутри кого или чего.'
    reason: Неопределённый референт и образ внутреннего пространства.
  - marker: e
    text: Коптский текст обрывается после начала формы второго лица множественного числа; продолжение утрачено или не вошло в данный фрагмент.
    reason: Фрагментарность источника.
lexical_decisions:
- source_word: ⲥⲓⲥ
  choice: '[Голос?]'
  rationale: Начало фрагмента и чтение OCR ненадёжны; предлагаемое значение нельзя уверенно вывести из сохранившейся формы. В основном тексте неопределённость обозначена скобками и вопросительным знаком, а не скрыта гладким переводом.
- source_word: ⲛ̄ⲛⲁⲅⲅⲉⲗⲟⲥ
  choice: ангелов
  rationale: Греческое заимствование ἄγγελος в данном религиозном контексте естественно передаётся как «ангелы», хотя буквально возможно «вестники».
- source_word: ⲛ̄ⲧⲁⲩⲧⲁⲟⲩⲟ
  choice: посланных
  rationale: Форма лучше соотносится с глаголом ⲧⲁⲟⲩⲟ — «посылать, изводить, произносить», чем с прилагательным «первые»; причастная конструкция согласуется с ангелами.
- source_word: ϩⲙ̄ ⲡⲗⲟⲅⲟⲥ
  choice: в Слове
  rationale: ϩⲙ̄ выражает нахождение или сферу, а греческое λόγος допускает как обычное «слово», так и технически нагруженное «Слово»; прописная буква сохраняет возможный титульный оттенок.
- source_word: ⲛ̄ⲛⲟⲩⲧⲉ
  choice: богов
  rationale: Повтор существительного и параллельная структура перечня поддерживают множественное число; вариант «Бога» грамматически возможен и отмечен в примечании.
- source_word: ⲉⲃⲟⲗ ϩⲓⲧⲙ̄ ⲡϣⲟϫⲛⲉ
  choice: исходящих по замыслу
  rationale: ⲉⲃⲟⲗ передаёт движение наружу, ϩⲓⲧⲙ̄ — посредство, а ϣⲟϫⲛⲉ означает «совет, замысел, решение», не «голос».
- source_word: ⲙ̄ⲡⲛⲁ ⲛ̄ⲣⲱⲙⲉ
  choice: духов людей
  rationale: ⲡⲛⲁ здесь представляет сокращённое написание ⲡⲛⲉⲩⲙⲁ, «дух»; родовая форма множественного смысла естественно передаётся как «духи людей».
- source_word: ⲉⲛⲓⲙⲉⲧ ϣⲟⲟⲡ ⲛ̄ⲙⲙⲁⲉⲓ
  choice: пребывающих со мной
  rationale: Несмотря на повреждённое или ошибочно распознанное чтение, контекст поддерживает относительную конструкцию «которые существуют со мной»; «пребывают» сохраняет экзистенциальный и возвышенный оттенок.
- source_word: ⲛⲓϩⲓⲟⲙⲉ
  choice: женщин
  rationale: Это множественное число слова «женщина», а не обозначение мудрых.
- source_word: ⲛ̄ϩⲏⲧ
  choice: внутри
  rationale: Выражение буквально связано с внутренностью или сердцем; нейтральное «внутри» не уточняет отсутствующий в отрывке объект.
- source_word: ⲁⲛⲟⲕ ⲧⲉ ⲧⲉⲧ-
  choice: Я — та, которую вы…
  rationale: ⲁⲛⲟⲕ ⲧⲉ — женская формула самоотождествления «Я — та»; далее начинается форма второго лица множественного числа, но предложение обрывается, поэтому синтаксическое продолжение дано лишь минимально и завершено многоточием.
theological_decisions:
- issue: Единственное или множественное число ⲛⲟⲩⲧⲉ
  choice: «богов»
  alternative: «Бога»
  rationale: Перечневая структура и повтор ⲛ̄ⲛⲟⲩⲧⲉ склоняют к множественному числу. Выбор не заменён конфессионально более привычным единственным числом.
- issue: Статус λόγος
  choice: «Слово»
  alternative: «слово» или «Логос»
  rationale: Прописная буква позволяет сохранить возможный космологический или титульный смысл, не вводя транслитерацию и не определяя точную природу Слова.
- issue: Неуказанное внутреннее пространство в ⲛ̄ϩⲏⲧ
  choice: «внутри» без дополнения
  alternative: «в сердце»
  rationale: Текст не называет явно, внутри кого или чего пребывают женщины; добавление «во мне» или иное уточнение преждевременно разрешило бы двусмысленность.
translation_notes:
  register: Современный литературный русский с достоинством и ритмом каталога. Повтор «богов — богов» сохранён как риторическая анафора. «Пребывающих» выбрано вместо разговорного «которые находятся», а неясности OCR и оборванного окончания обозначены прямо. Все примечания привязаны к маркерам в основном тексте.
