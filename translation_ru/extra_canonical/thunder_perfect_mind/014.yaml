- source_word: ⲛⲧⲟϥ ⲡⲉ ⲡⲁϫⲡⲟ
  choice: а он — моё дитя
  rationale: OCR указывает на ⲡⲁϫⲡⲟ, а значение «дитя/порождение» завершает цепь родственных парадоксов. «Дитя» естественно по-русски и не уточняет пол потомка сверх исходного выражения.
- source_word: ϩⲙϩⲁⲗ
