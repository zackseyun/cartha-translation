  yaml_path: translation/extra_canonical/thunder_perfect_mind/073.yaml
  text: And in the spirit of every man who exists with me[a], and the women who are in me— I am the honored one[f][e][d][c][b], and the one who is praised.
translation:
  language: ru
  text: '**10.** И в духе каждого мужчины, пребывающего со мной,[a] и в женщинах, которые во мне, — я та, кого почитают, и та, кого восхваляют.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Рукописное чтение в этом месте не вполне ясно. Последовательность ⲣⲱⲙⲉ ⲉⲛⲓⲙⲉⲧϣⲟⲟⲡ понята как слегка искажённое ⲣⲱⲙⲉ ⲛⲓⲙ ⲉⲧϣⲟⲟⲡ: «каждый мужчина, который пребывает».'
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲙ̄ⲡⲛⲁ
  choice: в духе
  rationale: Передаёт внутренний, духовный смысл ⲡⲛⲁ; варианты «в дыхании» и «на ветру» здесь контекстуально менее вероятны.
- source_word: ⲣⲱⲙⲉ ⲛⲓⲙ ⲉⲧϣⲟⲟⲡ
  choice: каждого мужчины, пребывающего
  rationale: Чтение восстанавливает обычное сочетание ⲣⲱⲙⲉ ⲛⲓⲙ «каждый человек/мужчина» с относительной формой ⲉⲧϣⲟⲟⲡ. «Мужчина» сохраняет явное сопоставление с последующим «женщины».
- source_word: ϣⲟⲟⲡ ⲛ̄ⲙⲙⲁⲉⲓ
  choice: пребывающего со мной
  rationale: ϣⲟⲟⲡ выражает бытие или присутствие; «пребывать» естественно передаёт продолжительное присутствие и сохраняет возвышенный регистр.
- source_word: ⲛⲓϩⲓⲟⲙⲉ ⲉⲧϣⲟⲟⲡ ⲛ̄ϩⲏⲧ
  choice: женщины, которые во мне
  rationale: ⲛ̄ϩⲏⲧ здесь понимается как предлог «в» с местоименным суффиксом первого лица, а не как существительное «сердце».
- source_word: ⲧⲉⲧⲧⲁⲉⲓⲏⲟⲩ
  choice: та, кого почитают
  rationale: Форма связана с ⲧⲁⲉⲓⲟ «почитать» и обозначает почитаемую; русская относительная конструкция ясно сохраняет женский род говорящей.
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ
  choice: та, кого восхваляют
  rationale: ⲥⲙⲟⲩ — глагол «хвалить/благословлять»; форма естественно читается как «та, которую они хвалят», то есть «та, кого восхваляют».
theological_decisions:
- issue: Самоопределение женского голоса через два пассивных наименования
  choice: «я та, кого почитают, и та, кого восхваляют»
  alternative: «я почитаемая и восхваляемая»
  rationale: Развёрнутая конструкция сохраняет повтор и параллелизм коптского текста, не добавляя объяснения личности говорящей.
translation_notes:
  register: Современный литературный русский язык с достоинством и ритмическим параллелизмом. Женский род говорящей выражен конструкцией «я та». Необычная координация начальных членов сохранена, поскольку предоставленный отрывок, вероятно, начинается внутри более широкого синтаксического контекста.
