  source_fidelity: Требуется исправление двух существенных мест. ⲙⲛ̄ⲧϭⲱⲃ в данном контексте следует передавать прежде всего как «бедность/нужда», а не «слабость». Кроме того, связь ⲛ̄ⲧⲉⲧⲛ̄ с «самообладанием» синтаксически неоднозначна; категорическое решение черновика («вы любите его») не должно вытеснять возможность «моё самообладание по отношению к вам», отражённую в английском аудите. Последние две строки в черновике следуют восстановленному чтению, а не дефектному OCR, и переданы по существу верно.
  naturalness: «Моя униженность» и «не смейтесь надо мной без меры» естественны для современного литературного русского и сохраняют высокий, парадоксальный тон. Оборот «самообладание по отношению к вам — любите его» несколько намеренно напряжён, но читаем и близок к эллиптическому построению оригинала.
  terminology: «Самообладание» удачно передаёт ἐγκράτεια; «униженность» не подменяет исходное состояние добродетелью смирения. «Ошибка» допустима для ⲣⲓⲕⲉ при сноске, а «хвастовство» корректно передаёт ϣⲟⲩϣⲟⲩ без сглаживания парадокса.
  issues:
  - severity: medium
    issue: «В моей слабости» вместо «в моей бедности/нужде».
    rationale: ⲙⲛ̄ⲧϭⲱⲃ обозначает бедность, нужду, лишённость; «слабость» возможна лишь как более отдалённое толкование и неоправданно смещает основной смысл.
  - severity: medium
    issue: Синтаксическая неоднозначность ⲛ̄ⲧⲉⲧⲛ̄ устранена без оговорки.
    rationale: Английский аудиторский след специально отмечает возможность понимания группы с ⲧⲁⲉⲅⲕⲣⲁⲧⲉⲓⲁ как «по отношению к вам / о вас». Перевод должен отразить это основное чтение и отметить альтернативу.
  - severity: low
    issue: Сноска a не соответствует выбранному в черновике слову «слабости».
    rationale: После восстановления основного значения «бедность» сноска должна описывать альтернативы, а не создавать впечатление, что «слабость» — основной эквивалент.
