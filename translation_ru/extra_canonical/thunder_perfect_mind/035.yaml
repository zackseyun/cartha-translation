base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/035.yaml
  text: 'Do not despise my lowliness[a];

    and my self-control toward you—love her in my poverty.

    Do not laugh at me excessively;

    and do not despise my fault[d][c][b], and do not curse my boasting.'
translation:
  language: ru
  text: '**13.** Не презирайте моей униженности;


    а моё самообладание любите в моей слабости.[a]


    Не смейтесь надо мной без меры;


    не презирайте моей ошибки[b]


    и не проклинайте моего хвастовства.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово ⲙⲛ̄ⲧϭⲱⲃ может также означать «бедность», «нужду» или «немощь».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально также возможно: «моего уклонения» или «моего проступка». Последние строки в предоставленном OCR искажены; перевод следует восстановленному чтению ⲙⲡⲣⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲛ̄ⲧⲁⲣⲓⲕⲉ.'
    reason: textual_and_lexical_note
  - marker: c
    text: 'Или: «моей похвальбы», «моего превозношения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙ̄ⲡⲣ̄ⲙⲉⲥⲧⲉ
  choice: не презирайте
  rationale: Отрицательное повеление с ⲙ̄ⲡⲣ̄; ⲙⲉⲥⲧⲉ допускает значения «ненавидеть, питать отвращение, презирать». Здесь «презирать» естественно сочетается с последующим обозначением униженного состояния.
- source_word: ⲧⲁⲙⲛ̄ⲧⲥⲧⲙⲏⲧ
  choice: моей униженности
  rationale: Абстрактное существительное обозначает малость, приниженность или ничтожность. «Униженность» не превращает это состояние в добродетель смирения и не приписывает говорящей нравственную низость.
- source_word: ⲧⲁⲉⲅⲕⲣⲁⲧⲉⲓⲁ
  choice: моё самообладание
  rationale: Греческое заимствование ἐγκράτεια означает самообладание, воздержанность или сдержанность; выбран современный и достаточно широкий русский эквивалент.
- source_word: ⲛ̄ⲧⲉⲧⲛ̄ ⲙⲉⲣⲓⲧⲥ
  choice: любите
  rationale: ⲛ̄ⲧⲉⲧⲛ̄ естественнее разбирать как местоименный субъект 2-го лица множественного числа, а -ⲥ в ⲙⲉⲣⲓⲧⲥ — как объектное местоимение, отсылающее к ⲉⲅⲕⲣⲁⲧⲉⲓⲁ. Поэтому фраза означает «моё самообладание — любите его», а не «самообладание по отношению к вам».
- source_word: ⲧⲁⲙⲛ̄ⲧϭⲱⲃ
  choice: в моей слабости
  rationale: Основа ϭⲱⲃ имеет диапазон «слабый, немощный, бедный». «Слабость» сохраняет основной смысл, а возможное значение нужды отмечено в сноске.
- source_word: ⲕⲱ ⲧⲏⲛⲉ ⲉⲣⲟⲉⲓ
  choice: не смейтесь надо мной без меры
  rationale: Передан насмешливый смысл конструкции, а усилитель ⲧⲏⲛⲉ выражен оборотом «без меры», естественным для русского увещевания.
- source_word: ⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲛ̄ⲧⲁⲣⲓⲕⲉ
  choice: не презирайте моей ошибки
  rationale: Нормализованное чтение содержит греческий глагол καταφρονεῖν «презирать» и ⲣⲓⲕⲉ «уклонение, ошибка, проступок». «Ошибка» не усиливает нравственную оценку без достаточного основания.
- source_word: ⲥⲁϩⲟⲩ ⲙ̄ⲡⲁϣⲟⲩϣⲟⲩ
  choice: не проклинайте моего хвастовства
  rationale: ⲥⲁϩⲟⲩ здесь является глаголом «проклинать», а не словом «собрание»; ϣⲟⲩϣⲟⲩ означает хвастовство, похвальбу или превозношение, а не насилие.
theological_decisions:
- issue: Парадоксальное соединение самообладания со слабостью и хвастовства с просьбой не проклинать
  choice: Сохранить прямые, напряжённые формулировки без нравственного оправдания говорящей
  alternative: Истолковать «хвастовство» положительно как славу или свидетельство, а «слабость» как смирение
  rationale: Текст намеренно строится на парадоксах. Контекст данного отрывка не даёт основания устранять напряжение конфессиональным или нравоучительным толкованием.
translation_notes:
  register: Современный литературный русский с торжественным ритмом повторяющихся запретов. Синтаксический параллелизм оригинала сохранён, но тяжёлые церковнославянизмы исключены. Местоимение множественного числа передано формами «презирайте», «любите», «смейтесь», «проклинайте».
