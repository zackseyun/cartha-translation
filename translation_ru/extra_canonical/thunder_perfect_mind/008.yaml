translation:
  language: ru
  text: '**3.** Я — блудница и почитаемая[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ⲥⲉⲙⲛⲏ (semnē) — «почтенная, почитаемая, величественная»; возможен и перевод «святая».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲛⲟⲕ … ⲧⲉ
  choice: Я —
  rationale: Копульная конструкция отождествления от первого лица; русское именное предложение с тире естественно передаёт повторяющуюся формулу «я есмь», не придавая ей искусственно архаического звучания.
- source_word: ⲡⲟⲣⲛⲏ
  choice: блудница
  rationale: Греческое заимствование обозначает женщину, занимающуюся проституцией. «Блудница» сохраняет резкость, стигматизирующую окраску и достоинство литературного регистра; более нейтральная альтернатива — «проститутка».
- source_word: ⲥⲉⲙⲛⲏ
  choice: почитаемая
  rationale: Субстантивированное прилагательное со значением «почтенная, почитаемая, величественная»; выбор сохраняет прямое лексическое значение и не сужает его до исключительно культового понятия святости.
- source_word: ⲁⲩⲱ
  choice: и
  rationale: Простой сочинительный союз, соединяющий парадоксальные самообозначения.
theological_decisions:
- issue: Следует ли переводить ⲥⲉⲙⲛⲏ как «святая»
  choice: почитаемая
  alternative: святая
  rationale: Исходное слово допускает сакральный оттенок, но прежде всего означает «почтенная, достойная почитания, величественная». «Почитаемая» сохраняет неоднозначность и не усиливает без необходимости собственно богословское утверждение.
translation_notes:
  register: Современный литературный русский с сохранением краткости и вызывающего парадокса оригинала. «Я —» предпочтено архаическому «я есмь»; «блудница» передаёт резкость исходного слова, а «почитаемая» сохраняет смысловую неоднозначность ⲥⲉⲙⲛⲏ.
