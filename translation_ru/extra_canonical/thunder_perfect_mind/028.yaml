  yaml_path: translation/extra_canonical/thunder_perfect_mind/028.yaml
  text: Look out upon the earth, and you will find me among those who see; and do not look upon the dung-heap of dung.
translation:
  language: ru
  text: '**6.** Взгляните на землю[a] — и вы найдёте меня среди тех, кто приходит[b]; и не смотрите на навозную кучу испражнений[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начало строки в OCR передано как ⲛⲁⲉⲃⲟⲗ; вероятнее всего, следует читать ⲛⲁⲩ ⲉⲃⲟⲗ — «взгляните», что соответствует последующему «не смотрите».
    reason: textual_note
  - marker: b
    text: ⲉⲧⲛⲏⲟⲩ означает «те, кто приходит» или «приходящие». Это форма глагола «приходить», а не «видеть».
    reason: lexical_note
  - marker: c
    text: 'В оригинале стоят рядом два обозначения нечистот: греческое заимствование со значением «навозная куча» и коптское слово «испражнения, нечистоты». Повтор усиливает образ унижения и отверженности.'
    reason: cultural_note
lexical_decisions:
- source_word: ⲛⲁⲉⲃⲟⲗ
  choice: Взгляните
  rationale: По контексту и параллели с последующим ⲙⲡⲣⲛⲁⲩ форма, вероятнее всего, отражает повреждённое или ошибочно распознанное ⲛⲁⲩ ⲉⲃⲟⲗ — повелительное «посмотрите наружу / взгляните». Первого лица, необходимого для перевода «я выйду», в тексте нет.
- source_word: ϩⲓ ⲡⲕⲁϩ
  choice: на землю
  rationale: ϩⲓ обозначает положение или направление относительно поверхности, а ⲕⲁϩ — землю, сушу или почву. «На землю» естественно по-русски и сохраняет широту образа.
- source_word: ⲧⲉⲧⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: вы найдёте меня
  rationale: Форма выражает будущее время во 2-м лице множественного числа; ⲙⲙⲟⲉⲓ — объектное местоимение 1-го лица.
- source_word: ϩⲛ ⲛⲉⲧⲛⲏⲟⲩ
  choice: среди тех, кто приходит
  rationale: ⲛⲏⲟⲩ — форма глагола ⲉⲓ «приходить», а не глагола ⲛⲁⲩ «видеть». С предлогом ϩⲛ и субстантивированной относительной конструкцией естественно значение «среди приходящих».
- source_word: ⲙⲡⲣⲛⲁⲩ
  choice: не смотрите
  rationale: Отрицательное повеление ⲙⲡⲣ- с глаголом ⲛⲁⲩ «видеть, смотреть».
- source_word: ⲉⲡⲓⲧⲕⲟⲩⲡⲣⲓⲁ ⲛⲧⲉ ⲡⲓⲕⲱⲕ
  choice: на навозную кучу испражнений
  rationale: Греческое заимствование κοπρία обозначает навозную кучу, а ⲕⲱⲕ — нечистоты или испражнения. Формулировка сохраняет намеренно отталкивающее усиление исходного двойного выражения.
theological_decisions:
- issue: Связь говорящей с «приходящими»
  choice: среди тех, кто приходит
  alternative: среди тех, кто видит
  rationale: Выбор определяется коптской формой ⲛⲏⲟⲩ от ⲉⲓ «приходить» и не придаёт группе богословски нагруженного значения «видящие» или «провидцы».
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повелительной интонацией. Резкий телесный образ сохранён без эвфемистического сглаживания. Тире перед следствием поддерживает ритм поэтического обращения.
