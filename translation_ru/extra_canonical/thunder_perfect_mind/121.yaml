base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/121.yaml
  text: 'Because of this[a], do not let me be heard[b];

    and do not let me be known by judgment or by any other power.'
translation:
  language: ru
  text: 'Поэтому[a] не позволяйте, чтобы меня услышали,


    и не позволяйте, чтобы меня узнали через суд или через какую-либо иную силу[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начало фразы можно также перевести: «Из-за этого» или «По этой причине».'
    reason: translation_alternative
  - marker: b
    text: В рукописном фрагменте первое слово этой пары передано неясно; вероятно, имеется в виду заимствованное из греческого слово ⲕⲣⲓⲙⲁ — «суд». Если это восстановление неверно, смысл выражения остаётся неопределённым. Слово ⲟⲉⲓϣ обычно означает «сила, могущество».
    reason: textual_variant
lexical_decisions:
- source_word: ⲉⲧⲃⲉ ⲡⲁⲓ
  choice: Поэтому
  rationale: Передаёт причинно-следственную силу оборота естественным современным русским союзным наречием; более буквальное «из-за этого» здесь звучало бы тяжеловесно.
- source_word: ⲙⲡⲣ ⲣⲁⲧ ⲥⲱⲧⲙ ⲛⲥⲱⲓ
  choice: не позволяйте, чтобы меня услышали
  rationale: Сохраняет отрицательное побуждение и каузативно-разрешительный смысл конструкции, не превращая её в простое «не слушайте меня».
- source_word: ⲁⲩⲱ
  choice: и
  rationale: Простой соединительный союз, соответствующий параллелизму двух запретов.
- source_word: ⲙⲡⲣ ⲣⲁⲧ ⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: не позволяйте, чтобы меня узнали
  rationale: Передаёт параллельную каузативную конструкцию и сохраняет различие между «услышали» и «узнали».
- source_word: ⲛ ⲕⲉⲙⲁ (вероятно ⲛ ⲕⲣⲓⲙⲁ) ⲏ ⲛⲕⲉⲟⲩⲟⲉⲓϣ
  choice: через суд или через какую-либо иную силу
  rationale: «Через» осторожно передаёт возможный инструментальный смысл ⲛ-; «суд» следует вероятному восстановлению греческого заимствования ⲕⲣⲓⲙⲁ, а «сила» — обычному значению ⲟⲉⲓϣ.
