base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/046.yaml
  text: 'and she who has no image among the barbarians[1].

    I am the one they have hated in many places,

    and I am the one they have loved in many places[b][a][3][2].

    I am the one they call “Death,”

    and I am the one they call “the Law.”'
translation:
  language: ru
  text: 'и та, у которой нет образа среди варваров.[a]


    Я — та, которую повсюду ненавидели,


    и та, которую повсюду любили.[b]


    Я — та, которую называют Смертью,


    и та, которую называют Законом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «у которой нет подобия среди варваров». Начальная строка продолжает предшествующую последовательность; чтение основано на данном коптском фрагменте, а не на предложенном в консультационном тексте вопросе о греках.'
    reason: source_alignment_and_lexical_alternative
  - marker: b
    text: 'Буквально: «в каждом месте».'
    reason: literal_rendering
lexical_decisions:
- source_word: ⲧⲉⲧⲉ ⲙⲛⲧⲉⲥ ⲉⲓⲛⲉ ⲙⲙⲁⲩ
  choice: та, которой нет подобия
  rationale: Отрицательная конструкция передаёт отсутствие соответствующего образа или подобия; «подобия» естественно по-русски и не превращает строку в отсутствующий в источнике риторический вопрос.
- source_word: ⲛⲃⲁⲣⲃⲁⲣⲟⲥ
  choice: среди варваров
  rationale: Сохранено прозрачное греческое заимствование βάρβαρος и заключённое в нём культурное противопоставление; «среди» соответствует обстоятельственному употреблению.
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Я — та
  rationale: Женская копульная форма и повтор формулы переданы явно, чтобы сохранить ритм самообъявлений и женский голос текста.
- source_word: ⲛⲧⲁⲩⲙⲉⲥⲧⲱⲥ / ⲛⲧⲁⲩⲙⲉⲣⲓⲧⲥ
  choice: которую ненавидели / которую любили
  rationale: Прямые антонимы сохраняют резкое параллельное противопоставление источника; русский прошедший вид не навязывает продолжающийся результат.
- source_word: ϩⲛ ⲙⲁ ⲛⲓⲙ
  choice: повсюду
  rationale: Буквально выражение означает «в каждом месте»; «повсюду» передаёт распределительный смысл естественнее, чем менее точное «во многих местах».
- source_word: ⲙⲟⲩⲧⲉ ⲉⲣⲟⲥ
  choice: называют
  rationale: Обычный глагол называния; относительная конструкция по-русски требует формы «которую называют».
- source_word: ⲡⲙⲟⲩ
  choice: Смертью
  rationale: Сохранено именное самоназвание; прописная буква подчёркивает его титульную роль без дополнительного толкования.
- source_word: ϣⲁⲩⲙⲟⲩⲧⲉ
  choice: называют
  rationale: Префикс ϣⲁ- здесь имеет аористно-обычное, а не будущее значение; русское настоящее передаёт обычное именование.
- source_word: ⲡⲛⲟⲙⲟⲥ
  choice: Законом
  rationale: Греческое νόμος прежде всего обозначает закон; творительный падеж естественен после «называют», а прописная буква сохраняет параллель с «Смертью».
theological_decisions:
- issue: Статус самоназваний «Смерть» и «Закон»
  choice: Передать оба как параллельные титульные наименования без пояснения их отношения друг к другу
  alternative: Истолковать «Закон» как религиозный Закон, обычай или космический принцип
  rationale: Источник намеренно ставит напряжённые наименования рядом и не уточняет их доктринальный смысл; перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим ритмом. Повтор «Я — та» сохранён как структурная опора речи; архаизмы исключены. Первая строка намеренно начинается со строчной «и», поскольку в источнике она синтаксически продолжает предыдущий фрагмент.
