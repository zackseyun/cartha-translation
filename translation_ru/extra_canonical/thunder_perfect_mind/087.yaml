  text: 'Я — слух, доступный каждому,

    и речь, которую невозможно постичь.[a]

    Я — немая, которая не говорит,

    и велико множество моих слов.[b]

    Слушайте меня во гневе,[c]

    и…[d]'
  philosophy: optimal-equivalence
