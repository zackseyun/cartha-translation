review_pass:
  verdict: reject
  source_fidelity: 'Отклонено по источниковедческой причине: приведённый коптский OCR-фрагмент не подтверждает текст сегмента в достаточной мере. В нём различимо ⲉⲣⲱⲧⲛ («вам») после формы, связанной с явлением/видимостью, тогда как основной русский текст утверждает «вы являетесь мне». Кроме того, в самом фрагменте видны слова о «моих членах внутри вас» и последующее иное высказывание; формула «Я — та, от которой вы скрылись» в данном вырезе не засвидетельствована. Английская audit trail честно отмечает эту проблему, но не устраняет несоответствие между OCR и назначенным ему английским текстом.'
  naturalness: Если принимать английское базовое чтение, «Я — та, от которой вы скрылись, и вы являетесь мне» грамматически и стилистически приемлемо для современного литературного русского с возвышенной интонацией. Однако «являетесь мне» намеренно книжно и может быть понято как «вы существуете для меня»; в данном контексте это терпимо только при надёжно установленном значении «появляетесь передо мной».
  terminology: «Та» последовательно передаёт женский род говорящего голоса. «Скрылись» и «являетесь» не содержат конфессионального истолкования. Но направление действия нельзя фиксировать в основном тексте вопреки единственному читаемому местоименному показателю ⲉⲣⲱⲧⲛ («вам»).
  issues:
  - severity: high
    issue: Основной текст противоречит читаемому объектному показателю в OCR.
    rationale: В строке с ⲟⲩⲟⲉⲓⲉ различимо ⲉⲣⲱⲧⲛ, то есть «к/вам», а не ожидаемое для «мне» ⲉⲣⲟⲓ. Сноска не делает безопасным утверждение противоположного направления в основном тексте.
  - severity: high
    issue: Границы и соответствие сегмента не установлены.
    rationale: OCR включает «мои члены внутри вас» и дальнейший материал, но не даёт надёжной основы для первой половины перевода. Английская помета о возможном вторжении соседнего текста означает, что данный блок нельзя окончательно переводить как самостоятельное двустишие без сверки с критическим изданием или изображением страницы.
  - severity: medium
    issue: Сноска a называет «сохранившимся фрагментом» свидетельство, которое фактически относится к сомнительно выровненному OCR-вырезу.
    rationale: Следует точнее различать чтение OCR и установленное чтение рукописи/издания, чтобы не создавать впечатления, будто противоположный вариант надёжно засвидетельствован в границах именно этого высказывания.
