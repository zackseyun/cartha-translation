  text: I am the one from whom you hid yourselves[b][a], and you show yourselves to me.
translation:
  language: ru
  text: 'Я — та, от которой вы скрылись[b],

    и вы являетесь мне[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В сохранившемся фрагменте, по-видимому, стоит ⲉⲣⲱⲧⲛ — «вам», что допускает чтение: «и я являюсь вам». Здесь сохранено традиционное членение: «вы являетесь мне», однако направление действия остаётся неясным.'
    reason: alternative_reading
  - marker: b
    text: Рядом читается выражение ⲛⲛⲁⲙⲉⲗⲟⲥ ϩⲛ ⲧⲏⲩⲧⲛ — «мои члены внутри вас». Поэтому часть соседнего текста могла попасть в этот сегмент, а соответствующий «скрылись» глагол в данном OCR-фрагменте надёжно не различим.
    reason: alignment_note
lexical_decisions:
- source_word: ⲟⲩⲟⲉⲓⲉ
  choice: являетесь
  rationale: Глагол означает «являться, становиться видимым». «Являетесь» сохраняет парадоксальную связь со «скрылись», не усиливая исходный текст до намеренного «показываетесь».
- source_word: ϩⲟⲩⲛ
  choice: направленность передана дательным падежом
  rationale: В сочетании с глаголом явления указывает направление или присутствие; по-русски естественно передаётся формой «мне» либо «вам».
- source_word: ⲉⲣⲱⲧⲛ
  choice: вам (вариант чтения)
  rationale: В доступном OCR явно читается местоименная форма «вам», хотя традиционная сегментация предполагает «мне». В основном тексте сохранена традиционная пара, а расхождение отмечено сноской.
- source_word: '[лексема сокрытия в данном OCR-фрагменте неразличима]'
  choice: скрылись
  rationale: Краткий возвратный глагол естественно воспроизводит засвидетельствованную в традиции парадоксальную пару «скрыться / явиться», при этом сомнительная привязка отмечена сноской.
theological_decisions:
- issue: Род говорящей в формуле самоотождествления
  choice: та
  alternative: тот / безродовая перестройка
  rationale: Говорящий голос произведения представлен в женском роде; форма «та» грамматически естественна и не добавляет отдельного богословского толкования.
- issue: Направление явления
  choice: вы являетесь мне
  alternative: я являюсь вам
  rationale: Основной текст следует традиционной парадоксальной паре «вы скрылись от меня / являетесь мне», но видимое ⲉⲣⲱⲧⲛ поддерживает обратное направление; неопределённость сохранена в сноске.
translation_notes:
  register: Современный литературный русский с торжественной, но ясной формулой самоотождествления. Перенос строки сохраняет афористический параллелизм; порядок сносок приведён к последовательному [b] при сомнительном «скрылись» и [a] при направлении «являетесь».
