  - severity: medium
    issue: Недостаточно ясно выражен субъект действия «раскрыть».
    rationale: Источник, судя по сохранившимся элементам и контексту, допускает олицетворение «несправедливости», которой позволяют открыть их уста. Местоимение «ей» делает эту синтаксическую связь явной, не добавляя смысла.
