  text: It is not my defense when they call[a], and the injustice you have considered[d][c][b], you leave it to open their mouths to judge me.
translation:
  language: ru
  text: '**12.** Это не моя защита, когда они взывают[a]. А несправедливости, которую вы замыслили, вы позволяете раскрыть их уста, чтобы судить меня[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начало и середина фразы повреждены. Глагол ⲙⲟⲩⲧⲉ может означать «звать», «называть» или «взывать»; кто именно и к кому взывает, по этому фрагменту не вполне ясно.
    reason: textual_uncertainty
  - marker: b
    text: 'Конец отрывка также сохранился неполно. Буквально читаются элементы: «несправедливость, которую вы помыслили… вы оставляете/позволяете ей… раскрыть их уста, чтобы судить меня».'
    reason: alignment_and_syntax_note
lexical_decisions:
- source_word: ⲁⲡⲟⲗⲟⲅⲓⲁ
  choice: защита
  rationale: Греческое заимствование означает защитительную речь или выступление в свою защиту; «защита» естественно передаёт юридический контекст.
- source_word: ⲙⲟⲩⲧⲉ (частично сохранившееся ⲙⲟⲩ[)
  choice: взывать
  rationale: Глагол может означать «звать, называть». Из-за повреждения строки и неопределённого дополнения выбрано «взывать», сохраняющее речевой смысл без вставки отсутствующего объекта.
- source_word: ϫⲓⲛϭⲟⲛⲥ
  choice: несправедливость
  rationale: Составное существительное обозначает неправду, несправедливость или насилие; его нельзя смешивать с отдельным значением «число».
- source_word: ⲉⲓⲙⲟⲉⲓⲛ
  choice: замыслить
  rationale: В данном отрицательном и юридическом контексте «замыслить» естественно передаёт «думать, помышлять, обдумывать», сохраняя направленность действия адресатов.
- source_word: ⲭⲣⲟⲉⲓ
  choice: раскрыть
  rationale: Глагол означает «открывать»; при подразумеваемых устах по-русски естественно «раскрыть уста».
- source_word: ⲕⲣⲓⲛⲉ
  choice: судить
  rationale: Греческое заимствование сохраняет прямой юридический смысл «судить, выносить решение».
theological_decisions:
- issue: Лицо и роль говорящей в юридическом образе
  choice: Сохранено первое лицо без отождествления говорящей с конкретной богословской фигурой.
  alternative: Уточнить личность говорящей или истолковать «защиту» как особый титул.
  rationale: Фрагмент не даёт достаточного основания для конфессионального или систематического отождествления.
- issue: Связь несправедливости с судом
  choice: Несправедливость грамматически представлена как то, чему адресаты позволяют привести обвинителей к речи.
  alternative: Понять фразу как прямое обвинение самих адресатов без олицетворения несправедливости.
  rationale: Женское местоименное согласование в коптском поддерживает отсылку к «несправедливости», однако повреждённость текста не позволяет полностью устранить синтаксическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным юридическим образом. Архаизирующее «уста» сохранено только в устойчивом поэтическом сочетании «раскрыть уста». Повреждения источника отмечены сносками, а ошибочно сопоставленный консультационный текст о «множестве слов» не использован.
