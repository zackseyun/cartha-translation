review_pass:
  verdict: revise
  source_fidelity: Черновик верно отказался от несоответствующего данному срезу консультационного текста о «множестве слов» и правильно распознаёт ϫⲓⲛϭⲟⲛⲥ как «несправедливость/насилие», а не «число». Однако «взывают» излишне конкретизирует ⲙⲟⲩⲧⲉ; нейтральное «зовут» лучше сохраняет лексическую неопределённость. В заключительной фразе необходимо явно передать, что адресаты позволяют именно несправедливости открыть «их» уста.
  naturalness: Сочетание «несправедливости ... вы позволяете раскрыть их уста» синтаксически тяжеловесно и без местоимения может ошибочно читаться так, будто адресаты позволяют некой несправедливости как абстракции совершить действие без ясно обозначенной связи. «Вы позволяете ей раскрыть их уста» сохраняет олицетворённую конструкцию источника и естественнее по-русски. «Это не моя защита» оставлено как минимальная передача повреждённого начала, без необоснованного восстановления пропущенного сказуемого.
  terminology: «Защита», «несправедливость», «замыслили», «раскрыть уста» и «судить меня» адекватны юридико-поэтическому регистру. «Уста» допустимо в данном возвышенном образе; конфессиональных интерпретаций не добавлено.
