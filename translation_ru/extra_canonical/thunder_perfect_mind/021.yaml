base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/021.yaml
  text: 'Those who deny me confess me[a],

    and those who confess me deny me.

    Those who speak truth about me lie about me[b],

    and those who lie about me speak truth about me.'
translation:
  language: ru
  text: 'Те, кто отрекается от меня, исповедуют меня[a],

    а те, кто исповедует меня, отрекаются от меня.

    Те, кто говорит обо мне правду, лгут обо мне[b],

    а те, кто лжёт обо мне, говорят обо мне правду.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Консультационный английский текст, привязанный к этому блоку, начинается словами «Я — голос, чьё звучание многообразно…», однако приведённый коптский отрывок содержит антитезу «отрекаются / исповедуют». Вероятно, в этой части страницы произошёл сдвиг привязки; перевод следует представленному коптскому тексту.
    reason: alignment_note
  - marker: b
    text: 'Во второй антитезе OCR-текст местами искажён и в конце обрывается, однако по сохранившимся буквам и параллельному построению восстанавливается смысл: «Те, кто говорит обо мне правду, лгут обо мне, а те, кто лжёт обо мне, говорят обо мне правду».'
    reason: textual_note
lexical_decisions:
- source_word: ⲁⲣⲛⲁ
  choice: отрекается от
  rationale: Сахидское заимствование из греч. ἀρνέομαι означает «отрицать, отрекаться». В исповедальном контексте «отрекаться от» естественно по-русски и сохраняет резкую антитезу с «исповедовать».
- source_word: ϩⲟⲙⲟⲗⲟⲅⲉⲓ
  choice: исповедует
  rationale: Заимствование из греч. ὁμολογεῖν может означать «признавать, исповедовать». «Исповедовать» сохраняет религиозно-судебный оттенок и образует точную смысловую пару с «отрекаться».
- source_word: ⲛⲉⲧ–
  choice: те, кто
  rationale: Субстантивированная относительная конструкция; «те, кто» — нейтральное и естественное соответствие в современном русском языке.
- source_word: ⲙ̄ⲙⲟⲉⲓ
  choice: меня / от меня / обо мне
  rationale: Местоименная объектная форма первого лица единственного числа. Русское управление меняется в зависимости от глагола, поэтому употреблены естественные формы «меня», «от меня» и «обо мне».
- source_word: ϫⲉ ⲙⲉ ⲉⲣⲟⲓ
  choice: говорит обо мне правду
  rationale: Буквально конструкция выражает говорение истины относительно говорящей; такой перевод ясно и естественно передаёт смысл, не сглаживая парадокс.
- source_word: ϫⲓϭⲟⲗ ⲉⲣⲟⲓ
  choice: лжёт обо мне
  rationale: Идиоматическое русское соответствие выражению лжи относительно говорящей; параллелизм с «говорит обо мне правду» сохранён.
theological_decisions:
- issue: 'Парадокс взаимного отрицания: отречение становится исповеданием, а истина — ложью'
  choice: Сохранить обе антитетические пары без объясняющего уточнения
  alternative: Истолковать высказывание как различие между истинным и ложным знанием говорящей
  rationale: Коптский текст намеренно сохраняет напряжённую парадоксальность и не указывает, при каких условиях каждое утверждение верно. Истолкование в основном тексте необоснованно разрешило бы эту двусмысленность.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Повторения и строгий синтаксический параллелизм сохранены как ключевые черты риторики отрывка; женский род не проявляется в этой грамматической форме.
