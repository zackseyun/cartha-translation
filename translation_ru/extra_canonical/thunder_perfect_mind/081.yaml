  text: I am the substance and the one without substance[a][b].
translation:
  language: ru
  text: '**6.** Я — сущность и та, что лишена сущности[a][b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переданное как «сущность» (копт. ⲁⲙⲡⲉ), может также означать «имущество», «достояние» или «средства»; поэтому вторую часть можно понять и как «та, у которой ничего нет».
    reason: lexical_alternative
  - marker: b
    text: В распознанном тексте стоит ⲉⲧⲁⲙⲁⲧⲉ; вероятно, это ошибка распознавания вместо ⲁⲧⲁⲙⲡⲉ — «лишённая сущности (или имущества)». Слова ⲫⲩⲥⲓⲥ, ⲕⲧⲓⲥⲓⲥ и ⲯⲩⲭⲟⲟⲩⲉ могут относиться к соседнему фрагменту, ошибочно попавшему в данный сегмент.
    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲙⲡⲉ (в сочетании ⲛ̄ⲁⲙⲡⲉ)
  choice: сущность
  rationale: Слово может обозначать имущество, средства или достояние, а в данном парадоксальном противопоставлении допускает и более отвлечённое понимание. «Сущность» сохраняет онтологическое звучание и прямую антитезу, не исключая предметного смысла, отмеченного в сноске.
- source_word: 'ⲁⲧⲁⲙⲡⲉ (вероятное чтение: отрицательная приставка ⲁⲧ- + ⲁⲙⲡⲉ)'
  choice: лишена сущности
  rationale: Формулировка естественно передаёт отрицательное образование и сохраняет намеренный парадокс. В отличие от прилагательного «несущественная», она не сводит выражение к оценке маловажности.
theological_decisions:
- issue: Парадокс одновременной сущностности и отсутствия сущности
  choice: Сохранить прямое противоречивое высказывание без толкования
  alternative: Разрешить напряжение через значения «имущество», «достояние» или «средства»
  rationale: Речь построена на череде парадоксальных самоопределений; источник не объясняет, следует ли понимать пару онтологически или имущественно.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Женская форма «та» соответствует женскому голосу произведения. Повтор «сущность — лишена сущности» намеренно сохраняет риторическую симметрию и не устраняет смысловую неоднозначность.
