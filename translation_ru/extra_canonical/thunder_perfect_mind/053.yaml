translation:
  language: ru
  text: '**8.** Я — та, которую вы презирали,[a]


    и Я — та, о которой вы размышляли.


    Я — та, которую вы скрыли,


    и Я — та, которую вы открыли.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальное ⲛ̄ⲧⲟⲟⲧ в приведённом OCR-фрагменте завершает предыдущую фразу («от меня»), а не вводит эту строку словами «что до вас».
    reason: boundary_note
  - marker: b
    text: Глаголы в двух последних строках образуют пару «скрыть — открыть, явить». После этой строки в OCR начинается неполная следующая фраза, здесь не переводимая.
    reason: lexical_and_alignment_note
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Я — та
  rationale: Предикативный артикль женского рода сохраняет женский голос говорящей; русская конструкция естественно передаёт и род, и повторяющуюся формулу самообъявления.
- source_word: ⲕⲁⲧⲁⲫⲣⲟⲛⲓ
  choice: презирали
  rationale: Греческое заимствование от καταφρονέω означает «смотреть свысока, презирать»; перевод «преследовали» не подтверждается видимым коптским словом.
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲉⲓ
  choice: размышляли обо мне
  rationale: Сочетание обозначает направленную на говорящую мысль. «Размышляли» сохраняет смысл без необоснованного уточнения «замышляли против меня».
- source_word: ϩⲱⲡ ⲉⲣⲟⲉⲓ
  choice: схватили
  rationale: Глагол выражает захват или удержание; «схватили» передаёт силу действия, не сужая его до формального ареста.
- source_word: ⲟⲩⲟⲛϩ ⲙⲙⲟⲉⲓ
  choice: оживили
  rationale: Переходная конструкция буквально означает «сделали меня живой, дали мне жизнь»; «оживили» кратко сохраняет параллелизм строк.
theological_decisions:
- issue: Женский род самоназвания говорящей
  choice: Сохранить форму «Я — та»
  alternative: 'Передать нейтрально: «Я — тот, кого…» или «Я — та, кого…» без последовательного повторения'
  rationale: Женский род грамматически выражен в коптском тексте и существенен для голоса произведения; его устранение было бы интерпретационным сглаживанием.
- issue: Характер размышления о говорящей
  choice: Не уточнять, было ли оно благожелательным или враждебным
  alternative: «Вы замышляли против меня»
  rationale: Предлог и глагол допускают мысль или обдумывание, но сами по себе не требуют значения враждебного заговора; напряжение сохраняется без добавления мотива.
translation_notes:
  register: Современный литературный русский язык с торжественным, но ясным ритмом. Анафорическое «Я — та» и четырёхчастный параллелизм сохранены; архаизмы и конфессионально окрашенная терминология не используются.
