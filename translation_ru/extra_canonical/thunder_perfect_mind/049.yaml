  source_fidelity: Основная передача верна и соответствует коптскому тексту данного сегмента, а не ошибочно привязанному раннему варианту об «образе в Египте». «Схватили», «рассеяли», «собрали воедино», «стыдились» и «не знали стыда» адекватно передают последовательность и антитезы текста. Однако исходные союзы ⲁⲩⲱ в обеих соответствующих позициях являются простым «и»; русские «а затем» и особенно «но» добавляют временно-противительный оттенок, который можно безопасно не вносить.
