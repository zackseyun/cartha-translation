base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/049.yaml
  text: And I am she whom you seized[a]. I am she whom you scattered, and you gathered me in. I am she before whom you were ashamed[b][c][d], and you were shameless toward me.
translation:
  language: ru
  text: И я — та, которую вы схватили. Я — та, которую вы рассеяли[a] и собрали воедино. Я — та, перед которой вы стыдились, и по отношению ко мне вы не знали стыда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которую вы отослали прочь».'
    reason: Коптское выражение допускает более буквальное значение удаления или высылки; «рассеяли» подчёркивает противопоставление последующему собиранию.
lexical_decisions:
- source_word: ⲁⲙⲁϩⲧⲉ
  choice: схватили
  rationale: Глагол означает «схватить, овладеть, удержать»; «схватили» естественно передаёт направленное на говорящую насильственное действие.
- source_word: ϫⲟⲟⲩⲥ ⲉⲃⲟⲗ
  choice: рассеяли
  rationale: В данном поэтическом противопоставлении последующему «собрали воедино» выражение передано как «рассеяли»; буквально возможно понимание «отослали прочь».
- source_word: ⲥⲟⲟⲩϩ … ⲉϩⲟⲩⲛ
  choice: собрали воедино
  rationale: Передаёт собирание внутрь или вместе и сохраняет антитезу рассеянию.
- source_word: ϣⲓⲡⲉ
  choice: стыдились
  rationale: Здесь это глагольное значение «испытывать стыд»; конструкция с ϩⲏⲧⲥ обозначает отношение к говорящей.
- source_word: ⲣ-ⲁⲧ-ϣⲓⲡⲉ
  choice: не знали стыда
  rationale: Идиоматическая русская передача буквального «быть бесстыдными»; сохраняет резкий контраст со «стыдились».
theological_decisions:
- issue: Парадокс между стыдом перед говорящей и бесстыдным отношением к ней
  choice: Сохранить обе части без объясняющего согласования
  alternative: Истолковать первую часть как почтительный страх или вторую как отсутствие робости
  rationale: Источник намеренно ставит рядом противоречащие друг другу отношения; перевод не должен устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественным анафорическим повтором «Я — та». Женский род говорящей сохранён. Формулировки ясные и ритмичные, без конфессионально окрашенной терминологии.
