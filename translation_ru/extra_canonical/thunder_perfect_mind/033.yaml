  source_fidelity: 'Первая строка черновика меняет синтаксические роли: ⲉⲣⲟⲉⲓ поддерживает обращение «ко мне», а ⲉⲉⲓⲛⲏⲩ — адресата, приходящего/выходящего, а не говорящую. Остальные основные смысловые решения согласуются с более надёжной корректировкой аудиторского следа: «найдёте меня», «не отвергайте меня», «обездоленные» и «сострадательна».'
  naturalness: 'Русский текст в целом литературный и поэтически сдержанный. «Взгляните на меня: я выхожу...» звучит естественно, но неверно передаёт исходное обращение. Связка «которых считают никчёмными» добавляет не выраженное в коптском суждение других людей; лучше сохранить трудную конструкцию без такого добавления.'
  terminology: «Почитаемые», «обездоленные», «никчёмность» и «сострадательна» уместны. Женская форма в последней строке оправдана грамматическим и литературным голосом говорящей. Не следует сохранять прежние гипотезы о «доме», «видении», «унижении» или «топтании».
