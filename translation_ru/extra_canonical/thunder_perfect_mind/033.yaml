base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/033.yaml
  text: 'Look at me as I come forth among those who are honored[1];

    and in the least places you will find me.

    And do not cast me out among those who are destitute in worthlessness[d][c][b][a][5][4][3][2];

    for I—I am compassionate.'
translation:
  language: ru
  text: '**11.** Взгляните на меня: я выхожу из среды почитаемых,

    и вы найдёте меня в самых незначительных местах.

    Не отвергайте меня среди обездоленных, которых считают никчёмными[a],

    ибо я — я сострадательна.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В основе выражения лежит греческое по происхождению слово со значением «бесполезность, никчёмность». Коптская конструкция трудна; возможен более буквальный перевод: «среди тех, кто обездолен в никчёмности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲛⲉⲧⲧⲁⲉⲓⲏⲩ
  choice: почитаемых
  rationale: Форма связана со значением чести и почёта; «почитаемые» естественно передаёт социально высокое положение и сохраняет контраст с последующими строками.
- source_word: ⲗⲁⲭⲓⲥⲧⲟⲥ ⲧⲟⲡⲟⲥ
  choice: в самых незначительных местах
  rationale: Греческие заимствования передают идею наименьших, низших или неприметных мест. «Незначительные» сохраняет социально-пространственную двусмысленность и звучит естественно по-русски.
- source_word: ⲛⲧⲉⲧⲛϭⲓⲛⲉ ⲙⲙⲟⲓ (восстановление искажённого OCR)
  choice: вы найдёте меня
  rationale: Контекстуальное восстановление рукописного чтения означает «вы найдёте меня»; оно предпочтительнее ошибочного членения OCR как упоминания дома и видения.
- source_word: ⲙ̄ⲡⲣ̄ⲛⲟⲩϫⲧ ⲉⲃⲟⲗ
  choice: не отвергайте меня
  rationale: Буквальный образ — «не выбрасывайте меня вон». Русское «не отвергайте» естественно передаёт исключение из среды людей, не сводя выражение к физическому броску.
- source_word: ⲛⲉⲧ ϣⲁⲁⲧ
  choice: обездоленных
  rationale: Форма указывает на тех, кто лишён необходимого, испытывает недостаток или нужду; «обездоленные» передаёт это состояние без устарелого оттенка.
- source_word: ⲙ̄ⲛ̄ⲧⲁⲭⲣⲏⲥⲧⲏⲣⲟⲥ
  choice: которых считают никчёмными
  rationale: Греческое по происхождению слово обозначает бесполезность или никчёмность. Такая формулировка делает трудную коптскую связь понятной и не утверждает, будто люди действительно лишены ценности.
- source_word: ⲟⲩϣⲁⲛϩⲧⲏⲥ
  choice: сострадательна
  rationale: Это слово означает сострадательного или милосердного человека; женская форма согласуется с голосом говорящей в произведении и не поддерживает ошибочный разбор как «та, которую унизят».
theological_decisions:
- issue: Соединение возвышенного и униженного положения говорящей
  choice: 'Сохранён прямой парадокс: она выходит из среды почитаемых, но находится в незначительных местах и среди обездоленных.'
  alternative: Истолковать строки как указание на определённую общину, небесное существо или христологический образ.
  rationale: Источник не раскрывает однозначно личность говорящей и намеренно удерживает напряжение между честью и унижением; перевод не должен вводить конфессиональное толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтической речи. Повтор «я — я» сохранён как эмфатическая особенность оригинала. Обращение передано во множественном числе по форме последующего глагола. Синтаксис сделан ясным, но контраст чести, низкого положения, отвержения и сострадания не сглажен.
