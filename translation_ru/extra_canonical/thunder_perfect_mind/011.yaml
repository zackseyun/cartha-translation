lexical_decisions:
- source_word: ⲡⲥⲟⲗⲥⲗ
  choice: члены тела
  rationale: Передаёт собирательное обозначение частей тела и сохраняет телесный образ; уточнение «тела» делает выражение естественным и однозначным в современном русском.
- source_word: ⲛⲁϣⲉ
  choice: бесплодная
  rationale: Кратко и прямо обозначает женщину, не способную рождать, сохраняя парадокс с последующим упоминанием множества детей.
- source_word: ⲛⲉⲥϣⲏⲣⲉ
  choice: у неё детей
  rationale: Передаёт форму множественного числа с притяжательным местоимением женского рода; «детей» естественнее и шире, чем «сыновей».
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Я —
  rationale: Сохраняет повторяющуюся формулу самоотождествления и ритм речи.
- source_word: ⲁⲩⲱ
  choice: И
  rationale: Сохраняет паратактическую связь и не сглаживает напряжение между бесплодием и множеством детей.
- source_word: (генитивная конструкция со значением «моей матери»)
  choice: моей матери
  rationale: Передаёт притяжательный смысл без богословской или символической конкретизации.
theological_decisions:
- issue: Переход от первого лица «я — бесплодная» к третьему лицу «у неё»
  choice: Сохранён переход к третьему лицу
  alternative: «И я — бесплодная, но у меня много детей»
  rationale: Форма женского притяжательного местоимения в источнике и английском контрольном слое создаёт намеренно напряжённое самоописание; замена на первое лицо молча устранила бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с кратким, торжественным параллелизмом. Формула «члены тела» сохраняет телесность образа, но избегает нежелательного двусмысленного звучания одиночного слова «члены». Необычный переход к «у неё» оставлен как часть поэтического парадокса.
