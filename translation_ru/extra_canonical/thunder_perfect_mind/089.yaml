translation:
  language: ru
  text: '**5.** Слушайте меня в гневе и учитесь у меня в кротости.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Конец второй фразы в предоставленном OCR читается неуверенно; «в кротости» передаёт вероятное восстановление слова со значением мягкости или кротости. Сочетание «в гневе» также может относиться либо к говорящей, либо к слушающим.
    reason: textual_and_grammatical_ambiguity
lexical_decisions:
- source_word: ⲉⲣⲟⲉⲓ
  choice: меня / у меня
  rationale: Форма с предлогом ⲉ и местоименным суффиксом 1-го лица относится к говорящей; русское управление определяется подразумеваемым глаголом «слушать» в первой части и выражением «учиться у меня» во второй.
- source_word: ⲟⲩϭⲱⲛ
  choice: гнев
  rationale: 'Существительное обозначает гнев или ярость. «В гневе» сохраняет краткость и допускает присущую конструкции неоднозначность: речь может идти как о состоянии говорящей, так и об обстоятельствах слушания.'
- source_word: ϫⲓ ⲥⲃⲱ
  choice: учитесь
  rationale: Устойчивое коптское выражение буквально означает «принимать наставление»; современное русское «учитесь» естественно передаёт его побудительный смысл.
- source_word: ⲟⲩⲙⲏϣⲉ (OCR; вероятно повреждённое чтение слова со значением мягкости/кротости)
  choice: кротость
  rationale: «Кротость» образует ясное противопоставление гневу, сохраняя достоинство и парадоксальность высказывания; чтение исходного слова по данному OCR не вполне надёжно.
theological_decisions:
- issue: Парадоксальное соединение гнева и кротости
  choice: 'Сохранено без истолкования: «в гневе… в кротости»'
  alternative: Снять напряжение пояснительным переводом, например «даже когда вы гневаетесь… спокойно»
  rationale: Источник противопоставляет два состояния или способа действия; перевод не должен заранее определять, к говорящей или к слушателям относится каждое из них.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной формой обращения во множественном числе. Параллелизм двух повелений и контраст «гнев — кротость» сохранены. Мисалигнированный вариант «Я — единение и распад» не использован, поскольку соответствующие слова относятся к другому месту произведения.
