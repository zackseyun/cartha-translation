base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/034.yaml
  text: And do not cast me out among those who are lacking in worthlessness[a]; for I—I am merciful, and I am hard‑hearted. Do not hate my obedience; and my self-control[h][g][f][e][d][c][b], love it in my weakness.
translation:
  language: ru
  text: '**12.** И не изгоняйте меня из числа тех, кому недостаёт никчёмности[a]. Ведь я — я милосердна и бессердечна[b]. Не ненавидьте моё послушание; а моё самообладание любите в моей слабости[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тем, кто испытывает недостаток в никчёмности (непригодности)». Сочетание намеренно или текстуально парадоксально. Традиционный перевод «на навозной куче» не подтверждается словами данного отрывка.'
    reason: lexical_alternative
  - marker: b
    text: 'Коптские выражения противопоставляют мягкое сердце отсутствию сердца; возможна передача: «мягкосердна… бессердечна».'
    reason: lexical_alternative
  - marker: c
    text: «Послушание» можно также перевести как «покорность», а «самообладание» — как «воздержанность». Последняя строка буквально связывает любовь к нему со слабостью говорящей.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙ̄ⲡⲣ̄ⲛⲟⲩϫⲧ ⲉⲃⲟⲗ
  choice: не изгоняйте меня
  rationale: Запретительная форма с глаголом, обозначающим выбрасывание или изгнание. Прямое дополнение «меня» подразумевается контекстом речи от первого лица.
- source_word: ⲛⲉⲧ ϣⲁⲁⲧ ϩⲛ̄ ⲟⲩⲙⲛ̄ⲧⲁⲭⲣⲏⲥⲧⲏⲣⲟⲥ
  choice: те, кому недостаёт никчёмности
  rationale: Передаёт засвидетельствованное парадоксальное сочетание «нуждаться/испытывать недостаток» и абстрактного существительного со значением непригодности или никчёмности, не подменяя его образом навозной кучи из ошибочно согласованного консультационного текста.
- source_word: ⲟⲩϣⲁⲛϩⲧⲏⲥ
  choice: милосердна
  rationale: Идиоматически означает мягкосердечие или сострадательность; «милосердна» естественно по-русски и сохраняет нравственный контраст.
- source_word: ⲟⲩⲁⲧϩⲏⲧ
  choice: жестокосердна
  rationale: Буквально связано с отсутствием сердца; выбранное слово сохраняет прямой парадокс с «милосердна», не сглаживая напряжение.
- source_word: ⲧⲁⲙⲛ̄ⲧⲥⲧⲙⲏⲧ
  choice: моя покорность
  rationale: Образовано от корня «слышать/слушаться» и здесь обозначает послушание или покорность, а не унижение.
- source_word: ⲧⲁⲉⲅⲕⲣⲁⲧⲉⲓⲁ
  choice: моё самообладание
  rationale: Греческое заимствование ἐγκράτεια обозначает власть над собой, воздержанность или самообладание; последнее звучит ясно и современно.
- source_word: ⲛ̄ⲧⲉⲧⲛ̄ ⲙⲉⲣⲓⲧⲥ
  choice: любите
  rationale: Форма глагола «любить» с местоименным объектом; это не глагол «находить».
- source_word: ⲧⲁⲙⲛ̄ⲧϭⲱⲃ
  choice: моя слабость
  rationale: Производное от прилагательного «слабый»; перевод «царства» не имеет опоры в данном чтении.
theological_decisions:
- issue: Парадоксальные самоопределения говорящей
  choice: Сохранены пары «милосердна — жестокосердна» и «самообладание — слабость».
  alternative: Смягчить их как разные обстоятельства или состояния.
  rationale: Жанр произведения строится на неразрешённых антитезах; исходный текст не даёт основания богословски согласовывать их.
- issue: Парадокс «недостаёт никчёмности»
  choice: Сохранена семантическая странность исходного сочетания.
  alternative: Передать традиционным образом «на навозной куче» или исправить смысл до «лишённых достоинства».
  rationale: В представленном коптском отрывке нет слов «видеть» и «навозная куча»; догадка о более гладком смысле устранила бы подлинную либо текстуально обусловленную неоднозначность.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной синтаксической организацией. Женский род сохранён по принятому образу говорящей в произведении. Повтор «я — я» передаёт эмфатическое ⲁⲛⲟⲕ ⲅⲁⲣ ⲁⲛⲟⲕ. Парадоксы и шероховатость первой фразы не нормализованы.
