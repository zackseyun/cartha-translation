- source_word: ϩⲱⲱⲧ / ⲉ ⲧⲟⲟⲧϥ
  choice: перед кем
  rationale: Естественно передаёт пространственно-личное значение «перед лицом / в присутствии» без излишней буквальности.
- source_word: ⲁⲩⲉⲓ … ⲃⲟⲗ (неуверенно сегментированный OCR-фрагмент)
  choice: вы стыдились
  rationale: Чтение поддерживается смысловой антитезой последующей «бесстыдности», хотя сама OCR-последовательность морфологически не вполне надёжна.
- source_word: ⲙⲛⲧⲁⲧ…
  choice: не знали стыда
  rationale: Передаёт абстрактное привативное значение «без стыда / бесстыдство» и сохраняет резкое противопоставление первой половине фразы.
- source_word: ⲙⲙⲟⲉⲓ
  choice: со мной
  rationale: Естественная русская передача отношения к говорящей; не уточняет без необходимости, было ли действие направлено «против» неё.
theological_decisions:
- issue: Женская идентичность говорящей
  choice: «Я — та»
  alternative: «Я — тот / Я — та, кто»
