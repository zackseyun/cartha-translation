  terminology: «Справедливость» допустима как один из возможных контекстуальных эквивалентов для ⲥⲁⲃⲟⲗ, если именно эта лексема действительно является предметом данного самовысказывания. Однако в данном OCR она входит в последовательности, допускающие чтение «внешний/снаружи», и не удостоверяет заявленное предложение. «Заступница» не имеет видимого коптского соответствия; сноска честно отмечает это, однако нельзя оставлять в основном тексте реконструкцию, не подтверждённую источником.
