  language: ru
  text: 'Не оставайся в неведении обо мне.


    Ибо я — первая и последняя;

    я — почитаемая и презираемая[a];

    я — блудница и святая[b];

    я — женщина[c] и дева[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В представленном OCR-тексте стоит форма ⲧϣⲏϣ, которую можно понять как «великая» или «многочисленная»; такое чтение не образует ожидаемой антитезы слову «почитаемая». Перевод следует распространённому восстановлению со значением «презираемая»; чтение остаётся не вполне уверенным.
    reason: textual_uncertainty
  - marker: b
    text: Слово ⲥⲉⲙⲛⲏ может означать также «чистая», «целомудренная» или «почтенная».
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «женщина». По контексту возможно также понимание «жена», что делает противопоставление деве более явным.'
    reason: lexical_alternative
  - marker: d
    text: ⲡⲁⲣ — принятое в наг-хаммадийских рукописях сокращение греческого παρθένος, «дева».
    reason: scribal_abbreviation
