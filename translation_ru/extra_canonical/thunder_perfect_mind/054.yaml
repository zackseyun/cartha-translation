translation:
  language: ru
  text: 'Я — та, от кого вы прячетесь,


    и вы открываете меня.[a]


    Но всякий раз, когда вы прячетесь,


    я сама явлюсь.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Также: «вы являете меня». Глагол означает делать явной, открывать; здесь он не значит «собирать воедино».'
    reason: lexical_alternative
  - marker: b
    text: После этой строки OCR-фрагмент содержит обрывочные слова, вероятно относящиеся к соседним строкам; из-за ненадёжной границы данного отрывка они здесь не восстановлены.
    reason: alignment_note
lexical_decisions:
- source_word: ϩⲱⲡ
  choice: скрываться / скрывать себя
  rationale: Глагол означает «скрывать, прятать». В сочетании с ⲉⲣⲟⲉⲓ естественно передаётся как «скрываться от меня», а с возвратным ⲙⲙⲱⲧⲛ — как «скрывать себя», по-русски «скрываться».
- source_word: ⲟⲩⲟⲛϩ ⲙⲙⲟⲉⲓ
  choice: открываете меня
  rationale: Переходная конструкция означает «делать явной, открывать» говорящую. «Открываете меня» сохраняет противопоставление сокрытия и обнаружения, не подменяя его значениями «собирать» или «оживлять».
- source_word: ϯⲛⲁⲟⲩⲟⲛϩⲧ
  choice: я сама явлюсь
  rationale: Здесь форма передаёт явление самой говорящей; усилительное ϩⲱⲱⲧ отражено словом «сама», а будущее ϯⲛⲁ- — формой «явлюсь».
- source_word: ⲟⲩⲁⲛ ⲇⲉ ⲉⲧⲉⲧⲛϣⲁⲛ-
  choice: но всякий раз, когда
  rationale: Несмотря на неустойчивое OCR-чтение, контекст и условно-временная форма ϣⲁⲛ- требуют временного смысла, а не числительного «один».
theological_decisions:
- issue: Кто действует в строке об откровении
  choice: 'Сохранено различие: адресаты «открывают» говорящую, а затем она «сама является».'
  alternative: Свести обе строки к одному и тому же действию — например, везде перевести «она открывается».
  rationale: Грамматический переход от действия адресатов к самостоятельному явлению говорящей создаёт намеренное напряжение текста и не должен сглаживаться богословским толкованием.
translation_notes:
  register: Современный литературный русский язык с краткими параллельными строками. Женский род «та» и «сама» сохранён по коптским формам. Антитеза «скрываетесь — открываете — явлюсь» передана без конфессионального истолкования.
