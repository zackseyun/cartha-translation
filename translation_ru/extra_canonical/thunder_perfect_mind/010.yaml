- source_word: ⲁⲛⲟⲕ ⲡⲉ/ⲧⲉ
  choice: Я —
  rationale: Обычная саидская именная конструкция с местоимением первого лица; русское тире естественно передаёт связку настоящего времени и сохраняет торжественную формулу самообъявления.
- source_word: ⲧⲙⲁⲁⲩ
  choice: мать
  rationale: Прямое и общеупотребительное соответствие коптскому слову «мать».
- source_word: ⲧϣⲉⲉⲣⲉ (в реконструируемом чтении фразы)
  choice: дочь
  rationale: Такое чтение образует засвидетельствованную парадоксальную пару «мать и дочь»; оно предпочтительнее буквального перевода OCR-чтения ⲧⲥϩⲓⲙⲉ «женщина», которое, вероятно, принадлежит соседней фразе.
- source_word: ⲁⲩⲱ
  choice: и
  rationale: Сохраняет сочинительную связь двух именных определений при одном «Я».
theological_decisions:
- issue: Парадоксальное соединение материнства и дочернего статуса в одном говорящем лице
  choice: 'Сохранено буквально: «Я — мать и дочь»'
  alternative: Разделить высказывание или истолковать образы как относящиеся к разным лицам
  rationale: Источник намеренно соединяет несовместимые на первый взгляд определения; перевод не должен устранять эту богословскую и поэтическую напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткая именная фраза с тире сохраняет торжественный ритм и парадокс оригинала. Артикли по-русски не передаются.
