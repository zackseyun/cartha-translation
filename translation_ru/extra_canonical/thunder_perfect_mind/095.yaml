lexical_decisions:
- source_word: ⲙⲡⲉⲧⲛⲥⲱⲧⲙ
  choice: …вашего слушания
  rationale: Сохраняется видимый в обрывке суффикс 2-го лица множественного числа («вашего») и значение ⲥⲱⲧⲙ «слушание/слышание»; начальная синтаксическая связь утрачена, поэтому поставлено многоточие.
- source_word: ⲁⲛⲟⲕ
  choice: Я —
  rationale: Прямое соответствие коптскому независимому местоимению первого лица; следующий предикат утрачен.
- source_word: ⲧⲁⲡⲟⲗⲟⲅⲓⲁ
  choice: моя защита
  rationale: Греческое заимствование ἀπολογία здесь передано своим обычным значением «защита, оправдание»; притяжательный элемент ⲧⲁ- сохранён как «моя».
- source_word: ⲉⲩϣⲁⲛⲙⲟⲩ[
  choice: если они […]
  rationale: Надёжно передаются условный элемент ϣⲁⲛ и субъект 3-го лица множественного числа; повреждённый глагол не восстанавливается без достаточных оснований.
- source_word: ⲡϫⲓⲛϭⲟⲛⲥ
  choice: несправедливость
  rationale: Номинализованная форма от ϭⲟⲛⲥ обозначает насилие, притеснение или несправедливость; «несправедливость» естественно по-русски и не вводит ошибочного значения «постижение».
theological_decisions:
- issue: Фрагментарность и возможная парадоксальная самохарактеристика говорящей
  choice: Не восстанавливать утраченные утверждения и оставить лакуны явными
  alternative: Дополнить текст по несоответствующему параллельному месту как высказывание о доступном слухе и непостижимой речи
  rationale: Данный коптский отрывок не подтверждает такое восстановление; сохранение лакун предотвращает привнесение богословского или поэтического смысла из другого места произведения.
translation_notes:
  register: Современный литературный русский с сохранением документальной фрагментарности рукописи. Квадратные скобки обозначают лакуны; многоточие в начале указывает, что строка начинается внутри утраченного предложения.
