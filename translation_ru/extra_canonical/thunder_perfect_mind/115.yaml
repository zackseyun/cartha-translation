  - severity: low
    issue: Сноска b предлагает «одинокая и как единство».
    rationale: «Как единство» представляет собой более сильную синтаксическую интерпретацию, чем позволяет ненадёжный OCR. Достаточно отметить, что реконструкция и точное синтаксическое соотношение второго слова не вполне уверены.
