  verdict: revise
  source_fidelity: 'Основной перевод верно следует вероятным чтениям, принятым в английском аудите: «имя», возглашаемое среди мёртвых; присутствующая/пребывающая; будущий суд «по закону». Однако «в единстве» несколько добавляет предложное отношение, которого в реконструируемом коптском словосочетании прямо нет. Лучше передать второй член как «единство», сохранив намеренно резкий парадокс и не истолковывая его.'
  naturalness: Текст в целом литературен и ритмичен. «Одна и единство» необычно, но это оправданная поэтическая буквальность в парадоксальном самоопределении; двоеточие после «пребывает» делает этот ряд естественнее, чем обособление тире с повторным тире.
  terminology: «Закон» корректно передаёт вероятное восстановление греческого заимствования νόμος. Женский род в «та, что пребывает» и «одна» допустим в силу персонифицированного женского голоса произведения, но не должен подаваться как следствие формы данного коптского фрагмента. Сноски сохраняют необходимую осторожность вследствие низкой надёжности OCR и реконструкций.
  issues:
