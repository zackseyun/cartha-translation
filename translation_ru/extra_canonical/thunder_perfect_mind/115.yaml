  text: I am the name cried out among those who are dead; and I am the one who is present—alone and in unity. The one who will judge me by the law—
translation:
  language: ru
  text: Я — имя, возглашаемое среди мёртвых[a]; и я — та, что пребывает, — одна и в единстве[b]. Тот, кто будет судить меня по закону[c], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В OCR стоит ⲡⲓⲛⲁ, однако вероятно чтение ⲡⲓⲣⲁⲛ — «имя». Глагольное выражение допускает также переводы «выкрикиваемое», «провозглашаемое» или «извергаемое».
    reason: Текстологическая реконструкция и лексическая неоднозначность.
  - marker: b
    text: 'Коптский текст, вероятно, сочетает родственные слова со значениями «одна» и «единство»; возможно также: «одинокая и как единство».'
    reason: Сохранение словесного парадокса и альтернативного синтаксического понимания.
  - marker: c
    text: OCR-форма ⲛⲉⲗⲟⲥ, вероятно, представляет собой искажённое ⲛⲟⲙⲟⲥ, греческое заимствование со значением «закон».
    reason: Неуверенное чтение повреждённого или ошибочно распознанного текста.
lexical_decisions:
- source_word: '(ⲡⲓ)ⲣⲁⲛ (OCR: ⲡⲓⲛⲁ)'
  choice: имя
  rationale: Чтение ⲣⲁⲛ («имя») вероятнее повреждённого OCR ⲛⲁ и соответствует формуле самоименования в поэме.
- source_word: ⲧⲁⲧⲧⲱⲱⲛ ⲉⲃⲟⲗ
  choice: возглашаемое
  rationale: Передаёт направленное вовне звучание, не сводя выражение ни только к «изгнанному», ни только к нейтрально «произнесённому».
- source_word: ϩⲛ ⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: среди мёртвых
  rationale: Естественно передаёт ϩⲛ перед множественной относительной конструкцией «те, кто мёртв».
- source_word: ⲡⲉⲧ ϣⲟⲟⲡ
  choice: та, что пребывает
  rationale: Сохраняет оттенок наличного присутствия, а не только отвлечённого существования; женский род согласован с голосом произведения.
- source_word: ⲟⲩⲁⲁⲧ
  choice: одна
  rationale: Кратко и резко передаёт одиночность и сохраняет словесный парадокс со следующим абстрактным существительным.
- source_word: 'ⲙⲛⲧⲟⲩⲁⲁⲧ (OCR: ⲙⲛⲧⲁⲓ)'
  choice: в единстве
  rationale: Вероятная реконструкция обозначает единство/единственность; предложная форма естественно соответствует синтаксису принятого чтения.
- source_word: ⲡⲉⲧⲛⲁⲕⲣⲓⲛⲉ ⲙⲙⲟⲓ
  choice: тот, кто будет судить меня
  rationale: Явно передаёт относительную конструкцию, будущность ⲛⲁ- и юридический смысл греческого заимствования.
- source_word: 'ϩⲁ ⲡⲓ ⲛⲟⲙⲟⲥ (OCR: ⲛⲉⲗⲟⲥ)'
  choice: по закону
  rationale: Идиоматично передаёт основание или меру суда, сохраняя вероятное юридическое чтение νόμος.
theological_decisions:
- issue: Парадокс одиночности и единства
  choice: «одна и в единстве»
  alternative: «единственная и единая»
  rationale: Выбранный вариант не объясняет метафизический смысл и сохраняет напряжение между одиночеством и единством.
- issue: Род говорящей
  choice: 'женский род: «та», «одна»'
  alternative: формально нейтральное «тот, кто… один»
  rationale: В произведении говорит персонифицированный женский голос; русский язык требует родового согласования, тогда как коптская форма сама по себе здесь не устраняет более широкий литературный контекст.
translation_notes:
  register: Современный литературный русский язык с достоинством и ритмической повторностью оригинала. Начальная анафора «Я — …; и я — …» сохранена. Финальное тире оставляет фразу незавершённой, как в данном отрывке.
