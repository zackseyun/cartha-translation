base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/064.yaml
  text: 'For she is wise[a], and she is a small one[e][d][c][b];

    nor turn away great things in parts

    from smallness—

    for they know smallness.'
translation:
  language: ru
  text: '**1.** Ибо она мудра и мала[a].


    И не отделяй великого по частям

    от малости[b] —

    ведь они знают малость.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «она — малая (маленькая)». Возможны оттенки «незначительна», «подобна ребёнку»; перевод «глупа» был бы более истолковательным.'
    reason: lexical_alternative
  - marker: b
    text: Слово означает «малость» и образует контраст с великим. В некоторых контекстах оно может подразумевать простоту или неведение; здесь сохранено его прямое значение.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ϫⲉ
  choice: ибо
  rationale: Частица вводит пояснение или основание; «ибо» сохраняет связность и достоинство поэтической речи.
- source_word: ⲥⲥⲁⲃⲉ
  choice: она мудра
  rationale: Начальное ⲥ- передаёт третье лицо женского рода, а не повелительное наклонение; ⲥⲁⲃⲉ означает «мудрая».
- source_word: ⲟⲩⲕⲟⲩⲉⲓ ⲧⲉ
  choice: она мала
  rationale: Копула ⲧⲉ подтверждает третье лицо женского рода. ⲕⲟⲩⲉⲓ буквально выражает малость; перевод не подменяет её истолкованием «глупа».
- source_word: ⲙⲡⲣⲧⲥⲧⲟ
  choice: не отделяй
  rationale: Отрицательная повелительная конструкция; в сочетании с ⲉⲃⲟⲗ ϩⲛ глагол передаёт удаление или отделение от чего-либо.
- source_word: ϩⲉⲛⲙⲛⲧⲛⲟϭ
  choice: великого
  rationale: Множественная неопределённая форма допускает «великие вещи», однако русское субстантивированное «великое» естественно противопоставляется «малости».
- source_word: ϩⲛ ϩⲉⲛⲙⲉⲣⲟⲥ
  choice: по частям
  rationale: Греческое заимствование ⲙⲉⲣⲟⲥ означает «часть»; оборот сохраняет возможный смысл расчленения или постепенного действия.
- source_word: ⲉⲃⲟⲗ ϩⲛ ⲧⲙⲛⲧⲕⲟⲩⲉⲓ
  choice: от малости
  rationale: Связка ⲉⲃⲟⲗ ϩⲛ обозначает удаление «от», а абстрактное ⲙⲛⲧⲕⲟⲩⲉⲓ буквально соответствует «малости» и поддерживает контраст с великим.
- source_word: ⲉϣⲁⲩⲥⲟⲩⲱⲛ
  choice: они знают
  rationale: Форма понята как обобщённо-аористическая, а ⲥⲟⲩⲱⲛ — как вариант ⲥⲟⲟⲩⲛ «знать»; она не передаёт значение «пока не».
- source_word: ⲅⲁⲣ
  choice: ведь
  rationale: Пояснительная частица; «ведь» естественно вводит обоснование в современном русском стихотворном синтаксисе.
theological_decisions:
- issue: Парадокс мудрости и малости
  choice: Сохранить прямое сочетание «она мудра и мала»
  alternative: «Она мудра и глупа/невежественна»
  rationale: Источник противопоставляет мудрость малости, но сам по себе не требует нравственной или интеллектуальной оценки; буквальный образ сохраняет парадокс без внесения доктринального истолкования.
- issue: Связь великого с малостью
  choice: Передать запрет на отделение великого от малости
  alternative: «Не отнимай величие частями»
  rationale: Так учитывается сочетание глагола с ⲉⲃⲟⲗ ϩⲛ и сохраняется напряжение между великим и малым, не уточняя, кому они принадлежат.
translation_notes:
  register: Современный литературный русский с краткими поэтическими строками. Синтаксическая шероховатость образа «великого по частям» сохранена намеренно, поскольку коптский текст допускает понимание как «великое, разделённое на части» и как «отделять великое по частям».
