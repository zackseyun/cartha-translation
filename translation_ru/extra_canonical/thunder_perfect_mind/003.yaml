base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/003.yaml
  text: 'And you hearers, listen to me.

    You who wait for me, take me to yourselves,

    and do not cast me from your sight,

    and do not let your voice hate me, nor your hearing.'
translation:
  language: ru
  text: '**3.** И вы, слушающие, слушайте меня.


    Вы, ожидающие меня[a], примите меня к себе


    и не прогоняйте меня с глаз ваших[b],


    и не позволяйте ни вашему голосу, ни вашему слуху ненавидеть меня[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Глагол может означать не только «ожидать», но и «сильно желать, стремиться». Поэтому возможен перевод: «Вы, жаждущие меня».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не выбрасывайте (не изгоняйте) меня прочь от вашего лица». «Лицо» здесь может обозначать присутствие или поле зрения; поэтому также возможно: «не удаляйте меня с глаз ваших».'
    reason: lexical_alternative
  - marker: c
    text: 'Необычная конструкция сохранена: «ненавидеть меня» относится и к голосу, и к слуху. Её можно понимать как призыв не отвергать говорящую ни речью, ни слушанием, однако текст прямо этого не разъясняет.'
    reason: ambiguity
lexical_decisions:
- source_word: ⲛⲣⲉϥⲥⲱⲧⲙ … ⲥⲱⲧⲙ ⲉⲣⲟⲓ
  choice: слушающие, слушайте меня
  rationale: Сохраняет однокоренной повтор исходного текста и прямое обращение; «слушать» в русском естественно передаёт требование внимать, а не просто воспринимать звук.
- source_word: ⲧⲟϣⲧ
  choice: ожидающие меня
  rationale: Передаёт основное значение ожидания без добавления эмоционального оттенка; возможное значение сильного желания отмечено в сноске.
- source_word: ϣⲟⲡⲧ ⲉⲣⲱⲧⲛ
  choice: примите меня к себе
  rationale: Естественно передаёт призыв принять говорящую в свою среду; не усиливает его до «обнимите».
- source_word: ⲙⲡⲣⲛⲟⲩϫⲧ ⲉⲃⲟⲗ ϩⲙ ⲡⲉⲧⲛϩⲟ
  choice: не изгоняйте меня от лица вашего
  rationale: Следует исправленному чтению рукописи, а не искажённому OCR. Формула намеренно сохраняет образ лица, одновременно допускающий смысл удаления из поля зрения.
- source_word: ⲙⲡⲣⲧⲣⲉⲡⲉⲧⲛϩⲣⲟⲟⲩ ⲙⲥⲧⲱⲉⲓ
  choice: не позволяйте вашему голосу ненавидеть меня
  rationale: Сохраняет необычное олицетворение голоса и не заменяет его более обычным, но менее точным выражением вроде «не говорите обо мне с ненавистью».
- source_word: ⲡⲉⲧⲛⲥⲱⲧⲙ
  choice: вашему слуху
  rationale: Сохраняет параллель между голосом и слухом, а также странность незавершённо-эллиптической конструкции.
theological_decisions:
- issue: Личность и статус говорящей
  choice: Не уточнять, кем является говорящая
  alternative: Истолковать голос как конкретную божественную фигуру или персонифицированную Премудрость
  rationale: В данном отрывке самоопределение отсутствует; конфессиональная или мифологическая конкретизация внесла бы в перевод внешнее толкование.
- issue: Образ ненавидящих голоса и слуха
  choice: Сохранить буквальное олицетворение
  alternative: Рационализировать как враждебную речь и нежелание слушать
  rationale: Необычный образ составляет часть риторического и богословского напряжения текста; его не следует молча объяснять в основном переводе.
translation_notes:
  register: Современный литературный русский с достоинством и ритмическим параллелизмом. Повтор «слушающие, слушайте» и олицетворение голоса и слуха сохранены. Умеренно возвышенное «от лица вашего» удерживает исходный образ; оно не заменено более разговорным «с глаз долой». Перевод опирается на исправленное чтение рукописи NHC VI,2 13:10–13, поскольку предоставленный OCR в этой части существенно искажён.
