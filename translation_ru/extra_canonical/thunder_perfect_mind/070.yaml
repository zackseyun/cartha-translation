- source_word: ⲧⲥⲙⲏ ⲛ̄ⲛⲓⲥⲙⲏ
  choice: голос голосов
  rationale: Сохранена выразительная генитивная конструкция оригинала без попытки свести её к одному определённому значению.
- source_word: ⲙⲡⲙⲁ ⲛⲑⲉⲱⲥⲓⲥ
  choice: в обители Бога
  rationale: Буквально — «в месте Бога». «Обитель» естественно звучит по-русски и сохраняет сакральный пространственный смысл.
- source_word: ⲛ̄ⲧⲁⲩⲧⲁⲟⲩⲟ
  choice: который они возвестили
  rationale: Форма выражает совершённое действие изречения, провозглашения или испускания голоса. «Возвестили» соответствует торжественному контексту.
