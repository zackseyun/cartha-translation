  source_fidelity: 'Первые две именные группы переданы в целом верно: ⲅⲓⲛⲉ — «нахождение/обретение», ⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲉⲓ — «тех, кто ищет меня», а ⲁⲓⲧⲉⲓ — «просит меня». Однако ⲛ̄ⲧⲁⲩⲧⲁⲟⲩⲟ относится к ⲧⲁⲟⲩⲟ, «почитать, воздавать честь, прославлять», а не к возвещению или изречению. Кроме того, «обитель» добавляет не выраженный в ⲡⲙⲁ («место») смысл жилища.'
  naturalness: '«Обретение тех, кто ищет меня» и «повеление тех, кто просит меня» возможны в намеренно парадоксальной именной поэтике текста. Формула «голос ангелов, который они возвестили» синтаксически и семантически неудачна: ангелы оказываются теми, кто «возвестил» собственный голос. Более буквальная сжатая конструкция лучше сохраняет неясную связь определений.'
  terminology: «Бог» и «ангелы» уместны. «Место Бога» следует предпочесть «обители Бога», поскольку последнее толкует пространственный термин. «Просить» точнее, чем «вопрошать» для ⲁⲓⲧⲉⲓ в данном фрагменте; возможный оттенок «вопрошать» не требуется выносить как равнозначный.
