lexical_decisions:
- source_word: ⲙⲛ̄ ⲛⲉⲛⲧⲁⲩⲧⲛ̄ⲛⲟⲟⲩ
  choice: с теми, кто был послан
  rationale: ⲙⲛ̄ имеет комитативное значение «с», а ⲧⲛ̄ⲛⲟⲟⲩ означает «посылать». Пассивное «кто был послан» сохраняет естественную двусмысленность формы, которая также может быть понята как «кого они послали».
- source_word: ⲧⲱⲱⲛ ⲉⲃⲟⲗ
  choice: изгнанная
  rationale: Идиома передаёт удаление или изгнание; краткое «изгнанная» сохраняет торжественный параллелизм и голос говорящей.
- source_word: ϩⲛ ⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: среди мёртвых
  rationale: ϩⲛ при множественной группе естественно означает «среди», а ⲙⲟⲟⲩⲧ — статив со значением состояния «мёртвые», не процесса умирания.
- source_word: ⲡⲉⲧ ϣⲟⲟⲡ
  choice: та, кто существует
  rationale: ϣⲟⲟⲡ означает «быть, присутствовать, существовать»; «существует» сохраняет онтологический оттенок и формулу самообъявления.
- source_word: ⲟⲩⲁⲁⲧ
  choice: одна
  rationale: Слово выражает отдельность, одиночность или единственность. «Одна» сохраняет лаконизм, не устраняя возможного оттенка уникальности.
- source_word: ⲙⲛⲧⲁⲓ(ⲱⲛ)
  choice: вечная
  rationale: Сохранившаяся форма, вероятно, продолжается как обозначение вечности или эона. «Вечная» передаёт предполагаемую именную характеристику говорящей и ритмически соответствует предшествующей строке.
theological_decisions:
- issue: Парадокс изгнания, пребывания среди мёртвых и одинокого существования
  choice: Сохранить без согласования и объяснительного дополнения
  alternative: Истолковать «существует одна» как прямое утверждение абсолютной божественной исключительности
  rationale: Текст намеренно соединяет противоположные самоописания. Перевод не должен превращать поэтическое и богословское напряжение в определённую конфессиональную формулу.
- issue: Грамматический род голоса
  choice: 'Передать говорящую в женском роде: «изгнанная», «та», «одна», «вечная»'
  alternative: Перестроить все строки без указания рода
  rationale: В русском языке естественное и связное воспроизведение голоса произведения требует рода; женский род соответствует самопредставлению говорящей в «Громе, Совершенном Уме», не добавляя отдельного учения о её природе.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и оракульным ритмом. Строковое членение сохраняет параллелизм. Архаизмы и конфессионально окрашенная терминология не вводятся; лакуны и неустранимая неоднозначность отмечены явно.
