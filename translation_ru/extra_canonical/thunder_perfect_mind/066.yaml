translation:
  language: ru
  text: 'И вы чтите меня[a].


    Вы презрели меня и увидели меня.


    Не рассеивайте того, что было прежде[b]…


    Не размышляйте[c]…


    Ваши члены[d]…'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оказываете мне честь». Коптское ⲧⲁⲉⲓⲟ здесь означает «чтить», а не «обнимать».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможны буквальные передачи: «не рассеивайте первое» или «не рассеивайте прежнее». Конец следующей строки повреждён, поэтому точная связь слов неясна.'
    reason: textual_uncertainty
  - marker: c
    text: Заимствованный глагол может также означать «упражняться» или «практиковать». Продолжение утрачено.
    reason: lexical_alternative
  - marker: d
    text: 'Или: «части тела». Сохранилось лишь слово в повреждённом окружении; его синтаксическую роль надёжно установить нельзя.'
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲧⲁⲉⲓⲟ
  choice: чтите
  rationale: В данном контексте обычное значение глагола — «чтить, оказывать честь». Перевод «обнимать» опирается на ошибочно соотнесённый консультационный текст и не подтверждается приведённым коптским фрагментом.
- source_word: ϣⲱϥ
  choice: презрели
  rationale: Форма ⲁⲧⲉⲧⲛϣⲱϥ разбирается как перфект второго лица множественного числа, а не как сочетание с привативным ⲁⲧ-. «Презрели» естественно передаёт значение глагола и сохраняет контраст с «чтите».
- source_word: ⲛⲁ
  choice: увидели
  rationale: После перфектного показателя ⲁⲧⲉⲧⲛ форма передаёт действие видения; дополнение «меня» в русском восстановлено по ближайшему контексту, но отдельно не маркируется из-за синтаксической связности строки.
- source_word: ⲡⲟⲩϩⲧ ⲉⲃⲟⲗ
  choice: рассеивайте
  rationale: Отрицательный императив означает «не рассеивайте / не разбрасывайте / не изливайте». «Рассеивайте» сохраняет образ удаления во множество направлений без излишней конкретизации.
- source_word: ⲛⲛϣⲟⲣⲡ
  choice: того, что было прежде
  rationale: Буквально выражение указывает на «первых» или «прежнее». Нейтральная субстантивация по-русски сохраняет временно-порядковую неоднозначность.
- source_word: ⲙⲉⲗⲉⲧⲁ
  choice: размышляйте
  rationale: Греческое заимствование допускает значения «размышлять, упражняться, практиковать». Из-за разрушенного продолжения выбрано наиболее нейтральное значение мыслительной деятельности.
- source_word: ⲗⲁⲁⲧⲉ
  choice: члены
  rationale: «Члены» сохраняет телесное значение слова и вместе с тем не исключает более широкого значения «части»; окружающий текст повреждён, поэтому связь слова с предложением не восстанавливается.
theological_decisions:
- issue: Контраст между почитанием и презрением
  choice: Сохранить прямой контраст «чтите / презрели»
  alternative: Сгладить контраст или прочитать первую строку как «обнимите меня»
  rationale: Антитетичность характерна для произведения и непосредственно следует из доступного коптского текста; её не следует устранять толкованием.
- issue: Восстановление повреждённых строк
  choice: Обозначить лакуны многоточиями и не достраивать богословский смысл
  alternative: Восстановить связное высказывание по ранее использованному английскому консультационному тексту
  rationale: Консультационный текст относится к иному или неверно выровненному месту. Достраивание создало бы не засвидетельствованную источником антитезу стыда и бесстыдства.
translation_notes:
  register: Современный литературный русский с краткими, торжественными строками. Повторы и резкий парадокс сохранены. Повреждения рукописи обозначены многоточиями; ошибочно выровненный мотив «стыда / бесстыдства» не внесён.
