translation:
  language: ru
  text: 'те, кто пребывает со мной,


    и женщины, пребывающие в сердце.



    Я — почитаемая,


    и та, кого восхваляют,


    и та, кого презирают с насмешкой.



    Я —'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ϣⲟⲟⲡ ⲛ̄ⲙⲙⲁⲉⲓ
  choice: пребывают со мной
  rationale: Передаёт экзистенциально-локативное значение ϣⲟⲟⲡ и простое значение сочетания ⲛ̄ⲙⲙⲁⲉⲓ; форму не следует превращать в повеление.
- source_word: ⲛⲓϩⲓⲟⲙⲉ
  choice: женщины
  rationale: Это множественное число слова «женщина», а не обозначение бедных или нуждающихся.
- source_word: ⲉⲧϣⲟⲟⲡ ⲛ̄ϩⲏⲧ
  choice: которые пребывают внутри
  rationale: Относительное предложение с локативным ⲛ̄ϩⲏⲧ; «внутри» сохраняет отсутствие явно названного объекта или носителя.
- source_word: ⲁⲛⲟⲕ ⲧⲉ ⲧⲉⲧⲧⲁⲉⲓⲏⲟⲩ
  choice: Я — почитаемая
  rationale: Женская копульная конструкция и субстантивированная форма передают говорящую как «ту, которую почитают»; это не «мой облик».
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ ⲣⲟⲥ
  choice: та, кого восхваляют
  rationale: ⲥⲙⲟⲩ здесь естественно означает «хвалить, восхвалять»; ⲉⲣⲟⲥ, отражённое OCR как ⲣⲟⲥ, вводит объект женского рода, а не существительное «лицо».
- source_word: ⲧⲉⲧⲟⲩⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲙⲙⲟⲥ
  choice: та, кого презирают
  rationale: Греческое заимствование καταφρονεῖν означает «презирать»; объектное местоимение женского рода относится к говорящей.
- source_word: ϩⲛ ⲟⲩϣⲱⲥ
  choice: с насмешкой
  rationale: В данном построении выражение характеризует презрительное осмеяние, а не произнесение чего-либо «голосом».
- source_word: ⲁⲛⲟⲕ
  choice: Я —
  rationale: Сохраняет начатую в конце фрагмента формулу самоопределения, которая продолжается далее.
theological_decisions:
- issue: Парадокс почитания и презрения одной и той же говорящей
  choice: Сохранён прямой ряд взаимоисключительно звучащих самоопределений
  alternative: Согласовать высказывания или отнести их к разным группам
  rationale: Коптский текст намеренно соединяет противоположные характеристики; перевод не должен устранять это напряжение.
- issue: Женский род говорящей
  choice: «почитаемая» и «та, кого…»
  alternative: Нейтральное «тот, кого…» или безличное «меня…»
  rationale: Формы ⲧⲉ и ⲧⲉⲧ… явно маркируют женский род, значимый для голоса произведения.
translation_notes:
  register: Современный литературный русский с торжественным, но доступным ритмом. Повтор «и та, кого…» сохраняет анафорическую форму и парадоксальный строй оригинала. Начальная строчная буква и незавершённое «Я —» отражают фрагментарные границы данного блока.
