base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/104.yaml
  text: '...you[a], he made him a pattern within you. And what you see outside you, you see me within you. It is visible, and it is your garment. Listen to me[d][c][b], you hearers.'
translation:
  language: ru
  text: …вас — он сделал его образом того, что внутри вас. А то, что вы видите вне себя, — вы видите меня внутри себя. Оно явлено и служит вам одеянием. Слушайте меня, слушатели.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сопоставление с факсимиле указывает, что в распознанном тексте, вероятно, повреждены несколько знаков: фраза, переданная как «служит вам одеянием», восстанавливается приблизительно как «это ваше одеяние». Кроме того, данный отрывок не содержит слов «Я — справедливость»; привязка заголовка или сегмента, возможно, смещена.'
    reason: textual_and_alignment_note
lexical_decisions:
- source_word: ⲣⲧⲩⲡⲟⲥ
  choice: сделал … образом
  rationale: Греческое заимствование τύπος обозначает образ, образец или прообраз; «образом» естественно передаёт здесь результат действия.
- source_word: ⲥⲁϩⲟⲩⲛ
  choice: внутри вас
  rationale: Пространственное выражение означает внутреннюю сторону и противопоставлено ⲥⲁⲛⲃⲟⲗ, «вне/снаружи».
- source_word: ⲥⲁⲛⲃⲟⲗ
  choice: вне себя
  rationale: Передаёт внешнюю сторону в параллельном противопоставлении внутреннему; возвратное местоимение естественно для русского адресата во множественном числе.
- source_word: ⲟⲩⲟⲛϩ ⲉⲃⲟⲗ
  choice: явлено
  rationale: Форма означает проявленность или видимость, а не повеление «живите»; «явлено» сохраняет поэтический регистр.
- source_word: ⲧⲉⲧⲛϩⲃⲥⲱ ⲧⲉ (восстановление предполагаемого повреждённого OCR)
  choice: служит вам одеянием
  rationale: Контекстуальное восстановление даёт «это ваше одеяние»; глагольная формулировка по-русски яснее, не меняя образа.
- source_word: ⲁⲕⲣⲟⲁⲧⲏⲥ
  choice: слушатели
  rationale: Греческое ἀκροατής значит «слушатель»; повтор с «слушайте» сохраняет риторическое созвучие.
theological_decisions:
- issue: Соотношение внутреннего и внешнего
  choice: Сохранено прямое парадоксальное отождествление увиденного вовне с говорящей, увиденной внутри.
  alternative: Истолковать внешний образ как символ внутренней духовной сущности.
  rationale: Источник формулирует напряжённое образное утверждение, но не разъясняет его; перевод не должен вводить дополнительную доктрину.
translation_notes:
  register: Современный литературный русский с торжественным поэтическим ритмом. Начальное многоточие сохраняет фрагментарное начало исходного отрывка. Местоимение говорящей передано строчной буквой без конфессиональной интерпретации.
