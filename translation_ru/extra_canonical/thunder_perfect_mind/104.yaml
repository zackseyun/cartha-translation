review_pass:
  verdict: revise
  source_fidelity: 'Начальная фраза передана с добавлением, которого в данном фрагменте нет: «образом того, что внутри вас» превращает пространственное «внутри вас» в содержание образа. В Coptic ⲙⲡⲉⲧⲛⲥⲁϩⲟⲩⲛ и ⲙⲡⲉⲧⲛⲥⲁⲛⲃⲟⲗ образуют антитезу «внутри вас / вне вас». Местоимение ⲉⲣⲟⲓ следует сохранить как «меня». Концовка с «одеянием» зависит от вероятного повреждения OCR и должна быть отмечена без подмены восстановленного именного сказуемого иной, более толковательной конструкцией.'
  naturalness: Текст в целом литературен и сохраняет фрагментарное начало. «Вне вас» в параллели с «внутри вас» точнее и естественнее, чем смешение «вне себя» и «внутри себя». «Это ваше одеяние» звучит по-русски ясно и ближе к предполагаемому чтению, чем «служит вам одеянием».
  terminology: «Образ» уместно передаёт ⲧⲩⲡⲟⲥ без навязывания догматического значения. «Слушатели» — удачный современный эквивалент греческого заимствования ⲁⲕⲣⲟⲁⲧⲏⲥ. Не следует называть говорящую «справедливостью» в этом блоке, поскольку это отсутствует в выровненном фрагменте.
  issues:
  - severity: medium
    issue: Добавлено содержание к выражению «внутри вас»
    rationale: Формула «образом того, что внутри вас» означает, что он является образом некоей внутренней реальности. Исходная последовательность после «сделал его образом» содержит пространственное определение «внутри вас», а не конструкцию «образ чего-либо».
  - severity: low
    issue: Неоднородна передача адресатного пространства
    rationale: «Вне себя» и «внутри себя» возможны по-русски, но источник последовательно обращается к «вам»; «вне вас / внутри вас» лучше сохраняет параллелизм.
  - severity: low
    issue: «Служит вам одеянием» чрезмерно перефразирует предполагаемое восстановление
    rationale: Согласно указанному восстановлению, смысл — «это ваше одеяние». Именное сказуемое следует предпочесть, а текстологическую неуверенность оставить в примечании.
  revised_text: …внутри вас он сделал его образом. А то, что вы видите вне вас, — меня вы видите внутри вас. Оно явлено, и это ваше одеяние. Слушайте меня, слушатели.[a]
  revised_footnotes:
  - marker: a
    text: 'В распознанном тексте конец фразы перед «Слушайте меня» выглядит повреждённым: ⲧⲉⲧⲛⲣⲥⲱ ⲧⲉ. По контексту и сопоставлению с факсимиле здесь, вероятно, следует читать «это ваше одеяние» (ср. предполагаемое ⲧⲉⲧⲛϩⲃⲥⲱ ⲧⲉ). Данный фрагмент также не содержит слов «Я — справедливость»; возможно, привязка заголовка или сегмента смещена.'
    reason: textual_and_alignment_note
  revision_rationale: 'Исправлена синтаксическая связь начальной фразы: «внутри вас» сохранено как пространственное определение при «сделал его образом», без добавления «того, что». Выравнены «вне вас / внутри вас», сохранено прямое «меня», а выражение об одеянии приведено к наиболее вероятному, менее интерпретирующему восстановлению. Примечание удерживает текстологическую и сегментную неопределённость.'
