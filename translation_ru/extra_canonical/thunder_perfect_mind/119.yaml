lexical_decisions:
- source_word: ⲁⲩⲱ ⲥⲉⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: И они найдут меня
  rationale: ⲁⲩⲱ передаёт продолжение («и»), форма с ⲛⲁ обозначает будущее, а ⲙⲙⲟⲉⲓ — объект первого лица («меня»).
- source_word: ⲙⲡⲙⲁ ⲉⲧⲙⲙⲁⲩ
  choice: в том месте
  rationale: Буквальное и естественное соответствие указательному обороту; контекст не позволяет конкретизировать место.
- source_word: ⲛⲥⲉⲱⲛϩ
  choice: и будут жить
  rationale: Продолженная целевая/последовательная форма допускает оттенок результата; в русском связное «и будут жить» сохраняет его без излишнего уточнения.
- source_word: ⲁⲩⲱ ⲛⲥⲉⲧⲙⲥⲱⲧ (повреждённое OCR-чтение)
  choice: и больше не умрут
  rationale: Конец OCR явно ненадёжен; по пересмотренному чтению здесь восстанавливается отрицание повторной смерти, вероятно ⲛⲥⲉⲧⲙⲙⲟⲩ ⲟⲛ. «Больше не умрут» естественно передаёт «не умрут снова».
theological_decisions:
- issue: Характер обещанной жизни
  choice: будут жить, и больше не умрут
