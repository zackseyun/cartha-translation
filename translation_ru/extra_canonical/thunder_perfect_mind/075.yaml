base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/075.yaml
  text: I am the honored one and the one they bless[a], and the one they despise with contempt. I am Peace, and because of me there is War. I am Peace[e][d][c][b], and because of me there is War.
translation:
  language: ru
  text: Я — почитаемая и та, кого благословляют, и та, кого презирают с презрением. Я — Мир, и из-за меня — Война.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможное иное чтение: «Я — Мир, и Я — Война». Сохранившаяся форма допускает разбор «из-за меня», но состояние текста не позволяет полностью исключить альтернативу.'
    reason: alternative_reading
lexical_decisions:
- source_word: ⲧⲁⲉⲓⲏⲟⲩ
  choice: почитаемая
  rationale: Форма понята как качественное состояние от ⲧⲁⲉⲓⲟ — «почитать, чтить», а не как форма глагола «приходить».
- source_word: ⲧⲉⲧⲟⲩⲥⲙⲟⲩ ⲣⲟⲥ
  choice: та, кого благословляют
  rationale: Конец одной строки и начало следующей читаются слитно как конструкция со ⲥⲙⲟⲩ «благословлять» и ⲉⲣⲟⲥ «её»; это также сохраняет антитезу с последующим «презирают».
- source_word: ⲧⲉⲧⲟⲩⲕⲁⲧⲁⲫⲣⲟⲛⲓ ⲙⲙⲟⲥ ϩⲛ ⲟⲩϣⲱⲥ
  choice: та, кого презирают с презрением
  rationale: 'Греческое заимствование передаёт значение «презирать», а предложная группа усиливает способ действия: «с презрением». Намеренная словесная перекличка приемлема в торжественно-парадоксальной речи.'
- source_word: ϯⲣⲏⲛⲏ
  choice: Я — Мир
  rationale: Греческое заимствование εἰρήνη однозначно означает «мир»; прописная буква сохраняет олицетворённый, титульный характер самообозначения.
- source_word: ⲛⲧⲁ ⲡⲡⲟⲗⲉⲙⲟⲥ
  choice: из-за меня — Война
  rationale: ⲛⲧⲁ- допускает причинное понимание «из-за меня», а ⲡⲡⲟⲗⲉⲙⲟⲥ — греческое заимствование «война». Эллиптическая русская конструкция сохраняет краткость и парадокс исходника.
theological_decisions:
- issue: Связь говорящей с Миром и Войной
  choice: «Я — Мир, и из-за меня — Война»
  alternative: «Я — Мир, и Я — Война»
  rationale: Выбранное причинное чтение лучше соответствует форме ⲛⲧⲁ и не устраняет напряжённый парадокс; грамматически возможная альтернатива вынесена в примечание.
translation_notes:
  register: Современный литературный русский язык с торжественным ритмом и сохранением цепочки самоопределений. Женский род обусловлен формами говорящей в коптском тексте. «Мир» и «Война» написаны с прописной буквы как олицетворённые наименования. Повтор английского предложения о Мире и Войне не воспроизведён, поскольку в данном коптском фрагменте оно встречается один раз.
