  text: '**1.** Слушайте меня, те, кто слышит,[a] и вникайте в мои слова, те, кто знает меня.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Повинуйтесь мне, повинующиеся». Однако чтение «слушайте… те, кто слышит» лучше сохраняет вероятный повтор коптского глагола со значением «слышать, слушать».'
    reason: lexical_alternative
  - marker: b
    text: Приведённый OCR-фрагмент имеет низкую надёжность привязки к этой строке и содержит, по-видимому, материал из соседних строк, в том числе слова «имя» и «голоса». Поэтому текст строки передан по её общепринятой реконструкции; границы фрагмента требуют сверки с факсимиле.
    reason: alignment_note
lexical_decisions:
- source_word: ⲥⲱⲧⲙ (в реконструируемой строке)
  choice: слушайте / слышит
  rationale: 'Основное значение — «слышать, слушать». Повтор корня сохранён, поскольку он образует намеренный параллелизм: «слушайте… те, кто слышит».'
- source_word: ϣⲁϫⲉ
  choice: слова
  rationale: «Слова» естественно передаёт множественное число и содержание наставления, которое адресаты должны усвоить.
- source_word: элемент со значением «учиться, узнавать» в реконструируемой строке
  choice: вникайте
  rationale: По-русски «вникайте в мои слова» звучит естественно и передаёт не простое запоминание, а внимательное постижение сказанного.
- source_word: ⲥⲟⲟⲩⲛ (в реконструируемой строке)
  choice: знает
  rationale: Сохранено прямое и богословски нейтральное значение «знать» без уточнения характера этого знания.
theological_decisions:
- issue: Передача первого повеления как «слушайте» или «повинуйтесь»
  choice: слушайте
  alternative: повинуйтесь
  rationale: Для реконструируемого ⲥⲱⲧⲙ первично значение слышания/слушания; оно также сохраняет словесный повтор с обращением к «тем, кто слышит». Возможный смысл послушания не внесён в основной текст как единственное толкование.
translation_notes:
  register: Современный литературный русский язык; обращение торжественное, но ясное. Параллельные конструкции «те, кто слышит» и «те, кто знает меня» сохранены. Формула «вникайте в мои слова» выбрана как естественная русская передача призыва учиться из слов или постигать их.
