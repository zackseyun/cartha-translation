translation:
  language: ru
  text: '**8.** Я — разделение и обнажение.


    Я — обитель[a].


    И я — грабёж; я —


    тот, кто видит то, что нисходит


    ко мне.


    Я — бегство освобождения[b].


    Я — это я.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Обитель» передаёт греческое заимствование μονή — «жилище, место пребывания».
    reason: cultural_note
  - marker: b
    text: 'Буквально: «бегство освобождения (отпускания)». Связь между существительными остаётся неоднозначной; варианты вроде «бегство к освобождению» уже истолковывали бы её.'
    reason: ambiguity
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲡⲉ
  choice: Я —
  rationale: Повторяющаяся копульная формула передана одинаково, чтобы сохранить настойчивый ритм речи «Я есмь», но без архаического русского оборота.
- source_word: ⲡⲡⲱⲧⲣ
  choice: разделение
  rationale: Передаёт значение разделения; чтение и значение формы не вполне надёжны из-за характера OCR, поэтому возможная пространственная трактовка отмечена в сноске.
- source_word: ⲡⲕⲱⲗⲉⲃⲟⲗ
  choice: обнажение
  rationale: Передаёт действие снятия или раскрытия; не объединяется безоговорочно с ⲡⲕⲱⲗ, поскольку последняя форма имеет самостоятельное значение «грабёж».
- source_word: ⲧⲙⲟⲛⲏ
  choice: обитель
  rationale: Греческое заимствование μονή означает место пребывания, жилище; «обитель» сохраняет предметно-пространственный и возвышенный оттенок.
- source_word: ⲡⲕⲱⲗ
  choice: грабёж
  rationale: Форма связана с коптским глаголом «красть, грабить»; поэтому она не передана как «внешнее», несмотря на внешнее сходство с предшествующей формой.
- source_word: ⲡⲉⲧⲛⲁⲩ
  choice: та, кто видит
  rationale: Сохраняет относительную конструкцию «тот/та, кто видит»; женский род выбран в соответствии с женским голосом произведения, хотя коптская форма грамматически оформлена мужским артиклем.
- source_word: ⲉⲧⲛⲏⲟⲩ ⲉϩⲣⲁⲓ ⲉⲧⲟⲟⲧ
  choice: то, что нисходит ко мне
  rationale: ⲛⲏⲟⲩ понимается как качественная форма глагола «приходить», а сочетание ⲉϩⲣⲁⲓ ⲉⲧⲟⲟⲧ — как направленность вниз, к говорящей.
- source_word: ⲫⲱⲧ
  choice: бегство
  rationale: Это коптское слово со значением «бегство, бежать», а не греческое φῶς «свет», которое по-коптски обычно писалось бы ⲫⲱⲥ.
- source_word: ⲙⲡⲕⲱ ⲉⲃⲟⲗ
  choice: освобождения
  rationale: Разобрано как родительное ⲙ- при именной группе ⲡⲕⲱ ⲉⲃⲟⲗ «освобождение, отпускание», а не как отрицательная перфектная форма «не вышел».
- source_word: ⲁⲛⲟⲕ ⲁⲛⲟⲕ
  choice: Я — это я
  rationale: Удвоение местоимения передано естественной русской формулой самоотождествления, сохраняющей эмфатическое завершение.
theological_decisions:
- issue: Грамматический род самообозначения говорящей
  choice: «та, кто видит»
  alternative: «тот, кто видит» или безродовое переформулирование
  rationale: Коптская относительная конструкция формально мужского рода, однако голос всего произведения представлен как женский. Русский женский род делает эту контекстуальную отнесённость явной, не добавляя конфессионального толкования.
- issue: Парадоксальное сочетание «бегство освобождения»
  choice: Сохранить буквальную генитивную конструкцию
  alternative: Истолковать как «бегство к освобождению» или «освобождающее бегство»
  rationale: Исходная связь двух существительных допускает более одного смыслового отношения; буквальная русская конструкция не снимает намеренную напряжённость.
translation_notes:
  register: Современный литературный русский с краткими, торжественными формулами и сохранённой парадоксальностью оригинала. Повтор «Я —» поддерживает литанийный ритм; архаическое «Я есмь» не использовано. Строки разбиты так, чтобы отразить синтаксическое и ритмическое движение исходного фрагмента.
