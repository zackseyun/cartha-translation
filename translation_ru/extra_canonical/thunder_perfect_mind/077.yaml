base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/077.yaml
  text: 'I am the silence within a voice[a].

    I am peace, and because of me war came to be.

    And I am a foreigner and a citizen.

    I am the substance, and the one who has no substance[g][f][e][d][c][b]; those who exist outside my association are ignorant of me.'
translation:
  language: ru
  text: 'Я — безмолвие в голосе[a].


    Я — мир, и из-за меня возникла война.


    Я — чужестранка[b] и гражданка.


    Я — сущность и та, у которой нет сущности[c]; те, кто пребывает вне общения со мной[d], не знают меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начало строки повреждено или неверно распознано: чтение «безмолвие» предполагает восстановление начальной буквы в ⲥⲙⲙⲟⲥ. Возможные передачи: «тишина» или «безмолвие»; далее несомненно стоит «в голосе».'
    reason: textual_uncertainty
  - marker: b
    text: Чтение коптского слова не вполне надёжно; возможна также передача «странница» или «чужая». Противопоставление слову «гражданка» поддерживает перевод «чужестранка».
    reason: lexical_alternative
  - marker: c
    text: «Сущность» передаёт греческое οὐσία; возможны также «субстанция» и «бытие».
    reason: lexical_alternative
  - marker: d
    text: Греческое συνουσία может означать общение, совместное пребывание, связь, близость, а иногда и половое соединение. Здесь выражение передано без сужения до одного из этих оттенков.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: '(ⲥ)ⲙⲙⲟⲥ (OCR: ⲙⲙⲟⲥ)'
  choice: безмолвие
  rationale: Предполагаемое восстановление начальной ⲥ даёт слово «безмолвие»; оно образует характерный для произведения парадокс с «голосом». Неуверенность OCR отмечена в сноске.
- source_word: ϣⲱⲥ
  choice: голос
  rationale: Передаёт обычное значение слова и сохраняет противопоставление безмолвия и голоса.
- source_word: ϯⲣⲏⲛⲏ / ⲡⲡⲟⲗⲉⲙⲟⲥ
  choice: мир / война
  rationale: Прямо передаёт греческие заимствования и сохраняет резкую антитезу; в русском отвлечённые существительные здесь естественны без артиклевой определённости.
- source_word: ϣⲱⲡⲉ ⲉⲧⲃⲏⲏⲧ
  choice: из-за меня возникла
  rationale: ϣⲱⲡⲉ означает возникновение или наступление события, а ⲉⲧⲃⲏⲏⲧ выражает причину; формулировка не смягчает причинное напряжение строки.
- source_word: ⲟⲩϣⲙⲙⲱ
  choice: чужестранка
  rationale: Слово противопоставлено ⲣⲙⲛⲡⲟⲗⲓⲥ «гражданке»; женский род согласован с женской формой самообозначения говорящей.
- source_word: ⲣⲙⲛⲡⲟⲗⲓⲥ
  choice: гражданка
  rationale: Естественная русская передача буквального «человек города» в социальной антитезе с чужестранкой.
- source_word: ⲟⲩⲥⲓⲁ
  choice: сущность
  rationale: Сохраняет философскую многозначность греческого οὐσία лучше, чем более вещественное «субстанция» или абстрактное «бытие».
- source_word: ⲥⲩⲛⲟⲩⲥⲓⲁ
  choice: общение со мной
  rationale: Греческое συνουσία может обозначать общение, совместное пребывание, связь или близость; контекстуальная формулировка остаётся широкой и естественной по-русски.
- source_word: ⲥⲉⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ
  choice: не знают меня
  rationale: Форма содержит отрицательно-привативный элемент ⲁⲧ- и означает пребывание в неведении, а не причинное «делают известной».
theological_decisions:
- issue: Парадокс «сущность — та, у которой нет сущности»
  choice: Сохранить буквальное внутреннее противоречие
  alternative: Сгладить как «имеющая сущность и не имеющая её» либо истолковать метафизически
  rationale: Грамматический разбор поддерживает «та, у которой нет сущности», а парадоксальная самопрезентация является основным риторическим приёмом текста; разъяснение в основном тексте навязало бы частное толкование.
- issue: Характер συνουσία
  choice: общение со мной
  alternative: единение со мной; близость со мной; связь со мной
  rationale: Выбор не ограничивает слово ни мистическим единением, ни супружеской или сексуальной близостью, сохраняя возможный диапазон смысла.
translation_notes:
  register: Современный литературный русский с торжественным, но ясным оракульным ритмом. Повтор «Я —» и краткие параллельные фразы сохранены. Женский род («чужестранка», «гражданка», «та») отражает грамматически женское самообозначение говорящей. Подлинные парадоксы и лексическая неоднозначность вынесены в сноски, а не разрешены конфессиональным или метафизическим толкованием.
