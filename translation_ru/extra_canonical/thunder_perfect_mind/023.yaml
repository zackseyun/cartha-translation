base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/023.yaml
  text: 'Those who lie about me tell the truth about me.[a]

    Those who know me[a], let them be ignorant of me,

    and those who have not known me—let them know me.

    For I am knowledge and ignorance[b].

    I am—'
translation:
  language: ru
  text: 'Те, кто лжёт обо мне, говорят обо мне правду.[a]


    Те, кто знает меня, пусть не знают меня,


    а те, кто меня не познал, — пусть познают меня.


    Ибо я — знание и незнание.


    Я —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начало строки сильно искажено в предоставленном OCR. Перевод следует восстановленному чтению рукописи: «Те, кто лжёт обо мне, говорят обо мне правду».'
    reason: 'Текстологическая оговорка: публикационное чтение основано на восстановлении плохо распознанной коптской строки.'
lexical_decisions:
- source_word: ⲛⲉⲧϫⲓϭⲟⲗ ⲉⲣⲟⲉⲓ ϫⲱ ⲛⲧⲙⲉ ⲉⲣⲟⲉⲓ (восстановлено по рукописи вместо искажённого OCR)
  choice: Те, кто лжёт обо мне, говорят обо мне правду
  rationale: 'Восстановленное чтение образует характерный для произведения парадокс: ложь обо мне противопоставлена истине обо мне. Настоящее время и синтаксический параллелизм сохранены.'
- source_word: ⲥⲟⲟⲩⲛ
  choice: знать / познать
  rationale: Обычный сахидский глагол когнитивного знания. В первой паре выбрано «знает / не знают», а в следующей — «не познал / познают», чтобы естественно передать различие между предшествующим отрицательным перфектом и юссивом, сохранив общий лексический корень.
- source_word: ⲙⲁⲣⲟⲩⲣⲁⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ (восстановлено вместо OCR ⲉⲩⲛⲁⲥⲟⲟⲩⲛ ⲙⲙⲟⲉⲓ)
  choice: пусть не знают меня
  rationale: Юссивная конструкция с отрицательным/привативным понятием незнания. Русское «пусть не знают» сохраняет повелительно-пожелательную силу и парадокс, не вводя более резкого оценочного «пусть пребывают в невежестве».
- source_word: ⲙⲁⲣⲟⲩⲥⲟⲟⲩⲛ
  choice: пусть познают
  rationale: Юссив ⲙⲁⲣⲟⲩ- передан частицей «пусть»; совершенный вид «познают» естественно выражает достижение знания теми, кто прежде не знал говорящую.
- source_word: ⲡⲥⲟⲟⲩⲛ
  choice: знание
  rationale: Определённая абстрактная форма передана существительным «знание», образующим точную антитезу со следующим понятием.
- source_word: ⲧⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ
  choice: незнание
  rationale: Образование ⲙⲛⲧ- + привативное ⲁⲧ- + «знать» буквально обозначает незнание. «Незнание» лучше сохраняет морфологическую и риторическую симметрию со «знанием», чем оценочно окрашенное «невежество».
- source_word: ⲁⲛⲟⲕ ⲅⲁⲣ ⲡⲉ
  choice: Ибо я —
  rationale: «Ибо» сохраняет причинно-пояснительную функцию ⲅⲁⲣ, а тире поддерживает торжественный ритм формул самооткровения.
theological_decisions:
- issue: Парадоксальное отождествление говорящей со знанием и незнанием
  choice: 'Сохранено буквально: «я — знание и незнание»'
  alternative: Истолковать «незнание» как неведение других о говорящей или как скрытое знание
  rationale: Текст намеренно соединяет противоположности и не объясняет их отношение. Перевод не должен заранее разрешать эту богословскую и риторическую напряжённость.
- issue: Призыв знающим не знать говорящую
  choice: «пусть не знают меня»
  alternative: «пусть забудут меня» или «пусть признают своё неведение обо мне»
  rationale: Альтернативы привнесли бы отсутствующее в тексте толкование. Выбранная формулировка сохраняет прямой парадокс и лексическую связь со «знать».
translation_notes:
  register: Современный литературный русский язык с краткими параллельными строками и торжественной анафорой. Женский род говорящей в данном фрагменте грамматически не проявляется. Незавершённое «Я —» сохранено, поскольку исходный сегмент обрывается на ⲁⲛⲟⲕ ⲡⲉ.
