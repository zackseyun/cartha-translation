base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/069.yaml
  text: 'I am the mind[1],

    and my rest.

    I am the knowledge of my seeking for myself,

    and the seeking of those who seek me,

    and the command of those who ask of me[c][b][a][5][4][3][2],

    and the voice of the voices of the place of the gods.'
translation:
  language: ru
  text: 'Я — разум[a]

    и мой покой.

    Я — знание о том, как я ищу саму себя,

    и поиск тех, кто ищет меня,

    и повеление тех, кто просит у меня,

    и голос голосов в месте богов[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Коптское ⲡⲛⲟⲩⲥ, заимствованное из греческого νοῦς, можно также перевести как «ум» или «интеллект».
    reason: lexical_alternative
  - marker: b
    text: Последнее слово в данном чтении, вероятно, представляет собой усечённую форму со значением «богов»; возможно также чтение «Бога» или «бога».
    reason: textual_uncertainty
lexical_decisions:
- source_word: ⲡⲛⲟⲩⲥ
  choice: разум
  rationale: Греческое заимствование νοῦς обозначает ум или разум как способность мышления; «разум» звучит естественно и сохраняет возвышенный регистр.
- source_word: ⲧⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: мой покой
  rationale: Форма ⲧⲁ- является притяжательным артиклем первого лица единственного числа; греческое ἀνάπαυσις передаёт покой, отдохновение или прекращение.
- source_word: ⲡⲥⲟⲟⲩⲛ
  choice: знание
  rationale: Номинальная форма от ⲥⲟⲟⲩⲛ означает знание; буквальная передача сохраняет ряд самоотождествлений говорящей.
- source_word: ⲙⲡⲁϣⲓⲛⲉ ⲛⲥⲱⲓ
  choice: о том, как я ищу саму себя
  rationale: Исправленное чтение ϣⲓⲛⲉ означает «искать», а ⲛⲥⲱⲓ — «за мной/меня»; развернутая русская конструкция естественно передаёт «знание моего искания самой себя».
- source_word: ⲡϣⲓⲛⲉ ⲛⲛⲉⲧϣⲓⲛⲉ ⲛⲥⲱⲉⲓ
  choice: поиск тех, кто ищет меня
  rationale: Сохраняется корневой повтор «поиск — ищет», существенный для ритма и смысла оригинала.
- source_word: ⲡⲟⲩⲁϩⲥⲁϩⲛⲉ
  choice: повеление
  rationale: Это стандартное коптское существительное со значением приказа или повеления, а не сочетание слов со значением единения и общения.
- source_word: ⲧⲥⲙⲏ ⲛ̄ⲛⲓⲥⲙⲏ
  choice: голос голосов
  rationale: ⲥⲙⲏ означает «голос»; буквальный повтор сохраняет торжественную суперлативную формулу.
- source_word: ⲙⲡⲙⲁ ⲛⲑⲉⲱ
  choice: в месте богов
  rationale: ⲙⲁ означает место; вероятное восстановление усечённого ⲑⲉⲱ как множественного ⲑⲉⲱⲛ даёт «богов». Предлог «в» делает по-русски понятной локативную связь, не превращая место в храм или святилище.
theological_decisions:
- issue: Род говорящей в выражении «ищу себя»
  choice: саму себя
  alternative: самого себя / себя
  rationale: Во всём произведении говорит женский персонаж; женская форма делает это явным по нормам русского языка, не приписывая существительному «разум» мужскую личностную идентичность.
- issue: Число в заключительном выражении о божестве
  choice: богов
  alternative: Бога / бога
  rationale: Форма в OCR, вероятно, усечена и восстанавливается как ⲑⲉⲱⲛ, «богов»; поскольку рукописное чтение не вполне сохранно, неопределённость вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с торжественным анафорическим ритмом. Повторы «Я —», «поиск — ищет» и «голос голосов» сохранены намеренно. Синтаксис слегка разглажен только там, где буквальная коптская именная цепочка была бы неестественной по-русски.
