base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/017.yaml
  text: I am the servant of the one who prepared me[a]. I am the ruler of my offspring[d][c][b]. But he is the one who begot me before the day of my birth.
translation:
  language: ru
  text: '**12.** Я — служанка того, кто приготовил меня. Я — госпожа своего потомства. Но именно он [родил меня][a] прежде дня моего рождения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «родил меня» восстановлены в повреждённом месте рукописи; восстановление хорошо согласуется с сохранившимся контекстом и следующим выражением «дня моего рождения».
    reason: textual_restoration
lexical_decisions:
- source_word: ⲧϩⲙϩⲁⲗ
  choice: служанка
  rationale: Форма женского рода обозначает находящуюся в услужении; «служанка» сохраняет отношение подчинения, не уточняя без необходимости правовой статус рабыни.
- source_word: ⲡⲉⲛⲧⲁϥⲥⲃⲧⲱⲧ
  choice: того, кто приготовил меня
  rationale: Глагол ⲥⲃⲧⲱⲧ передаёт значение приготовления или приведения в готовность; перевод следует исправленному коптскому тексту, а не ошибочно совмещённому отрывку OCR.
- source_word: ⲧϫⲟⲉⲓⲥ
  choice: госпожа
  rationale: Женская форма титула означает госпожу или владычицу; «госпожа» естественно передаёт власть говорящей над её потомством.
- source_word: ⲙⲛⲧϣⲏⲣⲉ
  choice: потомство
  rationale: Абстрактно-собирательное образование от слова «ребёнок» здесь обозначает потомство в целом.
- source_word: ϫⲡⲟ
  choice: родил / рождения
  rationale: Глагол охватывает рождение и порождение; повтор корня в «родил меня… дня моего рождения» сохраняет намеренный парадокс исходного текста.
- source_word: ϩⲁⲧⲉϩⲏ
  choice: прежде
  rationale: Выражение имеет временное значение «до, прежде» и формирует парадокс рождения до дня собственного рождения.
theological_decisions:
- issue: Парадокс власти над потомством и рождения от него
  choice: 'Сохранить буквальную родственную взаимность: говорящая — госпожа своего потомства, но он родил её.'
  alternative: Сгладить место как метафору происхождения или духовной власти.
  rationale: Текст намеренно соединяет противоположные родственные и властные отношения; их нельзя разрешать внесением определённой богословской схемы.
- issue: Род говорящей
  choice: Использовать женские формы «служанка» и «госпожа».
  alternative: Употребить родово-нейтральные или мужские наименования.
  rationale: Коптские формы грамматически женского рода, что согласуется с женским голосом произведения.
translation_notes:
  register: Современный литературный русский язык с торжественным параллелизмом повторяющегося «Я —». «Госпожа» выбрана вместо более архаичного «владычица»; намеренный парадокс происхождения оставлен без поясняющего истолкования в основном тексте.
