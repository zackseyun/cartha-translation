    reason: parallelism_note
lexical_decisions:
- source_word: ⲉⲧⲕⲉⲟⲩⲁⲩ
  choice: изречение
  rationale: Начальное слово ненадёжно распознано в OCR. Нейтральное «изречение» предварительно передаёт предполагаемое существительное, вводящее первую именную конструкцию.
- source_word: ⲕⲁⲧⲁ
  choice: сообразное с
  rationale: Передаёт значение греческого κατά как соответствия или согласованности и естественно связывается в русском с «благоразумием».
- source_word: ⲫⲣⲟⲛⲓ
  choice: благоразумие
  rationale: Сохраняет философско-этический оттенок греческого φρόνησις, не сводя его только к интеллектуальному пониманию.
- source_word: ⲣⲓⲧⲉ
  choice: искание
  rationale: Отглагольное существительное сохраняет процессуальный характер исходного слова и возвышенный, но понятный регистр.
- source_word: ⲥⲁϩⲟⲩ
  choice: знание
  rationale: Прямо передаёт познавательное содержание слова и поддерживает параллель двух абстрактных именных высказываний.
- source_word: ϣⲟⲩϣⲟⲩ
  choice: поиск
  rationale: Передаёт действие разыскивания и вместе с «исканием» сохраняет близкий смысловой параллелизм без неестественного полного повтора.
- source_word: ϣⲟⲟⲡ
  choice: пребывает
  rationale: Выражает не просто существование, а присутствие внутри названных состояний; форма подходит к торжественному самоопределению говорящей.
- source_word: ⲫⲟⲃⲟⲥ
  choice: страх
  rationale: Основное и наиболее широкое соответствие греческому φόβος; множественное число сохранено по исходной конструкции.
- source_word: ⲧⲏⲣⲟⲩ
  choice: всех
  rationale: Передаёт универсальный квантор «все», относящийся к множественному «страхам», а не притяжательное значение.
- source_word: ⲡⲛⲏϣⲁⲧ
  choice: мужество
  rationale: Передаёт значение доблести и храбрости и образует ясную антитезу страху; в современном русском слово обозначает качество независимо от пола.
- source_word: ⲧⲉⲧϣⲟⲟⲡ
  choice: та, что пребывает
  rationale: Сохраняет грамматически значимое женское самообозначение и относительную конструкцию, а не превращает её в простую связку.
theological_decisions:
- issue: Присутствие говорящей в противоположных состояниях
  choice: «во всех страхах и в мужестве»
  alternative: «в их страхе и в мужестве»
  rationale: Исходное ⲧⲏⲣⲟⲩ означает «все»; перевод сохраняет парадоксальное присутствие говорящей и в страхах, и в мужестве, не устраняя напряжения между противоположностями.
- issue: Женское самоопределение говорящей
  choice: «я — та, что пребывает»
  alternative: «я пребываю»
  rationale: Развёрнутая формула сохраняет женскую относительную форму исходного текста, существенную для голоса произведения.
