lexical_decisions:
- source_word: ⲡⲣⲁⲛ
  choice: имя
  rationale: Обычное значение коптского слова; сохранена парадоксальная зеркальная конструкция «имя голоса и голос имени».
- source_word: ⲧⲥⲙⲏ / ⲥⲙⲏ
  choice: голос
  rationale: В данном сочетании ⲡⲣⲁⲛ ⲛⲧⲥⲙⲏ слово означает «голос», а не «внутренность»; это подтверждается непосредственным синтаксическим параллелизмом следующей фразы.
- source_word: ⲡⲥⲏⲙⲉⲓⲟⲛ
  choice: знак
  rationale: Греческое заимствование σημεῖον; «знак» точно и естественно передаёт его значение.
- source_word: ⲡⲁⲓ
  choice: буквы
  rationale: OCR-чтение этого места неустойчиво и буквально может выглядеть как указательное «этого»; перевод «буквы» следует принятому восстановлению фразы, отражённому в проверенном английском слое, с вынесением неопределённости в примечание.
- source_word: ⲡⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: явление
  rationale: Выражение обозначает обнаружение, проявление или откровение. «Явление» сохраняет отвлечённо-поэтический строй и параллелизм со «знаком».
- source_word: ⲧⲁϩⲉⲣⲉⲥⲓⲥ
  choice: разделения
  rationale: Греческое αἵρεσις может означать выбор, течение или разделение. Здесь «разделение» сохраняет смысловую напряжённость фразы и не привносит позднейшего узкоконфессионального значения «ересь».
- source_word: ⲁⲕⲣⲟⲁⲧ
  choice: не включено в основной текст
  rationale: Вероятное греческое заимствование со значением «слушайте», однако оно находится в повреждённом хвосте OCR-фрагмента и может принадлежать соседнему сегменту.
theological_decisions:
- issue: Значение ⲧⲁϩⲉⲣⲉⲥⲓⲥ
  choice: разделение
  alternative: ересь; выбор; течение
  rationale: «Ересь» придала бы слову более позднюю догматическую окраску. «Разделение» лучше сохраняет доступный здесь широкий смысл греческого заимствования.
- issue: Образ «знака буквы»
  choice: сохранить буквально-парадоксальный образ
  alternative: разъяснить как «письменный знак»
  rationale: Текст намеренно строится на загадочных самоопределениях; разъясняющий перевод снял бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным и парадоксальным ритмом оригинала. Зеркальная формула сохранена без поясняющей перестройки; лакуна обозначена многоточием и примечанием.
