base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/107.yaml
  text: 'I am the hearing that is attainable to all[a];

    I am the speech that cannot be grasped;

    the name of the sound and the sound of the name;

    I am the sign of this[g][f][e][d][c][b], and the manifestation.'
translation:
  language: ru
  text: 'Я — слышание, доступное всем[a];


    Я — речь, которую не могут уловить;


    Я — имя звука и звук имени;


    Я — знак этого[b] и проявление.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово ⲉⲧϣⲏⲡ допускает также перевод «великое»; здесь оно понято как «доступное, достижимое», что создаёт контраст со следующей строкой.
    reason: lexical_alternative
  - marker: b
    text: В оригинале стоит буквально «знак этого»; к чему именно относится «это» — к речи, звуку, имени или ко всему сказанному ранее, — не уточняется.
    reason: referential_ambiguity
lexical_decisions:
- source_word: ⲡⲥⲱⲧⲙ
  choice: слышание
  rationale: Отглагольное существительное сохраняет абстрактное значение процесса или способности слышать и поддерживает звуковой ряд отрывка; «послушание» внесло бы отсутствующий в контексте нравственный оттенок.
- source_word: ⲉⲧϣⲏⲡ ⲛϩⲱⲃ ⲛⲓⲙ
  choice: доступное всем
  rationale: Передаёт универсальность выражения и вероятное значение ϣⲏⲡ «доступный, достижимый», сохраняя противопоставление следующей строке.
- source_word: ⲡϣⲁϫⲉ
  choice: речь
  rationale: «Речь» естественно передаёт звучащее высказывание и не привносит дополнительной богословской нагрузки, возможной у слова «Слово».
- source_word: ⲉⲧⲉ ⲙⲁⲩϣⲁⲙⲁϩⲧⲉ ⲙⲙⲟϥ
  choice: которую не могут уловить
  rationale: Читает последовательность через перенос строки как относительную конструкцию с отрицательной формой 3-го лица множественного числа и глаголом «схватить, овладеть». Русское «уловить» сохраняет и образ недостижимости, и звуковой контекст.
- source_word: ⲣⲁⲛ
  choice: имя
  rationale: Прямое соответствие, необходимое для сохранения хиазма «имя звука — звук имени».
- source_word: ⲥⲙⲏ
  choice: звук
  rationale: Из значений «звук, голос, весть» выбрано наиболее абстрактное акустическое значение, образующее точную пару с «именем».
- source_word: ⲡⲥⲏⲙⲉⲓⲟⲛ ⲙⲡⲁⲓ
  choice: знак этого
  rationale: ⲥⲏⲙⲉⲓⲟⲛ — цельное греческое заимствование «знак», несмотря на перенос строки; ⲙⲡⲁⲓ передано как «этого» без навязывания ему определённого антецедента.
- source_word: ⲡⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: проявление
  rationale: Передаёт действие или результат раскрытия и явления наружу; в отличие от «света», соответствует засвидетельствованному коптскому выражению.
theological_decisions:
- issue: Неопределённый референт слова ⲡⲁⲓ («это»).
  choice: Сохранено местоименное «этого» без уточнения.
  alternative: «знак этой речи» или «её знак»
  rationale: Источник грамматически не называет однозначный референт; уточнение сняло бы присущую тексту смысловую открытость.
- issue: Характер недоступности речи.
  choice: «которую не могут уловить»
  alternative: «которую невозможно постичь»
  rationale: Выбранный вариант не сводит образ исключительно к интеллектуальному непониманию и сохраняет буквальный оттенок невозможности схватить или удержать.
translation_notes:
  register: Современный литературный русский с торжественной, но ясной анафорической интонацией. Абстрактные существительные и хиазм сохранены; переносы строк следуют смысловым единицам, а не потенциально вводящему в заблуждение делению OCR.
