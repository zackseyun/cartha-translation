- issue: Парадоксальное отождествление говорящей с противоположностями
  choice: Сохранить прямое «Я — самообладание и несдержанность»
  alternative: Сгладить противоречие пояснительной формулировкой
  rationale: Источник намеренно соединяет противоположные понятия; богословское или философское разрешение парадокса не должно вноситься в перевод.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная формула сохраняет парадокс оригинала. «Несдержанность» выбрана вместо более узкой «распущенности», чтобы не привносить исключительно сексуального смысла.
