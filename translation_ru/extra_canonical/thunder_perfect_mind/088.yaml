    reason: alignment_note
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Я —
  rationale: Передаёт явную предикацию от первого лица; женский род говорящей в русском не требуется выражать в конструкции с именным сказуемым.
- source_word: ⲧⲁϣϭⲏⲗ
  choice: самообладание
  rationale: Современное и ясное обозначение сдержанности и владения собой, сохраняющее этический смысл и контраст с последующим понятием.
- source_word: ⲉⲕⲟⲗ
  choice: несдержанность
  rationale: Сохраняет прямую антитезу к «самообладанию», не сужая значение до распущенности, в том числе половой.
- source_word: ϩⲓϫⲙ
  choice: '[не переведено в данном фрагменте]'
  rationale: Конечный предлог «на/над», вероятно, относится к продолжению в следующей строке; перевод без дополнения создал бы ложную завершённость.
