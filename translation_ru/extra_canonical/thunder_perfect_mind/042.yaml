  source_fidelity: 'Основной текст верно следует восстановленному чтению NHC VI,2 16:1–5 и английскому аудиторскому следу: обращение к грекам, «варварка», «знание грека и варвара», «суд». Однако «Ибо почему» неестественно в современном русском и без ясного предшествующего контекста создаёт ложную причинную связь. Начальное «Почему же» передаёт ⲉⲧⲃⲉⲟⲩ ⲅⲁⲣ как риторический вопрос без излишнего добавления.'
