lexical_decisions:
- source_word: 'ⲛⲉⲓⲉⲗⲗⲏⲛ (в OCR: ⲡⲉⲓⲛⲗⲏⲛ)'
  choice: о греки
  rationale: Восстановленное коптское выражение обозначает обращение к грекам. Русский звательный оборот «о греки» сохраняет торжественный ритм и ясно передаёт обращение.
- source_word: ⲧⲃⲁⲣⲃⲁⲣⲟⲥ (в OCR искажено как ⲧⲉⲧⲉⲙⲁⲩⲉⲣⲟⲥ)
  choice: варварка
  rationale: Греческое заимствование означает человека, не принадлежащего к греческой языковой и культурной среде. Женский род согласован с грамматически женским голосом говорящей.
- source_word: ⲧⲥⲟⲟⲩⲛ
  choice: знание
  rationale: Существительное передаёт знание или познание. «Знание» сохраняет отвлечённое самоопределение говорящей и не превращает его в действие «я знаю».
- source_word: 'ⲡϩⲁⲡ (в OCR: ⲫⲁⲡ)'
  choice: суд
  rationale: Коптское слово означает суд, судебное решение или правосудие. Краткое «суд» сохраняет парадоксальную формулу самоотождествления и не уточняет без основания, идёт ли речь о процессе, приговоре или справедливом суде.
theological_decisions:
- issue: Самоопределение говорящей как ⲡϩⲁⲡ
  choice: Я — суд
  alternative: Я — приговор / Я — правосудие
  rationale: Источник допускает несколько близких судебных значений. «Суд» оставляет объём понятия открытым и не навязывает специального богословского толкования.
translation_notes:
  register: Современный литературный русский с торжественной, афористичной интонацией. Сохранены краткие парадоксальные самоопределения и противопоставление «грек — варвар»; устаревшая лексика не вводилась.
