translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным увещевательным звучанием. Формула «не оставайтесь в неведении обо мне» сохраняет необычность исходной мысли, не превращая её ни просто в «помните меня», ни в «не игнорируйте меня». Наречная пара «нигде и никогда» естественно передаёт пространственно-временной параллелизм.
