    issue: «Рассудите их»
    rationale: Для ⲉⲣⲓⲕⲣⲓⲛⲉ ⲙⲙⲟⲟⲩ нужен прямой призыв судить этих людей. Русское «рассудить их» обычно понимается как разрешить их взаимный спор; «судите их» передаёт объект действия без этой смысловой подмены.
  revised_text: Заткните им рты! Судите их, прежде чем они схватят вас, потому что судья неправды находится среди вас. Если вас освободят с приходом того, кто освободит вас, или если вы сами освободитесь…[b]
