review_pass:
  verdict: revise
  source_fidelity: 'Черновик верно исправляет ложное выравнивание английского audit trail и в целом следует фактическому коптскому фрагменту: повеление закрыть им рты, суд над ними, предупреждение о том, что они схватят адресатов, и далее оборванное условное высказывание об освобождении. Однако «рассудите их» в современном русском обычно означает разрешить спор между сторонами и не передаёт прямо переходное «судите их» (ⲕⲣⲓⲛⲉ ⲙⲙⲟⲟⲩ).'
  naturalness: «Заткните им рты» намеренно резко, но естественно для этого повелительного контекста. «Судите их» существенно естественнее и точнее, чем «Рассудите их». Формула «Если вас освободят с приходом того, кто освободит вас» сохраняет непрояснённую синтаксико-смысловую связь с «приходом», не привнося богословского толкования.
  terminology: «Судья неправды» удачно сохраняет генитивную неоднозначность оригинала и не решает заранее, идёт ли речь о неправедном судье либо о судье, связанном с неправдой. «Освободят / освободит / сами освободитесь» последовательно передаёт ⲕⲁ … ⲉⲃⲟⲗ в данном контексте, а не ошибочное «извергнут/выбросят».
  issues:
