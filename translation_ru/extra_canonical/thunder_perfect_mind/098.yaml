translation:
  language: ru
  text: Заткните им рты! Судите их, прежде чем они схватят вас, потому что судья неправды находится среди вас. Если вас освободят с приходом того, кто освободит вас, или если вы сами освободитесь…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Текст обрывается посреди следующего условного оборота.
    reason: Предоставленный отрывок заканчивается на неполной фразе.
lexical_decisions:
- source_word: 'ⲭⲣⲱ ⲛⲧⲉⲣⲟⲟⲩ (OCR: ⲭⲣⲟⲉⲓ ⲧⲉⲣⲟⲟⲩ)'
  choice: Заткните им рты
  rationale: С учётом исправления OCR начало понимается как повеление закрыть их уста, а не как заявление «я взываю».
- source_word: ⲉⲣⲓⲕⲣⲓⲛⲉ ⲙⲙⲟⲟⲩ
  choice: Рассудите их
  rationale: Греческое заимствование ⲕⲣⲓⲛⲉ передаёт действие суда или вынесения суждения; «рассудите» сохраняет эту широту.
- source_word: ⲉⲙⲡⲁⲧⲟⲩⲧⲁϩⲉ ⲉⲣⲱⲧⲛ
  choice: прежде чем они схватят вас
  rationale: Конструкция ⲙⲡⲁⲧ- означает «прежде чем», а ⲧⲁϩⲉ ⲉ- здесь имеет смысл настичь или схватить.
- source_word: ⲡⲉⲕⲣⲓⲧⲏⲥ ⲙⲡϫⲓ ⲛϭⲟⲛⲥ
  choice: судья неправды
  rationale: Буквально выражение обозначает судью несправедливости/неправды; сохранена намеренно напряжённая формулировка.
- source_word: ⲕⲁ … ⲉⲃⲟⲗ
  choice: освободить / освободиться
  rationale: В данном синтаксическом окружении сочетание означает отпустить или освободить, а не «извергнуть».
- source_word: ϩⲙ ⲡϫⲓⲛⲓ
  choice: с приходом
  rationale: Здесь ⲡϫⲓⲛⲓ связано с приходом/прибытием; прежнее толкование как «лик, поверхность» контекстуально несостоятельно.
theological_decisions:
- issue: «судья неправды»
  choice: Сохранить буквальную двусмысленную связь судьи с неправдой
  alternative: «неправедный судья» или «судья над неправдой»
  rationale: Коптская генитивная конструкция допускает смысловое напряжение; перевод не должен без необходимости решать, является ли судья неправедным или судит неправду.
- issue: Способ освобождения
  choice: Сохранить противопоставление освобождения другим лицом и самоосвобождения
  alternative: Свести обе части к духовному избавлению
  rationale: Источник прямо сополагает пассивное освобождение и рефлексивное действие, не уточняя их богословский смысл.
translation_notes:
  register: Современный литературный русский с резким повелительным началом. Перевод следует фактическому коптскому отрывку, а не явно смещённому английскому консультационному тексту. Многоточие отмечает физически неполное окончание предоставленного OCR-фрагмента.
