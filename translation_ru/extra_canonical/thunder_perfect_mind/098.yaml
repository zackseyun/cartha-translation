revisions:
- from: Заткните им рты! Рассудите их, прежде чем они схватят вас,[a] потому что судья неправды находится среди вас. Если вы будете освобождены с приходом того, кто освободит вас, или если вы сами освободитесь…[b]
  to: Заткните им рты! Судите их, прежде чем они схватят вас, потому что судья неправды находится среди вас. Если вас освободят с приходом того, кто освободит вас, или если вы сами освободитесь…[b]
  rationale: 'Исправлено только «Рассудите их» на «Судите их». Удалена необязательная сноска к «схватят»: основной перевод прямо соответствует наиболее вероятному значению ⲧⲁϩⲉ ⲉ- и не нуждается в варианте. Сноска об обрыве текста сохранена.'
