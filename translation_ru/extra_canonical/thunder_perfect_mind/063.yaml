lexical_decisions:
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: явите себя
  rationale: Передаёт становление явным или видимым и сохраняет прямое противопоставление сокрытию; возвратная конструкция естественна при подлежащем во втором лице множественного числа.
- source_word: ϩⲱⲡ
  choice: скроюсь
  rationale: Кратко и естественно передаёт рефлексивное «скрыть себя / стать скрытой» и поддерживает поэтическую антитезу.
- source_word: ⲇⲉ
  choice: но
  rationale: 'Противительный союз подчёркивает связь с предшествующей строкой: когда адресаты скрываются, говорящая является; когда они являются, она скрывается.'
theological_decisions:
- issue: Парадокс явления и сокрытия
  choice: Сохранить антитезу без истолкования личности говорящей или смысла её действий.
  alternative: Разъяснить парадокс в духе определённой богословской системы.
  rationale: Текст намеренно соединяет противоположности; перевод не должен устранять эту напряжённость или вводить конфессиональное толкование.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и ритмичная. «Явите себя» сохраняет возвышенный поэтический оттенок, не становясь архаизмом. Женский род говорящей здесь грамматически не выражен, поскольку форма будущего времени нейтральна по роду.
