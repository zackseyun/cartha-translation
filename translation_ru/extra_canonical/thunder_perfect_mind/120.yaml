translation:
  language: ru
  text: И они найдут меня в том месте, и будут жить, и не погибнут. И потому не медлите слушать меня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲥⲉⲛⲁϭⲓⲛⲉ ⲙⲙⲟⲉⲓ
  choice: они найдут меня
  rationale: Будущая форма ⲥⲉⲛⲁϭⲓⲛⲉ с прямым дополнением ⲙⲙⲟⲉⲓ означает «они найдут меня»; это чтение не смешивается с иным значением глагола в предполагаемом обращении.
- source_word: ⲙⲡⲙⲁ ⲉⲧⲙⲙⲁⲩ
  choice: в том месте
  rationale: Русское указательное сочетание естественно передаёт определённое место и дейктическую силу ⲉⲧⲙⲙⲁⲩ без тяжеловесного буквального оборота «в месте, которое там».
- source_word: ⲱⲛϩ
  choice: будут жить
  rationale: Сохраняется прямое значение глагола «жить, быть живым» и параллелизм с предшествующей будущей формой.
- source_word: ⲧⲙⲥⲱⲧ ⲉⲃⲟⲗ
  choice: не погибнут
  rationale: В данном противопоставлении жизни отрицательная конструкция естественно передаётся как «не погибнут»; перевод не уточняет способ или причину гибели.
- source_word: ⲙⲡⲣⲣⲁⲧⲥⲱⲧⲙ ⲛⲥⲱⲓ
  choice: не ослушайтесь меня
  rationale: Краткий современный русский запрет передаёт смысл непослушания говорящей; «ослушаться» естественно сочетается с прямым дополнением и сохраняет направленность к «мне».
theological_decisions:
- issue: Кого обозначает местоимение «они»
  choice: Сохранено местоимение без установления референта внутри фрагмента
  alternative: Назвать конкретную группу, например ангелов или духов
  rationale: В представленном коптском отрывке референт определяется предшествующим контекстом; его конкретизация внесла бы отсутствующее в тексте содержание.
translation_notes:
  register: Современный литературный русский; речь возвышенная, но ясная. Связность с предшествующим контекстом сохранена начальным «И». Финальный запрет передан во множественном числе как обращение к слушателям.
