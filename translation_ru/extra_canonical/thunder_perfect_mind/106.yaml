  source_fidelity: 'Первая строка верно исходит из вероятного исправления OCR ⲭⲓⲥⲃⲱ → ϫⲓⲥⲃⲱ («учиться/получать наставление»), а притяжательное «моих» и множественное «душ» действительно выражены в коптском. Однако ⲛⲉⲧⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ естественно согласуется с предшествующим множественным ⲛⲁⲯⲩⲭⲏ: «моих душ, которые знают меня». Перевод «Для тех, кто знает меня» вводит отсутствующее в источнике дательное отношение и разрывает эту связь. Далее ⲁⲛⲟⲕ ⲡⲉ начинает самостоятельное «Я — слышание».'
  naturalness: «У моих душ» намеренно необычно, но является приемлемым буквальным поэтическим соответствием. Относительное придаточное «которые знают меня» делает фразу понятной по-русски, не устраняя свойственную тексту странность образа. «Слышание» точнее сохраняет субстантивированный характер ⲡⲥⲱⲧⲙ и параллелизм с «речью», чем «слух».
  terminology: «Души», «слышание» и «речь» сохраняют образный и недогматический характер коптского текста. «Овладеть» допустимо, но «постичь» лучше сохраняет одновременно интеллектуальный смысл ⲙⲁϩⲧⲉ и естественность конструкции с «речью»; лексическую телесную образность следует отметить в сноске.
