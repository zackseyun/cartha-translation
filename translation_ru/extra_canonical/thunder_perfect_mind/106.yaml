  yaml_path: translation/extra_canonical/thunder_perfect_mind/106.yaml
  text: 'And learn from my souls.

    Those who know me — I am

    the hearing that is accessible to all [b];

    I am the speech that no one can grasp [c].[d]'
translation:
  language: ru
  text: '**4.** И учитесь у моих душ.[a]


    Для тех, кто знает меня, я —

    слух, доступный всему;[b]

    я — речь, которой никто не может овладеть.[c]

    Я —[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В рукописном чтении, вероятно искажённом OCR, имеется в виду «учитесь, получайте наставление». Выражение «моих душ» прямо содержит притяжательное значение первого лица и форму множественного числа.
    reason: textual_and_alignment_note
  - marker: b
    text: Слово ϣⲏⲡ можно также понять как «общий», «имеющийся» или «подходящий»; сочетание ⲛϩⲱⲃ ⲛⲓⲙ допускает переводы «всему», «для всех» и «во всём».
    reason: lexical_alternative
  - marker: c
    text: Глагол может означать «схватить», «захватить» или «постичь»; образ объединяет физическое и умственное овладение.
    reason: lexical_alternative
