lexical_decisions:
- source_word: ⲛⲁⲩ
  choice: видите
  rationale: Обычный саидский глагол зрительного восприятия; нейтральное «видите» сохраняет прямоту и повтор исходной формулы.
- source_word: ⲉⲃⲟⲗ
  choice: вне себя
  rationale: Передаёт внешнюю сторону в явном противопоставлении внутренней; «вне себя» естественно сочетается с указанным объектом восприятия.
- source_word: ⲉϩⲟⲩⲛ
  choice: внутри себя
  rationale: Сохраняет пространственную и смысловую антитезу «вне — внутри», не истолковывая её как исключительно психологическую или духовную.
- source_word: ⲟⲣⲁⲧⲟⲛ (греч. ὁρατόν)
  choice: видимое
  rationale: Субстантивированное «видимое» кратко передаёт «то, что доступно зрению» и поддерживает повторяющийся мотив видения.
- source_word: ⲓⲙⲁⲧⲓⲟⲛ (греч. ἱμάτιον)
  choice: одеяние
  rationale: «Одеяние» сохраняет предметный и вместе с тем поэтически-метафорический характер слова, не сужая его до плаща или иной конкретной одежды.
theological_decisions:
- issue: Соотношение внешнего, внутреннего и «одеяния»
  choice: Сохранить образ без поясняющего толкования
  alternative: Истолковать «одеяние» как тело, материальный мир или видимое проявление внутреннего
  rationale: Текст формулирует парадоксическую связь, но не указывает однозначно, что именно символизирует одеяние; конкретизация устранила бы намеренную смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством поэтической речи. Параллелизм «вне себя — внутри себя» и повтор «вы видите» сохранены; двоеточие подчёркивает пояснительное продолжение, не устраняя загадочности образа.
