translation:
  language: ru
  text: '**11.** Я — мать своего отца[a],

    и я — сестра своего мужа[b],

    а он — моё дитя[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В OCR здесь стоит форма, которую можно понять как «голова» (ⲧϩⲙϩⲁⲗ); в большинстве изданий читается «мать» (ⲧⲙⲁⲁⲩ).
    reason: lexical_alternative
  - marker: b
    text: Последовательность в OCR можно прочесть как «госпожа моего господина»; принятое чтение этой строки — «сестра своего мужа». Границы и распознавание текста здесь ненадёжны.
    reason: lexical_alternative_and_alignment_note
  - marker: c
    text: «Дитя» можно также перевести как «ребёнок» или «сын».
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲛⲟⲕ ⲧⲉ
  choice: Я —
  rationale: Стандартная копульная формула первого лица; именная конструкция с тире естественно передаёт её по-русски и сохраняет ритм повторяющихся самоопределений.
- source_word: ⲧϩⲙϩⲁⲗ (OCR; предполагается ⲧⲙⲁⲁⲩ)
  choice: мать
  rationale: Хотя OCR даёт форму, истолкованную как «голова», общепринятое чтение этой строки — ⲧⲙⲁⲁⲩ, «мать». Оно образует характерный для произведения парадокс «мать своего отца»; расхождение отмечено в сноске.
- source_word: ⲛⲧⲉ ⲡⲁ… (OCR-фрагмент; вероятно ⲡⲓⲱⲧ)
  choice: своего отца
  rationale: Контекст и засвидетельствованный текст строки поддерживают значение «отец». Возвратное «своего» естественно в русском при соотнесении с говорящей.
- source_word: ⲁⲩⲱ ⲁⲛⲟⲕ ⲧⲉ … (ожидается выражение со значением «сестра моего мужа»)
  choice: и я — сестра своего мужа
  rationale: Передаёт принятое чтение парадоксальной родственной формулы. OCR допускает существенно иное чтение, поэтому оно сохранено в сноске, а не устранено без оговорки.
- source_word: ⲛⲧⲟϥ ⲇⲉ ⲡⲉ … (ожидается ⲡⲁⲣⲏⲣⲉ/ⲡⲁϣⲏⲣⲉ)
  choice: а он — моё дитя
  rationale: «Дитя» сохраняет родственное значение и не сужает его до однозначного «сына»; союз «а» подчёркивает парадоксальное продолжение, не вводя причинной связи.
theological_decisions:
- issue: Парадоксальные родственные самоопределения говорящей
  choice: 'Сохранить буквально: «мать своего отца», «сестра своего мужа», «он — моё дитя».'
  alternative: Истолковать формулы символически или согласовать их с определённой богословской системой.
  rationale: Источник намеренно удерживает парадокс и не даёт в данном фрагменте однозначного доктринального объяснения; перевод не должен разрешать эту напряжённость за текст.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной ритмикой. Повтор «я —» сохраняет анафорическую форму речи; «дитя» выбрано как слегка возвышенное, но общеупотребительное слово, соответствующее поэтическому регистру. Сноски ограничены существенными расхождениями OCR и лексической неоднозначностью.
