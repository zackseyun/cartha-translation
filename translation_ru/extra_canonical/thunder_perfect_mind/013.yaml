- source_word: ⲧⲥⲱⲛⲉ
  choice: сестра
  rationale: Основное значение слова — «сестра». Оно повторяется в следующей строке; перевод «девственница» не подтверждается данным коптским словом.
- source_word: ⲧⲥϩⲓⲙⲉ
