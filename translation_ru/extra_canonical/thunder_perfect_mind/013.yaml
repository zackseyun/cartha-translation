- source_word: ⲧⲉ … ⲁⲛⲟⲕ
  choice: Я — …
  rationale: Русская именная конструкция с тире естественно передаёт коптское эмфатическое отождествление и сохраняет ритм повторяющейся речи.
- source_word: ⲧⲙⲁⲁⲩ ⲛⲧⲉ ⲡⲁⲉⲓⲱⲧ
  choice: мать моего отца
  rationale: Прямо передаёт генитивную конструкцию и сохраняет намеренный родственный парадокс.
- source_word: ⲧⲥⲱⲛⲉ ⲙⲡⲁ—
  choice: сестра моего…
  rationale: Переведена только сохранившаяся часть оборота; многоточие отмечает отсутствие определяемого существительного в предоставленном фрагменте.
