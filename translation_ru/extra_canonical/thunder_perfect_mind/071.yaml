base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/071.yaml
  text: 'I am the decree of those who ask me[a],

    and the voice of the voices in the place of the gods—

    the voice of the angels that they shout.

    Within the word and among the gods[f][e][d][c][b],

    the gods sent forth by means of the shout.'
translation:
  language: ru
  text: 'Я — повеление тех, кто просит меня,


    и голос голосов в месте обожения[a] —


    голосов ангелов, которые они изрекли в Слове[b],


    и богов богов, явленных через Замысел[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в месте обожения». Чтение ⲑⲉⲱⲥⲓⲥ и синтаксическая связь этой фразы не вполне надёжны из-за качества OCR; возможен иной разбор.'
    reason: textual_and_alignment_uncertainty
  - marker: b
    text: 'Или: «в Логосе» либо «в слове». Греческое заимствование ⲗⲟⲅⲟⲥ само по себе не решает, употреблён ли здесь технический титул.'
    reason: lexical_and_theological_ambiguity
  - marker: c
    text: 'Слово «явленных» добавлено для связности: в сохранившемся тексте соответствующий глагол явно не выражен. ϣⲟϫⲛⲉ означает «совет, замысел, решение»; всю заключительную конструкцию можно понять иначе: «и богов богов — через совет».'
    reason: supplied_word_and_syntactic_uncertainty
lexical_decisions:
- source_word: ⲡⲟⲩⲁϩⲥⲁϩⲛⲉ
  choice: повеление
  rationale: Это определённая форма сложного существительного ⲟⲩⲁϩⲥⲁϩⲛⲉ «повеление, распоряжение», а не сочетание слов со значениями «единство» и «одежда».
- source_word: ⲥⲙⲏ
  choice: голос
  rationale: Основное значение слова и наиболее естественный выбор для повторяющегося звукового образа «голос голосов».
- source_word: ⲑⲉⲱⲥⲓⲥ
  choice: обожение
  rationale: Греческое заимствование θέωσις передано в его прямом значении, но из-за качества OCR и необычности всей конструкции перевод отмечен как неуверенный.
- source_word: ⲁⲅⲅⲉⲗⲟⲥ
  choice: ангелы
  rationale: В данном мифологическом контексте греческое заимствование естественнее означает небесных существ, а не просто посланников.
- source_word: ⲗⲟⲅⲟⲥ
  choice: Слово
  rationale: «Слово» сохраняет основной смысл греческого λόγος; прописная буква указывает на возможную персонификацию, не вводя в основной текст транслитерацию «Логос».
- source_word: ⲛⲟⲩⲧⲉ ⲛⲛⲟⲩⲧⲉ
  choice: богов богов
  rationale: Буквальное сохранение необычной генитивной формулы и множественного числа; сглаживание до «высших богов» устранило бы напряжённость оригинала.
- source_word: ϣⲟϫⲛⲉ
  choice: Замысел
  rationale: Слово означает «совет, замысел, решение», а не «крик». «Замысел» лучше связывается с происхождением или явлением названных существ; прописная буква сохраняет возможность персонифицированного смысла.
- source_word: ⲧⲁⲟⲩⲟ
  choice: изрекли
  rationale: Глагол имеет значение «произнести, изречь, вывести наружу»; здесь звуковой контекст поддерживает «изрекли».
theological_decisions:
- issue: Значение ⲑⲉⲱⲥⲓⲥ
  choice: обожение
  alternative: божественное установление / положение
  rationale: Если OCR верно передаёт греческое θέωσις, прямой смысл — «обожение». Однако повреждённая или ошибочно распознанная форма может допускать иное греческое слово, поэтому неопределённость вынесена в примечание.
- issue: Статус ⲗⲟⲅⲟⲥ
  choice: Слово
  alternative: слово / Логос
  rationale: Перевод не отождествляет термин автоматически с конкретной христологической доктриной, но сохраняет возможность технического или персонифицированного употребления.
- issue: Статус ϣⲟϫⲛⲉ
  choice: Замысел
  alternative: совет / решение
  rationale: Прописная буква передаёт возможную космологическую персонификацию, не утверждая её как несомненную.
translation_notes:
  register: Современный литературный русский с возвышенной поэтической интонацией. Анафорическая формула «Я —» и намеренно странное сочетание «богов богов» сохранены. Перевод следует коптскому отрывку, а не ошибочным консультационным вариантам «одежда единства» и «крик»; при этом неопределённость OCR и синтаксиса не скрыта.
