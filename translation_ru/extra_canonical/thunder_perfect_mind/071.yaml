  source_fidelity: 'Начальное «повеление тех, кто просит меня» верно передаёт ⲡⲟⲩⲁϩⲥⲁϩⲛⲉ ⲛ̄ⲛⲉⲧⲁⲓⲧⲉⲓ ⲙⲙⲟⲉⲓ. Однако дальнейший русский текст существенно перестраивает синтаксис: «в месте обожения» относится к ангелам, а не к «голосам»; «в Слове» не следует присоединять к «изрекли» без оговорки; «явленных» не имеет опоры в тексте. Заключительное повторение ⲛ̄ⲛⲟⲩⲧⲉ ⲛ̄ⲛⲟⲩⲧⲉ следует сохранять как намеренно трудное «богов — богов…», а не объяснять добавленным причастием.'
  naturalness: '«Богов богов» без пунктуационного расчленения тяжеловесно, а «голосов ангелов, которые они изрекли» грамматически неясно: местоимение «они» не имеет естественного антецедента. Более буквальная сегментация с тире сохраняет поэтическую фрагментарность, но остаётся читаемой на современном литературном русском.'
  terminology: «Повеление» удачно. «Обожение» возможно как прямой эквивалент греч. заимствования ⲑⲉⲱⲥⲓⲥ, но не должно сопровождаться утверждением об OCR-неуверенности, которой не подтверждает приведённый текст. ⲗⲟⲅⲟⲥ лучше передать строчным «слово»; прописное «Слово» преждевременно задаёт богословскую персонификацию. Для ⲡϣⲟϫⲛⲉ подходит «замысел» или «совет», без прописной буквы.
  issues:
