base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/026.yaml
  text: 'You who know me[a], be ignorant of me;

    and those who have not known me, let them know me[b],

    for I am knowledge and ignorance.'
translation:
  language: ru
  text: '**4.** Вы, знающие меня, не знайте меня[a];

    а те, кто меня не знал, пусть познают меня[b],

    ибо я — знание и незнание.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможен и более резкий перевод: «будьте несведущи обо мне» или «не ведайте меня». Здесь сохранена игра однокоренных слов: «знающие — не знайте».'
    reason: lexical_alternative
  - marker: b
    text: Предоставленный OCR-фрагмент содержит строки о голосе, исходящем по земле, и, вероятно, относится к соседнему месту. Перевод этой строфы следует её принятому расположению в тексте «Грома»; поэтому привязка к указанным строкам остаётся неуверенной.
    reason: alignment_note
lexical_decisions:
- source_word: ⲥⲟⲟⲩⲛ (глагол)
  choice: знать / познать
  rationale: 'Основной коптский глагол когнитивного знания. Видовое различие в русском передаёт контекст: «знающие» обозначает состояние, а «пусть познают» — призыв прийти к знанию.'
- source_word: ⲁⲅⲛⲟⲉⲓ (глагол; заимствование из греч. ἀγνοεῖν)
  choice: не знайте
  rationale: Императив сохраняет резкий парадокс со словом «знающие». В данном контексте «не знайте» естественнее и точнее воспроизводит словесное противопоставление, чем нравственно окрашенное «будьте невежественны».
- source_word: ⲅⲛⲱⲥⲓⲥ (существительное)
  choice: знание
  rationale: Прямой и общеупотребительный эквивалент греческого заимствования γνῶσις, сохраняющий понятийную пару.
- source_word: ⲁⲅⲛⲱⲥⲓⲁ (существительное)
  choice: незнание
  rationale: «Незнание» сохраняет непосредственную антонимию со «знанием» и не вносит уничижительной окраски русского слова «невежество».
theological_decisions:
- issue: Парадоксальное самоотождествление со знанием и незнанием
  choice: 'Сохранить парадокс без истолкования: «я — знание и незнание»'
  alternative: Сгладить как «во мне и знание, и незнание» либо истолковать незнание метафорически
  rationale: Источник намеренно соединяет противоположности; разъясняющее перефразирование преждевременно разрешило бы богословское и риторическое напряжение.
translation_notes:
  register: Современный литературный русский с торжественной, но ясной ритмикой. Параллелизм и антиномия исходного высказывания сохранены; архаическое «ведать» в основном тексте не используется.
