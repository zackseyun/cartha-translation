  source_fidelity: 'Перевод верно передаёт принятую для данного места строфу: два императивных обращения и заключительное парадоксальное самоотождествление со знанием и незнанием. «Не знайте меня» сохраняет намеренно резкое противопоставление «знающие — не знайте» и не разрешает его интерпретацией. Приведённый коптский OCR-фрагмент, по-видимому, не соответствует этой строфе; это корректно и прозрачно отмечено в сноске b.'
