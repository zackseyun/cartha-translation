base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/047.yaml
  text: 'Among the peoples[a], they have named me “Death.”

    I am she whom they call “Law,” and you have called me “Lawlessness.”

    I am she whom you pursued, and I am she whom you seized.'
translation:
  language: ru
  text: 'Повсюду я — та, которую они называют «Смертью».[a]


    Я — та, которую они называют «Законом», а вы назвали меня «Беззаконием».


    Я — та, за которой вы гнались, и я — та, которую вы схватили.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в каждом месте». Из-за состояния OCR синтаксис этой строки не вполне надёжен; возможно также: «В каждом месте меня называют “Смертью”».'
    reason: Транскрипция основана на OCR средней уверенности, однако наиболее вероятное членение ϩⲛ ⲙⲁ ⲛⲓⲙ отличается от предложенного консультационным слоем «среди народов».
lexical_decisions:
- source_word: ϩⲛⲙⲁⲛⲓⲙ
  choice: повсюду
  rationale: Фразу естественнее всего членить как ϩⲛ ⲙⲁ ⲛⲓⲙ — «в каждом месте»; русское «повсюду» сохраняет её распределительно-локативный смысл без тяжеловесности.
- source_word: ⲙⲟⲩⲧⲉ ⲉⲣⲟⲥ ϫⲉ
  choice: называют …
  rationale: Обычная коптская конструкция именования; в русском название вводится творительным падежом.
- source_word: ⲡⲙⲟⲩ
  choice: «Смерть»
  rationale: Определённый артикль и функция имени-титула переданы прописной буквой и кавычками.
- source_word: ⲡⲛⲟⲙⲟⲥ
  choice: «Закон»
  rationale: Греческое заимствование νόμος передано основным юридико-религиозным соответствием; форма сохраняет прямую антитезу следующему слову.
- source_word: ⲧⲁⲛⲟⲙⲓⲁ
  choice: «Беззаконие»
  rationale: Передаёт ἀνομία и сохраняет в русском словесную связь и противопоставление «Закон — Беззаконие».
- source_word: ⲁⲛⲟⲕ ⲧⲉ …
  choice: Я — та, которая/которую …
  rationale: Женская копула ⲧⲉ и повторяющаяся формула самооткровения сохранены; падеж относительного местоимения согласован с русским синтаксисом.
- source_word: ⲡⲱⲧ ⲛⲥⲱⲥ
  choice: гнались за мной
  rationale: Идиома буквально связана с бегом вслед за кем-либо; «гнались» естественно выражает настойчивое преследование и хорошо сочетается со «схватили».
- source_word: ⲁⲙⲁϩⲧⲉ
  choice: схватили
  rationale: Передаёт физическое овладение или захват, не сужая значение до юридического «арестовали».
theological_decisions:
- issue: Парадоксальное самоотождествление говорящей со Смертью, Законом и Беззаконием
  choice: Сохранить все три наименования буквально и как титулы
  alternative: Ослабить парадокс поясняющими словами или истолковать названия метафорически
  rationale: Текст намеренно соединяет взаимоисключающие определения; перевод не должен заранее разрешать его богословское и риторическое напряжение.
translation_notes:
  register: Современный литературный русский с торжественным, но ясным ритмом. Повтор «Я — та» сохранён как структурная анафора; «гнались» и «схватили» употреблены в доступном современном значении. Кавычки и прописные буквы отмечают слова как парадоксальные имена-титулы.
