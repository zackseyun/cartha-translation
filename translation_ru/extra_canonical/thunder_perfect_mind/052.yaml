base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/052.yaml
  text: 'I am the one you have thought about[a],

    and you have mocked me.

    I am unlearned, and from me they learn.

    I am she whom you have scorned[g][f][e][d][c][b],

    and you think about me.'
translation:
  language: ru
  text: 'Я — та, о которой вы думали,


    и вы насмехались надо мной.



    Я неучёная[a], и у меня учатся.



    Я — та, которую вы презрели,


    и вы думаете обо мне.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «необразованная» или «невежественная». Последнее слово в современном русском обычно звучит более резко и уничижительно.'
    reason: lexical_alternative
  - marker: b
    text: После этих строк предоставленный коптский отрывок обрывается посреди слов ⲁⲛⲟⲕ ⲡⲉⲛ… («Я — тот/та, кто…»). Консультационная строка «закон / беззаконная» данному коптскому фрагменту не соответствует и, вероятно, относится к другому месту текста.
    reason: alignment_note
lexical_decisions:
- source_word: ⲙⲉⲉⲩⲉ ⲉⲣⲟⲓ / ⲧⲉⲧⲛ̄ⲙⲉⲉⲩⲉ ⲉⲣⲟⲉⲓ
  choice: думали обо мне / думаете обо мне
  rationale: Глагол с предлогом ⲉⲣⲟ- обозначает направленность мысли на лицо. Повтор одного русского глагола сохраняет намеренный параллелизм, а различие прошедшего и настоящего времени передаёт формы коптского текста.
- source_word: ⲁⲧⲉⲧⲛϣⲟⲥⲧ
  choice: вы насмехались надо мной
  rationale: 'Форма разбирается как перфект со 2-м лицом множественного числа и объектным суффиксом 1-го лица: «вы насмехались надо мной», а не «вы скрыли меня».'
- source_word: ⲁⲧⲥⲃⲱ
  choice: неучёная
  rationale: Отрицательное образование от ⲥⲃⲱ выражает отсутствие учёности или обучения. Женская форма согласуется с явно женской самоидентификацией говорящей далее и сохраняет парадокс с тем, что у неё учатся.
- source_word: ϫⲓⲥⲃⲱ ⲉⲃⲟⲗ ⲛ̄ⲧⲟⲟⲧ
  choice: у меня учатся
  rationale: Идиома буквально указывает на получение знания «от меня». Русская конструкция естественна и сохраняет активное значение «учатся», не превращая его без необходимости в пассивное «обучаются мной».
- source_word: ⲕⲁⲧⲁⲫⲣⲟⲛⲓ
  choice: презрели
  rationale: Греческое заимствование καταφρονέω означает относиться с презрением, пренебрегать. «Презрели» передаёт силу выражения и высокий поэтический регистр.
- source_word: ⲁⲛⲟⲕ ⲧⲉ ⲧⲉⲛⲧⲁ...
  choice: Я — та, которую...
  rationale: Явно женская коптская связка и относительная конструкция переданы женской формой, важной для голоса произведения.
theological_decisions:
- issue: Парадокс неучёной наставницы
  choice: 'Сохранить прямое противопоставление: «Я неучёная, но у меня учатся»'
  alternative: Истолковать ⲁⲧⲥⲃⲱ как смиренное самоумаление либо как утверждение сверхъестественной мудрости
  rationale: Текст намеренно удерживает парадокс и сам его не разъясняет; перевод не должен навязывать конфессиональное или эзотерическое толкование.
- issue: Связь последней главной клаузы с предшествующей
  choice: «и всё же вы думаете обо мне»
  alternative: «и та, о которой вы думаете»
  rationale: В коптском это самостоятельная клауза настоящего времени, а не продолжение относительной конструкции. «Всё же» естественно выявляет контраст, уже заложенный соседством презрения и размышления, не меняя референции.
translation_notes:
  register: Современный литературный русский язык с краткими, ритмичными строками и повтором «Я — та». Обращение «вы» сохраняет множественное число коптского оригинала. Женский род говорящей выражен явно. Слово «неучёная» выбрано как понятное и несколько возвышенное, но не архаическое; оно поддерживает афористический парадокс.
