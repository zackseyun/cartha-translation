  source_fidelity: 'В целом переданы основные конструкции: два обращения во 2-м лице множественного числа, перфект в первых двух высказываниях, настоящее время в последнем, обучение «от/у меня» и женская относительная форма в предпоследней строке. Однако коптское ⲁⲩⲱ означает простое «и»; в двух местах «но» и особенно «всё же» добавляют противительный вывод, который текст прямо не маркирует.'
  naturalness: Текст звучит естественно и литературно. «Я — та, о которой вы думали» грамматически и стилистически яснее, чем «о ком» при явно выбранном женском роде говорящей. «Неучёная» допустимо и хорошо сохраняет парадокс.
  terminology: '«Насмехались надо мной» точно передаёт ϣⲱⲥ; «презрели» удачно передаёт καταφρονέω. Женский род в «та, которую» следует сохранить. В примечании не следует предлагать «не знающая учения»: это сужает общий смысл «неучёная/необразованная» до религиозного учения.'
  issues:
