    rationale: В обеих позициях исходное ⲁⲩⲱ — координирующее «и». Парадоксика и возможный контраст сохраняются самим соположением утверждений; явное «но/всё же» интерпретирует их связь.
  - severity: low
    issue: «О ком» не согласовано с выбранной женской формой «та».
    rationale: В современном литературном русском при женском антецеденте естественно «та, о которой». Исходная первая относительная форма не даёт столь же явной женской маркировки, как позднейшая, но в русском тексте уже последовательно избран женский голос.
  - severity: low
