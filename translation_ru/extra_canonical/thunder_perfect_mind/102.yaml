  to: '**18.** Овладейте собой,


    ибо ваше внутреннее — ваше внешнее,


    и тот, кто придаёт форму вашему внешнему,


    — тот, кто сделал его образцом.[a]'
  rationale: Исправлен финальный референт, чтобы не подменять мужское коптское местоимение женским согласованием с добавленной «стороной». «Образцом» точнее воспроизводит τύπος, а примечание сохраняет как семантическую широту слова, так и неясность местоименной отсылки. Остальная структура сохранена.
