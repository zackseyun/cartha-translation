  - severity: medium
    issue: «Придал ей образ» недостаточно точно передаёт ⲣⲧⲩⲡⲟⲥ ⲙⲙⲟϥ.
    rationale: Конструкция содержит глагол «сделать» и τύπος; «сделал его образцом» ближе к исходной синтаксической и образной структуре. Возможное значение «отпечаток» следует оставить в сноске.
