  source_fidelity: 'Первая часть передана по смыслу верно: ⲁⲙⲁϩⲧⲉ ⲙⲙⲱⲧⲛ — повеление «овладейте собой / возьмите себя в руки», а пара «внутреннее—внешнее» сохранена. Однако в последней строке «ей» грамматически привязано к добавленному переводчиком слову «сторона», тогда как коптское ⲙⲙⲟϥ — местоимение 3-го лица мужского рода. Такой выбор неоправданно снимает неопределённость референта и ослабляет конструкцию «сделал его τύπος».'
