base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/102.yaml
  text: 'Take hold of yourselves[a];

    for your inside is your outside[c][b],

    and the one who fashions your outside

    is the one who shaped it.'
translation:
  language: ru
  text: '**18.** Овладейте собой,


    ибо ваше внутреннее — ваше внешнее,


    и тот, кто придаёт форму вашему внешнему,


    — тот, кто сделал его образцом.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. τύπος может означать «образец», «отпечаток», «оттиск» или «образ». Коптское местоимение имеет мужской род; его точный референт в этом отрывке не вполне ясен.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲙⲁϩⲧⲉ ⲙⲙⲱⲧⲛ
  choice: Овладейте самими собой
  rationale: Императив ⲁⲙⲁϩⲧⲉ означает «схватить, удержать, овладеть»; возвратное дополнение ⲙⲙⲱⲧⲛ относится к адресатам во множественном числе. Русская формулировка естественна и сохраняет оттенок активного обретения власти над собой.
- source_word: ⲡⲉⲧⲛⲥⲁϩⲟⲩⲛ
  choice: ваше внутреннее
  rationale: ⲥⲁϩⲟⲩⲛ обозначает внутреннюю сторону или то, что внутри; субстантивированная форма «внутреннее» сохраняет афористическое противопоставление.
- source_word: ⲡⲉⲧⲛⲥⲁⲃⲟⲗ
  choice: ваше внешнее
  rationale: ⲥⲁⲃⲟⲗ означает внешнюю сторону или то, что снаружи. Формулировка намеренно параллельна «ваше внутреннее».
- source_word: ⲣⲡⲗⲁⲥⲥⲉ
  choice: создаёт
  rationale: Заимствование от греческого πλάσσω передаёт формирование, лепку или создание. «Создаёт» звучит естественно, не устраняя образ формовки полностью.
- source_word: ⲣⲧⲩⲡⲟⲥ ⲙⲙⲟϥ
  choice: придал ей образ
  rationale: τύπος может означать образ, форму, отпечаток или образец. «Придал ей образ» передаёт результат формования и согласует местоимение с русским словом «сторона», не навязывая технического богословского смысла.
theological_decisions:
- issue: Тождество внутреннего и внешнего
  choice: 'Сохранено прямое парадоксальное утверждение: «ваше внутреннее — это ваше внешнее»'
  alternative: 'Смягчить до уподобления: «ваше внутреннее подобно вашему внешнему»'
  rationale: Коптская именная конструкция выражает тождество, а не явное сравнение; парадокс и напряжение текста не следует разрешать переводом.
- issue: Субъект последней строки
  choice: 'Сохранён один и тот же неопределённый деятель: «тот, кто… — тот, кто…»'
  alternative: Назвать деятеля Творцом или Богом
  rationale: Источник не называет деятеля и не даёт основания вводить конфессионально определённое именование.
translation_notes:
  register: Современный литературный русский с торжественным афористическим ритмом. Параллелизм «внутреннее — внешнее» сохранён; архаизмы и конфессионально нагруженная терминология не вводятся.
