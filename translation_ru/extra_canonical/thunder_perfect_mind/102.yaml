  terminology: ⲣⲡⲗⲁⲥⲥⲉ лучше передать как «придаёт форму» или «формирует», сохраняя образ лепки/формования. Для τύπος предпочтительно «образец» с примечанием об «отпечатке»; «образ» слишком широк и не отражает конструкцию «сделал его образцом».
