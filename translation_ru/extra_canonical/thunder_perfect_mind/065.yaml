  text: 'greatness in parts from smallness[a].

    For they know smallness from greatness.

    Why do you curse me and honor me?

    You have wounded, and you have shown mercy.

    Do not cast out the first things[c][b],'
translation:
  language: ru
  text: 'В некоторых частях величие — из малости.[a]


    Ибо они познают малость из величия.


    Почему вы проклинаете меня и чтите меня?


    Вы ранили — и помиловали.


    Не извергайте первых вещей.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В рукописном OCR форма слова «малость» передана неуверенно; предлагалось также чтение «понимание». Антитеза с «величием» поддерживает перевод «малость».
    reason: textual_uncertainty
  - marker: b
    text: 'Чтение заключительной строки по OCR не вполне надёжно. Глагол можно понимать как «изливать, выбрасывать»; возможно и иное чтение — «не отделяйте». Объект стоит во множественном числе: буквально «первые [вещи]».'
    reason: textual_and_lexical_uncertainty
lexical_decisions:
- source_word: ⲙⲛⲧⲛⲟϭ
  choice: величие
  rationale: Абстрактное существительное от ⲛⲟϭ «великий»; образует явную антитезу с «малостью».
- source_word: ϩⲛ ϩⲉⲛⲙⲉⲣⲟⲥ
  choice: в своих частях
  rationale: Передаёт множественное «в частях» и делает начальный фрагмент читаемым, не добавляя отсутствующего в источнике сказуемого.
- source_word: ⲉⲃⲟⲗ ϩⲛ
  choice: из
  rationale: Составной предлог выражает происхождение или исходную точку, а не пространственное «снаружи».
- source_word: ⲧⲙⲛⲧⲕⲟⲩⲉⲓ
  choice: малость
  rationale: Вероятная форма ⲙⲛⲧⲕⲟⲩⲓ, противопоставленная «величию»; OCR, по-видимому, исказил написание.
- source_word: ⲉϣⲁⲩⲥⲟⲩⲱⲛ
  choice: познают
  rationale: 'Разбирается как обычное/характерное действие во множественном числе: «они знают, познают», а не как глагол «стареть».'
- source_word: ⲉⲧⲃⲉ ⲟⲩ
  choice: почему
  rationale: За OCR-формой ⲉⲧⲕⲉ ⲟⲩ, вероятно, стоит вопросительное сочетание «почему».
- source_word: ⲧⲉⲧⲛⲥⲁϩⲟⲩ
  choice: вы проклинаете
  rationale: Глагол означает «проклинать»; форма второго лица множественного числа сохранена.
- source_word: ⲧⲉⲧⲛⲧⲁⲉⲓⲟ
  choice: вы чтите
  rationale: ⲧⲁⲉⲓⲟ означает «почитать, чтить», создавая намеренный парадокс с проклятием.
- source_word: ⲁⲧⲉⲧⲛϣⲱϥ
  choice: вы ранили
  rationale: Перфектная форма второго лица множественного числа; «ранили» сохраняет прямое противопоставление последующей милости.
- source_word: ⲁⲧⲉⲧⲛⲛⲁ
  choice: явили милость
  rationale: Перфект от глагола «миловать, проявлять сострадание»; русское выражение естественно и сохраняет смысл.
- source_word: ⲙⲡⲣⲡⲟⲩϩⲧ ⲉⲃⲟⲗ
  choice: не извергайте
  rationale: Отрицательный императив с глаголом изливания или выбрасывания; «извергайте» сохраняет энергичный образ и не сводит его к простому «отвергайте».
- source_word: ⲛⲛϣⲟⲣⲡ
  choice: того, что было первым
  rationale: Передаёт идею первых, первоначальных вещей без преждевременного превращения выражения в специальный философский термин «начала».
theological_decisions:
- issue: Парадокс проклятия и почитания, ранения и милости
  choice: Сохранены обе пары без согласования или причинного объяснения.
  alternative: Истолковать вторые действия как исправление первых либо развести действия между разными группами.
  rationale: Источник непосредственно соединяет противоположности и не объясняет их отношения; это напряжение существенно для речи персонажа.
- issue: Значение «первых» в заключительной строке
  choice: Нейтральное «то, что было первым».
  alternative: «Первые начала» или «первоначала».
  rationale: Источник допускает космологическое прочтение, но сам фрагмент не требует технического богословского термина.
translation_notes:
  register: Современный литературный русский с торжественной поэтической сжатостью. Начальная именная конструкция сохранена как фрагмент, поскольку отрывок начинается внутри более длинного высказывания. Повтор местоимения «вы» поддерживает обвинительный ритм, а противоположности не сглаживаются.
