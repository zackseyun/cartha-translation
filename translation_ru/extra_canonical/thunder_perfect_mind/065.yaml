  naturalness: Русский сохраняет сжатый, парадоксальный поэтический регистр. «В некоторых частях» естественнее и точнее, чем «в своих частях»; «первые вещи» намеренно несколько архаично, но приемлемо в литературном переводе и прозрачно поясняется сноской.
  terminology: «Величие», «малость», «чтите», «помиловали» не навязывают конфессиональной интерпретации и передают антитетическую лексику. Техническое «начала» не вводится, поскольку фрагмент сам по себе не требует такого прочтения.
