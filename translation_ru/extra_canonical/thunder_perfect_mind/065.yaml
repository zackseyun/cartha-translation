    rationale: Коптское ϩⲉⲛ означает неопределённое множественное «некоторые», а не «свои». Формула «в своих частях» добавляет отношение принадлежности, отсутствующее в источнике.
  - severity: medium
    issue: Утрата множественного числа в последней строке
    rationale: ⲛⲛϣⲟⲣⲡ имеет множественную форму («первые [вещи]»). Нынешнее «того, что было первым» переводит выражение в единственное число.
