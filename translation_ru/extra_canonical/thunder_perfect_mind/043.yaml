translation:
  language: ru
  text: 'И я — знание греков и неведение о нём[a].


    Я — суд греков и варваров.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Коптский текст в этом месте плохо распознан. Вероятное восстановление: «знание греков и неведение о нём»; местоимение может относиться к знанию или к подразумеваемому предмету знания.'
    reason: source_uncertainty
lexical_decisions:
- source_word: ⲧⲥⲟⲟⲩⲛ
  choice: знание
  rationale: Форма с определённым артиклем обозначает существительное «знание», а не качественное «мудрая»; это также сохраняет антитезу с последующим неведением.
- source_word: ⲧⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ (восстановление повреждённого OCR-чтения)
  choice: неведение
  rationale: Реконструируемое отвлечённое существительное буквально выражает отсутствие знания. «Неведение» естественно и достойно передаёт эту антитезу, не добавляя нравственной оценки слова «глупость».
- source_word: ⲫⲁⲡ / ⲡϩⲁⲡ
  choice: суд
  rationale: Чтение как определённая форма существительного ϩⲁⲡ означает «суд, приговор, суждение». Контекст допускает несколько оттенков, но «суд» наиболее кратко сохраняет их юридико-оценочную силу.
- source_word: ⲛⲉⲗⲗⲏⲛ
  choice: греков
  rationale: Греческое заимствование обозначает эллинов; русский родительный множественного числа естественно выражает собирательную группу.
- source_word: ⲛⲃⲁⲣⲃⲁⲣⲟⲥ
  choice: варваров
  rationale: Сохранён исторический греко-римский контраст «греки — варвары» без сглаживания до «чужеземцев» или «негреков».
theological_decisions:
- issue: Антитеза знания и неведения
  choice: Сохранить парадокс буквально, не объясняя, чьё именно это знание или неведение.
  alternative: Передать первую строку как «Я лишена разума, и я мудра».
  rationale: Такое альтернативное чтение возникло из ошибочного членения OCR-текста и не согласуется с различимыми именными конструкциями и последующей строкой о суде.
- issue: Значение ⲫⲁⲡ
  choice: «суд»
  alternative: «суждение» или «приговор»
  rationale: «Суд» сохраняет смысловую широту источника и не навязывает ни исключительно умственный акт, ни уже вынесенный приговор.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. Именные формулы «я — …» передают афористическую структуру оригинала. Архаизирующее «эллинов» не выбрано, поскольку «греков» яснее обычному читателю; исторически резкое «варваров» сохранено.
