base_translation:
  language: en
  yaml_path: translation/extra_canonical/thunder_perfect_mind/022.yaml
  text: 'Those who speak the truth about me[a], lie about me,

    and those who have lied about me, speak the truth about me.

    Those who know me, be ignorant of me,

    and those who have not known me[b], let them know me.'
translation:
  language: ru
  text: '**17.** Те, кто говорит обо мне правду, лгут обо мне,


    а те, кто лгал обо мне, говорят обо мне правду.


    Те, кто знает меня, — не знайте меня,


    а те, кто меня не знал, — пусть знают меня.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Последние две строки имеют форму парадоксальных побуждений: знающим велено не знать, а не знавшим — знать.'
    reason: grammatical_and_rhetorical_clarification
lexical_decisions:
- source_word: ⲙⲉ
  choice: правду
  rationale: Существительное означает «истина, правда»; в сочетании с глаголом речи естественно передаётся по-русски как «говорить правду».
- source_word: ϫⲓ ϭⲟⲗ
  choice: лгут / лгал
  rationale: Сочетание связано с ложью, а не с «изречением» или «возгласом»; контраст с ⲙⲉ требует перевода «лгать».
- source_word: ⲥⲟⲟⲩⲛ ⲙⲙⲟⲓ
  choice: знает меня / познают меня
  rationale: Глагол означает «знать, узнавать». В заключительном побуждении «познают» звучит естественно и передаёт вступление в знание, не устраняя парадокса.
- source_word: ⲉⲣⲟⲓ
  choice: обо мне
  rationale: 'При глаголах речи предлог здесь выражает предмет высказывания: «обо мне».'
theological_decisions:
- issue: Парадокс знания и незнания
  choice: Сохранены прямые побуждения «не знайте меня» и «пусть познают меня»
  alternative: Истолковать строки как предсказание или сгладить их до противопоставления знающих и незнающих
  rationale: Императивная сила высказываний и намеренное противоречие составляют смысловую форму отрывка; перевод не должен заранее разрешать её богословски.
- issue: Истинные и ложные высказывания о говорящей
  choice: Сохранено симметричное утверждение, что говорящие правду лгут, а лгавшие говорят правду
  alternative: Пояснить, в каком именно смысле истина становится ложью и наоборот
  rationale: Источник оставляет основание парадокса неразъяснённым, поэтому толкование не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным ритмом. Параллелизм и резкие смысловые противопоставления сохранены; устаревшая лексика и конфессионально окрашенные пояснения не использованы.
