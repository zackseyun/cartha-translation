  source_fidelity: 'Перевод в целом бережно следует предоставленному английскому свидетельству и корректно сохраняет лакуны, скобочные восстановления, неясный референт «these», а также технические термины. Однако в фразе после большой лакуны «чтобы двое могли стать одним» изменён субъект: свидетельство обращено к «вы» и говорит о становлении «из двух одним», а не о том, что некие «двое» становятся одним.'
  naturalness: Регистр современный литературный и уместно возвышенный. «Соглашаясь с истиной» в данном контексте звучит менее естественно, чем «пребывая в согласии с истиной»; последняя формулировка передаёт смысл without нежелательной персонификации истины.
  terminology: «София», «Мать Мира», «завеса», «Огдоада», «Сын Человеческий», «Невидимый» и «покой» переданы последовательно. Примечание к Огдоаде нейтрально и не навязывает конфессионального прочтения. «Нерождённый» сохраняет терминологическую неопределённость свидетельства.
  issues:
  - severity: medium
    issue: Изменён субъект и конструкция в формуле о единстве после лакуны.
    rationale: 'Английское свидетельство имеет обращение во 2-м лице: «that you could from two become one». Русское «чтобы двое могли стать одним» заменяет адресатов на третье лицо и опускает существенное «из двух». Без прямой проверки коптского безопаснее сохранить синтаксическую направленность свидетельства: «чтобы вы могли из двух стать одним».'
  - severity: low
    issue: Не вполне естественное сочетание «соглашаясь с истиной».
    rationale: Глагол «соглашаться» обычно предполагает лицо или утверждение как объект согласия. «Пребывая в согласии с истиной» естественнее по-русски и сохраняет смысл «agreeing with the truth» без дополнительного истолкования.
