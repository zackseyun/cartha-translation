  text: 'Mary asked him, “Holy Lord, where did your disciples come from, where are they going, and how should they act here?”


    The perfect Savior said to them, “I want you to know that Sophia, the Mother of the World and the consort, wanted by herself, without her male counterpart, to bring these into existence. However, by the will of the Father of the World, so that his ungraspable benevolence could be manifested, he created the curtain between the immortals and those that arrived thereafter, so that the result could follow that [ . . . ]


    (Coptic pages 115-116 missing)


    [] “[. . .] and breath, and could from two become one, just as it was from the beginning, that you could produce much fruit and ascend to He Who Is from the beginning, in unspeakable joy and glory, and [honor and] the gift of [the Father of the World].


    “[Consequently], whoever knows [the Father in perfect] knowledge [will go] to the Father [and repose in] the unbegotten [Father]. However, [whoever knows him imperfectly] will go [to the deficiency] and the repose [of the Ogdoad].


    “[Now], whoever silently knows the immortal [Spirit] of light, by reflecting and agreeing with the truth, if he gives to me signs of the Invisible One, he will become a light in the silent Spirit. Whoever knows the Son of Man in knowledge and love, if he gives me a sign of [] the Son of Man, he can go to the dwelling-places of those in the Ogdoad.”'
translation:
  language: ru
  text: 'Мария спросила его: «Святой Господь, откуда произошли твои ученики, куда они идут и как им следует поступать здесь?»


    Совершенный Спаситель сказал им: «Я хочу, чтобы вы знали: София, Мать Мира и супруга, сама, без своего мужского спутника, пожелала привести их[a] в бытие. Однако по воле Отца Мира — чтобы явилась его непостижимая благость — он создал завесу между бессмертными и теми, кто появился после них, чтобы вследствие этого произошло то, что […]


    (Коптские страницы 115–116 утрачены.)[b]


    […] «[…] и дыхание, и чтобы двое могли стать одним, как было от начала, чтобы вы могли принести много плода и взойти к Тому, Кто существует от начала, в неизреченной радости и славе, и [чести, и] даре [Отца Мира].


    «[Итак], кто познаёт [Отца совершенным] знанием, [пойдёт] к Отцу и [обретёт покой в] нерождённом [Отце]. Но [кто познаёт его несовершенно], пойдёт [к недостаточности] и к покою [Огдоады].[c]


    «[Теперь], кто в молчании познаёт бессмертный [Дух] света, размышляя и соглашаясь с истиной, тот, если даст мне знаки Невидимого, станет светом в безмолвном Духе. Кто познаёт Сына Человеческого в знании и любви, тот, если даст мне знак […] Сына Человеческого, сможет пойти в обители тех, кто пребывает в Огдоаде».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кого именно обозначает «их», в сохранившемся контексте неясно; возможный референт находился в предшествующем рассуждении.
    reason: Сохранение референциальной неоднозначности исходного свидетельства.
  - marker: b
    text: 'В этом месте рукопись имеет крупную лакуну: утрачены коптские страницы 115–116, поэтому связь между соседними фрагментами не восстанавливается уверенно.'
    reason: Обозначение физической утраты рукописного текста и нарушения контекста.
  - marker: c
    text: Огдоада (буквально «восьмерица») — техническое обозначение восьмеричной области или порядка; его точное значение определяется космологией произведения.
    reason: Пояснение редкого термина без навязывания единственного богословского истолкования.
lexical_decisions:
- source_word: Sophia
  choice: София
  rationale: Сохранено традиционное имя-персонификация; перевод «Премудрость» мог бы преждевременно устранить различие между именем и обычным существительным.
- source_word: the consort
  choice: супруга
  rationale: Передаёт женскую фигуру в парном отношении; последующее «без своего мужского спутника» поясняет характер этой пары, не вводя специальной гностической терминологии сверх свидетельства.
- source_word: male (counterpart)
  choice: мужской спутник
  rationale: Естественно по-русски обозначает парную мужскую фигуру и сохраняет идею соответствующей пары без предположения о браке в современном смысле.
- source_word: curtain
  choice: завеса
  rationale: Сохраняет образ разделяющей преграды и возвышенный регистр.
- source_word: He Who Is from the beginning
  choice: Тот, Кто существует от начала
  rationale: Передаёт титульный характер выражения и временную формулу, не отождествляя её без текстового основания с иным божественным именем.
- source_word: repose
  choice: покой / обрести покой
  rationale: В данном религиозном контексте «покой» естественнее буквального «отдохновение» и не уточняет спорный характер конечного состояния.
- source_word: Ogdoad
  choice: Огдоада
  rationale: Сохранён технический термин, поскольку замена на «Восьмерицу» могла бы звучать как истолкование его космологического смысла.
- source_word: silently / silent Spirit
  choice: в молчании / безмолвный Дух
  rationale: Различенные русские формы сохраняют повтор мотива тишины и дают естественный синтаксис.
theological_decisions:
- issue: Самостоятельное творческое действие Софии
  choice: Сохранено утверждение, что София пожелала привести их в бытие сама, без мужского спутника.
  alternative: Смягчить это как намерение или попытку творения, зависимую от Отца.
  rationale: Свидетельство прямо подчёркивает самостоятельность её желания; перевод не должен согласовывать космологию текста с позднейшими доктринальными схемами.
- issue: Неясность референта местоимения «these»
  choice: Передано местоимением «их» с примечанием о неясном референте.
  alternative: Уточнить как «учеников», «существ» или «миры».
  rationale: Из-за контекста и последующей лакуны точный референт нельзя надёжно установить.
- issue: Два вида знания и два места покоя
  choice: Сохранено противопоставление совершенного и несовершенного знания, а также Отца и Огдоады.
  alternative: Истолковать оба пути как степени одного спасения либо один из них как осуждение.
  rationale: Фрагмент не объясняет точный богословский статус «недостаточности» и «покоя Огдоады»; напряжение оставлено открытым.
- issue: Формула «двое могли стать одним»
  choice: Переведена буквально, без отнесения к определённому обряду, полу или метафизическому соединению.
  alternative: Истолковать как брачный, крещальный или духовно-антропологический союз.
  rationale: Утраченный ближайший контекст не позволяет выбрать одно толкование.
- issue: «Знаки» Невидимого и Сына Человеческого
  choice: Сохранено общее слово «знаки».
  alternative: Передать как таинства, печати, доказательства или символы.
  rationale: Доступное свидетельство не определяет природу этих знаков.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, диалогическим регистром. Квадратные скобки и многоточия сохранены как сигналы редакционного восстановления и повреждения текста. Перевод остаётся предварительным, поскольку выполнен по предоставленному общедоступному английскому свидетельству; прямая сверка с коптским текстом ещё не проведена.
