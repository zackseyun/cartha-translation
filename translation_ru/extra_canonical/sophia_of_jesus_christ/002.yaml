lexical_decisions:
- source_word: He Who Is
  choice: Сущий
  rationale: Краткое и достоинственное русское соответствие титулу существования; сохраняет его метафизическую насыщенность и повторяемость.
- source_word: inexpressible
  choice: невыразим
  rationale: Передаёт невозможность адекватно выразить словами, не подменяя её более узким понятием непознаваемости.
- source_word: nothing contingent
  choice: ни что-либо обусловленное
  rationale: Сохраняет философскую категорию зависимого, несамосущего бытия; прямой коптский разбор ещё предстоит.
- source_word: unbegotten
  choice: непорождён
  rationale: Отличено от «нерождён», стоящего рядом с «без рождения», чтобы сохранить два близких, но формально разных определения свидетеля.
- source_word: enigmatic appearance
  choice: таинственный облик
  rationale: Естественная русская формулировка, сохраняющая непостижимость явленного облика без усиления до полной скрытости.
- source_word: cannot be traced out
  choice: невозможно исследовать до конца
  rationale: Передаёт идею неисследимости и невозможности исчерпать поиском, а не буквального отслеживания.
- source_word: Father of the World
  choice: Отец мира
  rationale: Прямое и нейтральное воспроизведение титула без конфессионального истолкования значения слова «мир».
theological_decisions:
- issue: Соотношение Великого Спасителя и бессмертного, вечного Сущего в фразе с местоимением «он»
  choice: 'Сохранено местоимение «он»: «Ибо он бессмертен и вечен»'
  alternative: Явно отнести свойства к Спасителю или заменить местоимение на «Сущий»
  rationale: Английский свидетель допускает неоднозначность референта; её не следует устранять без проверки коптского текста.
- issue: Формула откровения через произошедшего от Первого Света
  choice: Сохранена цепочка посредничества без идентификации её участников
  alternative: Отождествить «того» со Спасителем или иной определённой фигурой
  rationale: Предоставленный свидетель не даёт достаточного основания для догматического уточнения.
- issue: Безымянность Сущего
  choice: 'Передан парадокс: титул «Сущий» сосуществует с утверждением, что он безымянен'
  alternative: Сгладить противоречие, назвав «Сущий» лишь описанием
  rationale: Текст намеренно удерживает апофатическое напряжение, которое перевод не должен разрешать.
- issue: 'Смена грамматического рода в исходном свидетеле: «it is infinite, he...»'
  choice: В русском тексте последовательно употреблено мужское местоимение «он»
  alternative: Перейти к среднему роду или безличной конструкции
  rationale: Русский титул «Сущий» требует мужского согласования; смысловая бесконечность при этом сохраняется, а искусственная смена рода была бы неестественна.
translation_notes:
  register: 'Современный литературный русский язык с возвышенным, но понятным апофатическим регистром. Параллельные краткие высказывания сохранены как отдельные строки. Перевод предварительный: выполнен по предоставленному англоязычному публичному свидетелю; непосредственная сверка с коптскими рукописями Nag Hammadi Codex III,4 и Berlin Codex 8502,3 остаётся необходимой. Пустая лакуна после «Матфей сказал» не отмечена отдельной сноской, поскольку в основном тексте невозможно естественно закрепить маркер без добавления предполагаемого содержания; синтаксически фраза читается полно.'
