translation:
  language: ru
  text: 'Тогда Варфоломей спросил его: «Почему в Евангелии <он> назван [] „Человеком“ и „Сыном Человеческим“? Итак, какое из этих имён относится к Сыну?»


    Святой сказал ему: «Я хочу, чтобы вы знали: Изначальный Человек именуется „Родителем“, „Самосовершенным Умом“. Вместе со своей супругой, великой Софией, он созерцал и явил своего перворождённого, двуполого сына.[a] Его мужское имя — „Перворождающий Сын Божий“, а женское — „Перворождающая София, Матерь Вселенной“; некоторые называют её „Любовью“. Перворождённый, называемый „Христом“, сотворил из Духа и Света несметное множество [] ангелов для служения, ибо он обладает властью от своего Отца».


    Его ученики сказали ему: «Господи, открой нам о том, кто называется „Человеком“, чтобы и мы могли в точности постичь его славу».


    Совершенный Спаситель сказал: «У кого есть уши слышать, пусть слышит! Поскольку перворождающий Отец произошёл от сияющего света, он именуется „Адамом, Оком Света“, [и] его неизреченные, не знающие тени святые ангелы непрестанно ликуют и радуются отражениям, которые они получили от своего Отца.[b] Всё царство Сына Человеческого, называемого „Сыном Божьим“, исполнено неизреченной, не знающей тени радости и неизменного ликования — ликования о его нетленной [] славе, доныне неслыханной и неявленной в эонах и их мирах, возникших после них.[c] Я произошёл от саморождённого, изначального Беспредельного Света, чтобы открыть вам всё».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Двуполого» — то есть соединяющего мужской и женский аспекты; далее текст даёт ему мужское и женское имена.
    reason: Поясняет непривычный космологический термин, не устраняя его смысл.
  - marker: b
    text: «Отражения» — предварительная передача слова английского свидетельства; прямое значение коптского чтения требует проверки.
    reason: Отмечает лексически неясное место, способное также подразумевать образы или подобия.
  - marker: c
    text: Последовательность «эоны и их миры, возникшие после них» синтаксически не вполне ясна; перевод сохраняет порядок и неоднозначность свидетельства.
    reason: Предупреждает читателя о неясной референции оборота и не предлагает спекулятивного исправления.
lexical_decisions:
- source_word: Primal Human
  choice: Изначальный Человек
  rationale: Сохраняет титульный и космогонический характер выражения, не смешивая его с обычным обозначением первого человека.
- source_word: the Begetter
  choice: Родитель
  rationale: Передаёт активное порождающее начало и при этом не сужает смысл до бытового «отца».
- source_word: Self-Completed Mind
  choice: Самосовершенный Ум
  rationale: Сохраняет составной технический титул и идею полноты в самом себе; ввиду отсутствия прямой коптской сверки решение предварительно.
- source_word: androgynous
  choice: двуполый
  rationale: Прямо передаёт совмещение мужского и женского аспектов; форма «андрогинный» была бы менее прозрачна обычному читателю.
- source_word: First-Begetting Son of God / First-Begetting Sophia
  choice: Перворождающий Сын Божий / Перворождающая София
  rationale: Сохраняет активный оттенок английского First-Begetting и параллелизм мужского и женского имён, отличая их от названия «Перворождённый» далее.
- source_word: aeons
  choice: эоны
  rationale: Устоявшийся термин для космологических областей или веков в данном корпусе; перевод «века» преждевременно снял бы терминологическую неоднозначность.
- source_word: shadowless
  choice: не знающий тени
  rationale: Естественная русская формула, сохраняющая образ отсутствия тени и не превращающая его в отвлечённое прилагательное.
- source_word: Infinite Light
  choice: Беспредельный Свет
  rationale: Передаёт космологический титул возвышенно и естественно; прописные буквы отмечают его титульное употребление.
theological_decisions:
- issue: Соотношение мужского и женского имён перворождённого существа
  choice: Сохранить одно двуполое существо с мужским и женским именами и последующие перемены грамматического рода
  alternative: Представить Сына и Софию как двух отдельных существ
  rationale: Свидетель прямо называет явленного сына двуполым и затем различает его мужское и женское имя; разделение устранило бы намеренное богословское напряжение.
- issue: Значение титулов «Человек» и «Сын Человеческий»
  choice: Сохранить оба титула буквально и не отождествлять их пояснением
  alternative: Истолковать оба как обычные христологические титулы одного лица
  rationale: Сам вопрос текста различает их и спрашивает, какое имя относится к Сыну; перевод не должен заранее разрешать вопрос.
- issue: Происхождение говорящего от Света
  choice: Перевести «Я произошёл от…»
  alternative: «Я был рождён» или «Я сотворён»
  rationale: Нейтральное «произошёл» сохраняет неуточнённый характер происхождения и не навязывает учения о рождении либо сотворении.
- issue: Ангелы, созданные «из Духа и Света»
  choice: Связать «из Духа и Света» с сотворением ангелов
  alternative: Связать оборот со служением ангелов
  rationale: Такова наиболее естественная синтаксическая связь в представленном свидетельстве, хотя без прямой сверки с коптским текстом она остаётся предварительной.
translation_notes:
  register: 'Современный литературный русский язык с возвышенным, но понятным регистром. Титульные наименования выделены кавычками и прописными буквами. Все имеющиеся угловые и квадратные скобки сохранены как сигналы состояния текста. Проект предварительный: представленное основание является английским публичным свидетельством, а прямая сверка с коптскими рукописями ещё не выполнена.'
