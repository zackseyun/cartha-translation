  text: 'Тогда Фома спросил [его]: «Господь, Спаситель, сколько эонов превыше небес?»


    Совершенный Спаситель сказал: «Я хвалю тебя за то, что ты спрашиваешь о великих эонах, ибо корни ваши пребывают в бесконечностях. Когда были явлены те, о ком я говорил прежде, он [предоставил…]


    (Коптские страницы 109 и 110 утрачены)[a]


    […] [] и достигают единства — мы называем их „Собранием Огдоады“[b]. Оно явилось двуполым и было названо отчасти мужским, отчасти женским. Мужское именуется „Собранием“, а женское — „Жизнью“, чтобы было показано, что жизнь всех эонов произошла от женского начала.


    И все имена были получены от Первоначала. Ибо из его согласия со своей Мыслью весьма скоро явились силы, названные „богами“. По своей мудрости [эти] боги богов явили богов, <а боги> по своей мудрости явили господ; господа господ своими действиями мысли явили господ, а господа своей силой явили архангелов. Архангелы своими словами явили ангелов; [] от них явились подобия, обладавшие устройством, обликом и наименованием для всех эонов и их миров.


    А все бессмертные, которых я только что описал, обладают властью от Бессмертного Человека, именуемого „Молчанием“[c], ибо, когда они созерцали безмолвно, без произнесённых слов, принадлежащее ей величие достигло полноты. Поскольку нетленные обладали властью, каждый создал в Огдоаде великое царство, а также престолы, храмы и небесные тверди для собственного величия, ибо все они возникли по воле Матери Мира».


    Тогда святые апостолы сказали ему: «Господь, Спаситель, расскажи нам о пребывающих в эонах, ибо нам необходимо узнать о них».


    Совершенный [] Спаситель сказал: «Вы можете спрашивать о чём угодно, и я дам вам ответ.


    Они сотворили ангельские воинства — бесчисленные мириады — для служения и для своей славы. Они сотворили девственные духи, невыразимые и непоколебимые светила, ибо те не испытывают ни немощи, ни слабости, но проявляют волю.


    Так эоны вскоре достигли полноты вместе с небесами и небесными твер­дями — во славе Бессмертного Человека и его спутницы Софии[d]. Оттуда все эоны и миры, а также возникшие впоследствии, получили образец, по которому создавали свои подобия — и в небесах хаоса, и в своих мирах. И всякая природа, начиная с явления хаоса, пребывает в свете без тени, в неописуемой радости и несказанном ликовании. Они непрестанно наслаждаются своей неувядающей славой [] и бесконечным покоем, который невозможно описать среди всех эонов и всех их сил, возникших впоследствии. Всё, что я ныне поведал вам, я сказал для того, чтобы вы сияли в свете ещё ярче, чем они»».


    [a] В рукописи здесь отсутствуют две коптские страницы; поэтому ход рассуждения между фрагментами не восстанавливается.

    [b] Огдоада — совокупность восьми; здесь это наименование небесного Собрания.

    [c] В тексте «Бессмертный Человек» назван «Молчанием», но далее употреблено местоимение женского рода («ей»). Эта грамматическая и смысловая напряжённость сохранена.

    [d] «София» — греческое имя, означающее «Мудрость».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В рукописи здесь отсутствуют две коптские страницы; поэтому ход рассуждения между фрагментами не восстанавливается.
    reason: Объясняет существенную физическую лакуну рукописи и предотвращает попытку связать разорванные предложения.
  - marker: b
    text: Огдоада — совокупность восьми; здесь это наименование небесного Собрания.
    reason: Разъясняет редкий технический термин без замены его интерпретирующим переводом.
  - marker: c
    text: В тексте «Бессмертный Человек» назван «Молчанием», но далее употреблено местоимение женского рода («ей»). Эта грамматическая и смысловая напряжённость сохранена.
    reason: Фиксирует подлинную неоднозначность свидетельства.
  - marker: d
    text: «София» — греческое имя, означающее «Мудрость».
    reason: Делает имя понятным обычному читателю, не переводя его прямо в основном тексте.
lexical_decisions:
- source_word: aeons
  choice: эоны
  rationale: Сохранён специальный космологический термин, поскольку нейтральные варианты «веки» или «миры» здесь сузили бы либо исказили значение.
- source_word: Assembly of the Ogdoad
  choice: Собрание Огдоады
  rationale: «Собрание» передаёт корпоративное единство, а «Огдоада» сохраняет техническое обозначение восьмерицы.
- source_word: originative principle
  choice: Первоначало
  rationale: Естественный и ёмкий русский философско-религиозный термин, не уточняющий сверх источника личную или безличную природу начала.
- source_word: simulacra / likenesses
  choice: подобия
  rationale: Передаёт производный, образный характер сущностей без негативных оттенков слова «симулякры».
- source_word: firmaments
  choice: небесные тверди
  rationale: Сохраняет древний космологический образ и одновременно ясно отличает его от небес вообще.
- source_word: Immortal Human
  choice: Бессмертный Человек
  rationale: Сохранены титульность и антропологический термин; замена на «муж» или «человечество» разрешила бы двусмысленность.
- source_word: Silence
  choice: Молчание
  rationale: Сохранено как персонифицированное имя, отмеченное прописной буквой.
- source_word: consort
  choice: спутница
  rationale: Передаёт парное отношение без навязывания брачного статуса, которого термин не обязательно требует.
- source_word: virgin spirits
  choice: девственные духи
  rationale: Формально сохранён необычный образ; «чистые духи» было бы богословской интерпретацией.
theological_decisions:
- issue: Происхождение жизни эонов от женского начала
  choice: «жизнь всех эонов произошла от женского начала»
  alternative: «жизнь всех эонов произошла от женщины»
  rationale: Контекст говорит об андрогинной сущности и её женской стороне; «женское начало» естественно передаёт это, не отождествляя её с обычной человеческой женщиной.
- issue: Род Бессмертного Человека / Молчания
  choice: Сохранено сочетание мужского титула с последующим женским местоимением
  alternative: Согласовать весь отрывок в одном грамматическом роде
  rationale: Свидетельство содержит реальную напряжённость между обозначениями; её нельзя молча устранять.
- issue: «богов», «господ» и небесная иерархия
  choice: Нарицательные слова со строчной буквы
  alternative: «Боги» и «Господа» как титулы с прописной
  rationale: Так сохраняется множественная иерархия текста без отождествления этих существ с единым Богом или с конфессионально закреплёнными титулами.
- issue: Совершение или полнота эонов
  choice: «достигли полноты»
  alternative: «были завершены»
  rationale: В космологическом контексте выражение может обозначать как завершение формирования, так и обретение полноты; выбранная формулировка удерживает оба оттенка.
- issue: София
  choice: Имя «София» сохранено, значение вынесено в примечание
  alternative: Перевести в основном тексте как «Мудрость»
  rationale: София выступает как именованная спутница; транслитерация не стирает различие между именем и абстрактным качеством.
translation_notes:
  register: Современный литературный русский язык с достоинством религиозно-философского диалога. Технические термины «эон», «Огдоада» и «София» сохранены и кратко пояснены. Рукописные знаки […], [], <…> и уведомление об утраченных страницах оставлены без реконструкции. Поскольку прямая сверка с коптским оригиналом ожидается, проект осторожно следует предоставленному публичному английскому свидетельству и не скрывает его текстологических неопределённостей.
