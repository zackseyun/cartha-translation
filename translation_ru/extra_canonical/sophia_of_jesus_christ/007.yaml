translation:
  language: ru
  text: 'Ученики снова сказали ему: «Скажи нам прямо: как они низошли из невидимых областей, из нетленного — в мир смертности?»


    Совершенный Спаситель сказал: «Сын Человеческий соединился со своей спутницей Софией и явил великий двуполый Свет. Его мужское имя — „Спаситель, Все-Родитель“, а женское — „София, Все-Родитель“; некоторые называют её „Пистис“[a].


    Подобно […] капле Света, всякий входящий в мир посылается им в мир Вседержителя, чтобы тот хранил его. И по воле Софии оковы его забвения связали Свет, чтобы через это всему обнищавшему миру было <открыто>[b] происходящее — гордыня и слепота Вседержителя и неведение, которое дало ему имя.


    Я же по воле великого Света произошёл из вышних областей и, <освободив>[c] от этих оков, пресёк действия разбойников. Я пробудил ту каплю, что была послана от Софии, чтобы через меня она принесла много плода, достигла совершенства и больше никогда не терпела ущерба, но через меня, великого Спасителя, была <соединена>[d], чтобы явилась его слава; чтобы и София была избавлена от того ущерба; чтобы её […] дети больше никогда не терпели ущерба, но обрели честь и славу, взошли к своему Отцу и поняли речь мужского Света.


    И вы были посланы Сыном, который и сам был послан, чтобы вы обрели Свет и отделились от забвения властей и чтобы оно никогда больше не проявилось из-за вас — то есть то нечистое трение, которое возникает от грозного огня, изошедшего из их фаллоса. Попирайте их злой умысел».


    [a] «Пистис» — передача греческого слова, означающего «вера» или «верность»; здесь оно служит именем Софии.

    [b] Восстановленное редакторами чтение в повреждённом месте рукописи.

    [c] Восстановленное редакторами чтение; грамматическая связь фразы в сохранившемся свидетельстве не вполне ясна.

    [d] Восстановленное редакторами чтение; неясно также, к кому именно относится последующее местоимение «его».'
  philosophy: optimal-equivalence
