review_pass:
  verdict: revise
  source_fidelity: 'Предварительная сверка возможна лишь с предоставленным английским свидетельством: коптский текст в данных не приведён. В целом перевод сохраняет космологическую структуру, лакуны, редакторские восстановления, неопределённые местоименные связи и резкую телесную образность. Однако «Все-Родитель» — неестественный и семантически менее точный эквивалент All-Begetter; также в фразе с <loosing> русская деепричастная конструкция создаёт ложное впечатление, что Спаситель освобождает самого себя.'
  naturalness: Регистр в целом удачен. «Всерождающий» / «Всерождающая» естественнее в возвышенно-космологическом контексте, чем искусственное «Все-Родитель». «Выйдя из вышних мест» лучше передаёт originated from the places above, чем «произошёл из вышних областей».
  terminology: София, Пистис, Вседержитель, власти, Свет и фаллос переданы последовательно. Гендерно различенные формы «Всерождающий» и «Всерождающая» сохраняют параллелизм двух имён и буквальный смысл begetter, не вводя конфессиональной интерпретации.
  issues:
  - severity: medium
    issue: Титул «Все-Родитель»
    rationale: Это слово не является нормальным современным литературным русским титулом и означает прежде всего родителя, а не того, кто порождает всё. Оно также не позволяет естественно отразить различие мужского и женского имён, прямо обозначенное в свидетельстве.
  - severity: medium
    issue: Синтаксис «и, <освободив> от этих оков»
    rationale: Деепричастие не имеет выраженного дополнения и в русском легко прочитывается как освобождение говорящего от оков, тогда как английское свидетельство допускает иную связь. Нужна более нейтральная конструкция с примечанием о неясном синтаксисе.
  - severity: low
    issue: «Произошёл из вышних областей»
    rationale: В данном повествовательном контексте звучит менее естественно, чем «вышел/явился из вышних мест», и «области» повторяет ранее введённые «невидимые области» без необходимости.
