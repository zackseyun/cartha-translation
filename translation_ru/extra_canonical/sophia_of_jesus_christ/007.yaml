lexical_decisions:
- source_word: invisibilities
  choice: невидимые области
  rationale: Передаёт множественное число и космологический смысл, не превращая абстрактное выражение в догматический термин.
- source_word: androgynous light
  choice: двуполый Свет
  rationale: Ясно и буквально передаёт сочетание мужского и женского начал; «Свет» оформлен как именованная космологическая реальность.
- source_word: All-Begetter
  choice: Все-Родитель
  rationale: Сохраняет общий для мужского и женского имени титул и идею порождения всего, избегая исключительно мужского «Всеотец».
- source_word: Pistis
  choice: Пистис
  rationale: Сохранено как имя; значение пояснено в примечании, поскольку перевод «Вера» стёр бы ономастическую функцию.
- source_word: Almighty
  choice: Вседержитель
  rationale: Устойчивый и понятный русский титул, при этом контекстуальная критика носителя титула сохранена без смягчения.
- source_word: authorities
  choice: власти
  rationale: Буквальный космологический термин сохранён без подмены более конфессионально нагруженным обозначением.
- source_word: impure rubbing
  choice: нечистое трение
  rationale: Сохраняет необычный и телесный образ исходного свидетельства, не эвфемизируя его.
- source_word: phallus
  choice: фаллос
  rationale: Прямой анатомико-ритуальный термин необходим для сохранения резкости и образности текста.
theological_decisions:
- issue: Личность Вседержителя в критическом описании
  choice: Сохранены слова о «гордыне и слепоте Вседержителя»
  alternative: Смягчить или отнести свойства только к миру либо силам
  rationale: Свидетельство прямо связывает эти определения с Almighty; перевод не должен согласовывать текст с позднейшими богословскими системами.
- issue: Родовая двойственность явленного Света
  choice: Сохранены мужское и женское имена одного двуполого Света
  alternative: Истолковать их как две отдельные сущности
  rationale: Текст одновременно говорит об одном Свете и двух гендерно обозначенных именах; напряжение сохранено.
- issue: Неясный референт местоимения в «его слава»
  choice: Оставлено местоимение «его» и добавлено примечание
  alternative: Уточнить «слава Спасителя», «слава Света» или «слава капли»
  rationale: Свидетельство не позволяет уверенно выбрать референт, поэтому неоднозначность не устранена.
- issue: Местоименные связи в рассказе о капле
  choice: По возможности сохранены местоимения без догматизирующего уточнения действующих лиц
  alternative: Повсюду заменить местоимения именами космологических персонажей
  rationale: Так сохраняется реальная синтаксическая неоднозначность доступного свидетельства.
translation_notes:
  register: 'Современный литературный русский с возвышенным, но доступным повествовательным регистром. Необычная космологическая терминология и резкая телесная образность не сглажены. Многоточия в квадратных скобках обозначают лакуны, а угловые скобки — редакторские восстановления доступного английского свидетельства. Проект предварительный: прямое сопоставление с коптским текстом Nag Hammadi Codex III,4 и Berlin Codex 8502,3 ещё требуется.'
