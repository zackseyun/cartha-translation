    В начале беспредельный, самовозросший[a], […] самосозданный Отец, исполненный сияющего и неизреченного света, когда пожелал, чтобы его подобие стало великой силой, — тогда первоначало того света внезапно явилось как бессмертный андрогинный Человек, чтобы через этого бессмертного Человека они могли обрести своё спасение и пробудиться от забвения через посланного истолкователя, который пребывает с вами до конца обнищавших разбойников[b]. Его спутница — Великая София; Саморождённый Отец от начала предназначил её в нём для единения — от Бессмертного Человека, явившегося первым, как божество и царство, ибо это было открыто Отцом, […][c] которого называют «Человеком», «Самоотцом». Ради собственного величия он сотворил могущественный эон по имени Огдоада и даровал ему великую власть, вплоть до господства над обнищавшим творением.


