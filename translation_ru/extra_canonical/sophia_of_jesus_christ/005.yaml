    Что касается неразрушимости, они и в самом деле равны; но по силе между ними есть различие, подобное различию между отцом и сыном, <сыном>[e] и мыслью, а также между мыслью и тем, что остаётся после неё. Как я уже говорил, среди сотворённых сущностей первой является монада. А после всего остального всё, что явилось, открылось из его силы. Из сотворённых сущностей произошло всё изготовленное, из изготовленного — всё получившее образ, а из получившего образ — всё получившее имя. Так от начала до конца возникло различие среди нерождённых[f].'
