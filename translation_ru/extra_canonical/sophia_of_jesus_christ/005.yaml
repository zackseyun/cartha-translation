translation:
  language: ru
  text: 'Матфей спросил его:


    — Господь, Спаситель, как явился Человек?


    Совершенный Спаситель сказал:


    — Я хочу, чтобы вы познали того, кто явился прежде мира.


    В начале беспредельный, самовозросший[a], […] самосотворённый Отец, исполненный сияющего и неизреченного света, пожелал, чтобы его подобие стало великой силой. Тогда первоначало того света внезапно явилось как бессмертный двуполый Человек, чтобы через этого бессмертного Человека они могли обрести спасение и пробудиться от забвения — через посланного истолкователя, который пребывает с вами до конца обнищавших разбойников[b]. Его спутница — Великая София. Саморождённый Отец от начала предназначил её в нём для единения — от Бессмертного Человека, явившегося первым как божество и царство, ибо это было открыто Отцом, […][c] которого называют «Человеком», «Самоотцом». Ради собственного величия он сотворил могущественный эон по имени Огдоада и даровал ему великую власть — вплоть до господства над обнищавшим творением.


    Из того света и тройственного мужского Духа, принадлежащего Софии, его спутнице, он сотворил богов, ангелов и <архангелов>[d] — неисчислимые мириады для служения. Ибо этот Бог сотворил божество и царство, и потому его назвали «Богом богов» и «Царём царей». В нём Первоизначальный Человек обладает своим единственным умом и мыслью — то есть мыслью, размышлением и созерцанием, разумом, […] и силой. Все существующие свойства совершенны и бессмертны.


    Что касается неразрушимости, они и в самом деле равны; но по силе между ними есть различие, подобное различию между отцом и сыном, <сыном>[e] и мыслью, а также мыслью и тем, что остаётся после неё. Как я уже говорил, среди сотворённых сущностей первой является монада. А после всего остального всё явившееся открылось из его силы. Из сотворённых сущностей произошло всё изготовленное, из изготовленного — всё получившее образ, а из получившего образ — всё получившее имя. Так от начала до конца возникло различие среди нерождённых[f].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Перевод «самовозросший» предварителен. В доступном английском свидетеле здесь стоит self-grown; далее следуют близкие, но не тождественные определения «самосотворённый» и «саморождённый».
    reason: Сохраняет различение необычных терминов происхождения до прямой проверки коптского текста.
  - marker: b
    text: Выражение «до конца обнищавших разбойников» неясно и передано близко к доступному свидетелю; возможны иные членение и понимание после проверки коптского текста.
    reason: Свидетель даёт семантически трудное выражение impoverished thieves, которое нельзя уверенно сгладить.
  - marker: c
    text: Знак […] обозначает лакуну или повреждённое место текста, отмеченное в используемом свидетеле.
    reason: Сохраняет сигнал о текстовой утрате.
  - marker: d
    text: Угловые скобки обозначают слово, восстановленное редактором свидетеля.
    reason: Сохраняет редакционный статус добавленного «архангелов».
  - marker: e
    text: Второе слово «сыном» восстановлено редактором свидетеля.
    reason: Сохраняет редакционный статус чтения, необходимого для цепочки сравнений.
  - marker: f
    text: «Нерождённых» буквально передаёт доступный свидетель, хотя это слово создаёт трудность после упоминания сотворённых сущностей. Прямое сопоставление с коптскими рукописями ещё требуется.
    reason: Не позволяет молча исправить подлинное или возникшее в передаче богословское напряжение.
lexical_decisions:
- source_word: Human
  choice: Человек
  rationale: Заглавная буква сохраняет употребление слова как титула или имени небесной сущности, не сводя его к обычному обозначению человека.
- source_word: self-grown
  choice: самовозросший
  rationale: Сохранён необычный образ самостоятельного происхождения; вариант не отождествлён с соседними терминами «самосотворённый» и «саморождённый».
- source_word: androgynous
  choice: двуполый
  rationale: Передаёт совмещение мужского и женского начал понятным современным словом без медицинского оттенка слова «гермафродитный».
- source_word: Sophia
  choice: София
  rationale: Сохранено собственное имя; оно также допускает слышимое в греческом фоне значение «Мудрость», но перевод не подменяет имя толкованием.
- source_word: aeon
  choice: эон
  rationale: Технический космологический термин сохранён транслитерацией, поскольку «век» или «мир» преждевременно снимали бы его смысловую многозначность.
- source_word: Ogdoad
  choice: Огдоада
  rationale: Сохранён традиционный термин для восьмерицы или восьмого небесного порядка без пояснительного расширения в основном тексте.
- source_word: monad
  choice: монада
  rationale: Сохранён философско-космологический термин, обозначающий единицу или первичное единство.
- source_word: unbegotten ones
  choice: нерождённые
  rationale: Буквально сохраняет заключительное богословское напряжение с предшествующей речью о сотворённых сущностях.
theological_decisions:
- issue: Соотношение Отца, Бессмертного Человека и Самоотца
  choice: Синтаксическая неоднозначность сохранена насколько возможно; местоимения не заменены догматически уточняющими именами.
  alternative: Однозначно отнести каждое местоимение либо к Отцу, либо к Бессмертному Человеку.
  rationale: Свидетель допускает несколько референтов, а прямой коптский разбор пока не выполнен.
- issue: «Боги» и титул «Бог богов»
  choice: 'Передано буквально: «богов», «Богом богов».'
  alternative: Заменить «богов» на «божественные существа».
  rationale: Более мягкий вариант устранил бы реальное космологическое и богословское напряжение текста.
- issue: Равенство в неразрушимости и различие в силе
  choice: Обе стороны утверждения сохранены без согласования или систематизации.
  alternative: Истолковать различие как различие только функций или рангов.
  rationale: Источник прямо сополагает равенство и различие, не объясняя их окончательно.
- issue: Противоречие между сотворёнными сущностями и нерождёнными
  choice: Заключительное «среди нерождённых» оставлено без исправления.
  alternative: Исправить на «среди рождённых» или «сотворённых».
  rationale: Это может быть текстовой трудностью, особенностью аргумента или проблемой перевода свидетеля; без проверки рукописей исправление неоправданно.
translation_notes:
  register: 'Современный литературный русский язык с достоинством апокрифического откровительного диалога. Технические термины «эон», «Огдоада» и «монада» сохранены, а чрезмерно архаические формы избегаются. Перевод предварительный: он основан на предоставленном общедоступном английском свидетеле; непосредственная сверка с коптским текстом Nag Hammadi Codex III,4 и Berlin Codex 8502,3 остаётся необходимой. Квадратные многоточия и угловые скобки сохраняют сигналы лакун и редакционных восстановлений.'
