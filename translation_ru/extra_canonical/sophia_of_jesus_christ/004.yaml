translation:
  language: ru
  text: 'Мария спросила его: «Тогда как же, Господь, мы можем это познать?»


    Совершенный Спаситель сказал: «Начните с сокрытого и идите до пределов видимого, и истечение Мысли само откроет вам, как в видимом обретается вера в невидимое — в то, что принадлежит нерождённому Отцу. У кого есть уши, чтобы слышать, пусть слышит!


    «Господь Мира называется не „Отцом“, а „Праотцом“, <потому что Отец есть> первоначало тех, кто станет видимым; он же [] — безначальный Праотец. Он созерцает себя в самом себе, словно в зеркале, явившись в собственном подобии как божественный Самоотец и <как> отражающий, стоящий над отражающими, — первый сущий, нерождённый Отец. Поистине, он столь же древен, <как> свет, который перед ним, но не равен ему по силе.[a]


    «Затем он явил множество отражающих, саморождённых, равных по древности и силе, пребывающих в славе, — поистине бесчисленных. Их род называется „Родом, над которым нет царства“, происходящим от того, в ком вы сами стали видимыми среди этих <царств>.[b] И всё это множество, над которым нет царства, называется [] „Детьми Нерождённого Отца“, „Богом“, „[Спасителем]“ и „Сыном Божьим“; его подобие пребывает с вами.[c]


    «Он — Непознаваемый, исполненный всякой нетленной славы и неизреченной радости. Все они покоятся в нём, непрестанно радуясь неизреченной радостью о его неизменной славе и безмерно ликуя. Прежде об этом никогда не слышали и этого не знали ни в одном из эонов и их миров».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Фраза различает этого «нерождённого Отца» и «свет, который перед ним»: они названы равными по древности, но не по силе. Неясность и напряжение сохранены.'
    reason: Не допустить молчаливого отождествления или догматического согласования фигур.
  - marker: b
    text: Синтаксис выражения «происходящим от того, в ком…» не вполне ясен; оно может относиться к роду или к ближайшему названному источнику. Перевод сохраняет эту неясность.
    reason: Исходная английская свидетельская формулировка трудна, а прямая сверка с коптским текстом ещё не выполнена.
  - marker: c
    text: Пустые квадратные скобки обозначают повреждение или пропуск в рукописи; форма «[Спасителем]» является восстановлением текста. Единственное число титулов сохранено по свидетельству, хотя речь идёт о множестве.
    reason: Зафиксировать текстологические сигналы и грамматическую неоднозначность.
lexical_decisions:
- source_word: Forefather
  choice: Праотец
  rationale: Передаёт противопоставление «Отцу» и обозначает предшествующее первоначало, не вводя более узкого конфессионального термина.
- source_word: emanation of Thought
  choice: истечение Мысли
  rationale: «Истечение» сохраняет образ исхождения, а прописная буква отмечает Мысль как персонифицированную или техническую реальность исходного контекста.
- source_word: unbegotten
  choice: нерождённый
  rationale: Формально сохраняет отрицание рождения/происхождения и не подменяет его толкованием «несотворённый».
- source_word: Self-Father
  choice: Самоотец
  rationale: Необычный составной термин сохранён как техническое наименование, отражающее необычность свидетельства.
- source_word: reflector / reflecting ones
  choice: отражающий / отражающие
  rationale: Сохраняется повтор одного корня и связь с предшествующим образом зеркала.
- source_word: self-begotten
  choice: саморождённые
  rationale: Передаёт внутренне необычный термин без его догматического сглаживания.
- source_word: aeons
  choice: эоны
  rationale: Устоявшийся русский термин для космологических реальностей в подобных древних текстах; перевод «века» скрыл бы технический смысл.
- source_word: Generation Above Which There Is No Kingdom
  choice: Род, над которым нет царства
  rationale: Сохраняет заглавное наименование и конструктивную неоднозначность «kingdom» как царства или владычества.
theological_decisions:
- issue: Соотношение Праотца, нерождённого Отца и предшествующего света
  choice: Сохранено различение лиц/реальностей и утверждение о неравенстве в силе
  alternative: Согласовать обозначения как относящиеся к одному Богу или сгладить иерархию
  rationale: 'Текст содержит подлинное напряжение: субъект назван нерождённым Отцом, но свет перед ним превосходит его силой. Перевод не должен разрешать это конфессионально.'
- issue: Единственное и множественное число в наименованиях множества
  choice: Сохранены единственные формы «Бог», «Спаситель», «Сын Божий» при собирательном «множество»
  alternative: Поставить все титулы во множественное число
  rationale: Так отражена грамматическая и богословская неоднозначность свидетельства, где всё множество получает единичные наименования.
- issue: Статус Мысли и Непознаваемого
  choice: Употреблены прописные буквы в «Мысль» и «Непознаваемый»
  alternative: Передать как обычные нарицательные существительные
  rationale: Контекст допускает технические или ипостасные обозначения; прописная буква помогает сохранить это, не определяя точную онтологию.
