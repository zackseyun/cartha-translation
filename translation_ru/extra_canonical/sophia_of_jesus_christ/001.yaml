  footnotes:
  - marker: a
    text: Квадратные скобки отмечают лакуну или повреждение рукописи. Название горы передано по доступному английскому свидетельству; чтение исходного коптского текста требует проверки.
    reason: Сигнализировать повреждение текста и предварительный характер необычного топонима.
  - marker: b
    text: Сочетание «Масличная… в Галилее» передано без исправления, хотя привычная евангельская Масличная гора находится близ Иерусалима. Возможно, здесь отражена особая география произведения или проблема передачи текста.
    reason: Не исправлять трудное географическое чтение молча.
  - marker: c
    text: Фраза о «самовозникшем» и «создавшем само себя» трудна и может отражать специальную космологическую терминологию.
    reason: Сохранить метафизическую неоднозначность и предупредить о необходимости проверки коптского текста.
  - marker: d
    text: В начале отрывка «божественный промысл» назван предметом вопроса учеников, а здесь теория промысла отвергается. Перевод сохраняет это напряжение.
    reason: Не устранять возможное концептуальное различие без исходноязычной проверки.
  - marker: e
    text: 'Буквальный образ в доступном свидетельстве необычен и груб: «посев нечистого трения». Здесь он передан по смыслу как указание на половое зачатие.'
    reason: Объяснить динамическую передачу неясной сексуальной метафоры.
  - marker: f
    text: 'Не вполне ясно, к кому относится «он»: к посланному первым или к рождённому от него. Неоднозначность сохранена.'
    reason: Не разрешать неясную местоименную референцию.
lexical_decisions:
- source_word: fundamental nature
  choice: первоначальная природа
  rationale: Передаёт вопрос о первооснове или сущностной природе мира, не сводя выражение к позднейшей философской терминологии.
- source_word: plan
  choice: замысел
  rationale: Сохраняет отличие от divine providence («божественный промысл») и подходит как для устройства мира, так и для божественного плана.
- source_word: authorities
  choice: правители
  rationale: Передаёт космических властителей как действующих лиц текста, не отождествляя их без пояснения с земными властями.
- source_word: invisible spirit
  choice: невидимый дух
  rationale: Формально сохраняет парадокс явления в невидимом духовном состоянии.
- source_word: Infinite Light
  choice: Беспредельный Свет
  rationale: Сохраняет титульный характер выражения и идею неограниченности; прописные буквы отмечают его как обозначение высшей реальности.
- source_word: self-originated / self-made
  choice: самовозникшее / создало само себя
  rationale: Сохраняет повтор и внутреннее напряжение исходной фразы, не нормализуя её в стройную метафизическую формулу.
- source_word: providence
  choice: промысл
  rationale: Современное литературное обозначение провиденциального управления, отличимое от более общего «замысла».
- source_word: fate
  choice: судьба
  rationale: Прямой и понятный эквивалент в перечне философских объяснений космического порядка.
- source_word: impure rubbing
  choice: нечистое совокупление
  rationale: Передаёт сексуальный смысл трудного и грубоватого образа без искусственно буквального «трения».
theological_decisions:
- issue: Явление Спасителя как невидимого духа при одновременном описании образа и плоти
  choice: Сохранить все три характеристики без согласования или доктринального объяснения
  alternative: Истолковать «дух», «образ» и «плоть» как последовательные состояния либо смягчить одно из выражений
  rationale: В свидетельстве присутствует намеренное или текстуально обусловленное напряжение; перевод не должен заранее разрешать его в пользу определённой христологии.
- issue: Критика промысла наряду с упоминанием божественного промысла в начале
  choice: Сохранить одинаковый термин «промысл» и очевидное напряжение
  alternative: Развести значения как «провидение» и «Промысл», предполагая две разные концепции
  rationale: Без проверки коптского источника нельзя уверенно утверждать лексическое или концептуальное различие; единообразие честнее отражает доступное свидетельство.
- issue: «Бессмертный среди смертных» и референт местоимения
  choice: Сохранить местоимение «он» без уточнения личности
  alternative: Явно назвать Первопосланного или достойного знания
  rationale: Грамматическая и богословская референция в доступном английском свидетельстве неоднозначна.
- issue: Рождение не от нечистого посева, а от Первопосланного
  choice: Сохранить противопоставление физического и иного рождения без конфессионального толкования
  alternative: Истолковать как девственное рождение, духовное возрождение или происхождение избранной природы
  rationale: Текст допускает несколько прочтений, и ни одно не следует навязывать без прямой проверки источника.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повествовательной интонацией. Диалоги оформлены естественно для русского издания. Необычные космологические формулы сохранены, а повреждения рукописи обозначены квадратными скобками. Проект остаётся предварительным, поскольку прямой разбор коптских свидетелей Nag Hammadi Codex III,4 и Berlin Codex 8502,3 ещё не выполнен.
