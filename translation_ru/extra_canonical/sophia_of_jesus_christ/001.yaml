translation:
  language: ru
  text: 'После того как он воскрес из мёртвых, его двенадцать учеников и семь женщин оставались его последователями и отправились в Галилею, на гору […], называемую «Место жатвы и радость».[a] Собравшись вместе, они недоумевали о первоначальной природе мира, о замысле, божественном промысле, власти правителей и о том, как Спаситель взаимодействует с ними в тайне божественного замысла. Спаситель явился — не в прежнем, видимом облике, но как невидимый дух. Образом он был подобен высокому сияющему ангелу; но описать, каков он, я не должен, потому что ни один смертный не способен это вынести. Это была всецело чистая, совершенная плоть, подобная той, о которой он учил нас на горе, называемой Масличной, в Галилее.[b]


    Он сказал:


    — Мир вам! Мой мир даю вам!


    Все они были охвачены благоговейным трепетом и страхом.


    Спаситель […] рассмеялся и спросил их:


    — О чём вы размышляете? Почему недоумеваете? Чего ищете?


    Филипп ответил:


    — Первоначальную природу мира и его замысел.


    Спаситель сказал им:


    — Я хочу, чтобы вы поняли: все рождённые на земле от основания мира и доныне — прах. Хотя они и пытались постичь Бога, его бытие и подобие, найти его им не удалось. Величайшие мудрецы среди них строили догадки, исходя из того, как устроен мир и как он движется, но их догадки не достигли истины.


    Все философы говорят, что космический порядок управляется одним из трёх способов, и потому расходятся между собой. Одни утверждают, что мир управляет собой сам. […] Другие — что им управляет промысл, третьи — что судьба. Но ни одно из этих утверждений не верно.


    Повторяю: ни одно из трёх только что изложенных мнений не приближается к истине, потому что это человеческие догадки. Я же произошёл от Беспредельного Света, ибо знаю его, и пришёл сюда, чтобы в точности открыть вам истину. Жизнь всего самовозникшего нечиста, поскольку оно создало само себя.[c] В учении о промысле нет ничего мудрого, а учение о судьбе лишено понимания.[d]


    Но вам дано знать. И всякий другой, достойный знания, получит его — всякий, кто был рождён не от посева в нечистом совокуплении,[e] но от того, кто был послан первым, ибо он — бессмертный среди смертных.[f]'
