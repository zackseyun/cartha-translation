review_pass:
  verdict: revise
  source_fidelity: Перевод в целом точно следует предоставленному английскому свидетельству и добросовестно сохраняет лакуны, парадоксы описания Спасителя и неясность заключительного местоимения. Однако «власти правителей» сужает и грамматически перестраивает «the power of the authorities»; предпочтительно сохранить множественное «силу властей». В заключительной формуле эвфемистическое «нечистое совокупление» устраняет образ «посева ... трения», хотя свидетельство намеренно содержит этот трудный образ. Прямое сопоставление с коптским текстом пока невозможно на основании предоставленных данных, поэтому спорные места не следует нормализовать.
  naturalness: 'Русский текст литературен и хорошо организован. Небольшие изменения делают формулировки точнее и естественнее: «всякая самовозникшая жизнь» вместо конструкции с несогласованным «всего самовозникшего» и «подобная той»; «силе властей» вместо «власти правителей».'
  terminology: «Первоначальная природа», «замысел», «промысл», «судьба», «Беспредельный Свет» и «невидимый дух» последовательны. «Власти» лучше сохраняет космологически неоднозначное authorities, не сводя его к земным правителям. Формулу о «нечистом трении» следует передать ближе к свидетельству и пояснить в примечании, не приписывая ей конкретного доктринального смысла.
  issues:
  - severity: medium
    issue: «власти правителей»
    rationale: Witness reads «the power of the authorities». Вариант «власти правителей» меняет единственное «power» на «власть» и истолковывает authorities как правителей. «Сила властей» точнее и сохраняет возможный космологический смысл.
  - severity: medium
    issue: «нечистое совокупление» вместо образа о «нечистом трении»
    rationale: Смысловая передача допустима, но в данном трудном месте она устраняет образ и степень текстуальной странности, засвидетельствованные английским мостовым текстом. Более близкая, но литературная формула сохраняет неоднозначность.
  - severity: low
    issue: Конструкция «Жизнь всего самовозникшего нечиста, поскольку оно создало само себя»
    rationale: Она стилистически и грамматически тяжеловесна. «Всякая самовозникшая жизнь нечиста, ибо сама себя создала» сохраняет повтор и парадокс исходной фразы.
  revised_text: 'После того как он воскрес из мёртвых, его двенадцать учеников и семь женщин оставались его последователями и отправились в Галилею, на гору […], называемую «Место жатвы и радость».[a] Собравшись вместе, они недоумевали о первоначальной природе мира, о замысле, божественном промысле, силе властей и о том, как Спаситель взаимодействует с ними в тайне божественного замысла. Спаситель явился — не в прежнем, видимом облике, но как невидимый дух. Образом он был подобен высокому сияющему ангелу; но описать, каков он, я не должен, потому что ни один смертный не способен это вынести. Он был всецело чистой, совершенной плотью — такой, о какой он учил нас на горе, называемой Масличной, в Галилее.[b]



    Он сказал:


    — Мир вам! Мой мир даю вам!


    Все они были охвачены благоговейным трепетом и страхом.



    Спаситель […] рассмеялся и спросил их:


    — О чём вы размышляете? Почему недоумеваете? Чего ищете?



    Филипп ответил:


    — Первоначальную природу мира и его замысел.



    Спаситель сказал им:


    — Я хочу, чтобы вы поняли: все рождённые на земле от основания мира и доныне — прах. Хотя они и пытались постичь Бога, его бытие и подобие, найти его им не удалось. Величайшие мудрецы среди них строили догадки, исходя из того, как устроен мир и как он движется, но их догадки не достигли истины.



    Все философы говорят, что космический порядок управляется одним из трёх способов, и потому расходятся между собой. Одни утверждают, что мир управляет собой сам. […] Другие — что им управляет промысл, третьи — что судьба. Но ни одно из этих утверждений не верно.



    Повторяю: ни одно из трёх только что изложенных мнений не приближается к истине, потому что это человеческие догадки. Я же произошёл от Беспредельного Света, ибо знаю его, и пришёл сюда, чтобы в точности открыть вам истину. Всякая самовозникшая жизнь нечиста, ибо сама себя создала.[c] В учении о промысле нет ничего мудрого, а учение о судьбе лишено понимания.[d]



    Но вам дано знать. И всякий другой, достойный знания, получит его — всякий, кто был рождён не от посева, сопряжённого с нечистым трением,[e] но от того, кто был послан первым, ибо он — бессмертный среди смертных.[f]'
  revised_footnotes:
