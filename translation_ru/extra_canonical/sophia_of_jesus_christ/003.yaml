translation:
  language: ru
  text: 'Филипп спросил: «Господи, как же тогда Он явился совершенным?»


    Совершенный Спаситель ответил ему: «Прежде чем стало видимым что-либо видимое, величие и власть пребывали [a] в Нём, ибо Он объемлет всю совокупность Целокупностей, а Его ничто не объемлет. Ведь весь Он — ум; Он — мысль и размышление, рассмотрение, рассуждение и сила. Всё это — равные по достоинству силы, источники Целокупностей. И весь их род, от первого до последнего, пребывает в предведении Его — бесконечного, нерождённого Отца».


    Фома спросил Его: «Господи Спаситель, по какой причине они возникли и зачем были явлены?»


    Совершенный Спаситель сказал: «Я произошёл от Бесконечного, чтобы поведать вам всё. Тот, кто породил, — Дух, Который Есть. Он обладал силой <родителя> [b] и природой того, кто [придаёт] форму [c], чтобы могло открыться великое богатство, сокрытое в Нём. По Своему милосердию и любви Он пожелал Сам принести плод, чтобы не <наслаждаться> Своей благостью одному [d], но чтобы и другие духи неподвижного рода могли производить тела и духов, славу и честь в нетленности, а также Его бесконечный дар; чтобы Его сокровище было явлено через саморождённого Бога — Отца всей нетленности и тех, кому предстояло впоследствии возникнуть, но кто ещё не явился зримо. Между нетленными существует великое различие».


    Он возгласил: «У кого есть уши слышать о бесконечных, пусть слышит!» И ещё: «Я говорил бодрствующим!»


    Он продолжил [e]: «Всё, что произошло от тленного, погибнет, потому что произошло от тленного. А то, что произошло от нетленного, не погибнет, но останется нетленным.


    Поэтому многие заблудились, не зная об этом различии, и умерли».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В рукописном свидетельстве после слова «пребывали» отмечен пробел; утраченный текст не восстанавливается.
    reason: Сохранение лакуны, обозначенной пустыми квадратными скобками в исходном свидетельстве.
  - marker: b
    text: Слово «родителя» восстановлено переводчиками исходного свидетельства; рядом в тексте отмечена лакуна.
    reason: Указание на редакционное восполнение и повреждение текста.
  - marker: c
    text: Слово «придаёт» является восстановлением в повреждённом месте.
    reason: Сохранение квадратных скобок исходного свидетельства как сигнала текстовой неуверенности.
  - marker: d
    text: Глагол «наслаждаться» восстановлен предположительно; повтор «одному (Самому)» в свидетельстве передан одним русским выражением.
    reason: Фиксация предположительного чтения и объяснение устранения неестественной для русского языка дублетности.
  - marker: e
    text: После указания на продолжение речи в рукописном свидетельстве отмечен пробел.
    reason: Сохранение сигнала лакуны без неподтверждённого восстановления.
lexical_decisions:
- source_word: perfect ones / perfect Savior
  choice: совершенные / Совершенный Спаситель
  rationale: Сохраняется повтор ключевого определения и возможная связь между адресатами явления и титулом Спасителя без конфессионального истолкования.
- source_word: Totalities
  choice: Целокупности
  rationale: Термин передан как обозначение совокупных полнот бытия; прописная буква сохраняет его специальный космологический характер, а не сводит к обычному «всему».
- source_word: foreknowledge
  choice: предведение
  rationale: «Предведение» точно передаёт знание наперёд и соответствует возвышенному богословскому регистру, оставаясь понятным в контексте.
- source_word: the Spirit Who Is
  choice: Дух, Который Есть
  rationale: Буквальная именная конструкция сохраняет необычность титула и не отождествляет его безоговорочно с каким-либо более привычным догматическим наименованием.
- source_word: unmoving generation
  choice: неподвижный род
  rationale: «Род» лучше обозначает класс или духовную общность, чем хронологическое «поколение»; «неподвижный» сохраняет буквальный образ свидетеля и не подменяет его толкованием «непоколебимый».
- source_word: indestructibility / imperishable
  choice: нетленность / нетленный
  rationale: Единое русское лексическое семейство естественно выражает неподверженность разрушению и сохраняет повтор в аргументации.
- source_word: self-begotten God
  choice: саморождённый Бог
  rationale: Передаётся техническое сложное определение без замены на более привычный, но иной по смыслу титул «Единородный».
theological_decisions:
- issue: Отнесение величия и власти к местоимению «в Нём» при наличии лакуны
  choice: Сохранено «в Нём» и отмечен текстовый пробел
  alternative: Восстановить отсутствующие слова или уточнить носителя величия и власти
  rationale: Свидетель не даёт достаточных оснований для восстановления; перевод не должен устранять неопределённость.
- issue: Синтаксическая связь «в Его предведении, бесконечного нерождённого Отца»
  choice: «в предведении Его — бесконечного, нерождённого Отца»
  alternative: Понимать «Отца» как отдельного участника или перестроить фразу без приложения
  rationale: Приложение наиболее естественно по данному свидетельству, однако тире позволяет сохранить заметность исходной синтаксической напряжённости.
- issue: Соотношение порождающего Духа и Бесконечного
  choice: Их названия сохранены раздельно, без явного отождествления
  alternative: Прямо назвать Духа Бесконечным или Отцом
  rationale: Отрывок допускает связь между образами, но не требует от переводчика догматически отождествлять их.
- issue: «Другие духи» как производящие тела, духов и дары
  choice: Сохранена грамматическая субъектность «других духов»
  alternative: Перестроить фразу так, чтобы всё производил только высший Дух
  rationale: Хотя последовательность объектов трудна, такая перестройка изменила бы космогоническое утверждение свидетеля.
- issue: Различие среди нетленных
  choice: «Между нетленными существует великое различие»
  alternative: Сгладить до различия между тленным и нетленным
  rationale: Следующее изречение действительно противопоставляет тленное нетленному, но данное предложение прямо говорит о различии среди нетленных; напряжение сохранено.
translation_notes:
  register: 'Современный литературный русский с достоинством и умеренно возвышенным регистром. Технические космологические термины сохранены там, где упрощение сняло бы смысловую неоднозначность. Настоящий проект остаётся предварительным: он основан на предоставленном англоязычном публичном свидетельстве, поскольку непосредственная сверка с коптским текстом ещё не выполнена.'
