review_pass:
  verdict: revise
  source_fidelity: 'Черновик в целом бережно следует предоставленному английскому свидетельству; прямой коптский текст в материалах отсутствует, поэтому проверка древнего языка ограничена. Требуется исправить несколько сдвигов: «appeared» не следует передавать как «явился» без сохранения вопросительной неопределённости, «equivalent powers» — не «равные по достоинству», а равнозначные/равные силы, а «all alone (by himself)» не должно терять второе усиление.'
  naturalness: Русский регистр в целом литературный, однако «Прежде чем стало видимым что-либо видимое» тяжеловесно, «весь Он — ум» звучит менее естественно, чем «Он всецело есть Ум», а «совершенным» без существительного может быть неясно. Синтаксис сложной космогонической фразы следует сделать прозрачнее, не упрощая содержания.
  terminology: 'Ключевые термины в основном выдержаны: «Совершенный Спаситель», «Целокупности», «Дух, Который Есть», «нетленность», «саморождённый Бог». «Предведение» допустимо, но «предзнание» в современном литературном русском яснее и точно передаёт foreknowledge. «Неподвижный род» сохранён как буквальный специальный термин.'
  issues:
  - severity: medium
    issue: «равные по достоинству силы»
    rationale: Witness reads «equivalent powers», то есть равные/равнозначные силы; добавление «по достоинству» вносит оценочную иерархическую коннотацию, которой в свидетельстве нет.
  - severity: medium
    issue: Передача «all alone (by himself)»
    rationale: В основном тексте оставлено лишь «одному», хотя свидетель намеренно содержит двойное усиление «all alone (by himself)». Его следует сохранить как «в полном одиночестве, Самому»; сноска не заменяет пропущенный смысл.
  - severity: low
    issue: «как же тогда Он явился совершенным?»
    rationale: «Совершенным» может читаться как наречная характеристика явления. «Совершенным людям/существам» яснее передаёт «the perfect ones», не добавляя интерпретации.
  - severity: low
    issue: «Прежде чем стало видимым что-либо видимое»
    rationale: Фраза грамматически возможна, но избыточно тяжела. «Прежде чем стало видимым всё видимое» естественнее и сохраняет повтор visible/became visible.
  - severity: low
    issue: Сноска b и разметка лакуны
    rationale: Угловые скобки обозначают редакционное дополнение «of», а пустые квадратные скобки стоят после «begetter». Русский текст смешивает эти сигналы, заключая «родителя» в угловые скобки и относя лакуну к нему. Следует передать дополнение как «силой <порождающего>» и отдельно сохранить пустую лакуну после него.
  revised_text: 'Филипп спросил: «Господи, как же тогда Он явился совершенным людям?»


    Совершенный Спаситель ответил ему: «Прежде чем стало видимым всё видимое, величие и власть пребывали [a] в Нём, ибо Он объемлет всю совокупность Целокупностей, а Его ничто не объемлет. Ведь Он всецело есть Ум; Он — мысль и размышление, рассмотрение, рассуждение и сила. Все они — равнозначные силы, источники Целокупностей. И весь их род, от первого до последнего, пребывает в предзнании Его — бесконечного, нерождённого Отца».


    Фома спросил Его: «Господи, Спаситель, по какой причине они возникли и почему были явлены?»


    Совершенный Спаситель сказал: «Я произошёл от Бесконечного, чтобы поведать вам всё. Дух, Который Есть, был Тем, Кто породил: Он обладал силой <порождающего> [b] и природой того, кто [придаёт] форму [c], чтобы могло открыться великое богатство, сокрытое в Нём. По Своему милосердию и любви Он пожелал Сам принести плод, чтобы не <наслаждаться> Своей благостью в полном одиночестве, Самому [d], но чтобы и другие духи неподвижного рода могли производить тела и духов, славу и честь в нетленности, а также Его бесконечный дар; чтобы Его сокровище было явлено через саморождённого Бога — Отца всякой нетленности и тех, кому предстояло впоследствии возникнуть, но кто ещё не явился зримо. Между нетленными существует великое различие».


