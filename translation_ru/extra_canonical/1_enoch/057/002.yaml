- source_word: እመንበሩ
  choice: сойдя со своего основания
  rationale: Существительное может означать место, седалище или опору. В связи со столпом «основание» передаёт структурный образ, а «сойдя» отражает движение от него.
- source_word: እምአጽናፈ ሰማይ እስከ አጽናፍ
