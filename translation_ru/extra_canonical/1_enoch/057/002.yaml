base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/057/002.yaml
  text: And the sound of their chariots was heard[a]; and when this turmoil came to be, the holy ones in heaven took notice, and the pillars of the earth were shaken from their foundations[e][d][c][b], and it was heard from one end of heaven to the other in one day.
translation:
  language: ru
  text: И был слышен гул их колесниц[a]. Когда же произошло это смятение[b], святые[c] с небес узнали об этом, и столп земли был поколеблен на своём основании[d]; и этот звук был слышен от одного края неба до другого в один день[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «звук шума их колесниц»; исходное выражение соединяет два близких слова со значением звука.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные переводы: «волнение», «возмущение», «сумятица» или «грохот». Точный оттенок слова не вполне ясен.'
    reason: lexical_alternative
  - marker: c
    text: «Святые» здесь, вероятнее всего, небесные существа, поскольку они упомянуты «с небес»; однако сам текст не называет их ангелами.
    reason: cultural_note
  - marker: d
    text: 'Возможен также перевод: «столп земли был поколеблен со своего места». Слово, переданное здесь как «основание», может означать место, седалище или опору.'
    reason: lexical_alternative
  - marker: e
    text: 'Буквально: «от краёв неба до края». Это выражение означает весь простор неба. «В один день» можно также понять как «в течение одного дня» или «в один-единственный день».'
    reason: lexical_alternative
