  yaml_path: translation/extra_canonical/1_enoch/057/003.yaml
  text: And all of them shall fall down and worship the Lord of Spirits[a]. And this is the end of the second parable.
translation:
  language: ru
  text: И все они падут ниц и поклонятся Господу духов. И это — конец второй притчи.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «конец другой притчи» / «конец иной притчи», если ካልእ понимать не как порядковое «второй».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወድቁ
  choice: падут ниц
  rationale: Передаёт телесное падение в знак благоговения; выражение естественно по-русски и не смешивает этот глагол с последующим «поклонятся».
- source_word: ኵሎሙ
  choice: все они
  rationale: Сохраняет явно выраженную совокупность и отсылку к участникам предшествующего контекста.
- source_word: ይሰግዱ
  choice: поклонятся
  rationale: В сочетании с падением ниц перед Господом выражает религиозное почитание, не дублируя телесный жест слишком буквально.
- source_word: ለእግዚአ መናፍስት
  choice: Господу духов
  rationale: Сохраняет характерный для 1 Еноха божественный титул и неопределённость родительного сочетания без добавления артиклевых оттенков, отсутствующих в русском.
- source_word: ዝንቱ ውእቱ
  choice: это —
  rationale: Естественная русская связочная конструкция, передающая формулу отождествления без излишней тяжеловесности.
- source_word: ተፍጻሜተ
  choice: конец
  rationale: Идиоматично обозначает завершение литературного раздела.
- source_word: ካልእ ምሳሌ
  choice: второй притчи
  rationale: В завершающей раздел формуле ካልእ наиболее вероятно имеет последовательное значение; лексически возможные «другой/иной» отмечены в сноске.
theological_decisions:
- issue: Передача божественного титула ለእግዚአ መናፍስት
  choice: Господу духов
  alternative: Господу духов/Господу этих духов как нарицательное сочетание с конкретизацией
  rationale: Форма «Господь духов» сохраняет устойчивый енохический титул и местную богословскую лексику, не подменяя её более поздней формулой.
- issue: Значение ካልእ в заключительной формуле
  choice: второй притчи
  alternative: другой притчи / иной притчи
  rationale: Структурный контекст Книги притч поддерживает порядковое понимание, однако подлинная лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического текста. «Падут ниц» сохраняет зримый жест, а «поклонятся» — его религиозный смысл. Маркер сноски поставлен после всей спорной формулы.
