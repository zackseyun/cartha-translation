base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/057/001.yaml
  text: And after that I saw another host of chariots, and men riding in them; and they were coming upon the winds from the east and from the west, as far as the south.
translation:
  language: ru
  text: 'После этого я увидел ещё одно видение: колесницы, в которых ехали люди. Они приближались на ветрах с востока и с запада, вплоть до юга.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до середины дня»; в данном перечислении направлений это означает юг.'
    reason: Поясняет географическое значение эфиопского выражения, сохраняя основной текст ясным.
lexical_decisions:
- source_word: ካልእተ፡ ትዕይንተ፡ ሠረገላት
  choice: другое воинство колесниц
  rationale: 'Сочетание допускает трудность в разборе: буквально первый компонент может указывать на «другое зрелище/явление», однако контекст и консультационный английский слой поддерживают собирательное «воинство колесниц». Выбран смысловой перевод без искусственного русского оборота.'
- source_word: ይጼዐኑ፡ ሰብእ፡ ውስቴቶሙ
  choice: в них ехали люди
  rationale: Передаёт людей, находящихся на колесницах или едущих в них, не уточняя их роль как возниц либо воинов.
- source_word: ይመጽኡ፡ ዲበ፡ ነፋሳት
  choice: приближались на ветрах
  rationale: Сохраняет необычный пространственный образ движения «на ветрах», не заменяя его более привычным «с ветрами».
- source_word: እስከ፡ መንፈቀ፡ ዕለት
  choice: вплоть до юга
  rationale: Идиома буквально связана с «половиной дня/полуднем» и в данном перечислении сторон света обозначает юг.
theological_decisions:
- issue: Природа воинства и всадников
  choice: Не отождествлять их с ангелами, людьми определённого народа или эсхатологической армией
  alternative: Назвать их ангельским либо земным войском
  rationale: Сам стих говорит лишь о людях в колесницах и не даёт основания для более конкретной идентификации.
- issue: Образ движения на ветрах
  choice: Сохранить буквально-образное «на ветрах»
  alternative: Истолковать ветры как символ духовных сил или как обычное направление движения
  rationale: Текстологическая и богословская неоднозначность образа должна остаться открытой.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования. Синтаксис упрощён для ясности; сохранены необычный образ «на ветрах» и неопределённость относительно участников видения.
