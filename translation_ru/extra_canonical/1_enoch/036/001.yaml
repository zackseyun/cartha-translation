base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/036/001.yaml
  text: And from there I went toward the south[a], to the ends of the earth; and there I saw three open portals of heaven, and from there come out the south wind, and dew, and rain[c][b], and wind.
translation:
  language: ru
  text: И оттуда я пошёл на юг, к краям земли, и там увидел трое открытых врат неба[a]; оттуда выходят южный ветер, роса, дождь и ветер.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Образ открытых небесных врат отражает космографию видения: небо представлено как имеющее отверстия, из которых исходят погодные явления.'
    reason: cultural_note
lexical_decisions:
- source_word: እምህየ
  choice: оттуда
  rationale: Естественно передаёт повторяющуюся повествовательную формулу перемещения и указание на источник явлений.
- source_word: ሖርኩ
  choice: я пошёл
  rationale: Прямо передаёт форму первого лица, не добавляя оттенка длительного путешествия.
- source_word: መንገለ አዜብ
  choice: на юг
  rationale: Передаёт направление движения; в современном русском это естественнее буквального «в сторону юга».
- source_word: በአጽናፈ ምድር
  choice: к краям земли
  rationale: Сохраняет апокалиптическую географическую образность и допускаемую исходным выражением множественность пределов.
- source_word: ሠለስተ ኆዋኅወ ሰማይ ርኁዋተ
  choice: трое открытых врат неба
  rationale: «Врата» сохраняют архитектурно-космологический образ; собирательное числительное естественно сочетается с русским словом «врата».
- source_word: ወይወፅእ እምህየ
  choice: оттуда выходят
  rationale: Настоящее время подходит для описания регулярно исходящих через врата природных явлений.
- source_word: አዜብ
  choice: южный ветер
  rationale: В метеорологическом перечне обозначает ветер с юга, тогда как ранее то же слово задаёт южное направление.
- source_word: ጠል
  choice: роса
  rationale: Основное и контекстуально точное значение; роса выступает отдельным элементом древней метеорологической картины.
- source_word: ዝናም
  choice: дождь
  rationale: Обычное прямое значение метеорологического термина.
- source_word: ነፋስ
  choice: ветер
  rationale: Контекст требует физического, а не духовного значения слова.
theological_decisions:
- issue: Космическая архитектура видения
  choice: врата неба
  alternative: окна неба; отверстия в небе
  rationale: «Врата неба» сохраняют предметный образ устроенных небесных выходов, через которые исходят погодные явления, не сглаживая древнюю космологию.
- issue: Различение южного ветра и общего ветра
  choice: южный ветер … и ветер
  alternative: юг … и ветер; южный ветер … и другие ветры
  rationale: Сохранён несколько напряжённый исходный перечень без поясняющего добавления «другие», которого в тексте нет.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified повествовательным строем. Сохранены повтор «оттуда», образ краёв земли и необычный перечень «южный ветер … и ветер»; синтаксис слегка упорядочен для ясности без устранения исходного напряжения.
