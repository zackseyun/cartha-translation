base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/036/002.yaml
  text: And from there I went toward the east to the ends of heaven[a], and I saw three open portals of heaven toward the east[b], and above them small portals.
translation:
  language: ru
  text: Оттуда я пошёл к югу[a], к краям земли, и там увидел трое открытых небесных врат. Оттуда выходят южный ветер, роса, дождь и ветер. Затем я пошёл к востоку[b], к краям неба, и там увидел трое открытых небесных врат на востоке, а над ними — малые врата. Через каждые из этих малых врат проходят небесные звёзды и движутся на запад по пути, который им указан. Увидев это, я благословил Господа славы и во всякое время благословляю Его — Того, Кто сотворил великие и славные чудеса, чтобы показать величие Своего дела Своим ангелам и душам людей, чтобы они восхваляли Его дело и все Его деяния, видели действие Его силы, прославляли Его за великое дело рук Его и благословляли Его вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфиопское слово может означать как «юг», так и «южный ветер»; здесь сначала названо направление движения, а далее — ветер, приходящий с юга.
    reason: lexical_ambiguity
  - marker: b
    text: 'Буквально: «к утру» или «к восходу», то есть к востоку.'
    reason: idiom
lexical_decisions:
- source_word: አዜብ
  choice: юг / южный ветер
  rationale: Слово обозначает южное направление и связанный с ним ветер. В первой позиции оно задаёт направление пути, а в перечне погодных явлений естественно передаётся как «южный ветер».
- source_word: ኀዋኅወ፡ ሰማይ
  choice: небесные врата
  rationale: Буквально «врата неба». Русское сочетание сохраняет пространственный образ небесных проходов и звучит естественно в апокалиптическом повествовании.
- source_word: ጽባሕ
  choice: восток
  rationale: Слово связано с утром и восходом; в данном описании сторон света обозначает восток, то есть сторону восхода.
- source_word: ከዋክብተ፡ ሰማይ
  choice: небесные звёзды
  rationale: Передаёт буквальное «звёзды неба», сохраняя космологический образ и не добавляя современного астрономического истолкования.
- source_word: እግዚአ፡ ስብሐት
  choice: Господь славы
  rationale: Формально и богословски нейтрально передаёт титул без конфессиональных уточнений.
- source_word: ነፍሳተ፡ ሰብእ
  choice: души людей
  rationale: Сохраняет антропологическую лексику источника и не заменяет её более общим «люди».
theological_decisions:
- issue: Кому Бог показывает величие Своего дела
  choice: «Своим ангелам и душам людей»
  alternative: «ангелам и людям»
  rationale: Сохранено прямое упоминание душ, поскольку источник различает ангелов и человеческие души; антропологическая формулировка намеренно не упрощена.
- issue: Повторы слов о Божьих делах
  choice: Сохранить последовательность «дело — деяния — действие силы — дело рук»
  alternative: Стилистически объединить всё как «творения»
  rationale: Повтор отражает риторическое накопление исходного текста и его богословский акцент на видимых действиях Божьей силы.
translation_notes:
  register: Современный литературный русский с торжественным, но ясным апокалиптическим звучанием. Синтаксис разбит на умеренно длинные фразы; образ небесных врат и риторические повторы источника сохранены. Перевод следует полному представленному тексту на геэзе, который шире приведённого английского консультационного слоя.
