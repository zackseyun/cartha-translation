    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእልኩ
  choice: я спросил
  rationale: Форма первого лица единственного числа передаёт прямой вопрос Еноха; «спросил» естественно и точно в современном русском.
- source_word: እንዘ እብል
  choice: говоря
  rationale: Сохранена характерная для геэза конструкция, вводящая прямую речь, без добавления отсутствующих в тексте пояснений.
- source_word: ዝንቱ
  choice: это такое
  rationale: Указательное слово отсылает к только что увиденному явлению. Русское «это такое» естественно сочетается с вопросительным «что» и не уточняет природу явления.
- source_word: ምንት ውእቱ
  choice: что это такое
  rationale: Вопросительное слово с копулой передано обычной русской формулой прямого вопроса.
- source_word: ዘአልቦ ዕረፍተ
  choice: не имеющее покоя
  rationale: Относительная конструкция с отрицанием наличия передана причастным оборотом; «покой» сохраняет образ отсутствия отдыха или передышки, не сводя его к «миру» либо к окончательному прекращению.
theological_decisions:
- issue: 'Значение ዕረፍተ: покой, отдых или прекращение'
  choice: покой
  alternative: отдых; передышка; прекращение
  rationale: «Покой» сохраняет широту исходного значения и напряжённость образа непрестанного явления, не внося в стих дополнительных богословских выводов.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным ритмом повествования. Буквальное «говоря» сохранено как элемент визионерского отчёта; природа увиденного явления намеренно не уточняется.
