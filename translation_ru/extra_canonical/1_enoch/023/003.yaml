  text: 'И я спросил: «Что это такое[a], что не знает покоя[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «что это?» Указательное слово отсылает к явлению, которое Енох только что увидел.'
