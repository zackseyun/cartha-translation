lexical_decisions:
- source_word: እምህየ
  choice: оттуда
  rationale: Передаёт исходную точку движения и естественно связывает рассказ с предыдущим видением.
- source_word: ሖርኩ
  choice: я пошёл
  rationale: Простая и нейтральная передача глагола движения от первого лица без добавочного оттенка длительного путешествия.
- source_word: ካልአ መካነ
  choice: в другое место
  rationale: Естественно обозначает новое место, отличное от прежде описанного.
- source_word: መንገለ ዓረብ
  choice: на запад
  rationale: መንገለ выражает направление, а ዓረብ обозначает запад, связанный с заходом солнца; русское «на запад» кратко и точно передаёт сочетание.
- source_word: እስከ አጽናፈ ምድር
  choice: до краёв земли
  rationale: Сохраняет множественное число и апокалиптический образ предельных областей мира, оставаясь естественным по-русски.
theological_decisions:
- issue: Космическая география в описании видения
  choice: до краёв земли
  alternative: до дальней границы земли
  rationale: Выражение сохранено как образ космического масштаба, а не сведено к обычной местной географии.
