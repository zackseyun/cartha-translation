base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/023/002.yaml
  text: And I saw a fire that burned and flowed[a], and it did not rest or cease from its course by day or by night[c][b], but continued in the same way.
translation:
  language: ru
  text: И увидел я огонь, который горел и тёк[a]; он не знал покоя и не прекращал своего движения[b] ни днём, ни ночью, но так продолжалось и дальше[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол может означать «бежал»; здесь возможны также переводы «струился» или «нёсся». Он описывает движение огня, а не только его горение.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не сходил со своего пути», «не прекращал своего бега» либо «своего течения». Исходное слово подчёркивает непрерывное движение.'
    reason: lexical_alternative
  - marker: c
    text: 'Заключительная фраза трудна для точного истолкования; возможно также: «но так оно и было» или «но оставалось таким же».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ወርኢኩ
  choice: И увидел я
  rationale: Сохраняет обычную формулу рассказа о видении и несколько возвышенный, но естественный для русского повествования порядок слов.
- source_word: እሳተ
  choice: огонь
  rationale: Обозначает впервые вводимый в видении предмет; в русском языке неопределённость не требует отдельного показателя.
- source_word: ዘይነድድ
  choice: который горел
  rationale: Передаёт относительную конструкцию и сохраняет глагольный характер описания.
- source_word: ዘይረውፅ
  choice: и стремительно тёк
  rationale: Глагол связан с движением, бегом или течением, а не просто с ярким горением. Для движущегося огня «тёк» естественнее буквального «бежал», а наречие сохраняет оттенок стремительного движения.
- source_word: እንዘ ኢያዓርፍ
  choice: он не знал покоя
  rationale: Передаёт непрерывность действия и образ отсутствия покоя естественным современным русским выражением.
- source_word: ወኢይነትግ
  choice: и не прекращал
  rationale: В сочетании с предшествующим отрицанием обозначает неугасающее, непрерывное действие, не уточняя без достаточных оснований, что огонь именно не гас.
- source_word: እምሩፀቱ
  choice: своего движения
  rationale: Существительное указывает на бег, течение или ход. Обобщённое «движение» сохраняет смысл и не вынуждает выбирать между конкретными образами пути и потока.
- source_word: መዐልተ ወሌሊተ
  choice: ни днём, ни ночью
  rationale: Естественно передаёт непрерывность во всякое время при отрицательной конструкции.
- source_word: አላ ከማሁሙ
  choice: но всё продолжалось так же
  rationale: Передаёт трудную заключительную фразу как указание на неизменное продолжение описанного действия, не приписывая ей излишней синтаксической определённости.
