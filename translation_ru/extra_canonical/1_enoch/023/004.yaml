base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/023/004.yaml
  text: And at that time Raguel[a], one of the holy angels who was with me, answered me and said to me, “This course of fire which you saw toward the west[c][b], it is the fire that drives all the lights of heaven.”
translation:
  language: ru
  text: 'И в то время Рагуил, один из святых ангелов, находившийся со мной, ответил мне и сказал: «То движение огня, которое ты видел по направлению к западу, — это огонь, который приводит в движение все небесные светила».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አውሥአኒ
  choice: ответил мне
  rationale: Глагол передаёт ответ или отклик и естественно соответствует диалогической обстановке видения.
- source_word: ቅዱሳን መላእክት
  choice: святых ангелов
  rationale: Сохраняет обычное апокалиптическое обозначение и возвышенный, но понятный регистр.
- source_word: ዘርኢከ
  choice: которое ты видел
  rationale: Форма состоит из относительного элемента и глагола «видеть» во 2-м лице мужского рода единственного числа; прежнее понимание как «дух» отвергнуто.
- source_word: ሩጸተ
  choice: движение
  rationale: Отглагольное имя от корня со значением «бежать» обозначает ход, бег или движение; «движение» естественно применительно к огню и небесным светилам.
- source_word: መንገለ ዐረብ
  choice: на западе
  rationale: Направительная конструкция указывает в сторону запада; в данном описании видения естественно передаётся местно-направительным выражением.
- source_word: ይሰድድ
  choice: приводит в движение
  rationale: Глагол означает понуждать двигаться, гнать; выбранная формулировка сохраняет причинно-динамический смысл без нежелательного оттенка преследования.
- source_word: ብርሃናተ ሰማይ
  choice: все светила небесные
  rationale: «Светила» точно и естественно обозначает небесные источники света, сохраняя космический регистр.
theological_decisions:
- issue: Природа описываемой космической силы
  choice: Текст передан как движение огня, а не как личный дух
  alternative: «дух» или «ветер»
  rationale: ዘርኢከ означает «которое ты видел», а ሩጸተ — «движение/бег»; поэтому личностное или метеорологическое истолкование не поддерживается данной формой текста.
- issue: Связь огня с небесными светилами
  choice: «приводит в движение»
  alternative: «гонит»
  rationale: Формулировка сохраняет образ огня как космической движущей силы, не уточняя сверх сказанного ни устройство мира, ни природу этой силы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Повторы «ответил мне и сказал» и «огонь» сохранены ради структуры исходного текста; синтаксис слегка упорядочен для ясности.
