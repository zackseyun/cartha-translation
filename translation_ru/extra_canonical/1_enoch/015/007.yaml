base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/007.yaml
  text: And because of this I have not appointed wives for you[b][a], for the dwelling of the spiritual ones of heaven is in heaven.
translation:
  language: ru
  text: И потому Я не предназначил вам жён, ибо обитель духовных существ неба[a] — на небе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духов неба»; «небесных духовных существ». Геэзское выражение допускает несколько близких толкований.'
    reason: lexical_alternative
  - marker: b
    text: 'Повтор слова «небо» намеренно сохранён: эти существа принадлежат небу, и их обитель находится на небе.'
    reason: cultural_note
lexical_decisions:
- source_word: ወበእንተዝ
  choice: И потому
  rationale: Передаёт причинно-следственную связь с предшествующим объяснением естественно и кратко.
- source_word: ኢረሰይኩ
  choice: Я не предназначил
  rationale: Глагол означает установление, назначение или определение кому-либо, а не простое сотворение.
- source_word: ለክሙ አንስቲያ
  choice: вам жён
  rationale: Дательный смысл сохранён, а «жён» точнее контекстуального «женщин», поскольку речь идёт о назначенных брачных спутницах.
- source_word: እስመ
  choice: ибо
  rationale: Ясно вводит основание сказанного и поддерживает достойный литературный регистр.
- source_word: መንፈሳውያነ ሰማይ
  choice: духовных существ неба
  rationale: Сохраняет субстантивированное значение «духовные» и родительную связь с небом, не сводя выражение безоговорочно к слову «духи».
- source_word: ውስተ ሰማይ
  choice: на небе
  rationale: Естественное русское обозначение небесной сферы, сохраняющее намеренный повтор слова «небо».
- source_word: መሓድሪሆሙ
  choice: обитель … на небе
  rationale: «Обитель» передаёт постоянное место пребывания в возвышенном, но понятном современном регистре; тире естественно выражает именную конструкцию.
theological_decisions:
- issue: 'Как передать መንፈሳውያነ ሰማይ: как «духов неба», «небесных духовных существ» или «духовных существ неба»'
  choice: духовных существ неба
  alternative: духов неба; небесных духовных существ
  rationale: Выбранный вариант сохраняет возможный субстантивированный характер определения и не навязывает более позднюю ангелологическую терминологию; неоднозначность отмечена в сноске.
- issue: Передавать ли አንስቲያ как «женщин» или как «жён»
  choice: жён
  alternative: женщин
  rationale: Контекст говорит не просто о женщинах, а о брачных спутницах, которые не были назначены этим существам; при этом формулировка не вводит дополнительных конфессиональных выводов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Причинная связь выражена без архаизации; необычный повтор «неба — на небе» сохранён как значимый элемент исходного текста.
