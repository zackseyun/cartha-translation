base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/005.yaml
  text: Therefore I gave them women[a], so that they might beget children by them and offspring might be born to them[b], so that thus no work on the earth might be lacking to them.
translation:
  language: ru
  text: Поэтому Я дал им женщин, чтобы они сеяли семя в них[a] и чтобы от них рождались дети, — дабы тем самым у них на земле не было недостатка ни в каком деле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально — «сеяли на них». Геэз сохраняет метафору деторождения, связанную с посевом семени.
    reason: lexical_alternative
  - marker: b
    text: Заключительная часть стиха трудна. Вероятно, речь о том, что благодаря деторождению земная жизнь и деятельность должны продолжаться.
    reason: textual_variant
lexical_decisions:
- source_word: በእንተዝ
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим противопоставлением духов и земных существ.
- source_word: ወሀብክዎሙ አንስቲያ
  choice: Я дал им женщин
  rationale: Сохраняет прямую божественную речь и общее значение «женщины», не уточняя без достаточного основания «жёны».
- source_word: ከመ ይዝርኡ ላዕሌሆን
  choice: чтобы они сеяли в них семя
  rationale: Сохраняет присутствующую в геэз сельскохозяйственно-прокреативную метафору; «в них» естественно выражает её смысл по-русски.
- source_word: ወይትወለዱ ውሉደ በላዕሌሆን
  choice: и чтобы от них рождались дети
  rationale: «Дети» естественно передаёт широкое значение ውሉደ, а «от них» сохраняет связь рождения с женщинами, не сужая смысл.
- source_word: ከመ ከማሁ
  choice: дабы тем самым
  rationale: Передаёт усиленное выражение цели или результата и поддерживает достойный литературный регистр.
- source_word: ኢይትኀጐ ግብር በላዕሌሆን በዲበ ምድር
  choice: у них не было недостатка в деле на земле
  rationale: Сохраняет трудность и широту ግብር («дело, труд, деятельность»), не подменяя её истолкованием о продолжении жизни.
theological_decisions:
- issue: Цель дарования женщин земным существам
  choice: Деторождение представлено как часть установленного Богом порядка для земных существ.
  alternative: Считать эти слова исключительно утверждением о браке либо поздней уступкой после падения Стражей.
  rationale: Местный контекст говорит о семени и рождении на земле и противопоставляет земной порядок незаконному переходу Стражами установленных границ; перевод не добавляет более узкого догматического толкования.
- issue: Смысл заключительной цели
  choice: Сохранена неопределённость выражения о «деле на земле».
  alternative: Раскрыть его непосредственно как непрерывность земной жизни и деятельности через размножение.
  rationale: Такое объяснение вероятно, но исходная формулировка остаётся трудной и не называет прямо ни жизнь, ни её продолжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавная буква в «Я» обозначает говорящего Бога. Архаизирующее «дабы» употреблено точечно для передачи усиленной целевой конструкции; неоднозначность последней фразы сохранена и пояснена в сноске.
