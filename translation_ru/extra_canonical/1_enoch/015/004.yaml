base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/004.yaml
  text: But you were holy[a], spiritual beings, living eternal life. But you defiled yourselves with women, and by the blood of flesh you fathered children, and you desired the blood of men, and you did as they do[c][b], producing flesh and blood—those who die and perish.
translation:
  language: ru
  text: Но вы были святы, духовны и жили вечной жизнью. Однако вы осквернили себя связью с женщинами, из крови плоти породили детей, возжелали крови людей и стали, подобно им, производить плоть и кровь — смертных, которые умирают и погибают.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквальная образность оригинала намеренно подчёркивает кровь и плоть. Начало второй части содержит текстовую трудность: отмеченную форму можно понимать как испорченное «кровью женщин»; в основном тексте принято связное чтение «связью с женщинами». Последние слова могут также относиться более широко к людям, которым Стражи стали подражать: «которые умирают и погибают».'
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: ቅዱሳን፡ መንፈሳውያን
  choice: святы, духовны
  rationale: Сохраняет ряд определений, относящихся к Стражам, не превращая прилагательное «духовные» в существительное и не вводя отсутствующее в тексте слово «существа».
- source_word: ሕያዋነ፡ ሕይወት፡ ዘለዓለም
  choice: жили вечной жизнью
  rationale: Передаёт усиленное сочетание «живые/жизнь» естественным русским языком и сохраняет противопоставление смертным людям в конце стиха.
- source_word: በደቡ፡ አንስት፡ ረኩስክሙ
  choice: осквернили себя с женщинами
  rationale: Рукописное በደቡ помечено как проблемное; основной текст следует связному чтению «с женщинами», а не исправлению на «кровью женщин».
- source_word: በደመ፡ ሥጋ፡ አውለድክሙ
  choice: от крови плоти породили детей
  rationale: Сохраняет необычную телесную образность оригинала; «детей» является естественно подразумеваемым дополнением глагола рождения.
- source_word: በደመ፡ ሰብእ፡ ፈተውክሙ
  choice: возжелали крови людей
  rationale: Передаёт и объект желания — кровь, и определение «людей», сохраняя мрачную апокалиптическую образность без уточнения её характера.
- source_word: ወገበርክሙ፡ ከመ፡ እሙንቱ፡ ይገብሩ፡ ሥጋ፡ ወደመ
  choice: 'стали делать то же, что делают они: производить плоть и кровь'
  rationale: Связывает «плоть и кровь» с повторённым глаголом «делать», как требует синтаксис, и по-русски ясно выражает телесное деторождение.
- source_word: እለ፡ እሙንቱ፡ ይመውቱ፡ ወይትሐጐሉ
  choice: тех, кто умирает и погибает
  rationale: Сохраняет характеристику людей через смертность и гибель; не смягчает второй глагол до нейтрального «уходит».
theological_decisions:
- issue: Противопоставление небесного и человеческого способов существования
  choice: 'Сохранить последовательность: святость, духовность и вечная жизнь Стражей противопоставлены осквернению, телесному рождению и смертности людей.'
  alternative: Передать противопоставление непосредственно словами «бессмертные» и «смертные».
  rationale: В оригинале контраст создаётся образами вечной жизни, крови, плоти, смерти и гибели; прямые категории бессмертия и смертности сделали бы скрытое противопоставление более явным, чем в источнике.
- issue: Неясная связь заключительного определения смертности
  choice: Через тире отнести «тех, кто умирает и погибает» к произведённым «плоти и крови», то есть к человеческому потомству.
  alternative: Понять заключительные слова как более общее описание людей, которым Стражи стали подражать.
  rationale: Грамматика допускает некоторую напряжённость; пунктуация сохраняет ближайшую связь, а сноска отмечает возможную более широкую отнесённость.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Необычные сочетания «кровь плоти» и «производить плоть и кровь» сохранены ради ключевой образности источника; синтаксис слегка упорядочен для ясности.
