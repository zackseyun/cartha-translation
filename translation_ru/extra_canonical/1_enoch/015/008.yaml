base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/008.yaml
  text: And now[a], the giants who were born from spirits and flesh will be called evil spirits upon the earth[b], and on the earth will be their dwelling.
translation:
  language: ru
  text: И ныне исполины[a], родившиеся от духов и плоти, будут названы злыми духами на земле[b], и на земле будет их обиталище.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начальное существительное по контексту обозначает исполинов — потомство Стражей и земных женщин; на лексическом уровне возможен и более общий перевод: «потомство».'
    reason: lexical_alternative
  - marker: b
    text: 'Повтор слова «земля» сохранён вслед за геэзским текстом: он подчёркивает принадлежность этих духов земной, а не небесной сфере.'
    reason: cultural_note
lexical_decisions:
- source_word: ረዓይት
  choice: исполины
  rationale: В ближайшем контексте речь идёт о смешанном потомстве Стражей и женщин. «Исполины» передаёт устоявшийся контекстуальный смысл и апокалиптическую выразительность, хотя лексически возможно более общее «потомство».
- source_word: ተወልዱ
  choice: родившиеся
  rationale: Естественно и точно передаёт пассивное обозначение рождения, не добавляя оттенка, отсутствующего в источнике.
- source_word: እመናፍስት ወሥጋ
  choice: от духов и плоти
  rationale: Сохраняет резкое сопоставление духа и плоти и указание на двойственное происхождение исполинов.
- source_word: መንፈሳት እኩያን
  choice: злыми духами
  rationale: Прямо передаёт значение «злые/нечестивые духи» и не вводит более поздний термин «нечистые духи», которого данный стих не требует.
- source_word: ይሰመዩ
  choice: будут названы
  rationale: Сохраняет пассивную формулу наименования, значимую для апокалиптической классификации этих существ.
- source_word: በዲበ ምድር
  choice: на земле
  rationale: Передаёт сферу или место пребывания без искусственно архаичного оборота.
- source_word: ወውስተ ምድር ይከውን መሓድሪሆሙ
  choice: и на земле будет их обиталище
  rationale: Сохраняет повтор слова «земля» и порядок с вынесенным указанием места; «обиталище» поддерживает dignified literary register.
theological_decisions:
- issue: Кого стих называет злыми духами
  choice: Стих говорит об исполинах — смешанном потомстве Стражей и женщин, которое названо злыми духами на земле.
  alternative: Начальное существительное можно понять шире и перевести как «потомство», не уточняя, что это исполины.
  rationale: Ближайший контекст 1 Еноха 15:8–12 указывает на исполинов и объясняет происхождение связанных с ними земных злых духов. При этом примечание сохраняет лексическую неоднозначность и не развивает демонологию дальше сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксический повтор «на земле» сохранён намеренно; «обиталище» выбрано как понятное, но достойное по регистру слово.
