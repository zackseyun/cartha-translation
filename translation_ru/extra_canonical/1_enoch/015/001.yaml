base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/001.yaml
  text: 'And he answered me and said to me[a], and I heard: “Do not fear, Enoch, righteous man and scribe of righteousness. Come near here and hear my word.”'
translation:
  language: ru
  text: 'И он ответил мне и сказал мне, и я услышал[a]: «Не бойся, Енох, праведный муж и писец праведности. Подойди сюда и услышь моё слово».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В эфиопском тексте, по-видимому, дважды повторён глагол «слышать»: буквально «и я услышал, услышал». В основном тексте повтор сокращён ради естественности русского языка.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ
  choice: ответил мне
  rationale: Передаёт естественное значение ответа и сохраняет диалогический характер повествования.
- source_word: ወይቤለኒ
  choice: и сказал мне
  rationale: Сохранена повторная формула речи, характерная для исходного текста, без стилистического сглаживания.
- source_word: ወሰምኩ፡ ሰማዕኩ
  choice: и я услышал
  rationale: Повтор глагола «слышать» отмечен в сноске; в основном тексте он сокращён ради естественного русского синтаксиса без добавления отсутствующего в источнике слова «голос».
- source_word: አትፍራህ
  choice: Не бойся
  rationale: Естественная современная русская формула запрета, сохраняющая торжественный тон откровения.
- source_word: ብእሲ፡ ጻድቅ
  choice: праведный муж
  rationale: «Праведный» сохраняет нравственно-религиозный смысл, а «муж» поддерживает достойный библейский регистр.
- source_word: ጻሓፊ፡ ጽድቅ
  choice: писец праведности
  rationale: «Писец» отражает роль записывающего и хранителя откровения; родительный оборот намеренно сохранён, не сводя выражение к простому «праведный писец».
- source_word: ቅረብ፡ ዝየ
  choice: Подойди сюда
  rationale: Передаёт и движение в близость, и указание места естественным современным русским выражением.
- source_word: ወስማዕ፡ ቃልየ
  choice: и услышь моё слово
  rationale: Сохранены повелительная форма и единственное число «слово», соответствующие пророческому регистру.
theological_decisions:
- issue: Нравственное и писцовое именование Еноха
  choice: праведный муж и писец праведности
  alternative: праведник и писатель правды
  rationale: 'Перевод сохраняет два отдельных определения: нравственную характеристику Еноха и его роль писца откровения. Неоднозначный генитив «праведности» не истолкован как простое прилагательное.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены исходная повторность формул «ответил… и сказал» и термины «праведный муж», «писец праведности»; синтаксически тяжёлый повтор глагола слухового восприятия вынесен в сноску.
