base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/006.yaml
  text: But you, formerly, were spiritual beings, living an eternal life that does not die throughout all the generations of the world.
translation:
  language: ru
  text: Но вы прежде были духовными существами[a], живущими вечной жизнью[b], которая не умирает на протяжении всех поколений мира[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духами» либо «духовными».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «живущими жизнь вечную»; возможен более плавный перевод: «обладающими вечной жизнью».'
    reason: source_idiom
  - marker: c
    text: 'Слово, переведённое как «мир», может также означать «век»; поэтому возможен смысл: «во все поколения вовеки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ቀዳሚ
  choice: прежде
  rationale: Передаёт временное противопоставление прежнего состояния Стражей их последующему падению, не уточняя сверх текста, идёт ли речь о самом начале творения.
- source_word: ኮንክሙ
  choice: были
  rationale: Связочное значение естественно вводит описание их первоначального состояния.
- source_word: መንፈሳውያነ
  choice: духовными существами
  rationale: Сохраняет адъективно-субстантивное значение и онтологический контраст контекста, не превращая выражение без необходимости в более узкий термин «духи».
- source_word: ሕያዋነ ሕይወት ዘለዓለም
  choice: живущими вечной жизнью
  rationale: Передаёт фигуру с однокоренными понятиями «жить жизнью» и явное существительное «жизнь», сохраняя несколько необычную выразительность оригинала.
- source_word: ዘኢይመውት
  choice: которая не умирает
  rationale: Относительное предложение грамматически относится к «жизни» и буквально усиливает мысль о вечности, не заменяя образ абстрактным словом «бессмертная».
- source_word: ለኵሉ ትውልደ ዓለም
  choice: во все поколения мира
  rationale: Сохраняет слова «поколения» и многозначное ዓለም, которое может обозначать мир либо век; русская формулировка передаёт длительность через всю последовательность поколений.
theological_decisions:
- issue: Обозначение первоначальной природы Стражей
  choice: духовные существа
  alternative: духи; духовные
  rationale: Выбор сохраняет противопоставление их прежнего духовного состояния последующему телесному союзу, но не вносит более позднюю догматическую классификацию.
- issue: Отнесение слов «которая не умирает»
  choice: к вечной жизни
  alternative: к самим духовным существам
  rationale: Женский род русского относительного местоимения следует ближайшему исходному существительному «жизнь» и сохраняет образ оригинала, хотя по смыслу неумирание характеризует и образ существования этих существ.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего увещевания. Сохранены повтор «жить — жизнь» и необычный образ неумирающей жизни; порядок слов слегка приспособлен к естественному русскому синтаксису. Все сноски отмечены в основном тексте.
