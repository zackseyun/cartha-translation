base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/002.yaml
  text: 'And go[a], say to the watchers of heaven who have sent you to petition on their behalf: ''You ought to petition on behalf of men[b], and not men on your behalf.'''
translation:
  language: ru
  text: 'Иди и скажи небесным Стражам, которые послали тебя просить за них: «Вам надлежит просить[a] за людей[b], а не людям — за вас».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обращаться с просьбой». Глагол в языке геэз имеет общее значение просьбы; контекст указывает на просьбу о милости за других.'
    reason: lexical_alternative
  - marker: b
    text: Под «людьми» здесь подразумевается человечество в целом, а не только мужчины.
    reason: cultural_note
lexical_decisions:
- source_word: ሑር
  choice: иди
  rationale: Повелительная форма глагола движения, обращённая к Еноху; «иди» — прямой и естественный русский эквивалент.
- source_word: በሎሙ
  choice: скажи
  rationale: Передаёт введение прямой речи с адресатом во множественном числе; адресат назван сразу далее.
- source_word: ለትጉሃነ ሰማይ
  choice: небесным Стражам
  rationale: «Стражи» сохраняет особое апокалиптическое наименование этих небесных существ, не заменяя его более общим словом «ангелы». Прописная буква отмечает употребление как устойчивого наименования группы.
- source_word: እለ ፈነዉከ
  choice: которые послали тебя
  rationale: Относительное придаточное определяет Стражей как тех, кто направил Еноха с просьбой.
- source_word: ትስአል በእንቲአሆሙ
  choice: просить за них
  rationale: Исходный глагол имеет общее значение просьбы или обращения с просьбой; «просить за них» естественно передаёт действие в чью-либо пользу, не внося более специального богословского термина.
- source_word: አንትሙ መፍትው ትስአሉ
  choice: вам надлежит просить
  rationale: «Надлежит» передаёт уместность и обязанность, сохраняя укор за нарушение должного порядка.
- source_word: በእንተ ሰብእ
  choice: за людей
  rationale: Здесь слово обозначает человечество собирательно; русское «людей» кратко и естественно сохраняет противопоставление.
- source_word: ወአኮ ሰብእ በእንቲአክሙ
  choice: а не людям — за вас
  rationale: 'Эллиптическая конструкция сохраняет краткость и смысловую инверсию исходного текста: небесным существам следует просить за людей, а не людям за них.'
theological_decisions:
- issue: Передача наименования небесных существ
  choice: небесные Стражи
  alternative: ангелы небесные; бодрствующие небесные существа
  rationale: Особое наименование важно для повествования о Стражах; замена словом «ангелы» сгладила бы литературно-богословскую категорию текста.
- issue: Сила укора относительно просьбы за другого
  choice: вам надлежит просить за людей, а не людям — за вас
  alternative: вам следует ходатайствовать за людей, а не людям за вас
  rationale: Формулировка сохраняет представление о нарушенном порядке между небесными существами и людьми, но не превращает общий глагол просьбы в технический термин «ходатайствовать».
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Повтор «просить за… за…» намеренно сохраняет словесную связь и перевёрнутый порядок исходного текста. Тире во второй части обозначает пропуск повторного глагола без потери ясности.
