base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/003.yaml
  text: Why did you abandon the high[a], holy, eternal heaven, and lie with women, and defile yourselves with the daughters of men, and take wives for yourselves, and do as the children of the earth do[b], and beget giant sons?
translation:
  language: ru
  text: Почему вы покинули высокое, святое и вечное небо, легли с женщинами, осквернили себя, соединившись с дочерьми человеческими, взяли себе жён, поступали, как дети земли[a], и породили сыновей-исполинов[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дети земли» — смертные люди, противопоставленные здесь небесным Стражам; образное выражение сохранено, а не заменено просто словом «люди».
    reason: cultural_note
  - marker: b
    text: 'Возможный перевод: «сыновей, которые были исполинами». Выражение обозначает необыкновенное потомство этого союза.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኃደግሙ
  choice: покинули
  rationale: Передаёт сильное значение оставления и сохраняет обличительный тон вопроса; «оставили» звучало бы несколько слабее.
- source_word: ሰማየ ልዑለ ወቅዱሰ ዘለዓለም
  choice: высокое, святое и вечное небо
  rationale: Сохраняет последовательность определений и возвышенный апокалиптический регистр, оставаясь естественным для современного русского языка.
- source_word: ሰከብክሙ
  choice: легли с женщинами
  rationale: Прямое, но не грубое обозначение половой связи, соответствующее торжественному обличению.
- source_word: እዋለደ ሰብእ
  choice: дочерьми человеческими
  rationale: Сохраняет противопоставление человеческих женщин небесным существам и традиционный антропологический оборот без дополнительного истолкования.
- source_word: ረኩስክሙ
  choice: осквернили себя
  rationale: Передаёт как нравственный, так и связанный с нечистотой оттенок исходного глагола, не смягчая осуждения.
- source_word: አንስተ
  choice: жён
  rationale: В сочетании с глаголом «взяли себе» слово обозначает жён, а не женщин вообще.
- source_word: ከመ ውሉደ ምድር ገበርክሙ
  choice: стали поступать, как дети земли
  rationale: Сохраняет образное противопоставление небесных Стражей смертным земным людям; «поступать» естественно выражает уподобление их образу жизни.
- source_word: ውሉደ ረዓይተ
  choice: сыновей-исполинов
  rationale: Передаёт конкретный образ необыкновенного потомства; дефисное сочетание ясно выражает, что рождённые сыновья были исполинами, не заменяя образ отвлечённым толкованием.
theological_decisions:
- issue: Нравственная оценка союза Стражей с женщинами
  choice: Передать действие как самоосквернение
  alternative: Нейтрально передать его как соединение с женщинами или подчеркнуть лишь нарушение границы между небесным и земным
  rationale: В геэзском тексте прямо употреблён глагол осквернения, поэтому перевод сохраняет нравственную и ритуально-понятийную напряжённость исходного обличения.
- issue: Статус выражения «дети земли»
  choice: Сохранить образное наименование людей
  alternative: Заменить его поясняющим словом «люди»
  rationale: Буквальный образ существенно поддерживает противопоставление небесной сферы земной и не должен быть незаметно истолкован в основном тексте.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным апокалиптическим звучанием. Цепь однородных обвинений сохранена ради нарастающей силы обличительного вопроса; архаизирующие формы сведены к умеренному обороту «дочери человеческие».
