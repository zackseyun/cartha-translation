base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/009.yaml
  text: And evil spirits came out from their flesh[a], because they were created from above; and from the holy Watchers was their beginning and first foundation[d][c][b]. They shall be evil spirits.
translation:
  language: ru
  text: И злые духи[d] вышли из их плоти[a], потому что были сотворены свыше; их начало и первоначальное основание — от святых Стражей[b]. Они будут злыми духами[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вышли из их тел». В геэз буквально сказано: «из их плоти».'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение можно передать более буквально: «от святых, бодрствующих». В данном контексте оно обозначает ангельских Стражей.'
    reason: lexical_alternative
  - marker: c
    text: 'Заключительные слова можно понимать как формулу наименования: после выхода из плоти эти существа будут называться «злыми духами».'
    reason: alternative_reading
  - marker: d
    text: 'Или: «злые души». Чтение «души нечестивых» грамматически менее вероятно: в геэз слово «злые» является прилагательным к слову «души/духи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ነፍሳት እኩያን
  choice: злые духи
  rationale: Существительное в абсолютном состоянии с прилагательным означает «злые души/духи», а не «души нечестивых». В данном контексте речь идёт о бесплотном состоянии потомков Стражей; «духи» также согласуется с заключительным обозначением.
- source_word: ወጽኡ እምሥጋሆሙ
  choice: вышли из их плоти
  rationale: Сохраняет конкретный телесный образ исходного текста и не заменяет «плоть» более общим словом «тела».
- source_word: እመልዕልት
  choice: свыше
  rationale: Передаёт небесное происхождение кратко и естественно, не приписывая существам нравственной святости или полного ангельского статуса.
- source_word: ተፈጥሩ
  choice: были сотворены
  rationale: Сохраняет страдательный залог и подчёркивает, что эти существа являются творениями.
- source_word: እምቅዱሳን ትጉሃን
  choice: от святых Стражей
  rationale: В контексте книги сочетание обозначает ангельских Стражей; прописная буква показывает употребление как устойчивого наименования.
- source_word: ቀዳሚቶሙ ወቀዳሚ መሰረት
  choice: их начало и первоначальное основание
  rationale: Сохраняет усиленный язык происхождения, но выражает его понятным современным русским синтаксисом.
- source_word: መንፈሰ እኩየ
  choice: злыми духами
  rationale: Передаёт заключительное обозначение, понимая переданную форму как согласованную по смыслу с множественным субъектом.
theological_decisions:
- issue: Кого описывает стих после их смерти
  choice: Бесплотных потомков Стражей и женщин, которые становятся злыми духами
  alternative: Злые души людей вообще
  rationale: Ближайший контекст объясняет происхождение и участь исполинов; указания на происхождение свыше и от святых Стражей относятся именно к ним.
- issue: Смысл выражения «свыше»
  choice: Указание на небесную составляющую их происхождения
  alternative: Указание на нравственное одобрение или полный ангельский статус
  rationale: Вертикальный космологический образ следует сохранить, не устраняя напряжение смешанного происхождения этих существ.
- issue: Функция заключительного выражения «злые духи»
  choice: Основной текст передаёт его как утверждение об их будущем состоянии
  alternative: 'Это может быть формулой наименования: их будут называть «злыми духами»'
  rationale: Форма исходного текста допускает некоторую неясность; основной перевод избегает добавления глагола «называть», а возможное понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной апокалиптической окраской. Термин «Стражи» сохранён как устойчивое наименование, а тяжеловесная формула происхождения передана без чрезмерного сглаживания.
