  text: And one of them drew a sword and gave it to those elephants and camels and donkeys[a], and they began to strike one another.
translation:
  language: ru
  text: И один из них обнажил меч и дал его тем слонам, верблюдам и ослам[a], и они стали наносить друг другу удары.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфиопская формулировка в конце стиха трудна. По смыслу, получив меч, эти животные обратились к взаимному насилию; перевод «стали наносить друг другу удары» носит осторожный характер.
    reason: textual_variant
lexical_decisions:
- source_word: መላሕ ሰይፈ
  choice: обнажил меч
  rationale: В сочетании с «мечом» глагол естественно передаёт извлечение оружия; «обнажил меч» сохраняет конкретность и звучит естественно в современном литературном русском.
- source_word: ወወሀቦሙ
  choice: дал его
  rationale: Простой глагол передачи сохраняет лаконичность повествования; местоимение ясно относится к мечу.
- source_word: ለእልኩ ነጌያት ወአገማል ወአእዱግ
  choice: тем слонам, верблюдам и ослам
  rationale: Сохранены буквальные образы животных как элементы видения, без подстановки предполагаемых исторических референтов.
- source_word: አንዘ እንዘ ይትደአ
  choice: они стали поражать друг друга
  rationale: Конечная эфиопская формулировка трудна; перевод осторожно передаёт начало взаимного насилия, сохраняя физический характер действия.
theological_decisions:
- issue: Характер образов животных
  choice: Сохранить буквальные названия животных как образы видения
  alternative: Заменить животных в основном тексте предполагаемыми народами или войсками
  rationale: Апокалиптическое видение выражает смысл посредством символических животных; перевод не должен превращать образ в однозначное толкование.
- issue: Направленность насилия в трудной заключительной формулировке
  choice: 'Передать взаимное действие: «друг друга»'
  alternative: Передать неопределённое нападение без указания взаимности
  rationale: Контекст и консультационный слой поддерживают смысл взаимного насилия, однако из-за трудности эфиопского текста это решение отмечено сноской, а не представлено как бесспорное.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования. Синтаксис намеренно прост и последователен; символические животные и меч сохранены буквально. Архаизмы вроде «поразили друг друга мечом» или «начали разить» не использованы.
