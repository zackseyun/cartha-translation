  choice: которые вышли первыми
  rationale: እምቅዳሚ понято наречно — «первыми, прежде»; местоимение «их», отсутствующее в источнике, не добавляется.
- source_word: አሐዘ
  choice: схватил
  rationale: Сильный глагол естественно соответствует сцене задержания, связывания и заключения.
- source_word: ለዝኩ፡ ኮከብ፡ ቀዳማይ
  choice: ту первую звезду
  rationale: Указательное слово и порядковое определение обозначают конкретную звезду, уже известную из видения; сохранён лексический отклик между «первыми» и «первую».
- source_word: ዘወድቀ፡ እምሰማየ
  choice: которая упала с неба
  rationale: Относительное предложение определяет звезду через её предшествующее падение и сохраняет вертикальный образ.
- source_word: ወአሰረ፡ እደዊሁ፡ ወእገሪሁ
  choice: связал ей руки и ноги
  rationale: Русский женский род согласован со словом «звезда», тогда как упоминание рук и ног сохраняет заложенное в образе указание на личное небесное существо.
- source_word: ወወደዮ፡ ውስተ፡ ማዕምቅ
  choice: и бросил её в бездну
  rationale: «Бросил» передаёт силу карательного действия, а «бездна» сохраняет апокалиптический образ места заключения.
- source_word: ጸቢብ፡ ወዕሙቅ፡ ወዕጹብ፡ ወጽልመት
  choice: узкой, глубокой, страшной и тёмной
  rationale: Сохранено накопление четырёх характеристик; «узкой» формально передаёт пространственную стеснённость, а «страшной» — вызывающее ужас качество в контексте суда.
theological_decisions:
- issue: Следует ли прямо назвать павшую «звезду» ангелом
  choice: Сохранить в основном тексте образ звезды, не заменяя его истолкованием.
  alternative: Передать «ангел» или употребить местоимения мужского рода.
  rationale: В геэзском тексте прямо сказано «звезда». Руки и ноги выявляют личностный характер символа, но перевод не должен заранее разрешать образ и отождествлять его с ангелом.
