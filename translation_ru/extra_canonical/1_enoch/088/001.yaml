base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/088/001.yaml
  text: And I saw one of those four who had come out first, and he seized that first star which had fallen from heaven, and bound its hands and its feet, and threw it into the abyss. And that abyss was narrow and deep and dreadful and dark.
translation:
  language: ru
  text: И я увидел одного из тех четверых, которые вышли первыми,[a] и он схватил ту первую звезду, которая упала с неба, связал ей руки и ноги[b] и бросил её в бездну.[c] А бездна была узкой, глубокой, страшной и тёмной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «которые вышли прежде». Геэзское выражение может обозначать первенство по времени или последовательности; местоимения «их» в тексте нет.'
    reason: lexical_alternative
  - marker: b
    text: 'У звезды здесь есть руки и ноги: образ звезды, по-видимому, представляет личное небесное существо, подвергаемое суду.'
    reason: cultural_note
  - marker: c
    text: 'Или: «в глубину». Геэзское слово означает глубокое место; «бездна» сохраняет апокалиптический образ места заключения.'
    reason: lexical_alternative
