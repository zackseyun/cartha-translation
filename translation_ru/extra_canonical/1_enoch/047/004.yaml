base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/004.yaml
  text: And the hearts of the holy ones shall be filled with joy[a], because the number of the righteous has drawn near, and the prayer of the righteous has been heard[c][b], and the blood of the righteous has been avenged before the Lord of Spirits.
translation:
  language: ru
  text: И сердца святых исполнятся радостью, потому что приблизилось число праведных[a], и молитва праведных услышана, и кровь праведных взыскана перед Господом Духов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «приблизилось судебное взыскание, относящееся к праведным», если понимать это слово в судебном смысле, а не как численность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально речь может идти о том, что кровь праведных «потребована»: Господь требует ответа за её пролитие. По смыслу это подразумевает возмездие за неё.'
    reason: lexical_clarification
lexical_decisions:
- source_word: ልቦሙ
  choice: сердца
  rationale: Сохраняет конкретный библейский образ внутреннего средоточия мысли и чувства.
- source_word: ቅዱሳን
  choice: святые
  rationale: Естественное русское обозначение святого сообщества; здесь слово не конкретизируется как позднейший церковный титул.
- source_word: ትመልእ ፍሥሐ
  choice: исполнятся радостью
  rationale: Передаёт образ наполнения и будущую направленность формы в возвышенном, но понятном русском языке.
- source_word: ቀርበ
  choice: приблизилось
  rationale: Сохраняет перфективность и ощущение апокалиптической близости.
- source_word: ኍልቈ ለጻድቅ
  choice: число праведных
  rationale: Основное значение существительного — число или счёт; судебный оттенок возможен и отмечен в сноске.
- source_word: ጻድቅ / ጻድቃን
  choice: праведные
  rationale: Устоявшийся библейский эквивалент, последовательно передающий ключевое понятие.
- source_word: ጸሎቶሙ ተሰምዐ
  choice: молитва праведных услышана
  rationale: Сохраняет единственное собирательное число исходного текста и естественно звучит по-русски.
- source_word: ደሙ ለጻድቅ
  choice: кровь праведных
  rationale: Контекст допускает коллективное понимание; перевод не вводит без достаточного основания одного отдельного мученика.
- source_word: ተፈቅደ
  choice: взыскано
  rationale: Передаёт значение требования и судебного истребования пролитой крови, включая подразумеваемое возмездие, но не сводит глагол просто к «принята».
- source_word: እግዚአ መናፍስት
  choice: Господь Духов
  rationale: Сохраняет характерный для 1 Еноха божественный титул.
theological_decisions:
- issue: Смысл выражения «приблизилось число праведных»
  choice: Приблизилось исполнение установленного числа праведных.
  alternative: Приблизился суд или расчёт, относящийся к праведным.
  rationale: Наиболее прямое значение ኍልቈ — число или счёт, однако возможный судебный оттенок не устраняется и указан в сноске.
- issue: Смысл взыскания за кровь праведных
  choice: Бог потребовал ответа за пролитую кровь, что подразумевает её оправдание и возмездие виновным.
  alternative: Кровь праведных уже прямо отомщена.
  rationale: «Взыскано» сохраняет библейский судебный образ требования ответа за кровь и не делает завершённое отмщение более явным, чем позволяет глагол.
translation_notes:
  register: Современный литературный русский с библейской торжественностью. «Пред» сохранено только в устойчивом сакрально-судебном обороте «пред Господом»; синтаксис остаётся ясным для современного читателя. Все сноски отмечены в основном тексте.
