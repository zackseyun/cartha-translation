base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/001.yaml
  text: And in those days[c][b][a], the prayer of the righteous and the blood of the righteous ascended from the earth before the Lord of Spirits.
translation:
  language: ru
  text: И в те дни молитва праведных и кровь праведных[a] поднялись с земли пред Господом духов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «кровь праведника» или «его кровь, кровь праведника»: после слова «кровь» в языке источника стоит форма единственного числа. Здесь она понята собирательно, в соответствии с параллельным выражением «молитва праведных».'
    reason: lexical_alternative
lexical_decisions:
- source_word: በውእቱ፡ መዋዕል
  choice: в те дни
  rationale: Устойчивая апокалиптическая формула естественно передаётся по-русски как «в те дни».
- source_word: ዐርገት
  choice: поднялись
  rationale: Перфект обозначает совершившееся восхождение. Русское множественное число согласовано с составным подлежащим «молитва… и кровь…», тогда как в языке источника форма женского рода единственного числа согласуется с первым существительным.
- source_word: ጸሎተ፡ ጻድቃን
  choice: молитва праведных
  rationale: Сохраняет коллективное значение обозначения праведников и торжественный, но понятный современный регистр.
- source_word: ደሙ፡ ጻድቅ
  choice: кровь праведных
  rationale: В параллели с предшествующим множественным «праведных» наиболее естественно коллективное прочтение; формальная единственность слова ጻድቅ отмечена в сноске.
- source_word: እምነ፡ ምድር
  choice: с земли
  rationale: Передаёт пространственный и космический масштаб видения без сужения до отдельной страны или территории.
- source_word: ቅድመ፡ እግዚአ፡ መናፍስት
  choice: пред Господом духов
  rationale: «Пред» сохраняет торжественный стиль, а «Господь духов» — характерный для книги Еноха божественный титул.
theological_decisions:
- issue: Следует ли понимать ጻድቅ после слова «кровь» как единственное число или как собирательное обозначение праведных?
  choice: «кровь праведных» — коллективное прочтение
  alternative: «кровь праведника» или, с учётом местоименного суффикса, «его кровь»
  rationale: Параллелизм с выражением «молитва праведных» поддерживает коллективное прочтение, однако грамматическая форма единственного числа допускает отнесение к одному праведнику; эта неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным апокалиптическим звучанием. Порядок слов сделан естественным для русского; архаизирующее «пред» сохранено как уместное для божественного титула, без чрезмерной стилизации.
