base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/003.yaml
  text: In those days I saw the Head of Days[a], as he sat on the throne of his glory, and the books of the living were opened before him; and all his host, which is in the heights of heaven[e][d][c][b], and his council stood before him.
translation:
  language: ru
  text: В те дни я увидел Главу дней[a], сидевшего на престоле Своей славы; перед Ним были раскрыты книги живых[b], и всё Его воинство, пребывающее в небесных высотах, и Его двор[c] стояли перед Ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Глава дней». Здесь сохранена форма эфиопского титула; традиционный библейский титул «Ветхий днями» был бы гармонизацией с книгой Даниила.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «книги жизни». В эфиопском тексте стоит выражение во множественном числе, буквально «книги живых».'
    reason: lexical_alternative
  - marker: c
    text: Соответствующее слово может означать круг или окружение вокруг Него; возможны также переводы «Его собрание» и «Его свита».
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: В те дни
  rationale: Сохраняет обычную апокалиптическую временную формулу и буквальный образ «дней».
- source_word: ለርእሰ መዋዕል
  choice: Главу дней
  rationale: Передаёт составные части эфиопского титула, не подменяя их традиционным библейским титулом «Ветхий днями».
- source_word: ሶበ ነበረ መንበረ ስብሐቲሁ
  choice: сидевшего на престоле Своей славы
  rationale: 'Учитывает активное значение ነበረ: восседающая фигура является субъектом, а престол — местом сидения.'
- source_word: መጻሕፍተ ሕያዋን
  choice: книги живых
  rationale: Сохраняет множественное число «книги» и буквальное зависимое определение «живых», не гармонизируя выражение с формулой «книга жизни».
- source_word: በቅድሜሁ ተከሥቱ
  choice: перед Ним были раскрыты
  rationale: В контексте небесных книг глагол естественно описывает их раскрытие перед престолом.
- source_word: ኵሉ ኃይሉ
  choice: всё Его воинство
  rationale: В сцене небесного двора слово обозначает совокупность небесных сил, а не отвлечённое могущество.
- source_word: ዘመልዕልተ ሰማያት
  choice: пребывающее в небесных высотах
  rationale: Сохраняет возвышенную пространственную образность источника и естественно согласуется с собирательным «воинство».
- source_word: አውደ ዚአሁ
  choice: Его двор
  rationale: В престольной сцене «двор» обозначает собравшееся вокруг Восседающего окружение и лучше, чем «совет», удерживает пространственный оттенок слова «круг, окружение».
- source_word: ይቀውሙ በቅድሜሁ
  choice: стояли перед Ним
  rationale: Передаёт положение небесного воинства и двора перед престолом без дополнительного истолкования их роли.
theological_decisions:
- issue: Передача божественного титула ርእሰ መዋዕል
  choice: Глава дней
  alternative: Ветхий днями
  rationale: Близкая передача эфиопского выражения сохраняет собственную лексику данного свидетеля и не навязывает гармонизацию с традиционной формой титула из книги Даниила.
- issue: Передача выражения መጻሕፍተ ሕያዋን
  choice: книги живых
  alternative: книги жизни
  rationale: Выбранный вариант сохраняет и множественное число, и конструкцию «живых», оставляя открытой связь с более поздней и привычной формулой «книга жизни».
- issue: Характер небесного собрания в አውደ ዚአሁ
  choice: Его двор
  alternative: Его совет
  rationale: «Двор» допускает понимание небесной свиты или собрания вокруг престола, не утверждая, что его функция обязательно совещательная.
translation_notes:
  register: Современный литературный русский язык с торжественным, но ясным апокалиптическим звучанием. Прописные местоимения при указании на божественную фигуру поддерживают сложившийся русский религиозно-литературный регистр. Точка с запятой удерживает единство престольной сцены и делает длинное перечисление читаемым.
