base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/002.yaml
  text: In those days the holy ones who dwell in the heights of heaven shall unite with one voice[a], and they shall plead and pray and praise and give thanks and bless the name of the Lord of Spirits, on account of the blood of the righteous that has been poured out, and that the prayer of the righteous may not be in vain before the Lord of Spirits, that judgment may be executed for them[d][c][b], and that patience may not be theirs forever.
translation:
  language: ru
  text: В те дни святые, обитающие в высотах небесных[a], объединятся и единым голосом будут взывать, молиться, восхвалять, благодарить и благословлять имя Господа Духов — ради пролитой крови праведных и ради того, чтобы молитва праведных не осталась тщетной[b] пред Господом Духов, чтобы совершился суд в их пользу[c] и чтобы им не приходилось ждать вечно.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово может обозначать святых существ вообще. Поскольку они обитают в высотах небесных, ими могут быть ангелы, небесные праведники или те и другие.
    reason: lexical_alternative
  - marker: b
    text: Соответствующий глагол в данном эфиопском свидетельстве неясен. По контексту смысл, вероятно, в том, чтобы молитва праведных не осталась без ответа или без действия пред Господом Духов.
    reason: textual_variant
  - marker: c
    text: 'Или: «чтобы для них совершилось правосудие». Слово может означать как судебное решение, так и осуществление справедливости ради праведных.'
    reason: lexical_alternative
lexical_decisions:
- source_word: የኃብሩ … በ፩ቃል
  choice: объединятся и единым голосом
  rationale: Передаёт как совместное действие, так и буквальный образ «одного голоса», не сводя выражение лишь к собранию.
- source_word: ቅዱሳን
  choice: святые
  rationale: Естественный русский эквивалент для «святых существ/святых»; сноска сохраняет неопределённость относительно ангелов и небесных праведников.
- source_word: በመልዕልተ ሰማያት
  choice: в высотах небесных
  rationale: Сохраняет пространственный образ возвышенной небесной области без излишней конкретизации космологии.
- source_word: ያስተበቍዑ
  choice: будут взывать
  rationale: Выражает настойчивое прошение и при этом отличается от следующего глагола «молиться».
- source_word: ይጼልዩ … ይሴብሑ … የአኵቱ … ይባርኩ
  choice: молиться, восхвалять, благодарить и благословлять
  rationale: Сохранена намеренная литургическая цепочка близких, но не тождественных действий.
- source_word: እግዚአ መናፍስት
  choice: Господь Духов
  rationale: Торжественно и последовательно передаёт устойчивый титул в Притчах Еноха.
- source_word: ደመ ጻድቃን ዘተክዕወ
  choice: пролитая кровь праведных
  rationale: Прямо сохраняет образ невинно пролитой крови.
- source_word: ኢትጸራዕ
  choice: не осталась тщетной
  rationale: Форма в эфиопском свидетеле трудна; по контексту речь идёт о том, чтобы молитва не оказалась безрезультатной или неуслышанной.
- source_word: ኵነኔ
  choice: суд
  rationale: Сохраняет судебно-эсхатологическую окраску; оборот «в их пользу» показывает, что речь идёт о заступничестве и оправдании праведных.
- source_word: ትዕግሥት ኢይኩን ሎሙ ለዓለም
  choice: чтобы им не пришлось терпеть вечно
  rationale: Естественно по-русски передаёт буквальную мысль о том, что терпение или вынужденное ожидание не должно длиться для них вечно.
theological_decisions:
- issue: Кто такие ቅዱሳን в небесной сцене
  choice: «святые» без уточнения их природы
  alternative: «ангелы» или «небесные праведники»
  rationale: Текст помещает их в высотах небесных, но не определяет однозначно; перевод и сноска сохраняют эту открытость.
- issue: Смысл трудной формы в просьбе о молитве праведных
  choice: «не осталась тщетной»
  alternative: «не была заглушена», «не прекратилась» или «не была отвергнута»
  rationale: Контекст требует мысли о действенности и услышанности молитвы, однако текстовая неопределённость отмечена в сноске.
- issue: Характер ኵነኔ
  choice: «суд в их пользу»
  alternative: «правосудие для них» или «приговор»
  rationale: «Суд» сохраняет апокалиптический судебный образ, а «в их пользу» не позволяет ошибочно понять его как осуждение самих праведных.
- issue: Связь трёх оборотов с ከመ
  choice: параллельные целевые придаточные со «чтобы»
  alternative: 'причинное прочтение первого оборота: «потому что молитва…»'
  rationale: Эфиопская конструкция с ከመ и сослагательными формами выражает содержание или цель ходатайства, а не причину.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Сохранены литургическое накопление глаголов, титул «Господь Духов» и параллельные целевые конструкции; устранены ненужные архаизмы, но оставлено библейское «пред».
