  text: And after this it will be said to the holy ones in heaven[c][b][a],
translation:
  language: ru
  text: И после этого будет сказано святым на небе[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Безличная форма «будет сказано» не называет говорящего.
    reason: lexical_alternative
  - marker: b
    text: «Святые» могут означать небесных существ или праведников, пребывающих на небе; сама эта фраза не уточняет, кто именно имеется в виду.
    reason: alternative_reading
lexical_decisions:
- source_word: ወእምድኅረዝ
  choice: И после этого
  rationale: Передаёт временную связь со следующим этапом видения и сохраняет повествовательную последовательность без архаизации.
- source_word: ይትበሀል
  choice: будет сказано
  rationale: Точно передаёт безличную пассивную форму от глагола «говорить/сказать», не вводя отсутствующего в тексте говорящего.
- source_word: ለቅዱሳን
  choice: святым
  rationale: Естественно передаёт дательный смысл предлога и лексическое значение «святые», не уточняя, являются ли они небесными существами или праведниками.
- source_word: በሰማይ
  choice: на небе
  rationale: Соответствует засвидетельствованной форме единственного числа и естественной современной русской идиоматике.
theological_decisions:
- issue: Кого обозначают «святые»
  choice: Сохранено широкое обозначение «святые» без уточнения их природы.
  alternative: «ангелам», «праведникам на небе» или «избранным»
  rationale: Краткая фраза сама по себе не позволяет решить, имеются ли в виду небесные существа или пребывающие на небе праведники; перевод сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и естественная формулировка. Порядок маркеров приведён к последовательному виду.
