base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/003.yaml
  text: And the righteous shall be in the light of the sun[a], and the chosen in the light of eternal life; and there shall be no end to the days of their life[b], and the holy ones shall have days without number.
translation:
  language: ru
  text: И праведные будут в свете солнца, а избранные — в свете вечной жизни; и не будет конца дням их жизни, и у святых будут дни без числа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и у святых нет числа дней»; смысл выражения в том, что их дни невозможно исчислить.'
    reason: Пояснение идиоматической конструкции языка геэз и сохранение её буквального образа.
lexical_decisions:
- source_word: ጻድቃን
  choice: праведные
  rationale: Обычное и точное русское обозначение людей, отличающихся праведностью; сохраняет нравственный и религиозный смысл.
- source_word: በብርሃነ ፀሐይ
  choice: в свете солнца
  rationale: Сохраняет пространственно-образную конструкцию и апокалиптическую световую символику оригинала.
- source_word: ኅሩያን
  choice: избранные
  rationale: Передаёт группу тех, кто избран, без более узкой конфессиональной окраски слова «избранники» или специального догматического оттенка.
- source_word: በብርሃነ ሕይወት ዘለዓለም
  choice: в свете вечной жизни
  rationale: Сохраняет образ света, связанного с вечной жизнью, не сводя выражение просто к бессмертию.
- source_word: ማኅለቆተ አልቦቱ
  choice: не будет конца
  rationale: Естественно по-русски передаёт категорическое отсутствие конца или предела.
- source_word: መዋዕለ ሕይወቶሙ
  choice: дням их жизни
  rationale: Сохраняет явный образ дней и его параллель с заключительной частью стиха.
- source_word: ቅዱሳን
  choice: святые
  rationale: В современном русском это наиболее естественное субстантивированное обозначение святых людей; контекст не требует уточнять иной класс существ.
- source_word: ኍልቈ መዋዕለ አልቦሙ
  choice: у святых будут дни без числа
  rationale: Передаёт буквальный образ неисчислимых дней и избегает ошибочного впечатления, будто дней вовсе не будет.
theological_decisions:
- issue: Передача ኅሩያን как названия избранной Богом группы
  choice: избранные
  alternative: избранники
  rationale: «Избранные» ясно и непосредственно передаёт смысл исходного слова, не усиливая его дополнительными догматическими ассоциациями.
- issue: Смысл заключительной фразы о днях святых
  choice: у святых будут дни без числа
  alternative: дни святых будут неисчислимы
  rationale: Выбранная формулировка сохраняет конкретную метафору счёта дней и параллелизм с отсутствием конца у дней жизни.
