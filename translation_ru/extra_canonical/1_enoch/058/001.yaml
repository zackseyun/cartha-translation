  text: And I began to speak the third parable concerning the righteous and concerning the chosen[a].
translation:
  language: ru
  text: И я начал говорить третью притчу[a] о праведных и об избранных.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «третье подобие». Геэзское слово может обозначать притчу или подобие как название такого речевого раздела.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አኀዝኩ
  choice: я начал
  rationale: 'В данном вводном обороте глагол имеет начинательное значение: Енох приступает к новой части речи, а не буквально «берёт» что-либо.'
- source_word: እበል
  choice: произносить
  rationale: После глагола «начал» эта форма естественно обозначает начало пространной речи; «говорить» также возможно, но слабее передаёт введение особого речевого раздела.
- source_word: ሣልሰ ምሳሌ
  choice: третью притчу
  rationale: ምሳሌ может обозначать притчу, подобие или назидательное изречение. «Притча» — ясное и естественное жанровое обозначение, а иной возможный оттенок сохранён в примечании.
- source_word: በእንተ ጻድቃን
  choice: о праведных
  rationale: በእንተ вводит тему — «о, относительно», а ጻድቃን сохранено как значимое апокалиптическое обозначение группы.
- source_word: ወበእንተ ኅሩያን
  choice: и об избранных
  rationale: ኅሩያን означает избранных; русское «избранные» сохраняет местное обозначение группы без внесения дополнительной конфессиональной трактовки.
theological_decisions:
- issue: Передача группового обозначения ኅሩያን
  choice: избранные
  alternative: избранники
  rationale: «Избранные» сохраняет устойчивую апокалиптическую категорию и не конкретизирует, кем и для чего они избраны, сверх сказанного в тексте.
- issue: Жанровое обозначение ምሳሌ
  choice: притча
  alternative: подобие
  rationale: «Притча» естественна в современном литературном русском и подходит как название третьей крупной речи; лексическая широта исходного слова отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксический параллелизм «о праведных и об избранных» сохранён; терминология не привязана к позднейшей конфессиональной системе.
