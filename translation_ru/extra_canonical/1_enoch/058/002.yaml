base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/002.yaml
  text: Blessed are you[a], O righteous and chosen ones, for your portion is glorious.
translation:
  language: ru
  text: Блаженны вы, праведные и избранные, ибо славен ваш удел[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «доля»; возможно также: «жребий». Эфиопское слово означает назначенную кому-либо долю, в том числе долю, подобную наследству.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ብፁዓን
  choice: Блаженны
  rationale: Сохраняет форму торжественного благословения и возвышенную библейско-апокалиптическую окраску; «счастливы» здесь звучало бы слабее.
- source_word: አንትሙ
  choice: вы
  rationale: Передаёт прямое обращение во втором лице множественного числа и естественно входит в русскую формулу «Блаженны вы».
- source_word: ጻድቃን
  choice: праведные
  rationale: Устойчиво передаёт нравственно-богословское обозначение группы и сохраняет характерное для книги противопоставление праведных и нечестивых.
- source_word: ወኅሩያን
  choice: избранные
  rationale: Передаёт субстантивированное множественное число без добавления более поздней конфессиональной терминологии.
- source_word: እስመ
  choice: ибо
  rationale: Кратко вводит основание благословения и соответствует достоинству апокалиптической речи.
- source_word: ስቡሕ
  choice: славен
  rationale: Естественно описывает удел как отмеченный славой; сохраняет торжественную и богословски насыщенную семантику исходного слова.
- source_word: ክፍልክሙ
  choice: ваш удел
  rationale: Сохраняет образ назначенной доли, близкой к наследию, и естественно звучит в русском библейском регистре.
theological_decisions:
- issue: Передача обозначения ወኅሩያን в Книге притчей
  choice: избранные
  alternative: избранники
  rationale: «Избранные» сохраняет эсхатологическую и заветную значимость названия, но не уточняет основания или характера избрания и тем самым не снимает присущую тексту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейско-апокалиптическим звучанием. Инверсия «славен ваш удел» сохраняет торжественность, оставаясь ясной и естественной.
