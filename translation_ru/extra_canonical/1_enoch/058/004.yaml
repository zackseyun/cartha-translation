base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/004.yaml
  text: And they will seek the light and find righteousness with the Lord of Spirits[c][b][a]. Peace be to the righteous in the name of the Lord of Eternity.
translation:
  language: ru
  text: И они будут искать свет и найдут праведность у Господа духов.[a][b] Мир праведным во имя Господа вечности.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обретут праведность»; соответствующий глагол может означать как нахождение, так и обретение или получение.'
    reason: lexical_alternative
  - marker: b
    text: «У Господа духов» можно также понимать как «в присутствии Господа духов» или «от Господа духов».
    reason: lexical_alternative
  - marker: c
    text: Буквальное значение титула допускает также переводы «Господь мира» и, менее естественно по-русски, «Господь века».
    reason: lexical_alternative
lexical_decisions:
- source_word: የኃሥሡ
  choice: будут искать
  rationale: Множественная глагольная форма передана будущим временем в соответствии с пророческой последовательностью видения.
- source_word: ለብርሃን
  choice: свет
  rationale: Сохранён конкретный апокалиптический образ света; показатель объекта не требует воспроизводить предлог в русском переводе.
- source_word: ይረክቡ
  choice: найдут
  rationale: Выбор сохраняет связь «искать — найти», хотя глагол также допускает значение «обрести» или «получить».
- source_word: ጽድቀ
  choice: праведность
  rationale: Передаёт нравственно-религиозный смысл и поддерживает связь со словом «праведным» далее в стихе.
- source_word: በኀበ
  choice: у
  rationale: Естественно передаёт нахождение рядом с Господом или в его присутствии, не утверждая однозначно источник праведности.
- source_word: እግዚአ መናፍስት
  choice: Господь духов
  rationale: Сохранён устойчивый енохический титул Бога и его космический размах.
- source_word: ሰላም ለጻድቃን
  choice: Мир праведным
  rationale: Краткая русская формула сохраняет силу благословения или торжественного провозглашения.
- source_word: በስመ
  choice: во имя
  rationale: Формульное выражение передано прямо, без истолковывающего пересказа.
- source_word: እግዚአ ዓለም
  choice: Господь вечности
  rationale: Так передаётся временной и всеобъемлющий смысл ዓለም без неестественного и потенциально ограничивающего русского выражения «Господь века».
theological_decisions:
- issue: Характер праведности, найденной у Господа духов
  choice: Не уточнять, исходит ли праведность от Господа или обнаруживается в его присутствии
  alternative: «получат праведность от Господа духов»
  rationale: Предлог በኀበ допускает пространственно-реляционный и исходный оттенки; основной текст сохраняет эту открытость.
- issue: Передача титула እግዚአ ዓለም
  choice: Господь вечности
  alternative: Господь мира; Вечный Господь
  rationale: Слово ዓለም может обозначать вечность, мир или век. Основной вариант выражает вечный размах титула, а примечание сохраняет лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной, но ясной библейской интонацией. Синтаксис краток и сохраняет параллелизм исходного изречения; архаизмы не используются.
