base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/002.yaml
  text: And I looked at the tablets of heaven[a], and I read all that was written, and I understood it all; and I read the book of all the deeds of humankind and of all the children of flesh upon the earth[d][c][b], to the generations of eternity.
translation:
  language: ru
  text: И я взглянул на небесные скрижали[a], прочитал всё написанное и всё понял. И я прочитал книгу обо всех деяниях людей и всех детях плоти[b] на земле[d] — вплоть до поколений вечности[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скрижали небес». Речь идёт о небесных письменных записях, характерных для апокалиптической образности.'
    reason: lexical_alternative
  - marker: b
    text: «Дети плоти» — буквальное семитское по характеру выражение, обозначающее людей в их земном, смертном состоянии.
    reason: cultural_note
  - marker: c
    text: 'Или: «до вечных поколений»; «во все поколения навеки». Заключительная формула имеет широкий, образный смысл.'
    reason: lexical_alternative
  - marker: d
    text: 'В геэзском тексте буквально: «которые на земле» — без глагола, указывающего на настоящее или будущее время.'
    reason: grammar_note
lexical_decisions:
- source_word: ነጸርኩ
  choice: я взглянул
  rationale: Передаёт прямой глагол зрительного восприятия в рассказе о видении, не усиливая его до «всматривался» или «созерцал».
- source_word: በፀፍፀፈ ሰማይ
  choice: на небесные скрижали
  rationale: Сохраняет конкретный апокалиптический образ небесных письменных табличек; предлог выбран в соответствии с русским управлением глагола «взглянуть».
- source_word: አንበብኩ ኵሎ ዘጽሑፍ
  choice: прочитал всё написанное
  rationale: Сохраняет всеохватность ኵሎ и пассивное значение «написанное».
- source_word: አእመርኩ ኵሎ
  choice: всё понял
  rationale: В контексте речь идёт не только о получении знания, но и о постижении прочитанного.
- source_word: አንበብክዋ ለመጽሐፈ
  choice: я прочитал книгу
  rationale: Естественно передаёт повторную формулу чтения и выраженный объект, не устраняя повтор, присутствующий в источнике.
- source_word: ኵሉ ምግባሮሙ ለሰብእ
  choice: обо всех деяниях людей
  rationale: «Деяния» сохраняет нравственно значимый и возвышенный оттенок ምግባር, а «людей» выражает универсальное значение без ненужного ограничения мужским полом.
- source_word: ውሉደ ሥጋ
  choice: детях плоти
  rationale: Буквальное образное выражение сохраняет антропологический язык апокалиптического текста и не сводит его без пояснения к «смертным».
- source_word: ዘዲበ ምድር
  choice: на земле
  rationale: Не вводит отсутствующего в геэзском тексте временного значения «живущих» или «которые будут»; временной охват определяется контекстом.
- source_word: እስከ ትውልደ ዓለም
  choice: вплоть до поколений вечности
  rationale: Сохраняет широкий апокалиптический образ поколений и вечности, не упрощая его до одного наречия «навсегда».
theological_decisions:
- issue: Антропологическое выражение ውሉደ ሥጋ
  choice: дети плоти
  alternative: смертные; все люди
  rationale: Буквальный образ подчёркивает земное, телесное состояние человечества в противопоставлении небесным записям, но не привносит отдельного догматического толкования.
- issue: Временной охват выражения ዘዲበ ምድር
  choice: на земле
  alternative: живущих на земле; которые будут на земле
  rationale: Источник не выражает времени глагольной формой, поэтому перевод не ограничивает фразу настоящим или будущим.
- issue: Финальная формула እስከ ትውልደ ዓለም
  choice: вплоть до поколений вечности
  alternative: до вечных поколений; во все поколения навеки
  rationale: Сохранена напряжённая и несколько необычная образность источника вместо её богословского или хронологического уточнения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Повтор «прочитал» сохранён как элемент структуры источника; архаизмы сведены к образно необходимым словам «скрижали» и «деяния».
