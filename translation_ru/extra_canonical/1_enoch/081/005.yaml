base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/005.yaml
  text: And those seven holy ones brought me near and set me on the earth before the door of my house[a], and they said to me, “Make everything known to Methuselah your son, and show all your children that no flesh is righteous before the Lord[b], for he is the one who created them.”
translation:
  language: ru
  text: 'И те семь святых приблизили меня и опустили меня на землю перед дверью моего дома[a]. Они сказали мне: «Возвести всё твоему сыну Мафусалу и покажи всем твоим детям, что никакая плоть не праведна пред Господом[b], ибо именно Он сотворил их».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перед входом в мой дом». Геэзское слово может обозначать дверь или место входа.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «никакая плоть» буквально сохраняет образ источника; здесь оно относится к смертным существам, к человечеству в его телесном состоянии.
    reason: lexical_alternative
lexical_decisions:
- source_word: አቅረቡኒ
  choice: приблизили меня
  rationale: Передаёт каузативное значение приближения, не сводя глагол к общему «привели».
- source_word: ፯ ቅዱሳን
  choice: семь святых
  rationale: Сохраняет апокалиптическое обозначение небесных святых существ без добавления слова «ангелы», которого здесь нет.
- source_word: አንበሩኒ
  choice: поставили меня
  rationale: Естественно по-русски передаёт помещение Еноха на землю; более буквальное «посадили» могло бы неоправданно подчёркивать сидячее положение.
- source_word: በቅድመ ኆኅተ ቤትየ
  choice: перед дверью моего дома
  rationale: Сохраняет конкретный пространственный образ и прямое значение предлога.
- source_word: አይድዕ ኵሎ
  choice: возвести всё
  rationale: Передаёт каузативный императив «сделай известным» в краткой и достойной русской форме.
- source_word: አርኢ ለኵሎሙ ውሉድከ
  choice: покажи всем твоим детям
  rationale: Сохраняет глагол зрительного восприятия «покажи» и широкое значение потомства, не ограничивая его сыновьями.
- source_word: ከመ ኢ ይጸድቅ ኵሉ ዘሥጋ
  choice: что никакая плоть не праведна
  rationale: Передаёт универсальное отрицание и сохраняет конкретную библейско-апокалиптическую идиому «плоть».
- source_word: በቅድመ እግዚአ
  choice: пред Господом
  rationale: Прямой и естественный для возвышенного русского регистра эквивалент пространственно-оценочной формулы.
- source_word: እስመ ውእቱ ፈጠሮሙ
  choice: ибо Он — Тот, Кто сотворил их
  rationale: Сохраняет усиление личным местоимением и явную связь всей плоти с Творцом.
theological_decisions:
- issue: Смысл утверждения о плоти и праведности
  choice: 'Универсальное утверждение: никакая плоть не является праведной пред Господом'
  alternative: Сужение смысла до ритуальной нечистоты либо передача посредством позднейшей специальной формулы об оправдании
  rationale: Текст говорит, что никакая плоть «не праведна» перед Господом. Перевод сохраняет напряжение этого утверждения и не развивает его в более позднюю конфессиональную схему.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Формы «пред», «ибо» и «сотворил» поддерживают достоинство речи, оставаясь понятными современному читателю; синтаксис не архаизирован.
