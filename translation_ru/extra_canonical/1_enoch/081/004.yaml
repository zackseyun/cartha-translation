base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/004.yaml
  text: 'And from it And from it I said: blessed is the man who dies righteous and good, upon whom no book of wrongdoing has been written, and for whom no day of judgment will be found.: blessed is the man who dies righteous and good, upon whom no book of wrongdoing has been written, and for whom no day of judgment will be found.'
translation:
  language: ru
  text: 'И от него[a] я сказал: «Блажен человек, который умирает праведным и добрым, в отношении которого не записано ни одной книги беззакония и для которого не найдётся дня суда».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и от него» или «и из этого»; точная отсылка местоимения неясна.'
    reason: Сохраняет неоднозначность эфиопского ወእምኔሁ, не подменяя её временным переходом.
lexical_decisions:
- source_word: ወእምኔሁ
  choice: И тогда
  rationale: Буквально выражение означает «и от него/из этого»; в данном повествовательном переходе современное русское «и тогда» естественно передаёт последовательность, не фиксируя неоднозначный род местоименного элемента.
- source_word: ብፁዕ
  choice: Блажен
  rationale: Передаёт формулу благословения в возвышенном, но понятном современном русском регистре.
- source_word: ጻድቅ ወኄር
  choice: праведным и добрым
  rationale: Сохраняет два отдельных определения и их предикативную связь с умирающим человеком.
- source_word: መጽሐፈ ዐመፃ
  choice: книги беззакония
  rationale: Сохраняет образ небесной записи; «беззаконие» передаёт нравственно-религиозный смысл ዐመፃ без излишнего уточнения.
- source_word: ዕለተ ኵነኔ
  choice: дня суда
  rationale: Прямое и традиционно понятное соответствие выражению «день суда/осуждения», без решения вопроса о том, подразумевается ли именно осуждение.
theological_decisions:
- issue: Связь праведности и посмертного суда
  choice: Сохранено утверждение, что для такого человека «не найдётся дня суда»
  alternative: «он не будет осуждён в день суда»
  rationale: Альтернатива богословски разъясняет неясную формулировку источника. Дословный образ сохраняет напряжение между отсутствием дня суда для человека и возможным отсутствием осуждения.
- issue: Книга беззакония
  choice: «на ком не записано никакой книги беззакония»
  alternative: «чьи беззакония не записаны ни в одной книге»
  rationale: Выбранная формулировка сохраняет необычный образ книги, записанной «на» человеке, и не превращает книгу в простой перечень отдельных проступков.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной формулой «Блажен человек». Необычные образы «книга беззакония» и «не найдётся дня суда» сохранены ради близости к источнику; повреждённое повторение в английском консультационном тексте не воспроизводится.
