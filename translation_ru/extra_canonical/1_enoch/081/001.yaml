base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/001.yaml
  text: And he said to me[a], “Look, Enoch, at the tablets of heaven, and read what is written on them, and understand everything[c][b], one by one.”
translation:
  language: ru
  text: 'И он сказал мне: «Взгляни, Енох, на небесные скрижали[a], прочитай написанное на них и постигни всё, одно за другим[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Небесные скрижали» — образ хранящихся на небе письменных свидетельств, распространённый в апокалиптической традиции; здесь речь идёт не просто об отвлечённом знании.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «всё, одно за одним»; повтор подчёркивает, что следует постигнуть каждую отдельную запись.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ነጽር
  choice: взгляни
  rationale: Повелительная форма глагола зрительного восприятия. «Взгляни» звучит естественно и возвышенно, не приобретая архаического оттенка слова «воззри».
- source_word: ዘፀፍፀፈ ሰማይ
  choice: небесные скрижали
  rationale: Сохраняет конкретный образ небесных письменных табличек, характерный для апокалиптической литературы; перевод «книги» неоправданно заменил бы исходный образ.
- source_word: አንብብ
  choice: прочитай
  rationale: Точная и естественная передача повелительной формы; контекст не требует уточнения «прочитай вслух».
- source_word: ዘጽሑፍ ዲቤሆሙ
  choice: написанное на них
  rationale: Причастная конструкция естественно передаёт относительный оборот и ясно отсылает к скрижалям.
- source_word: እእምር
  choice: постигни
  rationale: В данном контексте речь идёт не только о получении сведений, но и об осмыслении прочитанного. «Постигни» сохраняет когнитивную глубину глагола и соответствует достоинству повествования.
- source_word: ኵሎ አሐደ አሐደ
  choice: всё, одно за другим
  rationale: Повтор አሐደ አሐደ имеет распределительное значение. Формулировка сохраняет одновременно полноту и последовательное рассмотрение каждой отдельной записи.
theological_decisions:
- issue: Апокалиптический образ небесных письменных свидетельств
  choice: небесные скрижали
  alternative: небесные книги
  rationale: «Скрижали» сохраняют предметность видения и не подменяют исходный образ более привычным образом книг.
- issue: Характер знания, получаемого Енохом
  choice: постигни
  alternative: узнай
  rationale: 'Перевод не сводит повеление к простому ознакомлению: последовательность «взгляни — прочитай — постигни» указывает на осмысленное восприятие содержания, при этом не добавляя особого мистического учения.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис остаётся ясным, а конкретный апокалиптический образ не сглаживается. Архаизмы вроде «воззри» и чрезмерно церковнославянская лексика исключены.
