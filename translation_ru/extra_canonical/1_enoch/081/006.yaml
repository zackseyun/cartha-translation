lexical_decisions:
- source_word: ዓመተ፡ አሐደ፡
  choice: на один год
  rationale: Прямое и естественное по-русски обозначение продолжительности времени.
- source_word: ነኅድገከ፡
  choice: мы оставим тебя
  rationale: Форма глагола — первое лицо множественного числа; перевод сохраняет множественного говорящего и значение «оставить, позволить остаться» без чрезмерно сильного оттенка «покинуть».
- source_word: በኀበ፡ ወልድከ፡
  choice: с твоим сыном
  rationale: Предлог выражает близость или совместное пребывание; такой перевод наиболее ясен и не вводит отсутствующей в тексте идеи попечения.
- source_word: እስከ፡ ካዕበ፡ ትእዛዝ፡
  choice: до нового повеления
  rationale: Сочетание указывает на временный предел и последующее, повторное повеление. «Новое повеление» естественно звучит по-русски, не уточняя, кем и как оно будет дано.
- source_word: ከመ፡
  choice: чтобы…
  rationale: Это союз цели или следствия, а не глагол «приходит». Многоточие честно отражает обрыв имеющегося исходного текста.
theological_decisions:
- issue: Характер властного указания
  choice: повеление
  alternative: приказ; наставление
  rationale: «Повеление» передаёт обязательную силу небесного указания в апокалиптическом контексте, но не называет его источник и не привносит более позднюю конфессиональную терминологию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной лексикой, уместной для апокалиптического текста. Сохранены первое лицо множественного числа, неопределённость источника повеления и синтаксическая незавершённость повреждённого свидетельства.
