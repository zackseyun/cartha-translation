  text: For one year we will leave you with your son[a], until a further command[b], so that...
translation:
  language: ru
  text: На один год мы оставим тебя с твоим сыном — до нового повеления[b], чтобы…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
