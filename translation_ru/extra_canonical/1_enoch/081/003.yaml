base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/003.yaml
  text: And at that time I blessed the Great Lord, the King of Glory forever, because he has made all the works of the world; and I praised the Lord for his patience, and I blessed him on account of the children of Adam.
translation:
  language: ru
  text: И тогда я благословил великого Господа, Царя славы вовеки, потому что Он сотворил все дела мира; и восхвалил Господа за Его долготерпение[a], и благословил Его за детей Адама[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «за Его терпение» либо «за Его снисходительное терпение». Эфиопское слово обозначает терпеливую выдержку и сдержанность, а не только пассивное ожидание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «детей Адама», то есть людей как потомков Адама. Предлог также можно понять как «о детях Адама» или «ради детей Адама».'
    reason: cultural_note_and_lexical_ambiguity
lexical_decisions:
- source_word: እምሶቤሃ
  choice: И тогда
  rationale: Естественный русский повествовательный переход, сохраняющий временную связь с предшествующим видением.
- source_word: እግዚአ ዐቢይ
  choice: великого Господа
  rationale: Прямая передача божественного титула без усиления значения до «могущественного».
- source_word: ንጉሠ ስብሐት
  choice: Царя славы
  rationale: Сохранена конструкция с родительным падежом и возвышенный славословный регистр.
- source_word: ለዓለም
  choice: вовеки
  rationale: Устойчивое и понятное выражение вечной длительности в славословии.
- source_word: በከመ ገብረ ኵሎ ግብረ ዓለም
  choice: потому что Он сотворил все дела мира
  rationale: Сохранено буквальное «дела мира», а не внесено более истолковывающее «всё мироздание» или «все творения».
- source_word: ሰባሕኩ
  choice: восхвалил
  rationale: Глагол отличён от «благословил», чтобы сохранить два близких, но не тождественных действия.
- source_word: ትዕግሥቱ
  choice: Его долготерпение
  rationale: «Долготерпение» передаёт не просто спокойное ожидание, а терпеливую сдержанность и стойкое перенесение.
- source_word: ዲበ ውሉደ አዳም
  choice: за детей Адама
  rationale: Естественная русская формулировка, сохраняющая прямую связь человечества с Адамом; неоднозначность предлога отмечена в сноске.
theological_decisions:
- issue: Передача выражения ውሉደ አዳም
  choice: детей Адама
  alternative: потомков Адама; людей
  rationale: Буквальный образ сохраняет адамову родословную связь и не сводит выражение к отвлечённому обозначению человечества.
- issue: Основание последнего благословения
  choice: за детей Адама
  alternative: о детях Адама; ради детей Адама
  rationale: Предлог допускает несколько смысловых отношений. Основной текст использует естественное русское выражение, а сноска не позволяет принять причинное или благотворительное значение за бесспорно единственное.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным славословным звучанием. Формы «Царь славы» и «вовеки» поддерживают достоинство текста, оставаясь понятными; синтаксический параллелизм глаголов «благословил — восхвалил — благословил» сохранён.
