base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/003.yaml
  text: When I desired to deliver them into the hand of the angels on the day of tribulation and pain[a], I will cause my punishment and my wrath to abide upon them, says God[d][c][b], the Lord of spirits.
translation:
  language: ru
  text: Когда Я пожелал предать их в руки ангелов в день скорби и страдания[a], Я сделаю так, что Моё наказание и Мой гнев пребудут на них, — говорит Бог, Господь духов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Переход в геэзском тексте перед словами «Моё наказание и Мой гнев» синтаксически труден. По-видимому, мысль движется от передачи в руки ангелов к Божьему суду, который пребывает на осуждённых.
    reason: textual_variant
lexical_decisions:
- source_word: ፈቀድኩ
  choice: Я пожелал
  rationale: Передаёт волю и намерение говорящего, не усиливая значение до формального постановления.
- source_word: አጽንዖሙ
  choice: предать их
  rationale: В сочетании с «в руки ангелов» обозначает передачу под чужую власть и сохраняет судебный оттенок.
- source_word: በእደ መላእክት
  choice: в руки ангелов
  rationale: Естественная русская форма библейского судебного оборота, буквально связанного с передачей «в руку».
- source_word: በዕለተ ምንዳቤ ወሕማም
  choice: в день скорби и страдания
  rationale: Сохраняет пару обозначений тяжёлого бедствия и переживаемого страдания в возвышенном апокалиптическом регистре.
- source_word: መቅሠፍተየ
  choice: Моё наказание
  rationale: Слово допускает значения кары, удара или бичевания; «наказание» сохраняет судебный смысл без неоправданного уточнения образа.
- source_word: መዐትየ
  choice: Мой гнев
  rationale: Обычное и ясное обозначение Божьего гнева в контексте суда.
- source_word: አኃድር ዲቤሆሙ
  choice: Я сделаю так, что ... пребудут на них
  rationale: Передаёт каузативное значение и образ наказания и гнева, остающихся над осуждёнными.
- source_word: እግዚአብሔር እግዚአ መናፈስት
  choice: Бог, Господь духов
  rationale: Различает эфиопское наименование Бога и последующий титул «Господь духов», не создавая искусственного повтора «Господь, Господь».
theological_decisions:
- issue: Божественное действие через посредство ангелов
  choice: Бог предаёт осуждённых в руки ангелов, после чего Его собственные наказание и гнев пребывают на них.
  alternative: Считать самих ангелов Божьим наказанием либо отделить день скорби от Божьего гнева.
  rationale: Синтаксис различает посредническую роль ангелов и непосредственно приписанные Богу наказание и гнев; перевод сохраняет это напряжение, не отождествляя два действия.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Местоимения, относящиеся к Богу в прямой речи, написаны с прописной буквы. Оборот «в руки ангелов» сохранён как понятная библейская судебная идиома.
