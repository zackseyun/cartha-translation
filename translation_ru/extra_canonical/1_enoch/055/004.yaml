lexical_decisions:
- source_word: ነገሥት
  choice: цари
  rationale: Обычное множественное число со значением «цари, правители»; отсутствие артикля и форма глагола во втором лице поддерживают звательное обращение.
- source_word: ኃያላን
  choice: сильные
  rationale: В контексте суда обозначает обладающих силой и властью людей; субстантивированное «сильные» сохраняет краткость и параллелизм с «цари».
- source_word: እለ
  choice: живущие
  rationale: Относительный показатель вводит определительную конструкцию; по-русски естественно передать её причастным оборотом.
- source_word: ትኃድሩ
  choice: живущие
  rationale: Форма второго лица множественного числа означает «вы живёте/пребываете»; в согласовании со звательным обращением естественно «живущие». Глагол может также означать временное пребывание, ночлег или расположение станом.
theological_decisions:
- issue: Неполнота или эллиптичность сохранившейся строки
  choice: Перевести только засвидетельствованное обращение, не добавляя места пребывания.
  alternative: О цари и сильные, живущие там
  rationale: Предоставленный эфиопский текст, вероятно, неполон или эллиптичен. Добавление «там» возможно по контексту, но не выражено в данной строке, поэтому вынесено в примечание.
- issue: Лицо глагола и синтаксис обращения
  choice: 'Прямое обращение: «О цари и сильные…»'
  alternative: Цари и сильные, которые живут…
  rationale: ትኃድሩ — форма второго лица множественного числа, а не третьего; поэтому текст обращён к царям и сильным непосредственно.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического обращения. Частица «О» ясно передаёт звательный характер фразы. Формулировка намеренно остаётся незавершённой вслед за предоставленным эфиопским свидетельством; оба маркера примечаний помещены в основной текст.
