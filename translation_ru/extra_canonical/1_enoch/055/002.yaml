base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/002.yaml
  text: And he swore by his great name that from this time onward he would not do thus to all who dwell upon the dry land[a]; and I will set a sign in the heavens, and it will be a pledge of faithfulness between me and them forever, for as long as the days of heaven are upon the earth[c][b]; and this is by my command.
translation:
  language: ru
  text: И он поклялся своим великим именем, что отныне больше не поступит так со всеми, кто живёт на суше; и Я установлю знамение на небесах[a], и оно будет залогом верности[b] между Мною и ими навеки — доколе дни неба пребывают над землёй. И это — по Моему повелению[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Знамение на небесах, вероятно, отсылает к преданию о знамении после потопа, однако в самом стихе оно не названо.
    reason: cross_reference
  - marker: b
    text: '«Залог верности» можно также перевести шире: «верность» или, с учётом контекста, «заветный залог».'
    reason: lexical_alternative
  - marker: c
    text: 'Заключительную фразу можно также перевести: «И это — согласно Моему установлению» или «И это — Мой указ».'
    reason: lexical_alternative
lexical_decisions:
- source_word: መሐለ በስሙ ዐቢይ
  choice: он поклялся своим великим именем
  rationale: Прямо передаёт формулу клятвы и сохраняет её торжественный характер; ዐቢይ передано обычным и точным словом «великий».
- source_word: እምይእዜ ኢይገብር ከመዝ
  choice: отныне больше не поступит так
  rationale: «Отныне» сохраняет временное значение, а «не поступит так» не уточняет действие сверх того, что сказано в источнике.
- source_word: ለኵሎሙ እለ ይነብሩ ዲበ የብስ
  choice: со всеми, кто живёт на суше
  rationale: Слово የብስ означает именно сушу, а не землю вообще, что важно в контексте предания о потопе.
- source_word: ትእምርተ እወዲ በሰማያት
  choice: Я установлю знамение на небесах
  rationale: «Знамение» естественно для видимого небесного знака в возвышенном повествовании; будущее время и первое лицо отражают форму источника.
- source_word: ማእከሌየ ወማእከሌሆሙ
  choice: между Мною и ими
  rationale: Передаёт устойчивое отношение между двумя сторонами без добавочного богословского истолкования.
- source_word: ሃይማኖተ
  choice: залог верности
  rationale: Сохраняет значения верности и доверия и одновременно уместный здесь оттенок удостоверяющего залога, не подменяя исходное слово более явным термином «завет».
- source_word: እስከ ለዓለም መጠነ መዋዕለ ሰማይ ዲበ ምድር
  choice: навеки — доколе дни неба пребывают над землёй
  rationale: Сохранена поэтическая формула длительности, а не сведена к одному слову «навеки».
- source_word: ዝ በትእዛዝየ ውእቱ
  choice: И это — по Моему повелению
  rationale: Кратко и весомо передаёт заключительную формулу божественного установления.
theological_decisions:
- issue: Следует ли прямо назвать небесное знамение радугой
  choice: Знамение оставлено неназванным.
  alternative: «радуга на небесах» или «лук в облаках»
  rationale: Контекст напоминает рассказ о знамении после потопа, но геэзский текст этого стиха говорит лишь о «знамении»; прямое именование было бы гармонизацией.
- issue: Следует ли передать ሃይማኖተ словом «завет»
  choice: «залог верности»
  alternative: «завет», «верность» или «доверие»
  rationale: В источнике употреблено слово из смыслового поля веры, доверия и верности, а не однозначный термин «завет». Выбранный вариант сохраняет заветный оттенок, не делая его явнее оригинала.
- issue: Смена третьего лица на первое в божественной речи
  choice: 'Сохранено: «он поклялся… не поступит… и Я установлю».'
  alternative: 'Унифицировать всё высказывание в первом лице: «Я больше не поступлю…»'
  rationale: Предоставленный геэзский текст переходит от формы третьего лица ኢይገብር к первому лицу እወዲ. Редакционное сглаживание устранило бы реальную особенность источника.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, торжественным звучанием. Архаизмы сведены к минимуму; «доколе» сохранено как понятный поэтический элемент формулы длительности. Прописные буквы в местоимениях первого лица помогают обозначить переход к прямой божественной речи, не устраняя смену грамматического лица в источнике.
