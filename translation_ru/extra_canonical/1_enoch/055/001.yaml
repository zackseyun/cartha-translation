base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/001.yaml
  text: And after this the Head of Days relented and said[a], “In vain I have destroyed all those who dwell on the dry land.”
translation:
  language: ru
  text: 'После этого Глава Дней раскаялся[a] и сказал: «Напрасно я погубил всех обитающих на суше».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «смягчился», «изменил своё решение». Геэзский глагол может обозначать сожаление или перемену решения и не обязательно подразумевает нравственное раскаяние.'
    reason: Лексическая неоднозначность и богословски чувствительное употребление глагола с божественным субъектом.
lexical_decisions:
- source_word: እምድኅረዝ
  choice: после этого
  rationale: Естественно передаёт формулу временного перехода и сохраняет последовательность апокалиптического повествования.
- source_word: ነሥሐ
  choice: раскаялся
  rationale: Буквально сохраняет выраженные в геэзском значения раскаяния, сожаления и перемены решения, не устраняя напряжение, возникающее при таком глаголе с божественным субъектом.
- source_word: ርእሰ መዋዕል
  choice: Глава Дней
  rationale: Прозрачно передаёт составные части особого апокалиптического титула и не подменяет его более привычным библейским именованием.
- source_word: ሕኵፖልክዎሙ
  choice: я погубил
  rationale: Передаёт совершённое губительное действие над множественным объектом; «погубил» естественно звучит в контексте суда и не усиливает образ дополнительными деталями.
- source_word: ለኵሎሙ ለእለ ይነብሩ
  choice: всех обитающих
  rationale: Сохраняет значение всеобщности и продолжающегося проживания.
- source_word: ውስተ የብስ
  choice: на суше
  rationale: Передаёт более конкретное значение «сухая земля», а не обобщённое «земля», сохраняя возможную связь с образом потопа.
theological_decisions:
- issue: Следует ли смягчать глагол ነሥሐ при титуле «Глава Дней»
  choice: раскаялся
  alternative: смягчился; изменил своё решение
  rationale: Исходный текст использует резкое антропопатическое выражение. Основной текст сохраняет это богословское напряжение, а примечание указывает возможные менее нравственно окрашенные значения глагола.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным строем. Необычный титул «Глава Дней» сохранён как характерная черта текста; местоимение «я» дано со строчной буквы по нейтральной современной орфографической практике.
