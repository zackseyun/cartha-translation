base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/007.yaml
  text: And in that fourth gate[a], from which the sun comes out in the first month, there are twelve open windows[c][b], from which a flame comes out when they are opened at their appointed times.
translation:
  language: ru
  text: И в этих четвёртых вратах, из которых солнце выходит в первый месяц, есть двенадцать открытых окон[a], из которых выходит пламя, когда они открываются в назначенное им время[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В эфиопском тексте речь идёт о космических «окнах» — отверстиях в небесных вратах, через которые выходит пламя.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «в их время»; то есть в отведённое или надлежащее для них время.'
    reason: translation_note
lexical_decisions:
- source_word: ኆኅት ራብዕት
  choice: четвёртые врата
  rationale: Сохраняет повторяющийся в Астрономической книге архитектурно-космологический образ небесных врат; в русском слово «врата» обычно употребляется во множественном числе при единичном значении.
- source_word: ይወፅእ ፀሐይ
  choice: солнце выходит
  rationale: Передаёт конкретное движение светила через врата естественным современным русским выражением.
- source_word: በወርኅ ቀዳማዊ
  choice: в первый месяц
  rationale: Прямая и ясная передача временного оборота без добавочного толкования календарной системы.
- source_word: ባቲ ፲፪ መስኮተ መላክወ ርኅዋተ
  choice: есть двенадцать открытых окон
  rationale: По последней текстологической проверке форма መላክወ является ошибкой распознавания вместо መሳክወ; сочетание обозначает «открытые окна», а не власть ветра или ангелов ветров.
- source_word: ዘእምኔሆን
  choice: из них
  rationale: Относительное выражение указывает на окна как источник выходящего пламени.
- source_word: ላህብ
  choice: пламя
  rationale: Сохраняет яркий образ огня без расширения значения до отвлечённого жара.
- source_word: ሶበ ይትረሐዉ
  choice: когда они открываются
  rationale: Передаёт пассивно-возвратный смысл и согласуется с образом небесных окон, действующих по установленному порядку.
- source_word: እምዘመነ ዚአሆሙ
  choice: в назначенное им время
  rationale: Выражает принадлежность каждому отверстию определённого времени в упорядоченной небесной системе, не уточняя сверх текста, кем оно назначено.
theological_decisions:
- issue: Следует ли видеть в трудной OCR-форме упоминание власти ветра или ангелов ветров
  choice: Передать текст как «двенадцать открытых окон»
  alternative: «двенадцать окон власти ветра» или «двенадцать окон ангелов ветров»
  rationale: Последняя сверка показывает, что መላክወ — ошибка распознавания вместо መሳክወ («окна»). Поэтому ангелологическое истолкование здесь не имеет достаточной опоры в исходном тексте.
- issue: Подразумевает ли выражение о времени божественное назначение
  choice: Сохранить формулировку «назначенное им время» без указания действующего лица
  alternative: «в установленное Богом время»
  rationale: Текст говорит об определённом для них времени, но в самом стихе прямо не называет того, кто его установил; перевод не должен добавлять это уточнение.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования. «Врата» и «окна» сохраняют конкретную пространственную образность оригинала; синтаксис упрощён лишь настолько, чтобы стих был естественно понятен современному читателю.
