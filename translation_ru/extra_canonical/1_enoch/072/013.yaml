base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/013.yaml
  text: And it enters at dawn and goes out through the sixth[a], and it goes out and sets in the sixth gate for thirty-two mornings[d][c][b], according to its sign.
translation:
  language: ru
  text: На рассвете оно входит и выходит в шестые врата[a]; затем оно выходит и заходит в шестых вратах в течение тридцати двух утр[b] — в связи со своим знаком[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В оригинале: «в шестые» или «внутрь шестых»; подразумеваются шестые врата (или отверстия) из последовательности, описанной в этой главе.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тридцать два утра». Срок исчисляется утрами, а не передаётся более гладким выражением «тридцать два дня».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «из-за своего знака» либо «относительно своего знака». Значение предлога допускает причинное или тематическое прочтение; по контексту возможно и «согласно своему знаку».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ይገብእ
  choice: входит
  rationale: Сохранён конкретный глагол движения, соответствующий образу небесных врат и не заменяющий его современным астрономическим описанием.
- source_word: ጽባሐ
  choice: на рассвете
  rationale: Передаёт временное значение слова и естественно звучит в русском описании движения светила.
- source_word: ይወፅእ
  choice: выходит
  rationale: Оба употребления глагола отражены в тексте; намеренный повтор исходника не устранён.
- source_word: ውስተ ሳድስት
  choice: через шестые
  rationale: Порядковое числительное эллиптически относится к вратам; дополнение раскрывается только в сноске, а основной текст сохраняет сжатость оригинала. Предлог передан по смыслу движения через отверстие, при сохранении возможного буквального варианта в сноске.
- source_word: የዓርብ
  choice: заходит
  rationale: В астрономическом контексте глагол обозначает заход светила, а не просто движение вниз.
- source_word: ኆኅት
  choice: врата
  rationale: Сохраняется характерный для Книги светил образ небесных врат; варианты «окно» и «отверстие» не внесены в основной текст.
- source_word: ሠላሳ ወ፪ ጽባሕ
  choice: тридцать два утра
  rationale: Сохранён явный способ счёта по утрам, без сглаживания до «тридцати двух дней».
- source_word: በእንተ ትእርተ ዚአሃ
  choice: по своему знаку
  rationale: Краткая русская формула сохраняет связь периода с принадлежащим светилу знаком, не делая причинное или нормативное отношение чрезмерно однозначным.
theological_decisions:
- issue: Образ небесных отверстий в устройстве мира
  choice: Сохранить конкретное слово «врата».
  alternative: окно; отверстие; сектор
  rationale: Апокалиптическая космография текста передаётся как данная в видении, а не переводится в категории современной астрономии.
- issue: Связь тридцати двух утр со «знаком»
  choice: 'Передать неоднозначно: «по своему знаку».'
  alternative: из-за своего знака; относительно своего знака; согласно своему знаку
  rationale: Предлог በእንተ допускает причинное или тематическое понимание, тогда как контекст может указывать на упорядоченность движения; основной текст не должен без необходимости разрешать это напряжение.
