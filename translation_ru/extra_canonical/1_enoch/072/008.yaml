  yaml_path: translation/extra_canonical/1_enoch/072/008.yaml
  text: And when the sun rises from the sky[a], it goes out through that fourth gate for thirty mornings[c][b], and through the fourth gate in the west of the sky it goes down exactly.
translation:
  language: ru
  text: Когда солнце восходит на небе, оно выходит через четвёртые врата в течение тридцати утр[a], а через четвёртые врата на западе неба опускается по прямой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тридцати дней». Буквально: «тридцати утр»; в этой астрономической последовательности «утро» служит единицей времени.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально выражение указывает на прямое, правильное или точно направленное движение; возможный перевод: «опускается точно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይሠርቅ
  choice: восходит
  rationale: В астрономическом контексте глагол обозначает восход солнца; это естественный и точный русский эквивалент.
- source_word: ይወፅእ
  choice: выходит
  rationale: Сохраняет конкретный образ движения наружу через небесные врата, важный для космологии раздела.
- source_word: ኆኅት
  choice: врата
  rationale: Передаёт устойчивый образ небесных проходов; «врата» соответствует возвышенному апокалиптическому регистру, оставаясь понятным современному читателю.
- source_word: ራብዕት
  choice: четвёртые
  rationale: Буквально сохраняет порядковое обозначение в последовательности солнечных врат.
- source_word: ሠላሳ ጽባሐ
  choice: в течение тридцати утр
  rationale: Сохраняет буквальное «тридцать утр», не устраняя специфическую единицу времени астрономического описания.
- source_word: ምዕራበ ሰማይ
  choice: на западе неба
  rationale: Естественно по-русски передаёт пространственную космологическую формулу «запад неба».
- source_word: ርቱዐ
  choice: по прямому пути
  rationale: Передаёт пространственную прямизну или правильность движения и исключает ошибочное временное значение «тотчас».
- source_word: ይወርድ
  choice: опускается
  rationale: Сохраняет буквальный образ нисходящего движения солнца, не заменяя его более интерпретирующим «заходит».
theological_decisions:
- issue: Образ небесных врат
  choice: Сохранить буквальные «врата» и глаголы пространственного движения.
  alternative: Истолковать описание как обычную феноменологическую речь о восходе и закате без небесной архитектуры.
  rationale: Астрономическая книга изображает упорядоченную визионерскую космологию; перевод не должен сглаживать её до привычного описания наблюдаемого неба.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. «Врата» сохраняет апокалиптическую образность, тогда как синтаксис и остальные слова остаются доступными обычному современному читателю.
