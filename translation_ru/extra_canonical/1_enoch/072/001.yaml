  terminology: «Небесные светила», «сонм», «власть», «времена», «происхождения», «пути» и «новое дело» удачны. Для ሚጠተ в названии следует употребить «движение», чтобы отличить его от አውራኂ, переданного далее как «пути». Имя «Уриил» нормативно для русского библейского и межзаветного контекста.
