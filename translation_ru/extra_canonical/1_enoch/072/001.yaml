base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/001.yaml
  text: The book of the courses of the luminaries of heaven[a], how they are, each according to their companies, and according to their dominion and their seasons, according to their names and their origins, and according to their paths, which Uriel, the holy angel who was with me, showed me—he who is their guide—and the whole record of them, as he showed me, and how it is with regard to every year of the world and forever[h][g][f][e][d][c][b], until a new work is accomplished which will endure forever.
translation:
  language: ru
  text: 'Книга о движении небесных светил: каковы они — каждое в своём сонме[a], со своей властью и своими временами, со своими именами, происхождениями[b] и путями. Всё это показал мне Уриил, святой ангел, который был со мной, — тот, кто направляет их, — а также всю запись о них[c], как он показал мне, и то, как обстоит дело с каждым годом мира и вовеки[d], пока не совершится новое дело[e], которое пребудет вовеки.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в своём народе (или собрании)»; слово образно обозначает группы или сонмы небесных тел.'
    reason: lexical_alternative
  - marker: b
    text: Слово может означать «рождения» или «происхождения», а в астрономическом контексте — также места либо моменты восхода.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «всю их книгу» или «всю их запись»; в языке источника существительное стоит в единственном числе.'
    reason: textual_note
  - marker: d
    text: 'Сжатое выражение допускает также перевод: «как устроен весь мировой год навеки». Речь идёт о полном годовом космическом цикле.'
    reason: cultural_note
  - marker: e
    text: 'Или: «новое творение». Выражение обозначает непреходящий будущий акт, но не уточняет, идёт ли речь о новом творении или о новом порядке.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: መጽሐፈ፡ ሚጠተ፡ ብርሃናት፡ ሰማይ
  choice: Книга о путях небесных светил
  rationale: «Книга» передаёт название самостоятельного сочинения; «пути» выражают упорядоченное движение светил без анахроничного «орбиты»; «небесные светила» естественно и возвышенно передаёт буквальное «светила неба».
- source_word: በበሕዝቢሆሙ
  choice: каждое в своём сонме
  rationale: Буквальный образ «народа/собрания» применён к группам небесных тел. «Сонм» сохраняет собирательную метафору и уместен в возвышенном космологическом контексте.
- source_word: ሥልጣኖሙ
  choice: со своей властью
  rationale: Сохраняет значение назначенной власти или области господства светил, не сводя его к физической силе.
- source_word: ዘመኖሙ
  choice: своими временами
  rationale: «Времена» сохраняют более широкий смысл установленных периодов; перевод «сезоны» был бы уже исходного значения.
- source_word: ሙላዳቲሆሙ
  choice: происхождениями
  rationale: Основное значение связано с рождением или происхождением; астрономическое значение «восходы» возможно, но не навязывается основным текстом.
- source_word: አውራኂሆሙ
  choice: путями
  rationale: Передаёт траектории движения светил и избегает современного технического термина «орбиты».
- source_word: ኵሎ፡ መጽሐፎሙ
  choice: всю запись о них
  rationale: 'Существительное стоит в единственном числе: буквально «вся их книга/запись». «Вся запись о них» естественна по-русски и сохраняет собирательный смысл.'
- source_word: መራኂሆሙ
  choice: тот, кто направляет их
  rationale: Передаёт роль Уриила как руководящего движением светил, не усиливая её до власти правителя.
- source_word: ግብር፡ ኃዲስ
  choice: новое дело
  rationale: Буквальный перевод сохраняет открытым вопрос, означает ли выражение новое творение, новый порядок или иной непреходящий Божий акт.
theological_decisions:
- issue: Смысл выражения ግብር ኃዲስ
  choice: новое дело
  alternative: новое творение
  rationale: «Новое дело» ближе к лексической форме источника и не отождествляет неоднозначный будущий акт с конкретной разработанной доктриной о новом творении.
- issue: Отношение ежегодного порядка к вечности
  choice: что происходит в каждый год мира и вовеки
  alternative: как устроен весь мировой год навеки
  rationale: Синтаксис геэзского текста сжат и допускает разные связи. Основной перевод сохраняет повторяемость каждого мирового года и перспективу вечности, не добавляя отсутствующего глагола «устроен».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным космологическим звучанием. Синтаксис разделён на два смысловых периода ради ясности, при этом перечислительная структура и неоднозначность заключительной эсхатологической формулы сохранены.
