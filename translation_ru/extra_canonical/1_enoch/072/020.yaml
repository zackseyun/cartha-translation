base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/020.yaml
  text: On that day the day becomes equal with the night[a], [and it becomes even], and the night becomes nine parts[c][b], and the day also nine parts.
translation:
  language: ru
  text: В тот день день сравняется с ночью [и станет равным][a], и ночь будет состоять из девяти частей[b], и день — также из девяти частей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Слова «и станет равным» заключены в скобки в исходном свидетельстве: возможно, это текстовое добавление или неуверенно засвидетельствованное чтение.'
    reason: textual_variant
  - marker: b
    text: «Части» здесь — условные доли, которыми в Астрономической книге измеряется соотношение дня и ночи, а не современные часы.
    reason: cultural_note
lexical_decisions:
- source_word: በይእቲ፡ ዕለት፡
  choice: В тот день
  rationale: Естественно передаёт временную указательную конструкцию и сохраняет календарный контекст.
- source_word: ይትዓረይ፡ መዓልት፡ ምስለ፡ ሌሊት፡
  choice: день сравняется с ночью
  rationale: Глагол выражает достижение равенства; «сравняется» естественно по-русски передаёт изменение соотношения дня и ночи, не вводя современного термина «равноденствие».
- source_word: '[ወይከውን፡ ዕሩየ፡]'
  choice: '[и станет равным]'
  rationale: Сохранены скобки исходного свидетельства и смысл равенства; возможное повторение не устранено редакторски.
- source_word: ተስዓተ፡ ክፍለ፡
  choice: девяти частей
  rationale: «Части» сохраняют техническую схему деления суток в Астрономической книге и не подменяются современными часами.
- source_word: ወትከውን፡ ሌሊት፡ ... ወመዓልትኒ፡
  choice: и ночь будет состоять из ... и день — также из
  rationale: Формула становления числовой величины передана естественной русской конструкцией «будет состоять из»; соответствие ночи и дня и эллипсис второй части сохранены.
theological_decisions:
- issue: Характер равенства дня и ночи
  choice: Передать как календарно-астрономическое равенство дня и ночи в условных частях.
  alternative: Истолковать равенство образно как символ космической гармонии.
  rationale: Ближайший контекст Книги светил носит технический и календарный характер; перевод не привносит символического или конфессионального толкования.
