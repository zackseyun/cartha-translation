base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/023.yaml
  text: And the sun comes out from that third gate[a], and sets in the third gate in the west, and returns to the east, and comes out from the second gate in the east for thirty mornings; and in this way it sets in the second gate in the west of heaven.
translation:
  language: ru
  text: И солнце выходит из тех третьих ворот, заходит в третьи ворота на западе, возвращается на восток и в течение тридцати утр[a] выходит из вторых ворот на востоке; таким же образом оно заходит во вторые ворота на западе неба.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тридцать утр». Вероятно, имеется в виду тридцатидневный отрезок пути солнца, однако в основном тексте сохранена формулировка источника.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወፅእ
  choice: выходит
  rationale: Передаёт повторяющееся движение солнца из небесных ворот и естественно звучит в данном астрономическом описании.
- source_word: ፀሐይ
  choice: солнце
  rationale: Прямое обозначение астрономического светила без дополнительной персонификации.
- source_word: ሣልስት ኆኅት
  choice: третьи ворота
  rationale: Сохраняет конкретный образ упорядоченных небесных ворот, характерный для астрономической космологии книги.
- source_word: ያዓርብ
  choice: заходит
  rationale: В описании суточного пути солнца это естественный русский эквивалент со значением заката.
- source_word: በዐረብ
  choice: на западе
  rationale: Фраза имеет пространственное значение и образует пару с востоком.
- source_word: ይገብእ
  choice: возвращается
  rationale: Контекст описывает циклическое движение солнца обратно на восток после захода; перевод сохраняет эту последовательность.
- source_word: ውስተ ምሥራቅ
  choice: на восток
  rationale: Естественно передаёт направление движения в русском языке.
- source_word: ካልእ ኆኅት
  choice: вторые ворота
  rationale: В последовательности нумерованных солнечных ворот слово указывает на вторые ворота, а не просто на иные.
- source_word: ሠላሳ ጸባሐ
  choice: в течение тридцати утр
  rationale: Сохраняет буквальное счётное обозначение источника — «тридцать утр», не заменяя его толкованием «тридцать дней».
- source_word: በምዕራበ ሰማይ
  choice: на западе неба
  rationale: Сохраняет пространственный и космологический образ источника в естественной русской форме.
theological_decisions:
- issue: Космологический образ солнечных ворот
  choice: Сохранить конкретное упоминание ворот и движения солнца между востоком и западом
  alternative: Передать ворота как точки восхода и заката на горизонте
  rationale: Текст изображает упорядоченную небесную космологию; динамическая модернизация устранила бы значимый апокалиптический образ.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным космологическим регистром. Синтаксис сохраняет последовательность движений исходного текста, а термин «ворота» — его конкретную образность.
