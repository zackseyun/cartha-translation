  text: On that day the day diminishes by two parts[a], and the day becomes ten parts[b], and the night eight parts.
translation:
  language: ru
  text: В тот день день убывает на две части[a] и составляет десять частей[b], а ночь — восемь частей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В Астрономической книге продолжительность светлого и тёмного времени регулярно измеряется «частями». Здесь описано сезонное убывание дня: день составляет десять частей, а ночь — восемь.'
    reason: cultural_note
  - marker: b
    text: 'Возможный более буквальный перевод: «сокращается на две части, и день становится десятью частями, а ночь — восемью частями».'
    reason: translation_note
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: В тот день
  rationale: Естественная русская временная формула, сохраняющая указательное значение и обозначающая конкретный момент в цикле светил.
- source_word: ተሐፅፅ
  choice: убывает
  rationale: Глагол обозначает уменьшение или сокращение; «убывает» естественно описывает сезонное уменьшение продолжительности дня и согласуется с астрономическим контекстом.
- source_word: ተክልኤተ ክፍል
  choice: на две части
  rationale: В данном контексте выражение указывает величину уменьшения, а не разделение дня на две доли.
- source_word: ወትከውን
  choice: и теперь составляет
  rationale: Передаёт наступившее в результате уменьшения состояние; «теперь» делает связь процесса и результата ясной по-русски, не меняя смысла.
- source_word: ዕለት ዓሠርተ ክፍለ
  choice: день составляет десять частей
  rationale: Сохраняет день как явный субъект и технический способ исчисления светлого времени в «частях».
- source_word: ወሌሊት ስመንተ ክፍለ
  choice: а ночь — восемь
  rationale: 'Эллиптическая русская конструкция естественно и симметрично передаёт: ночь составляет восемь частей.'
