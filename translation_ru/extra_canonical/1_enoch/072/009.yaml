- issue: Следует ли передать конструкции ዕለት እምዕለት и ሌሊት እምሌሊት буквально как прямое сравнение или как постепенное изменение
  choice: день ото дня становится длиннее, а ночь от ночи — короче
  alternative: день становится длиннее дня, а ночь — короче ночи
  rationale: В астрономическом контексте речь идёт о последовательном изменении продолжительности дня и ночи. Выбранная формулировка сохраняет сравнительную повторность оригинала, не устраняя её смысловую особенность, но избегает неестественной для русского языка конструкции.
