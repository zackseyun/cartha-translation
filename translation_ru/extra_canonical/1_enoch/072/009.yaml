  choice: день ото дня
  rationale: Русское сравнительно-постепенное выражение сохраняет повтор слова «день» и ясно обозначает последовательное увеличение продолжительности каждого следующего дня.
- source_word: ተኃጽር ሌሊት እምሌሊት
  choice: ночь от ночи — короче
  rationale: Сохраняет синтаксический параллелизм с предыдущей частью и передаёт последовательное уменьшение продолжительности ночи.
