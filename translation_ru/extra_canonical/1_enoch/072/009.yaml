  text: And in those days the day grows longer from day to day[a], and the night grows shorter from night to night[c][b], until thirty mornings.
translation:
  language: ru
  text: И в те дни день ото дня становится длиннее, а ночь от ночи становится короче[a], вплоть до тридцати утр[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В геэзском тексте повторяются слова «день» и «ночь» в сравнительной конструкции: «день от дня», «ночь от ночи». Смысл, вероятно, в том, что каждый следующий день становится длиннее, а каждая следующая ночь — короче.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «вплоть до тридцати рассветов». Слово буквально означает «утро» или «рассвет» и, вероятно, обозначает отсчитываемый этап в описании движения светил.'
    reason: lexical_alternative
