base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/019.yaml
  text: And the sun comes out from that fifth gate[a], and sets in the fifth gate in the west, and rises in the fourth gate according to its signs for thirty-one mornings[d][c][b], and sets in the west.
translation:
  language: ru
  text: И солнце выходит из тех пятых ворот, и заходит в пятых воротах на западе, и в течение тридцати одного утра восходит в четвёртых воротах согласно своим знамениям[a], и заходит на западе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «согласно своим знамениям» не вполне ясно. Его можно понять и как «из-за своих знамений»; вероятно, речь идёт об установленных указаниях или наблюдаемых признаках солнечного хода.
    reason: lexical_alternative
  - marker: b
    text: 'Последняя фраза в геэзском тексте кратка: «и заходит на западе». Некоторые переводы добавляют «в тех воротах», но здесь слово «ворота» повторно не названо.'
    reason: alternative_reading
lexical_decisions:
- source_word: ይወፅእ
  choice: выходит
  rationale: Глагол обозначает выход, появление вовне; «выходит» естественно передаёт движение солнца и сохраняет конкретный образ.
- source_word: ኆኅት
  choice: ворота
  rationale: В астрономической части книги небесные проходы представлены как ворота. Этот вариант сохраняет апокалиптическую космологическую образность.
- source_word: የዓርብ / ያዓርብ
  choice: заходит
  rationale: В контексте движения солнца глагол обозначает заход; русское «заходит» точно и идиоматично.
- source_word: ምዕራብ
  choice: запад
  rationale: Слово обозначает западное направление или область; выражение «на западе» естественно в данном контексте.
- source_word: ይሠርቅ
  choice: восходит
  rationale: В астрономическом контексте речь идёт о восходе солнца.
- source_word: በራብዕት ኆኅት
  choice: в четвёртых воротах
  rationale: Предлог በ и формульный параллелизм с предшествующим «в пятые ворота» поддерживают пространственное значение; русский падеж согласован с глаголом «восходит».
- source_word: በእንተ ትእርታቲሃ
  choice: согласно своим знамениям
  rationale: Оборот допускает причинный оттенок («из-за», «по причине»), но в данном контексте выражает сообразность установленным признакам или указаниям солнечного хода. «Согласно» сохраняет эту связь без оттенка цели.
- source_word: ሠላሳ ወአሐዱ ጽባሕ
  choice: тридцать одно утро
  rationale: Источник прямо говорит об «утрах», а не обобщённо о днях; буквальное обозначение сохраняет наблюдательную рамку описания.
theological_decisions:
- issue: Космические «ворота» в устройстве небес
  choice: Сохранить буквальный образ ворот
  alternative: проёмы; окна
  rationale: Текст изображает упорядоченный космос языком видения. «Ворота» сохраняют его апокалиптическую образность и не превращают описание в современную астрономическую прозу.
- issue: Связь движения солнца с его знамениями
  choice: согласно своим знамениям
  alternative: из-за своих знамений; по своим признакам
  rationale: Формулировка сохраняет трудность и смысловую напряжённость оригинала, не уточняя без достаточного основания, являются ли знамения причиной, установленными указаниями или наблюдаемыми признаками.
translation_notes:
  register: Современный литературный русский язык с несколько возвышенным, но понятным повествовательным строем. Сохранены формульные повторы, характерные для астрономического раздела, и образ небесных ворот. Пунктуация слегка упорядочивает длинную цепочку действий, не меняя её последовательности.
