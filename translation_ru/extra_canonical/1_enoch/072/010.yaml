base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/010.yaml
  text: On that day the day becomes longer than the night by a ninth part[a], and the day becomes exactly ten parts[c][b], and the night becomes exactly eight parts.
translation:
  language: ru
  text: 'В тот день день становится длиннее ночи на одну девятую часть[a]: день составляет ровно десять частей[b], а ночь — ровно восемь частей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'После слов «становится длиннее» в эфиопском тексте стоит заключённое в скобки и не вполне ясное слово, которое может означать «снова» или «во второй раз». Основной смысл фразы остаётся ясным: день превосходит ночь по продолжительности на одну девятую часть.'
    reason: textual_variant
  - marker: b
    text: «Части» — принятые в этой главе условные доли, которыми измеряется относительная продолжительность дня и ночи; вместе они составляют восемнадцать частей.
    reason: cultural_note
lexical_decisions:
- source_word: በውእቱ፡ ዕለት፡
  choice: В тот день
  rationale: Естественная русская временная формула, сохраняющая указательное значение оригинала.
- source_word: ትነኍኅ፡ … እምሌሊት፡
  choice: день становится длиннее ночи
  rationale: Передаёт увеличение продолжительности дня и сравнительное значение предлога в данном астрономическом контексте.
- source_word: ታስዕተ፡ እደ፡
  choice: на одну девятую часть
  rationale: 'Форма обозначает одну девятую, а не девять частей; это согласуется с восемнадцатичастной системой стиха: десять частей дня и восемь частей ночи различаются на две части, то есть на одну девятую целого.'
- source_word: ጥንቁቀ፡
  choice: ровно
  rationale: Наречие подчёркивает точность исчисления; оно передано при обоих числовых показателях.
- source_word: ዓሠርተ፡ ክፍለ፡ / ስመንተ፡ ክፍለ፡
  choice: десять частей / восемь частей
  rationale: Последовательно передаёт технические доли, которыми в этой главе измеряется относительная продолжительность дня и ночи.
- source_word: '[ካዕበተ፡]'
  choice: не отражено отдельным словом в основном тексте
  rationale: Слово заключено в скобки в исходном издании и текстуально неустойчиво; надёжный смысл окружающей фразы сохраняется, а неопределённость отмечена в сноске.
theological_decisions:
- issue: Характер числовых обозначений
  choice: Технические доли продолжительности дня и ночи
  alternative: Символические апокалиптические числа
  rationale: Контекст главы последовательно описывает ход солнца и сезонное изменение продолжительности дня и ночи; поэтому числа переданы как элементы астрономического исчисления без внесения дополнительной символики.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанным и слегка техническим тоном. Повтор слова «день» сохранён ради точности временной формулы и предмета высказывания; числовая симметрия оригинала передана выражениями «ровно десять» и «ровно восемь».
