base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/030.yaml
  text: And on that day the night is shortened from its length[a], and the night becomes ten parts[b], and the day eight parts.
translation:
  language: ru
  text: В тот день ночь становится короче[a] и составляет десять частей[b], а день — восемь частей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь день и ночь условно делятся на пронумерованные «части»; это технический способ описания сезонного изменения их продолжительности, а не указание на часы.
    reason: cultural_note
  - marker: b
    text: 'Или: «двенадцать частей».'
    reason: textual_variant
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: в тот день
  rationale: Естественно передаёт временное указание и указательную силу геэзского выражения.
- source_word: ተኃጽጸ፡ ሌሊት፡ እምኑኃ
  choice: ночь сокращается по сравнению со своей прежней продолжительностью
  rationale: Глагол обозначает уменьшение или сокращение, а እምኑኃ указывает на исходную протяжённость; развёрнутая русская формулировка ясно выражает изменение длительности ночи.
- source_word: ትከውን፡ ሌሊት፡ ፲ወ፪ተ፡ ክፍለ
  choice: составляет двенадцать частей
  rationale: В предоставленном геэзском тексте числовая запись ፲ወ፪ተ буквально означает «двенадцать». «Составляет» естественно передаёт результирующее измеренное состояние.
- source_word: ማዓልት፡ ፰ክፍለ
  choice: день — восемь частей
  rationale: Сохраняет краткий параллелизм исходного текста; связка «составляет» подразумевается из предыдущей части предложения.
