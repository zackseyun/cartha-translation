  yaml_path: translation/extra_canonical/1_enoch/072/017.yaml
  text: And the sun goes out from the west[a], from that sixth gate, and travels eastward, and rises in the fifth gate for thirty mornings[b], and sets again in the west in the fifth western gate.
translation:
  language: ru
  text: И солнце выходит с запада, из шестых ворот, идёт на восток, тридцать утр[a] восходит в пятых воротах, а затем снова заходит на западе, в пятых западных воротах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тридцать утр». Это выражение может обозначать отсчёт тридцати дней, однако в переводе сохранена формулировка эфиопского текста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይወፅእ፡ ፀሐይ፡ እምነ፡ ምዕራብ
  choice: И солнце выходит с запада
  rationale: Глагол обозначает выход или появление; «выходит» естественно передаёт движение солнца через небесные ворота. እምነ ምዕራብ означает именно «с запада», без добавления «оттуда».
- source_word: እምይእቲ፡ ሳድስት፡ ኆኅት
  choice: из тех шестых ворот
  rationale: Сохранены указательное значение и образ небесных ворот; русское «ворота» грамматически имеет форму множественного числа, хотя речь идёт об одних, шестых воротах.
- source_word: ወየሐውር፡ ምሥራቀ
  choice: идёт на восток
  rationale: Прямо передаёт обычный глагол движения и направление, не вводя современных астрономических объяснений.
- source_word: ወይሠርቅ፡ በኃምስት፡ ኆኅት
  choice: восходит в пятых воротах
  rationale: В контексте солнца глагол означает восход; предложная конструкция сохраняет локативность оригинала и повторяющуюся терминологию главы.
- source_word: ሠላሳ፡ ጽባሐ
  choice: тридцать утр
  rationale: Буквально сохранено «тридцать утр», а не истолковано как «тридцать дней».
- source_word: ወየዓርብ፡ በምዕራብ፡ ካዕበ
  choice: а затем снова заходит на западе
  rationale: В параллели с восходом глагол естественно означает заход солнца; «снова» передаёт повторность ካዕበ.
- source_word: ኃምስተ፡ ኆኅተ፡ እንተ፡ ምዕራብ
  choice: в пятых западных воротах
  rationale: Формулировка сохраняет соответствие пятым воротам западной стороны и пространственную симметрию текста.
theological_decisions:
- issue: Образ небесных ворот в космологии текста
  choice: Сохранить буквальное обозначение «ворота».
  alternative: «проёмы», «порталы» или объяснительное «точки горизонта»
  rationale: Текст описывает устройство мира средствами апокалиптического видения. Буквальный образ не следует сглаживать или заменять современной космологической интерпретацией.
translation_notes:
  register: Современный литературный русский язык с ясным, но достоинственным синтаксисом. Повторение слова «ворота» намеренно сохранено как технический образ этой главы; архаизмы и конфессионально окрашенные толкования не вводятся.
