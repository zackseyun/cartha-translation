base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/028.yaml
  text: And on that day the night decreases from its length by a ninth part[a], that is, one part, and the night becomes eleven parts[b], and the day seven parts.
translation:
  language: ru
  text: И в тот день продолжительность ночи сокращается на девятую часть[a], то есть на одну часть, и ночь составляет одиннадцать частей, а день — семь частей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфиопский текст в этом месте сложен, а написание числовой фразы отмечено как сомнительное. Наиболее вероятный смысл: продолжительность ночи уменьшается на одну девятую, то есть на одну часть принятой здесь шкалы, после чего ночь составляет одиннадцать частей, а день — семь.'
    reason: textual_variant
lexical_decisions:
- source_word: ኀፀፀት
  choice: убывает
  rationale: Глагол обозначает уменьшение или сокращение; в астрономическом контексте «убывает» естественно передаёт сокращение продолжительности ночи.
- source_word: ሌሊት
  choice: ночь
  rationale: Прямое обозначение ночного периода, измеряемого здесь в частях.
- source_word: እምኑኃ
  choice: в своей продолжительности
  rationale: Форма понимается как «от/из её длины (продолжительности)», где местоименный суффикс относится к ночи; это предпочтительнее ошибочного прочтения как «от девяти».
- source_word: ታስዕተ እደ
  choice: на девятую часть
  rationale: Фраза указывает величину уменьшения — одну девятую, далее пояснённую как одна часть в принятой схеме деления.
- source_word: ክፍለ አሐደ
  choice: одну часть
  rationale: Сохраняется техническая терминология Астрономической книги, где день и ночь измеряются условными частями.
- source_word: ወኮነት
  choice: и ночь становится длиной в
  rationale: Передаёт наступившее после уменьшения состояние; добавление «длиной» делает русскую фразу ясной, не меняя смысла.
- source_word: ፲ወ፪ተ ወአሐደ ክፍለ
  choice: одиннадцать частей
  rationale: Числовая формула выражает итоговую продолжительность ночи в одиннадцать частей.
- source_word: መዓልት
  choice: день
  rationale: Естественная пара к слову «ночь» в повторяющейся формуле о соотношении дня и ночи.
- source_word: ሰብዓተ ክፈለ
  choice: семь частей
  rationale: Сохраняет указанное в источнике техническое деление дневного времени.
theological_decisions:
- issue: Передача астрономической системы деления времени
  choice: Сохранить термин «части», не заменяя его часами или современными долями суток.
  alternative: Передать как «часы» либо описательно как доли светлого и тёмного времени.
  rationale: Текст использует собственную схематическую космологическую систему. «Части» сохраняют её понятийный строй и не привносят современную систему измерения времени.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранена техническая лексика источника («часть»), а синтаксис слегка прояснён выражением «становится длиной в», чтобы числовая схема естественно читалась по-русски.
