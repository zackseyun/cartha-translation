base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/025.yaml
  text: And on that day the sun comes out from that second gate[a], and sets in the west at the second gate, and returns to the east at the first gate for thirty-one mornings[d][c][b], and sets at the first gate in the west of heaven.
translation:
  language: ru
  text: В тот день солнце выходит через вторые ворота и заходит на западе через вторые ворота; затем оно возвращается на восток и в течение тридцати одного утра[a] входит через первые ворота, а заходит через первые ворота на западе неба.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тридцать одно утро»; в этой календарной схеме так исчисляются дни.'
    reason: cultural_note
lexical_decisions:
- source_word: ይወፅእ
  choice: выходит
  rationale: Конкретный глагол движения сохраняет образ солнца, выходящего из небесных ворот.
- source_word: ኆኅት
  choice: ворота
  rationale: В астрономической картине 1 Еноха это постоянные отверстия неба; «ворота» естественно сохраняет космологический образ.
- source_word: ያዓርብ
  choice: заходит
  rationale: В сочетании с солнцем и западом глагол имеет обычное астрономическое значение захода солнца.
- source_word: ይገብእ
  choice: возвращается
  rationale: В данной циклической последовательности обозначает возвращение солнца на восток; возможное буквальное значение «входит» здесь менее ясно передаёт движение всего цикла.
- source_word: በአሐቲ ኆኅት
  choice: к первым воротам / у первых ворот
  rationale: В перечислительной последовательности አሐቲ естественно понимать как порядковое «первые», а гибкость предлога передана согласно направлению движения и месту захода.
- source_word: ሠላሳ ወ፩ ጸባሐ
  choice: на тридцать одно утро
  rationale: Сохраняется буквальный образ «утр», который в календарной схеме служит счётом дней.
- source_word: ምዕራበ ሰማይ
  choice: запад неба
  rationale: Формулировка сохраняет космологическую архитектуру небесных ворот, не сводя её к обычному описанию погоды.
