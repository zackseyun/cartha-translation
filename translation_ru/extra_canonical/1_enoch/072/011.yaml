base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/011.yaml
  text: And the sun comes out from that fourth gate[a], and sets in the fourth gate, and returns to the fifth gate of the east for thirty mornings[c][b]; then it comes out from it and sets in the fifth gate.
translation:
  language: ru
  text: И солнце выходит из тех четвёртых ворот и заходит в четвёртые ворота, а затем возвращается в пятые восточные ворота на тридцать утр[a]; потом оно выходит из них и заходит в пятые ворота.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тридцать утр»; в этом разделе периоды пути солнца обычно исчисляются утрами, а не обозначаются более общим словом «дни».'
    reason: lexical_alternative
  - marker: b
    text: Заключительная фраза вновь называет пятые ворота. В геэзском тексте она сформулирована сжато и может подводить итог дальнейшему пути солнца после тридцати утр, не описывая отдельное дополнительное перемещение подробно.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ወይወፅእ፡ ፀሐይ
  choice: солнце выходит
  rationale: Глагол буквально обозначает выход; в данном астрономическом контексте речь идёт о появлении солнца на восходе. «Выходит» сохраняет образ движения через ворота, не заменяя его современным астрономическим термином.
- source_word: እምዘክቱ፡ ራብዕ፡ ኆኅት
  choice: из тех четвёртых ворот
  rationale: Указательное слово отсылает к уже названным воротам. Русское «ворота» естественно употребляется во множественном числе, хотя геэзское существительное имеет форму единственного числа.
- source_word: ወየዓርብ
  choice: и заходит
  rationale: В контексте суточного пути солнца глагол обозначает заход. Русское «заходит» естественно и сохраняет астрономический смысл.
- source_word: ወይገብእ
  choice: и возвращается
  rationale: Глагол ገብአ здесь передаёт возвращение солнца к восточным воротам после захода, а не просто вход внутрь; это согласуется с явно названным востоком.
- source_word: ውስተ፡ ኃምስ፡ ኆኅት፡ እንተ፡ ጽባሕ
  choice: в пятые ворота востока
  rationale: Сохранён важный направительный модификатор «востока». Конструкция «ворота востока» передаёт его прямо и не добавляет отсутствующего в тексте современного объяснения.
- source_word: ሠላሳ፡ ጽባሐ
  choice: тридцати утр
  rationale: Источник считает период «утрами», что характерно для этого раздела; перевод «дней» был бы более гладким, но менее точным.
- source_word: እምኔሃ
  choice: из них
  rationale: Местоимение отсылает к воротам. Из-за грамматически множественного русского слова «ворота» требуется форма «из них».
- source_word: ኃምስት፡ ኆኅት
  choice: пятые ворота
  rationale: Повторён тот же устойчивый образ ворот; не добавлено слово «западные», которого в этой заключительной фразе нет.
theological_decisions:
- issue: Передача космологического образа движения солнца через ворота
  choice: Сохранить ворота, выход, возвращение и заход солнца
  alternative: Заменить ворота современными понятиями вроде «сектор», «положение» или «точка горизонта»
  rationale: Текст излагает собственную апокалиптическую картину мироздания. Перевод не должен демифологизировать её или согласовывать с современной астрономией.
- issue: Соотношение восточных пятых ворот и неназванных по направлению пятых ворот в конце
  choice: Указать восток только там, где он назван в геэзском тексте
  alternative: Пояснить последние пятые ворота как западные
  rationale: Контекст может подразумевать западные ворота захода, однако источник в заключительной фразе этого прямо не говорит; добавление сняло бы присущую тексту краткость.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксический параллелизм и повтор слова «ворота» сохранены намеренно; архаизмы и научная модернизация образов исключены.
