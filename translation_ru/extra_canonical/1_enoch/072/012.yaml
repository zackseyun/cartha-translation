base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/012.yaml
  text: And at that time the day grows longer by two parts[a], and the day becomes eleven parts[b], and the night grows shorter and becomes seven parts.
translation:
  language: ru
  text: И тогда день удлиняется на две части[a] и становится равным одиннадцати частям, а ночь укорачивается и становится равной семи частям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «две» в данном эфиопском свидетеле отмечено как неуверенное чтение. Последовательность числовых данных подразумевает, что день удлиняется на две части и достигает одиннадцати частей.
    reason: textual_variant
lexical_decisions:
- source_word: ወእሜሃ
  choice: И тогда
  rationale: Естественно передаёт временной переход и последовательный характер астрономического описания.
- source_word: ይነኍኅ
  choice: удлиняется
  rationale: Глагол обозначает увеличение продолжительности; это согласуется с итоговой длительностью дня в одиннадцать частей и сокращением ночи.
- source_word: ዕለት
  choice: день
  rationale: В данном контексте имеется в виду светлая часть суток, противопоставленная ночи; краткое «день» сохраняет формулу оригинала.
- source_word: †ክልኤ†
  choice: на две части
  rationale: Числительное в свидетеле отмечено как неуверенное чтение; единица измерения подразумевается контекстом и выражена по-русски для ясности.
- source_word: ክፍለ
  choice: частям
  rationale: «Часть» сохраняет техническую систему деления продолжительности дня и ночи в этой главе.
- source_word: ወትከውን
  choice: и становится равным
  rationale: Передаёт повторяющуюся формулу достижения измеренной продолжительности и согласуется с нормами современного русского языка.
- source_word: ዓሠርተ ወአሐደ
  choice: одиннадцати
  rationale: Составное числительное оригинала передано обычной русской формой.
- source_word: ወተሐጽር ሌሊት
  choice: а ночь укорачивается
  rationale: Передаёт явное сокращение ночи; союз «а» естественно подчёркивает противопоставление дню.
- source_word: ሰብዓተ ክፍለ
  choice: семи частям
  rationale: Сохраняет указанную в источнике измеренную продолжительность ночи.
