    issue: Не вполне естественное размещение обстоятельства длительности
    rationale: Фраза «восходит через третьи ворота тридцать одно утро» может восприниматься как тяжеловесная. «В течение тридцати одного утра восходит через третьи ворота» яснее обозначает, что это длительность данного порядка восходов.
  - severity: low
    issue: Указательное слово «тех»
    rationale: В русском «тех ворот» может создавать оттенок пространственной или дискурсивной удалённости, которого здесь не требуется. «Этих ворот» естественно отсылает к рассматриваемым в контексте небесным воротам.
