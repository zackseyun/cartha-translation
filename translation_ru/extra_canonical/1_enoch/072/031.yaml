base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/031.yaml
  text: And on that day the sun goes out from that gate and sets in the west[a], and returns to the east and rises through the third gate for thirty-one mornings[b], and sets in the west of heaven.
translation:
  language: ru
  text: В тот день солнце выходит из этих ворот и заходит на западе, затем возвращается на восток[a], в течение тридцати одного утра восходит через третьи ворота[b] и заходит на западе неба.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол, переведённый как «возвращается», может также означать «входит». Здесь «возвращается» соответствует описанию кругового движения солнца обратно на восток перед следующим восходом.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тридцать одно утро». Период исчисляется последовательными утрами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወፅእ
  choice: выходит
  rationale: Передаёт конкретный образ выхода солнца из небесных ворот без архаизации.
- source_word: ኆኅት
  choice: ворота
  rationale: Сохраняет архитектурно-космический образ постоянных отверстий небес, характерный для Астрономической книги.
- source_word: የዓርብ
  choice: заходит
  rationale: В контексте суточного движения солнца глагол естественно обозначает заход.
- source_word: ይገብእ
  choice: возвращается
  rationale: Основное значение допускает «входит», однако последовательность движения после захода позволяет понять глагол как возвращение на восток; неоднозначность отмечена в сноске.
- source_word: በምስራቅ
  choice: на восток
  rationale: Направительное прочтение естественно сочетается с возвращением солнца к месту следующего восхода.
- source_word: ይሠርቅ
  choice: восходит
  rationale: Обычный русский астрономический эквивалент глагола применительно к солнцу.
- source_word: በሣልስት ኆኅት
  choice: через третьи ворота
  rationale: Предлог передаёт прохождение светила через определённое небесное отверстие.
- source_word: ሠላሳ ወአሐደ ጸባሐ
  choice: тридцать одно утро
  rationale: Сохраняет буквальный способ счёта по последовательным утрам, не заменяя его пояснительным «днём».
- source_word: ምዕራብ ሰማይ
  choice: западе неба
  rationale: Сохраняет конкретную космологическую пространственность исходного текста.
theological_decisions:
- issue: Архитектурный образ устройства небес
  choice: Сохранены выражения «ворота» и «запад неба» как буквальные образы визионерской астрономии.
  alternative: Передать современнее как «горизонт» или «западная часть небосвода».
  rationale: Текст изображает небеса как упорядоченное пространство с воротами; перевод не должен сглаживать эту космологическую картину.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но ясным повествованием. Синтаксический параллелизм и повтор глагола «заходит» сохранены как черты исходного описания.
