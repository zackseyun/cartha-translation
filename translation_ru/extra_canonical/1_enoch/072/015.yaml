  yaml_path: translation/extra_canonical/1_enoch/072/015.yaml
  text: And the sun rises so that the day grows shorter and the night lengthens[a], and the sun returns to the east and enters into the sixth gate[c][b], and rises from it and sets for thirty mornings.
translation:
  language: ru
  text: И солнце восходит, так что день становится короче, а ночь — длиннее. Солнце возвращается на восток, входит в шестые врата[a], восходит из них и в течение тридцати утр заходит[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Врата принадлежат космической схеме Астрономической книги и в мире видения представлены как реальные небесные врата.
    reason: cultural_note
  - marker: b
    text: Последняя фраза в данном текстовом свидетельстве не вполне ясна. «Тридцать утр», вероятно, означает тридцатидневный отрезок пути солнца через эти врата.
    reason: textual_variant
lexical_decisions:
- source_word: ይትነሣእ
  choice: восходит
  rationale: Глагол обозначает восход или подъём солнца; «восходит» естественно для современного русского астрономического повествования.
- source_word: ትሕጽር ዕለት
  choice: день становится короче
  rationale: Передаёт сезонное сокращение продолжительности дня ясно и без дополнительного толкования.
- source_word: ትኑኅ ሌሊት
  choice: ночь — длиннее
  rationale: Сохраняет параллельный контраст с укорачиванием дня и естественно звучит по-русски.
- source_word: ይገብእ ፀሐይ በጽባሕ
  choice: солнце возвращается на восток
  rationale: ይገብእ здесь означает возвращение, а выражение с ጽባሕ в пространственной космологии главы указывает на восток, сторону восхода.
- source_word: ይበውእ ውስተ ሳድስት ኆኅት
  choice: входит в шестые врата
  rationale: Отдельный глагол ይበውእ передаёт вхождение; «врата» сохраняют конкретный образ небесной схемы Астрономической книги.
- source_word: ይሠርቅ እምኔሃ
  choice: восходит из них
  rationale: Передаёт появление солнца из названных врат; местоимение согласовано с русским множественным существительным «врата».
- source_word: የዓርብ ሠላሳ ጽባሐ
  choice: заходит так тридцать утр
  rationale: Сохраняет буквальную единицу счёта «утра» и вероятное значение захода солнца, не превращая неясную конструкцию в однозначное «тридцать дней».
theological_decisions:
- issue: Статус небесных врат
  choice: Сохранён буквальный образ «врат» в мире видения
  alternative: Истолковать врата как метафору времён года или участков горизонта
  rationale: Исходный текст описывает конкретную космическую схему; перевод не должен заменять её позднейшим объяснением.
