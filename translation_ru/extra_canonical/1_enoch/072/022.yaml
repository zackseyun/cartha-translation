base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/022.yaml
  text: And on that day the night exceeds the day[a], and the night increases from night to night, and the day grows shorter from day to day, until thirty mornings, and the night becomes exactly ten parts[e][d][c][b], and the day eight parts.
translation:
  language: ru
  text: И в тот день ночь становится длиннее дня; ночь удлиняется от ночи к ночи, а день убывает день ото дня — вплоть до тридцати утр[a]; и ночь составляет ровно десять частей, а день — восемь частей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до тридцати утр». Возможно, имеются в виду тридцать последовательных утр (или рассветов) сезонного цикла.'
    reason: cultural_note
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: в тот день
  rationale: Естественная русская передача временной формулы, сохраняющая последовательность астрономического описания.
- source_word: ትነሡኅ ሌሊት እምዕለት
  choice: ночь становится длиннее дня
  rationale: В данном контексте глагол обозначает увеличение продолжительности, а እም вводит сравнение; эта формулировка яснее буквального «ночь превышает день».
- source_word: ወሌሊት እምሌሊት ትነሡኅ
  choice: ночь прибывает от ночи к ночи
  rationale: Повтор существительного с እም выражает последовательное увеличение от одной ночи к другой; «прибывает» сохраняет образ нарастания длительности.
- source_word: ወተሐጽር ዕለት እምዕለት
  choice: а день убывает день ото дня
  rationale: Передаёт как сокращение дня, так и распределительно-последовательное значение повторённого существительного.
- source_word: እስከ ሠላሳ ጸባሕ
  choice: вплоть до тридцати утр
  rationale: Сохраняет буквальный счёт по утрам или рассветам и не подменяет его современным календарным пояснением.
- source_word: ዐሠርተ ክፍለ ጥንቁቀ
  choice: ровно десять частей
  rationale: Технический термин ክፍለ передан как «частей», а ጥንቁቀ — как наречное указание на точность меры.
- source_word: ስመንተ ክፍለ
  choice: восемь частей
  rationale: Сохраняет ту же схематическую единицу измерения, что и для ночи.
theological_decisions:
- issue: Астрономическая схема измерения дня и ночи
  choice: Сохранить «части» без пересчёта в часы.
  alternative: 'Передать как десять и восемь часов либо обобщить: «ночь удлиняется, а день сокращается».'
  rationale: Текст описывает собственную космологическую систему мер. Пересчёт в современные часы или обобщение устранили бы важную особенность источника и придали бы ему чуждую точность.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего астрономического наставления. Параллелизм «от ночи к ночи / день ото дня» сохранён, но синтаксис сделан естественным. Подлинная неопределённость выражения о тридцати утрах вынесена в примечание.
