base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/016.yaml
  text: And when thirty mornings are completed[a], the day decreases by exactly one part, and the day becomes eleven parts[c][b], and the night seven.
translation:
  language: ru
  text: По завершении тридцати утр[a] день уменьшается ровно на одну часть, и день становится равным одиннадцати частям[c], а ночь — семи[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тридцать утр». В этом разделе такое выражение служит для отсчёта календарного промежутка.'
    reason: lexical_alternative
  - marker: b
    text: 'В этой главе продолжительность дня и ночи неоднократно измеряется «частями»: здесь светлое время составляет одиннадцать частей, а ночь — семь.'
    reason: cultural_note
  - marker: c
    text: 'Буквально порядок слов можно передать так: «…и будет день — одиннадцать частей, а ночь — семь».'
    reason: previous_rendering
lexical_decisions:
- source_word: ተፈጸመ
  choice: завершатся
  rationale: Глагол обозначает завершение отсчитываемого периода; форма «завершатся» сохраняет смысл исполнения полного счёта и естественно сочетается с «тридцать утр».
- source_word: ሠላሳ ጽባሕ
  choice: тридцать утр
  rationale: В геэз прямо сказано «утр», а не обобщённо «дней»; конкретный образ сохранён, хотя в контексте это календарный отсчёт.
- source_word: ተሐፅፅ ማዓልት
  choice: день убавляется
  rationale: Выражение описывает количественное сокращение светлого времени суток. «Убавляется» передаёт схематический характер астрономического расчёта.
- source_word: ክፍለ አሐደ ጥንቁቀ
  choice: ровно на одну часть
  rationale: Переданы как единица уменьшения, так и наречие точности ጥንቁቀ, существенное для строгого календарного счёта.
- source_word: ወትከውን
  choice: и … составляет
  rationale: Глагол вводит получившееся количественное состояние. Русское «составляет» естественно при числовом соотношении и не меняет переходного смысла контекста.
- source_word: ዕለት ዓሠርተ ወአሐደ ክፍለ
  choice: день составляет одиннадцать частей
  rationale: «День» сохранён как явно названный субъект, а число частей передано без синтаксического переноса к иной конструкции.
- source_word: ወሌሊት ስብዓተ
  choice: а ночь — семь
  rationale: 'Эллипсис оригинала сохранён: слово «частей» подразумевается из предшествующей фразы.'
