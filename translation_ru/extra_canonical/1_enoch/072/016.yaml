  source_fidelity: Драфт верно передаёт «тридцать утр», точность уменьшения («ровно») и соотношение одиннадцати и семи частей. Однако «день составляет» описывает статическое соотношение и недостаточно передаёт глагол ወትከውን («становится», результат изменения). Начальное «когда завершатся тридцать утр» грамматически возможно, но будущее время менее точно для формулы о завершившемся отсчитываемом интервале.
  naturalness: Предлагаемая редакция сохраняет сжатый, технический характер календарного описания и звучит естественно на современном литературном русском. «По завершении тридцати утр» устраняет неуместную будущую перспективу; «становится равным одиннадцати частям» ясно выражает результирующее состояние.
  terminology: Термин «части» и намеренно конкретное «утра» сохранены. Эллипсис в «ночь — семи» сохраняет подразумеваемое «частям» и согласуется с конструкцией «равным ... частям».
