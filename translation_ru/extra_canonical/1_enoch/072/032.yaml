base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/032.yaml
  text: On that day the night decreases and becomes nine parts[a], and the day becomes nine parts, and the night equals the day[b], and the year becomes exact.
translation:
  language: ru
  text: В тот день ночь убывает и составляет девять частей[a], и день составляет девять частей; ночь становится равной дню, и год становится выверенным[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Повторение выражения «девять частей» отражает принятую в книге схему, согласно которой день и ночь делятся на исчисляемые доли.
    reason: cultural_note
  - marker: b
    text: 'Возможные переводы: «год становится точным», «год становится выверенным» или «год достигает завершённости»; эфиопское слово допускает оттенки точности, правильности и завершения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: В тот день
  rationale: Естественная русская передача временного указания, относящего сказанное к определённому моменту солнечного цикла.
- source_word: ትኃፅፅ ሌሊት
  choice: ночь убывает
  rationale: Глагол обозначает уменьшение; «убывает» естественно звучит при описании продолжительности ночи и сохраняет измерительный характер высказывания.
- source_word: ትስዓተ ክፍለ
  choice: девять частей
  rationale: В астрономической системе книги день и ночь делятся на исчисляемые части; буквальная передача ясна и не подменяет древнюю схему современными часами.
- source_word: ይትዓረይ ሌሊት ምስለ ማዓልት
  choice: ночь сравнивается с днём
  rationale: Передаёт наступление равенства ночи и дня, сохраняя динамический оттенок формы, а не только констатируя статическое равенство.
- source_word: ዓመት ጥንቅቀ
  choice: год обретает точную меру
  rationale: Естественная по-русски формулировка для календарного контекста, сохраняющая значение точности или правильной завершённости без излишне буквального и неясного «год становится точным».
theological_decisions:
- issue: Календарное высказывание о равенстве ночи и дня
  choice: Передать как техническое астрономическое описание соотношения частей дня и ночи.
  alternative: Истолковать «точную меру» года как утверждение о богословском совершенстве мироздания.
  rationale: Ближайший контекст Книги светил посвящён астрономическим и календарным расчётам; символическое или конфессиональное толкование здесь не требуется.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего астрономического изложения. Терминология остаётся понятной неспециалисту; древняя система «частей» не модернизируется в часы. Точка с запятой подчёркивает переход от двух девятичастных величин к их равенству и календарному итогу.
