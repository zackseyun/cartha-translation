base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/003.yaml
  text: And I saw six portals from which the sun rises[a], and six portals where the sun sets, and the moon rises and sets in those portals. And the leaders of the stars, together with those whom they lead, are six in the east and six in the west; and all of them, one after another, in exact order[c][b], with many windows to the right and to the left of those portals.
translation:
  language: ru
  text: 'И увидел я шесть врат, из которых восходит солнце, и шесть врат, где солнце заходит; и луна восходит и заходит в этих вратах. И увидел я предводителей звёзд вместе с теми, кого они ведут: шесть на востоке и шесть на западе; все они следуют один за другим в строгом порядке[a], а справа и слева от тех врат находится множество окон[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «правильно», «по установленному порядку».'
    reason: lexical_alternative
  - marker: b
    text: Заключительная часть стиха трудна для истолкования. Вероятно, речь идёт о множестве боковых проёмов по обе стороны от главных врат.
    reason: textual_difficulty
lexical_decisions:
- source_word: ወርኢኩ
  choice: И увидел я
  rationale: Сохраняет форму рассказа от первого лица и торжественный, но понятный современный строй речи.
- source_word: ኃዋኅወ
  choice: врата
  rationale: В астрономическом видении это космические проёмы горизонта; «врата» передаёт образ и отличается от обозначенных далее боковых «окон».
- source_word: እለ ኀበ ይወፅእ ፀሐይ
  choice: из которых восходит солнце
  rationale: Естественно передаёт выход светила через врата без утраты пространственного образа.
- source_word: እለ ኀበ የዓርብ ፀሐይ
  choice: где солнце заходит
  rationale: 'Следует синтаксическому членению текста: подлежащим при первом глаголе захода является солнце.'
- source_word: ወወርኅ በውእቶን ኃዋኅወ ይሠርቅ ወየዓርብ
  choice: а луна восходит и заходит в этих вратах
  rationale: Передаёт отдельную клаузу о луне и не объединяет её ошибочно с солнцем как подлежащее предыдущего глагола.
- source_word: መራኄሆሙ ለከዋክብት
  choice: предводителей звёзд
  rationale: Сохраняет идею руководства, не добавляя отсутствующего здесь прямого наименования ангелов.
- source_word: ምስለ እለ ይመርኅዎሙ
  choice: вместе с теми, кого они ведут
  rationale: Сохраняет отношение между ведущими и ведомыми, не уточняя природу последних.
- source_word: ፮በጽባሕ ወ፮በምዕራብ
  choice: шесть на востоке и шесть на западе
  rationale: Ясно передаёт симметричное пространственное устройство.
- source_word: ኵሎሙ ፩፩እምድኅረ ካልኡ
  choice: все они следуют один за другим
  rationale: Естественно выражает последовательность, заложенную в эфиопской формуле.
- source_word: ርቱዕ
  choice: в строгом порядке
  rationale: В данном астрономическом контексте слово указывает на правильность и упорядоченность движения или расположения.
- source_word: መላክወ ብዙኃት
  choice: множество окон
  rationale: Фраза трудна, но, вероятно, обозначает многочисленные боковые проёмы, отличные от главных врат; неопределённость отмечена в сноске.
- source_word: እምየማኑ ወእምፀጋሙ ለዝኩ ኃዋኅወ
  choice: справа и слева от тех врат
  rationale: Передаёт боковое расположение проёмов относительно главных врат.
theological_decisions:
- issue: Следует ли прямо назвать предводителей звёзд ангелами
  choice: предводители звёзд
  alternative: ангелы, предводители звёзд
  rationale: Текст допускает ангельское понимание в контексте книги, но в самом выражении не называет этих предводителей ангелами; нейтральный перевод сохраняет богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Использовано «врата» как устойчивый образ космических проходов; архаические синтаксические формы сведены к минимуму. Все сноски отмечены в основном тексте.
