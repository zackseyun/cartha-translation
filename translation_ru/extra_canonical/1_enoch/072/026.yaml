  yaml_path: translation/extra_canonical/1_enoch/072/026.yaml
  text: And on that day the night increases and becomes nine parts[a], and the night becomes twelve parts and two parts exactly[d][c][b], and the day six parts.
translation:
  language: ru
  text: И в тот день ночь убывает и составляет девять частей[a]; ночь же составляет двенадцать частей и ещё две части — в точности[b], а день — шесть частей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Числовая формулировка этого стиха в эфиопском тексте трудна: синтаксис и арифметика выглядят неровно. Здесь сохранено переданное текстом схематическое исчисление дня и ночи без исправления по соседним стихам.'
    reason: textual_variant
  - marker: b
    text: 'Или: «точно», «в точной мере».'
    reason: lexical_alternative
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: в тот день
  rationale: Сохраняет указательное значение и повторяющуюся формулу астрономического изложения.
- source_word: ትነሡኅ፡ ሌሊት
  choice: ночь убывает
  rationale: Глагол выражает уменьшение; перевод следует данному чтению геэзского текста, а не исправляет его по предполагаемому контексту.
- source_word: ፵ዕበታ፡ ለማዓልት
  choice: составляет девять частей
  rationale: Передаёт традиционно распознанное числовое чтение и техническое деление времени на части, не добавляя спорного «дня» после «частей».
- source_word: ፲ወ፪ተ፡ ወ፪እቲ
  choice: двенадцать частей и ещё две части
  rationale: Сохраняет раздельную аддитивную числовую формулировку источника вместо сведения её к четырнадцати.
- source_word: ክፍለ፡ ጥንቅቀ
  choice: части — в точности
  rationale: ጥንቅቀ здесь имеет наречное значение точности; формулировка сохраняет его связь с измерением.
- source_word: ወማዓልት፡ ስድስተ፡ ክፍለ
  choice: а день — шесть частей
  rationale: Естественно передаёт краткую эллиптическую именную конструкцию оригинала.
theological_decisions:
- issue: Следует ли согласовать трудную арифметику стиха с соседним астрономическим контекстом
  choice: Сохранить переданную рукописью неровную последовательность чисел и отметить трудность
  alternative: Исправить числа или свести выражение «двенадцать и две» к гармонизированной схеме
  rationale: Это текстологическая, а не догматическая трудность; открытое сохранение свидетельства источника не скрывает неопределённость от читателя.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; сохранён лаконичный, почти табличный характер астрономического описания. Тире обозначают естественную для русского языка эллиптическую связку, не устраняя трудность исходной числовой последовательности.
