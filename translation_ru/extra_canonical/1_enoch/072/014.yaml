  text: On that day the day becomes longer than the night[a], and the day becomes twice the night, and the day becomes twelve parts[b], and the night grows shorter and becomes six parts.
translation:
  language: ru
  text: В тот день день становится длиннее ночи, и день становится вдвое длиннее ночи[a], и день составляет двенадцать частей, а ночь укорачивается и составляет шесть частей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В используемой транскрипции здесь стоит ፱ዕበተ, что можно ошибочно принять за выражение с числом «девять». Вероятнее исходное чтение — ዕፅበተ, «вдвое»: знак ፅ легко спутать с цифрой ፱. Это подтверждается указанным далее соотношением двенадцати частей дня к шести частям ночи.'
    reason: textual_note
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: В тот день
  rationale: Естественная русская передача временной формулы, сохраняющая последовательность астрономического описания.
- source_word: ትነውኅ፡ ዕለት፡ እምሌሊት
  choice: день становится длиннее ночи
