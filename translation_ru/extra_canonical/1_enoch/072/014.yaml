- source_word: ዕፅበተ፡ ሌሊት
  choice: вдвое длиннее ночи
  rationale: Исправленное чтение ዕፅበተ означает удвоение; оно согласуется с последующим соотношением двенадцати частей дня и шести частей ночи.
- source_word: ክፍለ፡ ፲ወ፪
  choice: двенадцать частей
  rationale: Сохраняется техническая система деления дня и ночи на части, характерная для этой главы.
- source_word: ትኃጽር፡ ሌሊት
  choice: ночь укорачивается
  rationale: Передаёт наблюдаемый процесс и образует смысловую параллель с удлинением дня.
- source_word: ስድስተ፡ ክፍል
  choice: шесть частей
  rationale: Прямая передача числовой меры ночи в схематической системе главы.
theological_decisions:
- issue: Следует ли сгладить повторяющиеся формулы в современное астрономическое изложение
  choice: Сохранить повторение слов «день» и «составляет»
  alternative: 'Сжать стих до формулы: «день длится двенадцать частей, а ночь — шесть»'
  rationale: Повторность принадлежит схематическому языку Астрономической книги и не должна устраняться ради стилистической гладкости.
