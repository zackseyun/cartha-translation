base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/029.yaml
  text: And the sun returns and enters the second gate[a], which is in the east; and it returns to that principal course for thirty mornings[c][b], rising and setting.
translation:
  language: ru
  text: И солнце возвращается и входит во вторые врата[a], находящиеся на востоке; и в течение тридцати утр возвращается к этому главному пути[b], восходя и заходя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в другие врата». В последовательности врат это слово, вероятнее всего, означает «вторые».'
    reason: lexical_alternative
  - marker: b
    text: Выражение в эфиопском тексте необычно и допускает буквальное понимание «возвращается на тот свой главный [ход]»; слово «путь» передаёт подразумеваемый ход солнца.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ገብአ
  choice: возвращается
  rationale: Основное значение глагола здесь — «возвращаться»; восход солнца далее прямо обозначен глаголом ይሠርቅ.
- source_word: ቦአ ውስተ
  choice: входит во
  rationale: Сочетание выражает движение внутрь и сохраняет образ небесных врат.
- source_word: ካልእ ኆኅት
  choice: вторые врата
  rationale: В последовательности восточных врат ካልእ естественно означает «вторые», хотя возможно и более общее «другие».
- source_word: እንተ በምሥራቅ
  choice: находящиеся на востоке
  rationale: Относительный оборот определяет местонахождение врат; согласование во множественном числе обусловлено русским словом «врата».
- source_word: ይገብእ ዲበ ዝኩ አርእስቲሁ
  choice: возвращается к тому своему главному пути
  rationale: Сохраняются повтор глагола «возвращаться», указательное значение ዝኩ и смысл главного или основного хода; предлог «к» дает естественное русское управление.
- source_word: ሠላሳ ጸባሐ
  choice: на тридцать утр
  rationale: ጸባሐ означает «утро, рассвет», а выражение обозначает продолжительность календарного периода.
- source_word: ይሠርቅ ወየዓርብ
  choice: восходя и заходя
  rationale: Сохраняется симметричная пара глаголов, обозначающих восход и заход солнца.
