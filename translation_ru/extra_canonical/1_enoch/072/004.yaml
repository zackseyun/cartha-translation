base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/004.yaml
  text: And first a great light comes forth[a], whose name is the sun, and its disk is like the disk of heaven[c][b], and it is wholly full of fire that gives light and heat.
translation:
  language: ru
  text: И сначала выходит великий свет[c], имя которому — солнце; круг его[a] — как круг неба, и оно всё полно огня, который светит и согревает[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «диск его», «сфера его» либо «окружность его»; эфиопское слово может обозначать круглую форму или круговое движение. Здесь сохранено слово «круг», поскольку оно также повторяется в последующем сравнении.'
    reason: lexical_alternative
  - marker: b
    text: 'Последние два глагола можно также перевести: «сияет и жжёт» или «даёт свет и тепло».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «И первый выходит как великий свет». Однако вероятнее, что «великий свет» здесь является подлежащим, а первое слово указывает на последовательность.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: ቀዳማዊ
  choice: сначала
  rationale: В данном синтаксическом окружении передаёт последовательность появления светил и позволяет сохранить «великий свет» в роли подлежащего.
- source_word: ይወፅእ
  choice: выходит
  rationale: Передаёт движение появления светила, не уточняя его как астрономический восход.
- source_word: ብርሃን ዓቢይ
  choice: великий свет
  rationale: Прямо сохраняет космический образ и усилительное определение оригинала.
- source_word: ዘስሙ ፀሐይ
  choice: имя которому — солнце
  rationale: Сохраняет характерную для видения формулу именования, не усиливая олицетворение.
- source_word: ክበቡ
  choice: круг его
  rationale: Слово обозначает круглую форму, окружность или круговое движение; «круг» сохраняет широту значения и повтор корня в сравнении.
- source_word: ከመ ክበበ ሰማይ
  choice: как круг неба
  rationale: Сохраняет необычный космический образ и лексический повтор, не заменяя его более современным научным описанием.
- source_word: ኵሉ ምሉእ
  choice: весь он полон
  rationale: Передаёт усиленное выражение полноты естественным русским оборотом.
- source_word: እሳት
  choice: огонь
  rationale: Сохраняет прямой элементарный образ оригинала.
- source_word: ዘያበርህ ወያውዒ
  choice: который светит и согревает
  rationale: Естественно передаёт два действия огня — излучение света и тепла, сохраняя их параллелизм.
theological_decisions:
- issue: Характер описания солнца
  choice: Солнце представлено как великий огненный свет в образном космологическом описании.
  alternative: Формулу именования можно понять как более выраженное олицетворение солнца.
  rationale: Текст использует яркую апокалиптическую образность, но не требует считать солнце божеством; перевод не мифологизирует и не рационализирует этот образ.
