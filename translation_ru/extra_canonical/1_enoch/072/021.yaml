base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/021.yaml
  text: And the sun comes out from that gate[a], and sets in the west, and returns to the east, and comes out from the third gate for thirty mornings[c][b], and sets in the west at the third gate.
translation:
  language: ru
  text: И солнце выходит из тех ворот, заходит на западе, возвращается на восток, выходит из третьих ворот в течение тридцати утр[a] и заходит на западе у третьих ворот.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тридцать утр».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይወፅእ
  choice: и … выходит
  rationale: Глагол обозначает выход или появление наружу; повтор сохраняется, поскольку он подчёркивает последовательность движения солнца.
- source_word: ፀሐይ
  choice: солнце
  rationale: Прямое обозначение небесного светила без дополнительной персонификации.
- source_word: እምይእቲ ኆኅት
  choice: из тех ворот
  rationale: ኆኅት означает ворота или дверь; в космологии Астрономической книги речь идёт о воротах, через которые проходит солнце. Указательное слово отсылает к ранее названным воротам.
- source_word: ያዓርብ በምዕራብ
  choice: заходит на западе
  rationale: В контексте движения солнца естественный русский эквивалент — «заходит»; пространственное указание передано как «на западе».
- source_word: ወይገብእ በጽባሕ
  choice: возвращается на восток
  rationale: Глагол допускает значения входа и возвращения, а ጽባሕ может обозначать восток как место утра. Параллель с западом и циклический путь солнца поддерживают пространственное прочтение.
- source_word: በሣልስት ኆኅት
  choice: из третьих ворот / у третьих ворот
  rationale: 'Предлог передан в соответствии с глаголами: солнце выходит «из» ворот и заходит «у» ворот. Множественное «ворота» требует формы «третьих».'
- source_word: ሠላሳ ጸባሐ
  choice: в течение тридцати утр
  rationale: Буквально текст считает «тридцать утр». Формулировка сохраняет специфический способ отсчёта и при этом звучит по-русски ясно.
theological_decisions:
- issue: Космологическое обозначение ኆኅት в Астрономической книге
  choice: ворота
  alternative: окно
  rationale: В эфиопском тексте употреблено слово со значением «ворота/дверь», отличное от обозначения окна; «ворота» сохраняют конкретную апокалиптическую архитектуру небес.
- issue: Пространственное или временное значение ጽባሕ
  choice: восток
  alternative: утро
  rationale: Сочетание с возвращением после захода на западе и пространственная симметрия фразы поддерживают значение «восток», хотя слово также может означать «утро».
translation_notes:
  register: Современный литературный русский язык с ясным, несколько возвышенным повествовательным тоном. Сохранены повтор глагола движения и конкретные детали древней космологической картины; синтаксис слегка сглажен без устранения смыслового напряжения.
