base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/006.yaml
  text: Thus it comes out in the first month through the great gate[b][a], which is the fourth of those six gates that are toward the sunrise.
translation:
  language: ru
  text: Так оно выходит в первый месяц через великие ворота — четвёртые из тех шести ворот, что обращены к восходу солнца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Заключительная фраза «из тех шести ворот, что обращены к восходу солнца» в предоставленном свидетельстве заключена в скобки; возможно, это пояснительное расширение или текстуально неустойчивое чтение. Вместе с тем она согласуется с повторяющимся в этой главе описанием шести восточных ворот.
    reason: textual_variant
lexical_decisions:
- source_word: ከመዝ
  choice: Так
  rationale: Передаёт вводное указание на образ или последовательность движения естественно и без излишней тяжеловесности.
- source_word: ይወፅእ
  choice: оно выходит
  rationale: Сохраняет конкретный образ выхода светила через ворота и не заменяет его толковательным «восходит».
- source_word: በወርኅ ቀዳማዊ
  choice: в первый месяц
  rationale: Прямое и естественное временное обозначение.
- source_word: በኆኅት ዓቢይ
  choice: через великие ворота
  rationale: Предлог «через» естественно выражает прохождение сквозь отверстие; «ворота» сохраняет устойчивый космологический образ главы.
- source_word: እንተ ይእቲ ራብዕት
  choice: четвёртые
  rationale: Согласование с русским множественным существительным «ворота» обозначает их место в нумерованном ряду.
- source_word: እልኩ ኃዋኅወ ፮
  choice: из тех шести ворот
  rationale: 'Передаёт партитивное отношение: названные ворота являются четвёртыми в совокупности шести.'
- source_word: እለ መንገለ ምሥራቀ ፀሐይ
  choice: что обращены к восходу солнца
  rationale: Передаёт ምሥራቀ ፀሐይ как «восход солнца» и естественно выражает восточную ориентацию ворот.
theological_decisions:
- issue: Космологический образ движения солнца через ворота
  choice: Сохранить буквальный образ выхода через нумерованные ворота.
  alternative: Передать как восход солнца в определённой части неба.
  rationale: Текст намеренно описывает движение светил посредством системы ворот; модернизация устранила бы характерную космологическую картину.
- issue: Текстуальная неуверенность заключительной фразы
  choice: Оставить фразу в основном тексте и отметить её свидетельскую неопределённость сноской.
  alternative: Исключить заключительную фразу или заключить её в редакционные скобки.
  rationale: Фраза содержится в предоставленном тексте и соответствует повторяющейся системе шести восточных ворот, однако скобки источника требуют явного уведомления читателя.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Местоимение «оно» сохраняет подразумеваемое светило без добавления отсутствующего в данном стихе существительного «солнце». Тире делает определительное пояснение естественным; форма «четвёртые» обусловлена pluralia tantum «ворота».
