base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/005.yaml
  text: And the chariots by which it ascends are driven by the wind[a], and the sun goes down from the sky and returns through the north in order to reach the east[e][d][c][b]; and it is led so that it may enter the gate and shine on the face of heaven.
translation:
  language: ru
  text: И колесницы, с помощью которых оно восходит, движет ветер[a]; солнце заходит с неба[b] и возвращается через север, чтобы достичь востока. Его направляют, чтобы оно вошло во врата и засияло на лице неба.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Трудное выражение можно понять и более буквально: «ветром восхождения» или «восходящим ветром».'
    reason: lexical_alternative
  - marker: b
    text: То же слово может означать также «небеса» или «небосвод».
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰረገላት
  choice: колесницы
  rationale: Сохраняет множественное число и характерный для апокалиптической космологии образ небесных колесниц.
- source_word: በኀበ የዓርግ ነፋስ ይነፍኅ
  choice: на которых оно восходит, движимы ветром
  rationale: Передаёт связь колесниц с восхождением солнца и сохраняет образ движения силой ветра; трудность сочетания отмечена в сноске.
- source_word: የዓርብ ፀሐይ
  choice: солнце заходит
  rationale: Естественно передаёт нисхождение солнца к западу в данном астрономическом контексте.
- source_word: እምሰማይ
  choice: с неба
  rationale: В описании видимого движения солнца современное русское «небо» естественнее, чем более отвлечённые варианты.
- source_word: ወይገብእ እንተ መስዕ
  choice: и возвращается через север
  rationale: Передаёт последовательность кругового пути солнца; направление через север соответствует контексту его возвращения на восток.
- source_word: ከመ ይሑር ምሥራቀ
  choice: чтобы достичь востока
  rationale: Ясно выражает цель движения, сохраняя восток как область назначения.
- source_word: ወይትመራኅ
  choice: его направляют
  rationale: 'Сохраняет пассивный смысл: путь солнца задаётся и направляется, а не совершается совершенно автономно.'
- source_word: ኆኅተ
  choice: во врата
  rationale: Передаёт единственный небесный вход как технический образ Астрономической книги; русское «врата» уместно в возвышенном космологическом описании.
- source_word: ወያበርህ በገጸ ሰማይ
  choice: и засияло на лице неба
  rationale: Сохраняет конкретный образ «лица неба» и буквально передаёт местное значение предлога.
theological_decisions:
- issue: Значение ሰማይ в астрономическом описании
  choice: «небо» в обоих случаях
  alternative: «небеса» или «небосвод»
  rationale: «Небо» охватывает как видимое небесное пространство, так и космологическую сферу, не навязывая разграничения, отсутствующего в исходном слове.
- issue: Пассивное направление движения солнца
  choice: «его направляют»
  alternative: «оно направляется» или «его ведут»
  rationale: Личная неопределённая конструкция сохраняет идею упорядоченного извне движения, не называя действующего лица и не вводя дополнительного богословского уточнения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной апокалиптической образностью. Синтаксис разделён точкой с запятой и точкой для ясности, при этом последовательность небесного пути сохранена. Местоимения среднего рода относятся к солнцу.
