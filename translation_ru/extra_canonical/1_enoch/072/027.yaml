base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/027.yaml
  text: And the sun completes its courses[a], and again it travels upon those courses; and it enters through that gate for thirty mornings[e][d][c][b], and in the west it sets opposite it.
translation:
  language: ru
  text: И солнце завершает свои пути и снова движется по этим путям; оно входит через эти врата тридцать утр[a], а на западе заходит напротив них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тридцать утр»; вероятно, имеется в виду тридцать дней, в течение которых солнце появляется через одни и те же врата.'
    reason: lexical_alternative
  - marker: b
    text: В предоставленной транскрипции здесь стоит искажённое чтение; текст издания читается как «напротив них», то есть напротив упомянутых врат.
    reason: textual_variant
lexical_decisions:
- source_word: ፈጸመ
  choice: завершает
  rationale: Хотя форма глагола перфектная, настоящее время естественно передаёт повторяющийся порядок движения солнца и согласуется с последующими имперфектными формами.
- source_word: አርእስቲሁ
  choice: свои пути
  rationale: Форма множественного числа буквально связана с «головами» или «главами»; в астрономическом контексте обозначает пути или участки движения солнца. «Пути» сохраняет множественное число и звучит естественно по-русски.
- source_word: ዳግመ የሐውር
  choice: снова движется
  rationale: Передаёт повторное, циклическое движение солнца без добавления современных астрономических представлений.
- source_word: ኆኅት
  choice: врата
  rationale: Сохраняет конкретный образ небесных врат, характерный для космологии Астрономической книги.
- source_word: ሠላሳ ጸባሐ
  choice: тридцать утр
  rationale: Буквально сохраняет счёт по утрам, хотя по смыслу речь, вероятно, идёт о тридцатидневном периоде.
- source_word: በምዕራብኒ
  choice: а на западе
  rationale: Частица передана присоединительным «а», а обстоятельство места — обычным русским выражением.
- source_word: በመንጸሩ የዓርብ
  choice: заходит напротив этих врат
  rationale: 'Следует исправленному чтению текста издания: солнце заходит на западе напротив тех врат, через которые оно входит.'
theological_decisions:
- issue: Образ движения солнца через небесные врата
  choice: Сохранить конкретные образы путей и врат
  alternative: Переложить описание в терминах современной астрономии
  rationale: Текст представляет собственную визионерскую космологию; её не следует осовременивать или сводить к отвлечённой схеме.
