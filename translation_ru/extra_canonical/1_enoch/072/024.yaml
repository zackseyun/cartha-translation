lexical_decisions:
- source_word: ወበይእቲ፡ ዕለት
  choice: И в тот день
  rationale: Естественная русская временная формула, сохраняющая указательное значение выражения.
- source_word: ትከውን
  choice: становится
  rationale: Передаёт несовершенный вид глагола и изменение соотношения дня и ночи в описываемом цикле; согласуется с повторяющейся формулой главы.
- source_word: ሌሊት
  choice: ночь
  rationale: Называет один из двух противопоставленных и измеряемых периодов суток.
- source_word: ዓሠርተ፡ ወአሐደ፡ ክፍለ፡
  choice: одиннадцатью частями
  rationale: Сохраняет буквальный счёт «десять и одна» и технический термин схемы деления времени.
- source_word: ወዕለት፡ ሰብዓተ፡ ክፍለ
  choice: а день — семью частями
  rationale: Союз «а» ясно выражает параллельное противопоставление ночи и дня; эллиптическая конструкция сохраняет лаконизм оригинала.
