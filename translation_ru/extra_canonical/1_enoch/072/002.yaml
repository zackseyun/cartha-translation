base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/002.yaml
  text: 'And this is the first law of the luminaries: the sun, a light, has its rising in the portals of heaven on the east, and its setting in the western portals of heaven.'
translation:
  language: ru
  text: 'И вот первый закон[a], касающийся светил: солнце — светило — восходит[c] во вратах неба на востоке[b] и заходит в западных вратах неба.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «установление», «правило». Здесь имеется в виду неизменный порядок, управляющий движением небесных тел.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «во (или через) врата небес со стороны рассвета ... во (или через) врата небес запада». Перевод передаёт эти выражения как указания на восток и запад.'
    reason: lexical_alternative
  - marker: c
    text: В предоставленной транскрипции стоит መባእ («входить»), однако это, по-видимому, ошибка распознавания вместо чтения со значением «его восход» в печатном тексте Чарльза; оно также образует параллель с «его заходом».
    reason: textual_variant
lexical_decisions:
- source_word: ትእዛዝ
  choice: закон
  rationale: В Астрономической книге слово обозначает установленный порядок движения небесных тел, а не разовое повеление.
- source_word: ቀዳማዊ
  choice: первый
  rationale: Слово вводит первый пункт в последовательности установлений.
- source_word: ብርሃናት
  choice: светила
  rationale: Обозначает небесные источники света и сохраняет возвышенный космологический регистр.
- source_word: ፀሐይ ብርሃን
  choice: солнце — светило
  rationale: Сохраняет приложение «солнце, свет», но передаёт его естественным русским названием небесного тела.
- source_word: መዋፅኢሁ (исправление ошибочно транскрибированного መባእ)
  choice: восходит
  rationale: По исправленному чтению речь идёт о восходе, параллельном последующему упоминанию захода; это соответствует и восточному направлению.
- source_word: ኃዋኅወ
  choice: врата
  rationale: Сохраняет образ устроенных небесных проходов и возвышенный апокалиптический стиль.
- source_word: መንገለ ጽባሕ
  choice: на востоке
  rationale: Буквально выражение связано со стороной рассвета; русский перевод ясно передаёт направление.
- source_word: ወምዕራቢሁ
  choice: и заходит
  rationale: Передаёт номинально сжатое указание на заход солнца и сохраняет параллелизм с восходом.
- source_word: ዘምዕራብ
  choice: западных
  rationale: Естественная русская форма, сохраняющая противопоставление восточных и западных врат.
theological_decisions:
- issue: Характер космического порядка
  choice: «закон» как установленный порядок творения
  alternative: «повеление», «установление», «правило»
  rationale: Контекст описывает постоянный строй движения светил, а не нравственную заповедь, обращённую к людям.
- issue: Направление движения солнца
  choice: восход на востоке и заход на западе
  alternative: буквальное следование ошибочной транскрипции መባእ как «входит»
  rationale: Исправленное чтение печатного текста и параллельная структура стиха требуют обычной космологической последовательности; ошибка транскрипции не должна переворачивать смысл.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной апокалиптической образностью. «Врата неба» сохранены как ключевой космологический образ; синтаксис сделан естественным для русского языка без устранения приложения «солнце — светило».
