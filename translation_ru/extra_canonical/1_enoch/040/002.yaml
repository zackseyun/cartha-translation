base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/040/002.yaml
  text: And on the four sides of the Lord of Spirits I saw four other faces[a], different from those who do not sleep. And I learned their names[c][b], for the angel who came with me made their names known to me and showed me all the hidden things.
translation:
  language: ru
  text: И по четырём сторонам Господа духов я увидел четыре иных лица[a], отличные от тех, кто не спит. Я узнал их имена, потому что ангел, пришедший со мной, открыл мне их имена и показал мне всё сокрытое[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «четыре иных лица». Здесь сохранён конкретный зрительный образ оригинала; речь идёт о небесных существах, имена которых затем становятся известны Еноху.'
    reason: lexical_clarification
  - marker: b
    text: 'Или: «все тайны»; это обычное для апокалиптического видения обозначение сокрытых небесных тайн, которые открываются провидцу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በአርባዕቱ ክነፊሁ ለእግዚአ መናፍስት
  choice: по четырём сторонам Господа духов
  rationale: ክነፍ буквально означает «крыло», но также обозначает край или сторону. В пространственном описании престола «по четырём сторонам» естественно передаёт смысл и не приписывает Господу духов крылья.
- source_word: አርባዕተ ገጸ ካልአ
  choice: четыре иных лица
  rationale: ገጽ имеет конкретное значение «лицо». Перевод сохраняет зрительный образ и не заменяет его более отвлечённым обозначением существ или присутствий.
- source_word: እምነ እለ ኢይነውሙ
  choice: отличных от тех, кто не спит
  rationale: Относительное выражение относится к ранее упомянутым существам; настоящее время передаёт их непрестанное бодрствование.
- source_word: አእመርኩ
  choice: я узнал
  rationale: Глагол означает обретение знания; контекст уточняет, что имена стали известны Еноху благодаря ангелу.
- source_word: ዘአይድዐኒ አስማቲሆሙ
  choice: открыл мне их имена
  rationale: Формулировка передаёт каузативный смысл — ангел сделал имена известными — и сохраняет достойный повествовательный регистр.
- source_word: ኵሎ ኅቡኣተ
  choice: всё сокрытое
  rationale: Субстантивированное выражение обозначает скрытые тайны, раскрываемые в видении. «Всё сокрытое» звучит естественно и не вводит лишней технической терминологии.
theological_decisions:
- issue: Передача титула እግዚአ መናፍስት
  choice: Господь духов
  alternative: Господь Духов / Господь этих духов
  rationale: Традиционная форма «Господь духов» сохраняет устойчивый енохический титул, не уточняя без основания, имеются ли в виду все духи или определённые небесные духи.
- issue: Образ четырёх сторон при Господе духов
  choice: по четырём сторонам Господа духов
  alternative: у четырёх крыльев Господа духов
  rationale: Пространственное значение слова ክነፍ соответствует сцене видения и избегает богословски нагруженного вывода о наличии крыльев у Господа духов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис остаётся ясным для широкого читателя; повтор слова «имена» сохранён вслед за оригиналом, поскольку он связывает обретение знания с откровением ангела.
