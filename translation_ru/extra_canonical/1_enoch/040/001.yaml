base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/040/001.yaml
  text: And after that I saw thousands of thousands and ten thousands of ten thousands[a], whose number and count were without end[e][d][c][b], standing before the Lord of Spirits.
translation:
  language: ru
  text: И после этого я увидел тысячи тысяч и десятки тысяч десятков тысяч — стоящих пред Господом духов, которым не было числа и счёта[a].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Первое из двух слов, переданных как «числа и счёта», не вполне надёжно распознано в доступной транскрипции эфиопского текста. Общий смысл выражения — неисчислимое множество.
    reason: textual_variant
  - marker: b
    text: Ср. Дан. 7:10, где перед Божьим престолом также предстоит неисчислимое множество служащих.
    reason: cross_reference
lexical_decisions:
- source_word: ወርኢኩ
  choice: И … я увидел
  rationale: Форма совершенного вида 1-го лица единственного числа от корня «видеть» с соединительным ወ-. Союз «И» сохраняет паратактический стиль видения.
- source_word: እምድኅረዝ
  choice: после этого
  rationale: Естественная русская передача идиомы со значением «после того/этого».
- source_word: አእላፍ / አእላፈ
  choice: тысячи тысяч
  rationale: Сохраняет повтор числительного и семитскую формулу, выражающую огромное множество.
- source_word: ትእልፊት / ትእልፊተ
  choice: десятки тысяч десятков тысяч
  rationale: Лексема обозначает десять тысяч; буквенная модель исходного текста сохранена без замены на менее прозрачное «мириады».
- source_word: '*ኍልቈ፡ ወኃሳበ፡ አልቦሙ'
  choice: не было числа и счёта тем
  rationale: Передаёт отрицательную конструкцию и оба близких понятия — «число» и «счёт»; местоименный суффикс выражен словом «тем». Неуверенность чтения первого слова отмечена сноской.
- source_word: ይቀውሙ
  choice: стоит
  rationale: Настоящее время по-русски естественно передаёт несовершенную форму и сохраняет торжественный образ небесного предстояния.
- source_word: ቅድመ
  choice: пред
  rationale: Краткая форма «пред» уместна в возвышенном контексте престола и остаётся понятной современному читателю.
- source_word: እግዚአ መናፍስት
  choice: Господом духов
  rationale: Сохраняет устойчивый божественный титул в Притчах Еноха; отсутствие артикля в языке геэз не требует добавления определённости в русском.
theological_decisions:
- issue: К кому относится титул «Господь духов»
  choice: 'Титул Бога: «Господь духов»'
  alternative: Обозначение некоего ангельского владыки духов
  rationale: В контексте Притчей Еноха это устойчивое именование Всевышнего, перед которым предстоит небесное множество; перевод не добавляет более поздней богословской терминологии.
- issue: Характер множества предстоящих
  choice: Сохранена гиперболическая числовая формула и утверждение неисчислимости
  alternative: Свести выражение к общему «бесчисленное множество»
  rationale: Буквенная числовая структура важна для апокалиптического образа и сохраняет связь с языком видений, не определяя точное число существ.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, апокалиптическим звучанием. Сохранены начальное «И», повтор числительных и форма «пред»; архаическая грамматика и малопонятная церковнославянская лексика не используются.
