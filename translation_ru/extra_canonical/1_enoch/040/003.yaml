translation:
  language: ru
  text: И я услышал голоса тех четырёх ликов[a], восхвалявших пред Господом славы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тех четырёх лиц». По контексту имеются в виду четыре небесные фигуры, явившиеся в видении.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «Господом великолепия».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሰማዕኩ
  choice: И я услышал
  rationale: Передаёт первое лицо и завершённое восприятие на слух, сохраняя повествовательную формулу видения.
- source_word: ቃሎሙ
  choice: голоса
  rationale: ቃል может означать голос, звук или слово; при совместном небесном славословии «голоса» естественно передаёт слышимую сторону видения.
- source_word: እልኩ ገጽ አርባዕቱ
  choice: тех четырёх ликов
  rationale: Буквальное значение ገጽ — «лицо, лик». «Лики» сохраняет апокалиптический образ и лексическую связь с предыдущим стихом, хотя по контексту речь идёт о четырёх небесных фигурах.
- source_word: እንዘ ይሴብሑ
  choice: восхвалявших
  rationale: Оборот выражает одновременное действие; причастная конструкция естественна по-русски и не добавляет содержания.
- source_word: ቅድመ
  choice: пред
  rationale: Передаёт значение «перед, в присутствии» и соответствует возвышенному, но понятному регистру.
- source_word: እግዚአ ስብሐት
  choice: Господом славы
  rationale: Естественная передача божественного титула; «слава» охватывает значение величия и сияющего великолепия.
theological_decisions:
- issue: Передавать ли ገጽ буквально как «лики» или контекстуально как «существа»
  choice: тех четырёх ликов
  alternative: тех четырёх существ
  rationale: В тексте стоит существительное «лик/лицо», анафорически отсылающее к предыдущему видению. Буквальная передача сохраняет необычный апокалиптический образ; сноска поясняет, что обозначены небесные фигуры, а не отделённые от тел лица.
- issue: Значение титула እግዚአ ስብሐት
  choice: Господь славы
  alternative: Господь великолепия
  rationale: «Господь славы» сохраняет традиционную библейскую ёмкость титула, не исключая оттенка сияния или великолепия.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Форма «пред» и слово «лики» поддерживают визионерский регистр; синтаксис остаётся ясным для современного читателя.
