  text: Голос первого благословляет Господа духов во веки веков[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «голос первого». Имеется в виду первый из четырёх присутствующих, названных выше; перевод «первый голос» возможен по смыслу сцены, но менее точно передаёт грамматическую форму эфиопского текста.'
    reason: grammar_and_context
lexical_decisions:
- source_word: ቃለ፡ ቀዳማዊ
  choice: голос первого
  rationale: Форма ቃለ находится в сопряжённом состоянии и означает «голос [кого-либо]»; ቀዳማዊ употреблено субстантивно — «первого». Такой перевод сохраняет грамматическую связь с первым из четырёх присутствующих, упомянутых в контексте, и не превращает выражение в «первый голос».
- source_word: ይባርኮ
  choice: благословляет
  rationale: Финитная глагольная форма передана настоящим временем, естественным для описания разворачивающегося видения.
- source_word: ለእግዚአ፡ መናፍስት
  choice: Господа духов
  rationale: Сохраняется устойчивый и богословски весомый божественный титул Первой книги Еноха без его истолковательного сужения.
- source_word: ለዓለመ፡ ዓለም
  choice: во веки веков
  rationale: Традиционная и естественная для возвышенного русского регистра формула сохраняет повторное усиление исходной идиомы и обозначает нескончаемую длительность.
theological_decisions:
- issue: Передача божественного титула ለእግዚአ፡ መናፍስት
  choice: Господа духов
  alternative: Владыку духов
  rationale: «Господь духов» сохраняет титульное употребление, возвышенный регистр и преемственность с библейской русской лексикой, не вводя дополнительного толкования.
- issue: Референт слова ቀዳማዊ
  choice: первого
  alternative: первый голос
  rationale: Сопряжённая форма ቃለ требует чтения «голос первого»; это сохраняет вероятную отсылку к первому из четырёх присутствующих в предыдущем стихе и не сглаживает синтаксис источника.
