base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/007.yaml
  text: And I saw the dwelling-place beneath the wings of the Lord of Spirits[a]; and all the righteous and the chosen shone before him like the light of fire, and their mouths were filled with blessing, and their lips praised the name of the Lord of Spirits. And righteousness does not fail before him[c][b], and uprightness does not fail before him.
translation:
  language: ru
  text: И я увидел обитель под крыльями Господа духов[a]. И все праведные и избранные сияли пред Ним, как свет огня; уста их были полны благословения, и губы их восхваляли имя Господа духов. И праведность не исчезает пред Ним[b], и правота не исчезает пред Ним[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Образ «под крыльями» сохранён буквально: он может выражать покров и близость к Господу духов.'
    reason: cultural_note
  - marker: b
    text: Повторённый в оригинале глагол может также означать «не погибает», «не проходит» или «не приходит к концу».
    reason: lexical_alternative
lexical_decisions:
- source_word: ማኅደረ
  choice: обитель
  rationale: Передаёт конкретное место пребывания в возвышенном, но понятном современному читателю регистре.
- source_word: መትሕተ አክናፈ
  choice: под крыльями
  rationale: Сохраняет буквальный пространственный образ покрова и близости, не заменяя его толкованием.
- source_word: እግዚአ መናፍስት
  choice: Господь духов
  rationale: Устойчиво и буквально передаёт повторяющийся в 1 Еноха титул.
- source_word: ጻድቃን ወኄሩያን
  choice: праведные и избранные
  rationale: Сохраняет две параллельные группы, обозначенные существительными, без слияния второго слова с определением первого.
- source_word: ይትሰሐዩ
  choice: сияли
  rationale: Естественно передаёт зрительный образ лучезарности.
- source_word: ከመ ብርሃነ እሳት
  choice: как свет огня
  rationale: Сохраняет необычное сравнение исходного текста, не сглаживая его до общего указания на яркость.
- source_word: አፉሆሙ ይመልእ በረከተ
  choice: уста их были полны благословения
  rationale: Сохраняет конкретное «благословение», а не подменяет его более общим «хвалой».
- source_word: ከናፍሪሆሙ ይሴብሑ
  choice: губы их восхваляли
  rationale: Передаёт поэтический параллелизм между устами и губами.
- source_word: ጽድቅ
  choice: праведность
  rationale: Подходит для абстрактного нравственного качества, пребывающего пред Богом.
- source_word: ወርትዕ
  choice: прямота
  rationale: Сохраняет образ нравственной прямоты и параллель с праведностью; не сводит значение без необходимости к «истине».
- source_word: ኢየኃልቅ
  choice: не иссякает / не исчезает
  rationale: Глагол выражает отсутствие конца, гибели или прекращения. Два близких русских соответствия позволяют избежать тяжеловесного дословного повтора, сохраняя общий смысл обеих параллельных клаузул.
theological_decisions:
- issue: Значение ኄሩያን в апокалиптическом контексте
  choice: избранные
  alternative: избранники
  rationale: «Избранные» естественно обозначает самостоятельную группу и сохраняет местную категорию текста без добавления поздней конфессиональной системы.
- issue: Смысл двух заключительных утверждений
  choice: праведность не иссякает… прямота не исчезает
  alternative: праведность не погибает… прямота не приходит к концу
  rationale: Перевод выражает непреходящее пребывание этих качеств пред Богом, но не сужает семантический диапазон повторённого глагола до одного оттенка.
- issue: Образ крыльев Господа духов
  choice: 'сохранить буквально: «под крыльями»'
  alternative: под защитой
  rationale: Буквальный образ сохраняет визионерскую символику и не превращает перевод в толкование.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Формы «пред Ним» и «уста» поддерживают достоинство визионерского текста, оставаясь понятными. Заглавная буква в местоимении — русская издательская норма благоговейного обозначения Бога, не меняющая смысла оригинала.
