base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/006.yaml
  text: And in that place my eyes saw the Chosen One of righteousness and of faith[a], and righteousness shall be in his days[c][b]; and the righteous and the chosen will be without number before him forever and ever.
translation:
  language: ru
  text: И в том месте глаза мои увидели Избранного праведности и веры[a], и праведность будет в дни его; и праведных и избранных пред ним будет без числа во веки веков[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и верности». Геэзское слово может означать веру, верность или стойкость.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «числа нет им пред ним».'
    reason: lexical_alternative
lexical_decisions:
- source_word: መካን
  choice: месте
  rationale: Обычное обозначение места; сохраняет пространственную обстановку видения без ненужного уточнения.
- source_word: ኀሩየ
  choice: Избранного
  rationale: Субстантивированное обозначение особой фигуры; прописная буква передаёт функцию титула, не отождествляя её с кем-либо за пределами данного текста.
- source_word: ለጽድቅ
  choice: праведности
  rationale: Родительное сочетание естественно передаёт характеристику Избранного и сохраняет сжатую структуру источника.
- source_word: ወዘሃይማኖት
  choice: и веры
  rationale: Сохраняет наиболее прямое соответствие многозначному существительному; возможное значение «верность» вынесено в примечание.
- source_word: ይከውን
  choice: будет
  rationale: Прямо передаёт стандартную форму глагола «быть/становиться» и не добавляет значения преобладания.
- source_word: በመዋዕሊሁ
  choice: в дни его
  rationale: Сохраняет порядок и торжественный библейский регистр исходного временного выражения.
- source_word: ኄራያን
  choice: избранным
  rationale: Поддерживает лексическую связь с единственным числом «Избранный» и естественно сочетается с «праведным».
- source_word: ኈልቈ አልቦሙ
  choice: не будет числа
  rationale: Близко воспроизводит геэзскую идиому и сохраняет возвышенный апокалиптический стиль.
- source_word: ቅድሜሁ
  choice: пред ним
  rationale: Передаёт значение нахождения в присутствии возвышенной фигуры; «пред» соответствует торжественному регистру.
- source_word: ለዓለመ ዓለም
  choice: во веки веков
  rationale: Устоявшаяся русская формула вечной длительности, сохраняющая повторную структуру источника.
theological_decisions:
- issue: Передавать ли ኀሩየ как титул или как обычное определение
  choice: Титул «Избранный»
  alternative: «избранный» как нетитульное обозначение или «Избранник»
  rationale: В Притчах Еноха слово обозначает особую возвышенную фигуру. Прописная буква отражает литературную функцию, но не навязывает позднейшего богословского отождествления.
- issue: Значение ሃይማኖት в сочетании с праведностью
  choice: В основном тексте «вера», с примечанием «верность»
  alternative: «верность» или «надёжность»
  rationale: Геэзское слово допускает как значение веры, так и значение верности; неоднозначность сохранена, а не разрешена догматически.
- issue: Смысл ይከውን во фразе о днях Избранного
  choice: «праведность будет»
  alternative: «праведность восторжествует» или «утвердится»
  rationale: Буквальное значение глагола — «будет/станет». Такой перевод сохраняет простоту и напряжённую сжатость апокалиптической фразы, не добавляя идеи победы.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Инверсия «в дни его» и форма «пред ним» сохраняют торжественность исходника, оставаясь понятными современному читателю. Повтор слова «праведность» намеренно сохранён.
