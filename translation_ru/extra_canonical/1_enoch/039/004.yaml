  source_fidelity: 'Русский текст точно передаёт геэзский параллелизм: локативное «там», первое лицо «я увидел», дальнейшее («другое») видение, а также два ряда — обители святых и места упокоения праведных. Неоднозначность референта «святых» сохранена; притяжательная связь передана естественным русским родительным падежом.'
