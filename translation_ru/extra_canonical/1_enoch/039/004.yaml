  terminology: «Святые» не навязывает конкретно церковное или ангелологическое толкование, а «праведные» адекватно передаёт ключевой термин. Сноска корректно привязана к «местам упокоения» и честно отмечает более конкретную лексику ложа/постели/места для сна.
