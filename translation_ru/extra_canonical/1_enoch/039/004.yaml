base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/004.yaml
  text: 'And there I saw another vision: the dwelling places of the holy ones[a], and the resting places of the righteous.'
translation:
  language: ru
  text: 'И там я увидел другое видение: обители святых и места упокоения праведных.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение, переведённое как «места упокоения», буквальнее может означать ложа, постели или места для сна.
    reason: lexical_alternative
lexical_decisions:
- source_word: በህየ
  choice: там
  rationale: Локальное наречие задаёт место видения; «там» естественно и точно передаёт его функцию.
- source_word: ርኢኩ
  choice: я увидел
  rationale: Прямая и современная передача повествовательной формулы от первого лица.
- source_word: ራእየ ካልአ
  choice: другое видение
  rationale: Передаёт дальнейшее видение, не настаивая на строго числовом значении «второе».
- source_word: ማኅደሪሆሙ
  choice: обители
  rationale: Слово обозначает жилища или места пребывания; «обители» сохраняет возвышенный образный регистр и остаётся понятным.
- source_word: ለቅዱሳን
  choice: святых
  rationale: Субстантивированное «святые» сохраняет возможность понимать их как освящённых людей или небесных существ, не уточняя референт.
- source_word: ወምስካባቲሆሙ
  choice: и места упокоения
  rationale: Исходное слово связано с ложем, лежанием и сном; выбранная передача сохраняет смысл покоя в контексте блаженных обителей, а буквальная образность отмечена в сноске.
- source_word: ለጻድቃን
  choice: праведных
  rationale: Устоявшаяся и точная передача этико-апокалиптического обозначения праведников.
theological_decisions:
- issue: 'Кого обозначают ቅዱሳን: ангелов, верных умерших или оправданный народ Божий.'
  choice: святых
  alternative: святых людей; святых существ
  rationale: Краткое субстантивированное обозначение не вводит позднейшую церковную конкретизацию и сохраняет апокалиптическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной лексикой, подходящей для апокалиптического видения. Параллелизм двух именных групп сохранён; неоднозначность обозначения «святые» не разрешена.
