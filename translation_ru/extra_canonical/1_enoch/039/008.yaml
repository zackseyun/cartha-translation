base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/008.yaml
  text: There I desired to dwell[a], and my spirit longed for that dwelling place; there my portion was before[c][b], for thus it was established for me before the Lord of Spirits.
translation:
  language: ru
  text: Там я пожелал обитать, и дух мой возжелал того жилища. Там прежде был мой удел[a], ибо так было утверждено для меня пред Господом духов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «там прежде был/стал мой удел». Эфиопский глагол ኮነ может означать как «был», так и «стал»; в тексте прямо не сказано, что удел был «назначен».'
    reason: lexical_alternative
  - marker: b
    text: «Господь духов» — характерный божественный титул в Притчах Еноха; здесь он сохранён без согласования с более поздними формулами.
    reason: cross_reference
lexical_decisions:
- source_word: ህየ
  choice: там
  rationale: Локативное наречие указывает на место видения, не уточняя его сверх исходного текста.
- source_word: ፈቀድኩ አኅድር
  choice: я пожелал обитать
  rationale: Передаёт желание поселиться или пребывать там постоянно; «обитать» сохраняет возвышенный, но понятный регистр.
- source_word: ወፈተወት መንፈስየ
  choice: и дух мой возжелал
  rationale: Сочетание выражает внутреннее влечение или сильное желание; формулировка сохраняет эмоциональную силу и не сводит её к простому решению воли.
- source_word: ለውእቱ ማኅደር
  choice: того жилища
  rationale: ማኅደር обозначает место пребывания или жилище; указательное местоимение сохранено.
- source_word: በህየ ኮነ ክፍለየ ቅድመ
  choice: там уже прежде был мой удел
  rationale: ክፍል передано как «удел», а простой глагол ኮነ — как «был», без добавления отсутствующей в тексте идеи назначения. «Уже прежде» передаёт временное значение ቅድመ, сохраняя компактность фразы.
- source_word: እስመ ከመዝ ጸንዐ በእንቲአየ
  choice: ибо так было утверждено для меня
  rationale: ጸንዐ несёт значение твёрдости и установленности; безличная конструкция по-русски естественно передаёт это, не называя прямо действующее лицо.
- source_word: በቅድመ እግዚአ መናፍስት
  choice: пред Господом духов
  rationale: Здесь በቅድመ означает «перед, в присутствии», а «Господь духов» сохраняет характерный для Притч Еноха божественный титул.
theological_decisions:
- issue: Природа «удела» Еноха в небесном видении
  choice: Сохранить прямое утверждение, что его удел уже прежде находился там и был утверждён для него.
  alternative: Истолковать фразу как явное назначение Еноху определённого небесного места.
  rationale: Связь с «жилищем» допускает понимание удела как места, предназначенного провидцу, однако ኮነ буквально означает «был/стал» и само по себе не выражает пассивного «был назначен».
- issue: Титул እግዚአ መናፍስት
  choice: Господь духов
  alternative: Владыка духов
  rationale: «Господь духов» точно и последовательно передаёт характерный титул данного произведения, не отождествляя его посредством перевода с более поздними вероучительными формулами.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Формы «обитать», «удел» и «пред» поддерживают достоинство визионерского контекста, оставаясь понятными современному читателю; синтаксис разбит на два предложения для естественного русского звучания.
