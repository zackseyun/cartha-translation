base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/010.yaml
  text: And my eyes saw in that place[a][him], and they blessed him.
translation:
  language: ru
  text: И многое[a] увидели мои глаза в том месте, и я благословил его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Переданный в транскрипции первый токен повреждён; перевод следует засвидетельствованному чтению «многое».
    reason: textual_variant
  - marker: b
    text: Буквально глагольная форма содержит объект мужского рода — «его»; к кому именно относится местоимение, определяется более широким контекстом.
    reason: referent_ambiguity
lexical_decisions:
- source_word: ወ*ትንዳየ
  choice: И многое
  rationale: Переданный токен явно повреждён при распознавании или транскрипции. Сопоставление с засвидетельствованным чтением ወብዙኀ и синтаксисом всей фразы поддерживает значение «и многое», а не отождествление этого токена со словами «мои глаза».
- source_word: ርእዩ፡ አዕይንትየ
  choice: увидели мои глаза
  rationale: Глагол означает «видеть», а አዕይንትየ — «мои глаза». Сохранён образ исходного текста и множественное согласование, естественное по-русски.
- source_word: በውእቱ፡ መካን
  choice: в том месте
  rationale: Демонстративная предложная конструкция прямо локализует видение; «в том месте» точно и естественно передаёт её без избыточного удвоения «там, в том месте».
- source_word: ወባረክዎ
  choice: и я благословил его
  rationale: 'Форма лучше разбирается как глагол от первого лица единственного числа с местоименным объектом мужского рода: «я благословил его». Такое прочтение не делает «мои глаза» субъектом благословения и соответствует повествованию Еноха от первого лица.'
theological_decisions:
- issue: Кто совершает благословение
  choice: я благословил его
  alternative: они благословили его
  rationale: Морфология ወባረክዎ поддерживает субъект первого лица единственного числа и объект мужского рода. Поэтому не вводятся подразумеваемые небесные существа как субъект.
- issue: Кого обозначает местоимение «его»
  choice: сохранить местоимение без поясняющей подстановки имени
  alternative: назвать Господа духов или иного референта прямо в тексте
  rationale: Мужской объект выражен формой глагола, но в данном кратком отрывке его референт прямо не назван. Местоимение сохраняет контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок слов «увидели мои глаза» сохраняет образность оригинала, оставаясь понятным современному читателю.
