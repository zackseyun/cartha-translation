  text: And in those days a whirlwind of winds carried me away from the face of the earth and set me down at the end of the heavens[a].
translation:
  language: ru
  text: И в те дни вихрь ветров унёс меня с лица земли и поместил меня у предела небес[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на краю небес». Геэзское выражение обозначает внешнюю границу или самый дальний предел в мире видения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መዋዕል
  choice: дни
  rationale: В составе формулы በውእቱ መዋዕል естественно передаётся как «в те дни», сохраняя характерный апокалиптический повествовательный оборот.
- source_word: መሠጠኒ
  choice: унёс меня
  rationale: Глагол обозначает перемещение говорящего внешней силой; «унёс меня» естественно сочетается с вихрем и не сводит движение только к подъёму вверх.
- source_word: ዐውሎ ነፋሳት
  choice: вихрь ветров
  rationale: Буквально усиленный образ сохраняет мощь и необычность явления, не превращая его просто в «ветер».
- source_word: እምገጸ ሰምድር
  choice: с лица земли
  rationale: Сохраняет семитский образ «лица» как поверхности земли и соответствует возвышенному регистру текста.
- source_word: አንበረኒ
  choice: поставил меня
  rationale: В контексте перенесения глагол указывает на помещение в точку назначения; субъектом по согласованию выступает «вихрь».
- source_word: ጽንፈ ሰማያት
  choice: на краю небес
  rationale: Передаёт пространственную границу или дальний предел визионерского космоса; «край» звучит по-русски естественнее, чем буквальный «конец».
theological_decisions:
- issue: Космическая география визионерского перенесения
  choice: на краю небес
  alternative: у предела небес
  rationale: Пространственный образ апокалиптического видения сохранён без превращения его в обобщённое указание на пребывание на небе и без догматического уточнения устройства космоса.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены апокалиптическая формула «в те дни», образ «лица земли» и необычное выражение «вихрь ветров».
