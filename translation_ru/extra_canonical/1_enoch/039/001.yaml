base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/001.yaml
  text: And it will happen in those days that the chosen and holy ones will descend from the high heaven[d][c][b][a], and their offspring will become one with the children of men.
translation:
  language: ru
  text: 'И будет в те дни: избранные и святые дети[a] сойдут с высокого неба[b], и их потомство будет единым с детьми человеческими[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избранные и святые сыны». Геэзское ደቂቅ означает «дети» или «сыновья»; оно стоит здесь в абсолютном состоянии, поэтому слова «избранные и святые» естественнее понимать как определения к нему, а не как выражение «дети избранных и святых».'
    reason: lexical_alternative
  - marker: b
    text: Слова «с высокого неба» указывают на небесное происхождение этой группы, но сам стих не определяет точнее, кто эти избранные и святые дети.
    reason: cultural_note
  - marker: c
    text: 'Буквальнее: «их семя будет единым с детьми человеческими». Речь идёт о некотором единении или смешении, однако его точный характер в геэзском тексте не указан.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይከውን በዝኩ መዋዕል
  choice: И будет в те дни
  rationale: Сохранена вводная апокалиптическая формула и её возвышенный ритм; «будет» непосредственно передаёт форму глагола бытия, не утяжеляя русский текст оборотом «случится».
- source_word: ደቂቅ ኅሩያን ወቅዱሳን
  choice: избранные и святые дети
  rationale: 'ደቂቅ стоит в абсолютном, а не сопряжённом состоянии, поэтому следующие формы естественно понимать как согласованные определения: «дети, избранные и святые», а не «дети избранных и святых». Слово «дети» сохраняет значение родства и не ограничивает группу мужским полом.'
- source_word: ይወርዱ
  choice: сойдут
  rationale: Глагол сохраняет вертикальный образ движения с неба; литературное «сойдут» соответствует апокалиптическому регистру.
- source_word: እምልዑል ሰማይ
  choice: с высокого неба
  rationale: Переданы исходное значение предлога, единственное число слова «небо» и определение «высокое» без превращения его в космологически более определённое «высшее небо».
- source_word: ዘርኦሙ
  choice: их потомство
  rationale: «Потомство» естественно передаёт значение семени и происхождения в современном русском; буквальное «семя» оставлено как допустимая альтернатива в примечании.
- source_word: አሐደ ይከውን ምስለ ውሉደ ሰብእ
  choice: станет единым с детьми человеческими
  rationale: Формулировка сохраняет прямую идею становления одним целым и не уточняет, идёт ли речь о браке, половом смешении, объединении или ином виде единства.
theological_decisions:
- issue: Кого обозначают «избранные и святые дети»
  choice: Группа названа словами источника и показана сходящей с неба, но её природа не уточняется.
  alternative: Отождествить их с ангелами, избранными праведниками или иной небесной общностью.
  rationale: Указание на сход с высокого неба предполагает небесное происхождение, однако сам стих не даёт достаточных оснований для более точного отождествления.
- issue: Характер единства потомства с людьми
  choice: 'Передано нейтрально: «станет единым с».'
  alternative: Уточнить как брачный или половой союз либо как смешение с человечеством.
  rationale: Контекст предания о Стражах может наводить на мысль о половом союзе, но данная геэзская формулировка прямо не называет его механизм.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Формула «И будет в те дни» и выражение «дети человеческие» сохраняют торжественный ритм, оставаясь понятными современному читателю. Двоеточие после временной формулы делает синтаксис естественным по-русски и не добавляет нового смыслового отношения.
