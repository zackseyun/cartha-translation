base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/009.yaml
  text: In those days I praised and exalted the name of the Lord of Spirits with blessing and with praise[a], because he has strengthened me with blessing and with praise[b], according to the will of the Lord of Spirits.
translation:
  language: ru
  text: В те дни я прославил и превознёс имя Господа духов благословением и хвалой, потому что Он укрепил меня благословением и хвалой[a] по воле Господа духов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Он утвердил меня в благословении и хвале». Глагол может означать придание твёрдости или устойчивости, а предлог допускает значения «посредством» и «в». Вариант «утвердил» также яснее передаёт словесную перекличку с предыдущим стихом.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: በውእቱን መዋዕል
  choice: В те дни
  rationale: Сохраняет характерную для апокалиптической речи временную формулу и возвышенный, но понятный современный регистр.
- source_word: ሰባሕኩ
  choice: я прославил
  rationale: Передаёт завершённое действие в прошедшем времени; «прославил» естественно сочетается с последующим возвышением имени.
- source_word: ወአልዐልኩ ስሞ
  choice: и превознёс имя
  rationale: Сохраняет конкретную библейскую идиому возвышения Божьего имени и различие между двумя соседними глаголами хвалы.
- source_word: ለእግዚአ መናፍስት
  choice: Господа духов
  rationale: Сохранён характерный для 1 Еноха божественный титул без догматической нормализации; строчная буква в «духов» соответствует обычному русскому оформлению составного титула.
- source_word: በረከተ ወስብሐተ
  choice: благословением и хвалой
  rationale: Существительные поняты как формы славословия, а не как материальные дары; повтор предлога в русском опущен ради естественности без утраты параллелизма.
- source_word: እስመ
  choice: потому что
  rationale: Ясно передаёт причинную связь между прославлением и Божьим действием.
- source_word: አጽንዐኒ
  choice: Он укрепил меня
  rationale: Каузативный глагол обозначает придание твёрдости или устойчивости. «Укрепил» сохраняет широкий смысл, тогда как «утвердил» сильнее подчёркивало бы связь с предшествующим стихом.
- source_word: በበረከት ወስብሐት
  choice: благословением и хвалой
  rationale: Последовательно воспроизводит намеренный лексический повтор исходного текста; инструментальное или сферическое значение предлога остаётся контекстуально открытым.
- source_word: በከመ ፈቃዱ
  choice: по воле
  rationale: Кратко и естественно передаёт соответствие воле Господа, не привнося более поздней богословской терминологии.
theological_decisions:
- issue: Смысл повторяющегося выражения «благословение и хвала»
  choice: Сохранить как «благословением и хвалой», относя к языку славословия.
  alternative: «в благословении и хвале» либо понимание благословения как полученного блага.
  rationale: Исходный текст допускает инструментальный и сферический оттенки. Буквенно близкая формулировка сохраняет литургический акцент и не превращает благословение в материальную награду.
- issue: Значение አጽንዐኒ и связь со стихом 8
  choice: «укрепил меня»
  alternative: «утвердил меня» или «сделал меня стойким».
  rationale: «Укрепил» непосредственно выражает каузативное придание твёрдости и не переопределяет характер действия. В примечании сохранено «утвердил» как значимая альтернатива, способная лучше передать лексическую перекличку с предыдущим стихом.
- issue: Передача титула እግዚአ መናፍስት
  choice: «Господь духов»
  alternative: «Господь Духов» или «Господь духовных сил».
  rationale: Сохранён собственный титул книги без уточнения природы «духов» и без гармонизации с позднейшими формулами.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксис сделан плавным для чтения вслух; повтор ключевых слов исходника сохранён. Местоимение «Он» написано с прописной буквы как указание на Господа, без добавления отсутствующих в тексте толкований.
