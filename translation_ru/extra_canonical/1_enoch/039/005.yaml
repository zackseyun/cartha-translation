base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/005.yaml
  text: There my eyes saw their dwelling places with the angels of righteousness, and their resting places with the holy ones; and they were asking and pleading and praying on behalf of the children of men, and righteousness was flowing before them like water, and mercy like dew upon the earth. So it is among them forever and ever.
translation:
  language: ru
  text: Там мои глаза увидели их жилища вместе с ангелами праведности и места их покоя[a] — вместе со святыми[b]; и они просили, умоляли и молились за детей человеческих, и праведность текла перед ними, как вода, а милость — как роса на земле. Так среди них во веки веков.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их ложа»; слово может обозначать место, где лежат или отдыхают.'
    reason: lexical_alternative
  - marker: b
    text: «Святые» могут означать небесных святых существ, праведников в небесном собрании или тех и других; текст не уточняет их тождество.
    reason: alternative_reading
  - marker: c
    text: 'Заключительную фразу можно также понять как: «Так будет среди них во веки веков».'
    reason: alternative_reading
lexical_decisions:
- source_word: በህየ
  choice: Там
  rationale: Краткое указательное наречие естественно вводит место видения и точно передаёт локатив.
- source_word: ርእያ አዕይንትየ
  choice: мои глаза увидели
  rationale: В геэзском «мои глаза» — грамматическое подлежащее; необычный для русского оборот сохранён ради выразительной синтаксической особенности видения.
- source_word: ማኅደሮሙ
  choice: их жилища
  rationale: Передаёт места постоянного пребывания без излишне архаического оттенка слова «обители».
- source_word: መላእክተ ጽድቅ
  choice: ангелами праведности
  rationale: Сохранена конструкция с родительным отношением, а не сведена к прилагательному «праведными».
- source_word: ምስካቢሆሙ
  choice: места их покоя
  rationale: Слово связано с лежанием и отдыхом; выражение подходит к небесному видению и не конкретизирует предмет как кровати или ложа.
- source_word: ቅዱሳን
  choice: святыми
  rationale: 'Сохраняет неопределённость: речь может идти о небесных святых существах, о праведниках небесного собрания либо о тех и других.'
- source_word: ይስእሉ ወያስተበቍዑ ወይጼልዩ
  choice: просили, умоляли и молились
  rationale: Все три глагола переданы раздельно, чтобы сохранить риторическое нарастание ходатайства.
- source_word: በእንተ ውሉደ ሰብእ
  choice: за детей человеческих
  rationale: Сохраняет собирательную антропологическую формулу и не сужает её до лиц мужского пола.
- source_word: ጽድቅ ከመ ማይ ይውሕዝ ቅድሜሆሙ
  choice: праведность текла перед ними, как вода
  rationale: Сохранены ключевой термин, конкретный образ течения и пространственное «перед ними».
- source_word: ምሕረት ከመ ጠል ውስተ ምድር
  choice: милость была подобна росе на земле
  rationale: «Милость» уместно передаёт благожелательное сострадание, а сравнение сохраняет образ мягкой животворящей росы.
- source_word: ከመዝ ውእቱ ማእከሎሙ ለዓለመ ዓለም
  choice: Таково это среди них во веки веков
  rationale: Сохранены итоговый характер фразы, настоящее состояние, пространственное «среди них» и усиленная формула вечности; необычность русского оборота отражает сжатость источника.
theological_decisions:
- issue: Кто именно ходатайствует и кто входит в небесное собрание
  choice: Местоимение «они» оставлено без уточнения, а «святые» не отождествлены исключительно с ангелами или умершими праведниками.
  alternative: Явно назвать ходатаями одних ангелов либо одних прославленных праведников.
  rationale: Синтаксис связывает жилища с ангелами праведности, а места покоя — со святыми, но референт последующего «они» не вполне определён; перевод не должен вводить позднейшую доктринальную классификацию.
- issue: Передача ጽድቅ
  choice: праведность
  alternative: справедливость / правосудие
  rationale: В обозначении ангелов и в образе текущей воды слово имеет нравственно-космический смысл; «праведность» позволяет единообразно сохранить этот смысл, не исключая оттенка справедливости.
- issue: Временной оттенок заключительной формулы
  choice: 'Настоящее итоговое состояние: «Таково это».'
  alternative: 'Будущее: «Так будет».'
  rationale: Форма допускает контекстуальный будущий оттенок, но сама по себе не требует его; основной текст сохраняет сжатое резюме увиденного, а возможность будущего прочтения отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования. Сохранены повторительные союзы, тройное нарастание глаголов и необычная конструкция «мои глаза увидели», поскольку она грамматически значима в источнике. Архаизмы сведены к устойчивой библейской формуле «во веки веков».
