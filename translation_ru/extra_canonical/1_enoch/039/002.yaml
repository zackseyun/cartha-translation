base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/002.yaml
  text: And in those days Enoch received books of zeal and wrath[a], and books of tumult and confusion; and mercy shall not be upon them, says the Lord of Spirits.
translation:
  language: ru
  text: И в те дни Енох получил книги ревности и гнева и книги смятения и беспорядка[a]; и не будет им милости, говорит Господь духов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Геэзская формулировка в середине стиха в данном текстуальном свидетеле трудна. Слова, переведённые как «смятение и беспорядок», могут в более общем смысле означать возмущение, вопль или нарушение порядка.
    reason: textual_variant
lexical_decisions:
- source_word: መዋዕል
  choice: дни
  rationale: Сохраняет обычную апокалиптическую формулу времени «в те дни», не сужая значение до конкретного срока.
- source_word: ነሥአ
  choice: получил
  rationale: В контексте передачи Еноху книг естественнее значения «взял» и не подразумевает его самовольной инициативы.
- source_word: መጻሕፍተ
  choice: книги
  rationale: Прямо передаёт множественное число и не добавляет отсутствующей в тексте материальной конкретики слова «свитки».
- source_word: ቅንአት
  choice: ревность
  rationale: Сохраняет смысловой диапазон между ревностным пылом и ревностью, не сводя слово к человеческой зависти.
- source_word: መዐት
  choice: гнев
  rationale: Передаёт сильную лексику суда естественным и достойным современным русским словом.
- source_word: ጐጕአ
  choice: смятение
  rationale: Отражает вероятную семантику волнения, шума или возмущения, не придавая неясной форме чрезмерно узкого значения.
- source_word: ሀውክ
  choice: беспорядок
  rationale: Передаёт нарушение порядка и сочетается со «смятением», сохраняя широту трудного чтения.
- source_word: ምሕረት
  choice: милость
  rationale: Устойчиво передаёт божественное милосердие и сохраняет его противопоставление гневу и суду.
- source_word: ኢይከውን ላዕሌሆሙ
  choice: не будет им
  rationale: Естественно по-русски передаёт отсутствие милости по отношению к осуждаемым, не вводя дополнительного глагола действия.
- source_word: እግዚአ መናፈስት
  choice: Господь духов
  rationale: Сохраняет повторяющийся в Притчах Еноха возвышенный божественный титул без добавления определённости, не выраженной по-русски.
theological_decisions:
- issue: Характер упомянутых книг
  choice: Енох получает книги, характеризуемые ревностью, гневом, смятением и беспорядком.
  alternative: Фразу можно понимать как составное описание единого собрания писаний; трудные средние слова могут обозначать вопль или возмущение.
  rationale: Повторение መጻሕፍተ поддерживает упоминание двух групп книг, однако неясность чтения требует широких формулировок и пояснения в сноске.
- issue: К кому относится местоимение «им»
  choice: К людям, подвергаемым суду в окружающем контексте.
  alternative: Формально его можно попытаться связать с ближайшими перечисленными предметами, но по смыслу такое прочтение маловероятно.
  rationale: Заключительная формула об отсутствии милости представляет собой судебное изречение и естественно относится к осуждаемым противникам.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Синтаксис близок к оригиналу, но оборот об отсутствии милости дан естественно по-русски. Неясность двух средних терминов сохранена и отмечена сноской.
