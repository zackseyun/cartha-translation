  terminology: «Высокие горы», «иней», «дни, времена и годы» являются приемлемыми и последовательными соответствиями. «Времена» сохраняет широту геэзского термина и не сводит его исключительно к временам года. Сноска a корректно отмечает вариант «назначенные сроки», а сноска b поясняет временное значение глагола, не навязывая толкования.
