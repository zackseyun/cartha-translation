base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/004.yaml
  text: I saw seven high mountains[a], which are higher than all the mountains that are on the earth; and from them frost comes forth[d][c][b], and days and seasons and years pass.
translation:
  language: ru
  text: Я увидел семь высоких гор, которые выше всех гор на земле; из них исходит иней, и проходят дни, времена[a] и годы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «назначенные сроки». Геэзское слово может обозначать времена, периоды или установленные сроки.'
    reason: lexical_alternative
  - marker: b
    text: Здесь «проходят» означает, что дни, времена и годы текут или сменяют друг друга, а не прекращают существование.
    reason: cultural_note
lexical_decisions:
- source_word: ሰብዓተ አድባረ ነዋኃነ
  choice: семь высоких гор
  rationale: Число и образ гор переданы прямо; ነዋኃነ в данном сравнительном контексте обозначает высоту, а не протяжённость.
- source_word: ርኢኩ
  choice: я увидел
  rationale: Обычная формула рассказа о видении; союз «и» не добавлен, поскольку в начале геэзского текста его нет.
- source_word: እለ ይነውሑ እምኵሉ አድባር እለ ውስተ ምድር
  choice: которые выше всех гор на земле
  rationale: Сохранено явное сравнение по высоте и всеобщий охват земных гор.
- source_word: ወእምኔሆሙ ይወፅእ አሰሐትያ
  choice: из них исходит иней
  rationale: Глагол передаёт выход или истечение, а редкое метеорологическое существительное здесь естественно понимать как иней либо морозную изморозь.
- source_word: ወየኀልፍ መዋዕለ ወዘመን ወዓመት
  choice: и проходят дни, времена и годы
  rationale: Временная триада сохранена без сужения среднего слова до четырёх времён года; глагол обозначает течение и истечение времени.
theological_decisions:
- issue: Связь семи гор с инеем и течением времени
  choice: Сохранить соседство образов без объяснения причинного механизма
  alternative: Истолковать горы либо как обычные земные горы, либо как символ небесных областей, управляющих календарём
  rationale: Геэзский текст соединяет визионерскую географию, метеорологию и течение календарного времени, но не поясняет, буквальна или символична эта связь.
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанно возвышенной интонацией. Синтаксис сохраняет последовательность видения и космологическую напряжённость исходного текста без архаизации и конфессиональных пояснений.
