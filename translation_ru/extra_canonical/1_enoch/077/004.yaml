  source_fidelity: 'Текст точно передаёт основные элементы геэзского оригинала: первое лицо «Я увидел», число семь, сравнительную характеристику гор как более высоких, их земную локализацию, исходящий от них иней и триаду «дни, времена и годы». Начальный союз не добавлен, что соответствует представленному геэзскому тексту. Глагол «проходят» удачно передаёт течение времени без ложного оттенка уничтожения или прекращения.'
