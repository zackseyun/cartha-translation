base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/005.yaml
  text: And I saw seven rivers upon the earth[a], greater than all the rivers[b]; and one of them comes from the west and pours its waters into the Great Sea.
translation:
  language: ru
  text: И увидел я на земле семь рек, превосходящих все прочие реки; одна из них течёт с запада и изливает свои воды в Великое море[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «в великое море» — как общее описание, а не географическое наименование.'
    reason: Сочетание ባሕር ዐቢይ допускает понимание и как названия «Великое море», и как описательного выражения «великое море».
lexical_decisions:
- source_word: ፯ አፍላገ
  choice: семь рек
  rationale: Начальный знак ፯ — числительное «семь»; አፍላገ — множественное число со значением «реки, потоки». Число необходимо сохранить, поскольку оно определяет структуру дальнейшего перечисления.
- source_word: ዲበ ምድር
  choice: на земле
  rationale: Прямое и естественное по-русски обозначение местонахождения; сохраняет широкий смысл «земля/суша» без ненужного уточнения.
- source_word: ርኢኩ
  choice: увидел я
  rationale: Форма первого лица передаёт обычную формулу повествования о видении. Постпозиция местоимения поддерживает достойный библейский регистр, оставаясь понятной современному читателю.
- source_word: ዓበይተ እምኵሎሙ አፍላገ
  choice: превосходящих все прочие реки
  rationale: Сравнительная конструкция говорит о превосходстве по величине или значительности, не уточняя объём либо силу течения. «Прочие» устраняет неестественное самосравнение семи рек со множеством, к которому они относятся.
- source_word: አሐዱ እምኔሆሙ
  choice: одна из них
  rationale: Естественно передаёт простую партитивную конструкцию и согласуется в русском языке со словом «река».
- source_word: ይመጽእ እምዓረብ
  choice: течёт с запада
  rationale: Буквально река «приходит с запада»; в русском географическом описании «течёт с запада» естественно передаёт происхождение или направление движения, не вводя конкретного истока.
- source_word: ውስተ ባሕር ዐቢይ
  choice: в Великое море
  rationale: Предлог обозначает движение внутрь, а сочетание «Великое море» вероятно служит известным географическим наименованием, обычно относимым к Средиземному морю.
- source_word: ይከዑ ማዮ
  choice: изливает свои воды
  rationale: Сохраняет конкретный образ вод реки, вливающихся в море, и соответствует возвышенному, но понятному регистру.
theological_decisions:
- issue: Является ли «Великое море» географическим наименованием или общим описанием большого моря
  choice: Великое море
  alternative: великое море
  rationale: В древнеиудейском географическом употреблении это сочетание часто обозначает Средиземное море. Прописная буква отражает вероятное именование, а подлинная лексическая неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным строем. Инверсия «увидел я» сохраняет интонацию видения; остальной синтаксис остаётся прозрачным и естественным.
