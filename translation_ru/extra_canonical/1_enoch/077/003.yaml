base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/003.yaml
  text: 'And the fourth wind[a], whose name is the North, is divided into three parts: one part for a dwelling for humankind, and another is over the seas of water of water, and over the abysses, and over the forests, and over the rivers, and over darkness, and over mist[g][f][e][d][c][b]; and the third part is in the garden of righteousness.'
translation:
  language: ru
  text: 'А четвёртый ветер, имя которому Мэсъ[a], разделён на три части: одна из них служит жилищем для людей, другая простирается над морями вод[b], долинами[c], пустынными местами[d], реками, тьмой и туманом[e], а третья часть — в саду праведности[f].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Мэсъ» передаёт геэзскую форму; его точное значение неясно.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «моря вод». Это несколько избыточное выражение, которое может означать просто «моря».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «низинами» или «впадинами». Точное значение геэзского слова не вполне ясно.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «пустынями» или «безлюдной местностью».'
    reason: lexical_alternative
  - marker: e
    text: 'Или: «дымкой», «облаком» или «туманом». Геэзское слово обозначает атмосферное явление, точный вид которого неясен.'
    reason: lexical_alternative
  - marker: f
    text: Выражение «сад праведности» может напоминать об Эдеме или рае, однако исходный текст прямо их не отождествляет.
    reason: cross_reference
