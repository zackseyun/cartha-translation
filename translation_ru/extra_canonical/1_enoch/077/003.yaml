  rationale: Порядковое числительное и существительное переданы прямо; в контексте космологии речь идёт именно о ветре, а не о духе или дыхании.
- source_word: ዘስሙ መስዕ
  choice: имя которому Мэсъ
  rationale: Геэзское обозначение передано транслитерацией как имя, без молчаливого отождествления с севером; традиционное понимание отмечено в сноске.
- source_word: ይትከፈል ሠለስተ ክፍለ
  choice: разделён на три части
  rationale: Естественно передаёт пассивную форму и трёхчастное деление.
- source_word: ማኅደር ለሰብእ
  choice: предназначена для обитания людей
  rationale: Сохраняет значение места обитания и номинальную направленность конструкции, оставаясь естественным по-русски.
- source_word: አብሕርት ማይ
  choice: водными морями
  rationale: Сохранена несколько избыточная геэзская конструкция «моря воды», но в более приемлемой для русского форме.
- source_word: ቀላያት
  choice: долинами
  rationale: Передаёт вероятное значение низин или долин; из-за лексической неуверенности иной вариант указан в сноске.
- source_word: ፆም
  choice: пустынными местами
  rationale: Передаёт широкое значение безлюдной, пустынной местности, не сужая его строго до песчаной пустыни.
- source_word: አፍላግ
  choice: реками
  rationale: Обычное и ясное соответствие для текущих водных потоков.
- source_word: ጽልመት
  choice: тьмой
  rationale: Буквальная передача сохраняет космический масштаб перечисления.
- source_word: ጊሜ
  choice: туманом
  rationale: Выбрано общее обозначение атмосферной дымки; точный оттенок слова остаётся неуверенным и отмечен в сноске.
- source_word: ገነት ጽድቅ
  choice: сад праведности
  rationale: Буквальная передача сохраняет образ и не отождествляет это место заранее с Эдемом или раем.
theological_decisions:
- issue: Отождествление «сада праведности»
  choice: сад праведности
  alternative: Эдем; рай
  rationale: Геэзское выражение допускает райские ассоциации, но само по себе не требует более узкого отождествления.
- issue: Отождествление имени Мэсъ с севером
  choice: имя которому Мэсъ
  alternative: называемый Севером; северный
  rationale: Транслитерация сохраняет форму исходного текста и его неуверенную семантику; традиционное толкование «Север» вынесено в примечание.
