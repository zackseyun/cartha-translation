base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/001.yaml
  text: And they call the first wind the eastern one, because it is the first; and they call the second the south, because the Most High descends there, and there especially the Blessed One descends forever.
translation:
  language: ru
  text: Первый ветер называют восточным[b], потому что он первый; а второй называют южным, потому что там нисходит Всевышний, и особенно там нисходит Благословенный вовеки.[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вторая половина стиха в геэзском тексте трудна для истолкования. По-видимому, южный ветер назван так потому, что «там нисходит Всевышний»; затем следует усилительное выражение перед заключительной фразой.
    reason: textual_variant
  - marker: b
    text: Буквально употреблено слово, связанное с утром или рассветом и здесь обозначающее восточное направление.
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «и особенно там он нисходит, благословенный вовеки».'
    reason: previous_rendering
lexical_decisions:
- source_word: ይጼውዕዎ
  choice: называют
  rationale: Активная неопределённо-личная форма естественно передаёт описательный стиль текста и сохраняет значение именования.
- source_word: ለነፋስ
  choice: ветер
  rationale: Сохранён основной образ ветра, хотя в контексте он также обозначает космическое направление или область.
- source_word: ቀዳማዊ
  choice: первый
  rationale: Передаёт прямое порядковое значение и сохраняет повтор в пояснении.
- source_word: ለጽባሓዊ
  choice: восточным
  rationale: Слово связано с утром или рассветом и здесь обозначает восточное направление; русская прилагательная форма согласуется со словом «ветер».
- source_word: ለካልእ
  choice: второй
  rationale: В последовательном перечислении означает именно второй ветер, а не просто иной.
- source_word: አዜብ
  choice: южным
  rationale: Передаёт южное направление; форма согласована с подразумеваемым словом «ветер».
- source_word: ልዑል
  choice: Всевышний
  rationale: Устоявшийся и естественный русский эквивалент божественного титула без добавления конфессиональной конкретизации.
- source_word: ህየ
  choice: там
  rationale: Локативное наречие отсылает к южной области; повтор сохранён.
- source_word: ይወርድ
  choice: нисходит
  rationale: Сохраняет буквальный образ движения сверху вниз и возвышенный апокалиптический регистр.
- source_word: ወፈድፋደ
  choice: и особенно
  rationale: Трудная форма, по-видимому, усиливает последующее повторное утверждение; перевод не приписывает ей чрезмерно узкого значения.
- source_word: ቡሩክ፡ ለዓለም
  choice: Благословенный вовеки
  rationale: Передано как субстантивированный божественный титул, выступающий субъектом второго глагола «нисходит», при сохранении возможной иной синтаксической трактовки в сноске.
theological_decisions:
- issue: Следует ли понимать нисхождение Всевышнего буквально в рамках апокалиптической космологии или смягчать его как ниспослание благословения либо жара
  choice: 'Сохранено: «там нисходит Всевышний»'
  alternative: «там Всевышний ниспосылает [благословение/жар]» или «оттуда нисходит Всевышний»
  rationale: В геэзском тексте прямо употреблён глагол нисхождения при божественном титуле. Образ не рационализируется и сохраняет присущее тексту богословское и космографическое напряжение.
- issue: Синтаксическая роль выражения ቡሩክ፡ ለዓለም
  choice: 'Передано как титул: «Благословенный вовеки»'
  alternative: «нисходит, благословенный вовеки»
  rationale: Параллелизм с «Всевышний» поддерживает понимание выражения как субъекта второго глагола, однако грамматически возможная предикативная трактовка отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной апокалиптической лексикой. Синтаксис сделан ясным для широкого читателя, при этом повтор «там нисходит» и трудность заключительной фразы сохранены, а не сглажены.
