base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/006.yaml
  text: And the two of them come from the west as far as the sea[d][c][b][a], and they pour out their waters into the Erythraean Sea in the east.
translation:
  language: ru
  text: И обе они идут с запада до моря и изливают свои воды в Эритрейское море[a] на востоке.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Эритрейское море» — древнее географическое название; оно могло обозначать Красное море или более обширную морскую область в представлениях древних географов.
    reason: cultural_note
lexical_decisions:
- source_word: ክልኤቱ፡ ክልኤ፡
  choice: обе они
  rationale: Повторённая форма подчёркивает пару. В контексте речь идёт о двух реках, поэтому естественная русская форма «обе они» сохраняет двойственное значение, не добавляя в сам текст отсутствующее здесь существительное.
- source_word: ይመጽኡ፡
  choice: идут
  rationale: Глагол движения описывает течение или путь рек; русское «идут» звучит естественно в географическом описании и не усиливает значение до «прибывают».
- source_word: እመስዕ፡
  choice: с запада
  rationale: В данном географическом перечислении መስዕ обозначает запад; перевод передаёт направление прямо и устраняет ошибочное истолкование как «полдень» или «юг».
- source_word: እስከ፡ ባሕር፡
  choice: до моря
  rationale: Предлог выражает предел движения или протяжённости; «до моря» кратко и точно передаёт этот смысл.
- source_word: ወይከዕዉ፡ ማዮሙ፡
  choice: и изливают свои воды
  rationale: Глагол обозначает выливание или излияние. «Изливают свои воды» сохраняет образность оригинала и подходит к описанию рек.
- source_word: በባሕረ፡ ኤርትራ፡ እምሥራቅ።
  choice: в Эритрейское море на востоке
  rationale: Перевод сохраняет прямо названное Эритрейское море и отдельное восточное указание, не подменяя древний географический термин современным названием.
