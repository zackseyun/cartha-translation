base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/007.yaml
  text: And the four remaining ones go out by the north side to their own sea—two of them to the Eritrean Sea[d][c][b][a], and two to the Great Sea.
translation:
  language: ru
  text: 'А остальные четыре выходят с северной стороны к своему морю[a]: двое из них — к Эритрейскому морю[b][d], а двое — к Великому морю[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до своего моря». Предлог в геэзском тексте может обозначать как направление, так и предел движения.'
    reason: lexical_alternative
  - marker: b
    text: «Эритрейское море» — древнее географическое название в эфиопском свидетельстве; область, которую оно обозначало, могла включать то, что некоторые читатели называют Красным морем.
    reason: cultural_note
  - marker: c
    text: «Великое море» — традиционное древнее название, обычно относимое к Средиземному морю.
    reason: cultural_note
  - marker: d
    text: Повтор слов «двое… и двое» в источнике может указывать либо на нарушение переписки, либо на усиленное разделение; перевод передаёт наиболее вероятный общий смысл.
    reason: textual_variant
lexical_decisions:
- source_word: እለ ተርፉ
  choice: остальные
  rationale: Передаёт остаточную группу после предшествующего числового распределения и естественно звучит по-русски.
- source_word: አርባዕቱ
  choice: четыре
  rationale: Сохраняет явно названное число, существенное для схематического описания.
- source_word: ይወፅኡ
  choice: выходят
  rationale: Прямо передаёт глагол движения и сохраняет пространственный образ.
- source_word: በገቦ መስዕ
  choice: с северной стороны
  rationale: Сохраняет северную ориентацию, не вводя более узкого астрономического термина.
- source_word: እስከ ባሕረ ዚአሆሙ
  choice: к своему морю
  rationale: Передаёт направление или предел движения и сохраняет необычное указание на принадлежность моря.
- source_word: ባሕረ ኤርትራ
  choice: Эритрейское море
  rationale: Сохраняет древнее географическое название, засвидетельствованное в геэзском тексте, не отождествляя его безоговорочно с современным Красным морем.
- source_word: ባሕር ዓቢይ
  choice: Великое море
  rationale: Сохраняет традиционное древнее обозначение вместо подстановки современного географического названия.
theological_decisions:
- issue: Космографический язык Астрономической книги
  choice: Сохранить названия морей и направленную пространственную схему источника
  alternative: Заменить древние названия современными географическими эквивалентами или обобщить их как «океан»
  rationale: Так сохраняется апокалиптическая космография текста без её модернизации и без навязывания более точного географического отождествления, чем позволяет источник.
