base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/002.yaml
  text: And the wind from the west is named Hegulā[b][a], because there all the lights of heaven fade and go down.
translation:
  language: ru
  text: А ветер с запада называется Хегула, потому что там все светила небесные меркнут[a] и заходят.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «убывают и спускаются». Глагол передаёт уменьшение или ослабление, а последующее «спускаются» в этом контексте, вероятно, означает заход светил на западе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ነፋስ
  choice: ветер
  rationale: В контексте Астрономической книги обозначает ветер определённого направления, а не дух.
- source_word: እምዕራብ
  choice: с запада
  rationale: Предлог እም указывает на источник или происхождение; перевод сохраняет это пространственное значение.
- source_word: ስሙ
  choice: называется
  rationale: Естественно передаёт формулу наречения имени.
- source_word: ኀጕላ
  choice: Хегула
  rationale: Собственное имя западного ветра передано транслитерацией, а не переведено.
- source_word: በህየ
  choice: там
  rationale: Наречие отсылает к только что названной западной области.
- source_word: የሐፅፁ
  choice: меркнут
  rationale: Форма от ሐፀፀ выражает уменьшение или ослабление света; «меркнут» естественно передаёт это применительно к небесным светилам, не подразумевая их уничтожения.
- source_word: ኵሉ ብርሃናት ሰማይ
  choice: все светила небесные
  rationale: Передаёт совокупность небесных источников света и сохраняет возвышенный, но понятный современному читателю регистр.
- source_word: ወይወርዱ
  choice: и заходят
  rationale: Буквальное значение — «спускаются»; в данном астрономическом контексте речь, вероятнее всего, о заходе светил на западе.
theological_decisions:
- issue: Передавать ли описание светил техническим астрономическим термином или буквальным образом нисхождения
  choice: меркнут и заходят
  alternative: убывают и спускаются
  rationale: Выбранный вариант понятен современному читателю и соответствует западному горизонту, тогда как примечание сохраняет буквальный пространственный образ и возможный оттенок убывания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «светила небесные» сохраняет достоинство стиля, не делая текст архаичным.
