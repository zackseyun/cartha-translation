base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/001.yaml
  text: And in those days[a], in one place, fathers together with their sons will be struck down[d][c][b], and brothers together with their companions will fall in death until a stream flows from their blood.
translation:
  language: ru
  text: И в те дни[a] в одном месте отцы вместе со своими сыновьями будут сражены[b], а братья вместе со своими товарищами падут в смерти, пока поток не потечёт из их крови[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова, следующие в эфиопском тексте за выражением «в те дни», текстуально неясны; «в одном месте» — осторожный перевод вероятного локативного смысла.
    reason: textual_variant
  - marker: b
    text: 'В доступной транскрипции, по-видимому, допущена ошибка распознавания: вероятное чтение означает «будут сражены», а не «будут поражать друг друга».'
    reason: textual_variant
  - marker: c
    text: 'Буквально: «пока поток не потечёт из их крови». Яркий образ передаёт чрезвычайный масштаб кровопролития.'
    reason: cultural_note
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: в те дни
  rationale: Сохраняет обычную апокалиптическую временную формулу и возвышенный пророческий регистр.
- source_word: በ፻መካን
  choice: в одном месте
  rationale: Форма текстуально неясна, однако, вероятно, имеет единичное локативное значение; осторожный перевод не уточняет его сверх имеющихся данных.
- source_word: አበው ምስለ ውሉዶሙ
  choice: отцы вместе со своими сыновьями
  rationale: Передаёт прямое родственное сопоставление и мужской род множественного числа.
- source_word: ይትኃድኡ (вероятное искажение ይትጐድኡ)
  choice: будут сражены
  rationale: С учётом установленной ошибки распознавания передаёт пассивную форму глагола «поражать, разить», а не взаимное действие.
- source_word: አኀው ምስለ ቢጾሙ
  choice: братья вместе со своими товарищами
  rationale: «Братья» сохраняет буквальное родственное обозначение, а «товарищи» — широкий смысл спутников или близких соратников без излишне разговорного оттенка.
- source_word: ይወድቁ በሞት
  choice: падут мёртвыми
  rationale: Естественно по-русски передаёт торжественный образ падения в смерти, не ослабляя его конкретности.
- source_word: እስከ ይውኅዝ ትክዚ እምደመ ዚአሆሙ
  choice: и кровь их потечёт потоком
  rationale: Сохраняет наглядный апокалиптический образ обильного кровопролития; русская перестройка естественнее буквального «поток потечёт из их крови».
theological_decisions:
- issue: Характер изображения насилия
  choice: конкретный общественный распад, выраженный апокалиптической гиперболой
  alternative: чистая метафора междоусобицы либо строго буквальное описание поля боя
  rationale: Перевод сохраняет телесность насилия и масштаб кровопролития, не сводя образ к отвлечённому раздору и не навязывая исключительно буквальное прочтение.
- issue: Субъект и взаимность насилия
  choice: пассивное «будут сражены»
  alternative: «будут поражать друг друга» или «будут сражаться друг с другом»
  rationale: Вероятное исходное чтение ይትጐድኡ является пассивным; поэтому перевод не вводит отсутствующую взаимность, хотя общий контекст описывает распад близких связей.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Синтаксис сделан ясным и естественным; текстуальная неуверенность и напряжённая образность сохранены в примечаниях.
