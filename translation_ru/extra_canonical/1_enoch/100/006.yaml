base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/006.yaml
  text: And wise men will see[a], and all the children of the earth will understand every matter of this book[c][b], and they will know that their wealth cannot save them from the destruction of their sins.
translation:
  language: ru
  text: И мудрые люди увидят[a], и все дети земли поймут всё, о чём говорится в этой книге, и узнают, что их богатство не сможет спасти их от гибели из-за их грехов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Трудное начало можно также понять как «И воистину мудрые люди увидят» или «И мудрые люди увидят истину».
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «при гибели [или сокрушении] их грехов»; смысл связи между гибелью и грехами выражен сжато.'
    reason: source_ambiguity
lexical_decisions:
- source_word: እሙነ፡ ይሬእዩ፡ ሰብአ፡ ጠቢባን
  choice: мудрые люди увидят
  rationale: Основная строка не добавляет явно выраженного объекта к глаголу «увидят». Трудную форму እሙነ, которую можно понять как «воистину» либо «истину», отмечаем в сноске, не устраняя неоднозначность.
- source_word: ውሉደ፡ ምድር
  choice: все дети земли
  rationale: Буквальный образ «дети земли» сохраняет характерную для апокалиптического текста антропологическую формулу и при этом понятен по-русски.
- source_word: ኵሎ፡ ነገረ፡ ዛቲ፡ መጽሐፍ
  choice: всё, о чём говорится в этой книге
  rationale: Так естественно передаётся широкий смысл ነገር — «дело, предмет, слово» — без искусственного русского оборота «всякое дело этой книги».
- source_word: ብዕሎሙ
  choice: их богатство
  rationale: Существительное означает имущество или богатство и является субъектом утверждения о неспособности спасти.
- source_word: አድኅኖቶሙ
  choice: спасти их
  rationale: Передаёт значение избавления и объектный суффикс множественного числа; это не возвратное «спасти себя».
- source_word: በመዳቀ፡ ኃጢአቶሙ
  choice: от гибели из-за их грехов
  rationale: Передаёт гибель или сокрушение, связанные с грехами, не повторяя отвергнутое толкование «отрицая свои грехи». Предлог «из-за» естественно выражает причинную связь по-русски.
theological_decisions:
- issue: Что именно оказывается бессильным спасти людей
  choice: Их не может спасти богатство.
  alternative: Они не могут спасти самих себя.
  rationale: ብዕሎሙ означает «их богатство» и выступает субъектом; поэтому стих говорит о бессилии материального достояния, а не в общем о самостоятельном спасении.
- issue: Связь гибели с грехами
  choice: Гибель происходит из-за их грехов.
  alternative: Богатство не спасёт их при сокрушении их грехов.
  rationale: Контекст суда поддерживает причинное понимание, однако грамматическая связь краткой заключительной фразы допускает более буквальную передачу; она сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Сохранён образ «дети земли»; синтаксис сделан ясным для обычного читателя. Лексические трудности начала и заключительной фразы не скрыты, а вынесены в сноски.
