base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/010.yaml
  text: And now[a], know that your deeds will be investigated by the angels in heaven, and by the sun and the moon and the stars, concerning your sins[b], because upon the earth you execute judgment upon the righteous.
translation:
  language: ru
  text: 'И теперь знайте[a]: ваши дела будут исследованы ангелами на небесах, а также солнцем, луной и звёздами, — о ваших грехах, потому что на земле вы вершите суд над праведными.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленная строка на языке геэз обрывается после слов «И теперь знайте». Продолжение стиха переведено по более полному тексту, приведённому в материалах сверки издания Чарльза.
    reason: textual_variant
  - marker: b
    text: Заключительные слова на геэз можно передать более буквально как «над праведником среди праведных»; их точное синтаксическое соотношение не вполне ясно.
    reason: translation_ambiguity
lexical_decisions:
- source_word: ወይእዜኒ
  choice: И теперь
  rationale: Передаёт соединительный союз и временной переход без излишнего усиления частицы.
- source_word: አእምሩ
  choice: знайте
  rationale: Прямое соответствие повелительной форме множественного числа от глагола знания и понимания; естественно звучит как апокалиптическое увещание.
- source_word: ይትኀሠሥ፡ ምግባሪክሙ
  choice: ваши дела будут исследованы
  rationale: Пассивная конструкция сохраняет смысл разбирательства или дознания и не уточняет его характер сверх того, что допускает эфиопский текст.
- source_word: እመላእክት … እምፀሐይ፡ ወእምወርኅ፡ ወእምከዋክብት
  choice: ангелами, солнцем, луной и звёздами
  rationale: В контексте исследования дел исходный предлог естественно обозначает действующих лиц или свидетелей; тире ясно связывает весь ряд с пассивным сказуемым.
- source_word: ትገብሩ፡ ኵነኔ
  choice: вы вершите суд
  rationale: Достоинственная и понятная передача сочетания «делать/совершать суд», сохраняющая обвинительный тон.
- source_word: ጻድቀ፡ በጻድቃን
  choice: над праведными
  rationale: Передаёт общий смысл трудной заключительной формулы естественным русским языком, не вводя дополнительной личности или группы, неясной читателю.
theological_decisions:
- issue: Роль ангелов и небесных светил в исследовании человеческих дел
  choice: Сохранить их как названных участников исследования, не объясняя механизм их участия.
  alternative: Истолковать их только как свидетелей или как источники сведений.
  rationale: Исходная предложная конструкция допускает оттенки действующего лица, источника или свидетельства; перевод не должен превращать образ в разработанное учение.
- issue: Объект неправедного суда
  choice: «над праведными»
  alternative: «над праведником среди праведных»
  rationale: Заключительная эфиопская формула буквально сложнее, однако контекст ясно противопоставляет грешников праведным; выбранная форма сохраняет эту мысль без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным апокалиптическим звучанием. Синтаксис сохраняет длинное обвинительное высказывание, а тире помогает читателю увидеть ряд небесных участников исследования.
