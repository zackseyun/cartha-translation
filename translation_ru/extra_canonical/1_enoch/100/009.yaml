base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/009.yaml
  text: 'Woe to you[a], sinners, because of the words of your mouth and because of the deeds of your hands[b], which your wickedness has done: in the heat of a flame more burning than fire you shall burn.'
translation:
  language: ru
  text: 'Горе вам, грешники, за слова ваших уст и за дела ваших рук[a], которые совершило ваше нечестие: вы будете гореть в жаре пламени, палящего сильнее огня[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которые совершило ваше нечестие». Конструкция синтаксически трудна; вероятно, она относит и слова, и дела к нечестию грешников.'
    reason: Сохранение синтаксической неоднозначности исходного текста.
  - marker: b
    text: 'Предоставленная транскрипция в конце стиха допускает форму «оно горит» или «оно обжигает», тогда как чтение критического текста, лежащее в основе традиционного деления стиха, означает «вы будете гореть». Сравнительную фразу можно также передать: «в жаре пламени, которое жарче огня».'
    reason: Текстуальная и лексическая неопределённость.
lexical_decisions:
- source_word: አሌ
  choice: Горе
  rationale: Сохраняет формулу пророческого и апокалиптического обличения, а не сводит её к простому выражению скорби.
- source_word: ኃጥኣን
  choice: грешники
  rationale: Прямое и естественное обозначение людей, подвергающихся суду.
- source_word: ዲበ
  choice: за
  rationale: В данном контексте вводит основание суда; русское «за» ясно и естественно передаёт причинный смысл.
- source_word: ነገረ አፉክሙ
  choice: слова ваших уст
  rationale: Сохраняет конкретный образ и параллелизм с «делами ваших рук».
- source_word: ተግባረ እዴክሙ
  choice: дела ваших рук
  rationale: Передаёт телесную образность и формальный параллелизм исходного текста.
- source_word: ርስዓኒክሙ
  choice: ваше нечестие
  rationale: «Нечестие» включает как нравственную порочность, так и религиозную безбожность, не сужая значение до одной из этих сторон.
- source_word: በዋዕየ ላህብ እምእሳት
  choice: в пылу пламени, которое жарче огня
  rationale: Сохраняет нагромождение образов жара, пламени и огня, а также сравнительную силу እም.
- source_word: ይውዒ
  choice: вы будете гореть
  rationale: Следует засвидетельствованному в критическом тексте обращению во втором лице множественного числа; расхождение с предоставленной транскрипцией отмечено в сноске.
theological_decisions:
- issue: Нравственный или явно религиозный оттенок причины суда
  choice: ваше нечестие
  alternative: ваша порочность / ваше безбожие
  rationale: «Нечестие» сохраняет одновременно нравственный и религиозный смысл, не вводя более поздних конфессиональных категорий.
- issue: Связь нечестия со словами и делами
  choice: порождённые вашим нечестием
  alternative: которые совершило ваше нечестие
  rationale: Исходная конструкция синтаксически трудна; выбранный вариант естественен по-русски и связывает нечестие с обоими обвинениями, не превращая его лишь в отдельный поступок.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной апокалиптической интонацией. Сохранены параллелизм «слова уст / дела рук» и намеренно усиленная огненная образность.
