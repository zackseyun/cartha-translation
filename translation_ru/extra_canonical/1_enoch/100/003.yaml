  source_fidelity: 'Основные лексические решения верны: የሐውር передано как движение («пойдёт»), እንግድዓሁ — как «грудь», без гармонизации с образом узды в Откр. 14:20; «грешников» и «колесницы» также точны. Однако русская конструкция «пойдёт в крови грешников по самую грудь» несколько неясно присоединяет указание глубины к глаголу движения.'
