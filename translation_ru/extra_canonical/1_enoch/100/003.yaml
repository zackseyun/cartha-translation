  to: И конь пойдёт в крови грешников, доходящей ему до груди, и колесницы погрузятся до самого верха.
  rationale: 'Перевод уточнён лишь стилистически: сохранены единственное число «конь», движение, кровь грешников, глубина до груди и погружение колесниц до их верхней части. Сноска удалена: она фиксирует отвергнутую гармонизацию с «уздой», тогда как исходное слово в данном контексте следует переводить прямо как «грудь».'
