  text: And a horse will walk up to its chest in the blood of sinners[d][c][b][a], and chariots will sink up to their tops.
translation:
  language: ru
  text: И конь пойдёт в крови грешников, доходящей ему до груди, и колесницы погрузятся до самого верха.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወየሐውር
  choice: и пойдёт
  rationale: Форма от ሐወረ передаёт движение — «идти, шествовать»; будущее время сохранено.
- source_word: ፈረስ
  choice: конь
  rationale: Сохранено грамматическое единственное число эфиопского текста; «конь» естественно звучит в возвышенной апокалиптической прозе.
- source_word: እስከ እንግድዓሁ
  choice: по самую грудь
  rationale: እስከ обозначает предел, а እንግድዓሁ — грудь животного с местоименным суффиксом «его»; русское выражение естественно передаёт глубину погружения.
- source_word: ውስተ ደመ ኃጥኣን
  choice: в крови грешников
  rationale: Прямо сохранены пространственное отношение и нравственная категория исходного текста.
- source_word: ሰረገላት
  choice: колесницы
  rationale: Обычное значение формы множественного числа.
- source_word: እስከ መልዕልታ
  choice: по самый верх
  rationale: Буквально указан верхний предел; по-русски так ясно передаётся полное погружение колесниц.
- source_word: ትሰጠም
  choice: погрузятся
  rationale: В контексте крови форма описывает погружение или затопление; возвратный глагол сохраняет естественность и не вводит внешнего действующего лица.
theological_decisions:
- issue: Нравственное обозначение ኃጥኣን
  choice: грешников
  alternative: виновных; преступников
  rationale: «Грешники» прямо сохраняет нравственно-религиозный смысл слова, не превращая его в исключительно юридическую категорию.
- issue: Связь образа с Откровением 14:20
  choice: Переводить እንግዓሁ как «грудь» по собственному словоупотреблению текста
  alternative: «узда», по ассоциации с Откровением 14:20
  rationale: Не следует гармонизировать этот стих с позднейшим сходным образом ценой лексической точности; собственная формулировка 1 Еноха сохранена.
translation_notes:
  register: Современный литературный русский язык с торжественной апокалиптической образностью. Синтаксис краткий и ясный; гипербола оригинала сохранена без гармонизации с Откровением 14:20.
