  terminology: «Грешники», «конь» и «колесницы» соответствуют регистру современного литературного русского и апокалиптической образности. Сноска о «узде» более не нужна, поскольку в данном месте лексическое значение «грудь» достаточно определённо и альтернативу не следует поддерживать как равноправную.
