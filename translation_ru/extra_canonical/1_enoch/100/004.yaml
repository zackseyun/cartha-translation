base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/004.yaml
  text: In those days the angels will descend into the hidden places and gather together into one place all those who led others into sin[c][b][a]; and the Most High will arise on that day of judgment to execute great judgment in the midst of the sinners.
translation:
  language: ru
  text: В те дни ангелы сойдут в тайные места[b] и соберут в одном месте всех тех, кто содействовал греху[a]; и Всевышний восстанет в тот день суда, чтобы совершить великий суд среди грешников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Фраза трудна. Рукописное чтение обычно понимают как «тех, кто помогал греху»; «содействовал греху» передаёт эту необычную связь, не уточняя, кому именно они помогали. Иное чтение допускает понимание: «тех, через кого сошёл грех» или «тех, кто низвёл грех».'
    reason: textual_and_lexical_alternative
  - marker: b
    text: 'Или: «в укромные места», «в скрытые места».'
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: В те дни
  rationale: Сохраняет обычную апокалиптическую временную формулу и буквальный образ «дней».
- source_word: መላእክት
  choice: ангелы
  rationale: В контексте небесного суда речь естественно идёт о сверхъестественных посланниках.
- source_word: ይወርዱ
  choice: сойдут
  rationale: Передаёт вертикальный образ нисхождения небесных существ.
- source_word: ውስተ ምኅባእት
  choice: в тайные места
  rationale: Передаёт локальное множественное значение и не уточняет природу укрытий сверх текста.
- source_word: ወይገብእዎሙ በአሐዱ መካን
  choice: и соберут в одном месте
  rationale: Естественно передаёт собирание людей в единое место для суда.
- source_word: ለእሉ እለ ይወርደዋ ለኃጢአት
  choice: всех тех, кто содействовал греху
  rationale: Фраза в представленном тексте трудна, а указанная рукописная традиция допускает чтение от глагола «помогать». Формулировка сохраняет необычную связь людей с грехом, не добавляя объекта «других», которого в тексте нет.
- source_word: ወይትነሣእ ልዑል
  choice: и Всевышний восстанет
  rationale: «Восстанет» вводит решительное действие Судьи, а «Всевышний» является естественной передачей божественного титула.
- source_word: በይእቲ ዕለት ኵነኔ
  choice: в тот день суда
  rationale: Сохраняет торжественную формулу и явно выраженное понятие суда.
- source_word: ከመ ይግበር ኵነኔ ዐቢየ
  choice: чтобы совершить великий суд
  rationale: Идиоматично передаёт осуществление судебного действия и сохраняет повтор слова «суд».
- source_word: እማእከሎሙ ለኃጥኣን
  choice: среди грешников
  rationale: Точно и естественно передаёт нахождение в их среде без лишнего пространственного усиления.
theological_decisions:
- issue: Кого собирают ангелы
  choice: тех, кто содействовал греху
  alternative: тех, кто вводил других в грех; тех, через кого сошёл грех; тех, кто низвёл грех
  rationale: Не сводит группу просто ко всем грешникам и сохраняет специфическую, но не вполне ясную связь с грехом. При этом перевод учитывает свидетельство о рукописном чтении «помогать», не превращая его без основания в каузатив «вводить других в грех».
- issue: Божественный титул ልዑል
  choice: Всевышний
  alternative: Превознесённый
  rationale: Это ясная и устойчивая русская передача титула, не вносящая дополнительного христологического толкования.
- issue: Действие Всевышнего
  choice: восстанет
  alternative: возвысится
  rationale: Контекст ожидаемого суда поддерживает значение начала решительного действия, но не уточняет его способ.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Синтаксис сохранён ясным, ключевой повтор слова «суд» не устранён. Неясное место не сведено к более определённому «вводил других в грех».
