base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/005.yaml
  text: And he will appoint guardians from among the holy angels over all the righteous and holy ones[a], and they will guard them like the pupil of an eye, until every evil and every sin comes to an end. And even if the righteous sleep a long sleep[c][b], they have nothing to fear.
translation:
  language: ru
  text: И Он назначит из числа святых ангелов стражей над всеми праведными и святыми, и они будут оберегать их, как зеницу ока[a], пока всякому злу и всякому греху не придёт конец. И даже если праведные уснут долгим сном[b], им нечего бояться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как зрачок глаза», то есть с особой тщательностью; русский оборот «как зеницу ока» передаёт этот образ.'
    reason: lexical_alternative
  - marker: b
    text: «Уснут долгим сном», вероятно, означает смерть или пребывание умерших в покое, однако сам текст сохраняет иносказательный образ сна.
    reason: lexical_alternative
lexical_decisions:
- source_word: ዐቀብተ
  choice: стражей
  rationale: Передаёт существительное от корня со значением охраны и защиты; не смешивает этих ангелов с техническим енохическим наименованием Стражей.
- source_word: ይሁብ
  choice: поставит
  rationale: Буквально глагол означает «даст», но в сочетании со стражами над людьми естественно выражает назначение на служение.
- source_word: ጻድቃን ወቅዱሳን
  choice: праведными и святыми
  rationale: Сохраняет два параллельных обозначения защищаемого сообщества без позднейших конфессиональных оттенков слова «святые» как особого титула.
- source_word: እመላእክት ቅዱሳን
  choice: из числа святых ангелов
  rationale: 'Ясно относит предложную группу к стражам: они избираются из среды святых ангелов, а не отождествляются с праведниками.'
- source_word: የዐቅብዎሙ
  choice: будут хранить их
  rationale: Сохраняет повтор мотива охраны, образованный от того же корня, что и «стражи».
- source_word: ከመ ብንተ ዐይን
  choice: словно зрачок глаза
  rationale: Конкретно передаёт образ тщательно оберегаемой части глаза, не заменяя его готовым русским идиомом без пояснения.
- source_word: እስከ ይዌድእ ኵሉ እኩየ ወኵሉ ኃጢአተ
  choice: пока всякому злу и всякому греху не придёт конец
  rationale: Передаёт прекращение зла и греха, не вводя в текст невыраженного деятеля, который лично кладёт им конец.
- source_word: እመኒ
  choice: даже если
  rationale: 'Передаёт уступительное значение: обещание защиты остаётся в силе и при долгом сне.'
- source_word: ይነውሙ ጻድቃን ንዋመ ነዋኅ
  choice: праведные уснут долгим сном
  rationale: Сохраняет исходную метафору сна и её усиление указанием на длительность, не подменяя её прямым словом «умрут».
- source_word: አልቦ ዘይፈረሁ
  choice: им нечего бояться
  rationale: Естественная современная русская формулировка отсутствия причины или предмета страха.
theological_decisions:
- issue: Буквальны ли ангельские стражи или это только метафора Божьей заботы
  choice: В основном тексте сохранено прямое назначение стражей из числа святых ангелов.
  alternative: Передать ангельскую речь как обобщённый образ Божьего покровительства.
  rationale: Источник прямо называет святых ангелов; апокалиптическую картину не следует демифологизировать.
- issue: Следует ли раскрыть «сон» как смерть
  choice: В основном тексте сохранён «долгий сон».
  alternative: Перевести «умрут» или «уснут смертным сном».
  rationale: Исходный текст сохраняет эвфемизм и допускает напряжение между обычным сном, длительным покоем и смертью; вероятный смысл пояснён в сноске.
- issue: Кто приводит зло и грех к концу
  choice: Использована безличная формулировка «придёт конец».
  alternative: «Пока Он не положит конец всякому злу и всякому греху».
  rationale: Форма источника выражает завершение, но в данном предложении не требует добавлять явно названного деятеля; нейтральная конструкция сохраняет эту особенность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, но ясным звучанием. «Стражи», «праведные» и «святые ангелы» сохраняют апокалиптический регистр; синтаксис разгружен так, чтобы оборот «из числа святых ангелов» однозначно относился к стражам. Все сноски отмечены в основном тексте.
