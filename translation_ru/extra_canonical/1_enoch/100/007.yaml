base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/007.yaml
  text: Woe to you[a], sinners, when you oppress the righteous on the day of fierce distress, and burn them with fire[b]; then you will be repaid according to your deeds.
translation:
  language: ru
  text: Горе вам, грешники, когда вы будете притеснять[a] праведных в день тяжкого бедствия[b] и жечь их огнём! Тогда вам воздастся по вашим делам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол, переведённый как «притеснять», можно также понять как «мучить» или «преследовать».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально — день, отмеченный тяжким, сильным бедствием; возможный перевод: «день великой скорби».'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ፡ ኃጥኣን
  choice: Горе вам, грешники
  rationale: Сохраняет прямое пророческое провозглашение суда и нравственно-религиозное обозначение адресатов.
- source_word: ሶበ
  choice: когда
  rationale: Естественно вводит обстоятельство, при котором произносится угроза; не превращает временную связь в однозначно причинную.
- source_word: ታመኒድብዎሙ፡ ለጻድቃን
  choice: вы станете притеснять праведных
  rationale: «Притеснять» передаёт жестокое обращение, не сужая его до исключительно религиозного преследования; местоименный объект естественно заменён названными далее «праведными».
- source_word: በዕለተ፡ ጻዕብ፡ ኃያል
  choice: в день тяжкого бедствия
  rationale: Передаёт день, отмеченный крайне тяжёлым несчастьем, без использования «великой скорби» как возможного позднейшего технического термина.
- source_word: ወታነድድዎሙ፡ በእሳት
  choice: и жечь их огнём
  rationale: Сохраняет конкретный и резкий образ насилия; несовершенный вид согласуется с рядом действий грешников.
- source_word: ወትትፈደዩ
  choice: Тогда вам воздастся
  rationale: Безличная русская конструкция ясно сохраняет обращение ко грешникам и идею возмездия, но не добавляет прямо не названного деятеля.
- source_word: ከመ፡ ምግባራቲክሙ
  choice: по вашим делам
  rationale: Сохраняет формулу соразмерного воздаяния и нравственную связь между поступками и судом.
theological_decisions:
- issue: Кому относится заключительное воздаяние и кто его совершает
  choice: Воздаяние получают сами грешники; совершающий его прямо не назван.
  alternative: 'Можно было явно сказать: «Бог воздаст вам» или понять фразу как общее утверждение о возмездии.'
  rationale: Последовательное обращение во втором лице указывает на грешников как получателей воздаяния, однако источник не требует прямо называть его совершителя.
- issue: Эсхатологическая окраска выражения о дне бедствия
  choice: «день тяжкого бедствия»
  alternative: «день великой скорби»
  rationale: Выбранная формулировка сохраняет напряжённость апокалиптического контекста, но не навязывает выражению статус позднейшего специального термина.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Формулировки прямые и понятные; сохранены жёсткость образа огня, обращение ко грешникам и неопределённость относительно прямо не названного совершителя воздаяния.
