base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/002.yaml
  text: For a man will not withhold his hand from his sons[a], nor from the sons of his sons, to kill them; and the sinner will not withhold his hand from his honored brother[b]. From dawn until the sun sets they will slaughter one another.
translation:
  language: ru
  text: Ибо человек не удержит руки своей от сыновей своих[a] и от сыновей сыновей своих, чтобы убить их; и грешник не удержит руки своей от почитаемого брата своего[b]. От рассвета до захода солнца они будут убивать друг друга.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «детей своих»; соответствующее слово в гээз может обозначать не только сыновей, но и детей вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «знатного брата своего»; определение может подчёркивать как личную почитаемость, так и высокое общественное положение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢይከልእ እዴሁ
  choice: не удержит руки своей
  rationale: Сохраняет конкретную гээзскую идиому о руке, которой не дают удержу, и её насильственный оттенок.
- source_word: እምውሉዱ
  choice: от сыновей своих
  rationale: Передаёт наиболее прямое значение формы и сохраняет семейную конкретность; возможное более широкое значение отмечено в сноске.
- source_word: ውሉደ ውሉዱ
  choice: от сыновей сыновей своих
  rationale: Сохраняет повтор и ритмическую структуру оригинала вместо сглаженного «от внуков».
- source_word: ከመ ይቅትሎ
  choice: чтобы убить их
  rationale: Естественно передаёт цель или направленность неудержанного насилия, не устраняя присущую конструкции смысловую близость цели и результата.
- source_word: ኃጥእ
  choice: грешник
  rationale: Сохраняет характерную для енохической литературы нравственную категорию в форме единственного числа.
- source_word: እኍሁ ክቡር
  choice: почитаемого брата своего
  rationale: «Почитаемый» передаёт достоинство и честь, не сводя значение непременно к знатному общественному положению.
- source_word: እምጎሕ እስከ ትዐርብ ፀሐይ
  choice: от рассвета до захода солнца
  rationale: Сохраняет образ полного дневного промежутка и явное упоминание солнца.
- source_word: ይትቃተሉ
  choice: будут убивать друг друга
  rationale: Передаёт взаимность и смертельный характер действия; «сражаться» было бы слабее в данном контексте.
theological_decisions:
- issue: Масштаб изображённого насилия
  choice: Стих изображает распад общества, при котором даже родственные узы и почтение к брату больше не удерживают от убийства.
  alternative: Понимать описание только как военные действия либо как отвлечённую гиперболу без буквальной семейной отнесённости.
  rationale: Повторяющиеся обозначения сыновей, сыновей сыновей и брата требуют сохранить конкретный образ разрушения семейных связей в обстановке суда.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Повтор «сыновей сыновей» и идиома «не удержит руки» намеренно сохранены ради структуры и образности оригинала; архаические формы и чрезмерно церковнославянская лексика избегаются.
