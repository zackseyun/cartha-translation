base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/008.yaml
  text: 'Woe to you[a], hard of heart, who stay awake to devise evil: fear will come upon you[c][b], and there will be no one to help you.'
translation:
  language: ru
  text: Горе вам, ожесточённые сердцем, неусыпно замышляющие зло[a]! Страх настигнет вас[b], и никто вам не поможет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможны оттенки: «бодрствующие», «бдительные» или «не спящие, чтобы замышлять зло». Здесь речь идёт о намеренной и неослабной устремлённости ко злу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «страх найдёт вас» либо «достигнет вас». Исходный глагол может означать «найти», «достичь» или «настичь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ
  choice: Горе
  rationale: Передаёт формулу пророческого обличения и грядущего суда, а не просто возглас печали.
- source_word: ግዙፋነ ልብ
  choice: ожесточённые сердцем
  rationale: Естественно по-русски выражает внутреннее упорство и нравственную нечувствительность, сохраняя образ сердца.
- source_word: ትተግሁ
  choice: неусыпно
  rationale: Передаёт бодрствование, бдительность и намеренную устремлённость к действию, не создавая узкой ассоциации с караульной службой.
- source_word: ከመ ትሰብውዎ ለእኩይ
  choice: замышляющие зло
  rationale: Передаёт целенаправленное обдумывание и подготовку зла; причастная конструкция звучит естественно в современном русском.
- source_word: ፍርሀት
  choice: страх
  rationale: Сохраняет широкое значение исходного существительного, не усиливая его без необходимости до «ужаса».
- source_word: ይረክብክሙ
  choice: настигнет вас
  rationale: Глагол допускает значения «найти», «достичь», «настичь»; выбранный вариант естественно выражает неизбежность приближающегося воздаяния.
- source_word: ወአልቦ ዘይረድአክሙ
  choice: и никто вам не поможет
  rationale: Ясно и прямо передаёт отсутствие помощника и избавления.
theological_decisions:
- issue: Характер провозглашённого горя
  choice: Пророческое обличение нравственно ожесточённых людей, которым грозит неизбежный суд
  alternative: Общий плач о грешниках или предупреждение лишь о психологической тревоге
  rationale: Начальное «горе», намеренное замышление зла и отсутствие помощи вместе образуют формулу суда; при этом перевод не уточняет, кто именно приводит приговор в исполнение.
