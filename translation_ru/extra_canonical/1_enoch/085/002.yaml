base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/002.yaml
  text: 'And Enoch lifted up his voice and said to his son Methuselah[a], “To you I speak, my son: hear my words, and incline your ear to the vision of your father’s dream.”'
translation:
  language: ru
  text: 'И Енох возвысил голос и сказал своему сыну Мафусалу: «К тебе обращаюсь, сын мой: выслушай мои слова и внимай видению, которое твой отец видел во сне[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к видению сна твоего отца». В геэзском выражении соединены слова, обозначающие видение и сон.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አንሥአ
  choice: возвысил голос
  rationale: Глагол означает «поднять, возвысить»; в формуле, вводящей речь, подразумеваемое «голос» делает выражение естественным по-русски и сохраняет торжественный тон.
- source_word: ወይቤ
  choice: сказал
  rationale: Обычный повествовательный глагол речи, переданный прозрачным современным соответствием.
- source_word: ለወልዱ ማቱሳላ
  choice: своему сыну Мафусалу
  rationale: Передаёт адресата и родство; имя дано в принятой русской библейской форме.
- source_word: ለከ እብለከ
  choice: К тебе обращаюсь
  rationale: Начальная позиция местоимения сохраняет усиленное выделение адресата, а «обращаюсь» естественнее по-русски, чем буквальное повторение «тебе говорю тебе».
- source_word: ወልድየ
  choice: сын мой
  rationale: Сохраняет звательную функцию, семейную близость и наставительный тон.
- source_word: ስማዕ ነገርየ
  choice: выслушай мои слова
  rationale: Повеление внимать речи передано естественным русским выражением без ослабления призыва.
- source_word: አጽንን እዝነከ
  choice: приклони ухо
  rationale: Сохраняет конкретный образ внимательного слушания и возвышенный, но понятный регистр.
- source_word: ለርእየ ሕልመ
  choice: к видению из сна
  rationale: Передаёт одновременно зрительно-визионерский и сновидческий компоненты исходного выражения, не сводя его просто к сну.
- source_word: አቡከ
  choice: твоего отца
  rationale: Сохраняет форму обращения к сыну и указывает, что сон принадлежит его отцу, Еноху.
theological_decisions:
- issue: Передача выражения ርእየ ሕልመ, сочетающего видение и сон
  choice: видение из сна
  alternative: видение сна; сновидение
  rationale: Выбранный вариант удерживает и визуально-откровенный характер переживания, и его связь со сном, не устраняя присущую исходной фразе неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Формы «возвысил голос» и «приклони ухо» сохраняют образность исходного текста, оставаясь понятными современному читателю.
