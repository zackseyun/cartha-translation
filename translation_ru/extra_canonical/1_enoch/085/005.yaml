  text: And that black heifer grew up[b][a], and she came
translation:
  language: ru
  text: И та чёрная телица[a] выросла и пришла.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «теленок». Женский род глагола «пришла» позволяет уточнить: «телица».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝኩ
  choice: И та
  rationale: Сочетание передаёт соединительное «и» и указание на уже известное животное; чтение «и я увидел» не подтверждается данным эфиопским текстом.
- source_word: ጸሊም
  choice: чёрная
  rationale: Сохраняет конкретный цвет и символическую образность видения.
- source_word: ጣዕዋ
  choice: телица
  rationale: Слово обозначает молодое животное из крупного рогатого скота; «телица» согласуется с женским родом последующего глагола и подходит возвышенному повествовательному регистру лучше, чем разговорно окрашенная в современном русском «тёлка».
- source_word: ላህቀ
  choice: выросла
  rationale: Это глагол со значением роста или достижения зрелости, а не указательное слово.
- source_word: ወመጽአት
  choice: и пришла
  rationale: Форма глагола женского рода единственного числа буквально обозначает приход и поддерживает отнесение образа к телице.
theological_decisions:
- issue: Символический образ животного в «Апокалипсисе животных»
  choice: Сохранить конкретный образ чёрной телицы без исторического истолкования.
  alternative: Заменить животное обозначением предполагаемого народа, правителя или иной исторической фигуры.
  rationale: Перевод должен сохранять апокалиптическую образность и её возможную многозначность; историческая идентификация относится к комментарию.
translation_notes:
  register: 'Современный литературный русский язык с кратким, последовательным синтаксисом оригинала. Выбрано слово «телица»: оно сохраняет достоинство библейского повествования и избегает современного разговорного оттенка слова «тёлка».'
