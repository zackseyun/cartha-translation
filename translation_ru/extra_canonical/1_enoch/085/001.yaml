lexical_decisions:
- source_word: እምድኅረዝ
  choice: После этого
  rationale: Передаёт формулу временного перехода к следующему видению естественным современным русским языком.
- source_word: ካልአ ሕለመ
  choice: другой сон
  rationale: Обозначает новый сон, отличный от предыдущего; «другой» здесь естественнее, чем порядковое «второй».
- source_word: ርኢኩ
  choice: я увидел
  rationale: Сохраняет прямую форму повествования от первого лица и образный язык видения.
- source_word: ኵሎ ሕልመ
  choice: весь этот сон
  rationale: Сочетание с существительным в единственном числе и непосредственная отсылка к только что упомянутому другому сну указывают на сон во всей его полноте; указательное «этот» естественно выражает анафорическую связь по-русски.
- source_word: አርእየከ
  choice: покажу тебе
  rationale: Передаёт каузативное значение «дать увидеть, показать», не заменяя зрительный образ более отвлечённым «расскажу».
- source_word: ወልድየ
  choice: сын мой
  rationale: Сохраняет непосредственное и уважительно-интимное обращение к сыну.
theological_decisions:
- issue: Объём значения ኵሎ ሕልመ
  choice: весь этот сон
  alternative: каждый сон / все сны
  rationale: 'Единственное число слова «сон» и ближайший антецедент — «другой сон» — поддерживают собирательное понимание: Енох покажет этот конкретный сон целиком. Возможное дистрибутивное прочтение сохранено в примечании.'
translation_notes:
  register: Современный литературный русский язык с сохранением простой, торжественной повествовательной интонации. Обращение «сын мой» оставлено в постпозиции ради достоинства и библейского ритма без архаизации.
