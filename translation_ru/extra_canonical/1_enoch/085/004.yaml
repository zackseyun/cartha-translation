base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/004.yaml
  text: And that black calf struck the red calf and pursued it onto the earth[c][b][a], and after that I could no longer see that red calf.
translation:
  language: ru
  text: И тот чёрный телёнок ударил[a] красного телёнка и погнал его по земле[b], и после этого я больше не видел того красного телёнка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Глагол можно также перевести: «боднул» или «ранил».'
    reason: lexical_alternative
  - marker: b
    text: Пространственное выражение допускает также переводы «на землю» или «в землю»; последнее может подразумевать исчезновение под землёй.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጐድአ
  choice: ударил
  rationale: Глагол обозначает удар или причинение раны; «ударил» сохраняет насильственный характер действия, не уточняя без необходимости, что телёнок боднул другого.
- source_word: ጸሊም
  choice: чёрный
  rationale: Прямое и естественное обозначение цвета в контексте видения о животных.
- source_word: ጣዕዋ
  choice: телёнок
  rationale: Немаркированное существительное обозначает молодое животное крупного рогатого скота и здесь не требует женского рода; «телёнок» сохраняет возрастной образ и не декодирует символику.
- source_word: ቀይሕ
  choice: рыжий
  rationale: В отношении масти телёнка современное русское «рыжий» звучит естественнее буквального «красный», сохраняя цветовой контраст.
- source_word: ተለዎ
  choice: погнал
  rationale: После удара глагол описывает враждебное преследование; «погнал» естественно передаёт активное движение вслед за жертвой.
- source_word: ውስተ ምድር
  choice: по земле
  rationale: Фраза допускает несколько пространственных толкований. В основном тексте «по земле» передаёт преследование по поверхности, а альтернативы отмечены в сноске.
- source_word: አክሀልኩ እምሶቤሃ ርእዮቶ
  choice: после этого я больше не видел
  rationale: Естественно по-русски передаёт временной переход и прекращение видения рыжего животного.
theological_decisions:
- issue: Следует ли раскрывать значение животных как конкретных библейских персонажей
  choice: Сохранить в основном тексте образы чёрного и рыжего телят
  alternative: Назвать животных Каином и Авелем
  rationale: Апокалиптическое видение выражено посредством символических животных; перевод должен сохранять образный уровень текста, не подменяя его толкованием.
- issue: Пол и возраст, выраженные словом ጣዕዋ
  choice: Передать как «телёнок» без указания женского пола
  alternative: «тёлка» или «бычок»
  rationale: В данном стихе слово не снабжено явным показателем женского пола. «Телёнок» сохраняет неопределённость формы и не вносит лишнего уточнения.
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанной повествовательной интонацией. Повтор слова «телёнок» сохранён ради точности и прозрачности символического образа; архаизмы и преждевременное истолкование видения исключены.
