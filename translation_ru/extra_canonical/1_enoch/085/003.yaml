base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/003.yaml
  text: Before I took your mother Edna[a], I saw in a vision on my bed, and behold, a bull came up from the earth; and that bull was white. And after it there came out one heifer, and with her came out two bulls[c][b], and one of them was black and one red.
translation:
  language: ru
  text: 'Прежде чем я взял в жёны твою мать Эдну, я увидел во сне видение[a]: вот, из земли вышел бык, и был тот бык белым. Вслед за ним вышла одна телица, а вместе с ней вышли два быка[b]; один из них был чёрным, а другой — красным.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «я увидел в видении моего ложа»; возможный смысл: «я увидел в сонном видении».'
    reason: lexical_alternative
  - marker: b
    text: Образы животных здесь принадлежат символическому языку Видений снов; перевод сохраняет образы самого видения, не подставляя вместо них предполагаемые отождествления.
    reason: cultural_note
lexical_decisions:
- source_word: እንበለ፡ እንሥአ፡ ለአምክ፡ ኤድና
  choice: Прежде чем я взял в жёны твою мать Эдну
  rationale: Передаёт временное значение начальной конструкции и естественно выражает брачный смысл глагола в современном русском языке.
- source_word: ርኢኩ፡ በራእየ፡ ምስካብየ
  choice: я увидел видение на своём ложе
  rationale: Сохраняет явное слово «видение» и связь переживания со сном или ложем, не заменяя апокалиптическую лексику общим описанием.
- source_word: ላህም
  choice: бык
  rationale: Мужское животное противопоставлено далее тёлке; «бык» ясно сохраняет пол и символический образ.
- source_word: ወፅአ፡ እምድር
  choice: из земли вышел
  rationale: Прямо передаёт движение наружу из земли и сохраняет зримую образность видения.
- source_word: ጸዓዳ
  choice: белым
  rationale: Простое цветообозначение важно для символического контраста и не требует усиления.
- source_word: ጣዕዋ፡ እንስቲያት፡ አሐቲ
  choice: одна телица
  rationale: Передаёт как женский пол животного, так и явно указанное число; «телица» естественна в русском библейско-литературном регистре.
- source_word: ወምስሌሃ፡ ወፅኡ፡ ክልኤቱ፡ ጣዕዋ
  choice: а вместе с ней вышли два бычка
  rationale: Сохраняет синтаксическую связь с появлением телицы и различает молодых животных от первого быка.
- source_word: ጸሊመ
  choice: чёрным
  rationale: Точно и прямо сохраняет цветовой контраст.
- source_word: ቀይሐ
  choice: красным
  rationale: Наиболее прозрачное соответствие цветовому термину без истолкования символики.
theological_decisions:
- issue: Символика животных в цикле видений
  choice: Сохранить животных как животных внутри повествования о видении
  alternative: Заменить их в основном тексте предполагаемыми человеческими прообразами
  rationale: Сам текст излагает видение посредством последовательной зооморфной символики. Указание предполагаемых отождествлений в переводе устранило бы образную форму и внесло бы толкование в основной текст.
- issue: Характер увиденного переживания
  choice: Перевести ራእይ как «видение» и сохранить связь с ложем
  alternative: Передать только как обычный сон или как «я видел своими глазами во сне»
  rationale: Так сохраняется специальный визионерский термин и одновременно не скрывается контекст сна.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным ритмом. «Вот» сохраняет визионерскую непосредственность; «ложе» уместно в древнем контексте и позволяет передать двусмысленность сочетания сна и места сна. Для ጣዕዋ выбраны «телица» и «бычки», чтобы естественно обозначить пол молодых животных и отличить их от первого взрослого быка.
