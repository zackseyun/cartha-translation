base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/010.yaml
  text: 'And now I know this mystery: that many sinners will alter the word of righteousness and pervert it[a], and speak evil words and lie, and they will devise great fabrications[d][c][b], and they will write books concerning their own words.'
translation:
  language: ru
  text: 'И теперь я знаю эту тайну: многие грешники исказят и извратят слово праведности[a], будут говорить злые слова и лгать, будут измышлять великие вымыслы[b] и писать книги о собственных словах.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Чтение и значение второго геэзского глагола не вполне надёжны; возможно также: «и уклонятся» или «и собьются с пути».'
    reason: alternative_reading
  - marker: b
    text: 'Или: «великие измышления» либо «великие сочинения». Геэзское выражение буквально связано с созданием или формированием чего-либо; отрицательный оттенок определяется контекстом лжи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አአምር
  choice: я знаю
  rationale: Настоящее время естественно передаёт заявление о знании, введённое словами «и теперь».
- source_word: ምሥጢር
  choice: тайна
  rationale: В апокалиптическом контексте обозначает прежде сокрытое, но открытое знание.
- source_word: ነገረ ርትዕ
  choice: слово праведности
  rationale: Сохраняет компактную конструкцию оригинала и не сводит её однозначно ни к учению, ни к отдельному высказыванию.
- source_word: ይመይጡ
  choice: исказят
  rationale: Активная форма с субъектом «многие грешники» и объектом «слово праведности» означает изменение или искажение, а не пассивное пренебрежение.
- source_word: የዐልዉ
  choice: извратят его
  rationale: В данном синтаксическом и полемическом контексте передаёт дальнейшее извращение слова; местоимение делает объект ясным, однако чтение формы остаётся не вполне надёжным.
- source_word: ነገራተ እኩያተ
  choice: злые слова
  rationale: Последующие глаголы «лгать» и «писать» указывают прежде всего на словесное содержание.
- source_word: ይሐስዉ
  choice: лгать
  rationale: Прямой и естественный русский эквивалент сохраняет резкость обвинения.
- source_word: ይፈጥሩ ፍጥረተ ዐቢየተ
  choice: сочинять великие измышления
  rationale: Однокоренная конструкция означает создание или формирование; контекст лжи придаёт создаваемому отрицательный смысл, а «сочинять» уместно перед упоминанием книг.
- source_word: መጻሕፍተ ይጽሐፉ ዲበ ነገራቲሆሙ
  choice: писать книги о собственных словах
  rationale: Близко передаёт связь книг с тем, что сами грешники говорят, не превращая фразу в осуждение книгописьма как такового.
theological_decisions:
- issue: Кто изменяет слово праведности
  choice: Многие грешники активно искажают его.
  alternative: Словом праведности будут пренебрегать.
  rationale: Геэзская форма глагола активна и согласуется с субъектом во множественном числе; такое прочтение также сохраняет предупреждение о намеренном искажении.
- issue: Относится ли осуждение к написанию книг вообще
  choice: Осуждаются книги, основанные на собственных ложных словах грешников.
  alternative: Стих осуждает написание книг как таковое.
  rationale: Финальная фраза синтаксически связана с предшествующими злыми словами, ложью и измышлениями.
- issue: Степень уверенности в значении የዐልዉ
  choice: Передано как дальнейшее извращение слова.
  alternative: «уклонятся» или «собьются с пути».
  rationale: Форма и чтение трудны; основной текст следует контексту и доступной редакционной традиции, а подлинная неопределённость отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Синтаксис слегка упрощён ради ясности, но повторяющаяся цепь будущих действий и выражение «слово праведности» сохранены.
