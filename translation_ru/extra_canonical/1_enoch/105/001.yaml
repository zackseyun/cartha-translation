base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/001.yaml
  text: The glory of the Great One[b][a], and your names shall be written before the glory of the Great One.
translation:
  language: ru
  text: Слава Великого[a] — и ваши имена будут записаны пред славой Великого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В геэзском тексте выражение «слава Великого» повторено в начале и в конце стиха. Повтор сохранён как торжественное обрамление обещания.
    reason: lexical_alternative
lexical_decisions:
- source_word: ስብሐቲሁ
  choice: слава
  rationale: Слово может означать славу, хвалу или великолепие; в контексте записи имён перед этой реальностью «слава» лучше всего сохраняет возвышенный апокалиптический образ.
- source_word: ለዐቢይ
  choice: Великого
  rationale: 'Форма с частицей la- в сочетании с предшествующим местоименным суффиксом выражает принадлежность: «слава Великого». Прилагательное употреблено субстантивно как почтительный божественный титул.'
- source_word: ወእስማቲከሙ
  choice: и ваши имена
  rationale: В исходном тексте стоит множественное число с суффиксом второго лица множественного числа; обращение к группе сохранено.
- source_word: ይጸሐፍ
  choice: будут записаны
  rationale: Глагол означает «писать, записывать»; будущее время естественно передаёт обещание, не усиливая образ до более узкого «начертаны».
- source_word: በቅድመ
  choice: пред
  rationale: Предлог означает «перед, в присутствии». «Пред» сохраняет торжественный регистр и пространственно-присутственный оттенок исходного выражения.
theological_decisions:
- issue: Передача повторённого ስብሐቲሁ как «слава» или «хвала»
  choice: слава
  alternative: хвала; великолепие
  rationale: Упоминание имён, записанных перед ней, указывает скорее на небесное присутствие и величие, чем только на совершаемый акт хвалы. «Слава» сохраняет апокалиптическую образность.
- issue: Грамматическая связь в начальном ስብሐቲሁ ለዐቢይ
  choice: слава Великого
  alternative: Его слава велика
  rationale: Конструкция представляет собой генитив с предваряющим местоименным суффиксом, а не именное сказуемое; поэтому начало повторяет выражение «слава Великого».
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Тире помогает естественно передать фрагментарное или присоединительное начало исходной фразы, не превращая его в отдельное утверждение «Его слава велика».
