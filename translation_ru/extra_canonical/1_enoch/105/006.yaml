base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/006.yaml
  text: And now[a], righteous ones, do not fear when you see sinners growing strong and prospering in their ways. Do not become their companions, but keep far from their violence[b]; for you shall be companions of the good ones of heaven.
translation:
  language: ru
  text: И теперь не бойтесь, праведные, когда увидите, что грешники крепнут и преуспевают на своих путях. Не будьте их спутниками, но держитесь вдали от их насилия[a], ибо вы будете спутниками благих на небесах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от их угнетения»; слово может обозначать насильственную несправедливость или притеснение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትፍርሁ
  choice: не бойтесь
  rationale: Отрицательное повеление, прямо обращённое к праведным; краткая современная формулировка сохраняет увещательный тон.
- source_word: ጻድቃን
  choice: праведные
  rationale: Сохраняет устойчивое обозначение нравственно-эсхатологической группы и её противопоставление грешникам.
- source_word: ይጸንዑ
  choice: крепнут
  rationale: Передаёт становление сильными или упрочение положения грешников, не уточняя сверх текста, в чём именно состоит их сила.
- source_word: ይደልዉ
  choice: преуспевают
  rationale: Естественно выражает видимый успех грешников и хорошо сочетается с образом их путей.
- source_word: ፍኖቶሙ
  choice: на своих путях
  rationale: Сохраняет метафору пути как образа поведения и жизненного образа.
- source_word: ሱቱፋነ
  choice: быть заодно / быть вместе
  rationale: 'Два вхождения переданы параллельными выражениями совместности. Разные русские формулировки нужны для естественности: первая обозначает опасную солидарность с грешниками, вторая — обещанное общение с благими.'
- source_word: ርሐቁ
  choice: держитесь вдали
  rationale: Передаёт повеление сознательно отстраниться.
- source_word: ግፍዐ
  choice: насилие
  rationale: Слово обозначает насильственную несправедливость или угнетение; основной текст сохраняет резкость предупреждения.
- source_word: ኄራነ ሰማይ
  choice: благие на небесах
  rationale: ኄራነ — форма множественного числа от слова со значением «благой, добрый», а не «воинство». Перевод сохраняет личный и коллективный смысл, не сужая группу до одних ангелов.
theological_decisions:
- issue: Кто такие «благие на небесах»
  choice: 'Оставить широкое обозначение небесного сообщества: «благие на небесах».'
  alternative: «ангелы на небесах»; «небесное воинство»
  rationale: Эфиопское выражение называет их «благими» и не отождествляет прямо с ангелами или воинством. Широкая формулировка сохраняет неопределённость и этический контраст с грешниками.
- issue: Характер связи с грешниками и благими
  choice: 'Передать как солидарность и совместность: «быть заодно» и «быть вместе».'
  alternative: 'Повторить одно существительное в обоих случаях: «сообщники» или «спутники».'
  rationale: В источнике повтор создаёт параллель, однако буквальное повторение по-русски либо придаёт положительной половине преступный оттенок («сообщники»), либо ослабляет отрицательную («спутники»). Выбранные выражения сохраняют смысловой параллелизм без неуместной коннотации.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического увещания. Синтаксис ясен для обычного читателя; сохранены обращения «праведные», образ путей и противопоставление земных грешников благим на небесах. Ошибочное чтение «небесное воинство» не принято.
