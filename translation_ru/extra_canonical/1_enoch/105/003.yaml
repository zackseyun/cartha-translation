base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/003.yaml
  text: And as for your cry[a], cry out, and he will make it appear to you[e][d][c][b]; for all your affliction will be sought out from the angels and from all those who helped those who plundered you.
translation:
  language: ru
  text: И что до вашего вопля — взывайте, и он явит вам это[a], ибо всё ваше страдание будет расследовано у ангелов[b] и у всех тех, кто помогал грабившим вас[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «и он покажет вам это» или «и он откроет вам это». Этот участок эфиопского текста труден; возможно и безличное понимание: «и это явится вам».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «у властителей». Слово обычно означает «ангелы» или «вестники», но может обозначать также начальников и правителей. Связь предлога «от/у» с глаголом расследования здесь не вполне ясна.'
    reason: alternative_reading
  - marker: c
    text: То есть пособников тех, кто грабил адресатов. Заключительная фраза синтаксически сжата, однако оба глагола означают соответственно «помогать» и «грабить, разорять».
    reason: syntax_clarification
lexical_decisions:
- source_word: ወጽራኅ … ጽርኁ
  choice: И что до вашего вопля — взывайте
  rationale: Сохраняет повтор корня со значением громкого зова и побудительную силу текста, не добавляя отсутствующего в источнике уточнения «о суде».
- source_word: ወያስተርኢ ለክሙ
  choice: и Он явит вам это
  rationale: Каузативная форма глагола зрения допускает значения «покажет», «явит», «откроет». «Явит» передаёт откровенный характер действия и сохраняет подразумеваемого личного деятеля.
- source_word: ኵሉ ምንዳቤክሙ
  choice: всё ваше страдание
  rationale: Существительное охватывает страдание, бедствие и угнетение; «страдание» естественно по-русски и не сужает смысл до одного вида притеснения.
- source_word: ይትኃሠሥ
  choice: будет расследовано
  rationale: Передаёт пассивное значение поиска и исследования, уместное в судебно-апокалиптическом контексте.
- source_word: መላእክት
  choice: ангелов
  rationale: Обычное значение слова в 1 Еноха — небесные существа. Вариант «властители» возможен по контексту, но менее прям и отмечен в сноске.
- source_word: እለ አርደእዎሙ
  choice: тех, кто помогал
  rationale: Глагол ረድአ означает «помогать, содействовать», а не «угнетать».
- source_word: ለእለ የሀይዱክሙ
  choice: грабившим вас
  rationale: Глагол ሀየደ означает грабить, разорять или похищать; перевод сохраняет отношение содействия между двумя группами.
theological_decisions:
- issue: Кто подразумевается под መላእክት
  choice: небесные ангелы
  alternative: земные властители или начальники
  rationale: Основное употребление термина в апокалиптическом мире 1 Еноха указывает на ангелов. Однако непосредственный контекст страдания, пособничества и грабежа допускает социально-политическое понимание, поэтому оно не исключено молча, а вынесено в сноску.
- issue: Подразумеваемый субъект в выражении ወያስተርኢ ለክሙ
  choice: «Он явит вам это» с прописной буквы
  alternative: безличное «это явится вам» или «вам будет показано»
  rationale: Форма лучше соответствует личному каузативному действию. Прописная буква указывает на Бога в контексте обещания, но сноска сохраняет грамматически возможные варианты.
- issue: Связь помощников с грабителями в заключительной фразе
  choice: «тех, кто помогал грабившим вас»
  alternative: «тех, кто помогал им, — тем, кто грабил вас»
  rationale: Такой перевод следует лексическим значениям обоих глаголов и наиболее естественно передаёт цепочку дополнений, не превращая помощь в угнетение и грабёж — в духовное заблуждение.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Повтор «вопля — взывайте» намеренно сохраняет риторическую настойчивость оригинала. Неясности в раскрывающем глаголе, значении слова «ангелы» и конструкции с предлогом «от» отмечены сносками, а не сглажены конфессиональным толкованием.
