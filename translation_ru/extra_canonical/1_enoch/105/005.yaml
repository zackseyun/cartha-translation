base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/005.yaml
  text: What will you have to do? You will not have to hide on the day of the great judgment[a], and you will not be found as sinners[c][b]; and everlasting judgment will be upon you for all the generations of the world.
translation:
  language: ru
  text: Что вам предстоит делать? Вам не придётся скрываться в день великого суда, и вас не признают грешниками[a]; вечный суд будет далёк от вас[b] на протяжении всех поколений мира.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и вы не будете найдены как грешники». Фраза в эфиопском тексте синтаксически необычна; предлагалось также понимать или исправлять её в смысле «вас признают грешниками», однако здесь сохранено имеющееся отрицание.'
    reason: textual_variant
  - marker: b
    text: 'Буквально: «вечный суд будет от вас»; по смыслу — будет удалён, далёк от вас. Перевод «будет на вас» встречается как контекстуальное толкование, но не передаёт обычного значения предлога.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ምንተ፡ ሀለወክሙ፡ ትግበሩ
  choice: Что вам предстоит делать?
  rationale: Буквально конструкция сочетает вопросительное «что», бытийно-посессивную форму «есть/имеется у вас» и глагол «делать». Русская формулировка сохраняет краткий риторический вопрос, не расширяя его смысл.
- source_word: አኮ፡ ትትኀብኡ
  choice: Вам не придётся скрываться
  rationale: T-форма глагола допускает возвратное значение «скрываться». В контексте утешения праведных отрицание естественно передаёт отсутствие необходимости прятаться, а не невозможность быть сокрытыми.
- source_word: በዕለተ፡ ኵነኔ፡ ዐቢይ
  choice: в день великого суда
  rationale: Прямое и естественное соответствие апокалиптической временной формуле; определённость события выражена контекстом.
- source_word: ወኢትትረከቡ፡ ከመ፡ ኃጥኣን
  choice: и вас не признают грешниками
  rationale: 'Буквально: «и вы не будете найдены как грешники». «Не признают грешниками» естественно передаёт судебный оттенок глагола «быть найденным», а трудность конструкции отмечена в сноске.'
- source_word: ኵነኔ፡ እንተ፡ ለዓለም
  choice: вечный суд
  rationale: Буквально «суд, который навеки». Выражение передаёт длительность, не заменяя «суд» более доктринально нагруженным словом «осуждение».
- source_word: ትከዉን፡ እምኔክሙ
  choice: будет далёк от вас
  rationale: 'Предлог እም с местоименным суффиксом буквально обозначает исходную точку: «от вас». С учётом утешительного контекста сочетание выражает удалённость суда; перевод «на вас» противоречил бы обычному значению предлога.'
- source_word: ለእሉ፡ ትዉልደ፡ ዓለም
  choice: во все поколения мира
  rationale: Сохраняется необычный образ сменяющихся поколений мира и продолжительное временное значение фразы.
theological_decisions:
- issue: Направлен ли вечный суд на адресатов или удалён от них
  choice: «вечный суд будет далёк от вас»
  alternative: «вечный суд будет на вас»
  rationale: Эфиопский предлог означает «от вас», а ближайший контекст утешает праведных. Поэтому значение удаления сохраняет и грамматику, и ход мысли, не превращая обещание в угрозу.
- issue: Смысл фразы о грешниках
  choice: «вас не признают грешниками» с текстологической сноской
  alternative: «вас признают грешниками» или «вы не будете найдены как грешники»
  rationale: В переданном эфиопском тексте отрицание присутствует. Оно сохранено, хотя синтаксис необычен; молчаливое изъятие отрицания было бы недопустимой конъектурой.
translation_notes:
  register: 'Современный литературный русский язык с торжественной, но понятной судебно-апокалиптической лексикой. Необычность исходного текста не скрыта: основная строка читается естественно, а реальные лексические и текстологические трудности вынесены в сноски.'
