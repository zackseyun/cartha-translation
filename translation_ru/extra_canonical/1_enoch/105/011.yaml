base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/011.yaml
  text: And when they write all the words truthfully in their languages[a], and neither alter nor omit anything from my words[d][c][b], but write down everything truthfully—all the former things—
translation:
  language: ru
  text: И когда они верно запишут все слова на своих языках[a], ничего не изменят и не опустят из моих слов, но верно запишут всё, всё прежнее[b], —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на их языках»; в контексте записи это может означать передачу слов на языках различных общин.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительное выражение в эфиопском тексте сжато; возможно также: «всё написанное прежде».'
    reason: alternative_reading
lexical_decisions:
- source_word: ወሶበሰ፡
  choice: И когда
  rationale: Передаёт соединительный и временной характер оборота, не превращая его в самостоятельное утверждение.
- source_word: ኵሎ፡ ነገራተ፡
  choice: все слова
  rationale: Существительное стоит как прямое дополнение и не имеет здесь суффикса первого лица; значение «слова» подтверждается дальнейшим выражением «из моих слов».
- source_word: ይጽሐፉ፡
  choice: они … запишут
  rationale: Активная форма согласуется с последующими активными глаголами и естественно передаётся совершенным видом в придаточном времени.
- source_word: በርትዕ፡
  choice: правдиво
  rationale: Сохраняет сочетание смыслов истинности, правильности и верности при передаче текста.
- source_word: ዲበ፡ ልሳናቲሆሙ፡
  choice: на своих языках
  rationale: Буквально говорится «на/в их языках»; в контексте записи речь естественно идёт о языках разных общин.
- source_word: ወኢይዌልጡ፡
  choice: ничего не изменяя
  rationale: Передаёт запрет изменять или искажать текст и естественно сочетается с последующим запретом опускать.
- source_word: ወኢየሐጽጹ፡
  choice: не опуская
  rationale: В данном текстовом контексте глагол удаления или убавления означает пропуск части слов.
- source_word: እምነገራቲየ፡
  choice: из моих слов
  rationale: Сохраняет явно выраженный суффикс первого лица и повтор ключевого слова.
- source_word: አላ፡
  choice: но
  rationale: Передаёт противопоставление искажению и пропуску — верную запись всего содержания.
- source_word: ኵሎ፡ በርትዕ፡ ይጽሐፉ፡
  choice: но правдиво запишут всё
  rationale: Сохраняет намеренный повтор требования о полной и верной записи.
- source_word: ኵሎ፡ ዘቀዳሚ፡
  choice: всё прежнее
  rationale: Передаёт сжатое буквальное выражение «всё бывшее прежде», не добавляя отсутствующего в оригинале глагола «написано».
theological_decisions:
- issue: Характер требуемой верности
  choice: Текст говорит о верной письменной передаче слов на разных языках без изменения и пропусков.
  alternative: Общее наставление о правдивой речи или об устном провозглашении.
  rationale: Повтор глагола «писать» и парный запрет изменять и убавлять указывают прежде всего на точность письменной передачи, хотя слово «языки» буквально связано также с органом речи.
- issue: Смысл заключительного выражения
  choice: Сохранено неопределённое «всё прежнее».
  alternative: «Всё написанное прежде».
  rationale: Контекст допускает подразумеваемую ссылку на ранее записанное, однако в самом сжатом эфиопском выражении глагол «писать» отсутствует; поэтому его не следует молча добавлять в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего наставления. Синтаксическая незавершённость конца стиха сохранена с помощью конечного тире, поскольку фраза продолжает более широкий контекст. Формулировки не вводят конфессиональных уточнений.
