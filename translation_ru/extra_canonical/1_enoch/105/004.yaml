base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/004.yaml
  text: Hope[a], and do not abandon your hope, for great joy will be yours[b], like the angels of heaven.
translation:
  language: ru
  text: Надейтесь и не оставляйте своей надежды, ибо вас ожидает великая радость, подобная радости небесных ангелов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как небесные ангелы». Сравнение выражено прямо, однако не уточняется, в чём именно состоит подобие: в радости, блаженном состоянии или небесной награде.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስፈዉ
  choice: Надейтесь
  rationale: Форма повелительного наклонения от корня со значением надежды и упования; прямой призыв передан без добавления отсутствующего в источнике объекта.
- source_word: ወኢትኅድጉ ተስፋክሙ
  choice: и не оставляйте своей надежды
  rationale: Отрицательное повеление сохраняет значение оставления или утраты, а повтор слова «надежда» воспроизводит риторический повтор источника.
- source_word: እስመ
  choice: ибо
  rationale: Союз вводит основание для призыва; «ибо» соответствует возвышенному, но понятному повествовательному регистру.
- source_word: ትከዉኑ ለክሙ
  choice: вам предстоит
  rationale: Естественно передаёт будущую конструкцию с дательным местоимением, не делая радость предметом буквального обладания.
- source_word: ፍሥሓ ዐቢይ
  choice: великая радость
  rationale: Прямо передаёт существительное с прилагательным и сохраняет торжественный характер обещания.
- source_word: ከመ መላእክተ ሰማይ
  choice: подобно небесным ангелам
  rationale: Сохраняет явное сравнение, не превращая его в утверждение о том, что праведники станут ангелами.
theological_decisions:
- issue: Смысл сравнения с небесными ангелами
  choice: Сохранено общее сравнение с небесными ангелами без уточнения его основания.
  alternative: Истолковать выражение как обещание такой же радости, как у ангелов, совместной радости с ангелами либо ангелоподобного состояния.
  rationale: Эфиопский текст содержит простое сравнительное выражение и не определяет, относится ли подобие именно к радости, блаженному состоянию или небесной награде; он также не говорит о превращении людей в ангелов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «надейтесь — надежды» сохранён как значимый приём исходного текста; синтаксис сделан естественным для современного читателя.
