base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/002.yaml
  text: Hope[a], for formerly you were put to shame by evil and by affliction; but now you will shine like the light of heaven, you will shine and be seen[c][b], and the portals of heaven will be opened for you.
translation:
  language: ru
  text: Надейтесь, ибо прежде вы были посрамлены злом и бедствием[a]; ныне же вы воссияете, как свет небесный, будете сиять и станете видимы, и врата неба откроются для вас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нечестием и страданием». Текст кратко связывает прежнее посрамление и со злом, и с бедствием, не уточняя их характера.'
    reason: lexical_alternative
  - marker: b
    text: Образ открытых врат неба не уточняет, нисходят ли через них благословения или входят ли через них сами праведные.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ተስፈዉ
  choice: Надейтесь
  rationale: Форма передаёт обращённое ко многим повеление и сохраняет прямую, возвышенную силу увещания.
- source_word: ቀዳሚ
  choice: прежде
  rationale: Наречие обозначает прежнее положение адресатов и образует ясный контраст с «ныне же».
- source_word: ኃሠርክሙ
  choice: вы были посрамлены
  rationale: Пассивная конструкция сохраняет смысл перенесённого позора и тему будущего оправдания; «посрамлены» уместно в достойном апокалиптическом регистре.
- source_word: በእኩይ
  choice: злом
  rationale: Творительный падеж сохраняет компактность и не решает, идёт ли речь о зле как обстоятельстве, нечестии или действиях злых людей.
- source_word: በምራኅ
  choice: бедствием
  rationale: Передаёт тяготу и несчастье без чрезмерного уточнения характера страдания.
- source_word: ትበርሁ
  choice: вы воссияете / будете сиять
  rationale: Повтор исходного глагола сохранён; видовая вариативность делает русский текст естественным, не устраняя повтор образа сияния.
- source_word: ብርሃነ ሰማይ
  choice: свет небесный
  rationale: Естественно передаёт генитивный образ «свет неба», сохраняя космическую образность.
- source_word: ትትረአዩ
  choice: станете видимы
  rationale: 'Сохраняет вероятное пассивное значение и последовательность: адресаты засияют и будут увидены.'
- source_word: ኆኅተ ሰማይ
  choice: врата неба
  rationale: ኆኅት обозначает дверь, ворота или портал; «врата» соответствует устойчивой космологии 1 Еноха и не подменяет образ «окнами».
- source_word: ይትረኀዉ ለክሙ
  choice: откроются для вас
  rationale: Передаёт пассивно-возвратное значение и оставляет невыраженным того, кто открывает врата.
theological_decisions:
- issue: Смысл открывающихся врат неба
  choice: 'Сохранён сам образ: врата неба откроются для праведных.'
  alternative: Небесные благословения изольются на них либо они войдут на небо.
  rationale: Текст не уточняет ни того, что из врат что-либо изливается, ни того, что адресаты входят через них; перевод не разрешает эту богословскую неопределённость.
- issue: Причина прежнего посрамления
  choice: «злом и бедствием» без уточнения деятеля или нравственной виновности адресатов
  alternative: «нечестием и страданием» либо «из-за злых людей и угнетения»
  rationale: Предлог በ допускает обстоятельственное и орудийное понимание, а существительные сами по себе не определяют, было ли зло личным, общественным или ситуативным.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Сохранены повтор глагола сияния, космический образ небесных врат и смысловая неопределённость исходного текста; архаизация ограничена словом «посрамлены» и образом «врата», понятными в библейском контексте.
