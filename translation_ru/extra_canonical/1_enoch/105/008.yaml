base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/008.yaml
  text: And now[a], I show you that light and darkness, day and night[b], see all your sins.
translation:
  language: ru
  text: И теперь я показываю вам[a], что свет и тьма, день и ночь[b] видят все ваши грехи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «я показываю вам: ведь…».'
    reason: Союз እስመ может быть понят не как изъяснительное «что», а как причинное «ведь».
  - marker: b
    text: Свет и тьма, день и ночь изображены здесь как свидетели, видящие всякий грех. Эти пары могут также подразумевать всё совершаемое явно и тайно, во всякое время.
    reason: Поясняет апокалиптический образ космических свидетелей, не подменяя им прямой смысл текста.
lexical_decisions:
- source_word: ወይ እዜኒ
  choice: И теперь
  rationale: Естественно передаёт временной и дискурсивный переход к настоящему заявлению.
- source_word: አነ አርእየክሙ
  choice: я показываю вам
  rationale: Сохраняет каузативно-зрительный образ исходного глагола и явное местоимение первого лица.
- source_word: እስመ
  choice: что
  rationale: После глагола «показываю» союз естественно вводит придаточное изъяснительное; возможное причинное прочтение сохранено в сноске.
- source_word: ብርሃን ወጽልመት
  choice: свет и тьма
  rationale: Прямая передача первой антонимической пары и образа всеохватного космического свидетельства.
- source_word: ዕለት ወሌሊት
  choice: день и ночь
  rationale: Сохраняет вторую меристическую пару, выражающую непрерывность и полноту.
- source_word: ይሬእዩ
  choice: видят
  rationale: Настоящее время передаёт постоянное действие; множественное число согласуется с перечисленными субъектами.
- source_word: ኵሎ ኃጢአትክሙ
  choice: все ваши грехи
  rationale: Сохраняет конкретное множественное число и всеохватное значение ኵሎ.
theological_decisions:
- issue: Являются ли свет, тьма, день и ночь действующими свидетелями или только обозначают обстоятельства совершения грехов
  choice: Свет, тьма, день и ночь представлены как видящие все грехи слушателей.
  alternative: Эти пары означают лишь грехи, совершаемые явно и тайно, днём и ночью.
  rationale: Ближайшими и наиболее естественными субъектами глагола во множественном числе служат перечисленные космические реалии. Апокалиптический образ свидетельствующего творения сохранён, а возможный подразумеваемый смысл отмечен в сноске.
- issue: Функция союза እስመ после глагола показа
  choice: Изъяснительное «что».
  alternative: Причинное «ведь» или «потому что».
  rationale: После глагола восприятия или сообщения союз естественно вводит содержание показываемого, однако грамматически возможная причинная связь не устранена и указана в сноске.
