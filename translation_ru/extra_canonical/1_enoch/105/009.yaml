base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/009.yaml
  text: Do not be wicked in your hearts[a], and do not lie, and do not alter the word of uprightness, and do not declare false the word of the Great Holy One, and do not account your idols as anything; for all your falsehood and all your uncleanness are not for righteousness[f][e][d][c][b], but for great sin.
translation:
  language: ru
  text: Не заблуждайтесь в сердцах ваших и не лгите; не искажайте слово правды[a] и не объявляйте ложным слово Великого Святого[b]; не считайте, что ваши идолы что-то значат[c], ибо вся ваша ложь и вся ваша нечистота — не к праведности, а к великому греху.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не извращайте слово праведности». Слово, переведённое как «слово», может также означать «дело» или «вопрос».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «не объявляйте ложным великое святое слово». Сочетание слов допускает понимание как титула — «Великий Святой» — или как определения самого слова.'
    reason: textual_ambiguity
  - marker: c
    text: 'Глагол означает «считать, полагать, принимать за нечто»; возможно также: «не придавайте значения своим идолам».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትርሥዑ፡ በልብክሙ
  choice: Не заблуждайтесь в сердцах ваших
  rationale: Сохраняет внутреннюю направленность запрета и значение уклонения или заблуждения, не усиливая его до прямого «не грешите».
- source_word: ወኢተሐስዉ
  choice: и не лгите
  rationale: Прямой и естественный русский эквивалент простого глагола со значением лжи.
- source_word: ወአትሚጥዋ፡ ለነገረ፡ ርትዕ
  choice: не искажайте слово правды
  rationale: «Искажайте» передаёт изменение или извращение; «слово» соответствует речевому контексту, а «правда» сохраняет смысл правильности и истины.
- source_word: ወኢታሐስውዋ፡ ለነገረ፡ ቅዱስ፡ ዐቢይ
  choice: и не объявляйте ложным слово Великого Святого
  rationale: Каузативная форма глагола указывает не просто на ложную речь, а на объявление чего-либо ложным. Сочетание прилагательных естественно понято как титул лица — «Великий Святой» — при сохранении альтернативы в сноске.
- source_word: ወኢትሕስብዋ፡ ለጣዖትክሙ
  choice: не считайте ваших идолов чем-либо
  rationale: Передаёт значение счёта, признания или приписывания значения и сохраняет подразумеваемую ничтожность идолов, не заменяя мыслительный глагол идеями доверия или поклонения.
- source_word: እስመ፡ አኮነት፡ ኵሉ፡ ሐሰትክሙ፡ ወኵሉ፡ ርኩስነክሙ፡ ለጽድቅ፡ አላ፡ ለኃጢአት፡ ዐቢይ
  choice: ибо вся ваша ложь и вся ваша нечистота — не к праведности, а к великому греху
  rationale: Сохраняет краткую исходную конструкцию и её резкое противопоставление праведности великому греху, не уточняя сверх текста, идёт ли речь о принадлежности, назначении или результате.
theological_decisions:
- issue: Является ли «ቅዱስ ዐቢይ» титулом лица или определением слова
  choice: слово Великого Святого
  alternative: великое святое слово
  rationale: Синтаксис допускает напряжение между титулом и определением. Основной текст следует контекстуальному пониманию как титулу Бога, но реальная грамматическая альтернатива сохранена в сноске.
- issue: Как передать осуждение идолов при глаголе ትሕስብዋ
  choice: не считайте ваших идолов чем-либо
  alternative: не придавайте значения вашим идолам
  rationale: Выбран вариант, сохраняющий когнитивное значение «считать, принимать за нечто» и не привносящий отсутствующие в самой фразе понятия доверия или поклонения.
- issue: Как понимать заключительное противопоставление
  choice: не к праведности, а к великому греху
  alternative: не принадлежат праведности, а ведут к великому греху
  rationale: Более буквальная конструкция сохраняет неопределённость отношения лжи и нечистоты к праведности и греху, не превращая её однозначно в утверждение о результате.
translation_notes:
  register: Современный литературный русский с библейской торжественностью без архаизмов. Повтор запретов сохранён, но союзная цепочка слегка упорядочена русской пунктуацией. Формула «в сердцах ваших» намеренно оставлена возвышенной и близкой к источнику; двусмысленности в центральной сакральной формуле и заключительном противопоставлении не устранены без оговорки.
