base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/007.yaml
  text: And because you sinners say[a], ‘We are not sought out[d][c][b], and all our sins are not written down’—all your sins are being written down every day.
translation:
  language: ru
  text: 'И потому что вы, грешники, говорите: «Вы не расследуете[a], и всех наших грехов не записывают», — все ваши грехи записывают[b] каждый день.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Форма буквально может быть понята как «вы не расследуете (не разыскиваете)». Из-за необычной смены лиц некоторые понимают её по смыслу как «нас не разыскивают» или «нас не призывают к ответу».
    reason: Грамматическая форма и синтаксис переданного текста допускают спорное истолкование; буквальное чтение сохранено в основном тексте.
  - marker: b
    text: 'Буквально: «они пишут, пребывают», то есть «они продолжают записывать»; кто именно ведёт запись, здесь не сказано.'
    reason: Поясняет длительную конструкцию с вспомогательным глаголом и неуказанного деятеля.
lexical_decisions:
- source_word: ወእስመ
  choice: И потому, что
  rationale: Сохраняет причинную связь, выраженную союзом እስመ, и соединительный элемент ወ.
- source_word: ትብሉ አንትሙ ኃጥኣን
  choice: вы, грешники, говорите
  rationale: Местоимение второго лица и слово «грешники» относятся к подлежащему глагола «говорите», а не входят в самоцитирование грешников.
- source_word: ኢትኅሥሡ
  choice: Вы не расследуете
  rationale: Форма внешне соответствует второму лицу множественного числа и в судебном контексте допускает значение «расследовать, разыскивать». Необычность реплики сохранена, а возможное страдательное понимание отмечено в сноске.
- source_word: ኢይጽሐፉ
  choice: не записывают
  rationale: Глагол стоит в третьем лице множественного числа; русская неопределённо-личная конструкция сохраняет не названного в источнике деятеля.
- source_word: ይጽሐፉ ሀለዉ
  choice: записывают
  rationale: Сочетание имперфекта с ሀለዉ передаёт продолжающееся действие; ሀለዉ понято как вспомогательный глагол, а не как междометие «вот».
- source_word: በኵሉ ዕለት
  choice: каждый день
  rationale: Естественно передаёт распределительное значение выражения и непрерывность записи.
theological_decisions:
- issue: Характер записи грехов
  choice: Сохранён конкретный апокалиптический образ продолжающейся записи всех грехов перед судом.
  alternative: Передать это лишь как метафору Божьего знания.
  rationale: Повтор глагола «писать, записывать» поддерживает образ судебной записи; текст не уточняет её устройство или исполнителей.
- issue: Кто ведёт запись
  choice: 'Исполнитель не назван: «записывают».'
  alternative: 'Уточнить: «ангелы записывают» или «Бог записывает».'
  rationale: Эфиопский текст использует третье лицо множественного числа без явного подлежащего, поэтому богословское уточнение было бы добавлением.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптической судебной речи. Синтаксическая неровность внутри цитаты намеренно не устранена полностью, поскольку она присутствует в переданном геэзском тексте; сноска сообщает основную альтернативу без догматического выбора.
