base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/003.yaml
  text: And he answered me and said to me[a], “This is the Son of Man, to whom righteousness belongs, and righteousness dwells with him; and he will reveal all the treasuries of what is hidden, because the Lord of Spirits has chosen him[c][b], and his lot has prevailed before the Lord of Spirits forever in uprightness.”
translation:
  language: ru
  text: 'И он ответил мне и сказал: «Это Сын Человеческий, которому принадлежит праведность, и праведность пребывает с ним. Он откроет все сокровищницы сокрытого[a], потому что Господь духов избрал его, и жребий его восторжествовал пред Господом духов навеки в праведности[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все хранилища сокрытых вещей». Речь идёт не просто об отвлечённых тайнах, а о сокрытых реальностях, словно хранимых в небесной сокровищнице.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная фраза в тексте на геэз не вполне ясна. Возможны также переводы: «его доля восторжествовала» или, менее вероятно, понимание жребия как относящегося к тем, кто связан с ним.'
    reason: alternative_reading
lexical_decisions:
- source_word: ወልደ ሰብእ
  choice: Сын Человеческий
  rationale: В данном видении выражение обозначает определённую, узнаваемую фигуру и имеет характер титула; прописные буквы передают это, не добавляя позднейших доктринальных уточнений.
- source_word: ዘሎቱ ኮነ ጽድቅ
  choice: которому принадлежит праведность
  rationale: Конструкция выражает обладание или особую связь, а не просто качество; такой перевод сохраняет её относительную форму.
- source_word: ወጽድቅ ምስሌሁ ኃደረ
  choice: и праведность пребывает с ним
  rationale: Глагол означает пребывание или обитание. Формулировка сохраняет образ праведности как пребывающей рядом с этой фигурой.
- source_word: መዛግብተ ዘኅቡእ
  choice: сокровищницы сокрытого
  rationale: Существительное обозначает сокровищницы или хранилища; перевод сохраняет образ сокрытых небесных реальностей, находящихся в запасе.
- source_word: ይከሥት
  choice: откроет
  rationale: Будущее действие раскрытия сокрытого естественно передаётся глаголом «откроет».
- source_word: እግዚአ መንፈሳት
  choice: Господь духов
  rationale: Сохранён повторяющийся в 1 Еноха божественный титул без добавления определённого артикля, отсутствующего в русском языке.
- source_word: ኀረዮ ኃርየ
  choice: избрал его
  rationale: Однокоренное усиление в геэз передано естественным русским глаголом, неуклюжее буквальное удвоение не воспроизводится.
- source_word: ወዘክፍሉ ሞአ
  choice: и его жребий восторжествовал
  rationale: «Жребий» сохраняет образ назначенной доли, а «восторжествовал» передаёт победное значение глагола. Относительное ዘ семантически продолжает описание фигуры, но буквальное «и чей жребий» после причинного придаточного было бы грамматически неясно по-русски.
- source_word: በርቱዕ ለዓለም
  choice: навеки в правоте
  rationale: Фраза трудна; «в правоте» сохраняет нравственный смысл и избегает третьего повторения слова «праведность», а «навеки» передаёт длительность ለዓለም.
theological_decisions:
- issue: Титульное или нарицательное понимание ወልደ ሰብእ
  choice: Переведено как титул «Сын Человеческий».
  alternative: «сын человеческий» или «человек»
  rationale: В контексте Притч Еноха ангел указывает на определённую фигуру с особыми функциями. Перевод сохраняет локальный титульный характер, не отождествляя фигуру явным образом с какой-либо более поздней формулировкой.
- issue: Повторное упоминание праведности
  choice: 'Сохранены обе формулы: праведность ему принадлежит и пребывает с ним.'
  alternative: Сжать до «это Праведник».
  rationale: Повторение намеренно усиливает связь фигуры с праведностью; его устранение ослабило бы богословскую и поэтическую выразительность текста.
- issue: Неясная заключительная фраза о жребии
  choice: 'Основной текст: «его жребий восторжествовал… навеки в правоте».'
  alternative: «его доля одержала победу» либо отнесение жребия к связанным с ним людям
  rationale: Геэзская фраза трудна и допускает разные нюансы. Основной перевод следует наиболее вероятной грамматике, а неопределённость обозначена в примечании.
translation_notes:
  register: Современный литературный русский язык с dignified апокалиптическим звучанием. Синтаксис слегка возвышенный, но понятный; сохранены повтор «праведность», образ небесных сокровищниц и формула «Господь духов». Архаизм «пред» использован умеренно как естественный элемент сакрально-литературного регистра.
