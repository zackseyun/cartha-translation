  text: And these are those who judge the stars of heaven[a][b].
translation:
  language: ru
  text: И вот те, кто судит звёзды небес[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол можно также понимать в значении «править» или «управлять». Поскольку этот раздел фактически сохранился только на геэзе, точный оттенок значения следует передавать с осторожностью.
    reason: lexical_alternative
  - marker: b
    text: В апокалиптической литературе «звёзды» могут означать как небесные светила, так и небесных существ; сам текст не заставляет выбирать здесь одно из этих пониманий.
    reason: cultural_note
lexical_decisions:
- source_word: እሙንቱ
  choice: это те
  rationale: Множественное указательное местоимение сохраняет дейктическую силу описания видения; в сочетании с последующим относительным оборотом естественно передаётся по-русски как «это те, кто».
- source_word: ኮኑ
  choice: это
  rationale: Форма глагола «быть/становиться» здесь входит в именную отождествляющую конструкцию. В русском настоящем времени связка обычно опускается, поэтому сочетание እሙንቱ ኮኑ естественно передано как «это те».
- source_word: እለ
  choice: те, кто
  rationale: Относительный показатель вводит определяющую часть отождествляющей конструкции; русский оборот «те, кто» ясно сохраняет её структуру.
- source_word: ይኴንኑ
  choice: судит
  rationale: Основное значение глагола — «судить»; эта передача сохраняет судебную образность и не сводит её без достаточных оснований к простому управлению.
- source_word: ከዋክብተ ሰማይ
  choice: звёзды небесные
  rationale: Возвышенное и при этом понятное соответствие генитивной конструкции «звёзды неба/небес»; постпозиция определения уместна для апокалиптического регистра.
theological_decisions:
- issue: Следует ли смягчить судебный смысл, передав действие как управление космосом
  choice: судит звёзды небесные
  alternative: правит звёздами небесными / управляет звёздами небесными
  rationale: Геэзский глагол прежде всего допускает значение «судить». Поскольку звёзды в апокалиптической литературе могут обозначать как небесные светила, так и небесных существ, судебная формулировка сохраняет богословское напряжение текста и не подменяет его административным смыслом.
- issue: Следует ли прямо истолковать звёзды как небесных существ
  choice: звёзды небесные
  alternative: небесные существа / ангелы
  rationale: Сам стих не требует однозначной символической идентификации. Буквальный образ оставляет открытыми космическое и символическое прочтения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Формула «звёзды небесные» сохраняет образность оригинала, а конструкция «это те, кто» остаётся ясной для обычного читателя.
