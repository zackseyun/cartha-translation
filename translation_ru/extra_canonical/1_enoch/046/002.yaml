base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/002.yaml
  text: And I asked one of the angels who was going with me[a], and who was showing me all the hidden things, concerning that Son of Man—who he was, and from where he came[c][b], and why he was going with the Head of Days.
translation:
  language: ru
  text: 'И я спросил одного из ангелов, который шёл со мной и показывал мне всё сокрытое[a], об этом Сыне Человеческом: кто он, откуда он и почему идёт вместе с Главой Дней[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все тайны»; речь идёт о скрытых небесных реальностях, открываемых в видении.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Глава Дней». Традиционное выражение «Ветхий Днями» известно по Дан 7, но эфиопская формулировка здесь иная.'
    reason: cross_reference
lexical_decisions:
- source_word: ፩እመላእክት
  choice: одного из ангелов
  rationale: Передаёт партитивную конструкцию буквально и естественно по-русски, не добавляя отсутствующего в данном тексте определения «святых».
- source_word: ዘየሐውር ምስሌየ
  choice: который шёл со мной
  rationale: Сохраняет образ совместного движения в видении; прошедшее несовершенного вида согласуется с русским повествованием и передаёт длительность действия.
- source_word: ኵሎ ኅቡኣተ
  choice: всё сокрытое
  rationale: Передаёт совокупность скрытых небесных реалий без превращения выражения в специальный богословский термин.
- source_word: ዘያርእየኒ
  choice: показывал мне
  rationale: Сохраняет зрительный характер откровения и длительность действия.
- source_word: ወልደ ሰብእ
  choice: Сыне Человеческом
  rationale: В контексте это выделенная фигура видения. Прописные буквы отмечают употребление выражения как обозначения конкретной фигуры, не разрешая вопрос о её дальнейшей богословской идентификации.
- source_word: እምአይቴ ይከውን
  choice: откуда он
  rationale: Кратко и естественно передаёт вопрос о происхождении, не добавляя глагола «пришёл» или «явился», которого формально нет в выражении.
- source_word: ርእሰ መዋዕል
  choice: Главой Дней
  rationale: Прямо отражает эфиопское выражение «Глава Дней» и не подменяет его традиционным, но не тождественным по форме титулом из книги Даниила.
- source_word: ምስለ ... የሐውር
  choice: идёт вместе с
  rationale: Сохраняет повтор глагола движения и связь Сына Человеческого с Главой Дней, не уточняя характера этой связи.
theological_decisions:
- issue: Титульное или нарицательное понимание ወልደ ሰብእ
  choice: «этот Сын Человеческий» как обозначение конкретной фигуры видения
  alternative: «этот сын человеческий» или «этот человек»
  rationale: Указательное выражение и контекст вопроса выделяют определённую фигуру. Написание с прописных букв отражает литературную функцию обозначения, но само по себе не отождествляет фигуру с каким-либо более поздним вероучительным толкованием.
- issue: Соотношение ርእሰ መዋዕል с традиционным титулом из Дан 7
  choice: «Глава Дней»
  alternative: «Ветхий Днями»
  rationale: Основной текст следует форме эфиопского источника. Более привычное выражение указано в примечании, чтобы не проводить молчаливую гармонизацию.
- issue: Характер совместного движения Сына Человеческого и Главы Дней
  choice: «идёт вместе с»
  alternative: «сопровождает» или «пребывает при»
  rationale: Нейтральная передача сохраняет образ движения и не определяет иерархию или роль участников сверх сказанного в источнике.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис сделан ясным для обычного читателя; сохранены повтор глагола движения, вопрос о происхождении фигуры и непривычный титул «Глава Дней».
