base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/006.yaml
  text: And he will cast down the face of the strong ones[a], and he will fill them with shame; and darkness shall become their dwelling, and worms their bed. And they shall have no hope of rising from their beds[c][b], because they do not exalt the name of the Lord of Spirits.
translation:
  language: ru
  text: И он низвергнет лица сильных и наполнит их стыдом; тьма станет их жилищем, а черви[a] — их ложем. И не будет у них надежды подняться со своих лож[b], ибо они не возвеличивают имени Господа духов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Форма слова, переведённого как «черви», в данном геэзском свидетельстве не вполне надёжна; это значение соответствует образу тления на ложе, подобном могиле.
    reason: textual_variant
  - marker: b
    text: «Подняться со своих лож» может означать просто встать, но в этом контексте может также подразумевать отсутствие восстановления после суда.
    reason: lexical_alternative
lexical_decisions:
- source_word: ገጸ፡ ጽኑዓን
  choice: лица сильных
  rationale: Сохраняет конкретный образ «лица» и общее обозначение сильных или могущественных людей, не сужая его до царей либо правителей.
- source_word: ይገፈትእ
  choice: низвергнет
  rationale: Передаёт активную форму 3-го лица мужского рода и значение насильственного низложения; подразумеваемый субъект «он» продолжает действие из контекста.
- source_word: ይመልኦሙ፡ ኃፍረተ
  choice: наполнит их стыдом
  rationale: 'Сохраняет активную конструкцию: «он» наполняет их, а «стыд» выступает содержанием наполнения.'
- source_word: ጽልመት
  choice: тьма
  rationale: Прямой и естественный русский эквивалент, сохраняющий образ суда.
- source_word: መንደሪሆሙ
  choice: их жилищем
  rationale: Передаёт конкретное место обитания современным литературным словом.
- source_word: ዕፀያት
  choice: черви
  rationale: По контексту ложа и тьмы слово обозначает червей и создаёт образ тления; форма в данном свидетельстве текстуально не вполне надёжна.
- source_word: ምስካቦሙ
  choice: их ложем / со своих лож
  rationale: «Ложе» сохраняет повтор исходного слова и его погребальные обертоны, не превращая образ прямо в «могилу».
- source_word: ኢይሴፈዉ
  choice: не будет у них надежды
  rationale: Естественно передаёт отсутствие надежды или ожидания.
- source_word: ይትነሥኡ
  choice: подняться
  rationale: Сохраняет неоднозначность между буквальным вставанием и возможным намёком на восстание после смерти.
- source_word: ኢያሌዕሉ፡ ስሞ
  choice: не возвеличивают имени
  rationale: Передаёт значение возвышения или прославления имени, сохраняя торжественный регистр.
- source_word: እግዚአ፡ መናፍስት
  choice: Господа духов
  rationale: Буквально сохраняет характерный для 1 Еноха божественный титул без дополнительного определённого артикля, отсутствующего в русском.
theological_decisions:
- issue: Означает ли ይትነሥኡ воскресение или обычное поднятие с ложа
  choice: «подняться со своих лож»
  alternative: «быть воскрешёнными» или «встать»
  rationale: Контекст тьмы, червей и лож допускает посмертный смысл, однако сам глагол не требует явно воскресительного перевода; нейтральная формулировка сохраняет напряжение.
- issue: Кого обозначает ጽኑዓን
  choice: «сильных»
  alternative: «могущественных», «властителей»
  rationale: Исходное слово указывает на сильных или могущественных, но само по себе не называет их царями или правителями.
- issue: Грамматический субъект первых двух действий
  choice: активное «он низвергнет… и наполнит»
  alternative: пассивное «лица… будут низвергнуты, и стыд наполнит их»
  rationale: Обе глагольные формы имеют активный субъект 3-го лица мужского рода; «стыд» является дополнением при глаголе наполнения, а не подлежащим.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной апокалиптической лексикой. Конкретные образы лица, тьмы, червей и ложа сохранены; синтаксис сделан естественным, а богословски значимая неоднозначность глагола «подняться» не устранена.
