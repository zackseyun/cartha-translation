base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/004.yaml
  text: And this Son of Man whom you have seen will raise up kings and the mighty from their couches, and the strong from their thrones; and he will loosen the loins of the strong, and crush the teeth of sinners.
translation:
  language: ru
  text: И этот Сын Человеческий, которого ты видел, поднимет царей и могущественных с их лож[a], а сильных — с их престолов; он ослабит чресла сильных[b] и сокрушит зубы грешников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с их постелей». Здесь правителей заставляют подняться с мест покоя и безопасности.'
    reason: lexical_alternative
  - marker: b
    text: Эфиопское слово в этом месте не вполне ясно. Возможны также значения «узды» или «ремни»; кроме того, предполагают древнюю порчу текста. Перевод «ослабит чресла» следует библейскому образу распоясывания властителей, то есть лишения их силы.
    reason: textual_and_lexical_uncertainty
lexical_decisions:
- source_word: ወልደ ሰብእ
  choice: Сын Человеческий
  rationale: Сохранена буквальная семитская форма выражения. Заглавные буквы указывают на конкретную, уже явленную Еноху эсхатологическую фигуру, не привнося позднейших догматических уточнений.
- source_word: ዘርኢከ
  choice: которого ты видел
  rationale: Относительная конструкция прямо связывает эту фигуру с предшествующим видением Еноха.
- source_word: ያነሥኦሙ
  choice: поднимет
  rationale: Глагол буквально обозначает побуждение встать или поднятие. Дополнение «с их лож» показывает, что речь не о возвышении правителей, а о том, что их заставят покинуть место покоя.
- source_word: ነገሥት፡ ወኃያላን
  choice: царей и могущественных
  rationale: Переданы обе группы властителей без сведения их в одно обобщённое понятие.
- source_word: እምስካበቲሆሙ
  choice: с их лож
  rationale: Существительное может обозначать ложе или постель; «ложа» сохраняют возвышенный образ покоя и обеспеченности правителей.
- source_word: ጽኑዓን
  choice: сильных
  rationale: Повтор одного и того же обозначения сохранён и в следующей строке; это поддерживает риторическую связность стиха.
- source_word: መናብርቲሆሙ
  choice: с их престолов
  rationale: В царском и судебном контексте значение «престолы» естественнее общего «сиденья».
- source_word: ይፈትሕ፡ ለኃማተ፡ ጽኑዓን
  choice: ослабит чресла сильных
  rationale: Глагол имеет значение развязывания или ослабления. «Ослабит чресла» передаёт образ утраты силы и способности сопротивляться, избегая непонятного для современного читателя буквального «развяжет чресла»; текстовая и лексическая неуверенность отмечена в сноске.
- source_word: ይደቅቅ፡ አስናነ፡ ኃጥኣን
  choice: сокрушит зубы грешников
  rationale: Сохранён конкретный и резкий апокалиптический образ уничтожения хищной силы грешников.
theological_decisions:
- issue: Титульное или нарицательное понимание ወልደ ሰብእ
  choice: «Сын Человеческий» как обозначение конкретной фигуры видения
  alternative: «сын человеческий» или «человек» в общем смысле
  rationale: В контексте Притчей Еноха эта фигура индивидуализирована и исполняет эсхатологический суд. Перевод сохраняет исходную форму, не отождествляя её в самом тексте с более поздней богословской формулировкой.
- issue: Характер суда над правителями
  choice: 'Сохранить предметные образы: поднять с лож и престолов, ослабить чресла, сокрушить зубы'
  alternative: 'Передать отвлечённо: «низложит», «смирит» или «лишит власти»'
  rationale: Конкретные образы составляют поэтическую силу стиха и сохраняют напряжение между буквальной картиной и её смыслом как лишения власти и силы.
- issue: Толкование трудного ኃማተ
  choice: Основной текст следует пониманию «чресла», выражая действие как их ослабление
  alternative: «узды», «ремни» либо иной образ сдерживания и управления
  rationale: Понимание «чресла» согласуется с библейским образом распоясывания царей и с контекстом лишения сильных мощи, однако эфиопское чтение остаётся не вполне надёжным, поэтому альтернатива не скрыта.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Архаизирующее «чресла» сохранено точечно, поскольку обычное «поясница» плохо передаёт устойчивый образ силы и распоясывания; смысл пояснён в сноске. Синтаксис остаётся ясным для современного читателя, а повтор «сильных» намеренно не устранён.
