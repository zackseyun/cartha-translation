- source_word: ወምስሌሁ፡ ካልእ
  choice: С ним был другой
  rationale: Естественно вводит вторую фигуру, не приписывая ей отсутствующего здесь титула.
- source_word: ዘገጹ፡ ከመ፡ ርእየተ፡ ሰብእ
  choice: лицо которого было подобно облику человека
  rationale: Сохраняет явное сравнение ከመ и зрительный характер описания.
- source_word: ወምሉእ፡ ጸጋ፡ ገጹ
  choice: лицо его было исполнено благодати
  rationale: Прямо передаёт ጸጋ как «благодать», не устраняя возможные оттенки милости и благосклонности.
- source_word: ከመ፡ ፩እመላእክት፡ ቅዱሳን
  choice: словно у одного из святых ангелов
  rationale: 'Передаёт сравнительную и частичную конструкцию: речь идёт об одном из множества святых ангелов.'
theological_decisions:
- issue: Передача выражения ርእሰ መዋዕል традиционным титулом «Ветхий днями»
  choice: глава дней
  alternative: Ветхий днями
  rationale: Основной текст сохраняет собственную формулировку геэза и не гармонизирует её молча с традиционным переводом Дан 7.
- issue: Отождествление второй фигуры с Сыном Человеческим
  choice: другой, лицо которого было подобно облику человека
  alternative: Сын Человеческий
  rationale: В данном стихе фигура вводится описательно и ещё не называется этим титулом; перевод сохраняет локальную неопределённость.
- issue: Передача ጸጋ в выражении о лице
  choice: благодать
  alternative: благосклонность
  rationale: «Благодать» является прямым и ёмким соответствием, но примечание предохраняет от автоматического прочтения через более позднюю новозаветную формулу.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Необычная фраза «глава дней» намеренно оставлена в основном тексте ради близости к источнику, а традиционное соответствие вынесено в примечание. Повтор слова «лицо» сохраняет структуру и акцент оригинала.
