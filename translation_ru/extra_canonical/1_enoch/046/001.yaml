base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/001.yaml
  text: And there I saw one who had a head of days[a], and his head was like white wool; and with him was another, whose face was like the appearance of a man, and his face was full of grace[c][b], like one of the holy angels.
translation:
  language: ru
  text: И там я увидел того, у кого была глава дней[a]; голова его была подобна белой шерсти. С ним был другой, лицо которого было подобно облику человека[b]; лицо его было исполнено благодати[c], словно у одного из святых ангелов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ветхий днями». Буквально на геэзе: «глава дней»; необычный образ сохранён в основном тексте.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «лицо которого имело вид человека». В тексте, однако, употреблено явное сравнительное слово «подобно».'
    reason: previous_rendering
  - marker: c
    text: Выражение «исполнено благодати» прямо передаёт текст на геэзе; его не следует считать заимствованием из более поздней новозаветной формулировки.
    reason: cross_reference
