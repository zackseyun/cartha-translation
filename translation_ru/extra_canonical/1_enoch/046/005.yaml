base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/005.yaml
  text: And he will cast down the kings from their thrones and from their kingdoms[a], because they do not exalt him, and do not praise him[c][b], and do not acknowledge from where the kingdom was given to them.
translation:
  language: ru
  text: И он низвергнет царей с их престолов и из их царств[a], потому что они не превозносят его, не прославляют его и не признают, откуда дана им царская власть[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «из их владений» или «от их правления».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «откуда дано им царство». «Царство» здесь может означать также царствование или царскую власть; «откуда» по контексту можно понять и как «от кого».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይገፈትኦሙ
  choice: низвергнет
  rationale: Передаёт насильственное устранение и сохраняет возвышенную образность апокалиптического суда; нейтральное «сместит» звучало бы слишком административно.
- source_word: ነገሥት
  choice: царей
  rationale: Прямое значение — «цари»; контекст престолов и царств подтверждает именно царскую лексику.
- source_word: መናብርቲሆሙ
  choice: с их престолов
  rationale: В контексте царей слово обозначает престолы как символ власти, а не просто сиденья.
- source_word: መንገሥቲሆሙ
  choice: лишит их царств
  rationale: Глагольная конструкция естественно передаёт удаление царей не только с престолов, но и из сфер их правления; значение существительного допускает «царства», «правление» или «владычество».
- source_word: ኢያሌዕልዎ
  choice: не превозносят его
  rationale: Сохраняет значение возвышения и более точно, чем общее «не чтут».
- source_word: ኢይሴብሕዎ
  choice: не прославляют его
  rationale: Передаёт хвалу и прославление, оставаясь естественным в современном литературном русском.
- source_word: ኢይገንዩ
  choice: не признают
  rationale: В данном контексте выражает отказ признать источник полученной власти. Возможный оттенок покорности не внесён в основной текст, чтобы не усиливать толкование сверх необходимого.
- source_word: እምአይቴ
  choice: откуда
  rationale: Сохраняет формальную неоднозначность выражения, которое может указывать как на источник вообще, так и, по контексту, на личного дарователя.
- source_word: ተውህበት ሎሙ መንግሥት
  choice: дана им царская власть
  rationale: Сохраняет пассивную конструкцию, а «царская власть» яснее передаёт здесь дарованное право царствовать, не ограничивая смысл территориальным царством.
theological_decisions:
- issue: Кого обозначает местоимение «его» и кто дарует царскую власть
  choice: Сохранено местоимение «его» без уточняющего титула; дарователь власти оставлен не названным прямо.
  alternative: Назвать Всевышнего, Господа или Избранного.
  rationale: Сам стих не называет референта. Контекст предполагает божественный источник власти, однако явное уточнение устранило бы сохраняющуюся в тексте контекстуальную напряжённость.
translation_notes:
  register: Современный литературный русский с dignified апокалиптическим звучанием. «Низвергнет» сохраняет силу образа, а синтаксис упрощён до естественной русской конструкции. Неоднозначность источника власти и референта местоимения намеренно не разрешена.
