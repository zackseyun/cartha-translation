  text: 'And I saw for it another course and regulation: by that regulation it makes its course of the months[a][b][c].'
translation:
  language: ru
  text: 'И увидел я для него ещё один путь и установление: согласно этому установлению он совершает свой месячный путь.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предписание» либо «порядок»; эфиопское слово обозначает властно установленное правило.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «свой путь месяцев». Это можно передать как «месячный путь» или «путь, определяемый месяцами»; синтаксическая связь слов не вполне однозначна.'
    reason: textual_syntactic_ambiguity
lexical_decisions:
- source_word: ካልአ
  choice: ещё один
  rationale: Передаёт значение дополнительного, иного пути в ряду открываемых космических порядков; по-русски естественнее, чем буквальное «другой».
- source_word: ምሕዋረ / ምሕዋሮ
  choice: путь / свой путь
  rationale: Сохраняет повтор исходного существительного и обозначает упорядоченное движение или круговорот, не привнося современную астрономическую терминологию.
- source_word: ትእዛዘ / ትእዛዝ
  choice: установление
  rationale: В данном космологическом контексте речь идёт о заданном порядке движения, а не обязательно о непосредственно произнесённой заповеди или команде.
- source_word: ርኢኩ
  choice: увидел я
  rationale: Передаёт обычную формулу повествования о видении и сохраняет умеренно возвышенный библейский строй русской фразы.
- source_word: ሎቱ
  choice: для него
  rationale: Формально сохраняет мужской род местоимения и его отношение к упомянутому ранее небесному объекту, не заменяя местоимение предполагаемым референтом.
- source_word: በውእቱ ትእዛዝ
  choice: согласно этому установлению
  rationale: Естественно выражает норму или порядок, в соответствии с которым совершается движение.
- source_word: ይገብር
  choice: он совершает
  rationale: Сохраняет активное значение осуществления движения, а не сводит глагол к простому «идёт».
- source_word: ምሕዋሮ ዘአውራኅ
  choice: свой путь по месяцам
  rationale: አውራኅ означает «месяцы», а не «ветры»; русский оборот передаёт помесячное движение, при этом неоднозначность связи слов отмечена в сноске.
theological_decisions:
- issue: Характер космического установления
  choice: Стих описывает установленный порядок, согласно которому движется небесный объект.
  alternative: Прямое повеление, обращённое к небесному объекту.
  rationale: Контекст астрономической части книги говорит об упорядоченном движении творения; «установление» сохраняет возможность божественного авторитета, но не превращает космологический термин в нравственную заповедь.
- issue: Референт местоимения
  choice: Сохранено местоимение «он/него» без явного называния небесного объекта.
  alternative: Назвать луну или светило непосредственно.
  rationale: Сам стих содержит местоимение, а не существительное; явное называние референта устранило бы сохраняющуюся в изолированном стихе неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным строем. Повторы «установление» и «путь» намеренно сохранены вслед за исходным текстом; архаизмы и узкоконфессиональная терминология исключены.
