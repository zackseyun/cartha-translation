base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/011.yaml
  text: And their excess for the sun and the stars comes to six days[a]; in five years, at six each, it amounts for them to thirty days[c][b], and the moon falls behind the sun and the stars by thirty days.
translation:
  language: ru
  text: И избыток солнца и звёзд составляет шесть дней[a]; за пять лет, по шесть дней в год, он достигает тридцати дней[b], и луна отстаёт от солнца и звёзд на тридцать дней[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Арифметическое изложение в этом стихе предельно сжато. По-видимому, имеется в виду избыток в шесть дней за каждый год.
    reason: cultural_note
  - marker: b
    text: То есть шесть дней за каждый из пяти лет дают в общей сложности тридцать дней.
    reason: clarification
  - marker: c
    text: Переведённое как «луна» слово может также означать «месяц», особенно в календарном контексте.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምብጻሒሆሙ
  choice: избыток их
  rationale: Слово образовано от корня со значением достижения и полноты; в данном календарно-астрономическом расчёте оно обозначает накопившуюся величину сверх лунного счёта. «Избыток» естественно передаёт контекстуальный смысл, не превращая стих в современную формулу.
- source_word: ስሱ መዋዕለ
  choice: шесть дней
  rationale: Прямое соответствие числительному и существительному; речь идёт о календарной разнице в днях.
- source_word: በበስሱ
  choice: по шесть в каждом
  rationale: 'Удвоенный предлог при числительном имеет распределительное значение: по шесть за каждый из пяти лет. Добавление «в каждом» делает сжатый расчёт понятным по-русски.'
- source_word: ይበጽሖሙ
  choice: он достигает у них
  rationale: Сохранён глагол «достигать» из исходного корня; единственное число соотнесено с названным ранее избытком, достигающим общей суммы.
- source_word: የሐፀፁ
  choice: отстаёт
  rationale: Глагол означает «недоставать, быть меньше, отставать», а не буквальное изъятие. «Отстаёт … на тридцать дней» точно и естественно выражает календарное соотношение.
- source_word: ወርኅ
  choice: луна
  rationale: Слово может означать как луну, так и месяц. Параллель с солнцем и звёздами поддерживает значение «луна», хотя календарное значение остаётся возможным.
theological_decisions:
- issue: Сжатая и неоднозначная арифметическая формулировка
  choice: 'Сохранить последовательность: шесть дней ежегодно, за пять лет — тридцать дней, после чего указано отставание луны.'
  alternative: Полностью развернуть стих как пояснение разницы между солнечным и лунным годом.
  rationale: Исходный текст использует техническую и повторяющуюся лексику достижения и недостатка. Перевод делает арифметику читаемой, но не вносит отсутствующую в тексте современную календарную модель.
- issue: Значение ወርኅ
  choice: луна
  alternative: месяц
  rationale: Упоминание солнца и звёзд указывает прежде всего на небесное светило, однако полисемия слова существенна для календарного контекста и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего астрономического трактата. Синтаксис слегка формальный, чтобы сохранить повторяемость и расчётную структуру геэзского текста; неестественная буквальность устранена лишь там, где она мешала бы пониманию.
