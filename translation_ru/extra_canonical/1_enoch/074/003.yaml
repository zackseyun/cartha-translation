base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/003.yaml
  text: In fifteen parts it completes all its light in the east[b][a], and in fifteen parts it completes all its darkness in the west.
translation:
  language: ru
  text: В пятнадцати долях[a] оно доводит до полноты весь свой свет на востоке и в пятнадцати долях — всю свою тьму на западе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Числовая запись в имеющейся транскрипции искажена распознаванием. По строению знаков и астрономическому контексту здесь читается «пятнадцать долей»; чтение «пятьдесят семь дней» маловероятно.
    reason: textual_variant
lexical_decisions:
- source_word: በ፲፭ እደ (в транскрипции искажено как በ፭*፷፯ እደ)
  choice: пятнадцатью долями
  rationale: По астрономическому контексту и исправлению очевидной ошибки распознавания речь идёт о пятнадцати долях, а не о пятидесяти семи днях. እደ здесь обозначает доли или части (буквально «руки»), а не дни.
- source_word: ይፌጽም
  choice: доводит до полноты
  rationale: Активная форма выражает завершение или достижение полноты. Такой перевод сохраняет повторяющуюся астрономическую формулу и по-русски звучит естественнее буквального «завершает свет».
- source_word: ኵሎ ብርሃኖ
  choice: весь свой свет
  rationale: ኵሎ передаёт полноту, а суффикс при ብርሃኖ — принадлежность света подразумеваемому светилу.
- source_word: በሠርቅ
  choice: на востоке
  rationale: Локативное значение соответствует описанию области восхода и сохраняет пространственную параллель с западом.
- source_word: ኵሎ ጽልመተ
  choice: всю свою тьму
  rationale: Сохранён конкретный образ тьмы и симметрия со «светом», без поясняющей замены на «убывание света».
- source_word: በምዕራብ
  choice: на западе
  rationale: Локативный перевод сохраняет параллелизм востока и запада.
theological_decisions:
- issue: Следует ли истолковать свет и тьму как фазы или яркость светила
  choice: Сохранены образы «весь свой свет» и «всю свою тьму»
  alternative: «достигает полной яркости… полностью угасает»
  rationale: Источник формулирует явление через симметричные понятия света и тьмы; более привычное астрономическое объяснение устранило бы образность и сузило возможный смысл.
- issue: Залог глагола завершения
  choice: 'Передано активно: «оно доводит до полноты»'
  alternative: «его свет достигает полноты»
  rationale: Активное чтение лучше соответствует форме ይፌጽም и не превращает подразумеваемое светило в объект действия.
translation_notes:
  register: Современный литературный русский с сохранением размеренного, формульного стиля Астрономической книги. Местоимение «оно» оставляет подразумеваемое светило неназванным, как в источнике; тире во второй части естественно передаёт строгий параллелизм.
