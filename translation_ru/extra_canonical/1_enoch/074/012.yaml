base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/012.yaml
  text: And the sun and the stars bring in all the years exactly[a]; according to their stations forever, they do not advance or fall behind by a single day, but they complete the year in righteousness, exactly[d][c][b], in three hundred and sixty-four days.
translation:
  language: ru
  text: Солнце и звёзды с точностью ведут счёт всем годам[a]; согласно своему положению[b] они вовеки не забегают вперёд и не отстают ни на один день, но в праведности[d] точно сменяют год[c] за триста шестьдесят четыре дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «совершенно точно»; слово подчёркивает тщательную точность счёта светил.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «согласно своим положениям», «согласно своим станциям» или «согласно местам своего пребывания».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «изменяют (сменяют) год»; по смыслу это может означать, что они доводят годовой круг до завершения и перехода к следующему году.'
    reason: lexical_ambiguity
  - marker: d
    text: «В праведности» можно также понять как «правильно» или «надлежащим образом», однако основной текст сохраняет более сильное значение геэзского слова.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ያመጽእሙ፡ ለዓመታት
  choice: вводят все годы
  rationale: 'Каузативный глагол сохраняет конкретный образ: солнце и звёзды приводят годы, то есть обусловливают их наступление и календарный счёт. «Вводят» передаёт этот образ лучше, чем пояснительное «отмечают».'
- source_word: ጥንቁቃት / ጥንቁቀ
  choice: в точности / точно
  rationale: Формы выражают тщательность и точность; в астрономически-календарном контексте естественно передать их наречным значением, сохранив повтор в обеих частях стиха.
- source_word: ከመ፡ ምንባሪሆሙ
  choice: согласно своим местам
  rationale: Сохранены и значение ከመ «согласно», и существительное ምንባሪሆሙ «их место, пребывание, положение»; оно не растворено в общем указании на вечный порядок.
- source_word: ለዓለም
  choice: вовеки
  rationale: Передаёт непрерывность установленного порядка светил в кратком, возвышенном и понятном современном русском выражении.
- source_word: ኢይበድሩ፡ ወኢይጐንዱ
  choice: не забегают вперёд и не отстают
  rationale: Парная формула естественно описывает раннее и позднее отклонение от календарного порядка.
- source_word: አሐተ፡ ዕለተ
  choice: ни на один день
  rationale: Отрицательная конструкция ясно выражает меру даже малейшего отклонения.
- source_word: ይዌልጡ፡ ዓመተ
  choice: сменяют год
  rationale: Глагол ወለጠ прежде всего означает изменение или смену. Русское «сменяют год» сохраняет этот конкретный лексический образ и допускает контекстуальный смысл доведения годового круга до перехода к следующему году.
- source_word: በጽድቅ
  choice: в праведности
  rationale: Сохраняется нравственно-богословская насыщенность слова «праведность», а не только техническое значение правильности календарного счёта.
- source_word: ፫፻ወ፷ወረቡዕ፡ መዋዕለ
  choice: за триста шестьдесят четыре дня
  rationale: Предлог «за» естественно обозначает срок, в который совершается годовой цикл; число передано полностью и без округления.
theological_decisions:
- issue: Передавать ли በጽድቅ как нейтральную календарную правильность или как богословски значимую праведность
  choice: в праведности
  alternative: правильно; надлежащим образом
  rationale: Текст связывает космический порядок с праведностью. Основной перевод сохраняет это напряжение и не сводит выражение к технической точности.
- issue: Считать ли ይዌልጡ указанием на завершение года или сохранить значение его смены
  choice: сменяют год
  alternative: завершают год
  rationale: Основной текст следует прямому значению глагола «изменять, сменять», а контекстуально возможное понимание завершения годового круга отмечено в сноске, без устранения лексической неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся доступным, при этом сохранены повтор указания на точность, календарная конкретность и богословская напряжённость слова «праведность». Необычное «сменяют год» намеренно удерживает образ исходного глагола и сопровождается поясняющей сноской.
