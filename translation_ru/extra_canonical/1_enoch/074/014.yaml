base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/014.yaml
  text: As for the moon alone[c][b][a], its days come to one thousand and sixty-two days for three years and for five years.
translation:
  language: ru
  text: Число дней одной только луны[c] за три года составляет тысячу шестьдесят два дня[b], а за пять лет…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительные слова «а за пять лет» по-видимому неполны в предоставленном геэзском тексте: вероятно, здесь утрачено число или продолжение фразы.'
    reason: textual_variant
  - marker: b
    text: Стих входит в календарные расчёты Астрономической книги. Имеется в виду, что суммарное число лунных дней за три года составляет 1062.
    reason: cultural_note
  - marker: c
    text: 'Возможный перевод: «Число дней одного только месяца…» Геэзское слово может означать как «луну», так и «месяц», однако приведённое число соответствует трём лунным годам по 354 дня.'
    reason: translation_alternative
lexical_decisions:
- source_word: ለወርኅ
  choice: у луны
  rationale: Слово ወርኅ может означать и «месяц», и «луну». Число 1062 соответствует 354 дням × 3, поэтому в данном астрономическом расчёте речь, вероятнее всего, идёт о луне и её годовом цикле.
- source_word: ለባሕቲቱ
  choice: одной только
  rationale: Передаёт значение «одна, сама по себе, отдельно» и подчёркивает, что расчёт относится именно к луне.
- source_word: ይበጽሕ
  choice: достигает
  rationale: В числовом контексте глагол означает «доходить до, составлять»; «достигает» сохраняет образ исходного выражения и естественно звучит по-русски.
- source_word: መዋዕሊሁ
  choice: число дней
  rationale: Буквально «её дни»; в контексте календарного подсчёта естественное русское соответствие — «число дней».
- source_word: ለ፫ዓም
  choice: за три года
  rationale: Русское «за три года» ясно передаёт период, для которого вычисляется суммарное число дней.
- source_word: ፲፻ ወ፷ወ፪ መዋዕለ
  choice: тысячи шестидесяти двух
  rationale: Эфиопские цифры дают 1000 + 60 + 2; существительное «дней» уже выражено непосредственно перед числом в русской фразе и потому не повторяется.
- source_word: ወለ፭ ዓም
  choice: и за пять лет
  rationale: Перевод следует сохранившемуся тексту, не восполняя отсутствующий итоговый показатель для пятилетнего периода.
theological_decisions:
- issue: Незавершённая или повреждённая заключительная календарная формула
  choice: Сохранить оборванный по смыслу оборот «и за пять лет» и пояснить состояние текста в сноске.
  alternative: Предположительно восстановить отсутствующее число либо сгладить фразу как общее календарное утверждение.
  rationale: Предоставленный геэзский свидетель, по-видимому, неполон в конце стиха. Прозрачная передача сохранившегося текста предпочтительнее недоказанного восполнения.
translation_notes:
  register: Современный литературный русский язык; изложение краткое и техническое, но сохраняет достоинство древнего астрономического текста. Синтаксическая незавершённость финала не сглажена, а отмечена сноской.
