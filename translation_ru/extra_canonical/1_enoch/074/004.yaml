  text: And in certain months it changes its settings[a], and in certain months it travels its course[d][c][b], one by one.
translation:
  language: ru
  text: И в некоторые месяцы оно меняет места своего захода, а в некоторые месяцы следует своим путём — одно за другим.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально заключительные слова означают «одно, одно» и, вероятно, имеют распределительный смысл: «одно за другим» или «каждое отдельно». Не вполне ясно, к чему именно они относятся.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: አውራኅ
  choice: месяцы
  rationale: Это множественное число от слова «месяц», а не «пути»; сочетание с እመራት означает отдельные или определённые месяцы.
- source_word: እመራት
  choice: одни / другие
  rationale: Слово имеет значение «определённые, некоторые». В параллельных частях русское «в одни… в другие…» естественно передаёт распределительное сопоставление без отождествления двух групп.
- source_word: ይዌልጥ
  choice: меняет
  rationale: Глагол означает изменение или перемену, а не движение вниз.
- source_word: ምዕራባተ
  choice: места своего захода
  rationale: Множественная форма обозначает заходы; добавление «места» ясно передаёт меняющиеся точки захода светила и соответствует астрономическому контексту.
- source_word: የሐውር
  choice: совершает
  rationale: Общий глагол движения в сочетании с существительным «путь» естественно передаётся выражением «совершает свой путь».
- source_word: ምሕዋሪሁ
  choice: свой путь
  rationale: В астрономическом контексте слово обозначает регулярное движение или ход светила; «путь» сохраняет образ установленной небесной траектории.
- source_word: አሐዱ አሐዱ
  choice: одно за другим
  rationale: Повтор числительного имеет распределительное значение. Русское выражение сохраняет последовательность, не устраняя неясность того, к чему именно относится оборот.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным ритмом. Местоимение «оно» сохраняет подразумеваемое в контексте светило и не вводит в стих отсутствующее в нём существительное. Повтор «в определённые месяцы» передан естественной русской конструкцией «в одни… в другие…».
