base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/013.yaml
  text: For three years there are one thousand ninety-two days[a], and for five years, one thousand eight hundred twenty days and eight; thus for eight years there are two thousand nine hundred twelve days, and ten and two days.
translation:
  language: ru
  text: За три года насчитывается тысяча девяносто два дня, а за пять лет — тысяча восемьсот двадцать дней и ещё восемь; таким образом, за восемь лет насчитывается две тысячи девятьсот двенадцать дней, и десять, и два дня.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфиопская строка в данном OCR-свидетеле трудна с точки зрения чисел. По-видимому, здесь приводятся суммы дней за три, пять и восемь лет, однако последнее число могло сохраниться в разделённом или необычно расположенном виде. Сглаженный перевод был бы таким: «За три года — 1092 дня; за пять лет — 1828 дней; таким образом, за восемь лет — 2912 дней».'
    reason: textual_variant
lexical_decisions:
- source_word: ለ፫ዓም
  choice: за три года
  rationale: Предлог ለ при обозначении времени в данном вычислительном контексте указывает на итог за соответствующий промежуток.
- source_word: መዋዕለ
  choice: дня / дней
  rationale: Обычное обозначение дней, здесь выступающее единицей календарного исчисления; форма по-русски согласована с числительными.
- source_word: ፲፻ወ፺ወክልኤ
  choice: тысяча девяносто два
  rationale: 'Эфиопское числительное прочитано сложением разрядов: 1000 + 90 + 2.'
- source_word: ወለ፭ዓመት
  choice: а за пять лет
  rationale: Продолжает тот же ряд итоговых вычислений; союз «а» естественно разграничивает сопоставляемые периоды.
- source_word: ፲ወ፰፻፳መዋዕለ፡ ወ፰
  choice: тысяча восемьсот двадцать дней и ещё восемь
  rationale: Сохраняет засвидетельствованное раздельное расположение «дней» перед заключительным «и восемь», не скрывая трудность строки; «ещё» ясно передаёт присоединение числа по-русски.
- source_word: ከመ፡ ይኩን
  choice: таким образом … насчитывается
  rationale: В контексте выражает результат предшествующего подсчёта, а не цель.
- source_word: ለ፰ዓመት
  choice: за восемь лет
  rationale: Обозначает итог за очередной временной промежуток в той же последовательности.
- source_word: ፪ወ፱፻፲፪
  choice: две тысячи девятьсот двенадцать
  rationale: Числительное прочитано аддитивно как 2000 + 900 + 12.
- source_word: ወዓሡር፡ ወስኑይ፡ መዋዕለ
  choice: и десять, и два дня
  rationale: Намеренно сохраняет отдельное аддитивное выражение заключительных чисел, хотя оно выглядит избыточным после 2912; это делает трудное чтение свидетеля видимым.
theological_decisions:
- issue: Календарная арифметика в трудной строке эфиопского текста, известной по OCR-транскрипции
  choice: Сохранить последовательность итогов за три, пять и восемь лет, включая раздельные и численно неловкие заключительные элементы.
  alternative: 'Сгладить текст до: «за три года — 1092 дня; за пять лет — 1828 дней; за восемь лет — 2912 дней».'
  rationale: Это не вероучительный вопрос, однако точность чисел существенна для астрономического раздела. При недостаточной уверенности в текстовой форме нельзя молча исправлять или гармонизировать свидетельство.
translation_notes:
  register: Современный литературный русский язык с достоинством календарно-астрономического изложения. Числа переданы словами; синтаксическая неловкость заключительных компонентов сохранена намеренно и объяснена в сноске.
