lexical_decisions:
- source_word: ከመዝ
  choice: Так
  rationale: Передаёт возобновляющее и итоговое значение выражения естественным русским словом.
- source_word: ርኢኩ
  choice: я увидел
  rationale: Прямо передаёт форму первого лица и сохраняет характер рассказа о видении.
- source_word: ምግባሮሙ
  choice: их действие
  rationale: В данном астрономическом контексте речь идёт о движении и функционировании светил, а не о нравственных поступках; единственное число в русском может обозначать совокупный наблюдаемый процесс.
- source_word: በከመ
  choice: как
  rationale: Естественно вводит содержание увиденного.
- source_word: ይሠርቅ
  choice: восходит
  rationale: Форма от ሠረቀ обозначает восход светила; её не следует смешивать с созвучным глаголом со значением «красть».
- source_word: አውራኅ
  choice: луна
  rationale: Форма морфологически множественная и может обозначать луны или месяцы, однако в параллели с солнцем русский текст естественно говорит о луне как о светиле; формальная особенность отмечена в сноске.
- source_word: ወየዓርብ ፀሐይ
  choice: и заходит солнце
  rationale: Передаёт параллельное движение второго светила обычным русским астрономическим выражением.
- source_word: በእማንቱ መዋዕል
  choice: в те дни
  rationale: Сохраняет временную формулу и её связь с описываемым периодом.
