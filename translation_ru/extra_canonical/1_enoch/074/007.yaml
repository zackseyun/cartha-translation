base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/007.yaml
  text: And when the sun goes out from the fourth gate[a], it goes out for seven days, until it goes out from the fifth; and again it returns for seven days through the fourth gate, and completes all its light[c][b], and it withdraws and enters through the first gate for eight days.
translation:
  language: ru
  text: Когда солнце выходит из четвёртых врат, оно в течение семи дней выходит из них, пока не начнёт выходить из пятых[a]; затем оно вновь в течение семи дней возвращается через четвёртые врата[c], завершает весь свой свет[b], отступает и в течение восьми дней входит через первые врата.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В эфиопском тексте после слова «пятых» слово «врата» не повторяется; судя по строению всего отрывка, подразумеваются пятые врата.
    reason: lexical_alternative
  - marker: b
    text: «Завершает весь свой свет» — близкая передача необычного выражения на языке геэз; вероятно, речь идёт о достижении полной меры света на этом этапе цикла.
    reason: cultural_note
  - marker: c
    text: 'Или: «к четвёртым вратам».'
    reason: previous_rendering
lexical_decisions:
- source_word: ፀሐይ
  choice: солнце
  rationale: Прямое обозначение светила в контексте книги о небесных светилах.
- source_word: ይወፅእ
  choice: выходит
  rationale: Сохраняет повторяющуюся формулу движения солнца и образ его выхода через космические врата.
- source_word: እምራብዕት ኆኅት
  choice: из четвёртых врат
  rationale: Русское «врата» естественно передаёт конкретный образ устройства космоса; предлог እም обозначает движение изнутри.
- source_word: ሰቡዐ መዋዕለ
  choice: семь дней / на семь дней
  rationale: В последовательности перемещений речь идёт о продолжительности этапа солнечного цикла.
- source_word: እስከ ይወፅእ እምነ ኃምስት
  choice: пока не выйдет из пятых
  rationale: Сохранён эллипсис эфиопского текста, где после «пятых» слово «врата» не повторяется; подразумеваемый референт отмечен в сноске.
- source_word: ካዕበ
  choice: вновь
  rationale: Обозначает повторение или обратное движение без избыточного разъяснения.
- source_word: ይገብእ
  choice: возвращается
  rationale: В данном контексте глагол описывает возврат солнца к прежним вратам в циклическом движении.
- source_word: በኆኅት ራብዕ
  choice: через четвёртые врата
  rationale: Предлог በ здесь естественно понимать как указание пути движения — «через» или «посредством», а не обязательно направления «к».
- source_word: ይፌጽም ኵሎ ብርሃኖ
  choice: завершает весь свой свет
  rationale: Сохраняет необычную, возможно техническую формулу источника и не заменяет её истолковывающим выражением «достигает полной яркости».
- source_word: ይደንን
  choice: отступает
  rationale: Передаёт удаление или склонение солнца после завершения света, сохраняя образ движения.
- source_word: ይበውእ በቀዳሚት ኆኅት
  choice: входит через первые врата
  rationale: Создаёт соответствие с предшествующим «выходит» и сохраняет пространственный образ врат.
- source_word: ስሙነ መዋዕለ
  choice: на восемь дней
  rationale: Передаёт длительность заключительного этапа описываемого цикла.
theological_decisions:
- issue: Образ космических врат в движении солнца
  choice: Сохранить буквальное слово «врата».
  alternative: Передать как «порталы», точки горизонта или стоянки солнца.
  rationale: Текст изображает упорядоченный космос, в котором светила движутся через врата. Буквальная передача сохраняет апокалиптическую картину мира и не подменяет её современным астрономическим объяснением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но ясным повествовательным строем. Повтор глагола «выходит» намеренно сохранён как формульная особенность источника; «врата» поддерживает конкретную космологическую образность.
