    rationale: Более прямое «у солнца число дней достигает тридцати» сохраняет астрономическую рамку и улучшает читаемость.
  revised_text: И прибавляются пять дней[a], и у солнца число дней достигает тридцати; а все дни, приходящиеся на один из этих пяти лет, когда он завершается[c], составляют триста шестьдесят четыре дня[b].
