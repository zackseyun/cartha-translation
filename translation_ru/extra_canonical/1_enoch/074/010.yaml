base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/010.yaml
  text: And five days are added[a], and for the sun it reaches thirty days; and all the days that accrue to it for one of those five years, when completed[c][b], amount to three hundred and sixty-four days.
translation:
  language: ru
  text: И прибавляются пять дней[a], и для солнца счёт достигает тридцати дней; а все дни, приходящиеся на один из этих пяти лет, по завершении года[c] составляют триста шестьдесят четыре дня[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфиопский текст в этом месте труден: переданная форма ኃምስቱ ዓመት буквально означает «пять лет». По календарному контексту, вероятно, имеются в виду пять добавочных дней, завершающих солнечный год.'
    reason: textual_variant
  - marker: b
    text: Ср. общую календарную схему Астрономической книги, где год насчитывает 364 дня. Числовая запись в сохранившейся транскрипции этого места, по-видимому, искажена.
    reason: cross_reference
  - marker: c
    text: 'Возможный перевод трудной фразы: «а все дни, назначенные году, вместе с этими пятью добавленными днями составляют триста шестьдесят четыре дня».'
    reason: alternative_rendering
lexical_decisions:
- source_word: ወይትዌሰክ
  choice: и прибавляются
  rationale: Глагол передаёт добавление к календарному счёту; возвратная пассивная конструкция естественна для современного русского языка.
- source_word: ኃምስቱ ዓመት
  choice: пять дней
  rationale: Переданная форма буквально выглядит как «пять лет», однако в данном календарном высказывании речь, по смыслу, идёт о добавочных днях. Поскольку эфиопский текст здесь труден и, вероятно, повреждён, буквальное чтение сохранено в примечании.
- source_word: ለፀሐይ
  choice: для солнца
  rationale: Сохранена астрономическая перспектива исходного текста без уточнения, которого сам текст не даёт.
- source_word: ሠላሳ መዋዕለ
  choice: тридцати дней
  rationale: Обычное календарное выражение, естественно передаваемое по-русски.
- source_word: ኵሎሙ መዋዕለ ይበጽሕዎ ለዓመት
  choice: все дни, приходящиеся … на … год, … составляют
  rationale: Глагол имеет значение достижения или итоговой суммы; русский оборот ясно передаёт числовой итог.
- source_word: ፩እምእሉኩ ፭ዓመት ተመሊኦሙ
  choice: на один из этих пяти лет, по завершении года
  rationale: Перевод следует вероятному чтению «один из этих пяти лет» и передаёт завершённость календарного периода, не скрывая синтаксической трудности.
- source_word: ፻፷ወ፰ወረቡዐ መዋዕለ
  choice: триста шестьдесят четыре дня
  rationale: Принят календарный итог 364 дня, засвидетельствованный контекстом Астрономической книги и сверенным английским слоем; числовая последовательность в предоставленной OCR-транскрипции, по-видимому, повреждена.
theological_decisions:
- issue: Характер пяти прибавляемых единиц
  choice: Пять добавочных календарных дней
  alternative: Буквально переданное чтение «пять лет»
  rationale: Итог в 364 дня и календарный контекст указывают на добавочные дни, однако реальная текстологическая трудность прямо отмечена, а не устранена молча.
- issue: Соотношение солнечного счёта и пятилетнего периода
  choice: Сохранить формулировку о днях, приходящихся на один из пяти лет
  alternative: Перестроить стих как общее описание только одного солнечного года
  rationale: Так сохраняется присутствующее в источнике напряжение между годовым итогом и упоминанием пятилетнего цикла без внесения конфессионального или частного толкования.
