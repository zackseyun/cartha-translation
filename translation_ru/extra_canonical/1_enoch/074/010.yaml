    rationale: Трудная заключительная группа соотнесена с «одним из этих пяти лет» и имеет форму множественного числа; единственное «года» сглаживает именно ту неоднозначность, которую необходимо сохранить.
  - severity: medium
    issue: В основном тексте совмещены «пять дней» и «один из этих пяти лет» без пояснения при соответствующем месте.
    rationale: Такое совмещение отражает проблемную передачу, но читателю необходимо показать, что это не уверенная календарная реконструкция. Примечание c должно быть поставлено у трудной части фразы.
  - severity: low
