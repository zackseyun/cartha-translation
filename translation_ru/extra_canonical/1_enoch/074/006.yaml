base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/006.yaml
  text: For seven days it goes out and turns about[a], and it returns again through the gate from which the sun goes out; and it completes all its light, and it withdraws from the sun[d][c][b], and it enters for eight days through the sixth gate from which the sun goes out.
translation:
  language: ru
  text: Семь дней оно[a] выходит, совершает круг и снова входит через врата, из которых выходит солнце; оно доводит до полноты весь свой свет[b] и удаляется от солнца, а затем в течение восьми дней входит через шестые врата, из которых выходит солнце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Субъект глаголов в этом стихе прямо не назван. По контексту, вероятно, речь идёт о луне, однако перевод не вставляет её название в основной текст.
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «завершает весь свой свет». По-видимому, это выражение описывает достижение светилом полной меры света, но технический смысл фразы не вполне ясен.'
    reason: cultural_note
lexical_decisions:
- source_word: ይወፅእ
  choice: выходит
  rationale: Обычный глагол движения наружу; единый перевод сохранён во всех трёх случаях, без замены на «появляется» или «восходит».
- source_word: ሰብዓተ መዋዕለ
  choice: семь дней
  rationale: Сочетание обозначает продолжительность; по-русски естественно передаётся обстоятельством времени без добавочного предлога.
- source_word: የአውድ
  choice: совершает круг
  rationale: Глагол выражает круговое движение или обращение; этот вариант естественен в астрономическом контексте и не уточняет предполагаемую модель движения.
- source_word: ይገብእ ካዕበ
  choice: снова входит
  rationale: ይገብእ буквально указывает на вхождение, а ካዕበ — на повторность. Перевод сохраняет образ прохождения через врата.
- source_word: በኆኅት
  choice: через врата
  rationale: ኆኅት обозначает врата, дверь или портал; «врата» передаёт космологический образ небесных проходов точнее, чем «окно».
- source_word: ወይፌጽም ኵሎ ብርሃኖ
  choice: оно доводит до полноты весь свой свет
  rationale: Сохранён процессуальный смысл достижения полноты света без истолковывающей замены на «становится полным».
- source_word: ወይፀንን እምፀሐይ
  choice: и удаляется от солнца
  rationale: Фраза выражает отделение или удаление; русский вариант сохраняет пространственное отношение, не навязывая дополнительного космологического объяснения.
- source_word: ስሙነ መዋዕለ
  choice: в течение восьми дней
  rationale: Передано значение продолжительности; развёрнутая форма устраняет возможное ошибочное понимание «на восьмой день».
- source_word: በሳድስት ኆኅት
  choice: через шестые врата
  rationale: Порядковое числительное относится к небесным вратам; множественное «врата» в русском языке требует формы «шестые».
theological_decisions:
- issue: Кто является движущимся светилом
  choice: Сохранить местоимение «оно», не называя прямо луну.
  alternative: Вставить в основной текст существительное «луна».
  rationale: Контекст, вероятно, указывает на луну, однако в самом стихе субъект цепочки глаголов прямо не назван. Местоимение сохраняет эту неявность и не решает вопрос за источник.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной космологической лексикой. «Врата» последовательно передают технический образ небесных проходов. Синтаксическая цепочка источника сохранена, но расчленена русскими связками для ясности.
