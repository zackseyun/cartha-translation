    reason: lexical_alternative
lexical_decisions:
- source_word: ካዕበ
  choice: снова
  rationale: Передаёт продолжение повторяющейся последовательности движения светила и сохраняет процедурный ритм отрывка.
- source_word: ይገብእ
  choice: возвращается
  rationale: Глагол ገብአ здесь означает возвращение, движение назад; это точнее, чем «входит», и соответствует циклическому движению светила.
- source_word: ሰቡዐ መዋዕለ
  choice: на семь дней
  rationale: Сочетание выражает длительность и сохраняет календарную точность исходного текста.
- source_word: በራብዕት ኆኅት
  choice: к четвёртым вратам
  rationale: Предлог допускает пространственные оттенки; «к» естественно передаёт возвращение к указанным вратам, не утверждая однозначно прохождение сквозь них.
- source_word: እንተ እምኔሃ
  choice: из которых
  rationale: Относительное выражение отсылает к только что названным вратам; русское множественное согласование обусловлено словом «врата».
- source_word: ይወፅእ ፀሐይ
  choice: выходит солнце
  rationale: Сохраняет конкретный образ солнца, выходящего из небесных врат, и непосредственно передаёт значение глагола.
