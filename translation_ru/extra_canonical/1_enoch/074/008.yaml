  text: And again[a], it returns for seven days to the fourth gate[c][b], from which the sun comes out.
translation:
  language: ru
  text: И снова оно[a] возвращается на семь дней к четвёртым вратам[b], из которых выходит солнце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Подлежащее в первой части предложения в геэзском тексте не названо; по контексту оно связано с движением светила.
    reason: implicit_subject
