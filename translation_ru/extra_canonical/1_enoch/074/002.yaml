base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/002.yaml
  text: And all that Uriel[a], the holy angel who is their leader, showed me—I wrote down their positions as he showed them to me, and I wrote down their paths as they are[e][d][c][b], and I saw their lights until fifteen days were completed.
translation:
  language: ru
  text: 'И всё, что показал мне Уриил, святой ангел, который является их предводителем, я записал: их положения — такими, какими он показал их мне, — их пути, каковы они, и вид их света до завершения пятнадцати дней.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኵሎዘ
  choice: всё, что
  rationale: Естественно передаёт обобщающую относительную конструкцию и её всеохватность.
- source_word: አርአየኒ
  choice: показал мне
  rationale: Сохраняет зрительный, указательный смысл глагола, не усиливая его до богословски нагруженного «открыл».
- source_word: መልአክ ቅዱስ
  choice: святой ангел
  rationale: Прямой и общепонятный эквивалент титула.
- source_word: መራሒሆሙ ለኵሎሙ
  choice: который руководит ими всеми
  rationale: Передаёт значение руководства и сохраняет местоименную неопределённость референта.
- source_word: ምንባሪሆሙ
  choice: их местоположения
  rationale: В астрономическом контексте речь идёт об установленных местах или положениях небесных светил; «местоположения» понятно и не привносит бытового оттенка «жилищ».
- source_word: አውራኂሆሙ
  choice: их месяцы
  rationale: Форма связана с ወርኅ «месяц» и здесь означает месяцы, а не пути; это чтение предпочтительнее предложенного в английском консультационном слое «paths».
- source_word: በከመ ሀለዉ
  choice: каковы они
  rationale: Передаёт соответствие действительному состоянию или устройству названных месяцев.
- source_word: ርእየ ብርሃኖሙ
  choice: вид их света
  rationale: ርእየ понимается как сопряжённая форма существительного «вид, явление», а не как глагол первого лица «я увидел»; ብርሃኖሙ передано без ненужного умножения образов.
- source_word: እስከ ተፈጸመ ዐሡር ወኀሙስ መዋዕለ
  choice: вплоть до завершения пятнадцати дней
  rationale: Сохраняет значение достижения завершённого пятнадцатидневного периода и сжатость исходной временной связи.
theological_decisions:
- issue: Референт повторяющегося местоимения «их/ими»
  choice: Оставить местоимения без поясняющей подстановки существительного
  alternative: Явно назвать небесные светила
  rationale: Контекст указывает на небесные светила, однако сам стих сохраняет местоименную форму; её сохранение не устраняет возможную связь светил с управляющими ими небесными порядками.
- issue: Грамматический статус ርእየ
  choice: 'Существительное в сопряжённой форме: «вид их света»'
  alternative: 'Глагольное чтение: «я увидел их свет»'
  rationale: Форма ርእየ лучше объясняется как сопряжённая форма существительного ርእይ «вид, явление»; ожидаемая форма первого лица совершенного вида была бы иной. Поэтому ошибочное глагольное чтение английского слоя не воспроизводится.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис слегка формален, но остаётся понятным; двоеточие и парные тире проясняют перечень записанного, не снимая смысловой сжатости последней временной фразы.
