  text: For two months it sets with the sun in these two middle portals[c][b][a], in the third and in the fourth portal.
translation:
  language: ru
  text: В течение двух месяцев оно заходит вместе с солнцем в этих двух средних вратах[a] — в третьих и четвёртых вратах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дверях» или «проходах». Эфиопское слово обозначает дверь или врата; здесь оно относится к небесным проходам, через которые движутся светила.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በክልኤ፡ ወርኅ
  choice: В течение двух месяцев
  rationale: ክልኤ — количественное числительное «два», а не порядковое «второй»; предлог በ здесь передаёт продолжительность времени.
- source_word: የዓርብ
  choice: оно заходит
  rationale: Форма понимается как глагол несовершенного вида в 3-м лице единственного числа от ዐረበ «заходить, садиться (о светиле)», а не как указание на четвёртый день.
- source_word: ምስለ፡ ፀሐይ
  choice: вместе с солнцем
  rationale: ምስለ означает «с, вместе с» и указывает на совпадение движения светила с движением солнца.
- source_word: በእሉ፡ ክልኤ፡ ኆዋኅው፡ እለ፡ ማእከል
  choice: в этих двух средних вратах
  rationale: Фраза обозначает два центральных небесных входа; «врата» сохраняют конкретный архитектурный образ оригинала.
- source_word: በሣልስት፡ ወበራብዕት፡ ኆኅት
  choice: в третьих и четвёртых вратах
  rationale: Порядковые числительные определяют два названных прохода. Повтор слова «врата» делает соотношение частей фразы ясным по-русски.
theological_decisions:
- issue: Характер небесных проходов
  choice: Сохранён образ небесных «врат»
  alternative: Двери, проходы или абстрактные точки движения светил
  rationale: Апокалиптическая космология текста выражена архитектурными образами; перевод не демифологизирует их и не навязывает позднейшую космологическую систему.
- issue: Неявное подлежащее глагола
  choice: Безлично-контекстуальное местоимение «оно»
  alternative: Явно назвать луну или иное светило
  rationale: В данном стихе подлежащее прямо не названо. «Оно» сохраняет связь с контекстом, не добавляя отсутствующее в строке наименование.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного апокалиптического образа. Выражение «в течение двух месяцев» естественно передаёт длительность; «врата» поддерживают космическую архитектурную образность без архаизации всего предложения.
