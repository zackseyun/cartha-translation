  text: From its fruit life shall be given to the chosen ones[a], and it shall be planted toward the north[b], upon...
translation:
  language: ru
  text: От его плода избранным будет дана жизнь, а оно будет посажено к северу, на…[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный геэзский фрагмент обрывается после предлога «на»; его дополнение в данном извлечении не приведено.
    reason: textual_variant
  - marker: b
    text: 'Или: «над…».'
    reason: previous_rendering
lexical_decisions:
- source_word: ፍሬ
  choice: плод
  rationale: Сохраняет конкретный образ плода дерева; это прямое и естественное соответствие в данном видении.
- source_word: ይትወሀብ
  choice: будет дана
  rationale: Передаёт пассивное значение и направленность обещания в будущее, не усиливая его толкованием.
- source_word: ኅሩያን
  choice: избранным
  rationale: Сохраняет характерное для апокалиптической литературы обозначение группы и при этом звучит естественно по-русски.
- source_word: ሐይወት
  choice: жизнь
  rationale: Прямо передаёт существительное, не уточняя его как «вечную жизнь» или «исцеление», чего в сохранившемся тексте нет.
- source_word: መንገለ መስዕ
  choice: к северу
  rationale: Передаёт направительное значение выражения; русский оборот краток и естественен.
- source_word: ይተከል
  choice: будет посажено
  rationale: Сохраняет страдательное значение и образ посадки дерева, не вводя более узкое «пересажено».
- source_word: ዲበ
  choice: на…
  rationale: Это предлог со значением «на, над»; многоточие показывает, что его дополнение отсутствует из-за обрыва предоставленного фрагмента.
theological_decisions:
- issue: Кого обозначает ኅሩያን
  choice: «избранные» как выделенная в апокалиптическом контексте группа, которой обещана жизнь
  alternative: «праведные» либо терминологически нагруженное понимание избранных в рамках позднейшей догматики
  rationale: Перевод сохраняет местное обозначение книги Еноха и не подменяет его более поздней конфессиональной системой.
- issue: Характер обещанной жизни
  choice: оставить просто «жизнь»
  alternative: «вечная жизнь», «исцеление» или «восстановление»
  rationale: Контекст может предполагать эсхатологическую жизнь, однако данный геэзский текст содержит только слово «жизнь»; уточнение сняло бы подлинную смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием. Порядок слов «избранным будет дана жизнь» сохраняет смысловой акцент на получателях обещания. Местоимение «само оно» относится к дереву из ближайшего контекста; многоточие намеренно отмечает незавершённость исходного фрагмента.
