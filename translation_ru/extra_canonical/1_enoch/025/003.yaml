base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/003.yaml
  text: And he answered me[a], saying, “This high mountain that you have seen, whose summit is like the throne of the Lord, is his throne, where the Holy and Great One, the Lord of Glory, the Eternal King[c][b], will dwell when he comes down to visit the earth with goodness.”
translation:
  language: ru
  text: 'И он ответил мне: «Эта высокая гора, которую ты видел и вершина которой[a] подобна престолу Господа, — Его престол; там будет обитать Святой и Великий, Господь Славы, Вечный Царь, когда Он сойдёт посетить землю во благо[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гора, которую ты видел, подобна престолу Господа». Геэзская формулировка может относить это сравнение именно к вершине горы или, в более общем смысле, к горе в связи с образом престола.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможны также переводы: «посетить землю с благостью», «посетить землю в благости» или «обозреть землю ради блага». Речь идёт о благом божественном посещении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ
  choice: ответил
  rationale: Обычный повествовательный глагол ответа; сохраняет диалогический характер видения.
- source_word: ደብር ዘርኢከ ነዋኅ
  choice: эта высокая гора, которую ты видел
  rationale: Передаёт указание на уже увиденную гору и её значительную высоту естественным современным русским языком.
- source_word: ዘርእሱ ይመስል መንበረ ለእግዚአ
  choice: вершина которой подобна престолу Господа
  rationale: ዘርእሱ буквально связано с «головой/верхом» и в отношении горы естественно передаётся словом «вершина»; ይመስል сохраняет прямое сравнение.
- source_word: መንበሩ ውእቱ
  choice: Его престол
  rationale: Сохраняет явное отождествление горы с Его престолом и повтор образа престола, не заменяя его более общим «местом».
- source_word: ኀበ ይነብር
  choice: там будет обитать
  rationale: Глагол означает пребывание или обитание; будущее время согласовано с последующим временным придаточным о нисхождении.
- source_word: ቅዱስ ወዐቢይ
  choice: Святой и Великий
  rationale: Передано как самостоятельный составной божественный титул, а не только как определения при слове «Господь».
- source_word: እግዚአ ስብሐት
  choice: Господь Славы
  rationale: Сохраняет торжественный библейский титул и образ славы.
- source_word: ንጉሥ ዘለዓለም
  choice: Вечный Царь
  rationale: Кратко и возвышенно передаёт царский титул и непреходящую длительность.
- source_word: የኀውጻ ለምድር በሠናይ
  choice: посетить землю во благо
  rationale: Передаёт благой характер божественного посещения, не сводя выражение к одному лишь пространственному нисхождению.
theological_decisions:
- issue: Гора как божественный престол
  choice: Гора прямо названа Его престолом, а её вершина уподоблена престолу Господа.
  alternative: Считать престолом только вершину либо передать гору лишь как место будущего воцарения.
  rationale: Текст сочетает сравнение вершины с престолом и явную формулу መንበሩ ውእቱ — «это Его престол»; оба образа сохранены без сглаживания напряжения.
- issue: Характер пребывания Бога на горе
  choice: «будет обитать» в связи с будущим нисхождением.
  alternative: «обитает» или «воссядет».
  rationale: Глагол ይነብር прежде всего выражает пребывание/обитание, тогда как последующее «когда сойдёт» задаёт будущую перспективу сцены.
- issue: Статус выражения ቅዱስ ወዐቢይ
  choice: Самостоятельный титул «Святой и Великий», поставленный в приложении к другим титулам.
  alternative: «Святой и Великий Господь Славы».
  rationale: Субстантивное прочтение сохраняет ряд приложенных друг к другу божественных титулов и не связывает первые два эпитета с последующим титулом теснее, чем это требует источник.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, апокалиптическим звучанием. Синтаксис сделан ясным для широкого читателя; традиционные божественные титулы сохранены. Единственная сноска отмечена в основном тексте.
