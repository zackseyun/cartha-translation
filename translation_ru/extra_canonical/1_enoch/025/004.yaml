base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/004.yaml
  text: And this fragrant tree—no flesh has authority to touch it until the great judgment[a], when all will be avenged and brought to completion forever[d][c][b]; then it will be given to the righteous and the humble.
translation:
  language: ru
  text: И к этому благоухающему дереву ни один смертный[a] не вправе прикоснуться до великого суда, когда он совершит возмездие над всеми и навеки всё доведёт до завершения[b]. То дерево будет дано праведным и смиренным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «никакая плоть не имеет власти». Здесь «плоть» означает смертных людей, а не телесную материю.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная часть фразы о суде трудна. Буквально глаголы имеют подразумеваемого субъекта: «когда он совершит возмездие над всеми (или: за всё) и доведёт до завершения навеки». Субъект в самом стихе прямо не назван.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ዕፀ መዓዛ
  choice: благоухающее дерево
  rationale: Сочетание обозначает дерево, отличающееся ароматом; перевод сохраняет конкретный образ и звучит естественно в современном литературном русском языке.
- source_word: ዘሥጋ
  choice: из смертных
  rationale: Буквально выражение связано с «плотью», но здесь оно обозначает смертных людей. Формулировка передаёт смысл, не создавая впечатления, будто речь идёт о плоти как веществе.
- source_word: ሥልጣነ
  choice: не вправе
  rationale: Слово указывает не просто на физическую возможность, а на власть или дозволенное право доступа.
- source_word: ይግሥሦ
  choice: прикоснуться
  rationale: Глагол передаёт физическое касание; перевод не уточняет без достаточных оснований, что речь идёт о вкушении плодов.
- source_word: ኵነኔ
  choice: суд
  rationale: В апокалиптическом контексте имеется в виду великий окончательный суд; «суд» сохраняет широкий смысл слова.
- source_word: ይትቤቀል
  choice: совершит возмездие
  rationale: Форма выражает действие воздаяния или отмщения. Такое решение сохраняет судебную и апокалиптическую силу глагола без разговорного оттенка.
- source_word: ኵሎ
  choice: над всеми
  rationale: Объект имеет широкий охват и в контексте суда естественно понимается как все подлежащие воздаянию; сноска отмечает возможную более широкую референцию.
- source_word: ይፌጽም
  choice: всё доведёт до завершения
  rationale: Глагол означает завершение или исполнение. Добавленное «всё» естественно связывается с широким ኵሎ, но формулировка не уточняет, идёт ли речь о суде или обо всём установленном порядке.
- source_word: ለዓለም
  choice: навеки
  rationale: Краткий и возвышенный русский эквивалент, выражающий непреходящую окончательность.
- source_word: ጻድቃን
  choice: праведным
  rationale: Устойчивый и понятный эквивалент ключевого апокалиптического обозначения.
- source_word: ትሑታን
  choice: смиренным
  rationale: Слово обозначает смиренных или уничиженных; «смиренным» ясно передаёт основное качество, не подменяя его конфессионально окрашенной формулой.
- source_word: ዝኩ ... ይትወሀብ
  choice: Это дерево будет дано
  rationale: Указательное местоимение отсылает к дереву, а пассивная форма сохраняется. Повтор существительного устраняет неясность русского среднего местоимения и не вводит отсутствующего в источнике временного наречия «тогда».
theological_decisions:
- issue: Значение «плоти» в запрете доступа
  choice: 'Запрет относится к смертным людям: никто из смертных не имеет права касаться дерева.'
  alternative: 'Буквально: «никакая плоть не имеет власти коснуться его»; возможно также более широкое понимание как любого телесного существа.'
  rationale: В данном контексте «плоть» служит обозначением смертного человечества. Основной текст передаёт референт понятно, а буквальный образ сохранён в сноске.
- issue: Субъект действий возмездия и завершения
  choice: Сохранено не названное прямо местоимение «он» со строчной буквы.
  alternative: 'Можно перевести безлично: «когда будет совершено возмездие и всё будет завершено», либо прямо назвать Бога субъектом.'
  rationale: Глагольные формы допускают подразумеваемый субъект мужского рода единственного числа, но стих не называет его прямо. Строчная буква и сноска сохраняют грамматическую форму и не вносят в текст более явного отождествления, чем даёт источник.
- issue: Охват возмездия и завершения
  choice: «над всеми» и «всё доведёт до завершения».
  alternative: «за всё отомстит и завершит это» или пассивное «всё будет отомщено и завершено».
  rationale: Синтаксис труден, а ኵሎ может охватывать людей, вещи или всё дело суда. Перевод сохраняет универсальный охват, не определяя точнее объект завершения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим регистром. Синтаксис сделан ясным для обычного читателя, но трудность судебной фразы и неназванный субъект не устранены догматическим уточнением.
