base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/001.yaml
  text: And he said to me[a], “Enoch, why do you ask about the fragrance of this tree, and inquire so that you may know?”
translation:
  language: ru
  text: 'И он сказал мне: «Енох, почему ты спрашиваешь о благоухании этого дерева[a] и расспрашиваешь, чтобы узнать?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о запахе этого дерева». Эфиопское слово может обозначать запах или аромат; «благоухание» выбрано с учётом возвышенного характера сцены.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይቤለኒ
  choice: он сказал мне
  rationale: Сохраняет обычную повествовательную формулу прямой речи без ненужного расширения.
- source_word: ሄኖክ
  choice: Енох
  rationale: Устоявшаяся русская форма личного имени.
- source_word: ምንተ ትስእል
  choice: почему ты спрашиваешь
  rationale: Хотя конструкция буквально строится со значением «что», в данном контексте она естественно передаёт вопрос о причине или цели расспросов.
- source_word: በእንተ መዓዛሁ ለዝ ዕፅ
  choice: о благоухании этого дерева
  rationale: መዓዛ обозначает запах или аромат, а ዕፅ — дерево, древесину либо растение; в возвышенной сцене с конкретным чудесным деревом «благоухание этого дерева» звучит точно и естественно.
- source_word: ወትጠየቅ
  choice: и допытываешься
  rationale: Отдельно передаёт второй глагол расспрашивания и сохраняет повтор исходного текста, не сливая его с первым.
- source_word: ከመ ታእምር
  choice: чтобы узнать
  rationale: Прямо передаёт целевую конструкцию и её познавательный смысл.
theological_decisions:
- issue: Тон ответа говорящего Еноху
  choice: Мягкий вопрос о цели расспросов Еноха, без явного осуждения
  alternative: Резкий упрёк за неуместное любопытство либо нейтральная просьба пояснить вопрос
  rationale: Повтор глаголов расспрашивания и целевая конструкция могут выражать лёгкий вызов или побуждение к дальнейшему откровению, однако сам текст не даёт оснований превращать это в строгий укор.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным оттенком. Повтор двух глаголов вопроса сохранён; синтаксис сделан ясным для обычного читателя.
