base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/002.yaml
  text: At that time I[a], Enoch, answered him, saying, “I desire to know about everything[b], but especially about this tree.”
translation:
  language: ru
  text: 'Тогда я, Енох, ответил ему: «Я желаю знать обо всём, но особенно — об этом дереве».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Синтаксис геэзского текста допускает также перевод: «Обо всём этом я желаю знать, а об этом дереве — ещё больше».'
    reason: textual_variant
lexical_decisions:
- source_word: አውሣእክዎ
  choice: ответил ему
  rationale: Глагол означает «ответить», а объектный суффикс 3-го лица мужского рода единственного числа передан местоимением «ему».
- source_word: እንዘ፡ እብል
  choice: 'ответил ему: «…»'
  rationale: Оборот вводит прямую речь; отдельное «сказав» по-русски было бы избыточным после глагола «ответил».
- source_word: በእንተ፡ ኵሉ
  choice: обо всём
  rationale: Передаёт широкий предмет желания Еноха узнать, сохраняя противопоставление последующему упоминанию конкретного дерева.
- source_word: እፈቅድ፡ ኣእምር
  choice: я желаю знать
  rationale: Сочетание выражает желание обрести знание; формулировка естественна для современного литературного русского языка и сохраняет возвышенный тон.
- source_word: ወፈድፋደሰ
  choice: но особенно
  rationale: В данном синтаксическом контексте усилительная форма выделяет дерево среди всего, о чём Енох хочет узнать; «но особенно» ясно передаёт этот контраст.
- source_word: በእንተዝ፡ ዕፅ
  choice: об этом дереве
  rationale: Указательное выражение относится к дереву из предшествующего видения; ዕፅ здесь естественно означает «дерево».
theological_decisions:
- issue: Характер просьбы Еноха о дальнейшем откровении
  choice: «Я желаю знать обо всём, но особенно — об этом дереве»
  alternative: «Обо всём этом я желаю знать, а об этом дереве — ещё больше»
  rationale: Основной текст сохраняет стремление Еноха к более полному знанию и контраст между всем увиденным и особо заинтересовавшим его деревом, не сводя просьбу к простому любопытству. Альтернативная группировка слов возможна из-за трудного синтаксиса.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Конструкция «ответил ему» сохраняет грамматически выраженный объект, а прямая речь передана без тяжеловесного буквального «ответил ему, говоря».
