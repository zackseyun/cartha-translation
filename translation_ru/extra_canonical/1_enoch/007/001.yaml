base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/007/001.yaml
  text: And all the others with them took wives for themselves[a], and each chose one for himself.
translation:
  language: ru
  text: И все остальные вместе с ними взяли себе жён[a], и каждый выбрал себе одну.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «женщин». Геэзское существительное может обозначать женщин вообще, но в этой конструкции обычно имеет значение «жён».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ባዕዳን
  choice: остальные
  rationale: В контексте слово обозначает остальных членов уже упомянутой группы, а не посторонних или чужеземцев.
- source_word: ኵሉ
  choice: все
  rationale: Передаёт полноту состава группы; в сочетании получается естественное русское «все остальные».
- source_word: ምስሌሆሙ
  choice: вместе с ними
  rationale: Сохраняет значение совместности и связь остальных участников с ранее упомянутыми лицами.
- source_word: ነሥኡ ሎሙ አንስተ
  choice: взяли себе жён
  rationale: Конструкция обычно означает взятие женщин в жёны; «себе» сохраняет возвратное значение ሎሙ, а сноска отмечает лексическую неоднозначность существительного.
- source_word: ኃረዩ
  choice: выбрал
  rationale: Передаёт осознанное индивидуальное действие; единственное число согласовано с распределительным «каждый».
- source_word: ለለ ርእሱ አሐተ
  choice: каждый выбрал себе одну
  rationale: Сохраняет распределительность, возвратность и явное указание на одну женщину для каждого.
theological_decisions:
- issue: Передача አንስተ как «женщин» или «жён»
  choice: жён
  alternative: женщин
  rationale: В данной конструкции существительное имеет брачный смысл. «Жён» описывает форму заявленного союза, не оправдывая сам поступок; более широкое значение «женщин» сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык; синтаксис лаконичный и повествовательный. Повтор «себе» сохранён, поскольку в двух частях стиха он передаёт отдельные возвратные элементы исходного текста.
