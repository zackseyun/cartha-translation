  yaml_path: translation/extra_canonical/1_enoch/051/001.yaml
  text: And in those days the earth will give back from its womb[c][b][a], and Sheol will give back what it has received, .
translation:
  language: ru
  text: 'И в те дни земля возвратит вверенное ей[a], и шеол возвратит то, что было ему вверено, а Погибель возвратит то, что она должна отдать. И Он изберёт среди них праведных и святых, потому что приблизился день их спасения.


    И в те дни Избранный воссядет на своём престоле, и из уст его изойдут все замыслы мудрости, ибо Господь духов наделил его этим и прославил его.


    И в те дни горы запляшут, как бараны, и холмы запрыгают, как ягнята, насытившиеся молоком. И все они станут ангелами на небе[b], и лица их засияют от радости, потому что в те дни Избранный восстал. Земля возрадуется; праведные будут жить на ней, а избранные — ходить и странствовать по ней.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также образное прочтение: «земля отдаст из своего чрева». Однако в контексте трёх хранилищ форма слова может означать «вверенное ей»; это согласуется со следующими членами: шеол и Погибель возвращают удерживаемое ими.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен иной синтаксический разбор: «и все ангелы на небе…»; тогда дальнейшие слова о сияющих лицах относятся к ангелам. Эфиопская фраза неоднозначна в отношении слов «все» и «ангелы».'
    reason: textual_syntax
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: в те дни
  rationale: Сохраняет обычную апокалиптическую временную формулу и её повторяющийся ритм.
- source_word: ታገብእ / ያገብእ
  choice: возвратит
  rationale: Повторённый глагол изображает землю, шеол и Погибель как хранилища, которые отдают назад удерживаемое ими.
- source_word: ማሕፀንታ
  choice: вверенное ей
  rationale: Форма с -ት допускает понимание существительного как «вверенное, вклад» и согласуется с параллельными выражениями «то, что принял» и «то, что должна»; образ чрева отмечен как текстовая лексическая альтернатива.
- source_word: ሲኦል
  choice: шеол
  rationale: Транслитерация сохраняет древнеиудейское обозначение мира мёртвых и не отождествляет его без основания с позднейшим понятием ада.
- source_word: ሀጕል
  choice: Погибель
  rationale: Передаёт олицетворённую силу или область погибели, отличную в тексте от земли и шеола.
- source_word: ኅሩይ
  choice: Избранный
  rationale: Субстантивированное обозначение центральной эсхатологической фигуры; заглавная буква помогает сохранить его титульную функцию.
- source_word: ኅሊናተ ጥበብ
  choice: замыслы мудрости
  rationale: Передаёт смысл мыслей, намерений или советов мудрости, избегая неестественного буквального сочетания.
- source_word: እግዚአ መናፍስት
  choice: Господь духов
  rationale: Формально сохраняет характерный для книги титул без конфессионального истолкования.
- source_word: ያንሶስዉ
  choice: странствовать
  rationale: Передаёт движение и свободное хождение по земле, не сводя глагол к простому «идти».
theological_decisions:
- issue: Земля как чрево или хранитель вверенного
  choice: «возвратит вверенное ей» в основном тексте
  alternative: «отдаст из своего чрева»
  rationale: Морфология формы ማሕፀንታ и юридико-хранительский параллелизм следующих двух членов поддерживают значение «вверенное»; образ чрева остаётся в сноске как значимая традиционная и лексическая альтернатива.
- issue: Значение шеола
  choice: «шеол»
  alternative: «мир мёртвых», «могила», «ад»
  rationale: Транслитерация сохраняет древнюю концептуальную неоднозначность и не вносит более позднюю доктрину наказания.
- issue: Местоимение при престоле
  choice: «на своём престоле»
  alternative: «на Моём престоле»
  rationale: Представленный эфиопский текст имеет форму третьего лица с притяжательным суффиксом и не даёт основания вводить первое лицо по иной переводческой традиции.
- issue: К кому относится превращение в ангелов
  choice: «все они станут ангелами на небе»
  alternative: «лица всех ангелов на небе засияют»
  rationale: Непосредственная синтаксическая последовательность включает глагол «станут/будут» перед «все они — ангелы на небе»; поскольку традиционное членение понимает фразу иначе, неоднозначность обозначена сноской.
- issue: Время восстания Избранного
  choice: «Избранный восстал»
  alternative: «Избранный восстанет»
  rationale: Сохранён перфективный облик исходной формы внутри пророческой перспективы, не сглаживая напряжение между прошедшей формой и будущим контекстом.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Повтор «И в те дни» сохранён как структурный рефрен. Необычные образы и синтаксические напряжения не устранены молча; две существенные неоднозначности вынесены в сноски.
