lexical_decisions:
- source_word: ወበህየ፡ ርኢኩ
  choice: И там я увидел
  rationale: Сохраняет обычный для повествования переход и формулу рассказа о видении в ясном современном русском языке.
- source_word: ዕፀወ፡ ተኵነኔ
  choice: деревья, дающие благовония
  rationale: Контекст определённо связан с ароматическими деревьями, ладаном и миррой. Такая передача естественнее буквального «деревья благовоний» и не сводит обозначение к одному ботаническому виду; трудность чтения отмечена в сноске.
- source_word: ተፈድፋደ፡ [ቈስቍስ፡] መዓዛ
  choice: с сильным ароматом
  rationale: Передаёт усиленный характер благоухания, не приписывая сомнительному слову чрезмерно точного значения; заключённая в скобки форма в источнике текстуально неуверенна.
- source_word: ስኂን፡ ወከርቤ
  choice: ладана и мирры
  rationale: 'Это названия двух конкретных ароматических веществ: ладана и мирры.'
- source_word: ወዕፀወሂ
  choice: а также деревья…
  rationale: Передаёт добавочное значение заключительных слов и сохраняет оборванность доступной строки, не восполняя отсутствующее описание по переводческой традиции.
theological_decisions:
- issue: Следует ли связывать ароматические деревья с храмом или священным культом
  choice: Оставить образ благовонных деревьев без богословского истолкования
  alternative: Назвать их священными или храмовыми деревьями
  rationale: В строке присутствуют благовония, ладан и мирра, но нет прямого утверждения об их культовом назначении.
- issue: Как передать спорное ተኵነኔ
  choice: «дающие благовония» в основном тексте с указанием буквальной альтернативы в сноске
  alternative: «деревья суда»
  rationale: Контекст ладана и мирры поддерживает ароматическое понимание, однако форма эфиопского свидетеля допускает буквальное прочтение «суд»; напряжение между формой текста и контекстом нельзя скрывать.
