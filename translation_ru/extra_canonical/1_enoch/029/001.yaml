base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/029/001.yaml
  text: And from there I went into another place[a], away from the wilderness[c][b]; and I drew near to the east of this mountain.
translation:
  language: ru
  text: И оттуда я пошёл в другое место, прочь от пустынной земли[a], и приблизился к восточной стороне этой горы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «прочь от пустыни»; слово может обозначать пустынную, дикую или безлюдную местность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально выражение связано с направлением утра, то есть восхода солнца. Возможен перевод: «к востоку от этой горы».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወእምህየኒ
  choice: И оттуда
  rationale: Передаёт переход к следующему месту в повествовании естественным современным русским выражением.
- source_word: ሖርኩ
  choice: я пошёл
  rationale: Сохраняет простой глагол движения без добавления оттенка длительного путешествия.
- source_word: ውስተ መካን ካልእ
  choice: в другое место
  rationale: Точно и без лишней конкретизации передаёт движение в иную область.
- source_word: እምነ መደባራ
  choice: прочь от пустынной земли
  rationale: Передаёт удаление от дикой, безлюдной или пустынной местности; «земля» позволяет избежать слишком узкого образа песчаной пустыни.
- source_word: ወመንገለ ጽባሕ
  choice: к восточной стороне
  rationale: Выражение буквально связано с направлением утра или восхода и в данном синтаксисе обозначает восточную сторону горы.
- source_word: ለደብር ዝንቱ ቀረብኩ
  choice: этой горы … приблизился
  rationale: Сохраняет указательное значение ዝንቱ и смысл приближения; порядок слов перестроен ради естественного русского синтаксиса.
