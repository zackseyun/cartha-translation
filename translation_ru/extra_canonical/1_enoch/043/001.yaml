base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/001.yaml
  text: And I saw other lightnings and the stars of heaven[a], and I saw how he calls them all by their respective names[d][c][b], and they hear him.
translation:
  language: ru
  text: И увидел я другие молнии и звёзды небесные; и увидел я, как он называет их всех — каждого по имени[a], и они слышат его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по именам каждого из них»; повтор предлога в геэзском языке придаёт выражению распределительный смысл: «каждого по имени».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «слышат его»; в данном контексте это может также подразумевать, что они откликаются и повинуются.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: и увидел я
  rationale: Сохраняет повторяющуюся формулу повествования о видении и её торжественный ритм без архаизации.
- source_word: ካልአ መባርቅተ
  choice: другие молнии
  rationale: ካልአ здесь согласуется по смыслу с неодушевлённым множественным መባርቅተ и означает «другие», а не вводит отдельное «нечто иное».
- source_word: ወከዋክብተ ሰማይ
  choice: и звёзды небесные
  rationale: Естественное русское выражение с возвышенным библейско-апокалиптическим оттенком.
- source_word: ከመ ይጼውዖሙ
  choice: как Он называет их
  rationale: После глагола зрительного восприятия конструкция естественно передаёт наблюдаемое действие; настоящее время сохраняет форму источника.
- source_word: ለኵሎሙ
  choice: их всех
  rationale: Передаёт полноту охвата кратко и естественно.
- source_word: በበአስማቲሆሙ
  choice: каждую по имени
  rationale: Повтор предлога በበ- имеет распределительное значение. Женский род «каждую» грамматически соотносится с ближайшими однородными существительными «молнии» и «звёзды».
- source_word: ወይሰምዕዎ
  choice: и они слышат Его
  rationale: Сохраняет основной смысл глагола «слышать», не заменяя его более истолковывающим «повинуются».
theological_decisions:
- issue: Представлены ли небесные светила лишь как названные объекты или как откликающиеся существа под Божьей властью
  choice: Он называет их всех — каждую по имени, и они слышат Его
  alternative: Он призывает каждую по имени, и они повинуются Ему
  rationale: Личностно звучащий образ источника сохранён, но не превращён ни в простую метафору, ни в прямое утверждение определённой ангелологии. Местоимение «Он» оставляет подразумеваемого деятеля так же не названным, как в источнике.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Повтор «увидел я» сохранён ради композиционного ритма. Тире помогает естественно выразить распределительное уточнение, не меняя синтаксического смысла.
