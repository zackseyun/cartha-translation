base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/002.yaml
  text: And I saw the balances of righteousness[a], how they are weighed according to their lights, the width of their places, and the day of their appearing; and their revolution brings forth lightning, and their revolution is according to the number of the angels[e][d][c][b], and they keep faith with one another.
translation:
  language: ru
  text: 'И увидел я весы праведности[a]: как они взвешиваются по своим светам[b], широте своих мест и дню их появления; их обращение рождает молнию[c], и их обращение совершается сообразно числу ангелов; и они хранят верность друг другу[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начало стиха трудно для толкования. Здесь принято чтение «весы праведности»; при ином разборе его передавали как описание того, как были распределены светила праведности.
    reason: textual_variant
  - marker: b
    text: 'Буквально: «по их светам». Не вполне ясно, что именно взвешивается и служат ли свет, широта мест и день появления тремя мерилами взвешивания.'
    reason: alternative_reading
  - marker: c
    text: «Обращение» может означать также «поворот» или «круговое движение»; это слово не тождественно слову, переданному выше как «появление».
    reason: lexical_alternative
  - marker: d
    text: Заключительную фразу можно понимать либо о небесных телах, сохраняющих взаимную согласованность, либо об ангелах. Местоименный субъект в тексте допускает обе возможности.
    reason: alternative_reading
lexical_decisions:
- source_word: መዳልወ ጽድቅ
  choice: весы праведности
  rationale: መዳልወ здесь понимается как «весы», а родительное сочетание ጽድቅ сохраняется буквально. Это передаёт образ праведного мерила, не превращая его в конфессионально обусловленное толкование.
- source_word: ይደለው
  choice: взвешиваются
  rationale: Глагол связан со взвешиванием и согласуется с образом весов. Возвратная форма сохраняет неопределённость относительно того, кто производит взвешивание.
- source_word: ብርሃናቲሆሙ
  choice: по своим светам
  rationale: Сохранено множественное число «светы» и отношение принадлежности. Более конкретное «светила» могло бы преждевременно определить субъект.
- source_word: ርሐበ / переданное в транскрипции как ሰረኃበ
  choice: широте
  rationale: С учётом выявленной ошибки передачи форма понимается как «ширина, широта», а не как глагол «покоиться» или «утверждаться».
- source_word: መካናቲሆሙ
  choice: своих мест
  rationale: Прямое и естественное соответствие; «обители» или «места пребывания» добавляли бы отсутствующую в слове конкретизацию.
- source_word: ዕለተ ክነቶሙ
  choice: дню своего появления
  rationale: ዕለት передано как «день», а трудная форма ክነቶሙ — как «их появление». Единственное число сохранено вслед за формой источника.
- source_word: ሚጠቶሙ
  choice: их обращение
  rationale: Слово обозначает поворот, круговое движение или обращение; «обращение» естественно в астрономическом контексте и не смешивает его с временами года.
- source_word: መብረቅ ይወልድ
  choice: рождает молнию
  rationale: Буквальный образ рождения сохранён вместо более плоского «производит молнию».
- source_word: በኍልቈ መላእክት
  choice: сообразно числу ангелов
  rationale: Предложная конструкция выражает соответствие числу; глагол «сосчитано» не добавляется. መላእክት в небесном контексте означает «ангелы».
- source_word: ሃይማኖቶሙ የዓቅቡ በበይናቲሆሙ
  choice: они хранят верность друг другу
  rationale: Фраза выражает взаимную надёжность и верность. «Хранят верность» удерживает нравственно-космический оттенок, не уточняя сверх текста, кто именно является субъектом.
theological_decisions:
- issue: Образ «весов праведности»
  choice: Сохранён буквально как космический образ праведного мерила.
  alternative: «Светила праведности были распределены» или отождествление весов с конкретным небесным судом.
  rationale: Текст труден, однако чтение «весы» лучше соответствует уточнённому лексическому разбору. Перевод не определяет, относятся ли весы непосредственно к суду, небесному порядку или иной стороне видения.
- issue: Неявный субъект форм множественного числа
  choice: Сохранено местоименное «они» без вставки «светила», «звёзды» или «ангелы».
  alternative: Явно назвать субъект небесными светилами либо ангелами.
  rationale: Контекст указывает на небесные сущности или движения, но сам стих не называет их однозначно; конкретизация сняла бы подлинную неоднозначность.
- issue: Взаимная верность в заключительной фразе
  choice: 'Фраза отнесена к не названным прямо участникам небесного порядка: «они хранят верность друг другу».'
  alternative: «Ангелы хранят верность между собой» или «светила согласованы друг с другом».
  rationale: Так сохраняются и личностное звучание верности, и космический контекст, без окончательного отождествления субъекта.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Инверсия «И увидел я» поддерживает достоинство видения, не делая язык архаичным. Синтаксическая напряжённость исходного перечисления частично сохранена, а добавленное «совершается» лишь делает вторую фразу грамматически естественной по-русски.
