base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/003.yaml
  text: And I asked the angel who went with me[a], who showed me what was hidden, “What are these?”
translation:
  language: ru
  text: 'И я спросил ангела, который шёл со мной и показал мне сокрытое[a]: «Что это?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скрытое», «тайное»; эфиопское слово обозначает то, что было сокрыто до того, как его показали в видении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእልክዎ
  choice: я спросил
  rationale: Глагол от ሰአለ означает «спрашивать, вопрошать». Введение прямого вопроса естественно передаётся современным русским «я спросил».
- source_word: መልአክ
  choice: ангела
  rationale: В апокалиптическом видении это небесный спутник и истолкователь; «ангел» точнее контекстуального значения, чем общее «вестник».
- source_word: ዘየሐውር ምስሌየ
  choice: который шёл со мной
  rationale: Передаёт относительное придаточное и сопровождающее движение в ходе видения, не утяжеляя фразу буквальным оборотом.
- source_word: ዘአርአየኒ
  choice: и показал мне
  rationale: Каузативный глагол имеет значение «показать, дать увидеть». Союз «и» естественно связывает два определения одного ангела.
- source_word: ኅቡእ
  choice: сокрытое
  rationale: Субстантивированное «сокрытое» сохраняет апокалиптический мотив прежде скрытой, а затем показанной реальности, не уточняя без основания её число или характер.
- source_word: ምንት እሙንቱ እሉ
  choice: Что это?
  rationale: Краткий русский вопрос естественно указывает на только что увиденные предметы или явления. Формальное число указательного выражения в русском в такой конструкции обычно не выражается.
theological_decisions:
- issue: Обозначение сокрытого предмета откровения
  choice: сокрытое
  alternative: сокровенные вещи / тайное
  rationale: «Сокрытое» сохраняет мотив раскрытия невидимых небесных реалий, но не вводит специального учения о тайнах и не конкретизирует то, что исходный текст оставляет неопределённым.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным повествовательным строем. Местоименная связь сохранена ясно; архаизмы и конфессионально окрашенные уточнения не добавлены. Сноска поставлена непосредственно после слова «сокрытое», к которому относится лексическая альтернатива.
