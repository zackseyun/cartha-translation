base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/004.yaml
  text: 'And he said to me[d][c][b][a], “The Lord of Spirits has shown you their names: these are the names of the holy ones who dwell upon the dry ground and believe in the name of the Lord of Spirits forever and ever.”'
translation:
  language: ru
  text: 'И он сказал мне: «Господь духов показал тебе их подобие[a]: это имена святых[b], которые живут на суше[c] и веруют[d] в имя Господа духов во веки веков».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их образ»; возможно также: «их притчу». Эфиопское выражение допускает понимание увиденного как подобия или символического представления святых.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально конструкция содержит предваряющее местоимение: «это их имена — святых», что естественно передаётся по-русски как «это имена святых».'
    reason: syntactic_clarification
  - marker: c
    text: 'Буквально: «на сухой земле». Такое выражение может подчёркивать отличие живущих на земле от небесных существ, показанных в видении.'
    reason: lexical_alternative
  - marker: d
    text: 'Или: «уповают». Эфиопский глагол может обозначать как веру, так и доверие.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤለኒ
  choice: И он сказал мне
  rationale: Сохраняет обычную повествовательную формулу прямой речи и характер отчёта о видении.
- source_word: ምስለ ዘዚአሆሙ
  choice: их образ
  rationale: В данном синтаксическом положении ምስለ естественно понимать как форму существительного со значением «образ, подобие», а ዘዚአሆሙ — как «их». Формулировка сохраняет символическую связь увиденного со святыми, не уточняя её сверх текста.
- source_word: እግዚአ መንፈሳት
  choice: Господь духов
  rationale: Сохраняет устойчивый енохический титул Бога, не превращая его в общее описательное выражение.
- source_word: አርአየከ
  choice: показал тебе
  rationale: Прямо передаёт завершённое действие откровения и естественно звучит по-русски.
- source_word: እሉ እሙንቱ አስማቲሆሙ ለቅዱሳን
  choice: это имена святых
  rationale: Указательное местоимение передано естественной русской отождествительной конструкцией; местоименный суффикс при «именах» понят как предваряющий последующее «святых».
- source_word: እለ የኃድሩ ዲበ የብስ
  choice: которые живут на суше
  rationale: የብስ буквально обозначает сушу или сухую землю. «На суше» сохраняет конкретный образ и возможное противопоставление небесной сфере.
- source_word: ወየአምኑ በስሙ
  choice: и веруют в имя
  rationale: Глагол допускает значения веры и доверия. «Веруют в имя» сохраняет религиозную весомость исходной идиомы без дополнительного истолкования.
- source_word: ለዓለመ ዓለም
  choice: во веки веков
  rationale: Традиционное и понятное русское соответствие усиленной формуле вечной длительности.
theological_decisions:
- issue: Кого обозначают «святые»
  choice: Земные верные, описанные как живущие на суше
  alternative: Небесные ангельские существа либо намеренно смешанная земная и небесная группа
  rationale: Определительные слова о жизни на суше и вере в имя Господа духов естественнее всего относятся к людям на земле. При этом перевод не добавляет слова «люди» и тем самым не устраняет полностью присущую апокалиптическому контексту смысловую напряжённость.
- issue: Смысл «их образа»
  choice: Увиденное служит образом или подобием святых
  alternative: «С ними» или «о них»; также возможно более узкое «их притча»
  rationale: Синтаксис и существительное со значением подобия поддерживают чтение «их образ», однако перевод и примечание не определяют точный характер символического соответствия.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Устойчивые формулы «Господь духов» и «во веки веков» сохранены; редкое «суша» выбрано ради конкретного образа исходного текста. Подлинная неоднозначность ምስለ вынесена в примечание, но основной текст следует наиболее связному существительному чтению «образ/подобие».
