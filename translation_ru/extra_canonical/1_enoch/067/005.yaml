translation:
  language: ru
  text: И увидел я ту долину, в которой было великое потрясение и потрясение вод[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великое содрогание… и содрогание вод». Повторённое геэзское слово указывает на сильное возмущение, однако его точный оттенок может варьироваться от смятения до потрясения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢክዋ
  choice: И увидел я
  rationale: Сохраняет присоединительный союз и характерную для повествования о видениях формулу глагола «видеть».
- source_word: ለይእቲ ቈላ
  choice: ту долину
  rationale: ቈላ обозначает низменное место или долинообразное углубление; «долина» естественно звучит по-русски и соответствует образу местности в контексте.
- source_word: እንተ ሀውከ ዓቢይ ባቲ
  choice: в которой происходило великое содрогание
  rationale: Относительная конструкция описывает происходившее в долине. «Содрогание» передаёт сильное, физически ощутимое возмущение, не уточняя его как землетрясение; «великое» сохраняет усиление ዓቢይ.
- source_word: ወሀውከ ማያት
  choice: и содрогание вод
  rationale: Повтор слова «содрогание» воспроизводит риторический повтор оригинала, а множественное «вод» сохраняет форму ማያት и апокалиптический образ.
theological_decisions:
- issue: Характер возмущения в долине
  choice: Физически-космическое «содрогание»
  alternative: «смятение», «возмущение» или «потрясение»
  rationale: Контекст суда допускает образ сильного потрясения творения. Формулировка сохраняет конкретную апокалиптическую силу, но не добавляет отсутствующего в оригинале прямого указания на землетрясение.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной повествовательной интонацией. Инверсия «увидел я» поддерживает стиль видения; повтор ключевого существительного намеренно сохранён.
