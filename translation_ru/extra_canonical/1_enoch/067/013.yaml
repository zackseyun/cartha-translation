base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/013.yaml
  text: For these waters of judgment are for the healing of the flesh of the kings and for the lust of their flesh[b][a]; and because of this they do not see and do not believe that those waters will change and become a fire that burns forever and ever.
translation:
  language: ru
  text: Ибо эти воды суда служат для исцеления тел царей и для удовлетворения их плотских желаний[b][a]; поэтому цари не видят и не верят, что те воды изменятся и станут огнём, который горит во веки веков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «вода суда», если понимать геэзское слово собирательно; множественное число «воды» сохранено ради образа этой сцены.'
    reason: lexical_alternative
  - marker: b
    text: 'При изолированном переводе сохранившегося в данной выписке фрагмента возможно: «Ибо это воды суда». Полный текст стиха продолжается за границей страницы.'
    reason: previous_rendering
lexical_decisions:
- source_word: እስመ
  choice: ибо
  rationale: Вводит объяснение или основание; «ибо» сохраняет возвышенную причинно-пояснительную силу связки.
- source_word: እሉ
  choice: эти
  rationale: Указательное местоимение во множественном числе отсылает к водам, непосредственно присутствующим в видении.
- source_word: ማየ
  choice: воды
  rationale: Множественное число сохраняет конкретный апокалиптический образ и согласуется с дальнейшим упоминанием этих вод.
- source_word: ኵነኔ
  choice: суда
  rationale: Передаёт широкий судебно-эсхатологический смысл, не сужая его до одного лишь осуждения или наказания.
- source_word: ለፈውሰ ሥጋሆሙ ለነገሥት
  choice: служат для исцеления плоти царей
  rationale: Сохраняет целевое значение конструкции и телесную образность исходного текста.
- source_word: ወለፍትወተ ሥጋሆሙ
  choice: и для удовлетворения желаний их плоти
  rationale: «Желания плоти» естественно передаёт чувственное влечение, не уточняя его сверх источника; добавление «удовлетворения» обусловлено параллельной целевой конструкцией.
theological_decisions:
- issue: Передача ኵነኔ как судебного действия или его карательного результата
  choice: суд
  alternative: осуждение; наказание
  rationale: «Суд» сохраняет широту апокалиптического образа божественного правосудия и не разрешает преждевременно, идёт ли речь о приговоре либо наказании.
- issue: Парадокс вод суда, используемых царями как исцеление
  choice: сохранить прямое сопоставление без поясняющего толкования
  alternative: уточнить, что исцеление лишь кажущееся или временное
  rationale: Источник намеренно удерживает напряжение между нынешним употреблением вод и их будущим превращением в вечный огонь.
