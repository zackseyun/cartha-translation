base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/006.yaml
  text: And when all this happened[a], from that fiery stream and their convulsion in that place, a smell of sulfur was produced and joined with those waters[c][b]; and that valley of the angels who led astray burns beneath that land.
translation:
  language: ru
  text: И когда всё это произошло, от того огненного потока и от их содрогания в том месте возник запах серы[a] и соединился с теми водами[b][c]; и та долина ангелов, которые вводили в заблуждение, горит под той землёй.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Традиционный вариант: «сера горючая»; архаичное русское слово — «жупел».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «смешался с теми водами».'
    reason: alternative_reading
  - marker: c
    text: 'Возможное, хотя менее вероятное членение: «И всё это произошло от того огненного потока, а в том месте возник запах серы». Эфиопский текст в этой части труден.'
    reason: previous_rendering
lexical_decisions:
- source_word: ነጠብጣብ እሳት
  choice: огненный поток
  rationale: Передаёт образ текущего огня естественно для русского языка, не сводя выражение ни к отдельным каплям, ни к обычной реке.
- source_word: ሀውኮሙ
  choice: их содрогание
  rationale: Сохраняет значение сильного движения или возмущения и местоименный суффикс «их», не уточняя без достаточных оснований, к чему именно относится местоимение.
- source_word: መካን
  choice: место
  rationale: Нейтральное широкое обозначение места соответствует визионерскому контексту.
- source_word: ተወልደ
  choice: возник
  rationale: Буквально глагол связан с рождением, но применительно к запаху естественное русское соответствие — «возник».
- source_word: ጼና ተይ
  choice: запах серы
  rationale: Современная и понятная передача сернистого запаха; традиционное «сера горючая» или «жупел» было бы архаичным.
- source_word: ተኃብረ ምስለ እልኩ ማያት
  choice: соединился с теми водами
  rationale: Сохраняет широкий смысл соединения, не исключая более конкретного понимания «смешался».
- source_word: ቈላ
  choice: долина
  rationale: Ясно передаёт низменность или долинообразное углубление в енохической топографии.
- source_word: እንተ መላእክት እለ አስሐቱ
  choice: ангелов, которые вводили в заблуждение
  rationale: Передаёт активное действие ангелов, не добавляя отсутствующий в данном стихе объект этого действия.
- source_word: ትነድድ መትሕተ ይእቲ ምድር
  choice: горит под той землёй
  rationale: Сохраняет продолжающееся подземное горение и локальный смысл слова «земля».
theological_decisions:
- issue: Роль ангелов в заблуждении
  choice: ангелы, которые вводили в заблуждение
  alternative: ангелы, которые были введены в заблуждение
  rationale: Активная форма исходного относительного глагола естественнее представляет ангелов действующими лицами; формулировка не гармонизируется с более поздними демонологическими системами.
- issue: Связь запаха серы с водами
  choice: запах возник и соединился с водами
  alternative: запах возник и смешался с водами
  rationale: 'Более широкое «соединился» сохраняет неоднозначность: речь может идти как о физическом смешении, так и о сопряжении сернистого испарения с водами.'
translation_notes:
  register: Современный литературный русский язык с достоинством визионерского повествования. Синтаксис оставлен несколько напряжённым там, где напряжён и неоднозначен геэзский текст; местоимение «их» намеренно не получает добавленного толкованием референта.
