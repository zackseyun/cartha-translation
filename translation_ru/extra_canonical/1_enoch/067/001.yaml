base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/001.yaml
  text: And in those days the word of the Lord came to me[a], and he said to me, “Noah, your portion has come up before me—a portion without blame[b], a portion of love and uprightness.”
translation:
  language: ru
  text: 'И в те дни было ко мне слово Господа, и Он сказал мне: «Ной, твой удел взошёл ко Мне[a] — удел, не заслуживающий упрёка[b], удел любви и прямоты».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «твой удел вознёсся предо Мною». Геэзский текст сохраняет образ движения вверх, к Божьему присутствию.'
    reason: lexical_alternative
  - marker: b
    text: Выражение можно также перевести как «безупречный» или «не заслуживающий порицания». Поскольку эта часть «Притч» сохранилась главным образом на геэзе, оттенок значения следует передавать с осторожностью.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወበእማንቱ መዋዕል
  choice: И в те дни
  rationale: Сохранена повторяющаяся апокалиптическая временная формула и её возвышенный, но понятный современному читателю строй.
- source_word: ቃለ እግዚአብሔር
  choice: слово Господа
  rationale: Устойчивая формула пророческого откровения; передаёт речь, исходящую от Господа, без лишнего истолкования.
- source_word: ኀቤየ
  choice: ко мне / мне
  rationale: При глаголах «было» и «сказал» естественно выражает направленность речи к рассказчику.
- source_word: ክፍልከ
  choice: твоя доля
  rationale: '«Доля» сохраняет диапазон значений: удел, назначенная часть или положение Ноя; перевод не сводит образ к одному богословскому толкованию.'
- source_word: ዐርገ ኀቤየ
  choice: вознеслась предо Мною
  rationale: Сохранён образ восхождения в Божье присутствие; «предо Мною» естественно передаёт сцену небесного представления или суда.
- source_word: ዘአልቦቱ ሒስ
  choice: без упрёка
  rationale: Формулировка сохраняет оттенок отсутствия обвинения или порицания и не превращает характеристику в прямое утверждение абсолютного безгрешия.
- source_word: ፍቅር
  choice: любви
  rationale: Сохранено существительное и параллельное построение характеристик доли Ноя.
- source_word: ወርትዕ
  choice: и правоты
  rationale: «Правота» передаёт этическую правильность и прямоту, не перегружая выражение более поздней догматической терминологией.
theological_decisions:
- issue: Смысл «доли» Ноя в контексте откровения и суда
  choice: твоя доля вознеслась предо Мною
  alternative: твой удел взошёл ко Мне
  rationale: Выбранный вариант сохраняет неоднозначность между уделом, наследием и представленным перед Богом положением Ноя, а также вертикальный образ исходного текста.
- issue: Степень нравственного утверждения в ዘአልቦቱ ሒስ
  choice: без упрёка
  alternative: безупречная; не заслуживающая порицания
  rationale: Перевод выражает сильное одобрение, но оставляет возможным судебный или репутационный смысл и не утверждает недвусмысленно абсолютное нравственное совершенство.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формы «предо Мною» и «вознеслась» поддерживают торжественность небесной сцены, оставаясь понятными. Параллелизм «доля… доля… доля…» сохранён как значимый риторический приём.
