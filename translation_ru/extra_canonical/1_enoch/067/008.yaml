base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/008.yaml
  text: And in those days those waters will be for the kings and the mighty and the exalted[a], and for those who dwell on the dry ground, for the healing of the body and for the punishment of the spirit; and their spirit will be full of pleasure, so that their bodies may be judged, because they have denied the Lord of Spirits, and they see their judgment every day[d][c][b], yet they do not believe in his name.
translation:
  language: ru
  text: И в те дни эти воды будут для царей, могущественных и возвышенных, и для живущих на суше — для исцеления тела и наказания духа[a]. Их дух наполнится наслаждением[b], чтобы тела их были преданы суду, потому что они отреклись от Господа духов и каждый день видят свой суд, однако не верят в его имя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «для вразумления духа». Однако в данном контексте слово может обозначать наказание или мучение.'
    reason: lexical_alternative
  - marker: b
    text: 'Фраза о наслаждении текстуально и контекстуально трудна: эфиопский текст, по-видимому, употребляет положительное слово со значением «наслаждение», «услада», хотя окружающий контекст говорит о суде.'
    reason: textual_variant
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: в те дни
  rationale: Сохранена характерная для апокалиптического повествования временная формула.
- source_word: ማያት
  choice: эти воды
  rationale: Передано множественное число; указательное слово естественно связывает стих с уже упомянутыми водами.
- source_word: ለነገሥት ወለዐዚዛን ወለልዑላን
  choice: царям, могущественным и возвышенным
  rationale: Сохранён трёхчленный ряд общественных групп без сведения разных определений к одному понятию.
- source_word: ወለእለ የኃድሩ ዲበ የብስ
  choice: а также живущим на суше
  rationale: Конкретное значение «суша» сохранено ради противопоставления водам; выражение сделано естественным по-русски.
- source_word: ለፈውሰ ሥጋ
  choice: для исцеления тела
  rationale: Речь идёт о физическом исцелении, поэтому «тело» здесь яснее, чем «плоть».
- source_word: ወለአዝነ መንፈስ
  choice: и наказания духа
  rationale: «Наказание» передаёт суровое значение слова и соответствует контексту эсхатологического суда, не смягчая его до исправительного наставления.
- source_word: ወትውኔተ ይመልእ መንፈሶሙ
  choice: И дух их наполнится наслаждением
  rationale: Сохранено наиболее прямое положительное значение трудного выражения, хотя оно напряжённо сочетается с контекстом суда; трудность отмечена в сноске.
- source_word: ከመ ይትኰነኑ ሥጋሆሙ
  choice: чтобы тела их были преданы суду
  rationale: Передан пассивный смысл суда без усиления до однозначного «осуждены».
- source_word: እስመ ክሕድዎ ለእግዚአ መንፈሳት
  choice: потому что они отреклись от Господа духов
  rationale: Сильный глагол отрицания передан как «отреклись»; устойчивый титул сохранён буквально.
- source_word: ወይሬእዩ ኵነኔሆሙ እንተ ኵሉ ዕለት
  choice: и каждый день видят свой суд
  rationale: Сохранены юридический оттенок существительного и простое временное значение выражения.
theological_decisions:
- issue: Соотношение исцеления, наказания и суда
  choice: 'Сохранена последовательность: телесное исцеление, наказание духа и последующий суд над телами.'
  alternative: Истолковать упоминание исцеления иронически и передать весь отрывок исключительно языком мучения.
  rationale: Сам текст соединяет исцеление и наказание. Перевод не устраняет это богословское напряжение и не навязывает ему однозначного объяснения.
- issue: Значение трудной фразы о наполнении духа
  choice: «дух их наполнится наслаждением»
  alternative: «дух их наполнится усладой» либо предположительное отрицательное значение, основанное на контексте
  rationale: Положительное словарное значение сохранено, а контекстуальная трудность открыто обозначена в сноске вместо молчаливого исправления текста.
- issue: Сила выражения о суде над телами
  choice: «были преданы суду»
  alternative: «были осуждены»
  rationale: Формулировка сохраняет судебный смысл, не подменяя сам акт суда его предполагаемым обвинительным исходом.
translation_notes:
  register: Современный литературный русский язык с сдержанным апокалиптическим звучанием. Синтаксис слегка приподнят, но остаётся понятным; конкретные образы и повторяющиеся термины «тело», «дух», «суд» сохранены.
