base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/012.yaml
  text: And I heard Michael answering and saying[a], “This judgment by which the angels are judged is a testimony against the kings and the mighty[b], those who possess the dry land.”
translation:
  language: ru
  text: 'И я услышал, как Михаил отвечал и говорил: «Этот суд, которым судимы ангелы, — свидетельство[a] против царей и могущественных, владеющих сушей[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «свидетель». Геэзское существительное в судебном контексте может означать и свидетельство, и свидетеля.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сушей». Возможно, имеется в виду обитаемая земля, находящаяся под властью людей, а не вся земля в космическом смысле.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሰማዕክዎ፡ ለሚካኤል
  choice: И я услышал, как Михаил
  rationale: Форма первого лица с объектным суффиксом и последующим указанием на Михаила естественно передаётся по-русски конструкцией «услышал, как Михаил…».
- source_word: ያውሥእ፡ ወይብል
  choice: отвечал и говорил
  rationale: Сохранена парная формула речи, характерная для возвышенного повествования; её свёртывание до одного глагола устранило бы особенность исходного текста.
- source_word: ኵነኔ፡ ዛቲ
  choice: этот суд
  rationale: «Суд» сохраняет широту судебного значения, не сужая его заранее до приговора или осуждения; указательное местоимение относится к конкретному суду, описанному ранее.
- source_word: እንተ፡ ይትኴነኑ፡ መላእክት
  choice: которым судимы ангелы
  rationale: Сохранены относительная конструкция и страдательное значение; «судимы» не усиливает текст до однозначного «осуждены».
- source_word: ሰማዕተ
  choice: свидетельство
  rationale: Слово имеет судебный оттенок и может означать как «свидетельство», так и «свидетеля»; в основном тексте выбрано более естественное для связи с «судом» отвлечённое существительное, а альтернатива отмечена в сноске.
- source_word: ለነገሥት፡ ወለዐዚዛን
  choice: против царей и могущественных
  rationale: Предлог «против» передаёт наиболее вероятную судебную направленность свидетельства. «Могущественные» обозначает влиятельных и сильных людей, сохраняя возвышенный апокалиптический регистр.
- source_word: እለ፡ ይእኅዝዋ፡ ለየብስ
  choice: владеющих сушей
  rationale: Глагол передан как владение или обладание, а የብስ — буквально как «суша», без расширения значения до всего мира.
theological_decisions:
- issue: К кому относится свидетельство и какова его направленность
  choice: Суд над ангелами служит свидетельством против земных царей и могущественных
  alternative: Ангелы сами являются свидетелями для царей и могущественных либо свидетельство предназначено им без явно враждебной направленности
  rationale: Синтаксически «свидетельство» естественнее всего относится к названному перед ним суду, а последующая конструкция указывает на тех, против кого оно свидетельствует. Однако семантическая неоднозначность существительного сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Парная формула «отвечал и говорил» сохранена намеренно; синтаксис сделан понятным без устранения подлинной лексической неоднозначности.
