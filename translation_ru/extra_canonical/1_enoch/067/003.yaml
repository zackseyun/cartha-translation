base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/003.yaml
  text: And I will establish your offspring before me forever and ever[a], and I will make those who dwell with you fruitful. It shall not be barren upon the face of the dry ground[c][b], but it shall be blessed and multiplied on the dry ground in the name of the Lord.
translation:
  language: ru
  text: И Я утвержу твоё потомство предо Мною во веки веков и сделаю плодовитыми тех, кто живёт с тобой. Оно не будет бесплодным[a] на лице суши[b], но будет благословенно и умножится на суше во имя Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфиопское чтение помечено как испорченное и буквально, по-видимому, означает: «не будет советоваться (обдумывать, замышлять)». Перевод «не будет бесплодным» следует вероятной конъектуре, хорошо согласующейся с дальнейшими словами о благословении и умножении.'
    reason: textual_variant
  - marker: b
    text: 'Буквально: «на лице сухой земли». Здесь «суша» может означать просто землю или страну.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አጸንዖ
  choice: утвержу
  rationale: Глагол означает «сделать твёрдым, упрочить, утвердить»; «утвержу» сохраняет образ прочности и длительности обещания.
- source_word: ዘርእከ
  choice: твоё потомство
  rationale: Передаёт собирательное единственное число «семя, потомство» естественным современным русским выражением и позволяет сохранить последующее согласование в единственном числе.
- source_word: በቅድሜየ
  choice: предо Мною
  rationale: Близко передаёт пространственно-личное «передо мной, в моём присутствии» и соответствует возвышенному регистру.
- source_word: ለዓለመ ዓለም
  choice: во веки веков
  rationale: Традиционное и понятное русское соответствие усилительной формуле вечности.
- source_word: አዘርኦሙ
  choice: сделаю плодовитыми
  rationale: Каузативная форма связана с семенем, сеянием и произведением потомства; в контексте последующих бесплодия и умножения «сделаю плодовитыми» связно передаёт положительный смысл, не внося идеи насильственного рассеяния.
- source_word: እለ ያኃድሩ ምስሌከ
  choice: тех, кто живёт с тобой
  rationale: Естественная современная передача тех, кто пребывает или обитает вместе с адресатом.
- source_word: †ኢይመክር
  choice: не будет бесплодным
  rationale: Печатный текст помечает форму как испорченную. Перевод следует вероятной близкой конъектуре ኢይመክን, «не будет бесплодным», которую поддерживает контраст с благословением и умножением; рукописное чтение раскрыто в сноске.
- source_word: ገጸ የብስ
  choice: на лице суши
  rationale: Сохраняет конкретный образ буквального выражения «лицо суши», не сводя его без указания к общему «на земле».
- source_word: ይትባረክ
  choice: будет благословенно
  rationale: Пассивное прочтение естественно в контексте обещания; форма единственного числа соотнесена с собирательным «потомство».
- source_word: ይትባዛሕ
  choice: умножится
  rationale: Передаёт увеличение и многочисленность; единственное число сохраняет грамматическую связь с «потомством».
- source_word: በስሙ ለእግዚአ
  choice: во имя Господа
  rationale: Естественная русская передача выражения, связывающего благословение и умножение с именем Господа.
theological_decisions:
- issue: Следует ли выражать обещание явно заветными терминами
  choice: Сохранено «утвержу твоё потомство предо Мною во веки веков» без слова «завет».
  alternative: «Навеки сохраню твоих потомков в Моём завете».
  rationale: В стихе присутствуют торжественное обещание и вечность, но завет прямо не назван; добавление этого термина сузило бы смысл.
- issue: Как передать испорченную отрицательную клаузу
  choice: В основном тексте принято контекстуально вероятное «оно не будет бесплодным», а засвидетельствованное трудное чтение указано в сноске.
  alternative: «Оно не будет советоваться (или замышлять) на лице суши».
  rationale: Форма с обелом буквально выглядит как отрицание глагола «советоваться, обдумывать», однако это чтение плохо связано с контекстом. Вероятная минимальная конъектура даёт «быть бесплодным» и образует ясный контраст с благословением и умножением, но текстовая неопределённость не скрыта.
- issue: К чему относятся глаголы «будет благословенно» и «умножится»
  choice: Они отнесены к собирательному единственному «твоё потомство».
  alternative: Отнести их во множественном числе к «тем, кто живёт с тобой».
  rationale: Формы глаголов имеют третье лицо мужского рода единственного числа и лучше продолжают тему единственного ዘርእከ, «твоё потомство»; русское согласование по грамматическому роду закономерно стало средним.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Архаизирующее «предо Мною» и формула «во веки веков» сохранены как понятные элементы торжественного регистра; остальной синтаксис сделан прямым и доступным.
