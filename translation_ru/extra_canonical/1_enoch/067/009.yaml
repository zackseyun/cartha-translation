base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/009.yaml
  text: And as the burning of their bodies is very great[a], so a change comes upon them in spirit forever and ever[c][b], because before the Lord of Spirits there is none who speaks a vain word.
translation:
  language: ru
  text: И подобно тому как велико горение их тел, так и в духе с ними во веки веков совершается перемена[a], потому что перед Господом духов нет никого, кто произносит пустое слово.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфиопская строка трудна. Буквальнее эту часть можно понять так: «так у них есть перемена духа во веки веков».'
    reason: alternative_reading
lexical_decisions:
- source_word: ውዕየ
  choice: горение
  rationale: Передаёт конкретный образ огненного жара и телесного мучения; «жар» был бы более отвлечённым.
- source_word: ሥጋሆሙ
  choice: их тел
  rationale: Буквально речь идёт об «их плоти», но в данном контексте «их тел» ясно обозначает телесную сторону мучения и естественно звучит по-русски.
- source_word: ተውላጠ
  choice: перемена происходит с ними
  rationale: Сохраняет значение изменения и результативно-пассивный оттенок, не усиливая его до полного «преображения».
- source_word: ለመንፈስ
  choice: в духе
  rationale: Передаёт сферу или сторону, в которой совершается перемена, и сохраняет противопоставление телесному горению.
- source_word: ለዓለመ ዓለም
  choice: во веки веков
  rationale: Традиционная и понятная русская передача усиленной формулы бесконечной длительности.
- source_word: እግዚአ መንፈሳት
  choice: Господом духов
  rationale: Сохраняет устойчивый для 1 Еноха божественный титул.
- source_word: ዘይነግር ነገረ በከ
  choice: кто говорил бы пустое слово
  rationale: በከ означает «напрасно, тщетно», поэтому сочетание передано как «пустое слово», без ошибочного привнесения значения «против них».
theological_decisions:
- issue: Характер перемены в духе
  choice: Сохранено общее обозначение перемены без уточнения, является ли она внутренним изменением, изменением самого духа или изменением состояния.
  alternative: «так у них изменяется дух»
  rationale: Эфиопская конструкция допускает несколько способов соотнести перемену с духом; перевод не разрешает эту богословски значимую неоднозначность.
- issue: Смысл последнего высказывания перед Господом духов
  choice: «нет никого, кто говорил бы пустое слово»
  alternative: «нет никого, кто мог бы сказать слово против них»
  rationale: Лексическое значение በከ указывает на пустоту или тщетность речи, а не на направленность речи против кого-либо; поэтому предполагаемый неясный множественный референт здесь не вводится.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Синтаксис сохраняет исходное соотношение «как… так и…», а трудная конструкция о перемене передана без искусственного догматического уточнения.
