review_pass:
  verdict: revise
  source_fidelity: 'Смысловые компоненты переданы верно: телесное горение, перемена «в духе», длительность «во веки веков», а также отсутствие перед Господом духов пустой/тщетной речи. Перевод правильно следует уточнённому значению በከ («напрасно, тщетно»), не вводя прежнее ошибочное «против них». Однако «перемена происходит с ними» недостаточно естественно по-русски и размывает конструкцию трудного оригинала.'
  naturalness: 'Начальное «И как велико горение их тел» возможно, но тяжеловесно. Оборот «перемена происходит с ними» не является нормальной современной литературной сочетаемостью; «в духе с ними совершается перемена» точнее воспроизводит намеренно не до конца определённую связь перемены с духом. «Кто говорил бы пустое слово» звучит как нереальное условие; при «нет никого» естественнее настоящее время: «кто произносит пустое слово».'
  terminology: «Господь духов» корректно сохраняет устойчивый еноховский титул. «Во веки веков» уместно для торжественного регистра. «Пустое слово» допустимо как передача ነገረ በከ и сохраняет единственное число исходной конструкции.
  issues:
  - severity: medium
    issue: Неестественная конструкция «перемена происходит с ними».
    rationale: Русский оборот неясен и стилистически шероховат. Перестановка «в духе с ними совершается перемена» сохраняет исходную неоднозначность — перемена относится к ним, но её связь с духом не догматически конкретизируется.
  - severity: low
    issue: Сослагательное «кто говорил бы пустое слово» в финальной относительной конструкции.
    rationale: Оно добавляет оттенок гипотетичности, которого нет в утверждении «нет никого, кто говорит/произносит». Настоящее время передаёт исходный общий характер высказывания.
  revised_text: И подобно тому как велико горение их тел, так и в духе с ними во веки веков совершается перемена[a], потому что перед Господом духов нет никого, кто произносит пустое слово.
