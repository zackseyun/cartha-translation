base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/011.yaml
  text: And the waters themselves will be changed in those days[a], for when those angels are judged in those waters, these springs of water will change, and when the angels ascend[c][b], that water of the springs will change and grow cold.
translation:
  language: ru
  text: И сами воды изменятся в те дни, ибо, когда те ангелы будут судимы в этих водах, изменятся их ключи — те водные источники[a]; а когда ангелы поднимутся[b], вода в источниках изменится и остынет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально фразу можно понять как «изменятся их ключи (или источники) — те источники вод». Местоименная связь здесь не вполне ясна; слово также может означать «глаза», но в данном водном контексте естественно значение «ключи, источники».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «когда ангелы поднимутся». Откуда именно они поднимаются и как это движение связано с источниками, эфиопский текст не уточняет.'
    reason: alternative_reading
lexical_decisions:
- source_word: ኪያሁ፡ ማያት
  choice: сами воды
  rationale: Эмфатический элемент ኪያሁ передаёт акцент на самих водах; множественное число ማያት сохранено.
- source_word: ተውላጠ
  choice: изменятся
  rationale: Глагол изменения состояния передан естественным русским возвратным глаголом без усиления до полного преображения.
- source_word: ይትኴነኑ
  choice: будут судимы
  rationale: Сохранено судебное значение глагола без преждевременного уточнения приговора как осуждения или наказания.
- source_word: በውእቱ፡ ማያት
  choice: в этих водах
  rationale: Предложная фраза явно сохранена и указывает место, где ангелы подвергаются суду.
- source_word: ዐያኖሙ፡ እልኩ፡ አንቅዐተ፡ ማያት
  choice: их ключи — те водные источники
  rationale: ዐያኖሙ передано в контекстуальном значении «их ключи/источники», а следующая аппозиционная фраза сохранена. Значение «жар» не вводится, поскольку его нет в засвидетельствованном существительном.
- source_word: የዐርጉ
  choice: поднимутся
  rationale: Передано основное значение движения вверх без уточнения, откуда и с какой целью поднимаются ангелы.
- source_word: ይቈርሩ
  choice: остынет
  rationale: Русский глагол естественно выражает переход воды в холодное состояние и сохраняет итог описанного изменения.
theological_decisions:
- issue: Характер суда над ангелами
  choice: ангелы будут судимы
  alternative: ангелы будут осуждены / наказаны
  rationale: Эфиопский глагол обозначает судебное действие; хотя контекст предполагает кару, сам стих не требует заранее называть исход суда.
- issue: Связь изменения вод с судом и движением ангелов
  choice: события поставлены рядом без объяснения механизма
  alternative: воды являются орудием наказания ангелов
  rationale: Текст связывает суд над ангелами и их восхождение с изменением источников, но не разъясняет причинный механизм; перевод не систематизирует этот образ.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис близок к источнику, но разделён точкой с запятой для ясности. Термин «ключи» употреблён в общеупотребительном значении природных родников и пояснён приложением «водные источники».
