base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/007.yaml
  text: And through its valleys come rivers of fire, where those angels shall be judged who led astray those who dwell upon the dry land.
translation:
  language: ru
  text: И через её долины текут огненные реки[a]. Там будут судимы те ангелы, которые ввели в заблуждение живущих на суше[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «реки огня»; возможно также: «огненные потоки».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «живущих на сухой земле». Вероятно, имеются в виду люди, обитающие на земле, однако конкретный образ суши сохранён.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እነተ፡ ቈላት፡ ዚአሃ
  choice: через её долины
  rationale: В ближайшем контексте ቈላት — множественное число «долины», а ዚአሃ — местоименное «её». Такое прочтение соответствует контексту стихов 4–6 и исправляет прежнее ошибочное понимание как «жар того огня».
- source_word: አፍላገ፡ እሳት
  choice: огненные реки
  rationale: Буквально «реки огня». Русское «огненные реки» естественно и сохраняет яркий апокалиптический образ; более формальная конструкция отражена в сноске.
- source_word: ይመጽኡ
  choice: текут
  rationale: Имперфективная форма допускает настоящее или будущее в описании видения. Сочетание «реки текут» естественно по-русски и передаёт движение, не превращая его в завершённое прошедшее действие.
- source_word: ኀበ
  choice: туда, где
  rationale: Сохраняет направительно-локативный оттенок «к/в то место, где», который одно русское «где» могло бы ослабить.
- source_word: ይትኴነኑ
  choice: будут судимы
  rationale: Передаёт пассивный судебный смысл, не сужая его заранее до «будут осуждены».
- source_word: እልኩቱ፡ መላእክት
  choice: те ангелы
  rationale: В апокалиптическом контексте речь идёт об ангелах, а указательное значение сохранено словом «те».
- source_word: አስሐትዎሙ
  choice: ввели в заблуждение
  rationale: 'Передаёт каузативный смысл: ангелы стали причиной заблуждения других. Формулировка нейтральна и не конкретизирует способ обольщения.'
- source_word: ለእለ፡ የኃድሩ፡ ዲበ፡ የብስ
  choice: живущих на суше
  rationale: Сохраняет конкретный космологический образ «обитающих на сухой земле», не заменяя его более общим «живущих на земле».
theological_decisions:
- issue: Кем являются судимые ангелы
  choice: Оставить местное обозначение «те ангелы, которые ввели в заблуждение» без дальнейшей идентификации.
  alternative: Прямо назвать их стражами из предания, связанного с Быт 6.
  rationale: Сам стих не называет их стражами. Перевод не должен вносить более узкую идентификацию из более широкого енохического контекста.
- issue: Суд или уже вынесенное осуждение
  choice: «будут судимы»
  alternative: «будут осуждены»
  rationale: Исходная судебная форма обозначает совершение суда; вероятный обвинительный исход не следует подставлять в сам глагол.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным апокалиптическим звучанием. Причастные нагромождения устранены; конкретные образы долин, огненных рек и суши сохранены.
