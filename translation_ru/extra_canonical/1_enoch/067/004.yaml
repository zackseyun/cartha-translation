base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/004.yaml
  text: And they bound those angels who had shown lawlessness in that burning valley which my grandfather Enoch had previously shown me in the west[d][c][b][a], by the mountains of gold and silver and iron and soft metal and lead.
translation:
  language: ru
  text: И они заключат тех ангелов, которые показали беззаконие, в той пылающей долине, которую прежде показал мне мой дед Енох на западе,[a] у гор из золота, серебра, железа, мягкого металла[b] и свинца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к западу»; это слово может также означать «вечером», однако окружающие указания на местность говорят в пользу западного направления.'
    reason: lexical_alternative
  - marker: b
    text: Название этого металла в данном свидетельстве неясно; возможны значения «олово», «электрум» или иной очищенный либо мягкий металл.
    reason: lexical_alternative
lexical_decisions:
- source_word: የዐጽዎሙ
  choice: заключат они
  rationale: 'Форма допускает и в контексте будущего суда поддерживает значение будущего действия: «закроют, заключат». Такое чтение точнее передаёт идею заточения, чем прошедшее «связали».'
- source_word: እሙንቱ መላእክት
  choice: тех ангелов
  rationale: В апокалиптическом контексте речь идёт об ангельских существах, подвергаемых суду, а не о человеческих посланниках.
- source_word: እለ አርአይዋ ለዓመፃ
  choice: которые показали беззаконие
  rationale: Сохранён глагол со значением показа или явления и нравственно-юридический смысл слова «беззаконие», без подмены более толковательным «научили» или «совершили».
- source_word: ቈላ እንተ ትነድድ
  choice: пылающей долине
  rationale: Естественно и образно передаёт долину, которая горит, сохраняя картину огненного суда.
- source_word: እንተ አርአየኒ ቀዳሚ እምሔውየ ሄኖክ
  choice: которую прежде показал мне мой дед Енох
  rationale: Активная конструкция называет Еноха, деда говорящего Ноя, субъектом действия; «прежде» указывает на более раннее видение.
- source_word: በዓረብ
  choice: на западе
  rationale: Среди последующих географических ориентиров пространственное значение вероятнее временного «вечером»; альтернативная направительная трактовка отмечена в сноске.
- source_word: አድባረ ወርቅ ወብሩር ወሐፂን
  choice: гор из золота, серебра, железа
  rationale: Конструкция перечисляет горы, соотнесённые с металлами; оборот «из» в русском естественно передаёт их вещественную характеристику.
- source_word: ነጠብጣብ
  choice: мягкого металла
  rationale: Точное название металла в данном свидетельстве неясно. Обобщённый перевод не создаёт ложной определённости, а варианты вынесены в сноску.
- source_word: ናእስ
  choice: свинца
  rationale: В перечне металлов это слово обычно понимается как обозначение свинца.
theological_decisions:
- issue: Характер проступка ангелов
  choice: ангелы «показали беззаконие»
  alternative: ангелы совершили беззаконие; ангелы научили беззаконию
  rationale: Геэзский текст сосредоточен на явлении или показе беззакония. Перевод сохраняет эту непривычную формулировку и не разрешает её богословскую неоднозначность толкованием.
- issue: Временная отнесённость заключения ангелов
  choice: 'будущее: «заключат»'
  alternative: 'прошедшее: «связали»'
  rationale: Имперфектная форма и контекст предстоящего суда поддерживают будущее действие. При этом выбран глагол заключения, сохраняющий конкретный образ удержания под стражей.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной библейско-апокалиптической интонацией. Синтаксис сохранён достаточно близко к источнику, а длинная цепь определений слегка упорядочена для ясности. Все сноски обозначены в основном тексте.
