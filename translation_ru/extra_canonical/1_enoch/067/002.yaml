base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/002.yaml
  text: And now the angels are making a wooden structure[a]; and when the angels have finished that, I will place my hand upon it and guard it, and from it there will come the seed of life, and a transformation will occur[e][d][c][b], so that the dry ground may not remain barren.
translation:
  language: ru
  text: И теперь ангелы строят деревянное сооружение[a]; когда же ангелы закончат его, Я возложу на него Свои руки[b] и буду охранять его. Из него появится семя жизни[c], и наступит перемена[d], чтобы иссохшая земля не оставалась бесплодной[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально здесь употреблено слово, связанное с деревом или древесиной; возможны переводы «деревянные части», «брёвна», «деревянное изделие». В контексте, вероятно, имеется в виду строящийся ковчег, однако прямо он не назван.
    reason: lexical_alternative
  - marker: b
    text: 'Это место в геэзском тексте трудно. Буквально присутствует выражение «Мои руки» и слова «на нём». Возможен иной разбор: «ангелы возложат на него Мои руки и будут стеречь его».'
    reason: textual_variant
  - marker: c
    text: «Семя жизни» передано буквально. Выражение может обозначать живое потомство, жизнетворную силу или возрождение плодородия.
    reason: lexical_alternative
  - marker: d
    text: 'Или: «произойдёт преобразование», «появится изменение». Смысл исходного выражения не вполне ясен.'
    reason: lexical_alternative
  - marker: e
    text: 'Буквально возможен смысл: «чтобы суша не стала обнажённой (пустой)». Перевод «бесплодной» передаёт связь с предшествующим образом семени.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይገብሩ
  choice: строят
  rationale: Имперфект передаёт совершающееся или непосредственно предстоящее действие; настоящее время сохраняет живость видения.
- source_word: መላእክት
  choice: ангелы
  rationale: В апокалиптическом контексте речь идёт о небесных существах, а не о человеческих посланниках.
- source_word: ዕፀወ
  choice: деревянное сооружение
  rationale: Слово связано с деревом и древесиной и может обозначать деревянные материалы или изделие из них. Контекст и последующие местоимения единственного числа позволяют передать подразумеваемый цельный предмет как сооружение, не называя его прямо ковчегом.
- source_word: ወድኡ
  choice: закончат
  rationale: Глагол завершения естественно описывает окончание начатого строительства.
- source_word: እወዲ እዴየ ዲቤሃ
  choice: Я возложу на него Свою руку
  rationale: Основной текст следует первому лицу глагола и сохраняет образ руки, однако число существительного и синтаксис фразы не вполне ясны, что отмечено в сноске.
- source_word: እዐቅባ
  choice: буду хранить его
  rationale: Глагол выражает охрану, сбережение или наблюдение; «хранить» естественно сочетает защитный и сохраняющий оттенки.
- source_word: ዘርአ ሕይወት
  choice: семя жизни
  rationale: Буквальный образ сохранён без уточнения, идёт ли речь о потомстве, жизненной силе или возобновлении плодородия.
- source_word: ተወላጥ ይባእ
  choice: наступит перемена
  rationale: Трудное выражение указывает на возникновение изменения; нейтральная формулировка не сводит его исключительно к росту растений или к богословскому преображению.
- source_word: የብስ ዕራቆ
  choice: иссохшая земля не оставалась бесплодной
  rationale: Передаёт сочетание сухости и лишённости, сохраняя связь с образом семени и возможным восстановлением плодородия.
theological_decisions:
- issue: Следует ли понимать стих как буквальное восстановление плодородия или как символическое возникновение новой жизни
  choice: Сохранить конкретные образы деревянного сооружения, семени жизни и иссохшей земли, не сводя их к одной системе толкования.
  alternative: Истолковать весь стих либо как описание земледельческого восстановления, либо как прямое указание на воскресение или новое творение.
  rationale: Образный язык видения допускает несколько смысловых уровней, а текст не вынуждает выбрать только один из них.
- issue: Следует ли прямо назвать деревянное сооружение Ноевым ковчегом
  choice: Не вводить слово «ковчег» в основной текст.
  alternative: Перевести как «ковчег», опираясь на ближайший контекст главы.
  rationale: Контекст делает такое отождествление вероятным, но само слово в стихе обозначает дерево, древесину или деревянный предмет, поэтому прямое наименование сняло бы подлинную лексическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя, но трудные образы и грамматические неоднозначности не устранены; наиболее существенные из них вынесены в сноски.
