base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/010.yaml
  text: For judgment will come upon them[a], because they trust in the indulgence of their flesh and deny the Spirit of the Lord.
translation:
  language: ru
  text: Ибо суд придёт на них[a], потому что они полагаются на потворство своей плоти и отвергают Духа Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «потворство», в этом дошедшем только на геэзе разделе имеет не вполне ясное значение. Оно может также означать удовольствие, распущенность или, возможно, обман, связанный с их плотью.
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: ибо / потому что
  rationale: Первое употребление связывает изречение с предшествующим контекстом, второе вводит явную причину суда.
- source_word: ትመጽእ
  choice: придёт
  rationale: Будущее время естественно передаёт апокалиптическое возвещение о грядущем суде.
- source_word: ኵነኔ
  choice: суд
  rationale: Сохраняет широкий судебный и эсхатологический смысл, не сужая его до осуждения или приговора.
- source_word: ዲቤሆሙ
  choice: на них
  rationale: Естественная русская передача направления суда против упомянутых лиц.
- source_word: የአምኑ
  choice: полагаются
  rationale: Передаёт не просто веру, а ошибочную опору на последующий объект.
- source_word: በተውኔተ
  choice: на услаждение
  rationale: В сочетании с «плотью» вероятен смысл чувственного удовольствия или потворства плоти, однако лексема не вполне ясна, что отмечено в сноске.
- source_word: ሥጋሆሙ
  choice: своей плоти
  rationale: «Плоть» сохраняет конкретность исходного антропологического термина и его нравственную силу; возвратное местоимение естественно для русского при совпадении обладателя с подлежащим.
- source_word: ወመንፈሰ እግዚአ
  choice: и отвергают Духа Господа
  rationale: Родительная конструкция естественнее всего указывает на принадлежащего Господу Духа; прописная буква отражает это чтение, не добавляя позднейшей догматической формулы.
- source_word: ይክሕዱ
  choice: отвергают
  rationale: Передаёт решительное непризнание и отречение; в современном русском здесь звучит естественнее, чем «отрицают».
theological_decisions:
- issue: Значение выражения «Дух Господа»
  choice: Дух, принадлежащий Господу, которого они отвергают в противопоставлении упованию на плоть
  alternative: Их собственный, данный Богом дух либо духовный путь Господа
  rationale: Родительная конструкция наиболее естественно указывает на Духа Господа. Перевод сохраняет противопоставление плоти и Духа, но не систематизирует его посредством позднейшей христианской терминологии.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического изречения. «Ибо» сохраняет связь с контекстом, а «потому что» ясно вводит основание суда. Неясность ключевой лексемы вынесена в сноску, а не устранена догадочным уточнением.
