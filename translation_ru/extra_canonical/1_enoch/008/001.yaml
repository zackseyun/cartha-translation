base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/008/001.yaml
  text: 'And Azazel taught men to make swords[a], and knives, and shields, and breastplates; and he showed them what was behind them and their works: bracelets, and ornaments, and the painting of the eyes, and the beautifying of the eyelids, and every kind of costly stone[b], and all coloring tinctures.'
translation:
  language: ru
  text: 'И Азазел научил людей делать мечи, ножи, щиты и нагрудники; он показал им то, что было позади них, и их дела[a]: браслеты, украшения, подкрашивание глаз, украшение век[b], всякие драгоценные камни и всевозможные красящие вещества.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфиопская фраза, переданная словами «то, что было позади них», имеет трудное, возможно повреждённое чтение (†ዘእምድኅሬሆሙ†). Она может указывать на то, что стояло за этими ремёслами или последовало из них, однако сохранившаяся формулировка не позволяет установить смысл уверенно. Следующее выражение «и их дела» также сохраняет неопределённость связи в исходной фразе.
    reason: textual_variant
  - marker: b
    text: Имеются в виду конкретные косметические приёмы — нанесение краски вокруг глаз и украшение век, а не красота вообще.
    reason: cultural_note
lexical_decisions:
- source_word: መሀሮሙ፡ ለሰብእ
  choice: научил людей
  rationale: 'Глагол обозначает обучение или наставление, а ሰብእ здесь имеет обобщённое значение: люди, человечество.'
- source_word: ገቢረ፡ አሰይፍት
  choice: делать мечи
  rationale: ገቢረ указывает на изготовление, а не просто на владение оружием.
- source_word: መጣብኅት
  choice: ножи
  rationale: Широкое современное обозначение режущих орудий, не сужающее смысл до кинжалов.
- source_word: ወወልታ
  choice: щиты
  rationale: Прямой и понятный современный эквивалент защитного вооружения.
- source_word: ወድርዐ፡ አንግድዓ
  choice: нагрудники
  rationale: Речь идёт о доспехах, защищающих грудь или корпус; слово сохраняет конкретный образ и не навязывает вид плетёной брони.
- source_word: ወአርአዮሙ
  choice: он показал им
  rationale: Сохраняет значение раскрытия или сообщения прежде неизвестного знания без дополнительной моральной оценки.
- source_word: ዘእምድኅሬሆሙ
  choice: то, что было позади них
  rationale: Намеренно близкая к сохранившемуся трудному чтению передача; неясность не заменена контекстуальной догадкой о металлах.
- source_word: ወምግባሮሙ
  choice: и способы их изготовления
  rationale: По-русски естественно передаёт значение работы, изготовления или мастерства, сохраняя связь с перечисленными предметами.
- source_word: እውቃፋተ፡ ወስርጐ
  choice: браслеты, украшения
  rationale: Первое слово обозначает украшения для руки, второе — украшения в более общем смысле.
- source_word: ወተጽሕሎተ፡ ወአስንዮተ፡ ቀርንብ
  choice: подкрашивание глаз, украшение век
  rationale: Переданы конкретные косметические практики, а не отвлечённая «красота».
- source_word: ወእብነ፡ እምኵሉ፡ እብን
  choice: всякие драгоценные камни
  rationale: Естественная русская передача контекстуального упоминания ценных камней; множественное число соответствует обобщённому перечислению.
theological_decisions:
- issue: Следует ли прямо назвать сообщённые Азазелом ремёсла запретными или развращающими
  choice: Сохранить нейтральные глаголы «научил» и «показал», позволяя отрицательной оценке следовать из контекста повествования и самого перечня.
  alternative: Добавить пояснения «для войны», «во зло» или «запретным ремёслам».
  rationale: В самом стихе нет явного оценочного прилагательного; добавление моральной квалификации устранило бы присущую тексту сдержанность и богословское напряжение.
- issue: Как передать неясную фразу ዘእምድኅሬሆሙ
  choice: Сохранить её буквальную пространственно-временную неясность в основном тексте и объяснить проблему в сноске.
  alternative: Исправить по контексту на «металлы земли» или опустить фразу.
  rationale: Эфиопское чтение в данном источнике помечено как трудное; уверенная конъектура создала бы ложную определённость.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Перечень сделан ясным и ритмичным, без архаизмов; трудное место намеренно оставлено необычным, но грамматически понятным, и снабжено сноской.
