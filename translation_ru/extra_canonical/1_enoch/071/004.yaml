base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/004.yaml
  text: And he showed me all the hidden things of the ends of heaven[a], and all the storehouses of the stars and the lights[c][b], from where they all come forth before the face of the holy ones.
translation:
  language: ru
  text: И он показал мне всё сокрытое на краях неба и все хранилища звёзд и светил[a], откуда все они выходят перед лицом святых[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «звёзд и небесных огней». В оригинале звёзды отличаются от более широкой категории светящих небесных тел.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «перед лицом святых» означает «в присутствии святых». Сам текст не уточняет, кто именно здесь назван святыми.
    reason: lexical_alternative
lexical_decisions:
- source_word: አርአየኒ
  choice: он показал мне
  rationale: Каузативная форма глагола естественно передаётся как «показал» и сохраняет повествование о видении.
- source_word: ኵሎ ኅቡኣተ
  choice: всё сокрытое
  rationale: Субстантивированное выражение обозначает совокупность скрытых реальностей; «всё сокрытое» звучит по-русски естественно и не сужает смысл до тайного знания.
- source_word: አጽናፈ ሰማይ
  choice: на краях неба
  rationale: Сохраняется пространственно-космический образ пределов неба без излишне книжного слова «оконечности».
- source_word: መዛግብተ
  choice: хранилища
  rationale: Слово обозначает сокровищницы или места хранения; «хранилища» ясно передаёт енохический образ небесных вместилищ.
- source_word: ከዋክብት ወብርሃናት
  choice: звёзд и светил
  rationale: Различие между звёздами и более широкой категорией небесных источников света сохранено; «светила» в данном космическом контексте естественнее буквального «светы».
- source_word: ኵሎሙ
  choice: все они
  rationale: Явно передан местоименный элемент со значением полноты, относящийся к звёздам и светилам.
- source_word: እምኀበ ወፅኡ
  choice: откуда все они выходят
  rationale: Переданы как исходная точка движения, так и образ выхода небесных тел из хранилищ.
- source_word: ለገጸ ቅዱሳን
  choice: пред святыми
  rationale: Краткая формула сохраняет возвышенный семитский оттенок выражения «перед лицом святых», оставаясь понятной современному читателю.
theological_decisions:
- issue: Кого обозначают «святые»
  choice: святые
  alternative: ангелы; праведники; святые существа
  rationale: В данном небесном контексте вероятны святые небесные существа, однако сам текст не уточняет их тождество. Общее обозначение сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной апокалиптической образностью. Архаическое «пред» сохранено только в краткой устойчивой формуле; неоднозначность слова «святые» не разрешается толкованием.
