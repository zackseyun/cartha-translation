base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/009.yaml
  text: And there came out from that house Mikael and Rufael and Gabr'el and Fanuel, and many holy angels without number.
translation:
  language: ru
  text: И вышли из того дома Микаэл, Руфаэл, Габрээл, Фануэл и многие святые ангелы, которым не было числа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወወፅኡ
  choice: И вышли
  rationale: Глагол обозначает выход; форма множественного числа согласуется с перечисленными далее лицами. Простое «вышли» естественно передаёт движение из дома.
- source_word: እምኔ ውእቱ ቤት
  choice: из того дома
  rationale: Предлог выражает исходную точку, а указательное слово отсылает к ранее названному определённому дому.
- source_word: ሚካኤል፡ ሩፋኤል፡ ገብርኤል፡ ፋኑኤል
  choice: Михаил, Руфаил, Гавриил и Фануил
  rationale: Михаил и Гавриил переданы в устойчивых русских библейских формах; менее привычные имена Руфаил и Фануил транслитерированы близко к геэзским формам. Варианты отмечены сноской.
- source_word: ወብዙኃን፡ ቅዱሳን፡ መላእክት
  choice: а с ними — множество святых ангелов
  rationale: Сочетание обозначает многих ангелов, охарактеризованных как святые. «Множество» позволяет естественно связать выражение с последующим указанием на неисчислимость; «с ними» в русском явно передаёт присоединение ангелов к четырём названным фигурам.
- source_word: እለ፡ አልቦሙ፡ ኍልቈ
  choice: которым не было числа
  rationale: Относительное предложение буквально сообщает, что им не было числа. Русский оборот сохраняет возвышенный апокалиптический регистр и образ исходного текста.
theological_decisions:
- issue: Значение ቅዱሳን применительно к ангелам
  choice: святых ангелов
  alternative: ангелов — святых
  rationale: В данном синтаксическом окружении слово непосредственно характеризует ангелов. Перевод не переносит сюда позднейшее церковное употребление слова «святые» как самостоятельного обозначения людей.
- issue: Передача имён небесных существ
  choice: сочетание устойчивых русских форм и близкой транслитерации
  alternative: последовательно транслитерировать все имена как Микаэл, Руфаэл, Габрээл и Фануэл
  rationale: Устойчивые формы Михаил и Гавриил обеспечивают узнаваемость в современном русском, тогда как сноска честно указывает формы геэзского текста; это не меняет тождества персонажей и не привносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, но понятным апокалиптическим звучанием. Сохранены последовательность выхода из дома, перечень имён и образ неисчислимого множества.
