base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/002.yaml
  text: And I saw two rivers of fire[a], and the light of that fire shone like hyacinth[b], and I fell on my face before the Lord of Spirits.
translation:
  language: ru
  text: И я увидел две огненные реки, и свет того огня[a] сиял, словно гиацинт[b], и я пал ниц пред Господом духов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Фраза «свет того огня» в геэзском тексте выражена несколько сжато; возможна и более свободная передача: «его огненное сияние».'
    reason: alternative_reading
  - marker: b
    text: Под «гиацинтом», вероятно, подразумевается драгоценный камень; точное соответствие древнего названия современному минералу не вполне ясно.
    reason: lexical_alternative
lexical_decisions:
- source_word: ክልኤተ አፍላገ እሳት
  choice: две огненные реки
  rationale: Сохраняет числительное и яркий апокалиптический образ рек огня; по-русски определение «огненные» звучит естественнее, чем родительный оборот «реки огня».
- source_word: ብርሃነ ዝኩ እሳት
  choice: свет того огня
  rationale: Прямо передаёт существительное «свет», указательное значение ዝኩ и повтор слова «огонь», не устраняя сжатость исходной фразы.
- source_word: ከመ ያክንት
  choice: словно гиацинт
  rationale: Передаёт сравнение и сохраняет традиционное название драгоценного камня, не подменяя неопределённую древнюю минералогическую идентификацию общим выражением.
- source_word: ያበርህ
  choice: сиял
  rationale: Естественно передаёт действие света и поддерживает возвышенный зрительный образ.
- source_word: ወወደቁ በገጽየ
  choice: и я пал ниц
  rationale: Устойчивое и понятное русское выражение телесного преклонения, точно передающее падение лицом вниз.
- source_word: ቅድመ እግዚአ መንፈሳት
  choice: пред Господом духов
  rationale: Сохраняет формульный божественный титул и возвышенный регистр; «пред» уместно в устойчивом обороте «пал ниц пред».
theological_decisions:
- issue: Передача божественного титула እግዚአ መንፈሳት
  choice: Господом духов
  alternative: Господом этих духов
  rationale: Оборот передан как повторяющийся формульный титул в Притчах Еноха, без добавления отсутствующего в исходном тексте уточнения или конфессионального толкования.
- issue: Смысл сравнения с ያክንት
  choice: сиял, словно гиацинт
  alternative: сиял, словно драгоценный камень
  rationale: Традиционный минеральный термин оставлен в основном тексте, а неопределённость точной идентификации отмечена в сноске, чтобы не устранять подлинную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Архаическое «пред» сохранено только внутри естественного устойчивого оборота «пал ниц пред»; синтаксис остаётся ясным для современного читателя.
