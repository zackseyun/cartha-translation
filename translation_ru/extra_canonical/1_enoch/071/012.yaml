  text: And those blessings that went out from my mouth became acceptable before that Head of Days[a][b][c].
translation:
  language: ru
  text: И те благословения, что вышли из моих уст, стали угодны пред тем Главой Дней[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были благосклонно приняты пред тем Главой Дней». Геэзское слово допускает значение угодности или благосклонного принятия.'
    reason: lexical_alternative
  - marker: b
    text: «Глава Дней» — буквальная передача геэзского титула в этом месте. Он сохранён в отличие от более привычного выражения «Ветхий днями», чтобы не согласовывать формулировку молча с книгой Даниила.
    reason: cross_reference
lexical_decisions:
- source_word: በረከት
  choice: благословения
  rationale: Существительное означает благословение или благословляющее изречение; множественное число требуется согласованием с указательным и относительным местоимениями и глаголами во множественном числе в геэзском тексте.
- source_word: ወፅኣ እምነ አፉየ
  choice: вышли из моих уст
  rationale: Сохраняет конкретный и образный характер исходного выражения, не сводя его к нейтральному «я произнёс».
- source_word: ሥሙረተ
  choice: стали угодны
  rationale: Передаёт предикативное значение благосклонного принятия или угодности; возможный оттенок «были благосклонно приняты» отмечен в сноске.
- source_word: ቅድመ
  choice: пред
  rationale: Кратко и естественно передаёт положение перед лицом возвышенной небесной фигуры; форма «пред» поддерживает торжественный апокалиптический регистр.
- source_word: ዝኩ ርእሰ መዋዕል
  choice: тем Главой Дней
  rationale: Указательное «тем» отражает ዝኩ, а «Глава Дней» сохраняет особый енохический титул и не подменяет его знакомым по книге Даниила выражением.
theological_decisions:
- issue: Передача божественного титула ርእሰ መዋዕል
  choice: Глава Дней
  alternative: Ветхий днями
  rationale: Перевод следует непосредственно геэзской формулировке и сохраняет отличительную лексику этого места, не гармонизируя её молча с традиционным переводом Дан 7.
