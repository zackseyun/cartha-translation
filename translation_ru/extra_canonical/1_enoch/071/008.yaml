  terminology: «Ангелы», «святые ангелы» и «дом» удачны. Формы имён Микаэль, Руфаэль, Габриэль, Фануэль последовательно отражают заявленный принцип передачи геэзских форм; пояснительная сноска необходима и достаточна.
