base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/008.yaml
  text: And I saw angels beyond number[a], thousands of thousands and ten thousand times ten thousand, surrounding that house; and Mikael and Rufael and Gabrʾel and Fanʾuel[b], and the holy angels who are above the heavens, were going in and coming out of that house.
translation:
  language: ru
  text: И увидел я ангелов, которых невозможно было сосчитать, — тысячи тысяч и десять тысяч раз по десять тысяч, — окружавших тот дом; а Микаэль, Руфаэль, Габриэль и Фануэль[b] и святые ангелы, находившиеся выше небес, входили в тот дом и выходили из него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Имена переданы по геэзским формам: Микаэль, Руфаэль, Габриэль, Фануэль. Более привычные русские формы — Михаил, Рафаил, Гавриил и Фануил.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: И увидел я
  rationale: Сохраняет последовательный стиль рассказа о видении и при этом звучит естественно и возвышенно по-русски.
- source_word: መላእክተ
  choice: ангелов
  rationale: В контексте небесного дома речь явно идёт о небесных существах, поэтому «ангелы» точнее общего значения «вестники».
- source_word: እለ ኢይትኌለቍ
  choice: которых невозможно было сосчитать
  rationale: Передаёт буквальный смысл невозможности исчислить множество, не сводя выражение к одному оценочному прилагательному.
- source_word: አእላፈ አእላፍ
  choice: тысячи тысяч
  rationale: Сохраняет повтор и нарастающую силу апокалиптической числовой формулы.
- source_word: ወትእልፊተ ትእልፊት
  choice: десять тысяч раз по десять тысяч
  rationale: Прозрачно передаёт умноженную огромную величину и не заменяет геэзскую формулу привычной формулировкой из иной библейской традиции.
- source_word: የአውድዎ ለውእቱ ቤት
  choice: окружали тот дом
  rationale: Передаёт зрительный образ множества, расположенного вокруг названного дома.
- source_word: ቤት
  choice: дом
  rationale: Сохраняет прямое значение исходного слова и не уточняет образ как «дворец» или «храм».
- source_word: ሚካኤል ወሩፋኤል ወገብርኤል ወፋኑኤል
  choice: Микаэль, Руфаэль, Габриэль и Фануэль
  rationale: Имена переданы по их геэзским формам, а не без пояснения заменены привычными русскими церковными вариантами.
- source_word: መላእክተ ቅዱሳን
  choice: святые ангелы
  rationale: Естественная русская атрибутивная конструкция, точно сохраняющая характеристику этой группы.
- source_word: እለ መልዕልተ ሰማያት
  choice: пребывающие выше небес
  rationale: Сохраняет пространственный и возвышенный образ, не превращая его в разработанную схему уровней неба.
- source_word: ይበውኡ ወይወፅኡ
  choice: входили в тот дом и выходили из него
  rationale: Передаёт парное, продолжающееся движение внутрь и наружу естественными русскими глагольными формами.
theological_decisions:
- issue: Следует ли нормализовать формулу огромного числа по привычным библейским или богослужебным выражениям
  choice: тысячи тысяч и десять тысяч раз по десять тысяч
  alternative: тысячи тысяч и тьмы тем; мириады мириадов
  rationale: Выбранная передача остаётся близкой к геэзской числовой формуле и не привносит формулировку из Даниила, Откровения или поздней традиции.
- issue: Следует ли истолковать «дом» как дворец или храм
  choice: дом
  alternative: дворец; храм; обитель
  rationale: Хотя видение имеет характер небесного двора и дом может быть божественным жилищем, исходное слово само по себе не устраняет эту образную неопределённость.
- issue: К чему относится определение «пребывающие выше небес»
  choice: к святым ангелам
  alternative: 'к дому: «из дома, находящегося выше небес»'
  rationale: Порядок и относительная конструкция геэзского текста естественнее связывают определение со «святыми ангелами»; возможное пространственное прочтение не внесено в основной текст без достаточного основания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным ритмом повествования о видении. Инверсия «увидел я» поддерживает достоинство стиля без архаизации; числовая гипербола и повтор союзов сохранены там, где они несут смысловую и ритмическую нагрузку.
