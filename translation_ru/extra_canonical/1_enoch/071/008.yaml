  to: И увидел я ангелов, которых невозможно было сосчитать, — тысячи тысяч и десять тысяч раз по десять тысяч, — окружавших тот дом; а Микаэль, Руфаэль, Габриэль и Фануэль[b] и святые ангелы, находившиеся выше небес, входили в тот дом и выходили из него.
