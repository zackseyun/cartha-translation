base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/006.yaml
  text: And my spirit saw the enclosure that surrounded that house of fire[a], and from its four sides were rivers full of living fire[d][c][b], and they surrounded that house.
translation:
  language: ru
  text: И дух мой увидел ограждение[a], окружавшее тот дом огня, а с четырёх его сторон[b] — реки, полные живого огня[c]; и они окружали тот дом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально — «окружение» или «круг». Исходный текст не уточняет ни вид, ни материал этого окружающего образования; речь не обязательно идёт о стене.
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «стороны», может также означать края, пределы или части света; возможен перевод «с четырёх его краёв».
    reason: alternative_reading
  - marker: c
    text: «Живой огонь» — буквальный перевод необычного выражения. Оно может подразумевать огонь живой, деятельный или исполненный особой силы, а не обычное пламя.
    reason: lexical_alternative
lexical_decisions:
- source_word: መንፈስየ
  choice: дух мой
  rationale: В контексте видения መንፈስ обозначает дух провидца как воспринимающий субъект. Такой перевод сохраняет необычную грамматику и апокалиптический характер восприятия.
- source_word: አውዶ / ዘየአውዶ
  choice: ограду, окружавшую
  rationale: Повтор однокоренных форм передан сочетанием существительного и причастия. «Ограда» естественно обозначает замкнутое окружение, но не уточняется как стена; это оговорено в сноске.
- source_word: ቤተ እሳት
  choice: дом огня
  rationale: Сохранена именная конструкция оригинала и резкий апокалиптический образ; «огненный дом» звучал бы плавнее, но мог бы ослабить буквальную связь двух существительных.
- source_word: እምአርባዕቱ አጽናፊሁ
  choice: с четырёх его сторон
  rationale: አጽናፍ может означать края, пределы, стороны или части света. «Стороны» понятно в данном пространственном образе и не вносит более конкретных «углов».
- source_word: አፍላገ
  choice: реки
  rationale: Множественное число обозначает потоки значительного масштаба; «реки» соответствует величию видения лучше, чем уменьшительное или более нейтральное «потоки».
- source_word: ምሉኣነ እሳተ ሕያው
  choice: полные живого огня
  rationale: Необычное выражение сохранено буквально, без сведения его к обычному «пылающему» или «яркому» огню.
- source_word: የአውድዎ
  choice: они окружали
  rationale: Возобновляется мотив окружения, выраженный тем же корнем ранее. Местоимение «они» естественно относится к рекам.
theological_decisions:
- issue: Природа восприятия в видении
  choice: И дух мой увидел
  alternative: И я увидел в духе / И душа моя увидела
  rationale: В геэзском тексте именно дух назван подлежащим глагола «увидел». Сохранение этой конструкции не превращает видение в обычное зрительное восприятие и не отождествляет без необходимости «дух» с «душой».
- issue: Синтаксическая связь рек с глаголом «увидел»
  choice: а с четырёх его сторон — реки
  alternative: с четырёх его сторон были реки
  rationale: Форма «реки, полные» служит вторым дополнением при «увидел», а не самостоятельным предложением с подразумеваемым глаголом бытия. Эллиптическая конструкция с тире сохраняет эту связь и остаётся естественной по-русски.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным апокалиптическим звучанием. Сохранены повтор мотива окружения, буквальный образ «дома огня» и необычное выражение «живой огонь». Эллипсис после тире позволяет не вводить отсутствующий в оригинале глагол «были».
