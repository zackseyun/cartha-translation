- issue: Следует ли передавать ርእሰ መዋዕል традиционным титулом «Ветхий днями»
  choice: Глава дней
  alternative: Ветхий днями
  rationale: Основной текст следует локальной геэзской формулировке и сохраняет её отличие от привычного перевода Дан 7, не отрицая возможной связи с этим местом.
