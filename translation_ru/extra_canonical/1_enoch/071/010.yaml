  text: And with them was the Head of Days[a], and his head was like white and pure wool[c][b], and his garment cannot be described.
translation:
  language: ru
  text: И с ними был Глава дней[a]. Голова его была подобна белой и чистой шерсти, а одеяние его невозможно описать[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно традиционному библейскому соответствию, «Ветхий днями». Однако буквально в геэзском тексте: «Глава дней».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «невозможно объяснить» или «невозможно истолковать». Здесь, вероятно, имеется в виду одеяние, не поддающееся обычному описанию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ምስሌሆሙ
  choice: с ними
  rationale: 'Предлог ምስለ прежде всего выражает совместность: «с, вместе с». Это точнее исходного текста, чем «среди них».'
- source_word: ርእሰ መዋዕል
  choice: Глава дней
  rationale: Буквальный перевод сохраняет необычную форму титула в геэзском тексте и не подменяет её традиционным соответствием из Дан 7.
- source_word: ፀምር ጻዕዳ ወንጹሕ
  choice: белой и чистой шерсти
  rationale: Оборот с ከመ вводит сравнение; ፀምር здесь естественно понимать как «шерсть», а определения передают одновременно зрительную белизну и чистоту.
- source_word: ልብሱ
  choice: одеяние его
  rationale: «Одеяние» передаёт общее обозначение одежды, сохраняет возвышенный регистр и не конкретизирует её как мантию или ризу.
- source_word: ዘኢይትረጐም
  choice: невозможно описать
  rationale: Глагол допускает значения объяснения и истолкования; в контексте видения выражение естественно указывает на невыразимость облика одеяния.
