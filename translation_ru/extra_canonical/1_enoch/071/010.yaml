  register: Современный литературный русский язык с умеренно возвышенным, соответствующим видению регистром. Необычный титул «Глава дней» намеренно сохранён ради точности исходной формулировки; инверсия «Голова его», «одеяние его» поддерживает достоинство стиля без архаизации.
