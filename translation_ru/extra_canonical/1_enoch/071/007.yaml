base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/007.yaml
  text: And around it were the seraphim and the cherubim and the ophannim[b][a], and these are those who do not sleep and who keep watch over the throne of his glory.
translation:
  language: ru
  text: А вокруг него были серафимы, херувимы и офанимы[a]. Это те, кто не спят и охраняют престол Его славы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Офанимы» — переданное по звучанию название небесного чина; оно связано со словом «колёса».
    reason: lexical_alternative
lexical_decisions:
- source_word: ወአውዶ
  choice: А вокруг него были
  rationale: Сохраняет пространственное значение и передаёт местоименный суффикс 3-го лица единственного числа, отсылающий к объекту из предыдущего стиха.
- source_word: ሱራፌን
  choice: серафимы
  rationale: Традиционное русское название небесного чина сохраняет апокалиптический регистр.
- source_word: ኪሩቤን
  choice: херувимы
  rationale: Устоявшееся русское название небесного чина.
- source_word: አፋኒን
  choice: офанимы
  rationale: Транслитерация сохраняет параллельный перечень небесных чинов; связь названия с «колёсами» поясняется в сноске.
- source_word: እሙንቱ እለ ኢይነውሙ
  choice: Это те, кто не спит
  rationale: Передаёт подчёркнутое отождествление и прямое отрицание глагола «спать», не усиливая его до «никогда не спит».
- source_word: የዐቅቡ
  choice: стережёт
  rationale: Передаёт одновременно бдение и охрану; единственное число согласуется в современном русском с относительным местоимением «кто» при собирательном указании на группу.
- source_word: መንበረ ስብሐተ ዚአሁ
  choice: престол Его славы
  rationale: Сохраняет именную конструкцию источника и возвышенный характер видения.
theological_decisions:
- issue: Названия небесных существ в видении престола
  choice: Передать как «серафимы, херувимы и офанимы»
  alternative: Перевести አፋኒን буквально как «колёса» либо обобщить все названия как «небесные существа»
  rationale: В источнике дан параллельный перечень различимых небесных чинов. Транслитерация не сглаживает космологическую конкретность текста и сохраняет возможную связь офанимов с образами колёс через сноску.
- issue: Характер служения у престола
  choice: «не спит и стережёт»
  alternative: «никогда не спит и охраняет»
  rationale: Формулировка сохраняет напряжение между непрестанным бодрствованием и охранным служением, не добавляя отсутствующего в источнике усилителя «никогда».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Устоявшиеся названия «серафимы» и «херувимы» сохранены; редкое «офанимы» пояснено. Местоимение «Его» написано с прописной буквы как уважительное указание на Бога, без добавления имени или толкования.
