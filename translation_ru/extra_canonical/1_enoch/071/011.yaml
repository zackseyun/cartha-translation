base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/011.yaml
  text: And I fell on my face[a], and all my flesh melted away, and my spirit was transformed; and I cried out with a loud voice ... in the spirit of power[e][d][c][b], and I blessed and praised and exalted him.
translation:
  language: ru
  text: И я пал ниц, и вся плоть моя растаяла, и дух мой преобразился[b]. И я воззвал громким голосом…[a] в духе силы[c], и благословил, восхвалил и превознёс Его[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: После слов «громким голосом» текст данного свидетеля повреждён или имеет пропуск; многоточие передаёт эту неопределённость.
    reason: textual_variant
  - marker: b
    text: 'Возможно: «дух мой изменился». Геэзский глагол труден, и точный оттенок его значения неясен.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «силою духа» или «посредством духа силы». Фраза может обозначать как внутреннее состояние Еноха, так и силу, посредством которой он говорил.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально объект не выражен: «и благословил, восхвалил и превознёс». Местоимение «Его» добавлено по контексту для ясности русского текста.'
    reason: supplied_word
lexical_decisions:
- source_word: ወወደቁ፡ በገጽየ
  choice: И я пал ниц
  rationale: Естественная русская передача буквального образа падения на лицо; не уточняет, было ли это добровольным поклонением или невольным падением.
- source_word: ኵሉ፡ ሥጋየ፡ ተመስወ
  choice: вся плоть моя растаяла
  rationale: Сохраняет антропологически значимое «плоть» и яркий апокалиптический образ телесного таяния, не сглаживая его до нейтрального «тело ослабело».
- source_word: መንፈስየ፡ ተወለጠ
  choice: дух мой преобразился
  rationale: Передаёт глубокую внутреннюю перемену, при этом неопределённость трудного глагола отмечена в сноске.
- source_word: ጸራኅኩ፡ በቃል፡ ዓቢይ
  choice: я воззвал громким голосом
  rationale: «Воззвал» поддерживает возвышенный апокалиптический регистр, а «громким голосом» естественно передаёт идиому, обозначающую силу звучания.
- source_word: በመንፈሰ፡ ኃይል
  choice: в духе силы
  rationale: 'Формальная, но понятная передача сохраняет неясность: речь может идти о внутреннем состоянии Еноха либо о силе, посредством которой он говорил.'
- source_word: ወባረኩ፡ ወሰብሕኩ፡ ወአልዓልኩ
  choice: и благословил, восхвалил и превознёс Его
  rationale: Три параллельных глагола сохраняют литургическое нарастание; местоимение добавлено для естественного русского синтаксиса и отмечено сноской.
theological_decisions:
- issue: Антропологический смысл слова «плоть» при потрясении от видения
  choice: Сохранить выражение «вся плоть моя растаяла»
  alternative: «всё тело моё лишилось сил»
  rationale: Геэзский текст прямо говорит о плоти; буквальный образ сохраняет напряжённость телесной реакции на видение и не подменяет её толкованием.
- issue: Значение трудного глагола, описывающего дух Еноха
  choice: «дух мой преобразился» со сноской об альтернативе
  alternative: «дух мой изменился» или «дух мой покинул меня»
  rationale: Контекст указывает на внутреннюю перемену, но точный оттенок ненадёжен; основной текст остаётся выразительным, а сноска сохраняет филологическую неопределённость.
- issue: Смысл выражения «в духе силы»
  choice: Сохранить неоднозначную конструкцию
  alternative: «силою духа» или «могучим духом»
  rationale: Исходная фраза допускает понимание и как состояния говорящего, и как действующей силы; перевод не выбирает одну богословскую трактовку.
- issue: Неявный объект трёх заключительных глаголов
  choice: Добавить «Его» и отметить это в сноске
  alternative: Оставить глаголы без объекта
  rationale: В геэзском объект формально не выражен, однако по контексту подразумевается прославляемый небесный Владыка; в русском языке переходные глаголы без объекта звучали бы оборванно.
translation_notes:
  register: Современный литературный русский с возвышенным апокалиптическим звучанием. Архаизирующее «воззвал» и библейское «пал ниц» употреблены умеренно; синтаксис остаётся понятным обычному современному читателю. Многоточие сохраняет реальный разрыв источника, а сноски не устраняют его искусственным восстановлением.
