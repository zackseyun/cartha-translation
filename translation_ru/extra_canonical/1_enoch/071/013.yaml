base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/013.yaml
  text: And that Head of Days came with Michael and Raphael and Gabriel and Phanuel[c][b][a], and thousands and ten thousands of angels who have no number.
translation:
  language: ru
  text: И пришёл Тот, Глава дней[a], вместе с Михаилом, Рафаилом, Гавриилом и Фануилом[b], и с тысячами и десятками тысяч ангелов, которым нет числа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Глава дней». Этот титул нередко передают как «Ветхий днями», сближая его с формулировкой книги Даниила; здесь сохранён более буквальный образ эфиопского текста.'
    reason: lexical_alternative
  - marker: b
    text: В эфиопском тексте имена имеют формы, приблизительно передаваемые как Микаэль, Руфаэль, Габрэль и Фануэль; в основном тексте употреблены их устоявшиеся русские формы.
    reason: cultural_note
lexical_decisions:
- source_word: ርእሰ መዋዕል
  choice: Глава дней
  rationale: Буквальная передача составного эфиопского титула сохраняет его особый образ и не подменяет его привычным, но более интерпретирующим выражением «Ветхий днями» из русской традиции перевода Даниила.
- source_word: መጽአ
  choice: пришёл
  rationale: Простой глагол движения естественно передаёт последовательность событий видения без излишнего возвышения регистра.
- source_word: ምስለ
  choice: вместе с / с
  rationale: Предлог обозначает сопровождение; русская конструкция связывает как названных ангелов, так и неисчислимое ангельское множество.
- source_word: ሚካኤል ወሩፋኤል ወገብርኤል ወፋኑኤል
  choice: Михаил, Рафаил, Гавриил и Фануил
  rationale: Употреблены устоявшиеся русские формы ангельских имён, легко узнаваемые современным читателем; их соответствие формам данного эфиопского свидетеля пояснено в сноске.
- source_word: አእላፍ ወትእልፊተ
  choice: тысячи и десятки тысяч
  rationale: Сохранены оба конкретных числовых обозначения и характерная для апокалиптической речи нарастающая формула, без сглаживания в одно слово «мириады».
- source_word: መላእክት
  choice: ангелов
  rationale: В сцене небесного окружения контекстуально точным значением является «ангелы», а не общее «вестники».
- source_word: እለ አልቦሙ ኍልቈ
  choice: которым нет числа
  rationale: Естественный русский идиом сохраняет прямое утверждение исходного текста о неисчислимости ангелов.
theological_decisions:
- issue: Передача божественного титула ርእሰ መዋዕል
  choice: Глава дней
  alternative: Ветхий днями; Глава Дней
  rationale: Выбор следует местной эфиопской формулировке и сохраняет её отличие от традиционной русской формулы Дан 7, не отрицая возможной связи между образами. С прописной буквы дано только первое слово титула согласно обычной русской орфографии.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования. Необычный титул намеренно сохранён, а тяжеловесность перечня умеренно сглажена конструкцией «вместе с … и с …» без утраты повторяющейся числовой формулы.
