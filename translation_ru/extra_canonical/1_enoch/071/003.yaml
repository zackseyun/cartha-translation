base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/003.yaml
  text: And the angel Mika'el[a], one of the chief angels, took hold of my right hand and raised me up, and brought me out to all the hidden things; and he showed me all the hidden things of mercy[c][b], and he showed me all the hidden things of righteousness.
translation:
  language: ru
  text: И ангел Михаил, один из главных ангелов[a], взял меня за правую руку, поднял меня и вывел ко всем тайнам[b]. Он показал мне все тайны милосердия и все тайны праведности[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «один из глав ангелов»; возможен традиционный перевод «один из архангелов».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ко всему сокрытому». В оригинале здесь и далее повторяется слово, обозначающее скрытое или сокрытое.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «справедливости».'
    reason: lexical_alternative
lexical_decisions:
- source_word: መልአከ ሚካኤል
  choice: ангел Михаил
  rationale: መልአከ обозначает ангела или посланника; в данном видении ясно имеется в виду небесное существо. Имя передано в привычной русской форме «Михаил».
- source_word: ፩እምአርእስተ መላእክት
  choice: один из главных ангелов
  rationale: Буквально выражение указывает на одного из «глав ангелов». Перевод передаёт старшинство, не вводя более специальный термин «архангел».
- source_word: አኃዘኒ እዴየ ዘየማን
  choice: взял меня за правую руку
  rationale: Глагол выражает взятие или удержание, а ዘየማን уточняет правую сторону; русская формулировка естественно передаёт конкретное действие.
- source_word: አንሥአኒ
  choice: поднял меня
  rationale: Глагол означает поднять или вознести; нейтральное «поднял» сохраняет последовательность действий, не уточняя способ или направление подъёма.
- source_word: አውፅአኒ
  choice: вывел
  rationale: Каузативный глагол движения наружу естественно передаётся как «вывел».
- source_word: ኀበ ኵሉ ኅቡአት
  choice: ко всем тайнам
  rationale: ኅቡአት обозначает скрытое или сокрытое. «Тайны» звучит естественно в русском апокалиптическом повествовании; повтор этого слова далее сохраняет параллелизм оригинала.
- source_word: ኅቡአተ ምሕረት
  choice: все тайны милосердия
  rationale: Конструкция связывает сокрытое с милосердием. «Милосердие» прямо передаёт ምሕረት, а повтор слова «тайны» отражает повторение ኅቡአት в оригинале.
- source_word: ኅቡአተ ጽድቅ
  choice: все тайны праведности
  rationale: ጽድቅ охватывает значения праведности и справедливости. «Праведность» сохраняет нравственно-религиозный оттенок и параллель с милосердием; возможная альтернатива отмечена в сноске.
theological_decisions:
- issue: Передача положения Михаила среди ангелов
  choice: один из главных ангелов
  alternative: один из архангелов; один из глав ангелов
  rationale: Текст буквально говорит о принадлежности к «главам ангелов». Выбранная формулировка передаёт ранг, но не превращает его без достаточных оснований в позднейший специальный титул.
- issue: Передача ጽድቅ
  choice: праведность
  alternative: справедливость
  rationale: Оба значения входят в семантический диапазон слова. В сочетании с милосердием и в апокалиптическом контексте предпочтена «праведность», однако возможный смысл справедливости не исключён.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Короткая последовательность глаголов сохранена, но чрезмерное нанизывание союзов слегка сглажено. Повтор «все тайны» намеренно удерживает параллелизм исходного текста.
