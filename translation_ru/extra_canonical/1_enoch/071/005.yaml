base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/005.yaml
  text: And my spirit was covered in the heaven of heavens[a], and I saw there, in the midst of that light, something built of stones of hail[c][b], and in the midst of those stones were tongues of living fire.
translation:
  language: ru
  text: И дух мой был сокрыт в небе небес[a], и там, посреди того света, я увидел нечто возведённое[b] из камней града[c]; а среди этих камней были языки живого огня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «дух мой был укрыт в небе небес». Текст говорит именно о духе Еноха и не уточняет, было ли это телесным вознесением или видением.'
    reason: lexical_alternative
  - marker: b
    text: Соответствующая фраза в эфиопском тексте трудна; по-видимому, речь идёт о некоем сооружении, находившемся внутри сияния.
    reason: textual_variant
  - marker: c
    text: 'Буквально: «из камней града»; возможное понимание: «из градин» или «из ледяных камней». Необычный образ сохранён без упрощения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ከበቶ፡ መንፈስየ
  choice: дух мой был сокрыт
  rationale: Передаёт пассивную форму от корня со значением сокрытия и сохраняет особый енохический образ, не сводя его к обычному «был вознесён». В сноске отмечена возможная передача «был укрыт».
- source_word: ውስተ፡ ሰማየ፡ ሰማያት
  choice: в небе небес
  rationale: Сохраняет возвышенную семитскую конструкцию и согласуется с пониманием предшествующего глагола как «был сокрыт», не заменяя выражение толкованием «в высшем небе».
- source_word: ወርኢኩ፡ በህየ
  choice: и там … я увидел
  rationale: Прямая и естественная передача формулы рассказа о видении.
- source_word: ማእከለ፡ ዝኩ፡ ብርሃን
  choice: посреди того света
  rationale: Сохраняет указательное местоимение и пространственный образ нахождения внутри сияющего света.
- source_word: ከመ፡ ቦቱ፡ ዘይትነደቅ
  choice: нечто возведённое
  rationale: Осторожно передаёт трудный синтаксис как указание на построенный предмет или сооружение, не уточняя его вид.
- source_word: እምእብነ፡ አስሐትያ
  choice: из камней града
  rationale: Сохраняет конкретный и необычный апокалиптический образ. Более гладкое «из градин» возможно, но устраняет сочетание «камни града».
- source_word: ልሳናተ፡ እሳት፡ ሕያው
  choice: языки живого огня
  rationale: Буквально сохраняет образ языков пламени и одушевлённое качество «живого» небесного огня.
theological_decisions:
- issue: Характер перемещения Еноха
  choice: дух мой был сокрыт
  alternative: дух мой был вознесён / я был телесно вознесён
  rationale: В тексте прямо назван дух Еноха. Перевод не определяет, было ли переживание телесным восхождением или только внутренним видением, и сохраняет характерную лексику сокрытия.
- issue: Природа увиденного во свете
  choice: нечто возведённое
  alternative: строение / дворец
  rationale: Трудная фраза, вероятно, обозначает сооружение, однако перевод не вводит более конкретный архитектурный образ, чем позволяет источник.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной повествовательной интонацией. Синтаксис сохраняет последовательность видения; «небо небес», «камни града» и «языки живого огня» намеренно удерживают конкретность и необычность исходной апокалиптической образности.
