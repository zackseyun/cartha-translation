  source_fidelity: 'Основной смысл передан верно: дух возносится на небеса, наблюдатель видит «сынов святых ангелов», идущих по пламени огня; сохранены множественное «небеса» и необычное родственное обозначение. Однако вставленное в скобках «и плащи их» синтаксически не связано с русской фразой. Эфиопское скобочное ወዐጸፎሙ, по-видимому, означает «и/их плащи» и, хотя может быть глоссой, его лучше передать так, чтобы подразумеваемое сказуемое «были белы» было ясно, не выдавая текстологическую неопределённость за установленный факт.'
