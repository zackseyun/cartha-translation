base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/001.yaml
  text: 'And after this it happened: my spirit was taken up[a], and it ascended into the heavens; and I saw the sons of the holy angels walking upon a flame of fire, and their garments were white[d][c][b], and their faces shone like snow.'
translation:
  language: ru
  text: 'И после этого случилось так: мой дух был поднят на небеса; и я увидел сынов святых ангелов[a], ходивших по пламени огня. Одежды их были белы [как и их плащи][b], а лица их сияли, как снег[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Необычное выражение «сыны святых ангелов» можно понимать шире — как ангельских существ, связанных со святыми ангелами. Здесь сохранена буквальная формулировка геэзского текста.
    reason: lexical_alternative
  - marker: b
    text: Слова, переданные как «как и их плащи», соответствуют заключённому в скобки слову в издании исходного текста. Оно, вероятно, означает «и их плащи», но может быть поздней вставкой или глоссой; добавление «как и» лишь делает подразумеваемую связь с «были белы» ясной по-русски.
    reason: textual_variant
  - marker: c
    text: Сравнение со снегом выражает ослепительную белизну и сияние лиц.
    reason: cultural_note
lexical_decisions:
- source_word: እምድኅረዝ
  choice: после этого
