  terminology: «Сыны святых ангелов» следует сохранить буквально; не следует заменять его просто «ангелами». «Пламя огня», «небеса» и «одежды» соответствуют исходному образному и высокому регистру. «Плащи» для текстологически сомнительного слова приемлемы при ясной сноске.
