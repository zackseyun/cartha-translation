- source_word: ተዐርገ ውስተ ሰማያት
  choice: поднялся на небеса
  rationale: Передаёт восхождение и сохраняет множественное число слова «небеса».
- source_word: ለውሉዶሙ ለመላእክት ቅዱሳን
  choice: сынов святых ангелов
  rationale: Необычное родственное выражение сохранено буквально, без сведения его просто к «святым ангелам».
- source_word: ይከይዱ ዲበ ላህበ እሳት
  choice: ходивших по пламени огня
  rationale: Сохраняет конкретный образ движения по пламени и единственное число исходной конструкции.
- source_word: አልባሶሙ ጻዓዳ
  choice: одежды их были белы
  rationale: «Одежды» не добавляет более узкой детали вроде особого вида одеяния; краткая форма поддерживает возвышенный регистр.
- source_word: '[ወዐጸፎሙ]'
  choice: '[и плащи их]'
  rationale: 'Слово передано в квадратных скобках вслед за источником: вероятное значение — «их плащи», но форма текстуально неуверенна и синтаксически выглядит как вставка.'
- source_word: ብሩሃን ገጾሙ ከመ በረድ
  choice: лица их сияли, как снег
  rationale: Передаёт яркость и ослепительную белизну; «снег» здесь естественнее, чем «лёд» или «град».
theological_decisions:
- issue: Кто такие «сыны святых ангелов»
  choice: Сохранить буквальное родственное обозначение.
  alternative: «святые ангелы» или более общее «ангельские существа»
  rationale: Эфиопский текст содержит необычное выражение; его богословскую напряжённость не следует устранять гармонизацией.
