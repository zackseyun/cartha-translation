  source_fidelity: '«В то время» точно передаёт ውእተ፡ ጊዜ без не засвидетельствованного начального союза. «Я сказал» следует основному значению እቤ; сноска уместно отмечает, что вопросительный контекст допускает «я спросил». Обе причинные вопросительные конструкции сохранены: «за какой грех» и «по какой причине». «Были связаны» сохраняет конкретный пассивный образ ተአስሩ, а «брошены сюда» адекватно передаёт принятое в английском аудите, контекстуально обоснованное значение ተገደፉ, не скрывая альтернативы в сноске.'
  naturalness: Текст грамматически правилен и естественен для современного литературного русского с умеренно возвышенным повествовательным регистром. Сочетание «я сказал:» с прямым вопросом несколько более буквально, чем разговорное «я спросил», но в данном контексте оно допустимо и поддержано сноской.
  terminology: «Грех», «связаны» и «брошены» сохраняют образность и не вносят конфессионально обусловленных толкований. Указательное «сюда» естественно сочетается с глаголом направленного помещения. Сноски a и b корректно привязаны и передают существенные лексические альтернативы.
