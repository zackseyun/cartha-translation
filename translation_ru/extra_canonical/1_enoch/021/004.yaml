base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/004.yaml
  text: At that time I said[a], “For what sin have they been bound[c][b], and for what reason have they been cast here?”
translation:
  language: ru
  text: 'В то время я сказал[a]: «За какой грех они были связаны и по какой причине брошены сюда[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «я спросил»; следующий далее прямой вопрос позволяет понять глагол речи как вопрос.'
    reason: lexical_alternative
  - marker: b
    text: Глагол может также означать, что их «оставили» или «покинули» здесь; в контексте суда вероятнее образ бросания сюда.
    reason: lexical_alternative
lexical_decisions:
- source_word: ውእተ፡ ጊዜ
  choice: В то время
  rationale: Передаёт обычное эфиопское временное выражение и сохраняет возвышенный повествовательный регистр; союз «и» в источнике отсутствует.
- source_word: እቤ
  choice: я сказал
  rationale: Формально соответствует глаголу речи в источнике. Хотя последующий прямой вопрос допускает естественное русское «я спросил», основной текст сохраняет более буквальное значение.
- source_word: በእንተ፡ አይ፡ ኃጢአት
  choice: за какой грех
  rationale: Кратко и естественно передаёт вопрос о причине наказания, сохраняя прямое упоминание греха.
- source_word: ተአስሩ
  choice: были связаны
  rationale: Сохраняет конкретный образ связывания или заключения в узы, не заменяя его более общим «заточены».
- source_word: ወበእነተ፡ ምንት
  choice: и по какой причине
  rationale: Сохраняет повторную вопросительную конструкцию и риторический параллелизм исходного текста.
- source_word: ዝየ
  choice: сюда
  rationale: Естественно передаёт указание на место вместе с глаголом направленного перемещения.
- source_word: ተገደፉ
  choice: брошены сюда
  rationale: Передаёт возможный смысл низвержения или помещения в это место в контексте суда, не устраняя допустимый оттенок оставления.
theological_decisions:
- issue: Характер описанного наказания
  choice: Сохранены конкретные образы связывания и бросания в место заключения.
  alternative: «Заключены и оставлены здесь» либо более отвлечённое описание осуждения.
  rationale: Апокалиптическая сцена изображает наказание зримыми действиями; перевод не должен превращать их в отвлечённую богословскую формулу.
- issue: Причина связывания и причина помещения в это место
  choice: Обе вопросительные части сохранены раздельно и параллельно.
  alternative: Объединить их в один общий вопрос о наказании.
  rationale: Источник формулирует два вопроса, и их сохранение не позволяет заранее решить, идёт ли речь об одной и той же причине.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, но понятным апокалиптическим звучанием. Синтаксис сохраняет параллелизм двух вопросов. Неподтверждённый источником начальный союз не добавлен.
