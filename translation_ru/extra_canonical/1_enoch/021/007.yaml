- source_word: ወርኢኩ፡ ግብረ፡ ግሩመ
  choice: и увидел страшное деяние
  rationale: Слово ግብር сохраняется как конкретное «деяние», а не ослабляется до общего «нечто»; сочетание передаёт буквальный образ «деяния ужаса».
- source_word: እሳት፡ ዐቢይ፡ በህየ፡ ዘይነድድ፡ ወያንበለብል
  choice: там был великий огонь, горящий и пылающий
  rationale: «Великий» поддерживает возвышенный апокалиптический регистр, а парные определения сохраняют динамичный образ огня.
- source_word: ወመምተርተ፡ ቦቱ፡ መካኑ፡ እስከ፡ ቀላይ
  choice: место было рассечено до самой бездны
  rationale: Осторожно передаёт трудную конструкцию как расселину или разлом, уходящий на чрезвычайную глубину, не уточняя природу изображённого места.
- source_word: ፍጹም፡ አዕማደ፡ እሳት፡ ዐበይተ፡ ዘይወርዶሙ
  choice: наполнено великими нисходящими огненными столпами
  rationale: ፍጹም понято в значении полноты, а образ вертикально нисходящих столпов огня сохранён без рационализации.
- source_word: ወኢእምጣኖ፡ ወኢዕበዮ፡ አክሀልኩ፡ ነጽሮ
  choice: Ни меры его, ни величины я не мог различить
  rationale: Сохраняет два параллельных существительных и подчёркивает неспособность Еноха постичь размеры увиденного; местоименная соотнесённость намеренно не уточняется.
- source_word: ወስእነኩ፡ [ነጽሮ፡] ዐይኖ
  choice: и не мог смотреть на него
  rationale: Кратко передаёт зрительную неспособность перед ужасающим зрелищем и не воспроизводит неустойчивое повторение глагола в скобках.
theological_decisions:
- issue: Природа описанного места
  choice: Оставлено без наименования как страшное место видения с огнём, бездной и огненными столпами.
  alternative: Назвать его адом, преисподней или космической темницей.
  rationale: Сам стих не даёт месту такого прямого богословского наименования; конкретизация внесла бы в текст более позднее толкование.
- issue: Референт местоимений в словах о мере, величине и невозможности смотреть
  choice: Сохранено неоднозначное «его».
  alternative: Прямо отнести слова к огню, бездне, месту или огненным столпам.
  rationale: Структура исходного текста не требует однозначного выбора, поэтому перевод не устраняет подлинную образную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной апокалиптической лексикой. Слова «великий», «деяние», «бездна» и «столпы» придают тексту достоинство, не делая его архаичным; синтаксис остаётся понятным широкому читателю.
