base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/007.yaml
  text: 'And from there I went to another place[a], more terrible than this, and I saw a fearful work: a great fire was there, burning and blazing, and the place had a cleft reaching to the abyss, full of great pillars of fire descending; neither its measure nor its size was I able to see[c][b], and I was not able to look at it.'
translation:
  language: ru
  text: 'И оттуда я пошёл в другое место, ещё страшнее этого, и увидел ужасающее зрелище: там был великий огонь, горящий и пылающий; в этом месте была расселина[a], уходившая в бездну и наполненная великими нисходящими огненными столпами[c]. Ни меры его, ни величины я не мог различить[b] и не мог смотреть на него.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение на языке геэз трудно для истолкования. Возможный перевод: «место было рассечено и уходило в совершенную глубину». Здесь оно понято как расселина или пропасть, простирающаяся до чрезвычайной глубины.'
    reason: textual_variant
  - marker: b
    text: 'Или: «я не мог постичь его меру и размеры». Смысл в том, что Енох не способен охватить величину увиденного.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможная передача конструкции: «и великие огненные столпы нисходили». Основной текст следует пониманию слова ፍጹም в значении «наполнено».'
    reason: lexical_alternative
