  text: And I went on until I came to a place where nothing is made[a].
translation:
  language: ru
  text: И я шёл дальше, пока не пришёл к месту, где не было ничего созданного[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Фразу можно также понять как «к месту, где ничего не создаётся» или «к месту, где ничто не существовало». Краткая формулировка на геэзе подчёркивает полное отсутствие чего-либо созданного или оформленного.
    reason: lexical_alternative
lexical_decisions:
- source_word: አድኩ
  choice: я шёл дальше
  rationale: Передаёт продолжение движения в ходе видения естественным современным русским языком.
- source_word: እስከነ
  choice: пока не пришёл
  rationale: Выражает движение вплоть до достижения места назначения; прибытие сделано явным по-русски.
- source_word: ኀበ
  choice: к месту
  rationale: Обозначает направление к месту назначения; существительное «место» уместно восполняет подразумеваемую локативность.
- source_word: አልቦቱ
  choice: где ничего не было
  rationale: Сохраняет краткую отрицательно-бытийную конструкцию и подчёркивает полное отсутствие описываемого.
- source_word: ዘይትገበር
  choice: сотворено
  rationale: Передаёт пассивную форму глагола «делать, создавать». «Сотворено» здесь звучит естественнее, чем «сделано», но не уточняет, кем или каким образом оно было создано.
theological_decisions:
- issue: Характер места в видении Еноха
  choice: место, где ничего не было сотворено
  alternative: место, где ничто не существовало; место, где ничего не создаётся
  rationale: Формулировка сохраняет акцент на отсутствии сотворённого или оформленного, не превращая стих в однозначное утверждение об абсолютном небытии. Временная соотнесённость краткой геэзской конструкции остаётся отмеченной в сноске.
translation_notes:
  register: Современный литературный русский язык с простым, достойным повествовательным ритмом. Сохранены лаконичность и тревожная образность апокалиптического видения; неоднозначность времени и смысла отрицательной конструкции вынесена в сноску.
