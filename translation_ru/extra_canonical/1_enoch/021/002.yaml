  source_fidelity: 'Первое словосочетание ግብረ፡ ግሩመ обозначает увиденное страшное «дело/явление»; «творение» в русском языке излишне конкретизирует его как результат акта творения. Остальные элементы переданы точно: двойное отрицание, небеса вверху, утверждённая земля и неустроенность места сохранены. Добавленное «лишь» не требуется оригиналом.'
  naturalness: «Устрашающее творение» звучит несколько искусственно и терминологически нагруженно. «Страшное зрелище» естественно для русского описания видения и сохраняет повествовательный, возвышенный регистр.
  terminology: «Неустроенное» удачно передаёт отсутствие устроенности без спорного усиления до «хаотического» или «бесформенного». «Прочно утверждённая земля» приемлемо передаёт традиционный образ закреплённой земли. Для ግብር предпочтительно нейтральное «зрелище», а не «творение».
