    rationale: Оригинальное слово может означать дело, явление или видимое зрелище; оно не называет Творца и не требует утверждать происхождение увиденного как творения. Кроме того, исходная русская коллокация звучит не вполне естественно.
  - severity: low
    issue: «Но лишь место» добавляет ограничительное «лишь».
    rationale: Противопоставление «но место» достаточно передаёт оригинал; усиление «лишь» отсутствует и не нужно для смысла.
