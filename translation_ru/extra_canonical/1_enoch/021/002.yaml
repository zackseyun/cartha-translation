base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/002.yaml
  text: 'And there I saw a fearful work: I saw neither the heavens above nor the firmly founded earth, but a place unformed and terrible.'
translation:
  language: ru
  text: 'И там я увидел страшное зрелище: я не увидел ни небес вверху, ни прочно утверждённой земли, но место неустроенное и ужасное.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግብረ፡ ግሩመ
  choice: устрашающее творение
  rationale: Сохраняет предметное значение ግብር («дело, произведение, творение») и характеристику, вызывающую страх; «творение» естественнее по-русски в описании увиденного, чем буквальное «дело».
- source_word: ወአሰማየ፡ ላዕለ
  choice: ни небес вверху
  rationale: Отрицательная конструкция передана парным «ни… ни», а пространственное определение сохранено без уточнения природы небес.
- source_word: ወአምድረ፡ ሱርርተ
  choice: ни прочно утверждённой земли
  rationale: Передаёт образ земли как укоренённой или закреплённой; «утверждённой» звучит литературно и сохраняет древнюю космологическую образность.
- source_word: መካነ፡ ዘአኮ፡ ድልወ
  choice: место неустроенное
  rationale: Передаёт отсутствие устроенности или пригодности, не усиливая смысл до «хаотического», что могло бы привнести лишнюю космологическую интерпретацию.
- source_word: ግሩምም
  choice: ужасное
  rationale: Второе употребление корня страха передано сильным, но обычным русским словом; различение с «устрашающее» избегает тяжёлого повтора.
theological_decisions:
- issue: Статус увиденного как «дела» или «творения»
  choice: творение
  alternative: дело / явление
  rationale: «Творение» сохраняет значение результата действия, но не уточняет, кем или с какой целью оно создано; тем самым не вводится дополнительное учение о происхождении этого места.
- issue: Характер места
  choice: неустроенное
  alternative: хаотическое / бесформенное
  rationale: 'Выбор сохраняет неопределённость: текст описывает отсутствие должной устроенности, не отождествляя место с первозданным хаосом и не утверждая строго геометрическую бесформенность.'
translation_notes:
  register: Современный литературный русский язык с торжественным повествовательным ритмом. Синтаксический параллелизм оригинала сохранён; архаизмы и конфессионально нагруженные уточнения не используются.
