base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/003.yaml
  text: And there I saw seven stars of heaven[a], bound together in it, like great mountains[c][b], and burning with fire.
translation:
  language: ru
  text: И там я увидел семь небесных звёзд[a], связанных вместе в нём[b], словно огромные горы, и пылающих огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В енохической образности звёзды могут представлять небесных существ, находящихся под судом, но сам текст называет их «звёздами».
    reason: cross_reference
  - marker: b
    text: То есть в ранее описанном месте. Слово, переведённое как «вместе», имеет трудное чтение; возможный смысл — «совместно, в одной группе».
    reason: textual_variant
lexical_decisions:
- source_word: ርኢኩ
  choice: я увидел
  rationale: Передаёт обычную формулу рассказа о видении ясно и без излишней архаизации.
- source_word: ሰብዐተ ከዋክብተ ሰማይ
  choice: семь небесных звёзд
  rationale: Сохраняет прямой образ звёзд и не истолковывает их в основном тексте как ангелов.
- source_word: እሱራነ ... ኅቡረ
  choice: связанных вместе
  rationale: «Связанных» сохраняет широкий смысл состояния несвободы, не уточняя способ удержания; трудное ኅቡረ естественно понято как наречие «вместе», относящееся к «связанным».
- source_word: በላዕሌሁ
  choice: в нём
  rationale: С учётом контекста и древнегреческого соответствия передаёт нахождение звёзд внутри ранее описанного места, а не над ним; местоименная форма сохраняет отсылку оригинала.
- source_word: ከመ አድባር ዐበይት
  choice: словно огромные горы
  rationale: Сохраняет яркое апокалиптическое сравнение; «огромные» естественно выражает усиленное представление о величине.
- source_word: ወበእሳት እንዘ ይነዱ
  choice: и пылающих огнём
  rationale: Передаёт продолжающееся горение и сохраняет явное упоминание огня.
theological_decisions:
- issue: Следует ли прямо отождествить семь звёзд с ангельскими существами под судом
  choice: Оставить в основном тексте «семь небесных звёзд»
  alternative: «семь небесных ангелов» или «семь небесных существ»
  rationale: В енохической образности звёзды могут обозначать ангельских существ, особенно в сценах суда, однако данный текст прямо называет их звёздами. Символический смысл не следует превращать в явное отождествление.
- issue: Пространственный смысл በላዕሌሁ
  choice: «в нём»
  alternative: «над ним» или «на нём»
  rationale: Контекст места заключения и древнегреческое соответствие поддерживают внутреннее местонахождение. Вариант «над ним» создавал бы образ зависших сверху звёзд, которого данный контекст, вероятнее всего, не предполагает.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной повествовательной интонацией. Причастные обороты сохранены ради последовательности образов видения; чрезмерная церковнославянизация исключена.
