base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/006.yaml
  text: These are among the stars that transgressed the command of the Lord[a], and they are bound here until ten thousand years are completed[e][d][c][b], the number of the days of their sins.
translation:
  language: ru
  text: Это те из звёзд, которые преступили повеление Господа[a]; они связаны здесь, пока не исполнятся десять тысяч лет[b] — число дней их грехов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «происходящие от звёзд». Эфиопский предлог может выражать как принадлежность к группе, так и происхождение.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «десять тысяч лет» может обозначать огромный назначенный срок наказания; в основном тексте сохранено буквальное число.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «число дней их грехов». Эта формулировка сохраняет образ срока, исчисленного в связи с их прегрешениями.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እሉ ውእቶሙ
  choice: Это те
  rationale: Передаёт указательное местоимение со связкой и естественно вводит пояснение о показанных Еноху существах.
- source_word: እምነ ከዋክብት
  choice: из звёзд
  rationale: В сочетании «те из звёзд» естественно выражает партитивное отношение; при этом предлог እምነ допускает также оттенок происхождения, отмеченный в сноске.
- source_word: እለ ኃለፉ ትእዛዘ እግዚአብሔር
  choice: которые преступили повеление Господа
  rationale: Глагол буквально связан с переходом за установленную границу, а в нравственно-правовом контексте означает нарушение; «преступили» сохраняет этот образ и судебный тон.
- source_word: ወተአስሩ በዝየ
  choice: они связаны здесь
  rationale: Сохраняет пассивное состояние заключения и зримый образ уз, не заменяя его более толковательным «заточены».
- source_word: እስከ ሶበ ይትፌጸም
  choice: пока не исполнятся
  rationale: Передаёт предел заключения и значение завершения или исполнения назначенного срока.
- source_word: ትእልፊተ ዓም
  choice: десять тысяч лет
  rationale: Буквально и прозрачно передаёт указанную в эфиопском тексте огромную продолжительность без добавления определённости.
- source_word: ኈልቈ መዋዕለ ኃጢአቶሙ
  choice: число дней их грехов
  rationale: Сохраняет буквальный апокалиптический образ исчисленных дней, соотнесённых с их грехами, вместо обобщающего толкования о сроке наказания.
theological_decisions:
- issue: Кого обозначают «звёзды»
  choice: В основном тексте сохранён образ звёзд как нарушивших повеление и связанных существ.
  alternative: Прямо назвать их ангелами или Стражами.
  rationale: Контекст допускает понимание звёзд как небесных существ, но перевод не должен устранять образную неоднозначность видения.
- issue: Характер срока «десять тысяч лет»
  choice: Числовое обозначение срока сохранено буквально.
  alternative: Передать как неопределённо долгую эпоху.
  rationale: Эфиопский свидетель содержит конкретное большое число; возможная идиоматическая сила выражения поясняется в сноске, а не подменяет основной текст.
- issue: Связь заключительной фразы со сроком
  choice: Фраза «число дней их грехов» сохранена как приложение к названному сроку.
  alternative: 'Развернуть её как толкование: «срок, назначенный за их грехи».'
  rationale: Синтаксическая и богословская напряжённость оригинала не позволяет безусловно определить точный механизм соотношения грехов и срока наказания.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Слова «преступили», «повеление» и «связаны» сохраняют судебно-образный строй оригинала, не превращая его в архаизованный церковный стиль.
