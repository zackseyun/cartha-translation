base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/005.yaml
  text: And Uriel[a], one of the holy angels who was with me and was guiding me, said to me, “Enoch, about whom are you asking[b], and about whom are you inquiring and searching?”
translation:
  language: ru
  text: 'И сказал мне Уриил, один из святых ангелов, который был со мной и вёл меня: «Енох, о ком ты спрашиваешь, о ком допытываешься и так стремишься узнать?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Значение последнего глагола не вполне ясно: возможны оттенки настойчивого стремления узнать, усердия или тревоги.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኡርኤል
  choice: Уриил
  rationale: Традиционная русская библейская форма имени, соответствующая геэзскому ኡርኤል.
- source_word: ፩እምቅዱሳን መላእክት
  choice: один из святых ангелов
  rationale: Точно передаёт принадлежность Уриила к числу святых ангелов и сохраняет значимый для апокалиптического текста термин «святые».
- source_word: ዘምስሌየ
  choice: который был со мной
  rationale: Естественно передаёт относительное выражение, обозначающее присутствие Уриила рядом с Енохом.
- source_word: ዘይመርሐኒ
  choice: вёл меня
  rationale: Передаёт действие небесного проводника; несовершенный вид сохраняет длительность действия в описываемой сцене.
- source_word: በእንተ መኑ ትስእል
  choice: о ком ты спрашиваешь
  rationale: Прямой и естественный перевод тематической конструкции с первым глаголом вопрошания.
- source_word: ወበእንተ መኑ ትጠይቅ
  choice: о ком допытываешься
  rationale: Сохраняет параллелизм и усиление второго близкого по смыслу глагола, не сводя оба глагола к одному русскому слову.
- source_word: ወትጽህቅ
  choice: и разыскиваешь
  rationale: Следует представленной редакционной трактовке «searching», однако значение формы не вполне определённо и может включать оттенок усердного, настойчивого стремления узнать.
theological_decisions:
- issue: Обозначение небесной категории ቅዱሳን መላእክት
  choice: святые ангелы
  alternative: священные ангелы
  rationale: «Святые ангелы» сохраняет традиционный богословский вес определения и естественно звучит по-русски, не внося конфессионально специфического толкования.
- issue: Смысл заключительного глагола ወትጽህቅ
  choice: и разыскиваешь
  alternative: и так стремишься узнать / и тревожишься
  rationale: Основной текст сохраняет принятую в последней редакции идею поиска, а примечание открыто отмечает лексическую неоднозначность и не закрепляет за фразой исключительно эмоциональное или интеллектуальное значение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «о ком» сохранён ради риторического параллелизма оригинала; «допытываешься» здесь означает настойчиво стараешься узнать, без обязательно отрицательного оттенка.
