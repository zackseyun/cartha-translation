  yaml_path: translation/extra_canonical/1_enoch/021/009.yaml
  text: And at that time Uriel—one of the holy angels[a], who was with me—answered me and said to me, “Enoch,”
translation:
  language: ru
  text: 'В то время Уриил, один из святых ангелов, находившийся со мной, ответил мне и сказал мне: «Енох»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Стих заканчивается прямым обращением Уриила: «Енох»; начатая им речь продолжается в следующем стихе.'
