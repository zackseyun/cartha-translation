lexical_decisions:
- source_word: ውእተ፡ ጊዜ
  choice: в то время
  rationale: Сохраняет обычную повествовательную временную формулу и возвышенный апокалиптический регистр.
- source_word: አውሥአኒ
  choice: ответил мне
  rationale: Передаёт прямое значение глагола ответа и не сглаживает повтор с последующим глаголом речи.
- source_word: ኡርኤል
  choice: Уриил
  rationale: Использована укоренившаяся в русской библейской традиции форма имени.
- source_word: ፩እምቅዱሳን፡ መላእክት
  choice: один из святых ангелов
  rationale: Естественно передаёт принадлежность Уриила к названной группе небесных существ, не добавляя позднейших догматических уточнений.
- source_word: እንዘ፡ ምስሌየ፡ ሀሎ
  choice: находившийся со мной
  rationale: Плавно передаёт описательную конструкцию, относящуюся к Уриилу.
- source_word: ወይቤለኒ
  choice: и сказал
  rationale: Сохраняет характерную для древнего повествования последовательность «ответил… и сказал», при этом русское дополнение «мне» не повторяется без необходимости.
- source_word: ሄኖክ
  choice: Енох
  rationale: Традиционная русская форма имени; звательная функция выражена прямой речью и пунктуацией.
theological_decisions:
- issue: Передача ቅዱሳን፡ መላእክት
  choice: святые ангелы
  alternative: ангелы святости
  rationale: Форма «святые ангелы» непосредственно и естественно обозначает данную категорию небесных существ, не привнося дополнительного богословского толкования.
- issue: Незавершённое обращение в конце стиха
  choice: показать продолжение речи многоточием и пояснить в сноске
  alternative: завершить фразу точкой либо присоединить следующий стих
  rationale: Источник заканчивает стих обращением «Енох», а сама речь продолжается далее; перевод сохраняет эту межстиховую незавершённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным звучанием. Сохранена семитская формула «ответил… и сказал», но устранён необязательный повтор «мне» после второго глагола.
