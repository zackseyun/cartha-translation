    reason: alternative_reading
lexical_decisions:
- source_word: አንስትያሆሙኒ
  choice: И жёны
  rationale: Форма обозначает женщин или жён и содержит присоединительное «и/также». В данном контексте связь с ангелами естественно передаётся словом «жёны», а более широкое значение отмечено в сноске.
- source_word: ለስሑታን፡ መላእክት
  choice: заблудших ангелов
  rationale: 'Сочетание понимается как единая зависимая группа: женщины принадлежат ангелам, которые сбились с пути. Такая передача не превращает «ангелов» в объект последующего сравнения.'
- source_word: ስሑታን
  choice: заблудших
  rationale: Слово выражает идею уклонения или ухода с верного пути. «Заблудших» сохраняет этот образ и не усиливает его до более общего «грешных» или доктринально нагруженного «падших».
- source_word: መላእክት
  choice: ангелов
  rationale: В апокалиптическом контексте речь идёт о небесных существах, поэтому «ангелы» точнее общего «вестники».
- source_word: ተከመ
  choice: подобны
  rationale: Сравнительный оборот указывает на сходство, а не на тождество или превращение в ангелов.
- source_word: ሰላማዊያት
  choice: мирным
  rationale: Прилагательное во множественном числе образовано от слова «мир». Субстантивированное «мирным» сохраняет грамматическую и смысловую недосказанность исходного выражения.
- source_word: ይከውና
  choice: станут
  rationale: Глагол передаёт становление или переход в новое состояние; будущее «станут» естественно выражает это по-русски.
theological_decisions:
- issue: Характер будущего изменения жён ангелов
  choice: Они станут подобны «мирным»; утверждается сходство, а не изменение их сущности в ангельскую.
  alternative: Они сами станут ангелами либо войдут в мирное состояние вместе с ангелами.
  rationale: Сравнительный элемент ተከመ требует сохранить различие между уподоблением и тождеством. При этом неясность того, кого или какое состояние обозначает «мирным», не устраняется.
- issue: Синтаксическая роль слова «ангелы»
  choice: «Заблудшие ангелы» — зависимая группа при слове «жёны».
  alternative: '«Ангелы» — объект сравнения: жёны станут подобны ангелам.'
  rationale: Последовательность ለስሑታን፡ መላእክት образует конструкцию «заблудших ангелов» и определяет принадлежность женщин; сравнительный оборот начинается далее.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным звучанием. Необычное субстантивированное «мирным» сохранено намеренно, чтобы не устранять неясность геэзского текста; она пояснена в сноске.
