  text: And their wives[a], the angels who went astray[c][b], will become like peaceful ones.
translation:
  language: ru
  text: И жёны заблудших ангелов[a] станут подобны мирным существам[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «женщины заблудших ангелов»; соответствующее геэзское слово может означать как женщин вообще, так и жён.'
