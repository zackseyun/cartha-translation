base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/019/001.yaml
  text: And Uriel said to me[a], “Here shall stand the angels who joined themselves with women; and their spirits, having taken on many forms, defile humankind and lead them astray so that they sacrifice to demons as to gods, until the day of the great judgment[d][c][b], on which they will be judged until they are finished.”
translation:
  language: ru
  text: 'И сказал мне Уриил: «Здесь будут стоять ангелы, соединившиеся с женщинами. Их духи[b], приняв множество обликов[a], осквернили людей и вводят их в заблуждение[d], чтобы те приносили жертвы бесам как богам, — до дня великого суда, когда они будут судимы, пока суд над ними не завершится[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «став множеством явлений». Геэзская фраза трудна и, вероятно, указывает на разнообразные проявления этих духов.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «их духи» передано буквально. Неясно, имеются ли в виду духи самих ангелов, духи, происшедшие от них, или духи, связанные с их потомством.
    reason: alternative_reading
  - marker: c
    text: Буквально заключительные слова можно понять как «пока они не будут доведены до конца». Они подчёркивают полноту завершения суда, но точный оттенок остаётся неясным.
    reason: lexical_alternative
  - marker: d
    text: В исходном тексте «осквернили» стоит в форме завершённого действия, а «вводят в заблуждение» — в форме незавершённого действия.
    reason: grammar
lexical_decisions:
- source_word: ተደሚሮሙ
  choice: соединившиеся
  rationale: Передаёт значение соединения или вступления в связь и сохраняет возвратный оттенок, не добавляя отсутствующей в самой фразе конкретизации.
- source_word: ይቀውሙ
  choice: будут стоять
  rationale: Сохраняет пространственный и торжественно-визионерский характер глагола; нейтральное «будут находиться» было бы менее выразительным.
- source_word: መናፍስቲሆሙ
  choice: их духи
  rationale: Буквально передаёт существительное с притяжательным суффиксом и не решает спорный вопрос о том, кому именно принадлежат или от кого происходят эти духи.
- source_word: ብዙኃ ራእየ ከዊኖሙ
  choice: приняв множество обликов
  rationale: Трудная фраза связывает становление с множественностью видимого облика или явления. Перевод передаёт разнообразие проявлений, не сужая его до видений.
- source_word: አርኰስዎሙ
  choice: осквернили
  rationale: Глагол выражает загрязнение или осквернение и имеет форму перфекта; прошедшее время сохраняет отличие от следующего имперфекта.
- source_word: ለሰብእ
  choice: людей
  rationale: Естественно передаёт собирательное обозначение человеческого рода без ограничения только мужчинами.
- source_word: ያስሕትዎሙ
  choice: продолжают вводить их в заблуждение
  rationale: Передаёт каузативное значение и незавершённое, продолжающееся действие имперфекта; «продолжают» проясняет временной контраст с предшествующим перфектом.
- source_word: ይሡዑ
  choice: чтобы те приносили жертвы
  rationale: Сохраняет значение жертвоприношения и зависимость формы конъюнктива от действия введения в заблуждение.
- source_word: አጋንንት
  choice: бесам
  rationale: Устоявшийся русский эквивалент названия демонических существ, уместный в контексте ложного культа.
- source_word: ከመ አማልክት
  choice: как богам
  rationale: Показывает, что бесам воздают жертвенные почести, подобающие богам, не утверждая, что они действительно являются богами.
- source_word: ዕለተ ዐባይ ኵነኔ
  choice: дня великого суда
  rationale: Сохраняет порядок и торжественную апокалиптическую формулу исходного текста.
- source_word: ይትኴነኑ
  choice: будут судимы
  rationale: Сохраняет пассивный судебный смысл, не заменяя суд заранее вынесенным осуждением.
- source_word: እስከ ይትፈጸሙ
  choice: пока суд над ними не завершится
  rationale: Естественная русская передача трудной заключительной формулы о доведении процесса до конца; добавление «суд над ними» делает связь ясной, не определяя природу окончательной участи.
theological_decisions:
- issue: Кого обозначают слова «их духи»
  choice: Сохранено буквальное «их духи».
  alternative: «духи, происшедшие от них» или «духи их потомков»
  rationale: Исходный текст не определяет прямо, идёт ли речь о духах самих падших ангелов, о духах их потомства или о связанных с ними духовных проявлениях.
- issue: Смысл заключительной формулы о завершении
  choice: «пока суд над ними не завершится»
  alternative: «пока им не придёт конец» или «пока с ними не будет покончено»
  rationale: Формулировка сохраняет идею полного завершения суда, но не делает догматического вывода о способе и длительности окончательного наказания.
- issue: Статус бесов в сравнении с богами
  choice: «приносили жертвы бесам как богам»
  alternative: «поклонялись бесам-богам»
  rationale: Сравнение относится к оказываемым культовым почестям и не отождествляет бесов с подлинными богами.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным апокалиптическим звучанием. Синтаксис сделан ясным для обычного читателя, при этом сохранены временной контраст глаголов, буквальное «их духи» и неопределённость заключительной формулы.
