base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/019/003.yaml
  text: And I[a], Enoch, alone saw the vision, the ends of all things[b]; and no human being will see as I have seen.
translation:
  language: ru
  text: И я, Енох[a], один увидел видение — пределы всего[b]; и никто из людей не увидит так, как увидел я.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, ближе к геэзскому произношению: «Хенок».'
    reason: transliteration_alternative
  - marker: b
    text: 'Или: «крайние границы всего». Геэзское выражение может обозначать дальние пределы или концы и иметь как пространственный, так и космический смысл.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አርአያ
  choice: видение
  rationale: В апокалиптическом контексте слово обозначает не просто увиденное зрелище, а открывающее сокрытое созерцание; «видение» сохраняет пророческий оттенок.
- source_word: ባሕቲትየ
  choice: один
  rationale: Передаёт исключительность Еноха как свидетеля откровения и естественно сочетается с русским порядком слов.
- source_word: አጽናፈ ኵሉ
  choice: пределы всего
  rationale: «Пределы» сохраняют образ крайних границ или концов, а «всего» — широкий космический охват, не сводя выражение ни только к пространству, ни только к завершению истории.
- source_word: አልቦ ዘይሬኢ እምሰብእ
  choice: никто из людей не увидит
  rationale: Формулировка передаёт отрицание сопоставимого человеческого опыта; «из людей» сохраняет явное указание источника на человечество.
- source_word: ከመ አነ ርኢኩ
  choice: так, как увидел я
  rationale: Сохраняет сравнительную конструкцию и смысл личного, уже состоявшегося свидетельства Еноха, не уточняя сверх текста, что именно не увидят другие.
- source_word: ሄኖክ
  choice: Енох
  rationale: Общепринятая русская библейская форма имени; более буквальная передача геэзского произношения отмечена в сноске.
theological_decisions:
- issue: Объём уникального откровения Еноха
  choice: Енох утверждает, что ему одному было дано видение, охватывающее «пределы всего».
  alternative: Енох видел либо исключительно физические края мира, либо окончательное завершение всего сущего.
  rationale: Геэзское выражение допускает пространственную и более широкую космическую силу. Перевод сохраняет эту апокалиптическую многозначность и не ограничивает образ одной трактовкой.
- issue: Абсолютность утверждения о других людях
  choice: Сохранено прямое утверждение, что никто из людей не увидит подобным образом.
  alternative: Понимать слова лишь как указание, что до Еноха никто такого не видел.
  rationale: Форма источника и консультационный перевод поддерживают перспективу «не увидит»; смягчать её до прошлого времени без текстового основания не следует.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Повтор глагола «увидел» сохранён ради близости к источнику и композиционного акцента. Тире представляет «пределы всего» как пояснение к видению, не устраняя возможной смысловой неоднозначности.
