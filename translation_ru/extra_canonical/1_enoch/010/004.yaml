base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/004.yaml
  text: And again the Lord said to Raphael[a], “Bind Azazel by his hands and his feet, and cast him into the darkness; and open the desert that is in Dudael[b], and cast him there.”
translation:
  language: ru
  text: 'И снова Господь сказал Рафаилу: «Свяжи Азазела по рукам и ногам и брось его во тьму; рассеки пустыню[b], что в Дудаэле[a], и брось его туда».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Дудаэл — переданное транслитерацией название места; в этом стихе так обозначена определённая пустынная местность, связанная с заключением Азазела.
    reason: cultural_note
  - marker: b
    text: Выражение «рассеки пустыню» текстуально трудно. Его также понимают как повеление открыть или приготовить в пустыне место наподобие ямы; перевод сохраняет конкретный образ данного эфиопского свидетеля, не добавляя отсутствующей в нём детали.
    reason: textual_variant
lexical_decisions:
- source_word: ካዕበ
  choice: снова
  rationale: Передаёт возобновление речи в повествовательной последовательности, не сглаживая повтор.
- source_word: እግዚእ
  choice: Господь
  rationale: Сохраняет употреблённый в формуле речи божественный титул и достойный литературный регистр.
- source_word: እሰሮ
  choice: свяжи
  rationale: Прямо передаёт повеление физически связать Азазела, не заменяя конкретный образ общим понятием заключения.
- source_word: በእዴሁ ወእግሩ
  choice: по рукам и ногам
  rationale: Естественное русское выражение, сохраняющее явное упоминание обеих частей тела и телесную конкретность наказания.
- source_word: ወድዮ
  choice: брось его
  rationale: Передаёт принудительное перемещение и позволяет сохранить намеренный повтор одного и того же повеления.
- source_word: ውስተ ጽልመት
  choice: во тьму
  rationale: Кратко и конкретно сохраняет образ карательной тьмы, не истолковывая её исключительно символически.
- source_word: አብቅዋ ለገዳም
  choice: рассеки пустыню
  rationale: Сохраняет трудный и резкий образ рассечения или разверзания пустыни, не добавляя прямо не названную в данном свидетеле яму.
- source_word: እንተ ሀለወት በዱዳኤል
  choice: что в Дудаэле
  rationale: Передаёт относительное придаточное, указывающее местонахождение пустыни; имя места транслитерировано.
- source_word: ህየ
  choice: туда
  rationale: Естественно отсылает к названному и раскрытому месту заключения.
theological_decisions:
- issue: Характер наказания Азазела
  choice: Конкретное связывание и насильственное низвержение во тьму в пустынной местности
  alternative: Обобщённое заключение или исключительно символическое предание духовной тьме
  rationale: Текст последовательно использует телесные и пространственные образы — руки, ноги, тьму, пустыню и повторное бросание; перевод сохраняет эту апокалиптическую конкретность.
- issue: Что именно должно быть открыто или рассечено в Дудаэле
  choice: Сохранить прямой, хотя и трудный образ рассечения пустыни
  alternative: Истолковать повеление как приказ выкопать или приготовить яму в пустыне
  rationale: Свидетель прямо называет пустыню, тогда как «яма» представляет собой возможное контекстуальное истолкование; неоднозначность не следует устранять в основном тексте.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Синтаксис остаётся ясным, повторы повеления сохранены, а необычность выражения «рассеки пустыню» намеренно не сглажена и пояснена в сноске.
