  text: And on the great day of judgment he shall be sent away into the fire[a][b].
translation:
  language: ru
  text: И в великий день суда он будет послан в огонь[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В геэзском тексте сказуемое стоит в единственном числе: «он будет послан»; речь идёт о лице, к которому обращены слова в ближайшем контексте.'
    reason: cross_reference
  - marker: b
    text: «Великий день суда» — устойчивая здесь апокалиптическая формула; в более узком юридическом смысле слово «суд» можно также понять как «приговор».
    reason: lexical_alternative
lexical_decisions:
- source_word: በዕለት
  choice: в день
  rationale: Предлог с существительным «день» обозначает время действия; по-русски естественно «в день».
- source_word: ዓባይ
  choice: великий
  rationale: Сохраняет возвышенную апокалиптическую формулу и силу определения без излишнего уточнения.
- source_word: ኵነኔ
  choice: суд
  rationale: В данном контексте слово обозначает широкое судебное событие, включая вынесение приговора, а не только осуждение.
- source_word: ይትፈኖ
  choice: он будет послан
  rationale: Передаёт страдательное значение формы и единственное число субъекта, не добавляя более конкретного образа бросания.
- source_word: ውስተ
  choice: в
  rationale: При глаголе движения русское «в» естественно передаёт направление внутрь.
- source_word: ዋዕይ
  choice: огонь
  rationale: Сохраняет конкретный апокалиптический образ огня, не заменяя его отвлечённым понятием наказания.
theological_decisions:
- issue: Передать ли место назначения отвлечённо как наказание или сохранить конкретный апокалиптический образ
  choice: в огонь
  alternative: на наказание; в пламя
  rationale: В геэзском тексте стоит конкретное существительное «огонь»; перевод не должен сглаживать образ до общего понятия наказания.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным апокалиптическим звучанием. Сохранены конкретный образ огня, единственное число субъекта и смысловая широта слова «суд».
