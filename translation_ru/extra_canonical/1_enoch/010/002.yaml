base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/002.yaml
  text: Go to Noah and say to him in my name[a], 'Hide yourself!' And reveal to him the end that is coming; for the whole earth will be destroyed, and a flood is about to come upon all the earth[c][b], and it will destroy whatever is in it.
translation:
  language: ru
  text: 'Ступай к Ною и скажи ему от Моего имени[a]: «Скройся!» И открой ему грядущий конец[b], ибо вся земля будет уничтожена: воды потопа[c] вот-вот обрушатся на всю землю и уничтожат всё, что на ней.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Моим именем» или «от Моего лица». Выражение указывает, что весть передаётся с властью Пославшего.'
    reason: lexical_alternative
  - marker: b
    text: То есть близящийся гибельный конец, связанный здесь с потопом; слово может также означать «завершение».
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «воды потопа». Такое выражение подчёркивает водную стихию бедствия.'
    reason: source_clarification
lexical_decisions:
- source_word: ሖር፡ ለኖኅ፡ ወበሎ
  choice: Ступай к Ною и скажи ему
  rationale: Передаёт начальное повеление идти к Ною и следующее повеление обратиться к нему; не опускает ሖር «ступай».
- source_word: በስመ፡ ዚአየ
  choice: от Моего имени
  rationale: Естественная современная русская формула речи с порученной властью; не сводит выражение лишь к значению «от моего лица».
- source_word: ኅባእ፡ ርእሰከ
  choice: Скройся!
  rationale: Краткое возвратное повеление передаёт требование укрыться или спрятаться и сохраняет его срочность.
- source_word: ወአግህድ፡ ሎቱ
  choice: И открой ему
  rationale: Повеление обращено к посланнику, а местоимение «ему» относится к Ною. Закрывающая кавычка после «Скройся!» предотвращает ошибочное понимание, будто открыть конец велено Ною.
- source_word: ፍጻሜ፡ ዘይመጽእ
  choice: грядущий конец
  rationale: Сохраняет значение конца или завершения и его приближение, не превращая выражение в позднейший технический эсхатологический термин.
- source_word: ይትኃጐል፡ ምድር፡ ኵሉ
  choice: вся земля будет уничтожена
  rationale: Передаёт всеобщий охват и страдательное значение разрушения прямо и без смягчения.
- source_word: ማየ፡ አይኅ
  choice: воды потопа
  rationale: Сохраняет явное упоминание вод и при этом звучит естественнее по-русски, чем буквальное «потоп вод».
- source_word: ሀሎ፡ ዲበ፡ ኵሉ፡ ምድር
  choice: вот-вот обрушатся на всю землю
  rationale: Передаёт близость события и направленность бедствия на всю землю; «обрушатся» естественно сочетается с водами потопа.
- source_word: ወያኀጕል፡ ዘሀሎ፡ ውስቴታ
  choice: и уничтожат всё, что на ней
  rationale: Сохраняет всеохватность объекта, не добавляя отсутствующих в тексте категорий живых существ или имущества.
theological_decisions:
- issue: Значение «грядущего конца»
  choice: Близящееся уничтожение, связанное с потопом
  alternative: Окончательное эсхатологическое завершение мировой истории
  rationale: Непосредственный контекст определяет этот конец как грядущее бедствие потопа. Перевод сохраняет апокалиптическую весомость выражения, но не навязывает ему более позднее узкотехническое значение.
- issue: Кому велено открыть конец
  choice: Посланнику велено открыть его Ною
  alternative: Ною велено открыть конец неуказанному лицу
  rationale: Форма «открой» продолжает поручение посланнику, тогда как «ему» естественно относится к Ною. Разделение прямой речи сохраняет эту синтаксическую связь.
translation_notes:
  register: Современный литературный русский язык с сдержанным апокалиптическим звучанием. Краткое «Скройся!» сохраняет срочность повеления; кавычки намеренно закрыты сразу после него, чтобы ясно различить слова, обращённые к Ною, и дальнейшее поручение посланнику.
