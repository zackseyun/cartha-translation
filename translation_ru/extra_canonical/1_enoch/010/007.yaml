base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/007.yaml
  text: And heal the earth which the angels have corrupted[a], and make known the healing of the earth, so that they may heal the earth, and all the children of men may not perish through all the secrets that the Watchers have disclosed[f] and taught to their sons.
translation:
  language: ru
  text: И исцели землю, которую испортили ангелы, и дай узнать об исцелении земли[a], чтобы они исцелили землю и чтобы все сыны человеческие не погибли из-за всех тайн[c], которые Стражи открыли[b] и которым научили своих сыновей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Оборот, переданный как «дай узнать об исцелении земли», текстологически и синтаксически труден. Эфиопский текст можно понять и более буквально: «дай узнать о жизни земли» или «о восстановлении земли».'
    reason: textual_variant
  - marker: b
    text: 'В эфиопском тексте буквально стоит «убили» (ዘቀተሉ, za-qatalu). По-видимому, это отражение искажения в греческой рукописной традиции: ἐπάταξαν («поразили, убили») вместо ὑπέδειξαν («показали, открыли»).'
    reason: textual_variant
  - marker: c
    text: Под «тайнами» здесь понимается запретное сокрытое знание, раскрытое Стражами в этом повествовании, а не всякое божественное таинство или законное откровение.
    reason: cultural_note
lexical_decisions:
- source_word: አሕይዋ
  choice: исцели
  rationale: Повелительная форма и контекст восстановления повреждённой земли поддерживают естественное русское «исцели», не исключая буквального оттенка «оживи».
- source_word: አማሰኑ
  choice: погубили
  rationale: Передаёт причинённый ангелами тяжёлый ущерб земле; слово охватывает разрушение и нравственную порчу, не сводя смысл к ритуальному осквернению.
- source_word: ሕይወታ
  choice: исцеление
  rationale: Формально слово связано с жизнью, однако повтор глагола исцеления в ближайшем контексте позволяет передать его как «исцеление»; альтернативы отмечены в сноске.
- source_word: አይድዕ ከመ
  choice: возвести… чтобы
  rationale: Сохраняет каузативное значение сообщения и целевую связь со следующей частью фразы.
- source_word: ይሕይዋ ለምድር
  choice: чтобы они исцелили землю
  rationale: Прямо передаёт эфиопское «землю», не подменяя его греческим вариантом «бедствие/язву».
- source_word: ኢይትሐጐሉ
  choice: не погибли
  rationale: Естественное и достойное по регистру соответствие глаголу гибели или уничтожения.
- source_word: በምሥጢር ኵሉ
  choice: из-за всех тайн
  rationale: Сохраняет апокалиптическую лексику и причинный смысл, не сужая тайное знание исключительно до магии.
- source_word: ትጉሃን
  choice: Стражи
  rationale: Устоявшееся наименование ангельских существ в повествовании 1 Еноха; прописная буква показывает титульное употребление.
- source_word: መሀሩ ለውሉዶሙ
  choice: научили своих сыновей
  rationale: Сохраняет прямое значение обучения и буквальный родственный термин «сыновья».
theological_decisions:
- issue: Характер восстановления земли
  choice: Речь идёт о действительном исцелении и восстановлении повреждённой земли.
  alternative: Только нравственное исправление человеческого общества или буквальное «оживление земли».
  rationale: Земля неоднократно названа прямым объектом действия; космический образ суда и восстановления не следует сводить к общей нравственной метафоре.
- issue: Кому принадлежат раскрытые тайны
  choice: Тайное знание раскрыли Стражи и ему же научили своих сыновей.
  alternative: Речь может идти о неопределённом тайном знании, распространявшемся среди людей.
  rationale: Заключительная часть стиха прямо связывает раскрытие и обучение со Стражами.
- issue: Исправление испорченного чтения ዘቀተሉ
  choice: В основном тексте передан контекстуально требуемый смысл «открыли», а буквальное чтение указано в сноске.
  alternative: Буквально перевести как «убили», оставив синтаксически и смыслово нарушенную фразу.
  rationale: Эфиопское «убили» отражает известное искажение в греческой передаче; исправление необходимо для связного смысла, но свидетельство рукописной формы не скрывается.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Повторы слова «земля» сохранены как значимые для исходного текста; «сыны человеческие» и «Стражи» поддерживают жанровый регистр, оставаясь понятными современному читателю.
