base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/013.yaml
  text: And in those days they will lead them down into the abyss of fire[a], and into torment and the prison-house[b]; and there they will be shut up forever.
translation:
  language: ru
  text: И в те дни их низведут в огненную бездну[a], на мучение и в дом заключения[b], и там они будут заперты навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в нижнее (или глубокое) место огня»; возможны также переводы «в глубину огня» и «в огненную пропасть».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дом заключения» — конкретный образ места заточения, то есть темницы.'
    reason: cultural_note
lexical_decisions:
- source_word: መዋዕል
  choice: дни
  rationale: В апокалиптической формуле በውእቱ መዋዕል естественно передаётся как «в те дни», сохраняя характерную эсхатологическую формулировку.
- source_word: ይወስድዎሙ
  choice: их низведут
  rationale: Глагол допускает значения «возьмут», «поведут», «отведут»; приставочное «низведут» естественно сочетается с направлением вниз и не уточняет неназванных исполнителей.
- source_word: መትሕተ እሳት
  choice: огненную бездну
  rationale: Сочетание буквально обозначает нижнее или глубокое место огня. «Огненная бездна» сохраняет пространственный апокалиптический образ и не подменяет его позднейшим термином «ад».
- source_word: በጻዕር
  choice: на мучение
  rationale: Существительное означает тяжкое страдание или муку; в контексте суда «мучение» передаёт карательный оттенок.
- source_word: ቤት ሞቅሕ
  choice: дом заключения
  rationale: Буквально «дом заключения/заточения». Такой перевод сохраняет конкретную метафору исходного текста, хотя по-русски несколько необычен.
- source_word: ይትዓፀዉ
  choice: будут заперты
  rationale: Передаёт пассивное заключение и образ окончательно закрытого места, согласуясь с «домом заключения».
- source_word: ለዓለም
  choice: навеки
  rationale: В данном контексте суда устойчивое выражение естественно обозначает неограниченную длительность; «навеки» сохраняет торжественный, но современно понятный регистр.
theological_decisions:
- issue: Передача огненного места традиционным богословским термином
  choice: огненная бездна
  alternative: ад; огненная яма; глубина огня
  rationale: Геэзский текст даёт пространственный образ, а не употребляет закреплённый позднейший догматический термин. Перевод сохраняет этот образ без конфессионального уточнения.
- issue: Длительность заключения
  choice: навеки
  alternative: на вечность; на век
  rationale: В контексте карательного суда ለዓለም наиболее естественно выражает бессрочное, окончательное заключение. Формулировка не смягчает напряжённость текста.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Необычное выражение «дом заключения» намеренно сохранено ради конкретного образа оригинала; смысл пояснён в сноске. Неназванные исполнители действия не конкретизированы.
