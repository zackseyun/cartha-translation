base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/011.yaml
  text: And to Michael the Lord said[a], “Go, bind Shemihazah and the others with him[c][b], who joined themselves with women so as to defile themselves with them in their uncleanness.”
translation:
  language: ru
  text: 'И Господь сказал Михаилу: «Иди, свяжи Семьязу[a] и остальных, бывших с ним, которые соединились с женщинами и тем осквернили себя вместе с ними, в их нечистоте».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя также передают как Шемихаза, Семъяза или Семиаза.
    reason: lexical_alternative
lexical_decisions:
- source_word: ለሚካኤል
  choice: Михаилу
  rationale: Употреблена привычная русская форма имени, соответствующая геэзскому ሚካኤል и естественная для современного русского читателя.
- source_word: ይቤ እግዚእ
  choice: Господь сказал
  rationale: Эксплицитно сохранён названный в геэзском тексте субъект речи — «Господь».
- source_word: ሑር
  choice: Иди
  rationale: Форма передаёт повеление отправиться и естественно вводит последующее поручение.
- source_word: †አይድዕ†
  choice: свяжи
  rationale: Форма текста трудна, однако контекст суда над Стражами и более широкое текстовое свидетельство поддерживают значение связывания.
- source_word: ለስምያዛ
  choice: Семьязу
  rationale: Выбрана узнаваемая русская передача имени предводителя Стражей, близкая исходной форме и уже укоренённая в русскоязычной енохианской традиции.
- source_word: ወለካልኣን እለ ምስሌሁ
  choice: и остальных, бывших с ним
  rationale: Передан коллективный смысл без внесения отсутствующей в тексте иерархии или особого статуса.
- source_word: እለ ሐብሩ ምስለ አንስት
  choice: которые соединились с женщинами
  rationale: Сохраняется смысл намеренного соединения, но без чрезмерной конкретизации характера связи.
- source_word: ከመ ይማስኑ
  choice: и тем осквернили себя
  rationale: Конструкция допускает оттенок цели или результата; русская формулировка естественно передаёт связь поступка с последовавшим осквернением.
- source_word: በርኵሶ ዚአሆን
  choice: вместе с ними их нечистотой
  rationale: Сохранены как местоименная соотнесённость с женщинами, так и религиозно-нравственный оттенок «нечистоты»; усиление «всей» не добавлено.
theological_decisions:
- issue: Характер греха в соединении Стражей с женщинами
  choice: Описать его языком осквернения и нечистоты, не сводя к одной позднейшей богословской категории.
  alternative: Уточнить как исключительно половую распущенность, исключительно ритуальную нечистоту либо общее нечестие.
  rationale: Геэзский текст связывает соединение с женщинами с осквернением и нечистотой, но сам стих не устанавливает более узкой систематической классификации.
- issue: Цель или результат осквернения
  choice: 'Передать ከመ как фактическое следствие: «и тем осквернили себя».'
  alternative: 'Передать строго целевым оборотом: «чтобы осквернить себя».'
  rationale: Конструкция допускает целевой и результативный оттенки; выбранный русский оборот избегает утверждения, будто осквернение непременно было сознательной целью союза.
translation_notes:
  register: Современный литературный русский с достоинством древнего повествования. Синтаксис слегка возвышенный, но понятный; сохранены ритуально-нравственные слова «осквернили» и «нечистота». Единственный маркер [a] поставлен непосредственно после имени, к которому относится примечание.
