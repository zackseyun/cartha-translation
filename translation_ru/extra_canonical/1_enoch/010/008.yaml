base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/008.yaml
  text: And the whole earth has been corrupted by the teaching of the works of Azazel[c][b][a]; and to him ascribe all sin.
translation:
  language: ru
  text: И вся земля была развращена наставлением в делах Азазеля[a]; и запиши против него весь грех[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «учением делам Азазеля» или «наставлением его практикам». В геэзском выражении соединены представления об обучении и о конкретных делах или практиках; синтаксическая связь допускает разные оттенки.'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно передать: «вмени ему весь грех» или «запиши на него весь грех». Выражение имеет судебный смысл: вся вина официально записывается против Азазеля.'
    reason: alternative_reading
lexical_decisions:
- source_word: ማሰነት
  choice: была развращена
  rationale: Глагол выражает порчу или развращение; страдательная форма сохраняет нравственный и всеохватный смысл контекста суда.
- source_word: ኵላ ምድር
  choice: вся земля
  rationale: В апокалиптическом контексте речь идёт обо всей земле, а не об отдельной стране или области.
- source_word: በትምህርተ ግብሩ ለአዛዝኤል
  choice: учением о деяниях Азазеля
  rationale: Перевод удерживает оба элемента выражения — наставление и конкретные дела или практики — и связывает их с Азазелем, не сводя фразу к одному отвлечённому понятию.
- source_word: ወላዕሌሁ ጸሐፍ
  choice: и запиши на его счёт
  rationale: ወ передаёт союз «и», ጸሐፍ — повеление записать, а ላዕሌሁ имеет направленность «на него/против него». Русское судебно-счётное выражение естественно передаёт официальное вменение вины.
- source_word: ኵሎ ኃጢአተ
  choice: весь грех
  rationale: Собирательная формулировка сохраняет всеобъемлющий характер обвинения; «весь грех» ближе к исходной конструкции, чем «все грехи».
theological_decisions:
- issue: Означает ли заключительная фраза запись всего греха против Азазеля или более общее приписывание греха ему
  choice: запиши на его счёт весь грех
  alternative: запиши против него весь грех; вмени ему весь грех
  rationale: Контекст судебного приговора и предлог ላዕሌሁ поддерживают запись обвинения против Азазеля. При этом образ письменной записи сохранён, а не заменён одним лишь толкованием «вмени».
- issue: Как связаны «учение» и «деяния» в причине развращения земли
  choice: учением о деяниях Азазеля
  alternative: наставлением в делах Азазеля; учением, исходившим из деяний Азазеля
  rationale: Исходное выражение допускает некоторую синтаксическую неоднозначность. Основной текст показывает, что развращение распространялось через обучение делам или практикам Азазеля, а сноска сохраняет другие возможные оттенки.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной судебно-пророческой интонацией. Синтаксис сохраняет параллельность двух частей исходной фразы; устаревшая или узкоконфессиональная лексика не используется.
