base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/012.yaml
  text: And when all their sons have slain one another[a], and when they have seen the destruction of their beloved ones, bind them for seventy generations beneath the hills of the earth, until the day of their judgment and of their consummation[c][b], until the judgment that is for all eternity is completed.
translation:
  language: ru
  text: И когда все их сыновья перебьют друг друга и они увидят гибель тех, кого любят, свяжи их на семьдесят поколений под горами земли[a] — до дня суда над ними и их конца[b], то есть пока не завершится суд вечности[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «под холмами земли». Соответствующее геэзское слово допускает значения «горы» и «холмы».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их завершения». Речь может идти об их конце либо об окончательном завершении их участи.'
    reason: lexical_alternative
  - marker: c
    text: В оригинале употреблена усиленная формула вечности, буквально близкая к выражению «суд вечного века» или «суд веков вечных».
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትራገዙ
  choice: перебьют друг друга
  rationale: В контексте взаимного истребления исполинов взаимное значение глагола указывает на смертоносное насилие, а не просто на распрю.
- source_word: ሐጕሎሙ ለፍቁራኒሆሙ
  choice: гибель тех, кого любят
  rationale: Передаёт и разрушение или гибель, и эмоциональную силу обозначения любимых, не уточняя сверх источника способ их гибели.
- source_word: እሰሮሙ
  choice: свяжи их
  rationale: Сохраняет конкретный образ связывания Стражей и повелительную форму.
- source_word: ለ፸ ትውልድ
  choice: на семьдесят поколений
  rationale: Прямо передаёт апокалиптическое обозначение срока.
- source_word: በመትሕተ አውግርተ ምድር
  choice: под горами земли
  rationale: Естественная русская формулировка для места подземного заключения; существительное допускает также перевод «холмы».
- source_word: ዕለተ ኵነኔሆሙ
  choice: день суда над ними
  rationale: Сохраняет судебный смысл и не сужает его до одного лишь осуждения или приговора.
- source_word: ተፍጻሜቶሙ
  choice: их конец
  rationale: Современное и ясное соответствие слову со значением завершения или конца; двусмысленность отмечена в сноске.
- source_word: ኵነኔ ዘለዓለመ ዓለም
  choice: суд на веки вечные
  rationale: Передаёт усиленную формулу вечности в торжественной и привычной для русского языка форме.
theological_decisions:
- issue: Описывается ли распря сыновей или их взаимное убийство
  choice: «перебьют друг друга»
  alternative: «будут сражаться друг с другом» или «погубят друг друга»
  rationale: Ближайший контекст говорит о насильственном взаимном истреблении потомков Стражей; выбранный перевод сохраняет суровость картины суда.
- issue: Значение выражения о завершении их участи
  choice: «их конец» с пояснением в сноске
  alternative: «их завершение», «окончательное наказание»
  rationale: Источник допускает значения конца и завершения. Перевод не определяет, идёт ли речь именно об уничтожении, наказании или полном завершении судебного процесса.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Синтаксис сделан ясным для обычного читателя; повтор временных союзов и судебная образность источника сохранены. Все сноски имеют маркеры в основном тексте.
