lexical_decisions:
- source_word: አሜሃ
  choice: Тогда
  rationale: Передаёт повествовательный переход и последовательность событий, не уточняя временной оттенок сверх исходного текста.
- source_word: ልዑል
  choice: Всевышний
  rationale: Устоявшийся русский эквивалент возвышенного божественного титула.
- source_word: ዓቢይ ወቅዱስ
  choice: Великий и Святой
  rationale: Сохраняет нанизанные в исходном тексте божественные эпитеты и их торжественное звучание.
- source_word: ተናገረ
  choice: заговорил
  rationale: Передаёт самостоятельный глагол речи и естественно сочетается с последующим поручением.
- source_word: ወፈነወ
  choice: послал
  rationale: Прямо выражает отправление с поручением без излишне специальной лексики.
- source_word: አሰርየ፡ ልዩር
  choice: Уриила
  rationale: Имя восстанавливается по контексту и текстологическим данным; русская форма дана в родительном падеже после глагола «послал».
- source_word: ኀበ፡ ወልደ፡ ላሜክ
  choice: к сыну Ламеха
  rationale: Сохраняет направление действия и родственное обозначение, не подставляя имя Ноя в основной текст.
- source_word: ወይቤሎ
  choice: и сказал ему
  rationale: Передаёт как глагол речи, так и местоименный суффикс; возможная неоднозначность референта местоимения не устраняется добавлением имени.
theological_decisions:
- issue: Передача ряда божественных эпитетов
  choice: Всевышний, Великий и Святой
  alternative: Всевышний, Великий и Святой Единый
  rationale: Выбранная формулировка сохраняет три возвышенных определения Бога, не добавляя отсутствующего в источнике существительного и не сводя их к одному имени.
- issue: Идентификация сына Ламеха
  choice: сын Ламеха
  alternative: Ной
  rationale: В самом стихе дано только родственное обозначение; имя Ноя ясно из более широкого контекста, но его внесение в основной текст устранило бы различие между текстом и контекстуальным выводом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным строем. Заглавные буквы сохраняют титульный характер божественных эпитетов. Конструкция «сказал ему» намеренно не заменена уточнённым именем, чтобы не снимать возможную синтаксическую неоднозначность.
