base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/010.yaml
  text: And these things that they ask of you shall not be granted to their fathers on their behalf[a]; for they hope to live an everlasting life[d][c][b], and each one of them will live five hundred years.
translation:
  language: ru
  text: И просимое ими у тебя не будет даровано их отцам ради них[a], потому что они надеются жить вечной жизнью, и каждый из них проживёт пятьсот лет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоименные отсылки в геэзском тексте выражены сжато; «ради них» передаёт выражение «за них / ради них», не уточняя, к кому именно относятся местоимения.
    reason: alternative_reading
  - marker: b
    text: 'Буквально: «пятьсот зим» — идиоматическое обозначение пятисот лет.'
    reason: cultural_note
lexical_decisions:
- source_word: ዘይስእሉከ
  choice: просимое ими у тебя
  rationale: Передаёт относительную конструкцию как предмет просьбы — «то, о чём они просят тебя», — а не как обозначение людей, спрашивающих о собеседнике.
- source_word: ኢይከውኑ ለአበዊሆሙ
  choice: не будет даровано их отцам
  rationale: 'Глагол бытия с предлогом ለ здесь выражает предоставление или получение: просимое не достанется их отцам.'
- source_word: በእንቲአሆሙ
  choice: ради них самих
  rationale: Сохраняет значение ходатайства «ради них / за них», не устраняя сжатость местоименных отсылок.
- source_word: ይሴፈዉ
  choice: надеются
  rationale: Глагол означает надежду или ожидание; значение «будут отсечены» отвергнуто как лексически необоснованное.
- source_word: ይኅየዉ ሕይወተ ዘለዓለም
  choice: жить вечной жизнью
  rationale: Близко воспроизводит буквальное выражение «жить жизнью вечности» и сохраняет напряжение с последующим сроком в пятьсот лет.
- source_word: አሐዱ አሐዱ እምኔሆሙ
  choice: каждый из них
  rationale: Повторение «один, один» имеет распределительное значение.
- source_word: ኃምስተ ምእተ ክረምተ
  choice: пятьсот лет
  rationale: Буквально речь идёт о «пятистах зимах», но это идиоматический способ счёта лет.
theological_decisions:
- issue: Соотношение надежды на вечную жизнь и срока в пятьсот лет
  choice: Сохранено прямое соседство обоих утверждений без согласующего толкования.
  alternative: Понять «вечную жизнь» как просто долгую жизнь либо отнести две части к разным группам.
  rationale: Текст сам не объясняет кажущееся напряжение, поэтому перевод не должен молча его устранять.
- issue: К кому относятся местоимения в просьбе отцов
  choice: Сохранена сжатая формулировка «их отцам ради них самих».
  alternative: Явно назвать просителями отцов, а тех, за кого просят, — их потомками.
  rationale: Контекст может прояснять участников, но в самом стихе местоименные связи выражены сжато; экспликация в основном тексте чрезмерно сузила бы прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Неестественное калькирование сведено к минимуму, но смысловая сжатость местоимений и напряжение между «вечной жизнью» и пятьюстами годами сохранены.
