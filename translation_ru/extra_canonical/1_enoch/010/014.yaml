base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/014.yaml
  text: And when he burns and perishes[c][b][a], from now on they shall be bound together with them until the completion of the generations of generations.
translation:
  language: ru
  text: И когда он сгорит и погибнет,[a] отныне они будут связаны вместе с ними до завершения череды поколений.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начальные глаголы переданы как «сгорит и погибнет». В прежнем переводческом прочтении предлагалось: «когда они и их сыновья восстанут».'
    reason: previous_rendering
  - marker: b
    text: '«Череды поколений» передаёт повторяющееся выражение, буквально: «поколений поколений», обозначающее долгую последовательность поколений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሶበ
  choice: И когда
  rationale: Передаёт временной союз и сохраняет связь с предшествующим ходом повествования.
- source_word: ይውዒ
  choice: он сгорит
  rationale: Форма понимается от глагола «гореть»; будущее совершенного вида естественно для русского временного придаточного.
- source_word: ወይማስን
  choice: и погибнет
  rationale: Передаёт значение гибели или уничтожения, не подменяя его прежним ошибочным прочтением о сыновьях.
- source_word: እምይእዜ
  choice: отныне
  rationale: Темпоральное наречие означает «с этого времени, впредь».
- source_word: ምስሌሆሙ
  choice: с ними
  rationale: Сохраняет обозначение совместности в наказании и неоднозначную референцию местоимения.
- source_word: ኅቡረ
  choice: вместе
  rationale: Передаёт коллективный характер связывания.
- source_word: ይትአሰሩ
  choice: будут связаны
  rationale: Нейтрально передаёт образ связывания и не усиливает его до более толковательного «будут заключены в темницу».
- source_word: እስከ ተፍጻሜተ
  choice: до завершения
  rationale: Сохраняет указание на установленный предел продолжительности.
- source_word: ትውልደ ትውልድ
  choice: поколений поколений
  rationale: Буквально сохраняет торжественный повтор исходного идиоматического выражения; пояснение вынесено в сноску.
theological_decisions:
- issue: Продолжительность и предел наказания
  choice: Связывание длится до завершения долгой последовательности поколений.
  alternative: Вечное заключение либо заключение только до последнего суда.
  rationale: Исходный текст сочетает предельную конструкцию «до завершения» с повтором слова «поколение»; перевод сохраняет эту временную напряжённость и не сводит её к позднейшей догматической формуле.
- issue: Референция местоимений
  choice: Сохранены «он», «они» и «с ними» без добавочного пояснения.
  alternative: Назвать соответствующих участников прямо по контексту.
  rationale: Сам стих употребляет местоимения, а предоставленный фрагмент не позволяет без толкования однозначно заменить их именами.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Буквальный повтор «поколений поколений» сохранён ради формы оригинала и пояснён в сноске; местоименная неоднозначность не устранена толкованием.
