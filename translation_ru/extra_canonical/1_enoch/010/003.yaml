base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/003.yaml
  text: And now instruct him[c][b][a], that he may flee and preserve his seed for all the generations forever.
translation:
  language: ru
  text: А теперь наставь его, чтобы он бежал и чтобы его потомство[a] пребывало во всех поколениях вовеки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его семя», то есть его потомки, его род.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «для всех поколений навеки».'
    reason: lexical_alternative
lexical_decisions:
- source_word: መሀሮ
  choice: наставь его
  rationale: Передаёт повелительный смысл и сообщение необходимого знания, не сужая значение до одного лишь предупреждения.
- source_word: ይጐይዝ
  choice: чтобы он спасся бегством
  rationale: Контекст грядущего суда предполагает не просто уход, а срочное удаление от опасности.
- source_word: ይተርፍ (вероятное исправление переданного ይገበር)
  choice: чтобы … пребывало
  rationale: Исправление поддерживается формой ዘርኡ как подлежащего и греческим свидетельством μενεῖ; поэтому потомство не представлено прямым дополнением при глаголе «сохранить».
- source_word: ዘርኡ
  choice: его потомство
  rationale: Естественный современный русский эквивалент родословного значения «его семя»; буквальный вариант отмечен в сноске.
- source_word: ለኵሎሙ ትውልድ ለዓለም
  choice: во всех поколениях вовеки
  rationale: Сохраняет сочетание последовательности поколений и усиленной длительности, оставаясь понятным и возвышенным.
theological_decisions:
- issue: Означает ли фраза действие по сохранению потомства или продолжение существования рода
  choice: Его потомство выступает подлежащим и пребывает во всех поколениях.
  alternative: «и сохрани его семя»
  rationale: Номинативная форма ዘርኡ и вероятное чтение ይተርፍ указывают на непереходную конструкцию; перевод сохраняет обещание продолжения рода, не уточняя сверх текста способ божественного сохранения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. «Спасся бегством» передаёт срочность, а «пребывало» — длительное продолжение рода. Черновик учитывает вероятную ошибку транскрипции/OCR в представленном геэзском тексте и более сильное грамматическое и греческое свидетельство в пользу чтения «останется, пребудет».
