base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/009.yaml
  text: And to Gabriel the Lord said[a], “Go against the bastards and the reprobates, and against the children of fornication; destroy the children of fornication and the children of the Watchers from among humankind. Send them out against one another, and let them perish in battle[d][c][b]; for length of days shall not be theirs.”
translation:
  language: ru
  text: 'И Гавриилу Господь сказал: «Иди против незаконнорождённых[a] и отверженных, и против детей блуда; истреби детей блуда и детей Стражей из среды людей[b]. Обрати их друг против друга[c], и пусть они погибнут в битве[d], ибо долгой жизни им не будет».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфиопское слово — резкое обозначение потомства недозволенного союза; возможный более грубый перевод: «ублюдков».'
    reason: lexical_alternative
  - marker: b
    text: 'Чтение выражения «детей Стражей» не вполне надёжно: в данном месте эфиопский текст труден, однако ближайший контекст говорит о Стражах и их потомстве.'
    reason: textual_variant
  - marker: c
    text: Одна из глагольных форм в рукописной передаче заключена в скобки; точная последовательность действий неясна, но смысл столкновения друг с другом сохраняется.
    reason: textual_variant
  - marker: d
    text: 'По смыслу взаимной битвы возможно: «пусть они истребят друг друга»; однако форма эфиопского глагола буквально означает «пусть погибнут» или «пусть будут уничтожены».'
    reason: translation_alternative
lexical_decisions:
- source_word: ወለገብርኤል፡ ይቤሎ፡ እግዚእ፡
  choice: И Гавриилу Господь сказал
  rationale: Сохранён вынесенный вперёд адресат, при этом порядок слов остаётся естественным для торжественной русской прозы; እግዚእ передано как «Господь».
- source_word: ሑር፡ ዲቤሆሙ፡
  choice: Иди против
  rationale: В контексте повеления о суде сочетание обозначает враждебное выступление против названных далее лиц, а не простое движение к ним.
- source_word: ለመንዝራን፡
  choice: незаконнорождённых
  rationale: Передаёт происхождение от недозволенного союза. Русское «ублюдки» ярче выражало бы оскорбительную силу, но звучит чрезмерно разговорно и в современном употреблении часто утрачивает точное родословное значение.
- source_word: ወለማኑናን፡
  choice: и отверженных
  rationale: Сохраняет значение лиц, отвергнутых и обречённых на суд, не вводя более узкой богословской категории.
- source_word: ወዲበ፡ ውሉደ፡ ዘማ፡
  choice: и против детей блуда
  rationale: Буквально и ёмко сохраняет одновременно нравственный и родословный смысл выражения, связанного с половым преступлением.
- source_word: ወአኅጕሎሙ፡
  choice: истреби
  rationale: Сильный глагол соответствует повелению об уничтожении в сцене суда.
- source_word: ለውሉደ፡ ትጉሃን፡ እምሰብእ፡
  choice: детей Стражей из среды людей
  rationale: «Стражи» — устойчивое обозначение действующих лиц в ближайшем контексте 1 Еноха. Формулировка сохраняет связь их потомства с человеческой средой, не распространяя суд на человечество вообще.
- source_word: ወአውፅኦሙ፡ [ወፈንዎሙ፡] በበይናቲሆሙ፡
  choice: Обрати их друг против друга
  rationale: Передаёт взаимную направленность последующего столкновения естественным русским выражением; точная последовательность глаголов в свидетеле не вполне надёжна.
- source_word: እሙንቱ፡ ወስሊሆሙ፡ በቀትል፡ ይትሐጐሉ፡
  choice: и пусть они погибнут в битве
  rationale: Форма ይትሐጐሉ имеет непереходное или страдательное значение «погибнуть, быть уничтоженными»; перевод не превращает её в активное «истребят друг друга», хотя взаимная борьба ясна из контекста.
- source_word: እስመ፡ ኑሐ፡ መዋዕል፡ አልቦሙ።
  choice: ибо долгой жизни им не будет
  rationale: Естественная современная русская формула сохраняет торжественный смысл буквального выражения об отсутствии у них «долготы дней».
theological_decisions:
- issue: Кого постигает суд в этом стихе
  choice: Суд направлен на потомство, возникшее вследствие запретных союзов Стражей с людьми.
  alternative: Считать адресатами либо только исполинов, либо грешных людей вообще.
  rationale: Последовательность обозначений — незаконнорождённые, дети блуда и дети Стражей — указывает на особое потомство из повествования о преступлении Стражей, а не на человечество в целом.
- issue: Нравственно окрашенная родословная лексика
  choice: Сохранить резкость осуждения через выражения «незаконнорождённые» и «дети блуда», не прибегая к современной брани.
  alternative: Смягчить до нейтрального «потомство недозволенных союзов» либо усилить до бранного «ублюдки».
  rationale: Источник говорит языком апокалиптического суда и не должен быть обезврежен, однако достоинство русского текста требует избегать слова, которое сегодня воспринимается прежде всего как бытовое ругательство.
- issue: Взаимное уничтожение и грамматический залог
  choice: Перевести глагол как «пусть они погибнут», оставив взаимность в предшествующем «друг против друга».
  alternative: «Пусть они истребят друг друга».
  rationale: Контекст подразумевает взаимную гибель, но форма исходного глагола непереходная или страдательная. Основной текст сохраняет грамматику источника и не устраняет контекстуальную взаимность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией судебного повеления. Сохранены традиционные для 1 Еноха «Стражи» и образное «дети блуда»; архаизмы и разговорно-бранная лексика в основном тексте исключены.
