base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/015.yaml
  text: And destroy these spirits of the bastards and the children of the Watchers, because they have oppressed humankind.
translation:
  language: ru
  text: И истреби духов незаконнорождённых[a] и детей Стражей[b], потому что они угнетали род человеческий[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духов незаконного потомства»; исходное слово имеет резкий, уничижительный оттенок и указывает на потомство от недозволенного союза.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также понимание: «духов незаконнорождённых, то есть детей Стражей». Исходный синтаксис не вполне ясно показывает, названы ли здесь две группы или одна группа двумя обозначениями.'
    reason: textual_ambiguity
  - marker: c
    text: 'Или: «совершали насилие над родом человеческим».'
    reason: lexical_alternative
lexical_decisions:
- source_word: አኅጕሎሙ
  choice: истреби
  rationale: Передаёт повелительно-желательное значение и суровость судебного приговора, не уточняя способ уничтожения.
- source_word: መናፍስተ
  choice: духов
  rationale: В апокалиптическом контексте речь идёт о духовных существах; «души» было бы менее точно.
- source_word: ተውኔት
  choice: незаконнорождённых
  rationale: Сохраняет значение незаконного, недозволенного происхождения и связь с потомством Стражей, избегая того, чтобы современное ругательство заслонило смысл.
- source_word: ውሉዶሙ
  choice: детей
  rationale: Естественно передаёт родственное обозначение, не сужая его до сыновей.
- source_word: ትጉሃን
  choice: Стражей
  rationale: Устоявшееся в апокалиптическом контексте наименование бодрствующих ангельских существ; прописная буква отмечает его как название группы.
- source_word: ገፍዕዎሙ
  choice: угнетали
  rationale: Глагол обозначает жестокое притеснение и насилие; «причинили зло» или «обидели» были бы слишком слабы.
- source_word: ሰብእ
  choice: род человеческий
  rationale: Передаёт собирательное значение и звучит естественно в возвышенной современной русской прозе.
theological_decisions:
- issue: Соотношение «духов незаконнорождённых» и «детей Стражей»
  choice: Обе формулировки сохранены рядом без отождествляющего пояснения.
  alternative: 'Понять вторую формулировку как приложение: «духов незаконнорождённых, то есть детей Стражей».'
  rationale: Синтаксис допускает тесную связь двух обозначений, однако не вынуждает явно считать их полностью тождественными. Перевод сохраняет эту богословскую и референциальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического судебного речения. «Истреби» сохраняет суровость приказа, «незаконнорождённых» — резкость исходного обозначения без разговорной бранности, а «род человеческий» естественно передаёт собирательное значение.
