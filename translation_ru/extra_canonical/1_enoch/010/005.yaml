base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/005.yaml
  text: And heap jagged and sharp stones upon him[a], and cover him with darkness; and there he shall remain forever[c][b]. And cover his face so that he may not see light.
translation:
  language: ru
  text: И навали на него неровные и острые камни[a], и покрой его тьмой; там он останется навеки. И закрой ему лицо, чтобы он не видел света.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Первое определение камней можно также передать как «шероховатые», «грубые» или «зазубренные»; вместе с «острыми» оно подчёркивает их суровый, причиняющий мучение характер.
    reason: lexical_alternative
  - marker: b
    text: Закрытое лицо и невозможность видеть свет конкретно изображают полную изоляцию осуждённого.
    reason: cultural_note
lexical_decisions:
- source_word: ደይ፡ ላዕሌሁ፡ እብነ
  choice: навали на него… камни
  rationale: Императив обозначает помещение камней поверх осуждённого; «навали» естественно передаёт образ тяжёлого каменного заточения, не ослабляя его до простого «положи».
- source_word: ጠያያተ፡ ወበሊሓተ
  choice: неровные и острые
  rationale: Два определения относятся к одним и тем же камням и усиливают суровость образа. «Неровные» сохраняет более широкое значение первого слова, не сводя оба определения к одной лишь остроте.
- source_word: ክድኖ
  choice: покрой / закрой
  rationale: 'Повтор глагола сохранён посредством однокоренных русских форм; управление требует естественного различения: «покрой его тьмой» и «закрой ему лицо».'
- source_word: ጽልመተ
  choice: тьмой
  rationale: Передаёт конкретный апокалиптический образ полного лишения света и согласуется с творительным падежом после «покрой».
- source_word: ይኅድር፡ ለዓለም
  choice: он останется навеки
  rationale: В контексте заточения глагол означает продолжающееся пребывание; «останется навеки» звучит современно и сохраняет длительность наказания.
- source_word: ለገጹ
  choice: ему лицо
  rationale: Буквально речь идёт о его лице. Русская конструкция «закрой ему лицо» естественнее, чем тяжеловесное «закрой его лицо», при том же смысле.
- source_word: ከመ፡ ኢይርአይ፡ ብርሃነ
  choice: чтобы он не видел света
  rationale: Прямо сохраняет целевое или результативное значение конструкции и конкретный образ лишения света.
theological_decisions:
- issue: Характер образов наказания
  choice: Сохранены буквальные образы камней, тьмы, закрытого лица и отсутствия света.
  alternative: Передать их обобщённо как страдание или заключение.
  rationale: Геэзский текст последовательно использует конкретные повеления. Их обобщение ослабило бы суровую апокалиптическую картину и внесло бы ненужное толкование.
- issue: Продолжительность заточения
  choice: «навеки»
  alternative: «надолго» или «до века»
  rationale: ለዓለም выражает неограниченную длительность. Перевод сохраняет силу формулы, не уточняя её посредством позднейших доктринальных категорий.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Синтаксический параллелизм повелений и конкретность апокалиптических образов сохранены; архаизмы и конфессионально окрашенная терминология не использованы.
