base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/016.yaml
  text: Destroy all violence from the face of the earth[a], and every evil deed shall come to an end; and the plant of righteousness and uprightness shall appear[b], and it shall become a blessing.
translation:
  language: ru
  text: Истреби всё насилие с лица земли, и всякому злому делу придёт конец; и явится растение праведности и правоты[a], и станет благословением.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «насаждение праведности и правоты». Эфиопское существительное может обозначать как посаженное растение, так и само насаждение либо его результат.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሕጕል
  choice: истреби
  rationale: Активный императив второго лица единственного числа продолжает обращённое к Михаилу повеление; форма требует передачи приказом, а не страдательным будущим временем.
- source_word: ኵሎ ግፍዓ
  choice: всё насилие
  rationale: ግፍዓ охватывает насилие, угнетение и неправду; «насилие» сохраняет общественно-нравственную силу слова в контексте суда.
- source_word: እምገጸ ምድር
  choice: с лица земли
  rationale: Сохранён буквальный семитский оборот с «лицом», уместный для возвышенной апокалиптической речи.
- source_word: ኵሉ ምግባረ እኩይ
  choice: всякому злому делу
  rationale: Фраза имеет всеохватный смысл; дательный падеж естественно сочетается по-русски с выражением «прийти к концу».
- source_word: ይኅልቅ
  choice: придёт конец
  rationale: Глагол может означать гибель, окончание или прекращение; при подлежащем «злое дело» эта передача естественно выражает прекращение.
- source_word: ያስተርኢ
  choice: явится
  rationale: Передаёт становление видимым и сохраняет образ появления растущего растения.
- source_word: ተክለ
  choice: растение
  rationale: Сохраняет конкретный земледельческий образ; возможное значение процесса или результата насаждения отмечено в сноске.
- source_word: ጽድቅ ወርትዕ
  choice: праведности и правоты
  rationale: «Праведность» соответствует устойчивому значению ጽድቅ, а «правота» передаёт прямоту и нравственную верность ርትዕ без излишней конфессиональной окраски.
- source_word: ይከውን ለበረከት
  choice: станет благословением
  rationale: Естественно передаёт результативную конструкцию «будет/станет для благословения» и сохраняет богословскую ёмкость образа.
theological_decisions:
- issue: Смысл земледельческого образа «растение праведности и правоты»
  choice: Сохранён конкретный апокалиптический образ растения.
  alternative: «насаждение праведности и правоты» или отвлечённое «праведность расцветёт»
  rationale: Эфиопское существительное допускает предметное и процессуальное понимание. Основной текст сохраняет зрительный образ, а сноска сообщает реальную лексическую неоднозначность, не сводя её к отвлечённому пересказу.
- issue: Наклонение начального глагола
  choice: Повелительное «истреби».
  alternative: «всё насилие будет устранено»
  rationale: Форма አሕጕል — активный императив второго лица мужского рода единственного числа и продолжает прямые повеления Михаилу; страдательное будущее устранило бы прямое обращение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Сохранены прямое повеление, семитский оборот «с лица земли» и земледельческий образ; синтаксис остаётся понятным широкому читателю.
