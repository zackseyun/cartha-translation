base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/018.yaml
  text: And I looked and saw within it a lofty throne[a]; and its appearance was like crystal, and its wheels like the shining sun[d][c][b], and the voice of the cherubim.
translation:
  language: ru
  text: И я взглянул и увидел внутри него высокий престол; вид его был подобен кристаллу[a], колёса его — сияющему солнцу[b], и голос херувимов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «кристалл», может также означать лёд, иней или светлое кристаллическое вещество; образ передаёт ослепительную прозрачность и сияние.
    reason: lexical_alternative
  - marker: b
    text: Геэзское слово может означать также «круг», «окружность» или «то, что окружает». Перевод «колёса» поддерживается древними греческим и арамейским свидетельствами.
    reason: textual_and_lexical_alternative
  - marker: c
    text: 'Заключительная фраза в геэзском предельно кратка, буквально: «и голос херувимов». Вероятно, она добавляет к видению престола слуховой образ, но не образует полного предложения.'
    reason: source_syntax
lexical_decisions:
- source_word: ነጸርኩ፡ ወርኢኩ
  choice: я взглянул и увидел
  rationale: Сохранены оба глагола видения, передающие торжественную, усиленную манеру апокалиптического рассказа.
- source_word: ውስቴቱ
  choice: внутри него
  rationale: Прямо передаёт пространственное значение и связывает видение с сооружением, описанным в предшествующем контексте.
- source_word: መንበረ፡ ልዑለ
  choice: высокий престол
  rationale: «Престол» передаёт царское седалище, а «высокий» сохраняет прежде всего зрительный образ высоты, не исключая величия.
- source_word: ራእዩ
  choice: видом он был
  rationale: Естественно по-русски указывает на видимый облик престола.
- source_word: አስሐትያ
  choice: кристаллу
  rationale: Передаёт образ ослепительно светлого и прозрачного вещества; возможные значения «лёд» и «иней» отмечены в сноске.
- source_word: ክበቡ
  choice: колёса его
  rationale: В образе небесного престола значение «колесо/колёса» поддерживается древними греческим и арамейским свидетельствами; множественное число естественно передаёт образ престола-колесницы.
- source_word: ፀሐይ፡ ዘያበርህ
  choice: сияющему солнцу
  rationale: Кратко и образно передаёт относительное выражение «солнце, которое светит».
- source_word: ቃለ፡ ኪሩቤን
  choice: голос херувимов
  rationale: Сохраняет краткий слуховой образ; «голос» является обычным современным соответствием, хотя слово может также означать «звук».
theological_decisions:
- issue: Характеристика престола
  choice: высокий престол
  alternative: возвышенный престол
  rationale: Выбранный вариант сохраняет пространственную высоту и величие образа, не превращая описание в особый богословский титул.
- issue: Образ окружающего престол круга
  choice: колёса его
  alternative: его окружность / то, что окружало его
  rationale: Контекст престольного видения и древние текстовые свидетельства указывают на колёса, однако лексическая широта геэзского слова честно отмечена в сноске.
- issue: Незавершённая заключительная фраза
  choice: и голос херувимов
  alternative: и слышался голос херувимов
  rationale: Сохранена грамматическая сжатость и напряжённость исходного текста; глагол «слышался» не добавлен, поскольку его нет в геэзском.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Архаизмы вроде «глас» и тяжеловесные обороты устранены; необычная обрывистость последней фразы сохранена как черта источника.
