base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/017.yaml
  text: And its floor was of fire[a], and above it were lightnings and the path of the stars[b], and its ceiling was blazing fire.
translation:
  language: ru
  text: Пол его был из огня, а над ним — молнии и путь звёзд[a]; потолок[b] его был пылающим огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «путь звёзд» можно также перевести как «ход звёзд» или «путь движения звёзд»; вероятно, речь идёт об их упорядоченном движении по небу.
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «потолок», может также означать «крыша» или «свод»; менее вероятен перевод «твердь», если понимать образ более космически, чем архитектурно.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምድሩሰ
  choice: пол его
  rationale: Слово буквально обозначает землю или поверхность; в контексте внутреннего пространства небесного дома «пол» естественно передаёт архитектурный образ, не уточняя материал покрытия.
- source_word: ዘእሳት
  choice: был из огня
  rationale: Сохраняет исходную конструкцию принадлежности или состава и резкий апокалиптический образ.
- source_word: መልዕልቴሁ
  choice: над ним
  rationale: Естественно передаёт пространственное значение «выше него / над ним».
- source_word: መበርቅት
  choice: молнии
  rationale: Множественное число сохраняет множественность вспышек в видении и звучит естественно по-русски.
- source_word: ምርዋፀ
  choice: путь
  rationale: Передаёт значение пути, хода или траектории, не устраняя возможный образ упорядоченного движения небесных светил.
- source_word: ከዋክብት
  choice: звёзд
  rationale: Прямое и естественное соответствие множественному числу исходного слова.
- source_word: ጠፈሩኒ
  choice: потолок его
  rationale: В описании внутреннего пространства «потолок» сохраняет архитектурный смысл; значения «крыша» и «свод» остаются возможными.
- source_word: እሳት ዘይነድድ
  choice: пылающим огнём
  rationale: Кратко и выразительно передаёт буквальный оборот «огонь, который горит», сохраняя интенсивность образа.
theological_decisions:
- issue: Соотношение архитектурной и космической образности небесного строения
  choice: Архитектурные детали переданы словами «пол» и «потолок», а космические элементы сохранены как «молнии» и «путь звёзд».
  alternative: Передать ጠፈር более космически как «свод» или «твердь», либо более внешне-архитектурно как «крыша».
  rationale: Стих намеренно соединяет образ небесного здания с космическими явлениями. Перевод сохраняет это напряжение, не сводя видение ни к обычному строению, ни исключительно к космосу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным регистром. Синтаксис сохраняет последовательность пространственных образов и лаконизм апокалиптического видения.
