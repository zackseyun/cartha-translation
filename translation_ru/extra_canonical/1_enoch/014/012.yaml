translation:
  language: ru
  text: И огонь пылал вокруг стен, а двери его[a] горели огнём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В переданной эфиопской транскрипции стоит форма, которую можно перевести «а под ними»; вероятно, это ошибка распознавания вместо «а двери его». Чтение «двери» подтверждается греческим текстом.
    reason: textual_variant
lexical_decisions:
- source_word: እሳት
  choice: огонь
  rationale: Основное значение — «огонь»; повтор сохранён ради образности и соответствия источнику.
- source_word: ዘይነድድ
  choice: пылал
  rationale: Относительная глагольная форма описывает горящий огонь; «пылал» естественно передаёт интенсивность видения.
- source_word: በአውደ
  choice: вокруг
  rationale: Передаёт пространственное окружение без архаизма.
- source_word: አረፍት
  choice: стен
  rationale: Форма понимается как множественное число слова «стена», что согласуется с архитектурным контекстом 1 Еноха 14.
- source_word: ወጥሕቱ / предлагаемое ወኆኅቱ
  choice: а двери его[a]
  rationale: 'Переданный текст, вероятно, содержит ошибку распознавания: чтение «его двери» подтверждается греческим свидетелем καὶ θύραι и лучше объясняет буквы и синтаксис.'
- source_word: ይውዒ በእሳት
  choice: горели огнём
  rationale: Буквально передаёт горение огнём и сохраняет повтор слова «огонь».
theological_decisions:
- issue: Следует ли понимать спорную форму как «под ними» или исправить её на «его двери»
  choice: В основном тексте принято чтение «его двери», снабжённое текстологической сноской.
  alternative: «а под ними полыхал огонь»
  rationale: Эфиопская транскрипция имеет среднюю степень надёжности и, вероятно, отражает ошибку OCR. Греческое свидетельство прямо читает «двери, горящие огнём»; это чтение также известно критической традиции и не вносит богословской конкретизации.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной образностью. Сохранены повтор «огонь — огнём» и параллельное построение двух частей стиха.
