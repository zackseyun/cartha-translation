  text: And as I shook and trembled[a], I fell on my face and saw in the vision.
translation:
  language: ru
  text: И когда я был в смятении и дрожал[a], я пал ниц и увидел видение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «трепетал и дрожал». Эти два близких по смыслу глагола вместе выражают сильный страх и потрясение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እንዘ
  choice: пока
  rationale: Вводит одновременное обстоятельство и связывает состояние Еноха с последующим падением и видением.
- source_word: እትሀወክ
  choice: я был в смятении
  rationale: Передаёт внутреннее потрясение и сильное волнение, не сводя значение только к телесной дрожи.
- source_word: እርዕድ
  choice: дрожал
  rationale: Сохраняет телесную реакцию страха и усиливающую связь с предыдущим глаголом.
- source_word: ወድቁ
  choice: я пал
  rationale: Простой глагол падения соответствует исходному образу; выражение «ниц» уже указывает на позу.
- source_word: በገጽየ
  choice: ниц
  rationale: Естественный и достоинственный русский эквивалент буквального «на моё лицо», обозначающий падение лицом вниз.
- source_word: እሬኢ
  choice: увидел
  rationale: Прямо передаёт обычный глагол зрительного восприятия без архаизации.
- source_word: በራእይ
  choice: в видении
  rationale: Сохраняет апокалиптический контекст и формально не навязывает определённость, отсутствующую в русском языке.
theological_decisions:
- issue: Передавать ли два глагола как отвлечённый страх или как внутреннюю и телесную реакцию
  choice: «был в смятении и дрожал»
  alternative: «трепетал и дрожал» / «был потрясён и трепетал»
  rationale: 'Так сохраняются оба исходных глагола и их интенсивность: первый обозначает внутреннее потрясение, второй — заметную телесную реакцию. Перевод не сводит сочетание к общему слову «боялся».'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Пал ниц» сохраняет достоинство и краткость исходного образа, оставаясь понятным современному читателю.
