base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/003.yaml
  text: As he created and gave to humankind to understand the word of knowledge[a], so also he created me and gave me reproof for the Watchers[c][b], the sons of heaven.
translation:
  language: ru
  text: Как Он сотворил людей и дал им постигать слово познания, так же Он сотворил и меня и поручил мне обличать их — Стражей, сынов неба.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эта часть эфиопского текста передана не вполне ясно. Форму ወለቲኒ, вероятно, следует читать как ወሊተኒ — «и меня», а следующую форму — как «чтобы я обличал их». Возможно и более буквальное, но менее ясное понимание: «дал мне порицание для Стражей». Название «Стражи» буквально связано с бодрствованием и бдительностью.'
    reason: textual_variant
lexical_decisions:
- source_word: ከመ ... ወለቲኒ
  choice: Как ... так же ... и меня
  rationale: Сравнительная конструкция передана естественной русской парой «как… так же». Форму ወለቲኒ с учётом вероятной ошибки в передаче текста прочитано как ወሊተኒ — «и меня», что восстанавливает первое лицо и поручение Еноху.
- source_word: ሰብእ
  choice: людей
  rationale: Собирательное обозначение человечества передано современным общепонятным словом без ненужного указания на мужской пол.
- source_word: ይለብዉ ቃለ አእምሮ
  choice: постигать слово познания
  rationale: Глагольная конструкция сохранена, а ቃል передано конкретным словом «слово», не сводя выражение к одной лишь абстрактной способности понимать.
- source_word: እዝልፎሙ
  choice: поручил мне обличать их
  rationale: Форма понята как относящийся к первому лицу глагол со значением порицания или обличения и объектным показателем множественного числа. «Поручил» естественно выражает конструкцию «дал мне [делать]», не превращая действие в существительное «порицание».
- source_word: ትጉሃን
  choice: Стражей
  rationale: Буквальное значение связано с бодрствованием и бдительностью, но в данном повествовании это устойчивое обозначение ангельских Стражей; прописная буква показывает употребление в качестве названия группы.
- source_word: ውሉደ ሰማይ
  choice: сынов неба
  rationale: Формальный перевод сохраняет родственный и небесный образ исходного выражения.
theological_decisions:
- issue: Кого обозначает выражение ትጉሃን ውሉደ ሰማይ
  choice: «Стражей, сынов неба» — небесных существ из повествования о Стражах
  alternative: «бдительных сынов неба» или «бодрствующих, сынов неба»
  rationale: Контекст книги указывает на известную группу ангельских существ. При этом приложение «сыны неба» сохранено, а примечание сообщает буквальный оттенок названия.
- issue: Является ли እዝልፎሙ поручением Еноху или существительным со значением «порицание»
  choice: Поручение Еноху обличать Стражей
  alternative: «дал мне порицание для Стражей»
  rationale: Глагольный разбор лучше объясняет личные и объектные показатели формы и связно продолжает чтение «и меня». Текстологическая трудность не скрыта и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего религиозного повествования. Синтаксис сделан ясным для обычного читателя; первое лицо Еноха восстановлено по наиболее вероятному грамматическому разбору, а реальная текстологическая неопределённость вынесена в примечание.
