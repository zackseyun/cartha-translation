  source_fidelity: 'Русский текст верно отражает наиболее вероятный грамматический разбор трудного места: сравнительную конструкцию, дар людям способности постигать «слово познания», затем первое лицо («меня») и поручение обличать Стражей. Он не следует ошибочному английскому ревизионному варианту «gave me reproof for the Watchers», который превращает вероятную глагольную форму в существительное. Неопределённость передачи ወለቲኒ/ወሊተኒ и следующей формы должным образом отмечена.'
