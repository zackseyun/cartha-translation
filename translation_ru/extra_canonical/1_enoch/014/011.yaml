base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/011.yaml
  text: Its ceiling was like the path of the stars and the lightnings[a], and among them were fiery cherubim[c][b], and their heaven was water.
translation:
  language: ru
  text: Его потолок был подобен пути звёзд и молний[a][c], и среди них были огненные херувимы, и их небо было водой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «путь», может также означать «ход», «движение» или, более буквально, «бег» звёзд.
    reason: lexical_alternative
  - marker: b
    text: Фраза «их небо было водой» трудна для истолкования. Она может относиться к небу, связанному с огненными херувимами, либо к верхней области увиденного строения.
    reason: alternative_reading
  - marker: c
    text: 'Всё выражение можно также передать: «ход звёзд и вспышки молний».'
    reason: alternative_rendering
lexical_decisions:
- source_word: ጠፈሩ
  choice: его потолок
  rationale: В ближайшем контексте описывается строение; «потолок» естественно передаёт его верхнее покрытие, не превращая образ преждевременно в космический «небосвод».
- source_word: ሩጸተ
  choice: путь
  rationale: Слово обозначает бег, движение или ход. В сочетании со звёздами «путь» передаёт их видимую траекторию и сохраняет образность.
- source_word: ከዋክብት
  choice: звёзд
  rationale: Обычное и контекстуально ясное обозначение небесных светил.
- source_word: መበርቅት
  choice: молниям
  rationale: Форма допускает собирательное или множественное понимание; множественное число естественно передаёт повторяющиеся вспышки в видении.
- source_word: ማእከሎሙ
  choice: среди них
  rationale: Сохраняет пространственное отношение херувимов к только что названным небесным явлениям, не уточняя его сверх источника.
- source_word: ኪሩቤን
  choice: херувимы
  rationale: Традиционная и понятная русская форма названия небесных существ.
- source_word: ዘእሳት
  choice: огненные
  rationale: Кратко и естественно передаёт определительную конструкцию «из огня / огня», не решая, описывает ли она природу или внешний вид херувимов.
- source_word: ሰማዮሙ
  choice: их небо
  rationale: Сохранено притяжательное значение эфиопской формы, хотя образ остаётся необычным и его точная соотнесённость неясна.
- source_word: ማይ
  choice: водой
  rationale: Передаёт единственное собирательное обозначение воды без добавления отсутствующего в тексте сравнения «как вода».
theological_decisions:
- issue: Следует ли сглаживать необычную фразу ሰማዮሙ፡ ማይ («их небо — вода»)
  choice: а их небо было водой
  alternative: а небо над ними было водой; а их небо было подобно воде
  rationale: Притяжательная форма и прямое именное утверждение сохранены. Перевод не добавляет ни пространственного уточнения «над ними», ни сравнительного «подобно», которых нет в представленном источнике.
- issue: К кому относится местоимение в выражении «их небо»
  choice: оставить референт неуточнённым
  alternative: явно отнести небо к херувимам или ко всей верхней области строения
  rationale: Источник допускает связь с ближайшими херувимами либо с совокупностью описанных небесных реалий; явное уточнение необоснованно устранило бы двусмысленность.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной лексикой. Синтаксическая необычность последней фразы сохранена намеренно как свойство апокалиптического видения; пояснения вынесены в сноски.
