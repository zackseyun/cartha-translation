base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/004.yaml
  text: 'I wrote down your petition[a], and in my vision it was shown thus: that your petition will not be granted to you for all the days of eternity, and the sentence against you has been completed[c][b], and it will not be granted to you.'
translation:
  language: ru
  text: 'Я записал ваше прошение, и в видении мне было показано следующее: ваше прошение не будет удовлетворено на все дни вечности[a], и приговор против вас окончательно установлен[b], и оно не будет удовлетворено.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на все дни века (или вечности)»; это усиленная формула бесконечной длительности.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «суд над вами завершён». Смысл в том, что решение против них окончательно установлено. В данной электронной передаче геэзского текста в этом месте, по-видимому, допущена ошибка: вместо слова «суд» стоит «я»; чтение «суд» подтверждается иным текстовым свидетельством и соответствует контексту.'
    reason: textual_variant
lexical_decisions:
- source_word: ስእለትክሙ
  choice: ваше прошение
  rationale: «Прошение» передаёт обращённую к высшей власти настоятельную просьбу и сохраняет судебно-официальный тон контекста лучше, чем более общее «просьба» или преимущественно религиозное «молитва».
- source_word: ጻሐፍኩ
  choice: я записал
  rationale: Передаёт действие письменной фиксации прошения естественным современным русским языком.
- source_word: በራእየየ
  choice: в видении
  rationale: Естественно обозначает откровение, полученное посредством сверхъестественного созерцания.
- source_word: ያስተርኢ
  choice: мне было показано
  rationale: Безлично-пассивная конструкция сохраняет формулу откровения и не вводит прямо не названного субъекта действия.
- source_word: እስመ
  choice: что
  rationale: Союз вводит содержание увиденного; повторение «что» в русском ясно связывает все последующие положения с откровением.
- source_word: ኢትከውነክሙ
  choice: не будет удовлетворено
  rationale: Буквально выражение ближе к «не будет вам», однако в контексте подлежащим по смыслу служит прошение; выбранный вариант ясно передаёт окончательный отказ без добавления формулы «не будет услышано».
- source_word: መዋዕለ ዓለም
  choice: во все дни вечности
  rationale: Сохраняет буквальный образ «дней вечности/века» и торжественную апокалиптическую выразительность формулы бесконечной длительности.
- source_word: ፍጽምት
  choice: приговор уже вынесен
  rationale: В контексте суда слово указывает на завершённое, окончательно установленное решение. Русская формула «приговор вынесен» естественно выражает эту завершённость; «уже» подчёркивает результативность, не меняя смысла.
- source_word: ላዕሌክሙ
  choice: вам
  rationale: В сочетании «приговор вам вынесен» передаёт направленность неблагоприятного судебного решения; более буквальное «над вами» по-русски здесь менее естественно.
- source_word: ወኢይከውነ ክሙ
  choice: и оно не будет удовлетворено
  rationale: Повторный отказ сохранён, а местоимение однозначно отнесено к прошению.
theological_decisions:
- issue: Характер отказа в прошении Стражей
  choice: 'Окончательный судебный отказ: «прошение не будет удовлетворено»'
  alternative: Более буквальное «не будет вам» или молитвенное «не будет услышано»
  rationale: «Удовлетворено» сохраняет судебно-апокалиптический характер ответа и не привносит позднейшую формулу об услышанной или неуслышанной молитве.
- issue: Значение судебной формулы с ፍጽምት
  choice: Окончательно вынесенный приговор
  alternative: «Суд над вами завершён», «решение против вас окончательно» или отвлечённое «завершение»
  rationale: Контекст говорит о бесповоротном решении относительно Стражей. Выбор не превращает выражение в общее учение о конце мира, но сохраняет окончательность суда.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим и судебным оттенком. Синтаксический параллелизм и повтор окончательного отказа сохранены; архаизмы и конфессионально окрашенная терминология не использованы.
