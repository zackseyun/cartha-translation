review_pass:
  verdict: revise
  source_fidelity: 'Основная последовательность образов передана верно: вход в огненный язык, приближение к большому дому из града, его узорчатая конструктивная поверхность и градовый пол. Однако «свод» чрезмерно конкретизирует спорное эфиопское архитектурное слово. По исходной традиции и раннему английскому аудиторскому чтению более вероятны «стены»; это также избегает внесения в текст понятия сводчатой конструкции, которого источник не требует.'
  naturalness: «Вошёл в язык огня» намеренно буквально, но в современном русском несколько шероховато. «Вошёл в огненный язык» естественнее и всё же сохраняет конкретный образ языка пламени. «Стены ... были подобны мозаике» литературно и ясно; «свод ... словно мозаика» одновременно менее естественно и опирается на неуверенное толкование.
  terminology: «Большой дом», «градины» и «пол ... был градом» удачно сохраняют нейтральность и нарочитую материальную странность видения. «Мозаика» допустима при поясняющей сноске как передача узорчатой кладки/плиточного покрытия. Сноска к спорному архитектурному термину должна отражать избранное чтение «стены» и его альтернативы, а не представлять «свод» как основной смысл.
  issues:
  - severity: medium
    issue: «Свод» как передача አረፍተ ውእቱ ቤት
    rationale: Термин текстологически труден, но «свод» обозначает специфическую сводчатую конструкцию и неоправданно сужает смысл. В традиционном контексте этого стиха и в более раннем аудиторском чтении вероятнее «стены». Неоднозначность следует сохранить в сноске.
  - severity: low
    issue: «Вошёл в язык огня»
    rationale: Буквальная конструкция понятна, но для современного литературного русского менее плавна, чем «вошёл в огненный язык», которая сохраняет образность оригинала.
