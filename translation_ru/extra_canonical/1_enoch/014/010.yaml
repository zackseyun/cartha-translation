base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/010.yaml
  text: And I went into the tongue of fire[a], and I drew near to a great house built of hailstones; and the roof of that house was like a mosaic of hailstones[c][b], and its floor was hail.
translation:
  language: ru
  text: И я вошёл в огненный язык и приблизился к большому дому, сложенному из градин. Стены[a] этого дома были подобны мозаике[b] из градин, а пол его был градом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Соответствующее эфиопское слово в данном чтении не вполне ясно; возможно также понимание «верхнее покрытие» или, шире, «поверхность дома».
    reason: textual_variant
  - marker: b
    text: Имеется в виду узорчатая кладка или поверхность из уложенных плит, а не обязательно мозаика в современном смысле.
    reason: cultural_note
lexical_decisions:
- source_word: ልሳነ እሳት
  choice: язык огня
  rationale: 'Сохраняет конкретный и необычный образ оригинала: ልሳን буквально означает «язык»; обобщение до «пламени» ослабило бы образность видения.'
- source_word: ቤት ዓቢይ
  choice: большой дом
  rationale: Передаёт обычное значение ቤት и величину, выраженную ዓቢይ, не уточняя постройку как храм, дворец или зал.
- source_word: ዘኅኑጽ በእእባነ በረድ
  choice: сложенному из градин
  rationale: Причастие обозначает построенное сооружение, а буквальный образ «камней града» естественно передаётся русским «градины». Глагол «сложенному» хорошо сочетается со строительным материалом.
- source_word: አረፍተ ውእቱ ቤት
  choice: свод этого дома
  rationale: По контексту речь идёт о конструктивной поверхности дома. «Свод» сохраняет принятое в последней редакции понимание верхнего покрытия, но из-за трудности формы текстовая неопределённость отмечена в сноске.
- source_word: ከመ ጸፍጸፈ ሳሌዳት
  choice: словно мозаика
  rationale: Фраза указывает на узорчатую кладку или поверхность из плит. «Мозаика» понятно передаёт зрительный образ, не внося в основной текст противоречивое сравнение свода с полом.
- source_word: ምድረ በረድ
  choice: пол его был градом
  rationale: Внутри дома ምድር естественно означает «пол». Именное сказуемое «был градом» сохраняет резкую и странную материальность видения, не сглаживая её до «ледяного пола».
theological_decisions:
- issue: Следует ли истолковывать увиденный дом как храм или дворец
  choice: Сохранено нейтральное обозначение «большой дом» и необычный образ града.
  alternative: Передать ቤት как «храм», «чертог» или «дворец» на основании более широкого контекста.
  rationale: Сам стих называет сооружение домом и описывает его посредством образов видения. Более специальное обозначение внесло бы богословское толкование, которого данная формулировка прямо не требует.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным ритмом. Необычные апокалиптические образы — «язык огня», дом из градин и пол, являющийся градом, — намеренно не нормализованы. Все сноски обозначены в основном тексте.
