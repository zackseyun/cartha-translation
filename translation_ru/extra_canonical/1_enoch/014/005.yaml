base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/005.yaml
  text: And from now on you shall not ascend into heaven for all eternity[b][a], and on the earth it has been declared that you shall be bound for all the days of eternity.
translation:
  language: ru
  text: И отныне вы не взойдёте на небо во веки[a], и на земле объявлено[b], что вы будете связаны на все дни вечности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В эфиопском тексте употреблены две сходные, но разные формулы длительности: одна относится к запрету восходить на небо, другая — к связыванию. В переводе сохранены обе формулы, а не сведены к одному слову «навсегда».'
    reason: lexical_alternative
  - marker: b
    text: Безличное «объявлено» не называет того, кто вынес приговор; контекст позволяет понимать это как небесное судебное решение.
    reason: cultural_note
lexical_decisions:
- source_word: እምይእዜ
  choice: отныне
  rationale: Краткий и торжественный временной указатель, обозначающий начало нового состояния вследствие приговора.
- source_word: ኢትዓርጉ
  choice: вы не взойдёте
  rationale: Отрицательная глагольная форма в контексте судебного провозглашения передана как категорический запрет-приговор, а не как простое повеление.
- source_word: ውስተ ሰማይ
  choice: на небо
  rationale: В апокалиптическом контексте речь идёт о небесной сфере в противопоставлении земле, а не просто о видимом небосводе.
- source_word: እስከ ኵሉ ዓለም
  choice: во веки
  rationale: Устойчивая русская формула передаёт неограниченную длительность и сохраняет возвышенный тон приговора.
- source_word: ወውስተ ምድር ተነግረ
  choice: а на земле объявлено
  rationale: Безличная пассивная формула сохраняет не названный в источнике субъект провозглашения; союз «а» естественно подчёркивает противопоставление неба и земли.
- source_word: ይእስርክሙ
  choice: вы будете связаны
  rationale: Сохранён конкретный образ связывания, важный для повествования о наказании Стражей, без замены на более толковательное «заключены в темницу».
- source_word: በኵሉ መዋዕለ ዓለም
  choice: на все дни вечности
  rationale: Более буквальная передача второй формулы длительности сохраняет её образность и намеренное повторение, не сливая обе формулы в одно «навсегда».
theological_decisions:
- issue: Передавать ли наказание обобщённо или сохранить конкретный апокалиптический образ
  choice: вы будете связаны
  alternative: вы будете заключены / заточены
  rationale: Источник использует образ связывания. Его сохранение не подменяет образ частным толкованием о месте или способе заключения.
- issue: Называть ли власть, провозгласившую приговор
  choice: 'оставить субъект невыраженным: «объявлено»'
  alternative: «Бог объявил» или «небесный суд объявил»
  rationale: Хотя контекст предполагает небесный судебный приговор, грамматическая пассивная формула не называет действующее лицо; перевод сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, судебно-апокалиптическим звучанием. Синтаксис остаётся ясным для широкого читателя; параллельные формулы вечной длительности и конкретный образ связывания сохранены.
