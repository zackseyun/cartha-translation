base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/001.yaml
  text: This is the book of the words of righteousness and of the reproof of the vigilant ones who are from eternity[c][b][a], just as the Holy and Great One commanded in that vision.
translation:
  language: ru
  text: Вот книга слов праведности и обличения Бодрствующих[a], которые от века[b], — как[c] повелел Святой и Великий в том видении.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Стражей»; эфиопское слово буквально обозначает тех, кто бодрствует или пребывает настороже.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «от века» может также означать «издревле», указывая на древнее происхождение, а не обязательно на абсолютную вечность.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «сообразно тому, как».'
    reason: previous_rendering
lexical_decisions:
- source_word: መጽሐፈ
  choice: книга
  rationale: Прямое и естественное соответствие письменной книге или произведению; подходит для формулы заглавия.
- source_word: ቃለ
  choice: слов
  rationale: Форма единственного числа допускает собирательное значение; русское множественное число естественно вводит содержание книги.
- source_word: ጽድቅ
  choice: праведности
  rationale: Сохраняет нравственный и богословский вес слова, не сужая его значения до одной лишь юридической справедливости.
- source_word: ዘለፋ
  choice: обличения
  rationale: Передаёт официально-назидательный смысл порицания или укоризны и соответствует возвышенному апокалиптическому регистру.
- source_word: ትጉሃን
  choice: Бодрствующих
  rationale: Передаёт непосредственный эфиопский смысл — тех, кто бодрствует или не спит, — и одновременно позволяет распознать особый класс небесных существ; традиционный вариант указан в сноске.
- source_word: እለ እምዓለም
  choice: которые от века
  rationale: Сохраняет краткость и неоднозначность выражения между вечностью и глубокой древностью, не утверждая абсолютную извечность этих существ.
- source_word: አዘዘ
  choice: повелел
  rationale: Точно передаёт властное распоряжение и естественно звучит в возвышенной русской прозе.
- source_word: ቅዱስ ወዓቢይ
  choice: Святой и Великий
  rationale: Передаёт два согласованных божественных эпитета как единый титул без лишнего поясняющего существительного.
- source_word: በይእቲ ራእይ
  choice: в том видении
  rationale: Сохраняет прежде всего местное значение предлога и не исключает того, что повеление было сообщено посредством видения.
theological_decisions:
- issue: Кого обозначает ትጉሃን
  choice: Бодрствующие — особый класс небесных существ
  alternative: Стражи; бодрствующие люди; усердные
  rationale: Контекст Книги Стражей указывает на небесных существ. Передача через «Бодрствующие» сохраняет буквальный образ эфиопского слова, а не превращает его в обозначение обычных усердных людей.
- issue: Смысл እለ እምዓለም
  choice: которые от века
  alternative: которые издревле; вечные; принадлежащие миру
  rationale: Формулировка сохраняет неопределённость между происхождением в глубокой древности и более сильным значением вечности, не вынося догматического суждения о природе этих существ.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном апокалиптического заглавия. Заглавные буквы в «Бодрствующих» и «Святой и Великий» отмечают соответственно устойчивое обозначение небесных существ и божественный титул. Конструкция «которые от века» намеренно сохраняет сжатость и смысловую напряжённость источника.
