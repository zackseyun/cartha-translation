  text: And from beneath the throne came forth[a][b].
translation:
  language: ru
  text: И из-под престола исходило[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В геэз это краткая фраза, в которой не сказано, что именно исходило; образ раскрывается в следующей строке. Перевод сохраняет эту намеренную незавершённость.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «И из-под его престола исходило».'
    reason: previous_rendering
lexical_decisions:
- source_word: እምታሕተ
  choice: из-под
  rationale: Предлог передаёт одновременно исходную точку движения и положение ниже престола; это естественный и точный русский эквивалент.
- source_word: መንበሩ
  choice: престола
  rationale: В контексте небесного видения መንበር означает именно «престол». Суффикс здесь может выполнять определительную функцию и отсылать к уже упомянутому престолу, поэтому в основном тексте выбрано «престола», а притяжательное прочтение сохранено в примечании.
- source_word: ይወፅእ
  choice: исходило
  rationale: Глагол означает выход или движение наружу. «Исходило» сохраняет возвышенный апокалиптический регистр и намеренную незавершённость краткой эфиопской фразы, не добавляя того, что именно исходило.
theological_decisions:
- issue: Значение суффикса в መንበሩ
  choice: 'Передать определённо: «престола»'
  alternative: «его престола»
  rationale: В геэз суффикс третьего лица мужского рода может обозначать определённость и отсылать к ранее названному престолу. Такое прочтение не вводит владельца или сидящего на престоле раньше, чем это делает контекст; притяжательная возможность отмечена отдельно.
- issue: Не названо то, что исходило
  choice: Сохранить незаполненную синтаксическую позицию
  alternative: Добавить предмет или образ из следующей строки контекста
  rationale: Исходная строка представляет собой краткую незавершённую формулировку. Добавление «нечто», «потоки огня» или другого подлежащего разрешило бы сохранённую в источнике открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Форма «исходило» позволяет сохранить необычную незавершённость источника, не вставляя отсутствующее подлежащее.
