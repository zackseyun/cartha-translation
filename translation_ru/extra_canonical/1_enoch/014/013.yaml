base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/013.yaml
  text: And I went into that house[a], and it was hot like fire and cold like ice, and there was no delight of life within it; fear covered me, and trembling seized me.
translation:
  language: ru
  text: 'И я вошёл в тот дом: он был горяч, как огонь, и холоден, как лёд, и не было в нём никакой отрады жизни[a]. Страх объял меня, и дрожь охватила меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Геэзское выражение, переведённое как «никакой отрады жизни», не вполне ясно. Оно может означать, что в доме не было животворной приятности, или, шире, что там не было ничего, что давало бы живому существу утешение и покой.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወቦእኩ ውስተ ውእቱ ቤት
  choice: И я вошёл в тот дом
  rationale: «Вошёл» прямо передаёт движение внутрь, а «тот дом» сохраняет указательное значение и связь с ранее описанным строением.
- source_word: ምውቅ ከመ እሳት
  choice: горяч, как огонь
  rationale: Передаёт основной смысл прилагательного и сохраняет краткий, выразительный образ без избыточного усиления.
- source_word: ቈሪር ከመ በረድ
  choice: холоден, как лёд
  rationale: Сохраняет парадоксальное противопоставление огня и холода; в данном сравнении «лёд» контекстуально уместнее возможного «града».
- source_word: ወኢምንተ ፍግዐ ሕይወት አልቦቱ ውስቴቱ
  choice: и не было в нём никакой отрады жизни
  rationale: 'Неясная фраза передана намеренно необычно: она, вероятно, отрицает жизненную отраду или животворную приятность, но не сводится однозначно к отсутствию самой жизни.'
- source_word: ፍርሃት ከደነኒ
  choice: Страх объял меня
  rationale: «Объял» естественно и образно передаёт буквальную идею покрывающего или окутывающего страха.
- source_word: ወረዓድ አኃዘኒ
  choice: и дрожь охватила меня
  rationale: Сохраняет телесный образ дрожи и силу глагола со значением захватывать или овладевать.
theological_decisions:
- issue: Смысл трудной фразы о том, чего не было внутри дома
  choice: не было в нём никакой отрады жизни
  alternative: не было в нём ничего живого; не было в нём никакой жизненной радости
  rationale: Выбранная формулировка сохраняет необычность и смысловую напряжённость геэзского текста, не превращая его без достаточных оснований в простое утверждение о полном отсутствии жизни.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис ясен для широкого читателя; слова «объял» и «отрада» слегка возвышенны, но общеупотребительны и соответствуют торжественному контексту.
