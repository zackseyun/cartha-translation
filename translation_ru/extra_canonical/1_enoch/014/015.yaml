base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/015.yaml
  text: And behold[a], another house, greater than that one, and every doorway stood open before me[c][b]; and it was built with tongues of fire.
translation:
  language: ru
  text: И вот — другой дом, больше того[a]; передо мной был открыт каждый дверной проём[b], и построен он был из языков огня[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «величественнее того». Местоимение указывает на ранее увиденный дом: буквально — «того», не «этого».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «все двери были открыты передо мной». Геэзское выражение допускает распределительную передачу («каждый дверной проём») и собирательную («все двери»).'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «из языков огня». Образ может обозначать языкоподобные выступы пламени; в некоторых переводах он сглажен до «пламени огня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ናሁ
  choice: и вот
  rationale: Сохраняет характерное для видения указательное восклицание, не сводя его к простому повествовательному переходу.
- source_word: ካልእ ቤት
  choice: другой дом
  rationale: Передаёт архитектурный образ прямо и не уточняет его как храм или дворец без достаточного основания в самом стихе.
- source_word: ዘየዓቢ እምዝክቱ
  choice: больше того
  rationale: «Больше» допускает оттенки как размера, так и превосходства, а «того» точно передаёт дальнее указательное местоимение ዝክቱ и отсылку к ранее увиденному дому.
- source_word: ኵሉ ኆኅተ
  choice: каждый дверной проём
  rationale: Сохраняет распределительное звучание ኵሉ и конкретный архитектурный смысл существительного; возможное собирательное понимание отмечено в сноске.
- source_word: ርኁት በቅድሜየ
  choice: передо мной был открыт
  rationale: Передаёт состояние открытости и пространственную перспективу самого провидца естественным русским оборотом.
- source_word: ሕኑጽ
  choice: построен
  rationale: Прямой архитектурный глагол, согласующийся с образом дома и не добавляющий толкования.
- source_word: በልሳናተ እሳት
  choice: из языков огня
  rationale: Сохраняет конкретный и необычный апокалиптический образ «языков», не сглаживая его до общего слова «пламя».
theological_decisions:
- issue: Характер увиденного небесного здания
  choice: дом
  alternative: храм или дворец
  rationale: В геэзском тексте прямо употреблено слово «дом». Контекст может допускать храмовое или дворцовое понимание, но перевод не вводит эту идентификацию в основной текст.
- issue: Смысл сравнительной характеристики второго дома
  choice: больше того
  alternative: величественнее того
  rationale: Нейтральное «больше» сохраняет возможность понимать превосходство как размер, величие либо оба оттенка, не разрешая неоднозначность преждевременно.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной интонацией видения. Тире после «вот» подчёркивает внезапное явление нового дома; точка с запятой сохраняет протяжённость исходной фразы. Необычный образ «языков огня» оставлен без конфессионального или символического истолкования.
