base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/002.yaml
  text: I saw in my sleep what I now speak with a tongue of flesh and with my spirit[a], which the Great One has given to men as a mouth[c][b], so that they might speak with it and understand in the heart.
translation:
  language: ru
  text: Я видел во сне то, о чём теперь говорю языком плоти и духом моим[a], который Великий дал людям как уста[b], чтобы они говорили посредством него и постигали сердцем[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моим дыханием». Слово на геэз может означать и «дух», и «дыхание»; упоминание языка и речи поддерживает второй вариант.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально по сохранившемуся тексту: «который Великий дал людям как уста». Конструкция трудна; возможно, текст был искажён при передаче, однако слово «уста» в геэз присутствует.'
    reason: textual_difficulty
  - marker: c
    text: «Сердце» здесь означает внутреннее средоточие мысли и понимания, а не только чувств.
    reason: cultural_note
lexical_decisions:
- source_word: ርኢኩ በንዋምየ
  choice: Я видел во сне
  rationale: Передаёт видение, полученное в состоянии сна, не уточняя сверх текста, был ли это именно сюжет сна или видение во время сна.
- source_word: ይእዜ እነግር
  choice: теперь говорю
  rationale: Сохраняет переход от пережитого видения к его нынешнему устному изложению.
- source_word: በልሳን ዘሥጋ
  choice: языком плоти
  rationale: Буквально сохраняет выразительный апокалиптический образ телесной человеческой речи.
- source_word: ወበመንፈስየ
  choice: и моим духом
  rationale: መንፈስ допускает значения «дух» и «дыхание»; основной текст следует непосредственному значению «дух», а телесно-речевая параллель, благоприятствующая варианту «дыхание», отмечена в сноске.
- source_word: ዓቢይ
  choice: Великий
  rationale: Сохраняет божественный эпитет и возвышенный регистр, не заменяя его поясняющим словом «Бог».
- source_word: ዘወሀበ ዓቢይ አፈ ለሰብእ
  choice: которого Великий дал людям как уста
  rationale: Включает засвидетельствованное в геэз አፈ «уста» и сохраняет трудную конструкцию текста вместо молчаливого исправления по предполагаемому греческому чтению.
- source_word: ይትናገሩ ቦቱ
  choice: чтобы они говорили им
  rationale: Передаёт целевую конструкцию и формально согласует местоимение с русским словом «дух».
- source_word: ወይለብዉ በልብ
  choice: и постигали сердцем
  rationale: Естественно выражает внутреннее понимание, сохраняя древнее представление о сердце как средоточии мысли и постижения.
theological_decisions:
- issue: Значение መንፈስ в описании человеческой речи
  choice: дух
  alternative: дыхание
  rationale: Слово действительно многозначно. «Дух» сохраняет антропологическую и богословскую глубину, тогда как контекст языка и речи делает «дыхание» серьёзной альтернативой, указанной в сноске.
- issue: Передача божественного эпитета ዓቢይ
  choice: Великий
  alternative: Бог
  rationale: Эпитет сохранён как эпитет, без внесения отсутствующего в данной формуле общего наименования Бога.
- issue: Трудная конструкция с አፈ «уста»
  choice: которого Великий дал людям как уста
  alternative: которого Великий дал людям
  rationale: Слово «уста» явно присутствует в засвидетельствованном тексте геэз, поэтому его нельзя опускать, даже если фраза может отражать испорченную текстовую традицию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Необычные образы «язык плоти» и «как уста» сохранены ради близости к источнику; неоднозначности вынесены в краткие сноски.
