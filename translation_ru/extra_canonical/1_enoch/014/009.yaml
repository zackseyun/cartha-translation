base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/009.yaml
  text: And I went in until I drew near to a wall built of stones of hail[a], and a tongue of fire surrounded it[e][d][c][b], and it began to make me afraid.
translation:
  language: ru
  text: И я вошёл и приблизился к стене[a], сложенной из камней града[b]. Язык огня окружал её[c], и это стало устрашать меня[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «сооружению» или «строению»; однако значение «стена» поддерживается древними параллельными свидетельствами.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «камней града»; возможно также понимание «градин».'
    reason: lexical_alternative
  - marker: c
    text: 'В источнике — единственное число: «язык огня», а не «языки огня».'
    reason: textual_clarification
  - marker: d
    text: Заключительная фраза в данном текстовом свидетельстве трудна; общий смысл в том, что увиденное стало внушать Еноху страх.
    reason: textual_variant
lexical_decisions:
- source_word: ወቦእኩ
  choice: И я вошёл
  rationale: Глагол обозначает вхождение; «вошёл» прямо и естественно передаёт движение Еноха внутрь.
- source_word: እስከ እቀርብ
  choice: и приблизился
  rationale: Сочетание описывает продолжение движения вплоть до приближения. В русском последовательное «и приблизился» звучит естественнее буквального «пока не приблизился», не меняя хода видения.
- source_word: ጥቅም
  choice: к стене
  rationale: В данном архитектурном контексте значение «стена» поддерживается древними параллельными свидетельствами; более общее «сооружение» оставлено в примечании как возможная передача эфиопского слова.
- source_word: ዘሕንጽት
  choice: сложенной из
  rationale: Форма характеризует стену как построенную; «сложенной из» естественно сочетается с камнями и сохраняет материальность образа.
- source_word: በእእባነ በረድ
  choice: из камней града
  rationale: Буквальный необычный образ «камней града» сохранён вместо сглаженного «градин», чтобы не утратить апокалиптическую зримость текста.
- source_word: ልሳነ እሳት
  choice: Язык огня
  rationale: И существительное, и согласование в источнике указывают на единственное число. Буквенный образ важен также для связи со следующим стихом.
- source_word: የዓውዳ
  choice: окружал её
  rationale: Глагол выражает окружение или опоясывание; несовершенный вид по-русски уместно описывает увиденное состояние.
- source_word: ወጠነ ያፍርሀኒ
  choice: это стало устрашать меня
  rationale: Передаёт начинательное значение и каузатив страха, при этом нейтральное «это» не навязывает грамматически неясный субъект заключительной фразы.
theological_decisions:
- issue: Сохранение образов небесного строения
  choice: стена, сложенная из камней града; язык огня
  alternative: сооружение из градин; пламя
  rationale: Необычные конкретные образы сохранены без рационализации и без привнесения конфессионального истолкования.
- issue: Субъект заключительной фразы
  choice: это стало устрашать меня
  alternative: язык огня стал устрашать меня
  rationale: 'Местоименное «это» сохраняет неопределённость: причиной страха может быть язык огня либо всё увиденное, тогда как явное называние субъекта разрешило бы напряжение за текст.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной, но понятной повествовательной интонацией. Короткие фразы сохраняют поступательное движение видения; необычная апокалиптическая образность намеренно не сглажена.
