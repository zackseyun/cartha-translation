base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/006.yaml
  text: And before this[a], you will have seen the destruction of your beloved sons, and you will not have them for yourselves[c][b], but they will fall before you by the sword.
translation:
  language: ru
  text: И прежде этого вы увидите гибель ваших любимых сыновей, и не будет вам от них радости, а они падут перед вами от меча.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምቅድመ ዝንቱ
  choice: ещё до этого
  rationale: Естественно передаёт временную последовательность пророчества; «ещё» подчёркивает, что событие произойдёт прежде уже названного.
- source_word: ርኢክሙ
  choice: вы увидите
  rationale: Перфектная форма в пророческом контексте передана русским будущим временем. Русское будущее совершенного вида сохраняет представление о событии, которое адресаты успеют увидеть.
- source_word: ሐጕለ
  choice: гибель
  rationale: В контексте насильственной смерти сыновей «гибель» звучит естественно и точно, не добавляя подробностей сверх текста.
- source_word: ውሉድክሙ ፍቁራን
  choice: ваших любимых сыновей
  rationale: Сохраняет мужское обозначение потомков Стражей и эмоциональную силу определения «любимые».
- source_word: †ጥራያኒሆሙ† / Greek ὄνησις αὐτῶν
  choice: не будет вам от них радости
  rationale: Эфиопское чтение помечено как повреждённое и буквально указывает на имущество или достояние; сохранившееся греческое свидетельство даёт смысл пользы, наслаждения или радости от них. Русская формулировка естественно передаёт этот смысл без чрезмерного уточнения.
- source_word: ይወድቁ ቅድሜክሙ በሰይፍ
  choice: они падут перед вами от меча
  rationale: Сохраняет апокалиптический образ падения, присутствие отцов при гибели сыновей и указание на орудие смерти.
theological_decisions:
- issue: К кому относятся слова «ваших любимых сыновей»
  choice: К потомкам Стражей, гибель которых они увидят
  alternative: К человеческим сыновьям вообще или к потомкам в широком смысле
  rationale: Ближайший контекст содержит приговор Стражам за их запретные союзы и говорит о судьбе рождённых от этих союзов потомков; перевод сохраняет эту связь, не вводя дополнительных догматических категорий.
- issue: Смысл повреждённой фразы после упоминания гибели сыновей
  choice: Стражи лишатся радости от своих сыновей
  alternative: Стражи не получат их имущества либо не смогут оставить сыновей при себе
  rationale: Основной текст следует ясному греческому свидетельству ὄνησις αὐτῶν, тогда как трудное эфиопское чтение отмечено обелами и, вероятно, отражает повреждение. Разночтение открыто указано в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Порядок слов преимущественно естественный; выражение «падут перед вами от меча» сохраняет возвышенную апокалиптическую образность оригинала.
