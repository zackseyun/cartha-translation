base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/007.yaml
  text: And your petition on their behalf will not be granted; nor on your own behalf; and you yourselves, while you weep and make supplication, will not speak a single word from the book that I wrote.
translation:
  language: ru
  text: И ваше прошение не будет удовлетворено ни за них, ни за вас самих[a]; и вы сами, плача и умоляя, не произнесёте ни единого слова из книги, которую я написал[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не будет». В связи с прошением это может означать также: «не сбудется» или «не будет удовлетворено».'
    reason: lexical_alternative
  - marker: b
    text: Заключительная фраза трудна для толкования. Возможно, Стражи не смогут представить, повторить или использовать перед Богом письменное ходатайство Еноха.
    reason: alternative_reading
lexical_decisions:
- source_word: ስእለትክሙ
  choice: ваше прошение
  rationale: Существительное обозначает просьбу или мольбу; «прошение» сохраняет официальный оттенок ходатайства в данном контексте.
- source_word: በእንቲአሆሙ
  choice: за них
  rationale: Предложная конструкция выражает представительство или ходатайство; краткое русское «за них» передаёт это естественно.
- source_word: ኢይከውን
  choice: не будет исполнено
  rationale: Буквально — «не будет», но применительно к прошению речь, вероятнее всего, о том, что оно не осуществится или не будет удовлетворено.
- source_word: ወበእንቲአክሙ
  choice: как и за вас самих
  rationale: Фраза параллельна «за них» и завершает мысль об отказе в прошении также применительно к самим адресатам.
- source_word: ወአንትሙሂ
  choice: и вы сами
  rationale: Передаёт эмфатическое местоимение и сохраняет контраст с предшествующим ходатайством за других.
- source_word: እንዘ ትበክዩ ወታስተበቍዑ
  choice: плача и умоляя
  rationale: Конструкция с እንዘ выражает сопутствующее обстоятельство; деепричастный оборот естественно сохраняет его подчинённость главному глаголу.
- source_word: ወኢትተናገሩ
  choice: не произнесёте
  rationale: Глагол речи в сочетании с «ни единого слова» естественно передаётся как «произнесёте».
- source_word: ወኢምንተ ቃለ
  choice: ни единого слова
  rationale: Формула усиливает отрицание; выбранный оборот достоинственен и естественен в современном литературном русском.
- source_word: እምውስተ መጽሐፍ ዘጻሐፍኩ
  choice: из книги, которую я написал
  rationale: Сохраняет значение письменного документа и явное относительное придаточное оригинала.
theological_decisions:
- issue: Означает ли заключительная фраза запрет Стражам читать записанное Енохом ходатайство или невозможность воспользоваться им
  choice: Они «не произнесут ни единого слова» из книги
  alternative: Им не будет позволено произнести ни слова из книги; либо они не получат ответа посредством книги
  rationale: Геэзский текст прямо отрицает их речь, но не уточняет, идёт ли речь о запрете, бессилии или тщетности; перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский с достоинственным, умеренно возвышенным тоном. Синтаксический параллелизм двух оборотов «за них / за вас самих» сохранён; обстоятельственное значение конструкции с እንዘ передано деепричастиями. Все сноски отмечены в основном тексте.
