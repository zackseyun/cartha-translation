base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/016.yaml
  text: And in every respect it excelled in splendor and glory and greatness[d][c][b][a], so that I am unable to tell you about its splendor and about its greatness.
translation:
  language: ru
  text: И во всём оно было непревзойдённым по великолепию, славе и величию, так что я не в силах рассказать вам о его великолепии и величии.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «его», вероятно, относится к небесному строению, о котором идёт речь; однако в видении великолепие самого места может намеренно сливаться с великолепием божественного присутствия.
    reason: alternative_reading
lexical_decisions:
- source_word: በኵሉ፡ ይፈደፍድ
  choice: во всём оно было непревзойдённым
  rationale: Сочетание передаёт превосходство во всех отношениях. Такая формулировка естественна по-русски и сохраняет значение степени, не прибавляя отсутствующего в тексте объекта сравнения.
- source_word: በስብሐት
  choice: по великолепию
  rationale: В контексте небесного видения слово обозначает явленное сияющее великолепие, а не словесную хвалу; «великолепие» также не сливается по смыслу со следующим «слава».
- source_word: በክብር
  choice: славе
  rationale: «Слава» передаёт зримую и царственную значимость и сохраняет традиционно возвышенный, но понятный регистр.
- source_word: በዕበይ
  choice: величию
  rationale: Слово выражает возвышенное величие или масштаб. Повтор «величие» во второй половине стиха сохранён вслед за источником.
- source_word: እስከ፡ ኢይክል
  choice: так что я не в силах
  rationale: Оборот выражает достигнутую степень и её следствие; «так что» естественно передаёт результат.
- source_word: ዜንዎተክሙ
  choice: рассказать вам
  rationale: 'Форма понимается как обращённое к множеству слушателей сообщение: говорящий не способен поведать им увиденное, а не как указание на неспособность их глаз смотреть.'
- source_word: በእንተ፡ ስብሐቲሁ፡ ወበእንተ፡ ዕበዩ
  choice: о его великолепии и величии
  rationale: Сохранены оба существительных и местоименный суффикс источника без замены его явно названным богословским референтом.
theological_decisions:
- issue: Референт местоименного суффикса в выражении «его великолепие и величие»
  choice: Сохранить местоимение «его», вероятнее всего относящееся к описываемому небесному строению.
  alternative: Понимать великолепие и величие как свойства божественного присутствия либо как намеренно слитое описание строения и Присутствующего.
  rationale: Источник не повторяет существительное и не называет Бога непосредственно. Местоименная передача сохраняет присущую видению неоднозначность и не вносит более определённого богословского толкования.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но общепонятной лексикой. Тройной ряд «великолепие, слава и величие» и повтор ключевых слов сохранены как черты торжественного визионерского стиля.
