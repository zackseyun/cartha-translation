base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/008.yaml
  text: 'And a vision showed me thus: behold[a], in the vision the clouds were calling me, and the mist was calling me; and the course of the stars and the lightnings were driving me and urging me on, and in the vision the winds were making me fly, and carrying me off[c][b], and lifting me upward into heaven.'
translation:
  language: ru
  text: 'И видение показало мне следующее[a]: вот, в видении облака звали меня, и туман звал меня; движение звёзд[b] и молнии гнали меня и торопили вперёд, а ветры[c] в видении заставляли меня лететь, уносили меня и поднимали ввысь, на небо.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный более буквальный перевод: «И так показало мне видение».'
    reason: Буквальная конструкция с ከመዝ («так», «таким образом») по-русски звучит менее естественно; сноска сохраняет её форму.
  - marker: b
    text: 'Или: «бег звёзд», «пути звёзд». Выражение изображает звёзды движущимися, а не неподвижными.'
    reason: Сочетание допускает несколько близких способов передать динамический образ.
  - marker: c
    text: Слово может также означать «духи», но в данном ряду атмосферных и небесных явлений вероятнее значение «ветры».
    reason: Сохранена лексическая и богословская неоднозначность исходного слова.
lexical_decisions:
- source_word: ራእይ
  choice: видение
  rationale: Обычное и точное обозначение апокалиптического видения; повтор слова сохранён, чтобы удержать рамку повествования.
- source_word: አስተአርአየኒ
  choice: показало мне
  rationale: Каузативная форма от глагола зрения передана естественным русским выражением без усиления до более богословски нагруженного «открыло».
- source_word: ደመናት
  choice: облака
  rationale: Передано основное значение слова без неоправданного усиления до «грозовых туч».
- source_word: ይጼውዑኒ / ይጼውዐኒ
  choice: звали меня / звал меня
  rationale: Сохранены повтор глагола и согласование с множественным «облака» и единственным «туман»; «звали» не превращает зов в формальный приказ.
- source_word: ጊሜ
  choice: туман
  rationale: Единственное число источника сохранено; слово естественно продолжает атмосферный ряд образов.
- source_word: ሩጸተ ከዋክብት
  choice: движение звёзд
  rationale: Сочетание обозначает звёзды в движении. «Движение» сохраняет смысл, не решая окончательно, имеется ли в виду бег, стремительное движение или небесный путь.
- source_word: መበርቅት
  choice: молнии
  rationale: Естественное русское множественное число сохраняет параллелизм с движущимися звёздами.
- source_word: ይንጐዑኒ
  choice: гнали меня
  rationale: Передаёт сильное внешнее побуждение и энергичность видения.
- source_word: ወተያድህቁኒ
  choice: торопили вперёд
  rationale: Передаёт усиление движения после «гнали», избегая бессодержательного повтора.
- source_word: ነፋሳት
  choice: ветры
  rationale: В окружении облаков, тумана и молний атмосферное значение наиболее вероятно; возможное значение «духи» отмечено в сноске.
- source_word: ያበርሩኒ
  choice: заставляли меня лететь
  rationale: Сохранено прямое указание на полёт, а не только на перенос или восхождение.
- source_word: ያንጉጹኒ
  choice: уносили меня
  rationale: Передаёт принудительное и стремительное перемещение, не усиливая его до «похищали».
- source_word: ወአነሥኡኒ፡ ላዕለ፡ ውስተ፡ ሰማይ
  choice: поднимали ввысь, на небо
  rationale: Формулировка сохраняет как направленность вверх, так и цель восхождения — небо.
theological_decisions:
- issue: Следует ли понимать ነፋሳት как «ветры» или как «духи»
  choice: ветры
  alternative: духи
  rationale: Ближайший контекст перечисляет атмосферные и небесные силы — облака, туман, звёзды и молнии. Поэтому «ветры» лучше сохраняет образ восхождения и не вводит в текст более определённую ангелологию, чем позволяет источник.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но ясным апокалиптическим звучанием. Синтаксический параллелизм и нарастающее движение исходного текста сохранены; архаизмы и конфессионально окрашенные уточнения не вводились.
