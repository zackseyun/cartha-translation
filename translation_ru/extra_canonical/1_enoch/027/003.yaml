base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/003.yaml
  text: In the latter days this will become for them a spectacle of righteous judgment in the presence of the righteous forever[a]; all the days here the wise will bless the Lord of glory[d][c][b], the eternal King.
translation:
  language: ru
  text: В последние дни это станет для них зрелищем праведного суда перед праведниками навеки[a]; здесь во все дни милосердные будут благословлять Господа славы, вечного Царя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «навеки», в данном текстовом свидетеле заключено в скобки и потому текстуально не вполне надёжно. Неясно также, следует ли связывать его с выражением «перед праведниками».
    reason: textual_variant
lexical_decisions:
- source_word: በዳኃሪ መዋዕል
  choice: В последние дни
  rationale: Сохраняет эсхатологический временной оттенок исходного выражения и возвышенный апокалиптический регистр.
- source_word: ይከውን ላዕሌሆሙ
  choice: это станет для них
  rationale: Передаёт будущее становление и реляционное значение предлога, не сужая его до пространственного «над ними».
- source_word: አርአያ
  choice: зрелищем
  rationale: Слово допускает значения видимого явления, знака и примера; «зрелище» сохраняет публичный и наглядный характер суда.
- source_word: ኵነኔ ዘበ ጽድቅ
  choice: праведного суда
  rationale: Кратко передаёт суд, характеризуемый праведностью или справедливостью.
- source_word: በቅድመ ጻድቃን
  choice: перед праведниками
  rationale: Сохраняет пространственно-публичный смысл выражения и его естественное звучание по-русски.
- source_word: '[ለዓለም]'
  choice: навеки
  rationale: Естественно передаёт длительность, при этом скобки в свидетеле требуют примечания о текстовой неуверенности.
- source_word: ኵሎ መዋዕለ ዝየ
  choice: во все дни здесь
  rationale: Передаёт ዝየ как пространственное «здесь», не вводя неподтверждённое понятие «нынешнего века».
- source_word: ምሑራን
  choice: мудрые
  rationale: В данном контексте принято как обозначение наставленных или мудрых; возможная морфологическая связь с милостью остаётся предметом лексического спора, поэтому перевод не расширяется толкованием.
- source_word: ለእግዚአ ስብሐት
  choice: Господа славы
  rationale: Прямо и возвышенно передаёт составной божественный титул без гармонизации с иной формулой.
- source_word: ንጉሥ ዘለዓለም
  choice: вечного Царя
  rationale: Естественный русский эквивалент титула, сохраняющий вечность и царское достоинство.
theological_decisions:
- issue: Передача составных божественных титулов
  choice: Господа славы, вечного Царя
  alternative: Господа величия, Царя навеки
  rationale: Сохраняются оба титула и их приложение без привнесения поздней конфессиональной формулы.
- issue: Связь текстуально неуверенного «навеки»
  choice: отнесено к зрелищу суда перед праведниками
  alternative: отнести к последующей хвале
  rationale: Порядок слов скорее поддерживает связь с предшествующей фразой, но неопределённость рукописного чтения открыто отмечена.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксическая напряжённость «во все дни здесь» сохранена ради пространственного значения ዝየ и во избежание смыслового добавления «этого века».
