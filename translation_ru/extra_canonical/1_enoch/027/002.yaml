  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/002.yaml
  text: At that time Uriel[a], one of the holy angels who was with me, answered me and said to me, “This accursed valley is for those who are accursed forever. Here all those will be gathered who speak with their mouths improper words against the Lord, and who utter harsh things concerning his glory. Here they will be gathered[b], and here will be their place of judgment.”
translation:
  language: ru
  text: 'Тогда Уриил, один из святых ангелов, находившийся со мной, ответил мне и сказал: «Эта проклятая долина предназначена для проклятых навеки. Здесь будут собраны все, кто своими устами произносит против Господа неподобающие слова[a] и говорит дерзости[b] о Его славе. Здесь их соберут, и здесь будет место их суда».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «неуместные слова», «слова, которых не должно говорить». Эфиопское выражение обозначает речь, которая не подобает перед Господом.'
    reason: lexical_alternative
  - marker: b
    text: Буквальный смысл допускает оттенки тяжёлой, возмутительной, поразительно дерзкой речи о славе Господа.
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ
  choice: ответил мне
  rationale: Передаёт обычное значение глагола и сохраняет характер продолжающегося диалога в видении.
- source_word: ቅዱሳን መላእክት
  choice: святых ангелов
  rationale: Естественное и устойчивое обозначение небесных существ в русском библейском регистре.
- source_word: ዛቈላ
  choice: долина
  rationale: Соответствует топографии сцены суда, не сужая значение до оврага или ущелья.
- source_word: ርጉምት
  choice: проклятая
  rationale: Указывает, что место находится под проклятием, и сохраняет торжественный судебный тон.
- source_word: ለርጉማን እስከ ለዓለም
  choice: для проклятых навеки
  rationale: Передаёт как предназначение долины, так и непреходящий характер проклятия.
- source_word: ይትጋብኡ
  choice: будут собраны
  rationale: Пассивная форма естественно передаёт собирание виновных для суда.
- source_word: በአፉሆሙ
  choice: своими устами
  rationale: Сохраняет конкретный образ уст как орудия виновной речи.
- source_word: ላዕለ እግዚአብሔር
  choice: против Господа
  rationale: В контексте враждебной речи предлог имеет направленное, противительное значение.
- source_word: ቃለ ዘኢይደሉ
  choice: неподобающие слова
  rationale: Передаёт речь, которая неуместна или не должна произноситься, не уточняя состав проступка сверх исходного текста.
- source_word: ስብሐቲ ዚአሁ
  choice: Его славе
  rationale: «Слава» наиболее прозрачно передаёт величие Господа как предмет нечестивой речи.
- source_word: ይትናገሩ ዕፁብተ
  choice: говорит дерзкое
  rationale: Передаёт тяжёлую, возмутительную и вызывающую речь; субстантивированное «дерзкое» естественно по-русски и оставляет выражение достаточно широким.
- source_word: ያስተጋብእዎሙ
  choice: их соберут
  rationale: 'Сохраняет каузативный оттенок формы: виновных приведут и соберут в этом месте.'
- source_word: ምኵናኒሆሙ
  choice: место их суда
  rationale: В сочетании с повторным «здесь» выражает локализованный судебный исход, не отождествляя долину с самим приговором.
theological_decisions:
- issue: Характер осуждаемой речи
  choice: Враждебная и неподобающая речь против Господа, а также дерзкая речь о Его славе.
  alternative: Технически определённое богохульство либо вообще всякая нечестивая речь.
  rationale: Исходный текст описывает проступок своими широкими оценочными выражениями; перевод не вводит более позднюю юридическую или догматическую категорию.
- issue: Смысл заключительной фразы о суде
  choice: Долина является местом, где проклятых соберут и где совершится их суд.
  alternative: Сама долина является их осуждением либо речь идёт только об отвлечённом понятии суда.
  rationale: Дважды повторённое «здесь» подчёркивает пространственную сторону видения, тогда как существительное сохраняет судебный смысл.
- issue: Залог в повторном упоминании собирания
  choice: Первое выражение передано пассивно, второе — неопределённо-личной активной конструкцией.
  alternative: 'Оба выражения передать одинаково пассивно: «будут собраны».'
  rationale: Так сохраняется различие между исходной пассивной/возвратной формой ይትጋብኡ и каузативной формой ያስተጋብእዎሙ без указания не названного в тексте деятеля.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксическая формула «ответил мне и сказал» сохранена из-за её повествовательной функции и близости к исходному тексту. Местоимение «Его» написано с прописной буквы как обычная русская религиозно-издательская конвенция, без внесения дополнительного толкования.
