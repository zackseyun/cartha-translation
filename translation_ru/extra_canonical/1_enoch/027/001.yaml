base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/001.yaml
  text: At that time I said[a], “For what reason is this blessed land, all of it full of trees[b], and this accursed valley in their midst?”
translation:
  language: ru
  text: 'Тогда я сказал: «Почему эта земля благословенна и вся она полна деревьев, а эта долина посреди них проклята?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውእቱ ጊዜ
  choice: Тогда
  rationale: Естественно передаёт повествовательную временную формулу, сохраняя торжественный тон видения.
- source_word: እቤ
  choice: я сказал
  rationale: Форма буквально вводит речь Еноха; вопросительный характер передаётся последующей прямой речью без замены на «спросил».
- source_word: በእንተ ምንት
  choice: Почему
  rationale: Кратко и естественно выражает вопрос о причине или основании, не уточняя сверх источника, идёт ли речь исключительно о причине или цели.
- source_word: ዛቲ ምድር ቡርክት
  choice: эта земля благословенна
  rationale: «Земля» соответствует локальному пространству видения, а «благословенна» сохраняет религиозно-оценочный смысл и противопоставление последующему «проклята».
- source_word: ወኵለንታሃ ምልእት ዕፀወ
  choice: и вся она полна деревьев
  rationale: Сохранены соединительный союз, значение полноты и образ земли, покрытой деревьями; русская конструкция остаётся ясной и естественной.
- source_word: ወዛ ቈላ ርጉምት
  choice: а эта долина … проклята
  rationale: Противительный союз «а» естественно выявляет заложенный в контексте контраст между благословенной землёй и проклятой долиной, не добавляя нового содержания.
- source_word: ማእከሎሙ
  choice: посреди них
  rationale: Сохраняет пространственный образ долины, находящейся среди деревьев или внутри описанного ландшафта, не устраняя неоднозначность местоименного соотнесения.
theological_decisions:
- issue: Противопоставление благословенной земли и проклятой долины
  choice: «благословенна» / «проклята»
  alternative: «плодородна» / «бесплодна»
  rationale: Источник выражает не только свойства ландшафта, но и сакрально-судебную оценку. Выбранные слова сохраняют апокалиптическое напряжение и не сводят его к земледельческому описанию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис сделан естественным для прямого вопроса; двусмысленность выражения «посреди них» сохранена.
