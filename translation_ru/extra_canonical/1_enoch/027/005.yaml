  source_fidelity: 'Основной текст не должен сохранять «говорил» без дополнения как исходное чтение. Хотя в машинной транскрипции стоит затруднительное ተሎቱ, указанное в аудиторском следе сопоставление со стандартным чтением Charles и греческой традицией обоснованно указывает на ወስብሐቲሁ: «и [его] славу я возвестил». Поэтому неопределённость, перенесённая в сноску, здесь создаётся дефектной OCR-транскрипцией, а не должна считаться неопределённостью переводимого текста.'
