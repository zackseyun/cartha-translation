translation:
  language: ru
  text: В то время я благословил Господа славы, возвестил Его славу и воспел хвалу, как подобает Его величию.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውእቱ፡ ጊዜ
  choice: В то время
  rationale: Передаёт обычное временное выражение и сохраняет повествовательный переход без излишней архаичности.
- source_word: ባረክዎ
  choice: я благословил
  rationale: Сохраняет прямое значение глагола «благословлять», не смешивая его с последующим пением хвалы.
- source_word: ለእግዚአ፡ ስብሐት
  choice: Господа славы
  rationale: 'Естественно передаёт возвышенный Божий титул: እግዚአ — «Господь, владыка», ስብሐት — «слава, великолепие, хвала».'
- source_word: ተሎቱ፡ ነገርኩ
  choice: говорил
  rationale: В представленном свидетеле сочетание текстуально и лексически затруднительно. Основной текст не добавляет объекта, которого нельзя уверенно установить, и сохраняет самостоятельный глагол речи.
- source_word: ዘመርኩ
  choice: пел хвалу
  rationale: Передаёт пение или песнопение в явно богослужебном контексте; добавление «хвалу» естественно раскрывает смысл, не вводя конфессиональной специфики.
- source_word: በከመ፡ ይደሉ፡ ለዕበዩ
  choice: как подобает Его величию
  rationale: Естественная русская формула, сохраняющая значение уместности или достойности и возвышенное понятие Божьего величия.
theological_decisions:
- issue: Передача Божьего титула እግዚአ
  choice: Господь
  alternative: Владыка
  rationale: В славословии «Господь» является естественным и общеупотребительным русским Божьим титулом; «Владыка» возможно лексически, но здесь звучало бы более маркированно.
- issue: Неясный объект при глаголе речи
  choice: Не восполнять объект в основном тексте
  alternative: «возвещал Его славу» или «говорил о Нём»
  rationale: Предоставленный эфиопский текст затруднителен, а сведения о чтении расходятся. Нейтральное «говорил» сохраняет засвидетельствованную неопределённость и не разрешает её богословски или текстологически без достаточных оснований.
