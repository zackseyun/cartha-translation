  text: In the days of their judgment they will bless him for the mercy[b][a], according as he has apportioned to them.
translation:
  language: ru
  text: В дни суда над ними они будут благословлять его за милость[a], сообразно с тем, что он им уделил[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен также перевод: «в милости», «с милостью» или «за проявленное милосердие».'
    reason: lexical_alternative
  - marker: b
    text: 'В последней части не сказано прямо, что именно он им уделил: речь может идти об отмеренной им доле, жребии либо мере милости или благословения.'
    reason: implicit_object
lexical_decisions:
- source_word: መዋዕለ
  choice: дни
  rationale: Множественное временное существительное передано буквально как «дни», чтобы сохранить апокалиптическое обозначение периода.
- source_word: ኵነኔሆሙ
  choice: суда над ними
  rationale: Слово обозначает судебное решение или суд; более широкое «суд» не сужает смысл до осуждения либо наказания. Оборот «над ними» естественно передаёт местоименный суффикс в данном контексте.
- source_word: ይባርክዎ
  choice: они будут благословлять его
  rationale: 'Форма имеет субъект в 3-м лице множественного числа и объектный суффикс 3-го лица мужского рода единственного числа: «они будут благословлять его». Это учитывает морфологию формы и исправляет прежнее прочтение «он благословит их».'
- source_word: በምሕረት
  choice: за милость
  rationale: Предлог с существительным допускает обстоятельственное или причинное понимание; при чтении «они будут благословлять его» по-русски естественно сказать «за милость», сохранив само существительное и его богословскую весомость.
- source_word: በከመ
  choice: сообразно с тем
  rationale: Сравнительно-модальный союз выражает соответствие меры или образа действия; этот оборот сохраняет связь со следующим распределением.
- source_word: ከፈሎሙ
  choice: он им уделил
  rationale: Глагол означает делить, назначать или выделять долю. Дополнение в оригинале не выражено, поэтому перевод также не называет прямо, что именно было уделено.
theological_decisions:
- issue: Обозначает ли ኵነኔ суд вообще или именно осуждение и наказание
  choice: суд над ними
  alternative: их осуждение / их наказание
  rationale: Широкое судебное значение сохраняет возможность благоприятного исхода, согласующегося с упоминанием милости, и не разрешает богословское напряжение за текст.
- issue: Кто благословляет кого в ይባርክዎ
  choice: они будут благословлять его
  alternative: он благословит их
  rationale: Лицо и число субъекта, а также объектный суффикс поддерживают чтение «они — его». Альтернативное чтение отражено лишь как прежняя традиция перевода, а не поставлено наравне с более сильным морфологическим свидетельством.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис остаётся достаточно близким к геэзскому оригиналу, но морфологически исправлен субъект и объект глагола. Местоимение «его» не капитализировано, поскольку сам стих выражает его местоименно; отождествление определяется контекстом.
