  yaml_path: translation/extra_canonical/1_enoch/028/001.yaml
  text: And from there I went on a journey..[a][b].
translation:
  language: ru
  text: Оттуда я пошёл на восток, в глубь пустынных гор, и увидел пустыню — безлюдную и уединённую, но полную деревьев этого рода.[a] Сверху там била вода, и виднелся обильный поток, устремлявшийся на север и на запад.[b] Со всех сторон оттуда поднимались вода и роса.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «деревьев от этого семени»; возможно также: «деревьев этого вида».'
    reason: lexical_ambiguity
  - marker: b
    text: 'Или: «на северо-запад». В источнике буквально названы два направления: «к северу, к западу».'
    reason: directional_ambiguity
  - marker: c
    text: 'В некоторых старых переводах: «облака и роса», однако в данном эфиопском тексте стоит «вода и роса». Синтаксис заключительной фразы допускает также понимание: «и отовсюду поднимались вода и роса».'
    reason: textual_and_syntactic_ambiguity
lexical_decisions:
- source_word: መንገለ፡ ጽባሕ
  choice: на восток
  rationale: መንገለ выражает направление, а ጽባሕ здесь обозначает восток; полный источник устраняет мнимую незавершённость сокращённого английского слоя.
- source_word: ማእከላ፡ ለደብረ፡ መድበራ
  choice: в глубь пустынных гор
  rationale: Буквальная конструкция говорит о середине горы/горной области пустыни. Русское «в глубь пустынных гор» естественно передаёт движение внутрь горной пустынной местности, не сводя её к одной определённой вершине.
- source_word: ገዳመ፡ ባሕቲቶ፡ ወባሕቱ
  choice: пустыню — безлюдную и уединённую
  rationale: Сочетание усиливает образ отдельного, одинокого пустынного места. Два русских определения сохраняют эмфатическое удвоение источника.
- source_word: ምሉእ፡ ዕፀወ፡ እምነ፡ ዝንቱ፡ ዘርዕ
  choice: полную деревьев этого рода
  rationale: Конструкция связывает деревья с «этим семенем/родом». «Этого рода» передаёт классифицирующий смысл ዘርዕ без неестественного русского «из этого семени».
- source_word: ወማይ፡ ይፈለፍል፡ በላዕሉ
  choice: Сверху там била вода
  rationale: Глагол обозначает выход или излияние воды; «била вода» естественно описывает источник, сохраняющий направление сверху.
- source_word: አስራብ፡ ከመ፡ ብዙኅ፡ ዘይሰርብ
  choice: обильный поток
  rationale: Контекст описывает мощное течение или водоток. Сжатое русское выражение передаёт обилие и движение воды, не перегружая не вполне прозрачную эфиопскую конструкцию.
- source_word: መንገለ፡ መስዕ፡ መንገለ፡ ዐረብ
  choice: на север и на запад
  rationale: Источник называет два направления раздельно. Перевод сохраняет оба, не превращая их без пояснения в единое направление «на северо-запад».
- source_word: ማይ፡ ወጠል
  choice: вода и роса
  rationale: Переданы прямые значения двух существительных; «облака» не вводятся, хотя встречаются в старых переводах.
