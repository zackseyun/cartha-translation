translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного видения. Сохранены повторность описания пустыни, необычный образ воды и росы, а также раздельно названные направления. Английский консультационный слой не использован как базовый, поскольку он отражает прежнее усечение стиха.
