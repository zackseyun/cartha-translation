base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/008.yaml
  text: And the Lord of Spirits seated the Chosen One on the throne of glory[a], and he will judge all the works of the holy ones in the height of heaven[d][c][b], and he will weigh their deeds in the balance.
translation:
  language: ru
  text: И Господь духов посадил Избранного[a] на престол славы, и он будет судить все дела святых[b] в вышине неба и взвешивать их поступки на весах[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Избранника». Эфиопское ኅሩይ обозначает избранного и здесь употреблено как титул определённой фигуры.'
    reason: lexical_alternative
  - marker: b
    text: «Святые» могут означать святую общину, небесных святых существ или охватывать обе группы; эфиопский текст не требует более узкого понимания.
    reason: alternative_reading
  - marker: c
    text: 'Буквальный образ взвешивания на весах выражает судебную оценку поступков. Эфиопский глагол стоит в активной форме: «он будет взвешивать».'
    reason: cultural_and_grammar_note
lexical_decisions:
- source_word: እግዚአ፡ መናፍስት
  choice: Господь духов
  rationale: Сохраняет устойчивый возвышенный титул Книги Еноха и конструкцию принадлежности, не заменяя «Господа» менее традиционным «Владыкой».
- source_word: መንበረ፡ ስብሐት
  choice: престол славы
  rationale: Передаёт конкретный образ воцарения и естественно соответствует библейскому возвышенному регистру.
- source_word: አንበረ፡ ለኅሩይ
  choice: посадил Избранного
  rationale: Каузативное значение глагола передано естественным русским «посадил», а ኅሩይ — как титул определённой избранной фигуры.
- source_word: ይኴንን
  choice: он будет судить
  rationale: Будущее время и судебное значение глагола сохранены; местоимение не устраняет полностью формальную неоднозначность отнесения подлежащего.
- source_word: ኵሎ፡ ግብሮሙ
  choice: все дела
  rationale: «Дела» естественно передаёт совокупность совершённого и позволяет отличить это слово от последующего ምግባሮሙ.
- source_word: ለቅዱሳን
  choice: святых
  rationale: Субстантивированное «святые» сохраняет возможность понимать выражение как людей, небесных существ или обе группы, не уточняя референта.
- source_word: በመልዕልተ፡ ሰማይ
  choice: в вышине неба
  rationale: Сохраняет пространственный образ возвышенной небесной области без усиления до «высшего неба».
- source_word: በመዳልው፡ ይደሉ፡ ምግባሮሙ
  choice: взвешивать их поступки на весах
  rationale: Активная форма ይደሉ передана активным глаголом, а образ весов как орудия судебной оценки сохранён. «Поступки» отличают второе обозначение поведения от более раннего «дела».
theological_decisions:
- issue: Кого обозначает ለቅዱሳን («святые»)
  choice: Сохранить общее обозначение «святые» без уточнения их природы
  alternative: «праведники», «святые ангелы» или «небесные существа»
  rationale: Сам стих не требует ограничивать выражение праведными людьми либо небесными существами; более узкий перевод преждевременно разрешил бы неоднозначность.
- issue: Статус ኅሩይ
  choice: Передать как титул «Избранный»
  alternative: «избранник» или «один избранный»
  rationale: Контекст воцарения и суда указывает на определённую возвышенную фигуру, поэтому прописная буква и титульное употребление оправданы.
- issue: Подлежащее глаголов суда и взвешивания
  choice: Использовать местоимение «он»
  alternative: Явно назвать «Избранный» либо «Господь духов»
  rationale: Мужское единственное число в исходном тексте допускает грамматическое соотнесение с обеими названными фигурами, хотя ближайший контекст естественно указывает на Избранного. Местоимение сохраняет эту формальную напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным апокалиптическим звучанием. Синтаксис сохраняет единую протяжённую структуру исходного стиха; архаизмы и конфессионально нагруженные уточнения исключены.
