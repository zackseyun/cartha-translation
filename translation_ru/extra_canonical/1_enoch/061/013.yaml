base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/013.yaml
  text: For abundant is the mercy of the Lord of Spirits[a], and he is slow to anger[c][b]; and all his works and all the measure of what he has made he has revealed to the righteous and the chosen in the name of the Lord of Spirits.
translation:
  language: ru
  text: Ибо велика милость Господа духов, и Он не скор на гнев[c]; все Свои дела и всю меру того, что Он сотворил[a], Он открыл праведным и избранным во имя Господа духов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «и всякую меру того, что Он сделал (или сотворил)». Фраза на геэзе трудна и может указывать на установленную меру, протяжённость или упорядоченность Божьих дел.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «во имя Господа духов» может указывать на власть, призывание имени или сферу, в которой совершается это откровение.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально возможно: «и Его гнев далёк».'
    reason: previous_rendering
lexical_decisions:
- source_word: ብዙኅ ምሕረቱ
  choice: велика милость
  rationale: Передаёт полноту и изобилие Божьей милости естественным возвышенным русским оборотом, не сводя её лишь к чувству сострадания.
- source_word: ለእግዚአ መናፍስት
  choice: Господа духов
  rationale: Сохраняет устойчивый апокалиптический титул Бога в 1 Енохе.
- source_word: ወርሑቅ መዓት
  choice: и Он не скор на гнев
  rationale: Естественно передаёт семитский богословский оборот о медлительности Бога на гнев; буквальная образность сохранена в примечании.
- source_word: ወኵሉ ግብሩ
  choice: все Свои дела
  rationale: Охватывает Божьи действия и творения шире, чем более узкое «поступки».
- source_word: ወኵሉ እምጣነ ገብረ
  choice: всю меру того, что Он сотворил
  rationale: Сохраняет трудную и намеренно не разглаженную формулировку о мере, устройстве или протяжённости сотворённого.
- source_word: ከሠተ
  choice: Он открыл
  rationale: Подходит контексту откровения скрытых небесных истин и звучит естественно по-русски.
- source_word: ለጻድቃን ወለኅሩያን
  choice: праведным и избранным
  rationale: Передаёт две названные группы без привнесения поздней конфессиональной терминологии.
- source_word: በስሙ
  choice: во имя
  rationale: Прямо сохраняет формулу, не уточняя однозначно, означает ли она власть, призывание имени или сферу действия.
theological_decisions:
- issue: Смысл выражения о гневе
  choice: Бог не скор на гнев
  alternative: Его гнев далёк
  rationale: Контекст противопоставляет обильную милость и отсроченный гнев; перевод сохраняет библейскую идиому, а примечание — буквальную возможность, не отрицая будущего суда.
- issue: Смысл «меры» сотворённого
  choice: Сохранить выражение «всю меру того, что Он сотворил»
  alternative: Всё устройство сотворённого Им / всё, что Он определил
  rationale: Геэзская фраза неоднозначна и может обозначать меру, протяжённость или упорядоченность Божьих дел, поэтому прозрачный перевод предпочтительнее истолковывающего парафраза.
- issue: Значение формулы «во имя Господа духов»
  choice: Оставить формулу без поясняющего расширения в основном тексте
  alternative: Властью Господа духов / через имя Господа духов
  rationale: Источник допускает несколько смысловых оттенков; перевод не должен выбирать один из них без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, апокалиптическим звучанием. Синтаксис остаётся близким к источнику, однако читается естественно; трудная фраза о «мере» не подвергнута конфессионально окрашенному истолкованию.
