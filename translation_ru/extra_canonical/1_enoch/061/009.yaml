base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/009.yaml
  text: And when he lifts up his face to judge their hidden ways by the word of the name of the Lord of Spirits[a], and their conduct by the path of righteousness of the Lord of Spirits, then all of them will speak with one voice[d][c][b], and they will bless and praise and exalt and sanctify the name of the Lord of Spirits.
translation:
  language: ru
  text: И когда он поднимет лицо, чтобы словом имени Господа духов[a] судить их сокрытые пути, а путём праведности Господа духов — их следы[b], тогда все они заговорят в один голос и будут благословлять, восхвалять, превозносить и освящать имя Господа духов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «словом имени Господа духов». Трудное выражение может указывать на речённое слово, повеление или власть, связанную с Божьим именем.'
    reason: alternative_reading
  - marker: b
    text: '«Их следы» — то есть оставленный их жизнью след, их поведение. Возможный смысл всей фразы: он будет судить их поступки по пути праведности Господа духов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ያሌዕል ገጾ
  choice: он поднимет лицо
  rationale: Сохранён буквальный телесный образ, выражающий начало властного судебного действия; более отвлечённое «явится» устранило бы образность оригинала.
- source_word: ይኰንን
  choice: судить
  rationale: В контексте сокрытых путей глагол имеет прежде всего судебный смысл, но перевод не сужает его до осуждения.
- source_word: ፍኖቶሙ እንተ ኅቡእ
  choice: их сокрытые пути
  rationale: «Пути» сохраняет нравственную метафору жизненного поведения, а «сокрытые» передаёт то, что прежде оставалось незримым.
- source_word: በነገረ ስሙ
  choice: словом имени
  rationale: Формально близкий перевод намеренно сохраняет трудность конструкции и связь слова с властью божественного имени.
- source_word: ወአሰረ ዚአሆሙ
  choice: и их следы
  rationale: Форма понята как именная группа «их следы/шаги», параллельный объект глагола «судить», а не как глагол «он ставит их».
- source_word: በፍኖተ ጽድቅ
  choice: путём праведности
  rationale: Сохранены инструментальный оборот и характерная нравственно-апокалиптическая метафора пути.
- source_word: በ፩ቃል
  choice: в один голос
  rationale: Естественное русское выражение точно передаёт единогласное славословие; буквально — «одним словом/голосом».
- source_word: ይባርኩ ወይሴብሑ ወያሌዕሉ ወይቄድሱ
  choice: будут благословлять, восхвалять, превозносить и освящать
  rationale: Четырёхчастная формула сохранена без сокращения; «освящать имя» передаёт культовую силу последнего глагола.
- source_word: እግዚአ መናፍስት
  choice: Господь духов
  rationale: Устойчивый отличительный божественный титул Первой книги Еноха.
theological_decisions:
- issue: Кто является субъектом глаголов единственного числа
  choice: Сохранено местоимение «он» без пояснения личности.
  alternative: Господь духов; Избранный/Сын Человеческий.
  rationale: В самом стихе субъект прямо не назван, поэтому перевод не разрешает контекстуальную и богословскую неоднозначность.
- issue: Смысл выражения «словом имени Господа духов»
  choice: Сохранена прозрачная, формально близкая инструментальная конструкция.
  alternative: По повелению Господа духов; властью имени Господа духов; через возвещение имени.
  rationale: Синтаксис геэзской фразы труден и допускает оттенки речения, повеления и власти имени; конкретизация создала бы ложную определённость.
- issue: Синтаксическая роль ወአሰረ ዚአሆሙ
  choice: «И их следы» понимается как второй объект глагола «судить».
  alternative: «И он направит/утвердит их на пути праведности».
  rationale: Разбор как существительного «след, шаг» с притяжательным выражением лучше соответствует форме текста и параллелизму с «их сокрытыми путями».
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Сохранены повтор титула «Господь духов», метафоры пути и следа, а также четырёхчастная формула славословия; синтаксис слегка упорядочен для ясности, но трудные места не сглажены интерпретирующим пересказом.
