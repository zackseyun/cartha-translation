base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/003.yaml
  text: And the angel who went with me said to me[a], “These are the measures of the righteous and the cords of the righteous; they will come to the righteous[d][c][b], so that they may rely on the name of the Lord of Spirits forever and ever.”
translation:
  language: ru
  text: 'И сказал мне ангел, который шёл со мной: «Это меры[a] праведных и верви[b] праведных; они придут[c] к праведным, чтобы те опирались[d] на имя Господа духов во веки веков».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «мерила». Эфиопская форма означает меры или средства измерения; это не выражение «из изобилия».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «шнуры» или «связи». По контексту речь, вероятно, идёт о вервях для измерения.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «приходят». Эфиопская глагольная форма допускает настоящее либо будущее значение, но не означает «пришли».'
    reason: tense_aspect_ambiguity
  - marker: d
    text: 'Или: «находили поддержку», «укреплялись» либо «полагались». Точный оттенок глагола остаётся открытым.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ዘምስሌየ የሐውር
  choice: который шёл со мной
  rationale: Передаёт относительную конструкцию с глаголом хождения и сохраняет характерный образ сопровождающего Еноха ангела.
- source_word: እሉ እሙንቱ
  choice: это
  rationale: Указательное выражение отсылает к только что увиденному и вводит его истолкование ангелом.
- source_word: እምጣነ ጻድቃን
  choice: меры праведных
  rationale: Форма понимается как множественное число в сопряжённом состоянии от существительного со значением «мера», а не как предлог «из/от» со словом «изобилие».
- source_word: ማእሰረ ጻድቃን
  choice: мерные верви праведных
  rationale: Существительное обозначает вервь, шнур или связку; «мерные верви» естественно связывает выражение с образом измерения в ближайшем контексте, не превращая его в «хранилища».
- source_word: ይመጽኡ ለጻድቃን
  choice: они придут к праведным
  rationale: Имперфект передан будущим временем, а дательный элемент — направлением к праведным.
- source_word: ከመ ይትመረጐዙ
  choice: чтобы те опирались
  rationale: Форма выражает обретение опоры или поддержки; местоимение «те» указывает на праведных как наиболее вероятный субъект, тогда как примечание сохраняет смысловую широту глагола.
- source_word: ስሙ ለእግዚአ መናፍስት
  choice: имя Господа духов
  rationale: Сохранён устойчивый енохический титул без добавления отсутствующего в тексте определённого артикля.
- source_word: ለዓለመ ዓለም
  choice: во веки веков
  rationale: Традиционная и понятная русская передача формулы непреходящей длительности, соответствующая возвышенному регистру текста.
theological_decisions:
- issue: Назначение мер и вервей праведных
  choice: Они придут к праведным, чтобы праведные обрели опору в имени Господа духов.
  alternative: 'Заключительный глагол можно понимать сильнее: чтобы праведные были поддержаны или укреплены именем Господа духов.'
  rationale: Перевод сохраняет направленность небесных средств к праведным и зависимость праведных от Божьего имени, но не сводит многозначный глагол исключительно к внутреннему доверию.
- issue: Референт подлежащего в целевой придаточной части
  choice: «те» относится к праведным.
  alternative: При строго формальном чтении ближайшим грамматическим предшественником могут показаться меры и верви.
  rationale: Одушевлённое действие опоры на Божье имя естественнее относится к праведным; местоимение делает русский текст понятным, а богословский смысл не расширяется сверх контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Архаизирующая формула «во веки веков» сохранена как общеупотребительная в религиозной литературе; в остальном синтаксис и лексика остаются доступными современному читателю.
