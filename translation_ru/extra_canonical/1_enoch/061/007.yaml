base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/007.yaml
  text: And to him belongs the first word[a]; they shall bless and exalt and praise with wisdom[c][b], and they shall be wise in speech and in the spirit of life.
translation:
  language: ru
  text: И ему принадлежит первое слово[a]; они будут благословлять, превозносить и восхвалять с мудростью, и будут мудры в речи и в духе жизни[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «начало речи».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в дыхании жизни». Последнее выражение допускает значения как «дух», так и «дыхание».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወለዉእቱ፡ መቅድመ፡ ቃለ
  choice: И Ему принадлежит первое слово
  rationale: Конструкция ወለዉእቱ означает «и Ему», а መቅድመ ቃለ образует сочетание со значением «первое слово» или «начало речи». Перевод сохраняет синтаксис принадлежности и не принимает መቅድመ за предлог «перед».
- source_word: ይባርኩ
  choice: будут благословлять
  rationale: Передаёт будущее действие и сохраняет богослужебно-хвалебный смысл глагола.
- source_word: ያሌዕሉ
  choice: превозносить
  rationale: Глагол обозначает возвышение или прославление; «превозносить» естественно входит в ряд славословия.
- source_word: ይሴብሑ
  choice: восхвалять
  rationale: Прямо передаёт доксологическое значение и образует естественную русскую триаду с «благословлять» и «превозносить».
- source_word: በጥበብ
  choice: с мудростью
  rationale: Сохраняет существительное «мудрость» и допускает отнесение обстоятельства ко всему ряду хвалебных действий.
- source_word: ይጠብቡ
  choice: будут мудры
  rationale: Сохраняет лексическую связь с предшествующим словом «мудрость», не сводя выражение только к манере действия.
- source_word: በነገር
  choice: в речи
  rationale: В данном параллельном обороте слово вероятнее обозначает речь или высказывание. «В речи» также позволяет отличить его от ቃለ, переведённого выше как «слово».
- source_word: መንፈሰ፡ ሕይወት
  choice: в духе жизни
  rationale: Формально передаёт сочетание «дух/дыхание жизни» и сохраняет его возвышенное апокалиптическое звучание без добавления идеи «животворящий».
theological_decisions:
- issue: Означает ли መንፈሰ ሕይወት «дух жизни» или более конкретно «дыхание жизни»
  choice: дух жизни
  alternative: дыхание жизни
  rationale: Небесный контекст хвалы допускает духовный смысл, однако исходное слово охватывает также дыхание; поэтому основное чтение дано в тексте, а реальная неоднозначность отмечена в сноске.
- issue: Следует ли понимать መቅድመ ቃለ как «первое слово» или «начало речи»
  choice: первое слово
  alternative: начало речи
  rationale: Оба понимания отражают конструкцию исходного текста. «Первое слово» естественнее по-русски и ближе к буквальному составу выражения, тогда как альтернативное чтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для апокалиптического славословия. Синтаксический параллелизм сохранён; архаизмы и конфессионально окрашенные уточнения не добавлены. Прописное «Ему» указывает на почтительное местоименное обозначение небесной фигуры из контекста, не конкретизируя её сверх исходного текста.
