base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/011.yaml
  text: On that day they shall raise one voice[a], and they shall bless and praise and exalt in the spirit of faith, and in the spirit of wisdom, and in the spirit of patience, and in the spirit of mercy, and in the spirit of righteousness and peace, and in the spirit of goodness; and all of them shall say with one voice, ‘Blessed be he[e][d][c][b], and blessed be the name of the Lord of Spirits forever and ever.’
translation:
  language: ru
  text: 'В тот день они возвысят единый голос и будут благословлять, восхвалять и превозносить в духе[a][b] веры, в духе мудрости, в духе терпения, в духе милосердия, в духе праведности и мира и в духе доброты[c]. И все они в один голос скажут: «Благословен Он, и да будет благословенно имя Господа духов во веки веков».[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в духе верности»; геэзское слово может обозначать как веру, так и верность.'
    reason: lexical_alternative
  - marker: b
    text: Повторённое выражение «в духе…» может указывать на внутренний настрой хвалы, на дарованные свыше качества или на более олицетворённые небесные силы.
    reason: alternative_reading
  - marker: c
    text: 'Или: «благости», «благожелательности»; значение геэзского слова достаточно широкое.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально первая часть не содержит местоимения: «Благословен»; «Он» добавлено по смыслу. Первая форма является утверждением, а вторая — пожеланием: «да будет благословенно».'
    reason: grammar_and_clarity
lexical_decisions:
- source_word: ይነሥኡ አሐደ ቃለ
  choice: возвысят единый голос
  rationale: Сочетание глагола «поднимать, возносить» с ቃል («голос, слово») означает совместно возвысить голос; буквенный образ и торжественный литургический оттенок сохранены.
- source_word: ወይባርኩ ወይሴብሑ ወያሌዕሉ
  choice: будут благословлять, восхвалять и превозносить
  rationale: Три накопительных глагола переданы раздельно, чтобы сохранить ритм и нарастание хвалы.
- source_word: በመንፈሰ ሃይማኖት
  choice: в духе веры
  rationale: Повторяющаяся конструкция በመንፈሰ естественно передаётся как «в духе»; ሃይማኖት допускает значения веры и верности, поэтому второе отмечено в сноске.
- source_word: በመንፈሰ ትዕግሥት
  choice: в духе терпения
  rationale: «Терпение» понятно современному читателю и охватывает стойкость и выдержку, присущие исходному слову.
- source_word: በመንፈሰ ምሕረት
  choice: в духе милосердия
  rationale: «Милосердие» сохраняет нравственный и богословский регистр исходного понятия.
- source_word: በመንፈሰ ጽድቅ ወሰላም
  choice: в духе праведности и мира
  rationale: Союз между праведностью и миром сохранён внутри одной формулы «в духе», как в геэзском тексте.
- source_word: መንፈሰ ኂሩት
  choice: в духе доброты
  rationale: ኂሩት прежде всего обозначает доброту, благость или благожелательность; «доброта» сохраняет широту значения и не сужает его до щедрости.
- source_word: ቡሩክ ወይትባረክ
  choice: Благословен Он, и да будет благословенно
  rationale: Перевод различает причастное ቡሩክ («благословен») и юссив ይትባረክ («да будет благословенно»), не сглаживая смену грамматической формы.
- source_word: ስሙ ለእግዚአ መናፍስት
  choice: имя Господа духов
  rationale: Устойчивый для этой части 1 Еноха титул передан прямо, без догматического уточнения природы «духов».
- source_word: ለዓለም ወእስከ ለዓለም
  choice: во веки веков
  rationale: Традиционная и естественная русская доксологическая формула точно передаёт удвоенное выражение вечности.
theological_decisions:
- issue: Значение повторяющихся выражений «в духе…»
  choice: Сохранить формулу буквально и понимать её прежде всего как указание на образ или внутреннюю сферу хвалы.
  alternative: Отдельные олицетворённые небесные духи либо дарованные поклоняющимся духовные качества.
  rationale: Геэзская конструкция допускает несколько оттенков. Прозрачный перевод не навязывает читателю метафизического истолкования.
- issue: К кому относится первое «Благословен»
  choice: Отнести его к Господу духов и добавить местоимение «Он».
  alternative: Понимать как самостоятельное восклицание либо относить к последующему слову «имя».
  rationale: Продолжение об имени Господа духов делает личный референт наиболее вероятным; местоимение необходимо для ясной русской фразы, но его добавление отмечено.
- issue: Соотношение двух форм благословения
  choice: Передать первую форму декларативно («Благословен»), вторую — пожелательно («да будет благословенно»).
  alternative: 'Обе формы передать одинаково: «да будет благословен… и да будет благословенно…».'
  rationale: Так сохраняется различие между пассивным причастием ቡሩክ и юссивной формой ይትባረክ.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным литургическим ритмом. Повторы исходного текста преимущественно сохранены; во втором случае «в один голос» употреблено как естественный русский эквивалент конструкции совместного возглашения.
