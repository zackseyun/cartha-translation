base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/005.yaml
  text: And these measures shall reveal all the hidden things in the depth of the earth[a], and those who were destroyed in the wilderness, and those who were devoured by wild beasts, and those who were devoured by the fish of the sea, so that they may return and be supported on the day of the Chosen One; for none shall perish before the Lord of Spirits[d][c][b], and none can perish.
translation:
  language: ru
  text: И эти меры[a] откроют всё сокрытое в глубине земли, и тех, кто погиб в пустыне, и тех, кого пожрали дикие звери, и тех, кого пожрали морские рыбы, чтобы они возвратились и были поддержаны[b] в день Избранного[c]; ибо перед Господом духов никто не погибнет, и никто не может погибнуть[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «эти меры»; выражение связано с мерами, упомянутыми в предшествующем контексте.'
    reason: contextual_clarification
  - marker: b
    text: Значение эфиопского глагола здесь не вполне ясно; возможны также переводы «были укреплены» или, возможно, «были собраны вместе».
    reason: lexical_alternative
  - marker: c
    text: «Избранный» — титул эсхатологической фигуры, связанной в Притчах Еноха с судом и оправданием праведных.
    reason: cross_reference
  - marker: d
    text: Последняя фраза в эфиопском тексте очень сжата; её также можно понять как «и ничто не может быть погублено».
    reason: source_ambiguity
lexical_decisions:
- source_word: እሉ፡ እምጣን
  choice: эти меры
  rationale: Существительное እምጣን явно присутствует в тексте и продолжает образ мер из предыдущего контекста; указательное местоимение передано без сглаживания.
- source_word: ይከሥቱ
  choice: откроют
  rationale: Будущее действие соответствует последовательности видения, а глагол передаёт обнаружение того, что прежде было сокрыто.
- source_word: ኵሎ፡ ኅቡኣተ፡ ለዕመቀ፡ ምድር
  choice: всё сокрытое в глубине земли
  rationale: Субстантивированное «сокрытое» естественно по-русски и сохраняет образ земной глубины без преждевременного сведения выражения только к останкам умерших.
- source_word: ተኃጕሉ፡ እምበድው
  choice: погиб в пустыне
  rationale: В данном перечислении глагол обозначает гибель, а «пустыня» сохраняет библейско-апокалиптический регистр.
- source_word: ተበልዑ፡ እምአራዊት
  choice: пожрали дикие звери
  rationale: Форма передаёт насильственную смерть от диких животных; «пожрали» сохраняет выразительность исходного образа.
- source_word: ተበልዑ፡ እምዓሣ፡ ባሕር
  choice: пожрали морские рыбы
  rationale: Близкая к форме источника передача сохраняет нарастающее перечисление погибших в недоступных местах.
- source_word: ከመ፡ ይግብኡ
  choice: чтобы они возвратились
  rationale: Конструкция выражает цель или результат; «возвратились» сохраняет образ восстановления к жизни, не разворачивая его в догматическое пояснение.
- source_word: ይትመረጐዙ
  choice: были поддержаны
  rationale: Значение глагола в данном месте не вполне ясно. Основной текст сохраняет вероятный смысл поддержки, а иные возможности отмечены в сноске.
- source_word: በዕለተ፡ ኅሩይ
  choice: в день Избранного
  rationale: Субстантивированное «Избранный» сохраняет титульную силу единственного числа и соответствует местному употреблению в Притчах Еноха.
- source_word: እግዚአ፡ መናፍስት
  choice: Господом духов
  rationale: Устойчивый титул передан буквально и в возвышенном, но понятном современном регистре.
- source_word: አልቦቱ፡ ዘይትኃጐል፡ … ወአልቦ፡ ዘይክል፡ ተኃጕሎተ
  choice: никто не погибнет … и никто не может погибнуть
  rationale: Повтор корня сохранён как риторическое усиление, а сжатость заключения не разрешена посредством добавления предполагаемого действующего лица.
theological_decisions:
- issue: Характер возвращения погибших
  choice: Перечисленные погибшие возвращаются в эсхатологический день
  alternative: Обнаруживаются лишь их скрытые останки для суда
  rationale: Перечень несомненно погибших, цель «чтобы они возвратились» и последующее отрицание окончательной гибели вместе создают образ восстановления, однако перевод не добавляет специального богословского термина «воскресение».
- issue: Титул ኅሩይ
  choice: Избранный
  alternative: Избранник
  rationale: «Избранный» ясно звучит как титул и не вводит конфессионально обусловленной идентификации этой фигуры.
- issue: Абсолютность заключительного утверждения
  choice: Сохранено двойное отрицание гибели
  alternative: Ограничить его значением «никто из них не погибнет окончательно»
  rationale: Источник формулирует мысль широко и напряжённо; перевод не вставляет отсутствующих ограничителей и не сглаживает богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксический параллелизм перечня сохранён; архаизирующее «пред» употреблено только в устойчивой торжественной формуле «пред Господом духов».
