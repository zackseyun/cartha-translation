base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/002.yaml
  text: And I asked the angel[a], saying, “Why have they taken these cords and gone?” And he said to me[c][b], “They have gone so that they may measure.”
translation:
  language: ru
  text: 'И спросил я ангела: «Зачем они взяли эти верви и ушли?» Он ответил мне: «Они ушли, чтобы измерять».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы отмерять». То, что именно они должны измерить или отмерить, в этом стихе не уточняется.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስአልክዎ
  choice: спросил я
  rationale: Форма первого лица единственного числа вводит прямой вопрос; инверсия поддерживает достойный повествовательный ритм.
- source_word: መላእክ
  choice: ангела
  rationale: В контексте видения речь идёт о небесном истолкователе; определённость передана контекстом без артикля, которого в русском нет.
- source_word: እንዘ እብሎ
  choice: двоеточие перед прямой речью
  rationale: Буквальное «говоря» в современном русском избыточно; синтаксическое оформление прямой речи естественно передаёт функцию конструкции.
- source_word: ለምንት
  choice: зачем
  rationale: Вопрос относится к цели взятия вервей и ухода; «зачем» естественно согласуется с последующим ответом о цели.
- source_word: ነሡ
  choice: взяли
  rationale: Это форма глагола ነሥአ «брать», а не ተንሥአ «вставать».
- source_word: እሎንቱ አኅበለ
  choice: эти верви
  rationale: Существительное обозначает верви/шнуры и отсылает к длинным вервям предыдущего стиха; указательное слово передано как «эти».
- source_word: ሖሩ
  choice: ушли
  rationale: Простой глагол движения; повтор в ответе ангела сохранён.
- source_word: ከመ ይመጥኑ
  choice: чтобы измерять
  rationale: 'Активная форма указывает на действие самих ушедших: они отправились производить измерение, а не быть измеренными.'
theological_decisions:
- issue: Цель ухода с вервями
  choice: чтобы измерять
  alternative: чтобы отмерять
  rationale: Активное значение формы сохранено, а объект измерения не добавлен, поскольку в данном стихе он прямо не назван. Так не предрешается смысл образа или его возможная связь с судом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. «Верви» выбрано вместо бытового «верёвки», чтобы сохранить образ измерительных шнуров и достоинство апокалиптического повествования; архаические глагольные формы исключены.
