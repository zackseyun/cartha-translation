base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/010.yaml
  text: And all the hosts of the heavens shall cry out[a], and all the holy ones above, and the host of the Lord—the Keruben, the Seraphen, and the Ophannin—and all the angels of power, and all the angels of principalities, and the Chosen One[d][c][b], and the other powers that are on the dry land and over the water.
translation:
  language: ru
  text: И воззовут[a] все воинства небес, и все святые в вышине, и воинство Господа — Керубен, Серафен и Офаннин[b], — и все ангелы силы, и все ангелы начальств[c], и Избранник[d], и прочие силы, которые на суше и над водой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «воскликнут», «громко воззовут». Эфиопский глагол обозначает слышимый зов или возглас.'
    reason: lexical_alternative
  - marker: b
    text: «Керубен», «Серафен» и «Офаннин» — транслитерированные названия небесных чинов по эфиопскому тексту. Офаннин иногда толкуют как «колёса» в связи с видениями небесного престола.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ангелы владычеств». Исходное выражение обозначает правящие чины или разряды небесных существ.'
    reason: lexical_alternative
  - marker: d
    text: '«Избранник» здесь, по-видимому, употреблено как титул единственного эсхатологического лица; возможно также нетитульное прочтение: «избранный».'
    reason: theological_ambiguity
lexical_decisions:
- source_word: ይጼውዑ
  choice: воззовут
  rationale: Глагол означает громко звать или восклицать. «Воззовут» передаёт звучащее действие и сохраняет возвышенный апокалиптический регистр, не подменяя его отдельной идиомой «возвысят голос».
- source_word: ኵሉ ኃይለ ሰማያት
  choice: все воинства небес
  rationale: В данном перечне небесных существ ኃይል обозначает скорее собранное множество или воинство, чем отвлечённую силу. Множественное «небес» отражает форму источника.
- source_word: ቅዱሳን በመልዕልተ
  choice: все святые в вышине
  rationale: Речь идёт о небесных святых существах. «В вышине» естественно передаёт пространственное значение и не вызывает преимущественно церковно-исторической ассоциации слова «святые» с канонизированными людьми.
- source_word: ኃይለ እግዚአብሔር
  choice: воинство Господа
  rationale: 'Окружающий перечень небесных чинов поддерживает собирательное понимание: воинство, принадлежащее Господу, а не отвлечённая «сила Господа».'
- source_word: ኪሩቤን / ሱራፌን / እፋኒን
  choice: Керубен, Серафен и Офаннин
  rationale: Переданы формы эфиопского свидетеля, а не заменены привычными формами, восходящими к иной языковой традиции. Это сохраняет особый облик перечня.
- source_word: መላእክተ ኃይል
  choice: ангелы силы
  rationale: Формальная конструкция сохраняет ощущение названия небесного чина и не сводит выражение к характеристике «сильные ангелы».
- source_word: መላእክተ አጋእዝት
  choice: ангелы начальств
  rationale: Существительное указывает на правящие чины или носителей власти. «Начальства» сохраняет категориальный характер выражения; возможное «владычества» отмечено в сноске.
- source_word: ኅሩይ
  choice: Избранник
  rationale: В Притчах Еноха слово регулярно служит титулом единственного эсхатологического лица. Заглавная буква отмечает титульное употребление, не отождествляя его прямо с фигурой из более поздней богословской системы.
- source_word: ካእአ ኃይል
  choice: прочие силы
  rationale: Выражение добавляет ещё одну, не вполне определённую группу космических сил. Перевод сохраняет эту неопределённость.
- source_word: እለ ውስተ የብስ ወዲበ ማይ
  choice: которые на суше и над водой
  rationale: የብስ обозначает именно сушу в противопоставлении воде; предлоги переданы раздельно как «на» и «над».
theological_decisions:
- issue: Является ли ኅሩይ титулом единственного эсхатологического лица или обычным определением
  choice: Избранник
  alternative: избранный; избранник со строчной буквы
  rationale: Местное словоупотребление в Притчах Еноха поддерживает титульное значение. Перевод сохраняет его, но не вводит отсутствующего в стихе прямого христологического отождествления.
- issue: Следует ли заменять названия небесных чинов привычными русскими библейскими формами
  choice: Керубен, Серафен и Офаннин
  alternative: херувимы, серафимы и офанимы; колёса
  rationale: Транслитерация эфиопских форм сохраняет конкретное текстовое свидетельство и апокалиптическую необычность перечня, не превращая Офаннин в толковательный перевод «колёса».
- issue: Как понимать повторяющееся ኃይል в разных частях перечня
  choice: «воинство» для небесных множеств, «сила/силы» для названий чинов
  alternative: последовательно переводить как «силы» или как «воинства»
  rationale: Контекст допускает оба оттенка. Различение по синтаксической функции делает русский текст понятным, не устраняя смысловую широту корня.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным апокалиптическим звучанием. Начальное сказуемое облегчает восприятие длинного перечисления и соответствует порядку эфиопского текста. Повтор союза «и» намеренно сохранён как риторическая структура каталога.
