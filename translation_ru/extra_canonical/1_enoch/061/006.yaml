base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/006.yaml
  text: And all those in the height of heaven received a command[a], and power, and a voice[c][b], and light like fire.
translation:
  language: ru
  text: И все, кто находится в вышине неба[b], получили повеление, и силу, и голос, и свет, подобный огню.[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вторая половина стиха в данном эфиопском свидетеле трудна для прочтения; слово, переведённое как «свет», может также означать «сияние» или «блеск».
    reason: textual_variant
  - marker: b
    text: 'Или: «все пребывающие на высоте небес».'
    reason: lexical_alternative
  - marker: c
    text: 'В более раннем переводе спорный фрагмент был понят иначе: «сила и голос света были подобны огню». Однако координация существительных в данном тексте поддерживает их понимание как того, что они получили.'
    reason: previous_rendering
lexical_decisions:
- source_word: ወነሥኡ
  choice: получили
  rationale: Глагол означает «взять, принять, получить»; в сочетании с повелением и последующим рядом дополнений естественно русское «получили».
- source_word: ትእዛዘ
  choice: повеление
  rationale: Передаёт властное предписание и сохраняет возвышенный апокалиптический регистр, не смягчая его до «наставления».
- source_word: እለ፡ በ‘መልዕልተ፡ ሰማይ፡ ኵሎሙ
  choice: все, кто был в небесной вышине
  rationale: Фраза обозначает всех находящихся в вышине неба, не уточняя их ангельский чин. Такой перевод сохраняет пространственный образ и широкий референт.
- source_word: ኃይለ
  choice: силу
  rationale: Существительное обозначает силу или могущество; «силу» естественно входит в ряд прямых дополнений и не конкретизирует её природу.
- source_word: ቃለ
  choice: голос
  rationale: Слово может означать голос, звук, речь или слово; в данном образном ряду «голос» наиболее непосредственно сохраняет исходную многозначность.
- source_word: ብርሃነ
  choice: свет
  rationale: Основное значение — «свет, сияние»; нейтральное «свет» не усиливает образ сверх текста.
- source_word: ከመ፡ እሳት
  choice: подобный огню
  rationale: Прямо сохраняет сравнение; по ближайшей синтаксической связи оно отнесено к свету.
theological_decisions:
- issue: Кого обозначают находящиеся в небесной вышине
  choice: Оставить общее обозначение небесных существ без указания их чина
  alternative: Назвать их ангелами, небесным воинством или определённым ангельским чином
  rationale: Исходный текст не называет конкретной категории существ, поэтому её догматическая конкретизация была бы привнесением.
- issue: Синтаксическая роль силы, голоса и света
  choice: Передать их как однородные дополнения при глаголе «получили»
  alternative: 'Понять их как подлежащее отдельной части: «сила и голос света были подобны огню»'
  rationale: Формы существительных и повторяющийся союз поддерживают их координацию с «повелением» как предметов получения, хотя состояние свидетеля требует отметить альтернативный разбор.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным апокалиптическим звучанием. Повторы союза «и» сохранены ради торжественной координации исходного текста; неестественное на первый взгляд сочетание «получили… голос» оставлено как отражение буквальной структуры и образной напряжённости оригинала.
