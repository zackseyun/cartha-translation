base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/001.yaml
  text: And I saw in those days that long cords were given to those angels[a], and they took for themselves wings and flew[b], and they went toward the north.
translation:
  language: ru
  text: 'И увидел я в те дни: тем ангелам[a] были даны длинные верёвки[b], и они взяли себе крылья, и полетели, и направились на север.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен также перевод: «другим ангелам» — в зависимости от того, как понимать указательное слово.'
    reason: alternative_reading
  - marker: b
    text: Выражение, переведённое как «длинные верёвки», может также означать «длинные шнуры» или, возможно, «мерные верёвки».
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: И увидел я
  rationale: Сохраняет формулу видения от первого лица и её возвышенный характер, оставаясь естественной для современного литературного русского языка.
- source_word: በእማንቱ መዋዕል
  choice: в те дни
  rationale: Точно передаёт устойчивую апокалиптическую формулу времени.
- source_word: ተውህበ
  choice: были даны
  rationale: Передаёт пассивную форму; множественное число согласовано с предметом «верёвки».
- source_word: ለአልእቱ መላእክት
  choice: тем ангелам
  rationale: В данном апокалиптическом контексте መላእክት естественно означает «ангелы», а указательное значение አልእቱ передано без дополнительного отождествления этой группы.
- source_word: አሕባል ነዋኃን
  choice: длинные верёвки
  rationale: Сохраняет конкретный образ длинных верёвок или шнуров, не внося в основной текст возможное, но не обязательное значение измерительного орудия.
- source_word: ወነሡአ ሎሙ ክንፈ
  choice: и они взяли себе крылья
  rationale: Сохраняет необычный конкретный образ и возвратный оттенок ሎሙ, не заменяя действие толкованием вроде «обрели способность летать».
- source_word: ወሰረሩ
  choice: и полетели
  rationale: Прямо и ясно передаёт движение, связанное с крыльями.
- source_word: ወሖሩ ሰመንገለ መስዕ
  choice: и направились на север
  rationale: Передаёт движение в северном направлении, не утверждая, что север непременно был их конечным пунктом.
theological_decisions:
- issue: Кто именно назван ангелами
  choice: тем ангелам
  alternative: другим ангелам
  rationale: Сам стих не определяет эту группу подробнее. Основной текст сохраняет указательное значение и не вводит ни противопоставления, ни отождествления с особым разрядом ангелов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным ритмом повествования о видении. Повторение союза «и» сохраняет последовательное, торжественное движение геэзского текста; архаизмы и конфессионально окрашенные термины не используются.
