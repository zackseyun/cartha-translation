base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/012.yaml
  text: All who do not sleep in the heights of heaven shall bless him[a]; all the holy ones who are in heaven shall bless him, and all the chosen ones who dwell in the garden of life; and every spirit of light that is able to bless and glorify and exalt and sanctify your blessed name[d][c][b]; and all flesh shall exceedingly and with power praise and bless your name forever and ever.
translation:
  language: ru
  text: Все, кто не спит[a] в небесных высотах, будут благословлять его; все святые, пребывающие на небе, будут благословлять его; и все избранные, обитающие в саду жизни, будут благословлять его; и всякий дух света, способный благословлять, прославлять, превозносить и освящать Твоё благословенное имя[b]; и всякая плоть будет безмерно и с силой восхвалять и благословлять Твоё имя во веки веков[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Не спит», вероятно, говорится о бодрствующих небесных существах, непрестанно предстоящих Богу, а не просто о человеческой бдительности.
    reason: cultural_note
  - marker: b
    text: 'В начале стиха стоит «его», но здесь текст переходит к прямому обращению: «Твоё… имя». Эта смена лица сохранена по эфиопскому тексту.'
    reason: textual_note
  - marker: c
    text: 'Эфиопский оборот перед заключительными глаголами синтаксически труден. Здесь он понят как «безмерно и с силой»; возможно также понимание: «всякая плоть, преизобилующая силой».'
    reason: textual_variant
lexical_decisions:
- source_word: ይባርክዎ / ትባርክ
  choice: будут благословлять его / благословлять Твоё имя
  rationale: Повтор корня «благословлять» образует литургический каркас стиха. Объектный суффикс -ዎ в первых двух случаях означает «его», тогда как далее текст переходит к прямому обращению «Твоё имя».
- source_word: እለ ኢይነውሙ
  choice: кто не спит
  rationale: Формулировка сохраняет яркий апокалиптический образ бодрствующих небесных существ, не усиливая его до категорического «никогда не спит».
- source_word: በመልዕልተ ሰማይ
  choice: в высотах неба
  rationale: Передаёт пространственный образ возвышенной небесной области, не превращая его в техническое обозначение «высшего неба».
- source_word: ቅዱሳን
  choice: святые
  rationale: Сохраняет наименование группы без уточнения, ангелы ли это, праведники или смешанное небесное собрание.
- source_word: ኅሩያን
  choice: избранные
  rationale: Прямо передаёт важный для 1 Еноха термин и не связывает его с более поздней конфессиональной формулой.
- source_word: ገነት ሕይወት
  choice: сад жизни
  rationale: Сохраняет непосредственный садово-эденский образ исходного текста; «рай жизни» возможно, но менее буквально.
- source_word: መንፈሰ ብርሃን
  choice: дух света
  rationale: Буквальная и естественная по-русски передача сохраняет космическую образность.
- source_word: ባርኮተ ወሰብሖተ ወአልዕሎተ ወቀድሶተ
  choice: благословлять, прославлять, превозносить и освящать
  rationale: Сохранены все четыре различных глагола и торжественный ритм славословия.
- source_word: ኵሉ ሥጋ
  choice: всякая плоть
  rationale: Сохраняет весомое библейско-апокалиптическое выражение, не обобщая его до «всех созданий».
- source_word: ፈድፋደ እምኃይል
  choice: безмерно и со всей силой
  rationale: Слова поняты как обстоятельственные определения последующих глаголов. Русская формулировка передаёт чрезмерность и силу естественнее, чем буквальное присоединение оборота к «всякой плоти».
- source_word: ትሴብሕ
  choice: восхвалять
  rationale: В заключительной части выбран глагол «восхвалять», чтобы отличить его от отдельного глагола «прославлять» в предшествующем четырёхчастном ряду.
theological_decisions:
- issue: Кого обозначают «святые» и «избранные»
  choice: Оставить оба наименования без онтологического уточнения.
  alternative: Понимать «святых» только как ангелов, а «избранных» только как прославленных праведников.
  rationale: Видение перечисляет несколько небесных групп, но сам стих не проводит однозначной границы между ангелами и людьми.
- issue: Смена третьего лица на второе
  choice: Сохранить переход от «его» к «Твоё имя».
  alternative: 'Согласовать всё обращение во втором лице: «Тебя… Твоё имя».'
  rationale: В эфиопском тексте первые формы имеют объект «его», а далее появляется обращение «Твоё». Гармонизация устранила бы подлинное напряжение текста.
- issue: Передача ገነት ሕይወት
  choice: сад жизни
  alternative: рай жизни
  rationale: «Сад» точнее сохраняет исходную образность и не вносит дополнительных позднейших ассоциаций.
translation_notes:
  register: Современный литературный русский язык с торжественным ритмом славословия. Сохранены длинная перечислительная структура, библейское выражение «всякая плоть» и намеренная смена лица. Прописная буква в «Твоё» подчёркивает прямое обращение к Богу, не меняя содержания исходного текста.
