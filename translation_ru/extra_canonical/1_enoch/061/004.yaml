base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/004.yaml
  text: And the chosen ones shall dwell with the chosen ones[a], and these are the measures that shall be given for faith[d][c][b], and they shall strengthen righteousness.
translation:
  language: ru
  text: И избранные начнут жить с избранными, и вот меры[b], которые будут даны для веры[a], и они утвердят праведность.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для верности» или «для стойкости».'
    reason: lexical_alternative
  - marker: b
    text: «Меры» можно также понимать как отмеренные доли или мерила; точный оттенок здесь неясен.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይዌጥኑ፡ ወየሐድሩ
  choice: начнут жить
  rationale: Первый глагол ይዌጥኑ передаёт начало действия, а የሐድሩ — пребывание или проживание; вместе они естественно передаются как «начнут жить». Это сохраняет оба глагола без искусственного удвоения.
- source_word: ኅሩያን
  choice: избранные
  rationale: Устойчивое и понятное обозначение избранных в апокалиптическом контексте, без дополнительной конфессиональной окраски.
- source_word: እሉ
  choice: вот
  rationale: Указательное местоимение имеет значение «эти»; в русском обороте «и вот меры» оно передано естественно и с сохранением ближнего указания.
- source_word: እምጣናት
  choice: меры
  rationale: Буквальная передача сохраняет неопределённость между мерами, отмеренными долями и мерилами.
- source_word: ይትወሀቡ
  choice: будут даны
  rationale: Прямая передача страдательной формы без уточнения подразумеваемого дающего.
- source_word: ለሃይማኖት
  choice: для веры
  rationale: Слово может обозначать веру, верность или стойкость; основной текст сохраняет наиболее прямой эквивалент, а альтернативы вынесены в сноску.
- source_word: ያፀንዕዋ
  choice: они утвердят
  rationale: Глагол означает сделать крепким или утвердить; «утвердят» естественно сочетается с «праведностью» и сохраняет активное значение.
- source_word: ለጽድቅ
  choice: праведность
  rationale: Передаёт нравственный и религиозный объём понятия точнее, чем более узкое «справедливость».
theological_decisions:
- issue: Значение ሃይማኖት в контексте эсхатологического воздаяния
  choice: вера
  alternative: верность; стойкость
  rationale: Смысл слова широк, поэтому основной текст не сводит его к одной форме поведения, а возможные контекстуальные значения отмечены в сноске.
- issue: Связь двух начальных глаголов
  choice: начнут жить
  alternative: начнут пребывать; станут жить
  rationale: Так передаются и начинательное значение ይዌጥኑ, и значение пребывания в የሐድሩ; чтение «покоиться» не принято как менее соответствующее форме первого глагола.
- issue: Образ «мер»
  choice: меры
  alternative: отмеренные доли; мерила
  rationale: Неясно, обозначает ли существительное распределяемые доли или нормативные мерила; буквальное «меры» сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский с торжественным апокалиптическим звучанием. Синтаксис близок к источнику, но не перегружен буквальными повторами; подлинная лексическая неопределённость сохранена в сносках.
