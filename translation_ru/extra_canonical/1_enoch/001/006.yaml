  text: And the lofty mountains will quake, and the high hills will be brought low; they will melt like wax before the blaze.
translation:
  language: ru
  text: И высокие горы содрогнутся[a], и высокие холмы будут низведены[b]; они растают, как воск перед пламенем[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «задрожат»; «поколеблются».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «будут понижены»; «будут унижены».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «как воск в присутствии огня».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይደነግፁ (yǝdänägǝṣu)
  choice: содрогнутся
  rationale: Передаёт непереходное значение сильного дрожания и сохраняет выразительность теофанической картины.
- source_word: አድባር (ʾadbar)
  choice: горы
  rationale: Обычное обозначение горных возвышенностей; множественное число поддерживается параллелизмом с холмами.
- source_word: ነዋኀን / ነዋኃት (newaḥn / newaḥat)
  choice: высокие
  rationale: Естественно передаёт физическую высоту гор и холмов, не привнося метафорического значения гордости.
- source_word: ይቴሐቱ (yǝtēḥatu)
  choice: будут понижены
  rationale: Сохраняет пассивное значение и образ устранения высоты, не уточняя способ этого действия.
- source_word: አውግር (ʾawgr)
  choice: холмы
  rationale: Точное и естественное топографическое соответствие, образующее параллель слову «горы».
- source_word: ይትመሰዉ (yǝtmäsäw)
  choice: растают
  rationale: Прямо и наглядно передаёт образ плавления.
- source_word: መዓረ (mäʿärä)
  choice: воск
  rationale: Передаёт лексическое значение без неоправданного уточнения «пчелиный».
- source_word: ግራ (gǝra)
  choice: перед
  rationale: Кратко сохраняет пространственно-теофаническое значение «перед, в присутствии».
- source_word: እም ላህብ (ʾǝm lāhb)
  choice: перед пламенем
  rationale: «Пламя» ближе всего передаёт конкретный образ источника жара; предлог оформлен естественно по-русски.
