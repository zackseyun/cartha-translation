base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/008.yaml
  text: And he will make peace for the righteous[a], and he will guard the chosen ones; and favor will be upon them, and they will all be God's, and they will prosper and be blessed[c][b], and the light of God will shine upon them.
translation:
  language: ru
  text: И Он дарует праведным мир[a][c] и сохранит избранных; благоволение пребудет на них, и все они будут принадлежать Богу; они будут преуспевать[b] и будут благословенны, и свет Божий воссияет над ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальные слова в сохранившемся эфиопском свидетельстве текстуально неясны; дальнейший смысл, однако, относится к Божьему благоволению к праведным.
    reason: textual_variant
  - marker: b
    text: 'Или: «благоденствовать», «процветать».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквальнее: «установит мир для праведных».'
    reason: literal_rendering
lexical_decisions:
- source_word: ሰላመ ይገብር ለጻድቃን
  choice: дарует праведным мир
  rationale: Сочетание буквально описывает совершение или установление мира для праведных. Русское «дарует … мир» естественно передаёт направленность действия и не создаёт ошибочного смысла примирения Бога с праведными после вражды.
- source_word: የዓቅቦሙ
  choice: сохранит
  rationale: Глагол выражает охрану и сбережение. «Сохранит» уместно в контексте суда и избавления и сохраняет возвышенный библейский регистр.
- source_word: ሕሩያን
  choice: избранных
  rationale: Передаёт самостоятельное обозначение группы, не сливая его с предшествующим словом «праведные» и не добавляя поздней конфессиональной конкретизации.
- source_word: ሣህል
  choice: благоволение
  rationale: Слово обозначает благосклонность и милостивое расположение. «Благоволение» естественно сочетается с образом пребывания «на них» и не сужает смысл до одной лишь жалости.
- source_word: ዘአምላክ
  choice: принадлежать Богу
  rationale: Генитивное выражение указывает прежде всего на принадлежность Богу, а не только на нравственное качество или добавленное понятие «народ Божий».
- source_word: ይሴርሑ
  choice: преуспевать
  rationale: Вероятный смысл — благополучие, успех или процветание; «преуспевать» достаточно широко передаёт положительный исход, не ограничивая его материальным богатством.
- source_word: ይትባረኩ
  choice: будут благословенны
  rationale: Форма передана пассивно, что сохраняет характерную формулу благословения.
- source_word: ይበርህ ሎሙ ብርሃነ አምላክ
  choice: свет Божий воссияет над ними
  rationale: Передаёт апокалиптический образ божественного света и возвышенный строй исходной фразы; «над ними» соответствует направленности сияния на них.
theological_decisions:
- issue: Соотношение наименований верных
  choice: Сохранить отдельно «праведных» и «избранных»
  alternative: Объединить их в одно наименование или передать ሕሩያን термином с более узкой доктринальной окраской
  rationale: Исходный текст последовательно употребляет два обозначения. Их разграничение сохраняет риторическую и богословскую многослойность стиха.
- issue: Смысл выражения ዘአምላክ
  choice: «все они будут принадлежать Богу»
  alternative: «все они будут благочестивы» или «все они будут народом Божьим»
  rationale: Форма естественнее выражает принадлежность. Первая альтернатива превращает её в нравственную характеристику, а вторая вводит отсутствующее в тексте существительное.
- issue: Характер мира, даруемого праведным
  choice: Бог дарует мир праведным
  alternative: Бог примирится с праведными
  rationale: Предлог ለ указывает на адресата или получателя мира; текст не утверждает, что прежде между Богом и праведными была вражда.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохранён как единая ритмическая последовательность обетований; архаизмы и конфессионально нагруженные уточнения исключены.
