base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/003.yaml
  text: 'Concerning the Chosen Ones I said, and I uttered a parable concerning them: The Holy and Great One will go forth from his dwelling.'
translation:
  language: ru
  text: 'Об избранных я сказал и изрёк о них притчу: Святой и Великий выйдет из Своего жилища.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅሩያን
  choice: избранных
  rationale: Передаёт множественное число и значение «избранные» без уточнения их身份 или богословского статуса.
- source_word: እቤ
  choice: я сказал
  rationale: Прямое и нейтральное соответствие глаголу речи; согласуется с формой первого лица.
- source_word: አውሣእኩ
  choice: изрёк
  rationale: Передаёт отдельный глагол высказывания и сохраняет возвышенный, но понятный регистр.
- source_word: ምስለ
  choice: притчу
  rationale: В данном сочетании обозначает образное или приточное изречение; «притча» естественно передаёт традиционный жанровый смысл.
- source_word: ቅዱስ ወዐቢይ
  choice: Святой и Великий
  rationale: Сохраняет два субстантивированных титула и их порядок.
- source_word: ይወፅእ
  choice: выйдет
  rationale: Передаёт форму будущего/непредшествующего действия «выйдет, выступит».
- source_word: እማኅደሩ
  choice: из Своего жилища
  rationale: Передаёт исходное значение «из его жилища/обители»; прописная буква у местоимения соответствует русской традиции почтительного указания на Бога.
theological_decisions:
- issue: Кого обозначает выражение «Святой и Великий»
  choice: Сохранить как титул без добавления имени или пояснения
  alternative: Передать как «Святой и Великий Бог»
  rationale: В исходном тексте существительное «Бог» здесь прямо не выражено; добавление сняло бы формальную неоднозначность.
- issue: Референт местоимения в «из Своего жилища»
  choice: Связать его с титулом «Святой и Великий», не уточняя природу жилища
  alternative: «из Своей небесной обители»
  rationale: Источник говорит о жилище, но не добавляет в этом стихе определения «небесное».
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксический параллелизм двух глаголов речи сохранён; архаизмы вроде «рёк» и «обитель» не использованы.
