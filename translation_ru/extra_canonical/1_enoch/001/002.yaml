base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/002.yaml
  text: 'And Enoch answered and said: "A righteous man[a], whose eyes were opened by God, saw a holy vision in the heavens, which the angels showed me; and from them I heard everything, and I understood what I saw—but not for this generation[d][c][b], but for a distant one that is to come."'
translation:
  language: ru
  text: 'И Енох ответил и сказал: «Праведный человек, чьи глаза были открыты Богом[a], увидел святое видение на небесах[b], которое показали мне ангелы[c]; от них я услышал всё и понял то, что увидел, — но не для этого поколения, а для далёкого поколения, которое придёт[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфиопский синтаксис этой фразы текстуально труден; общий смысл состоит в том, что способность Еноха видеть откровение была открыта Богом.
    reason: textual_variant
  - marker: b
    text: Буквально — «на небесах» во множественном числе, как часто бывает в семитской и апокалиптической речи.
    reason: cultural_note
  - marker: c
    text: Необычный переход от третьего лица («праведный человек… увидел») к первому («показали мне») отражает форму эфиопского текста.
    reason: textual_note
  - marker: d
    text: 'Возможно также: «а для далёкого грядущего поколения». Последняя фраза может обозначать одно собирательно понимаемое будущее поколение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ ወይቤ
  choice: ответил и сказал
  rationale: Сохранена характерная для семитского повествования двойная формула введения речи; её не следует сглаживать до одного глагола, даже если непосредственный вопрос в контексте не назван.
- source_word: ብእሲ ጻድቅ
  choice: праведный человек
  rationale: «Праведный» сохраняет нравственно-богословскую силу определения, а современное «человек» понятно читателю и не вносит лишней архаики.
- source_word: ዘእምኀበ እግዚአብሔር [እንዘ] አዕይንቲሁ ክሡታት
  choice: чьи глаза были открыты Богом
  rationale: Передаёт божественное действие, открывающее Еноху способность видеть откровение, и сохраняет подчинённый характер оборота при текстуально трудном синтаксисе.
- source_word: እግዚአብሔር
  choice: Бог
  rationale: В данном контексте слово обозначает божественного деятеля, открывающего глаза Еноха; перевод «Бог» естественнее, чем формульное «Господь», и не добавляет значения заветного имени.
- source_word: ራእየ ቅዱሰ
  choice: святое видение
  rationale: Прилагательное естественнее всего относится к самому видению; перевод не превращает его без достаточного синтаксического основания в «видение Святого».
- source_word: ዘበሰማያት
  choice: на небесах
  rationale: Сохранено множественное число, характерное для семитской и апокалиптической космологической речи.
- source_word: ዘአርአዩኒ መላእክት
  choice: которое показали мне ангелы
  rationale: Прямо передаёт посредническую роль ангелов и зрительный характер откровения.
- source_word: ወሰማዕኩ እምኀቤሆሙ ኵሎ
  choice: от них я услышал всё
  rationale: Сохранены как полнота услышанного, выраженная ኵሎ, так и получение откровения от ангелов.
- source_word: ወአእመርኩ አነ ዘእሬኢ
  choice: и понял то, что увидел
  rationale: Глагол передаёт понимание или познание, а не повторное зрительное восприятие; русский оборот сохраняет связь понимания с видением.
- source_word: ወአኮ ለዛ ትውልድ አላ ለዘ ይመጽእ ርኁቃት
  choice: но не для этого поколения, а для далёкого поколения, которое придёт
  rationale: Сохранены противопоставление поколений, единственное собирательное значение и образ временной удалённости, не сведённый к нейтральному слову «будущее».
theological_decisions:
- issue: Относится ли ቅዱሰ к видению или обозначает Святого
  choice: святое видение
  alternative: видение Святого
  rationale: Синтаксис естественнее допускает согласование определения со словом «видение». Альтернатива вводила бы более определённое богословское утверждение, которого текст не требует.
- issue: Переход от третьего лица к первому в описании Еноха
  choice: 'сохранён переход: «праведный человек… увидел… которое показали мне»'
  alternative: 'сгладить всё до первого лица: «я… увидел… мне показали»'
  rationale: Форма ወይሬኢ стоит в третьем лице, тогда как далее текст переходит к первому лицу. Этот заметный риторический сдвиг подлинно присутствует в источнике и не должен молча исправляться.
- issue: Насколько явно обозначать будущую направленность откровения
  choice: не для этого поколения, а для далёкого поколения, которое придёт
  alternative: не для этого поколения, а для будущих поколений
  rationale: Выбранный текст сохраняет единственное число, противопоставление и смысл удалённости, не превращая выражение в общее утверждение о неопределённых будущих поколениях.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптической речи. Семитская формула «ответил и сказал» и намеренно резкий переход от третьего лица к первому сохранены; лишняя церковнославянская архаика устранена.
