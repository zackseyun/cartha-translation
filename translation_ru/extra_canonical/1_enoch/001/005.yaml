base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/005.yaml
  text: And all will fear[a], and the vigilant ones will tremble[c][b]; and fear and great trembling will seize them as far as the ends of the earth.
translation:
  language: ru
  text: И все устрашатся, и Стражи[a] задрожат; страх и великий трепет охватят их до пределов земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «бодрствующие», «бдительные». В Книге Еноха это наименование Стражей — ангельских существ.'
    reason: lexical_alternative
  - marker: b
    text: '«До пределов земли» — семитский образ, указывающий на всеобщий охват: до самых дальних краёв мира.'
    reason: cultural_note
lexical_decisions:
- source_word: ይፈርሁ
  choice: устрашатся
  rationale: Форма 3-го лица множественного числа передаёт будущую реакцию страха в контексте богоявления; «устрашатся» сохраняет возвышенный, но понятный современному читателю тон.
- source_word: ኵሉ
  choice: все
  rationale: Универсальный квантор передан прямо и без добавочного уточнения референта.
- source_word: ይደለቀለቁ
  choice: задрожат
  rationale: Интенсивная редуплицированная форма обозначает сильную дрожь или сотрясение; в контексте страха естественно «задрожат».
- source_word: ትጉሃን
  choice: бодрствующие
  rationale: Слово связано с бодрствованием и бдительностью и может функционировать как наименование ангельских Стражей; нарицательная передача сохраняет лексическое значение и не устраняет неоднозначность.
- source_word: ይነሥኦሙ
  choice: охватят их
  rationale: Буквально страх и трепет «берут» или «овладевают» ими; русское «охватят их» естественно передаёт действие чувств.
- source_word: ፍርሃት ወረዓድ ዓቢይ
  choice: страх и великий трепет
  rationale: Сохранена пара существительных, а прилагательное ዓቢይ отнесено к ближайшему слову «трепет».
- source_word: እስከ አጽናፈ ምድር
  choice: до пределов земли
  rationale: Предлог выражает протяжённость до крайней границы; формула передана естественным русским библейским оборотом.
theological_decisions:
- issue: Кого обозначает ትጉሃን
  choice: Передать буквально как «бодрствующие» и пояснить возможное титульное понимание в сноске.
  alternative: Перевести прямо как «Стражи» либо, вопреки этимологии слова, как «могущественные».
  rationale: Эфиопское слово связано с бдительностью и в енохической традиции может обозначать ангельских Стражей. Строго нарицательная форма в основном тексте сохраняет возможность как титульного, так и описательного прочтения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксический параллелизм и повтор союза сохранены; архаизмы и конфессионально нагруженные уточнения не добавлялись.
