base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/004.yaml
  text: And the God of eternity[a], from there, will tread upon Mount Sinai; he will appear with his host[d][c][b], and he will appear in the strength of his might from heaven.
translation:
  language: ru
  text: И Бог вечности[a] оттуда ступит[b] на гору Синай; Он явится со Своим воинством[c] и явится с небес в силе Своего могущества.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Бог вечности». Слово ዓለም может также означать «мир» или «век».'
    reason: lexical_alternative
  - marker: b
    text: 'Глагол, переведённый как «ступит», может быть передан нейтральнее: «пойдёт» или «выступит».'
    reason: lexical_alternative
  - marker: c
    text: 'Слово ትዕይንት означает «стан, войско, воинство»; возможный перевод: «в Своём стане». Греческое чтение также содержит образ стана или воинства.'
    reason: textual_clarification
lexical_decisions:
- source_word: አምላክ ዓለም
  choice: Бог вечности
  rationale: Сохраняет конструкцию и значение ዓለም как «вечность, век» в составе божественного титула, не подменяя её отсутствующим в тексте именем Бога.
- source_word: እምህየ
  choice: оттуда
  rationale: Передаёт исходное направление движения и отсылку к месту пребывания Бога, упомянутому в предшествующем контексте.
- source_word: ይከይድ ዲበ
  choice: ступит на
  rationale: Глагол допускает более нейтральное «пойдёт», однако «ступит на» естественно передаёт направленное движение на гору и сохраняет весомый образ богоявления.
- source_word: ሲና ደብር
  choice: гору Синай
  rationale: Обычная современная русская форма сочетания собственного имени с существительным «гора».
- source_word: ያስተርኢ
  choice: явится
  rationale: Передаёт значение «показаться, стать видимым» и соответствует контексту богоявления без лишнего уточнения способа явления.
- source_word: በትዕይንቱ
  choice: со Своим воинством
  rationale: Существительное понимается как «стан, войско, воинство»; предлог በ здесь естественно передать русским «со». Это чтение согласуется и с греческим παρεμβολή.
- source_word: በኃይለ ጽንዑ
  choice: в могуществе Своей силы
  rationale: Сохраняет усилительную пару понятий «сила/могущество», хотя по-русски она намеренно звучит торжественно.
- source_word: እምሰማይ
  choice: с небес
  rationale: Передаёт небесный источник явления; множественное «небеса» естественно для возвышенного современного русского регистра.
theological_decisions:
- issue: Божественный титул አምላክ ዓለም
  choice: Бог вечности
  alternative: Бог мира / Бог века / вечный Бог
  rationale: Формулировка сохраняет возможный акцент на вечности и структуру исходного титула, не превращая определение в более интерпретирующее прилагательное и не исключая лексической многозначности без примечания.
- issue: Сопровождение Бога при явлении
  choice: со Своим воинством
  alternative: в Своём стане
  rationale: «Воинство» передаёт коллективный образ небесного сопровождения, но не уточняет его состав и тем самым не вводит в текст отсутствующую ангелологическую детализацию.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, торжественным звучанием. Повтор «явится… и явится» сохранён как заметная риторическая особенность исходного текста; местоимение о Боге написано с прописной буквы согласно принятой русской религиозной издательской норме.
