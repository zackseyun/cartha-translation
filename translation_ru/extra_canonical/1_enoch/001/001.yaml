base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/001.yaml
  text: The words of the blessing of Henok[a], with which he blessed the chosen and the righteous who will be present on the day of affliction[c][b], for the removal of all the wicked and godless.
translation:
  language: ru
  text: Слова благословения Еноха[a], которыми он благословил избранных и праведных, которые будут жить в день бедствия[b], предназначенный для устранения всех злодеев и нечестивцев[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Енох — традиционная русская форма имени, переданного в геэзском тексте как Хенок.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в день скорби» либо «в день тяжкого притеснения».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «для устранения всех злодеев и нечестивцев». Последние два слова сохраняют два отдельных обозначения осуждаемых.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ቃለ ፡ በረከት
  choice: Слова благословения
  rationale: Конструкция служит заглавной формулой. Множественное «слова» естественно по-русски передаёт содержание произнесённого благословения, не превращая его в отвлечённую «благословенность».
- source_word: ዘሄኖክ
  choice: Еноха
  rationale: Использована укоренившаяся в русском библейском употреблении форма имени; она понятна современному читателю и соответствует тому же имени в геэзском тексте.
- source_word: በከመ ፡ ባረከ
  choice: которыми он благословил
  rationale: Относительно-инструментальная конструкция соотносит действие Еноха с названными перед этим словами благословения.
- source_word: ኅሩያነ ፡ ወጻድቃነ
  choice: избранных и праведных
  rationale: Сохранены два координированных обозначения без их слияния в единую категорию.
- source_word: እለ ፡ ሀለዉ ፡ ይኩኑ
  choice: что будут жить
  rationale: Будущая перифрастическая конструкция обозначает тех, кто будет существовать или находиться в названное время. «Будут жить» звучит естественно и не добавляет идеи выживания, которую могло бы нести «останутся».
- source_word: በዕለተ ፡ ምንዳቤ
  choice: в день бедствия
  rationale: «Бедствие» передаёт тяжёлую скорбь или притеснение, не подменяя исходное выражение более определённым «днём суда».
- source_word: ለአሰስሎ
  choice: когда будут устранены
  rationale: Исходная целевая конструкция допускает значение удаления или устранения. В русском предложении придаточная формулировка яснее связывает событие с названным днём, хотя целевой оттенок отмечен в сноске.
- source_word: ኵሎ ፡ እኩያነ
  choice: все злодеи
  rationale: Передано собирательное обозначение всех творящих зло; «злодеи» позволяет сохранить отличие от следующей религиозно окрашенной категории.
- source_word: ወረሲዓነ
  choice: и нечестивцы
  rationale: Слово обозначает людей нечестивых или безбожных. «Нечестивцы» сохраняет религиозно-нравственный смысл и отдельность этой группы.
theological_decisions:
- issue: Соотношение избранных и праведных
  choice: избранных и праведных
  alternative: избранных праведников
  rationale: Союз в геэзском тексте координирует два наименования. Их сохранение не решает за текст, являются ли это две группы или два взаимосвязанных описания одних людей.
- issue: Характер эсхатологического дня
  choice: день бедствия
  alternative: день скорби; день суда
  rationale: Источник прямо называет бедствие, но не употребляет здесь слово «суд». Поэтому судебный контекст не внесён в основную формулировку.
- issue: Связь устранения нечестивых с днём бедствия
  choice: когда будут устранены
  alternative: для устранения
  rationale: Естественная русская формулировка связывает устранение с этим днём; исходный целевой оттенок остаётся возможным и явно отмечен в сноске.
translation_notes:
  register: Современный литературный русский с достоинством древнего заглавия. Синтаксис упрощён настолько, чтобы стих был понятен обычному читателю, но сохранены повтор «благословения — благословил», две категории адресатов и две категории осуждаемых.
