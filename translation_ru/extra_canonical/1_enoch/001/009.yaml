base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/009.yaml
  text: And behold[a], he comes with myriads of holy ones, to execute judgment upon them, and to destroy the wicked[c][b], and to rebuke all flesh for everything that the sinful and wicked have done and spoken against him.
translation:
  language: ru
  text: И вот, он идёт с мириадами святых[a], чтобы совершить над ними суд, погубить нечестивых[b] и обличить всякую плоть[c] за всё, что грешные и нечестивые сделали и сказали против него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с десятками тысяч святых». Геэзское выражение обозначает огромное воинство и, возможно, отражает традиционную числовую формулу.'
    reason: lexical_alternative
  - marker: b
    text: Этот стих находит отзвук в Иуд. 14–15, однако здесь он переведён непосредственно по геэзскому свидетельству, без подгонки под более позднюю новозаветную формулировку.
    reason: cross_reference
  - marker: c
    text: «Всякая плоть» — традиционное выражение, означающее всё человечество; в переводе сохранён конкретный образ источника.
    reason: cultural_note
lexical_decisions:
- source_word: ወናሁ
  choice: И вот
  rationale: Сохраняет указательную силу видения и торжественный апокалиптический регистр, оставаясь естественным для современного русского языка.
- source_word: መጽአ
  choice: он идёт
  rationale: Передаёт живое пророческое настоящее, не фиксируя форму исключительно как прошедшую или будущую.
- source_word: በትእልፊተ ቅዱሳን
  choice: с мириадами святых
  rationale: «Мириады» сохраняет числовой и апокалиптический оттенок огромного множества, а «святые» не сужает значение до ангелов или людей.
- source_word: ይግበር ፍትሐ
  choice: совершить над ними суд
  rationale: Передаёт активное осуществление суда, а не отвлечённое понятие справедливости.
- source_word: ይሕጕሎሙ ለረሲዓን
  choice: погубить нечестивых
  rationale: Сохраняет сильный карательный смысл глагола в сцене суда.
- source_word: ይዘልፍ ኵሎ ዘሥጋ
  choice: обличить всякую плоть
  rationale: Сохраняет конкретную библейскую идиому и смысл публичного изобличения.
- source_word: ኵሉ ዘገብሩ ወረሰዩ
  choice: за всё, что … сделали и сказали
  rationale: Передаёт два вида вины — поступки и слова — в соответствии с контекстом и засвидетельствованным итоговым прочтением.
- source_word: ኃጥኣን ወረሲዓን
  choice: грешные и нечестивые
  rationale: Сохраняет два отдельных нравственных обозначения и их усилительный параллелизм.
- source_word: ላዕሌሁ
  choice: против него
  rationale: Передаёт личную направленность проступков и слов, не добавляя отсутствующего в данной формулировке титула.
theological_decisions:
- issue: Кто является грядущим
  choice: Оставить подлежащее как «он» со строчной буквы, не вставляя титул.
  alternative: «Господь идёт» или «Бог идёт»
  rationale: В геэзском тексте субъект выражен формой третьего лица без названного титула. Контекст допускает отнесение к божественному Судье, но перевод не должен устранять формальную неявность референта.
- issue: Кого обозначают «святые»
  choice: 'Перевести нейтрально: «святые».'
  alternative: «ангелы» или «угодники»
  rationale: Апокалиптический контекст, вероятно, указывает на небесную свиту, однако источник не уточняет её состав; нейтральная передача сохраняет эту неоднозначность.
- issue: Объём выражения «всякая плоть»
  choice: Сохранить традиционную конкретную идиому.
  alternative: «всех людей» или «всё человечество»
  rationale: Буквальная формула понятна в контексте и сохраняет связь с библейским языком, при этом сноска разъясняет её смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным апокалиптическим звучанием. Синтаксис сделан ясным и плавным; сохранены ключевые библейские образы «мириады святых» и «всякая плоть». Строчная буква в местоимении «он» намеренно не вводит конфессионально обусловленное почтительное написание и не уточняет не названный в стихе титул.
