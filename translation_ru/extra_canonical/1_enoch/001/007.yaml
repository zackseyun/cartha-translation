base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/007.yaml
  text: And the earth shall be rent asunder[a], and everything that is in the earth shall be destroyed[c][b], and judgment shall come upon all.
translation:
  language: ru
  text: И земля расколется[a], и всё, что в земле, погибнет, и суд постигнет всех[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет рассечена», «разверзнется».'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «суд», может также означать «правосудие» или «праведность»; здесь контекст указывает на грядущее судебное деяние, обращённое ко всем.
    reason: lexical_alternative
lexical_decisions:
- source_word: ትሠጠጥ
  choice: расколется
  rationale: Пассивная форма передаёт разрыв или рассечение земли; такое понимание также согласуется с греческим свидетельством σχισθήσεται и сохраняет конкретный апокалиптический образ.
- source_word: ምድር
  choice: земля
  rationale: Всеобщий контекст суда указывает на землю в целом, а не на отдельную страну или область.
- source_word: ኵሉ ዘውስተ ምድር
  choice: всё, что в земле
  rationale: Формулировка близко передаёт буквальное «всё, что внутри земли», не заменяя необычный образ более привычным «на земле».
- source_word: ይትሐጐል
  choice: погибнет
  rationale: Глагол выражает гибель или уничтожение; непереходное «погибнет» естественно сочетается с совокупным подлежащим.
- source_word: ፍትሕ
  choice: суд
  rationale: Хотя слово допускает значения «правосудие» и «праведность», конструкция с наступлением на всех в данном апокалиптическом контексте указывает прежде всего на судебное деяние.
- source_word: ላዕለ ኵሉ
  choice: постигнет всех
  rationale: Идиоматическая русская передача того, что суд придёт на всех; сохраняет всеобщность и направленность действия без излишне буквального оборота.
theological_decisions:
- issue: Следует ли понимать ፍትሕ как нравственное качество или как эсхатологическое судебное действие.
  choice: суд
  alternative: правосудие; праведность
  rationale: Сочетание с выражением «на всех» и последовательность апокалиптических событий благоприятствуют значению судебного свершения. Лексическая неоднозначность отмечена в сноске, а не устранена.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной апокалиптической образностью. Синтаксис сохраняет трёхчастную последовательность исходного текста; необычное «в земле» оставлено намеренно.
