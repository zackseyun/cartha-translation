base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/004.yaml
  text: Likewise[a], Uriel showed me twelve openings in the circuit of the chariots of the sun in the sky, from which the rays of the sun go out[b], and from which warmth comes forth upon the earth when they are opened in the seasons appointed for them.
translation:
  language: ru
  text: Также Уриил показал мне двенадцать проёмов на небесном круговом пути солнечных колесниц. Из них выходят лучи солнца[a], и из них исходит на землю тепло, когда они открываются в назначенные для них времена.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально трудное эфиопское слово может означать «ноги солнца»; по смыслу здесь, вероятно, имеются в виду его лучи.
    reason: lexical_alternative
lexical_decisions:
- source_word: ፲ወ፪ኆኃውተ (в переданном тексте искажено как ፲ሥሩ ወካልእ)
  choice: двенадцать отверстий
  rationale: Исправление очевидного искажения в транскрипции согласуется с астрономическим контекстом и обозначает двенадцать небесных проёмов; «отверстия» сохраняет конкретность образа.
- source_word: ኃዋላወ / предполагаемое በአውደ
  choice: в круговом пути
  rationale: Передаёт пространственный круг или обращение солнечных колесниц, не сводя образ к отвлечённому движению.
- source_word: አርአየኒ
  choice: показал мне
  rationale: Прямой и естественный перевод обычной формулы сообщения о видении.
- source_word: ሰረገላት ፀሐይ
  choice: солнечных колесниц
  rationale: Сохраняет конкретный и возвышенный космологический образ оригинала.
- source_word: እገሪሃ ለፀሐይ
  choice: лучи солнца
  rationale: Буквально трудная форма может означать «ноги солнца»; в данном контексте «лучи» естественно передаёт исходящие от солнца потоки и сохраняет образное основание в примечании.
- source_word: ሞቅ
  choice: тепло
  rationale: Нейтрально обозначает сезонное воздействие солнца на землю, не усиливая значение до палящего жара.
- source_word: ሶበ ይትረኃዉ
  choice: когда они открываются
  rationale: Сохраняет образ небесных отверстий, которые открываются в установленные сроки.
- source_word: በአዝማን እለ እሙራን ሎሙ
  choice: в назначенные для них времена
  rationale: Передаёт установленный временной порядок, не уточняя сверх текста, кем именно он назначен.
theological_decisions:
- issue: Характер небесного устройства
  choice: Сохранены конкретные образы отверстий и солнечных колесниц.
  alternative: Истолковать стих как отвлечённое описание движения солнца, света и сезонной погоды.
  rationale: Текст изображает упорядоченную небесную систему средствами апокалиптической космологии; перевод не должен модернизировать или демифологизировать этот образ.
- issue: Кем назначены времена
  choice: Сохранена безличная формулировка «назначенные для них времена».
  alternative: Явно сказать, что времена назначены Богом.
  rationale: Божественное установление возможно в широком контексте, но в самом стихе действующее лицо не названо.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис разделён на два предложения ради ясности; конкретная космологическая образность сохранена.
