translation:
  language: ru
  text: и для ветров, и для духа росы[a], когда на краях неба раскрываются проёмы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение «дух росы» лексически трудно; возможны также переводы: «дуновение росы» или «ветер, несущий росу».'
    reason: lexical_alternative
  - marker: b
    text: Заключительная часть стиха в данном свидетельстве текстуально не вполне надёжна. «Проёмы» можно также перевести как «отверстия», «окна» или «отдушины»; «на краях» — как «у пределов».
    reason: textual_variant
lexical_decisions:
- source_word: ነፋሳት
  choice: ветров
  rationale: В контексте Астрономической книги слово обозначает космические ветры как сотворённые явления; «ветры» точнее сохраняет метеорологический смысл, чем «духи».
- source_word: መንፈሰ ጠል
  choice: духа росы
  rationale: Буквальное и намеренно необычное выражение сохраняет образность геэзского текста и не сводит её к пояснительной передаче вроде «ветер, несущий росу».
- source_word: ሶበ
  choice: когда
  rationale: Естественный временной союз, вводящий обстоятельство раскрытия небесных отверстий.
- source_word: ይትረኃዉ
  choice: раскрываются
  rationale: Передаёт пассивно-возвратный смысл и в русском звучит естественнее буквального «бывают открыты».
- source_word: ርኅወተ
  choice: отверстия
  rationale: Нейтрально обозначает проёмы или отверстия в небесной структуре, не конкретизируя их как окна, врата или отдушины.
- source_word: በሰማይ
  choice: на небе
  rationale: Сохраняет единственное число источника и является естественным русским обозначением расположения небесных отверстий.
- source_word: አጽናፈ
  choice: у краёв
  rationale: Передаёт пространственные пределы или оконечности неба; форма с предлогом естественно связывается с местонахождением отверстий.
theological_decisions:
- issue: Следует ли демифологизировать выражение о росе, передав его обычным метеорологическим языком
  choice: Сохранить «дух росы» в основном тексте
  alternative: «дуновение росы» или «ветер, несущий росу»
  rationale: Необычная формула принадлежит описанию космических сил и небесных механизмов. Её сохранение удерживает апокалиптическую образность и подлинную лексическую неоднозначность.
