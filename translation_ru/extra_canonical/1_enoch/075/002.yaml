base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/002.yaml
  text: 'And because of them people go astray concerning them[a], for these lights render service at the stations of the world in righteousness: one in the first portal, and one in the third portal of heaven, and one in the fourth portal, and one in the sixth portal[e][d][c][b]; and the careful ordering of the world is completed in three hundred and sixty-four stations of the world.'
translation:
  language: ru
  text: 'И из-за них люди ошибаются относительно них[a], ибо эти светила в праведности сменяют свои места мира[c]: одно — в первых вратах неба, два — в третьих вратах, два — в четвёртых вратах и два — в шестых вратах[d]. И точное устройство мира завершается в трёхстах шестидесяти четырёх местах мира[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «люди из-за них сбиваются в своих расчётах». Строка противопоставляет человеческую ошибку упорядоченному движению светил.'
    reason: lexical_alternative
  - marker: b
    text: Заключительная часть трудна. Вероятно, речь идёт о еноховой схеме года из 364 дней или упорядоченных положений; буквально текст говорит о точном устройстве мира, завершающемся в 364 «местах».
    reason: alternative_reading
  - marker: c
    text: 'Или: «меняют свои места». В английском переводческом аудите также отражено чтение: «служат на местах мира».'
    reason: lexical_alternative
  - marker: d
    text: 'В данном эфиопском свидетельстве стоят числа: одно в первых вратах и по два в третьих, четвёртых и шестых. В распространённом переводном чтении во всех четырёх случаях стоит «одно».'
    reason: textual_difficulty
lexical_decisions:
- source_word: ወበእንቲአሆሙ ... ሰብእ ቦሙ
  choice: И из-за них люди ошибаются относительно них
  rationale: Первое местоименное выражение передаёт причину, а ቦሙ при глаголе ошибки — предмет заблуждения. Повтор местоимений сохранён как отражение трудного и несколько шероховатого исходного оборота.
- source_word: እሙንቱ ብርሃናት
  choice: эти светила
  rationale: В астрономическом контексте «светила» естественнее русского «светы» и сохраняет небесный референт.
- source_word: በጽድቅ
  choice: в праведности
  rationale: Буквальное нравственно-космическое значение сохранено, а не сведено исключительно к наречию «правильно».
- source_word: ይትቀየዩ መንበረ ዓለም
  choice: сменяют места мира
  rationale: Глагол обозначает перемену или чередование, а መንበር — место, пребывание или стоянку. Перевод не подменяет движение более спорным значением «служат».
- source_word: ኆኅት
  choice: врата
  rationale: «Врата» сохраняют возвышенный апокалиптический образ небесных отверстий и при этом понятны современному читателю.
- source_word: ይትፌጸም ጥንቃቄ ዓለም
  choice: точное устройство мира завершается
  rationale: ጥንቃቄ выражает точность, тщательность и упорядоченность; «точное устройство» естественно передаёт эту космологическую мысль.
- source_word: ፻፷ወ፬ ... መንበረ ዓለም
  choice: в трёхстах шестидесяти четырёх местах мира
  rationale: Сохранены число 364 и повтор слова «места»; возможная отсылка к дням схематического года не внесена непосредственно в текст.
theological_decisions:
- issue: Смысл በጽድቅ в описании движения светил
  choice: в праведности
  alternative: правильно; в должном порядке
  rationale: Формулировка сохраняет соединение нравственной и космической упорядоченности, не превращая его только в техническое описание.
- issue: Толкование числа 364
  choice: 364 места мира
  alternative: 364 дня схематического года; 364 позиции годового круга
  rationale: Основной текст следует формулировке источника, тогда как календарное толкование вынесено в примечание.
- issue: Числа при небесных вратах
  choice: одно, два, два, два
  alternative: по одному в первых, третьих, четвёртых и шестых вратах
  rationale: В предоставленной транскрипции прямо стоят числительные ፩, ፪, ፪, ፪. Распространённое чтение с четырьмя единицами отмечено, но не поставлено выше данного исходного свидетельства.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной апокалиптической лексикой («светила», «врата», «праведность»). Синтаксическая шероховатость первого оборота и повтор «места мира» сохранены там, где они отражают реальную неясность эфиопского текста.
