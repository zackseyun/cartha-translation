base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/001.yaml
  text: And the leaders of the heads of thousands[a], who are over all creation and over all the stars, together with those four that are added and do not separate from their service[e][d][c][b], according to the reckoning of the year—and these render service on the four days that are not counted in the reckoning of the year.
translation:
  language: ru
  text: И предводители глав тысяч[a], стоящие над всем творением и над всеми звёздами, вместе с теми четырьмя, которые присоединяются[b] и не отступают от своего служения, согласно исчислению года; и они исполняют служение[c] в те четыре дня, которые не учитываются при исчислении года[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «и их предводители, главы тысяч». Синтаксическая связь первых слов допускает разные способы членения.'
    reason: syntactic_alternative
  - marker: b
    text: 'Или: «прибавляются». Речь может идти о присоединении к упорядоченному годовому циклу.'
    reason: lexical_alternative
  - marker: c
    text: Трудный глагол может также означать, что они «сменяются» или «чередуются» при исполнении своей функции.
    reason: lexical_alternative
  - marker: d
    text: Эти четыре дня связаны с добавочными календарными днями при поворотных точках года в 364-дневном счёте Астрономической книги.
    reason: cultural_note
