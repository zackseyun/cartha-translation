  rationale: Прямо и естественно передаёт всеобщность исходной конструкции.
- source_word: ምስለ እሉ ፬ እለ ይትዌሰኩ
  choice: вместе с теми четырьмя, которые прибавляются
  rationale: Относительное местоимение እለ явно связывает «прибавляются» с «теми четырьмя»; перевод не превращает этот глагол в сказуемое при предводителях.
- source_word: ኢይትሌለዩ እምነ ምግባሮሙ
  choice: не отступают от своего служения
  rationale: Сохраняет образ неотделимости от назначенного дела или функции; «служение» уместно для упорядоченной деятельности небесных чинов.
- source_word: በከመ ሐሳበ ዓመት
  choice: сообразно исчислению года
  rationale: Передаёт технический календарный смысл ሐሳብ как счёта или исчисления.
- source_word: ይትቀየዩ
  choice: исполняют служение
  rationale: Контекст указывает на назначенную функцию, однако глагол труден и может подразумевать смену или чередование; эта неопределённость отмечена в сноске.
- source_word: ፬ መዋዐለ እለ ኢይትኃሰቡ በሐሳበ ዓመት
  choice: те четыре дня, которые не учитываются при исчислении года
  rationale: Ясно передаёт исключение четырёх дней из обычного годового счёта, не добавляя отсутствующей в тексте календарной теории.
theological_decisions:
- issue: Кого или что обозначают «те четыре»
  choice: В основном тексте сохранено неопределённое «те четыре», а заключительная часть связывает их с четырьмя днями.
  alternative: Прямо назвать их четырьмя добавочными днями либо небесными распорядителями этих дней.
  rationale: Геэзский текст сначала говорит лишь о «тех четырёх», а затем называет четыре дня; апокалиптическое соединение календарных единиц и небесных служителей не следует насильственно сводить только к одному толкованию.
- issue: Характер действия ይትቀየዩ
  choice: «исполняют служение» с указанием иной возможности в сноске.
  alternative: «сменяются» или «чередуются».
  rationale: Корень допускает значение изменения или чередования, тогда как контекст назначенного дела поддерживает функциональное «служат»; сноска сохраняет реальную лексическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Техническое «исчисление года» сохранено ради календарного контекста; синтаксис слегка разгружен тире, но исходная протяжённость фразы и неоднозначность референтов не устранены.
