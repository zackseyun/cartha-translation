base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/003.yaml
  text: For concerning the signs and the seasons and the years and the days[a], Uriel, the angel whom the Lord of glory appointed forever over all the luminaries of heaven in heaven and in the world, showed me how they rule over the face of heaven and are seen upon the earth[e][d][c][b], and become guides for day and for night—the sun and the moon and the stars and all the ministering powers that make their circuit in all the chariots of heaven.
translation:
  language: ru
  text: 'Ибо о знаках, временах[a], годах и днях Уриил — ангел, которого Господь славы навеки поставил над всеми небесными светилами на небе и в мире[b], — показал мне, как они властвуют над ликом неба[c], видны с земли и становятся путеводителями дня и ночи: солнце, луна, звёзды и все служебные силы[d], совершающие свой круг во всех небесных колесницах[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «установленных временах». Слово может обозначать закреплённые деления времени в календарном смысле.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «на небе и в мире» следует формулировке исходного текста; его точная связь с назначением Уриила и небесными светилами не вполне ясна.
    reason: textual_ambiguity
  - marker: c
    text: «Лик неба» — буквальный образ, обозначающий видимый небесный простор.
    reason: cultural_note
  - marker: d
    text: 'Значение выражения «служебные силы» не вполне ясно: оно может указывать на служащие небесные чины или на упорядоченные функции, связанные со светилами.'
    reason: lexical_alternative
  - marker: e
    text: «Небесные колесницы» могут обозначать установленные пути движения небесных тел, однако в переводе сохранён образ исходного текста.
    reason: lexical_alternative
lexical_decisions:
- source_word: ትእምርት
  choice: знаки
  rationale: В астрономическом контексте это наблюдаемые небесные знаки, служащие для исчисления времени; слово «знаки» не придаёт им обязательного значения зловещих предзнаменований.
- source_word: አዝማን
  choice: времена
  rationale: Слово обозначает времена или установленные деления времени. «Времена» естественно по-русски и сохраняет широту значения.
- source_word: መዋዕል
  choice: дни
  rationale: В последовательности временных единиц «знаки, времена, годы и дни» значение «дни» наиболее непосредственно.
- source_word: አርአየኒ
  choice: показал мне
  rationale: Точно передаёт визионерский глагол без усиления его до более истолковывающего «открыл мне».
- source_word: እግዚአ ስብሐት
  choice: Господь славы
  rationale: Сохраняет форму и возвышенный характер божественного титула.
- source_word: ለዓለም
  choice: навеки
  rationale: Явно передаёт длительность назначения Уриила, выраженную в исходном тексте.
- source_word: ብርሃናት ሰማይ
  choice: небесные светила
  rationale: В данном контексте речь идёт об упорядоченных небесных телах как источниках света; «светила» естественно передаёт специальный космологический смысл.
- source_word: በሰማይ ወበዓለም
  choice: на небе и в мире
  rationale: Близко следует геэзской формулировке и не сужает «мир» до одной лишь земли.
- source_word: ይምልኩ
  choice: властвуют
  rationale: Сохраняет выраженный в глаголе смысл господства и одушевлённый язык апокалиптической космологии.
- source_word: ገጸ ሰማይ
  choice: лик неба
  rationale: Сохраняет образную идиому исходного текста; её значение поясняется в примечании.
- source_word: ይትረአዩ ዲበ ምድር
  choice: являются над землёй
  rationale: Передаёт видимость небесных светил с земли и сохраняет несколько возвышенный визионерский регистр.
- source_word: መራሕያነ
  choice: путеводители
  rationale: Передаёт направляющую и упорядочивающую функцию светил, не устраняя личностный образ исходного текста.
- source_word: ቅንየታት
  choice: служебные силы
  rationale: Термин в этом месте неясен и может обозначать служащие небесные силы, чины либо функции; выбранный вариант сохраняет эту апокалиптическую неопределённость.
- source_word: የአውዱ
  choice: совершающие свой круг
  rationale: Передаёт круговое движение или шествие небесных сил.
- source_word: ሰረገላት ሰማይ
  choice: небесные колесницы
  rationale: Сохраняет буквальный апокалиптический образ, не заменяя его современным понятием орбит.
theological_decisions:
- issue: Следует ли обезличить власть и направляющую роль светил
  choice: 'Сохранён личностный язык: «они властвуют» и «становятся путеводителями».'
  alternative: Передать это как безличное движение светил и обозначение ими дня и ночи.
  rationale: В геэзском тексте употреблены слова власти и руководства; их обезличивание подменило бы древнюю космологическую картину современным объяснением.
- issue: Как передать образ небесных колесниц
  choice: Буквальный образ «небесные колесницы» оставлен в основном тексте.
  alternative: Истолковать его как «небесные пути» или «орбиты».
  rationale: Возможный функциональный смысл пояснён в примечании, но собственная образность текста не устранена.
- issue: К чему относится выражение «на небе и в мире»
  choice: Сохранено рядом с упоминанием власти Уриила над небесными светилами без синтаксического уточнения сверх исходного текста.
  alternative: Однозначно отнести выражение либо к назначению Уриила, либо непосредственно к местонахождению светил.
  rationale: Формулировка исходного текста допускает некоторую синтаксическую напряжённость; перевод не разрешает её догматически или космологически.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис длинного периода сохранён, но расчленён тире и двоеточием для ясности. Избегаются как излишняя архаизация, так и модернизирующая астрономическая терминология.
