base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/006.yaml
  text: When the twelve other portals in heaven[a], at the ends of the earth, are opened[c][b], from which the sun and the moon and the stars come out.
translation:
  language: ru
  text: Когда открываются двенадцать небесных врат[a] у краёв земли[b], из них выходят солнце, луна и звёзды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проходов», «отверстий»; эфиопское слово обозначает проёмы в небесной структуре.'
