  - marker: b
    text: Выражение «края земли» отражает древние космологические представления, а не современное научное описание.
    reason: cultural_note
lexical_decisions:
- source_word: ሶበ
  choice: Когда
  rationale: В данном сочетании вводит временное придаточное; перевод «когда» сохраняет синтаксическую незавершённость стиха.
- source_word: ይትረኃዉ
  choice: открываются
  rationale: Форма передаёт открывание врат, а не простое указание на их существование.
- source_word: ፲ሥሩ ወካልእ
  choice: двенадцать
  rationale: Сочетание понято как числительное «двенадцать» (десять и два), в согласии с шестью восточными и шестью западными вратами в ближайшем контексте; отдельное «другие» не добавлено.
- source_word: ኃዋላወ
  choice: врат
  rationale: В космологическом описании обозначает проходы или отверстия небесной структуры; «врата» естественно сочетаются с глаголом «открываться» и сохраняют конкретный образ.
- source_word: በሰማይ
  choice: небесных
  rationale: Прилагательное естественно передаёт местонахождение врат на небе и сохраняет возвышенный космологический регистр.
- source_word: ዲበ አጽናፈ ምድር
  choice: у краёв земли
  rationale: Сохраняет древний образ пределов земли, не заменяя его современной астрономической терминологией.
- source_word: እለ እምኔሆሙ ይወፅእ
  choice: из которых выходят
  rationale: Сохраняет относительную связь с вратами и конкретное движение небесных светил наружу.
- source_word: ፀሐይ ወወርኅ ወከዋክብት
  choice: солнце, луна и звёзды
  rationale: Естественное русское перечисление всех трёх названных небесных тел.
theological_decisions:
- issue: Космологический образ небесных врат и краёв земли
  choice: Сохранить конкретные выражения «небесные врата» и «края земли»
  alternative: Передать их как направления горизонта или астрономические сектора
  rationale: Текст описывает устройство мира посредством древней апокалиптической космологии; перевод не должен модернизировать или демифологизировать этот образ.
- issue: Синтаксическая незавершённость стиха
  choice: Сохранить придаточное с «когда» без добавления главного предложения
  alternative: 'Преобразовать стих в самостоятельное утверждение: «Есть двенадцать врат…»'
  rationale: Источник начинает временную конструкцию, и перевод не восполняет подразумеваемое продолжение толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной лексикой. Конкретная космологическая образность и незавершённая временная конструкция оригинала сохранены; избыточное «другие» не внесено.
