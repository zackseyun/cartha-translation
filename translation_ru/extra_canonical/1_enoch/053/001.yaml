base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/053/001.yaml
  text: There my eyes saw a valley whose mouths were open and deep; and all who dwell on the dry land and the sea and the islands will bring gifts and offerings and presents to it, yet that deep valley will not be filled.
translation:
  language: ru
  text: Там глаза мои увидели долину, отверстия которой были открыты и глубоки[a]. И все живущие на суше, на море и на островах принесут в неё дары, приношения и подношения[b], но та глубокая долина не наполнится.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфиопский текст в описании отверстий долины труден. Буквально употреблён образ её «уст» или «ртов»; здесь оба определения — «открыты» и «глубоки» — отнесены к ним. Возможно также понимание: «долину, открытую и глубокую своими устами».'
    reason: textual_variant
  - marker: b
    text: Три употреблённых здесь слова близки по значению и могут обозначать дары или дань, приносимые из всех областей мира.
    reason: lexical_alternative
lexical_decisions:
- source_word: በህየ
  choice: Там
  rationale: Сохраняет указательное, локативное значение и естественно вводит новую сцену видения.
- source_word: ርእያ አዕይንትየ
  choice: глаза мои увидели
  rationale: Передаёт явную эмфатическую формулу зрительного восприятия, не сводя её к простому «я увидел».
- source_word: ቈላ
  choice: долина
  rationale: Широкий и верный эквивалент для долинообразной впадины в апокалиптическом пейзаже; «ущелье» было бы более истолковывающим.
- source_word: ርኁወ ወዕሙቀ አፈዊሁ
  choice: устья которой были открыты и глубоки
  rationale: Сохраняет координацию прилагательных «открыты и глубоки» и образ множественных «уст» долины. Русское «устья» передаёт метафору естественнее, чем буквальное «рты».
- source_word: የኃድሩ
  choice: живущие
  rationale: Современный литературный эквивалент глагола обитания, понятный без архаизации.
- source_word: ዲበ የብስ ወባሕር ወደሰያት
  choice: на суше, на море и на островах
  rationale: Сохраняет трёхчастное географическое перечисление и противопоставление суши морю.
- source_word: አምኃ ወአስካዓ ወጋዳ
  choice: дары, приношения и подношения
  rationale: Передаёт накопление трёх близких по значению существительных, не сводя их к одному общему понятию.
- source_word: ይመጽኡ ሎቱ
  choice: принесут в неё
  rationale: Хотя глагол буквально обозначает приход, перечисленные предметы дают контекстуальное значение принесения; «в неё» соответствует направлению к долине.
- source_word: ወዝኩስ ዕሙቅ ቈላ ኢይመልእ
  choice: но та глубокая долина не наполнится
  rationale: Сохраняет простое будущее значение и зловещий образ ненаполняемой долины, не усиливая его до «не может наполниться».
theological_decisions:
- issue: Характер того, что жители мира несут в долину
  choice: В долину приносят материальные дары и приношения
  alternative: Жители лишь приходят к ней; либо перечисление метафорически означает почести
  rationale: Три конкретных существительных при глаголе движения поддерживают образ приносимых предметов. Перевод сохраняет апокалиптическую предметность и не аллегоризирует её.
- issue: Образ устьев долины
  choice: Сохранён множественный образ «устьев», которые открыты и глубоки
  alternative: Сгладить до «глубокой долины с зияющими отверстиями»
  rationale: Формулировка удерживает необычный и неоднозначный образ исходного текста, не распределяя произвольно определения между долиной и её отверстиями.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным ритмом. Эмфатическое «глаза мои увидели» сохранено ради визионерского регистра; необычная образность долины не сглажена. Союзное нагнетание оригинала передано перечислением, но синтаксис адаптирован к естественной русской речи.
