base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/053/003.yaml
  text: For I saw all the angels of punishment lodging there and preparing all the instruments of Satan[a][b][c].
translation:
  language: ru
  text: Ибо я увидел всех ангелов наказания, пребывавших там[b] и готовивших все орудия Сатаны[a][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Предоставленная эфиопская транскрипция обрывается после слов «и готовили». Продолжение «все орудия Сатаны» восстановлено по полной форме стиха, засвидетельствованной в критических изданиях; в ней читается: ኵሎ ንዋየ ሰይጣን.'
    reason: textual_variant
  - marker: b
    text: 'Или: «остававшихся там», «находившихся там». Эфиопский глагол обозначает пребывание или остановку в каком-либо месте.'
    reason: lexical_alternative
  - marker: c
    text: Выражение «орудия Сатаны» может обозначать орудия, принадлежащие Сатане или связанные с ним; сама грамматическая форма не уточняет это отношение.
    reason: theological_ambiguity
lexical_decisions:
- source_word: እስመ
  choice: Ибо
  rationale: Сохраняет пояснительную связь с предыдущим высказыванием и уместно в возвышенном повествовании.
- source_word: ርኢክዎሙ
  choice: я увидел
  rationale: Прямо передаёт форму первого лица в рассказе о видении; местоименный объект раскрывается последующей именной группой.
- source_word: ኵሎሙ
  choice: всех
  rationale: Сохраняет всеохватность исходного выражения.
- source_word: መላእክተ መቅሠፍት
  choice: ангелов наказания
  rationale: Передаёт принадлежность ангелов к исполнению карательного суда, не уточняя сверх текста характер наказания.
- source_word: እንዘ የኃድሩ
  choice: они пребывали там
  rationale: Передаёт значение нахождения или оставания в данном месте, не предполагая ни постоянного жилища, ни временного лагеря.
- source_word: ወያስተዴ
  choice: и готовили
  rationale: Естественно передаёт действие приготовления; продолжение фразы реконструируется по полной форме стиха в критической традиции и контексту.
- source_word: ኵሎ ንዋየ ሰይጣን
  choice: все орудия сатаны
  rationale: Сохраняет квантор «все» и широкое значение предметов или средств, предназначенных для действия; «орудия» естественно в контексте наказания.
theological_decisions:
- issue: Объект приготовления отсутствует в предоставленной обрезанной строке Ge'ez
  choice: включить в основной текст «все орудия сатаны» с текстологической сноской
  alternative: 'оставить фразу незавершённой: «и готовили»'
  rationale: Предоставленная транскрипция обрывается после глагола, однако данные о полной форме стиха указывают на чтение ኵሎ ንዋየ ሰይጣን. Сноска ясно различает видимый текст строки и восстановленное продолжение.
- issue: Смысл родительного сочетания «орудия сатаны»
  choice: сохранить грамматически неоднозначное «орудия сатаны»
  alternative: истолковать как «орудия для наказания сатаны» или «сатанинские орудия»
  rationale: Русское сочетание сохраняет возможную неоднозначность принадлежности или отношения и не решает богословский вопрос, не решённый самой формой.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейско-апокалиптическим звучанием. «Ибо» сохраняет связность рассуждения; «пребывали» и «орудия» dignified but broadly understandable. Пунктуация делает два одновременных действия ангелов ясными без устранения текстологической и богословской неоднозначности.
