base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/053/002.yaml
  text: And their hands commit lawless deeds[a], and all who support their lawless deeds the sinners devour. And the sinners shall be destroyed from before the Lord of Spirits, and from the face of his earth they shall be uprooted[d][c][b], and they shall not remain forever and ever.
translation:
  language: ru
  text: И руки их совершают беззаконные дела[a], а всех, кто поддерживает их беззаконие, грешники пожирают. И грешники будут уничтожены пред Господом духов, и с лица Его земли будут искоренены[b], и не останутся во веки веков.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфиопский текст этой строки труден. Возможно буквальное чтение: «И Мои цепи будут делать их руки; и все, кто алчет Моих цепей, — грешники — съедят их». Образ может означать, что орудия суда станут уделом самих грешников.'
    reason: lexical_alternative
  - marker: b
    text: 'Переданное в источнике чтение глагола, вероятно, испорчено при распознавании текста; предполагаемое чтение означает «будут искоренены». Возможна более общая передача: «будут удалены» или «изгнаны».'
    reason: textual_variant
  - marker: c
    text: 'Отрицательная частица в источнике отмечена как неуверенная. При ином чтении возможно: «и погибнут во веки веков».'
    reason: textual_variant
lexical_decisions:
- source_word: ጌጋየ
  choice: беззаконные дела
  rationale: В данном контексте слово передаёт совершённое руками зло или беззаконие. Однако форма и чтение трудны и допускают конкретный образ «Моих цепей», который сохранён в сноске.
- source_word: እደዊሆሙ ይገብሩ
  choice: руки их совершают
  rationale: Буквально сохраняет упоминание рук и обычное значение глагола «делать, совершать», не уточняя способ действия.
- source_word: ዘይጻምዉ ለጌጋይ
  choice: кто поддерживает их беззаконие
  rationale: Контекстуальное прочтение сжатой и неясной фразы; буквальная возможность «кто алчет Моих цепей» отмечена в сноске.
- source_word: ኃጥኣን ይበልዑ
  choice: грешники пожирают
  rationale: Глагол буквально означает «есть». «Пожирают» сохраняет резкость образа и естественно звучит при людях как объекте.
- source_word: እምገጸ ለእግዚአ መነፈሳት
  choice: пред Господом духов
  rationale: Естественная русская передача устойчивой енохической формулы удаления от лица или присутствия Господа духов.
- source_word: ይትሐጐሉ
  choice: будут уничтожены
  rationale: Передаёт суровый итог суда, хотя форма может подразумевать изгнание или удаление; эта неоднозначность не используется для определения природы окончательной участи.
- source_word: ይትቀወሙ (вероятное искажённое чтение ይትነቀሉ)
  choice: будут искоренены
  rationale: «Искоренены» соответствует вероятному исходному глаголу и образу удаления с земли; переданное чтение, по-видимому, возникло из-за ошибки распознавания.
- source_word: ወ[ኢ]ያነልቁ ለዓለመ ዓለም
  choice: и не останутся во веки веков
  rationale: Сохраняет отрицательную частицу, отмеченную в источнике как неуверенную, и буквально выражает окончательность удаления без замены её словом «погибнут».
theological_decisions:
- issue: Характер окончательного суда над грешниками
  choice: Грешники навсегда удаляются из присутствия Господа и с Его земли; текст не уточняет метафизический характер их участи.
  alternative: «Погибнут во веки веков», что может звучать как прямое утверждение об уничтожении.
  rationale: Финальная фраза текстуально неустойчива и буквально может означать «не останутся». Такой перевод сохраняет окончательность суда, не разрешая сверх текста вопрос об уничтожении или вечном исключении.
translation_notes:
  register: 'Современный литературный русский с достоинством апокалиптической речи. Формулы «Господь духов», «с лица Его земли» и «во веки веков» сохранены как узнаваемая библейская образность. Неясная первая строка не сглажена без оговорки: контекстуальный вариант помещён в основном тексте, а конкретный образ цепей полностью сохранён в сноске.'
