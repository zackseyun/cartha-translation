base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/008.yaml
  text: Woe to you who acquire silver and gold not by righteousness[a], and say, ‘We have become rich with wealth, and we have acquired possessions[c][b], and we have acquired everything we desired.’
translation:
  language: ru
  text: 'Горе вам, приобретающим серебро и золото не по праведности[a] и говорящим: «Мы разбогатели, у нас есть богатство, и мы приобрели всё, чего желали».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не в праведности»; выражение может указывать как на неправедный способ приобретения богатства, так и шире — на его неправедный нравственный характер.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ
  choice: Горе
  rationale: Сохраняет силу пророческой формулы обличения и грядущего суда.
- source_word: ታጠርዩ / አጥረይነ
  choice: приобретающим / приобрели
  rationale: Одинаковый русский корень передаёт риторическое повторение одного и того же эфиопского глагола, обозначающего приобретение или накопление.
- source_word: ብሩረ ወወርቀ
  choice: серебро и золото
  rationale: Прямо передаёт названия драгоценных материалов, не обобщая их до денег или имущества.
- source_word: ዘአኮ በጽድቅ
  choice: не по праведности
  rationale: Сохраняет нравственно-богословскую категорию праведности и допускает отнесение оборота как к способу приобретения, так и к его нравственному характеру.
- source_word: ብዕልነ ብዕለ
  choice: мы разбогатели
  rationale: Естественно выражает достигнутое состояние богатства; внутренняя этимологическая фигура источника по-русски без тяжеловесности не воспроизводится.
- source_word: ወኮነ ለነ ንዋይ
  choice: у нас есть богатство
  rationale: Передаёт отдельную фразу «богатство/имущество стало нашим» и не опускает её, сохраняя три последовательных хвастливых утверждения.
- source_word: ኵሎ ዘፈቀድነ
  choice: всё, чего желали
  rationale: Сохраняет всеохватность притязания и значение желания или воли.
theological_decisions:
- issue: Значение በጽድቅ в обличении неправедного богатства
  choice: по праведности
  alternative: справедливо; праведным путём
  rationale: Буквально близкая формулировка сохраняет этико-богословский смысл «праведности», не сводя выражение исключительно к законности или честности способа приобретения.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого обличения. Синтаксис сделан естественным для русского, при этом сохранены отдельная фраза о наличии богатства и повтор глагола приобретения.
