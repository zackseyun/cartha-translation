base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/004.yaml
  text: 'And you will become like them[d][c][b][a], against whom this word will be a witness: ‘You have become companions of sinners.’'
translation:
  language: ru
  text: 'И вы станете подобны тем, против кого это слово будет свидетельствовать: «Вы стали союзниками грешников».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Вы стали товарищами грешников»; возможно также: «Вы стали соучастниками грешников».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ትከውኑ
  choice: станете
  rationale: Будущая форма глагола «быть, становиться»; «станете» передаёт переход в новое состояние и естественно звучит в контексте предостережения.
- source_word: ከማሆሙ
  choice: подобны тем
  rationale: Сравнительный оборот передан кратко и естественно, без уточнения основания сходства.
- source_word: ሰማዕተ ይከውን ዴቤሆሙ ዝንቱ ነገር
  choice: против кого это слово будет свидетельствовать
  rationale: ሰማዕተ понимается как «свидетель, свидетельство», а не как форма глагола «слышать»; ዴቤሆሙ в судебно-обличительном контексте передано как «против кого».
- source_word: ዝንቱ ነገር
  choice: это слово
  rationale: ነገር допускает значения «слово, изречение, дело»; «слово» сохраняет ёмкость оригинала и соответствует функции свидетельства.
- source_word: ሱቱፋነ
  choice: сообщниками
  rationale: Слово обозначает участие и сопричастность; «сообщники» передаёт не просто соседство, а нравственно значимую связь с грешниками.
- source_word: ኮንክሙ
  choice: вы стали
  rationale: Результативная форма передана прошедшим временем, обозначающим уже наступившее состояние внутри цитируемого обвинения.
- source_word: ለኃጥኣን
  choice: грешников
  rationale: При существительном «сообщники» зависимое слово естественно оформляется родительным падежом; смысл связи или соучастия сохраняется.
theological_decisions:
- issue: Характер предостережения
  choice: Адресаты уподобятся осуждаемым через сопричастность грешникам, и слово выступит против них как свидетельство
  alternative: Простое утверждение, что адресаты сами являются грешниками, либо только судебный приговор без акцента на сопричастности
  rationale: Формулировка сохраняет одновременно нравственное предостережение, мотив уподобления и судебно-обличительную силу свидетельства, не развивая их в отдельную доктрину.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического предостережения. Судебная сила оборота о свидетельстве сохранена; синтаксис сделан ясным без устранения смыслового напряжения между будущим уподоблением и уже состоявшейся сопричастностью в цитируемом обвинении.
