base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/007.yaml
  text: Woe to you[a], sinners, who are in the midst of the sea and upon the dry land[b], whose memory is evil against you.
translation:
  language: ru
  text: 'Горе вам, грешники, находящиеся посреди моря и на суше[b]: память о вас — вам во зло.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительная фраза трудна для понимания. Возможны значения: «память о вас зла», «ваша память (или памятование о вас) вам во зло» либо «дурная память держится за вами».'
    reason: lexical_alternative
  - marker: b
    text: 'Сочетание «посреди моря и на суше», вероятно, служит всеохватным образом: обличение относится ко всем местам, где люди находятся или куда отправляются.'
    reason: cultural_note
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Горе вам
  rationale: Сохраняет формулу пророческого возвещения суда и естественно передаёт дательный оборот после междометия.
- source_word: ኃጥኣን
  choice: грешники
  rationale: Прямое и общепонятное обозначение тех, к кому обращено осуждение.
- source_word: ማእከለ፡ ባሕር
  choice: посреди моря
  rationale: Передаёт пространственный образ буквально, не обобщая его до значения «в море».
- source_word: ወዲበ፡ የብስ
  choice: и на суше
  rationale: Сохраняет выраженное противопоставление моря и сухой земли; по-русски «на суше» звучит естественно.
- source_word: ዝክርሙ
  choice: память о вас
  rationale: Передаёт возможный смысл памяти, упоминания или сохраняющейся репутации, не сводя слово только к личному воспоминанию.
- source_word: እኩይ፡ ዴቤክሙ
  choice: вам во зло
  rationale: Естественно передаёт неблагоприятную направленность заключительных слов, не уточняя сверх источника, каким именно образом память свидетельствует против грешников.
theological_decisions:
- issue: Смысл заключительной фразы о памяти
  choice: память о вас — вам во зло
  alternative: память о вас зла; дурная память держится за вами; память о вас свидетельствует против вас
  rationale: Эфиопская фраза лексически и синтаксически трудна. Выбранная формулировка сохраняет её судебный и неблагоприятный оттенок, но не превращает возможный смысл в однозначное толкование.
- issue: Охват образа моря и суши
  choice: сохранить оба пространственных образа
  alternative: 'передать обобщённо: «где бы вы ни были»'
  rationale: Конкретная образность источника может указывать на всеобщий охват обличения, однако перевод не должен заменять образ его истолкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого возгласа. Синтаксис сделан ясным для обычного читателя, а двоеточие отделяет обращение и описание адресатов от трудной заключительной фразы. Необычный оборот «вам во зло» намеренно сохраняет смысловую напряжённость источника.
