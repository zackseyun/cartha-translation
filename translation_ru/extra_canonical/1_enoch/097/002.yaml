base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/002.yaml
  text: Know that the Most High remembers your destruction[c][b][a], and the angels of heaven rejoice over your destruction.
translation:
  language: ru
  text: Знайте, что Всевышний помнит о вашей погибели[a], и небесные ангелы радуются вашей погибели.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «о вашем крушении», «о вашем падении»; то же слово повторено далее.'
    reason: lexical_alternative
  - marker: b
    text: 'Глагольные формы можно передать и будущим временем: «Всевышний вспомнит о вашей погибели, и небесные ангелы возрадуются вашей погибели».'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: እሙረ፡ ይከውን፡ ለክሙ
  choice: Знайте
  rationale: Вся конструкция представляет собой идиому со значением «да будет вам известно»; краткое «Знайте» естественно передаёт её предупредительную силу по-русски, не выделяя ይከውን как отдельное предсказание.
- source_word: እስመ
  choice: что
  rationale: После идиомы знания союз вводит содержание того, что адресатам следует знать; поэтому здесь уместно «что», а не причинное «потому что».
- source_word: ልዑል
  choice: Всевышний
  rationale: Устоявшийся русский эквивалент возвышенного божественного титула в библейской и апокалиптической речи.
- source_word: ይዜከር
  choice: помнит
  rationale: Настоящее время передаёт уверенность высказывания и допустимый контекстуальный смысл формы; по-русски управление «помнит о» естественнее буквального переходного оборота с «погибелью».
- source_word: ሐጕልክሙ / ሐጕለ ዚአክሙ
  choice: ваша погибель
  rationale: «Погибель» передаёт тяжесть бедствия и окончательного падения, относится к самим адресатам и позволяет сохранить лексический повтор обеих исходных конструкций.
- source_word: ይትፌሥሑ
  choice: радуются
  rationale: Прямо передаёт сильный глагол радости, не смягчая сурового образа.
- source_word: መላእክተ፡ ሰማይ
  choice: небесные ангелы
  rationale: Естественное современное русское обозначение ангелов неба, сохраняющее апокалиптический образ.
theological_decisions:
- issue: Радуются ли небесные ангелы непосредственно погибели нечестивых
  choice: Сохранено прямое утверждение, что ангелы радуются погибели адресатов.
  alternative: Истолковать их радость как одобрение Божьего правосудия либо заменить радость наблюдением за судом.
  rationale: Глагол радости в геэзском тексте недвусмыслен, а дополнение указывает на погибель адресатов. Суровое богословское напряжение апокалиптической речи не следует смягчать толкованием.
- issue: Временная отнесённость глаголов ይዜከር и ይትፌሥሑ
  choice: 'В основном тексте использовано настоящее время: «помнит» и «радуются».'
  alternative: 'Будущее время: «вспомнит» и «возрадуются».'
  rationale: Формы допускают контекстуальное настоящее или будущее. Настоящее выражает пророческую уверенность, а реальная временная неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным апокалиптическим тоном. Обращение передано формой множественного числа «Знайте». Лексический повтор «вашей погибели» сохранён намеренно; суровый образ ангельской радости не смягчён.
