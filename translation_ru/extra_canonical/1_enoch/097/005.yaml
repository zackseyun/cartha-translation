base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/005.yaml
  text: And in those days the prayers of the holy ones will reach the Lord[b][a], and the days of your judgment will come upon you.
translation:
  language: ru
  text: И в те дни молитвы святых[a] достигнут Господа, а вас настигнут дни суда[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «молитвы праведников». Буквально эфиопское слово означает «святые» и само по себе не уточняет, идёт ли речь о людях или небесных существах.'
    reason: lexical_alternative
  - marker: b
    text: Последняя фраза в данном текстовом свидетельстве трудна для истолкования; вероятно, речь идёт о приближающемся времени суда или наказания нечестивых.
    reason: textual_variant
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: в те дни
  rationale: Сохраняет стандартную апокалиптическую временную формулу и повторяющийся образ «дней».
- source_word: ትበጽኅ ጸሎቶሙ
  choice: молитвы ... достигнут
  rationale: Передаёт движение к цели, выраженное глаголом, и естественно сочетается с последующим указанием «Господа».
- source_word: ለቅዱሳን
  choice: святых
  rationale: Передаёт буквальное значение «святые» и сохраняет неясность относительно того, имеются ли в виду праведники, ангелы или более широкая категория.
- source_word: ኀበ እግዚእ
  choice: Господа
  rationale: При глаголе «достигнут» беспредложный родительный падеж естественно передаёт направленность к Господу.
- source_word: ይበጽሕ መዋዕለ ኵነክሙ
  choice: вас настигнут дни суда
  rationale: Сохраняет образ приближающихся «дней» и их враждебную направленность к адресатам; «суд» выражает судебно-апокалиптический смысл, не сужая его до физического уничтожения.
theological_decisions:
- issue: Кого обозначает ቅዱሳን
  choice: Оставлено обобщённое «святые»
  alternative: «праведники» или «ангелы»
  rationale: Контекст, вероятно, указывает на молитвы страдающих праведников, однако исходный термин допускает более широкое понимание, поэтому перевод не устраняет эту неоднозначность.
- issue: Характер грядущего воздаяния
  choice: «дни суда»
  alternative: «дни наказания» или «дни гибели»
  rationale: «Суд» сохраняет судебную и эсхатологическую напряжённость контекста, не уточняя сверх источника вид или итог наказания.
translation_notes:
  register: Современный литературный русский язык с торжественной апокалиптической интонацией. Параллелизм двух частей сохранён; повтор одного и того же глагольного корня передан различными естественными русскими глаголами «достигнут» и «настигнут».
