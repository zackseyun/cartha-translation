base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/003.yaml
  text: What will you do[a], you sinners, and where will you flee on that day of judgment[b], when you hear the voice of the prayer of the righteous?
translation:
  language: ru
  text: Что вы будете делать, грешники, и куда побежите в тот день суда[b], когда услышите голос[a] молитвы праведников?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «звук»; соответствующее слово также может означать «слово».'
    reason: Сохранена лексическая многозначность геэзского ቃል.
  - marker: b
    text: 'Возможны также значения: «бедствия», «наказания» или «осуждения».'
    reason: Существительное допускает несколько близких оттенков судебно-карательного смысла.
lexical_decisions:
- source_word: ምንተ፡ ትገብሩ
  choice: Что вы будете делать
  rationale: Вопросительное слово с формой имперфекта во множественном числе в контексте грядущего воздаяния естественно передаётся будущим временем.
- source_word: ኃጥኣን
  choice: грешники
  rationale: Сохранено прямое обращение и обличительный пророческий тон.
- source_word: አይቴ፡ ትጐይዩ
  choice: куда побежите
  rationale: Глагол обозначает быстрое движение, в данном контексте — попытку спастись бегством; «побежите» естественно по-русски и не усиливает значение сверх исходного текста.
- source_word: በይእቲ፡ ዕለት፡ እንተ፡ ጽነፄ
  choice: в тот день суда
  rationale: Передаёт временную формулу и судебно-карательный смысл контекста, сохраняя характерный апокалиптический оборот.
- source_word: ሶበ፡ ትሰምዑ
  choice: когда услышите
  rationale: Сохраняет временную зависимость и будущую направленность высказывания.
- source_word: ቃለ፡ ጸሎቶሙ፡ ለጻድቃን
  choice: голос молитвы праведников
  rationale: ቃል может означать «голос», «звук» или «слово»; при слове «молитва» вариант «голос» передаёт слышимую мольбу естественнее, чем «звук», а «праведников» сохраняет субстантивированное множественное число.
theological_decisions:
- issue: Роль молитвы праведников в сцене суда
  choice: Грешники слышат молитву праведников в момент судебного воздаяния.
  alternative: Речь может пониматься как слышимый вопль самих праведников либо шире — как их обвинение или свидетельство.
  rationale: В геэзском тексте прямо названа «молитва»; буквальное сохранение этого слова не отождествляет её без достаточных оснований ни с обвинением, ни только с криком.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и обличительная фраза. Сохранены прямое обращение к грешникам, апокалиптическая формула «в тот день» и неоднозначность ключевых слов посредством сносок.
