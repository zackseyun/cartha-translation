base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/006.yaml
  text: And all the words of your lawlessness shall be read out before the Great Holy One[a], and your faces shall be put to shame[c][b], and every deed that is founded in lawlessness shall be rejected.
translation:
  language: ru
  text: И все слова вашего беззакония будут зачитаны перед Великим Святым[a], и лица ваши будут посрамлены, и всякое дело, основанное на беззаконии, будет отвергнуто[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё, относящееся к вашему беззаконию»; слово ነገር может обозначать не только «слово», но также «дело» или «предмет».'
    reason: lexical_alternative
  - marker: b
    text: 'Последнюю часть можно также перевести: «всякое дело, совершённое в беззаконии, будет отброшено». Глагол, определяющий «дело», по-видимому, выражает утверждённость или укоренённость, однако точный оттенок не вполне ясен.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትነበብ
  choice: будут прочитаны
  rationale: Страдательная форма с будущим значением передаёт публичное оглашение при суде; русский контекст естественно выражает это глаголом «прочитаны».
- source_word: ኵሉ ነገረ
  choice: все слова
  rationale: ነገር допускает значения «слово», «дело», «предмет». С глаголом «читать» значение «слова» лучше сохраняет образ публично зачитываемой записи, а более широкая возможность отмечена в сноске.
- source_word: ዓመፃክሙ
  choice: вашего беззакония
  rationale: Слово обозначает мятежную неправедность и может включать насилие и несправедливость. «Беззаконие» сохраняет широкий нравственно-судебный смысл.
- source_word: ቅድመ ዐቢይ ቅዱስ
  choice: перед Великим Святым
  rationale: Последовательность определений сохранена без добавления отсутствующего в источнике союза; прописные буквы показывают, что это божественный титул.
- source_word: ይትኀፈር ገጽክሙ
  choice: лица ваши будут посрамлены
  rationale: Передан пассивный смысл «быть посрамлёнными» без добавления отсутствующего в источнике образа покрытия стыдом; инверсия поддерживает достойный библейский регистр.
- source_word: ይገደፍ
  choice: будет отвергнуто
  rationale: В судебном контексте глагол выражает отвержение или отбрасывание; «отвергнуто» ясно передаёт силу приговора, не подразумевая уничтожения.
- source_word: ተግባረ
  choice: дело
  rationale: Речь идёт о конкретном нравственном поступке; «дело» естественно для русского библейского и судебного контекста.
- source_word: ዘጸንዐ በዓመፃ
  choice: утверждённое в беззаконии
  rationale: Формулировка сохраняет значение закреплённости или укоренённости во зле, не ослабляя его до общего «совершённое в беззаконии».
theological_decisions:
- issue: Передача божественного титула ዐቢይ ቅዱስ
  choice: Великий Святой
  alternative: Великий и Святой
  rationale: Избранный вариант следует порядку слов геэзского текста и не добавляет союза, одновременно сохраняя титульный и благоговейный характер выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, судебно-апокалиптическим звучанием. Синтаксис близок к источнику, но остаётся понятным; подлинная лексическая неоднозначность вынесена в сноски.
