    reason: lexical_alternative
lexical_decisions:
- source_word: ንግበር
  choice: сделаем
  rationale: Форма первого лица множественного числа передаёт побуждение говорящих к совместному действию; по-русски естественное «сделаем» сохраняет оттенок самоуверенного призыва.
- source_word: ዘኀለይነ
  choice: то, что задумали
  rationale: Глагол охватывает мысль и замысел; в контексте намеренного действия «задумали» сохраняет эту смысловую широту лучше, чем нейтральное «подумали».
- source_word: ብሩረ
  choice: серебро
  rationale: Сохранено конкретное обозначение драгоценного металла, а не обобщённое «деньги».
- source_word: አስተጋባእነ
  choice: собрали
  rationale: Прямо передаёт собирание и накопление без усилительного толкования.
- source_word: መዛግብቲነ
  choice: наши хранилища
  rationale: Слово обозначает места хранения сокровищ или запасов; «хранилища» естественно по-русски и не сужает смысл до казны.
- source_word: ከመ ማይ
  choice: словно водой
  rationale: Сохранено необычное буквальное сравнение; творительный падеж естественно связывает его с глаголом «наполнили».
- source_word: ሐራስተ
  choice: работников
  rationale: Контекст указывает на земледельческих работников, однако более общее «работников» сохраняет неопределённость объёма значения.
- source_word: አብያቲነ
  choice: в наших домах
  rationale: Сохранено основное значение «дома»; контекстуальные варианты «хозяйства» или «владения» вынесены в примечание.
