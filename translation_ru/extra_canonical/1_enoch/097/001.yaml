base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/001.yaml
  text: Trust[a], you righteous, for sinners will become a disgrace[b], and they will perish on the day of iniquity.
translation:
  language: ru
  text: Верьте[a], праведники, ибо грешники станут предметом презрения и погибнут в день беззакония.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Будьте уверены». Объект веры или доверия в исходном тексте не назван.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ተአመኑ
  choice: Верьте
  rationale: Повелительное наклонение множественного числа выражает веру или уверенность; перевод сохраняет не названный в тексте объект веры.
- source_word: ጻድቃን
  choice: праведники
  rationale: Форма обращения во множественном числе; русское обращение передаёт противопоставление праведников грешникам.
- source_word: ለጽእለት
  choice: предметом презрения
  rationale: Передаёт участь, связанную с презрением, поношением и позором, не сводя смысл лишь к внутреннему чувству стыда.
- source_word: ይከውኑ
  choice: станут
  rationale: Сохраняет будущее значение становления или наступившего состояния.
- source_word: ኃጥኣን
  choice: грешники
  rationale: Естественное религиозно-нравственное обозначение, сохраняющее явное противопоставление праведникам.
- source_word: ወይትሐጕሉ
  choice: и погибнут
  rationale: Глагол от корня со значением гибели или уничтожения; контекст следующего стиха также поддерживает значение «погибнут», а не «будут преданы».
- source_word: በዕለተ ዓመፃ
  choice: в день беззакония
  rationale: ዓመፃ здесь обозначает беззаконие, неправду или мятежное нечестие; «беззаконие» естественно для апокалиптического контекста.
theological_decisions:
- issue: Выражает ли начальное повеление внутреннюю уверенность или собственно религиозную веру
  choice: Верьте
  alternative: Будьте уверены; уповайте
  rationale: «Верьте» сохраняет и религиозный, и более общий оттенок доверия, не добавляя отсутствующий в исходном тексте объект; «уповайте» сильнее подразумевало бы конкретного адресата упования.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным апокалиптическим звучанием. Синтаксис остаётся доступным, а причинная связь передана союзом «ибо».
