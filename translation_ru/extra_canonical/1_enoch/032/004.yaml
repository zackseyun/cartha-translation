base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/004.yaml
  text: And it looked like the carob tree[a], and its fruit was like clusters of good grapes, very beautiful[d][c][b]; and the fragrance of that tree spread far away.
translation:
  language: ru
  text: По виду оно напоминало рожковое дерево[a], а плоды его были подобны гроздьям хорошего винограда и были очень красивы; благоухание этого дерева разносилось далеко.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Рожковое дерево — вечнозелёное средиземноморское дерево (Ceratonia siliqua); это отождествление подтверждается сохранившимся греческим текстом данного стиха.
    reason: lexical_identification
lexical_decisions:
- source_word: ይመስል
  choice: видом оно напоминало
  rationale: Передаёт зрительное сходство и естественно вводит сравнение в описании дерева.
- source_word: ሐመረ ጽራእ
  choice: рожковое дерево
  rationale: Выражение обозначает рожковое дерево (Ceratonia siliqua); это также подтверждается греческим κερατία.
- source_word: ፍሬሁ
  choice: плоды его
  rationale: Конкретное обозначение плодов дерева; множественное число естественно по-русски при дальнейшем сравнении с гроздьями.
- source_word: ከመ እስካለ ወይን
  choice: подобны гроздьям винограда
  rationale: Сохраняет сравнение с плодом виноградной лозы и передаёт образ естественным современным русским языком.
- source_word: ሠናይ ጥቀ
  choice: прекрасным весьма
  rationale: Передаёт положительную оценку ሠናይ и усилитель ጥቀ; слегка возвышенный порядок слов соответствует достоинству древнего повествования.
- source_word: ጼናሁ
  choice: благоухание
  rationale: В контексте дивного дерева речь идёт о приятном запахе; «благоухание» точно и литературно.
- source_word: የሐውር ነዋኃ
  choice: разносилось далеко
  rationale: Передаёт распространение запаха на большое расстояние без излишней буквальности.
