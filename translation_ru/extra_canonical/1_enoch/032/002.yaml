base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/002.yaml
  text: And from there I went above the summits of those mountains[a], far to the east, and I crossed over the Erythraean Sea; and I went far from it[c][b], and passed above the angel Zutel.
translation:
  language: ru
  text: И оттуда я пошёл над вершинами тех гор, далеко на восток, пересёк Эритрейское море[a], удалился далеко от него[b] и прошёл над ангелом Зутэлем[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Красное море». В древности название «Эритрейское море» могло обозначать более обширную акваторию, чем современное Красное море.'
    reason: lexical_alternative
  - marker: b
    text: Эфиопская фраза, переведённая как «удалился далеко от него», трудна; по-видимому, речь идёт о продолжении пути прочь от моря.
    reason: textual_variant
  - marker: c
    text: В других изданиях и переводах имя ангела может передаваться иначе, например «Зутаэл».
    reason: textual_variant
lexical_decisions:
- source_word: መልዕልተ ርእሶሙ ለእልኩ አድባር
  choice: над вершинами тех гор
  rationale: Буквальное «над головами» применительно к горам естественно означает их вершины; предлог сохраняет образ движения над ними, не уточняя его характера.
- source_word: እንዘ ርሑቅ ውእቱ ለጽባሕ
  choice: далеко на восток
  rationale: ጽባሕ здесь обозначает сторону восхода, то есть восток, а не утреннее время; перевод сохраняет указание направления и расстояния.
- source_word: ባሕረ ኤርትራ
  choice: Эритрейское море
  rationale: Сохранено древнее географическое наименование, которое могло иметь более широкое значение, чем современное Красное море.
- source_word: ወእምኔሁ ርሑቀ ተከንኩ
  choice: удалился далеко от него
  rationale: Эфиопская фраза трудна, но, по-видимому, описывает дальнейшее движение прочь от моря; русский перевод намеренно не конкретизирует способ передвижения.
- source_word: መልዕልተ ለመልአክ ዙጥኤል
  choice: над ангелом Зутэлем
  rationale: Повторно передано пространственное значение መልዕልተ; имя транслитерировано, а не переведено.
theological_decisions:
- issue: Наименование моря в апокалиптической географии
  choice: Эритрейское море
  alternative: Красное море
  rationale: Древнее название не следует без необходимости сводить к более узкому современному географическому понятию; так сохраняется историко-космографический горизонт текста.
- issue: Необычное движение над ангелом
  choice: прошёл над ангелом
  alternative: прошёл мимо ангела
  rationale: Источник повторяет тот же пространственный предлог, который ранее относится к вершинам гор. Более привычное «мимо» устранило бы необычность и возможную многозначность видения.
translation_notes:
  register: Современный литературный русский язык с сохранением размеренного повествовательного ритма и необычной пространственной образности апокалиптического видения. Все местоименные связи сделаны ясными без устранения отмеченной текстовой трудности.
