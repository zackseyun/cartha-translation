base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/003.yaml
  text: And I came into the garden of righteousness[a], and I saw beyond those trees many large trees growing there, with good fragrance, great and very beautiful and glorious; and the tree of wisdom[c][b], from which those who eat know great wisdom.
translation:
  language: ru
  text: И пришёл я в сад праведности и увидел по ту сторону тех деревьев[a] множество больших деревьев, росших там. Благоухание их было приятным; они были величественны, прекрасны и славны. Было там и дерево мудрости[b], от которого те, кто вкусит, познают великую мудрость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Пространственное выражение в эфиопском тексте трудно для истолкования; возможно также: «среди тех деревьев» или «рядом с теми деревьями».'
    reason: textual_variant
  - marker: b
    text: Текст вызывает в памяти образ священного сада, но называет это дерево «деревом мудрости», не повторяя наименования дерева из книги Бытие.
    reason: cross_reference
lexical_decisions:
- source_word: ገነት ጽድቅ
  choice: сад праведности
  rationale: «Сад» естественно передаёт ገነት и сохраняет образ священного сада; «праведности» передаёт нравственную характеристику ጽድቅ, не сужая её до юридической справедливости.
- source_word: ከሐክቲሆሙ ለእልክቱ ዕፀው
  choice: по ту сторону тех деревьев
  rationale: Фраза в данном эфиопском свидетельстве трудна; этот вариант сохраняет вероятное пространственное продвижение видения, а иные возможности отмечены в сноске.
- source_word: ዕፀወ ብዙኃነ ወዐቢይነ ይበቍሉ
  choice: множество больших деревьев, росших там
  rationale: Переданы как многочисленность, так и величина деревьев, а глагол роста сохранён без избыточного уточнения.
- source_word: ጼናሆሙ ሠናይ
  choice: благоухание их было приятным
  rationale: Естественная русская формулировка сохраняет положительную оценку их запаха и чувственную образность сада.
- source_word: ዐቢያን ወሥናሙ ብዙኅ ወስቡሓን
  choice: они были величественны, прекрасны и славны
  rationale: Сохранены отдельные оттенки величины, красоты и великолепия; ወስቡሓን не поглощено словом «прекрасны».
- source_word: ዕፀ ጥበብ
  choice: дерево мудрости
  rationale: Прямая передача сочетания сохраняет отсылку к древнему образу сада, не подменяя местное наименование формулой из Бытия.
- source_word: ዘእምኔሁ በሊዖሙ ይአምርዋ ለጥበብ ዐቢይ
  choice: от плодов которого вкусившие познают великую мудрость
  rationale: Передан результат вкушения и сохранён явный объект «великая мудрость». Слово «плодов» добавлено по смыслу для естественности русского выражения и отмечено в сноске.
theological_decisions:
- issue: Связь дерева мудрости с образом Эдема
  choice: дерево мудрости
  alternative: дерево познания; дерево познания добра и зла
  rationale: Геэзский текст прямо говорит о мудрости, а не воспроизводит полную формулу Бытия; буквальное наименование сохраняет аллюзию, не гармонизируя два текста.
- issue: Следствие вкушения от дерева
  choice: познают великую мудрость
  alternative: становятся мудрыми
  rationale: Так сохраняется явное существительное ጥበብ («мудрость») и напряжённая, лаконичная формулировка исходного текста.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис слегка приподнят, но понятен обычному читателю; архаизм «вкусившие» сохранён как уместный и прозрачный библейский оборот.
