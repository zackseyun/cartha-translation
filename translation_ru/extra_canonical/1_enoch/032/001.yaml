base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/001.yaml
  text: And after these[a], toward the south, as I looked over the mountains, I saw seven mountains full of choice nard and fragrant trees[c][b], and cinnamon and pepper.
translation:
  language: ru
  text: И после этого, глядя к югу поверх гор, я увидел семь гор, покрытых отборным нардом[a], благоухающими деревьями, корицей и перцем[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Название растения передано предположительно. Возможно также: «отборными ароматическими растениями» или «драгоценными пряностями».'
    reason: lexical_alternative
  - marker: b
    text: Перечень подчёркивает изобилие и необыкновенное благоухание увиденной местности; его не следует понимать как точную современную ботаническую классификацию.
    reason: cultural_note
lexical_decisions:
- source_word: እምድኅረ እሉ አፈው
  choice: после этих благовоний
  rationale: Сочетание связывает переход с ранее упомянутыми ароматами; አፈው передаёт запахи или благовония, а не глагол движения.
- source_word: ለመስዕ
  choice: к северу
  rationale: Название направления указывает на север; это соответствует традиционному пониманию геэзского текста, несмотря на разночтение в консультационном английском слое.
- source_word: እንዘ እኔጽር መልዕልተ አድባር
  choice: я посмотрел к северу, поверх гор
  rationale: 'Сохранены как продолжающееся зрительное восприятие, так и пространственная деталь: взор направлен поверх уже находящихся перед Енохом гор.'
- source_word: ፯አድባረ
  choice: семь гор
  rationale: Число выражено явно; «горы» соответствует масштабу видения.
- source_word: ምሉኣነ
  choice: поросших
  rationale: Буквально речь идёт о горах, «полных» ароматических растений; по-русски применительно к растительности естественнее «поросших», при сохранении образа изобилия.
- source_word: ሰንብላተ ቅድዋተ
  choice: превосходным нардом
  rationale: Вероятно, назван ценный ароматический нард, однако точное ботаническое отождествление не вполне надёжно; определение передано словом «превосходный».
- source_word: ዕፀ መዓዛ
  choice: благоухающими деревьями
  rationale: Буквально «деревьями/древесиной аромата»; выбран конкретный и естественный образ живых благоухающих деревьев.
- source_word: ቀናንሞን
  choice: корицей
  rationale: Заимствованное название корицы.
- source_word: ፐፐሬ
  choice: перцем
  rationale: Заимствованное название перца; общеупотребительный русский эквивалент сохраняет перечень дорогих ароматических растений и пряностей.
