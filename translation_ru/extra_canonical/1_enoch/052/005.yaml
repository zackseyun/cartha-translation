base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/005.yaml
  text: And that angel of peace answered[a], saying to me, 'Wait a little[c][b], and every hidden thing that the Lord of Spirits has enclosed will be revealed to you.'
translation:
  language: ru
  text: 'И тот ангел мира ответил мне: «Подожди немного[a], и тебе откроется всё сокрытое, что заключил[b] Господь духов».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Побудь немного»; повеление может означать ожидание, пребывание на месте или терпение в течение краткого времени.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «оградил», «удержал сокрытым»; глагол передаёт образ того, что заключено или скрыто до своего раскрытия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ፡ እንዘ፡ ይብለኒ
  choice: ответил мне
  rationale: Сочетание буквально передаёт ответ, сопровождаемый обращённой к рассказчику речью; в современном русском естественно вводит последующую прямую речь как «ответил мне».
- source_word: መልአከ፡ ሰላም
  choice: ангел мира
  rationale: Сохранено генитивное наименование, характерное для енохической традиции, без перефразирования как «мирный ангел».
- source_word: ጽናሕ፡ ንስቲተ
  choice: Подожди немного
  rationale: Императив допускает значения ожидания, пребывания и терпения; в данном контексте естественнее всего краткое повеление подождать.
- source_word: ይትከሠት
  choice: откроется
  rationale: Глагол обозначает раскрытие прежде скрытого и сохраняет апокалиптическую лексику откровения.
- source_word: ኵሉ፡ ዘኅቡእ
  choice: всё сокрытое
  rationale: Передана всеохватность выражения и его субстантивированное значение без искусственного добавления слова «вещи».
- source_word: ዘከለለ
  choice: что заключил
  rationale: Выбор сохраняет образ того, что было ограждено или удержано внутри, не сводя его однозначно к запечатыванию либо предопределённому сохранению.
- source_word: እግዚአ፡ መናፈስት
  choice: Господь духов
  rationale: Сохранён формульный божественный титул Книги Еноха и его буквальная структура.
theological_decisions:
- issue: Божественный титул እግዚአ መናፈስት
  choice: Господь духов
  alternative: Господь духовных сил
  rationale: Формульный титул оставлен без поясняющего истолкования природы «духов», чтобы не устранять присущую тексту смысловую открытость.
- issue: Характер сокрытия Господом
  choice: что заключил
  alternative: что сохранил в тайне
  rationale: Сохранён пространственный образ исходного глагола и не внесено дополнительное утверждение о цели или сроке сокрытия.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным строем. Прямая речь оформлена естественно для русского; формульный титул «Господь духов» и лексика откровения сохранены.
