lexical_decisions:
- source_word: ወኢይከውን
  choice: И ... не будет
  rationale: Сочетание союза ወ с отрицательной формой имперфекта ኢይከውን передаёт отрицательное будущее значение; формулировка сохраняет краткий пророческий строй исходной фразы.
- source_word: ኃጺን
  choice: железо
  rationale: Существительное прямо обозначает железо; контекст не требует расширять его значение до оружия или металла вообще.
- source_word: ለፀብእ
  choice: для войны
  rationale: Предлог ለ здесь обозначает назначение или употребление, а существительное — войну, сражение или военные действия. «Для войны» точно и лаконично сохраняет конструкцию оригинала.
theological_decisions:
- issue: Объём отрицания в краткой геэзской фразе
  choice: Железо больше не будет предназначено или употребляться для войны.
  alternative: Железо перестанет существовать либо не возникнет.
  rationale: Следующее за словом «железо» сочетание ለ с обозначением войны естественнее понимать как указание на функцию. При этом буквальная краткость сохранена в основном тексте, а пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык; краткая, возвышенная пророческая формулировка без архаизмов. Синтаксическая сжатость и некоторая неоднозначность оригинала сохранены.
