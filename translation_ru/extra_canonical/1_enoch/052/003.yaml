base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/003.yaml
  text: And I asked the angel who went with me[a], saying, “What are these things that I have seen in secret?”
translation:
  language: ru
  text: 'И я спросил ангела, который шёл со мной: «Что это за вещи, которые я увидел в тайне[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тайно», «в сокрытом месте». Геэзское выражение указывает на скрытость, но не вполне ясно, относится ли она к месту, к способу видения или к сокрытой природе увиденного.'
    reason: Лексическая и синтаксическая неоднозначность выражения በኅቡእ.
lexical_decisions:
- source_word: ተስእልክዎ
  choice: я спросил
  rationale: Глагол означает «спрашивать, вопрошать»; «спросил» естественно и точно передаёт его в современном литературном русском.
- source_word: መልአክ
  choice: ангела
  rationale: В апокалиптическом контексте речь идёт о небесном существе, поэтому «ангел» предпочтительнее общего «вестник».
- source_word: ዘምስሌየ የሐውር
  choice: который шёл со мной
  rationale: Относительное предложение обозначает сопровождающего Еноха ангела и сохраняет оттенок движения.
- source_word: እንዘ እብል
  choice: двоеточие перед прямой речью
  rationale: Стандартный источник-вводитель речи («говоря») по-русски естественно передаётся пунктуационным введением прямой речи без тяжеловесного «сказав».
- source_word: ምንት ውእቱ … እሙንቱ እሉ እለ
  choice: Что это за вещи, которые
  rationale: Формы указывают на несколько ранее увиденных предметов; такая конструкция сохраняет предметность и не заменяет их абстрактным «что всё это».
- source_word: በኅቡእ
  choice: в тайне
  rationale: Выражение передаёт скрытость, но допускает отнесение к месту, способу видения либо природе увиденного; буквальная формулировка сохраняет эту неоднозначность.
- source_word: ርኢኩ
  choice: я увидел
  rationale: Русский совершенный вид естественно выражает завершённое видение, непосредственно ставшее поводом для вопроса.
theological_decisions:
- issue: Значение በኅቡእ в контексте апокалиптического видения
  choice: в тайне
  alternative: тайно; в сокрытом месте; сокрытыми
  rationale: Перевод сохраняет мотив сокрытой реальности, не решая без достаточных оснований, относится ли скрытость к месту, способу видения или самим вещам.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования. Синтаксис сделан естественным для русского языка; неоднозначность ключевого выражения о скрытости сохранена в тексте и пояснена в сноске.
