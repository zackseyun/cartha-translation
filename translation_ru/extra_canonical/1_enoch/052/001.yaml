base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/001.yaml
  text: And after those days[a], in that place where I had seen all the visions of what is hidden, for I had been snatched up by a whirlwind[c][b], and it had carried me westward—
translation:
  language: ru
  text: И после тех дней, в том месте, где я видел все видения того, что сокрыто[a], ибо я был подхвачен вихрем[b][c] и он унёс меня на запад —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «все сокрытые видения». Геэзскую конструкцию можно понять и как «видения того, что сокрыто», и как «сокрытые видения».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «вихрем ветра» — усиленное выражение, обозначающее стремительное перенесение мощным ветром.'
    reason: cultural_note
  - marker: c
    text: 'Возможно также: «ибо вихрь подхватил меня и унёс на запад».'
    reason: previous_rendering
lexical_decisions:
- source_word: እምድኅረ እማንቱ መዋዕል
  choice: после тех дней
  rationale: Сохраняет формулу временной последовательности и указательную отдалённость እማንቱ («тех»), не сглаживая её до общего «позднее».
- source_word: በውእቱ መካን
  choice: в том месте
  rationale: Передаёт конкретное пространственное указание; መካን обычно означает место или местность.
- source_word: ርኢኩ ኵሎ ራእያተ ዘበኅቡእ
  choice: я видел все видения сокрытого
  rationale: Сохраняет возможное понимание относительной конструкции как указания на сокрытые реальности, при этом неоднозначность отмечена в сноске.
- source_word: እስመ
  choice: ибо
  rationale: Явно передаёт причинно-пояснительный союз и сохраняет подчинённый, вводный характер сообщения о перенесении Еноха.
- source_word: ተመሠጥኩ
  choice: я был подхвачен
  rationale: Пассивная конструкция передаёт внезапное и властное перемещение, не уточняя, было ли оно телесным или только визионерским.
- source_word: በአውሎጋኒ ነፋስ
  choice: вихрем
  rationale: Естественно передаёт образ сильного вращающегося ветра по-русски; буквальное усиление исходного выражения пояснено в сноске.
- source_word: ወወሰደኒ ዓረበ
  choice: и он унёс меня на запад
  rationale: Направительное значение ዓረበ передано как «на запад», а местоимение связывает действие с вихрем.
theological_decisions:
- issue: Природа визионерского перенесения
  choice: я был подхвачен вихрем
  alternative: дух ветра увлёк меня; бурный ветер унёс меня
  rationale: Формулировка сохраняет апокалиптический образ властного перенесения, но не решает, было ли оно телесным, духовным или экстатическим.
- issue: Синтаксическая незавершённость стиха
  choice: сохранить открытое продолжение при помощи тире
  alternative: превратить стих в самостоятельное законченное предложение
  rationale: Исходный стих служит обстоятельственным введением и переходит к основному действию следующего стиха; завершение мысли здесь исказило бы его структуру.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным апокалиптическим звучанием. Причинный союз «ибо» и парные тире сохраняют пояснительную конструкцию и намеренную незавершённость стиха, переходящего в 52:2.
