  - severity: low
    issue: «Все видения сокрытого» звучит несколько отвлечённо и тяжеловесно.
    rationale: «Все видения того, что сокрыто» сохраняет чтение, отражённое в английском аудите, и остаётся совместимым с отмеченной в сноске альтернативой «сокрытые видения».
