  terminology: «Вихрь», «подхвачен» и «на запад» удачно передают образ и направление. «Сокрытое» сохранено в основной формулировке как апокалиптический термин, но развёрнуто синтаксически для современного русского употребления. Сноска верно фиксирует альтернативное понимание определения.
