  to: И после тех дней, в том месте, где я видел все видения того, что сокрыто[a], ибо я был подхвачен вихрем[b][c] и он унёс меня на запад —
  rationale: Правка устраняет неестественное обособление причинной конструкции парными тире, сохраняя намеренную незавершённость стиха конечным тире. Также слегка развёрнуто «сокрытое» для естественного современного русского синтаксиса; ни одна из возможных трактовок геэзской относительной конструкции не исключается, поскольку альтернатива сохранена в сноске.
