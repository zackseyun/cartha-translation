  source_fidelity: 'Смысловые соответствия исходному геэзскому тексту в целом точны: сохранены временная формула «после тех дней», конкретное «в том месте», причинный союз እስመ («ибо»), принудительный характер перенесения и направление на запад. Однако оформление «, — ибо ... , —» создаёт в русском тексте искусственную парную вставку, которой исходный синтаксис не требует. Формулировка «видения сокрытого» допустима, но несколько тяжеловесна; «видения того, что сокрыто» естественнее и яснее, не снимая исходной неоднозначности.'
