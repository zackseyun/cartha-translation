base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/006.yaml
  text: And those mountains that your eyes saw—the mountain of iron, and the mountain of copper, and the mountain of silver, and the mountain of gold, and the mountain of soft metal, and the mountain of lead—all these will be before the Chosen One like wax before the fire, and like water that runs down from above upon those mountains; and they will become weak before his feet.
translation:
  language: ru
  text: А те горы, которые видели твои глаза, — гора железа, гора меди, гора серебра, гора золота, гора мягкого металла[a] и гора свинца — все они перед Избранным[b] станут как воск перед огнём и как вода, стекающая сверху на эти горы; и станут бессильны перед его ногами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точное название пятого металла в этой эфиопской строке неясно; среди предложенных толкований — олово или другой мягкий металл.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Избранником». Здесь это один из важнейших титулов в Притчах Еноха.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አድባር
  choice: горы
  rationale: Множественное число обозначает крупные горные массы в апокалиптическом видении; «горы» естественно передаёт масштаб образа.
- source_word: ኃጺን
  choice: железо
  rationale: Прямое обозначение металла, сохранённое буквально в последовательности гор.
- source_word: ጸሪቅ
  choice: медь
  rationale: Слово может обозначать медь или медный сплав; «медь» — наиболее широкое и наименее уточняющее соответствие.
- source_word: ብሩር
  choice: серебро
  rationale: Обычное обозначение серебра.
- source_word: ወርቅ
  choice: золото
  rationale: Обычное обозначение золота.
- source_word: ነጠብጣብ
  choice: мягкий металл
  rationale: Точный вид металла в данной эфиопской строке неясен. Обобщённый перевод сохраняет неопределённость и не выдаёт предположение об олове за несомненное чтение.
- source_word: ዐረር
  choice: свинец
  rationale: Наиболее обоснованное отождествление этого вещества в перечне металлов.
- source_word: ለኅሩይ
  choice: Избранный
  rationale: В Притчах Еноха выражение функционирует как значимый титул; прописная буква передаёт титульное употребление без привнесения позднейшей терминологии.
- source_word: መዓረ፡ ግራ፡
  choice: воск
  rationale: Естественно передаёт образ вещества, тающего и уступающего огню.
- source_word: ዘይወርድ፡ እምላዕሉ
  choice: стекающая сверху
  rationale: Сохраняет явно выраженное движение воды вниз и звучит естественно по-русски.
- source_word: ድኩማነ
  choice: станут бессильны
  rationale: Передаёт утрату силы и способности сопротивляться, не навязывая более конкретного образа физического разрушения.
theological_decisions:
- issue: Передача ለኅሩይ как титула в Притчах Еноха
  choice: Избранный
  alternative: Избранник; избранный
  rationale: Форма «Избранный» сохраняет местный енохический титул и его весомость, не отождествляя его посредством перевода с какой-либо более поздней формулой.
translation_notes:
  register: Современный литературный русский язык с торжественным, но ясным синтаксисом. Повтор «гора» сохранён ради ритма и структуры исходного перечня; неопределённость пятого металла обозначена прямо.
