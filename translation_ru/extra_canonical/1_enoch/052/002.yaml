base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/002.yaml
  text: 'There my eyes saw all the hidden things of heaven that are to come: a mountain of iron[a], and a mountain of copper, and a mountain of silver, and a mountain of gold, and a mountain of soft metal[b], and a mountain of lead.'
translation:
  language: ru
  text: 'Там мои глаза увидели всё сокрытое на небесах, что будет[a]: гору железа, и гору меди, и гору серебра, и гору золота, и гору мягкого металла[b], и гору свинца.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение, переведённое как «что будет», не вполне ясно. Его можно понимать и без указания на будущее: «которое было там» или «которое существует на небесах».'
    reason: alternative_reading
  - marker: b
    text: Точное значение названия пятого металла неизвестно. Возможно, имеется в виду мягкий или смешанный металл; иногда его отождествляют с оловом или электрумом — природным сплавом золота и серебра.
    reason: lexical_alternative
lexical_decisions:
- source_word: በህየ
  choice: Там
  rationale: Кратко и естественно передаёт местное наречие, вводя новую сцену видения.
- source_word: ርእዩ አዕይንትየ
  choice: глаза мои увидели
  rationale: Сохраняет явное упоминание глаз и образный язык видения, не сводя выражение к простому «я увидел».
- source_word: ኵሎ ኅቡኣተ ሰማይ
  choice: всё сокрытое на небесах
  rationale: Передаёт собирательное значение и идею сокрытого; русская формулировка естественнее буквального «все сокрытые вещи небес».
- source_word: ዘይኩን ሀሎ
  choice: чему надлежит явиться
  rationale: Сохраняет вероятную направленность в будущее и оттенок предопределённого проявления, не выдавая спорную конструкцию за однозначную.
- source_word: ደብረ
  choice: гору
  rationale: Повторено при каждом металле ради торжественного ритма исходного перечисления.
- source_word: ኃጺን
  choice: железа
  rationale: Обычное соответствие названию железа.
- source_word: ጸሪቅ
  choice: меди
  rationale: Базовое название металла; возможные значения сплава («бронза», «латунь») здесь менее нейтральны.
- source_word: ብሩር
  choice: серебра
  rationale: Обычное соответствие названию серебра.
- source_word: ወርቅ
  choice: золота
  rationale: Обычное соответствие названию золота.
- source_word: ነጠብጣብ
  choice: мягкого металла
  rationale: Нейтрально сохраняет неопределённость редкого термина и не навязывает более узкую идентификацию как олова или электрума.
- source_word: ዐረር
  choice: свинца
  rationale: Обычное соответствие названию свинца, хорошо согласующееся с рядом металлов.
theological_decisions:
- issue: Относится ли выражение о небесном сокрытом к будущим реалиям или к уже существующему в небесах
  choice: 'Будущая направленность: «чему надлежит явиться»'
  alternative: «которое было там» или «которое существует на небесах»
  rationale: Апокалиптический контекст поддерживает мысль о грядущем проявлении, однако трудность эфиопской конструкции не позволяет устранить статическое прочтение; оно сохранено в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным ритмом видения. Анафорическое повторение «и гору» сохранено как значимая особенность исходного перечисления; инверсия «глаза мои» поддерживает возвышенный регистр без явной архаизации.
