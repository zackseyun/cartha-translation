base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/007.yaml
  text: And in those days they will not be saved by gold or by silver[b][a], nor will they be able to flee.
translation:
  language: ru
  text: И в те дни они не спасутся ни золотом, ни серебром и не смогут бежать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይከውን፡ በእማንቱ፡ መዋዕል
  choice: И в те дни
  rationale: Апокалиптическая вводно-временная формула естественно передаётся по-русски единым оборотом; отдельное «и будет» сделало бы фразу тяжеловесной.
- source_word: ኢይድኅኑ
  choice: они не спасутся
  rationale: Основная порода глагола ደኅነ имеет непереходное значение «оказаться в безопасности, спастись, избежать гибели»; поэтому возвратно-непереходное русское «не спасутся» точнее, чем активное «не спасут себя».
- source_word: እበወርቅ፡ ወእበብሩር
  choice: ни золотом, ни серебром
  rationale: Предложные формы обозначают средство; русская парная конструкция «ни… ни…» естественно передаёт два бесполезных средства спасения при отрицании.
- source_word: ወኢይክሉ፡ ጐይየ
  choice: и не смогут бежать
  rationale: Сохраняется отдельная формула невозможности и конкретный образ бегства; «бежать» не сливает эту мысль с предшествующим «спастись».
theological_decisions:
- issue: Характер спасения
  choice: Речь идёт о невозможности избежать грядущего суда с помощью богатства.
  alternative: Понимать «спасение» как специальный термин позднейшего вероучения или переводить «выкупить себя».
  rationale: Контекст и инструментальные обороты с золотом и серебром указывают на избавление от бедствия или суда; перевод не привносит более позднюю сотериологическую терминологию.
- issue: Залог и субъект глагола ኢይድኅኑ
  choice: «они не спасутся»
  alternative: «они не спасут себя» или «их не спасут»
  rationale: Непереходный основной стем выражает состояние безопасности или избавление, не называя внешнего спасителя и не делая субъект явно действующим на самого себя.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным пророческим звучанием. Синтаксис остаётся ясным для обычного читателя; параллелизм отрицаний и образ бегства сохранены.
