base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/004.yaml
  text: And he said to me[a], “All these that you have seen will belong to the dominion of his Anointed One[c][b], so that he may command and be mighty upon the earth.”
translation:
  language: ru
  text: 'И он сказал мне: «Всё это, что ты видел, будет под господством его Помазанника[a], чтобы он повелевал и был могуч[b] на земле».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «его Мессии». Буквально титул означает «Помазанник»; форма слова также содержит значение «его».'
    reason: lexical_alternative
  - marker: b
    text: «Был могуч» можно также понять как «одерживал верх» или «проявлял власть».
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤለኒ
  choice: И он сказал мне
  rationale: Сохраняет обычную повествовательную формулу прямой речи без лишнего уточнения.
- source_word: እሉ፡ ኵሎሙ፡ ዘርኢከ
  choice: Всё это, что ты видел
  rationale: Передаёт указание на все ранее показанные Еноху предметы видения.
- source_word: ለስልጣነ
  choice: владычеству
  rationale: Слово обозначает власть, господство или владычество; выбранный вариант естественен в возвышенном апокалиптическом контексте и сохраняет идею правящей власти.
- source_word: መሲሑ
  choice: его Помазанника
  rationale: Форма содержит местоименный суффикс третьего лица мужского рода «его»; «Помазанник» переводит титул, а не транслитерирует его.
- source_word: እሙንቱ፡ ይከውኑ
  choice: будет принадлежать
  rationale: По-русски ясно выражает отношение увиденного к владычеству Помазанника, подразумеваемое конструкцией с предлогом.
- source_word: ከመ፡ ይእዝዝ
  choice: чтобы тот повелевал
  rationale: Передаёт целевое значение и смысл приказания или властного распоряжения; «тот» устраняет возможную неясность русского местоимения.
- source_word: ወይትኃየል
  choice: и был силён
  rationale: Сохраняет значение силы и могущества, не сужая его до победы или конкретного применения власти.
- source_word: ዲበ፡ ምድር
  choice: на земле
  rationale: Естественный современный русский эквивалент пространственного выражения без ненужной архаизации.
theological_decisions:
- issue: Передача መሲሑ и притяжательного суффикса
  choice: его Помазанника
  alternative: его Мессии
  rationale: «Помазанник» переводит титул, а «его» сохраняет грамматически выраженную связь с ранее подразумеваемым обладателем Помазанника, не определяя её сверх текста.
- issue: Отношение всего увиденного к власти Помазанника
  choice: будет принадлежать владычеству
  alternative: будет под властью
  rationale: Выбранная формулировка сохраняет несколько необычную абстрактную конструкцию источника и не превращает её без необходимости в прямое утверждение о подчинении.
- issue: Значение глагола ይትኃየል
  choice: был силён
  alternative: одерживал верх / проявлял власть
  rationale: 'Сохраняется смысловая широта: речь может идти о могуществе, преобладании или действенном осуществлении власти.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Синтаксис сделан ясным для широкого читателя, при этом сохранены титул, притяжательная форма и смысловая широта слов о владычестве и силе.
