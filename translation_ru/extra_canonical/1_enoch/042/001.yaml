base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/042/001.yaml
  text: Wisdom found no place where she might dwell[b][a], and her dwelling was in the heavens.
translation:
  language: ru
  text: Мудрость не нашла места, где могла бы обитать, и[b] обитель её была на небесах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В геэзском тексте стоит множественное число — «небеса»; это обычное для апокалиптической литературы обозначение небесной сферы.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «но обитель её была».'
    reason: translation_ambiguity
lexical_decisions:
- source_word: ጥበብ
  choice: Мудрость
  rationale: Существительное передано с прописной буквы, поскольку в стихе Мудрость выступает как олицетворённая действующая фигура, ищущая место для обитания.
- source_word: መካነ ኢረከበት
  choice: не нашла места
  rationale: Сочетание пространственного существительного с отрицательной формой глагола естественно передаётся по-русски как «не нашла места».
- source_word: ኀበ ተኃድር
  choice: где могла бы обитать
  rationale: Сохраняет значение искомого места для постоянного пребывания и возвышенный образ обитания, не делая выражение архаичным.
- source_word: ወሀለወ
  choice: и … была
  rationale: Основное копулятивное значение ወ передано союзом «и», что сохраняет паратаксис оригинала; возможный контекстуальный оттенок противопоставления вынесен в примечание.
- source_word: ማኅደራ
  choice: обитель её
  rationale: «Обитель» передаёт место постоянного пребывания и поддерживает словесную связь с глаголом «обитать»; местоимение сохраняет олицетворение Мудрости.
- source_word: ውስተ ሰማያት
  choice: на небесах
  rationale: Русское «на небесах» естественно передаёт множественное число геэзского ሰማያት и сохраняет апокалиптический образ небесной сферы.
theological_decisions:
- issue: Следует ли сохранять Мудрость как олицетворённую фигуру или передать её как отвлечённое качество
  choice: 'Сохранить олицетворение: «Мудрость не нашла места, где могла бы обитать»'
  alternative: «Для мудрости не нашлось места»
  rationale: В оригинале Мудрость является субъектом действия и имеет собственную обитель; отвлечённая формулировка ослабила бы характерный для литературы мудрости и апокалиптики образ.
- issue: Характер связи между отсутствием найденного места и небесной обителью
  choice: Передать ወ основным союзом «и»
  alternative: «но обитель её была на небесах»
  rationale: Геэзский союз прежде всего копулятивен и допускает последовательную или результативную связь; перевод «но» возможен контекстуально, однако сильнее истолковывает отношение между частями фразы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Паратактическое «и» сохраняет строй оригинала, а «обитель» и «обитать» поддерживают повторяющийся образ места пребывания без чрезмерной архаизации.
