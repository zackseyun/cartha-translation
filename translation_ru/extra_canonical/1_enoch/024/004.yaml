base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/024/004.yaml
  text: And among them was a tree whose fragrance I had never smelled[a][b].
translation:
  language: ru
  text: И среди них было дерево, благоухания которого я никогда прежде не ощущал.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфиопская транскрипция в этом месте, вероятно, искажена при распознавании текста: последнее слово следует читать в значении «я обонял». Это чтение подтверждается греческим текстом: «которого я никогда не обонял».'
    reason: textual_variant
lexical_decisions:
- source_word: ወሀሎ
  choice: И … было
  rationale: Форма выражает наличие или присутствие; такой перевод естественно продолжает повествование.
- source_word: እምውስቴቶሙ
  choice: среди них
  rationale: Передаёт пространственное положение дерева внутри ранее упомянутой группы.
- source_word: ዕፅ
  choice: дерево
  rationale: В контексте видения конкретное значение «дерево» предпочтительнее более широких «растение» или «древесина».
- source_word: ዘአልቦ ገሙራ
  choice: никогда прежде не
  rationale: Отрицательная конструкция выражает значение «никогда»; ገሙራ здесь понимается как наречное усиление отрицания, а не как обозначение аромата.
- source_word: አመ ጼወኒ (вероятно, ጼኖኩ)
  choice: я … ощущал [благоухание]
  rationale: Переданное OCR чтение, вероятно, искажает форму «я обонял/ощущал запах»; это подтверждается греческим свидетельством. Объект глагола естественно выражен словом «благоухание».
theological_decisions:
- issue: Отличительное свойство дерева
  choice: Енох прежде никогда не ощущал такого благоухания.
  alternative: Аромат дерева был подобен смирне или иной благовонной смоле.
  rationale: Чтение о смирне возникло из ошибочного разбора повреждённой OCR-транскрипции. Вероятное эфиопское чтение и греческое свидетельство поддерживают значение «которого я никогда не обонял».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. «Благоухание» сохраняет положительную образность необыкновенного дерева; «ощущал» звучит естественнее буквального «обонял», тогда как сноска документирует более буквальную форму.
