base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/024/003.yaml
  text: And the seventh mountain was in the midst of these[a], and its height surpassed them all, resembling the seat of a throne[c][b], and fragrant trees encircled it.
translation:
  language: ru
  text: Седьмая гора находилась посреди этих гор и превосходила их всех высотой[a]; она была подобна седалищу престола[b], и вокруг неё росли благоухающие деревья.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфиопский текст здесь неясен и содержит несогласованные формы. Смысл «превосходила их всех высотой» подтверждается греческим свидетелем; иначе фразу можно понять как «и высотой она была подобна…».
    reason: textual_variant
  - marker: b
    text: 'Буквально: «седалищу престола». Двойное выражение сохранено, а не упрощено до одного слова «престол».'
    reason: lexical_alternative
