- source_word: መንበረ አትራኖስ
  choice: седалище престола
  rationale: 'Сохранено двойное выражение: መንበር означает место для сидения, а አትራኖስ — престол; сочетание не сведено просто к слову «престол».'
- source_word: የአውድዎ
  choice: вокруг неё росли
  rationale: Глагольный образ окружения передан естественной русской конструкцией применительно к деревьям, окружавшим гору.
- source_word: ዕጸወ መዓዛ
  choice: благоухающие деревья
  rationale: Передаёт конструкцию «деревья аромата» естественно и сохраняет чувственный образ приятного запаха.
