    issue: «в ту сторону» вместо «своим путём/по моему пути»
    rationale: Геэзское መንገሌሁ содержит значение «мой путь»; указание на ранее названное направление в данном стихе не выражено.
  - severity: medium
    issue: Добавлено «между ними»
    rationale: Источник не определяет прямо, что ущелья пролегали именно между горами; английская аудиторская сноска также отмечает эту неясность. Добавление снимает неоднозначность без основания.
  - severity: low
    issue: «драгоценны» для камней
    rationale: Это слово может означать ценность материала и создавать впечатление драгоценных камней, тогда как ክቡር здесь продолжает лексику славы/великолепия.
