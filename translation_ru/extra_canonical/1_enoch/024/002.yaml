base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/024/002.yaml
  text: And I went in that direction and saw seven glorious mountains[a], each one differing from the other; and their stones were glorious and beautiful, and all of them were glorious and splendid in appearance, and fair in face. Three were toward the east, one set upon another, and three toward the north, one set upon another, with deep and winding ravines[d][c][b], no one coming near to another.
translation:
  language: ru
  text: И пошёл я своим путём и увидел семь величественных гор, каждая из которых отличалась от другой. Камни их были великолепны и прекрасны; все горы были величественны и великолепны на вид, и облик их был прекрасен.[a] Три находились на востоке, одна над другой, и три — на севере, одна над другой; были также глубокие извилистые ущелья, ни одно из которых не приближалось к другому.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и лицо их было прекрасно». Так горы описаны почти как живые существа.'
    reason: cultural_note
  - marker: b
    text: 'Заключительная фраза грамматически относится, вероятнее всего, к ущельям: ни одно из них не приближалось к другому. Связь этого описания с группами гор в эфиопском тексте не вполне ясна.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ሖርኩ መንገሌሁ
  choice: пошёл я в ту сторону
  rationale: Глагол передаёт простое движение в ходе видения, а направительное выражение с местоименным суффиксом естественно понимать как указание на уже названную сторону или место.
- source_word: ሰብዐተ አድባረ ክቡራነ
  choice: семь величественных гор
  rationale: ክቡራነ сочетает значения почёта, славы и великолепия; «величественные» естественно описывает горы и сохраняет возвышенный апокалиптический регистр.
- source_word: ወኵሉ ፩እምነ ፩እንዘ ይትዌለጥ
  choice: каждая из которых отличалась от другой
  rationale: Фраза обозначает различие между горами, не сводя его только к пространственному разделению.
- source_word: እእባኒ ክቡራነ ወሠናያነ
  choice: камни их были драгоценны и прекрасны
  rationale: Буквальное упоминание камней сохранено; в отношении камня ክቡር естественно передаётся как «драгоценный», тогда как ሠናይ выражает красоту.
- source_word: ወኵሉ ክቡር ወስቡሕ ራእዮሙ
  choice: все горы были величественны и великолепны на вид
  rationale: Передаётся усиленное описание зрительного великолепия без архаической тяжеловесности.
- source_word: ወሠናይ ገጾሙ
  choice: облик их был прекрасен
  rationale: ገጽ буквально означает «лицо», но также «облик, вид». «Облик» сохраняет образность и звучит естественно при описании гор.
- source_word: ፫መንገለ ጽባሕ … ወ፫መንገለ ሰሜን
  choice: три находились к востоку … и три — к северу
  rationale: ጽባሕ в пространственном контексте обозначает восток, буквально сторону восхода; параллельная фраза называет север.
- source_word: ጽኑዓን ፩ዲበ ፩
  choice: одна над другой
  rationale: Фраза описывает ярусное или вертикальное расположение; русский оборот не создаёт лишнего впечатления искусственной постройки.
- source_word: ቈላት ዕሙቅ ወጠዋያት
  choice: глубокие извилистые ущелья
  rationale: Прилагательные имеют значения «глубокие» и «извилистые/кривые»; множественное существительное обозначает углубления или ущелья, а не отдельную долину.
- source_word: አሐቲ ለአሐቲ ኢይትቃረባ
  choice: не сближавшиеся друг с другом
  rationale: Формы женского рода согласуются с предшествующими ущельями; безличный русский оборот сохраняет пространственный смысл и не антропоморфизирует их.
