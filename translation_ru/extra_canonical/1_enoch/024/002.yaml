revisions:
- from: И пошёл я в ту сторону и увидел семь величественных гор, каждая из которых отличалась от другой. Камни их были драгоценны и прекрасны; все горы были величественны и великолепны на вид, и облик их был прекрасен.[a] Три находились к востоку, одна над другой, и три — к северу, одна над другой; между ними пролегали глубокие извилистые ущелья, не сближавшиеся друг с другом.[b]
  to: И пошёл я своим путём и увидел семь величественных гор, каждая из которых отличалась от другой. Камни их были великолепны и прекрасны; все горы были величественны и великолепны на вид, и облик их был прекрасен.[a] Три находились на востоке, одна над другой, и три — на севере, одна над другой; были также глубокие извилистые ущелья, ни одно из которых не приближалось к другому.[b]
  rationale: Исправлены направительное выражение и неоправданное уточнение пространственной связи ущелий с горами; также устранён оттенок материальной ценности в описании камней. Повторы, порядок групп гор, образ «лица/облика» и неоднозначность заключительного ландшафтного описания сохранены.
