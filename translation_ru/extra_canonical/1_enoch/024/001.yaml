    reason: lexical_alternative
lexical_decisions:
- source_word: እምህየ
  choice: оттуда
  rationale: Передаёт дальнейшее движение в пространственной последовательности видения кратко и естественно.
- source_word: ሖርኩ
  choice: я пошёл
  rationale: Сохраняет простой повествовательный характер глагола движения от первого лица, не добавляя оттенка длительного путешествия.
- source_word: ካልአ መካነ ምድር
  choice: в другое место земли
  rationale: Близко передаёт буквальное сочетание «другое место земли/суши» и сохраняет космографический характер повествования.
- source_word: አርአየኒ
  choice: он показал мне
  rationale: Естественная передача каузативного глагола зрения; мужской субъект выражен формой глагола, но прямо не назван.
- source_word: ደብረ እሳት
  choice: огненную гору
  rationale: Естественная русская передача конструкции «гора огня», сохраняющая яркий апокалиптический образ.
- source_word: ዘያንበለብል
  choice: которая пылала
  rationale: Передаёт относительное определение и продолжающееся интенсивное горение без излишнего усиления.
- source_word: መዐልተ ወሌሊተ
  choice: днём и ночью
  rationale: Идиоматически и точно передаёт временную пару, указывающую на непрерывность явления.
theological_decisions:
- issue: Неявно названный субъект в словах «он показал мне»
  choice: Сохранить местоименное «он», не называя субъекта ангелом.
  alternative: «ангел показал мне» или «мой проводник показал мне»
  rationale: Контекст, вероятно, указывает на ангельского проводника, однако сам стих его не называет; перевод сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным ритмом. Сохранены последовательность видения и образность апокалиптической географии; синтаксис сделан естественным для широкого круга читателей.
