base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/024/001.yaml
  text: And from there I went to another place of the earth[a], and he showed me a mountain of fire that blazed day and night.
translation:
  language: ru
  text: И оттуда я пошёл в другое место на земле, и он[a] показал мне огненную гору, пылавшую днём и ночью.
  philosophy: optimal-equivalence
  footnotes:
