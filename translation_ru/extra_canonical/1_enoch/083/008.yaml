base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/008.yaml
  text: And now[a], my son, rise and make your petition to the Lord of glory, since you are faithful[b], that a remnant may remain upon the earth and that he may not wipe out the whole earth.
translation:
  language: ru
  text: А теперь, сын мой, встань и обратись с мольбой к Господу славы[a]. Ты верен; проси, чтобы на земле остался остаток[b] и чтобы он не уничтожил всю землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Господу славы». Сохранён формальный божественный титул, а не описательное выражение «славному Господу».'
    reason: cultural_note
  - marker: b
    text: В геэз употреблено усиленное однокоренное выражение — буквально «чтобы остаток остался». Повтор сохранён, чтобы передать акцент оригинала.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተንሥእ
  choice: встань
  rationale: Повелительная форма передаёт призыв подняться и звучит естественно в торжественной речи.
- source_word: አስተብቍዖ
  choice: обратись с мольбой
  rationale: Глагол означает настойчивое прошение или заступническую мольбу; этот вариант точнее простого «помолись» и остаётся понятным современному читателю.
- source_word: ለእግዚአ ስብሐት
  choice: к Господу славы
  rationale: Сохранена буквальная генитивная конструкция и формальный характер возвышенного божественного титула.
- source_word: መሃይምን
  choice: верен
  rationale: Слово может указывать как на веру, так и на надёжность и стойкость; «верен» сохраняет нравственно-религиозный оттенок и не сводит смысл только к интеллектуальному убеждению.
- source_word: ይትረፍ ትራፍ
  choice: остаток остался
  rationale: Однокоренное сочетание в геэз усиливает мысль о тех, кто уцелеет; намеренный повтор в русском сохраняет эту выразительную особенность.
- source_word: ወኢይደምስሳ ለኵላ ምድር
  choice: и чтобы он не уничтожил всю землю
  rationale: Глагол выражает уничтожение или полное истребление, а «всю землю» сохраняет всеобщий масштаб угрозы.
theological_decisions:
- issue: Передаёт ли መሃይምን прежде всего внутреннюю веру или верность и надёжность
  choice: верен
  alternative: верующий
  rationale: В контексте это качество объясняет пригодность сына к ходатайству перед грядущим судом. «Верен» сохраняет связь и с доверием, и со стойкостью, не устраняя смысловую напряжённость в пользу одного лишь акта верования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном, соответствующим апокалиптическому наставлению. Синтаксис сохраняет последовательность цели в оригинале; местоимение «он» оставлено со строчной буквы, чтобы не вносить конфессионально-редакционную практику сверх исходного текста.
