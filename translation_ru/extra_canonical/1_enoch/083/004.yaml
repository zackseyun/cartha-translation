  source_fidelity: 'В целом образный ряд передан верно: падение не названного предмета, поглощение земли, подвешенные горы, погружающиеся холмы и срубленные деревья. Однако «холмы провалились один на другой» меняет образ погружения/затопления на обвал и добавляет идею столкновения. «От своих стволов» для деревьев по-русски неточно и неестественно: речь о нижней части, основании или пне, а не об отделении дерева от собственного ствола.'
