  choice: упало
  rationale: Нарративная форма в рассказе о видении передана простым прошедшим временем; местоимение «оно» сохраняет отсылку к предмету из предшествующего контекста, не уточняя её.
- source_word: ትትወሐጥ ውስተ ቀላይ ዐቢይ
  choice: землю поглощает великая бездна
  rationale: Пассивно-возвратный образ поглощения передан живой русской конструкцией без ослабления катастрофической картины; ቀላይ ዐቢይ обозначает огромную глубину или пропасть.
- source_word: አድባር ዲበ አድባር ይስቀሉ
  choice: горы повисли над горами
  rationale: Глагол выражает висение или подвешенность. Необычный образ сохранён и не заменён более привычным нагромождением гор.
- source_word: አውግር ዲበ አውግር ይሰጠሙ
  choice: холмы провалились один на другой
  rationale: Передан смысл погружения или опускания при сохранении конструкции «холмы на холмы» в естественной для русского языка форме.
- source_word: ዕፀወ ነዋኃት
  choice: высокие деревья
  rationale: Прилагательное указывает прежде всего на высоту; этот вариант ясен современному читателю и сохраняет зрительный образ.
- source_word: ይትገዘሙ እምጕንዶቲሆሙ
  choice: были отсечены от своих стволов
  rationale: Глагол ገዘመ означает рубить, отсекать или отрезать, а не вырывать с корнем. Упоминание нижней части дерева сохранено как «стволы» без внесения отсутствующих в тексте корней.
- source_word: ይትገደፉ
  choice: брошены вниз
  rationale: Пассивная форма глагола бросания передана энергично и в согласии с последовательностью разрушения.
- source_word: ይሰጠሙ ውስተ ቀላይ
  choice: погрузились в бездну
  rationale: Повтор слова «бездна» поддерживает лексическое и образное единство стиха; глагол сохраняет значение погружения.
