base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/004.yaml
  text: And when it fell upon the earth[a], I saw the earth being swallowed into a great abyss, and mountains were suspended upon mountains, and hills sank down upon hills[d][c][b], and tall trees were cut off from their trunks and were thrown down and sank into the abyss.
translation:
  language: ru
  text: И когда оно упало на землю, я увидел, как земля поглощалась великой бездной[a], как горы повисли над горами[b], а холмы погрузились на холмы; высокие деревья были отсечены от своих оснований[c], брошены вниз и погрузились в бездну.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великая глубина»; также возможно: «великая пропасть». Эфиопское слово обозначает огромное глубокое пространство.'
    reason: lexical_alternative
  - marker: b
    text: 'Необычный образ «горы повисли над горами» сохранён буквально; его можно также передать: «горы были подвешены над горами».'
    reason: cultural_note
  - marker: c
    text: То есть были отрублены или отсечены от своей нижней части, основания или пня; речь не обязательно идёт о вырывании деревьев с корнем.
    reason: lexical_alternative
