  rationale: «Возносил мольбу» передаёт настойчивое прошение в достойном регистре; «о них» сохраняет предметную связь с видениями.
theological_decisions:
- issue: Передача ለእግዚእ в контексте молитвы
  choice: Господу
  alternative: Владыке
  rationale: В молитвенном контексте слово обозначает Бога; «Господь» естественно сохраняет его богословский вес, не внося позднейшей конфессиональной конкретизации.
- issue: Связь молитвы с видениями в በእንቲአሆሙ
  choice: о них
  alternative: из-за них
  rationale: Основной текст оставляет видения предметом мольбы, а причинное понимание, при котором именно видения побудили Еноха молиться, сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены повтор «видение» и несколько шероховатая последовательность исходного текста, чтобы не устранять неясность связи слов «я видел сильное видение» со вторым видением. Все сноски поставлены непосредственно при соответствующих выражениях.
