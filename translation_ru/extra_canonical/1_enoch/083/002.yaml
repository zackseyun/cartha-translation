base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/002.yaml
  text: 'I saw two visions before I took a wife[a], and one of them was not like the other: the first when I was learning the book, and the second before I took your mother—I saw a mighty vision[d][c][b]; and concerning them I made supplication to the Lord.'
translation:
  language: ru
  text: 'До того как я взял себе жену, я видел два видения, и одно из них было не похоже на другое: первое — когда я учился по книге[a], а второе — сильное видение, которое я увидел до того, как взял твою мать в жёны[b]. О них[c] я возносил мольбу Господу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «когда меня учили по книге». Глагол может означать как самостоятельное учение, так и получение наставления.'
    reason: lexical_alternative
  - marker: b
    text: «Сильное видение» можно также перевести как «грозное» или «могущественное видение»; слово подчёркивает силу и напряжённость откровения.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «из-за них»: видения могли быть не только предметом молитвы, но и её причиной.'
    reason: lexical_alternative
