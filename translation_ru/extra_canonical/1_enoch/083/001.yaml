base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/001.yaml
  text: And now[a], my son Methuselah, I will show you all my visions that I have seen before you; I will recount them.
translation:
  language: ru
  text: И вот, сын мой Мафусал, я покажу тебе все мои видения, которые я видел перед тобой, и расскажу о них.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В оригинале стоят два разных глагола: сначала «покажу», затем «расскажу». Выражение «перед тобой» буквально передаёт язык присутствия и может также пониматься как указание на то, что видения были увидены в присутствии Мафусала.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: И теперь
  rationale: Естественно передаёт переход к новому речевому акту, сохраняя соединительный союз исходного текста.
- source_word: አርእየከ
  choice: я покажу тебе
  rationale: Каузативный глагол с местоименным суффиксом 2-го лица мужского рода обозначает показ или предъявление; форма будущего времени соответствует вводимому рассказу.
- source_word: ወልድየ፡ ማቱሳላ
  choice: сын мой Мафусал
  rationale: Сохраняет прямое родственное обращение и использует традиционную русскую форму имени.
- source_word: ኵሎ፡ ራእያትየ
  choice: все мои видения
  rationale: «Видения» точно передаёт апокалиптическое значение существительного и не расширяет его до общего понятия откровений.
- source_word: እለ፡ ርኢኩ
  choice: которые я видел
  rationale: Относительное придаточное непосредственно определяет видения и передаёт завершённое зрительное восприятие.
- source_word: በቅድሜከ
  choice: перед тобой
  rationale: Буквально сохраняет пространственно-присутственное выражение исходного текста, не сводя его однозначно ни к «в твоём присутствии», ни к временному «до тебя».
- source_word: እነግር
  choice: расскажу о них
  rationale: Передаёт отдельный глагол говорения и повествования, естественно связывая его по-русски с ранее названными видениями.
theological_decisions:
- issue: Соотношение глаголов «показать» и «рассказать»
  choice: 'Сохранены оба глагола как разные действия: «покажу» и «расскажу».'
  alternative: 'Объединить их в один глагол: «поведаю» или «открою».'
  rationale: В геэзском тексте употреблены два разных глагола раскрытия содержания; их различение сохраняет напряжение между явлением видений и их словесным изложением.
- issue: Связь выражения በቅድሜከ с предшествующим глаголом зрения
  choice: «которые я видел перед тобой»
  alternative: 'Отнести выражение к последующему рассказу: «расскажу их перед тобой».'
  rationale: Порядок слов и предоставленная разметка поддерживают связь с «видел», однако буквальное выражение оставлено без дальнейшего толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок обращения «сын мой Мафусал» сохраняет достоинство и близость речи; буквальное «перед тобой» удерживает неоднозначность исходного выражения.
