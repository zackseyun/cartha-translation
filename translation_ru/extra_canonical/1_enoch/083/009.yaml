base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/009.yaml
  text: My son[a], from heaven all this will come upon the earth[c][b], and upon the earth there will be a great destruction.
translation:
  language: ru
  text: Сын мой, всё это придёт с неба на землю[a], и на земле будет великое разрушение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с неба всё это будет на земле»; по-русски также возможно: «с неба всё это придёт на землю». Слово, переданное как «всё это», можно понять и более общо: «всё» или «все эти вещи»; форма в данном текстовом свидетеле не вполне ясна. «Земля» здесь может означать также «сушу» или «страну», однако апокалиптический контекст позволяет понимать её шире.'
    reason: Передаёт синтаксическую и лексическую неоднозначность исходного текста, не приписывая глаголу бытия образ «обрушения».
lexical_decisions:
- source_word: ወልድየ
  choice: Сын мой
  rationale: Форма с притяжательным суффиксом означает «мой сын» и в контексте выступает как обращение; перевод не придаёт ей мессианского смысла.
- source_word: እምሰማይ
  choice: с неба
  rationale: Прямо передаёт исходную точку и сохраняет вертикальный образ видения.
- source_word: ይሄሉ
  choice: обрушится
  rationale: Это форма глагола «быть, существовать», а не глагола речи. В сочетании «с неба… на землю» русский глагол «обрушится» естественно выражает наступление бедствия, хотя буквально конструкция ближе к «будет».
- source_word: ኵሉዝ
  choice: всё это
  rationale: Передаёт значение совокупности с вероятным указательным оттенком; точный объём указания в данном свидетеле несколько неясен.
- source_word: ዲበ ምድር
  choice: на землю / на земле
  rationale: Первое сочетание обозначает направленность происходящего на землю, второе — место последующего разрушения. «Земля» лучше соответствует широкому апокалиптическому контексту, чем локальное «страна».
- source_word: ይከውን
  choice: произойдёт
  rationale: Экзистенциально-событийное значение естественно передаётся по-русски как «произойдёт» при существительном «разрушение».
- source_word: ሐጕል ዐቢይ
  choice: великое разрушение
  rationale: Сохраняет широкий образ гибели и масштаб события, не сужая его до военного разорения.
theological_decisions:
- issue: Кем является названный «сын»
  choice: Сохранить буквальное обращение «Сын мой» без истолкования личности адресата.
  alternative: «Дитя моё» либо понимание сына как особой символической или мессианской фигуры.
  rationale: Сам стих не устанавливает особого статуса адресата; буквальное обращение сохраняет смысловую открытость.
- issue: Синтаксис ይሄሉ
  choice: Понимать как форму глагола «быть, существовать» и не вводить прямую речь.
  alternative: «Скажет» с последующей цитатой.
  rationale: Альтернативное чтение ошибочно превращает глагол бытия в глагол речи и создаёт отсутствующую в источнике цитату.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптической речи. Обращение вынесено в начало; повтор слова «земля» сохранён. «Обрушится» выбрано для естественной передачи движения с неба на землю, а буквальная конструкция отмечена в сноске.
