base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/011.yaml
  text: And when I went out below and saw the heaven[a], and the sun rising in the east, and the moon setting in the west, and a few stars, and the whole earth, and everything as He had known it in the beginning, then I blessed the Lord of judgment and extolled Him, because He had brought forth the sun from the windows of the east, and it ascended and rose on the face of the heaven[c][b], and set out and followed the path which He showed it.
translation:
  language: ru
  text: И когда я вышел вниз[a] и увидел небо[b], солнце, восходившее на востоке, луну, заходившую на западе, несколько звёзд, всю землю и всё таким, каким Он знал это вначале, тогда я благословил Господа суда и превознёс Его, потому что Он вывел солнце из окон востока. Оно поднялось и взошло на небесном своде, отправилось в путь по дороге, которую Он ему указал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вниз», «внизу», «ниже». Точное пространственное значение зависит от обстановки сна.'
    reason: lexical_alternative
  - marker: b
    text: 'В эфиопском тексте буквально стоит предваряющее местоимение: «увидел его — небо». Его можно принять за самостоятельное «увидел его», однако продолжение фразы указывает, что речь, вероятнее всего, идёт о небе, с которого начинается перечень увиденного.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ሶበ
  choice: когда
  rationale: Временной союз вводит придаточную часть; предшествующий ወ передан соединительным «и».
- source_word: ወፃእኩ
  choice: я вышел
  rationale: Форма первого лица единственного числа от глагола выхода; перевод сохраняет движение из прежнего места, не уточняя его природу.
- source_word: ታሕተ
  choice: вниз
  rationale: Пространственное наречие допускает значения «вниз», «внизу» или «ниже»; «вниз» естественно сочетается с глаголом движения и не конкретизирует место назначения.
- source_word: ወርኢክዎ
  choice: и увидел небо
  rationale: Объектный суффикс мужского рода единственного числа, вероятнее всего, предваряет названный далее объект — ሰማይ, «небо». По-русски такая конструкция естественно передаётся без предваряющего местоимения.
- source_word: Lord of judgment
  choice: Господа суда
  rationale: Сохранена краткая генитивная конструкция и судебная образность титула без конфессионального истолкования.
- source_word: windows of the east
  choice: окон востока
  rationale: Образ передан формально и без замены на более привычные, но отсутствующие в тексте «врата».
theological_decisions:
- issue: Референт объектного суффикса в ወርኢክዎ
  choice: Связать суффикс с последующим словом «небо» как с предварительно обозначенным объектом.
  alternative: 'Передать отдельно: «и увидел его», оставив референт неопределённым.'
  rationale: Продолжение эфиопского текста после усечённого фрагмента начинается с «небо» и последующего перечня увиденного; это поддерживает понимание суффикса как предваряющего объект, а не как указания на отдельную мужскую фигуру.
- issue: Фраза о том, каким Бог знал всё вначале
  choice: Сохранить субъект «Он» и формулировку «каким Он знал это вначале».
  alternative: Сгладить до «каким всё было вначале».
  rationale: Сглаженный вариант был бы естественнее, но устранил бы присутствующее в источнике указание на знание Бога и тем самым разрешил бы смысловое напряжение за автора.
- issue: Титул «Господь суда»
  choice: Господа суда
  alternative: Господа Судью
  rationale: 'Именная конструкция сохраняет неоднозначность: речь может идти как о Господе, осуществляющем суд, так и о Господе эсхатологического суда; вариант «Судья» делает толкование более узким.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Синтаксис длинного периода сохранён ради последовательности видения, но заключительное описание движения солнца выделено в отдельное предложение для ясности. Заглавные местоимения «Он», «Его» обозначают Бога согласно принятой русской религиозной письменной норме, не добавляя нового толкования.
