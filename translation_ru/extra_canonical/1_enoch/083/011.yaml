revisions:
- from: И когда я вышел вниз[a] и увидел небо[b], солнце, восходившее на востоке, луну, заходившую на западе, несколько звёзд, всю землю и всё таким, каким Он знал это вначале, тогда я благословил Господа суда и превознёс Его, потому что Он вывел солнце из окон востока. Оно поднялось и взошло над лицом неба, отправилось в путь и последовало по дороге, которую Он ему указал.
  to: И когда я вышел вниз[a] и увидел небо[b], солнце, восходившее на востоке, луну, заходившую на западе, несколько звёзд, всю землю и всё таким, каким Он знал это вначале, тогда я благословил Господа суда и превознёс Его, потому что Он вывел солнце из окон востока. Оно поднялось и взошло на небесном своде, отправилось в путь по дороге, которую Он ему указал.
  rationale: Исправлены только две неудачные русские кальки. «На небесном своде» передаёт образ восхождения солнца в небесном пространстве, не утверждая космологическую деталь сверх текста; заключительное описание пути солнца сделано естественнее без изменения его содержания. Сноски сохранены, а их маркеры остаются на соответствующих словах.
