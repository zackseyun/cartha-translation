base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/007.yaml
  text: 'And I told him all the vision that I had seen[a], and he said to me, “Severe is the sight you have seen, my son, and mighty is the vision of your dream: it reveals all the hidden sin of the earth[f][e][d][c][b], and it is about to sink into the abyss and be destroyed with a great destruction.”'
translation:
  language: ru
  text: 'И я рассказал ему всё видение, которое видел. Он сказал мне: «Тяжко то, что ты видел, сын мой, и могущественно видение твоего сна: в нём сокрыт весь грех земли[a]. Ей предстоит погрузиться в бездну[b] и погибнуть великой погибелью[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфиопская фраза трудна. Более буквально: «оно сокрыло весь грех земли». Возможно и другое понимание: «оно открывает весь сокрытый грех земли».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в пучину», «в морскую глубину». Подразумеваемым подлежащим заключительных глаголов может быть земля, грех или содержание самого видения.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально — усилительная однокоренная конструкция: «погибнуть великой погибелью»; по смыслу возможно: «быть совершенно уничтоженной».'
    reason: translation_clarity
lexical_decisions:
- source_word: ነገርክዎ
  choice: рассказал ему
  rationale: Передаёт сообщение Енохом увиденного и естественно звучит в современном русском повествовании.
- source_word: ጽኑዐ
  choice: тяжко
  rationale: Сохраняет значение тяжести и суровости увиденного, не сужая его до одного лишь эмоционального «ужасно».
- source_word: ኃያለ
  choice: грозно
  rationale: Передаёт силу и подавляющий характер видения в данном контексте; буквальное «сильно» по-русски здесь неестественно.
- source_word: ኅቡኣተ ኵሉ ኃጢአተ ምድር
  choice: о тайнах всего греха земли
  rationale: Следует возможному субстантивному пониманию ኅቡኣተ как «тайны, сокрытое» и не превращает трудную фразу в однозначное утверждение, что сон непременно раскрывает грех.
- source_word: ትሰጠም
  choice: предстоит погрузиться
  rationale: Сохраняет образ погружения и оттенок предстоящего суда.
- source_word: ቀላይት
  choice: бездна
  rationale: Передаёт глубину или пучину с уместным для апокалиптического контекста космическим оттенком.
- source_word: ተሐጕል ኅጕለ ዐቢየ
  choice: погибнуть великой погибелью
  rationale: Воспроизводит усилительную конструкцию с однокоренным дополнением и верно передаёт значение гибели, а не тьмы или окутывания.
theological_decisions:
- issue: К чему относится подразумеваемое подлежащее заключительных глаголов
  choice: В основном тексте употреблено «ей», допускающее ближайшее соотнесение с землёй, но неоднозначность отмечена в сноске.
  alternative: Отнести действия к видению, греху либо ко всему содержанию предсказанного суда.
  rationale: Эфиопская фраза синтаксически сжата, и точный референт не выражен достаточно ясно; поэтому нельзя догматически закреплять только одно толкование.
- issue: Значение трудной фразы ኅቡኣተ ኵሉ ኃጢአተ ምድር
  choice: «о тайнах всего греха земли»
  alternative: «оно открывает весь сокрытый грех земли» или «оно сокрыло весь грех земли».
  rationale: Избранный вариант близок к возможному значению «сокрытое, тайны» и сохраняет смысловую напряжённость трудного места.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Однокоренная формула «погибнуть великой погибелью» намеренно сохранена как выразительная библейская конструкция; трудные местоименные связи и лексическая неоднозначность вынесены в сноски.
