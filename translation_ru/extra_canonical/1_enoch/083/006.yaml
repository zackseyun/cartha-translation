base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/006.yaml
  text: And Malyal my grandfather lifted me up while I was lying beside him[a], and he said to me, “Why do you cry out like this, my son[c][b], and why do you lament like this?”
translation:
  language: ru
  text: 'И Маляль, мой дед, поднял меня, когда я лежал рядом с ним, и сказал мне: «Почему ты так кричишь, сын мой, и почему так сетуешь?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መላእያል
  choice: Малаил
  rationale: Эфиопская форма имени, по всей вероятности, соответствует библейскому патриарху Малаилу; в русском тексте употреблена его устоявшаяся библейская форма.
- source_word: እምሔውየ
  choice: мой дед
  rationale: Слово понимается как существительное «мой дед», согласно исправленному разбору, а не как сочетание со значением «оттуда, где я был».
- source_word: አንሥአኒ
  choice: поднял меня
  rationale: Передаёт физическое действие поднятия без добавочного истолкования.
- source_word: እንዘ እነ እስክብ
  choice: когда я лежал
  rationale: Конструкция обозначает одновременное состояние; упоминание сна, отсутствующее явно, не добавляется.
- source_word: ኀቤሁ
  choice: рядом с ним
  rationale: Естественно передаёт пространственную близость.
- source_word: ትጸርኅ
  choice: кричишь
  rationale: Сохраняет значение громкого возгласа и отличается от следующего глагола скорби.
- source_word: ወልድየ
  choice: сын мой
  rationale: Естественное и достойное русское обращение старшего родственника.
- source_word: ትአወዩ
  choice: сетуешь
  rationale: Передаёт выраженную словами скорбь и сохраняет различие с первым действием — криком.
theological_decisions:
- issue: Идентификация መላእያል
  choice: Передать как «Малаил»
  alternative: Транслитерировать непосредственную эфиопскую форму как «Маляль»
  rationale: В контексте прямого обозначения деда Еноха идентификация с патриархом Малаилом достаточно ясна; устоявшаяся русская библейская форма имени понятна читателю и не привносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Два близких действия — громкий крик и скорбное сетование — переданы разными глаголами. Пунктуация упрощена для плавного чтения без изменения синтаксических связей.
