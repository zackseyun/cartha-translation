base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/010.yaml
  text: And after this I arose and prayed and entreated and asked[a], and I wrote down my prayer for the generations of the world; and I showed you everything[b], my son Methuselah.
translation:
  language: ru
  text: После этого я встал, помолился, умолял и просил; я записал свою молитву для поколений мира[a] и покажу тебе всё[b], сын мой Мафусал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для всех будущих поколений», «для поколений навеки». Слово ዓለም может обозначать мир, век или вечность.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможное чтение: «и показал тебе всё». Форма в предоставленной транскрипции не вполне ясна; контекст и принятое исправленное чтение поддерживают перевод «покажу тебе».'
    reason: textual_variant
lexical_decisions:
- source_word: እምኔሁ
  choice: после этого
  rationale: Передаёт переход к следующему событию после видения и естественно звучит в русском повествовании.
- source_word: ተንሣእኩ
  choice: я встал
  rationale: Прямое и современное обозначение телесного действия без излишней архаизации.
- source_word: ጸለይኩ ወአስተብቋዕኩ ወሰአልኩ
  choice: помолился, воззвал и попросил
  rationale: Сохранено нанизывание трёх молитвенных действий; «воззвал» передаёт усиленную мольбу, а «попросил» остаётся отдельным, более общим глаголом.
- source_word: ጸሎትየ ጸሐፍኩ
  choice: я записал свою молитву
  rationale: «Записал» естественно передаёт совершение письменной записи, а не только сочинение текста.
- source_word: ለትውልደ ዓለም
  choice: для поколений мира
  rationale: Близко сохраняет неоднозначную конструкцию, в которой ዓለም может означать мир, век или вечность; более истолковывающие варианты вынесены в примечание.
- source_word: ኵሎ
  choice: всё
  rationale: Естественно передаёт всеохватный объект сообщения.
- source_word: አርአየከ
  choice: покажу тебе
  rationale: Контекст вводит рассказ о видении, которое Енох намерен изложить Мафусалу. Засвидетельствованная форма вызывает текстологическую и морфологическую трудность, поэтому вопрос отмечен в сноске.
- source_word: ወልድየ ማቱሳላ
  choice: сын мой Мафусал
  rationale: Сохранено прямое родственное обращение; «Мафусал» — укоренившаяся русская библейская форма имени.
theological_decisions:
- issue: Временной охват выражения ለትውልደ ዓለም
  choice: для поколений мира
  alternative: для всех будущих поколений; для поколений навеки
  rationale: Основной текст не сводит многозначное ዓለም исключительно к будущему времени или вечности, сохраняя смысловую открытость источника.
- issue: Время и субъект формы አርአየከ
  choice: и покажу тебе всё
  alternative: и показал тебе всё; и он показал тебе всё
  rationale: Будущее первое лицо лучше соответствует контексту обращения Еноха к Мафусалу и чтению исправленной формы አርእየከ; однако предоставленная транскрипция допускает иное морфологическое понимание, которое отмечено в примечании.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным молитвенно-повествовательным звучанием. Синтаксическое накопление действий сохранено, архаизмы сведены к минимуму.
