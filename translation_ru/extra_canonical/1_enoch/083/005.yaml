base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/005.yaml
  text: And a word fell into my mouth because of it[a], and I lifted up a cry and said[d][c][b], “The earth is destroyed.”
translation:
  language: ru
  text: 'И от этого слово сошло мне на уста[a]; я громко воскликнул[b] и сказал: «Земля погибла»[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «из этого» или «после этого»; оборот может указывать на источник, причину или последовательность после предшествующего видения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «я поднял крик».'
    reason: literal_rendering
  - marker: c
    text: 'Или: «страна погибла». Глагол означает гибель или уничтожение, а не буквально «была поглощена».'
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኔሁ
  choice: от этого
  rationale: Предлог с местоименным суффиксом может обозначать источник, причину или последовательность. В контексте видения «от этого» естественно передаёт причинно-результативную связь, не исключая оттенка источника.
- source_word: ወድቀ ነገር ውስተ አፉየ
  choice: слово сошло мне на уста
  rationale: Сохранён образ непроизвольно возникшего или внушённого высказывания; русское «сошло на уста» звучит естественнее буквального «упало в мой рот», но удерживает исходную метафору.
- source_word: አንሣእኩ እጽራሕ
  choice: я громко воскликнул
  rationale: Сочетание поднятия и крика передано естественным русским выражением, сохраняющим силу и громкость возгласа без уточнения, был ли это плач, тревога или провозглашение.
- source_word: ተሐጕለት
  choice: погибла
  rationale: Глагол означает уничтожение или гибель. Это сохраняет отличие от глагола со значением «быть поглощённым», употреблённого в предыдущем стихе.
- source_word: ምድር
  choice: земля
  rationale: В апокалиптическом видении слово допускает широкий, космический смысл; русское «земля» также может обозначать сушу или страну в зависимости от контекста.
theological_decisions:
- issue: Масштаб значения ምድር в видении потопа
  choice: земля
  alternative: страна, суша
  rationale: «Земля» сохраняет возможный всемирный масштаб апокалиптического образа, но не навязывает отдельного догматического толкования.
- issue: Характер возникшего высказывания
  choice: сохранить образ «слово сошло мне на уста»
  alternative: я заговорил
  rationale: Образ допускает непроизвольный или вдохновенный характер речи, однако перевод не определяет его как прямое божественное внушение.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Неестественный буквальный оборот «слово упало в мой рот» умеренно идиоматизирован как «слово сошло мне на уста», тогда как необычность и потенциально вдохновенный характер речи сохранены.
