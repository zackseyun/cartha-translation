base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/003.yaml
  text: I was lying down in the house of my grandfather Mahalalel[a], and I saw in a vision that the heaven was being cleansed and swept away[c][b], and it fell upon the earth.
translation:
  language: ru
  text: Я лежал[a] в доме моего деда Малелеила и увидел в видении, как небо рушится, уносится прочь[b] и падает на землю.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Я спал». Исходное выражение описывает состояние лежащего человека и может в данном контексте подразумевать сон.'
    reason: lexical_alternative
  - marker: b
    text: Чтение двух глаголов не вполне надёжно из-за состояния транскрипции. Их также передавали как «очищается и сметается», однако контекст падения неба лучше согласуется с его обрушением и унесением.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ስኩበ፡ ኮንኩ
  choice: Я лежал
  rationale: Причастие с глаголом «быть» обозначает продолжавшееся состояние и служит фоном для видения; русский имперфектив «лежал» передаёт это естественно, не утверждая однозначно, что Енох спал.
- source_word: በቤት፡ መላሕእል፡ እምሑውየ
  choice: в доме моего деда Малелеила
  rationale: Сохранено конкретное место действия; родственный термин уточнён по известной в повествовании генеалогии, а имя дано в привычной русской библейской форме.
- source_word: ርኢኩ፡ በራእይ
  choice: увидел в видении
  rationale: Передаёт обычную формулу сообщения о визионерском опыте, сохраняя повтор корня, естественный для возвышенной русской речи.
- source_word: ሰማይ
  choice: небо
  rationale: Русское «небо» сохраняет космический смысл и одновременно не вводит искусственного разграничения между небом и небосводом.
- source_word: ይትነጻጻ
  choice: рушится
  rationale: Форма в транскрипции, вероятно, отражает повреждённое или ошибочно распознанное чтение глагола со значением низвержения или разрушения; контекст последующего падения поддерживает «рушится», а не «очищается».
- source_word: ወይትሀየድ
  choice: уносится прочь
  rationale: Передаёт насильственное удаление или унесение, не уточняя без достаточных оснований действующую силу.
- source_word: ወይወድቅ፡ ዲበ፡ ምድር
  choice: и падает на землю
  rationale: Настоящее время в зависимом описании после «увидел, как» естественно по-русски представляет разворачивающуюся перед глазами картину и сохраняет движение вниз на землю.
theological_decisions:
- issue: Космический референт слова ሰማይ
  choice: небо как часть мироздания
  alternative: видимое небо или небосвод
  rationale: Контекст видения изображает космическую катастрофу. Обычное русское «небо» сохраняет масштаб образа, не навязывая более узкой физической модели.
- issue: Характер происходящего с небом
  choice: разрушение и насильственное унесение
  alternative: очищение и сметание
  rationale: Вероятное исправление ошибочной транскрипции первого глагола и последовательность с падением на землю указывают на обрушение; примечание сохраняет сведения об альтернативной передаче при не вполне надёжном состоянии источника.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Короткая цепь глаголов сохраняет стремительность космической картины; архаизмы и конфессионально окрашенные толкования не вводятся.
