base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/001.yaml
  text: And after this law I saw another law for the lesser light[b][a], whose name is the moon.
translation:
  language: ru
  text: И после этого закона я увидел другой закон для меньшего светила[a], имя которому — луна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «меньшего света». Слово, переведённое в этом стихе как «закон», можно также передать как «установление», «порядок» или «повеление».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወድኅሬሁ
  choice: И после этого
  rationale: Сохраняет временную связку с предшествующим описанием и естественно звучит по-русски.
- source_word: ትእዛዝ
  choice: закон
  rationale: В контексте Астрономической книги обозначает предписанный порядок движения небесных тел. Повтор слова в оригинале сохранён.
- source_word: ርኢኩ
  choice: я увидел
  rationale: Прямая и современная передача формулы повествования о видении.
- source_word: ካልአ
  choice: другой
  rationale: Указывает на ещё один соответствующий закон вслед за предыдущим.
- source_word: ለብርሃን ንኡስ
  choice: для меньшего светила
  rationale: Передаёт относительный статус луны по сравнению с солнцем; «светило» естественно для описания небесного тела, хотя буквально возможно «меньший свет».
- source_word: ዘስሙ
  choice: имя которому
  rationale: Сохраняет относительную конструкцию, вводящую название светила.
- source_word: ወርኅ
  choice: луна
  rationale: Обычное значение геэзского слова; в русском после именной конструкции артикль не требуется.
theological_decisions:
- issue: Значение ትእዛዝ в Астрономической книге
  choice: закон
  alternative: повеление; установление; порядок
  rationale: «Закон» передаёт устойчивое, предписанное устройство движения светил и не сводит слово к единично произнесённому приказу. Сноска сохраняет присущую исходному слову смысловую широту.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичной апокалиптической формулы и повтора ключевого слова. Тире перед «луна» помогает естественно оформить именование без добавления отсутствующей в источнике интерпретации.
