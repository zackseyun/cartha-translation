base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/005.yaml
  text: And its distant half is one seventh part[a], and all its disk is empty, without light[c][b], except for a seventh part of it—a fourteenth part of its light.
translation:
  language: ru
  text: А его дальняя половина составляет одну седьмую часть[a], и весь его диск пуст, лишён света, кроме одной седьмой его части — одной четырнадцатой части его света[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Числовое выражение в эфиопском тексте трудное. Слово, переведённое как «часть», буквально означает «рука», но здесь служит обозначением доли в размеренном цикле светила.
    reason: lexical_alternative
  - marker: b
    text: 'По-видимому, речь идёт об одной четырнадцатой всего света: она составляет одну седьмую половины светила.'
    reason: numerical_clarification
  - marker: c
    text: Стих описывает освещённую и тёмную части луны схематическим языком Астрономической книги, а не в терминах современной науки.
    reason: cultural_note
lexical_decisions:
- source_word: መንፈቀ
  choice: половина
  rationale: Слово обозначает половину или разделённую часть; в описании светила количественное значение «половина» наиболее уместно и не вносит лишнего истолкования.
- source_word: ርኁቅ
  choice: дальняя
  rationale: Передаёт пространственное значение «далёкий, удалённый» естественным современным русским выражением.
- source_word: ሳብዐተ እደ አሐደ
  choice: одну седьмую часть
  rationale: В данном астрономическом счёте сочетание с እድ, буквально «рука», служит обозначением доли; дробное прочтение согласуется с делением света луны на четырнадцать частей.
- source_word: ኵሉ ክበበ ዚአሁ
  choice: весь его диск
  rationale: ክበብ буквально означает круг или окружность; «диск» естественно обозначает видимую круглую поверхность светила.
- source_word: ባክ ዘአልቦ ብርሃነ
  choice: пуст, лишён света
  rationale: Сохранены и образ пустоты, и прямое указание на отсутствие света, присутствующие в эфиопском тексте.
- source_word: ዘእንበለ
  choice: кроме
  rationale: Ясно и кратко передаёт исключительное значение частицы.
- source_word: ሳብዐተ እዴሁ
  choice: одной седьмой его части
  rationale: Форма понята как дробное обозначение; местоименная связь с диском сохранена.
- source_word: ዐሠርተ ራብዐተ እደ ብርሃኑ
  choice: одной четырнадцатой его света
  rationale: Дробное прочтение передаёт меру освещённости в системе четырнадцати долей и сохраняет повторяющийся технический язык раздела.
theological_decisions:
- issue: Характер описания светила
  choice: Сохранить техническое апокалиптическое измерение долей света, не заменяя его современным объяснением лунной фазы.
  alternative: Пересказать стих как общее описание прибывания или убывания луны либо привести числа к современной научной терминологии.
  rationale: Астрономическая книга описывает небесные циклы посредством повторяющихся мер и долей. Сохранение этой формы уважает собственную космологическую речь текста и не привносит позднейшую модель.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным регистром. Сохранены сжатость, числовая повторяемость и некоторая трудность исходного астрономического описания; термин «диск» употреблён в обычном астрономическом смысле.
