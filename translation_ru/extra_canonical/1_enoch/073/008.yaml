  text: And on that day it rises with exactly seven parts[b][a], and it comes out.
translation:
  language: ru
  text: И в тот день она[a] восходит, имея ровно семь долей света[b], и появляется.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть луна, о которой говорится в данном разделе.
    reason: Уточнение подразумеваемого подлежащего.
  - marker: b
    text: 'Буквально: «с ровно семью долями»; из контекста следует, что имеются в виду доли её света.'
    reason: В оригинале слово «свет» подразумевается, а не выражено явно.
lexical_decisions:
- source_word: ይሠርቅ
  choice: восходит
  rationale: Глагол употребляется о восходе небесного светила; такое значение соответствует астрономическому контексту.
- source_word: በይእቲ ዕለት
  choice: в тот день
  rationale: Предлог с указательным словом и существительным «день» образует обычное обстоятельство времени.
- source_word: ሳብዐተ እደ
  choice: семь долей
  rationale: Сочетание обозначает семь частей или долей; «доля» естественно звучит при описании видимой освещённости луны.
- source_word: ጥንቁቀ
  choice: ровно
  rationale: 'Передаёт значение точности: именно семь долей.'
- source_word: ይወፅእ
  choice: появляется
  rationale: Буквально глагол означает выход или появление наружу; здесь речь о появлении светила над горизонтом.
theological_decisions:
- issue: Подлежащее глаголов
  choice: Женское местоимение «она», относящееся к луне в контексте раздела
  alternative: Передать глаголы без явно названного подлежащего или использовать буквальный мужской род форм геэзского текста
  rationale: Мужской род глагольных форм согласуется с грамматикой геэзского обозначения светила, но в естественном русском при отсылке к луне требуется женский род. Это грамматическая адаптация, а не изменение образа.
- issue: Природа семи долей
  choice: Уточнить в тексте, что это доли света
  alternative: Оставить буквально «семь долей» без указания, доли чего имеются в виду
  rationale: В астрономическом контексте подразумеваются доли видимого света луны. Уточнение делает фразу понятной по-русски, а буквальная форма сохранена в примечании.
translation_notes:
  register: 'Современный литературный русский язык с сохранением краткого, схематичного характера астрономического описания. Повтор двух глаголов движения передан различными естественными русскими словами: «восходит» и «появляется».'
