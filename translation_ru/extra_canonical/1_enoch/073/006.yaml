  text: And on the day it takes up a seventh part of half of its light[c][b][a], and its light becomes one and a half seventh parts.
translation:
  language: ru
  text: И в тот день она получает одну седьмую половины своего света[a], и её свет становится равным полутора седьмым долям[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально выражение содержит слово «рука», которое здесь служит обозначением измеренной части; по смыслу — «одна седьмая доля».
    reason: lexical_alternative
  - marker: b
    text: Числовая формулировка в эфиопском тексте трудна. Буквально её можно понять как «одна [седьмая] и половина»; вероятно, имеется в виду полторы седьмых доли света.
    reason: textual_uncertainty
lexical_decisions:
- source_word: በዕለተ
  choice: в тот день
  rationale: Передаёт конкретное временное указание в контексте календарного описания; указательное «тот» естественно связывает стих с последовательностью дней.
- source_word: ትነሥእ
  choice: она получает
  rationale: В данном числовом контексте глагол обозначает получение или прибавление света; он переведён одним сказуемым, без ошибочного удвоения «восходит и получает».
- source_word: ሳብዐተ እደ
  choice: одну седьмую
  rationale: В астрономическом контексте выражение обозначает долю меры, то есть одну седьмую, а не семь частей; буквально в нём употреблено слово «рука» как единица измерения.
- source_word: መንፈቀ ብርሃኑ
  choice: половины своего света
  rationale: Сохраняет дробную величину и повтор ключевого понятия «свет».
- source_word: ይከውን
  choice: становится равен
  rationale: Передаёт наступление нового количественного состояния и естественно сочетается в русском языке с обозначением величины.
- source_word: አሐተ ወመንፈቃ
  choice: полутора
  rationale: Фраза «одна и половина» в сочетании с седьмыми долями естественно передаётся как «полутора».
theological_decisions:
- issue: Род светила в русском переводе
  choice: Женский род («она», «её») по естественному русскому обозначению луны
  alternative: Средний род («оно», «его») вслед за английским нейтральным местоимением или формальными особенностями исходного текста
  rationale: В контексте речь идёт о луне; в современном русском «луна» женского рода. Это грамматическая адаптация, а не усиление персонификации или богословское толкование.
- issue: Неясная арифметическая формулировка
  choice: Передать результат как «полутора седьмым долям»
  alternative: 'Буквально: «одной седьмой и половине» либо «семи частям, одной и половине»'
  rationale: Выбранное чтение согласуется с дробным астрономическим приращением, но действительная трудность числовой формулы открыто отмечена в сноске.
translation_notes:
  register: Современный литературный русский с сохранением мерного, астрономического характера отрывка. Формулировка сделана понятной, но числовая неясность источника не скрыта.
