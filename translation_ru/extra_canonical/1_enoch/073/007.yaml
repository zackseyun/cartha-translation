base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/007.yaml
  text: And it sets with the sun[a]; and when the sun rises, the moon rises with it and takes half a portion of light. And on that night, at the beginning of its morning, before the day[c][b], the moon sets with the sun and is dark through that night—seven parts and a half.
translation:
  language: ru
  text: И она заходит вместе с солнцем; а когда солнце восходит, луна восходит вместе с ним и получает половину доли света. И в ту ночь, в начале её утра, прежде дня[a], луна заходит вместе с солнцем и остаётся тёмной в ту ночь — семь с половиной долей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфиопская формулировка в середине стиха трудна, особенно слова «в начале её утра, прежде дня». Перевод сохраняет временную последовательность близко к тексту и не превращает её в современное астрономическое объяснение. Возможно также: «прежде дня луна заходит».'
    reason: textual_variant
  - marker: b
    text: В этой главе лунный свет неоднократно измеряется числом «долей». Поэтому и «половина доли света», и «семь с половиной долей» относятся к одной системе измерения освещённости луны.
    reason: cultural_note
lexical_decisions:
- source_word: የዓርብ
  choice: заходит
  rationale: В астрономическом контексте глагол обозначает заход светила; это естественный и точный русский термин.
- source_word: ይሠርቅ
  choice: восходит
  rationale: Глагол дважды относится к светилам и противопоставлен их заходу.
- source_word: ምስሌሁ
  choice: вместе с ним
  rationale: Местоимение относится к солнцу; мужской род соответствует русскому слову «солнце» только грамматически не подходит, однако конструкция «с ним» сохраняет референцию к названному светилу в рамках исходного синтаксиса.
- source_word: ይነሥእ
  choice: получает
  rationale: В контексте луна обретает отмеренное количество света; «получает» естественнее по-русски и не объясняет механизм.
- source_word: መንፈቀ እደ ብርሃን
  choice: половину доли света
  rationale: Сохранены и значение половины, и используемый в главе образ измеряемых долей света.
- source_word: በርእሰ ጽባሐ ዚአሁ
  choice: в начале её утра
  rationale: Буквально выражение указывает на «главу/начало её утра»; несколько необычная формулировка сохраняет неоднозначную временную последовательность.
- source_word: በቅድመ ዕለቱ
  choice: прежде дня
  rationale: Сохранена сжатая временная формула источника без добавления спорного уточнения «луны».
- source_word: ይጸልም
  choice: остаётся тёмной
  rationale: Передано состояние темноты луны на протяжении указанной ночи без модернизирующего астрономического объяснения.
- source_word: ፯ሳብዓተ እደ ወንፍቃ
  choice: семь с половиной долей
  rationale: Передана система счёта лунного света по долям, последовательно используемая в главе.
theological_decisions:
- issue: Донаучное и визионерское описание движения и света небесных светил
  choice: Сохранить конкретные восход, заход и измерение света долями
  alternative: Пересказать как описание фаз Луны, соединения светил или затмения
  rationale: Текст излагает небесный порядок в собственной космологической образности; перевод не должен согласовывать её с современной астрономией.
- issue: Неясная временная связь выражений в середине стиха
  choice: Сохранить последовательность «в ту ночь, в начале её утра, прежде дня»
  alternative: Перестроить фразу и однозначно связать «прежде дня» с заходом луны
  rationale: Синтаксис источника труден; сохранение некоторой шероховатости не позволяет молча устранить подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством древнего астрономического описания. Сохранены повторения «солнце», «луна», «в ту ночь» и несколько непривычная временная конструкция там, где источник действительно неясен; модернизация космологии исключена.
