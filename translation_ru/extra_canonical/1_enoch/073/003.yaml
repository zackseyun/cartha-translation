base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/003.yaml
  text: And in every month its going out and its returning vary[a], and its days are like the days of the sun; and when its light is full[c][b], it is a seventh part of the light of the sun.
translation:
  language: ru
  text: И в каждом месяце его выход и возвращение изменяются[a], а его дни — как дни солнца; и когда его свет достигает полноты[b], он составляет седьмую часть света солнца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Речь идёт о циклическом «выходе» и «возвращении» светила — вероятно, это астрономические или близкие к ним обозначения его движения. Возможен более истолковывающий перевод: «восход и заход».'
    reason: lexical_alternative
  - marker: b
    text: То есть когда лунный свет становится полным. Эфиопский глагол здесь означает ясность, яркость или полноту света, а не его угасание.
    reason: textual_clarification
lexical_decisions:
- source_word: ሙፃኢሁ
  choice: его выход
  rationale: Существительное обозначает выход или появление; нейтральное «выход» сохраняет астрономическую образность, не сужая значение до «восхода».
- source_word: ምብዋኢሁ
  choice: его возвращение
  rationale: В паре с «выходом» слово обозначает возвращение или вхождение; «возвращение» сохраняет формальный параллелизм и не навязывает значение «заход».
- source_word: ይትዌለጥ
  choice: изменяются
  rationale: Глагол передаёт изменение или различие от месяца к месяцу; форма множественного числа естественно согласуется с парой «выход и возвращение».
- source_word: መዋዕሊሁ
  choice: его дни
  rationale: Прямое соответствие исходному выражению, вероятно относящемуся к дням лунного цикла, без добавления отсутствующего пояснения.
- source_word: ከመ መዋዕለ ፀሐይ
  choice: как дни солнца
  rationale: Сравнительная частица естественно передаётся словом «как»; это не превращает сравнение в более определённое утверждение о равенстве.
- source_word: ይፄሪ
  choice: достигает полноты
  rationale: В данном описании лунного света глагол указывает на ясность, яркость и полноту, а не на потемнение. Русская формулировка естественно передаёт состояние полной освещённости.
- source_word: ከዊነ ብርሃኑ ይከውን
  choice: его свет … составляет
  rationale: Конструкция описывает состояние света и вводит последующее количественное соотношение; «составляет» ясно и естественно выражает его по-русски.
- source_word: ሳብዓደ እደ
  choice: седьмую часть
  rationale: Фраза обозначает дробную меру — одну седьмую.
- source_word: እምብርሃነ ፀሐይ
  choice: света солнца
  rationale: При обозначении доли исходная предложная связь естественно передаётся русским родительным падежом.
