base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/004.yaml
  text: And in this way it rises[a], and its front, which is toward the east, comes out on the thirtieth morning, and on that day it becomes visible, and it shall be for you the head of the month, on the thirtieth day with the sun[e][d][c][b], in the gate from which the sun comes out.
translation:
  language: ru
  text: И так она восходит; её передняя часть, обращённая к востоку, появляется на тридцатое утро. В тот день она становится видимой и будет для вас главой месяца[a] — на тридцатый день, вместе с солнцем, во вратах, из которых выходит солнце.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «головой месяца», то есть его началом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይሠርቅ
  choice: восходит
  rationale: Глагол в данном астрономическом контексте обозначает восхождение светила; перевод сохраняет наблюдаемое небесное движение и не вводит неуместное значение «скрывается».
- source_word: ርእሱ
  choice: её передняя часть
  rationale: Буквально «её голова»; здесь слово пространственно обозначает обращённую вперёд видимую часть. Русское «передняя часть» передаёт образ без неестественного выражения «голова луны».
- source_word: ዘመንገለ ጽባሕ
  choice: обращённая к востоку
  rationale: Фраза указывает направление утра или восхода, то есть восток.
- source_word: በሠላሳ ጽባሕ
  choice: на тридцатое утро
  rationale: Временная конструкция отмечает тридцатое утро цикла.
- source_word: ያስተርኢ
  choice: становится видимой
  rationale: Каузативная форма выражает проявление или становление видимым; перевод естественен для описания фазы луны.
- source_word: ርእሰ ወርኅ
  choice: главой месяца
  rationale: Сохранён конкретный исходный образ «головы месяца», обозначающий его начало; смысл разъяснён в сноске.
- source_word: ሠላሳ ዕለት
  choice: на тридцатый день
  rationale: В календарном контексте сочетание количественного числительного со словом «день» функционирует как обозначение порядковой даты.
- source_word: ምስለ ፀሐይ
  choice: вместе с солнцем
  rationale: Предлог выражает совместность или соположение луны и солнца.
- source_word: በኆኅት
  choice: во вратах
  rationale: Сохранён характерный для Астрономической книги образ небесных врат.
- source_word: እንተ ይወፅእ ፀሐይ
  choice: из которых выходит солнце
  rationale: Относительное предложение определяет врата через выход из них солнца и сохраняет конкретную пространственную образность.
theological_decisions:
- issue: Следует ли заменять древнюю космологическую и календарную образность современной астрономической терминологией
  choice: Сохранить выражения «глава месяца», «врата» и «выходит солнце».
  alternative: Передать их как «начало нового месяца», «восточный горизонт» и «восход солнца».
  rationale: Текст излагает собственную космологическую картину. Модернизация сделала бы перевод понятнее лишь ценой утраты апокалиптической образности и внесения понятий, отсутствующих в источнике.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным синтаксисом. Конкретная космологическая образность источника сохранена; буквальное «её голова» передано более естественным пространственным выражением «её передняя часть».
