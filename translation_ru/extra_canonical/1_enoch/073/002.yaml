base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/002.yaml
  text: And its circuit is like the circuit of heaven[a], and its chariots, by which it goes out, are driven by the wind[c][b]; and light is given to it by measure.
translation:
  language: ru
  text: И круг его подобен кругу неба, а его колесницы, на которых он выезжает, приводятся в движение ветром[a]; и свет даётся ему по мере[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфиопский текст этой части стиха синтаксически труден. Возможно также: «его колесницы идут туда, где дует ветер» или «его колесницы несутся ветром».'
    reason: textual_variant
  - marker: b
    text: 'Возможно также: «согласно мере» или «по установленной мере»; речь идёт об упорядоченном, размеренном даровании света.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ክበቡ
  choice: круг его
  rationale: Существительное от корня со значением окружения может обозначать окружность либо круговой ход. «Круг» сохраняет обе возможности и не вводит современное понятие орбиты.
- source_word: ከመ ክበበ ሰማይ
  choice: подобен кругу неба
  rationale: Передаёт явное сравнение и сохраняет возвышенный космический образ; «небо» здесь уместнее, чем более бытовой вариант «небосвод».
- source_word: ሰረገላተ ዚአሁ
  choice: его колесницы
  rationale: «Колесницы» сохраняют образный язык апокалиптического видения и грамматическое множественное число оригинала.
- source_word: በኀበ ይጼዓን ነፋስ ትነፍስ
  choice: на которых он выходит, приводятся в движение ветром
  rationale: Перевод сохраняет относящееся к колесницам выражение о выходе светила и связь их движения с ветром, не скрывая при этом трудности синтаксиса, отмеченной в сноске.
- source_word: በመስፈርት
  choice: по мере
  rationale: Кратко передаёт значение меры, установленного соотношения или порядка, не уточняя сверх текста, является ли мера количественной либо временной.
- source_word: ይትወሀብ ሎቱ ብርሃን
  choice: свет даётся ему
  rationale: 'Сохранён пассив оригинала: свет представлен как даваемый светилу, а не прямо назван его собственным излучением.'
theological_decisions:
- issue: Следует ли передавать движение светила в терминах современной астрономии
  choice: Сохранить образы круга и колесниц
  alternative: «его орбита» и «средства движения»
  rationale: Оригинал говорит образным космологическим языком; современная терминология внесла бы отсутствующие в тексте научные категории.
- issue: Следует ли истолковывать пассив «свет даётся ему» как указание на конкретного подателя света
  choice: Сохранить безличный пассив без называния действующего лица
  alternative: «Бог даёт ему свет»
  rationale: Текст не называет подателя непосредственно; перевод не должен добавлять богословское уточнение, хотя пассивный строй сохраняет представление о получаемом свете.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным регистром. Сохранены космические образы «круга» и «колесниц»; избегнуты как архаизмы, так и анахроничная астрономическая терминология.
