base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/004/001.yaml
  text: And again[a], observe the days of summer—how the sun comes upon it at its beginning, and you seek shelter and shade because of the heat of the sun[c][b], and the earth is scorched with burning heat, and you cannot tread on the earth or upon a rock because of its heat.
translation:
  language: ru
  text: 'И снова рассмотрите[c] дни лета: как в самом его начале солнце стоит над ним[a], а вы из-за солнечного зноя ищете укрытия и тени[b]. Земля раскаляется от палящего жара, и из-за этого жара вы не можете ступать ни по земле, ни по камню.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфиопская фраза трудна для понимания; возможно, речь конкретнее идёт о силе солнца с наступлением лета.
    reason: textual_variant
  - marker: b
    text: Парное выражение «укрытия и тени» сохраняет два близких по смыслу слова эфиопского текста.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «расспросите о». В данном контексте также возможно значение «исследуйте».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ዳግመ
  choice: и снова
  rationale: Передаёт связующий повторный пример и сохраняет последовательный призыв наблюдать явления природы.
- source_word: ጠየቁ
  choice: рассмотрите
  rationale: Форма — повелительное наклонение множественного числа; в данном контексте глагол призывает внимательно исследовать природное явление, а не просто задать вопрос.
- source_word: መዋዕለ ሐጋይ
  choice: дни лета
  rationale: Сохраняет конкретную временную формулировку источника и естественно звучит по-русски.
- source_word: ከመ ኮነ ፀሓይ ላዕሌሃ በቅድሜሃ
  choice: как в самом его начале солнце оказывается над ним
  rationale: Сохраняет трудную пространственно-временную образность эфиопского текста и не уточняет сверх источника характер действия солнца.
- source_word: ተኀሥሡ ምጽላለ ወጽላሎተ
  choice: ищете укрытия и тени
  rationale: Передаёт поиски защиты от зноя и сохраняет парное выражение источника, не сводя его к одному понятию.
- source_word: በእንተ ዋዕየ ፀሓይ
  choice: из-за солнечного зноя
  rationale: Кратко и естественно передаёт причинную связь и сильный жар солнца.
- source_word: ወምድርኒ ትውዒ እሙቀተ ሐሩር
  choice: земля раскаляется от палящего жара
  rationale: Сохраняет яркий физический образ сильно нагретой земли и усилительный характер выражения.
- source_word: ኢትክሉ ከይዶታ ለምድር ወኢ ኰኵሐ በእንተ ዋዕያ
  choice: из-за этого жара вы не можете ступать ни по земле, ни по камню
  rationale: Передаёт восстановленную заключительную часть стиха, включая отрицательную парную конструкцию и причину невозможности идти.
theological_decisions:
- issue: Природный образ как нравственно-богословское свидетельство
  choice: Оставить стих непосредственным описанием упорядоченного хода времён года.
  alternative: Истолковать летний зной непосредственно как образ божественного суда.
  rationale: Сам стих описывает наблюдаемое явление природы; его более широкое богословское значение раскрывается контекстом и не должно вноситься в перевод как явное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но общедоступным звучанием. Синтаксис сохраняет последовательность наблюдений источника; двоеточие и разделение на два предложения устраняют чрезмерную тяжеловесность без изменения логики стиха.
