base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/034/001.yaml
  text: And from there I went toward the north[a], to the ends of the earth[c][b], and there I saw a great wonder.
translation:
  language: ru
  text: И оттуда я пошёл к северу, к краям земли, и там увидел великое чудо.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В приведённой транскрипции стоит ምሕረ, по-видимому, в результате ошибочного распознавания букв. Чтение критического текста መንክረ означает «чудо, диво».
    reason: textual_emendation
lexical_decisions:
- source_word: እምህየ
  choice: оттуда
  rationale: Естественное современное соответствие указательному обороту, связывающему этот этап пути с предыдущим местом видения.
- source_word: ሖርኩ
  choice: я пошёл
  rationale: Передаёт простое повествовательное обозначение движения без добавочной литературной окраски.
- source_word: መንገለ መስዕ
  choice: к северу
  rationale: መስዕ означает «север»; оборот указывает направление движения. Это исправляет прежнее ошибочное прочтение «к югу».
- source_word: በአጽናፈ ምድር
  choice: к краям земли
  rationale: Сохраняет апокалиптический образ пределов земли и естественно сочетается в русском с глаголом движения.
- source_word: ርኢኩ
  choice: увидел
  rationale: Прямое и ясное соответствие обычному глаголу зрительного восприятия в рассказе о видении.
- source_word: መንክረ ዐቢየ
  choice: великое чудо
  rationale: Исправленное чтение መንክረ означает «чудо, диво»; прилагательное ዐቢየ передано как «великое» в соответствии с возвышенным регистром.
theological_decisions:
- issue: Характер увиденного Енохом
  choice: великое чудо
  alternative: великое место покоя
  rationale: Пространственное толкование «место покоя» не имеет достаточной лексической опоры и возникло из ошибочно распознанной формы. Перевод «великое чудо» следует восстановленному чтению, не уточняя природу увиденного и не привнося богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным повествовательным строем. «Края земли» сохраняют космографическую образность исходного текста; архаизмы вроде «узрел» и «дивное явление» не использованы.
