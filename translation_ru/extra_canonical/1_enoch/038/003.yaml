base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/003.yaml
  text: When the hidden things of the righteous are revealed, sinners will be judged, and the wicked will be driven away from the face of the righteous and the chosen.
translation:
  language: ru
  text: Когда откроется сокрытое у праведных[a], грешники будут судимы, а нечестивые будут изгнаны от лица праведных и избранных[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тайны праведных». Эфиопское выражение обозначает то, что было сокрыто, но стих не уточняет, идёт ли речь о делах, истинном положении праведных или основаниях их оправдания.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от лица праведных и избранных» — образ удаления из их присутствия в сцене суда.'
    reason: cultural_note
lexical_decisions:
- source_word: ሶበ
  choice: когда
  rationale: Передаёт временной союз и сохраняет построение «когда…», вводящее условно-временную часть высказывания.
- source_word: ይትከሠት
  choice: откроется
  rationale: Возвратно-пассивная форма естественно передаёт раскрытие прежде сокрытого в контексте суда.
- source_word: ኅቡኣቲሆሙ፡ ለጻድቃን
  choice: сокрытое у праведных
  rationale: 'Сохраняет неопределённость субстантивированного множественного обозначения: речь может идти о тайнах, делах, положении или основаниях оправдания праведных, без преждевременного уточнения.'
- source_word: ይትኴነኑ
  choice: будут судимы
  rationale: Передаёт судебный пассив, не усиливая его до однозначного «будут осуждены».
- source_word: ኃጥኣን
  choice: грешники
  rationale: Прямое и традиционно понятное обозначение нравственной категории.
- source_word: ይትሀወዙ
  choice: будут изгнаны
  rationale: Выражает принудительное удаление и сохраняет силу картины суда.
- source_word: ረስዓን
  choice: нечестивые
  rationale: Достойный литературный эквивалент, сохраняющий нравственное противопоставление праведным.
- source_word: እምገጸ
  choice: от лица
  rationale: Сохраняет буквальный пространственно-судебный образ удаления от лица или присутствия праведных.
- source_word: ወኅሩያን
  choice: и избранных
  rationale: Передаёт категорию избранных Богом естественным и богословски нейтральным русским словом.
theological_decisions:
- issue: Смысл сокрытого, относящегося к праведным
  choice: сокрытое у праведных
  alternative: тайны праведных; сокрытые среди праведных
  rationale: Эфиопский текст не уточняет, являются ли этим сокрытым дела, тайны, истинное положение праведных или основания их оправдания; перевод сохраняет эту неоднозначность.
- issue: Сила формулы удаления в конце стиха
  choice: изгнаны от лица праведных и избранных
  alternative: удалены из присутствия праведных и избранных
  rationale: Формулировка сохраняет образ принудительного исключения из присутствия оправданного сообщества, не сводя его к стыду или простому уходу.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис «Когда…» сохраняет временную структуру оригинала; выражение «от лица» намеренно оставлено как ясный библейский образ.
