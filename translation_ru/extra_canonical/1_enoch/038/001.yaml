base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/001.yaml
  text: The first parable[a]. When the assembly of the righteous appears, and sinners are judged for their sins, and are driven away from the face of the earth[b],
translation:
  language: ru
  text: Первая притча. Когда явится собрание праведных, и грешники будут судимы за свои грехи, и будут изгнаны с лица земли[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с лица суши» или «с лица сухой земли»; выражение также можно перевести: «с лица земли» или «из страны».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ምሳሌ፡ ቀዳማ፲
  choice: Первая притча
  rationale: Заголовок первого видения или поучительного речения в разделе Притч; «притча» — естественный и традиционно понятный русский эквивалент.
- source_word: ሶበ
  choice: когда
  rationale: Сохраняет временное придаточное, которое продолжается в следующем стихе.
- source_word: ያስተርኢ
  choice: явится
  rationale: Передаёт значение появления, становления видимым, не смешивая его с отдельной лексикой откровения.
- source_word: ማኅበረ፡ ጻድቃን
  choice: собрание праведных
  rationale: Сохраняет коллективный и торжественный смысл выражения, оставаясь понятным современному читателю.
- source_word: ወይትኴነኑ፡ ኃጥኣን
  choice: и грешники будут судимы
  rationale: Судебное значение передано без преждевременного уточнения результата как осуждения.
- source_word: በኃጢአቶሙ
  choice: за свои грехи
  rationale: Предлог обозначает основание суда; возвратное «свои» естественно соотносит грехи с подлежащим.
- source_word: ወእምገጸ፡ የብስ
  choice: с лица земли
  rationale: Буквально выражение содержит образ «лица суши/сухой земли», но по-русски «с лица земли» естественно сохраняет образ и общий смысл.
- source_word: ይትሀወዙ
  choice: будут изгнаны
  rationale: Передаёт пассивное принудительное удаление в контексте суда сильнее и точнее, чем нейтральное «будут удалены».
theological_decisions:
- issue: Следует ли передавать судебный глагол как нейтральное «судимы» или как итоговое «осуждены»
  choice: будут судимы
  alternative: будут осуждены
  rationale: Эфиопский глагол обозначает судебное действие, тогда как карательный исход уже выражен последующим изгнанием; перевод не должен делать сам глагол более определённым, чем источник.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Заголовок отделён точкой; стих оканчивается запятой, поскольку придаточное с «когда» синтаксически продолжается в следующем стихе.
