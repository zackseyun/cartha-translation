base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/004.yaml
  text: And from now on the mighty and exalted who possess the earth shall not be so[a], nor shall they be able to look on the face of the holy ones, because the Lord of Spirits has caused his light to appear on the face of the holy, the righteous[d][c][b], and the chosen.
translation:
  language: ru
  text: И отныне владеющие землёй[a] не будут могущественными и возвышенными; они не смогут увидеть лица святых[b], ибо Господь духов явил Свой свет на лицах святых, праведных и избранных[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «держащие землю», «удерживающие землю». Глагол может обозначать как владение, так и удержание под своей властью.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «увидеть лицо» может подразумевать непосредственную встречу с человеком или доступ к нему.
    reason: cultural_note
  - marker: c
    text: 'В геэзском тексте здесь употреблено единственное число: «на лице святых, праведных и избранных». Русское множественное число передаёт тот же образ применительно к сообществу; свет Господа может пониматься как зримое знамение его оправдания.'
    reason: alternative_reading
lexical_decisions:
- source_word: ዐዚዛነ ወእልዑላነ
  choice: могущественными и возвышенными
  rationale: Оба слова передают силу и высокий статус. В данном построении они имеют форму сказуемого при глаголе «быть», поэтому перевод отражает утрату положения владеющими землёй, а не их исчезновение.
- source_word: እለ ይእኅዝዋ ለምድር
  choice: владеющие землёй
  rationale: Глагол означает «держать, владеть, удерживать». «Владеющие землёй» естественно передаёт устойчивое господство, не усиливая смысл до «захвативших».
- source_word: ገጸ ቅዱሳን
  choice: лица святых
  rationale: Сохранён конкретный образ лица и семитическая по характеру формула непосредственной встречи или доступа; она не сведена к абстрактному «присутствию».
- source_word: እግዚአ መናፍስት
  choice: Господь духов
  rationale: Сохранён устойчивый божественный титул книги Еноха без добавления определённости, отсутствующей в естественной русской форме титула.
- source_word: አርአየ ብርሃኖ
  choice: явил Свой свет
  rationale: Каузативная форма обозначает явление или обнаружение света. «Явил» сохраняет образ зримого проявления и звучит естественно в возвышенной русской прозе.
- source_word: በገጸ ቅዱሳን ጻድቃን ወኅሩያን
  choice: на лице святых, праведных и избранных
  rationale: Предлог и образ лица переданы конкретно; три определения сохранены раздельно как значимые обозначения оправданного Богом сообщества.
theological_decisions:
- issue: Кто является подлежащим и что именно отрицается в начале стиха
  choice: Владеющие землёй больше не будут могущественными и возвышенными.
  alternative: Могущественные и возвышенные, владеющие землёй, перестанут существовать.
  rationale: Формы ዐዚዛነ и እልዑላነ выступают именной частью сказуемого при «быть», а подлежащим служит относительный оборот «владеющие землёй». Так сохраняется тема утраты статуса, а не вводится утверждение об уничтожении.
- issue: Смысл света на лице святых, праведных и избранных
  choice: Свет Господа зримо явлен на лице оправданного сообщества.
  alternative: Свет является перед ними либо исходит от их лиц.
  rationale: Формулировка «на лице» наиболее прямо сохраняет пространственный образ источника, не определяя сверх сказанного, отражается ли свет от лиц или служит знаком их оправдания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис сделан ясным для обычного читателя; сохранены титул «Господь духов», конкретный образ лица и различие между святыми, праведными и избранными.
