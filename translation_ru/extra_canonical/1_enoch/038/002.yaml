base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/002.yaml
  text: And when righteousness appears on the faces of the righteous[a], the chosen, whose deeds hang upon the Lord of Spirits, and light will appear to the righteous and to the chosen who dwell on the dry ground, where then is the dwelling of sinners[d][c][b], and where the resting place of those who denied the Lord of Spirits? It would have been better for them had they not been born.
translation:
  language: ru
  text: И когда праведность явится на лицах праведных — избранных, чьи дела опираются на Господа Духов[a], — и свет явится праведным и избранным, живущим на суше[b], где тогда будет жилище грешников и где — место покоя тех, кто отрёкся от Господа Духов? Лучше было бы им не родиться.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Необычное выражение можно также понять так: «чьи дела зависят от Господа Духов» или «чьи дела поддерживаются Господом Духов».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на суше»; вероятно, имеется в виду обитаемая земля в противопоставлении космическим водам.'
    reason: cultural_note
lexical_decisions:
- source_word: ያስተርኢ
  choice: явится
  rationale: Форма глагола передаёт явление или становление видимым. Одинаковый перевод в обоих случаях сохраняет повтор исходного текста; «праведность» и «свет» понимаются как подлежащие.
- source_word: ጽድቅ
  choice: праведность
  rationale: Сохраняет ключевое понятие текста и передаёт как нравственную правоту, так и грядущее оправдание праведных, не сужая смысл до общественной справедливости.
- source_word: በገጾሙ
  choice: на лицах
  rationale: Сохраняет конкретный зрительный образ, не заменяя его абстрактным «в их присутствии».
- source_word: ጻድቃን / ኅሩያን
  choice: праведные / избранные
  rationale: Ясные и устойчивые русские обозначения двух групп; «избранные» не вносит дополнительной конфессиональной терминологии.
- source_word: ተግባሮሙ ስቁል በእግዚአ መናፍስት
  choice: чьи дела держатся на Господе Духов
  rationale: Русский оборот сохраняет образ опоры и зависимого положения, не решая однозначно, зависят ли дела от Господа Духов или поддерживаются Им.
- source_word: ብርሃን
  choice: свет
  rationale: Основное значение слова, естественное для апокалиптического образа и не требующее усиления до «сияния».
- source_word: የኃድሩ ዲበ የብስ
  choice: живущим на суше
  rationale: «Суша» передаёт буквальный пространственно-космологический образ точнее, чем обобщённое «на земле».
- source_word: መኃደሪ / ምዕራፎሙ
  choice: жилище / место покоя
  rationale: 'Сохраняется параллелизм двух обозначений места: постоянного обитания и покоя.'
- source_word: ክሕድዎ
  choice: отрёкся от
  rationale: Передаёт сознательное отрицание или непризнание Господа Духов и естественно сочетается с русским управлением.
- source_word: እምኃየሶሙ ሶበ ኢተወልዱ
  choice: Лучше было бы им не родиться
  rationale: Кратко и естественно передаёт формулу сурового контрфактического суда.
theological_decisions:
- issue: Смысл трудного выражения о делах праведных и избранных
  choice: «чьи дела держатся на Господе Духов»
  alternative: «чьи дела зависят от Господа Духов» или «чьи дела поддерживаются Господом Духов»
  rationale: Основной текст сохраняет необычный образ и его богословскую неоднозначность, не выбирая между зависимостью от Господа и поддержкой с Его стороны.
- issue: Значение выражения о суше
  choice: «живущим на суше»
  alternative: «живущим на земле»
  rationale: Буквальный вариант сохраняет космологическую образность видения и не сводит её к общему обозначению мира людей.
- issue: Грамматическая роль света
  choice: «свет явится»
  alternative: «Он явит свет»
  rationale: Форма существительного и значение глагола лучше поддерживают понимание «света» как подлежащего; перевод не вводит невыраженного деятеля.
translation_notes:
  register: Современный литературный русский язык с торжественной апокалиптической интонацией. Синтаксис сохранён как единое нарастающее условно-временное высказывание, однако тире разграничивают приложение и облегчают чтение. Термин «Господь Духов» последовательно сохранён без конфессионального истолкования.
