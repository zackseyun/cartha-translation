base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/005.yaml
  text: And all who dwell upon the dry land shall fall down and bow before him[a], and they shall praise and bless and sing to the Lord of Spirits.
translation:
  language: ru
  text: И все, кто живёт на суше[a], падут и поклонятся перед ним; они будут восхвалять его, благословлять его и петь Господу духов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на земле». Геэзское выражение буквально означает «на суше».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወድቁ
  choice: падут
  rationale: Сохраняет конкретный образ падения ниц или вниз как жеста покорности и почтения, не уточняя сверх текста ритуальную форму действия.
- source_word: ይሰግዱ
  choice: поклонятся
  rationale: Передаёт телесный жест поклона и благоговения; в сочетании «падут и поклонятся» сохраняет параллельные глаголы оригинала.
- source_word: ቅድሜሁ
  choice: перед ним
  rationale: Естественно и прямо передаёт пространственное значение и сохраняет местоименную отсылку без её истолкования.
- source_word: ኵሎሙ
  choice: все
  rationale: Сохраняет подчёркнутую всеобщность действия.
- source_word: እለ የኃድሩ ዲበ የብስ
  choice: кто живёт на суше
  rationale: «Суша» сохраняет конкретное значение геэзского выражения точнее, чем более широкое «земля», оставаясь понятной по-русски.
- source_word: ይሴብሕዎ
  choice: будут восхвалять его
  rationale: Передаёт хвалебный глагол и сохраняет выраженный в оригинале местоименный объект «его».
- source_word: ይባርክዎ
  choice: благословлять его
  rationale: Сохраняет язык благословения и выраженный местоименный объект, не заменяя его общим понятием почитания.
- source_word: ይዜምሩ
  choice: петь
  rationale: Естественно передаёт музыкальное прославление; адресат назван последующим оборотом.
- source_word: ለእግዚአ መናፈስት
  choice: Господу духов
  rationale: Сохраняет устойчивый в 1 Еноха божественный титул и апокалиптический регистр.
theological_decisions:
- issue: К кому относятся местоимения «ним/его» и титул «Господь духов»
  choice: Сохранены местоимения при поклонении, восхвалении и благословении, а Господь духов прямо назван адресатом пения.
  alternative: Считать все местоимения и титул обозначениями одного лица либо понимать весь стих как относящийся исключительно к Богу.
  rationale: В геэзском тексте при первых действиях стоят местоименные формы единственного числа, тогда как заключительный глагол связан с явным титулом «Господь духов». Перевод сохраняет эту напряжённость и не отождествляет и не разделяет референтов сверх сказанного.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Синтаксис сделан ясным для обычного читателя; точка с запятой разграничивает поклонение перед названным местоимением лицом и последующую цепь хвалы, не устраняя неоднозначности референта.
