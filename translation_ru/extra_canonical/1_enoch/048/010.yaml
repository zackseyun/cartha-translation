base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/010.yaml
  text: And on the day of their affliction[b][a], rest shall come upon the earth.
translation:
  language: ru
  text: И в день их бедствия[a] на земле настанет покой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скорби», «угнетения» или «тяготы». Эфиопское слово обозначает тяжёлое положение или давление; в этой краткой фразе точный оттенок не вполне определён.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквальнее: «покой будет на земле» или «покой возникнет на земле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: በዕለተ
  choice: в день
  rationale: Сохраняет временную формулу и апокалиптическую выразительность исходного текста без излишнего осовременивания.
- source_word: ጻሕበ
  choice: бедствия
  rationale: Передаёт тяготу, притеснение или тяжёлое положение, не превращая слово в специальный эсхатологический термин.
- source_word: ዚአሆሙ
  choice: их
  rationale: Притяжательное местоимение естественно передаёт генитивную местоименную форму, отсылающую к ранее упомянутой группе.
- source_word: ዕረፍት
  choice: покой
  rationale: Передаёт основное значение прекращения тягот и отдыха, сохраняя неуточнённым, идёт ли речь об облегчении, мире или всеобщем затишье.
- source_word: ትከውን
  choice: настанет
  rationale: Естественно по-русски передаёт будущее возникновение состояния; более буквальное значение — «будет» или «возникнет».
- source_word: ዲበ ምድር
  choice: на земле
  rationale: Сохраняет вероятный широкий, земной масштаб высказывания и не сужает значение до отдельной страны.
theological_decisions:
- issue: Объём и направленность «покоя»
  choice: Покой настанет на земле, без указания его конкретных получателей
  alternative: Облегчение только для праведных; прекращение бедствий после суда; мир в определённой стране
  rationale: Краткая фраза сама не называет тех, кому предназначен покой, поэтому перевод не разрешает эту богословскую неоднозначность за счёт контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Перестановка обстоятельства «на земле» перед сказуемым делает фразу естественной по-русски, не меняя её смысла.
