base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/003.yaml
  text: And before the sun and the signs were created[a], before the stars of heaven were made[c][b], his name was called before the Lord of Spirits.
translation:
  language: ru
  text: И прежде чем были сотворены солнце и знамения, прежде чем были созданы небесные звёзды, его имя было наречено пред Господом духов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в присутствии Господа духов». Предлог может обозначать не только положение «перед» кем-либо, но и пребывание в чьём-либо присутствии, в том числе при небесном дворе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ዘእንበለ / እንበለ
  choice: прежде чем
  rationale: В обеих конструкциях выражено временное предшествование; повтор сохраняет параллель двух допредельных по отношению к творению придаточных.
- source_word: ትትፈጠር
  choice: были сотворены
  rationale: Пассивная форма и лексика творения соответствуют космологическому контексту; множественное число по-русски согласовано с двумя соединёнными подлежащими — солнцем и знамениями.
- source_word: ፀሐይ ወታእምር
  choice: солнце и знамения
  rationale: Союз связывает оба существительных как подлежащие первого глагола. «Знамения» сохраняет как небесно-космический, так и апокалиптический оттенок, не конкретизируя их функцию.
- source_word: ይትገበሩ
  choice: были созданы
  rationale: Пассив передан прямо; выбор «созданы» сохраняет параллель с первым глаголом, избегая стилистически тяжёлого повтора «сотворены».
- source_word: ከዋክብተ ሰማይ
  choice: небесные звёзды
  rationale: Естественная современная русская передача генитивного сочетания «звёзды неба», сохраняющая возвышенный космологический регистр.
- source_word: ስሙ ተጸውዐ
  choice: его имя было названо
  rationale: Сохранены мужское местоимение и пассивная конструкция исходного текста; формулировка не уточняет, означает ли действие наречение, провозглашение или призывание имени.
- source_word: በቅድመ
  choice: пред
  rationale: Краткая возвышенная форма естественно выражает пребывание перед Господом или в его присутствии и не превращает оборот однозначно в ещё одно временное указание.
- source_word: እግዚአ መናፈስት
  choice: Господом духов
  rationale: Устоявшаяся в данном разделе книги титулатура; прописная буква отмечает титульное употребление, а форма без добавочного артикля естественна для русского языка.
theological_decisions:
- issue: К кому относится местоимение в выражении «его имя»
  choice: Сохранить местоимение без поясняющего титула
  alternative: Прямо назвать Избранного или Сына Человеческого
  rationale: Контекст указывает на ранее упомянутую возвышенную фигуру, но сам стих содержит только местоименный суффикс. Вставка титула устранила бы сохранённую исходным текстом референциальную и богословскую напряжённость.
- issue: Смысл выражения «его имя было названо»
  choice: Сохранить пассивную формулировку без уточнения характера действия
  alternative: Перевести однозначно как «он был наречён» или «его имя было призвано»
  rationale: Исходный глагол допускает оттенки называния, наречения и призывания; нейтральная передача не навязывает культового или онтологического толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Повтор «прежде чем» передаёт синтаксический параллелизм оригинала; «пред» оставлено как понятная торжественная форма. Пунктуация и порядок слов рассчитаны на ясное чтение без устранения неоднозначностей исходного текста.
