base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/004.yaml
  text: He will be a staff for the righteous[a], so that they may lean on him and not fall; and he will be the light of the nations[c][b], and he will be hope for those who are troubled in heart.
translation:
  language: ru
  text: Он будет посохом для праведных, чтобы они опирались на него и не падали; он будет светом народов[a] и надеждой для тех, чьи сердца страдают[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «светом для народов».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «для тех, кто страдает (или болен) в своём сердце»; речь может идти о внутренней скорби, а не только о телесной болезни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በትረ
  choice: посох
  rationale: Существительное обозначает посох или жезл; последующие слова об опоре и падении делают «посох» наиболее ясным и сохраняют конкретный образ без привнесения царской символики.
- source_word: ለጻድቃን
  choice: для праведных
  rationale: Естественная передача обозначения группы людей в апокалиптическом контексте.
- source_word: ይትመረጐዙ
  choice: опирались на него
  rationale: Передаёт буквальный и метафорический образ опоры, прямо связанный со словами «не падали».
- source_word: ወኢይደቁ
  choice: и не падали
  rationale: Продолжает образ посоха и опоры; «не спотыкались» возможно, но слабее выражает противопоставление опоры и падения.
- source_word: ብርሃነ አሕዛብ
  choice: светом народов
  rationale: Прямая передача генитивной конструкции; «народы» сохраняет широкий собирательный смысл и не вносит позднейшего противопоставления иудеев и язычников.
- source_word: ተስፋ
  choice: надеждой
  rationale: Передаёт эсхатологическую и утешительную силу слова естественным современным русским языком.
- source_word: ለእለ የሐምሙ በልቦሙ
  choice: для тех, чьи сердца страдают
  rationale: Сохраняет образ сердца и широкий смысл внутреннего страдания, не сводя выражение к телесной болезни.
theological_decisions:
- issue: К кому относится повторяющееся ውእቱ
  choice: Личное местоимение «он» сохраняется во всех частях стиха.
  alternative: Повторять «тот» или оставлять действующее лицо невыраженным.
  rationale: Ближайший контекст говорит об одной возвышенной фигуре; «он» естественно передаёт референцию, не добавляя позднейших догматических определений.
- issue: Значение выражения ብርሃነ አሕዛብ
  choice: «свет народов»
  alternative: «свет для народов»
  rationale: Основной текст сохраняет компактную исходную конструкцию, а возможное целевое понимание отмечено в сноске.
