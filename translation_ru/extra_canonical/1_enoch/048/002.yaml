base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/002.yaml
  text: And at that hour that Son of Man was named in the presence of the Lord of Spirits[b][a], and his name was before the Head of Days.
translation:
  language: ru
  text: И в тот час тот Сын Человеческий был назван[a] перед Господом духов, и имя его было перед Главой дней[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был наречён». Пассивный глагол может обозначать наречение или именование; вариант «был назван» сохраняет связь с последующим повторением слова «имя».'
    reason: lexical_alternative
  - marker: b
    text: «Глава дней» — буквальная передача особого божественного титула в Притчах Еноха. Необычный образ сохранён вместо замены более привычным толкующим титулом.
    reason: cultural_note
lexical_decisions:
- source_word: በይእቲ ሰዓት
  choice: в тот час
  rationale: Сохраняет торжественный апокалиптический указатель времени и более точное «час», не расширяя его до общего «время».
- source_word: ተጸውዐ
  choice: был наречён
  rationale: Передаёт пассивное обозначение или наименование и естественно соотносится с последующим упоминанием имени; возможность перевода «был назван» отмечена в сноске.
- source_word: ወልደ ሰብእ ዝኩ
  choice: тот Сын Человеческий
  rationale: Указательное местоимение выделяет уже находящуюся в поле видения конкретную фигуру; прописные буквы передают титульное употребление в контексте Притч, не вводя дополнительного догматического толкования.
- source_word: በኀበ እግዚአ መናፈስት
  choice: перед Господом духов
  rationale: Кратко и естественно передаёт пребывание в присутствии небесного Владыки, сохраняя придворно-апокалиптический образ.
- source_word: ስሙ
  choice: имя его
  rationale: Сохраняет тематически значимое повторение понятия имени и поддерживает возвышенный ритм фразы.
- source_word: መቅድመ
  choice: было перед
  rationale: Компактная пространственная формула оставляет открытыми оттенки присутствия, первенства и предсуществования, не усиливая ни один из них.
- source_word: ርእሰ መዋዕል
  choice: Главой дней
  rationale: Буквально сохраняет необычный образ особого божественного титула, не заменяя его более привычным, но интерпретирующим соответствием.
theological_decisions:
- issue: Передавать ли ወልደ ሰብእ как общее обозначение человека или как титул конкретной фигуры
  choice: тот Сын Человеческий
  alternative: тот сын человеческий; тот человек
  rationale: В контексте Притч выражение указывает на определённую возвышенную эсхатологическую фигуру. Титульная форма отражает местный контекст, не требуя гармонизации с позднейшим христианским словоупотреблением.
- issue: Следует ли прямо выражать предсуществование в словах об имени перед Главой дней
  choice: имя его было перед Главой дней
  alternative: имя его было названо перед Главой дней; имя его изначально пребывало перед Главой дней
  rationale: Краткая геэзская формула допускает представление о небесном присутствии, первенстве или предсуществовании, но не уточняет их соотношения. Перевод сохраняет эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, апокалиптическим звучанием. Синтаксис остаётся ясным для широкого читателя; повтор слова «имя» и необычный титул сохранены. Маркеры сносок поставлены непосредственно после выражений, к которым они относятся.
