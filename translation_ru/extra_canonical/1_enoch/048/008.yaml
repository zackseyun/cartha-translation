base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/008.yaml
  text: In those days the faces of the kings of the earth and the mighty who possess the dry land shall be humbled[a], because of the works of their hands; for on the day of their distress and affliction[d][c][b], they will not save themselves.
translation:
  language: ru
  text: В те дни поникнут лица царей земли и могущественных, владеющих сушей[a], — из-за дел их рук[b]; ибо в день своего бедствия и скорби они не спасут себя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сушей» — буквально; выражение может обозначать также обитаемую землю, находящуюся под их властью.
    reason: lexical_alternative
  - marker: b
    text: Выражение «дела их рук» может включать намёк на идолов или на созданное ими могущество, но само по себе обозначает их деяния в широком смысле.
    reason: cultural_note
lexical_decisions:
- source_word: በዝንቱ መዋዕል
  choice: В те дни
  rationale: Устойчивая апокалиптическая временная формула; естественно звучит по-русски и сохраняет эсхатологическую перспективу.
- source_word: ክኑ ትሑታነ ገጽ
  choice: поникнут лица
  rationale: Передаёт вероятное чтение повреждённой формы как «станут» и образ опущенного, униженного лица; по-русски это естественнее буквального «станут низкими лицом».
- source_word: ነገሥተ ምድር
  choice: цари земли
  rationale: Сохраняет обычное апокалиптическое обозначение земных правителей и широкий смысл ምድር.
- source_word: ጽኑዓን
  choice: могущественные
  rationale: В данном сочетании речь идёт не просто о физически сильных, а о влиятельных носителях власти.
- source_word: እለ ይእኅዝዋ ለየብስ
  choice: владеющие сушей
  rationale: Глагол означает удерживать или владеть, а የብስ буквально обозначает сушу; конкретный образ сохранён без замены отвлечённым «господством».
- source_word: በእንተ ምግባረ እደዊሆሙ
  choice: из-за дел их рук
  rationale: Сохранён библейский образ человеческих деяний, допускающий нравственный и идолопоклоннический оттенок, но не ограниченный им.
- source_word: በዕለተ ጻዕቆሙ ወጻሕቦሙ
  choice: в день своего бедствия и скорби
  rationale: Два существительных переданы двумя близкими понятиями, чтобы сохранить усиление, характерное для сцены суда.
- source_word: ኢይድኅኑ ርእሶሙ
  choice: они не спасут себя
  rationale: Прямо передаёт отрицание и выраженный возвратный объект, не добавляя причины их неспособности спастись.
theological_decisions:
- issue: К кому относится образ поникшего лица
  choice: Он относится к царям земли и могущественным как к одной осуждаемой группе.
  alternative: Воспринимать «смиренных/униженных лицом» как отдельную группу либо как самостоятельное подлежащее.
  rationale: Вероятное восстановление повреждённого ክኑ как формы «станут» делает последующие слова именной частью сказуемого, а царей и могущественных — подлежащим. Так сохраняется смысл их унижения в день суда без превращения их в добродетельных «смиренных».
- issue: Возможный идолопоклоннический смысл «дел их рук»
  choice: Оставить широкое выражение «дела их рук».
  alternative: Конкретизировать как «их идолы».
  rationale: Библейская формула может намекать на идолов или самосозданную власть, однако геэзский текст не требует такого сужения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Сохранены конкретные образы лица, суши и дел рук; архаические формы и конфессионально окрашенная терминология не использованы.
