base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/007.yaml
  text: And the wisdom of the Lord of Spirits has revealed him to the holy and to the righteous[a]; for they have kept the portion of the righteous, because they hated and despised this world of unrighteousness, and they hated all its works and its ways in the name of the Lord of Spirits. For by his name they are saved[d][c][b], and by his good pleasure their life came to be.
translation:
  language: ru
  text: И мудрость Господа духов открыла его святым и праведным[a], ибо они сохранили долю праведных[b], потому что возненавидели и презрели этот мир неправедности и возненавидели все его дела и пути во имя Господа духов. Ибо Его именем они спасаются[c], и по Его благоволению возникла их жизнь[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святым» в смысле «святым людям». Геэзское слово обозначает группу посвящённых Богу людей.'
    reason: lexical_alternative
  - marker: b
    text: «Доля праведных» может означать их назначенную долю, удел, жребий или наследие.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Его именем они будут спасены»; также возможно: «Его именем они находят избавление».'
    reason: grammatical_ambiguity
  - marker: d
    text: 'Или: «по Его воле утвердилась их жизнь».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ከሠተ
  choice: открыла его
  rationale: Активный глагол означает «открыть, явить»; субъектом выступает «мудрость Господа духов». Местоименный объект сохранён согласно контексту и засвидетельствованному разбору.
- source_word: ቅዱሳን
  choice: святым
  rationale: Обозначает совокупность посвящённых Богу людей; «святым» естественно по-русски и не требует позднейшего церковного оттенка слова «святые» как особого титула.
- source_word: ጻድቃን
  choice: праведным / праведных
  rationale: Сохраняет ключевую нравственно-эсхатологическую категорию енохической литературы.
- source_word: ክፍሎሙ
  choice: долю праведных
  rationale: Слово может означать долю, удел или жребий. «Доля» сохраняет образ назначенной части, не сводя его однозначно к наследию или жребию.
- source_word: ዐቀቡ
  choice: сохранили
  rationale: Передаёт совершённую и сохраняющую силу верность; в сочетании с «долей» звучит естественнее, чем буквальное «соблюли».
- source_word: ዘዓመፃ
  choice: неправедности
  rationale: Сохраняет смысловую связь с «праведными» и характеризует мир как нравственно порочный.
- source_word: ምግባሮ ወፍናዊሁ
  choice: его дела и пути
  rationale: Передаёт параллельные понятия поступков и образа жизни, сохраняя традиционный образ нравственных путей.
- source_word: በስሙ
  choice: во имя / Его именем
  rationale: В первом случае формула допускает оттенки основания, верности и мотива; во втором инструментальное «Его именем» естественно выражает основание избавления.
- source_word: ይድኅኑ
  choice: они спасаются
  rationale: Настоящее время сохраняет возможный общий или вневременной смысл формы, не исключая эсхатологического исполнения.
- source_word: በፈቃዱ
  choice: по Его благоволению
  rationale: Передаёт не только волю, но и положительное божественное изволение, не вводя дополнительного догматического содержания.
- source_word: ኮነ ሕይወቶሙ
  choice: возникла их жизнь
  rationale: Достаточно буквально передаёт становление или появление их жизни; альтернативное понимание как утверждения жизни отмечено в сноске.
theological_decisions:
- issue: Временной и смысловой характер спасения Его именем
  choice: Его именем они спасаются
  alternative: Его именем они будут спасены / находят избавление
  rationale: Настоящее время сохраняет гномический смысл и нынешнюю укоренённость спасения, не отрицая будущего эсхатологического измерения.
- issue: Смысл «доли праведных»
  choice: сохранили долю праведных
  alternative: сохранили свой удел среди праведных / сохранили то, что принадлежит праведным
  rationale: Фраза допускает значения доли, удела, жребия или принадлежности к праведным; основной текст не сужает её до одного толкования.
- issue: Последняя фраза о происхождении жизни
  choice: по Его благоволению возникла их жизнь
  alternative: по Его воле утвердилась их жизнь
  rationale: Сохранена напряжённость между возникновением жизни и её установлением или утверждением по божественной воле.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Повтор «возненавидели» и формула «Господь духов» сохранены ради риторической структуры и терминологической последовательности. Прописное «Его» употреблено как русская издательская конвенция для ясности референции, без внесения конфессионального толкования.
