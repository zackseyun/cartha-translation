base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/001.yaml
  text: In that place I saw the spring of righteousness[a], which is inexhaustible, and around it were many springs of wisdom. And all the thirsty drank from them and were filled with wisdom[f][e][d][c][b], and their dwelling was with the righteous and the holy and the chosen.
translation:
  language: ru
  text: В том месте я увидел неисчерпаемый источник праведности[b], и многие источники мудрости окружали его[a]. И все жаждущие пили из них и наполнялись мудростью; жили они вместе с праведными, святыми[c] и избранными.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Геэзское выражение в этом месте текстуально затруднено и содержит близкие повторяющиеся формы. Вероятный смысл: источники мудрости окружали источник праведности; возможно также: «вокруг него было много источников мудрости».'
    reason: textual_variant
  - marker: b
    text: 'Или: «родник праведности»; далее соответственно: «родники мудрости».'
    reason: lexical_alternative
  - marker: c
    text: '«Святые» — субстантивированное обозначение; возможно также: «святые люди».'
    reason: lexical_alternative
lexical_decisions:
- source_word: መካን
  choice: место
  rationale: Обычное геэзское обозначение места; русский эквивалент естественно сохраняет обстановку видения, не уточняя географию.
- source_word: ነቅዐ / አንቅዕተ
  choice: источник / источники
  rationale: Сохраняет единый образ водных источников, из которых пьют жаждущие; «родник» был бы конкретнее и стилистически уже.
- source_word: ጽድቅ
  choice: праведность
  rationale: Передаёт нравственно-эсхатологический смысл и соответствует ключевой лексике енохической традиции; «справедливость» здесь менее органична в образе источника.
- source_word: ዘኢይትኄለቍ
  choice: неисчерпаемый
  rationale: В применении к источнику естественно выражает неизмеримость и невозможность истощения, отражённые геэзской формой.
- source_word: አውዳ፡ የአውዳ
  choice: окружали его
  rationale: Активная конструкция сохраняет выраженную в источнике идею окружения, а не сводит её лишь к статическому местоположению.
- source_word: ጥበብ
  choice: мудрость
  rationale: Стандартный и контекстуально точный эквивалент, сохраняющий соединение водного и премудростного образов.
- source_word: ጽሙኣን
  choice: жаждущие
  rationale: Сохраняет конкретный образ жажды, не истолковывая его отвлечённо в основном тексте.
- source_word: ይሰትዩ፡ ወይትመልኡ
  choice: пили и наполнялись
  rationale: Передаёт последовательность действий в видении и сохраняет образ мудрости, наполняющей пьющих.
- source_word: ማኅደሪሆሙ
  choice: обитали они
  rationale: Естественная русская глагольная передача буквального «их обитание/жилище было», сохраняющая смысл совместного пребывания без тяжеловесности.
- source_word: ጻድቃን፡ ወቅዱሳን፡ ወኅሩያን
  choice: праведные, святые и избранные
  rationale: Сохраняет трёхчастный ряд групп или наименований и не заменяет его позднейшей конфессионально окрашенной терминологией.
theological_decisions:
- issue: Следует ли истолковать водный образ как отвлечённое духовное получение праведности и мудрости
  choice: 'Сохранить буквальную образность видения: источники, жаждущие, питьё и наполнение'
  alternative: Передать образ прямо как обретение праведности и мудрости
  rationale: Апокалиптическое видение намеренно выражено через многозначный водный образ; его истолкование не следует вносить в основной текст.
- issue: Передача заключительного трёхчастного ряда
  choice: «праведные, святые и избранные»
  alternative: «праведники, святые и избранники» либо «справедливые, святые и избранные»
  rationale: Выбранная формулировка сохраняет параллельные субстантивированные определения, не решая, являются ли это тремя раздельными группами или тремя взаимосвязанными обозначениями.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис сделан ясным и плавным; архаизмы вроде «обитель их» и конфессионально более нагруженные варианты вроде «избранники» не использованы. Точка с запятой удерживает тесную связь между насыщением мудростью и совместным пребыванием с эсхатологическими группами.
