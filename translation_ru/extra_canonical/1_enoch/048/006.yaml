  yaml_path: translation/extra_canonical/1_enoch/048/006.yaml
  text: For this reason[a], he was chosen and hidden before him before the world was created[c][b], and forever.
translation:
  language: ru
  text: Поэтому он был избран и сокрыт пред Ним[a] ещё до сотворения мира[b] — и навеки[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед ним»; вероятнее всего, имеется в виду присутствие Бога.'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «мир», в других контекстах может также означать «век». Здесь упоминание сотворения указывает прежде всего на мир.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «к веку» или «к вечности»; выражение передаёт продолжение в вечность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በእንተዝ
  choice: Поэтому
  rationale: Передаёт причинно-следственную силу выражения кратко и естественно; возможен также более буквальный вариант «по этой причине».
- source_word: ኮነ
  choice: был
  rationale: В сочетании с последующими определениями выполняет связочную или результативную функцию. Русское «был избран и сокрыт» звучит естественно и не усиливает оттенок изменения состояния, хотя буквально глагол может означать «стал».
- source_word: ኅሩየ
  choice: избран
  rationale: Передаёт обозначение лица, выделенного божественным решением, без внесения позднейшей догматической терминологии.
- source_word: ወኅቡአ
  choice: и сокрыт
  rationale: Сохраняет параллель с «избран» и апокалиптический мотив фигуры, скрытой до назначенного времени.
- source_word: በቅድሜሁ
  choice: пред Ним
  rationale: Сохраняет пространственно-реляционную образность оригинала. Местоимение естественнее всего относится к Богу, однако перевод не заменяет эту формулировку истолкованием.
- source_word: ዘእንበለ ይትፈጠር ዓለም
  choice: ещё до сотворения мира
  rationale: Ясно выражает предшествование творению; «ещё» естественно подчёркивает временную удалённость, не добавляя нового содержания.
- source_word: ወእስከ ለዓለም
  choice: и навеки
  rationale: Идиоматично передаёт продолжительность без конца, сохраняя широкий временной размах стиха.
theological_decisions:
- issue: Следует ли выражать предсуществование в терминах позднейшей христологии
  choice: 'Сохранить местную апокалиптическую формулировку: «избран и сокрыт пред Ним ещё до сотворения мира»'
  alternative: 'Перевести истолковательно: «предсуществовал у Бога» или «был предопределён от вечности»'
  rationale: Текст прямо утверждает избрание и сокрытость этой фигуры прежде сотворения мира, но не использует позднейшие догматические формулы; перевод сохраняет сильное временное утверждение и не разрешает богословское напряжение за автора.
- issue: К кому относится местоимение в выражении በቅድሜሁ
  choice: Передать «пред Ним», с прописной буквы как наиболее вероятную отсылку к Богу
  alternative: Передать нейтральнее «перед ним» либо истолковательно «в присутствии Бога»
  rationale: Контекст естественно указывает на Бога, однако само реляционное выражение сохранено, а примечание отмечает его буквальную форму и вероятный референт.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Пред Ним» сохраняет достоинство и реляционную образность оригинала; конструкция с «ещё до» устраняет тяжеловесный повтор временных и пространственных значений. Тире перед заключительной фразой подчёркивает движение от времени до творения к вечности.
