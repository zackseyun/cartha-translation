base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/009.yaml
  text: And into the hands of my chosen ones I will deliver them[a], and like straw in the fire, so they will burn before the face of the holy ones; and like lead in water, they will sink before the face of the righteous[e][d][c][b], and no trace will be found for them.
translation:
  language: ru
  text: И в руки моих избранных Я предам их[a]; как солома в огне, так они будут гореть пред лицом святых, и, как свинец в воде, они погрузятся пред лицом праведных — и следа их не найдётся[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в руки моих избранных»; выражение может подразумевать передачу под их власть для суда.'
    reason: lexical_alternative
  - marker: b
    text: То есть от них не останется никакого следа или остатка.
    reason: lexical_alternative
lexical_decisions:
- source_word: ውስተ፡ እዴሆሙ፡ ለኅሩያን፡ ዚአየ
  choice: в руки моих избранных
  rationale: Сохраняется конкретный образ рук и притяжательное значение ዚአየ («моих»). В данном контексте выражение подразумевает передачу под власть избранных, но это не подменяет исходный образ отвлечённым толкованием.
- source_word: እወድዮሙ
  choice: Я предам их
  rationale: 'Форма понимается как глагол первого лица единственного числа в имперфекте с местоименным дополнением: «Я передам/предам их», а не как формула видения.'
- source_word: ኅሩያን
  choice: избранных
  rationale: Естественное русское обозначение апокалиптической группы; оно не привносит более узкой конфессиональной терминологии.
- source_word: ከመ፡ ሣዕር፡ ውስተ፡ እሳት፡ ከመዝ፡ ይውዕዩ
  choice: как солома в огне, так они будут гореть
  rationale: Парная конструкция «как… так…» передаёт соответствие ከመ … ከመዝ, а будущее время отражает имперфект и эсхатологический контекст. «Солома» ясно передаёт образ быстро сгорающей сухой растительности.
- source_word: እምቅድመ፡ ገጸ፡ ቅዱሳን
  choice: пред лицом святых
  rationale: Сохранён торжественный и судебный образ буквального выражения «перед лицом», не сводимый просто к нейтральному «в присутствии».
- source_word: ዐረር፡ ውስተ፡ ማይ፡ ይሠጠሙ
  choice: как свинец в воде, они погрузятся
  rationale: «Свинец» сохраняет конкретный образ тяжёлого металла; «погрузятся» естественно передаёт уход под воду и допускает значение «утонут» без его усиления.
- source_word: ጻድቃን
  choice: праведных
  rationale: Стандартное и понятное русское соответствие для обозначения оправданной общины.
- source_word: ወኢይትረከብ፡ ሎሙ፡ አሰር
  choice: и следа их не найдётся
  rationale: 'Естественная русская формулировка передаёт полное исчезновение: от них не останется обнаружимого следа.'
theological_decisions:
- issue: Смысл передачи осуждённых «в руки» избранных
  choice: Сохранён буквальный образ «в руки моих избранных», подразумевающий передачу под их власть.
  alternative: «Я отдам их во власть моих избранных».
  rationale: Исходный текст использует конкретный образ рук. Перевод не уточняет сверх текста, каким именно образом избранные участвуют в суде.
- issue: Соотношение «святых» и «праведных»
  choice: Оба наименования сохранены раздельно.
  alternative: Считать их либо двумя обозначениями одной человеческой общины, либо соответственно ангелами и людьми.
  rationale: Параллелизм сближает эти группы, но сам стих не устанавливает их точную тождественность или различие.
- issue: Временная перспектива суда
  choice: Глаголы переданы будущим временем.
  alternative: Передать их прошедшим временем как уже увиденное в видении.
  rationale: Имперфектные формы и эсхатологический контекст указывают на предстоящее действие; текст не следует превращать в рассказ о завершившемся событии.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Архаизирующее «пред лицом» сохранено как узнаваемый и ясный судебный образ; остальные конструкции сделаны естественными для современного читателя. Местоимение «Я» написано с прописной буквы только как начало самостоятельной части после инверсии, без конфессиональной капитализации местоимений.
