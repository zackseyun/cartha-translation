lexical_decisions:
- source_word: እሌ
  choice: горе
  rationale: В формуле обличения, повторяющейся в ближайшем контексте, это междометие со значением «горе», а не указательное местоимение.
- source_word: ለክሙ
  choice: вам
  rationale: Предлог с местоименным суффиксом 2-го лица множественного числа естественно передаётся русским дательным «вам».
- source_word: እለ
  choice: которые
  rationale: Форма вводит относительное определение во множественном числе. Поскольку продолжение в предоставленном фрагменте отсутствует, незавершённость обозначена многоточием.
theological_decisions:
- issue: Передача обрывочного эфиопского свидетельства
  choice: Перевести все сохранившиеся слова и явно оставить относительное предложение незавершённым
  alternative: Ограничиться словами «Горе вам…» или восстановить продолжение по другим изданиям
  rationale: Предоставленный текст позволяет передать начальную формулу и относительное «которые», но не позволяет восстановить содержание последующего обличения. Такая передача не скрывает ни наличия последнего слова, ни утраты продолжения.
translation_notes:
  register: Современный литературный русский язык; краткая пророческая формула сохранена без стилистического сглаживания. Многоточие указывает на обрыв источника, а не на риторическую паузу.
