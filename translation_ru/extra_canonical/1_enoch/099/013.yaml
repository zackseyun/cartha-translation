  source_fidelity: '«Горе вам, которые…» точно передаёт все три слова предоставленного геэзского фрагмента в их контекстуально вероятной функции: እሌ — междометие «горе», ለክሙ — «вам», እለ — относительное «которые». Незавершённость относительной конструкции честно сохраняет обрыв свидетельства, не дополняя его по реконструкции.'
