base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/001.yaml
  text: 'Woe to you who do wickedness[a], and who praise and honor the word of falsehood: you will perish[b], and no good life will be yours.'
translation:
  language: ru
  text: 'Горе вам, творящим нечестие и восхваляющим и почитающим слово лжи[a]: вы погибнете, и не будет у вас благой жизни[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ложную речь»; слово ነገር может означать также «дело» или «предмет речи».'
    reason: lexical_alternative
  - marker: b
    text: «Благая жизнь» может обозначать благополучную жизнь и её итог; выражение не уточняет, идёт ли речь только о нынешнем веке или также о грядущем.
    reason: theological_ambiguity
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Горе вам
  rationale: Передаёт пророческую формулу обличения и суда естественным и традиционно понятным русским выражением.
- source_word: እለ፡ ትገብሩ፡ ርሰናናተ
  choice: творящим нечестие
  rationale: Сохраняет значение деятельного совершения зла и возвышенный, но понятный регистр.
- source_word: ወበነገረ፡ ሐሰት
  choice: слово лжи
  rationale: Единственное число ነገረ передано как «слово»; конструкция также допускает более широкое понимание как «ложная речь» или «ложное дело».
- source_word: ትሴብሑ፡ ወታከብሩ
  choice: восхваляющим и почитающим
  rationale: Передаёт парное выражение публичного одобрения и возвеличивания, сохраняя риторический параллелизм.
- source_word: ተሐጕልክሙ
  choice: вы погибнете
  rationale: Естественно и прямо передаёт угрозу гибели, не уточняя её механизм.
- source_word: ወአልብክሙ፡ ሕይወተ፡ ሠናይተ
  choice: и не будет у вас благой жизни
  rationale: Сохраняет отрицание обладания «благой жизнью» и не сводит выражение ни к земному благополучию, ни исключительно к посмертной участи.
theological_decisions:
- issue: Смысл лишения «благой жизни»
  choice: Сохранено буквальное и богословски открытое выражение «не будет у вас благой жизни».
  alternative: «Вы лишитесь вечной жизни» или «у вас не будет земного благополучия».
  rationale: Контекст допускает нравственно-эсхатологический смысл, но источник не требует однозначно ограничивать его только загробной жизнью или только земным процветанием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Причастные обороты сохраняют ритм формулы «Горе вам», а лексика остаётся доступной широкому читателю.
