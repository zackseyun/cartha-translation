base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/010.yaml
  text: And in those days[a], blessed are all those who accept the word of wisdom, and understand it, and do it, and follow the way of the Most High, and walk in the way of his righteousness, and do not act wickedly with those who act wickedly[d][c][b]; for they shall be saved.
translation:
  language: ru
  text: И в те дни блаженны все, кто принимает слово мудрости[a], понимает его и исполняет, следует путём Всевышнего, ходит путём Его праведности и не поступает нечестиво вместе с теми, кто поступает нечестиво[b], — ибо они будут спасены.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «весть мудрости». Слово ነገር может означать «слово», «дело» или «весть».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально повторён один и тот же глагол: «не поступают нечестиво с поступающими нечестиво». Возможны также менее вероятные оттенки: «не становятся порочными» или «не гибнут вместе с погибающими».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ብፁዓን
  choice: блаженны
  rationale: Сохраняет возвышенный библейский регистр и смысл дарованного благополучия, а не просто эмоционального счастья.
- source_word: ይትሜጠዉ
  choice: принимает
  rationale: Передаёт принятие и усвоение слова мудрости; по-русски естественно сочетается с «словом».
- source_word: ነገረ ጥበብ
  choice: слово мудрости
  rationale: Сохраняет единственное число и многозначность ነገር; вариант «весть мудрости» указан в сноске.
- source_word: ያእምርዎን
  choice: понимает его
  rationale: В последовательности «принимает — понимает — исполняет» речь идёт о содержательном и практическом понимании.
- source_word: ይገብርዎን
  choice: исполняет
  rationale: Передаёт осуществление принятого слова мудрости и звучит естественнее буквального «делает его».
- source_word: ለፍኖተ ልዑል
  choice: следует путём Всевышнего
  rationale: Учитывает функцию ለ как показателя прямого объекта при глаголе действия; «следует путём» естественно выражает соблюдение этого пути и не смешивает конструкцию со следующим በፍኖተ.
- source_word: የሐውሩ በፍኖተ ጽድቅ ዚአሁ
  choice: ходит путём Его праведности
  rationale: Сохраняет традиционный нравственный образ хождения и абстрактное существительное «праведность».
- source_word: ኢይረሰዑ ... እለ ይረሰዑ
  choice: не поступает нечестиво вместе с теми, кто поступает нечестиво
  rationale: Передаёт активный нравственный смысл корня ረሰዐ и сохраняет намеренный повтор исходного текста.
- source_word: ይድኅኑ
  choice: будут спасены
  rationale: Сохраняет эсхатологический вес обещания, не уточняя способ или доктринальный механизм спасения.
theological_decisions:
- issue: Смысл повторённого глагола ይረሰዑ в противопоставлении праведности и спасению
  choice: поступать нечестиво
  alternative: стать порочными; погибнуть; сбиться с пути
  rationale: Корень непосредственно обозначает нечестивое поведение и связан с наименованием нечестивых в 1 Енохе. Перевод сохраняет нравственно-судебный контраст, а возможный оттенок гибели не превращается в основное значение.
- issue: Характер итогового избавления ይድኅኑ
  choice: будут спасены
  alternative: будут избавлены; уцелеют
  rationale: Формулировка сохраняет открытый эсхатологический смысл текста и не привносит позднейшей конфессиональной схемы.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксический параллелизм исходного ряда сохранён, но формы согласованы с русским собирательным «кто». Местоимение «Его» написано с прописной буквы как ясная отсылка к Всевышнему.
