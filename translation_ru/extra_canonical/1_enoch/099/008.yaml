base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/008.yaml
  text: And they will become senseless because of the madness of their heart[c][b][a], and their eyes will grow dark through the fear of their heart and through the visions of their dreams.
translation:
  language: ru
  text: И они утратят рассудок из-за безумия своего сердца, и глаза их померкнут[a] от страха, охватившего их сердца, и от видений во сне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глаза их потемнеют». Образ может означать помрачение зрения, оцепенение от ужаса либо переносную утрату ясности восприятия.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от видения их снов». Сочетание сохраняет в оригинале одновременно язык видения и язык сна; оно не уточняет происхождения этих видений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትረሰዑ
  choice: лишатся рассудка
  rationale: Форма от ረሰዐ связана с утратой памяти или рассудка, а не с испугом. Выражение «лишатся рассудка» естественно по-русски и согласуется с последующим упоминанием безумия сердца.
- source_word: እበደ
  choice: безумие
  rationale: Слово обозначает тяжёлое помрачение ума, неразумие или безумство; «безумие» сохраняет силу образа и связь с утратой рассудка.
- source_word: ልቦሙ
  choice: их сердце / своего сердца
  rationale: «Сердце» сохранено как семитское обозначение внутреннего средоточия мысли, воли и чувства; оно не сведено только к современному понятию разума или эмоций.
- source_word: ይጼለሉ
  choice: померкнут
  rationale: Глагол передаёт потемнение или утрату ясности. «Померкнут» сохраняет образ и допускает как телесное, так и переносное понимание.
- source_word: አዕይንቲሆሙ
  choice: глаза их
  rationale: Конкретный образ глаз сохранён, а не заменён отвлечённым словом «зрение».
- source_word: በፍርሃተ ልቦሙ
  choice: от страха их сердца
  rationale: Предлог передаёт причину или воздействие; «от» естественно выражает эту связь и сохраняет повтор слова «сердце».
- source_word: በርእየ ሕልሞሙ
  choice: от видений их снов
  rationale: Перевод удерживает одновременно лексику видения и сна, не упрощая сочетание до одного слова «сны».
theological_decisions:
- issue: Природа описанного бедствия
  choice: Внутреннее безумие, страх и помрачение глаз представлены как связанные последствия, но происхождение сновидческих видений не уточняется.
  alternative: Считать видения либо непосредственно посланным Богом наказанием, либо исключительно проявлением виновной совести.
  rationale: Текст называет сами явления, не определяя, посланы ли сны свыше, порождены ли внутренним состоянием людей или сочетают оба аспекта.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Инверсия «глаза их» поддерживает параллелизм, не создавая чрезмерной архаичности; повтор слова «сердце» намеренно сохранён.
