base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/012.yaml
  text: Woe to you who make the measure of sin and deceit[a], and who cause bitterness upon the earth[c][b], for by it they will be destroyed.
translation:
  language: ru
  text: Горе вам, делающим меру греховной и обманной[a], и вам, порождающим горечь на земле[b], ибо из-за этого они погибнут[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «делающим меру грехом и ложью» или «делающим меру греха и лжи». Вероятно, речь идёт о нечестной, обманной мере.'
    reason: lexical_alternative
  - marker: b
    text: Эфиопское чтение в имеющейся транскрипции, по-видимому, искажено. Исправленное чтение означает «причиняющим» или «порождающим горечь».
    reason: textual_variant
  - marker: c
    text: 'В оригинале здесь стоит третье лицо: «они погибнут», хотя перед этим звучит прямое обращение «вам». По смыслу возможно: «из-за этого вы погибнете».'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: እሌ፡ ለክሙ
  choice: Горе вам
  rationale: Устойчивая пророческая формула осуждения; сохраняет силу и возвышенный тон оригинала.
- source_word: ትገብርዋ፡ ለመስፈርት፡ ኃጢአት፡ ወሐሱት
  choice: делающим меру греховной и лживой
  rationale: Передаёт конкретный образ меры и нравственную порочность её намеренного искажения. Такая формулировка естественнее по-русски, чем буквальное «делающим меру грехом и ложью», и допускает торговый контекст нечестных мер.
- source_word: ታምርሩ (исправление ошибочного чтения ተያእምሩ)
  choice: порождающим горечь
  rationale: Исправленное чтение связано с горечью; «порождающим» естественно выражает причинительное значение, не уточняя, является ли горечь страданием, озлоблением или бедствием.
- source_word: ዲበ፡ ምድር
  choice: на земле
  rationale: Прямая и естественная передача пространственного выражения с возможным всемирным охватом.
- source_word: እስመ፡ ቦቱ፡ ይትዌደኡ
  choice: ибо из-за этого они погибнут
  rationale: «Из-за этого» сохраняет причинное значение ቦቱ, а третье лицо множественного числа «они» отражает форму глагола и не сглаживает смену лица после прямого обращения.
theological_decisions:
- issue: Следует ли отвлечённо понимать трудное выражение о мере как «меру греха» или как указание на нечестные меры
  choice: делающим меру греховной и лживой
  alternative: делающим меру греха и лжи
  rationale: Выбранный текст сохраняет предметный образ меры и вероятный смысл её мошеннического искажения, но примечание оставляет открытой более буквальную синтаксическую трактовку.
- issue: Что именно означает горечь на земле
  choice: порождающим горечь
  alternative: причиняющим страдание; сеющим озлобление
  rationale: Оригинал не требует сводить образ к одному виду зла или страдания; общий образ горечи сохраняет смысловую напряжённость.
- issue: К кому относится заключительное «они погибнут»
  choice: сохранить третье лицо множественного числа
  alternative: из-за этого вы погибнете
  rationale: Хотя переход к «вы» сделал бы русскую фразу более гладкой, форма оригинального глагола стоит в третьем лице; перевод не устраняет эту грамматическую неровность.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис сделан ясным для обычного читателя, но конкретный образ меры, неоднозначность «горечи» и смена грамматического лица сохранены и пояснены в примечаниях.
