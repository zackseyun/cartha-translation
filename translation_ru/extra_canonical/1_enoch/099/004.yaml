translation:
  language: ru
  text: В те дни народы придут в смятение, и племена народов[a] поднимутся в день погибели[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «роды народов», «родственные группы народов». Эфиопское слово может обозначать родственные группы или связанных родством людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в день избиения» или «в день разорения» — в зависимости от оттенка последнего слова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: В те дни
  rationale: Сохраняет обычную апокалиптическую временную формулу и множественное значение «дни/времена».
- source_word: ይትሀወኩ
  choice: придут в смятение
  rationale: Естественно по-русски передаёт состояние потрясения и беспорядка, не уточняя его причины.
- source_word: አሕዛብ
  choice: народы
  rationale: Передаёт собирательный смысл в контексте всеобщего потрясения и не привносит более позднего противопоставления «иудеев» и «язычников».
- source_word: ወይትነሥኡ
  choice: и ... восстанут
  rationale: Сохраняет буквальный образ поднятия и возможный оттенок мятежного выступления, не сводя его однозначно к войне или собранию.
- source_word: አዝማደ፡ አሕዛብ
  choice: роды народов
  rationale: «Роды» передаёт родственные группы или объединения внутри народов и соответствует возвышенному библейскому регистру.
- source_word: በዕለት፡ እንተ፡ ሐጕል
  choice: в день погибели
  rationale: «Погибель» сохраняет широкий смысл катастрофы и уничтожения, не ограничивая его только физическим убиением.
theological_decisions:
- issue: Объём значения አሕዛብ в пророчестве о суде
  choice: народы
  alternative: язычники; племена
  rationale: Контекст говорит о коллективном потрясении народов, а не устанавливает богословское противопоставление иудеев и неиудеев.
- issue: Характер действия родов народов
  choice: восстанут
  alternative: поднимутся; выступят; будут подняты на битву
  rationale: Формулировка сохраняет двусмысленность между простым поднятием и враждебным выступлением, не добавляя прямо не названной военной цели.
- issue: Характер дня ሐጕል
  choice: день погибели
  alternative: день избиения; день разорения
  rationale: Выбран широкий катастрофический смысл; возможный более узкий оттенок массового убиения отмечен в сноске.
