base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/003.yaml
  text: In those days[a], you righteous, prepare yourselves to raise your prayers as a memorial, and place them as a testimony before the angels[c][b], that they may place the sin of sinners before the Most High as a memorial.
translation:
  language: ru
  text: В те дни приготовьтесь, праведные, вознести свои молитвы как напоминание и представить их как свидетельство перед ангелами[a], чтобы они представили грех грешников перед Всевышним как напоминание[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Глагольные формы в этом месте повреждены в сохранившейся транскрипции. Вместо «представить» возможно также: «положить» или «принести».'
    reason: textual_variant
  - marker: b
    text: «Как напоминание» — то есть как то, что должно быть приведено на память и рассмотрено; в данном контексте выражение имеет оттенок небесного судебного разбирательства.
    reason: lexical_clarification
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: В те дни
  rationale: Сохранена обычная апокалиптическая временная формула и буквальный образ «дней».
- source_word: ተደለዉ ጻድቃን
  choice: приготовьтесь, праведные
  rationale: Форма понята как повелительное наклонение второго лица множественного числа, а «праведные» — как обращение.
- source_word: ከመ ትንሥኡ ጸሎታቲከሙ
  choice: вознести ваши молитвы
  rationale: Передано активное действие адресатов и сохранён вертикальный образ возносимой молитвы.
- source_word: በተዝካር
  choice: как напоминание
  rationale: Передаёт не только воспоминание, но и внесение дела на рассмотрение в контексте небесного суда.
- source_word: ሰማዕተ
  choice: свидетельство
  rationale: В данной синтаксической позиции слово обозначает свидетельство, а не ангелов; сами ангелы прямо названы далее словом መላእክት.
- source_word: በቅድመ መላእክት
  choice: перед ангелами
  rationale: Прямо передано упоминание ангелов и обстановка небесного суда.
- source_word: አንብ...ሙ / ያንብ...ሙ
  choice: представить / представили
  rationale: Повреждённые в транскрипции формы по контексту обозначают помещение или представление молитв и греха перед небесными участниками суда; неопределённость отмечена в сноске.
- source_word: ለኃጢአተ ኃጥኣን
  choice: грех грешников
  rationale: Сохранено число исходного существительного и характерное для текста сочетание без стилистического устранения повтора.
- source_word: በቅድመ ልዑል
  choice: перед Всевышним
  rationale: Сохранён традиционный возвышенный божественный титул и судебная пространственная образность.
theological_decisions:
- issue: Роль молитв праведных в небесном суде
  choice: Молитвы становятся свидетельством и напоминанием, после чего ангелы представляют грех грешников перед Всевышним.
  alternative: Молитвы лишь вспоминаются Богом без судебного или обвинительного оттенка.
  rationale: Повтор слова «напоминание», упоминание свидетельства, ангелов и греха создают судебную картину, однако перевод не уточняет сверх текста, каким именно образом последует суд.
- issue: Кто совершает второе представление
  choice: Местоимение «те» отсылает к ангелам.
  alternative: Субъектом остаются праведные или сами молитвы.
  rationale: Последовательность фразы после «перед ангелами» наиболее естественно делает ангелов субъектом следующего действия, что согласуется с исправленным грамматическим разбором.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Обращение «праведные», титул «Всевышний» и повтор «как напоминание» сохранены; синтаксис сделан ясным без устранения судебной образности и текстовой неопределённости.
