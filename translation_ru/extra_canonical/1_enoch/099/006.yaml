base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/006.yaml
  text: 'And again I swear to you[a], sinners: sin has been prepared for the day of blood that does not cease.'
translation:
  language: ru
  text: 'И снова клянусь вам, грешники: грех[a] приготовлен на день непрекращающейся крови.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на день кровопролития приготовлено наказание»; возможно также: «на день кровопролития приготовлен суд». В эфиопском тексте буквально стоит «грех», однако здесь это слово может в сжатой форме обозначать последствие греха.'
    reason: Лексическая и смысловая альтернатива в трудном, сжатом выражении.
lexical_decisions:
- source_word: ወካዕበ
  choice: И снова
  rationale: Передаёт соединительный союз и повторность, сохраняя ритм последовательных пророческих возвещений.
- source_word: እኔ፡ እምሕል፡ ለክሙ
  choice: клянусь вам
  rationale: Глагол выражает торжественное заверение под клятвой, а не простое высказывание.
- source_word: ለኃጥኣን
  choice: грешники
  rationale: Передано как прямое обращение; современная русская пунктуация ясно выражает звательную функцию.
- source_word: ለዕለተ፡ ደም፡ ዘአየሀድአ
  choice: ко дню непрекращающейся крови
  rationale: Сохраняет буквальный образ «дня крови» и относительное определение «которая не прекращается», не сводя его однозначно к кровопролитию.
- source_word: ተደለወት
  choice: приготовлен
  rationale: Передаёт пассивное совершённое действие и состояние заранее уготованного, не уточняя действующее лицо.
- source_word: ኃጢአት
  choice: грех
  rationale: Сохраняет прямое словарное значение эфиопского существительного и намеренно не подменяет его предполагаемым следствием греха.
theological_decisions:
- issue: Означает ли ኃጢአት сам грех или его судебное последствие
  choice: В основном тексте сохранено «грех»
  alternative: «наказание» или «суд за грех» приготовлены ко дню кровопролития
  rationale: Эфиопский текст прямо говорит о грехе; сжатое выражение может метонимически указывать на его последствие, но перевод не должен устранять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Формулировка сохраняет необычный образ «непрекращающейся крови» и исходную неоднозначность слова «грех».
