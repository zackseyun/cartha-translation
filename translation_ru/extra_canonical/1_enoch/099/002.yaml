base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/002.yaml
  text: Woe to those who pervert the word of righteousness and the eternal ordinance[a], and reckon themselves not to be sinners[c][b]; they shall be trampled upon the earth.
translation:
  language: ru
  text: 'Горе тем, кто искажает слово праведности и установление, пребывающее вовеки, и считает себя не грешником[a]: они будут попраны на земле.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «грешники» в используемом издании эфиопского текста заключено в квадратные скобки, что указывает на текстологическую неуверенность. Без него фраза остаётся неполной; по смыслу речь идёт о людях, считающих самих себя не грешниками.
    reason: textual_variant
lexical_decisions:
- source_word: አሌ
  choice: Горе
  rationale: Передаёт формулу пророческого обличения и грядущего суда, а не только выражение скорби.
- source_word: ይዌልጥዎሙ
  choice: искажает
  rationale: Глагол обозначает изменение или искривление должного; «искажает» естественно передаёт нравственный и судебный оттенок контекста.
- source_word: ለነገረ ርትዕ
  choice: слово праведности
  rationale: ነገር может означать слово, дело или содержание вести; буквальное сочетание сохраняет эту смысловую широту и торжественный строй фразы.
- source_word: ሥርዐተ እንተ ለዓለም የኃልዉ
  choice: установление, пребывающее вовеки
  rationale: «Установление» передаёт значение порядка, правила или устава, а придаточный оборот сохраняет явно выраженную в источнике идею непреходящего существования.
- source_word: ወይሬስዩ ርእሶሙ ዘአኮኑ [ኃጥኣነ]
  choice: и считает себя не грешниками
  rationale: Рефлексивный оборот здесь означает, что люди считают самих себя не принадлежащими к грешникам; перевод не воспроизводит ошибочное буквальное понимание слова «голова».
- source_word: ዲበ ምድር ሀለዉ ይትከየዱ
  choice: они будут попраны на земле
  rationale: Сохраняет конкретный образ попрания как наказания и местное выражение «на земле» без добавочного уточнения субъекта суда.
theological_decisions:
- issue: Характер начального провозглашения
  choice: Формула судебно-пророческого «горя»
  alternative: Простой плач или нравственное сожаление
  rationale: Контекст ряда обличений и завершающее обещание наказания указывают на провозглашение суда.
- issue: Самооценка обличаемых как не являющихся грешниками
  choice: 'Передать их притязание: «считает себя не грешниками»'
  alternative: Утверждать от лица повествователя, что они действительно не были грешниками
  rationale: Синтаксис с рефлексивным оборотом естественно относится к мнению самих обличаемых; это сохраняет напряжение между их самооценкой и объявленным им судом.
- issue: Неопределённость слова «грешники» в рукописной форме источника
  choice: Сохранить слово в основном тексте и отметить текстологическую неуверенность
  alternative: Опустить его или молча перестроить весь оборот
  rationale: Смысл фразы требует дополнения, однако квадратные скобки в издании показывают неуверенность текста; сноска делает это прозрачным.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Синтаксис сохранён достаточно близко к источнику, но без неестественных кальк; образ попрания и выражение «слово праведности» оставлены ради апокалиптической силы и смысловой широты.
