    rationale: Это основано на ненадёжном OCR-чтении. Печатное чтение, отражённое в установленном английском переводе Чарльза, — «в Шеоле»; смысл стиха меняется существенно.
  - severity: high
    issue: Сноска b утверждает повтор слова «ближний, товарищ» и смысловое воздаяние через ближних.
    rationale: Такое утверждение зависит от ошибочного чтения второй фразы и не должно сопровождать исправленный текст.
