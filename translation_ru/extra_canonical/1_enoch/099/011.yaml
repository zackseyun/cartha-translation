  text: Woe to you who spread evil to your neighbors[c][b][a], for by your neighbors you will be slain.
translation:
  language: ru
  text: 'Горе вам, распространяющим зло среди своих ближних[a]: от рук ближних вы будете убиты[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «против своих ближних» или «вместе со своими товарищами». Предлог допускает целевое, локальное либо совместное понимание.'
    reason: lexical_alternative
  - marker: b
    text: Эфиопское чтение этой фразы не вполне надёжно. При данном чтении повторяется слово со значением «ближний, товарищ», что создаёт смысловое соответствие между поступком и воздаянием.
    reason: textual_uncertainty
lexical_decisions:
- source_word: እሌ፡ ለክሙ
  choice: Горе вам
  rationale: Стандартная формула пророческого обличения; сохраняет силу возгласа суда и естественно звучит по-русски.
- source_word: እለ፡ ትሰፍሕዋ፡ ለእኩይ
  choice: распространяющим зло
  rationale: Глагол передаёт расширение или распространение; выбранный оборот сохраняет образ разрастания зла без неестественной буквальности.
- source_word: በቢጽክሙ
  choice: среди своих ближних
  rationale: Существительное может обозначать ближних, товарищей или спутников, а предлог допускает несколько отношений. В контексте зло распространяется в кругу ближних; неоднозначность отмечена в сноске.
- source_word: እስመ
  choice: ':'
  rationale: 'Причинно-пояснительная связь передана двоеточием: следующая часть раскрывает основание возгласа «горе» и формулу воздаяния.'
- source_word: በቢጸል
  choice: от рук ближних
  rationale: Инструментальное значение предлога передано естественным русским оборотом. Повтор родственного обозначения ближних сохранён как возможная риторическая перекличка.
- source_word: ትትቀተሉ
  choice: вы будете убиты
  rationale: Передаёт пассивное значение будущего времени в контексте суда, оставаясь ясным и современным.
theological_decisions:
- issue: Характер воздаяния
  choice: 'Сохранено воздаяние по подобию поступка: зло, распространяемое среди ближних, оборачивается гибелью от рук ближних.'
  alternative: 'Общее утверждение о гибели злодеев из-за их сообщников либо инструментальное понимание обеих фраз: «через товарищей».'
  rationale: Повтор близкого по форме обозначения ближних в двух частях позволяет услышать намеренную риторическую перекличку, но её не следует превращать в более определённое богословское утверждение, чем допускает текст.
