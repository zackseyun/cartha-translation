  verdict: revise
  source_fidelity: Требуется существенная правка второй части. В стандартном печатном тексте Чарльза здесь читается «в Шеоле» (በሲኦል), а не повтор слова «ближний/товарищ». Переданная в контексте OCR-форма በቢጸል ненадёжна и, по-видимому, возникла из ошибочного распознавания. Поэтому перевод «от рук ближних» и построенное на нём воздаяние по принципу “ближние — ближними” не имеют достаточной опоры. В первой части «среди своих ближних» допустимо как осторожное основное решение для отношения, выраженного предлогом, хотя направленное значение «против/своим ближним» также возможно.
  naturalness: «Горе вам, распространяющим зло среди своих ближних» звучит литературно и уместно для краткого судебного изречения. «Ибо в Шеоле вы будете убиты» естественно в современном литературном русском при сохранении термина; пояснение в сноске делает его прозрачным.
  terminology: «Шеол» следует сохранить как древнее обозначение мира мёртвых, не подменяя его конфессионально более определёнными словами вроде «ад». Удалено необоснованное представление о повторе слова «ближний/товарищ» во второй части.
  issues:
  - severity: high
