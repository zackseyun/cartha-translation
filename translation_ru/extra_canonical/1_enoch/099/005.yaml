revisions:
- from: И в те дни беременные будут извергать своих детей и бросать их[a]; их потомство будет выпадать из них. Даже когда они будут кормить грудью, они бросят своих детей и не вернутся к ним; не будет у них жалости к тем, кто им дорог.
  to: И в те дни беременные будут рожать и отбрасывать своих детей[a], оставляя их; их дети будут выпадать из них. И, кормя грудью, они будут бросать своих детей, не возвращаться к ним и не щадить тех, кто им дорог.
  rationale: Исправление устраняет чрезмерно конкретное «извергать», сохраняет повторяющийся мотив оставления детей и передаёт подтверждённое значение «кормя грудью». Единственная сноска поставлена у текстуально спорной начальной цепочки и объясняет её без навязывания одного реконструированного смысла.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:11:38Z'
review_pass:
  verdict: revise
  source_fidelity: В черновике глагол «извергать» неоправданно сужает трудную начальную цепочку до медицинско-физиологического смысла и создаёт впечатление выкидыша. Источник и английская аудиторская дорожка надёжно поддерживают роды/появление детей и их жестокое оставление, но точная функция одного из ранних глаголов спорна. «Кормя грудью» верно передаёт እንዘ ይጠብዉ; прежнее английское понимание «глядя» следует отвергнуть.
  naturalness: «Их потомство будет выпадать из них» формально сохраняет образ, но по-русски звучит неестественно и чрезмерно медицински. «Их дети будут выпадать из них» сохраняет телесный, трагический образ, яснее в контексте родов и не добавляет конкретного способа смерти. Убрано не обусловленное источником усилительное «даже».
  terminology: «Беременные» допустимо в контексте, но сочетание «беременные будут извергать» не соответствует современному литературному употреблению. «Беременные будут рожать» естественно. «Не щадить тех, кто им дорог» точно передаёт отсутствие милости к αγαπητοί/«возлюбленным» без искусственного оборота «не будет у них жалости».
  issues:
  - severity: medium
    issue: «извергать своих детей»
    rationale: Слово задаёт узкий медицинский смысл и предполагает изгнание плода; текстуальная трудность исходной последовательности не позволяет столь определённо навязывать это значение.
  - severity: medium
    issue: «их потомство будет выпадать из них»
    rationale: Оборот стилистически тяжёл и семантически неясен в современном русском. Замена «их дети будут выпадать из них» сохраняет буквальный образ и делает референт ясным.
  - severity: low
    issue: «Даже когда»
    rationale: Усилительная частица «даже» отсутствует в исходнике; деепричастный оборот точнее передаёт одновременность.
  revised_text: И в те дни беременные будут рожать и отбрасывать своих детей[a], оставляя их; их дети будут выпадать из них. И, кормя грудью, они будут бросать своих детей, не возвращаться к ним и не щадить тех, кто им дорог.
