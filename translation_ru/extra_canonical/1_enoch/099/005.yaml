base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/005.yaml
  text: And in those days those who are pregnant will go out and cast away their children[a], and they will abandon them; and their offspring will slip from them. And while nursing, they will cast away their children and will not return to them[e][d][c][b], and they will have no mercy on their beloved ones.
translation:
  language: ru
  text: И в те дни беременные будут рожать и отбрасывать своих детей[a], оставляя их; их дети будут выпадать из них. И, кормя грудью, они будут бросать своих детей, не возвращаться к ним и не щадить тех, кто им дорог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальная последовательность глаголов в эфиопском тексте трудна для точного истолкования. Она может описывать роды, вынесение ребёнка или насильственное отбрасывание; перевод передаёт общую картину рождения и жестокого оставления детей, не уточняя способа.
    reason: textual_variant
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: в те дни
  rationale: Устойчивая апокалиптическая формула; сохраняет пророческий регистр и естественно звучит по-русски.
- source_word: እለ ይጼንሱ
  choice: беременные
  rationale: В данном контексте речь идёт не просто о зачатии, а о женщинах, уже носящих детей.
- source_word: ይወፅኡ ወይመሥጡ ደቂቆሙ
  choice: будут извергать своих детей
  rationale: Трудная последовательность глаголов связана с насильственным или преждевременным выходом ребёнка. «Извергать» передаёт телесный и жестокий образ, не сводя его однозначно к медицинскому термину.
- source_word: ይገድፍዎሙ
  choice: бросать их / бросят своих детей
  rationale: Повторённый глагол выражает оставление и отвержение; «бросать» сохраняет его резкость и повтор в исходном тексте.
- source_word: ይደህፁ ውሉዶሙ
  choice: их потомство будет выпадать из них
  rationale: Сохранён конкретный образ отделения или выпадения потомства без уточнения способа и без сглаживания жестокости сцены.
- source_word: እንዘ ይጠብዉ
  choice: даже когда они будут кормить грудью
  rationale: Глагол относится к сосанию или кормлению грудью, а не к наблюдению. «Даже когда» естественно подчёркивает контраст между материнским кормлением и последующим оставлением.
- source_word: ኢይገብኡ ኀቤሆሙ
  choice: не вернутся к ним
  rationale: Передаёт как пространственный, так и relationalный смысл невозвращения после оставления.
- source_word: ኢይምሕርዎሙ ለፍቁራኒሆሙ
  choice: не будет у них жалости к тем, кто им дорог
  rationale: Сохраняет тему исчезновения естественной привязанности и милосердия, оставаясь понятным современному читателю.
theological_decisions:
- issue: Описывает ли стих общее беззаконие или распад семейной любви во время суда
  choice: Перевод подчёркивает оставление детей и исчезновение жалости к близким в апокалиптической обстановке.
  alternative: Передать стих как обобщённую картину насилия либо только как описание гибели младенцев.
  rationale: Повторные упоминания детей, кормления, возвращения и дорогих сердцу людей направляют смысл к распаду самых естественных семейных уз.
translation_notes:
  register: Современный литературный русский с торжественным апокалиптическим оттенком. Синтаксис сохранён параллельным и нарастающим; архаизмы и медицински узкие термины по возможности исключены.
