base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/009.yaml
  text: They will forget and be afraid[a], because they did all their works in falsehood, and they worshiped a stone[d][c][b], and they will perish in an instant.
translation:
  language: ru
  text: Они забудут и устрашатся, потому что все свои дела совершали во лжи и поклонялись камню[a], и внезапно погибнут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поклонялись камню»; вероятно, имеется в виду каменное изваяние как предмет идолопоклонства.'
    reason: cultural_note
lexical_decisions:
- source_word: ይረሰዑ
  choice: они забудут
  rationale: Форма естественно понимается как активное множественное число; перевод сохраняет простоту и некоторую контекстуальную неясность объекта забывания.
- source_word: ይፈርሁ
  choice: устрашатся
  rationale: Передаёт будущее значение глагола страха без усиления до ужаса.
- source_word: ኵሎ፡ ገብሮሙ፡ በሐሰት
  choice: все свои дела совершали во лжи
  rationale: Сохраняет полноту выражения «все их дела» и нравственный смысл предложного оборота በሐሰት.
- source_word: ለአብን
  choice: камню
  rationale: Сохраняется конкретный объект в единственном числе; вероятный идолопоклоннический смысл пояснён в сноске, а не внесён в основной текст.
- source_word: ይትሐጐሉ
  choice: погибнут
  rationale: Глагол означает гибель или уничтожение; «погибнут» естественно звучит по-русски и не уточняет способ гибели.
- source_word: በምዕር
  choice: внезапно
  rationale: В данном контексте выражение передаёт быстроту и неожиданность наступления гибели — «в одно мгновение», а не стыд или поношение.
theological_decisions:
- issue: Поклонение камню
  choice: 'Сохранить единственное число: «поклонялись камню».'
  alternative: «поклонялись каменному идолу» или «поклонялись камням»
  rationale: Текст прямо называет один камень. Такое конкретное и резкое изображение идолопоклонства не следует обобщать или истолковывать внутри основного текста.
- issue: Характер заключительного суда
  choice: «внезапно погибнут»
  alternative: «будут истреблены в одно мгновение»
  rationale: Перевод сохраняет как гибель, так и её внезапность, не добавляя не подтверждённой идеи стыда.
