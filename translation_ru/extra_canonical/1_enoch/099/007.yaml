base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/007.yaml
  text: And those who bow down to stone[a], and those who make images of gold and silver and wood and clay[d][c][b], and those who bow down to evil spirits and demons and to every idol without understanding—they will find no help at all from them.
translation:
  language: ru
  text: И те, кто поклоняется камню[a], и те, кто делает образ из золота, и из серебра, и из дерева, и из глины[b], и те, кто поклоняется злым духам[c], демонам и всякому идолу, не имея разумения[d], — никакой помощи от них не найдут.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поклоняется камню»; единственное число, вероятно, обобщённо обозначает каменные предметы поклонения.'
    reason: lexical_alternative
  - marker: b
    text: 'В исходном тексте слово «образ» стоит в единственном числе, после чего перечислены золото, серебро, дерево и глина. Возможно также обобщённое понимание: «делает образы из золота, серебра, дерева и глины».'
    reason: textual_ambiguity
  - marker: c
    text: 'Буквально возможно также: «злым душам» или «нечестивым душам».'
    reason: lexical_alternative
  - marker: d
    text: 'Возможно также: «не имея знания», «не будучи наставлены» или «не вразумившись». Оборот характеризует поклоняющихся; по сфере действия он может относиться только к последней группе либо ко всему описанному поклонению.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ይሰግዱ
  choice: поклоняется
  rationale: Глагол обозначает поклон или простирание ниц и в данном перечне имеет явный культовый смысл; «поклоняется» естественно передаёт оба аспекта, не сводя действие лишь к телесному жесту.
- source_word: ለአብን
  choice: камню
  rationale: Сохранено прямое наименование материала в единственном числе; не добавлено отсутствующее здесь слово «идол».
- source_word: ይገብሩ ምስለ
  choice: делает образ
  rationale: ምስለ понято как форма существительного «образ, изображение», а не как предлог «с»; единственное число исходного текста сохранено, несмотря на необычный перечень материалов.
- source_word: ዘወርቅ ወዘብሩር ወዘዕፅ ወዘልሕኵት
  choice: из золота, и из серебра, и из дерева, и из глины
  rationale: Повторение «и из» отражает повторяющиеся связки исходного текста и его нарочитую перечислительную ритмику; последний материал передан общепонятным словом «глина».
- source_word: ነፍሳት እኩያት
  choice: злым духам
  rationale: В контексте поклонения, рядом с демонами и идолами, речь вероятнее всего идёт о сверхъестественных существах; буквальная возможность «злым душам» сохранена в примечании.
- source_word: አጋንንት
  choice: демонам
  rationale: Прямой и общепринятый русский эквивалент для злобных сверхъестественных существ.
- source_word: ጣዖት
  choice: идолу
  rationale: Передаёт культовый предмет прямо и без архаического утяжеления.
- source_word: ኢበተምሃር
  choice: без разумения
  rationale: Сохраняет нравственно-познавательный смысл и некоторую необычность оборота, не закрепляя однозначно возможный педагогический оттенок «не будучи наставлены».
- source_word: ወኵሎ ረድኤተ ኢይረክቡ እምኔሆሙ
  choice: никакой помощи от них не найдут
  rationale: «Найдут» непосредственно передаёт ይረክቡ, а «никакой» выражает усилительное ኵሎ и полное отсутствие помощи.
theological_decisions:
- issue: Камень как материал или явно названный каменный идол
  choice: камню
  alternative: каменному идолу
  rationale: В исходном тексте назван «камень» без отдельного слова «идол»; буквальная предметность усиливает полемику против идолопоклонства и не требует поясняющего добавления в основном тексте.
- issue: Значение ነፍሳት в сочетании ነፍሳት እኩያት
  choice: злым духам
  alternative: злым душам
  rationale: Соседство с демонами и всяким идолом поддерживает сверхъестественное прочтение, но семантическая возможность «душ» не устранена и отмечена в сноске.
- issue: К чему относится оборот «без разумения»
  choice: сохранён в конце всего ряда поклонения
  alternative: отнести только к поклонению всякому идолу
  rationale: Положение оборота допускает более узкую или более широкую связь; русский порядок слов оставляет эту сферу действия несколько открытой, не превращая её в отдельное догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего пророческого обличения. Перечислительный ритм и повтор союзов намеренно сохранены; архаизмы и конфессионально окрашенные уточнения не вводились.
