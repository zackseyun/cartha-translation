base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/003.yaml
  text: And Semyaza[a], who was their leader, said to them, “I fear that you may not be willing to do this deed[b], and I alone will become liable for a great sin.”
translation:
  language: ru
  text: 'Семъяза[a], их предводитель, сказал им: «Я боюсь, что вы не захотите совершить это дело и что один я буду отвечать[b] за великий грех».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переданное как «предводитель», буквально связано со значениями «ангел» и «вестник»; здесь оно указывает на Семъязу как на главу группы.
    reason: lexical_alternative
  - marker: b
    text: «Буду отвечать» можно также перевести как «понесу наказание» или «понесу ответственность»; исходное слово сочетает смысл ответственности и воздаяния.
    reason: lexical_alternative
lexical_decisions:
- source_word: ስምያዛ
  choice: Семъяза
  rationale: Личное имя передано транслитерацией; форма сохраняет различимость составляющих имени и соответствует принятой передаче Semyaza.
- source_word: መልአኮሙ
  choice: их предводитель
  rationale: Буквально слово связано с «ангелом/вестником», однако в данном контексте обозначает положение Семъязы во главе группы. «Предводитель» естественно и ясно передаёт функцию, не создавая впечатления, будто речь идёт о другом ангеле.
- source_word: እፈርህ
  choice: я боюсь
  rationale: Прямая современная передача глагола страха, сохраняющая колебание говорящего.
- source_word: ኢትፍቅዱ
  choice: вы не захотите
  rationale: Глагол выражает желание или согласие, а не способность; после «я боюсь» русская конструкция естественно передаёт опасение.
- source_word: ይትገበር ዝንቱ ግብር
  choice: совершить это дело
  rationale: Передаёт осуществление задуманного поступка; «дело» сохраняет широкое и нравственно весомое значение ግብር.
- source_word: ባሕቲትየ
  choice: один я
  rationale: Сохраняет усиленное указание на то, что ответственность останется исключительно на Семъязе.
- source_word: ፈዳዪ
  choice: понесу наказание
  rationale: 'Передаёт юридико-нравственную силу слова: понести воздаяние или отвечать за проступок. Формулировка естественнее по-русски, чем буквальное «стану ответственным».'
- source_word: ለኃጢአት ዐባይ
  choice: за великий грех
  rationale: Прямо сохраняет нравственную тяжесть выражения, не уточняя характер греха сверх источника.
theological_decisions:
- issue: Роль Семъязы среди остальных стражей
  choice: их предводитель
  alternative: их ангел / их вестник / их глава
  rationale: Контекст указывает на руководящее положение Семъязы. Функциональная передача не вводит дополнительного онтологического утверждения и при этом сохраняет буквальную возможность в примечании.
- issue: Характер последствий великого греха
  choice: понесу наказание за великий грех
  alternative: буду один отвечать за великий грех / один стану виновным в великом грехе
  rationale: Источник допускает оттенки ответственности, воздаяния и несения кары. Основной текст передаёт карательный смысл, а примечание сохраняет юридико-нравственную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Синтаксис сделан ясным для обычного читателя; сохранены страх Семъязы, возможность отказа остальных и неоднозначность между ответственностью и наказанием.
