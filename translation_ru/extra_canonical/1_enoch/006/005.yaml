  text: Then they all swore together and bound one another with a curse concerning it[a][b][c].
translation:
  language: ru
  text: Тогда все они вместе поклялись и связали друг друга проклятием в этом деле[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «связали себя друг с другом проклятием».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «относительно этого»; речь идёт о замысле, обсуждавшемся выше.'
    reason: referent_clarification
lexical_decisions:
- source_word: አሜሃ
  choice: Тогда
  rationale: Передаёт повествовательный переход к следующему действию без лишнего уточнения времени.
- source_word: መሐሉ
  choice: поклялись
  rationale: Глагол означает принесение клятвы, а не просто речь; перевод сохраняет явный характер клятвенного действия.
- source_word: ኵሎሙ ኅቡረ
  choice: все они вместе
  rationale: Сохраняет двойное подчёркивание всеобщего и совместного участия.
- source_word: ወአውገዙ
  choice: и связали… проклятием
  rationale: Передаёт силу взаимного обязательства, подкреплённого проклятием, не сводя глагол к нейтральному обещанию.
- source_word: በበይናቲሆሙ
  choice: друг друга
  rationale: Естественно выражает взаимность действия в современном русском языке.
- source_word: ቦቱ
  choice: в этом деле
  rationale: Местоименное указание отсылает к обсуждаемому замыслу; «в этом деле» звучит естественно и не конкретизирует его сверх источника.
theological_decisions:
- issue: Характер взаимного обязательства Стражей
  choice: связали друг друга проклятием
  alternative: связали себя друг с другом под страхом проклятия
  rationale: Основной текст сохраняет взаимность и импрекативную силу поступка, не объясняя сверх меры, как именно должно было действовать проклятие.
- issue: Различение клятвы и проклятия
  choice: 'передать оба глагола отдельно: «поклялись» и «связали… проклятием»'
  alternative: поклялись друг другу
  rationale: В источнике названы два связанных, но различимых действия; их слияние ослабило бы полноту формулировки.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Формулировка остаётся ясной для широкого читателя и сохраняет повторный акцент на единодушном участии всех.
