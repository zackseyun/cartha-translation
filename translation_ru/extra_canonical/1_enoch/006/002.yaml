base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/002.yaml
  text: And the angels[a], the sons of heaven, saw them and desired them. And they said among themselves, “Come, let us choose for ourselves wives from the children of men[d][c][b], and let us beget children for ourselves.”
translation:
  language: ru
  text: 'И ангелы, сыны небес, увидели их[a] и возжелали их. И сказали друг другу: «Давайте выберем себе жён из дочерей человеческих[b] и породим себе детей[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «их» относится к женщинам, упомянутым в предыдущем стихе; здесь геэзский текст не повторяет слово «женщины».
    reason: cross_reference
  - marker: b
    text: 'Буквально: «из детей людей»; по контексту речь идёт о женщинах, которых они намерены избрать себе в жёны.'
    reason: lexical_alternative
  - marker: c
    text: Буквально выражена мысль о порождении, то есть произведении, потомства для себя.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርእዩ ኪያሆን
  choice: увидели их
  rationale: Прямо передаёт глагол зрения и сохраняет местоименный объект женского рода, отсылающий к женщинам в предыдущем стихе, не подставляя пояснение в основной текст.
- source_word: መላእክት ውሉደ ሰማያት
  choice: ангелы, сыны небес
  rationale: Оба обозначения сохранены как приложение; формула не сведена ни к одному из них и не истолкована сверх текста.
- source_word: ወፈተውዎን
  choice: возжелали их
  rationale: «Возжелали» выражает сильное влечение и соответствует возвышенному апокалиптическому регистру, не уточняя его как похоть или любовь.
- source_word: በበይናቲሆሙ
  choice: друг другу
  rationale: Естественно передаёт взаимную речь внутри группы; буквальное «между собой» также возможно.
- source_word: ንዑ
  choice: давайте
  rationale: Передаёт побудительный призыв к совместному действию естественным современным русским языком.
- source_word: ንሕረይ ለነ አንስተ
  choice: выберем себе жён
  rationale: Сохраняет значение выбора и возвратную заинтересованность говорящих; контекст последующего рождения детей поддерживает значение «жён».
- source_word: እምውሉደ ሰብእ
  choice: из дочерей человеческих
  rationale: С учётом женского референта и выбора жён русское «дочерей человеческих» точно и естественно передаёт женщин из человеческого рода, сохраняя контраст с сынами небес.
- source_word: ወንለድ ለነ ውሉደ
  choice: и родим себе детей
  rationale: Передаёт буквальный образ рождения потомства без тяжеловесного «зачнём» или архаического «породим»; принадлежность будущих детей говорящим сохранена словом «себе».
theological_decisions:
- issue: Отождествление существ одновременно как ангелов и сынов небес
  choice: 'Сохранить оба наименования: «ангелы, сыны небес»'
  alternative: «небесные ангелы» либо только одно из двух обозначений
  rationale: Геэзский текст явно содержит оба наименования. Приложение сохраняет собственную антропологию повествования и не сглаживает её.
- issue: Степень сексуальной определённости глагола желания
  choice: «возжелали их»
  alternative: «воспылали к ним похотью» или «полюбили их»
  rationale: Контекст предполагает брачный и половой союз, однако сам глагол обозначает сильное желание, не требуя ни более осуждающего, ни романтизирующего истолкования.
- issue: Передача человеческой группы, из которой выбираются жёны
  choice: «из дочерей человеческих»
  alternative: «из детей человеческих» или «из людей»
  rationale: Женский референт задан предыдущим стихом и словом «жёны»; формула сохраняет возвышенный контраст между сынами небес и человеческими дочерьми, не утверждая дополнительной доктрины.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Синтаксис проясняет, что ангелы являются подлежащим, тогда как местоимение «их» — дополнением. Архаизмы сведены к понятной и уместной форме «возжелали»; подлинная неоднозначность силы желания сохранена.
