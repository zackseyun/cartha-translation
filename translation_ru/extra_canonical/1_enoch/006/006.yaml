    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎሙ
  choice: их всего
  rationale: Передаёт совокупность всей ранее упомянутой группы и сохраняет значение местоименного суффикса.
- source_word: ክልኤ ምእት
  choice: двести
  rationale: Прямое и естественное выражение числительного без избыточного добавления «числом».
- source_word: ወወረዱ
  choice: и они сошли
  rationale: Глагол обозначает движение вниз; «сошли» естественно по-русски и сохраняет важное для повествования нисхождение с неба на землю.
- source_word: ውስተ
  choice: на
  rationale: При обозначении горной местности предлог «на» естественно передаёт прибытие к месту на возвышенности.
- source_word: አርዲስ
  choice: Ардис
  rationale: Топоним транслитерирован, а не переведён; точная огласовка имени остаётся не вполне определённой.
- source_word: ዝውእቱ ድማኁ ለደብረ አርሞን
  choice: который является вершиной горы Ермон
  rationale: Относительное предложение отождествляет Ардис с верхней точкой горы; «вершина» точно и понятно передаёт топографический смысл.
