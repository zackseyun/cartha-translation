base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/004.yaml
  text: And they all answered him and said[a], "Let us all swear an oath, and let us all bind one another with a curse, so that we do not turn back from this plan[b], but carry out this deed."
translation:
  language: ru
  text: 'И все они ответили ему и сказали: «Все мы поклянёмся клятвой и взаимно свяжем себя проклятием[a], чтобы не отступить от этого замысла, но совершить это дело[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В геэзском тексте рядом стоят выражения «поклясться клятвой» и «взаимно связать себя проклятием»; эта двойная формула подчёркивает торжественность взаимного обязательства.
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная часть текста построена с повтором: «этот замысел… это дело». Перевод сохраняет переход от принятого решения к его исполнению.'
    reason: textual_variant
lexical_decisions:
- source_word: አውሥኡ
  choice: ответили
  rationale: Глагол вводит общий ответ собеседников; «ответили» сохраняет повествовательный и диалогический характер фразы.
- source_word: መሐላ፡ ንምሐል
  choice: поклянёмся же все клятвой
  rationale: Сохраняется намеренное сочетание существительного «клятва» с глаголом «клясться», подчёркивающее торжественность обязательства; частица «же» естественно передаёт побудительное значение.
- source_word: ናውግዝ፡ ኵልነ፡ በበይናቲነ
  choice: свяжем друг друга проклятием
  rationale: Передаёт не просто произнесение проклятия, а взаимное самообязывание через проклятие; «друг друга» сохраняет взаимность действия.
- source_word: ከመ፡ ኢንምጠ
  choice: чтобы нам не отступить
  rationale: «Отступить» сохраняет волевой и направительный оттенок отказа от уже принятого решения, не сводя смысл к простой неудаче.
- source_word: ለዛቲ፡ ምክር
  choice: от этого замысла
  rationale: «Замысел» естественно передаёт здесь совместно принятое намерение; слово не добавляет лишней моральной оценки, присущей, например, слову «заговор».
- source_word: ንግብራ፡ ለዛቲ፡ ግብር
  choice: совершить это дело
  rationale: Передаёт переход от решения к исполнению и сохраняет смысловую повторность корня, связанную с действием и совершением.
theological_decisions:
- issue: Характер взаимной клятвы Стражей
  choice: Самообязывающий взаимный союз, скреплённый проклятием
  alternative: Простое обещание или общее проклятие без обязательственной силы
  rationale: Парная формула клятвы и проклятия указывает на торжественный взаимный договор и сохраняет нравственно-судебную тяжесть их мятежного решения.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным повествовательным строем. Синтаксический параллелизм и юридически окрашенная формула клятвы сохранены без конфессионального истолкования.
