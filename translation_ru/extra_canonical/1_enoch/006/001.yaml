    text: 'Или: «сыны человеческие». Эфиопское выражение служит обычным обозначением людей и подготавливает контраст со Стражами в следующих стихах.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኮነ
  choice: И случилось
  rationale: Передаёт повествовательную формулу, открывающую новый эпизод, сохраняя возвышенный, но понятный современному читателю тон.
- source_word: እምዘ በዝኁ
  choice: когда ... умножились
  rationale: Сохраняет обстоятельственно-временную связь и значение численного увеличения.
- source_word: ውሉደ ሰብእ
  choice: дети человеческие
  rationale: Близко передаёт традиционное обозначение людей и сохраняет намеченный контраст с небесными Стражами в дальнейшем контексте.
- source_word: በእማንቱ መዋዕል
  choice: в те дни
  rationale: Естественная русская передача устойчивой апокалиптической временной формулы.
- source_word: ተወልዳ ሎሙ አዋልድ
  choice: стали рождаться у них дочери
  rationale: Естественно передаёт исходную конструкцию и её продолженное событийное значение в рамках временного предложения.
- source_word: ሠናያት
  choice: красивые
  rationale: Прямо и современно передаёт внешнюю красоту без стилистического снижения.
- source_word: ወላሕያት
  choice: привлекательные
  rationale: Сохраняет второе, усиливающее определение и не сводит пару исходных прилагательных к одному слову.
theological_decisions:
- issue: Антропологическое выражение в контрасте с небесными существами
  choice: дети человеческие
  alternative: сыны человеческие; люди
  rationale: Формульное выражение сохраняет литературный контраст со Стражами, но не ограничивает значение только мужчинами и не устраняет заложенную в тексте образность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Сохранена формульность начала и двойное описание красоты дочерей; архаизмы, способные затруднить понимание, не использованы.
