base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/001.yaml
  text: And it came to pass[a], when the children of men had multiplied in those days, daughters were born to them, beautiful and comely.
translation:
  language: ru
  text: 'И случилось: когда в те дни умножились дети человеческие[a], у них родились дочери — красивые и привлекательные.'
  philosophy: optimal-equivalence
  footnotes:
