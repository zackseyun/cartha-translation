base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/004.yaml
  text: And they said to their Lord[a], the King, “For you are Lord of lords, God of gods, and King of kings, and the throne of your glory is through all the generations of eternity, and your name is holy and glorious through all eternity[d][c][b], and blessed.”
translation:
  language: ru
  text: И они сказали Владыке царей:[a] «Ибо Ты — Владыка владык, Бог богов и Царь царей; престол славы Твоей пребывает на протяжении всех поколений вечности, и имя Твоё свято и славно во всю вечность и благословенно».[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начальное обращение в эфиопском тексте синтаксически сжато. Возможно также: «своему Владыке, Царю».'
    reason: alternative_reading
  - marker: b
    text: 'Некоторые свидетели добавляют после «благословенно»: «и почитаемо» (или «и славно»).'
    reason: textual_variant
lexical_decisions:
- source_word: ለእግዚኦሙ ለነገሥት
  choice: Владыке царей
  rationale: Передаёт эфиопскую конструкцию с предваряющим местоименным суффиксом и зависимым множественным числом; не превращает «царей» в единственное число и сохраняет торжественный титул.
- source_word: እስመ
  choice: ибо
  rationale: Сохраняет явно выраженную причинно-пояснительную связь, вводящую небесное славословие.
- source_word: እግዚኦሙ ለአጋእዝት
  choice: Владыка владык
  rationale: Сохраняет формульный титул превосходства и его параллелизм с последующими титулами.
- source_word: አምላኮሙ ለአማልክት
  choice: Бог богов
  rationale: Буквально и естественно передаёт второй член трёхчастной титулатуры.
- source_word: ንጉሦሙ ለነገሥት
  choice: Царь царей
  rationale: Сохраняет традиционную формулу абсолютного верховенства и риторический параллелизм.
- source_word: መንበረ ስብሐቲከ
  choice: престол славы Твоей
  rationale: Сохраняет конкретный образ престола, важный для апокалиптического видения, вместо сведения словосочетания к одному прилагательному.
- source_word: ውስተ ኵሉ ትውልደ ዓለም
  choice: во все поколения вечности
  rationale: В данном славословии ዓለም имеет временное значение «век, вечность»; формулировка сохраняет также отдельный образ череды поколений.
- source_word: ስምከ ቅዱስ ወስቡሕ ውስተ ኵሉ ዓለም ወቡሩክ
  choice: имя Твоё свято и прославлено во всю вечность и благословенно
  rationale: 'Сохраняет порядок определений в эфиопском тексте: «свято и прославлено» — затем временное выражение — затем «благословенно»; ስቡሕ передано в значении прославления, не смешанном с последующим «благословенно».'
theological_decisions:
- issue: Передача трёхчастной божественной титулатуры
  choice: 'Сохранить полностью: «Владыка владык, Бог богов и Царь царей»'
  alternative: Сжать до «верховный Владыка и Бог»
  rationale: Повтор является существенной частью небесного славословия и утверждения Божьего верховенства; его нельзя сглаживать без смысловой и риторической потери.
- issue: Значение ዓለም в двух временных формулах
  choice: вечность
  alternative: мир
  rationale: Контекст славословия и засвидетельствованная формула указывают на временное значение «век/вечность», а не на пространственное «мир».
- issue: Неуверенное заключительное ወከቡድ
  choice: Не включать в основной текст, отметить в сноске
  alternative: Включить как «и почитаемо»
  rationale: Слово дано в источнике в квадратных скобках; сноска сохраняет вариант, не выдавая его за бесспорный основной текст.
- issue: Сжатая конструкция начального обращения
  choice: Владыке царей
  alternative: своему Владыке, Царю
  rationale: Первый вариант лучше учитывает множественное ለነገሥት и эфиопскую конструкцию с предваряющим суффиксом; альтернативная пунктуация и синтаксическая трактовка отмечены для прозрачности.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным регистром. Формульные повторы и апокалиптический образ престола сохранены; архаизирующие формы вроде «доколе» или «во вся роды» не использованы. Местоимения, обращённые к Богу, написаны с прописной буквы как элемент русского религиозно-литературного регистра, без внесения конфессиональной специфики.
