base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/003.yaml
  text: And now[a], to you, the holy ones of heaven, the souls of men make their plea, saying[b], ‘Bring our case before the Most High.’
translation:
  language: ru
  text: 'И ныне души людей обращаются к вам, святым небес, с просьбой: «Представьте наше дело перед Всевышним».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Добейтесь для нас правосудия перед Всевышним»; возможно также: «Представьте наш иск перед Всевышним». Эфиопское выражение имеет судебный оттенок и может подразумевать как передачу дела на рассмотрение, так и просьбу о справедливом решении.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: И ныне
  rationale: Сохраняет временно-риторический переход и возвышенный, но понятный современному читателю регистр.
- source_word: ለክሙ ለቅዱሳነ ሰማይ
  choice: к вам, святые небесные
  rationale: Передаёт обращение к святым существам небесной сферы, не отождествляя их прямо ни с ангелами, ни с человеческими святыми.
- source_word: ይስእዩ ነፍሳተ ሰብእ
  choice: взывают души людей
  rationale: Естественно передаёт настойчивое прошение; выражение «души людей» сохраняет антропологическую лексику источника.
- source_word: እንዘ ይብሉ
  choice: говоря
  rationale: Прямой и естественный способ ввести содержание прошения.
- source_word: አብኡ ለነ ፍትሐ
  choice: Представьте наше дело
  rationale: Сохраняет судебный смысл просьбы и не создаёт впечатления, будто окончательный приговор уже вынесен.
- source_word: ኀበ ልዑል
  choice: перед Всевышним
  rationale: Передаёт направление к небесному суду и присутствие верховного Судьи.
theological_decisions:
- issue: Кто такие «святые небесные»
  choice: Сохранено широкое обозначение небесных святых существ
  alternative: «ангелы» или «святые на небесах»
  rationale: Контекст указывает на небесных посредников, однако сам стих не употребляет слово «ангелы»; буквальная широта образа сохранена.
- issue: Смысл ፍትሐ в прошении
  choice: «наше дело» — судебная тяжба, требующая рассмотрения
  alternative: «правосудие», «оправдание» или «суд»
  rationale: Формулировка удерживает юридический характер и не решает однозначно, идёт ли речь о деле, правосудии или оправдании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Судебная образность сохранена без архаизмов и конфессионально окрашенных уточнений.
