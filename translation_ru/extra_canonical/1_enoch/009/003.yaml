  naturalness: «Святые небесные» грамматически возможно, но в современном литературном русском звучит менее естественно и может восприниматься как характеристика святых вообще. «Святые небес» сохраняет образ небесных святых существ, не называя их ангелами, и лучше соответствует возвышенному регистру.
  terminology: «Всевышний» и «наше дело» удачны. «Святые небес» не навязывает отождествления с человеческими святыми или ангелами; юридическая неоднозначность ፍትሐ сохранена в основном тексте и примечании.
