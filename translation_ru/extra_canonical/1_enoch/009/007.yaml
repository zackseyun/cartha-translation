base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/007.yaml
  text: And Semyaza[c][b][a], to whom you gave authority to rule over those who are with him.
translation:
  language: ru
  text: И Семьяза, которому Ты дал власть управлять теми, кто с ним.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «теми, кто собран вместе с ним». Геэзское выражение может обозначать его спутников, соратников или тех, кто объединился с ним.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ስምያዛ
  choice: Семьяза
  rationale: Личное имя передано транслитерацией; форма «Семьяза» достаточно близка к геэзскому звучанию и естественна для русского текста.
- source_word: ዘአንተ፡ ወሀብኮ
  choice: которому Ты дал
  rationale: С учётом грамматики и контекста относительная конструкция относится к Семьязе, тогда как субъектом глагола является Бог, к Которому обращаются ангелы; это не обращение к Семьязе.
- source_word: ስልጣነ
  choice: власть
  rationale: Слово обозначает предоставленное полномочие или право руководить, а не самодержавное господство.
- source_word: ይኵንን
  choice: управлять
  rationale: Глагольное значение сохранено явно; «управлять» передаёт руководство, не сужая смысл до судебного решения.
- source_word: እለ፡ ምስሌሁ፡ ኅቡረ
  choice: теми, кто с ним
  rationale: Естественная русская передача группы спутников или соратников, собранных вместе с Семьязой; точный оттенок совместности остаётся открытым.
theological_decisions:
- issue: Характер власти Семьязи
  choice: Дарованная Богом власть управлять связанными с ним ангелами
  alternative: Власть судить тех, кто с ним, либо власть среди них
  rationale: «Дал власть» сохраняет представление о делегированном полномочии, не приписывая Семьязе собственной верховной власти; нейтральное «управлять» не разрешает спорный оттенок глагола чрезмерно узко.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Заглавная буква в «Ты» отмечает обращение ангелов к Богу и одновременно устраняет возможное ошибочное понимание, будто речь обращена к Семьязе.
