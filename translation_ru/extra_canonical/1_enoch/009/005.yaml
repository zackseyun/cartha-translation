base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/005.yaml
  text: You have made all things[a], and authority over all is with you; and all things are uncovered and laid bare before you, and you see all things, and there is nothing that can hide itself from you.
translation:
  language: ru
  text: Ты сотворил всё, и власть над всем — у Тебя; всё открыто и обнажено пред Тобой[a]. Ты видишь всё, и ничто не может укрыться от Тебя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «всё открыто пред Тобой и явно». Два близких выражения усиливают образ полной открытости всего перед Богом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ገበርከ
  choice: сотворил
  rationale: Глагол означает «делать, создавать». При всеохватном дополнении «всё» русское «сотворил» естественно передаёт дело Бога, не добавляя в текст прямого утверждения о способе творения.
- source_word: ስልጣነ
  choice: власть
  rationale: Слово обозначает власть, господство или право повелевать; «власть» ясно и естественно выражает Божье верховенство.
- source_word: ምስሌከ
  choice: у Тебя
  rationale: Буквально «с Тобой». В данном контексте оборот выражает принадлежность или пребывание власти у Бога; русское «у Тебя» сохраняет эту образность.
- source_word: ክሡት
  choice: открыто
  rationale: Передаёт значение раскрытого, неприкрытого, явленного и сохраняет конкретный образ полной открытости перед Богом.
- source_word: ግሁድ
  choice: обнажено
  rationale: В паре с «открыто» усиливает образ полной незащищённости и явности; «обнажено» сохраняет выразительность исходного сочетания.
- source_word: ትሬኢ
  choice: Ты видишь
  rationale: Прямой современный эквивалент глагола зрения, сохраняющий конкретный язык исходного текста.
- source_word: ዘይትከሀል
  choice: не может
  rationale: Оборот выражает невозможность или отсутствие способности; «не может» естественно передаёт его по-русски.
- source_word: ይትኀባእ
  choice: укрыться
  rationale: Возвратно-пассивная форма допускает смысл самосокрытия или пребывания скрытым; «укрыться» сохраняет идею невозможности избежать Божьего взора.
theological_decisions:
- issue: Передавать ли стих абстрактными терминами всемогущества и всеведения
  choice: Сохранить конкретные образы творения, власти, открытости, зрения и невозможности укрыться.
  alternative: «Ты всемогущ и всеведущ» или «Тебе известно всё».
  rationale: Исходный текст подразумевает Божье верховенство и всеобъемлющее знание, но выражает их конкретными глаголами и образами. Абстрактная формулировка преждевременно истолковала бы текст вместо его перевода.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным молитвенным звучанием. Местоимения, обращённые к Богу, написаны с прописной буквы. Формула «пред Тобой» сохраняет достоинство и библейскую окраску, не делая текст архаичным.
