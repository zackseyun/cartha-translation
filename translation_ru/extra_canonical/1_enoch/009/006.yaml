base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/006.yaml
  text: You see what Azazel has done[a]—how he has taught all unrighteousness upon the earth and revealed the hidden things of the world that are done in the heavens[c][b], which men learned.
translation:
  language: ru
  text: 'Ты видишь, что сделал Азазел: он научил людей всякому беззаконию на земле и открыл тайны мира[a] — то, что совершается на небесах и о чём узнали люди[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тайны века» либо «тайны вечности»; эфиопское слово ዓለም может иметь все эти близкие значения.'
    reason: lexical_alternative
  - marker: b
    text: Заключительная фраза эфиопского текста трудна. Буквально она допускает передачу «о чём люди узнали» или «что люди знали»; чтение «к чему люди стремились узнать» не основано на обычном значении данного эфиопского глагола.
    reason: textual_difficulty
lexical_decisions:
- source_word: ርኢከ
  choice: Ты видишь
  rationale: Форма обращена к одному небесному адресату. Настоящее время естественно передаёт непосредственность обвинительной молитвы; «Ты увидел» также грамматически возможно.
- source_word: ዘገብረ አዛዝኤል
  choice: что сделал Азазел
  rationale: Относительная конструкция обозначает совершённое деяние, последствия которого остаются предметом жалобы.
- source_word: ዘመሀረ ኵሎ ዓመፃ
  choice: он научил людей всякому беззаконию
  rationale: Глагол означает обучение, а ዓመፃ охватывает неправедность, нарушение должного порядка и мятеж. Дополнение «людей» ясно из контекста и делает русскую фразу естественной, не меняя роли Азазела как учителя зла.
- source_word: በዲበ ምድር
  choice: на земле
  rationale: Обычное современное русское обозначение земной сферы, противопоставленной небесам.
- source_word: ወአግሀደ
  choice: и открыл
  rationale: Передаёт разглашение того, что прежде было сокрыто.
- source_word: ኅቡኣተ ዓለም
  choice: тайны мира
  rationale: Естественная русская передача буквально «сокрытого мира». Слово ዓለም допускает значения «мир», «век» и «вечность», поэтому иной смысл отмечен в сноске.
- source_word: እለ ይትገበሩ በሰማያት
  choice: совершаемые на небесах
  rationale: Причастная конструкция сохраняет пассивный смысл небесных действий или установлений и множественное «небеса» апокалиптического языка.
- source_word: አመረ ሰብእ
  choice: о которых узнали люди
  rationale: Передаёт засвидетельствованный эфиопский глагол «знать/узнать» без отсутствующего в нём значения старания или стремления.
theological_decisions:
- issue: Широта значения ዓመፃ
  choice: всякому беззаконию
  alternative: всякой неправедности; всякой несправедливости
  rationale: «Беззаконие» сохраняет широкий нравственный и богословский смысл обвинения, не сводя его только к насилию или общественной несправедливости.
- issue: Характер небесных тайн
  choice: тайны мира, совершаемые на небесах
  alternative: тайны вечности; тайны века
  rationale: Формулировка сохраняет напряжение между земным миром и небесной сферой и не вводит позднейших доктринальных категорий.
- issue: Заключительная фраза
  choice: о которых узнали люди
  alternative: которые люди знали; которые люди стремились узнать
  rationale: 'Основной текст следует непосредственно эфиопскому свидетельству: አመረ выражает знание или узнавание, но не стремление. Более свободное «стремились узнать» не принято в текст.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис сделан ясным для обычного читателя; «на небесах» сохраняет традиционный космологический регистр. Имя передано как «Азазел» в соответствии с принятой русской формой.
