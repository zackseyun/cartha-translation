lexical_decisions:
- source_word: ወይቤሉ በበይናቲሆሙ
  choice: И сказали они друг другу
  rationale: Передаёт повествовательный глагол и взаимное действие естественным для современного русского языка оборотом.
- source_word: ቃለ ጽራኃቲሆሙ
  choice: голос их воплей
  rationale: Сохраняет образ слышимого голоса и множественно-собирательный характер криков пострадавших.
- source_word: ዐረቀ
  choice: поднялся
  rationale: По контексту и грамматическому согласованию передаёт восхождение голоса; форма в транскрипции, вероятно, отражает искажённое ዐርገ.
- source_word: ጸርሐት ምድር
  choice: земля возопила
  rationale: ጸርሐት является глагольной формой женского рода, согласованной с ምድር; перевод сохраняет олицетворение земли и отдельное второе действие.
- source_word: እስከ አንቀጸ ሰማይ
  choice: до врат небесных
  rationale: Сохраняет конкретный апокалиптический пространственный образ, оставаясь понятным и достойным по стилю.
theological_decisions:
- issue: 'Кто взывает: пострадавшие люди или сама земля?'
  choice: 'Сохранены два параллельных образа: поднимается голос человеческих воплей, а земля сама вопиёт.'
  alternative: Понять всю фразу как одно высказывание лишь о вопле пострадавших, достигшем небес.
  rationale: Последовательность эфиопского текста содержит два глагола и два грамматических субъекта. Такое прочтение не устраняет напряжение между человеческим воплем и олицетворённой землёй, свидетельствующей о насилии.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Возопила» сохраняет торжественное олицетворение, а «врата небесные» — апокалиптическую образность без чрезмерной архаизации.
