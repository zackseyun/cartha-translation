base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/009.yaml
  text: and the women have borne giants[b][a], and by this the whole earth has been filled with blood.
translation:
  language: ru
  text: Женщины же родили исполинов[a][b], и от этого вся земля наполнилась кровью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Речь, по всей видимости, идёт об исполинском потомстве от запретных союзов со Стражами, описанных в ближайшем контексте; сам текст выражает это предельно кратко.
    reason: cross_reference
  - marker: b
    text: 'Возможный перевод начала: «А женщины родили исполинов».'
    reason: translation_alternative
lexical_decisions:
- source_word: አንስትሰ
  choice: женщины же
  rationale: Существительное обозначает женщин, а частица -ሰ придаёт теме выделение и поддерживает отсылку к женщинам из ближайшего контекста; слово «жёны» необоснованно уточняло бы брачный статус.
- source_word: ወለዳ
  choice: родили
  rationale: Естественно и прямо передаёт значение рождения; русское прошедшее время уместно выражает совершившийся результат.
- source_word: ረዓይተ
  choice: исполинов
  rationale: В контексте рассказа о Стражах речь идёт об их необычайном потомстве; «исполины» сохраняет традиционный апокалиптический смысл и достоинство регистра.
- source_word: በዘ
  choice: от этого
  rationale: Кратко сохраняет причинно-следственную или результативную связь, не разворачивая её в пояснительный пересказ.
- source_word: መልአት
  choice: наполнилась
  rationale: Передаёт завершённое наполнение и его наличный результат без неестественной для русского пассивной конструкции.
- source_word: ኵላ ምድር
  choice: вся земля
  rationale: Естественное русское соответствие выражению «вся/целая земля»; широкий контекст поддерживает всемирный, а не локальный смысл.
- source_word: ደመ
  choice: кровью
  rationale: Буквально сохраняет резкий образ крови; вариант «кровопролитием» был бы истолковывающим уточнением.
theological_decisions:
- issue: Насколько явно выражать причинную связь между рождением исполинов и наполнением земли кровью
  choice: и от этого вся земля наполнилась кровью
  alternative: и потому вся земля наполнилась кровью
  rationale: Формулировка сохраняет сжатую причинно-результативную связь исходного текста, но не усиливает её до однозначного богословского объяснения.
- issue: Как обозначить потомство женщин и Стражей
  choice: исполинов
  alternative: потомков
  rationale: Контекст и традиционное значение слова поддерживают «исполинов»; более общее «потомков» ослабило бы особый характер названных существ.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным ритмом. «Женщины же» передаёт тематическое выделение и связь с предшествующим контекстом; «исполины» сохраняет традиционную апокалиптическую лексику без конфессионального уточнения.
