base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/001.yaml
  text: And then Michael[a], Uriel, Raphael, and Gabriel looked down from heaven and saw much blood being poured out upon the earth[b], and all the lawlessness being done upon the earth.
translation:
  language: ru
  text: И тогда Михаил, Уриил, Рафаил и Гавриил посмотрели с неба вниз и увидели много крови, изливающейся на землю[a], и всё беззаконие, совершаемое на земле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проливается». Эфиопский глагол допускает разные толкования; некоторые связывают его также с образом крови, взывающей с земли. В основном тексте сохранён непосредственный образ крови, изливающейся на землю.'
    reason: lexical_alternative
  - marker: b
    text: 'В источнике указание на землю повторено: кровь изливается «на землю», и беззаконие совершается «на земле». Повтор подчёркивает земную область как место насилия и беззакония.'
    reason: literary_emphasis
lexical_decisions:
- source_word: እሜሃ
  choice: тогда
  rationale: Естественный русский временной переход, сохраняющий последовательность повествования.
- source_word: ሐወጹ ... እምሰማይ
  choice: посмотрели с неба вниз
  rationale: Передаёт направленный сверху взгляд небесных существ и сохраняет вертикальную перспективу видения.
- source_word: ወርእዩ
  choice: увидели
  rationale: Простой повествовательный глагол в современном литературном русском языке.
- source_word: ብዙሐ ደመ
  choice: много крови
  rationale: Сохраняет конкретный и резкий образ источника, не заменяя его отвлечённым словом «кровопролитие».
- source_word: ዘይትከዓው
  choice: изливается
  rationale: Соответствует образу крови, льющейся на землю; возможный вариант «проливается» указан в примечании, а менее вероятная связь с воплем крови не внесена в основной текст.
- source_word: በዲበ ምድር
  choice: на землю / на земле
  rationale: Дважды передаёт повторённое в источнике указание на землю, с естественным для русского языка падежным различием при глаголах движения и действия.
- source_word: ኵሎ ዓመፃ
  choice: всякое беззаконие
  rationale: Передаёт широкий нравственно-правовой смысл проступка и зла, не сужая его до одной лишь физической жестокости.
- source_word: ዘይትገበር
  choice: совершается
  rationale: Сохраняет пассивно-неопределённый и продолжающийся характер действия, выраженный относительной глагольной формой.
theological_decisions:
- issue: Передача имён ангелов
  choice: Михаил, Уриил, Рафаил и Гавриил
  alternative: Микаэл, Уриэль, Рафаэль и Габриэль
  rationale: Выбраны укоренившиеся русские формы имён, естественные для современной литературной и библейской речи; они не добавляют конфессионального толкования.
- issue: Конкретный образ крови или отвлечённое обозначение насилия
  choice: изливается много крови
  alternative: совершается великое кровопролитие
  rationale: Конкретный образ источника сохраняет напряжённость апокалиптического видения и не сводит её к поясняющему обобщению.
- issue: Неясность глагола при слове «кровь»
  choice: изливается
  alternative: проливается; взывает
  rationale: Основное значение в данном синтаксическом окружении связано с излиянием крови на землю, однако подлинная лексическая неясность отражена в примечании, а не устранена молча.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным звучанием. Синтаксис сделан прозрачным для широкого читателя; повтор «на землю / на земле» намеренно сохранён, а имена даны в привычных русских формах.
