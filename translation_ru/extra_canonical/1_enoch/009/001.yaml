- from: И тогда Михаил, Уриил, Рафаил и Гавриил посмотрели с неба вниз и увидели, как на землю изливается много крови[a] и как на земле совершается всякое беззаконие[b].
  to: И тогда Михаил, Уриил, Рафаил и Гавриил посмотрели с неба вниз и увидели много крови, изливающейся на землю[a], и всё беззаконие, совершаемое на земле[b].
  rationale: Правка уточняет значение «всего» беззакония, выравнивает русский синтаксис с двумя параллельными объектами глагола «увидели» и сохраняет все смысловые элементы, повтор локатива и отмеченную в сноске лексическую неопределённость.
