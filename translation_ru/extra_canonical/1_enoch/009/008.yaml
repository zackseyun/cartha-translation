revisions:
- from: И они пошли к дочерям человеческим на земле и легли с ними — с этими женщинами[a], — и осквернили себя, и открыли им всякий грех.
  to: И они пошли к дочерям человеческим на земле, и легли с ними, с этими женщинами[a], и осквернили себя, и открыли им все грехи.
  rationale: Исправлены только естественность русской сочетаемости и пунктуационное оформление. Множественное «все грехи» — нормальный русский способ передать собирательное «всякий/каждый грех» без сужения смысла. Сноска сохранена на том же словосочетании и не меняет смысла текста.
