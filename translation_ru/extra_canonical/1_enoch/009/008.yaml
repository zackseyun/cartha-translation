base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/008.yaml
  text: And they went to the daughters of men on the earth[a], and they lay with them, with those women[c][b], and they defiled themselves and revealed to them every sin.
translation:
  language: ru
  text: И они пошли к дочерям человеческим на земле, и легли с ними, с этими женщинами[a], и осквернили себя, и открыли им все грехи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с этими жёнами».'
    reason: Слово አንስት может обозначать как женщин, так и жён; контекст не требует однозначно брачного смысла.
lexical_decisions:
- source_word: ወሖሩ
  choice: и они пошли к
  rationale: Передаёт обычное значение глагола движения; сексуальный смысл ясно выражен следующим оборотом, поэтому здесь не требуется усиливать его добавлением «вошли к».
- source_word: አዋልደ ሰብእ
  choice: дочерям человеческим
  rationale: Традиционный и понятный русский оборот, сохраняющий противопоставление земных женщин небесным существам.
- source_word: በዲበ ምድር
  choice: на земле
  rationale: Кратко и буквально сохраняет пространственное указание и космический контраст повествования.
- source_word: ወስከቡ ምስሌሆን
  choice: и легли с ними
  rationale: Достойный и недвусмысленный русский эквивалент библейского обозначения половой связи.
- source_word: ምስለ እልኩ አንስት
  choice: с этими женщинами
  rationale: Сохраняет присутствующее в источнике пояснительное повторение; тире делает его естественнее по-русски. Возможное значение «жёнами» отмечено в сноске.
- source_word: ወረኵሱ
  choice: и осквернили себя
  rationale: Сохраняет возвратный смысл, а также нравственные и ритуальные оттенки осквернения.
- source_word: ወአግሀዱ ሎን
  choice: и открыли им
  rationale: Передаёт значение раскрытия или обнаружения и согласуется с темой сообщения запретного знания, не сужая глагол до формального обучения.
- source_word: ኵሎ ኃጢአተ
  choice: всякий грех
  rationale: Сохраняет собирательную форму и всеохватный характер обвинения.
theological_decisions:
- issue: Характер внесённого Стражами развращения
  choice: Стих говорит и о запретной половой связи, и о раскрытии людям греха.
  alternative: Последняя фраза может пониматься уже — как указание только на магические или тайные искусства.
  rationale: Эфиопский текст прямо соединяет связь с женщинами, самоосквернение и раскрытие «всякого греха»; перевод сохраняет эту широту и не ограничивает смысл одной разновидностью запретного знания.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксическое повторение источника сохранено как пояснительное присоединение через тире; архаизмы и конфессионально окрашенные уточнения не добавлены.
