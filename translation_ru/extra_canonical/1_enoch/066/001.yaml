base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/066/001.yaml
  text: And after this he showed me the angels of punishment[c][b][a], who are prepared to come and release all the power of the waters.
translation:
  language: ru
  text: И после этого он показал мне ангелов наказания, готовых[a] прийти и высвободить[b][c] всю силу вод.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Форма геэзского слова трудна; возможно также: «приготовленных» или «находящихся наготове».'
    reason: lexical_alternative
  - marker: b
    text: Буквально глагол может означать «открыть» или «развязать»; здесь, вероятно, имеется в виду дать полной силе вод вырваться наружу.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «открыть всю силу вод».'
    reason: previous_rendering
lexical_decisions:
- source_word: እምድኅረ ዝ
  choice: после этого
  rationale: Естественно передаёт обычную временную формулу, сохраняя последовательность видений.
- source_word: አርአየኒ
  choice: он показал мне
  rationale: Сохраняет зрительный характер сообщения и каузативный смысл глагола без ненужного расширения.
- source_word: መላእክተ መቅሠፍት
  choice: ангелов наказания
  rationale: Сохраняет генитивную конструкцию и судебно-апокалиптический оттенок; «наказание» понятно современному читателю и не сужает смысл до телесного бичевания.
- source_word: እለ ይልዋን
  choice: готовых
  rationale: Передаёт значение готовности или подготовленности; краткая форма естественно согласуется с последующими инфинитивами. Трудность формы отмечена в сноске.
- source_word: ከመ ይምጽኡ
  choice: прийти
  rationale: Естественно выражает целевое значение после указания на готовность.
- source_word: ወይፍትሑ
  choice: и высвободить
  rationale: Глагол допускает значения «открыть», «развязать», «выпустить»; при объекте «сила вод» русское «высвободить» передаёт образ приведения сдерживаемой силы в действие.
- source_word: ኵሎ ኀይለ ማይ
  choice: всю силу вод
  rationale: Сохраняет конкретный космический образ и полноту действия; множественное «вод» соответствует контексту потопных вод.
theological_decisions:
- issue: Природа совершающих наказание
  choice: сверхъестественные «ангелы наказания», которым предстоит высвободить силу вод
  alternative: человеческие посланники суда или ангелы лишь исправительного взыскания
  rationale: Непосредственный апокалиптический контекст и действие над космическими водами указывают на небесных исполнителей суда; перевод не смягчает наказание до одного лишь исправления.
- issue: Образ открытия или высвобождения силы вод
  choice: высвободить всю силу вод
  alternative: открыть всю силу вод
  rationale: Основной текст даёт естественное русское сочетание, не устраняя исходный образ открытия; более буквальная возможность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным повествовательным ритмом. Апокалиптическая образность сохранена; неестественное по-русски сочетание «открыть силу» вынесено в сноску как более буквальная возможность.
