base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/003.yaml
  text: And I saw the places of the lights and of the thunder[a], in the extremities, in the depth, where there was a bow of fire, and arrows and their quiver, and a sword of fire[d][c][b], and all the lightnings.
translation:
  language: ru
  text: И увидел я места[a] светил и грома — на краях, в глубине, где находились огненный лук, стрелы и их колчан, огненный меч и все молнии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Места» можно также перевести как «хранилища». В оригинале «на краях» и «в глубине» — два отдельных пространственных указания; не уточняется, краями чего они являются.
    reason: lexical_alternative
lexical_decisions:
- source_word: መካናተ
  choice: места
  rationale: Основное значение — «места, обиталища». Хотя в апокалиптическом контексте возможны «хранилища», сам стих не выражает идею хранения однозначно, поэтому сохранён более нейтральный вариант.
- source_word: ብርሃናት
  choice: светила
  rationale: Множественное число обозначает источники или явления света; «светила» передаёт космический оттенок и не смешивает их с молниями, названными далее отдельно.
- source_word: ነጐድጓድ
  choice: гром
  rationale: Существительное обозначает гром как природное и космическое явление; форма единственного числа естественна по-русски.
- source_word: ውስተ አጽናፍ
  choice: на краях мира
  rationale: Буквально речь идёт о пределах или краях. Добавление «мира» естественно обозначает космические пределы, подразумеваемые видением.
- source_word: ኀበ ዕመቃ
  choice: в глубине
  rationale: Фраза передана отдельно от предшествующего указания на края, чтобы не сливать две пространственные характеристики источника.
- source_word: ቀሥተ እሳት
  choice: огненный лук
  rationale: Буквально «лук огня»; русский эквивалент сохраняет оружейный, а не атмосферный образ.
- source_word: ሐጾ
  choice: стрелы
  rationale: В сочетании с луком и колчаном слово естественно означает стрелы.
- source_word: ምጕንጻቲሆሙ
  choice: колчан для них
  rationale: Местоименный суффикс соотносит колчан со стрелами. «Для них» звучит по-русски яснее, чем буквальное «их колчан».
- source_word: ሰይፈ እሳት
  choice: огненный меч
  rationale: Сохраняет буквальный и выразительный апокалиптический образ «меча огня».
- source_word: መበርቅት ኵሉ
  choice: все молнии
  rationale: Передаёт множественное число и идею совокупности всех молний.
theological_decisions:
- issue: Характер мест космических явлений
  choice: нейтральное «места»
  alternative: «хранилища» космических явлений
  rationale: «Хранилища» соответствует апокалиптической картине небесных запасов, но лексема допускает более широкое значение «места». Нейтральный перевод не превращает возможный подтекст в однозначное утверждение.
- issue: Образ небесного оружия
  choice: сохранить буквальную последовательность лука, стрел, колчана и меча
  alternative: истолковать перечисление как обобщённое описание грозовых явлений
  rationale: Источник намеренно использует оружейные образы; их следует сохранить без рационализирующего пересказа.
translation_notes:
  register: Современный литературный русский с сохранением возвышенной повествовательной формулы «И увидел я» и конкретной апокалиптической образности. Тире разграничивает увиденные места и последующие указания на их расположение.
