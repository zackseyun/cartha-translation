base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/001.yaml
  text: And they took me into a place where those who were there were like burning fire[a], and whenever they wished, they appeared like men.
translation:
  language: ru
  text: И они взяли меня в одно место, где те, кто там находился, были подобны пылающему огню, и всякий раз, когда хотели, являлись в человеческом облике.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «показывались как люди». Глагол может означать, что они делали себя видимыми в человеческом облике.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወነሥኡኒ
  choice: и они взяли меня
  rationale: Глагол обозначает взятие или перенесение; «взяли меня» сохраняет образ перемещения в видении, не уточняя его способ.
- source_word: ውስተ አሐዱ መካን
  choice: в одно место
  rationale: Буквально «в одно место». Такая передача сохраняет слегка необычный, визионерский строй оригинала, оставаясь понятной по-русски.
- source_word: ኀበ እለ ሀለዉ ህየ
  choice: где находившиеся там
  rationale: Передаёт указание на обитателей этого места без добавочного определения их природы.
- source_word: ከመ እሳት ዘይነድድ
  choice: были подобны пылающему огню
  rationale: Сохраняет явное сравнение и интенсивный образ огня, который горит.
- source_word: ወሶበ ይፈቅዱ
  choice: а когда желали
  rationale: Передаёт временно-условный смысл и волеизъявление; форма допускает как конкретное «когда», так и повторительное «всякий раз, когда».
- source_word: ያስተርእዩ
  choice: являлись
  rationale: Естественно передаёт значение видимого проявления, не исключая каузативно-возвратного оттенка «показывались».
- source_word: ከመ ሰብእ
  choice: как люди
  rationale: Прямо передаёт сравнение с человеческим обликом и сохраняет контраст с огненным видом.
theological_decisions:
- issue: Кем были огненные существа
  choice: Описать их как «находившихся там», не называя ангелами
  alternative: ангелы; духи; стражи
  rationale: Сам стих описывает их внешний вид, но прямо не определяет их класс; нейтральная передача не снимает богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Сохранены образность и слегка необычный строй видения; природа существ не конкретизирована.
