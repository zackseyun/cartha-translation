revisions:
- from: И они взяли меня в одно место, где находившиеся там были подобны пылающему огню, а когда желали, являлись как люди.[a]
  to: И они взяли меня в одно место, где те, кто там находился, были подобны пылающему огню, и всякий раз, когда хотели, являлись в человеческом облике.[a]
