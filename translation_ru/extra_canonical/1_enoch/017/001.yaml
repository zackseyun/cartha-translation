  - severity: low
    issue: Формулировка о человеческом виде допускает стилистическую двусмысленность.
    rationale: «Являлись как люди» может восприниматься как простое сопоставление; «являлись в человеческом облике» естественнее передаёт проявление в человеческой форме и соответствует примечанию.
