base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/002.yaml
  text: And they took me to a place of whirlwind[b][a], and to a mountain whose summit reached to heaven.
translation:
  language: ru
  text: И они привели меня к месту вихря[a] и к горе, вершина которой достигала неба.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к месту бури»; возможно также: «к месту урагана».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወወሰዱኒ
  choice: и они привели меня
  rationale: Глагол допускает значения «взяли», «повели» и «привели». В контексте перемещения к названным местам «привели меня» звучит естественно и не предполагает, что Еноха несли.
- source_word: መካን
  choice: место
  rationale: Широкое пространственное обозначение; «место» прозрачно передаёт смысл без лишней конкретизации.
- source_word: ዘዐውሎ
  choice: вихря
  rationale: Слово обозначает бурное атмосферное явление. «Вихрь» сохраняет яркость апокалиптического образа; возможные варианты отмечены в сноске.
- source_word: ደብር
  choice: гора
  rationale: Наиболее ясное и естественное обозначение горы в контексте визионерской топографии.
- source_word: ዘክተማ ርእሱ
  choice: вершина которой
  rationale: Буквально говорится о «голове/верхе» горы; «вершина» идиоматично передаёт этот образ по-русски.
- source_word: ይበጽሕ እስከ ሰማይ
  choice: достигала неба
  rationale: Передаёт протяжённость до неба и сохраняет вертикальный космический образ исходного текста.
theological_decisions:
- issue: Значение ሰማይ в контексте апокалиптического восхождения
  choice: небо
  alternative: небосвод
  rationale: 'Русское «небо» сохраняет намеренную широту значения: оно может обозначать и видимое небо, и небесную область, не навязывая более поздней догматической конкретизации.'
- issue: Направительное значение ውስተ перед словом «гора»
  choice: к горе
  alternative: в гору
  rationale: Предлог при глаголе движения допускает направление «к» или «в». «К горе» естественно описывает приближение и не создаёт ненужного впечатления входа внутрь горы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис сохраняет параллельность двух пунктов назначения, но избегает неестественного русского выражения «в гору» в значении приближения к горе.
