base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/004.yaml
  text: And they took me as far as the living waters[a], and as far as the fire of the west[c][b], which receives every setting of the sun.
translation:
  language: ru
  text: И они взяли меня и привели к живым водам[a] и к огню запада[b], который принимает каждый заход солнца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: После слов «живые воды» в данном эфиопском тексте стоит заключённое в скобки сомнительное слово, которое может означать «которые говорят»; возможно, это испорченное чтение. В основной текст оно не включено. Выражение «живые воды» может также подразумевать воды, дающие жизнь.
    reason: textual_variant
  - marker: b
    text: 'Или: «огню заката». Эфиопское слово может обозначать запад как область захода солнца либо сам закат.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወነሥኡኒ
  choice: и они перенесли меня
  rationale: Форма от ነሥአ может означать «взять», «нести» или «перенести». В описании сверхъестественного путешествия «перенесли меня» естественно передаёт направляемое движение, не уточняя его способ чрезмерно.
- source_word: እስከ
  choice: к … и к
  rationale: Повторённый предлог обозначает достижение последовательных мест. Русское «к» звучит естественно и сохраняет направленность движения.
- source_word: ማያት ሕያዋን
  choice: живым водам
  rationale: Это сочетание существительного с прилагательным, буквально «воды живые», а не генитивное «воды жизни». Выбранный вариант сохраняет грамматику и допускает как образ действительно живых, так и животворящих вод.
- source_word: '[ዘይትናገር]'
  choice: не включено в основной текст
  rationale: Слово в источнике заключено в скобки и текстуально сомнительно; возможное значение «которые говорят» плохо согласуется с контекстом. Неопределённость отражена в сноске, а не устранена догадочным переводом.
- source_word: እሳት ዐረብ
  choice: огню запада
  rationale: Сочетание передаёт конкретный космографический образ западного огня. Вариант «огонь запада» сохраняет необычность видения и возможную связь запада с заходом солнца.
- source_word: ዘውእቱ ይነሥእ ኵሎ ዕርበተ ፀሐይ
  choice: который принимает в себя каждый заход солнца
  rationale: Относительное предложение изображает западный огонь принимающим солнце при его захождении. «Принимает в себя» ясно и образно передаёт значение глагола, а «каждый заход солнца» сохраняет повторность, выраженную ኵሎ.
theological_decisions:
- issue: Космические образы в путешествии Еноха
  choice: Сохранить «живые воды» и «огонь запада» как конкретные места видения
  alternative: Истолковать эти выражения символически либо заменить их обычными природными явлениями
  rationale: Текст представляет раскрываемую тайновидцу космографию. Перевод не должен заранее превращать её в аллегорию или сглаживать необычные образы.
- issue: Смысл выражения «живые воды»
  choice: Сохранить смысловую открытость выражения
  alternative: Однозначно передать как «воды жизни» или «животворящие воды»
  rationale: Эфиопское сочетание грамматически означает «живые воды», но в контексте может подразумевать воды, наделённые жизнью или дающие жизнь. Основной текст не разрешает эту неоднозначность искусственно.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но ясным повествовательным тоном. Необычная апокалиптическая космография сохранена без архаизации и без конфессионального истолкования.
