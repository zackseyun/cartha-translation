  text: And I came to a river of fire[a], whose fire flowed like water, and it emptied into the great sea toward the west.
translation:
  language: ru
  text: И пришёл я к огненной реке, огонь которой тёк, словно вода, и изливался в великое море к западу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в направлении ʿараб». Здесь выражение передано как «к западу», поскольку оно может обозначать западную сторону; возможно также географическое указание, например на Аравию.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መጻእኩ
  choice: пришёл я
  rationale: Простая форма движения от первого лица в повествовании о путешествии; инверсия сохраняет достоинство и ритм визионерского рассказа.
- source_word: ፈለገ እሳት
  choice: огненная река
  rationale: Передаёт буквальный образ реки огня естественным русским словосочетанием, не превращая его в метафору.
- source_word: ዘይውሕዝ እሳቱ ከመ ማይ
  choice: огонь которой тёк, словно вода
  rationale: Сохраняет относительную конструкцию, принадлежность огня реке и парадоксальное прямое сравнение с водой.
- source_word: ይትከዐው
  choice: изливался в
  rationale: Глагол обозначает излияние или впадение в более крупный водоём; «изливался» подходит одновременно огню и речному потоку.
- source_word: ባሕር ዐቢይ
  choice: великое море
  rationale: Формально и естественно передаёт устойчивое географическое выражение и сохраняет возвышенный регистр.
- source_word: መንገለ ዐረብ
  choice: к западу
  rationale: Выражение может обозначать западное направление; географическое прочтение «к Аравии» остаётся возможным и отмечено в сноске.
theological_decisions:
- issue: Следует ли истолковывать огненную реку как символ или передавать её как увиденную реальность визионерской географии
  choice: 'Сохранить буквальное описание видения: «огненная река, огонь которой тёк, словно вода».'
  alternative: Передать образ как метафору суда.
  rationale: Текст описывает невозможный космический ландшафт как непосредственно увиденный; перевод не должен демифологизировать или богословски разрешать этот образ.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным ритмом. Необычный апокалиптический образ сохранён без поясняющих добавлений; неоднозначность последнего выражения вынесена в сноску.
