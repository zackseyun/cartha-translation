base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/006.yaml
  text: And I saw great rivers[a], and I reached as far as the great darkness[c][b], and I went to where no flesh walks.
translation:
  language: ru
  text: И увидел я великие реки, и достиг великой тьмы, и пошёл туда, где не ходит никакая плоть[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В данной транскрипции эфиопского текста начало последнего глагола распознано неуверенно. Вероятное чтение — ኢያንሶሱ, «не ходит»; отрицание подтверждается греческим текстом: «где всякая плоть не ходит».'
    reason: textual_variant
  - marker: b
    text: «Плоть» — традиционное семитское обозначение, которое может относиться ко всему человечеству или, шире, ко всем живым существам.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: и увидел я
  rationale: Обычный глагол зрительного восприятия в повествовании о видении; инверсия сохраняет торжественный, но понятный библейский ритм.
- source_word: ዐበይተ አፍላገ
  choice: великие реки
  rationale: Передаёт масштаб космической географии и сохраняет повтор ключевого определения «великий».
- source_word: ወእስከ ዐቢይ ጽልመት በጻሕኩ
  choice: и достиг великой тьмы
  rationale: እስከ обозначает предел пути, а በጻሕኩ — достижение места; по-русски направление естественно выражается управлением глагола «достиг».
- source_word: ወሖርኩ ኀበ
  choice: и пошёл туда, где
  rationale: Сохраняет последовательность действий и вводит придаточное места естественным современным русским оборотом.
- source_word: ኵሉ ሥጋ
  choice: никакая плоть
  rationale: В сочетании с отрицательным глаголом передаёт смысл «ни одно существо из плоти», не сужая выражение исключительно до людей.
- source_word: 'ኢያንሶሱ (исправление OCR: (አ)ያንሶሱ)'
  choice: не ходит
  rationale: Отрицательная форма, подтверждаемая греческим свидетелем ὅπου πᾶσα σὰρξ οὐ περιπατεῖ; буквальный глагол движения уместен для описания недоступной области.
theological_decisions:
- issue: Охват выражения «всякая плоть» при отрицательном сказуемом
  choice: никакая плоть
  alternative: ни один человек; ни одно живое существо
  rationale: Формулировка сохраняет традиционную семитскую образность и допускает как широкое обозначение смертных существ, так и преимущественное указание на человечество, не разрешая неоднозначность догматически.
- issue: Наличие отрицания в последней фразе
  choice: не ходит
  alternative: бродит; странствует
  rationale: Чтение с отрицанием восстанавливает вероятную эфиопскую форму ኢያንሶሱ и согласуется с греческим οὐ περιπατεῖ; отсутствие отрицания полностью меняло бы смысл описания.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Повтор союзов сохраняет последовательную манеру рассказа о видении; архаизмы и конфессионально окрашенные истолкования исключены.
