lexical_decisions:
- source_word: ወርኢኩ
  choice: И я увидел
  rationale: Сочетание союза с глаголом первого лица продолжает повествование о видении; «увидел» естественно и точно передаёт простой смысл.
- source_word: አድባረ
  choice: горы
  rationale: Эфиопское слово обозначает горы во множественном числе и сохраняет конкретный образ апокалиптического ландшафта.
- source_word: ጽልመተ፡ ክረምት
  choice: зимней тьмы
  rationale: Передаёт зависимость существительных без искусственного устранения необычного и допускающего разные толкования образа.
- source_word: ወኀበ፡ ይውሕዝ፡ ኵሉ፡ ማያተ፡ ቀላይ
  choice: и место, куда стекаются все воды бездны
  rationale: «Куда стекаются» естественно выражает направленное движение вод; «бездна» сохраняет космологический образ источника или вместилища глубинных вод.
