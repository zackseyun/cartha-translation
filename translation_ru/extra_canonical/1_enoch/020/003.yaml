lexical_decisions:
- source_word: ሩፋኤል
  choice: Рафаил
  rationale: Традиционная русская форма имени; имя транслитерируется, а не переводится.
- source_word: ፩እምነ
  choice: один из
  rationale: Числительное с партитивным предлогом обозначает принадлежность к группе; русское «один из» точно и естественно передаёт этот смысл.
- source_word: ቅዱሳን፡ መላእክት
  choice: святых ангелов
  rationale: Прямое и устоявшееся обозначение освящённых небесных существ, сохраняющее апокалиптический регистр.
- source_word: ዘ
  choice: поставленный
  rationale: Относительная конструкция вводит сферу ведения Рафаила; причастный оборот естественно связывает её с предшествующим перечислением.
- source_word: መናፍስተ
  choice: духами
  rationale: «Духи» — наиболее прямой эквивалент; «души» сильнее сужало бы антропологический смысл.
- source_word: ሰብእ
  choice: людей
  rationale: Слово имеет собирательное значение и обозначает человеческих существ вообще, а не только мужчин.
- source_word: ዘመናፍስተ፡ ሰብእ
  choice: поставленный над духами людей
  rationale: Передаёт сферу власти или попечения, сохраняя краткость перечня и не уточняя характер этого надзора сверх сказанного в источнике.
theological_decisions:
- issue: Сфера ведения Рафаила
  choice: Рафаил поставлен над духами людей.
  alternative: Рафаил поставлен над душами умерших либо над внутренней жизнью человечества.
  rationale: Геэзский текст говорит лишь о «духах людей» и не уточняет, идёт ли речь об умерших или об исцелении. Более широкая формулировка сохраняет неопределённость источника и не привносит позднейших толкований.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным регистром ангельского перечня. «Людей» употреблено в собирательном, гендерно-нейтральном смысле; формулировка не уточняет состояние или природу упомянутых духов.
