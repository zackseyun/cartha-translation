base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/004.yaml
  text: Raguel[a], one of the holy angels[b], who takes vengeance on the world and on the luminaries.
translation:
  language: ru
  text: Рагуил, один из святых ангелов, который совершает возмездие над миром и небесными светилами[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Небесные светила» — солнце, луна и звёзды как небесные тела в картине мира этой книги.
    reason: cultural_note
lexical_decisions:
- source_word: ራጉኤል
  choice: Рагуил
  rationale: Имя передано в принятой русской библейской форме, а не переведено по значению.
- source_word: ፩እምነ
  choice: один из
  rationale: 'Естественно передаёт партитивный смысл: принадлежность к группе ангелов.'
- source_word: መላእክት ቅዱሳን
  choice: святых ангелов
  rationale: Прямое и привычное для русской библейской речи обозначение, сохраняющее определение «святые».
- source_word: ዘይትቤቀሎ
  choice: который совершает возмездие
  rationale: Передаёт судебно-карательный смысл глагола, не смягчая его до общего «надзирает» и не приписывая ангелу личную мстительность.
- source_word: ለዓለም
  choice: над миром
  rationale: В данном космическом контексте «мир» лучше сохраняет широкий объём значения; «земля» остаётся возможным вариантом.
- source_word: ለብርሃናት
  choice: над небесными светилами
  rationale: Контекст перечня ангельских полномочий указывает на небесные источники света; уточнение «небесными» делает образ понятным современному читателю.
theological_decisions:
- issue: Объём карательного служения Рагуила
  choice: Рагуил совершает возмездие и над миром, и над небесными светилами.
  alternative: Рагуил лишь надзирает за порядком мира и светил либо карает за проступки, связанные со светилами.
  rationale: Эфиопский синтаксис естественнее всего представляет мир и светила как два однородных объекта одного глагола с судебно-карательным значением. Резкая апокалиптическая формулировка сохранена без догматического переосмысления.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Формула «совершает возмездие» сохраняет судебный характер действия и звучит менее лично-мстительно, чем «мстит».
