base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/006.yaml
  text: Saraqael[a], one of the holy angels[b], who is over the spirits of the children of men who sin.
translation:
  language: ru
  text: Саракаил[a], один из святых ангелов, поставленный над духами сынов человеческих, которые грешат.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя также передают как «Саракаэл» или «Сариил». В середине эфиопской OCR-транскрипции, по-видимому, есть ошибка распознавания; принятое восстановление даёт выражение «сыны человеческие».
    reason: textual_variant
lexical_decisions:
- source_word: ሰራቃኤል
  choice: Саракаил
  rationale: Имя передано транслитерацией с геэзской формы; вариант «Саракаил» сохраняет её основные согласные и традиционное окончание ангельских имён.
- source_word: ፩እምነ
  choice: один из
  rationale: Естественно передаёт стандартное партитивное выражение и указывает на принадлежность к более широкой группе.
- source_word: መላእክት፡ ቅዱሳን
  choice: святых ангелов
  rationale: Сохраняет устойчивое апокалиптическое обозначение ангелов, посвящённых Божьему служению.
- source_word: ዘዲበ
  choice: поставленный над
  rationale: Передаёт не только положение «над», но и подразумеваемое поручение или надзор; русская конструкция остаётся краткой и естественной.
- source_word: መናፍስት
  choice: духами
  rationale: Сохраняет явно выраженное множественное число и зависимость от выражения власти или надзора.
- source_word: '[እስለ፡ እመሕያው፡]'
  choice: сынов человеческих
  rationale: Первая форма, вероятно, является ошибочным распознаванием እጓለ; вместе с хорошо сохранившимся እመሕያው это составляет обычное геэзское выражение «сыны человеческие», то есть люди.
- source_word: ዘመናፍስት፡ ያኃጥኡ
  choice: которые грешат
  rationale: Причастно-относительная конструкция передаёт греховное действие без добавления не засвидетельствованного оборота «в духе».
theological_decisions:
- issue: К кому относится определение «которые грешат»
  choice: к сынам человеческим
  alternative: 'к духам: «духами сынов человеческих, согрешающих»'
  rationale: Грамматика допускает некоторую неясность из-за цепочки зависимых форм, однако традиционно восстанавливаемое чтение и параллельное греческое свидетельство поддерживают понимание «духи тех людей, которые грешат». Формулировка не уточняет ни посмертное состояние этих духов, ни характер надзора Саракаила.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического перечня. Причастие «поставленный» делает фразу естественной по-русски и сохраняет смысл порученного надзора. Архаизирующее выражение «сыны человеческие» оставлено как узнаваемый библейский оборот; маркер [a] присутствует в основном тексте.
