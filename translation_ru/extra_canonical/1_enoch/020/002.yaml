base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/002.yaml
  text: Uriel[a], one of the holy angels[b], who is over the world and over Tartarus.
translation:
  language: ru
  text: Уриил, один из святых ангелов, который поставлен над миром и над Тартаром[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Последнее выражение в сохранившемся текстовом свидетельстве трудно для истолкования. Возможно, имеется в виду Тартар — место заключения мятежных небесных существ, — либо, в более общем смысле, бездна.
    reason: textual_variant
lexical_decisions:
- source_word: ኡርኤል
  choice: Уриил
  rationale: Имя передано в принятой русской библейской форме, а не переведено.
- source_word: ፩እመላእክት ቅዱሳን
  choice: один из святых ангелов
  rationale: Числительное с предлогом выражает принадлежность к группе; «ангелы» соответствует апокалиптическому контексту, а «святые» сохраняет устойчивое обозначение небесных существ.
- source_word: እሰመ
  choice: который поставлен над
  rationale: Относительная конструкция сохраняет формулу перечня ангелов и передаёт порученную Уриилу сферу власти; слово «поставлен» естественно выражает назначенное попечение, не уточняя, кем оно поручено.
- source_word: ዘዓለም
  choice: мир
  rationale: В перечне космических сфер значение «мир» вероятнее возможных временных значений «век» или «вечность».
- source_word: ወዘተረዓድ
  choice: и над Тартаром
  rationale: Хотя форма текстуально трудна, конкретная область подземного заключения лучше соответствует перечню космических владений; неопределённость открыто отмечена в сноске.
theological_decisions:
- issue: Следует ли понимать вторую область власти Уриила как Тартар или более обобщённо как бездну
  choice: Тартар
  alternative: бездна; также буквально возможны значения, связанные с трепетом или ужасом
  rationale: Конкретная область подземного заключения согласуется с апокалиптической космологией и структурой перечня, но неуверенность текстового свидетельства не скрыта и вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем. Относительное придаточное сохраняет формульное построение перечня ангелов; повтор предлога «над» ясно разграничивает две сферы.
