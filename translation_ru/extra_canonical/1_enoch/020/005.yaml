  text: Mikael[a], one of the holy angels[b], who is set over the good of mankind and over the people.
translation:
  language: ru
  text: Михаил, один из святых ангелов, поставленный над благом человечества и над народом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Не вполне ясный оборот можно также понять как «поставленный над добрыми среди людей и над народом».
    reason: alternative_reading
lexical_decisions:
- source_word: ሚካኤል
  choice: Михаил
  rationale: Использована укоренившаяся в русском языке библейская форма имени, соответствующая эфиопскому ሚካኤል.
- source_word: ፩እምነ መላእክት ቅዱሳን
  choice: один из святых ангелов
  rationale: Оборот обозначает принадлежность к группе; «ангелы» точно передаёт контекст перечня небесных существ.
- source_word: እሰመ
  choice: поставленный над
  rationale: В данном перечне выражение указывает на порученную Михаилу область попечения или власти; пассивная форма «поставленный» передаёт назначение свыше.
- source_word: ሠናይቱ ለሰብእ
  choice: над благом человечества
  rationale: Передача сохраняет значение «благое/благо» и его отношение к людям, не сводя неясный оборот ни к нравственно добрым людям, ни к отдельной заповеди.
- source_word: ዲበ ሕዝብ
  choice: над народом
  rationale: Предлог ዲበ выражает положение или власть над чем-либо, а ሕዝብ означает народ или множество людей.
theological_decisions:
- issue: Область служения Михаила
  choice: Михаил поставлен над благом человечества и над народом.
  alternative: Михаил поставлен над добрыми среди людей и над народом.
  rationale: Сочетание слов после указания на назначение Михаила допускает понимание ሠናይቱ как отвлечённого «благо» либо как обозначение добрых людей. Основной текст следует наиболее вероятному смыслу, а подлинная неоднозначность отмечена в сноске.
- issue: Ошибочное чтение ትእዛዚ в предоставленной транскрипции
  choice: Не переводить как «повеление».
  alternative: «поставленный над благим повелением для людей»
  rationale: Сопоставление с более надёжным текстовым свидетельством и параллельной греческой формой показывает, что «повеление» возникло из-за ошибки распознавания; вводить это слово в перевод означало бы переводить фантомное чтение.
