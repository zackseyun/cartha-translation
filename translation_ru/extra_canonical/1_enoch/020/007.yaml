base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/007.yaml
  text: Gabriʾel[a], one of the holy angels, who is over Paradise and the serpents and the cherubim.
translation:
  language: ru
  text: Гавриил — один из святых ангелов, поставленный над Раем, змеевидными существами[a] и херувимами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфиопское слово в этом месте лексически неясно. Его традиционно связывают со змеями или змееподобными существами, однако точное значение остаётся неопределённым.
    reason: lexical_alternative
lexical_decisions:
- source_word: ገብርኤል
  choice: Гавриил
  rationale: Использована укоренившаяся в русской библейской традиции форма имени, соответствующая эфиопскому ገብርኤል.
- source_word: ፩እምነ
  choice: один из
  rationale: Сочетание прямо указывает на принадлежность к группе.
- source_word: መላእክት ቅዱሳን
  choice: святых ангелов
  rationale: Сохранено обычное для енохической литературы обозначение небесных существ и возвышенный апокалиптический регистр.
- source_word: ዘዲበ
  choice: поставленный над
  rationale: Передаёт не только пространственное отношение, но и вверенное попечение или власть; причастная конструкция естественна в русском перечне ангельских полномочий.
- source_word: ገነት
  choice: Раем
  rationale: В перечне небесных областей слово, вероятнее всего, обозначает райскую область, а не обычный сад; прописная буква отмечает собственное название сакрального места, не добавляя позднейших подробностей.
- source_word: አክይስት
  choice: змеевидными существами
  rationale: Эфиопское чтение лексически затруднительно. Выбор сохраняет традиционную связь со змеями, но не сводит возможных небесных или мифических существ к обычным животным.
- source_word: ኪሩቤን
  choice: херувимами
  rationale: Употреблена традиционная русская библейская форма названия этих небесных существ во множественном числе.
theological_decisions:
- issue: Следует ли понимать ገነት как обычный сад или как космическую сакральную область
  choice: Рай
  alternative: сад; Эдем
  rationale: Контекст перечня архангелов и вверенных им областей указывает на райскую область. «Рай» сохраняет апокалиптическую силу текста, не отождествляя её безоговорочно с конкретной позднейшей концепцией.
- issue: Как представить неясный референт አክይስት
  choice: змеевидные существа
  alternative: змеи
  rationale: Так сохраняется традиционное змееподобное понимание и одновременно не устраняется лексическая и онтологическая неопределённость исходного чтения.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным апокалиптическим звучанием. Тире облегчает восприятие элемента перечня; «поставленный над» естественно выражает вверенное ангелу попечение. Неясность спорного слова сохранена в основном тексте и пояснена сноской.
