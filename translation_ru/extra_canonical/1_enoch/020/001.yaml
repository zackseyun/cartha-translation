base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/001.yaml
  text: And these are the names of the holy angels who keep watch[a].
translation:
  language: ru
  text: И вот имена святых ангелов, которые бодрствуют[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол, переведённый как «бодрствуют», можно также понять как «бдят» или «несут стражу». В более широком контексте 1 Еноха эта лексика перекликается с образом небесных Стражей, но в самом стихе она служит описанием ангелов.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝንቱ
  choice: И вот
  rationale: Союз с указательным элементом вводит перечень или формулу представления; русское «И вот» естественно открывает последующий список.
- source_word: አስማቲሆሙ
  choice: имена
  rationale: Форма буквально означает «их имена», однако в русской вводной формуле принадлежность ясно выражена последующим определением «святых ангелов».
- source_word: ለእለ
  choice: которые
  rationale: Относительный показатель связывает «имена» с описанием ангелов; русское придаточное с «которые» передаёт эту связь ясно и естественно.
- source_word: ይተግሁ
  choice: бодрствуют
  rationale: Глагол обозначает бодрствование, бдительность или наблюдение. «Бодрствуют» сохраняет словесное описание и не превращает его без достаточных оснований в специальный титул «Стражи».
- source_word: ቅዱሳን
  choice: святых
  rationale: Обычное и уместное в возвышенном религиозном контексте соответствие прилагательному со значением святости.
- source_word: መላእክት
  choice: ангелов
  rationale: В апокалиптическом контексте речь идёт о небесных существах, поэтому «ангелы» точнее общего «вестники».
theological_decisions:
- issue: Следует ли передавать бодрствующих ангелов специальным термином «Стражи»
  choice: которые бодрствуют
  alternative: Стражей; бодрствующих
  rationale: В стихе употреблено словесное описание, а не бесспорно закреплённый титул. Выбранный вариант сохраняет связь с темой небесных стражей, не навязывая техническое наименование.
translation_notes:
  register: Современный литературный русский язык с краткой, достойной вводной формулой. Сохранено настоящее время и намеренно не использован технический титул «Стражи» в основном тексте.
