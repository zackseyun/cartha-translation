base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/016/001.yaml
  text: From the days of the slaughter and destruction and death of the giants[a], the spirits that have gone out from the souls of their flesh shall destroy without incurring judgment; thus they shall destroy until the day of the completion of the great judgment[d][c][b], when the great age shall be brought to its end.
translation:
  language: ru
  text: Со дней избиения, гибели и смерти исполинов[a] духи, вышедшие из душ их плоти[b], будут губить, не подвергаясь суду; так они будут губить до дня завершения великого суда, когда великий век достигнет своего конца[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начало стиха в сохранившемся геэзском свидетельстве текстуально затруднено. Смысл, по-видимому, таков: со времени избиения, гибели и смерти исполинов эти духи продолжают свою губительную деятельность.'
    reason: textual_variant
  - marker: b
    text: «Духи, вышедшие из душ их плоти» — намеренно буквальная передача необычного выражения. В ближайшем контексте, вероятно, имеются в виду бесплотные духи, связанные с потомством Стражей.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «когда завершится великий миропорядок». Геэзское слово может означать как «век», так и «мир».'
    reason: lexical_alternative
lexical_decisions:
- source_word: እመዋዕለ ቀትል ወሙስና ወሞተ ረዓይት
  choice: Со дней избиения, гибели и смерти исполинов
  rationale: Передаёт временную исходную точку и сохраняет трёхчленный ряд бедствий; ረዓይት по контексту и текстовым параллелям обозначает исполинов.
- source_word: ወፅአ መናፍስት እምነፍሳት ሥጋሆሙ
  choice: духи, вышедшие из душ их плоти
  rationale: Сохранена необычная генитивная конструкция источника, не сводимая без остатка ни к «телам», ни к «душам»; её трудность отмечена в сноске.
- source_word: ያማስን
  choice: губить
  rationale: Глагол описывает продолжительное разрушительное действие духов. «Губить» естественно по-русски и сохраняет суровый смысл, не ограничивая его физическим разрушением.
- source_word: ዘእንበለ ኵነኔ
  choice: не подвергаясь суду
  rationale: Фраза означает отсутствие судебного воздаяния или приговора в этот промежуток времени; причастный оборот яснее буквального «без суда» связывает её с действующими духами.
- source_word: እስከ ዕለተ ተፍጻሜት ኵነኔ ዐቢይ
  choice: до дня, когда совершится великий суд
  rationale: Передаёт завершение великого суда естественной русской апокалиптической формулой, не перегружая текст отвлечёнными существительными.
- source_word: አመ ዓለም ዐቢይ ይትፌጸም
  choice: когда великий век достигнет своего конца
  rationale: «Век» сохраняет эсхатологическую многозначность ዓለም и не предполагает непременно уничтожения сотворённого мира.
theological_decisions:
- issue: Кому принадлежат духи
  choice: Необычная формула «духи, вышедшие из душ их плоти» сохранена в основном тексте.
  alternative: «Духи, вышедшие из их тел», то есть прямо названные бесплотные духи умерших исполинов.
  rationale: Ближайший контекст связывает их с исполинами, однако трудная формулировка геэзского текста не позволяет безоговорочно заменить её более определённым толкованием.
- issue: Характер разрушительной деятельности до суда
  choice: Духи губят, не подвергаясь суду, до назначенного великого суда.
  alternative: Они действуют «без приговора» или «без осуждения».
  rationale: Перевод сохраняет напряжение между продолжающимся злом и отсроченным окончательным судом, не утверждая, что духи вообще неподсудны.
- issue: Значение ዓለም
  choice: великий век
  alternative: великий мир или миропорядок
  rationale: В эсхатологическом контексте «век» наиболее естественно обозначает период или порядок, достигающий назначенного конца, но альтернативное значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Синтаксис сделан ясным для обычного читателя, но необычная антропологическая формула источника и многозначность эсхатологического термина сохранены и пояснены сносками.
