lexical_decisions:
- source_word: ወርኢኩ
  choice: я увидел
  rationale: Обычная формула повествования о видении; современное и точное русское соответствие.
- source_word: ህየ
  choice: там
  rationale: Пространственное наречие повторено в стихе; повтор сохранён ради структуры и образности оригинала.
- source_word: መካነ
  choice: место
  rationale: Основное значение существительного; отсутствие артикля передано без указательного уточнения.
- source_word: ማዕዶተ
  choice: по ту сторону
  rationale: Наиболее вероятное значение — «по другую сторону, за пределами»; оно естественно сочетается с последующим обозначением великой земли.
- source_word: ዐቢይ ምድር
  choice: великой земли
  rationale: Буквально сохраняет масштаб космической географии видения; «земля» здесь уместнее, чем «страна».
- source_word: ይትጋብኡ
  choice: они собираются
  rationale: Передаёт возвратно-собирательное значение формы, не уточняя не названных в данном стихе участников.
theological_decisions:
- issue: Космическая география места относительно великой земли
  choice: по ту сторону великой земли
  alternative: у пределов великой земли
  rationale: Основное чтение сохраняет конкретную пространственную картину апокалиптического видения, а текстуально и лексически возможная альтернатива отмечена в сноске без догматического истолкования.
translation_notes:
  register: Современный литературный русский язык с сохранением сдержанного, торжественного повествовательного ритма. Повтор «там» оставлен как характерная черта визионерского рассказа; неясный референт местоимения «они» намеренно не уточняется.
