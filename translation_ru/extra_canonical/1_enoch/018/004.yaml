base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/004.yaml
  text: And I saw the winds that turn the sky and cause the disk of the sun and all the stars to set[a][b].
translation:
  language: ru
  text: И увидел я ветры, которые приводят небо в движение[a] и заставляют заходить солнечный диск[b] и все звёзды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «которые вращают небо».'
    reason: Лексема допускает значения движения, поворота или вращения.
  - marker: b
    text: 'Буквально: «круг солнца»; возможно также понимание «круговой путь солнца».'
    reason: Слово ክበበ обозначает круглую форму или то, что образует круг либо окружает; точный космологический оттенок не вполне определён.
lexical_decisions:
- source_word: ወርኢኩ
  choice: И увидел я
  rationale: Сохраняет повторяющуюся формулу рассказа о видении и несколько возвышенный, но понятный современному читателю порядок слов.
- source_word: ነፋሳተ
  choice: ветры
  rationale: В данном космологическом контексте речь естественнее всего идёт о ветрах как силах, воздействующих на небо и светила; перевод «духи» без достаточных оснований персонализировал бы образ.
- source_word: እለ ይመይጥዋ ለሰማይ
  choice: которые приводят небо в движение
  rationale: Передаёт значение движения или вращения неба, не навязывая тексту точную астрономическую модель.
- source_word: ወእለ ያዐርቡ
  choice: и заставляют заходить
  rationale: Форма является каузативом от глагола, обозначающего заход или нисхождение солнца и звёзд; поэтому здесь не «приближают», а «заставляют заходить».
- source_word: ለክበበ ፀሐይ
  choice: солнечный диск
  rationale: Естественно передаёт видимый круг солнца; возможный оттенок «круг» или «круговой путь» отмечен в сноске.
- source_word: ወኵሎ ከዋክብተ
  choice: и все звёзды
  rationale: Точно и естественно передаёт собирательное выражение, охватывающее все звёзды.
theological_decisions:
- issue: Следует ли понимать ነፋሳተ как безличные космические ветры или как личных духовных существ
  choice: ветры
  alternative: духи; духи ветров
  rationale: Непосредственный контекст описывает космические силы, управляющие движением неба и светил. Перевод «ветры» сохраняет апокалиптический образ, не вводя не выраженную в стихе ангелологическую интерпретацию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным порядком слов, соответствующим повествованию о видении. Космологическая образность сохранена без модернизации и конфессионального истолкования.
