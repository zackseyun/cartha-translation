base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/002.yaml
  text: And I saw the cornerstones of the earth[c][b][a], and I saw the four winds that bear up the earth and the firmament of heaven.
translation:
  language: ru
  text: И увидел я краеугольные камни земли[a] и увидел четыре ветра[b], которые несут землю и небесную твердь[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «камни углов земли». Геэзское выражение имеет архитектурный оттенок и в образном строе видения может указывать на основания у пределов земли.'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «ветры», в некоторых контекстах может означать также «духи» или «дыхания», однако здесь космологический контекст благоприятствует переводу «ветры».
    reason: lexical_alternative
  - marker: c
    text: «Небесная твердь» сохраняет древний космологический образ устроенного небесного пространства или свода.
    reason: cultural_note
lexical_decisions:
- source_word: እብነ ማእዘንተ ምድር
  choice: камни по углам земли
  rationale: Передаёт составной образ «камней углов земли», не сводя его безоговорочно к привычному русскому термину «краеугольные камни» и сохраняя необычную архитектурно-космическую образность.
- source_word: ምድር
  choice: земля
  rationale: В контексте космического видения речь идёт о земле как целом, а не об отдельной стране или участке суши.
- source_word: አርባዕተ ነፋሳተ
  choice: четыре ветра
  rationale: Хотя существительное может обозначать также дыхание или дух, сочетание с числом четыре и космологический контекст указывают прежде всего на ветры.
- source_word: ይጸውርዋ
  choice: несут
  rationale: Глагол выражает несение или поддерживание; «несут» сохраняет конкретность и силу образа.
- source_word: ወጽንዐ ሰማይ
  choice: небесную твердь
  rationale: Так сохраняется древнее представление о структурированном небесном своде; перевод одним словом «небо» сделал бы образ менее явным.
theological_decisions:
- issue: Древняя космологическая образность устройства мира
  choice: Сохранить конкретные образы камней у земных углов, четырёх ветров, несущих землю, и небесной тверди.
  alternative: Ослабить образность, переведя как «края земли» и «силы, управляющие миром».
  rationale: Текст описывает видение посредством архитектурно-космических образов. Их не следует модернизировать или превращать в отвлечённые понятия.
translation_notes:
  register: Современный литературный русский язык с несколько возвышенным, но понятным повествовательным строем. Инверсия «увидел я» поддерживает ритм видения, не создавая чрезмерно архаического звучания.
