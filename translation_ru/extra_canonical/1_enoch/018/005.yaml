base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/005.yaml
  text: I saw the winds upon the earth[a], which bear the clouds; I saw the paths of the angels[d][c][b]; I saw at the end of the earth the firm support of the heaven above.
translation:
  language: ru
  text: Я увидел ветры на земле[a], несущие облака; увидел пути ангелов; увидел на краю земли твёрдую опору неба в вышине[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ветры над землёй». Геэзский предлог допускает значения «на» и «над»; оборот относится к ветрам, а облака являются предметом их несения.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «основание неба в вышине». Соответствующее геэзское слово может обозначать твёрдость, устойчивость или поддерживающую основу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ
  choice: я увидел / увидел
  rationale: Сохранена трёхкратная формула видения, причём во втором и третьем случаях русское местоимение естественно опущено. Бессоюзие оригинала передано точками с запятой без добавления «и».
- source_word: ነፋሳተ
  choice: ветры
  rationale: В космологическом контексте и при упоминании облаков речь естественнее всего идёт о ветрах, а не о духах.
- source_word: ዘዲበ ምድር
  choice: над землёй
  rationale: 'Оборот относится к ветрам: они находятся над землёй. Такое прочтение соответствует синтаксису геэзского текста и подтверждается греческим свидетельством ἐπὶ τῆς γῆς.'
- source_word: ዘይጸውር በደመናት
  choice: несущие облака
  rationale: Причастный оборот передаёт движение ветров, которые несут облака; именно облака, а не земля, связаны здесь с глаголом несения. Это также подтверждается греческим βαστάζοντας τὰς νεφέλας.
- source_word: ፍናወ
  choice: пути
  rationale: Слово обозначает дороги, пути или направления движения; «пути» сохраняет пространственный образ небесного странствия.
- source_word: መላእክት
  choice: ангелов
  rationale: В апокалиптическом контексте имеются в виду небесные посланники; общеупотребительное «ангелы» передаёт это ясно и без конфессионального уточнения.
- source_word: ውስተ ጽንፈ ምድር
  choice: на краю земли
  rationale: Оборот обозначает крайнюю границу мира. «На краю земли» в современном русском звучит естественнее, чем «на конце земли», и сохраняет космографический образ.
- source_word: ጽንዐ
  choice: твёрдую опору
  rationale: Существительное выражает твёрдость, устойчивость или поддерживающую силу. «Твёрдая опора» сохраняет образ поддерживаемого неба, не сводя значение исключительно к архитектурному фундаменту.
- source_word: ዘሰማይ መልዕልተ
  choice: неба в вышине
  rationale: Фраза указывает на небо в его возвышенном положении; «небо в вышине» естественно передаёт вертикальную космологическую картину.
theological_decisions:
- issue: Следует ли понимать ነፋሳተ как «ветры» или как «духи»
  choice: ветры
  alternative: духи
  rationale: 'Последовательность образов описывает устройство космоса: ветры несут облака, далее показаны пути ангелов и опора неба. «Ветры» соответствует ближайшему контексту и не вносит в стих отсутствующую демонологическую или антропологическую трактовку.'
- issue: Насколько предметно передавать ጽንዐ как часть космической архитектуры
  choice: твёрдая опора
  alternative: основание
  rationale: Выбранный вариант сохраняет представление о поддерживающей твёрдости, но не делает более узкий архитектурный смысл единственно возможным.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования. Краткие, разделённые точками с запятой фразы сохраняют бессоюзный, ступенчатый ритм трёхкратного ርኢኩ. Архаизмы избегаются; «в вышине» оставлено как естественное возвышенное выражение.
