base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/006.yaml
  text: And I went on toward the south[a], and I saw a place burning day and night[b], where there were seven mountains of precious stone—three toward the east and three toward the south.
translation:
  language: ru
  text: 'И я пошёл дальше к югу и увидел место, пылающее днём и ночью. Там было семь гор из драгоценного камня[a]: три к востоку и три к югу[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение можно также перевести: «из дорогого камня» или «из великолепного камня»; геэзское слово подчёркивает исключительную ценность или великолепие камня.'
    reason: lexical_alternative
  - marker: b
    text: В дошедшем до нас геэзском тексте после упоминания семи гор названы три к востоку и три к югу. Местоположение седьмой горы в этом стихе не указано.
    reason: textual_variant
