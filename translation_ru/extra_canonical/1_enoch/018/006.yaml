- source_word: ዘይነድድ
  choice: пылавшее
  rationale: Передаёт продолжающееся горение и яркость апокалиптического образа без дополнительных толкований.
- source_word: መዐልተ ወሌሊተ
  choice: днём и ночью
  rationale: Обычное русское сочетание, выражающее непрерывность действия.
- source_word: ኀበ ሰብዓቱ አድባር
  choice: там было семь гор
  rationale: Передаёт локативную функцию ኀበ и ясно связывает горы с увиденным местом.
- source_word: ዘእምእብን ክቡር
  choice: из драгоценного камня
  rationale: ክቡር обозначает высокую ценность или великолепие; «драгоценный» естественно соответствует образу необыкновенного камня.
- source_word: ፫መንገለ ጽባሕ
  choice: три к востоку
  rationale: В перечне направлений ጽባሕ уместно передать как «восток», сохранив параллелизм.
- source_word: ወ፫መንገለ አዜብ
  choice: и три к югу
  rationale: Буквально сохраняет направление и не восполняет местонахождение седьмой горы.
