revisions:
- from: А те, что были обращены к востоку, состояли из разноцветного камня; один — из жемчужного камня, другой — из целебного камня. А те, что были обращены к югу, состояли из красного камня.
  to: А те, что находились с восточной стороны, были из цветного камня; один — из жемчужного камня, и ещё один — из целебного камня. А те, что находились с южной стороны, были из красного камня.
  rationale: Уточнена пространственная характеристика без внесения смысла поворота объектов; «разноцветный» заменён на более точный «цветной»; структура двух последующих единиц сохранена как «один … и ещё один». Значение перечня и его неопределённость относительно точных минералов не изменены.
