base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/007.yaml
  text: And those toward the east were of colored stone, and one was of pearl stone, and one of healing stone; and those toward the south were of red stone.
translation:
  language: ru
  text: А те, что находились с восточной стороны, были из цветного камня; один — из жемчужного камня, и ещё один — из целебного камня. А те, что находились с южной стороны, были из красного камня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እብነ፡ ሕብር
  choice: разноцветного камня
  rationale: Сохраняет прямое значение сочетания «камень цвета/окраски» и согласуется с перечнем различных видов камня.
- source_word: እብነ፡ ባሕርይ
  choice: жемчужного камня
  rationale: Передаёт традиционно понимаемое в этом месте обозначение жемчуга или перламутрового камня, не устраняя образ «камня».
- source_word: እብነ፡ ፈውስ
  choice: целебного камня
  rationale: ፈውስ означает исцеление или целебное средство; при средней уверенности источника буквальное «целебный» предпочтительнее догадки о конкретном минерале.
- source_word: እብነ፡ ቀይሕ
  choice: красного камня
  rationale: Прямая и естественная передача цвета ቀይሕ.
- source_word: ዘመንገለ፡ ጽባሕ / ዘመንገለ፡ አዜብ
  choice: обращены к востоку / обращены к югу
  rationale: Передаёт пространственную ориентацию описываемых предметов, сохраняя повторяющуюся структуру оригинала.
