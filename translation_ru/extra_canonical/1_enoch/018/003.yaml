base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/003.yaml
  text: And I saw how the winds support the heights of heaven[a], and they stand between heaven and earth; these are the pillars of heaven.
translation:
  language: ru
  text: И я увидел, как ветры поддерживают небесные выси[a], стоящие между небом и землёй; это — столпы неба.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Значение геэзского глагола не вполне ясно; его можно понимать также как «простирают», «распростирают» или «поддерживают».
    reason: lexical_alternative
lexical_decisions:
- source_word: ነፋሳት
  choice: ветры
  rationale: В контексте космологического видения слово естественнее обозначает ветры как силы мироздания, а не личностных духов.
- source_word: ይረብብዋ
  choice: поддерживают
  rationale: Значение глагола не вполне ясно; в сочетании с небесными высотами и последующим упоминанием столпов «поддерживают» связно передаёт пространственный образ, не устраняя лексическую неопределённость, отмеченную в сноске.
- source_word: አዕልና፡ ሰማይ
  choice: небесные выси
  rationale: Выражение обозначает высоты неба и не должно преждевременно отождествляться со «столпами неба», названными только в заключительной части стиха.
- source_word: ይቀውሙ
  choice: стоят
  rationale: Прямой эквивалент сохраняет наглядность видения и допускает отнесение подлежащего к упомянутым ветрам.
- source_word: ማእከለ፡ ሰማይ፡ ወምድር
  choice: между небом и землёй
  rationale: Естественная русская передача буквального пространственного выражения «посреди неба и земли».
- source_word: እሙንቱ፡ ውእቶሙ
  choice: они —
  rationale: Эмфатическая отождествляющая конструкция передана кратко и выразительно; местоимение сохраняет связь с предшествующим образом.
- source_word: አዕማደ፡ ሰማይ
  choice: столпы неба
  rationale: «Столпы» — традиционно возвышенное, но понятное обозначение космических опор; оно отличается от ранее упомянутых небесных высей.
theological_decisions:
- issue: Передача ነፋሳት как «ветры» или «духи»
  choice: ветры
  alternative: духи; ветры-духи
  rationale: Описание относится к устройству мироздания. «Ветры» лучше соответствует физической образности отрывка и не привносит не требуемую текстом ангелологическую конкретизацию.
- issue: К кому относится «они» в заключительных частях стиха
  choice: Сохранена естественная грамматическая связь с ветрами без дополнительного пояснения
  alternative: Явно истолковать местоимение как относящееся к отдельным небесным опорам
  rationale: Исходная формулировка допускает напряжённое отождествление ветров со столпами неба; перевод не должен без необходимости разрешать эту образную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Слово «столпы» сохранено ради космологического образа; синтаксис сделан ясным, но присущая исходному тексту смысловая напряжённость не устранена.
