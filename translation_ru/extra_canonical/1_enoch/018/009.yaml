  text: And I saw a burning fire that was within all the mountains[a][b].
translation:
  language: ru
  text: И увидел я горящий огонь, который находился внутри всех гор.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Оборот, переданный словами «который находился», в этом эфиопском свидетельстве труден и, возможно, отражает сжатое или повреждённое чтение. По-видимому, речь идёт об огне, находившемся внутри гор.
    reason: textual_variant
  - marker: b
    text: 'Или: «И увидел я горящий огонь и то, что находилось внутри всех гор».'
    reason: previous_rendering
lexical_decisions:
- source_word: እሳተ
  choice: огонь
  rationale: Неопределённое существительное в единственном числе; в русском языке естественно передаётся без неопределённого артикля, сохраняя простой образ видения.
- source_word: ዘይነድድ
  choice: горящий
  rationale: Относительная глагольная форма описывает продолжающееся горение; причастие естественно передаёт это значение.
- source_word: ርኢኩ
  choice: увидел я
  rationale: Форма первого лица передаёт формулу свидетельства о видении; порядок слов поддерживает возвышенный, но понятный повествовательный регистр.
- source_word: ወዘሀሎ
  choice: который находился
  rationale: Понято как второе относительное определение к слову «огонь». При этом трудность эфиопского чтения отмечена в сноске, а возможное иное синтаксическое членение сохранено как альтернатива.
- source_word: ውስተ ኵሉ አድባር
  choice: внутри всех гор
  rationale: Предлог указывает на внутреннее местонахождение, а сочетание с множественным числом имеет собирательный охват; «внутри» сохраняет пространственный образ.
theological_decisions:
- issue: Характер образа огня в горах
  choice: Сохранить буквальный апокалиптический образ огня, находящегося внутри всех гор.
  alternative: Истолковать огонь как отвлечённый символ суда либо как природное подземное явление.
  rationale: Текст описывает увиденную визионером космическую местность и сам не даёт аллегорического или натуралистического объяснения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным порядком слов, подходящим для повествования о видении. Синтаксис остаётся ясным, а текстовая неоднозначность не скрыта и вынесена в сноски.
