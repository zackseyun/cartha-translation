base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/008.yaml
  text: And the middle one reached to heaven[a], like the throne of the Lord, which was of crystal stone[d][c][b], and the top of the throne was of sapphire stone.
translation:
  language: ru
  text: Средняя же из них[a] поднималась до неба, словно престол Господа, который был из кристального камня[b]; верх же престола был из сапфирового камня[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «И посреди она поднималась»; форма указывает на средний объект или среднюю часть, но её точный референт в самой фразе не назван.'
    reason: alternative_reading
  - marker: b
    text: Название камня не вполне ясно; вероятно, имеется в виду светлый, блестящий или драгоценный материал.
    reason: lexical_alternative
  - marker: c
    text: Выражение «верх престола» трудно для истолкования; оно может обозначать его верхнюю часть или вершину связанного с ним сооружения.
    reason: alternative_reading
lexical_decisions:
- source_word: ማእከላይሰ
  choice: Средняя же из них
  rationale: Субстантивированное обозначение среднего объекта передано с учётом контекста ряда гор; частица ሰ отражена словом «же». Местоименное «из них» делает русскую фразу естественной, не повторяя подразумеваемое существительное.
- source_word: ይጐድእ እስከ ሰማይ
  choice: поднималась до неба
  rationale: Передаёт направленное вверх простирание и предел, обозначенный сочетанием እስከ ሰማይ, не превращая образ в утверждение о буквальном движении.
- source_word: ከመ መንበረ ለእግዚአብሔር
  choice: словно престол Господа
  rationale: «Словно» сохраняет сравнение, а не отождествление; «престол» соответствует возвышенному визионерскому регистру.
- source_word: ዘእምእብነ ፑክ
  choice: который был из кристального камня
  rationale: Относительное предложение отнесено к престолу согласно синтаксису геэз. Традиционное «кристальный камень» сохраняет образ светлого драгоценного материала, при этом его точная идентификация отмечена в сноске.
- source_word: ወይማሑ ለመንበሩ
  choice: верх же престола
  rationale: Фраза понята как обозначение верхней части престола. Частица связи передана через «же», а лексическая трудность отмечена в сноске.
- source_word: እምእብነ ሰንፔር
  choice: из сапфирового камня
  rationale: Традиционное соответствие названию драгоценного камня сохраняет материальную образность исходной конструкции.
theological_decisions:
- issue: Передача እግዚአብሔር
  choice: Господь
  alternative: Бог; Господь Бог
  rationale: «Господь» точно и благоговейно передаёт божественный титул без добавления отсутствующих в исходном тексте слов.
- issue: Соотношение средней горы и престола Господа
  choice: 'сохранено сравнение: «словно престол Господа»'
  alternative: отождествление объекта с престолом Господа
  rationale: Союз ከመ вводит уподобление; перевод не утверждает, что видимый объект буквально являлся престолом Господа.
