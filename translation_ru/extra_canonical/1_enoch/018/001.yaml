base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/001.yaml
  text: And I saw the storehouses of all the winds[b][a], and I saw how with them he adorned all creation and the foundations of the earth.
translation:
  language: ru
  text: И увидел я хранилища всех ветров[a], и увидел, как ими он украсил[b] всё творение и основания земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокровищницы». Имеются в виду небесные помещения, где хранятся ветры.'
    reason: lexical_alternative
  - marker: b
    text: Глагол может также иметь смысл «устроил», «упорядочил» или «утвердил», а не только «украсил».
    reason: lexical_alternative
lexical_decisions:
- source_word: መዛግብተ
  choice: хранилища
  rationale: Слово обозначает сокровищницы или хранилища. В космологическом контексте «хранилища» сохраняет конкретный образ небесных помещений, где удерживаются ветры, и не создаёт преимущественно денежной ассоциации.
- source_word: ኵሉ ነፋሳት
  choice: всех ветров
  rationale: Хотя ነፋሳት может означать также духов или дыхания, ближайший космологический контекст и образ хранилищ указывают прежде всего на ветры.
- source_word: ከመ
  choice: как
  rationale: Союз вводит содержание видения и здесь естественно передаёт значение «каким образом».
- source_word: ቦሙ
  choice: ими
  rationale: 'Форма отсылает к ветрам и допускает инструментальное значение: ветры выступают средством действия.'
- source_word: አሰርገወ
  choice: украсил
  rationale: Основной образ глагола связан с украшением или приданием красоты; при этом в данном космическом контексте он может включать оттенок упорядочения, отмеченный в сноске.
- source_word: ኵሎ ፍጥረተ
  choice: всё творение
  rationale: Собирательное выражение передаёт всеобщий, космический охват и естественно звучит по-русски.
- source_word: መሰረታቲሃ ለምድር
  choice: основания земли
  rationale: Сохранён конкретный архитектурно-космологический образ; местоименный суффикс относится к земле.
theological_decisions:
- issue: Передача ነፋሳት как «ветры» или «духи»
  choice: ветры
  alternative: духи; дыхания
  rationale: Последовательность видений описывает устройство мира, а небесные хранилища естественно связаны с ветрами. Такой перевод не привносит в стих необязательный ангелологический смысл.
- issue: Передача አሰርገወ как украшения или устроения творения
  choice: украсил
  alternative: устроил; упорядочил; утвердил
  rationale: Основной текст сохраняет яркий образ украшения, поддерживаемый геэзским глаголом, а возможный космогонический оттенок устроения не устраняется, но приводится в сноске.
- issue: Неявный субъект глагола አሰርገወ
  choice: он
  alternative: Он; Бог
  rationale: В геэзском тексте субъект выражен только формой третьего лица. Местоимение «он» сохраняет эту неявность и не добавляет имени, отсутствующего в стихе.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного ритма видения. Инверсия «И увидел я» передаёт повторяемую формулу повествования, оставаясь понятной современному читателю. Строчная форма «он» не навязывает толкование неявного субъекта и соответствует нейтральной редакционной практике.
