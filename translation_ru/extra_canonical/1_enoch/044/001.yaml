base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/044/001.yaml
  text: 'And another thing I saw concerning the lightning: how some of the stars arise and become lightning[b][a], and they are not able to leave it.'
translation:
  language: ru
  text: 'И вот ещё что я увидел о молнии: как некоторые из звёзд поднимаются и становятся молнией, и не могут оставить[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не могут перестать»; возможно также: «не могут удалиться». В оригинале объект глагола «оставить» не назван.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልእተ
  choice: ещё
  rationale: Передаёт введение нового предмета видения естественным современным русским оборотом, не утяжеляя фразу буквальным «другое».
- source_word: ርኢኩ
  choice: я увидел
  rationale: Прямая и ясная передача обычной формулы рассказа о видении.
- source_word: በእንተ መብረቅ
  choice: о молнии
  rationale: Сохраняет пояснительное отношение и основной образ молнии без дополнительного истолкования.
- source_word: እፎ
  choice: как
  rationale: Вводит содержание увиденного и сохраняет живой описательный характер фразы.
- source_word: ይቀውሙ
  choice: поднимаются
  rationale: Передаёт значение вставания или возникновения; в данном космическом образе естественнее русского буквального «становятся» или ошибочного «выделяются».
- source_word: እምከዋክብተ
  choice: некоторые из звёзд
  rationale: 'Предлог понимается партитивно: речь идёт о части звёзд, а не обязательно о движении прочь от звёзд.'
- source_word: ወይከውኑ መብረቀ
  choice: и становятся молниями
  rationale: Глагол выражает становление, а множественное число в русском согласует образ с несколькими звёздами; смысловой образ не истолковывается далее.
- source_word: ወኢይክሉ
  choice: но не могут
  rationale: Сохраняет прямо выраженную неспособность; противительный союз естественно передаёт смысловую связь последней части по-русски.
- source_word: ኃዲገ
  choice: оставить это
  rationale: Основное значение — «оставить, покинуть»; указательное местоимение лишь делает неполную конструкцию приемлемой по-русски, а неопределённость объекта отмечена в сноске.
theological_decisions:
- issue: Природа образа звёзд и молний
  choice: Сохранить образ космического превращения, не отождествляя звёзды с ангелами или духами.
  alternative: Истолковать звёзды как ангельских существ либо понимать стих исключительно как описание природного явления.
  rationale: Сам стих не называет звёзды личными или ангельскими существами и не требует чисто натуралистического толкования, поэтому перевод оставляет апокалиптический образ открытым.
translation_notes:
  register: Современный литературный русский язык с ясной, но достойной повествовательной интонацией. Апокалиптический образ сохранён без конфессионального или натуралистического истолкования; синтаксическая неясность заключительной фразы вынесена в сноску.
