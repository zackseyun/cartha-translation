base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/007.yaml
  text: Woe to those who build their houses by sin, for they will be torn down from all their foundations; [and they will fall by the sword;] and those who acquire gold and silver will quickly be destroyed in judgment.
translation:
  language: ru
  text: 'Горе тем, кто строит свои дома грехом: они будут разрушены до самого основания; [и падут от меча;][a] а те, кто приобретает золото и серебро, вскоре погибнут на суде.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «и падут от меча» в исходном издании заключены в квадратные скобки, что указывает на текстологическую неуверенность.
    reason: Сохранить отмеченную изданием неопределённость текста и объяснить квадратные скобки читателю.
lexical_decisions:
- source_word: በኃጢአት
  choice: грехом
  rationale: Предлог በ допускает инструментальное значение; перевод сохраняет мысль о том, что дома возводятся посредством греха, а не просто «в грехе».
- source_word: እምኵሉ፡ መሠረቶሙ፡ ይትነሠቱ
  choice: будут разрушены до самого основания
  rationale: Естественно передаёт полное уничтожение построенного, сохраняя образ основания; буквальная синтаксическая конструкция геэз здесь не вполне прозрачна.
- source_word: ያጠርይዎ፡ ለወርቅ፡ ወለብሩር
  choice: приобретает золото и серебро
  rationale: Нейтрально передаёт накопление или приобретение богатства без добавления отсутствующей в данной фразе нравственной квалификации.
- source_word: በጽነኔ
  choice: на суде
  rationale: Следует засвидетельствованному в консультационном слое пониманию слова как указания на суд; формулировка не превращает его в характеристику способа приобретения богатства.
- source_word: ፍጡነ፡ ይትሐጐሉ
  choice: вскоре погибнут
  rationale: Передаёт наречие быстроты и сильный глагол гибели естественным современным русским языком.
theological_decisions:
- issue: Связь богатства с осуждением
  choice: те, кто приобретает золото и серебро, вскоре погибнут на суде
  alternative: те, кто неправедно приобретает золото и серебро, вскоре погибнут
  rationale: 'Не добавлено слово «неправедно»: источник связывает приобретение богатства с последующим судом, но не выражает эту характеристику явно в самом глаголе приобретения.'
- issue: Образ уничтожения домов
  choice: разрушены до самого основания
  alternative: исторгнуты из всех своих оснований
  rationale: Выбран понятный русский образ полного разрушения без привнесения специального учения о характере кары.
