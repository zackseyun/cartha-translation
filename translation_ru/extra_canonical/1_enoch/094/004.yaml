base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/004.yaml
  text: But seek and choose for yourselves righteousness and a good life[a], and walk in the paths of peace[c][b], so that you may live and prosper.
translation:
  language: ru
  text: Но ищите и изберите для себя праведность и добрую жизнь[a]; идите путями мира[b], чтобы жить и преуспевать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфиопская фраза, переданная как «добрую жизнь», в данном OCR-свидетеле трудна; возможен также смысл: «жизнь, исполненная добра».'
    reason: textual_variant
  - marker: b
    text: 'Глагол также можно передать: «ходите путями мира».'
    reason: lexical_alternative
lexical_decisions:
- source_word: እላ
  choice: но
  rationale: 'С учётом последней текстологической проверки форма понимается как ошибочно переданное አላ, вводящее противопоставление: «но».'
- source_word: ፍቅዱ
  choice: стремитесь
  rationale: Императив множественного числа от ፈቀደ выражает стремление или искание; «стремитесь» естественно передаёт нравственный призыв и не смешивает этот корень с глаголом «любить».
- source_word: ወኀረዩ
  choice: и изберите
  rationale: Передаёт прямой призыв к сознательному нравственному выбору; «изберите» сохраняет достоинство и увещательный регистр.
- source_word: ለክሙ
  choice: для себя
  rationale: Сохраняет возвратно-бенефактивное значение.
- source_word: ጽድቀ
  choice: праведности
  rationale: Широкое нравственно-религиозное понятие здесь уместнее узкого «справедливости».
- source_word: ወሕይወተ ኄራተ
  choice: добрую жизнь
  rationale: Сочетание естественно понимается как жизнь, характеризуемая добром; трудность чтения отмечена в сноске.
- source_word: ወሖሩ
  choice: идите
  rationale: В русском библейском нравственном контексте «идите путями» звучит естественнее буквального «ходите», сохраняя метафору образа жизни.
- source_word: በፍኖዋተ ሰላም
  choice: путями мира
  rationale: Сохраняет множественное число и образ путей; «мир» передаёт состояние согласия и благополучия без сведения смысла к простому отсутствию конфликта.
- source_word: ወተሐደዉ
  choice: чтобы жить
  rationale: Передаёт вероятный итоговый или целевой оттенок заключительной части.
- source_word: ወትደለዉ
  choice: и преуспевать
  rationale: Передаёт благополучный исход в стиле литературы мудрости, не ограничивая его материальным достатком.
theological_decisions:
- issue: Передача ጽድቀ как «праведность» или «справедливость»
  choice: праведность
  alternative: справедливость
  rationale: Контекст нравственного увещания охватывает личную цельность и правильную жизнь шире, чем общественная или судебная справедливость.
- issue: Связь заключительных глаголов с предшествующим призывом
  choice: целевой или результативный оборот «чтобы жить и преуспевать»
  alternative: сочинительное «и живите, и преуспевайте»
  rationale: Так лучше отражается вероятная зависимость обещанного результата от следования путями мира, хотя форма допускает более буквальное сочинение.
translation_notes:
  register: Современный литературный русский с умеренно библейским, увещательным звучанием. Синтаксис остаётся ясным для обычного читателя; исходная образность путей сохранена, а спорные места не догматизируются.
