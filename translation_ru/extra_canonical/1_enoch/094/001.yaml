base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/001.yaml
  text: 'And now I say to you[a], my children: love righteousness and walk in it; for the paths of righteousness are worthy and acceptable[c][b], but the paths of iniquity will quickly be destroyed and vanish.'
translation:
  language: ru
  text: 'И теперь говорю вам, дети мои: любите праведность и ходите её путём, потому что пути праведности достойны и угодны[a], а пути беззакония вскоре будут уничтожены и исчезнут.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфиопское выражение допускает также перевод: «подобающи и принимаются» или «достойны и одобряемы». Смысл в том, что пути праведности надлежащи и встречают одобрение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እብለክሙ
  choice: говорю вам
  rationale: Сохраняет прямую формулу обращения и наставительный тон.
- source_word: ደቂቅየ
  choice: дети мои
  rationale: Передаёт родственное обращение, не ограничивая его только мужской аудиторией.
- source_word: አፍቅርዋ ለጽድቅ
  choice: любите праведность
  rationale: «Праведность» охватывает широкий нравственный смысл ጽድቅ и соответствует контрасту с беззаконием.
- source_word: ወባቲ ሖሩ
  choice: ходите её путём
  rationale: Естественно передаёт этическую метафору хождения; местоимение относится к праведности.
- source_word: ፍኖዋተ ጽድቅ
  choice: пути праведности
  rationale: Сохраняет образ нравственных путей и параллелизм со следующей частью стиха.
- source_word: ይደሉ ወይትወከፍ
  choice: достойны и угодны
  rationale: Передаёт два оценочных сказуемых — пригодность или достоинство и принятие или одобрение — без их слияния.
- source_word: ፍኖዋተ ዓመፃ
  choice: пути беззакония
  rationale: ዓመፃ здесь выступает прямым нравственным антонимом праведности; «беззаконие» передаёт широкий смысл неправды и не смешивает слово с более конкретным обозначением насилия.
- source_word: ፍጡነ
  choice: вскоре
  rationale: Передаёт близость и быстроту предстоящего исхода естественным русским наречием.
- source_word: ይትሐጐላ ወየሐፅፃ
  choice: будут уничтожены и исчезнут
  rationale: 'Сохраняет удвоенное выражение гибели: разрушение и последующее исчезновение.'
theological_decisions:
- issue: Передача ጽድቅ в нравственно-наставительном контексте
  choice: праведность
  alternative: справедливость
  rationale: «Праведность» шире социально-правового понятия справедливости и лучше охватывает нравственный образ жизни, по которому призваны ходить слушатели.
- issue: Значение ዓመፃ в противопоставлении ጽድቅ
  choice: беззаконие
  alternative: неправда; несправедливость; насилие
  rationale: Внутренний параллелизм стиха указывает на общий нравственный антоним праведности. Перевод «насилие» был бы возможен по диапазону слова, но здесь чрезмерно сужал бы смысл.
- issue: Оценочная пара ይደሉ ወይትወከፍ
  choice: достойны и угодны
  alternative: подобающи и принимаются; достойны и приемлемы
  rationale: Сохранены оба сказуемых и трудность исходного выражения, без уточнения, кому именно эти пути угодны.
translation_notes:
  register: Современный литературный русский язык с достоинством наставительной речи. Формула «дети мои» сохраняет отеческий тон; «ходите её путём» делает метафору естественной по-русски, а параллельное «пути праведности / пути беззакония» удерживает композицию оригинала.
