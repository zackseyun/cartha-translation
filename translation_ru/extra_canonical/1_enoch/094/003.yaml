base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/003.yaml
  text: 'And now I say to you[a], the righteous: do not walk in the paths of evil, nor in the paths of death, and do not draw near to them[b], lest you be destroyed.'
translation:
  language: ru
  text: 'И ныне говорю вам, праведным: не ходите ни путями зла, ни путями смерти и не приближайтесь к ним[a], чтобы вам не погибнуть[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «К ним» может относиться к путям зла и смерти либо к тем, кто ими идёт.
    reason: referential_ambiguity
  - marker: b
    text: 'Возможно также: «чтобы вам не быть погубленными» или «чтобы вас не унесло».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: И ныне
  rationale: Сохраняет временной переход и торжественный, но понятный литературный регистр.
- source_word: ለጻድቃን
  choice: вам, праведным
  rationale: Передаёт адресата как устойчивую этическую категорию книги, сохраняя прямое обращение.
- source_word: ኢትሖሩ በፍኖዋተ
  choice: не ходите путями
  rationale: Сохраняет метафору нравственного пути и естественно звучит по-русски.
- source_word: እኩይ
  choice: зла
  rationale: Контекст требует абстрактного нравственного значения без необоснованной персонификации.
- source_word: ሞት
  choice: смерти
  rationale: Прямо передаёт резкий контраст путей зла и смерти.
- source_word: ኢትቅረቡ ኀቤሆሙ
  choice: не приближайтесь к ним
  rationale: Сохраняет множественное местоимение и допускает его отнесение как к названным путям, так и к связанным с ними людям.
- source_word: ከመ ኢትትሐጐሉ
  choice: чтобы вам не погибнуть
  rationale: Передаёт отрицательную цель или предостерегаемый результат, не уточняя сверх текста характер гибели.
theological_decisions:
- issue: К чему относится местоимение «к ним»
  choice: Референт оставлен грамматически широким и не уточнён в основном тексте.
  alternative: Отнести местоимение исключительно к людям, идущим путями зла и смерти.
  rationale: Геэзское множественное местоимение допускает связь с ранее названными путями; контекст также может подразумевать их приверженцев. Перевод не должен устранять эту неоднозначность.
- issue: Характер конечной гибели
  choice: «погибнуть» без уточнения вида гибели
  alternative: «быть уничтоженными» или «быть сметёнными»
  rationale: Так сохраняется апокалиптическая серьёзность предупреждения без навязывания исключительно физического, судебного или духовного смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. «И ныне» поддерживает торжественный переход, а остальная фраза остаётся ясной для обычного читателя.
