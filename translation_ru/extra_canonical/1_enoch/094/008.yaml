base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/008.yaml
  text: Woe to you[a], rich ones, for you have trusted in your riches, and from your riches you will depart[b], because you did not remember the Most High in the days of your riches.
translation:
  language: ru
  text: Горе вам, богатые! Вы полагались на своё богатство и от своего богатства отойдёте[a], потому что не помнили о Всевышнем в дни своего богатства.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также: «выйдете от своего богатства». Эти слова могут означать утрату богатства или то, что его придётся оставить.'
    reason: лексическая неоднозначность
lexical_decisions:
- source_word: አሌ
  choice: Горе
  rationale: Сохраняет силу пророческого возгласа, возвещающего суд.
- source_word: አብዕልት
  choice: богатые
  rationale: Естественное русское обращение во множественном числе, точно обозначающее состоятельных людей.
- source_word: ብዕልክሙ
  choice: своё богатство / своего богатства
  rationale: Повтор слова «богатство» воспроизводит настойчивый риторический повтор оригинала; возвратное местоимение естественно при одном и том же субъекте.
- source_word: ተወከልክሙ
  choice: вы полагались
  rationale: Передаёт доверие и опору на богатство без излишне конфессионально окрашенного оборота.
- source_word: ትወፅኡ
  choice: отойдёте
  rationale: В сочетании с እምነ передаёт выход или удаление от чего-либо и сохраняет неоднозначность образа.
- source_word: ለልዑል
  choice: о Всевышнем
  rationale: Устоявшееся и ясное русское соответствие божественному титулу.
- source_word: ኢተዘከርክምዎ
  choice: не вспоминали
  rationale: Прямо передаёт значение глагола и нравственный упрёк в забвении Бога во время благополучия.
- source_word: በመዋዕለ ብዕልክሙ
  choice: в дни своего богатства
  rationale: Сохраняет временной образ и заключительный повтор ключевого слова.
theological_decisions:
- issue: Смысл слов об удалении от богатства
  choice: 'Сохранён буквальный образ: «от своего богатства отойдёте».'
  alternative: «лишитесь богатства»; «умрёте, оставив богатство»; «выйдете из благополучия»
  rationale: Эфиопский текст не уточняет, идёт ли речь о смерти, лишении имущества или ином суде; перевод не разрешает эту напряжённую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Повтор слова «богатство» намеренно сохранён; синтаксис слегка сглажен ради естественности, но причинная связь и неоднозначный образ суда не истолкованы сверх текста.
