base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/009.yaml
  text: You have committed reproach and violence[a], and you have made yourselves ready for the day of the shedding of blood, and for the day of darkness[c][b], and for the day of the great judgment.
translation:
  language: ru
  text: Вы совершили оскорбления и насилие[a] и приготовились ко дню пролития крови[b], ко дню тьмы и ко дню великого суда[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «насилие», может также означать «притеснение» или «беззаконие».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ко дню кровопролития».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «великого осуждения» либо «великого приговора».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ገበርክምዋ፡ ለጽርፈት፡ ወለዓመፃ
  choice: вы совершили поношение и насилие
  rationale: Глагол ገበረ передан как «совершили», а суффикс объекта понят как предваряющий существительные с ለ, которое здесь отмечает прямые объекты. Такое прочтение точнее, чем целевое «приготовили это для…». «Поношение» сохраняет смысл оскорбления и поругания, а «насилие» — резкий нравственно-судебный тон.
- source_word: ወድልዋነ፡ ኮንክሙ
  choice: и стали готовы
  rationale: Сочетание буквально выражает становление готовыми. Русское «стали готовы» сохраняет состояние, не усиливая текст до намеренного «приготовили себя».
- source_word: ለዕለተ፡ ክዕወት፡ ደም
  choice: ко дню пролития крови
  rationale: Сохранён образ излияния или пролития крови и повторяющаяся формула «ко дню…».
- source_word: ወለዕለተ፡ ጽልመት
  choice: ко дню тьмы
  rationale: Прямая и естественная передача апокалиптического образа без его истолкования.
- source_word: ወለዕለተ፡ ኵነኔ፡ ዐቢይ
  choice: ко дню великого суда
  rationale: «Суд» сохраняет широкий смысл судебного решения, тогда как «осуждение» заранее делает явным его отрицательный исход.
theological_decisions:
- issue: Относится ли заключительная последовательность к обычным историческим бедствиям или к эсхатологическому суду
  choice: Сохранена последовательность особых дней, завершающаяся «днём великого суда».
  alternative: Обобщить как грядущие бедствие и наказание в истории.
  rationale: Троекратная формула «день… день… день…», образы крови и тьмы и прямое упоминание великого суда образуют апокалиптическую картину; её не следует сглаживать до общего нравственного предостережения.
- issue: Передавать ли ኵነኔ как «суд» или как «осуждение»
  choice: великий суд
  alternative: великое осуждение
  rationale: «Суд» сохраняет смысловую широту исходного слова и не снимает присущего контексту напряжения между судебным разбирательством, приговором и осуждением.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным апокалиптическим звучанием. Повтор предлога «ко» удерживает ритм исходной трёхчастной формулы. Архаизмы и конфессионально окрашенные термины не используются.
