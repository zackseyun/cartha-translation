base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/005.yaml
  text: And command them in the thought of your hearts[a], and do not let my words be blotted out from your hearts; for I know that sinners will tempt men to practice evil wisdom, and no place will be found for it[f][e][d][c][b], and no temptation will diminish.
translation:
  language: ru
  text: 'И повелите им в помыслах ваших сердец[a] и не давайте словам Моим изгладиться из ваших сердец. Ибо Я знаю: грешники будут искушать людей, чтобы те прибегали к злой мудрости; но не найдётся для неё места[b], и никакое искушение не ослабеет[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «повелите им в намерении ваших сердец». Выражение на языке геэз соединяет мысль или намерение с сердцем как средоточием внутренней решимости.'
    reason: lexical_alternative
  - marker: b
    text: Слова «не найдётся для неё места» трудны для истолкования. «Место» может означать буквальное место, простор или возможность для этой злой мудрости.
    reason: alternative_reading
  - marker: c
    text: Заключительная фраза неясна. Существительное может означать также «испытание» или «бедствие», а вся фраза — что никакое бедствие не уменьшится или не будет пресечено.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ትእዛዙ
  choice: заповедайте их
  rationale: Передаёт силу повелительной формы от глагола со значением «повелевать, заповедовать»; более мягкое «наставляйте» могло бы ослабить паранетический тон.
- source_word: በሐሊና ልብክሙ
  choice: в помыслах ваших сердец
  rationale: Сохраняет сочетание мысли или намерения с сердцем как средоточием внутреннего решения, не устраняя семитскую образность.
- source_word: ኢይደምስስ ነገርየ እምልብክሙ
  choice: да не изгладятся слова мои из ваших сердец
  rationale: «Изгладятся» передаёт образ стирания и исчезновения из внутренней памяти; конструкция с «да не» соответствует возвышенному увещательному регистру.
- source_word: ያሜክሮዎሙ ኃጥኣን ለሰብእ
  choice: грешники будут искушать людей
  rationale: Форма от አመከረ указывает на искушение, испытание или соблазнение, а не на обучение; выбор также сохраняет корневую связь с መከራ в заключительной фразе.
- source_word: ይግበሩ ጥበበ እኩየ
  choice: чтобы те применяли злую мудрость
  rationale: «Злая мудрость» сохраняет намеренный нравственный парадокс исходного текста, а «применяли» естественно передаёт действие или практическое осуществление такой мудрости.
- source_word: ኵሉ መካን ኢይትረከብ ላቲ
  choice: не найдётся для неё места
  rationale: Близко передаёт буквальное «место», оставляя открытым как пространственный смысл, так и переносные значения «простор» или «возможность».
- source_word: ኵሉ መከራ አያሐፅፅ
  choice: никакое искушение не ослабеет
  rationale: Сохраняет лексическую связь с предшествующим «искушать» и не конкретизирует сверх уверенности трудный заключительный глагол, который может обозначать уменьшение или сокращение.
theological_decisions:
- issue: Идёт ли речь просто о злом поведении или об извращённой форме мудрости
  choice: злая мудрость
  alternative: злое коварство
  rationale: 'Сохранение слова «мудрость» передаёт сапиенциальное напряжение текста: грешники склоняют людей не просто ко злу, а к нравственно извращённой «мудрости».'
- issue: Связь между действием грешников и заключительным существительным
  choice: искушать / искушение
  alternative: соблазнять / испытание
  rationale: Повтор однокоренных русских слов отражает вероятную лексическую связь форм ያሜክሮዎሙ и መከራ, не определяя заранее, является ли последнее искушением, испытанием или бедствием.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Синтаксис остаётся ясным для широкого читателя, но необычные образы «помыслы сердец» и «злая мудрость» сохранены ради смысловой и богословской напряжённости оригинала.
