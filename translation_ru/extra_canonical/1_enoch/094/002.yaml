base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/002.yaml
  text: And to wise men from a generation[a], the paths of violence and death will be revealed[b], and they will keep far from them and will not follow them.
translation:
  language: ru
  text: И некоторым людям из поколения[a] откроются пути насилия и смерти; они будут держаться от них подальше и не последуют за ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «некоторым людям из поколения». Иногда эту фразу понимают как «мудрым среди людей, из поколения в поколение», однако повторительное значение прямо не выражено в эфиопском тексте.'
    reason: Сочетание እሙራን እምትውልድ лексически и синтаксически неоднозначно; примечание сохраняет значимые варианты без внесения их в основной текст.
lexical_decisions:
- source_word: እሙራን
  choice: некоторым
  rationale: В сочетании с ሰብእ причастная форма может идиоматически обозначать «некоторые, определённые люди». Это чтение лучше учитывает морфологию и не вводит значение «мудрые», обычно выражаемое иным словом.
- source_word: ለሰብእ
  choice: людям
  rationale: 'Префикс ለ передаёт дательно-направительное отношение: пути откроются людям.'
- source_word: እምትውልድ
  choice: этого поколения
  rationale: Форма содержит единственное «поколение» и сама по себе не выражает повторения «из поколения в поколение». Русское «этого поколения» естественно передаёт принадлежность людей к поколению, хотя буквальная предложная связь допускает неясность.
- source_word: ይትከሠት
  choice: откроются
  rationale: Глагол означает стать явным, открыться; возвратная форма по-русски сохраняет смысл обнаружения без уточнения действующего лица.
- source_word: ፍኖዋተ
  choice: пути
  rationale: Сохраняется конкретный образ дорог или путей, употреблённый в нравственном смысле.
- source_word: ግፍዕ
  choice: насилия
  rationale: Слово охватывает насильственную несправедливость и притеснение; «насилие» сохраняет резкость исходного образа.
- source_word: ሞት
  choice: смерти
  rationale: Передано прямое основное значение без расширительного толкования.
- source_word: ይርኅቁ እምኔሆሙ
  choice: будут держаться от них вдали
  rationale: Выражает удаление и продолжающееся избегание названных путей.
- source_word: ኢይትለውዎሙ
  choice: не последуют за ними
  rationale: Сохраняет буквальный образ следования путям и его нравственный смысл.
theological_decisions:
- issue: Образ нравственных путей или отвлечённый этический пересказ
  choice: Сохранить «пути насилия и смерти»
  alternative: «насильственные и смертоносные поступки»
  rationale: Исходный текст использует конкретный образ путей. Его сохранение соответствует жанру премудростной апокалиптики и не добавляет причинной формулы вроде «ведущие к смерти».
- issue: Значение እሙራን
  choice: «некоторым людям»
  alternative: «мудрым людям»
  rationale: Форма допускает понимание «известные, определённые», откуда идиоматическое «некоторые»; перевод «мудрые» богословски окрашивает субъект и менее надёжно опирается на данную лексему.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис краток и ясен; сохранены образы «путей» и «следования». Местоимение «ними» однозначно соотносится с путями.
