base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/006.yaml
  text: Woe to those who build up unrighteousness and oppression[a], and who lay the foundation of deceit, for they will be swiftly overthrown[b], and they will have no peace.
translation:
  language: ru
  text: Горе тем, кто созидает неправедность и угнетение и закладывает основание обмана[a], ибо быстро будут они низвергнуты[b], и не будет им мира.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение в геэз несколько неясно. Возможны также переводы: «утверждают обман» или «основывают всё на обмане». Однако строительный образ, по-видимому, продолжается, а ጕሕሉት означает «обман» или «мошенничество».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «быстро будут разрушены»; этот вариант сильнее подчёркивает строительный образ.'
    reason: translation_ambiguity
lexical_decisions:
- source_word: አሌ
  choice: Горе
  rationale: Сохраняет формулу пророческого и апокалиптического осуждения, не смягчая её до простого сожаления.
- source_word: የሐንጽዋ
  choice: возводит
  rationale: Передаёт строительный образ и естественно сочетается с последующим упоминанием основания.
- source_word: ለዓመፃ
  choice: неправедность
  rationale: Сохраняет широкий нравственный и судебный смысл слова, не сужая его только до общественной несправедливости.
- source_word: ወለግፍዕ
  choice: угнетение
  rationale: Передаёт насильственное и принудительное зло, поставленное рядом с неправедностью.
- source_word: ወይሣርርዋ ለጕሕሉት
  choice: и закладывает основание обмана
  rationale: Сохраняет строительную метафору и передаёт ጕሕሉት как отвлечённое существительное «обман», а не как прилагательное.
- source_word: ፍጡነ
  choice: вскоре
  rationale: Естественно передаёт смысл скорого, близкого свершения суда в современном русском языке.
- source_word: ይትነሠቱ
  choice: они будут низвергнуты
  rationale: Передаёт пассивный характер суда и сохраняет связь с образом возведённого сооружения, которое рушится.
- source_word: ወአልቦሙ ሰላመ
  choice: и не будет им мира
  rationale: Краткая и весомая формула суда, близкая структуре оригинала и естественная для литературного русского языка.
theological_decisions:
- issue: Сохранять ли строительную образность или передать стих отвлечёнными нравственными понятиями
  choice: Сохранить образы возведения, основания и низвержения
  alternative: Передать общий смысл как осуждение тех, кто творит неправедность, угнетение и обман
  rationale: В оригинале строительная лексика организует весь стих, а последующее низвержение отвечает образу возведённого нечестивого строения. Сохранение этой напряжённой метафоры не вносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. «Горе», «неправедность» и «не будет им мира» сохраняют библейскую весомость, тогда как синтаксис остаётся понятным обычному читателю.
