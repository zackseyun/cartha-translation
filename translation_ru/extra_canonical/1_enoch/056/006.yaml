  to: И они поднимутся и пройдут по земле его избранных[b], и земля его избранных станет перед ними истоптанным местом и протоптанной тропой.[a]
  rationale: Сделаны две узкие лексико-стилистические правки в заключительном образе, чтобы сохранить конкретную картину земли, превращённой в истоптанный путь. В примечании b «взойдут» заменено на «поднимутся», поскольку последнее нейтральнее и естественнее для современного русского при сохранении значения восхождения. Смысл, синтаксическая структура, повтор и референциальная неопределённость местоимения не изменены.
  reviewer_model: gpt-5.6-terra
