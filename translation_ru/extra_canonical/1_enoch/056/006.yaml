    rationale: «Проторённая дорога» в русском обычно означает уже проложенную или устроенную дорогу и не обязательно путь, протоптанный ногами. «Протоптанная тропа» лучше сохраняет связь с предшествующим движением/попранием и соответствует осторожному пояснению английской аудиторской записи («beaten path»).
  - severity: low
