base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/006.yaml
  text: And they shall go up and tread upon the land of his chosen ones[b][a], and the land of his chosen ones shall become before them a trampled place and a beaten path.
translation:
  language: ru
  text: И они поднимутся и пройдут по земле его избранных[b], и земля его избранных станет перед ними истоптанным местом и протоптанной тропой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Формулировка на геэзском трудна. Последние два выражения, вероятно, усиливают один образ: земля становится истоптанным местом, подобным протоптанной тропе.'
    reason: textual_variant
  - marker: b
    text: 'Или: «поднимутся и двинутся по земле его избранных». Эти глаголы могут описывать как буквальное восхождение и ходьбу, так и военное наступление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: የዓርግዋ
  choice: поднимутся
  rationale: Глагол обозначает движение вверх; такой перевод сохраняет как буквальное восхождение, так и возможный оттенок военного наступления.
- source_word: ይከይድዋ
  choice: пройдут по
  rationale: Корень связан с ходьбой, движением и ступанием. Выражение естественно по-русски и сохраняет связь с последующим образом попранной земли, не усиливая глагол до однозначного «растопчут».
- source_word: ምድረ
  choice: земля
  rationale: В данном контексте речь идёт о территории избранных, а не обязательно обо всём мире; русское «земля» сохраняет оба пространственных оттенка.
- source_word: ኅሩያነ
  choice: избранные
  rationale: Устойчивое енохическое обозначение группы передано прозрачно и без привнесения поздней конфессиональной терминологии.
- source_word: ዚአሁ
  choice: его
  rationale: Сохранено местоимение оригинала без пояснения его антецедента; написание со строчной буквы не предрешает, к кому оно относится.
- source_word: በቅድሜሆሙ
  choice: перед ними
  rationale: 'Передаёт пространственный и ситуативный смысл: земля оказывается открытой перед наступающими.'
- source_word: ምካይደ
  choice: место попрания
  rationale: Существительное, вероятно, родственно предшествующему глаголу движения или ступания. Перевод сохраняет словесную связь и образ земли, истоптанной враждебным продвижением.
- source_word: አሰረ
  choice: проторённая дорога
  rationale: Слово, по-видимому, обозначает путь или колею; «проторённая дорога» конкретно передаёт результат многократного прохождения и поддерживает образ попрания.
theological_decisions:
- issue: К кому относится «его» в выражении «его избранных»
  choice: Сохранить местоимение «его», не называя его носителя.
  alternative: «избранных Бога» или «избранных Господа»
  rationale: В геэзском тексте стоит только местоимение. Подстановка имени или титула устранила бы сохраняющуюся в стихе референциальную неопределённость.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной апокалиптической интонацией. Местоимение «его» намеренно оставлено со строчной буквы, чтобы не устанавливать антецедент средствами русской религиозной орфографии. Повтор «земля его избранных» сохранён ради структуры и настойчивости оригинала.
