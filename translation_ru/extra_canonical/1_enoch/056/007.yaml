base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/007.yaml
  text: And the city of my righteous ones shall be a hindrance to their horses[a]; and they will stir up slaughter among themselves, and their right hand will be strong against them. And a man will not know his brother, nor a son his father or his mother, until the number of the corpses from their death is complete[d][c][b], and their punishment will not be in vain.
translation:
  language: ru
  text: И город моих праведников станет преградой для их коней[a]. Они поднимут резню между собой, и их правая рука окрепнет против них. Человек не узнает своего брата, и сын не узнает своего отца и своей матери[b], пока не исполнится число трупов от их гибели[c]; и кара их не будет напрасной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «помехой» либо «ловушкой для их коней»; эфиопское слово обозначает то, что преграждает путь, удерживает или захватывает.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «человек не будет знать своего брата»; глагол может также означать «узнавать».'
    reason: lexical_alternative
  - marker: c
    text: Выражение о «числе трупов от их гибели» в эфиопском тексте синтаксически и текстуально трудно; перевод сохраняет эту неясность, не сглаживая её.
    reason: textual_variant
lexical_decisions:
- source_word: ሀገረ፡ ጻድቃነ፡ ዚአየ
  choice: город Моих праведников
  rationale: 'ሀገር здесь передаёт конкретный образ города или поселения, а форма ዚአየ сохраняет первое лицо притяжательности: «Моих».'
- source_word: ማዕቀፈ
  choice: преградой
  rationale: Слово обозначает то, что удерживает, перекрывает путь или захватывает; «преграда» естественно передаёт широкий смысл, не сводя образ к буквальной ловушке.
- source_word: አፍራሲሆሙ
  choice: для их коней
  rationale: Передано буквально как «кони», а не интерпретирующее «конница», чтобы сохранить военный образ исходного текста.
- source_word: ወያነሥኡ፡ በበ፡ ቢይናቲሆሙ፡ ቀትለ
  choice: Они поднимут резню между собой
  rationale: Каузативный переходный глагол управляет существительным «резня»; взаимное выражение указывает на внутреннее кровопролитие.
- source_word: ወትጸንዕ፡ የማኖሙ፡ ዲቤሆሙ
  choice: их правая рука укрепится против них
  rationale: Сохранён семитский воинский образ правой руки как силы, а также неоднозначная соотнесённость местоимений.
- source_word: ወኢያእምር፡ ብእሲ፡ ለአኁሁ
  choice: Человек не узнает своего брата
  rationale: Глагол может означать как знание, так и узнавание; в сцене распада родственных связей русское «узнает» звучит естественно и сохраняет обе возможности.
- source_word: ወኢወልድ፡ ለአቡሁ፡ ወለእሙ
  choice: и сын — своего отца и матери
  rationale: Опущенный во второй части глагол восстанавливается из предыдущего предложения; краткая русская конструкция сохраняет сжатость оригинала.
- source_word: እስከ፡ ይከውን፡ ኍልቈ፡ አብድነት፡ እሞቶሙ
  choice: пока не исполнится число трупов от их гибели
  rationale: Формулировка намеренно сохраняет трудную связь между числом, трупами и гибелью, не устраняя текстовую неясность толкованием.
- source_word: ወመቅሰፍቶሙ፡ ኢትኩን፡ በከ
  choice: и кара их не будет напрасной
  rationale: «Кара» соответствует контексту суда, а заключительная формула утверждает действенность наказания без добавления конфессионального истолкования.
theological_decisions:
- issue: Притяжательное значение в выражении о праведниках
  choice: Сохранено «Моих праведников»
  alternative: «праведников» или «его праведников»
  rationale: Эфиопский текст содержит указание на первое лицо; его сохранение передаёт мотив принадлежности и защиты, не уточняя личность говорящего сверх контекста.
- issue: Характер описанного кровопролития
  choice: Взаимная резня между самими противниками
  alternative: Истребление внешним войском
  rationale: Взаимное выражение በበ ቢይናቲሆሙ и последующий распад родственных связей указывают на междоусобное насилие.
- issue: Образ правой руки
  choice: Сохранён буквально и с неоднозначными местоимениями
  alternative: «они одолеют друг друга»
  rationale: Более свободный вариант устранил бы напряжённость и местоименную неоднозначность апокалиптического образа.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Синтаксис преимущественно прямой и ясный; семитский образ «правой руки» и трудное заключительное количественное выражение сохранены там, где их сглаживание сузило бы смысл.
