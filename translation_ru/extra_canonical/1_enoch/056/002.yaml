base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/002.yaml
  text: And I asked the angel of peace who went with me, saying, “To whom are they going, these who hold the scourges?”
translation:
  language: ru
  text: 'И я спросил ангела мира, который шёл со мной: «К кому идут эти, держащие бичи[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «орудия наказания»; геэзское слово может обозначать как наказание, так и средство, которым его наносят.'
    reason: Сохраняется лексическая неоднозначность между самой карой и конкретным орудием кары.
lexical_decisions:
- source_word: ተስእልክዎ
  choice: я спросил
  rationale: Прямо и естественно передаёт глагол вопроса; объект вопроса выражен следующим словосочетанием.
- source_word: መልአክ ሰላም
  choice: ангела мира
  rationale: Сохраняет определительную конструкцию и устойчивое енохическое наименование, не превращая её в характеристику «мирный ангел».
- source_word: ዘየሐውር ምስሌየ
  choice: который шёл со мной
  rationale: Сохраняет относительное придаточное и движение сопровождающего Еноха ангела в видении.
- source_word: እንዘ እብል
  choice: двоеточие перед прямой речью
  rationale: Формула «говоря» естественно передана русским способом введения прямой речи без тяжеловесного буквального оборота.
- source_word: ለመኑ የሐውሩ
  choice: к кому идут
  rationale: Передаёт и направительное значение ለመኑ, и глагол движения የሐውሩ; вопрос касается адресата или цели движения, а не личности самих фигур.
- source_word: እሉ እለ
  choice: эти, что
  rationale: Сохраняет указательную силу «эти» и относительную конструкцию, указывающую на видимых в видении существ.
- source_word: ይአኅዙ
  choice: держат
  rationale: Нейтрально передаёт обладание предметами в руке, не уточняя, несут ли их или уже приготовили к применению.
- source_word: መቅሠፍተ
  choice: бичи
  rationale: Контекст с глаголом «держат» поддерживает конкретное, инструментальное значение; «бичи» сохраняет образ орудий наказания, не сводя его к абстрактной каре.
theological_decisions:
- issue: Конкретное или абстрактное значение መቅሠፍተ
  choice: 'конкретное: «бичи»'
  alternative: «наказания» или «орудия наказания»
  rationale: Поскольку эти предметы «держат», синтаксис склоняет к конкретному орудию наказания. Сноска сохраняет более широкую лексическую возможность и не делает апокалиптический образ излишне однозначным.
- issue: Содержание вопроса Еноха
  choice: 'вопрос о цели или адресате движения: «К кому идут…?»'
  alternative: 'вопрос о личности фигур: «Кто они?»'
  rationale: Форма ለመኑ имеет направительное значение, а የሐውሩ явно выражает движение; поэтому вопрос об их личности не соответствует исходному тексту.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным повествовательным строем. Необычная конструкция «эти, что…» намеренно сохраняет указательность видения, оставаясь понятной современному читателю.
