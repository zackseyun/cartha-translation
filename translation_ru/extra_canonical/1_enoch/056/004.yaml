base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/004.yaml
  text: And in those days that valley will be filled with the chosen and with their beloved ones[a], and the days of their lives will be ended[f][e][d][c][b], and the days of their wandering will no longer be counted from then on.
translation:
  language: ru
  text: И в те дни та долина наполнится избранными и теми, кто им дорог[a]; дни их жизни завершатся, а дни их блуждания[b] с тех пор уже не будут исчисляться[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «их возлюбленными». Вероятно, речь идёт о людях, близких избранным или связанных с ними; точный оттенок выражения неясен.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «заблуждения», «уклонения». Эфиопское слово может обозначать блуждание, ошибку или отступление.'
    reason: lexical_alternative
  - marker: c
    text: То есть «не будут считаться» или «не будут учитываться». Заключительная формулировка в эфиопском тексте необычна.
    reason: alternative_reading
lexical_decisions:
- source_word: እሜሃ
  choice: в те дни
  rationale: Сохраняет характерную для апокалиптической речи временную формулу и множественное число.
- source_word: ውእቱ ቈላ
  choice: та долина
  rationale: ቈላ имеет конкретное топографическое значение «долина» и продолжает образ долины в ближайшем контексте.
- source_word: ሕሩያን
  choice: избранные
  rationale: Передаёт устойчивое групповое обозначение в Притчах Еноха без привнесения поздней конфессиональной терминологии.
- source_word: ፍቁራነ ዚአሆሙ
  choice: те, кто им дорог
  rationale: Естественно по-русски выражает принадлежность и личную близость, сохраняя неопределённость относительно точного круга этих людей.
- source_word: ይትዌዳእ
  choice: завершатся
  rationale: Глагол от ወድአ означает окончание или завершение; он относится именно к дням их жизни и не должен сливаться с последующим глаголом.
- source_word: ዕለተ ስሕተቶሙ
  choice: дни их блуждания
  rationale: Сохраняет образное и нравственно-духовное значение слова, не сужая его до явно сформулированного греха; возможные значения отмечены в сноске.
- source_word: እምይእዜ ኢትትኌለቍ
  choice: с тех пор уже не будут исчисляться
  rationale: Передаёт временную формулу и значение счёта/исчисления, сохраняя несколько необычную формулировку источника.
theological_decisions:
- issue: Обозначение ሕሩያን в Притчах Еноха
  choice: избранные
  alternative: избранники
  rationale: «Избранные» сохраняет весомость группового наименования и соответствует современному литературному русскому, не уточняя основание или характер избрания.
- issue: Нравственный смысл ስሕት
  choice: блуждание
  alternative: заблуждение; уклонение; грех
  rationale: Источник допускает как образ пути, так и смысл ошибки или заблуждения. «Блуждание» удерживает эту широту и не превращает неоднозначное слово в однозначное богословское утверждение.
translation_notes:
  register: 'Современный литературный русский с торжественным апокалиптическим ритмом. Две заключительные части разведены точкой с запятой и союзом «а», чтобы ясно сохранить два разных сказуемых источника: завершение дней жизни и прекращение исчисления дней блуждания.'
