  text: And there I saw the angels of punishment going about[c][b][a], and they were holding scourges and chains of iron and bronze.
translation:
  language: ru
  text: И там я увидел ангелов наказания, которые ходили там; в руках у них были бичи и цепи из железа и бронзы.[a]
  philosophy: optimal-equivalence
  footnotes:
