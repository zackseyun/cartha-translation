    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ፡ በህየ
  choice: И там я увидел
  rationale: Сохраняет обычную формулу повествования о видении и указание на место, оставаясь естественным по-русски.
- source_word: ትዕይንታተ
  choice: не выражено отдельным словом
  rationale: 'В данном контексте форма трудна и в предоставленных материалах истолкована противоречиво: как указание на видение либо как «сонмы». Последнее понимание было снято последующей редакцией; отдельное добавление могло бы необоснованно расширить текст.'
- source_word: መላእክት፡ መቅሠፍት
  choice: ангелов наказания
  rationale: Генитивная конструкция обозначает ангелов, связанных с исполнением карательного суда; формулировка не превращает их ни в демонов, ни просто в разрушителей.
- source_word: እንዘ፡ የሐውሩ
  choice: ходивших вокруг
  rationale: Передаёт продолжающееся движение в пределах увиденной сцены без уточнения цели или способа передвижения.
- source_word: ወይአሕዙ
  choice: и в руках у них были
  rationale: Естественно передаёт продолженное состояние обладания орудиями в русской описательной речи.
- source_word: መቅሠፍተ፡ ወመማግረ
  choice: бичи и цепи
  rationale: Сохраняет порядок названных орудий согласно последней текстовой корректировке; точная идентификация терминов остаётся не вполне уверенной и отмечена в сноске.
- source_word: ሐጺን፡ ውብርት
  choice: из железа и бронзы
  rationale: Передаёт оба обозначения металла и не распределяет их между двумя предметами категоричнее, чем позволяет конструкция.
theological_decisions:
- issue: Характер ангельских фигур
  choice: ангелы наказания
  alternative: ангелы-губители; ангелы кары
  rationale: Выражение сохраняет судебно-апокалиптический смысл и не привносит позднейших демонологических представлений.
- issue: Распределение металлов между орудиями
  choice: бичи и цепи из железа и бронзы
  alternative: железные бичи и бронзовые цепи; бичи и железно-бронзовые цепи
  rationale: Синтаксическая привязка двух названий металла не вполне ясна; общее определение сохраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. «Бичи» сохраняет библейскую образность, а синтаксис остаётся понятным современному читателю.
