base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/005.yaml
  text: And in those days the angels will return and turn their heads toward the east[a], toward the people of Parthia and Media. They will stir up the kings, and a spirit of turmoil will come upon them; it will unsettle them from their thrones, and they will go out like lions from their lairs[c][b], and like hungry wolves in the midst of their pasture.
translation:
  language: ru
  text: И в те дни ангелы возвратятся и обратят головы к востоку, к людям Парфии и Мидии. Они приведут царей[a] в смятение, и дух смуты[b] сойдёт на них; он поколеблет их на престолах, и они выйдут, словно львы из своих логовищ и словно голодные волки среди своего пастбища.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Чтение этого места в переданном тексте затруднено. Вероятно, имеются в виду цари, поскольку далее говорится об их престолах.
    reason: textual_variant
  - marker: b
    text: 'Или: «дух замешательства». Выражение на языке геэз может обозначать силу или состояние беспорядка, не уточняя, является ли этот дух личным существом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይገብኡ መላእክት
  choice: ангелы возвратятся
  rationale: В данном исходном тексте употреблена простая глагольная форма со значением «возвращаться», а не возвратная форма со значением «собираться».
- source_word: ይወድዩ አርእስቲሆሙ
  choice: обратят головы
  rationale: Сохранён конкретный телесный образ исходного текста; выражение при этом естественно для литературного русского языка.
- source_word: ለኀበ ሰብአ ጳርቴ ወሙዴ
  choice: к людям Парфии и Мидии
  rationale: Передана явная отсылка к людям этих двух историко-географических областей без замены на менее буквальные этнонимы.
- source_word: የሐውክዎሙ
  choice: приведут … в смятение
  rationale: Глагол выражает причинение беспорядка, тревоги или смятения; русский оборот сохраняет каузативный смысл.
- source_word: ለዝንቱ
  choice: царей
  rationale: Чтение в переданной строке текстуально затруднено; восстановление «царей» поддерживается последующим упоминанием их престолов, но отмечено сноской.
- source_word: መንፈሰ ሀውክ
  choice: дух смуты
  rationale: Сочетание передаёт силу или состояние беспорядка, не определяя однозначно, идёт ли речь о личном духовном существе.
- source_word: እመንበረሆሙ
  choice: с престолов
  rationale: В контексте царей значение «престолы» точнее общего «сиденья» и сохраняет политико-царский образ.
- source_word: ከመ አናብስት እምስካባቲሆሙ
  choice: словно львы из своих логовищ
  rationale: «Логовища» естественно передаёт место пребывания хищников и сохраняет силу сравнения.
- source_word: ከመ አዝእብት ርኁባን
  choice: словно голодные волки
  rationale: Прямо сохранены образ волков и обозначение голода без усиления до «ненасытных» или «свирепых».
- source_word: ማእከለ መርዔት ዚአሆሙ
  choice: среди своего пастбища
  rationale: Сохранён образ пастбища; не добавлено отсутствующее в тексте прямое упоминание стад или овец.
theological_decisions:
- issue: Следует ли понимать መንፈሰ ሀውክ как личного духовного деятеля или как безличную силу беспорядка
  choice: дух смуты
  alternative: дух замешательства; смятение
  rationale: Строчная буква и отсутствие определяющего эпитета сохраняют возможность как личного, так и безличного понимания, не превращая выражение ни в именованного демона, ни в чистую абстракцию.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Синтаксис сделан ясным для широкого читателя; конкретные образы голов, престолов, львиных логовищ, голодных волков и пастбища сохранены.
