base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/003.yaml
  text: And he said to me[a], 'To their chosen ones and to their beloved ones[c][b], so that they may be cast into the chasm of the abyss of the valley.'
translation:
  language: ru
  text: 'И он сказал мне: «К их избранным и к их возлюбленным[a], чтобы их бросили в расселину бездны той долины[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Смысл оборота труден. «Их избранные» и «их возлюбленные» могут обозначать людей, связанных с участниками предшествующего видения, однако из одного этого стиха нельзя точно установить, о ком идёт речь.
    reason: alternative_reading
  - marker: b
    text: 'Или: «в расщелину глубины той долины». Эфиопский текст рисует зловещий топографический образ; точный оттенок слов «расселина» и «бездна» не вполне определён.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤለኒ
  choice: И он сказал мне
  rationale: Обычная повествовательная формула, вводящая разъяснение в видении; русский оборот сохраняет прямой характер речи.
- source_word: ለሕሩያነ፡ ዚአሆሙ
  choice: к их избранным
  rationale: Префикс ለ передаёт направление («к»), а ዚአሆሙ — притяжательное значение третьего лица множественного числа («их»), а не указательное «эти». Фраза естественно отвечает на вопрос о том, к кому направляются упомянутые ранее силы.
- source_word: ወለፍቁራኒሆሙ
  choice: и к их возлюбленным
  rationale: Сохранены и направительное «к», и притяжательное «их». «Возлюбленным» передаёт значение любви и привязанности в возвышенном, но понятном регистре, не уточняя характер отношений.
- source_word: ከመ፡ ይትወደዩ
  choice: чтобы их бросили
  rationale: Целевая конструкция и пассивное значение переданы естественным русским неопределённо-личным оборотом; он сохраняет неуказанность исполнителя действия.
- source_word: ውስተ፡ ንቅዐተ
  choice: в расселину
  rationale: Слово обозначает расщелину, трещину или зияющее отверстие. «Расселина» сохраняет топографический образ и звучит естественно в описании грозного ландшафта.
- source_word: ማዕምቅ
  choice: бездны
  rationale: «Бездна» передаёт образ неизмеримой глубины и его апокалиптическое звучание.
- source_word: ዘቈላ
  choice: той долины
  rationale: «Долина» — наиболее прямое топографическое соответствие; указательное «той» естественно связывает её с уже показанным местом видения.
theological_decisions:
- issue: Кого обозначают «их избранные» и «их возлюбленные»
  choice: Сохранить притяжательные обозначения, не отождествляя названные группы с праведными избранниками или с иной определённой группой.
  alternative: Истолковать их как привилегированных сторонников осуждаемых правителей либо как людей, особо избранных для наказания.
  rationale: Сам стих не называет референт однозначно. В данном контексте обозначения групп допускают напряжённое и непривычное прочтение, которое перевод не должен устранять богословским уточнением.
- issue: Кто будет брошен в бездну
  choice: Сохранить местоименное «их» без явного называния группы и не указывать исполнителя наказания.
  alternative: Назвать брошенными «избранных и возлюбленных» либо упомянутые ранее войска и прямо указать действующее лицо.
  rationale: Грамматическая связь с предшествующим контекстом остаётся трудной; добавление определённого субъекта или референта разрешило бы неоднозначность без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной апокалиптической образностью. Синтаксическая фрагментарность реплики сохранена, поскольку она, вероятно, отвечает на вопрос предыдущего стиха и отражает трудность исходного текста.
