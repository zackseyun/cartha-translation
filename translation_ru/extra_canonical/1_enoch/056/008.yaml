base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/008.yaml
  text: And in those days Sheol will open its mouth[a], and they will sink down into it; and destruction will pursue them[c][b]; Sheol will swallow up the sinners from before the face of the chosen ones.
translation:
  language: ru
  text: И в те дни шеол откроет свою пасть, и они погрузятся в него; погибель будет преследовать их, и шеол поглотит грешников, удалив их от лица избранных.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от лица избранных», то есть из их присутствия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: в те дни
  rationale: Сохраняет устойчивую апокалиптическую временную формулу и возвышенный регистр.
- source_word: ሲኦል፡ አፉሃ
  choice: шеол откроет свою пасть
  rationale: «Шеол» сохраняет древнее представление о персонифицированном мире мёртвых без позднейших ассоциаций слова «ад»; «пасть» естественно передаёт образ пожирающей бездны.
- source_word: ወይስጠሙ፡ ውስቴታ
  choice: и они погрузятся в него
  rationale: Передаёт направленное вниз движение и катастрофический образ, не добавляя идеи, будто субъектом действия уже здесь является шеол.
- source_word: ወትትሎሙ፡ ኀጕሎን
  choice: погибель будет преследовать их
  rationale: Сохраняет выраженное в геэз действие ትትሎሙ, а «преследовать» естественно и ярко передаёт следование погибели за ними.
- source_word: ሲኦል፡ ይውሕጦሙ
  choice: шеол поглотит
  rationale: Передаёт сильный глагол пожирания и поддерживает персонификацию шеола.
- source_word: ለኃጥኣን
  choice: грешников
  rationale: Прямой лексический эквивалент, не заменяющий обозначение людей толковательным «нечестивых».
- source_word: እምቅድመ፡ ገጸ፡ ኅሩያን
  choice: удалив их от лица избранных
  rationale: Сохраняет конкретную семитскую идиому «от лица», а деепричастная связь ясно передаёт смысл удаления грешников из присутствия избранных.
theological_decisions:
- issue: Передача ሲኦል
  choice: шеол
  alternative: ад; преисподняя; могила
  rationale: В стихе изображён персонифицированный космический мир мёртвых, открывающий пасть и поглощающий людей. Транслитерация не навязывает позднейшую доктрину об аде.
- issue: Передача ኅሩያን
  choice: избранные
  alternative: избранники
  rationale: «Избранные» ясно и нейтрально передаёт местный енохический термин, не насыщая его поздней конфессиональной терминологией.
- issue: Связь заключительной фразы
  choice: шеол поглотит грешников, удалив их от лица избранных
  alternative: шеол поглотит грешников пред лицом избранных
  rationale: Предлог እም обозначает движение «от», поэтому речь идёт об устранении грешников из присутствия избранных, а не о поглощении у них на глазах.
translation_notes:
  register: Современный литературный русский язык с торжественной апокалиптической образностью. Написание «шеол» со строчной буквы подчёркивает обозначение мира мёртвых, а не собственное имя; слова «пасть», «погибель» и «поглотит» сохраняют напряжённую персонификацию оригинала.
