base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/003.yaml
  text: Do not fear the sinners[a], O righteous ones, for again the Lord will deliver them into your hands[c][b], so that you may execute judgment upon them according to your pleasure.
translation:
  language: ru
  text: Не бойтесь грешников[a], праведники, ибо Господь вновь предаст их в ваши руки[b], чтобы вы совершили над ними суд по вашей воле[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Не бойтесь из-за грешников» либо «не страшитесь грешников». Предлог እም при глаголе страха допускает оттенок причины или источника страха.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «предать в руки» означает отдать под чью-либо власть или контроль.
    reason: cultural_note
  - marker: c
    text: 'Или: «как вам угодно», «по вашему желанию».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትፍርሁ
  choice: Не бойтесь
  rationale: Отрицательное повеление во множественном числе; прямой и естественный призыв, сохраняющий силу исходной формы.
- source_word: ጻድቃን
  choice: праведники
  rationale: Субстантивированное множественное число; в современном литературном русском «праведники» естественно обозначает праведных как особую группу адресатов.
- source_word: እምኃጥኣን
  choice: грешников
  rationale: При глаголе страха конструкция с እም допускает буквальное понимание «из-за грешников» или «перед грешниками», однако по-русски естественно сказать «бояться грешников».
- source_word: ካዕበ
  choice: вновь
  rationale: Передаёт повторность действия и одновременно поддерживает возвышенный повествовательный регистр.
- source_word: ያገብኦሙ
  choice: предаст их
  rationale: В сочетании с «в ваши руки» означает передачу под власть другого; «предаст» сохраняет судебно-апокалиптическую окраску контекста.
- source_word: ውስተ እዴክሙ
  choice: в ваши руки
  rationale: Сохранён наглядный исходный оборот, обозначающий передачу во власть или под контроль адресатов.
- source_word: ከመ ትግበሩ
  choice: чтобы вы совершили
  rationale: Целевая конструкция; с существительным «суд» глагол «совершить» звучит естественно и сохраняет активную роль праведников.
- source_word: ኵነኔ
  choice: суд
  rationale: 'Сохраняет судебную многозначность: речь может идти как о вынесении приговора, так и о его исполнении, без сведения значения только к наказанию.'
- source_word: በከመ ፈቀድክሙ
  choice: по вашей воле
  rationale: Передаёт действие в соответствии с волей или желанием праведников; формулировка возвышенная, но понятная современному читателю.
theological_decisions:
- issue: Участвуют ли праведники деятельно в суде над грешниками или лишь становятся свидетелями Божьего оправдания?
  choice: Праведники представлены как те, кто совершит суд над грешниками после того, как Господь предаст грешников в их руки.
  alternative: Праведники лишь увидят Божий суд либо получат власть над грешниками, не исполняя суда сами.
  rationale: Целевая конструкция «чтобы вы совершили… суд» вместе с оборотом «в ваши руки» указывает на деятельное участие праведников. Перевод сохраняет эту богословскую напряжённость и не смягчает её до одного лишь оправдания.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, апокалиптическим звучанием. Сохранены прямое обращение «праведники», судебная лексика и образ «в ваши руки»; синтаксис остаётся ясным для обычного современного читателя.
