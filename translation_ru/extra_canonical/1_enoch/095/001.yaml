base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/001.yaml
  text: Who will grant me that my eyes might become a cloud of water[a], so that I may weep over you and pour out my tears like a cloud of water[c][b], and find rest from the sorrow of my heart?
translation:
  language: ru
  text: Кто даст мне, чтобы глаза мои стали облаком воды[a], чтобы я плакал о вас[b], изливал свои слёзы подобно облаку воды и обрёл покой от скорби моего сердца?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дождевым облаком». Буквально: «облаком воды»; этот образ повторяется далее в стихе.'
    reason: lexical_alternative
  - marker: b
    text: Местоимение «вас» имеет форму множественного числа и в контексте, вероятно, относится к грешникам или нечестивым, к которым обращены окружающие предостережения.
    reason: cross_reference
  - marker: c
    text: 'Последнюю часть можно понять и как выражение результата: «…изливал свои слёзы подобно облаку воды и тогда обрёл бы покой от скорби моего сердца».'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: መኑ፡ ይሁበኒ
  choice: Кто даст мне
  rationale: 'Сохранены вопросительно-желательная форма и выраженный объект первого лица: говорящий не обращается к названному лицу, а высказывает скорбное желание.'
- source_word: ለአዕይንትየ
  choice: глаза мои
  rationale: Дательный оборот перед придаточным по-русски естественно передан как подлежащее следующей части; поэтическая инверсия «глаза мои» поддерживает возвышенный регистр.
- source_word: ከመ፡ ይኩና፡ ደመና፡ ማይ
  choice: чтобы глаза мои стали водяным облаком
  rationale: Необычный образ сохранён, а не сведён к обычному выражению «наполнились слезами». «Водяное облако» передаёт оба элемента эфиопского сочетания и допускает значение дождевого облака.
- source_word: እብኪ፡ ዲቤክሙ
  choice: чтобы я плакал о вас
  rationale: «О вас» сохраняет направленность плача на адресатов, не решая однозначно, выражает ли он жалость, оплакивание их участи или обличительную скорбь.
- source_word: እክዐው፡ አንብዐየ
  choice: изливал слёзы
  rationale: Глагольное сочетание описывает интенсивное истечение слёз; «изливал» сохраняет активность и поэтическую силу образа.
- source_word: ከመ፡ ደመና፡ ማይ
  choice: словно водяное облако
  rationale: Повтор исходного образа сохранён ради риторической связи с превращением глаз в облако.
- source_word: አዕርፍ
  choice: обрёл покой
  rationale: Передаёт буквальный образ покоя и одновременно допускает смысл облегчения от внутренней скорби.
- source_word: እምሐዘነ፡ ልብየ
  choice: от скорби моего сердца
  rationale: Сохранены как источник избавления, так и образ сердца; формулировка естественна для современной литературной русской речи торжественного регистра.
theological_decisions:
- issue: Следует ли сгладить образ глаз, становящихся «облаком воды»
  choice: Сохранить в основном тексте образ «водяного облака»
  alternative: 'Передать как «дождевое облако» либо парафразировать: «глаза, полные слёз»'
  rationale: 'Необычность принадлежит поэтике текста и может быть смысловой: глаза становятся источником обильных слёз. Парафраз устранил бы апокалиптическую образность, а «дождевое» несколько сильнее уточнило бы смысл.'
- issue: Отношение плача к адресатам
  choice: Передать нейтрально как «плакал о вас»
  alternative: «оплакивал вас» или «плакал над вами»
  rationale: Основной вариант сохраняет эмоциональную направленность, не утверждая окончательно ни сострадание к адресатам, ни оплакивание их гибели.
- issue: Синтаксическая связь трёх действий говорящего
  choice: Объединить «плакал… изливал… и обрёл» в одну зависимую цепочку
  alternative: 'Выделить последнее действие как следствие: «и тогда я обрёл бы покой»'
  rationale: Однородная цепочка лучше отражает последовательность исходных глагольных форм, но примечание сохраняет возможное восприятие покоя как последующего результата плача.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, плачевным звучанием. Сохранены инверсия «глаза мои», повтор облачного образа и сердечная скорбь; архаизмы и конфессионально окрашенные формулы не вводились.
