base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/002.yaml
  text: Who has allowed you to do hatred and evil? And condemnation will overtake you sinners[a][b].
translation:
  language: ru
  text: Кто позволил вам творить вражду и зло? И вас, грешников, настигнет осуждение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መኑ
  choice: Кто
  rationale: Сохраняет прямую силу риторического вопроса.
- source_word: ወሀበክሙ ከመ ትግበሩ
  choice: позволил вам творить
  rationale: Сочетание глагола «дать» с конструкцией ከመ естественно передаётся здесь как предоставление позволения; «творить» сохраняет возвышенный обличительный регистр.
- source_word: ጽልአ
  choice: вражду
  rationale: Слово обозначает ненависть, вражду или враждебность. «Вражду» можно естественно соединить с общим глаголом «творить», не ослабляя нравственного смысла.
- source_word: ወእኩየ
  choice: и зло
  rationale: Широкий нравственный термин передан без неоправданного сужения значения.
- source_word: ይረከበክሙ
  choice: вас … настигнет
  rationale: Глагол может означать «найти», «достичь», «настигнуть»; в контексте грядущего суда «настигнет» передаёт угрожающий смысл.
- source_word: ለኃጥኣን
  choice: вас, грешников
  rationale: Показатель ለ- здесь понят как аккузативный маркер при приложении к объектному суффиксу второго лица множественного числа, а не как датив «для грешников».
- source_word: ኵነኔ
  choice: осуждение
  rationale: В обличительном контексте речь идёт не о нейтральном разбирательстве, а о неблагоприятном судебном приговоре.
theological_decisions:
- issue: Передача судебного термина ኵነኔ
  choice: осуждение
  alternative: суд; приговор
  rationale: «Осуждение» сохраняет карательную направленность апокалиптического высказывания, не превращая его в общее упоминание суда.
- issue: Синтаксическая роль ለኃጥኣን
  choice: 'приложение: «вас, грешников»'
  alternative: «для грешников»
  rationale: В данном построении ለ- служит показателем объекта в приложении к уже выраженному местоименному объекту; поэтому русский текст прямо обращён к грешникам.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественно-обличительным звучанием. Порядок слов во втором предложении подчёркивает адресатов суда и сохраняет естественность русской фразы.
