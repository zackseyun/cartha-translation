base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/005.yaml
  text: Woe to you who repay evil to your neighbor, for you will be repaid according to your deeds.
translation:
  language: ru
  text: Горе вам, кто воздаёт ближнему злом, ибо вам будет воздано[a] по вашим делам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В обеих частях стиха употреблён один и тот же эфиопский глагольный корень: те, кто воздаёт ближнему злом, сами «будут вознаграждены» в смысле получат воздаяние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Горе вам
  rationale: Сохраняет силу пророческого возглашения суда; «увы» звучало бы преимущественно как скорбь, а не как обличение.
- source_word: ትፈድዩ … ትትፈደዩ
  choice: воздающим … будет воздано
  rationale: 'Повтор одного русского корня передаёт намеренную взаимность исходного текста: те, кто воздаёт злом, сами получат воздаяние.'
- source_word: እኩየ
  choice: злом
  rationale: Передаёт широкое нравственное значение, не сводя его только к физическому вреду.
- source_word: ለቢጽክሙ
  choice: ближнему
  rationale: Естественный библейский эквивалент для человека, состоящего с адресатом в межличностной и общественной связи.
- source_word: እስመ
  choice: ибо
  rationale: Ясно вводит основание провозглашённого горя и соответствует возвышенному, но понятному регистру.
- source_word: በከመ፡ ምግባሪክሙ
  choice: по вашим делам
  rationale: Передаёт меру воздаяния в соответствии с поступками и сохраняет конкретную лексику суда.
theological_decisions:
- issue: Кем совершается воздаяние
  choice: Безлично-пассивное «вам будет воздано» без называния действующего лица
  alternative: «Бог воздаст вам» либо представление о безличном последствии зла
  rationale: Исходный текст оставляет совершающего воздаяние неназванным. Пассивная формулировка сохраняет возможность подразумеваемого Божьего суда, не устраняя богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого изречения. Причастный оборот сохраняет краткость и торжественность, а повтор «воздающим — будет воздано» передаёт риторическую симметрию оригинала.
