base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/004.yaml
  text: Woe to you who pronounce curses that cannot be undone[c][b][a], and healing is far from you because of your sins.
translation:
  language: ru
  text: 'Горе вам, произносящим проклятия, которые нельзя снять: исцеление далеко от вас из-за ваших грехов.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Горе вам
  rationale: Пророческая формула обличения; естественно и весомо звучит в современном литературном русском.
- source_word: እለ፡ ታወግዙ፡ ግዘታተ
  choice: произносящим проклятия
  rationale: Глагол ታወግዙ и родственное ему существительное ግዘታተ указывают на наложение проклятий или анафем, а не на взвешивание серебра. «Проклятия» понятнее современному читателю, чем специальное «анафемы».
- source_word: ከመ፡ እ ይትፈትሑ
  choice: которых нельзя снять
  rationale: При вероятном чтении отрицательной частицы с пассивной формой ፈትሐ выражение означает невозможность развязать, разрешить или снять наложенные проклятия. Русское «снять проклятие» сохраняет образ и звучит естественно.
- source_word: ወፈውስ
  choice: исцеление
  rationale: Слово обозначает исцеление или средство исцеления и может иметь как телесный, так и восстановительный смысл.
- source_word: ርኁቅ፡ እምኔክሙ
  choice: далеко от вас
  rationale: Сохранена пространственная метафора удалённости исцеления.
- source_word: በእንተ፡ ኃጢአተ፡ ዚአክሙ
  choice: из-за ваших грехов
  rationale: Прямая причинная конструкция, объясняющая, почему исцеление остаётся недоступным.
theological_decisions:
- issue: Следует ли передавать ግዘታተ специальным церковным термином «анафемы»
  choice: проклятия
  alternative: анафемы; клятвы
  rationale: «Проклятия» передаёт силу осуждающего речевого акта без привнесения позднейшего узкотехнического церковного смысла; возможная связь с клятвенным связыванием отмечена в примечании.
- issue: Смысл образа ፈትሐ
  choice: которых нельзя снять
  alternative: которые нельзя разрешить; которые нельзя развязать
  rationale: Формулировка сохраняет идею необратимости или неразрешимости наложенного проклятия и при этом естественна по-русски.
translation_notes:
  register: 'Современный литературный русский с пророческой торжественностью. Двоеточие подчёркивает следствие: из-за таких грехов исцеление остаётся далеко. Формулировка избегает специальной конфессиональной терминологии, а неоднозначность между проклятием, анафемой и клятвенным связыванием вынесена в примечание.'
