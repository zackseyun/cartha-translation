  source_fidelity: 'Основной смысл передан верно: ታወግዙ ግዘታተ относится к произнесению/наложению проклятий (возможны оттенки анафемы или связывающей клятвы), а вероятное чтение с отрицанием в ኢይትፈትሑ означает, что их нельзя снять или разрешить. «Исцеление далеко от вас из-за ваших грехов» точно передаёт заключительную причинную часть.'
