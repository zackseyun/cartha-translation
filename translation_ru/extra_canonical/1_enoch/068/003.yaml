base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/003.yaml
  text: And Mikael answered again and said to Rufael, "Who is he whose heart is not softened concerning it, and whose kidneys are not troubled by this word of severity and the sentence that has gone out against them because of those who brought them out thus?"
translation:
  language: ru
  text: 'И Микаэл снова ответил и сказал Руфаэлу: «Кто тот, чьё сердце не смягчится из-за этого и чьи почки[a] не содрогнутся от этого сурового слова и приговора, вынесенного против них из-за тех, кто вывел их таким образом?[b]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «почки». В древней семитской образности почки считались средоточием глубочайших чувств и внутренних переживаний.'
    reason: lexical_alternative
  - marker: b
    text: Конец стиха в эфиопском тексте труден и содержит неуверенно засвидетельствованное слово. Возможны и другие понимания этой фразы.
    reason: textual_variant
lexical_decisions:
- source_word: አውሥአ፡ ካዕበ
  choice: снова ответил
  rationale: Передаёт повторность, выраженную ካዕበ, естественной русской повествовательной формулой.
- source_word: ሚካኤል፡ ለሩፋኤል
  choice: Микаэл … Руфаэлу
  rationale: Сохраняет формы имён, близкие к эфиопскому тексту, не заменяя их привычными русскими библейскими формами.
- source_word: ዘኢይረክሕ፡ ልቡ፡ ዲቤሃ
  choice: кто не смягчится сердцем из-за этого
  rationale: Сохраняет конкретный образ смягчающегося сердца и осторожно передаёт не вполне ясную местоименную отсылку.
- source_word: ወኢይትሀወክ፡ ኵልያቲሁ
  choice: чьи почки не содрогнутся
  rationale: Буквально сохраняет древний телесный образ почек как средоточия внутренних переживаний; глагол передан как сильное внутреннее потрясение.
- source_word: ቃለ፡ ጽነኒ
  choice: сурового слова
  rationale: Естественно по-русски передаёт строгость и тяжесть произнесённого слова, не превращая его без необходимости в формальный указ.
- source_word: ወፅእት፡ ዲቤሆሙ
  choice: приговора, вынесенного им
  rationale: Передаёт судебный оттенок исходящего или объявленного решения и направленность против упомянутых лиц.
- source_word: '[እምኔሆሙ፡] ዘአውፅእዎሙ፡ ከመ''ዝ'
  choice: из-за тех, кто довёл их до такого
  rationale: Сохраняет относительное предложение и возможное причинное значение እም, но отмечает текстовую трудность в сноске.
theological_decisions:
- issue: Телесная образность сердца и почек
  choice: Сохранить оба телесных образа
  alternative: 'Передать абстрактно: «чья душа не будет тронута и чья внутренность не встревожится»'
  rationale: Источник выражает нравственно-эмоциональную реакцию посредством древней антропологической образности; её устранение обеднило бы смысл и стиль.
- issue: Характер исходящего решения
  choice: «приговор»
  alternative: «суд» или «указ»
  rationale: «Приговор» сохраняет судебно-апокалиптический оттенок, не уточняя, кто именно его произносит, сверх данных текста.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптической речи. Синтаксис слегка возвышенный, но понятный; древняя телесная образность сохранена, а текстовая неопределённость заключительной фразы не скрыта.
