  text: Because of this[b][a], everything hidden forever shall come upon them.
translation:
  language: ru
  text: По этой причине всё сокрытое навеки[a] постигнет их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё сокрытое постигнет их навеки». Последнее выражение может также иметь смысл «на век» или «издревле».'
    reason: Синтаксическая связь и временной оттенок ለዓለመ неоднозначны.
lexical_decisions:
- source_word: በእንተ'ዝ
  choice: По этой причине
  rationale: Передаёт явное причинное значение оборота и естественно связывает приговор с предшествующим контекстом.
- source_word: ይመጽእ
  choice: постигнет
  rationale: Буквально глагол означает «придёт», однако в сочетании с направлением «на них» русское «постигнет их» естественно сохраняет зловещий судебный оттенок, не уточняя природу грядущего.
- source_word: ላዕሌሆሙ
  choice: их
  rationale: В составе выражения «постигнет их» передаёт направленность действия «на них» без добавления более сильного значения «против них».
- source_word: ኵሉ ዘኅቡእ
  choice: всё сокрытое
  rationale: Сохраняет всеохватность ኵሉ и относительное значение «то, что сокрыто», не определяя, идёт ли речь о тайнах, делах или приготовленном суде.
- source_word: ለዓለመ
  choice: навеки
  rationale: Передаёт основное значение длительности, но его синтаксическая связь и оттенок — вечность, век или древность — остаются неоднозначными и отмечены в сноске.
theological_decisions:
- issue: Означает ли фраза раскрытие сокрытого или пришествие сокрытой кары
  choice: Сохранено прямое утверждение, что сокрытое «постигнет их».
  alternative: «Сокрытое откроется против них».
  rationale: В геэзском тексте стоит глагол «прийти» с направлением «на них», а не глагол раскрытия. Поэтому перевод не сводит образ ни к обнаружению тайн, ни исключительно к каре.
- issue: К чему относится ለዓለመ — к сокрытому или к тому, что оно постигнет их
  choice: 'В основном тексте выражение связано с «сокрытым»: «сокрытое навеки».'
  alternative: «Всё сокрытое постигнет их навеки».
  rationale: Конечная позиция оборота допускает обе связи; основной вариант следует наиболее вероятному смысловому сочетанию, а альтернативная синтаксическая связь сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. «Постигнет их» звучит естественнее буквального «придёт на них» и сохраняет судебную угрозу, не вводя конкретного толкования сокрытого.
