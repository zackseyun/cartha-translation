base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/002.yaml
  text: And on that day Michael answered[a], saying to Raphael, “The power of the spirit seizes me and provokes me to anger because of the severity of the judgment concerning the hidden secrets. Who is there that can endure the severe judgment that has been executed[c][b], and before which they melt away?”
translation:
  language: ru
  text: 'И в тот день Михаил ответил и сказал Рафаилу: «Сила духа овладевает мной и приводит меня в негодование[c] из-за суровости суда, касающегося сокрытых тайн[a]. Кто способен вынести этот суровый суд, который уже был приведён в исполнение[b] и перед которым они тают?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфиопский текст этой части стиха труден. Более буквально её можно понять как указание на нечто страшное «для слуха», относящееся к сокрытому.
    reason: textual_variant
  - marker: b
    text: 'Возможно также: «Кто способен вынести то страшное, что было совершено?» Формулировка может относиться либо к самому суду, либо к его раскрытию.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально также возможно: «вызывает во мне гнев» или «понуждает меня негодовать».'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ
  choice: ответил
  rationale: Обычный повествовательный глагол ответа; последующее «и сказал» сохраняет конструкцию исходного текста.
- source_word: ኀይሉ ለመንፈስ
  choice: сила духа
  rationale: Передаёт активную, овладевающую Михаилом силу, не отождествляя дух прямо со Святым Духом.
- source_word: ይመሥጠኒ
  choice: овладевает мной
  rationale: Сохраняет значение сильного захвата или внутреннего принуждения и звучит естественно по-русски.
- source_word: ያምዕዐኒ
  choice: приводит меня в негодование
  rationale: Передаёт каузативное значение глагола, связанного с гневом или негодованием, а не только с побуждением к действию.
- source_word: ዕፁቡ
  choice: суровость / суровый
  rationale: Слово обозначает нечто тяжкое, страшное или суровое; в основном тексте выбран судебный оттенок, соответствующий контексту.
- source_word: እንተ ኅቡኣት
  choice: сокрытые тайны
  rationale: Сохраняет апокалиптический образ сокрытых предметов откровения, не уточняя их содержание.
- source_word: ተዐግሦተ
  choice: вынести
  rationale: Естественно передаёт способность устоять под тяжестью чего-либо подавляющего.
- source_word: ተገብረት
  choice: уже свершился
  rationale: Передаёт совершённость действия и возможный судебный смысл, не сводя выражение к чисто техническому «исполнен».
- source_word: ይትመሰዉ
  choice: они тают
  rationale: Сохраняет яркий образ исчезновения или растворения перед лицом грозного суда.
theological_decisions:
- issue: Следует ли понимать መንፈስ как Святого Духа
  choice: дух со строчной буквы
  alternative: Дух с прописной буквы
  rationale: Исходная формулировка говорит о действующей духовной силе, но сама по себе не требует отождествления со Святым Духом.
- issue: Обозначает ли трудная фраза суровый суд или страшное для слуха известие
  choice: суровость суда над сокрытыми тайнами
  alternative: страшное для слуха известие о сокрытом
  rationale: Судебное прочтение связно в контексте последующего риторического вопроса, однако буквальные элементы текста допускают понимание, связанное со слухом; оно сохранено в примечании.
- issue: Что именно уже совершилось
  choice: суровый суд
  alternative: страшное событие или откровение о нём
  rationale: Синтаксис допускает отнесение совершённого как к суду, так и шире к страшному делу; основной текст следует ближайшему контексту, а примечание сохраняет альтернативу.
translation_notes:
  register: 'Современный литературный русский язык с торжественным, но понятным апокалиптическим звучанием. Имена переданы в общепринятой русской форме: Михаил и Рафаил. Неясный референт местоимения «они» сохранён, чтобы не вносить отсутствующее в источнике уточнение.'
