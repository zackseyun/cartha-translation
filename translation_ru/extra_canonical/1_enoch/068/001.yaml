base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/001.yaml
  text: And after this my grandfather Hēnok gave me the sign of all the hidden things in a book[a], and the parables that had been given to him[c][b]; and they shall recount them to me in the account of the book of the Parable.
translation:
  language: ru
  text: И после этого мой дед Енох дал мне в книге знак всего сокрытого[a] и притчи[b], которые были даны ему; и они изложат мне их в повествовании книги Притчи[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфиопский текст этой строки местами труден; перевод сохраняет её необычное построение, не сглаживая неясности.
    reason: textual_difficulty
  - marker: b
    text: 'Или: «подобия».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально возможны также передачи: «в слове (или деле) книги Притчи». Единственное число следует форме сохранившегося эфиопского текста.'
    reason: lexical_and_textual_ambiguity
lexical_decisions:
- source_word: ትእምርተ
  choice: знак
  rationale: Сохраняет основное значение «знак, знамение, указание» и апокалиптический оттенок, не подменяя его более толковательным словом «объяснение».
- source_word: ኵሎሙ ኅቡኣት
  choice: всего сокрытого
  rationale: Передаёт совокупность скрытых предметов откровения без привнесения технического богословского термина «тайны».
- source_word: በመጽሐፍ
  choice: в книге
  rationale: Предлог естественно указывает на книгу как место письменной передачи; неопределённость исходной формы в русском языке отдельно не маркируется.
- source_word: እምሔውየ ሄኖክ
  choice: мой праотец Енох
  rationale: እምሔውየ понимается как единое существительное с притяжательным суффиксом — «мой дед/предок», а не как «из слов». «Праотец» естественно обозначает предка более раннего поколения.
- source_word: ምሳሌያተ
  choice: притчи
  rationale: Обычное и понятное русское соответствие; возможное «подобия» отмечено в сноске.
- source_word: ተውህበ ሎቱ
  choice: были даны ему
  rationale: Сохраняет пассивную форму и не уточняет, кем именно они были даны.
- source_word: ይመርሙ ሊተ
  choice: они изложат мне их
  rationale: Сохраняет множественное число неясного субъекта и передаёт трудный глагол без чрезмерного уточнения в сторону истолкования.
- source_word: ነገረ መጽሐፍ ዘምሳሌ
  choice: в повествовании книги Притчи
  rationale: «Повествование» соответствует литературному значению ነገር; единственное число «Притчи» следует форме данного свидетеля.
theological_decisions:
- issue: Передача сокрытого содержания как «сокрытого» или как технических «тайн»
  choice: всего сокрытого
  alternative: всех тайн
  rationale: Эфиопский текст говорит о скрытых предметах откровения, но не требует позднейшего или технического богословского термина.
- issue: Неуказанный деятель в выражении «были даны ему»
  choice: сохранить пассив без уточнения деятеля
  alternative: были даны ему Богом
  rationale: Источник не называет деятеля прямо, поэтому перевод не добавляет богословски вероятное, но отсутствующее уточнение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим регистром. «Праотец» выбран вместо буквального «дед», поскольку Енох выступает более далёким предком рассказчика; синтаксическая и смысловая неясность последней части намеренно сохранена.
