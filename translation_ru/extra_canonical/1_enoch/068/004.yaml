revisions:
- from: 'И было, когда он предстал перед Господом духов, Михаил сказал Рафаилу: «Он не будет на их стороне пред очами Господа[a], ибо Господь духов гневается на них, потому что они поступают так, словно сами они — Господь».[b]'
  to: 'И было: когда он предстал перед Господом духов, Михаил сказал Рафаилу: «Он не будет на их стороне пред очами Господа[a]. Господь духов гневается на них, ведь они поступают так, будто сами они — Господь».[b]'
  rationale: 'Исправлена связь между отказом в поддержке и гневом Господа духов: гнев представлен как мотивированный поступками осуждаемых, без приписывания его неназванному «он». Сохранены неопределённость референта, образ «пред очами Господа», божественный титул и отмеченная в сноске лексическая альтернатива.'
