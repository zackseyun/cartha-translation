base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/004.yaml
  text: 'And it came to pass[a], when he stood before the Lord of Spirits, that Michael said this to Raphael: “He will not be for them before the eye of the Lord, for the Lord of Spirits is angry with them[c][b], because they act as if they were the Lord.”'
translation:
  language: ru
  text: 'И было: когда он предстал перед Господом духов, Михаил сказал Рафаилу: «Он не будет на их стороне пред очами Господа[a]. Господь духов гневается на них, ведь они поступают так, будто сами они — Господь».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не будет для них пред оком Господа». Смысл, вероятно, в том, что он не встанет на их сторону перед Господом; к кому относится местоимение «он», в этом стихе не уточняется.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ведут себя как владыки». Краткое выражение может указывать на присвоение ими власти, которая им не принадлежит.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኮነ፡ ሶበ፡
  choice: И было, когда
  rationale: Сохраняет повествовательную формулу и временную связь, не прибегая к излишне архаичному «и случилось».
- source_word: ቆመ፡ በቅድመ፡ እግዚአ፡ መናፍስት፡
  choice: он предстал перед Господом духов
  rationale: Глагол буквально связан со стоянием, но в судебно-небесной сцене «предстал» естественно передаёт нахождение перед лицом Владыки; титул сохранён единообразно.
- source_word: ወከመ'ዝ፡ ይቤሎ፡ ሚካኤል፡ ለሩፋኤል፡
  choice: Михаил сказал Рафаилу
  rationale: Естественная русская вводная формула речи; указательное «так/это» не выражено отдельно, поскольку его функцию выполняет последующая прямая речь.
- source_word: ወኢይከውን፡ ሎሙ፡ በውስተ፡ ዓይነ፡ እግዚአ፡
  choice: Он не будет на их стороне пред очами Господа
  rationale: 'Идиома ይከውን ሎሙ передана как «будет на их стороне»: это естественно выражает поддержку, не вводя более узкого понятия ходатайства. Неясный референт местоимения «он» сохранён. Образ «пред очами Господа» удерживает исходную зрительную и судебную образность.'
- source_word: ተምዕዖሙ፡
  choice: гневается на них
  rationale: Прямо и понятно передаёт направленный на них гнев Господа духов.
- source_word: እምሳለ፡ እግዚአ፡ ይገብሩ።
  choice: они поступают так, словно сами они — Господь
  rationale: Передаёт обвинение в присвоении божественного положения, сохраняя при этом возможность менее определённого понимания, отмеченного в сноске.
theological_decisions:
- issue: Референт местоимения третьего лица единственного числа в словах Михаила
  choice: Сохранить «Он», не называя того, к кому относится местоимение.
  alternative: «Я не буду на их стороне» или пояснительное «Он не станет за них ходатайствовать».
  rationale: В представленном геэзском тексте стоит форма третьего лица, но её антецедент в самом стихе не назван. Уточнение личности или функции разрешило бы подлинную текстовую неоднозначность.
- issue: Характер проступка осуждаемых
  choice: «поступают так, словно сами они — Господь»
  alternative: «ведут себя как владыки».
  rationale: Единственное число «Господь» лучше сохраняет непосредственную отсылку к божественному титулу и серьёзность обвинения, тогда как альтернативное понимание возможно из-за краткости выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Формы «пред очами» сохранены ради образности и судебно-виденческого тона; синтаксис сделан понятным современному читателю. Все смысловые неопределённости, существенные для толкования, оставлены в тексте или обозначены в сносках.
