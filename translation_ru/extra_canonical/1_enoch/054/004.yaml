base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/004.yaml
  text: And I asked the angel of peace who went with me[a], saying[b], “These chains of the instruments—for whom are they being prepared?”
translation:
  language: ru
  text: 'И я спросил ангела мира, который шёл со мной: «Для кого готовят эти цепи орудий[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Слово, переданное как «орудия», в этом свидетеле читается и понимается неуверенно; возможно, имеются в виду приспособления, связанные с наказанием. Возможно также: «оковы» или «узы» вместо «цепи».'
    reason: textual_variant; lexical_alternative
lexical_decisions:
- source_word: ተስእእክዎ
  choice: я спросил
  rationale: Глагол вводит прямой вопрос Еноха; «спросил» естественно передаёт действие, не добавляя оттенков допроса или настойчивого расспрашивания.
- source_word: መልአከ ሰላም
  choice: ангела мира
  rationale: Сохранено характерное для повествования титульное сочетание; «мира» передаёт ሰላም, не сводя выражение к качественной характеристике «мирный».
- source_word: ዘየሐውር ምስሌየ
  choice: который шёл со мной
  rationale: Относительное предложение прямо обозначает сопровождающего Еноха ангела и сохраняет движение в сцене видения.
- source_word: እሉ እስረተ
  choice: эти цепи
  rationale: Конкретное «цепи» соответствует зримому образу оков в контексте суда; возможны также «оковы» или «узы».
- source_word: መበልዕት
  choice: орудия
  rationale: Чтение и точное значение слова в данном свидетеле неясны. «Орудия» достаточно широко обозначает предметы или приспособления, вероятно связанные с наказанием; пояснительное тире сохраняет слово, не создавая в русском неестественного сочетания «цепи орудий».
- source_word: ለመኑ ይዴለዉ
  choice: для кого готовят
  rationale: Фраза спрашивает, кому предназначены увиденные предметы. Русская неопределённо-личная конструкция естественно передаёт пассивно-предназначительный смысл.
theological_decisions:
- issue: Характер карательных предметов в видении
  choice: Сохранить конкретные образы «цепей» и «орудий», не заменяя их общим понятием наказания.
  alternative: «цепи наказания» или «узы для суда»
  rationale: Вопрос относится к видимым предметам и их будущим получателям. Конкретность поддерживает апокалиптическую образность и не вносит отсутствующего в тексте богословского обобщения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок вопроса сделан естественным для русского; спорное слово сохранено как поясняющее приложение, а неопределённость вынесена в примечание.
