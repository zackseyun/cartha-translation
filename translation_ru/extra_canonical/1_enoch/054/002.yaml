base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/002.yaml
  text: And they shall bring the kings and the mighty[a], and cast them into that deep valley.
translation:
  language: ru
  text: И приведут[a] царей и могущественных и бросят их в ту глубокую долину.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В этом стихе действующие лица не названы; формы множественного числа, вероятно, относятся к ранее упомянутым участникам видения — возможно, к ангельским служителям.
    reason: Сохранение неоднозначности неназванного субъекта.
lexical_decisions:
- source_word: እምጽእዎሙ
  choice: приведут
  rationale: Форма передаёт действие неопределённого множественного субъекта со значением «принести» или «привести». В контексте людей и сцены суда естественно русское «приведут».
- source_word: ለነገሥት
  choice: царей
  rationale: Обычное геэзское обозначение царей или правителей; определённость следует из контекста видения.
- source_word: ወለኃያላን
  choice: и сильных
  rationale: Слово обозначает сильных или могущественных. «Сильных» сохраняет краткость, возвышенный регистр и возможный социально-политический оттенок.
- source_word: ይውድ ይዎሙ
  choice: бросят их
  rationale: Выражение указывает на насильственное низвержение или помещение в место суда; «бросят» ясно и естественно передаёт силу действия.
- source_word: ውስተ
  choice: в
  rationale: Предлог при глаголе движения выражает направление внутрь; в русском конструкция «бросят в долину» однозначно передаёт это значение.
- source_word: ዝኩ
  choice: ту
  rationale: Указательное слово отсылает к месту, ранее показанному в видении; «ту» сохраняет эту отсылку.
- source_word: ዕሙቅ
  choice: глубокую
  rationale: Прямо передаёт признак глубины без добавления образа бездны, которого само слово не требует.
- source_word: ቈላ
  choice: долину
  rationale: Существительное обозначает долину или низменное углубление; «долина» наиболее естественно и нейтрально сохраняет пространственный образ.
theological_decisions:
- issue: Кто совершает действие
  choice: Не называть действующих лиц, передав неопределённый множественный субъект формами «приведут» и «бросят»
  alternative: «Ангелы приведут» или «служители приведут»
  rationale: В геэзском тексте субъект в этом стихе прямо не назван. Контекст может подразумевать ангельских исполнителей суда, однако уточнять это в основном тексте означало бы устранить подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис краткий и торжественный, без архаизмов и конфессионально обусловленных уточнений.
