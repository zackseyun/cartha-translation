  rationale: 'Форма от глагола со значением «соединять, объединять, прибавлять» передаёт будущее или последующее действие во множественном числе с пассивно-возвратным оттенком: «будут соединены / соединятся». Русское «соединятся вместе» естественно выражает объединение нескольких предметов, хотя «вместе» отчасти избыточно.'
