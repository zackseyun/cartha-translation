- source_word: እቶን ዘይነድድ
  choice: пылающую печь
  rationale: Естественно и образно передаёт буквальную картину горящей печи в современном русском языке.
- source_word: ይወድይዎሙ
  choice: бросят их
  rationale: Передаёт карательное низвержение в печь ясно и без ненужной архаизации.
- source_word: ይትበቀል
  choice: отомстил им
  rationale: Сохраняет выраженную в глаголе идею воздаяния, не смягчая её до общего «наказал».
- source_word: በዓመፃሆሙ
  choice: за их беззаконие
  rationale: Передаёт нравственно-судебную тяжесть мятежного преступления.
- source_word: ላእከ ሰሰይጣን
  choice: служителями сатаны
  rationale: Сохраняет вероятный смысл принадлежности и служения, не усиливая его до рабского статуса и не выбирая менее вероятное «вестники».
- source_word: አስኀትዎሙ
  choice: ввели в заблуждение
  rationale: 'Передаёт каузативный смысл: они заставили других заблуждаться или сбили их с верного пути.'
- source_word: እለ የኀድሩ ዲበ የብስ
  choice: живущих на суше
  rationale: Сохраняет конкретный космологический образ суши, а не сглаживает его до общего «на земле».
theological_decisions:
- issue: Следует ли смягчать образы возмездия и огненной печи
  choice: Сохранены прямые слова об отмщении и пылающей печи.
  alternative: Передать их обобщённо как наказание или суд.
  rationale: Это явная апокалиптическая речь о суде; смягчение устранило бы присущее тексту богословское напряжение.
- issue: Как передать отношение осуждаемых к сатане
  choice: «стали служителями сатаны»
  alternative: «стали рабами сатаны» или «стали вестниками сатаны»
  rationale: Выбранный вариант выражает нравственную принадлежность и служение, не навязывая более узкого понимания спорного выражения.
