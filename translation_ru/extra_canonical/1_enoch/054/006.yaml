base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/006.yaml
  text: And Michael and Gabriel and Raphael and Phanuel—they will seize them on that great day and cast them into the burning furnace on that day[a], so that the Lord of Spirits may take vengeance on them for their lawlessness[c][b], because they became servants of Satan and led astray those who dwell upon the dry land.
translation:
  language: ru
  text: И Михаил, Гавриил, Рафаил и Фануил в тот великий день схватят их[a] и в тот же день бросят их в пылающую печь, чтобы Господь духов отомстил им за их беззаконие, ибо они стали служителями Сатаны[b] и ввели в заблуждение живущих на суше[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возьмут их силой». Глагол указывает на решительное, насильственное овладение ими; точный оттенок в этом месте, сохранившемся на языке геэз, не вполне ясен.'
    reason: lexical_alternative
  - marker: b
    text: Выражение, переданное как «служителями Сатаны», текстуально и лексически трудно; возможны также варианты «рабами Сатаны» или, менее вероятно, «вестниками Сатаны».
    reason: textual_variant
  - marker: c
    text: 'Буквально: «живущих на суше». Возможно, имеются в виду просто жители земли, но конкретный образ оригинала сохранён.'
    reason: lexical_alternative
lexical_decisions:
