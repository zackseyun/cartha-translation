base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/007.yaml
  text: And in those days the punishment from the Lord of Spirits will come[b][a], and all the storehouses of the waters that are above the heavens [and the fountains that are beneath the heavens] and those beneath the earth will be opened.
translation:
  language: ru
  text: И в те дни придёт наказание от Господа духов, и откроются все хранилища вод, что над небесами, [и источники, что под небесами], и источники, что под землёй.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዋዕል
  choice: дни
  rationale: В сочетании с በውእቱ образует характерную апокалиптическую формулу «в те дни».
- source_word: መቅሠፍቱ
  choice: кара
  rationale: Передаёт судебно-карательный смысл и сохраняет возвышенный, но понятный современному читателю регистр, не уточняя способ наказания.
- source_word: እግዚአ መናፍስት
  choice: Господь духов
  rationale: Сохраняет отличительный титул из Притч Еноха без добавления определённости, которой русский язык грамматически не требует.
- source_word: ታርሑ
  choice: откроются
  rationale: Естественно соответствует образу раскрываемых космических хранилищ и источников; будущее время определяется формулой грядущего суда.
- source_word: መዛግብተ
  choice: хранилища
  rationale: Передаёт представление о небесных запасах вод и звучит яснее для современного читателя, чем «сокровищницы».
- source_word: ማያት
  choice: вод
  rationale: Родительный падеж после «хранилища» естественно передаёт множественное число и собирательный космический образ.
- source_word: ዘመልዕልተ ሰማያት
  choice: находящиеся над небесами
  rationale: Сохраняет пространственное представление о водах выше небес, не модернизируя древнюю космологию.
- source_word: አንቅዕተ
  choice: источники
  rationale: Понятное и стилистически достойное обозначение мест выхода вод; подходит как к спорной фразе о пространстве под небесами, так и к подземным водам.
- source_word: መትሕተ ምድር
  choice: под землёй
  rationale: Прямая и естественная пространственная формулировка в современном русском языке.
theological_decisions:
- issue: Характер грядущего суда
  choice: Конкретный космический суд с раскрытием небесных хранилищ и нижних источников вод
  alternative: Общее наказание или чисто метафорическое описание
  rationale: Текст прямо называет воды, их хранилища и источники; поэтому древний апокалиптический образ сохранён, а не сведён к отвлечённой метафоре.
- issue: Отношение кары к Господу духов
  choice: «кара от Господа духов»
  alternative: «кара Господа духов»
  rationale: Предлог «от» ясно передаёт Господа духов как источник суда, следуя консультационному переводу, при этом не определяет точный способ исполнения кары.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Сохранены древняя космологическая образность и текстуально сомнительная фраза в квадратных скобках; синтаксис сделан ясным без устранения напряжения в источнике.
