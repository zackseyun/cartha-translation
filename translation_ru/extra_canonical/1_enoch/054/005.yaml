base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/005.yaml
  text: And he said to me[a], “These are being prepared for the host of Azazʾel, so that they may take them and cast them into the lowest part of the place of judgment; and they will cover their jaws with rough stones[e][d][c][b], just as the Lord of Spirits commanded.”
translation:
  language: ru
  text: 'И он сказал мне: «Это приготовлено для сонма Азазэля[a], чтобы они схватили их, бросили в самую глубину места суда[b] и завалили себе челюсти грубыми камнями, как повелел Господь духов».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфиопский текст здесь труден. Возможны также переводы: «для дела Азазэля» или «для принадлежащих Азазэлю».'
    reason: textual_variant
  - marker: b
    text: Буквальное значение выражения не вполне ясно; возможны также варианты «под всякий суд» или «ниже всего суда». В данном контексте оно, вероятно, обозначает глубочайшую часть места наказания.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይዴለዉ
  choice: готовят
  rationale: Передаёт целенаправленное приготовление орудий наказания; русская активная неопределённо-личная конструкция естественно выражает значение исходной формы.
- source_word: ለትዕይንተ አዛዜኤል
  choice: для воинства Азазэля
  rationale: Текст в этом месте труден, но последующие местоимения во множественном числе поддерживают собирательное понимание группы, связанной с Азазэлем; вариант отмечен сноской.
- source_word: ይትመጠውዎሙ
  choice: схватить их
  rationale: В сцене суда глагол обозначает взятие или захват; «схватить» естественно предваряет последующее низвержение.
- source_word: ወይደይዎሙ
  choice: бросить
  rationale: Сохраняет принудительный характер низвержения без излишнего стилистического архаизма.
- source_word: መትሕተ ኵሉ ደይን
  choice: в самую глубину места суда
  rationale: Передаёт пространственное движение вниз и понимает ደይን как место суда или наказания, не подменяя енохическую топографию позднейшим термином «ад»; неясность выражения отмечена сноской.
- source_word: አእባኒ ጠያያነ
  choice: камнями необработанными
  rationale: «Камни» выступают средством покрытия; прилагательное указывает на их грубую, неотёсанную поверхность. Творительный падеж естественно выражает средство действия.
- source_word: ይክድኑ
  choice: завалят
  rationale: В сочетании с камнями и челюстями контекстуально передаёт покрытие или погребение под камнями ярче, чем нейтральное «покроют».
- source_word: መላትሒሆሙ (исправление OCR መላእክቲሆሙ)
  choice: им челюсти
  rationale: Согласно текстологическому исправлению, рукописное слово означает «их челюсти/щёки», а не «их ангелы»; дательный принадлежности с прямым дополнением звучит по-русски естественно.
- source_word: እግዚአ መናፍስት
  choice: Господь духов
  rationale: Сохраняет устойчивый божественный титул Книги притч без привнесения поздней терминологии.
theological_decisions:
- issue: Кого обозначает выражение, связанное с Азазэлем
  choice: собирательная группа под властью Азазэля — «воинство Азазэля»
  alternative: дело/деяние Азазэля; принадлежащие Азазэлю; последователи Азазэля
  rationale: Множественные местоимения в продолжении стиха благоприятствуют личному собирательному референту, однако трудность исходного чтения не позволяет устранять альтернативы, поэтому они вынесены в сноску.
- issue: Топография наказания
  choice: «самая глубина места суда» как пространственная область наказания
  alternative: под всяким судом; ниже всего суда
  rationale: Контекст описывает низвержение в конкретное место. Слово «ад» не выбрано, чтобы не переносить в текст более позднюю богословскую систему.
- issue: Чтение слова после глагола «покрывать»
  choice: «их челюсти» на основании текстологического исправления OCR
  alternative: «их ангелов/вестников» по машинной транскрипции መላእክቲሆሙ
  rationale: Грамматика ставит необработанные камни в функцию средства покрытия, а исправленное чтение «челюсти/щёки» создаёт связную сцену наказания и соответствует параллельному описанию наказания Азазэля в 1 Енох 10:4.
translation_notes:
  register: Современный литературный русский язык с торжественным, но не архаизированным апокалиптическим звучанием. Синтаксис сохранён протяжённым, как в повествовании видения; тире перед заключительной формулой подчёркивает её итоговый характер. Все сноски имеют маркеры в основном тексте.
