base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/001.yaml
  text: And I looked and turned to another part of the earth[b][a], and I saw there a deep valley with burning fire.
translation:
  language: ru
  text: И я взглянул и повернулся к другой стороне земли[a], и увидел там глубокую долину, в которой пылал огонь[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «к другому лицу земли»; это выражение может означать другую область или сторону земли.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «глубокую долину с пылающим огнём».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ነጸርኩ
  choice: я взглянул
  rationale: Передаёт первый глагол зрительного восприятия и сохраняет его отличие от последующего ርኢኩ («увидел»).
- source_word: ተመየጥኩ
  choice: повернулся
  rationale: В контексте видения обозначает поворот или перемену направления внимания; русский глагол сохраняет образ движения.
- source_word: ካልአ ገጸ ምድር
  choice: к другой стороне земли
  rationale: Естественно передаёт пространственный смысл буквального выражения «другое лицо земли», не устраняя его космографический оттенок.
- source_word: ርኢኩ
  choice: увидел
  rationale: Обычный и ясный эквивалент основного глагола зрительного восприятия; результативный вид уместен в последовательности повествования.
- source_word: ህየ
  choice: там
  rationale: Кратко и естественно указывает на только что названную область.
- source_word: ቈላ ዕሙቀ
  choice: глубокую долину
  rationale: Сохраняет топографический образ без неоправданного уточнения характера местности.
- source_word: እንዘ ትነድድ እሳት
  choice: в которой пылал огонь
  rationale: Передаёт продолжающееся горение и естественно связывает оборот с долиной; возможная обстоятельственная или сопутствующая трактовка отмечена в сноске.
