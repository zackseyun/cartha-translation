  text: And there my eyes saw their instruments[d][c][b][a], as they were making iron chains without measure.
translation:
  language: ru
  text: И там мои глаза увидели их орудия[a], в то время как они изготовляли их — железные цепи[b] без меры[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их приспособления», «их орудия труда». Точное значение слова в данном контексте не вполне ясно.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «железные оковы». Речь идёт о предметах, которыми связывают.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «без меры». Выражение может означать также «без предела»; возможно и понимание, связанное с неизмеримым весом.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ርእያ አዕይንትየ
  choice: глаза мои увидели
  rationale: Сохранена явная формула видения с упоминанием глаз, а не сведена к простому «я увидел».
- source_word: ዘመባዕዕቲሆሙ
  choice: их орудия
  rationale: Передаёт значение орудий или приспособлений и сохраняет притяжательный суффикс 3-го лица множественного числа.
- source_word: እንዘ ይገብርዎሙ
  choice: когда они изготовляли их
  rationale: Передаёт сопутствующее продолжающееся действие и сохраняет объектный суффикс «их» при глаголе.
- source_word: መአስርተ ሐጺን
  choice: железные цепи
  rationale: Естественно и конкретно передаёт предметы связывания и материал, сохраняя суровый образ суда.
- source_word: ዘአልቦ መደለውተ
  choice: без меры
  rationale: Сохраняет буквальную и несколько загадочную формулу отсутствия меры, не разрешая без достаточной уверенности, относится ли она к размеру, количеству, пределу или весу.
theological_decisions:
- issue: Характер изготовляемых предметов в видении
  choice: Конкретные железные цепи, представленные как орудия
  alternative: Обобщённые орудия наказания или метафорические узы
  rationale: 'Лексика стиха материальна и конкретна: изготовление, железо и цепи. Перевод сохраняет образ, но не добавляет отсутствующего в самом стихе объяснения их назначения.'
- issue: Связь между «орудиями» и «железными цепями»
  choice: Тире представляет цепи как пояснение к местоимению «их» и к названным орудиям
  alternative: Понимать «орудия» как отдельные инструменты, которыми изготовлялись цепи
  rationale: Глагольный объектный суффикс требует передачи «их», однако синтаксическая связь остаётся не вполне прозрачной. Формулировка сохраняет возможность аппозиционного прочтения, не превращая орудия однозначно в инструменты производства.
translation_notes:
  register: Современный литературный русский с сохранением возвышенной апокалиптической формулы «глаза мои увидели». Порядок слов слегка торжественный, но понятный; конкретная образность и синтаксическая неоднозначность источника не сглажены.
