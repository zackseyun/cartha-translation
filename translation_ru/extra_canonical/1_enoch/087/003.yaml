base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/003.yaml
  text: And those three who came out afterward seized me by my hand[a], and they lifted me up from the offspring of the earth and brought me up onto a high place, and showed me a lofty tower above the earth[d][c][b], and all the hills became low.
translation:
  language: ru
  text: А те трое, которые вышли позднее, схватили меня за руку и подняли меня из потомства земли[a], возвели на высокое место и показали мне высокую башню[b] над землёй; и все холмы стали низкими[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из потомства (или рода) земли». Возможен и более общий смысл: «от земных существ».'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «башня», не вполне ясно и может обозначать высокое сооружение вообще.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «и все горы понизились»; возможно также: «были понижены».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ፫እለ ወጽኡ ድኅረ
  choice: те трое, которые вышли после
  rationale: Числительное имеет указательно-анафорическую силу, а እለ вводит относительное придаточное; ድኅረ передано временно и без уточнения, после кого именно они вышли.
- source_word: አሐዙኒ በእዴየ
  choice: схватили меня за руку
  rationale: Глагол выражает взятие или удержание, а форма እዴየ здесь передаёт единственное число — «моя рука».
- source_word: አንሥኡኒ
  choice: подняли меня
  rationale: Сохраняется прямое значение вертикального перемещения в видении.
- source_word: እምትውልደ ምድር
  choice: из среды рождённых землёй
  rationale: Передана заложенная в ትውልድ образность рождения или происхождения, но русская конструкция сделана естественной и обозначает отделение Еноха от земных существ.
- source_word: አልዐሉኒ ዲበ መካን ነዋኅ
  choice: возвели на высокое место
  rationale: Формулировка сохраняет мотив восхождения и высоту места без культового оттенка выражения «высота».
- source_word: ማኅፈደ ነዋኅ
  choice: высокую башню
  rationale: Точное значение существительного не вполне ясно; «башня» хорошо соответствует вероятному образу высокого сооружения, а примечание сохраняет более широкую возможность.
- source_word: ሕፁፀ ኵሉ አውግር
  choice: все холмы стали низкими
  rationale: Передано физическое понижение рельефа, а не нравственное унижение; «холмы» сохраняет возможный масштаб, не исключая значения «горы».
theological_decisions:
- issue: Отделение Еноха от «рождённых землёй»
  choice: Сохранить образ рождения или происхождения от земли.
  alternative: «подняли меня с земли» или «из среды жителей земли»
  rationale: Более буквальный образ поддерживает апокалиптическое противопоставление земных существ и вознесённого созерцателя, не сводя выражение только к пространственному перемещению.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис следует последовательности эфиопского текста, но избегает тяжёлого нанизывания союзов; подлинные лексические неопределённости вынесены в примечания.
