base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/002.yaml
  text: And again I lifted up my eyes to heaven[a], and I saw in a vision—and behold, there came out from heaven beings in the likeness of white men; and four came out from that place[d][c][b], and three with them.
translation:
  language: ru
  text: 'И снова я поднял глаза к небу и увидел в видении: вот, с неба вышли существа в облике белых людей[a]. Четверо вышли из того места, и трое — вместе с ними[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как подобие белых людей»; выражение описывает их вид, не называя их прямо людьми или ангелами.'
    reason: lexical_alternative
  - marker: b
    text: 'В эфиопском тексте счёт дан обрывисто: «четверо вышли из того места, и трое — вместе с ними». Вероятно, всего имеются в виду семь небесных существ, однако синтаксис источника здесь сохранён.'
    reason: textual_variant
lexical_decisions:
- source_word: አንሣእኩ አዕይንትየ ካዕበ ውስተ ሰማየ
  choice: И снова я поднял глаза к небу
  rationale: Сохраняет повторность, конкретный образ поднятых глаз и направление взгляда; по-русски звучит естественно и соответствует апокалиптической формуле.
- source_word: ወርኢኩ በራእይ
  choice: и увидел в видении
  rationale: Передаёт явное указание на визионерский способ восприятия без внесения определённости, которой источник не выражает.
- source_word: ወነዋ
  choice: вот
  rationale: Сохраняет дейктическую внезапность и торжественную выразительность исходного междометия, не утяжеляя русский синтаксис.
- source_word: ወፁኡ እምሰማይ
  choice: с неба вышли
  rationale: Передаёт множественное число и движение из небесной сферы; «вышли» также позволяет естественно сохранить повтор того же глагола далее.
- source_word: ከመ እምሳለ ሰብእ ጸዓዳ
  choice: существа в облике белых людей
  rationale: «В облике» сохраняет выраженную в геэз идею подобия, а «существа» не отождествляет небесные фигуры непосредственно с людьми или ангелами.
- source_word: ፬ ወፁኡ እምውእቱ መካን
  choice: Четверо вышли из того места
  rationale: Сохраняет явное число, повтор глагола движения и пространственно конкретное «то место».
- source_word: ወ፫ ምስሌሆሙ
  choice: и трое — вместе с ними
  rationale: Передаёт краткую и несколько обрывистую конструкцию источника, не уточняя сверх текста характер связи между группами.
theological_decisions:
- issue: Кем являются белые человекоподобные фигуры
  choice: Описать их как «существа в облике белых людей», не называя ангелами.
  alternative: «ангелы в человеческом облике» или просто «белые люди»
  rationale: В стихе названы их небесное происхождение и видимый облик, но не их класс; описательный перевод сохраняет богословскую и образную неопределённость.
- issue: Соотношение четырёх и трёх фигур
  choice: 'Сохранить буквальную последовательность: «Четверо… и трое — вместе с ними».'
  alternative: Сгладить как «семеро вышли»
  rationale: Источник выражается резко и не формулирует сумму прямо; сглаживание устранило бы подлинную синтаксическую напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно торжественным апокалиптическим звучанием. Синтаксис сделан ясным, но повтор глагола и резкость заключительного счёта сохранены. Все сноски отмечены в основном тексте.
