base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/001.yaml
  text: And again I saw them[a], and behold, they were butting one another and devouring one another[c][b], and the earth began to cry out.
translation:
  language: ru
  text: 'И снова я увидел их: они начали бодать[a] и пожирать[b] друг друга, и земля начала взывать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «пронзать рогами» или, более широко, «наносить удары». Здесь сохранён образ схватки животных.'
    reason: lexical_alternative
  - marker: b
