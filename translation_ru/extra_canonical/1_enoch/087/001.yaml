    reason: lexical_alternative
lexical_decisions:
- source_word: ወካዕበ
  choice: И снова
  rationale: Сохраняет возобновляющую повествовательную формулу и повторяющуюся последовательность видений.
- source_word: ርኢክዎሙ
  choice: я увидел их
  rationale: Прямая и естественная передача отчёта видящего от первого лица без ненужной архаизации.
- source_word: ወአኃዙ፡ እንዘ፡ ይወግኡ (реконструкция искажённого ወአንዘ፡ እንዘ፡ ይወግኡ)
  choice: они начали бодать
  rationale: Сочетание начального глагола с እንዘ и имперфектом выражает начало действия. «Бодать» сохраняет образ схватки животных, не превращая его в отвлечённое «нападать».
- source_word: ለካልኡ
  choice: друг друга
  rationale: Естественно передаёт взаимность насильственных действий.
- source_word: ወይውሑጦ፡ ለካልኡ
  choice: и пожирать друг друга
  rationale: Глагол допускает значения проглатывания, поглощения и пожирания; «пожирать» наиболее уместно сохраняет жестокую образность Апокалипсиса животных.
- source_word: ወምድር፡ አኃዘት፡ ትጽራኅ (реконструкция искажённого ወምድር፡ አንዘት፡ ትጽራኅ)
  choice: и земля стала взывать
  rationale: Передаёт начало действия и сохраняет землю как олицетворённый деятель; «взывать» звучит достойно и выразительно, но остаётся понятным современному читателю.
theological_decisions:
- issue: Олицетворение земли в ответ на насилие
  choice: 'Сохранить землю как действующий субъект: «земля стала взывать».'
  alternative: Безличное «с земли раздался крик» или ослабленное «на земле поднялся шум».
  rationale: Эфиопский текст представляет саму землю взывающей. Этот космический апокалиптический образ не следует сводить к обычному шуму или беспорядку.
- issue: Начальный либо длительный характер действий животных
  choice: «начали бодать и пожирать»
  alternative: «бодали и пожирали» или «стали бодать и пожирать»
  rationale: С учётом вероятного OCR-искажения ወአኃዙ как ወአንዘ конструкция указывает на начало продолжающегося действия. Такой перевод также создаёт параллель с началом взывания земли.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Двоеточие после сообщения о видении естественно вводит увиденное. Глагол «взывать» сохраняет торжественность олицетворения земли без чрезмерной архаики.
