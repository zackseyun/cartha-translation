revisions:
- from: 'И они сказали мне: «Оставайся здесь, пока не увидишь всё, что постигнет тех слонов, верблюдов и ослов, а также звёзды, скот и всех их».[a]'
  to: 'И они сказали мне: «Оставайся здесь, пока не увидишь всё, что произойдёт с теми слонами, верблюдами и ослами, со звёздами и со скотом — со всеми ними».'
  rationale: 'Перевод уточнён ради естественного русского синтаксиса и нейтральности: «произойдёт с» не называет грядущее событие судом или бедствием, но передаёт его направленность на все перечисленные образы. Повтор отношения к звёздам и скоту, а также заключительное «со всеми ними» воспроизводят охват оригинального перечня. Сноска сохранена как необходимое указание на буквальную пространственную конструкцию оригинала.'
