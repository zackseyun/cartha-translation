base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/004.yaml
  text: And they said to me[a], “Remain here until you see everything that will come upon those elephants and camels and donkeys, and upon the stars and upon the cattle[c][b], and all of them.”
translation:
  language: ru
  text: 'И они сказали мне: «Оставайся здесь, пока не увидишь всё, что произойдёт с теми слонами, верблюдами и ослами, со звёздами и со скотом — со всеми ними».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይቤሉኒ
  choice: они сказали мне
  rationale: Сохранена обычная повествовательная формула речи и явно выраженное дополнение «мне».
- source_word: ንበር ዝየ
  choice: оставайся здесь
  rationale: Передаёт повеление оставаться на месте в естественном современном русском языке, сохраняя торжественность видения.
- source_word: እስከ ትሬኢ ኵሎ ዘይመጽእ
  choice: пока не увидишь всё, что постигнет
  rationale: Переданы временной предел повеления, полнота предстоящего видения и направленность будущего события на перечисленных персонажей.
- source_word: ዲበ
  choice: постигнет; а также
  rationale: В первом употреблении русское «постигнет» естественно выражает неуточнённое событие, которое придёт на кого-либо; последующие повторения предлога переданы синтаксическим перечислением без ненужной тяжеловесности.
- source_word: እልኩ ነጌያት
  choice: тех слонов
  rationale: «Тех» сохраняет указание на уже находящихся в поле видения животных.
- source_word: አግማል
  choice: верблюдов
  rationale: Прямое наименование животного сохранено буквально.
- source_word: አእዱግ
  choice: ослов
  rationale: Точное и нейтральное современное русское соответствие.
- source_word: ከዋክብት
  choice: звёзды
  rationale: Образ сохранён буквально, без истолкования звёзд как ангелов или иных сил.
- source_word: አልህምታት
  choice: скот
  rationale: Форма обозначает крупный рогатый скот/быков, а не овец; собирательное «скот» естественно в данном перечислении и не нарушает символический ряд.
- source_word: ወኵሎሙ
  choice: и всех их
  rationale: Сохранено заключительное обобщение, подчёркивающее полноту перечисления.
theological_decisions:
- issue: Следует ли прямо назвать грядущее событие судом или наказанием
  choice: что постигнет
  alternative: какой суд обрушится на них
  rationale: Геэзский текст не называет событие судом. Выбранная формулировка сохраняет возможность такого понимания, но не делает его явным вопреки оригиналу.
- issue: Следует ли расшифровать образы животных и звёзд
  choice: сохранить слонов, верблюдов, ослов, звёзды и скот
  alternative: заменить их предполагаемыми историческими народами или небесными существами
  rationale: Стих даёт сами образы видения, а не их толкование; символический язык сохранён.
- issue: Значение አልህምታት
  choice: скот
  alternative: овцы / стада
  rationale: Лексема относится к крупному рогатому скоту; перевод «овцы» смешал бы её с иным геэзским наименованием и исказил бы зооморфную символику.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования. Повторение геэзского предлога частично сглажено ради естественного русского синтаксиса, но перечень и заключительное обобщение сохранены. Маркер сноски поставлен после всего предложения.
