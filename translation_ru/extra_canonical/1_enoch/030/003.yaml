base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/030/003.yaml
  text: And by the edges of those valleys I saw fragrant cinnamon[c][b][a], and beyond them I went toward the east.
translation:
  language: ru
  text: И у краёв тех долин я увидел благоуханную корицу[a], а за ними я пошёл на восток[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ароматную кассию»; древнее название может обозначать корицу либо близкое к ней ароматическое растение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально выражение допускает понимание: «за ними я приблизился по направлению к востоку».'
    reason: lexical_alternative
lexical_decisions:
- source_word: መንገለ
  choice: у / дальше / на восток
  rationale: 'Предлог трижды употреблён с различными пространственными оттенками: близость к краям долин, движение за упомянутый ориентир и направление на восток. Разные русские соответствия естественно передают эти функции.'
- source_word: ክንፈሩ
  choice: краёв
  rationale: В топографическом контексте слово обозначает край или границу; «края долин» точнее, чем «склоны» или буквальное сближение с иным словом, означающим «крыло».
- source_word: ቈላት
  choice: долин
  rationale: Нейтральное и понятное обозначение форм рельефа; возможны более узкие «овраги» или «вади», но источник не требует такой конкретизации.
- source_word: ርኢኩ
  choice: я увидел
  rationale: Прямо передаёт первое лицо повествовательного отчёта о видении.
- source_word: ቀናንሞስ
  choice: корицу
  rationale: Заимствованный термин обозначает ароматическое растение или пряность типа корицы; «корица» — наиболее ясное конкретное соответствие.
- source_word: ዘመዓዛ
  choice: благоуханную
  rationale: Передаёт характеристику растения по приятному запаху и сохраняет достойный литературный регистр.
- source_word: ቀረብኩ
  choice: пошёл дальше
  rationale: В сочетании с пространственными выражениями передаёт продолжение движения и приближение в направлении востока, не подразумевая достижения конечной точки.
- source_word: ጽባሕ
  choice: восток
  rationale: В географическом контексте слово обозначает восточное направление, хотя буквально связано с утром или восходом.
theological_decisions:
- issue: Определение ароматического растения в апокалиптическом пейзаже
  choice: корица
  alternative: кассия; ароматическое растение
  rationale: Конкретное название сохраняет предметность образа; при этом сноска отмечает возможную ботаническую широту термина и не вводит лишней определённости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным оттенком. «Благоуханную» сохраняет чувственную выразительность видения, а простой глагол движения не перегружает краткое повествование.
