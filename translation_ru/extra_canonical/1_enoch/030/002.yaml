  text: And I saw a beautiful tree[a], which resembled a fragrant tree[b], like the mastic tree.
translation:
  language: ru
  text: И увидел я прекрасное дерево, похожее на благовонное дерево[b], подобное мастиковому дереву[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название растения в оригинале не вполне ясно; вероятно, имеется в виду мастиковое дерево, или лентиск, известный своей ароматической смолой.
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «запах которого был подобен запаху мастикового дерева».'
    reason: previous_rendering
lexical_decisions:
- source_word: ወርኢኩ
  choice: И увидел я
  rationale: Сохранены соединительный союз и форма первого лица, характерные для последовательного повествования о видении; инверсия придаёт тексту умеренно возвышенное, но понятное звучание.
- source_word: ዕፀ ሠናየ
  choice: прекрасное дерево
  rationale: ዕፀ обозначает дерево или древесное растение, а ሠናየ — красоту или привлекательность; «прекрасное дерево» естественно передаёт оба элемента.
- source_word: ዘይመስል
  choice: похожее
  rationale: Причастная конструкция сохраняет прямо выраженное в оригинале значение сходства, не превращая его в утверждение о тождестве.
- source_word: ዕፀ መዓዛ
  choice: благовонное дерево
  rationale: Буквально сочетание означает дерево аромата или благоухания. «Благовонное дерево» сохраняет повтор слова «дерево» и подчёркивает ароматическое свойство растения.
- source_word: ከመ
  choice: подобное
  rationale: Сравнительная частица передана отдельным словом, чтобы сохранить вторую ступень сравнения и структуру исходной фразы.
- source_word: እንተ ዘስኪኖን
  choice: мастиковому дереву
  rationale: Редкое название растения обычно связывают с мастиковым деревом, или лентиском; конкретное отождествление остаётся не вполне уверенным и поэтому отмечено сноской.
