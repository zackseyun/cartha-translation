base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/030/001.yaml
  text: And above them[a], above those mountains of the east, not far away, I saw another place, a valley of waters[c][b], as though it were inexhaustible.
translation:
  language: ru
  text: И над ними, над теми горами на востоке[b], неподалёку я увидел другое место — долину вод, словно неисчерпаемую[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Трудный эфиопский оборот допускает также переводы: «словно её нельзя было осушить» или «словно воды в ней не иссякали».'
    reason: lexical_alternative
  - marker: b
    text: 'Чтение этого места в сохранившейся транскрипции не вполне надёжно. Вероятнее всего: «над теми горами на востоке»; возможно также: «над их горами».'
    reason: textual_variant
lexical_decisions:
- source_word: ላዕሌሁ / ላዕለ እሙንቱ
  choice: над ними, над теми
  rationale: Повтор предлога сохраняет ступенчатое пространственное описание видения, а местоимение оставлено анафорическим, без уточнения его референта.
- source_word: 'አድባረ ጽባሕ (в данной транскрипции: ተደብረ፡ ጽባሕ)'
  choice: горами на востоке
  rationale: С учётом исправления повреждённой транскрипции сочетание понимается как «горы востока». Русское «горы на востоке» звучит естественно и сохраняет географическую конкретность.
- source_word: አኮ ርሑቀ
  choice: неподалёку
  rationale: Передаёт отрицание удалённости и сохраняет положение обстоятельства перед сообщением о том, что увидел Енох.
- source_word: ርኢኩ
  choice: я увидел
  rationale: Обычная формула непосредственного зрительного восприятия в рассказе о видении.
- source_word: መካነ ካልአ
  choice: другое место
  rationale: Сохраняет и пространственное значение, и переход к следующему месту видения.
- source_word: ቈላ ማያት
  choice: долину вод
  rationale: Буквально и образно передаёт низменное пространство, связанное с множеством вод, не сужая образ до реки или потока.
- source_word: ከመ ዘኢይትዌጸእ
  choice: словно неисчерпаемую
  rationale: Сохраняет сравнительную, впечатленческую форму и отрицательную идею неистощимости, не утверждая точнее, идёт ли речь о невозможности осушить воды или об их непрекращающемся течении.
theological_decisions:
- issue: Конкретность географии видения
  choice: другое место — долину вод
  alternative: обобщённое или символическое истолкование долины
  rationale: Текст описывает увиденный ландшафт как конкретную часть открывающейся Еноху космической географии; перевод не вводит в основной текст аллегорического толкования.
- issue: Неясность заключительного образа
  choice: словно неисчерпаемую
  alternative: словно её нельзя было осушить / словно воды из неё не иссякали
  rationale: Выбранная формулировка удерживает богословски нейтральную и текстуально осторожную двусмысленность трудного эфиопского оборота.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной интонацией. Конкретная апокалиптическая топография сохранена; синтаксис упрощён лишь настолько, чтобы фраза оставалась ясной обычному читателю.
