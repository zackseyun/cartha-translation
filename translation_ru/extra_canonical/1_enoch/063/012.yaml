  text: 'Так сказал Господь духов: «Вот установление и суд для могущественных».[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Переданное в рукописной традиции ይቤ обычно означает «сказал». Поэтому здесь вводная формула переведена буквально: «Так сказал Господь духов»; строение строки, однако, сжато.'
    reason: textual_variant
  - marker: b
    text: 'Последние слова можно также перевести: «против могущественных» — в зависимости от того, какое значение придаётся предлогу в данном контексте.'
    reason: lexical_alternative
  - marker: c
    text: 'Иное понимание синтаксиса: «Ибо это установление и суд Господа духов для могущественных».'
    reason: previous_rendering
lexical_decisions:
- source_word: ከመዝ ይቤ
  choice: Так сказал
  rationale: Сохраняет вводную формулу и обычное значение глагола ይቤ («сказал»), не превращая субъект последующей формы в определение.
- source_word: እግዚአ መናፈስት
  choice: Господь духов
  rationale: Устойчивый енохический божественный титул; передан буквально и последовательно, без привнесения более поздней терминологии.
- source_word: ዝውእቱ
  choice: Вот
  rationale: В прямой речи естественно передаёт указательно-связочное значение «это есть / вот» и отсылает к объявляемому судебному постановлению.
- source_word: ሥርዓቱ
  choice: установление
  rationale: Сохраняет значение установленного порядка или предписания и соответствует торжественно-юридическому контексту.
- source_word: ወኵነኔሁ
  choice: и суд
  rationale: Передаёт второй юридический термин широко, не сужая его до «приговора» и не усиливая до «осуждения»; суффикс понят как выполняющий определительную функцию.
- source_word: ለዐዚዛን
  choice: для могущественных
  rationale: Передаёт отношение, выраженное предлогом ለ, и обозначает обладающих властью; возможное направленное значение «против» отмечено в сноске.
theological_decisions:
- issue: Передача характерного для 1 Еноха божественного титула
  choice: Господь духов
  alternative: Господь духовных существ
  rationale: Буквальная форма сохраняет местную апокалиптическую лексику и её возможную широту, не уточняя без основания, какие именно духи имеются в виду.
- issue: Направленность суда по отношению к могущественным
  choice: для могущественных
  alternative: против могущественных
  rationale: Основной текст сохраняет более широкое значение предлога; контекстуально возможное враждебно-направленное прочтение не исключено и вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим оттенком. «Установление» и «суд» сохраняют юридическую парность исходных терминов; «могущественные» понятно современному читателю и указывает на обладающих властью, не ограничивая референт одним сословием.
