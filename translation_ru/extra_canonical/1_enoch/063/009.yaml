base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/009.yaml
  text: And we pass away from before his face because of our deeds[c][b][a], and all our sins are counted in righteousness.
translation:
  language: ru
  text: И мы отходим от лица Его[a] из-за наших дел, и все наши грехи исчисляются по справедливости[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от лица Его»; возможно также: «из Его присутствия». Здесь образно говорится о стоянии перед Божественным Судьёй и удалении от Него.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «все наши грехи исчисляются праведно» или «учитываются в праведности». Выражение имеет судебный оттенок, но не уточняет, обозначает ли «справедливость» образ исчисления или его мерило.'
    reason: alternative_reading
lexical_decisions:
- source_word: ወነኀልፍ
  choice: и мы отходим
  rationale: Глагол передаёт уход или удаление. «Отходим» естественно сочетается с последующим указанием «от Его лица» и, в отличие от «умираем», не сводит смысл к физической смерти.
- source_word: እምገጹ
  choice: от Его лица
  rationale: Буквальное выражение сохраняет конкретный семитский образ удаления от лица Божественного Судьи; более гладкое «из Его присутствия» дано в примечании.
- source_word: በእንተ ምግባሪነ
  choice: из-за наших дел
  rationale: Передана причинная связь и сохранено общее значение поступков без уточнения их характера сверх сказанного в тексте.
- source_word: ወኵሉ ኃጢአትነ
  choice: и все наши грехи
  rationale: Формулировка естественно передаёт всеохватность выражения и его исповедальный тон.
- source_word: በጽድቅ
  choice: по правде
  rationale: Сохраняется существительное со значением праведности или справедливости, а также возможность понимать оборот как указание на меру либо на справедливый образ действия.
- source_word: ትኈለቍ
  choice: исчисляются
  rationale: Слово передаёт подсчёт и взятие на учёт; «исчисляются» сохраняет судебно-учётный образ, не подменяя его более определённым «осуждаются».
theological_decisions:
- issue: Сохранять ли образ Божьего лица или сгладить его как обозначение присутствия
  choice: от Его лица
  alternative: из Его присутствия
  rationale: Конкретный образ понятен по-русски и усиливает сцену удаления от Божественного Судьи; его сглаживание необязательно.
- issue: Как понимать связь исчисления грехов с правдой/праведностью
  choice: все наши грехи исчисляются по правде
  alternative: все наши грехи исчисляются справедливо; все наши грехи учитываются в праведности
  rationale: Источник допускает оттенок справедливого способа исчисления и оттенок праведности как его мерила. Основной текст не превращает эту неоднозначную судебную формулу в прямое утверждение об осуждении.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной, апокалиптической окраской. Сохранён понятный библейский образ «лица», но синтаксис сделан естественным; судебная неоднозначность заключительной фразы не устранена.
