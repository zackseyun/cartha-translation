base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/010.yaml
  text: Now they will say to them[a], ‘Our soul has had its fill of unjust gain[d][c][b], but it does not keep us from going down from the midst of it into the burden of Sheol.’
translation:
  language: ru
  text: 'Теперь они скажут им: «Наша душа насытилась неправедной наживой[a], но она не удерживает нас от нисхождения из её среды под бремя Шеола[b][c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение, переведённое как «неправедная нажива», в геэзском тексте лексически трудно; оно может шире обозначать богатство или имущество, приобретённое неправедным путём.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально также возможно: «к тяжести Шеола». Образ передаёт гнетущее нисхождение в область мёртвых, а не только погребение.'
    reason: lexical_alternative
  - marker: c
    text: Слово «Шеол» сохранено, чтобы передать древнеиудейское обозначение области мёртвых, не подменяя его словами «ад» или «могила».
    reason: cultural_note
lexical_decisions:
- source_word: ይእዜ
  choice: Теперь
  rationale: Передаёт временной указатель и драматический поворот в сцене суда естественным современным русским языком.
- source_word: ይብልዎሙ
  choice: они скажут им
  rationale: Будущее время соответствует пророческому повествованию, а «им» передаёт выраженный в форме глагола объект третьего лица множественного числа.
- source_word: ትጸግብ ነፍስነ
  choice: Наша душа насытилась
  rationale: Сохраняет образ души, достигшей пресыщения или полноты, и завершённый характер признания.
- source_word: እምጥየየ ዐመፃ
  choice: неправедной наживой
  rationale: Передаёт одновременно материальный смысл приобретённого богатства и нравственную характеристику его неправедного происхождения, не уточняя способ приобретения сверх источника.
- source_word: ወኢትከልእ
  choice: но она не препятствует
  rationale: Глагол означает воспрепятствование или удержание. Местоимение «она» сохраняет грамматическую и смысловую неоднозначность возможного соотнесения.
- source_word: ወረደተነ
  choice: нашему нисхождению
  rationale: Передаёт движение вниз в область мёртвых и хорошо сочетается с последующим образом тяжести.
- source_word: እምልባ
  choice: из её среды
  rationale: Буквально и сдержанно передаёт трудный пространственный оборот, не определяя однозначно, к чему относится местоимение.
- source_word: ለክበደ ሲኦል
  choice: под бремя Шеола
  rationale: Сохраняет необычный конкретный образ тяжести и угнетающего нисхождения; «под» естественно выражает попадание под гнетущее бремя.
- source_word: ሲኦል
  choice: Шеол
  rationale: Транслитерация сохраняет древнеиудейское представление об области мёртвых и не подменяет его позднейшим понятием ада или одной лишь могилой.
theological_decisions:
- issue: Обозначение области мёртвых
  choice: Шеол
  alternative: преисподняя; могила; ад
  rationale: «Шеол» сохраняет собственную космологическую лексику иудейского апокалиптического текста, не сужая её до погребения и не привнося позднейшие представления об аде.
- issue: Неоднозначность местоимений во второй части
  choice: она; из её среды
  alternative: это; из среды богатства
  rationale: Женский род русского местоимения позволяет, как и трудный исходный оборот, не устанавливать без достаточных оснований единственный антецедент и не устранять смысловое напряжение текста.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Синтаксис умеренно формальный; необычные образы и подлинная неоднозначность источника сохранены, но фраза остаётся понятной обычному читателю.
