base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/001.yaml
  text: In those days the mighty ones and the kings who possess the dry land shall beg the angels of punishment[a], into whose hands they have been delivered, that they might give them a little respite, so that they may fall down and worship before the Lord of Spirits[c][b], and confess their sins before him.
translation:
  language: ru
  text: В те дни могущественные и цари, владеющие сушей[a], станут умолять ангелов наказания, в чьи руки они были отданы[b], дать им краткую передышку[c], чтобы те могли пасть ниц и поклониться перед Господом духов и исповедать перед Ним свои грехи.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «владеющие землёй (страной)». В геэзском тексте буквально говорится о «суше»; вероятно, имеется в виду земное господство.'
    reason: lexical_alternative
  - marker: b
    text: Соответствующее место в эфиопском тексте трудно для истолкования. По-видимому, смысл в том, что осуждённые властители отданы во власть этих ангелов.
    reason: textual_variant
  - marker: c
    text: «Краткая передышка» означает недолгое и ограниченное облегчение, а не освобождение от суда.
    reason: cultural_note
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: В те дни
  rationale: Сохраняет характерную для апокалиптического повествования временную формулу и множественное число исходного выражения.
- source_word: ዓዚዛን
  choice: могущественные
  rationale: Передаёт социально-политический смысл обозначения влиятельных лиц, не уточняя их положение сверх того, что сказано в тексте.
- source_word: ነገሥት
  choice: цари
  rationale: Прямой перевод царского титула; обобщение «правители» здесь не требуется.
- source_word: እለ ይእኅዝዋ ለየብስ
  choice: владеющие сушей
  rationale: Сохраняет конкретный образ суши и глагол обладания; вероятный смысл — земное или территориальное господство — поясняется в сноске без замены образа в тексте.
- source_word: እመላእክት መቅሠፍት
  choice: ангелов наказания
  rationale: Прозрачно передаёт генитивную конструкцию и судебный контекст; «наказание» не сужает смысл до одного лишь мучения.
- source_word: በኀበ ሀለዉ ምጥዋነ
  choice: которым они были преданы
  rationale: Передаёт вероятный смысл пребывания осуждённых властителей во власти или под стражей этих ангелов, одновременно отмечая трудность чтения в сноске.
- source_word: ከመ የሀቦሙ ዕረፍተ ንስቲተ
  choice: дать им краткую передышку
  rationale: «Передышка» естественно выражает временное облегчение, а «краткую» передаёт его малую, ограниченную меру.
- source_word: ከመ ይደቁ ወይስግዱ
  choice: чтобы пасть ниц и поклониться
  rationale: Сохраняет два глагола и телесную выразительность полного подчинения.
- source_word: እግዚአ መናፍስት
  choice: Господом духов
  rationale: Сохраняет устойчивый божественный титул Первой книги Еноха, не добавляя позднейших догматических уточнений.
- source_word: ወይትአመኑ ኃጢአቶሙ
  choice: исповедать свои грехи
  rationale: В покаянно-судебном контексте выражает открытое признание грехов перед Богом.
theological_decisions:
- issue: Означает ли просьба властителей подлинное покаяние или лишь вынужденное признание под судом
  choice: Переданы их просьба о кратком облегчении и намерение поклониться и исповедать грехи, но не утверждается, что их покаяние принято.
  alternative: Истолковать исповедание либо как искреннее покаяние, либо как исключительно вынужденное признание.
  rationale: Стих описывает слова и предполагаемые действия осуждённых, ничего не говоря ни об их внутреннем преображении, ни о принятии их исповедания; эту богословскую напряжённость следует сохранить.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Синтаксис остаётся ясным для обычного читателя; конкретные образы «суша» и «пасть ниц» сохранены, а трудное место не сглажено без оговорки.
