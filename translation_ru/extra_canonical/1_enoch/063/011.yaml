base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/011.yaml
  text: And after this[a], their faces will be filled with darkness and shame before that Son of Man, and they will be driven away from before his face[c][b], and a sword will abide before his face in their midst.
translation:
  language: ru
  text: И после этого их лица наполнятся тьмой и стыдом перед тем Сыном Человеческим[a]; их прогонят от его лица, и меч будет пребывать среди них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Сын Человеческий» здесь — устойчивое обозначение апокалиптической фигуры в Притчах Еноха; перевод не предполагает автоматического отождествления с каким-либо более поздним употреблением этого выражения.
    reason: cross_reference
  - marker: b
    text: 'В предоставленной транскрипции перед словами «среди них» повторено «перед его лицом». Однако текст издания Чарльза, подтверждаемый другими эфиопскими изданиями, в этой заключительной части читается: «и меч будет пребывать среди них»; повтор, по-видимому, возник при распознавании текста.'
    reason: textual_variant
lexical_decisions:
- source_word: ይመልእ፡ ገጾሙ፡ ጽልመተ፡ ወኃፍረተ
  choice: их лица наполнятся тьмой и стыдом
  rationale: Сохранён образ наполненных тьмой и стыдом лиц; возвратная русская конструкция естественно передаёт результативно-пассивный смысл.
- source_word: በቅድመ
  choice: перед
  rationale: Передаёт пребывание в присутствии судящей фигуры и сохраняет пространственно-судебный оттенок выражения.
- source_word: ዝኩ፡ ወልደ፡ እጓለ፡ እመሕያው
  choice: тем Сыном Человеческим
  rationale: Указательное слово сохранено, а наименование передано в принятой русской форме как обозначение определённой апокалиптической фигуры в Книге Притч Еноха.
- source_word: ይሰደዱ
  choice: их прогонят
  rationale: Динамичная неопределённо-личная конструкция естественно выражает пассивное удаление или изгнание осуждённых.
- source_word: ወሰይፍ፡ የኃድር
  choice: и меч будет пребывать
  rationale: «Будет пребывать» сохраняет значение продолжающегося, угрожающего присутствия меча, не превращая образ в непосредственный удар.
- source_word: ማእከሎሙ
  choice: среди них
  rationale: Кратко и точно сохраняет пространственный образ, не уточняя, каким именно образом меч расположен по отношению к осуждённым.
theological_decisions:
- issue: Является ли выражение «Сын Человеческий» титулом или общим обозначением человека
  choice: «тем Сыном Человеческим» с прописных букв
  alternative: «тем сыном человеческим» или «тем человеком»
  rationale: В контексте Притч Еноха выражение указывает на уже известную особую эсхатологическую фигуру. Такое оформление сохраняет внутреннее словоупотребление книги, не добавляя позднейших христологических уточнений.
- issue: Следует ли понимать меч как мгновенное орудие казни
  choice: Сохранён образ меча, продолжающего пребывать среди осуждённых
  alternative: «меч поразит их»
  rationale: Глагол обозначает пребывание, а не удар; перевод не конкретизирует способ суда сверх сказанного в источнике.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис остаётся ясным, а повторы и образы источника по возможности сохранены. «Будет пребывать» выбрано как более торжественное, но понятное выражение длительного присутствия.
