base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/003.yaml
  text: And your power is blessed in every hidden thing throughout all generations[a], and your glory forever and ever. Deep are all your hidden things, and they are without number[c][b]; and your righteousness is beyond reckoning.
translation:
  language: ru
  text: И сила Твоя сияет во всём сокрытом во все поколения[a], и слава Твоя — во веки веков. Глубоки все сокрытые вещи Твои[b], и нет им числа; и праведность Твоя не поддаётся исчислению[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «во всём сокрытом»; возможно также: «в каждой тайне».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «все Твои сокрытые [вещи]». Здесь не уточняется, что именно сокрыто.'
    reason: preserve_ambiguity
  - marker: c
    text: 'Или: «правосудие Твоё не поддаётся исчислению».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይበርህ
  choice: сияет
  rationale: Форма восходит к глаголу በርሀ со значением «сиять, быть светлым», а не к глаголу «благословлять»; перевод сохраняет образ света и исправляет ошибочное чтение консультационного английского слоя.
- source_word: በኵሉ ኅቡእ ኃይልክ
  choice: сила Твоя сияет во всём сокрытом
  rationale: ኃይልክ является подлежащим («сила Твоя»), тогда как በኵሉ ኅቡእ — предложной группой («во всём сокрытом»). Такой перевод сохраняет синтаксис источника и не превращает выражение в «Твою сокрытую силу».
- source_word: ለትውልደ ትውልድ
  choice: из поколения в поколение
  rationale: Естественная русская формула длительности, близко передающая буквально повторённое «поколение поколения».
- source_word: ስብሐቲከ
  choice: слава Твоя
  rationale: В славословном контексте слово обозначает Божью славу или великолепие, а не только воздаваемую Ему хвалу.
- source_word: ለዓለመ ዓለም
  choice: во веки веков
  rationale: Устоявшаяся возвышенная русская формула, точно передающая усиленное указание на вечность.
- source_word: ዕሙቅ ውእቱ ኵሉ ኅቡኣት ዚአከ
  choice: Глубоки все тайны Твои
  rationale: «Тайны» естественно по-русски передаёт субстантивированное множественное «сокрытые [вещи]», а «глубоки» сохраняет образ непостижимой глубины.
- source_word: ወኍልቈ አልቦሙ
  choice: и нет им числа
  rationale: Близкая к форме оригинала русская идиома, выражающая бесчисленность.
- source_word: ጽድቅ ዚአከ
  choice: праведность Твоя
  rationale: В славословии речь идёт о качестве Бога в широком смысле; возможное судебное значение «правосудие» отмечено в сноске.
- source_word: ኃሳበ አልቦ
  choice: не поддаётся исчислению
  rationale: Передаёт буквальную идею отсутствия счёта или вычисления, не заменяя её более толковательным «непостижима».
theological_decisions:
- issue: Следует ли понимать ኅቡኣት как «тайны» или буквально как «сокрытые [вещи]»
  choice: тайны
  alternative: сокрытое / сокрытые вещи
  rationale: В основном тексте выбрано естественное современное русское существительное, но буквальная неопределённость сохранена в сноске; тем самым не уточняется, идёт ли речь о замыслах, делах или ином сокрытом.
- issue: Следует ли переводить ጽድቅ как «праведность» или «правосудие»
  choice: праведность
  alternative: правосудие
  rationale: Славословный контекст скорее описывает Божье качество в целом, однако возможный судебный оттенок не исключён и указан в сноске.
- issue: 'Открывающий глагол: «сияет» или «благословенна»'
  choice: сияет
  alternative: благословенна
  rationale: Геэзская форма ይበርህ соответствует глаголу сияния; вариант «благословенна» основан на смешении с другим корнем и потому не принят, несмотря на консультационный английский текст.
translation_notes:
  register: Современный литературный русский с возвышенным славословным ритмом. Инверсии «сила Твоя», «слава Твоя» и формула «во веки веков» поддерживают достоинство речи, не делая её чрезмерно архаичной. Необычное «во всём сокрытом» сохранено ради синтаксической и смысловой точности источника и пояснено сноской.
