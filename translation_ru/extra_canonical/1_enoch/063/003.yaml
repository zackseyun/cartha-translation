  source_fidelity: 'Открывающая строка верно следует геэзскому тексту, а не ошибочному английскому аудиторскому слою: ይበርህ передано как «сияет», а ኃይልክ — как подлежащее «сила Твоя». «Во всём сокрытом» точно сохраняет предложную группу и её не вполне обычную, но намеренную неопределённость. Однако «тайны Твои» в основной строке несколько сужает ኅቡኣት («сокрытые [вещи]») до секретов/мистерий, тогда как исходник не уточняет их природу.'
  naturalness: Текст в целом звучит естественно и достойно в современном литературном, возвышенном регистре. «Из поколения в поколение» возможно, но «во все поколения» здесь несколько прямее выражает непрерывную временную сферу формулы. «Сокрытые вещи Твои» менее гладко, чем «тайны», но в данном кратком поэтическом контексте понятно и лучше сохраняет исходную неопределённость.
