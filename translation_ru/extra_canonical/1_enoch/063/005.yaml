base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/005.yaml
  text: And they said[a], “Who has given us rest[c][b], that we should praise and thank and believe before your glory?”
translation:
  language: ru
  text: 'И они сказали: «Кто дал нам покой[a], чтобы перед Твоей славой мы прославляли Его, благодарили Его и верили[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «передышку». Это слово может обозначать покой, отдых или временное облегчение.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «признавали».'
    reason: lexical_alternative
lexical_decisions:
- source_word: መኑ
  choice: кто
  rationale: Прямой и естественный эквивалент вопросительного местоимения; сохраняет форму риторического вопроса.
- source_word: ወሀበነ
  choice: дал нам
  rationale: Передаёт совершённое действие глагола «дать» без добавления временных оттенков, не выраженных явно в геэзском тексте.
- source_word: ዕረፍተ
  choice: покой
  rationale: Существительное обозначает покой, отдых или передышку. «Покой» сохраняет резкий контраст с непрекращающимся судом; вариант «передышка» указан в сноске.
- source_word: ከመ
  choice: чтобы
  rationale: Естественно передаёт целевое или результативное значение союза.
- source_word: ንሰብሖ
  choice: мы прославляли его
  rationale: Глагол относится к прославлению или восхвалению и содержит объектный суффикс 3-го лица мужского рода; поэтому «его» сохранено.
- source_word: ወናአኵቶ
  choice: благодарили его
  rationale: Передаёт значение благодарения; объектный суффикс 3-го лица мужского рода отражён местоимением «его».
- source_word: ወንእመን
  choice: и верили
  rationale: Форма основного залога глагола አምነ обычно означает «верить». Возможность контекстуального понимания как «признавать» сохранена в сноске из-за трудности геэзского текста Притч.
- source_word: ቅድመ
  choice: пред
  rationale: Сохраняет пространственно-судебный оттенок «перед, в присутствии» и соответствует возвышенному, но понятному регистру.
- source_word: ስብሐቲከ
  choice: славой твоей
  rationale: «Слава» передаёт семантическое поле сияния, величия и хвалы и уместна в контексте божественного присутствия.
theological_decisions:
- issue: Смысл вопроса осуждённых перед лицом суда
  choice: 'Риторическая жалоба: им не было дано покоя или передышки, позволяющих обратиться к хвале, благодарению и вере.'
  alternative: Нейтральный вопрос о том, кто предоставил им время для поклонения.
  rationale: Контекст речи осуждённых царей и сильных указывает на отчаяние под судом. Вопросительная форма сохранена без внесения дополнительного догматического объяснения.
- issue: Значение ወንእመን
  choice: верили
  alternative: признавали или исповедовали
  rationale: Основной залог አምነ поддерживает значение «верить», тогда как более сильное «исповедовать» обычно ожидается от иной глагольной формы. Поскольку место остаётся трудным, альтернатива вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Форма «пред славой твоей» сохраняет торжественный и судебный оттенок оригинала. Переход от местоимения 3-го лица («его») к прямому обращению («твоей») оставлен как в источнике, без стилистического выравнивания.
