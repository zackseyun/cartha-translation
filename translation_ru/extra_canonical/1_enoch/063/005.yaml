  to: 'И они сказали: «Кто дал нам покой[a], чтобы перед Твоей славой мы прославляли Его, благодарили Его и верили[b]?»'
  rationale: Перестроена только позиция обстоятельства «перед Твоей славой», чтобы оно без двусмысленности определяло весь ряд глаголов, как в исходном тексте. Сохранены явные объектные суффиксы при первых двух глаголах и значение «верили» для ወንእመን. Сноска сокращена, поскольку основной перевод лексически и морфологически хорошо обоснован, а альтернативное «признавали» достаточно отметить без расширительного комментария.
