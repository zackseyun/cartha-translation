base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/002.yaml
  text: And they will bless and praise the Lord of spirits, and they will say, “Blessed is the Lord of spirits, and the Lord of the kings, and the Lord of the mighty, and the Lord of the rich, and the Lord of glory, and the Lord of wisdom.”
translation:
  language: ru
  text: 'И они будут благословлять и прославлять Господа духов и скажут: «Благословен Господь духов, и Господь царей, и Господь могущественных, и Господь богатых[a], и Господь славы, и Господь мудрости».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «владеющих богатством (имуществом)»; слово может обозначать состоятельных или знатных людей.'
    reason: lexical_alternative
  - marker: b
    text: В геэзском тексте перед каждым последующим титулом повторяется союз «и»; этот торжественный риторический повтор сохранён в переводе.
    reason: cultural_note
lexical_decisions:
- source_word: ይባርክዎ ወይሴብሕዎ
  choice: будут благословлять и прославлять
  rationale: Будущее время естественно передаёт формы имперфекта в последовательности пророческого видения; «прославлять» сохраняет торжественный оттенок второго глагола и не смешивает его с первым.
- source_word: እግዚአ መንፈሳት / እግዚአ መናፍስት
  choice: Господь духов
  rationale: Устойчивый божественный титул в 1 Енохе; форма без определительного уточнения сохраняет широту и лаконичность оригинала.
- source_word: ቡሩክ ውእቱ
  choice: Благословен
  rationale: Передано как торжественное утверждение, а не пожелание «да будет благословен».
- source_word: እግዚኦሙ ለነገሥት
  choice: Господь царей
  rationale: Сохраняет формулу господства над названной группой и параллелизм ряда титулов.
- source_word: ዐዚዛን
  choice: могущественные
  rationale: В контексте суда обозначает людей, обладающих силой и властью; это точнее социально-политического смысла, чем просто «сильные».
- source_word: ብዑላን
  choice: богатые
  rationale: В данном ряду властной элиты слово естественно понимается как обозначение состоятельных, владеющих имуществом людей; неоднозначность отмечена в сноске.
- source_word: እግዚአ ስብሐት
  choice: Господь славы
  rationale: «Слава» лучше всего сохраняет весомый апокалиптический регистр, хотя существительное может также иметь оттенки хвалы и великолепия.
- source_word: እግዚአ ጥበብ
  choice: Господь мудрости
  rationale: «Мудрость» передаёт широкое значение слова, не сужая его до рассудочного знания.
theological_decisions:
- issue: Передача повторяющегося божественного титула እግዚአ መንፈሳት
  choice: Господь духов
  alternative: Владыка духов
  rationale: «Господь» соответствует устойчивой библейской титулатуре и позволяет единообразно передавать характерный для 1 Еноха титул без дополнительного истолкования природы духов.
- issue: Утверждение или благопожелание в ቡሩክ ውእቱ
  choice: Благословен Господь духов
  alternative: Да будет благословен Господь духов
  rationale: Именная конструкция выражает провозглашение уже присущей Богу благословенности, а не молитвенное пожелание.
- issue: Сохранение многосоюзия в ряду божественных титулов
  choice: повторять «и Господь»
  alternative: перечислить титулы без повторяющегося союза
  rationale: Повтор ወ перед каждым титулом создаёт намеренный торжественный, литургический ритм и потому сохранён.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим ритмом. Синтаксис остаётся ясным для обычного читателя; повтор союза и формулы «Господь…» намеренно сохранён как значимая черта оригинала.
