base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/008.yaml
  text: And on the day of our distress and our affliction[a], he will not save us, and we shall find no rest to believe that our Lord is faithful in all his works and in his judgments and his righteousness[c][b], and his judgments show no partiality.
translation:
  language: ru
  text: И в день нашей беды и нашего страдания Он не спасёт нас, и мы не найдём покоя, чтобы верить,[a] что наш Господь верен во всех Своих делах, Своих судах и Своей праведности;[c] и Его суды нелицеприятны.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Оборот «мы не найдём покоя, чтобы верить» в геэзском тексте синтаксически труден. Возможный смысл: «мы не найдём покоя, на который могли бы уповать» или «мы не найдём передышки для надежды».'
    reason: alternative_reading
  - marker: b
    text: Буквально заключительная фраза говорит, что суды не «поднимают лица»; это идиома, означающая отсутствие пристрастия или предпочтения кому-либо.
    reason: lexical_alternative
  - marker: c
    text: 'Возможна иная пунктуация: «во всех Своих делах и судах; и Его суд праведен и нелицеприятен». Однако в основном тексте слово «праведность» сохранено как отдельный член перечисления.'
    reason: previous_rendering
lexical_decisions:
- source_word: በዕለተ
  choice: в день
  rationale: Сохраняет временную и апокалиптическую окраску исходного оборота и естественно звучит по-русски.
- source_word: ስራሕነ
  choice: нашей беды
  rationale: Хотя слово может обозначать труд или тяготу, в паре со следующим существительным оно описывает тяжёлое положение говорящих.
- source_word: ምንዳቤነ
  choice: нашего страдания
  rationale: Передаёт переживаемое мучение, не уточняя без достаточных оснований, что речь именно о наказании.
- source_word: ኢያድኅነነ
  choice: Он не спасёт нас
  rationale: Прямо передаёт глагол избавления и его эсхатологическую весомость.
- source_word: ኢንረክብ ዕረፍተ
  choice: мы не найдём покоя
  rationale: Сохраняет образ обретения покоя и отрицательную форму исходного текста.
- source_word: ንእመን
  choice: чтобы верить
  rationale: Формально сохраняет связь с верой или доверием, не устраняя синтаксическую трудность текста; возможные понимания отмечены в сноске.
- source_word: መሃይምን
  choice: верен
  rationale: Передаёт надёжность и истинность Господа в Его действиях и суде.
- source_word: ምግባሩ
  choice: Своих делах
  rationale: Естественный русский эквивалент широкого обозначения Божьих действий.
- source_word: ኵነኔሁ
  choice: Своих судах / Его суды
  rationale: Слово дважды встречается в стихе; множественное число согласуется с формой глагола в заключительной фразе и сохраняет повтор исходника.
- source_word: ጽድቁ
  choice: Своей праведности
  rationale: Сохраняет отдельный третий элемент перечисления, который нельзя сливать с судами или опускать.
- source_word: ገጹ ኵነኔሁ ኢይነሥኡ
  choice: Его суды нелицеприятны
  rationale: Естественно передаёт судебную идиому о том, что суды не «поднимают лица», то есть не оказывают предпочтения лицам.
theological_decisions:
- issue: Смысл трудного оборота ኢንረክብ ዕረፍተ ንእመን
  choice: мы не найдём покоя, чтобы верить
  alternative: мы не найдём покоя, на который могли бы уповать; мы не найдём передышки для надежды; мы не найдём покоя и не поверим
  rationale: Основной текст сохраняет формально возможную, хотя и трудную связь «покоя» с верой; сноска открыто указывает иные понимания, не разрешая неопределённость догматически.
- issue: Структура перечня Божьих качеств и действий
  choice: во всех Своих делах, Своих судах и Своей праведности
  alternative: во всех Своих делах и судах; и Его суд праведен
  rationale: Исходный текст содержит отдельное слово «праведность», поэтому оно сохранено как третий член перечисления; альтернативная пунктуация отмечена в сноске.
- issue: Заключительная формула о суде
  choice: Его суды нелицеприятны
  alternative: Его суды не поднимают лица
  rationale: Русское «нелицеприятны» точно передаёт смысл древней судебной идиомы — отсутствие пристрастия, тогда как буквальная калька была бы неясна.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Местоимения, относящиеся к Господу, написаны с прописной буквы по принятой русской библейской издательской традиции. Трудность оборота о покое и вере намеренно не сглажена, но пояснена в сноске.
