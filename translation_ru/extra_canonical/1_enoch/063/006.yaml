base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/006.yaml
  text: Now we desire a little rest[a], but we do not find it; we are driven away, and we cannot seize it, and the light has passed away from before us[c][b], and darkness will be our dwelling forever and ever.
translation:
  language: ru
  text: Теперь мы желаем немного покоя[a], но не находим его; нас гонят прочь, и мы не можем ухватиться за него[b]. Свет ушёл от нас, и тьма навеки станет нашим жилищем[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «мы желаем немного покоя».'
    reason: translation_clarity
  - marker: b
    text: 'Или: «не можем схватить его» или «не можем удержать его». Краткое выражение, вероятнее всего, продолжает мысль о недостижимом покое.'
    reason: lexical_alternative
  - marker: c
    text: 'Слово, переведённое как «жилище», трудно для истолкования; возможно также: «обиталище». Смысл в том, что тьма становится их вечным уделом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይእዜኒ
  choice: Теперь
  rationale: Передаёт временной переход к нынешнему осознанию говорящих; союзное «и» в русском необязательно.
- source_word: ንስቲተ፡ ዕረፍተ፡ ንትሜነይ
  choice: мы желаем хотя бы немного покоя
  rationale: 'Учитывает исправленный разбор: ንስቲተ означает «немного» и определяет «покой», а ንትሜነይ — глагол первого лица множественного числа «мы желаем». «Хотя бы» естественно выражает ограниченность отчаянной просьбы, не меняя её предмета.'
- source_word: ወኢንረክብ
  choice: но не находим его
  rationale: Сохраняет основное значение глагола «находить/обретать» и связь с искомым покоем.
- source_word: ንሰደድ
  choice: нас гонят прочь
  rationale: Передаёт пассивное положение осуждённых, которых изгоняют, а не просто удаляющихся по своей воле.
- source_word: ወኢንእኅዝ
  choice: и мы не можем завладеть им
  rationale: Сохраняет значение схватывания или овладения и вероятную отсылку к недостижимому покою, не сглаживая краткость оригинала.
- source_word: ወብርሃን፡ እምቅድሜነ፡ ኀለፈ
  choice: Свет ушёл от нас
  rationale: Естественно передаёт пространственный образ света, удалившегося от лица говорящих, и ощущение необратимой утраты.
- source_word: ወጽልመት፡ ምኅባሪነ
  choice: и тьма навеки станет нашим обиталищем
  rationale: Сохраняет образ тьмы как постоянного места пребывания или удела, не сводя его только к внутреннему отчаянию.
- source_word: ለዓለመ፡ ዓለም
  choice: навеки
  rationale: Краткая и торжественная современная передача устойчивой формулы вечной продолжительности.
theological_decisions:
- issue: Природа утраченного света и наступившей тьмы
  choice: Сохранены апокалиптические образы света и тьмы без поясняющего истолкования.
  alternative: Понимать их исключительно как душевное отчаяние либо исключительно как физические явления.
  rationale: В контексте суда эти образы могут одновременно иметь космический, нравственный и эсхатологический смысл; перевод не должен искусственно сужать его.
- issue: Объект выражения «завладеть им»
  choice: Местоимение отнесено к ранее названному покою, но не заменено толкованием.
  alternative: Понять речь шире — о безопасности, избавлении или утраченном свете.
  rationale: Ближайший грамматический референт — покой, однако краткость исходной фразы оставляет некоторую смысловую открытость, отмеченную в сноске.
translation_notes:
  register: 'Современный литературный русский язык с торжественным, но понятным звучанием. Синтаксис сохраняет нарастание плача: тщетное желание покоя, изгнание, утрата света и вечная тьма. Архаизмы сведены к минимуму; «обиталище» выбрано ради достоинства апокалиптического регистра.'
