base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/007.yaml
  text: For before him we did not believe[a], and we did not praise the name of the Lord of Spirits[a][b], [and we did not praise our Lord,] and our hope was in the scepter of our kingdom and in our glory.
translation:
  language: ru
  text: Ибо пред Ним мы не верили и не восхваляли имя Господа духов[a], [и не восхваляли нашего Господа][b], а надеялись на скипетр нашего царства[c] и на нашу славу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Критический текст здесь имеет отрицательные формы: «не верили» и «не восхваляли». В предоставленной транскрипции отрицательная частица, по-видимому, утрачена из-за ошибки распознавания.'
    reason: textual_correction
  - marker: b
    text: Фраза в квадратных скобках текстуально не вполне надёжна и может быть вариантом или позднейшим расширением.
    reason: textual_variant
  - marker: c
    text: 'Или: «жезл». Исходное слово может означать также посох или жезл; в сочетании с царством здесь уместен царский образ скипетра.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Ибо
  rationale: Передаёт пояснительно-причинную связь с предшествующим плачем и сохраняет торжественный, но понятный регистр.
- source_word: በቅድሜሁ
  choice: пред Ним
  rationale: Сохраняет пространственно-судебный образ стояния перед Богом; прописная буква ясно указывает на референта, не добавляя толкования.
- source_word: ኢአመነ / አአመነ в ошибочной транскрипции
  choice: мы не верили
  rationale: Критическое чтение содержит отрицательную частицу ኢ; её отсутствие в предоставленной строке объясняется установленной ошибкой распознавания. Отрицательное чтение также согласуется с параллельными глаголами и контекстом исповеди царей.
- source_word: ወኢሰባሕነ ለስሙ
  choice: и не восхваляли имя
  rationale: «Восхваляли» прямо передаёт действие прославления и естественно сочетается с объектом «имя», сохраняя семитский благоговейный оборот.
- source_word: እግዚአ መናፈስት
  choice: Господа духов
  rationale: Сохраняет устойчивый апокалиптический титул книги Еноха без пояснительного расширения.
- source_word: ወኢሰባሕናሁ ለእግዚእነ
  choice: и не восхваляли нашего Господа
  rationale: Передаёт повторный глагол последовательно; квадратные скобки сохраняют отмеченную в свидетеле текстуальную неуверенность.
- source_word: ወተስፋነ ኮነ ዲበ
  choice: а надеялись на
  rationale: Естественный русский оборот передаёт направленность надежды. Союз «а» делает явным присутствующий в исповеди контраст, не меняя содержания.
- source_word: በትረ መንግሥትነ
  choice: скипетр нашего царства
  rationale: У слова есть значения «жезл», «посох» и «скипетр»; сочетание с царством указывает на царскую власть и её символ.
- source_word: ስብሐቲነ
  choice: нашу славу
  rationale: «Слава» сохраняет многозначность величия, почёта и блеска, а также параллель с упованием на царскую власть.
theological_decisions:
- issue: Положительное или отрицательное чтение исповедания царей
  choice: мы не верили и не восхваляли
  alternative: мы верили и восхваляли
  rationale: Отрицательное чтение опирается на исправленные формы критического текста с частицей ኢ и соответствует исповеди осуждённых царей. Положительное чтение предоставленной транскрипции связано с ошибочной утратой отрицательной частицы, а не с богословским переосмыслением.
- issue: Характер ложной надежды царей
  choice: надеялись на скипетр нашего царства и на нашу славу
  alternative: надеялись на нашу власть и почёт
  rationale: Конкретный образ скипетра сохраняет апокалиптическую критику земного царствования и не сводит образ к отвлечённому понятию власти.
- issue: Статус повторной фразы о восхвалении Господа
  choice: сохранить в квадратных скобках
  alternative: опустить фразу либо включить без скобок
  rationale: Скобки честно отражают неуверенность текстового свидетельства и не решают вопрос о первоначальности фразы без достаточных оснований.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формы «пред Ним» и «Господь духов» сохраняют достоинство и апокалиптическую образность, тогда как синтаксис остаётся доступным современному читателю.
