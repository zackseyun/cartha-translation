base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/004.yaml
  text: Now we know that we ought to praise and bless the Lord of the kings[b][a], and the one who reigns over all the kings.
translation:
  language: ru
  text: Теперь мы знаем, что должны восхвалять и благословлять Владыку царей[b][a] и Того, кто царствует над всеми царями.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будем восхвалять и благословлять» / «да восхвалим и благословим». Формы геэзских глаголов допускают увещевательно-побудительное или сослагательное понимание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «Владыку царей». Здесь этот титул не свёрнут в традиционную формулу «Царь царей».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይእዜ
  choice: Теперь
  rationale: Передаёт временной поворот и наступившее осознание говорящих; в данном контексте естественнее, чем нейтральное «сейчас».
- source_word: አእመርነ
  choice: мы узнали
  rationale: Форма указывает на достигнутое понимание; прошедшее совершенного вида сохраняет оттенок нового, запоздалого осознания.
- source_word: ከመ
  choice: что
  rationale: Естественно вводит содержание осознанного говорящими.
- source_word: ንሰብሖ ወንባርኮ
  choice: должны восхвалять и благословлять
  rationale: Передаёт возможную волитивно-субъюнктивную силу форм как признание должного; альтернативное побуждение отмечено в сноске.
- source_word: ለእግዚኦሙ ለነገሥት
  choice: Владыку царей
  rationale: Сохраняет прямое наименование Господина/Владыки царей, не превращая его в традиционную сжатую формулу «Царь царей».
- source_word: ወለዘ ይነግሥ ዲበ ኵሎሙ ነገሥት
  choice: и Того, кто царствует над всеми царями
  rationale: Относительная конструкция и настоящее время передают продолжающееся верховное царствование; прописная буква уместна как обозначение того же божественного лица.
theological_decisions:
- issue: Следует ли передать царский титул привычной формулой «Царь царей»
  choice: «Владыку царей и Того, кто царствует над всеми царями»
  alternative: «Царя царей»
  rationale: Геэзский текст сначала называет Его Владыкой царей, а затем отдельно говорит, что Он царствует над всеми царями. Двухчастное выражение сохранено без привнесения позднейшей традиционной формулы.
- issue: Модальная сила форм первого лица множественного числа
  choice: «мы… должны восхвалять и благословлять»
  alternative: «будем восхвалять и благословлять» или «давайте восхвалять и благословлять»
  rationale: В контексте признания перед судом речь естественно воспринимается как осознание должного. При этом подлинная возможность увещевательно-побудительного прочтения сохранена в сноске.
- issue: Определённость группы царей
  choice: «царей» и «всеми царями»
  alternative: «этих царей» и «всеми этими царями»
  rationale: Русский язык не имеет артикля; немаркированные формы естественно обозначают царей как определённый контекстом класс, не добавляя отсутствующего в тексте указательного оттенка.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной лексикой. «Владыка» сохраняет царственно-богословский регистр እግዚእ и позволяет отличить его от следующего глагола «царствует». Порядок маркеров [b][a] повторяет предоставленный консультационный текст; оба маркера присутствуют непосредственно при спорном выражении.
