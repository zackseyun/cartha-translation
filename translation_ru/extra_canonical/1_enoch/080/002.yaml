base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/002.yaml
  text: And in the days of the sinners the years shall be shortened, and their seed shall be late upon their land and in their fields; and all the works that are on the earth shall change and shall not appear in their times, and the rain shall be withheld, and heaven shall hold back.
translation:
  language: ru
  text: И во дни грешников годы сократятся, и семя их запоздает на их земле и на их полях[a]; все дела на земле изменятся и не явятся в свои сроки[b], дождь будет удержан, и небо удержит его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их потомство задержится». Слово «семя» здесь может обозначать и потомков, и посевное семя либо урожай; упоминание земли и полей поддерживает сельскохозяйственный оттенок.'
    reason: lexical_alternative
  - marker: b
    text: 'Эта строка изображает нарушение природного и земледельческого порядка: то, что должно появляться в установленный срок, не появляется вовремя.'
    reason: cultural_note
  - marker: c
    text: 'Буквально дополнение не выражено: «и небо удержит». По контексту подразумевается дождь.'
    reason: textual_clarity
lexical_decisions:
- source_word: መዋዕለ፡ ኃጥኣን
  choice: во дни грешников
  rationale: Сохраняет обычную апокалиптическую временную формулу и нравственно-судебное значение слова «грешники».
- source_word: ክረማት፡ የኀጽሩ
  choice: годы сократятся
  rationale: Передаёт нарушение годового цикла и образ сокращённого времени, не сводя ክረማት только к дождливым сезонам.
- source_word: ዘርአ፡ ዚአሆሙ
  choice: семя их
  rationale: Русское «семя» сохраняет возможную отсылку как к посевному семени, так и к потомству.
- source_word: ዳኃራዊ
  choice: запоздает
  rationale: Глагол естественно передаёт задержку и нарушение должного срока; при этом не уточняется, идёт ли речь о всходах, урожае или потомстве.
- source_word: ምድረሙ፡ ወበወፍሮሙ
  choice: на их земле и на их полях
  rationale: Сохраняет параллелизм земли и возделанных полей и поддерживает сельскохозяйственный контекст.
- source_word: ኵሉ፡ ግብር፡ ዘዲበ፡ ምድር
  choice: все дела на земле
  rationale: '«Дела» оставляет выражение широким: оно может охватывать процессы, труды и их плоды, не ограничивая смысл только человеческими поступками.'
- source_word: ኢያስተርኢ፡ ለአዝማኖሙ
  choice: не явятся в свои сроки
  rationale: Сохраняет глагол явления и прямо передаёт множественное «их сроки», связывая строку с нарушением установленных времён.
- source_word: ዝናም፡ ይትከላእ
  choice: дождь будет удержан
  rationale: Пассивная конструкция передаёт прекращение дождя без добавления явно названного действующего лица.
- source_word: ወሰማይ፡ ታቀውም
  choice: и небо удержит его
  rationale: Передаёт эллиптическое продолжение мысли об удержанном дожде; местоимение делает русскую фразу грамматически ясной, а примечание отмечает отсутствие выраженного дополнения.
theological_decisions:
- issue: Значение выражения «семя их»
  choice: Сохранено буквальное и двусмысленное «семя их».
  alternative: «их потомство» или «их посевы»
  rationale: Земля, поля, сроки и дождь поддерживают сельскохозяйственное прочтение, но само слово допускает значение потомства; перевод не разрешает эту неопределённость.
- issue: Кто удерживает дождь
  choice: Сохранены сначала пассивное «дождь будет удержан», затем образ неба, которое удерживает его.
  alternative: «небо не даст дождя»
  rationale: Альтернатива яснее, но сильнее истолковывает эллиптический исходный текст и сглаживает смену конструкции.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Формула «во дни грешников» и будущие формы сохраняют торжественный пророческий ритм; лексика остаётся понятной широкому читателю. Полусоюзная структура исходника слегка упорядочена точкой с запятой, без устранения смысловой напряжённости.
