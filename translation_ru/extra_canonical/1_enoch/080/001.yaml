base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/001.yaml
  text: And in those days Uriel the angel answered me and said to me[a], “Behold, I have shown you everything, Enoch, and I have revealed everything to you, that you may look upon this sun and this moon and those who lead the stars of heaven[c][b], and all those who turn them—their works and their times and their risings.”
translation:
  language: ru
  text: 'И в те дни ангел Уриил ответил мне и сказал: «Вот, Енох, я показал тебе всё и всё открыл тебе, чтобы ты увидел это солнце, эту луну, тех, кто ведёт звёзды небесные, и всех, кто приводит их в движение, — их дела, их времена и их заходы[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вхождения». В астрономической картине этой книги имеются в виду заходы небесных тел, когда они входят в западные врата.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ
  choice: ответил мне
  rationale: Сохраняет обычное значение глагола «отвечать, откликаться» и повествовательную связь с предшествующим наставлением, хотя вопрос в самом стихе не приведён.
- source_word: ነዋ
  choice: вот
  rationale: Естественная для современного литературного русского частица, привлекающая внимание и сохраняющая торжественный тон прямой речи.
- source_word: አርአይኩከ
  choice: я показал тебе
  rationale: Передаёт каузативное зрительное значение глагола без излишнего усложнения.
- source_word: ከሠትኩ ለከ
  choice: открыл тебе
  rationale: Сохраняет смысл раскрытия прежде сокрытого и уместно звучит в апокалиптическом контексте.
- source_word: ትርአዮ
  choice: чтобы ты увидел
  rationale: Передаёт целевое значение формы и естественно связывает откровение с созерцанием перечисленных небесных явлений.
- source_word: ይመርኅዎሙ
  choice: ведёт
  rationale: Прямо передаёт значение ведения или руководства и сохраняет личный характер действующих небесных агентов.
- source_word: ከዋክብተ ሰማይ
  choice: звёзды небесные
  rationale: Точная и стилистически возвышенная передача родительного сочетания, естественная для библейско-апокалиптической прозы.
- source_word: ይመይጥዎሙ
  choice: направляет их движение
  rationale: Передаёт действие поворачивания или приведения в движение, не навязывая тексту современную модель орбитальной механики; по-русски звучит яснее буквального «поворачивает их».
- source_word: ግብሮሙ
  choice: их дела
  rationale: Сохраняет широкий диапазон слова — дела, действия, функции — и параллельный строй перечисления.
- source_word: አዝማኖሙ
  choice: их времена
  rationale: Наиболее прямой вариант, сохраняющий возможный смысл времён или сезонов без добавления идеи предопределённости.
- source_word: ሙባኢሆሙ
  choice: их заходы
  rationale: Существительное связано с корнем «входить»; в астрономической системе 1 Еноха речь идёт о вхождении светил в западные врата, то есть об их заходах, а не восходах.
theological_decisions:
- issue: Личный характер тех, кто управляет небесными телами
  choice: Сохранены личные конструкции «тех, кто ведёт» и «всех, кто направляет».
  alternative: Передать их как безличные законы, силы или движения светил.
  rationale: Геэзский текст использует личные относительные конструкции. Такая передача сохраняет апокалиптическую картину мира, не уточняя сверх сказанного, кем именно являются эти деятели.
- issue: Значение ሙባኢሆሙ в астрономическом контексте
  choice: заходы
  alternative: восходы; выходы; пути
  rationale: Корень обозначает вхождение. В образной космологии Астрономической книги это соответствует вхождению небесных тел в западные врата, то есть их заходу; перевод «восходы» обратил бы направление движения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейско-апокалиптическим звучанием. Синтаксис сделан ясным для обычного читателя; сохранены повтор «всё» и личные обозначения небесных распорядителей. Форма «Уриил» выбрана как традиционная русская передача имени.
