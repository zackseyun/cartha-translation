  text: And the moon will alter its order[c][b][a], and it will not appear in its season.
translation:
  language: ru
  text: И луна[a] изменит свой порядок, и не появится[b] в своё время[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «месяц»; однако в данном контексте речь, вероятнее всего, идёт о луне как небесном светиле.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не будет видна».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «в своё время»; также возможно: «в свой срок» или «в назначенное ей время».'
    reason: previous_rendering
lexical_decisions:
- source_word: ወርኅ
  choice: луна
  rationale: Слово может обозначать как луну, так и месяц, однако контекст Астрономической книги и описание видимости небесного светила указывают здесь на луну.
- source_word: ይዌልጥ
  choice: изменит
  rationale: Глагол выражает изменение или отклонение от прежнего состояния; нейтральное «изменит» не уточняет ни причины, ни характера перемены.
- source_word: ሥርዓቶ
  choice: свой порядок
  rationale: Существительное обозначает порядок, установленное устройство или предписанный строй. «Свой порядок» сохраняет космический смысл и не сводит речь исключительно к фазам либо траектории.
- source_word: ወኢይትረአይ
  choice: и не появится
  rationale: Форма относится к видимости. Для небесного светила «не появится» звучит естественно, при этом возможное значение «не будет видна» отмечено в сноске.
- source_word: በዘመኑ
  choice: в своё время
  rationale: Это близкая передача буквального значения, сохраняющая повтор выражения из соседнего стиха и не добавляющая отсутствующего в тексте понятия назначенности.
- source_word: ዚአሁ
  choice: своё
  rationale: Указательно-притяжательный элемент относится к собственному времени луны; по-русски это естественно выражается возвратным притяжательным местоимением.
theological_decisions:
- issue: Описывает ли стих нейтральную астрономическую нерегулярность или нарушение установленного космического порядка
  choice: Сохранено выражение «изменит свой порядок» и буквальное «в своё время».
  alternative: «Нарушит установленный для неё порядок и не появится в назначенный срок».
  rationale: Выбранный текст допускает подразумеваемую идею установленного космического порядка, но не делает её более явной, чем в оригинале, и не сводит перемену только к фазе луны или календарному счёту.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified повествовательным строем. Формулировка близка к синтаксису оригинала, но остаётся понятной обычному читателю; намеренно сохранены повтор союза «и» и смысловая напряжённость между изменением порядка и несвоевременным появлением луны.
