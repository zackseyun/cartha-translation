base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/003.yaml
  text: And in those times the fruit of the earth will be delayed[a], and it will not sprout in its season[d][c][b]; and the fruit of the trees will be withheld in its season.
translation:
  language: ru
  text: И в те времена плод земли запоздает[a] и не взойдёт в свой срок; а плод деревьев будет удержан в назначенное для него время[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «плод земли задержится»; речь о том, что урожай появится позже положенного срока.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «появлению плода деревьев будет воспрепятствовано в назначенное для него время». Оригинал подчёркивает именно собственный, установленный для него срок.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አዝማን
  choice: времена
  rationale: Множественное обозначение времени передано широко, без сужения до дней или земледельческих сезонов; это соответствует апокалиптическому контексту.
- source_word: ፍሬ፡ ምድር
  choice: плод земли
  rationale: Сохраняет конкретный земледельческий образ оригинала и звучит естественно в возвышенной библейской прозе.
- source_word: ደሓራዊ፡ ይከውን
  choice: запоздает
  rationale: Передаёт значение наступления позже положенного срока и сохраняет акцент на нарушении установленного порядка времён.
- source_word: ወኢይበቍል
  choice: и не взойдёт
  rationale: Глагол обозначает появление ростка или всходов; «взойдёт» естественно передаёт земледельческий образ по-русски.
- source_word: በዘመኑ
  choice: в свой срок
  rationale: Единственное число согласовано с собирательным выражением «плод земли»; «срок» подчёркивает надлежащее время появления всходов.
- source_word: ፍሬ፡ ዕፅ
  choice: плод деревьев
  rationale: В земледельческом контексте ዕፅ естественнее всего понимать как деревья, а не древесину или растения вообще.
- source_word: ይትከላእ
  choice: будет задержан
  rationale: Сохраняет пассивное значение удерживания или воспрепятствования и мысль о плоде, не появляющемся вовремя.
- source_word: በዘመኑ፡ ዚአሁ
  choice: в своё назначенное время
  rationale: 'Возвратное «своё» и прилагательное «назначенное» передают единственное число и усиление, выраженное ዚአሁ: речь идёт о собственном, определённом для плода сроке.'
theological_decisions:
- issue: Характер описанного знамения
  choice: 'Сохранено буквальное описание нарушения земледельческого порядка: плод и всходы не появляются в установленное время.'
  alternative: Истолковать земледельческие образы как отвлечённую метафору нравственного упадка.
  rationale: Контекст Астрономической книги представляет нарушение времён и природного порядка как конкретное апокалиптическое знамение; перевод не превращает этот образ в конфессиональное или аллегорическое толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксический параллелизм и земледельческие образы оригинала сохранены; не вполне обычное пассивное выражение «будет задержан» удерживает смысл исходного глагола, а сноска поясняет его.
