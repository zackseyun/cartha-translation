  naturalness: Основной текст литературен и уместно сохраняет возвышенно-апокалиптический регистр. Заключительный оборот «сообразно вратам и сообразно их выходам» звучит канцелярски и оставляет читателя без понятного референта.
  terminology: «Врата неба» — удачный, традиционно понятный и образный эквивалент для небесных отверстий. Собирательное «трое врат» нормативно. «Выходы» можно сохранить, поскольку более конкретное «отверстия/пути выхода» преждевременно истолковывало бы термин.
