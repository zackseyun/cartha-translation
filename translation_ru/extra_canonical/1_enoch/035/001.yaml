base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/035/001.yaml
  text: And from there I went toward the west[a], to the ends of the earth, and there I saw three open portals of heaven, like what I had seen in the east[d][c][b], corresponding to their portals and corresponding to their outlets.
translation:
  language: ru
  text: И оттуда я пошёл на запад, к краям земли, и увидел там трое открытых врат неба[a], подобных тем, которые я видел на востоке, и соответствовавших тем вратам и их выходам.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ворот неба» либо «окон неба»; эфиопское слово обозначает отверстия в небесном своде, через которые могут проходить небесные светила.'
    reason: lexical_alternative
  - marker: b
    text: Буквальный смысл заключительной фразы не вполне ясен; возможно, речь идёт о соответствии восточным вратам по расположению или мере и об их выходах.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ወእምህየ
  choice: И оттуда
  rationale: Сохраняет обычную повествовательную связку и последовательность передвижений в видении.
- source_word: ሖርኩ
  choice: я пошёл
  rationale: Прямо передаёт глагол движения, не добавляя оттенка длительного путешествия.
- source_word: መንገለ ዐረብ
  choice: на запад
  rationale: ዐረብ обозначает запад, связанный с заходом солнца; это также соответствует последовательности сторон света в главах 33–36.
- source_word: በአጽናፈ ምድር
  choice: к краям земли
  rationale: Сохраняет апокалиптический образ пределов устроенного мира и естественно звучит по-русски.
- source_word: ሠለስተ ኆዋኅወ ሰማይ
  choice: трое врат неба
  rationale: «Врата» передают архитектурно-космический образ небесных отверстий; собирательное числительное естественно сочетается с pluralia tantum «врата».
- source_word: ርኁዋተ
  choice: открытых
  rationale: 'Передаёт определительное значение причастия: врата находятся в открытом состоянии.'
- source_word: በከመ ርኢኩ በምሥራቅ
  choice: подобных тем, которые я видел на востоке
  rationale: Ясно связывает западные врата с ранее увиденными восточными, не усложняя синтаксис.
- source_word: በአምጣነ ኆዋኅው
  choice: сообразно вратам
  rationale: Сохраняет лексическое повторение «врата» и допускает значение соответствия по расположению или мере, не конкретизируя его сверх текста.
- source_word: ወበአምጣነ ሞፃእቱ
  choice: и сообразно их выходам
  rationale: Передаёт параллельную конструкцию и существительное со значением выхода или места выхода в космологической системе.
theological_decisions:
- issue: Космическая география и устройство неба
  choice: Сохранить буквальные образы «краёв земли» и «врат неба»
  alternative: Ослабить образы до «далеко на западе» и «отверстий в небе»
  rationale: Текст изображает структурированный космос как часть самого видения; модернизация устранила бы существенную апокалиптическую образность.
- issue: Неясность соответствия в заключительной фразе
  choice: Передать повтором «сообразно… и сообразно…»
  alternative: Истолковать как точное совпадение по числу, размеру или расположению
  rationale: Эфиопское выражение допускает соответствие по мере или устройству, но не уточняет его вид; перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной апокалиптической лексикой. Синтаксис сделан ясным, но повтор заключительной конструкции сохранён как черта оригинала.
