  text: And when they crush that fruit[c][b][a], it is better than every fragrance.
translation:
  language: ru
  text: И когда они растирают этот плод[a], он превосходит всякое благовоние[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Переданная эфиопская форма, по-видимому, искажена. Возможно чтение: «растирают этот плод»; если же следовать сохранившейся форме, фразу можно понять как «берут этот плод».'
    reason: textual_variant
  - marker: b
    text: 'Или: «все запахи»; возможно также «все ароматы». Сравнение, вероятно, относится к благоуханию плода, хотя исходная формулировка прямо этого не уточняет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተይነሥእዎ (возможно, искажённое ይሔስዎ)
  choice: растирают
  rationale: 'Переданная форма, вероятно, повреждена при распознавании текста. Предложенное восстановление со значением «растирать» хорошо соответствует настоящему времени глагола и контексту ароматических деревьев: при растирании плода раскрывается его запах. Неопределённость отмечена в сноске.'
- source_word: ፍሬ
  choice: плод
  rationale: Обычное ботаническое значение слова; в данном описании дерева это естественный и точный русский эквивалент.
- source_word: ይኄይስ
  choice: превосходит
  rationale: Передаёт сравнительное значение конструкции с እም и настоящее время исходной глагольной формы, не добавляя того, в каком именно отношении плод лучше.
- source_word: እምኵሉ አፈው
  choice: всякое благовоние
  rationale: Сохраняет сравнение с совокупностью ароматов и подходит к возвышенному контексту. Фраза текстуально трудна; возможное более буквальное «все запахи» указано в сноске.
