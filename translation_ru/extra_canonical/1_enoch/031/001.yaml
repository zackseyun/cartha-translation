base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/031/001.yaml
  text: And I saw other mountains[a], in which there were trees, and from them there came out something like nectar[c][b], whose name was serera and galbanum.
translation:
  language: ru
  text: И увидел я другие горы, на которых были деревья; оттуда[c] истекало нечто, подобное нектару, называемое серарой[a] и гальбаном[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Точная идентификация серары неизвестна; геэзский текст, вероятно, сохраняет название ароматического вещества или растения.
    reason: lexical_alternative
  - marker: b
    text: Гальбан — ароматическая смола, употреблявшаяся в древних благовонных составах; геэзское название можно также передать транслитерацией «келбене».
    reason: cultural_note
  - marker: c
    text: В геэзском тексте после множественного «горы» стоит форма единственного числа — буквально «от него». Перевод «оттуда» сохраняет эту неясность, не определяя, относятся ли слова к горной местности, деревьям или источнику вещества.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ወርኢኩ
  choice: И увидел я
  rationale: Сохраняет обычную формулу повествования о видении и придаёт фразе естественное для русского возвышенного рассказа построение.
- source_word: ካልአነ አደባረ
  choice: другие горы
  rationale: Обе формы указывают на множественное число; перевод исправляет прежнее ошибочное понимание как одной горы.
- source_word: ዘቦ ውስቴቶሙ ዕፀወ
  choice: на которых росли деревья
  rationale: Передаёт наличие деревьев в пределах горной местности естественным современным русским языком; местоименный суффикс в источнике имеет множественное число.
- source_word: ወይወፅእ እምኔሁ
  choice: оттуда истекало
  rationale: Глагол изображает вещество, выходящее или истекающее из названного места. «Оттуда» сохраняет образ и не устраняет несогласованность между предшествующим множественным числом и единственным местоименным суффиксом እምኔሁ.
- source_word: ከመ ኔቄጥር
  choice: нечто, подобное нектару
  rationale: Частица ከመ требует сравнения, а существительное, по-видимому, обозначает сладкое или ароматическое истечение; «нектар» передаёт образ, не выдавая ботаническую идентификацию за точную.
- source_word: ዘስሙ ሰረራ ወከልበኔ
  choice: называемое серарой и гальбаном
  rationale: Первое название транслитерировано ввиду неуверенной идентификации; второе передано традиционным русским названием известной ароматической смолы.
theological_decisions:
- issue: Следует ли свести образ ароматического истечения к одному запаху
  choice: Сохранить конкретный образ истекающего вещества
  alternative: Передать как «от них исходило благоухание»
  rationale: Источник описывает выходящее вещество, а не только запах. Конкретный образ сохраняет характер видения и не сглаживает его необычность.
- issue: Как передать числовую неоднозначность в выражении «из него/от него» после множественного «горы»
  choice: Употребить нейтральное по числу «оттуда» и пояснить форму источника в сноске
  alternative: «из них истекало» или буквальное «из неё истекало»
  rationale: Так сохраняется и ясность русского текста, и подлинное напряжение грамматики источника без молчаливого исправления.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным ритмом повествования о видении. Редкие названия снабжены пояснениями; синтаксис остаётся понятным обычному читателю, а грамматическая неоднозначность источника не устраняется догматически.
