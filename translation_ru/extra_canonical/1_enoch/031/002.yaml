base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/031/002.yaml
  text: And upon that mountain I saw another mountain[a], and within it were trees; and those trees were full and strong[c][b], like almond trees.
translation:
  language: ru
  text: И на той горе я увидел другую гору[a], а на ней были деревья; и те деревья были пышными и крепкими, словно миндальные деревья[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «внутри неё были деревья». Необычное пространственное выражение может также означать, что деревья находились на горе или среди её склонов.'
    reason: source_ambiguity
  - marker: b
    text: 'Возможный перевод: «словно миндаль». Не вполне ясно, сравниваются ли деревья с миндальными деревьями вообще, с их плодами или с их внешним видом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ዲበ
  choice: на
  rationale: Пространственный предлог естественно передаётся русским «на»; более буквальное «над» здесь могло бы создать ложную географическую определённость.
- source_word: ደብር
  choice: гора
  rationale: Обычное обозначение горы или возвышенности; соответствует повторяющемуся горному образу в видении.
- source_word: ካልአ
  choice: другую
  rationale: Указывает на ещё одну, отличную гору в последовательности видения.
- source_word: ውስቴቱ
  choice: на ней
  rationale: Буквально возможно «в ней» или «внутри неё», однако применительно к деревьям русский естественно выражает расположение на горе. Необычность исходной конструкции отмечена в сноске.
- source_word: ዕፀወ / ዕፀው
  choice: деревья
  rationale: Существительное обозначает деревья или древесную растительность; повтор сохранён для ясной связи с указательным местоимением.
- source_word: እልኩ
  choice: те
  rationale: Форма понимается как указательное местоимение множественного числа, относящееся к деревьям, а не как глагол чувственного восприятия.
- source_word: ምሉኣን
  choice: пышными
  rationale: Передаёт полноту, обилие и развитость растительности естественным современным русским словом; буквально — «полными».
- source_word: ዘከመ ከርካዕ
  choice: словно миндальные деревья
  rationale: Сравнение, вероятнее всего, относится к миндалю; такая формулировка сохраняет ботанический образ, не уточняя, имеется ли в виду вид, форма или плодоношение.
- source_word: ጽኑዕተ
  choice: крепкими
  rationale: Передаёт физическую прочность, силу или стойкость деревьев без излишнего уточнения.
