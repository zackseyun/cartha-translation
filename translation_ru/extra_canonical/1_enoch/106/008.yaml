base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/008.yaml
  text: And when Methuselah heard the words of his son[a], he came to me at the ends of the earth, because he had heard that I was there. And he cried out, and I heard his voice, and I came to him and said to him, “Behold, I am here, my son. Why have you come to me?”
translation:
  language: ru
  text: 'И когда Мафусал услышал слова своего сына, он пришёл ко мне, к краям земли, потому что услышал, что я был там. Он воззвал, и я услышал его голос, и пришёл к нему, и сказал ему: «Вот я, сын мой. Зачем ты пришёл ко мне?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Последняя фраза в дошедшем эфиопском тексте при буквальном переводе звучит неловко: «ибо (или: потому что) ты пришёл ко мне». По контексту она, вероятнее всего, является вопросом о цели: «Зачем ты пришёл ко мне?»'
    reason: textual_variant
lexical_decisions:
- source_word: ሰምዐ
  choice: услышал
  rationale: Основное значение глагола — восприятие слухом; одинаковый русский глагол естественно передаёт оба употребления и сохраняет последовательность рассказа.
- source_word: ነገረ ወልዱ
  choice: слова своего сына
  rationale: ነገር может означать слово, дело или сообщение; «слова» сохраняет конкретность исходного выражения и естественно звучит по-русски.
- source_word: ውስተ አጽናፈ ምድር
  choice: к краям земли
  rationale: Формула сохраняет пространственный размах апокалиптического образа; предлог «к» согласован с глаголом движения и не сводит выражение просто к большой удалённости.
- source_word: እስመ ሰምዐ ከመ ህየ ሀለውኩ
  choice: потому что услышал, что я там
  rationale: ህየ обозначает место («там»), а форма ሀለውኩ — присутствие или нахождение; придаточное объясняет приход Мафусала.
- source_word: ጸርኀ
  choice: воззвал
  rationale: Передаёт громкий призыв и поддерживает достойный библейский регистр, не прибегая к разговорному «закричал».
- source_word: ቃሎ
  choice: его голос
  rationale: Хотя слово способно означать «слово», после глагола громкого призыва контекст требует значения «голос».
- source_word: ናሁ ሀለውኩ
  choice: Вот я
  rationale: Краткая современная формула сохраняет дейктическую силу ናሁ и смысл присутствия, не утяжеляя прямую речь архаизмом.
- source_word: ወልድየ
  choice: сын мой
  rationale: Сохраняет родственное обращение и соответствует возвышенному, но естественному русскому порядку слов.
- source_word: እስመ መጻእከ ኀቤየ
  choice: Зачем ты пришёл ко мне?
  rationale: Переданное эфиопское чтение буквально неловко («ибо/потому что ты пришёл ко мне»); в контексте реплика, вероятнее всего, является вопросом о цели прихода. Неопределённость отмечена в сноске.
theological_decisions:
- issue: Космическая формула местонахождения
  choice: к краям земли
  alternative: в далёкой области / к окраинам страны
  rationale: Перевод сохраняет апокалиптический географический образ и не превращает его в общее указание на удалённое место.
- issue: Неясность заключительной реплики
  choice: 'вопрос о цели: «Зачем ты пришёл ко мне?»'
  alternative: 'буквальное утверждение: «ибо ты пришёл ко мне»'
  rationale: Контекст диалога поддерживает вопросительное понимание, однако грамматическая шероховатость эфиопского текста не позволяет представить его как бесспорное; поэтому альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. «Воззвал» и обращение «сын мой» поддерживают библейское достоинство речи, тогда как «Вот я» избегает ненужной архаизации. Подлинная текстовая неясность заключительной фразы вынесена в сноску.
