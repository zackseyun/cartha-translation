base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/001.yaml
  text: And after some days my son Methuselah took a wife for his son Lamech[a], and she conceived by him and bore a son.
translation:
  language: ru
  text: И спустя несколько дней мой сын Мафусал взял жену для своего сына Ламеха[a]; она зачала от него и родила сына.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начальное выражение можно понимать и шире: «спустя некоторое время».'
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ መዋዕል
  choice: спустя несколько дней
  rationale: Передаёт временное выражение естественно и достаточно близко к буквальному образу; более широкое значение отмечено в сноске.
- source_word: ነሥአ
  choice: взял
  rationale: В брачном контексте глагол обозначает взятие или устройство жены; субъектом естественнее всего понимать Мафусала.
- source_word: ብእሲተ
  choice: жену
  rationale: Хотя слово может означать «женщина», конструкция «взял для своего сына» ясно указывает на брачный смысл.
- source_word: ወፀንሰት
  choice: она зачала
  rationale: Краткая и традиционно понятная передача, соответствующая достоинству повествовательного регистра.
- source_word: እምኔሁ
  choice: от него
  rationale: Естественно обозначает Ламеха как отца, не внося дополнительных пояснений.
- source_word: ወወለደት ወልደ
  choice: и родила сына
  rationale: Прямая, компактная и естественная передача исходной фразы.
theological_decisions:
- issue: Кто действует в начальной брачной формуле
  choice: Мафусал взял жену для своего сына Ламеха
  alternative: Сын Мафусала Ламех взял жену; Мафусал принял женщину для Ламеха
  rationale: Синтаксис геэзского текста наиболее естественно представляет Мафусала субъектом, а Ламеха — тем, для кого была взята жена. Такая передача сохраняет семейно-брачную организацию повествования и не опирается на позднейшую традицию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены компактность оригинала, цепочка действий и подлинная широта временного выражения; двусмысленность отмечена сноской.
