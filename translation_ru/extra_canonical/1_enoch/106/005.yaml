base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/005.yaml
  text: And he said to him[a], “I have begotten a strange son, and he is not like a human being; rather, he is like the children of the angels of heaven. And his nature is different, and he is not like us; and his eyes are like the rays of the sun[c][b], and his face is glorious.”
translation:
  language: ru
  text: 'И он сказал ему: «Я породил необычного сына[a], и он не похож на человека; напротив, он подобен детям небесных ангелов[b]. Природа его иная, и он не похож на нас; глаза его — как лучи солнца[c], а лицо его исполнено славы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «странного сына». Геэзское слово подчёркивает, что ребёнок резко отличается от обычных людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «детям ангелов неба». Сохранён поразительный образ родства, а не более сглаженное «ангелам».'
    reason: lexical_alternative
  - marker: c
    text: 'Сравнение относится к исходящему от солнца свету; возможный перевод: «как солнечные лучи».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወለድኩ
  choice: я породил
  rationale: Форма первого лица обозначает рождение или произведение потомства. В речи Ламеха «породил» сохраняет отцовское притязание и приподнятый тон, не приписывая ему материнское рождение.
- source_word: ውሉጠ
  choice: необычного
  rationale: Слово указывает на заметную инаковость ребёнка. «Необычного» естественно по-русски и не решает заранее, чудесна эта особенность или зловеща.
- source_word: አኮኑ ከመ ሰብእ
  choice: он не похож на человека
  rationale: Речь идёт о противопоставлении обычному человечеству, а не только взрослому мужчине.
- source_word: ደቂቀ መላእክተ ሰማይ
  choice: детям небесных ангелов
  rationale: Сохранён буквальный образ родства — «дети ангелов неба», важный для тревожного предположения Ламеха; он не сглажен до простого «подобен ангелам».
- source_word: ፍጥረቱ ካልእት
  choice: природа его иная
  rationale: Сочетание может обозначать иную природу, форму или устроение. «Природа» сохраняет онтологическую силу и остаётся понятной современному читателю.
- source_word: አዕይንቲሁ ከመ አገሪሁ ለፀሐይ
  choice: глаза его — как лучи солнца
  rationale: Сравнение связано с исходящим от солнца светом; «лучи солнца» передают яркий апокалиптический образ без лишнего истолкования.
- source_word: ገጹ ስቡሕ
  choice: лицо его исполнено славы
  rationale: Прилагательное выражает славу, великолепие или сияющее достоинство. Эта формулировка сохраняет возвышенный тон и не сводит смысл только к физическому свечению.
theological_decisions:
- issue: Следует ли смягчить выражение о «детях небесных ангелов» до простого сходства с ангелами
  choice: Сохранить в основном тексте родственное выражение «детям небесных ангелов»
  alternative: «подобен небесным ангелам»
  rationale: В геэзском тексте прямо употреблено обозначение детей, а повествовательный контекст поддерживает тревогу об аномальном происхождении ребёнка. Смягчение устранило бы подлинное богословское напряжение.
- issue: Передача ሰብእ как обозначения человека
  choice: «человека»
  alternative: «мужчину» или «мужа»
  rationale: Контраст проведён между необычным ребёнком и человеком как представителем человечества, а не специально с лицом мужского пола.
- issue: Характер славы лица ребёнка
  choice: Не уточнять, является ли она видимым сиянием, красотой или достоинством
  alternative: «лицо его сияет»
  rationale: Исходное слово допускает славу и великолепие шире одного лишь свечения; перевод сохраняет эту многозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, апокалиптическим звучанием. Синтаксис сделан ясным для широкого читателя; архаизмы вроде «лик» и конфессионально нагруженные уточнения не вводятся. Повторы исходного текста («не похож») сохранены ради риторического напряжения.
