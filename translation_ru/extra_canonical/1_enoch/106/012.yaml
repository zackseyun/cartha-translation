base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/012.yaml
  text: And his father Lamech was afraid[a], and he fled to me, and he did not believe that he was from him, but that his likeness was like the angels of heaven. And behold[b], I have come to you so that you may make righteousness known to me.
translation:
  language: ru
  text: И его отец Ламех испугался его и прибежал ко мне. Он не верил[a], что тот произошёл от него, но считал, что тот своим обликом подобен небесным ангелам. И вот, я пришёл к тебе, чтобы ты дал мне узнать истину[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В предоставленной транскрипции стоит форма «и поверил» без отрицания; вероятно, здесь ошибка передачи текста и следует читать «и не поверил». Возможен близкий по смыслу перевод: «он поверил, что тот не от него».'
    reason: textual_variant
  - marker: b
    text: 'Буквально также: «праведность», «справедливость» или «то, что правильно». В данном контексте, вероятно, имеется в виду истинное объяснение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ፈርሀ
  choice: испугался
  rationale: Передаёт обычное значение глагола страха и естественно звучит в современном русском повествовании.
- source_word: ጐየ
  choice: прибежал
  rationale: Сохраняет срочность движения к говорящему, не добавляя явно не выраженной идеи бегства от определённой угрозы.
- source_word: እምኔሁ
  choice: произошёл от него
  rationale: В контексте сомнения Ламеха речь идёт о происхождении ребёнка; такая формулировка яснее буквального «был от него».
- source_word: አምሳሉ እመላእክተ ሰማይ
  choice: своим обликом тот подобен небесным ангелам
  rationale: Сохраняет существительное со значением облика или подобия и не превращает сходство в утверждение об ангельском происхождении.
- source_word: ናሁ
  choice: И вот
  rationale: Передаёт вводный указательный возглас и сохраняет возвышенный повествовательный регистр без архаизма «се».
- source_word: ታይድዐኒ
  choice: чтобы ты открыл мне
  rationale: Передаёт каузативное значение «сделать известным» естественной русской формулой.
- source_word: ጽድቀ
  choice: истину
  rationale: Хотя слово обычно связано с праведностью и справедливостью, здесь проситель желает узнать верное объяснение необычного рождения; примечание сохраняет более буквальные варианты.
theological_decisions:
- issue: Утверждает ли стих ангельское отцовство или лишь сходство ребёнка с ангелами
  choice: Перевод говорит только о подобии облика небесным ангелам.
  alternative: «Его облик — от небесных ангелов» или понимание ребёнка как потомка ангелов.
  rationale: Форма አምሳሉ обозначает «его подобие/облик» и сама по себе не утверждает происхождения от ангелов. Более сильный вывод оставлен читателю и контексту, а не внесён в перевод.
- issue: Отрицательная или утвердительная форма глагола «верить»
  choice: «Он не верил, что тот произошёл от него».
  alternative: «Он верил, что тот не от него».
  rationale: Принято вероятное исправленное чтение ወኢአምነ, соответствующее смыслу фразы и учтённое в редакционной истории; в примечании открыто указана проблема предоставленной транскрипции. Оба синтаксических варианта близки по общему смыслу, но различаются местом отрицания.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования. Архаичное «се» заменено на «и вот»; синтаксис разделён на ясные предложения. Местоимение «тот» помогает различать ребёнка и Ламеха, не вводя имени, отсутствующего в стихе.
