base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/010.yaml
  text: 'And now[a], my father, hear me: a son has been born to Lamech my son, and his appearance and form are not like the form of a human being. His color is whiter than snow and redder than the blossom of a rose, and the hair of his head is whiter than white wool. And his eyes are like the rays of the sun[c][b]; and he opened his eyes and lit up the whole house.'
translation:
  language: ru
  text: 'И теперь, отец мой, выслушай меня: у моего сына Ламеха родился сын, и его облик и телосложение не таковы, как у человека[c]. Цвет его белее снега и краснее цветка розы[a], а волосы на его голове белее белой шерсти. Глаза его — словно лучи солнца[b]; он открыл глаза и осветил весь дом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «цветок розы», может обозначать красный цветок вообще; точный вид растения неясен.
    reason: lexical_alternative
  - marker: b
    text: Выражение, переведённое как «лучи солнца», трудно для точного истолкования; несомненен общий образ солнечного сияния.
    reason: lexical_alternative
  - marker: c
    text: 'Или, ближе к порядку слов оригинала: «его облик и форма не подобны форме человека». Значение слова, переданного как «телосложение», может охватывать также сформированный вид или облик.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ስምዐኒ
  choice: выслушай меня
  rationale: Повелительная форма с местоименным объектом выражает настойчивое обращение сына к отцу; «выслушай меня» естественно звучит по-русски.
- source_word: ተወልደ
  choice: родился
  rationale: Перфективная форма сообщает о завершившемся рождении; русский прошедший вид сохраняет этот смысл.
- source_word: ዘአምሳሉ ወፍጥረቱ
  choice: обликом и сложением
  rationale: Парные слова обозначают видимое подобие и сформированный телесный облик. «Сложение» не превращает описание внешности в отвлечённое утверждение о природе существа.
- source_word: ኢኮነ ከመ ፍጥረተ ሰብእ
  choice: он не подобен человеку
  rationale: Фраза подчёркивает необычность младенца по сравнению с обычным человеком, не предрешая вопрос о его сущности.
- source_word: ኅብሩ
  choice: цвет его
  rationale: В контексте речь идёт о видимой окраске, далее сопоставляемой со снегом и цветком; прямое «цвет» сохраняет необычное сочетание белизны и красноты.
- source_word: ይጸዐዳ እምአስኃትያ
  choice: белее снега
  rationale: Прямая сравнительная конструкция передаёт образ исключительной белизны.
- source_word: ይቀይሕ እምጽጌ ረዳ
  choice: краснее цветка розы
  rationale: Глагол обозначает красноту, а существительное — цветок; традиционное понимание как розы сохранено в тексте, но неопределённость вида отмечена в сноске.
- source_word: ጸጕረ ርእሱ
  choice: волосы на его голове
  rationale: Естественная русская передача буквального обозначения волос головы.
- source_word: እምፀምር ጸዐዳ
  choice: белее белой шерсти
  rationale: Сохранены сравнительная форма и повтор белизны, усиливающий образ.
- source_word: ከመ እግረን ለፀሐይ
  choice: словно лучи солнца
  rationale: Выражение в геэз трудно для точного разбора, однако контекст ясно указывает на солнечное сияние глаз; перевод не конкретизирует образ сверх необходимого.
- source_word: ከሠተ አዕይንቲሁ
  choice: он открыл глаза
  rationale: Последовательное повествовательное действие передано обычным русским выражением.
- source_word: አበርሀ ኵሎ ቤተ
  choice: осветил весь дом
  rationale: Прямая и естественная передача результата сияния, охватившего весь дом.
theological_decisions:
- issue: Насколько категорично передавать отличие ребёнка от людей
  choice: и обликом и сложением он не подобен человеку
  alternative: его облик и образ создания не таковы, как у человека
  rationale: Текст описывает поразительное внешнее отличие новорождённого, но сам по себе не утверждает, что тот онтологически не является человеком. Перевод сохраняет напряжение и не вводит дополнительного учения.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Синтаксис остаётся ясным для широкого читателя; образные повторы и последовательные союзы источника по возможности сохранены.
