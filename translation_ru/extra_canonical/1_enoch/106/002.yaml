base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/002.yaml
  text: And his body was white like snow[a], and red like the blooming of a rose; and the hair of his head was like white wool, and his locks were beautiful. And his eyes were beautiful; and when he opened his eyes, he lit up the whole house like the sun[c][b], and the whole house became exceedingly bright.
translation:
  language: ru
  text: И тело его было белым, как снег, и красным, как цветок розы[a]; волосы на голове его были как белая шерсть, а кудри его были прекрасны. Глаза его — когда он открыл их, он озарил весь дом, словно солнце, и весь дом стал необычайно светлым[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «красным, как распустившаяся роза». В геэзском тексте это цветочное сравнение, передающее красный цвет.'
    reason: lexical_alternative
  - marker: b
    text: 'Переход от слов «глаза его» к следующему предложению синтаксически труден в эфиопском тексте. Возможен также перевод: «Глаза его были прекрасны; и когда он открыл глаза, он озарил весь дом, словно солнце». Однако определение «прекрасны» может относиться к предшествующим кудрям; перевод сохраняет эту неоднозначность.'
    reason: textual_variant
lexical_decisions:
- source_word: ሥጋሁ
  choice: тело его
  rationale: Речь идёт о видимом облике ребёнка в целом; «тело» здесь естественнее русского «плоть» и не вносит богословского оттенка.
- source_word: ጻዕዳ ከመ አስሐትያ
  choice: белым, как снег
  rationale: Сохранено прямое цветовое сравнение без дополнительного усиления.
- source_word: ቀይሕ ከመ ጽጌ ረዳ
  choice: румяным, как цветущая роза
  rationale: «Румяным» естественно описывает красноватый цвет тела человека, а «цветущая роза» сохраняет цветочный образ источника.
- source_word: ጸጕረ ርእሱ ከመ ፀምር ጻዕዳ
  choice: волосы на голове его были словно белая шерсть
  rationale: Сохранены полный телесный образ и апокалиптическое сравнение с белой шерстью.
- source_word: ተወድምድማሁ ሠናይ
  choice: кудри его были прекрасны
  rationale: Существительное передаёт уложенные пряди или локоны; единственное число прилагательного в геэз лучше соотносится с собирательным обозначением кудрей, а не с последующим множественным «глаза».
- source_word: ከሠተ አዕይንቲሁ
  choice: он открывал их
  rationale: По-русски естественно передаёт открывание глаз; местоимение избегает тяжёлого повтора при сохранении смысла.
- source_word: አብርሀ ኵሎ ቤተ ከመ ፀሐይ
  choice: весь дом озарялся, словно солнцем
  rationale: Передан конкретный эффект сияния, охватывающего весь дом, и сохранено сравнение с солнцем.
- source_word: ወፈድፋደ በርሀ ኵሉ ቤት
  choice: и становился необычайно светлым
  rationale: Сохранено усиление яркости во всём доме без избыточного русского повтора глагола «озаряться».
theological_decisions:
- issue: Следует ли смягчать необычайное свечение ребёнка до общего указания на красоту или славу
  choice: Сохранено буквальное чудесное озарение всего дома при открывании глаз.
  alternative: Передать сцену как обобщённое описание необыкновенной красоты или славы ребёнка.
  rationale: Апокалиптический текст намеренно использует конкретный и поразительный зрительный образ; его не следует рационализировать или превращать в отвлечённую характеристику.
- issue: Относится ли слово «прекрасны» к кудрям или к глазам
  choice: «Прекрасны» отнесено к кудрям; упоминание глаз связано тире со следующим условно-временным предложением.
  alternative: «Глаза его были прекрасны; и когда он открывал глаза…»
  rationale: Грамматическое число и древнее греческое свидетельство поддерживают отнесение определения к локонам. При этом трудный переход к словам о глазах сохранён, а не дополнен отсутствующей связкой.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Архаизмы сведены к минимуму; сохранены параллелизм, конкретность красок и необычность апокалиптического образа.
