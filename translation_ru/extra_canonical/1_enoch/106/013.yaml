base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/013.yaml
  text: And I[a], Enoch, answered and said to him, “The Lord will do a new thing on the earth; and this I have already seen in a vision, and I have made it known to you[e][d][c][b], because in the generation of Jared my father they transgressed the word of my Lord from the heights of heaven.”
translation:
  language: ru
  text: 'И я, Енох, ответил и сказал ему: «Господь совершит нечто новое[a] на земле; и это я уже видел в видении и возвестил тебе, потому что в поколении моего отца Иареда они преступили слово моего Господа с высот небесных[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «обновит» или «сделает новым»; глагол и дополнение в геэз связаны с идеей новизны и обновления.'
    reason: lexical_alternative
  - marker: b
    text: Заключительный оборот можно понимать и как «слово моего Господа, пребывающего на высотах небесных», и как «слово моего Господа, пришедшее с высот небесных». Синтаксическая связь в тексте геэз не вполне ясна.
    reason: alternative_reading
lexical_decisions:
- source_word: አውሣእኩ … ወእቤሎ
  choice: ответил и сказал ему
  rationale: Сохранена характерная для семитского повествования двойная формула речи, которая уместна в возвышенном апокалиптическом повествовании.
- source_word: ይኄድስ … ኀዳሳተ
  choice: сотворит новое
  rationale: Глагол и дополнение образованы от корня со значением новизны и обновления. Формулировка передаёт особое новое деяние Господа, не уточняя его как полное обновление земли.
- source_word: ዲበ ምድር
  choice: на земле
  rationale: Естественная современная русская передача стандартного пространственного оборота без архаической тяжеловесности.
- source_word: ወዳእኩ ርኢኩ በራእይ
  choice: это я уже видел в видении
  rationale: Переданы как предшествование видения нынешнему сообщению Еноха, так и его пророческий характер.
- source_word: አይዳዕኩከ
  choice: возвестил тебе
  rationale: Каузативная идея доведения до знания выражена естественным для откровенной речи глаголом «возвестил».
- source_word: በትውልዱ ለአያሬድ አቡየ
  choice: в поколении Иареда, отца моего
  rationale: Сохранены генеалогическая привязка и порядок смысловых компонентов оригинала; выбрана традиционно узнаваемая русская форма имени.
- source_word: አኅለፉ
  choice: преступили
  rationale: Глагол буквально связан с переходом за предел и здесь означает нарушение; «преступили» сохраняет этот образ и не сужает смысл до конкретного вида греха.
- source_word: ነገረ ለእግዚእየ
  choice: слово моего Господа
  rationale: «Слово» сохраняет широту исходного существительного и не конкретизирует его как отдельную заповедь или приказ.
- source_word: እመልዕልተ ሰማይ
  choice: с высот небесных
  rationale: Передан пространственный образ высоты или верхней области небес без предположения о месте выше самого неба.
theological_decisions:
- issue: Характер обещанного деяния Господа
  choice: «Господь сотворит новое на земле»
  alternative: «Господь обновит землю»
  rationale: Оригинал выражает новизну или обновление, но сам по себе не требует понимания этой фразы как полного космического обновления земли.
- issue: Смысл проступка в поколении Иареда
  choice: «они преступили слово моего Господа»
  alternative: «они нарушили повеление моего Господа»
  rationale: Широкое значение «слово» оставляет возможной связь с мятежом Стражей, но не вводит эту связь в текст прямо и не превращает слово в одну определённую заповедь.
- issue: Синтаксическая связь заключительного пространственного оборота
  choice: В основном тексте сохранено «слово моего Господа с высот небесных»
  alternative: «слово, пришедшее с высот небесных» или «слово моего Господа, пребывающего на высотах небесных»
  rationale: Синтаксис геэз допускает связь оборота как со «словом», так и с «Господом»; перевод не должен без необходимости устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, повествовательно-пророческим звучанием. Семитская двойная формула «ответил и сказал» сохранена намеренно; в остальных местах предпочтена ясная и естественная русская речь.
