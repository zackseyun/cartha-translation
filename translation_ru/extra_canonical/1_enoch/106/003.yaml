base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/003.yaml
  text: And at that time[a], he rose from the hands of the midwife[b], and he opened his mouth and spoke to the Lord of righteousness.
translation:
  language: ru
  text: И тогда он поднялся с рук повитухи[a], открыл уста и обратился к Господу праведности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с её рук»; женщина названа помогающей при родах, то есть повитухой.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «к Господу справедливости»; возможен также оттенок правосудия. Эфиопское слово может обозначать как нравственную праведность, так и справедливость суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሶቤሃ
  choice: И тогда
  rationale: Естественно передаёт временно-повествовательную связку, сохраняя последовательность и возвышенный тон рассказа.
- source_word: ተንሥአ
  choice: он поднялся
  rationale: Передаёт буквальный образ восставшего или поднявшегося новорождённого, не уточняя его позу сверх сказанного в источнике.
- source_word: እምእዴሃ፡ ለመውለዲት
  choice: с рук повитухи
  rationale: Выражение буквально означает «с её рук», а следующее обозначение женщины указывает на ту, которая помогает при родах. «Повитуха» ясно и литературно передаёт роль участницы сцены.
- source_word: ወከሠተ፡ አፉሁ
  choice: открыл уста
  rationale: Сохраняет традиционную формулу введения речи и её выразительность в необычной сцене с новорождённым.
- source_word: ተወተናገረ
  choice: заговорил
  rationale: Прямо передаёт начало речи и естественно сочетается в русском языке с обращением к Господу.
- source_word: ለእግዚአ፡ ጽድቅ
  choice: с Господом праведности
  rationale: «Господь» соответствует возвышенному религиозному титулу; «праведность» сохраняет нравственно-богословскую широту ጽድቅ, не сводя её только к судебной справедливости.
theological_decisions:
- issue: Передача ጽድቅ в божественном титуле
  choice: праведности
  alternative: справедливости, правосудия
  rationale: Слово допускает как нравственный, так и судебный оттенок. «Праведность» лучше сохраняет широкий енохический нравственно-богословский смысл, а возможный оттенок справедливого суда отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Формула «открыл уста» сохранена ради образности и жанрового регистра; устаревшая лексика в остальном сведена к минимуму.
