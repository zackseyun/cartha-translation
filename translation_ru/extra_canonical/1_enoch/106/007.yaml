base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/007.yaml
  text: And now[a], my father, I am here asking you and petitioning you, that you should go to Henok our father and hear from him the truth[b], for his dwelling is with the angels.
translation:
  language: ru
  text: И теперь, отец мой, я здесь прошу и умоляю тебя, чтобы ты пошёл к Хеноку[a], отцу нашему, и услышал от него истину, ибо он обитает с ангелами.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Хенок — передача геэзской формы имени, обычно известного по-русски как Енох.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: И теперь
  rationale: Сохраняет временной переход и связь с предшествующей речью, естественно звуча в современном русском.
- source_word: ሀለውኩ
  choice: я здесь
  rationale: Передаёт выраженную в геэзском форму присутствия говорящего в данной сцене, не опуская самостоятельную лексическую единицу.
- source_word: አስተበቍዐከ ወእስእል እምኀቤከ
  choice: прошу и умоляю тебя
  rationale: Два близких глагола передают усиленную, настойчивую просьбу; сочетание остаётся понятным и сохраняет возвышенный тон.
- source_word: ከመ ትሖር ኀበ
  choice: чтобы ты пошёл к
  rationale: Сохраняет придаточное, раскрывающее содержание просьбы, и естественную русскую конструкцию направления.
- source_word: ሄኖክ አቡነ
  choice: Хеноку, отцу нашему
  rationale: Имя ሄኖክ передано близкой транслитерацией «Хенок»; обозначение родства и почтения «отец наш» сохранено буквально.
- source_word: ትስማዕ እምኀቤሁ አማነ
  choice: услышал от него истину
  rationale: Сохраняет конкретный глагол слухового восприятия, источник сообщения и смысл достоверного откровения.
- source_word: እስመ
  choice: ибо
  rationale: Вводит основание просьбы и поддерживает достойный литературный регистр.
- source_word: ውእቱ ምስለ መላእክት ምኅዳሩ
  choice: жилище его — с ангелами
  rationale: Сохраняет именную конструкцию, акцент на постоянном местопребывании и отношение «с», не превращая образ в более истолкованное утверждение.
theological_decisions:
- issue: Отношение Хенока к ангелам
  choice: жилище его — с ангелами
  alternative: он живёт с ангелами
  rationale: Именная формулировка ближе к геэзскому тексту и сохраняет апокалиптический образ особого местопребывания Хенока, не уточняя его природу сверх сказанного.
translation_notes:
  register: Современный литературный русский с достоинством, соответствующим древнему апокалиптическому повествованию. Повтор просьбы сохранён ради риторического усиления; архаизирующие формы избегаются, кроме уместного причинного союза «ибо».
