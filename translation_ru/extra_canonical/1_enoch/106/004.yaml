base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/004.yaml
  text: And Lamech his father was afraid of him[b][a], and he fled and came to his father Methuselah.
translation:
  language: ru
  text: И Ламех, его отец[b], испугался его[a], убежал и пришёл к своему отцу Мафусалу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Местоимение «его», вероятнее всего, относится к новорождённому, о котором говорится в предшествующем контексте.
    reason: cross_reference
  - marker: b
    text: 'Или: «И Ламех испугался его».'
    reason: previous_rendering
lexical_decisions:
- source_word: ፈረሀ
  choice: испугался
  rationale: Глагол обозначает страх; форма «испугался» естественно передаёт непосредственную реакцию Ламеха, не добавляя причин или оттенков, отсутствующих в тексте.
- source_word: እምኔሁ
  choice: его
  rationale: Местоименная предложная форма указывает на объект или источник страха. В русском сочетание «испугался его» кратко и точно сохраняет местоимение исходного текста.
- source_word: ጐየ
  choice: убежал
  rationale: Глагол выражает быстрое удаление, в данном контексте вызванное страхом; «убежал» передаёт это точнее, чем нейтральное «ушёл».
- source_word: መጽአ ኀበ
  choice: пришёл к
  rationale: Сочетание глагола движения с предлогом обозначает прибытие к Мафусалу; «пришёл к» является естественным русским соответствием.
- source_word: አቡሁ
  choice: его отец / своему отцу
  rationale: Первое употребление стоит в приложении к имени Ламех и передано как «его отец»; второе обозначает отца самого Ламеха и естественно передано возвратным притяжательным местоимением «своему».
- source_word: ማቱሳላ
  choice: Мафусал
  rationale: Использована традиционная русская библейская форма имени, однозначно сохраняющая референта геэзского имени.
theological_decisions:
- issue: К кому относится местоимение в сообщении о страхе Ламеха
  choice: В основном тексте сохранено местоимение «его»; сноска указывает, что по ближайшему контексту речь, вероятнее всего, о новорождённом.
  alternative: Прямо написать в основном тексте «испугался младенца».
  rationale: Геэзский текст употребляет местоимение, а не существительное. Поэтому перевод не устраняет формальную краткость и возможную неоднозначность источника, хотя контекст ясно склоняет к новорождённому.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным звучанием. Приложение «его отец» сохранено, чтобы не утратить подчёркнутое указание источника на то, что Ламех был отцом новорождённого; цепочка действий передана кратко и естественно.
