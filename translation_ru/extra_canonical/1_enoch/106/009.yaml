base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/009.yaml
  text: And he answered me and said[a], “Because of a great trouble I have come to you[c][b], and because of a marvelous vision I have drawn near.”
translation:
  language: ru
  text: 'И он ответил мне и сказал: «Из-за сильной тревоги[a] я пришёл к тебе, и из-за необычайного видения приблизился[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за великого бедствия», «из-за крайнего беспокойства» либо «по неотложному делу». Слово указывает на тревогу или срочность, а не на праведность.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «подошёл». Здесь употреблён глагол приближения, по смыслу частично совпадающий с предшествующим выражением «пришёл к тебе».'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ ወይቤ
  choice: он ответил мне и сказал
  rationale: Сохраняет оба глагола исходного текста и суффикс объекта «мне», не сглаживая характерную для повествования формулу речи.
- source_word: በእንተ
  choice: из-за
  rationale: В обеих частях предлог естественно обозначает причину прихода; русский вариант сохраняет параллелизм конструкции.
- source_word: ጻህቅ ዐቢይ
  choice: сильная тревога
  rationale: ጻህቅ здесь связано с тревогой, бедой или настоятельной нуждой, а не с «праведностью» (ጽድቅ). Сочетание «сильная тревога» точно и естественно передаёт усиление прилагательным ዐቢይ.
- source_word: መጻእኩ ኀቤከ
  choice: я пришёл к тебе
  rationale: Прямо передаёт глагол прихода и направление к собеседнику.
- source_word: ራእይ ዐፁብ
  choice: необычайное видение
  rationale: «Видение» сохраняет апокалиптический смысл ራእይ, а «необычайное» передаёт вызывающий изумление характер ዐፁብ без излишней конфессиональной окраски.
- source_word: ቀረብኩ
  choice: приблизился
  rationale: Передаёт отдельный глагол приближения и сохраняет его смысловое перекрытие с предшествующим «пришёл к тебе».
theological_decisions:
- issue: Значение ጻህቅ
  choice: тревога
  alternative: бедствие; настоятельная нужда; срочное дело
  rationale: Форма относится к корню со значением тревоги, беспокойства или срочности и не является словом ጽድቅ «праведность». Поэтому перевод не вводит здесь ни тему праведности, ни личный титул «Праведник».
- issue: Характер видения
  choice: необычайное видение
  alternative: дивное видение; поразительное видение
  rationale: Перевод сохраняет оценочную силу прилагательного, но не уточняет, было ли видение чудесным по происхождению или лишь поразительным для видевшего.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным строем. Сохранены формульное «ответил мне и сказал», параллелизм двух причинных оборотов и различие между глаголами прихода и приближения.
