  text: And he rose up in the hands of the midwife[a], and he opened his mouth and blessed the Lord of heaven.
translation:
  language: ru
  text: И он поднялся на руках у повитухи[a], открыл уста и благословил Господа неба.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «повитуха», буквально может означать нечто вроде «рождающая женщина» или «женщина, помогающая при родах»; в этой сцене оно, вероятнее всего, обозначает женщину, принимавшую ребёнка.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተንሥአ
  choice: поднялся
  rationale: Глагол обозначает вставание или поднятие; в сцене рождения передаёт поразительное действие новорождённого, не добавляя пояснений.
- source_word: ውስተ እዴሃ
  choice: на руках у
  rationale: Буквально выражение указывает на нахождение «в её руках»; по-русски применительно к младенцу естественно сказать «на руках у».
- source_word: መውላዲት
  choice: повитухи
  rationale: В данном контексте существительное естественнее всего обозначает женщину, принимающую ребёнка при родах. Сноска сохраняет лексическую неоднозначность.
- source_word: ፈትሐ አፉሁ
  choice: открыл уста
  rationale: Сохранено образное исходное выражение, важное в рассказе о заговорившем новорождённом; «уста» поддерживает dignified biblical register.
- source_word: ባረኮ
  choice: благословил
  rationale: Основное значение глагола — «благословлять»; оно сохраняет библейскую формулу и не сводит смысл к одному лишь прославлению.
- source_word: እግዚአ ሰማይ
  choice: Господа небес
  rationale: Божественный титул передан традиционным и понятным словом «Господь»; форма «небес» естественна для современного русского библейского регистра и не навязывает различие между единственным и собирательно-множественным пониманием.
theological_decisions:
- issue: Передача божественного титула
  choice: Господа небес
  alternative: Владыку неба; Господа неба
  rationale: Титул переведён, а не транслитерирован. «Господь» является нейтральной и устойчивой передачей божественного владычества; «небес» звучит естественно в русском библейском стиле.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным; выражение «открыл уста» намеренно сохраняет формульность оригинала.
