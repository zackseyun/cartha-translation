base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/014.yaml
  text: And they will commit sin[a], and they will transgress the ordinance; and they will join themselves with women and commit sin with them, and they will take wives from among them[c][b], and they will beget children.
translation:
  language: ru
  text: И они будут грешить и нарушать установление; будут соединяться с женщинами[a], грешить с ними, брать себе жён из их числа и производить потомство[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол означает «соединяться, присоединяться». В контексте речь идёт о запретном союзе, но само слово не называет половой акт прямо.
    reason: lexical_alternative
  - marker: b
    text: 'В предоставленной транскрипции конец стиха ошибочно выглядит как повтор слов «из них и из них». В издании Charles 1906 здесь читается: «и будут рождать детей».'
    reason: textual_variant
lexical_decisions:
- source_word: ይገብሩ፡ ኀጢአተ
  choice: будут грешить
  rationale: Сочетание буквально означает «совершать грех»; естественный русский глагол передаёт тот же нравственный смысл и сохраняет повтор выражения.
- source_word: የኀልፉ፡ ሥርዐተ
  choice: нарушат установление
  rationale: Глагол в данном правовом и нравственном контексте означает нарушение, а ሥርዐት обозначает установленный порядок или предписание. «Установление» не сужает смысл до Моисеева закона.
- source_word: ተደመሩ
  choice: соединятся
  rationale: Передаёт широкое значение присоединения или соединения, не делая выражение более откровенно сексуальным, чем геэзский текст.
- source_word: አንስት
  choice: женщинами
  rationale: Обычное собирательное обозначение женщин; на этом месте слово само по себе ещё не означает «жёны».
- source_word: አውሰቡ
  choice: возьмут себе жён
  rationale: Глагол означает вступить в брак или взять жену; это исправляет ошибочное толкование как «отделятся».
- source_word: እምኔሆን
  choice: из их числа
  rationale: Предлог с местоимением естественно передан как указание на выбор жён из числа упомянутых женщин.
- source_word: ወይወልዱ፡ ውሉደ
  choice: и будут рождать детей
  rationale: Чтение из издания Charles 1906 означает рождение или произведение потомства; по-русски формулировка сохраняет субъект и будущую длительность.
theological_decisions:
- issue: Характер соединения с женщинами
  choice: «соединятся с женщинами» с пояснением широты глагола
  alternative: «вступят с женщинами в половую связь» или «женятся на женщинах»
  rationale: Контекст представляет союз как греховный, однако сам глагол соединения шире явно сексуального или брачного термина. Перевод не усиливает конкретность оригинала.
- issue: Значение глагола አውሰቡ
  choice: «возьмут себе жён»
  alternative: «отделятся от них»
  rationale: Лексическое значение глагола связано с браком и взятием жены. Прежняя альтернатива возникла из ошибочного разбора и не должна сохраняться как богословски значимое разночтение.
- issue: Заключение о детях
  choice: восстановить чтение «будут рождать детей»
  alternative: сохранить повтор «из них и из них» из дефектной транскрипции
  rationale: Повтор в предоставленной машинной транскрипции объясняется ошибочным распознаванием; опубликованный эфиопский текст содержит осмысленную заключительную фразу о рождении детей.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Повтор «будут грешить» сохранён как смысловая особенность источника; термин «установление» выбран вместо конфессионально нагруженного или чрезмерно узкого «закон».
