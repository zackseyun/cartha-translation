base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/006.yaml
  text: And it seems to me that he is not from me, but from the angels; and I fear that a wonder might be done in his days upon the earth.
translation:
  language: ru
  text: И мне кажется, что он не от меня, а от ангелов; и я боюсь, как бы в его дни на земле не совершилось чудо[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «диво», «необычайное явление». Эфиопское слово обозначает нечто поразительное, необыкновенное, а в данном контексте — возможно, и тревожащее.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይመስለኒ
  choice: мне кажется
  rationale: Передаёт настоящее время и субъективное восприятие Ламеха, не превращая его предположение в утверждённый рассказчиком факт.
- source_word: አኮኑ እምኔየ
  choice: он не от меня
  rationale: Сохраняет отрицание и значение происхождения, а также подразумеваемый вопрос об отцовстве.
- source_word: እመላእክት
  choice: от ангелов
  rationale: Прямо сохраняет резкое противопоставление человеческого и ангельского происхождения, не заменяя его расплывчатым указанием на сверхъестественное.
- source_word: እፈረሀ
  choice: я боюсь
  rationale: Настоящее время соответствует форме глагола и продолжающейся прямой речи Ламеха.
- source_word: ኢይትገበር
  choice: как бы … не совершилось
  rationale: Русская конструкция после глагола страха естественно передаёт опасение и сохраняет неопределённость пассивно-безличного выражения.
- source_word: መንክር
  choice: чудо
  rationale: Сохраняет смысл необычайного, вызывающего изумление события; возможная более тревожная окраска пояснена в сноске.
- source_word: በመዋዕሊሁ
  choice: в его дни
  rationale: Сохраняет традиционный временной оборот и прямую связь события с жизнью ребёнка.
- source_word: ዲበ ምድር
  choice: на земле
  rationale: Естественно передаёт пространственное выражение в его широком, земном смысле.
theological_decisions:
- issue: Характер предполагаемого происхождения ребёнка
  choice: Слова об ангельском происхождении представлены как нынешнее тревожное предположение Ламеха.
  alternative: Передать ангельское происхождение как объективно установленный рассказчиком факт либо как простую гиперболу.
  rationale: Формула «мне кажется» требует сохранить субъективность вывода Ламеха и не разрешать богословское напряжение текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Обороты «от ангелов» и «в его дни» сохранены ради смысловой точности; конструкция «боюсь, как бы… не» естественно выражает опасение, не утверждая неизбежность события.
