base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/004.yaml
  text: And the waning that is done in the first gate in its season until one hundred and seventy-seven days are completed—by the reckoning of weeks, twenty-five and two days.
translation:
  language: ru
  text: 'И убывание, которое совершается в первых вратах в своё время, длится, пока не завершатся сто семьдесят семь дней — по счёту недель: двадцать пять недель и два дня.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В геэзском тексте буквально: «двадцать пять и два дня»; слово «недель» восстановлено по выражению «по счёту недель» и по сумме: 25 недель и 2 дня составляют 177 дней.'
    reason: Поясняет грамматически подразумеваемую единицу счёта и сохраняет прозрачность по отношению к форме источника.
lexical_decisions:
- source_word: ታሕጻጼት
  choice: убывание
  rationale: Существительное обозначает уменьшение, в данном контексте — убывание лунного света; «убывание» естественно для современного русского языка.
- source_word: ይትገበር
  choice: происходит
  rationale: Формально пассивная форма означает «совершается / делается»; «происходит» передаёт смысл без неестественной русской кальки.
- source_word: ቀዳሚት
  choice: в первых вратах
  rationale: Форма означает «первые» и по контексту относится к вратам, названным ранее; сохранена традиционная образность астрономического раздела.
- source_word: እስከ፡ ይትፌጸም
  choice: продолжается, пока не исполнятся
  rationale: Передаёт предельную конструкцию «до тех пор, пока не завершатся» и делает синтаксическую связь ясной по-русски.
- source_word: ሥርዓተ፡ ሰንበት
  choice: по счёту недель
  rationale: Буквально связано с порядком/исчислением седмиц; здесь речь идёт о представлении 177 дней как 25 недель и 2 дней.
