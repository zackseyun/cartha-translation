base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/002.yaml
  text: And he showed me all their ordinances—those for every day and every season[a], and for every year, and for its going out and its command[c][b], in every month and every sabbath.
translation:
  language: ru
  text: И он показал мне весь их установленный порядок — на каждый день, на всякое время владычества[a], на каждый год, при его выходе и по его повелению[b], на каждый месяц и на каждую субботу[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В переданном эфиопском тексте оборот со словом «власть» или «владычество» синтаксически не вполне ясен. Видимые рядом эфиопские цифры, вероятно, являются внедрёнными номерами строк, а не числом 365; поэтому в основном тексте сохранено минимальное значение без уточнения, чья это власть.
    reason: textual_variant
  - marker: b
    text: 'Буквально: «в его выходе и в его повелении». Местоименные суффиксы стоят в единственном числе, однако их референт в данном фрагменте не вполне ясен. «Выход» может обозначать также появление или восход.'
    reason: source_ambiguity
  - marker: c
    text: 'Или: «на каждую неделю». Эфиопское слово может обозначать как субботу, так и неделю в календарном контексте.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አርአየኒ
  choice: показал мне
  rationale: Естественно передаёт введение в видение и не усиливает глагол до специальной формулы откровения.
- source_word: ኵሎ ሥርዓቶሙ
  choice: весь их установленный порядок
  rationale: В астрономическом контексте речь идёт о предписанном устройстве и ходе небесных явлений; единственное собирательное число по-русски звучит естественнее, чем «все их установления».
- source_word: በኵሉ ዕለት
  choice: на каждый день
  rationale: Сохраняет повторяющуюся перечислительную конструкцию и временной охват.
- source_word: በኵሉ ዘመን
  choice: на всякое время
  rationale: ዘመን допускает значения «время», «срок», «пора»; нейтральное «время» сохраняет многозначность.
- source_word: ሥልጣን
  choice: не вынесено в основной текст
  rationale: В предоставленной транскрипции слово окружено внедрёнными номерами строк, а синтаксис фрагмента неясен. Неуверенное чтение отмечено сноской вместо искусственного русского оборота.
- source_word: በኵሉ ዓመት
  choice: на каждый год
  rationale: Продолжает параллельный ряд календарных периодов.
- source_word: በሙጻኡ
  choice: при его выходе
  rationale: Суффикс имеет третье лицо единственного числа. «Выход» сохраняет возможность понимать слово как появление, восход или движение наружу.
- source_word: በትእዛዙ
  choice: по его повелению
  rationale: Суффикс передан в единственном числе; «повеление» сохраняет оттенок властного предписания.
- source_word: በኵሉ ወርኅ
  choice: на каждый месяц
  rationale: Прямое календарное значение с сохранением параллелизма.
- source_word: ኵሉ ሰንበት
  choice: на каждую субботу
  rationale: Буквальное значение сохранено; возможное более широкое значение «неделя» указано в сноске.
theological_decisions:
- issue: Передача ሰንበት
  choice: суббота
  alternative: неделя
  rationale: Буквальное культово-календарное значение не следует без необходимости обобщать; контекст всё же допускает значение недели, поэтому оно отмечено в сноске.
- issue: Неясный фрагмент со словом ሥልጣን
  choice: не реконструировать число 365 и не вставлять синтаксически сомнительную фразу в основной текст
  alternative: «под властью трёхсот шестидесяти пяти» или «которое имеет власть»
  rationale: Знаки ፴, ፴፭ и ፵, по данным истории проверки, являются номерами строк, а не частью текста. Связь ሥልጣን с окружением остаётся неуверенной; ложная точность исказила бы календарную концепцию книги.
- issue: Число грамматического референта в «его выходе» и «его повелении»
  choice: единственное число
  alternative: «при их выходе и по их повелению»
  rationale: Суффиксы ሙጻኡ и ትእዛዙ имеют форму третьего лица единственного числа; референт оставлен неуточнённым, чтобы не устранять подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский, с достоинством и умеренно формальным библейским ритмом. Повтор «на каждый/на всякий» удерживает каталожную структуру стиха; архаизмы и конфессионально окрашенные уточнения не вводятся.
