base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/003.yaml
  text: And the moon wanes[a], which takes place through the sixth gate; for in this sixth gate its light is completed[c][b], and from it comes the beginning of the waning.
translation:
  language: ru
  text: И луна убывает[a] — это происходит через шестые врата; ибо в этих шестых вратах её свет достигает полноты[c], и от них начинается убывание[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «И убывание луны происходит через шестые врата». Эфиопская формулировка допускает более отвлечённое, процедурное описание процесса.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «начало уменьшения»; то есть наступает начало убывания луны. Глагол в предшествующей части выражает, что это начало исходит от шестых врат.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «её свет завершается»; смысл может состоять в том, что он достигает полной меры.'
    reason: source_literality
lexical_decisions:
- source_word: ሐጸጸ ወርኅ
  choice: луна убывает
  rationale: Простой русский глагол «убывает» прямо передаёт уменьшение видимой освещённости луны и соответствует глагольной форме источника, не превращая её без необходимости в отвлечённое существительное.
- source_word: ይትገበር
  choice: это происходит
  rationale: Возвратно-пассивная форма описывает осуществление процесса; «происходит» естественно по-русски и не устраняет присущий тексту процедурный оттенок.
- source_word: በሳድስት ኆኅት
  choice: через шестые врата
  rationale: Предлог передаёт врата как путь движения светила. Русское «врата» грамматически имеет форму множественного числа, хотя исходное ኆኅት обозначает одни врата.
- source_word: ይትፌጸም ብርሃኑ ዚአሁ
  choice: её свет достигает полноты
  rationale: Так сохраняется значение завершения, или достижения полной меры, применительно к лунному свету; выражение звучит естественнее буквального «завершается».
- source_word: እምኔሁ
  choice: от них
  rationale: Местоимение естественнее всего отнести к только что упомянутым шестым вратам; множественное число обусловлено русской формой слова «врата».
- source_word: ርእሰ ታሕጻጼት
  choice: начинается убывание
  rationale: Буквальный образ «голова уменьшения» идиоматически означает начало или наступление убывания.
theological_decisions:
- issue: Апокалиптическое описание движения светил или современное астрономическое изложение
  choice: Сохранить образ движения луны через шестые врата и упорядоченного перехода к убыванию.
  alternative: Передать стих только как наблюдение о смене лунных фаз.
  rationale: Текст описывает небесные процессы в собственной космологической образности. Перевод не модернизирует её и не пытается согласовать с более поздними астрономическими моделями.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном. Сохранён характерный для Книги светил образ небесных врат; синтаксис слегка упрощён ради ясности, без превращения текста в современное научное описание.
