base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/001.yaml
  text: And now[a], my son, I have shown you everything[b], and the order of all the stars of heaven has been completed.
translation:
  language: ru
  text: И теперь, сын мой, я показал тебе всё, и порядок всех небесных звёзд завершён.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «и исполнился порядок всех небесных звёзд». Эфиопский текст может подразумевать как завершение рассказа о небесном порядке, так и исполнение самого этого порядка.'
    reason: Сохранение смысловой неоднозначности завершительного глагола и его отношения к небесному порядку.
lexical_decisions:
- source_word: ወይእዜኒ
  choice: И теперь
  rationale: Передаёт переходный заключительный оборот и сохраняет связность повествования без лишнего усиления частицы.
- source_word: ወልድየ
  choice: сын мой
  rationale: Сохраняет прямое родственное обращение и наставительный тон откровения.
- source_word: ኵሎ
  choice: всё
  rationale: Естественно передаёт полноту показанного и служит прямым дополнением к глаголу.
- source_word: አርአይኩከ
  choice: я показал тебе
  rationale: Передаёт значение показывания или открытия видимого; прошедшее время естественно подводит итог предшествующему откровению.
- source_word: ተፈጸመት
  choice: завершён
  rationale: Сохраняет завершительное и пассивное значение, не уточняя однозначно, идёт ли речь о завершении изложения или об исполнении самого небесного порядка.
- source_word: ሥርዓተ
  choice: порядок
  rationale: В данном астрономическом контексте обозначает установленное устройство и регулярность небесных светил; «порядок» звучит естественно и сохраняет смысловую широту.
- source_word: ኵሉ ከዋክብተ ሰማያት
  choice: всех небесных звёзд
  rationale: Точно передаёт совокупность звёзд неба и сохраняет возвышенный, но современный русский регистр.
theological_decisions:
- issue: Означает ли последняя часть завершение рассказа о небесном порядке или исполнение самого порядка
  choice: Сохранена формулировка «завершён порядок всех небесных звёзд», допускающая оба смысловых оттенка.
  alternative: «завершено изложение порядка всех небесных звёзд» или «исполнился порядок всех небесных звёзд»
  rationale: Наставительный контекст склоняет к завершению описания, однако исходная пассивная формулировка прямо не называет изложение; поэтому неоднозначность не снимается в основном тексте и поясняется в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным наставительным звучанием. Синтаксис близок к оригиналу; архаизмы и конфессионально окрашенные уточнения не вводятся.
