base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/005.yaml
  text: And all the cattle feared them and were terrified by them[b][a], and they began to bite with their teeth and to devour and to gore with their horns.
translation:
  language: ru
  text: И весь скот боялся их и был в ужасе перед ними[a]; а те[b] стали кусать зубами, пожирать и бодать рогами.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «устрашался от них»; выражение описывает ужас при их появлении или в их присутствии.'
    reason: translation_note
  - marker: b
    text: «Те» относятся к появившимся ранее нападающим животным. В геэзском подлежащее глагола прямо не названо, но контекст указывает на смену действующего лица.
    reason: ambiguity_note
  - marker: c
    text: 'В исходном тексте последовательно сохранён образ животных: скот испытывает страх, а нападающие кусают зубами и бодают рогами. Кого символизируют животные, этот стих сам не поясняет.'
    reason: cultural_note
lexical_decisions:
- source_word: ኵሎሙ፡ አልህምት
  choice: весь скот
  rationale: Сохраняет собирательное обозначение крупных домашних животных и зооморфный образ, не подменяя его толкованием символов.
- source_word: ፈርህዎሙ
  choice: боялся их
  rationale: Прямая передача глагола страха с объектным местоимением.
- source_word: ወደንገፁ
  choice: приходил в ужас
  rationale: Передаёт усиление по сравнению с предшествующим «боялся», не сглаживая парное выражение.
- source_word: እምኔሆሙ
  choice: перед ними
  rationale: Сохраняет пространственно-причинный оттенок геэзского выражения «от/перед ними»; по-русски здесь естественно описывает ужас в их присутствии.
- source_word: ወአሐዙ
  choice: и они стали
  rationale: Передаёт начинательное значение конструкции, сохраняя невыраженность лексического подлежащего и связанную с ней неоднозначность.
- source_word: ይኔክሱ፡ በስኒሆሙ
  choice: кусать зубами
  rationale: Сохраняет конкретную и нарочито животную образность исходного текста.
- source_word: ይውሕጡ
  choice: пожирать
  rationale: Передаёт насильственное поглощение или проглатывание и соответствует контексту нападения.
- source_word: ይወግኡ፡ በአቅርንቲሆሙ
  choice: бодать рогами
  rationale: Контекст с рогами уточняет общий смысл удара как нападение посредством рогов; русское выражение звучит естественно и конкретно.
theological_decisions:
- issue: Сохранять ли символический животный ряд или назвать изображаемые им человеческие группы
  choice: В основном тексте сохранены «скот», «зубы» и «рога».
  alternative: Заменить животных непосредственно обозначаемыми ими человеческими группами.
  rationale: Апокалиптическое видение намеренно выражено через зооморфные символы; сам стих не раскрывает их референтов.
- issue: К кому относится невыраженное подлежащее глагола «стали»
  choice: Оставлено местоимение «они» и добавлено примечание о возможном переходе к ранее упомянутым нападающим животным.
  alternative: Однозначно написать «те животные стали», устранив возможное отнесение к скоту.
  rationale: Глагольная форма указывает на третье лицо множественного числа, но не называет подлежащее; контекст поддерживает смену действующего лица, тогда как сама форма сохраняет формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, но достойным повествовательным ритмом. Лексика конкретна и сохраняет напряжённую зооморфную образность апокалиптического видения; символы не истолковываются внутри перевода.
