- issue: Следует ли истолковать звезду в основном тексте как ангела или небесное существо
  choice: Сохранить буквальный образ «одна звезда».
  alternative: «один ангел» или «одно небесное существо»
  rationale: В «Апокалипсисе животных» звёзды могут символизировать небесных существ, однако сам стих называет явившийся образ звездой. Перевод не подменяет образ его возможным толкованием.
