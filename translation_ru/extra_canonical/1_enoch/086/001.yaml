base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/001.yaml
  text: And again I looked with my eyes while I was sleeping[a], and I saw heaven above, and behold, one star fell from heaven[c][b], and it arose and ate and grazed in the midst of those cattle.
translation:
  language: ru
  text: И снова, когда я спал, я смотрел своими глазами и увидел небо наверху. И вот, одна звезда упала с неба[a], поднялась, ела и паслась среди того скота[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В «Апокалипсисе животных» звёзды нередко символизируют небесных существ, но в самом стихе сказано именно «звезда».
    reason: cross_reference
  - marker: b
    text: 'Буквально: «ела и паслась». Слово, переведённое как «скот», обозначает крупный рогатый скот, а не телят.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ካዕበ
  choice: снова
  rationale: Передаёт переход к следующему этапу видения и сохраняет повторный характер повествования.
- source_word: ርኢኩ በአዕይንትየ
  choice: я смотрел своими глазами
  rationale: Сохраняет явное упоминание глаз и не устраняет повтор глагола зрения в следующей части стиха.
- source_word: እንዘ እነውም
  choice: когда я спал
  rationale: Ясно передаёт, что видение происходило во сне, естественным современным русским языком.
- source_word: ሰማየ መልዕልተ
  choice: небо вверху
  rationale: Сохраняет пространственную направленность выражения без добавления космологических толкований.
- source_word: ነዋ
  choice: и вот
  rationale: Естественная для русского апокалиптического повествования формула, вводящая поразительный образ.
- source_word: ኮከብ አሐዱ
  choice: одна звезда
  rationale: Сохраняет как образ звезды, так и значимость числительного «одна».
- source_word: ወድቀ እምሰማይ
  choice: упала с неба
  rationale: Передаёт именно падение, а не нейтральное нисхождение.
- source_word: ወይትሌዐል
  choice: поднялась
  rationale: Естественно передаёт последующее вставание или поднятие звезды после падения, не уточняя способ действия.
- source_word: ወይበልዕ ወይትረዐይ
  choice: стала есть и пастись
  rationale: Сохраняет два отдельных действия и животную образность видения; «стала» делает сочетание естественным по-русски.
- source_word: ማእከለ እልከቱ አልህምት
  choice: среди того скота
  rationale: አልህምት обозначает крупный рогатый скот, а не телят; собирательное «скот» естественно в русском и сохраняет вид животных.
