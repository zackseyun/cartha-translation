base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/006.yaml
  text: And they began again to devour those cattle[a], and behold[c][b], all the children of the earth began [to tremble and flee].
translation:
  language: ru
  text: И они снова начали пожирать тех быков[a]. И вот, все дети земли[b] начали [дрожать и бежать][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «крупный рогатый скот»; по контексту также возможно: «волов».'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение «дети земли» сохранено как апокалиптический образ; по смыслу возможно: «обитатели земли».'
    reason: cultural_note
  - marker: c
    text: Предоставленная эфиопская строка обрывается после слова «начали». Слова «дрожать и бежать» восполнены по продолжению стиха и поэтому заключены в квадратные скобки.
    reason: textual_note
lexical_decisions:
- source_word: አሐዙ
  choice: начали
  rationale: Глагол может означать «взялись, начали»; перед следующим глаголом он естественно передаёт начало действия. Последнее አሐዙ открывает второе сказуемое, продолжение которого отсутствует в предоставленной строке.
- source_word: እንከ
  choice: снова
  rationale: Частица здесь отмечает продолжение или возобновление действия в разворачивающемся видении; «снова» сохраняет этот повествовательный оттенок.
- source_word: ይብልዕዎሙ
  choice: пожирать тех
  rationale: Глагол означает «есть, поглощать, пожирать». В сцене нападения «пожирать» передаёт хищническую силу образа, а местоименный суффикс — объект действия.
- source_word: እልኩ አልህምት
  choice: тех быков
  rationale: አልህምት обозначает крупный рогатый скот, а не слонов. В контексте животной символики «быки» звучит конкретно и естественно, хотя родовое значение слова шире.
- source_word: ነዋ
  choice: и вот
  rationale: Это указательно-восклицательная частица «вот!», вводящая новый поворот видения; её не следует понимать как глагол «дрожать».
- source_word: ኵሎሙ ውሉደ ምድር
  choice: все дети земли
  rationale: Буквальный апокалиптический оборот сохранён без преждевременного истолкования как просто «жители земли».
- source_word: '[ይርዐዱ ወይርወጹ]'
  choice: '[дрожать и бежать]'
  rationale: Эти слова не видны в предоставленной транскрипции, которая обрывается после «начали», но засвидетельствованы как продолжение стиха; квадратные скобки честно отмечают восполнение утраты.
theological_decisions:
- issue: Сохранять ли конкретную животную образность или раскрывать предполагаемый символический смысл
  choice: быков
  alternative: могущественных правителей или народы
  rationale: «Апокалипсис животных» говорит образами. Перевод сохраняет видимый образ и не подменяет его толкованием.
- issue: Как передать выражение «дети земли»
  choice: дети земли
  alternative: жители земли
  rationale: Буквальный образ допускает более одного смыслового оттенка и сохраняет апокалиптическое напряжение, тогда как «жители» уже сужает его до одного толкования.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повествовательной интонацией. Конкретная образность видения и подлинная текстуальная неопределённость сохранены; восполнение лакуны отмечено явно.
