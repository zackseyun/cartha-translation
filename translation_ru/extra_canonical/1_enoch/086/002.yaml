base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/002.yaml
  text: And after that I saw large and black cattle[a], and behold, all of them changed their stalls and their pastures and their calves[c][b], and they began to live with one another.
translation:
  language: ru
  text: После этого я увидел крупных чёрных быков[a]. И вот, все они переменили свои стойла, пастбища и телят[b] и стали жить друг с другом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово может обозначать крупный рогатый скот вообще, без уточнения пола.
    reason: lexical_alternative
  - marker: b
    text: 'Фраза о перемене «стойл, пастбищ и телят» трудна как по тексту, так и по смыслу. Возможно также: «их жилища, места выпаса и детёнышей».'
    reason: textual_variant
  - marker: c
    text: 'Или: «начали жить вместе»; «стали обитать друг с другом».'
    reason: lexical_alternative
lexical_decisions:
- source_word: አልህምተ
  choice: быков
  rationale: В контексте животной символики слово обозначает представителей крупного рогатого скота. Русское «быков» сохраняет конкретный зрительный образ; родовое «скот» здесь затруднило бы согласование с последующим множественным числом.
- source_word: ዐቢያነ
  choice: крупных
  rationale: Прилагательное указывает прежде всего на размер или внушительность; «крупных» естественно для описания животных.
- source_word: ጸሊማነ
  choice: чёрных
  rationale: Точное обозначение цвета сохраняет значимый цветовой контраст животного видения и не ослабляет его более расплывчатым «тёмных».
- source_word: ወለጡ
  choice: переменили
  rationale: Глагол выражает изменение или смену, однако сочетание перечисленных объектов семантически трудно. «Переменили» сохраняет широкий смысл, не уточняя способ изменения.
- source_word: ምዕያኖሙ
  choice: свои стойла
  rationale: В скотоводческом образном ряду вероятно обозначены места содержания животных; более широкое значение «жилища» отмечено в сноске.
- source_word: ምርጓዮሙ
  choice: пастбища
  rationale: Передаёт место выпаса естественным современным русским словом и сохраняет пастушескую образность.
- source_word: አጥዐጥሆሙ
  choice: телят
  rationale: В контексте крупного рогатого скота конкретное «телята» уместнее общего «детёныши», хотя всё перечисление остаётся трудным.
- source_word: አሐዙ ተየሐይዉ ፩ ለካልኡ
  choice: стали жить друг с другом
  rationale: «Стали» передаёт начинательное значение, а «жить друг с другом» — взаимность совместного обитания.
theological_decisions:
- issue: Следует ли раскрывать человеческих символических референтов животных
  choice: Сохранить в основном тексте буквальную образность быков
  alternative: Заменить животных предполагаемыми человеческими группами
  rationale: Апокалиптическое видение намеренно говорит посредством животных и цветов; перевод не должен подменять образ его толкованием.
- issue: Передача цвета ጸሊማነ
  choice: чёрных
  alternative: тёмных
  rationale: «Чёрных» сохраняет точный цветовой контраст внутри видения, не навязывая при этом толкования символа.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным повествовательным тоном. Необычность перечисления сохранена, а не сглажена толкованием; тяжеловесное родовое выражение «крупный рогатый скот» вынесено из основного текста.
