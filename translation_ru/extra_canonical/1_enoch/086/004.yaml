base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/004.yaml
  text: 'And I looked at them and saw: behold[a], they all let out their private parts like horses, and they began to mount the cows; and they all conceived and gave birth to elephants, camels[c][b], and donkeys.'
translation:
  language: ru
  text: 'И я посмотрел на них и увидел: вот, все они обнажили свои половые органы[a], как кони, и начали взбираться на коров. И все коровы зачали и родили слонов, верблюдов и ослов[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение в геэз недвусмысленно обозначает мужские половые органы и, вероятно, их обнажение или вытягивание наружу.
    reason: lexical_alternative
  - marker: b
    text: Необычный перечень потомства принадлежит символическому миру «Апокалипсиса животных» и не является обычным зоологическим описанием.
    reason: cultural_note
lexical_decisions:
- source_word: ወነጸርክዎሙ፡ ወርኢኩ፡ ወነዋ
  choice: 'И я посмотрел на них и увидел: вот'
  rationale: Сохранена удвоенная формула видения — действие взгляда, последующее видение и указательное «вот», характерное для апокалиптического повествования.
- source_word: አውፁኡ፡ ንፍረታቲሆሙ
  choice: выставили наружу свои половые органы
  rationale: Передаёт как направленное наружу действие глагола, так и недвусмысленно сексуальный смысл существительного, не прибегая ни к неясному эвфемизму, ни к грубо-разговорной лексике.
- source_word: ከመ፡ አፍራስ
  choice: как кони
  rationale: Буквальное сравнение существенно для животной образности видения; «кони» здесь естественнее, чем общее «лошади», поскольку речь идёт о самцах.
- source_word: ወአሐዙ፡ ይዐረጉ፡ ዲበ፡ አንስት፡ አልህምት
  choice: и начали взбираться на коров
  rationale: «Взбираться на» сохраняет пространственный образ исходного выражения и в данном контексте ясно обозначает спаривание. አልህምት означает коров/крупный рогатый скот, а не слоних.
- source_word: ወጸንሳ፡ ኵሎነ፡ ወወለዳ
  choice: И все те зачали и родили
  rationale: Женский референт уточнён указательным «те», чтобы по-русски было ясно, что зачали коровы, а не предшествующие самцы; глаголы сохраняют краткий возвышенный регистр источника.
- source_word: ነጌያተ፡ ወአገማሰ፡ ወአእዳገ
  choice: слонов, верблюдов и ослов
  rationale: Прямо передан трёхчастный перечень необычного потомства без истолковывающей подмены образов.
theological_decisions:
- issue: Степень явности сексуальной образности в видении
  choice: 'Сохранить прямое упоминание половых органов и действия самцов: «выставили наружу свои половые органы… начали взбираться на коров»'
  alternative: Смягчить до общего «стали спариваться с коровами»
  rationale: Источник намеренно изображает противоестественное совокупление резкими зооморфными образами. Обобщение ослабило бы напряжение видения и скрыло детали текста.
- issue: Истолкование необычного потомства
  choice: Оставить названия животных без встроенного аллегорического объяснения
  alternative: Назвать их исполинами или прямо отождествить с определёнными группами
  rationale: Стих сообщает образы — слонов, верблюдов и ослов, — но сам здесь не раскрывает их значения; перевод не должен превращать возможное толкование в текст.
translation_notes:
  register: Современный литературный русский язык с достоинством, но без смягчения намеренно резкой сексуальной образности. Синтаксис сохраняет последовательность формул видения; лексика понятна широкому читателю и не вводит конфессионального толкования.
