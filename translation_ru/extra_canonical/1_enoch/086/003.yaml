base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/003.yaml
  text: And again I saw in the vision[a], and I looked up to heaven; and behold, I saw many stars. They came down and were cast from heaven to that first star, and among those calves they became bulls[d][c][b], and they pastured with them.
translation:
  language: ru
  text: 'И снова я увидел в видении и поднял взгляд к небу. И вот, я увидел множество звёзд: они сошли и были низвергнуты с неба к той первой звезде[a]. Среди тех телят они стали быками[b] и паслись вместе с ними[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Та первая звезда» — вероятно, звезда, уже упомянутая ранее в этом видении.
    reason: cross_reference
  - marker: b
    text: 'Буквально здесь сохраняется зооморфный образ: звёзды стали быками среди телят. Перевод не заменяет звёзды их возможным символическим значением — небесными существами.'
    reason: symbolic_ambiguity
  - marker: c
    text: 'Геэзский глагол здесь означает «пастись, кормиться». Ранее его иногда связывали с похожим по написанию корнем «видеть» и переводили: «были видны среди них».'
    reason: textual_lexical_clarification
lexical_decisions:
- source_word: ወካዕበ፡ ርኢኩ፡ በራእይ
  choice: И снова я увидел это в видении
  rationale: Сохраняет повторную формулу повествования и явно обозначает рамку видения; местоимение «это» естественно передаёт русское управление глагола.
- source_word: ነጸርክዎ፡ ለሰማይ
  choice: поднял взгляд к небу
  rationale: Передаёт направленное созерцание неба естественным современным русским языком.
- source_word: ነዋ
