  rationale: Сохраняет указательную выразительность апокалиптического рассказа без излишней архаизации.
- source_word: ከዋክብተ፡ ብዙኃነ
  choice: множество звёзд
  rationale: Прямо сохраняет образ и множественность, не истолковывая звёзды как ангелов.
- source_word: ወረዱ፡ ወተገደፉ፡ እምሰማይ
  choice: они сошли и были низвергнуты с неба
  rationale: Различает простое нисхождение и последующее пассивное низвержение, сохраняя оба глагола и силу второго.
- source_word: በኀበ፡ ዝኩ፡ ኮከብ፡ ቀዳማዊ
  choice: к той первой звезде
  rationale: Сохраняет указательное и порядковое определение, вероятно отсылающее к ранее упомянутой звезде.
- source_word: ማእከለ፡ እልኩ፡ ጣዕዋ
  choice: среди тех телят
  rationale: ጣዕዋ обозначает телят или молодых животных крупного рогатого скота; «телят» сохраняет конкретный зооморфный образ.
- source_word: አልህምት፡ ኮኑ
  choice: они стали быками
  rationale: Контекст требует мужских животных крупного рогатого скота, а не лошадей; «быками» естественно передаёт контраст с телятами и зооморфный код видения.
- source_word: ወምስሌሆሙ፡ ይትረዓዩ
  choice: и паслись вместе с ними
  rationale: Глагол связан с корнем «пасти(сь), кормиться», а не с глаголом «видеть»; возвратная форма естественна для животных в русском языке.
theological_decisions:
- issue: Кого обозначают звёзды в видении
  choice: В основном тексте сохранено слово «звёзды» без отождествления с ангелами.
  alternative: «ангелы» или «небесные существа»
  rationale: Геэзский текст прямо называет их звёздами. Возможный символический смысл не следует подменять толкованием в переводе.
- issue: Характер удаления с неба
  choice: «были низвергнуты с неба»
  alternative: «упали с неба»
  rationale: Пассивная форма указывает на воздействие извне и сильнее простого падения, однако не уточняет деятеля.
- issue: Превращение звёзд в животных
  choice: «среди тех телят они стали быками»
  alternative: Объяснить в тексте как превращение Стражей ради союза с земными существами.
  rationale: Перевод сохраняет символическое превращение, не вводя в основной текст богословскую идентификацию или мотив, прямо здесь не названные.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования. Формула «И вот» сохраняет возвышенную зримость текста, тогда как синтаксис и лексика остаются понятными широкому читателю. Термины видения переданы конкретно, без конфессионального истолкования.
