base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/003.yaml
  text: And if he sends his wrath upon you for all your deeds[a], will you not entreat him? For you speak great and harsh words against his righteousness[d][c][b], and you have no peace.
translation:
  language: ru
  text: И если Он пошлёт на вас Свой гнев за все ваши дела, разве вы не станете умолять Его? Ведь вы говорите против Его праведности великие и суровые слова[a], и нет вам мира.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «великое и жёсткое»; подразумеваются слова или речи. Это устойчивая для 1 Еноха формула дерзкой речи против Бога.'
    reason: Поясняет подразумеваемое существительное и сохраняет необычную исходную формулу, не подменяя её конфессиональным толкованием.
lexical_decisions:
- source_word: ፈነወ
  choice: пошлёт
  rationale: Передаёт основное значение «послать, направить», сохраняя образ гнева, обращённого на виновных.
- source_word: መዐቶ
  choice: Свой гнев
  rationale: «Гнев» естественно и точно передаёт судебно-апокалиптическую силу слова; возвратное притяжательное местоимение ясно связывает гнев с подлежащим.
- source_word: በኵሉ ምግባሪክሙ
  choice: за все ваши дела
  rationale: Предлог «за» кратко выражает причинно-судебную связь между поступками адресатов и гневом.
- source_word: አኮ አንትሙ እለ ታስተበቍዕዎ
  choice: разве вы не станете умолять Его?
  rationale: አኮ понято как частица риторического вопроса, ожидающего утвердительного ответа; «умолять» передаёт настойчивую мольбу без громоздкости.
- source_word: ዲበ ጽድቅ ዚአሁ
  choice: против Его праведности
  rationale: «Праведность» сохраняет широкое значение Божьей нравственной правоты, хотя в контексте суда включает и оттенок справедливости.
- source_word: ዐቢይተ ወጽኑዓተ
  choice: великое и жестокое
  rationale: Сохраняется буквальная енохическая формула «великое и жёсткое/жестокое», относящаяся к дерзкой, богохульной речи, без замены её толкованием «гордое и надменное».
- source_word: አልብክሙ ሰላመ
  choice: нет вам мира
  rationale: Краткая формула естественна для русского пророческого регистра и близко передаёт отсутствие мира у адресатов.
theological_decisions:
- issue: Значение ጽድቅ в контексте осуждения
  choice: Его праведности
  alternative: Его справедливости
  rationale: Контекст допускает судебное «справедливость», однако исходное слово шире и обозначает также нравственную правоту; основной текст сохраняет эту широту.
- issue: Референт посылающего гнев
  choice: Он пошлёт Свой гнев
  alternative: Бог пошлёт Свой гнев
  rationale: В геэзском тексте субъект выражен местоименно, поэтому имя Бога не добавляется; прописная буква указывает на ясный из контекста божественный референт.
- issue: Функция частицы አኮ
  choice: 'риторический вопрос: «разве вы не станете умолять Его?»'
  alternative: 'отрицательное утверждение: «вы не сможете умолять Его»'
  rationale: В данном синтаксическом окружении частица естественно вводит риторический вопрос, согласно которому при наступлении суда адресаты станут молить Бога; отрицательное утверждение меняло бы ход мысли.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Синтаксис сделан естественным для чтения вслух; необычная енохическая формула сохранена в основном тексте, а её буквальная форма и смысл пояснены в сноске.
