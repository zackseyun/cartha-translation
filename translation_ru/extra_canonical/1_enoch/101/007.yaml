base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/007.yaml
  text: And at his rebuke it will be afraid and dry up[a], and all its fish will die, and everything that is in it[c][b]. But you sinners who are upon the earth do not fear him.
translation:
  language: ru
  text: От его обличения оно[a] устрашится и высохнет; вся рыба в нём умрёт, и погибнет всё, что в нём. Но вы, грешники, находящиеся на земле, не боитесь его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Оно» относится к морю, названному в предыдущем стихе. В геэз это слово здесь прямо не повторено; женские формы глаголов и местоименных суффиксов относятся к нему.
    reason: cross_reference
lexical_decisions:
- source_word: በተግሣጹ
  choice: от его обличения
  rationale: 'Предлог በ передаёт причину или обстоятельство, а суффикс -u — мужской род единственного числа: речь идёт об обличении Бога, а не моря. «Обличение» сохраняет судебно-назидательную силу слова.'
- source_word: ትፈርህ ወትየብስ
  choice: оно устрашится и высохнет
  rationale: Женские формы в геэз относятся к морю или водам из предыдущего контекста. В русском местоимение согласовано с подразумеваемым словом «море»; будущая форма естественно передаёт последовательность грядущего суда.
- source_word: ዓሣቲሃ ይመውት
  choice: вся рыба в нём умрёт
  rationale: «Рыба» употреблена собирательно; оборот «в нём» естественно передаёт притяжательный суффикс женского рода исходного текста.
- source_word: ኵሉ ዘሀሎ ውስቴታ
  choice: и всё, что в нём
  rationale: Сохранено расширение картины гибели от рыбы ко всему содержимому моря без добавления отсутствующего в тексте сказуемого.
- source_word: ኃጥኣን እለ ዲበ ምድር
  choice: грешники, находящиеся на земле
  rationale: Прямо передаёт нравственное обозначение адресатов и их местонахождение, не добавляя значения постоянного проживания.
- source_word: ኢትፈርህዎ
  choice: не боитесь его
  rationale: Объектный суффикс -wo — мужского рода единственного числа и указывает на Бога. Настоящее время выражает устойчивое состояние грешников.
theological_decisions:
- issue: К кому относятся местоимения в начале и конце стиха
  choice: Начальное «его» и заключительное «его» относятся к Богу, а реагирующее «оно» — к морю или водам.
  alternative: Считать все местоимения указанием на море или воды.
  rationale: 'Геэз различает мужские суффиксы при «обличении» и после «не боитесь» и женские формы, описывающие реакцию моря и его содержимое. Это грамматическое противопоставление сохраняет смысл: творение страшится Божьего обличения, а грешники не страшатся Бога.'
- issue: Олицетворённый страх моря
  choice: Сохранить выражение «оно устрашится».
  alternative: Ослабить образ до «оно содрогнётся» или устранить олицетворение.
  rationale: Глагол прямо обозначает страх, а олицетворение уместно для апокалиптической речи и усиливает противопоставление морю бесстрашных грешников.
translation_notes:
  register: Современный литературный русский с возвышенной, но понятной апокалиптической интонацией. Местоимения, относящиеся к Богу, даны со строчной буквы согласно общему стилю перевода. Точка с запятой связывает последовательность космического суда, не сглаживая резкий переход к обращению к грешникам.
