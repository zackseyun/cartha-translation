base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/006.yaml
  text: Is not the whole sea[a], and all its waters, and all its movements[c][b], the work of the Most High? And he has measured all its works and bound its shores with sand.
translation:
  language: ru
  text: Разве не всё море, все его воды и все его волнения[a] — дело Всевышнего? Он измерил все его деяния и закрепил песком его берега.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «движения»; слово может конкретнее обозначать морские волны или приливы.'
    reason: lexical_alternative
  - marker: b
    text: Заключительные слова в дошедшем геэзском тексте трудны. Буквальное чтение имеющейся формы может быть передано как «связал песком его основания»; вероятно, речь идёт о том, что Бог установил морю предел.
    reason: textual_variant
lexical_decisions:
- source_word: አኮ
  choice: Не всё ли
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: ኵሉ ባሕር
  choice: всё море
  rationale: Единственное число последующих местоименных форм указывает на море как на единое целое; поэтому «всё море» предпочтительнее распределительного «каждое море».
- source_word: ማያቲሃ
  choice: все его воды
  rationale: Сохраняет множественное число геэзской формы и естественно звучит по-русски.
- source_word: ሑሳታ
  choice: все его волнения
  rationale: Слово обозначает движения или возмущения моря и может конкретнее относиться к волнам; «волнения» сохраняет эту смысловую широту.
- source_word: ግብረ ልዑል
  choice: дело Всевышнего
  rationale: Передаёт море и его явления как творение Бога, сохраняя возвышенный божественный титул.
- source_word: ግብረታ
  choice: его деяния
  rationale: Женский суффикс единственного числа соотнесён с морем; повтор корня ግብር сохранён через близкое по смыслу слово, чтобы не создавать неестественный русский повтор «дело — дела».
- source_word: ዐቀመ
  choice: измерил
  rationale: Сохраняет образ установленной Богом меры и упорядоченности творения.
- source_word: አሰረ
  choice: связал
  rationale: Сохраняет конкретный образ связывания или закрепления пределов моря, не ослабляя его до абстрактного «установил».
- source_word: እብንታሃ … ቡኖባ
  choice: песком его берега
  rationale: Контекстуальное чтение понимает заключительные слова как указание на закреплённые песком берега или предел моря; трудность переданного геэзского текста отмечена в сноске.
theological_decisions:
- issue: Божественный титул ልዑል
  choice: Всевышний
  alternative: Превознесённый
  rationale: «Всевышний» — узнаваемый и уместный в иудейской апокалиптической литературе титул, не требующий конфессионального уточнения.
- issue: Божественное установление морских пределов
  choice: связал песком его берега
  alternative: связал песком его основания
  rationale: Основной текст передаёт понятный космологический образ ограничения моря песчаным берегом, а более буквальное чтение трудной формы сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Риторический вопрос и параллельное перечисление сохранены; неясность заключительной фразы не устранена молча, а вынесена в сноску.
