base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/001.yaml
  text: Observe heaven[a], you sons of heaven, and every work of the Most High; and fear him[b], and do not do evil before him.
translation:
  language: ru
  text: Рассмотрите небо[a], сыны неба[b], и всякое дело Всевышнего; бойтесь Его и не творите зла пред Ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «Вопросите небо, сыны неба, о всяком деле Всевышнего». Однако в данном контексте глагол, вероятно, означает «рассмотрите» или «понаблюдайте», а союз перед словами «всякое дело» естественнее понимать как «и».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сыны неба»; выражение может относиться либо к людям в образном смысле, либо к небесным существам.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: ጠይቅዋ
  choice: Рассмотрите
  rationale: В данном увещевательном контексте глагол передаёт призыв внимательно наблюдать или обдумывать; такое значение согласуется с последующим упоминанием неба и дел Всевышнего. Возможное словарное значение «спросите» сохранено в примечании.
- source_word: ለሰማይ
  choice: небо
  rationale: Сохраняет космический и апокалиптический регистр; перевод «небосвод» был бы уже по смыслу.
- source_word: ውሉደ ሰማይ
  choice: сыны неба
  rationale: Буквальная, возвышенная и намеренно загадочная формула не предрешает, названы ли так люди или небесные существа.
- source_word: ወኵሎ ግብር ለልዑል
  choice: и всякое дело Всевышнего
  rationale: Союз ወ передан как «и», поэтому небо и всякое дело выступают однородными предметами рассмотрения. «Дело» сохраняет широкий смысл поступка, действия или произведения.
- source_word: ወፍርሁ እምኔሁ
  choice: бойтесь Его
  rationale: Сохраняет библейское сочетание страха и благоговения перед Богом, не сводя его лишь к испугу или почтению.
- source_word: ወኢትግበሩ እኩየ በቅድሜሁ
  choice: и не творите зла пред Ним
  rationale: Передаёт нравственный запрет и выражение божественного присутствия; «пред Ним» уместно для dignified biblical register without being obscure.
theological_decisions:
- issue: Кого обозначают «сыны неба»
  choice: Сохранено буквальное обращение «сыны неба».
  alternative: «дети неба» или истолковывающий перевод «небесные существа»
  rationale: Текст не позволяет уверенно решить, идёт ли речь о людях в образном смысле или о существах небесного мира; перевод сохраняет эту богословскую неопределённость.
- issue: Характер страха перед Всевышним
  choice: «бойтесь Его»
  alternative: «благоговейте перед Ним»
  rationale: Более буквальный вариант сохраняет напряжение между страхом и благоговением, не устраняя одну из возможных граней выражения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Формы «Всевышнего», «творите зла» и «пред Ним» поддерживают достоинство апокалиптической речи, оставаясь понятными современному читателю.
