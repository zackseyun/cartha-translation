base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/002.yaml
  text: If he shuts the windows of heaven[a], and withholds the rain and the dew so that it does not come down upon the earth because of you[c][b], what will you do?
translation:
  language: ru
  text: Если он затворит окна небес[a] и удержит дождь и росу, чтобы они не сошли на землю из-за вас, что вы будете делать?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Окна небес» — древний образ отверстий в небесном своде, через которые, согласно тогдашним представлениям, нисходит дождь. Образ сохранён, а не заменён современным метеорологическим выражением.
    reason: cultural_note
  - marker: b
    text: 'Это риторический вопрос; буквально: «что вы будете делать?»'
    reason: lexical_alternative
lexical_decisions:
- source_word: ዐፀወ
  choice: затворит
  rationale: Передаёт конкретное действие закрывания и естественно сочетается с древним образом небесных окон; более торжественно, чем разговорное «закроет», но остаётся понятным.
- source_word: መስኮተ ሰማይ
  choice: окна небес
  rationale: Сохраняет древний космологический образ небесных отверстий, через которые нисходит дождь, и его библейское звучание.
- source_word: ከለአ ዝናመ
  choice: удержит дождь
  rationale: Глагол означает воспрепятствовать или не дать чему-либо прийти; «удержит» точно и естественно выражает прекращение дождя.
- source_word: ወጠለ
  choice: и росу
  rationale: Роса сохраняется как второй, наряду с дождём, источник влаги для земли.
- source_word: ከመ ኢይረድ ዲበ ምድር
  choice: чтобы они не сошли на землю
  rationale: Русское множественное число согласует сказуемое с парой «дождь и роса», тогда как исходная форма единственного числа может представлять осадки собирательно; образ нисхождения сохранён.
- source_word: በእንቲአክሙ
  choice: из-за вас
  rationale: 'В контексте суда выражение естественно имеет причинный смысл: лишение влаги происходит по вине обращённых лиц.'
- source_word: ሚሀለወክሙ ትግበሩ
  choice: что вы будете делать?
  rationale: Прямо передаёт риторический вопрос о человеческом бессилии, не добавляя отсутствующего в источнике наречия «тогда».
theological_decisions:
- issue: Кто затворяет небо
  choice: Сохранено местоимение «он» без прямого называния Бога или Господа.
  alternative: «Если Бог затворит…» / «Если Господь затворит…»
  rationale: В геэзском тексте субъект выражен в единственном числе, но в самом стихе не назван. Местоимение сохраняет синтаксис и не вносит отсутствующий божественный титул, хотя контекст подразумевает божественное действие.
- issue: Причина удержания дождя и росы
  choice: «из-за вас»
  alternative: «ради вас» / «для вас»
  rationale: Причинное прочтение лучше соответствует контексту предупреждения и суда, однако перевод не уточняет конкретную вину и не развивает её богословски.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Затворит» и «окна небес» сохраняют достоинство и образность текста, не делая синтаксис архаичным; обращение передано формой множественного числа «вы».
