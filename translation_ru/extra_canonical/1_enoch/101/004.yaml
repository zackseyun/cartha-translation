    rationale: Источник и английская аудиторская правка указывают на капитанов/руководителей кораблей. «Капитанов кораблей» передаёт это точнее и современнее.
  - severity: medium
    issue: «Они терпят бедствие» чрезмерно конкретизирует заключительное описание.
    rationale: Глагол говорит об их тревоге, мучительном потрясении или смятении; он не утверждает, что кораблекрушение либо бедствие уже произошло.
