  source_fidelity: 'Морские образы переданы верно: речь идёт о начальниках/капитанах кораблей, которых бросают волны; ветры раскачивают их корабли. Однако «терпят бедствие» несколько сужает заключительный глагол до наступившей морской катастрофы, тогда как он прежде всего выражает смятение, тревогу или тяжёлую подавленность людей.'
  naturalness: Фраза в целом ясна, но «капитаны кораблей» более современно и точно обозначает должность, чем «кормчие», которое обычно означает рулевых и имеет несколько архаичную окраску. «Приходят в смятение» естественно передаёт финальное состояние и сохраняет риторическую динамику.
  terminology: «Капитаны кораблей» соответствует исправленному пониманию ተነገሥተ፡ አሕማር как руководителей судов. Сноска к «кормчим» после замены не нужна; неоднозначности, требующей примечания, в исправленном чтении нет.
