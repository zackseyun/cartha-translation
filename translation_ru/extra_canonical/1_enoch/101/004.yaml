base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/004.yaml
  text: Have you not seen the captains of the ships[a], how they are tossed by the waves, and their ships are shaken by the winds[c][b], and they are distressed?
translation:
  language: ru
  text: 'Разве вы не видели капитанов кораблей: как волны бросают их из стороны в сторону, а ветры раскачивают их корабли, и они приходят в смятение?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትሬእይዎሙኑ
  choice: Разве вы не видели
  rationale: Отрицательно-вопросительная форма вводит риторический вопрос. Русское «разве… не» естественно передаёт обращение и увещательный тон.
- source_word: ለተነገሥተ፡ አሕማር
  choice: кормчих кораблей
  rationale: Сочетание обозначает начальников или управляющих кораблями, а не буквальных «царей кораблей». «Кормчие» сохраняет конкретный морской образ и достоинство регистра.
- source_word: እፎ
  choice: как
  rationale: Вводит описание образа действия; краткое «как» естественно по-русски.
- source_word: ይትሀወኩ፡ እምገደ
  choice: волны бросают их из стороны в сторону
  rationale: С учётом установленной ошибки транскрипции እምገደ вместо እምሞገድ выражение указывает на волнение от морских волн; глагол передаёт метание и потерю устойчивости.
- source_word: ወያንቀለቅሉ፡ እምነፋሳት፡ አሕማሮሙ
  choice: ветры раскачивают их корабли
  rationale: ነፋሳት означает «ветры», а አሕማሮሙ — «их корабли». Активная русская конструкция ясно сохраняет причинную связь и параллелизм с волнами.
- source_word: ወይትመነደቡ
  choice: и они терпят бедствие
  rationale: Глагол выражает тяжёлое потрясение, бедствие или мучительное состояние. Формулировка передаёт и внешнюю опасность, и человеческую подавленность, не усиливая её до однозначного ужаса.
theological_decisions:
- issue: Буквальная морская опасность или образ неустойчивости сильных мира
  choice: Сохранить в основном тексте буквальную морскую сцену, не устраняя её возможной нравственной и метафорической силы.
  alternative: Передать стих отвлечённо как смятение властителей либо прямо истолковать его как внутреннюю панику могущественных людей.
  rationale: Исправленное чтение ясно говорит о кормчих, волнах, ветрах и кораблях. Апокалиптический контекст допускает переносный смысл, но сам стих не требует вносить это толкование в перевод.
translation_notes:
  register: Современный литературный русский с приподнятым, но понятным библейским звучанием. «Кормчие» выбрано как ёмкое традиционное морское слово; смысл разъяснён в сноске. Пунктуация подчёркивает риторический вопрос и нарастающую опасность.
