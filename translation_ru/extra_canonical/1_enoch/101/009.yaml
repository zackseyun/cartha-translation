base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/009.yaml
  text: Do not those kings of the sea fear the sea[b][a], while sinners do not fear the Most High?
translation:
  language: ru
  text: Разве те цари моря[a] не боятся моря, тогда как грешники не боятся Всевышнего?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «цари моря». Необычное выражение, возможно, обозначает мореходов или людей, связанных с кораблями.'
    reason: textual_variant
lexical_decisions:
- source_word: አኮኑ
  choice: разве … не
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ.
- source_word: ውእቶሙ
  choice: те
  rationale: Сохраняет указательное значение перед обозначением людей.
- source_word: ተነገሥተ አሕማር
  choice: те, кто управляет кораблями
  rationale: Формально трудное выражение связано с «правителями/царями кораблей»; функциональный перевод указывает на начальников кораблей или мореходов, не превращая неясную метафору в буквальных царей моря.
- source_word: ይፈርህዋ ለባሕር
  choice: боятся моря
  rationale: Естественная русская конструкция сохраняет прямой объект страха и повтор ключевого глагола в обеих частях.
- source_word: ወኃጥኣን
  choice: тогда как грешники
  rationale: Союз передан контрастно по смыслу контекста, при этом не усиливается до отдельного противительного утверждения.
- source_word: ለልዑል
  choice: Всевышнего
  rationale: Устоявшийся русский библейский эквивалент божественного титула «Высочайший/Всевышний».
- source_word: ኢይፈርህዎ
  choice: не боятся
  rationale: Повтор того же русского глагола сохраняет намеренный риторический параллелизм исходного текста.
theological_decisions:
- issue: Передача ልዑል как божественного титула
  choice: Всевышний
  alternative: Высочайший
  rationale: В контексте слово выступает как титул Бога; «Всевышний» ясно и традиционно передаёт его смысл, не добавляя конфессиональной интерпретации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Риторический вопрос и повтор «боятся / не боятся» сохранены; неясное морское обозначение передано функционально и оговорено в сноске.
