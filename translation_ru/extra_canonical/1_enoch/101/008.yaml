base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/008.yaml
  text: Was it not he who made heaven and earth and everything that is in them? Who gave instruction and wisdom to all who move upon the earth and to those at sea?[a][b][c]
translation:
  language: ru
  text: Не Он ли создал небо и землю и всё, что в них?[a] Кто дал наставление и мудрость всем, кто движется по земле, и тем, кто в море?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё, что находится внутри них».'
    reason: Лексическая альтернатива для краткого выражения о содержимом неба и земли.
  - marker: b
    text: Выражение «те, кто в море» может обозначать мореплавателей, морских существ или, шире, связанных с морем; геэзский текст здесь краток.
    reason: Сохранена неопределённость круга обозначаемых лиц или существ.
lexical_decisions:
- source_word: አኮኑ
  choice: Не Он ли
  rationale: Передаёт риторический вопрос, предполагающий утвердительный ответ, и естественно сочетается в русском с глаголом прошедшего времени.
- source_word: ገብረ
  choice: создал
  rationale: В контексте неба и земли естественно передаёт широкое значение «сделал»; менее буквальное «сделал небо и землю» по-русски звучало бы неестественно.
- source_word: ሰማየ ወምድረ
  choice: небо и землю
  rationale: Сохраняет формы единственного числа и традиционный меризм, обозначающий сотворённый мир.
- source_word: ወኵሎ ዘሀሎ ውስቴቶሙ
  choice: и всё, что в них
  rationale: Кратко и естественно передаёт совокупность всего находящегося внутри неба и земли, сохраняя местоименную отсылку к обоим.
- source_word: ትምህርተ ወጥበበ
  choice: наставление и мудрость
  rationale: 'Сохраняет два различных понятия: сообщаемое наставление и мудрость, не сводя первое к абстрактному пониманию.'
- source_word: ለኵሉ እለ ይትኀወሱ ዲበ ምድር
  choice: всем, кто движется по земле
  rationale: Передаёт значение движения, не заменяя его более узким «ходит» и не разрешая вопрос, имеются ли в виду только люди или живые существа вообще.
- source_word: ወለእለ ባሕር
  choice: и тем, кто в море
  rationale: Сохраняет краткость и широкую референцию геэзского выражения, не ограничивая его явно ни мореплавателями, ни морскими существами.
theological_decisions:
- issue: Характер обозначения Бога как устроителя неба и земли
  choice: создал
  alternative: сделал; сотворил
  rationale: «Создал» естественно в данном космологическом контексте, но не вводит более выраженной богословско-литургической окраски слова «сотворил»; при этом избегается неестественное русское «сделал небо и землю».
- issue: Круг получателей наставления и мудрости
  choice: всем, кто движется по земле, и тем, кто в море
  alternative: всем людям на земле и мореплавателям; всем существам на суше и в море
  rationale: Исходная формулировка широка. Перевод не сужает её до людей и не расширяет явно до всех животных, сохраняя возможное напряжение между этими пониманиями.
- issue: Связь второго вопроса с первым
  choice: Кто дал
  alternative: И кто дал
  rationale: Самостоятельное «Кто» сохраняет резкий риторический переход; альтернативное понимание с соединительной связью отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной риторикой. Заглавная буква в «Он» указывает на Бога в данном контексте, не добавляя имени, отсутствующего в стихе. Синтаксис сохраняет два последовательных вопроса и намеренно не уточняет, относятся ли последние выражения к людям или ко всем живым существам.
