base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/005.yaml
  text: And because of this they fear[a], for all their good possessions go out into the sea with them, and they do not think good in their hearts[b], for the sea will swallow them and they will sink in it.
translation:
  language: ru
  text: 'И потому они боятся[a]: всё их ценное имущество уходит вместе с ними в море, и в сердце у них нет добрых мыслей[b], ибо море поглотит их, и они утонут в нём.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за этого они страшатся».'
    reason: Возможный более формальный вариант передачи глагола страха.
  - marker: b
    text: 'Возможны также переводы: «они не думают о добре в своём сердце» или «они не думают в сердце о своём добре (имуществе)». Эфиопское выражение допускает как нравственный смысл, так и отсылку к упомянутому имуществу.'
    reason: Лексическая и синтаксическая неоднозначность ሠናየ и его связи с предыдущим упоминанием ценного имущества.
lexical_decisions:
- source_word: ይፈርሁ
  choice: они боятся
  rationale: Имперфект продолжает гномическое описание происходящего в настоящем времени; «боятся» естественно передаёт состояние людей в море.
- source_word: ኵሉ ንዋዮሙ ሠናይ
  choice: всё их ценное имущество
  rationale: ንዋይ означает имущество или добро, а ሠናይ здесь характеризует его как ценное, хорошее.
- source_word: ይወፅእ ውስተ ባሕር ምስሌሆሙ
  choice: выходит вместе с ними в море
  rationale: Сохранено буквальное направление глагола «выходить» без неподтверждённого пассивного значения «быть брошенным».
- source_word: ወሠናየ ኢይሐልዩ በልቦሙ
  choice: и в сердце у них нет добрых мыслей
  rationale: Фраза естественно передаёт отсутствие у них добрых или благоприятных мыслей, сохраняя неоднозначность слова ሠናየ и не превращая описание страха в явно нравственное осуждение.
- source_word: ባሕር ይውኅጦሙ
  choice: море поглотит их
  rationale: «Поглотит» сохраняет яркий образ моря, которое словно проглатывает людей.
- source_word: ወይትኀጐሉ ውስቴታ
  choice: и они утонут в нём
  rationale: В морском контексте «утонут» кратко и естественно выражает гибель или исчезновение в море.
theological_decisions:
- issue: Смысл фразы о мыслях в сердце
  choice: У них нет добрых или благоприятных мыслей перед лицом опасности.
  alternative: Они не помышляют о добре; либо не думают о своём ценном имуществе.
  rationale: ሠናየ допускает как психологический, так и нравственный оттенок и может перекликаться с упомянутым имуществом. Основной текст избегает однозначно морализирующего толкования, а варианты отражены в примечании.
- issue: Временной план описания
  choice: Настоящее время для страха, выхода в море и мыслей; будущее для ожидаемого поглощения и утопления.
  alternative: Все глаголы передать будущим временем.
  rationale: Контекст поддерживает гномическое описание моряков в настоящем, тогда как последние действия представлены как ожидаемый исход опасности.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно возвышенный. Сохранены образность моря и неоднозначность внутреннего состояния людей; настоящее время связывает стих с продолжающимся описанием морской опасности.
