base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/001.yaml
  text: Hope[a], you righteous, for the sinners will swiftly be destroyed from before you, and authority over them will be yours[c][b], according to your desire.
translation:
  language: ru
  text: Надейтесь[a], праведники, ибо грешники будут быстро уничтожены из вашего присутствия[b], и власть над ними будет у вас[c] — по вашему желанию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ободритесь, праведники». Начальная форма — прямое повелительное обращение к праведникам.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из-перед вас»; сохраняется образ устранения грешников из присутствия праведников.'
    reason: lexical_alternative
  - marker: c
    text: '«Власть над ними» выражает апокалиптическую перемену положения: праведники получают власть над теми, кто теперь подвергается суду.'
    reason: cultural_note
lexical_decisions:
- source_word: ተስፈዉ
  choice: Надейтесь
  rationale: Форма передаёт прямое повелительное обращение во множественном числе и сохраняет значение надежды или упования без пояснительного расширения.
- source_word: ጻድቃን
  choice: праведники
  rationale: Существительное понято как обращение к адресатам, что следует из повелительного наклонения и форм второго лица множественного числа.
- source_word: ፍጡነ
  choice: быстро
  rationale: Наречие характеризует стремительность грядущей гибели; «быстро» передаёт образ действия и не подменяет его более определённым указанием времени «скоро».
- source_word: ይትሀጐሉ
  choice: будут уничтожены
  rationale: Пассивное значение глагола в контексте суда указывает на гибель или уничтожение, не уточняя способ.
- source_word: ኃጥኣን
  choice: грешники
  rationale: Субстантивированное множественное число обозначает противопоставленную праведникам группу, подлежащую суду.
- source_word: እምቅድሜክሙ
  choice: перед вами
  rationale: Сохранён пространственный образ удаления или уничтожения «из-перед» адресатов; менее буквальное «из вашего присутствия» вынесено в примечание.
- source_word: ሥልጣን
  choice: власть
  rationale: Слово обозначает власть, полномочие или господство; русское «власть» естественно передаёт реальное превосходство над осуждёнными, не сводя его к физической силе.
- source_word: ይከውን ለክሙ ዲቤሆሙ
  choice: власть над ними будет принадлежать вам
  rationale: Конструкция выражает принадлежность праведникам власти над грешниками; формулировка сохраняет и обладание властью, и её направленность.
- source_word: በከመ ፈቀድክሙ
  choice: по вашему желанию
  rationale: Передано соответствие желанию или воле праведников без уточнения, относится ли это к дарованию власти или к способу её осуществления.
theological_decisions:
- issue: Будущее отношение праведников к грешникам
  choice: Сохранено прямое обещание власти праведников над осуждёнными грешниками.
  alternative: Истолковать выражение только как нравственную победу или публичное оправдание праведников.
  rationale: Сочетание ሥልጣን («власть») с указанием «над ними» выражает апокалиптическую перемену положения и не позволяет без текстового основания свести смысл к одному лишь утешению; точный характер этой власти не уточняется.
- issue: Связь заключительной фразы с обещанием власти
  choice: Фраза «по вашему желанию» оставлена синтаксически несколько открытой.
  alternative: Явно истолковать её либо как исполнение прежнего желания праведников, либо как свободу распоряжаться грешниками.
  rationale: Исходная формулировка допускает напряжение между соответствием желанию праведников и осуществлением власти по их воле; перевод не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Прямое обращение и параллельность частей сохранены; архаизмы и конфессионально маркированные формулы не использованы.
