base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/002.yaml
  text: And on the day of the judgment of sinners[a], your children will rise up and be lifted up like eagles, and your nest will be higher than the vultures. You will go up and enter the clefts of the earth and the fissures of the rock forever, like coneys before the lawless[f][e][d][c][b]; and the sirens will groan over you and weep.
translation:
  language: ru
  text: И в день бедствия грешников[a] ваши дети поднимутся и вознесутся, словно орлы, и гнездо ваше будет выше, чем у грифов.[b] Вы спуститесь и навеки войдёте в расселины земли и трещины скал, подобно даманам, укрывающимся от беззаконников;[c] и сирены будут стонать над вами и плакать.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наказания грешников»; исходное слово может обозначать бедствие, скорбь или карательное испытание.'
    reason: lexical_alternative
  - marker: b
    text: 'Слово, переведённое как «гнездо», текстуально трудно; возможно также: «ваше укрытие» или «ваше осенённое жилище».'
    reason: textual_variant
  - marker: c
    text: Даманы — небольшие животные, обитающие среди скал; в старых переводах их называли «кроликами» или «скальными барсуками». Оборот «от беззаконников» буквально имеет смысл «от лица беззаконников».
    reason: cultural_note
  - marker: d
    text: «Сирены» здесь — древний образ скорбящих существ пустыни; это слово не означает «праведные женщины».
    reason: lexical_clarification
lexical_decisions:
- source_word: ምንዳቤሆሙ
  choice: бедствия грешников
  rationale: Существительное допускает значения бедствия, скорби и карательного испытания. «Бедствие» сохраняет и переживаемое страдание, и судебно-карательный оттенок, не сужая смысл до формального приговора.
- source_word: ይትሌዐሉ / ይትነሥኡ
  choice: поднимутся и вознесутся
  rationale: Два глагола переданы раздельно, чтобы сохранить усилительный параллелизм образа возвышения.
- source_word: አንስርት
  choice: орлы
  rationale: Основное значение — «орлы»; оно сохраняет величественный образ взлёта.
- source_word: እጐለ ዚአክሙ
  choice: ваши дети
  rationale: Сочетание понимается как указание на потомство адресатов; «дети» естественно звучит по-русски и сохраняет семейный образ.
- source_word: ምጽላልክሙ
  choice: ваше гнездо
  rationale: Форма текстуально трудна и может обозначать укрытие или осенённое жилище. «Гнездо» поддерживает ближайший образ орлов, а неопределённость отмечена в сноске.
- source_word: ንደብታተ ምድር / ንቅዓታተ ኰኵሕ
  choice: расселины земли и трещины скал
  rationale: Переданы два параллельных обозначения углублений и разломов, служащих убежищем.
- source_word: ጊሔ
  choice: даманы
  rationale: Речь, вероятнее всего, о небольших скальных млекопитающих, традиционно называвшихся кроликами или барсуками. Современное зоологическое название точнее.
- source_word: እምቅድመ ዓማፅያን
  choice: спасаясь от беззаконников
  rationale: Сложный предлог буквально выражает удаление «от лица» кого-либо. В контексте укрытия естественный русский оборот передаёт бегство от преследователей.
- source_word: ጼደናት
  choice: сирены
  rationale: Это заимствование, соответствующее греческому σειρῆνες, а не форма слова «праведные». Сохранён древний образ скорбящих существ пустыни.
theological_decisions:
- issue: К кому относятся формы второго лица и обещание возвышения
  choice: 'Слова обращены к сообществу праведных: их дети возвышаются, тогда как грешников постигает бедствие.'
  alternative: Из-за трудности средней части стиха местоименные связи можно понимать менее определённо.
  rationale: Ближайший контекст противопоставляет грешников адресатам утешения. Перевод сохраняет это противопоставление, не вводя более поздних доктринальных категорий.
- issue: Характер бедствия грешников
  choice: Оставлено более широкое «бедствие», включающее судебный и карательный оттенок.
  alternative: «Суд» или «наказание грешников».
  rationale: Исходное слово не требует сводить событие исключительно к формальному суду; более широкая передача сохраняет богословское напряжение между страданием и воздаянием.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Сохранены параллельные глаголы возвышения, зооморфные образы и необычная заключительная сцена; синтаксис слегка упорядочен для ясности без устранения текстовой неоднозначности.
