base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/003.yaml
  text: But you[a], do not fear—you who have suffered—for healing will come to you, and a bright light will shine for you[b], and you will hear the voice of rest from heaven.
translation:
  language: ru
  text: А вы не бойтесь, страдающие[a], потому что к вам придёт исцеление, и яркий свет воссияет для вас, и с неба вы услышите голос покоя[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «вы, находящиеся в бедствии». Эфиопское выражение может обозначать страдающих от боли или несчастья вообще.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «голос/слово покоя». Сохранено «покоя», а не истолковательное «мира» или «утешения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትፍርሁ
  choice: не бойтесь
  rationale: Отрицательное повеление во множественном числе передано прямо и естественно, с сохранением возвышенного увещевательного тона.
- source_word: እለ ሐመምክሙ
  choice: страдающие
  rationale: Причастное обозначение адресатов охватывает страдание, боль и бедствие, не ограничивая смысл телесной болезнью.
- source_word: ፈውስ
  choice: исцеление
  rationale: Слово сохраняет как телесный, так и более широкий восстановительный смысл.
- source_word: ይከውነክሙ
  choice: к вам придёт
  rationale: Широкое значение «быть, становиться, происходить для кого-либо» передано естественным русским выражением обещанного наступления исцеления.
- source_word: ብርሃነ ብሩህ
  choice: яркий свет
  rationale: Передаёт усиленный образ света без неестественного для русского языка повтора.
- source_word: ያበርህ ለክሙ
  choice: воссияет для вас
  rationale: Сохраняет образ сияния и дательный оттенок личного обетования; «воссияет» соответствует возвышенному апокалиптическому регистру.
- source_word: ቃለ ዕረፍት
  choice: голос покоя
  rationale: Сохраняет конкретный слуховой образ и основное значение покоя или отдохновения, не заменяя его толкованием «мир» либо «утешение».
- source_word: እምሰማይ
  choice: с неба
  rationale: Естественная русская передача небесного источника голоса.
theological_decisions:
- issue: Следует ли истолковывать ቃለ ዕረፍት более привычным богословским выражением
  choice: голос покоя
  alternative: голос мира; слово утешения
  rationale: Буквально выражение допускает «голос/слово покоя». Выбранный вариант сохраняет обещание отдохновения и исходную образность, не гармонизируя текст с более поздней религиозной терминологией.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис остаётся ясным для широкого читателя; исходная последовательность обещаний и неоднозначность выражения «голос покоя» сохранены.
