base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/002.yaml
  text: And to the east of these beasts I saw the ends of the earth[a], where the heaven rests[d][c][b], and the open gates of heaven.
translation:
  language: ru
  text: И к востоку от этих зверей я увидел края земли[a], где покоится небо[b], и открытые врата неба[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пределы земли». Выражение обозначает дальние границы мира.'
    reason: lexical_alternative
  - marker: b
    text: 'Здесь сохраняется древний космологический образ: небо имеет место покоя или опору у края земли.'
    reason: cultural_note
  - marker: c
    text: Слово можно также передать как «проёмы» или «окна» неба; речь идёт об отверстиях в небесном своде.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጽባሖሙ ለእሉ አርዌ
  choice: к востоку от этих зверей
  rationale: Сочетание указывает конкретное направление — восток — и прямо называет зверей, упомянутых ранее; это точнее, чем обобщённое «за ними».
- source_word: አጽናፈ ምድር
  choice: края земли
  rationale: Естественное русское выражение, сохраняющее образ пределов мира в апокалиптической космографии.
- source_word: በኀበ ሰማይ የዐርፍ
  choice: где покоится небо
  rationale: Передаёт пространственную связь и конкретный образ неба, покоящегося у края земли, не модернизируя древнюю картину мира.
- source_word: ኀዋኅወ ሰማይ ርኁዋተ
  choice: открытые врата неба
  rationale: «Врата» естественно передают отверстия или проходы в небесном своде и соответствуют возвышенному характеру видения; определение «открытые» отражает состояние этих врат.
theological_decisions:
- issue: Древний космологический образ неба, покоящегося у краёв земли
  choice: 'сохранить буквальный образ: «где покоится небо»'
  alternative: «где небо сходится с землёй»
  rationale: Текст описывает апокалиптическую космографию. Замена на современное представление о горизонте устранила бы присущее источнику напряжение и конкретность образа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром. Синтаксис оставлен ясным и плавным; конкретная космологическая образность источника сохранена без рационализации.
