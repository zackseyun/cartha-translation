base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/004.yaml
  text: He showed me everything[a], and wrote it down for me; and again he wrote down for me their names, and their commands[c][b], and their companies.
translation:
  language: ru
  text: Он показал мне всё и записал это для меня; и ещё он записал для меня их имена, их установления[a] и их собрания[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их повеления», «их предписания» или «их законы». Эфиопское слово может обозначать властные распоряжения либо установленный порядок.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «их объединения» или «их группы». Вероятно, речь идёт об упорядоченных подразделениях в небесно-космической картине видения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎ
  choice: всё
  rationale: Передаёт всеохватное значение слова и естественно выступает дополнением к «показал».
- source_word: አርአየኒ
  choice: показал мне
  rationale: Сохраняет конкретный зрительный характер видения; «открыл мне» было бы более толковательным.
- source_word: ጸሐፈ ሊተ
  choice: записал это для меня / записал для меня
  rationale: Передаёт акт письменной фиксации и сохраняет повтор формулы в исходном тексте.
- source_word: ወዓዲ
  choice: и ещё
  rationale: Естественно обозначает дополнительное действие; возможно также «и снова».
- source_word: አስማቲሆሙ
  choice: их имена
  rationale: Прямо передаёт форму множественного числа с местоименным суффиксом.
- source_word: ትእዛዞሙ
  choice: их установления
  rationale: Слово допускает значения «повеления», «предписания», «установления». В космическом контексте «установления» сохраняет властно-нормативный смысл, не сводя его непременно к устным приказам или отвлечённым законам.
- source_word: ማኅበራቲሆሙ
  choice: их сонмы
  rationale: Передаёт организованные совокупности или подразделения в возвышенном апокалиптическом контексте, не придавая им обязательного военного значения.
theological_decisions:
- issue: Следует ли понимать названные группы как строго определённые ангельские или небесные чины
  choice: Сохранить образ организованных небесных совокупностей через слово «сонмы», не называя их прямо ангельскими чинами.
  alternative: «собрания», «группы», «воинства»
  rationale: Контекст благоприятствует небесно-космическому прочтению, однако сам стих не уточняет природу этих объединений. «Воинства» усилило бы военный оттенок, а «группы» чрезмерно снизило бы регистр.
- issue: Означает ли ትእዛዞሙ команды или космические законы
  choice: «их установления»
  alternative: «их повеления» или «их законы»
  rationale: Так сохраняется смысл предписанного порядка и подлинная лексическая широта слова без преждевременного разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим регистром. Синтаксический повтор исходника сохранён; архаизация ограничена контекстуально уместным словом «сонмы».
