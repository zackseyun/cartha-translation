base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/001.yaml
  text: And from there I went to the ends of the earth[a], and there I saw great beasts, and they differed from one another; and the birds also differed in their appearance and their forms[c][b], and their voices also differed one from another.
translation:
  language: ru
  text: И оттуда я пошёл к краям земли и увидел там крупных зверей, отличавшихся друг от друга. И птицы различались по своему облику и форме[a], и голоса их также отличались один от другого.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «форме», в данном текстовом свидетельстве не вполне ясно; вероятно, речь идёт о телесной форме или сложении.
    reason: textual_variant
lexical_decisions:
- source_word: እምህየ
  choice: оттуда
  rationale: Естественно передаёт исходную точку дальнейшего движения в последовательном рассказе о видении.
- source_word: ሖርኩ
  choice: я пошёл
  rationale: Сохраняет простой глагол движения от первого лица без добавочного оттенка длительного путешествия.
- source_word: አጽናፈ ምድር
  choice: краям земли
  rationale: Передаёт апокалиптическую космографическую идиому естественным современным русским языком.
- source_word: አራዊተ ዐበይተ
  choice: огромных зверей
  rationale: Сочетание обозначает крупных диких животных; «зверей» сохраняет возвышенно-апокалиптическую окраску.
- source_word: ይትዌለጥ
  choice: различались / отличались
  rationale: Передаёт повторяющийся глагол различия; небольшая русская вариативность позволяет избежать тяжеловесности, не устраняя структурный повтор.
- source_word: ፩እምካልኡ
  choice: друг от друга / один от другого
  rationale: Обе формулы естественно передают взаимное различие и сохраняют повтор исходного выражения.
- source_word: አዕዋፍሂ
  choice: и птицы
  rationale: Союз и добавочное значение частицы переданы включением птиц как следующей, также различающейся группы.
- source_word: ገጾሙ
  choice: своим обликом
  rationale: Буквально слово может означать «их лица», но применительно к птицам «облик» естественно обозначает видимую внешность.
- source_word: ስኖሙ
  choice: формой
  rationale: Предположительно обозначает телесную форму или сложение; краткое «формой» не вносит излишней конкретизации при неуверенности чтения.
- source_word: ቃሎሙሂ
  choice: голоса их также
  rationale: Сохраняет буквальное «голоса» и добавочную частицу «также», подчёркивающую звуковое различие наряду с внешним.
theological_decisions:
- issue: Передача апокалиптического выражения አጽናፈ ምድር
  choice: краям земли
  alternative: пределам земли
  rationale: «Края земли» сохраняют космографический образ и остаются понятными современному читателю, не сводя его к отдалённым странам.
- issue: Передача ገጾሙ применительно к птицам
  choice: обликом
  alternative: лицами
  rationale: «Облик» выражает наблюдаемое внешнее различие птиц, тогда как буквальные «лица» в русском могут создать непредусмотренный антропоморфный оттенок.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования. Синтаксис сохраняет последовательность видения и повтор глагола различия; устаревшие «отселе» и «пределы» не используются.
