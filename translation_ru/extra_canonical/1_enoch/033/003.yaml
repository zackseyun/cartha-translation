base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/003.yaml
  text: And I saw the portals from which the stars of heaven come out[a], and I wrote down all their outlets, each one by itself, according to their number and their names, by their order and their activity and their times and their months, as Uriel, the holy angel who was with me[c][b], showed me.
translation:
  language: ru
  text: И я увидел, как выходят небесные звёзды, и пересчитал врата, из которых они выходят[a]. Я записал все их выходы, каждый в отдельности, согласно их числу и именам, их порядку и действию, их временам и месяцам, — как показал мне Уриил, святой ангел, бывший со мной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально начало можно передать: «я увидел, как выходят небесные звёзды, и пересчитал врата, из которых они выходят». В некоторых переводах эту трудную конструкцию понимают как «я увидел врата, из которых выходят небесные звёзды».'
    reason: Сохраняется синтаксическая трудность исходной формулировки и отмечается распространённый альтернативный разбор, не подменяющий основной перевод.
lexical_decisions:
- source_word: አፎ
  choice: как
  rationale: Здесь слово понято как наречие «как», вводящее описание того, каким образом выходят звёзды, а не как существительное «уста».
- source_word: ከዋክብተ ሰማይ
  choice: звёзды небесные
  rationale: Сохраняет возвышенную апокалиптическую формулу и естественно звучит в современном литературном русском.
- source_word: ኀዋኅወ
  choice: врата
  rationale: Конкретный архитектурно-космологический образ точнее нейтральных «мест» или «выходов».
- source_word: ይወጽኡ / ይወፅኡ
  choice: выходят
  rationale: Повтор одного глагола сохраняет параллелизм источника и конкретный образ выхода звёзд через небесные врата.
- source_word: ጸሐፍኩ ኵሎ ሙፃኣቲሆሙ
  choice: Я записал все их выходы
  rationale: Передаёт как акт записи, так и множественные выходы или точки выхода, не превращая образ в современное астрономическое описание.
- source_word: ለለ፩፩
  choice: каждый по отдельности
  rationale: 'Ясно передаёт распределительное значение: каждый выход учитывается отдельно.'
- source_word: በደርጎሙ
  choice: их порядок
  rationale: Сохраняет широту значения — порядок, расположение или ранг — без излишнего уточнения.
- source_word: ወምገባሮሙ
  choice: их действие
  rationale: Нейтрально обозначает деятельность или функционирование звёзд, не навязывая технического либо богословского толкования.
- source_word: ወጊዜሆሙ ወአውራኂሆሙ
  choice: их времена и месяцы
  rationale: Прямо сохраняет временные категории источника и его представление об упорядоченном небесном движении.
theological_decisions:
- issue: Конкретная космология выхода звёзд через небесные врата
  choice: Сохранить образы звёзд, которые «выходят», и космических «врат».
  alternative: Осмыслить фразу как обычный восход звёзд над горизонтом.
  rationale: Текст изображает увиденное Енохом устройство мира; модернизация в терминах наблюдательной астрономии устранила бы существенную часть апокалиптического образа.
- issue: Роль Уриила как истолкователя видения
  choice: Передать его как святого ангела, бывшего с Енохом и показавшего ему описанный порядок.
  alternative: Уточнить, что Уриил обучил Еноха астрономии.
  rationale: Источник говорит лишь о показанном; более специальное описание роли ангела было бы добавлением.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Архаизмы сведены к минимуму; слово «врата» сохранено ради конкретного апокалиптического образа. Длинное перечисление организовано двоеточием и тире для ясности без устранения структуры источника.
