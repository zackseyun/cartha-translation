  text: And in those days a change shall come for the holy ones and the chosen ones[a][b].
translation:
  language: ru
  text: И в те дни для святых и избранных наступит перемена[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «произойдёт поворот». Эфиопское слово означает изменение, поворот или перемену участи.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: в те дни
  rationale: Сохранена устойчивая апокалиптическая временная формула и буквальный образ «дней».
- source_word: ሚጠት
  choice: перемена
  rationale: Существительное связано со значением поворота или изменения; здесь оно указывает на грядущую перемену участи святых и избранных, а не на «милость».
- source_word: ትከውን
  choice: наступит
  rationale: Естественно по-русски передаёт значение «будет, возникнет, произойдёт» применительно к грядущей перемене.
- source_word: ለቅዱሳን
  choice: для святых
  rationale: Передаёт обозначение людей, посвящённых Богу, без добавления отсутствующего в источнике уточнения.
- source_word: ወለኅሩያን
  choice: и избранных
  rationale: Сохраняет характерное для 1 Еноха обозначение избранных и звучит естественно в современном русском языке.
theological_decisions:
- issue: Следует ли понимать ሚጠት как «милость» или как «перемену»
  choice: перемена
  alternative: милость; сострадание
  rationale: Эфиопское ሚጠት означает изменение или поворот и отличается от обычного слова «милость» ምሕረት, которое далее действительно встречается в полном тексте стиха. Поэтому перевод не подменяет образ изменения богословским понятием милости.
translation_notes:
  register: 'Современный литературный русский язык с достоинством апокалиптической речи. Порядок слов перестроен ради естественности: предложная группа «для святых и избранных» поставлена перед сказуемым. Термины «святые» и «избранные» сохранены как повторяющиеся обозначения групп в 1 Еноха.'
