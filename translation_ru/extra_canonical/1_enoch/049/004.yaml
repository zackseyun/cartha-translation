base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/004.yaml
  text: And he will judge the hidden things[a], and no one will be able to speak an empty word before him, for he is the Chosen One before the Lord of Spirits[c][b], according as he has willed.
translation:
  language: ru
  text: И он будет судить сокрытое, и никто не сможет произнести перед ним ни одного пустого слова[a], ибо он — Избранник пред Господом духов, по его воле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Текст этой строки в данном геэзском свидетеле труден. Выражение, переведённое как «пустого слова», можно также понять как «лживого слова».
    reason: textual_variant
lexical_decisions:
- source_word: ይኴንን
  choice: будет судить
  rationale: Глагол обозначает судебное решение или вынесение суда; будущее время соответствует эсхатологическому контексту.
- source_word: ዘኅቡአተ
  choice: сокрытое
  rationale: Сохраняет значение того, что скрыто или недоступно обычному взору, и естественно звучит в современном русском.
- source_word: ወነገረ፡ በከ፡ አልቦ፡ ዘይክል፡ ብሂለ፡ በቅድሜሁ
  choice: и никто не сможет произнести перед ним пустого слова
  rationale: Текст свидетеля труден, однако общий смысл запрещает пустую, тщетную либо ложную речь в его присутствии. Буквальное «пустого слова» сохраняет эту смысловую широту.
- source_word: ኅሩይ
  choice: Избранник
  rationale: В Притчах Еноха слово служит устойчивым титулом эсхатологической фигуры; прописная буква передаёт титульное употребление, не внося позднейших отождествлений.
- source_word: እግዚአ፡ መናፍስት
  choice: Господом духов
  rationale: Передаёт характерный для 1 Еноха титул «Господь духов» без расширительного толкования.
- source_word: በከመ፡ ውእቱ፡ ፈቀደ
  choice: по его воле
  rationale: Кратко и естественно передаёт соответствие воле названного Господа, не усиливая выражение богословски окрашенными словами вроде «благоволение».
theological_decisions:
- issue: Титульный статус ኅሩይ
  choice: Избранник
  alternative: избранный; Избранный
  rationale: В данном разделе это повторяющееся наименование определённой эсхатологической фигуры. Форма «Избранник» ясно передаёт титул, но не отождествляет его прямо с какой-либо фигурой позднейшей традиции.
- issue: Чья воля подразумевается в заключительной фразе
  choice: по его воле
  alternative: как Он пожелал; по воле Господа духов
  rationale: Строчная форма местоимения сохраняет формальную неоднозначность исходного местоимения, хотя ближайший и наиболее вероятный референт — Господь духов.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. «Пред» сохранено как умеренно возвышенная форма, уместная для судебно-апокалиптического контекста; архаизмы и конфессионально специфическая терминология не вводятся.
