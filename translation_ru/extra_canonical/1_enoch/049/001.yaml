base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/001.yaml
  text: For wisdom has been poured out like water[c][b][a], and glory will not fail before him forever and ever.
translation:
  language: ru
  text: Ибо мудрость излилась, как вода,[a] и слава не иссякнет пред ним во веки веков.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «будет изливаться, как вода». Однако форма геэзского глагола скорее указывает на завершённое действие или установившееся состояние: «излилась».'
    reason: previous_rendering
  - marker: b
    text: 'Или: «и славе не будет конца пред ним».'
    reason: lexical_alternative
  - marker: c
    text: К кому относится слово «ним», в геэзском тексте здесь не уточняется. Более широкий контекст может указывать на ранее названную возвышенную фигуру, но сам стих её не называет.
    reason: alternative_reading
lexical_decisions:
- source_word: እስመ
  choice: Ибо
  rationale: Сохраняет пояснительно-причинную связь с предшествующим контекстом и соответствует возвышенному, но естественному русскому стилю.
- source_word: ጥበብ
  choice: мудрость
  rationale: Основное значение слова; уместно в сапиенциальном и откровенном контексте, не внося лишнего толкования.
- source_word: ክዕወ
  choice: излилась
  rationale: Передаёт совершенный вид исходной формы как завершённое действие или установившееся состояние и сохраняет образ обильного излияния.
- source_word: ከመ ማይ
  choice: как вода
  rationale: Прямо сохраняет сравнение и его яркий образ.
- source_word: ወስብሐት
  choice: и слава
  rationale: «Слава» лучше всего соответствует возвышенному небесному контексту, хотя слово может также обозначать великолепие или хвалу.
- source_word: ኢትኃልቅ
  choice: не иссякнет
  rationale: Естественно сочетается с образом излияния и передаёт значение непрекращения или неисчерпаемости, сохраняя будущее значение исходной формы.
- source_word: ቅድሜሁ
  choice: пред ним
  rationale: Передаёт буквальное пространственно-относительное значение и не уточняет не названного в стихе референта местоимения.
- source_word: ለዓለመ ዓለም
  choice: во веки веков
  rationale: Устоявшаяся возвышенная русская передача усиленной формулы вечной длительности.
theological_decisions:
- issue: К кому относится местоимение в выражении «пред ним»
  choice: Сохранить местоимение без уточнения его референта.
  alternative: «пред Господом духов» или «пред Избранным / Сыном Человеческим»
  rationale: В самом геэзском стихе имеется только местоименный суффикс. Контекст может указывать на ранее названную возвышенную фигуру, однако стих не называет её прямо; уточнение устранило бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. «Пред ним» и «во веки веков» сохраняют достоинство и ритм исходной формулы; архаизмы, затрудняющие понимание, не используются.
