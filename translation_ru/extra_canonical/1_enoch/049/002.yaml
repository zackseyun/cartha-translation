base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/002.yaml
  text: For he is mighty in all the hidden things of righteousness[a], and lawlessness will pass away like a shadow and have no permanence; for the Chosen One stands before the Lord of Spirits, and his glory is forever and ever[d][c][b], and his power from generation to generation.
translation:
  language: ru
  text: Ибо он могуч во всём сокрытом, связанном с праведностью[a], а беззаконие пройдёт, словно тень, и не устоит[b]; ибо Избранный[c] стоит перед Господом духов, и слава его — во веки веков, и могущество его — из поколения в поколение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во всех тайнах праведности». Геэзское выражение может означать сокрытые стороны или тайны, принадлежащие праведности.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не будет у него стояния». Возможны также переводы: «не пребудет» или «не будет иметь постоянства».'
    reason: lexical_alternative
  - marker: c
    text: «Избранный» — повторяющийся в Притчах Еноха титул возвышенной фигуры, связанной с судом и оправданием праведных.
    reason: cross_reference
lexical_decisions:
- source_word: ኃያል
  choice: могуч
  rationale: Передаёт силу и сохраняет возвышенный апокалиптический регистр, не усиливая значение сверх текста.
- source_word: ኅቡአተ ጽድቅ
  choice: во всём сокрытом, что относится к праведности
  rationale: Сохраняет значение сокрытого и неоднозначность связи с праведностью; возможное понимание как «тайны праведности» вынесено в примечание.
- source_word: ዓመፃ
  choice: беззаконие
  rationale: Передаёт широкий нравственный антипод праведности, не сужая смысл до физического насилия или социальной несправедливости.
- source_word: ጽላሎት የኃልፍ
  choice: пройдёт, словно тень
  rationale: Сохраняет простой и наглядный образ исчезающей тени и будущую направленность в контексте суда.
- source_word: ምቅዋመ አልቦ
  choice: не устоит
  rationale: Естественно по-русски передаёт буквальное отрицание стояния или пребывания и сохраняет возможный оттенок несостоятельности перед судом.
- source_word: ኅሩይ
  choice: Избранный
  rationale: Передано как устойчивый титул фигуры в Притчах Еноха, без внесения позднейших богословских отождествлений.
- source_word: ቆመ
  choice: стоит
  rationale: Перфект глагола положения имеет здесь статальное значение и обозначает продолжающееся пребывание перед Господом духов.
- source_word: እግዚአ መናፍስት
  choice: Господом духов
  rationale: Сохраняет характерный для 1 Еноха божественный титул.
- source_word: ስብሐቲሁ
  choice: слава Его
  rationale: «Слава» естественно соответствует библейско-апокалиптическому регистру и формуле вечности.
- source_word: ኃይሉ
  choice: могущество Его
  rationale: Передаёт силу или власть возвышенной фигуры и согласуется с торжественным стилем стиха.
theological_decisions:
- issue: Титульное или описательное значение ኅሩይ
  choice: Избранный как титул
  alternative: избранный как простое определение; Избранник
  rationale: В Притчах Еноха слово регулярно обозначает возвышенную фигуру. Заглавная буква отмечает титульную функцию, не отождествляя её прямо с какой-либо позднейшей доктриной.
- issue: Видо-временное значение ቆመ
  choice: стоит
  alternative: встал; предстал; стоял
  rationale: У глагола положения перфект может выражать текущее устойчивое состояние. «Стоит» яснее всего передаёт продолжающееся присутствие перед Господом духов.
- issue: Смысл ዓመፃ в противопоставлении ጽድቅ
  choice: беззаконие
  alternative: насилие; нечестие; несправедливость
  rationale: «Беззаконие» сохраняет широкий нравственный контраст с праведностью и не ограничивает понятие одним видом зла.
- issue: Референт местоимения в начале стиха
  choice: «Он» с заглавной буквы, соотносимое с Избранным по ближайшему контексту
  alternative: «он» без титульной графики; отнесение к иной фигуре контекста
  rationale: Русская графика помогает связности стиха, но сам текст не разворачивает отдельного догматического определения личности; потому перевод не добавляет такого определения.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптической речи. Синтаксис сохранён торжественным, но не архаичным; использованы «ибо», формулы «во веки веков» и «из поколения в поколение». Неоднозначность выражения о сокрытом праведности и буквальный образ «стояния» беззакония отмечены в сносках.
