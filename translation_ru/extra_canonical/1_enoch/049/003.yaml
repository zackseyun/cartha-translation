base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/003.yaml
  text: And in him dwells the spirit of wisdom[a], and the spirit that gives understanding, and the spirit of instruction and might[d][c][b], and the spirit of those who sleep in righteousness.
translation:
  language: ru
  text: И в нём пребывает дух мудрости, и дух, дарующий понимание[a], и дух наставления и силы, и дух тех, кто спит в праведности[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «дух понимания». Выражение может обозначать как дух, наделённый пониманием, так и дух, который даёт его.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тех, кто спит в праведности». Вероятно, имеются в виду умершие праведники; возможен также перевод: «тех, кто покоится в праведности».'
    reason: alternative_reading
lexical_decisions:
- source_word: የኃድር
  choice: пребывает
  rationale: Имперфект выражает настоящее или продолжающееся пребывание; сочетание ቦቱ указывает «в нём», а не «на нём». «Пребывает» сохраняет значение обитания и возвышенный, но современный регистр.
- source_word: መንፈሰ
  choice: дух
  rationale: В перечне дарованных качеств «дух» естественно передаёт харизматический и возвышенный смысл.
- source_word: ጥበብ
  choice: мудрость
  rationale: Слово обозначает нравственную и интеллектуальную мудрость; это прямое и контекстуально точное соответствие.
- source_word: ዘያሌቡ
  choice: дарующий понимание
  rationale: Форма, по-видимому, характеризует дух через его действие, а не просто называет качество; причастный оборот сохраняет эту глагольную силу.
- source_word: ትምህርት
  choice: наставление
  rationale: Слово охватывает обучение и наставление; «наставление» естественно звучит как духовное качество и сохраняет компактность перечня.
- source_word: ኃይል
  choice: сила
  rationale: «Сила» точно и естественно передаёт значение могущества в современном литературном русском языке.
- source_word: እለ ኖሙ በጽድቅ
  choice: тех, кто спит в праведности
  rationale: Буквальный образ сна сохранён без сведения его значения исключительно к смерти; оборот удерживает апокалиптическую образность и неоднозначность.
theological_decisions:
- issue: Смысл заключительного выражения о духе
  choice: «дух тех, кто спит в праведности» — вероятная отсылка к умершим праведникам при сохранении буквального образа сна
  alternative: «дух тех, кто покоится в праведности» или «дух, принадлежащий праведникам»
  rationale: В апокалиптическом контексте сон естественно может обозначать смерть, однако перевод не должен устранять возможность более общего значения покоя.
- issue: Местонахождение и длительность пребывания духа
  choice: «в нём пребывает»
  alternative: «на нём почивает»
  rationale: Эфиопский предлог указывает прежде всего на пребывание «в нём», а имперфект — на настоящее или продолжающееся состояние; традиционная пророческая формула «на нём почивает» здесь менее точна грамматически.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксический параллелизм оригинального перечня сохранён; архаизмы и конфессионально окрашенные уточнения не добавлены.
