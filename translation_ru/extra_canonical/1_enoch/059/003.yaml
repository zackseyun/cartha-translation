base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/003.yaml
  text: And after this all the hidden things of the lights and of the lightnings were shown to me[c][b][a]; they flash for blessing and for abundance.
translation:
  language: ru
  text: После этого мне было показано всё сокрытое[a] в светилах[b] и молниях; они сверкают ради благословения и изобилия.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все их тайны». Буквально — «всё их сокрытое».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «светах»; в контексте видения, вероятно, имеются в виду небесные светила.'
    reason: cultural_note
lexical_decisions:
- source_word: ወእምድኅረዝ
  choice: После этого
  rationale: Естественно передаёт формулу временного перехода и последовательность видений.
- source_word: ትርእየ ሊተ
  choice: мне было показано
  rationale: 'С учётом вероятной ошибки в транскрипции вместо ተርእየ форма понимается как пассивная: не «ты покажешь мне», а «мне было показано».'
- source_word: ኵሉ ኅቡኣቲሆሙ
  choice: всё сокрытое в них
  rationale: Передаёт буквальный образ скрытого, не сужая его до технического апокалиптического понятия «тайны»; местоименное содержание выражено далее зависимыми существительными.
- source_word: ለብርሃናት
  choice: в светилах
  rationale: В космическом контексте «светила» звучит естественнее буквального «светы», хотя исходное слово может иметь более широкое значение.
- source_word: ወለመባርቅት
  choice: и молниях
  rationale: Сохраняет множественное число и яркую космическую образность.
- source_word: ወለበረከት ወለጽጋብ
  choice: ради благословения и изобилия
  rationale: Предлог перед этими существительными передаёт цель, а не зависимость от «сокрытого».
- source_word: ይበርቁ
  choice: они сверкают
  rationale: Передаёт внезапное яркое сияние и сохраняет множественное число глагола.
theological_decisions:
- issue: Имеется ли в виду техническое апокалиптическое понятие «тайн»
  choice: всё сокрытое
  alternative: все их тайны
  rationale: Исходное выражение буквально обозначает скрытое; более широкий вариант не навязывает специального богословского значения.
- issue: Связь благословения и изобилия с предшествующей фразой
  choice: они сверкают ради благословения и изобилия
  alternative: сокрытое благословения и изобилия
  rationale: Повтор предлога перед «благословением» и «изобилием» здесь лучше понимать как указание цели при глаголе «сверкают».
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис сделан естественным для русского, при этом сохранены образность, множественное число и смысловая неоднозначность исходного текста.
