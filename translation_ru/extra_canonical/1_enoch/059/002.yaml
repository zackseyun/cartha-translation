base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/002.yaml
  text: And there I saw the hidden chambers of the thunder[a], and how, when it crashes in the height of heaven, its sound is heard; and he showed me the dwellings of the dry land, and the sound of the thunder, whether for peace and blessing or for a curse[c][b], according to the word of the Lord of Spirits.
translation:
  language: ru
  text: И там я увидел сокрытые хранилища грома[a] и то, как, когда он гремит в вышине неба, слышится его звук; и он показал мне жилища на суше[b] и [звук грома][c] — для мира и благословения или для проклятия, по слову Господа духов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «сокрытые места грома» или «тайны грома». Исходное выражение допускает как пространственное, так и более общее понимание.'
    reason: lexical_alternative
  - marker: b
    text: 'Выражение в оригинале текстуально и лексически трудно; возможно: «обитаемые места земли» или «поселения на суше».'
    reason: lexical_alternative
  - marker: c
    text: Слова «и звук грома» в данном свидетельстве заключены в скобки. Они могут принадлежать исходному тексту либо быть позднейшим повтором.
    reason: textual_variant
lexical_decisions:
- source_word: ኅቡኣተ
  choice: сокрытые хранилища
  rationale: Форма обозначает сокрытые предметы или места. В апокалиптическом описании грома уместен конкретно-пространственный образ скрытых вместилищ; при этом примечание сохраняет более общее возможное понимание.
- source_word: ነጐድጓድ
  choice: гром
  rationale: Слово обычно означает гром; контекст особо выделяет его голос, поэтому более широкое «гроза» здесь менее точно.
- source_word: ይደቅቅ
  choice: гремит
  rationale: Глагол передаёт удар, сокрушение или резкое звучание. «Гремит» естественно по-русски применительно к грому и сохраняет силу образа.
- source_word: መልዕልተ ሰማይ
  choice: в вышине неба
  rationale: Сочетание буквально указывает на высоту или верх неба; «в вышине неба» сохраняет космологический образ без добавления значения исходного движения.
- source_word: ተመመንደርት የብስ
  choice: обиталища суши
  rationale: Трудное сочетание, вероятно обозначающее обитаемые места на суше. Буквально окрашенный перевод не устраняет лексическую неопределённость.
- source_word: አስተአርአየኒ
  choice: он показал мне
  rationale: Каузативная форма прямо означает «показал мне»; личный субъект сохранён, хотя его референт в данном стихе не назван.
- source_word: ለሰላም ወለበረከት
  choice: для мира и благословения
  rationale: Сохранены параллельность двух существительных и возможное значение цели или результата.
- source_word: ለረገም
  choice: для проклятия
  rationale: Передаёт противопоставленный благотворным исходам судебно-карательный исход, не уточняя, идёт ли речь о цели, результате или знамении.
- source_word: በቃለ እግዚአ መናፍስት
  choice: по слову Господа духов
  rationale: Формулировка сохраняет и божественное распоряжение, и акцент на произнесённом слове, не сужая смысл до одного лишь «повеления».
theological_decisions:
- issue: Благотворная или карающая функция грома
  choice: Голос грома соотнесён с миром, благословением или проклятием по слову Господа духов.
  alternative: Гром лишь возвещает эти исходы либо его различные звуки служат их знамениями.
  rationale: Синтаксис допускает инструментальное, результативное и знаменательное понимание. Перевод «для… или для…» намеренно не разрешает эту неоднозначность.
- issue: Титул እግዚአ መናፍስት
  choice: Господь духов
  alternative: Господь Духов
  rationale: Это устойчивый титул в 1 Еноха. Строчная буква в слове «духов» не навязывает толкование, будто речь идёт о собственном имени или особом обозначении Святого Духа.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной повествовательной интонацией. Сохранены апокалиптические пространственные образы, повтор ключевого слова «гром» и формула «Господь духов»; трудные места не сглажены чрезмерной нормализацией.
