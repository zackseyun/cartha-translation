base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/001.yaml
  text: In those days my eyes saw the secrets of the lightnings and the lights[a], and their courses, and they flash forth for blessing and for curse[d][c][b], as the Lord of Spirits has willed.
translation:
  language: ru
  text: В те дни мои глаза увидели тайны молний и сияний, и их пути[a]. Они вспыхивают для благословения и для проклятия, как пожелал Господь Духов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их порядок» или «их ход». Значение геэзского слова не вполне определённо; оно, по-видимому, обозначает упорядоченное движение или расположение этих небесных явлений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: В те дни
  rationale: Сохраняет устойчивую апокалиптическую временную формулу и возвышенный, но понятный современному читателю регистр.
- source_word: ርእያ፡ አዕይንትየ
  choice: мои глаза увидели
  rationale: Передаёт явное упоминание глаз в геэзском тексте и сохраняет непосредственность видения.
- source_word: ኅቡኣተ
  choice: тайны
  rationale: Форма означает «тайны, сокрытое»; перевод не смешивает её с отдельным енохическим понятием небесных хранилищ.
- source_word: መባርቅት
  choice: молний
  rationale: Прямо передаёт множественное обозначение молний.
- source_word: ብርሃናት
  choice: сияний
  rationale: Естественное русское обозначение световых небесных явлений; оно не сужает значение до звёзд или иных конкретных светил.
- source_word: ወኵነኔሆሙ
  choice: и их суды
  rationale: Следует чтению печатного текста Charles 1906 и Dillmann 1851, восходящему к корню «судить»; сохраняет неоднозначность того, являются ли это суды над ними или суды, осуществляемые через них.
- source_word: ወይበርቁ
  choice: Они вспыхивают
  rationale: Передаёт яркое действие, общее для упомянутых молний и сияний, без добавочного истолкования.
- source_word: ለበረከት፡ ወለመረገም
  choice: для благословения и для проклятия
  rationale: Сохраняет резкую смысловую параллель между благим и карающим действием небесных явлений.
- source_word: በከመ፡ ፈቀደ
  choice: как пожелал
  rationale: Естественно выражает соответствие происходящего воле Бога, не усиливая модальность сверх текста.
- source_word: እግዚአ፡ መናፍስት
  choice: Господь Духов
  rationale: Передаёт устойчивый божественный титул Книги Еноха и поддерживает его терминологическую последовательность.
theological_decisions:
- issue: Связь благословения и проклятия с божественным управлением космосом
  choice: Молнии и сияния действуют для благословения и проклятия согласно желанию Господа Духов.
  alternative: Понимать благословение и проклятие лишь как естественные последствия этих явлений, не связывая их действие непосредственно с Божьей волей.
  rationale: Синтаксис стиха прямо связывает их вспышки и двойственное действие с желанием Господа Духов; перевод сохраняет эту апокалиптическую связь, не уточняя её догматически.
- issue: Значение выражения «их суды»
  choice: Сохранена компактная и неоднозначная формулировка «их суды».
  alternative: Развернуть как «суды, совершаемые ими» либо «суды над ними».
  rationale: Притяжательная конструкция допускает более одного смыслового отношения; уточнение без достаточных оснований устранило бы подлинное напряжение текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной апокалиптической интонацией. Формулировки кратки и доступны; сохранены образность, божественный титул и смысловая неоднозначность выражения «их суды».
