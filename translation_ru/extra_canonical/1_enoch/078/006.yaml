base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/006.yaml
  text: And when the moon rises[a], it appears in the sky as half of a seventh part[c][b], [and all the light is in it,] and it completes its light as fourteen parts.
translation:
  language: ru
  text: И когда восходит луна, она появляется на небе как половина седьмой части[a], [и весь свет находится в ней,][b] и она доводит свой свет до четырнадцати частей.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально выражение описывает лунный свет как «половину седьмой части». Здесь сохранён особый числовой способ исчисления, принятый в Астрономической книге.
    reason: cultural_note
  - marker: b
    text: Эта клауза заключена в скобки в используемом эфиопском издании; её текст и связь с окружающей фразой не вполне ясны.
    reason: textual_variant
  - marker: c
    text: «Четырнадцать частей» — элемент схематического исчисления лунного света в этой книге, а не современное научное описание.
    reason: cultural_note
lexical_decisions:
- source_word: ይትነሣእ
  choice: восходит
  rationale: В контексте наблюдения за светилом глагол естественно обозначает его восход, сохраняя идею движения вверх и появления.
- source_word: ወርኅ
  choice: луна
  rationale: Речь идёт о видимом светиле и его свете, поэтому здесь имеется в виду луна, а не месяц.
- source_word: ያስተርኢ በሰማይ
  choice: показывается на небе
  rationale: Передаёт зрительный и наблюдательный характер выражения, не устраняя его возвратный оттенок.
- source_word: መንፈቀ ሳብዕተ እደ
  choice: половина седьмой части
  rationale: Сохраняет необычный дробный язык и схематический способ исчисления лунного света в Астрономической книге.
- source_word: ብርሃን
  choice: свет
  rationale: Простое и точное обозначение количественно описываемого видимого света луны.
- source_word: ብርሃን ይከውን ቦቱ ኵሉ
  choice: и весь свет находится в ней
  rationale: Передаёт выделенную скобками клаузу отдельно от последующего утверждения о завершении света и сохраняет её сжатую, несколько трудную формулировку.
- source_word: ከመ ዐሡር ወረቡዕ ይፈጽም ብርሃኖ
  choice: она доводит свой свет до четырнадцати частей
  rationale: Глагол передаёт достижение полноты или завершения, а подразумеваемые «части» сохранены как единицы принятой в разделе схемы.
theological_decisions:
- issue: Передавать ли числовую схему обычными названиями лунных фаз или сохранить её техническую образность
  choice: Сохранены выражения «половина седьмой части» и «до четырнадцати частей».
  alternative: Передать смысл свободно как описание возрастающей или полной луны.
  rationale: Этот раздел представляет особую космологическую систему счёта света; замена её привычными названиями фаз внесла бы отсутствующее в источнике истолкование.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего астрономически-апокалиптического изложения. Необычная числовая формула и текстовая трудность сохранены, но синтаксис сделан понятным для обычного читателя.
