base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/003.yaml
  text: These are the two great luminaries[a]; their disks are like the disk of heaven[b], and the size of the disks of the two of them is equal.
translation:
  language: ru
  text: Это — два великих светила[a]. Их диски подобны небесному диску[b], и размеры дисков у обоих одинаковы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «два великих света»; здесь имеются в виду небесные светила.'
    reason: lexical_alternative
  - marker: b
    text: 'Слово, переведённое как «диск», может также означать «круг», «окружность» или «круговой путь». Поэтому возможно: «их круги подобны кругу неба».'
    reason: lexical_alternative
  - marker: c
    text: 'Заключительная часть трудна. Более буквально: «и мера их кругов у обоих одинакова».'
    reason: textual_difficulty
lexical_decisions:
- source_word: ብርሃናት
  choice: светила
  rationale: В астрономическом контексте слово обозначает небесные источники света — солнце и луну. «Светила» естественно для современного русского и сохраняет возвышенный космологический регистр.
- source_word: ዐበይት
  choice: великих
  rationale: При описании двух небесных светил «великих» передаёт значение величины и значительности, не привнося идеи могущества.
- source_word: ክበቦሙ / ክበበ
  choice: их диски / небесному диску
  rationale: Слово может обозначать круг, окружность, круговой ход или диск. Здесь «диск» даёт связное описание видимой круглой формы светил, однако геометрическая и космологическая неоднозначность отмечена в сноске.
- source_word: ወእምጣነ
  choice: и размеры
  rationale: Слово выражает меру или протяжённость. В данном контексте современное русское «размеры» звучит естественно; более буквальное «мера» отмечено в сноске к заключительной части.
- source_word: ለክልኤሆሙ ዕሩይ
  choice: у обоих одинаковы
  rationale: Заключение, вероятнее всего, утверждает равенство или одинаковость измеряемой величины у двух светил. Формулировка сохраняет это значение без дальнейшего истолкования.
