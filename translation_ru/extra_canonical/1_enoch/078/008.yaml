base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/008.yaml
  text: And in its waning[a], on the first day it diminishes to fourteen parts of its light, and on the second it diminishes to thirteen parts of light, and on the third it diminishes to twelve, and on the fourth to eleven parts, and on the fifth it diminishes to ten parts, and on the sixth it diminishes to nine parts, and on the seventh it diminishes to eight parts, and on the eighth it diminishes to seven, and on the ninth it diminishes to six, and on the tenth it diminishes to five, and on the eleventh it diminishes to four, and on the twelfth it diminishes to three, and on the thirteenth it diminishes to two, and on the fourteenth it diminishes to half of a seventh part of all its light[d][c][b]; and on the fifteenth day that which remains from the whole is consumed.
translation:
  language: ru
  text: А при её убывании в первый день её свет уменьшается до четырнадцати частей, во второй день уменьшается до тринадцати частей света, в третий день уменьшается до двенадцати, в четвёртый день уменьшается до одиннадцати частей, в пятый день уменьшается до десяти частей, в шестой день уменьшается до девяти частей, в седьмой день уменьшается до восьми частей, в восьмой день уменьшается до семи, в девятый день уменьшается до шести, в десятый день уменьшается до пяти, в одиннадцатый день уменьшается до четырёх, в двенадцатый день уменьшается до трёх, в тринадцатый день уменьшается до двух, а в четырнадцатый день её свет уменьшается до половины седьмой части всего её света[a]; и на пятнадцатый день иссякает то, что осталось от всего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «до половины седьмой части». Эта математически необычная дробь воспроизводит выражение эфиопского текста без сглаживания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ሕጸጸ / የኀጽጽ
  choice: убывание / уменьшается до
  rationale: Корень обозначает уменьшение света луны. «Убывание» естественно для лунного цикла, а «уменьшается до» показывает остающееся количество света, а не величину вычитания.
- source_word: እደ / ክፍለ
  choice: части
  rationale: Оба слова в данном перечислении обозначают исчисляемые доли лунного света; «части» сохраняет ясность без излишней математизации.
- source_word: ብርሃኑ / ብርሃን
  choice: её свет / свет
  rationale: Прямо передаёт измеряемый видимый свет луны и не добавляет отсутствующей в источнике образности.
- source_word: መንፈቀ፡ ሳብዐቱ
  choice: половина седьмой части
  rationale: Сохраняет буквальную и математически неловкую дробь эфиопского текста, не исправляя её предположительно.
- source_word: ይትዌዳእ
  choice: иссякает
  rationale: Форма глагола ወደአ означает завершение, исчерпание или прекращение; в контексте последнего дня убывания «иссякает» естественно описывает остаток света.
- source_word: ዘተረፈ፡ እምኵሉ
  choice: то, что осталось от целого
  rationale: Сохраняет формальное указание на остаток после последовательного уменьшения.
theological_decisions:
- issue: Характер числовой последовательности
  choice: Передать как последовательное измерение остающегося лунного света
  alternative: Понять числа символически либо обобщить описание убывания
  rationale: Повторяющиеся числа и формулы в астрономическом разделе выражают упорядоченное описание небесного цикла; текст не даёт основания превращать его в аллегорию.
- issue: Направление уменьшения
  choice: «уменьшается до» указанного числа частей
  alternative: «уменьшается на» указанное число частей
  rationale: Числа четырнадцать, тринадцать и далее обозначают остающееся количество света. Вариант «на» нарушил бы последовательность и математический смысл.
translation_notes:
  register: Современный литературный русский с размеренным, формульным ритмом. Повторяющаяся структура числового перечня сохранена, но допустимые русские эллипсисы использованы для естественности и читаемости.
