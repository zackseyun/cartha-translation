base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/004.yaml
  text: In the disk of the sun there are seven portions of light which are added to it beyond the moon[e][d][c][b][a], and in measure they are added until the seventh portion of the sun is completed.
translation:
  language: ru
  text: На солнечном диске[a] есть семь долей света, которые прибавляются к нему сверх луны[b]; и они прибавляются согласно мере, пока не завершится седьмая доля солнца[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в солнечном круге». Слово может обозначать круг, окружность или круглый диск; речь здесь, вероятно, идёт о самом светиле, а не о его пути.'
    reason: lexical_ambiguity
  - marker: b
    text: 'Эфиопский синтаксис здесь неясен. Возможно также: «сверх луны», «больше, чем у луны» или «от луны». По-видимому, свет солнца сопоставляется со светом луны.'
    reason: textual_variant
  - marker: c
    text: 'Последние слова допускают и перевод: «пока седьмая доля солнца не будет пройдена» или «не будет превышена».'
    reason: textual_variant
lexical_decisions:
- source_word: በክበበ፡ ፀሐይ
  choice: в солнечном круге
  rationale: ክበብ может обозначать круг, окружность или диск. Здесь речь идёт о световых долях самого светила, поэтому «солнечный круг» естественно передаёт древнее представление, не вводя современного понятия орбиты.
- source_word: ሰብዓቱ፡ ክፍለ፡ ብርሃን
  choice: семь долей света
  rationale: Буквально количественное выражение «семь частей/долей света»; «доли» сохраняет схематический язык измерения.
- source_word: ዘይትዌሰክ፡ ቦቱ
  choice: которые прибавляются к нему
  rationale: Передаёт значение добавления или увеличения; местоимение отнесено к солнечному кругу.
- source_word: እምወርኅ
  choice: сравнительно с луной
  rationale: Предлог እም допускает значение источника и сравнения. В контексте сопоставления светил сравнительное прочтение наиболее связно, но неоднозначность отмечена.
- source_word: ወመስፈርት፡ ትትወደይ
  choice: и они прибавляются по мере
  rationale: Сохраняет идею упорядоченного, измеряемого приращения и повтор additive language исходного текста.
- source_word: እስከ፡ የሐልፍ፡ ሳብዕ፡ ክፍለ፡ ፀሐይ
  choice: пока не завершится седьмая доля солнца
  rationale: ሳብዕ — порядковое «седьмая»; контекст позволяет понять የሐልፍ как достижение или завершение предела, хотя буквально глагол может означать прохождение либо превышение.
theological_decisions:
- issue: Характер космологического утверждения
  choice: Сохранено древнее схематическое описание света небесных светил в измеряемых долях.
  alternative: Истолковать речь как чистую символику или заменить её современной астрономической терминологией.
  rationale: Текст представляет космический порядок в категориях своей эпохи; перевод не должен ни аллегоризировать его, ни модернизировать.
- issue: Неясное соотношение света солнца и луны
  choice: Передано сравнительно, без точного математического истолкования.
  alternative: Понять свет как исходящий от луны либо утверждать строго определённое превышение на семь долей.
  rationale: Синтаксис эфиопского текста труден, а እም допускает более одного отношения; категорическое уточнение устранило бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным регистром. Сохранены повтор «прибавляются», измерительная образность и трудность древнего космологического описания; современная научная терминология не вводится.
