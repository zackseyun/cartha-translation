base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/002.yaml
  text: 'And the moon has four names: the first is Asonya[a], the second Abla, the third Benase[b], and the fourth Erae.'
translation:
  language: ru
  text: 'И у луны четыре имени: первое — Асонья[a], второе — Абла, третье — Бенасе[b], а четвёртое — Эраэ.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Геэзское ወርኅ может означать и «луну», и «месяц». Здесь выбрано «луна», поскольку далее светилу даются четыре имени.
    reason: lexical_alternative
  - marker: b
    text: Все четыре имени переданы по их эфиопским формам. Их более древние исходные формы, если они существовали, точно не установлены.
    reason: cultural_note
lexical_decisions:
- source_word: ወርኅ
  choice: луна
  rationale: Слово может обозначать как луну, так и месяц; здесь перечисляются собственные имена светила, поэтому по ближайшему контексту выбрано «луна».
- source_word: አርባዕተ አስማተ ቦቱ
  choice: у луны четыре имени
  rationale: Форма ቦቱ буквально выражает принадлежность («у неё»); русская конструкция естественно передаёт значение обладания и сохраняет структуру перечня.
- source_word: ፩ ስሙ … ወካልእ … ወሣልስ … ወራብዕ
  choice: первое … второе … третье … четвёртое
  rationale: Последовательность порядковых обозначений передана кратко и ясно; союз перед последним элементом сохранён.
- source_word: አሶንያ / አብላ / ብናሴ / ኤራእ
  choice: Асонья / Абла / Бенасе / Эраэ
  rationale: Имена не переводятся, а передаются кириллицей непосредственно по эфиопским формам; точные более древние формы и часть вокализации остаются неясными.
theological_decisions:
- issue: Передавать ወርኅ как «луна» или «месяц»
  choice: луна
  alternative: месяц
  rationale: Хотя геэзское слово охватывает оба значения, присвоение четырёх собственных имён в контексте Книги светил указывает здесь на небесное светило; альтернативное лексическое значение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык; сдержанный, ясный и достойный повествовательный регистр. Перечень сохранён, имена даны в удобочитаемой кириллической транслитерации.
