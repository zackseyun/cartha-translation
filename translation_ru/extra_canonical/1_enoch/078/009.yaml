  text: And in certain months[a], the month has twenty-nine days[c][b], and once twenty-eight.
translation:
  language: ru
  text: И в некоторые месяцы месяц длится двадцать девять дней, а один раз — двадцать восемь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В доступной транскрипции последние знаки читаются как «пять недель», однако, вероятно, это ошибка распознавания эфиопского числительного «двадцать восемь». Последнее чтение соответствует контексту, где сопоставляется число дней в месяце.
    reason: textual_variant
lexical_decisions:
- source_word: አውራኅ
  choice: месяцы
  rationale: Форма понимается как множественное число от ወርኅ («месяц»); это соответствует контексту исчисления продолжительности лунных месяцев.
- source_word: እሙራን
  choice: некоторые
  rationale: Слово означает «определённые, некоторые», а не «светила»; вместе с አውራኅ оно образует выражение «в некоторые месяцы».
- source_word: ይከውን
  choice: длится
  rationale: Буквально это форма глагола «быть, становиться», но в утверждении о числе дней месяца русское «длится» естественно и точно передаёт смысл.
- source_word: ፳ወ፱መዋዕል
  choice: двадцать девять дней
  rationale: Прямое соответствие числительному и существительному «дни».
- source_word: ለወርኅ
  choice: месяц
  rationale: 'В русском синтаксисе календарного утверждения конструкция естественно передаётся как подлежащее: «месяц длится двадцать девять дней».'
- source_word: ወቦ፡ አመ
  choice: а один раз
  rationale: Сжатое временное выражение передано без попытки уточнить не обозначенный в тексте цикл; «один раз» сохраняет его неопределённость.
- source_word: ፭ወሳሙን
  choice: двадцать восемь
  rationale: Переданная транскрипция, буквально допускающая чтение «пять недель», вероятнее всего возникла из-за ошибочного распознавания графически сходного эфиопского числительного ፳ወ፰ («двадцать восемь»). Такое чтение согласуется с календарным контекстом.
