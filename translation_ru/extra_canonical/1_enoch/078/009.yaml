  source_fidelity: 'Перевод следует принятому в аудиторской истории чтению: አውራኅ понимается как «месяцы», እሙራን — как «некоторые/определённые», а заключительное числовое чтение передано как «двадцать восемь». Синтаксическое развёртывание «месяц длится двадцать девять дней» точно выражает календарный смысл исходного высказывания. Сомнительность доступной OCR-транскрипции заключительного числительного не скрыта, а отмечена в сноске.'
