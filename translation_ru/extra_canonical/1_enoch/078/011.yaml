  source_fidelity: 'Основные элементы переданы: период убывания, образ действия со светом «перед солнцем», четырнадцать дней, текстуально сомнительная скобочная формула и окончательное угасание. Однако «переносит» чрезмерно конкретизирует ትወዲ как перемещение света из одного места в другое. Для глагола, который может означать также «помещать/класть», безопаснее сохранить образ помещения, не навязывая направление передачи.'
  naturalness: Фраза «до четырнадцати дней — [её свет завершается]» читается как синтаксически разорванная. Запятая перед скобочной частью яснее отделяет текстуально неуверенную формулу. «Свет завершается» намеренно близко к исходной формуле, но в русском несколько тяжеловесно; «подходит к концу» естественнее, сохраняя значение завершения.
  terminology: «Луна», «свет», «угасает», «небо» соответствуют астрономическому регистру. «Помещает свой свет перед солнцем» сохраняет необычную древнюю космологическую образность и не подменяет её современным объяснением убывания.
