base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/011.yaml
  text: And throughout the time when the moon is waning[a], it diminishes its light before the sun until fourteen days [its light is completed]; and when it is extinguished[d][c][b], all its light is completed in the sky.
translation:
  language: ru
  text: И в течение всего времени, пока луна убывает, она помещает свой свет перед солнцем[b] до четырнадцати дней, [её свет подходит к концу][a]; а когда она угасает, весь её свет подходит к концу на небе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Слова в квадратных скобках текстуально неуверенны. Буквально: «её свет завершается»; глагол относится к свету, а не к четырнадцати дням.'
    reason: textual_variant
  - marker: b
    text: 'Буквально: «перед солнцем». Глагол может обозначать помещение или расположение света; в данном контексте выражение также может пониматься как действие в присутствии солнца или по отношению к нему. Его иногда передают как уменьшение света, но такой перевод истолковывает образ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎ፡ ዘመነ፡ ዘተነሡር፡ ወርኅ፡
  choice: всё время, пока луна убывает
  rationale: Передаёт целостность периода и убывающую фазу луны естественным современным русским языком.
- source_word: ብርሃነ፡ ዚአሃ፡ ትወዲ፡
  choice: она переносит свой свет
  rationale: Глагол ትወዲ формально передан как действие помещения или переноса, а не заменён безоговорочно глаголом «уменьшает»; так сохраняется конкретная космологическая образность и отмеченная в истории редакций лексическая трудность.
- source_word: በቅድመ፡ ፀሐይ፡
  choice: перед солнцем
  rationale: Сохранено буквальное пространственно-относительное выражение; контекст допускает смысл «в присутствии солнца» или «по отношению к солнцу», но не требует устранять неоднозначность.
- source_word: እስከ፡ ፲ወ፬መዋዕል፡
  choice: до четырнадцати дней
  rationale: Числительное относится к продолжительности процесса; глагол следующей, заключённой в скобки фразы не перенесён на слово «дни».
- source_word: '[ይትፌጸም፡ ብርሃና፡]'
  choice: '[её свет завершается]'
  rationale: Сохранены редакционные скобки и явный субъект «её свет». Необычная формула завершения передана близко к форме источника.
- source_word: ወሶበ፡ ይውዒ፡
  choice: а когда она угасает
  rationale: «Угасает» сохраняет образ светила, чей свет гаснет, и звучит естественнее буквального «бывает погашена».
- source_word: ኵሉ፡ ይትፌጸም፡ ብርሃኑ፡ ውስተ፡ ሰማይ።
  choice: весь её свет завершается на небе
  rationale: Сохранена повторная формула завершения и астрономическое значение ሰማይ; «на небе» здесь естественно обозначает видимую небесную сферу.
theological_decisions:
- issue: Следует ли заменять конкретную космологическую речь современным описанием убывания луны
  choice: сохранить образы переноса и угасания света
  alternative: передать как «её свет уменьшается» и «она темнеет»
  rationale: Текст выражает древнюю модель движения и исчезновения лунного света. Нейтрализация образов сделала бы перевод понятнее с современной астрономической точки зрения, но внесла бы в него отсутствующее толкование.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического астрономического изложения. Синтаксис слегка формален, чтобы сохранить повтор и космологическую схематичность источника; квадратные скобки оставлены как знак текстовой неуверенности.
