  source_fidelity: 'Начальная часть передана в целом верно: глагол в единственном числе подразумевает ранее названное небесное тело, а не «три месяца», и «по тридцать дней» удачно выражает календарное распределение. Однако заключительное ታኀጻጺተ፡ ዚአሁ в данном контексте следует прежде всего передавать как убывание светила, а не как завершение его «исчисления». Английский audit trail также в основном переводит этот оборот как «when its waning occurs», хотя сопровождающие его альтернативы отражают текстуальную трудность.'
