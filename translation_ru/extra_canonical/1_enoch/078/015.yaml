base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/015.yaml
  text: And it makes three months of thirty days[a], and in its season[d][c][b], when its waning occurs.
translation:
  language: ru
  text: И оно образует три месяца по тридцать дней, в свой срок — когда убывает.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительный оборот труден. Обычно его понимают как указание на убывание светила; возможны также толкования, связанные с его расчётом или упорядочением. «В свой срок» можно передать также: «в свои сроки» или «в установленное для него время».'
    reason: textual_difficulty
lexical_decisions:
- source_word: ሠለስተ፡ ወርኀ
  choice: три месяца
  rationale: Числительное с существительным передаёт три месяца; сочетание выступает дополнением при глаголе в единственном числе.
- source_word: ይገብር
  choice: оно образует
  rationale: Форма глагола — третье лицо мужского рода единственного числа, поэтому подлежащим подразумевается ранее названное светило или небесное тело, а не «три месяца». «Образует» естественно передаёт значение «делает, составляет» в календарном контексте.
- source_word: ፴መዋዕለ
  choice: по тридцать дней
  rationale: Буквально — «тридцать дней»; русская распределительная конструкция ясно показывает, что каждый из трёх месяцев насчитывает тридцать дней.
- source_word: በአዝማነ፡ ዚአሁ
  choice: в назначенный ему срок
  rationale: አዝማን может обозначать время, сроки или установленные времена. Выбранная формулировка сохраняет календарный оттенок и местоименную отсылку.
- source_word: ሶበ
  choice: когда
  rationale: Временной союз естественно вводит заключительное придаточное предложение.
- source_word: ታኀጻጺተ፡ ዚአሁ
  choice: завершается его исчисление
  rationale: Трудная форма, вероятно, относится к доведению до конца расчёта, порядка или счёта. «Исчисление» сохраняет технический календарный смысл и не устраняет неясность местоименной отсылки.
theological_decisions:
- issue: Неясная календарно-астрономическая заключительная фраза
  choice: когда завершается его исчисление
  alternative: когда завершается его убывание
  rationale: В данном жанре вероятен технический смысл расчёта или упорядочения. Перевод сохраняет его, но примечание сообщает о неуверенности и не превращает спорную форму в однозначное описание лунной фазы.
translation_notes:
  register: Современный литературный русский язык с умеренно высоким, но понятным регистром. Синтаксис сохраняет разрывистость исходной календарной формулы; тире обозначает связь последнего придаточного с предшествующим сроком, не устраняя её смысловой неясности.
