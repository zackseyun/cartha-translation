base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/005.yaml
  text: And they set[a], and they enter the western portals, and make their circuit by the north[b], and by the eastern portals they come out upon the face of the sky.
translation:
  language: ru
  text: И они заходят, входят в западные врата[a], совершают круговой путь по северной стороне[b] и через восточные врата выходят на лик неба.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Повторяющийся образ врат отражает представление Астрономической книги об устроенном небосводе с постоянными отверстиями, через которые движутся светила.
    reason: cultural_note
  - marker: b
    text: Краткую эфиопскую фразу, переведённую как «по северной стороне», можно также понять как движение вокруг северной стороны или вдоль неё.
    reason: lexical_alternative
lexical_decisions:
- source_word: የዐርቡ
  choice: заходят
  rationale: В контексте движения светил глагол имеет специальное значение захода за горизонт; «заходят» естественно передаёт его по-русски.
- source_word: ይበውኡ
  choice: входят
  rationale: Прямой глагол движения, противопоставленный последующему «выходят» и согласующийся с образом небесных врат.
- source_word: ኆዋኅወ
  choice: врата
  rationale: «Врата» сохраняет возвышенный космико-архитектурный образ постоянных отверстий небосвода и уместно в апокалиптическом повествовании.
- source_word: ምዕራብ
  choice: западные
  rationale: Направление употреблено как определение к слову «врата».
- source_word: የአውዱ
  choice: обходят
  rationale: Глагол обозначает круговое движение или движение в обход; краткое «обходят» сохраняет образ маршрута, не добавляя идеи завершённого полного круга.
- source_word: እንተ መስዕ
  choice: с севера
  rationale: Передаёт северную сторону или путь движения, сохраняя краткость и некоторую неоднозначность эфиопской конструкции.
- source_word: እንተ ኆዋኅወ ምሥራቅ
  choice: через восточные врата
  rationale: Поскольку далее стоит глагол выхода, «через» естественно выражает прохождение через восточные отверстия и сохраняет параллель с западными вратами.
- source_word: ይወፅኡ
  choice: выходят
  rationale: Естественная смысловая пара к «входят» и точная передача движения наружу.
- source_word: ዲበ ገጸ ሰማይ
  choice: на лик неба
  rationale: Буквально-образная формулировка сохраняет конкретную космическую метафору «лица неба», не сводя её к обычному «в небо».
