base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/014.yaml
  text: From where the light comes to the moon, from there again it wanes until all the light is finished, and the days of the month pass, and its disk remains empty, without light.
translation:
  language: ru
  text: Откуда приходит свет к луне, оттуда же она снова убывает, пока не иссякнет весь свет; и проходят дни месяца, а её диск остаётся пустым, без света.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Диск» можно также перевести как «круг»; речь идёт о видимой круглой форме луны, оставшейся без света.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኀበ … እምህየ
  choice: откуда … оттуда
  rationale: 'Передаёт соотносительную конструкцию источника: луна убывает с той же стороны, откуда к ней приходит свет.'
- source_word: ይመጽእ ብርሃን ለወርኅ
  choice: приходит свет к луне
  rationale: Сохраняет направительное значение предлога и описательный характер настоящего времени.
- source_word: ካዕበ የሐፅፅ
  choice: она снова убывает
  rationale: «Убывает» — естественный русский астрономический глагол для уменьшения освещённой части луны; местоимение проясняет, что подлежащим остаётся луна.
- source_word: እስከ ይትዌዳእ ኵሉ ብርሃን
  choice: пока не иссякнет весь свет
  rationale: Передаёт завершение процесса убывания без современного научного истолкования механизма.
- source_word: ወየኀልፍ መዋዕለ ወርኅ
  choice: и проходят дни месяца
  rationale: В данном контексте ወርኅ понято во временном значении «месяц», хотя слово также означает «луна».
- source_word: ወይነብር ክበቡ ባክ ዘእንበለ ብርሃን
  choice: а её диск остаётся пустым, без света
  rationale: «Диск» естественно обозначает видимую круглую форму луны; «пустым, без света» сохраняет наглядный и несколько избыточный образ оригинала.
theological_decisions:
- issue: Характер описания лунного света
  choice: Передать наблюдаемое получение и убывание света в образах источника, не уточняя физический механизм.
  alternative: Истолковать свет символически либо заменить описание современной формулировкой об отражённом солнечном свете.
  rationale: Текст описывает упорядоченный небесный процесс в апокалиптической космологии; перевод не должен ни аллегоризировать его, ни модернизировать.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего астрономического описания. Соотнесение «откуда … оттуда» сохранено; точка с запятой делает длинную последовательность ясной, не разрушая её связности.
