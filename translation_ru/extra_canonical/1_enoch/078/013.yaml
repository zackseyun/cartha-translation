base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/013.yaml
  text: 'It is completed with exactness: by day the sun goes down in the west[a], and from the east the moon rises by night and gives light all night, until the sun rises before it[c][b], and the moon is seen before the sun.'
translation:
  language: ru
  text: 'Так всё совершается в точности: днём солнце заходит на западе, а ночью с востока восходит луна[a] и светит всю ночь, пока перед нею не взойдёт солнце[b]; и луна видна перед солнцем[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Формулировка «ночью с востока восходит луна» трудна в контексте. Необычный порядок слов и последовательность исходного текста переданы без гармонизации с привычным астрономическим описанием.
    reason: textual_variant
  - marker: b
    text: Форма глагола, переведённого как «взойдёт», текстуально не вполне ясна; по контексту речь идёт о появлении или восходе солнца.
    reason: lexical_alternative
  - marker: c
    text: Слово «перед» может указывать как на положение впереди, так и на временное предшествование.
    reason: ambiguity
lexical_decisions:
- source_word: ይትፌጸም
  choice: это совершается
  rationale: Возвратно-пассивная форма обозначает завершение или совершение. В описании установленного движения светил «совершается» звучит естественно и не придаёт выражению излишне пророческого оттенка.
- source_word: ጥንቀቀ
  choice: с точностью
  rationale: Передаёт значение тщательности и точности, уместное в календарно-астрономическом контексте.
- source_word: ይወርድ
  choice: заходит
  rationale: Буквально глагол означает «спускается», однако применительно к солнцу современное русское «заходит» ясно и естественно передаёт тот же образ движения.
- source_word: ዐረብ
  choice: на западе
  rationale: В паре с «востоком» слово имеет здесь направительное значение, хотя этимологически и контекстуально связано также с вечером.
- source_word: ምሥራቅ
  choice: с востока
  rationale: Обозначает восток, место восхода; предлог соответствует исходному направлению движения луны.
- source_word: የዐርግ
  choice: восходит
  rationale: Глагол означает подъём или восхождение. Его субъектом по синтаксису выступает названная далее луна, а не солнце.
- source_word: ያበርህ
  choice: светит
  rationale: Каузативный оттенок допускает «даёт свет», но русское «светит» естественно выражает излучение света без изменения смысла.
- source_word: በኵሉ ሌሊት
  choice: всю ночь
  rationale: Естественно и полно передаёт охват целой ночи.
- source_word: ይሠርቅ
  choice: взойдёт
  rationale: Форма текстуально трудна, но в сочетании с солнцем контекст указывает на его появление или восход; трудность отмечена в сноске.
- source_word: በቅድሜሁ
  choice: перед нею
  rationale: Местоимение отнесено к луне; «перед» сохраняет возможный пространственный и временной смысл.
- source_word: ይትረአይ
  choice: видна
  rationale: Передаёт пассивно-возвратное значение зримости естественным современным русским выражением.
- source_word: በቅደመ ፀሐይ
  choice: перед солнцем
  rationale: Формально сохраняет исходное отношение предшествования или положения впереди, не устраняя его неоднозначность.
theological_decisions:
- issue: Следует ли нормализовать необычную последовательность астрономического описания
  choice: Сохранить формулировки «перед нею» и «перед солнцем» и пояснить их неоднозначность.
  alternative: Пересказать стих как обычную смену заката, лунного света и восхода солнца.
  rationale: Источник описывает взаимное положение и последовательность светил необычным образом. Сглаживание устранило бы реальную неоднозначность текста и навязало бы ему более привычную астрономическую схему.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, но понятным синтаксисом. Техническая последовательность исходного астрономического описания сохранена без конфессионального толкования; заведомо ошибочное отнесение ночного восхода к солнцу не воспроизводится.
