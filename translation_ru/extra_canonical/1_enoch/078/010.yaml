base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/010.yaml
  text: 'And Uriel showed me another law: when light is transferred into the moon[c][b][a], and from where it is transferred from the sun.'
translation:
  language: ru
  text: 'И Уриил показал мне ещё один закон[a]: как свет передаётся луне[b] и откуда он передаётся — от солнца[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ещё один порядок», «ещё одно установление». Эфиопское слово может обозначать упорядоченное правило или неизменное устройство мироздания.'
    reason: lexical_alternative
  - marker: b
    text: Фраза в оригинале сжата. По смыслу Уриил показывает Еноху правило, согласно которому луна получает свет от солнца.
    reason: alternative_reading
  - marker: c
    text: 'Возможно также: «с какой стороны он передаётся от солнца». Соответствующее выражение может указывать не только на источник, но и на сторону или направление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልእት
  choice: ещё один
  rationale: Передаёт значение дополнительного, следующего по порядку установления в ряду астрономических законов.
- source_word: ሥርዓተ
  choice: закон
  rationale: В контексте Астрономической книги обозначает установленное правило или неизменный порядок мироздания; «закон» сохраняет торжественный космологический оттенок.
- source_word: አርአየኒ
  choice: показал мне
  rationale: Прямо передаёт глагол зрительного предъявления и соответствует повествованию о видении, не добавляя специального богословского смысла.
- source_word: ይትወደይ
  choice: переносится
  rationale: Сохраняет пассивно-возвратную форму и описывает переход света от одного светила к другому.
- source_word: ብርሃን
  choice: свет
  rationale: Основное и наименее истолковывающее обозначение физического света светила.
- source_word: ውስተ፡ ወርኅ
  choice: в луну
  rationale: Предлог выражает направленность внутрь; формулировка сохраняет пространственный образ исходного текста.
- source_word: እምኀበ
  choice: откуда
  rationale: Сохраняет относительно-вопросительное указание на источник или исходную сторону, не сводя его безусловно к более узкому значению «с какой стороны».
- source_word: እምፀሐይ
  choice: от солнца
  rationale: Прямо называет солнце источником, от которого переносится свет.
theological_decisions:
- issue: Происхождение света луны
  choice: Свет луны представлен как переносимый от солнца.
  alternative: Текст лишь устанавливает связь между лунным и солнечным светом либо описывает сторону освещения луны, не утверждая происхождения её света.
  rationale: Повтор глагола со словами «свет», «в луну» и «от солнца» наиболее естественно указывает на производный характер лунного света. Это космологическое утверждение данного отрывка, а не позднейшая символическая интерпретация.
translation_notes:
  register: Современный литературный русский с умеренно торжественным апокалиптическим звучанием. Синтаксическая сжатость и некоторая необычность исходной формулировки сохранены; пояснения вынесены в примечания.
