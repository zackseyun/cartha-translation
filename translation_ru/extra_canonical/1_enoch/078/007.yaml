base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/007.yaml
  text: And fifteen parts of light are added within it until the fifteenth day[a]; and its light is completed as a sign of the year, and it becomes fifteen parts[c][b], and the moon comes into being by half of a seventh part.
translation:
  language: ru
  text: И пятнадцать долей света прибавляются в ней вплоть до пятнадцатого дня[a]; и свет её достигает полноты как знамение года и составляет пятнадцать долей[b], а луна образуется посредством половины седьмой доли[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В эфиопском тексте буквально сказано «до десяти и пяти»; слово «дня» восполнено по контексту.
    reason: implicit_word
  - marker: b
    text: Повторное «пятнадцать», вероятно, означает пятнадцать долей лунного света — техническую меру, употребляемую в этой главе.
    reason: cultural_note
  - marker: c
    text: Заключительная фраза трудна. Она буквально говорит, что луна образуется посредством половины седьмой доли; её можно понимать как указание на половину одной седьмой доли, то есть на одну четырнадцатую. Слово, переведённое как «луна», может также означать «месяц».
    reason: textual_variant
lexical_decisions:
- source_word: ፲ትኅምስት ብርሃን
  choice: пятнадцать долей света
  rationale: Числительное означает «пятнадцать»; «долей» восполнено из контекста последовательного исчисления лунного света.
- source_word: ይትወደደ ውስቴታ
  choice: прибавляются в ней
  rationale: Передаёт постепенное накопление света внутри луны без сглаживания образа до общего «возрастает».
- source_word: እስከ ዐሡር ወኃሙስ
  choice: вплоть до пятнадцатого дня
  rationale: Буквально стоит «до десяти и пяти»; слово «дня» восполнено по описанию нарастания света до середины лунного цикла.
- source_word: ይትፈጸም ብርሃነ ዚአሁ
  choice: её свет достигает полноты
  rationale: Глагол обозначает завершение или достижение полной меры; такая формулировка естественно передаёт полную освещённость луны.
- source_word: ለትእምርተ ዓመት
  choice: служа знамением года
  rationale: Сохраняет календарный смысл «знамения/знака года» и возвышенный космологический регистр.
- source_word: ወይከውን ለ፲፲ትኅምስት
  choice: составляет пятнадцать долей
  rationale: Трудная конструкция, по-видимому, вновь указывает на полную исчисленную меру света; «долей» восполнено из контекста.
- source_word: ወርኅ
  choice: луна
  rationale: Слово может означать и «луну», и «месяц»; здесь субъектом является светило в процессе изменения его освещённости.
- source_word: በመንፈቀ ሳብዕ እደ
  choice: прирастает на половину седьмой доли
  rationale: 'Конструкция понята как величина приращения: половина одной седьмой, то есть одна четырнадцатая; глагол «прирастает» естественно выражает поэтапное увеличение лунного света.'
theological_decisions:
- issue: Календарное значение полного лунного света
  choice: знамением года
  alternative: предзнаменованием года
  rationale: Контекст описывает установленный календарный порядок светил, а не гадательное предвестие; «знамение» сохраняет космологическую значимость, не вводя аллегорического или конфессионального толкования.
- issue: Соотношение луны и месяца в заключительной фразе
  choice: луна
  alternative: месяц
  rationale: Оба значения лексически возможны, но расчёт приращения света относится прежде всего к луне; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с ясной, но достойной космологической лексикой. Технический характер счёта сохранён; неясности исходной фразы не скрыты и вынесены в сноски.
