base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/012.yaml
  text: On the first day she is called the new moon[d][c][b][a], because on that day light rises upon her.
translation:
  language: ru
  text: В первый день она называется новолунием[a], потому что в этот день на ней восходит свет[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально это название связано с восхождением или началом возрастания света луны; возможно также: «восходящей».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «на ней появляется свет». Оригинал изображает свет восходящим на луне.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በቀዳሚት፡ ዕለት
  choice: В первый день
  rationale: Предложное сочетание обозначает первый день описываемой лунной последовательности; это естественная и точная временная конструкция в русском языке.
- source_word: ሠርቀ
  choice: новолунием
  rationale: В данном календарно-астрономическом контексте слово служит названием новой луны, буквально связанным с восхождением или началом возрастания света. «Новолунием» передаёт специальное обозначение без излишнего перифраза.
- source_word: ትሠመይ
  choice: она называется
  rationale: Женская форма глагола соотносится с луной. В русском слово «луна» также женского рода, поэтому исходная образность сохраняется естественно.
- source_word: እስመ
  choice: потому что
  rationale: Союз вводит причину данного в первой части названия.
- source_word: ይትነሣእ፡ ላዕሌሃ፡ ብርሃን
  choice: на ней восходит свет
  rationale: Формулировка сохраняет образ света, поднимающегося или возникающего на луне. Неопределённое «свет» соответствует отсутствию определённого артикля, а «на ней» передаёт направленность света на её видимую поверхность.
theological_decisions:
- issue: Женский род при указании на светило
  choice: Сохранить женское местоимение «она» и форму «на ней»
  alternative: Использовать безличную конструкцию или повторить существительное «луна»
  rationale: Формы оригинала имеют женский род и соотносятся с луной; русский язык позволяет передать это без неестественного олицетворения и без внесения дополнительных богословских смыслов.
- issue: Характер обозначения ሠርቀ
  choice: Передать как календарное название «новолуние»
  alternative: «возрастающая» или «восходящая»
  rationale: Контекст описывает первый день лунного цикла и объясняет его название появлением света. «Новолуние» сохраняет календарную конкретность, тогда как альтернативы сильнее подчёркивают буквальную образность корня.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной, но ясной формой. Сохранены женский род луны и образ восходящего на ней света; специальный календарный термин передан общеупотребительным словом «новолуние».
