base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/001.yaml
  text: 'And these are the names of the sun: one is Aryares[a], and the second, Tomas.'
translation:
  language: ru
  text: 'И вот имена солнца: одно — Арьярес[a], а второе — Томас.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Оба имени солнца переданы транслитерацией по геэзскому тексту. Их точная форма на более ранних этапах текстовой традиции остаётся неясной.
    reason: lexical_alternative
lexical_decisions:
- source_word: አስማቲሁ ለፀሐይ
  choice: имена солнца
  rationale: Множественное число «имена» с местоименным суффиксом и последующим обозначением солнца естественно передаётся по-русски родительной конструкцией.
- source_word: ከመዝ
  choice: вот
  rationale: В данном перечислительном обороте слово вводит последующий список; «вот» кратко и естественно передаёт указательное значение.
- source_word: ፩
  choice: одно
  rationale: Сохраняется прямое значение числительного «одно», согласованного с русским словом «имя», без замены на «первое».
- source_word: አርያሬስ
  choice: Арьярес
  rationale: Имя транслитерировано по форме геэзского свидетеля; мягкий знак помогает передать сочетание согласного с йотированным гласным.
- source_word: ካልእ
  choice: второе
  rationale: В парном перечислении слово обозначает второй элемент, а не неопределённое «другое».
- source_word: ቶማስ
  choice: Томас
  rationale: Сохранена транслитерация формы геэзского текста без отождествления с привычной русской формой имени «Фома».
theological_decisions:
- issue: Следует ли истолковывать или нормализовать тайные имена солнца
  choice: Оба имени сохранены в транслитерации
  alternative: Перевести имена этимологически либо заменить «Томас» на знакомую форму «Фома»
  rationale: Текст называет особые имена в контексте апокалиптической космологии; транслитерация сохраняет неопределённость их происхождения и не привносит позднейших ассоциаций.
translation_notes:
  register: Современный литературный русский язык с кратким, слегка торжественным перечислительным оборотом. Формулировка сохраняет последовательность исходного текста, но избегает архаизмов.
