  source_fidelity: 'В целом сохранены образы небесных хранилищ, два отдельных упоминания ветра и неопределённость метеорологического термина ጊሜ. Однако временной оборот «ещё от времён до существования мира» добавляет не выраженное в оригинале понятие «существования» и чрезмерно разворачивает እምቅድመ ዓለም. Его следует передать ближе: «с прежних времён, до мира» или, предпочтительно, «прежде мира». Трудное ወዘደመና нельзя сгладить до простого «облака»: относительный/указательный элемент должен быть отмечен, но «то, что относится к облаку» звучит как современная аналитическая перефразировка и несколько ослабляет эллиптичность оригинала.'
