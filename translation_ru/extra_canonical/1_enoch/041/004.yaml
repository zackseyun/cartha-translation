  yaml_path: translation/extra_canonical/1_enoch/041/004.yaml
  text: And there I saw the storehouses of the lightning[a], and from them are apportioned the wind from the storehouse of hail, and the wind from the storehouse of mist[d][c][b], and the cloud and its cloud remain over the earth from before the world.
translation:
  language: ru
  text: И там я увидел хранилища молний; из них распределяются ветер из хранилища града и ветер из хранилища тумана[a], а то, что от облака, и его облако[b] пребывают над землёй прежде мира[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Значение геэзского слова не вполне ясно; возможны также переводы «иней», «изморозь» или название близкого погодного явления.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально конструкция близка к: «и то, что от облака, и его облако». Текст здесь необычен; первое выражение эллиптично, и связь между этими словами остаётся неясной.'
    reason: textual_difficulty
  - marker: c
    text: 'Буквально: «прежде мира»; возможно также понимание «прежде века».'
    reason: lexical_and_temporal_ambiguity
lexical_decisions:
- source_word: መዛግብተ
  choice: хранилища
  rationale: Передаёт конкретный образ небесных запасов или помещений и не вызывает денежной ассоциации, возможной у слова «сокровищницы».
- source_word: ፀዳዋነ
  choice: молний
  rationale: В метеорологическом контексте слово естественно обозначает молнии; русское множественное число соответствует образу повторяющихся небесных явлений.
- source_word: ይትከፈሉ
  choice: распределяются
  rationale: Форма выражает упорядоченное распределение; составное подлежащее сохранено, и оба упоминания ветра переданы явно.
- source_word: ነፋስ
  choice: ветер
  rationale: Окружающие слова обозначают погодные явления, поэтому метеорологическое значение предпочтительнее значения «дух».
- source_word: በረድ
  choice: град
  rationale: Прямой и естественный русский эквивалент метеорологического термина.
- source_word: ጊሜ
  choice: туман
  rationale: Значение не вполне определённо; «туман» уместен рядом с облачной лексикой, а возможные значения «иней» и «изморозь» отмечены в сноске.
- source_word: ወዘደመና / ወደመና ዚአሁ
  choice: а то, что относится к облаку, и его облако
  rationale: Сохранены относительное местоимение и трудная повторная конструкция эфиопского текста без подстановки невыраженного существительного «хранилище».
- source_word: የኀድር
  choice: пребывают
  rationale: Передаёт длительное нахождение; число согласовано в русском с двумя синтаксически соединёнными элементами, хотя исходная конструкция остаётся трудной.
- source_word: እምቅድመ ዓለም
  choice: ещё от времён до существования мира
  rationale: Сохраняет первозданную временную перспективу и звучит понятнее по-русски, чем буквальное «от прежде мира», не уточняя догматически природу этого предшествования.
theological_decisions:
- issue: Первозданное временное выражение в космологическом контексте
  choice: ещё от времён до существования мира
  alternative: издревле, прежде мира / ещё до начала века
  rationale: Формулировка сохраняет утверждение о предшествовании миру, но не превращает его в специальное учение о вечности или о способе сотворения.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но доступным апокалиптическим звучанием. Повтор слова «ветер» сохранён ради соответствия исходному составному подлежащему; трудная облачная конструкция не сглажена и пояснена сноской.
