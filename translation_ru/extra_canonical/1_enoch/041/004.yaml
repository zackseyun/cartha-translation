  terminology: «Хранилища», «молнии», «град», «ветер» и «туман» удачны. Сноска к «туману» необходима и достаточна. «Прежде мира» сохраняет космологическую и временную неоднозначность без конфессионального истолкования. Сноска к облачной конструкции должна объяснять, что первое выражение эллиптично, а не утверждать определённо значение «относится к».
