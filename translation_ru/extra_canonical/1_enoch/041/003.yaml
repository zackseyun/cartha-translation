base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/003.yaml
  text: And there my eyes saw the hidden treasuries of the lightning and the thunder[a], and the hidden treasuries of the winds—how they are divided so that they may blow upon the earth—and the hidden treasuries of the clouds and the dew; and there I saw from where they come in that place[e][d][c][b], and from there they water the dust of the earth.
translation:
  language: ru
  text: И там мои глаза увидели тайные хранилища молнии и грома[a], и тайные хранилища ветров — как разделены их уста[b], чтобы они дули над землёй, — и тайные хранилища облаков и росы. И там, в том месте, я увидел, откуда они приходят[c], и оттуда прах земли насыщается влагой[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокрытые места (сокровищницы) молнии и грома». Геэзское слово может обозначать как нечто скрытое, так и место, где оно хранится.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «как разделены их уста»; речь идёт об отверстиях или выходах ветров.'
    reason: anthropomorphic_image
  - marker: c
    text: 'Глагол можно понимать как единственное число с собирательным значением; перевод соотносит его со всеми перечисленными явлениями. Буквально также возможно: «откуда [они] приходят в том месте».'
    reason: grammatical_ambiguity
  - marker: d
    text: 'Возможное чтение: «и оттуда они насыщают прах земли». Основной текст понимает глагол непереходно: прах земли сам «насыщается» или «наполняется»; «влагой» уточняет смысл по контексту облаков и росы.'
    reason: alternative_reading
lexical_decisions:
- source_word: ኅቡኣተ
  choice: тайные хранилища
  rationale: В перечне сокрытых источников природных сил слово передаёт образ отведённых, скрытых мест их хранения; «хранилища» яснее по-русски сохраняет космическую образность, чем отвлечённое «тайны».
- source_word: መብረቅት ወነጐድጓድ
  choice: молнии и грома
  rationale: Названия метеорологических явлений переданы собирательными формами, естественными для русского языка.
- source_word: ነፋሳት
  choice: ветров
  rationale: Контекст природных явлений и последующий глагол «дуть» указывают здесь на ветры, а не на духов.
- source_word: አፎ
  choice: их уста
  rationale: Сохранён конкретный антропоморфный образ отверстий, через которые выходят ветры; более сглаженный вариант — «выходы».
- source_word: ይትከፈሉ
  choice: разделены
  rationale: Передано значение разделения или распределения уст ветров без замены образа пояснением.
- source_word: ከመ ይንፍሑ ዲበ ምድር
  choice: чтобы они дули над землёй
  rationale: Целевая конструкция и метеорологический смысл переданы прямо и естественно.
- source_word: ደመናት ወጠል
  choice: облаков и росы
  rationale: Прямые соответствия названиям природных источников влаги.
- source_word: እምኀበ ይመጽእ
  choice: откуда они приходят
  rationale: Русское множественное число соотносит глагол с перечисленными явлениями; сам геэзский текст допускает грамматически более узкое или собирательное соотнесение.
- source_word: ይፀግቡ ጸበለ ምድር
  choice: прах земли насыщается влагой
  rationale: Передача учитывает непереходное значение глагола «насыщаться, наполняться» и воспринимает «прах земли» как субъект; слово «влагой» эксплицирует очевидный из контекста результат облаков и росы.
theological_decisions:
- issue: Передача ነፋሳት как природного или духовного явления
  choice: ветры
  alternative: духи
  rationale: Перечень молнии, грома, облаков и росы, а также действие «дуть над землёй» требуют прежде всего метеорологического смысла, не исключая более широкой одушевлённой космологии книги.
- issue: Синтаксис заключительной фразы
  choice: прах земли насыщается влагой
  alternative: они насыщают влагой прах земли
  rationale: Непереходная морфология глагола поддерживает чтение, при котором прах земли насыщается; активное чтение имеет переводческую традицию и отмечено в сноске, поскольку синтаксис и число формы обсуждаются.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического видения. Повтор «тайные хранилища» и образ «уст» намеренно сохранены; синтаксис слегка упорядочен для ясности, но спорная заключительная конструкция не представлена как однозначная.
