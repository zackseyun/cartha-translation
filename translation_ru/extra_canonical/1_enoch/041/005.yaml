base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/005.yaml
  text: And I saw the storehouses of the sun and of the moon[a], where they come out and where they go in, and their glorious return; and one is more honored than the other. And their course is blessed, and they do not overstep their course, and they do not add to it, and they do not take away from their course[d][c][b]; and they keep faith with one another by an oath.
translation:
  language: ru
  text: 'И я увидел хранилища солнца и луны[a]: откуда они выходят и куда входят, и их славное возвращение, и как одно из них почитается выше другого[b]. Путь их благословен: они не преступают своего пути, ничего к нему не прибавляют и ничего от него не убавляют; и они хранят верность друг другу по клятве[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сокровищницы». Имеются в виду небесные покои, из которых солнце и луна выходят и куда возвращаются.'
    reason: lexical_alternative
  - marker: b
    text: Оборот труден для истолкования. Вероятно, сравниваются слава или положение солнца и луны; какое именно светило почитается выше, здесь прямо не сказано.
    reason: alternative_reading
  - marker: c
    text: Выражение «хранят верность друг другу по клятве» описывает установленный порядок светил языком верности обязательству, а не только как механическую регулярность.
    reason: cultural_note
lexical_decisions:
- source_word: መዛግብተ
  choice: хранилища
  rationale: Слово обозначает сокровищницы или хранилища. «Хранилища» сохраняет конкретный апокалиптический образ небесных покоев, откуда выходят и куда возвращаются светила, не создавая преимущественно финансовой ассоциации.
- source_word: እምአይቴ ይወፅኡ / አይቴ ይገብኡ
  choice: откуда они выходят / куда входят
  rationale: Перед первым «где» стоит предлог እም, поэтому передано «откуда»; основные глаголы движения сохранены без сведения образа к астрономическим терминам «восходят» и «заходят».
- source_word: ግብኦቶሙ ስቡሕ
  choice: их славное возвращение
  rationale: Существительное связано со входом или возвращением, а прилагательное выражает славу и великолепие. «Славное возвращение» естественно передаёт циклическое возвращение светил в небесные хранилища.
- source_word: ወአፎ ይከብር አሐዱ ለካልኡ
  choice: и как одно из них почитается выше другого
  rationale: Частица አፎ передана словом «как», а сравнительное отношение чести сохранено без уточнения, идёт ли речь о солнце или луне и в чём именно состоит превосходство.
- source_word: ምሕዋሮሙ
  choice: путь их
  rationale: Слово может обозначать путь, движение или круг. «Путь» понятно современному читателю и не вносит современного технического понятия орбиты.
- source_word: ብፁዕ
  choice: благословен
  rationale: Сохранён религиозно насыщенный смысл, представляющий установленное движение светил не просто правильным, но благословенным.
- source_word: ኢየኃልፉ ምሕዋረ
  choice: не преступают своего пути
  rationale: Глагол выражает переход за установленную границу. «Не преступают» сохраняет пространственный смысл и оттенок послушания установленному порядку.
- source_word: ኢይዌስኩ ወኢያኃጽጹ
  choice: ничего к нему не прибавляют и ничего от него не убавляют
  rationale: Парные глаголы буквально выражают прибавление и убавление. Повтор сохраняет ритм и подчёркивает неизменность назначенного пути.
- source_word: ሃይማኖተ የዐቅቡ
  choice: хранят верность
  rationale: В данном контексте речь идёт о верности или надёжности, а не о вероучении. Формулировка сохраняет нравственно-заветный оттенок.
- source_word: በመሐላ
  choice: по клятве
  rationale: Слово обозначает клятву. Выражение передаёт обязательность и торжественность взаимной верности светил.
theological_decisions:
- issue: Описывать ли движение светил нейтрально-астрономическим или религиозно-заветным языком
  choice: Сохранить выражения «благословен», «хранят верность» и «по клятве».
  alternative: 'Передать нейтрально: «их движение регулярно» и «они соблюдают установленный порядок».'
  rationale: Геэзский текст сознательно наделяет космический порядок религиозно-нравственным языком. Нейтральная астрономическая передача устранила бы значимую для апокалиптического видения богословскую напряжённость.
- issue: Уточнять ли, какое из двух светил почитается выше
  choice: Оставить неопределённое «одно из них».
  alternative: Прямо сказать, что солнце превосходит луну.
  rationale: Сам стих не называет более почитаемое светило. Уточнение внесло бы вывод переводчика в основной текст.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным апокалиптическим звучанием. Сохранены конкретные пространственные образы, параллелизм и религиозная лексика источника; избегаются современные технические термины и конфессиональные уточнения.
