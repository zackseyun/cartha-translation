base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/001.yaml
  text: And after this I saw all the hidden things of the heavens[a], and how the kingdom is divided[c][b], and how the deeds of human beings are weighed in the balance.
translation:
  language: ru
  text: И после этого я увидел всё сокрытое на небесах[a], и как царство разделяется[b], и как человеческие дела взвешиваются на весах[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все тайны небес». Геэзское выражение может обозначать то, что скрыто от обычного зрения или знания.'
    reason: lexical_alternative
  - marker: b
    text: Фраза «как царство разделяется» трудна для понимания. Возможно, речь идёт об устройстве или распределении небесного царства.
    reason: alternative_reading
  - marker: c
    text: Буквальный образ взвешивания человеческих дел на весах может подразумевать суд или оценку.
    reason: cultural_note
lexical_decisions:
- source_word: እምድኅረዝ
  choice: после этого
  rationale: Естественно передаёт формулу временного перехода в последовательности видений.
- source_word: ርኢኩ
  choice: я увидел
  rationale: Прямо передаёт повествование от первого лица без ненужной архаизации.
- source_word: ኵሎ ኅቡኣቲሁ ለሰማያት
  choice: всё сокрытое на небесах
  rationale: Сохраняет значение скрытого от обычного зрения или знания и естественно звучит по-русски; значение «тайны небес» отмечено в сноске.
- source_word: መንግሥተ
  choice: царство
  rationale: Сохраняет основное космико-политическое значение существительного, не уточняя природу этого царства.
- source_word: እፎ
  choice: как
  rationale: Вводит содержание увиденного и естественно связывает последующие придаточные.
- source_word: ትትካፈል
  choice: разделяется
  rationale: Сохраняет пассивно-возвратный смысл разделения или распределения, не устраняя неясность трудной фразы.
- source_word: ትገበረ ሰብእ
  choice: человеческие дела
  rationale: Передаёт то, что совершают люди, и делает образ взвешивания понятным без чрезмерного истолкования.
- source_word: በመዳልው
  choice: на весах
  rationale: Конкретно и естественно передаёт образ весов, связанный с оценкой или судом.
- source_word: ይደለው
  choice: взвешиваются
  rationale: Соответствует образу весов и сохраняет судебно-оценочную метафору.
theological_decisions:
- issue: Смысл фразы о царстве
  choice: царство разделяется
  alternative: царство распределяется или устрояется по частям
  rationale: Текст краток и труден; буквальное «разделяется» сохраняет неоднозначность и не навязывает определённой космологии.
