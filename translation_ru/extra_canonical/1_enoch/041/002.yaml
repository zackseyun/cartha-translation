base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/002.yaml
  text: There I saw the dwelling places of the sinners and the dwelling places of the holy ones[a]; and there my eyes saw all the sinners being driven away from there—those who deny the name of the Lord of Spirits—and they were being dragged off[d][c][b], and they could not stand because of the punishment that goes out from the Lord of Spirits.
translation:
  language: ru
  text: Там я увидел обиталища грешников и обиталища святых[a]. И там моим глазам предстали все грешники, которых изгоняли оттуда, — те, кто отрекается от имени Господа духов. Их уволакивали прочь, и они не могли устоять[b] перед карой, исходящей от Господа духов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Святые» здесь могут означать освящённых людей, небесных существ или тех и других; геэзский текст этого не уточняет. Одно и то же слово «обиталища» употреблено по отношению к обеим группам.
    reason: alternative_reading
  - marker: b
    text: 'Возможно также: «не могли оставаться» или «не было им места, где устоять».'
    reason: lexical_alternative
lexical_decisions:
- source_word: መኃድሪሆሙ
  choice: обиталища
  rationale: Передаёт конкретный пространственный образ мест пребывания; повтор существительного сохранён для обеих групп.
- source_word: ኃጥኣን
  choice: грешники
  rationale: Обычное нравственное обозначение, сохраняющее апокалиптическое противопоставление святым.
- source_word: ቅዱሳን
  choice: святые
  rationale: Широкое обозначение, не решающее без достаточных оснований, являются ли они освящёнными людьми, небесными существами или теми и другими.
- source_word: ይሰደዱ
  choice: которых изгоняли
  rationale: Передаёт продолжающееся насильственное удаление и судебный оттенок контекста.
- source_word: ይክሕድዎ ለስመ
  choice: кто отрекается от имени
  rationale: Сохраняет прямое упоминание имени и смысл отрицания либо отвержения, не сводя выражение к общему неверию.
- source_word: እግዚአ መናፍስት
  choice: Господь духов
  rationale: Устойчивый енохический божественный титул передан прозрачно и единообразно.
- source_word: ይስሐቡ
  choice: их уволакивали прочь
  rationale: Сохраняет яркий образ насильственного волочения и удаления.
- source_word: ቀዊመ አልቦሙ
  choice: они не могли устоять
  rationale: Естественно передаёт отсутствие способности стоять или выдержать, не вводя современного юридического смысла выражения «не иметь статуса/оснований».
- source_word: መቅሠፍት
  choice: кара
  rationale: Выражает наказание или губительное взыскание в сцене суда, не уточняя неопределённую форму бедствия.
- source_word: ትወጽእ እምእግዚአ መናፍስት
  choice: исходящей от Господа духов
  rationale: Сохраняет динамический образ кары, выходящей от божественного источника.
theological_decisions:
- issue: Кого обозначают «святые»
  choice: Оставлено широкое обозначение «святые» без уточнения их природы.
  alternative: «ангелы», «праведные», «освящённые»
  rationale: Геэзский текст не устанавливает однозначно, имеются ли в виду люди, небесные существа или обе группы; неоднозначность сохранена.
- issue: Смысл отречения от имени Господа духов
  choice: Сохранено выражение «отрекается от имени Господа духов».
  alternative: «отвергает Господа духов» или «не верит в Господа духов»
  rationale: В источнике прямо названо имя; это смысловое ударение не следует растворять в общем понятии неверия.
- issue: Связь невозможности устоять с карой
  choice: Передано «не могли устоять перед карой».
  alternative: «не могли оставаться из-за кары» или «не было им места, где устоять»
  rationale: Основной текст даёт наиболее естественный физический и апокалиптический смысл, а допустимая смысловая широта отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис сделан ясным, при этом сохранены повтор «обиталища», божественный титул и образ исходящей кары.
