base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/107/001.yaml
  text: And I saw written upon them that generation after generation will transgress[a], until a generation of righteousness arises, and iniquity is destroyed, and sin passes away from the earth[b], and every good thing comes upon it.
translation:
  language: ru
  text: 'И я увидел написанное на них: поколение за поколением будет грешить, пока не появится поколение праведности; беззаконие будет уничтожено, грех изгладится с лица земли, и на неё придёт всё благое.


    А теперь, сын мой, ступай и возвести своему сыну Ламеху, что этот родившийся младенец воистину его сын и это не ложь. Когда Мафусал услышал слова своего отца Еноха — тот тайно показал ему всё, — он, увидев его, вернулся и нарёк этого младенца Ноем, ибо тот утешит землю от всякой погибели.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽሑፈ፡ በላዕሌሆሙ
  choice: написанное о них
  rationale: Буквально сочетание допускает «написанное на них» или «о них». Без явного существительного в данном стихе русский вариант «о них» сохраняет местоименную отсылку и не вводит отсутствующие в тексте «скрижали».
- source_word: ትውልድ፡ እምትውልድ፡ ትኤብስ
  choice: поколение за поколением будет преступать закон
  rationale: Передаёт последовательность поколений и значение глагола как нравственного преступления; добавление «закон» делает русскую конструкцию естественной, не уточняя конкретную заповедь.
- source_word: ትውለደ፡ ጽድቅ
  choice: поколение праведности
  rationale: Сохранён семитский генитив и возможный смысл поколения, отмеченного праведностью, без замены на более узкое «праведное поколение».
- source_word: አበሳ
  choice: беззаконие
  rationale: Слово охватывает проступок, вину и неправду. «Беззаконие» естественно в эсхатологическом противопоставлении праведности, хотя «вина» также возможна.
- source_word: ትትለሐስ፡ እምዲበ፡ ምድር
  choice: изгладится с лица земли
  rationale: Глагольный образ связан со стиранием или слизыванием; идиоматическое «изгладится» сохраняет образ полного удаления без неестественной буквальности.
- source_word: አማን፡ ወኢኮነ፡ ሐሰተ
  choice: воистину его сын и в этом нет обмана
  rationale: Передано противопоставление истинности и ложности отцовства. Русская формулировка избегает двусмысленного «не ложь».
- source_word: ያስተፌሥሓ
  choice: утешит
  rationale: Каузативный глагол означает доставить радость, ободрить или утешить. «Утешит» сохраняет традиционную смысловую связь имени Ноя с его будущим служением, не превращая фразу в формальную этимологию.
- source_word: ሀጕል
  choice: погибель
  rationale: Слово может обозначать гибель, разорение или уничтожение. «Погибель» оставляет открытым как событие суда, так и его разрушительные последствия.
theological_decisions:
- issue: Эсхатологическая смена поколений
  choice: Сохранить будущее преступление поколений, восстание поколения праведности и последующее устранение зла
  alternative: Представить «поколение праведности» как отвлечённую эпоху или конкретную религиозную общину
  rationale: Исходный текст говорит именно о поколении и не отождествляет его с названной группой; перевод сохраняет обещание, не конкретизируя его конфессионально.
- issue: Подлинность происхождения младенца
  choice: «воистину его сын и в этом нет обмана»
  alternative: Объяснить необычный облик Ноя или прямо отрицать сверхъестественное отцовство
  rationale: В данном стихе утверждается подлинность сыновства, но основание тревоги Ламеха здесь не повторено. Перевод не привносит пояснений из контекста.
- issue: Предсказание о Ное
  choice: «он утешит землю после всей погибели»
  alternative: «он обрадует землю от всего разрушения»
  rationale: Формулировка сохраняет пророческую роль Ноя и неоднозначную связь предлога с погибелью, не утверждая, что Ной сам непосредственно устранит всякое разрушение.
- issue: Скрытое откровение Еноха Мафусалу
  choice: Сохранить вставное пояснение «ведь тот тайно показал ему всё происходящее»
  alternative: Отнести действие к иному субъекту или опустить трудную фразу
  rationale: Геэзский текст содержит это пояснение, хотя местоименные связи сжаты. Перевод сохраняет его и отмечает оставшуюся неоднозначность следующего местоимения в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Формы «ступай», «возвести», «нарёк» поддерживают достоинство древнего повествования, но текст избегает сплошной архаизации. Абзац разделён в месте перехода от видения к поручению Еноха.
