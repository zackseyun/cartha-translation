revisions:
- from: 'И я увидел написанное о них: поколение за поколением будет преступать закон, пока не восстанет поколение праведности; тогда беззаконие будет уничтожено, грех изгладится с лица земли и на неё придёт всё доброе.


    А теперь, сын мой, ступай и возвести своему сыну Ламеху, что этот родившийся младенец — воистину его сын и в этом нет обмана. Услышав слова своего отца Еноха, Мафусал — ведь тот тайно показал ему всё происходящее — вернулся, увидев его[a], и нарёк этого младенца Ноем, ибо он утешит землю после всей погибели[b].'
  to: 'И я увидел написанное на них: поколение за поколением будет грешить, пока не появится поколение праведности; беззаконие будет уничтожено, грех изгладится с лица земли, и на неё придёт всё благое.


