base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/004.yaml
  text: And these places were made for them to dwell in until the day of their judgment[a], and until their appointed time, and that appointed time is long[c][b], until the time of the great judgment upon them.
translation:
  language: ru
  text: И эти места были устроены[a], чтобы они обитали в них до дня суда над ними и до назначенного им срока[b]; срок этот долог[c] — до времени великого суда над ними.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Переданное словами «были устроены» слово в эфиопском тексте отмечено как текстуально не вполне надёжное. По смыслу речь идёт о местах, устроенных или предназначенных для их обитания до суда.
    reason: textual_variant
  - marker: b
    text: Слово, переведённое как «срок», может также означать «возраст», «время жизни» или «период». Здесь оно, вероятно, обозначает отведённое время до окончательного суда.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и срок этот велик». В данном контексте «велик» может характеризовать продолжительность срока, поэтому в тексте переведено «долог».'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: መካናት
  choice: места
  rationale: Широкое и нейтральное обозначение мест или обиталищ; оно соответствует пространственной образности видения, не добавляя лишней конкретики.
- source_word: ይነብርዎሙ
  choice: для их обитания
  rationale: Глагол обозначает пребывание или обитание. Именная конструкция естественна после «были устроены» и сохраняет мысль о длительном пребывании.
- source_word: እስከ ዕለተ ኵነኔሆሙ
  choice: до дня их суда
  rationale: «Суд» сохраняет судебно-эсхатологический смысл, не сужая его заранее до осуждения или приговора.
- source_word: አመ ዕድሜሆሙ
  choice: до назначенного им срока
  rationale: ዕድሜ может означать возраст, жизнь или срок; в данном контексте речь, вероятнее всего, идёт об отведённом периоде до окончательного суда.
- source_word: ዘየዓቢ
  choice: долог
  rationale: Буквально слово выражает величину («велик»), но применительно к сроку естественно указывает на его продолжительность. Возможная буквальная передача отмечена в сноске.
- source_word: ኵነኔ ዐቢይ በላዕሌሆሙ
  choice: великого суда над ними
  rationale: Передача сохраняет кульминационный образ эсхатологического суда, направленного на упомянутых существ, без добавления отсутствующего в источнике глагола «наступит».
- source_word: †ገብሩ†
  choice: были устроены
  rationale: Форма в данном свидетеле текстуально не вполне надёжна, однако контекст и синтаксис поддерживают смысл устроения или приготовления этих мест. Страдательная конструкция естественна по-русски и не уточняет действующее лицо.
theological_decisions:
- issue: Передача ኵነኔ как суда или как осуждения
  choice: суд
  alternative: осуждение; приговор
  rationale: Источник использует судебное понятие, но сам по себе термин не требует уточнять исход как осуждение. «Суд» сохраняет богословскую напряжённость и не вносит более узкого толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис сделан ясным для обычного читателя; при этом сохранены повтор «срок» и формула «великий суд», а текстуальная и лексическая неоднозначность вынесена в сноски.
