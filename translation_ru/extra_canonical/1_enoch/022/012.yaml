base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/012.yaml
  text: And thus a division has been made for the souls of those who make their complaint[d][c][b][a], who make known their destruction when they were slain in the days of the sinners.
translation:
  language: ru
  text: Итак, было произведено разделение для душ тех, кто взывает, жалуясь[a], кто сообщает о своей гибели[b], когда они были убиты во дни грешников.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто вопиёт», «кто сетует» или «кто приносит обвинительную жалобу». Глагол может выражать плач, жалобу или протест.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «кто делает известной свою гибель». Под «гибелью» здесь может подразумеваться именно насильственный конец.'
    reason: lexical_alternative
  - marker: c
    text: Стих продолжает описание разделения, предназначенного для умерших; контекст главы связывает его с убитыми и их жалобным воплем.
    reason: context
lexical_decisions:
- source_word: ተፈልጠ
  choice: было отделено место
  rationale: Пассивная форма обозначает отделение или обособление. Слово «место» подразумевается из контекста отделённых вместилищ для умерших и делает фразу естественной по-русски, не уточняя характер разделения сверх контекста.
- source_word: ለነፍሰ
  choice: для душ
  rationale: Предложное значение соответствует предназначению отделённого места; множественное число определяется последующими относительными конструкциями.
- source_word: እለ ይስክዩ
  choice: тех, кто взывает с жалобой
  rationale: Формулировка сохраняет одновременно оттенки плача, настойчивого вопля и жалобы-протеста, не сводя выражение исключительно к обвинению в судебном смысле.
- source_word: እለ ያርእዩ
  choice: кто возвещает
  rationale: Глагол означает «показывать, обнаруживать, делать известным». «Возвещает» передаёт открытое оглашение и уместно для возвышенного апокалиптического повествования.
- source_word: በእንተ ሕጉለት
  choice: о своей гибели
  rationale: Существительное допускает значения гибели, уничтожения и разорения. В контексте убитых «гибель» естественно обозначает их насильственный конец, не превращая этот оттенок в отдельное утверждение.
- source_word: አመ ተቀትሉ
  choice: когда они были убиты
  rationale: Сохранены временное значение и пассивная форма; «убиты» прямо передаёт насильственную смерть без дополнительной юридической квалификации.
- source_word: በመዋዕለ ኃጥኣን
  choice: во дни грешников
  rationale: Формула сохраняет временной смысл и характерный для апокалиптической речи нравственный контраст; оборот «во дни» поддерживает достойный библейский регистр и остаётся понятным современному читателю.
theological_decisions:
- issue: Являются ли слова душ общим плачем или обвинительной жалобой о пролитой крови
  choice: «взывает с жалобой» сохраняет и скорбь, и требование справедливости
  alternative: «плачет», «вопиёт» или «обвиняет»
  rationale: Контекст главы напоминает о крови убитого Авеля, которая вопиёт, однако сам глагол не требует ограничивать смысл формальным обвинением. Выбранная формулировка сохраняет богословское напряжение между плачем и призывом к суду.
- issue: Относится ли «гибель» к уничтожению вообще или именно к насильственной смерти
  choice: В основном тексте сохранено широкое слово «гибель», а связь с убийством выражена следующей частью предложения
  alternative: «насильственная смерть»
  rationale: Так перевод следует последовательности исходного текста и не вносит уточнение раньше, чем это делает фраза «когда они были убиты».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Обороты «возвещает» и «во дни» поддерживают достоинство стиля, но синтаксис остаётся ясным. Неоднозначность жалобы как плача и как обвинительного протеста сохранена в основном тексте и пояснена в сноске.
