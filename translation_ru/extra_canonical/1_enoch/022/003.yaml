base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/003.yaml
  text: 'And at that time Raphael[a], one of the holy angels who was with me, answered and said to me, “These hollow places were made so that the spirits, the souls of the dead, might be gathered into them[c][b]. For this purpose they were created here: that they might gather all the souls of the children of men.”'
translation:
  language: ru
  text: 'И тогда Рафаил, один из святых ангелов, находившийся со мной, ответил и сказал мне: «Эти прекрасные места[a] предназначены для того, чтобы в них собирались духи — души умерших[b]. Для этого они и были созданы здесь — чтобы собирать все души сынов человеческих».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по эфиопскому тексту: «прекрасные» или «хорошие места». Вероятное греческое чтение — «полые места» или «углубления»; оно лучше согласуется с описанием окружающих впадин.'
    reason: textual_variant
  - marker: b
    text: В тексте употреблены оба слова — «духи» и «души»; вероятнее всего, второе выражение поясняет первое, а не обозначает отдельную категорию.
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ
  choice: ответил
  rationale: Глагол вводит ответ в повествовательном диалоге; сочетание «ответил и сказал» сохраняет форму исходного текста.
- source_word: ቅዱሳን መላእክት
  choice: святых ангелов
  rationale: Устойчивое апокалиптическое обозначение, естественное и богословски нейтральное по-русски.
- source_word: ዝመካናት
  choice: эти ... места
  rationale: Общее обозначение мест не навязывает более конкретного архитектурного образа.
- source_word: ሰናያት
  choice: прекрасные
  rationale: Эфиопское прилагательное означает «хорошие, прекрасные, приятные»; основной текст следует непосредственно засвидетельствованному чтению, а контекстуальное греческое чтение отмечено в сноске.
- source_word: ይትጋብኡ
  choice: собирались
  rationale: Возвратно-пассивная форма естественно передаёт помещение духов в назначенные для них места.
- source_word: ዲቤሆን
  choice: в них
  rationale: В контексте мест, принимающих умерших, русское «в них» естественно выражает направленность внутрь, не перегружая фразу.
- source_word: መናፍስት ለነፍሶሙ ለምዉታን
  choice: духи — души умерших
  rationale: Сохранены оба антропологических термина, представленные как поясняющее приложение, без превращения их в две явно различные категории.
- source_word: ሎቱ ዝንቱ
  choice: для этого
  rationale: Передаёт целевое значение выражения в естественной современной русской форме.
- source_word: ተፈጥሩ
  choice: были созданы
  rationale: Сохраняет явный глагол сотворения или устроения и представление о целевом назначении мест.
- source_word: ያስተጋብኡ
  choice: собирать
  rationale: Передаёт каузативное значение повторного глагола и сохраняет мотив собирания.
- source_word: ኵሎ ነፍሰ ውሉደ ሰብእ
  choice: все души сынов человеческих
  rationale: Сохраняет собирательность и традиционную древнюю формулу, оставаясь понятным современному читателю.
theological_decisions:
- issue: Соотношение «духов» и «душ умерших»
  choice: 'Передать оба выражения как приложение: «духи — души умерших»'
  alternative: Понять их как две различные категории либо опустить один из близких терминов
  rationale: В эфиопском тексте употреблены оба слова; тире сохраняет понятийную напряжённость и позволяет второму выражению пояснять первое, не утверждая жёсткого различия.
- issue: Объём выражения «сыны человеческие»
  choice: Сохранить формулу «сыны человеческие»
  alternative: 'Передать обобщённо: «люди» или «человечество»'
  rationale: Формула характерна для древней апокалиптической речи и здесь понятна без конфессионального истолкования.
- issue: Чтение определения мест
  choice: 'Следовать эфиопскому ሰናያት: «прекрасные»'
  alternative: 'Принять реконструируемое греческое чтение κοῖλοι: «полые, углублённые»'
  rationale: Предоставленный оригинал на геэзе прямо свидетельствует значение «прекрасные/хорошие». Вероятная греческая текстовая основа и согласованность с контекстом важны, но не оправдывают молчаливой замены чтения; вариант вынесен в сноску.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования. Сохранены формульное «ответил и сказал», древняя антропологическая формула «сыны человеческие» и повтор мотива собирания; текстологическая неоднозначность не устранена молча.
