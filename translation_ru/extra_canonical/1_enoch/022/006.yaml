base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/006.yaml
  text: At that time I asked Raphael[a], the angel who was with me, and I said to him[c][b], “This spirit whose voice reaches thus and accuses—to whom does it belong?”
translation:
  language: ru
  text: 'В то время я спросил Рафаила, ангела, который был со мной, и сказал ему: «Чей это дух, голос которого так доносится и обвиняет[a]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «…голос которого так доносится и взывает с жалобой». Последний глагол имеет судебный оттенок и может обозначать обвинение или настойчивую жалобу; в следующем стихе этот дух назван духом Авеля.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ውእቱ፡ ጊዜ
  choice: В то время
  rationale: Передаёт обычную повествовательную формулу времени и сохраняет возвышенный, но современный регистр.
- source_word: ተስእልክዎ
  choice: я спросил
  rationale: Прямой и естественный русский эквивалент глагола, вводящего вопрос Еноха.
- source_word: ለሩፋኤል፡ መልአክ
  choice: Рафаила, ангела
  rationale: Сохраняет аппозитивную конструкцию источника; имя передано в принятой русской форме.
- source_word: እንዘ፡ ሀሎ፡ ምስሌየ
  choice: который был со мной
  rationale: Естественно передаёт сопутствующую конструкцию и указывает на Рафаила как на находящегося рядом ангела-проводника.
- source_word: ዝመንፈስ
  choice: это дух
  rationale: «Дух» является прямым соответствием መንፈስ и не вносит более поздней антропологической конкретизации, связанной со словом «душа».
- source_word: ዘመኑ
  choice: чей это дух
  rationale: Передаёт вопрос о принадлежности, то есть об отождествлении услышанного духа, естественной русской вопросительной конструкцией.
- source_word: ዘከመዝ፡ ቃሉ፡ ይበጽሕ
  choice: чей голос так доносится
  rationale: ቃል в контексте означает слышимый голос, а ይበጽሕ — его достижение до слушателя; «доносится» идиоматично выражает это по-русски.
- source_word: ወይሰኪ
  choice: и обвиняет
  rationale: Сохраняет судебно-обличительный смысл глагола ሰከየ и его связь с жалобой Авеля на Каина, не ослабляя значение до общей просьбы.
theological_decisions:
- issue: Передача መንፈስ в сцене пребывания умерших
  choice: дух
  alternative: душа
  rationale: «Дух» ближе к исходному термину и сохраняет антропологическую неопределённость апокалиптического видения.
- issue: Характер возгласа духа в последнем глаголе
  choice: обвиняет
  alternative: взывает / просит / подаёт жалобу
  rationale: Контекст следующего стиха отождествляет говорящего с Авелем, чей вопль направлен против Каина; судебный оттенок исходного глагола лучше сохраняется словом «обвиняет».
- issue: К кому относится вопрос о принадлежности
  choice: Чей это дух
  alternative: Кому принадлежит этот дух
  rationale: Краткая русская форма естественна и сохраняет вопрос об идентичности духа без пояснительного расширения.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис сделан естественным для русского текста, при этом сохранены повтор «чей» и судебная напряжённость последнего глагола.
