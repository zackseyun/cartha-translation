base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/005.yaml
  text: And I saw the spirits of the children of men who were dead[b][a], and their voice reached to heaven and cried out.
translation:
  language: ru
  text: И увидел я духов сынов человеческих, которые умерли, и голос их достиг неба, и они взывали.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и голос их достиг неба с жалобой»; возможны также значения «они обвиняли» или «обращались с прошением». Значение последнего глагола не вполне ясно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ
  choice: увидел я
  rationale: Простой глагол видения в первом лице; порядок слов поддерживает возвышенный повествовательный строй, оставаясь естественным по-русски.
- source_word: መናፍስተ
  choice: духов
  rationale: Передаёт апокалиптическую антропологию исходного текста без более истолковывающего «душ».
- source_word: ውሉደ ሰብእ
  choice: сынов человеческих
  rationale: Сохраняет семитизированное собирательное обозначение людей и высокий регистр; контекст не предполагает титульного употребления в единственном числе.
- source_word: እንዘ ሙታን ውእቶሙ
  choice: которые умерли
  rationale: Естественно по-русски определяет тех людей, чьи духи явились Еноху, сохраняя прямое указание на их смерть.
- source_word: ቃሎሙ
  choice: голос их
  rationale: Сохраняет основное значение «голос», не подменяя его уже в существительном толкованием «жалоба» или «вопль».
- source_word: ይበጽሕ እስከ ሰማይ
  choice: достиг неба
  rationale: Передаёт вертикальный образ голоса, доходящего до неба, кратко и естественно.
- source_word: ወይስኪ
  choice: они взывали
  rationale: Передаёт настойчивое обращение к небу, не решая однозначно, было ли оно жалобой, обвинением или прошением; смена подлежащего делает русскую фразу ясной.
theological_decisions:
- issue: Характер речи умерших, восходящей к небу
  choice: Духи умерших представлены сознающими и взывающими к небу, но юридический характер их речи не уточняется в основном тексте.
  alternative: Перевести как «жаловались», «обвиняли» или «обращались с прошением».
  rationale: Сочетание духов, голоса, достигающего неба, и трудного конечного глагола указывает на настойчивое обращение ради ответа или справедливости, однако не позволяет безоговорочно выбрать между жалобой, обвинением и прошением. Более широкие вопросы о состоянии умерших текстом здесь не разрешаются.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Формула «сыны человеческие» намеренно сохранена как характерный семитизированный оборот; архаизмы и конфессионально окрашенная терминология не вводятся.
