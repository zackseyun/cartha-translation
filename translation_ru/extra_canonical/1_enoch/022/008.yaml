  text: 'And at that time I asked concerning him and concerning the judgment of all: for what reason were they separated[c][b][a], one from another?'
translation:
  language: ru
  text: 'И тогда я спросил о нём и о суде над всеми: по какой причине они были отделены друг от друга?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውእተ፡ ጊዜ
  choice: тогда
  rationale: Естественно передаёт повествовательную временную формулу, сохраняя последовательность видения без излишней тяжеловесности.
- source_word: ተስእልኩ
  choice: я спросил
  rationale: Прямое и ясное соответствие форме первого лица прошедшего времени со значением вопроса или расспроса.
- source_word: በእንቲአሁ
  choice: о нём
  rationale: Суффикс имеет форму мужского рода единственного числа; вероятный референт — дух Авеля из предшествующего контекста. Это чтение также согласуется с греческим свидетельством περὶ αὐτοῦ.
- source_word: በእንተ
  choice: о
  rationale: Повторный предлог вводит второй предмет вопроса и естественно передаётся нейтральным русским «о».
- source_word: ኵነኔ፡ ኵሉ
  choice: суде над всеми
  rationale: «Суд» сохраняет широкое судебное значение существительного и не сужает его до наказания или осуждения; сочетание «над всеми» естественно выражает всеобщий охват.
- source_word: በእንተ፡ ምንት
  choice: по какой причине
  rationale: Передаёт вопрос об основании разделения в несколько возвышенном, но современном русском регистре.
- source_word: ተፈልጡ
  choice: они отделены
  rationale: Пассивное значение сохраняет пространственное и судебное различение групп или мест, не уточняя деятеля.
- source_word: ፩እምነ፡ ፩
  choice: друг от друга
  rationale: Современный русский взаимный оборот точно передаёт разделение одного от другого.
theological_decisions:
- issue: Объём значения ኵነኔ в выражении «суд над всеми»
  choice: суд над всеми
  alternative: наказание всех; приговор всем
  rationale: Исходное слово допускает широкое судебное значение. «Суд» сохраняет возможность как оправдания, так и осуждения и не разрешает преждевременно богословское напряжение текста.
- issue: Референт местоименного суффикса в በእንቲአሁ
  choice: о нём
  alternative: о них; об этом
  rationale: Форма суффикса — мужской род, единственное число; ближайшим вероятным референтом служит дух Авеля. Перевод не заменяет это грамматическое свидетельство множественным числом.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис сделан ясным для обычного читателя; формальная связь двух тем вопроса и судебная неоднозначность исходного текста сохранены.
