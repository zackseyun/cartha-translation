base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/007.yaml
  text: And he answered me and said to me[a], “This is the spirit that came out from Abel, whom Qayin his brother killed; and it makes accusation against him until his seed is destroyed from before the face of the earth[d][c][b], and his seed is blotted out from among the seed of men.”
translation:
  language: ru
  text: 'И он ответил мне и сказал мне[a]: «Это дух, вышедший из Авеля, которого убил его брат Каин. Он обвиняет его[b] до тех пор, пока семя его не будет истреблено с лица земли и семя его не будет изглажено среди потомков человеческих[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В данной форме текста вступление к речи содержит оба выражения — «ответил мне» и заключённое издателем в скобки «сказал мне». Перевод сохраняет оба.
    reason: textual_variant
  - marker: b
    text: 'Или: «предъявляет обвинение против него». Здесь подразумевается продолжающееся судебное обвинение, а не просто рассказ о причинённой обиде.'
    reason: lexical_alternative
  - marker: c
    text: Слово «семя» повторено в исходном тексте и обозначает потомство, родовую линию. Последнее выражение буквально близко к «среди семени людей»; «среди потомков человеческих» передаёт этот смысл естественным русским языком.
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ / ወይቤለኒ
  choice: ответил мне и сказал мне
  rationale: Переданы оба глагола и выраженный при втором глаголе объект первого лица. Повторение несколько торжественно, но сохраняет полученную форму текста; вариантность отмечена сноской.
- source_word: መንፈስ
  choice: дух
  rationale: В контексте видения речь идёт о посмертно существующем духе Авеля, а не о ветре или дыхании.
- source_word: ዘወጽአ እምአቤል
  choice: вышедший из Авеля
  rationale: Сохранён конкретный и необычный образ исхождения духа из Авеля; перевод не заменяет его более истолковывающим выражением.
- source_word: ዘቀተሎ ቃየን እኁሁ
  choice: которого убил его брат Каин
  rationale: Естественный русский порядок слов ясно указывает, что Каин — брат Авеля. Имя дано в общепринятой русской библейской форме.
- source_word: ይሰኪ ኪያሁ
  choice: обвиняет его
  rationale: Глагол передаёт продолжающееся обвинение, направленное против Каина; временная протяжённость выражена оборотом «до тех пор, пока».
- source_word: ይትኀጐል ዘርኡ / ይማስን ዘርኡ
  choice: семя его не будет истреблено / семя его не будет изглажено
  rationale: Дважды сохранено «семя», чтобы передать повтор и родовую направленность суда; разные глаголы отражают параллельное усиление исходного текста.
- source_word: እምቅድመ ገጸ ለምድር
  choice: с лица земли
  rationale: Это устойчивый и понятный русский библейский оборот, точно передающий смысл исходного семитизированного выражения без неестественного калькирования.
- source_word: እምዘርአ ሰብእ
  choice: из среды рода человеческого
  rationale: Передаёт удаление из человеческого потомства. Буквальное «из семени людей» по-русски здесь чрезмерно неясно; повтор ключевого слова «семя» уже сохранён в обеих главных клаузах.
theological_decisions:
- issue: Обозначение посмертного присутствия Авеля
  choice: дух
  alternative: душа; голос; тень
  rationale: Эфиопский текст прямо употребляет መንፈስ. «Дух» сохраняет антропологическую и апокалиптическую напряжённость текста, не сводя образ к одному лишь голосу крови.
- issue: Характер действия духа Авеля
  choice: обвиняет его
  alternative: жалуется на него; взывает против него; предъявляет ему обвинение
  rationale: Выбрана ясная судебная формулировка. Она не уточняет, кому именно обращено обвинение, поскольку источник этого не называет.
- issue: Суд над линией Каина
  choice: семя его не будет истреблено… семя его не будет изглажено
  alternative: его потомки погибнут; его род пресечётся
  rationale: Сохранение двукратного «семя» удерживает корпоративный и родословный характер суда и не сводит его к общей мысли о смерти отдельных потомков.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейско-апокалиптическим звучанием. Необычный образ «дух, вышедший из Авеля» и повтор слова «семя» сохранены намеренно; громоздкие буквальные кальки смягчены там, где они мешали бы ясности.
