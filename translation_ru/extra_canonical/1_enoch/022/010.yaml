base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/010.yaml
  text: And so it was made for sinners[a], when they die and are buried in the earth[c][b], and judgment has not come upon them during their lifetime.
translation:
  language: ru
  text: 'И так было создано для грешников[a][b]: когда они умирают и их погребают в земле, и суд не постиг их при жизни.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальные слова «И так» отсылают к предшествующему описанию разделённых мест пребывания умерших и указывают на соответствующий ему случай.
    reason: cross_reference
  - marker: b
    text: 'Возможен также перевод: «было устроено». Подлежащее глагола в этом стихе не названо; подразумеваемое место или иной созданный удел определяется из контекста.'
    reason: lexical_alternative
  - marker: c
    text: 'Возможна и иная синтаксическая связь: «И так было создано для грешников, когда они умирают и их погребают в земле и суд не постиг их при жизни». Двоеточие в основном тексте показывает, что последующие слова описывают, о каких грешниках идёт речь.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: በከመ፡ ከማሁ
  choice: И так же
  rationale: Парные сравнительные частицы связывают высказывание с предшествующим описанием и указывают на соответствие ему. «И так же» сохраняет и связь, и сравнительный оттенок.
- source_word: ተፈጥረ
  choice: было устроено
  rationale: Пассивный перфект обозначает уже установленное устройство или порядок. «Было устроено» естественно по-русски и не вынуждает понимать глагол исключительно как указание на первоначальное сотворение.
- source_word: ለኃጥኣን
  choice: для грешников
  rationale: Дательный оборот прямо обозначает тех, для кого предназначено описываемое устройство; «грешники» соответствует лексике контекста суда.
- source_word: ሶበ፡ ይመውቱ፡ ወይትቀበሩ
  choice: когда они умирают и бывают погребены
  rationale: Перевод сохраняет временное придаточное и пассивную форму второго глагола.
- source_word: ውስተ፡ ምድር
  choice: в земле
  rationale: В контексте погребения это прямой и естественный перевод, сохраняющий образ пребывания внутри земли.
- source_word: ወኵነኔ፡ ኢኮነ፡ በላዕሌሆሙ
  choice: а суд не постиг их
  rationale: Фраза говорит о суде, который не совершился над этими людьми при их жизни. Глагол «постиг» естественно передаёт наступление суда, не подменяя его прямо осуждением.
- source_word: በሕይወቶሙ
  choice: при жизни
  rationale: Краткий современный оборот точно выражает временное противопоставление земной жизни посмертному состоянию.
theological_decisions:
- issue: Характер посмертного удела грешников
  choice: Стих говорит об устроенном для грешников посмертном порядке, если суд не постиг их при жизни, но не определяет здесь окончательность или точную природу их участи.
  alternative: Понять фразу как прямое утверждение, что особое место было сотворено именно для грешников.
  rationale: Подлежащее при пассивном глаголе в стихе прямо не названо и восстанавливается из предыдущего контекста. Поэтому перевод не вводит слово «место» и не уточняет метафизику посмертной участи сверх сказанного.
- issue: Значение слова ኵነኔ
  choice: суд
  alternative: осуждение
  rationale: «Суд» сохраняет более широкое судебное значение и не предрешает, обозначает ли слово здесь сам судебный акт или непременно обвинительный приговор.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Сохранены краткость, судебная лексика и зависимость неназванного предмета от предыдущего контекста; устранены ненужные архаизмы и конфессионально нагруженные уточнения.
