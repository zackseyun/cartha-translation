base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/002.yaml
  text: And there were four hollow places in it[a], deep and wide and very smooth; three of them were dark, and one was bright, and water was springing up in its midst. And I said, “How smooth these hollow places are[c][b], and deep and dark to look at.”
translation:
  language: ru
  text: 'И были в ней четыре полости — глубокие, широкие и очень гладкие[a]. Три из них были тёмными, а одна — светлой, и в её середине била вода[b]. И я сказал: «Как гладки эти полости — глубокие и мрачные на вид!»[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфиопский текст этого стиха в нескольких местах труден, особенно при описании полостей как «гладких». Возможно, имеются в виду отвесные или словно отполированные поверхности.
    reason: lexical_alternative
  - marker: b
    text: Фразу о воде можно также понять как указание на источник или поток, находившийся посреди светлой полости; не исключено и отнесение слов «в её середине» ко всему описанному месту.
    reason: alternative_reading
  - marker: c
    text: 'Возможный перевод: «Как глубоки и очень гладки эти полости».'
    reason: previous_rendering
lexical_decisions:
- source_word: አርባዕቱ፡ መካናት
  choice: четыре полости
  rationale: መካናት буквально обозначает места, но в описании внутренности скалы речь идёт об углублениях или вместилищах. «Полости» передаёт пространственный образ без уточняющего толкования «камеры».
- source_word: ዕሙቀ፡ ወርኂበ፡ ወልሙጸ፡ ጥቀ
  choice: глубокие, широкие и очень гладкие
  rationale: 'Переведены все три отдельных признака: глубина, ширина и гладкость; ጥቀ передано усилителем «очень» при последнем прилагательном.'
- source_word: ልሙጸ / ልሙጽ
  choice: гладкие / гладки
  rationale: Слово может указывать на гладкую, скользкую или отполированную поверхность. «Гладкие» сохраняет конкретный зрительный образ и не навязывает более узкого понимания.
- source_word: ጸልማት / ብርህት
  choice: тёмными / светлой
  rationale: Прямая и естественная по-русски передача зрительного контраста между тремя полостями и одной полостью.
- source_word: ነቅዐ፡ ማይ
  choice: пробивалась вода
  rationale: Выражение изображает воду, выходящую наружу или бьющую из источника. Глагольная формулировка сохраняет движение воды, не превращая её однозначно в отдельный «источник».
- source_word: በማእከላ
  choice: посреди неё
  rationale: Местоимение сохраняет анафорическую неопределённость оригинала; по ближайшему контексту оно естественно соотносится со светлой полостью.
- source_word: ለነጽሮ
  choice: на вид
  rationale: Краткая современная русская формула естественно передаёт зрительное восприятие описанных полостей.
theological_decisions:
- issue: Формула реакции провидца после описания
  choice: И я сказал
  alternative: И я увидел; либо восклицание без вводной формулы
  rationale: Форма እቤ поддерживает речь от первого лица. Сохранение формулы передаёт структуру апокалиптического рассказа и активную реакцию провидца.
- issue: К какой полости относится вода
  choice: по грамматическому контексту — к одной светлой полости, но с пояснением неоднозначности
  alternative: вода находится среди всех четырёх полостей
  rationale: Ближайший антецедент — одна светлая полость, однако устройство фразы допускает более широкое пространственное отнесение; это отмечено в сноске, а не разрешено догматически.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном повествования. Синтаксис остаётся ясным для обычного читателя; повтор «как» сохраняет характер непосредственного восклицания. Все примечания отмечены в основном тексте.
