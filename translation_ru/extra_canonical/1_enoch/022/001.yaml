base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/001.yaml
  text: And from there I went to another place[a], and he showed me in the west a great and high mountain[b], and a hard rock.
translation:
  language: ru
  text: И оттуда я пошёл в другое место, и он показал мне на западе великую и высокую гору[a] и твёрдую скалу[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально сохраняются два определения горы: «великая и высокая».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «крепкую скалу», «прочную скалу».'
    reason: lexical_alternative
lexical_decisions:
- source_word: እምህየ
  choice: оттуда
  rationale: Передаёт пространственный переход от предыдущего места видения кратко и естественно.
- source_word: ሖርኩ
  choice: я пошёл
  rationale: Сохраняет простое повествовательное обозначение движения от первого лица, не добавляя оттенка длительного путешествия.
- source_word: ካልአ መካነ
  choice: в другое место
  rationale: Естественно обозначает место, отличное от предыдущего; «второе место» было бы излишне нумерующим.
- source_word: አርአየኒ
  choice: он показал мне
  rationale: Точно передаёт каузативное значение видения и не уточняет личность проводника сверх сказанного в тексте.
- source_word: በምዕራብ
  choice: на западе
  rationale: Нормальная русская передача локативного указания в описании пространства видения.
- source_word: ደብረ ዐቢየ ወነዋኅ
  choice: великую и высокую гору
  rationale: Сохраняет оба самостоятельных признака горы — величие и высоту — не сводя их к одному определению.
- source_word: ኵኵሐ ጽኑዐ
  choice: твёрдую скалу
  rationale: «Скала» соответствует образу каменной массы, а «твёрдую» сохраняет значение прочности и плотности; возможны также оттенки крепости или массивности.
theological_decisions:
- issue: Следует ли прямо назвать показывающего ангелом
  choice: Сохранить местоименное «он показал мне» без уточнения личности.
  alternative: «ангел показал мне» или «мой проводник показал мне»
  rationale: В самом стихе субъект выражен лишь формой третьего лица мужского рода. Контекст может подразумевать ангельского проводника, но добавлять это существительное в основной текст не следует.
translation_notes:
  register: Современный литературный русский язык с прямым, сдержанным повествовательным ритмом. Начальное «И» сохранено как связка с предыдущим видением. Повтор союза отражает последовательность исходного текста, не утяжеляя фразу.
