base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/009.yaml
  text: And he answered me and said to me[a], “These three have been made so that the spirits of the dead might be separated. And thus a division has been made for the spirits of the righteous, where there is a spring of water[e][d][c][b], with light above it.”
translation:
  language: ru
  text: 'И он ответил мне и сказал: «Эти три отделения[a] были устроены, чтобы духи умерших были отделены. И так для духов праведных было отделено место, где есть источник воды[b], а над ним — свет[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «эти три были устроены». Слово «отделения», как и «место» далее, подразумевается по контексту описанных выше полостей.'
    reason: implicit_context
  - marker: b
    text: 'Или: «родник воды», «водный источник».'
    reason: lexical_alternative
  - marker: c
    text: Краткая фраза оригинала может означать, что свет находится над источником либо над всем местом, отведённым праведным.
    reason: alternative_reading
lexical_decisions:
- source_word: ፫ትገብሩ
  choice: эти три отделения были устроены
  rationale: Форма сочетает числительное «три» с пассивным значением глагола «делать, устраивать». Существительное «отделения» восполняется из ближайшего контекста главы и делает фразу естественной по-русски; добавление отмечено сноской.
- source_word: ይትፈለጠ / ተፈልጠ
  choice: были отделены / было отделено
  rationale: Повтор одного корня сохранён, поскольку он связывает назначение трёх отделений с особым местом праведных.
- source_word: መንፈሶሙ
  choice: духи
  rationale: Прямое соответствие исходному антропологическому термину; вариант «души» возможен, но менее точно передаёт повторяющееся слово в данном видении.
- source_word: ምዉታን
  choice: умершие
  rationale: Современное и нейтральное обозначение умерших людей; в родительном сочетании «духи умерших» звучит естественно.
- source_word: ጻድቃን
  choice: праведные
  rationale: Устоявшееся и контекстуально точное обозначение нравственно оправданной группы в сцене посмертного суда.
- source_word: ነቅዐ ማይ
  choice: источник воды
  rationale: Передаёт конкретный образ водного источника, не уточняя без необходимости, является ли он родником или фонтаном.
- source_word: በላዕሌሁ ብርሃን
  choice: а над ним — свет
  rationale: Сохраняет краткость и образность геэзской фразы. Местоименная связь с источником наиболее естественна по-русски, однако возможна отнесённость ко всему отделению, что отмечено в сноске.
theological_decisions:
- issue: Антропологическое обозначение умерших
  choice: духи умерших
  alternative: души умерших
  rationale: Выбор следует исходному መንፈስ и не подменяет собственный язык видения более привычной поздней терминологией.
- issue: Характер места праведных
  choice: для духов праведных было отделено место, отмеченное источником воды и светом
  alternative: праведные сами составляют третье отделение; либо описание источника и света не имеет пространственного смысла
  rationale: Контекст и синтаксис указывают на обособленное место для праведных, но перевод не развивает образ в догматическую схему загробного мира.
- issue: Повтор глагола разделения
  choice: сохранить формами «были отделены» и «было отделено»
  alternative: передать вторую форму существительным «было создано отделение»
  rationale: Геэзский текст намеренно повторяет один корень; сохранение повтора удерживает смысловую и богословскую напряжённость текста.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Сохранены повтор глагола разделения, пространственная образность и лаконичность заключительной фразы; тяжеловесное «ответил мне и сказал мне» слегка упрощено до естественного «ответил мне и сказал» без потери содержания.
