    issue: Неоднозначное управление в выражении «возмездия их душам».
    rationale: Русский дательный «их душам» обычно обозначает адресата/выгодоприобретателя, а не объект карательного возмездия. «Возмездия над их душами» передаёт судебно-направленное значение, сохраняя именную конструкцию оригинала.
  - severity: low
    issue: Сочетание «души отделены в ... мучении» синтаксически и семантически шероховато.
    rationale: Добавление «пребывают» ясно связывает отделённое состояние с местом или состоянием страдания, не называя его окончательным наказанием и не добавляя действующего лица.
