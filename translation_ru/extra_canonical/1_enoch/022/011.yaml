base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/011.yaml
  text: Here their souls are set apart in this great affliction until the great day of judgment and punishment and affliction for those who curse forever; and vengeance on their souls. There he will bind them forever.
translation:
  language: ru
  text: Здесь их души отделены и пребывают в этом великом мучении до великого дня суда, наказания и мучения для тех, кто проклят навеки[a], и возмездия над их душами. Там он свяжет их навеки.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «кто проклинает вовеки», если понимать глагол в активном значении; контекст суда лучше поддерживает пассивное значение.'
    reason: lexical_alternative
  - marker: b
    text: 'В рукописном свидетельстве далее стоит заключённая в скобки фраза: «и это было прежде мира»; текст неясен, поэтому она не включена в основной перевод.'
    reason: textual_variant
lexical_decisions:
- source_word: ይትፈለጠ
  choice: отделены
  rationale: Передаёт пассивно-возвратный смысл отделения душ в особое место или состояние, не уточняя сверх текста, кем или каким образом это совершено.
- source_word: ነፍሳቲሆሙ
  choice: их души
  rationale: В контексте пребывания умерших до суда слово обозначает души умерших; вариант «духи» возможен, но менее прям.
- source_word: ዐቢይ ጻዕር
  choice: великое мучение
  rationale: ጻዕር обозначает страдание, муку или бедствие. «Мучение» ясно выражает реальность страдания, не превращая его в уже окончательное наказание.
- source_word: ኵነኔ
  choice: суд
  rationale: Широкий и естественный судебный термин, сохраняющий отличие суда от следующего за ним наказания.
- source_word: መቅሠፍት
  choice: наказание
  rationale: В апокалиптическом судебном перечислении слово указывает на карательное последствие, хотя буквально может обозначать также удар или поражение.
- source_word: ይረግሙ
  choice: кто проклят
  rationale: Пассивное понимание лучше соответствует контексту грядущего суда; возможное активное понимание «кто проклинает» сохранено в сноске.
- source_word: በቀል ለነፍሶሙ
  choice: возмездия их душам
  rationale: Сохранена именная конструкция, продолжающая перечень того, что принесёт великий день; не добавлен отсутствующий здесь отдельный глагол «совершит».
- source_word: ይእስሮሙ
  choice: он свяжет их
  rationale: Сохраняет конкретный образ связывания и неопределённого в данном стихе действующего субъекта мужского рода.
- source_word: እስከ ለዓለም
  choice: навеки
  rationale: Естественно и торжественно передаёт устойчивое обозначение непреходящей длительности.
theological_decisions:
- issue: Описывает ли стих лишь отдельное содержание душ или уже их страдание до последнего суда
  choice: Сохранены одновременно отделение душ и их пребывание «в великом мучении» до великого дня.
  alternative: Понять место как нейтральное ожидание суда либо как уже окончательное наказание.
  rationale: Текст соединяет лексику отделения с ጻዕር, то есть мучением или страданием; перевод не устраняет это напряжение.
- issue: К кому относится ይረግሙ
  choice: 'Основной текст передаёт пассивно: «кто проклят навеки».'
  alternative: 'Активное понимание: «кто проклинает вовеки».'
  rationale: Пассивное значение согласуется с контекстом суда, но форма допускает обсуждаемое активное прочтение, отмеченное в сноске.
- issue: Кто свяжет осуждённых
  choice: Сохранено неназванное «он».
  alternative: «Бог свяжет их» или безличное «они будут связаны».
  rationale: Глагольная форма указывает на единственного действующего субъекта, однако данный стих прямо его не называет.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Синтаксис перечисления сохранён, но оформлен естественно для русского; богословски уточняющие добавления не внесены.
