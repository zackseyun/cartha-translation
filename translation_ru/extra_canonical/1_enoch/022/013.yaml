base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/013.yaml
  text: And thus it has been made for the souls of the people who are not righteous[a], but sinners, who are complete in transgression, and they will be with the lawless like them[d][c][b]. But as for their souls...
translation:
  language: ru
  text: Итак, так было устроено[a] для душ людей[b], которые не являются праведниками, а грешниками, всецело предавшимися преступлению; они будут с беззаконниками, подобными им[c]. Что же до их душ…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «было создано», «было приготовлено» или «было назначено». Здесь речь, по-видимому, идёт о месте или уделе, устроенном для душ умерших.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально также возможно: «для душ человеческих»; традиционный вариант — «для душ сынов человеческих».'
    reason: alternative_reading
  - marker: c
    text: Конец фразы неясен. Его можно понять как «они будут с беззаконниками», «они будут подобны им» либо как сочетание обеих мыслей.
    reason: alternative_reading
lexical_decisions:
- source_word: ተፈጥረ
  choice: было устроено
  rationale: Глагол допускает значения «создано», «сделано», «приготовлено» или «назначено». В контексте мест, отведённых душам умерших, «было устроено» естественно передаёт учреждение или приготовление удела, не сводя значение только к назначению.
- source_word: ለነፍሶሙ ለሰብእ
  choice: для душ людей
  rationale: Предлог ለ- обозначает предназначение для душ; ሰብእ здесь является общим обозначением людей, без необходимости вводить архаичное «сыны человеческие».
- source_word: ኢኮኑ ጻድቃነ አላ ኃጥኣነ
  choice: которые не праведники, а грешники
  rationale: Сохранено прямое противопоставление двух важных для книги нравственных категорий — праведников и грешников.
- source_word: ፍጹማነ እበሳ
  choice: полные преступления
  rationale: ፍጹማነ выражает полноту или завершённость, а እበሳ — проступок, вину или преступление. Формулировка сохраняет усилительный смысл без добавления конкретной формы наказания.
- source_word: አባሲያን
  choice: беззаконники
  rationale: Слово обозначает нечестивых или преступающих закон; «беззаконники» сохраняет судебно-апокалиптический оттенок и отличается от предшествующего «грешники».
- source_word: ምስለ አባሲያን ይከውኑ ከማሆሙ
  choice: будут с беззаконниками — как они
  rationale: Сжатая конструкция допускает связь как со совместным пребыванием, так и с уподоблением. Тире и краткая формула сохраняют эту неясность, не уточняя незасвидетельствованную участь.
- source_word: ወነፍሶሙሰ
  choice: Что же до их душ…
  rationale: 'Энклитика -ሰ имеет тематизирующую или противительную силу: фраза выдвигает «их души» как тему продолжения, а не присоединяет их к предыдущему предложению.'
theological_decisions:
- issue: Описывает ли глагол сотворение душ или устройство предназначенного им посмертного удела
  choice: устройство или приготовление удела для душ
  alternative: сотворение самих душ
  rationale: Ближайший контекст говорит о раздельных местах для умерших. При этом «было устроено» остаётся шире строго определённого «было назначено» и не превращает контекстуальный вывод в однозначное лексическое значение.
- issue: Следует ли уточнять участь грешников в заключительной трудной фразе
  choice: сохранить неоднозначность между пребыванием с беззаконниками и подобием им
  alternative: прямо указать, что они будут наказаны, погибнут или станут такими же
  rationale: Эфиопская конструкция сжата и не называет конкретного наказания. Такое уточнение внесло бы в текст больше, чем позволяет свидетельство.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Нравственные категории «праведники», «грешники» и «беззаконники» сохранены раздельно. Незавершённость последней фразы передана многоточием, поскольку мысль продолжается в следующем стихе.
