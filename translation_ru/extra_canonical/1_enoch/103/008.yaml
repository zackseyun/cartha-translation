base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/008.yaml
  text: And into darkness and into a snare and into a blazing fire your spirits shall enter[a], into the great judgment; and the great judgment shall be for all the generations of eternity. Woe to you[e][d][c][b], for you have no peace.
translation:
  language: ru
  text: И во тьму, и в сеть[a], и в пылающее пламя войдёт ваш дух[b] на великий суд[c]; и великий суд будет для всех поколений вечности[d]. Горе вам, ибо нет вам мира.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в западню». Геэзское слово обозначает сеть или ловушку и вызывает образ неизбежного пленения.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально здесь единственное число: «ваш дух», хотя обращение «ваш» относится ко многим людям. Возможно и собирательное понимание: «ваши духи».'
    reason: grammar_note
  - marker: c
    text: 'Буквально предлог выражает направление: «к великому суду» или «туда, где великий суд»; перевод «для великого суда» также встречается, но слабее передаёт направительный образ.'
    reason: alternative_reading
  - marker: d
    text: Оборот «для всех поколений вечности» труден. Он может подчёркивать всеохватность и непреходящее значение этого суда, а не только его длительность.
    reason: textual_semantic_note
lexical_decisions:
- source_word: በጽልመት
  choice: во тьму
  rationale: Предлог በ в ряду зависимых слов при глаголе движения передан направительно; «во тьму» естественно выражает вступление в состояние или область мрака.
- source_word: በመርበብት
  choice: в сеть
  rationale: Существительное передано в единственном числе согласно форме геэзского текста. «Сеть» сохраняет конкретный образ ловушки, не сводя его заранее к отвлечённой метафоре.
- source_word: በላህብ ዘይነድድ
  choice: в пылающее пламя
  rationale: Оборот буквально сочетает обозначение пламени с относительной формой «которое горит»; русский вариант сохраняет усиленный огненный образ и звучит торжественно.
- source_word: ኀበ ኵነኔ ዐባይ
  choice: на великий суд
  rationale: ኀበ имеет направительное значение «к, туда, где». По-русски «на великий суд» естественно обозначает цель движения и не превращает предлог в причинное «для суда».
- source_word: ትበውእ መንፈስክሙ
  choice: войдёт ваш дух
  rationale: 'Существительное «дух» и согласованный с ним глагол стоят в единственном числе, тогда как суффикс указывает на множество адресатов: буквально «ваш (у вас) дух». Единственное число сохранено, а возможная собирательность пояснена в сноске.'
- source_word: ኵነኔ ዐባይ
  choice: великий суд
  rationale: «Суд» сохраняет широту судебного понятия — разбирательство, приговор и его исполнение — и не сужает его до одного лишь «осуждения».
- source_word: ለኵሉ ትውልደ ዓለም
  choice: во все поколения вечности
  rationale: Необычный апокалиптический оборот сохранён без упрощения до одного наречия «навсегда»; по-русски он передаёт продолжительность суда через поколения.
- source_word: ኴሌ ለክሙ
  choice: Горе вам
  rationale: Устойчивая и узнаваемая пророческая формула обличения, уместная в торжественном апокалиптическом контексте.
- source_word: እስመ አልብክሙ ሰላመ
  choice: ибо нет вам мира
  rationale: Так сохраняются причинная связь, краткость и категоричность заключительного приговора; оборот естественен для современного литературного русского языка.
theological_decisions:
- issue: Значение единственного «ваш дух» в контексте посмертного суда
  choice: Сохранено формальное единственное число «ваш дух», без истолкования как законченного учения о составе человека или состоянии после смерти.
  alternative: «ваши духи» или «ваши души»
  rationale: Геэзский текст имеет существительное и глагол в единственном числе при суффиксе множественного числа адресатов. Перевод сохраняет эту напряжённость и не подменяет «дух» более истолковательным словом «душа».
- issue: Смысл термина ኵነኔ
  choice: «суд»
  alternative: «осуждение» или «приговор»
  rationale: Хотя контекст явно карательный, «суд» точнее сохраняет смысловую широту исходного судебного термина и не вводит более узкий богословский вывод.
- issue: Направление к великому суду
  choice: «на великий суд»
  alternative: «для великого суда»
  rationale: 'Направительный смысл ኀበ сохранён: дух движется к суду. Причинно-целевой перевод «для суда» был бы возможным истолкованием, но ослаблял бы пространственную образность текста.'
translation_notes:
  register: Современный литературный русский язык с торжественной апокалиптической интонацией. Синтаксический ряд «и во тьму, и в сеть, и в пылающее пламя» намеренно сохраняет нарастание исходного текста. Архаизмы сведены к минимуму; формула «нет вам мира» оставлена ради краткости и пророческой силы.
