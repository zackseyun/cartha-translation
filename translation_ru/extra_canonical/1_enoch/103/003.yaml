base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/003.yaml
  text: For every good thing and joy and glory have been prepared and written down for the spirits of those who died in righteousness[a]; and much good will be given to you as the fruit of your labor[c][b], and your portion will abound beyond the portion of the living.
translation:
  language: ru
  text: Ибо всякое благо, радость и слава приготовлены и записаны[a] для духов тех, кто умер в праведности; и вам будет дано много благ — плод ваших трудов[b], и ваша доля превзойдёт долю живых[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «внесены в запись». Эти слова могут подразумевать небесную запись уготованного праведным воздаяния.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «плод ваших трудов». Образ передаёт мысль о труде, который в будущем приносит плод.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ваш удел превзойдёт удел живых».'
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: ибо
  rationale: Сохраняет пояснительно-причинную связь с предшествующим увещанием, не усиливая её до однозначного причинного утверждения.
- source_word: ኵሉ ሠናይ
  choice: всякое благо
  rationale: Передаёт широкий и всеобъемлющий смысл выражения, не сужая его до более толковательного «благословение».
- source_word: ፍሥሓ
  choice: радость
  rationale: Естественный современный эквивалент, уместный в ряду с благом и славой.
- source_word: ክብር
  choice: слава
  rationale: Сохраняет присущие апокалиптическому контексту значения величия и сияния лучше, чем более узкое «честь».
- source_word: ተደለወ
  choice: приготовлены
  rationale: Передаёт пассивное значение заранее уготованного блага и сохраняет эсхатологическую направленность.
- source_word: ተጽሕፈ
  choice: записаны
  rationale: Сохраняет конкретный образ письменной записи, но не добавляет отсутствующего в стихе прямого указания на небесные книги.
- source_word: ለመንፈሳቲሆሙ
  choice: для духов тех
  rationale: Точно передаёт антропологический термин «духи» и не заменяет его более привычным, но богословски нагруженным словом «души».
- source_word: ለእለ ሞቱ በጽድቅ
  choice: кто умер в праведности
  rationale: Сохраняет именную форму «праведность» и представление о нравственной сфере, в которой умерли эти люди.
- source_word: ይትወሀብ ለክሙ
  choice: вам будет дано
  rationale: Прямо и естественно передаёт будущее пассивное обещание.
- source_word: ተክለ ጻማክሙ
  choice: как плод ваших трудов
  rationale: Сохраняет сельскохозяйственный образ труда, приносящего будущий плод, и не сводит его сразу к отвлечённому «воздаянию».
- source_word: ክፍልክሙ
  choice: ваша доля
  rationale: Естественно передаёт назначенную часть или удел, сохраняя оттенок награды.
- source_word: ፈድፋደ እምክፍለ ሕያዋን
  choice: будет гораздо больше доли живых
  rationale: Ясно передаёт сравнительное превосходство доли праведных умерших над долей живущих, не уточняя природу этой доли.
theological_decisions:
- issue: 'Обозначение умерших: «духи» или «души»'
  choice: духи
  alternative: души
  rationale: Геэзское መንፈሳት непосредственно означает «духи». Вариант «души» был бы привычнее, но мог бы привнести более поздние антропологические представления.
- issue: Смысл письменной записи
  choice: записаны
  alternative: записаны на небесах / внесены в небесные книги
  rationale: Контекст может вызывать образ небесной записи, однако сам стих говорит лишь о том, что блага записаны; перевод не разворачивает намёк в прямое утверждение.
- issue: Соотношение дара и труда
  choice: как плод ваших трудов
  alternative: в награду за ваши труды
  rationale: Выбранный вариант сохраняет образ плода, не превращая метафору в однозначную формулу заслуги или договорного воздаяния.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет двухчастное строение стиха; термины «праведность», «духи», «слава» и «доля» оставлены без конфессионального уточнения. Тире перед сравнением помогает естественно прочитать выражение о плоде труда, не устраняя его образность.
