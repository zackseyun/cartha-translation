base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/004.yaml
  text: And your spirits will live[a], you who died in righteousness, and they will rejoice and be glad, and their spirits will not perish, and their remembrance will be before the face of the Great One for all the generations of eternity. And now[e][d][c][b], do not fear their humiliation.
translation:
  language: ru
  text: И ваши духи будут жить — вы, умершие в праведности[a], — и они возрадуются и возвеселятся; их духи не погибнут, и память о них пребудет пред лицом Великого[b] на все поколения вечности[c]. И ныне не бойтесь их унижения[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «И будет жить ваш дух — дух тех из вас, чья смерть была в праведности». Конструкция геэза допускает как прямое обращение к умершим праведникам, так и пояснение к словам «ваш дух».'
    reason: Сохранение синтаксической и числовой неоднозначности исходного текста.
  - marker: b
    text: 'Буквально: «пред лицом Великого» — формула пребывания в присутствии Бога, характерная для возвышенной речи и образов небесного суда.'
    reason: Пояснение культурно-литературной формулы и божественного эпитета.
  - marker: c
    text: 'Буквально возможно также: «во все поколения мира» или «века»; здесь слово имеет временной смысл — вечная череда поколений.'
    reason: Лексическая неоднозначность слова ዓለም и пояснение выбранного временного значения.
  - marker: d
    text: 'Или: «их поношения», «их позора».'
    reason: Сохранение диапазона значений заключительного существительного.
lexical_decisions:
- source_word: የሐይዉ መንፈስክሙ
  choice: ваши духи будут жить
  rationale: Передаёт обещание продолжающейся жизни после смерти и сохраняет መንፈስ как «дух», не подменяя его более доктринально нагруженным словом «душа». Число согласовано с коллективным обращением и последующим «духи их»; формальная неоднозначность отмечена в сноске.
- source_word: ለእለ ሞትክሙ በጽድቅ
  choice: вы, умершие в праведности
  rationale: Сохраняет прямое обращение и именную форму «праведность», не сводя её к невиновности или только к образу поведения.
- source_word: ይትፌሥሑ ወይትሐሠዩ
  choice: возрадуются и возвеселятся
  rationale: Два близких русских глагола сохраняют торжественный параллелизм двух глаголов радости в источнике.
- source_word: ኢይትሐጐሉ መንፈሳቲሆሙ
  choice: духи их не погибнут
  rationale: Кратко и непосредственно передаёт отрицательное обещание о духах умерших.
- source_word: ዝካሮሙ
  choice: память о них
  rationale: Естественное современное русское выражение для сохраняющегося памятования; оно не ограничивается психологическим воспоминанием самих людей.
- source_word: እምቅድመ ገጸ ለዐቢይ
  choice: пред лицом Великого
  rationale: Сохраняет образ небесного присутствия и божественный эпитет, не заменяя его словом «Бог».
- source_word: ለኵሉ ትውልደ ዓለም
  choice: во все поколения вечности
  rationale: Передаёт временной, эсхатологический смысл формулы; «вечности» соответствует контексту и засвидетельствованному греческому αἰῶνος, тогда как буквальное «мира» могло бы ошибочно звучать пространственно.
- source_word: ኢትፍርህዎ ለኀሣሮሙ
  choice: не бойтесь их унижения
  rationale: Сохраняет наиболее прямое значение существительного, допускающего также оттенки поношения и позора.
theological_decisions:
- issue: Обозначение посмертного существования
  choice: дух
  alternative: душа; дыхание жизни
  rationale: «Дух» ближе всего к መንፈስ и сохраняет антропологическую открытость текста без внесения поздней доктринальной схемы.
- issue: Божественный титул ለዐቢይ
  choice: Великий
  alternative: Бог; Великий Бог
  rationale: Источник употребляет эпитет, а не явное именование Бога; субстантивированное «Великий» сохраняет енохический возвышенный стиль.
- issue: Продолжительность памятования
  choice: во все поколения вечности
  alternative: во все поколения мира; во все роды века
  rationale: Выбран временной смысл апокалиптической формулы, но буквальная альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Архаизирующие формы ограничены устойчивым выражением «пред лицом» и торжественной парой «возрадуются и возвеселятся»; синтаксис остаётся понятным обычному читателю.
