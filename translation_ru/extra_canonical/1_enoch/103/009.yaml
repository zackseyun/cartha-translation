base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/009.yaml
  text: Do not say[a], you righteous and good who are in life, “In the days of our affliction we toiled hard, and we saw every trouble, and we encountered many evils, and we were oppressed and made few[d][c][b], and our spirit became small.”
translation:
  language: ru
  text: 'Не говорите, праведные и добрые, живущие[a]: «Во дни наших бедствий мы тяжко трудились[b], испытали всякую невзгоду, много зла мы встретили, терпели угнетение и стали малочисленны[c], и дух наш умалился[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен и другой синтаксический разбор: «Не говорите о праведных и добрых, которые живы…».'
    reason: lexical_alternative
  - marker: b
    text: Чтение слов, переданных как «во дни наших бедствий мы тяжко трудились», в данном текстовом свидетельстве затруднительно; общий смысл — жалоба на тяжёлые страдания и изнурительный труд.
    reason: textual_variant
  - marker: c
    text: 'Или: «нас умалили»; выражение может указывать на сокращение числа, ослабление или упадок положения общины.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «наш дух стал мал». Образ может означать упадок духа, слабость или потерю мужества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትበልዎሙ፡ ለጻድቃን፡ ወኄራን
  choice: Не говорите, праведные и добрые
  rationale: Отрицательная глагольная форма вводит запрет. Связь местоименного суффикса и предлога допускает как обращение к праведным, так и речь о них; в основном тексте выбрано обращение, а другая синтаксическая возможность сохранена в примечании.
- source_word: እለ፡ ሀለዉ፡ ውስተ፡ ሕይወት
  choice: живущие ныне
  rationale: Передаёт смысл «находящиеся в жизни, живые» естественным современным русским языком. «Ныне» указывает на нынешнюю жизнь в контексте земных страданий, не превращая выражение в учение о некой особой «истинной жизни».
- source_word: በመዋዕለ፡ ሥራሕነ፡ ዳማ፡ ጻመውነ
  choice: Во дни наших бедствий мы тяжко трудились
  rationale: Сохраняет временную формулу «во дни», общий смысл тяжёлых обстоятельств и усиленное обозначение изнурительного труда; неясность повреждённого или трудного чтения отмечена в сноске.
- source_word: ወኵሎ፡ ሥራኀ፡ ርኢነ
  choice: испытали всякую невзгоду
  rationale: Буквальное «видели» здесь означает пережитый опыт. «Испытали» естественно передаёт семитско-эфиопский оборот, а «невзгода» соответствует контексту жалобы, не смешиваясь с уже употреблёнными «бедствиями».
- source_word: ወእኩያተ፡ ብዙኃተ፡ ረከብነ
  choice: встретили много зла
  rationale: Сохраняет сочетание «много злого» с глаголом встречи или нахождения и намеренно не сводит зло лишь к несчастным случаям.
- source_word: ወተወጻዕነ
  choice: терпели угнетение
  rationale: Передаёт пассивное претерпевание насилия, несправедливости или притеснения, не усиливая значение до полного разорения или гибели.
- source_word: ወውኅድነ
  choice: стали малочисленны
  rationale: Выражает уменьшение числа людей конкретнее, чем отвлечённое «умалились», и сохраняет коллективный характер жалобы.
- source_word: ወንእስት፡ መንፈስነ
  choice: дух наш умалился
  rationale: 'Сохраняет образ буквального «уменьшения» духа и его богословско-поэтическую открытость: это может подразумевать упадок мужества, внутреннюю слабость или подавленность.'
theological_decisions:
- issue: К кому относится выражение о праведных и добрых
  choice: Основной текст понимает фразу как обращение к праведным и добрым.
  alternative: «Не говорите о праведных и добрых, которые живы…»
  rationale: Грамматика допускает обе связи. Обращение лучше согласуется с последующей жалобой от первого лица множественного числа, однако альтернативная конструкция не исключена и приведена в сноске.
- issue: Значение выражения «находящиеся в жизни»
  choice: Речь идёт о праведных, живущих в настоящее время и ещё переживающих страдания.
  alternative: Речь о жизни будущего века или об особом духовном состоянии «истинной жизни».
  rationale: Содержание цитируемой жалобы относится к пережитым трудам и притеснениям; при этом перевод не вводит конфессионального толкования посмертного состояния.
- issue: Смысл умаления духа
  choice: Сохранён открытый образ внутреннего умаления.
  alternative: Однозначно истолковать как отчаяние, слабость или потерю мужества.
  rationale: Источник не требует выбора лишь одного психологического или богословского смысла, поэтому метафора не раскрывается непосредственно в тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Формулы «во дни» и «дух наш умалился» сохраняют достоинство и образность оригинала, тогда как остальная фраза остаётся понятной обычному читателю. Неясности синтаксиса и трудного текстового места вынесены в сноски, а не устранены толкованием.
