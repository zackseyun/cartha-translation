base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/010.yaml
  text: And we were destroyed, and there was no one to help us with a word; and we found nothing. We were tormented and destroyed, and we had no hope of seeing life from day to day.
translation:
  language: ru
  text: Мы погибли[a], и не было никого, кто помог бы нам хотя бы словом[b]; мы ничего не нашли[c]. Нас мучили, и мы погибли; у нас не было надежды увидеть жизнь день за днём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были уничтожены», «были разорены». Тот же глагол повторяется далее в стихе.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «словом». Вероятно, речь о том, что никто не помогал им даже словом, просьбой или заступничеством.'
    reason: cultural_note
  - marker: c
    text: 'Эта конструкция трудна по синтаксису. Возможны также переводы: «ничего не получили» или «никак не находили облегчения».'
    reason: textual_variant
lexical_decisions:
- source_word: ተሐጕልነ
  choice: мы погибали
  rationale: Повторённый глагол обозначает гибель, разрушение или доведение до бедствия. «Погибали» сохраняет силу образа и значимое повторение, не сужая смысл до материального разорения.
- source_word: አልቦ፡ ዘይረድአነ
  choice: не было никого, кто помог бы нам
  rationale: Отрицательная конструкция связана с относительной формой глагола помощи, поэтому личное «никого» здесь естественнее безличного «ничего».
- source_word: በነገር
  choice: хотя бы словом
  rationale: Буквальное значение связано со словом или речью. Частица «хотя бы» естественно передаёт контекст полного отсутствия даже словесной помощи, не превращая выражение в неопределённое «в каком-либо деле».
- source_word: ወኢበምንትኒ፡ ኢረከብነ
  choice: и мы ничего не обрели
  rationale: Трудная конструкция указывает на то, что говорящие ничего не нашли или не получили. «Не обрели» сохраняет широту значения и не добавляет прямо не названного облегчения.
- source_word: ተጸዐርነ
  choice: мы терпели мучения
  rationale: Глагол выражает тяготу, страдание или угнетение. Эта формулировка передаёт усиленный плач, сохраняя возможность более общего смысла «страдали».
- source_word: ኢተስፈውነ
  choice: не надеялись
  rationale: Отрицательная форма передаёт отсутствие надежды; простая русская конструкция звучит естественно и сохраняет отчаяние говорящих.
- source_word: ከመ፡ ንርአይ፡ ሕይወተ፡ ዕለት፡ እምዕለት
  choice: видеть жизнь изо дня в день
  rationale: Перевод удерживает исходный образ видения жизни и последовательности дней, не сводя его окончательно к толкованию «дожить до следующего дня».
theological_decisions:
- issue: Сохранять ли повторение слов о гибели или сгладить его в общее описание страданий
  choice: Сохранено повторение «погибали … погибали» и прямое выражение утраты надежды
  alternative: Объединить повторяющиеся элементы в одно общее утверждение о бедствии или нищете
  rationale: Повторение усиливает риторику плача и напряжение апокалиптического текста; его устранение ослабило бы стих и внесло бы ненужное толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством плача; короткие сочинительные фразы и повторение сохранены. «Хотя бы словом» делает буквальный образ понятным без его устранения, а необычное «видеть жизнь изо дня в день» сохраняет исходную образность и смысловую напряжённость.
