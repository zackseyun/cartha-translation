base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/006.yaml
  text: And now they have died in prosperity and in wealth and they did not see distress and slaughter in their lifetime[a]; and they died in honor[c][b], and judgment was not executed against them in their lifetime.
translation:
  language: ru
  text: И теперь они умерли в благополучии[a] и богатстве; при жизни они не увидели ни бедствия, ни убийства[b]. Они умерли в почёте[c], и суд не был совершён над ними при жизни[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «среди благ». Эфиопское слово может шире обозначать всё хорошее или благоприятное.'
    reason: lexical_alternative
  - marker: b
    text: 'В дошедшей транскрипции стоит форма «увидели», однако исправленное чтение, синтаксис и контекст поддерживают: «не увидели».'
    reason: textual_variant
  - marker: c
    text: 'Или: «во славе». Здесь слово, вероятно, означает общественный почёт или почётное положение.'
    reason: lexical_alternative
  - marker: d
    text: 'Фраза ограничивает утверждение их земной жизнью: суд не был совершён над ними при жизни.'
    reason: alternative_reading
lexical_decisions:
- source_word: ሠናይ
  choice: благополучие
  rationale: В сочетании с богатством слово обозначает благоприятные жизненные обстоятельства, а не нравственную доброту; «благополучие» естественно передаёт этот смысл по-русски.
- source_word: ብዕል
  choice: богатство
  rationale: В данном контексте речь идёт о материальном достатке; «богатство» ясно и не усиливает значение сверх текста.
- source_word: ምንዳቤ
  choice: бедствие
  rationale: Слово обозначает тяготу или несчастье; «бедствие» сохраняет контраст с благополучием нечестивых.
- source_word: ቀትለ
  choice: кровопролитие
  rationale: Слово указывает на насильственное убийство; «кровопролитие» передаёт силу апокалиптического контекста естественнее, чем буквальное «заклание».
- source_word: ስብሐት
  choice: почёт
  rationale: Здесь имеется в виду почётное положение при смерти, а не слава, принадлежащая Богу; «почёт» соответствует социальному оттенку контекста.
- source_word: ኵነኔ
  choice: суд
  rationale: Сохраняется широкий судебный смысл слова без преждевременного сведения его только к приговору или наказанию.
- source_word: ኢትገብረ ሎሙ
  choice: над ними не совершился
  rationale: Русская конструкция передаёт, что суд не был осуществлён над ними, сохраняя при этом пассивный характер исходного выражения.
theological_decisions:
- issue: Означает ли стих, что нечестивые вообще избежали суда, или лишь не подверглись ему при земной жизни
  choice: 'Утверждение ограничено их земной жизнью: при жизни суд над ними не совершился.'
  alternative: Они окончательно избежали всякого суда.
  rationale: Повтор выражения «при жизни» прямо ограничивает временные рамки утверждения. Перевод сохраняет напряжение между видимой безнаказанностью сейчас и возможным последующим судом, не добавляя его в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Синтаксис близок к исходному параллелизму, но причастный оборот «не увидев» делает фразу естественной для современного читателя. Сохранены повтор «при жизни» и судебная неопределённость исходного текста.
