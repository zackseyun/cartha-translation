base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/005.yaml
  text: Woe to you[a], dead sinners, when you die in the wealth of your sins, and those like you say about you, ‘Blessed are these sinners[d][c][b]; they have seen all their days.’
translation:
  language: ru
  text: 'Горе вам, мёртвые грешники, когда вы умираете в богатстве своих грехов[a], а подобные вам говорят о вас: «Блаженны эти грешники: они увидели все свои дни»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфиопское чтение в данном свидетельстве затруднено. Вероятно: «в богатстве своих грехов»; возможно также: «в своих грехах».'
    reason: textual_variant
  - marker: b
    text: 'То есть, вероятно: «они прожили до конца все свои дни» — их считают счастливыми потому, что им досталась полная продолжительность жизни.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Горе вам
  rationale: Сохраняет пророческую формулу осуждения, а не превращает её лишь в выражение скорби.
- source_word: ምውታን፡ ኃጥኣን
  choice: мёртвые грешники
  rationale: Передаёт оба явно выраженных определения и сохраняет намеренное риторическое напряжение с последующим «когда вы умираете».
- source_word: ሶበ፡ ትመውቱ
  choice: когда вы умираете
  rationale: Передаёт временное значение оборота непосредственно и без условного оттенка.
- source_word: በብዕሲ፡ ኃጢአትክሙ
  choice: в богатстве своих грехов
  rationale: Следует вероятному исправленному чтению በብዕለ («в богатстве») и сохраняет необычную связь богатства с грехами, не сводя её просто к «в грехах».
- source_word: ወይብሉ፡ ዲቤክሙ
  choice: говорят о вас
  rationale: Естественно передаёт речь, произносимую о покойных грешниках.
- source_word: እለ፡ ከማክሙ
  choice: подобные вам
  rationale: Сохраняет сравнительное значение и указание на людей того же нравственного рода.
- source_word: ብፁዓን፡ እሙንቱ፡ ኃጥኣን
  choice: Блаженны эти грешники
  rationale: «Блаженны» сохраняет возвышенную форму иронического восхваления и контраст с начальным «горе».
- source_word: ኵሎ፡ መዋዕሎሙ፡ ርእዩ
  choice: они увидели все свои дни
  rationale: Сохраняет образный эфиопский оборот и его неоднозначность; вероятный смысл полного жизненного срока пояснён в сноске.
theological_decisions:
- issue: Оценка умерших грешников устами подобных им людей
  choice: Сохранена ироническая формула «Блаженны эти грешники»
  alternative: 'Передать смысл прямо: «Счастливы были эти грешники» или истолковать слова как обычную похвалу долгой жизни'
  rationale: Текст противопоставляет божественное «горе» человеческому представлению о благополучии; буквальная форма не устраняет это богословское напряжение.
- issue: Сочетание обращения «мёртвые грешники» с фразой «когда вы умираете»
  choice: Сохранены оба элемента
  alternative: Опустить «мёртвые» как кажущееся повторение
  rationale: Эфиопский текст явно содержит оба элемента; их напряжённое соседство может быть намеренным и не должно молча сглаживаться.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Сохранены краткая формула суда, ироническое «блаженны» и необычные образы источника; неясные места не были догматически или стилистически сглажены.
