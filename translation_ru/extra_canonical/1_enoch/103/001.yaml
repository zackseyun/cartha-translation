base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/001.yaml
  text: And now I know this mystery for you[a], O righteous ones, by the glory of the Great and Honored and Mighty One in dominion[c][b], and by his greatness I know it for you.
translation:
  language: ru
  text: И ныне я клянусь вам, праведникам, славой Великого, Досточтимого и Могущественного во владычестве[a]; величием его клянусь вам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в царствовании»; слово может обозначать также «царство» или «царскую власть».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: И ныне
  rationale: Сохраняет соединительное начало и торжественный временной переход; «ныне» соответствует возвышенному, но понятному современному регистру.
- source_word: አነ፡ እምሕል፡ ለክሙ
  choice: я клянусь вам
  rationale: Глагол እምሕል здесь относится к клятве; повторение формулы в конце стиха подтверждает значение «клянусь», а не предложенное консультационным английским слоем «знаю тайну».
- source_word: ጻድቃን
  choice: праведникам
  rationale: Передаёт множественное обозначение группы и естественно сочетается с русским управлением «клянусь вам, праведникам».
- source_word: በስብሐቱ
  choice: славой
  rationale: Творительный падеж естественно выражает то, чем клянётся говорящий, сохраняя значение исходного предлога.
- source_word: ለዐቢይ፡ ወለክቡር፡ ወዕዙዘ
  choice: Великого, Досточтимого и Могущественного
  rationale: Три согласованных определения поняты как величественные наименования одного божественного лица, а не как описание отдельного «царства».
- source_word: መንግሥት
  choice: во владычестве
  rationale: В данном сочетании слово уточняет могущество названного лица. «Владычество» сохраняет диапазон значений власти и царственного господства.
- source_word: ወበዕበዩ
  choice: величием его
  rationale: Продолжает формулу клятвы и передаёт местоименный элемент как относящийся к Великому; строчная буква не навязывает конфессиональную типографику.
theological_decisions:
- issue: Значение повторённого глагола እምሕል
  choice: Говорящий дважды произносит формулу клятвы.
  alternative: Говорящий заявляет, что знает или открывает тайну для праведников.
  rationale: Исходный глагол и параллельная структура стиха указывают на клятву. Упоминание «тайны» отсутствует в приведённом тексте и потому не внесено из английского консультационного слоя.
- issue: К кому относятся определения «великий, досточтимый и могущественный»
  choice: Все три определения относятся к одному подразумеваемому божественному лицу.
  alternative: Слова «досточтимое и могущественное» описывают отдельное царство.
  rationale: Согласованная цепочка определений и формула клятвы поддерживают единый личный референт, однако перевод не заменяет титулы прямым словом «Бог».
- issue: Значение መንግሥት
  choice: владычество
  alternative: царство; царствование
  rationale: Выбрано обозначение осуществляемой власти, лучше связанное с определением «Могущественного»; иная возможная царственная семантика отмечена в сноске.
translation_notes:
  register: Торжественная клятвенная формула передана современным литературным русским языком. Сохранены повтор глагола и несколько сжатая цепочка величественных титулов; она не разглажена ценой добавления отсутствующего в источнике слова «Бог».
