base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/007.yaml
  text: Know that they will bring your souls down to Sheol[e][d][c][b][a], and their recompense will be evil and great.
translation:
  language: ru
  text: Знайте, что в шеол[b] низведут ваши души[a]; они будут несчастны[c], и велико будет их бедствие[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваши духи». Исходное слово допускает оба значения.'
    reason: lexical_alternative
  - marker: b
    text: Шеол — мир мёртвых в древней иудейской традиции; здесь этот термин не сводится просто к могиле.
    reason: cultural_note
  - marker: c
    text: 'Возможно также: «они будут злыми» или «им будет худо». Исходное выражение может обозначать как дурное качество, так и бедственное состояние.'
    reason: lexical_ambiguity
  - marker: d
    text: 'Или: «их скорбь», «их мучение». Значение «воздаяние» менее вероятно.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ታእምርዎሙ፡ እስመ
  choice: Знайте, что
  rationale: Объектный суффикс при глаголе знания предвосхищает последующее изъяснительное предложение; буквальное «знайте их, ибо» по-русски затемнило бы эту синтаксическую связь.
- source_word: ለሲኦል
  choice: в шеол
  rationale: Сохранён иудейский термин, обозначающий мир мёртвых; перевод «в могилу» неоправданно сузил бы апокалиптический образ.
- source_word: ያወርዶዎሙ
  choice: низведут
  rationale: Глагол выражает направленное вниз перемещение. Неопределённо-личная русская форма естественно передаёт неясного или не названного в данном стихе деятеля, не усиливая насильственный оттенок до «низвергнут».
- source_word: ለመናፍስቲክሙ
  choice: ваши души
  rationale: В контексте посмертного нисхождения «души» звучит естественно, однако возможное значение «духи» сохранено в примечании.
- source_word: እኩያተ ይከውና
  choice: они будут несчастны
  rationale: Форма во множественном числе согласуется с «душами» и в данном контексте описывает их тяжёлое, бедственное состояние; буквальное «будут плохими/злыми» допускает иной смысл и отмечено в примечании.
- source_word: ምንዳቤሆሙ
  choice: их бедствие
  rationale: Существительное передаёт бедствие, скорбь, мучение или тяготу, а не однозначно воздаяние. «Бедствие» сохраняет широкий отрицательный смысл.
- source_word: ዐቢየ
  choice: велико
  rationale: Предикативное прилагательное завершает стих с подчёркнутой оценкой величины бедствия.
theological_decisions:
- issue: Передача ሲኦል как традиционного термина или как общего обозначения могилы
  choice: шеол
  alternative: могила; мир мёртвых
  rationale: Транслитерация сохраняет иудейский апокалиптический фон и не отождествляет шеол исключительно с физической могилой.
- issue: Антропологическое значение መናፍስት
  choice: души
  alternative: духи
  rationale: Контекст посмертной участи поддерживает «души», но исходное слово допускает оба варианта; неоднозначность раскрыта в сноске.
- issue: Смысл እኩያተ применительно к душам
  choice: они будут несчастны
  alternative: они будут злыми; им будет худо
  rationale: Сочетание с последующим великим бедствием склоняет к описанию жалкого состояния, но нравственная характеристика грамматически не исключена и указана в примечании.
- issue: Характер последующего страдания
  choice: бедствие
  alternative: скорбь; мучение; воздаяние
  rationale: Лексическое значение ምንዳቤ связано прежде всего с бедствием или страданием; перевод «воздаяние» внёс бы более узкую судебно-карательную трактовку.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным апокалиптическим звучанием. «Низведут» и конечная инверсия «велико будет» поддерживают достоинство регистра без архаизации; строчная форма «шеол» соответствует употреблению названия мира мёртвых как традиционного термина.
