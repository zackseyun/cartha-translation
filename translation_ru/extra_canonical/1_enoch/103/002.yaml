base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/002.yaml
  text: For I know the mystery[a], and I have read the tablets of heaven, and I have seen the holy writings[c][b], and I found written in them and understood concerning them.
translation:
  language: ru
  text: Ибо я знаю тайну, прочёл небесные скрижали[a], увидел священную запись[b], нашёл в них написанное и постиг написанное о них[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Небесные скрижали» — распространённый апокалиптический образ небесных записей или установлений; выражение не обязательно предполагает буквальные каменные плиты.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «святое писание» или «святая запись». В геэз выражение стоит в единственном числе; оно не означает «писание святых».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и постиг о них». К чему именно относится местоимение — к скрижалям или к содержащимся в них записям, — не вполне ясно.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ምሥጢረ
  choice: тайну
  rationale: Передаёт сокрытое знание в контексте откровения и сохраняет возвышенное апокалиптическое звучание без лишнего уточнения.
- source_word: ፀፍፀፈ ሰማይ
  choice: небесные скрижали
  rationale: Сохраняет конкретный древний образ небесных письменных свидетельств или установлений; «скрижали» естественно звучит в русском религиозно-апокалиптическом контексте.
- source_word: ጽሕፈተ ቅድስተ
  choice: священную запись
  rationale: 'В геэз это сочетание существительного и согласованного с ним прилагательного женского рода в единственном числе: «святое/священное писание, запись». Выбор «запись» сохраняет значение письменного текста, но не создаёт ненужной ассоциации с каноническим Священным Писанием как названием корпуса книг.'
- source_word: ውስቴቶሙ
  choice: в них
  rationale: Местоимение во множественном числе естественно отсылает к небесным скрижалям и передаёт прямое пространственное значение.
- source_word: አኩዐ
  choice: постиг
  rationale: Передаёт не только восприятие, но и понимание прочитанного; слово соответствует возвышенному, однако понятному современному регистру.
- source_word: በእንቲአሆሙ
  choice: то, что относится к ним
  rationale: Сохраняет значение «о них / касательно их» и местоименную неоднозначность исходной фразы, не подменяя её более определённым толкованием.
theological_decisions:
- issue: Значение выражения ጽሕፈተ ቅድስተ
  choice: передать как единственное число — «священную запись»
  alternative: «писание святых» или «святые писания»
  rationale: Формы существительного и прилагательного согласованы в женском роде и единственном числе; поэтому выражение не обозначает «святых» как ангелов или праведников. Такое прочтение также не вводит в текст отсутствующее богословское отождествление.
- issue: Референт местоимений во второй половине стиха
  choice: сохранить местоименные выражения «в них» и «к ним»
  alternative: явно заменить их словами «в скрижалях» и «об этих записях»
  rationale: Хотя «в них» вероятнее всего относится к небесным скрижалям, синтаксис заключительной фразы допускает неясность. Сохранение местоимений не устраняет напряжение исходного текста искусственным уточнением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис сделан плавным и понятным, при этом последовательность глаголов и подлинная неоднозначность заключительной фразы сохранены.
