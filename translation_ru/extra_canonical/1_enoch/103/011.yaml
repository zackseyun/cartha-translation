base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/011.yaml
  text: We hoped to become the head[a], and we became the tail; we toiled, but we did not gain mastery over our labor; and we became food for sinners and for the lawless[c][b], and they laid their yoke heavily upon us.
translation:
  language: ru
  text: Мы надеялись стать головой, но стали хвостом; мы трудились, но не обрели власти над своим трудом[a]. Мы стали пищей для грешников и беззаконников[b], и они тяжко возложили на нас своё ярмо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно: «не обрели власти над нашим трудом». Слово, переданное как «труд», может относиться к самому труду, заработку или его результатам; эфиопский оборот труден для однозначного истолкования.'
    reason: lexical_alternative
  - marker: b
    text: '«Пищей» — конкретная метафора: то есть добычей тех, кто угнетал говорящих.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ንሴፎ፡ ንኩን፡ ርእሰ
  choice: Мы надеялись стать головой
  rationale: Сохраняется значение надежды или устремления и конкретный образ «головы», противопоставленный «хвосту».
- source_word: ወኮነ፡ ዘነበ
  choice: но стали хвостом
  rationale: Противительный союз естественно передаёт резкий поворот ожиданий; телесный образ сохранён без социального истолкования.
- source_word: ጻመውነ፡ እንዘ፡ ንትጌበር
  choice: мы трудились до изнеможения
  rationale: Оборот соединяет тяжкий труд с процессом работы. Русская формулировка естественно передаёт усиление, избегая неуклюжего повтора «трудились, трудясь» и не вводя отсутствующего в источнике отрицания.
- source_word: ወኢሠለጥነ፡ ዲበ፡ ዳማነ
  choice: но не получили власти над плодами своего труда
  rationale: Глагол выражает отсутствие власти или господства. «Плоды своего труда» передают контекстуальный смысл спорного ዳማነ, при этом неопределённость отмечена в сноске.
- source_word: መብልዕተ
  choice: пищей
  rationale: Сохраняется конкретная метафора исходного текста; более истолковывающее «добычей» вынесено в сноску.
- source_word: ለኃጥኣን፡ ወለዓማፅያን
  choice: для грешников и беззаконников
  rationale: Передана парная нравственная характеристика угнетателей без смягчения второго термина до общего «злодеи».
- source_word: ወአክበዱ፡ ላዕሌነ፡ አርዑተ፡ ዚአሆሙ
  choice: и они тяжко возложили на нас своё ярмо
  rationale: Сохранены конкретный образ ярма и значение отягчения, выражающее жестокое господство.
theological_decisions:
- issue: Сохранять ли образ переворота «голова — хвост» или раскрыть его как общественное унижение
  choice: 'Сохранить: «стать головой, но стали хвостом»'
  alternative: «стать первыми, но стали последними» или «стать правителями, но оказались подчинёнными»
  rationale: Конкретный образ несёт поэтическую и апокалиптическую силу и допускает более одного оттенка смысла; истолковывающий перевод неоправданно сузил бы его.
- issue: Как передать образ угнетения в заключительной части
  choice: «тяжко возложили на нас своё ярмо»
  alternative: «жестоко угнетали нас»
  rationale: Образ ярма важен для библейского языка порабощения и не должен заменяться абстрактным пояснением.
translation_notes:
  register: Современный литературный русский язык с достоинством плача. Сохранены параллелизм, телесная метафора «голова — хвост», образ пищи и ярма; синтаксис слегка упорядочен для ясного чтения без устранения смысловой напряжённости.
