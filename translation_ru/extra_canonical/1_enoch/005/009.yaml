lexical_decisions:
- source_word: ኢይደግሙ አብሶ
  choice: больше не будут грешить
  rationale: Отрицательная форма с идеей повторения или продолжения передана естественным русским оборотом «больше не будут», а አብሶ — глаголом «грешить». Это также сохраняет повторяющуюся формулировку соседнего стиха.
- source_word: ኢይትኴነኑ
  choice: не будут осуждены
  rationale: Сохраняется пассивный судебный смысл; «осуждены» точнее передаёт вердикт, чем более широкое «наказаны».
- source_word: ኵሎ መዋዕለ ሕይወቶሙ
  choice: во все дни своей жизни
  rationale: Сохранён семитский временной оборот с формально единственным числом слова «жизнь» при множественном субъекте; по-русски он звучит понятно и достойно.
theological_decisions:
- issue: Обещает ли строка нравственное преображение или лишь прекращение поступков, влекущих наказание
  choice: Первая часть передана как обещание, что они больше не будут грешить, а вторая — как отсутствие обвинительного приговора.
  alternative: «Больше не будут поступать неправедно» и «не будут наказаны».
  rationale: Текст различает нравственное действие и судебный вердикт. Их раздельная передача сохраняет этическое и судебное напряжение, не сводя одно к другому.
