base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/001.yaml
  text: Observe how the trees are covered with green leaves and bear fruit[c][b][a], and understand concerning everything that the Ever-Living One has made all these things.
translation:
  language: ru
  text: 'Посмотрите, как деревья покрываются зелёной листвой и приносят плоды; вдумайтесь во всё это и знайте: Тот, кто живёт вовеки, сотворил всё это[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Передача заключительной части следует смыслу контекста: «Тот, кто живёт вовеки, сотворил всё это». Сохранившаяся форма ገበርክሙ буквально выглядит как «вы сделали» и, вероятно, отражает повреждение текста.'
    reason: textual_variant
lexical_decisions:
- source_word: ጠይቁ እፎ
  choice: Посмотрите, как
  rationale: Передаёт обращённый к читателям призыв наблюдать за деревьями; እፎ здесь означает «как».
- source_word: ዕፀው
  choice: деревья
  rationale: Обычное и точное обозначение деревьев как наблюдаемой части творения.
- source_word: በሐመልማለ አቍጽል ይትከደኑ
  choice: покрываются зелёной листвой
  rationale: Естественно по-русски передаёт образ деревьев, покрытых зелёными листьями.
- source_word: ወይፈሪዩ
  choice: и приносят плоды
  rationale: Устойчивое русское выражение для плодоношения деревьев.
- source_word: ወለበዉ በእንተ ኵሉ ወአእምሩ
  choice: вдумайтесь во всё это и знайте
  rationale: 'Сохраняет два обращённых к читателям повеления: осмыслить увиденное и признать следующий вывод.'
- source_word: ዘሕያው ለዓለም
  choice: Тот, кто живёт вовеки
  rationale: Близко передаёт относительное выражение без замены его более истолковывающим титулом «Вечно Живущий».
theological_decisions:
- issue: Относится ли ዘሕያው ለዓለም к Богу как к вечно живущему Творцу
  choice: Тот, кто живёт вовеки
  alternative: Вечно Живущий
  rationale: Контекст и синтаксис указывают на Творца, однако описательная формулировка сохраняет образ исходного текста и не превращает его без необходимости в закреплённый титул.
translation_notes:
  register: Современный литературный русский язык; тон возвышенный, но ясный. Параллельные повеления сохранены, а трудное место не сглажено без пояснения.
