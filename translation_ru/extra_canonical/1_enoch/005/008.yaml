base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/008.yaml
  text: And then wisdom will be given to the chosen[a], and all these will live and will not again sin, whether through ungodliness or through pride[b]; but those who possess wisdom will be humble.
translation:
  language: ru
  text: И тогда избранным[a] будет дана мудрость, и все они будут жить и больше не будут грешить, предаваясь нечестию или гордыне; но те, у кого есть мудрость, будут смиренны[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избранникам».'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительную часть можно также понять так: «но они будут смиренны, потому что у них есть мудрость».'
    reason: lexical_alternative
lexical_decisions:
- source_word: እሜሃ
  choice: тогда
  rationale: Передаёт временную последовательность и естественно поддерживает развитие апокалиптического повествования.
- source_word: ይትወሀቦሙ
  choice: будет дана
  rationale: Сохраняет страдательное значение и представляет мудрость как получаемый дар, а не как самостоятельное достижение.
- source_word: ለሕሩያን
  choice: избранным
  rationale: Передаёт обозначение избранной группы, не добавляя к местному смыслу стиха позднейших догматических уточнений.
- source_word: ጥበብ
  choice: мудрость
  rationale: В данном нравственно-апокалиптическом контексте речь идёт о мудрости, ведущей к праведной жизни, а не о практическом умении.
- source_word: ኵሎሙ እሉንቱ
  choice: все они
  rationale: Естественно по-русски передаёт совокупную отсылку ко всей только что названной группе; явное «все эти» здесь звучало бы тяжеловесно.
- source_word: የሐይዉ
  choice: будут жить
  rationale: Сохраняет простое значение жизни, не уточняя, идёт ли речь о продолжительности жизни или об участии в грядущем благословенном порядке.
- source_word: ወኢይደግሙ አብሶ
  choice: и больше не согрешат
  rationale: Передаёт отрицание повторного греха естественным современным русским выражением.
- source_word: እበረሲዕ
  choice: нечестием
  rationale: Сохраняет религиозно-нравственный оттенок без расширения до всякого зла вообще.
- source_word: እበኅዕቢት
  choice: гордыней
  rationale: Точно выражает предосудительную надменность и создаёт ясный смысловой контраст со смирением.
- source_word: አላ
  choice: но
  rationale: Передаёт сильное противопоставление прежнему греховному поведению.
- source_word: ይገንዩ
  choice: будут смиренны
  rationale: Передаёт состояние смирения как противоположность гордыне и звучит естественно и достойно.
- source_word: ዘቦሙ ጥበበ
  choice: имеющие мудрость
  rationale: Сохраняет относительную конструкцию, связывающую обладание мудростью со смирением, и одновременно оставляет открытым возможное причинное понимание этой связи.
theological_decisions:
- issue: Передача ሕሩያን
  choice: избранные
  alternative: избранники
  rationale: «Избранные» понятно современному читателю и сохраняет апокалиптическое обозначение группы, не привнося специфической конфессиональной системы.
- issue: Нравственное преображение после дарования мудрости
  choice: Стих описывает будущее состояние, в котором избранные больше не грешат, в частности нечестием и гордыней.
  alternative: Можно понимать формулировку как возвышенное обобщение праведной жизни либо как прекращение именно названных грехов.
  rationale: Перевод сохраняет широкое утверждение «больше не согрешат» и следующие за ним конкретные пороки, не сужая и не ослабляя формулировку источника.
- issue: Связь мудрости и смирения в заключительной части
  choice: имеющие мудрость будут смиренны
  alternative: они будут смиренны, потому что у них есть мудрость
  rationale: Относительная формулировка ближе к форме источника; причинное отношение возможно, но грамматически не обязательно, поэтому оно вынесено в примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис остаётся ясным для широкого читателя; богословски нагруженные уточнения не добавляются. Повтор слова «мудрость» сохранён, поскольку он связывает начало и конец стиха.
