base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/004.yaml
  text: But you have not endured[a], and you have not done the command of the Lord; rather, you have transgressed and spoken proud and harsh words with your unclean mouths against his greatness. Because of the hardness of your heart[d][c][b], you will have no peace.
translation:
  language: ru
  text: Но вы не проявили терпения и не исполнили повеления Господа; напротив, вы преступили его и своими нечистыми устами говорили надменные и дерзкие слова против Его величия[a]. Из-за ожесточения ваших сердец[b] не будет вам мира[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение указывает на возвышенное величие Бога; возможен оттенок «величавости», но исходное слово не позволяет уверенно сузить его значение.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сухие сердцем»; это образ упрямства, чёрствости и нравственной невосприимчивости.'
    reason: idiom
  - marker: c
    text: Здесь «мир» означает не только внутреннее спокойствие, но также благополучие, целостность и благоприятный исход.
    reason: cultural_note
lexical_decisions:
- source_word: አተዓገሥክሙ
  choice: не проявили терпения
  rationale: Глагол обозначает терпение и стойкость; эта формулировка естественна по-русски и не сводит смысл исключительно к длительному перенесению страданий.
- source_word: ትእዛዘ እግዚእ
  choice: повеления Господа
  rationale: Сохранено единственное число исходного текста и возвышенное, но понятное обозначение Божьего предписания.
- source_word: ተዓደውክሙ
  choice: преступили его
  rationale: В контексте неповиновения повелению глагол выражает нарушение установленной границы или предписания; местоимение связывает его с упомянутым повелением.
- source_word: ሐመይክሙ
  choice: злословили
  rationale: 'Глагол имеет более сильный смысл, чем нейтральное «говорили»: он указывает на злую, порочащую или оскорбительную речь.'
- source_word: ዓበይተ ወድሩካተ ቃላተ
  choice: надменными и дерзкими словами
  rationale: Сочетание передаёт высокомерный и жёстко-оскорбительный характер речи; «дерзкими» здесь звучит естественнее буквального «жёсткими словами».
- source_word: ርኵሳት ዘዚአክሙ
  choice: своими нечистыми устами
  rationale: Сохранены нравственные и возможные культовые оттенки нечистоты, а также образный библейский язык.
- source_word: ዕበዩ ዚአሁ
  choice: Его величие
  rationale: Это прямое и ёмкое обозначение возвышенного статуса Бога, не сужающее выражение до славы или царского достоинства.
- source_word: ይቡሳነ ልብ
  choice: Жестокосердные
  rationale: Краткое обращение передаёт идиому о чёрствости, упрямстве и нравственной невосприимчивости сердца.
- source_word: ኢትከውኑክሙ ሰላም
  choice: не будет вам мира
  rationale: Формула суда сохранена в традиционном библейском звучании; «мир» включает не только внутренний покой, но и благополучие.
theological_decisions:
- issue: Объём значения заключительного слова «мир»
  choice: не будет вам мира
  alternative: не будет вам благополучия
  rationale: Исходное слово допускает широкий смысл мира, целостности и благополучного исхода. Сохранение слова «мир» не устраняет эту богословскую многозначность.
- issue: Направленность враждебной речи
  choice: злословили Его величие
  alternative: говорили надменные и дерзкие слова против Его величия
  rationale: Выбранный вариант передаёт активную враждебность глагола, но не уточняет, идёт ли речь о хуле в узком догматическом смысле.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис сделан ясным для обычного читателя; библейские образы «нечистых уст», жестокосердия и отсутствия мира сохранены без конфессионального уточнения.
