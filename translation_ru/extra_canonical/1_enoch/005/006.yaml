review_pass:
  verdict: revise
  source_fidelity: 'Вторая часть верно передаёт ኪያክሙ как прямое дополнение: «грешники будут проклинать вас», а не «будут проклинать вами». Заключительное выражение сохраняет широкое значение соединённости/общности с грешниками. В первой части смысл в целом сохранён, но порядок слов в русском черновике создаёт неестественное и временно двусмысленное впечатление, будто «вечное проклятие» относится к праведникам.'
  naturalness: «Вы отдадите свои имена всем праведникам для вечного проклятия» грамматически возможно, но тяжеловесно и неясно по управлению. Перестановка дополнений делает фразу современной и литературно естественной. «Вам предстоит быть вместе» допустимо, однако «вы будете вместе» проще и ближе к будущему сообщению исходного текста.
  terminology: «Праведники», «грешники» и «вечное проклятие» уместны для возвышенного апокалиптического регистра. Примечание a следует исправить с «их имена» на «ваши имена». Примечание b в нынешнем виде чрезмерно конкретизирует данные о рукописной традиции; исходный материал удостоверяет многоточие в издании, но не позволяет уверенно утверждать о повреждении рукописей.
