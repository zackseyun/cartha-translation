- from: В те дни вы отдадите свои имена всем праведникам для вечного проклятия[a], и грешники будут проклинать вас;[b] а вам предстоит быть вместе с грешниками.[c]
  to: В те дни вы отдадите всем праведникам свои имена для вечного проклятия[a], и грешники будут проклинать вас;[b] а вы будете вместе с грешниками.[c]
  rationale: Исправлен порядок слов, чтобы ясно связать «имена» с «вечным проклятием», не превращая праведников в объект проклятия. Сохранены прямое дополнение «вас» во второй части и намеренно широкое «будете вместе с грешниками» в заключении. Примечание о многоточии приведено к тому, что действительно засвидетельствовано представленным текстом, без неподтверждённого вывода о повреждении рукописей.
