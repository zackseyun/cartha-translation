  - severity: medium
    issue: Примечание b заявляет неподтверждённую порчу рукописной традиции
    rationale: В предоставленном исходном тексте после «грешники будут проклинать вас» есть многоточие, однако это само по себе не обосновывает утверждение о неясных или повреждённых словах именно в эфиопской рукописной традиции. Примечание должно описывать наблюдаемую редакционную неопределённость без такой атрибуции.
