base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/006.yaml
  text: In those days you will give your names to an everlasting curse for all the righteous[a], and the sinners will curse you[d][c][b]; and for you there will be a joining together with sinners.
translation:
  language: ru
  text: В те дни вы отдадите всем праведникам свои имена для вечного проклятия[a], и грешники будут проклинать вас;[b] а вы будете вместе с грешниками.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть ваши имена станут употребляться при произнесении проклятия — как знак публичного позора и суда.
    reason: lexical_alternative
  - marker: b
    text: В издании исходного текста после этой части стоит многоточие; оно не передаётся здесь как отдельное слово.
    reason: textual_uncertainty
  - marker: c
    text: 'Возможные переводы: «вы будете причислены к грешникам» или «у вас будет общение с грешниками».'
    reason: alternative_reading
lexical_decisions:
- source_word: በውእቱ መዋዕል
  choice: В те дни
  rationale: Сохраняет множественное число и характерную для апокалиптической речи временную формулу; звучит естественно и торжественно по-русски.
- source_word: ትሁቡ ስመ ዚአክሙ
  choice: вы отдадите свои имена
  rationale: Передаёт глагольную форму как обращение во втором лице множественного числа и сохраняет конкретный образ имени, становящегося формулой проклятия.
- source_word: በርገመት ዘለዓለም ለኵሉ ጻድቃን
  choice: всем праведникам для вечного проклятия
  rationale: Передаёт адресата при ለኵሉ ጻድቃን и назначение имени при በርገመት, не устраняя возможной неоднозначности связей между предложными оборотами.
- source_word: ወኪያክሙ ይረግሙ ኃጥኣን
  choice: и грешники будут проклинать вас
  rationale: ኪያክሙ выступает прямым дополнением «вас», а ኃጥኣን — подлежащим «грешники»; перевод следует грамматике эфиопского текста.
- source_word: ተኅቡረ ምስለ ኃጥኣን
  choice: вам предстоит быть вместе с грешниками
  rationale: Естественно передаёт состояние соединённости или общности, не уточняя сверх текста, идёт ли речь о совместной участи, причислении или общении.
theological_decisions:
- issue: Имена осуждённых как формула проклятия
  choice: 'Сохранён буквальный образ: они отдадут свои имена для вечного проклятия.'
  alternative: Их имена станут у праведников присловьем при произнесении проклятий.
  rationale: Контекст допускает формульное употребление имён, однако развёрнутая парафраза истолковала бы образ однозначнее, чем позволяет источник.
- issue: Отношение адресатов к грешникам в заключительной части
  choice: «Вам предстоит быть вместе с грешниками».
  alternative: «Вы будете причислены к грешникам» или «у вас будет общение с грешниками».
  rationale: 'Формулировка сохраняет широту номинального выражения: оно может указывать на объединение, принадлежность к одной группе либо общую участь в суде.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис упрощён ровно настолько, чтобы стих был понятен обычному читателю; образ имени-проклятия и неоднозначность последней фразы сохранены.
