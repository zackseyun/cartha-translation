lexical_decisions:
- source_word: ርእዩ
  choice: Посмотрите
  rationale: Форма повелительного наклонения во множественном числе сохраняет прямой призыв наблюдать за творением.
- source_word: እፎ
  choice: как
  rationale: Вводит описание наблюдаемого образа действия; русское «как» естественно передаёт риторический призыв.
- source_word: አብሕርት
  choice: моря
  rationale: Множественное число от ባሕር, «море»; это чтение подтверждается формой исходного слова и контекстом перечисления явлений природы.
- source_word: ወአፍላግ
  choice: и реки
  rationale: Множественное число от ፈልግ, «река», с соединительным союзом; водное значение соответствует паре «моря и реки».
- source_word: ኅቡረ
  choice: вместе
  rationale: Передаёт наречное значение совместного, согласованного действия.
- source_word: ይፌጽሙ
  choice: совершают
  rationale: Передаёт исполнение и доведение свойственной им деятельности до осуществления, оставаясь естественным в русском.
- source_word: ግብሮሙ
  choice: своё дело
  rationale: Буквально речь об «их деле/работе»; возвратное «своё» естественно соотносит дело с составным подлежащим.
