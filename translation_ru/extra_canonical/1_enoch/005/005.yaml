base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/005.yaml
  text: And because of this[a], you will curse your days, and you will shorten the years of your life; and the years of your destruction will increase in an eternal curse[b], and there will be no mercy for you.
translation:
  language: ru
  text: И потому вы проклянёте свои дни и сократите годы своей жизни[a]; годы вашей погибели умножатся под вечным проклятием[b], и не будет вам милости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Глагол стоит во втором лице множественного числа; возможны также переводы: «погубите годы своей жизни» или «лишитесь годов своей жизни».'
    reason: lexical_and_grammatical_alternative
  - marker: b
    text: 'Выражение «годы вашей погибели» текстуально трудно. Возможно также: «годы вашей гибели»; альтернативное понимание даёт: «годы вашей жизни погибнут».'
    reason: textual_difficulty
lexical_decisions:
- source_word: ወበእንተዝ
  choice: И потому
  rationale: Передаёт явную причинно-следственную связь с предшествующим обличением и естественно звучит по-русски.
- source_word: መዋዕሊክሙ ትረግሙ
  choice: вы проклянёте свои дни
  rationale: 'Глагол передан как активная форма второго лица множественного числа: осуждённые сами проклинают свои дни.'
- source_word: ዓመታት ሕይወትክሙ ትኃጕሉ
  choice: погубите годы своей жизни
  rationale: Сохраняет активную форму второго лица множественного числа и значение утраты или доведения до гибели, не превращая «годы» в грамматический субъект.
- source_word: ዓመታት ኀጕልክሙ
  choice: годы вашей погибели
  rationale: Передаёт существительное, родственное предшествующему глаголу, и сохраняет трудный, парадоксальный образ длительной погибели.
- source_word: ይበዝኅ
  choice: умножатся
  rationale: Точно передаёт значение увеличения или становления многочисленным и поддерживает возвышенный ритм.
- source_word: በርገመት ዘለዓለም
  choice: под вечным проклятием
  rationale: Естественная русская конструкция, сохраняющая длительность и окончательность формулы суда.
- source_word: ወኢይከውነክሙ ሣህል
  choice: и не будет вам милости
  rationale: Сохраняет резкую экзистенциальную отрицательную конструкцию оригинала и его торжественный регистр.
theological_decisions:
- issue: Проклинают ли адресаты свои дни сами или оказываются прокляты другими
  choice: «вы проклянёте свои дни» — самопроклятие в горестном состоянии под судом
  alternative: «ваши дни будут прокляты»
  rationale: Форма глагола лучше всего понимается как активное второе лицо множественного числа; пассивное прочтение не было внесено в перевод.
- issue: Сила выражения ዘለዓለም в формуле проклятия
  choice: «вечным проклятием»
  alternative: «непрестанным проклятием» или «проклятием на века»
  rationale: В апокалиптическом контексте слово выражает непреходящую длительность; «вечным» сохраняет этот вес без дополнительной догматической конкретизации.
- issue: Активность адресатов в утрате лет жизни
  choice: «погубите годы своей жизни»
  alternative: «лишитесь годов своей жизни» или «сократите годы своей жизни»
  rationale: Грамматически глагол является активной формой второго лица множественного числа. Основной текст сохраняет эту форму, а сноска отмечает возможные смысловые оттенки утраты и сокращения.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Сохранены параллелизм, активные формы обращения во втором лице множественного числа и резкая заключительная формула суда; трудные места не сглажены, а отмечены в сносках.
