base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/007.yaml
  text: And for the chosen there shall be light and joy and peace[a], and they shall inherit the earth. But for you, the wicked[b], there shall be a curse.
translation:
  language: ru
  text: И для избранных будут свет, радость и мир, и они унаследуют землю[a]; а вам, нечестивым, будет проклятие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «унаследуют страну (землю)». Геэзское слово ምድር может обозначать как всю землю, так и отдельную землю или страну; более широкий апокалиптический контекст поддерживает перевод «землю».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ሕሩያን
  choice: избранные
  rationale: Передаёт обозначение избранной группы прямо и естественно, не добавляя более поздних конфессиональных оттенков.
- source_word: ብርሃን
  choice: свет
  rationale: Основное значение слова; сохраняет образ благословения без лишнего истолкования.
- source_word: ፍሥሐ
  choice: радость
  rationale: 'Естественная передача слова в ряду благословений: «свет, радость и мир».'
- source_word: ሰላም
  choice: мир
  rationale: Прозрачно передаёт значение мира и благополучия и сохраняет краткость исходного ряда.
- source_word: ይወርስዋ ለምድር
  choice: унаследуют землю
  rationale: Глагол выражает наследование или получение во владение; «землю» сохраняет широкий апокалиптический масштаб, не исключая значения «страна» или «земля» как территория.
- source_word: ረሲዓን
  choice: нечестивые
  rationale: Сохраняет нравственно-судебное противопоставление избранным и соответствует возвышенному регистру текста.
- source_word: ርገመት
  choice: проклятие
  rationale: Прямая и естественная передача существительного со значением проклятия.
theological_decisions:
- issue: Объём значения ምድር
  choice: земля
  alternative: страна; земля как территория
  rationale: Слово допускает как широкое значение «земля», так и более узкое «страна, территория». В апокалиптическом контексте предпочтено широкое значение, но неоднозначность отмечена в сноске.
- issue: Обозначение ሕሩያን
  choice: избранные
  alternative: избранники
  rationale: «Избранные» сохраняет групповое обозначение исходного текста и не привносит дополнительных богословских уточнений.
- issue: Союзная структура противопоставления
  choice: «И для избранных…; а вам…»
  alternative: «Но для избранных… Но для вас…»
  rationale: Начальное ወ передаётся простым соединительным союзом, тогда как противительный оттенок при обращении к нечестивым выражен через «а»; так сохраняется различие конструкций исходного текста.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным ритмом. Синтаксический параллелизм исходника сохранён; форма «вам, нечестивым» естественно передаёт обращение во множественном числе.
