base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/002.yaml
  text: And his works are before him for every year that shall be[a], and all his works are subject to him and do not change; but as God has ordained[b], so everything is done.
translation:
  language: ru
  text: И дела Его — пред Ним во все грядущие годы[a]; все дела Его служат Ему[b] и не изменяются, но всё совершается так, как установил Бог.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в каждый год, который наступит». Выражение указывает на непрерывную череду будущих лет.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможны также переводы: «подчинены Ему» или «действуют по установленному Им порядку».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ምግባሩ
  choice: дела Его
  rationale: Существительное обозначает дела, деяния или действия. «Дела» естественно для космического контекста и позволяет сохранить повтор исходного слова.
- source_word: ቅድሜሁ
  choice: пред Ним
  rationale: Передаёт пространственно-реляционное значение «перед ним, в его присутствии» и сохраняет возвышенный, но понятный регистр.
- source_word: ለለ ዓመት ዘይከውን
  choice: в каждый грядущий год
  rationale: Фраза указывает на последовательность будущих лет. Такой перевод естественнее буквального «в каждый год, который будет», не устраняя направленность в будущее.
- source_word: ይትቀነይ ሎቱ
  choice: служат Ему
  rationale: Глагол выражает служение и подчинённое соответствие установленному порядку. Основной перевод сохраняет личностную направленность выражения, а возможные оттенки вынесены в примечание.
- source_word: ኢይትመየጥ
  choice: не изменяются
  rationale: Передаёт неизменность и отсутствие отклонения в установленном порядке; множественное число согласовано с русским «дела».
- source_word: ሠርዐ አምላክ
  choice: установил Бог
  rationale: Глагол означает устанавливать, определять или упорядочивать. «Установил» точно соответствует контексту неизменного порядка и не сужает смысл до отдельного повеления.
- source_word: ይትገበር ኵሉ
  choice: всё совершается
  rationale: Широкая пассивная формула о том, что установленное осуществляется. «Совершается» звучит естественно и не добавляет более сильного утверждения о причинности.
theological_decisions:
- issue: К кому относятся местоименные суффиксы в выражении «дела Его»
  choice: Местоимения относятся к Богу; прописные «Его» и «Ему» делают это чтение явным в русском тексте.
  alternative: Теоретически суффиксы могут отсылать к иному ближайшему субъекту, например к небу или сотворённой сущности.
  rationale: В заключительной части Бог назван прямо, а весь стих говорит об устойчивом годовом порядке и послушании творения; поэтому отнесение суффиксов к Богу наиболее вероятно в местном контексте.
- issue: Характер отношения творения к Богу в ይትቀነይ ሎቱ
  choice: «служат Ему»
  alternative: «подчинены Ему» или «упорядочены для Него»
  rationale: Исходный глагол допускает оттенки служения, подчинения и действия согласно установленному порядку. Основной текст не превращает это в специальное доктринальное утверждение, а смысловой диапазон сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис упрощён относительно буквального воспроизведения геэзского текста, но повтор «дела Его» и противопоставление неизменности Божьему установлению сохранены. Прописные местоимения обозначают наиболее вероятного референта — Бога.
