base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/009.yaml
  text: And all the kings and the mighty and the exalted[a], and those who rule the dry land, shall fall down before him on their faces, and they shall bow down and set their hope on that Son of Man[c][b], and they shall petition him and seek mercy from him.
translation:
  language: ru
  text: И все цари, и могущественные, и знатные, и те, кто властвует над сушей[a], падут перед ним ниц; они преклонятся[b] и возложат надежду на того Сына Человеческого, и будут просить его и просить у него милости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «те, кто правит землёй». В геэзском тексте буквально говорится о владычестве над «сушей».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поклонятся», «выразят почтение земным поклоном». Глагол может обозначать как почтительное преклонение, так и поклонение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወድቁ
  choice: падут… ниц
  rationale: Передаёт как физическое падение, так и простёртое положение перед высшей властью; сочетание с «перед ним» естественно для русского апокалиптического повествования.
- source_word: ነገሥት
  choice: цари
  rationale: Сохраняет прямое политическое значение и конкретность сцены суда.
- source_word: መዛዝእት
  choice: могущественные
  rationale: Обозначает людей, обладающих силой и властью; выбор сохраняет отличие от царей и знатных.
- source_word: ልዑላን
  choice: знатные
  rationale: Передаёт высокий общественный статус естественным современным русским словом, не смешивая эту группу с могущественными.
- source_word: እለ ይመልከዋ ለየብስ
  choice: те, кто властвует над сушей
  rationale: Сохраняет конкретный образ суши и смысл земного господства, не сглаживая выражение до общего «земля».
- source_word: በቅድሜሁ በገጾሙ
  choice: перед ним ниц
  rationale: Естественно передаёт положение лицом к земле перед ним, избегая тяжеловесного буквального оборота.
- source_word: ይሰግዱ
  choice: преклонятся
  rationale: Сохраняет неоднозначность между почтительным земным поклоном и поклонением, не навязывая богословского вывода.
- source_word: ይሴፈዉ
  choice: возложат надежду на
  rationale: Передаёт направленное упование и соответствует возвышенному, но понятному русскому регистру.
- source_word: ለዝኩ ወልደ እጓለ እመሕያው
  choice: того Сына Человеческого
  rationale: Сохраняет указательное значение и титульное употребление характерного для Притч Еноха выражения.
- source_word: ይስእልዎ ወይስእሉ ኀቤሁ ምሕረተ
  choice: будут просить его и просить у него милости
  rationale: Повтор глагола «просить» отражает риторическое удвоение исходного текста, а весь оборот остаётся естественным по-русски.
theological_decisions:
- issue: Следует ли передавать почтительное действие перед Сыном Человеческим как явное поклонение
  choice: преклонятся
  alternative: поклонятся / совершат земной поклон
  rationale: Геэзский глагол допускает диапазон от выражения покорности до религиозного поклонения. «Преклонятся» сохраняет эту богословскую напряжённость.
- issue: Передача титула ወልደ እጓለ እመሕያው
  choice: того Сына Человеческого
  alternative: того сына человеческого / того сына потомства живущих
  rationale: В данном разделе выражение действует как узнаваемый апокалиптический титул; прописные буквы отражают местное титульное употребление, не добавляя отсутствующих в стихе формул.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической прозы. Синтаксический параллелизм и повтор «просить» сохранены там, где они значимы в геэзском тексте; архаизмы и конфессионально маркированная лексика по возможности устранены.
