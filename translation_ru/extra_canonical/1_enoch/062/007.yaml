base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/007.yaml
  text: For from the beginning the Son of Man was hidden[a], and the Most High kept him in the presence of his power[b], and revealed him to the chosen ones.
translation:
  language: ru
  text: Ибо от начала Сын Человеческий был сокрыт, и Всевышний хранил его пред силой Своей[a], и открыл его избранным.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в присутствии Своей силы»; возможно также: «Своей силой». Эфиопское выражение допускает разные понимания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Ибо
  rationale: Сохраняет пояснительно-причинную связь с предшествующим высказыванием и соответствует возвышенному, но естественному русскому стилю.
- source_word: እምቅድሙ
  choice: от начала
  rationale: Передаёт временное значение наречия — «от начала», а не пространственное «перед ним»; это согласуется с пересмотром на основании словарных и контекстуальных данных.
- source_word: ኅቡእ ኮነ
  choice: был сокрыт
  rationale: Естественно передаёт состояние сокрытости и сохраняет контраст с последующим откровением.
- source_word: ወልደ እጓለ እመሕያው
  choice: Сын Человеческий
  rationale: В Притчах Еноха выражение служит устойчивым обозначением апокалиптической фигуры; прописные буквы отмечают титульное употребление, не добавляя позднейшего догматического толкования.
- source_word: ዐቀቦ
  choice: хранил его
  rationale: Глагол охватывает значения хранения, сбережения и охраны; «хранил» не уточняет способ или цель сверх текста.
- source_word: ልዑል
  choice: Всевышний
  rationale: Устоявшийся и понятный русский эквивалент божественного титула.
- source_word: በቅድመ ኃይሉ
  choice: перед Своей силой
  rationale: Формально близко передаёт трудное пространственное выражение и сохраняет конкретный образ «силы», не сглаживая его толкованием.
- source_word: ከሠቶ
  choice: открыл его
  rationale: Передаёт апокалиптическое раскрытие ранее сокрытого лица; в современном русском «открыл его избранным» звучит естественно и сохраняет прямое дополнение.
- source_word: ለኅሩያን
  choice: избранным
  rationale: Ясно обозначает общину избранных без излишне церковного или конфессионального оттенка.
theological_decisions:
- issue: Титульное значение выражения ወልደ እጓለ እመሕያው
  choice: Сын Человеческий
  alternative: сын человеческий; сын потомства живых
  rationale: В данном разделе выражение обозначает узнаваемую апокалиптическую фигуру. Титульная форма сохраняется без дальнейшего христологического отождествления.
- issue: Мотив предначального сокрытия и последующего откровения
  choice: от начала ... был сокрыт ... хранил его ... открыл его
  alternative: был сокрыт от вечности; был предопределён Всевышним
  rationale: Текст связывает раннее сокрытие с последующим явлением, но не определяет метафизическую природу этого состояния; перевод не усиливает формулировку до «вечности» или «предопределения».
- issue: Трудное выражение በቅድመ ኃይሉ
  choice: перед Своей силой
  alternative: в присутствии Своей силы; Своей силой
  rationale: Сохранён необычный пространственный образ и богословская напряжённость фразы, вместо того чтобы превращать её в однозначное указание на средство действия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Необычный образ трудной эфиопской фразы сохранён в основном тексте и пояснён в сноске; местоимение «Своей» указывает на силу Всевышнего.
