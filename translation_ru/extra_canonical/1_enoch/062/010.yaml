base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/010.yaml
  text: And the Lord of Spirits will drive them so that they hasten and go out from before his face[a], and their faces will be filled with shame[c][b], and darkness will be added to their faces.
translation:
  language: ru
  text: И Господь духов погонит их, чтобы они поспешили и ушли от лица Его[a]. Их лица наполнятся стыдом, и к их лицам прибавится тьма[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из Его присутствия». Буквально в геэзском тексте: «из-пред Его лица».'
    reason: lexical_alternative
  - marker: b
    text: 'То есть тьма усилит уже охвативший их позор. Буквально: «тьма прибавится к их лицам».'
    reason: clarification
lexical_decisions:
- source_word: ይጐጕኦሙ
  choice: погонит их
  rationale: Передаёт принудительное побуждение к движению, не сводя значение ни к одному только преследованию, ни к эмоциональному ужасу.
- source_word: እግዚአ መናፍስት
  choice: Господь духов
  rationale: Сохраняет устойчивый апокалиптический титул в 1 Енохе и естественно звучит по-русски.
- source_word: ከመ ይፍጥኑ
  choice: чтобы они поспешили
  rationale: Сохраняет целевую конструкцию и значение спешки, вызванной понуждением.
- source_word: ወይፃኡ እምቅድመ ገጹ
  choice: и ушли от лица Его
  rationale: Сохраняет явный образ лица и придворно-апокалиптическую формулу источника; «ушли» естественно передаёт удаление.
- source_word: ገጾሙ ይመልእ ኃፍረተ
  choice: их лица наполнятся стыдом
  rationale: Сохраняет образ лиц и публичного бесчестия, оставаясь естественным для современного русского языка.
- source_word: ጽልመት ይትዌሰክ ገጾሙ
  choice: к их лицам прибавится тьма
  rationale: Точно передаёт значение добавления или возрастания, не вводя отсутствующий в источнике смысл покрытия либо нагромождения.
theological_decisions:
- issue: Антропоморфное обозначение Божьего присутствия
  choice: от лица Его
  alternative: из Его присутствия; от Него
  rationale: В геэзском тексте прямо употреблено слово «лицо»; сохранение образа позволяет не сглаживать апокалиптическую и придворную образность источника.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Порядок предложений слегка упрощён ради ясности; повтор слова «лица» сохранён, поскольку он значим для образности оригинала.
