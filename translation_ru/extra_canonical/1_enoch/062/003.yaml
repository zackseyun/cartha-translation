  choice: все цари, и могущественные, и возвышенные
  rationale: Сохраняет трёхчастное перечисление представителей общественно-политической верхушки и его нарастающую торжественность.
- source_word: ወእለ ይእኅዝዋ ለምድር
  choice: и те, кто владеет землёй
