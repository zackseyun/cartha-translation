base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/003.yaml
  text: And in that day all the kings and the mighty and the exalted[a], and those who possess the earth, shall stand up, and they shall see and recognize that he sits on the throne of his glory; and righteousness shall be judged before him[b], and no lying word shall be spoken before him.
translation:
  language: ru
  text: И в тот день поднимутся все цари, и могущественные, и возвышенные, и те, кто владеет землёй[a]. Они увидят и узнают, что он восседает на престоле своей славы; и праведность будет судима перед ним[b], и перед ним не будет произнесено ни одного лживого слова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможные переводы: «те, кто держит землю» или «те, кто правит землёй (миром)». Эфиопский глагол может означать держать, владеть или осуществлять власть.'
    reason: lexical_alternative
  - marker: b
    text: Фраза «праведность будет судима перед ним» синтаксически и текстуально трудна в эфиопском тексте. Перевод сохраняет судебный смысл формулировки, не заменяя её более привычным выражением.
    reason: textual_variant
