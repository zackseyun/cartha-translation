- source_word: ወይሬእይዎ ወያአምርዎ
  choice: они увидят и узнают
  rationale: Сохраняет сочетание зрительного восприятия с осознанием или признанием личности восседающего.
- source_word: ከመ ይነብር ዲበ መንበረ ስብሐቲሁ
  choice: что он восседает на престоле своей славы
  rationale: «Восседает» естественно передаёт торжественный образ царского enthronement, не уточняя личность фигуры сверх текста.
- source_word: ወጽድቅ ቅድሜሁ ይትኴነን
  choice: и праведность будет судима перед ним
  rationale: Намеренно сохраняет трудную синтаксически и семантически судебную формулировку эфиопского текста, не сглаживая её до привычного выражения.
- source_word: ወነገረ በከ አልቦ ዘይትበሀል በቅድሜሁ
  choice: и никакого лживого слова не произнесут перед ним
  rationale: Передаёт невозможность ложной или обманной речи в его присутствии и сохраняет торжественный судебный контекст.
theological_decisions:
- issue: Личность восседающего на престоле
  choice: Сохранено местоимение «он» без явного наименования фигуры.
  alternative: Прямо назвать его Сыном Человеческим или Господом духов на основании более широкого контекста.
  rationale: В самом стихе употреблено местоименное обозначение; перевод не должен устранять локальную неоднозначность посредством контекста.
- issue: Смысл выражения о владеющих землёй
  choice: Выбрана широкая формулировка «те, кто владеет землёй».
  alternative: «Землевладельцы», «правители земли» или «те, кто господствует над миром».
  rationale: Эфиопский оборот допускает владение, удержание и осуществление власти, поэтому смысл не сужен до одной социально-политической категории.
- issue: Суд над праведностью
  choice: Сохранена буквальная и напряжённая формулировка «праведность будет судима».
  alternative: «Перед ним будет праведный суд» или «праведность утвердится перед ним».
  rationale: Исходная фраза трудна, но содержит существительное «праведность» и судебный глагол; более гладкие варианты разрешили бы неясность без достаточного основания.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической и судебной сцены. Синтаксис умеренно торжественный, но понятный; подлинные неясности исходного текста сохранены и пояснены сносками.
