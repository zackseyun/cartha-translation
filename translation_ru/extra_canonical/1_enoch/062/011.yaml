  text: And he will deliver them over to the angels for punishment[a][b].
translation:
  language: ru
  text: И он предаст их ангелам на наказание[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «предаст их ангелам с наказанием». Конструкция с «наказанием» может обозначать цель или результат («на наказание») либо иметь более инструментальный смысл («с наказанием»).'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይሜጥዎሙ
  choice: И он предаст их
  rationale: Глагол передаёт переход людей под чужую власть или стражу; «предаст» сохраняет судебный и апокалиптический оттенок, а начальное «И» отражает союз.
- source_word: ለመላእክት
  choice: ангелам
  rationale: Предлог обозначает получателя действия. Дательный падеж естественно и прямо передаёт смысл передачи под власть ангелов.
- source_word: በመቅሠፍት
  choice: на наказание
  rationale: Существительное означает наказание, кару или бичевание. «На наказание» хорошо сочетается с глаголом передачи, сохраняет судебный смысл и не сводит наказание непременно к физической муке.
theological_decisions:
- issue: Кем являются ангелы и какова их роль
  choice: Ангелы названы без уточнения их разряда и выступают принимающей стороной при передаче на наказание.
  alternative: Назвать их «ангелами-мстителями» или «карающими ангелами».
  rationale: В данном тексте стоит только «ангелы»; перевод не должен добавлять отсутствующую классификацию, хотя контекст ясно связывает их с наказанием.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной формулировкой. Переведён только предоставленный текст на геэзе; материал, отсутствующий в указанной исходной строке, не добавлен.
