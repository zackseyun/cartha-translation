base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/001.yaml
  text: And thus the Lord commanded the kings and the mighty and the exalted[a], and those who dwell on the earth, and said, “Open your eyes and lift up your horns[b], if you are able to recognize the Chosen One.”
translation:
  language: ru
  text: 'Так Господь повелел царям, могущественным, высокопоставленным и тем, кто обитает на земле, и сказал: «Откройте глаза и поднимите свои рога[a], если сможете распознать Избранного[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Поднимите свои рога» — образ силы, высокого положения или гордой власти; перевод сохраняет сам образ, не заменяя его отвлечённым понятием.
    reason: cultural_note
  - marker: b
    text: 'Или: «Избранника». В геэзском тексте это устойчивый титул в Притчах Еноха, а не просто описательное прилагательное.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወከመዝ
  choice: И так
  rationale: Передаёт связующее и итоговое значение выражения, сохраняя продолжение предшествующего повествования.
- source_word: አዘዘ
  choice: повелел
  rationale: Сильный глагол властного распоряжения соответствует судебно-апокалиптическому контексту.
- source_word: እግዚእ
  choice: Господь
  rationale: Устоявшийся и понятный русский эквивалент титула верховного Владыки; прописная буква указывает на божественное именование в данном контексте.
- source_word: ነገሥት
  choice: царям
  rationale: Сохраняет конкретное обозначение царей, не расширяя его до правителей вообще.
- source_word: ዐዚዛን
  choice: могущественным
  rationale: Передаёт силу и власть названной группы в естественном для современного русского языка субстантивированном прилагательном.
- source_word: ልዑላን
  choice: высокопоставленным
  rationale: Передаёт высокий ранг и общественное положение, не отождествляя группу с более узким сословием знати.
- source_word: እለ የሐድርዋ ለምድር
  choice: тем, кто обитает на земле
  rationale: Естественно воспроизводит относительную конструкцию и сохраняет характерную апокалиптическую формулу.
- source_word: ክሥቱ አዕይንቲክሙ
  choice: Откройте глаза
  rationale: Передаёт повеление открыть глаза для восприятия открываемой реальности.
- source_word: አንሥኡ አቅርንቲክሙ
  choice: поднимите свои рога
  rationale: Сохраняет конкретный апокалиптический образ рогов, не заменяя его истолкованием о силе или гордости.
- source_word: ትክሉ
  choice: если сможете
  rationale: Кратко и естественно выражает условие способности, сохраняя риторический оттенок вызова.
- source_word: አእምሮቶ
  choice: распознать
  rationale: В контексте явления особой фигуры речь идёт не только о знании, но и о её узнавании и верном опознании.
- source_word: ሐሩይ
  choice: Избранного
  rationale: Сохраняет формальный титул центральной фигуры Притч Еноха; прописная буква отмечает титульное употребление.
theological_decisions:
- issue: Передача титула ሐሩይ в Притчах Еноха
  choice: Избранный
  alternative: Избранник
  rationale: «Избранный» прозрачно передаёт значение и титульный характер слова, не добавляя более частных христологических формулировок.
- issue: Следует ли истолковать образ поднятых рогов непосредственно в основном тексте
  choice: Сохранить буквальный образ «поднимите свои рога»
  alternative: «покажите свою силу» или «возвысьтесь в гордости»
  rationale: Исходный образ допускает оттенки силы, статуса и гордости. Его сохранение не устраняет этой многозначности и не сглаживает апокалиптическую образность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис сохраняет последовательность «повелел… и сказал», а образные и титульные элементы переданы без конфессионального уточнения.
