base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/006.yaml
  text: And the kings and the mighty and all who possess the earth shall bless and praise and exalt him who rules over all that is hidden[a][b].
translation:
  language: ru
  text: И цари, и могущественные, и все, кто владеет землёй[a], будут благословлять, восхвалять и превозносить того, кто властвует над всем сокрытым[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кто держит землю». Геэзский глагол может означать как «держать», так и «владеть»; в контексте, вероятно, имеются в виду носители земной власти.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «тот, кто властвует над всем сокрытым» оставлено описательным, поскольку в этом стихе данная фигура не названа явным титулом.
    reason: alternative_reading
lexical_decisions:
- source_word: ይባርክዎ
  choice: будут благословлять
  rationale: Имперфект с союзной приставкой продолжает будущую последовательность видения; «благословлять» сохраняет возвышенный и богослужебный оттенок.
- source_word: ይሴብሕዎ
  choice: восхвалять
  rationale: Глагол обозначает хвалу и торжественное прославление; «восхвалять» естественно сочетается с другими глаголами этого ряда.
- source_word: የልዕልዎ
  choice: превозносить
  rationale: Передаёт смысл возвышения и прославления, сохраняя апокалиптический и царственный регистр.
- source_word: ነገሥት
  choice: цари
  rationale: Прямое значение сохраняет конкретный политический образ исходного текста.
- source_word: መዛዝእት
  choice: могущественные
  rationale: В данном контексте речь идёт о влиятельных и сильных людях наряду с царями; субстантивированное прилагательное сохраняет эту социальную характеристику.
- source_word: ኵሎሙ እለ ይእሕዝዋ ለምድር
  choice: все, кто владеет землёй
  rationale: Глагол может означать «держать» или «владеть». Выбранный вариант естественен по-русски и передаёт осуществление земной власти, не вводя явно оттенка насильственного захвата.
- source_word: ለዘይመልክ
  choice: того, кто властвует
  rationale: Относительная конструкция указывает на единственное лицо, характеризуемое царственной властью. Описательный оборот не добавляет отсутствующего в стихе титула.
- source_word: ኵሎ ዘኅቡእ
  choice: всем сокрытым
  rationale: Широкое выражение не сужается до одних «тайн» и сохраняет возможный космический и откровенческий охват.
theological_decisions:
- issue: Личность того, «кто властвует над всем сокрытым»
  choice: Оставить описательный оборот без уточнения личности и писать местоимения со строчной буквы.
  alternative: Назвать эту фигуру Господом духов, Сыном Человеческим / Избранным либо Богом.
  rationale: В данном стихе геэзский текст не даёт явного титула, а лишь относительное описание. Нейтральное оформление сохраняет неоднозначность и не решает богословский вопрос за текст.
translation_notes:
  register: Современный литературный русский язык с возвышенным апокалиптическим звучанием. Тройной ряд «благословлять, восхвалять и превозносить» сохраняет риторический параллелизм оригинала; синтаксис перестроен в естественный для русского порядок без устранения смысловой неоднозначности.
