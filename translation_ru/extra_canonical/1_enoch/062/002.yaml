base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/002.yaml
  text: And the Lord of Spirits seated him on the throne of his glory[a], and the spirit of righteousness was poured out upon him, and the word of his mouth slays all the sinners[d][c][b], and all the lawless are destroyed from before his face.
translation:
  language: ru
  text: И Господь духов посадил его на престол его славы[a], и дух праведности излился на него[b]; слово его уст умерщвляет всех грешников, и все мятежники истребляются от лица его[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально употреблён переходный глагол «посадил, усадил»; кого именно Господь духов посадил на престол, становится ясно из предшествующего контекста. Местоимение «его» в выражении «престол его славы» сохранено без уточнения референта.
    reason: contextual_ellipsis_and_ambiguity
  - marker: b
    text: 'Местоимение «него» сохранено без поясняющей замены: сам стих не называет его референта повторно. Глагол также можно передать менее образно: «почил на нём» или «был дарован ему».'
    reason: ambiguity_and_lexical_alternative
  - marker: c
    text: 'Буквально: «от лица его» — судебный образ удаления и гибели в присутствии восседающего на престоле. При этом местоимение в исходном тексте не устраняет полностью неоднозначность референта.'
    reason: cultural_note_and_ambiguity
lexical_decisions:
- source_word: አንበረ
  choice: посадил его
  rationale: Каузативный переходный глагол означает «усадил, посадил»; дополнение восстанавливается из контекста предыдущего стиха. Перевод «сел» исказил бы сцену возведения на престол.
- source_word: እግዚእ መናፍስት
  choice: Господь духов
  rationale: Сохранён устойчивый апокалиптический титул без добавления определённости, которой русский язык грамматически не требует.
- source_word: መንበረ ስብሐቲሁ
  choice: престол своей славы
  rationale: Генитивный образ передан прямо и торжественно; возвратное «своей» ясно связывает славу с действующим Господом духов.
- source_word: መንፈሰ ጽድቅ
  choice: дух праведности
  rationale: Буквальный перевод сохраняет одновременно нравственный и судебный оттенки ጽድቅ, не сужая значение до одной лишь юридической справедливости.
- source_word: ተክዕወ ዲቤሁ
  choice: излился на него
  rationale: Глагол поддерживает яркий образ излияния; более слабые варианты «почил» или «был дарован» сгладили бы исходную метафору.
- source_word: ነገረ አፉሁ
  choice: слово его уст
  rationale: Сохранён торжественный образ действенного судебного слова, исходящего из уст, без заимствования формулировок из позднейших параллельных традиций.
- source_word: ይቀትል ኵሎሙ ኃጥኣነ
  choice: умерщвляет всех грешников
  rationale: «Умерщвляет» передаёт явно смертельное и судебное действие глагола, а настоящее время отражает имперфектный аспект — характерное, продолжающееся либо предстоящее действие.
- source_word: ዐማፂያን
  choice: мятежники
  rationale: Слово обозначает восстающих и противящихся; «мятежники» сохраняет мотив активного противления, не ограничивая его современной политикой.
- source_word: እምገጹ ይትሐጐሉ
  choice: истребляются от лица его
  rationale: Сохранены пассивный имперфект и пространственно-судебная идиома удаления из присутствия enthroned figure; «истребляются» передаёт гибель, а не простое изгнание.
theological_decisions:
- issue: Кого обозначает «его» после глагола «посадил»
  choice: Сохранить местоимение без замены на титул или имя.
  alternative: «избранного» либо «Сына Человеческого»
  rationale: Переходный глагол требует объекта, который понятен из предшествующего контекста, но сам стих его не называет. Подстановка титула устранила бы намеренную контекстуальную зависимость.
- issue: К кому относятся местоимения в выражениях «на него», «его уст» и «лица его»
  choice: Сохранить одинаковые местоименные формы и не уточнять референта в основном тексте.
  alternative: Явно отнести все формы либо к Господу духов, либо к возведённому на престол лицу.
  rationale: Геэзский текст не даёт достаточного основания для такого уточнения внутри перевода; неоднозначность имеет значение для понимания сцены суда.
- issue: Временная и аспектуальная сила судебных глаголов
  choice: 'Настоящее время: «умерщвляет», «истребляются».'
  alternative: Прошедшее время («умертвило», «были истреблены») или однозначное будущее («умертвит», «будут истреблены»).
  rationale: Имперфектные формы противопоставлены предшествующим перфектам и могут обозначать характерное, разворачивающееся или предстоящее действие. Русское настоящее сохраняет эту открытость лучше, чем категорическое прошедшее или будущее.
translation_notes:
  register: 'Современный литературный русский с умеренно торжественным апокалиптическим звучанием. Сохранены титул «Господь духов», образ «престола славы» и семитская судебная формула «от лица его». Местоимения, относящиеся к Богу или небесной фигуре, намеренно не капитализированы: исходный текст не кодирует конфессиональную практику почтительного написания с прописной буквы.'
