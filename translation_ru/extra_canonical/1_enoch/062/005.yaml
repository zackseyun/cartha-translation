base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/005.yaml
  text: And one half of them shall look at the other half[a], and they shall be terrified, and their faces shall fall[b], and pain shall seize them when they see that Son of Man sitting on the throne of his glory.
translation:
  language: ru
  text: И одна половина их увидит другую[a]; они ужаснутся, лица их поникнут[b], и боль охватит их, когда они увидят того Сына Человеческого[c], сидящего на престоле своей славы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «они посмотрят друг на друга». Буквальное повторение слова «половина» может изображать две части одного разделённого множества.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «лица их опустятся». Это выражение, вероятно, передаёт видимый страх или стыд.'
    reason: idiom
  - marker: c
    text: Выражение «тот Сын Человеческий» сохранено здесь как апокалиптический титул, без уточнения его смысла на основании более поздних текстов.
    reason: theological_ambiguity
lexical_decisions:
- source_word: መንፈቆሙ ... ለመንፈቆሙ
  choice: одна половина их увидит другую
  rationale: Повтор существительного с местоименными суффиксами, вероятнее всего, изображает разделённое надвое множество. Перевод сохраняет конкретный образ двух половин, не превращая его без необходимости во взаимное «друг на друга».
- source_word: ይሬእዩ
  choice: увидит / увидят
  rationale: Это обычный глагол зрения. В первом случае русское единственное число согласовано с «одна половина», а во втором множественное число относится ко всему множеству.
- source_word: ይደነግጹ
  choice: ужаснутся
  rationale: Глагол передаёт сильный испуг и потрясение; «ужаснутся» естественно звучит в контексте эсхатологического суда и не ослабляет напряжённость текста.
- source_word: ይቴሕቱ ገጾሙ
  choice: лица их поникнут
  rationale: Русский глагол «поникнут» естественно передаёт опущенные лица как видимое выражение страха или стыда, сохраняя образность исходной идиомы.
- source_word: ይእኅዞሙ ሕማም
  choice: боль охватит их
  rationale: Конструкция буквально описывает боль или страдание, которое схватывает людей. «Боль охватит» сохраняет как телесную, так и душевную возможность смысла.
- source_word: ወልደ ብእሲ
  choice: Сына Человеческого
  rationale: В Притчах Еноха выражение обозначает определённую эсхатологическую фигуру. Заглавные буквы отмечают титульное употребление, не добавляя к стиху позднейших догматических формулировок.
- source_word: ይነብር
  choice: сидящего
  rationale: Глагол может означать пребывание или сидение, но сочетание с престолом ясно указывает на сидящего на нём; само слово «престол» уже выражает воцарение.
- source_word: መንበረ ስብሐቲሁ
  choice: престоле своей славы
  rationale: Перевод сохраняет родительную конструкцию и апокалиптический образ престола славы. Возвратное местоимение естественно соотносит славу с сидящим на престоле.
theological_decisions:
- issue: Передавать ли ወልደ ብእሲ как титул или как общее обозначение человека
  choice: «того Сына Человеческого» как титул определённой эсхатологической фигуры
  alternative: «того сына человеческого» или «того человека»
  rationale: В пределах Притчей выражение устойчиво указывает на особого эсхатологического деятеля, а указательное слово ለዝኩ подчёркивает его определённость. При этом перевод не уточняет его природу сверх сказанного в самом тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Синтаксис сделан ясным для обычного читателя; сохранены конкретный образ двух половин, напряжённость суда и титульная, но не догматически расширенная формула «Сын Человеческий».
