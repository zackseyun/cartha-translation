base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/004.yaml
  text: And pain shall come upon them as upon a woman in labor[a], when her child comes to the mouth of the womb[c][b], and she is constrained in giving birth.
translation:
  language: ru
  text: 'И постигнет их боль, как женщину в родах[a]: когда её дитя достигает устья утробы[b], она мучится при родах.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как женщину, мучимую родами».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «к устью утробы»; это анатомическое выражение усиливает образ родов.'
    reason: lexical_alternative
  - marker: c
    text: В исходном свидетельстве слова, передающие мучительное напряжение при родах, частично заключены в скобки, что указывает на текстовую неуверенность; перевод сохраняет общий принятый смысл, не уточняя спорный синтаксис.
    reason: textual_variant
lexical_decisions:
- source_word: ሕማም
  choice: боль
  rationale: Слово обозначает телесную боль или тяжкое страдание. В сравнении с родами «боль» сохраняет конкретность образа и одновременно допускает более широкий апокалиптический смысл мучения.
- source_word: ማሕምም
  choice: в родах
  rationale: Выражение описывает женщину, испытывающую родовые муки. Современное русское «женщина в родах» передаёт это состояние естественно и без архаизации.
- source_word: የዓፅብ / ተዐፅብ
  choice: мучится
  rationale: Повторяющийся глагол передаёт стеснение, тяжесть и мучительное напряжение. В контексте родов «мучится» звучит естественно, не сводя образ лишь к душевной тревоге.
- source_word: ወሊድ
  choice: рождая
  rationale: Существительное относится к родам; глагольная передача по-русски естественно выражает конкретное действие рождения.
- source_word: በአፈ ማሕፀን
  choice: к устью утробы
  rationale: Буквально выражение означает «у рта/устья утробы». Слово «устье» сохраняет яркую анатомическую метафору источника; направление передано по смыслу глагола движения.
theological_decisions:
- issue: Следует ли обобщить образ родов до отвлечённого ужаса
  choice: Сохранить конкретное сравнение с родовой болью и приближением ребёнка к устью утробы
  alternative: 'Передать лишь общий смысл: «их охватит мучение, как роженицу», опустив анатомическую подробность'
  rationale: В стихе последовательно развёрнут образ родов. Его конкретность составляет часть апокалиптической риторики, поэтому её не следует заменять отвлечённым описанием страха или скорби.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для апокалиптического текста. Конкретный телесный образ сохранён; «устье утробы» намеренно несколько возвышенно и пояснено сноской. Синтаксис сделан ясным без устранения текстовой неуверенности исходного свидетельства.
