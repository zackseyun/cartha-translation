base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/008.yaml
  text: And the congregation of the chosen and the holy ones shall be sown[c][b][a], and all the chosen shall stand before him on that day.
translation:
  language: ru
  text: И будет посеяно собрание[a] избранных и святых[b], и все избранные станут перед ним в тот день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «община».'
    reason: lexical_alternative
  - marker: b
    text: «Святые» здесь могут означать освящённую общину, хотя в апокалиптических текстах это обозначение может относиться и к небесным святым существам.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይዘራእ
  choice: и будет посеяно
  rationale: Форма передаёт пассивное действие от глагола «сеять». Буквальный образ посева сохранён как значимый для енохической образности и не заменён толкованием.
- source_word: ማኅበረ
  choice: собрание
  rationale: Естественно обозначает собранное сообщество и сохраняет возвышенный, но понятный современному читателю регистр.
- source_word: ኅሩያን
  choice: избранных
  rationale: Прямой и нейтральный эквивалент ключевого термина; не вносит дополнительной конфессиональной окраски.
- source_word: ቅዱሳን
  choice: святых
  rationale: Субстантивированное множественное число сохраняет открытым вопрос о том, имеются ли в виду освящённые люди, небесные существа или более широкая группа.
- source_word: ወይቀውሙ
  choice: предстанут
  rationale: В данном контексте передаёт не только стояние, но и явление перед возвышенной фигурой в сцене суда; при этом не добавляет идеи воскресения.
- source_word: በቅድሜሁ
  choice: перед Ним
  rationale: Кратко и естественно передаёт присутствие перед названной ранее фигурой. Прописная буква следует русской традиции уважительного местоименного обозначения, не уточняя личность референта.
- source_word: ኵሎሙ
  choice: все
  rationale: Сохраняет явное универсальное определение исходного текста.
- source_word: በይእቲ ዕለት
  choice: в тот день
  rationale: Естественная русская форма устойчивого апокалиптического временного указания.
theological_decisions:
- issue: 'Кого обозначает ቅዱሳን: праведных людей или небесных святых существ'
  choice: Передано обобщённо как «святых» без уточнения референта.
  alternative: «праведников» либо «святых существ»
  rationale: Сочетание с «избранными» может указывать на общину праведных, однако апокалиптическое употребление допускает связь с небесными существами; перевод сохраняет эту открытость.
- issue: Как передать метафору посева применительно к собранию
  choice: Сохранено буквальное «будет посеяно».
  alternative: «будет насаждено» или интерпретирующее «явится»
  rationale: Глагол означает посев, а необычность образа является частью енохической метафорики. Сглаживание устранило бы значимую образную и богословскую напряжённость.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Необычная метафора «посеяно собрание» намеренно сохранена. Маркеры сносок поставлены непосредственно после относящихся к ним слов: [a] после «собрание», [b] после «святых».'
