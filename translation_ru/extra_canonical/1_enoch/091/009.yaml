base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/009.yaml
  text: And all will be given over with the nations[a], and the towers will be burned with fire; and they will be removed from all the earth, and they will be cast into the judgment of fire[d][c][b], and they will perish in wrath and in mighty judgment forever.
translation:
  language: ru
  text: И все идолы[a] будут повержены вместе с народами[b], а храмы[c] будут сожжены огнём; они будут удалены со всей земли и брошены в огненный суд и погибнут в гневе и в могучем суде навеки[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В дошедшей транскрипции начало стиха повреждено. Исправленное чтение критического текста имеет смысл: «все идолы будут повержены».'
    reason: textual_variant
  - marker: b
    text: 'Или: «среди народов». Предлог допускает такое понимание, хотя основное его значение здесь — «вместе с».'
    reason: lexical_alternative
  - marker: c
    text: Исправленное эфиопское слово может обозначать храмы или башни; в контексте идолов выбрано «храмы».
    reason: lexical_alternative
  - marker: d
    text: Слово «навеки» подчёркивает окончательность эсхатологического суда, но стих сам по себе не определяет более подробно характер этого состояния.
    reason: cultural_note
lexical_decisions:
- source_word: ጣዖት፡ ይትገደፍ (в исправленном чтении критического текста)
  choice: идолы будут повержены
  rationale: Учитывает засвидетельствованное исправление повреждённой транскрипции ይትወሀብ; «повержены» передаёт принудительное устранение идолов и сохраняет судебный тон.
- source_word: ምስለ፡ አሕዛብ
  choice: вместе с народами
  rationale: ምስለ обычно означает «с, вместе с»; «народы» здесь нейтральнее конфессионально окрашенного «язычники».
- source_word: ማኅፈድ (исправленное чтение)
  choice: храмы
  rationale: В данном контексте уничтожения идолов культовые сооружения подходят лучше; возможное значение «башни» сохранено в примечании.
- source_word: በእሳት፡ ትነድድ
  choice: будут сожжены огнём
  rationale: Естественная русская формулировка сохраняет повтор образа огня и пассивный характер суда.
- source_word: ወይወፅእዎሙ፡ እምኵሉ፡ ምድር
  choice: они будут удалены со всей земли
  rationale: Передаёт устранение или изгнание в масштабе всей земли, не сужая значение до отдельной страны.
- source_word: ይትገደፉ፡ በኵነኔ፡ እሳት
  choice: брошены в огненный суд
  rationale: Сохраняет и насильственное «брошены», и судебно-огненную образность, избегая неестественного русского оборота «в суд огня».
- source_word: ይትሐጐሉ፡ በመዓት
  choice: погибнут в гневе
  rationale: «Погибнут» не уточняет механизм уничтожения сверх сказанного в тексте; «гнев» соответствует возвышенному судебному контексту.
- source_word: በኵነኔ፡ ኃያል
  choice: под могучим судом
  rationale: Слово «могучим» передаёт силу и непреодолимость суда, не подменяя её только строгостью.
- source_word: እንተ፡ ለዓለም
  choice: навеки
  rationale: Кратко и естественно передаёт длительную эсхатологическую окончательность выражения.
theological_decisions:
- issue: Объём осуждаемой группы и длительность суда
  choice: Сохранены образы всеобщего удаления, огненного суда, гнева и заключительное «навеки».
  alternative: Можно понимать эти слова как апокалиптический образ окончательной гибели, не определяющий сам по себе конкретную позднейшую модель посмертного наказания.
  rationale: Перевод передаёт силу и напряжение текста, но не вводит систематических доктринальных уточнений, которых стих прямо не содержит.
- issue: Референт местоимения после храмов
  choice: Сохранено местоимение «они» без явного уточнения.
  alternative: Его можно отнести к народам либо шире к уже названным объектам суда.
  rationale: Исходная последовательность допускает некоторую референциальную неоднозначность; её не следует устранять добавлением отсутствующего существительного.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Синтаксический параллелизм и повтор судебно-огненных образов сохранены; архаизмы и конфессионально специфическая терминология не вводились.
