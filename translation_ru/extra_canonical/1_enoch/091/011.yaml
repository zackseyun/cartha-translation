base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/011.yaml
  text: And from it shall be cut off the roots of oppression[a], and sinners shall be delivered up to the sword. From the blasphemers they shall be cut off in every place[d][c][b], and those who devise violence and those who commit blasphemy shall be destroyed by the sword.
translation:
  language: ru
  text: И из него будут отсечены корни угнетения, а грешники будут преданы мечу. От хулителей они будут отсечены повсюду[a], а замышляющие насилие и совершающие хулу[b] будут преданы закланию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эта часть эфиопской фразы синтаксически трудна: при глаголе во множественном числе подлежащее не названо. Перевод сохраняет эту неопределённость и повторяющуюся формулу суда.'
    reason: textual_variant
  - marker: b
    text: «Хулители» и «совершающие хулу» передают родственные слова эфиопского текста; возможный перевод по смыслу — «богохульники» и «совершающие богохульство».
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትገዘሙ
  choice: будут отсечены
  rationale: Возвратно-пассивная форма передаёт удаление через отсечение; этот образ сохраняет суровый язык апокалиптического суда, не уточняя сверх текста, означает ли он исключение или гибель.
- source_word: አሥራወ ዓመፃ
  choice: корни угнетения
  rationale: В данном сочетании አሥራወ понимается как «корни», а ዓመፃ — как насильственная неправда и угнетение. Такое прочтение соответствует синтаксису фразы «будут отсечены корни».
- source_word: ኃጥኣን
  choice: грешники
  rationale: Обычное нравственно-религиозное обозначение виновных в контексте суда; «грешники» сохраняет регистр книги.
- source_word: ይትሐጐሉ
  choice: будут преданы / погибнут
  rationale: Глагол описывает устранение или гибель. В первом случае сочетание с мечом естественно передано судебной формулой «преданы мечу», во втором — «погибнут от меча»; обе формулировки сохраняют итог суда без добавления действующего лица.
- source_word: በሰይፍ
  choice: мечу
  rationale: Сохраняется традиционный и понятный образ меча как орудия суда.
- source_word: ጽሩፋን / ጽርፈት
  choice: хулители / хула
  rationale: Однокоренные русские слова сохраняют лексическую связь между обозначением людей и совершаемым ими деянием; «хула» не ограничена уточнением объекта, которого источник не называет.
- source_word: በኵሉ መካን
  choice: повсюду
  rationale: Естественная современная передача буквального «во всяком месте», сохраняющая всеохватность суда.
- source_word: ይሔልይዋ ለግፍዕ
  choice: замышляющие насилие
  rationale: Глагол выражает обдумывание или замысел, а существительное — насилие, притеснение или жестокую неправду; перевод сохраняет намеренный характер деяния.
- source_word: በመጥባሕት
  choice: от меча
  rationale: Слово указывает на режущее оружие или заклание. «От меча» согласуется с параллельным образом в предшествующей части стиха и звучит естественно по-русски.
theological_decisions:
- issue: 'Широта значения ዓመፃ: неправда, насилие или угнетение'
  choice: угнетение
  alternative: беззаконие; насилие
  rationale: «Угнетение» соединяет нравственную неправду с общественным насилием и не сводит слово лишь к абстрактному нарушению закона.
- issue: Неясный субъект во фразе после первого упоминания меча
  choice: сохранить местоимение «они» без добавленного референта
  alternative: связать последующие определения с глаголом «будут отсечены»
  rationale: Эфиопская последовательность трудна и не называет референт явно. Сохранение местоименной неопределённости не навязывает толкование, отсутствующее в засвидетельствованном тексте.
- issue: Связь хулы с конкретным объектом
  choice: не уточнять, против кого направлена хула
  alternative: перевести как «богохульство»
  rationale: Религиозный контекст допускает значение «богохульство», однако объект в самой фразе не назван. Более широкое «хула» сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с dignified апокалиптическим звучанием. Синтаксис сделан ясным настолько, насколько допускает источник, но неясный референт местоимения намеренно не устранён. Однокоренная связь в лексике хулы сохранена.
