base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/010.yaml
  text: And the righteous one shall arise from their sleep[b][a], and wisdom shall arise and be given to them.
translation:
  language: ru
  text: И праведник[a] восстанет от их сна[b], и восстанет мудрость и будет дана им.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово стоит в единственном числе. Оно может обозначать как отдельную личность, так и праведника — представителя сообщества; текст не уточняет это.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «от их сна». Множественное число не вполне согласуется с предшествующим единственным числом «праведник»; перевод сохраняет эту особенность текста, не уточняя, кого обозначает «их».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ይትነሣእ
  choice: восстанет
  rationale: Глагол передаёт вставание или восстание; «восстанет» сохраняет возвышенный апокалиптический регистр и не уточняет, идёт ли речь о пробуждении, появлении или возвышении.
- source_word: ጻድቅ
  choice: праведник
  rationale: Форма стоит в единственном числе. Русское «праведник» естественно передаёт её, не решая, является ли этот образ определённой личностью или представителем сообщества праведных.
- source_word: እምነዋሙ
  choice: от своего сна
  rationale: Форма разбирается как እም «от, из» + ነዋም «сон» + суффикс 3-го лица мужского рода единственного числа. Возвратное «своего» по-русски однозначно связывает сон с подлежащим и звучит естественнее буквального «от его сна».
- source_word: ጥበብ
  choice: мудрость
  rationale: В данном нравственно-апокалиптическом контексте слово обозначает мудрость, а не только практическое умение или рассудительность.
- source_word: ይትወሀብ ሎሙ
  choice: будет дана им
  rationale: Пассивная форма с косвенным дополнением прямо выражает дарование мудрости группе людей; формулировка не добавляет не выраженных в тексте богословских уточнений.
theological_decisions:
- issue: Следует ли понимать ጻድቅ как отдельную личность или собирательное обозначение праведных
  choice: 'Сохранено единственное число: «праведник»'
  alternative: «праведные» или «один праведник»
  rationale: Геэзская форма единственного числа допускает как индивидуальное, так и представительное понимание. Перевод сохраняет эту напряжённость, не навязывая мессианского или исключительно коллективного толкования.
- issue: Чей сон обозначен в እምነዋሙ
  choice: «от своего сна» — сон праведника
  alternative: «от их сна»
  rationale: Непосредственный морфологический разбор формы поддерживает местоименный суффикс мужского рода единственного числа. Последующее «им» имеет множественное число, но это синтаксическое различие не следует сглаживать исправлением исходной формы.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Повтор «восстанет» сохранён ради параллелизма исходного текста. Различие между единственным числом «праведник/своего» и множественным «им» намеренно не сглажено.
