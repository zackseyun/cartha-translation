base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/016.yaml
  text: And the first heaven shall depart and pass away[a], and a new heaven shall appear[b], and all the powers of the heavens shall shine sevenfold forever.
translation:
  language: ru
  text: И первое небо отойдёт и пройдёт, и явится новое небо, и все силы небес[a] будут сиять всемеро ярче[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё небесное воинство». Геэзское слово может означать силы, могущество или воинство и здесь может охватывать как небесные светила, так и небесных существ.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительные слова трудны для понимания. Вероятный смысл: «всемеро» или «в семь раз ярче». Передача выражения остаётся несколько неопределённой, поскольку формулировка в данном OCR-свидетеле не вполне ясна.'
    reason: textual_variant
lexical_decisions:
- source_word: ሰማይ፡ ቀዳማይ፡
  choice: первое небо
  rationale: ቀዳማይ обозначает первое или прежнее в последовательности. «Первое небо» прямо передаёт апокалиптическое противопоставление новому небу, не решая заранее, идёт ли речь о замене или преображении.
- source_word: ይወፅእ፡ ወየኃልፍ፡
  choice: удалится и минует
  rationale: Первый глагол передаёт уход или выход, второй — прохождение или исчезновение. Парная формулировка сохраняет движение и усиление исходного текста, не сводя их к уничтожению.
- source_word: ሰማይ፡ ሐዲስ፡
  choice: новое небо
  rationale: ሐዲስ означает «новый, свежий». «Новое» точнее, чем толковательное «обновлённое».
- source_word: ይትረአይ፡
  choice: явится
  rationale: Форма означает «будет видно, появится». «Явится» естественно звучит в современном литературном русском и сохраняет характер видения.
- source_word: ኵሉ፡ ኃይለ፡ ሰማያት፡
  choice: все силы небес
  rationale: ኃይል может обозначать силу, могущество или воинство. Формулировка «силы небес» сохраняет возможность понимать выражение как небесные силы, светила или небесное воинство, не ограничивая его только ангелами либо астрономическими телами.
- source_word: ያበርህ፡
  choice: будут сиять
  rationale: Глагол обозначает сияние или излучение света; русский глагол непосредственно передаёт космический образ.
- source_word: ሰብዓተ፡ ምእዕቢተ።
  choice: вовеки сиять всемеро ярче
  rationale: ሰብዓተ ясно указывает на семь или семикратность. «Всемеро ярче» естественно передаёт усиление сияния; «вовеки» отражает принятое понимание продолжительности, при этом трудность формы отмечена в сноске.
theological_decisions:
- issue: Замена или обновление мира
  choice: 'Сохранена последовательность образов: первое небо уходит, а новое является.'
  alternative: Явно истолковать это либо как полное уничтожение и замену прежнего космоса, либо как преобразование того же самого космоса.
  rationale: Геэзский текст рисует пророческую картину и не формулирует систематического учения о точном характере космического обновления; перевод не должен разрешать эту напряжённость за текст.
- issue: Природа «сил небес»
  choice: Оставлено широкое выражение «силы небес».
  alternative: Однозначно перевести как ангельское «небесное воинство» или как небесные светила.
  rationale: Исходное ኃይል допускает значения силы, воинства и небесных сил; контекст сияния не устраняет полностью возможную личностную или космическую отнесённость.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным апокалиптическим звучанием. «Минует», «явится», «вовеки» поддерживают достоинство стиля без архаической грамматики; необычность «сил небес» намеренно сохраняет смысловую широту оригинала.
