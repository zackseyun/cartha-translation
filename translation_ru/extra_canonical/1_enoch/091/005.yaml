base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/005.yaml
  text: For I know that violence will endure upon the earth[a], and a great scourge will be carried out upon the earth; and all lawlessness will be brought to completion and be cut off from its roots[c][b], and every structure will pass away.
translation:
  language: ru
  text: Ибо я знаю, что насилие будет продолжаться на земле, и на земле совершится великая кара[a]; всё беззаконие достигнет полноты[b] и будет отсечено от самых корней, а всякое строение[c] исчезнет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великий мор», «великое бедствие» либо «великое наказание»; слово на языке геэз может обозначать поражающую беду или кару и не обязательно относится только к эпидемии.'
    reason: lexical_alternative
  - marker: b
    text: Слова «всё беззаконие достигнет полноты» могут означать, что зло достигнет полной меры прежде, чем будет уничтожено; это не означает его одобрения или утверждения как должного.
    reason: alternative_reading
  - marker: c
    text: 'Или: «всякое здание». Исходное слово может обозначать конкретную постройку, однако возможно и более широкое указание на всё возведённое или устроенное людьми.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ አእምር
  choice: Ибо я знаю
  rationale: Сохраняет причинно-пояснительную связь с предшествующим контекстом и прямое утверждение пророческого знания.
- source_word: ይጸንዕ ሀላዌ ግፍዕ
  choice: насилие утвердится
  rationale: Передаёт идею прочного существования или продолжительного господства насильственной несправедливости, не подразумевая её одобрения.
- source_word: ትትፈጸም መቅሠፍት ዐቢይ
  choice: великая кара будет совершена
  rationale: Пассивная конструкция сохраняет образ осуществляемого суда; «кара» передаёт бедственный и карательный оттенки, не сводя событие только к болезни.
- source_word: ኵላ ዓመፃ
  choice: всё беззаконие
  rationale: Передаёт совокупность мятежного, преступающего должное зла и сохраняет всеохватность исходного выражения.
- source_word: ትትፈጸም
  choice: достигнет полноты
  rationale: Сохраняет возможность того, что беззаконие прежде суда достигает полной меры, а не немедленно уничтожается.
- source_word: ትትገዘም እምሥረዊሃ
  choice: будет отсечено от самых корней
  rationale: Сохраняет явный образ окончательного удаления от корней; «самых» естественно подчёркивает полноту искоренения.
- source_word: ኵሉ ሕንጻ
  choice: всякое строение
  rationale: Передаёт как конкретное здание, так и, потенциально, более широкий смысл возведённого человеком сооружения или устройства.
- source_word: የኃልፍ
  choice: исчезнет
  rationale: Естественно передаёт прекращение существования в контексте суда, не уточняя, буквально или образно это произойдёт.
theological_decisions:
- issue: Продолжается ли зло какое-то время и достигает ли полной меры перед уничтожением
  choice: 'Сохранена последовательность: насилие утверждается, беззаконие достигает полноты, затем отсекается от корней.'
  alternative: Передать весь ряд как немедленное уничтожение зла.
  rationale: Последовательность глаголов в геэзском тексте допускает период устойчивого существования и завершения меры зла перед окончательным судом; перевод не устраняет это напряжение.
- issue: Имеет ли መቅሠፍት исключительно значение эпидемии или прямо названного Божьего наказания
  choice: великая кара
  alternative: великий мор; великое бедствие; великое наказание
  rationale: «Кара» сохраняет карательный характер события, но примечание оставляет открытым более широкий бедственный смысл и возможность мора.
translation_notes:
  register: 'Современный литературный русский язык с торжественной апокалиптической интонацией. Синтаксис сохраняет последовательное нарастание: устойчивость насилия, совершение кары, полнота и искоренение беззакония, исчезновение построенного. Архаизмы и конфессионально специфическая терминология не используются.'
