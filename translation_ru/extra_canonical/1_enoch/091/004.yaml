base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/004.yaml
  text: And do not draw near to righteousness with a double heart[a], nor join yourselves with those who are of a double heart; but walk in righteousness, my children, and it will lead you on a good path[d][c][b], and righteousness will be your companion.
translation:
  language: ru
  text: И не приближайтесь к праведности с двойным сердцем[a] и не сближайтесь с людьми с двойным сердцем[b]; но ходите в праведности, дети мои, и она поведёт вас по доброму пути, и праведность будет вашей спутницей[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «С двойным сердцем» — буквальный образ раздвоенной верности и внутренней неискренности.
    reason: cultural_note
  - marker: b
    text: Фраза «и не сближайтесь с людьми с двойным сердцем» в предоставленном эфиопском тексте заключена в скобки; возможно, это вариант текста или позднейшее расширение.
    reason: textual_variant
  - marker: c
    text: 'Или: «праведность соединится с вами» либо «станет вашей союзницей»; эфиопское слово допускает значения сопричастности, товарищества и спутничества.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትቅረቡ ኀበ ርትዕ
  choice: не приближайтесь к праведности
  rationale: Сохраняет отрицательное повеление и пространственный образ приближения к нравственной правоте; «праведность» понятно современному читателю и соответствует этическому контексту.
- source_word: በክልኤ ልብ
  choice: с двойным сердцем
  rationale: Буквально передаёт образ внутренней раздвоенности, не сводя его лишь к современному психологическому понятию.
- source_word: ኢትኅበሩ ምስለ እለ በክልኤ ልብ
  choice: не соединяйтесь с теми, у кого двойное сердце
  rationale: Передаёт запрет вступать в общность с людьми, чья верность раздвоена; формулировка сохраняет социальный оттенок глагола.
- source_word: ሑሩ በጽድቅ
  choice: ходите в праведности
  rationale: Сохраняет характерную для нравственного наставления метафору хождения и подготавливает последующий образ пути.
- source_word: ደቂቅየ
  choice: дети мои
  rationale: Естественно передаёт семейное обращение наставника без неоправданного ограничения только сыновьями.
- source_word: ትመርሐክሙ በፍኖት ኄርት
  choice: она поведёт вас по доброму пути
  rationale: Женское местоимение естественно соотносится с «праведностью»; единственное число «пути» и определение «доброму» следуют форме эфиопского текста.
- source_word: ወጽድቅ ይከውን ለክሙ ሱታፌ
  choice: а праведность будет вам спутницей
  rationale: «Спутница» естественно выражает значение сопричастности, товарищества или постоянного сопровождения и сохраняет олицетворение праведности.
theological_decisions:
- issue: Образ раздвоенной внутренней верности
  choice: двойное сердце
  alternative: двоедушие / раздвоенное сердце
  rationale: Буквальный образ сердца сохраняет антропологическую и нравственную напряжённость исходного текста, тогда как «двоедушие» уже истолковывает образ.
- issue: Статус заключённой в скобки фразы о соединении с людьми двойного сердца
  choice: включить в основной текст и отметить сноской
  alternative: опустить как возможное вторичное расширение
  rationale: Фраза присутствует в предоставленном свидетельстве и образует уместный параллелизм, но её отмеченный скобками текстологический статус требует прозрачной оговорки.
- issue: Олицетворение праведности как ведущей и сопровождающей
  choice: сохранить женское местоимение и слово «спутница»
  alternative: 'обезличить: «это поведёт вас» / «праведность будет с вами»'
  rationale: Так сохраняются грамматическая связь, образ наставляющей праведности и возможное значение товарищества без добавления особого догматического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего нравственного наставления. Сохранены повелительный тон, метафоры хождения и пути, буквальный образ «двойного сердца» и олицетворение праведности; архаизмы и конфессионально окрашенные уточнения не добавлялись.
