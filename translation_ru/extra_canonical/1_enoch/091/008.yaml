base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/008.yaml
  text: In those days[a], violence shall be cut off from its roots[d][c][b], and iniquity together with deceit from under heaven.
translation:
  language: ru
  text: В те дни насилие будет отсечено от корней, а беззаконие вместе с коварством будет устранено из-под небес.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет отсечено от своих корней». Глагол может также означать «будет пресечено» или «придёт к концу».'
    reason: lexical_alternative
  - marker: b
    text: Последнее обозначение порока допускает переводы «обман» или «лукавство»; чтение и членение этой части эфиопского текста не вполне надёжны.
    reason: textual_variant
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: В те дни
  rationale: Это обычное эфиопское временное выражение с указательным элементом; оно относится к периоду, описываемому в окружающем видении.
- source_word: ትትገዘም ግፍዕ
  choice: насилие будет отсечено
  rationale: Глагол означает отсечение, сокращение или прекращение и здесь согласуется с «насилием», а не с «днями». Буквальное «отсечено» сохраняет резкий образ суда.
- source_word: እምነ ሥረዊሃ
  choice: от самых корней
  rationale: Передаёт образ полного уничтожения зла у его истоков; «самых» естественно подчёркивает полноту искоренения, не меняя образа.
- source_word: ወዓመፃ
  choice: а беззаконие
  rationale: Слово обозначает неправду, беззаконие или мятеж; «беззаконие» сохраняет широкий нравственный смысл и не сводит его к одному виду преступления.
- source_word: ምስለ ጕሕሉት
  choice: вместе с коварством
  rationale: ምስለ выражает совместность, а последнее существительное связано с обманом или коварством. «Коварство» естественно звучит в русском перечне пороков.
- source_word: እምታሕተ ሰማይ
  choice: из-под небес
  rationale: Сохраняется возвышенная космическая формула, обозначающая весь мир под небом.
theological_decisions:
- issue: Масштаб устранения зла
  choice: Стих изображает устранение зла из всего поднебесного мира.
  alternative: Локальное очищение земли или сокращение человеческих дней.
  rationale: Фраза «из-под небес» расширяет перспективу, а образ отсечения от корней указывает на полное эсхатологическое устранение; при этом перевод не уточняет механизм или богословскую систему этого суда.
- issue: Подразумеваемое сказуемое во второй части
  choice: Тире показывает, что сказуемое «будет отсечено» по смыслу распространяется и на «беззаконие вместе с коварством».
  alternative: Добавить отдельный глагол «будет удалено» или «исчезнет».
  rationale: В исходном тексте отдельного второго глагола нет; эллипсис сохраняет синтаксическую сжатость и не вводит отсутствующего действия.
translation_notes:
  register: Современный литературный русский с возвышенным апокалиптическим звучанием. Сохранены параллелизм, образ отсечения у корней и космическая формула «из-под небес»; тире естественно передаёт эллипсис исходного текста.
