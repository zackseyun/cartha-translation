base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/012.yaml
  text: And after this there shall be another week[a], the eighth, of righteousness; and a sword shall be given to it, so that righteous judgment may be carried out against the oppressors[b], and sinners shall be delivered into the hands of the righteous.
translation:
  language: ru
  text: И после этого наступит другая неделя[a], восьмая, — неделя праведности; и будет дан ей меч, чтобы был совершён праведный суд над угнетателями, и грешники будут преданы в руки праведных[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «восьмая неделя». Здесь недели обозначают символические периоды истории, а не обычные календарные недели.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «преданы в руки» означает передачу под чью-либо власть или контроль.
    reason: cultural_note
lexical_decisions:
- source_word: ካልእት
  choice: другая
  rationale: Слово обозначает следующий период в последовательности символических недель; «другая» естественно передаёт продолжение ряда, не создавая впечатления, будто речь идёт буквально о второй неделе.
- source_word: ሳምንት፡ ሰንበት
  choice: неделя, восьмая
  rationale: Сочетание обозначает восьмой символический период в апокалиптической последовательности. Порядок слов сохранён настолько, насколько это допускает естественный русский синтаксис.
- source_word: እንተ፡ ጽድቅ
  choice: неделя праведности
  rationale: Родительная конструкция характеризует этот период. «Праведность» сохраняет ключевое понятие и его связь с последующим праведным судом.
- source_word: ይትወሀብ፡ ላቲ፡ ሰይፍ
  choice: будет дан ей меч
  rationale: Местоимение женского рода относится к неделе. Образ меча сохранён без истолкования его как отвлечённой власти или победы.
- source_word: ከመ፡ ይትገበር፡ ኵነኔ፡ ጽድቅ
  choice: чтобы совершить праведный суд
  rationale: Целевая конструкция передаёт назначение данного меча. Формулировка сохраняет как судебный смысл, так и нравственную характеристику суда.
- source_word: እምእለ፡ ይገፍዑ
  choice: над угнетателями
  rationale: Глагол выражает насилие, притеснение или причинение неправды; в контексте суда «угнетатели» ясно обозначает виновных.
- source_word: ይትሜጠዉ፡ ኃጥኣን፡ በእደዊሆሙ፡ ለጻድቃን
  choice: грешники будут преданы в руки праведных
  rationale: Сочетание обозначает передачу под власть или контроль праведных и сохраняет конкретную библейскую идиому «в руки».
theological_decisions:
- issue: Передача ጽድቅ и ኵነኔ ጽድቅ через лексику праведности или справедливости
  choice: «неделя праведности» и «праведный суд»
  alternative: «неделя справедливости» и «справедливый суд»
  rationale: Один корень характеризует и сам период, и совершаемый в нём суд. Повтор лексики праведности сохраняет тематическую связь и не сводит нравственно-религиозный смысл лишь к общественной справедливости.
- issue: Характер образа меча
  choice: 'Сохранить буквальный образ: «будет дан ей меч»'
  alternative: «ей будет дана власть судить» или «ей будет дарована победа»
  rationale: В источнике прямо назван меч. Апокалиптический образ не следует заменять его возможным толкованием.
- issue: Роль праведных в судьбе грешников
  choice: Сохранить выражение «преданы в руки праведных» без уточнения способа исполнения суда
  alternative: «отданы под власть праведных»
  rationale: Исходный текст утверждает передачу грешников праведным, но не объясняет её механизм; конкретная идиома сохраняет эту напряжённость и неоднозначность.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным апокалиптическим звучанием. Синтаксис сохраняет последовательность образов источника; ключевая лексика «праведность — праведный — праведные» намеренно повторяется.
