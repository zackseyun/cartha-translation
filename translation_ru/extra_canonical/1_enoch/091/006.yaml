  verdict: revise
  source_fidelity: 'Основная мысль передана верно: беззаконие вновь возвращается, достигает своей полноты на земле, а дела беззакония, насилия и греха вновь обретают силу. Различие трёх терминов сохранено. Однако «всякие дела» ослабляет распределительное «каждое дело / всякое дело» и несколько меняет синтаксический акцент источника.'
