base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/006.yaml
  text: And lawlessness will again increase[a], and it will be brought to completion upon the earth[c][b]; and every work of lawlessness and violence and sin will again take hold.
translation:
  language: ru
  text: И беззаконие повторится вновь[a] и достигнет полноты на земле[b]; и всякое дело беззакония, насилия и греха вновь возьмёт верх[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сочетание глагола с наречием подчёркивает повторность: буквально — «повторится вновь». Возможна более свободная передача: «снова проявится» или «снова возрастёт».'
    reason: Лексическое значение и сочетание начального глагола с наречием передают усиленную повторность.
  - marker: b
    text: 'Глагол можно также передать: «будет завершено» или «исполнится»; в данном контексте он, по-видимому, означает, что беззаконие достигнет полной меры.'
    reason: Необходимо сохранить неоднозначность глагола завершения или исполнения.
  - marker: c
    text: Глагол буквально связан с хватанием или овладением. Оборот «возьмёт верх» передаёт мысль о том, что злые дела вновь обретают силу и господство.
    reason: Русская идиома поясняет образное значение глагола «схватить, овладеть».
lexical_decisions:
- source_word: ትደገም ካዕበ
  choice: вновь повторится
  rationale: Корень передаёт повторение или возвращение, а ካዕበ отдельно подчёркивает значение «вновь». Формулировка сохраняет усиление оригинала, хотя в русском оно звучит несколько избыточно.
- source_word: ዓመፃ
  choice: беззаконие
  rationale: Этот вариант отличает первое понятие от следующих далее ግፍዕ («насилие, притеснение») и አበሳ («грех, вина») и сохраняет трёхчастное перечисление.
- source_word: ትትፈጸም
  choice: достигнет полноты
  rationale: Форма обозначает завершение или исполнение. Выражение естественно передаёт зловещую мысль о том, что беззаконие дойдёт до полной меры, не уточняя богословский смысл сверх текста.
- source_word: ዲበ ምድር
  choice: на земле
  rationale: Контекст апокалиптический и всеобщий; «земля» здесь предпочтительнее локального «страна».
- source_word: ትትአኀዝ
  choice: возьмут верх
  rationale: Глагол связан с хватанием, овладением и утверждением власти. Русское выражение передаёт господство злых дел и сохраняет образ их нового наступления.
- source_word: ኵሉ ግብረ
  choice: всякие дела
  rationale: Передаёт всеохватность проявлений зла; множественное число по-русски естественнее при последующем трёхчастном перечислении.
- source_word: ግፍዕ
  choice: насилие
  rationale: Слово может также обозначать притеснение или несправедливость, но «насилие» сохраняет самостоятельное социальное измерение обвинения.
- source_word: አበሳ
  choice: грех
  rationale: Ясный и широкий нравственно-религиозный эквивалент; возможны также оттенки вины и проступка.
theological_decisions:
- issue: Следует ли свести три обозначения зла к близким синонимам или сохранить их различие
  choice: Сохранено перечисление «беззакония, насилия и греха»
  alternative: «нечестия, притеснения и вины»
  rationale: В геэзском тексте стоят три однородных, но не тождественных понятия. Их различение сохраняет нарастающую силу обличения и не привносит конфессионального толкования.
- issue: Означает ли завершение беззакония его буквальное окончание или достижение полной меры
  choice: «достигнет полноты»
  alternative: «будет завершено» или «исполнится»
  rationale: Контекст допускает формальное значение завершения, однако речь, вероятнее всего, идёт не о прекращении зла, а о его полном проявлении. Выбранный оборот сохраняет эту мрачную напряжённость без дальнейшей догматизации.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Союзное построение и трёхчастное перечисление сохранены; синтаксис слегка сглажен ради естественности русского текста.
