base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/007.yaml
  text: And when sin and transgression and blasphemy and violence increase in every deed, and lawlessness and wrongdoing and uncleanness increase, a great punishment will come from heaven upon them all, and the Holy Lord will come forth in wrath and in punishment, to execute judgment upon the earth.
translation:
  language: ru
  text: И когда[b] в каждом деле умножатся грех, преступление, богохульство и насилие, и умножатся беззаконие, злодеяние и нечистота, с неба придёт на всех них великое наказание[a], и Святой Господь выйдет в гневе и для наказания, чтобы совершить суд над землёй.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великое бедствие», «великое поражение» либо «великая кара»; эфиопское слово может обозначать как наказание, так и постигшее людей карательное бедствие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «И если»; начальную эфиопскую частицу можно понимать как временную или условную.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ትልህቅ / ትለህቅ
  choice: умножатся
  rationale: Повторённый глагол передаёт нарастание зла; «умножатся» сохраняет апокалиптический тон и естественно звучит в русском библейском регистре.
- source_word: ኃጢአት
  choice: грех
  rationale: Обычное обозначение нравственно-религиозной вины.
- source_word: ዓመፃ
  choice: преступление
  rationale: Передаёт нарушение должного порядка и позволяет отличить это слово от последующего አበሳ.
- source_word: ጽርፈት
  choice: богохульство
  rationale: В перечне пороков слово, вероятно, обозначает нечестивую оскорбительную речь, направленную против Бога, а не просто человеческое оскорбление.
- source_word: ግፍዕ
  choice: насилие
  rationale: Кратко и выразительно передаёт жестокую несправедливость и угнетение.
- source_word: በኵሉ ተግባር
  choice: в каждом деле
  rationale: Сохраняет распределительное значение исходного выражения и мысль о проникновении порока во всякую деятельность.
- source_word: ዕልወት
  choice: беззаконие
  rationale: Сохраняет судебно-апокалиптический оттенок и отличается от соседних обозначений зла.
- source_word: አበሳ
  choice: злодеяние
  rationale: Широкое нравственное обозначение дурного поступка, не сливающееся с «грехом» и «преступлением».
- source_word: ርኵስ
  choice: нечистота
  rationale: Сохраняет возможные нравственные и ритуальные оттенки слова.
- source_word: መቅሠፍት ዐቢይ
  choice: великое наказание
  rationale: Контекст гнева и суда выдвигает карательное значение на первый план; возможность значения «бедствие/поражение» отмечена в сноске.
- source_word: ይከውን እምሰማይ
  choice: с неба ... обрушится
  rationale: Естественно по-русски выражает небесное происхождение и наступление суда, не ослабляя его внезапности.
- source_word: እግዚእ ቅዱስ
  choice: Святой Господь
  rationale: Сохраняет компактный божественный титул, соединяющий святость и господство.
theological_decisions:
- issue: Передача божественного титула እግዚእ ቅዱስ
  choice: Святой Господь
  alternative: Господь, Святой
  rationale: Выбран единый титул без искусственного согласования с более поздними устойчивыми формулами.
- issue: Значение መቅሠፍት
  choice: наказание
  alternative: бедствие; поражение; кара
  rationale: Явное упоминание гнева и суда поддерживает значение наказания, однако возможная конкретная форма карательного бедствия сохранена в сноске.
- issue: Связь начального условия со следствием
  choice: когда
  alternative: если
  rationale: Начальная частица вводит придаточную часть, за которой следует небесный суд; «когда» хорошо передаёт ожидаемое апокалиптическое развитие, а условное прочтение отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Перечень пороков сохранён без упрощения, а повтор глагола «умножатся» воспроизводит риторическую структуру источника.
