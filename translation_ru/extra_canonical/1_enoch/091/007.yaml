review_pass:
  verdict: revise
  source_fidelity: Начальная частица верно передана как «И когда» с сохранением условного варианта в сноске. Перечень пороков, небесное происхождение великого наказания, божественный титул и заключительная цель суда переданы точно. Однако «обрушится» усиливает нейтральное «придёт/будет ... с неба», а «выйдет в гневе и с наказанием» не вполне естественно и размывает параллель двух предложных обстоятельств в оригинале.
  naturalness: Текст в целом литературен и выдержан в умеренно возвышенном регистре. Более нейтральное «придёт» не вносит невыраженной образности, а «в гневе и для наказания» естественно связывает второе обстоятельство с последующим совершением суда.
  terminology: «Грех», «преступление», «богохульство», «насилие», «беззаконие», «злодеяние», «нечистота», «великое наказание» и «Святой Господь» последовательно передают исходный перечень и титул. Сноска a уместно сохраняет карательно-бедственный диапазон መቅሠፍት; сноска b корректно отмечает условное прочтение частицы.
  issues:
  - severity: low
    issue: «Обрушится» добавляет к исходному глаголу оттенок внезапного сокрушительного падения.
    rationale: ይከውን እምሰማይ сообщает прежде всего о наступлении/приходе наказания с неба. «Придёт с неба» сохраняет это без дополнительной образности.
  - severity: medium
    issue: Сочетание «выйдет в гневе и с наказанием» стилистически неровно и неточно воспроизводит второе обстоятельство.
    rationale: Русское «с наказанием» может звучать как указание на предмет, который несут, тогда как контекст выражает явление Господа в гневе для совершения карательного суда. «В гневе и для наказания» ясно и не добавляет конфессиональной интерпретации.
  revised_text: И когда[b] в каждом деле умножатся грех, преступление, богохульство и насилие, и умножатся беззаконие, злодеяние и нечистота, с неба придёт на всех них великое наказание[a], и Святой Господь выйдет в гневе и для наказания, чтобы совершить суд над землёй.
