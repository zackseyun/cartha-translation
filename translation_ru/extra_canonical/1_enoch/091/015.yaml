base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/015.yaml
  text: And after this[a], in the tenth week, in the seventh part, there shall be the eternal judgment [and it shall be executed by the watchers of the eternal heaven][b], a great judgment that will be exacted in the midst of the angels.
translation:
  language: ru
  text: И после этого, в десятую неделю, в седьмой её части, совершится вечный суд [и он будет осуществлён стражами вечного неба][a] — великий суд, который будет совершён среди ангелов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Фраза в квадратных скобках текстуально не вполне надёжна. «Стражи» также можно передать как «бодрствующие существа вечного неба».
    reason: Текстовая неуверенность и неоднозначность названия небесных существ.
lexical_decisions:
- source_word: ወእምድኅረ ዝ
  choice: И после этого
  rationale: Естественная временная формула перехода, соответствующая значению эфиопского выражения.
- source_word: በሰንበት ዓሥርት ፯እደ
  choice: в десятую неделю, в седьмой её части
  rationale: 'Сохраняет явные элементы текста: символическую десятую неделю и её седьмую часть; речь не о буквальной субботе.'
- source_word: ኵነኔ እንተ ለዓለም
  choice: вечный суд
  rationale: ኵነኔ обозначает суд или осуждение, а እንተ ለዓለም придаёт определению значение вечности.
- source_word: ወትትገበር እምትጉሃነ ሰማይ ዘለዓለም
  choice: и он будет осуществлён стражами вечного неба
  rationale: Передаёт пассивную конструкцию и традиционное значение ትጉሃን как небесных стражей; квадратные скобки сохраняют отмеченную в источнике текстуальную неуверенность.
- source_word: ዐቢይ ዘይትቤቀል እማእከሎሙ ለመላእክት
  choice: великий суд, который совершится среди ангелов
  rationale: Передаёт ዐቢይ как «великий», пассивный характер действия и буквальное «среди ангелов», не добавляя спорного понятия мести.
theological_decisions:
- issue: Кто осуществляет вечный суд
  choice: Сохранено чтение «стражами вечного неба» в квадратных скобках
  alternative: Опустить заключённую в скобки фразу как текстуально сомнительную
  rationale: Источник прямо приводит эту фразу, но отмечает её скобками; перевод сохраняет и содержание, и степень текстуальной неуверенности, не уточняя происхождение полномочий стражей.
- issue: Характер суда среди ангелов
  choice: Нейтральное «суд, который совершится среди ангелов»
  alternative: «суд, который отомстит ангелам» или «кара среди ангелов»
  rationale: Нейтральная формулировка сохраняет пассивность и не решает без достаточных оснований, означает ли глагол возмездие, взыскание или совершение суда.
translation_notes:
  register: Современный литературный русский язык с достойным апокалиптическим звучанием. «Стражи» употреблено как понятное обозначение небесных бодрствующих; синтаксис сохраняет торжественность, не становясь архаичным.
