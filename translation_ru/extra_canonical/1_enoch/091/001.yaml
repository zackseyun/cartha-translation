  source_fidelity: 'Основная передача верна: ትክዕወት правильно понято как глагольная форма «излился», а не как «праведность». Однако «что постигнет вас навеки» в русском означает, что сами бедствия будут длиться вечно, тогда как заключительное выражение определяет временной горизонт предстоящего («до вечности / во все грядущие времена»).'
  naturalness: Текст в целом литературен. Сочетание «собери ко мне» несколько шероховато, но допустимо в возвышенной речи и точно сохраняет направленность к говорящему. Исправление финальной фразы также делает русский смысл яснее.
  terminology: «Мафусаил», «слово» и строчное «дух» уместны. Строчная буква сохраняет отсутствие в геэзском тексте однозначного указания на личностное божественное имя. Сноска о возможном написании «Дух» оправданна.
