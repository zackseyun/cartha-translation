base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/001.yaml
  text: And now[a], my son Methuselah, call all your brothers to me, and gather to me all the children of your mother; for a word calls me, and a spirit of uprightness is poured out upon me[d][c][b], so that I may show you everything that will come upon you forever.
translation:
  language: ru
  text: И теперь, сын мой Мафусаил, позови ко мне всех своих братьев и собери ко мне всех детей своей матери, потому что слово призывает меня и дух излился на меня[a], чтобы я показал вам всё, что ожидает вас во все грядущие времена[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «Дух излился на меня», если речь идёт о Божьем Духе в более личностном смысле.'
    reason: theological_ambiguity
  - marker: b
    text: 'Буквально: «до вечности»; выражение может обозначать также все грядущие времена или поколения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: И теперь
  rationale: Естественный переход к новой речи, сохраняющий непосредственность эфиопского выражения.
- source_word: ማቱሳላ
  choice: Мафусаил
  rationale: Употреблена традиционная русская форма библейского имени.
- source_word: ጸውዕ ሊተ
  choice: позови ко мне
  rationale: Передаёт повеление созвать людей к говорящему без излишней официальности.
- source_word: ኵሎ አኃዊከ
  choice: всех своих братьев
  rationale: Сохранено конкретное родственное обозначение, без обобщения до «родственников».
- source_word: አስተጋብእ ሊተ
  choice: собери ко мне
  rationale: Глагол означает собрать вместе и здесь указывает на собрание в присутствии Еноха.
- source_word: ኵሎ ደቂቀ እምከ
  choice: всех детей своей матери
  rationale: ደቂቅ обозначает детей или потомство; «детей» точнее, чем более узкое «сыновей».
- source_word: እስመ ቃል ይጼውዐኒ
  choice: потому что слово призывает меня
  rationale: Сохранены неопределённость источника слова и образ призвания; русский язык не требует артикля.
- source_word: መንፈስ ትክዕወት ላዕሌየ
  choice: дух излился на меня
  rationale: ትክዕወት понято как глагольная форма со значением «излился», а не как существительное «праведность/прямота»; образ пророческого вдохновения сохранён.
- source_word: ከመ አርእክሙ
  choice: чтобы я показал вам
  rationale: Естественно передаёт целевое значение придаточного предложения, не усиливая «показать» до более толковательного «открыть».
- source_word: ኵሎ ዘይበጽሐክሙ
  choice: всё, что постигнет вас
  rationale: Передаёт значение того, что достигнет адресатов или случится с ними, сохраняя торжественный пророческий тон.
- source_word: እስከ ለዓለም
  choice: навеки
  rationale: Кратко и естественно передаёт предельную временную перспективу выражения, при этом возможный более широкий смысл отмечен в сноске.
theological_decisions:
- issue: Следует ли понимать መንፈስ как обычное «дух» или как личностно обозначенный божественный «Дух»
  choice: дух излился на меня
  alternative: Дух излился на меня
  rationale: В эфиопском тексте нет графического средства, однозначно требующего русского написания с прописной буквы. Основной текст сохраняет неопределённость, а возможное личностное понимание отмечено в сноске.
- issue: Следует ли приписывать слову ትክዕወት значение «праведность/прямота»
  choice: излился
  alternative: дух праведности
  rationale: Форма представляет глагол со значением излияния; чтение «праведность» не поддерживается данной формой и создавало бы отсутствующую в источнике характеристику духа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Синтаксис следует последовательности исходного текста, но остаётся естественным для обычного читателя. Неясность относительно личностного понимания духа и временного охвата заключительной фразы сохранена.
