base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/002.yaml
  text: And after this[a], Methuselah went and called all his brothers to him[b], and gathered his kindred.
translation:
  language: ru
  text: После этого[a] Мафусал пошёл, созвал к себе всех своих братьев и собрал своих родственников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «затем» или «с этого времени».'
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኔሁ
  choice: После этого
  rationale: Форма буквально передаёт исходную точку («от этого», «отсюда»), но в повествовании служит временным переходом. «После этого» естественно выражает последовательность событий, а сноска сохраняет возможный иной оттенок.
- source_word: ሖረ
  choice: пошёл
  rationale: Прямой и естественный русский эквивалент обычного глагола движения; не добавляет значения ухода или отбытия.
- source_word: ማቱሳላ
  choice: Мафусал
  rationale: Использована традиционная русская библейская форма имени Methuselah.
- source_word: ጸውዖሙ
  choice: созвал
  rationale: Глагол означает «позвать, призвать». В контексте нескольких людей «созвал» по-русски ясно передаёт призыв собраться, не придавая ему юридической или обрядовой окраски.
- source_word: ለኵሎሙ አኃዊሁ
  choice: всех своих братьев
  rationale: Сохраняется явное родственное обозначение без архаичного «братия» и без расширения до духовного сообщества.
- source_word: ኀቤሁ
  choice: к себе
  rationale: Предлог обозначает движение к Мафусалу; при совпадении действующего лица и цели русский возвратный оборот «к себе» естественнее буквального «к нему».
- source_word: አስተጋብኦሙ
  choice: собрал
  rationale: Передаёт каузативное значение сведения людей вместе и сохраняет простой повествовательный стиль.
- source_word: አዝማዲ ዚአሁ
  choice: своих родных
  rationale: Выражение обозначает родственников Мафусала. «Родные» понятно современному читателю и не сужает смысл до домочадцев; притяжательное значение передано словом «своих» без добавления «к себе» во второй части.
theological_decisions:
- issue: Объём родственных обозначений
  choice: «братья» и «родные» понимаются как реальные родственники Мафусала
  alternative: понимать «братьев» как членов рода, спутников или духовное сообщество
  rationale: В формулировке стиха нет указаний на метафорическое или конфессиональное употребление; непосредственный контекст и сочетание двух терминов указывают на семейно-родственные связи.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан плавным, но последовательность трёх исходных действий сохранена. Во второй части не добавлено «к себе», поскольку соответствующее выражение ኀቤሁ относится только к созыву братьев.
