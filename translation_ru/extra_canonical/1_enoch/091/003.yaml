base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/003.yaml
  text: 'And he spoke to them all[a], to all the children of righteousness, and said, “Hear, children of Enoch, every word of your father, and listen to the upright words of my mouth; for I speak to you and tell you[c][b], beloved ones: love righteousness and walk in it.”'
translation:
  language: ru
  text: 'И он обратился ко всем им — ко всем детям праведности — и сказал: «Слушайте, дети Еноха, каждое слово вашего отца и внимайте праведным словам моих уст[a], ибо я говорю вам и возвещаю, возлюбленные: любите праведность и ходите в ней».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфиопский текст в этом месте труден. Возможно также: «внимайте должным образом словам моих уст» или «внимайте прямому слову моих уст».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ውሉደ ጽድቅ
  choice: дети праведности
  rationale: Сохраняет буквальный родственный образ и характерное для Еноховой традиции обозначение сообщества; вариант «праведные дети» сгладил бы этот образ.
- source_word: ደቂቀ ሄኖክ
  choice: дети Еноха
  rationale: Передаёт прямое обращение к потомкам или последователям Еноха без излишнего уточнения.
- source_word: ኵሎ ነገረ አቡክሙ
  choice: каждое слово вашего отца
  rationale: Естественно передаёт всеохватность призыва и сохраняет возвышенную библейскую формулу.
- source_word: አጽምኡ
  choice: внимайте
  rationale: Передаёт второй призыв к сосредоточенному слушанию, не повторяя буквально предшествующее «слушайте».
- source_word: ርርትዐ ቃለ አፉየ
  choice: праведным словам моих уст
  rationale: Синтаксис и форма в источнике трудны; выбранное чтение связывает понятие прямоты или праведности со «словами моих уст» и сохраняет семитский образ.
- source_word: አሰምዕ ... ወእነግረክሙ
  choice: я возвещаю вам и говорю вам
  rationale: «Возвещаю» передаёт каузативную силу глагола «дать услышать, объявить», а парный глагол сохраняет риторическое усиление без добавления явно не выраженного значения «увещеваю».
- source_word: ፍቁራን
  choice: возлюбленные
  rationale: Сохраняет торжественную теплоту обращения и соответствует современному литературно-библейскому регистру.
- source_word: ርትዕ
  choice: праведность
  rationale: Это устойчивый этический термин данного контекста; он лучше «справедливости» передаёт качество и образ жизни.
- source_word: ባቲ ሑሩ
  choice: ходите в ней
  rationale: Сохраняет традиционную нравственную метафору хождения и грамматическую отсылку к праведности.
theological_decisions:
- issue: Передача ጽድቅ/ርትዕ как «праведность» или «справедливость»
  choice: праведность
  alternative: справедливость; прямота
  rationale: В увещании это слово обозначает всеобъемлющее нравственное качество и путь жизни, а не только судебную или общественную справедливость; при этом перевод не вкладывает в него позднейшую догматическую систему.
- issue: Сила глагола አሰምዕ
  choice: возвещаю вам
  alternative: даю вам услышать; увещеваю вас; говорю вам
  rationale: «Возвещаю» сохраняет каузативно-декларативную силу и торжественный контекст. «Увещеваю» возможно контекстуально, но сильнее определяет речевой акт, чем позволяет неоднозначное свидетельство источника.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены формулы «дети праведности», «слова моих уст» и «ходите в ней», поскольку они несут важные образы исходного текста; архаизмы вроде «внемлите» и «сыны» не использованы.
