base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/014.yaml
  text: And after this[a], in the ninth week, the righteous judgment will be revealed to the whole world, and all the deeds of the wicked will depart from all the earth; and the world will be written down for destruction[d][c][b], and all people will look to the path of uprightness.
translation:
  language: ru
  text: После этого, в девятую седмину[a], праведный суд откроется всему миру, и все дела нечестивых исчезнут со всей земли; и мир будет записан на погибель[b], и все люди обратят взор к пути праведности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Седмина» здесь означает символическую эпоху священной истории, а не обычную семидневную неделю.
    reason: cultural_note
  - marker: b
    text: 'Выражение в геэзском тексте трудно. Арамейское свидетельство 4Q212 поддерживает понимание: «мир будет записан на погибель»; возможны также понимания: «будет записано о погибели века (или мира)» либо «на вечную погибель».'
    reason: textual_variant
lexical_decisions:
- source_word: በሰንበት ታስዕ
  choice: в девятую седмину
  rationale: В контексте Апокалипсиса седмин речь идёт о символическом периоде священной истории. «Седмина» сохраняет образ семичастного цикла и не создаёт впечатления обычной календарной недели.
- source_word: ኵነኔ ጽድቅ
  choice: праведный суд
  rationale: Передаёт сочетание судебного решения и праведности естественным и торжественным русским выражением.
- source_word: ትትከሠት
  choice: откроется
  rationale: Сохраняет пассивно-возвратный смысл явления или раскрытия суда и соответствует апокалиптическому контексту.
- source_word: ለኵሉ ዓለም
  choice: всему миру
  rationale: Здесь ዓለም обозначает мир как всеобщую сферу, которой будет явлен суд.
- source_word: ተግባረ ረሲዓን
  choice: дела нечестивых
  rationale: Сохраняет конкретное указание на поступки, а не заменяет его отвлечённым понятием зла.
- source_word: ይወፅእ እምዲበ ኵሉ ምድር
  choice: исчезнут со всей земли
  rationale: Глагол буквально выражает уход или выход; в данном контексте «исчезнут» естественно передаёт устранение злых дел, не уточняя способ.
- source_word: ይጽሐፍ ለሐጕለ ዓለም
  choice: мир будет записан на погибель
  rationale: С учётом арамейского свидетельства 4Q212 мир понимается как подлежащее при пассивном глаголе, а «на погибель» — как указание на предназначение. При этом сохраняется необычный образ записи мира.
- source_word: ይኔጽሩ ለፍኖተ ርትዕ
  choice: обратят взор к пути праведности
  rationale: Передаёт направленность глагола «смотреть/взирать» без усиления до повиновения; ፍኖተ имеет единственное число, поэтому употреблено «пути» в единственном числе.
theological_decisions:
- issue: Смысл трудной фразы ይጽሐፍ ለሐጕለ ዓለም
  choice: мир будет записан на погибель
  alternative: будет записано о погибели века; будет записано на вечную погибель
  rationale: Арамейское свидетельство 4Q212 поддерживает синтаксис, при котором «мир» является подлежащим. Перевод не истолковывает образ как конкретную книгу, приговор или предопределение, а сохраняет его необычность и снабжает примечанием.
- issue: Нравственная направленность людей в заключительной фразе
  choice: обратят взор к пути праведности
  alternative: пойдут путём праведности; будут хранить путь праведности
  rationale: Исходный глагол допускает значения взгляда, наблюдения и внимания. Выбранный вариант не превращает направленность к праведному пути в явно утверждённое послушание.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. «Седмина» оставлена как понятный по контексту термин символической схемы и разъяснена в сноске; в остальном архаизмы избегаются.
