base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/013.yaml
  text: And at its completion[a], houses shall be chosen because of their righteousness[c][b], and the house of the great King shall be built in glory forever.
translation:
  language: ru
  text: 'И по её завершении будут избраны дома за их праведность[a], и дом великого Царя[b] будет воздвигнут во славе навеки.


    [a] Буквально «дома»; возможно также: «жилища» или «домочадства». Другая возможная связь слов: «для них будут избраны дома в праведности».

    [b] В данном эсхатологическом контексте «великий Царь», вероятнее всего, означает Бога.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально «дома»; возможно также: «жилища» или «домочадства». Другая возможная связь слов: «для них будут избраны дома в праведности».'
    reason: Лексическая и синтаксическая неоднозначность геэзского выражения.
  - marker: b
    text: В данном эсхатологическом контексте «великий Царь», вероятнее всего, означает Бога.
    reason: Уточнение вероятной референции царского титула без устранения смысловой открытости.
lexical_decisions:
- source_word: በተፍጻሜታ
  choice: по её завершении
  rationale: Временное выражение с существительным от корня «завершать, доводить до конца»; местоимение женского рода сохраняет отсылку к предшествующей апокалиптической седмице.
- source_word: ይመረዩ
  choice: будут избраны
  rationale: Перевод сохраняет пассивное значение засвидетельствованной формы и не вводит предположительную эмендацию «приобретут».
- source_word: አብያተ
  choice: дома
  rationale: Конкретный образ домов сохранён, поскольку он перекликается с последующим «домом великого Царя»; возможные значения «жилища» и «домочадства» вынесены в примечание.
- source_word: እምጽድቅ ዚአሆሙ
  choice: за их праведность
  rationale: Передаёт ዚአሆሙ как притяжательное определение к «праведности» и понимает እም в причинном смысле; синтаксическая альтернатива сохранена в примечании.
- source_word: ወይትሐነጽ
  choice: и ... будет воздвигнут
  rationale: Глагол означает строительство; «воздвигнут» естественно передаёт возвышенный архитектурный образ.
- source_word: ቤት ንጉሥ ዐቢይ
  choice: дом великого Царя
  rationale: Сохранено буквальное «дом», допускающее одновременно храмовый и царский оттенки; прописная буква отмечает вероятную божественную референцию, не заменяя титул толкованием.
- source_word: በስብሐት
  choice: во славе
  rationale: Сохраняет предлог и широкий смысл существительного «слава, великолепие».
- source_word: እስከ ለዓለም
  choice: навеки
  rationale: Естественный современный русский эквивалент идиомы вечной продолжительности.
theological_decisions:
- issue: Кого означает «великий Царь»
  choice: Вероятная отсылка к Богу обозначена прописной буквой и пояснена в примечании.
  alternative: Земной царь идеальной эпохи либо общий царский образ.
  rationale: Эсхатологический контекст делает божественную референцию наиболее вероятной, однако сам титул оставлен без догматического уточнения.
- issue: Образ избранных домов
  choice: Сохранено конкретное «дома».
  alternative: Абстрагирующий перевод «будут избраны праведники» или толкование как выделение жилищ праведным.
  rationale: В геэзском тексте прямо названо множество домов, а во второй половине стиха появляется дом великого Царя; сохранение параллельной архитектурной образности избегает конфессионального или интерпретационного сглаживания.
- issue: Грамматическая роль አብያተ при форме ይመረዩ
  choice: 'Переведено как пассивная конструкция: «будут избраны дома».'
  alternative: Конъектуральное чтение «они приобретут дома».
  rationale: Предоставленный оригинальный текст содержит форму ይመረዩ, соответствующую избранию; перевод не подменяет её предположительной OCR-реконструкцией, хотя морфосинтаксис фразы не вполне прозрачен.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. «Воздвигнут», «во славе» и «навеки» поддерживают торжественный ритм, оставаясь понятными современному читателю; архитектурная параллель «дома — дом» намеренно сохранена.
