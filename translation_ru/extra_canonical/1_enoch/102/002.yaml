base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/002.yaml
  text: And all the luminaries shall be shaken with great fear[b][a], and the whole earth shall be shaken and tremble and quake.
translation:
  language: ru
  text: И все светила[a] содрогнутся от великого страха, и вся земля поколеблется, задрожит и ужаснётся.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все светы». Эфиопское слово может обозначать всё светящееся; здесь, вероятнее всего, имеются в виду небесные светила.'
    reason: lexical_alternative
  - marker: b
    text: 'Последнее слово в дошедшей транскрипции, вероятно, искажено. Возможное восстановление означает «ужаснётся» или «будет объята страхом»; при ином прочтении: «сотрясётся».'
    reason: textual_uncertainty
lexical_decisions:
- source_word: ኵሎሙ ብርሃናት
  choice: все светила
  rationale: ብርሃናት буквально означает «светы» или «светящиеся тела»; в картине космического суда русское «светила» естественно указывает на небесные светила, не исключая полностью более широкого смысла.
- source_word: ይትመሀከዉ / ትትመሀከው
  choice: содрогнутся / поколеблется
  rationale: Повторённый глагол обозначает сильное потрясение или движение. Разные, но близкие русские соответствия сохраняют параллель между светилами и землёй и избегают тяжеловесного дословного повтора.
- source_word: በፍርሀት ዐቢይ
  choice: от великого страха
  rationale: Предлог допускает оттенки причины, состояния или сопутствующего обстоятельства. «От великого страха» естественно передаёт связь потрясения со страхом.
- source_word: ኵላ ምድር
  choice: вся земля
  rationale: Контекст всеобщего космического потрясения указывает на землю в целом, а не на отдельную страну или область.
- source_word: ትርዕድ
  choice: задрожит
  rationale: Отдельный глагол усиливает образ и передаёт дрожь, не сливая её полностью с предшествующим «поколеблется».
- source_word: вероятное ትደነግፅ за повреждённым ትኜጕድ
  choice: ужаснётся
  rationale: Переданная в задании форма, по всей вероятности, искажена при распознавании. Восстановленный глагол означает испуг или ужас и продолжает олицетворение земли; ввиду неуверенности это отмечено в сноске.
theological_decisions:
- issue: Обозначает ли ብርሃናት небесные тела или ангельских существ
  choice: небесные светила
  alternative: «светы» вообще или «сияющие» как одушевлённые существа
  rationale: Сопоставление со всей землёй и мотив космического потрясения благоприятствуют астрономическому пониманию. Слово «светила» сохраняет возвышенную апокалиптическую образность без прямого отождествления с ангелами.
- issue: Является ли последнее действие земли физическим сотрясением или переживанием ужаса
  choice: ужаснётся
  alternative: «сотрясётся»
  rationale: Вероятное восстановление повреждённого эфиопского чтения обозначает страх или ужас. Это сохраняет олицетворение земли и смысловую перекличку с великим страхом светил, не превращая все три глагола в синонимы физического колебания.
translation_notes:
  register: Современный литературный русский с торжественной апокалиптической интонацией. Трёхчастное нарастание «поколеблется, задрожит и ужаснётся» сохраняет ритм исходного ряда и олицетворение земли; архаизмы и конфессионально окрашенные формулы не используются.
