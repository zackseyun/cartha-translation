base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/003.yaml
  text: And all the angels will carry out their commands[a], and they will seek to hide themselves from before the Great Glory; and the children of the earth will tremble and be thrown into confusion. But you sinners are accursed forever[d][c][b], and there will be no peace for you.
translation:
  language: ru
  text: И все ангелы исполнят повеление, данное им[a], и пожелают скрыться от Великой Славы[b]; сыны земли[c] задрожат и придут в смятение. А вы, грешники, прокляты навеки, и не будет вам мира.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В эфиопском тексте стоит существительное в единственном числе с суффиксом «их»: «их повеление». Единственное число поддерживается и греческим свидетельством; некоторые переводы передают его во множественном числе.'
    reason: textual_grammar
  - marker: b
    text: 'Буквально: «из-перед Великой Славы», то есть «от присутствия Великой Славы». Это выражение может быть благоговейным обозначением Божьего присутствия, хотя Бог прямо не назван.'
    reason: lexical_theological_ambiguity
  - marker: c
    text: «Сыны земли» — буквальный образ, который здесь может широко обозначать обитателей земли, прежде всего людей перед лицом суда.
    reason: lexical_alternative
lexical_decisions:
- source_word: መላእክት
  choice: ангелы
  rationale: В апокалиптическом контексте речь идёт о небесных существах, а не о человеческих посланниках.
- source_word: ይፌጽሙ ትእዛዞሙ
  choice: исполнят своё повеление
  rationale: Глагол передаёт доведение до исполнения, а форма ትእዛዞሙ морфологически допускает понимание как существительного в единственном числе с местоименным суффиксом; единственное число также поддерживается греческим τὸ πρόσταγμα αὐτῶν. Русское «своё» естественно соотносит повеление с подлежащим, не уточняя его источник.
- source_word: ይፈቅዱ ከመ ይትኀብኡ
  choice: пожелают скрыться
  rationale: Сохраняет основное значение «желать, хотеть» и возвратный смысл следующего глагола, не усиливая выражение до уверенной попытки.
- source_word: እምቅድመ ዐቢይ ስብሐት
  choice: от Великой Славы
  rationale: «От» естественно передаёт семитское «из-перед, от лица» в русском; прописные буквы сохраняют вероятную функцию выражения как благоговейного обозначения Божьего присутствия, не заменяя его словом «Бог».
- source_word: ደቂቀ ምድር
  choice: сыны земли
  rationale: Сохраняет буквальный родственный образ и характерный возвышенный апокалиптический строй.
- source_word: ይርዕዱ ወይትሀወኩ
  choice: задрожат и придут в смятение
  rationale: Передаёт телесный страх и последующую растерянность естественным современным русским выражением.
- source_word: ርጉማን ለዓለም
  choice: прокляты навеки
  rationale: Кратко и торжественно воспроизводит формулу окончательного суда.
- source_word: ወአልብክሙ ሰላመ
  choice: и не будет вам мира
  rationale: Сохраняет прямую, библейски звучащую формулу без сужения «мира» до безопасности или благополучия.
theological_decisions:
- issue: Значение выражения «Великая Слава»
  choice: Сохранено как благоговейное именование с прописных букв
  alternative: «великая слава» как безличное небесное сияние; либо явное «Бог»
  rationale: В 1 Еноха выражение может служить обозначением Божьего величия и присутствия, однако исходный текст прямо не называет Бога. Перевод сохраняет и титульный оттенок, и исходную недосказанность.
- issue: Чьё повеление исполняют ангелы
  choice: «своё повеление» без указания отдающего его лица
  alternative: «его повеление», что прямо указывало бы на Бога; либо «их повеления» во множественном числе
  rationale: Местоименный суффикс относится к ангелам, тогда как источник повеления в данной строке не назван. Формулировка не вносит отсутствующего референта.
translation_notes:
  register: Современный литературный русский с торжественным апокалиптическим ритмом. Сохранены характерные образы «Великая Слава», «сыны земли» и «не будет вам мира», но синтаксис сделан ясным для обычного современного читателя.
