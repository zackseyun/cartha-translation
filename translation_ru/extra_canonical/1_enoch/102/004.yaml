base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/004.yaml
  text: Do not fear[a], you souls of the righteous, and hope, you who have died in righteousness.
translation:
  language: ru
  text: Не бойтесь, души праведных[a], и надейтесь, вы, умершие в праведности.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духи праведных». Эфиопское слово в зависимости от контекста может означать душу, жизнь, самого человека или дух.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አትፍርሁ
  choice: Не бойтесь
  rationale: Отрицательное повеление во множественном числе передано прямым и естественным современным русским призывом.
- source_word: አንትሙ
  choice: вы
  rationale: Явное местоимение второго лица множественного числа отражено формами обращения и повелительного наклонения.
- source_word: ነፍሰ ጻድቃን
  choice: души праведных
  rationale: В посмертном контексте «души» естественно обозначает сохраняющих личную тождественность умерших праведников, не вводя жёсткого разграничения души и духа.
- source_word: ወተስፈዉ
  choice: и надейтесь
  rationale: Повелительный смысл и параллелизм с первым призывом сохранены.
- source_word: እለ ሞትክሙ
  choice: вы, умершие
  rationale: Относительная конструкция с формой второго лица множественного числа передана как непосредственное обращение.
- source_word: በጽድቅ
  choice: в праведности
  rationale: Сохранена именная форма ключевого понятия, без сведения его к наречию «праведно».
theological_decisions:
- issue: Антропологическое обозначение умерших праведников
  choice: души праведных
  alternative: духи праведных
  rationale: Выбор сохраняет посмертную личную тождественность адресатов, но сноска оставляет открытой присущую эфиопскому слову лексическую неоднозначность и не превращает его в специальный термин.
translation_notes:
  register: Современный литературный русский язык; прямое, торжественное, но не архаичное увещание. Синтаксис сохраняет два параллельных повеления и обращение к умершим праведникам.
