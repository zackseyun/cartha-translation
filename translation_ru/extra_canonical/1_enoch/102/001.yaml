base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/001.yaml
  text: In those days[a], if a fierce fire descends upon you, where will you flee, and where will you be delivered? And when he lifts up his voice against you[d][c][b], will you not be shaken and fear?
translation:
  language: ru
  text: В те дни, если на вас сойдёт грозный огонь[a], куда вы убежите и где найдёте избавление? И когда он возвысит против вас свой голос[b], разве вы не содрогнётесь и не устрашитесь?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Определение при слове «огонь» может означать также «необычайный», «поразительный» или «страшный»; здесь оно, вероятно, описывает разрушительный огонь, внушающий ужас.
    reason: lexical_alternative
  - marker: b
    text: Буквально — «возвысит (или издаст) свой голос». Слово, переведённое как «голос», может также означать «слово» и в контексте суда иметь оттенок властного решения или приговора.
    reason: lexical_alternative
  - marker: c
    text: 'Это риторический вопрос: подразумевается, что они непременно содрогнутся и устрашатся.'
    reason: cultural_note
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: В те дни
  rationale: Сохранена характерная для апокалиптической речи временная формула в естественном и возвышенном русском звучании.
- source_word: ዕፁብ እሳት
  choice: грозный огонь
  rationale: Прилагательное допускает значения необычайного, поразительного и страшного; «грозный» передаёт внушающий ужас и разрушительный характер огня, не сводя слово к одному узкому оттенку.
- source_word: በአይቴ ትነፍፁ
  choice: куда вы убежите
  rationale: Прямо передаёт вопрос о направлении бегства и сохраняет риторическую силу.
- source_word: በአይቴ ትድኅኑ
  choice: где найдёте избавление
  rationale: Передаёт семантику спасения и освобождения в контексте суда, при этом звучит естественнее по-русски, чем пассивная конструкция «где будете избавлены».
- source_word: ይወዲ ቃሎ
  choice: он возвысит ... свой голос
  rationale: Активный глагол и объект с местоименным суффиксом переданы как действие мужского субъекта; выражение понимается как идиома произнесения или возвышения голоса. Строчная буква не отождествляет не названного в самом стихе субъекта заранее с Богом.
- source_word: አኮ ትትመሀከዉ
  choice: разве вы не содрогнётесь
  rationale: Отрицательный риторический вопрос предполагает утвердительный ответ; «содрогнётесь» передаёт сильное потрясение и сохраняет апокалиптическую напряжённость.
- source_word: ወትፈርሁ
  choice: и не устрашитесь
  rationale: Сохраняет параллелизм с предыдущим глаголом и ясно передаёт страх.
theological_decisions:
- issue: Кого обозначает подлежащее «он» в выражении ይወዲ ቃሎ
  choice: Сохранено местоимение «он» со строчной буквы без поясняющего имени
  alternative: «Он» с прописной буквы как явное указание на Бога
  rationale: Форма указывает на мужской субъект, однако данный стих сам по себе его не называет. Перевод не должен устранять эту референциальную неоднозначность.
- issue: Передавать ли ቃሎ как «голос» или как судебное «слово/приговор»
  choice: В основном тексте употреблено «свой голос»
  alternative: «своё слово» или «свой приговор»
  rationale: В сочетании с активным глаголом выражение имеет идиоматическое значение возвышения или издания голоса. Возможный оттенок властного судебного слова отмечен в сноске, но не внесён в текст как однозначное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис сохранён кратким и энергичным; архаизмы и конфессионально окрашенная терминология не использованы.
