base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/005.yaml
  text: And do not grieve if your soul has gone down into Sheol in sorrow[a], and your flesh did not fare according to your goodness during your life; but wait for the day of the judgment of sinners[c][b], and for the day of curse and punishment.
translation:
  language: ru
  text: И не скорбите, если душа ваша сошла в Шеол[a] в печали, а плоть ваша при жизни не обрела того, что соответствовало вашей доброте[b]. Но ждите дня суда над грешниками и дня проклятия и наказания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шеол — царство мёртвых в древнеиудейских представлениях; это слово не обязательно означает ад в позднейшем христианском понимании.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «плоть ваша при жизни не получила согласно вашей доброте». В исходном тексте не сказано, что именно она не получила; вероятно, имеется в виду не полученное при земной жизни должное воздаяние.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አት ኅዘኑ
  choice: не скорбите
  rationale: Отрицательное повеление во множественном числе; «скорбеть» естественно передаёт сильную печаль и сохраняет достоинство тона.
- source_word: ወረደት ነፍስክሙ ውስተ ሲኦል
  choice: душа ваша сошла в шеол
  rationale: Глагол прямо обозначает нисхождение. «Шеол» сохраняет иудейский образ царства мёртвых и не подменяет его позднейшим понятием ада.
- source_word: በሐዘን
  choice: в печали
  rationale: Сохраняет эмоциональную окраску нисхождения души и смысловую перекличку с запретом скорбеть.
- source_word: ኢረከበ ሥጋክሙ በሕይወትክሙ
  choice: плоть ваша при жизни не обрела
  rationale: «Плоть» удерживает телесный и богословски значимый образ оригинала. У глагола «обрести/получить» в исходном тексте не назван объект, поэтому он раскрыт лишь минимально последующим нейтральным местоименным оборотом.
- source_word: በከመ ኂሩትክሙ
  choice: того, что соответствовало вашей доброте
  rationale: Передаёт соотнесённость с добротой адресатов, не уточняя сверх текста, идёт ли речь о награде, воздаянии или земном благополучии.
- source_word: አላ ጽንሑ
  choice: но ждите
  rationale: Противительный переход направляет взгляд от нынешнего лишения к будущему дню; «ждите» естественно сочетается с дальнейшим указанием времени и допускает оттенок стойкости.
- source_word: ለዕለተ እንተ ኵነኔ ኃጥኣን
  choice: дня суда над грешниками
  rationale: Сохраняет апокалиптическую судебную формулу и ясно указывает грешников как тех, над кем совершается суд.
- source_word: መርገም ወመቅሠፍት
  choice: проклятия и наказания
  rationale: Компактно передаёт парное обозначение грядущей участи нечестивых, не конкретизируя способ наказания.
theological_decisions:
- issue: Значение ሲኦል
  choice: шеол
  alternative: могила; преисподняя; ад
  rationale: Транслитерация сохраняет древнеиудейское представление о царстве мёртвых и не привносит более позднее христианское содержание слова «ад».
- issue: Не названный объект глагола ረከበ в высказывании о плоти
  choice: не обрела того, что соответствовало вашей доброте
  alternative: не получила награды за вашу доброту; не благоденствовала сообразно вашей доброте
  rationale: Контекст предполагает, что праведные при земной жизни не получили соответствующего их доброте удела, однако оригинал не называет ни «награды», ни конкретного благополучия. Формулировка оставляет это открытым.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис сделан естественным для русского, при этом сохранены ключевые образы «душа», «плоть», «шеол», «день суда» и не устранена смысловая открытость фразы о неполученном земном уделе.
