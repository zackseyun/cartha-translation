  text: And when you die[a], the sinners will say concerning you[b],
translation:
  language: ru
  text: И когда вы умрёте, грешники скажут о вас:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «грешники будут говорить против вас». Буквально предлог имеет значение «на/над», но здесь, вероятно, указывает на тех, о ком говорится.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሶበ
  choice: И когда
  rationale: Союз с присоединительным ወ вводит временное обстоятельство; «и когда» естественно передаёт связь с предшествующим контекстом без усиления противопоставления.
- source_word: ትመውቱ
  choice: вы умрёте
  rationale: Форма второго лица множественного числа от обычного глагола «умирать»; русское будущее естественно после «когда» и сохраняет прямое обращение.
- source_word: ይብሉ
  choice: скажут
  rationale: Основное значение глагола — «сказать»; здесь он служит рамкой для последующей речи, поэтому «скажут» точнее, чем завершённое по смыслу «будут говорить».
- source_word: ላዕሌክሙ
  choice: о вас
  rationale: Предлог буквально связан со значениями «на/над», но при глаголе речи может обозначать тему высказывания; «о вас» сохраняет широту выражения и не навязывает враждебный оттенок.
- source_word: ኃጥኣን
  choice: грешники
  rationale: Устойчивое нравственное обозначение группы людей в апокалиптическом контексте; определённость в русском языке выражается контекстом без артикля.
theological_decisions:
- issue: Характер речи грешников об умерших праведниках
  choice: грешники скажут о вас
  alternative: грешники будут говорить против вас
  rationale: Предлог допускает более враждебное понимание, однако конструкция, вероятно, вводит следующую прямую речь. Нейтральное «о вас» не закрывает синтаксическое продолжение и сохраняет контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified формулировка сохраняет незавершённость исходной фразы, поскольку далее ожидаются слова грешников.
