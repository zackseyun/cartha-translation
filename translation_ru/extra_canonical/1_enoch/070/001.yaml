base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/070/001.yaml
  text: And it came to pass after this that his name was lifted up during his lifetime before that Son of Man and before the Lord of Spirits[b][a], away from those who dwell on the dry ground.
translation:
  language: ru
  text: И после этого случилось, что имя его при жизни было вознесено[a] перед тем Сыном Человеческим и перед Господом духов — из среды тех, кто обитает на суше[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «имя его было вознесено». Выражение может подразумевать, что сам Енох ещё при жизни был взят в присутствие Сына Человеческого и Господа духов.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «от тех, кто обитает на земле». В геэзском тексте конкретнее сказано: «на суше».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተለዓለ፡
  choice: было вознесено
  rationale: Передаёт направленное вверх движение и сохраняет возможность понимать выражение и как взятие ввысь, и как возвышение, не сводя его заранее к одному толкованию.
- source_word: ስሙ፡
  choice: имя его
  rationale: Сохранено буквальное «имя», поскольку в семитско-эфиопской речи имя может тесно отождествляться с самой личностью; замена на «он» или «слава его» устранила бы значимую неоднозначность.
- source_word: ሕያው፡
  choice: при жизни
  rationale: 'Естественно по-русски выражает временной смысл: событие произошло, пока Енох был жив.'
- source_word: በኀቤሁ፡ ለውእቱ፡ ወልደ፡ እጓለ፡ እመሕያው፡
  choice: к тому Сыну Человеческому
  rationale: Предлог передан как движение к названной фигуре; указательное «тому» отражает текст, а прописные буквы отмечают титульное употребление в контексте Притч Еноха.
- source_word: እግዚአ፡ መናፍስት፡
  choice: Господу духов
  rationale: Сохраняет устойчивый торжественный титул книги без конфессионального уточнения того, о каких именно духах идёт речь.
- source_word: እምእለ፡ የኃድሩ፡ ዲበ፡ የብስ።
  choice: из среды тех, кто обитает на суше
  rationale: «Суша» конкретнее общего «земля» и сохраняет пространственно-космологический образ; «из среды» естественно передаёт удаление от земных обитателей.
theological_decisions:
- issue: Следует ли истолковать выражение «имя его было вознесено» непосредственно как вознесение самого Еноха
  choice: Сохранить в основном тексте буквальный образ «имя его… было вознесено»
  alternative: «он был живым взят на небо» или «слава его была возвеличена»
  rationale: Геэзский текст прямо называет «его имя». В апокалиптическом контексте имя и личность могут сближаться, однако перевод не должен устранять напряжение между буквальным выражением и подразумеваемым взятием самого Еноха.
- issue: Статус выражения «Сын Человеческий»
  choice: Передать как титул «тот Сын Человеческий»
  alternative: «тот сын человеческий» или «тот Человек»
  rationale: В данном разделе выражение имеет весомую титульную функцию. Прописные буквы передают её, не отождествляя фигуру посредством перевода с какой-либо позднейшей доктринальной формулировкой.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным апокалиптическим звучанием. Необычный образ «имя его было вознесено» намеренно сохранён; тире подчёркивает пространственный переход от живущих на суше к небесному присутствию.
