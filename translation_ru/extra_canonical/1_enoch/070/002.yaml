- from: После этого имя его ещё при жизни было вознесено из среды живущих на суше — к тому Сыну Человеческому и к Господу духов. И он был вознесён на колесницах духа[a] и появился там среди них[b]. С того дня я уже не был причислен к ним. Он поместил меня между двумя ветрами — между севером и западом, — там, где ангелы взяли мерные верви, чтобы отмерить мне место для избранных и праведных. Там я увидел праотцов и праведников, которые издревле обитают в том месте.
