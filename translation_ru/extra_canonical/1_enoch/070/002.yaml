  yaml_path: translation/extra_canonical/1_enoch/070/002.yaml
  text: And he was lifted up on the chariot of the spirit[b][a], and his name vanished from among them.
translation:
  language: ru
  text: После этого его имя при жизни было вознесено к тому Сыну Человеческому и к Господу духов из среды живущих на земле. И он был вознесён на колесницах духа[a], и имя его распространилось среди них[b]. С того дня я уже не был причислен к ним. Он поместил меня между двумя ветрами — между северным и западным, — там, где ангелы взяли мерные верви, чтобы отмерить мне место среди избранных и праведников. Там я увидел древних отцов и праведников, которые от века обитают в том месте.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на духовных колесницах». Эфиопский оборот не уточняет характер связи между колесницами и духом.'
    reason: lexical_ambiguity
  - marker: b
    text: 'Буквально: «и имя его вышло среди них». Глагол допускает мысль о том, что имя стало известно или распространилось среди них. В иной текстовой форме фразу передают: «и имя его исчезло из их среды».'
    reason: textual_variant
lexical_decisions:
- source_word: ተለዐለ
  choice: было вознесено / был вознесён
  rationale: Форма передаёт восхождение или поднятие и допускает страдательное понимание. «Вознесено» сохраняет образ движения вверх, не уточняя, было ли оно телесным, видéнным в откровении или почётным возвышением.
- source_word: ሠረገላተ፡ መንፈስ
  choice: колесницах духа
  rationale: Сохраняется конкретный апокалиптический образ и формальная связь существительных; не уточняется, означает ли оборот колесницы, движимые духом, принадлежащие духу или имеющие духовную природу.
- source_word: ወወፅአ፡ ስም፡ በማእከሎሙ
  choice: и появился там среди них
  rationale: В представленном эфиопском тексте ስም естественно читается как наречие «там», а ወፅአ — как «вышел, явился». Перевод следует данному свидетелю, а не иной редакции, лежащей за английским «his name vanished from among them».
- source_word: ኢተስሕብኩ፡ በማእከሎሙ
  choice: я уже не был причислен к ним
  rationale: В контексте отделения Еноха оборот передаёт прекращение его принадлежности к числу прежней группы; буквальное «не был привлечён среди них» по-русски затемняет смысл.
- source_word: መስዕ፡ ወዐረብ
  choice: севером и западом
  rationale: Это обозначения сторон света; перевод смыслом естественнее буквальных этимологических соответствий.
- source_word: አሕባላተ
  choice: мерные верви
  rationale: «Верёвки/верви» используются для отмеривания места. Добавленное определение «мерные» ясно выражает указанную далее функцию, не меняя предметного образа.
- source_word: አበወ፡ ቀደምተ
  choice: праотцов
  rationale: Естественное и dignified русское обозначение древних отцов, увиденных Енохом.
theological_decisions:
- issue: Характер вознесения Еноха
  choice: Сохранён образ страдательного вознесения без определения его природы
  alternative: Истолковать событие как телесное переселение, чисто визионерский перенос или почётное возвышение
  rationale: Эфиопский глагол и апокалиптический контекст указывают на движение вверх, но сами по себе не разрешают богословскую неоднозначность.
- issue: «Сын Человеческий» как титул
  choice: Сохранено титульное написание «Сын Человеческий»
  alternative: Передать как нарицательное «сын человеческий»
  rationale: Указательное «тот» и контекст Притч Еноха поддерживают титульное употребление, при этом перевод не добавляет позднейшей конфессиональной идентификации.
- issue: Переход от третьего лица к первому
  choice: 'Резкий переход сохранён: «он был вознесён» — «я уже не был причислен»'
  alternative: Унифицировать повествование в первом лице
  rationale: Смена лица присутствует в источнике и может отражать литературное напряжение или историю текста; её не следует молча сглаживать.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим регистром. Синтаксис сделан ясным для обычного читателя, но сохранены предметные образы, повторения, смена повествовательного лица и богословская неопределённость источника.
