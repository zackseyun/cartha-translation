base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/020.yaml
  text: And by that oath the sun and the moon complete their courses[d][c][b][a], and they do not transgress their command forever.
translation:
  language: ru
  text: И в силу той клятвы солнце и луна завершают свои пути[a] и вовек[c] не отступают от данного им повеления[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свои круги»; речь идёт о регулярном движении небесных светил.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможен также перевод: «не переходят за пределы их повеления». Местоименная форма может указывать на повеление, назначенное солнцу и луне.'
    reason: lexical_alternative
  - marker: c
    text: 'Выражение при отрицательном глаголе можно передать также: «никогда не отступают».'
    reason: alternative_reading
lexical_decisions:
- source_word: በውእቱ፡ ማሐላ
  choice: в силу той клятвы
  rationale: 'Предлог በ- здесь естественно понимать инструментально: установленный порядок действует посредством или в силу клятвы. Русское выражение сохраняет одновременно причинно-инструментальный и торжественно-юридический оттенок.'
- source_word: ፀሐይ፡ ወወርኅ
  choice: солнце и луна
  rationale: Прямое обозначение двух небесных светил; контекст допускает их поэтическое представление как действующих участников космического порядка.
- source_word: ይፌጽሙ
  choice: завершают
  rationale: Глагол передаёт доведение назначенного движения до конца; «завершают» сохраняет этот смысл без сведения выражения только к исполнению нравственной обязанности.
- source_word: ምሕዋሮሙ
  choice: свои пути
  rationale: Слово обозначает движение, путь или круговое прохождение небесных тел. «Пути» естественно звучит по-русски и не навязывает тексту современную астрономическую модель орбит.
- source_word: ወኢየሐልፉ፡ እምትእዛዞሙ
  choice: не отступают от данного им повеления
  rationale: Сочетание глагола ሐለፈ с እም передаёт удаление, уклонение или выход за пределы. Формулировка сохраняет образ неизменного подчинения установленному повелению и юридический оттенок текста.
- source_word: እምዓለም
  choice: вовек
  rationale: При отрицательном глаголе выражение обозначает неограниченную длительность — «никогда» или «вовек». «Вовек не отступают» одновременно естественно и уместно для возвышенного апокалиптического регистра.
theological_decisions:
- issue: Следует ли передавать стих нейтральным астрономическим языком или сохранять язык клятвы и повеления
  choice: Сохранены слова «клятва», «повеление» и образ неотступного подчинения
  alternative: «Следуют своим циклам и никогда не отклоняются от установленного порядка»
  rationale: В оригинале космическая регулярность выражена юридически окрашенными словами о клятве и повелении. Нейтрализация ослабила бы характерную для апокалиптического текста связь между устройством творения и обязательностью установленного порядка.
- issue: Кому принадлежит повеление, обозначенное формой с местоименным суффиксом
  choice: «данного им повеления»
  alternative: 'Буквально: «их повеления»'
  rationale: В контексте речь идёт не о распоряжении, которое солнце и луна сами отдают, а о норме, назначенной для них. Русская формулировка делает синтаксическое отношение ясным, не называя отдельно того, кто дал повеление.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Избегаются как церковнославянизмы, затрудняющие понимание, так и современная научная терминология, которой нет в источнике.
