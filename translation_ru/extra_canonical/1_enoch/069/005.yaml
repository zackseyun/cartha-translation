base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/005.yaml
  text: And the second[a], whose name was Asbe'el—this one taught the evil counsel to the holy sons of God[c][b], and led them astray so that they defiled their bodies with the daughters of men.
translation:
  language: ru
  text: И второй, по имени Асбээл, — он научил сынов святых ангелов[a] злому замыслу и ввёл их в заблуждение, чтобы они осквернили свою плоть с дочерьми человеческими[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «святым сынам ангелов» или «сынам святых ангелов». Эфиопская конструкция синтаксически неоднозначна; греческого или кумранского текста для проверки этого места нет.'
    reason: alternative_reading
  - marker: b
    text: 'Или: «посредством дочерей человеческих». Эфиопский предлог может выражать как совместность, так и средство.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልእ
  choice: второй
  rationale: 'В данном контексте слово обозначает второй элемент явно нумерованного перечня: рядом упомянуты первый, третий и четвёртый.'
- source_word: አስብኤል
  choice: Асбээл
  rationale: Имя передано транслитерацией; раздельное звучание гласных отражено буквой «э» после «б» без внесения толкования в состав имени.
- source_word: አመርሙ
  choice: открыл
  rationale: Передаёт каузативный смысл сообщения или раскрытия знания; в данном контексте речь идёт о том, что персонаж сделал известным пагубный замысел.
- source_word: ምክረ እኩየ
  choice: злой замысел
  rationale: «Замысел» естественно передаёт идею пагубного совета или умысла и сохраняет нравственную оценку исходного выражения.
- source_word: ለደቂቀ መላእክት ቅዱሳን
  choice: сынам святых ангелов
  rationale: Сохраняет все лексические компоненты трудной конструкции и наиболее прямо связывает множественное определение «святых» с ближайшим словом «ангелов»; синтаксическая неоднозначность отмечена в сноске.
- source_word: አስሐቶሙ
  choice: ввёл их в заблуждение
  rationale: Передаёт как обман, так и побуждение уклониться с верного пути.
- source_word: ከመ ያማስኑ
  choice: чтобы они осквернили
  rationale: Русская целевая конструкция сохраняет возможный оттенок цели, не исключая подразумеваемого результата.
- source_word: ሥጋሆሙ
  choice: свою плоть
  rationale: Буквально сохраняет образ плоти; возвратное местоимение естественно указывает на плоть тех же действующих лиц.
- source_word: በአዋልደ ሰብእ
  choice: с дочерьми человеческими
  rationale: Передаёт подразумеваемую половую связь и узнаваемую формулу предания о Стражах; возможное инструментальное значение предлога отмечено в сноске.
theological_decisions:
- issue: Синтаксическая связь в выражении ለደቂቀ መላእክት ቅዱሳን
  choice: сынам святых ангелов
  alternative: святым сынам ангелов; святым сынам Божьим
  rationale: Эфиопская конструкция трудна и не имеет здесь надёжного греческого или кумранского параллельного текста. Основной перевод следует поверхностному синтаксису и не заменяет слово «ангелы» словом «Бог»; альтернативная связь определения вынесена в сноску.
- issue: Передача ሥጋ в сцене осквернения
  choice: плоть
  alternative: тела
  rationale: «Плоть» точнее сохраняет исходный образ и богословское напряжение между телесностью и осквернением, оставаясь понятной в современном русском языке.
- issue: Цель или результат в ከመ
  choice: чтобы они осквернили
  alternative: так что они осквернили
  rationale: Конструкция допускает целевой либо результативный оттенок. Русское «чтобы» сохраняет возможную целенаправленность введения в заблуждение, не добавляя причинных подробностей.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, подходящим древнему апокалиптическому тексту звучанием. Формула «дочери человеческие» сохранена как ясная библейская аллюзия; архаические синтаксические обороты избегаются.
