base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/011.yaml
  text: For human beings were not created except to be like the angels[a], so that they might remain pure and righteous; and death, which destroys everything, would not have touched them. But through this knowledge they are being destroyed[d][c][b], and through this power it is consuming me.
translation:
  language: ru
  text: Ведь люди были созданы не иначе как для того, чтобы быть подобными ангелам[a] и оставаться чистыми и праведными; и смерть, которая всё разрушает, не коснулась бы их. Но из-за этого знания они гибнут[b], и этой силой пожирает меня[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «быть как ангелы». Речь идёт о подобии ангелам, а не обязательно о превращении людей в ангелов.'
    reason: lexical_alternative
  - marker: b
    text: 'Оборот труден. Эфиопский текст можно также передать: «через это понимание они погибают». Неясно и то, какое именно знание имеется в виду.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «и этой силой пожирает меня». Подлежащее в заключительной строке не названо; «сила» передана как средство действия. В этом месте нет надёжного греческого или кумранского параллельного текста, поэтому образ и неопределённость эфиопского свидетельства сохранены.'
    reason: textual_variant
lexical_decisions:
- source_word: ኢተፈጥረ ሰብእ ዘእንበለ
  choice: люди были созданы лишь для того
  rationale: Сохраняет явный пассив творения и ограничительное значение оборота; коллективное «люди» естественно согласуется с последующими формами множественного числа.
- source_word: ከመ መላእክት
  choice: уподобиться ангелам
  rationale: Передаёт сравнение, а не тождество людей и ангелов; инфинитив естественно связан с целью творения.
- source_word: ይንበሩ ንጹሓነ ወጻድቃነ
  choice: оставаться чистыми и праведными
  rationale: Глагол описывает продолжающееся состояние, а прилагательные сохраняют нравственно-религиозный вес оригинала.
- source_word: ሞት ዘኵሉ ያማሥን
  choice: смерть, которая всё разрушает
  rationale: Сохраняет олицетворение смерти и всеохватность относительного оборота.
- source_word: እመ ኢገሰሶሙ
  choice: не коснулась бы их
  rationale: Условное наклонение передаёт контрфактический смысл; образ соприкосновения со смертью сохранён.
- source_word: በዝ አእምሮቶሙ
  choice: из-за этого знания
  rationale: «Знание» наиболее прямо передаёт существительное, но его точный оттенок и референт остаются неопределёнными.
- source_word: ይትሐጐሉ
  choice: они гибнут
  rationale: Кратко и естественно передаёт значение погибели или разрушения, не навязывая точного вида действия.
- source_word: በዝንቱ ኃይል
  choice: эта сила
  rationale: Сохраняет широкий смысл слова и не уточняет природу силы сверх текста.
- source_word: ይበልዓኒ
  choice: пожирает меня
  rationale: Передаёт яркий буквальный образ поедания и личный характер заключительной строки.
theological_decisions:
- issue: Предназначение человечества и его отношение к ангелам
  choice: Люди созданы, чтобы уподобиться ангелам в чистоте и праведности.
  alternative: Люди были созданы ангелами или как ангельские существа.
  rationale: Сравнительно-целевой оборот указывает на подобие, а не на тождество; человеческое и ангельское не сливаются.
- issue: Причина гибели, обозначенная как знание
  choice: Сохранено прямое «из-за этого знания они гибнут».
  alternative: «Из-за этого понимания они погибают» или «этим помыслом они губят себя».
  rationale: Эфиопский текст допускает оттенки знания и понимания, а контекст не позволяет уверенно установить референт; неоднозначность сохранена.
- issue: Условность прикосновения смерти
  choice: «Смерть… не коснулась бы их» передаёт нереализованное следствие задуманного состояния.
  alternative: Категорическое историческое утверждение «смерть не касалась их».
  rationale: Контекст противопоставляет предназначенную чистоту нынешней гибели, поэтому контрфактическая форма лучше сохраняет напряжение стиха.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. «Ведь» передаёт причинную связь; «лишь для того, чтобы» делает целевую конструкцию естественной. Яркий финальный образ сохранён словом «пожирает».
