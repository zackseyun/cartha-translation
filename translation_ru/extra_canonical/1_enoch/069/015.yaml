base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/015.yaml
  text: And this is the power of this oath, for it is mighty and firm; and he placed this oath, Aka'e, into the hand of Mika'el.
translation:
  language: ru
  text: 'И вот сила этой клятвы: она могущественна и тверда; и он положил эту клятву, Акаэ, в руку Микаэля[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в руку Микаэля»; это выражение может обозначать передачу на хранение, в ведение или под власть.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኃይሉ
  choice: сила
  rationale: Передаёт действенную мощь клятвы и сохраняет торжественный апокалиптический тон.
- source_word: ማሐላ
  choice: клятва
  rationale: Прямое и устойчивое соответствие повторяющемуся обозначению клятвы; более узкое значение «клятва-проклятие» самим стихом не задано.
- source_word: ኃያል
  choice: могущественна
  rationale: Предикативно характеризует действенную мощь клятвы; женская форма согласована с русским словом «клятва».
- source_word: ፅኑዕ
  choice: тверда
  rationale: Сохраняет значение прочности, незыблемости и установленности клятвы.
- source_word: አንበሮ
  choice: вложил
  rationale: Сохраняет конкретный образ помещения чего-либо в руку, не заменяя его истолкованием «поручил» или «подчинил власти».
- source_word: አካእ
  choice: Акаэ
  rationale: Передано как собственное имя клятвы, явно присутствующее в эфиопском тексте; русская транслитерация сохраняет форму источника без ненужного апострофа.
- source_word: በእዴሁ ለሚካኤል
  choice: в руку Микаэля
  rationale: Сохраняет конкретный образ единственного числа и передаёт имя по форме языка-источника.
theological_decisions:
- issue: Передавать ли образ руки буквально или истолковать как вручение власти
  choice: в руку Микаэля
  alternative: под власть Микаэля / поручил Микаэлю
  rationale: Буквальная образность эфиопского текста понятна по-русски и сохраняет возможный оттенок как доверения, так и передачи полномочий, не разрешая его однозначно.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным строем. Повтор слова «клятва», конкретный образ руки и неопределённое «он» сохранены; имя አካእ не опущено и оформлено как приложение.
