base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/026.yaml
  text: And there was great joy among them[a], and they blessed and praised and exalted because the name of that Son of Man had been revealed to them.
translation:
  language: ru
  text: И среди них была великая радость, и они благословили, восхвалили и превознесли, потому что им было открыто имя того Сына Человеческого.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Геэзское выражение, переведённое как «Сын Человеческий», формально необычно. Более буквальный перевод мог бы звучать как «сын человечества» или, менее вероятно, «сын живых»; однако в Притчах Еноха оно употребляется как устойчивый титул возвышенной фигуры.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኮኖሙ
  choice: И ... была среди них
  rationale: Форма вводит возникшее у них состояние; по-русски это естественно передаётся конструкцией «была среди них», без смысла изменения их сущности.
- source_word: ፍሥሐ፡ ዓቢይ
  choice: великая радость
  rationale: Сочетание обозначает сильную праздничную радость и сохраняет возвышенный тон.
- source_word: ወባረኩ፡ ወሰብሑ፡ ወአልዐሉ
  choice: и они благословляли, восхваляли и превозносили
  rationale: Три глагола сохранены раздельно и в исходной последовательности, чтобы передать литургическую повторность текста.
- source_word: በእንተ፡ ዘተከሥተ፡ ሎሙ
  choice: за то, что им было открыто
  rationale: Оборот указывает причину радости и хвалы; пассивная конструкция сохраняет смысл дарованного откровения.
- source_word: ስሙ
  choice: имя
  rationale: Контекст и последующая родительная конструкция определяют существительное; отсутствие притяжательного местоимения сохраняет акцент оригинала на открытом имени.
- source_word: ለውእቱ፡ ወልደ፡ እጓለ፡ እመሕያው
  choice: того Сына Человеческого
  rationale: В Притчах Еноха выражение действует как узнаваемый титул. Указательное «того» передаёт ውእቱ, а традиционная форма «Сын Человеческий» сохраняет апокалиптическую титулатуру без дополнительного догматического истолкования.
theological_decisions:
- issue: Передача титульного выражения ወልደ እጓለ እመሕያው
  choice: того Сына Человеческого
  alternative: того сына человеческого рода; того сына живущих
  rationale: Геэзское выражение формально необычно и допускает более буквальные варианты, однако в Притчах оно функционирует как устойчивый титул возвышенной фигуры. Основной перевод сохраняет это местное употребление, а примечание — реальную лексическую неоднозначность.
translation_notes:
  register: Современный литературный русский с возвышенным апокалиптическим звучанием. Повторяющиеся глаголы хвалы намеренно не сглажены; синтаксис остаётся ясным для обычного читателя.
