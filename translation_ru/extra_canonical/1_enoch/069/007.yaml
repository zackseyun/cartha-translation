  source_fidelity: 'Основной смысл передан верно: образ «из его руки», направленность действия против обитателей суши и длительность «с того дня … во веки веков» сохранены. Однако ዲቤሆሙ содержит местоименный объект («на/против них»), тогда как «против тех, кто живёт на суше» превращает его в определение к «тех» и несколько сглаживает структуру оригинала. Безопаснее прямо передать: «против них — против тех, кто живёт на суше».'
