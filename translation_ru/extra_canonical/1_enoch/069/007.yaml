  terminology: «Во веки веков» уместно сохраняет усиленную формулу и апокалиптический регистр. «Орудия смерти» воспроизводит контекстуальный антецедент, отмеченный в сноске проекта; он должен быть помечен квадратными скобками как добавление для ясности. Сноска b в нынешней редакции корректна по существу, но после явного антецедента её лучше сформулировать как пояснение согласования, а не как альтернативный перевод.
