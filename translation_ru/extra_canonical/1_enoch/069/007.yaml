  yaml_path: translation/extra_canonical/1_enoch/069/007.yaml
  text: And from his hand they went out against those who dwell upon the dry ground[b][a], from that day and unto the age of ages.
translation:
  language: ru
  text: И из его руки вышли [орудия смерти] против них — против тех, кто живёт на сухой земле[a], — с того дня и во веки веков[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «против тех, кто живёт на земле». Буквальнее: «против тех, кто живёт на сухой земле».'
    reason: lexical_alternative
  - marker: b
    text: В геэзском тексте глагол стоит в единственном числе («вышло»), хотя по контексту относится к «орудиям смерти» из предыдущего стиха; русское множественное число передаёт этот подразумеваемый антецедент.
    reason: source_grammar
lexical_decisions:
- source_word: እምነ እዴሁ
  choice: из его руки
  rationale: Сохранён конкретный пространственный образ источника или орудия действия; возможный смысл власти не подставляется вместо образа.
- source_word: ወፅአ
  choice: они вышли
  rationale: Форма глагола стоит в единственном числе, однако по контексту относится к названным в предыдущем стихе «орудиям смерти»; русское множественное число сохраняет эту смысловую связь.
- source_word: ዲቤሆሙ
  choice: против тех
  rationale: В данном контексте предлог выражает направленное, враждебное действие, а не только положение «над» или «на».
- source_word: ለእለ የኃድሩ ዲበ የብስ
  choice: тех, кто живёт на суше
  rationale: Передан конкретный образ обитаемой сухой земли; «суша» звучит естественно по-русски и не сводит космологический образ к общему слову «земля».
- source_word: እምይእቲ ዕለት
  choice: с того дня
  rationale: Естественно передаёт исходную временную точку продолжающегося действия.
- source_word: እስከ ለዓለመ ዓለም
  choice: во веки веков
  rationale: Устойчивое русское выражение сохраняет усиленную формулу неограниченной длительности и возвышенный апокалиптический регистр.
theological_decisions:
- issue: Передавать ли የብስ общим словом «земля» или конкретным словом «суша»
  choice: суша
  alternative: земля
  rationale: Конкретный образ может иметь космологическое значение; при средней уверенности источника предпочтительно не сглаживать его.
- issue: Согласование глагола ወፅአ с подразумеваемым антецедентом
  choice: множественное число «они вышли»
  alternative: единственное число «оно вышло»
  rationale: Геэзская форма единственного числа может сочетаться с собирательным или неодушевлённым множественным антецедентом; контекст предыдущего стиха указывает на «орудия смерти». Сноска сохраняет формальную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Синтаксис сделан ясным, но конкретные образы «руки» и «суши», а также традиционная формула длительности сохранены.
