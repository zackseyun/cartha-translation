base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/001.yaml
  text: And after this judgment[a], they will terrify them and oppress them[d][c][b], because they showed this to those who dwell upon the dry land.
translation:
  language: ru
  text: И после этого суда[a] они устрашат их и будут притеснять их, потому что показали это[b] живущим на суше[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный более общий перевод начала фразы: «И после этого»; однако синтаксически предпочтительно связывать «этого» со словом «суда».'
    reason: lexical_alternative
  - marker: b
    text: Не уточняется, что именно они показали; слово «это», вероятно, отсылает к сказанному ранее.
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «на сухой земле». Здесь может сохраняться противопоставление суши морю, а не просто общее значение «на земле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ ዝ ኵነኔ
  choice: после этого суда
  rationale: Сочетание передаёт временную последовательность и связывает указательное слово с «судом»; такое прочтение также согласуется с множественным числом подлежащего последующих глаголов.
- source_word: ያደነገፅዎሙ
  choice: они устрашат их
  rationale: Глагол выражает причинение сильного страха или потрясения; форма сохраняет как множественное подлежащее, так и множественное дополнение.
- source_word: ያምዕፅዎሙ
  choice: будут притеснять их
  rationale: Корень указывает на угнетение, насилие или несправедливое обращение; «притеснять» естественно звучит по-русски и не подменяет это значение изгнанием.
- source_word: ዘንተ አርአዩ
  choice: показали это
  rationale: Буквальная конструкция сохраняет неуточнённый в стихе референт указательного местоимения и не превращает показ в более специальное богословское «откровение».
- source_word: ለእለ የኀድሩ
  choice: живущим
  rationale: Причастное обозначение обитателей передано кратко, естественно и с подобающим апокалиптическому тексту достоинством.
- source_word: ዲበ የብስ
  choice: на суше
  rationale: የብስ обозначает сухую землю в противопоставлении морю или водам; «суша» сохраняет конкретный космологический образ.
theological_decisions:
- issue: Синтаксическая роль слова ኵነኔ
  choice: «суда» как часть оборота «после этого суда»
  alternative: «после этого суд устрашит их»
  rationale: У последующих глаголов подразумевается подлежащее во множественном числе, поэтому единственное «суд» не следует делать их подлежащим. Перевод сохраняет судебную образность, не уточняя природу суда.
- issue: Неуказанные участники действий
  choice: сохранены местоимения «они» и «их» без поясняющих существительных
  alternative: назвать конкретные группы ангелов или людей по контексту
  rationale: Сам стих не называет участников явно; их конкретизация устранила бы подлинную местоименную неоднозначность источника.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис оставлен ясным, а местоименная неоднозначность оригинала сохранена.
