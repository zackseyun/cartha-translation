base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/012.yaml
  text: 'And the fifth was named Kasdeya[a]. This is the one who showed the children of men all the evil blows of spirits and of demons, and the blows in the womb, so that the embryo miscarries, and the blow upon the soul: the bite of the serpent[f][e][d][c][b], and the blow that comes at noon—the son of the serpent whose name is Taba''et.'
translation:
  language: ru
  text: Пятого звали Касдея. Это тот, кто показал сынам человеческим все злые удары[a] духов и демонов, удары по плоду во чреве, так что случается выкидыш[b], и удар по душе — укус змея[c], и удар, бывающий в полдень, — удар сына змея, имя которому Табаэт[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «удары», может также означать «поражения», «бедствия» или губительные воздействия.
    reason: lexical_alternative
  - marker: b
    text: Фраза о чреве трудна. По-видимому, речь идёт о вреде, причиняемом плоду во время беременности и приводящем к выкидышу.
    reason: textual_variant
  - marker: c
    text: Слова «удар по душе» в данном свидетеле текстуально не вполне надёжны; перевод следует вероятному чтению.
    reason: textual_variant
  - marker: d
    text: 'Буквально: «удар, который бывает в полдень, — [удар] сына змея, имя которому Табаэт». Неясно, отождествляется ли этот полуденный удар с существом по имени Табаэт, названным сыном змея, или последние слова вводят отдельную фигуру.'
    reason: alternative_reading
lexical_decisions:
- source_word: ኃምስ፡ ስሙ፡ ካስድያእ
  choice: Пятый носил имя Касдея
  rationale: Сохраняется порядковое обозначение в перечне и близкая к геэзской форме передача имени; русская формула звучит естественно и достойно.
- source_word: ዘአርአዩ
  choice: показал
  rationale: Глагол означает «показал, дал увидеть, открыл»; нейтральное «показал» не превращает действие без достаточных оснований в формальное обучение.
- source_word: ለውሉደ፡ ሰብእ
  choice: сынам человеческим
  rationale: Сохранена традиционная возвышенная апокалиптическая формула, при этом понятная современному читателю.
- source_word: ዝብጠታተ / ዝብጠተ
  choice: удары / удар
  rationale: Повторяющийся образ поражения сохранён, как и переход источника от множественного числа к единственному.
- source_word: ዘነፍሳት፡ ወዘአጋንንት
  choice: духов и демонов
  rationale: Сохраняется различие между двумя обозначенными в тексте разрядами духовных существ или сил.
- source_word: ባእባአ፡ ማሕፀን፡ ከመ፡ ይደቅ
  choice: по плоду во чреве, от которых происходит выкидыш
  rationale: Передан вред, причиняемый плоду во время беременности, и его результат; формулировка учитывает конструктивную связь слов, не создавая впечатления, будто плод сам наносит удары.
- source_word: '[ዝብጠተ፡ ነፍስ፡] ንስክተ፡ አርዌ'
  choice: удар по душе — укус змея
  rationale: Сохранены единственное число, упоминание души и конкретный образ укуса; тире передаёт сжатую пояснительную связь без чрезмерного истолкования.
- source_word: ዝብጠተ፡ ዘይከውን፡ በቀትር
  choice: удар, бывающий в полдень
  rationale: Буквально сохранено временное указание, которое в апокалиптическом контексте может иметь особый зловещий оттенок.
- source_word: ወልዳ፡ ለአርዌ፡ ዘስሙ፡ ተባዕት
  choice: сына змея, имя которому Табаэт
  rationale: Финальная именная формула передана близко к источнику; её синтаксическая связь намеренно не сглажена из-за реальной неоднозначности.
theological_decisions:
- issue: Природа открытых Касдеей «ударов»
  choice: Перечень вредоносных духовно-демонических поражений, включая выкидыш, поражение души, укус змея и полуденный удар
  alternative: Обычные телесные повреждения, оружие или магические формулы как таковые
  rationale: Сочетание духов, демонов, чрева, души и змея указывает на зловещие сверхъестественные воздействия; при этом перевод не добавляет отсутствующего в тексте систематического объяснения.
- issue: Связь выражения «сын змея, имя которому Табаэт» с предшествующим
  choice: Сохранена сжатая связь с полуденным ударом без окончательного определения, является ли Табаэт самим ударом, олицетворяющей его сущностью или отдельным существом
  alternative: Однозначно назвать Табаэта отдельным демоном либо именем самого змея
  rationale: Синтаксис труден и допускает несколько толкований, поэтому подлинная неоднозначность вынесена в примечание.
- issue: «Удар по душе» и «укус змея»
  choice: Переданы как тесно связанные элементы с пояснительным тире
  alternative: Разделить их как два совершенно самостоятельных пункта перечня
  rationale: Сжатая конструкция источника допускает пояснительную связь, но текстовое сомнение отмечено, чтобы не превращать её в бесспорное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной апокалиптической окраской. Повторы «удары / удар» и формула «сынам человеческим» сохранены намеренно. Синтаксис слегка упорядочен для чтения, но трудные связи в конце стиха не разрешены догматически.
