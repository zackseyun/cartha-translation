base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/025.yaml
  text: And over them this oath became strong[a], and they are kept by it; and their paths are kept[c][b], and their courses do not perish.
translation:
  language: ru
  text: И над ними эта клятва обрела силу[a], и они хранимы ею; и пути их хранимы[b], и движения их не гибнут.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утвердилась».'
    reason: lexical_alternative
  - marker: b
    text: Эфиопский текст в этой строке труден; повтор глагола может подчёркивать, что клятвой хранимы как они сами, так и их пути.
    reason: textual_variant
  - marker: c
    text: 'Или: «и движения их не исчезают (не терпят крушения)». Слова, переданные как «пути» и «движения», могут обозначать как пути вообще, так и упорядоченные космические движения или круги.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ዲቤሆሙ
  choice: над ними
  rationale: 'Передаёт пространственное и властное значение предлога: клятва утверждается над ними, сохраняя или связывая их.'
- source_word: ጸንዐ
  choice: обрела силу
  rationale: Естественно выражает становление твёрдым или сильным, не сводя смысл лишь к юридическому вступлению в силу.
- source_word: ዝማሐላ
  choice: эта клятва
  rationale: Сохраняет указательное значение ዝ и прямое значение существительного, связанного с клятвой.
- source_word: ይትዓቀቡ
  choice: хранимы
  rationale: Настоящее пассивное значение сохраняет неоднозначность между охраной, удержанием и соблюдением установленного порядка.
- source_word: ቦቱ
  choice: ею
  rationale: Передаёт инструментальное отношение к клятве и естественно звучит по-русски.
- source_word: ፍናዊሆሙ
  choice: пути их
  rationale: Прямо передаёт образ путей или дорог, не ограничивая его нравственным либо космическим смыслом.
- source_word: ምሕዋራቲሆሙ
  choice: круговращения их
  rationale: Сохраняет значение повторяющихся круговых движений и космически упорядоченных циклов, отличая их от более общего «пути».
- source_word: ኢይማስን
  choice: не прекращаются
  rationale: В контексте круговращений естественно выражает, что они не гибнут, не нарушаются и не сходят на нет, без излишне буквального одушевления.
theological_decisions:
- issue: Описывает ли стих нравственное послушание, обязательную силу клятвы или космический порядок
  choice: 'Сохранена неоднозначность: клятва имеет власть над ними, хранит их и поддерживает их пути и круговращения.'
  alternative: Истолковать стих исключительно как подчинение ангелов либо исключительно как устойчивость небесных движений.
  rationale: Сочетание пассивного «хранимы» с «путями» и «круговращениями» допускает одновременно властно-обязующий и космически-упорядочивающий смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Инверсия «пути их» и «круговращения их» поддерживает достоинство стиля, оставаясь понятной; настоящее время передаёт продолжающееся действие эфиопских форм.
