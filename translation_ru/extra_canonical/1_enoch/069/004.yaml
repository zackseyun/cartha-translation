base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/004.yaml
  text: And the name of the first was Yeqon[a]; this is the one who led all the children of the angels astray, and brought them down upon the dry land[d][c][b], and led them astray through the daughters of men.
translation:
  language: ru
  text: Имя первого — Йекон[a]. Это он ввёл в заблуждение всех детей ангелов[b], низвёл их на сушу[c] и через дочерей человеческих[d] ввёл их в заблуждение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Геэзское имя ይቁን передано как «Йекон»; встречаются также варианты транслитерации «Йекун» и «Иекон».
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «детей ангелов». Некоторые понимают это выражение шире — как обозначение ангелов или ангельского воинства.'
    reason: lexical_alternative
  - marker: c
    text: «На сушу» можно также перевести как «на землю»; геэзское выражение подчёркивает сухую, земную область.
    reason: lexical_alternative
  - marker: d
    text: То есть посредством дочерей человеческих; Йекон остаётся тем, кто вводит в заблуждение.
    reason: ambiguity_clarification
lexical_decisions:
- source_word: ወስሙ፡ ለቀዳማዊ
  choice: Имя первого
  rationale: Сохраняет формулу именования и указывает на первого в перечислении; начальное ወ не обязательно передавать отдельным союзом в русском начале стиха.
- source_word: ይቁን
  choice: Йекон
  rationale: Имя передано транслитерацией геэзской формы, без попытки истолковать его значение.
- source_word: ዝውእቱ
  choice: Это он
  rationale: Передаёт выделительную конструкцию с указательным местоимением и связкой естественным современным русским выражением.
- source_word: ዘአስሐተ / ወአስሐቶሙ
  choice: ввёл в заблуждение … ввёл их в заблуждение
  rationale: Повтор одного русского выражения сохраняет повтор того же геэзского глагольного корня и не добавляет различий между «обманом» и «соблазнением», которых источник явно не задаёт.
- source_word: ደቂቀ፡ መላእክት
  choice: детей ангелов
  rationale: Буквально сохраняет необычное родственное обозначение и не заменяет его толкованием «ангелы» или «ангельское воинство».
- source_word: ወአውረዶሙ
  choice: низвёл их
  rationale: Передаёт каузативное движение вниз, не уточняя сверх текста, было ли оно насильственным.
- source_word: ዲበ፡ የብስ
  choice: на сушу
  rationale: Сохраняет конкретное значение сухой земли и направление нисхождения из небесной области в земную.
- source_word: በአዋልደ፡ ሰብእ
  choice: через дочерей человеческих
  rationale: «Через» ясно выражает средство, посредством которого Йекон ввёл их в заблуждение, и не превращает дочерей человеческих в самостоятельных деятелей.
theological_decisions:
- issue: Кого обозначают «дети ангелов»
  choice: В основном тексте сохранено буквальное «дети ангелов».
  alternative: ангелы; ангельское воинство
  rationale: Необычная родственная формула присутствует в геэзском тексте; её сглаживание устранило бы подлинную текстовую и богословскую неоднозначность.
- issue: Повтор глагола заблуждения
  choice: Одинаковое выражение «ввёл в заблуждение» употреблено дважды.
  alternative: обманул … соблазнил
  rationale: Источник повторяет один корень; два разных русских глагола могли бы создать отсутствующее в тексте смысловое различие.
- issue: Роль дочерей человеческих
  choice: 'Они представлены как средство: «через дочерей человеческих».'
  alternative: дочери человеческие сами ввели ангелов в заблуждение
  rationale: Предлог በ при активном глаголе указывает здесь на средство действия Йекона; перевод не должен ошибочно менять деятеля.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Синтаксис сделан ясным для широкого читателя; лексические и богословские неоднозначности источника сохранены и пояснены в сносках.
