base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/006.yaml
  text: And the third was named Gadreel[a]; this is the one who showed all the blows of death to the children of men, and he led Eve astray[c][b], and he showed the weapons of death to the sons of men—the shield and the breastplate and the sword for slaughter—and all the weapons of death to the children of men.
translation:
  language: ru
  text: Третьего звали Гадреилом. Это он показал сынам человеческим все удары смерти и ввёл Еву в заблуждение; он же показал сынам человеческим орудия смерти — щит, панцирь и меч для убийства — и все орудия смерти сынам человеческим[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Фраза об «орудиях смерти» в данном свидетельстве геэз текстологически трудна. После перечня она повторяется как обобщение; перевод сохраняет и сам перечень, и заключительное повторение.
    reason: textual_variant
lexical_decisions:
- source_word: ሣልስ፡ ስሙ፡ ጋድርኤል
  choice: А третьего звали Гадриил
  rationale: Естественная русская передача порядкового обозначения и формулы именования; имя транслитерировано по форме геэз.
- source_word: ዘአርአየ
  choice: показал
  rationale: Сохраняет основное значение «показать, открыть» и повтор глагола в стихе, не превращая действие в формальное обучение.
- source_word: ኵሎ፡ ዝብጠተ፡ ሞት
  choice: все удары смерти
  rationale: Формально сохраняет существительное «смерть» и его намеренное повторение далее в выражении «орудия смерти»; не сужает смысл до изготовленного оружия.
- source_word: ለውሉደ፡ ሰብእ / ለደቂቀ፡ ሰብእ
  choice: сынам человеческим
  rationale: Обе близкие собирательные формулы переданы единообразно, в понятном возвышенном апокалиптическом регистре.
- source_word: አስሐታ፡ ለሔዋን
  choice: ввёл Еву в заблуждение
  rationale: Передаёт активное склонение к ошибке, не добавляя отсутствующих в тексте догматических уточнений.
- source_word: ንዋየ፡ ሞት
  choice: орудия смерти
  rationale: «Орудия» охватывает перечисленные предметы военного снаряжения, включая защитные, и сохраняет повторную формулу со словом «смерть».
- source_word: ወለታ፡ ወድርዐ፡ ወሰይፈ፡ ለቀተል
  choice: щит, доспех и меч для убийства
  rationale: Передаёт последовательность военного снаряжения; «доспех» достаточно широк для обозначения нательной брони, а «меч для убийства» сохраняет прямую целевую конструкцию.
theological_decisions:
- issue: Прямая связь Гадриила с введением Евы в заблуждение
  choice: он… ввёл Еву в заблуждение
  alternative: он обманул Еву
  rationale: Текст геэз прямо приписывает это действие Гадриилу. Перевод сохраняет данное утверждение и возникающее богословское напряжение, не гармонизируя его с другими преданиями.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Синтаксис упрощён для ясности, но повтор слова «смерть» и итоговая повторная формула сохранены. Маркер сноски поставлен при текстологически трудном повторении, к которому относится примечание.
