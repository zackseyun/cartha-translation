  terminology: «Удары смерти» удачно сохраняет повторяемое существительное «смерть», а «орудия смерти» не исключает щит и панцирь, которые не являются наступательным оружием. «Ввёл Еву в заблуждение» точно передаёт утверждение текста, не навязывая гармонизацию с иными традициями.
