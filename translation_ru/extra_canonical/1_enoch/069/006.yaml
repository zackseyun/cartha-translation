  source_fidelity: 'Необходимо исправить два существенных для точности момента: передать имя ጋድርኤል как «Гадреил», а не «Гадриил», и восстановить в заключительной повторной формуле адресата «сынам человеческим». В геэз он присутствует и в первом, и в последнем упоминании «орудий смерти». Повтор формулы «смерти» сохранён.'
