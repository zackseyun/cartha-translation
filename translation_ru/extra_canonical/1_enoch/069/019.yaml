base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/019.yaml
  text: And by that oath the depths were made firm[c][b][a], and they stand and do not move from their place from eternity to eternity.
translation:
  language: ru
  text: И этой клятвой глубины[a] были утверждены[b]; они стоят и не сдвигаются с места[c] от века и до века.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бездна» либо «море». В эфиопском первое сказуемое стоит в женском единственном числе, а последующие глаголы и местоименный суффикс — во множественном; перевод «глубины» передаёт множественное продолжение фразы.'
    reason: textual_grammar_ambiguity
  - marker: b
    text: 'Или: «укреплены», «сделались твёрдыми».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «с их места»; существительное в исходном тексте стоит в единственном числе. Возможен также перевод: «со своих установленных мест».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ማሐላ
  choice: клятва
  rationale: В контексте речь идёт о связывающей клятве; русское «клятва» сохраняет юридическую и апокалиптическую силу слова.
- source_word: ቀላይ
  choice: глубины
  rationale: Слово обозначает морскую глубину, бездну или море. Множественное «глубины» естественно согласуется с последующими формами множественного числа, хотя первая глагольная форма в источнике стоит в женском единственном числе.
- source_word: ፀንዐት
  choice: были утверждены
  rationale: Глагол выражает обретение прочности или установление в твёрдом состоянии. «Утверждены» передаёт результативность и космическую устойчивость.
- source_word: ወቆሙ
  choice: они стоят
  rationale: Форма описывает установленное и продолжающееся устойчивое положение; настоящее время по-русски ясно выражает сохраняющийся результат.
- source_word: ወኢይትሐወሱ
  choice: и не сдвигаются
  rationale: Отрицательная форма указывает на продолжающееся отсутствие движения, смещения или нарушения установленного порядка.
- source_word: እመካኖሙ
  choice: со своих мест
  rationale: Так по-русски естественно передаётся принадлежность мест множественному субъекту; буквально возможно «с их места», а «с назначенных им мест» было бы более истолковывающим.
- source_word: እምዓለም ወእስከ ለዓለም
  choice: от века и до века
  rationale: Формула близко передаёт исходную конструкцию «от века … до века», сохраняя торжественный регистр и усиленное значение непрерывности.
theological_decisions:
- issue: К чему относятся множественные глаголы после слова ቀላይ
  choice: К глубинам как к космической реальности, утверждённой клятвой
  alternative: К подразумеваемым водам бездны; либо сама клятва описывается как твёрдая и непреложная
  rationale: Последовательность форм множественного числа и притяжательного суффикса указывает на космические реалии, которые стоят на своих местах. Перевод не превращает образ в отвлечённое утверждение о силе клятвы.
- issue: Временной характер устойчивости глубин
  choice: Состояние, возникшее через клятву и продолжающееся постоянно
  alternative: Только завершённое событие в прошлом
  rationale: Первая результативная форма сочетается с последующим незавершённым отрицательным глаголом; русское сочетание «были утверждены; они стоят и не сдвигаются» сохраняет это напряжение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксис остаётся ясным, а формула «от века и до века» сохраняет торжественность оригинала. Числовое несогласование источника не скрыто, а вынесено в примечание.
