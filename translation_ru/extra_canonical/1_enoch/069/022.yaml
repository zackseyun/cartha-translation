base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/022.yaml
  text: And likewise heaven[a], the spirits of the winds, and all the spirits[d][c][b], and their paths from all the gatherings of spirits.
translation:
  language: ru
  text: И также — небо, духи ветров[a], все духи и пути их[b] из всех собраний духов[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сочетание в эфиопском тексте трудно. Его можно понять также более буквально как «ветры ветров». Глагола «приняло» в тексте нет.
    reason: textual_variant
  - marker: b
    text: 'Или: «направления их», «движения их».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «из всех сонмов духов» либо «из всех объединений духов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰማይ
  choice: небо
  rationale: Единственное число обозначает небо как космическую область; «небо» естественно для русского апокалиптического повествования.
- source_word: ነፋሳቲሆሙ ለነፋሳት
  choice: духи ветров
  rationale: Конструкция понимается как определительное сочетание с предваряющим местоименным элементом, а не как сообщение о том, что небо кого-либо «приняло». Перевод сохраняет различие между ветрами и далее упомянутыми духами, хотя сочетание остаётся трудным.
- source_word: መንፈሳት
  choice: духи
  rationale: В данном космологическом перечне слово передано широко как «духи», без уточнения их природы и без подмены словом «души».
- source_word: ወፍናዋቲሆሙ
  choice: и пути их
  rationale: Форма допускает значения путей, направлений или движения. «Пути» сохраняет образ упорядоченного космического движения и не вводит лишней конкретики.
- source_word: እምኵሉ ኅብራት መንፈሳት
  choice: из всех собраний духов
  rationale: «Собрания» достаточно буквально передаёт коллективные объединения, не решая, имеются ли в виду сонмы, разряды или группы духов.
theological_decisions:
- issue: Различение духов и душ в космологическом и эсхатологическом контексте
  choice: Передать መንፈሳት как «духи»
  alternative: «души» или «духовные существа»
  rationale: «Духи» сохраняет апокалиптический регистр и не навязывает тексту более позднюю и строго определённую антропологическую схему.
- issue: Синтаксический статус стиха
  choice: Сохранить безглагольный перечень космических реалий
  alternative: Вставить глагол «приняло» и истолковать строку как действие неба
  rationale: В эфиопском тексте нет глагола со значением «приняло»; добавление такого действия устранило бы подлинную синтаксическую трудность и изменило смысл.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным апокалиптическим звучанием. Тире показывает, что перед нами продолжение безглагольного перечня, а не законченное повествовательное предложение. Неясность исходного синтаксиса сохранена и пояснена в сноске.
