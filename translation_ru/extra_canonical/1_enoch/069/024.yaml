    issue: Неудачная передача именной конструкции о пище
    rationale: '«И пища их будет во всяком благодарении» формально близко к сжатому геэзскому обороту, но в современном русском звучит неясно: благодарение оказывается лишь обстоятельством, а не необычным предикативным содержанием образа. «И пищей им будет всякое благодарение» сохраняет самостоятельное предложение и смысловой парадокс оригинала.'
  - severity: low
    issue: Сноска c излишне утверждает спорную синтаксическую альтернативу
    rationale: Формулировка «превозносить именем Его Господа духов» не является естественной русской альтернативой и может запутать читателя. Основной перевод «превозносить имя Господа духов» соответствует предоставленному английскому аудиторскому следу; специальная сноска здесь не требуется.
