base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/024.yaml
  text: All these will believe and give thanks before the Lord of Spirits[a], and they will bless with all their power, and their food will be in all thanksgiving[c][b]; and they will give thanks and bless and exalt the name of the Lord of Spirits forever and ever.
translation:
  language: ru
  text: Все они уверуют и возблагодарят пред Господом духов[a] и будут благословлять Его всей своей силой; и пищей им будет всякое благодарение[b]. Они будут благодарить, благословлять и превозносить имя Господа духов во веки веков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в присутствии Господа духов».'
    reason: lexical_alternative
  - marker: b
    text: 'Геэзское выражение сжато; возможно также: «и пища их будет во всяком благодарении».'
    reason: ambiguity
lexical_decisions:
- source_word: ያአምኑ
  choice: уверуют
  rationale: Передаёт значение веры и доверия, сохраняя направленность глагольной формы в будущее и не вводя позднейшую догматическую терминологию.
- source_word: የአኵቱ / ወየአኵቱ
  choice: возблагодарят / будут благодарить
  rationale: Соседнее አኰቴት подтверждает значение благодарения; вариативность русской формы позволяет сохранить повтор без тяжеловесности.
- source_word: በቅድመ
  choice: пред
  rationale: Кратко и торжественно передаёт пространственно-культовое значение «перед, в присутствии».
- source_word: እግዚአ መንፈሳት / እግዚአ መናፍስት
  choice: Господь духов
  rationale: Сохраняет устойчивый божественный титул Книги Притч Еноха и его апокалиптическое звучание.
- source_word: ይሴብሑ / ወይሴብሑ
  choice: будут благословлять
  rationale: Сохраняет отличие этого глагола от благодарения и превознесения в последовательности богослужебных действий.
- source_word: በኵሉ ኃይሎሙ
  choice: всей своей силой
  rationale: Естественно по-русски выражает полноту силы и способности.
- source_word: ሲሳዮሙ
  choice: пища их
  rationale: Основное значение существительного — пища или пропитание, а не богатство; перевод сохраняет образ благодарения как их пищи.
- source_word: በኵሉ አኰቴት
  choice: во всяком благодарении
  rationale: Близко передаёт сжатую геэзскую предложную конструкцию, не устраняя её образной неоднозначности.
- source_word: ያሌዕሉ
  choice: превозносить
  rationale: Передаёт образ возвышения и сохраняет возвышенный апокалиптический регистр.
- source_word: ለዓለመ ዓለም
  choice: во веки веков
  rationale: Устоявшийся русский эквивалент формулы вечной длительности с подходящим литургическим ритмом.
theological_decisions:
- issue: Следует ли передавать ያአምኑ явно конфессиональной формулой веры
  choice: уверуют
  alternative: будут доверять; будут верить
  rationale: Выбор сохраняет простое эсхатологическое действие верующих и не привносит более позднее учение о спасительной вере.
- issue: Передача титула እግዚአ መንፈሳት
  choice: Господь духов
  alternative: Господь этих духов
  rationale: В Притчах Еноха выражение действует как повторяющийся божественный титул; титульная форма сохраняет его богословскую и апокалиптическую силу.
- issue: Образ пищи и благодарения
  choice: и пища их будет во всяком благодарении
  alternative: и пищей им будет всякое благодарение
  rationale: Основной текст сохраняет грамматически самостоятельное именное предложение и не сводит «пищу» к имуществу; сжатая связь пищи с благодарением оставлена открытой.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, литургическим ритмом. Архаические формы ограничены прозрачными выражениями «пред» и «во веки веков». Повторы глаголов поклонения сохранены, как и необычный апокалиптический образ пищи, связанной с благодарением.
