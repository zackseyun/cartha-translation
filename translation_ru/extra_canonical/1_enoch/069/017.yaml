base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/017.yaml
  text: And the earth was founded upon the waters[a], and from the hidden places of the mountains living waters come forth[e][d][c][b], from the creation of the world and forever.
translation:
  language: ru
  text: И земля была утверждена на водах, а из сокровенных мест гор выходят живые воды[a] — от сотворения мира и навеки[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «живые воды»; выражение может подразумевать свежие, текучие или животворные воды.'
    reason: lexical_alternative
  - marker: b
    text: Оборот «от сотворения мира и навеки» охватывает время от начала мира и далее, не уточняя характер этой длительности.
    reason: alternative_reading
lexical_decisions:
- source_word: ተሳረረት
  choice: была утверждена
  rationale: Глагольная форма от ሣረረ передаёт основание или утверждение, а не разрыв земли; страдательная конструкция сохраняет космологический образ исходного текста.
- source_word: ዲበ ማይ
  choice: на водах
  rationale: Кратко и естественно передаёт значение «на, над» без уточнения физического устройства изображаемого мира.
- source_word: ኅቡኣተ አድባር
  choice: из сокровенных мест гор
  rationale: Передаёт скрытые области или недра гор и сохраняет таинственный характер образа.
- source_word: ኅሑያን ማያት
  choice: живые воды
  rationale: Сохранено буквальное и образно насыщенное выражение; оно может обозначать свежую, текучую либо животворную воду, поэтому смысл не сужается в основном тексте.
- source_word: ይመፅኡ
  choice: выходят
  rationale: Имперфект выражает продолжающееся или обычное действие, что согласуется с последующим временным оборотом.
- source_word: እምፍጥረተ ዓለም
  choice: от сотворения мира
  rationale: Сохраняется исходная временная формула без добавления отсутствующего пояснения.
- source_word: ወእስከ ለዓለም
  choice: и навеки
  rationale: Естественная для современного литературного русского торжественная формула, передающая неограниченную длительность.
theological_decisions:
- issue: Космологический образ земли и вод
  choice: Сохранить конкретный образ земли, утверждённой на водах.
  alternative: Истолковать воды метафорически либо передать как разделение земли водами.
  rationale: Исходный текст описывает устройство мира образным апокалиптическим языком; перевод не должен рационализировать или догматически истолковывать этот образ.
- issue: Значение выражения «живые воды»
  choice: Оставить выражение открытым и буквальным.
  alternative: Передать как «пресные воды», «текучие воды» или «животворные воды».
  rationale: Каждый из уточняющих вариантов снимает смысловую многозначность, которой исходное выражение не разрешает однозначно.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, апокалиптическим звучанием. «Утверждена», «сокровенные места» и «навеки» сохраняют достоинство стиля, оставаясь понятными широкому читателю.
