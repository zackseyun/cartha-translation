base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/014.yaml
  text: This one asked Mikael to show him the hidden name[a], so that they might remember it in the oath, and so that they might tremble before that name and oath[d][c][b], those who revealed to the children of men all that is hidden.
translation:
  language: ru
  text: Он сказал Микаэлю, чтобы тот показал ему сокрытое имя[a], дабы они упоминали его при клятве[b] и трепетали перед этим именем и клятвой — те, кто открыл сынам человеческим всё сокрытое.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утаённое имя», «тайное имя». Геэзское слово означает нечто скрытое или сокрытое и само по себе не требует позднего мистического смысла.'
    reason: lexical_alternative
  - marker: b
    text: «Упоминали его при клятве» может подразумевать произнесение или призывание имени в торжественном заклятии, а не просто воспоминание о нём.
    reason: lexical_alternative
  - marker: c
    text: 'Заключительные слова, вероятнее всего, уточняют, кто должен упоминать имя и трепетать: те, кто открыл людям сокрытое. Однако сжатый синтаксис допускает более общее понимание субъекта.'
    reason: alternative_reading
lexical_decisions:
- source_word: ዝንቱ
  choice: Он
  rationale: Указательное местоимение отсылает к ранее названному персонажу. Русское «он» естественно в связном повествовании; буквальное субстантивированное «этот» звучало бы неестественно без добавления отсутствующего в тексте существительного.
- source_word: ይቤሎ ለሚካኤል ያርእዮ
  choice: сказал Микаэлю, чтобы тот показал ему
  rationale: Сохраняет значение глагола речи и передаёт форму ያርእዮ как косвенное волеизъявление с местоименным дополнением, не превращая её в прямую императивную реплику. Форма имени «Микаэль» следует геэзскому написанию.
- source_word: ስመ ኅቡአ
  choice: сокрытое имя
  rationale: «Сокрытое» передаёт значение скрытого или утаённого, не навязывая позднего технического смысла эзотерического «тайного имени».
- source_word: ከመ ይዝክርዎ በመሐላ
  choice: дабы они упоминали его при клятве
  rationale: Глагол допускает значения памяти и упоминания; в контексте клятвы русское «упоминали» естественно передаёт произнесение имени, не утверждая более узкого значения «призывали».
- source_word: መሐላ
  choice: клятва
  rationale: Основное значение — торжественная клятва; более сильный оттенок проклятия контекстом не требуется.
- source_word: ከመ ይርዓዱ እምውእቱ ስም ወማሐላ
  choice: и трепетали перед этим именем и клятвой
  rationale: «Трепетали» сохраняет телесно ощутимый оттенок страха, характерный для апокалиптической речи.
- source_word: እለ አርአዩ ለውሉደ ሰብእ ኵሎ ዘበኅቡእ
  choice: те, кто открыл сынам человеческим всё сокрытое
  rationale: Отложенная относительная конструкция сохранена как пояснение к множественному субъекту. «Сыны человеческие» передаёт традиционный антропологический оборот, а «всё сокрытое» сохраняет обобщённость оригинала.
theological_decisions:
- issue: К кому относится множественное число в глаголах «упоминали» и «трепетали»
  choice: К тем, кто открыл людям сокрытое, как поясняет заключительная относительная конструкция.
  alternative: К более широкому кругу тех, кто слышит или употребляет клятву; при сжатом синтаксисе возможна и смена субъекта.
  rationale: Заключительные слова грамматически естественнее всего опознают тех, кто должен трепетать. Тире показывает это пояснительное отношение, но примечание сохраняет синтаксическую неоднозначность.
- issue: Характер обращения к Микаэлю
  choice: Нейтральное «сказал… чтобы», допускающее просьбу или поручение.
  alternative: «Попросил Микаэля» либо «велел Микаэлю».
  rationale: Геэзский глагол речи сам по себе не устанавливает степень властности обращения; нейтральная конструкция не разрешает эту прагматическую неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной апокалиптической окраской. Формы «дабы», «трепетали» и «сынам человеческим» поддерживают достоинство стиля, но синтаксис остаётся понятным. Косвенная речь сохраняет грамматику источника и не добавляет прямых кавычек.
