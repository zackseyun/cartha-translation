base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/003.yaml
  text: And these are the chiefs of their angels[a], and their names, and the commanders of their hundreds, and the commanders of their fifties[c][b], and the commanders of their tens.
translation:
  language: ru
  text: Вот главы их ангелов[a], и вот их имена, и их начальники над сотнями, и их начальники над пятидесятками[b], и их начальники над десятками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В тексте перечислены ранги упорядоченной иерархии: начальники над сотнями, пятидесятками и десятками.'
    reason: cultural_note
  - marker: b
    text: 'Буквально возможно: «начальники пятидесятков». Местоимение «их» повторяется в языке оригинала при каждой ступени; к кому оно относится, определяется из контекста.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እሉ
  choice: вот
  rationale: Указательное множественное слово вводит перечень; русское «вот» естественно представляет перечисляемых лиц.
- source_word: አርእስተ
  choice: главы
  rationale: Буквально «головы»; «главы» сохраняет образ и обозначает лиц высшего ранга в достойном современном регистре.
- source_word: መላእክቲሆሙ
  choice: их ангелов
  rationale: В контексте 1 Еноха речь идёт об ангельских существах; местоименная принадлежность сохранена без уточнения её контекстуального референта.
- source_word: አስማቲሆሙ
  choice: их имена
  rationale: Прямо передаёт множественное число и притяжательный суффикс, поскольку стих вводит список имён.
- source_word: መኰንነ
  choice: начальники
  rationale: Термин обозначает должностных лиц в упорядоченной военно-административной иерархии; «начальники» не сужает значение до исключительно военного командования.
- source_word: ምእት
  choice: над сотнями
  rationale: Передано как название подразделений по сто, параллельно пятидесяткам и десяткам.
- source_word: ኀምሳ
  choice: над пятьюдесятью
  rationale: Обозначает численность подчинённой единицы; русская конструкция естественнее буквального «пятидесятки».
- source_word: ዐሠርተ
  choice: над десятками
  rationale: Сохраняет ступенчатую числовую иерархию источника.
- source_word: ዚአሆሙ
  choice: их
  rationale: Повторяемое притяжательное отношение сохранено при каждой ступени иерархии; точный референт определяется контекстом.
theological_decisions:
- issue: Следует ли передавать последовательность рангов явно военной терминологией
  choice: начальники над сотнями… пятьюдесятью… десятками
  alternative: командиры сотен… пятидесятков… десятков
  rationale: Выбранная формулировка ясно показывает цепь власти, но не навязывает исключительно военное понимание апокалиптической ангельской иерархии.
- issue: Референт повторяемого притяжательного местоимения
  choice: сохранить «их» без пояснения в основном тексте
  alternative: явно назвать обладателей по контексту
  rationale: Сам стих не называет референта; его уточнение сняло бы подлинную контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего апокалиптического перечня. Повтор союза «и» и притяжательного «их» по возможности сохранён; числовые ранги выражены естественными русскими конструкциями.
