base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/009.yaml
  text: And he taught humankind writing with ink and paper[a], and because of this many have gone astray from eternity to eternity[c][b], even to this day.
translation:
  language: ru
  text: И он научил людей писать чернилами на бумаге[a], и из-за этого многие сбились с пути — от века и до века[b], вплоть до сего дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Предоставленная эфиопская транскрипция в этом месте повреждена. По исправленному чтению здесь: «он научил их писать чернилами на бумаге»; чтение о «письменах горечи и обмана» возникло из-за ошибок распознавания текста.'
    reason: textual_variant
  - marker: b
    text: 'Буквально также возможно: «от века до века»; выражение сохраняет повтор слова «век» и апокалиптический ритм.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መሀሮሙ
  choice: он научил людей
  rationale: Исправленное чтение означает «он научил их»; местоименный объект по контексту относится к людям. Формулировка сохраняет действующего субъекта из предыдущего стиха.
- source_word: በቀለም ወበክርታስ
  choice: писать чернилами на бумаге
  rationale: Исправленное чтение буквально указывает на чернила и писчий материал; «бумага» естественно передаёт заимствованное ክርታስ, не вводя неоправданно узкого значения «таблички».
- source_word: ብዙኃን እለ ይስሕቱ
  choice: многие сбиваются с пути
  rationale: Глагол выражает уклонение или блуждание и допускает как нравственный, так и познавательный оттенок; возвратная форма не решает искусственно вопрос о внешнем или внутреннем источнике заблуждения.
- source_word: እምዓለም ወእስከ ለዓለም
  choice: из века в век
  rationale: Сохраняется повтор слова ዓለም и возвышенный апокалиптический ритм, но выражение остаётся естественным для современного русского языка.
- source_word: ወእስከ ዛቲ ዕለት
  choice: вплоть до сего дня
  rationale: Устойчивая временная формула передана торжественно, но понятно; она подчёркивает продолжение последствий до настоящего времени.
theological_decisions:
- issue: Связь письменности с заблуждением людей
  choice: 'Сохранено прямое причинное высказывание: «из-за этого многие сбиваются с пути».'
  alternative: Ослабить связь до «после этого» либо истолковать стих как безусловное осуждение всякой письменности.
  rationale: Текст связывает переданное умение с заблуждением многих, однако не утверждает прямо, что всякое письмо само по себе является злом. Перевод сохраняет напряжение и не добавляет догматического вывода.
- issue: Продолжительность заблуждения
  choice: «из века в век»
  alternative: «от вечности до вечности» или «навеки».
  rationale: Повтор исходного слова сохранён без превращения временной формулы в более определённое учение о бесконечной участи.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. «Людей» передаёт собирательное значение без мужской исключительности; «вплоть до сего дня» поддерживает торжественный регистр, а основная синтаксическая структура остаётся ясной для обычного читателя.
