base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/016.yaml
  text: And these are the hidden things of this oath [a]. . . and it is made firm by his oath, and heaven was suspended before the world was created[d][c][b], and by it forever.
translation:
  language: ru
  text: И вот сокровенное этой клятвы[a]… Это утверждено его клятвой, и небо было подвешено прежде сотворения мира и навеки — благодаря этому[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начало стиха в данном эфиопском свидетельстве повреждено или неясно; многоточие отмечает пробел в передаче текста после слов о клятве. Возможный перевод: «И вот тайны этой клятвы».'
    reason: textual_variant
  - marker: b
    text: 'Буквально заключительные слова означают: «и навеки — им/посредством него». Форма ቦቱ содержит предлог со значением «в, посредством, благодаря»; её референт неясен и может относиться к клятве, небу или миру.'
    reason: alternative_reading
lexical_decisions:
- source_word: እሉንቱ እሙንቱ ኅቡኣቲሁ ለዝ ማሐላ
  choice: это — сокровенное этой клятвы
  rationale: Передаёт указательно-связочную конструкцию и значение сокрытого, не сводя апокалиптические реалии лишь к словам или учениям. Некоторая необычность оборота сохраняет трудность исходного текста.
- source_word: ወፅኑዕ በመሐላሁ
  choice: и оно утверждено его клятвой
  rationale: «Утверждено» передаёт прочность и установленность, а творительный падеж — инструментальное значение предлога በ.
- source_word: ወሰማይ ተሰቅለ
  choice: небо было подвешено
  rationale: Сохраняет конкретный космологический образ висения или подвешенности неба, не заменяя его более общим «утверждено».
- source_word: ዘእንበለ ይትፈጠር ዓለም
  choice: прежде, чем был сотворён мир
  rationale: Естественно передаёт временное предшествование; в данном космологическом контексте ዓለም уместнее переводить как «мир», а не «век».
- source_word: ወእስከ ለዓለም ቦቱ
  choice: и ею оно подвешено навеки
  rationale: «Ею» передаёт инструментальное ቦቱ — «ею/посредством неё», а повтор глагола и местоимение «оно» делают русскую фразу понятной, связывая её с небом. «Навеки» естественно передаёт устойчивую формулу вечной длительности.
theological_decisions:
- issue: Характер сокровенного, связанного с клятвой
  choice: Сохранено общее «сокровенное», допускающее космические реалии и силы.
  alternative: «Тайные слова клятвы» или «таинства, заключённые в клятве».
  rationale: Контекст главы говорит о космической силе клятвы; более узкие варианты без достаточного основания ограничили бы смысл.
- issue: Образ неба
  choice: Небо буквально представлено как подвешенное силой клятвы.
  alternative: «Небо было утверждено» или «закреплено».
  rationale: Так сохраняется образность геэзского глагола и апокалиптическое напряжение текста без догматического сглаживания.
- issue: Референт инструментального местоимения в конце
  choice: В основном тексте «ею» соотнесено с клятвой, а «оно» — с небом.
  alternative: Отнести местоимение к небу либо к миру.
  rationale: Инструментальное значение ቦቱ и ближайший широкий контекст о клятве, поддерживающей творение, делают клятву наиболее вероятным референтом; грамматика русского языка требует смены рода местоимения.
translation_notes:
  register: Современный литературный русский с торжественным апокалиптическим оттенком. Сохранены космологический образ подвешенного неба, лакуна источника и умеренная синтаксическая шероховатость текстуально трудного начала; местоимения уточнены лишь настолько, насколько это необходимо для понятности по-русски.
