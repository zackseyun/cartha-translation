  source_fidelity: 'Основные образы переданы верно: «сокровенное», действенность клятвы и подвешенное небо. Однако повтор «ею оно подвешено» эксплицирует и грамматически фиксирует два референта, тогда как заключительное ቦቱ в данном повреждённом/трудном свидетельстве допускает не вполне определённую связь. Кроме того, «оно» после «сокровенное» создаёт в русском ложную связность с первым членом, хотя субъект следующего высказывания в источнике остаётся неясным из-за лакуны.'
  naturalness: 'Предлагаемая редакция сохраняет намеренную шероховатость трудного текста, но делает фразу более литературной: «И вот» естественнее вводит указательное «эти», а тире перед заключительным обстоятельством позволяет не добавлять в оригинал повторный глагол.'
  terminology: «Сокровенное», «клятва», «утверждено», «небо было подвешено» соответствуют торжественному апокалиптическому регистру и не вносят догматического толкования. В конце «благодаря этому» передаёт инструментальное значение በ־, не навязывая роду русского местоимения референт «клятва».
