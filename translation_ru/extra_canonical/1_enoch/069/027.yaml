  text: And he sat upon the throne of his glory[a].
translation:
  language: ru
  text: И он сидел на престоле славы своей[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол может также означать «был» или «оставался»; здесь он переведён как «сидел», поскольку речь идёт о престоле и изображено пребывание на нём.
    reason: lexical_alternative
lexical_decisions:
- source_word: ነበረ
  choice: воссел
  rationale: В сочетании с ዲበ («на») и መንበረ («престол») глагол естественно описывает пребывание сидя; «воссел» передаёт образ воцарения, хотя исходный глагол шире по значению.
- source_word: ዲበ
  choice: на
  rationale: Прямой и естественный русский эквивалент пространственного предлога со значением «на, над»; здесь речь о положении на престоле.
- source_word: መንበረ
  choice: престоле
  rationale: Существительное может означать также «сиденье», но в апокалиптической царственно-судебной сцене «престол» точнее передаёт образ.
- source_word: ስብሐቲሁ
  choice: славы своей
  rationale: Передаёт значение «его слава» и сохраняет генитивную конструкцию «престол славы»; возвратное «своей» естественно соотносит славу с подлежащим.
theological_decisions:
- issue: Передавать ли фразу как простое пребывание на престоле или как восседание/воцарение
  choice: И он воссел на престоле славы своей.
  alternative: И он был на престоле славы своей; И он оставался на престоле славы своей.
  rationale: Сочетание глагола с «на престоле» естественно допускает значение сидящего положения, а контекст поддерживает образ воцарения. Сноска сохраняет более широкие лексические возможности исходного глагола.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Инверсия «славы своей» сохраняет достоинство и компактность исходной конструкции, оставаясь понятной современному читателю.
