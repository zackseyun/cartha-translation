base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/018.yaml
  text: And by that oath the sea was created[a], and as its foundation for the time of wrath he set sand for it[c][b], and it does not pass beyond it from the creation of the world and forever.
translation:
  language: ru
  text: И этой клятвой было сотворено море, и как его основание на время гнева[a] он установил для него песок[b]; и оно не переходит за него от сотворения мира и навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение на языке геэз не вполне ясно; возможен также перевод: «на время суда» или «на время кары».'
    reason: lexical_alternative
  - marker: b
    text: Буквально песок назван основанием моря; по смыслу он служит также установленной для моря границей.
    reason: lexical_clarification
lexical_decisions:
- source_word: ማሐላ
  choice: клятва
  rationale: В ряду космических установлений слово обозначает клятву, силой которой утверждён миропорядок; значение «проклятие» здесь контекстуально менее вероятно.
- source_word: ተፈጥረት
  choice: было сотворено
  rationale: Пассивная форма сохраняет выраженную в геэз идею сотворения, не уточняя прямо деятеля.
- source_word: ባሕር
  choice: море
  rationale: Речь идёт о море как о космической стихии.
- source_word: መሠረታ
  choice: основанием его
  rationale: Основное значение — «основание, опора». Контекст указывает также на удерживающую море границу, но перевод сохраняет конкретный образ оригинала.
- source_word: ለጊዜ መዓት
  choice: на время гнева
  rationale: Буквально переданы временное выражение и слово со значениями «гнев, кара»; возможный судебный оттенок отмечен в сноске.
- source_word: አንበረ ላቲ ኆፃ
  choice: Он положил ему песок
  rationale: Глагол означает «положить, установить», а песок выступает основанием и пределом для моря. Заглавное «Он» отражает подразумеваемого Бога, не добавляя имени в основной текст.
- source_word: ወኢትኅልፍ
  choice: и море не преступает этого предела
  rationale: Глагол выражает переход за установленную черту. Повтор «море» и добавление «этого предела» делают местоименную связь ясной по-русски, сохраняя образ границы.
- source_word: እምፍጥረተ ዓለም ወእስከ ለዓለም
  choice: от сотворения мира и вовеки
  rationale: Передан полный временной охват — от сотворения мира в вечность — в естественном библейском регистре русского языка.
theological_decisions:
- issue: Песок как естественный берег или как установленная Богом космическая граница
  choice: Сохранены и конкретный образ песка, и представление о пределе, которого море не преступает.
  alternative: 'Передать только отвлечённо: «Он установил морю границу».'
  rationale: Оригинал соединяет вещественный образ песка с функцией нерушимой границы; сведение его к природному берегу или к чистой абстракции обеднило бы текст.
- issue: Связь установленного порядка с гневом или судом
  choice: «на время гнева» с указанием возможного судебного смысла в сноске.
  alternative: «на время суда» или «на время кары».
  rationale: Перевод сохраняет прямое значение «гнев» и апокалиптическое напряжение, не исключая оттенка суда.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Слова «сотворено» и «вовеки» поддерживают достоинство апокалиптического контекста, а синтаксис остаётся понятным современному читателю.
