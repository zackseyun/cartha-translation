base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/010.yaml
  text: 'For men were not born for this: to strengthen their faith with pen and ink[a][b][c].'
translation:
  language: ru
  text: Ибо люди родились не для того, чтобы укреплять свою веру пером и чернилами.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пером и водой желчи». Вероятно, это обозначение письменных принадлежностей — пера и чернил; точный образ остаётся не вполне ясным.'
    reason: cultural_note
  - marker: b
    text: 'Или: «утверждать свою верность пером и чернилами». Здесь слово, переведённое как «вера», может также означать доверие или верность.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: ибо
  rationale: Сохраняет причинно-пояснительную связь с предшествующим контекстом и соответствует возвышенному, но современному повествованию.
- source_word: ኢተወልዱ ሰብእ
  choice: люди родились не
  rationale: Передаёт отрицательную пассивную форму глагола рождения; «люди» здесь обозначает человечество в целом, без ограничения по полу.
- source_word: በዘ ከመዝ
  choice: для того, чтобы
  rationale: Естественно выражает целевое значение конструкции, не добавляя более узкой интерпретации.
- source_word: በቀለም ወበማየ ሐመት
  choice: пером и чернилами
  rationale: В данном письменном контексте сочетание, буквально упоминающее тростниковое перо и «воду желчи», вероятнее всего обозначает орудие письма и железо-галловые чернила. Идиоматический перевод понятен современному читателю, а буквальный образ сохранён в сноске.
- source_word: ያጽንዑ
  choice: укреплять
  rationale: Передаёт основное значение «делать твёрдым, прочным» и сохраняет возможную напряжённость образа.
- source_word: ሃይማኖቶሙ
  choice: свою веру
  rationale: Слово допускает значения веры, доверия и верности. «Веру» сохраняет религиозно-нравственную широту термина; контекстуальная альтернатива отмечена в сноске.
theological_decisions:
- issue: Значение укрепления веры посредством письма
  choice: Сохранено прямое утверждение об «укреплении веры» пером и чернилами без поясняющего догматического пересказа.
  alternative: «подтверждать свою верность пером и чернилами», то есть письменным договором или клятвой
  rationale: Контекст письма и клятв допускает юридико-нравственный смысл, однако лексема ሃይማኖት также прямо допускает «веру». Основной текст сохраняет эту богословскую напряжённость, а контекстуальная возможность вынесена в сноску.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным апокалиптического текста синтаксисом. Коллективное ሰብእ передано словом «люди», а не гендерно ограниченным «мужчины». Идиома о письменных принадлежностях раскрыта естественно, при этом буквальная образность и смысловая неоднозначность доступны в сносках.
