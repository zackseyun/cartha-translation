base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/008.yaml
  text: And the fourth—his name was Penemue—this one showed the children of men the bitter and the sweet[b][a], and he showed them all the secrets of their wisdom.
translation:
  language: ru
  text: А четвёртого звали Пенемуэ. Он показал сынам человеческим горькое и сладкое[a] и показал им все тайны их мудрости.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «горечь и сладость». Это выражение может обозначать буквальное различие вкусов либо иметь переносный смысл; сам текст его не поясняет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ራብዕ
  choice: четвёртого
  rationale: Порядковое числительное продолжает перечень; винительный падеж обусловлен естественной русской конструкцией «четвёртого звали».
- source_word: ስሙ ፔኔሙኤ
  choice: звали Пенемуэ
  rationale: Естественная русская передача повествовательной формулы именования; личное имя транслитерировано.
- source_word: ዝንቱ
  choice: он
  rationale: Указательное «этот» относится к только что названному лицу; русское местоимение передаёт связь без тяжеловесного «этот самый».
- source_word: አርአየ
  choice: показал
  rationale: Сохранено основное значение «показать, сделать известным» без уточнения способа передачи знания.
- source_word: ለውሉደ ሰብእ
  choice: сынам человеческим
  rationale: Сохраняет традиционный возвышенный антропологический оборот Енохической литературы и при этом понятно современному читателю.
- source_word: መሪረ ወመዓርፂረ
  choice: горькое и сладкое
  rationale: Формы поняты как субстантивированные прилагательные; передача сохраняет конкретность и краткость исходного противопоставления.
- source_word: ወአርአዮሙ
  choice: и открыл им
  rationale: В данном контексте «открыл» естественно выражает сообщение сокрытого; смысл того же глагольного корня сохранён, хотя русская лексика варьирована ради плавности.
- source_word: ኵሎ ኅቡኣተ
  choice: все тайны
  rationale: «Тайны» кратко и естественно передают буквально «сокрытое» в апокалиптическом контексте.
- source_word: ጥበቦሙ
  choice: их мудрости
  rationale: Местоименный суффикс сохранён, а ጥበብ передано широким словом «мудрость», не сводящим значение к одному лишь ремеслу или знанию.
theological_decisions:
- issue: Смысл пары መሪረ и መዓርፂረ
  choice: горькое и сладкое
  alternative: горечь и сладость; зло и добро
  rationale: Исходный текст даёт краткое противопоставление субстантивированных качеств и прямо не отождествляет их с добром и злом. Буквальная передача сохраняет возможный как чувственный, так и переносный смысл.
- issue: Соотнесённость «тайн» в выражении ኅቡኣተ ጥበቦሙ
  choice: все тайны их мудрости
  alternative: все тайны мудрости; всё сокрытое в мудрости
  rationale: Притяжательный суффикс третьего лица множественного числа сохранён, чтобы не превращать выражение в отвлечённое понятие и не устранять синтаксическую неоднозначность его отнесения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Оборот «сынам человеческим» сохраняет жанровый регистр; остальной синтаксис сделан ясным и естественным. Имя передано как «Пенемуэ» в соответствии с формой ፔኔሙኤ.
