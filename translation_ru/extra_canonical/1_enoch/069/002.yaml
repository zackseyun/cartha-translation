base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/002.yaml
  text: 'And these are the names of those angels[a], and these are their names: the first of them was Semyaza, the second Artaqifa, the third Armen, the fourth Kokabel, the fifth Turiel, the sixth Rumyal, the seventh Daniyal, the eighth Neqael, the ninth Baraqel, the tenth Azazel, the eleventh Armaros, the twelfth Batariel, the thirteenth Basasael, the fourteenth Hananel, the fifteenth Turiel, the sixteenth Simipesiel, the seventeenth Yeterel, the eighteenth Tumael, the nineteenth Turiel, the twentieth Teremael[d][c][b], and the twenty-first Te''azazel.'
translation:
  language: ru
  text: 'И вот имена тех ангелов[a], и таковы их имена: первый из них — Семияза, второй — Артакифа, третий — Армен, четвёртый — Кокабел, пятый — Туриэл, шестой — Румьял, седьмой — Даниял, восьмой — Некаэл, девятый — Баракел, десятый — Азазел, одиннадцатый — Армарос, двенадцатый — Батариэл, тринадцатый — Басасаэл, четырнадцатый — Хананэл, пятнадцатый — Туриэл, шестнадцатый — Симипесиэл, семнадцатый — Йетерэл, восемнадцатый — Тумаэл, девятнадцатый — Туриэл[b], двадцатый — Теремаэл[c], а двадцать первый — Те’азазэл.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Чтение ряда имён в этом стихе затруднено: данная часть книги сохранилась главным образом на языке геэз, а написание отдельных форм в доступном эфиопском тексте не всегда ясно. Поэтому имена переданы близко к видимым эфиопским формам и не приведены к более привычным написаниям.'
    reason: textual_variant
  - marker: b
    text: Имя «Туриэл» встречается в эфиопском списке несколько раз, причём с небольшими различиями в написании. Повторения сохранены, а не исправлены без оговорки.
    reason: textual_variant
  - marker: c
    text: В других изданиях и переводах некоторые имена этого списка передаются иначе; обычно это отражает неуверенность в эфиопских формах.
    reason: alternative_reading
lexical_decisions:
- source_word: ወነዋ
  choice: И вот
  rationale: Частица вводит или подчёркивает последующее сообщение; «И вот» сохраняет её указательно-презентативную силу, не опуская начало первой фразы.
- source_word: አስማቲሆሙ፡ ለእሉክ፡ መላእክት
  choice: имена тех ангелов
  rationale: Сочетание обозначает принадлежность имён указанным ранее ангелам; «тех ангелов» передаёт ретроспективную силу указательного элемента.
- source_word: ወዝንቱ፡ ውእቱ፡ አስማቲሆሙ
  choice: и таковы их имена
  rationale: Сохранено второе, отдельное введение списка, но согласование передано естественно для современного русского языка.
- source_word: ቀዳማዊ፡ ዚአሆሙ
  choice: первый из них
  rationale: Передаёт порядковое числительное и партитивное значение «из них».
- source_word: ጡሩኤል / ጡርኤል
  choice: Туриэл
  rationale: Близкие графические формы одного имени переданы единообразно, однако все три появления имени в списке сохранены.
- source_word: ተአዛዜል
  choice: Те’азазэл
  rationale: Апостроф отмечает различимость гласных в консервативной транслитерации эфиопской формы и не отождествляет имя автоматически с более ранним Азазелом.
theological_decisions:
- issue: Следует ли приводить имена ангелов к привычным формам из иных енохических или позднейших традиций
  choice: Сохранить формы, близкие к данному эфиопскому свидетелю
  alternative: Унифицировать их с привычными формами вроде Даниил, Рамиил или Кокабиил
  rationale: Гармонизация скрыла бы особенности и неуверенность единственного непосредственно представленного здесь языкового свидетеля.
- issue: Следует ли устранять повторение имени Туриэл
  choice: Сохранить все повторения
  alternative: Исправить или удалить предполагаемые дубликаты как переписческую ошибку
  rationale: Без достаточного текстологического основания повторения нельзя молча устранять из основного текста.
- issue: Следует ли свести два вводных оборота в один
  choice: 'Сохранить оба: «И вот имена… и таковы их имена»'
  alternative: 'Передать только одним оборотом: «Вот имена этих ангелов»'
  rationale: Эфиопский текст содержит две последовательные вводные конструкции; их повтор создаёт характерную для перечня торжественную формулу.
translation_notes:
  register: Современный литературный русский язык с торжественным ритмом именного перечня. Повторное введение списка сохранено как особенность источника; порядковые числительные даны полностью, а имена транслитерированы без конфессиональной или традиционной гармонизации.
