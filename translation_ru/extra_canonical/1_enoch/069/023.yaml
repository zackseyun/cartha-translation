base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/023.yaml
  text: And there are kept the sound of the thunder and the light of the lightning[a], and there are kept the storehouses of the hail and the storehouses of the hoarfrost, and the storehouses of the mist[b], and the storehouses of the rain and the dew.
translation:
  language: ru
  text: И там хранятся голос грома и свет молнии; и там хранятся кладовые града, кладовые инея, кладовые тумана[a] и кладовые дождя и росы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «облака».'
    reason: Лексема ጊሜ может обозначать туман, мглу или облако; контекст не позволяет устранить эту неоднозначность.
lexical_decisions:
- source_word: በህየ
  choice: там
  rationale: Сохраняет повторяющееся указание на место видения и естественно звучит по-русски.
- source_word: ይትዓቀቡ / ይትዓቀብ
  choice: хранятся
  rationale: Передаёт пассивное значение, не уточняя сверх текста, идёт ли речь преимущественно о сбережении, охране или содержании в запасе.
- source_word: ቃሉ ለነጐድጓድ
  choice: голос грома
  rationale: ቃል допускает значения «голос», «звук» и «слово»; «голос грома» сохраняет конкретную и возвышенную образность апокалиптического описания.
- source_word: ብርሃኑ ለመብረቅ
  choice: свет молнии
  rationale: Буквально и ясно передаёт образ, сохраняя параллелизм с «голосом грома».
- source_word: መዛግብተ
  choice: кладовые
  rationale: Конкретный и естественный русский образ запасов природных сил; повтор слова сохранён в соответствии с ритмом источника.
- source_word: በረድ
  choice: град
  rationale: Прямое метеорологическое значение.
- source_word: አስሐትያ
  choice: иней
  rationale: Соответствует значению «иней/изморозь» и отличает этот предмет от следующего ጊሜ.
- source_word: ጊሜ
  choice: туман
  rationale: Передаёт атмосферное явление; возможное значение «облако» отмечено в сноске.
- source_word: ዝናም
  choice: дождь
  rationale: Стандартное значение слова.
- source_word: ጠል
  choice: роса
  rationale: Стандартное значение; сохранено объединение дождя и росы под последним упоминанием кладовых.
theological_decisions:
- issue: Следует ли осовременить космологический образ небесных кладовых
  choice: Сохранить конкретную образность кладовых, голоса грома и света молнии
  alternative: Передать смысл как обычное возникновение грома, молнии и осадков
  rationale: Текст представляет визионерское апокалиптическое описание запасов природных сил; демифологизирующая передача устранила бы существенную образность источника.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Повторы источника сохранены, но синтаксис сделан ясным и естественным для обычного читателя.
