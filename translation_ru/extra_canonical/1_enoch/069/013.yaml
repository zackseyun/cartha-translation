base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/013.yaml
  text: This is the secret of Kasbeel[a], the chief of the oath which he showed to the holy ones when he dwelt in glory on high[d][c][b], and its name is Biqa.
translation:
  language: ru
  text: Вот тайна Касбеэла, главы клятвы[a], которую он открыл святым[b], когда пребывал в славе на высоте; а имя — Бика[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «главы заклятия». Слово обычно означает «клятва», но в этом контексте может подразумевать торжественную формулу, связанную с именем.'
    reason: lexical_alternative
  - marker: b
    text: В этом небесном видении «святые», вероятно, обозначает небесных существ, однако исходный текст не уточняет этого.
    reason: cultural_note
  - marker: c
    text: 'В подлиннике не вполне ясно, к чему относится местоименный суффикс перед словом «имя»: к открытой клятве или обозначению либо, менее вероятно, к самому Касбеэлу.'
    reason: alternative_reading
lexical_decisions:
- source_word: ጐልቁ
  choice: число
  rationale: Основное значение слова, связанного с корнем «считать», — «число, счёт, сумма». Контекст сам по себе не даёт достаточных оснований заменять его словом «тайна» или понимать как «третье имя».
- source_word: ካስብኤል
  choice: Касбеэл
  rationale: Имя передано транслитерацией, близкой к форме геэза.
- source_word: ርእሰ ማሐላ
  choice: глава клятвы
  rationale: Буквально сочетание означает «глава клятвы»; оно сохраняет возможный оттенок первенства или главенства, не конкретизируя роль Касбеэла сверх источника.
- source_word: ዘአርአዩ
  choice: которую он открыл
  rationale: Каузативный глагол означает «показал, дал увидеть»; в контексте небесного знания естественное русское «открыл» передаёт значение явления или сообщения, не вводя дополнительной доктрины.
- source_word: ለቅዱሳን
  choice: святым
  rationale: Сохраняется буквальное обозначение «святые» без внесения слова «ангелы» в основной текст.
- source_word: ሶበ ኆደሩ
  choice: когда пребывал
  rationale: Глагол допускает значения пребывания, жительства или оставания; «пребывал» соответствует возвышенному контексту и естественно звучит по-русски.
- source_word: በልዑል በስብሐት
  choice: в вышней славе
  rationale: Переданы обе составляющие выражения — высота/возвышенность и слава — в краткой и достойной русской форме.
- source_word: ወስሙ ቢቃ
  choice: и имя её — Бика
  rationale: Женский род местоимения в русском согласован с ближайшей «клятвой», однако референция исходного местоименного суффикса остаётся не вполне ясной и отмечена в сноске.
theological_decisions:
- issue: Кого обозначают «святые»
  choice: оставить буквальное «святым»
  alternative: «святым существам» или «ангелам»
  rationale: В небесном контексте вероятны небесные существа, но источник не называет их ангелами прямо; буквальная передача сохраняет неоднозначность.
- issue: Значение «клятвы» в контексте открытого имени
  choice: сохранить «клятва»
  alternative: «заклятие» или «формула заклинания»
  rationale: Исходное слово прямо поддерживает значение «клятва». Более специальное понимание возможно, но его нельзя безоговорочно вносить в основной текст.
- issue: Референт местоимения перед именем Бика
  choice: грамматически соотнести с клятвой и отметить неясность
  alternative: отнести к Касбеэлу или к названному числу/обозначению
  rationale: Контекст не позволяет окончательно установить референт; сноска сохраняет эту подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной апокалиптической интонацией. Необычная формула «число Касбеэла» сохранена из-за лексического значения геэзского ጐልቁ, несмотря на её смысловую трудность; спорное «тайна» не принято как недостаточно подтверждённое исходным словом.
