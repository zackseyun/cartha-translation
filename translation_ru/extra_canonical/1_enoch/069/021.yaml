base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/021.yaml
  text: And by that oath the stars complete their courses[a], and their names are called[c][b], and they answer from age to age and forever.
translation:
  language: ru
  text: И силой той клятвы звёзды завершают свой путь; их называют по именам[a], и они отвечают ему[b] из века в век[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эфиопская фраза синтаксически сжата; буквально возможно передать: «их имена называют». Кто именно называет звёзды, прямо не уточняется.'
    reason: textual_variant
  - marker: b
    text: 'Буквально: «отвечают ему». К кому относится местоимение «ему», в самом стихе не разъясняется; по контексту подразумевается владыка установленного небесного порядка.'
    reason: theological_ambiguity
  - marker: c
    text: 'Буквально оборот строится со словами «век/мир» и выражает непрестанную длительность: «из века… до века».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ማሐላ፡
  choice: клятва
  rationale: 'В контексте 1 Еноха 69 это существительное означает «клятва», а сочетание с በ выражает средство или действенную силу: «силой той клятвы».'
- source_word: ከዋክብት፡
  choice: звёзды
  rationale: Прямое и образно точное соответствие; более широкое «небесные светила» здесь не требуется.
- source_word: ይፌጽሙ፡ ምሕዋሪሆሙ፡
  choice: завершают свой путь
  rationale: 'Глагол обозначает доведение до завершения, а существительное — движение или прохождение пути. Русское единственное число естественно передаёт распределительное значение: каждая звезда проходит назначенный ей путь.'
- source_word: አስማቲሆሙ፡ ይጼውዑ፡
  choice: их называют по именам
  rationale: 'Буквально сжато: «их имена называют/зовут». Безлично-пассивная русская конструкция сохраняет неопределённость подразумеваемого деятеля и звучит естественно.'
- source_word: ያወሥእዎ፡
  choice: они отвечают ему
  rationale: Форма содержит объектный суффикс мужского рода единственного числа «ему». Местоимение сохранено без уточнения его референта.
- source_word: እምዓለም፡ ወእስከ፡ ለዓለም።
  choice: из века в век и вовеки
  rationale: Торжественная формула продолжительности передана привычным русским библейским оборотом без сведения значения к философскому понятию абсолютной вечности.
theological_decisions:
- issue: Относятся ли ответ и послушание к звёздам или к связанным с ними небесным существам
  choice: 'Сохранить звёзды грамматическим субъектом: «они отвечают ему»'
  alternative: Пояснить, что отвечают ангелы или небесные служители, связанные со звёздами
  rationale: Апокалиптический текст персонифицирует звёзды и не проводит явного различия между светилами и связанными с ними небесными силами; перевод не должен устранять эту напряжённость.
- issue: Кто назван местоимением «ему»
  choice: Оставить местоимение без пояснения в основном тексте
  alternative: Назвать Бога или Господа прямо
  rationale: Мужской объектный суффикс присутствует в эфиопском тексте, но его референт в самом стихе не назван. Прямое именование внесло бы толкование в основной текст.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Сохранены персонификация звёзд, сжатость образа и неуточнённый референт местоимения; архаизмы ограничены устойчивым наречием «вовеки».
