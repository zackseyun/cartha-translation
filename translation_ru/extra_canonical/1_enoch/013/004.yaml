  text: And they asked me to write for them a petition of remembrance[a], so that there might be forgiveness for them[c][b], and that I might bring it up
translation:
  language: ru
  text: И они попросили меня написать для них прошение о памятовании[a], чтобы им было даровано прощение и чтобы я вознёс[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «памятное прошение», «прошение для напоминания», «молитву о памятовании». Эфиопское выражение соединяет понятия памятования и мольбы.'
    reason: lexical_alternative
  - marker: b
    text: Заключительная фраза в данном делении стиха остаётся незавершённой и продолжается далее; поэтому дополнение после глагола здесь не добавлено.
    reason: textual_variant
lexical_decisions:
- source_word: ተስእሉኒ
  choice: попросили меня
  rationale: Глагол обозначает просьбу или обращение с просьбой; этот вариант естественен в современном русском и не усиливает эмоциональную окраску без необходимости.
- source_word: እጽሐፍ
  choice: написать
  rationale: После глагола просьбы инфинитив естественно передаёт значение требуемого действия.
- source_word: ተዝካረ ስእለት
  choice: памятное прошение
  rationale: Сочетание объединяет значения памяти/напоминания и мольбы/прошения. Формулировка сохраняет оба компонента и допускает смысл письменного обращения, представляемого перед небесным судом.
- source_word: ይኩኖሙ ኅድገተ
  choice: чтобы им было даровано прощение
  rationale: ኅድገት может означать отпущение, освобождение или прощение; в контексте просьбы Стражей о снятии осуждения естественно значение прощения.
- source_word: አዕርግ
  choice: чтобы я вознёс
  rationale: Каузативная форма означает «поднять, вознести, представить наверх», а не просто «взойти». Переходность сохраняется, но дополнение не добавляется, поскольку переданный фрагмент обрывается и оно может следовать далее.
theological_decisions:
- issue: Характер документа, о котором просят Стражи
  choice: памятное прошение
  alternative: молитва для напоминания; письменная запись мольбы
  rationale: Перевод сохраняет судебно-культовый оттенок обращения, предназначенного для представления в небесной сфере, но не вводит поздней литургической терминологии.
- issue: Смысл просьбы о ኅድገት
  choice: прощение
  alternative: освобождение; отпущение
  rationale: «Прощение» соответствует контексту вины и суда, при этом примечание не требуется, поскольку слово остаётся достаточно широким и в русском контексте.
- issue: Действие Еноха в заключительной клаузе
  choice: вознёс
  alternative: взошёл
  rationale: Каузативная форма указывает на вознесение или представление прошения наверх, а не на восхождение самого Еноха.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим регистром. «Памятное прошение» выбрано как компактное и понятное выражение, сохраняющее необычность исходной формулы. Незавершённость конца стиха сохранена намеренно.
