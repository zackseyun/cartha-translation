base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/001.yaml
  text: 'And Enoch went and said to Azazel[a], “You shall have no peace; a great sentence has gone out against you: you will be bound.”'
translation:
  language: ru
  text: 'И Енох пошёл и сказал Азазелю: «Не будет тебе мира. Против тебя вынесен суровый приговор[a]: ты будешь связан».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «суд», «решение» или «осуждение». Эфиопское слово имеет юридический смысл и вводит следующее за ним наказание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኃሊፎ
  choice: пошёл
  rationale: Глагол обозначает движение Еноха перед обращением к Азазелю; «пошёл» естественно передаёт последовательность действий, не уточняя неуказанное направление.
- source_word: ይቤሎ
  choice: сказал Азазелю
  rationale: Обычный глагол речи передан прямо, без добавления риторической силы.
- source_word: አዛዝኤል
  choice: Азазель
  rationale: Имя транслитерировано в принятой русской форме, а не переведено.
- source_word: ኢይከውከ ሰላም
  choice: Не будет тебе мира
  rationale: Формула отказывает осуждённому не только в спокойствии, но и в благополучном исходе; русский оборот сохраняет торжественный характер пророческого приговора.
- source_word: ዓቢይ ኵነኔ
  choice: великий приговор
  rationale: «Великий» прямо передаёт усилительное прилагательное, а «приговор» сохраняет юридический смысл существительного и связь с последующим наказанием.
- source_word: ወጽአ ላዕሌከ
  choice: против тебя вынесен
  rationale: Буквальный образ вышедшего против адресата решения передан естественной русской юридической формулой без изменения его направленности.
- source_word: ይእስርከ
  choice: ты будешь связан
  rationale: Пассивная конструкция ясно передаёт предстоящее связывание и не вводит в текст не названного исполнителя.
theological_decisions:
- issue: Сила формулы об отсутствии мира
  choice: «Не будет тебе мира»
  alternative: «Мир не будет принадлежать тебе»; «Не видать тебе мира»
  rationale: Выбранная формулировка сохраняет судебно-пророческое отрицание благополучия, оставаясь современной и достойной по стилю.
- issue: Юридический оттенок ኵነኔ
  choice: «приговор»
  alternative: «суд»; «решение»; «осуждение»
  rationale: Контекст связывания указывает на решение с карательным последствием. При этом более широкие значения исходного слова не исключаются и отмечены в сноске.
- issue: Исполнитель связывания
  choice: «ты будешь связан»
  alternative: «он свяжет тебя»; «чтобы связать тебя»
  rationale: Исходная глагольная форма допускает связь с предшествующим приговором или целевое понимание. Русский пассив сохраняет факт наказания, не определяя явно его исполнителя.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией судебного пророчества. Синтаксис краток и сохраняет последовательность исходного текста; идиома о вышедшем приговоре передана естественным русским юридическим оборотом.
