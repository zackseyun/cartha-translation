base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/002.yaml
  text: And no mercy or petition will be granted to you[a], because of the violence that you have taught[c][b], and because of all the works of blasphemy and violence and sin that you have shown to humankind.
translation:
  language: ru
  text: И не будет вам ни милости[a], ни исполнения мольбы — за насилие, которому вы научили людей, и за все дела богохульства, насилия и греха, которые вы показали человечеству[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В представленной транскрипции стоит ሣሕት, однако это, вероятно, ошибка распознавания вместо ሣህል — «милость, снисхождение». При неисправленном чтении здесь можно было бы понять: «прошения».'
    reason: textual_variant
  - marker: b
    text: 'Или: «которые вы открыли человечеству». Глагол может означать как показ, так и раскрытие или сообщение знания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ሣሕት (вероятно, искажённое ሣህል)
  choice: милости
  rationale: По результатам текстологической проверки форма в транскрипции, вероятно, возникла из-за ошибки распознавания; чтение ሣህል означает «милость, снисхождение» и соответствует древней традиции смысла «облегчение, послабление».
- source_word: ስእለት
  choice: удовлетворения мольбы
  rationale: Существительное обозначает просьбу или мольбу. В сочетании с отрицательной формой глагола «быть, стать» русское выражение передаёт не отсутствие самой мольбы, а то, что она не получит удовлетворения.
- source_word: ኢይከውከ
  choice: не будет вам
  rationale: Сохранены отрицательная форма и дательный смысл; в контексте речь идёт о недоступности милости и безрезультатности мольбы.
- source_word: ዘመሀርከ
  choice: которому вы научили людей
  rationale: Каузативный глагол прямо указывает на обучение; дополнение «людей» естественно восполняется по смыслу и соответствует контексту передачи Стражами пагубного знания человечеству.
- source_word: ግፍዐ / ወግፍዕ
  choice: насилие / насилия
  rationale: Единообразно передан повтор одного смыслового корня; «насилие» сохраняет общественную и нравственную силу обвинения, не сужая его до частного вида притеснения.
- source_word: ምግባረ
  choice: дела
  rationale: Конкретное и возвышенное слово подходит для формулы обвинения и сохраняет предметность исходного выражения.
- source_word: ጽርፈት
  choice: богохульства
  rationale: В религиозно-судебном контексте это наиболее уместная передача нечестивой брани, хотя слово может шире обозначать поношение или дерзость.
- source_word: ወሓጢአት
  choice: и греха
  rationale: Широкое и естественное обозначение нравственного проступка сохраняет нарастающий перечень обвинений.
- source_word: ዘአርአይከ
  choice: которые вы показали
  rationale: Глагол допускает значения «показать», «явить» и «открыть». Нейтральное «показали» сохраняет неоднозначность между демонстрацией порочных дел и сообщением запретного знания.
- source_word: ለሰብእ
  choice: человечеству
  rationale: Слово обозначает людей как человеческий род, а не исключительно мужчин; «человечеству» точно и естественно передаёт этот общий охват.
theological_decisions:
- issue: Характер преступления Стражей в заключительной части стиха
  choice: Основной текст говорит, что они показали человечеству порочные дела, сохраняя связь с предшествующим прямым указанием на обучение насилию.
  alternative: 'Глагол можно понимать сильнее: они «открыли» человечеству запретное знание; либо слабее: они лишь являли эти дела перед людьми.'
  rationale: Контекст книги подчёркивает передачу запретного знания, однако сам глагол не требует исключительно значения «открыли». Поэтому основной текст сохраняет более широкое «показали», а вариант поясняется в сноске.
- issue: Отказ в милости и ходатайстве
  choice: Стражам не будет милости, а их мольба не получит удовлетворения.
  alternative: При следовании неисправленной транскрипции первую пару можно было бы понять как два близких слова со значением «прошение и мольба».
  rationale: Текстологически более вероятное чтение первого слова означает «милость». Это не следует скрывать, но из-за состояния источника исправление отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным судебно-обличительным звучанием. Синтаксис сделан ясным для обычного читателя; повтор «насилие / насилия» сохранён намеренно как черта исходного обвинения. Текстологическая неопределённость и смысловая широта последнего глагола вынесены в сноски, а не устранены молча.
