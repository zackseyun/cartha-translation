base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/003.yaml
  text: And again I saw[a], and behold, springs were opened upon the earth in that great enclosure, and that water was bubbling up and rising over the earth, and that enclosure appeared[e][d][c][b], until all its land was covered with water.
translation:
  language: ru
  text: 'И снова я увидел: и вот, на земле, в том большом ограждённом месте[b], открылись источники[a]. И в то время как вода пробивалась из земли и поднималась над землёй, это ограждённое место виднелось[c], пока вся его земля[d] не покрылась водой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «родники», «водные источники».'
    reason: lexical_alternative
  - marker: b
    text: Передано неопределённое обозначение ограниченного пространства; возможны также переводы «большая ограда», «большой двор», «большое поле» или «большой сад».
    reason: lexical_alternative
  - marker: c
    text: 'Фраза синтаксически трудна. Возможно также: «это ограждённое место появилось» или «стало видимым».'
    reason: alternative_reading
  - marker: d
    text: 'Возможно также: «пока вся земля не покрылась водой».'
    reason: alternative_reading
lexical_decisions:
- source_word: አንቅዕታት
  choice: источники
  rationale: В контексте воды, выходящей из земли, слово естественно обозначает природные источники; вариант не предполагает сооружённых фонтанов.
- source_word: ተርሕዉ
  choice: открылись
  rationale: Передаёт страдательное значение и сохраняет образ открывшихся водных источников.
- source_word: ዐጸድ ዐቢይ
  choice: большое ограждённое место
  rationale: Нейтрально передаёт ограниченное пространство, не уточняя без достаточных оснований, было ли оно загоном, двором, полем или садом.
- source_word: ወአንዘ ... ይፈልሕ ወይትነሣእ
  choice: и пока вода била ключом и поднималась
  rationale: ወአንዘ вводит временное придаточное «пока», а сочетание глаголов изображает выход воды из земли и повышение её уровня. Выражение «била ключом» передаёт бурное истечение, не подразумевая буквального кипения.
- source_word: ተአርአየ ለውእቱ ዐጸድ
  choice: это ограждённое место было видно
  rationale: 'Передаёт форму со значением видимости и согласуется с временной последовательностью: место было видно до полного затопления. Синтаксис исходной фразы остаётся трудным, что отмечено в сноске.'
- source_word: ኵሉ ምድሩ
  choice: вся земля в нём
  rationale: Местоименный элемент вероятнее всего отсылает к ограждённому месту. Перевод сохраняет локальный смысл, а возможное понимание как всей земли указано в сноске.
theological_decisions:
- issue: Масштаб потопа в видении
  choice: В основном тексте затоплена вся земля внутри ограждённого места.
  alternative: Вода покрывает всю землю в универсальном смысле.
  rationale: Местоименная форма допускает отсылку к ранее названному ограждённому месту, тогда как существительное может означать и землю вообще. Основной текст следует ближайшему референту, но сноска сохраняет более широкое прочтение.
translation_notes:
  register: Современный литературный русский язык с достоинством визионерского повествования. Сохранены вводное «и вот», повтор пространственной лексики и временная конструкция «пока… пока», отражающая ход картины; узкоконфессиональные толкования не внесены.
