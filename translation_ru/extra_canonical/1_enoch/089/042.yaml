base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/042.yaml
  text: And dogs and foxes and wild boars of the field began to devour those sheep[b][a], until the Lord of the sheep raised up from among them one ram to lead them.
translation:
  language: ru
  text: И псы, лисицы[b] и полевые вепри принялись пожирать тех овец, пока Господь овец не воздвиг из их среды одного барана[a], чтобы он вёл их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В этом месте чтение, отражённое в издании, затруднено и допускает вариант вокруг слов «одного барана». Общий смысл ясен: из стада воздвигается один самец овцы, чтобы вести остальных.'
    reason: textual_variant
  - marker: b
    text: Слово, переведённое как «лисицы», может обозначать и других сходных хищников-падальщиков, в частности шакалов.
    reason: lexical_alternative
lexical_decisions:
- source_word: አኃዙ
  choice: принялись
  rationale: В сочетании с последующим глаголом передаёт начало действия; «принялись пожирать» естественно выражает ингрессивный смысл, не сводя форму к буквальному «схватили».
- source_word: አክላብ
  choice: псы
  rationale: Обычное обозначение собак; «псы» сохраняет понятность и придаёт сцене хищнический, но не чрезмерно архаичный оттенок.
- source_word: ቈናጽል
  choice: лисицы
  rationale: Стандартное соответствие для лисоподобных хищников; возможное более широкое значение, включая шакалов, отмечено в сноске.
- source_word: ሐራዊያ ሐቅል
  choice: полевые вепри
  rationale: Передаёт и диких свиней, и указание на поле или открытую местность, сохраняя образный ряд видения.
- source_word: ይብልዕዎሙ
  choice: пожирать
  rationale: В контексте нападения хищников выражает насильственное истребление точнее нейтрального «есть».
- source_word: ዝኩ አባግዕ
  choice: тех овец
  rationale: Сохраняет указательное значение и отсылку к уже названному в видении стаду.
- source_word: እስከ አንሥአ
  choice: пока ... не воздвиг
  rationale: Конструкция естественно передаёт предел продолжавшегося действия, а «воздвиг» сохраняет смысл появления поставленного Богом вождя без уточнения формального назначения.
- source_word: እግዚአ አባግዕ
  choice: Господь овец
  rationale: Сохраняет повторяющийся в «Апокалипсисе животных» возвышенный божественный титул и его аллегорический образ.
- source_word: ፩እምኔሆሙ
  choice: из их среды одного
  rationale: Явно передаёт происхождение избранного вождя из самого стада.
- source_word: ሐርጌ
  choice: барана
  rationale: Естественное русское название самца овцы, сохраняющее его отличие от стада в целом.
- source_word: ዘይመርሖሙ
  choice: чтобы он вёл их
  rationale: Передаёт целевую функцию руководства, не добавляя отсутствующей в исходнике специальной пастырской терминологии.
theological_decisions:
- issue: Божественный титул в аллегории
  choice: Господь овец
  alternative: хозяин овец
  rationale: «Господь» сохраняет возвышенное и богословски значимое звучание повторяющегося титула, тогда как «хозяин» чрезмерно сводит его к владению.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. «Псы» и «вепри» поддерживают достоинство и яркость аллегории; синтаксис остаётся понятным современному читателю. Маркеры сносок поставлены непосредственно после соответствующих слов.
