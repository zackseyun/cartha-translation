base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/067.yaml
  text: And I grieved greatly because of the tower[a], for that house of the sheep had been torn down[e][d][c][b]; and from among them I was not able to see whether those sheep entered that house.
translation:
  language: ru
  text: И я очень опечалился из-за той башни, потому что тот дом овец был снесён[a]; и я не мог разглядеть среди них, вошли ли те овцы в тот дом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «был разрушен», «был разорён». Глагол может подразумевать подкапывание, срывание или полное уничтожение строения.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная фраза допускает и другое членение: провидец мог говорить либо о том, что не видел этих овец вообще, либо о том, что не мог увидеть, вошли ли они в тот дом.'
    reason: alternative_reading
lexical_decisions:
- source_word: ወሐዘንኩ፡ ብዙኃ፡ ጥቀ
  choice: И я очень опечалился
  rationale: Глагол передаёт личную скорбь, а два усилителя — её высокую степень. Современное «очень опечалился» ясно и сохраняет эмфатическую силу выражения.
- source_word: ማኅፈድ
  choice: ограда
  rationale: Слово обозначает огороженное место или загон. «Ограда» сохраняет отдельный образ ограждения рядом с последующим «домом овец», не сводя оба образа к одному «овчарнику».
- source_word: ተከርየ
  choice: был срыт
  rationale: Пассивная форма связана с разрыванием, подкапыванием или разрушением строения. «Был срыт» естественно применяется к зданию и сохраняет конкретность образа, не ограничивая его простым «разрезанием».
- source_word: ቤት ዘአባግዐ
  choice: дом овец
  rationale: Буквальная архитектурная метафора сохранена, поскольку она значима для символики видения и не должна без необходимости заменяться словом «овчарня».
- source_word: ኢክህልኩ ርእዮቶሙ
  choice: я не мог разглядеть
  rationale: Переданы как невозможность, так и зрительное восприятие в повествовании о видении; «разглядеть» звучит естественнее буквального «не был способен увидеть».
- source_word: ለእልኩ አባግዕ
  choice: те овцы
  rationale: 'Указательное значение сохранено: речь идёт об определённой группе овец, ранее представленной в видении.'
- source_word: ይበውኡ፡ ኀበ፡ ዝኩ፡ ቤት
  choice: вошли ли … в тот дом
  rationale: Глагол движения и направительное выражение естественно передаются по-русски сочетанием «войти в»; указательное «тот» сохранено.
theological_decisions:
- issue: Соотношение образов ограды и дома овец
  choice: 'Сохранить оба образа: «ограда» и «дом овец»'
  alternative: Объединить оба образа в одном слове «овчарня» или «овечий загон»
  rationale: Текст juxtapонирует близкие, но не тождественные пространственные образы. Их сохранение не предрешает символическое толкование апокалиптического видения.
- issue: Характер разрушения дома овец
  choice: «был срыт»
  alternative: «был разрушен», «был снесён» или «был подкопан»
  rationale: Выбор отражает конкретное значение разрывания или подкапывания, применённое к строению, но сноска сохраняет более общие возможные понимания.
- issue: Синтаксис заключительной части
  choice: «среди них я не мог разглядеть, вошли ли те овцы в тот дом»
  alternative: «из них я не мог увидеть тех овец» без однозначного присоединения условия о входе
  rationale: Основной текст предлагает наиболее связное чтение, однако трудность конструкции и возможность иного членения прямо отмечены в сноске, чтобы не скрывать подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном повествования о видении. Синтаксис сделан ясным для обычного читателя, но ключевые апокалиптические образы и засвидетельствованная неоднозначность сохранены.
