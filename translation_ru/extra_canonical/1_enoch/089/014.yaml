base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/014.yaml
  text: And the Lord brought the twelve sheep so that they might dwell with it and graze with it among the wolves[c][b][a]; and they multiplied and became many flocks of sheep.
translation:
  language: ru
  text: И Господь привёл двенадцать овец, чтобы они жили с ней[a] и паслись с ней среди волков[b]; и они размножились и стали многочисленными стадами овец[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В эфиопском тексте местоименный суффикс имеет форму мужского рода, буквально: «с ним». В контексте видения он относится к одной овце, упомянутой ранее; русский женский род согласован со словом «овца».'
    reason: referential_ambiguity
  - marker: b
    text: 'Середина стиха в эфиопском тексте трудна. Выражение можно передать также: «жили с ней и кормились вместе с ней посреди волков».'
    reason: textual_variant
  - marker: c
    text: 'Заключительные слова текста не вполне ясны; возможно: «стали многими стадами овец» или «стали великим множеством овец».'
    reason: alternative_reading
lexical_decisions:
- source_word: እግዚአ
  choice: Господь
  rationale: Сохраняет возвышенное обозначение верховного владыки в видении и не устраняет пастырско-владетельный оттенок образа.
- source_word: አምጽኦሙ
  choice: привёл
  rationale: Передаёт активное действие Господа — он заставляет двенадцать овец прийти — естественным русским глаголом.
- source_word: ፲ወ፪ አባግዕ
  choice: двенадцать овец
  rationale: Число выражено прямо; общее слово «овцы» сохраняет символику видения и не уточняет пол животных без необходимости.
- source_word: ከመ ይኅደሩ ምስሌሁ
  choice: чтобы они жили с ней
  rationale: «Чтобы» передаёт цель; «жили» звучит естественно в современном русском. Местоимение отнесено к одной овце из предшествующего контекста, но грамматическая неоднозначность исходного суффикса отмечена в сноске.
- source_word: ይትረዐዩ ምስሌሁ
  choice: паслись с ней
  rationale: Глагол сохраняет конкретный образ совместно пасущихся овец и естественнее по-русски, чем буквальное «кормиться».
- source_word: ማእከለ አዝእብት
  choice: среди волков
  rationale: Кратко и точно передаёт пространственное положение овец во враждебном окружении.
- source_word: በዝኁ
  choice: размножились
  rationale: Передаёт увеличение численности и соответствует привычной библейской речи, оставаясь понятным современному читателю.
- source_word: ኮኑ መራዕየ ብዙኃተ ዘአባግዕ
  choice: стали множеством овечьих стад
  rationale: Сохраняет коллективный и пасторальный образ трудного заключительного выражения, не сводя его просто к множеству отдельных овец.
theological_decisions:
- issue: Кого обозначает «Господь» в образном видении
  choice: Господь
  alternative: владыка / хозяин овец / Бог
  rationale: «Господь» сохраняет богословский вес и вместе с тем не раскрывает символ через пояснительную вставку.
- issue: К кому относится местоименный суффикс в двух выражениях «с ним»
  choice: 'К одной овце из предшествующего контекста: «с ней»'
  alternative: 'К Господу: «с Ним»'
  rationale: Контекст животного видения и параллельный английский аудированный слой поддерживают отнесение к ранее названной овце. Однако форма исходного языка сама по себе допускает мужской референт, поэтому альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис оставлен ясным, а повтор «с ней» сохранён ради параллелизма исходного текста. Неясности местоименного референта и заключительной коллективной фразы не устранены молча, а вынесены в сноски.
