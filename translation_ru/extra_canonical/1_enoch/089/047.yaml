base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/047.yaml
  text: And the first ram pursued that later ram[a], and that later ram rose up and fled from before his face[c][b]; and I saw until those dogs brought down the first ram.
translation:
  language: ru
  text: И первый овен[a] погнался за тем последующим овном. Тот последующий овен поднялся и убежал от него[b]. И я смотрел, пока те псы не повергли первого овна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Геэзское слово может означать также «дикого кабана», однако здесь окружающий контекст указывает на овна.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «убежал от лица его» — семитский оборот со значением бегства от кого-либо.'
    reason: literal_rendering
lexical_decisions:
- source_word: ሐርጌ
  choice: овен
  rationale: Слово допускает значение «дикий кабан», но в ближайшем контексте «Апокалипсиса животных» обозначает овнов, ведущих овец; перевод «овен» сохраняет последовательность образов.
- source_word: ቀዳማዊ
  choice: первый
  rationale: Прямо передаёт временное первенство одного овна по отношению к другому.
- source_word: ዳሓራዊ / ዳሕራዊ
  choice: пришедший после него
  rationale: Передаёт последовательность, не утверждая без необходимости, что речь непременно о последнем или строго втором персонаже.
- source_word: ሰደዶ
  choice: погнался
  rationale: Естественно и наглядно выражает активное преследование в повествовательном контексте.
- source_word: ተንሥአ
  choice: поднялся
  rationale: Сохраняет отдельное движение, предшествующее бегству.
- source_word: ነፍጸ
  choice: убежал
  rationale: Передаёт бегство от преследователя ясно и современно.
- source_word: እምቅድመ ገጹ
  choice: от него
  rationale: Естественный русский эквивалент семитского оборота «от лица его».
- source_word: አክላብ
  choice: псы
  rationale: Точно сохраняет образ собак; «псы» соответствует достоинству и напряжённости апокалиптического повествования.
- source_word: አውደቅዎ
  choice: повергли
  rationale: Передаёт каузативное значение «заставили пасть, свалили» и сохраняет насильственный характер сцены.
theological_decisions:
- issue: Сохранение символических животных в политико-историческом видении
  choice: Оставить образы овнов и псов без отождествления с историческими лицами или народами в основном тексте.
  alternative: Заменить животных предполагаемыми историческими правителями или народами.
  rationale: Текст сам излагает видение посредством устойчивой зооморфной символики; перевод не должен подменять образ его толкованием.
- issue: Контекстуальное значение многозначного ሐርጌ
  choice: Перевести как «овен».
  alternative: Перевести как «дикий кабан».
  rationale: Хотя словарно возможно значение «дикий кабан», окружающая символическая последовательность говорит об овнах, ведущих овец; вариант «кабан» нарушил бы образную связь данного эпизода.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной интонацией, подходящей для апокалиптического видения. Формула «я смотрел, пока…» сохраняет поступательное развитие визионерского рассказа; буквальный семитизм в основном тексте естественно сглажен.
