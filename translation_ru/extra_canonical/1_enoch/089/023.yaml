  yaml_path: translation/extra_canonical/1_enoch/089/023.yaml
  text: And the wolves began to pursue those sheep until they overtook them at a spring of water[a][b].
translation:
  language: ru
  text: И волки стали преследовать тех овец, пока не настигли их у источника воды[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «у водоёма». Слово, обозначающее это водное место, допускает разные оттенки; речь может идти об источнике, водоёме или другом скоплении воды.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አዝእብት
  choice: волки
  rationale: Конкретно передаёт вид хищников в устойчивой образности «Апокалипсиса животных», не раскрывая символ посредством толкования.
- source_word: አሐዙ
  choice: стали
  rationale: 'Перед следующим глагольным действием форма естественно понимается как начинательная: «стали преследовать».'
- source_word: ይትልውዎሙ
  choice: преследовать
  rationale: Передаёт враждебное следование хищников точнее, чем нейтральное «следовать за».
- source_word: ዝኩ አባግዕት
  choice: тех овец
  rationale: Сохраняет указательное значение и отсылку к уже упомянутой группе овец.
- source_word: እስክ ተረክብዎሙ
  choice: пока не настигли их
  rationale: Глагол ረከበ здесь означает достижение или настижение преследуемых, а не принуждение их двигаться.
- source_word: በአሐቲ ዐይገ ማይ
  choice: у источника воды
  rationale: Предлог በ передаёт местонахождение — «у/при», а существительное обозначает водный источник; выражение не следует превращать в направительное «в воду».
theological_decisions:
- issue: Символика животных в видениях-снах
  choice: В основном тексте сохранить буквальные образы волков и овец.
  alternative: Заменить животных толковательными обозначениями исторических народов.
  rationale: Текст намеренно говорит посредством развёрнутой животной символики; перевод не должен заранее разрешать её историческое истолкование.
- issue: Соотношение настижения овец и воды
  choice: Передать, что волки настигли овец у водного источника.
  alternative: «Загнали их в водоём».
  rationale: Глагол выражает настижение, а предлог — местонахождение. Вариант с загоном в воду добавляет причинное движение, которого форма прямо не выражает, и преждевременно меняет последовательность рассказа.
translation_notes:
  register: Современный литературный русский язык; повествовательная фраза краткая и достойная по тону. Сохранена апокалиптическая образность и отмечена реальная лексическая неопределённость названия водного места.
