  source_fidelity: 'Основная передача соответствует исправленной англоязычной сверке: передача «передам», «по счёту», выделение обречённых и повеление уничтожить, а также активное «передал» сохраняют структуру геэзского текста. Однако «этих овец» неоправданно ослабляет указательное «тех овец» и звучит как близкое указание, тогда как в контексте речь о ранее названной группе.'
