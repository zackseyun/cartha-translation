base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/060.yaml
  text: “And I will hand them over to you by number[a], and I will tell you which of them are to be destroyed[c][b], and those you shall destroy.” And he handed over to them those sheep.
translation:
  language: ru
  text: «И Я передам их вам по числу и скажу вам, кого из них надлежит уничтожить; тех и уничтожьте». И Он передал им тех овец.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አሜጥወክሙ
  choice: Я передам их вам
  rationale: Форма глагола መጠወ выражает передачу адресатам, а не сообщение; местоимение «их» естественно восстанавливается по контексту.
- source_word: በኍልቍ
  choice: по счёту
  rationale: Оборот указывает на исчисленную, определённую передачу; «по счёту» кратко и естественно передаёт числовой смысл.
- source_word: እነግረክሙ
  choice: скажу вам
  rationale: Глагол обозначает сообщение или объявление; простой современный оборот сохраняет прямую речь.
- source_word: ዘይትኃጐል እምኔሆሙ
  choice: кого из них надлежит уничтожить
  rationale: Относительная конструкция выделяет тех из передаваемой группы, кому предназначено уничтожение. Безличное «надлежит» сохраняет смысл пассивной формы, не называя действующего лица.
- source_word: አኅጕሉ
  choice: тех и уничтожьте
  rationale: Повелительная форма множественного числа требует прямого приказа. Указательное «тех» связывает приказ с только что выделенной группой.
- source_word: ወመጠወ ሎሙ
  choice: И Он передал им
  rationale: Это активная форма третьего лица единственного числа, а не страдательная конструкция. Заглавная буква отражает продолжающееся указание на Господа сна из контекста.
- source_word: ዝኩ አባግዐ
  choice: этих овец
  rationale: В данном повествовании существительное обозначает передаваемых овец как группу; русский винительный множественного числа согласуется с контекстом.
theological_decisions:
- issue: Неназванный исполнитель в выражении о предназначенных к уничтожению
  choice: кого из них надлежит уничтожить
  alternative: которые из них должны быть уничтожены
  rationale: Безличная формулировка сохраняет пассивный смысл и не уточняет, кем предопределено уничтожение, тогда как следующий императив прямо называет адресатов исполнителями.
- issue: Референт подлежащего в заключительной фразе
  choice: Он
  alternative: он
  rationale: По контексту прямую речь произносит Господь овец; заглавная буква соответствует русской библейской издательской традиции, не добавляя к тексту нового действующего лица.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования. Сохранены повтор глагола передачи, прямой приказ и напряжение между безлично обозначенной участью овец и явно названными исполнителями. Кавычки показывают завершение прямой речи, продолжающейся из предыдущего стиха.
