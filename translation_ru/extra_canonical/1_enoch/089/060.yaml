  terminology: «Уничтожить» точно отражает приказ о губительном действии, не добавляя способа. Заглавное «Он» — редакционно допустимое контекстное обозначение говорящего, но не требуется лексикой стиха; оно сохранено. «Тех овец» лучше передаёт демонстратив и связь с выделенной группой.
