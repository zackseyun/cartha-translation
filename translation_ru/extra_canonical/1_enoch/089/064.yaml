base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/064.yaml
  text: And let them not know[a], and do not show them, and do not rebuke them; but write down all the destruction of the shepherds, each one in its time[c][b], and bring all of it up before me.
translation:
  language: ru
  text: И пусть они не знают; ты не показывай им и не обличай их. Но запиши все разорения пастухов[c] — каждое в своё время, одно за другим[a] — и вознеси всё это ко Мне[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфиопское сочетание после «в своё время» имеет дистрибутивный смысл — по отдельности, последовательно; его точная форма в данном свидетельстве текста трудна.
    reason: textual_variant
  - marker: b
    text: 'Или: «представь всё это Мне». Эфиопский глагол буквально передаёт движение вверх, поэтому в тексте сохранён образ небесного представления записи.'
    reason: lexical_alternative
  - marker: c
    text: 'Генитивная связь неоднозначна: возможны «разорения, совершённые пастухами» и «разорение (или гибель) самих пастухов».'
    reason: genuine_ambiguity
lexical_decisions:
- source_word: ወኢያእምሩ
  choice: И пусть они не знают
  rationale: Форма естественно понимается как отрицательный юссив третьего лица множественного числа, а не как повествовательное «они не знали».
- source_word: ወኢታርእዮሙ
  choice: ты не показывай им
  rationale: Префикс второго лица мужского рода единственного числа и отрицательная форма указывают на запрет, обращённый к собеседнику говорящего.
- source_word: ወኢትዝለፎሙ
  choice: и не обличай их
  rationale: Глагол выражает порицание или укор; «обличай» сохраняет судебно-нравственный оттенок и согласуется с формой запрета второго лица.
- source_word: አላ፡ ጸሐፍ
  choice: Но запиши
  rationale: Противительный союз и повелительное наклонение обозначают переход от невмешательства к ведению записи.
- source_word: ኵሎ፡ ሐጕለ፡ ኖላዊያን
  choice: всё разорение, причинённое пастухами
  rationale: В контексте ведётся учёт разрушений, совершённых пастухами. В сноске сохранена формальная возможность понять генитив как относящийся к гибели самих пастухов.
- source_word: በጊዜሁ፡ ለለ፡ ፩፩
  choice: от каждого в своё время, одного за другим
  rationale: Переданы временное значение и дистрибутивность сочетания, включая повтор единицы.
- source_word: ወአዐርግ፡ ኵሎ፡ ኀቤየ
  choice: и вознеси всё это ко Мне
  rationale: «Вознеси» сохраняет буквальный образ движения вверх и соответствует небесному представлению записи говорящему.
theological_decisions:
- issue: Невмешательство в действия пастухов
  choice: Говорящий запрещает сообщать пастухам, показывать им запись или обличать их, повелевая вместо этого вести учёт для последующего суда.
  alternative: 'Читать первые глаголы как повествование о прошлом: «они не знали, и я не показывал им и не обличал их».'
  rationale: Грамматические формы поддерживают запрет и обращение ко второму лицу. Перевод не смягчает напряжение между временным невмешательством и тщательной фиксацией для будущего воздаяния.
- issue: Кто является субъектом разорения
  choice: Пастухи причиняют разорение, которое надлежит записать.
  alternative: Речь может идти о гибели или погибели самих пастухов.
  rationale: Контекст учёта деяний пастухов благоприятствует агентному пониманию, но формальная неоднозначность генитивной связи отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным апокалиптическим звучанием. Местоимение «Мне» написано с прописной буквы как обращение к небесному Владыке; синтаксис разделён на два предложения ради ясности последовательности запретов и повеления.
