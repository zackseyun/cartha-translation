base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/028.yaml
  text: But the sheep passed from that water and went out into a wilderness where there was no water or grass[a]; and they began to open their eyes and to see. And I saw the Lord of the sheep shepherding them and giving them water and grass[d][c][b], and that sheep going and leading them.
translation:
  language: ru
  text: Те овцы отошли от той воды и вышли в пустыню, где не было ни воды, ни травы[b]; и начали открывать глаза и видеть[a]. И увидел я Господа овец, пасущего их и дающего им воду и траву, и ту овцу, идущую и ведущую их[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «начали открывать глаза и видеть», вероятно, обозначают пробуждение или обновление восприятия внутри видения; перевод сохраняет буквальный образ.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «ни воды, ни пастбища». Слово, переведённое как «трава», обозначает растительность, служащую кормом для стада.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквальная конструкция представляет эту овцу как часть увиденной картины: автор видит её идущей и ведущей остальных.'
    reason: grammar
lexical_decisions:
- source_word: አባግዕሰ
  choice: Овцы же
  rationale: Существительное передано как «овцы», а энклитическая частица — естественной русской конструкцией с «же»; контекстуальная отсылка сохраняется без добавления отсутствующего здесь указательного местоимения.
- source_word: ኃለፉ እምዝኩ ማይ
  choice: отошли от той воды
  rationale: Передаёт движение прочь от ранее названной воды, не уточняя без достаточных оснований, пересекли ли овцы её.
- source_word: ውስተ በድው
  choice: в пустыню
  rationale: «Пустыня» естественно сохраняет библейско-апокалиптическое звучание и не обязательно обозначает исключительно песчаную местность.
- source_word: ኀበ አልቦ ማየ ወሣዕረ
  choice: где не было ни воды, ни травы
  rationale: Парная отрицательная конструкция по-русски ясно подчёркивает полное отсутствие воды и корма.
- source_word: አኃዙ ይክሥቱ አዕይንቲሆሙ ወይሬእዩ
  choice: начали открывать глаза и видеть
  rationale: Сохранён буквальный образ прозрения внутри видения, без замены его толкованием вроде «начали понимать».
- source_word: እግዚኦሙ ለአባግዕ
  choice: Господа овец
  rationale: Сохранён устойчивый титул божественной фигуры в животном апокалипсисе без поясняющей подстановки имени или богословской интерпретации.
- source_word: ይርዕዮሙ
  choice: пасущего их
  rationale: Русский глагол сохраняет пастырское действие и одновременно подходит к образу овец.
- source_word: ይሁቦሙ ማየ ወሣዕረ
  choice: дающего им воду и траву
  rationale: Прямая и прозрачная передача действия, обращающего вспять лишения пустыни.
- source_word: ዝኩ በግዕ
  choice: ту овцу
  rationale: Указательное местоимение сохранено и отсылает к конкретной овце, уже известной из хода видения.
- source_word: እንዘ የሐውር ወይመራሖሙ
  choice: идущую и ведущую их
  rationale: Причастная конструкция естественно связывает продолжающиеся действия с глаголом «увидел» и сохраняет их параллель действиям Господа овец.
theological_decisions:
- issue: Кто такой «Господь овец»
  choice: Сохранить титул «Господь овец» без раскрывающей подстановки
  alternative: «Бог, пастырь Израиля» или «хозяин овец»
  rationale: Образ явно относится к божественной фигуре, но перевод должен сохранять собственный символический язык видения, а не заменять его толкованием.
- issue: Смысл открывания глаз овцами
  choice: Сохранить буквальное «начали открывать глаза и видеть»
  alternative: «Они пробудились» или «начали понимать»
  rationale: Фраза, вероятно, указывает на пробуждение восприятия, однако текст выражает это посредством животного образа; буквальная формулировка сохраняет напряжение между образом и символическим смыслом.
- issue: Связь последней фразы с «увидел я»
  choice: 'Передать действия овцы зависимыми причастиями: «ту овцу, идущую и ведущую их»'
  alternative: 'Оформить самостоятельным предложением: «а та овца шла и вела их»'
  rationale: Конструкция с እንዘ и имперфектом описывает увиденное продолжающееся действие; зависимая форма сохраняет синтаксическую связь и не превращает её в отдельное повествовательное утверждение.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис сделан ясным для обычного читателя, но сохранены повторения «вода и трава», пастырская образность, указательность «ту овцу» и открытая символика прозрения.
