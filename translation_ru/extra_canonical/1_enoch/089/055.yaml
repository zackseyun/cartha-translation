base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/055.yaml
  text: And he gave them over into the hand of the lions and the leopards and the wolves and the hyenas[a], and into the hand of the foxes, and to all the wild beasts[e][d][c][b]; and those beasts of the field began to tear apart those sheep.
translation:
  language: ru
  text: И Он предал их львам, леопардам, волкам и гиенам[a], лисицам[b] и всем диким зверям; и те звери поля принялись терзать этих овец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «шакалов»; точное название животного не вполне ясно.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «шакалов»; это слово может обозначать сходных диких псовых.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሐደጎሙ
  choice: И Он предал их
  rationale: Глагол допускает значения «оставил» и «отдал»; в контексте суда «предал» сохраняет активную передачу во власть врагов, не раскрывая аллегорию посредством толкования.
- source_word: ውስተ እደ
  choice: в руки
  rationale: Сохранён исходный образ передачи «в руку», но употреблено естественное для русского языка устойчивое выражение во множественном числе.
- source_word: አናብስት
  choice: львов
  rationale: Контекстуально и лексически это конкретное обозначение львов в ряду хищников.
- source_word: አንምርት
  choice: леопардов
  rationale: Эфиопское слово, родственное семитским обозначениям леопарда, точнее передавать как «леопарды», а не как исторически и географически менее вероятные «тигры».
- source_word: አዝእብት
  choice: волков
  rationale: Прямое обозначение волков в перечне хищных зверей.
- source_word: አጽዕብት
  choice: гиен
  rationale: Вероятное обозначение гиен; возможное понимание как «шакалы» отмечено в сноске.
- source_word: ቈናጽል
  choice: лисиц
  rationale: Основное соответствие — «лисицы», хотя название может охватывать сходных псовых; неопределённость отмечена в сноске.
- source_word: ኵሉ አራዊት
  choice: всем диким зверям
  rationale: Фраза расширяет перечень от названных хищников ко всем диким зверям; дательный падеж естественно продолжает смысл «предал».
- source_word: ዝኩ አራዊተ ገዳም
  choice: те полевые звери
  rationale: Передано отдельно от предыдущего «всем диким зверям», чтобы сохранить различие двух эфиопских выражений и буквальный образ зверей поля.
- source_word: አሐዙ … ይምሥጥዎሙ
  choice: принялись терзать
  rationale: Сочетание имеет начинательное значение, а «терзать» естественно передаёт насильственное разрывание добычи.
- source_word: እልኩ አባግዕ
  choice: этих овец
  rationale: Сохранены и установленный в животной аллегории образ овец, и указательное значение.
theological_decisions:
- issue: Действующее лицо и образ суда
  choice: Он предал их в руки хищников
  alternative: Он оставил их в руках хищников
  rationale: «Предал» сохраняет напряжённый образ активного допущения суда, но перевод не называет действующее лицо Богом и не расшифровывает символику сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис сохраняет накопительный перечень хищников и различие между «дикими зверями» и «полевыми зверями», оставаясь понятным обычному читателю.
