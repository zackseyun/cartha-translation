base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/016.yaml
  text: And a sheep that had been rescued from the wolves fled and passed into the wild asses of the wilderness[a], and I saw the sheep as they lamented and cried out and petitioned their Lord with all their strength, until that Lord of the sheep came down at the voice of the sheep from his lofty dwelling[d][c][b], and he came to them and saw them.
translation:
  language: ru
  text: 'И одна овца, спасённая от волков, убежала и перешла к диким ослам пустыни[a]. И я увидел овец: они сетовали, взывали и молили своего Господа изо всех сил, пока тот Господь овец не сошёл в ответ на голос овец из Своего высокого чертога[b]; он пришёл к ним и увидел их.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перешла внутрь, к диким ослам пустыни». Конструкция трудна; вероятно, речь идёт о переходе овцы к другой группе животных в видении, то есть в их среду или область.'
    reason: textual_variant
  - marker: b
    text: 'Или: «из своей высокой обители». Эфиопское слово означает чертог, зал, дворец или место пребывания; здесь оно имеет форму с местоименным суффиксом «его».'
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ፡ ዘድኅነ፡ እምነ፡ አዝእብት
  choice: одна овца, спасённая от волков
  rationale: Начальное существительное и относящиеся к нему формы стоят в единственном числе и обозначают отдельную овцу, в отличие от последующего явного множественного числа. «Спасённая» передаёт совершившееся избавление от хищников.
- source_word: ነፈፀ
  choice: убежала
  rationale: Передаёт поспешное удаление от опасности естественным современным русским глаголом.
- source_word: ኀለፈ፡ ውስተ፡ አእዱገ፡ ገዳም
  choice: перешла к диким ослам пустыни
  rationale: Сохраняет движение к другой группе животных внутри видения и не превращает трудную конструкцию исключительно в географическое указание.
- source_word: የአወይዉ፡ ወይጸርኁ፡ ወይስእልዎ
  choice: сетовали, взывали и молили
  rationale: 'Три глагола сохраняют нарастание: скорбный плач, громкий призыв и настойчивая просьба.'
- source_word: ለእግዚኦሙ
  choice: своего Господа
  rationale: В данном контексте титул относится к Богу; «Господь» естественно передаёт божественное владычество и сохраняет связь с повторяющимся титулом далее.
- source_word: በኵሉ፡ ኃይሎሙ
  choice: изо всех сил
  rationale: Современный русский идиом точно передаёт полноту и напряжённость обращения.
- source_word: እግዚአ፡ አባግዕ
  choice: Господь овец
  rationale: Сохранён ключевой образный титул Апокалипсиса животных без замены на отвлечённое обозначение Бога.
- source_word: ኀበ፡ ቃሎሙ፡ ለአባግዕ
  choice: на голос овец
  rationale: Формально сохраняет направленность или отклик на голос овец, не уточняя сверх текста причинную связь.
- source_word: እምጽርኁ፡ ልዑል
  choice: из Своего высокого чертога
  rationale: ጽርሕ означает чертог, зал или обитель, а суффикс указывает на третье лицо единственного числа; ልዑል передаёт высоту. Такой перевод сохраняет образ небесного места пребывания и исправляет ошибочное понимание слова как «крик».
theological_decisions:
- issue: Божественный титул в символике Апокалипсиса животных
  choice: Господь овец
  alternative: владыка овец; господин овец
  rationale: «Господь овец» сохраняет устойчивый божественный титул и буквальный образ стада, не внося дополнительной конфессиональной интерпретации.
- issue: Нисхождение Бога из небесного места пребывания
  choice: сошёл ... из Своего высокого чертога
  alternative: спустился ... из своей возвышенной обители
  rationale: Перевод сохраняет вертикальный образ божественного вмешательства и конкретный смысл слова «чертог», не отождествляя его с криком овец.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Сохранены зооморфные образы и повтор титула «Господь овец». Синтаксическая трудность выражения о диких ослах и лексическая широта обозначения небесного чертога вынесены в примечания.
