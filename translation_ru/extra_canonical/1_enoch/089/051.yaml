base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/051.yaml
  text: And again I saw those sheep[a], how they went astray and walked in many paths, and they abandoned that house of their Lord. And the Lord of the sheep called some from among the sheep and sent them to the sheep[c][b], but the sheep began to kill them.
translation:
  language: ru
  text: И снова я увидел, как те овцы сбились с пути и пошли по многим дорогам, оставив тот дом своего Владыки[a]. И Владыка овец призвал некоторых из их среды и послал их к овцам, но овцы стали убивать их[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «своего господина» или «своего хозяина». Эфиопское слово может обозначать владыку, господина или хозяина; здесь образ указывает на Бога как правителя стада.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «но овцы схватили их, чтобы убить». Сжатую эфиопскую конструкцию можно понимать и как начало убийства, и как захват с намерением убить.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢክዎሙ ካዕበ ለዝኩ አባግዕ ካዕበ
  choice: И снова я увидел, как те овцы
  rationale: Начальное ካዕበ передано словом «снова» как формула продолжения видения. Повторное ካዕበ не воспроизводится механически, поскольку в русском это звучало бы как неестественный повтор; его функция отражена всей конструкцией.
- source_word: ከመ ስሕቱ
  choice: сбились с пути
  rationale: Передаёт заблуждение через естественный русский оборот, сохраняющий образ овец и нравственный смысл.
- source_word: ወሖሩ በብዙሕ ፍናዋት
  choice: и пошли по многим дорогам
  rationale: Сохраняет конкретный образ множества путей, не сводя его к отвлечённому непослушанию.
- source_word: ወሐደጉ ዝኩ ቤተ ዚአሆሙ
  choice: оставив тот дом
  rationale: «Оставив» естественно связывает действие с предшествующим движением и сохраняет значение ухода; русский контекст придаёт ему достаточную силу без избыточного толкования.
- source_word: ወእግዚኦሙ / እግዚኦሙ ለአባግዕ
  choice: своего Владыки / Владыка овец
  rationale: «Владыка» сохраняет как значение господина или хозяина, так и богословский вес образа. Прописная буква указывает на божественного персонажа аллегории, не разрушая пастушескую метафору.
- source_word: ጸውዐ እምውስተቶሙ ለአባግዕ
  choice: призвал некоторых из их среды
  rationale: Слово «некоторых» идиоматически выражает подразумеваемую часть стада, а «из их среды» точно передаёт избрание из числа самих овец.
- source_word: ወለአኮሙ ኀበ አባግዕ
  choice: и послал их к овцам
  rationale: Прямо передаёт поручение и направление посланных к стаду.
- source_word: ወአባግዕ አኃዙ ይቅትልዎሙ
  choice: но овцы стали убивать их
  rationale: Передаёт враждебный поворот и возможное начинательное значение сжатой конструкции; более конкретное понимание с захватом для убийства отмечено в сноске.
theological_decisions:
- issue: Передача እግዚእ в аллегории об овцах
  choice: Владыка
  alternative: господин; хозяин
  rationale: В образном контексте персонаж представляет Бога, однако исходное слово также обозначает господина или хозяина. «Владыка» сохраняет богословский вес, не вводя узкоконфессионального истолкования.
- issue: Характер призванных из среды овец
  choice: Не называть их прямо пророками
  alternative: пророки
  rationale: Хотя в аллегорическом контексте они могут представлять пророческих посланников, исходный текст продолжает говорить языком образа; перевод сохраняет эту недосказанность.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Сохранены повторы ключевого образа «овцы», конкретика дорог и дома, а также напряжение между буквальным образом владельца стада и его божественным значением.
