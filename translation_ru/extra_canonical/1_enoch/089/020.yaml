base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/020.yaml
  text: And the Lord of the sheep came to them[a], and while they were striking those wolves, and the wolves were crying out, the sheep became silent[c][b], and from that time they cried out no more.
translation:
  language: ru
  text: И Владыка овец пришёл к ним, и, пока они били тех волков и волки кричали, овцы умолкли и с того времени больше не кричали.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В представленной транскрипции последнее слово имеет вид አፀርኁ — «они закричали», что противоречит предыдущим словам об умолкших овцах. В критическом чтении здесь አጸርዑ — «они прекратили»; поэтому переведено: «больше не кричали».'
    reason: textual_variant
lexical_decisions:
- source_word: እግዚኦሙ
  choice: Владыка овец
  rationale: Буквально «их владыка»; в символическом строе «Апокалипсиса животных» местоимение относится к овцам. Формулировка сохраняет образ владычества и ясно обозначает связь с овцами.
- source_word: መጽአ ኀቤሆሙ
  choice: пришёл к ним
  rationale: Прямая и естественная передача движения к обозначенной группе.
- source_word: አባግዕ
  choice: овцы
  rationale: Сохраняет повторяющийся зооморфный образ народа и не сглаживает его до собирательного «стадо».
- source_word: ይዝብጥዎሙ ለእልኩ አዝእብት
  choice: они били тех волков
  rationale: 'Частица ለ перед «теми волками» здесь маркирует прямое дополнение: волки являются объектом ударов, а не действующим лицом. Неуточнённое «они» сохраняет неоднозначность подлежащего исходной последовательности.'
- source_word: አዝእብት እንዘ የአውይዉ
  choice: волки кричали
  rationale: Глагол обозначает громкий крик; нейтральное «кричали» не добавляет специально звериного оттенка слова «выли».
- source_word: አባግዕ አርመሙ
  choice: овцы умолкли
  rationale: Естественно выражает наступление молчания и сохраняет контраст с криком волков.
- source_word: ወእምሶቤሃ አጸርዑ
  choice: и с того времени больше не кричали
  rationale: Следует исправленному чтению አጸርዑ «они прекратили» вместо OCR-транскрипции አፀርኁ «они закричали»; подразумеваемое действие раскрыто по контексту для естественного русского языка.
theological_decisions:
- issue: Кем является владыка в символическом видении
  choice: «Владыка овец» как обозначение Бога внутри образного мира видения
  alternative: «их владыка» без уточнения референта
  rationale: Контекст «Апокалипсиса животных» связывает этого владыку с овцами и представляет его как божественного распорядителя; формулировка не вводит более поздней конфессиональной терминологии.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Повтор образов «овцы» и «волки» сохранён; неясное подлежащее «они» не конкретизировано сверх исходного текста.
