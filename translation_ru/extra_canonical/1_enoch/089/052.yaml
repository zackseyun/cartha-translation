base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/052.yaml
  text: And one of them escaped and was not killed[a]; and it cried out over the sheep, and they wanted to kill it, but the Lord of the sheep saved it from among the sheep[c][b], and brought it up to me and set it down.
translation:
  language: ru
  text: И одна из них спаслась и не была убита; она вскочила и возопила над овцами[a]. Они хотели убить её, но Господь овец спас её из среды овец[b], поднял её ко мне и поместил её.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «возопила к овцам»; возможно также: «возопила об овцах». Употреблённый здесь геэзский предлог допускает разные понимания.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально конструкция содержит местоимение «от них», которое затем уточняется словом «овец»; то есть: «спас её от овец».'
    reason: grammatical_clarification
lexical_decisions:
- source_word: ድኅነ
  choice: спаслась
  rationale: В сочетании с последующим «не была убита» глагол описывает избавление от гибели; возвратная форма естественна по-русски и не устраняет возможный оттенок спасения.
- source_word: ኢተቀትለ
  choice: не была убита
  rationale: Прямая передача отрицательной пассивной формы современным литературным русским языком.
- source_word: ቀነጸ
  choice: вскочила
  rationale: Передаёт внезапное движение вверх и сохраняет живость образа в видении.
- source_word: ጸርኀ
  choice: возопила
  rationale: Передаёт сильный, настойчивый крик и поддерживает возвышенный, но понятный повествовательный регистр.
- source_word: ዲበ አባግዕ
  choice: над овцами
  rationale: Сохраняет основное пространственно-направительное значение предлога, не сводя неоднозначную фразу только к обращению или к высказыванию об овцах.
- source_word: ፈቀዱ ይቅትልዎ
  choice: хотели убить её
  rationale: Естественно и прямо выражает намерение, обозначенное конструкцией.
- source_word: እግዚአ አባግዕ
  choice: Господь овец
  rationale: Сохраняет повторяющийся в «Апокалипсисе животных» божественный титул и символику владычества.
- source_word: አድኃኖ
  choice: спас её
  rationale: При явном божественном субъекте этот глагол уместно передать сильным глаголом избавления, не ослабляя его богословского звучания.
- source_word: እምኔሆሙ ለአባግዕት
  choice: из среды овец
  rationale: Передаёт пролептическую конструкцию, в которой местоименный суффикс уточняется последующим существительным, и одновременно ясно обозначает удаление спасённой из окружения овец.
- source_word: አዕረጎ ኀቤየ
  choice: поднял её ко мне
  rationale: Сохраняет выраженную глаголом направленность вверх и движение к рассказчику.
- source_word: አንበሮ
  choice: поставил
  rationale: Кратко и конкретно передаёт помещение спасённой перед рассказчиком после её поднятия к нему.
theological_decisions:
- issue: Передача божественного титула в «Апокалипсисе животных»
  choice: Господь овец
  alternative: хозяин овец
  rationale: Титул служит благоговейным обозначением Бога внутри символики видения; «Господь» сохраняет его богословский и возвышенный характер, не превращая его в бытовое обозначение владельца.
- issue: Различение первоначального избавления и последующего действия Господа
  choice: «спаслась» в первой части и «спас её» при действии Господа
  alternative: «избежала гибели» в первой части и «избавил её» во второй
  rationale: Повтор корневой лексики отражает связь двух исходных глаголов спасения, но грамматически различает состояние уцелевшей овцы и явное спасительное действие Господа.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Формы «возопила» и «Господь овец» поддерживают достоинство видения, тогда как синтаксис остаётся простым и доступным. Женский род местоимений согласован с подразумеваемой овцой.
