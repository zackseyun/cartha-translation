base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/069.yaml
  text: And beyond their prescribed measure they kept killing and destroying[d][c][b][a], and I was weeping and crying out because of those sheep.
translation:
  language: ru
  text: И сверх предписанной им меры[a] они продолжали убивать и губить, а я плакал и громко кричал о тех овцах.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сверх установленного им порядка (или числа)». Эфиопское слово может означать порядок, предписание либо установленную меру.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ፈድፋደ እምሥርዓቶሙ
  choice: сверх предписанной им меры
  rationale: ፈድፋደ с እም выражает превышение, а ሥርዓት — установленный порядок, предписание или меру. Этот вариант сохраняет как идею превышения, так и нормативный оттенок, не сводя выражение лишь к числу.
- source_word: ይቀትል
  choice: продолжали убивать
  rationale: Имперфект в повествовании передаёт продолжающееся или повторяющееся действие.
- source_word: ያሐጕል
  choice: губить
  rationale: Глагол обозначает причинение гибели или разорение; «губить» сохраняет широкий смысл и сочетается с «убивать», не создавая ложной точности.
- source_word: እንዘ እብኪ ወአዐውዩ
  choice: я плакал и взывал
  rationale: እንዘ с глагольными формами образует обстоятельственную конструкцию продолжающегося действия. В тексте нет слова «спать»; выражение относится к плачу и возгласам.
- source_word: አባግዕ
  choice: овец
  rationale: Сохранён образ овец из апокалиптического видения без истолкования их как конкретного народа в основном тексте.
theological_decisions:
- issue: Следует ли прямо отождествлять овец с Израилем или Иудеей
  choice: Сохранить образ «овец»
  alternative: Передать как «народ» или «Израиль»
  rationale: Основной текст должен сохранять символику видения и не подменять перевод её толкованием.
- issue: Характер превышенной нормы
  choice: «предписанная им мера» с сохранением нормативного и количественного оттенков
  alternative: «их число» или «их порядок»
  rationale: Контекст допускает установленное количество, но лексема ሥርዓት шире числа и несёт смысл распоряжения, правила или установленной меры.
translation_notes:
  register: 'Современный литературный русский язык с достоинством апокалиптического повествования. Союзная структура оригинала сохранена без тяжеловесной буквальности. Ошибочное прочтение «пока я спал» не принято: እንዘ вводит продолжающиеся действия «плакал и взывал».'
