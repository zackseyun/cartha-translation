base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/049.yaml
  text: And those sheep grew and multiplied[a], and all those dogs and foxes and wild boars of the field feared and fled from them. And that ram gored and killed all the beasts, and those beasts were no longer able again to be in the midst of the sheep[e][d][c][b], and they did not seize anything from them.
translation:
  language: ru
  text: И те овцы умножились и стали многочисленны, а все те псы, лисицы[a] и дикие кабаны пустыни[b] испугались их и убежали от них. И тот баран бодал[c] и убивал всех зверей, и звери уже не могли вновь быть среди овец и уже ничего у них не отнимали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «шакалы»; точный вид животного не вполне ясен.'
    reason: lexical_alternative
  - marker: b
    text: То есть дикие свиньи необитаемой местности; «пустыня» здесь может обозначать степь или невозделанную землю.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «ударял»; применительно к барану речь, вероятно, идёт об ударах рогами.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ልህቁ / በዝኁ
  choice: выросли и умножились
  rationale: Сохранены оба близких по смыслу глагола, усиливающих картину роста овец, при этом фраза остаётся естественной по-русски.
- source_word: አባግዕ
  choice: овцы
  rationale: Конкретный образ животных сохранён без замены более отвлечённым словом «стадо».
- source_word: አክላብ
  choice: псы
  rationale: Буквально передаёт название животных и поддерживает возвышенно-повествовательный регистр видения.
- source_word: ቈናጽል
  choice: лисицы
  rationale: Наиболее обычное соответствие; возможное значение «шакалы» отмечено в сноске из-за зоологической неопределённости.
- source_word: ሐራዊያ ገዳም
  choice: дикие кабаны пустыни
  rationale: Передаёт как диких свиней, так и их связь с необитаемой, невозделанной местностью; «пустыня» здесь не обязательно означает песчаную пустыню.
- source_word: ፈርሁ ወነፍጹ እምኔሁ
  choice: испугались их и убежали от них
  rationale: Сохранены и страх, и последовавшее за ним бегство.
- source_word: ሐርጌ
  choice: баран
  rationale: Сохранён конкретный образ животного-вожака в символическом видении.
- source_word: ጐድአ
  choice: бодал
  rationale: В отношении барана глагол естественно обозначает удар рогами; более общее значение «ударял» отмечено в сноске.
- source_word: አራዊተ / አራዊት
  choice: звери
  rationale: Слово сохраняет представление о враждебных диких животных лучше, чем нейтральное «животные».
- source_word: አክህሉ ዳግመ
  choice: уже не могли
  rationale: Передаёт прекращение прежней возможности; буквальное воспроизведение наречия со значением «снова» создало бы неясную и тяжёлую русскую конструкцию.
- source_word: ማእከለ አባግዕ
  choice: находиться среди овец
  rationale: Сохраняет пространственный образ зверей внутри среды овец, не уточняя, входили они туда или оставались там.
- source_word: ምንትኒ ገሙራ ኢመሠጡ እምኔሆሙ
  choice: больше ничего у них не уносили
  rationale: Передаёт полное прекращение хищнического захвата; «уносили» естественно для нападения зверей и не превращает образ в отвлечённый грабёж.
theological_decisions:
- issue: Следует ли раскрывать исторические соответствия животных в основном тексте
  choice: Сохранить животные образы без истолкования
  alternative: Заменить животных обозначениями представляемых ими народов или групп
  rationale: Текст представляет последовательное символическое видение; перевод должен сохранять его образность и не навязывать спорное историческое толкование.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным тоном. Повторы и конкретная зооморфная образность апокалиптического видения сохранены, но неестественные для русского языка сочетания сглажены.
