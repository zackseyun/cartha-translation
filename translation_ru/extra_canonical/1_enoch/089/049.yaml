  - severity: low
    issue: «Выросли и умножились» менее точно отражает пару глаголов количественного роста.
    rationale: Аудиторская лексическая фиксация понимает пару как «умножились и стали многочисленны»; эта русская формулировка сохраняет оба близких усилительных глагола.
