base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/004.yaml
  text: And water[a], and darkness, and mist increased upon it; and I looked at the height of that water, and that water rose above that enclosure[d][c][b], and it poured over the enclosure and stood upon the earth.
translation:
  language: ru
  text: И вода, тьма и туман усиливались над ним; я увидел высоту той воды, и та вода поднялась выше того огороженного места[a], разлилась по нему и стояла на земле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «того загона», «того огороженного двора». В символическом контексте речь может идти об овчарне, но само слово имеет более широкое значение.'
    reason: lexical_alternative
  - marker: b
    text: То есть вода оставалась на земле. Перевод сохраняет буквальный образ исходного текста — «стояла».
    reason: translation_note
lexical_decisions:
- source_word: ወበዝን (вероятно, искажённое ወበዝኀ)
  choice: усиливались
  rationale: С учётом установленной ошибки в транскрипции форма восходит к глаголу «умножаться, возрастать». Русское множественное число согласуется с перечисленными водой, тьмой и туманом.
- source_word: ማይ
  choice: вода
  rationale: Сохранено повторяющееся единственное число и значение вещественного существительного; более истолковательное «потоп» не вводится.
- source_word: ጽልመት
  choice: тьма
  rationale: Прямой и стилистически уместный эквивалент, сохраняющий зловещую атмосферу видения.
- source_word: ጊሜ
  choice: туман
  rationale: Передаёт атмосферное помрачение в ряду с водой и тьмой; возможны также «мгла» и «дымка».
- source_word: አሬኢ
  choice: я увидел
  rationale: Естественно передаёт речь повествователя о видении и допускает последующее описание уровня воды.
- source_word: መልዕልተ
  choice: как высоко поднялась
  rationale: Контекстуально передаёт высоту или верхний уровень воды без неестественного русского выражения «увидел высоту воды».
- source_word: ተላዐለ
  choice: поднялась выше
  rationale: Сохраняет вертикальный образ подъёма воды над оградой.
- source_word: ዐጸድ
  choice: ограда
  rationale: Нейтрально обозначает огороженное место в символическом видении, не конкретизируя его как овчарню.
- source_word: ይከዑ
  choice: хлынула через
  rationale: Передаёт движение воды поверх границы ограды и силу наводнения; буквальнее возможно «перелилась через».
- source_word: ቆመ
  choice: стояла
  rationale: Сохраняет резкую семитскую образность исходного текста; по смыслу возможно «оставалась» или «покрыла».
theological_decisions:
- issue: Следует ли прямо назвать воду потопом
  choice: Сохранить «вода»
  alternative: «потоп» или «потопные воды»
  rationale: Контекст указывает на потоп, однако источник повторяет слово «вода». Перевод не делает подразумеваемое толкование частью основного текста.
- issue: Насколько конкретно передавать ዐጸድ в животной символике
  choice: «ограда»
  alternative: «овчарня», «двор», «загон»
  rationale: «Овчарня» могла бы преждевременно закрепить конкретное истолкование символа; «ограда» сохраняет более широкий образ огороженного пространства.
- issue: Как передать формулу «вода стояла на земле»
  choice: Сохранить «стояла на земле»
  alternative: «оставалась на земле» или «покрыла землю»
  rationale: Буквальная образность необычна по-русски, но понятна и сохраняет напряжённый язык видения, не добавляя отсутствующего в источнике глагола «покрывать».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной образностью апокалиптического видения. Синтаксис сглажен лишь там, где буквальное «увидел высоту воды» звучало бы неестественно; повтор слова «вода» и необычный образ «стояла на земле» сохранены.
