base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/002.yaml
  text: And again I lifted up my eyes toward heaven[a], and I saw a lofty roof, and seven streams upon it[c][b]; and those streams flowed into an enclosure with much water.
translation:
  language: ru
  text: И снова я поднял глаза к небу и увидел высокую кровлю[a], а на ней — семь потоков; и эти потоки изливали много воды в огороженное пространство[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Соответствующее геэзское слово может означать также крышу, покрытие или верхнюю часть сооружения; точный вид увиденного неясен.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «во двор»; возможно также значение «в загон».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ካዕበ
  choice: и снова
  rationale: Передаёт возобновление видения и сохраняет повторяющуюся повествовательную формулу.
- source_word: አልዓልኩ አዕይንትየ
  choice: я поднял глаза
  rationale: Сохраняет образное выражение оригинала, не сводя его к простому «я посмотрел».
- source_word: መንገለ ሰማይ
  choice: к небу
  rationale: Естественно передаёт направительное значение መንገለ.
- source_word: ናሕሰ ልዑለ
  choice: высокую кровлю
  rationale: «Кровля» передаёт значение крыши или верхнего покрытия, а «высокую» сохраняет указание на высоту без уточнения неопределённой архитектурной формы.
- source_word: ወ፯አስራብ ዲቤሁ
  choice: а на ней — семь потоков
  rationale: «Потоки» соответствует водному контексту, а «на ней» сохраняет пространственное отношение к кровле.
- source_word: እልኩ አስራብ
  choice: эти потоки
  rationale: Указательное выражение отсылает к только что упомянутым семи потокам.
- source_word: ይውሕዙ
  choice: текли
  rationale: Нейтрально и наглядно передаёт движение воды, не усиливая его до «лились» или «низвергались».
- source_word: በ፯ዐጸድ
  choice: в огороженное место
  rationale: Передаёт основную идею ограниченного пространства, не выбирая преждевременно более конкретное «двор» или «загон».
- source_word: ማየ ብዙሐ
  choice: где было много воды
  rationale: Сохраняет конкретный образ обилия воды и естественно связывает его с огороженным местом, как допускает синтаксис исходного текста.
