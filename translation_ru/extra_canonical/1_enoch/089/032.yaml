base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/032.yaml
  text: And that sheep that led them returned and went up upon that rock[a]; and the sheep, while their eyes were blinded, went astray from the path that he had shown them[b], but that sheep did not know it.
translation:
  language: ru
  text: И та овца, которая вела их, вернулась и поднялась на ту скалу[a]. А овцы с ослеплёнными глазами[b] сбились с пути, который она им указала, но та овца не знала об этом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на ту каменистую высоту»; геэзское слово может обозначать скалистое возвышение, а не отдельный камень.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «пока глаза их были ослеплены».'
    reason: aspectual_ambiguity
lexical_decisions:
- source_word: ገብአ
  choice: вернулась
  rationale: В данном повествовательном контексте глагол описывает возвращение овцы-проводника после того, как она вела остальных; это естественнее простого «пришла».
- source_word: በግዕ / አባግዕ
  choice: овца / овцы
  rationale: Сохраняется последовательная образность овец в «Апокалипсисе животных» без необоснованного уточнения пола или возраста.
- source_word: ዘይመርሖሙ
  choice: которая вела их
  rationale: Передаёт конкретную роль проводника и относительное определение единственной овцы.
- source_word: ዐርገ
  choice: поднялась
  rationale: Точно выражает движение вверх и естественно сочетается со скалой, не усиливая способ движения сверх исходного текста.
- source_word: ድማኅ
  choice: скала
  rationale: Передаёт конкретный образ каменистой возвышенности; возможный более широкий смысл отмечен в сноске.
- source_word: እንዘ ይጸልሉ አዕይንቲሆሙ
  choice: ослеплённые
  rationale: Кратко и естественно передаёт сопутствующее состояние овец; возможное процессуальное понимание сохранено в сноске.
- source_word: ይስሕቱ እምፍኖት
  choice: сбились с пути
  rationale: Сохраняет одновременно буквальную и нравственно-символическую силу образа отклонения от указанного пути.
- source_word: እንተ አርአዮሙ
  choice: который она указала им
  rationale: Каузативный глагол передан как указание пути; женское местоимение естественно относится к овце-проводнику.
- source_word: ኢያእመረ
  choice: не знала об этом
  rationale: Передаёт отсутствие знания или осведомлённости, не превращая его в невнимательность либо сознательное пренебрежение.
theological_decisions:
- issue: Следует ли понимать неведение овцы-проводника как простую неосведомлённость или как виновное пренебрежение
  choice: «та овца не знала об этом»
  alternative: «та овца не заметила этого» / «не обратила на это внимания»
  rationale: Геэзский текст говорит об отсутствии знания, а не обязательно о небрежности; буквальный смысл сохраняет напряжение повествования и не вводит дополнительной моральной оценки.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно возвышенным повествовательным тоном. Повтор «та овца» сохранён для связи с образным строем оригинала; местоимение «она» согласовано с русским родом слова «овца».
