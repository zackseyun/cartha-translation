base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/036.yaml
  text: And I saw in the vision until that sheep became a man[a], and built a house for the Lord of the sheep[c][b], and he placed all the sheep in that house.
translation:
  language: ru
  text: 'И видел я в видении: та овца стала человеком[a]; он построил дом для Господа овец[b] и разместил всех овец в том доме[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Превращение овцы в человека принадлежит символическому строю видения; имя этого человека в стихе не названо.
    reason: cultural_note
  - marker: b
    text: «Дом» здесь, вероятно, имеет оттенок значения «святилище» или «храм», однако в геэзском тексте стоит обычное слово «дом».
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «поставил всех овец». Глагол может обозначать размещение или установление.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ
  choice: овца
  rationale: Сохраняет общий образ животного из стада в символике «Апокалипсиса животных», не уточняя без необходимости пол или возраст словами «баран» либо «ягнёнок».
- source_word: ኮነ ብእሴ
  choice: стала человеком
  rationale: Передаёт необычное превращение внутри видения. Переход к местоимению «он» после превращения естественен по-русски и подчёркивает смену образа.
- source_word: ሐነጸ ቤተ
  choice: построил дом
  rationale: Буквально сохраняет образ дома; возможный смысл храма или святилища не вносится в основной текст, а отмечается в сноске.
- source_word: ለእግዚአ አባግዕ
  choice: для Господа овец
  rationale: «Господь» соответствует возвышенному значению እግዚአ и роли божественного Владыки стада; конструкция «Господь овец» сохраняет символический язык видения.
- source_word: አቀሞሙ
  choice: поставил всех овец
  rationale: Сохраняет каузативный образ «поставить», допуская также контекстуальное понимание «поместить, разместить».
- source_word: በውእቱ ቤት
  choice: в том доме
  rationale: Указательное местоимение передано явно, чтобы сохранить повествовательную отсылку к только что построенному дому.
theological_decisions:
- issue: Передавать ли ቤተ как «дом» или истолковывать как «храм»
  choice: дом
  alternative: храм; святилище
  rationale: В геэзском тексте употреблено обычное слово «дом». Храмовые ассоциации вероятны по контексту, но их не следует превращать в однозначное толкование основного текста.
- issue: Отождествление овцы, ставшей человеком
  choice: личность не названа
  alternative: Моисей; вождь, олицетворяющий Моисея или культовое руководство Израиля
  rationale: Сам стих сохраняет символическую фигуру без прямого имени; перевод не должен подменять образ его предполагаемым толкованием.
- issue: Смысл каузативного глагола አቀሞሙ
  choice: поставил
  alternative: поместил; разместил; заставил стоять
  rationale: Выбранный вариант сохраняет конкретный глагольный образ, а сноска указывает на допустимое более общее значение помещения внутрь дома.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Начальная формула «И видел я в видении» сохраняет библейский ритм. Разделение грамматической цепочки местоимением «он» после слов «стала человеком» делает превращение ясным и избегает неестественного согласования дальнейших действий с существительным женского рода «овца».
