base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/015.yaml
  text: And the wolves began to terrify them and to oppress them[a], until they destroyed their little ones and cast their little ones into a stream of much water[c][b]. And those sheep began to cry out because of their little ones and to lament before their Lord.
translation:
  language: ru
  text: И волки стали бояться их и притеснять их[a], пока не погубили их детёнышей и не бросили их детёнышей в многоводный поток[b]. И те овцы стали кричать из-за своих детёнышей и сетовать перед своим Господом[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нападать на них»; эфиопский глагол может обозначать силовое враждебное действие.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в поток обильной воды»; возможно также: «в многоводную реку» или «в бурный водный поток».'
    reason: lexical_alternative
  - marker: c
    text: 'Возможен перевод: «перед своим хозяином»; в контексте видения, вероятно, подразумевается Бог.'
    reason: alternative_reading
lexical_decisions:
- source_word: አዝእብት
  choice: волки
  rationale: Внутри животной аллегории название животного передано прямо, без подстановки подразумеваемого исторического референта.
- source_word: ይፈርህዎሙ
  choice: устрашать их
  rationale: Форма в данном контексте выражает причинение страха; «устрашать» сохраняет сильный и несколько возвышенный тон видения.
- source_word: አጠቅዎሙ
  choice: притеснять их
  rationale: Глагол обозначает сильное враждебное давление и допускает также значение нападения; «притеснять» хорошо передаёт продолжающееся насилие.
- source_word: እስከ ያኅልቅ
  choice: пока не погубили
  rationale: Оборот обозначает предел и итог насилия; «погубили» естественно передаёт полное уничтожение.
- source_word: ደቂቆሙ
  choice: их детёнышей
  rationale: Выбор сохраняет образ потомства овец и не превращает аллегорию непосредственно в человеческое повествование.
- source_word: ወገደፉ
  choice: бросили
  rationale: Предлог при последующем водном потоке указывает на насильственное перемещение внутрь воды; «бросили» звучит ясно и сильно.
- source_word: በውኂዘ ማይ ብዙኅ
  choice: в многоводный поток
  rationale: Компактное русское выражение передаёт водоток с обильной водой, не уточняя без необходимости, была ли это река или бурный поток.
- source_word: እልኩ አባግዕ
  choice: те овцы
  rationale: Указательное значение сохранено, поскольку повествование возвращается к уже упомянутой группе.
- source_word: ይጸርኁ
  choice: кричать
  rationale: Глагол передаёт громкий скорбный вопль; простое «кричать» понятно и сохраняет эмоциональную силу.
- source_word: በእንተ ደቂቆሙ
  choice: из-за своих детёнышей
  rationale: Предлог естественно выражает причину плача — участь их потомства.
- source_word: ይስክዩ
  choice: сетовать
  rationale: Слово передаёт скорбное обращение и жалобу, не сводя действие ни только к плачу, ни к формальной молитве.
- source_word: ኀበ እግዚኦሙ
  choice: пред своим Господом
  rationale: «Пред» сохраняет направленность и положение перед владыкой; прописная буква отражает вероятный божественный референт, а альтернативное понимание отмечено в сноске.
theological_decisions:
- issue: Следует ли передавать እግዚኦሙ как «Господь» или как «хозяин» в аллегории об овцах
  choice: своим Господом
  alternative: своим хозяином
  rationale: В контексте видения вопль овец обращён к божественному Владыке стада. Однако само слово допускает буквальное аллегорическое понимание «хозяин», поэтому оно не устранено, а вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной, но понятной лексикой. Повторы «их детёнышей» и последовательность действий сохранены ради ритма и образности исходного текста; исторические референты животной аллегории в основной текст не подставлены.
