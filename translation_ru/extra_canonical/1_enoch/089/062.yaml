base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/062.yaml
  text: 'And all the excess and destruction that was done by the shepherds[a], the scribe wrote down: how many they destroyed by my command, and how many they destroyed of their own accord[e][d][c][b]; all the destruction of those seventy shepherds was recorded against them.'
translation:
  language: ru
  text: 'И всё ослепление и уничтожение, совершённые пастухами, писец записал: сколько они погубили по Моему повелению и сколько погубили по собственной воле[a]; всё уничтожение, причинённое семьюдесятью пастухами, было записано против них.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на их головах» или «по их головам». Это может означать, что ответственность за совершённое лежит на самих пастухах; возможен также смысл: «по собственной воле» или «самовольно».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ጽጋበ
  choice: ослепление
  rationale: В данном контексте суда слово, вероятнее всего, обозначает причинённое ослепление; отглагольное существительное естественно сочетается с последующим «совершённое» и не сводит образ к одному лишь состоянию.
- source_word: ሐጕለ / ያሐጕሉ / ያሐጕሎሙ
  choice: разорение / погубили
  rationale: Повторяющийся корень обозначает насильственное уничтожение, удаление или доведение до гибели. «Разорение» сохраняет широту существительного, а «погубили» естественно передаёт личные глагольные формы.
- source_word: በኖሎት
  choice: пастухами
  rationale: ኖሎት — форма множественного числа слова «пастух», а предлог በ здесь указывает на действующих лиц; прежнее отождествление со слонами лексически ошибочно.
- source_word: ጻሐፍ
  choice: писец записал / было записано
  rationale: Форма связана с записью; в первой части естественно назвать писца как действующее лицо, а в итоговой формуле употребить пассив, сохранив мотив небесного учёта.
- source_word: ሚመጠነ
  choice: сколько
  rationale: Повтор вводит количественный учёт совершённого и естественно передаётся русским «сколько».
- source_word: በትእዛዝየ
  choice: по Моему повелению
  rationale: Сохранено первое лицо притяжательного показателя и властный характер распоряжения; прописная буква следует русской традиции передачи речи небесного Владыки, не добавляя имени или титула.
- source_word: በርእሶሙ
  choice: по собственной ответственности
  rationale: Буквально выражение связано с «их головами»; контекстуально оно возлагает совершённое на самих пастухов. Такой перевод сохраняет ответственность, не усиливая смысл до несомненной добровольности.
- source_word: ፯፯ ኖላዊ
  choice: семьюдесятью пастухами
  rationale: Сохранены число и символический образ пастухов, составляющий основу этого раздела видения.
- source_word: ዲቤሆሙ
  choice: против них
  rationale: В контексте судебной записи предлог выражает обвинительный характер внесённого в книгу свидетельства, а не просто нейтральное сообщение о пастухах.
theological_decisions:
- issue: Соотношение повеления и ответственности пастухов
  choice: Различены погибшие по повелению говорящего и погибшие по ответственности самих пастухов.
  alternative: Обе части могут пониматься как описание одного и того же санкционированного свыше уничтожения; либо буквальное «на их головах» может подчёркивать ожидающее их воздаяние.
  rationale: Противопоставление በትእዛዝየ и በርእሶሙ указывает на различие оснований действия. Формулировка «по собственной ответственности» удерживает напряжение между верховным повелением и виной пастухов, не утверждая сверх текста, что всё второе было сделано исключительно по их свободной воле.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис следует структуре геэзского текста, но устранены неестественные для русского повторы. Неясность идиомы በርእሶሙ сохранена в сноске; ошибочное чтение በኖሎት как указания на слонов отвергнуто.
