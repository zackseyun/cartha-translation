    rationale: В конструкции «ослепление и разорение, совершённое пастухами» причастие в единственном числе не согласуется с двумя однородными существительными. Исправление на «совершённые» не меняет смысла.
  - severity: medium
    issue: «По собственной ответственности» неестественно характеризует действие «погубили».
    rationale: Ответственность может лежать на ком-либо, но обычно не является способом или мотивом, «по которому» совершается уничтожение. «По собственной воле» передаёт контекстуальный смысл; сноска удерживает буквальное «на их головах» и возможность акцента на ответственности.
