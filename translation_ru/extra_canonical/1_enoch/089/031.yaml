base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/031.yaml
  text: And all those feared and trembled before him[a], and they followed after that ram that was with them [that was in their midst][c][b], because it was not able to stand before our Lord and look at him.
translation:
  language: ru
  text: И все они боялись его и трепетали перед ним; они пошли вслед за тем овном[b], который был с ними, [который находился среди них][a], потому что тот не мог стоять перед нашим Господом и смотреть на него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «который находился среди них» в источнике заключены в скобки и могут представлять вторичное или неуверенное чтение.
    reason: textual_variant
  - marker: b
    text: 'Глагольное выражение в геэз трудно для истолкования; возможно также понимание: «они взывали вслед ему о том овне» или «искали его из-за того овна».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎሙ እልኩ
  choice: все они
  rationale: Передаёт собирательное и анафорическое значение естественным современным русским языком; неясную форму እልኩ не следует калькировать как «сказанные».
- source_word: ይፈርሁ ወይርዐዱ እምኔሁ
  choice: боялись его и трепетали перед ним
  rationale: Сохранены два глагола страха и телесного трепета. Русское сочетание естественно передаёт отношение к лицу, выраженное እምኔሁ, не сводя оба глагола к одному.
- source_word: ወደርኁ ድኅሬሁ ለዝኩ በግዕ
  choice: они пошли вслед за тем овном
  rationale: Контекстуально передано движение вслед за овном, как в проверенном консультационном слое; трудность глагольного оборота и возможность иного понимания отмечены в сноске.
- source_word: በግዕ
  choice: овном
  rationale: Мужское животное и символический образ в «Апокалипсисе животных» требуют более точного «овен», а не общего «овца».
- source_word: ምስሌሆሙ
  choice: который был с ними
  rationale: Прямо передаёт связь овна с группой, не усиливая значение до более конкретного «среди них».
- source_word: ዘሀሎ ማእከሎሙ
  choice: который находился среди них
  rationale: Сохраняет более конкретное пространственное уточнение и заключено в квадратные скобки вслед за источником как неуверенное чтение.
- source_word: እስመ ኢንክል ቀዊመ
  choice: потому что тот не мог стоять
  rationale: Причинная связь сохранена. Указательное «тот» ясно относит подлежащее к овну, оставаясь совместимым с человеческим лицом, представленным в видении животным.
- source_word: ቅድመ እግዚእነ
  choice: перед нашим Господом
  rationale: Сохранено выраженное в геэз притяжательное местоимение; «Господь» соответствует возвышенному богословскому регистру.
- source_word: ወአነጽሮቶ
  choice: и смотреть на него
  rationale: Передаёт зрительное действие современно и ясно, не усиливая его до более толковательного «созерцать».
theological_decisions:
- issue: Кого обозначает выражение «наш Господь»
  choice: Сохранить «наш Господь» без поясняющей идентификации.
  alternative: Бог; Господь овец; небесный Владыка.
  rationale: Именно такое обозначение дано в геэз; замена истолковывающим титулом неоправданно сняла бы символическую и богословскую напряжённость видения.
- issue: Личный или животный уровень обозначения овна в заключительной части
  choice: Использовать «тот», грамматически соотносимое с овном, без обезличивающего местоимения.
  alternative: «Он» с явным акцентом на человеческом лице, символизируемом овном; «оно» на уровне образа животного.
  rationale: Русское «тот» сохраняет непосредственную связь с овном и одновременно не препятствует пониманию животного как образа человеческого деятеля.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис намеренно сохраняет последовательность образов и причинную связь, но избегает тяжёлых кальк. Квадратные скобки воспроизводят текстуальную неуверенность источника.
