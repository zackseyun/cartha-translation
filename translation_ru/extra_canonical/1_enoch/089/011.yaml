base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/011.yaml
  text: And they began to gore one another[a]; and that white bull which was born in their midst begot a wild ass and a white bull with it[c][b], and the wild asses multiplied.
translation:
  language: ru
  text: И стали они бодать друг друга[a]. А тот белый бык, который родился среди них, породил дикого осла и вместе с ним — белого быка[b], и дикие ослы размножились.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Исходный текст в начале стиха передан с некоторой текстовой неуверенностью. Глагол, вероятно, описывает взаимное нападение животных; перевод «бодать друг друга» сохраняет образ рогатого скота.
    reason: textual_variant
  - marker: b
    text: 'Буквально: «дикого осла и белого быка с ним». Местоименное выражение «с ним» может пониматься как указание на дикого осла либо на белого быка, который породил потомство.'
    reason: referential_ambiguity
lexical_decisions:
- source_word: ይትናሰኩ
  choice: стали бодать друг друга
  rationale: Взаимная форма обозначает обоюдное насильственное действие; «бодать» естественно сохраняет конкретный образ рогатых животных.
- source_word: ላህም ጸዓዳ
  choice: белый бык
  rationale: Сочетание обозначает белое животное из крупного рогатого скота; «бык» соответствует мужской генеалогической роли и сохраняет символический образ.
- source_word: ዘተወልደ ማእከሎሙ
  choice: который родился среди них
  rationale: Относительная конструкция относится к белому быку и не является главным сказуемым предложения.
- source_word: ወለደ
  choice: породил
  rationale: Активный глагол рождения вводит потомство белого быка; «породил» передаёт генеалогическую связь без истолкования аллегории.
- source_word: አድገ ገዳም
  choice: дикого осла
  rationale: Сочетание обозначает дикого осла; единственное число соответствует форме и синтаксической позиции прямого дополнения.
- source_word: ላህመ ጸዓዳ
  choice: белого быка
  rationale: Буквально сохранены вид животного и значимый для символики белый цвет.
- source_word: በዝኁ አእዱገ ገዳም
  choice: дикие ослы размножились
  rationale: Множественное «дикие ослы» является подлежащим; глагол передаёт их увеличение числом.
theological_decisions:
- issue: Символические животные в аллегорической генеалогии
  choice: Сохранить конкретные образы белого быка и дикого осла, не называя представленных ими лиц.
  alternative: Раскрыть аллегорию непосредственно в тексте как Авраама, Измаила и Исаака.
  rationale: Перевод должен передавать образный уровень видения и не подменять его историко-богословским толкованием.
- issue: Соотнесение выражения «вместе с ним»
  choice: Отнести его к дикому ослу, сохраняя непосредственную синтаксическую связь.
  alternative: Передать как «вместе с ним самим», относя выражение к белому быку-отцу.
  rationale: Ближайшим референтом в исходной последовательности является дикий осёл, однако конструкция допускает некоторую референциальную неоднозначность; она отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис сделан ясным, но конкретная животная символика и возможная неоднозначность местоименной связи сохранены.
