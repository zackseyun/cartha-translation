base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/048.yaml
  text: And afterward that ram arose and led the sheep[a]; and that ram fathered many sheep and lay down. And a little sheep became a ram in its place[d][c][b], and it became ruler and leader of those sheep.
translation:
  language: ru
  text: И тот последующий овен поднялся и повёл овец[c]. Этот овен породил много овец и лёг[a]. А маленькая овца[b] стала овном вместо него; этот овен стал правителем и предводителем тех овец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «лёг», вероятно, означает смерть овна, однако в основном тексте сохранён буквальный образ видения.
    reason: lexical_alternative
  - marker: b
    text: Прилагательное может означать как «маленькая», так и «молодая».
    reason: lexical_alternative
  - marker: c
    text: После слова «овец» в источнике стоит заключённое издателем в скобки слово «малый»; оно не согласуется с существительным во множественном числе и, вероятно, ошибочно перенесено сюда из следующей фразы.
    reason: textual_variant
lexical_decisions:
- source_word: ዳሓራዊ
  choice: позднейший
  rationale: Прилагательное определяет овна и обозначает более позднего, последующего овна, а не просто время действия; перевод сохраняет противопоставление прежнему овну.
- source_word: ሐርጌ
  choice: овен
  rationale: Конкретное обозначение самца овцы сохраняет различение фигур в животной аллегории.
- source_word: ተንሥአ
  choice: поднялся
  rationale: Передаёт обычный повествовательный глагол вставания или восхождения, не придавая ему специально воскресного смысла.
- source_word: መርሖሙ
  choice: повёл
  rationale: Сохраняет одновременно буквальный образ ведения овец и аллегорический смысл руководства.
- source_word: አባግዕ
  choice: овцы
  rationale: Сохранён конкретный образ животных, а не обобщающее «стадо».
- source_word: ወሊደ
  choice: породил
  rationale: Передаёт прямое значение рождения потомства при мужском субъекте без архаичного русского оборота.
- source_word: ብዙኃነ
  choice: много
  rationale: Естественно и точно передаёт указание на многочисленность потомства.
- source_word: ሰከበ
  choice: лёг
  rationale: Сохранён буквальный образ видения; вероятный смысл смерти пояснён в сноске, а не внесён в текст.
- source_word: በግዕ ንኡስ
  choice: маленькая овца
  rationale: Передаёт буквальный образ и сохраняет возможность понимать прилагательное как указание либо на малый размер, либо на юный возраст.
- source_word: ህየንቴሁ
  choice: вместо него
  rationale: Ясно выражает замещение и преемство, не раскрывая аллегорию в исторических терминах.
- source_word: መኰንነ
  choice: правитель
  rationale: Широкое обозначение власти не навязывает более узкого титула вроде князя или наместника.
- source_word: መራሔ
  choice: вождь
  rationale: Обозначает ведущего и руководящего овцами, сохраняя отличие от слова «правитель» и не добавляя отсутствующего слова «пастух».
theological_decisions:
- issue: Следует ли истолковывать смену овнов как конкретное историческое или династическое преемство
  choice: маленькая овца стала овном вместо него
  alternative: молодая овца стала овном, его преемником
  rationale: Текст выражает преемство посредством превращения животных. Перевод сохраняет апокалиптический образ и не подменяет его историко-богословским толкованием.
- issue: Следует ли прямо переводить положение овна как смерть
  choice: лёг
  alternative: умер
  rationale: В контексте видения этот оборот, вероятно, означает смерть, однако буквальный образ допускает напряжение между картиной и её значением; пояснение вынесено в сноску.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным тоном. Сохранены повторения и конкретная зооморфная образность апокалиптического видения; синтаксис слегка упорядочен ради ясности. «Позднейший овен» намеренно передаёт определение при существительном, а не наречное «после этого».
