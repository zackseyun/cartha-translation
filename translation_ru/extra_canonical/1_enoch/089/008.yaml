lexical_decisions:
- source_word: ማይ
  choice: вода
  rationale: Форма единственного числа передана собирательным существительным «вода», естественным для рассказа о потопе.
- source_word: ወአንዘ፡ ማይ፡ ይረድ
  choice: вода начала опускаться
  rationale: С учётом вероятной ошибки транскрипции ወአንዘ вместо ወአኀዘ сочетание понимается как начинательная конструкция с глаголом нисходящего движения.
- source_word: ውስቴቶሙ
  choice: в них
  rationale: Местоименная форма, вероятно, отсылает к ранее упомянутым безднам; перевод сохраняет эту анафорическую связь, не подменяя её пояснением.
- source_word: ተከሥተ፡ ምድር
  choice: земля обнажилась
  rationale: Передаёт открытие прежде покрытой водой земли естественным и образным русским выражением.
- source_word: መስቀር
  choice: корабль
  rationale: В данном контексте слово обозначает плавучее вместилище, остановившееся на земле. «Корабль» понятен современному читателю и не вводит прямо традиционное отождествление с ковчегом; неуверенность в слове отмечена в сноске.
- source_word: ተገኅሰት፡ ጽልመት
  choice: тьма рассеялась
  rationale: Естественно передаёт устранение или исчезновение тьмы, не уточняя действующую причину.
- source_word: ኮነ፡ ብርሃን
  choice: возник свет
  rationale: Сохраняет значение становления или появления света и не воспроизводит формульно привычную русскую фразу из Бытия.
theological_decisions:
- issue: Следует ли придать последней фразе точную формулу из рассказа о сотворении мира
  choice: возник свет
  alternative: стал свет; и был свет
  rationale: Образ допускает отсылку к творению или восстановлению, однако перевод сохраняет обычное значение геэзского глагола «стать, возникнуть», не усиливая интертекстуальную связь формульным совпадением.
- issue: Следует ли прямо назвать плавучее вместилище ковчегом
  choice: корабль
  alternative: ковчег; судно; бездна
  rationale: «Ковчег» мог бы заранее разрешить образ через библейское отождествление, тогда как «корабль» передаёт функцию предмета и оставляет лексическую трудность видимой в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Краткие сочинительные конструкции сохраняют ритм видения; архаизмы и конфессионально окрашенное «ковчег» в основном тексте избегаются.
