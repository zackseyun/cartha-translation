base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/058.yaml
  text: And he kept still as he watched[a], and he rejoiced because they were devoured and swallowed up and carried off[c][b]; and he abandoned them into the hand of all the beasts for food.
translation:
  language: ru
  text: А он молча смотрел и радовался тому, что их пожирали, проглатывали и уносили прочь[a]; и он оставил их во власти[b] всех зверей, им на съедение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уводили силой»; глагол может обозначать захват и насильственное унесение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в руку» — то есть во власть или под контроль.'
    reason: cultural_note
lexical_decisions:
- source_word: አርመመ እንዘ ይሬኢ
  choice: молча смотрел
  rationale: Передаёт одновременность молчания и наблюдения естественной русской конструкцией, не сводя глагол лишь к отсутствию речи.
- source_word: ተፈሥሐ
  choice: радовался
  rationale: Прямо передаёт радость и сохраняет тревожное напряжение повествования, не объясняя её причин сверх сказанного в тексте.
- source_word: ተበልዑ
  choice: их пожирали
  rationale: Глагол «пожирали» сохраняет насильственный образ нападения зверей и уместнее нейтрального «ели».
- source_word: ተውሕጡ
  choice: проглатывали
  rationale: Сохраняет второй, усиливающий образ в последовательности хищнического уничтожения.
- source_word: ተሀይዱ
  choice: уносили прочь
  rationale: Передаёт значение насильственного унесения или захвата, не заменяя его более общим «уничтожали».
- source_word: ኃደጎሙ
  choice: он оставил их
  rationale: Сохраняет основной смысл оставления и не усиливает его до активной передачи, которой исходный глагол сам по себе не требует.
- source_word: ውስተ እዴ
  choice: во власти
  rationale: Естественно передаёт семитский оборот «в руке», означающий нахождение под властью или контролем.
- source_word: ኵሎሙ አራዊት
  choice: всех зверей
  rationale: «Звери» сохраняют установленную образность животного апокалипсиса и хищнический оттенок контекста.
- source_word: ለመብልዕ
  choice: им на съедение
  rationale: Кратко и образно передаёт цель или результат оставления овец зверям в пищу.
theological_decisions:
- issue: Означает ли оставление активную судебную передачу или прекращение защиты
  choice: он оставил их во власти всех зверей
  alternative: он отдал их всем зверям
  rationale: Выбранная формулировка сохраняет суровость происходящего, но не превращает неоднозначное «оставил» в явно выраженную активную передачу.
- issue: Следует ли объяснять радость наблюдающего нравственно или богословски
  choice: радовался тому, что их пожирали, проглатывали и уносили прочь
  alternative: радовался совершавшемуся над ними суду
  rationale: Текст прямо сообщает о радости при виде случившегося, но не даёт здесь истолкования; перевод сохраняет это напряжение без добавленного объяснения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Три последовательных глагола сохранены ради нарастающей образности; тяжеловесный буквальный оборот «в руке всех зверей» вынесен в примечание.
