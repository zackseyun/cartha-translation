base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/010.yaml
  text: 'And they began to bring forth the beasts of the field and the birds[a]; and from among them there came forth every kind of the nations: lions, leopards, wolves, dogs, hyenas, wild boars, foxes, swine, falcons, vultures, kites, eagles, and ravens[c][b]; and in their midst a white bull was born.'
translation:
  language: ru
  text: 'И стали они рождать диких зверей и птиц; и из них произошли всевозможные народы[a]: львы, леопарды, волки, собаки, гиены, дикие кабаны, лисицы, зайцы, свиньи, соколы, грифы, коршуны, орлы и вороны[b]. И среди них родился белый бык.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сочетание, переведённое как «всевозможные народы», трудно для истолкования. Возможны также переводы: «всякого рода народы», «все виды народов» или, более обобщённо, «всякие роды»; однако слово «народы» прямо присутствует в геэзском тексте.'
    reason: lexical_alternative
  - marker: b
    text: Точное отождествление некоторых названных здесь животных и птиц неясно. В частности, вместо «гиен» или «лисиц» возможны шакалы, а вместо «соколов» — ястребы; точный вид птицы, переданной как «вороны», также не вполне определён.
    reason: lexical_alternative
