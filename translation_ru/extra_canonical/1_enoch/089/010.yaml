- source_word: ዘእምኵሉ፡ ኅብር፡ አሕዛብ
  choice: всякого рода народы
  rationale: Трудное сочетание передано естественно по-русски с сохранением явно присутствующего слова «народы» и классифицирующего значения «род/вид».
- source_word: አናምርት
  choice: леопарды
  rationale: Наиболее понятное современному читателю обозначение большой пятнистой кошки; возможно также «пантеры».
- source_word: አጽባዕት
  choice: гиены
  rationale: Вероятное традиционное отождествление; точный биологический вид остаётся спорным.
- source_word: ሐራዊ፡ ገዳም
  choice: дикие кабаны
  rationale: Сочетание указывает именно на дикого представителя свиных, что позволяет отличить его от следующих далее свиней.
- source_word: ቂናጽል
  choice: лисицы
  rationale: Допустимое отождествление неопределённого названия псовых; альтернативой могут быть шакалы.
- source_word: ገሐያት
  choice: зайцы
  rationale: Соответствует лексическому значению «зайцы/кролики» и исправляет прежнее ошибочное отождествление с белками.
- source_word: ሲሲት፡ ወአንሰርት፡ ወሆባይ፡ ወፍቃንስ፡ ወቋዓት
  choice: соколы, грифы, коршуны, орлы и вороны
  rationale: Передаёт последовательность хищных и падалеядных птиц в соответствии с вероятными отождествлениями, не скрывая их частичной зоологической неопределённости.
- source_word: ላህም፡ ጸዓዳ
  choice: белый бык
  rationale: Прямое и устойчивое обозначение центрального символического животного в повествовании.
theological_decisions:
- issue: Связь перечня животных с народами
  choice: сохранить слово «народы» в основном тексте
  alternative: передать лишь как «всевозможные виды животных»
  rationale: В геэзском тексте прямо присутствует አሕዛብ — «народы»; его устранение ослабило бы символико-политический смысл видения. При этом перевод не уточняет, какие именно народы обозначены отдельными животными.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным ритмом. Порядок и полнота перечня сохранены; синтаксис сделан понятным без устранения необычной связи между животными и народами.
