base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/065.yaml
  text: And I saw until those shepherds pastured in their season, and they began to kill and destroy much more than they had been commanded, and they abandoned those sheep into the hand of the lions.
translation:
  language: ru
  text: И я видел до тех пор, пока те пастухи пасли овец в отведённое им время[a]; и стали они убивать и истреблять гораздо больше, чем им было велено[b], и оставили тех овец во власти львов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в его время»; возможно также: «в своё время». Речь идёт об отведённом пастухам периоде.'
    reason: lexical_alternative
  - marker: b
    text: 'Сочетание имеет сравнительное значение: «гораздо больше, чем было им велено»; возможно также: «гораздо сверх данного им повеления».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኖላዊያን
  choice: пастухи
  rationale: Сохраняет устойчивый образ пастухов в «Апокалипсисе животных» и естественно сочетается с овцами.
- source_word: ይርዐዩ
  choice: пасли овец
  rationale: Передаёт действие пастухов в рамках образа стада; объект добавлен по-русски для ясности и естественности, поскольку далее прямо упомянуты овцы.
- source_word: በጊዜሁ
  choice: в отведённое им время
  rationale: Передаёт ограниченный, назначенный период деятельности пастухов, не уточняя сверх текста, кем он был отведён.
- source_word: ወአኃዙ
  choice: стали
  rationale: Естественно передаёт начинательное значение перед последовательностью глаголов.
- source_word: ይቅትሉ ወያሕጕሉ
  choice: убивать и истреблять
  rationale: Сохраняет два усиливающих друг друга глагола насилия; «истреблять» ясно отличается от «убивать», но не обязательно означает полное уничтожение.
- source_word: ብዙኃ እምትእዛዞሙ
  choice: гораздо больше, чем им было велено
  rationale: 'Учитывает сравнительное наречное значение сочетания: речь идёт о превышении предписанной меры разрушения, а не о прямом дополнении «многих».'
- source_word: ኃደጉ
  choice: оставили
  rationale: Сохраняет диапазон исходного глагола между простым оставлением и виновным преданием; контекст сам выражает укор.
- source_word: ዝኩ አባግዐ
  choice: тех овец
  rationale: Передаёт указательность и отсылает к конкретному стаду, порученному пастухам.
- source_word: ውስተ እደ አናብስት
  choice: во власти львов
  rationale: Естественный русский эквивалент идиомы «в руку», обозначающей передачу под власть; сохраняет конкретный образ львов.
theological_decisions:
- issue: Действовали ли пастухи в пределах данного им повеления или превысили его
  choice: «гораздо больше, чем им было велено» — пастухи превысили установленную меру
  alternative: «сверх своего повеления» или понимание «многих сверх повеленного»
  rationale: Сочетание ብዙኃ с እም имеет сравнительное наречное значение. Формулировка сохраняет напряжение между данной пастухам властью и их виновным превышением поручения, не определяя источник повеления прямо.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования. Начальное «И я видел» и образы пастухов, овец и львов сохранены; буквальная идиома «в руку львов» передана естественным выражением «во власти львов».
