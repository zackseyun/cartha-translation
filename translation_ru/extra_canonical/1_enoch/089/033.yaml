base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/033.yaml
  text: And the Lord of the sheep was exceedingly angry with them[a], and that sheep knew it, and came down from the summit of the rock, and came to the sheep[c][b], and found the greater part of them with their eyes blinded, and those who had gone astray.
translation:
  language: ru
  text: И Господь овец воспылал против них великим гневом, а та овца поняла это[a], спустилась с вершины скалы[b] и пришла к овцам. Она нашла большинство из них с помрачёнными глазами, а также тех, кто сбился с пути[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «узнала это», «осознала это». Объект глагола в исходном тексте не выражен прямо; вероятнее всего, речь идёт о происходящем и о гневе Господа.'
    reason: implicit_object
  - marker: b
    text: 'Буквально: «с вершины скалы». Подлежащим последующих глаголов естественно остаётся «та овца».'
    reason: syntactic_clarification
  - marker: c
    text: 'Или о глазах: «затемнёнными», «ослеплёнными». Исходное слово описывает помрачение зрения и не обязательно означает полную слепоту. Последующее выражение «тех, кто сбился с пути» может обозначать отдельную группу; исходный текст не требует отождествлять её с большинством, чьи глаза помрачены.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ፡ ለአባግዕ
  choice: Господь овец
  rationale: Сочетание обозначает господина или владыку овец. «Господь» сохраняет возвышенный регистр видения и роль божественного правителя, не внося более поздней христологической конкретизации.
- source_word: ተምዐዐ፡ ዲቤሆሙ፡ መዐተ፡ ዐቢየ
  choice: воспылал на них великим гневом
  rationale: Однокоренная усилительная конструкция передаёт чрезвычайную силу гнева. Русская формула звучит естественно и сохраняет торжественный тон.
- source_word: ወአእመረ፡ ዝኩ፡ በግዕ
  choice: а та овца поняла это
  rationale: Именная группа «та овца» является подлежащим глагола «знать, понимать, осознавать», что также соответствует контрасту с предшествующим повествованием. «Это» передаёт подразумеваемый объект — происходящее, прежде всего гнев Господа.
- source_word: ወወረደ፡ እምነ፡ ድማኅ፡ ለኵኵሕ
  choice: спустилась с вершины скалы
  rationale: Перевод прямо передаёт движение вниз от вершины скалы; подлежащим естественно остаётся ближайшая названная «та овца».
- source_word: ኀበ፡ አባግዕት
  choice: к овцам
  rationale: Сохранён буквальный животный образ апокалиптического видения без истолковывающей замены на «народ» или «стадо».
- source_word: ዘመብዝኅቶሙ
  choice: у большинства из них
  rationale: Передаёт значение большей части или большинства группы современным литературным русским языком.
- source_word: ዘጽሉለ፡ አዕይንቲሆሙ
  choice: глаза были помрачены
  rationale: «Помрачены» сохраняет образ затемнённого, нарушенного зрения и страдательный оттенок формы, не усиливая его до обязательной полной слепоты.
- source_word: እለ፡ ስሕቱ
  choice: они сбились с пути
  rationale: Выражение сохраняет одновременно буквальный образ заблудившихся овец и нравственный смысл уклонения.
theological_decisions:
- issue: Кто понимает происходящее и спускается со скалы
  choice: та овца понимает происходящее и спускается
  alternative: Господь узнаёт овцу и затем спускается сам либо спускается овца
  rationale: В геэзском тексте «та овца» грамматически выступает подлежащим глагола «поняла/узнала», а затем остаётся ближайшим подлежащим последовательных глаголов. Это чтение также сохраняет повествовательный контраст с предшествующим незнанием овцы.
- issue: Характер нарушения зрения
  choice: глаза были помрачены
  alternative: они были слепы
  rationale: Исходный глагол допускает затемнение или помрачение зрения и не требует истолковывать состояние как абсолютную и постоянную слепоту. Выбор сохраняет образ и богословскую напряжённость.
- issue: Соотношение помрачения глаз и уклонения с пути
  choice: оба состояния отнесены к большинству овец
  alternative: 'речь идёт о двух отдельных группах: овцах с помрачёнными глазами и тех, кто сбился с пути'
  rationale: Последовательность относительных выражений допускает тесное соединение двух характеристик; русская фраза передаёт их как совместное описание большинства, не превращая образ в догматическое истолкование.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, апокалиптическим звучанием. Повторяющаяся символика овец сохранена; синтаксис разгружен делением на два предложения. Архаизмы и конфессионально окрашенные толкования не вводились.
