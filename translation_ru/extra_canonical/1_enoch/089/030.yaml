base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/030.yaml
  text: And among them I saw the Lord of the sheep[a], standing before them; and they saw that he was great and fearsome and mighty[b], and all those sheep saw him and were afraid before him.
translation:
  language: ru
  text: И среди них я увидел Господа овец[a], стоявшего перед ними. Облик его был велик, грозен и могуч[b]. Все те овцы увидели его и устрашились его присутствия[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Владыку овец», «хозяина овец». Здесь это титул божественного правителя в образном мире видения.'
    reason: lexical_alternative
  - marker: b
    text: «Велик» может относиться как к размерам увиденной фигуры, так и к её величию.
    reason: source_ambiguity
  - marker: c
    text: 'Буквально: «устрашились его лица»; слово «лицо» здесь может обозначать явленное присутствие.'
    reason: idiom
lexical_decisions:
- source_word: እምኔሆሙ
  choice: среди них
  rationale: Предлог እም буквально указывает на происхождение или выделение «из них», однако в данном зрительном эпизоде естественное русское «среди них» передаёт, что фигура явилась внутри уже показанной группы.
- source_word: እግዚአ አባግዕ
  choice: Господа овец
  rationale: Сохраняет одновременно значение власти и устойчивый образ Владыки овец в «Апокалипсисе животных», не подменяя титул пояснением «хозяин» или «владелец».
- source_word: ዘቆመ ቅድሜሆሙ
  choice: стоявшего перед ними
  rationale: Точно передаёт относительную конструкцию и пространственное значение ቅድሜሆሙ, сохраняя наглядность видения.
- source_word: ራእዩ
  choice: облик его
  rationale: Форма понимается как существительное со значением видимого облика и местоименным суффиксом, что также согласуется с последующим рядом именных характеристик.
- source_word: ዐቢይ
  choice: велик
  rationale: «Велик» сохраняет возможное указание как на величину, так и на величие или высокий статус, не разрешая эту неоднозначность.
- source_word: ግሩም
  choice: грозен
  rationale: Передаёт внушаемые фигурой трепет и страх; современное русское слово сохраняет возвышенный апокалиптический регистр без значения нравственной порочности.
- source_word: ኃያል
  choice: могуч
  rationale: Передаёт силу и мощь в естественном для возвышенного русского повествования выражении.
- source_word: ኵሎሙ ዝኩ አባግዕ
  choice: все те овцы
  rationale: Сохраняет указательный элемент и отсылку к уже находящейся в поле зрения группе.
- source_word: ፈርሁ እምገጹ
  choice: устрашились его присутствия
  rationale: Предлог እም при глаголе страха обозначает источник или объект страха, а ገጽ буквально значит «лицо» и идиоматически — явленное присутствие. Перевод не смешивает эту конструкцию с ቅድመ «перед».
theological_decisions:
- issue: Следует ли передавать እግዚአ አባግዕ как общий хозяйственный термин или как титул божественной фигуры
  choice: Господь овец
  alternative: хозяин овец; владелец овец
  rationale: В символике «Апокалипсиса животных» это обозначение божественного правителя. «Господь» сохраняет богословский вес титула и одновременно не устраняет образ овец.
- issue: Следует ли понимать ራእዩ как указание на облик или превращать фразу в сообщение «они увидели, что он был…»
  choice: Облик его был…
  alternative: они увидели, что он был…
  rationale: Чтение как существительного «его облик/вид» лучше объясняет форму с местоименным суффиксом и не дублирует без необходимости последующий явно выраженный глагол «увидели его».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Краткие параллельные определения «велик, грозен и могуч» сохраняют ритм исходного ряда. Архаизмы используются только там, где они остаются понятными и функциональными; конструкция страха передана согласно геэзской грамматике, без ошибочного смешения እም с локативным «перед».
