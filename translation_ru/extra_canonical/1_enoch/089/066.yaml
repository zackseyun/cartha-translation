base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/066.yaml
  text: And the lions and the leopards devoured and swallowed up most of those sheep[a], and the wild boars of the desert ate with them[c][b], and they burned that tower and tore down that house.
translation:
  language: ru
  text: И львы, и леопарды[a] пожрали и проглотили большую часть тех овец, а дикие кабаны пустыни ели вместе с ними. Они сожгли ту башню и разрушили тот дом[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «пантеры»; точный вид крупной кошки, обозначенной эфиопским словом, не вполне ясен.'
    reason: lexical_alternative
  - marker: b
    text: В символике видения «дом», вероятно, означает святилище или храм.
    reason: cultural_note
lexical_decisions:
- source_word: በልዑ፡ ወውሕጡ
  choice: пожрали и проглотили
  rationale: Сочетание двух глаголов передаёт усиленную картину полного истребления; «пожрали» естественно для хищников и сохраняет жестокость образа.
- source_word: መብዝሕቶሙ፡ ለዝኩ፡ አባግዐ
  choice: бо́льшую часть тех овец
  rationale: Передаёт значение большинства, сохраняя конкретный образ овец. Ударение отличает сравнительное «бо́льшую» от качественного «большу́ю».
- source_word: አናብስት
  choice: львы
  rationale: Прямое и общепринятое наименование животного.
- source_word: አነምርት
  choice: леопарды
  rationale: Для множественного обозначения крупных пятнистых кошачьих «леопарды» точнее устаревшего или зоологически сомнительного варианта «тигры»; конкретный вид остаётся не вполне определённым.
- source_word: ሐራዊያ፡ ገዳም
  choice: дикие кабаны пустыни
  rationale: Сохраняет как образ диких свиней, так и их связь с пустынной, необитаемой местностью.
- source_word: በልዑ፡ ምስሌሆሙ
  choice: ели вместе с ними
  rationale: Передаёт отдельную вторую конструкцию со своим глаголом и не присоединяет кабанов к подлежащему предыдущих глаголов.
- source_word: አውዐይዎ፡ ለዝኩ፡ ማኅፈድ
  choice: сожгли ту башню
  rationale: Прямо передаёт действие огня и сохраняет архитектурный символ без истолкования.
- source_word: ከረይዎ፡ ለዝኩ፡ ቤት
  choice: разрушили тот дом
  rationale: «Разрушили» естественно передаёт уничтожение строения, а «дом» сохраняет буквальный образ исходного текста.
theological_decisions:
- issue: Передавать ли ቤት как «дом» или истолковывать как «храм»
  choice: дом
  alternative: храм; святилище
  rationale: В символическом повествовании дом, вероятно, указывает на храм или святилище, однако основной текст сохраняет сам образ и не подменяет его толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Повтор союзов и конкретные названия животных сохраняют ритм и образность источника; граница двух глагольных конструкций выражена союзом «а».
