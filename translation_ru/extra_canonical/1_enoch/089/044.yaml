base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/044.yaml
  text: And that sheep[a], whose eyes had been opened, saw that ram in the midst of the sheep, which had abandoned its glory, and it began to gore those sheep and trample them[d][c][b], and it went about without restraint.
translation:
  language: ru
  text: И та овца, чьи глаза открылись, увидела среди овец барана, оставившего свою славу[a]. Он стал бодать тех овец и топтать их, а сам ходил, не соблюдая приличий[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Слава» здесь может означать также честь, величие, блеск или положение; символический смысл намеренно не уточняется.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «шёл без подобающего [поведения]»; возможный перевод: «ходил без достоинства».'
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ
  choice: овца
  rationale: В видении последовательно используется образ стада; «овца» естественно обозначает здесь отдельное животное, не сужая значение до ягнёнка.
- source_word: ዘተፈትሐ አዕይንቲሁ
  choice: чьи глаза открылись
  rationale: Передаёт состояние обретённого зрения или прозрения и не утверждает, что овца сама открыла себе глаза.
- source_word: ሐርጌ
  choice: баран
  rationale: Точное и естественное русское обозначение самца овцы, сохраняющее образный строй видения.
- source_word: ዘማእከለ አባግዕ
  choice: среди овец
  rationale: Естественно передаёт положение барана внутри стада.
- source_word: ዘሐደገ ስብሐተ
  choice: оставившего свою славу
  rationale: «Слава» сохраняет широкий смысл чести, величия или блеска; «оставившего» не уточняет без основания, была ли она добровольно отвергнута или утрачена.
- source_word: አሐዘ ይጉድኦሙ
  choice: стал бодать тех овец
  rationale: Начинательное значение передано глаголом «стал», а «бодать» сохраняет конкретный образ нападения рогатого животного.
- source_word: ወኬዶሙ
  choice: и топтать их
  rationale: Продолжает картину физического насилия над стадом и соответствует животной образности.
- source_word: ዘእንበለ ተደላ
  choice: не соблюдая приличий
  rationale: ተደላ связано с подобающим, пристойным поведением и достоинством, а не с отсутствием внешнего противодействия; формулировка передаёт непристойность поведения без ошибочного смысла «никем не сдерживаемый».
theological_decisions:
- issue: Смысл «славы» барана
  choice: Сохранить слово «слава» без истолкования символа.
  alternative: честь; величие; блеск; царское достоинство
  rationale: Образ может указывать на честь, положение, величие или иной символический статус. Исходный широкий термин не позволяет безоговорочно выбрать одно толкование.
- issue: Характер заключительной фразы
  choice: Передать её как нарушение приличий и подобающего поведения.
  alternative: без достоинства; неподобающим образом; беспрепятственно
  rationale: Лексическое значение ተደላ относится к подобающему и пристойному; вариант «беспрепятственно» необоснованно превращает нравственную характеристику поведения в отсутствие внешнего сопротивления.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Конкретная образность животного видения сохранена; синтаксис упрощён до двух предложений ради ясности. Местоимения согласованы так, чтобы различать овцу-наблюдателя и барана.
