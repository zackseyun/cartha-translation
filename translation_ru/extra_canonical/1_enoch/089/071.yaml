base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/071.yaml
  text: And the book was read before the Lord of the sheep[a], and he took the book from his hand and read it, and sealed it[c][b], and set it down.
translation:
  language: ru
  text: И книга была прочитана перед Господом овец, и Он взял книгу из его руки[a], прочитал её, запечатал и положил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Не уточняется, кому принадлежала рука, из которой Господь овец взял книгу.
    reason: alternative_reading
lexical_decisions:
- source_word: መጽሐፍ
  choice: книга
  rationale: Обычное геэзское обозначение письменной книги или документа; «книга» естественно по-русски и не уточняет без основания форму носителя.
- source_word: ተነበ
  choice: была прочитана
  rationale: 'С учётом установленного чтения ተነበበ это пассивная форма со значением «была прочитана». Повторение чтения осмысленно: сначала книгу читают перед Господом овец, затем Он сам берёт и читает её.'
- source_word: በቅድመ
  choice: перед
  rationale: Передаёт присутствие перед лицом властной фигуры и сохраняет краткость исходного выражения.
- source_word: እግዚአ አባግዕ
  choice: Господом овец
  rationale: Сохраняет возвышенный титул и сквозной образ овец в «Апокалипсисе животных».
- source_word: ነሥአ
  choice: взял
  rationale: Прямо передаёт действие принятия книги из чьей-либо руки.
- source_word: እምእዱ
  choice: из его руки
  rationale: Сохраняет конкретный образ и не устраняет неясность того, кому относится местоимение.
- source_word: አንበበ
  choice: прочитал
  rationale: Обычное значение глагола в контексте письменной книги; совершенный вид естественен для последовательности завершённых действий.
- source_word: ኀተማ
  choice: запечатал
  rationale: Сохраняет документально-судебный образ наложения печати, не сводя его к простому закрытию.
- source_word: አንበረ
  choice: положил
  rationale: Естественно передаёт действие помещения книги после чтения и запечатывания; объект понятен из контекста.
theological_decisions:
- issue: Передача እግዚአ አባግዕ в образном строе «Апокалипсиса животных»
  choice: Господь овец
  alternative: хозяин овец
  rationale: «Господь» сохраняет одновременно власть персонажа, возвышенный апокалиптический регистр и богословскую значимость титула, не разрушая образ овец.
- issue: Повторное чтение книги
  choice: Сохранить оба упоминания чтения
  alternative: Первое действие передать как открытие книги
  rationale: Восстановленное геэзское чтение ተነበበ означает «была прочитана»; повтор описывает два последовательных действия и не должен устраняться ради стилистического сглаживания.
translation_notes:
  register: Современный литературный русский язык с лаконичным, возвышенным повествовательным регистром. Сохранены апокалиптический образ, повтор глагола чтения и местоименная неоднозначность оригинала.
