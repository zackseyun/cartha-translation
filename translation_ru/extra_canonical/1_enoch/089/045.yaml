base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/045.yaml
  text: And the Lord of the sheep sent a sheep to another sheep[a], and raised him up so that he might become a ram and might lead the sheep in place of that ram[c][b], which had abandoned his glory.
translation:
  language: ru
  text: И Господь овец послал овцу к другой овце и возвысил её, чтобы она стала бараном и повела овец вместо того барана, который оставил свою славу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «свою честь» или «своё достоинство». Здесь речь может идти о положении и почёте барана, а не только о видимом блеске.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕ
  choice: Господь овец
  rationale: Сохраняет возвышенный титул и прямую связь с образным миром «Апокалипсиса животных», не заменяя овец обобщённым «стадом».
- source_word: በግዕ ... ካልእ በግዕ
  choice: овцу к другой овце
  rationale: በግዕ обозначает овцу; такой перевод сохраняет повтор одного и того же названия животного и повествовательную преемственность. «Ягнёнок» неоправданно добавлял бы указание на возраст.
- source_word: ወአንሥአ
  choice: и возвысил её
  rationale: Глагол передаёт поднятие или возвышение. «Возвысил» естественно выражает перемену положения, не сводя образ к отвлечённому «назначил».
- source_word: ከመ ይኩን ሐርጌ
  choice: чтобы она стала бараном
  rationale: Сохраняется зооморфный образ и переход от обычной овцы к барану как руководящей фигуре.
- source_word: ይመርሖሙ ለአባግዕ
  choice: и повела овец
  rationale: Передаёт значение ведения и руководства, не подменяя образ толкованием вроде «стала правителем».
- source_word: ህየንተ ዝኩ ሐርጌ
  choice: вместо того барана
  rationale: Ясно передаёт замещение прежнего барана и сохраняет указательное значение исходной конструкции.
- source_word: ዘሐደገ ስብሐቲሁ
  choice: который оставил свою славу
  rationale: «Оставил» сохраняет деятельный оттенок глагола, а «слава» — широкий смысл ስብሐት, который может включать честь, достоинство и блеск.
theological_decisions:
- issue: Образ возвышенной овцы
  choice: Сохранить буквальный переход от овцы к барану.
  alternative: 'Передать смысл отвлечённо: «назначил её предводителем».'
  rationale: Видение развивает богословский и исторический смысл через последовательную символику животных; её нельзя без необходимости заменять истолкованием.
- issue: Значение ስብሐቲሁ в заключительной части
  choice: «свою славу»
  alternative: «свою честь» или «своё достоинство»
  rationale: «Слава» сохраняет более широкий и насыщенный смысл исходного слова, тогда как возможный оттенок общественного положения отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным повествовательным строем. Конкретные названия животных сохранены; синтаксис сделан естественным для русского, при этом целевая конструкция и последовательность возвышения, превращения и руководства не сглажены.
