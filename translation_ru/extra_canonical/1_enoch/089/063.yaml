base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/063.yaml
  text: And read out before me by number how many they destroy[a], and how many they hand over to destruction, so that this may be a testimony for me against them, that I may know all the deeds of the shepherds, and assess them, and see what they do—whether they abide by my command that I commanded them[c][b], or not.
translation:
  language: ru
  text: 'И прочти передо Мной по счёту, сколько они губят[a] и сколько предают погибели, чтобы это стало для Меня свидетельством против них[b], чтобы Я знал все дела пастухов, оценил их и увидел, что они делают: соблюдают ли они Мою заповедь, которую Я им заповедал, или нет.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальная часть эфиопского текста трудна. Повторяющиеся слова счёта, вероятно, относятся к числовому учёту погубленных и преданных погибели.
    reason: textual_variant
  - marker: b
    text: 'Буквально: «свидетельством на них»; возможен также перевод: «свидетельством о них». В данном контексте выражение, вероятно, имеет обвинительный смысл.'
    reason: lexical_alternative
  - marker: c
    text: 'При ином разборе трудного места: «И я прочёл перед ним счёт тех пастухов и сколько они погубили для пастухов, чтобы это свидетельство было на них, чтобы я узнал все дела пастухов, пересчитал их и увидел, что они делают: соблюдают ли они Мою заповедь, которую Я им заповедал, или нет».'
    reason: previous_rendering
lexical_decisions:
- source_word: አንበብ
  choice: прочти
  rationale: 'Форма понимается как повелительное наклонение: Господь обращается к писцу и велит огласить запись.'
- source_word: ቅድሜየ
  choice: передо Мной
  rationale: Суффикс первого лица единственного числа означает «передо мной»; это согласуется с речью Господа о «Моей заповеди» далее в стихе.
- source_word: ወበኍልቈ / ሚመጠነ
  choice: по счёту, сколько
  rationale: Сохраняется повторяющийся мотив числового учёта и судебной проверки, при этом русская фраза остаётся естественной.
- source_word: የኃጕሉ
  choice: губят
  rationale: Глагол обозначает причинение гибели или уничтожение; «губят» передаёт широкий насильственный смысл, не уточняя способ.
- source_word: ይሚጥዉ ለኃጕል
  choice: предают погибели
  rationale: Передаёт отдельное действие передачи или оставления на погибель и не сливает его с предшествующим глаголом.
- source_word: ስምዐ ዲቤሆሙ
  choice: свидетельством против них
  rationale: «Свидетельство» сохраняет судебно-доказательный оттенок, а «против них» выражает обвинительную силу буквального образа «на них» в данном контексте.
- source_word: ግብሮሙ ለኖላዊያን
  choice: все дела пастухов
  rationale: «Дела» уместно для нравственно-судебной оценки, а «пастухи» сохраняет устойчивый образ Животного апокалипсиса.
- source_word: እመጥኖሙ
  choice: оценил их
  rationale: Корень связан с измерением и исчислением; здесь «оценил» естественно передаёт проверку пастухов в контексте отчёта и суда.
- source_word: በትእዛዝየ ዘአዘዝክዎሙ
  choice: Мою заповедь, которую Я им заповедал
  rationale: Намеренно сохранён повтор однокоренных слов, подчёркивающий, что именно Божье повеление служит мерилом их поведения.
- source_word: እመ አልቦ
  choice: или нет
  rationale: Кратко и естественно завершает парную конструкцию «ли… или нет».
theological_decisions:
- issue: Судебная функция оглашаемой записи
  choice: Текст изображает исчисленный отчёт как свидетельство против пастухов и основание для оценки их дел.
  alternative: Понимать его лишь как нейтральное сообщение сведений.
  rationale: Сочетание чтения вслух, счёта, свидетельства, дел и заповеди образует сцену подконтрольности и суда, не устраняя апокалиптическую образность.
- issue: Кто говорит и перед кем читают
  choice: Господь повелевает писцу прочесть перед Ним.
  alternative: Повествователь сообщает, что сам прочитал запись перед другим лицом.
  rationale: Форма «передо Мной» и дальнейшее выражение «Мою заповедь» поддерживают прямую речь Господа; однако прежнее синтаксическое понимание отмечено в сноске из-за трудности текста.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической судебной сцены. Формула «заповедь, которую Я им заповедал» несколько возвышенна, но прозрачна и сознательно сохраняет повтор оригинала. Местоимения, относящиеся к Богу в прямой речи, написаны с прописной буквы.
