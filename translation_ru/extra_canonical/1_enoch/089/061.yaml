base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/061.yaml
  text: And he called to another and said to him[a], “Take note and see all that the shepherds are doing to these sheep[c][b]; for they are destroying among them more than I commanded them.”
translation:
  language: ru
  text: 'И призвал он другого и сказал ему: «Обрати внимание[a] и посмотри на всё, что пастухи делают с этими овцами, ибо они губят из их среды больше, чем Я повелел им погубить»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально — призыв направить сердце или ум на внимательное наблюдение; возможно также: «будь внимателен».'
    reason: lexical_alternative
  - marker: b
    text: То есть пастухи губят овец сверх того, что им было повелено.
    reason: theological_tension
lexical_decisions:
- source_word: ለካልእ
  choice: другого
  rationale: Передаёт обычное значение «другой, иной», не уточняя личность нового небесного действующего лица.
- source_word: ለቡ ወርኢ
  choice: обрати внимание и посмотри
  rationale: Первый императив выражает сосредоточенное внимание ума или сердца, второй сохраняет конкретный призыв увидеть происходящее.
- source_word: ኵሎ ዘይገብሩ
  choice: всё, что … делают
  rationale: Естественно передаёт относительную конструкцию и сохраняет значение полноты.
- source_word: ኖሎት
  choice: пастухи
  rationale: Сохраняет устойчивый образ пастухов и овец в Апокалипсисе животных без церковной окраски слова «пастыри».
- source_word: ዲበ እሉ አባግዕ
  choice: с этими овцами
  rationale: Нейтрально и естественно передаёт отношение действий пастухов к овцам; враждебный характер действий становится явным из следующего глагола и не вносится в предлог заранее.
- source_word: ያሐጕሉ
  choice: истребляют
  rationale: Передаёт сильное разрушительное действие и в данном контексте естественно сочетается с частью стада, устраняемой из его среды, не ограничивая смысл одним способом умерщвления.
- source_word: እምውስተቶሙ
  choice: из их среды
  rationale: Сохраняет составное значение «изнутри / из среды» и его партитивную силу, утраченную при простом «среди них».
- source_word: ፈድፋደ እምዘ አዘዝክዎሙ
  choice: больше, чем Я повелел им
  rationale: Сохраняет сравнительную конструкцию, властный характер поручения и центральную мысль о превышении данного повеления.
theological_decisions:
- issue: Характер вины пастухов
  choice: Пастухи получили ограниченное повеление, но в своём истреблении вышли за его пределы.
  alternative: Пастухи лишь пренебрегли обязанностью заботиться об овцах.
  rationale: 'Разрушительный глагол вместе с выражением «больше, чем Я повелел им» указывает не просто на небрежность, а на виновное превышение поручения. При этом текст сохраняет напряжение: некоторое разрешение на разрушительные действия, по-видимому, всё же было дано.'
- issue: Говорящий в формуле «Я повелел»
  choice: Прописная «Я» указывает на верховного Владыку внутри видения, не добавляя к тексту более подробной идентификации.
  alternative: Строчная «я», оставляющая личность говорящего полностью невыраженной типографически.
  rationale: Контекст видения и власть отдавать повеления пастухам поддерживают это оформление, однако перевод не вводит отдельного божественного титула.
translation_notes:
  register: Современный литературный русский язык с достоинством визионерского повествования. Синтаксис оставлен ясным и торжественным без архаизмов; метафоры пастухов и овец сохранены. Все маркеры сносок размещены в основном тексте.
