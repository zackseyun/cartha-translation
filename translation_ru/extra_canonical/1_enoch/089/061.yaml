revisions:
- from: 'И призвал он другого и сказал ему: «Обрати внимание[a] и посмотри на всё, что пастухи делают с этими овцами, ибо они истребляют из их среды больше, чем Я повелел им»[b].'
  to: 'И призвал он другого и сказал ему: «Обрати внимание[a] и посмотри на всё, что пастухи делают с этими овцами, ибо они губят из их среды больше, чем Я повелел им погубить»[b].'
  rationale: Перевод исправлен только для устранения русской эллиптичности в сравнительном обороте. «Губят из их среды» сохраняет широкое значение разрушительного действия и партитивное «из среды», а уточнение «погубить» связывает меру превышения именно с действием пастухов. Сноска b сделана более сдержанной и ближе к прямо выраженному смыслу текста.
