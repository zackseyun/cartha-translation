base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/005.yaml
  text: And all the cattle in that enclosure were gathered together[a], until I saw them sink, and be swallowed up[d][c][b], and be destroyed in that water.
translation:
  language: ru
  text: И весь скот, находившийся в том загоне[a], собрался вместе, пока я не увидел, как они погружаются, оказываются поглощены и гибнут в той воде.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «загон», может также означать поле или пастбище; здесь оно обозначает то же ограниченное пространство, которое в предшествующем видении наполняется водой.
    reason: lexical_alternative
  - marker: b
    text: 'В оригинале употреблены три глагола: животные погружаются, оказываются поглощены и гибнут; их последовательность усиливает картину уничтожения в воде.'
    reason: cultural_note
lexical_decisions:
- source_word: ኵሎሙ አላህምት
  choice: весь скот
  rationale: Собирательное «скот» естественно передаёт совокупность домашних стадных животных и сохраняет образный язык Животного апокалипсиса, не истолковывая животных как людей.
- source_word: ዐጸድ
  choice: ограда
  rationale: В данном эпизоде слово обозначает уже упомянутое ограниченное пространство, которое наполняется водой. «Ограда» сохраняет пространственную связность видения; возможность значения «поле» или «пастбище» отмечена в сноске.
- source_word: ተጋብኡ
  choice: собрался вместе
  rationale: Передаёт совместное собирание; единственное число согласовано с русским собирательным существительным «скот».
- source_word: እስክነ ርኢክዎሙ
  choice: пока я не увидел, как он
  rationale: Сохраняет повествовательную формулу и объект глагола зрения. Русское местоимение поставлено в единственном числе из-за собирательного «скот», тогда как в геэз объект имеет множественное число.
- source_word: ይሠጠሙ ወይትወንጡ ወይትኃጐሉ
  choice: погружается, поглощается и гибнет
  rationale: 'Три последовательных глагола сохранены как нарастающее описание катастрофы: погружение, поглощение и окончательная гибель.'
- source_word: ማይ
  choice: вода
  rationale: Сохраняет явно выраженное в геэз единственное число и не добавляет истолковывающее «потоп».
theological_decisions:
- issue: Символика животных в Видениях снов
  choice: Сохранить конкретный образ скота, не раскрывая его как обозначение людей.
  alternative: Перевести символ истолковательно как «люди» или иной человеческий коллектив.
  rationale: Текст развёртывает видение посредством устойчивой животной символики; перевод не должен подменять сам образ его возможным толкованием.
- issue: Тройное описание гибели
  choice: Сохранить все три глагола без сведения их к одному итоговому действию.
  alternative: 'Передать обобщённо: «весь скот утонул».'
  rationale: Нарастание образов — погружение, поглощение, гибель — составляет выразительное и богословски напряжённое описание суда.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным ритмом апокалиптического повествования. Собирательное «скот» требует в русском единственного числа, хотя соответствующие формы в геэз имеют множественное число.
