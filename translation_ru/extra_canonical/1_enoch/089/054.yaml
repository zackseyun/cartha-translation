  yaml_path: translation/extra_canonical/1_enoch/089/054.yaml
  text: And after that I saw when they abandoned the house of the Lord and his tower[a], and they all went astray, and their eyes were blinded. And I saw the Lord of the sheep bring about a great slaughter among them in their pasture[f][e][d][c][b], until those sheep cried out because of that slaughter and abandoned his place.
translation:
  language: ru
  text: И после этого я увидел, как они покинули дом Господа и его башню[a], и все сбились с пути, и глаза их ослепли. И я увидел, как Господь овец произвёл среди них великое избиение на их пастбище, пока те овцы не воззвали из-за того избиения и не оставили его место[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «башня», можно также понять как «загон» или «ограда»; вероятно, оно относится к символическому храмовому комплексу в этом видении.
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная фраза в геэзском тексте трудна. Возможно и другое понимание: «пока те овцы не призвали то избиение и не предали его место».'
    reason: textual_and_syntactic_ambiguity
