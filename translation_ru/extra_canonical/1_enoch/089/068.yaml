base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/068.yaml
  text: And the shepherds and their companions handed over those sheep to all the wild beasts of the desert[a], so that they might devour them; and all of them, each in its time, was delivered over by number—sixty from among them—while the record of the others was written down in the book[d][c][b], how many were destroyed from among them.
translation:
  language: ru
  text: И пастухи со своими спутниками отдали тех овец всем диким зверям пустыни, чтобы те пожрали их. Все они, каждый в своё время, были отданы по счёту — шестьдесят из них[a]; а об остальных было записано в книге[b], сколько из них было погублено.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Числительное и окружающая его фраза об учёте в этом свидетеле трудны для прочтения. Доступный эфиопский текст, по-видимому, даёт «шестьдесят», но здесь возможно повреждение текста или неясная передача числа. Ясно, что овцы отданы согласно числовому счёту и что их гибель связана с записью в книге.
    reason: textual_variant
  - marker: b
    text: 'Буквально: «было записано в книге». Эта фраза продолжает тему учёта погубленных овец.'
    reason: lexical_clarification
lexical_decisions:
- source_word: ኖላዊያን
  choice: пастухи
  rationale: Сохраняет основной образ Апокалипсиса животных и не истолковывает пастухов прямо как ангелов либо земных правителей.
- source_word: ጸማዶሙ
  choice: их спутники
  rationale: Передаёт людей или существ, связанных с пастухами и сопровождающих их, не уточняя их роль сверх текста.
- source_word: መጠውዎሙ / ይትሜጠው
  choice: отдали / отдавали
  rationale: Передаёт переход во власть хищников и сохраняет повтор глагольного мотива; русская форма «отдавали» также не устраняет неясность синтаксиса второй части.
- source_word: እእኩ አባግዕ
  choice: тех овец
  rationale: Прямо сохраняет символический образ народа как овец.
- source_word: አራዊተ ገዳም
  choice: диким зверям пустыни
  rationale: Сохраняет образ хищных зверей безлюдной местности и апокалиптическую выразительность исходной фразы.
- source_word: ከመ ይብልዕዎሙ
  choice: чтобы те пожрали их
  rationale: Передаёт целевое значение и насильственный, хищнический характер действия.
- source_word: በጊዜሁ
  choice: каждого в своё время
  rationale: Отражает распределённость действия во времени, не добавляя явно отсутствующего слова «назначенное».
- source_word: በኍልቍ
  choice: по счёту
  rationale: Естественно по-русски передаёт числовой учёт и согласуется с последующим упоминанием книги.
- source_word: ፷፻ እምኔሆሙ
  choice: шестьдесят из них
  rationale: Следует доступному чтению свидетеля и аудированной консультационной версии, но текстовая неуверенность отмечена в сноске.
- source_word: ለካልኡ በመጽሐፍ ይጸሐፍ
  choice: об остальных было записано в книге
  rationale: Сохраняет безличную конструкцию письменного учёта, не превращая её в более определённое толкование.
- source_word: ሚመጠነ ያሐጕል እምኔሆሙ
  choice: сколько из них было погублено
  rationale: Передаёт подсчёт погибших и насильственный характер уничтожения.
theological_decisions:
- issue: Кто такие «пастухи»
  choice: В основном тексте они оставлены пастухами внутри символического видения.
  alternative: Назвать их ангельскими надзирателями или чужеземными правителями.
  rationale: Перевод сохраняет апокалиптический образ и не навязывает одну историческую либо богословскую идентификацию.
- issue: Смысл счёта и записи в книге
  choice: Сохранён мотив учёта без пояснения, кем именно он производится и что богословски означает.
  alternative: Явно назвать это небесным судом или предопределённым наказанием.
  rationale: Запись подразумевает надзор и ответственность, однако сам стих не формулирует их доктринально.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Сохранены повтор, образность и синтаксическая напряжённость апокалиптического видения; неясный числовой фрагмент не исправлен догадкой, а отмечен сноской.
