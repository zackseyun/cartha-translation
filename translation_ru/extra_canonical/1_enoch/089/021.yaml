base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/021.yaml
  text: And I saw the sheep until they came out from the wolves[a]; and the eyes of the wolves were blinded[b], and those wolves went out following the sheep with all their power.
translation:
  language: ru
  text: И видел я овец, пока они не вышли от волков; глаза волков были ослеплены[b], и те волки вышли вслед за овцами[a] со всей своей силой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Субъект заключительного действия прямо назван: «те волки» вышли вслед за овцами. Однако эфиопская последовательность очень сжата и может описывать движение обеих групп без развёрнутых синтаксических связок.'
    reason: alternative_reading
  - marker: b
    text: 'Также возможно: «глаза волков помрачились». Ранее эту фразу передавали активно: «волки ослепили их глаза», однако грамматическая форма глагола указывает на состояние самих глаз: они были ослеплены или помрачились.'
    reason: previous_rendering
lexical_decisions:
- source_word: ወርኢክዎሙ
  choice: И видел я
  rationale: Сохраняет обычную для повествования о видении формулу от первого лица и естественный для торжественной русской прозы порядок слов.
- source_word: ለአባግዕ
  choice: овец / за овцами
  rationale: Передаёт устойчивый образ овец в «Апокалипсисе животных» без добавления толкования; падеж определяется синтаксисом русского предложения.
- source_word: እስከ ወፁኡ እምአዝእብት
  choice: пока они не вышли от волков
  rationale: Передаёт предел действия и исход овец из среды или власти волков, не уточняя сверх текста характер этого освобождения.
- source_word: ተጸለሉ አዕይንቲሆሙ
  choice: глаза волков ослепли
  rationale: 'Форма глагола пассивно-интранзитивна: глаза стали слепыми или помрачились. Конкретный образ сохранён без сведения его к обману или заблуждению.'
- source_word: ወወፁኡ እንዘ ይትልውዎሙ
  choice: вышли вслед за овцами
  rationale: Передаёт движение наружу и сопутствующее следование; нейтральное «вслед за» не усиливает глагол до однозначного «преследовали».
- source_word: ዝኩ አዝእብት
  choice: те волки
  rationale: Сохраняет указательное значение и ясно обозначает выраженный в источнике субъект заключительного действия.
- source_word: በኵሉ ኃይሎሙ
  choice: со всей своей силой
  rationale: Близко передаёт полноту приложенной силы и сохраняет напряжённость сцены.
theological_decisions:
- issue: Следует ли истолковать ослепление глаз как обман или духовное заблуждение
  choice: 'Сохранить конкретный образ: «глаза волков ослепли»'
  alternative: «волки были обмануты» или «волки впали в заблуждение»
  rationale: Апокалиптическое видение выражает смысл посредством зримых образов. Перевод не должен подменять образ одним из возможных богословских истолкований.
- issue: Насколько явно выражать враждебное преследование овец
  choice: «вышли вслед за овцами»
  alternative: «бросились преследовать овец»
  rationale: Глагол непосредственно означает следование; контекст допускает враждебное преследование, но перевод сохраняет лексическую сдержанность источника.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, но понятным повествовательным строем. Повтор «волков / волки» сохранён ради ясности участников сцены и соответствия повтору в источнике; символика не истолковывается внутри основного текста.
