base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/040.yaml
  text: And I saw the sheep until they entered into a good place[a], and into a pleasant and glorious land; and I saw until the sheep were satisfied[c][b], and that house was in their midst in the pleasant land.
translation:
  language: ru
  text: И я видел овец, пока они не вошли в хорошее место, в приятную и славную землю; и я видел, пока овцы не насытились, а тот дом[a] находился среди них, в приятной земле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В символике этого видения «дом», возможно, означает святилище или храм.
    reason: lexical_alternative
  - marker: b
    text: Выражение «приятная земля» повторяется в конце стиха в тексте на геэз, подчёркивая благословенный характер этого места.
    reason: cross_reference
lexical_decisions:
- source_word: አባግዕ
  choice: овцы
  rationale: Сохраняет буквальный образ овец, последовательно используемый в Апокалипсисе животных, не подменяя его толкованием «народ» или «Израиль».
- source_word: መካን ሠናይ
  choice: хорошее место
  rationale: Передаёт существительное «место» и определение со значением «хороший, прекрасный», не конкретизируя местность сверх исходного текста.
- source_word: ምድር ኃዋዝ ወስብሕት
  choice: приятная и славная земля
  rationale: Прилагательные согласованы с «землёй» и передают грамматику геэз точнее, чем отвлечённые существительные «отрада и слава».
- source_word: ጸግቡ
  choice: насытились
  rationale: Передаёт состояние полноты и удовлетворения; глагол естественно сочетается с образом овец и сохраняет возможный смысл обильного обеспечения.
- source_word: ቤት
  choice: дом
  rationale: Сохраняет собственный символический словарь видения; возможное значение святилища или храма вынесено в примечание.
- source_word: ማእከሎሙ
  choice: среди них
  rationale: Естественно передаёт пространственное положение дома в середине сообщества овец.
theological_decisions:
- issue: Следует ли прямо назвать «дом» храмом
  choice: Сохранить «дом» в основном тексте
  alternative: Перевести как «храм» или «святилище»
  rationale: Хотя в символике видения дом, вероятно, обозначает святилище или храм, прямое истолкование устранило бы намеренную образность исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном. Пролептическая конструкция «видел овец, пока они не вошли» сохранена; второе እስከ передано более естественным по-русски «как», без изменения длительного характера видения. Все символические образы оставлены без конфессионального истолкования.
