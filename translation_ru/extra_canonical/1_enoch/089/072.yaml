base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/072.yaml
  text: And again I saw the shepherds pasturing for twelve hours, and behold, three of those sheep returned, and they arrived and entered, and they began to build up all that had fallen down of that house.
translation:
  language: ru
  text: И снова я увидел, как пастухи пасли стадо двенадцать часов. И вот, три из тех овец вернулись, пришли и вошли; и они начали восстанавливать всё, что обрушилось в том доме.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእምኔሁ
  choice: И снова
  rationale: В данном повествовательном переходе передаёт продолжение видения естественнее буквального пространственного «и оттуда»; это согласуется с последовательностью формул видения в контексте.
- source_word: ይርዐዩ
  choice: пасли стадо
  rationale: Глагол означает «пасти»; дополнение «стадо» по-русски естественно и ясно подразумевается образом пастухов, хотя отдельно в данной форме текста не выражено.
- source_word: ፲ወ፪ሰዓተ
  choice: двенадцать часов
  rationale: Сохраняется конкретная временная формулировка источника без истолкования её возможного символического значения.
- source_word: ገብኡ
  choice: вернулись
  rationale: Глагол допускает значения «вошли» и «вернулись». Здесь выбрано «вернулись», поскольку далее отдельно следует «вошли» и речь идёт об овцах, возвращающихся к дому.
- source_word: ሐንጹ
  choice: отстраивать
  rationale: Передаёт восстановительное строительство разрушенной части дома, а не строительство нового дома с нуля.
theological_decisions:
- issue: Возможное символическое значение двенадцати часов и трёх овец
  choice: Сохранить образы и числа без поясняющего отождествления
  alternative: Назвать подразумеваемые исторические периоды или лица
  rationale: Сам стих сообщает видение образами; явное историко-богословское толкование устранило бы присущую тексту открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным ритмом. Последовательность «вернулись, пришли и вошли» сохранена, несмотря на некоторую избыточность, поскольку она отражает цепочку глаголов источника.
