base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/001.yaml
  text: And one of those four went to that white bull and taught him a mystery[a], while he was not trembling; and that bull was born and became a man, and built for himself a great vessel and dwelt upon it. And three bulls were with him on that vessel[c][b], and they were covered over above them.
translation:
  language: ru
  text: И один из тех четырёх пошёл к тому белому быку и научил его тайне, когда тот не дрожал[a]. Этот бык родился и стал человеком; он соорудил себе большое судно[b] и жил на нём. Вместе с ним на этом судне были три быка; сверху они были покрыты.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В представленном геэзском тексте стоит отрицание: «не дрожал». Из-за трудности текстовой передачи этого места возможно иное чтение: «дрожал».'
    reason: textual_variant
  - marker: b
    text: Большое судно соотносится с судном времён потопа в символическом пересказе книги Бытия; однако само видение не называет здесь прямо ни Ноя, ни ковчег.
    reason: cross_reference
lexical_decisions:
- source_word: ፬ሖረ ኀበ
  choice: подошёл к
  rationale: Передаёт направленное движение к белому быку естественным современным русским языком, не уточняя способ движения.
- source_word: ላህም ጸዓዳ
  choice: белый бык
  rationale: Сохраняет зооморфный образ и мужскую символическую соотнесённость персонажа; общее обозначение крупного рогатого скота в данном контексте конкретизировано как мужское.
- source_word: መሀሮ ምሥጢረ
  choice: открыл ему тайну
  rationale: Естественно передаёт сообщение сокрытого знания. «Научил его тайне» было бы формальнее, но по-русски звучит неестественно.
- source_word: እንዘ ኢይርዕድ
  choice: а тот не дрожал
  rationale: Сохраняет явно засвидетельствованное отрицание ኢ и значение страха или трепета, не заменяя его утвердительным чтением.
- source_word: ተወልደ ወኮነ ሰብአ
  choice: родился и стал человеком
  rationale: Оставляет явным необычный переход от животного образа к человеку и не подменяет символический рассказ прямым именованием Ноя.
- source_word: መስቀረ ዐቢየ
  choice: большое судно
  rationale: Передаёт плавучее сооружение, не вводя более интерпретирующее слово «ковчег» непосредственно в текст.
- source_word: ነበረ ዲቤሃ
  choice: жил на нём
  rationale: Сохраняет пространственное значение «на нём» и передаёт длительное пребывание естественно для современного русского языка.
- source_word: ፫አላህምት
  choice: три быка
  rationale: Продолжает мужскую зооморфную символику трёх спутников персонажа и не превращает их в коров.
- source_word: ተከድኑ ላዕሌሆሙ
  choice: сверху они были покрыты
  rationale: Близко передаёт пассивную конструкцию и верхнее покрытие, сохраняя несколько необычную образность источника.
theological_decisions:
- issue: Следует ли прямо назвать преобразившегося персонажа Ноем, а судно — ковчегом
  choice: Сохранить образ быка, ставшего человеком, и назвать сооружение большим судном
  alternative: Назвать персонажа Ноем и/или употребить слово «ковчег»
  rationale: Связь с повествованием о потопе очевидна, но сам текст излагает его посредством символов видения. Прямая идентификация сняла бы намеренную образность.
- issue: Пол животных в символическом повествовании
  choice: Перевести как «бык» и «три быка»
  alternative: 'Перевести общими или женскими обозначениями: «животное», «телица», «корова»'
  rationale: Контекст животного апокалипсиса соотносит этих персонажей с мужчинами; мужские обозначения сохраняют внутреннюю символическую связь, не называя персонажей прямо.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Необычные переходы образов и заключительная пассивная конструкция сохранены, но синтаксис сделан понятным обычному читателю.
