base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/018.yaml
  text: And one sheep went to the wolves at the word of the Lord[a], and another sheep met him and went with him. And the two of them went together and entered into the assembly of those wolves, and they spoke to them and made them hear[d][c][b], that from then on they should not ravage the sheep.
translation:
  language: ru
  text: И одна овца пошла к волкам по слову Господа[a]. Другая овца встретила её и пошла вместе с ней. Они обе пошли вместе и вошли в собрание тех волков; они обратились к ним и предостерегли их[b], чтобы впредь те не терзали овец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по повелению Господа». Выражение может обозначать действие в ответ на Божье слово или приказ.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «дали им услышать против них». Здесь это выражение означает настойчивое предостережение или свидетельство против волков.'
    reason: idiom_clarification
lexical_decisions:
- source_word: በግዕ / አባግዕት
  choice: овца / овец
  rationale: Сохраняет последовательную символику овец в «Апокалипсисе животных», не уточняя пол или возраст.
- source_word: አዝእብት
  choice: волки
  rationale: Передаёт обычное значение слова и сохраняет хищнический образ видения.
- source_word: በቃለ እግዚእ
  choice: по слову Господа
  rationale: Естественно по-русски выражает действие по Божьему слову или повелению, сохраняя возвышенный регистр.
- source_word: ተረክቦ
  choice: встретила её
  rationale: 'Соответствует последовательности повествования: вторая овца встречает первую, а затем сопровождает её.'
- source_word: ኅቡረ
  choice: вместе
  rationale: Подчёркивает совместное действие двух овец без добавочного истолкования.
- source_word: ማኅበሮሙ
  choice: собрание
  rationale: Передаёт организованную группу, не привнося церковных коннотаций.
- source_word: ወተናገርዎሙ
  choice: обратились к ним
  rationale: В данном контексте естественно передаёт направленную к волкам речь.
- source_word: ወአስምዑ ዲቤሆሙ
  choice: предостерегли их
  rationale: Передаёт идиоматический смысл каузатива с ዲቤ — не просто заставить услышать, а настойчиво засвидетельствовать против них или предупредить их.
- source_word: ከመ እምይእዜ
  choice: чтобы впредь
  rationale: Кратко и естественно выражает целевой запрет, действующий с этого времени.
- source_word: ኢይግሥሥዎሙ ለአባግዕት
  choice: не терзали овец
  rationale: Глагол передан словом, подходящим к образу хищных волков и сохраняющим насильственный характер действия.
theological_decisions:
- issue: Передача እግዚእ в контексте апокалиптического видения
  choice: Господа
  alternative: Владыки
  rationale: Контекст указывает на Божью власть, посылающую овцу; «Господь» сохраняет богословский вес и обычный почтительный русский узус.
- issue: Связь целевой придаточной части с предостережением
  choice: чтобы впредь те не терзали овец
  alternative: что с того времени они больше не будут терзать овец
  rationale: Форма передаёт запрет или требование, а не превращает его в безусловное предсказание результата.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Повторения животных образов сохранены; громоздкая цепочка союзов слегка упорядочена. Родовые местоимения согласованы с русским словом «овца» и не предназначены для определения пола символических персонажей.
