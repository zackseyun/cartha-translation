base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/059.yaml
  text: And he summoned seventy shepherds and gave over those sheep to them, that they might pasture them. And he said to the shepherds and to their companions, “From now on, each of you shall pasture the sheep, and do all that I command you.”
translation:
  language: ru
  text: 'И он призвал семьдесят пастухов и передал им тех овец, чтобы они пасли их. И сказал он пастухам и их спутникам[a]: «Отныне каждый из вас, семидесяти пастухов[b], пусть пасёт овец и исполняет всё, что Я вам повелю».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «спутникам», обозначает лиц, связанных с пастухами или присоединённых к ним; точный характер этой связи неясен.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально в эфиопском тексте: «все семьдесят из вас». Уточнение «семидесяти пастухов» показывает, что поручение относится к ранее названным семидесяти пастухам, а не обязательно к их спутникам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ጸውዐ
  choice: призвал
  rationale: Передаёт официальный призыв к поручению и звучит естественно в торжественной повествовательной речи.
- source_word: ፸ ኖላዊያነ
  choice: семьдесят пастухов
  rationale: Сохраняет число и сквозной образ пастухов в апокалиптическом видении, не подменяя его толкованием.
- source_word: ገደፎሙ ሎሙ ለዝኩ አባግዕ
  choice: передал им тех овец
  rationale: Выражает передачу овец под их ответственность; указательное значение передано словом «тех».
- source_word: ከመ ይርዐይዎሙ
  choice: чтобы они пасли их
  rationale: Прямо сохраняет пастушескую образность и целевое значение оборота.
- source_word: ለጸማዶሙ
  choice: их товарищам
  rationale: Передаёт значение лиц, связанных с пастухами, не уточняя сверх текста характер этой связи.
- source_word: ኵሉ ፯፯ እምኔክሙ
  choice: каждый из вас
  rationale: Естественно передаёт распределительное указание всем семидесяти; повтор числа сохранён в сноске из-за его явного присутствия в эфиопском тексте.
- source_word: እምይእዜ
  choice: отныне
  rationale: Кратко и достойно обозначает начало поручения.
- source_word: ኵሎ ዘአአዝዘክሙ አነ ግበሩ
  choice: исполняет всё, что я вам повелю
  rationale: Сохраняет всеохватность требования и властный характер повеления; форма согласована с русским «каждый».
theological_decisions:
- issue: Следует ли раскрывать, кого символизируют пастухи и овцы
  choice: Сохранить в основном тексте образы «пастухов» и «овец» без истолкования.
  alternative: Передать их как ангелов или правителей и как народ либо Израиль.
  rationale: Отрывок принадлежит последовательному символическому видению; перевод не должен устранять образность или навязывать один вариант идентификации.
- issue: Характер приказа пастухам
  choice: 'Передать прямое поручение без смягчения: «исполняет всё, что я вам повелю».'
  alternative: 'Передать как менее властное наставление: «делает всё, чему я вас научу».'
  rationale: Эфиопский глагол выражает приказание, а контекст — делегированную власть и ответственность.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис ясен для широкого читателя; повтор местоимений сохранён там, где он помогает следить за участниками сцены. Символическая лексика не истолкована внутри перевода.
