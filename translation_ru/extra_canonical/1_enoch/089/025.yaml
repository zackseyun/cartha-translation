base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/025.yaml
  text: And those wolves again showed themselves to the sheep[a], and they went into the midst of that stream of water[d][c][b]; and those wolves followed the sheep and ran after them into that stream of water.
translation:
  language: ru
  text: И снова эти волки показались овцам[a], и овцы вошли в самую середину того водного потока; а волки последовали за овцами и побежали за ними в тот водный поток[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол буквально означает «дали овцам увидеть» или «показали овцам». Он может подразумевать, что волки заставили овец что-то заметить, либо, в более свободном понимании, показались им или указали путь.
    reason: lexical_alternative
  - marker: b
    text: Конец стиха в эфиопском тексте синтаксически неровен и повторяет слова «эти волки» и «тот водный поток». Перевод сохраняет повтор названия водного потока, но не воспроизводит вероятно вторичное повторение подлежащего.
    reason: textual_variant
lexical_decisions:
- source_word: ወጓዲሆሙ፡ ዝኩ፡ አዝእብት
  choice: И эти волки снова
  rationale: В контексте повторного действия сохраняется значение «снова». Форма ጓዲሆሙ в транскрипции, вероятно, повреждена распознаванием; возможное исходное ዐዲሆሙ означает «снова, ещё».
- source_word: አርእይዎሙ፡ ለአባግዕ
  choice: показались овцам
  rationale: Передаёт засвидетельствованный каузатив глагола «видеть» естественным русским выражением, не превращая его безоговорочно в «преследовали»; вероятная порча чтения отмечена в сноске.
- source_word: ለአባግዕ
  choice: овцам
  rationale: Сохраняет конкретный образ животных в апокалиптическом видении, не заменяя его толкованием или собирательным словом «стадо».
- source_word: ማእከለ፡ ዝኩ፡ ዐይገ፡ ማይ
  choice: в середину того водного потока
  rationale: Сохраняет пространственное значение ማእከለ и не уточняет без достаточных оснований размер или силу водного потока.
- source_word: ተለውዎሙ፡ ለአባግዕ
  choice: последовали за овцами
  rationale: Глагол ተለወ означает следование, а в данном контексте может подразумевать преследование. Нейтральное «последовали за» сохраняет эту смысловую широту, тогда как последующее «побежали за ними» ясно выражает погоню.
- source_word: ወረጹ፡ ድኅሬሆሙ
  choice: и побежали за ними
  rationale: Прямо передаёт глагол движения и выражение «за ними», сохраняя динамику повествования.
theological_decisions:
- issue: Символика Апокалипсиса животных
  choice: Сохранить буквальные образы волков, овец и водного потока
  alternative: Заменить их предполагаемыми историческими референтами — египтянами, израильтянами и Красным морем
  rationale: Текст видения сам говорит посредством образов; их истолкование не следует вносить в основной перевод.
translation_notes:
  register: Современный литературный русский язык с ясной, но сдержанно возвышенной повествовательной интонацией. Конкретная апокалиптическая образность сохранена; неоднозначность повреждённого первого глагола вынесена в сноску.
