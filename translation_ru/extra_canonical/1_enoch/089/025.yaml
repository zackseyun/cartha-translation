  naturalness: 'Фраза в целом литературна, но сочетание «и те вошли» после «показались овцам» допускает нежелательную русскую референциальную неясность: «те» может быть понято как волки. «В середину ... потока» возможно, однако «в самую середину» естественнее и точнее передаёт пространственный акцент.'
