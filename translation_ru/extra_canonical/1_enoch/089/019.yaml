base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/019.yaml
  text: And from it I saw the wolves[a], and they became exceedingly strong against the sheep with all their power[c][b], and the sheep cried out.
translation:
  language: ru
  text: И оттуда[a] я увидел волков; они стали чрезвычайно сильны против овец, действуя всей своей мощью, и овцы возопили.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от него» или «от этого». Местоименный суффикс допускает разные значения, а его точный антецедент определяется более широким контекстом видения.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኔሁ
  choice: оттуда
  rationale: Сочетание предлога እም с местоименным суффиксом допускает значения «от него», «от этого» и контекстуальное «оттуда». В русском тексте «оттуда» естественно сохраняет неясность пространственного либо предметного антецедента.
- source_word: ርኢክዎሙ
  choice: я увидел
  rationale: Прямо передаёт формулу повествования от первого лица в описании видения.
- source_word: አዝእብት
  choice: волков
  rationale: Это множественное число от названия волка; конкретный образ необходимо сохранить ради последовательности зооморфной символики.
- source_word: ወአፎ ጸንዑ ፈድፋደ
  choice: они стали чрезвычайно сильны
  rationale: አፎ вводит содержание увиденного («как»), ጸንዑ обозначает усиление или укрепление, а ፈድፋደ служит наречным усилителем «чрезвычайно». В русском придаточное с «как» можно естественно передать самостоятельным предложением без изменения смысла.
- source_word: ዲበ አባግዕ
  choice: против овец
  rationale: Хотя ዲበ буквально может означать «на/над», в контексте враждебного действия волков уместно направительное «против».
- source_word: በኵሉ ኃይሎሙ
  choice: действуя всей своей мощью
  rationale: Передаёт полноту силы, направленной против овец, и устраняет неестественное русское сочетание «сильны всей мощью».
- source_word: ወአባግዕ ጸርኁ
  choice: и овцы возопили
  rationale: Глагол обозначает громкий крик. «Возопили» соответствует возвышенному апокалиптическому регистру и не уточняет, был ли это вопль страха, скорби или призыв о помощи.
theological_decisions:
- issue: Символические образы животных в «Апокалипсисе животных»
  choice: Сохранить буквальные образы «волки» и «овцы».
  alternative: Истолковать их непосредственно как народы, правителей или Израиль.
  rationale: Видение сообщает зооморфные образы, а их историко-богословское толкование не следует встраивать в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис сделан ясным для широкого читателя; образность и неоднозначность исходного текста сохранены.
