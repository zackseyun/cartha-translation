  text: And I saw until all the wolves that followed those sheep perished and were drowned[a][b].
translation:
  language: ru
  text: И я смотрел, пока все волки, следовавшие за теми овцами[a], не погибли и не утонули[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «преследовавшие тех овец». Глагол означает движение вслед за кем-либо; в данном контексте оно может быть враждебным преследованием.'
    reason: lexical_ambiguity
  - marker: b
    text: 'Буквально также возможно: «погрузились» или «пошли ко дну». Эфиопский текст использует здесь отдельный глагол после слова «погибли».'
    reason: translation_note
lexical_decisions:
- source_word: ወርኢኩ፡ እስከ
  choice: И я смотрел, пока
  rationale: Сохраняет первое лицо визионерского повествования и значение እስከ, обозначающего продолжение видения вплоть до последующего события.
- source_word: ተሐጕሉ
  choice: не погибли
  rationale: Передаёт значение гибели или уничтожения и не смешивает этот глагол со следующим образом погружения в воду.
- source_word: ኵሎሙ፡ አዝእብት
  choice: все волки
  rationale: አዝእብት обозначает именно волков; буквальный образ необходимо сохранить в символическом повествовании.
- source_word: እለ፡ ተለውዎሙ
  choice: следовавшие за
  rationale: Буквально передаёт движение вслед за овцами; контекст допускает более враждебный оттенок «преследовавшие», отмеченный в сноске.
- source_word: ለዝኩ፡ አባግዕ
  choice: за теми овцами
  rationale: Указательное слово отсылает к овцам, уже находящимся в поле зрения рассказчика.
- source_word: ወተሠጥሙ
  choice: и не утонули
  rationale: Передаёт отдельный завершающий глагол со значением погружения, затопления или утопления, сохраняя последовательность двух сказуемых.
theological_decisions:
- issue: Следует ли раскрывать исторический смысл образов
  choice: Сохранить буквальные образы волков и овец
  alternative: Заменить образы их предполагаемыми историческими референтами
  rationale: Текст сообщает смысл посредством устойчивой символики «Апокалипсиса животных»; истолкование образов в основном тексте неоправданно устранило бы образность и возможную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством визионерского повествования. Конструкция «смотрел, пока… не» естественно передаёт длительность видения; символические названия животных сохранены без истолковывающей подстановки.
