base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/024.yaml
  text: And that pool of water was split[a], and the water stood on this side and on that side before their faces; and their Lord, while he was leading them[e][d][c][b], stood between them and the wolves.
translation:
  language: ru
  text: И тот водоём разделился[a], и вода стояла по обе стороны перед ними; и их господин[b], ведя их, встал между ними и волками.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «водный поток», «русло». Геэзское выражение может обозначать ограниченное скопление воды или водное русло.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «их господин» может относиться к предводителю стада в аллегорическом видении и в то же время допускать связь с божественным водительством.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ዐይገ ማይ
  choice: водоём
  rationale: Передаёт ограниченное скопление или пространство воды и соответствует повторяющемуся образу в данном эпизоде; при этом в сноске сохранена лексическая неопределённость.
- source_word: ተሠጠ
  choice: разделился
  rationale: Глагол обозначает разделение или рассечение; возвратная форма естественна по-русски и ясно описывает чудесное расхождение воды.
- source_word: ቆመ ማይ
  choice: вода стояла
  rationale: Сохраняет буквальный и зримо необычный образ неподвижно стоящей воды.
- source_word: እምዝየ ወእምዝየ
  choice: по одну и по другую сторону
  rationale: Естественно выражает пространственное распределение воды с обеих сторон.
- source_word: በቅድመ ገጾሙ
  choice: перед ними
  rationale: Передаёт буквальный смысл «перед их лицами» современным литературным русским без ненужной тяжеловесности.
- source_word: እግዚኦሙ
  choice: их господин
  rationale: Сохраняет отношение власти внутри аллегории и не решает однозначно, является ли выражение прямым божественным титулом.
- source_word: እንዘ ይመራሖሙ
  choice: ведя их
  rationale: Деепричастный оборот естественно передаёт одновременность и длительность руководящего действия.
- source_word: ማእከሎሙ ወማእከለ አዝእብት
  choice: между ними и волками
  rationale: Ясно выражает положение господина как преграды или защитника между стадом и волками, не вводя воду в качестве субъекта второго глагола.
theological_decisions:
- issue: Кого обозначает выражение «их господин»
  choice: Строчная буква и поясняющая сноска сохраняют непосредственный уровень аллегорического повествования.
  alternative: «Их Господь» как прямое указание на Господа Бога.
  rationale: Синтаксис недвусмысленно делает «их господина» субъектом глагола «встал», однако его точный аллегорический референт допускает напряжение между предводителем стада и божественным водительством. Перевод не должен молча устранять эту неоднозначность.
- issue: Субъект второго глагола ወቆመ
  choice: Встал их господин.
  alternative: Вода встала между ними и волками.
  rationale: Форма ወእግዚኦሙ является подлежащим второй части; такое чтение следует синтаксису геэзского текста и не переносит подлежащее «вода» через границу клаузы.
translation_notes:
  register: Современный литературный русский с ясным, сдержанно возвышенным повествовательным ритмом. Сохранены повтор глагола со значением «стоять» и пространственная образность исходного текста; буквальное «перед их лицами» естественно передано как «перед ними».
