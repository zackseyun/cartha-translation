base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/006.yaml
  text: And that vessel floated upon the water[a], and all the bulls and elephants and camels and donkeys were swallowed up into the earth; and all the beasts—I could not see them—and they were not able to come out[e][d][c][b], but perished and sank into the depths.
translation:
  language: ru
  text: И та мачта погрузилась в воду[a]. А все быки, слоны, верблюды, ослы и все звери были поглощены землёй; я не мог их видеть. Они не могли выбраться, погибли и погрузились в пучину[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфиопское слово, переведённое как «мачта», может также означать вертикальный брус или балку; точный предмет в образе видения не вполне ясен.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в глубины» или «в море».'
    reason: lexical_alternative
lexical_decisions:
- source_word: መሥቀር
  choice: судно
  rationale: В контексте повествования о потопе слово обозначает плавающий объект, спасающийся на воде. «Судно» естественно передаёт образ, не уточняя устройство объекта сверх текста; возможное значение «вертикальный брус» отмечено в сноске.
- source_word: ይጼቢ
  choice: держалось на воде
  rationale: Глагольная форма описывает пребывание или движение объекта на поверхности воды. Русское выражение передаёт плавучесть естественнее буквального «плавало» и согласуется с контекстом потопа.
- source_word: አልህምት
  choice: быков
  rationale: Сохранён конкретный класс животных, значимый для образного строя «Апокалипсиса животных», без обобщения до «скота».
- source_word: ነጊያት
  choice: верблюдов
  rationale: Прямое современное соответствие названию животного.
- source_word: አገማል
  choice: ослов
  rationale: Прямое современное соответствие названию животного; форма «ослов» нейтральна и литературна.
- source_word: ኅሠጥሙ
  choice: поглотила земля
  rationale: Активная русская конструкция ясно и выразительно передаёт насильственное исчезновение животных в земле, сохраняя образ поглощения.
- source_word: እንስሳ
  choice: зверями
  rationale: Здесь слово продолжает перечень животных. «Звери» сохраняет повествовательный регистр видения и не ограничивает значение домашним скотом.
- source_word: ወአክህልክ … ርእዮቶሙ
  choice: я уже не мог их видеть
  rationale: Форма в переданном тексте, вероятно, отражает искажение ወኢክህልኩ; вместе с инфинитивной формой «видеть их» фраза означает неспособность рассказчика продолжать видеть исчезнувших животных.
- source_word: ስእኑ ወጺአ
  choice: не могли выбраться
  rationale: Передана неспособность выйти наружу; «выбраться» естественно выражает безуспешную попытку спастись из поглощающей глубины.
- source_word: ተኃጐሉ
  choice: погибли
  rationale: Глагол обозначает окончательную гибель или уничтожение; «погибли» звучит естественно и не усиливает причинность сверх исходного текста.
- source_word: ቀላይ
  choice: пучину
  rationale: Слово допускает значения моря, глубоких вод или глубины. «Пучина» сохраняет водный и грозный образ, не превращая его в специальный богословский термин.
theological_decisions:
- issue: 'Характер последней глубины: обычные воды или апокалиптическая бездна'
  choice: пучина
  alternative: глубины; море; бездна
  rationale: «Пучина» сохраняет грозную образность суда и водной гибели, но не навязывает представление о метафизической Бездне как отдельном месте.
translation_notes:
  register: Современный литературный русский язык с размеренным повествовательным ритмом. Сохранены повторяющиеся соединительные конструкции и необычный образ поглощения землёй, но длинная исходная цепочка разделена на предложения для ясности. Формулировки не связывают символических животных с какой-либо конфессиональной системой толкования.
