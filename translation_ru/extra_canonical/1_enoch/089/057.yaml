base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/057.yaml
  text: And I began to cry out with all my strength[a], and I called to the Lord of the sheep and showed him concerning the sheep[b], that they were being devoured by all the wild beasts.
translation:
  language: ru
  text: 'И я стал кричать изо всех сил, и воззвал к Господу овец, и показал Ему, что происходит с овцами: их пожирали все дикие звери[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально возможно также: «все звери поля» или «все звери пустыни». Эфиопское выражение обозначает диких животных открытой местности или пустынных мест; здесь это хищники, нападающие на стадо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አኃዝኩ፡ እጽራሕ
  choice: я стал кричать
  rationale: Сочетание передаёт начало действия; «кричать» сохраняет и громкость, и тревогу, не сужая смысл до плача.
- source_word: በኵሉ፡ ኃይልየ
  choice: изо всех сил
  rationale: Естественное современное русское выражение, точно передающее полноту усилия.
- source_word: አጸውዖ
  choice: воззвал
  rationale: Направленное обращение отличено от предшествующего крика; «воззвал» сохраняет возвышенный, но понятный регистр.
- source_word: ለእግዚአ፡ አባግዕ
  choice: к Господу овец
  rationale: Передаёт божественный титул и образ верховного владельца и правителя стада в аллегории.
- source_word: ወአርእዮ፡ በእንተ፡ አባግዕት
  choice: и показал Ему, что происходит с овцами
  rationale: Глагол буквально связан с показыванием; развернутая русская формулировка естественно выражает представление Господу бедственного положения овец.
- source_word: ተበልዑ
  choice: их пожирали
  rationale: Несовершенный вид сохраняет длительность нападения, а «пожирали» — жестокий хищнический образ.
- source_word: እምኵሎሙ፡ አራዊተ፡ ገዳም
  choice: все дикие звери
  rationale: Передаёт хищных, неодомашненных животных естественным современным русским языком; возможная пространственная окраска ገዳም отмечена в сноске.
theological_decisions:
- issue: Передача божественного титула в аллегории
  choice: Господь овец
  alternative: хозяин овец
  rationale: «Господь» сохраняет верховную власть и возвышенный регистр образа Бога, не сводя его к обозначению обычного человеческого владельца.
- issue: Неявный смысл диких зверей в зооморфной аллегории
  choice: сохранить образ без поясняющей подстановки народов
  alternative: явно назвать враждебные народы
  rationale: Исходный текст говорит образами; перевод не должен молча заменять их толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис упрощён ровно настолько, чтобы последовательность действий и аллегорические образы оставались ясными; местоимение «Ему» написано с прописной буквы как указание на Господа.
