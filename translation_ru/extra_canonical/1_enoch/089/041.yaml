base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/041.yaml
  text: And sometimes their eyes were opened[a], and sometimes they were blinded, until another sheep arose and led them and brought them all in[c][b], and their eyes were opened.
translation:
  language: ru
  text: Иногда их глаза открывались[a], а иногда они были слепы, пока не поднялась другая овца, не повела их и не собрала их всех[b]. Тогда их глаза открылись.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Открывающиеся глаза в этом видении, вероятно, имеют символический смысл — пробуждение, распознавание или возвращение способности различать, — однако сам текст его не поясняет.
    reason: cultural_note
  - marker: b
    text: 'Или: «ввела их всех». Глагол может передавать приведение внутрь либо собирание вместе; явного слова «назад» в тексте нет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ቦ ሰበ … ወቦ ሶበ
  choice: иной раз … а иной раз
  rationale: Оборот передаёт чередование состояний — «иногда… иногда…», а не две неопределённые группы.
- source_word: ይትከሠታ አዕይንቲሆሙ
  choice: глаза их открывались
  rationale: Сохраняется буквальный образ открывающихся глаз и длительный, повторяющийся характер действия.
- source_word: ይጼልሙ
  choice: они слепли
  rationale: В контексте зрения глагол обозначает утрату способности видеть; перевод остаётся образным и не сводит её к духовному непониманию.
- source_word: ተንሥአ ካልእ በግዕ
  choice: поднялась другая овца
  rationale: Буквально сохранён образ животного и формула появления нового действующего лица; пол животного не уточняется сверх источника.
- source_word: መርሖሙ
  choice: повела их
  rationale: Передаёт простое значение руководства без добавочного пастырского толкования.
- source_word: አግብኦሙ ለኵሎሙ
  choice: собрала их всех
  rationale: Естественно передаёт каузативное сведение или приведение всех вместе; возможная направленность «ввела» отмечена в сноске.
- source_word: ተከሥታ አዕይንቲሆሙ
  choice: глаза их открылись
  rationale: Повтор ключевого образа сохранён, при этом завершённый вид отличает итог от предшествующего чередования состояний.
theological_decisions:
- issue: Символический смысл открытых глаз
  choice: Сохранить буквальный образ, не истолковывая его прямо.
  alternative: «Они обрели понимание» или «они духовно прозрели».
  rationale: Видение допускает значения пробуждения, распознания и восстановленной способности различать, но сам стих не выбирает одно из них.
- issue: Идентификация «другой овцы»
  choice: Не называть подразумеваемую историческую или религиозную фигуру.
  alternative: Заменить образ именем предполагаемого лица или титулом «вождь».
  rationale: Источник сохраняет зооморфный язык видения, поэтому перевод не должен подменять образ его толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством визионерского повествования. Повтор образа глаз сохранён; «иной раз… а иной раз» естественно передаёт чередование, а «тогда» ясно обозначает итог, не добавляя богословского объяснения.
