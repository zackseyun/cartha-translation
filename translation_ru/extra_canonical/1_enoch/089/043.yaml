base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/043.yaml
  text: And that ram began to gore on this side and on that side those dogs and foxes and wild boars[c][b][a], until he had destroyed them all.
translation:
  language: ru
  text: И тот баран начал бодать с этой стороны и с той стороны[b] тех собак, лисиц[a] и диких кабанов, пока не истребил их всех.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «лисицы», может обозначать и других диких псовых, например шакалов.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «с этой стороны и с той стороны»; выражение может подразумевать нападение с обеих сторон или со всех сторон.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝኩ ሐርጌ
  choice: И тот баран
  rationale: ወዝኩ передаёт продолжение повествования и указание на уже упомянутого персонажа, без добавления формулы «я увидел». ሐርጌ здесь означает барана, что согласуется с зооморфным образом в ближайшем контексте.
- source_word: አኃዘ ይወግእ
  choice: начал бодать
  rationale: Сочетание выражает начало действия; глагол сохраняет конкретный образ нападения барана рогами, не заменяя его обобщённым «воевать».
- source_word: እምዝየ ወእምዝየ
  choice: с этой стороны и с той стороны
  rationale: Буквально воспроизводится парная пространственная формула, указывающая на удары с разных сторон; возможный более широкий смысл пояснён в сноске.
- source_word: ዝኩ አክላብ
  choice: тех собак
  rationale: Указательное слово относится к уже известным из видения собакам и потому передано как «тех», а не просто определённым артиклем.
- source_word: ቈናጽል
  choice: лисиц
  rationale: «Лисицы» — вероятное обозначение животных; поскольку слово может пониматься шире как дикие псовые, неопределённость сохранена в сноске.
- source_word: ሐራዊያ ገዳም
  choice: диких кабанов
  rationale: Естественное русское обозначение диких свиней сохраняет конкретную животную образность апокалиптического видения.
- source_word: እስከ ለኵሎሙ አኅጐሎሙ
  choice: пока не истребил их всех
  rationale: Фраза выражает доведение нападения до полного уничтожения противников; «истребил» передаёт силу исходного выражения без ослабления.
theological_decisions:
- issue: Следует ли раскрывать исторические значения образов животных непосредственно в стихе
  choice: Сохранить буквальные образы барана, собак, лисиц и диких кабанов
  alternative: Заменить животных предполагаемыми народами или историческими группами
  rationale: Исходный текст представляет события посредством апокалиптической аллегории и сам в данном стихе не называет исторических соответствий; их внесение устранило бы намеренную образность и добавило спорное толкование.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественной, но ясной апокалиптической образности. Конкретный глагол «бодать» поддерживает зооморфную сцену; синтаксический повтор намеренно сохранён ради близости к гээзскому тексту.
