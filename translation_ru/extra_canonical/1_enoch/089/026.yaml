  yaml_path: translation/extra_canonical/1_enoch/089/026.yaml
  text: And when they saw the Lord of the sheep, And when they saw the Lord of the sheep, they turned back so as to flee from before his face; and that watercourse gathered together, and it became swift according to its nature, and it filled with water and rose up until it covered those wolves. so as to flee from before his face; and that watercourse gathered together, and it became swift according to its nature, and it filled with water and rose up until it covered those wolves.
translation:
  language: ru
  text: Когда они увидели Господа овец, то обратились в бегство от лица Его; а в том водотоке[a] собралась вода, и он стал стремительным по своей природе, наполнился водой и поднялся, пока не покрыл тех волков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «то русло» или «тот поток»; выражение может обозначать русло либо водоток, внезапно наполняющийся водой.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕት
  choice: Господа овец
  rationale: Сохраняет возвышенное обозначение божественного владыки и образный строй животной аллегории.
- source_word: ገብኡ ከመ ይጕየዩ
  choice: обратились в бегство
  rationale: В данном контексте глагольное сочетание описывает начало бегства; по-русски это передаётся естественно, без добавления неуказанного места, куда они вошли.
- source_word: እምቅድመ ገጹ
  choice: от лица Его
  rationale: Сохраняет семитский образ лица как присутствия, особенно уместный в сцене суда.
- source_word: ዝኩ ዐይገ ማይ
  choice: тот водный поток
  rationale: Передаёт русло или поток, который внезапно наполняется и разливается; возможный топографический оттенок отмечен в сноске.
- source_word: ተጋብአ
  choice: собрался
  rationale: Сохраняет образ собирающейся массы воды перед стремительным подъёмом.
- source_word: ከመ ፍጥረቱ ፍጡነ
  choice: стал стремительным по своей природе
  rationale: Сохраняет необычную и несколько трудную формулировку источника, не конкретизируя её сверх текста.
- source_word: መልአ ማይ
  choice: наполнился водой
  rationale: Прямая и естественная передача образа наполняющегося потока.
- source_word: ተላዐለ እስከ ከደኖሙ ለእልኩ አዝእት
  choice: поднялся, пока не покрыл тех волков
  rationale: ከደኖሙ понимается как глагол «покрыл» с местоименным дополнением множественного числа; последующая конструкция называет это дополнение — «тех волков».
theological_decisions:
- issue: Обозначение божественной фигуры в животной аллегории
  choice: Господь овец
  alternative: владыка овец
  rationale: «Господь» сохраняет богословский вес титула и при этом не разрушает аллегорический образ.
- issue: Идиома присутствия в сцене суда
  choice: от лица Его
  alternative: от Него / из Его присутствия
  rationale: Более буквальная формулировка сохраняет апокалиптическую выразительность исходного текста и остаётся понятной современному читателю.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены апокалиптическая образность и семитская формула «от лица Его»; случайные повторы английского консультационного текста не воспроизводятся.
