base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/034.yaml
  text: And when they saw him[a], they were afraid and trembled before his face[b], and they desired to return to their own folds.
translation:
  language: ru
  text: И когда они увидели его, то испугались и задрожали перед его лицом[a] и пожелали вернуться в свои загоны[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «перед его лицом»; это выразительное обозначение пребывания в чьём-либо присутствии.'
    reason: lexical_alternative
  - marker: b
    text: 'Слово обозначает огороженные места для животных; возможен более узкий перевод: «овчарни». Здесь сохранён общий образ загонов.'
    reason: cultural_note
lexical_decisions:
- source_word: ርእይዎ
  choice: увидели его
  rationale: Обычный глагол зрительного восприятия с объектным суффиксом «его»; передаёт последовательность событий без стилистического утяжеления.
- source_word: ፈርሁ
  choice: испугались
  rationale: Прямо передаёт возникший страх и естественно звучит в современном русском повествовании.
- source_word: ወርዕዱ
  choice: и задрожали
  rationale: Сохраняет усиление страха через телесную реакцию, не заменяя её более общим обозначением ужаса.
- source_word: እምቅድመ ገጹ
  choice: перед его лицом
  rationale: Сохраняет конкретный образ лица и смысл нахождения в его присутствии, но использует современный русский порядок слов.
- source_word: ወፈቀዱ
  choice: и пожелали
  rationale: Передаёт волю или желание и поддерживает достойный, умеренно возвышенный регистр видения.
- source_word: ከመ ይግብኡ
  choice: вернуться
  rationale: В контексте выражает движение обратно в прежнее место; русский глагол ясно передаёт эту направленность.
- source_word: ለአዕጻዲ ዚአሆሙ
  choice: в свои загоны
  rationale: Сохраняет животную образность видения и притяжательное значение, не сужая неоднозначный образ исключительно до овчарен.
theological_decisions:
- issue: Сохранять ли животный образ или обобщить его как возвращение домой
  choice: сохранить «в свои загоны»
  alternative: «в свои дома» / «в свои места»
  rationale: В «Апокалипсисе животных» символика последовательно выражена через образы животных; обобщение устранило бы значимую литературную и богословскую напряжённость видения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном. Образное выражение «перед его лицом» сохранено без архаичного порядка слов, а животная символика передана словом «загоны».
