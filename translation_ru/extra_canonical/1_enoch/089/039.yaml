base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/039.yaml
  text: And I saw until they grew quiet from the outcry for that sheep[a], and they crossed that stream of water. And the other two sheep, which were leading them, stood in place of those who had lain down[e][d][c][b], and they led them.
translation:
  language: ru
  text: И я видел, как они утихли после крика о той овце[a] и перешли тот водный поток[b]. А две другие овцы, которые вели их, встали на место тех, кто лёг[c], и повели их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «после крика из-за той овцы» или «после крика по той овце».'
    reason: Связь крика с той овцой допускает оттенки крика о ней, из-за неё или плача по ней.
  - marker: b
    text: 'Или: «тот водоток»; может подразумеваться ручей или река.'
    reason: Выражение обозначает текущую воду, не определяя точный вид водоёма.
  - marker: c
    text: «Лёг» может в данном контексте подразумевать, что прежние вожди пали или умерли; перевод сохраняет буквальный образ.
    reason: Глагол буквально относится к лежанию или укладыванию, хотя контекст допускает более сильный смысл.
lexical_decisions:
- source_word: አርመሙ
  choice: постепенно затихли
  rationale: Передаёт становление тише, а не обязательно внешнее принуждение к молчанию; наречие «постепенно» раскрывает процессуальный оттенок формы.
- source_word: እምጽራኁ ለዝኩ በግዕ
  choice: после вопля о той овце
  rationale: «Вопль» сохраняет силу коллективного скорбного крика, а «о той овце» не устраняет возможный оттенок плача или крика из-за неё.
- source_word: ውሒዘ ማይ
  choice: водный поток
  rationale: Буквально указывает на текущую воду и не уточняет без необходимости, была ли это река, ручей или иной водоток.
- source_word: ካልኤሆሙ
  choice: две другие овцы
  rationale: Сохраняет указание на отличную от прежних пару овец и соответствует числовому контексту.
- source_word: ይመርሕዎሙ / መርሕዎሙ
  choice: которые вели их / повели их дальше
  rationale: Сохраняет повтор глагола ведения; «дальше» естественно выражает продолжение пути, не меняя образа.
- source_word: ተክሎሙ
  choice: встали на место
  rationale: Форма понимается как выражение замещения — «на их место», а не как глагол со значением «поставили».
- source_word: ለእለ ሰከቡ
  choice: тех, кто лёг
  rationale: Буквально сохраняет образ лежания, не превращая его прямо в смерть или падение.
theological_decisions:
- issue: Историческое истолкование образов животных
  choice: Сохранить в основном тексте конкретный образ овец и последовательность их действий.
  alternative: Заменить овец толковательными обозначениями народа или его вождей.
  rationale: Апокалиптическое видение само говорит посредством образов; перевод не должен вносить в текст их конфессиональное или историческое толкование.
- issue: Смысл лежания прежних вождей
  choice: Оставить «тех, кто лёг».
  alternative: Передать как «тех, кто умер» или «тех, кто пал».
  rationale: В контексте лежание может подразумевать смерть или падение, но исходный глагол не требует прямо называть это смертью; сохранена богословская и повествовательная недосказанность.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Формула «И я видел, как…» естественнее по-русски, чем буквальное «И я видел до тех пор, пока…», при этом сохраняет длительное наблюдение. Повтор ведения удержан, а заключительное «дальше» делает развитие действия ясным без исторической расшифровки образов.
