translation:
  language: ru
  text: И тот баран поднялся на вершину той высокой скалы, и Владыка овец послал его к ним.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዝኩ፡ በግዕ፡
  choice: тот баран
  rationale: በግዕ обозначает овцу или барана; мужской род местоименных форм и роль данного животного в повествовании поддерживают перевод «баран».
- source_word: ዲበ፡ ድማኃ፡
  choice: на вершину
  rationale: Сочетание передаёт восхождение наверх, на верхнюю часть скалы; «на вершину» естественно выражает пространственный образ по-русски.
- source_word: ኰኵሕ፡ ነዋሕ፡
  choice: высокой скалы
  rationale: ኰኵሕ — «скала, утёс», ነዋሕ — «высокий, возвышенный»; буквальное и естественное соответствие без усиления образа.
- source_word: እግዚኦሙ፡ ለአባግዕ፡
  choice: Господин овец
  rationale: Передаёт конструкцию «господин/владыка овец» и сохраняет различие между титулом персонажа и обычным упоминанием овец.
- source_word: ፈነዎ፡ ኀቤሆሙ።
  choice: послал его к ним
  rationale: Прямо передаёт глагол «послал» с объектным суффиксом мужского рода и направлением «к ним».
theological_decisions:
- issue: Титул владельца или правителя овец
  choice: Господин овец
  alternative: Господь овец
  rationale: «Господин» сохраняет буквальный пастушеско-владетельный образ и не делает божественную идентификацию более явной, чем она выражена в самом предложении.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования; синтаксис сохранён простым и близким к последовательности оригинала.
