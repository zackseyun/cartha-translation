base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/022.yaml
  text: And the Lord of the sheep went with them as he led them[a], and all his sheep followed him[b]; and his face was glorious and splendid and terrible to behold.
translation:
  language: ru
  text: И Господь овец пошёл с ними, ведя их, и все его овцы последовали за ним; лицо же его было славным, величественным[a] и грозным на вид[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «почтенным» либо «великолепным»; геэзское слово может указывать как на честь и значимость, так и на зримое величие.'
    reason: lexical_alternative
  - marker: b
    text: «Грозным на вид» означает внушающим благоговейный страх, а не злым.
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕ
  choice: Господь овец
  rationale: Сохраняет родительную связь, возвышенный богословский регистр и образный строй видения, не заменяя его пояснением «пастырь».
- source_word: ሖረ ምስሌሆሙ
  choice: пошёл с ними
  rationale: Естественно передаёт движение и сопровождение без добавления неуказанного направления.
- source_word: እንዘ ይመራሖሙ
  choice: ведя их
  rationale: Передаёт одновременность действия и смысл руководства, не усиливая пастушескую метафору сверх исходного текста.
- source_word: ኵሎሙ አባግዒሁ
  choice: все его овцы
  rationale: Сохраняет явное притяжательное значение и конкретный повтор образа овец.
- source_word: ተለውዎ
  choice: последовали за ним
  rationale: Точно выражает следование за ведущим в данном контексте.
- source_word: ገጹ
  choice: лицо его
  rationale: Сохраняет конкретную антропоморфную деталь видения, не обобщая её до «облика».
- source_word: ስቡሕ
  choice: славным
  rationale: Передаёт славу, сияние и почёт в возвышенном, но понятном современном русском регистре.
- source_word: ክቡር
  choice: величественным
  rationale: Различает второй эпитет от «славным» и передаёт присущие слову оттенки чести, весомости и великолепия.
- source_word: ግሩም ለርእይ
  choice: грозным на вид
  rationale: Передаёт внушающий благоговейный страх облик, не приписывая нравственного зла; «на вид» естественно выражает зрительное восприятие.
theological_decisions:
- issue: Кто является ведущей фигурой в Апокалипсисе животных
  choice: «Господь овец» с буквальным сохранением образа овец
  alternative: «их господин», «хозяин овец» или «пастырь овец»
  rationale: Так сохраняются и богословская значимость фигуры, и символическая система видения без превращения образа в прямое толкование.
- issue: Характер эпитета ግሩም
  choice: «грозным на вид» как внушающим благоговейный страх
  alternative: «ужасным», «дивным» или «внушительным»
  rationale: Выбранная формулировка удерживает напряжение между величием и страхом, не создавая смысла нравственной порочности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным ритмом, уместным для апокалиптического видения. Образы «Господа овец», овец и лица сохранены буквально; архаизмы вроде «лик» и «узреть» не использованы.
