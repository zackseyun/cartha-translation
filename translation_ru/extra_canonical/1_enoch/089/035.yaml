base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/035.yaml
  text: And that ram took other sheep with him[a], and came upon those sheep that had gone astray; and he began to kill them. And the sheep were afraid before him, and that ram made those sheep that had gone astray return[b], and they went back into their folds.
translation:
  language: ru
  text: И тот баран взял с собой других овец и пришёл к тем овцам, которые заблудились; и начал убивать их.[a] Овцы испугались его, а тот баран возвратил заблудившихся овец, и они вернулись в свои загоны.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «схватил их, чтобы убить»; конструкция может подчёркивать начало или намерение насильственного действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ
  choice: баран
  rationale: В аллегорическом повествовании этот образ обозначает ведущего самца и противопоставлен овцам как группе; «баран» сохраняет различие.
- source_word: ነሥአ ምስሌሁ ባዕደ አባግዐ
  choice: взял с собой других овец
  rationale: አባግዐ — множественная форма, поэтому перевод передаёт несколько овец, а не одну; оборот ነሥአ ምስሌሁ выражает взятие с собой.
- source_word: ቦአ ዲበ
  choice: пришёл к
  rationale: Передаёт направленное движение к группе без излишнего уточнения, будто речь непременно о военном нападении.
- source_word: እለ ስሕቱ
  choice: которые заблудились / заблудившихся
  rationale: Сохраняет одновременно буквальный образ отбившихся овец и нравственный смысл заблуждения.
- source_word: አኀዘ ይቅትሎሙ
  choice: начал убивать их
  rationale: Конструкция выражает начало насильственного действия; явное значение убийства не смягчается.
- source_word: ፈርሁ እምገጹ
  choice: испугались его
  rationale: Естественный современный русский эквивалент страха перед его лицом или присутствием.
- source_word: አግብኦሙ
  choice: возвратил
  rationale: 'Сохраняет каузативный смысл: баран заставил или побудил овец вернуться.'
- source_word: አዕጻዲሆሙ
  choice: свои загоны
  rationale: Понятный современный пастушеский термин, сохраняющий образ видения об овцах.
theological_decisions:
- issue: Насилие барана над заблудившимися овцами
  choice: Сохранить прямое выражение «начал убивать их».
  alternative: Смягчить до «стал наказывать их» или «стал поражать их».
  rationale: В геэзском тексте употреблён глагол убийства; смягчение ослабило бы суровую напряжённость апокалиптического образа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Сохранены пастушеская образность, повтор слова «овцы» и прямота языка насилия; ошибочное прежнее понимание множественного አባግዐ как одной овцы не принято.
