base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/038.yaml
  text: And that sheep who was leading them[a], who had become a man, was separated from them and lay down[c][b]; and all the sheep sought him and cried out over him with a great cry.
translation:
  language: ru
  text: И та овца, которая вела их и стала человеком[a], отделилась от них и легла[b]; и все овцы искали её и с громким криком взывали о ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Превращение овцы в человека происходит внутри символического видения; повествование остаётся аллегорическим.
    reason: cultural_note
  - marker: b
    text: Слово «легла», вероятно, указывает здесь на смерть предводящей овцы, но текст выражает это посредством самого образа.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝኩ
  choice: И тот
  rationale: ዝኩ — указательное местоимение «тот», а не форма глагола «видеть»; перевод не вводит отсутствующее в тексте «я увидел».
- source_word: በግዕ
  choice: баран
  rationale: Существительное обозначает одну овцу; в русском «баран» сохраняет единственное число и согласуется с последующим образом мужчины, не выводя повествование из животной аллегории.
- source_word: ዘይመርሖሙ
  choice: который вёл их
  rationale: Относительная конструкция описывает продолжавшуюся роль предводителя; прошедшее несовершенного вида естественно передаёт её по-русски.
- source_word: ዘኮነ ብእሴ
  choice: и стал человеком
  rationale: Передаёт достигнутое внутри видения состояние и сохраняет явную символическую метаморфозу.
- source_word: ተሌለየ እምኔሆሙ
  choice: отделился от них
  rationale: Сохраняет нейтральный смысл отделения, не называя неуказанного деятеля и не истолковывая выражение как насильственное взятие.
- source_word: ወሰከበ
  choice: и лёг
  rationale: Передаёт основной образ глагола «лечь»; вероятный намёк на смерть пояснён в сноске, а не внесён в текст.
- source_word: ኃሠሥዎ
  choice: искали его
  rationale: Прямо передаёт действие стада после исчезновения предводителя.
- source_word: ወጸርኁ ዲቤሁ
  choice: взывали над ним
  rationale: Сохраняет значение громкого крика над ним или о нём, не сводя его однозначно к формальному погребальному обряду.
- source_word: ጽራኀ ዐቢየ
  choice: с великим плачем
  rationale: Естественно передаёт «великий крик» как выражение скорби в данном контексте, сохраняя торжественную силу фразы.
theological_decisions:
- issue: Следует ли прямо истолковать то, что предводитель «лёг», как его смерть
  choice: Сохранить в основном тексте буквальный образ «лёг»
  alternative: «умер» или «уснул»
  rationale: Геэзский глагол непосредственно обозначает лежание, хотя в контексте, вероятно, подразумевает смерть. Апокалиптический образ не следует заменять однозначным толкованием.
- issue: Как передать превращение барана в человека
  choice: Оставить «стал человеком» как событие внутри видения
  alternative: Истолковать человека как историческое лицо вне аллегорического повествования
  rationale: Текст сам сохраняет образный регистр и не требует от переводчика называть исторический прообраз.
translation_notes:
  register: 'Современный литературный русский с торжественной апокалиптической интонацией. Порядок определений следует геэзскому тексту: сначала предводительство, затем превращение в человека. «Баран» выбран вместо грамматически женского «овца», чтобы речь об одном мужском персонаже звучала естественно; множественное አባግዕ передано как «овцы».'
