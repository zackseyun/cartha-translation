revisions:
- from: И тот дом стал большим и просторным, и его построили для тех овец. Над домом для Господа овец возвели высокую и величественную башню. Сам дом был низким, башня же поднялась и стала высокой. Господь овец встал на той башне, и перед ним накрыли богатый стол.[a]
  to: И тот дом стал большим и просторным, и его построили для тех овец. На доме для Господа овец возвели высокую и большую башню. Сам дом был низким, башня же поднялась и стала высокой. Господь овец встал на той башне, и перед ним поставили полный стол.
  rationale: 'Устранены две небольшие смысловые конкретизации: оценочное «величественная» заменено на нейтральное указание размера, а «богатый стол» — на «полный стол», непосредственно соответствующее исходному образу. Смысл, аллегорические образы и современный литературный регистр сохранены.'
