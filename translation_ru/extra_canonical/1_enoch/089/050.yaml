base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/050.yaml
  text: And that house became great and broad, and it was built for those sheep; and a lofty and great tower was built upon the house for the Lord of the sheep. And that house was low, but the tower was raised up and became lofty; and the Lord of the sheep stood upon that tower, and they set a full table before him.
translation:
  language: ru
  text: И тот дом стал большим и просторным, и его построили для тех овец. На доме для Господа овец возвели высокую и большую башню. Сам дом был низким, башня же поднялась и стала высокой. Господь овец встал на той башне, и перед ним поставили полный стол.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቤት (bet)
  choice: дом
  rationale: Основное значение — «дом»; в образном повествовании сохраняется конкретный образ без преждевременного отождествления с храмом.
- source_word: ርኅበ (rəḥba)
  choice: просторным
  rationale: Передаёт идею широты и вместительности естественным современным русским словом.
- source_word: ማኅፈድ (maḥfad)
  choice: башня
  rationale: По контексту это высокое сооружение над домом, на котором стоит Господь овец; соответствует принятому пониманию эфиопского текста.
- source_word: ነዋኅ (nawāḥ)
  choice: высокую / высокой
  rationale: Сохраняет повтор одного и того же признака башни в исходном тексте; «высокий» здесь точнее и естественнее, чем более стилистически окрашенное «возвышенный».
- source_word: ማእደ ምልእተ (māʾəda məlʾta)
  choice: богатый стол
  rationale: Буквально «полный стол»; по-русски «накрыть богатый стол» естественно выражает стол, наполненный угощением, не уточняя состав трапезы.
theological_decisions:
- issue: Значение дома и башни в аллегории
  choice: Сохранить образы «дом» и «башня» без поясняющего отождествления
  alternative: Перевести или пояснить их как храм и храмовую башню
  rationale: Исходный текст называет сами образы, а их историко-богословское истолкование не должно вноситься непосредственно в перевод.
- issue: Обозначение Бога в образе владельца стада
  choice: Господь овец
  alternative: Владыка овец / Господин овец
  rationale: «Господь овец» естественно сохраняет устойчивый титул аллегории и его богословский вес, не добавляя имени, отсутствующего в тексте.
- issue: Низкий дом и высокая башня
  choice: Сохранить прямое противопоставление без символического объяснения
  alternative: Истолковать «низкий» как смиренный или незначительный
  rationale: Прилагательное описывает высоту, а возможный символический смысл остаётся открытым.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Синтаксис сделан ясным для широкого читателя; повтор образов и контраст между низким домом и высокой башней сохранены. Местоимения, относящиеся к Богу, даны со строчной буквы как нейтральная современная издательская норма.
