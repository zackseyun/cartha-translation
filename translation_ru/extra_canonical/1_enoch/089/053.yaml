base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/053.yaml
  text: And he sent many other sheep to those sheep[d][c][b][a], that they might hear and cry out over them.
translation:
  language: ru
  text: И послал он к тем овцам множество других овец, чтобы они возвещали[a] и взывали о них[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «давали услышать»; возможно также: «провозглашали» или «свидетельствовали».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «о них громко кричали»; предлог может также допускать оттенок «над ними» или «против них».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልኣነ አባግዕ ብዙኃነ
  choice: множество других овец
  rationale: Сохраняет количественный акцент и буквальный образ овец в символическом видении, не раскрывая его предполагаемый исторический смысл.
- source_word: ፈነወ
  choice: послал он
  rationale: Форма глагола — перфект третьего лица мужского рода единственного числа; субъект продолжается из контекста.
- source_word: ኀቤሆሙ ለዝኩ አባግዕ
  choice: к тем овцам
  rationale: Передаёт направление действия и явно сохраняет указанную в тексте группу овец как адресатов.
- source_word: ያስምዑ
  choice: чтобы они возвещали
  rationale: Каузативная основа от «слышать» означает «давать услышать», то есть возвещать или провозглашать; перевод простым «слышали» не отражал бы морфологию.
- source_word: የአውይዉ
  choice: взывали
  rationale: Передаёт громкий крик, не уточняя без достаточных оснований, был ли это плач, протест или предостережение.
- source_word: ዲቤሆሙ
  choice: о них
  rationale: Предлог допускает значение отношения или предмета речи; русский оборот «взывать над ними» неестественен, а «против них» чрезмерно сужает смысл.
theological_decisions:
- issue: Кого символизируют «другие овцы»
  choice: Сохранить буквальный образ «других овец» без истолкования.
  alternative: Прямо назвать их пророками, верными вождями или группой реформаторов.
  rationale: Текст дан в форме апокалиптического видения; перевод не должен подменять символ его возможным историческим толкованием.
- issue: Смысл поручения посланным овцам
  choice: Передать каузатив глаголом «возвещали», не добавляя объект вести.
  alternative: «свидетельствовали», «давали услышать» или «слышали».
  rationale: «Возвещали» отражает каузативное «давать услышать», но не вводит богословски более узкого понятия свидетельства и не уточняет содержание возвещения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Порядок «послал он» поддерживает повествовательный стиль, а символика овец сохранена без конфессионального истолкования.
