base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/013.yaml
  text: And when those twelve sheep had grown, they handed over one of them to the donkeys, and those donkeys in turn handed over that sheep to the wolves, and that sheep grew up in the midst of the wolves.
translation:
  language: ru
  text: Когда те двенадцать овец выросли, они отдали одну из них ослам; а ослы, в свою очередь, отдали эту овцу волкам, и та овца выросла среди волков.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልህቁ
  choice: выросли
  rationale: Глагол передаёт достижение зрелости или возрастание; в контексте образного рассказа естественно русское «выросли».
- source_word: መጦውዎ
  choice: отдали
  rationale: Форма описывает передачу овцы другой группе; «отдали» ясно и естественно сохраняет повторяющуюся последовательность действий.
- source_word: ካዕበ
  choice: в свою очередь
  rationale: Наречие означает «снова, опять»; здесь оно отмечает следующую передачу в цепи, поэтому контекстуально уместно «в свою очередь».
- source_word: አዝእብት
  choice: волкам
  rationale: Прямое соответствие множественному числу слова «волк» в аллегорической зооморфной сцене.
- source_word: ማእከለ
  choice: среди
  rationale: Передаёт положение «посреди, в среде» и звучит естественно с группой живых существ.
