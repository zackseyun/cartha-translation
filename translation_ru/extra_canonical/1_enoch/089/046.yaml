base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/046.yaml
  text: And he went to it and spoke to it alone[a], and raised up that ram, and made it ruler and leader of the sheep; and through all this[c][b], the dogs were afflicting the sheep.
translation:
  language: ru
  text: И он пошёл к нему и поговорил с ним наедине, затем возвысил того барана и поставил его правителем и вождём овец; и всё это время псы притесняли овец.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወሖረ፡ ኀቤሁ
  choice: И он пошёл к нему
  rationale: Обычный глагол движения с направительным оборотом. Местоимение относится к барану; в русском естественно употребить одушевлённое «к нему».
- source_word: ወተናገረ፡ ለባሕቲቱ
  choice: и говорил с ним наедине
  rationale: ለባሕቲቱ передаёт значение «с ним одним, наедине», а не называет барана объектом речи заново. Несовершенный вид естественно описывает сам разговор без добавления отсутствующего содержания.
- source_word: ወአንሥአ፡ ለውእቱ፡ ሐርጌ
  choice: затем возвысил того барана
  rationale: Здесь ሐርጌ понимается как «баран», а ለ служит показателем определённого объекта. «Возвысил» сохраняет как буквальный образ поднятия, так и подразумеваемое наделение высоким положением.
- source_word: ወገብረ፡ መኰንነ፡ ወመራሔ፡ ለአባግዕ
  choice: и поставил его правителем и вождём овец
  rationale: Парные обозначения сохраняют два аспекта роли — власть и руководство. «Поставил» естественно передаёт назначение на эту роль.
- source_word: ወበኵሉዝ
  choice: и всё это время
  rationale: Оборот относится к происходящему одновременно со всем описанным, а не определяет слово «псы».
- source_word: አክላብ፡ ያጸህቅዎሙ፡ ለአባግዕ
  choice: псы угнетали овец
  rationale: Глагол обозначает сильное притеснение или причинение страданий. «Угнетали» передаёт продолжительное враждебное воздействие без неподтверждённого уточнения «прогоняли».
theological_decisions:
- issue: Следует ли видеть в ሐርጌ символический «рог» и тем самым вводить образ власти
  choice: Перевести как «того барана»
  alternative: «воздвиг для него рог»
  rationale: В данной форме и синтаксической конструкции слово обозначает барана, а ለ маркирует определённый объект. Поэтому образ рога здесь не вносится; символика власти выражена последующим назначением правителем и вождём.
- issue: Следует ли раскрывать историческую личность, символизируемую бараном
  choice: Сохранить образ барана без исторического отождествления
  alternative: Назвать предполагаемого исторического правителя
  rationale: Текст остаётся внутри образного ряда видения и сам в этом стихе не называет историческую фигуру.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Животная образность сохранена; «псы» выбрано как более выразительное и в данном контексте враждебное обозначение. Местоимения согласованы с одушевлённым образом барана.
