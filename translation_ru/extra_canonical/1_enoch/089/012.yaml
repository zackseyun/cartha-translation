base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/012.yaml
  text: And that bull which was born from him begot a black wild boar and a white sheep[a]; and that wild boar produced many boars[c][b], and that sheep produced twelve sheep.
translation:
  language: ru
  text: И тот бык, который родился от него, породил чёрного дикого кабана и белую овцу[a]. И тот дикий кабан породил множество кабанов, а та овца породила двенадцать овец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь продолжается символическая родословная видения. Образы животных сохранены без замены их предполагаемыми историческими соответствиями.
    reason: cultural_note
lexical_decisions:
- source_word: ላህም፡ ዘተወልደ፡ እምኔሁ
  choice: тот бык, который родился от него
  rationale: Мужские формы указательного местоимения и относительного глагола поддерживают значение «бык», а не «телица»; формулировка сохраняет генеалогическую образность видения.
- source_word: ሐራዊያ፡ ገዳም፡ ጸሊመ
  choice: чёрного дикого кабана
  rationale: Сочетание обозначает дикого представителя свиных и явно указывает чёрный цвет; «дикий кабан» естественно передаёт яркий зооморфный образ.
- source_word: በግዐ፡ ጸዐዳ
  choice: белую овцу
  rationale: Родовой термин для овцы передан без необоснованного уточнения возраста; женский род русского слова не утверждает пол исходного образа, а цветовой контраст сохранён.
- source_word: አሕርወ፡ ብዙኃነ
  choice: множество кабанов
  rationale: Перевод сохраняет связь с ранее названным диким кабаном; «множество» передаёт неопределённо большое число без стилистического снижения.
- source_word: ዐሠርተ፡ ወክልኤተ፡ አባግዐ
  choice: двенадцать овец
  rationale: Числительное буквально означает «десять и две», а существительное является множественным обозначением овец; «овец» точнее, чем «ягнят».
theological_decisions:
- issue: Истолкование животных в «Апокалипсисе животных»
  choice: Сохранить в основном тексте буквальные образы животных.
  alternative: Заменить животных предполагаемыми историческими персонажами или народами.
  rationale: Само видение выражает смысл посредством последовательной зооморфной символики. Подстановка толкований в текст устранила бы подлинную образность и неоправданно закрепила бы одно прочтение.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Повтор союзов и указательных слов сохранён умеренно, чтобы передать последовательный ритм исходного текста, не делая фразу тяжеловесной.
