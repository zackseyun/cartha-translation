base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/007.yaml
  text: And again I saw in the vision, until all the streams withdrew from that lofty roof, and the fissures of the earth were leveled, and other abysses were opened.
translation:
  language: ru
  text: И снова я видел в видении, пока все потоки не отступили от той высокой кровли, расселины земли не сравнялись, а другие бездны не открылись.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰሰሉ
  choice: отступили
  rationale: Глагол передаёт удаление или отступление потоков; этот выбор естественно описывает спад вод и не добавляет идеи их уничтожения.
- source_word: አዕራብት
  choice: потоки
  rationale: В контексте рассказа о потопе обозначает водные потоки; краткое «потоки» сохраняет образ и соответствует форме множественного числа.
- source_word: ናሕስ ልዑል
  choice: высокой кровли
  rationale: Сохраняет конкретный образ «кровли/крыши» и определение «высокая», не заменяя его истолкованием.
- source_word: ንቅዐተ ምድር
  choice: расселины земли
  rationale: Передаёт отверстия, трещины или разломы в земле в соответствии с контекстом вод потопа.
- source_word: ዐረዩ
  choice: сравнялись
  rationale: Отражает значение выравнивания расселин без более сильного утверждения, что они были уничтожены или засыпаны.
- source_word: መዓምቃት ካልአት
  choice: другие бездны
  rationale: Буквально и образно передаёт множественное число «глубины/бездны» с определением «другие».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением образности апокалиптического видения. Конструкция «пока… не…» естественно передаёт исходное እስክ («пока, до тех пор пока») и охватывает три последовательных события.
