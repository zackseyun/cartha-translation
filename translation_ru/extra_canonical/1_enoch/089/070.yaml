  naturalness: Текст в целом литературен и понятен, но сочетание «Он принёс наверх, положил и показал...» синтаксически шероховато. «Поднёс, положил и показал ... всю книгу» естественно сохраняет цепочку глаголов и ретроспективно связывает их с книгой.
