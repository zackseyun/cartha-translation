base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/070.yaml
  text: And thus in the vision I saw that the one who wrote wrote down every one that was destroyed by those shepherds[a], day by day, and he brought up and laid down and showed that whole book to the Lord of the sheep, all that they had done, and all that each one of them had made away with[d][c][b], and all that they had given over to destruction.
translation:
  language: ru
  text: И вот в видении я увидел, что тот, кто вёл запись, изо дня в день записывал каждого, кого погубили те пастухи[a]. Он поднёс, положил и показал Господу овец всю книгу[c] — всё, что они сделали, всё, что каждый из них удалил[b], и всё, что они предали погибели.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально выражение может быть понято и как «каждого, кто погиб из числа тех пастухов»; связь предлога с пастухами допускает разные синтаксические толкования.
    reason: textual_ambiguity
  - marker: b
    text: 'Глагол в эфиопском тексте труден для точного истолкования; возможно также: «убрал» или «заставил исчезнуть».'
    reason: lexical_alternative
  - marker: c
    text: Принесение книги Господу овец изображает небесную запись деяний пастухов, предъявляемую перед судом.
    reason: cross_reference
lexical_decisions:
- source_word: ዘይጽሕፍ ... ይጽሕፍ
  choice: тот, кто вёл запись, ... записывал
  rationale: Сохраняет повтор глагола письма и обозначает небесного писца по его действию, не приписывая ему прямо не названной должности.
- source_word: ዘይትሐጐል
  choice: каждого, кого погубили
  rationale: Передаёт личный объект и значение гибели или уничтожения; форма допускает пассивное понимание.
- source_word: እምነ ዝኩ ኖላዊያን
  choice: те пастухи
  rationale: В основном тексте контекстуально передано как указание на пастухов, погубивших овец; возможное разделительное понимание отмечено в сноске.
- source_word: በኵሉ ዕለት
  choice: изо дня в день
  rationale: Естественно передаёт непрерывный, последовательный характер записи.
- source_word: ያዓርግ
  choice: принёс наверх
  rationale: 'Передаёт каузативное значение восхождения: он не просто поднялся, а поднял или принёс книгу наверх.'
- source_word: ያዓርፍ
  choice: положил
  rationale: Сохраняет конкретный образ помещения книги перед её представлением Господу овец.
- source_word: ያርኢ ኵሎ ኪያሁ መጽሐፈ
  choice: показал ... всю эту книгу
  rationale: 'Сохраняет явно названную книгу и последовательность действий: принёс, положил и показал.'
- source_word: ለእግዚአ አባግዕ
  choice: Господу овец
  rationale: Прямо сохраняет ключевой титул Бога внутри образного мира Апокалипсиса животных.
- source_word: ዘአእተተ
  choice: устранил
  rationale: Нейтральный русский глагол сохраняет трудность лексемы и не решает без достаточных оснований, означает ли она удаление из стада, сокрытие или причинение гибели.
- source_word: ዘመጠዉ ለሐጕል
  choice: предали погибели
  rationale: Передаёт направленное действие, приведшее к уничтожению, и сохраняет отличие этой формулы от предыдущего трудного глагола.
theological_decisions:
- issue: Кто ведёт запись
  choice: Отдельная небесная фигура, определяемая только как ведущий запись
  alternative: Енох либо прямо названный ангел-писец
  rationale: Текст отличает эту фигуру от наблюдателя и описывает её действия, но не даёт имени и не называет её ангелом.
- issue: Значение титула «Господь овец»
  choice: Сохранить аллегорический божественный титул без поясняющей вставки в основной текст
  alternative: Заменить титул словом «Бог»
  rationale: Прямой перевод сохраняет богословскую образность, в которой Бог представлен владельцем и судьёй стада.
- issue: Образ книги
  choice: Сохранить конкретную книгу как небесную запись поступков пастухов
  alternative: Передать обобщённо как отчёт или свидетельство
  rationale: Слово «книга» присутствует в источнике; её предъявление Господу создаёт образ небесного суда, который не следует сглаживать.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Повтор корня «запись/записывал» намеренно сохранён, но громоздкая буквальная конструкция смягчена. Аллегорические термины «пастухи», «овцы» и «Господь овец» оставлены без конфессионального истолкования.
