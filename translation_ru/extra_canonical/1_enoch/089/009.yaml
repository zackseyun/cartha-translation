base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/009.yaml
  text: And that white bull[a], which had become a man, went out from that enclosure, and with him came three bulls. And one of those three bulls was white, resembling that white bull, and one of them was red like blood, and one was black[c][b]; and that white bull departed from among them.
translation:
  language: ru
  text: И тот белый бык, ставший человеком, вышел из того ковчега[a], и вместе с ним вышли три быка. Один из этих трёх быков был белым и походил на того белого быка, другой был красным, как кровь, а третий — чёрным. И тот белый бык ушёл от них.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В переданном эфиопском тексте последнее слово этой фразы, по-видимому, искажено при распознавании. По контексту и вероятному чтению речь идёт о судне, то есть ковчеге; буквально возможен перевод «из того судна».
    reason: textual_variant
lexical_decisions:
- source_word: ላህም
  choice: бык
  rationale: Мужской образ крупного рогатого скота последовательно сохраняется в символическом повествовании; «бык» передаёт его точнее, чем общее «животное» или «скот».
- source_word: ጸዐዳ
  choice: белый
  rationale: Прямое обозначение цвета существенно для символической системы видения.
- source_word: ዘኮነ ብእሴ
  choice: ставший человеком
  rationale: Передаёт превращение без добавочного истолкования и естественно звучит в русском повествовании.
- source_word: ወጽአ እምዝኩ መስቀር
  choice: вышел из того ковчега[a]
  rationale: Переданный в транскрипции последний термин, вероятно, повреждён при распознавании и отражает መርከብ — «судно, ковчег»; ближайший контекст с плаванием по водам поддерживает «ковчег». Неуверенность отмечена сноской.
- source_word: ፪አልህምት
  choice: три быка
  rationale: Хотя транскрипция числового знака выглядит нестабильно, синтаксис и последующее перечисление трёх животных однозначно требуют «три».
- source_word: ጸዐዳ ይመስሎ ለዝኩ ላህም
  choice: был белым и походил на того белого быка
  rationale: 'Сохраняет оба самостоятельных сообщения: первый из трёх был белым и при этом походил на ранее названного быка.'
- source_word: ቀይሕ ከመ ደም
  choice: красным, как кровь
  rationale: Воспроизводит явное и выразительное сравнение оригинала.
- source_word: ጸሊም
  choice: чёрным
  rationale: Прямое обозначение цвета сохраняет контраст трёх быков.
- source_word: ኀለፈ እምኔሆሙ
  choice: ушёл от них[b]
  rationale: Глагол допускает значения ухода, прохождения и смерти. Нейтральное «ушёл от них» сохраняет неопределённость, а возможное значение смерти отмечено в сноске.
theological_decisions:
- issue: Отождествление белого быка, ставшего человеком, и трёх быков
  choice: Сохранить образы видения без отождествления персонажей в основном тексте.
  alternative: Назвать белого быка Ноем, а трёх быков — его сыновьями.
  rationale: Контекст может подсказывать такие отождествления, но сам стих продолжает говорить символическими образами; перевод не должен заменять образ его толкованием.
- issue: Значение ухода белого быка
  choice: 'Передать нейтрально: «ушёл от них».'
  alternative: «Скончался среди них» или «умер».
  rationale: Геэзский глагол может эвфемистически обозначать смерть, однако сама форма допускает и буквальное удаление. Основной текст сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Короткие цветовые определения и повтор слова «бык» сохраняют ритм и символическую ясность оригинала; тире используются лишь для естественного русского перечисления.
