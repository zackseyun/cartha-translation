base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/037.yaml
  text: And I watched until that sheep lay down—the one that had met that sheep which led them—and I watched until all the great and small sheep were stirred up in their place[d][c][b][a], and they entered into the pasture and came near the stream of water.
translation:
  language: ru
  text: И я смотрел, пока не легла та овца, которая встретила ту овцу, что вела их[a]. И я смотрел, пока не погибли все большие овцы и вместо них не встали малые; затем они вошли на пастбище и подошли к потоку воды.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «легла» здесь может подразумевать смерть овцы, однако буквально глагол означает «лечь».
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰከበ
  choice: легла
  rationale: Активная форма глагола означает «лечь»; перевод сохраняет грамматический залог и не превращает возможный эвфемизм смерти в прямое утверждение.
- source_word: በግዕ
  choice: овца
  rationale: Общее обозначение овцы соответствует устойчивой образности «Апокалипсиса животных» и не конкретизирует пол или возраст без необходимости.
- source_word: ዘተረክበ
  choice: которая встретила
  rationale: Передаёт относительную конструкцию и значение состоявшейся встречи без дополнительного толкования.
- source_word: ዘመርሖሙ
  choice: ведшую их
  rationale: Глагол означает вести или направлять; «вести» естественно продолжает образ движения и не добавляет оттенка пастырского служения.
- source_word: ተኃጕሉ
  choice: погибли
  rationale: В данной синтаксической последовательности глагол относится ко всем большим овцам и выражает их гибель, а не побуждение к движению.
- source_word: ዐቢያን ወንኡሳን ተንሥኡ ህየንቴሆሙ
  choice: большие овцы, а малые не встали вместо них
  rationale: 'Синтаксис различает две группы: большие овцы погибают, малые встают вместо них. Частица «не» входит в русскую конструкцию «пока не» и не выражает отрицания исходного глагола.'
- source_word: መርዔት
  choice: пастбище
  rationale: Обозначает место выпаса и сохраняет образ овечьего стада.
- source_word: ፈለገ ማይ
  choice: водный поток
  rationale: Передаёт буквально канал или поток воды, не уточняя его размер как ручья либо реки.
theological_decisions:
- issue: Означает ли то, что овца легла, её смерть
  choice: Сохранить буквальный образ «легла»
  alternative: умерла / пала
  rationale: Глагол стоит в активной форме и буквально означает «лечь», хотя в контексте видения может служить эвфемизмом смерти. Основной текст не разрешает эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык; повествовательная формула «И я смотрел, пока…» сохранена ради ритма видения. Повтор слова «овца» оставлен для ясности цепочки относительных предложений и верности животной символике.
