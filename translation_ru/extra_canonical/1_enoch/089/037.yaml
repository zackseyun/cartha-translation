  naturalness: Текст в целом литературен, но сочетание «а малые не встали вместо них» после «пока не погибли» синтаксически двусмысленно и звучит неестественно. Перестановка делает связь обоих событий с «пока не» ясной. «Поток воды» естественнее, чем «водный поток», при той же степени буквальности.
  terminology: «Овца», «пастбище» и «легла» уместны и последовательно сохраняют образный язык. Сноска корректно отмечает возможный эвфемистический оттенок, не превращая его в утверждение основного текста.
