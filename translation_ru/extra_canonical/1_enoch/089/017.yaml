base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/017.yaml
  text: And he called that sheep which had escaped from the wolves[a], and spoke with him about the wolves, so that he might hear concerning them[d][c][b], that they might not oppress the sheep.
translation:
  language: ru
  text: И он позвал ту овцу, которая спаслась от волков, и говорил с ней о волках, чтобы она услышала о них[a], дабы они не терзали овец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение можно понять и как «чтобы она услышала против них», то есть услышала обвинение или свидетельство против волков.
    reason: Сочетание глагола «слышать» с последующим предлогом синтаксически трудно и допускает как нейтральное «о них», так и направленное «против них».
lexical_decisions:
- source_word: ጸውዖ
  choice: позвал
  rationale: Передаёт обычное значение «позвать, призвать» и сохраняет простоту повествования.
- source_word: በግዕ
  choice: овцу
  rationale: Нейтральное обозначение единичной овцы лучше сохраняет последовательную образность Апокалипсиса животных, чем более узкое «баран».
- source_word: ዘተኃጥአ እምአዝእብት
  choice: которая спаслась от волков
  rationale: В данном контексте форма понимается как обозначение избавления или бегства от волков, а не как указание на грех среди овец.
- source_word: ተናገሮ በእንተ አዝእብት
  choice: говорил с ней о волках
  rationale: Естественно передаёт обращённую к овце речь, предметом которой являются волки.
- source_word: ከመ ይስምዕ ዲቤሆሙ
  choice: чтобы она услышала о них
  rationale: Сохраняет глагол слухового восприятия и не превращает трудную конструкцию без достаточных оснований в «предупредил» или «свидетельствовала»; возможный направленный смысл отмечен в сноске.
- source_word: ኢይግስስዎሙ
  choice: не терзали
  rationale: В сцене нападения волков глагол обозначает причинение вреда или жестокое угнетение; «терзали» сохраняет хищническую образность без ослабления до простого «касались».
- source_word: አባግዕ
  choice: овец
  rationale: Сохраняет повторяющуюся символическую лексику видения, не заменяя её собирательным словом «стадо».
theological_decisions:
- issue: Следует ли понимать описание овцы как моральное обвинение
  choice: которая спаслась от волков
  alternative: которая согрешила среди овец
  rationale: Контекст и наличие слова «волки» поддерживают значение избавления или бегства. Перевод не должен вводить обвинение в грехе там, где текст описывает спасение от преследователей.
- issue: Как передать цель разговора об овцах и волках
  choice: чтобы она услышала о них
  alternative: чтобы она услышала обвинение против них
  rationale: Синтаксис допускает направленное, в том числе враждебное, отношение к волкам, но явного существительного «обвинение» нет. Основной текст сохраняет неопределённость, а более резкая возможность вынесена в сноску.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования. Повтор слова «волки» сохранён ради ясности символической сцены; женский род местоимений обусловлен русским словом «овца» и не вводит отдельного утверждения о поле персонажа.
