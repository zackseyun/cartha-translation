base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/056.yaml
  text: And I saw that he abandoned that house of theirs and their tower and all their beloved ones into the hand of the lions[a], so that they might tear them apart, and into the hands of all the wild beasts[c][b], so that they might devour them.
translation:
  language: ru
  text: И я увидел, что он оставил тот их дом и их башню[a], а всех их предал в руки львов[b], чтобы те растерзали их, и в руки всех диких зверей, чтобы те пожрали их.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '«Дом» и «башня» оставлены как образы самого видения. Возможен перевод второго слова: «ограда» или «загон».'
    reason: lexical_alternative
  - marker: b
    text: Выражение «предал в руки» означает «отдал во власть».
    reason: lexical_alternative
  - marker: c
    text: 'Более буквально порядок заключительной части можно передать так: «предал всех их в руки львов, чтобы те растерзали их и пожрали их, — в руки всех диких зверей». Связь двух действий с названными группами зверей синтаксически не вполне однозначна.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ሐደጎ
  choice: оставил
  rationale: Глагол означает «оставить, покинуть». «Оставил» сохраняет судебный оттенок контекста, не усиливая его сверх исходного текста.
- source_word: ቤተ
  choice: дом
  rationale: Передано основное конкретное значение слова; символический образ не истолковывается в самом тексте как храм или община.
- source_word: ማኅፈዶሙ
  choice: их башню
  rationale: В данном архитектурном образе «башня» естественно сочетается с домом и сохраняет конкретность видения; возможное значение защитной ограды отмечено в сноске.
- source_word: ወደዮሙ ለኵሎሙ
  choice: предал их всех
  rationale: Конструкция обозначает передачу всех во власть хищников. «Предал» естественно сочетается с библейским оборотом «в руки» и передаёт угрожающий контекст.
- source_word: ዲበ እደ / ውስተ እደዊሆሙ
  choice: в руки
  rationale: Сохранён семитский образ передачи под чужую власть; по-русски оборот понятен и уместен в возвышенной повествовательной речи.
- source_word: አናብስት
  choice: львов
  rationale: Сохранено прямое наименование животных, без истолкования их символического значения.
- source_word: ይምሥጥዎሙ
  choice: растерзали их
  rationale: В параллели с пожиранием глагол выражает насильственное действие хищников; «растерзали» ясно и естественно передаёт этот смысл.
- source_word: ይብልዕዎሙ
  choice: пожрали их
  rationale: Глагол означает «есть, поглощать»; «пожрали» соответствует действию диких зверей и силе апокалиптического образа.
- source_word: አራዊት
  choice: диких зверей
  rationale: Так передаётся угрожающий характер недомашних животных и сохраняется их противопоставление овцам в видении.
theological_decisions:
- issue: Следует ли раскрывать символическое значение дома и башни в основном тексте
  choice: Сохранить образы «дом» и «башня» без их расшифровки.
  alternative: Передать их истолковательно как храм, общину, ограду или загон.
  rationale: Апокалиптическое видение намеренно говорит образами; перевод не должен заранее выбирать единственное историческое или богословское толкование.
- issue: Следует ли заменять выражение «в руки» прямым указанием на власть
  choice: Сохранить оборот «предал… в руки».
  alternative: 'Перевести: «отдал во власть» или просто «отдал львам и зверям».'
  rationale: Оборот понятен современному читателю, сохраняет библейско-апокалиптическую фактуру и передаёт смысл перехода под чужую власть.
- issue: Как соотнести львов, диких зверей и два глагола уничтожения
  choice: Связать растерзание со львами, а пожирание — со всеми дикими зверями.
  alternative: Отнести оба действия ко львам, сохранив заключительное упоминание всех диких зверей в более буквальном порядке.
  rationale: Такой порядок делает по-русски ясной вероятную хиастическую структуру исходной фразы, но альтернативная синтаксическая связь остаётся возможной и отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейско-апокалиптическим звучанием. Синтаксис упрощён лишь настолько, чтобы прояснить вероятную структуру фразы; образность и реальная неоднозначность исходного текста сохранены.
