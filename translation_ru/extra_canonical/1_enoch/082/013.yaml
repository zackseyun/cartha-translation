    text: Формы второго и третьего имён в данном эфиопском свидетельстве трудны; они переданы консервативно, без восстановления предположительно более привычного написания.
    reason: textual_variant
lexical_decisions:
- source_word: አስማቲሆሙ
  choice: вот имена
  rationale: Естественная русская передача формулы представления имён; притяжательное значение определяется последующим обозначением предводителей.
- source_word: መራሕያያን
  choice: предводители
  rationale: Слово образовано от глагола «вести, направлять» и обозначает наделённых властью небесных распорядителей; «предводители» сохраняет этот смысл, не уточняя их чин.
- source_word: ይፈልጡ
  choice: разделяют
  rationale: Глагол означает «разделять, отделять»; в календарном контексте относится к делению года.
- source_word: ፬መክፈልተ ዓመት
  choice: год на четыре части
  rationale: Идиоматичная русская передача буквального выражения «четыре части года» с сохранением его смысла.
- source_word: ሥሩዓን
  choice: поставленные
  rationale: Причастная форма выражает назначение или установление в определённом порядке; «поставленные» естественно сочетается с космическими служителями и не привносит конфессионального оттенка «рукоположения».
- source_word: ሚልኪኤል
  choice: Милкиэл
  rationale: Консервативная кириллическая транслитерация эфиопской формы имени.
- source_word: ህልእምሜሌክ
  choice: Хелэммелэк
  rationale: Консервативная и удобочитаемая кириллическая передача трудной формы, без реконструкции предположительно более привычного имени.
- source_word: ሜሌአየል
  choice: Мелеяэл
  rationale: Близкая к эфиопской форме кириллическая транслитерация, сохраняющая последовательность гласных настолько, насколько позволяет свидетельство.
- source_word: ናሬል
  choice: Нарэл
  rationale: Прямая кириллическая транслитерация эфиопской формы.
theological_decisions:
- issue: Природа названных существ
  choice: небесные предводители, ведающие календарным делением
  alternative: персонифицированные астрономические знаки или ангельские начальники времён года
  rationale: Контекст Книги светил представляет их как космических распорядителей, однако слово «предводители» не навязывает более разработанную ангелологическую классификацию.
