base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/013.yaml
  text: 'And these are the names of the leaders who divide the four parts of the year[a], who are appointed: Milkiel, Helemmelek, Meleyal[b], and Narel.'
translation:
  language: ru
  text: 'Вот имена предводителей, назначенных разделять год на четыре части[a]: Милкиэл, Хелеммелек, Мелеял[b] и Нарэл.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «четыре подразделения года»; буквально: «четыре части года».'
    reason: lexical_alternative
