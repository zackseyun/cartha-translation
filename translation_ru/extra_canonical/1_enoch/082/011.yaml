  yaml_path: translation/extra_canonical/1_enoch/082/011.yaml
  text: And their four leaders enter first, those who divide the four parts of the year; and after them the twelve leaders of the orders, those who divide the months; and the three hundred and sixty-four heads of thousands, the ones who distinguish the days; and the four that are added with them, the leaders who distinguish the four divisions of the years.
translation:
  language: ru
  text: Их четыре предводителя входят первыми — те, кто разделяет год на четыре части[a]. После них входят двенадцать предводителей порядков, разделяющих месяцы, и триста шестьдесят четыре главы тысяч[b], отмечающих дни[c], а также четверо, присоединённых к ним, — предводители, отмечающие четыре раздела лет[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на четыре раздела». Буквально: «четыре части (раздела) года».'
    reason: lexical_alternative
  - marker: b
    text: Число 364 соответствует схематическому календарю из 364 дней, описанному в Астрономической книге.
    reason: cultural_note
  - marker: c
    text: 'Или: «различающих дни»; возможны также значения «обозначающих» и «определяющих дни».'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально здесь употреблено множественное число: «четыре раздела лет»; по смыслу возможно: «четыре раздела года».'
    reason: textual_clarity
lexical_decisions:
- source_word: መራሕያኒሆሙ / መራሕያን
  choice: их предводителя / предводители
  rationale: Слово обозначает ведущих или руководителей. «Предводители» сохраняет образ упорядоченной небесной иерархии, не называя этих существ ангелами прямо.
- source_word: ይበውኡ ቀዳሚ
  choice: входят первыми
  rationale: Передаёт как значение движения, так и последовательность появления перечисленных служителей.
- source_word: ይሌልዩ ፬ ክፍለ ዓመት
  choice: разделяет год на четыре части
  rationale: Естественная русская передача буквального выражения «разделяют четыре части года»; слово «части» не навязывает сезонного толкования.
- source_word: ዘሥርዓታት
  choice: порядков
  rationale: Сохраняет значение установленного порядка или последовательности без чрезмерно конкретного истолкования как черед или разрядов.
- source_word: ፲፻ወ፷፬ አርእስት ፲፻
  choice: триста шестьдесят четыре главы тысяч
  rationale: Сохраняет административную метафору «глав» и засвидетельствованное в тексте дополнение «тысяч», не заменяя его толкованием должности.
- source_word: ይፈልጥዎሙ ለመዋዕል
  choice: отмечающих дни
  rationale: В календарном контексте «отмечать» естественно передаёт смысл различения, обозначения или определения дней, сохраняя смысловую широту глагола.
- source_word: ይትዌሰኩ ምስሌሆሙ
  choice: присоединённых к ним
  rationale: Выражает добавочный характер последней группы и звучит естественно по-русски.
- source_word: ፬ መክፈልተ ዓመታት
  choice: четыре раздела лет
  rationale: Сохраняет множественное число «лет» в геэзском тексте и повторяющийся язык календарного деления, несмотря на некоторую необычность русского оборота.
theological_decisions:
- issue: Природа перечисленных небесных фигур
  choice: Они названы «предводителями» и «главами», без прямого отождествления с ангелами.
  alternative: Назвать их ангелами либо истолковать как безличные календарные единицы.
  rationale: Сам стих описывает иерархически упорядоченных деятелей, связанных с годом, месяцами и днями, но не определяет их природу прямо. Перевод сохраняет эту недосказанность.
- issue: Синтаксис заключительной фразы
  choice: Четверо присоединённых представлены как предводители, отмечающие четыре раздела лет.
  alternative: Понять фразу как «те, кто различает предводителей четырёх разделов года».
  rationale: Выбранное чтение согласуется с параллельным перечислением групп предводителей в стихе и с последней проверенной редакцией, при этом не добавляет отсутствующего определения их природы.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического перечисления. Повтор терминов «предводители», «разделяет/раздела» сохранён ради композиционной параллельности. Формы не архаизированы, а онтология небесных служителей намеренно не уточняется.
