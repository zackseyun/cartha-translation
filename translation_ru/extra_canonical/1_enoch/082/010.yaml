base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/010.yaml
  text: 'And these are the names of those who lead them: those who keep watch and go in at their appointed times, those who lead them in their stations and in their orders and in their times and in their months and in their authorities and in their positions.'
translation:
  language: ru
  text: Вот имена тех, кто ведёт их, наблюдает и входит в назначенные им сроки, ведёт их на их местах, в их порядках, во времена, в месяцы, во власти и в положения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመርኅዎሙ
  choice: ведёт их
  rationale: Сохраняет повторяющийся в исходном тексте образ руководства и не уточняет без достаточных оснований, кого именно обозначает местоимение «их».
- source_word: የዐቅቡ
  choice: наблюдает
  rationale: Передаёт значение бдительного наблюдения/стражи; нейтральное «наблюдает» естественно в данном описании небесного порядка.
- source_word: ይበውኡ
  choice: входит
  rationale: Формально передаёт глагол движения «входить» и сохраняет образность источника, не заменяя её толкованием вроде «приступает» или «появляется».
- source_word: በአዝማነ፡ ዚአሆሙ
  choice: в назначенные им сроки
  rationale: Передаёт принадлежность сроков соответствующим деятелям и естественно выражает установленный характер календарного порядка.
- source_word: በመካናቲሆሙ
  choice: по их местам
  rationale: Базовое пространственное значение «места» сохранено без сужения до технического астрономического термина.
- source_word: በሥርዓታቲሆሙ
  choice: порядкам
  rationale: Отражает установленные порядки или последовательности; множественное число исходного текста сохранено.
- source_word: በስልጣናቲሆሙ
  choice: властям
  rationale: Сохраняет буквальное и потенциально персонифицированное значение «власти/полномочия», не сводя его к областям управления.
- source_word: በምቅዋማቲሆሙ
  choice: положениям
  rationale: Отличает заключительный термин от ранее упомянутых «мест» и передаёт значение занимаемого положения или установленной позиции.
theological_decisions:
- issue: Неопределённость референта местоимения «их»
  choice: Сохранить местоимение без поясняющего существительного
  alternative: Заменить на «светила», «звёзды» или иной явно названный объект
  rationale: Сам стих не называет референт заново; его уточнение внесло бы толкование из контекста непосредственно в текст.
- issue: Характер «властей»
  choice: Передать буквально как «властям»
  alternative: Истолковать как «полномочиям», «областям владычества» или ангельским чинам
  rationale: Исходный термин допускает несколько оттенков, поэтому перевод сохраняет богословскую и космологическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, перечислительным ритмом. Синтаксический повтор «тех, кто… кто…» отражает структуру геэзского текста, а ряд календарно-космологических категорий сохранён без конфессионального истолкования.
