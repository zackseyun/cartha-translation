review_pass:
  verdict: revise
  source_fidelity: Повтор глагола «ведут их» и неопределённый референт местоимения сохранены. Однако предлог «по» в конструкции «ведёт их по их местам» может обозначать перемещение через места, тогда как геэзское በ повторяется как указание на соответствующую сферу/позицию. «На их местах» точнее передаёт первую категорию, не смешивая её с заключительными «положениями».
  naturalness: 'Исходная конструкция «имена тех, кто ведёт их: тех, кто…» тяжеловесна и синтаксически не вполне удачна: после «тех» следует повтор того же родительного указания. Перестройка в ряд однородных сказуемых делает фразу естественной, сохраняя перечислительный характер.'
  terminology: «Наблюдают», «входят», «сроки», «порядки», «месяцы», «власти» и «положения» сохраняют нейтральность и не навязывают космологического либо конфессионального толкования. Множественное число личных глаголов согласовано с «тех».
  issues:
  - severity: medium
    issue: Неудачная синтаксическая связь после двоеточия
    rationale: '«И вот имена тех, кто ведёт их: тех, кто наблюдает…» повторяет «тех» после уже завершённой относительной группы и звучит как обрывочная аппозиция. В источнике последовательность относительных определений может быть передана по-русски без такого повтора.'
  - severity: medium
    issue: «По их местам» неточно передаёт локативную конструкцию
    rationale: 'В русском «вести по местам» обычно означает распределять или проводить через места. Повторяемый в источнике предлог перед «местами» лучше передать как положение/сферу: «на их местах».'
  revised_text: Вот имена тех, кто ведёт их, наблюдает и входит в назначенные им сроки, ведёт их на их местах, в их порядках, во времена, в месяцы, во власти и в положения.
  revised_footnotes: []
