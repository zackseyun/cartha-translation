- from: 'И вот имена тех, кто ведёт их: тех, кто наблюдает и входит в назначенные им сроки, кто ведёт их по их местам, порядкам, временам, месяцам, властям и положениям.'
  to: Вот имена тех, кто ведёт их, наблюдает и входит в назначенные им сроки, ведёт их на их местах, в их порядках, во времена, в месяцы, во власти и в положения.
  rationale: Исправлена синтаксическая неуклюжесть и уточнена передача первого локативного члена без добавления референта для «их» или истолкования космологических терминов. Повтор «ведёт их» сохранён, как в источнике. Последовательность предлогов во второй части отражает повторяемую геэзскую конструкцию, хотя сохраняет намеренно компактный ритм перечисления.
