base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/009.yaml
  text: And this is the order of the stars[a], those that set in their places, and in their times, and in their festivals[b], and in their months.
translation:
  language: ru
  text: 'И вот порядок звёзд: каждая из них заходит на своём месте[a], в своё время, в свои праздники[b] и в свои месяцы.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «на своей стоянке». Эфиопское слово может обозначать отведённое место в упорядоченном движении звёзд.'
    reason: lexical_alternative
  - marker: b
    text: Речь идёт о календарных сроках праздников, а не о том, что звёзды сами празднуют; порядок звёзд здесь связан с исчислением священных времён.
    reason: cultural_note
lexical_decisions:
- source_word: ሥርዓተ
  choice: порядок
  rationale: Передаёт установленное устройство и закономерность движения светил, не придавая выражению излишне юридического оттенка.
- source_word: ከዋክብት
  choice: звёзд
  rationale: Это прямое значение эфиопского слова; более широкое «небесных тел» вышло бы за пределы исходного выражения.
- source_word: የዐርቡ
  choice: заходят
  rationale: В астрономическом контексте глагол естественно обозначает заход звёзд, хотя буквально может также передавать движение внутрь или вниз.
- source_word: በመካናቲሆሙ
  choice: каждая в своём месте
  rationale: Дистрибутивная русская конструкция естественно передаёт множественное число с местоименным суффиксом и сохраняет представление об отведённых звёздам местах.
- source_word: በአዝማኒሆሙ
  choice: в своё время
  rationale: Сохраняет значение соответствующих каждой звезде времён или сроков, не добавляя прямо не выраженного слова «назначенное».
- source_word: በበዓላቲሆሙ
  choice: в свои праздники
  rationale: Сохраняет культово-календарное значение слова и не сводит его к общим периодам или сезонам.
- source_word: በአውራኂሆሙ
  choice: в свои месяцы
  rationale: Точно передаёт упоминание месяцев; уточнение «лунные» отсутствует в исходном тексте.
theological_decisions:
- issue: Следует ли нейтрализовать культово-календарное значение выражения በበዓላቲሆሙ
  choice: Сохранить «в свои праздники» рядом со временем и месяцами
  alternative: Передать все календарные обозначения обобщённо как «сроки» или «периоды»
  rationale: Упоминание праздников связывает небесный порядок со счётом сакрального времени. Буквальная напряжённость сохранена, а возможное ошибочное впечатление, будто празднуют сами звёзды, разъяснено в примечании.
translation_notes:
  register: 'Современный литературный русский язык с кратким, торжественным синтаксисом. Дистрибутивное «каждая» делает повтор местоименных форм естественным по-русски, не устраняя последовательность исходного текста: места, времена, праздники и месяцы.'
