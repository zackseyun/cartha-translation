base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/012.yaml
  text: 'And these are the heads of a thousand: between leader and leader[a], six are added after the station[e][d][c][b]; and their leaders make the distinction.'
translation:
  language: ru
  text: 'И вот тысяченачальники[a]: между одним предводителем и другим прибавляются шесть после установленного положения[b], а их предводители проводят различие[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «главы тысячи». Эфиопский текст этого стиха синтаксически труден; он, по-видимому, описывает техническое деление в порядке небесных светил.'
    reason: textual_variant
  - marker: b
    text: 'Или: «после места стояния», «после установленного места». Что именно прибавляется в количестве шести, в стихе не сказано.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «разделяют их», «различают их».'
    reason: lexical_alternative
lexical_decisions:
- source_word: እሙንቱ
  choice: вот
  rationale: Множественное указательное слово вводит перечисляемые элементы; «вот» естественно передаёт это в русском контексте.
- source_word: አርእስት፡ ፲፻
  choice: главы над тысячей
  rationale: Сохраняется буквальный образ «глав» и вероятный административно-технический титул; неопределённость отношения к числу не устраняется.
- source_word: ማእከለ፡ መራኂ፡ ወመራኂ
  choice: между одним предводителем и другим
  rationale: Повтор существительного с союзом после ማእከለ передаёт распределительное значение «между X и X».
- source_word: መራኂ
  choice: предводитель
  rationale: Слово обозначает ведущего или руководящего; «предводитель» сохраняет технический и возвышенный регистр, не уточняя астрономический референт.
- source_word: ይትዌሰኩ፡ ፮
  choice: прибавляются шесть
  rationale: Форма выражает прибавление; субъект или единица счёта в тексте не названы, поэтому они не вводятся в перевод.
- source_word: በድኅረ፡ ምቅዋም
  choice: после установленного места
  rationale: ምቅዋም связано со стоянием или установленным положением; русский вариант сохраняет конкретный образ и возможный технический смысл.
- source_word: መራሕያኒሆሙ
  choice: их предводители
  rationale: Сохранена связь с ранее употреблённым словом того же корня и местоименный суффикс множественного числа.
- source_word: ይፈልጡ
  choice: проводят различие
  rationale: Глагол допускает значения разделения, различения и распознавания; формулировка сохраняет эту техническую многозначность.
theological_decisions:
- issue: Следует ли раскрывать шесть как вставные дни или иные календарные единицы
  choice: Не называть подразумеваемые единицы и сохранить краткую техническую формулировку.
  alternative: Передать как «прибавляются шесть дней» или прямо объяснить вставные дни года.
  rationale: Эфиопский текст не называет единицу; её уточнение превратило бы вероятное контекстуальное толкование в содержание самого стиха.
- issue: Следует ли сглаживать неясную связь «глав», «тысячи» и «предводителей»
  choice: Сохранить различную лексику и синтаксическую напряжённость.
  alternative: Унифицировать все обозначения как календарных или небесных начальников.
  rationale: Источник остаётся текстуально и синтаксически трудным; более ясная схема потребовала бы привнесённого толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, техническим регистром. Необычность образов и неясность астрономической схемы намеренно сохранены; вставные слова сведены к минимуму.
