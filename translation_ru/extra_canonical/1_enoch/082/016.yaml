- source_word: መዋዕለ
  choice: дни
  rationale: Сохранено буквальное временное обозначение, хотя по контексту речь также может идти о периодах или сезонах.
- source_word: ያስተርእዩ
  choice: становятся видны
  rationale: Передаёт присущее глаголу значение явления или обнаружения и естественно звучит по-русски.
- source_word: ስልጣኑ
  choice: его владычества
  rationale: Сохраняет местоимение и возвышенное значение власти или правления, не уточняя подразумеваемого носителя власти.
- source_word: ሀፍ
  choice: испарина
  rationale: Основное конкретное значение связано с потом; «испарина» естественнее вписывается в перечень заметных признаков жаркого времени, чем нейтральное «пот».
- source_word: ሞቅ
  choice: жара
  rationale: Передаёт тепло или жар как климатический признак и сохраняет отличие от предшествующей «испарины».
- source_word: ዛሕን
  choice: затишье
  rationale: Контекст требует благоприятного погодного состояния, но точный оттенок слова неясен; «затишье» сохраняет краткость и не вводит эмоционального значения.
- source_word: ዕፀው
  choice: деревья
  rationale: Наиболее естественное русское соответствие в описании плодоношения и появления листвы.
- source_word: ይፈርዩ
  choice: приносят плоды
  rationale: Точно и идиоматично передаёт плодоношение деревьев.
- source_word: ቈጽል
  choice: листья
  rationale: Прямое ботаническое значение в данном контексте.
- source_word: ማእረረ ስርናይ
  choice: жатва пшеницы
  rationale: Передаёт сельскохозяйственный результат или пору сбора пшеницы; глагольная конструкция делает русский перечень естественным.
- source_word: ጽጌ ረዳ
  choice: роза
  rationale: Следует традиционному отождествлению растения, сохраняя примечанием возможную более широкую семантику.
- source_word: ገዳም
  choice: поле
  rationale: Слово может обозначать открытую или пустынную местность, но растительный и земледельческий контекст поддерживает перевод «поле».
- source_word: ዕፀወ ክረምት
  choice: зимние деревья
  rationale: Формально сохраняет необычное выражение источника, не заменяя его предположительным названием конкретной группы растений.
theological_decisions:
- issue: К кому относится местоимение в выражении «во дни его владычества»
  choice: Сохранить местоимение без уточнения референта.
  alternative: «во дни владычества солнца» или «во время правления этого светила»
  rationale: Ближайший контекст Астрономической книги может указывать на светило, однако сам стих не называет его прямо; уточнение сняло бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Синтаксис сделан ясным для обычного читателя; конкретная сезонная образность и неоднозначность местоимения сохранены. Необычное выражение «зимние деревья» оставлено без объяснительной конкретизации.
