base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/016.yaml
  text: 'And these are the signs of the days that appear on the earth in the days of his dominion: heat and warmth and calm[a]; and all the trees bear fruit, and leaves come forth on all the trees, and the harvest of wheat, and the blossom of the rose, and every flower that comes forth in the field[f][e][d][c][b]; but the trees of winter dry up.'
translation:
  language: ru
  text: 'И вот признаки этих дней, которые становятся видны на земле[a] во дни его владычества[b]: пот[c], жара и спокойная погода[d]. Все деревья приносят плоды, и на всех деревьях появляются листья; наступает жатва пшеницы, распускаются цветы розы[e] и всякий цветок, растущий в поле[f], а зимние деревья засыхают.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «которые являются на земле»; эфиопский глагол может обозначать как появление, так и обнаружение, становящееся видимым.'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, речь идёт о времени господства светила, описываемого в окружающем контексте, однако в самом стихе носитель власти прямо не назван.
    reason: cross_reference
  - marker: c
    text: 'Буквально: «пот»; возможен также переносный смысл «зной» или «жара».'
    reason: lexical_alternative
  - marker: d
    text: Значение этого слова в данном месте не вполне ясно; возможно, имеется в виду мягкая, приятная или спокойная погода.
    reason: lexical_alternative
  - marker: e
    text: «Роза» — традиционное отождествление; исходное слово может обозначать цветущее растение более широко.
    reason: lexical_alternative
  - marker: f
    text: Слово может также означать пустынную местность или открытую землю; здесь растительный контекст позволяет перевести его как «поле».
    reason: lexical_alternative
lexical_decisions:
- source_word: ትእምርተ
  choice: признаки
