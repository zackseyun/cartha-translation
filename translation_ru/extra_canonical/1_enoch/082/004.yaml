  source_fidelity: 'Основные образы и календарная последовательность переданы верно: блаженство праведных, путь праведности, небесные врата, тридцатидневный период, «главы тысяч», добавочные четыре единицы и четыре части года сохранены. Однако русское «не имеют греха, как грешники» синтаксически создаёт противоположный смысл: сравнение оказывается отнесённым к отсутствию греха у грешников. Более безопасно передать сравнительную конструкцию глаголом «не грешат, как грешники», не разрешая вопрос об абсолютной безгрешности.'
