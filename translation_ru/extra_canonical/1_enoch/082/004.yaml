base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/004.yaml
  text: Blessed are all the righteous who walk in the path of righteousness and have no sin like sinners[a], in the whole count of all their days, while the sun goes on its course in heaven, entering and going out through the gates for thirty days, together with the heads of the thousands of the order of the stars, and with the four that are added, which divide the four parts of the year[c][b], which lead them and enter with them on four days.
translation:
  language: ru
  text: Блаженны все праведники, которые ходят путём праведности и не грешат, как грешники, во все дни, отведённые им, пока солнце идёт своим путём по небу, входя и выходя через врата по тридцать дней, вместе с главами тысяч звёздного порядка[b] и с четырьмя прибавляемыми[a], которые разделяют четыре части года, ведут их и входят вместе с ними в течение четырёх дней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В переданной эфиопской записи здесь читается числовой знак, который может означать «десять» и плохо согласуется с контекстом. Упоминания четырёх частей года и четырёх дней поддерживают чтение о четырёх прибавляемых днях.
    reason: textual_variant
  - marker: b
    text: 'Возможный перевод: «главами тысяч порядка звёзд». Эфиопское выражение численно и синтаксически трудно; перевод сохраняет образ иерархических начальников, не сводя его к общему обозначению звёздных чинов.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ብፁዓን፡ ጻድቃን
  choice: Блаженны все праведники
  rationale: «Блаженны» сохраняет возвышенную форму макаризма, а «праведники» передаёт устойчивую библейскую этико-богословскую лексику.
- source_word: የሐውሩ፡ በፍኖተ፡ ጽድቅ
  choice: ходят путём праведности
  rationale: Сохраняет нравственную метафору хождения по пути и её связь с последующим движением солнца.
- source_word: ወአልቦሙ፡ ኃጢአት፡ ከመ፡ ኃጥኣን
  choice: не имеют греха, как грешники
  rationale: Передаёт сильное утверждение источника, не устраняя сравнительную конструкцию и не решая скрыто вопрос о полной безгрешности.
- source_word: በኍልቈ፡ ኵሉ፡ መዋዕሊሆሙ
  choice: во всём счёте всех своих дней
  rationale: «Счёт» сохраняет характерную для Астрономической книги лексику исчисления времени, хотя по-русски оборот намеренно остаётся несколько техническим.
- source_word: ለዘ፡ የኀውር፡ ፀሐይ፡ በሰማይ
  choice: пока солнце идёт своим путём по небу
  rationale: Естественно передаёт движение солнца и сохраняет смысловую перекличку с хождением праведников путём праведности.
- source_word: በአናቅጽ፡ ይበውእ፡ ወይወጽእ
  choice: входя и выходя через врата
  rationale: Сохраняет конкретный образ небесных врат, важный для данного раздела.
- source_word: አርእስተ፡ ፲፻ዘሥርዓቶሙ፡ ለከዋክብት
  choice: главами тысяч звёздного порядка
  rationale: Передаёт административно-иерархический образ «глав тысяч», сохраняя при этом единственное число слова «порядок».
- source_word: ምስለ፲እለ፡ ይትዌሰኩ
  choice: с четырьмя прибавляемыми
  rationale: Контекст деления года на четыре части и завершающее упоминание четырёх дней поддерживают чтение о четырёх добавочных единицах; числовая трудность источника отмечена в сноске.
- source_word: እለ፡ ይጼልዩ፡ ማእከለ፡ ፬ክፍለ፡ ዓመት
  choice: которые разделяют четыре части года
  rationale: Следует синтаксису и календарному образу источника, не уточняя сверх текста точный механизм деления.
theological_decisions:
- issue: Утверждает ли стих абсолютную безгрешность праведников
  choice: «не имеют греха, как грешники»
  alternative: «не грешат так, как грешники» или безоговорочное «совершенно безгрешны»
  rationale: Сильная формулировка источника сохранена вместе со сравнением «как грешники»; перевод не ослабляет её и не превращает в позднейшее догматическое определение.
- issue: Что представляют собой прибавляемые календарные единицы
  choice: Четыре прибавляемые единицы, по контексту — дни
  alternative: Буквально следовать читаемому в транскрипции числу «десять» либо понимать их как дополнительных звёздных начальников
  rationale: Четыре части года и четыре дня в конце стиха поддерживают традиционное понимание четырёх добавочных дней, но текстовая трудность раскрыта читателю.
- issue: Неясный референт местоимения в заключительной части
  choice: Сохранить «ведут их и входят вместе с ними» без уточнения референта
  alternative: Явно назвать звёзды, главы или добавочные дни
  rationale: Синтаксис источника допускает неясность; её нельзя устранять вставкой богословски или космологически определённого субъекта.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Сохранены формула блаженства, библейская метафора пути, техническая календарная лексика и намеренная синтаксическая плотность трудного эфиопского текста; неясные референты не конкретизированы.
