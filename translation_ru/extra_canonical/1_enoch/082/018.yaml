  text: The second leader after him is Helemmelek[c][b][a], whose name they call the Sun.
translation:
  language: ru
  text: Второй предводитель после него — Хелеммелек[a], имя которого они называют Солнцем[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Геэзское имя передано как «Хелеммелек»; его точная огласовка не вполне достоверна.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «имя которого они называют Солнцем». Возможна более гладкая передача: «которого называют Солнцем».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልእ
  choice: второй
  rationale: В контексте последовательного перечисления слово имеет порядковое значение; «второй» точнее, чем неопределённое «другой».
- source_word: መራሒ
  choice: вождь
  rationale: Слово обозначает того, кто ведёт или управляет; «вождь» сохраняет образ руководителя небесного порядка, не вводя специального ангельского чина.
- source_word: ዘድኅሬሁ
  choice: после него
  rationale: Оборот указывает на следование в упорядоченном перечне; это естественная русская передача.
- source_word: ሄልእምሜሌክ
  choice: Хелеммелек
  rationale: Имя передано транслитерацией в форме, согласованной с принятой формой Helemmelek; точная огласовка геэзского имени остаётся не вполне уверенной.
- source_word: ዘይጼውዕዎ ስሞ
  choice: имя которого они называют
  rationale: Сохранены явно выраженное «имя» и активная форма глагола во множественном числе — «они называют», хотя по-русски такая формула звучит несколько необычно.
- source_word: ፀሐየ
  choice: Солнцем
  rationale: Творительный падеж требуется русским глаголом «называть»; прописная буква передаёт функцию названия небесного светила в данном перечне.
theological_decisions:
- issue: Считать ли заключительное обозначение обычным существительным или формальным названием небесного светила
  choice: Солнцем
  alternative: солнцем
  rationale: Контекст представляет упорядоченный перечень небесных светил и их вождей. Прописная буква отмечает функцию названия, не утверждая самостоятельной личности и не привнося поздней богословской интерпретации.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим регистром. Необычная формула именования сохранена ради близости к геэзскому тексту; слово «вождь» поддерживает космический образ руководителя, не превращая его в технический титул.
