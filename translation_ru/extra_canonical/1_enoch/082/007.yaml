base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/007.yaml
  text: And the matter is true[a], and the reckoning is exact; for Uriel showed me the luminaries, and the paths, and the appointed times, and the years, and the days, and breathed on me—Uriel[f][e][d][c][b], to whom the Lord of all creation of the world gave command concerning the host of heaven.
translation:
  language: ru
  text: И это изложение истинно[a], и установленный расчёт точен[b], ибо Уриил показал мне светила, месяцы[c], назначенные времена[d], сезоны дождей[e] и дни и дохнул на меня[f]; Господь всего сотворённого в мире дал ему повеление относительно небесного воинства[g].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и истинно дело (или сообщение)».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «и точен его определённый расчёт». Эфиопская формулировка подчёркивает как установленность, так и точность календарного исчисления.'
    reason: lexical_alternative
  - marker: c
    text: 'Здесь: «месяцы». Сходную форму иногда связывают с путями или ходом небесных светил, но календарный перечень поддерживает значение «месяцы».'
    reason: lexical_alternative
  - marker: d
    text: 'Также возможно: «праздники». Слово обозначает установленные календарные сроки, в том числе праздничные дни.'
    reason: lexical_alternative
  - marker: e
    text: 'Также возможно: «сезоны» или «годы». Буквальное значение связано с дождливым сезоном, который мог служить обозначением годового периода.'
    reason: lexical_alternative
  - marker: f
    text: 'Или: «подул на меня». Сохранён буквальный образ; его можно понимать как действие, сопровождающее передачу откровения.'
    reason: cultural_note
  - marker: g
    text: Выражение может обозначать упорядоченный небесный сонм, включая небесные тела. Точная связь повеления с этим сонмом допускает разные оттенки, поэтому не уточняется как поручение управлять им.
    reason: lexical_alternative
lexical_decisions:
- source_word: አማን ነገሩ
  choice: это изложение истинно
  rationale: አማን передаёт истинность, а ነገር — дело, сообщение или изложение. Такая формулировка сохраняет утверждение об истинности и естественно звучит по-русски.
- source_word: ጥንቁቅ ሐሳቡ ዘልኩዕ
  choice: установленный расчёт точен
  rationale: ጥንቁቅ указывает на точность, ሐሳብ в календарном контексте означает расчёт, а ዘልኩዕ добавляет значение установленности или определённости; последнее не следует опускать.
- source_word: ብርሃናት
  choice: светила
  rationale: Речь идёт об упорядоченных небесных источниках света; «светила» сохраняет астрономический и возвышенный оттенок.
- source_word: አውራኅ
  choice: месяцы
  rationale: В данном календарном перечне форма понимается как множественное число слова «месяц», а не как «пути»; это согласуется с последовательностью временных единиц.
- source_word: በዓላት
  choice: назначенные времена
  rationale: Слово может обозначать праздники, но в календарном контексте допускает более широкое значение фиксированных или назначенных сроков.
- source_word: ክረማት
  choice: сезоны дождей
  rationale: Основное конкретное значение связано с дождливым сезоном; в календарном употреблении слово может также обозначать сезоны или годы, поэтому неоднозначность отмечена в сноске.
- source_word: መዋዕል
  choice: дни
  rationale: После более крупных календарных периодов наиболее прямое значение — «дни».
- source_word: ነፍሐ ዲቤየ
  choice: дохнул на меня
  rationale: Сохранён конкретный образ дуновения, а не истолкование как наставления или вдохновения.
- source_word: እግዚእ ኵሉ ፍጥረት ዓለም
  choice: Господь всего сотворённого в мире
  rationale: Передаёт космический объём власти и устраняет неестественную для русского языка цепочку родительных падежей.
- source_word: ለሐይለ ሰማይ
  choice: о небесном воинстве
  rationale: Сохраняет широкий смысл повеления, относящегося к упорядоченному небесному сонму, без уточнения характера управления.
theological_decisions:
- issue: Божественный титул እግዚእ
  choice: Господь
  alternative: Владыка
  rationale: «Господь» естественно передаёт титул божественной верховной власти и не вносит конфессионально специфического толкования.
- issue: Конкретный образ ነፍሐ ዲቤየ
  choice: дохнул на меня
  alternative: вдохновил меня
  rationale: Буквальный образ сохраняет апокалиптическую выразительность текста и не решает заранее, что именно означает это действие.
- issue: Небесное воинство
  choice: небесное воинство
  alternative: небесные светила
  rationale: Более широкая формулировка сохраняет возможное указание как на небесные тела, так и на упорядоченный небесный сонм.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим регистром. Календарная терминология передана ясно, но без сглаживания лексической и текстуальной неоднозначности; повтор имени Уриил сохранён как риторическое присоединение исходного текста.
