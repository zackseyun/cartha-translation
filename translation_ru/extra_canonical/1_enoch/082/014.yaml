base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/014.yaml
  text: And the names of those who lead them are Adnarel[a], Iyasusael, and Elomeel. These three follow after the leaders of the orders, and there are two that follow after the leaders of the orders, which follow after all the leaders of the fixed stations[c][b], who divide the four parts of the year.
translation:
  language: ru
  text: Имена тех, кто их ведёт, — Аднарел, Иясусаел и Эломеел. Эти трое следуют за предводителями порядков, а один следует за тремя предводителями порядков[a]; те следуют за всеми предводителями установленных стоянок[b], которые разделяют год на четыре части[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В печатном тексте издания Чарльза стоят числа «один» и «три». В предоставленной машинной транскрипции они ошибочно распознаны как «два» и «семьдесят».
    reason: textual_variant
  - marker: b
    text: 'Или: «закреплённых положений». Средняя часть стиха синтаксически трудна: несколько групп предводителей соединены повторяющимся выражением «следуют за». Перевод сохраняет эту последовательность, не превращая её в полностью однозначную иерархию.'
    reason: lexical_and_syntactic_ambiguity
  - marker: c
    text: 'Или: «на четыре раздела года». Речь идёт о календарном делении года в Астрономической книге.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይመርሃዎሙ
  choice: ведёт их
  rationale: Глагол обозначает ведение или руководство; «ведёт» сохраняет образ упорядоченного движения и не сужает смысл до наставления.
- source_word: ይተልዉ
  choice: следуют за
  rationale: Повторяющийся глагол передаёт последовательность в устроенном порядке; повтор сохранён, а не сглажен.
- source_word: መራሕያነ
  choice: предводители
  rationale: Слово образовано от корня со значением «вести»; «предводители» ясно передаёт руководящую роль и различает существительное и глагол в русском тексте.
- source_word: ሥርዓታት
  choice: порядки
  rationale: В контексте Астрономической книги речь идёт об упорядоченных системах или чредах. «Порядки» сохраняет широкий космико-административный смысл без излишней конкретизации.
- source_word: ምቅዋማት
  choice: установленные стоянки
  rationale: Существительное указывает на места стояния или закреплённые положения. Выражение сохраняет пространственный образ и его астрономический оттенок.
- source_word: ይፈልጡ
  choice: разделяют
  rationale: Глагол может означать разделение, отделение или разграничение; при объекте «четыре части года» естественно «разделяют».
- source_word: አርባዕተ ክፍለ ለዓመት
  choice: четыре части года
  rationale: Буквально речь идёт о четырёх частях или делениях года; формулировка не подменяет древнюю календарную категорию современным техническим термином.
theological_decisions:
- issue: Характер названных существ
  choice: Имена переданы транслитерацией как личные имена небесных предводителей.
  alternative: Понимать формы как испорченные названия или переводить их как описательные титулы.
  rationale: В данном астрономическом перечне они функционируют как собственные имена; их значения не выводятся из текста с достаточной надёжностью.
- issue: Иерархия групп в средней части стиха
  choice: Повторяющиеся звенья «следуют за» и не вполне ясные соотнесения сохранены.
  alternative: Перестроить фразу в однозначную иерархию небесных чинов.
  rationale: Синтаксис геэзского текста допускает неясность в отношении групп и антецедентов; богословски нагруженное упорядочение не следует привносить в перевод.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего астрономического перечня. Имена транслитерированы как Аднарел, Иясусаел и Эломеел. Повтор «следуют за» намеренно сохранён; тяжеловесность синтаксиса слегка упорядочена пунктуацией, но исходная неоднозначность не устранена.
