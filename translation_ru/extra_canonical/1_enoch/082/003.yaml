base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/003.yaml
  text: And those who understand shall not sleep[a], but shall listen with their ears so as to learn this wisdom[d][c][b]; and it will be sweeter to them than good food is to those who eat.
translation:
  language: ru
  text: И разумеющие не уснут, но будут жаждать услышать[a], чтобы научиться этой мудрости; и она будет для них приятнее, чем хорошая пища приятна тем, кто ест[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будут жаждать своими ушами» — то есть будут страстно стремиться услышать.'
    reason: lexical_alternative
  - marker: b
    text: 'Сравнение построено параллельно: мудрость приятнее разумеющим, чем хорошая пища приятна тем, кто ест.'
    reason: clarification
lexical_decisions:
- source_word: ኢይነውሙ
  choice: не уснут
  rationale: Сохраняет обычное значение «спать» и метафорический образ бодрой восприимчивости, не заменяя его толкованием.
- source_word: እለ ይሌብዉ
  choice: разумеющие
  rationale: Передаёт людей, способных понимать и различать, в краткой и достойной русской форме.
- source_word: ይጸምኡ በእዝናሆሙ
  choice: будут жаждать услышать
  rationale: Передаёт положительный образ «жаждать ушами», то есть страстно стремиться слушать; отрицание относится только к предшествующему глаголу.
- source_word: ከመ ይትመሀርዋ
  choice: чтобы научиться
  rationale: Естественно передаёт целевое значение конструкции.
- source_word: ለዛ ጥበብ
  choice: этой мудрости
  rationale: Сохраняет указание на изложенное непосредственно перед этим учение.
- source_word: ትደልዎሙ
  choice: будет для них приятнее
  rationale: Глагол означает пригодность, угодность или приятность; сравнительная форма естественна перед последующим сравнением с хорошей пищей.
- source_word: እመበልዕት ሠናያት
  choice: чем хорошая пища
  rationale: Конкретно и естественно передаёт сравнение с доброй, желанной пищей.
- source_word: ለእለ ይበልዑ
  choice: для тех, кто ест
  rationale: 'Сохраняет синтаксический параллелизм: мудрость приятна разумеющим, как хорошая пища — тем, кто ест; объект «её» не добавляется.'
theological_decisions:
- issue: Образ сна и жажды слышать
  choice: 'Сохранить телесные образы: разумеющие не спят и жаждут услышать мудрость.'
  alternative: 'Передать обобщённо: «мудрые будут бодрствовать и внимательно слушать».'
  rationale: Сохранение образности поддерживает напряжённый язык апокалиптической мудрости и не сводит его к нейтральному наставлению.
- issue: Характер сравнения мудрости с пищей
  choice: Передать мудрость как более приятную, чем хорошая пища.
  alternative: «Она будет для них слаще хорошей пищи».
  rationale: «Приятнее» точнее отражает значение ደለወ и не подменяет его глаголом со значением вкусовой сладости, хотя пищевой образ полностью сохраняется.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Разумеющие» сохраняет афористическую краткость, а «будут жаждать услышать» делает необычный эфиопский образ понятным без его устранения.
