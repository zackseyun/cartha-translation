  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Техническое «исчисление года» сохранено ради календарного контекста; образ «врат» не рационализирован. Эллипсис оригинала после четвёртых и шестых врат сохранён и пояснён в сноске.
