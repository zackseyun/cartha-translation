base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/006.yaml
  text: 'For they belong to the reckoning of the year[a], and they are truly fixed forever: one in the first gate, one in the third gate, one in the fourth, and one in the sixth[b]; and the year is completed in three hundred and sixty-four days.'
translation:
  language: ru
  text: 'Ибо они входят в исчисление года[a] и поистине установлены навеки: по одному — в первых вратах, по одному — в третьих вратах, по одному — в четвёртых и по одному — в шестых[b]; и год завершается за триста шестьдесят четыре дня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Повторяемое далее «по одному… по одному… по одному… по одному» относится к четырём добавочным дням, распределённым между четырьмя частями солнечного года в енохическом календаре из 364 дней.
    reason: cultural_note
  - marker: b
    text: В доступной строке, восстановленной по OCR, слово «врата» не повторено после «четвёртых» и «шестых»; последовательность, по-видимому, предполагает его и в этих двух случаях.
    reason: textual_variant
lexical_decisions:
- source_word: እስመ
  choice: Ибо
  rationale: Сохраняет пояснительно-причинную связь с предыдущим высказыванием и соответствует возвышенному, но понятному регистру.
- source_word: ሀለዉ፡ በሐሳበ፡ ዓመት
  choice: они входят в исчисление года
  rationale: Передаёт не простое существование, а включённость этих дней в календарный расчёт.
- source_word: ወአማን፡ ልኩዓን፡ እሙንቱ፡ ለዓለም
  choice: и поистине установлены навеки
  rationale: «Установлены» сохраняет смысл закреплённости и упорядоченного назначения, а «поистине» и «навеки» передают эмфазу и постоянство.
- source_word: አሐቲ
  choice: одна
  rationale: Женский род соотнесён с подразумеваемым словом «день» в русском языке; четырёхкратный повтор сохранён как структурно значимый.
- source_word: በቀዳሚት፡ ኆኅት / በሣልስት፡ ኆኅት
  choice: у первых врат / у третьих врат
  rationale: «У» естественно передаёт размещение в перечне, не навязывая значения движения; «врата» сохраняют образность астрономического раздела.
- source_word: በራብዕት / በሳድስት
  choice: у четвёртых / у шестых
  rationale: 'Сохраняется эллипсис исходной строки: существительное «врата» подразумевается из предыдущих сочетаний.'
- source_word: ወይትፌጸም፡ ዓመተ፡ መዋዕል
  choice: так завершается год
  rationale: Естественно выражает достижение полноты годового цикла; «так» показывает связь завершения года с перечисленными добавочными днями.
- source_word: ፫፻ወ፷ወረቡዕ
  choice: триста шестьдесят четыре дня
  rationale: Прямо передаёт итоговую продолжительность енохического календарного года.
theological_decisions:
- issue: Характер утверждения о порядке светил и календаря
  choice: Постоянный, установленный порядок выражен словами «поистине установлены навеки».
  alternative: Понимать стих лишь как нейтральное описание наблюдаемой астрономической схемы.
  rationale: Эмфатические слова исходного текста указывают на устойчивость порядка, однако перевод не добавляет прямого упоминания Бога или творения, отсутствующего в данном стихе.
- issue: Референт повторяемого «одна»
  choice: Сохранить местоименное перечисление с пояснительной сноской о четырёх добавочных днях.
  alternative: Вставить «один день» четыре раза непосредственно в основной текст.
  rationale: Так сохраняется лаконичная и отчасти зависимая от контекста форма оригинала, а культурно-календарный смысл разъясняется без подмены текста.
