base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/005.yaml
  text: Because of them, people go astray and do not reckon them in the reckoning of all the world; for people err concerning them and do not know them exactly.
translation:
  language: ru
  text: Из-за них люди сбиваются с пути и не учитывают их в исчислении всего мира[a]; ведь люди заблуждаются насчёт них[b] и не знают их в точности[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Середина стиха в геэзском тексте трудна. В контексте календарных расчётов возможно понимание: «в исчислении всего мира»; также: «во всеобщем исчислении», а при менее техническом значении корня — «в помышлении всего мира».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно: «ведь они вводят людей в заблуждение». Геэзская форма допускает каузативное понимание.'
    reason: textual_ambiguity
  - marker: c
    text: 'Или: «не знают их тщательно (точно)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: በእንቲአሆሙ
  choice: из-за них
  rationale: Предложное сочетание естественно выражает причину; местоимение оставлено без уточнения референта, как в геэзском тексте.
- source_word: ይጌግዩ
  choice: сбиваются с пути
  rationale: Передаёт как значение заблуждения, так и образ уклонения с верного пути.
- source_word: ኢየኀስብዎሙ
  choice: не учитывают их
  rationale: В контексте календарных расчётов глагол связан со счётом и исчислением; «учитывают» сохраняет одновременно числовой и мыслительный оттенки.
- source_word: ተበሐሳቤ
  choice: в исчислении
  rationale: В Астрономической книге корень ኀሰበ употребляется в техническом контексте календарного счёта; «исчисление» точнее, чем общее «мысль».
- source_word: ኵሉ ዓለም
  choice: всего мира
  rationale: Сохранён широкий, буквальный охват исходного выражения, несмотря на трудность всей средней фразы.
- source_word: ይጌግይዎሙ
  choice: заблуждаются насчёт них
  rationale: Такое чтение соответствует синтаксическому пониманию, при котором «люди» являются субъектом обоих глаголов; возможное каузативное понимание отмечено в сноске.
- source_word: ኢያእምርዎሙ
  choice: не знают их
  rationale: Общий глагол знания не сужен до «не распознают» или «не понимают».
- source_word: ጥንቁቀ
  choice: в точности
  rationale: Передаёт оттенок тщательности и точности применительно к знанию календарных явлений.
theological_decisions:
- issue: Референт повторяющихся местоимений множественного числа
  choice: Оставить «их» без поясняющей подстановки.
  alternative: Назвать прямо небесные светила, установленные для них времена или календарные деления.
  rationale: Контекст указывает на светила и их установленные периоды, однако сам стих референта прямо не называет; его уточнение устранило бы подлинную неоднозначность.
- issue: Субъект и каузативность во второй части стиха
  choice: «люди заблуждаются насчёт них»
  alternative: «они вводят людей в заблуждение»
  rationale: Положение слова «люди» допускает его понимание как общего субъекта заключительных глаголов, но форма ይጌግይዎሙ может быть понята каузативно; альтернативное чтение сохранено в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего наставительного текста. Сохранены повтор местоимения «их», календарный термин «исчисление» и синтаксическая неоднозначность второй части; искусственно архаические формы не использованы.
