base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/008.yaml
  text: And they have authority by night and by day in heaven[a], so that they may give light upon humankind—the sun and the moon and the stars and all the powers of heaven[b], which return in their courses.
translation:
  language: ru
  text: И ему принадлежит власть ночью и днём на небе[a], дабы давали свет людям солнце, луна, звёзды и все небесные силы[b], которые возвращаются по своим кругам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «власть в нём» или «у него»; то есть он обладает властью.'
    reason: lexical_alternative
  - marker: b
    text: «Небесные силы» могут означать как небесные силы или светила, так и личные небесные власти; исходное выражение не устраняет этой неоднозначности.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ስልጣነ ቦቱ
  choice: ему принадлежит власть
  rationale: ቦቱ содержит местоименный суффикс 3-го лица мужского рода единственного числа («в нём / у него»), поэтому оборот естественно передан как обладание властью; он соотносится с мужским единичным референтом из ближайшего контекста.
- source_word: በሌሊት ወበመዓልት
  choice: ночью и днём
  rationale: Сохранена временная парность исходного выражения в естественной русской форме.
- source_word: ውስተ ሰማይ
  choice: на небе
  rationale: В русском языке движение и действие светил естественно локализуются «на небе»; выражение сохраняет космический контекст.
- source_word: ከመ ያርኡ ብርሃነ
  choice: чтобы давать свет
  rationale: Конструкция ከመ с глаголом выражает цель; множественная глагольная форма согласуется с последующим перечнем светил и небесных сил.
- source_word: ዲበ ሰብእ
  choice: людям
  rationale: Коллективное обозначение человечества передано обычным современным русским словом без гендерно ограниченного оттенка.
- source_word: ፀሐየ ወወርኀ ወከዋክብተ
  choice: солнцу, луне, звёздам
  rationale: Перечень светил сохранён; дательный падеж проясняет их роль как логического субъекта при инфинитиве «давать» после оборота «ему принадлежит власть».
- source_word: ኵሎሙ ስልጣናት ሰማይ
  choice: всем силам небесным
  rationale: Передача сохраняет возвышенный космический смысл и не решает однозначно, являются ли эти силы личными существами или безличными небесными силами.
- source_word: እለ ይትመየጡ በዓስቢሆሙ
  choice: которые возвращаются по своим кругам
  rationale: Глагол передаёт возвращение или поворот, а существительное — повторяющиеся пути или циклы; «по своим кругам» сохраняет образ упорядоченного циклического движения.
theological_decisions:
- issue: Относится ли ኵሎሙ ስልጣናት ሰማይ к личным небесным существам или к безличным космическим силам
  choice: «всем силам небесным»
  alternative: «всем властям небесным» или «всему воинству небесному»
  rationale: «Силы небесные» оставляет открытой личную или безличную трактовку и соответствует контексту упорядоченного движения светил.
- issue: Число носителя власти в начале стиха
  choice: 'Единственное число: «ему принадлежит власть»'
  alternative: 'Множественное число: «им принадлежит власть»'
  rationale: Форма ቦቱ имеет суффикс 3-го лица мужского рода единственного числа. Множественное число могло бы возникнуть под влиянием последующего перечня, но грамматически менее вероятно.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно возвышенным ритмом. Синтаксис сохраняет постпозитивный перечень светил, но дательный падеж делает его связь с целевым оборотом ясной. Терминология не навязывает ангелологического или натуралистического прочтения.
