  source_fidelity: Начальное ቦቱ имеет мужской суффикс единственного числа; «ему принадлежит власть» верно передаёт этот элемент и не должно заменяться множественным числом по аналогии с последующим перечнем. Однако дательный ряд «солнцу, луне, звёздам…» в данном русском синтаксисе делает светила косвенными дополнениями при «давать свет», хотя по источнику они являются носителями действия «давать свет».
