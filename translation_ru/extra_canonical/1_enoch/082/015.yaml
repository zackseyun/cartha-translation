base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/015.yaml
  text: At the beginning of the year[a], first rises and rules Melkiyal, whose name is called Tam'ade'eni and the sun; and all the days of his dominion, while he rules[c][b], are ninety-one days.
translation:
  language: ru
  text: В начале года первым восходит и правит Мелкиял, которого называют Там’аде’эни и Солнцем[a]; и все дни его владычества, в которые он правит[b], составляют девяносто один день.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Фраза об имени в геэзском тексте трудна. «Там’аде’эни» оставлено без перевода как возможное имя или особое обозначение. Слова «и Солнцем», по-видимому, также входят в формулу именования.
    reason: textual_variant
  - marker: b
    text: Начальный отрезок года изображён здесь как период, находящийся под властью Мелкияла; его длительность составляет девяносто один день.
    reason: cultural_note
lexical_decisions:
- source_word: በቅድመ ዓመት
  choice: в начале года
  rationale: Временное значение предлога при слове «год» естественно передаётся как «в начале года».
- source_word: ቀዳማዊ ይሠርቅ
  choice: первым восходит
  rationale: 'Порядковое слово понято наречно при глаголе: Мелкиял восходит первым; это соответствует синтаксису источника и последней текстологической правке.'
- source_word: ወይመልክ
  choice: и правит
  rationale: Сохраняет повторяющийся в стихе образ космического правления, не сводя его к нейтральному обозначению календарного периода.
- source_word: ምልኪያል
  choice: Мелкиял
  rationale: Имя небесного правителя передано транслитерацией, без истолковывающего перевода.
- source_word: ዘይሠመይ ስሞ
  choice: чьё имя называется
  rationale: Намеренно сохранена несколько необычная именная формула источника, поскольку следующая за ней конструкция текстологически трудна.
- source_word: ተመአደኒ
  choice: Там’аде’эни
  rationale: Неясное слово, вероятно имя или специальное обозначение, транслитерировано во избежание предположительного перевода.
- source_word: ወፀሐይ
  choice: и Солнце
  rationale: Слово включено в формулу именования, а не соединено с последующим подсчётом дней; прописная буква указывает на употребление как имени или титула.
- source_word: ኵሎሙ መዋዕለ
  choice: всех дней
  rationale: Передан буквальный подсчёт полного числа дней данного периода.
- source_word: ዘበስልጣኑ ዚአሁ
  choice: его владычества
  rationale: «Владычество» сохраняет лексику власти и перекличку с глаголом «правит».
- source_word: እለ ይመልክ
  choice: в которые он правит
  rationale: Относительное придаточное отнесено к дням и сохраняет повтор глагола правления.
theological_decisions:
- issue: Олицетворение календарного порядка
  choice: Сохранить слова «правит» и «владычество» применительно к Мелкиялу.
  alternative: 'Передать нейтрально: «возглавляет период», «обозначает» или «управляет временем года».'
  rationale: В астрономическом разделе космический порядок представлен через именованных небесных правителей с отведённой им властью. Такой язык следует сохранить, не добавляя позднейших ангелологических представлений.
- issue: Связь слова «Солнце» с формулой имени
  choice: Отнести «и Солнце» к формуле именования Мелкияла.
  alternative: Считать солнце отдельным подлежащим последующей части о девяноста одном дне.
  rationale: Последовательность слов в геэзском тексте и параллель в 1 Енох 82:18 поддерживают связь с именованием; альтернативная пунктуация создаёт нелогичное утверждение, будто солнце вместе с днями составляет девяносто один день.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной лексикой. Необычная формула именования сохранена ради текстовой неоднозначности; синтаксис подсчёта дней слегка архаизирован, чтобы передать структуру источника без логического сглаживания.
