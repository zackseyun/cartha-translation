revisions:
- from: А теперь, сын мой Мафусал, я рассказываю тебе обо всём этом и записываю это для тебя; я открыл тебе всё и передал тебе книги обо всём этом. Храни, сын мой, книгу из рук твоего отца[a], чтобы ты передал её поколениям мира[b].
  to: А теперь, сын мой Мафусал, я рассказываю тебе обо всём этом и записываю это для тебя; я открыл тебе всё и дал тебе их книги — обо всём этом. Храни, сын мой, книгу из руки твоего отца[a], чтобы ты передал её поколениям мира[b].
