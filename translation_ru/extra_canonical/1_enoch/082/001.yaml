base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/001.yaml
  text: And now[a], my son Methuselah, I tell you all these things, and I write them down for you, and I have revealed them all to you, and I have given you their books concerning all these things. Keep, my son, the book from the hand of your father[c][b], so that you may give it to the generations of the world.
translation:
  language: ru
  text: А теперь, сын мой Мафусал, я рассказываю тебе обо всём этом и записываю это для тебя; я открыл тебе всё и дал тебе их книги — обо всём этом. Храни, сын мой, книгу из руки твоего отца[a], чтобы ты передал её поколениям мира[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «книгу руки твоего отца». Это может означать книгу, полученную непосредственно от отца; возможен также оттенок книги, написанной его рукой.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «всем поколениям навеки» или «поколениям вечности».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: А теперь
  rationale: Передаёт формулу перехода к прямому наставлению естественным современным русским выражением.
- source_word: ወልድየ፡ ማቱሳላ
  choice: сын мой Мафусал
  rationale: Сохраняет отцовское обращение; «Мафусал» — принятое в русской библейской традиции соответствие имени.
- source_word: ኵሎሙ፡ እሉንተ
  choice: обо всём этом
  rationale: Передаёт совокупность ранее изложенных предметов без излишнего уточнения.
- source_word: ለከ፡ እነግር፡ ወእጽሕፍ፡ ለከ
  choice: я рассказываю тебе обо всём этом и записываю это для тебя
  rationale: Сохраняет параллелизм устного сообщения и письменной фиксации; местоимение «это» делает русскую фразу связной.
- source_word: ወኵሎሙ፡ ከሠትኩ፡ ለከ
  choice: я открыл тебе всё
  rationale: Глагол обозначает раскрытие или обнаружение; «открыл» сохраняет апокалиптический оттенок, оставаясь естественным по-русски.
- source_word: ወወሀብኩከ፡ መጻሕፍቲሆሙ፡ ለእሉ፡ ኵሎሙ
  choice: передал тебе книги обо всём этом
  rationale: Сжатая геэзская конструкция связывает книги с перечисленными откровениями. «Передал» уместно в контексте вручения писаний и не добавляет нового содержания.
- source_word: ዕቀብ
  choice: Храни
  rationale: Императив охватывает и удержание, и бережное сохранение текста для дальнейшей передачи.
- source_word: መጽሐፈ፡ እዴሁ፡ ለአቡከ
  choice: книгу из рук твоего отца
  rationale: Передаёт буквальный образ «книги руки твоего отца» более естественно для русского языка, сохраняя идею непосредственного происхождения или передачи.
- source_word: ወከመ፡ ትሀብ
  choice: чтобы ты передал её
  rationale: 'ከመ с зависимой глагольной формой вводит цель: книгу следует хранить ради последующей передачи, а не просто исполнять два равноправных повеления.'
- source_word: ለትውልደ፡ ዓለም
  choice: поколениям мира
  rationale: Сохраняет слова о поколениях и мире/веке, не сводя неоднозначную фразу исключительно к значению «навечно».
theological_decisions:
- issue: Объём и длительность передачи в выражении ለትውልደ፡ ዓለም
  choice: поколениям мира
  alternative: всем поколениям навеки; поколениям вечности
  rationale: Геэзское выражение допускает пространственно-всеобщий и временно-продолжительный оттенки. Основной текст сохраняет буквальный образ, а примечание отмечает временное прочтение, не устраняя неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего отцовского наставления. Синтаксический параллелизм сохранён, но перегруженность ряда союзов смягчена точкой с запятой. Архаизмы используются только там, где они укоренены в русской библейской традиции имён.
