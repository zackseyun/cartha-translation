base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/002.yaml
  text: Wisdom I have given to you[a], and to your children, and to those who shall be your children, so that they may give this wisdom, which is beyond their understanding[c][b], to their children throughout the generations.
translation:
  language: ru
  text: Мудрость я дал тебе, и твоим детям, и будущим твоим детям[a], чтобы они из поколения в поколение передавали своим детям эту мудрость, превосходящую их разумение[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «и будущим твоим детям» в данном эфиопском свидетельстве заключены в квадратные скобки и текстуально не вполне надёжны; возможно, имеются в виду будущие потомки вообще.
    reason: textual_variant
  - marker: b
    text: 'Буквально: «над их мыслью (разумением)». Выражение может означать мудрость, превосходящую их понимание; возможно также понимание: «в их умах».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ጥበበ
  choice: мудрость
  rationale: Существительное означает мудрость или разумение; «мудрость» сохраняет широкий смысл и возвышенный характер наставления, не ограничивая его только астрономическими знаниями.
- source_word: ወሀብኩ
  choice: я дал
  rationale: Перфективная форма естественно передаётся по-русски прошедшим временем; настоящее значение дара ясно из контекста.
- source_word: ወለውሉድከ
  choice: и твоим детям
  rationale: Форма обозначает детей или потомство; нейтральное «детям» соответствует ближайшему семейному контексту и не сужает значение до сыновей.
- source_word: '[ወለእለ፡ ይከውኑ፡ ለከ፡ ውሉደ፡]'
  choice: и тем, кто будет твоими детьми
  rationale: Перевод близко передаёт буквальный смысл спорной, заключённой в скобки фразы; примечание отмечает её текстуальную неуверенность и возможное более широкое понимание как будущих потомков.
- source_word: ከመ፡ የሀቡ፡
  choice: чтобы они … передавали
  rationale: Оборот выражает цель. В контексте передачи знания следующим поколениям русское «передавали» естественнее буквального «давали», не меняя смысла.
- source_word: ለትውልዳት
  choice: из поколения в поколение
  rationale: Устойчивое русское выражение ясно передаёт последовательную передачу мудрости многим поколениям.
- source_word: ዲበ፡ ሕሊናሆሙ
  choice: превосходящую их разумение
  rationale: ዲበ буквально означает «над, поверх», а ሕሊና — мысль, ум или разумение. В данном сочетании возможно значение мудрости, стоящей выше их естественного понимания; необычность и лексическая неоднозначность выражения отмечены в сноске.
theological_decisions:
- issue: Содержание передаваемого дара
  choice: Сохранено общее слово «мудрость».
  alternative: Уточнить как астрономическое или календарное знание.
  rationale: Контекст Книги светил допускает более узкое содержание, но сам стих употребляет широкое слово «мудрость», поэтому перевод не вводит отсутствующего уточнения.
- issue: Отношение мудрости к человеческому разумению
  choice: «превосходящую их разумение»
  alternative: «в их умах» или буквальное «над их мыслью»
  rationale: Основной текст передаёт вероятный смысл сочетания ዲበ ሕሊናሆሙ, но сноска сохраняет реальную возможность предложного, а не сравнительного понимания и не превращает выражение в догматическое утверждение о природе откровения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок фразы слегка выправлен ради ясности, при этом повтор «тебе, и твоим детям, и тем…» сохраняет торжественную последовательность оригинала.
