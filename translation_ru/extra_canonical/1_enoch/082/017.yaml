base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/017.yaml
  text: 'And these are the names of the leaders who are under them: Berkael[a], Zelbesael, and another who is added, the head of a thousand, whose name is Helyaseph[c][b]. And the days of the dominion of this one are completed.'
translation:
  language: ru
  text: 'И вот имена предводителей, находящихся под их началом: Беркаэл, Зелбесаэл и ещё один добавленный тысяченачальник, имя которого Хелуясэф.[a] И завершаются дни его владычества.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Геэзская фраза синтаксически неровна. Буквально: «и ещё один, добавленный, тысяченачальник, имя которого Хелуясэф»; связь определения «добавленный» с титулом допускает различные нюансы.'
    reason: textual_variant
  - marker: b
    text: 'Или: «И исполнились дни его власти». Слово может означать власть, владычество или вверенные полномочия, а глагольную форму можно понять как завершённое действие. В оригинале употреблено указательное выражение: буквально «дни владычества этого [лица]».'
    reason: lexical_alternative
lexical_decisions:
- source_word: አስማቲሆሙ
  choice: имена
  rationale: Форма с притяжательным суффиксом буквально означает «их имена»; принадлежность естественно выражена русской конструкцией «имена предводителей».
- source_word: መራሕያነ
  choice: предводителей
  rationale: Слово обозначает ведущих или руководящих лиц. «Предводители» сохраняет иерархический оттенок, не определяя их прямо как ангелов или военачальников.
- source_word: እለ መትሕቴሆሙ
  choice: находящихся под их началом
  rationale: Передаёт подчинённое положение в иерархии естественным современным русским оборотом.
- source_word: ብርክኤል
  choice: Беркаэл
  rationale: Консервативная транслитерация личного имени с сохранением элемента «-эл».
- source_word: ዜልብስኤል
  choice: Зелбесаэл
  rationale: Консервативная транслитерация геэзской формы; точная вокализация имени не вполне достоверна.
- source_word: ዘይትዌሰክ
  choice: присоединённый к ним
  rationale: Передаёт значение добавления или присоединения ещё одного лица к перечислению; местоимение добавлено для ясности по контексту.
- source_word: ርእሰ ፲፻
  choice: тысяченачальник
  rationale: Буквально «глава тысячи». Русское «тысяченачальник» кратко и традиционно передаёт иерархический ранг, не навязывая более конкретного устройства службы.
- source_word: ስሙ ሂሉያሴፍ
  choice: имя которого Хелуясэф
  rationale: Сохраняет явно присутствующее в источнике слово «имя» и консервативно транслитерирует имя.
- source_word: ተፈጸመ መዋዕለ ስልጣኑ
  choice: завершаются дни владычества
  rationale: Глагол выражает достижение завершения; настоящее время соответствует повторяющемуся календарному процессу в контексте. «Владычество» сохраняет широкий смысл власти и периода управления.
- source_word: ለዝ
  choice: этого последнего
  rationale: Сохраняет указание на названное лицо и помогает обозначить вероятного референта, не заменяя его личным местоимением.
theological_decisions:
- issue: Природа титулов в иерархии светил
  choice: 'Передать их как общие иерархические обозначения: «предводители» и «тысяченачальник».'
  alternative: Прямо назвать этих лиц ангельскими начальниками либо только астрономическими служителями.
  rationale: Сам стих представляет упорядоченную космическую иерархию, но здесь прямо не называет перечисленных лиц ангелами; перевод не разрешает этот вопрос за текст.
- issue: Характер завершения владычества
  choice: Использовать настоящее время «завершаются» как описание циклически наступающего завершения.
  alternative: «Завершились дни его владычества» как однократное событие в прошлом.
  rationale: Совершенная форма допускает значение наступившего завершения, однако календарный контекст главы поддерживает повторяющееся, регулярно совершающееся действие.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, соответствующим древнему апокалиптическому сочинению тоном. Имена переданы транслитерацией; синтаксическая неровность источника отмечена, но основной текст сделан удобочитаемым.
