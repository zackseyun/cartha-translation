    rationale: Геэзское ዘይትዌሰክ означает «который добавлен/присоединён», но не содержит дополнения «к ним». Это дополнение конкретизирует связь с ранее названными лицами, хотя текст лишь неровно вводит добавленное лицо или должность.
  - severity: medium
    issue: «Этого последнего» чрезмерно уточняет референт ለዝ.
    rationale: Указательное выражение означает «этого [лица]» и, вероятно, относится к только что названному лицу, однако слово «последнего» является добавочным толкованием. Русское «его» сохраняет естественную референцию без этого уточнения; буквальная особенность отмечена в примечании.
