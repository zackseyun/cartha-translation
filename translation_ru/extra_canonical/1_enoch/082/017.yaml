  rationale: 'Устранены два не выраженных источником интерпретационных добавления: «к ним» и «последнего». Сохранены присутствующее в оригинале указание «имя которого», титул «тысяченачальник» и настоящее время, уместное в описании циклического календарного порядка. Примечание a теперь фиксирует действительную синтаксическую трудность, не предлагая как единственное решение конструкцию с «как».'
