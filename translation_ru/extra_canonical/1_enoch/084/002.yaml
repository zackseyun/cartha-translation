base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/002.yaml
  text: Blessed are you[a], O Lord, great King and mighty in your greatness, Lord of all the creation of heaven, King of kings and God of all the world. And your kingship and your kingdom and your greatness endure forever and ever, and your authority is for all generations of generations. And all the heavens are your throne forever[d][c][b], and the whole earth is the footstool of your feet forever and ever.
translation:
  language: ru
  text: Благословен Ты, Господи, великий Царь, могучий в Своём величии, Господь всего небесного творения[b], Царь царей и Бог всего мира! И Твоё владычество[a], Твоё царство и Твоё величие пребывают во веки веков, и власть Твоя — для всех поколений поколений. И все небеса — престол Твой навеки[c], а вся земля — подножие ног Твоих во веки веков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Соответствующее эфиопское слово в данном текстовом свидетельстве читается не вполне уверенно; возможны также переводы «царственное величие», «господство» или «слава».
    reason: textual_variant
  - marker: b
    text: 'Буквально: «всего творения неба»; выражение может также означать «всего творения, находящегося на небе».'
    reason: lexical_alternative
  - marker: c
    text: Ср. Ис. 66:1. Здесь использован сходный образ небес как престола и земли как подножия, хотя формулировки не полностью совпадают.
    reason: cross_reference
lexical_decisions:
- source_word: ቡሩክ
  choice: Благословен Ты
  rationale: Предикативная формула благословения, непосредственно обращённая к Богу; сохраняет молитвенно-доксологический характер и естественно звучит по-русски.
- source_word: እግዚኦ
  choice: Господи
  rationale: Звательная форма передаёт прямое торжественное обращение к Богу без излишней архаизации.
- source_word: ንጉሥ ዐቢይ ወኃያል በዕበየ ዚአከ
  choice: великий Царь, могучий в Своём величии
  rationale: Сохраняет отдельные определения царского достоинства, могущества и величия, не устраняя присущий источнику повтор.
- source_word: ኵሉ ፍጥረት ሰማይ
  choice: всего небесного творения
  rationale: Передаёт буквальную связь «всё творение — небо» как совокупность небесного творения и остаётся понятным современному читателю.
- source_word: ንጉሠ ነገሥት
  choice: Царь царей
  rationale: Устоявшийся и точный русский эквивалент царского превосходного титула.
- source_word: አምላከ ኵሉ ዓለም
  choice: Бог всего мира
  rationale: В контексте вселенского царствования ዓለም естественнее всего обозначает мир, а не только временной век.
- source_word: መላኵትከ
  choice: Твоё владычество
  rationale: Контекст царства и власти поддерживает значение царственного господства; текстовая неустойчивость формы отмечена в сноске.
- source_word: መንግሥትከ
  choice: Твоё царство
  rationale: Сохраняет конкретно-абстрактный царский термин и отличает его от соседнего «владычества».
- source_word: ዕበይከ
  choice: Твоё величие
  rationale: Передаёт повторный акцент источника на божественном величии, не сглаживая его.
- source_word: ይነብር
  choice: пребывают
  rationale: В отношении владычества, царства и величия глагол выражает непрерывное существование и соответствует возвышенному регистру.
- source_word: ስልጣንከ
  choice: власть Твоя
  rationale: Явно передаёт самостоятельное существительное источника, не растворяя его в предыдущей фразе.
- source_word: ለኵሉ ትውልደ ትውልድ
  choice: во все поколения поколений
  rationale: Сохраняет усиленную и несколько необычную формулу источника, не заменяя её более гладким, но менее точным «из поколения в поколение».
- source_word: መንበርከ
  choice: престол Твой
  rationale: Сохраняет конкретный образ вселенского царствования.
- source_word: መካይደ እገሪከ
  choice: подножие ног Твоих
  rationale: Близко передаёт телесно-пространственный царский образ источника и его библейский оттенок.
- source_word: ለዓለም ወለዓለመ ዓለም
  choice: во веки веков
  rationale: Устоявшийся русский эквивалент усиленной формулы вечности.
theological_decisions:
- issue: Вселенское царствование и образ престола с подножием
  choice: 'Сохранить прямую царственно-космическую образность: небеса как престол, земля как подножие'
  alternative: Передать это отвлечённо как утверждение всеобщей власти Бога
  rationale: Источник намеренно использует конкретный апокалиптический образ вселенского Царя; отвлечённая перефразировка ослабила бы смысл и поэтику.
- issue: Соотношение владычества, царства, величия и власти
  choice: Передать каждое понятие отдельно
  alternative: Объединить близкие понятия в общую формулу о вечном правлении
  rationale: Перечисление является значимой частью доксологии, а ስልጣንከ образует самостоятельную фразу; объединение неоправданно устранило бы напряжение и повтор источника.
translation_notes:
  register: Современный литературный русский с торжественным молитвенным звучанием. Сохранены традиционные религиозные формы «Господи», «Царь царей», «престол», «подножие» и «во веки веков», но устранена ненужная архаическая синтаксическая тяжеловесность. Местоимения, обращённые к Богу, даны с прописной буквы согласно распространённой русской издательской практике.
