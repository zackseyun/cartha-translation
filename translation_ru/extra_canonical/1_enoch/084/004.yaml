base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/004.yaml
  text: And now the angels of your heavens have transgressed[c][b][a], and your wrath is upon the flesh of men until the great day of judgment.
translation:
  language: ru
  text: И ныне ангелы Твоих небес согрешили[a], и Твой гнев пребывает на плоти человеческой[b] до великого дня суда[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В дошедшей машинной транскрипции здесь стоит трудное чтение, однако исправленное эфиопское чтение означает «согрешили» или «совершили проступок», а не «возносят прошение».
    reason: textual_variant
  - marker: b
    text: 'Буквально: «на плоти человека»; выражение, вероятно, относится к людям в целом в их смертном состоянии.'
    reason: lexical_alternative
  - marker: c
    text: Последнее слово в машинной транскрипции повреждено; исправленное чтение означает «суд» или «осуждение».
    reason: textual_variant
lexical_decisions:
- source_word: መላእክተ ሰማያቲከ
  choice: ангелы Твоих небес
  rationale: Сохранены значение небесных существ, множественное число слова «небеса» и обращённое к Богу притяжательное местоимение.
- source_word: ይጌግዩ (исправление ошибочно распознанного ይጼብቡ)
  choice: согрешили
  rationale: Исправленное чтение означает совершение греха или проступка; прошедшее совершенное действие естественно передаёт установленную контекстом вину ангелов и не превращает утверждение в просьбу.
- source_word: ዲበ ሥጋ ሰብእ
  choice: на плоти человеческой
  rationale: Сохранён конкретный образ «плоти», а прилагательное «человеческой» естественно выражает собирательный смысл исходного единственного числа.
- source_word: ትከውን መዐትከ
  choice: Твой гнев пребывает
  rationale: Индикативное утверждение передано как продолжающееся состояние; «гнев» соответствует судебному контексту и силе исходного существительного.
- source_word: እስከ ዕለት ዐባይ
  choice: до великого дня
  rationale: Кратко сохранена традиционная апокалиптическая временная формула.
- source_word: ኵነኔ (исправление ошибочно распознанного ጽጌ)
  choice: суда
  rationale: Исправленное чтение прямо обозначает суд или осуждение и образует естественное определение выражения «великий день».
theological_decisions:
- issue: Характер высказывания об ангелах
  choice: Утверждение о том, что ангелы согрешили
  alternative: Просьба к ангелам вознести моление
  rationale: Исправленное эфиопское чтение имеет глагол со значением «грешить», а не «просить»; поэтому сохранена историческая предпосылка суда, а не повелительное или желательное высказывание.
- issue: Объём выражения «плоть человеческая»
  choice: Человечество в его телесной, смертной природе, при сохранении образа плоти
  alternative: Один отдельный человек либо вся плоть в более широком космическом смысле
  rationale: Единственное число в исходной идиоме естественно имеет собирательный смысл, однако перевод не заменяет образ нейтральным словом «человечество».
- issue: Продолжительность Божьего гнева
  choice: Гнев пребывает до великого дня суда
  alternative: Просьба о том, чтобы гнев начал действовать и продолжался до суда
  rationale: Форма понята как изъявительное утверждение. Перевод сохраняет напряжение между уже пребывающим гневом и будущим великим днём, не уточняя их догматического соотношения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавные буквы в местоимениях «Твоих» и «Твой» обозначают обращение к Богу. Синтаксис остаётся ясным для обычного читателя, а образы «небес», «гнева» и «плоти» сохранены без конфессионального истолкования.
