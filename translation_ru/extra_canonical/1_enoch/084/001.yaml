base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/001.yaml
  text: And I lifted up my hands in righteousness[a], and I blessed the Holy and Great One; and I spoke with the spirit of my mouth and with the tongue of flesh, which God has made for the children of the flesh of men, so that they might speak with it; and he gave them spirit and tongue and mouth[b], so that they might speak by them.
translation:
  language: ru
  text: И я воздел руки свои в праведности и благословил Святого и Великого; и говорил дыханием моих уст[a] и языком плоти, который Бог сотворил для детей плоти человеческой, чтобы они говорили посредством него; и Он дал им дыхание, язык и уста[b], чтобы они говорили ими.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духом уст моих». Слово на языке геэз может означать дыхание, дух или ветер; в данном перечне средств речи наиболее естественно значение «дыхание».'
    reason: lexical_alternative
  - marker: b
    text: 'Формулировка намеренно подчёркивает телесность человека: буквально — «дети плоти людей». Она говорит о человеческой сотворённости более выразительно, чем обобщённое слово «люди».'
    reason: cultural_note
lexical_decisions:
- source_word: አልዐልኩ እደዋየ
  choice: я воздел руки свои
  rationale: Глагол обозначает телесное поднятие рук в молитве; «воздел» сохраняет торжественный молитвенный оттенок и остаётся понятным в современном литературном русском.
- source_word: በጽድቅ
  choice: в праведности
  rationale: Предложная конструкция сохраняет нравственную характеристику молитвенного действия и формальную плотность оригинала.
- source_word: ባረክዎ ለቅዱስ ወለዓቢይ
  choice: благословил Святого и Великого
  rationale: Два согласованных эпитета относятся к одному Богу; прописные буквы передают их титульное употребление, не превращая их в два именования разных лиц.
- source_word: መንፈስ አፉየ
  choice: дыханием уст моих
  rationale: В перечне средств речи መንፈስ естественно означает дыхание, хотя слово допускает значение «дух»; неоднозначность отмечена в сноске.
- source_word: በልስነ ሥጋ
  choice: языком плоти
  rationale: Сохранён конкретный телесный образ без сглаживания до «человеческого языка».
- source_word: ውሉደ ሥጋ ሰብእ
  choice: детей человеческой плоти
  rationale: Формулировка сохраняет подчёркнутую телесность и некоторую избыточность исходного выражения, но звучит приемлемо по-русски.
- source_word: ከመ ይትናገሩ ባቲ
  choice: чтобы они говорили им
  rationale: Местоимение женского рода в геэз указывает на «язык»; русский творительный передаёт инструментальное значение.
- source_word: ወወሀቦሙ መንፈሰ ወልሳነ ወአፈ
  choice: и Он дал им дыхание, язык и уста
  rationale: Сохранена трёхчастная последовательность дарованных способностей и органов речи.
- source_word: ከመ ይትናገሩ ቦቱ
  choice: чтобы они говорили ими
  rationale: Множественное местоимение соотнесено со всей предшествующей триадой и передано естественным русским творительным.
theological_decisions:
- issue: Передавать ли መንፈስ как «дух» или как «дыхание»
  choice: дыхание
  alternative: дух
  rationale: Непосредственный контекст перечисляет сотворённые способности и органы человеческой речи, поэтому «дыхание» лучше передаёт антропологический смысл. Возможное значение «дух» не устранено, а вынесено в сноску.
- issue: Насколько явно сохранять телесную антропологию стиха
  choice: сохранить выражения «язык плоти» и «дети человеческой плоти»
  alternative: сгладить как «человеческий язык» и «люди»
  rationale: Повторение «плоти» является заметной особенностью текста и подчёркивает сотворённую телесность человека; сглаживание ослабило бы эту риторику.
- issue: К кому относятся эпитеты «Святой» и «Великий»
  choice: 'передать как два эпитета одного Бога: «Святого и Великого»'
  alternative: «Святого и Великого Единого» или два субстантивированных наименования
  rationale: Синтаксис поддерживает единый референт; добавление «Единого» не выражено в источнике.
translation_notes:
  register: Современный литературный русский с торжественным молитвенным оттенком. Архаизирующий глагол «воздел» употреблён точечно как привычное обозначение молитвенного жеста; синтаксис слегка формален, чтобы сохранить нарастающую цепь исходного текста. Все сноски отмечены в основном тексте.
