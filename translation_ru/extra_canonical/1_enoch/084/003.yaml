base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/003.yaml
  text: For you have made all things[a], and over all things you rule; and no deed is too hard for you, and not even a single wisdom passes beyond the throne of your dwelling, nor turns away from before your face. And you know all things, and see, and hear, and there is nothing hidden from you[d][c][b], for you see all things.
translation:
  language: ru
  text: Ибо Ты сотворил и над всем царствуешь; никакое дело не трудно для Тебя, и ни одна мудрость не проходит за пределы престола Твоего обитания и не отвращается от лица Твоего. Ты всё знаешь, видишь и слышишь, и ничто не сокрыто от Тебя, ибо Ты видишь всё.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: Заключительные слова «ибо Ты видишь всё» явно засвидетельствованы не во всех текстовых формах; они повторяют мысль о совершенном Божьем знании.
    reason: textual_variant
lexical_decisions:
- source_word: ገበርከ
  choice: Ты сотворил всё
  rationale: Глагол означает «делать, создавать». В геэзском прямое дополнение при нём не выражено, однако ближайшее ኵሉ («всё») и контекст хвалы Творцу позволяют дать естественную русскую формулировку, отметив синтаксическую особенность в сноске.
- source_word: ለኵሉ አንተ ትመልክ
  choice: над всем царствуешь
  rationale: Глагол передаёт именно царское владычество; «царствуешь» сохраняет возвышенный и конкретный образ лучше нейтрального «правишь».
- source_word: ኢይጸንዐከ ግብር
  choice: никакое дело не трудно для Тебя
  rationale: Конструкция с ጸንዐ и объектным суффиксом выражает значение «быть слишком трудным для кого-либо»; перевод сохраняет библейскую формулу божественного всемогущества.
- source_word: ወአሐቲ ጥበብ
  choice: ни одна мудрость
  rationale: Буквально — «одна/единая мудрость». Необычная формулировка сохранена, чтобы не сводить возможный смысл без достаточных оснований к «замыслу», «мысли» или «делу».
- source_word: ኢትሐልፍ እምንባራተ ምንባሪከ
  choice: не проходит за престол Твоего обитания
  rationale: Сохранены пространственное значение глагола «проходить, переходить за» и двойной образ престола и обитания, хотя сочетание остаётся семантически трудным.
- source_word: ኢትትመየጥ ኢእምገጽከ
  choice: не отвращается от лица Твоего
  rationale: Формулировка передаёт движение прочь и буквальный образ лица, не заменяя его более отвлечённым словом «присутствие».
- source_word: ታአምር ወትሬኢ ወትሰምዕ
  choice: Ты всё знаешь, видишь и слышишь
  rationale: Три глагола сохранены раздельно; «всё» естественно выражает универсальный охват, заданный ኵሎ.
- source_word: ዘይትኀባእ
  choice: сокрыто
  rationale: «Сокрыто» точно передаёт значение скрытого или утаённого и соответствует достоинству молитвенной речи.
theological_decisions:
- issue: Божественное владычество, всемогущество и всеведение
  choice: 'Сохранить последовательные всеобщие утверждения: Бог царствует над всем, никакое дело не трудно для Него и ничто от Него не сокрыто.'
  alternative: Ослабить эти слова, представив их лишь общей хвалебной гиперболой.
  rationale: Повторение ኵሉ и заключительное утверждение о всевидении поддерживают прямое, сильное прочтение, не требующее конфессионального уточнения.
- issue: Смысл фразы об «одной мудрости» и престоле
  choice: Оставить необычный образ в основном тексте и пояснить его неопределённость в сноске.
  alternative: Истолковать фразу как «ни один мудрый замысел не ускользает от Тебя».
  rationale: Геэзская фраза трудна и допускает понимание «мудрости» как замысла, мысли или предмета мудрости; буквальная прозрачность предпочтительнее недоказанного разрешения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с возвышенным молитвенным регистром. Местоимения, обращённые к Богу, написаны с прописной буквы. Синтаксис сделан ясным для обычного читателя, но необычный образ «мудрости» и «престола обитания» намеренно не сглажен.
