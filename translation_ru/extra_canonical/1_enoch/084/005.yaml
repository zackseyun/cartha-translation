  text: And now, O God and Lord and great King, I beseech and ask that you establish my prayer for me.
translation:
  language: ru
  text: 'И ныне, Боже, Господи и великий Царь, прошу и молю Тебя: утверди мою молитву для меня.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поставь (или: утверди) для меня мою молитву». Глагол может подразумевать, что молитва будет действенной.'
    reason: Сохраняет буквальный образ исходного глагола, отдельное «для меня» и значение слова «молитва», не навязывая более узкое толкование «исполни просьбу».
lexical_decisions:
- source_word: ወይእዜኒ
  choice: И ныне
  rationale: Передаёт связку ወ и временное наречие ይእዜ; частица -ኒ здесь естественно включается в связное русское «и ныне» без отдельного слова.
- source_word: አምላክ፡ ወእግዚእ፡ ወንጉሥ፡ ዐቢይ
  choice: Боже, Господи и великий Царь
  rationale: Сохраняет три обращения и возвышенный тон; звательная функция естественно выражена русскими формами «Боже» и «Господи».
- source_word: አስተበቍዕ፡ ወእስእል
  choice: прошу и молю Тебя
  rationale: Сохраняет парное усиление двух глаголов прошения, не сводя их к одному; дополнение «Тебя» естественно для современного русского синтаксиса и ясно из обращения.
- source_word: ታቅም፡ ሊተ፡ ስእለተየ
  choice: исполни мою просьбу
  rationale: Буквальный образ каузатива от корня «стоять/ставить, утверждать» в сочетании с «моей просьбой» по-русски неестественен; в контексте мольбы выражение означает сделать просьбу действенной, то есть исполнить её. «Мою» передаёт одновременно притяжательный суффикс и личную отнесённость ሊተ.
theological_decisions:
- issue: Характер просимого действия Бога в отношении молитвы
  choice: исполни мою просьбу
  alternative: утверди для меня мою молитву
  rationale: Выбрано контекстуально естественное значение, не уточняющее способ или содержание Божьего ответа. Более буквальная альтернатива сохраняет корневой образ, но в современном русском неясна и может ошибочно звучать как подтверждение правильности молитвы.
translation_notes:
  register: Современный литературный русский с достоинством молитвенного обращения. Заглавные местоимения «Тебя» соответствуют русской традиции почтительного обращения к Богу, не добавляя конфессиональной специфики.
