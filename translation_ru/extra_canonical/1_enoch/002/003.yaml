base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/002/003.yaml
  text: Look at the summer and the winter[a], how the whole earth is filled with water[b], and clouds and dew and rain rest upon it.
translation:
  language: ru
  text: Посмотрите на лето и зиму[a], как вся земля наполнена водой и как облака, роса[b] и дождь покоятся на ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Пара «лето и зима» непосредственно отражает геэзский текст. В эфиопском климатическом контексте «зима» может обозначать прежде всего дождливый сезон, а не холодное время года в современном русском понимании.
    reason: cultural_note
  - marker: b
    text: Употреблённое здесь слово допускает разные толкования, однако в ряду воды, облаков и дождя оно, вероятнее всего, означает атмосферную влагу — росу.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርእይዎ
  choice: Посмотрите на
  rationale: Форма выражает обращённый к слушателям призыв наблюдать; «посмотрите на» естественно передаёт повелительную силу и вводит созерцание творения.
- source_word: ለሐጋይ ወለክረምት
  choice: на лето и зиму
  rationale: Сохранена прямая сезонная пара оригинала, а возможная связь второго слова с дождливым сезоном пояснена в сноске.
- source_word: ከመ
  choice: как
  rationale: Слово вводит содержание наблюдения; «как» сохраняет наглядный, описательный характер высказывания.
- source_word: ኵሉ ምድር
  choice: вся земля
  rationale: В контексте наблюдения за миром выражение имеет всеобщий охват; «земля» здесь уместнее локального «страна» или «суша».
- source_word: መልአት ማየ
  choice: наполняется водой
  rationale: Передаёт образ полноты и естественно связывает сказуемое с веществом, которым наполняется земля.
- source_word: ወደመና
  choice: и облака
  rationale: Прямое обозначение метеорологического явления в ряду влагоносных явлений.
- source_word: ወጠለ
  choice: роса
  rationale: В сочетании с водой, облаками и дождём наиболее вероятно метеорологическое значение «роса»; неоднозначность отмечена в сноске.
- source_word: ወዝናም
  choice: и дождь
  rationale: Прямой и конкретный эквивалент погодного термина.
- source_word: ያዓርፍ ላዕሌሃ
  choice: ложатся на неё
  rationale: Передаёт движение к покою или оседание на поверхности земли; по-русски звучит естественнее буквального «покоятся на ней», сохраняя образ оригинала.
