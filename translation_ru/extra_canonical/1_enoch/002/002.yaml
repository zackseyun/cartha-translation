base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/002/002.yaml
  text: Look at the earth and understand concerning the works that are done upon it from the beginning to their completion[a], that none of the works of God changes[d][c][b], as they appear.
translation:
  language: ru
  text: 'Посмотрите на землю и вдумайтесь в дела, совершающиеся на ней от начала до их завершения: ни одно из дел Божьих не изменяется[a], как это видно[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «все дела Божьи не изменяются». Эфиопское выражение допускает как дистрибутивное, так и собирательное понимание.'
    reason: lexical_alternative
  - marker: b
    text: 'Также возможно: «являясь» или «будучи видимыми». Заключительный краткий оборот может относиться к Божьим делам в целом; его точная связь с предыдущими словами не вполне ясна.'
    reason: alternative_reading
lexical_decisions:
- source_word: ርእይዋ፡ ለምድር
  choice: Посмотрите на землю
  rationale: Императив передаёт прямой призыв к наблюдению; «земля» соответствует космическому контексту, а не обозначению отдельной страны.
- source_word: ወለብዉ
  choice: вдумайтесь
  rationale: Глагол призывает не только увидеть, но и осмыслить наблюдаемое. «Вдумайтесь» естественно передаёт переход от зрения к пониманию.
- source_word: በእንተ፡ ምግባር፡ ዘይትገበር፡ ላዕሌሃ
  choice: в дела, совершающиеся на ней
  rationale: ምግባር может означать дело, действие или совершаемое; множественное число по-русски естественно выражает собирательный смысл, а причастная конструкция сохраняет пассивное значение.
- source_word: እምቀዳሚ፡ እስከ፡ ተፍጻሜቱ
  choice: от начала до их завершения
  rationale: Фраза охватывает весь ход дел. «Завершение» передаёт достижение полноты точнее, чем простое прекращение; местоимение согласовано с русским множественным «дела».
- source_word: ከመ፡ ኢይትመየጥ፡ ኵሉ፡ ምግባረ፡ ለአምላክ
  choice: ни одно из дел Божьих не изменяется
  rationale: При отрицании сочетание ኵሉ с существительным допускает дистрибутивное понимание «ни одно». Формулировка сохраняет утверждение о постоянстве наблюдаемых Божьих дел, не превращая его в отвлечённый тезис о всяком божественном действии.
- source_word: እንዘ፡ ያስተርኢ
  choice: когда предстаёт взору
  rationale: Ast-основа здесь имеет непереходное или пассивное значение «являться, быть видимым», а не активное «показывать». Единственное число согласуется с дистрибутивным «ни одно дело».
theological_decisions:
- issue: Говорит ли стих об абсолютной неизменности любого действия Бога или о постоянстве Его дел в наблюдаемом миропорядке
  choice: Утверждение сформулировано о неизменности Божьих дел, которые можно наблюдать на земле.
  alternative: Понимать слова как всеобщий метафизический тезис о том, что Бог никогда ничего не изменяет.
  rationale: Ближайший контекст прямо призывает смотреть на землю и осмыслять происходящее на ней; поэтому перевод сохраняет связь с наблюдаемым порядком творения и не вносит позднейшую догматическую формулу.
- issue: Коллективное или дистрибутивное понимание ኵሉ ምግባረ ለአምላክ
  choice: «ни одно из дел Божьих не изменяется»
  alternative: «все дела Божьи не изменяются»
  rationale: Дистрибутивная формулировка естественнее по-русски при отрицании, однако исходная собирательность остаётся возможной и отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством древней увещательной речи. «Посмотрите» и «вдумайтесь» понятны широкому читателю; формы «Божьих» и «предстаёт взору» сохраняют умеренно возвышенный, но не архаический тон. Все сноски имеют маркеры в основном тексте.
