base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/002/001.yaml
  text: 'Consider all the works in heaven: how they do not alter their paths[a], and the lights in heaven, how all of them rise and set in order, each in its season[c][b], and do not transgress their appointed order.'
translation:
  language: ru
  text: 'Рассмотрите все небесные явления: как они не меняют своих путей[a], и светила на небе — как все они восходят и заходят в установленном порядке, каждое в своё время, и не отступают от своего установленного порядка[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не уклоняются от своих путей». Речь идёт о неизменности путей небесных явлений.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «не преступают установленного для них порядка». Это выражение может обозначать как отступление от назначенного строя, так и нарушение предписания.'
    reason: lexical_and_semantic_ambiguity
lexical_decisions:
- source_word: ጠይቁ
  choice: Взгляните
  rationale: Форма повелительного наклонения во множественном числе призывает внимательно наблюдать и осмыслить видимое творение; «взгляните» естественно вводит оба объекта наблюдения.
- source_word: ኵሎ፡ ዘውስተ፡ ሰማይ፡ ግብረ
  choice: все дела на небе
  rationale: ግብር передаёт дела, действия или произведения; «дела» сохраняет широту выражения и не ограничивает его одними небесными телами.
- source_word: ኢይመይጡ፡ ፍናዊሆሙ
  choice: они не меняют своих путей
  rationale: Сочетание обозначает неизменность путей небесных явлений; конкретный образ «путей» сохранён.
- source_word: ብርሃናት፡ ዘውስተ፡ ሰማይ
  choice: светила небесные
  rationale: В контексте имеются в виду небесные источники света; «светила» — естественное и dignified русское обозначение солнца, луны и звёзд.
- source_word: ይሠርቅ፡ ወየዐርብ
  choice: восходят и заходят
  rationale: Парные глаголы описывают регулярное появление и заход небесных светил.
- source_word: ሥሩዕ
  choice: в установленном порядке
  rationale: Слово выражает упорядоченность и установленность; формулировка подчёркивает не случайную последовательность, а заданный строй.
- source_word: በበዘመኑ
  choice: каждое в своё время
  rationale: Дистрибутивная конструкция указывает, что каждое светило действует в соответствующее ему время; это точнее и естественнее по-русски, чем более сезонное «в свою пору».
- source_word: ኢይትኀደዉ፡ እምሥርዓቶሙ
  choice: не отступают от предписанного им порядка
  rationale: Предлог እም поддерживает значение удаления или отступления «от» порядка; перевод сохраняет и пространственный оттенок нарушения границы, и нормативную силу ሥርዓት.
theological_decisions:
- issue: Передача небесной регулярности нейтральным описанием или нормативно-юридическим языком
  choice: не отступают от предписанного им порядка
  alternative: не нарушают установленного для них закона
  rationale: Выбранная формулировка сохраняет представление о подчинении творения заданному порядку, но не вводит в текст более узкое понятие «закона» и не отождествляет его прямо с Торой.
- issue: Подразумевается ли прямо Бог как установитель порядка
  choice: предписанного им порядка
  alternative: установленного Богом порядка
  rationale: В самом стихе установитель не назван. Пассивная формулировка сохраняет богословский смысл установленности, не делая неявного субъекта явным.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сохраняет параллельное приглашение наблюдать небесные дела и светила. Архаизмы и конфессионально окрашенные термины избегаются; нормативный оттенок космического порядка сохранён.
