base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/020.yaml
  text: And the spirit of the dew has its dwelling at the ends of heaven[a], and it is joined with the storehouses of the rain; and its course is in winter and in summer, and its clouds and the clouds of the mist are joined together[d][c][b], and one gives to another.
translation:
  language: ru
  text: Жилище духа росы — у краёв неба, и он соединён с хранилищами дождя. Его путь[a] проходит зимой и летом; его облака соединены с облаками тумана[b], и одно даёт другому[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «его круг» или «его движение». Точный оттенок слова в этом описании небесных явлений неясен.'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «туман», может также означать дымку или мглу.
    reason: lexical_alternative
  - marker: c
    text: 'Последняя фраза допускает и взаимное понимание: «каждое даёт другому». Из текста не вполне ясно, какие именно из названных явлений имеются в виду.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መንፈሰ ጠል
  choice: дух росы
  rationale: Сохраняет олицетворённый апокалиптический образ; መንፈስ может означать также ветер или дыхание, но здесь «дух» лучше передаёт космологический регистр, не придавая выражению позднейшего догматического смысла.
- source_word: ማኅደሩ
  choice: обитает
  rationale: Форма указывает на место обитания или пребывания. Такой перевод сохраняет отличие от መዛግብት — «хранилища» — далее в том же стихе.
- source_word: በአጽናፈ ሰማይ
  choice: у краёв неба
  rationale: Передаёт древний образ пределов неба естественным и возвышенным современным русским языком.
- source_word: ድኁግ
  choice: соединён
  rationale: Передаёт значение связи или присоединения без излишнего уточнения характера этой связи.
- source_word: መዛግብተ ዝናም
  choice: хранилищами дождя
  rationale: Сохраняет характерный апокалиптический образ небесных хранилищ природных сил и лексически отличается от ማኅደር.
- source_word: ምሕዋረ
  choice: путь
  rationale: Слово может обозначать движение, путь или круговое прохождение; «путь» естественен по-русски и не устраняет исходную образную неопределённость.
- source_word: በክረምት ወበሐጋይ
  choice: зимой и летом
  rationale: Прямо и понятно передаёт сезонную пару, не заменяя её климатологическим толкованием «в дождливый и сухой сезоны».
- source_word: ደመና ጊሜ
  choice: облаками тумана
  rationale: Сохраняет повтор слова «облака» и передаёт неопределённое атмосферное явление ጊሜ как «туман».
- source_word: ኅቡር
  choice: соединены
  rationale: Передаёт состояние соединённости или совместности атмосферных явлений.
- source_word: አሐዱ ለአሐዱ ይሁብ
  choice: одно даёт другому
  rationale: Близко следует формулировке источника и сохраняет неясность относительно точных участников и взаимности передачи.
theological_decisions:
- issue: Следует ли понимать መንፈሰ как безличный ветер или как олицетворённый космический дух
  choice: олицетворённый «дух росы»
  alternative: «ветер росы» или «дыхание росы»
  rationale: Контекст небесных пределов и хранилищ природных явлений поддерживает апокалиптическое олицетворение. «Дух» сохраняет его, не отождествляя этот образ с какой-либо позднейшей богословской категорией.
