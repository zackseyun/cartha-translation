revisions:
- from: А когда дух дождя приходит в движение в своём хранилище, ангелы приходят, открывают хранилище и выводят его оттуда. Когда же он рассеивается над всей сушей[a], то соединяется с водой, которая на суше; и когда он соединяется — во всякое время — с водой, которая на суше…[b]
  to: А когда дух дождя приходит в движение из своего хранилища, ангелы приходят, открывают хранилище и выпускают его. Когда же он рассеивается по всей сухой земле[a], то соединяется с водой, которая на сухой земле; и когда он соединяется — во всякое время — с водой, которая на сухой земле…[b]
  rationale: Исправлены направление «из хранилища», явное значение «сухая земля» и не вполне естественный русский глагол при высвобождении дождя. Заключительный повтор, его синтаксическая неопределённость и обрыв текста сохранены; сноска привязана к многоточию и объясняет как повтор, так и осторожную альтернативу из аудиторского следа.
