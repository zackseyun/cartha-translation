base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/021.yaml
  text: And when the spirit of the rain is stirred from its storehouse[a], the angels come and open the storehouse and bring it out. And when it is scattered upon all the dry ground, it is joined with the water that is upon the dry ground; and whenever it is joined with the water upon the dry ground . [d][c][b]. .
translation:
  language: ru
  text: А когда дух дождя приходит в движение из своего хранилища, ангелы приходят, открывают хранилище и выпускают его. Когда же он рассеивается по всей сухой земле[a], то соединяется с водой, которая на сухой земле; и когда он соединяется — во всякое время — с водой, которая на сухой земле…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «засевается»; возможный перевод: «рассыпается». Глагол использует образ сеяния или разбрасывания.'
    reason: lexical_alternative
  - marker: b
    text: 'Заключительная фраза в геэзском тексте повторяет слова о соединении с водой на сухой земле и включает трудное выражение «во всякое время». Возможно также: «и всякий раз, соединяясь с водой на сухой земле, он остаётся там». Переданный текст после этого места обрывается.'
    reason: textual_variant
lexical_decisions:
- source_word: መንፈሱ ለዝናም
  choice: дух дождя
  rationale: Сохраняет многозначность መንፈስ («дух», «ветер», «дыхание») и персонифицированную космологическую образность текста, не сводя выражение к обычному метеорологическому явлению.
- source_word: ይትኃወስ
  choice: приходит в движение
  rationale: Передаёт значение движения или приведения в действие без излишне конкретного образа взбалтывания.
- source_word: መዝገበ
  choice: хранилище
  rationale: Естественно передаёт небесное вместилище природной силы; слово понятно современному читателю и сохраняет конкретность образа.
- source_word: ያወጽእዎ
  choice: выводят его оттуда
  rationale: Отражает каузативное значение «заставляют выйти / выводят» и сохраняет местоименную соотнесённость с «духом дождя».
- source_word: ይዘራእ
  choice: рассеивается
  rationale: Глагол буквально связан с сеянием и рассеиванием. В отношении дождя «рассеивается» звучит естественно и не устраняет присущий исходному слову образ распределения по земле.
- source_word: የብስ
  choice: суша
  rationale: Передаёт сухую землю в противопоставлении воде и избегает ненужного повторения прилагательного «сухой».
- source_word: ይትኃበር ምስለ ማይ
  choice: соединяется с водой
  rationale: Сохраняет возвратно-пассивное значение соединения, не уточняя его физический характер как смешение или слияние.
- source_word: በኵሉ ጊዜ
  choice: во всякое время
  rationale: Формально сохраняет временное выражение исходного текста; его синтаксическая связь в заключительной повторной фразе остаётся не вполне ясной.
theological_decisions:
- issue: Следует ли обезличить действие дождя и передать его языком современной метеорологии
  choice: Сохранены «дух дождя», небесное хранилище и действия ангелов
  alternative: Передать как высвобождение дождевой тучи или выпадение осадков
  rationale: Апокалиптическая космология стиха прямо связывает природное явление с духовной силой и служением ангелов. Перевод сохраняет эту картину мира, не превращая её в современное научное описание.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но понятной апокалиптической образностью. Повтор заключительной фразы и её синтаксическая напряжённость сохранены, а не сглажены предположительным толкованием; многоточие обозначает неполноту дошедшего текста.
