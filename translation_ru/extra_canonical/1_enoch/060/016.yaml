base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/016.yaml
  text: And the spirit of the sea is male and strong[a], and according to the might of its strength he holds it back with a rein[c][b], and thus it is driven out and scattered among all the mountains of the earth.
translation:
  language: ru
  text: И дух моря — мужского пола и силён[a]; по мощи силы моря[b] он удерживает море уздой[c], и затем оно выходит и рассеивается по всем горам земли.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ветер моря», «дыхание моря». Эфиопское слово может означать дух, ветер или дыхание; олицетворённый контекст поддерживает перевод «дух».'
    reason: lexical_alternative
  - marker: b
    text: То есть по мощи силы моря, а не духа. В эфиопском тексте местоименный суффикс имеет женский род и относится к слову «море»; в русском слово «море» — среднего рода.
    reason: grammar_note
  - marker: c
    text: Образ, по-видимому, изображает морскую силу, которую сдерживают уздой, а затем она выходит и рассеивается над горами — возможно, как туман, брызги или грозовые облака. Точный ход образа в сохранившемся эфиопском тексте не вполне ясен.
    reason: cultural_note
lexical_decisions:
- source_word: መንፈሰ፡ ባሕር
  choice: дух моря
  rationale: መንፈስ может означать дух, ветер или дыхание. В олицетворённом космологическом описании «дух» лучше сохраняет образ самостоятельной силы, не сводя его к погодному явлению.
- source_word: ተባዕታይ
  choice: мужеский
  rationale: Слово прямо указывает на мужской пол. «Мужеский» сохраняет необычное олицетворение и звучит уместно в возвышенном русском повествовании; «мужской» могло бы восприниматься лишь как указание на грамматический род.
- source_word: ዕኑፅ
  choice: сильный
  rationale: Передаёт значение силы и крепости без неоправданного усиления до «свирепый» или «могучий».
- source_word: ኃይለ ጽንዐታ
  choice: сообразно мощи его силы
  rationale: 'Сочетание двух существительных имеет усилительный характер. Местоимение относится к морю: суффикс в ጽንዐታ женского рода, как и последующие формы глаголов, относящиеся к морю. Русское «его» обусловлено средним родом слова «море».'
- source_word: በአንቍ ይገብእ
  choice: он удерживает море уздой
  rationale: Образ узды передаёт управление мощной силой как животным. Явное «море» устраняет неясность двух русских местоимений «он/оно», сохраняя различие между мужеским духом и морем.
- source_word: ትትነጻእ
  choice: оно выходит
  rationale: Форма допускает движение наружу, освобождение или изгнание. Нейтральное «выходит» сохраняет неопределённость механики образа и не усиливает насильственный оттенок без необходимости.
- source_word: ትዘራእ
  choice: рассеивается
  rationale: Глагол буквально связан с сеянием, но здесь обозначает распространение по пространству; «рассеивается» естественно передаёт этот образ применительно к морской силе, влаге или облакам.
- source_word: በአሉ አድባረ ምድር
  choice: по всем горам земли
  rationale: Передаёт широкое распространение по горам всего мира и сохраняет космический масштаб описания.
theological_decisions:
- issue: Олицетворение космической силы
  choice: Сохранить «дух моря» как мужеского и сильного деятеля
  alternative: Передать выражение безлично как «морской ветер» и считать указание на пол лишь грамматическим
  rationale: В тексте дух явно назван мужеским и соотнесён с глаголом мужского рода, тогда как море обозначено формами женского рода. Сохранение различия передаёт олицетворённый строй видения, не превращая его в обычное метеорологическое описание.
- issue: К кому относится сила
  choice: Отнести «его силы» к морю
  alternative: Отнести силу к духу моря
  rationale: Женский суффикс в ጽንዐታ и последующие женские глагольные формы указывают на море. В русском слово «море» среднего рода, поэтому употреблено «его», а сноска поясняет грамматическую связь.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Синтаксис сохраняет последовательность исходного текста, но явное «море» вместо местоимения делает различие референтов понятным. Необычное «мужеский» намеренно сохраняет прямое указание на пол и олицетворение.
