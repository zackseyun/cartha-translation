base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/017.yaml
  text: And the spirit of the hoarfrost is its own angel[c][b][a], and the spirit of the hail is a good angel.
translation:
  language: ru
  text: И дух инея сам себе ангел, а дух града — добрый ангел.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንፈሰ
  choice: дух
  rationale: Повторяющаяся конструкция обозначает олицетворённую природную силу; «дух» сохраняет апокалиптический образ.
- source_word: አስሐትያ
  choice: иней
  rationale: Слово понимается как название метеорологического явления — инея, а не как имя ангела.
- source_word: መልአክ
  choice: ангел
  rationale: В контексте небесных сил прямое значение «ангел» естественнее общего «вестник».
- source_word: ዚአሁ ውእቱ
  choice: сам себе
  rationale: 'Буквально формула выражает принадлежность: «он — его ангел»; по-русски «сам себе ангел» кратко передаёт рефлексивный смысл без превращения погодного термина в имя.'
- source_word: በረድ
  choice: град
  rationale: Обычное метеорологическое значение соответствует перечню природных явлений.
- source_word: ኄር
  choice: добрый
  rationale: Это прилагательное со значением «добрый, хороший», согласованное по смыслу со словом «ангел», а не собственное имя.
theological_decisions:
- issue: Отношение духов природных явлений к ангелам
  choice: 'Сохранить различие формулировок: дух инея сам себе ангел, тогда как дух града назван добрым ангелом.'
  alternative: Истолковать оба погодных термина как силы, имеющие отдельных названных ангелов.
  rationale: Геэзский текст не содержит здесь двух надёжно засвидетельствованных ангельских имён. Перевод сохраняет необычную и богословски напряжённую формулу, не выравнивая её в систему отдельных ангелов-управителей.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным строем. Необычное «сам себе ангел» намеренно сохраняет сжатость и неоднозначность исходной формулы.
