base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/001.yaml
  text: In the five-hundredth year, in the seventh month, on the fourteenth day of the month, in the life of Henok, in that parable I saw that the heaven of heavens was shaken with a great shaking, and the host of the Most High, and the angels, thousands of thousands and ten thousand times ten thousand, were stirred in a great turmoil.
translation:
  language: ru
  text: В пятисотый год, в седьмой месяц, в четырнадцатый день месяца, при жизни Еноха, в той притче я увидел, как небо небес[a] сотряслось великим сотрясением, а воинство Всевышнего[b] и ангелы — тысячи тысяч и десять тысяч по десять тысяч — пришли в великое смятение[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «высшее небо». Буквально в геэзском тексте: «небо небес» — превосходная формула, обозначающая высшую небесную область.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «сила Всевышнего». Однако последующее упоминание неисчислимого множества ангелов говорит в пользу значения «небесное воинство».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «были охвачены великим волнением».'
    reason: lexical_alternative
lexical_decisions:
- source_word: በዓመት ፭ምእት
  choice: В пятисотый год
  rationale: Передаёт датировку видения естественной русской порядковой формой.
- source_word: በወርኅ ሳብዕ ... አመ ዐሡሩ ወረቡዑ ለወርኅ
  choice: в седьмой месяц, в четырнадцатый день месяца
  rationale: Точно сохраняет обе календарные формулы и их торжественный повествовательный строй.
- source_word: በሕይወተ ሄኖክ
  choice: при жизни Еноха
  rationale: Сохраняет явное упоминание жизни Еноха, но звучит естественно в современном русском языке.
- source_word: በውእቱ አምሳል
  choice: в той притче
  rationale: «Притча» сохраняет термин, связанный с разделом Притч/Подобий, не сводя его просто к видению.
- source_word: ሰማየ ሰማያት
  choice: небо небес
  rationale: Буквально сохраняет превосходную космическую формулу оригинала; более гладкое «высшее небо» вынесено в примечание.
- source_word: ታድለቀልቅ ... ይልቅልቅ ዐቢይ
  choice: сотряслось великим сотрясением
  rationale: Сохраняет усилительную конструкцию с родственным существительным и прилагательное «великий», а также её риторический параллелизм с заключительной фразой.
- source_word: ኀይሉ ልዑል
  choice: воинство Всевышнего
  rationale: В непосредственном контексте неисчислимых ангелов коллективное значение «воинство» вероятнее абстрактного «сила».
- source_word: መላእክት አእላፈ አእላፍ ወትእልፊተ ትእልፊት
  choice: ангелы — тысячи тысяч и десять тысяч по десять тысяч
  rationale: Сохраняет повторяющуюся числовую формулу неисчислимого небесного множества без замены её менее прозрачным традиционным оборотом.
- source_word: ትሀውኩ ሁከተ ዐቢየ
  choice: пришли в великое смятение
  rationale: Передаёт сильное волнение и беспорядок естественной русской фразой, сохраняя определение «великое».
theological_decisions:
- issue: Обозначает ли ኀይሉ ልዑል отвлечённую силу Бога или принадлежащее Всевышнему небесное воинство
  choice: воинство Всевышнего
  alternative: сила Всевышнего
  rationale: Следующее упоминание ангелов в огромном числе поддерживает коллективное значение, однако возможное абстрактное прочтение отмечено в сноске.
- issue: Следует ли сгладить выражение ሰማየ ሰማያት до превосходной степени
  choice: небо небес
  alternative: высшее небо
  rationale: Буквальная формула сохраняет особый апокалиптический образ и не устраняет его выразительную многослойность.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Сохранены характерные повторы оригинала — «небо небес» и «сотряслось великим сотрясением», — поскольку они несут смысловое и риторическое усиление; синтаксис при этом сделан понятным обычному современному читателю.
