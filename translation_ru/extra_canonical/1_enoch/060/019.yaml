base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/019.yaml
  text: And the spirit of the mist is not joined with them in their storehouses[a], but its own storehouse is by itself; for its course is glorious in it, both in light and in darkness, and in winter and in summer[c][b], and its storehouse is an angel.
translation:
  language: ru
  text: И дух тумана не соединяется с ними в их хранилищах, но его собственное хранилище находится отдельно; ибо его путь славен и при свете, и во тьме, и зимой, и летом, а его хранилище — ангел[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительные слова буквально гласят: «его хранилище — ангел». Возможно, ангел здесь отождествляется с назначенным туману хранилищем или олицетворяет его; текст не говорит прямо, что ангел лишь хранит его или управляет им.'
    reason: textual_difficulty
lexical_decisions:
- source_word: መንፈሰ፡ ጊሜ
  choice: дух тумана
  rationale: መንፈስ допускает значения «дух», «ветер», «дыхание», но в олицетворённой апокалиптической космологии уместно сохранить «дух». ጊሜ означает туман или мглу, а не море.
- source_word: ኢይትኃበር፡ ምስሌሆሙ፡ ውስተ፡ መዛግብቲሆሙ
  choice: не соединяется с ними в их хранилищах
  rationale: Перевод сохраняет как идею неприсоединения, так и явно выраженное обстоятельство «в их хранилищах».
- source_word: መዝገበ፡ ቦቱ፡ ባሕቲቱ
  choice: его собственное хранилище находится отдельно
  rationale: «Хранилище» передаёт образ космического вместилища, а «собственное» и «отдельно» отражают усиленно выраженную обособленность.
- source_word: ምሕዋረ፡ ዚአሁ፡ ስብሐት፡ ቦ
  choice: путь его славен в нём
  rationale: «Путь» естественно передаёт движение или ход космической силы; «славен в нём» сохраняет трудную локативную конструкцию с ቦ, не устраняя неясность её отнесения.
- source_word: በብርሃን፡ ወበጽልመት፡ ወበክረምት፡ ወበንጋይ
  choice: и при свете, и во тьме, и зимой, и летом
  rationale: Повтор предлогов передаётся парными конструкциями. Последнее слово принимается как ошибочно переписанное или распознанное ሐጋይ, «лето», образующее обычную пару с «зимой».
- source_word: መዝገበ፡ ዚአሃ፡ መልአክ፡ ውእቱ
  choice: его хранилище — ангел
  rationale: Прямая и необычная именная конструкция сохранена без истолковывающих добавлений вроде «охраняется ангелом».
theological_decisions:
- issue: Следует ли понимать «дух тумана» как безличное природное явление
  choice: Сохранить олицетворённое выражение «дух тумана»
  alternative: ветер тумана; сила тумана
  rationale: Контекст описывает космические хранилища и ангельскую реальность; демифологизирующая передача неоправданно сгладила бы мировоззрение текста.
- issue: Как передать отождествление хранилища с ангелом
  choice: Оставить прямое выражение «его хранилище — ангел»
  alternative: его хранилищем управляет ангел; над его хранилищем поставлен ангел
  rationale: Хотя утверждение необычно и богословски напряжённо, именно его подсказывает наиболее прямая синтаксическая трактовка. Более гладкие варианты добавляют отсутствующее в источнике отношение управления.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Космологические образы и необычная логика исходного текста сохранены; спорные места не сглажены конфессиональным или рационализирующим толкованием.
