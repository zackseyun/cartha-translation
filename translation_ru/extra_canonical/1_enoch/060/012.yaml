base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/012.yaml
  text: And the treasuries of the spirits[a], and how the spirits are divided, and how they are weighed out, and the portals of the spirits are reckoned, each according to the power of the spirit, and their powers for the light of the moon, and according to the power of righteousness[c][b], and the divisions of the stars by their names—every division shall be apportioned.
translation:
  language: ru
  text: И хранилища духов[a], и то, как духи разделяются, и как они отмеряются, и то, как исчисляются врата духов — каждые сообразно силе духа; и силы их — для света луны; и сообразно силе праведности; и уделы звёзд по их именам — всякий удел будет распределён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Слово «духи» можно также понять как «ветры»: соответствующее слово на геэзе допускает оба значения. Синтаксис стиха труден; некоторые глаголы могут передавать также значения «измеряются», «отсчитываются» или «сосчитываются».'
    reason: лексическая и синтаксическая неоднозначность
lexical_decisions:
- source_word: መዛግብተ
  choice: хранилища
  rationale: Передаёт места хранения или запасы без излишне финансового оттенка слова «сокровищницы» и сохраняет космический образ.
- source_word: መንፈሳት
  choice: духи
  rationale: Сохраняет возможное наложение значений «духи» и «ветры», характерное для геэзского መንፈስ и апокалиптической космологии.
- source_word: አፎ
  choice: как
  rationale: В сочетании ወአፎ это вопросительное наречие «и как», продолжающее цепь косвенных вопросов; это не слово «облака».
- source_word: ይደሉ
  choice: отмеряются
  rationale: Нейтрально передаёт трудный глагол упорядоченного измерения или выделения долей, не сужая образ до буквального взвешивания.
- source_word: ይኄለቁ
  choice: исчисляются
  rationale: Сохраняет значение счёта и установленного космического порядка, а также возвышенный регистр.
- source_word: አናቅፅ
  choice: врата
  rationale: Передаёт множественное число от слова со значением «врата, порталы» и соответствует енохической космологической терминологии.
- source_word: በበኀይለ መንፈስ
  choice: каждые сообразно силе духа
  rationale: Повтор በበ имеет распределительный смысл «каждые сообразно», а «дух» сохраняет лексическую неоднозначность.
- source_word: ለብርሃነ ወርኅ
  choice: для света луны
  rationale: Близко следует генитивной конструкции и сохраняет космический образ.
- source_word: ኀይለ ጽድቅ
  choice: сила праведности
  rationale: «Праведность» сохраняет нравственно-богословскую широту ጽድቅ в контексте устроения космоса.
- source_word: ክፍላተ ከዋክብት
  choice: разделения звёзд
  rationale: Передаёт систему распределённых небесных разрядов и поддерживает повторяющуюся лексику деления.
- source_word: በበ ስሞሙ
  choice: по их именам
  rationale: Естественно передаёт классификацию звёзд согласно их именам.
theological_decisions:
- issue: Передавать ли መንፈሳት как «духи» или как «ветры»
  choice: духи
  alternative: ветры
  rationale: «Духи» не сводит космические силы к метеорологическим явлениям и сохраняет намеренную либо лексически обусловленную неоднозначность.
- issue: Передавать ли ጽድቅ как «праведность» или «справедливость»
  choice: праведность
  alternative: справедливость
  rationale: Здесь речь идёт о принципе космического порядка, а не только о судебной справедливости; «праведность» сохраняет более широкое богословское звучание.
translation_notes:
  register: Современный литературный русский язык с возвышенной апокалиптической интонацией. Сохранена цепь однородных конструкций исходного текста; тире помогает сделать длинный период читаемым, не устраняя его синтаксической напряжённости.
