  to: И хранилища духов[a], и то, как духи разделяются, и как они отмеряются, и то, как исчисляются врата духов — каждые сообразно силе духа; и силы их — для света луны; и сообразно силе праведности; и уделы звёзд по их именам — всякий удел будет распределён.
  rationale: Исправлена русская синтаксическая связь перечисления, чтобы «как» охватывало также исчисление врат. Заменено неестественное «разделения звёзд» на «уделы звёзд»; уточнён порядок слов в смежной трудной конструкции. Неоднозначность «духи/ветры» и неясность космического перечисления сохранены в тексте и примечании.
