base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/018.yaml
  text: And the spirit of the hail departed by the force of his might[a], and its spirit is by itself; and what goes up from it is like smoke[f][e][d][c][b], and its name is Frost.
translation:
  language: ru
  text: И дух града вышел силой его могущества[a], а дух в нём — сам по себе[b]; и то, что поднимается от него, подобно дыму, и имя ему — Мороз[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Неясно, к кому относится «его». Возможен также перевод: «из-за его силы» или «благодаря его могуществу».'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Возможны также переводы: «дух в нём — отдельно» или «дух в нём — в одиночестве».'
    reason: lexical_alternative
  - marker: c
    text: Последняя фраза может относить имя «Мороз» либо к тому, что поднимается подобно дыму, либо к названному перед этим духу.
    reason: referential_ambiguity
lexical_decisions:
- source_word: መንፈሰ ሐመዳ
  choice: дух града
  rationale: Сохраняет апокалиптическое представление о природной силе как о действующем духе; ሐመዳ в данном контексте передано как «град», а не обезличено до обычного метеорологического процесса.
- source_word: ሐደገ
  choice: вышел
  rationale: Конкретный глагол движения передаёт исход или появление, не уточняя сверх текста, идёт ли речь об отправлении или происхождении.
- source_word: በእንተ ኃይለ ዚአሁ
  choice: силою его мощи
  rationale: Передача сохраняет усиленное выражение силы и мужское местоимение исходного текста, не разрешая неясность его референта.
- source_word: መንፈሰ ቦቱ ባሕቲቱ
  choice: дух в нём пребывает сам по себе
  rationale: «Сам по себе» непосредственно передаёт значение отдельности или пребывания в одиночестве у ባሕቲቱ; добавленное «пребывает» делает безглагольную конструкцию естественной по-русски.
- source_word: ዘየዐርግ እምኔሁ
  choice: то, что поднимается от него
  rationale: Сохраняет относительную конструкцию, восходящее движение и неоднозначность местоименного референта.
- source_word: ከመ ጢስ
  choice: подобно дыму
  rationale: Сохраняет прямое и зримое сравнение исходного текста.
- source_word: ስሙ ደይክ
  choice: имя ему — Мороз
  rationale: Формула имени и олицетворение сохранены; «Мороз» естественно обозначает названную космическую силу и потому пишется с прописной буквы.
theological_decisions:
- issue: Следует ли обезличить духов метеорологических явлений
  choice: Сохранить слово «дух» и олицетворённое имя «Мороз»
  alternative: Передать их как обычные ветер, испарение или природный процесс
  rationale: Апокалиптический текст изображает силы природы как упорядоченные действующие реальности; обезличивание внесло бы современное натуралистическое истолкование.
- issue: К чему относятся мужские местоимения в стихе
  choice: Сохранить местоименную неоднозначность
  alternative: Однозначно отнести их к граду, духу или восходящему явлению
  rationale: Грамматика допускает более одного референта, поэтому перевод не должен молча устранять напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным апокалиптическим звучанием. Синтаксис близок к исходной последовательности образов; архаизмы и конфессионально окрашенные термины не вводятся.
