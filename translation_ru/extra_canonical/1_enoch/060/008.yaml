base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/008.yaml
  text: And the name of the male was Behemoth[a], who occupies with his breast an unseen wilderness named Dundayin, east of the garden, where the chosen and the righteous dwell, where my great-grandfather was taken up, the seventh from Adam[e][d][c][b], the first of men whom the Lord of Spirits made.
translation:
  language: ru
  text: А имя самца — Бегемот[d]; своей грудью он занимает невидимую пустыню[a] по имени Дундайин, к востоку от сада[b], где обитают избранные и праведные и куда был взят мой праотец[c], седьмой от Адама — первого из людей, которого сотворил Господь духов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пустыню, которая не видна». Выражение может также подразумевать скрытую или недоступную пустынную область; перевод «безлюдную пустыню» менее буквально передаёт эту фразу.'
    reason: textual_variant
  - marker: b
    text: В оригинале буквально сказано «сад»; название «Эдем» здесь прямо не употреблено.
    reason: lexical_alternative
  - marker: c
    text: 'Слово родства допускает более общее понимание: «мой предок». Точная степень родства и личность говорящего в этом контексте остаются предметом текстовой сложности.'
    reason: textual_variant
  - marker: d
    text: 'Возможный перевод начала стиха: «А имя второго — Бегемот».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወለተ ባዕታይ
  choice: А имя самца
  rationale: Передаёт противопоставление мужского существа ранее упомянутому женскому и сохраняет буквальное обозначение пола; возможное понимание как «второго» вынесено в примечание.
- source_word: ስሙ ብሔሞት
  choice: имя … Бегемот
  rationale: Собственное имя передано принятой русской библейской формой «Бегемот».
- source_word: ዘይአኅዝ በእንግድዓሁ
  choice: своей грудью он занимает
  rationale: Сохранён конкретный и необычный телесный образ оригинала; глагол передан в пространственном значении владения или занятия места.
- source_word: በበድው ዘኢያስተርኢ
  choice: невидимую пустыню
  rationale: Отрицательная относительная конструкция буквально указывает на то, что пустыня не видна; возможные оттенки недоступности или безлюдности отмечены в сноске.
- source_word: ዱንዳይን
  choice: Дундайин
  rationale: Название местности транслитерировано, а не переведено.
- source_word: በምሥራቀ ገነት
  choice: к востоку от сада
  rationale: Слово «сад» переведено буквально; название Эдем в оригинале здесь не употреблено.
- source_word: ኅሩያን ወጻድቃን
  choice: избранные и праведные
  rationale: Сохранены устойчивые апокалиптические обозначения без привнесения конфессиональной терминологии.
- source_word: ተመጠወ
  choice: был взят
  rationale: Нейтральная формулировка сохраняет идею удаления или принятия, не уточняя сверх текста способ и направление.
- source_word: እምኄውየ
  choice: мой праотец
  rationale: Русское «праотец» естественно обозначает отдалённого предка и не навязывает спорную точную степень родства.
- source_word: ሳብዕ እምአዳም
  choice: седьмой от Адама
  rationale: Сохранена традиционная генеалогическая формула.
- source_word: ቀዳሚሆሙ ለሰብእ ዘገብረ እግዚአ መናፍስት
  choice: первого из людей, которого сотворил Господь духов
  rationale: По ближайшему синтаксическому отнесению оборот характеризует Адама как первого человека; русское согласование делает эту связь ясной.
theological_decisions:
- issue: К кому относится выражение «первый из людей»
  choice: 'К Адаму: «от Адама — первого из людей»'
  alternative: К названному праотцу, седьмому от Адама
  rationale: Адам является ближайшим референтом и естественно назван первым из людей; отнесение титула к седьмому от Адама создало бы смысловое противоречие.
- issue: Личность говорящего и точная степень родства с взятым праотцем
  choice: 'Передать нейтрально: «мой праотец»'
  alternative: «мой прадед» или «мой дед»
  rationale: Местоименная форма указывает на предка говорящего, но контекстуальная идентификация говорящего и точная степень родства текстуально сложны; нейтральный русский термин сохраняет эту неопределённость.
- issue: Характер взятия праотца
  choice: «был взят»
  alternative: «был вознесён» или «был восхищен»
  rationale: Нейтральный глагол не привносит более определённой богословской концепции вознесения, чем выражено в данном стихе.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Необычный образ существа, занимающего пустыню грудью, намеренно сохранён. Пунктуация связывает определение «первого из людей» с Адамом, а не с названным праотцем.
