base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/004.yaml
  text: And Michael sent another angel from among the holy ones[a], and he lifted me up. And when he lifted me up, my spirit entered in[c][b], for I was not able to endure the sight of that power and its shaking and the quaking of heaven.
translation:
  language: ru
  text: И Михаил послал другого ангела из числа святых, и тот поднял меня. Когда же он поднял меня, дух мой возвратился[a], потому что я не мог вынести вида той силы, её смятения и содрогания неба[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Фраза в геэзском тексте трудна. «Дух мой возвратился» может означать, что Енох пришёл в себя; возможен и более буквальный, но неясный перевод: «дух мой вошёл».'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «вида той могучей силы, её потрясения (или смятения) и содрогания неба». Связь между «силой», «потрясением/смятением» и «небом» в исходной фразе выражена сжато.'
    reason: alternative_reading
lexical_decisions:
- source_word: ፈነወ
  choice: послал
  rationale: Глагол обозначает отправление; «послал» естественно и точно передаёт повествовательное действие.
- source_word: ካልአ መልአከ
  choice: другого ангела
  rationale: Речь идёт ещё об одном ангеле, отличном от Михаила; русский оборот естественнее буквального «второго ангела».
- source_word: እምቅዱሳን
  choice: из числа святых
  rationale: Предлог указывает на принадлежность к группе. В апокалиптическом контексте «святые» обозначают небесных существ; формулировка не подменяет это позднейшим церковным термином.
- source_word: አንሥአኒ
  choice: поднял меня
  rationale: Глагол передаёт движение вверх; «поднял меня» сохраняет пространственный образ и звучит естественно по-русски.
- source_word: መንፈስየ ገብአት
  choice: дух мой возвратился ко мне
  rationale: ገብአ означает «возвращаться, приходить обратно»; в контексте предшествующей утраты сил выражение естественно понимается как возвращение духа, то есть оживление или восстановление сознания. Местоимение «ко мне» эксплицирует русскую идиому, не меняя смысла.
- source_word: ኢክህልኩ ተዓግሦ
  choice: я не мог вынести
  rationale: Сочетание выражает неспособность выдержать увиденное; это ясный и современный русский эквивалент.
- source_word: ራእየ ዝኩ ኃይል
  choice: зрелища той силы
  rationale: ራእየ относится к увиденному, а ኃይል — к силе или мощи. «Зрелище той силы» сохраняет необычность исходного образа, не уточняя его референт.
- source_word: ሀውከ
  choice: произведённого ею потрясения
  rationale: Слово обозначает смятение, возмущение или потрясение. Связь с «силой» синтаксически сжата; местоименная конструкция даёт возможное прочтение, а неоднозначность отмечена в сноске.
- source_word: አንቀልቅለ ሰማይ
  choice: содрогания неба
  rationale: Выражение рисует космическое потрясение; «содрогание неба» сохраняет высокий апокалиптический образ.
theological_decisions:
- issue: Кого обозначают «святые»
  choice: небесные святые существа, из числа которых был послан ангел
  alternative: праведные люди или смешанное небесное собрание
  rationale: Непосредственный контекст говорит об ангеле, посланном Михаилом из их числа, поэтому небесное значение наиболее естественно; перевод не вводит слово «святые» в позднейшем конфессиональном смысле.
- issue: Значение слов «дух мой возвратился»
  choice: возвращение духа к Еноху после упадка сил
  alternative: дух вошёл; Енох перешёл в новое духовидческое состояние
  rationale: Лексическое различие между ገብአ «возвращаться» и ቦአ «входить» поддерживает значение возвращения. При этом сноска сохраняет возможную идиоматическую связь с приходом в сознание и не превращает её в догматическое утверждение.
- issue: Связь силы, потрясения и неба
  choice: потрясение произведено названной силой, наряду с содроганием неба
  alternative: вид той могущественной силы, её смятение и содрогание неба как три сжатых однородных элемента
  rationale: Синтаксис исходной фразы сжат и допускает разные способы группировки; основной текст выбирает связное русское чтение, а сноска прямо сообщает об альтернативе.
translation_notes:
  register: Современный литературный русский язык с dignified апокалиптическим звучанием. Порядок действий сохранён, архаизмы сведены к минимуму. Формы «дух мой» и «той силы» поддерживают высокий регистр, оставаясь понятными обычному читателю.
