base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/002.yaml
  text: And the Head of Days was sitting on the throne of his glory[a], and the angels and the righteous were standing around him.
translation:
  language: ru
  text: И Глава дней сидел на престоле своей славы[a], и ангелы и праведники стояли вокруг него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ветхий днями». Здесь эфиопский титул передан более буквально как «Глава дней», чтобы сохранить формулировку этого отрывка и не подменять её привычным выражением из книги Даниила.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ርእሰ መዋዕል
  choice: Глава дней
  rationale: Буквальная передача эфиопского титула сохраняет его особый образ и не подменяет его заранее знакомой формулировкой из книги Даниила.
- source_word: መንበረ ስብሐቲሁ
  choice: на престоле своей славы
  rationale: Сохраняет конструкцию исходного текста и возвышенный образ небесного престола; «престол» естественнее для апокалиптического контекста, чем нейтральное «сиденье».
- source_word: ይነብር
  choice: сидел
  rationale: В сцене небесного суда глагол обозначает пребывание на престоле; русское прошедшее несовершенного вида передаёт продолжающееся состояние.
- source_word: መላእክት
  choice: ангелы
  rationale: В контексте небесного окружения это наиболее точное и естественное значение.
- source_word: ጻድቃን
  choice: праведники
  rationale: Передаёт обозначение группы людей по их нравственно-религиозному статусу и естественно звучит по-русски.
- source_word: አውዶ
  choice: вокруг него
  rationale: Ясно передаёт окружающее положение ангелов и праведников относительно сидящего на престоле.
- source_word: ይቆውሙ
  choice: стояли
  rationale: Несовершенный вид согласуется со сценическим описанием «сидел» и передаёт продолжающуюся позу небесных служителей.
theological_decisions:
- issue: Передача божественного титула ርእሰ መዋዕል в связи с традицией книги Даниила
  choice: Глава дней
  alternative: Ветхий днями
  rationale: Основной текст следует буквальному образу эфиопского выражения и избегает преждевременного согласования со знакомым титулом из Дан 7; традиционный вариант сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но ясным апокалиптическим звучанием. Заглавная буква в слове «Глава» отмечает употребление выражения как титула; местоимения, относящиеся к Богу, не капитализируются, поскольку такой графической особенности нет в исходном тексте.
