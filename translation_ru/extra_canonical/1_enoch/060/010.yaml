base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/010.yaml
  text: And he said to me[a], “You, son of man[c][b], here you desire to understand what is hidden.”
translation:
  language: ru
  text: 'И он сказал мне: «Ты, сын человеческий[a], желаешь узнать здесь сокрытое[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «человек», «смертный». Здесь выражение «сын человеческий» служит обращением к провидцу и не обязательно обозначает возвышенную фигуру, называемую «Сыном Человеческим» в других местах Притч.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «понять сокрытое», «узнать то, что скрыто» или «узнать скрытое».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤለኒ
  choice: И он сказал мне
  rationale: Обычная повествовательная формула прямой речи; «сказал» естественно и точно передаёт глагол.
- source_word: አንተ
  choice: ты
  rationale: Самостоятельное местоимение подчёркивает адресата; русская конструкция сохраняет его перед обращением.
- source_word: ወልደ ሰብእ
  choice: сын человеческий
  rationale: Буквально сохраняет семитизированное обращение и апокалиптический регистр, не отождествляя адресата автоматически с возвышенной фигурой из других мест.
- source_word: በዝየ
  choice: здесь
  rationale: Сохраняет указание на место или непосредственную обстановку видения.
- source_word: ትፈቅድ
  choice: желаешь
  rationale: Передаёт волю или желание и соответствует достоинству стиля лучше, чем разговорное «хочешь».
- source_word: ታእምር
  choice: узнать
  rationale: В данном сочетании обозначает стремление обрести знание о сокрытом; «узнать» звучит естественнее по-русски, при этом возможное «понять» отмечено в сноске.
- source_word: ዘኅቡእ
  choice: сокрытое
  rationale: Передаёт относительную конструкцию без внесения более специального богословского термина «тайна».
theological_decisions:
- issue: Значение ወልደ ሰብእ в Притчах Еноха
  choice: сын человеческий
  alternative: человек; смертный
  rationale: Здесь это обращение к провидцу Еноху, а не обязательное обозначение возвышенной фигуры «Сына Человеческого» в других местах. Буквальный оборот сохраняет локальную формулировку и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Порядок слов сохраняет подчёркнутое «ты» и дейктическое «здесь», не воспроизводя неестественную для русского языка избыточность английского консультационного слоя.
