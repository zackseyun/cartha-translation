base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/011.yaml
  text: And another angel[a], who went with me and showed me what is hidden, told me what is first and what is last in heaven, in the height, and beneath the earth in the depth, and at the ends of heaven[c][b], and at the foundations of heaven.
translation:
  language: ru
  text: 'И другой ангел, который шёл со мной и показывал мне сокрытое, сказал мне, что́ является первым и что́ последним: на небе, в вышине, под землёй, в глубине, на краях неба и у оснований неба.[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «что́ предшествует и что́ следует» или «первое и последнее». Здесь выражение понято описательно, а не как титул.'
    reason: lexical_alternative
  - marker: b
    text: 'В дошедшей транскрипции слова «сокрытое» и «земля» искажены; перевод следует исправленному чтению: «показывал мне сокрытое» и «под землёй, в глубине». Последнее выражение можно передать также как «в пучине», но текст не обязательно обозначает именно бездну.'
    reason: textual_variant
lexical_decisions:
- source_word: ወይቤለኒ
  choice: рассказал мне
  rationale: Основной глагол речи управляет последующим перечислением; «рассказал» естественно передаёт сообщение о раскрываемых тайнах.
- source_word: መልአክ ካልእ
  choice: другой ангел
  rationale: ካልእ указывает на ещё одного ангела, не обязательно на «второго» по порядку.
- source_word: ዘምስሌየ የሐውር
  choice: который шёл со мной
  rationale: Сохраняется значение движения и роль ангела как спутника Еноха.
- source_word: ወዘኅቡእ ያርእየኒ (в транскрипции искажено как ወዘበኀቤኡ ያርእየኒ)
  choice: и показывал мне сокрытое
  rationale: Учитывается установленное исправление транскрипции; выражение обозначает скрытые вещи, показываемые провидцу.
- source_word: ቀዳሜ ወድኃሬ
  choice: что́ является первым и что́ последним
  rationale: Описательное прочтение сохраняет связь с перечнем космических пределов и не превращает выражение в богословский титул.
- source_word: በውስተ ላዕሉ
  choice: в вышине
  rationale: Передаёт верхнюю космическую область в естественном и возвышенном русском регистре.
- source_word: ወበታሕተ ምድር በመዓምቅ (ምድር искажено в транскрипции как ደብለ)
  choice: и под землёй — в глубине
  rationale: Следует восстановленному чтению «земля» и сохраняет пространственный параллелизм, не уточняя «глубину» как «бездну».
- source_word: በአጽናፈ ሰማይ
  choice: на краях неба
  rationale: Ясно и образно передаёт космические пределы.
- source_word: በመሠረተ ሰማይ
  choice: у оснований неба
  rationale: Сохраняет характерный для апокалиптической космологии архитектурный образ.
theological_decisions:
- issue: Следует ли понимать ቀዳሜ ወድኃሬ как титул «Первый и Последний»
  choice: что́ является первым и что́ последним
  alternative: первое и последнее / Первого и Последнего
  rationale: В данном контексте выражение входит в описание открываемых космических пределов, а не выступает явно как божественное самоименование. Описательный перевод не вносит позднейшей титульной трактовки.
