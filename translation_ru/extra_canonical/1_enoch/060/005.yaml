base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/005.yaml
  text: And Michael said to me[a], “Why are you troubled by such a vision? Until today the day of his mercy has lasted[c][b], and he has been merciful and slow to wrath toward those who dwell upon the dry land.”
translation:
  language: ru
  text: 'И Михаил сказал мне: «Почему ты встревожен таким видением?[a] До сего дня длился день Его милости, и Он был милостив и долготерпелив к тем, кто обитает на суше».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально конструкция близка к: «Почему из-за такого видения ты встревожен?»'
    reason: Синтаксис вопроса в геэз необычен; примечание сохраняет его форму, не принимая ርእየ за глагол.
  - marker: b
    text: «Суша» здесь может быть значима как противопоставление морю и связанным с ним образам в окружающем отрывке.
    reason: Контекстуальное значение более конкретного слова የብስ следует сохранить для читателя.
lexical_decisions:
- source_word: ወይቤለኒ፡ ሚካኤል
  choice: И Михаил сказал мне
  rationale: Естественная русская передача повествовательной формулы с сохранением имени и адресата.
- source_word: ምንተ፡ ርእየ፡ ዘከመዝ፡ ተሀውከ
  choice: Почему ты встревожен таким видением?
  rationale: ርእየ понимается как форма существительного «видение», а не как глагол «увидел»; перевод передаёт причинный вопрос и внутреннее смятение, не усиливая его до ужаса.
- source_word: እስከ፡ ዮም
  choice: До сего дня
  rationale: Сохраняет временную границу и возвышенный апокалиптический регистр.
- source_word: ሀለወት፡ ዕለተ፡ ምሕረቱ
  choice: длился день Его милости
  rationale: Передаёт продолжительность назначенного периода милости и сохраняет притяжательное местоимение.
- source_word: ወሀሎ፡ መሓሪ፡ ወርኁቀ፡ መዓት
  choice: и Он был милостив и долготерпелив
  rationale: «Долготерпелив» естественно передаёт буквальную идею удалённости от гнева; прошедшее время согласовано с продолжающимся до указанного момента периодом.
- source_word: ላዕለ፡ እለ፡ የኃድሩ፡ ዲበ፡ የብስ
  choice: к тем, кто обитает на суше
  rationale: «Суша» точнее общего «земля» и сохраняет контраст с морской образностью окружающего отрывка.
theological_decisions:
- issue: К кому относится местоимение в выражении «Его милости»
  choice: Сохранено «Его», подразумевающее Бога без добавления Его имени в текст.
  alternative: «день милости» без притяжательного местоимения
  rationale: Эфиопский текст содержит притяжательный элемент; контекст связывает милость и удерживаемый гнев с божественным правлением и судом.
- issue: Соотношение милости и грядущего гнева
  choice: Сохранены и милость, и долготерпение как временно продолжающиеся до обозначенного дня.
  alternative: Передать только неизменное качество Бога без временного оттенка
  rationale: Так не сглаживается эсхатологическое напряжение между нынешней милостью и предстоящим судом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. «До сего дня» и «долготерпелив» поддерживают достоинство стиля, оставаясь понятными; синтаксис прямой речи сделан естественным для современного читателя.
