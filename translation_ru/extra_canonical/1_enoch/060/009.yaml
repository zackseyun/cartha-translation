base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/009.yaml
  text: And I asked another angel that he should show me the power of those monsters[a], how they were separated on one day and were cast[d][c][b], one into the depths of the sea and one onto the dry land of the wilderness.
translation:
  language: ru
  text: 'И я попросил другого ангела показать мне силу тех чудовищ[a]: как они были разделены в один день и брошены — одно в морскую пучину, а другое на сухую землю, в пустыню[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В ближайшем контексте эти два существа названы точнее, однако в самом стихе они обозначены лишь как «те чудовища».
    reason: cross_reference
  - marker: b
    text: 'Конец стиха допускает буквальную передачу: «на сухую землю, в пустыню». Эфиопский текст противопоставляет морскую пучину сухой пустынной области.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእእክዎ
  choice: я попросил
  rationale: В контексте обращения к ангелу глагол передаёт просьбу показать; «попросил» естественно вводит зависимый инфинитив в современном русском языке.
- source_word: ካልእ መልአክ
  choice: другого ангела
  rationale: Прямо передаёт смену ангела-проводника, не уточняя без необходимости, что он был «вторым».
- source_word: ያርእየኒ
  choice: показать мне
  rationale: Инфинитив после «попросил» естественно выражает содержание просьбы и сохраняет направленность действия на рассказчика.
- source_word: ኃይሎሙ
  choice: силу
  rationale: Основное значение — «сила, мощь»; перевод не подменяет его более толковательным понятием «природа».
- source_word: እሉክ ዐናብርት
  choice: тех чудовищ
  rationale: Дальнее указательное местоимение передано словом «тех», а «чудовища» сохраняет необычный, космический характер существ.
- source_word: ተሌለዩ
  choice: были разделены
  rationale: 'Сохранён страдательный залог: существа не разделились сами, а были разделены.'
- source_word: በአሐቲ ዕለት
  choice: в один день
  rationale: Близко передаёт временное выражение, не решая, означает ли оно определённый день или совершение действия за одни сутки.
- source_word: ተወድዩ
  choice: брошены
  rationale: Форма относится к обоим существам и обозначает их принудительное помещение; множественное число сохранено в общей конструкции.
- source_word: በልጕተ ባሕር
  choice: в морскую пучину
  rationale: «Пучина» естественно и выразительно передаёт глубину моря, не превращая её в специальный космологический термин «бездна».
- source_word: በየብስ በድው
  choice: на сухую землю, в пустыню
  rationale: Переданы оба элемента трудной фразы — сухая земля и пустынная местность; приложение сохраняет некоторую неоднозначность их синтаксической связи.
theological_decisions:
- issue: Отождествление двух существ
  choice: В основном тексте они названы «теми чудовищами».
  alternative: Назвать их Левиафаном и Бегемотом по ближайшему контексту.
  rationale: В данном стихе имена отсутствуют; их внесение устранило бы локальную обобщённость исходного текста.
- issue: Значение ኃይሎሙ
  choice: «силу»
  alternative: «их мощь» или «их природу»
  rationale: «Сила» непосредственно отражает лексическое ядро слова и не разрешает богословско-космологический оттенок в пользу более толковательного варианта.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенной апокалиптической образностью. Двоеточие вводит пояснение того, что именно ангел должен показать; тире ясно распределяет два существа между морем и пустыней. Все местоименные и глагольные формы согласованы с данными текста: «тех» и общее множественное «брошены».'
