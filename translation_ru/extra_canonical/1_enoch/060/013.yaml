  source_fidelity: В черновике верно переданы основные образы грома, молнии и намеренно трудная последовательность. Однако притяжательные местоимения в двух местах необоснованно переведены единственным числом («его ударов», «его сдерживание»), тогда как эфиопская форма содержит суффикс множественного числа. Это существенная потеря грамматической неоднозначности источника.
  naturalness: Синтаксическая трудность уместно сохранена, поскольку сам стих фрагментарен и неясен. «Всякое разделение, разделяемое молнией» намеренно тяжеловесно, но лучше воспроизводит однокоренной повтор оригинала, чем более гладкая формулировка черновика.
  terminology: «Гром», «молния» и «сдерживание» приемлемы. «Сдерживание» оставлено как наименее интерпретирующий вариант для трудного ትዕግሥቶሙ; варианты «терпение» и «выдержка» следует сохранить в сноске. «Места их ударов» передаёт конкретный образ мест падения/удара и сохраняет множественность исходной формы.
