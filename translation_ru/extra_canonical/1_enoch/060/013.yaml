base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/013.yaml
  text: And the thunder[a], according to their places of striking, and for every division that is divided by the lightning, so that it may flash—and their restraint[d][c][b], so that they may hear quickly.
translation:
  language: ru
  text: И гром — по местам их ударов[a], и всякое разделение, разделяемое молнией[b], чтобы она сверкала, — и их сдерживание[c], чтобы они быстро услышали[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Эфиопское выражение связано с местами падения или удара; возможны переводы «в местах их падения» и, менее вероятно, «по их местам».
    reason: lexical_alternative
  - marker: b
    text: 'В источнике употреблены однокоренные слова: буквально «всякое разделение, которое разделяется». Необычный повтор сохранён.'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «их терпение», «их выдержка», «их удержание». Связь этого слова с предшествующей частью стиха и референт местоимения неясны.'
    reason: lexical_alternative
  - marker: d
    text: 'Буквально: «чтобы они быстро услышали». В семитском употреблении «слышать» может также подразумевать быстрый отклик или послушание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ነጐድጓድ
  choice: гром
  rationale: Существительное обозначает гром или громыхание; «гром» естественно сохраняет образ грозовой стихии без лишнего уточнения.
- source_word: በበመዳቃቲሆሙ
  choice: по местам его ударов
  rationale: Форма передаёт распределённость по соответствующим местам, а መዳቃ связано с местом падения или удара. Такой перевод сохраняет конкретный метеорологический образ.
- source_word: ኵሉ ክፍለ ዘይትከፈል
  choice: всякая часть, разделяемая
  rationale: Сохранена однокоренная конструкция источника, подчёркивающая упорядоченное разделение, хотя по-русски она звучит необычно.
- source_word: በመብረቅ
  choice: молнией
  rationale: 'Творительный падеж естественно выражает инструментальное значение: часть разделяется или обозначается молнией.'
- source_word: ከመ ይበርቅ
  choice: чтобы она сверкала
  rationale: Глагол родственен словам, обозначающим молнию и сияние; «сверкала» естественно соответствует грозовому контексту.
- source_word: ትዕግሥቶሙ
  choice: его сдерживание
  rationale: Слово допускает значения терпения, выдержки и сдерживания. В контексте управляемых стихий «сдерживание» лучше всего сохраняет представление об удерживаемой силе, не устраняя неясности.
- source_word: ፍጡነ ይስምዑ
  choice: они быстро услышали
  rationale: Основное значение глагола — «слышать, слушать»; буквальный смысл сохранён, а возможный оттенок быстрого отклика или послушания отмечен в сноске.
theological_decisions:
- issue: Следует ли истолковать неясную последовательность как послушание небесных или природных сил Божьему повелению
  choice: Сохранить конкретные образы грома, молнии, разделения, сдерживания и слышания без поясняющей вставки о Божьем повелении
  alternative: Передать последнюю часть как утверждение, что стихии немедленно повинуются Божьему приказу
  rationale: Эфиопский текст труден и не называет повеление прямо. Более истолковывающий перевод снял бы подлинную неоднозначность и внёс бы отсутствующее в строке уточнение.
translation_notes:
  register: Современный литературный русский с намеренно сохранённым синтаксическим напряжением трудного эфиопского текста. Лексика понятна широкому читателю; необычные повторы и неясные местоименные связи не сглажены истолковывающим пересказом.
