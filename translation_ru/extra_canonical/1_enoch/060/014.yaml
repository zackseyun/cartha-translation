base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/014.yaml
  text: For resting places have been given to the thunder with patience for the sound of its voice[a]; and the thunder and the lightning are not separated, and though they are not one[d][c][b], by the Spirit the two of them go together and are not separated.
translation:
  language: ru
  text: Ибо грому отведены места покоя, где он терпеливо ожидает звучания своего голоса[a]; гром и молния не разлучаются, и, хотя они не одно[c], оба движутся вместе духом[b] и не разлучаются.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с терпением для голоса его». Оборот труден; он, вероятно, говорит о том, что гром в терпеливом ожидании своего звучания пребывает в назначенных ему местах покоя.'
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое как «духом», может также означать «дыханием» или «ветром». Оно может обозначать невидимую силу, благодаря которой гром и молния движутся вместе; не исключается и указание на божественное действие.
    reason: lexical_alternative
  - marker: c
    text: Фраза «хотя они не одно» в данном текстовом свидетельстве не вполне ясна. Вероятно, смысл в том, что гром и молния остаются различными, но движутся вместе и не разлучаются.
    reason: textual_variant
lexical_decisions:
- source_word: እስመ
  choice: ибо
  rationale: Сохраняет пояснительную связь с предыдущим высказыванием, не усиливая причинность.
- source_word: ለነጐድጓድ ምዕረፋተ ... ተውህበ
  choice: грому даны места покоя
  rationale: Передаёт дательный показатель при «громе», пассивный глагол «даны» и множественное число ምዕረፋተ.
- source_word: በትዕግሥት
  choice: с долготерпением
  rationale: Сохраняет трудный образ выдержки, терпения или сдерживания, не сводя его к одному толкованию.
- source_word: ለቃለ ዚአሁ
  choice: для звучания его голоса
  rationale: Передаёт ቃል как голос/звук и сохраняет олицетворённый образ грома.
- source_word: ወኢይትሌለዩ
  choice: не разлучаются
  rationale: Одинаковый перевод в обоих вхождениях сохраняет риторический повтор и образ тесно связанных сил.
- source_word: ወእም፪ኒ
  choice: и хотя они не одно
  rationale: 'Осторожно передаёт текстуально трудную противоположность: гром и молния различны, но действуют нераздельно.'
- source_word: በመንፈስ
  choice: Духом
  rationale: Сохраняет возможность божественной действующей силы; более широкий диапазон «дух, дыхание, ветер» вынесен в примечание.
- source_word: ክልኤሆሙ የሐውሩ
  choice: оба движутся вместе
  rationale: Явно передаёт двойственность участников и их совместное движение.
theological_decisions:
- issue: Значение በመንፈስ в космологическом описании
  choice: Духом
  alternative: духом; дыханием; ветром
  rationale: Прописная буква оставляет открытой возможность божественного действия, а примечание сохраняет лексическую неоднозначность и не навязывает догматического отождествления.
- issue: Соотношение грома и молнии
  choice: хотя они не одно ... оба движутся вместе
  alternative: хотя их двое; и они не едины
  rationale: Сохраняет напряжение между различием и нераздельностью, не превращая поэтическое космологическое утверждение в доктринальную формулу.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным апокалиптическим звучанием. Сохранены олицетворение природных сил, повтор «не разлучаются» и подлинные лексические и текстовые неясности.
