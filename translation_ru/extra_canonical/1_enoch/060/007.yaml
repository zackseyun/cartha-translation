base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/007.yaml
  text: 'And on that day the two monsters were separated[a]: a female monster whose name is Lewyatan, to dwell in the abyss of the sea[d][c][b], above the springs of the waters.'
translation:
  language: ru
  text: 'И в тот день были разделены два чудовища: одно — чудовище женского пола по имени Леваятан[a], чтобы оно обитало в морской бездне[b], над источниками вод[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Традиционная русская форма этого имени — «Левиафан».
    reason: lexical_alternative
  - marker: b
    text: 'Или: «в глубине моря». Исходное слово обозначает глубокое, бездонное место.'
    reason: lexical_alternative
  - marker: c
    text: Выражение сохраняет древний космологический образ морской бездны, находящейся над источниками вод; это не современное географическое описание.
    reason: cultural_note
lexical_decisions:
- source_word: ተካፈሉ
  choice: были разделены
  rationale: Перфект 3-го лица множественного числа передаёт совершившееся разделение. Пассивная формулировка сохраняет мотив установленного свыше космического порядка, не называя действующее лицо.
- source_word: በይእቲ ዕለት
  choice: в тот день
  rationale: Естественная русская передача апокалиптической временной формулы.
- source_word: ክልኤቱ ዐናብርት
  choice: два чудовища
  rationale: Слово «чудовища» передаёт необычайный, первозданно-космический характер существ и не сводит их к обычным животным.
- source_word: ዐንበሪ አንስትያዊት
  choice: одно — чудовище женского пола
  rationale: Сохранены и существительное, обозначающее чудовище, и прямое указание на пол; «одно» ясно связывает его с парой существ.
- source_word: ዘስማ ሌዋያታን
  choice: имя которого Леваятан
  rationale: Имя транслитерировано с учётом формы геэз; привычная русская форма приведена в примечании.
- source_word: ከመ ትኅድር
  choice: чтобы оно обитало
  rationale: Передан целевой оттенок конструкции; местоимение устраняет синтаксическую неясность и согласуется со словом «чудовище».
- source_word: በልጕተ ባሕር
  choice: в морской бездне
  rationale: «Бездна» сохраняет апокалиптическую силу образа глубинной области моря; возможная более нейтральная передача отмечена в примечании.
- source_word: መልዕልተ አነቅዕተ ማያት
  choice: над источниками вод
  rationale: Дословно сохраняется древняя космологическая картина расположенных внизу источников или родников вод.
theological_decisions:
- issue: Характер двух первозданных существ в апокалиптической космологии
  choice: два чудовища
  alternative: два зверя / два существа
  rationale: Выбранный вариант сохраняет необычность и мифопоэтический масштаб образа, не навязывая позднейшего догматического толкования.
- issue: Время разделения чудовищ
  choice: были разделены
  alternative: будут разделены
  rationale: Форма геэз является перфектом и представляет разделение как совершившееся событие; будущее время вносило бы отсутствующий в исходном тексте временной сдвиг.
- issue: Передача имени морского чудовища
  choice: Леваятан
  alternative: Левиафан
  rationale: Основной текст следует форме имени в свидетельстве геэз, а традиционная русская библейская форма указана в примечании для узнаваемости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис оставлен близким к исходной последовательности, но местоимение «оно» добавлено ради естественности и ясности по-русски. Образность древней космологии не осовременена.
