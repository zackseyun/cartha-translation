base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/003.yaml
  text: And as for me[a], a great trembling seized me, and fear took hold of me; and my loins were broken, and my kidneys were loosened[d][c][b], and I fell on my face.
translation:
  language: ru
  text: А меня охватила сильная дрожь, и страх овладел мной; чресла мои были сокрушены, и почки мои расслабились[a], и я пал ниц[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально говорится о почках. В древней семитской телесной образности почки могли обозначать глубочайшие чувства и внутреннее существо человека.
    reason: cultural_note
  - marker: b
    text: 'Эфиопская форма глагола буквально стоит во множественном числе: «и они пали». По контексту выражение обычно понимают как падение самого Еноха лицом вниз.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ረዓድ ዐቢይ
  choice: сильная дрожь
  rationale: Передаёт интенсивную телесную дрожь в видении; «сильная» естественнее по-русски, чем буквальное «великая», и сохраняет усиление.
- source_word: ነሥአኒ
  choice: охватила меня
  rationale: При подлежащем «дрожь» глагол обозначает внезапно овладевшее говорящим состояние; русское «охватила» естественно сохраняет эту силу.
- source_word: ፍርሃት አሐዘኒ
  choice: страх овладел мной
  rationale: Сохраняет конкретный образ страха, который захватывает человека, не сводя выражение к простому «я испугался».
- source_word: ሐቌየ ተቀጽዐ
  choice: чресла мои были сокрушены
  rationale: ተቀጽዐ означает «быть разбитым, сокрушённым»; перевод не смешивает этот глагол со следующим ተፈትሑ. «Чресла» сохраняет древний телесный образ и возвышенный регистр.
- source_word: ኵልያትየ ተፈትሑ
  choice: почки мои расслабились
  rationale: Существительное буквально означает почки, а ተፈትሑ — «развязались, ослабли, расслабились». Перевод сохраняет конкретный древний образ, не подменяя почки сердцем или внутренностями.
- source_word: ወወደቁ በገጽየ
  choice: и я пал ниц
  rationale: В последовательности реакций говорящего выражение естественно понимается как его падение лицом вниз; «пал ниц» кратко и достойно передаёт позу полного повержения.
theological_decisions:
- issue: Сохранять ли буквальное упоминание почек как средоточия внутреннего переживания
  choice: Оставить «почки» в основном тексте и пояснить древнюю телесную образность в сноске
  alternative: Передать как «внутренности мои ослабли» или «сердце моё растаяло»
  rationale: Замена на «сердце» устранила бы непривычный, но подлинный образ источника и внесла бы современную антропологическую интерпретацию.
- issue: Как передать грамматическую неоднозначность заключительного глагола во множественном числе
  choice: В основном тексте — «я пал ниц», с указанием буквальной формы в сноске
  alternative: «И они пали на моё лицо»
  rationale: Контекст последовательно описывает состояние Еноха, а формула падения ниц хорошо соответствует сцене; однако множественное число эфиопского глагола нельзя скрывать, поэтому оно отмечено в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной интонацией. Архаизирующее «чресла» сохранено как узнаваемый термин древней телесной образности; остальной синтаксис сделан ясным и естественным. Необычные образы источника не сглажены.
