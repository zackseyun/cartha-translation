base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/015.yaml
  text: For when the lightning flashes[a], the thunder gives its voice, and the spirit rests at its appointed time, and it divides equally among them; for the treasury of their times is of sand, and the two of them are restrained with a bridle and turned back by the power of the spirit[d][c][b], and they are driven on likewise according to the many regions of the earth.
translation:
  language: ru
  text: Ибо когда сверкает молния, гром подаёт свой голос, а дух[a] покоится в назначенное ему время и поровну распределяет между ними[b]; ведь сокровищница их времён — из песка[c]. Обоих сдерживают уздой и обращают вспять силой духа[a]; и подобным образом их гонят вперёд по многим областям земли[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В обоих случаях слово, переведённое как «дух», может также означать «ветер» или «дыхание»; грозовой контекст допускает перевод «ветер».
    reason: lexical_alternative
  - marker: b
    text: 'Смысл оборота не вполне ясен; возможно также: «распределяет между ними», без уточнения «поровну».'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «сокровищница их времён есть из песка». Образ в данном месте остаётся неясным.'
    reason: textual_difficulty
  - marker: d
    text: Заключительный оборот эфиопского текста труден; «области» можно также понимать как «части» или «стороны» земли.
    reason: textual_difficulty
lexical_decisions:
- source_word: ይበርቅ መብረቅ
  choice: сверкает молния
  rationale: Сохраняет глагольно-именное сочетание оригинала и живой образ вспышки молнии.
- source_word: ነጐድጓድ ቃሎ ይሁብ
  choice: гром подаёт свой голос
  rationale: Передаёт конкретную персонифицирующую идиому, не сводя её к простому «гремит».
- source_word: መንፈስ
  choice: дух
  rationale: Слово может означать дух, ветер или дыхание. Основной текст сохраняет более широкое космологическое значение, а метеорологическое прочтение отмечено в сноске.
- source_word: በጊዜሃ ያዐርፍ
  choice: покоится в назначенное ему время
  rationale: Передаёт и состояние покоя, и упорядоченность космических явлений во времени.
- source_word: ዐሩየ ይከፍል ማእከሎሙ
  choice: поровну распределяет между ними
  rationale: Глагол обозначает разделение или распределение; наречие «поровну» передаёт вероятный смысл ዐሩየ, при сохранении более осторожной альтернативы в сноске.
- source_word: መዝገበ ጊዜያቲሆሙ ዘኆጻ ውእቱ
  choice: сокровищница их времён — из песка
  rationale: Сохраняет конкретный апокалиптический образ сокровищницы и исправленное значение ዘኆጻ «из песка», не заменяя его толкованием «установлена».
- source_word: ፪፪እምኔሆሙ በአጓም ይትነኃዙ
  choice: обоих сдерживают уздой
  rationale: Передаёт указание на двух субъектов, пассивное удерживание и образ узды естественным русским выражением.
- source_word: ወይትመየጡ በኃይለ መንፈስ
  choice: обращают вспять силой духа
  rationale: Точно передаёт движение назад и сохраняет повторное многозначное መንፈስ.
- source_word: ወይትነጸኡ
  choice: их гонят вперёд
  rationale: Передаёт значение побуждения или движения вперёд; не смешивает этот корень с глаголом очищения.
- source_word: ብዙኃ አድዋስ ምድር
  choice: по многим областям земли
  rationale: «Области» естественно передаёт значение регионов или частей земли, не вводя неподтверждённые «обиталища».
theological_decisions:
- issue: Следует ли переводить መንፈስ как «ветер» или «дух»
  choice: дух
  alternative: ветер; дыхание
  rationale: Контекст грозы допускает «ветер», однако слово наделено действием и силой в рамках апокалиптической космологии. Основной текст сохраняет «дух», а сноска удерживает метеорологическую возможность, не разрешая неоднозначность догматически.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной, апокалиптической образностью. Персонификация грома и конкретные образы сокровищницы, песка и узды сохранены; неясности оригинала не сглажены толкованием.
