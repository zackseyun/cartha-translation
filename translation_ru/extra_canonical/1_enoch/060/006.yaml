base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/006.yaml
  text: And when the day and the power and the punishment and the judgment come, which the Lord of Spirits has prepared for those who do not bow down to the righteous law, and for those who deny the righteous judgment, and for those who take his name in vain—that day has been prepared for the chosen as a covenant, and for sinners as an inquiry.
translation:
  language: ru
  text: И когда придут день, сила, кара и суд, которые Господь духов приготовил для тех, кто не поклоняется Господу праведности, кто отвергает Господа праведности и кто произносит Его имя всуе, — тот день приготовлен для избранных как клятва[a], а для грешников — как разбирательство[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как присяга»; в некоторых переводах: «как завет».'
    reason: Отмечает диапазон передачи መሐላ и распространённый альтернативный перевод.
  - marker: b
    text: 'Или: «как расследование» или «как дознание»; буквальный смысл связан с исследованием и разбирательством.'
    reason: Передаёт судебно-исследовательский диапазон ሐተታ, не навязывая конкретную процессуальную форму.
lexical_decisions:
- source_word: እግዚአ፡ መንፈሳት
  choice: Господь духов
  rationale: Буквально и последовательно передаёт устойчивый енохический титул.
- source_word: እግዚ፡ ጽድቅ
  choice: Господь праведности
  rationale: Сохраняет естественное для геэзского текста сочетание существительных и параллелизм двух придаточных; не заменяет титул толкованиями «праведный закон» и «праведный суд».
- source_word: ይነሥኡ፡ ስሞ፡ በከ
  choice: произносит Его имя всуе
  rationale: Передаёт идиоматический смысл буквального «берёт/принимает Его имя напрасно» естественным библейским русским выражением.
- source_word: መሐላ
  choice: клятва
  rationale: Основное значение слова — «клятва, присяга»; оно предпочтительнее более интерпретирующего «завет».
- source_word: ሐተታ
  choice: испытание
  rationale: Сохраняет судебно-проверочный оттенок слова («исследование, дознание, испытание»), не сужая его до конкретной процессуальной формы.
theological_decisions:
- issue: Референт выражения እግዚ፡ ጽድቅ
  choice: Господь праведности
  alternative: праведный закон / праведный суд
  rationale: В обеих параллельных строках непосредственно присутствует እግዚ («Господь»). Перевод абстрактными понятиями устранил бы личный титул без достаточного основания в исходном тексте.
- issue: Значение дня для избранных
  choice: как клятва
  alternative: как завет
  rationale: 'Сохранено прямое лексическое значение መሐላ и напряжение образа: приготовленный день сам характеризуется как клятва, без догматического уточнения её содержания.'
- issue: Значение дня для грешников
  choice: как испытание
  alternative: как расследование / дознание
  rationale: Нейтральное «испытание» сохраняет возможность как судебной проверки, так и более общего испытующего разбирательства.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Параллельная трёхчастная конструкция сохранена; архаизм «всуе» оставлен как краткое и узнаваемое обозначение напрасного или недостойного употребления имени.
