base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/003/001.yaml
  text: Observe and see all the trees[a], how they appear withered, and all their leaves stripped off—except fourteen trees, which do not lose their leaves, but remain from the old until the new comes[c][b], through two and three winters.
translation:
  language: ru
  text: Взгляните на все деревья и посмотрите, как они кажутся засохшими и как вся их листва опала, кроме четырнадцати деревьев, которые не теряют листьев, но остаются от старого до прихода нового[a] в течение двух и трёх зим[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «от старого до прихода нового» неполно по форме; вероятно, имеется в виду переход от старого времени года или года к новому.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «в течение двух и трёх зим». Смысл трудного выражения не вполне ясен; оно может означать «две или три зимы» либо указывать на повторяющиеся зимние сезоны до обновления.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ጠይቁ፡ ወርእዩ
  choice: Рассмотрите … и увидьте
  rationale: Два повелительных глагола переданы как призыв внимательно наблюдать. В данном контексте ጠይቁ имеет значение «рассмотрите, понаблюдайте», а не буквальное «спросите».
- source_word: ኵሎ፡ ዕፀወ
  choice: все деревья
  rationale: Естественная передача собирательного множественного числа.
- source_word: እፎ፡ ያስተርእዩ፡ ከመ፡ ይቡስ
  choice: как они кажутся засохшими
  rationale: Сохранены и значение видимого состояния, и образ высохшей растительности; እፎ передано как «как», а не «ли».
- source_word: ወኵሉ፡ አቍጽሊሆሙ፡ ንጉፍ
  choice: и как вся их листва опала
  rationale: Русское «листва опала» ясно и естественно выражает обнажённость деревьев; «листва» передаёт совокупность листьев.
- source_word: ዘእንበለ፡ ፲ወ፬ ዕፀወ
  choice: кроме четырнадцати деревьев
  rationale: Прямо сохраняет исключение из общего наблюдения.
- source_word: ዘኢይትነገፉ
  choice: которые не теряют листьев
  rationale: Сохраняет словесную связь с предшествующим описанием опавшей листвы и звучит по-русски естественно.
- source_word: እላ፡ ይጸንሑ
  choice: но остаются
  rationale: Передаёт противопоставление и продолжающееся состояние исключительных деревьев.
- source_word: እምብሉይ፡ እስከ፡ ይመጽእ፡ ኃዲስ
  choice: от старого до прихода нового
  rationale: Сохранена эллиптичность прилагательных «старое» и «новое» без внесения в основной текст уточнения о годе или сезоне.
- source_word: እምክልኤ፡ ወእም፡ ፫ ክረምት
  choice: две или три зимы
  rationale: Передаёт вероятный идиоматический смысл трудного сочетания как неопределённую продолжительность в две либо три зимы; неоднозначность отмечена в сноске.
theological_decisions:
- issue: Следует ли раскрывать символическое значение деревьев и времён года в основном тексте
  choice: Оставить прямое описание деревьев и сезонных перемен
  alternative: Истолковать деревья как образы людей, духовных порядков или иных апокалиптических реалий
  rationale: Геэзский текст непосредственно говорит о наблюдении за природой. Символическое толкование здесь не выражено явно и потому не внесено в перевод.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического наставления. Синтаксис остаётся наблюдательным и образным; эллипсис и трудная временная формула не сглажены без пояснения.
