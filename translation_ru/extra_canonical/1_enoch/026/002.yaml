base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/026/002.yaml
  text: And there I saw a holy mountain[a], and beneath the mountain water from the east, and its flow toward the north.
translation:
  language: ru
  text: И там я увидел святую гору, а под горой — воду с востока[a], и течение её — к северу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «воду с востока»; следующая фраза уточняет, что её течение направлено к северу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ደብረ
  choice: гора
  rationale: Обычное значение — гора или возвышенность; «гора» естественно передаёт топографию видения.
- source_word: ቅዱሰ
  choice: святая
  rationale: Сохраняет значение освящённости и богословскую весомость образа, не ослабляя его до общего «священная».
- source_word: መትሕተ ደብር
  choice: под горой
  rationale: Прямое и сжатое пространственное соответствие, не добавляющее отсутствующего в источнике указания на подножие.
- source_word: ማይ
  choice: вода
  rationale: Источник называет именно воду; перевод не вводит более конкретное «ручей» или «река».
- source_word: እመንገለ ጽባሕ
  choice: с востока
  rationale: Передаёт направление от востока, буквально связанное также со стороной восхода солнца.
- source_word: ውሕዘቱ
  choice: течение её
  rationale: Выражает движение или русло названной воды, не превращая её в отдельный водный объект.
- source_word: መንገለ ሰሜን
  choice: к северу
  rationale: Естественно передаёт северное направление течения.
theological_decisions:
- issue: Передача ቅዱሰ богословски окрашенным словом
  choice: святая гора
  alternative: священная гора
  rationale: «Святая» сохраняет присущий апокалиптической географии смысл особой освящённости и не сводит его лишь к культовой характеристике.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Эллиптическая конструкция «и течение её — к северу» сохраняет отсутствие явного глагола в геэзском тексте; необычное «воду с востока» оставлено ради исходной формулировки и пояснено сноской.
