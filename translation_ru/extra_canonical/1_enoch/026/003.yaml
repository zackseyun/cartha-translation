base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/026/003.yaml
  text: And I saw another mountain toward the east[a], higher than this one; and between them was a deep ravine, but not wide[d][c][b], and water was flowing in it toward the mountain.
translation:
  language: ru
  text: И я увидел к востоку другую гору, более высокую, чем эта[a]. Между ними было глубокое, но неширокое ущелье, и в нём текла вода по направлению к горе[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможны также переводы: «длиннее этой», «больше этой» или «протяжённее этой».'
    reason: lexical_alternative
  - marker: b
    text: Заключительная фраза трудна. Наиболее прямо текст говорит, что вода находилась в ущелье и двигалась «к горе».
    reason: textual_difficulty
lexical_decisions:
- source_word: መንገለ ጽባሕ
  choice: к востоку
  rationale: ጽባሕ обозначает утро, рассвет и, как направление, восток. «К востоку» точно передаёт направление, не добавляя необоснованного значения «северо-восток».
- source_word: ካልአ ደብረ
  choice: другую гору
  rationale: ካልአ указывает на другой или второй предмет; в последовательном описании видения естественно по-русски звучит «другую гору».
- source_word: ዘይነውኅ እምዝ
  choice: более высокую, чем эта
  rationale: Глагол может выражать длину, протяжённость или величину, но при сопоставлении гор наиболее вероятна высота. Неоднозначность отмечена в сноске.
- source_word: ማእከሎሙ
  choice: между ними
  rationale: Форма с местоименным суффиксом множественного числа указывает на пространство между двумя горами.
- source_word: ቈላ ዕሙቀ
  choice: глубокое ущелье
  rationale: Сочетание обозначает глубокое понижение местности. «Ущелье» сохраняет конкретность и выразительность апокалиптического ландшафта.
- source_word: አልቦ ርሐበ
  choice: но неширокое
  rationale: 'Буквально: «не было ширины». Слитное «неширокое» естественно передаёт характеристику ущелья, не усиливая её до «узкого».'
- source_word: ቦቱኒ ማይ የሐውር
  choice: и в нём текла вода
  rationale: Текст помещает воду в ущелье и говорит о её движении; применительно к воде естественным русским соответствием служит «текла».
- source_word: መንገለ ደብር
  choice: по направлению к горе
  rationale: Фраза буквально указывает движение к горе. Несколько необычное пространственное отношение сохранено, а не исправлено догадкой.
theological_decisions:
- issue: Конкретность топографии видения
  choice: Сохранить гору, ущелье и текущую воду как конкретные детали увиденного ландшафта
  alternative: Истолковать или обобщить эти образы непосредственно в переводе
  rationale: Текст описывает видение посредством конкретных пространственных образов; возможное символическое значение не следует вносить в сам перевод.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанно возвышенное. Сохранены конкретные детали видения и необычность последней пространственной формулировки без конфессионального или символического истолкования.
