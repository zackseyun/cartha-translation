  yaml_path: translation/extra_canonical/1_enoch/026/004.yaml
  text: And to the west of this was another[b][a],
translation:
  language: ru
  text: И к западу от этого было другое[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В тексте на геэзе не сказано прямо, что именно названо «другим»; по контексту речь может идти об одном из объектов видения, но существительное здесь отсутствует.
    reason: alternative_reading
lexical_decisions:
- source_word: መንገለ
  choice: к
  rationale: Здесь слово употреблено как предлог направления и положения — «к, со стороны»; в сочетании с обозначением запада естественно передаётся по-русски конструкцией «к западу от».
- source_word: ዐረቡ
  choice: западу
  rationale: Слово обозначает запад; форма дательного падежа обусловлена русской конструкцией «к западу от».
- source_word: ለዝ
  choice: от этого
  rationale: В данном сочетании указывает на пространственное отношение к ранее названному объекту; русское «от этого» естественно выражает смысл «к западу от этого».
- source_word: ካልእ
  choice: другое
  rationale: Субстантивированное «другое» сохраняет эллипсис исходного текста и не добавляет отсутствующее существительное, например «гора».
theological_decisions:
- issue: Неуказанный референт в описании видения
  choice: Сохранить субстантивированное «другое», не восполняя существительное.
  alternative: «другая гора» или «другое место»
  rationale: В данном фрагменте геэзского текста существительное не названо. Хотя контекст может подразумевать гору или иной объект видения, его добавление устранило бы подлинную неоднозначность источника.
translation_notes:
  register: Современный литературный русский язык; краткая и несколько эллиптическая структура оригинала сохранена. Формула «к западу от этого» передаёт пространственное отношение естественно и без устаревшей лексики.
