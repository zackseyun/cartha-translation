base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/026/001.yaml
  text: And from there I went to the middle of the earth[a], and I saw a blessed place, shaded[c][b], in which there were trees with abiding and sprouting branches from a tree that had been cut down.
translation:
  language: ru
  text: Оттуда я пошёл к середине земли[a] и увидел благословенное, тенистое место[b], где были деревья с ветвями, которые оставались живыми и пускали побеги от срубленного дерева[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «к центру земли». В контексте видения выражение, вероятно, имеет космико-географический смысл.'
    reason: lexical_alternative
  - marker: b
    text: Чтение «тенистое» в эфиопском тексте не вполне надёжно. Возможно, соответствующее слово относится не к месту, а к следующим ветвям.
    reason: textual_variant
  - marker: c
    text: Заключительная ботаническая фраза трудна. Вероятно, речь идёт о ветвях или побегах, продолжавших расти от срубленного дерева, но их точное отношение к упомянутым деревьям остаётся неясным.
    reason: textual_variant
lexical_decisions:
- source_word: ማእከለ ምድር
  choice: к середине земли
  rationale: Сохраняет пространственно-космический образ видения, не сужая значение до отдельной местности и не усиливая его более отвлечённым словом «центр».
- source_word: መካነ ቡሩከ
  choice: благословенное место
  rationale: Прямо передаёт место, отмеченное благословением, не отождествляя его в основном тексте с раем или Эдемом.
- source_word: ጥሉለ
  choice: покрытое тенью
  rationale: Передаёт конкретный образ тенистого, укрытого места; чтение в источнике отмечено скобками и потому снабжено примечанием.
- source_word: ዕፀወ / አዕፁቀ
  choice: деревья с ветвями
  rationale: Сохраняет оба ботанических элемента эфиопского текста — деревья и ветви, не устраняя первый из них и не превращая их без необходимости в один объект.
- source_word: ዘይነብር ወይሠርፅ
  choice: которые сохранялись и пускали побеги
  rationale: Первый глагол выражает продолжение или сохранение, второй — прорастание и появление новой поросли; русская формулировка передаёт образ продолжающейся жизни.
- source_word: እምዕፅ ዘተመተረ
  choice: от срубленного дерева
  rationale: Сохраняет вероятную связь новой поросли с уже срубленным деревом, одновременно оставляя в примечании текстовую и синтаксическую трудность.
theological_decisions:
- issue: Обычное описание местности или символическая священная география
  choice: 'Сохранить конкретную географию видения: «середина земли» и «благословенное место».'
  alternative: Прямо назвать это место раем или Эдемом либо свести описание к обычной плодородной местности.
  rationale: Сам стих наделяет место священными оттенками, но не называет его раем или Эдемом; перевод не разрешает эту смысловую напряжённость за текст.
translation_notes:
  register: Современный литературный русский язык с достоинством повествования о видении. Синтаксис оставлен достаточно прозрачным для обычного читателя; необычность образа не сглажена за счёт догматического или аллегорического толкования.
