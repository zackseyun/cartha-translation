base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/004.yaml
  text: And there I saw something like an invisible cloud[a], for because of its depth I was unable to look upon it; and I saw a flame of fire burning gloriously[d][c][b], and something like glorious mountains was circling and moving this way and that way.
translation:
  language: ru
  text: И там я увидел нечто подобное невидимому облаку; из-за его глубины я не мог его рассмотреть[a]. И я увидел пламя огня, ярко пылавшее; образы, подобные величественным горам, кружились и двигались то в одну, то в другую сторону[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Это место текстуально трудно. Возможен иной смысл: «ибо из его глубины я мог смотреть выше его пределов (или видимого облика)».'
    reason: textual_variant
  - marker: b
    text: 'Или: «кружились и колебались из стороны в сторону». В эфиопском тексте оба глагола стоят во множественном числе и могут непосредственно относиться к образам, подобным величественным горам.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ በህየ
  choice: там я увидел
  rationale: Передаёт обычную формулу рассказа о видении и сохраняет указание на место.
- source_word: ከመ ደመና ዘኢይትረአይ
  choice: нечто подобное невидимому облаку
  rationale: ከመ выражает уподобление, а относительная конструкция буквально описывает облако как «не видимое»; парадокс видимого видящим невидимого облака сохранён.
- source_word: እምዕሙቁ
  choice: из-за его глубины
  rationale: Передаёт представление о глубине облака; причинное значение определяется вводящим እስመ.
- source_word: አክሀልኩ †ላዕለ ነጽሮ†
  choice: я не мог его рассмотреть
  rationale: Контекстуально передаёт невозможность охватить облако взором, не выдавая повреждённое и трудное чтение за вполне ясное.
- source_word: ላህበ እሳት
  choice: пламя огня
  rationale: Сохраняет семитскую усилительную конструкцию, естественную для возвышенного апокалиптического регистра.
- source_word: እንዘ ይነድድ ስቡሕ
  choice: пылавшее во славе
  rationale: Передаёт длительное горение и слово со значением славы или великолепия, не сводя его лишь к физической яркости.
- source_word: ከመ አድባር ስቡሓን
  choice: нечто подобное величественным горам
  rationale: Сохраняет приблизительный характер видения и множественный образ гор; «величественным» естественно передаёт их славный, великолепный вид.
- source_word: ይትከበቡ ... ወይትሀወኩ ለፌ ወለፌ
  choice: кружилось и двигалось то в одну, то в другую сторону
  rationale: Передаёт круговое и повторяющееся разнонаправленное движение; грамматическая форма в источнике множественная, но собирательное русское «нечто» требует единственного числа.
theological_decisions:
- issue: Парадокс видимого «невидимого облака»
  choice: нечто подобное невидимому облаку
  alternative: нечто подобное облаку, которого нельзя было увидеть
  rationale: Формулировка сохраняет намеренное напряжение апокалиптического видения и не превращает образ в обычное облако.
- issue: Значение ስቡሕ при пламени
  choice: пылавшее во славе
  alternative: пылавшее великолепно / ярко
  rationale: «Во славе» удерживает возможный богословский оттенок славы наряду со зрительным великолепием, не ограничивая слово значением яркости.
translation_notes:
  register: Современный литературный русский язык с достойным апокалиптическим звучанием. Синтаксис слегка возвышенный, но понятный; сохранены зрительная приблизительность, парадокс образа и неуверенность повреждённого места.
