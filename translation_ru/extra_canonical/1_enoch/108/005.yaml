base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/005.yaml
  text: And I asked the two holy angels who were with me[a], and I said to him, “What is this glorious thing? For it is not heaven, but only a burning flame of fire[c][b], and the sound of weeping and crying out and lamentation and grievous pain.”
translation:
  language: ru
  text: 'И я спросил двух святых ангелов, которые были со мной, и сказал ему[a]: «Что это за славное явление[b]? Ведь это не небо, а лишь горящее пламя огня[c], и звук плача, криков и рыданий, и тяжкая боль».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В геэзском тексте стоит «сказал ему», хотя перед этим упомянуты два святых ангела. Возможно, Енох обращается к одному из них как к отвечающему за обоих; не исключена и текстовая неровность.
    reason: textual_variant
  - marker: b
    text: 'Возможно также: «Что это за славное место?» или «Что это за сияние?» Формулировка источника допускает несколько оттенков, а предмет вопроса в самом стихе ещё прямо не назван.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквальнее: «лишь пламя огня, которое горит». Повторность сохранена как черта апокалиптического образа.'
    reason: previous_rendering
lexical_decisions:
- source_word: ተስእልክዎ
  choice: я спросил
  rationale: Прямо и естественно передаёт вопрос Еноха к сопровождающим его ангелам.
- source_word: ፪አመላእክት ቅዱሳን
  choice: двух святых ангелов
  rationale: Сохраняет явно указанное число и обычное для апокалиптической речи определение «святые».
- source_word: እለ ምስሌየ
  choice: которые были со мной
  rationale: Естественно передаёт относительный оборот, обозначающий сопровождающих Еноха ангелов.
- source_word: እቤሎ
  choice: сказал ему
  rationale: Сохраняет единственное число местоименного дополнения в геэзском тексте, несмотря на предшествующее упоминание двух ангелов.
- source_word: ምንት ውእቱ ዝስቡሕ
  choice: Что это за славное явление?
  rationale: «Явление» оставляет предмет вопроса достаточно широким и в русском звучит естественнее буквального «славное нечто»; примечание сохраняет возможные оттенки места и сияния.
- source_word: አኮኑ ሰማየ
  choice: это не небо
  rationale: Сохраняет прямое противопоставление увиденного собственно небу.
- source_word: ላህበ እሳት ባሕቲቱ ዘይነድድ
  choice: лишь горящее пламя огня
  rationale: Передаёт как образ «пламени огня», так и выраженное в источнике горение, не сглаживая характерную апокалиптическую повторность.
- source_word: ቃለ ብካይ
  choice: звук плача
  rationale: В данном перечислении ቃለ естественно понимается как слышимый звук, а не как отвлечённый «голос».
- source_word: ጽራሕ
  choice: крики
  rationale: Передаёт усиленный вопль, не добавляя чрезмерно конкретного оттенка.
- source_word: አውያት
  choice: рыдания
  rationale: Сохраняет отличие от плача и криков и поддерживает накопление чувственных образов.
- source_word: ሕማም ኀያል
  choice: тяжкая боль
  rationale: Передаёт высокую степень страдания в достойном, но понятном современном регистре.
theological_decisions:
- issue: Следует ли обобщить описание как «мучение» или «наказание»
  choice: Сохранить конкретные образы огня, плача, криков, рыданий и боли
  alternative: Передать сцену обобщённо как место мучения или наказания
  rationale: Источник создаёт судебно-апокалиптическую атмосферу посредством последовательности чувственных образов, но в самом стихе не формулирует их отвлечённое богословское толкование.
