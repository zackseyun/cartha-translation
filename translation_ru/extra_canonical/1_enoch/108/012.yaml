base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/012.yaml
  text: And I will bring out into bright light those who loved my holy name[c][b][a], and I will seat each one on the throne of his glory.
translation:
  language: ru
  text: И Я выведу на яркий свет тех, кто возлюбил Моё святое имя[a], и каждого посажу на престол его славы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «Я выведу их на яркий свет ради тех, кто возлюбил Моё святое имя». Однако вероятнее, что оборот «тех, кто…» поясняет прямое дополнение, уже выраженное местоименным суффиксом глагола.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «на престол его славы». Местоимение, вероятнее всего, относится к каждому из названных людей. Возможны также понимания: «на престол Его славы» или «на славный престол».'
    reason: alternative_reading
lexical_decisions:
- source_word: እወፅኦሙ
  choice: Я выведу
  rationale: Каузативная форма обозначает выведение людей из прежнего состояния; «выведу» естественно передаёт направленное движение.
- source_word: በብሩህ ብርሃን
  choice: к яркому свету
  rationale: Сочетание родственных слов усиливает образ сияния; предлог «к» согласуется с глаголом движения, не устраняя возможного локативного оттенка.
- source_word: ለእለ አፍቀርዎ ለስምየ ቅዱስ
  choice: тех, кто возлюбил Моё святое имя
  rationale: Наиболее вероятно, что конструкция с ለ вводит вынесенное вперёд прямое дополнение, соотносящееся с объектным суффиксом глагола. «Возлюбил» сохраняет торжественный и заветный оттенок любви к Божьему имени.
- source_word: አነብር
  choice: посажу
  rationale: В контексте престола глагол означает усаживание или возведение на место, а не просто поселение.
- source_word: አሐደ አሐደ
  choice: каждого
  rationale: 'Повторение имеет дистрибутивное значение: речь идёт о каждом человеке отдельно.'
- source_word: መንበረ ክብር ዚአሁ
  choice: на престол его славы
  rationale: «Престол» уместен в апокалиптическом контексте; генитивная конструкция и местоимение третьего лица сохранены без превращения в прилагательное.
theological_decisions:
- issue: К кому относится местоимение «его» в выражении «престол его славы»
  choice: 'В основном тексте оно соотнесено с ближайшим дистрибутивным выражением «каждого»: каждому принадлежит престол его славы.'
  alternative: Местоимение может относиться к Богу или иной прославленной фигуре; возможен также более общий перевод «славный престол».
  rationale: Третье лицо единственного числа естественно соотносится с предшествующим «каждого», тогда как говорящий о Себе Бог употребляет первое лицо. Однако краткость контекста не позволяет считать иной референс невозможным, поэтому неоднозначность отмечена.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Заглавные буквы в «Я», «Моё» указывают на божественного говорящего; в сноске сохранена референциальная неоднозначность конечного местоимения.
