base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/006.yaml
  text: 'And he said to me, “This is the place that you see: here the spirits of sinners and blasphemers and those who do evil will be cast, and those who twist everything that the Lord has spoken by the mouth of the prophets—all the things that are to be done.”'
translation:
  language: ru
  text: 'И он сказал мне: «Вот место, которое ты видишь. Сюда будут брошены духи грешников, хулителей, тех, кто творит зло, и тех, кто искажает всё сказанное Господом устами пророков — всё, что должно исполниться».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትወደዩ
  choice: будут брошены
  rationale: Передаёт пассивную форму и смысл насильственного низвержения в это место.
- source_word: ጽኁፋን
  choice: хулителей
  rationale: В данном перечне осуждённых слово традиционно понимается как обозначение богохульников; выбор согласуется с контекстом, хотя лексема текстуально трудна.
- source_word: ይመይጡ
  choice: извращает
  rationale: Сохраняет идею искажения или превратного обращения со сказанным, не конкретизируя способ этого искажения.
- source_word: ይትገበር
  choice: должно исполниться
  rationale: Буквально связано с тем, что будет сделано/осуществлено; в контексте пророческих речений естественно передаётся как их исполнение.
theological_decisions:
- issue: Объект извращения и заключительная фраза
  choice: «всё сказанное Господом устами пророков, — всё, что должно исполниться»
  alternative: '«всё, что Господь сказал устами пророков, которые существовали: всё будет сделано»'
  rationale: Выбранный вариант сохраняет связь с пророческими словами и их будущим осуществлением, не вводя дополнительного догматического толкования; синтаксис геэзского текста допускает некоторую неоднозначность.
- issue: Обозначение Бога
  choice: Господом
  alternative: Владыкой
  rationale: «Господь» — естественный и устойчивый русский эквивалент እግዚእ в данном религиозном контексте, без добавления имени, отсутствующего в тексте.
