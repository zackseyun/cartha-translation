base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/011.yaml
  text: And now I will summon the spirits of the good ones from the generation of light, and I will transform those who were born in darkness[c][b][a], who in their flesh were not repaid with honor as their faith deserved.
translation:
  language: ru
  text: И ныне я призову духов добрых из поколения света и преображу[b] родившихся во тьме, которым во плоти своей не воздали чести, которой заслуживала их вера[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их верности». Геэзское слово может означать как веру, так и стойкую верность.'
    reason: lexical_alternative
  - marker: b
    text: 'Глагол труден для истолкования. Возможно также: «озарю» или «сделаю сияющими».'
    reason: textual_difficulty
lexical_decisions:
- source_word: እጼውዕ
  choice: призову
  rationale: Глагол означает зов или призыв; будущее время согласуется с формой несовершенного вида и эсхатологическим контекстом.
- source_word: መናፍስቲሆሙ ለኄራን
  choice: духов добрых
  rationale: 'Антиципирующий местоименный суффикс с последующим la- образует генитивную конструкцию: «духи добрых», а не «их духи — добрые». «Духи» сохраняет антропологическую неоднозначность.'
- source_word: እምትውልድ እንተ ብርሃን
  choice: из поколения света
  rationale: Сохраняет апокалиптический образ происхождения и принадлежности к свету, не конкретизируя его как родословную или эпоху.
- source_word: እዊልጥ
  choice: преображу
  rationale: Форма трудна для толкования; выбранное слово передаёт изменение участи родившихся во тьме, а более конкретный образ озарения отмечен в сноске.
- source_word: ተወልዱ በጽልመት
  choice: родившихся во тьме
  rationale: Прямо сохраняет противопоставление поколению света и символику тьмы.
- source_word: በሥጋሆሙ
  choice: во плоти своей
  rationale: Буквально сохраняет телесное измерение их земного существования и не заменяет «плоть» более толковательным выражением «при жизни».
- source_word: ኢተፈደዩ ክብር
  choice: не воздали почестью
  rationale: «Воздать» передаёт оттенок должного вознаграждения, а «почесть» — значение чести, не превращая его автоматически в богословски нагруженную «славу».
- source_word: ከመ ይደሉ ለሃይማኖቶሙ
  choice: подобавшей их вере
  rationale: Оборот выражает соответствие или должную меру; «вера» оставлена в основном тексте, а возможное значение верности указано в сноске.
theological_decisions:
- issue: Значение ሃይማኖት в этико-апокалиптическом контексте
  choice: вера
  alternative: верность
  rationale: Слово может обозначать как веру, так и стойкую верность. Основной текст не сужает его до нравственной заслуги, а лексическая альтернатива сохранена в сноске.
- issue: Соотношение «добрых из поколения света» и «родившихся во тьме»
  choice: Синтаксическая связь сохранена без явного отождествления или разделения этих групп
  alternative: Считать их либо одной группой в образе преображения, либо двумя различными группами
  rationale: Текст допускает напряжение между образами света и тьмы; перевод не вводит поясняющих местоимений или пунктуации, которые окончательно разрешили бы вопрос.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным апокалиптическим звучанием. Заглавное «Я» отражает речь небесного говорящего, не уточняя его личность. Конструкция «во плоти своей» намеренно сохраняет образность источника; порядок слов избегает ошибочного приложения «их духи — добрые».
