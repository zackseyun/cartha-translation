base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/010.yaml
  text: And I have spoken of all their blessings in the books, and he has rewarded them themselves, because these are found to love heaven more than their life in the world; and while they are trodden down by evil men, they hear from them abuse and reviling and are put to shame while blessing me.
translation:
  language: ru
  text: 'И обо всех их благословениях я рассказал в книгах, и Он воздал им самим[a], потому что оказалось: они любят небо больше, чем свою жизнь в этом мире[b]. И когда злые люди попирают их, они слышат от них оскорбления и поношения и терпят унижение, продолжая благословлять меня[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в конце трудной фразы упомянуты «их головы», что может означать их самих. Возможен также перевод: «и я назначил их для их глав (вождей)».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «их дыхание в мире»; «дыхание» здесь означает жизнь.'
    reason: lexical_alternative
  - marker: c
    text: В тексте стоит «меня». Вероятнее всего, речь по-прежнему ведёт Енох; необычное чтение сохранено без замены на «Бога» или «Господа».
    reason: textual_variant
lexical_decisions:
- source_word: ኵሎ በረከቶሙ
  choice: обо всех их благословениях
  rationale: Сохраняет множественное число и конкретный апокалиптический образ благ, предназначенных праведным, не заменяя его отвлечённым «блаженством».
- source_word: ነገርኩ በመጻሕፍት
  choice: я рассказал в книгах
  rationale: Передаёт первое лицо и множественное число «книги»; «рассказал» естественно выражает значение сообщения или повествования.
- source_word: ወዐሰዮሙ ለአርእስቲሆሙ
  choice: и Он воздал им самим
  rationale: Трудная фраза передана в соответствии с возможным значением воздаяния; буквально упомянутые «головы» могут служить усилительным обозначением самих людей. Неясность отмечена в сноске.
- source_word: ተረክቡ ያፈቅርዎ ለሰማይ
  choice: 'оказалось: они любят небо'
  rationale: «Оказалось» естественно передаёт пассивное «были найдены/оказались», а «небо» сохраняет прямой объект и апокалиптическую направленность выражения.
- source_word: እምእስትንፋሶሙ ዘበዓለም
  choice: больше, чем свою жизнь в этом мире
  rationale: Буквальное «дыхание» здесь метонимически означает жизнь; русский перевод передаёт идиому ясно, сохраняя противопоставление неба и земной жизни.
- source_word: ይትከየዱ እምእኩያን ሰብእ
  choice: злые люди попирают их
  rationale: Сохраняет яркий образ попрания и нравственную характеристику гонителей.
- source_word: ትዕይርተ ወጽርፈተ
  choice: оскорбления и поношения
  rationale: Передаёт парные существительные враждебной речи без привнесения более узкого значения «богохульство».
- source_word: ኀሥሡ
  choice: терпят унижение
  rationale: Учитывает исправленное чтение глагола со значением быть посрамлёнными или подвергаться унижению, а не прежнее понимание как простого терпения.
- source_word: እንዘ ይባርኩኒ
  choice: продолжая благословлять меня
  rationale: Сохраняет необычный объект первого лица и одновременность действия, не заменяя «меня» на Бога или Господа.
theological_decisions:
- issue: Кто подразумевается как действующее лицо в словах о воздаянии
  choice: Прописное «Он» указывает на Бога как на подразумеваемого субъекта.
  alternative: 'Понимать глагол в первом лице: «я назначил/расположил их для их глав (вождей)».'
  rationale: Форма и синтаксис трудны, однако контекст воздаяния праведным допускает подразумеваемого божественного субъекта. Альтернативное грамматическое понимание сохранено в сноске, а не исключено молча.
- issue: К кому относится «меня» в заключении
  choice: Сохранён непосредственный грамматический референт — говорящий Енох.
  alternative: Понимать «меня» как косвенное указание на Бога либо считать чтение повреждённым и переводить «Бога/Господа».
  rationale: Текст явно содержит объект первого лица; его богословская необычность не должна устраняться конъектурой без рукописного основания.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Синтаксис сделан ясным для обычного читателя, но буквальные образы «небо» и «попирают», а также трудное «меня» сохранены. Местоимение «Он» написано с прописной буквы как указание на подразумеваемого Бога.
