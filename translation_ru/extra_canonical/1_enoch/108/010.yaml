    rationale: В исходном тексте после союза стоит глагол 1-го лица; субъектом остаётся говорящий. Значение «воздал» и подразумеваемый Бог не следуют надёжно из трудной фразы и устраняют упоминание «голов/глав».
  - severity: medium
    issue: Сноска a утверждает, что «головы» могут означать «их самих»
    rationale: Такое толкование недостаточно обосновано и поддерживает не подтверждённый перевод «воздал им самим». Безопаснее отметить буквальное «для их голов/глав» и возможность понимания в значении вождей, не выдавая одну реконструкцию за смысл текста.
  - severity: low
    issue: '«потому что оказалось: они любят»'
    rationale: 'Пунктуационно и стилистически более плавно: «ибо оказалось, что они любят»; это сохраняет пассивно-выявительное значение.'
  revised_text: И обо всех их благословениях я рассказал в книгах и определил их для их глав[a], ибо оказалось, что они любят небо больше, чем свою жизнь в этом мире[b]. Когда злые люди попирают их, они слышат от них оскорбления и поношения и терпят позор, продолжая благословлять меня[c].
  revised_footnotes:
