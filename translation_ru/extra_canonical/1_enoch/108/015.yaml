base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/015.yaml
  text: And the sinners will cry out and see them while they shine[a], and they themselves will go to where the days and the times have been written down for them[e][d][c][b]. The vision of the hidden things of Enoch.
translation:
  language: ru
  text: И закричат грешники и увидят их, пока те сияют; сами же грешники пойдут туда, где для них записаны дни и сроки[a]. Видение сокровенных вещей Еноха[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Образ записанных для них дней и сроков подразумевает заранее установленное и внесённое в небесную запись время, но сам стих прямо не называет его временем суда.
    reason: cultural_note
  - marker: b
    text: 'Заключительная фраза, вероятно, служит заглавием или колофоном. Буквально: «Видение сокровенных вещей Еноха»; в ней нет слов «в» или «которое Енох увидел».'
    reason: textual_note
lexical_decisions:
- source_word: ወይጸርኁ
  choice: И возопиют
  rationale: Глагол обозначает громкий крик и может подразумевать плач; «возопиют» сохраняет силу апокалиптической сцены и достойный регистр.
- source_word: ወይሬእይዎሙ፡ ኃጥኣን
  choice: грешники и увидят их
  rationale: Сохраняется прямое значение глагола «видеть» и объектный суффикс множественного числа.
- source_word: እንዘ፡ ይትወሐውሑ
  choice: когда те будут сиять
  rationale: По контексту местоимение отнесено к тем, кого видят грешники; трудность формы и возможное значение беспокойного движения отмечены в сноске.
- source_word: ወየሐውሩ፡ እሙንቱሂ
  choice: сами же грешники пойдут
  rationale: «Пойдут» естественно передаёт глагол движения, а «сами же» — эмфатическое противопоставление. Повтор «грешники» устраняет неясность русского местоимения, не меняя референта.
- source_word: በኀበ
  choice: туда, где
  rationale: Оборот передаёт направление к месту назначения и звучит естественно по-русски.
- source_word: ተጽሕፉ፡ ሎሙ፡ መዋዕለ፡ ወእዝማን
  choice: где для них записаны дни и сроки
  rationale: Пассивная конструкция и датив сохранены; «записаны» передаёт мотив заранее внесённого небесного установления, а «сроки» — назначенные периоды времени.
- source_word: ራእየ፡ ኅቡኣት፡ ዘሄኖክ
  choice: Видение сокровенного Еноха
  rationale: 'Фраза передана как самостоятельное именное заглавие или колофон: в геэзском нет ни предлога «в», ни глагола «увидел». «Сокровенное» сохраняет собирательный смысл скрытых вещей и возвышенный регистр.'
theological_decisions:
- issue: Статус заключительной фразы ራእየ ኅቡኣት ዘሄኖክ
  choice: 'Самостоятельный колофон или заглавие: «Видение сокровенного Еноха»'
  alternative: Включить её в предыдущее предложение как обстоятельственный оборот о видении Еноха
  rationale: Геэзский текст представляет именную группу без предлога «в» и без глагола «увидел», поэтому самостоятельное оформление точнее грамматически; жанровая функция заглавия или колофона оставлена открытой.
- issue: Характер записанных дней и сроков
  choice: Не добавлять в основной текст слово «суд» или «назначенные»
  alternative: «назначенные им дни и сроки суда»
  rationale: Апокалиптический контекст допускает отнесение к суду, однако этих слов в данной фразе нет; богословское содержание не конкретизируется сверх источника.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной апокалиптической окраской. Архаизирующее «возопиют» сохранено ради силы сцены; остальной синтаксис сделан ясным для современного читателя. Неявные в источнике «суд» и «предназначенные» не внесены в основной текст.
