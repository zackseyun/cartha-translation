base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/009.yaml
  text: those who[a], from the time they came to be, did not desire the food that is on the earth, but regarded their souls as a passing breath, and kept this, and the Lord tested them greatly, and their spirits were found pure[c][b], so that they might bless his name.
translation:
  language: ru
  text: те, кто с тех пор как появились не желали земной пищи, но считали свои души мимолётным дыханием[a] и держались этого; и Господь подверг их великому испытанию, и духи их оказались чистыми, чтобы они благословляли Его имя.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «словно дух, который проходит» либо «словно проносящийся ветер»; слово መንፈስ может означать дух, ветер или дыхание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እምአመ ኮኑ
  choice: с самого своего появления
  rationale: Передаёт временное значение «с того времени, как они стали существовать», не вводя более конкретного представления о рождении.
- source_word: ኢፈተዉ
  choice: не желали
  rationale: Глагол выражает желание или расположение, а не просто отказ от действия.
- source_word: መብልዕተ ዘውስተ ምድር
  choice: пищи, которая на земле
  rationale: Сохраняет конкретное упоминание пищи и пространственный образ земли, не расширяя его до общего понятия мирских удовольствий.
- source_word: ረሰዩ ነፍሳቶሙ ከመ
  choice: считали свои души…
  rationale: ረሰየ с ከመ означает «считать, полагать чем-либо / уподоблять», а не «отдавать»; «души» сохраняет прямое соответствие ነፍሳቶሙ и его отличие от последующего «духи».
- source_word: መንፈስ እንተ ተሐልፍ
  choice: мимолётным дыханием
  rationale: В сравнении подчёркнута преходящесть; «дыхание» естественно выражает хрупкость образа, тогда как сноска сохраняет значения «дух» и «ветер».
- source_word: ዐቀቡ
  choice: держались этого
  rationale: Передаёт значение соблюдения или сохранения принятого образа жизни и звучит по-русски естественнее буквального «хранили это».
- source_word: ብዙኃ አመከሮሙ እግዚእ
  choice: Господь подверг их великому испытанию
  rationale: Сохраняет интенсивность испытания и ясную роль Господа как действующего лица.
- source_word: ተረክቡ መንፈሳቲሆሙ ንጹሕተ
  choice: духи их оказались чисты
  rationale: 'Передаёт результат проверки: после испытания их духи были признаны или обнаружены чистыми.'
- source_word: ከመ ይባርክዎ ለስሙ
  choice: чтобы они благословляли Его имя
  rationale: Сохраняет возможный оттенок цели или результата и традиционный библейский оборот.
theological_decisions:
- issue: Характер отказа от земной пищи
  choice: Сохранён конкретный образ нежелания земной пищи без уточнения формы аскезы.
  alternative: Понимать выражение обобщённо как отказ от мирских наслаждений либо конкретно как пост до угрозы жизни.
  rationale: Текст прямо называет пищу, но не определяет ни установившийся аскетический институт, ни мученическую смерть.
- issue: Связь души с мимолётным дыханием
  choice: Они «считали свои души мимолётным дыханием».
  alternative: «Считали свои жизни мимолётным дыханием» или «уподобили свои души проходящему духу/ветру».
  rationale: «Души» ближе к ነፍሳቶሙ и сохраняет напряжение с последующим упоминанием чистых духов; значение መንፈስ в сравнении остаётся неоднозначным и отмечено в сноске.
- issue: Цель или результат чистоты духов
  choice: «Чтобы они благословляли Его имя».
  alternative: «Так что они благословляли Его имя».
  rationale: Конструкция допускает целевой и результативный оттенки; русский союз «чтобы» сохраняет эту направленность, не уточняя её догматически.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Синтаксис сохраняет длинную последовательность исходного текста, но точка с запятой делает её понятнее. Прописное «Его» применено как традиционная русская форма почтительного местоимения в отношении Бога.
