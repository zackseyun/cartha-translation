base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/003.yaml
  text: But you[a], wait until sin passes away; for their names will be blotted out from the book of life and from the books of the holy ones, and their offspring will be destroyed forever. And their spirits will be slain, and they will cry out and lament in a desolate place that is unseen, and in burning fire[d][c][b]; for there is no earth there.
translation:
  language: ru
  text: Вы же ждите, пока не минует грех, потому что их имена будут изглажены из книги жизни и из книг святых, а их потомство погибнет навеки. Их духи будут умерщвлены; они будут кричать и стенать в пустынном, невидимом месте[a] и в пылающем огне, потому что там нет земли[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «которое не является [взору]»; возможно также: «которого не видно».'
    reason: lexical_alternative
  - marker: b
    text: Необычное выражение «там нет земли» передано буквально; вероятно, оно относится к описанию места наказания в видении.
    reason: cultural_note
lexical_decisions:
- source_word: ጽንሑ
  choice: ждите
  rationale: Форма — повелительное наклонение множественного числа от глагола «ждать, ожидать»; перевод также сохраняет повтор с предшествующим стихом и не смешивает этот глагол с близким по написанию «быть твёрдым».
- source_word: ተሐልፍ ኃጢአት
  choice: пока не минует грех
  rationale: Сохраняется образ прекращения или ухода греха, а не вводится более узкое понятие индивидуального прощения.
- source_word: ይደመስስ
  choice: будут изглажены
  rationale: В сочетании с именами в небесных книгах глагол обозначает стирание записи; «изглажены» передаёт книжно-судебный образ и остаётся понятным по-русски.
- source_word: እመጽሐፈ ሕይወት
  choice: из книги жизни
  rationale: Прямо и естественно передаёт устойчивый апокалиптический образ небесной записи.
- source_word: እመጻሕፍተ ቅዱሳን
  choice: из книг святых
  rationale: 'Сохранены множественное число «книг» и открытость родительного оборота: это могут быть книги, относящиеся к святым, без уточнения характера этой связи.'
- source_word: ዘርኦሙ ይትሐጐል ለዓለም
  choice: их потомство погибнет навеки
  rationale: «Потомство» ясно передаёт родовую линию, а «погибнет навеки» сохраняет окончательность суда.
- source_word: መንፈሳቲሆሙ ይትቀተሉ
  choice: их духи будут умерщвлены
  rationale: Сохранено именно «духи», а не «души»; пассивное «будут умерщвлены» передаёт насильственный характер глагола и не сглаживает напряжение с последующим плачем.
- source_word: ይጸርኁ ወየአውይዉ
  choice: будут кричать и стенать
  rationale: Парные глаголы передают громкий крик и мучительный плач; русский оборот звучит естественно и сохраняет эмоциональную силу.
- source_word: በመካነ ባድው
  choice: в пустынном месте
  rationale: Передаёт безлюдность и опустошённость места наказания без излишней конкретизации как географической пустыни.
- source_word: ዘኢያስተርኢ
  choice: невидимом
  rationale: Форма от глагола со значением «являться, быть видимым» описывает место как не являющееся взору, то есть невидимое; она не означает «которое нельзя показать».
- source_word: በእሳተ ነዱ
  choice: в пылающем огне
  rationale: Сохраняет усиленный образ горящего огня, но выражает его естественным современным русским языком.
- source_word: ኢሀሎ ህየ ምድር
  choice: там нет земли
  rationale: Необычный космический образ передан буквально; слово не сужено до «почвы» или «суши».
theological_decisions:
- issue: Небесные книги, из которых изглаживаются имена
  choice: Сохранены отдельно «книга жизни» и множественное «книги святых».
  alternative: Понимать второе выражение как священные писания либо как книги, принадлежащие святым.
  rationale: Контекст указывает на небесные записи суда и принадлежности, но грамматика не определяет точную связь книг со святыми; перевод не разрешает эту неоднозначность.
- issue: Характер участи духов
  choice: Одновременно сохранены умерщвление духов и их последующие крики и стенания.
  alternative: Истолковать всё как метафору полного уничтожения либо как систематическое описание сознательного посмертного наказания.
  rationale: Сам текст соединяет образы смерти, продолжающегося страдания, пустынного места и огня. Перевод не приводит их к позднейшей стройной доктрине и не устраняет внутреннее напряжение.
- issue: Значение фразы «там нет земли»
  choice: Фраза сохранена буквально как часть видения места наказания.
  alternative: Передать как «там нет почвы» или истолковать как указание на конкретную область мироздания.
  rationale: Необычность образа принадлежит исходному тексту; более точная космология из него не следует.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптической речи. Синтаксис сделан ясным для обычного читателя, но необычные образы и богословское напряжение исходного текста не сглажены. Термин «святые» употреблён без поздней конфессиональной конкретизации.
