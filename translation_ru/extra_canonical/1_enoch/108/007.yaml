base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/007.yaml
  text: For there are writings and records concerning them in heaven above[a], so that the angels may read them and know what will come upon the sinners, and upon the humble in spirit, and upon those who afflicted their bodies and received recompense from God[d][c][b], and those who were put to shame by evil men.
translation:
  language: ru
  text: Ибо о них в небесной вышине есть писания и записи[a], чтобы ангелы читали их и знали, что постигнет грешников, и смиренных духов[b], и тех, кто изнурял своё тело и получил воздаяние от Бога, и тех, кого унижали злые люди[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сочетание, переведённое как «писания и записи», не вполне ясно. Второе слово допускает иное понимание; значение небесных записей выбрано потому, что далее сказано, что ангелы их читают.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «смиренные духи»; возможно также понимание «смиренные души». Выражение не обязательно означает просто «смиренные духом».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «тех, кого злые люди поносили (презирали)».'
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Ибо
  rationale: Передаёт пояснительно-причинную связь с предшествующим высказыванием и сохраняет возвышенный, но понятный регистр.
- source_word: ጽሑፋን ወእኩያን
  choice: писания и записи
  rationale: Первое слово обозначает письменные тексты; значение второго в данном сочетании не вполне ясно, однако последующее чтение этих предметов ангелами поддерживает смысл небесных записей.
- source_word: ላዕለ በሰማይ
  choice: на небесах, в вышине
  rationale: Сохраняет обе пространственные составляющие выражения и естественно звучит в русском апокалиптическом повествовании.
- source_word: ከመ ይንብብዎሙ መላእክት
  choice: чтобы ангелы читали их
  rationale: Прямо передаёт целевое придаточное и множественное дополнение, относящееся к письменным свидетельствам.
- source_word: ዘሀሎ ይብጽሖሙ
  choice: что постигнет
  rationale: Русский глагол «постигнет» естественно выражает грядущее событие или удел, который выпадет названным группам.
- source_word: ለመናፍስት ትኁታን
  choice: смиренных духов
  rationale: Передаёт существительное во множественном числе с согласованным прилагательным, не превращая его без основания в отвлечённое качество «смиренные духом».
- source_word: እለ አሕመሙ ሥጋሆሙ
  choice: тех, кто изнурял своё тело
  rationale: Сохраняет суровый телесный смысл выражения, но не уточняет, было ли это добровольной аскезой или пережитым страданием.
- source_word: ወተፈድዩ በኀበ አምላክ
  choice: и получил воздаяние от Бога
  rationale: «Воздаяние» сохраняет судебно-компенсаторный оттенок и в данном окружении допускает подразумеваемое положительное оправдание или награду.
- source_word: እለ ኀሥሡ እምእኩያን ሰብእ
  choice: тех, кого унижали злые люди
  rationale: Передаёт страдательное положение названной группы и отрицательную характеристику людей, причинявших им позор или презрение.
theological_decisions:
- issue: Смысл небесных письменных предметов
  choice: Небесные писания и записи об участи людей, читаемые ангелами
  alternative: Второе существительное может быть связано со значением «зло», либо всё сочетание может обозначать более специальные книги суда или памяти
  rationale: Непосредственное упоминание чтения ангелами и знания грядущей участи сильнее всего поддерживает образ небесных письменных свидетельств, однако лексическая неясность отмечена в сноске.
- issue: Грамматический и эсхатологический статус смиренных
  choice: «смиренные духи» как существительное с определением
  alternative: «смиренные духом» или «смиренные души»
  rationale: Форма источника представляет множественное существительное «духи» и согласованное с ним прилагательное; буквальная структура сохраняет возможный эсхатологический смысл, не сводя выражение только к нравственному качеству живых людей.
- issue: Характер Божьего воздаяния
  choice: Контекстуально положительное воздаяние, без добавления слова «награда»
  alternative: Нейтральная расплата либо наказание; специальная награда за аскетическое самоумерщвление
  rationale: Смиренные и униженные противопоставлены грешникам, поэтому контекст указывает на оправдание или награду, но слово «воздаяние» сохраняет широту исходного судебного понятия и не вводит позднейшую аскетическую доктрину.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксический ряд исходного текста сохранён, но оформлен естественно для русского чтения; неоднозначные места не устранены догматическим перефразированием.
