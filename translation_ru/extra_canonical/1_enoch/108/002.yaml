base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/002.yaml
  text: You who have done good[a], wait for those days until those who do evil are brought to an end[c][b], and the power of the sinners comes to an end.
translation:
  language: ru
  text: Вы, творившие добро, ожидайте[a] тех дней, пока творящим зло не будет положен конец[b] и не придёт конец силе грешников[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «стойко держитесь», «претерпевайте». Глагол выражает терпеливую стойкость и ожидание.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «пока творящие зло не будут доведены до завершения (конца)»; речь идёт об их собственном конце, а не только о прекращении их злых дел.'
    reason: source_clarification
  - marker: c
    text: 'В оригинале здесь повторён тот же корень со значением завершения: конец постигает и творящих зло, и силу грешников.'
    reason: literary_structure
lexical_decisions:
- source_word: እለ ገበርክሙ ሠናየ
  choice: Вы, творившие добро
  rationale: Относительная конструкция обращена к людям, которых характеризуют добрые дела. «Творившие добро» естественно звучит по-русски и сохраняет противопоставление творящим зло.
- source_word: ትጸንሑ
  choice: ожидайте
  rationale: Глагол допускает значения ожидания, стойкости и терпеливого пребывания. В сочетании с указанием на будущие дни «ожидайте» передаёт эсхатологическую направленность, а альтернативный оттенок отмечен в сноске.
- source_word: ለእሉ መዋዕል
  choice: тех дней
  rationale: መዋዕል обозначает дни или времена; указательное определение сохранено, а русское управление согласовано с глаголом «ожидайте».
- source_word: እስከ ይትፌጸሙ እለ ይገብሩ እኩየ
  choice: пока творящим зло не будет положен конец
  rationale: Передаёт достижение завершения самими злодеями, а не прекращение ими злых дел. Безлично-пассивная русская конструкция сохраняет суровый судебный смысл, не уточняя способ их конца.
- source_word: ወይትፌጸም ኃይሎሙ ለመአብሳን
  choice: и не придёт конец силе грешников
  rationale: «Сила» передаёт ኃይል, «грешники» — религиозно-нравственное значение መአብሳን. Повтор слова «конец» отражает повтор корня завершения в оригинале.
theological_decisions:
- issue: Передача መአብሳን
  choice: грешников
  alternative: нечестивых
  rationale: Слово обозначает людей, отмеченных грехом или виной. «Грешники» сохраняет религиозно-нравственный регистр, тогда как предшествующая глагольная конструкция уже передана как «творящие зло».
- issue: Характер конца творящих зло
  choice: будет положен конец
  alternative: будут уничтожены
  rationale: Выбранная формулировка передаёт пассивное достижение конца, но не конкретизирует его как физическое уничтожение сверх того, что прямо выражено исходным глаголом.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным эсхатологическим звучанием. Параллелизм добра и зла, а также повтор мотива конца сохранены без конфессионального истолкования.
