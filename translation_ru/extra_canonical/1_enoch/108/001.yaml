base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/001.yaml
  text: Another book that Enoch wrote for his son Methuselah[a], and for those who will come after him and keep the ordinance in the latter days.
translation:
  language: ru
  text: Другая книга, которую Енох написал для своего сына Мафусала и для тех, кто придёт после него и будет соблюдать установление[a] в последние дни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «порядок», «устав» либо «предписанный путь». Геэзское слово может обозначать установленную норму, порядок или предписанный образ действий.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልእ
  choice: другая
  rationale: Слово вводит ещё одну книгу, отличную от предшествующего текста, не уточняя строго её порядковый номер.
- source_word: መጽሐፍ
  choice: книга
  rationale: Обычное значение слова и естественное обозначение письменного произведения в заголовочной формуле.
- source_word: ዘጸሐፈ
  choice: которую … написал
  rationale: Передаёт относительную конструкцию и прямое значение глагола, не добавляя оттенка литературного «сочинил».
- source_word: ለወልዱ ማቱሳላ
  choice: для своего сына Мафусала
  rationale: Предлог «для» естественно обозначает предполагаемого адресата книги; «Мафусал» соответствует принятой русской форме имени.
- source_word: ለእለ ይመጽኡ እምድኅሬሁ
  choice: для тех, кто придёт после него
  rationale: Сохраняет будущую направленность и личное местоименное соотнесение исходного текста, не заменяя людей более отвлечённым словом «поколения».
- source_word: የዓቅቡ
  choice: будет соблюдать
  rationale: В сочетании с нормативным установлением глагол естественно означает соблюдение; форма единственного числа согласуется в русском с конструкцией «тех, кто».
- source_word: ሥርዐተ
  choice: установление
  rationale: Передаёт нормативный характер понятия, но не сужает его до конкретного законодательного акта; смысловая широта отмечена в сноске.
- source_word: በደኃሪ መዋዕል
  choice: в последние дни
  rationale: Сохраняет апокалиптическое и эсхатологическое звучание формулы, естественное для контекста 1 Еноха.
theological_decisions:
- issue: Степень эсхатологической выраженности оборота በደኃሪ መዋዕል
  choice: в последние дни
  alternative: в позднейшие времена; в конце дней
  rationale: Выбранная формулировка сохраняет присущее книге апокалиптическое напряжение, но не связывает выражение с какой-либо поздней конфессиональной схемой.
- issue: Нормативный смысл слова ሥርዐተ
  choice: установление
  alternative: порядок; устав; предписанный путь
  rationale: «Установление» сохраняет возможность понимать слово как норму, порядок или предписанный образ действий, не превращая его однозначно ни в закон, ни в обряд.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным заголовочным звучанием. Синтаксис следует структуре геэзского текста, оставаясь естественным по-русски; традиционные формы имён сохранены.
