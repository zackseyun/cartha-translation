base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/013.yaml
  text: And they will shine in times without number[a], for the righteousness belongs to God[f][e][d][c][b]; for he will give faith to the faithful in the dwelling of the paths of uprightness.
translation:
  language: ru
  text: И они будут сиять во времена, которым нет числа[a], ибо суд Божий праведен[b]; ведь верным Он дарует веру[c] в обители путей праведности[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в неисчислимые века». Эфиопское выражение говорит о временах, не поддающихся счёту.'
    reason: lexical_alternative
  - marker: b
    text: В предоставленной транскрипции здесь стоит, по-видимому, ошибочное አነኒሁ; принято текстологически обоснованное чтение ኵነኔሁ — «его суд».
    reason: textual_variant
  - marker: c
    text: 'Или: «верность», «стойкость». Эфиопское слово может обозначать как веру, так и верность.'
    reason: lexical_alternative
  - marker: d
    text: Выражение сохраняет конкретный образ места, для которого характерны праведные пути; его можно также передать как «в жилище путей правоты».
    reason: cultural_note
lexical_decisions:
- source_word: ይትወሐውሑ
  choice: будут сиять
  rationale: В данном эсхатологическом контексте форма передаёт прославленное сияние праведных. Перевод сохраняет образ света и не заменяет его более общим «возрадуются».
- source_word: በእዝማን ዘአልቦ ኍልቈ
  choice: во времена, которым нет числа
  rationale: Буквально сохраняет сочетание времён с невозможностью их исчислить, не уточняя без необходимости, идёт ли речь именно о «веках».
- source_word: ጽድቅ ኵነኔሁ ለአምላክ
  choice: суд Божий праведен
  rationale: Принято текстологически обоснованное чтение ኵነኔሁ («его суд») вместо ошибочного አነኒሁ в предоставленной транскрипции. Конструкция утверждает праведность Божьего суда.
- source_word: ለመሃይምናን
  choice: верным
  rationale: Слово обозначает верующих или верных и образует намеренную однокоренную пару с ሃይማኖተ; значение «мудрым» здесь не поддерживается.
- source_word: ሃይማኖተ
  choice: веру
  rationale: Основное значение передано как «вера», а возможный оттенок верности и стойкости сохранён в примечании.
- source_word: በማኅደረ ፍናዋተ ርትዕ
  choice: в обители путей праведности
  rationale: Сохранён конкретный пространственный образ обители и множественное число метафорических путей, без сведения выражения к отвлечённому понятию.
theological_decisions:
- issue: Дар, который Бог даёт верным
  choice: «веру» с сохранением однокоренной связи «верным — веру»
  alternative: «верность» или «стойкость»
  rationale: Эфиопское существительное допускает значения веры и верности. Основной текст не устраняет эту напряжённость окончательно, а альтернативный этический оттенок отмечен в сноске.
- issue: Основание будущего состояния праведных
  choice: «суд Божий праведен»
  alternative: «праведность принадлежит Богу»
  rationale: Текстологическое исправление повреждённой транскрипции восстанавливает слово «его суд» и даёт связное утверждение о праведности Божьего суда; альтернативный перевод возник из OCR-ошибки и потому не вынесен в основной текст.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Синтаксис остаётся ясным для широкого читателя; образность оригинала («сиять», «обитель», «пути») сохранена без архаизации. Повтор «верным — веру» намеренно воспроизводит однокоренную связь в геэзском тексте.
