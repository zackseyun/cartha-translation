translation:
  language: ru
  text: Те, кто любит Бога, не возлюбили ни золота, ни серебра, никаких благ этого мира[b], но отдали свои тела[a] страданию.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Геэзское ሥጋ можно перевести как «плоть» или «тело». Здесь выбрано «тела», но речь по-прежнему подчёркнуто идёт о телесном страдании.
    reason: lexical_alternative
  - marker: b
    text: Выражение, переданное как «никаких благ этого мира», в данном текстовом свидетельстве выглядит не вполне ясным; вероятно, оно широко обозначает желанные блага мира.
    reason: textual_variant
lexical_decisions:
- source_word: እለ
  choice: те, кто
  rationale: Множественный относительный показатель вводит описываемую группу; оборот естественен для современного русского языка.
- source_word: ያፈቅርዎ ለአምላክ
  choice: любит Бога
  rationale: Форма от корня «любить» выражает преданность Богу; настоящее время сохраняет характер постоянной характеристики.
- source_word: ወኢወርቀ ወኢብሩረ አፍቀሩ
  choice: не возлюбили ни золота, ни серебра
  rationale: Повторное отрицание передано конструкцией «ни… ни…», а глагол «возлюбили» сохраняет смысловую связь и контраст с любовью к Богу.
- source_word: ወኢኵሎ ሠናየ ዘውስተ ዓለም
  choice: ни каких-либо благ этого мира
  rationale: Передаёт вероятный общий смысл отказа от привязанности к желанным земным благам, не устраняя текстуальную неясность выражения.
- source_word: አላ
  choice: но
  rationale: Сильный противительный союз противопоставляет любовь к мирским благам готовности страдать.
- source_word: ወሀቡ ሥጋሆሙ
  choice: отдали свои тела
  rationale: ሥጋ допускает значения «плоть» и «тело»; «тела» здесь ясно выражает телесный характер самоотдачи и страдания.
- source_word: ለጻዕር
  choice: страданию
  rationale: Слово обозначает тяготу, бедствие, мучение или тяжкий труд; «страдание» сохраняет широкий смысл и не сводит его только к труду.
theological_decisions:
- issue: Описывает ли стих сознательный отказ от привязанности к богатству ради верности Богу или просто бедность
  choice: Сознательный отказ любящих Бога от привязанности к мирским благам и готовность переносить страдание
  alternative: Описание людей, которые лишь не обладали богатством, либо общее осуждение жадности
  rationale: Повторение глагола любви противопоставляет любовь к Богу любви к золоту, серебру и благам мира; заключительная фраза говорит о телесной самоотдаче страданию, однако не уточняет, идёт ли речь об аскезе, гонении или иной тяготе.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. «Возлюбили» сохраняет риторический контраст видов любви, а «каких-либо благ этого мира» естественно передаёт широкое и текстуально не вполне ясное выражение.
