base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/014.yaml
  text: And they will see those who were born in darkness cast into darkness[e][d][c][b][a], while the righteous shine.
translation:
  language: ru
  text: И они увидят, как рождённые во тьме будут брошены во тьму, а праведники засияют.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «а праведники будут озарены».'
    reason: lexical_alternative
lexical_decisions:
- source_word: እይዎሙ ለእለ ተወልዱ በጽልመት
  choice: они увидят, как рождённые во тьме
  rationale: Относительная конструкция обозначает людей, чьё происхождение связано с тьмой. «Рождённые во тьме» естественно передаёт пассивную форму и сохраняет образ оригинала.
- source_word: ይትወደዩ በጽልመት
  choice: будут брошены во тьму
  rationale: 'Форма восходит к ወደየ — «класть, бросать», а не к глаголу любви; пассивный имперфект в данном контексте передан будущим временем. Предлог በ здесь имеет направительное значение: «во тьму».'
- source_word: እንዘ ይትወሐውሑ
  choice: а … засияют
  rationale: Обстоятельственная конструкция с እንዘ противопоставляет участь праведников участи рождённых во тьме. Имперфект согласован с будущей временной перспективой главной части.
- source_word: ጻድቃን
  choice: праведники
  rationale: Обычный и богословски нейтральный русский эквивалент ключевого енохического обозначения праведных людей.
theological_decisions:
- issue: Характер участи рождённых во тьме
  choice: будут брошены во тьму
  alternative: будут оставлены во тьме
  rationale: Глагольная форма прямо выражает бросание или низвержение; перевод не смягчает образ суда и не добавляет отсутствующего в тексте объяснения.
- issue: Активность или пассивность прославления праведников
  choice: праведники засияют
  alternative: праведники будут озарены
  rationale: Форма допускает оттенок становления светлыми или наделения светом. В основном тексте выбран естественный русский образ «засияют», а возможный пассивный оттенок сохранён в примечании.
translation_notes:
  register: Современный литературный русский язык с торжественной, но прозрачной образностью. Повтор «во тьме — во тьму» намеренно сохранён как риторическое противопоставление; союз «а» естественно передаёт контраст обстоятельственной части.
