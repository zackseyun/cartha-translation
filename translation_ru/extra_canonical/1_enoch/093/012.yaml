base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/012.yaml
  text: And who is there that can behold heaven? And who is there that can understand the works of heaven? Or see a soul—or[a], if not[e][d][c][b], a spirit—and tell of it? Or else ascend and see all their ends?
translation:
  language: ru
  text: И кто способен созерцать небо? И кто способен постичь дела неба? И кто может увидеть душу — или, если нет, дух[a] — и рассказать о ней? Или взойти и увидеть все их пределы[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «увидеть душу — или, если нет, дух» в оригинале текстуально и семантически трудны. Перевод сохраняет различие между «душой» и «духом» и необычную связку «или, если нет», не сводя их к одному понятию. «Дух» также может означать «дыхание».
    reason: textual_variant
  - marker: b
    text: Последнее выражение не вполне ясно. Его можно понимать как «все их пределы» или «все их края»; более буквальное значение последнего слова может быть связано с «крыльями».
    reason: lexical_alternative
lexical_decisions:
- source_word: ምነት ውእቱ ዘይክል
  choice: кто способен
  rationale: Передаёт риторический вопрос о человеческой способности естественным современным русским языком.
- source_word: ነጽሮተ ሰማይ
  choice: созерцать небо
  rationale: ነጽሮተ понимается как инфинитив глагола «смотреть, созерцать», а не как существительное «хранилища»; это соответствует исправлению по источнику.
- source_word: አእምሮ ግብረ ሰማይ
  choice: постичь дела небесные
  rationale: Сохраняет значение познания и небесную отнесённость выражения, оставаясь естественным по-русски.
- source_word: ከመ ይርአይ ነፍሰ
  choice: как может он увидеть душу
  rationale: Сохраняет трудную и необычную формулировку текста, не заменяя её толкованием.
- source_word: መንፈሰ
  choice: дух
  rationale: В данном антропологическом контексте это наиболее прямой эквивалент; возможные значения «дыхание» и «ветер» здесь менее вероятны.
- source_word: ወይክል ነጊረ
  choice: и рассказать о ней
  rationale: Передаёт способность сообщить о воспринятом; местоимение оставлено в форме, допускающей отнесение к душе либо к увиденному предмету в целом.
- source_word: ወእመ አኮ ዐሪገ
  choice: или подняться
  rationale: ወእመ አኮ понято как устойчивое «или же», а ዐሪገ — как продолжение ряда действий, а не как отрицательное условие.
- source_word: ኵሎ አክናፊሆሙ
  choice: все их пределы
  rationale: «Пределы» лучше всего передаёт вероятный контекстуальный смысл концов или крайних областей; буквальная связь с «крыльями» отмечена в сноске.
theological_decisions:
- issue: Соотношение ነፍሰ и መንፈሰ
  choice: Передать раздельно как «душа» и «дух».
  alternative: «жизнь» и «дыхание» либо сведение обоих слов к одному понятию.
  rationale: Источник сополагает два разных слова; перевод сохраняет антропологическое напряжение и не навязывает определённой доктринальной системы.
- issue: Смысл восхождения
  choice: 'Сохранить буквальный мотив восхождения: «подняться».'
  alternative: Истолковать как условие «если он не поднялся».
  rationale: Идиоматическое ወእመ አኮ вводит альтернативу, а не отрицательное условие; так сохраняется апокалиптический образ восхождения.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным риторическим строем. Повтор «И кто способен» сохранён ради параллелизма. Не подтверждённый источником образ «хранилищ неба» исключён.
