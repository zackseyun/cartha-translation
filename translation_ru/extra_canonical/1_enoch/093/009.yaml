base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/009.yaml
  text: And after this[a], in the seventh week, an apostate generation will arise, and many will be its deeds[b], and all its deeds will be apostasy.
translation:
  language: ru
  text: И после этого, в седьмую седмину[a], восстанет отступническое поколение; многочисленны будут его дела, и все его дела будут отступничеством[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в седьмую субботу/седмину». В этом видении речь идёт о символическом семичастном периоде истории, а не об одном субботнем дне.'
    reason: cultural_note
  - marker: b
    text: Последнее слово можно также перевести как «заблуждение», «извращение» или «мятеж». Здесь выбрано «отступничество», чтобы сохранить религиозно-нравственный оттенок и связь с выражением «отступническое поколение».
    reason: lexical_alternative
lexical_decisions:
- source_word: ሳብዕት ሰንበት
  choice: в седьмую седмину
  rationale: В «Апокалипсисе седмин» выражение обозначает седьмой символический семичастный период истории, а не буквальный субботний день. «Седмина» сохраняет устройство видения и звучит уместно в возвышенном современном русском тексте.
- source_word: ትትነሣእ
  choice: восстанет
  rationale: Глагол означает возникновение или появление. «Восстанет» естественно передаёт появление поколения в последовательности апокалиптических эпох, не навязывая пассивного смысла «будет воздвигнуто».
- source_word: ትውልድ
  choice: поколение
  rationale: В данном контексте слово обозначает историческое поколение или совокупность современников, а не потомство в узком смысле.
- source_word: ዕሉት
  choice: отступившее
  rationale: Слово указывает на уклонение, заблуждение или отпадение. «Отступившее» сохраняет религиозно-нравственный оттенок, но не уточняет без достаточных оснований, от какого именно завета или учения произошло отпадение.
- source_word: ብዙኅ
  choice: многочисленны будут
  rationale: Предикативное употребление выражает множество или обилие; такая конструкция сохраняет акцент оригинала и остаётся понятной по-русски.
- source_word: ምግባራቲሃ
  choice: его дела
  rationale: Существительное обозначает поступки, деяния или дела. «Дела» сохраняет повтор исходного текста и его нравственно-судебную весомость.
- source_word: ዕልወት
  choice: отступничеством
  rationale: Абстрактное существительное соотносится с характеристикой ዕሉት и может означать отпадение, заблуждение, извращение или мятеж. «Отступничество» передаёт религиозно-нравственную силу и сохраняет смысловую связь с «отступившим поколением».
theological_decisions:
- issue: Передавать ли характеристику поколения как общее нравственное зло или как религиозное отпадение
  choice: отступившее поколение ... все его дела будут отступничеством
  alternative: порочное поколение ... все его дела будут порочностью; заблудшее поколение ... все его дела будут заблуждением
  rationale: Парные слова ዕሉት и ዕልወት обозначают уклонение или отпадение и, вероятно, имеют более острый религиозно-нравственный смысл, чем просто «зло». При этом «отступившее» не определяет предмет отпадения и тем самым не вносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. «Седмина» требует пояснения, но точнее обычного «неделя» передаёт символический период. Синтаксический повтор «его дела ... все его дела» сохранён как заметная черта оригинала.
