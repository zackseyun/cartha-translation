base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/005.yaml
  text: And after this[a], in the third week, at its completion, a man shall be chosen as the plant of righteous judgment[c][b], and after him there shall come forth the plant of righteousness forever and ever.
translation:
  language: ru
  text: И после этого, в третью неделю[a], при её завершении будет избран человек[b] как растение праведного суда[c], а после него явится растение праведности во веки веков.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Третья неделя» относится к символической последовательности в «Апокалипсисе недель»; это не буквальная семидневная неделя.
    reason: cultural_note
  - marker: b
    text: Текст не называет избранного человека. Толкователи связывали его с различными выдающимися праведниками или вождями, однако сам стих не устанавливает его личность.
    reason: alternative_reading
  - marker: c
    text: Повторяющийся образ растения может указывать на праведный род, возрастание или пребывающее сообщество, но в переводе сохранена растительная метафора исходного текста.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሣልስት ሰንበት
  choice: третья неделя
  rationale: В контексте «Апокалипсиса недель» речь идёт о символическом семичастном периоде, а не о буквальной субботе или обычной календарной неделе.
- source_word: በተፍጻሜታ
  choice: при её завершении
  rationale: Местоименная отсылка относится к третьей неделе; формулировка обозначает окончание символического периода и сохраняет возвышенный повествовательный строй.
- source_word: ይትኃረይ
  choice: будет избран
  rationale: Передаёт пассивное значение выбора, не добавляя идеи назначения на определённую должность.
- source_word: ብእሲ
  choice: человек
  rationale: Сохраняет единственное число и не отождествляет неназванную фигуру с каким-либо известным лицом.
- source_word: ለተክለ
  choice: как растение
  rationale: Сохраняет трудную растительную метафору и сравнительно-предикативную связь, не подменяя образ понятиями рода, потомства или общины.
- source_word: ኵነኔ ጽድቅ
  choice: праведного суда
  rationale: Передаёт одновременно судебный и нравственный смысл сочетания, не сводя его только к справедливости как отвлечённому качеству.
- source_word: ይወፅእ
  choice: произрастёт
  rationale: Глагол буквально обозначает выход или появление; в связи с последующим образом растения русский глагол «произрастёт» естественно поддерживает метафору, хотя несколько конкретизирует её.
- source_word: ለተክለ ጽድቅ
  choice: растение праведности
  rationale: Сохраняет конкретный растительный образ и родительную конструкцию, не истолковывая её заранее как род, потомство или сообщество.
- source_word: ለዓለመ ዓለም
  choice: во веки веков
  rationale: Устойчивая русская формула передаёт усиленное указание на бесконечную длительность и соответствует возвышенному апокалиптическому регистру.
theological_decisions:
- issue: Кто такой человек, избранный при завершении третьей недели
  choice: 'Оставить его неназванным: «человек».'
  alternative: Енох, Ной, Авраам либо собирательный образ праведного вождя.
  rationale: Сам стих не называет эту фигуру, поэтому перевод не должен устранять сохраняемую источником неопределённость.
- issue: Смысл растительного образа
  choice: Сохранить слово «растение» в обеих частях стиха.
  alternative: Род, корень, потомство, насаждение или община.
  rationale: Эфиопский текст дважды использует растительную образность; её отвлечённая передача преждевременно определила бы, относится ли образ к отдельному человеку, роду или общине.
- issue: Связь избранного человека с «растением праведного суда»
  choice: Передать конструкцией «как растение праведного суда».
  alternative: «для насаждения праведного суда» или «растение суда праведности».
  rationale: Исходная конструкция трудна. Выбранная формулировка следует засвидетельствованному пониманию человека как самого растения, но не уточняет, как именно следует истолковывать эту метафору.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис остаётся ясным для широкого читателя; традиционная формула «во веки веков» уместна в данном регистре. Необычное сочетание «растение праведного суда» намеренно сохраняет образность и смысловую напряжённость источника.
