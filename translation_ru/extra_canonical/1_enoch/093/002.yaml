base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/002.yaml
  text: And Enoch said[a], “Concerning the children of righteousness, and concerning the chosen of the world, and concerning the plant of uprightness, I will speak to you and make known to you, my children—I, Enoch—what was shown to me from a vision of heaven, and what I learned from the words of the holy angels[e][d][c][b], and understood from the tablets of heaven.”
translation:
  language: ru
  text: 'И сказал Енох: «О детях праведности, об избранных мира[a] и о насаждении праведности — о них я расскажу вам и открою вам, дети мои, — я, Енох, — то, что было показано мне из небесного видения, что я узнал из слова святых ангелов и уразумел из небесных скрижалей[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «избранных века», если ዓለም означает век или мировой порядок, а не мир как творение.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «небесные скрижали» отражает распространённый в Книге Еноха образ небесных записей; его можно понимать и шире — как небесное писание или книги.
    reason: lexical_alternative
lexical_decisions:
- source_word: ውሉደ፡ ጽድቅ
  choice: дети праведности
  rationale: Сохранены образ родства и родительный оборот, обозначающий общность праведных; выражение не сведено к отвлечённому «праведники».
- source_word: ኅሩያነ፡ ዓለም
  choice: избранные мира
  rationale: Буквально передаёт формулу источника, не привнося позднейшей конфессиональной терминологии; возможное значение «века» отмечено в сноске.
- source_word: ተክለ፡ ርትዕ
  choice: насаждение правоты
  rationale: «Насаждение» сохраняет растительный апокалиптический образ, а «правота» передаёт смысл прямоты и правильности, не отождествляя выражение без остатка с предыдущей «праведностью».
- source_word: እሎንተ፡ እብለክሙ፡ ወአየድዐክሙ
  choice: я буду говорить вам и возвещу вам
  rationale: Парные глаголы переданы как речь и доведение откровения до сведения слушателей; русская формулировка избегает тяжеловесного повтора местоименного дополнения.
- source_word: ደቂቅየ
  choice: дети мои
  rationale: Естественное современное обращение с сохранением семейного образа.
- source_word: በዘ፡ አስተርአየኒ፡ እምራእየ፡ ሰማይ
  choice: то, что было показано мне из видения неба
  rationale: Предлог እም передан как «из», то есть видение названо источником откровения; генитивное «видение неба» сохраняет структуру и некоторую неоднозначность оригинала.
- source_word: እምቃለ፡ ቅዱሳን፡ መላእክት፡ አእመርኩ
  choice: что я узнал из слова святых ангелов
  rationale: Единственное число ቃለ передано словом «слово», а исходный предлог — «из»; сохранено ангельское посредничество откровения.
- source_word: እምነ፡ ጸፍጸፈ፡ ሰማይ፡ ለበውኩ
  choice: уразумел из небесных скрижалей
  rationale: «Скрижали» сохраняют конкретный енохический образ небесных записей, а «уразумел» передаёт осмысленное восприятие.
theological_decisions:
- issue: Соотношение трёх обозначенных общностей
  choice: Сохранить три параллельных наименования без утверждения, полностью ли они совпадают.
  alternative: Свести все три выражения к одному обозначению праведников либо представить их как строго различные группы.
  rationale: Источник перечисляет «детей праведности», «избранных мира» и «насаждение правоты», но не поясняет их точного соотношения.
- issue: Значение ኅሩያነ፡ ዓለም
  choice: избранные мира
  alternative: избранные века
  rationale: ዓለም может обозначать как мир, так и век или мировой порядок; основной текст сохраняет наиболее прямое значение, а альтернативное вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис сделан понятным для широкого читателя, при этом сохранены повторяющиеся формулы, конкретные образы и смысловая неоднозначность источника.
