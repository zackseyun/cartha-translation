  to: 'И сказал Енох: «О детях праведности, об избранных мира[a] и о насаждении праведности — о них я расскажу вам и открою вам, дети мои, — я, Енох, — то, что было показано мне из небесного видения, что я узнал из слова святых ангелов и уразумел из небесных скрижалей[b]».'
