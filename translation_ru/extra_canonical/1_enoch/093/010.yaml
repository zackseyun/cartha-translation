base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/010.yaml
  text: And at its completion the chosen righteous ones will be selected from the eternal plant of righteousness[c][b][a], and to them will be given the sevenfold instruction concerning all his creation.
translation:
  language: ru
  text: И по её завершении из вечного насаждения праведности[a] будут отобраны избранные праведники, и им будет дано семикратное наставление[b] обо всём его творении.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «из вечного растения праведности» или «из вечной посадки праведности». Здесь сохранён земледельческий образ исходного текста.'
    reason: cultural_note
  - marker: b
    text: 'Трудное место. Возможно также: «семь наставлений» или «семь видов наставления». Числительное может обозначать наставление как семичастное целое.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በተፍጻሜታ
  choice: по её завершении
  rationale: Передаёт временное значение и сохраняет местоименную отсылку к предшествующему периоду, не уточняя её сверх текста.
- source_word: ይትኃረዩ
  choice: будут отобраны
  rationale: Пассивная форма выражает избрание или выделение; «отобраны» позволяет не повторять непосредственно следующее «избранные».
- source_word: ኅሩያን ጻድቃን
  choice: избранные праведники
  rationale: Сохраняет оба значимых определения — избранность и праведность — в естественной современной русской форме.
- source_word: እምተክለ ጽድቅ ዘለዓለም
  choice: из вечного насаждения праведности
  rationale: «Насаждение» сохраняет сельскохозяйственный образ и допускает собирательное понимание, не заменяя метафору отвлечённым понятием.
- source_word: ይትወሀብ ሎሙ
  choice: им будет дано
  rationale: Сохраняет пассивную конструкцию и торжественный строй исходного высказывания.
- source_word: ሰብዓቱ መክዕቢተ ትምህርት
  choice: семикратное наставление
  rationale: Передаёт смысл цельного наставления, отмеченного полнотой числа семь; грамматически и лексически трудное место сопровождается примечанием с альтернативами.
- source_word: በኵሉ ፍጥረት ዚአሁ
  choice: обо всём его творении
  rationale: Предлог истолкован как указание на предмет наставления; строчная форма «его» не устраняет возможную неоднозначность референта.
theological_decisions:
- issue: Соотношение избранности и праведности
  choice: избранные праведники
  alternative: праведники-избранники
  rationale: Оба элемента сохранены без сведения избранности к одной лишь нравственной оценке и без привнесения поздней конфессиональной терминологии.
- issue: Образ происхождения праведников
  choice: вечное насаждение праведности
  alternative: вечное растение праведности
  rationale: Сохраняется конкретная метафора роста, при этом «насаждение» естественнее по-русски для образа, из которого выделяется множество людей.
- issue: Референт притяжательного местоимения
  choice: его творении
  alternative: Его творении
  rationale: Строчная буква сохраняет формальную неоднозначность текста и не навязывает толкование посредством русской практики почтительного написания.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан естественным, но образы, пассивные формы и неоднозначность трудных мест сохранены.
