base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/006.yaml
  text: And after this[a], in the fourth week, at its completion, visions of the holy and righteous shall be seen[c][b], and a law for generation after generation and an enclosure shall be made for them.
translation:
  language: ru
  text: И после этого, в четвёртую неделю, при её завершении, явятся видения святых и праведных[a], и для них будет установлен закон из поколения в поколение[b] и устроена ограда[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение может означать видения, относящиеся к святым и праведным или являющие их; в апокалиптическом контексте также не вполне ясно, имеются ли в виду только праведные люди или более широкий круг святых существ.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «установление» либо «порядок из поколения в поколение». Здесь слово, вероятно, имеет значение «закон».'
    reason: lexical_alternative
  - marker: c
    text: Последнее существительное трудно для перевода. Оно может указывать на нечто ограждённое или насаждённое; возможны варианты «ограждённое место», «сад» или «насаждение».
    reason: textual_uncertainty
lexical_decisions:
- source_word: እምድኅረዝ
  choice: после этого
  rationale: Передаёт временную формулу перехода к следующему периоду и сохраняет последовательность видения.
- source_word: ራብዕት ሰንበት
  choice: в четвёртую неделю
  rationale: В композиции «Апокалипсиса недель» речь идёт о символическом периоде, а не о буквальном дне субботы.
- source_word: በተፍጻሜታ
  choice: при её завершении
  rationale: Местоименное значение суффикса отнесено к четвёртой неделе; формулировка сохраняет торжественный язык этапов апокалиптической истории.
- source_word: ራእያተ
  choice: видения
  rationale: Слово естественно обозначает видения в апокалиптическом контексте и не требует более истолковывающего «откровения».
- source_word: ቅዱሳን ወጻድቃን
  choice: святых и праведных
  rationale: Субстантивированные формы переданы без церковно-конфессионального уточнения; родительный падеж также не устраняет полностью возможную смысловую неоднозначность связи с «видениями».
- source_word: ይትረአይ
  choice: явятся
  rationale: Передаёт становление видимым или появление, сохраняя неопределённость относительно того, были ли видения даны людям или сами стали явными.
- source_word: ሥርዐት
  choice: закон
  rationale: В контексте четвёртой недели и параллели внутри главы наиболее вероятно нормативное значение «закон»; возможность более широкого значения «порядок/установление» отмечена в сноске.
- source_word: ለትውልደ ትውልድ
  choice: из поколения в поколение
  rationale: Русская формула естественно передаёт повтор существительного и непрерывность во времени.
- source_word: ዐጸድ
  choice: ограда
  rationale: Трудное существительное может обозначать ограждённое либо насаждённое место; «ограда» сохраняет конкретный образ без отождествления с садом или насаждением.
- source_word: ይትገበር ሎሙ
  choice: для них будут установлены
  rationale: Один сказуемый отнесён к обоим однородным существительным, как в геэзском тексте; «установлены» применимо и к закону, и к ограде, не добавляя отдельного действия.
theological_decisions:
- issue: Кого обозначают «святые и праведные»
  choice: Не уточнять в основном тексте, люди это или небесные существа.
  alternative: Понимать выражение исключительно как обозначение верных людей либо как обозначение небесных святых.
  rationale: Историческая последовательность недель и слово «праведные» благоприятствуют человеческому референту, однако апокалиптическая лексика допускает более широкий смысл.
- issue: Значение ሥርዐት
  choice: Передать как «закон».
  alternative: «порядок», «установление» или «устав».
  rationale: Четвёртая неделя соотносится с дарованием закона, а внутренняя параллель главы поддерживает юридический смысл; сноска сохраняет более широкую лексическую возможность.
- issue: Образ ዐጸድ
  choice: Передать как «ограда», не отождествляя её прямо с конкретным святилищем или садом.
  alternative: «сад», «насаждение» или «ограждённое место».
  rationale: Слово текстологически и лексически трудно; конкретизация могла бы привнести богословское отождествление, которого сам текст однозначно не выражает.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным апокалиптическим звучанием. Синтаксис сохраняет последовательность исходного стиха, но не копирует геэзский порядок слов механически. Формы «четвёртую неделю», «при её завершении» и «из поколения в поколение» понятны широкому читателю и не перегружены специальной терминологией.
