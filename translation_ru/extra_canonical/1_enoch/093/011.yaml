base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/011.yaml
  text: For who among all the children of men is able to hear the voice of the Holy One and not be shaken? And who is able to comprehend his thoughts? And who is able to look upon all the works of heaven?[a][b][c]
translation:
  language: ru
  text: Ибо кто из всех сынов человеческих способен услышать голос Святого[a] и не содрогнуться? И кто способен постичь Его мысли[b]? И кто способен обозреть все дела небес[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слово» или «речь Святого»; геэзское слово ቃል может обозначать голос, слово или произнесённую речь.'
    reason: lexical_alternative
  - marker: b
    text: Буквально выражение близко к «мыслить Его мысль (мысли)». Местоимение, вероятнее всего, относится к Святому; возможно также понимание, сосредоточенное на способности человеческого ума мыслить или постигать.
    reason: textual_ambiguity
  - marker: c
    text: '«Дела небес» — широкое выражение: оно может охватывать действия, устройство и упорядоченные явления небесной сферы, а не только видимые небесные объекты.'
    reason: cultural_note
lexical_decisions:
- source_word: እስመ
  choice: Ибо
  rationale: Передаёт пояснительно-обосновывающую функцию союза и сохраняет возвышенный риторический строй.
- source_word: ውሉደ ሰብእ
  choice: из всех сынов человеческих
  rationale: Сохраняет семитский собирательный оборот о человечестве; форма множественного числа не превращает выражение в позднейший титул.
- source_word: ዘይክል
  choice: способен
  rationale: Повтор этого слова воспроизводит риторическую анафору и подчёркивает предел человеческих возможностей.
- source_word: ሰሚዐ ቃሉ ለቅዱስ
  choice: услышать голос Святого
  rationale: ቃል охватывает значения «голос», «слово», «речь»; после глагола «услышать» по-русски естественнее «голос». ቅዱስ передано как божественный титул «Святой».
- source_word: ወኢይትሀወክ
  choice: и не содрогнуться
  rationale: Передаёт внутреннее потрясение перед божественной речью, не сводя его только к страху или растерянности.
- source_word: ከመ የሐሊ ኅሊናሁ
  choice: постичь Его мысли
  rationale: 'Сохраняет сочетание глагола мышления с однокоренным существительным, но выражает его естественно по-русски. Местоименный суффикс отнесён к Святому; это даёт параллель: услышать Его голос, постичь Его мысли, обозреть дела небес.'
- source_word: ነጽሮተ
  choice: обозреть
  rationale: Передаёт не мимолётное зрительное восприятие, а охватывающее созерцание; слово возвышенно, но понятно современному читателю.
- source_word: ምግባረ ሰማይ
  choice: дела небес
  rationale: Сохраняет широкий смысл деяний, устройства и происходящего в небесной сфере, не сужая выражение до видимых небесных тел или сотворённых объектов.
theological_decisions:
- issue: Передача ለቅዱስ как божественного титула
  choice: Святого
  alternative: святого
  rationale: Контекст говорит о трансцендентном носителе голоса, перед которым человек содрогается. Заглавная буква обозначает титульное употребление, не внося специфически христологического истолкования.
- issue: Референт суффикса в ኅሊናሁ
  choice: Его мысли — мысли Святого
  alternative: его собственная мысль / способность человеческого ума мыслить
  rationale: Грамматически форма допускает обсуждение референта местоимения, однако ближайший выраженный мужской референт — Святой, а три вопроса образуют последовательный параллелизм. Неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Повтор «И кто способен» сохранён ради риторического параллелизма; архаические формы и конфессионально окрашенная терминология избегаются.
