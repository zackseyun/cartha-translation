base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/008.yaml
  text: And after this[a], in the sixth week, all who are in it will be blind, and the hearts of all of them will forget wisdom. And in it a man will ascend, and at its completion the house of the kingdom will be burned with fire[d][c][b], and in it the whole stock of the chosen root will be scattered.
translation:
  language: ru
  text: И после этого, в шестую неделю, все, кто будет в ней, будут слепы[a], и сердца их забудут мудрость. В эту неделю взойдёт человек[b], а при её завершении дом царства[c] будет сожжён огнём, и в ней будет рассеян весь род избранного корня[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут омрачены». Вероятно, речь идёт о духовной или нравственной слепоте людей этой недели.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «поднимется человек». Глагол может обозначать восхождение или возвышение; личность этого человека в стихе не названа.'
    reason: lexical_alternative
  - marker: c
    text: «Дом царства» может означать не только здание, но также царский дом, династию или весь установленный царский порядок.
    reason: lexical_alternative
  - marker: d
    text: Выражение «род избранного корня» соединяет образ родословной линии с образом корня; оно может указывать на избранный род или остаток.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሳድስት ሰንበት
  choice: в шестую неделю
  rationale: В контексте Апокалипсиса недель слово обозначает символический период-седмицу. «Неделя» понятно современному читателю и сохраняет композиционный образ.
- source_word: ውስቴታ ጽሉላነ ኵሎሙ
  choice: все, кто будет в ней, ослепнут
  rationale: Передаёт состояние людей шестой недели и сохраняет образ слепоты, не сводя его прямо к невежеству или духовному заблуждению.
- source_word: ይትረሣዕ ልቦሙ ለኵሎሙ እምጥበብ
  choice: сердца их забудут мудрость
  rationale: Близко передаёт глагол забвения и сохраняет характерный для литературы мудрости образ сердца как средоточия понимания.
- source_word: ባቲ የዓርግ ብእሲ
  choice: в эту неделю взойдёт человек
  rationale: «Взойдёт» сохраняет значение движения вверх или возвышения и не решает заранее, идёт ли речь о появлении, политическом возвышении либо буквальном восхождении.
- source_word: ቤተ መንግሥት
  choice: дом царства
  rationale: 'Буквально и намеренно неоднозначно: выражение может обозначать строение, царский дом, династию или связанный с царством установленный порядок.'
- source_word: ይውዒ ... በእሳት
  choice: будет сожжён огнём
  rationale: Естественная русская формула, точно сохраняющая образ уничтожения огнём.
- source_word: ኵሉ ዘመደ ሥርወ ኀሩይ
  choice: весь род избранного корня
  rationale: «Род» передаёт значение происхождения и линии потомков, а «корень» сохраняет растительную метафору и язык избрания.
theological_decisions:
- issue: Кто такой восходящий человек
  choice: Оставлено неопределённое «взойдёт человек» без отождествления
  alternative: Исторический правитель, священническая фигура или мессианский персонаж
  rationale: Эфиопский текст называет лишь человека и не устанавливает его личность в самом стихе.
- issue: Значение выражения «дом царства»
  choice: Сохранена буквальная неоднозначная формула
  alternative: Царская династия, дворец или храм, связанный с царством
  rationale: Более конкретный вариант преждевременно сузил бы диапазон значений исходного выражения.
- issue: Значение «избранного корня»
  choice: Сохранены одновременно родословный образ и язык избрания
  alternative: Избранный остаток, избранная ветвь или мессианский корень
  rationale: Стих не отождествляет этот образ с одним определённым лицом и не требует согласования с позднейшими богословскими употреблениями.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Синтаксис сделан ясным для обычного читателя; повтор «в эту неделю / в ней» сохраняет структуру источника. Неоднозначные образы не конкретизированы без текстовых оснований.
