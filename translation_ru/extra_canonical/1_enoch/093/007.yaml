base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/007.yaml
  text: And after this[a], in the fifth week, at its completion[b], the house of glory and kingship shall be built forever.
translation:
  language: ru
  text: И после этого, в пятую неделю[b], при её завершении будет навеки воздвигнут дом славы и царской власти.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «дом славы и царство будут воздвигнуты навеки», если መንግሥት понимать как второй однородный элемент, а не как характеристику дома.'
    reason: alternative_reading
  - marker: b
    text: В «Апокалипсисе недель» слово «неделя» обозначает символический период исторического видения Еноха, а не обязательно буквальные семь дней.
    reason: cultural_note
lexical_decisions:
- source_word: እምድኅረዝ
  choice: после этого
  rationale: Передаёт временную формулу перехода к следующему этапу видения, сохраняя последовательность событий.
- source_word: ኃምስ ሰንበት
  choice: в пятую неделю
  rationale: В «Апокалипсисе недель» это обозначение символического периода; «неделя» сохраняет структуру видения и понятно современному читателю.
- source_word: በተፍጻሜታ
  choice: при её завершении
  rationale: Местоименный суффикс отсылает к пятой неделе; формулировка сохраняет значение достижения конца или полноты периода.
- source_word: ቤተ ስብሐት
  choice: дом славы
  rationale: Буквально сохраняет образ дома, вероятно святилища; «слава» в данном контексте естественнее, чем «хвала», и передаёт сакральное величие.
- source_word: መንግሥት
  choice: царской власти
  rationale: Слово допускает значения «царство» и «царская власть». Родительный оборот естественно связывает его с единым «домом» и не сводит образ к территории или государству.
- source_word: ይትሐነጽ
  choice: будет воздвигнут
  rationale: Сохраняет страдательное значение и конкретный образ строительства, при этом звучит достойно и естественно применительно к священному зданию.
- source_word: እስከ ለዓለም
  choice: навеки
  rationale: Кратко и идиоматично передаёт непреходящую длительность в эсхатологическом контексте.
theological_decisions:
- issue: Обозначают ли «дом славы» и «царство/царская власть» единый образ или два отдельных элемента
  choice: Единый дом, характеризуемый славой и царской властью
  alternative: «Дом славы и царство будут воздвигнуты навеки»
  rationale: Единственное число глагола и последовательность существительных благоприятствуют пониманию единого «дома», однако синтаксис допускает координацию двух элементов; поэтому альтернативное прочтение сохранено в примечании.
- issue: Следует ли прямо назвать дом храмом или эсхатологическим святилищем
  choice: Сохранить исходный образ «дома»
  alternative: «Храм славы и царской власти»
  rationale: Контекст может указывать на святилище, но исходное слово означает «дом». Более конкретное «храм» преждевременно устранило бы образную и богословскую многозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном. «Воздвигнут» поддерживает храмово-апокалиптический образ без архаизации; порядок слов оставляет акцент на вечном установлении дома.
