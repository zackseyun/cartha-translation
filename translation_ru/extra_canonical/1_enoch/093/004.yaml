base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/004.yaml
  text: And after me[a], in the second week, great evil shall arise, and deceit shall spring up in it. And in it there shall be the first end, and in it a man shall be saved; and after it has been completed, unrighteousness shall grow[d][c][b], and a law shall be made for the sinners.
translation:
  language: ru
  text: После меня, во вторую неделю[a], возникнет великое зло, и в ней расцветёт обман. В ней наступит первый конец, и в ней будет спасён человек[b]. А когда она завершится, умножится неправедность, и для грешников будет установлен закон[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Вторая неделя» — часть символического деления истории на недели в этом апокалиптическом видении, а не обязательно буквальный семидневный срок.
    reason: cultural_note
  - marker: b
    text: 'В исходном тексте стоит единственное число: «человек». Многие усматривают здесь намёк на Ноя, но в самом стихе он не назван.'
    reason: cross_reference
  - marker: c
    text: 'Возможно также: «будет установлено предписание для грешников» или «против грешников». Формулировка может обозначать закон, касающийся грешников либо направленный против них.'
    reason: lexical_alternative
