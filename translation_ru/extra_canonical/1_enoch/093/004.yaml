- source_word: በካልእት ሰንበት
  choice: во вторую неделю
  rationale: Сохраняет символическую структуру «недель» в апокалиптическом обзоре истории.
- source_word: ዐቢይ እኩይ
  choice: великое зло
  rationale: Прямо сохраняет резкую нравственную оценку исходного текста.
- source_word: ትሕሱት በቀለት
  choice: произрастёт обман
  rationale: «Произрастёт» сохраняет органический образ глагола, связанного с ростом или появлением ростка; «обман» передаёт широкое нравственное значение существительного.
- source_word: ቀዳሚት ፍጻሜ
  choice: первый конец
  rationale: Формально сохраняет необычное апокалиптическое выражение, не подменяя его толкованием вроде «первого суда».
- source_word: ይድኅን ብእሲ
  choice: будет спасён человек
  rationale: Сохраняет единственное число и значение избавления, не называя человека и не превращая его в собирательный образ человечества.
- source_word: ተፈጸመ
  choice: завершится
  rationale: В контексте ближайшим референтом выступает символическая вторая неделя; глагол передаёт окончание этого периода.
- source_word: ትእህቱ ዓመፃ
  choice: умножится неправедность
  rationale: Передаёт рост нравственного беззакония, сохраняя широкое значение и не сужая его до одного лишь насилия или мятежа.
- source_word: ሥርዐት
  choice: закон
  rationale: Сохраняет основное значение порядка, установления или закона и намеренно не заменяет его истолковывающим словом «суд».
- source_word: ይትገበር ለኃጥኣን
  choice: для грешников будет установлен
  rationale: Передаёт безлично-пассивную конструкцию и сохраняет неоднозначное отношение закона к грешникам.
theological_decisions:
- issue: Кто именно является спасённым человеком
  choice: Сохранить безымянного человека в единственном числе.
  alternative: Назвать его Ноем либо передать собирательно как спасение человечества.
  rationale: Контекст может указывать на Ноя, однако сам стих его не называет; перевод не должен устранять эту сдержанность текста.
- issue: Смысл закона, установленного для грешников
  choice: Сохранить буквальное «для грешников будет установлен закон».
  alternative: «Против грешников будет установлен закон» или «грешникам будет назначен суд».
  rationale: Предлог и существительное допускают несколько оттенков. Основной текст сохраняет неоднозначность, а примечание сообщает возможные понимания.
- issue: Значение «первого конца»
  choice: Сохранить выражение «первый конец» без догматической конкретизации.
  alternative: «Первое свершение», «первый суд» или «первая гибель».
  rationale: Апокалиптическая формула необычна, но исходный текст не уточняет её содержание; конкретизирующий перевод преждевременно разрешил бы напряжение.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной апокалиптической интонацией. Необычные формулы «первый конец» и «для грешников… закон» сохранены ради смысловой открытости исходного текста; архаизмы и конфессионально окрашенные уточнения не вводятся.
