base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/003.yaml
  text: And now Enoch began to speak from the books[a], and he said, “I was born the seventh in the first week[d][c][b], while righteousness and justice still endured.”
translation:
  language: ru
  text: 'И вот Енох начал говорить из книг[a] и сказал: «Я родился седьмым в первую неделю[b], когда ещё пребывали суд[c] и праведность[d]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из книг». Вероятно, Енох читает или пересказывает письменные записи, а не говорит только по памяти.'
    reason: cultural_note
  - marker: b
    text: «Первая неделя» — первый символический период истории в Апокалипсисе недель, а не обязательно буквальная семидневная неделя.
    reason: cross_reference
  - marker: c
    text: В машинной расшифровке данного свидетеля здесь стоит трудная форма ጽጌነ, однако критическое чтение — ኵነኔ, «суд, правосудие».
    reason: textual_variant
  - marker: d
    text: 'Возможен более буквальный синтаксический разбор: «до времени, когда будут пребывать суд и праведность»; контекст рассказа о прошлом поддерживает перевод «когда ещё пребывали».'
    reason: translation_note
lexical_decisions:
- source_word: አኀዘ፡ እንከ፡ ይትናገር
  choice: И вот Енох начал говорить
  rationale: Переходная частица передана естественным повествовательным оборотом «и вот», а сочетание глаголов — современным русским «начал говорить».
- source_word: እመጻሕፍት
  choice: по книгам
  rationale: Предлог указывает на письменный источник речи. «По книгам» естественно по-русски передаёт речь на основании записанного, не объявляя эти книги Писанием.
- source_word: ሳብዕ
  choice: седьмым
  rationale: Порядковое числительное обозначает место Еноха в последовательности поколений.
- source_word: በቀዳሚት፡ ሰንበት
  choice: в первую неделю
  rationale: В контексте Апокалипсиса недель речь идёт о первом символическом семичастном периоде истории, а не об одном субботнем дне.
- source_word: እስከ፡ አመ
  choice: когда ещё
  rationale: В ретроспективном историческом высказывании оборот вводит продолжающееся состояние эпохи; русский вариант сохраняет значение одновременности и длительности.
- source_word: ኵነኔ (исправление ошибочно распознанного ጽጌነ)
  choice: суд
  rationale: Критически восстановленное слово означает «суд, правосудие». Выбрано «суд», чтобы не сливать его со следующим ጽድቅ и сохранить исходную этическую пару.
- source_word: ጽድቅ
  choice: праведность
  rationale: Обычное значение ключевого этического термина; оно сохраняет различие между праведностью и предшествующим судом.
- source_word: ትዓገሠ
  choice: пребывали
  rationale: Имперфективная форма в рассказе о прошлом обозначает продолжавшееся состояние. «Пребывали» передаёт длительность и выдерживает возвышенный, но понятный регистр.
theological_decisions:
- issue: Значение «первой недели»
  choice: Символический период истории, названный «первой неделей»
  alternative: Буквальная первая суббота или обычная календарная неделя
  rationale: Литературная структура раздела делит историю на символические недели; перевод не должен направлять читателя к вопросу о соблюдении конкретного субботнего дня.
- issue: Этическая пара в конце стиха
  choice: «суд и праведность»
  alternative: «праведность и справедливость»; «праведность и непорочность»
  rationale: Восстановленное чтение ኵነኔ перед ጽድቅ даёт именно последовательность «суд и праведность». Она сохранена без перестановки и без сведения двух понятий к почти синонимичной русской паре.
- issue: Временное значение заключительной части
  choice: 'Прошедшее продолженное состояние: «когда ещё пребывали»'
  alternative: 'Будущее или предельное значение: «до времени, когда будут пребывать»'
  rationale: Высказывание от первого лица оглядывается на рождение Еноха в первом периоде; имперфективная форма естественно описывает состояние той эпохи. Альтернативное синтаксическое понимание отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Формула «и вот» сохраняет переход в речи, «пребывали» соответствует апокалиптическому регистру, но остаётся понятным. Порядок исходной пары «суд и праведность» сохранён.
