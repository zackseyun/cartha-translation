base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/004.yaml
  text: And after that time there came a great upheaval upon the earth[a], and a voice was heard from heaven[b], and I fell on my face.
translation:
  language: ru
  text: После этого на земле произошло великое потрясение[a], с неба послышался голос, и я пал ниц[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «потрясение», может также означать «смятение», «мятеж» или «сотрясение».
    reason: lexical_alternative
  - marker: b
    text: 'Текст этого оборота труден: форма глагола выглядит как множественное число («они пали»), тогда как суффикс в выражении «моё лицо» указывает на смысл «я пал ниц». Перевод следует чтению, лучше согласующемуся с непосредственным повествованием от первого лица.'
    reason: textual_variant
lexical_decisions:
- source_word: በድኅሬ ውእቱ ጊዜ
  choice: после того времени
  rationale: Сохраняет временную последовательность и указательное значение ውእቱ; оборот звучит несколько возвышенно, но остаётся понятным в повествовании.
- source_word: ሀውክ ዐቢይ
  choice: великое потрясение
  rationale: Передаёт сильное нарушение порядка и апокалиптический масштаб, не сводя выражение исключительно к землетрясению, политическому мятежу или душевному смятению.
- source_word: ዲበ ምድር
  choice: на земле
  rationale: Естественный русский эквивалент пространственного оборота; «земля» соответствует космическому контексту лучше, чем локализованное «страна».
- source_word: ተሰምዐ ቃል እምሰማይ
  choice: с неба послышался голос
  rationale: ቃል допускает значения «слово», «голос» и «звук»; в контексте небесного откровения «голос» наиболее естественен, а глагол сохраняет значение слышимости.
- source_word: ወወደቁ በገጽየ
  choice: и я пал ниц
  rationale: Русский оборот «пал ниц» естественно передаёт падение лицом к земле. Хотя засвидетельствованная форма глагола выглядит множественной, суффикс первого лица в «моё лицо» и непосредственный повествовательный контекст поддерживают понимание от первого лица.
theological_decisions:
- issue: Характер потрясения, обозначенного словом ሀውክ
  choice: широкое апокалиптическое потрясение
  alternative: великое смятение; великий мятеж; сильное сотрясение
  rationale: Выбранное выражение сохраняет образ масштабного нарушения земного порядка и не навязывает конкретное толкование — природное, политическое или психологическое.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис остаётся ясным для широкого читателя; «пал ниц» сохраняет достоинство и традиционную образность без конфессионального уточнения.
