base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/002.yaml
  text: And he lifted up his feet from there and went as far as the ends of the earth[a], and he cried out to his grandfather Enoch, and Noah said with a bitter voice, “Hear me, hear me[d][c][b], hear me,” three times.
translation:
  language: ru
  text: 'И он поднял ноги свои и ушёл оттуда, до краёв земли; и воззвал к своему предку Еноху[a]. И Ной сказал с горечью в голосе: «Услышь меня! Услышь меня! Услышь меня!» — трижды.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к своему деду Еноху». Употреблённое слово может обозначать деда или, шире, старшего предка; в обычной родословной Енох — прадед Ноя.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: አንሥአ፡ እገሪሁ
  choice: двинулся
  rationale: Буквально сочетание говорит о поднятии ног. В современном русском «двинулся» естественно передаёт начало движения, не превращая исходный телесный образ в неуклюжий буквализм.
- source_word: እምህየ፡ ወሖረ
  choice: оттуда и дошёл
  rationale: Передаёт исходную точку и последующее движение к указанному пределу; «дошёл» естественно сочетается с «до краёв земли».
- source_word: አጽናፈ፡ ምድር
  choice: краёв земли
  rationale: Устойчивое возвышенное выражение, сохраняющее космический размах апокалиптического повествования.
- source_word: ጸርኀ
  choice: воззвал
  rationale: Глагол обозначает громкий призыв; «воззвал» сохраняет силу действия и достоинство стиля.
- source_word: ለአምኄው፡ ሄኖክ
  choice: к своему предку Еноху
  rationale: አምኄው указывает на старшего предка, традиционно также «деда». Более широкое русское «предок» не создаёт ложной степени родства, поскольку Енох представлен как прадед Ноя.
- source_word: በቃል፡ መሪር
  choice: с горечью в голосе
  rationale: Естественный современный русский эквивалент буквального «горьким голосом», сохраняющий эмоциональную напряжённость.
- source_word: ስምዐኒ
  choice: Услышь меня
  rationale: Императив с объектным суффиксом передан прямо; форма «услышь» сохраняет настойчивость и возвышенный регистр обращения.
- source_word: ሥልሰ
  choice: трижды
  rationale: Кратко и точно отмечает трёхкратное повторение, явно выраженное в источнике.
theological_decisions:
- issue: Степень родства между Ноем и Енохом
  choice: «своему предку Еноху» с пояснением в сноске
  alternative: «своему деду Еноху»
  rationale: Исходное слово допускает обозначение деда или предка, тогда как в енохической генеалогии Енох — прадед Ноя. Нейтральное «предок» сохраняет направление родства и не вносит генеалогической ошибки.
- issue: Кто является подлежащим при глаголе «сказал»
  choice: «и Ной сказал»
  alternative: Считать имя «Ной» обращением внутри прямой речи
  rationale: В ወይቤ፡ ኖኅ имя Ноя следует за глаголом в обычном для геэз порядке «глагол — подлежащее», поэтому Ной однозначно выступает говорящим.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейско-апокалиптическим звучанием. Синтаксис источника прояснён там, где порядок слов геэз однозначно указывает на Ноя как говорящего; трёхкратный призыв и итоговое «трижды» сохранены.
