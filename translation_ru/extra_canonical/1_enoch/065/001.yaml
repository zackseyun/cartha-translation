base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/001.yaml
  text: In those days Noah saw that the earth had sunk down[a], and that its destruction was near.
translation:
  language: ru
  text: В те дни Ной увидел, что земля осела[a] и что её гибель близка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Соответствующее эфиопское выражение лексически трудно; оно может также означать, что земля просела, обрушилась или была сильно потрясена.
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ፡ መዋዕል
  choice: В те дни
  rationale: Устойчивая временная формула апокалиптического повествования; сохраняет возвышенный, но естественный современный регистр.
- source_word: ርእየ
  choice: увидел
  rationale: Прямое и естественное соответствие глаголу зрительного восприятия, не добавляющее оттенка видения сверх выраженного источником.
- source_word: ምድረ
  choice: земля
  rationale: В контексте грядущей вселенской катастрофы речь, вероятнее всего, идёт о земле в широком смысле, а не только о местной территории или почве.
- source_word: ከመ፡ አጽነነት
  choice: что земля осела
  rationale: Форма лексически трудна; «осела» передаёт видимое физическое проседание или нарушение устойчивости земли, не уточняя механизм.
- source_word: ወከመ፡ ቅሩብ፡ ሐጕላ
  choice: и что её гибель близка
  rationale: «Близка» ясно передаёт значение ቅሩብ, а «её гибель» связывает грядущую катастрофу с только что упомянутой землёй и сохраняет апокалиптическую силу выражения.
theological_decisions:
- issue: Понимать состояние земли как нравственное растление или как физическую неустойчивость
  choice: 'Физическое проседание: «земля осела»'
  alternative: «земля растлилась» или «земля была потрясена»
  rationale: Эфиопская формулировка описывает состояние, которое Ной увидел, и в данном контексте естественно указывает на физическое предвестие катастрофы. Сноска сохраняет лексическую неопределённость, не превращая образ в отвлечённую нравственную оценку.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified апокалиптическим звучанием. Синтаксис остаётся прозрачным для широкого читателя; архаизмы и конфессионально окрашенная терминология не используются.
