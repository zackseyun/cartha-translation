base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/003.yaml
  text: And I said to him[a], “Tell me, what is this that is being done upon the earth? For the earth has labored thus and has been shaken[c][b]; perhaps I will perish with it.”
translation:
  language: ru
  text: 'И я сказал ему: «Скажи мне, что это такое делается на земле? Ведь земля так мучилась и была потрясена[a]; быть может, я погибну вместе с нею[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Ведь земля так изнывала и сотрясалась» или «Ведь земля так страдала и была потрясена». Эфиопский глагол в первой части фразы труден для однозначного истолкования.'
    reason: lexical_alternative
  - marker: b
    text: 'Последнюю фразу можно также понять как прямое выражение страха: «боюсь, как бы мне не погибнуть вместе с нею».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ንግረኒ
  choice: Скажи мне
  rationale: Повелительная форма с местоименным дополнением передана прямой и естественной русской просьбой.
- source_word: ምንት ውእቱ ዘይትገበር
  choice: что это происходит
  rationale: Передаёт вопрос о наблюдаемом, продолжающемся событии и сохраняет указательную силу ውእቱ.
- source_word: ዲበ ምድር
  choice: на земле
  rationale: Естественное современное русское соответствие локативному обороту без ненужной архаизации.
- source_word: እስመ ከመዝ ሰርሐት ምድር
  choice: Ведь земля так мучается
  rationale: Глагол в данном месте труден; «мучается» сохраняет олицетворение и образ тяжкого состояния земли, не сводя его однозначно к родовым мукам.
- source_word: ወአንቀልቅለት
  choice: и сотрясается
  rationale: Передаёт сильное движение или потрясение земли и естественно сочетается с апокалиптической образностью.
- source_word: ዮጊ አነ እትኃጐል ምስሌሃ
  choice: быть может, я погибну вместе с нею
  rationale: ዮጊ допускает значение вероятности или опасения; «быть может» сохраняет неопределённость и не создаёт ложной целевой связи с предшествующим сотрясением земли.
theological_decisions:
- issue: Характер страдания земли
  choice: Земля изображена как сама переживающая космическое потрясение.
  alternative: Речь только о нравственном развращении происходящего на земле либо лишь об обычном землетрясении.
  rationale: Сочетание мучения и сотрясения олицетворённой земли сохраняет широкий апокалиптический образ, не ограничивая его одной нравственной или природной причиной.
- issue: Связь говорящего с участью земли
  choice: Говорящий опасается, что может погибнуть вместе с землёй.
  alternative: Земля сотрясается с целью не допустить его гибели.
  rationale: Пунктуация и передача ዮጊ как «быть может» устраняют неестественное целевое прочтение, сохраняя выраженное в источнике опасение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим тоном. Сохранены олицетворение земли, неопределённость трудного глагола и оттенок вероятности в заключительной фразе; архаические «ибо», «дабы» и неестественное «на земле совершается» не использованы.
