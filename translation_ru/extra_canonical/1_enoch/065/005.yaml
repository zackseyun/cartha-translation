base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/005.yaml
  text: And my grandfather Enoch came and stood beside me[a], and he said to me[b], “Why have you cried out to me with a bitter cry and weeping?”
translation:
  language: ru
  text: 'И пришёл мой дед Енох, встал рядом со мной и сказал мне: «Почему ты воззвал ко мне с горьким криком и плачем?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምሐው*የ
  choice: мой дед
  rationale: Несмотря на повреждённую OCR-транскрипцию, контекст и сопоставление с формой в 65:2 указывают на слово «дед» с притяжательным суффиксом первого лица, а не на сочетание со значением «из моего жилища».
- source_word: መጽአ
  choice: пришёл
  rationale: Основное повествовательное значение глагола движения естественно передаётся русским «пришёл».
- source_word: ቆመ ኀቤየ
  choice: стал рядом со мной
  rationale: Сочетание глагола «стоять/становиться» с указанием близости передаёт непосредственное присутствие Еноха возле говорящего.
- source_word: በምንት
  choice: почему
  rationale: Кратко и естественно выражает вопрос о причине.
- source_word: ጸራሕከ ኀቤየ
  choice: ты воззвал ко мне
  rationale: Глагол обозначает громкий призыв или крик; «воззвал» сохраняет направленность действия и достоинство повествовательного регистра.
- source_word: ጽራኀ መሪረ
  choice: с горьким криком
  rationale: Буквально и компактно сохраняет образ мучительного, исполненного скорби вопля.
- source_word: ብካየ
  choice: плачем
  rationale: Передаёт плач или рыдание и сохраняет усиленный параллелизм двух выражений скорби.
theological_decisions:
- issue: Родство Еноха с говорящим
  choice: «мой дед Енох»
  alternative: «Енох пришёл из моего жилища»
  rationale: Исправленное чтение повреждённой формы обозначает деда с суффиксом первого лица; оно соответствует контексту, где говорит Ной, и не требует искусственного объяснения места, откуда пришёл Енох.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Воззвал» выбрано вместо разговорного «крикнул», поскольку речь идёт о громком, скорбном обращении; синтаксис при этом остаётся ясным для современного читателя.
