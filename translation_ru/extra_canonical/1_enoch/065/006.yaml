base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/006.yaml
  text: And a command went out from before the Lord against those who dwell on the dry land[a], that their end should come; for they knew all the hidden things of the angels, and all the violence of the satans[c][b], and all their secret powers.
translation:
  language: ru
  text: И из присутствия Господа[a] вышло повеление против тех, кто живёт на суше, чтобы пришёл им конец; ибо они узнали все тайны ангелов, всё насилие сатан[b] и все их тайные силы[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от лица Господа». Эфиопское выражение — почтительная формула, обозначающая нечто исходящее из Божьего присутствия.'
    reason: lexical_alternative
  - marker: b
    text: В эфиопском тексте слово «сатаны» стоит во множественном числе; речь не обязательно идёт о позднейшем имени собственном «Сатана» в единственном числе.
    reason: lexical_alternative
  - marker: c
    text: Заключительные слова в этом эфиопском свидетельстве трудны для понимания. Возможен смысл «вся их сокрытая сила»; менее уверенное толкование связывает их с людьми, занимающимися тайными искусствами или колдовством.
    reason: textual_variant
lexical_decisions:
- source_word: ትእዛዝ
  choice: повеление
  rationale: Передаёт властное распоряжение, сохраняя возвышенный тон, но не придавая выражению узкого юридического смысла.
- source_word: ወጽአ እምቅድመ ገጸ እግዚአ
  choice: от лица Господа вышло
  rationale: Сохраняет семитский образ повеления, исходящего из присутствия Господа, и апокалиптический строй фразы.
- source_word: ዲበ እለ የሐድሩ የብስ
  choice: против тех, кто живёт на суше
  rationale: የብስ буквально обозначает сушу или сухую землю; в контексте потопа это сохраняет значимое противопоставление воде. Предлог «против» передаёт направленность суда.
- source_word: ከመ ውእቱ ይኩን ሕልቀትሙ
  choice: чтобы пришёл им конец
  rationale: Сохраняет возможные оттенки конца, гибели и уничтожения, не уточняя способ суда сверх текста.
- source_word: ኵሎ ኅቡኣተ መላእክት
  choice: все тайны ангелов
  rationale: Естественно по-русски передаёт буквально «всё сокрытое ангелов», не вводя специального позднейшего значения слова «мистерии».
- source_word: ግፍዐ ሰይጣናት
  choice: всё насилие сатан
  rationale: ግፍዕ обозначает насилие, притеснение или неправду; множественное число ሰይጣናት сохранено как «сатаны», а не сведено к единственному имени собственному.
- source_word: ኵሎ ኃይሎሙ ኅቡአ ኅቡኣት
  choice: все их тайные силы
  rationale: Передаёт сочетание силы/могущества и сокрытости. Повреждённое или трудное окончание эфиопского свидетельства не развёрнуто в неподтверждённое упоминание колдовства.
theological_decisions:
- issue: Множественное число ሰይጣናት
  choice: сатан
  alternative: Сатаны; противников; демонов
  rationale: Эфиопская форма стоит во множественном числе. Перевод сохраняет местную демонологическую картину и не гармонизирует её с позднейшим представлением о единственном Сатане.
- issue: Круг осуждённых, названных живущими на суше
  choice: те, кто живёт на суше
  alternative: обитатели земли; определённая группа грешников
  rationale: В контексте рассказа о Ное буквальный образ суши, вероятно, связан с грядущим потопом; перевод сохраняет образ, не сужая и не расширяя явно его охват.
- issue: Трудное окончание стиха
  choice: все их тайные силы
  alternative: вся их сокрытая сила; силы занимающихся тайными искусствами
  rationale: Свидетельство допускает неуверенность в числе и синтаксическом членении. Основной текст следует наиболее связному смыслу, а неопределённость отмечена в сноске без введения колдовства как установленного чтения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Семитская формула «от лица Господа» сохранена ради образности и пояснена; синтаксис при этом сделан понятным для обычного современного читателя.
