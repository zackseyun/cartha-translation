base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/011/001.yaml
  text: And in those days I will open the storehouses of blessing that are in heaven[a], so that I may bring them down upon the earth, upon their work and upon their labor[g][f][e][d][c][b], for the children of men.
translation:
  language: ru
  text: И в те дни Я открою хранилища благословения, находящиеся на небе, чтобы низвести их[a] на землю, на дела и труды сынов человеческих.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В исходном тексте местоимение стоит во множественном числе. Формально оно может относиться к «хранилищам»; по смыслу оно может указывать на благословение, понимаемое собирательно.
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: በእማንቱ፡ መዋዕል
  choice: в те дни
  rationale: Устойчивая апокалиптическая временная формула; መዋዕል означает «дни», а не «двери».
- source_word: እፈትሕ፡ መዛግብተ
  choice: Я открою хранилища
  rationale: Глагол передаёт действие будущего времени от первого лица; множественное መዛግብተ обозначает хранилища или сокровищницы. Слова «двери» в исходном тексте нет.
- source_word: በረከት
  choice: благословения
  rationale: Сохраняется единственное число абстрактного существительного, которое может иметь собирательное значение.
- source_word: በሰማይ
  choice: на небе
  rationale: Передаёт единственное число исходного текста естественным современным русским выражением.
- source_word: አውርዶሙ
  choice: низвести их
  rationale: Каузативная форма глагола «сходить» с местоименным объектом 3-го лица множественного числа; «низвести» сохраняет направленность сверху вниз и возвышенный регистр.
- source_word: ግብሮሙ፡ ወዲበ፡ ፃማሆሙ
  choice: на дела и труды
  rationale: ግብር означает дело или работу, а ፃማ — труд, усилие, тяготу; последнее слово не означает «потомство».
- source_word: ለውሉደ፡ ሰብእ
  choice: сынов человеческих
  rationale: Сохранена традиционная енохическая формула; в данном контексте она обозначает людей.
theological_decisions:
- issue: Кто говорит от первого лица
  choice: Сохранено «Я» без добавления имени говорящего.
  alternative: Назвать говорящего Богом или Всевышним.
  rationale: Контекст позволяет понимать говорящего как Бога, однако сам стих не называет его, поэтому имя не добавляется.
- issue: Соотнесение местоимения «их»
  choice: Сохранено местоимение множественного числа с пояснением неоднозначности.
  alternative: Заменить его словами «благословения» или «дары».
  rationale: Форма አውርዶሙ имеет множественное число, тогда как «благословение» в исходном тексте стоит в единственном. Явное уточнение устранило бы грамматико-смысловое напряжение текста.
- issue: Формула «сыны человеческие»
  choice: Сохранена формула «сыны человеческие».
  alternative: Перевести как «люди» или «человечество».
  rationale: Формула характерна для книги Еноха и здесь употреблена в общем значении, без внесения дополнительных богословских смыслов.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Синтаксис упрощён ровно настолько, чтобы фраза оставалась понятной, при этом сохранены небесная образность, первое лицо говорящего и неоднозначность местоимения.
