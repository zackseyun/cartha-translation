base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/011/002.yaml
  text: And peace and truth shall be partners throughout all the days of the world and throughout all the generations of the world[a][b][c][d].
translation:
  language: ru
  text: И мир, и истина будут изобиловать во все дни мира и во все поколения мира[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будут умножаться». Геэзское сочетание выражает множественность или обилие.'
    reason: lexical_alternative
  - marker: b
    text: 'Геэзское слово, переданное как «мира», также может иметь временной смысл: «век», «вечность». Поэтому выражения «все дни мира» и «все поколения мира» могут подразумевать также век или вечность.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ሰላም
  choice: мир
  rationale: Обычное значение геэзского слова; в паре с «истиной» обозначает состояние благополучия и правого порядка.
- source_word: ርትዕ
  choice: истина
  rationale: Передаёт основное значение существительного и сохраняет устойчивую смысловую пару «мир и истина».
- source_word: ሱቱፋነ ይከውኑ
  choice: будут изобиловать
  rationale: Сочетание формы, связанной с множественностью или обилием, с глаголом бытия естественно выражает изобилие; это лучше сохраняет смысл, чем спорное «будут спутниками».
- source_word: በኵሉ
  choice: во все
  rationale: Предлог с универсальным определением выражает всеохватность во времени.
- source_word: መዋዕለ ዓለም
  choice: дни мира
  rationale: መዋዕል — множественное число со значением «дни»; буквальная семитская формула сохранена, хотя всё выражение может иметь оттенок длительности или вечности.
- source_word: ትውልደ ዓለም
  choice: поколения мира
  rationale: Близко передаёт последовательность поколений и сохраняет параллелизм исходной фразы.
- source_word: ዓለም
  choice: мир
  rationale: Сохраняет повтор исходного текста и его широкий временно-пространственный охват; слово также способно иметь значение «век».
theological_decisions:
- issue: Временной охват благословения
  choice: 'Сохранён всеохватный и продолжающийся смысл: «во все дни... и во все поколения».'
  alternative: Отнести слова только к одному будущему эсхатологическому веку.
  rationale: Двойная конструкция с повторяющимся универсальным определением подчёркивает полноту временного охвата, не задавая конкретной эсхатологической схемы.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным ритмом. Повтор «мира» сохранён ради параллелизма оригинала; «изобиловать» естественно передаёт идею обилия без конфессионального уточнения.
