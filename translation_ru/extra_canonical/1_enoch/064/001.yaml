translation:
  language: ru
  text: И увидел я в том месте другие скрытые лица[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «облики»; геэзское слово буквально означает «лица», но в видении может подразумевать явленных людей или существ.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልአ
  choice: другие
  rationale: Прилагательное указывает на дополнительные сущности помимо уже увиденных и согласуется с существительным во множественном числе.
- source_word: ገጻተ
  choice: лица
  rationale: Сохранено основное конкретное значение «лица», чтобы не устранять необычный зрительный образ и не истолковывать его заранее как «людей» или «существ».
- source_word: ርኢኩ
  choice: увидел я
  rationale: Прямо передаёт рассказ от первого лица о видении; постпозиция местоимения поддерживает достоинство библейского повествования без излишней архаизации.
- source_word: በውእቱ መካን
  choice: в том месте
  rationale: Фраза отсылает к уже названному месту видения; буквальная и естественная передача сохраняет эту связь.
- source_word: ኅቡኣተ
  choice: сокрытые
  rationale: Передаёт значение скрытости или сокровенности и сохраняет таинственный апокалиптический оттенок; «скрытые» также возможно, но звучит менее возвышенно.
theological_decisions:
- issue: Следует ли понимать ገጻተ буквально как «лица» или истолковывать как «людей/существ»
  choice: лица
  alternative: люди; существа; облики
  rationale: 'Краткий визионерский текст не даёт достаточных оснований устранять конкретный образ. Буквальная передача сохраняет подлинную неоднозначность: речь может идти как о лицах, так и о явленных через них личностях.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. «Сокрытые» сохраняет таинственность апокалиптического образа, а необычное сочетание «сокрытые лица» намеренно не сглажено.
