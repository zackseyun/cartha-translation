base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/064/002.yaml
  text: And I heard the voice of the angel saying[a], 'These are the angels who came down upon the earth and revealed what was hidden to the children of men[b], and led the children of men astray so that they committed sin.'
translation:
  language: ru
  text: 'И я услышал голос ангела, который говорил: «Это те ангелы, которые сошли на землю, открыли сынам человеческим[b] то, что было сокрыто[a], и ввели сынов человеческих в заблуждение, так что они стали грешить».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «открыли сокрытое». Геэзское выражение говорит о раскрытии того, что прежде было скрыто, но в этом стихе не уточняет, о каких именно тайнах идёт речь.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «сынам человеческим» — характерное для Книги Еноха обозначение людей, человечества.'
    reason: cultural_note
lexical_decisions:
- source_word: ሰማዕኩ
  choice: услышал я
  rationale: Передаёт форму первого лица и естественно вводит услышанное в контексте видения; инверсия поддерживает достоинство повествовательного стиля.
- source_word: ቃሎ ለመልአክ
  choice: голос ангела
  rationale: Хотя ቃል может означать также «слово» или «речь», при глаголе слухового восприятия «голос» наиболее естественно передаёт сцену.
- source_word: እንዘ ይብል
  choice: говорившего
  rationale: Естественно вводит прямую речь и сохраняет связь с существительным «ангела».
- source_word: እሉ ውእቶሙ
  choice: Это те
  rationale: Сохраняет указательно-отождествительную формулу исходного текста.
- source_word: መላእክት እለ ወረዱ ዲበ ምድር
  choice: ангелы, которые сошли на землю
  rationale: Передаёт образ нисхождения, не добавляя отсутствующих в стихе наименований вроде «Стражи» или характеристики «падшие».
- source_word: ወዘበኅቡእ ከሠቱ
  choice: открыли ... то, что было сокрыто
  rationale: Сохраняет противопоставление сокрытия и раскрытия, не уточняя содержание открытого знания.
- source_word: ለውሉደ ሰብእ
  choice: сынам человеческим
  rationale: Сохраняет характерное для енохической литературы собирательное обозначение человечества и возвышенный регистр.
- source_word: ወአስሐትዎሙ
  choice: ввели ... в заблуждение
  rationale: Передаёт причинение ошибки и уклонения, не сужая смысл только до интеллектуального обмана или только до нравственного совращения.
- source_word: ከመ ይግበሩ ኃጢአተ
  choice: так что они стали грешить
  rationale: Естественно выражает последствие совращения; оборот с ከመ допускает оттенки цели и результата, а контекстуально нейтральное «так что» не приписывает тексту более точного намерения, чем он выражает.
theological_decisions:
- issue: Кем были сошедшие ангелы
  choice: «ангелы, которые сошли на землю» без добавления названия «Стражи»
  alternative: «Стражи, сошедшие на землю» или «падшие ангелы»
  rationale: В данном стихе прямо сказано «ангелы»; более специальные обозначения известны из широкого контекста, но не должны вноситься в локальную формулировку.
- issue: Содержание открытого сокрытого
  choice: «то, что было сокрыто»
  alternative: «тайные знания», «небесные тайны» или «запретные искусства»
  rationale: Исходный текст не уточняет здесь содержание открытого; общий перевод сохраняет эту намеренную или контекстуальную неопределённость.
- issue: Цель или результат последующего греха
  choice: «так что они стали грешить»
  alternative: «чтобы они грешили»
  rationale: Конструкция с ከመ может выражать цель или результат. Выбранная русская формулировка естественно передаёт причинную последовательность и не утверждает однозначно, что грех людей был сформулирован как заранее поставленная цель.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Сохранены повтор «сынов человеческих» и апокалиптический образ нисхождения; архаичные синтаксические формы и конфессионально окрашенные добавления не используются.
