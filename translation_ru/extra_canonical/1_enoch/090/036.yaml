  text: And I saw that that house became great and broad and exceedingly full[a][b][c].
translation:
  language: ru
  text: И я увидел, что тот дом стал большим, просторным и переполненным[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В «Апокалипсисе животных» «дом» может символически обозначать святилище или храм, однако в геэзском тексте здесь употреблено просто слово «дом».
    reason: cross_reference
  - marker: b
    text: В тексте не сказано прямо, чем переполнен дом; из ближайшего контекста можно предположить, что речь идёт об овцах.
    reason: ambiguity
lexical_decisions:
- source_word: ወርኢኩ
  choice: И я увидел
  rationale: Передаёт обычную для видения повествовательную формулу от первого лица и сохраняет апокалиптический ритм без архаизации.
- source_word: ከመ ኮነ
  choice: что… стал
  rationale: Конструкция обозначает изменение состояния, а не просто статическое бытие.
- source_word: ውእቱ ቤት
  choice: тот дом
  rationale: Сохраняет указательное местоимение и прямое значение слова «дом», не подменяя его контекстуальным толкованием «храм».
- source_word: ዐቢየ
  choice: великим
  rationale: Сохраняет возможные оттенки как величины, так и значительности; падеж согласован с составным сказуемым после «стал».
- source_word: ወርኂበ
  choice: просторным
  rationale: Естественно передаёт пространственную широту дома; буквальное «широким» по-русски здесь звучало бы менее естественно.
- source_word: ወምሉአ ፈድፋደ
  choice: и чрезвычайно наполненным
  rationale: Передаёт ምሉአ как третье предикативное определение при ኮነ, а ፈድፋደ — как наречный усилитель «чрезвычайно», не превращая его в существительное «изобилие».
theological_decisions:
- issue: Следует ли конкретизировать ቤት как «храм» или «святилище» в контексте Апокалипсиса животных
  choice: дом
  alternative: храм / святилище
  rationale: Хотя символический контекст может указывать на храм или святилище, сам геэзский текст говорит просто о доме. Основной текст сохраняет исходную неоднозначность, а контекстуальное толкование вынесено в примечание.
- issue: Чем именно наполнен дом
  choice: объект наполнения не добавлен
  alternative: наполнен овцами
  rationale: Контекст может подразумевать овец, однако в данном стихе дополнение не выражено. Перевод не вводит его в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Сохранены повторительный зачин видения и трёхчленная характеристика дома; архаизмы и конфессионально окрашенная конкретизация исключены.
