lexical_decisions:
- source_word: አባግዕ
  choice: овцы
  rationale: Прямое соответствие образу овец в видении; сохраняет его без истолкования.
- source_word: ጸጕረ፡ ዚአሆሙ
  choice: шерсть у них
  rationale: Существительное обозначает волосы или шерсть; применительно к овцам естественное русское соответствие — «шерсть».
- source_word: ዐቢየ
  choice: густой
  rationale: Буквально слово передаёт значение «большой, обильный»; о шерсти современное русское «густой» естественно выражает её обилие и согласуется с контекстом.
- source_word: ንጹሐ
  choice: чистой
  rationale: Сохраняет прямое значение «чистый» и не вводит дополнительного символического толкования.
theological_decisions:
- issue: Возможное символическое значение белизны и чистоты
