base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/035.yaml
  text: And the eyes of them all were opened[a], and they saw well[b], and there was not one among them that did not see.
translation:
  language: ru
  text: И открылись глаза у всех них, и они стали хорошо видеть[a], и не было среди них ни одного, кто не видел бы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «увидели добро» либо «увидели хорошее». Эфиопское слово может быть понято как наречие «хорошо» или как обозначение того, что хорошо.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አዕይን
  choice: глаза
  rationale: Конкретный образ глаз соответствует символике «Апокалипсиса животных» и не заменяет образ абстрактным понятием зрения.
- source_word: ተከሥታ
  choice: открылись
  rationale: Естественно передаёт восстановление способности видеть и сохраняет апокалиптический образ открытия глаз.
- source_word: ሠናየ
  choice: хорошо
  rationale: Форма может выполнять наречную функцию «хорошо»; контекст прежней слепоты указывает на восстановленное зрение, а не обязательно на объект «добро».
- source_word: ዘኢይሬኢ አልቦ
  choice: не было ... ни одного, кто не видел бы
  rationale: Сохраняет усиленную отрицательную конструкцию оригинала, не добавляя отсутствующего прямо слова «слепой».
- source_word: በማእከሎሙ
  choice: среди них
  rationale: Естественная русская передача значения присутствия в их числе.
theological_decisions:
- issue: Характер восстановленного зрения в видении
  choice: Сохранён буквальный образ открытия глаз и восстановленного зрения без явного истолкования как духовного просвещения.
  alternative: «Всем им было даровано духовное понимание» или «их духовная слепота была устранена».
  rationale: В символическом мире видений открытые глаза сами несут богословский смысл; перевод не должен заранее разрешать символ и устранять его многозначность.
translation_notes:
  register: Современный литературный русский язык; синтаксис торжественный, но понятный. Повтор корня «видеть» сохранён ради эмфазы оригинала.
