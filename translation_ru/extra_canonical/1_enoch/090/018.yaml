  to: И я смотрел, пока Владыка овец не пришёл к ним. Он взял в руку посох гнева[c] и ударил по земле; земля расселась[a], и все звери и все птицы небесные отпали от тех овец[b], погрузились в землю, и она покрыла их.
  rationale: Исправлена только неоднозначная русская передача отношения зверей и птиц к овцам. Полная форма «отпали от тех овец» яснее отражает отделение, выраженное в исходном тексте и английском аудите, сохраняя последовательность падения и погружения в землю. Сноски и их маркеры сохранены.
