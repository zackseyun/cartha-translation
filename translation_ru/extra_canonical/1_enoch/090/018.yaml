base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/018.yaml
  text: And I saw until the Lord of the sheep came to them, and he took in his hand the staff of wrath and struck the earth; and the earth split open, and all the beasts and all the birds of heaven fell away from among those sheep and sank into the earth, and it covered over them.
translation:
  language: ru
  text: И я смотрел, пока Владыка овец не пришёл к ним. Он взял в руку посох гнева[c] и ударил по земле; земля расселась[a], и все звери и все птицы небесные отпали от тех овец[b], погрузились в землю, и она покрыла их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «земля была рассечена». Геэзское выражение трудно для однозначного перевода, однако дальнейшее повествование подразумевает, что земля разверзлась и существа погрузились в неё.'
    reason: lexical_alternative
  - marker: b
    text: «Звери» и «птицы небесные» продолжают символический язык Апокалипсиса животных и изображают враждебные силы, а не только обычных животных.
    reason: cultural_note
  - marker: c
    text: 'В некоторых переводах: «посох Его гнева». Однако соответствующее местоимение «Его» в геэзском тексте отсутствует.'
    reason: previous_rendering
lexical_decisions:
- source_word: እግዚአ አባግዕ
  choice: Владыка овец
  rationale: Сохраняет одновременно значение господства и образный строй животного апокалипсиса. «Владыка» звучит весомо, но остаётся понятным в современном русском языке.
- source_word: በትር መዓተ
  choice: посох гнева
  rationale: «Посох» поддерживает пастушеский образ, а «гнев» передаёт судебную силу выражения. Притяжательное местоимение в геэзском тексте отсутствует.
- source_word: ዘበጣ ለምድር
  choice: ударил по земле
  rationale: Прямо и естественно передаёт решительное действие удара без архаизации.
- source_word: ተሰጠተ ምድር
  choice: земля расселась
  rationale: Последующее погружение существ в землю указывает на её разверзание. «Расселась» естественно передаёт результат при сохранении некоторой лексической неясности трудного геэзского оборота.
- source_word: ወድቁ እምዝኩ አባግዕ
  choice: пали из среды тех овец
  rationale: Передаёт как движение вниз, так и отделение от овец, не сводя выражение лишь к пространственному падению.
- source_word: ተሰጥሙ በምድር
  choice: погрузились в землю
  rationale: 'Соответствует последовательности образов: существа уходят в разверзшуюся землю, после чего она их покрывает.'
- source_word: ከደነት ዲቤሆሙ
  choice: она покрыла их
  rationale: Женский род местоимения ясно относит действие к земле и сохраняет образ окончательного погребения.
theological_decisions:
- issue: Божественный титул внутри аллегории о животных
  choice: Владыка овец
  alternative: Хозяин овец
  rationale: Выбор сохраняет богословский вес титула и власть над стадом, не вводя позднейшей христологической идентификации.
- issue: Орудие суда
  choice: посох гнева
  alternative: жезл гнева
  rationale: «Посох» удерживает пастушескую образность, тогда как «гнев» передаёт судебный, а не только эмоциональный смысл. Отсутствующее в оригинале местоимение не добавлено.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим регистром. Формула «я смотрел, пока…» сохраняет характер видения; синтаксис разделён на два предложения ради ясности, без ослабления последовательности судебных действий.
