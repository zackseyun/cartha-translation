base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/011.yaml
  text: And with that[a], all those eagles and vultures and ravens and kites kept snatching away the sheep even until now, and swooping down upon them and devouring them; but the sheep remained silent[e][d][c][b], and the rams lamented and cried out.
translation:
  language: ru
  text: И при этом все орлы, грифы, вороны и коршуны[a] вплоть доныне продолжали похищать овец, налетать на них и пожирать их; овцы же молчали, а бараны стенали и кричали.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Названия птиц переданы как четыре разных вида хищных или питающихся падалью птиц; точное отождествление некоторых из них остаётся не вполне уверенным.
    reason: lexical_alternative
lexical_decisions:
- source_word: አንስርት
  choice: орлы
  rationale: Первое название хищной птицы передано конкретно и отлично от следующего названия грифа, чтобы сохранить последовательность образов видения.
- source_word: አውስት
  choice: грифы
  rationale: Обозначает крупных хищных или питающихся падалью птиц; «грифы» сохраняет их отличие от орлов.
- source_word: ቋዓት
  choice: вороны
  rationale: С учётом исправленного отождествления и порядка в геэзском перечне передано как «вороны».
- source_word: ሆባይ
  choice: коршуны
  rationale: С учётом исправленного отождествления передано как «коршуны», после воронов в соответствии с порядком оригинала.
- source_word: ይመስጥዎሙ
  choice: продолжали похищать
  rationale: Глагол выражает насильственное захватывание или унесение, а форма и контекст указывают на продолжающееся действие.
- source_word: ይሰርሩ ዲቤሆሙ
  choice: налетать на них
  rationale: Глагол связан с полётом и стремительным нападением сверху; в контексте хищных птиц «налетать» естественно передаёт образ.
- source_word: ይበልዕዎሙ
  choice: пожирать их
  rationale: «Пожирать» сохраняет интенсивность и жестокость нападения хищных птиц.
- source_word: ያረምሙ
  choice: молчали
  rationale: Прямо передаёт состояние овец без добавления предполагаемой беспомощности.
- source_word: ይቤላት
  choice: бараны
  rationale: Форма распознана как существительное во множественном числе «бараны», а не как часть глагольного выражения; это устраняет ранее созданное ложное противоречие.
- source_word: የአወይዉ ወይጸርኁ
  choice: стенали и кричали
  rationale: Пара глаголов передаёт громкое выражение скорби и бедствия; два отдельных действия сохранены.
theological_decisions:
- issue: Кому приписаны стенания и крик после упоминания молчащих овец
  choice: 'Баранам: «а бараны стенали и кричали»'
  alternative: Приписать плач овцам и тем самым создать напряжение между молчанием и криком
  rationale: Геэзское ይቤላት является существительным «бараны» во множественном числе. Поэтому молчат овцы, а стонут и кричат бараны; богословского или риторического противоречия здесь нет.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Конкретные названия животных и повторяющиеся действия сохранены; синтаксис сделан ясным для обычного читателя без сглаживания образности.
