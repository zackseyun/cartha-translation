base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/027.yaml
  text: And I saw those sheep while they were burning[a], and their bones were burning.
translation:
  language: ru
  text: 'И увидел я тех овец: они горели[a], и кости их горели.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В эфиопском тексте глагол «гореть» повторён и применительно к овцам, и применительно к их костям, что усиливает суровость видения; повтор сохранён в переводе.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢክዎሙ
  choice: увидел я
  rationale: Передаёт глагол зрительного восприятия в первом лице и сохраняет характерную для повествования о видении инверсию без излишней архаизации.
- source_word: እልኩ አባግዕ
  choice: тех овец
  rationale: Сохраняет указательное значение и устойчивый образ овец в «Апокалипсисе животных».
- source_word: እንዘ ይውዕዩ
  choice: они горели
  rationale: Передаёт наблюдаемое продолжающееся действие; двоеточие естественно выражает сопутствующее обстоятельство по-русски, не уточняя, горели они сами или их сжигали.
- source_word: አዕፅምቲሆሙ
  choice: кости их
  rationale: Прямой и конкретный эквивалент анатомического термина; порядок слов поддерживает возвышенный повествовательный регистр.
- source_word: ይውዕዩ
  choice: горели
  rationale: Повтор того же русского глагола сохраняет усиление сурового образа в исходном тексте.
theological_decisions:
- issue: Следует ли смягчить образ суда, заменив горение общим обозначением гибели
  choice: Сохранить прямой образ горения
  alternative: «были уничтожены» или «были истреблены»
  rationale: Исходный текст дважды повторяет глагол горения, распространяя образ даже на кости; обобщение ослабило бы напряжённость апокалиптического видения.
- issue: Уточнять ли залог глагола как пассивный
  choice: Оставить «горели» без уточнения внешнего деятеля
  alternative: «их сжигали» или «они были сожжены»
  rationale: Форма и контекст допускают образ состояния/процесса горения, а явное введение деятеля необоснованно устранило бы неоднозначность.
translation_notes:
  register: Современный литературный русский язык с кратким, dignified апокалиптическим звучанием. Инверсия «увидел я» уместна для повествования о видении; повтор «горели» намеренно не сглажен.
