base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/030.yaml
  text: And I saw all the sheep that were left[a], and every beast that was upon the earth, and all the birds of heaven, falling down and bowing to those sheep, and making petition to them[b], and obeying them in every word.
translation:
  language: ru
  text: И я увидел всех оставшихся овец; а все звери, что были на земле, и все птицы небесные падали ниц и склонялись перед этими овцами, обращались к ним с мольбами и слушались каждого их слова.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слышали их во всяком слове». В данном контексте глагол «слышать» может означать также «внимать» или «слушаться».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢክዎሙ፡ ለኵሎሙ፡ አባግዕ፡ እለ፡ ተርፉ
  choice: И я увидел всех оставшихся овец
  rationale: Сохраняет первое лицо повествователя, объектную конструкцию и смысл уцелевшего остатка, не уточняя характер пережитого суда.
- source_word: ወኵሉ፡ እንስሳ፡ ዘዲበ፡ ምድር፡ ወኵሉ፡ አዕዋፈ፡ ሰማይ
  choice: а все звери, что были на земле, и все птицы небесные
  rationale: «Звери» поддерживает символический язык видения, а «птицы небесные» сохраняет возвышенную библейскую образность. Союз «а» и точка с запятой ясно показывают, что звери и птицы являются субъектами следующих действий, тогда как овцы — объектом глагола «увидел».
- source_word: ይወድቁ፡ ወይሰግዱ፡ ለእልኩ፡ አባግዕ
  choice: падали ниц и склонялись перед этими овцами
  rationale: Передаёт телесное подчинение и почтение, не усиливая выражение до недвусмысленного религиозного поклонения.
- source_word: ወያስተበቍዕዎሙ
  choice: обращались к ним с мольбами
  rationale: Естественно передаёт настойчивую просьбу или прошение и согласуется с общей сценой подчинения.
- source_word: ወይሰምዕዎሙ፡ በኵሉ፡ ቃል
  choice: и слушались каждого их слова
  rationale: В контексте преклонения и мольбы буквальное «слышали» имеет оттенок внимания и повиновения; формулировка сохраняет образ «каждого слова».
theological_decisions:
- issue: Следует ли описывать отношение зверей и птиц к овцам как религиозное поклонение
  choice: 'Передать его как всеобъемлющее подчинение: «падали ниц и склонялись… обращались… с мольбами и слушались»'
  alternative: «Поклонялись» овцам
  rationale: Последовательность действий выражает глубокое почтение и подчинение, однако текст не требует однозначного обозначения этого действия как богопоклонения. Нейтральная формулировка сохраняет богословское напряжение образа.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейско-апокалиптическим звучанием. Точка с запятой устраняет синтаксическую двусмысленность: рассказчик видит оставшихся овец, а звери и птицы совершают последующие действия по отношению к ним.'
