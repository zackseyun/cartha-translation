base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/012.yaml
  text: And those ravens fought and battled with him[a], and they wanted to remove his horn[c][b], but they did not prevail against him.
translation:
  language: ru
  text: И те вороны сражались, бились и боролись с ним[a]. Они хотели отнять у него рог[b], но не смогли одолеть его.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «против него». Предлог буквально означает «с», но контекст описывает враждебную борьбу.'
    reason: lexical_alternative
  - marker: b
    text: «Рог» сохранён как буквальный образ видения; его возможное символическое значение — сила или власть — в переводе не подставляется.
    reason: cultural_note
lexical_decisions:
- source_word: እልኩ ቋዓት
  choice: все те вороны
  rationale: Сочетание передаёт совокупность конкретно названных птиц. Образ воронов сохранён, поскольку он является частью символики видения и не должен заменяться общим словом «птицы».
- source_word: ይትጋደሉ ወይትባአሱ
  choice: сражались и вступали … в бой
  rationale: Два близких глагола переданы раздельно, чтобы сохранить характерное для повествования усиление, но избежать неестественного русского повтора.
- source_word: ምስሌሁ
  choice: с ним
  rationale: Предлог буквально означает «с», тогда как в данном контексте речь идёт о враждебном столкновении. Основной текст сохраняет буквальную форму, а характер отношений ясен из глаголов борьбы.
- source_word: ፈቀዱ
  choice: хотели
  rationale: Передаёт желание или намерение, не усиливая его до уже принятого решения.
- source_word: ያእትቱ ቀርኖ
  choice: отнять у него рог
  rationale: Глагол означает удаление или отнятие; конструкция «отнять у него рог» естественно передаёт направленное на обладателя лишение. «Рог» оставлен как конкретный образ видения.
- source_word: አእህሉዎ
  choice: не смогли одолеть его
  rationale: Передаёт неспособность нападающих добиться цели и их неуспех в борьбе; объектное местоимение выражено естественной русской конструкцией.
theological_decisions:
- issue: Следует ли истолковывать рог в основном тексте как силу, власть или правление
  choice: Сохранить буквальное «рог»
  alternative: Передать как «сила», «власть» или «правление»
  rationale: Видение строится на последовательной апокалиптической символике. Истолкование образа непосредственно в переводе устранило бы его многозначность и вышло бы за пределы исходной формулировки.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Парные глаголы борьбы сохранены без архаизации; символический образ рога не истолкован внутри основного текста.
