base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/022.yaml
  text: And he said to that man who was writing before him[a], who was one of those seven white ones, and he said to him, “Take those seventy shepherds to whom I delivered the sheep; and they, taking them[c][b], killed many more than I commanded them.”
translation:
  language: ru
  text: 'И он сказал тому мужу, который писал перед ним и был одним из тех семи, облачённых в белое, и сказал ему: «Возьми тех семьдесят пастухов, которым Я вверил овец: получив овец, они убили гораздо больше, чем Я им повелел»[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: То есть пастухи превысили меру, установленную данным им повелением; текст не говорит, что им вовсе не было велено убивать овец.
    reason: alternative_reading
lexical_decisions:
- source_word: ብእሲ
  choice: муж
  rationale: Слово обозначает мужчину; «муж» сохраняет достоинство и антропоморфный облик небесного писца, не превращая обозначение в толкование его природы.
- source_word: ዘይጽሕፍ በቅድሜሁ
  choice: который писал перед ним
  rationale: Передаёт продолженное действие в повествовании и пространственное значение «перед ним / в его присутствии».
- source_word: ፯እምነ ዝኩ ፯ጻዕዳው
  choice: одним из тех семи облачённых в белое
  rationale: Естественно передаёт цветовой признак небесных существ, не повторяя слово «муж» и не уточняя их природу как ангелов.
- source_word: ንሥኦሙ
  choice: Возьми
  rationale: Широкое значение глагола сохраняет неуточнённым, идёт ли речь о задержании, отведении или взятии под стражу.
- source_word: ፸ኖሎት
  choice: семьдесят пастухов
  rationale: Сохранён ключевой пастушеский образ апокалиптического видения без истолковывающей замены на «ангелов» или «правителей».
- source_word: መጠውክዎሙ
  choice: Я вверил
  rationale: Передаёт не только передачу овец, но и поручение их чужой ответственности; возможная более буквальная передача отмечена в сноске.
- source_word: አባግዐተ
  choice: овец
  rationale: Сохраняет повторяющийся символический образ овец, а не заменяет его собирательным словом «стадо».
- source_word: ነሢኦሙ ቀተሉ
  choice: приняв их, они погубили
  rationale: Сохраняет последовательность причастного и личного глагольных действий; «погубили» естественно для образного рассказа об овцах и передаёт смысл убийства.
- source_word: ብዙኃነ እምዘ አዘዝክዎሙ
  choice: гораздо больше, чем Я им повелел
  rationale: Формулировка показывает, что пастухи превысили установленную им меру, не устраняя напряжение между данным повелением и злоупотреблением поручением.
theological_decisions:
- issue: Кем являются семьдесят пастухов
  choice: В основном тексте оставлено символическое наименование «семьдесят пастухов».
  alternative: «семьдесят ангелов» или «семьдесят правителей»
  rationale: Прямое истолкование сузило бы намеренно образный язык Апокалипсиса животных.
- issue: Характер повеления об уничтожении овец
  choice: Пастухи погубили больше, чем им было повелено.
  alternative: Они убивали вовсе без повеления либо погубили больше предопределённого.
  rationale: Эфиопский оборот указывает на превышение порученной меры, а не на полное отсутствие дозволения; это сохраняет богословское напряжение текста.
- issue: Повтор формулы речи
  choice: Сохранено возобновляющее «он сказал ему» после описания писца.
  alternative: Сгладить предложение, оставив только один глагол речи.
  rationale: В исходном тексте формула ወይቤሎ повторяется после вставного описания; сохранение повтора передаёт апокалиптическую повествовательную манеру.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной повествовательной интонацией. Возобновляющий повтор «он сказал ему» сохранён как особенность исходного текста. Заглавная буква в местоимении «Я» указывает на говорящего Владыку внутри русской религиозной издательской традиции, не добавляя имени или титула.
