  to: 'И он сказал тому мужу, который писал перед ним и был одним из тех семи, облачённых в белое, и сказал ему: «Возьми тех семьдесят пастухов, которым Я вверил овец: получив овец, они убили гораздо больше, чем Я им повелел»[b].'
  rationale: 'Исправление делает отношение «получив овец» недвусмысленным, передаёт исходное «убили» прямо и сохраняет все существенные элементы текста: писца перед говорящим, его принадлежность к семи белым фигурам, повторную формулу речи, семьдесят пастухов, вверение им овец и превышение ими повеления. Сноска a удалена: выбранное «вверил» прозрачно передаёт смысл и не требует текстологического или смыслового уточнения; сноска b сохранена и согласована с основным текстом.'
