base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/017.yaml
  text: And I saw until that man[a], who was writing a book by the word of the Lord, opened that book of destruction which those twelve shepherds had wrought[e][d][c][b], and he showed before the Lord of the sheep that they had destroyed much more than those before them.
translation:
  language: ru
  text: И я видел до тех пор, пока тот человек[a], писавший книгу по слову Господа, не открыл ту книгу разорения, причинённого этими двенадцатью пастухами[b], и не показал перед Господом овец[c], что они погубили гораздо больше, чем их предшественники[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тот муж». В видении это небесная фигура, ведущая запись, однако исходный текст прямо не называет её ангелом.'
    reason: cultural_note
  - marker: b
    text: Эфиопская относительная конструкция трудна. Буквально она связывает «книгу разорения» с тем, что сделали двенадцать пастухов; перевод передаёт смысл как запись о разорении, причинённом ими.
    reason: textual_variant
  - marker: c
    text: «Господь овец» — особый титул в символическом мире видения о животных; под овцами изображён народ.
    reason: cultural_note
  - marker: d
    text: 'Буквально: «гораздо больше, чем те, кто был прежде них». Имеются в виду предшествующие пастухи; иной традиционный смысловой перевод: «сверх назначенной им меры».'
    reason: textual_variant
lexical_decisions:
- source_word: ወርኢክዎ … እስከ
  choice: И я видел до тех пор, пока
  rationale: Сохраняет повторяющуюся в главе формулу видения с እስከ («до тех пор, пока / пока не»), хотя по-русски она звучит несколько торжественно.
- source_word: ብእሲ
  choice: человек
  rationale: Буквальное значение — «мужчина, человек». Перевод не уточняет, ангел ли это или небесный писец, и тем самым сохраняет образность видения.
- source_word: ዘይጽሕፍ መጽሐፈ
  choice: писавший книгу
  rationale: Причастная конструкция естественно передаёт продолжающееся действие и сохраняет конкретный образ небесной записи.
- source_word: በቃለ እግዚአ
  choice: по слову Господа
  rationale: Выражает действие по повелению или полномочию Господа, не добавляя отсутствующей в тексте детализации.
- source_word: ፈትሖ ለውእቱ መጽሐፈ
  choice: открыл ту книгу
  rationale: Глагол прямо означает «открыл»; вариант «снял печать» внёс бы в образ не обозначенную в исходном тексте печать.
- source_word: መጽሐፈ ሐጕል
  choice: книга погибели
  rationale: Существительное обозначает погибель, уничтожение или разорение. «Книга погибели» сохраняет краткий и возвышенный характер выражения.
- source_word: ዘአሕጐሉ እልኩ ፲ወ፪የአቱ ይኃርያን
  choice: о погибели, которую учинили эти двенадцать пастухов
  rationale: В эфиопском относительная конструкция синтаксически трудна. Русская формулировка связывает книгу с разрушительными деяниями пастухов, не создавая нелогичного впечатления, будто они уничтожили саму книгу.
- source_word: አርአዩ
  choice: показал
  rationale: Форма передана как единственное число и соотнесена с упомянутым человеком; глагол сохраняет наглядный, почти судебный оттенок предъявления записи.
- source_word: ፈድፋደ እምቅድሜሆሙ
  choice: гораздо больше, чем их предшественники
  rationale: እምቅድሜሆሙ буквально указывает на тех, кто был прежде них. Перевод не вводит отсутствующее слово «повелено» и сохраняет сравнение с предыдущими пастухами.
- source_word: ቅድመ እግዚአ አባግዕ
  choice: перед Господом овец
  rationale: Сохранён особый титул Бога внутри символического мира видения о животных, а не заменён общим обозначением.
theological_decisions:
- issue: Кем является человек, писавший книгу
  choice: Назвать его «тем человеком», не уточняя его природу.
  alternative: «тот ангел» или «ангел-писец»
  rationale: Исходное слово означает «человек»; небесный контекст может предполагать ангельскую фигуру, но прямо этого здесь не сказано.
- issue: Смысл превышения, допущенного двенадцатью пастухами
  choice: Сравнить число погубленных ими с числом погубленных их предшественниками.
  alternative: Они превысили назначенную им меру или данное им повеление.
  rationale: Фраза እምቅድሜሆሙ непосредственно означает «чем бывшие прежде них / чем их предшественники». Мотив превышения порученной меры присутствует в более широком контексте, но вводить его в основной текст данного стиха было бы интерпретационным расширением.
- issue: Титул «Господь овец»
  choice: Сохранить «Господь овец».
  alternative: «Господь» или «Бог»
  rationale: Титул принадлежит собственной символике Апокалипсиса животных и важен для богословского и литературного строя видения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, визионерским звучанием. Формула «И я видел до тех пор, пока… не…» намеренно сохранена ради повторяющейся структуры главы. Лексика «погибель», «погубили», «Господь овец» удерживает образные и судебные мотивы исходного текста без конфессиональной конкретизации.
