  terminology: «Господь овец» удачно сохраняет внутренний титул образного мира видения. «Книга погибели» возможна, но для современного русского «книга разорения» в данном контексте яснее передаёт разрушительный смысл без добавления позднейшей богословской терминологии. «Тот человек» не идентифицирует фигуру сверх текста.
