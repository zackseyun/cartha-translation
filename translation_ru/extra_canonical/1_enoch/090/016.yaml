base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/016.yaml
  text: And all the eagles and the vultures and the ravens and the kites gathered together and came with them, with all the wild sheep; and they all came together and helped one another so as to break the horn of that ram.
translation:
  language: ru
  text: И собрались все орлы, грифы, вороны и коршуны, и вместе с ними пришли все дикие овцы; все они сошлись и стали помогать друг другу, чтобы разбить рог того барана.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንስርት
  choice: орлы
  rationale: Обычное соответствие геэзскому названию хищных птиц; сохраняет последовательность образов.
- source_word: ዓውስት
  choice: грифы
  rationale: Передаёт крупную птицу-падальщика и отличает её от орлов и коршунов в перечне.
- source_word: ቋዓት
  choice: вороны
  rationale: Прямое и естественное русское обозначение птиц рода воронов.
- source_word: ሀባይ
  choice: коршуны
  rationale: Контекст перечня хищных птиц и традиционное понимание слова поддерживают этот перевод.
- source_word: አባግዕ፡ ገዳም
  choice: дикие овцы
  rationale: Сохраняет буквальный зооморфный образ «овцы поля/пустыни», не заменяя его предполагаемым историческим референтом.
- source_word: ይቀትቅጥዎ
  choice: сломить
  rationale: Передаёт усиленное действие сокрушения или разбивания и естественно сочетается в русском с символическим «рогом».
- source_word: ቀርነ፡ ... ይቤላ
  choice: рог того барана
  rationale: Передаёт определённый символический образ без истолкования его исторической личности.
theological_decisions:
- issue: Историческая идентификация животных и рога
  choice: Сохранены зооморфные символы видения
  alternative: Заменить животных и рог названиями народов, войск или правителей
  rationale: Сам текст говорит образами и не раскрывает здесь однозначно все исторические соответствия; перевод не должен подменять видение толкованием.
- issue: Характер уничтожения рога
  choice: «сломить рог»
  alternative: «разбить», «сокрушить» или «уничтожить рог»
  rationale: «Сломить» сохраняет силу исходного глагола, но не уточняет сверх текста, было ли действие буквальным разрушением, военным поражением или прекращением власти.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис слегка упрощён для ясности, при этом повторное совместное действие участников и символическая образность оригинала сохранены.
