base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/031.yaml
  text: And after that[a], those three clothed in white who had taken me by the hand, who had brought me up before, and the hand of that ram holding me[c][b], brought me up and set me down in the midst of those sheep before the judgment took place.
translation:
  language: ru
  text: И после этого те трое, одетые в белое, которые взяли меня за руку и прежде возвели меня[a], и рука того овна, державшая меня[b], возвели меня и поместили среди тех овец[c], прежде чем свершился суд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Слова «которые прежде возвели меня» в доступном тексте заключены в скобки и текстуально трудны; перевод передаёт наиболее вероятный смысл: прежде они уже возвели Еноха.'
    reason: textual_variant
  - marker: b
    text: В доступной транскрипции соответствующее слово повреждено; по контексту и вероятному чтению речь идёт об овне — одной из символических фигур «Апокалипсиса животных».
    reason: textual_variant
  - marker: c
    text: «Овцы» принадлежат символическому языку «Апокалипсиса животных», где человеческие сообщества представлены в образах животных; сам образ оставлен без поясняющей подстановки в основном тексте.
    reason: cultural_note
lexical_decisions:
- source_word: ወእምኔሁ
  choice: И после этого
  rationale: Передаёт временное значение выражения; чтение «из их числа» здесь не соответствует форме геэзского текста.
- source_word: እልኩ ፫እለ ይለብሱ ጸዓዳወ
  choice: те трое, одетые в белое
  rationale: Числительное оставлено без добавления «мужчины» или «ангелы», поскольку разряд этих существ прямо не назван; образ белого одеяния сохранён.
- source_word: አኃዙኒ በእዴየ
  choice: взяли меня за руку
  rationale: Естественно передаёт жест сопровождения без излишне резкого оттенка «схватили».
- source_word: እለ ቀደሙ አዕረጉኒ
  choice: которые прежде возвели меня
  rationale: ቀደሙ передано наречием «прежде», а повторяющийся глагол восхождения — словом «возвели».
- source_word: እዴሁ ለውእቱ ዴቤላ እንዘ ትእኅዘኒ
  choice: державшая меня рука того овна
  rationale: Следует обоснованному исправлению повреждённого ይቤላ на ዴቤላ и сохраняет значимую для «Апокалипсиса животных» фигуру овна, не устраняя необычную конструкцию с рукой.
- source_word: አዕረጉኒ ወአንበሩኒ ማእከሎሙ ለዝኩ አባግዕት
  choice: подняли меня и поместили среди тех овец
  rationale: Сохраняет движение вверх и последующее размещение внутри группы; символический образ овец не истолковывается в основном тексте.
- source_word: እንበለ ትኩን ኵነኔ
  choice: прежде чем свершился суд
  rationale: Передаёт временную отнесённость сцены к ещё не совершившемуся суду и сохраняет торжественный апокалиптический регистр.
theological_decisions:
- issue: Кем были трое в белом
  choice: «те трое, одетые в белое» без уточнения их природы
  alternative: «три ангела» или «три мужа»
  rationale: В предоставленном геэзском тексте они не названы прямо ни ангелами, ни людьми; перевод не должен заранее разрешать эту неопределённость.
- issue: Идентификация символической фигуры, чья рука держит Еноха
  choice: «того овна»
  alternative: «того» или «того существа»
  rationale: Контекст «Апокалипсиса животных» и текстологическое исправление OCR-чтения поддерживают значение «овен»; обезличенный перевод утратил бы важный элемент образа.
- issue: Временное значение заключительной фразы
  choice: «прежде чем свершился суд»
  alternative: «пока не настал суд»
  rationale: Выбранное чтение ясно помещает действие перед судом, не добавляя конфессионального толкования природы этого суда.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной апокалиптической интонацией. Необычное сочинение «трое… а также рука… подняли» слегка сглажено, однако не устранено, чтобы сохранить синтаксическое напряжение и образность источника. Использовано «свершился суд» как dignified, но не архаическое выражение.
