base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/006.yaml
  text: And behold[a], lambs were born from those white sheep, and their eyes began to be opened, and they saw[b], and they cried out to the sheep.
translation:
  language: ru
  text: И вот, от тех[a] белых овец родились ягнята; они начали открывать глаза, видеть и кричать овцам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от этих белых овец»; указательное слово допускает как более дальнее, так и более близкое указание.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ነዋ
  choice: И вот
  rationale: Сохраняет указательно-восклицательную частицу и характерный для повествования о видении переход, оставаясь естественным в современном русском языке.
- source_word: መንስኣት
  choice: ягнята
  rationale: Поддерживает сквозную образность Апокалипсиса животных и не заменяет конкретный образ общим словом «потомство».
- source_word: ተወልዱ
  choice: родились
  rationale: Передаёт прямое значение глагола рождения без привнесения оттенка зачатия или сотворения.
- source_word: እምዝኩ አባግዕት ጻዓዳ
  choice: от тех белых овец
  rationale: Сохраняет исходную конструкцию происхождения, указательное слово и символически значимое обозначение цвета.
- source_word: አኃዙ
  choice: начали
  rationale: Передаёт начинательное значение глагола и вводит ряд последующих зависимых действий.
- source_word: አዕይንቲሆሙ ይከሠቱ
  choice: открывать глаза
  rationale: Естественно по-русски передаёт образ начинающегося прозрения при сохранении зависимости от глагола «начали».
- source_word: ወይርእዩ
  choice: видеть
  rationale: Сохраняет буквальный мотив зрения и синтаксический параллелизм зависимых действий.
- source_word: ወይጸርኁ ኀበ አባግዕ
  choice: с криком обращаться к овцам
  rationale: Передаёт громкий возглас и его направленность к овцам, не уточняя сверх текста, звали ли ягнята овец к себе или возвещали им что-либо.
theological_decisions:
- issue: Сохранение образов животных в символическом видении
  choice: ягнята … белые овцы … овцы
  alternative: детёныши … белые … стадо
  rationale: Конкретные образы составляют смысловую ткань Апокалипсиса животных; их абстрагирование преждевременно истолковало бы символику.
- issue: Синтаксическая зависимость трёх последующих действий от начинательного глагола
  choice: начали открывать глаза, видеть и с криком обращаться
  alternative: их глаза начали открываться, и они увидели и воззвали
  rationale: Формы геэзского текста образуют параллельный ряд после አኃዙ («начали»). Перевод сохраняет эту связь и не превращает действия в отдельные завершённые события.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном повествования о видении. Синтаксис сделан ясным для широкого читателя, но сохранены повторяющиеся животные образы и последовательность исходных глагольных форм.
