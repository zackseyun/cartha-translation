base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/034.yaml
  text: And I saw until they laid aside that sword which had been given to the sheep[a], and they brought it into the house and sealed it before the face of the Lord; and all the sheep were summoned into that house[e][d][c][b], and it did not contain them.
translation:
  language: ru
  text: И видел я, как тот меч, который был дан овцам, положили, затем внесли его в дом и запечатали пред лицом Господа[a]. И все овцы были созваны в тот дом[b], и дом не вместил их[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Пред лицом Господа» — буквальное семитское выражение со значением «в присутствии Господа».
    reason: lexical_alternative
  - marker: b
    text: В символике видения «дом» может означать храм или грядущее жилище Божьего народа, однако в самом тексте сказано просто «дом».
    reason: cultural_note
  - marker: c
    text: Заключительные слова означают, что дом не мог вместить всех овец.
    reason: lexical_alternative
lexical_decisions:
- source_word: አሰከብዎ
  choice: положили
  rationale: Глагол буквально выражает действие «положить, заставить лечь». В отношении меча «положили» сохраняет конкретность исходного образа и не добавляет идеи окончательного отказа от оружия.
- source_word: ሰይፍ
  choice: меч
  rationale: Обычное обозначение меча; сохраняет предметный апокалиптический образ.
- source_word: ተውህበ ለአባግዕ
  choice: был дан овцам
  rationale: Пассивная форма и адресат передачи воспроизведены прямо; «овцы» сохраняют последовательную символику видения.
- source_word: አግብእዎ ውስተ ቤት
  choice: внесли его в дом
  rationale: Местоименный объект относится к мечу. «Внесли» естественно передаёт перемещение неодушевлённого предмета внутрь дома.
- source_word: ኀተማ እምቅድመ ገጹ ለእግዚእ
  choice: запечатали пред лицом Господа
  rationale: Сохранён семитский образ присутствия «пред лицом», понятный в возвышенном русском регистре; титул передан как «Господь» без дополнительной христологической конкретизации.
- source_word: ተጸውዑ
  choice: были созваны
  rationale: Пассивная форма и значение официального призыва к собранию переданы без указания не названного в тексте деятеля.
- source_word: ወኢያገምሮሙ
  choice: но он не вместил их
  rationale: Глагол непосредственно означает «вмещать, содержать». Местоимение «он» естественно относится к ближайшему существительному «дом»; противительный союз делает смысловую связь по-русски ясной.
theological_decisions:
- issue: Значение дома в символике видения
  choice: дом
  alternative: храм; эсхатологическое жилище Божьего народа
  rationale: В геэзском тексте стоит общее слово «дом». Возможный символический смысл не вводится в основной перевод, чтобы не устранять намеренную образность.
- issue: Передача титула ለእግዚእ
  choice: Господа
  alternative: Владыки
  rationale: «Господь» соответствует торжественному контексту и переводит титул, не привнося более узкой конфессиональной интерпретации.
- issue: Референт в заключительной фразе
  choice: дом не вместил овец
  alternative: не названный явно субъект не вместил их
  rationale: Ближайший грамматический и смысловой антецедент — дом, однако эта связь отмечена как вероятная, а не превращена в символическое истолкование.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Оборот «пред лицом Господа» намеренно сохранён ради образности исходного текста; остальной синтаксис упрощён до естественного современного порядка слов.
