base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/009.yaml
  text: And I saw until horns came out for those lambs[a], and the ravens cast down their horns. And I saw until one great horn sprouted on one of those sheep[c][b], and their eyes were opened.
translation:
  language: ru
  text: И видел я, что у тех ягнят выросли рога, а вороны сбили их рога. И видел я, как у одной из тех овец вырос один большой рог, и глаза их открылись.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «глаза их открылись»; в образном строе видения это может означать восстановление зрения, восприятия или осознания.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አቅርንት / ቀርን
  choice: рога / рог
  rationale: Сохраняет повторяющийся апокалиптический образ силы и власти; зоологическое уточнение здесь не требуется.
- source_word: መኃስእ
  choice: ягнята
  rationale: По контексту видения и уточнённым лексикографическим данным речь идёт о молодых овцах, а не об оленях.
- source_word: ቋንት
  choice: вороны
  rationale: Естественное русское обозначение враждебных птиц семейства врановых в символическом ряду видения.
- source_word: ያወድቅዎሙ
  choice: сбили
  rationale: Передаёт каузативное значение «заставили упасть» и сохраняет энергичность сцены, не уточняя способ действия.
- source_word: በቈለ
  choice: вырос
  rationale: Естественно передаёт органическое появление рога; буквальное «пророс» по-русски звучало бы нарочито.
- source_word: ፩ቀርን ዓቢይ
  choice: один большой рог
  rationale: Сохраняет явно выраженное числительное и величину рога без истолкования его носителя.
- source_word: አባግዕ
  choice: овцы
  rationale: Прямой эквивалент, сохраняющий систему образов Апокалипсиса животных.
- source_word: ተከሥተ አዕይንቲሆሙ
  choice: глаза их открылись
  rationale: Близко передаёт пассивное выражение и сохраняет возможный смысл обретённого восприятия без его истолкования.
theological_decisions:
- issue: Зоологическая идентификация መኃስእ
  choice: ягнята
  alternative: олени
  rationale: Лексикографическое уточнение и ближайший контекст указывают на молодняк овец; это также сохраняет внутреннюю образную последовательность повествования.
- issue: Историческая идентификация большого рога
  choice: оставить образ без исторического имени
  alternative: назвать Иуду Маккавея или другого вождя
  rationale: Сам стих даёт символический образ, но не истолковывает его; перевод не должен превращать предполагаемое толкование в текст.
- issue: Смысл открытия глаз
  choice: сохранить буквальный образ
  alternative: передать как духовное прозрение или восстановление осознания
  rationale: Фраза допускает символическое понимание, но не определяет его однозначно.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Повтор «И видел я» сохранён как структурная формула видения; символика рогов и неопределённость последней фразы не истолкованы в основном тексте.
