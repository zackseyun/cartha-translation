base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/013.yaml
  text: And I saw until the shepherds and the eagles and the vultures and the kites came[a], and they cried out to the ravens to break the horn of that ram; and they fought and battled with him, and he fought with them[c][b], and cried out that his help might come.
translation:
  language: ru
  text: И я видел, как пришли пастыри, орлы, грифы и коршуны; они крикнули воронам, чтобы те сломали рог того барана. И они вступили с ним в бой и сражались, и он сражался с ними и взывал, чтобы пришла к нему помощь[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы пришёл его помощник».'
    reason: Эфиопское слово может обозначать как помощь, так и помощника.
lexical_decisions:
- source_word: ኖላዊያን
  choice: пастыри
  rationale: Сохраняет устойчивый апокалиптический образ назначенных надзирателей; слово понятно в возвышенном библейском регистре.
- source_word: አንስርት
  choice: орлы
  rationale: Передаёт отдельную категорию хищных птиц в символическом перечне, не смешивая её с грифами.
- source_word: አውስት
  choice: грифы
  rationale: Сохраняет присутствующий в эфиопском тексте отдельный вид хищных птиц, пропуск которого исказил бы перечень.
- source_word: ወሀባይ
  choice: и коршуны
  rationale: Наиболее вероятное в данном перечне обозначение ещё одной хищной птицы; видовое отождествление не вполне бесспорно.
- source_word: ቋዓት
  choice: воронам
  rationale: Форма с предлогом обозначает адресатов крика; речь идёт о врановых, для енохической образности принято 'вороны'.
- source_word: ይቀትቅጥዎ
  choice: чтобы те сломали
  rationale: Передаёт побуждение к насильственному разрушению рога, не усиливая глагол до непременно полного сокрушения.
- source_word: ቀርኖ ለዝኩ ይቤላ
  choice: рог того барана
  rationale: Передаёт синтаксическую связь рога с указанным бараном и сохраняет символический образ без исторического истолкования.
- source_word: ረዳኢቱ
  choice: помощь
  rationale: Отглагольное существительное допускает понимание как помощи либо помощника; в основном тексте естественно звучит абстрактное значение, а личное оставлено в примечании.
theological_decisions:
- issue: Историческая идентификация участников видения
  choice: Сохранены буквальные образы пастырей, хищных птиц, воронов и барана.
  alternative: Заменить образы предполагаемыми народами, правителями или войсками.
  rationale: Сам текст выражает смысл через апокалиптическую зооморфную символику и не требует от перевода закреплять одну историческую реконструкцию.
- issue: Природа ожидаемого содействия
  choice: «чтобы пришла к нему помощь»
  alternative: «чтобы пришёл его помощник»
  rationale: Эфиопское существительное допускает как отвлечённое, так и личное понимание; основной текст сохраняет естественную неопределённость, а альтернатива отмечена сноской.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Пастыри» выбрано как термин апокалиптического образа; остальной синтаксис сделан ясным и естественным. Маркер [a] помещён непосредственно после двусмысленного слова.
