base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/014.yaml
  text: And I saw until that man came[a], the one who had written down the names of the shepherds, and he brought them up before the Lord of the sheep; and he helped him and rescued him[c][b], and he showed him everything concerning the downfall of his helper.
translation:
  language: ru
  text: И я видел, пока не пришёл тот человек, который записал имена пастухов и представил их Господу овец. Он помог ему и спас его, а тому барану показал всё, что касалось сошествия его помощника.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Заключительная фраза в дошедшем геэзском тексте трудна. Слово መራደ можно понимать как «нисхождение, сошествие»; предлагались также переводы, связывающие его с падением или, шире, со всем вмешательством помощника.
    reason: textual_variant
lexical_decisions:
- source_word: ብእሲ
  choice: человек
  rationale: Обычное значение — мужчина или человек. Хотя в видении это небесный служитель, исходный образ не следует конкретизировать словом «ангел».
- source_word: ዘጸሐፈ አስማቲሆሙ ለኖሎት
  choice: который записал имена пастухов
  rationale: Передаёт предшествующее действие и сохраняет документально-судебный оттенок записи имён.
- source_word: ያዐርግ ቅድሜሁ ለእግዚአ አባግዕ
  choice: представил их Господу овец
  rationale: Глагол буквально связан с восхождением, но здесь обозначает доставление и представление записанных имён перед божественным Судьёй; русское «представил» естественно передаёт судебную сцену.
- source_word: ረዳኦ ወአድኃኖ
  choice: помог ему и спас его
  rationale: 'Два глагола сохранены раздельно: первый означает оказание помощи, второй — избавление или спасение от опасности.'
- source_word: ይቤላ
  choice: баран
  rationale: Существительное обозначает барана и отсылает к предводителю из предыдущего контекста; его нельзя растворять в общем слове «овца» или опускать.
- source_word: ኵሎ መራደ ለረዳኢቱ
  choice: всё, что касалось сошествия его помощника
  rationale: መራደ, вероятно, обозначает нисхождение или сошествие. Описательная конструкция сохраняет предмет откровения, не превращая его без достаточных оснований в «падение» помощника.
theological_decisions:
- issue: Кем является «тот человек»
  choice: Сохранено обозначение «человек» без уточнения его природы.
  alternative: ангел; небесный писец
  rationale: В данном месте геэзский текст называет его человеком, хотя роль персонажа имеет небесный характер. Перевод не должен снимать эту образную напряжённость.
- issue: Титул እግዚአ አባግዕ
  choice: Господь овец
  alternative: владыка овец; хозяин овец
  rationale: Это повторяющееся в аллегории божественное именование; «Господь» сохраняет возвышенный регистр и богословский вес титула.
- issue: Референты местоимений в заключительной части
  choice: Местоимения «ему/его» сохранены, а косвенный объект последнего глагола уточнён как «тому барану».
  alternative: Повторить «баран» во всех трёх случаях.
  rationale: Исходный текст употребляет местоименные суффиксы, но в конце явно называет барана. Русский текст сохраняет эту структуру и не устанавливает сверх необходимого, к кому именно относится притяжательное «его».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным регистром. Синтаксис сделан ясным для обычного читателя, при этом сохранены аллегорические наименования «пастухи», «Господь овец» и «баран», а не введены истолковывающие обозначения.
