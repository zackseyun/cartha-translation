    issue: Временной союз в начале стиха
    rationale: 'Геэзское እስከ указывает на предел продолжения видения: «я видел, пока не пришёл». Русское «как пришёл» возможно в значении восприятия события, но не воспроизводит этот временной нюанс столь точно.'
