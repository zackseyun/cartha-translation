base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/026.yaml
  text: And I saw at that time that a similar deep abyss was opened in the middle of the earth[a], full of fire; and they brought those blinded sheep, and all of them were judged and were found to be sinners, and they were cast into that deep abyss of fire, and they burned[f][e][d][c][b]. And this abyss came to be at the right side of that house.
translation:
  language: ru
  text: И увидел я в то время, как посреди земли разверзлась такая же глубокая бездна[a], полная огня. Туда привели тех ослеплённых овец[b]; всех их судили и признали грешниками[c], бросили в эту глубокую огненную бездну, и они горели. Эта бездна оказалась справа от того дома.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «глубокая яма». Эфиопское слово обозначает большую глубину; «бездна» сохраняет апокалиптический характер образа.'
    reason: lexical_alternative
  - marker: b
    text: '«Ослеплённые овцы» — продолжение символического образного ряда Апокалипсиса животных: в видении овцы представляют людей, а не буквальных животных. Возможно также: «слепые овцы».'
    reason: cultural_note
  - marker: c
    text: 'Буквально последовательность можно передать: «были судимы и стали грешниками». В судебном контексте она, вероятно, означает, что суд выявил или объявил их грешниками, а не что после суда они начали грешить.'
    reason: alternative_reading
lexical_decisions:
- source_word: ተርኅወ
  choice: разверзлась
  rationale: Передаёт пассивно-результативный образ внезапно открывшейся бездны и сохраняет возвышенный апокалиптический регистр.
- source_word: ማዕምቅ
  choice: глубокая бездна
  rationale: Сохраняет значение великой глубины и выразительность апокалиптического образа; возможное более конкретное «глубокая яма» отмечено в сноске.
- source_word: ምሉዕ እሳተ
  choice: полная огня
  rationale: Прямо передаёт конкретный образ источника без замены собирательного «огня» на «пламя».
- source_word: እልኩ አባግዕ ጽዑላነ
  choice: тех ослеплённых овец
  rationale: Причастие «ослеплённых» сохраняет возможный результат ранее совершённого действия и образный язык Апокалипсиса животных.
- source_word: ተኰነኑ
  choice: судили
  rationale: Сохраняет судебное значение глагола, не подменяя сам суд заранее уточнённым приговором.
- source_word: ወኮኑ ኃጥኣነ
  choice: и признали грешниками
  rationale: 'В следующем за глаголом суда контексте передаёт декларативный смысл формулы: суд установил или выявил их виновность; буквальная последовательность остаётся отмеченной в сноске.'
- source_word: ተወድዩ
  choice: бросили
  rationale: Естественный современный русский эквивалент, сохраняющий насильственный характер действия и неопределённость действующих лиц.
- source_word: ውዕዩ
  choice: они сгорели
  rationale: Передаёт краткий итог огненного наказания; русский совершенный вид соответствует завершённости повествовательной последовательности.
- source_word: ዝንቱ ... ዝኩ
  choice: эта ... того
  rationale: Сохраняет контраст между ближним указанием на только что названную бездну и дальним указанием на ранее явленный дом.
- source_word: በየማኑ ለዝኩ ቤት
  choice: справа от того дома
  rationale: Естественно и конкретно передаёт пространственное положение без аллегорического истолкования.
theological_decisions:
- issue: Обозначают ли овцы просто слепое состояние или состояние, возникшее вследствие ослепления
  choice: ослеплённых овец
  alternative: слепых овец
  rationale: Причастная форма сохраняет вероятную связь с предшествующими событиями видения, но не объясняет, кем и почему они были ослеплены.
- issue: Смысл последовательности «были судимы и стали грешниками»
  choice: судили и признали грешниками
  alternative: судили, и они стали грешниками
  rationale: В судебном контексте конструкция естественно указывает на установленный судом статус, а не на то, что сам суд сделал их грешниками. Сноска сохраняет буквальную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной апокалиптической окраской. «Разверзлась» и «бездна» поддерживают достоинство и образность текста, тогда как синтаксис остаётся ясным для обычного современного читателя. Неопределённые действующие лица сохранены без богословского уточнения.
