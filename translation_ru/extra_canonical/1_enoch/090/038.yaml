base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/038.yaml
  text: And I saw until all their kinds were transformed[a], and they all became white cattle; and the first among them became a wild ox, and that wild ox became a great beast[d][c][b], and it had great black horns on its head.
translation:
  language: ru
  text: И видел я, как все их виды преобразились и все они стали белым скотом. Первый среди них стал диким быком[a], а этот дикий бык стал огромным зверем, и на голове у него были большие чёрные рога[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В сохранившемся эфиопском тексте здесь дважды стоит ነገር — «слово», «дело» или «нечто»; первое в издании отмечено обелом как испорченное чтение. Буквально: «стал словом (или: чем-то), и это слово (или: нечто) стало…». «Дикий бык» — вероятное восстановление первоначального животного образа.'
    reason: textual_variant
  - marker: b
    text: 'Предоставленная построчная выдержка обрывается после слов «и у него было», но печатный эфиопский текст далее читает: «большие чёрные рога на его голове».'
    reason: textual_variant
lexical_decisions:
- source_word: ተወለጠ
  choice: преобразились
  rationale: В контексте череды превращений в животном видении глагол обозначает изменение облика или состояния, а не буквальное новое рождение.
- source_word: ኵሉ አዝማዲሆሙ
  choice: все их виды
  rationale: «Виды» естественно передаёт классы существ в зооморфном видении, не сужая значение до семей или конкретных пород.
- source_word: አልህምተ ጻዕዳ
  choice: белым скотом
  rationale: Собирательное «скот» сохраняет образ крупного рогатого скота и не уточняет без необходимости пол или возраст животных.
- source_word: ቀዳማዊ … ማእከሎሙ
  choice: первый среди них
  rationale: Прямо передаёт первенство одной фигуры внутри всей группы.
- source_word: †ነገር … ነገር
  choice: диким быком … этот дикий бык
  rationale: Эфиопское «слово/дело/нечто» разрушает последовательный зооморфный образ и уже отмечено в издании обелом как испорченное место. «Дикий бык» передаёт вероятный исходный животный образ, но conjectural характер решения открыт в сноске.
- source_word: አርዌ ዐቢየ
  choice: огромным зверем
  rationale: «Зверь» сохраняет сильный животный образ, а «огромный» естественно передаёт величину и внушительность.
- source_word: አቅርንት፡ ጸሊም፡ ዐቢይ፡ ዲበ፡ ርእሱ፡
  choice: на голове у него были большие чёрные рога
  rationale: Перевод восстановленного продолжения печатного эфиопского текста завершает образ без добавочной интерпретации.
theological_decisions:
- issue: Как передать дважды повторённое испорченное ነገር в сцене зооморфного превращения
  choice: В основном тексте — «дикий бык», с явной текстологической оговоркой
  alternative: 'Буквально: «стал словом (или: чем-то), и это слово (или: нечто) стало…»'
  rationale: Буквальное чтение засвидетельствованного эфиопского слова сохраняется в сноске, однако в основном тексте предпочтено вероятное восстановление исходного животного образа. Это не отождествляется с богословским Логосом и не используется для внесения поздней доктринальной интерпретации.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис упрощён до двух предложений для ясности; повтор «дикий бык» сохранён ради связи превращений. Текстологическая неопределённость не скрыта и вынесена в сноску.
