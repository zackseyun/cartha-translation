base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/033.yaml
  text: And all those that had been scattered and dispersed[a], and all the beasts of the field and all the birds of heaven, were gathered into that house; and the Lord of the sheep rejoiced with great joy[c][b], because they had all become good and had entered into his house.
translation:
  language: ru
  text: И все погибшие и рассеянные[a], и все полевые звери, и все птицы небесные собрались в том доме[b]. И Господь овец возрадовался великой радостью, потому что все они стали добрыми и вошли в Его дом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Первое слово можно также понять как «пропавшие» или «утраченные». Здесь оно переведено «погибшие», чтобы не сливать его со следующим словом — «рассеянные».
    reason: lexical_alternative
  - marker: b
    text: «Тот дом», а далее «Его дом» — дом из образного мира видения; вероятно, он связан с восстановленным священным жилищем или храмом, но сам стих прямо этого не поясняет.
    reason: cultural_note
lexical_decisions:
- source_word: ተሐጕሉ
  choice: погибшие
  rationale: Глагол ሐጕለ может обозначать гибель, исчезновение или утрату. «Погибшие» сохраняет отличие от следующего глагола рассеяния и возможный мотив возвращения погибших в этой сцене.
- source_word: ተዘርዘሩ
  choice: рассеянные
  rationale: Передаёт состояние разобщения и рассеяния, не сливая его по смыслу с предшествующим ተሐጕሉ.
- source_word: አራዊተ ገዳም
  choice: полевые звери
  rationale: Естественное для библейского регистра обозначение диких наземных животных; не требует чрезмерно узкого понимания ገዳም как пустыни.
- source_word: አዕዋፈ ሰማይ
  choice: птицы небесные
  rationale: Сохраняет традиционный возвышенный образ и буквально передаёт связь с небом.
- source_word: ተጋብኡ በውእቱ ቤት
  choice: собрались в том доме
  rationale: Естественно передаёт совместное собирание; местное «в том доме» сохраняет форму с በ и согласуется с последующим указанием, что они вошли в дом.
- source_word: እግዚኦሙ ለአባግዕ
  choice: Господь овец
  rationale: Сохраняет повторяющийся символический титул Бога в «Апокалипсисе животных», не заменяя его отвлечённым обозначением.
- source_word: ተፈሥሐ ዐቢየ ፍሥሐ
  choice: возрадовался великой радостью
  rationale: Сохраняет усилительную конструкцию с однокоренными словами и торжественный стиль исходного текста.
- source_word: ኄራነ
  choice: добрыми
  rationale: Широкое значение «добрые, хорошие» передаёт преображённое состояние, не вводя более узкий технический термин «праведные».
- source_word: ገብኡ ውስተ ቤቱ
  choice: вошли в Его дом
  rationale: Прямо передаёт завершённое вхождение; притяжательное местоимение соотнесено с Господом овец.
theological_decisions:
- issue: Значение ተሐጕሉ и возможный мотив возвращения погибших
  choice: погибшие
  alternative: пропавшие; рассеянные
  rationale: Значение гибели или утраты лексически вероятно и не должно поглощаться следующим словом «рассеянные». Формулировка оставляет образ в рамках видения и не объясняет его догматически как воскресение.
- issue: Референт титула «Господь овец»
  choice: Сохранить как божественный символический титул
  alternative: их господин; хозяин овец
  rationale: Внутри видения это устойчивое обозначение Бога; буквальное сохранение образа точнее нейтральной замены.
- issue: Характер преображения в ኄራነ
  choice: стали добрыми
  alternative: стали праведными; стали хорошими
  rationale: «Добрыми» сохраняет нравственный оттенок и широту исходного слова, не превращая его в специальную богословскую категорию.
- issue: Образ дома
  choice: Сохранить «тот дом» и «Его дом» без отождествления в основном тексте
  alternative: явно назвать его восстановленным храмом
  rationale: Видение допускает храмовое и восстановительное прочтение, но сам стих продолжает символику дома и не даёт прямого толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены повтор «возрадовался великой радостью», символические названия животных и неоднозначность образа дома. Заглавная буква в «Его» указывает на Господа овец и помогает избежать неясности референта.
