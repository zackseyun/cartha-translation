base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/028.yaml
  text: And I stood watching until that old house was folded up[a]; and they carried out all the pillars, and all the beams and ornaments of that house were folded up with it[c][b], and they carried it out and set it down in one place in the south of the land.
translation:
  language: ru
  text: И я стоял и смотрел, пока тот старый дом не был свёрнут[a]. Тогда вынесли все столбы, а все насаждения и балки того дома были свёрнуты вместе с ним[b]; затем его вынесли и положили в одном месте на юге земли[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол можно также понять как «сложен», «завёрнут» или «убран»; речь идёт не просто о разрушении дома.
    reason: lexical_alternative
  - marker: b
    text: Слово, переведённое «насаждения», может также означать «растения»; «балки» обозначает, вероятно, деревянные конструктивные части дома.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «по правую сторону земли»; при традиционной ориентации лицом на восток правая сторона соответствует югу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ቆምኩ፡ አርእይ
  choice: я стоял и смотрел
  rationale: Передаёт продолженное наблюдение Еноха в видении, не сводя глагол к простой остановке.
- source_word: ተጠወም / ተጠውሙ
  choice: был свёрнут / были свёрнуты
  rationale: Сохраняет необычный образ складываемого или сворачиваемого строения и не подменяет его толкованием «разрушен».
- source_word: ቤት፡ ብሉይ
  choice: старый дом
  rationale: Прямо передаёт исходные слова и сохраняет возможный храмовый смысл как контекстуальный, а не вводит его в перевод.
- source_word: አዕማድ
  choice: столбы
  rationale: Естественный русский архитектурный термин, соответствующий предметному образу текста.
- source_word: አትክልት
  choice: насаждения
  rationale: Сохраняет обычное значение растительности или посаженных растений; слово «украшения» было бы более истолковывающим.
- source_word: ሤስ
  choice: балки
  rationale: Передаёт вероятные деревянные конструктивные части дома в естественной архитектурной лексике.
- source_word: ወአውፅእዎ፡ ወወደይዎ
  choice: его вынесли и положили
  rationale: Сохраняет последовательность физического удаления и помещения дома в другом месте.
- source_word: በ፪መካን
  choice: в одном месте
  rationale: Передаёт указание на одно определённое место без ненужного уточнения.
- source_word: በየማነ፡ ምድር
  choice: на юге земли
  rationale: «Правая сторона» в традиционной пространственной ориентации обозначает юг; основной текст передаёт понятное направительное значение, а буквальный образ отмечен в сноске.
theological_decisions:
- issue: Следует ли прямо назвать старый дом храмом
  choice: старый дом
  alternative: старый храм / прежний храм
  rationale: Видение допускает храмовое прочтение, но исходный текст говорит «дом»; перевод не должен превращать возможную символическую отсылку в однозначное наименование.
- issue: Следует ли истолковать сворачивание дома как разрушение
  choice: свёрнут
  alternative: разрушен / разобран
  rationale: Необычный глагольный образ важен для апокалиптической сцены и не сводится однозначно к разрушению.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис сохраняет последовательность видения, но остаётся понятным обычному читателю; необычность образа «свёрнутого» дома намеренно сохранена.
