base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/015.yaml
  text: And I watched until the Lord of the sheep came to them in wrath[a], and all who saw him fled[c][b], and they all fell into the shadow before his face.
translation:
  language: ru
  text: И я смотрел, пока Господь овец не пришёл к ним в гневе. Все, кто увидел Его, обратились в бегство, и все они пали в тень[a] из-пред лица Его[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в тень»; образ может указывать на мрачное место падения, но текст не поясняет его точнее.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «из-пред лица Его»; этот оборот передаёт геэзский идиом присутствия и содержит значение удаления «от/из-пред».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ
  choice: я смотрел
  rationale: В повествовании о видении глагол обозначает продолжающееся наблюдение; «смотрел» естественно вводит последующее событие.
- source_word: እስከ መጽአ
  choice: пока ... не пришёл
  rationale: Русская конструкция «пока не» естественно передаёт продолжение наблюдения до решающего прихода.
- source_word: እግዚአ አባግዕ
  choice: Господь овец
  rationale: 'Сохранён ключевой титул Бога в аллегории о животных: он передаёт верховную власть и не выводит образ овец за пределы текста.'
- source_word: በመዓት
  choice: в гневе
  rationale: Предложное сочетание описывает образ прихода и сохраняет судебно-эсхатологическую силу выражения.
- source_word: እለ ርእይዎ ኵሎሙ
  choice: все, кто увидел Его
  rationale: Коллективная относительная конструкция передана ясно и без сужения круга действующих лиц.
- source_word: ነፍጹ
  choice: обратились в бегство
  rationale: Передаёт внезапное бегство в страхе, сохраняя достоинство повествовательного регистра.
- source_word: ወወድቁ ኵሎሙ
  choice: и все они пали
  rationale: Повтор «все» сохранён, поскольку он подчёркивает всеобщность поражения.
- source_word: ውስተ ጽላሎት
  choice: в тень
  rationale: Буквальный образ тени сохранён без истолкования её как преисподней, гибели или просто темноты.
- source_word: እምቅድመ ገጹ
  choice: прочь от лица Его
  rationale: «Прочь от» передаёт аблативную силу እም, а «от лица Его» сохраняет яркий семитский образ присутствия.
theological_decisions:
- issue: Кого обозначает «Господь овец»
  choice: Божественный титул верховного Судьи и Владыки стада внутри аллегории
  alternative: Обобщённое «хозяин овец»
  rationale: В более широком контексте Апокалипсиса животных этот титул относится к трансцендентному Правителю, который приходит судить; «Господь» сохраняет эту весомость, не внося более позднего христологического отождествления.
- issue: Значение падения «в тень»
  choice: Сохранить образ без уточнения его символического содержания
  alternative: Передать как падение во тьму, погибель или преисподнюю
  rationale: Контекст придаёт образу зловещий оттенок, однако сам текст не определяет его точнее; перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Синтаксис сделан естественным для русского читателя, при этом сохранены повтор «все», аллегорический титул и намеренно непрозрачный образ тени.
