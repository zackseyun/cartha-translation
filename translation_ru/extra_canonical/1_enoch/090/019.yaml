base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/019.yaml
  text: And I saw until a great sword was given to the sheep[a], and the sheep went out against all the beasts of the field to kill them; and all the beasts and the birds of heaven fled from before their face.
translation:
  language: ru
  text: И я продолжал смотреть, пока овцам не был дан великий меч. Тогда овцы выступили против всех зверей полевых, чтобы убить их, и все звери и птицы небесные бежали от лица их.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Бежали от лица их» — семитский оборот со значением «бежали от них» или «обратились в бегство перед ними».
    reason: Пояснение сохранённого в переводе семитского оборота.
lexical_decisions:
- source_word: ወርኢኩ፡ እስከ፡ ተውህበ
  choice: И я продолжал смотреть, пока… не был дан
  rationale: Передаёт формулу продолжающегося видения и сохраняет временное развитие до решающего события; по-русски конструкция звучит естественнее буквального «я видел, пока был дан».
- source_word: ለአባግዕ
  choice: овцам
  rationale: Дательный падеж точно передаёт адресата; символический образ овец сохранён без истолкования в основном тексте.
- source_word: ሰይፍ፡ ዐቢይ
  choice: великий меч
  rationale: «Великий» сохраняет возвышенную и символическую силу образа, не сводя значение только к физическому размеру.
- source_word: ወወፅኡ፡ አባግዕ፡ ዲበ
  choice: Тогда овцы выступили против
  rationale: «Выступили против» естественно передаёт движение к военному столкновению; «тогда» ясно связывает действие с вручением меча, не добавляя нового содержания.
- source_word: ኵሉ፡ አራዊተ፡ ገዳም
  choice: всех зверей полевых
  rationale: Сохраняет зооморфную образность и библейски возвышенный порядок слов, не заменяя зверей истолкованием «враги» или «народы».
- source_word: ከመ፡ ይቅትልዎሙ
  choice: чтобы убить их
  rationale: Прямо и ясно выражает цель действия, сохраняя жестокость сцены суда без архаизации.
- source_word: አዕዋፈ፡ ሰማይ
  choice: птицы небесные
  rationale: Сохраняет возвышенную лексику видения и традиционный русский библейский оборот.
- source_word: ነፍጹ፡ እምቅድመ፡ ገጾሙ
  choice: бежали от лица их
  rationale: Близко воспроизводит семитский образ бегства «от лица» противника; оборот понятен в русском библейском регистре, а примечание разъясняет его смысл.
theological_decisions:
- issue: Следует ли раскрывать символическое значение животных в основном тексте
  choice: Сохранить буквальные образы «овцы», «звери» и «птицы»
  alternative: Передать их истолковательно как Израиль, враждебные народы и союзные им силы
  rationale: «Апокалипсис животных» строится на последовательной зооморфной символике. Перевод должен сохранять язык самого видения и не навязывать читателю одно конкретное толкование.
- issue: Характер великого меча
  choice: Не уточнять, означает ли величие меча его размер, силу или символический статус
  alternative: Перевести как «огромный меч» либо «могучий меч»
  rationale: Прилагательное допускает оттенки размера и значительности; «великий меч» сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя, при этом сохранены апокалиптические образы и намеренно не устранена смысловая широта выражения «великий меч».
