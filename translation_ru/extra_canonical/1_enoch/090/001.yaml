base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/001.yaml
  text: And I saw until the time when thirty-seven shepherds were pasturing in this way[a], and they all completed their periods, each in its time, like the former ones; and others received them into their hands, to pasture them in their times[c][b], each shepherd in its time.
translation:
  language: ru
  text: И я видел до того времени, когда тридцать семь пастухов пасли так[a]; все они, подобно прежним, завершили каждый свой срок; и другие приняли их в свои руки[c], чтобы пасти их в отведённые им сроки[b] — каждый пастух в свой срок.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Геэзское выражение можно также понять как: «И я видел до того времени: тридцать семь пастухов пасли так». Слово «так» отсылает к ранее описанному в видении образу их действий.'
    reason: previous_rendering
  - marker: b
    text: Повторение слова «срок» подчёркивает, что каждому пастуху был отведён определённый период, а не неопределённое время служения.
    reason: cultural_note
  - marker: c
    text: 'Фраза о передаче сжата: по смыслу одна группа пастухов завершает свои сроки, после чего другие поочерёдно принимают попечение. Перевод сохраняет образ принятия «в свои руки» и местоименную неоднозначность оригинала.'
    reason: textual_variant
lexical_decisions:
- source_word: ወርኢኩ
  choice: И я видел
  rationale: Сохраняет обычную формулу повествования о видении и связь с предшествующим рассказом.
- source_word: እስከ ዘመን ዘከመዝ
  choice: вплоть до времени, когда … таким образом
  rationale: Передаёт и временную направленность እስከ ዘመን, и указание на ранее описанный образ действия в ከመዝ, не сводя выражение лишь к «до того времени».
- source_word: ይርዕዩ
  choice: пасли
  rationale: Сохраняет конкретный пастушеский образ аллегории, не заменяя его истолкованием вроде «управляли» или «надзирали».
- source_word: ፴ወ፯ ኖላዊያን
  choice: тридцать семь пастухов
  rationale: Число дано словами в литературном тексте; образ пастухов сохранён без раскрытия их символического значения.
- source_word: ፈጸሙ ኵሎሙ በበጊዜሆሙ
  choice: Все они … завершили каждый свой срок
  rationale: Естественно по-русски выражает завершение каждым пастухом отдельного периода служения; слово «срок» передаёт подразумеваемый временной отрезок.
- source_word: ከመ ቀዳማዊያን
  choice: подобно прежним
  rationale: Отсылает к ранее упомянутым пастухам и сохраняет сравнительную формулировку источника.
- source_word: በዐዳን ተመጠውዎሙ ውስተ እደዊሆሙ
  choice: другие приняли их в свои руки
  rationale: Сохраняет заметный образ передачи «в руки» и не устраняет сжатость местоименных отношений в геэзском тексте.
- source_word: ከመ ይርዐይዎሙ በበጊዜሆሙ
  choice: чтобы пасти их в отведённые им сроки
  rationale: Передаёт целевое придаточное и повторяющуюся мысль об отдельных периодах; «отведённые» делает понятной распределённость сроков, не называя того, кто их назначил.
- source_word: ኵሉ ኖላዊ በጊዜሁ
  choice: каждый пастух в свой срок
  rationale: Сохраняет итоговую распределительную формулу и подчёркивает последовательность служения пастухов.
theological_decisions:
- issue: Кого символизируют пастухи
  choice: Сохранить обозначение «пастухи» без истолковательного уточнения
  alternative: ангелы; правители; надзиратели
  rationale: Сам стих говорит языком животной аллегории. Уточнение символических соответствий разрешило бы в переводе то, что текст оставляет на уровне образа.
- issue: Кем установлены сроки
  choice: Передать сроки как отведённые, не называя назначившего их
  alternative: назначенные Богом сроки
  rationale: Контекст предполагает ограниченные периоды надзора, однако в самом стихе субъект назначения прямо не назван; богословское уточнение было бы избыточным.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис сохраняет поступательное движение видения и намеренное повторение слова «срок»; символика не заменяется конфессиональным толкованием.
