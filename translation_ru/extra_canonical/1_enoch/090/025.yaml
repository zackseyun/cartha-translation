base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/025.yaml
  text: And those shepherds were judged and were found to be sinners[c][b][a], and they were cast into that abyss of fire.
translation:
  language: ru
  text: И те пастыри[a] были судимы и признаны грешниками[b], и они были брошены в ту огненную бездну.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В используемой транскрипции это слово повреждено, однако читаемая форма и контекст указывают на «пастырей», упомянутых ранее.
    reason: textual_variant
  - marker: b
    text: 'Буквально возможно: «стали грешниками»; в контексте суда выражение может означать, что они были признаны виновными.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝኩ
  choice: И те
  rationale: Форма представляет собой союз с указательным местоимением, а не глагол «я увидел»; она связывает стих с уже упомянутой группой.
- source_word: 'ኖላዊያን (в транскрипции: ሮ*ኖላዊያን)'
  choice: пастыри
  rationale: Несмотря на повреждение транскрипции, различимое ኖላዊያን означает «пастыри» и в контексте относится к пастырям из предшествующего суда; символический образ сохранён без исторического истолкования.
- source_word: ተኰነኑ
  choice: были судимы
  rationale: Судебный пассив передаёт действие суда, не сужая значение до вынесения приговора или осуждения.
- source_word: ወኮኑ ኃጥኣነ
  choice: и признаны грешниками
  rationale: Буквально выражение допускает «стали грешниками», но в сцене суда оно естественно обозначает установление их виновности. «Признаны грешниками» сохраняет морально-религиозное существительное и судебный оттенок.
- source_word: ወተወድዩ እሙንቱ
  choice: и они были брошены
  rationale: Сохранены пассивная конструкция, насильственный характер действия и явно выраженное местоименное возобновление подлежащего.
- source_word: ውስተ'ዛ ማዕምቀ እሳት
  choice: в ту огненную бездну
  rationale: «Огненная бездна» естественно передаёт сочетание бездны с огнём, не добавляя отсутствующего определения «глубокая» и не заменяя образ словом «ад».
theological_decisions:
- issue: Следует ли истолковывать пастырей как конкретных исторических или ангельских лиц
  choice: Сохранить образ «пастыри» в основном тексте
  alternative: Заменить образ его предполагаемым историческим или ангелологическим толкованием
  rationale: Апокалиптический текст сам говорит посредством символических образов; перевод не должен незаметно подменять образ толкованием.
- issue: Моральное или строго юридическое значение ኃጥኣነ
  choice: «признаны грешниками»
  alternative: «стали грешниками» или «были признаны виновными»
  rationale: Выбранная формулировка удерживает вместе судебный контекст и прямую нравственно-религиозную характеристику, не устраняя напряжение между ними.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным апокалиптическим звучанием. Синтаксический параллелизм судебных пассивов сохранён; конфессионально обусловленные толкования не внесены.
