base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/021.yaml
  text: And the Lord of the sheep called those seven first white ones and commanded that they bring before him[a], beginning with the first star that went before those stars whose private parts were like those of horses, that first one which went out before them[e][d][c][b]; and they brought them before him.
translation:
  language: ru
  text: И Господь овец призвал тех семерых первых белых мужей и повелел им привести к Нему, начиная с первой звезды, которая шла впереди тех звёзд, чьи срамные части были подобны срамным частям коней, — ту первую звезду, которая вышла перед ними[a]; и они привели их к Нему[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Заключительная часть этой фразы в эфиопском свидетельстве текстуально трудна. Вероятно, она ещё раз указывает на ту же первую, ведущую звезду, а не вводит другую фигуру.
    reason: textual_variant
  - marker: b
    text: Звёзды в этом видении символизируют небесных существ; в переводе сохранён сам образ. Местоимение «их» в конце, по-видимому, относится к звёздам, которых приводят на суд.
    reason: cross_reference
lexical_decisions:
- source_word: እግዚአ ሰብኡ
  choice: Господь овец
  rationale: Сохраняет возвышенный титул Бога и образный язык Апокалипсиса животных.
- source_word: ሰብአ ፯ጸዓድወ ቀዳማዊያን
  choice: тех семерых первых белых мужей
  rationale: Слово ሰብአ прямо обозначает мужей/людей; «мужей» сохраняет различение образов видения, где небесные существа представлены человеческими фигурами.
- source_word: ያምጽኡ ቅድሜሁ
  choice: привести к Нему
  rationale: Естественная русская формула представления на суд; прописная буква ясно указывает на Господа без изменения смысла.
- source_word: እምክቡበ ቀዳማዊ ዘይቀድም እምነ ዝኩ ከዋክብት
  choice: начиная с первой звезды, которая шла впереди тех звёзд
  rationale: Передаёт начинательное значение እም и одновременно сохраняет оттенок первенства или предводительства.
- source_word: ከዋክብት
  choice: звёзды
  rationale: Сохранён непосредственный апокалиптический образ, а не подставлено его толкование «ангелы».
- source_word: ኃፍረቶሙ ከመ ኃፍረተ አፍራስ
  choice: чьи срамные части были подобны срамным частям коней
  rationale: «Срамные части» достаточно ясно и достойно передаёт намеренно постыдный сексуальный образ источника.
- source_word: '[ወሰነኩበ፡ ቀዳማዊ፡ ዘወፅአ፡ ቅድመ፡]'
  choice: ту первую звезду, которая вышла перед ними
  rationale: Принимается вероятное восстановление повреждённого чтения как указание на «первую звезду»; повтор сохраняет трудность и уточняющий характер фразы.
- source_word: ወአምጽእዎሙ ለእሎሙ ቅድሜሁ
  choice: и они привели их к Нему
  rationale: Сохранены множественное дополнение и процедурный повтор сцены суда.
theological_decisions:
- issue: Следует ли раскрыть «звёзды» как ангелов в основном тексте
  choice: Оставить «звёзды»
  alternative: Перевести как «ангелы» или «небесные существа»
  rationale: Источник намеренно говорит языком видения; прямое толкование сгладило бы его символическую форму.
- issue: Как передать семь белых фигур
  choice: «семерых первых белых мужей»
  alternative: «семерых первых белых»
  rationale: В тексте присутствует ሰብአ — «мужей/людей»; его сохранение также поддерживает образный код повествования, не утверждая человеческую природу этих фигур.
- issue: Насколько прямо передавать сексуальный образ
  choice: «срамные части»
  alternative: «половые органы» или более расплывчатый эвфемизм
  rationale: Фраза сохраняет постыдную и телесную силу образа, оставаясь уместной для литературного религиозного текста.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным синтаксисом. Сохранены повтор, судебная обстановка и резкий образ источника; «белые мужи» употреблено как описание фигур видения, а не как этническое обозначение.
