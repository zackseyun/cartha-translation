base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/005.yaml
  text: And I saw until the time when twenty-three were shepherding[a], and they completed, in their respective times[c][b], fifty-eight times.
translation:
  language: ru
  text: И видел я до того времени, когда двадцать три пастыря пасли стадо[a]; и они завершили в отведённые им сроки пятьдесят восемь периодов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «когда двадцать три пасли»; обозначение «пастыря» и объект «стадо» подразумеваются контекстом.'
    reason: implicit_subject_and_object
  - marker: b
    text: Слово, переведённое как «периоды», может также означать «времена» или «сроки»; их продолжительность здесь не уточняется.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: И видел я
  rationale: Обычная формула повествования о видении; сохраняет торжественный апокалиптический стиль без лишнего уточнения вида действия.
- source_word: እስከ ዘመን እስከ
  choice: вплоть до того времени, когда
  rationale: Естественно передаёт двойное временное ограничение и связывает его с последующим придаточным.
- source_word: ይሬዐዩ
  choice: пасли стадо
  rationale: Форма восходит к корню ርዕየ — «пасти, быть пастырем», с ዐ, а не к сходному корню «видеть» с እ. В контексте Апокалипсиса животных речь идёт о пастырях.
- source_word: ፳ወ፫
  choice: двадцать три пастыря
  rationale: Числительное передано прямо; существительное «пастыря» восстановлено из формы глагола и непосредственного контекста повествования.
- source_word: ወፈጸሙ
  choice: завершил
  rationale: Глагол означает доведение до завершения. Единственное число в русском согласовано с распределительной конструкцией «каждый из них», передающей множественное число оригинала.
- source_word: በበጊዜሆሙ
  choice: каждый из них в свой срок
  rationale: Повтор предлога имеет распределительное значение; русская конструкция ясно передаёт, что каждому был отведён свой срок.
- source_word: ፶ወ፰ጊዜያተ
  choice: пятьдесят восемь сроков
  rationale: ጊዜ может обозначать время, срок или период. «Сроков» естественно для исчисляемых назначенных отрезков и не отождествляет их с годами либо конкретными историческими эпохами.
theological_decisions:
- issue: Характер исчисляемых единиц в символической хронологии Апокалипсиса животных
  choice: пятьдесят восемь сроков
  alternative: пятьдесят восемь времён / периодов / сроков пастырства
  rationale: Текст сообщает число временных единиц, но не определяет их историческую продолжительность или точный референт; перевод сохраняет эту неопределённость.
- issue: Субъект действия «пасти»
  choice: двадцать три пастыря
  alternative: двадцать три пасли
  rationale: Существительное подразумевается контекстом символического рассказа и необходимо для ясного русского синтаксиса; оно не уточняет, кого именно символизируют пастыри.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным порядком слов в формуле «И видел я». Термин «пастыри» поддерживает образный строй главы; остальная фраза сделана синтаксически прозрачной. Ошибочное чтение глагола как «видели» не вынесено в примечание, поскольку различие эфиопских согласных указывает на корень «пасти».
