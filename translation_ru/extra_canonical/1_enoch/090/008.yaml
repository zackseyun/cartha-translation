base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/008.yaml
  text: And I saw in the vision that ravens flew down upon those lambs[b][a], and they seized one of those lambs and dashed the sheep to pieces and devoured them.
translation:
  language: ru
  text: И увидел я в видении, как вороны налетели[a] на тех ягнят, схватили одного из них, растерзали овец[b] и пожрали их.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Глагольное выражение можно понять и шире: «устремились на» или «напали на»; перевод «налетели» сохраняет птичий характер образа.'
    reason: lexical_alternative
  - marker: b
    text: 'В эфиопском тексте для членов стада употреблены разные слова, значения которых могут пересекаться: сначала «ягнята», затем «овцы». Перевод сохраняет эту смену обозначений.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ፡ በራእይ
  choice: И увидел я в видении
  rationale: Сохраняет формулу рассказа о видении и её продолжительный контекст; инверсия придаёт тексту умеренно возвышенное, но понятное звучание.
- source_word: ቋዓተ
  choice: вороны
  rationale: Передаёт конкретный вид птиц в символическом ряду «Апокалипсиса животных», не подменяя образ толкованием.
- source_word: ከመ፡ ሰረሩ፡ ዲበ
  choice: как ... налетели на
  rationale: Естественно передаёт стремительное враждебное движение птиц на стадо, не усиливая текст до более конкретного «спикировали».
- source_word: እልክቱ፡ መዓስእ
  choice: тех ягнят
  rationale: Сохраняет указательное значение и возможное обозначение молодых или меньших овец, а также отличие от последующего አባግዕ.
- source_word: ወአኀዝዎ፡ ለአሐዱ፡ እምዝኩ፡ መዓስእ
  choice: схватили одного из них
  rationale: Ясно передаёт выделение одной особи из названной группы; местоимение избегает тяжёлого повтора «ягнят».
- source_word: ወቀጥቀጥዎሙ፡ ለአባግዕ
  choice: растерзали овец
  rationale: Передаёт интенсивность редуплицированного глагола и жестокость нападения естественным современным русским выражением; буквальное «разбили на части» по-русски звучало бы неестественно применительно к овцам.
- source_word: ወበልዕዎሙ
  choice: и пожрали их
  rationale: Сохраняет конкретную и жестокую картину хищничества; «пожрали» здесь естественнее для птиц-хищников и выразительнее нейтрального «съели».
theological_decisions:
- issue: Следует ли раскрывать символическое значение животных непосредственно в переводе
  choice: Сохранить буквальные образы воронов, ягнят и овец
  alternative: Заменить животных предполагаемыми народами, правителями или Израилем
  rationale: Видение строится на последовательной системе образов; перевод не должен устранять её неоднозначность и превращать толкование в основной текст.
- issue: Соотношение единственного ягнёнка и последующих овец во множественном числе
  choice: 'Сохранить грамматический переход: «одного из них» — «овец ... их»'
  alternative: Согласовать всё с одним ягнёнком либо истолковать нападение как относящееся только к одной жертве
  rationale: Эфиопский текст переходит от одной схваченной особи к овцам во множественном числе. Это напряжение не следует молча устранять.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным ритмом апокалиптического повествования. Конкретная и жестокая образность сохранена; символы не истолкованы внутри перевода. Формулировки рассчитаны на обычного современного читателя без конфессионально окрашенной терминологии.
