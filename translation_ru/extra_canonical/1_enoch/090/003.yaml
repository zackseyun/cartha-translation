base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/003.yaml
  text: And the sheep cried out because their flesh was being devoured by the birds[b][a], and I looked and lamented in my sleep over that shepherd who was shepherding the sheep.
translation:
  language: ru
  text: И овцы закричали, потому что птицы[a] пожирали их плоть. А я смотрел и стенал[b] во сне о том пастухе, который пас овец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «птицы»; что это хищные птицы, следует из образа пожирания, но прямо не сказано.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «А я наблюдал и громко плакал во сне из-за того пастуха, который пас овец». Глагол допускает разные оттенки слышимого выражения скорби.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አባግዕ
  choice: овцы
  rationale: Сохраняет явный образ животных в апокалиптическом видении, не подменяя его историческим толкованием.
- source_word: ጸርኁ
  choice: закричали
  rationale: Передаёт слышимый крик бедствия без уточнения, что это ритуальный плач.
- source_word: ይትበልዑ ሥጋሆሙ
  choice: пожирали их плоть
  rationale: Русская активная конструкция естественно передаёт продолжающееся насильственное действие; «плоть» сохраняет телесную выразительность источника.
- source_word: እምነ አዕዋፍ
  choice: птицы
  rationale: В контексте пассивной формы обозначает действующих; источник говорит просто о птицах, не называя их хищными.
- source_word: ነጸርኩ
  choice: я смотрел
  rationale: Сохраняет простой глагол зрительного наблюдения, характерный для повествования о видении.
- source_word: አውየውኩ
  choice: стенал
  rationale: Передаёт слышимое выражение скорби и отличает реакцию провидца от предшествующего крика овец.
- source_word: በንዋምየ
  choice: во сне
  rationale: Буквально сохраняет указание на сон, не заменяя его более толковательным «в сновидении».
- source_word: ኖላዊ ዘይርዕዮሙ
  choice: пастухе, который пас
  rationale: Сохраняет повтор корня и конкретный пастушеский образ; по-русски эта формула естественнее, чем «пастушествовал».
theological_decisions:
- issue: Следует ли раскрывать исторических референтов образов животных в основном тексте
  choice: Сохранить буквальные образы овец, птиц и пастуха.
  alternative: Передать символы как людей, врагов и правителей.
  rationale: Апокалиптическую образность необходимо сохранить, не превращая перевод в истолкование.
- issue: К кому относится скорбь провидца
  choice: 'Передать конструкцию нейтрально: «стенал… о том пастухе».'
  alternative: Уточнить, что провидец взывал к пастуху или оплакивал его действия.
  rationale: Предложная связь допускает смысловую напряжённость; перевод не должен без необходимости определять направление обращения или точную причину плача.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной апокалиптической образностью. Синтаксис слегка упрощён ради естественности; союзное начало и повтор пастушеского образа сохранены.
