base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/010.yaml
  text: And it looked at them[a], [and their eyes were opened,] and it cried out to the sheep and said to them[c][b], “Look!” and they all ran to it.
translation:
  language: ru
  text: 'И оно посмотрело на них, [и глаза их открылись][a], и воззвало к овцам, сказав им: «Смотрите!»[c] И все они побежали к нему[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «и глаза их открылись» заключены в скобки, поскольку в представленном эфиопском свидетельстве они отмечены как текстуально неустойчивые; при этом такой образ неоднократно встречается в этом цикле видений.
    reason: textual_variant
  - marker: b
    text: Выражение «к нему» может относиться как к животному образу видения, так и к изображённому посредством него личному вождю; текст не требует однозначно выбирать между этими уровнями.
    reason: lexical_alternative
  - marker: c
    text: 'Возможен иной разбор соответствующих эфиопских форм: «и бараны увидели его». Здесь принят разбор консультационного текста: «сказав им: „Смотрите!“».'
    reason: textual_or_morphological_ambiguity
lexical_decisions:
- source_word: ወርእየ ቦሙ
  choice: И оно посмотрело на них
  rationale: Форма передана как третье лицо единственного числа, а ቦሙ — как объект «на них». Местоимение «оно» сохраняет внешний уровень животной символики и не превращает образ заранее в человека.
- source_word: ወተፈትሐ አዕይንቲሆሙ
  choice: '[и глаза их открылись]'
  rationale: Квадратные скобки исходного свидетельства сохранены как указание на текстовую неустойчивость; чуть более высокий порядок слов «глаза их» соответствует достоинству визионерского повествования и остаётся понятным.
- source_word: ወጸርኀ ሎሙ ለአባግዕ
  choice: и воззвало к овцам
  rationale: Глагол обозначает громкий, настойчивый зов. «Воззвало» передаёт силу действия и возвышенный регистр, не смешивая его с последующим речевым глаголом.
- source_word: ወይቤላት ርእይዎ
  choice: 'сказав им: «Смотрите!»'
  rationale: Передаёт принятую в консультационном слое разбивку как речевой глагол и повеление во множественном числе. Оборот с деепричастием естественнее по-русски и не ослабляет отдельного акта речи.
- source_word: ወሮጹ ኵሎሙ ኀቤሁ
  choice: И все они побежали к нему
  rationale: Глагол сохранён как «побежали», без смягчения до «поспешили». Русское «к нему» грамматически естественно для обозначенного образом участника и само по себе не решает, следует ли понимать его как животный символ или как личность.
theological_decisions:
- issue: Следует ли заранее отождествлять единичный образ с человеческим вождём
  choice: В начале употребить «оно», сохранив животно-символический уровень видения
  alternative: «он»
  rationale: Так перевод не раскрывает символ через предполагаемое историческое или богословское отождествление. В заключительном «к нему» сохраняется естественная для русского языка двусмысленность между образом и личностью.
- issue: Значение открывшихся глаз
  choice: Передать образ буквально, без пояснения его богословского смысла
  alternative: Добавить толкование о прозрении или духовном пробуждении
  rationale: Сам текст сообщает действие, но не формулирует его значение; буквальный образ сохраняет богословское напряжение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным визионерским звучанием. Союзное нанизывание исходного повествования в основном сохранено; «воззвало» выбрано ради силы голоса, а не ради архаизации. Квадратные скобки являются частью публикационного текста, не редакционным пояснением перевода.
