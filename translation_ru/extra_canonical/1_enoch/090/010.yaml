  source_fidelity: Черновик следует ошибочному разбору ወይቤላት ርእይዎ как глагола речи с повелением. В данной строке ወይቤላት естественно читается как «бараны», а ርእይዎ — как «увидели его/это»; поэтому в основном тексте должны быть бараны, увидевшие единичный образ. Третье лицо единственного числа в начале сохранено как «оно посмотрело».
  naturalness: «Воззвало» уместно в умеренно возвышенном визионерском регистре. После исправления синтаксиса точка с запятой ясно разделяет крик к овцам и последующее действие баранов. Местоименная последовательность «оно ... его ... к нему» несколько маркирована, но оправдана отсутствием прямо названного antecedent'а и сохраняет символическую неопределённость оригинала.
  terminology: «Овцы» и «бараны» сохраняют различие образов текста. «Глаза их открылись» передаёт спорный, заключённый в скобки фрагмент без интерпретации. Личные формы «его/нему» не навязывают историческое либо богословское отождествление образа.
