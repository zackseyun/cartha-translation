base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/029.yaml
  text: And I saw until the Lord of the sheep brought a new house[a], greater and loftier than the first, and set it up in the place of the first, which had been folded up; and all its pillars were new, and its ornaments were new and greater than those of the first old one that he had taken away[b], and all the sheep were within it.
translation:
  language: ru
  text: И видел я, как Владыка овец принёс новый дом — больше и выше прежнего — и поставил его на месте первого, который был свёрнут[a]. Все его столпы были новыми, и украшения его были новыми и величественнее украшений прежнего, старого дома, который Он убрал[b]; и все овцы находились внутри него.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скатан», «сложен». Эфиопский глагол допускает несколько близких значений и, вероятно, описывает, как прежний дом был свёрнут перед заменой.'
    reason: lexical_alternative
  - marker: b
    text: «Дом», вероятно, символизирует восстановленное или эсхатологическое святилище, однако в переводе сохранён собственный образ видения.
    reason: cultural_note
lexical_decisions:
- source_word: እግዚአ አባግዕ
  choice: Владыка овец
  rationale: Передаёт значение господина и властителя, сохраняя возвышенный апокалиптический регистр и образность повествования об овцах.
- source_word: ቤት ኀዲስ
  choice: новый дом
  rationale: В оригинале употреблено слово «дом». Хотя образ, вероятно, указывает на восстановленное или эсхатологическое святилище, перевод не подменяет образ его истолкованием.
- source_word: ዓቢይ ... ልዑል
  choice: больше и выше
  rationale: 'Естественно по-русски выражает оба аспекта сравнения: величину и высоту.'
- source_word: አቀሞ ውስተ መካነ ቀዳማዊት
  choice: поставил его на месте первого
  rationale: Сохраняет значения установления и замены прежнего дома на том же месте.
- source_word: እንተ ትጠብለለት
  choice: который был свёрнут
  rationale: Сохраняет необычный конкретный образ оригинала и не усиливает его до «разрушен»; возможные оттенки отмечены в сноске.
- source_word: አዕማዲ
  choice: столпы
  rationale: Точный архитектурный термин, уместный в возвышенном описании символического дома.
- source_word: ስና
  choice: украшения
  rationale: Передаёт архитектурное убранство, не сужая не вполне определённый смысл слова до конкретного вида предметов.
- source_word: ብሊት
  choice: старого дома
  rationale: Ясно противопоставляет прежнее строение новому, с явным восстановлением подразумеваемого существительного.
- source_word: አውፅአ
  choice: убрал
  rationale: По контексту означает удаление прежнего дома; формулировка не привносит идею разрушения.
- source_word: ማእከላ
  choice: внутри него
  rationale: Сохраняет пространственный образ всех овец, находящихся в новом доме.
theological_decisions:
- issue: Передавать ли ቤት как «дом» или истолковывать как «храм»
  choice: дом
  alternative: храм; святилище
  rationale: Символическая ткань видения требует сохранить названный в тексте образ, не отождествляя его прямо с предполагаемым эсхатологическим референтом.
- issue: Как передать судьбу первого дома в እንተ ትጠብለለት
  choice: который был свёрнут
  alternative: который был скатан; который был сложен; который был разрушен
  rationale: Форма выражает сворачивание, складывание или обёртывание. Необычный образ сохранён, а более определённое «разрушен» отвергнуто как чрезмерно истолковывающее.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис сделан плавным и понятным; символические образы оригинала сохранены без конфессионально обусловленного истолкования.
