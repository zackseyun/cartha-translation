base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/037.yaml
  text: And I saw that a white bull was born[a], and its horns were great[c][b]; and all the beasts of the field and all the birds of heaven feared it and entreated it at all times.
translation:
  language: ru
  text: И увидел я, что родился белый бык[a], и рога его были велики; все звери полевые и все птицы небесные боялись его и во всякое время обращались к нему с мольбой[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Белый бык — символический персонаж Апокалипсиса животных; перевод сохраняет образ, не отождествляя его здесь с конкретным лицом.
    reason: cultural_note
  - marker: b
    text: 'Или: «умоляли его», «просили его»; исходный глагол выражает настойчивую просьбу или мольбу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተወልደ
  choice: родился
  rationale: Передаёт обычное значение формы рождения без истолковывающего расширения вроде «явился» или «произошёл».
- source_word: ላህም
  choice: бык
  rationale: Мужское наименование крупного рогатого животного соответствует образу и последующему упоминанию рогов.
- source_word: ጻዕዳ
  choice: белый
  rationale: Цвет сохранён буквально, поскольку в образном строе видения он значим.
- source_word: አቅርንቲሁ ዐበይት
  choice: рога его были велики
  rationale: Сохраняет конкретный образ рогов и допускает оттенки как большого размера, так и выдающегося значения, не сводя их к военной силе.
- source_word: አራዊተ ገዳም
  choice: полевые звери
  rationale: Передаёт диких животных в сжатой библейской формуле, естественной для возвышенного русского повествования.
- source_word: አዕዋፈ ሰማይ
  choice: небесные птицы
  rationale: Сохраняет образную пространственную формулу оригинала и возвышенный регистр.
- source_word: ይፈርህዎ
  choice: боялись его
  rationale: Прямо передаёт страх всех животных перед белым быком.
- source_word: ያስተበቍዕዎ
  choice: обращались к нему с мольбой
  rationale: Передаёт сильное значение просьбы, мольбы или прошения и звучит естественнее по-русски, чем буквальное переходное «умоляли его» без указания предмета просьбы.
- source_word: በኵሉ ጊዜ
  choice: во всякое время
  rationale: Сохраняет всеохватность и повторяемость исходного выражения.
theological_decisions:
- issue: Следует ли прямо назвать, кого символизирует белый бык
  choice: Сохранить образ белого быка без отождествления в основном тексте.
  alternative: Назвать его человеком, правителем или мессианской фигурой.
  rationale: Видение говорит посредством символических животных; перевод не должен подменять образ одним из его возможных толкований.
- issue: Характер обращения животных к белому быку
  choice: Передать сильную мольбу, не уточняя её религиозный или культовый характер.
  alternative: Ослабить до «искали его благоволения» либо усилить до явно культового поклонения.
  rationale: Глагол обозначает просьбу или моление, но сам стих не требует превращать это действие в однозначное богослужебное поклонение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, библейским ритмом. Формулы «полевые звери», «небесные птицы» и «во всякое время» сохраняют образность оригинала, оставаясь понятными современному читателю.
