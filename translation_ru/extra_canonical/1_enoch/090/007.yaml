base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/007.yaml
  text: And they cried out to them[a], but they did not heed their words; rather, they were exceedingly deaf[c][b], and their eyes were exceedingly blinded.
translation:
  language: ru
  text: И они громко взывали к ним, но те не внимали их словам; напротив, они были совершенно глухи, и глаза их были совершенно ослеплены.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В эфиопском тексте усилительное слово повторено и при глухоте, и при ослеплении глаз, подчёркивая крайнюю степень их невосприимчивости.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወአስርኅዎሙ
  choice: И они громко взывали к ним
  rationale: 'Форма передаёт действие третьего лица множественного числа с объектным суффиксом третьего лица множественного числа: «они воззвали к ним». Наречие «громко» выражает силу крика, заложенную в глаголе.'
- source_word: ወኢያጽምኡ፡ ነገሮሙ
  choice: но те не внимали их словам
  rationale: Сочетание сохраняет третье лицо во фразе «их слова» и передаёт не просто отсутствие слухового восприятия, а непринятие сказанного, не усиливая смысл до прямого «не повиновались».
- source_word: ፈድፋደ
  choice: совершенно
  rationale: Повторённый усилитель перед обоими образами передан одинаково, чтобы сохранить риторический параллелизм и крайнюю степень нечувствительности.
- source_word: ተጸመሙ
  choice: были совершенно глухи
  rationale: Сохранён конкретный образ глухоты без замены его истолковывающей формулировкой о духовном ожесточении.
- source_word: ተጸለሉ፡ አዕይንቲሆሙ
  choice: глаза их были совершенно ослеплены
  rationale: Пассивная формулировка сохраняет сильный образ утраты зрения и не определяет явно, кем или чем вызвано ослепление.
- source_word: ተወንየሉ
  choice: напротив
  rationale: Передаёт противопоставительный переход от невнимания к усиленному описанию глухоты и слепоты.
theological_decisions:
- issue: Буквенная телесная неспособность или нравственно-духовная нечувствительность
  choice: В основном тексте сохранены конкретные образы глухоты и ослеплённых глаз.
  alternative: «Они духовно ожесточились и не повиновались».
  rationale: В образном строе видения телесное восприятие может выражать нравственно-духовное состояние, однако перевод не должен устранять конкретную образность и однозначно превращать её в толкование.
- issue: Причина ослепления
  choice: Сохранена пассивная форма «были ослеплены».
  alternative: «Они ослепили себя» или «Бог ослепил их».
  rationale: Источник не называет действующее лицо; перевод сохраняет эту богословски значимую неопределённость.
translation_notes:
  register: 'Современный литературный русский язык с достоинством апокалиптического повествования. «Взывали» поддерживает возвышенный регистр, а «не внимали» естественно передаёт сознательное непринятие услышанного. Местоимения согласованы с грамматикой геэз: третье лицо множественного числа — «они… к ним… их словам».'
