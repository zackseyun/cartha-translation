base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/020.yaml
  text: And I saw until a throne was set up in the pleasant land[a], and the Lord of the sheep sat upon it[b]; and he took all the sealed books and opened those books before the Lord of the sheep.
translation:
  language: ru
  text: И видел я, как в прекрасной земле[a] был воздвигнут престол, и воссел на нём Господь овец[b]. Он взял все запечатанные книги и раскрыл эти книги перед Господом овец.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Значение переведённого здесь эфиопского слова в данном текстовом свидетельстве не вполне ясно; возможно, оно обозначает особо избранную или благодатную землю, а не землю вообще.
    reason: lexical_alternative
  - marker: b
    text: 'В стихе титул «Господь овец» повторяется: так назван и Восседающий на престоле, и Тот, перед кем раскрывают книги. Перевод сохраняет это повторение, не сглаживая его.'
    reason: textual_variant
lexical_decisions:
- source_word: መንበር
  choice: престол
  rationale: В апокалиптической сцене суда речь идёт о царском и судейском месте; «престол» точнее сохраняет образ, чем нейтральное «сиденье».
- source_word: ተሐንጸ
  choice: был воздвигнут
  rationale: Пассивная форма обозначает сооружение или установление престола. «Был воздвигнут» естественно звучит в торжественном повествовании, не уточняя способ сооружения.
- source_word: ሐዋዝ
  choice: в прекрасной земле
  rationale: Значение эфиопского слова в данном свидетельстве не вполне ясно. В контексте образа земли в Апокалипсисе животных оно, вероятно, указывает на избранную или прекрасную землю, а не просто на землю вообще.
- source_word: እግዚአ፡ አባግዕ
  choice: Господь овец
  rationale: Повторяющийся титул передан единообразно; «Господь» сохраняет значение власти и возвышенный апокалиптический регистр.
- source_word: መጻሕፍተ፡ ኅትማተ
  choice: запечатанные книги
  rationale: Сочетание обозначает книги, скреплённые печатями, вероятно небесные записи. «Запечатанные книги» прямо и естественно передаёт эфиопскую формулировку.
- source_word: ፈትሖን
  choice: раскрыл
  rationale: Глагол имеет обычное значение «открывать». «Раскрыл» по-русски естественно сочетается с книгами, тогда как образ печатей уже выражен определением «запечатанные».
theological_decisions:
- issue: Кто восседает на престоле и перед кем раскрывают книги
  choice: 'Сохранить формулировку геэзского текста: Господь овец восседает на престоле, и книги раскрываются перед Господом овец.'
  alternative: Исправить одно из упоминаний, предполагая, что на престоле восседает иное небесное существо или что книги раскрываются перед другим лицом.
  rationale: Переданный текст содержит несколько неловкое повторение, однако остаётся связным и не требует молчаливого исправления. Повтор может намеренно подчёркивать, что Господь овец является и восседающим Судьёй, и тем, перед кем представлены записи.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим регистром. Синтаксис сделан ясным для широкого читателя; спорное территориальное значение ሐዋዝ и повтор титула сохранены и пояснены в сносках.
