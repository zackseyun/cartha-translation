base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/024.yaml
  text: And judgment took place first upon the stars[a], and they were judged and were found to be sinners, and they went to the place of judgment; and they cast them into an abyss, full of fire and flaming[c][b], and full of pillars of fire.
translation:
  language: ru
  text: 'И сначала был совершён суд над звёздами[a]: они были судимы и оказались грешниками. Они пошли к месту суда, и их бросили в бездну, полную огня и пламени и полную огненных столпов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально выражение также можно понять как «перед звёздами» или «в присутствии звёзд». Однако в последовательности этого видения оно передаёт, что суд сначала совершается над звёздами.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵነኔ
  choice: суд
  rationale: Слово обозначает судебное разбирательство; повтор «суд — были судимы — место суда» сохраняет повторение одного корня и не смешивает процесс с приговором.
- source_word: ቅድመ እምከዋክብት
  choice: прежде всего … над звёздами
  rationale: В последовательности видения звёзды выступают первой группой, подвергнутой суду. Предлог «над» ясно обозначает объект суда, а не его свидетелей.
- source_word: ተኰነኑ
  choice: были судимы
  rationale: Страдательная судебная формулировка сохраняет отличие разбирательства от последующего утверждения об их греховности.
- source_word: ኃጥኣነ
  choice: грешниками
  rationale: Передаёт нравственно-религиозный смысл слова, не сводя его к чисто юридическому «виновными».
- source_word: ሖሩ መካነ ኵነኔ
  choice: пошли к месту суда
  rationale: Сохраняет конкретное движение в пространстве видения и повтор судебной лексики.
- source_word: ወደይዎሙ
  choice: их бросили
  rationale: Безлично-неопределённая русская конструкция передаёт действие неназванных исполнителей и не создаёт ложной связи со звёздами как субъектом.
- source_word: ውስተ ዕሙቅ
  choice: в бездну
  rationale: «Бездна» естественно передаёт глубокую карательную пропасть в апокалиптическом образе, не заменяя её позднейшим догматическим термином.
- source_word: ምሉእ እሳት ወይላህብ
  choice: полную огня и пламени
  rationale: Сохраняет накопление огненных образов и звучит естественно в современном литературном русском.
- source_word: አዕማደ እሳት
  choice: огненных столпов
  rationale: Передаёт вертикальные колонны или столпы огня и сохраняет монументальность образа.
theological_decisions:
- issue: Передавать ли судебную лексику как процесс или сразу как осуждение
  choice: 'Сохранить последовательность: «суд», «были судимы», затем «оказались грешниками».'
  alternative: «Осуждение совершилось», «были осуждены».
  rationale: Источник повторяет корень со значением суда и отдельно сообщает о греховности звёзд; перевод не сливает разбирательство с его обвинительным итогом.
- issue: Обозначение места наказания
  choice: Сохранить конкретный образ бездны, огня, пламени и огненных столпов.
  alternative: Передать обобщённо как «ад» или «адский огонь».
  rationale: Источник рисует апокалиптическую сцену, но не употребляет более поздний догматический термин.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным апокалиптическим звучанием. Повтор слова «суд» сохранён намеренно; синтаксис слегка упорядочен для ясности без сглаживания образности.
