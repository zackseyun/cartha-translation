base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/004.yaml
  text: And I saw until those sheep were devoured by the dogs and by the eagles and by the kites[a], and they left them no flesh at all, nor skin, nor sinew, until only their bones stood there; and even their bones fell upon the earth[e][d][c][b], and the sheep became few.
translation:
  language: ru
  text: И видел я, как тех овец пожирали собаки, орлы и коршуны[a]. От них не осталось ни мяса, ни кожи, ни жил. Стояли одни лишь их кости; но даже кости их упали на землю, и овец стало мало.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «коршуны», может обозначать и другую хищную птицу, например ястреба или сокола.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተበልዑ
  choice: пожирали
  rationale: Пассивная форма описывает поедание хищниками; «пожирали» естественно передаёт жестокость сцены.
- source_word: አክልብት
  choice: собаки
  rationale: Прямое и обычное обозначение животных сохраняет образный строй видения.
- source_word: አንስርት
  choice: орлы
  rationale: Стандартное соответствие; оснований заменять его в основном тексте на «грифов» недостаточно.
- source_word: ሆባይ
  choice: коршуны
  rationale: Термин обозначает хищную птицу, отличную от названных перед ней орлов; видовая точность остаётся не вполне определённой и отмечена в сноске.
- source_word: ኢኃደጉ ሎሙ ሥጋ ግሙራ
  choice: не оставили на них ни мяса
  rationale: 'ግሙራ при отрицании усиливает полноту: мяса не осталось вовсе; перевод не создаёт ошибочного впечатления, будто могло сохраниться немного мяса.'
- source_word: ማእሰ
  choice: кожи
  rationale: Наиболее естественное обозначение кожи овец в данном ряду частей тела.
- source_word: ሥርወ
  choice: жил
  rationale: «Жилы» понятно передают сухожилия и сохраняют лаконичный ряд «мясо — кожа — жилы».
- source_word: ቆሙ ባሕቲቶ አዕፅምቲሆሙ
  choice: стояли одни лишь их кости
  rationale: Сохранён необычный и резкий зрительный образ стоящих обнажённых костей, а не сглаженное «остались только кости».
- source_word: ወአዕፅምቲሆሙሰ ወደቁ ዲበ ምድር
  choice: но даже кости их упали на землю
  rationale: '«Но даже» передаёт контрастно-кульминационную силу частицы -ሰ: сначала кости стояли, затем и они пали.'
- source_word: ወንእሱ አባግዕ
  choice: и овец стало мало
  rationale: Близко передаёт уменьшение их числа без добавочного истолкования.
theological_decisions:
- issue: Символические животные в апокалиптическом видении
  choice: Сохранить в основном тексте буквальные названия животных.
  alternative: Раскрыть символы как народы, правителей или войска, нападающие на Израиль.
  rationale: Текст повествует посредством последовательной зооморфной символики; перевод не должен подменять образ его возможным толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Инверсия «И видел я» поддерживает стиль видения, не делая речь архаичной; жестокие и необычные образы источника не сглажены.
