  source_fidelity: 'В целом перевод точно передаёт последовательность образов, перечень хищников, полное уничтожение плоти, кожи и жил, затем стоящие кости, их падение и уменьшение числа овец. Однако «не оставили на них» по-русски двусмысленно и несколько неестественно: можно понять как «не оставили [чего-то] на овцах», тогда как смысл — ничего не оставили от них/им. Связка «так что» также способна придать образу костей причинно-следственный оттенок; в источнике это последовательное описание результата. Контрастное «но» перед «даже кости» оправдано как передача фокусной частицы, но естественнее поставить его после точки с запятой.'
