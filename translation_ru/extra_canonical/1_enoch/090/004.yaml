  terminology: «Собаки», «орлы», «коршуны», «кожа», «жилы» и «кости» уместны. «Коршуны» разумно оставлено с лексической оговоркой. «Пожирали» соответствует жестокому образу, хотя пассивную форму оригинала в русском естественно передаёт активная конструкция с названными хищниками.
