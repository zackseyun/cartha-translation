base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/023.yaml
  text: And behold[a], I saw all the prisoners, and they all stood before him.
translation:
  language: ru
  text: И вот, я увидел всех узников[a], и все они стояли перед ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «связанных»; «пленников». Эфиопское слово подчёркивает, что их удерживают под стражей или в неволе.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወናሁ
  choice: И вот
  rationale: Сохраняет характерную для видения указательную формулу и возвышенный апокалиптический регистр, не сводя выражение к простому повествовательному союзу.
- source_word: ኵሎሙ
  choice: всех / все они
  rationale: Передаёт подчёркнутую всеохватность и сохраняет двукратное употребление слова в стихе естественными средствами русского языка.
- source_word: እሱራነ
  choice: узников
  rationale: Слово обозначает людей или существ, удерживаемых в заключении либо под стражей. «Узники» естественно звучит по-русски и не уточняет их аллегорическую принадлежность.
- source_word: ርኢኩ
  choice: я увидел
  rationale: Прямая передача формы первого лица в повествовании о видении.
- source_word: ወቆሙ
  choice: и … стояли
  rationale: В судебной сцене глагол естественно обозначает положение представших перед высшей фигурой; несовершенный вид по-русски хорошо передаёт увиденное состояние.
- source_word: ቅድሜሁ
  choice: перед ним
  rationale: Кратко и формально передаёт нахождение в присутствии ранее названной в контексте фигуры, не конкретизируя её здесь.
theological_decisions:
- issue: Кто именно назван удерживаемой группой
  choice: Передать እሱራነ как «узники», не называя их звёздами, пастырями или ангельскими преступниками.
  alternative: «связанные» или «пленники» с контекстуальным уточнением их принадлежности
  rationale: Сам стих определяет эту группу по её несвободному состоянию, тогда как конкретное аллегорическое отождествление зависит от более широкого контекста. Перевод сохраняет образ и не разрешает скрытую в нём неоднозначность.
translation_notes:
  register: Современный литературный русский язык с лаконичным, достойным апокалиптическим звучанием. Повтор «всех / все» сохранён как смысловое усиление оригинала.
