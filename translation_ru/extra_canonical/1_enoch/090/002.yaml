base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/002.yaml
  text: And after that I saw in my vision all the birds of heaven coming—eagles[a], vultures, kites, and ravens—and the eagles led all the birds. And they began to devour those sheep[c][b], and to peck out their eyes and devour their flesh.
translation:
  language: ru
  text: 'После этого я увидел в своём видении, как прилетели все птицы небес: орлы[a], грифы, коршуны и вороны; и орлы вели за собой всех птиц. И они принялись пожирать тех овец[b], выклёвывать им глаза и пожирать их плоть.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Названия птиц в этом перечне не всегда позволяют установить точные современные биологические виды; некоторые слова можно передать иначе, например «ястребы» вместо «коршуны» или «стервятники» вместо «грифы».
    reason: lexical_alternative
  - marker: b
    text: Начало нападения можно также понять как «они схватили тех овец и пожирали их».
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ በራእየየ
  choice: я увидел в своём видении
  rationale: Сохраняет первое лицо, рамку видения и притяжательное значение; естественно звучит по-русски.
- source_word: ኵሉ አዕዋፈ ሰማይ
  choice: все птицы небесные
  rationale: Передаёт возвышенный апокалиптический регистр и остаётся понятным современному читателю.
- source_word: አንስርት
  choice: орлы
  rationale: Обычное соответствие в эфиопской библейской лексике; возможна более широкая отсылка к крупным хищным птицам.
- source_word: አውስት
  choice: грифы
  rationale: Подходит для перечня хищных и падалеядных птиц; точная современная таксономия не вполне надёжна.
- source_word: ሆባይ
  choice: коршуны
  rationale: Осторожно передаёт название меньшей хищной птицы, не устраняя лексической неопределённости.
- source_word: ቋዓት
  choice: вороны
  rationale: Естественное русское обозначение зловещих птиц семейства врановых в возвышенном повествовании.
- source_word: ይመረሕዎሙ ለኵሎሙ አዕዋፍ
  choice: орлы вели за собой всех птиц
  rationale: Второе አንስርት понимается как явное подлежащее, а не как пятый элемент перечня; глагол передаёт руководство движением.
- source_word: አኃዙ ይብልዕዎሙ
  choice: принялись пожирать
  rationale: Передаёт начинательное значение конструкции и жестокость действия; возможен разбор «схватили и стали пожирать».
- source_word: ዝኩ አባግዕ
  choice: тех овец
  rationale: Указательное слово отсылает к овцам, уже присутствующим в последовательности видения.
- source_word: ይክረዩ አዕይንቲሆሙ
  choice: выклёвывать им глаза
  rationale: Конкретно сохраняет птичью образность нападения.
- source_word: ይበልዕዎሙ ለሥጋሆሙ
  choice: пожирать их плоть
  rationale: Сохраняет повтор мотива пожирания и телесную жестокость образа.
theological_decisions:
- issue: Символика Апокалипсиса животных
  choice: Образы птиц и овец сохранены буквально, без отождествления с историческими народами или правителями.
  alternative: Встроить историческое толкование символов непосредственно в перевод.
  rationale: Исходный текст представляет аллегорическое видение, но перевод должен сохранять его образы и богословское напряжение, а не заменять их частным толкованием.
