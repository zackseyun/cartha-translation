  yaml_path: translation/extra_canonical/1_enoch/012/001.yaml
  text: Before these things[b][a], Enoch was hidden.
translation:
  language: ru
  text: 'До всего этого[a] Енох был сокрыт, и никто из сынов человеческих не знал, где он был сокрыт, где находился и что с ним стало. Во дни его все его деяния были со святыми и со Стражами[b].


    Я, Енох, благословлял великого Господа и Царя мира. И вот, Стражи позвали меня, Еноха, писца праведности, и сказали мне:


    «Енох, писец праведности, пойди и объяви Стражам небесным, которые оставили высокое небо и вечное святое обиталище, осквернились с женщинами, поступали так, как поступают сыны человеческие, взяли себе жён и совершили на земле великое растление: не будет им на земле ни мира, ни прощения греха. Ибо они радуются своим детям, и увидят гибель тех, кого любят; будут рыдать о погибели своих детей и вечно молить, однако не будет им ни милости, ни мира».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «прежде всех этих событий».'
    reason: Начальный оборот выражает временное предшествование; русское «до всего этого» избегает нетемпорального значения «прежде всего» («в первую очередь»).
  - marker: b
    text: То есть небесными существами; их название буквально связано с бодрствованием и бдительностью.
    reason: Русское традиционное название «Стражи» передаёт функцию и имя группы, но не полностью показывает этимологию геэзского слова.
lexical_decisions:
- source_word: እምቅድመ፡ ኵሉ፡ ነገር
  choice: Прежде всего этого
  rationale: Оборот выражает временное предшествование событиям, о которых шла речь; русское «всего этого» естественно передаёт собирательное ኵሉ፡ ነገር, не превращая его в утверждение о времени до сотворения мира.
- source_word: ተከብተ
  choice: был сокрыт
  rationale: По контексту это пассивное обозначение сокрытия Еноха; тот же глагол повторён далее в вопросе о месте, где он был сокрыт.
- source_word: ትጉሃን
  choice: Стражи
  rationale: Так передано устойчивое название небесных существ в 1 Енохе. Примечание сохраняет буквальную связь слова с бодрствованием и бдительностью.
- source_word: ጸሓፌ፡ ጽድቅ
  choice: писец праведности
  rationale: Формальное сочетание существительных сохранено без уточнения, означает ли оно праведного писца или писца, записывающего праведные определения.
- source_word: ምቅዋመ፡ ቅዱሰ፡ ዘለዓለም
  choice: вечное святое обиталище
  rationale: ምቅዋም обозначает место пребывания или установленное место; «обиталище» естественно в данном небесном контексте.
- source_word: ማሰኑ፡ ዐቢየ፡ ሙስና
  choice: принесли на землю великое растление
  rationale: Сохраняется повтор корня со значением порчи и растления, но русская формулировка избегает тяжеловесного буквального повтора.
- source_word: ቀትለ፡ ፍቁራኒሆሙ
  choice: гибель тех, кого любят
  rationale: ቀትል может указывать на убийство или насильственную смерть; «гибель» сохраняет суровый смысл, не конкретизируя исполнителя.
theological_decisions:
- issue: Объём предоставленного эфиопского текста
  choice: Переведён весь предоставленный связный текст, хотя он охватывает содержание, обычно распределяемое между несколькими стихами главы.
  alternative: Ограничить перевод первым кратким предложением вслед за прежним английским консультационным слоем.
  rationale: В исправленном источнике присутствует полный связный отрывок. Приоритет оригинального свидетельства требует перевести весь поданный текст, а не следовать устаревшей краткой английской версии.
- issue: Смысл выражения «писец праведности»
  choice: Сохранена конструкция «писец праведности».
  alternative: Передать как «праведный писец».
  rationale: Геэзская конструкция допускает смысловую напряжённость между качеством самого писца и предметом его писания; буквальная русская конструкция не устраняет эту неоднозначность.
- issue: Связь радости о детях с последующим судом
  choice: «Ибо они радуются своим детям, но увидят…»
  alternative: «За то, что они радуются своим детям, они увидят…»
  rationale: Источник вводит фразу причинным союзом, однако логическая связь с карой остаётся напряжённой. «Ибо… но» сохраняет эту связь и противопоставление, не утверждая, будто сама родительская радость является грехом.
- issue: Прощение падших Стражей
  choice: 'Прямо сохранён приговор: «не будет им… прощения греха».'
  alternative: Смягчить или истолковать приговор как временный.
  rationale: Источник формулирует отрицание без оговорок; перевод не должен привносить конфессиональное объяснение его объёма или длительности.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным тоном. Термин «сыны человеческие» сохранён как характерная для древнего текста формула; архаические глагольные формы и церковнославянизмы не используются. Прямая речь оформлена для ясности, поскольку в источнике Стражи обращаются к Еноху с последующим пророческим поручением.
