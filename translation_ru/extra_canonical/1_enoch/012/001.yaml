  naturalness: В целом регистр уместен и прямая речь оформлена естественно. После устранения двусмысленного «Прежде всего этого» текст будет звучать современно и литературно. «Писец праведности» оправданно сохраняет исходную неоднозначность.
  terminology: «Енох», «Стражи», «сыны человеческие» и «писец праведности» переданы последовательно. «Царь вечности» следует заменить на «Царь мира» (возможное «Царь века» менее естественно здесь), чтобы не подменять ዓለም. Сноску о Стражах можно сохранить.
