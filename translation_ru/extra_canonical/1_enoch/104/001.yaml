base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/104/001.yaml
  text: I swear to you that in heaven the angels remember you for good before the glory of the Great One[a][b][c].
translation:
  language: ru
  text: 'Клянусь вам: на небесах ангелы помнят о вас во благо перед славой Великого[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Представленная геэзская строка обрывается после слова «перед». Окончание «славой Великого» восстановлено по сохранившемуся параллельному чтению этого стиха.
    reason: textual_variant
lexical_decisions:
- source_word: እምሕል፡ ለክሙ፡
  choice: Клянусь вам
  rationale: Это обычная формула клятвенного заверения; она прямо передаёт первое лицо и обращение во множественном числе.
- source_word: በሰማይ፡
  choice: на небесах
  rationale: Естественный русский эквивалент местного выражения; сохраняет небесную сцену.
- source_word: ይዜከሩ፡ መላእክት፡
  choice: ангелы помнят
  rationale: Глагол передаёт памятование, а существительное недвусмысленно означает ангелов; нет оснований заменять их образом небесной записи.
- source_word: በእንቲአክሙ፡ ለሠናይ፡
  choice: помнят о вас во благо
  rationale: Передаёт направленность памятования на адресатов и его благоприятный для них смысл, не уточняя сверх текста, в чём именно состоит это благо.
- source_word: በ*ቅድመ፡
  choice: перед
  rationale: Предлог вводит образ предстояния перед небесной славой; продолжение фразы в представленной геэзской строке утрачено или не приведено.
theological_decisions:
- issue: Характер небесного памятования
  choice: Сохранено прямое утверждение, что ангелы помнят о праведных во благо перед божественной славой.
  alternative: Истолковать памятование как запись дела праведных в небесной судебной книге.
  rationale: Судебный оттенок возможен в контексте 1 Еноха, однако данный текст прямо говорит об ангелах и памятовании и не упоминает книгу или запись.
- issue: Обозначение Бога как «Великий»
  choice: Великий
  alternative: Величайший
  rationale: Субстантивированное прилагательное сохраняет титульный характер выражения и не вводит превосходную степень, не засвидетельствованную в восстановленном обороте.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным строем. Клятвенная формула передана прямо; двоеточие естественно отделяет заверение от его содержания. Выражение «во благо» сохраняет краткость и некоторую смысловую открытость оригинала.
