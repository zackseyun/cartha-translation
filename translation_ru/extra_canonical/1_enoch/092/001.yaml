base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/092/001.yaml
  text: The book written by Hanok—[Hanok indeed wrote every sign of wisdom[a], praised among all people and a judge of all the earth]—for all my children who will dwell on the dry land[d][c][b], and for the generations to come who practice righteousness and peace.
translation:
  language: ru
  text: Книга, написанная Енохом, — [Енох действительно написал все знамения мудрости, прославленный всеми людьми и судья всей земли][a] — для всех моих детей, которые будут жить на суше[b], и для грядущих поколений[c], творящих праведность и мир.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Заключённая в квадратные скобки фраза в данном эфиопском свидетельстве текстуально неустойчива; она сохранена в осторожном, близком к форме источника переводе.
    reason: textual_variant
  - marker: b
    text: 'Буквально: «на сухой земле». Иногда это выражение передают более обобщённо: «на земле» или «в мире».'
    reason: lexical_alternative
  - marker: c
    text: 'Переданная в транскрипции форма, вероятно, искажена при распознавании текста и восстановлена здесь в значении «грядущие». При буквальном чтении имеющейся формы возможно понимание: «избранные», что дало бы: «для поколения избранных».'
    reason: alternative_reading
lexical_decisions:
- source_word: ዘተጽሕፈ፡ እምሄኖክ፡ መጽሐፍ
  choice: Книга, написанная Енохом
  rationale: Сохраняет заголовочный характер пассивной конструкции и естественно звучит по-русски; традиционная русская форма имени — «Енох».
- source_word: ትእምርተ፡ ጥበብ
  choice: все знамения мудрости
  rationale: «Знамения» передаёт возвышенный и апокалиптический оттенок слова, а сочетание с ኵሉ выражает полноту совокупности.
- source_word: እምኵሉ፡ ሰብእ፡ ስቡሕ
  choice: прославленный среди всех людей
  rationale: Передаёт универсальный охват, не делая более определённого вывода о синтаксической функции предлога, чем позволяет нестабильная строка.
- source_word: መኰንነ፡ ኵሉ፡ ምድር
  choice: судья всей земли
  rationale: Существительное обозначает носителя власти, правителя или судью; ближайший контекст и консультационный слой поддерживают здесь «судью», сохраняя оттенок власти.
- source_word: ለኵሎሙ፡ ውሉድየ
  choice: для всех моих детей
  rationale: Сохраняет явное притяжательное значение и семейное обращение без неоправданного ограничения мужским полом.
- source_word: የኃድሩ፡ ዲበ፡ የብስ
  choice: которые будут жить на суше
  rationale: Относительное предложение отнесено к «моим детям», а конкретный образ суши сохранён без сглаживания до общего «в мире».
- source_word: ለትውልድ፡ ይኃርያን
  choice: для грядущих поколений
  rationale: Следует наиболее вероятному восстановлению повреждённого или ошибочно распознанного чтения со значением будущего времени; неопределённость отмечена в сноске.
- source_word: ይገብሩ፡ ርተዐ፡ ወሰላመ
  choice: творящих праведность и мир
  rationale: Сохраняет активный глагол и весомые этические существительные, не сводя выражение к более слабому «живущих хорошо и мирно».
theological_decisions:
- issue: Следует ли понимать спорную форму ይኃርያን как обозначение избранных
  choice: грядущих поколений
  alternative: поколений избранных / избранных
  rationale: Наиболее вероятно, что переданная форма возникла из ошибки распознавания слова со значением «последующие, грядущие». Перевод не вводит учение об избранных в основной текст, но альтернативное чтение открыто указано в сноске.
- issue: Передача выражения «делать праведность и мир»
  choice: творящих праведность и мир
  alternative: живущих праведно и мирно
  rationale: Выбранная формулировка сохраняет богословско-этическую предметность обоих понятий и активный характер исходного глагола.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего заголовка. Синтаксис намеренно сохраняет некоторую плотность исходного текста; квадратные скобки и сноски обозначают реальную текстологическую неустойчивость, не скрывая её за плавной парафразой.
