base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/092/002.yaml
  text: Do not let your spirit be grieved because of the times[a], for the Holy and Great One has appointed days for all.
translation:
  language: ru
  text: Пусть ваш дух не скорбит из-за времён, ибо Святой и Великий определил дни для всего[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для всех» либо «для каждого». Эфиопское выражение имеет широкий смысл и может относиться как ко всему вообще, так и ко всем людям.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አትሕዝኑ
  choice: Пусть … не скорбит
  rationale: Отрицательная повелительная форма со словом «дух» передана естественной русской конструкцией, сохраняющей внутреннюю направленность скорби.
- source_word: መንፈስክሙ
  choice: ваш дух
  rationale: «Дух» сохраняет основной антропологический смысл и возвышенный регистр, не сужая значение до разума или душевного состояния.
- source_word: በአዝማን
  choice: из-за этих времён
  rationale: Предлог в контексте естественно указывает на причину скорби; «времена» сохраняет апокалиптический исторический оттенок. Указательное «этих» делает русскую фразу естественной, не меняя референции.
- source_word: መዋዕለ
  choice: дни
  rationale: Сохранено конкретное значение исходного существительного, хотя по контексту оно может обозначать также установленные сроки или периоды.
- source_word: ወሀበ
  choice: определил
  rationale: Буквальное «дал» применительно к дням имеет значение уделения или назначения; «определил» естественно выражает установление сроков Богом.
- source_word: ቅዱስ ወዐቢይ
  choice: Святой и Великий
  rationale: Парные эпитеты переданы как единый почтительный титул Бога; прописные буквы обозначают личный божественный референт.
- source_word: ለኵሉ
  choice: для всего
  rationale: Нейтральное собирательное выражение близко к широте исходной формы и допускает космико-исторический охват, не добавляя существительного «вещи».
theological_decisions:
- issue: Объём божественного определения в выражении ለኵሉ
  choice: для всего
  alternative: для всех / для каждого
  rationale: Исходная форма допускает как безлично-всеобщий, так и личный охват. Основной текст сохраняет широкое космико-историческое прочтение, а личное отмечено в сноске без устранения неоднозначности.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным увещательным и апокалиптическим регистром. Синтаксис плавный; божественный титул сохранён без конфессионального уточнения.
