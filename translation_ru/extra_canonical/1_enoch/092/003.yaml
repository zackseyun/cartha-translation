base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/092/003.yaml
  text: And the righteous one shall rise from sleep[a], and he shall arise and walk in the path of righteousness[d][c][b]; and all his path and his course shall be in goodness and in everlasting kindness.
translation:
  language: ru
  text: И праведник восстанет ото сна[a], поднимется и пойдёт путём праведности[b]; и весь его путь и всё его хождение будут в добре и вечной милости[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Ото сна» может обозначать как буквальное пробуждение, так и образ пробуждения к обновлённой жизни; сам стих не требует лишь одного из этих пониманий.
    reason: lexical_alternative
  - marker: b
    text: 'Возможно также: «по пути праведности» или «стезёй праведности».'
    reason: lexical_alternative
  - marker: c
    text: Слово, переведённое как «милость», может также означать благоволение, снисхождение, кротость или благость.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጻድቅ
  choice: праведник
  rationale: Сохраняет единственное число и индивидуализирующий характер формы, не навязывая ни мессианского, ни собирательного толкования.
- source_word: ይትነሣእ … ይትነሣእ
  choice: восстанет … поднимется
  rationale: Передаёт риторическое повторение одного глагола, но избегает неестественной для русского тавтологии. Первая форма вместе с образом сна допускает как обычное пробуждение, так и намёк на возвращение к жизни.
- source_word: እምንዋም
  choice: ото сна
  rationale: Предлог обозначает исходную точку, а существительное — сон или дремоту. Краткий оборот сохраняет образ и его неоднозначность.
- source_word: የኃልፍ በፍኖተ ጽድቅ
  choice: пойдёт путём праведности
  rationale: Глагол может означать прохождение или движение вперёд; в сочетании с «путём» естественный русский оборот сохраняет нравственную метафору источника.
- source_word: ኵሉ ፍኖቱ ወምሕዋሩ
  choice: весь его путь, и всё его хождение
  rationale: 'Сохраняются два параллельных образа: путь и движение или образ хождения. «Хождение» не сужает значение до одних поступков или путешествия.'
- source_word: በኂሩት
  choice: в добре
  rationale: Передаёт широкое значение добра, благости или благотворности, не ограничивая его одной лишь добротой к людям.
- source_word: በሣህል ዘለዓለም
  choice: в вечной милости
  rationale: ሣህል охватывает милость, кротость, снисхождение и благоволение; «милость» естественна по-русски, а примечание сохраняет более широкий смысловой диапазон.
theological_decisions:
- issue: Означает ли восстание ото сна телесное воскресение или иное пробуждение
  choice: В основном тексте сохранён образ восстания ото сна без прямого упоминания смерти или воскресения.
  alternative: Истолковать выражение непосредственно как воскресение из мёртвых либо как нравственное и духовное пробуждение.
  rationale: Геэзский текст соединяет сон и вставание, но сам не уточняет вид пробуждения; перевод не должен устранять эту богословскую неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, но понятным библейским ритмом. Асиндетическое повторение глагола передано последовательностью «восстанет…, поднимется», без добавления союза между двумя формами; союз «и» сохранён перед последующим глаголом движения. Формула «в добре» намеренно несколько плотная, чтобы не превращать характеристику пути в свободный нравоучительный пересказ.
