base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/008.yaml
  text: From now on[b][a], know that all your violence that you commit is being written down every day until the day of your judgment.
translation:
  language: ru
  text: 'Отныне знайте: всё ваше насилие[a], которое вы совершаете, записывается каждый день[b] — до дня вашего суда.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «угнетение»; это слово может обозначать насильственную несправедливость, а не только физическое насилие.'
    reason: lexical_alternative
  - marker: b
    text: Эти слова перекликаются с апокалиптическим образом деяний, записываемых в ожидании дня суда.
    reason: cross_reference
lexical_decisions:
- source_word: እምይእዜ
  choice: Отныне
  rationale: Кратко и естественно передаёт временной переход и направленность предупреждения в будущее.
- source_word: ታእምሩ
  choice: знайте
  rationale: Форма множественного числа сохраняет прямое повелительное обращение и резкий предостерегающий тон.
- source_word: ግፍዕክሙ
  choice: ваше насилие
  rationale: Передаёт тяжесть обвинения; слово обозначает также угнетение и насильственную несправедливость, что отмечено в сноске.
- source_word: ዘትገፍዑ
  choice: которое вы совершаете
  rationale: Относительная глагольная форма повторяет корень существительного; по-русски буквальный повтор звучал бы неестественно, поэтому сохранены продолжающийся характер действий и смысловая связь.
- source_word: ይጸሐፍ
  choice: записывается
  rationale: Страдательная форма и несовершенный вид передают продолжающееся внесение деяний в запись, не уточняя прямо, кто записывает.
- source_word: በኵሉ ዕለት
  choice: каждый день
  rationale: Прямое и естественное соответствие временному выражению.
- source_word: እስከ ዕለተ ኵነኔክሙ
  choice: до дня вашего суда
  rationale: Сохраняет эсхатологическую формулу и не сужает значение до заранее предрешённого осуждения.
theological_decisions:
- issue: Запись деяний перед судом
  choice: Сохранён образ продолжающейся записи насильственных деяний вплоть до суда.
  alternative: Понять слова лишь метафорически — как утверждение, что деяния не забыты, либо как указание на человеческий судебный реестр.
  rationale: Страдательное «записывается» и предел «до дня вашего суда» естественно согласуются с апокалиптическим образом записей для грядущего суда; основной текст не добавляет отсутствующего в стихе прямого определения «небесная».
- issue: Суд или осуждение
  choice: суд
  alternative: осуждение
  rationale: «Суд» сохраняет более широкое значение исходного слова и не предрешает в переводе формулировку приговора.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным тоном. Двоеточие подчёркивает предупреждение, тире перед конечной временной формулой придаёт ей вес. Все сносочные маркеры присутствуют в основном тексте.
