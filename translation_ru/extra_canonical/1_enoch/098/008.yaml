  source_fidelity: «Отныне знайте» точно передаёт временной маркер и повелительное обращение во множественном числе. «Всё ваше насилие, которое вы совершаете» сохраняет всеобщий охват, притяжательность и относительное пояснение, повторяющее корень обвинения. Страдательное «записывается каждый день» адекватно выражает продолжаемое действие без добавления действующего лица; «до дня вашего суда» верно передаёт эсхатологический временной предел, не подменяя суд осуждением.
  naturalness: Текст написан естественным современным литературным русским языком и сохраняет уместный для пророческого предупреждения торжественный регистр. Двоеточие после «знайте» и тире перед заключительной временной формулой допустимы и выразительны. Относительное придаточное с запятыми нормативно.
