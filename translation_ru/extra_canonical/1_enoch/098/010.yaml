base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/010.yaml
  text: And now know that you are prepared for the day of destruction[a], and do not hope that you sinners will live; rather, you will depart and die, for you do not know any ransom[d][c][b], because you have been made ready for it.
translation:
  language: ru
  text: 'И теперь знайте: вы уготованы ко дню погибели[a]. Не надейтесь, грешники, что останетесь в живых; напротив, вы уйдёте и умрёте, потому что вам неведом никакой выкуп[b], ибо вы к этому приготовлены.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «ко дню истребления» или, резче, «ко дню заклания». Геэзское слово может обозначать гибель и разорение при суде, а в данном контексте допускает и значение массового умерщвления.'
    reason: lexical_alternative
  - marker: b
    text: «Выкуп» — цена или средство освобождения от грядущего суда. Исходное выражение буквально говорит, что грешникам неведом никакой выкуп, не уточняя отдельно, существует ли ещё возможность избавления.
    reason: cultural_note
lexical_decisions:
- source_word: ወይእዜኒ አእምሩ
  choice: И теперь знайте
  rationale: Сохраняет временной переход и прямое повеление во множественном числе.
- source_word: ድልዋን
  choice: уготованы
  rationale: Передаёт состояние готовности или предназначенности к грядущему событию, сохраняя торжественный тон речи о суде.
- source_word: ለዕለተ ሐጕል
  choice: ко дню погибели
  rationale: Передаёт катастрофическую гибель в контексте суда, не сужая значение до буквального заклания.
- source_word: ከመ ትሕየዉ ኃጥኣን
  choice: грешники, что останетесь в живых
  rationale: Форма глагола имеет второе лицо множественного числа; «грешники» понимается как обращение к тем же адресатам, а не как подлежащее третьего лица.
- source_word: አላ ትሐውሩ ወትመውቱ
  choice: напротив, вы уйдёте и умрёте
  rationale: Сохраняет последовательность двух исходных глаголов — ухода и смерти — без их слияния.
- source_word: ቤዛ
  choice: выкуп
  rationale: Сохраняет конкретный образ цены или средства освобождения и не подменяет его более толковательными словами «избавление» или «искупление».
- source_word: ተደለውክሙ
  choice: вас приготовили к этому
  rationale: Передаёт пассивное приготовление и подразумеваемую соотнесённость с днём погибели; иной русский глагол отличает эту форму от ድልዋን в начале стиха.
theological_decisions:
- issue: Значение «выкупа» в пророчестве о суде
  choice: Сохранён образ выкупа как неведомого адресатам средства освобождения.
  alternative: 'Передать толковательно: «для вас нет избавления» или «вы не знаете искупления».'
  rationale: Исходный текст говорит о знании выкупа, а не прямо утверждает его абсолютное отсутствие; буквальный образ сохраняет богословское напряжение и не вносит позднейшую доктринальную формулу.
- issue: Адресаты слов о жизни
  choice: '«грешники» передано как обращение к адресатам второго лица: «что останетесь в живых».'
  alternative: «что грешники останутся в живых».
  rationale: Глагольная форма ትሕየዉ указывает на второе лицо множественного числа; перевод не превращает адресатов в третье лицо.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического предостережения. Обращение «грешники» поставлено естественно для русского синтаксиса; «уготованы» сохраняет торжественность, а остальные формулировки остаются понятными обычному читателю.
