base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/004.yaml
  text: 'I swear to you[a], sinners: as a mountain has not become a servant, and a hill does not become a maidservant of a woman, so sin was not sent upon the earth; rather, men created it from themselves[c][b], and those who do it will come under a great curse.'
translation:
  language: ru
  text: 'Клянусь вам, грешники: как гора не становится рабом, а холм — служанкой женщины,[a] так и грех не был послан на землю; напротив, люди сами создали его,[b] и те, кто совершает его, подпадут под великое проклятие.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начальное сравнение в геэзском тексте трудно для истолкования. По-видимому, смысл таков: как гора или холм не становятся рабом либо служанкой, так и грех не является навязанным свойством творения.'
    reason: textual_variant
  - marker: b
    text: 'Буквальная форма выражения восходит к слову «голова», однако в геэзском языке сочетание с местоименным суффиксом обычно служит возвратным выражением: «от самих себя», «по собственной воле».'
    reason: lexical_alternative
lexical_decisions:
- source_word: መሐልኩ
  choice: Клянусь
  rationale: Передаёт торжественное заверение, обращённое к грешникам, сохраняя силу формулы клятвы.
- source_word: ኃጥኣን
  choice: грешники
  rationale: Естественное религиозно-нравственное обозначение, сохраняющее судебный контекст речи.
- source_word: ደብር
  choice: гора
  rationale: Сохраняет конкретный и выразительный топографический образ.
- source_word: ገብረ
  choice: стала рабом
  rationale: В трудной сравнительной конструкции сохраняет сильное значение подневольного состояния, не смягчая его до обычного служения.
- source_word: እማገር ለብእሲት
  choice: служанкой женщины
  rationale: Сохраняет женскую параллель к образу раба и формальную необычность исходной конструкции.
- source_word: ኃጢአትኒ ኢተፈነወት ዲበ ምድር
  choice: грех не был послан на землю
  rationale: Сохраняет пассивную конструкцию и противопоставление внешнего ниспослания человеческому происхождению греха.
- source_word: አላ ሰብእ እምርእሶሙ ፈጠርዋ
  choice: напротив, люди сами создали его
  rationale: እምርእሶሙ — обычное рефлексивное выражение «от самих себя»; русское «сами» естественно передаёт самостоятельную человеческую инициативу без ложной метафоры головы.
- source_word: ለመርገም ዐቢይ ይከውኑ
  choice: окажутся под великим проклятием
  rationale: Естественно передаёт судьбу совершающих грех и сохраняет формулу суда.
theological_decisions:
- issue: Происхождение греха
  choice: Грех не представлен как посланный на землю извне; сказано, что его создали сами люди.
  alternative: Высказывание можно понимать менее категорично — как отрицание того, что грех является естественным свойством творения, а не как полное отрицание внешней причинности.
  rationale: Противопоставление «не был послан» и «люди сами создали» подчёркивает человеческую ответственность, но перевод не разворачивает это в законченное учение о происхождении зла.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. Необычность начального сравнения сохранена, но синтаксис сделан читаемым; богословское противопоставление внешнего ниспослания и человеческой ответственности не усилено сверх источника.
