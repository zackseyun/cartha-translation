  source_fidelity: 'Основное понимание стиха верно: обращение направлено к мужчинам; сравнительная конструкция передана как «больше, чем»; далее следует перечень царского статуса и предметов роскоши. Однако «девушка» сглаживает прямое значение ድንግል («дева, девственница»), а «любите украшать себя» несколько смещает предмет любви с украшения на действие. В заключительной строке следует не вводить эксплицитное «всё это», поскольку референт формы множественного числа и образ излияния остаются не вполне определёнными.'
