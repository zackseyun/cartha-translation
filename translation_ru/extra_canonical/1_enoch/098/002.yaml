  terminology: «Пёстрые одежды» допустимо как контекстуальное восполнение для слова, связанного с цветом/пестротой; это должно быть отмечено в сноске. «Пурпур», «царское достоинство», «власть» и «великолепие» уместны. «Дева» здесь предпочтительнее «девушка», так как сохраняет исходную характеристику без навязывания дополнительного толкования.
