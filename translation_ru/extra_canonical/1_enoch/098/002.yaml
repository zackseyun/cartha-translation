base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/002.yaml
  text: For you men love adornment on yourselves more than women[a], and companionship more than a virgin; in kingship and in greatness and in authority and in silver and gold and purple[d][c][b], and in splendor and in food they will be poured out like water.
translation:
  language: ru
  text: Ибо вы, мужчины, любите украшения на себе больше, чем женщины, и пёстрые одежды — больше, чем дева[a]. Царское достоинство, величие и власть, серебро, золото и пурпур[b], великолепие и пища будут изливаться, словно вода[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переданное как «пёстрые одежды», связано с цветом или пестротой; предмет одежды подразумевается по контексту. Возможно также иное лексическое понимание («общение»), но в окружении украшений и роскоши значение, связанное с цветом, выглядит предпочтительнее.
    reason: lexical_alternative
  - marker: b
    text: «Пурпур» обозначает дорогую пурпурную ткань или одежду — обычный знак богатства и высокого положения.
    reason: cultural_note
  - marker: c
    text: 'Заключительный образ допускает по меньшей мере два понимания: перечисленные блага могут расточаться без меры либо исчезать, подобно утекшей воде. Точный референт глагола в оригинале не назван явно.'
    reason: alternative_reading
lexical_decisions:
- source_word: ሥነ፡ ትወድዩ፡ ላዕሌክሙ
  choice: любите украшать себя
  rationale: Передаёт сочетание слов со значениями красоты или украшения, любви и направленности на самих адресатов; по-русски это естественнее буквального «любите украшение на себе».
- source_word: አንትሙ፡ ዕደው
  choice: вы, мужчины
  rationale: ዕደው здесь обозначает мужчин, а не «дела»; обращение подчёркивает сопоставление с женщинами и девушкой.
- source_word: ፈድፋደ፡ እም
  choice: больше, чем
  rationale: Сочетание выражает сравнительную степень, а не «излишество от».
- source_word: ኅብረ
  choice: пёстрые одежды
  rationale: В данном контексте слово связано с цветом или пестротой; предмет одежды восполнен по смыслу и согласуется с перечнем внешней роскоши. Возможная иная лексическая трактовка отмечена в сноске.
- source_word: ድንግል
  choice: девушка
  rationale: Буквальное значение — «дева, девственница»; в родовом сравнении современное русское «девушка» звучит естественно и сохраняет образ.
- source_word: መንንግሥት
  choice: царское достоинство
  rationale: Передаёт царский статус или царственность, не смешивая это слово с последующим понятием власти.
- source_word: ሥልጣን
  choice: власть
  rationale: Обычное значение — властные полномочия, господство или власть.
- source_word: ሜላት
  choice: пурпур
  rationale: Имеется в виду дорогой пурпурный материал или одежда как знак богатства и высокого положения.
- source_word: ክብር
  choice: великолепие
  rationale: В перечне материальной и статусной роскоши контекстуально уместен смысл видимого блеска и великолепия, хотя слово может также означать честь или славу.
- source_word: ከመ፡ ማይ፡ ይትከዐዉ
  choice: всё это будет изливаться, словно вода
  rationale: Сохраняет пассивный образ излияния и делает понятной отсылку множественного местоимения ко всему предшествующему перечню.
theological_decisions:
- issue: Направленность обличения
  choice: Стих представлен как обличение мужского пристрастия к украшениям, пёстрой одежде, статусу и роскоши.
  alternative: Обличение распутных связей с женщинами и девами либо более общее осуждение излишеств.
  rationale: Сравнительная конструкция ፈድፋደ እም и чтение ዕደው как «мужчины» грамматически поддерживают тему внешнего украшения и роскоши, а не сексуальных отношений.
- issue: Смысл заключительного образа
  choice: Сохранён образ того, что перечисленное «будет изливаться, словно вода», без уточнения результата.
  alternative: Богатства будут расточаться без меры или исчезнут, как вода.
  rationale: Форма и контекст допускают как образ безудержного изобилия, так и образ быстрого рассеивания; основной текст не устраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим тоном. Синтаксис упрощён для ясности, но сравнительная структура, перечисление предметов роскоши и неоднозначный заключительный образ сохранены.
