base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/007.yaml
  text: And do not imagine in your spirit[a], and do not say in your heart[c][b], that you do not know and do not see that every sin is written in heaven every day before the Most High.
translation:
  language: ru
  text: И не думайте в духе своём, и не говорите в сердце своём, что вы не знаете и не видите, что всякий грех ежедневно записывается на небесах пред Всевышним.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Оборот может также означать, что запись о всяком грехе постоянно, изо дня в день, находится пред Всевышним.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢታምስሉ
  choice: не думайте
  rationale: Глагол выражает внутреннее предположение или самомнение; «не думайте» естественно передаёт запрет, не сводя его к внешнему сходству.
- source_word: በመንፈስክሙ
  choice: в духе своём
  rationale: Сохранено буквальное обозначение внутреннего человеческого «духа» и его параллелизм с «сердцем».
- source_word: በልብክሙ
  choice: в сердце своём
  rationale: Сохранён библейский образ сердца как средоточия внутренней речи и намерений.
- source_word: ኢታእምሩ ወኢትሬእዩ
  choice: вы не знаете и не видите
  rationale: Обе глагольные формы переданы во втором лице множественного числа, как в геэзском тексте; конкретный глагол «видеть» не заменён толкованием «понимать».
- source_word: ኵሉ ኃጢአት
  choice: всякий грех
  rationale: 'Так передаётся распределительное значение: речь идёт о каждом грехе, а не лишь о грехе как отвлечённом понятии.'
- source_word: በሰማይ ይጸሐፍ
  choice: записывается на небесах
  rationale: «Записывается» сохраняет образ небесной письменной записи и звучит по-русски естественнее, чем простое «пишется».
- source_word: ሀሎ በኵሉ ዕለት
  choice: ежедневно
  rationale: Кратко передаёт повторяющееся или непрестанное действие; возможность понимать оборот как постоянное пребывание записи отмечена в сноске.
- source_word: በቅድሜሁ ለልዑል
  choice: пред Всевышним
  rationale: Сохранены образ пребывания перед Божьим лицом и возвышенный титул; форма «пред» соответствует достоинству апокалиптической речи.
theological_decisions:
- issue: Небесная запись грехов
  choice: Сохранён конкретный образ того, что каждый грех записывается на небесах пред Всевышним.
  alternative: Обобщить смысл как Божье знание обо всех грехах без образа письменной записи.
  rationale: Геэзский глагол прямо обозначает письмо, поэтому апокалиптический образ небесного реестра не следует заменять отвлечённым утверждением о всеведении.
- issue: Лицо глаголов «знать» и «видеть»
  choice: 'Второе лицо множественного числа: «вы не знаете и не видите».'
  alternative: 'Прямая внутренняя речь от первого лица: «мы не знаем и не видим».'
  rationale: Грамматические формы геэзского текста указывают на второе лицо множественного числа; неоднозначность синтаксической связи не оправдывает изменения лица.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Пара «дух — сердце» и титул «Всевышний» сохранены, но синтаксис сделан понятным для современного читателя.
