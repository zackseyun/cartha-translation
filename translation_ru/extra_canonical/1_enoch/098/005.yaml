base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/005.yaml
  text: And barrenness was not given to a woman[a]; rather[c][b], because of the work of her hands she dies childless.
translation:
  language: ru
  text: И бесплодие не было дано женщине[a]; напротив, за дела её рук[b] она умирает бездетной[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бесплодие не было назначено женщине».'
    reason: lexical_alternative
  - marker: b
    text: «Дела её рук» — образное выражение, означающее её дела или поступки.
    reason: cultural_note
  - marker: c
    text: 'Возможно также: «она умрёт без детей».'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ምክነት
  choice: бесплодие
  rationale: Слово обозначает неспособность иметь детей; «бесплодие» сохраняет конкретный репродуктивный смысл и подготавливает заключительное «бездетной».
- source_word: ለብእሲት
  choice: женщине
  rationale: Дательная конструкция естественно передаётся формой «женщине». Геэзское существительное не маркировано по определённости, а русский язык здесь не требует различать «женщине» и «некой женщине».
- source_word: ኢተውህበት
  choice: не было дано
  rationale: Прозрачно передаёт пассивную форму глагола «давать», не добавляя идеи предопределения или назначения.
- source_word: አላ
  choice: напротив
  rationale: Выражает сильное противопоставление между бесплодием и последующей смертью без детей.
- source_word: በእንተ
  choice: из-за
  rationale: Ясно передаёт причинное значение предлога.
- source_word: ግብረ እዴሃ
  choice: дела её рук
  rationale: Сохраняет образное выражение оригинала, обозначающее её поступки, не уточняя их характер сверх текста.
- source_word: ትመውት
  choice: она умирает
  rationale: Настоящее время передаёт обобщённый, гномический смысл несовершенной формы в данном контексте; возможное будущее значение отмечено в сноске.
- source_word: ዘእንበለ ውሉድ
  choice: бездетной
  rationale: Естественно и кратко передаёт буквальное «без детей», сохраняя связь с темой бесплодия.
theological_decisions:
- issue: Характер суда над женщиной
  choice: Текст противопоставляет данное извне бесплодие смерти без детей, наступающей из-за её собственных дел.
  alternative: 'Высказывание можно понимать в более общем смысле: её уделом является не бесплодие, а смерть без детей.'
  rationale: Отрицание «не было дано», затем сильное противопоставление и причинная конструкция связывают исход с её поступками. Перевод сохраняет эту связь, но не определяет, какие именно поступки имеются в виду.
- issue: Временное значение ትመውት
  choice: 'Обобщённое настоящее: «она умирает».'
  alternative: 'Предсказательное или судебное будущее: «она умрёт».'
  rationale: Контекст допускает гномическое прочтение несовершенной формы, однако будущее значение грамматически возможно и потому вынесено в сноску.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского изречения. Синтаксис сохраняет резкое противопоставление оригинала; образ «дела рук» оставлен в основном тексте, а его идиоматический смысл пояснён в сноске.
