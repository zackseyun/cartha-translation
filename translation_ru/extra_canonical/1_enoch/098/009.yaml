base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/009.yaml
  text: Woe to you[a], fools, for you will perish in your folly, and you oppress the wise[c][b], and good will not come upon you.
translation:
  language: ru
  text: Горе вам, безумцы! Вы погибнете в своём безумии, пренебрегаете мудрыми[a], и добро не найдёт вас[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально также возможно: «забываете их» или «оставляете их без внимания».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «благо вас не достигнет».'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Горе вам
  rationale: Сохраняет формулу пророческого обличения и её эсхатологическую силу; «увы» звучало бы мягче.
- source_word: አብዳን
  choice: безумцы
  rationale: Передаёт нравственно-духовное осуждение, а не просто недостаток ума; это естественное слово для возвышенного русского текста.
- source_word: ትትሐጐሉ
  choice: вы погибнете
  rationale: Форма от ሐጕለ означает гибель; прежнее истолкование как доверия к богатству не соответствует данному эфиопскому тексту.
- source_word: በአቢድክሙ
  choice: в своём безумии
  rationale: Слово связано с безумием, а не с богатством; сочетание выражает обстоятельство или причину гибели.
- source_word: ለጠበብን
  choice: мудрыми
  rationale: Форма указывает на мудрых людей; перевод сохраняет противопоставление безумцев и мудрых.
- source_word: ትረሰዕዎሙ
  choice: пренебрегаете
  rationale: Основной смысл связан с забыванием и оставлением без внимания. «Пренебрегаете» естественно передаёт здесь сознательное небрежение, не усиливая глагол до неподтверждённого значения «угнетаете».
- source_word: ሠናይት
  choice: добро
  rationale: Широкое слово, которое может охватывать благо, благополучие или благословение; общий перевод сохраняет эту широту.
- source_word: ኢይረክበክሙ
  choice: не постигнет вас
  rationale: Глагол имеет значения «найти, достичь, постигнуть». Выбранная формулировка естественна при «добре» в роли подлежащего и сохраняет образ блага, которое не достигнет адресатов.
theological_decisions:
- issue: Основание обличения безумцев
  choice: Стих связывает их гибель с собственным безумием и пренебрежением мудрыми.
  alternative: Понимать стих как осуждение упования на богатство и угнетения мудрых.
  rationale: Чтение о богатстве возникло из ошибочного лексического разбора и, вероятно, под влиянием соседнего контекста; в данном стихе соответствующих слов нет.
- issue: Смысл заключительного «добра»
  choice: Сохранено широкое «добро».
  alternative: Конкретизировать как «благополучие» или «благословение».
  rationale: Эфиопское слово не требует одной узкой богословской интерпретации; перевод сохраняет неопределённость между общим благом, благополучием и благословением.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческого обличения. Краткие параллельные части сохраняют ритм исходного высказывания. Лексика понятна широкому читателю; неоднозначность заключительной фразы и глагола ትረሰዕዎሙ отмечена в сносках.
