base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/001.yaml
  text: And now I swear to you[a], to the wise and to the foolish[b], that you will see much upon the earth.
translation:
  language: ru
  text: И теперь я клянусь вам, мудрым и глупым, что вы многое увидите на земле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «И теперь я клянусь вам, мудрым и глупым: ибо вы многое увидите на земле».'
    reason: Союз እስመ может вводить как содержание клятвы («что»), так и основание сказанного («ибо»).
lexical_decisions:
- source_word: ወይእዜኒ
  choice: И теперь
  rationale: Передаёт союз и временное наречие как переход к новому торжественному предостережению; формулировка естественна для современного русского языка.
- source_word: እኔ፡ እምሕል
  choice: я клянусь
  rationale: Глагол እምሕል имеет специальное значение «клясться, приносить клятву», а выраженное местоимение сохраняет акцент на говорящем.
- source_word: ለክሙ
  choice: вам
  rationale: Естественно передаёт адресата клятвы.
- source_word: ለጠቢባን፡ ወለአብዳን
  choice: мудрым и глупым
  rationale: Сохраняет прямой и симметричный контраст между двумя нравственно-интеллектуальными категориями адресатов.
- source_word: እስመ
  choice: что
  rationale: В данном клятвенном обороте вводит содержание клятвы и создаёт естественную русскую синтаксическую связь; причинное прочтение остаётся возможным и отмечено в сноске.
- source_word: ብዙኅ፡ ትሬእዩ
  choice: вы многое увидите
  rationale: Субстантивированное «многое» естественно выражает неопределённое множество того, что предстоит увидеть, а будущее время соответствует контексту предостережения.
- source_word: ዲበ፡ ምድር
  choice: на земле
  rationale: Передаёт широкое пространственное значение без неоправданного сужения до отдельной страны или области.
theological_decisions:
- issue: 'Круг адресатов: «мудрые и глупые»'
  choice: Сохранено широкое обращение к двум противопоставленным категориям слушателей.
  alternative: Понимать слова как обращение только к двум группам внутри Израиля либо как ироническое обращение преимущественно к нечестивым.
  rationale: Сам стих не ограничивает круг адресатов и не уточняет характер противопоставления, поэтому перевод не разрешает эту напряжённость за текст.
- issue: Связь второй части стиха с формулой клятвы
  choice: Союз передан как «что», вводя содержание клятвы.
  alternative: «Ибо вы многое увидите на земле», где вторая часть объясняет причину обращения.
  rationale: Клятвенная конструкция хорошо допускает изъяснительное прочтение, однако значение እስመ допускает и причинную связь; она сохранена в сноске как реальная синтаксическая альтернатива.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, пророческим звучанием. Формула «я клянусь» сохраняет торжественность оригинала без архаизации; «на земле» звучит естественно и сохраняет широкий апокалиптический масштаб.
