base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/003.yaml
  text: Therefore they have no instruction or wisdom[a]; and because of this they will perish together with their possessions, and with all their glory and their honor. And in shame, and in slaughter, and in great destitution[c][b], their spirits will be cast into the furnace of fire.
translation:
  language: ru
  text: Поэтому нет у них ни наставления, ни мудрости[a]; и за это они погибнут вместе со своим имуществом, со всей своей славой и почётом. В бесчестье, среди резни и в великой нужде[b] духи их будут брошены в огненную печь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «поучения». Сочетание «наставление и мудрость», вероятно, выражает единую категорию нравственного разумения, а не две строго разграниченные идеи.'
    reason: lexical_alternative
  - marker: b
    text: Выражение, переведённое как «в великой нужде», не вполне ясно; возможны также варианты «в великом бедствии» или «в великом страдании».
    reason: lexical_alternative
lexical_decisions:
- source_word: ትምህርት
  choice: наставление
  rationale: Слово обозначает обучение или получаемое наставление. «Наставление» естественно сочетается с «мудростью» в контексте нравственного суда и не предполагает формального образования.
- source_word: ጥበብ
  choice: мудрость
  rationale: В нравственно-апокалиптическом контексте речь идёт о практической и этической мудрости, а не о техническом умении.
- source_word: ይትሐጐሉ
  choice: они погибнут
  rationale: Будущее время и контекст суда требуют сильного, но не чрезмерно конкретного глагола; «погибнут» не уточняет способ уничтожения.
- source_word: ኅቡረ ምስለ
  choice: вместе с
  rationale: Передаёт общую участь людей и их имущества, сохраняя ясность и торжественный тон.
- source_word: ንዋያቲሆሙ
  choice: своим имуществом
  rationale: Обобщённо обозначает принадлежащие им материальные блага, не сужая смысл до денег или богатства.
- source_word: ስብሐቶሙ
  choice: своей славой
  rationale: Сохраняет возвышенный регистр и иронию гибнущего земного величия.
- source_word: ክብሮሙ
  choice: почётом
  rationale: «Почёт» выражает общественное уважение и положение, оставаясь отличимым от предшествующей «славы».
- source_word: በጽእለት
  choice: в бесчестье
  rationale: Передаёт состояние публичного унижения, сопровождающее суд.
- source_word: በቅትል
  choice: среди резни
  rationale: Сохраняет образ насильственной гибели и ряд суровых существительных, не добавляя конкретного действующего лица.
- source_word: በንዴት ዐቢይ
  choice: в великой нужде
  rationale: Трудная фраза указывает на крайнюю лишённость, бедствие или страдание. «Великая нужда» сохраняет связь с утратой имущества и положения, не исключая более широкого смысла.
- source_word: ትትወደይ መንፈሶሙ
  choice: духи их будут брошены
  rationale: Сохраняются явный субъект «духи» и страдательная, насильственная направленность действия.
- source_word: እቶነ እሳት
  choice: огненную печь
  rationale: Естественный современный русский эквивалент образа «печи огня», сохраняющий апокалиптическую выразительность.
theological_decisions:
- issue: Означает ли заключительный суд уничтожение людей или посмертное предание их духов огню
  choice: духи их будут брошены в огненную печь
  alternative: они сами будут уничтожены огнём
  rationale: Прямым объектом в источнике являются «их духи». Перевод сохраняет посмертный апокалиптический образ и не сводит его без основания к телесной смерти или окончательному уничтожению.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического речения. Синтаксис сохраняет причинную связь между нынешним отсутствием наставления и будущей гибелью, а также нарастающий ряд образов суда. Архаизирующее «духи их» употреблено лишь ради торжественного ритма и ясной связи с исходным текстом.
