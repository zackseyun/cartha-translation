base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/006.yaml
  text: I have sworn to you[a], sinners, by the Great Holy One, that all your evil deeds are revealed in the heavens[b], and none of your deeds of violence are covered or hidden.
translation:
  language: ru
  text: Я поклялся вам, грешники, Великим Святым, что все ваши злые дела явны на небесах и ни одно из ваших насильственных деяний[a] не покрыто и не скрыто.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «деяний угнетения»; возможно также: «деяний неправды».'
    reason: Лексема ግፍዕ может означать насилие, угнетение или неправду; основной текст передаёт наиболее конкретный в данном контексте смысл.
lexical_decisions:
- source_word: መሐልኩ
  choice: Я поклялся
  rationale: Форма первого лица передаёт уже произнесённую торжественную клятву; совершенный вид естественен по-русски и сохраняет силу исходного выражения.
- source_word: ኃጥኣን
  choice: грешники
  rationale: Прямое и привычное обозначение виновных в контексте суда.
- source_word: በቅዱስ ዐቢይ
  choice: Великим Святым
  rationale: Творительный падеж передаёт формулу клятвы, а написание с прописных букв показывает, что это наименование Бога, не превращая его в более позднюю догматическую формулу.
- source_word: ኵሉ ግብርክሙ እኩይ
  choice: все ваши злые дела
  rationale: Сохраняет всеобщность обвинения и конкретный нравственный смысл слова «дела».
- source_word: ክሡት ውእቱ በሰማያት
  choice: открыты на небесах
  rationale: Передаёт образ обнаруженности и сохраняет множественное число слова «небеса», характерное для апокалиптической картины мира.
- source_word: ግብረ ግፍዕ
  choice: дел насилия
  rationale: Основной контекстуальный смысл — насилие и угнетение; краткое примечание сохраняет более широкий диапазон значения.
- source_word: ወአልብክሙ ክዱነ ወእኁቡአ
  choice: и ни одно ... не укрыто и не сокрыто
  rationale: Точно передаёт отрицательную конструкцию «нет у вас» и два близких определения со значениями покрытия и сокрытия; не вводит отсутствующий в тексте образ письменной записи.
theological_decisions:
- issue: Формула клятвы и божественный титул
  choice: Великим Святым
  alternative: великим Святым; Святым и Великим
  rationale: Порядок определений сохранён максимально близко к источнику, а прописные буквы указывают на божественный титул без привнесения поздней терминологии.
- issue: Небесное обнаружение человеческих дел
  choice: дела открыты на небесах, и ни одно не укрыто и не сокрыто
  alternative: дела записаны и сохранены на небесах
  rationale: Исходный текст противопоставляет открытое укрытому и сокрытому. Перевод сохраняет этот судебный образ и не заменяет его образом небесной записи, которого данное чтение не требует.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным апокалиптическим звучанием. Повтор «не укрыто и не сокрыто» намеренно сохраняет парность исходных слов.
