- issue: Смысл заключительного глагола и подразумеваемого объекта
  choice: то, что я принял
  alternative: то, что я взял на себя / то, что я возгласил / речь, которую я начал
  rationale: В предоставленном тексте объект прямо не назван. Основной перевод сохраняет относительную конструкцию и не превращает её без достаточного основания в «притчу», «речь» или особое откровение.
- issue: Отношение дара к Господу духов
  choice: от лица Господа духов
  alternative: пред Господом духов
