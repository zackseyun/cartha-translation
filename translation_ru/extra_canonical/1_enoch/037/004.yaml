- source_word: እግዚአ፡ መንፈሳት
  choice: Господа духов
  rationale: Буквально сохраняет устойчивый божественный титул 1 Еноха без добавления определённости, отсутствующей в русской грамматической системе.
- source_word: ዘነሣእኩ
