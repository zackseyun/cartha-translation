base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/002.yaml
  text: 'And this is the beginning of the word of wisdom that I lifted up to speak and say to those who dwell on the dry land: Hear[a], you former ones, and see, you latter ones[d][c][b], the holy words that I speak before the Lord of Spirits.'
translation:
  language: ru
  text: 'И вот начало слова мудрости, которое я возвысил, чтобы возвестить живущим на суше[a]: слушайте, прежние, и смотрите, последующие[b], на святые слова[c], которые я произношу пред Господом духов[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «живущим на земле». Буквально в геэз: «на суше».'
    reason: lexical_alternative
  - marker: b
    text: Вероятно, имеются в виду прежние и последующие поколения; призыв охватывает людей разных времён.
    reason: cultural_note
  - marker: c
    text: 'Буквально возможно также: «святое слово», однако последующее множественное местоимение поддерживает перевод «святые слова».'
    reason: textual_ambiguity
  - marker: d
    text: 'Или: «в присутствии Господа духов».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝ፡ ርእሱ፡
  choice: И вот начало
  rationale: ርእስ буквально означает «голова», но здесь идиоматически обозначает начало речи; вводное «и вот» естественно передаёт указательную формулу.
- source_word: ነገረ፡ ጥበብ፡
  choice: слова мудрости
  rationale: ነገር допускает значения «слово», «речь», «дело»; «слово мудрости» сохраняет возвышенный характер формулы.
- source_word: ዘአንሣእኩ፡
  choice: которое я возвысил
  rationale: Глагол имеет значение поднятия или возвышения; буквенный образ сохранён, хотя по смыслу речь идёт о торжественном провозглашении.
- source_word: እትናገር፡ [እብል፡]
  choice: чтобы возвестить
  rationale: Компактная русская формулировка передаёт акт торжественного произнесения; второе, заключённое в скобки чтение текстуально не вполне уверенно.
- source_word: ለእለ፡ ይነድሩ፡ ውስተ፡ የብስ፡
  choice: живущим на суше
  rationale: የብስ конкретно означает сухую землю, сушу; образ не заменён более общим «на земле».
- source_word: ስምዑ፡ ቀደምት፡
  choice: слушайте, жившие прежде
  rationale: Императив сохранён; субстантивированное обозначение прежних людей естественно передано как обращение к жившим прежде поколениям.
- source_word: ወርእዩ፡ ደኃርያን፡
  choice: и смотрите, живущие после
  rationale: Сохранены императив и временной параллелизм с теми, кто жил прежде; необычность обращения отражает необычность исходного текста.
- source_word: ነገረ፡ ቅዱሰ፡ እለ፡
  choice: святые слова, которые
  rationale: ቅዱሰ согласуется с ነገረ как прилагательное, а множественное относительное እለ поддерживает понимание «святые слова», а не «слово Святого».
- source_word: ቅድመ፡ እግዚአ፡ መንፈሳት።
  choice: пред Господом духов
  rationale: Сохранён характерный для 1 Еноха божественный титул; «пред» передаёт как пространственный, так и придворно-сакральный оттенок присутствия.
theological_decisions:
- issue: Относится ли ቅዱሰ к Божьему титулу «Святой» или к словам
  choice: «святые слова»
  alternative: «слово Святого»
  rationale: Падежное согласование ነገረ ቅዱሰ и множественное относительное местоимение እለ грамматически поддерживают определение слов как святых; божественный титул здесь не вносится.
- issue: Круг адресатов выражения «живущие на суше»
  choice: Сохранить конкретное обозначение жителей суши
  alternative: «живущие на земле», то есть человечество вообще
  rationale: Исходный образ конкретен, хотя в контексте, вероятно, охватывает людей в целом; перевод не устраняет эту смысловую широту.
- issue: Значение формулы «пред Господом духов»
  choice: Произнесение в присутствии Господа духов
  alternative: Произнесение перед лицом Господа духов или от Его имени
  rationale: Предлог указывает на присутствие, но сам по себе не утверждает, что говорящий выступает непосредственно от имени Бога.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием. Сохранены конкретный образ суши, временной параллелизм адресатов и енохический титул «Господь духов»; синтаксис слегка упорядочен ради ясности без устранения исходной неоднозначности.
