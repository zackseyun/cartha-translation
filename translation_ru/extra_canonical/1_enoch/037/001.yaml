base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/001.yaml
  text: The second vision of wisdom that Enoch son of Jared[a], son of Mahalalel, son of Cainan, son of Enos, son of Seth, son of Adam[c][b], saw.
translation:
  language: ru
  text: Второе[a] видение, которое он видел, — видение мудрости, которое видел Енох, сын Иареда, сына Малелеила, сына Каинана, сына Еноса, сына Сифа, сына Адама.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Другое». Эфиопское слово может означать как «другое», так и «второе»; здесь выбрано «второе», поскольку заголовок, вероятно, указывает на последовательность видений.'
    reason: lexical_alternative
  - marker: b
    text: Повтор слова «сын» сохранён, чтобы точно передать форму родословия в заголовке.
    reason: cultural_note
lexical_decisions:
- source_word: ራእይ / ራእየ
  choice: видение / видение
  rationale: Оба употребления существительного сохранены, поскольку эфиопский текст намеренно повторяет слово в пояснительной конструкции.
- source_word: ዘርእየ
  choice: которое он видел / которое видел Енох
  rationale: Повтор относительной глагольной конструкции сохранён вслед за источником, несмотря на некоторую избыточность по-русски.
- source_word: ካልእ
  choice: второе
  rationale: В заголовке нового раздела слово, вероятнее всего, обозначает последовательность; возможное значение «другое» отмечено в сноске.
- source_word: ጥበብ
  choice: мудрость
  rationale: Прямое соответствие, сохраняющее особую характеристику откровения как «видения мудрости».
- source_word: ወልደ
  choice: сын / сына
  rationale: Повторяющаяся формула родословия передана полностью, без обобщения значением «потомок».
- source_word: ሄኖክ; ያሬድ; መላልኤል; ቃይናን; ሄኖስ; ሴት; አዳም
  choice: Енох; Иаред; Малелеил; Каинан; Енос; Сиф; Адам
  rationale: Использованы узнаваемые русские библейские формы имён, соответствующие лицам данной родословной.
theological_decisions:
- issue: Значение ካልእ в надписании
  choice: «второе» в основном тексте с указанием варианта «другое»
  alternative: «другое видение»
  rationale: Контекст допускает порядковое и неопределённо-различительное понимание; наиболее вероятное последовательное значение помещено в текст, а подлинная лексическая неоднозначность сохранена в сноске.
- issue: Повтор двух формул о видении
  choice: Сохранить оба упоминания «видения» и обе относительные конструкции
  alternative: Свести их к гладкой фразе «второе видение мудрости, которое видел Енох»
  rationale: Источник содержит пояснительный повтор, значимый для формы надписания; сглаживание устранило бы реально присутствующую структуру текста.
- issue: Полнота родословия
  choice: Сохранить всю цепь до Адама
  alternative: Сократить родословие или заменить повтор формулой «потомок»
  rationale: Полная родословная литературно помещает Еноха в первобытную историю и прямо выражена в источнике.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего апокалиптического заголовка. Пояснительная избыточность оригинала намеренно сохранена; тире делает приложение понятным без устранения повтора.
