base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/003.yaml
  text: It is better to speak to the former ones[b][a], but even from the latter ones we will not withhold the beginning of wisdom.
translation:
  language: ru
  text: С прежними лучше говорить, но и от последующих мы не утаим начала мудрости.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «голова мудрости». Слово «голова» может здесь означать начало, основу или главную часть; переданное чтение стиха в целом синтаксически непросто.'
    reason: textual_variant
lexical_decisions:
- source_word: እሉ፡ ቀዳሚ
  choice: о прежних
  rationale: Сочетание понято как указание на прежних, то есть предшествующих людей или поколения. Русское «о прежних» сохраняет референциальную неопределённость текста.
- source_word: ይኄይስ
  choice: лучше
  rationale: Форма от ኀየሰ передаёт значение «быть хорошим/лучшим»; здесь естественна безличная конструкция «лучше».
- source_word: ብሂል
  choice: говорить
  rationale: Инфинитив со значением «сказать, говорить», зависящий от «лучше».
- source_word: ወደኃርያንሂ
  choice: но и от тех, кто придёт после
  rationale: Обозначает также последующих или позднейших. Развёрнутая формулировка по-русски ясно показывает, что речь идёт о людях, и сохраняет временное противопоставление прежним.
- source_word: ኢንከልእ
  choice: мы не утаим
  rationale: Форма первого лица множественного числа от глагола «удерживать, отказывать, скрывать». «Не утаим» естественно сочетается с тем, что мудрость сообщают последующим.
- source_word: ርእሳ፡ ለጥበብ
  choice: начала мудрости
  rationale: ርእስ буквально означает «голова», а переносно — «начало, главная часть». Сдержанное «начало мудрости» сохраняет образ и смысловую открытость выражения.
theological_decisions:
- issue: К кому относятся «прежние» и «последующие»
  choice: Не уточнять, являются ли это поколениями, слушателями или иными группами людей
  alternative: Явно назвать прежние и будущие поколения
  rationale: Переданный геэзский текст противопоставляет прежних последующим, но не определяет их точнее; конкретизация внесла бы отсутствующее толкование.
- issue: Значение выражения «начало мудрости»
  choice: Сохранить буквальное и неоднозначное «начало мудрости»
  alternative: Передать как «основы мудрости» или «главную мудрость»
  rationale: Слово ርእስ допускает значения «голова», «начало» и «главная часть». Контекст не позволяет безусловно выбрать более истолковывающий вариант.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего изречения. Противопоставление «прежних» и «тех, кто придёт после» выражено ясно, однако их конкретная идентичность и смысл «начала мудрости» намеренно не уточняются.
