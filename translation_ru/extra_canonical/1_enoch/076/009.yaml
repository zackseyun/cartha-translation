base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/009.yaml
  text: And through the third opening[a], toward the west, there come out from it dew and rain[b], and frost and destruction.
translation:
  language: ru
  text: А из третьего отверстия, обращённого к западу, выходят роса и дождь, иней[a] и разрушение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «саранча».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ሣልስት ኆኅት
  choice: третье отверстие
  rationale: Порядковое числительное относится к небесному отверстию; «отверстие» сохраняет образ, не уточняя его как окно, врата или портал.
- source_word: መንገለ ምዕራብ
  choice: обращённое к западу
  rationale: Естественно передаёт западную ориентацию отверстия.
- source_word: ይወፅእ እምኔሃ
  choice: выходят
  rationale: Русская форма множественного числа согласована с последующим рядом явлений; значение выхода из отверстия сохранено конструкцией «из… выходят».
- source_word: ጤለ
  choice: роса
  rationale: Основное значение в данном контексте — роса; оно также согласуется с употреблением этого слова в соседних стихах главы.
- source_word: ዝናም
  choice: дождь
  rationale: Прямой и общеупотребительный эквивалент.
- source_word: አናጽዕ
  choice: иней
  rationale: В данном перечне природных явлений наиболее уместен конкретный метеорологический термин; из-за разногласий в разборе слова отмечен иной вариант.
- source_word: ደምሳሴ
  choice: разрушение
  rationale: Передаёт отглагольное значение уничтожения или опустошения и не подменяет его названием осадков.
theological_decisions:
- issue: Сочетание благотворных и губительных явлений
  choice: Сохранены «роса и дождь, иней и разрушение» без смыслового сглаживания.
  alternative: Истолковать весь перечень исключительно как виды осадков.
  rationale: Исходный текст допускает напряжённое соединение природных благ и бедствия; перевод не должен заранее устранять эту особенность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Союз «А» поддерживает последовательность описания; синтаксис упрощён без утраты пространственного образа.
