base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/004.yaml
  text: Through four of them come forth winds of blessing and peace[a], and from those eight come forth winds of scourging; when they are sent out, they bring ruin upon all the earth and the water on it, and upon all who dwell on it[c][b], and upon everything that is in the water and on the dry land.
translation:
  language: ru
  text: Через четыре[a] из них выходят ветры благословения и мира, а из тех восьми выходят ветры кары[b]. Когда их посылают, они губят всю землю и воду на ней[c], всех, кто обитает на ней, и всё, что находится в воде и на суше.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В предоставленной электронной транскрипции стоит «три», однако исправленное чтение эфиопской цифры — «четыре»; оно также соответствует описанию двенадцати выходов: четырёх благотворных и восьми губительных.'
    reason: textual_variant
  - marker: b
    text: 'Или: «ветры поражения», «ветры бичевания» или «ветры бедствия». Эфиопское слово обозначает губительную кару или наказание.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «воде, которая на ней». Возможно, имеются в виду воды, связанные с землёй в представленной здесь картине мира.'
    reason: cultural_note
lexical_decisions:
- source_word: 'በ፬እምኔሆሙ (в предоставленной транскрипции: በ፫እምኔሆሙ)'
  choice: Через четыре из них
  rationale: 'Предлог በ передаёт движение через упомянутые выходы, тогда как далее употреблено እም — «из». Число «четыре» соответствует исправленному чтению эфиопской цифры и структуре двенадцати выходов: четыре благотворных и восемь губительных.'
- source_word: ይወፅኡ
  choice: выходят
  rationale: Простой и выразительный глагол естественно описывает ветры, исходящие через космические выходы.
- source_word: ነፋሳት
  choice: ветры
  rationale: В контексте упорядоченных небесных выходов речь идёт о метеорологических силах, а не о личностных духах.
- source_word: በረከት ወሰላም
  choice: благословения и мира
  rationale: Сохраняется возвышенная и религиозно окрашенная пара понятий без сведения её только к материальному благополучию.
- source_word: እምእልኩ ሰማንቱ
  choice: из тех восьми
  rationale: Указательное выражение отсылает к ранее перечисленным восьми выходам; отсутствующее в исходном выражении существительное не добавляется.
- source_word: መቅሠፍት
  choice: кары
  rationale: Слово обозначает губительное поражение или наказание. «Кара» сохраняет образ суда и звучит естественнее по-русски, чем буквальное «бичевание».
- source_word: ሶበ ይትፈነዉ
  choice: когда их посылают
  rationale: Передаётся страдательное значение и подразумеваемое направление этих ветров неким действующим лицом без его уточнения.
- source_word: ይደመስስዋ
  choice: они несут гибель
  rationale: Выражение передаёт разрушительный результат и позволяет естественно присоединить длинный ряд объектов.
- source_word: ለኵላ ምድር ወማይ ዘዲቤሃ
  choice: всей земле и воде на ней
  rationale: Сохраняется необычное космологическое сочетание земли с находящейся на ней водой, не устраняя возможную неоднозначность.
- source_word: ኵሉ እለ የኃድሩ ዲቤሃ
  choice: всем, кто обитает на ней
  rationale: Достаточно близкая и вместе с тем естественная современная русская формулировка.
- source_word: ኵሉ ዘሀሎ ውስተ ማይ ወዲበ የብስ
  choice: всему, что находится в воде и на суше
  rationale: Сохраняется всеохватная противоположность воды и суши.
theological_decisions:
- issue: Передавать ли ነፋሳት как «ветры» или «духи»
  choice: ветры
  alternative: духи
  rationale: Астрономико-метеорологический контекст главы говорит о ветрах, выходящих через определённые выходы; вариант «духи» неоправданно персонифицировал бы образ.
- issue: Смягчать ли значение መቅሠፍት до общего обозначения бедствия
  choice: кара
  alternative: бедствие; бичевание; поражение
  rationale: Текст изображает губительные ветры как орудия наказания. «Кара» сохраняет судебно-карательный оттенок, не привнося позднейшей догматической схемы.
- issue: Уточнять ли подразумеваемого отправителя ветров
  choice: сохранить безличную форму «их посылают»
  alternative: добавить явного отправителя, например Бога
  rationale: Исходный текст оставляет действующее лицо невыраженным; перевод не должен молча разрешать эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. Синтаксис сохраняет поступательное перечисление и космологический размах оригинала, но избегает архаизмов и неестественных кальк.
