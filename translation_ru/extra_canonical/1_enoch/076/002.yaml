base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/002.yaml
  text: Three of them are open at the face of heaven[a], and three in the west, and three at the right of heaven[c][b], and three at the left.
translation:
  language: ru
  text: Три из них открыты на лице неба[a], три — на западе, три — по правую сторону неба[b] и три — по левую сторону[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на лице неба». Выражение может обозначать переднюю сторону небесного пространства и, при ориентации лицом к восходу, указывать на восток.'
    reason: Лексическая и культурно-пространственная неоднозначность.
  - marker: b
    text: «Правая сторона» при той же пространственной ориентации может соответствовать югу.
    reason: Возможное значение направления сохранено как примечание, а не внесено в текст.
  - marker: c
    text: «Левая сторона» при той же пространственной ориентации может соответствовать северу; слово «неба» здесь подразумевается из предыдущей части фразы.
    reason: Разъяснение направления и синтаксического эллипсиса.
lexical_decisions:
- source_word: ፫እም ኔሆሙ
  choice: три из них
  rationale: Частичная конструкция отсылает к уже упомянутым небесным вратам; русское «три из них» естественно сохраняет эту связь.
- source_word: ርኅዋት
  choice: открыты
  rationale: Форма описывает врата как находящиеся в открытом состоянии, а не называет отвлечённые «отверстия».
- source_word: በገጸ ሰማይ
  choice: на лицевой стороне неба
  rationale: «Лицевая сторона» сохраняет телесно-пространственный образ слова «лицо», но по-русски яснее передаёт пространственное значение «передняя сторона», не подменяя его прямо востоком.
- source_word: በምዕራብ
  choice: на западе
  rationale: Обычное и точное обозначение стороны света в данном перечислении.
- source_word: በየማነ ሰማይ
  choice: по правую сторону неба
  rationale: Буквальное пространственное обозначение сохраняет космическую образность; возможное значение «юг» не вносится в основной текст.
- source_word: በፀጋም
  choice: по левую сторону
  rationale: Перевод сохраняет симметричную пару «правая — левая»; подразумеваемое «неба» не повторяется ради естественности русской фразы.
theological_decisions:
- issue: Следует ли заменять телесно-пространственные обозначения сторон света нормализованными названиями
  choice: Сохранить в основном тексте «лицевую», «правую» и «левую» стороны неба
  alternative: Передать последовательность как «восток, запад, юг и север»
  rationale: Эфиопский текст использует образную ориентацию относительно лица и сторон тела. Прямая замена на стороны света устранила бы подлинную неоднозначность апокалиптической космологии; возможные соответствия пояснены в примечаниях.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной апокалиптической образностью. Повтор «три» сохранён как структурный ритм перечисления; связка опущена там, где русское тире делает фразу естественнее.
