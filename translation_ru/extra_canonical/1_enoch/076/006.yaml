  text: And through the second middle gate abundance comes out[a], and from it come rain and fruit and peace and dew; and through the third gate, which is toward the south[c][b], frost comes out and dryness.
translation:
  language: ru
  text: И через вторые средние врата выходит изобилие[a], и из них выходят дождь, плод, мир и роса; а через третьи врата, обращённые к югу, выходят иней и сухость[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный более буквальный оттенок: «широта», «простор». Здесь слово передано как «изобилие» в соответствии с рядом следующих за ним благ.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «засуха»; однако это несколько усиливает значение исходного слова.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኆኅት
  choice: врата
  rationale: В Астрономической книге это слово обозначает небесные проходы, через которые выходят природные явления. «Врата» сохраняет космологический образ и возвышенный, но понятный регистр.
- source_word: ማእከላዊት
  choice: средние
  rationale: Прилагательное указывает на положение в середине ряда врат; «средние» естественно передаёт пространственный смысл.
- source_word: ርኅብ
  choice: изобилие
  rationale: В данной графической форме слово передаёт широту или обилие, а не голод; «изобилие» также согласуется с последующим рядом благотворных явлений — дождём, плодом, миром и росой.
- source_word: ዝናም
  choice: дождь
  rationale: Прямое и естественное обозначение атмосферного явления.
- source_word: ፍሬ
  choice: плод
  rationale: Сохраняет конкретность исходного слова; в контексте подразумеваются также урожай и плодородие.
- source_word: ሠላም
  choice: мир
  rationale: Основное значение слова сохранено, хотя в данном перечне оно может включать благополучие.
- source_word: ጤለ
  choice: роса
  rationale: Точное обозначение росы, уместное в ряду явлений, связанных с плодородием.
- source_word: መንገለ መስዕ
  choice: обращённые к югу
  rationale: Фраза обозначает направление; этот вариант естественен по-русски и сохраняет пространственную ориентацию врат.
- source_word: ቍር
  choice: иней
  rationale: В погодном контексте обозначает морозное явление; «иней» конкретнее и естественнее общего «холод».
- source_word: የብስ
  choice: сухость
  rationale: Передаёт состояние сухости без усиления до более конкретного «засуха».
theological_decisions:
- issue: Сохранение образа небесных врат
  choice: Передать ኆኅት как «врата» и сохранить повтор глагола «выходить»
  alternative: Передать как «отверстия» и сгладить фразу глаголами «приносить» или «производить»
  rationale: Текст изображает упорядоченный космос, в котором погодные явления выходят через небесные врата. Буквальный образ важен для апокалиптической картины мира и не должен превращаться в отвлечённое метеорологическое описание.
- issue: Значение ሠላም в перечне благ
  choice: «мир»
  alternative: «благополучие»
  rationale: «Мир» сохраняет основное и богословски открытое значение слова, не исключая оттенка благополучия, возникающего из контекста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной лексикой. «Врата» сохраняют апокалиптический образ; синтаксический повтор намеренно удержан. Формы «вторые, средние» и «третьи» согласованы с русским множественным существительным «врата».
