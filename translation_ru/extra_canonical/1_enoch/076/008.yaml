base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/008.yaml
  text: And through the middle opening[a], which is beside it, there come out from it a pleasant fragrance, and dew, and rain, and peace[c][b], and life.
translation:
  language: ru
  text: И через среднее отверстие, находящееся рядом с ним, выходят из него приятный аромат,[b] роса, дождь, мир[c] и жизнь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Буквально: «добрый (приятный) запах»; возможно также: «приятное благоухание».'
    reason: lexical_alternative
  - marker: c
    text: Слово «мир» может также означать благополучие, целостность и полноту жизни, а не только отсутствие вражды.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኆኅት
  choice: отверстие
  rationale: Широкое обозначение проёма или отверстия; оно сохраняет космологический образ, не уточняя без основания, идёт ли речь об окне или вратах.
- source_word: እንተ ኃቤሃ ማእከላዊት
  choice: среднее отверстие, находящееся рядом с ним
  rationale: Форма ማእከላዊት согласуется с существительным женского рода ኆኅት и определяет само отверстие как среднее; суффикс в ኃቤሃ передаёт значение «рядом с ним/с ней» и отсылает к ранее названному объекту.
- source_word: ይወፅእ እምኔሃ
  choice: выходят из него
  rationale: Передаёт движение наружу; множественное число в русском согласовано с перечисляемыми явлениями и благами.
- source_word: መዐዛ ሠናይ
  choice: приятное благоухание
  rationale: Сочетание существительного со значением запаха или аромата и прилагательного «добрый, приятный» естественно передаётся как «приятное благоухание».
- source_word: ጤለ
  choice: роса
  rationale: Наиболее вероятное значение в метеорологическом перечислении.
- source_word: ዝናም
  choice: дождь
  rationale: Прямое и обычное соответствие исходному слову.
- source_word: ሰላም
  choice: мир
  rationale: Сохраняет широкий богословский и космический смысл слова, не сводя его только к материальному благополучию.
- source_word: ሕይወት
  choice: жизнь
  rationale: Прямой перевод, сохраняющий кульминацию перечня благ.
theological_decisions:
- issue: Следует ли сужать значение ሰላም до материального благополучия в перечне метеорологических благ
  choice: мир
  alternative: благополучие; процветание
  rationale: «Мир» сохраняет смысловую широту слова, которая может включать целостность и благополучие, но не ограничивается хозяйственным процветанием.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранена перечислительная структура стиха и неоднозначность пространственной фразы отмечена в сноске.
