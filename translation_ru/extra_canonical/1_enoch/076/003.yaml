base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/003.yaml
  text: And the first three are toward the east[a], and three toward the north, and three after these, on the left, toward the south[c][b], and three toward the west.
translation:
  language: ru
  text: И первые три — на восточной стороне, три — на северной, три после них — слева, на южной стороне[a], и три — на западной.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «после них, слева» в представленном эфиопском тексте заключены в скобки, что указывает на текстовую неуверенность. При древней ориентации лицом на восток слева находился север, тогда как далее назван юг; это несоответствие в переводе сохранено.
    reason: textual_variant
lexical_decisions:
- source_word: ቀዳማያት
  choice: первые
  rationale: Слово прямо обозначает «первые»; порядковое значение сохранено, несмотря на возможность направительного истолкования в данном перечне.
- source_word: መንገለ
  choice: к
  rationale: В повторяющихся сочетаниях со сторонами света слово выражает направление; русское «к» естественно передаёт эту функцию без тяжеловесного повтора «в сторону».
- source_word: ጽባሕ
  choice: восток
  rationale: Буквально связано с утром или восходом, но в астрономическом контексте обозначает восточное направление.
- source_word: መስዕ
  choice: север
  rationale: Сохранено засвидетельствованное в данном чтении направление; оно не заменено на юг ради согласования с относительным указанием «слева».
- source_word: በድኅረ እሉ
  choice: после них
  rationale: Передаёт продолжение последовательного перечисления и естественно относится к ранее названным группам.
- source_word: በፀጋም
  choice: слева
  rationale: Относительное пространственное указание сохранено, поскольку оно присутствует в тексте и создаёт значимое напряжение с последующим направлением.
- source_word: አዜብ
  choice: юг
  rationale: Передано как южное направление согласно принятому разбору данного свидетельства, без перестановки сторон света для устранения внутренней трудности.
- source_word: ዓረብ
  choice: запад
  rationale: Хотя слово связано с вечером или закатом, здесь оно обозначает западное направление.
theological_decisions:
- issue: Следует ли согласовать указание «слева» с современной или древней схемой сторон света
  choice: Сохранить одновременно «слева» и «к югу»
  alternative: Исправить направление на север либо опустить относительное указание
  rationale: Источник в данном виде содержит напряжение между относительной ориентацией и названной стороной света. Перевод не устраняет его предположительной перестановкой и отмечает текстовую неуверенность в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксический параллелизм перечня сохранён; тире помогают различать четыре группы по три. Подлинная текстовая и пространственная трудность не сглажена.
