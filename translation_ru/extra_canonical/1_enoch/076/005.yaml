base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/005.yaml
  text: And the first wind goes out from those gates[a], whose name is the east wind, through the first gate that is toward the east; and turning toward the south, from it come forth desolation, drought, death[c][b], and destruction.
translation:
  language: ru
  text: И первый ветер выходит из тех врат; имя ему — восточный ветер. Он выходит через первые врата, обращённые к востоку, и поворачивает к югу[a]; из первых врат исходят опустошение, засуха, смерть и погибель.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «уклоняется к югу». Геэзское выражение обозначает направленное движение или отклонение к югу.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይወፅእ
  choice: выходит
  rationale: Сохраняет повторяющуюся в описании ветров формулу движения из врат и звучит естественно по-русски.
- source_word: ቀዳማይ ነፋስ
  choice: первый ветер
  rationale: Передаёт порядковое обозначение в систематическом перечне ветров.
- source_word: እምእልክቱ ኃዋሳው
  choice: из тех врат
  rationale: Сохраняет указательное значение и ключевой для видения образ небесных врат.
- source_word: ዘስሙ ጽባሓይ
  choice: имя ему — восточный ветер
  rationale: Передаёт формулу именования и ясно выражает направление ветра.
- source_word: በቀዳሚት ኆኅት
  choice: через первые врата
  rationale: Сохраняет образ прохода через врата и порядковую последовательность.
- source_word: እንተ መንገለ ጽባሕ
  choice: обращённые к востоку
  rationale: መንገለ выражает направленность «к, в сторону»; русский оборот естественно передаёт ориентацию врат.
- source_word: ታጸንኑ ለአዜብ
  choice: поворачивает к югу
  rationale: Передаёт направленное отклонение к югу; некоторую лексическую неопределённость отмечает сноска.
- source_word: ድምሳሴ
  choice: опустошение
  rationale: Сохраняет суровый апокалиптический смысл бедствия, поражающего землю.
- source_word: ናብስት
  choice: засуха
  rationale: В контексте вредоносных ветров конкретно и естественно передаёт иссушение.
- source_word: ሞት
  choice: смерть
  rationale: Передаёт засвидетельствованное геэзское слово буквально, не заменяя его предположительным «зноем» ради метеорологической однородности списка.
- source_word: ሐጕል
  choice: погибель
  rationale: Передаёт широкое значение уничтожения и сохраняет возвышенно-зловещий регистр.
theological_decisions:
- issue: Представить последствия ветра как обычные погодные явления или как бедствия апокалиптического миропорядка
  choice: Сохранить перечисление катастрофических последствий, включая смерть
  alternative: Свести перечень к метеорологическим последствиям, заменив «смерть» на «зной»
  rationale: В геэзском тексте прямо стоит ሞት («смерть»), а контекст книги допускает, что космические ветры несут не только погоду, но и гибель. Замена устранила бы напряжение текста без достаточного основания.
translation_notes:
  register: Современный литературный русский с ясным синтаксисом и умеренно возвышенной апокалиптической лексикой. Длинная исходная фраза разделена на два предложения ради понятности; последовательность образов и причинная связь сохранены.
