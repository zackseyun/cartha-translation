base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/001.yaml
  text: And at the ends of the earth I saw twelve portals[a], and all of them were open for all the winds[b], from which the winds go out and blow upon the earth.
translation:
  language: ru
  text: И на краях земли я увидел двенадцать врат[a], и все они были открыты для всех ветров, из которых выходят ветры и дуют над землёй.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ворот»; геэзское слово обозначает врата, ворота или проходы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አጽናፈ ምድር
  choice: на краях земли
  rationale: Передаёт внешние пределы мира в космографии видения естественным и понятным русским выражением.
- source_word: ርኢኩ
  choice: я увидел
  rationale: Прямо и современно передаёт формулу рассказа о видении.
- source_word: ፲፪ ኆኃተ
  choice: двенадцать врат
  rationale: «Врата» сохраняют архитектурно-космический образ проходов, не сводя его к нейтральным «отверстиям».
- source_word: ወእልኩ ኆኃው ርኅዋተ
  choice: и все они были открыты
  rationale: 'Учитывает установленное исправление транскрипции: спорная форма обозначает врата, а не наречие «вокруг»; местоимение избегает ненужного повтора.'
- source_word: ለኵሎሙ ነፋሳት
  choice: для всех ветров
  rationale: В непосредственном метеорологическом контексте речь идёт о ветрах, хотя слово может иметь значения, связанные также с дыханием или духом.
- source_word: እለ እምኔሆሙ ይወፅኡ ነፋሳት
  choice: которые выходят оттуда
  rationale: Относительное местоимение естественно соотнесено с ближайшим существительным «ветры», а «оттуда» ясно указывает на врата как место их выхода.
- source_word: ወይነፍሱ ዲበ ምድር
  choice: и дуют над землёй
  rationale: Передаёт физическое действие ветров и пространственный смысл предлога без излишней архаизации.
theological_decisions:
- issue: Передача ነፋሳት как «ветры» или «духи»
  choice: ветры
  alternative: духи
  rationale: Описание врат, из которых нечто выходит и дует над землёй, относится к космической метеорологии; перевод «духи» неоправданно персонализировал бы образ.
- issue: Синтаксическое отнесение относительной конструкции
  choice: «которые» относится к ветрам
  alternative: «из которых» относится к вратам
  rationale: 'Геэзская конструкция допускает буквальную передачу через врата, однако в русском варианте связь с явно повторённым в источнике словом «ветры» выражена естественнее: ветры выходят оттуда и дуют.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном. «Врата» сохраняют образ апокалиптической космографии; остальная фраза построена просто и ясно. Все сноски отмечены в основном тексте.
