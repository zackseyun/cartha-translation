base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/010.yaml
  text: And after these[a], winds from the south—whose name is Sea[e][d][c][b], and which come out from the seventh opening that is toward the east—dew comes forth from it.
translation:
  language: ru
  text: А вслед за этими — ветры с юга[a], имя которым — Море[b]; они выходят из седьмого отверстия, обращённого к востоку[c], и из него исходит роса[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «южные ветры».'
    reason: alternative_reading
  - marker: b
    text: Слова «имя которым — Море» текстуально трудны; они могут отражать вариант или расширение текста, но сохранены по представленному свидетелю.
    reason: textual_variant
  - marker: c
    text: В свидетеле также стоит заключённая в скобки направительная фраза, возможно означающая «к западу»; из-за неясности её положения она не включена в основной текст.
    reason: alternative_reading
  - marker: d
    text: Ранее эту часть понимали как «они выходят из семи отверстий словно роса», однако грамматика геэз лучше поддерживает перевод «из него исходит роса».
    reason: grammar
lexical_decisions:
- source_word: እምድኅረ እሉ
  choice: вслед за этими
  rationale: Передаёт последовательность перечисления и допускает отсылку к ранее названным ветрам или явлениям.
- source_word: ነፋሳት
  choice: ветры
  rationale: В метеорологическом и космографическом контексте это естественное значение; множественное число исходного текста сохранено.
- source_word: ዘመንገለ መስዕ
  choice: с юга
  rationale: Направительное выражение здесь обозначает сторону происхождения ветров.
- source_word: ዘስሙ ባሕር
  choice: имя которым — Море
  rationale: Формула именования и слово «Море» сохранены буквально, без истолкования как «морской ветер».
- source_word: እም፯ኆኅት
  choice: из седьмого отверстия
  rationale: Чтение с порядковым числительным согласуется с последующим местоименным суффиксом женского рода единственного числа, отсылающим к одному отверстию.
- source_word: እንተ መንገለ ምሥራቅ
  choice: обращённого к востоку
  rationale: Естественно передаёт пространственную ориентацию отверстия, не уточняя сверх текста устройство космоса.
- source_word: ይወፅእ እምኔሃ ጤለ
  choice: из него исходит роса
  rationale: Глагол в единственном числе согласуется с «росой» как подлежащим, а суффикс в እምኔሃ указывает на единственное отверстие; значение сравнения «словно роса» в тексте грамматически не выражено.
theological_decisions:
- issue: Космологическое имя южных ветров
  choice: Сохранить буквальное «имя которым — Море»
  alternative: Передать как «морские ветры» или опустить трудную вставку
  rationale: Буквальный вариант сохраняет древнюю апокалиптическую номенклатуру и текстовую трудность, не навязывая ей позднейшего истолкования.
