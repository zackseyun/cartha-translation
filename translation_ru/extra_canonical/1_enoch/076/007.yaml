base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/007.yaml
  text: And after these winds[a], by the way of the south they go out through two gates; through the first gate, which inclines toward the east[c][b], there comes out a wind of death.
translation:
  language: ru
  text: И после этих ветров они выходят с южной стороны через двое ворот[a]; через первые из них, обращённые к востоку, выходит ветер смерти[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «через два проёма». Эфиопское слово может обозначать ворота, окно или отверстие.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «смертоносный ветер». Буквально: «ветер смерти».'
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ እሉ ነፋሳት
  choice: после этих ветров
  rationale: Сохраняет временную последовательность и непосредственную отсылку указательного местоимения к ранее описанным ветрам.
- source_word: መንገለ አዜብ
  choice: с южной стороны
  rationale: Передаёт пространственно-направительное значение መንገለ естественным русским выражением, не превращая его в отвлечённое обозначение стороны света.
- source_word: በ፪ኆኅት
  choice: через двое врат
  rationale: ኆኅት обозначает проём, окно или врата. «Врата» соответствует образу космических выходов и сохраняет возвышенный апокалиптический регистр.
- source_word: ቀዳሚት ኆኅት
  choice: из первых врат
  rationale: Передаёт порядковое определение при существительном ኆኅት; русское «врата» грамматически имеет форму множественного числа, хотя обозначает один проход.
- source_word: እንተ ታጸንኑ ለመንገለ ምሥራቅ
  choice: направленных к востоку
  rationale: Женское относительное местоимение относится к первым вратам, а глагол описывает их ориентацию или склонение к востоку. «Направленных» естественно передаёт пространственный смысл.
- source_word: ነፋስ ሞት
  choice: ветер смерти
  rationale: Буквальное именное сочетание сохраняет суровый космический образ и не сводит его к обычному прилагательному «смертоносный».
theological_decisions:
- issue: Следует ли передать ነፋስ ሞት прилагательным и тем самым смягчить апокалиптический образ
  choice: ветер смерти
  alternative: смертоносный ветер
  rationale: Родительное сочетание сохраняет возможное представление о смерти как о космическом действии или назначении ветра, не навязывая более узкого толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной лексикой, подходящей космологическому и апокалиптическому описанию. Синтаксис источника сохранён настолько, насколько это допускает ясная русская фраза; неоднозначность слова ኆኅት и выражения «ветер смерти» отмечена в сносках.
