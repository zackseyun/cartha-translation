base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/005.yaml
  text: And I will transform the dry land and make it a blessing[a], and I will cause my chosen ones to dwell in it[c][b]; but those who commit sin and transgression shall not set foot in it.
translation:
  language: ru
  text: И Я преображу сушу и сделаю её благословением[a], и поселю на ней Моих избранных; а совершающие грех и беззаконие не ступят на неё[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сделаю её благословенной». Буквальная конструкция может подчёркивать либо превращение суши в благословение, либо её благословенное состояние.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не пойдут (не будут ходить) по ней».'
    reason: lexical_alternative
lexical_decisions:
- source_word: እዌልጦ
  choice: преображу
  rationale: Глагол обозначает изменение состояния; «преображу» передаёт силу эсхатологического обновления, не уточняя его способ.
- source_word: ለየብስ
  choice: сушу
  rationale: የብስ обозначает сухую землю, сушу; в связи с небом в предыдущем стихе «суша» сохраняет конкретный образ и широкий, космический масштаб.
- source_word: እገብራ በበረከት
  choice: сделаю её благословением
  rationale: Результативная конструкция представляет сушу не только благословлённой, но ставшей благословением.
- source_word: ሕሩያነ ዚአየ
  choice: Моих избранных
  rationale: Передаёт принадлежность говорящему и сохраняет местную апокалиптическую категорию без замены позднейшей конфессиональной терминологией.
- source_word: አነብሮሙ ውስቴታ
  choice: поселю на ней
  rationale: '«Поселю» естественно передаёт каузативный смысл: говорящий сам устраивает пребывание избранных на обновлённой суше.'
- source_word: ኃጢአተ ወጌጋየ
  choice: грех и беззаконие
  rationale: Сохранена парная нравственная характеристика; «беззаконие» выражает нарушение и проступок, не сливая оба понятия.
- source_word: ኢይከይዱ ውስቴታ
  choice: не ступят на неё
  rationale: Исходное выражение буквально использует глагол движения или хождения; русское «не ступят на неё» естественно выражает недопуск на обновлённую сушу.
theological_decisions:
- issue: Кто такие «избранные»
  choice: «Мои избранные» без дальнейшего отождествления
  alternative: «Мои святые» или терминологически нагруженное «избранники»
  rationale: Текст говорит о выбранных Богом в апокалиптическом контексте, но сам стих не определяет их через более поздние церковные категории.
- issue: Характер обещанного обновления суши
  choice: Сохранить конкретный образ суши, которая становится благословением
  alternative: Истолковать сушу как весь мир, пустыню либо исключительно духовную реальность
  rationale: Так сохраняются космический образ и богословская открытость текста без сужения до локального участка или аллегоризации.
- issue: Смысл недопуска грешащих
  choice: Передать образом «не ступят на неё»
  alternative: «Не войдут в неё» как более явная формула исключения
  rationale: Выбранный вариант сохраняет буквальный образ движения и одновременно ясно передаёт исключение из обновлённой земли.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но ясной библейской интонацией. Заглавные «Я» и «Моих» обозначают божественного говорящего по контексту. Порядок противопоставления и парная формула «грех и беззаконие» сохранены.
