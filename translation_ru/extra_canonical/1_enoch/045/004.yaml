base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/004.yaml
  text: On that day I will cause my Chosen One to dwell among them[c][b][a], and I will transform heaven and make it a blessing and a light forever.
translation:
  language: ru
  text: В тот день Я поселю среди них Моего Избранника[a][b] и преображу небо, сделав его благословением и светом навеки[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «посреди них».'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «Моего Избранного».'
    reason: lexical_alternative
  - marker: c
    text: 'Или: «вечным благословением и светом».'
    reason: previous_rendering
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: В тот день
  rationale: Сохраняет обычную апокалиптическую временную формулу и естественно звучит по-русски.
- source_word: አነብር
  choice: Я поселю
  rationale: 'Передаёт каузативное значение: дать кому-либо обитать, поместить на жительство; при этом не усиливает текст до явного воцарения.'
- source_word: ማእከሎሙ
  choice: среди них
  rationale: Естественный современный эквивалент значения «посреди них»; буквальный оттенок отмечен в сноске.
- source_word: ለኅሩየ ዚአየ
  choice: Моего Избранника
  rationale: Передаёт титул определённой избранной фигуры, не отождествляя её посредством добавлений с титулами из иных текстов.
- source_word: ወእዌልጦ ለሰማይ
  choice: и преображу небо
  rationale: Сохраняет сильный образ космического изменения; «небо» здесь указывает на космическую область, а не только на видимый небосвод.
- source_word: ወእገብራ በረከተ ወብርሃነ
  choice: сделав его благословением и светом
  rationale: Передаёт существительные как именные характеристики преобразованного неба, не сводя их к прилагательным «благословенным и светлым».
- source_word: ለዓለም
  choice: навеки
  rationale: Передаёт предложное выражение длительности наречным оборотом, а не прилагательным «вечным».
theological_decisions:
- issue: Статус выражения ኅሩየ ዚአየ
  choice: Моего Избранника
  alternative: того, кого Я избрал; Моего Избранного
  rationale: Форма сохраняет титульный характер выражения и его определённость, но не привносит позднейшую конфессиональную идентификацию.
- issue: Характер преобразования неба
  choice: преображу небо, сделав его благословением и светом
  alternative: изменю небо и сделаю его благословением и светом
  rationale: Сохраняется апокалиптический образ действительного космического обновления без превращения его в отвлечённую метафору.
- issue: Синтаксическая функция ለዓለም
  choice: навеки
  alternative: вовеки; на вечность
  rationale: Исходное выражение является обстоятельством продолжительности; поэтому оно отнесено к состоянию благословения и света как указание на его непреходящий характер.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Прописные буквы в «Я» и «Моего Избранника» отражают речь Бога и титульное употребление; архаизмы сведены к умеренному «навеки», естественному для библейского регистра.
