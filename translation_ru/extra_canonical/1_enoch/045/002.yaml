base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/002.yaml
  text: And they will not ascend to heaven, nor will they arrive on earth; thus it shall be the portion of the sinners who denied the name of the Lord of Spirits, who are thus kept for the day of affliction and tribulation.
translation:
  language: ru
  text: 'И они не взойдут на небо и не достигнут земли[a]. Такова будет доля грешников, отвергших имя Господа духов: они сохраняются для дня скорби и бедствия[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальная фраза необычна по смыслу. Глаголы относятся к грешникам, а «небо» и «земля» обозначают направление. Возможно, речь идёт о том, что грешникам не останется убежища ни на небе, ни на земле.
    reason: textual_variant
  - marker: b
    text: 'Возможный перевод: «для дня угнетения и мучения». Два близких по смыслу слова усиливают описание грядущего суда.'
    reason: lexical_alternative
lexical_decisions:
- source_word: የዐርጉ
  choice: взойдут
  rationale: Глагол обозначает восхождение; форма третьего лица множественного числа относится к грешникам, а «небо» выражает направление движения.
- source_word: ይበጽሑ
  choice: придут
  rationale: Глагол означает «достичь, прибыть»; в сочетании с направительным «на землю» естественное русское соответствие — «придут на землю».
- source_word: ክፍለ
  choice: доля
  rationale: Передаёт назначенный грешникам удел в контексте суда и звучит естественно в современном литературном русском.
- source_word: ኃጥኣን
  choice: грешников
  rationale: Прямое обозначение нравственной категории людей, подвергающихся суду.
- source_word: ክሕዱ
  choice: отвергших
  rationale: Передаёт сознательное непризнание и отречение от Божьего имени; вариант «отрёкшихся от» также возможен, но несколько сильнее по оттенку.
- source_word: ስሞ ለእግዚአ መናፍስት
  choice: имя Господа духов
  rationale: Сохраняет значимость божественного имени и устойчивый титул Бога в Книге Еноха без добавления отсутствующего определения.
- source_word: ይትዐቀቡ
  choice: сохраняются
  rationale: Пассивная форма указывает, что грешники удерживаются до будущего дня суда, при этом действующее лицо, как и в источнике, не названо.
- source_word: ዕለተ ስራሕ ወምንዳቤ
  choice: дня скорби и бедствия
  rationale: Парное выражение передаёт усиленное описание грядущего тяжёлого суда, не сводя оба существительных к одному понятию.
theological_decisions:
- issue: Смысл начальной фразы о небе и земле
  choice: Грешники не взойдут на небо и не придут на землю.
  alternative: Небо не примет их, и земля не достигнет их.
  rationale: Формы глаголов стоят в третьем лице множественного числа, а слова «небо» и «земля» обозначают направление. Перевод следует грамматике геэзского текста, сохраняя при этом необычный и не до конца ясный космический образ.
- issue: Сохранение грешников до дня суда
  choice: они сохраняются для дня скорби и бедствия
  alternative: они содержатся под стражей до дня скорби и бедствия
  rationale: Пассив источника оставляет неназванными и способ удержания, и действующее лицо; нейтральное «сохраняются» не добавляет образ заключения или конкретную доктрину.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной апокалиптической интонацией. Синтаксис упрощён лишь настолько, чтобы ясно обозначить грешников как подлежащее начальных глаголов; необычный образ неба и земли сохранён, а его возможный смысл вынесен в примечание.
