base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/003.yaml
  text: On that day my Chosen One will sit on the throne of glory[a], and he will choose their works and their resting places without number[d][c][b]; and their souls will grow strong within them when they see my Chosen Ones and those who have called on my glorious name.
translation:
  language: ru
  text: В тот день Мой Избранник воссядет на престоле славы[a] и изберёт их дела и места покоя без числа.[b] Их души окрепнут в них, когда они увидят Моих избранных[c] и тех, кто нашёл прибежище в Моём славном имени.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «на престоле славы».'
    reason: lexical_alternative
  - marker: b
    text: 'Это место трудно для толкования. Глагол может означать «выбрать», «определить», «разобрать» или «исследовать», а слово, переведённое как «места покоя», — также «жилища» или «места пребывания». Выражение «без числа» может относиться к местам покоя; возможно и другое членение: «он изберёт их дела, а местам их покоя не будет числа».'
    reason: lexical_alternative
  - marker: c
    text: В начале стиха говорится об одном «Моём Избраннике», а здесь — о «Моих избранных» во множественном числе. Исходный текст не позволяет уверенно устранить этот переход.
    reason: textual_difficulty
  - marker: d
    text: Буквально — «тех, кто бежал к Моему славному имени», то есть искал в нём прибежища. Перевод «тех, кто призвал Моё славное имя» передаёт возможный смысл, но не основной образ глагола.
    reason: lexical_alternative
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: В тот день
  rationale: Сохраняет обычную апокалиптическую временную формулу и естественно звучит по-русски.
- source_word: ይነብር ዲበ መንበረ ስብሐት
  choice: воссядет на престоле славы
  rationale: В сочетании с престолом глагол обозначает воцарение; «воссядет» передаёт торжественный регистр без излишней архаизации.
- source_word: ኅሩየየ
  choice: Мой Избранник
  rationale: Передаёт единственное число, притяжательный суффикс первого лица и титульный характер выражения, не отождествляя фигуру с иным титулом.
- source_word: የኀሪ ምግባሪሆሙ
  choice: разберёт их дела
  rationale: Глагол допускает значения выбора, разбора и определения. Русское «разберёт» сохраняет оттенки рассмотрения и распределения, не подменяя их прямо словом «осудит».
- source_word: ምዕራፎሙ ኍልቈ አልቦ
  choice: местам их покоя не будет числа
  rationale: Передаёт существительное как места покоя или пребывания и естественно связывает выражение «без числа» именно с ними.
- source_word: ነፍሶሙ በማእከሎሙ ትጸንዕ
  choice: их души окрепнут в них
  rationale: Сохраняет внутренний образ укрепления и необычное возвратное соотношение исходного текста, не заменяя «души» на «дух».
- source_word: ለኅሩያነ ዚአየ
  choice: Моих избранных
  rationale: Сохраняет внезапный переход исходного текста от единственного «Избранника» к множественному числу.
- source_word: እለ ሰከዩ ስምየ ስቡሐ
  choice: тех, кто прибег к Моему славному имени
  rationale: Глагол ሰከየ передаёт бегство к убежищу или поиск прибежища; «прибег к имени» сохраняет конкретный образ упования на Божье имя.
theological_decisions:
- issue: Личность «Моего Избранника»
  choice: Сохранён местный титул «Мой Избранник».
  alternative: Мессия; Сын Человеческий
  rationale: Сам стих употребляет титул «Избранник»; замена другим титулом преждевременно разрешила бы вопрос об отождествлении этой фигуры.
- issue: Переход от единственного Избранника к избранным во множественном числе
  choice: Различие сохранено в основном тексте.
  alternative: Согласовать оба выражения в единственном или во множественном числе.
  rationale: Геэзский текст действительно меняет число; это может различать восседающую на престоле фигуру и связанную с ней общину, но уверенно устранять напряжение нельзя.
- issue: Связь выражения «без числа»
  choice: 'Оно отнесено к местам покоя: «местам их покоя не будет числа».'
  alternative: «Он выберет их дела и их бесчисленные места покоя».
  rationale: Синтаксис допускает разные членения. Выбранное чтение соответствует прямой предикативной силе ኍልቈ አልቦ, а альтернативное отмечено в сноске.
- issue: Образ обращения к славному имени
  choice: 'Передан как поиск прибежища: «прибег к Моему славному имени».'
  alternative: «призвал Моё славное имя»
  rationale: Значение глагола связано прежде всего с бегством и обретением убежища; более привычная формула призывания имени могла бы скрыть исходный образ.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. «Воссядет» и «престол славы» поддерживают достоинство сцены; остальной синтаксис остаётся понятным обычному читателю. Заглавная буква в «Избранник» отмечает титул единственной восседающей фигуры, тогда как множественное «избранных» оставлено строчным.
