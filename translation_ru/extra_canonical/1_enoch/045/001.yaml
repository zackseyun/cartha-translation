base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/001.yaml
  text: And this is the second parable concerning those who deny the name of the dwelling of the holy ones and of the Lord of Spirits[a][b][c].
translation:
  language: ru
  text: И вот вторая притча о тех, кто отвергает имя обители святых и Господа духов[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Формулировка на языке геэз после слов «отвергает имя» трудна для однозначного понимания. Возможен перевод «имя обители святых и Господа духов», но допустимы и иные синтаксические толкования.
    reason: textual_variant
  - marker: b
    text: Под «святыми» здесь могут подразумеваться небесные святые существа, праведники или обе группы одновременно.
    reason: lexical_alternative
  - marker: c
    text: 'Возможно также: «другая притча». Однако последовательность притч в книге поддерживает перевод «вторая».'
    reason: previous_rendering
lexical_decisions:
- source_word: ወዝ
  choice: И вот
  rationale: Передаёт соединительно-указательное введение новой части естественным для современного русского повествования оборотом.
- source_word: ካልእ ምሳሌ
  choice: вторая притча
  rationale: Хотя ካልእ может означать «другая», последовательность трёх притч в книге поддерживает здесь порядковое значение «вторая»; «притча» сохраняет название жанровой единицы.
- source_word: ዲበ
  choice: о
  rationale: Предлог вводит тему притчи; русское «о» точно и естественно передаёт эту функцию.
- source_word: እለ ይክሕዱ
  choice: о тех, кто отвергает
  rationale: Сочетание относительного показателя с глаголом обозначает группу лиц. «Отвергает» сохраняет смысл сознательного непризнания, не ограничивая его только словесным отрицанием.
- source_word: ስሞ
  choice: имя
  rationale: Сохраняется конкретное значение «имя» без богословской подмены словами «власть» или «величие».
- source_word: ለማኅደረ ቅዱሳን
  choice: обители святых
  rationale: «Обитель» передаёт место пребывания и сохраняет пространственный апокалиптический образ; родительная связь воспроизведена максимально прозрачно.
- source_word: ቅዱሳን
  choice: святых
  rationale: Русское субстантивированное «святые» позволяет не уточнять, имеются ли в виду небесные святые существа, праведники или обе группы.
- source_word: ወእግዚአ መናፍስት
  choice: и Господа духов
  rationale: Устойчивый божественный титул переведён прямо и без конфессионального истолкования.
theological_decisions:
- issue: Кого обозначают «святые»
  choice: 'Референт оставлен неоднозначным: «святых»'
  alternative: «ангелов» или «праведников»
  rationale: Непосредственный контекст не позволяет уверенно выбрать между небесными святыми существами и общиной праведников.
- issue: Смысл трудной конструкции после слова «имя»
  choice: 'Сохранена буквальная родительная конструкция: «имя обители святых и Господа духов»'
  alternative: «имя, которым пребывают святые»; «обитель святых и Господа духов»; «имя Господа духов в обители святых»
  rationale: Синтаксис геэзского текста сжат и неясен, а надёжного греческого или кумранского параллельного текста здесь нет; буквальная передача с примечанием избегает ложной определённости.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным апокалиптическим регистром. Трудная исходная конструкция сохранена без конфессионального уточнения; архаизмы сведены к уместному слову «обитель».
