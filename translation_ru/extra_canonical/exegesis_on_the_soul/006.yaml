base_translation:
  language: en
  yaml_path: translation/extra_canonical/exegesis_on_the_soul/006.yaml
  text: 'Accordingly, it is written in the poet:


    Odysseus sat on the island, suffering and grieving,

    and turning his face away from Calypso’s words and charms,

    yearning to see his village again and smoke rising from it.

    And if he had not [received] help from Heaven,

    [he could not have returned] to his village. (Homer, Odyssey 1.48–1.59)


    Again, [Helen also] says:


    My heart changed within me;

    [] it is to my home that I would return. (Homer, Odyssey 4.260–261)


    For she moaned, saying:


    It is Aphrodite who misled me

    and took me away from my village.

    I abandoned my own daughter,

    and my husband, good, intelligent, and handsome. (Homer, Odyssey 4.261–4.264)


    For when the soul abandons her perfect husband because of the disloyalty of Aphrodite, who comes into existence here through the act of begetting, she will then come to harm. But if she moans and repents, she will be returned to her house.'
translation:
  language: ru
  text: "И потому у поэта написано:\n\n    Одиссей сидел на острове, страдая и скорбя,\n    и отворачивался от речей Калипсо и от её чар,\n    тоскуя о том, чтобы вновь увидеть своё селение и поднимающийся над ним дым.\n    И если бы он не [получил] помощи с Небес,\n    [он не смог бы вернуться] в своё селение. (Гомер, «Одиссея» 1.48–1.59)[a]\n\nИ ещё [Елена] говорит:\n\n    Моё сердце во мне переменилось;\n    […] я хотела бы вернуться домой. (Гомер, «Одиссея» 4.260–261)[b]\n\nИбо она стонала, говоря:\n\n    Это Афродита ввела меня в заблуждение\n    и увела из моего селения.\n    Я оставила родную дочь\n    и мужа — доброго, разумного, прекрасного. (Гомер, «Одиссея» 4.261–4.264)[c]\n\nИбо когда душа оставляет своего совершенного мужа из-за неверности Афродиты, которая возникает здесь через рождение, тогда душа терпит вред. Но если она стонет и кается, то будет возвращена в свой дом."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Цитата и ссылка на «Одиссею» переданы по данному текстовому свидетельству. Квадратные скобки обозначают восстановленные слова.
    reason: Предупреждает, что форма цитаты и нумерация воспроизводят посредующее древнее свидетельство, а не современное критическое издание Гомера.
  - marker: b
    text: Многоточие в квадратных скобках обозначает повреждение или утрату текста; имя Елены восстановлено по контексту.
    reason: Сохраняет сигнал лакуны, присутствующий в исходном свидетельстве, в читаемой типографской форме.
  - marker: c
    text: Гомеровские строки приведены в той форме, в какой их цитирует автор трактата; они могут отличаться от современных переводов «Одиссеи».
    reason: Различает встроенную древнюю цитату и независимый перевод гомеровского оригинала.
lexical_decisions:
- source_word: village
  choice: селение
  rationale: Сохраняет повторяющийся образ родного места, не подменяя его более широким «родина»; «деревня» в современном русском звучала бы излишне бытово.
- source_word: Heaven
  choice: Небеса
  rationale: Передаёт небесный источник помощи и сохраняет возвышенный религиозный регистр без уточнения, которого нет в свидетельстве.
- source_word: moaned
  choice: стонет / стонала
  rationale: Сохраняет сильное выражение скорби, важное для последующей темы покаяния.
- source_word: perfect husband
  choice: совершенный муж
  rationale: Формально сохраняет возможный символико-богословский смысл выражения, не сводя его к «идеальному супругу».
- source_word: act of begetting
  choice: рождение
  rationale: Естественное русское выражение, сохраняющее связь с порождением или зачатием; точный коптский термин требует проверки по оригиналу.
- source_word: come to harm
  choice: терпит вред
  rationale: Сохраняет неопределённость вида ущерба и не усиливает текст до гибели или осуждения.
theological_decisions:
- issue: Образ души как женщины и мужа как её совершенного супруга
  choice: Сохранён женский грамматический род души и буквальный образ «совершенного мужа».
  alternative: Нейтрализовать метафору как отношения человека с Богом или Спасителем.
  rationale: Сам отрывок не называет мужа прямо; конкретизация устранила бы намеренную символическую открытость.
- issue: Неверность Афродиты
  choice: «из-за неверности Афродиты»
  alternative: «из-за обмана Афродиты» или «из-за распутства Афродиты»
  rationale: 'Сохраняет формулировку английского свидетельства и её двусмысленность: это может означать ненадёжность, неверность или предательство.'
- issue: Возникновение Афродиты через рождение
  choice: «которая возникает здесь через рождение»
  alternative: «которая рождается здесь вследствие совокупления»
  rationale: Не вводит более узкую сексуально-космологическую интерпретацию до прямой проверки коптского текста.
- issue: Возвращение души
  choice: Пассивное «будет возвращена».
  alternative: Активное «вернётся».
  rationale: Пассив сохраняет подразумеваемое внешнее действие или помощь и перекликается с небесной помощью Одиссею.
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенным регистром. Поэтические цитаты оформлены свободным стихом без искусственной архаизации. Повторы «селение», «стонет», «оставляет» сохранены ради композиционной связи. Проект предварительный: представленное исходное основание — англоязычное публичное свидетельство, а прямая сверка с коптским текстом ещё не выполнена.'
