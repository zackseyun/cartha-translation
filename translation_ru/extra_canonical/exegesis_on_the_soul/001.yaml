translation:
  language: ru
  text: '**Толкование о душе — Падение души**


    [][a] В древности мудрецы дали душе имя женского рода. И действительно, по своей природе она женского пола. У неё даже есть чрево.


    Пока она пребывала наедине с Отцом, она была девой, а по облику — двуполой[b]. Но когда она пала в тело и вошла в эту жизнь, то попала в руки множества разбойников. Жестокие существа передавали её друг другу и [надругались] над ней. Одни брали её силой, а другие соблазняли подарком. Словом, они осквернили её, и она [утратила] свою [] девственность.


    В своём теле она предавалась блуду и отдавалась всем без разбора, считая своим мужем каждого, кого была готова принять в объятия. Отдавшись жестоким и неверным прелюбодеям, чтобы они надругались над ней, она стала глубоко стенать и раскаиваться.


    Но даже отвернувшись от этих прелюбодеев, она бежала к другим, а те принуждали её жить с ними и служить им на их ложе, словно они были её господами. От стыда она уже не смела уйти от них. Они же долго обманывали её, выдавая себя за верных и преданных мужей и делая вид, будто глубоко чтут её. А после всего этого они бросили её и ушли.


    Тогда она стала беспомощной, бедной, покинутой вдовой. В пору бедствия у неё не осталось ни крошки пищи. Всё, что она получила от них, — это скверна соития. А её дети от прелюбодеев немы, слепы, больны и слабоумны.


    Но когда вышний Отец посетил её, взглянул на неё и увидел, как она стонет от боли и стыда, раскаиваясь в блуде, которому предавалась, и как она стала призывать его имя, чтобы он помог ей, — тогда она [застонала] от всего сердца и сказала: «Спаси меня, Отец мой! Взгляни на меня, ибо я дам [Тебе отчёт], ведь я покинула свой дом и [] бежала из девичьих покоев. Вновь возврати меня к Себе».


    Когда он увидит её в таком состоянии, то сочтёт её достойной своей милости, потому что многие страдания постигли её из-за того, что она покинула свой дом.


    [a] Пустые квадратные скобки и слова в квадратных скобках передают отмеченные в используемом свидетельстве повреждения текста или редакторские восстановления.


    [b] Буквально по смыслу свидетельства: имевшей в своём облике оба пола; перевод не устраняет напряжение между женской природой души и её двуполым обликом.'
