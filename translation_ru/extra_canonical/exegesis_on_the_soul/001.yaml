lexical_decisions:
- source_word: soul
  choice: душа
  rationale: Обычное и традиционное русское соответствие; женский грамматический род естественно поддерживает развёрнутую персонификацию текста.
- source_word: androgynous
  choice: двуполой
  rationale: Передаёт наличие признаков обоих полов яснее для широкого читателя, не подменяя древний образ современной терминологией идентичности.
- source_word: robbers
  choice: разбойников
  rationale: Сохраняет насильственный и образный характер обозначения, не сужая его до обычных воров.
- source_word: '[violated]'
  choice: '[надругались]'
  rationale: Сохраняет сексуально-насильственный смысл контекста и редакторские квадратные скобки, указывающие на восстановление.
- source_word: practiced prostitution
  choice: предавалась блуду
  rationale: Естественное для русского религиозно-нравственного повествования выражение, сохраняющее прямой смысл распутства без излишне клинического оттенка.
- source_word: sexual intercourse
  choice: соития
  rationale: Краткое, dignified and semantically explicit rendering of the physical sexual relation in the allegory.
- source_word: weak-minded
  choice: слабоумны
  rationale: Передаёт заявленную умственную немощь как часть ряда физических и душевных недугов, не смешивая её с немотой.
- source_word: exalted Father
  choice: вышний Отец
  rationale: Сохраняет возвышенный религиозный регистр и идею превосходства/высоты без добавления конфессионального титула.
theological_decisions:
- issue: Женская природа души и её двуполый облик
  choice: Сохранены оба утверждения без согласования или объяснительного исправления.
  alternative: Истолковать двуполость как исключительно духовную бесполость либо заменить её нейтральным «целостной».
  rationale: Текст намеренно соединяет женскую природу, девство, чрево и двуполый облик; перевод не должен устранять эту антропологическую напряжённость.
- issue: Падение души «в тело»
  choice: 'Переведено прямо: «пала в тело».'
  alternative: Смягчить до «оказалась в теле» или истолковать как обычное воплощение.
  rationale: Свидетельство употребляет язык падения и связывает телесное вхождение с последующим пленением; богословскую оценку нельзя нейтрализовать.
- issue: Милость Отца и достоинство души
  choice: Сохранена формулировка «сочтёт её достойной своей милости».
  alternative: Передать как безусловное прощение либо как заслуженное спасение.
  rationale: Исходная формулировка удерживает вместе сострадание Отца, покаяние души и её страдания, не определяя систематически отношение благодати и заслуги.
- issue: Временной переход от прошедшего к будущему/настоящему созерцанию
  choice: В последнем абзаце сохранено «Когда он увидит… сочтёт».
  alternative: Унифицировать повествование в прошедшем времени.
  rationale: Смена временного плана присутствует в свидетельстве и может отражать обобщающее или пророческое изложение; её не следует молча устранять.
translation_notes:
  register: 'Современный литературный русский с достоинством раннего религиозно-философского повествования. Синтаксис умеренно возвышенный, но доступный; сексуальная образность передана ясно, без эвфемистического устранения насилия и без натуралистического усиления. Проект предварительный: он основан на предоставленном англоязычном публичном свидетельстве; прямая сверка с коптским текстом Nag Hammadi Codex II,6 всё ещё необходима.'
