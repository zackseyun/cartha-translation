  language: en
  yaml_path: translation/extra_canonical/exegesis_on_the_soul/003.yaml
  text: 'However, when she realizes the trouble she is in, cries out before the Father, and repents, the Father will show mercy to her. He will cause her womb to turn away from the outward kingdom and return inward, making the soul reclaim her good character. For such is not the way of a woman, since the bodily womb is inward, like the other internal organs of the body.


    The womb of the soul, however, surrounds outwardly, like the male’s outward genitals. Therefore, when the womb of the soul turns inward by the will of the Father, it is baptized and immediately purified from the outward pollution which was forced on it, like filthy [garments] soaked [in water and] moved around until the dirt is gone and they are clean. Thus, the purification of the soul is a reclaiming of the renovation of [] her former nature, and a return to herself. That is her baptism.


    Then she will become mad at herself, acting like a woman during labor, writhing and raging in the hour of birth. However, because she is a female, on her own she is unable to conceive a child. From heaven the Father sent her a man—her brother, the firstborn. The bridegroom then went down to the bride. She stopped her earlier prostitution and purified herself from the pollutions of the adulterers. She was even renewed to become a bride. She purified herself in the bridal chamber, filling it with perfume, sitting there awaiting her true bridegroom. She no longer ran around the marketplace, having sex with everyone she wanted. Instead, she kept waiting for him: “When will he arrive?” And she continued to fear him, because she knew not what he looked like. She no more remembered the time she fell from her Father’s house. By the will of the Father, however, [. . .] And she dreamed of him like a woman who loves a man.


    Then, however, the bridegroom, agreeing with the Father’s will, went down to her, into the bridal chamber, which had been prepared, and he adorned the bridal chamber.'
translation:
  language: ru
  text: 'Но когда она осознаёт, в какой беде оказалась, взывает к Отцу и кается, Отец смилуется над ней. Он заставит её чрево отвернуться от внешнего царства и обратиться внутрь, возвращая душе её добрый нрав. Ведь у женщины всё устроено не так: телесное чрево находится внутри, как и другие внутренние органы тела.


    Чрево души, напротив, обращено наружу, подобно наружным половым органам мужчины. Поэтому, когда по воле Отца чрево души обращается внутрь, оно принимает крещение и тотчас очищается от внешней скверны, которой его подвергли, — как грязные [одежды], которые замачивают [в воде и] полощут, пока не сойдёт грязь и они не станут чистыми. Итак, очищение души — это возвращение к обновлению [] её прежней природы и возвращение к самой себе. Это и есть её крещение.


    Тогда она разгневается на саму себя и станет подобна роженице: будет корчиться и метаться в час родов. Но, поскольку она женщина, сама по себе она не может зачать ребёнка. Отец послал ей с небес мужчину — её брата, первенца. Тогда жених сошёл к невесте. Она оставила прежний блуд и очистилась от скверны прелюбодеев. Она обновилась и вновь стала невестой. Она очистилась в брачном чертоге, наполнила его благовониями и сидела там, ожидая своего истинного жениха. Она уже не бегала по рыночной площади, вступая в связь со всяким, с кем хотела. Теперь она лишь ждала его: «Когда же он придёт?» И она всё ещё боялась его, потому что не знала, как он выглядит. Она уже не помнила того времени, когда отпала от дома своего Отца. Но по воле Отца [. . .] И он снился ей, как женщине снится любимый мужчина.


    Тогда жених, исполняя волю Отца, сошёл к ней, в приготовленный брачный чертог, и украсил его.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: womb
  choice: чрево
  rationale: Сохраняет телесную и символическую многозначность образа; «матка» была бы анатомически точнее, но чрезмерно клинической и хуже работала бы применительно к душе.
- source_word: outward kingdom
  choice: внешнее царство
  rationale: Формально сохраняет необычное пространственно-космологическое выражение свидетеля, не истолковывая его как исключительно материальный мир.
- source_word: good character
  choice: добрый нрав
  rationale: Передаёт нравственное состояние души естественным русским выражением, не усиливая его до догматически нагруженной «первозданной праведности».
- source_word: is baptized
  choice: принимает крещение
  rationale: Естественная русская формулировка сохраняет крещальную терминологию и пассивный характер действия.
- source_word: prostitution
  choice: блуд
  rationale: Краткое и стилистически уместное слово для религиозно-нравственной метафоры; оно не сводит образ только к коммерческой проституции.
- source_word: bridal chamber
  choice: брачный чертог
  rationale: Сохраняет торжественный и символический регистр древнего текста; «спальня» была бы слишком бытовой.
- source_word: fell from her Father’s house
  choice: отпала от дома своего Отца
  rationale: «Отпала» удерживает возможный духовный смысл падения, не устраняя пространственный образ ухода из отчего дома.
- source_word: adorned
  choice: украсил
  rationale: Прямо сохраняет действие жениха без попытки конкретизировать неизвестные украшения или обряд.
theological_decisions:
- issue: Природа крещения души
  choice: Сохранено утверждение «Это и есть её крещение» как собственная образная идентификация текста.
  alternative: Истолковать это как прямое учение о водном крещении или как исключительно внутреннее покаяние.
  rationale: Отрывок связывает крещение с внутренним обращением и очищением, но не разрешает однозначно его ритуальный или чисто метафорический статус.
- issue: Личность мужчины, брата и первенца
  choice: Титулы переведены буквально, без добавления имени или христологического пояснения.
  alternative: Прямо назвать его Христом или Спасителем.
  rationale: Контекст может предполагать такую идентификацию, однако данный фрагмент её не формулирует; перевод не должен устранять эту недосказанность.
- issue: Брачная образность
  choice: Сохранены жених, невеста и брачный чертог без конфессиональной интерпретации.
  alternative: Разъяснить их как таинство, церковный обряд или строго аллегорический союз.
  rationale: Текст допускает богословски насыщенное прочтение, но сам фрагмент не определяет его в категориях позднейшей традиции.
- issue: Воля Отца и действие души
  choice: Сохранено напряжение между покаянием души и преобразующим действием Отца.
  alternative: Подчеркнуть исключительно свободное самоисправление души либо исключительно одностороннее действие Отца.
  rationale: 'В тексте присутствуют оба элемента: душа осознаёт, взывает и кается, а Отец милует и обращает её чрево внутрь.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром. Необычная анатомическая и брачная образность сохранена без смягчения, но синтаксис сделан ясным для современного читателя. Примечания [a] и [b] относятся ко всему фрагменту и должны быть присоединены к заголовку или первой подходящей позиции при публикации.
