  footnotes:
  - marker: a
    text: Текст в квадратных скобках восстановлен или не вполне надёжен; возможный смысл повреждённого места остаётся неясным.
    reason: Свидетель отмечает редакционное восстановление повреждённого рукописного текста.
  - marker: b
    text: Восстановление повреждённого текста; точная формулировка и смысл неуверенны.
    reason: Необходимо сохранить обозначенную свидетелем текстуальную неопределённость.
  - marker: c
    text: Пустые скобки обозначают лакуну в рукописи, содержание которой не восстановлено.
    reason: Сохраняет видимый пробел источника без догадки о пропущенном тексте.
  - marker: d
    text: 'Буквально по данному свидетелю: «Я заключу их»; место допускает неясность относительно объекта действия.'
    reason: Русский основной текст передаёт вероятный контекстуальный смысл, а примечание сохраняет необычную форму свидетеля.
  - marker: e
    text: Слова «церквам» восстановлены редакторами в повреждённом месте.
    reason: Маркирует редакционное дополнение, присутствующее в свидетеле.
  - marker: f
    text: Слова «такого блудодеяния» восполняют повреждённый текст по контексту.
    reason: Не выдаёт реконструкцию за бесспорно сохранившееся чтение.
  - marker: g
    text: Слово «испытание» восстановлено предположительно; повреждённое место может допускать иную формулировку.
    reason: Сохраняет неопределённость реконструкции.
  - marker: h
    text: Здесь в рукописной традиции отмечена лакуна; возможное определение слова «блудодеяние» утрачено.
    reason: Пустые скобки исходного свидетеля требуют явного пояснения.
lexical_decisions:
- source_word: prostitution / played the harlot
  choice: блудодеяние / блудодействовать
  rationale: Сохраняет библейскую метафору сексуальной неверности и её духовный смысл; литературнее и достоинственнее, чем «проституция», но не смягчает образ.
- source_word: shepherds
  choice: пастухи
  rationale: Передаёт форму данного свидетеля буквально, не гармонизируя цитату с иными библейскими текстовыми традициями.
- source_word: perceptible realm
  choice: воспринимаемый чувствами мир
  rationale: Ясная современная передача философского противопоставления чувственного и духовного без навязывания специальной школы терминологии.
- source_word: men great of flesh
  choice: могучие плотью
  rationale: Сохраняет необычность и телесный акцент исходной формулы, не сводя её однозначно к анатомическому эвфемизму.
- source_word: having sex with everyone she meets
  choice: вступая в связь с каждым встречным
  rationale: Естественная литературная формулировка, сохраняющая сексуальный смысл и женскую персонификацию души без разговорной грубости.
- source_word: world rulers
  choice: мироправители
  rationale: Традиционный и ёмкий русский эквивалент, сохраняющий возможность понимания как сверхъестественных властей.
theological_decisions:
- issue: Соотношение телесного и духовного блудодеяния
  choice: Сохранено утверждение автора о первичности блудодеяния души и происхождении от него телесного блудодеяния.
  alternative: Переформулировать как общее нравственное предостережение без причинной зависимости.
  rationale: Причинное богословское утверждение явно присутствует в свидетеле и не должно быть сглажено.
- issue: Духовное прочтение 1 Коринфянам 5:9–10
  choice: 'Передано как авторское толкование: «Здесь он говорит в духовном смысле».'
  alternative: Представить цитату как относящуюся исключительно к буквальным нравственным категориям.
  rationale: Текст сам задаёт духовное прочтение; перевод сохраняет его как позицию трактата, не выдавая за бесспорное значение Павлова текста.
- issue: «Сыновья Египта» как символ
  choice: Сохранено авторское отождествление с царством плоти, чувственным миром и земными делами.
  alternative: Гармонизировать с историко-буквальным смыслом Иезекииля.
  rationale: Это центральный экзегетический ход произведения; его нельзя заменять иным толкованием.
- issue: Грамматический род души
  choice: Душа последовательно персонифицирована как женщина.
  alternative: Устранить гендерную образность нейтральными конструкциями.
  rationale: Женская брачная и сексуальная метафорика структурирует весь отрывок и поддерживается женским родом русского слова «душа».
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского назидательного трактата. Библейские цитаты переведены по форме данного коптского свидетельства через предоставленный публично-доступный английский перевод и намеренно не гармонизированы с русскими каноническими переводами. Поскольку прямая сверка с коптским текстом ещё не проведена, проект остаётся предварительным; квадратные скобки и лакуны сохранены и пояснены.
