  text: 'Now, concerning the prostitution of the soul, the Holy Spirit prophesies in many places, saying through the prophet Jeremiah:


    “If a husband divorces his wife, and she goes and takes another man, can she return to him again? Has that woman not completely defiled herself? ‘And you prostituted yourself to many shepherds, and you returned to me,’ said the Lord. ‘Look carefully and see where you prostituted yourself. Were you not sitting in the streets, polluting the land with your prostitution and wickedness? And you took many shepherds as a stumbling block for yourself. You were shameless with everyone. You did not call on me as a relative, or as a father, or as the guardian of your virginity.’” (Jeremiah 3:1–4)


    Again, it is written in the prophet Hosea:


    “Come, bring charges against your mother, for she will not be a wife to me, and I will not be a husband to her. I will remove her prostitution from before me, and I will remove her adultery from between her breasts. I will strip her naked as on the day she was born, and I will make her a wilderness, like a land without water, and I will make her [yearn in childlessness]. I will not have compassion on her children, for they are children of prostitution, because their mother prostituted herself and [acted shamefully toward her children]. [] For she said, ‘I will prostitute myself to my lovers. They gave me my bread and my water, my clothing and my garments, my wine and my oil, and everything I needed.’ Therefore, look: I will close them in so that she cannot run after her lovers. When she seeks them but does not find them, she will say, ‘I will return to my former husband; I was better off then than I am now.’” (Hosea 2:2–7)


    Again, he says in Ezekiel:


    “‘After much wickedness,’ said the Lord, ‘you built a brothel and made a place for your beauty in the streets. You built brothels on every street, squandered your beauty, spread your legs in every alley, and multiplied your acts of prostitution. You prostituted yourself to the sons of Egypt, your neighbors, men great in flesh.’” (Ezekiel 16:23–26)


    What, then, does “the sons of Egypt, men great in flesh” mean, except the kingdom of the flesh, the perceptible realm, and earthly affairs? These defile the soul here, as she obtains from them bread, as well as wine, oil, garments, and other senseless external things surrounding the body—things she believes are necessary for her.


    Concerning this prostitution, however, the Savior’s apostles insisted, “Guard yourselves from it; purify yourselves from it.” This applies not only to bodily prostitution, but especially to the prostitution of the soul. For this reason, the apostles write [to the churches] of God, so that [this kind (of prostitution)] might not happen among us.


    Nevertheless, the most difficult [challenge] concerns the prostitution [] of the soul. Bodily prostitution also originates from it. Therefore Paul, writing to the Corinthians, said, “I wrote to you in the letter, ‘Do not associate with prostitutes’—not at all referring to the prostitutes of this world, or the greedy, or robbers, or idolaters, because then you would need to leave the world.” (1 Corinthians 5:9–10) In this case he is speaking spiritually: “For our struggle is not against flesh and blood,” as he said, “but against the world rulers of this darkness and the spirits of wickedness.” (Ephesians 6:12)


    For as long as the soul continues running everywhere, having sex with everyone she meets and defiling herself, she suffers what she deserves.'
translation:
  language: ru
  text: 'Теперь о блудодеянии души. Святой Дух пророчествует о нём во многих местах, говоря через пророка Иеремию:


    «Если муж разведётся со своей женой, а она уйдёт и станет женой другого мужчины, может ли она снова вернуться к нему? Не осквернилась ли эта женщина окончательно? “Ты блудодействовала со многими пастухами — и вернулась ко Мне”, — сказал Господь. “Посмотри внимательно и увидь, где ты блудодействовала. Не сидела ли ты на улицах, оскверняя землю своим блудодеянием и нечестием? Ты сделала многих пастухов для себя камнем преткновения. Со всеми ты была бесстыдна. Ты не взывала ко Мне ни как к родственнику, ни как к отцу, ни как к хранителю твоей девственности”» (Иеремия 3:1–4).


    И ещё написано у пророка Осии:


    «Идите, судитесь с вашей матерью, потому что она не будет Мне женой, а Я не буду ей мужем. Я удалю её блудодеяние от лица Моего и её прелюбодеяние — от её грудей. Я обнажу её, как в день её рождения, превращу её в пустыню, сделаю её подобной безводной земле и заставлю её [томиться в бездетности][a]. Я не помилую её детей, потому что они — дети блудодеяния: их мать блудодействовала и [поступала постыдно со своими детьми][b]. [][c] Ведь она говорила: “Я пойду блудодействовать с моими любовниками. Они давали мне хлеб и воду, одежду и одеяния, вино и масло — всё, в чём я нуждалась”. Поэтому вот: Я прегражу им путь[d], чтобы она не могла бегать за своими любовниками. Она станет искать их, но не найдёт, и тогда скажет: “Вернусь к моему прежнему мужу, потому что тогда мне было лучше, чем теперь”» (Осия 2:2–7).


    И ещё Он говорит у Иезекииля:


    «После множества злодеяний, — сказал Господь, — ты построила публичный дом и устроила на улицах место для своей красоты. Ты строила публичные дома на каждой улице, растрачивала свою красоту, раздвигала ноги в каждом переулке и умножала своё блудодеяние. Ты блудодействовала с сыновьями Египта, твоими соседями, могучими плотью» (Иезекииль 16:23–26).


    Что же означают «сыновья Египта, могучие плотью», если не царство плоти, воспринимаемый чувствами мир и земные дела? Они оскверняют здесь душу, когда она получает от них хлеб, а также вино, масло, одежду и прочие неразумные внешние вещи, окружающие тело, — то, что она считает для себя необходимым.


    Об этом блудодеянии апостолы Спасителя настойчиво говорили: «Берегитесь его; очиститесь от него». Это относится не только к телесному блудодеянию, но прежде всего к блудодеянию души. Потому апостолы и пишут [церквам][e] Божьим, чтобы [такого блудодеяния][f] не было среди нас.


    Однако самое трудное [испытание][g] связано с блудодеянием [][h] души. От него происходит и телесное блудодеяние. Поэтому Павел писал коринфянам: «Я написал вам в послании: “Не общайтесь с блудниками”, — не имея в виду вообще блудников этого мира, или корыстолюбцев, или грабителей, или идолопоклонников, иначе вам пришлось бы уйти из мира» (1 Коринфянам 5:9–10). Здесь он говорит в духовном смысле: «Ведь наша борьба не против плоти и крови, — как он сказал, — но против мироправителей этой тьмы и духов зла» (Эфесянам 6:12).


    Пока душа продолжает всюду метаться, вступая в связь с каждым встречным и оскверняя себя, она терпит то, чего заслуживает.'
