  revised_text: 'Теперь о блудодеянии души. Святой Дух пророчествует о нём во многих местах, говоря через пророка Иеремию:


    «Если муж разведётся со своей женой, а она уйдёт к другому мужчине, может ли она снова вернуться к нему? Не осквернилась ли эта женщина окончательно? „Ты блудодействовала со многими пастухами — и вернулась ко Мне“, — сказал Господь. „Посмотри внимательно и увидь, где ты блудодействовала. Не сидела ли ты на улицах, оскверняя землю своим блудодеянием и нечестием? Ты сделала многих пастухов для себя камнем преткновения. Со всеми ты была бесстыдна. Ты не взывала ко Мне ни как к родственнику, ни как к отцу, ни как к хранителю твоей девственности“» (Иеремия 3:1–4).


