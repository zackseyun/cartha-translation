translation:
  language: ru
  text: 'Израиль, несомненно, не был бы вначале удостоен Божьего посещения и избавлен из земли Египетской, из дома рабства, если бы не взывал к Богу со стоном и не оплакивал гнёт своего рабства.


    И ещё в Псалмах написано:


    «Я крайне изнемог от стонов моих;

    каждую ночь омываю слезами ложе моё,

    орошаю ими постель мою.

    Состарился я среди всех врагов моих.

    Отступите от меня, все творящие зло,

    ибо вот, Господь услышал голос плача моего,

    и Господь принял молитву мою» (Псалом 6:7–10[a]).


    Если мы покаемся, Бог непременно услышит нас — Он долготерпелив и многомилостив. Ему слава во веки веков. Аминь!


    «Толкование о душе»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Нумерация стихов следует русской традиции; в представленном английском свидетельстве указано: Псалом 6:6–9.'
    reason: Предупреждает расхождение нумерации стихов между традициями и сохраняет проверяемость цитаты.
lexical_decisions:
- source_word: visited
  choice: удостоен Божьего посещения
  rationale: Сохраняет библейский смысл спасительного Божьего вмешательства, не сводя выражение к обычному «посещению».
- source_word: house of bondage
  choice: дом рабства
  rationale: Сохранён устойчивый библейский образ и связь с исходом из Египта.
- source_word: groaned ... and moaned
  choice: взывал к Богу со стоном и ... оплакивал
  rationale: Передаёт два близких, но различимых выражения страдания без неестественного буквального повтора.
- source_word: tyranny
  choice: гнёт
  rationale: Естественно по-русски передаёт жестокое угнетение в условиях рабства.
- source_word: patient and richly merciful
  choice: долготерпелив и многомилостив
  rationale: Достоинный библейский регистр, точно сохраняющий обе характеристики Бога.
- source_word: The Exegesis on the Soul
  choice: Толкование о душе
  rationale: Передаёт название трактата в естественной для русского научно-библейского употребления форме.
theological_decisions:
- issue: Смысл Божьего «посещения» Израиля
  choice: удостоен Божьего посещения и избавлен
  alternative: Бог не посетил бы Израиль, чтобы избавить его
  rationale: Выбранная формулировка сохраняет богословски насыщенный библейский термин и одновременно ясно показывает, что речь идёт о спасительном вмешательстве.
- issue: Условная связь покаяния и Божьего ответа
  choice: Если мы покаемся, Бог непременно услышит нас
  alternative: Когда мы каемся, Бог слушает нас
  rationale: Сохранены условность и уверенность исходного свидетельства без добавления конфессиональных уточнений.
- issue: Заключительное славословие
  choice: Ему слава во веки веков
  alternative: Которому слава во веки веков
  rationale: Современная русская фраза ясно относит славу к Богу и сохраняет доксологическую силу оригинала.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским регистром. Перевод предварительный: выполнен по предоставленному англоязычному свидетельству, поскольку непосредственная сверка с коптским текстом ещё не проведена. Навигация сайта, контактные данные и рекламное уведомление исключены как материал, не относящийся к тексту произведения.'
