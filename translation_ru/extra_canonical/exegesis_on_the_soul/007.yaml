review_pass:
  verdict: revise
  source_fidelity: 'Предварительная проверка возможна только по предоставленному английскому свидетельству: коптский текст в задании отсутствует, поэтому прямую сверку с ним выполнить нельзя. Черновик в целом передаёт заключение, но цитата из Псалма была незаметно приведена к синодальному тексту и тем самым отходит от данного свидетельства (в частности, «крайне изнемог», «омываю/орошаю», «голос плача»).'
  naturalness: Регистр в целом удачен, однако «удостоен Божьего посещения» добавляет оценочный оттенок, которого в свидетельстве нет, и синтаксически ослабляет связь посещения с избавлением. «Стенал перед Богом» и «горевал о тирании своего рабства» естественны и сохраняют два глагола исходного текста.
  terminology: «Дом рабства», «Господь», «долготерпелив и многомилостив» и «Толкование о душе» приемлемы. «Божье посещение» следует передавать без «удостоен», сохраняя традиционный библейский термин и не внося дополнительного смысла.
  issues:
  - severity: medium
    issue: Цитата из Псалма приведена по иной русской библейской редакции, а не переведена из данного английского свидетельства.
    rationale: 'Заданный текст говорит: «I was greatly wearied», «I will flood my bed and my couch», «the cry of my weeping». Черновик заменяет эти формулировки синодальными соответствиями, что нарушает прослеживаемость к свидетельству.'
  - severity: low
    issue: «Удостоен Божьего посещения» добавляет значение достоинства/оказанной чести.
    rationale: В witness имеется лишь passive «would not have been visited»; добавочный оттенок не требуется для передачи спасительного посещения.
  - severity: low
    issue: Ссылка на Псалом требует ясного указания на различие нумерации.
    rationale: В русском тексте уместна традиционная нумерация 6:7–10, но предоставленное свидетельство указывает 6:6–9; сноска должна прямо фиксировать это, а маркер стоять у ссылки.
  revised_text: 'Вначале Израиль, несомненно, не был бы посещён, чтобы быть избавленным из земли Египетской, из дома рабства, если бы не стенал перед Богом и не горевал о тирании своего рабства.


    И ещё в Псалмах написано:


    «Я весьма изнурён моими стонами.


    Каждую ночь я заливаю слезами моё ложе и мою постель.


    Я состарился среди всех моих врагов.


    Отойдите от меня, все делающие зло,


    ибо вот, Господь услышал вопль моего плача,


    и Господь принял мою молитву» (Псалом 6:7–10[a]).


    Если мы покаемся, Бог непременно услышит нас — Он долготерпелив и многомилостив. Ему слава во веки веков. Аминь!


    «Толкование о душе»'
  revised_footnotes:
  - marker: a
    text: 'Нумерация стихов приведена по русской традиции; в предоставленном английском свидетельстве указано: Псалом 6:6–9.'
    reason: Сохраняет проверяемую связь с английским свидетельством и поясняет различие традиций нумерации.
  revision_rationale: Исправлен перевод так, чтобы он следовал именно предоставленному английскому тексту, а не подменял его русским синодальным переложением Псалма. Убрано добавочное «удостоен», сохранены библейские выражения «посещён» и «дом рабства», а расхождение в нумерации стихов оформлено сноской. Редакция остаётся предварительной до непосредственной сверки с коптским источником.
