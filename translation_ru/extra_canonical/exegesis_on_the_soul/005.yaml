base_translation:
  language: en
  yaml_path: translation/extra_canonical/exegesis_on_the_soul/005.yaml
  text: 'And so it is right to pray to the Father and call on him with our whole soul, sighing not outwardly with our lips, but with the inward spirit that comes from the depths. We must repent of the former life we lived, confess our sins, recognize the empty lie in which we lived and our hollow zealotry, wail because of the darkness and the wave that engulfed us, and weep for ourselves so that he may have compassion on us, hating ourselves because of what we are now.


    The Savior said again:


    “Blessed are those who mourn, for they will be shown pity.

    Blessed are those who are hungry, for they will be filled.” (Matthew 5:4,6; Luke 6:21)


    He also said, “If someone does not hate his soul, he cannot follow me.” (Luke 14:26)


    This is because repentance is the beginning of salvation. And so, “Before Christ appeared, John came, preaching the baptism of repentance.” (Acts 13:24)


    Repentance takes place in pain and sorrow. The Father, however, is good and loves humanity. He listens to the soul that calls on him and sends it the light of salvation. Therefore, through the Spirit he said to the prophet:


    Say to the children of my people:

    “[If] your sins reach [from earth to] heaven,

    and if they are [red] as scarlet,

    and blacker than sackcloth,

    [and if] [] you return to me with your whole soul,

    and say to me, ‘My Father!’

    I will listen to you as a holy people.” (1 Clement 8:3)


    Yet another passage says, “Thus says the Lord, the Holy One of Israel: ‘If you return and weep, then you will be saved, and you will know where you were when you put your hope in what is empty.’” (Isaiah 30:15)


    And in another passage he said:


    Jerusalem wept greatly, saying, “Have pity on me.” He will be gracious to you at the sound of your weeping. When he saw, he answered you. The Lord will give you bread of adversity and water of affliction. From now on, those who lie to you will no longer approach you. Your eyes will see those who lie to you. (Isaiah 30:19-20)


    And so it is right to pray to God both night and day, stretching out our hands to him like those sailing in the middle of the sea. They pray to God with their whole heart and without duplicity, because those who pray with duplicity only lie to themselves. Indeed, so that he may know who deserves salvation, God examines the inward parts and searches the depths of the heart. For no one who is still in love with the place of lies deserves salvation.'
translation:
  language: ru
  text: 'Поэтому следует молиться Отцу и взывать к Нему всей душой, воздыхая не внешне, одними устами, а внутренним духом, исходящим из глубины. Следует каяться в прежней жизни, которую мы вели, исповедовать свои грехи, осознать пустую ложь, в которой мы жили, и тщетность нашего рвения; рыдать из-за тьмы и волны, поглотившей нас, и оплакивать самих себя, чтобы Он сжалился над нами, ненавидя себя за то, чем мы стали.


    Спаситель также сказал:


    «Блаженны скорбящие, потому что их пожалеют.

    Блаженны голодные, потому что они насытятся» (Матфея 5:4, 6; Луки 6:21).


    Ещё Он сказал: «Кто не ненавидит своей души, тот не может следовать за Мной»[a] (Луки 14:26).


    Ведь начало спасения — покаяние. Поэтому «прежде явления Христа пришёл Иоанн, проповедуя крещение покаяния» (Деяния 13:24).


    Покаяние совершается в боли и скорби. Но Отец благ и любит людей: Он слышит душу, которая взывает к Нему, и посылает ей свет спасения. Поэтому через Духа Он сказал пророку:


    Скажи детям Моего народа:


    «[Если] ваши грехи достигнут [от земли до] неба,

    если они будут [красны], как багрянец,

    и чернее власяницы,

    [и если] […] вы обратитесь ко Мне всей душой

    и скажете Мне: „Отец мой!“ —

    Я услышу вас как святой народ»[b] (1 Климента 8:3).


    И ещё сказано: «Так говорит Господь, Святой Израиля: „Если вы обратитесь и восплачете, то будете спасены и узнаете, где были, когда надеялись на пустое“»[c] (Исаия 30:15).


    И в другом месте Он сказал:


    Иерусалим горько плакал, говоря: «Сжалься надо мной». Он помилует тебя, услышав твой плач. Увидев, Он ответил тебе. Господь даст тебе хлеб бедствия и воду скорби. Отныне обманывающие тебя больше не приблизятся к тебе; твои глаза увидят обманывающих тебя[d] (Исаия 30:19–20).


    Поэтому следует молиться Богу и ночью, и днём, простирая к Нему руки, подобно плывущим посреди моря. Они молятся Богу всем сердцем, без двоедушия, потому что молящиеся двоедушно лишь обманывают самих себя. Ведь Бог испытывает внутренность и исследует глубины сердца, чтобы узнать, кто достоин спасения. Никто, кто всё ещё любит место лжи, не достоин спасения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не ненавидит своей души». В Луки 14:26 в иных традициях выражение может передаваться словом «жизнь»; здесь сохранена лексика самого трактата.'
    reason: Сохранение значимой лексической и богословской неоднозначности.
  - marker: b
    text: Квадратные скобки и многоточие отмечают восстановленный или утраченный текст в доступном свидетельстве. Цитата приведена в трактате со ссылкой на 1 Климента 8:3 и объединяет библейские выражения.
    reason: Обозначение состояния текста и характера составной цитаты.
  - marker: c
    text: Форма цитаты заметно отличается от привычного текста Исаии 30:15; переведена именно та формулировка, которую приводит трактат.
    reason: Предотвращение ошибочного впечатления, будто цитата нормализована по стандартному библейскому тексту.
  - marker: d
    text: Этот отрывок передаёт Исаию 30:19–20 в необычной форме. Связи местоимений и субъект глагола «увидев» в доступном свидетельстве не вполне ясны.
    reason: Сохранение подлинной текстовой неясности без молчаливого исправления.
lexical_decisions:
- source_word: soul
  choice: душа
  rationale: Сохраняет ключевую лексику и связь с названием трактата; в цитате о ненависти к душе не заменено на «жизнь», чтобы не снимать присущую тексту напряжённость.
- source_word: repentance
  choice: покаяние
  rationale: Устоявшийся и понятный термин, передающий внутреннее обращение и перемену жизни.
- source_word: hollow zealotry
  choice: тщетность нашего рвения
  rationale: Естественная русская передача пустого, лишённого истинного содержания усердия без привнесения позднейшего политического оттенка слова «фанатизм».
- source_word: duplicity
  choice: двоедушие / двоедушно
  rationale: Передаёт раздвоенность внутреннего намерения и поддерживает тематику души; понятнее в контексте молитвы, чем буквальная «двойственность».
- source_word: place of lies
  choice: место лжи
  rationale: Сохранён необычный пространственный образ источника без толкования того, что именно он обозначает.
- source_word: inward parts
  choice: внутренность
  rationale: Сохраняет телесно-духовный библейский образ исследования сокровенного человека.
theological_decisions:
- issue: «Ненавидеть свою душу»
  choice: Сохранить буквальную формулировку
  alternative: «Ненавидеть свою жизнь» или «отречься от себя»
  rationale: Трактат тематически сосредоточен на душе, а буквальная формулировка сохраняет богословскую напряжённость и не подменяет её толкованием.
- issue: Кто «достоин спасения»
  choice: Сохранить язык достоинства
  alternative: Перефразировать как «кого спасти»
  rationale: Источник прямо связывает Божье исследование сердца с достоинством спасения; смягчение внесло бы конфессиональное истолкование.
- issue: Библейские цитаты с нестандартным текстом
  choice: Перевести представленную в трактате форму цитат
  alternative: Заменить формулировками канонического русского перевода
  rationale: Цель — передать текст трактата и его цитатную традицию, включая расхождения и составные аллюзии.
- issue: Местоименные переходы в цитате из Исаии 30:19–20
  choice: Сохранить переход от Иерусалима к обращению на «ты» и неясное «увидев»
  alternative: Унифицировать лицо и явно назвать субъект
  rationale: Свидетель допускает синтаксическую и текстуальную неясность; её не следует устранять догадкой.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис умеренно упрощён для ясности, но повторения, параллелизм, резкие образы и напряжённые формулировки сохранены. Заглавные местоимения при обращении к Богу применены последовательно как издательская норма русского религиозного регистра. Проект остаётся предварительным, поскольку прямое сопоставление с коптским текстом Nag Hammadi Codex II,6 ещё не выполнено.
