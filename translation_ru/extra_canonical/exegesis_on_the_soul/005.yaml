review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод точно следует предоставленному английскому свидетельству; прямое сопоставление с коптским текстом пока невозможно по условиям задания. Существенное отклонение — «тщетность нашего рвения» вместо «пустого/бесплодного усердия»: источник называет само усердие пустым, а не утверждает лишь его безрезультатность. В первом абзаце деепричастие «ненавидя себя» синтаксически может относиться к Богу, хотя по источнику оно продолжает ряд действий молящегося. Также «плывущим» несколько сужает образ людей, находящихся/плывущих посреди моря.'
  naturalness: Современный литературный русский в целом естественен и выдержан. «Двоедушно» понятно в возвышенном религиозном регистре, но «без двоедушия» тяжеловесно; «без раздвоения в сердце» яснее, однако исходный термин допустимо сохранить. Для устранения синтаксической двусмысленности и большей плавности переработан первый абзац.
  terminology: «Душа», «покаяние», «крещение покаяния», «внутренность», «место лжи» сохранены удачно. Необычные формы цитат и лакуны не нормализованы. Сноска к Лк 14:26 полезна, но слова «буквально» избыточны, поскольку основной текст уже буквально передаёт supplied witness; сноска сокращена и уточнена.
  issues:
  - severity: medium
    issue: Синтаксическая неоднозначность «..., чтобы Он сжалился над нами, ненавидя себя...»
    rationale: Деепричастие после упоминания Бога может грамматически быть прочитано как относящееся к «Он», тогда как ненависть к себе относится к кающемуся субъекту. Нужна явная координация действий первого лица.
  - severity: medium
    issue: «Тщетность нашего рвения»
    rationale: 'English witness: «the hollow zealotry» — пустое, полое усердие/рвение. «Тщетность» смещает смысл к результативности, а не к внутренней пустоте этого усердия.'
  - severity: low
    issue: «Подобно плывущим посреди моря»
    rationale: Witness говорит о тех, кто «sail in the middle of the sea»; «подобно тем, кто плывёт посреди моря» естественнее и не превращает группу в субстантивированное определение.
