status: needs_human_review
review_pass:
  verdict: revise
  source_fidelity: 'Проект в целом точно следует предоставленному английскому свидетельству и последовательно сохраняет его скобочные восстановления и лакуны через примечания. Нужна небольшая правка в нескольких местах: явно передать рефлексивность «soul regenerates herself», точнее воспроизвести образ «turning away their faces», а также не подменять «formulas» более узким «изречениями».'
  naturalness: Регистр в основном современный литературный и уместно возвышенный. Формулировки «стыд вдовства», «возродить себя» и «повторением формул» звучат естественнее и ближе к образному строю свидетельства, чем соответствующие места черновика.
  terminology: Сохранены значимые различия между «плотью» в библейской цитате и «одной жизнью» в авторском утверждении, а также между «господином» и «Господом». «Праведные дети», «божественная природа», «благодать [Духа]» и «небесная реальность» адекватны. Библейские ссылки на Псалмы с русской нумерацией и пояснениями корректны.
  issues:
  - severity: medium
    issue: «Душе надлежит возродиться» не передаёт рефлексивное «the soul regenerates herself».
    rationale: 'Свидетель прямо приписывает душе действие над самой собой; следует сохранить эту необычную, но важную формулировку: «Душе подобает возродить себя».'
  - severity: low
    issue: «[отворачиваются] друг от друга» ослабляет конкретный образ «[turning away their faces]».
    rationale: 'Нужно сохранить упоминание лиц: «[отворачивая лица] друг от друга».'
  - severity: medium
    issue: «Не повторением изречений» неэквивалентно «not by repeating formulas».
    rationale: «Изречения» означает высказывания, тогда как свидетель говорит о повторяемых формулах; нейтральное «повторение формул» точнее и не навязывает конкретную религиозную практику.
  - severity: low
    issue: «Прежний позор вдовства» несколько абстрагирует «her earlier shame as a widow».
    rationale: Формулировка «прежний стыд, который она испытывала как вдова» точнее сохраняет личный образ свидетельства.
  revised_text: 'Поскольку этот брак не похож на плотский брак, те, кто вступает друг с другом в телесную связь, удовлетворяются такой связью. Затем они, словно сбрасывая тяжесть, оставляют позади тяготы телесной похоти и [отворачивая лица] друг от друга. Но этот брак [иной]: соединившись [друг с другом], они становятся одной жизнью.


    [a] Поэтому пророк сказал о первом мужчине и первой женщине: «И станут они одной плотью» (Бытие 2:24).


    Ведь прежде они были соединены друг с другом, когда пребывали у Отца, — до того, как женщина ввела в заблуждение мужчину, своего брата. Этот брак вновь соединил их, и душа соединилась со своей истинной любовью, со своим изначальным господином, как написано: «Господин женщины — её муж» (Бытие 3:16; Ефесянам 5:23).


    Тогда мало-помалу она узнала его и снова возрадовалась; она плакала перед ним, вспоминая прежний стыд, который испытывала как вдова. И она украсила себя ещё прекраснее, чтобы ему было отрадно пребывать с ней.


    И пророк сказал в Псалмах:


    «Слушай, дочь, и смотри, и приклони ухо;


    забудь свой народ и дом своего отца,


    и царь возжелает твоей красоты,


    ибо он — твой господин» (Псалом 44:11–12).[b]


    Ибо он велит ей отвратить взор от своего народа и от толпы её любовников, среди которых она некогда жила, посвятить себя одному лишь царю, своему истинному Господу, и забыть дом земного отца, где её положение было ужасным, а вместо этого вспомнить своего Отца, Который на небесах.


    Поэтому и Аврааму было сказано: «Уйди из своей земли, от своей родни и из дома своего отца» (Бытие 12:1).


    Так душа, вновь [украсив] себя своим великолепием, [пожелала] поклониться возлюбленному, и [он также] полюбил её. Соединившись с ним, она приняла от него [c] семя животворящего духа. От этого семени она рождает праведных детей и растит их, ибо в этом — великое и совершенное чудо рождения. Так этот брак совершается по воле Отца.


    Душе подобает возродить себя и снова стать такой, какой она была прежде. Тогда душа движется по собственной воле и принимает от Отца божественную природу для своего обновления, чтобы вернуться на то место, где была вначале:


    Это — воскресение из мёртвых.


    Это — искупление из рабства.


    Это — восходящее странствие на небо.


    Это — путь восхождения к Отцу.


    Поэтому пророк сказал:


    «Благослови Господа, душа моя,


    и всё, что внутри меня, — Его святое имя.


    Благослови Бога, душа моя,


    Который прощает все твои беззакония,


    исцеляет все твои болезни,


    избавляет твою жизнь от смерти,


    венчает тебя милостью,


    насыщает твоё желание благами.


    Обновится, словно у орла, твоя юность» (Псалом 102:1–5).[d]


    Снова став юной, она взойдёт, восхваляя Отца и своего брата, который спас её. Так, родившись свыше, душа спасается. И совершается это не повторением формул, не учёностью и не знанием, почерпнутым из книг, но благодатью [Духа]; это дар сострадательного [Бога]. Таков путь этой небесной реальности.


    Поэтому Спаситель восклицает: [e] «Никто не может прийти ко Мне, если Мой Отец не привлечёт его и не приведёт ко Мне; и Я воскрешу его в последний день» (Иоанн 6:44).'
