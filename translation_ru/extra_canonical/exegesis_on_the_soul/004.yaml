  - marker: a
    text: Перед этим предложением в рукописном свидетельстве отмечена лакуна; утраченный текст не восстанавливается.
    reason: Сохранить сигнал повреждения, представленный пустыми скобками в исходном свидетельстве.
  - marker: b
    text: Нумерация соответствует русской традиции Псалтири; в еврейской нумерации это Псалом 45:10–11.
    reason: Сделать ссылку понятной русскому читателю, не скрывая различия систем нумерации.
  - marker: c
    text: В этом месте рукописного свидетельства имеется лакуна; возможное утраченное слово не восстанавливается.
    reason: Пустые скобки источника нельзя естественно оставить внутри русского предложения без пояснения.
  - marker: d
    text: Нумерация соответствует русской традиции Псалтири; в еврейской нумерации это Псалом 103:1–5.
    reason: Уточнить расхождение традиционных систем нумерации псалмов.
  - marker: e
    text: Перед цитатой в рукописном свидетельстве отмечена лакуна; её содержание неизвестно.
    reason: Сохранить текстологическую неопределённость пустых скобок исходного свидетельства.
lexical_decisions:
- source_word: carnal marriage / bodily lust
  choice: плотский брак / телесная похоть
  rationale: Сохранены телесность образа и противопоставление духовному браку; современная формулировка остаётся достоинной и ясной.
- source_word: one life
  choice: одна жизнь
  rationale: Не заменено библейским выражением «одна плоть», поскольку автор намеренно переходит от цитаты о плоти к утверждению о единой жизни.
- source_word: master / lord
  choice: господин / Господь
  rationale: Строчная буква передаёт супружеское и властное значение, прописная — явное обозначение небесного Господа; смысловые уровни не смешиваются.
- source_word: upright children
  choice: праведные дети
  rationale: Передаёт нравственно-религиозный смысл, не сводя его к физической «прямоте».
- source_word: regenerates / being born again
  choice: возродиться / родившись свыше
  rationale: Первое выражение подчёркивает восстановление прежнего состояния, второе сохраняет религиозный образ нового рождения.
- source_word: formulas
  choice: изречения
  rationale: В контексте вероятнее имеются в виду словесные формулы или речения; выбран нейтральный вариант без привнесения конкретной обрядовой практики.
- source_word: heavenly reality
  choice: небесная реальность
  rationale: Сохранена онтологическая широта выражения без сведения его к конкретному «царству» или таинству.
theological_decisions:
- issue: Отношения души, женщины, мужчины, брата и Спасителя
  choice: Сохранить сменяющиеся и частично накладывающиеся образы без отождествляющих пояснений
  alternative: Явно определить мужчину/брата как Христа или небесного супруга
  rationale: Свидетель оставляет образную систему напряжённой; конфессиональное или систематическое разрешение было бы привнесением.
- issue: «Божественная природа» от Отца
  choice: Перевести буквально как «божественную природу»
  alternative: Смягчить до «божественной силы» или «благодати»
  rationale: Буквальная формулировка важна для антропологии текста и не должна богословски нормализоваться.
- issue: Участие воли души и благодати
  choice: Сохранить и «по собственной воле», и спасение «благодатью»
  alternative: Согласовать формулировки в пользу одной стороны
  rationale: Текст удерживает человеческое воление и божественный дар вместе; напряжение следует сохранить.
- issue: Цитата Иоанна 6:44
  choice: Сохранить расширенную форму свидетеля «привлечёт… и приведёт»
  alternative: Гармонизировать со стандартным библейским текстом, оставив только «привлечёт»
  rationale: Перевод следует цитате в данном произведении, а не исправляет её по каноническому тексту.
- issue: Пол души в русском языке
  choice: Использовать женский род
  alternative: Избегать местоимений или использовать грамматически нейтральные перестройки
  rationale: Русское «душа» женского рода и брачно-женская метафора оригинального свидетельства требует последовательного женского образа.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского назидательного трактата. Библейские цитаты переданы в близком к традиционному, но не архаизированном регистре; цитаты не гармонизированы полностью с каким-либо русским конфессиональным переводом. Квадратные скобки сохраняют предложенные восстановления, а пустые лакуны вынесены в маркированные примечания. Поскольку прямое сверение с коптским текстом ещё не проведено, проект основан на указанном публичном английском свидетельстве и остаётся предварительным.
