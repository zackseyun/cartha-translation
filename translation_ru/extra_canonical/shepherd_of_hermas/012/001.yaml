base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/001.yaml
  text: Answering, I say to her, "Lady, this matter is great and marvelous. And the six young men who are building—who are they, Lady?"
translation:
  language: ru
  text: 'Я ответил ей: «Госпожа, это дело велико и удивительно. А те шестеро юношей, которые строят, — кто они, госпожа?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀποκριθεὶς λέγω αὐτῇ
  choice: Я ответил ей
  rationale: Греческое причастие с глаголом речи передано естественной русской повествовательной формой; историческое настоящее λέγω в контексте переведено прошедшим временем.
- source_word: Κυρία
  choice: Госпожа
  rationale: Сохраняет уважительное обращение к женскому персонажу без внесения несвойственного исходному тексту религиозного титула.
- source_word: μεγάλως καὶ θαυμαστῶς ἔχει τὸ πρᾶγμα τοῦτο
  choice: это дело велико и удивительно
  rationale: Идиоматически передаёт оценочную конструкцию ἔχει при сохранении обоих определений — величия и удивительности.
- source_word: οἱ νεανίσκοι οἱ ἓξ οἱ οἰκοδομοῦντες
  choice: те шестеро юношей, которые строят
  rationale: Передаёт определённость группы, число шесть и продолжающееся действие причастия οἰκοδομοῦντες.
