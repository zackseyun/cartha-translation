base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/002.yaml
  text: '"These are the holy angels of God, the first-created, to whom the Lord entrusted all his creation, to increase and to build and to rule over all creation. By these, therefore, the building of the tower will be brought to completion."'
translation:
  language: ru
  text: «Это святые ангелы Божьи, сотворённые первыми. Им Господь вверил всё Своё творение, чтобы они взращивали и созидали его и владычествовали над всем творением. Поэтому через них строительство башни будет доведено до конца».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ πρῶτοι κτισθέντες
  choice: сотворённые первыми
  rationale: Передаёт временное первенство этих ангелов в сотворении, не добавляя отсутствующего в греческом утверждения об их природе.
- source_word: παρέδωκεν
  choice: вверил
  rationale: Естественно выражает поручение и передачу ответственности, подразумеваемые глаголом.
- source_word: αὔξειν
  choice: взращивали
  rationale: Сохраняет значение роста и содействия росту; по-русски подходит к творению лучше, чем более узкое «умножали».
- source_word: οἰκοδομεῖν
  choice: созидали
  rationale: Сохраняет строительный образ, продолжающий тему башни, и одновременно допускает более широкое значение устроения творения.
- source_word: δεσπόζειν
  choice: владычествовали
  rationale: Передаёт сильное значение господства и власти, не ослабляя его до простого управления.
- source_word: διὰ τούτων
  choice: через них
  rationale: Сохраняет инструментальное значение διά и не уточняет сверх текста, каким именно образом ангелы завершают строительство.
- source_word: τελεσθήσεται
  choice: будет доведено до конца
  rationale: Передаёт будущее завершение процесса и естественно сочетается со «строительством».
theological_decisions:
- issue: Статус шести ангелов как «первых сотворённых»
  choice: сотворённые первыми
  alternative: первосотворённые
  rationale: Выбранная формулировка ясно передаёт последовательность сотворения и не превращает выражение в специальный догматический термин.
- issue: Власть ангелов над творением
  choice: Им Господь вверил… владычествовать над всем творением
  alternative: Господь передал им… господство над всем творением
  rationale: Сохранено прямое утверждение источника их полномочий — поручения Господа; не добавляется идея независимой или абсолютной власти.
translation_notes:
  register: Современный литературный русский с торжественным, но доступным звучанием. Синтаксис разделён на несколько фраз для ясности; повтор «творение» сохранён вслед за греческим текстом, поскольку он подчёркивает объём поручения. Местоимение «Своё» написано с прописной буквы согласно распространённой русской религиозной издательской практике.
