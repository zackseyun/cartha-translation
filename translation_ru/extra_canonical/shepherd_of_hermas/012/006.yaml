base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/006.yaml
  text: Answering me, she says, "It is not because you are more worthy than all that it is revealed to you; for there are others before you and better than you, to whom it was fitting that these visions should be revealed. But in order that the name of God might be glorified, it has been revealed to you and will be revealed, for the sake of the double-minded—those who reason within their hearts whether these things are so or not. Tell them that all these things are true, and nothing is outside the truth; rather, all are strong and sure and well-founded."
translation:
  language: ru
  text: 'Она ответила мне: «Не потому тебе это открыто, что ты достойнее всех: есть другие, которые были прежде тебя и лучше тебя и которым надлежало открыть эти видения. Но чтобы прославилось имя Бога, тебе это было открыто и ещё будет открыто ради сомневающихся — тех, кто рассуждает в своих сердцах, действительно ли всё это так или нет. Скажи им, что всё это истинно и ничто не выходит за пределы истины; напротив, всё это прочно, достоверно и имеет твёрдое основание».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψύχους
  choice: сомневающихся
  rationale: Буквально слово означает «двоедушных», но в данном контексте оно поясняется внутренним колебанием относительно истинности видений; «сомневающихся» естественно и точно передаёт смысл.
- source_word: διαλογιζομένους
  choice: рассуждает
  rationale: Передаёт внутреннее обдумывание и сомнение без отрицательного оттенка «строить козни», неуместного здесь.
- source_word: ἰσχυρὰ καὶ βέβαια καὶ τεθεμελιωμένα
  choice: прочно, достоверно и имеет твёрдое основание
  rationale: Сохраняет трёхчастное усиление оригинала и строительную метафору последнего причастия.
- source_word: ἔξωθέν ... τῆς ἀληθείας
  choice: не выходит за пределы истины
  rationale: Близко воспроизводит пространственный образ греческого выражения и не сводит его просто к «не ложно».
theological_decisions:
- issue: Цель откровения выражена конструкцией ἵνα с аористом сослагательного наклонения
  choice: «чтобы прославилось имя Бога»
  alternative: «для прославления имени Бога»
  rationale: Личная глагольная конструкция яснее сохраняет целевое значение и форму исходного текста.
- issue: Будущее откровение ἀποκαλυφθήσεται
  choice: «ещё будет открыто»
  alternative: «будет открываться»
  rationale: Сохранён будущий пассив без навязывания длительного или многократного характера действия.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Обращение и синтаксис сделаны понятными обычному читателю; сохранены риторическое противопоставление, повтор «открыто» и трёхчастное завершающее утверждение.
