base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/012/004.yaml
  text: '"They too are holy angels of God; but these six are superior to them. The building of the tower, then, will be brought to completion, and all together will rejoice around the tower and will glorify God, because the building of the tower has been completed."'
translation:
  language: ru
  text: «Они тоже святые ангелы Божьи, но эти шестеро превосходят их. Итак, строительство башни будет завершено, и все вместе будут радоваться вокруг башни и прославлять Бога за то, что строительство башни завершено».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ αὐτοὶ ἅγιοι ἄγγελοι τοῦ Θεοῦ
  choice: Они тоже святые ангелы Божьи
  rationale: Καὶ αὐτοί имеет присоединительное значение «они тоже»; традиционное «Божьи» сохраняет ясность и звучит естественно в современной русской речи.
- source_word: ὑπερέχοντες αὐτούς
  choice: превосходят их
  rationale: Передаёт сравнительное значение ὑπερέχω без уточнения, в чём именно состоит превосходство, сохраняя неоднозначность оригинала.
- source_word: συντελεσθήσεται ... ἡ οἰκοδομή
  choice: строительство ... будет завершено
  rationale: Пассивная конструкция и значение полного окончания действия сохранены; «строительство» естественно передаёт процесс возведения.
- source_word: πάντες ὁμοῦ εὐφρανθήσονται
  choice: все вместе будут радоваться
  rationale: Сохраняет всеобщность πάντες, совместность ὁμοῦ и будущее значение глагола.
- source_word: δοξάσουσιν τὸν Θεόν
  choice: прославлять Бога
  rationale: Обычный и точный русский эквивалент δοξάζω в религиозном контексте.
theological_decisions:
- issue: Статус шести ангелов относительно остальных
  choice: «эти шестеро превосходят их»
  alternative: «эти шестеро стоят выше них»
  rationale: Выбранная формулировка не определяет природу превосходства — ранг, власть или достоинство — поскольку греческий текст этого не уточняет.
- issue: Подразумеваемый деятель завершения строительства
  choice: 'Сохранён пассив: «будет завершено»'
  alternative: «они завершат строительство»
  rationale: Оригинал использует пассивную форму и не называет прямо деятеля; перевод не приписывает завершение исключительно шести ангелам.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского повествования; синтаксис упрощён лишь настолько, чтобы текст был понятен обычному читателю. Повтор слова «строительство» сохранён вслед за греческим оригиналом.
