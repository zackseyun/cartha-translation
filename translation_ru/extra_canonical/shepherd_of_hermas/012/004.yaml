  source_fidelity: 'Перевод точно передаёт предоставленный англоязычный сегмент, соответствующий греческому продолжению § 2: «они также» (Καὶ αὐτοί), святые ангелы Божии, превосходство шести (ὑπερέχοντες), будущее пассивное завершение строительства, всеобщая совместная радость, положение «вокруг башни» и прославление Бога по причине завершения строительства. Не добавлены ни субъект действия, ни характер превосходства, которых греческий текст не уточняет.'
