  naturalness: Текст читается естественно. «Каков исход камней» — литературная, ясная и достаточно нейтральная формулировка; она точнее воспроизводит греческий синтаксис, не превращая вопрос в излишне конкретное предсказание.
  terminology: «Госпожа» — корректная передача Κυρία в данном видении. «Сила» обоснованно сохраняет неоднозначность δύναμις; оснований заменять её на «значение» или «свойства» нет.
