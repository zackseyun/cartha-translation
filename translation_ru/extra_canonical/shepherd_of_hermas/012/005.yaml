  text: 3. I asked her, saying, "Lady, I wished to know the outcome of the stones and their power—what sort it is."
translation:
  language: ru
  text: '3. Я спросил её: «Госпожа, я хотел узнать, каков исход камней и какова их сила».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτησα αὐτὴν λέγων
  choice: Я спросил её
  rationale: Естественная русская передача греческой формулы речи без избыточного буквального «спросил её, говоря».
- source_word: ἤθελον γνῶναι
  choice: я хотел бы узнать
  rationale: Передаёт вежливое, смягчённое желание говорящего; условная форма по-русски звучит естественно в обращении к госпоже.
- source_word: τῶν λίθων τὴν ἔξοδον
  choice: что станется с камнями
  rationale: ἔξοδος здесь указывает на исход, итог или дальнейшую участь камней; контекстуальная конструкция сохраняет смысл и понятна современному читателю.
- source_word: τὴν δύναμιν αὐτῶν, ποταπή ἐστιν
  choice: какова их сила
  rationale: Сохраняет образ «силы» камней и прямой вопрос о её характере, не конкретизируя неоднозначное δύναμις как «значение» или «свойство».
theological_decisions:
- issue: Символический смысл «силы» камней
  choice: Сохранено буквальное «сила» без толкования символа
  alternative: «каково их значение» или «какими свойствами они обладают»
  rationale: Греческое δύναμις допускает смысл силы, свойства или значения; перевод не должен преждевременно разрешать символическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Обращение Κυρία передано как «Госпожа»; синтаксис слегка упрощён ради естественности, при этом смысловая неоднозначность ключевых слов сохранена.
