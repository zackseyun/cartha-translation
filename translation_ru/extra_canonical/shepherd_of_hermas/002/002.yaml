base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/002.yaml
  text: While I was considering these things and pondering them in my heart, I see before me a great white chair made of snowy wool. And an elderly woman came in most radiant clothing, holding a book in her hands, and sat down alone and greeted me, “Hermas, greetings.” And I, grieving and weeping, said, “Lady, greetings.”
translation:
  language: ru
  text: 'Пока я размышлял об этом и рассуждал в своём сердце, вижу перед собой большое белое кресло из белоснежной шерсти. И пришла пожилая женщина в ослепительно сияющем одеянии, держа в руках книгу; она села в одиночестве и приветствовала меня: «Здравствуй, Ерма!» А я, скорбя и плача, сказал: «Здравствуй, госпожа!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμβουλευομένου καὶ διακρίνοντος ἐν τῇ καρδίᾳ μου
  choice: размышлял об этом и обдумывал всё в своём сердце
  rationale: Передаёт внутреннее рассуждение и взвешивание, сохраняя библейский образ сердца как средоточия мысли.
- source_word: καθέδραν
  choice: сиденье
  rationale: Нейтральное обозначение места для сидения; не вносит позднейшего церковного значения слова «кафедра» и не уточняет форму как «кресло» или «трон».
- source_word: ἐξ ἐρίων χιονίνων γεγονυῖαν
  choice: сделанное из белоснежной шерсти
  rationale: Сохраняет материал и образ снежной белизны.
- source_word: γυνὴ πρεσβῦτις
  choice: пожилая женщина
  rationale: Естественное современное обозначение женщины преклонного возраста без уничижительного оттенка слова «старуха».
- source_word: ἐν ἱματισμῷ λαμπροτάτῳ
  choice: в ослепительно сияющем одеянии
  rationale: Передаёт усиленную превосходную степень λαμπροτάτῳ и возвышенный характер видения.
- source_word: Κυρία
  choice: госпожа
  rationale: Сохраняет уважительное обращение и связь с греческим титулом, не превращая его в имя или специальный богословский титул.
