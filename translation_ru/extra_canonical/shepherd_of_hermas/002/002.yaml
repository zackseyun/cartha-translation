- from: 'Пока я размышлял об этом и обдумывал всё в своём сердце, вижу перед собой большое белое сиденье, сделанное из белоснежной шерсти. И пришла пожилая женщина в ослепительно сияющем одеянии, держа в руках книгу. Она села одна и приветствовала меня: «Здравствуй, Ерма!» А я, скорбя и плача, ответил: «Здравствуй, госпожа!»'
  to: 'Пока я размышлял об этом и рассуждал в своём сердце, вижу перед собой большое белое кресло из белоснежной шерсти. И пришла пожилая женщина в ослепительно сияющем одеянии, держа в руках книгу; она села в одиночестве и приветствовала меня: «Здравствуй, Ерма!» А я, скорбя и плача, сказал: «Здравствуй, госпожа!»'
  rationale: 'Исправлены два безопасных смысловых и стилистических пункта: ταῦτα передано без неоправданного расширения как «об этом», а καθέδρα — естественным для современного русского словом «кресло». Формулировка о том, что женщина села одна, сглажена без утраты μόνη. Остальные решения сохранены, включая историческое настоящее и уважительное обращение «госпожа».'
