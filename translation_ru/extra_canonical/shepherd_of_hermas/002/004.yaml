base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/004.yaml
  text: But she said, “By no means does this matter apply to the servant of God. Yet surely a thought concerning her rose up in your heart. For such an intention brings sin upon the servants of God. For it is an evil and startling intention for a most reverent spirit, and one already proven, if it should desire an evil deed—especially Hermas, the self-controlled one, who abstains from every evil desire and is full of all simplicity and great innocence.”
translation:
  language: ru
  text: 'Но она сказала: «Ни в коем случае это дело не относится к рабу Божьему. Но несомненно, мысль о ней пришла тебе на сердце. Такой помысел навлекает грех на рабов Божьих. Ибо если весьма благоговейный и уже испытанный дух пожелает злого дела, это злой и потрясающий помысел — особенно у Эрмы, человека воздержанного, который сторонится всякого злого желания и исполнен всякой простоты и великой незлобивости».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πρᾶγμα τοῦτο
  choice: это дело
  rationale: Сохраняет предметную неопределённость греческого выражения и связь с предыдущим обвинением.
- source_word: βουλή
  choice: помысел
  rationale: В контексте внутреннего желания обозначает намерение или мысль нравственного характера; «помысел» естественно передаёт эту смысловую широту.
- source_word: ἔκπληκτος
  choice: поразительный
  rationale: Передаёт необычный и вызывающий потрясение характер такого помысла, не подменяя значение более узкой оценкой.
- source_word: πάνσεμνον πνεῦμα
  choice: дух, исполненный благоговения
  rationale: Передаёт усилительное πάν- и религиозно-нравственный оттенок σεμνός без неестественного буквального сложения.
- source_word: δεδοκιμασμένον
  choice: испытанный
  rationale: Сохраняет значение прошедшего проверку и одобрение, не уточняя, кем именно.
- source_word: ἐγκρατής
  choice: воздержанный
  rationale: Традиционно и точно выражает самообладание и сдерживание желаний.
- source_word: ἁπλότης
  choice: простота
  rationale: Сохраняет раннехристианский нравственный смысл цельности и чистосердечия.
- source_word: ἀκακία
  choice: незлобивость
  rationale: Передаёт отсутствие зла и безвредность характера более точно, чем широкое «невинность».
theological_decisions:
- issue: Степень вины Эрмы за внутреннее желание
  choice: Сохранено различие между самим внешним делом, которое к нему не относится, и возникшим в сердце помыслом, навлекающим грех.
  alternative: Сформулировать как прямое совершение греха в сердце.
  rationale: Греческий текст сначала отрицает применимость «этого дела», затем утверждает появление мысли и её греховное следствие; перевод не должен снимать это напряжение.
- issue: Значение πνεῦμα
  choice: Оставлено «дух» без уточнения, что речь непременно о Святом Духе или только о человеческом духе.
  alternative: «духовный человек» или «Святой Дух».
  rationale: Исходный текст допускает контекстуальное понимание, но не выражает уточнение явно.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис слегка упрощён ради ясности, при этом сохранены повторы нравственных терминов и напряжение между мыслью, желанием и делом.
