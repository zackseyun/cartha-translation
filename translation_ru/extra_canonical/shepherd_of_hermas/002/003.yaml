base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/003.yaml
  text: And she said to me, “Why are you gloomy, Hermas—you who are patient and not given to contention, always laughing? Why are you so downcast in appearance and not cheerful?” And I said to her, “Because of a most excellent woman, who said that I sinned against her.”
translation:
  language: ru
  text: 'Она сказала мне: «Что ты так мрачен, Ерма? Ты ведь терпелив, не склонен к ссорам и всегда смеёшься. Почему же ты так уныл с виду и не весел?» Я ответил ей: «Потому что одна очень достойная женщина сказала, что я согрешил против неё».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στυγνός
  choice: мрачен
  rationale: Передаёт угрюмое, подавленное состояние, выраженное греческим словом, естественно для современного русского языка.
- source_word: μακρόθυμος
  choice: терпелив
  rationale: Сохраняет основной смысл выдержки и долготерпения без излишней архаизации.
- source_word: ἀστομάχητος
  choice: не склонен к ссорам
  rationale: Передаёт буквальный смысл «не вступающий в словесные препирательства» ясным современным выражением.
- source_word: πάντοτε γελῶν
  choice: всегда смеёшься
  rationale: Сохраняет прямой образ греческого текста, не ослабляя его до «улыбаешься».
- source_word: κατηφὴς τῇ ἰδέᾳ
  choice: у тебя такой унылый вид
  rationale: Естественно передаёт указание на внешнее выражение подавленности.
- source_word: γυναικὸς ἀγαθωτάτης
  choice: одной превосходной женщины
  rationale: Передаёт усиленную превосходную степень ἀγαθωτάτης, не добавляя оценки, отсутствующей в тексте.
- source_word: ἥμαρτον εἰς αὐτήν
  choice: я согрешил против неё
  rationale: Сохраняет религиозно-нравственную лексику ἁμαρτάνω и направленность проступка против женщины.
theological_decisions:
- issue: Характер проступка Ермы
  choice: «согрешил против неё»
  alternative: «провинился перед ней»
  rationale: Греческое ἥμαρτον прямо использует язык греха; более нейтральное «провинился» ослабило бы богословскую напряжённость контекста.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования; обращение и диалог переданы естественно, без церковнославянизмов и конфессионально окрашенных добавлений.
