    issue: Неестественное выражение «одной превосходной женщины».
    rationale: Для γυναικὸς ἀγαθωτάτης лучше выбрать современное литературное «одной очень достойной женщины», сохраняя высокую оценку без стилистической кальки.
  - severity: low
    issue: «Нет радости» менее точно передаёт οὐχ ἱλαρός.
    rationale: Греческое слово описывает бодрое, весёлое выражение и состояние; «не весел» сохраняет эту непосредственную характеристику.
