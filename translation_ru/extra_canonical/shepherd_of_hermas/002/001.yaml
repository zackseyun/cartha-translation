base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/002/001.yaml
  text: After she had spoken these words, the heavens were shut, and I was wholly trembling and grieving. And I said within myself, “If this sin is charged against me, how will I be able to be saved? Or how shall I make atonement to God for my completed sins? Or with what words shall I ask the Lord, that he may be propitious to me?”
translation:
  language: ru
  text: 'После того как она произнесла эти слова, небеса затворились, а я весь дрожал и скорбел. Я говорил про себя: «Если этот грех записывается мне в вину, как я смогу спастись? Или как мне умилостивить Бога за мои совершённые грехи? Какими словами мне просить Господа, чтобы Он смилостивился надо мной?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκλείσθησαν οἱ οὐρανοί
  choice: небеса закрылись
  rationale: Сохраняет образ и страдательно-возвратный смысл греческого выражения без добавления действующего лица.
- source_word: ὅλος ἤμην πεφρικὼς
  choice: я весь дрожал
  rationale: Передаёт состояние сильного страха естественным современным русским выражением; перфектное причастие описывает охватившее героя состояние.
- source_word: ἀναγράφεται
  choice: вменяется
  rationale: Передаёт образ записи греха на счёт человека и его ответственности, не уточняя сверх текста, кем именно производится запись.
- source_word: τῶν ἁμαρτιῶν μου τῶν τελείων
  choice: за все совершённые мною грехи
  rationale: В данном контексте τελείων вероятнее обозначает грехи, доведённые до совершения, в отличие от возникшего в сердце помысла; формулировка делает этот смысл ясным по-русски.
- source_word: ἐξιλάσομαι τὸν Θεόν
  choice: умилостивлю Бога
  rationale: Сохраняет направленность действия на Бога и культово-богословскую окраску глагола, не заменяя её более узким конфессиональным толкованием.
- source_word: ἵνα ἱλατευθῇ μοι
  choice: чтобы Он был милостив ко мне
  rationale: Естественно передаёт пассивную форму ἱλατευθῇ и просьбу о благосклонности или прощении.
theological_decisions:
- issue: Связь между человеческим действием и Божьей милостью
  choice: 'Сохранены оба выражения: «умилостивлю Бога» и «чтобы Он был милостив ко мне».'
  alternative: Сгладить оба оборота до «как мне получить прощение у Бога».
  rationale: Греческий текст намеренно использует два родственных, но грамматически различных выражения; перевод не должен устранять напряжение между поиском человеком примирения и Божьим милостивым отношением.
- issue: Значение «совершённых» грехов
  choice: Понято как грехи, совершённые на деле.
  alternative: Перевести как «тяжкие», «окончательные» или «полные» грехи.
  rationale: Следующий контекст противопоставляет возникший помысел злому делу; поэтому значение фактически совершённых грехов наиболее уместно, хотя само греческое прилагательное допускает некоторую смысловую широту.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным тоном раннехристианского видения. Синтаксис сделан ясным для обычного читателя, при этом сохранены повторные риторические вопросы, внутренняя речь и богословски значимые формулировки.
