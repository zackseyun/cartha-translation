revisions:
- from: 'После того как она произнесла эти слова, небеса закрылись, а я весь дрожал и скорбел. Я говорил про себя: «Если этот грех вменяется мне, как я смогу спастись? И как умилостивлю Бога за все совершённые мною грехи? Какими словами мне обратиться к Господу, чтобы Он был милостив ко мне?»'
  to: 'После того как она произнесла эти слова, небеса затворились, а я весь дрожал и скорбел. Я говорил про себя: «Если этот грех записывается мне в вину, как я смогу спастись? Или как мне умилостивить Бога за мои совершённые грехи? Какими словами мне просить Господа, чтобы Он смилостивился надо мной?»'
