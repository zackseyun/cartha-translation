  terminology: «Проступки по неведению» — приемлемая передача ἀγνοήματα; «даровать исцеление» корректно сохраняет образ ἴασις; «Господь Вседержитель» удачно передаёт ὁ Κύριος ὁ παντοκράτωρ. «Взаимосвязаны» точнее передаёт κοινά в данном контексте, не навязывая тождества плоти и духа.
