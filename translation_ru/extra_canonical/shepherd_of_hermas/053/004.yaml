  verdict: revise
  source_fidelity: 'Перевод в целом точно передаёт греческий текст и английский POB audit trail: сохранены «исцеление» (ἴασις), условие «впредь», а также «жить для Бога». Однако κοινά ἐστι передано как «нераздельны», что несколько сужает значение «связаны/принадлежат друг другу, имеют общность» и преждевременно сводит его к следующему утверждению о невозможности отдельного осквернения. Квадратными скобками в исходном критическом тексте выделена значительная фраза; её текст следует сохранить, но отметить её текстологически неопределённый статус.'
