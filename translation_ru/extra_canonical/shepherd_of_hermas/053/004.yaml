  yaml_path: translation/extra_canonical/shepherd_of_hermas/053/004.yaml
  text: “As to former ignorances,” he says, “God alone is able to give healing concerning them; for all authority is his. But now guard yourself, and the Lord, the Almighty—being full of compassion—will give healing for former ignorances, if from now on you do not defile your flesh or the spirit; for both are shared and cannot be defiled apart from one another. Therefore keep both pure, and you will live to God.”
translation:
  language: ru
  text: «Что же касается прежних проступков по неведению, — сказал он, — то лишь Бог может даровать от них исцеление, ибо Ему принадлежит вся власть. Но теперь храни себя,[a] и Господь Вседержитель, по Своему великому милосердию, дарует исцеление от прежних проступков по неведению, если впредь ты не будешь осквернять ни своей плоти, ни духа. Ведь оба они взаимосвязаны и не могут быть осквернены друг без друга. Поэтому храни оба в чистоте — и будешь жить для Бога».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Фраза «Но теперь храни себя… исцеление от прежних проступков по неведению» заключена в квадратные скобки в используемом греческом критическом тексте; её текстологический статус не вполне определён.
    reason: Сохраняет указание источника на текстологическую неопределённость, не исключая фразу из основного текста.
lexical_decisions:
- source_word: ἀγνοημάτων
  choice: проступков по неведению
  rationale: Передаёт не просто отсутствие знания, а совершённые в неведении предосудительные поступки; сохраняет повтор ключевого понятия.
- source_word: ἴασιν δοῦναι
  choice: даровать исцеление
  rationale: Сохраняет образ исцеления, а не заменяет его более истолковывающим «простить».
- source_word: πολύσπλαγχνος
  choice: по Своему великому милосердию
  rationale: Естественно выражает сильное сострадание и милость Господа в современном литературном русском.
- source_word: κοινά ἐστι
  choice: нераздельны
  rationale: В контексте пояснения о невозможности раздельного осквернения обозначает тесную общность плоти и духа, не утверждая их тождества.
- source_word: ζήσῃ τῷ Θεῷ
  choice: будешь жить для Бога
  rationale: Сохраняет направленность дательного τῷ Θεῷ и богословскую ёмкость выражения.
theological_decisions:
- issue: Характер Божьего действия в отношении прежних грехов по неведению
  choice: исцеление
  alternative: прощение
  rationale: Греческий текст использует ἴασις, поэтому сохранён образ исцеления без сведения его к одной юридической категории.
- issue: Связь плоти и духа
  choice: они нераздельны и не могут быть осквернены друг без друга
  alternative: оба являются общими
  rationale: Так по-русски ясно передаётся контекстуальный смысл κοινά, при этом сохраняется напряжение утверждения об общем осквернении плоти и духа.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Реплики оформлены естественно; повтор «проступков по неведению» сохранён ради смысловой связности. Квадратные скобки исходного критического текста не перенесены в читательский текст, поскольку охватываемая ими фраза принята в основной перевод без необходимости примечания.
