  yaml_path: translation/extra_canonical/shepherd_of_hermas/053/003.yaml
  text: “But if, Sir,” I say, “there has been some former ignorance before these words were heard, how will the man who has defiled his flesh be saved?”
translation:
  language: ru
  text: «Но если, господин, — говорю я, — кто-то прежде, до того как были услышаны эти слова, был в неведении, то как спасётся человек, осквернивший свою плоть?»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: господин
  rationale: В обращении к наставнику слово передаёт почтительность; «Господь» здесь могло бы ошибочно указывать на Бога.
- source_word: γέγονεν ἄγνοια προτέρα
  choice: прежде ... кто-то согрешил по неведению
  rationale: Буквально речь о «прежнем неведении», но контекст связывает неведение с уже совершённым осквернением; естественная русская формулировка сохраняет эту связь.
- source_word: πρὶν ἀκουσθῶσι τὰ ῥήματα ταῦτα
  choice: до того как были услышаны эти слова
  rationale: Сохранён пассивный залог и временное отношение оригинала без уточнения, кем именно слова были услышаны.
- source_word: πῶς σωθῇ
  choice: как спасётся
  rationale: Передаёт сотериологический глагол σῴζω прямо и без конфессионального истолкования.
- source_word: ὁ μιάνας τὴν σάρκα αὐτοῦ
  choice: осквернивший свою плоть
  rationale: «Осквернить» соответствует культово-нравственной окраске μιαίνω, а «плоть» сохраняет ключевой термин σάρξ и связь с окружающим рассуждением.
theological_decisions:
- issue: Соотношение неведения, вины и спасения
  choice: Сохранён вопрос о спасении человека, уже осквернившего плоть по прежнему неведению.
  alternative: Передать ἄγνοια только как нейтральное «незнание», не обозначая совершённого проступка.
  rationale: Контекст последующего ответа говорит о прежних проступках по неведению (ἀγνοήματα), поэтому формулировка должна отражать нравственную сторону, не предрешая ответа о прощении.
- issue: Значение σάρξ
  choice: плоть
  alternative: тело
  rationale: «Плоть» сохраняет терминологическую связь данного раздела и присущую тексту антропологическую напряжённость; замена на «тело» могла бы сгладить повтор и смысловую структуру.
translation_notes:
  register: Современный литературный русский язык с dignified патристическим тоном. Синтаксис прямой речи сделан естественным, при этом сохранены вопросительная форма, почтительное обращение и ключевая лексика текста.
