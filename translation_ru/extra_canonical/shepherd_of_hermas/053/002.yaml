base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/053/002.yaml
  text: '“Listen now,” he says: “Keep this flesh of yours pure and undefiled, so that the spirit that dwells in it may bear witness to it, and your flesh may be justified. Watch lest it ever rise up in your heart that this flesh of yours is perishable, and you misuse it in some defilement. For if you defile your flesh, you will also defile the Holy Spirit; and if you defile the flesh, you will not live.”'
translation:
  language: ru
  text: «Теперь слушай, — говорит он. — Храни эту свою плоть чистой и незапятнанной, чтобы дух, обитающий в ней, свидетельствовал в её пользу и плоть твоя была оправдана. Смотри, чтобы тебе не пришло на сердце, будто эта твоя плоть тленна, и чтобы ты не злоупотребил ею, осквернив её чем-либо. Ведь если осквернишь свою плоть, то осквернишь и Святого Духа; а если осквернишь плоть, не будешь жить».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σάρξ
  choice: плоть
  rationale: Сохраняет ключевой антропологический термин отрывка и его отличие от πνεῦμα; в данном контексте означает телесную сторону человека без обязательного нравственно-негативного оттенка.
- source_word: καθαρὰν καὶ ἀμίαντον
  choice: чистой и незапятнанной
  rationale: Передаёт параллельные определения естественно и торжественно, сохраняя образ ритуально-нравственной чистоты.
- source_word: μαρτυρήσῃ αὐτῇ
  choice: свидетельствовал в её пользу
  rationale: Дательный αὐτῇ допускает смысл благоприятного свидетельства о плоти; формулировка делает этот синтаксический смысл ясным, не превращая свидетельство в свидетельство самой плоти.
- source_word: δικαιωθῇ
  choice: была оправдана
  rationale: Сохраняет судебно-богословскую лексику и пассивную форму оригинала, не уточняя, кем именно совершается оправдание.
- source_word: ἀναβῇ ἐπὶ τὴν καρδίαν σου
  choice: пришло тебе на сердце
  rationale: Естественный русский библейский оборот, близко передающий возникновение мысли или намерения в сердце.
- source_word: παραχρήσῃ αὐτῇ
  choice: стал обращаться с ней дурно
  rationale: Редкий глагол обозначает злоупотребление или дурное обращение; выбран широкий вариант, который не сужает смысл до одного конкретного греха.
- source_word: ἐν μιασμῷ τινί
  choice: оскверняя её чем-либо
  rationale: Передаёт неопределённость τινί и связь дурного обращения с каким-либо осквернением.
- source_word: οὐ ζήσῃ
  choice: не будешь жить
  rationale: Сохраняет предельно краткое и богословски напряжённое утверждение без добавления «с Богом», которое появляется лишь позднее в разделе.
theological_decisions:
- issue: Отношение плоти и обитающего в ней духа
  choice: Сохранено различие между «плотью» и «духом», без объяснения их природы.
  alternative: Истолковать дух как человеческую душу или исключительно как Святого Духа во всех упоминаниях.
  rationale: Первое τὸ πνεῦμα само по себе допускает контекстуальную неоднозначность, тогда как далее текст прямо говорит τὸ πνεῦμα τὸ ἅγιον. Перевод не должен заранее устранять эту смену формулировки.
- issue: Смысл оправдания плоти
  choice: «плоть твоя была оправдана»
  alternative: «твоё тело оказалось достойным» или «было признано невиновным»
  rationale: Буквальная судебная формулировка сохраняет богословское напряжение и не навязывает конкретный механизм оправдания.
- issue: 'Последствие осквернения: οὐ ζήσῃ'
  choice: «не будешь жить»
  alternative: «не будешь жить для Бога» или «погибнешь»
  rationale: Оригинал в данном сегменте не содержит дополнения «для Бога» и не употребляет прямой глагол погибели; краткая формула оставлена открытой.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Диалогическая рамка и повелительные формы сохранены. Архаизмы и конфессионально маркированные пояснения не добавлялись.
