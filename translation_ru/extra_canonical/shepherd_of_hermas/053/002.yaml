  terminology: «Плоть», «дух», «Святой Дух», «чистой и незапятнанной» и «была оправдана» удачно сохраняют терминологию и не навязывают толкования. Различение между первоначальным «духом» и явно названным далее «Святым Духом» сохранено. Сносок в данном сегменте не требуется.
