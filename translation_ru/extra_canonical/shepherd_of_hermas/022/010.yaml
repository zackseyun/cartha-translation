translation:
  language: ru
  text: 'На голове у зверя было четыре цвета: чёрный, затем огненно-кровавый, затем золотой, затем белый.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρίον
  choice: зверь
  rationale: Обычное и контекстуально точное обозначение грозного существа; сохраняет образ исходного текста.
- source_word: πυροειδὲς
  choice: огненный
  rationale: Передаёт значение «подобный огню, огненного вида» естественным русским прилагательным.
- source_word: αἱματῶδες
  choice: кроваво-красный
  rationale: Передаёт цветовое значение «кровавый, цвета крови» и в сочетании с «огненный» ясно обозначает характеристику цвета.
- source_word: χρυσοῦν
  choice: золотой
  rationale: Прямой естественный эквивалент названия цвета.
- source_word: λευκόν
  choice: белый
  rationale: Прямой эквивалент, сохраняющий последовательность четырёх цветов.
