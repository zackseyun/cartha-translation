base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/003.yaml
  text: So, walking alone, I was beseeching the Lord to bring to completion the revelations and the visions that he had shown me through his holy Church, so that he would strengthen me and give repentance to his servants who have stumbled, in order that his great and glorious name might be glorified, because he counted me worthy to show me his wonders.
translation:
  language: ru
  text: Итак, идя один, я просил Господа привести к завершению откровения и видения, которые Он показал мне через Свою святую Церковь, чтобы укрепить меня и даровать покаяние тем из Своих рабов, кто преткнулся, дабы прославилось Его великое и славное имя, ибо Он счёл меня достойным показать мне Свои чудеса.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀξιῶ
  choice: просил
  rationale: В данном контексте глагол означает настойчивую просьбу или мольбу; «просил» естественно передаёт смысл без излишнего усиления.
- source_word: τελειώσῃ
  choice: довершить
  rationale: Передаёт идею приведения уже начатых откровений и видений к завершению.
- source_word: διὰ τῆς ἁγίας Ἐκκλησίας αὐτοῦ
  choice: через Свою святую Церковь
  rationale: Сохраняет инструментальное значение διά и церковный образ, посредством которого были показаны видения.
- source_word: τοῖς ἐσκανδαλισμένοις
  choice: впавшим в соблазн
  rationale: 'Сохраняет неоднозначность: речь может идти о тех, кто преткнулся, был введён в соблазн или отпал; традиционная русская формулировка не сужает смысл до одного вида проступка.'
- source_word: τὰ θαυμάσια αὐτοῦ
  choice: Его чудеса
  rationale: Естественный русский эквивалент для дивных, чудесных деяний или явлений Бога.
theological_decisions:
- issue: Кому даруется покаяние
  choice: «даровать покаяние Своим рабам»
  alternative: «дать Своим рабам возможность покаяться»
  rationale: Греческое δῷ τὴν μετάνοιαν буквально представляет покаяние как дар; перевод сохраняет эту богословскую напряжённость, не объясняя её через более узкую интерпретацию.
- issue: Роль святой Церкви в откровениях
  choice: «которые Он показал мне через Свою святую Церковь»
  alternative: «которые Он показал мне в образе Своей святой Церкви»
  rationale: Основное значение διά с родительным падежом — посредство. Хотя в повествовании Церковь является герою в персонифицированном образе, перевод не добавляет отсутствующее здесь слово «образ».
- issue: Причинная связь в заключении
  choice: «ибо Он счёл меня достойным увидеть Его чудеса»
  alternative: «потому что Он удостоил меня того, чтобы показать мне Свои чудеса»
  rationale: Сохраняется основание для прославления имени; русская конструкция передаёт ἄξιον ἡγήσατο и цель τοῦ δεῖξαί μοι без тяжеловесности.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Синтаксис несколько торжественный, но понятный; местоимения, относящиеся к Господу, написаны с прописной буквы в соответствии с принятой русской религиозной издательской практикой.
