base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/007.yaml
  text: 'I began to weep and to ask the Lord that he would deliver me from it. And I remembered the word that I had heard: “Do not be double-minded, Hermas.”'
translation:
  language: ru
  text: 'И я начал плакать и просить Господа, чтобы Он избавил меня от него. И я вспомнил слово, которое услышал: «Не сомневайся, Ерма».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρωτᾶν
  choice: просить
  rationale: В сочетании с обращением к Господу глагол означает просьбу, а не вопрос; «просить» естественно передаёт смысл по-русски.
- source_word: λυτρώσηται
  choice: избавил
  rationale: Средний аорист конъюнктива здесь выражает избавление от угрожающего зверя; «избавил» сохраняет религиозный оттенок, не сужая значение до физического спасения.
- source_word: ἐπανεμνήσθην
  choice: тогда я вспомнил
  rationale: Передано возобновлённое воспоминание; «тогда» естественно связывает его с предшествующей молитвой.
- source_word: ῥήματος
  choice: слова
  rationale: Единственное число обозначает услышанное изречение или речённое слово; русское «слова» в формуле «услышанные мною слова» идиоматично передаёт цитируемое высказывание.
- source_word: διψυχήσεις
  choice: не будь в сомнении
  rationale: Глагол буквально связан с раздвоенностью души, но в контексте означает колебание и сомнение. Формулировка сохраняет увещевательный смысл и понятна современному читателю.
theological_decisions:
- issue: Значение διψυχέω
  choice: Не будь в сомнении
  alternative: Не будь двоедушным / не сомневайся
  rationale: «Двоедушный» ближе к внутренней форме греческого слова, но в современном русском может подразумевать лицемерие. «Не сомневайся» звучит более категорично и сглаживает образ состояния. Выбранная формулировка передаёт внутреннее колебание, не привнося нравственного обвинения.
- issue: Референт местоимения αὐτοῦ
  choice: от него
  alternative: от зверя
  rationale: Греческий текст использует местоимение с очевидной отсылкой к зверю из предыдущего предложения. Местоимение сохранено, чтобы не делать перевод более явным, чем источник.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но доступным библейско-раннехристианским звучанием. Имя Ἑρμᾶ передано как «Ерма», согласно традиционной русской форме имени автора/персонажа. Заглавная буква в местоимении «Он» отражает распространённую русскую издательскую практику в обращении к Господу, не меняя смысла.
