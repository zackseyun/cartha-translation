  text: So then, brothers, having put on the faith of the Lord and having remembered the mighty deeds that he had taught me, I took courage and gave myself over to the beast. Now the beast was coming with such a roar that it could destroy a city.
translation:
  language: ru
  text: Итак, братья, облекшись в веру в Господа и вспомнив о великом, чему Он научил меня, я набрался смелости и отдал себя зверю. Зверь же приближался с таким грохотом, что был способен разорить город.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνδυσάμενος ... τὴν πίστιν τοῦ Κυρίου
  choice: облекшись в веру в Господа
  rationale: Сохранена метафора облачения; родительный τοῦ Κυρίου передан естественным русским оборотом без излишнего уточнения.
- source_word: ὧν ἐδίδαξέν με μεγαλείων
  choice: о великих деяниях, о которых Он наставлял меня
  rationale: μεγαλεῖα обозначает великие, дивные проявления Божьего могущества; конструкция сохраняет необычную мысль текста о наставлении относительно увиденного.
- source_word: θαρσήσας
  choice: набрался смелости
  rationale: Передаёт переход от страха к мужеству в контексте встречи со зверем.
- source_word: εἰς τὸ θηρίον ἐμαυτὸν ἔδωκα
  choice: отдал себя во власть зверя
  rationale: Сохраняет решительность и риск буквального выражения, не подменяя его более определённым толкованием вроде «пошёл навстречу».
- source_word: ῥοίζῳ
  choice: с таким рёвом
  rationale: В данном контексте слово описывает грозный стремительный шум приближающегося чудовища; «рёв» естественен для русского повествования.
- source_word: πόλιν λυμᾶναι
  choice: погубить целый город
  rationale: λυμαίνομαι выражает опустошение или разорение; «погубить» сохраняет силу угрозы, а «целый» естественно подчёркивает масштаб.
theological_decisions:
- issue: Значение родительного в выражении πίστιν τοῦ Κυρίου
  choice: вера в Господа
  alternative: вера Господа / верность Господа
  rationale: Контекст призыва не колебаться и последующего мужества указывает прежде всего на упование Ермы на Господа; при этом перевод не вводит конфессионально нагруженной формулы.
- issue: Референт подлежащего в ἐδίδαξέν με
  choice: Он — Господь
  alternative: неявный иной наставник или олицетворённая Церковь
  rationale: Ближайший грамматический и смысловой референт — Господь; прописная буква делает связь понятной русскому читателю.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Сохранены обращения «братья», метафора облачения и напряжённая буквальность добровольной отдачи себя зверю; синтаксис слегка упорядочен для ясности.
