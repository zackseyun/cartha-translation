base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/006.yaml
  text: As the dust grew greater and greater, I supposed it was something divine. The sun shone out a little, and behold, I see a very great beast, like some sea monster, and from its mouth fiery locusts were coming out. The beast was about a hundred feet in length, and its head was like a jar.
translation:
  language: ru
  text: Пыли становилось всё больше и больше, и я предположил, что это нечто божественное. Солнце ненадолго блеснуло — и вот, я вижу огромное чудовище, похожее на какое-то морское чудовище, и из его пасти вылетали огненные саранчи. Чудовище было длиной около ста футов[a], а голова у него была словно глиняный сосуд[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Около ста футов — приблизительно тридцать метров.
    reason: Даёт современному читателю понятное представление о названной в источнике длине, не заменяя исходную меру в основном тексте.
  - marker: b
    text: Греческое слово может означать глиняный сосуд, черепицу или другое изделие из обожжённой глины.
    reason: Сохраняет реальную лексическую неоднозначность κεράμου, которую невозможно полностью передать одним русским соответствием.
lexical_decisions:
- source_word: κονιορτοῦ
  choice: облако пыли
  rationale: По контексту речь идёт не просто о пыли как веществе, а о поднимающемся и увеличивающемся облаке пыли.
- source_word: τι θεῖον
  choice: нечто божественное
  rationale: Сохраняет неопределённость греческого выражения и не сводит его однозначно к чуду или сверхъестественному знамению.
- source_word: ἐξέλαμψεν
  choice: блеснуло
  rationale: Передаёт краткую вспышку или появление солнечного света; наречное μικρόν отражено словами «на мгновение».
- source_word: θηρίον μέγιστον
  choice: огромное чудовище
  rationale: В описании видения θηρίον обозначает устрашающего зверя; «чудовище» естественно передаёт образ, а превосходная степень — словом «огромное».
- source_word: κῆτός τι
  choice: морское чудовище
  rationale: κῆτος обозначает крупное морское существо или морское чудовище; неопределённость τι передана сравнительной формой «похожее на» без уточнения вида.
- source_word: ἀκρίδες πύριναι
  choice: огненная саранча
  rationale: ἀκρίδες — собирательно «саранча»; «огненная» сохраняет образный эпитет без объяснительного расширения.
- source_word: κεράμου
  choice: глиняный сосуд
  rationale: κέραμος может обозначать обожжённое глиняное изделие, в том числе сосуд или черепицу. В сравнении с формой головы «глиняный сосуд» даёт понятный образ, а лексическая неоднозначность отмечена в сноске.
theological_decisions:
- issue: Характер явления, обозначенного τι θεῖον
  choice: нечто божественное
  alternative: нечто сверхъестественное
  rationale: Более буквально сохраняет θεῖον и не ослабляет возможную связь явления с Богом, одновременно оставляя формулировку неопределённой.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского повествования. Настоящее время в словах «и вот, я вижу» сохранено вслед за резким переходом греческого текста к историческому настоящему, усиливающим непосредственность видения.
