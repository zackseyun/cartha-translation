revisions:
- from: 'Я прошёл ещё немного, братья, и вот вижу: пыль поднимается словно до самого неба. Я стал говорить про себя: «Не стадо ли идёт, поднимая пыль?» Оно было от меня примерно в одном стадии.[a]'
  to: 'Я прошёл ещё немного, братья, и вот вижу: пыль поднимается словно до самого неба. Я стал говорить про себя: «Не скот ли идёт, поднимая пыль?» Ведь облако пыли было от меня примерно в одном стадии.[a]'
  rationale: 'Исправлен референт заключительного указания на расстояние: теперь он недвусмысленно относится к пыли, как в оригинале. «Стадо» заменено на более широкое «скот» для κτήνη. Остальные решения, включая живое настоящее «вижу», сохранены.'
