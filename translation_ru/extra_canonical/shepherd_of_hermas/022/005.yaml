base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/005.yaml
  text: I went on a little, brothers, and behold, I see dust rising as if to the sky, and I began to say within myself, “Perhaps cattle are coming and stirring up dust?” For it was about a stadion away from me.
translation:
  language: ru
  text: 'Я прошёл ещё немного, братья, и вот вижу: пыль поднимается словно до самого неба. Я стал говорить про себя: «Не скот ли идёт, поднимая пыль?» Ведь облако пыли было от меня примерно в одном стадии.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Стадий — древняя мера длины; здесь около 180 метров.
    reason: Современному читателю мера «стадий» может быть неизвестна, однако её сохранение передаёт историческую конкретность оригинала.
lexical_decisions:
- source_word: προσέβην μικρόν
  choice: прошёл ещё немного
  rationale: В контексте движения по дороге выражение естественно передаёт небольшое продвижение вперёд.
- source_word: ἀδελφοί
  choice: братья
  rationale: Прямое и естественное обращение к общине, без добавления отсутствующего в греческом уточнения.
- source_word: κονιορτὸν ὡς εἰς τὸν οὐρανόν
  choice: пыль поднимается словно до самого неба
  rationale: Сохраняет зрительную гиперболу и сравнительную частицу ὡς.
- source_word: κτήνη
  choice: стадо
  rationale: Слово обозначает домашних животных или скот; в данном контексте русское собирательное «стадо» звучит естественно и объясняет облако пыли.
- source_word: ὡς ἀπὸ σταδίου
  choice: примерно в одном стадии
  rationale: Сохраняет древнюю меру расстояния и приблизительность ὡς.
