base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/001.yaml
  text: The vision that I saw, brothers, came twenty days after the former vision; it was as a pattern of the tribulation that is coming.
translation:
  language: ru
  text: Братья, это видение я увидел через двадцать дней после предыдущего видения; оно было образом грядущей скорби.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τύπον
  choice: прообразом
  rationale: Передаёт значение образца или образа, заранее указывающего на грядущее событие, и сохраняет раннехристианский богословский оттенок выражения.
- source_word: θλίψεως
  choice: скорби
  rationale: В данном апокалиптическом контексте слово обозначает тяжёлое бедствие или притеснение; «скорбь» естественно и достаточно широко сохраняет этот смысл.
- source_word: ἐπερχομένης
  choice: грядущей
  rationale: Передаёт причастное значение того, что приближается или должно наступить, не уточняя природу бедствия сверх исходного текста.
theological_decisions:
- issue: Характер связи между видением и будущей скорбью
  choice: «прообразом грядущей скорби»
  alternative: «образом грядущей скорби» / «знамением грядущего бедствия»
  rationale: «Прообраз» сохраняет формулу εἰς τύπον и подразумеваемую символическую связь, но не утверждает, что видение исчерпывающе предсказывает или буквально воспроизводит событие.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным раннехристианским звучанием. Обращение ἀδελφοί передано традиционным и естественным «братья»; порядок фразы слегка перестроен ради ясности.
