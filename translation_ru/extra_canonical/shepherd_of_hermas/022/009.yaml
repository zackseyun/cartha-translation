base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/009.yaml
  text: I came near it, and that huge sea monster stretched itself out on the ground and did nothing except thrust out its tongue; it did not move at all until I had passed by it.
translation:
  language: ru
  text: Я подошёл к нему, и это огромное морское чудовище распласталось на земле и лишь высунуло язык; оно совсем не шевелилось, пока я не прошёл мимо него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ τηλικοῦτο κῆτος
  choice: это огромное морское чудовище
  rationale: τηλικοῦτο подчёркивает необычайную величину, а κῆτος обозначает крупное морское существо или чудовище; «морское чудовище» естественно передаёт образ, не отождествляя его с конкретным животным.
- source_word: ἐκτείνει ἑαυτὸ χαμαί
  choice: распласталось на земле
  rationale: Выражение описывает, как зверь вытянулся или простёрся низко на земле; «распласталось» кратко и наглядно передаёт это движение.
- source_word: οὐδὲν εἰ μὴ τὴν γλῶσσαν προέβαλλεν
  choice: лишь высунуло язык
  rationale: Идиома οὐδὲν εἰ μή означает «ничего, кроме»; по-русски смысл естественно выражается ограничительной частицей «лишь».
- source_word: παρῆλθον αὐτό
  choice: я не прошёл мимо него
  rationale: Глагол παρέρχομαι с объектом здесь означает пройти мимо чудовища; такая формулировка сохраняет пространственный смысл сцены.
