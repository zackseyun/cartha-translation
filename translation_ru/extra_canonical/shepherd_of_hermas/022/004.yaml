base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/004.yaml
  text: 'And while I was glorifying and giving thanks to him, something like the sound of a voice answered me: “Do not be double-minded, Hermas.” I began to reason within myself and say, “What do I have to be double-minded about, being so firmly established by the Lord and having seen glorious things?”'
translation:
  language: ru
  text: 'И когда я прославлял Его и благодарил Его, мне словно звук голоса ответил: «Не колеблись, Ерма». Тогда я стал рассуждать про себя: «В чём мне колебаться, если Господь так прочно утвердил меня и я видел славные дела?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ἦχος φωνῆς
  choice: нечто, подобное звучанию голоса
  rationale: Сохраняет сравнительную и несколько неопределённую форму греческого выражения, не превращая её просто в прямой “голос”.
- source_word: Μὴ διψυχήσεις
  choice: Не будь в сомнении
  rationale: διψυχέω буквально связано с раздвоенностью внутреннего расположения, но здесь естественно передаёт колебание и сомнение; формулировка сохраняет повелительный смысл и не вводит позднейшую терминологию.
- source_word: ἐν ἐμαυτῷ ἠρξάμην διαλογίζεσθαι
  choice: стал рассуждать про себя
  rationale: Естественно по-русски передаёт внутреннее размышление без избыточного буквального повторения.
- source_word: οὕτω τεθεμελιωμένος ὑπὸ τοῦ Κυρίου
  choice: Господь так прочно утвердил меня
  rationale: Передаёт образ прочного основания в естественной русской конструкции и сохраняет Господа как действующее лицо пассивной формы.
- source_word: ἔνδοξα πράγματα
  choice: славные явления
  rationale: В контексте видений πράγματα обозначает увиденное и пережитое; “явления” звучит естественнее общего “вещи”, сохраняя положительную оценку ἔνδοξα.
theological_decisions:
- issue: Значение διψυχέω
  choice: сомневаться / быть в сомнении
  alternative: быть двоедушным
  rationale: “Двоедушие” ближе к внутренней форме слова, однако в данном контексте вопрос Ермы касается колебания в доверии после полученных откровений. Выбранный вариант понятен современному читателю и не приписывает персонажу устойчивый нравственный порок.
- issue: Деятель в τεθεμελιωμένος ὑπὸ τοῦ Κυρίου
  choice: Господь прочно утвердил меня
  alternative: я так прочно утверждён Господом
  rationale: Активная русская конструкция яснее, при этом полностью сохраняет богословски значимую мысль, что утверждение исходит от Господа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но доступным звучанием. Обращение “Ерма” дано в традиционной русской форме имени. Неопределённость оборота ὡς ἦχος φωνῆς намеренно сохранена.
