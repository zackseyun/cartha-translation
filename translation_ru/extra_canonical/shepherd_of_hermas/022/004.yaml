  to: 'И когда я прославлял Его и благодарил Его, мне словно звук голоса ответил: «Не колеблись, Ерма». Тогда я стал рассуждать про себя: «В чём мне колебаться, если Господь так прочно утвердил меня и я видел славные дела?»'
