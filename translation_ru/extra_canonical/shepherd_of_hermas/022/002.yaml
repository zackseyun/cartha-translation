base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/022/002.yaml
  text: I was going into the countryside by the Campanian road. It is about ten stadia from the public road, and the place is easy to travel.
translation:
  language: ru
  text: Я шёл в поле по Кампанской дороге. От общественной дороги до него около десяти стадиев[a], и путь туда нетруден.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Десять стадиев — примерно 1,8 километра.
    reason: Античная мера расстояния мало понятна современному читателю; пояснение сохраняет исходную единицу и сообщает приблизительный современный эквивалент.
lexical_decisions:
- source_word: ἀγρός
  choice: за город
  rationale: В данном контексте обозначает сельскую местность вне города; естественное русское выражение передаёт направление движения, не сужая смысл до конкретного поля.
- source_word: ἡ ὁδὸς ἡ Καμπανή
  choice: Кампанская дорога
  rationale: Сохранено название дороги; прилагательное передаёт греческую форму без добавления не удостоверенных текстом деталей.
- source_word: ἡ ὁδὸς ἡ δημοσία
  choice: большая дорога
  rationale: Здесь имеется в виду общественная, основная дорога; «большая дорога» звучит естественно и отличает её от ответвления к месту назначения.
- source_word: ῥᾳδίως δὲ ὁδεύεται ὁ τόπος
  choice: и добраться туда нетрудно
  rationale: Идиоматически передаёт безличную мысль о лёгкой доступности места, избегая неестественного буквального «место легко проходится».
theological_decisions: []
