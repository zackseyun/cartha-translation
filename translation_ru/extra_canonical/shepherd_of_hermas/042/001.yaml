base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/001.yaml
  text: Foremost of all is desire for another’s wife or husband, and for the luxury of wealth, and for many vain foods and drunken drinks, and for many other foolish indulgences; for every indulgence is foolish and empty for the servants of God.
translation:
  language: ru
  text: Прежде всего — желание чужой жены или чужого мужа[a], роскошного богатства, множества суетных яств и опьяняющих напитков, а также многих других глупых удовольствий. Ведь всякое потворство себе глупо и пусто для Божьих слуг.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чужой женщины или мужчины»; в данном контексте речь идёт о человеке, состоящем в браке с другим.'
    reason: Сноска сохраняет формальную широту греческих слов, тогда как основной текст естественно передаёт вероятный брачный смысл.
lexical_decisions:
- source_word: Πάντων προέχουσα
  choice: Прежде всего
  rationale: Передаёт первенство перечисляемого желания естественным русским оборотом, не перегружая начало фразы.
- source_word: γυναικὸς ἀλλοτρίας ἢ ἀνδρός
  choice: чужой жены или чужого мужа
  rationale: В контексте запретного влечения ἀλλότριος означает принадлежащего другому; «жена» и «муж» естественно выражают подразумеваемые брачные отношения, а сноска отмечает буквальную широту греческих слов.
- source_word: πολυτελείας πλούτου
  choice: роскоши и богатства
  rationale: Сохраняет оба тесно связанных понятия греческой фразы и не сводит её только к «роскошному богатству».
- source_word: ἐδεσμάτων πολλῶν ματαίων
  choice: множества изысканных, но ненужных яств
  rationale: «Яства» передаёт оттенок избыточной еды, а «ненужных» — моральную пустоту μάταιος; «изысканных» естественно связывает выражение с роскошью и потворством себе.
- source_word: μεθυσμάτων
  choice: опьяняющих напитков
  rationale: Передаёт напитки, употребляемые ради опьянения, без неоправданного сужения до одного их вида.
- source_word: τρυφή
  choice: потворство себе
  rationale: В итоговом нравственном суждении обозначает не любое удовольствие, а изнеженное, избыточное самоуслаждение.
- source_word: τοῖς δούλοις τοῦ Θεοῦ
  choice: для Божьих слуг
  rationale: Прямо и понятно передаёт религиозный образ принадлежности и служения Богу.
theological_decisions:
- issue: Оценка всякого удовольствия
  choice: «всякое потворство себе»
  alternative: «всякое удовольствие»
  rationale: τρυφή здесь означает изнеженность и избыточное самоуслаждение; перевод «всякое удовольствие» сделал бы утверждение шире греческого текста и мог бы создать не предусмотренный им абсолютный запрет любой радости.
- issue: Пол запретного объекта желания
  choice: сохранены и жена, и муж
  alternative: упомянуть только чужую жену
  rationale: Греческий текст явно содержит γυνή и ἀνήρ, поэтому перевод сохраняет симметричное предостережение, не ограничивая его мужчинами.
translation_notes:
  register: Современный литературный русский с назидательным, но доступным звучанием. Начальное перечисление сохранено, громоздкие буквальные сочетания сглажены. «Яства» слегка приподнимает стиль в соответствии с раннехристианским увещанием, оставаясь понятным современному читателю.
