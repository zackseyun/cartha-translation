base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/005.yaml
  text: 5. So then, having been crowned against it, come to the desire for righteousness, and, handing over to it the victory you received, serve it as it wills. If you serve the good desire and submit to it, you will be able to master the evil desire and to subject it as you wish.
translation:
  language: ru
  text: 5. Итак, увенчанный венцом победителя над злым желанием, обратись к стремлению к праведности и, отдав ему одержанную тобой победу, служи ему, как оно того желает. Если будешь служить доброму стремлению и покоришься ему, то сможешь господствовать над злым желанием и подчинить его себе, как пожелаешь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στεφανωθεὶς κατ᾽ αὐτῆς
  choice: увенчанный победой над злым желанием
  rationale: Причастие от στεφανόω буквально означает «увенчанный»; контекст борьбы и последующее τὸ νῖκος показывают, что имеется в виду венец победителя. Местоимение раскрыто по ближайшему контексту.
- source_word: ἐπιθυμίαν τῆς δικαιοσύνης
  choice: стремлению к праведности
  rationale: Здесь ἐπιθυμία обозначает направленное желание или стремление; «стремление» естественно по-русски и отличает положительную направленность от злого желания.
- source_word: τὸ νῖκος ὃ ἔλαβες
  choice: одержанную тобой победу
  rationale: Передаёт буквальное «победу, которую ты получил» естественным современным русским оборотом без изменения смысла.
- source_word: δούλευσον αὐτῇ
  choice: служи ему
  rationale: Сохраняет сильную лексику подчинённого служения; местоимение согласовано с русским словом «стремление».
- source_word: κατακυριεῦσαι
  choice: одолеть
  rationale: Глагол выражает установление господства над чем-либо; «одолеть» сохраняет образ борьбы и звучит естественно рядом с последующим «подчинить».
- source_word: ὑποτάξαι αὐτὴν καθὼς βούλει
  choice: подчинить его себе, как пожелаешь
  rationale: Сохраняет власть над злым желанием и открытую формулировку καθὼς βούλει, не уточняя способ или меру подчинения.
theological_decisions:
- issue: Соотношение человеческого усилия, победы и праведности
  choice: Сохранены повеления служить доброму стремлению и покориться ему, а также обещание способности одолеть злое желание.
  alternative: Истолковать победу как исключительно дар благодати либо как автономное нравственное достижение человека.
  rationale: Греческий текст сочетает полученную победу с активным служением и подчинением; перевод не разрешает это напряжение в пользу определённой богословской системы.
- issue: Персонификация доброго и злого желания
  choice: Сохранена грамматически и образно через служение стремлению и подчинение желания.
  alternative: Передать всё как отвлечённое наставление о контроле над склонностями.
  rationale: В исходном тексте желания представлены как силы, которым можно служить, покоряться и противостоять; этот образ важен для аргумента.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной наставительной интонацией. Синтаксис сделан естественным для широкого читателя, при этом сохранены образы венца, победы, служения и подчинения.
