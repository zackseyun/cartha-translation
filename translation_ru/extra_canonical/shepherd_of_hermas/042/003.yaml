  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/003.yaml
  text: 3. But all who are overmastered by them and do not resist them will die utterly; for these desires are deadly.
translation:
  language: ru
  text: 3. Но все, кто окажется во власти этих желаний и не станет им противиться, погибнут окончательно, потому что эти желания смертоносны.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακυριευθῶσιν
  choice: окажется во власти
  rationale: Передаёт идею подчинения и господства желаний над человеком естественным современным русским языком.
- source_word: μὴ ἀντισταθῶσιν
  choice: не станет им противиться
  rationale: Сохраняет прямой смысл сопротивления, не добавляя оттенков, отсутствующих в греческом тексте.
- source_word: ἀποθανοῦνται εἰς τέλος
  choice: погибнут окончательно
  rationale: Сохраняет усиление εἰς τέλος и возможный более широкий смысл ἀποθνῄσκω в данном нравственно-богословском контексте.
- source_word: θανατώδεις
  choice: смертоносны
  rationale: Точно и лаконично передаёт причиняющий смерть характер злых желаний.
theological_decisions:
- issue: Характер смерти в выражении ἀποθανοῦνται εἰς τέλος
  choice: погибнут окончательно
  alternative: умрут окончательно / погибнут навеки
  rationale: Формулировка сохраняет серьёзность и итоговый характер предупреждения, но не уточняет без достаточных оснований, идёт ли речь исключительно о физической, духовной или вечной смерти.
translation_notes:
  register: Современный литературный русский; назидательный и серьёзный тон оригинала сохранён. Местоимение «этих» связано с порочными желаниями из ближайшего контекста.
