base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/002.yaml
  text: 2. These, then, are evil desires, putting the servants of God to death. For this evil desire is the devil’s daughter. Therefore one must abstain from evil desires, so that, by abstaining, you may live to God.
translation:
  language: ru
  text: '2. Итак, эти желания — злые: они умерщвляют Божьих слуг. Ведь это злое желание — дочь дьявола. Поэтому следует воздерживаться от злых желаний, чтобы, воздерживаясь от них, вы жили для Бога.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμίαι πονηραί
  choice: злые желания
  rationale: Передаёт нравственно отрицательный смысл πονηραί и сохраняет ключевой повтор слова ἐπιθυμία в данном разделе.
- source_word: θανατοῦσαι
  choice: они умерщвляют
  rationale: Сохраняет сильный каузативный смысл причастия — желания не просто ведут к смерти, а умерщвляют.
- source_word: τοὺς δούλους τοῦ Θεοῦ
  choice: Божьих слуг
  rationale: Естественная современная русская формулировка, сохраняющая образ принадлежности и служения Богу.
- source_word: τοῦ διαβόλου θυγάτηρ
  choice: дочь дьявола
  rationale: Буквально сохраняет олицетворение злого желания и родственный образ исходного текста.
- source_word: ἀπέχεσθαι
  choice: воздерживаться
  rationale: Точно передаёт требование держаться вдали от злых желаний и поддерживает повтор в следующем обороте.
- source_word: ζήσητε τῷ Θεῷ
  choice: вы жили для Бога
  rationale: Передаёт дательный отношения как жизнь, посвящённую Богу; это естественнее для современного русского читателя, чем буквальное «жили Богу».
theological_decisions:
- issue: Смысл выражения ζήσητε τῷ Θεῷ
  choice: жили для Бога
  alternative: жили Богу
  rationale: Выбранный вариант сохраняет идею направленной и посвящённой Богу жизни, не уточняя сверх текста, идёт ли речь исключительно о духовной жизни или о нравственном служении.
- issue: Олицетворение злого желания
  choice: это злое желание — дочь дьявола
  alternative: злое желание происходит от дьявола
  rationale: Сохранён яркий образ оригинала без сведения его к отвлечённому утверждению о происхождении зла.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Сохранены повторы «злое желание / злые желания» и сильная метафорика оригинала; синтаксис слегка разгружен для ясности.
