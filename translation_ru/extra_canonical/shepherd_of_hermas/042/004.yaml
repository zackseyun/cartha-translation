base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/042/004.yaml
  text: 4. But you—put on the desire for righteousness, and, having armed yourself with the fear of the Lord, resist them. For the fear of God dwells in the good desire. If the evil desire sees you armed with the fear of God and resisting it, it will flee far away from you, and it will no longer appear to you, being afraid of your weapons.
translation:
  language: ru
  text: 4. Ты же облекись в стремление к праведности и, вооружившись страхом Господним, противостой этим желаниям. Ведь страх Божий обитает в добром стремлении. Если злое желание увидит, что ты вооружён страхом Божьим и противостоишь ему, оно убежит далеко от тебя и больше не покажется тебе, испугавшись твоего оружия.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔνδυσαι
  choice: облекись
  rationale: Сохраняет метафору облачения и повелительную форму греческого текста.
- source_word: ἐπιθυμία
  choice: стремление / желание
  rationale: В положительных сочетаниях «стремление» естественно передаёт направленность к праведности и добру; в отрицательном контексте «желание» передаёт пагубное влечение. Различие определяется контекстом, а не разными греческими словами.
- source_word: δικαιοσύνη
  choice: праведность
  rationale: Передаёт нравственно-богословский смысл термина в данном увещевании.
- source_word: φόβος τοῦ Κυρίου / φόβος τοῦ Θεοῦ
  choice: страх Господний / страх Божий
  rationale: Сохраняет формулировку и смену божественных обозначений в оригинале, не ослабляя «страх» до одного лишь почтения.
- source_word: κατοικεῖ
  choice: обитает
  rationale: Сохраняет образ постоянного пребывания, а не просто связи или присутствия.
- source_word: ὅπλα
  choice: оружие
  rationale: Поддерживает развёрнутую воинскую метафору вооружения и сопротивления.
theological_decisions:
- issue: Значение «страха Божьего»
  choice: Сохранено буквальное «страх Божий / Господний»
  alternative: благоговение перед Богом
  rationale: 'Греческое φόβος допускает благоговейный оттенок, но прямое «страх» сохраняет напряжение образа: злое желание само пугается этого оружия.'
- issue: Персонификация злого желания
  choice: Злое желание видит, убегает и пугается
  alternative: Человек освобождается от злого желания благодаря страху Божьему
  rationale: Оригинал последовательно персонифицирует желание; пересказ устранил бы образность и изменил субъект действий.
- issue: Множественное «им» в начале
  choice: «противостой этим желаниям»
  alternative: «противостой ему»
  rationale: αὐταῖς относится к злым желаниям из предшествующего контекста, тогда как далее текст переходит к единственному числу и персонифицированному злому желанию.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещевания. Сохранены метафоры облачения, вооружения, обитания и бегства; синтаксис сделан ясным для обычного читателя без конфессиональных уточнений.
