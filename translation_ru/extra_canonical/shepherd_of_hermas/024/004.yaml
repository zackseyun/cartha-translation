revisions:
- from: Итак, не переставай говорить в уши святым. Перед вами также образ грядущей великой скорби; но если вы захотите, она окажется для вас ничем.[a] Помните написанное прежде».
  to: «Итак, не переставай говорить святым. У вас есть и образ грядущей великой скорби; но, если захотите, ничего не будет. Помните то, что было написано прежде».
  rationale: Устранены неестественная буквальность и одностороннее толкование краткой фразы οὐδὲν ἔσται. Формула «ничего не будет» намеренно оставляет неопределённым её предмет, как и греческий текст. Исправлено кавычечное оформление; сноска не нужна, поскольку её интерпретирующее пояснение не требуется для передачи текста.
  reviewer_model: gpt-5.6-terra
