base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/004.yaml
  text: '"You, therefore, do not cease speaking in the ears of the holy ones. You also have the pattern of the great tribulation that is coming; but if you are willing, it will be nothing. Remember the things written beforehand."'
translation:
  language: ru
  text: «Итак, не переставай говорить святым. У вас есть и образ грядущей великой скорби; но, если захотите, ничего не будет. Помните то, что было написано прежде».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ διαλίπῃς λαλῶν εἰς τὰ ὦτα
  choice: не переставай говорить в уши
  rationale: Сохранён настойчивый и несколько необычный образ исходного текста; «не переставай» естественно передаёт запрет с продолженным действием.
- source_word: οἱ ἅγιοι
  choice: святые
  rationale: Передаёт раннехристианское обозначение членов общины без добавления конфессионального толкования.
- source_word: τύπος
  choice: образ
  rationale: В данном контексте означает наглядное предзнаменование или прообраз грядущего бедствия; «образ» сохраняет широту значения.
- source_word: θλίψεως
  choice: скорби
  rationale: Сохраняет библейскую лексику и включает смысл тяжёлого притеснения и бедствия.
- source_word: τὰ προγεγραμμένα
  choice: написанное прежде
  rationale: Формально передаёт отсылку к ранее записанным наставлениям, не уточняя их содержание сверх источника.
theological_decisions:
- issue: К кому относится οὐδὲν ἔσται («будет ничем»)
  choice: она окажется для вас ничем
  alternative: ничего не случится
  rationale: Ближайший смысл связан с грядущей скорбью и готовностью адресатов; местоимение и «для вас» делают русский текст понятным, а сноска сохраняет буквальную неоднозначность.
- issue: Значение τύπος применительно к скорби
  choice: образ грядущей великой скорби
  alternative: прообраз / знамение грядущей великой скорби
  rationale: «Образ» не решает однозначно, является ли увиденное моделью, предвестием или символическим изображением будущего испытания.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Сохранены единственное число в обращении к Ерму («не переставай») и множественное число при обращении ко всей общине («перед вами», «вы захотите», «помните»).
