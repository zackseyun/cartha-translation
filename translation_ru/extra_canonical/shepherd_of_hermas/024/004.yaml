review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: обращение в единственном числе сменяется обращением к общине во множественном, а «великая скорбь» и ранее написанное сохранены. Однако добавление «для вас» в фразе οὐδὲν ἔσται сужает намеренно краткое и неуточнённое греческое выражение.'
  naturalness: «Говорить в уши святым» звучит по-русски неестественно и может создать неверный оттенок шёпота или интимного разговора. «Говорить святым» — естественное современное соответствие; образ «в уши» не требуется сохранять буквально. В исходном фрагменте нужна открывающая кавычка, поскольку присутствует закрывающая.
  terminology: «Святые», «образ», «грядущая великая скорбь» и «написанное прежде» уместны по регистру и не навязывают богословского истолкования. Для τύπος «образ» допустим, так как сохраняет широту значения.
  issues:
  - severity: medium
    issue: Необоснованное смысловое восполнение «она окажется для вас ничем».
    rationale: Греческое οὐδὲν ἔσται буквально не называет ни субъекта, ни адресата последствия. Добавление «для вас» интерпретирует спорно краткую формулу и уменьшает исходную неоднозначность.
  - severity: medium
    issue: Неестественная конструкция «говорить в уши святым».
    rationale: Буквальное воспроизведение εἰς τὰ ὦτα в современном русском звучит неидиоматично и меняет прагматический оттенок. Естественное «говорить святым» передаёт увещевание без ложной коннотации.
  - severity: low
    issue: Несогласованное оформление прямой речи.
    rationale: В тексте есть только закрывающая кавычка. Для самостоятельного читательского сегмента следует поставить также открывающую.
