base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/001.yaml
  text: I asked her about the four colors that the beast had on its head. But she answered me and says, "Again you are curious about such matters." "Yes, my Lady," I say; "make known to me what these things are."
translation:
  language: ru
  text: 'Я спросил её о четырёх цветах, которые были на голове зверя. Она ответила мне: «Ты опять проявляешь чрезмерное любопытство к таким вещам». — «Да, госпожа, — сказал я, — скажи мне, что это такое».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίεργος
  choice: допытываешься
  rationale: Передаёт упрёк в чрезмерном любопытстве к подобным вопросам, сохраняя естественность современной русской речи.
- source_word: κυρία
  choice: госпожа
  rationale: Уважительное обращение к женскому персонажу без привнесения специального церковного титула.
- source_word: γνώρισόν μοι τί ἐστιν ταῦτα
  choice: объясни мне, что они означают
  rationale: По контексту речь идёт не о простом установлении сущности цветов, а об истолковании их символического значения.
- source_word: θηρίον
  choice: зверь
  rationale: Прямой и традиционно понятный эквивалент, сохраняющий грозный образ исходного текста.
theological_decisions:
- issue: Символический характер четырёх цветов
  choice: что они означают
  alternative: что это такое
  rationale: Следующие стихи дают именно символическое толкование цветов; формулировка раскрывает прагматический смысл вопроса, не предрешая содержания толкования.
translation_notes:
  register: Современный литературный русский язык; повествование выдержано в достоинственном, но доступном регистре. Историческое настоящее λέγει/φημί естественно передано прошедшим временем в русской повествовательной последовательности.
