base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/005.yaml
  text: Having said these things, she went away, and I did not see to what place she went; for a noise occurred. And I turned around in fear, thinking that the beast was coming.
translation:
  language: ru
  text: Сказав это, она ушла, и я не увидел, куда она ушла, потому что раздался шум. Я в страхе обернулся, думая, что приближается зверь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: ушла
  rationale: Естественно передаёт удаление женщины из поля зрения рассказчика без добавления направления.
- source_word: ψόφος
  choice: шум
  rationale: Сохраняет общее значение неопределённого слышимого шума; источник звука в греческом тексте не назван.
- source_word: ἐπεστράφην εἰς τὰ ὀπίσω
  choice: обернулся
  rationale: Современная и естественная русская передача буквального оборота «повернулся назад».
- source_word: τὸ θηρίον ἔρχεται
  choice: приближается зверь
  rationale: Передаёт настоящее время и ощущение надвигающейся опасности; «зверь» соответствует образу θηρίον в контексте видения.
