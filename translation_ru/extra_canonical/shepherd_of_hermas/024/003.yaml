base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/003.yaml
  text: '"But the white portion is the age that is coming, in which the elect of God will dwell; because those chosen by God for eternal life will be spotless and pure.'
translation:
  language: ru
  text: А белая часть — это грядущий век, в котором будут жить Божьи избранники, потому что те, кого Бог избрал для вечной жизни, будут незапятнанными и чистыми.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ λευκὸν μέρος
  choice: белая часть
  rationale: Прямо сохраняет образ одной из цветных частей на голове зверя.
- source_word: ὁ αἰὼν ὁ ἐπερχόμενος
  choice: грядущий век
  rationale: Передаёт раннехристианское эсхатологическое значение αἰών и сохраняет противопоставление нынешнему миру.
- source_word: κατοικήσουσιν
  choice: будут жить
  rationale: Естественная современная передача будущего времени со значением постоянного пребывания.
- source_word: οἱ ἐκλεκτοὶ τοῦ θεοῦ
  choice: Божьи избранники
  rationale: Кратко и естественно передаёт принадлежность Богу и значение избранности.
- source_word: ἄσπιλοι καὶ καθαροί
  choice: незапятнанными и чистыми
  rationale: 'Сохраняет оба близких, но не тождественных определения: отсутствие пятна и чистоту.'
theological_decisions:
- issue: Связь избрания с вечной жизнью
  choice: те, кого Бог избрал для вечной жизни
  alternative: те, кто избран Богом и предназначен к вечной жизни
  rationale: Следует синтаксису ἐκλελεγμένοι ὑπὸ τοῦ Θεοῦ εἰς ζωὴν αἰώνιον, не добавляя отдельного понятия предопределения и не уточняя механизм избрания.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным звучанием; богословская терминология оригинала сохранена без конфессиональных уточнений.
