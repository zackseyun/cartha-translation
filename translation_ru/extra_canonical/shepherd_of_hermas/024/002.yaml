  - severity: medium
    issue: Смена лица в «те... очистятся»
    rationale: Хотя причастие μείναντες формально говорит о «тех, кто останется», конечный глагол καθαρισθήσεσθε стоит во 2-м лице множественного. Редакция сохраняет обращение к «вам».
