base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/024/002.yaml
  text: 'She says, "Listen: the black is this world, in which you dwell. And the fiery and blood-red is because this world must be destroyed by blood and fire. But the golden portion is you who have escaped this world. For just as gold is tested by fire and becomes useful, so also you are being tested in them. Therefore, those who remain and are burned by it will be purified. Just as gold casts off its dross, so also you will cast off every grief and distress, and you will be purified and will be useful for the building of the tower.'
translation:
  language: ru
  text: 'Она говорит: «Слушай. Чёрный цвет — это этот мир, в котором вы живёте. Огненный и кроваво-красный означает, что этот мир должен погибнуть через кровь и огонь. Золотая же часть — это вы, избежавшие этого мира. Ведь как золото испытывается огнём и становится пригодным, так и вы проходите испытание среди них[a]. Поэтому, если вы останетесь и будете обожжены им[b], то очиститесь. Как золото избавляется от своего шлака, так и вы избавитесь от всякой скорби и тяготы, очиститесь и станете пригодны для строительства башни».


    [a] Буквально: «испытываетесь в них». Неясно, к чему относится «в них»: к крови и огню, к испытаниям или к упомянутым обстоятельствам. Слова «живущие» заключены в скобки в используемом издании.

    [b] Буквально: «будете обожжены им». Местоимение может относиться к огню либо к этому миру как среде испытания.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «испытываетесь в них». Неясно, к чему относится «в них»: к крови и огню, к испытаниям или к упомянутым обстоятельствам. Слова «живущие» заключены в скобки в используемом издании.'
    reason: Сохраняет неясную отсылку αὐτοῖς и осторожно отмечает заключённое в скобки οἱ κατοικοῦντες без неподтверждённого утверждения о составе рукописных свидетельств.
  - marker: b
    text: 'Буквально: «будете обожжены им». Местоимение может относиться к огню либо к этому миру как среде испытания.'
    reason: Не разрешает принудительно неоднозначную отсылку αὐτοῦ.
lexical_decisions:
- source_word: τὸ μέλαν
  choice: чёрный цвет
  rationale: В контексте истолкования четырёх цветов явное существительное «цвет» по-русски естественно восполняет субстантивированное прилагательное.
- source_word: πυροειδὲς καὶ αἱματῶδες
  choice: огненный и кроваво-красный
  rationale: Передаёт образ огня и крови как характеристику цвета, не превращая его только в абстрактный символ.
- source_word: ἀπόλλυσθαι
  choice: погибнуть
  rationale: Сохраняет пассивно-медиальную неоднозначность между гибелью и уничтожением мира, избегая введения неназванного деятеля.
- source_word: ἐκφυγόντες
  choice: избежавшие
  rationale: Передаёт успешное бегство или избавление от мира без добавочного богословского толкования.
- source_word: δοκιμάζεται / δοκιμάζεσθε
  choice: испытывается / проходите испытание
  rationale: Сохраняет параллель между проверкой золота огнём и испытанием людей.
- source_word: εὔχρηστον / χρήσιμοι
  choice: пригодным / пригодны
  rationale: Сохраняет повтор понятия практической пригодности, далее уточнённой строительством башни.
- source_word: σκωρίαν
  choice: окалины
  rationale: Конкретный металлургический образ примеси или слоя, удаляемого при очистке золота; современное и понятное слово.
- source_word: στενοχωρίαν
  choice: стеснения
  rationale: Передаёт буквальный образ тесноты и связанное с ним значение тяготы, не сводя его исключительно к внешним гонениям.
- source_word: οἰκοδομὴν τοῦ πύργου
  choice: строительства башни
  rationale: Прямо сохраняет центральный образ произведения.
theological_decisions:
- issue: Значение «мира» и избавления от него
  choice: «нынешний мир» и «избежавшие этого мира»
  alternative: «этот век» и «вырвавшиеся из него»
  rationale: κόσμος здесь прямо назван местом обитания и противопоставлен общине; перевод сохраняет космологическую и нравственную напряжённость, не отождествляя мир с конкретной системой или учением.
- issue: Неясные местоименные отсылки в описании испытания
  choice: Сохранить «среди них» и «им» с пояснительными сносками
  alternative: Однозначно заменить на «среди крови и огня» и «огнём»
  rationale: Греческие αὐτοῖς и αὐτοῦ имеют не вполне ясные антецеденты; конкретизация в основном тексте устранила бы подлинную неоднозначность источника.
- issue: Характер очищения
  choice: «очистятся» и «освободитесь от всякой скорби и стеснения»
  alternative: Истолковать как прощение грехов или окончательное спасение
  rationale: Текст использует образ очистки золота и говорит о пригодности для башни, но не определяет здесь точную сотериологическую схему.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского видения. Синтаксис сделан ясным для обычного читателя, но повторения «мир», «золото», «испытание», «очиститься» и «пригодный» сохранены как смысловые связки. Переведён только заданный читательский сегмент, соответствующий объяснению чёрного, огненно-красного и золотого цветов.
