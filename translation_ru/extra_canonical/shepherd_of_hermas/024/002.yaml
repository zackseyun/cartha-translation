  source_fidelity: Текст в целом точно передаёт объяснение чёрной, огненно-кровавой и золотой частей. Однако «нынешний мир» добавляет временную характеристику, которой нет в οὗτος («этот»), а «от крови и огня» менее точно передаёт δι’ αἵματος καὶ πυρός («через/посредством крови и огня»). Кроме того, в греческом после οἱ μείναντες следует форма второго лица множественного καθαρισθήσεσθε; перевод «те... очистятся» сглаживает эту особенность.
  naturalness: Предлагаемая редакция сохраняет современный литературный регистр. «Скорбь и тягота» естественнее передаёт λύπη καὶ στενοχωρία, чем «скорбь и стеснение», где последнее слово в современном русском легко понимается как неловкость или ограничение.
  terminology: 'Сохранены образные и терминологические связки: «мир», «кровь и огонь», «золото», «испытание», «очищение», «башня». Для σκωρίαν выбран «шлак», более точный для металлургического образа, чем «окалина». Неоднозначные αὐτοῖς и αὐτοῦ не разрешаются в основном тексте.'
