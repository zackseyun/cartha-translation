base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/003.yaml
  text: '"The tower that you see being built, I am the Church, the one shown to you both now and before. Whatever, therefore, you wish to ask about the tower, I will reveal to you, so that you may rejoice with the saints."'
translation:
  language: ru
  text: «Башня, которую ты видишь строящейся, — это я, Церковь, явившаяся тебе и ныне, и прежде. Поэтому о чём бы ты ни захотел спросить относительно башни, спрашивай, и я открою тебе, чтобы ты возрадовался вместе со святыми».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πύργος ὃν βλέπεις οἰκοδομούμενον
  choice: Башня, которую ты видишь строящейся
  rationale: Передаёт настоящее пассивное причастие οἰκοδομούμενον и сохраняет образ продолжающегося строительства.
- source_word: ἐγώ εἰμι ἡ Ἐκκλησία
  choice: это я, Церковь
  rationale: Естественная русская конструкция, сохраняющая прямое отождествление говорящей с Церковью.
- source_word: ἡ ὀφθεῖσά σοι
  choice: являвшаяся тебе
  rationale: Глагол ὁράω в пассиве здесь означает явление в видении; выбранное выражение уместно для повествовательного контекста.
- source_word: ὃ ἂν οὖν θελήσῃς ἐπερωτᾷν
  choice: Поэтому о чём бы ты ни захотел спросить... спрашивай
  rationale: Греческая конструкция содержит обобщённое относительное выражение и повелительное ἐπερωτᾷ; повтор «спросить... спрашивай» сохраняет оба элемента без смыслового расширения.
- source_word: χαρῇς
  choice: возрадовался
  rationale: Дignified literary equivalent suited to sacred and early Christian discourse while remaining understandable in modern Russian.
- source_word: τῶν ἁγίων
  choice: со святыми
  rationale: Сохраняет раннехристианское обозначение принадлежащих Богу людей без уточнения, которое сняло бы возможную смысловую широту.
theological_decisions:
- issue: Отождествление башни, женщины и Церкви
  choice: 'Сохранено прямое: «это я, Церковь»'
  alternative: «башня символизирует Церковь»
  rationale: Оригинал говорит ἐγώ εἰμι ἡ Ἐκκλησία и не формулирует это как отвлечённое толкование символа; прямота и персонификация должны быть сохранены.
- issue: Значение «святых»
  choice: «святые» без пояснения
  alternative: «верующие» или «народ Божий»
  rationale: Такие замены истолковали бы референт вместо сохранения лексической и богословской формулировки источника.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейско-церковным регистром. Синтаксис сделан естественным для русского читателя, но сохранены персонификация Церкви, продолжающееся строительство башни и формальная связь с предшествующим диалогом.
