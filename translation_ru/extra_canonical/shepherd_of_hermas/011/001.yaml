base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/001.yaml
  text: After showing me these things, she wanted to go away. I say to her, "Lady, what profit is it to me to have seen these things and not know what the matters are?" Answering me, she says, "You are a cunning man, wanting to know the things concerning the tower." "Yes, lady," I say, "so that I may report them to the brothers, and that, becoming more cheerful and hearing these things, they may know the Lord in much glory."
translation:
  language: ru
  text: 'Показав мне всё это, она хотела удалиться. Я говорю ей: «Госпожа, какая мне польза от того, что я увидел это, если не знаю, что всё это означает?» Она ответила мне: «Хитёр же ты, человек: хочешь узнать всё, что касается башни». — «Да, госпожа, — говорю я, — чтобы я мог рассказать об этом братьям и чтобы они, ободрившись и услышав всё это, познали Господа в великой славе».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом издании слова, соответствующие выражению «чтобы они, ободрившись, … всё это», заключены в квадратные скобки как текстуально не вполне уверенные.
    reason: Греческий фрагмент καὶ [ἱλαρώτεροι γένωνται, καὶ ταῦτα] отмечен редакционными квадратными скобками. Сноска сообщает об этой текстологической неопределённости, не создавая впечатления, будто слово «услышав» также находится в скобках.
lexical_decisions:
- source_word: ἀποτρέχειν
  choice: удалиться
  rationale: Передаёт намерение женщины уйти после видения естественным и достойным русским языком; буквальное «убежать» здесь излишне резко.
- source_word: τί μοι ὄφελος
  choice: какая мне польза
  rationale: Сохраняет прямой вопрос и смысл практической пользы.
- source_word: τί ἐστιν τὰ πράγματα
  choice: что всё это означает
  rationale: В контексте Герма спрашивает не о существовании предметов, а о значении увиденных явлений; формулировка естественна по-русски.
- source_word: Πανοῦργος
  choice: хитёр
  rationale: Сохраняет лёгкий укор или добродушную проницательность реплики, не усиливая её до «коварный».
- source_word: τὰ περὶ τὸν πύργον
  choice: всё, что касается башни
  rationale: Естественно передаёт широкий оборот о предметах и обстоятельствах, связанных с башней.
- source_word: ἀναγγείλω
  choice: рассказать об этом
  rationale: Передаёт сообщение братьям без неоправданно официального оттенка «возвестить».
- source_word: ἱλαρώτεροι γένωνται
  choice: ободрившись
  rationale: Выражает переход к более радостному, бодрому состоянию и хорошо связывается с последующим причастным оборотом.
- source_word: γινώσκωσιν τὸν Κύριον ἐν πολλῇ δόξῃ
  choice: познали Господа в великой славе
  rationale: Сохраняет необычную и богословски открытую конструкцию оригинала, не уточняя самовольно, относится ли слава к Господу или к способу Его познания.
theological_decisions:
- issue: Связь выражения ἐν πολλῇ δόξῃ с «Господом» и глаголом «познать»
  choice: познали Господа в великой славе
  alternative: познали Господа, обладающего великой славой / познали великую славу Господа
  rationale: Греческий допускает некоторую синтаксическую и смысловую открытость; основной текст сохраняет её и не превращает фразу в более определённое утверждение.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского повествования. Диалог сделан естественным, но сохранены настоящее историческое время («говорю», «говорит/ответила») и обращение «госпожа». Необычная заключительная формула оставлена намеренно открытой.
