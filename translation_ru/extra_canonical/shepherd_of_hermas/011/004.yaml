base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/004.yaml
  text: I say to her, "Lady, since once for all you considered me worthy for everything to be revealed to me, reveal it." She says to me, "Whatever can be revealed to you will be revealed. Only let your heart be toward God, and do not be double-minded in whatever you see."
translation:
  language: ru
  text: 'Я говорю ей: «Госпожа, ведь ты однажды сочла меня достойным того, чтобы открыть мне всё; открой». Она говорит мне: «Тебе будет открыто всё, что возможно открыть. Только пусть сердце твоё будет обращено к Богу, и не сомневайся в том, что увидишь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπεὶ ἅπαξ
  choice: раз уж
  rationale: Передаёт основание просьбы и оттенок ранее данного обещания; тяжеловесное буквальное «поскольку однажды» здесь неестественно.
- source_word: ἠξίών με ἠγήσω
  choice: ты сочла меня достойным
  rationale: Сохраняет значение признания кого-либо достойным, не сводя выражение к простому разрешению.
- source_word: Ὃ ἐὰν ἐνδέχηταί σοι ἀποκαλυφθῆναι
  choice: Тебе будет открыто всё, что возможно открыть
  rationale: 'Передаёт модальность ἐνδέχηται: откроется лишь то, что допускает откровение, без уточнения не названного в тексте ограничения.'
- source_word: ἡ καρδία σου πρὸς τὸν Θεὸν ἤτω
  choice: пусть сердце твоё будет обращено к Богу
  rationale: Естественная русская передача пространственной метафоры πρὸς τὸν Θεόν с сохранением направленности сердца.
- source_word: μὴ διψυχήσῃς
  choice: не сомневайся
  rationale: В данном контексте глагол обозначает внутреннее колебание или сомнение относительно видения; буквальное «не будь двоедушен» звучало бы менее естественно и могло бы ошибочно сузить смысл до лицемерия.
theological_decisions:
- issue: Предел откровения
  choice: «всё, что возможно открыть»
  alternative: «всё, что тебе можно открыть»
  rationale: Греческая конструкция допускает некоторую неоднозначность относительно того, определяется ли возможность самим содержанием или пригодностью адресата. Выбранная формулировка не вводит явно внешнего запрета или оценки духовной зрелости.
- issue: Значение διψυχέω
  choice: «не сомневайся»
  alternative: «не будь двоедушен»
  rationale: Контекст связывает наставление с тем, что Ерм увидит, поэтому на первом плане — сомнение и колебание, а не нравственное лицемерие. Богословский мотив раздвоенности сохраняется как внутренняя неустойчивость.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Диалог передан ясно и без архаизации; настоящее историческое «говорю / говорит» сохранено вслед за греческим текстом.
