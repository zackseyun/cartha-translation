base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/002.yaml
  text: She said, "Many indeed will hear; and, having heard, some of them will rejoice, but some will weep. But even these, if they hear and repent, they too will rejoice. Therefore listen to the parables of the tower, for I will reveal everything to you. And no longer cause me trouble about revelations, for these revelations have an end, for they have been completed. But you will not stop asking for revelations, for you are shameless."
translation:
  language: ru
  text: 'Она сказала: «Многие услышат; услышав, одни из них обрадуются, а другие заплачут. Но и эти, если услышат и покаются, тоже обрадуются. Итак, слушай притчи о башне, потому что я открою тебе всё. И больше не утруждай меня просьбами об откровениях: этим откровениям пришёл конец, ведь они завершены. Но ты не перестанешь просить откровений, потому что ты бесстыден».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσονται
  choice: услышат
  rationale: Будущее время передано прямо; пассивная форма в данном контексте естественно выражается по-русски непереходным глаголом.
- source_word: μετανοήσωσιν
  choice: покаются
  rationale: Сохраняет религиозно-нравственный смысл перемены сердца и обращения от прежнего поведения.
- source_word: παραβολὰς
  choice: притчи
  rationale: Обычный и понятный русский эквивалент для образных истолкований башни.
- source_word: κόπους πάρεχε
  choice: утруждай меня
  rationale: Передаёт идиому «доставлять труды/хлопоты» естественным и достойным русским выражением.
- source_word: ἀποκαλύψεις
  choice: откровения
  rationale: Сохраняет повтор ключевого термина и его смысл как сообщаемых свыше тайн.
- source_word: ἀναιδὴς
  choice: бесстыден
  rationale: Прямо передаёт резкое, шутливо-укоризненное обозначение назойливой смелости, не смягчая его до «настойчив».
theological_decisions:
- issue: Условие радости плачущих
  choice: «если услышат и покаются»
  alternative: «если послушаются и покаются»
  rationale: Сохранено буквальное значение ἀκούσωσιν и связь с повторяющимся мотивом слышания; возможный оттенок внимательного принятия не превращён явно в послушание.
- issue: Завершённость откровений
  choice: «этим откровениям пришёл конец, ведь они завершены»
  alternative: «у этих откровений есть предел, ибо они исполнились»
  rationale: Передаётся утверждение текста о завершённости данного ряда откровений без вывода о прекращении всякого откровения вообще.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но ясным повествовательным регистром. Повторы «услышат/услышав» и «откровения» сохранены как значимые элементы греческого текста; резкость заключительного упрёка также сохранена.
