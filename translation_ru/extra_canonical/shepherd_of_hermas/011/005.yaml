base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/011/005.yaml
  text: 'I asked her, "Why has the tower been built upon the waters, lady?" She says, "I told you before also, and you inquire diligently; therefore, by inquiring, you find the truth. Why, then, the tower has been built upon the waters—listen: because your life was saved through water and will be saved. And the tower has been founded by the word of the almighty and glorious Name, and is held fast by the unseen power of the Master."'
translation:
  language: ru
  text: 'Я спросил её: «Госпожа, почему башня построена на водах?» Она сказала: «Я говорила тебе об этом и прежде, а ты продолжаешь усердно исследовать. Исследуя, ты находишь истину. Так послушай же, почему башня построена на водах: потому что ваша жизнь была спасена через воду и будет спасена. Башня же основана словом всемогущего и славного Имени и держится невидимой силой Владыки».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ ὑδάτων
  choice: на водах
  rationale: Сохраняет образ и множественное число греческого текста; естественно перекликается с библейской речью, не уточняя природу вод.
- source_word: ἐκζητεῖς ἐπιμελῶς
  choice: продолжаешь усердно исследовать
  rationale: Передаёт настойчивый, тщательный поиск; «продолжаешь» естественно связывает реплику с прежним объяснением.
- source_word: διὰ ὕδατος
  choice: через воду
  rationale: Формально сохраняет средство или посредство спасения и не подменяет неоднозначный образ явным толкованием как крещения.
- source_word: τῷ ῥήματι
  choice: словом
  rationale: Передаёт дательный средства или основания без излишней конкретизации значения ῥῆμα.
- source_word: τοῦ παντοκράτορος καὶ ἐνδόξου ὀνόματος
  choice: всемогущего и славного Имени
  rationale: Сохраняет олицетворённо-сакральное употребление «Имени» и оба определения; прописная буква указывает на титульный характер.
- source_word: κρατεῖται
  choice: держится
  rationale: Естественно передаёт поддержание и сохранение башни силой Владыки, не сужая образ до одного архитектурного действия.
- source_word: τοῦ δεσπότου
  choice: Владыки
  rationale: Достоинственно и точно передаёт верховную власть δεσπότης в религиозном контексте.
theological_decisions:
- issue: Значение спасения «через воду»
  choice: Сохранить формулировку «через воду» без пояснения в основном тексте
  alternative: Передать как прямую ссылку на крещение
  rationale: Контекст допускает крещальную интерпретацию, однако сама фраза не называет крещение прямо; перевод сохраняет богословскую напряжённость и образность оригинала.
- issue: Основание башни словом Имени
  choice: Сохранить необычную конструкцию «утверждена словом ... Имени»
  alternative: Сгладить как «основана на слове всемогущего и славного Бога»
  rationale: Оригинал связывает ῥῆμα именно с «Именем»; замена «Имени» на «Бога» устранила бы значимый образ и внесла толкование.
- issue: Временная перспектива спасения
  choice: «была спасена ... и будет спасена»
  alternative: Обобщающее «спасается»
  rationale: Сохраняются аорист и будущее время греческого текста, не устраняется различие между уже совершившимся и будущим спасением.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского видения. Диалог передан ясно и естественно; ключевые образы воды, башни, Имени и невидимой силы сохранены без конфессионального уточнения.
