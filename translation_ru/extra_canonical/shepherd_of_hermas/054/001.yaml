base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/001.yaml
  text: 'While I was sitting in my house and glorifying the Lord for all the things I had seen, and pondering the commandments—that they are good and powerful and gladdening and glorious and able to save a person’s soul—I said within myself: “Blessed shall I be if I walk in these commandments, and whoever walks in them will be blessed.”'
translation:
  language: ru
  text: 'Когда я сидел у себя дома, прославляя Господа за всё, что увидел, и размышляя о заповедях — о том, что они добры, сильны, радостны, славны и способны спасти человеческую душу, — я говорил про себя: «Блажен буду я, если буду жить по этим заповедям; и всякий, кто будет жить по ним, будет блажен».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζων
  choice: прославляя
  rationale: Прямо передаёт религиозный смысл прославления Господа и естественно звучит по-русски.
- source_word: συζητῶν
  choice: размышляя
  rationale: В данном контексте внутреннего обдумывания заповедей это естественнее буквального «обсуждая».
- source_word: ἱλαραὶ
  choice: радостны
  rationale: 'Сохраняет положительную эмоциональную окраску слова: заповеди несут радость и отраду.'
- source_word: δυνάμεναι σῶσαι ψυχὴν ἀνθρώπου
  choice: способны спасти человеческую душу
  rationale: Сохраняет модальность способности и явное упоминание души человека.
- source_word: ταῖς ἐντολαῖς ταύταις πορευθῶ
  choice: стану жить по этим заповедям
  rationale: Греческая метафора «ходить в заповедях» передаёт образ жизни; современное русское выражение ясно выражает этот смысл без неестественного буквализма.
- source_word: Μακάριος
  choice: блажен
  rationale: Сохраняет традиционный религиозный оттенок и смысл благословенного, счастливого состояния.
theological_decisions:
- issue: Спасительная действенность заповедей
  choice: «способны спасти человеческую душу»
  alternative: «могут спасти душу человека»
  rationale: Формулировка сохраняет утверждение источника без пояснения механизма спасения и без привнесения конфессиональной системы.
- issue: Условность блаженства при следовании заповедям
  choice: «если стану жить по этим заповедям»
  alternative: «если буду соблюдать эти заповеди»
  rationale: Сохранён условный характер высказывания и более широкий смысл πορεύομαι как жизненного пути, а не только исполнения отдельных предписаний.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной раннехристианской интонацией. Синтаксис упрощён лишь настолько, чтобы длинная греческая фраза оставалась ясной; внутренняя речь и последовательность характеристик заповедей сохранены.
