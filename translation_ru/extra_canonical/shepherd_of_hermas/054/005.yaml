base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/005.yaml
  text: And after he had spoken these things with me, he says to me, “Let us go into the country, and I will show you the shepherds of the sheep.” “Let us go, sir,” I say. And we came to a certain plain, and he shows me a shepherd, a young man, clothed in a composite garment, saffron in color.
translation:
  language: ru
  text: 'После того как он поговорил со мной обо всём этом, он говорит мне: «Пойдём в поле, и я покажу тебе пастухов овец». Я отвечаю: «Пойдём, господин». Мы пришли на некую равнину, и он показывает мне пастуха — юношу, одетого в одеяние, составленное из нескольких частей, шафранового цвета.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγρόν
  choice: в поле
  rationale: Греческое слово обозначает сельскую местность или поле; в данном контексте движение к открытой равнине естественно передаётся как «в поле».
- source_word: κύριε
  choice: господин
  rationale: Это почтительное обращение к собеседнику; строчная буква не отождествляет его с Господом Богом.
- source_word: πεδίον
  choice: равнина
  rationale: Передаёт открытую ровную местность и сохраняет отличие от ἀγρόν.
- source_word: σύνθεσιν ἱματίων
  choice: составное одеяние
  rationale: Буквально необычное выражение указывает на одежду, составленную из нескольких частей или элементов; перевод сохраняет неопределённость ее точного вида.
- source_word: κροκώδη
  choice: шафранового цвета
  rationale: Обозначает шафрановый, жёлто-оранжевый оттенок одежды.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением повествовательного настоящего греческого текста («говорит», «показывает»). Обращение «господин» звучит почтительно и не вносит христологического отождествления. Необычность описания одежды сохранена, а не истолкована как конкретный известный тип облачения.
