base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/004.yaml
  text: “You, therefore, who are repenting, cast off the evils of this age that wear you down; and having put on every virtue of righteousness, you will be able to keep these commandments and no longer add to your sins. If, therefore, you add nothing further, you will depart from your former sins. Walk, therefore, in these my commandments, and you will live to God. These things [all] have been spoken to you by me.”
translation:
  language: ru
  text: Итак, вы, кающиеся, отбросьте пороки этого века, которые изнуряют вас. Облекшись же во всякую добродетель праведности, вы сможете соблюдать эти заповеди и больше не прибавлять ничего к своим грехам. Поэтому, если вы больше ничего к ним не прибавите, то откажетесь от своих прежних грехов. Итак, следуйте этим моим заповедям — и будете жить для Бога. Всё это сказано вам мною.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописях перед «сказано» стоит «всё»; это слово включено в перевод.
    reason: Греческое πάντα заключено издателями в квадратные скобки как текстуально сомнительное, поэтому вариант отмечен для читателя.
lexical_decisions:
- source_word: οἱ ... μετανοοῦντες
  choice: вы, кающиеся
  rationale: Причастие передано как прямое обращение к тем, кто совершает покаяние; сохранён процессуальный оттенок настоящего времени.
- source_word: τὰς πονηρίας τοῦ αἰῶνος τούτου
  choice: пороки этого века
  rationale: «Пороки» естественно охватывает нравственное зло во множественном числе, а «этого века» сохраняет раннехристианскую эсхатологическую формулу.
- source_word: τὰς ἐκτριβούσας ὑμᾶς
  choice: которые изнуряют вас
  rationale: ἐκτρίβω может означать истощение, изматывание или губительное воздействие; «изнуряют» сохраняет интенсивность без неестественного буквализма.
- source_word: ἐνδυσάμενοι
  choice: облекшись
  rationale: Сохранён образ надевания нравственных качеств, значимый для раннехристианской речи.
- source_word: πᾶσαν ἀρετὴν δικαιοσύνης
  choice: во всякую добродетель праведности
  rationale: Формально необычное греческое сочетание сохранено, а не сведено к более узкому толкованию вроде «все праведные добродетели».
- source_word: μηκέτι προστιθέναι ταῖς ἁμαρτίαις ὑμῶν
  choice: больше не прибавлять ничего к своим грехам
  rationale: Сохранена метафора накопления грехов; «ничего» ясно выражает подразумеваемый объект с учётом следующего предложения.
- source_word: ἀποστήσεσθε ἀπὸ
  choice: отступите от
  rationale: Передаёт отделение и прекращение связи с прежними грехами, не подменяя его более сильным утверждением об отпущении.
- source_word: πορεύεσθε ... ταῖς ἐντολαῖς
  choice: следуйте ... заповедям
  rationale: Русское «следуйте заповедям» естественно передаёт семитизированную метафору хождения согласно заповедям.
- source_word: ζήσεσθε τῷ Θεῷ
  choice: будете жить для Бога
  rationale: Сохранён дательный Θεῷ как направленность жизни к Богу; фраза не истолкована как простое обещание физической жизни.
theological_decisions:
- issue: Связь прекращения новых грехов с прежними грехами
  choice: «отступите от своих прежних грехов»
  alternative: «освободитесь от своих прежних грехов» / «вам простятся прежние грехи»
  rationale: Глагол ἀφίστημι здесь буквально указывает на удаление или отступление. Перевод не превращает наставление в недвусмысленное утверждение о механизме прощения и сохраняет нравственное напряжение текста.
- issue: Значение ζήσεσθε τῷ Θεῷ
  choice: «будете жить для Бога»
  alternative: «будете живы пред Богом»
  rationale: Дательный допускает смысл отношения или направленности. Основной текст использует наиболее естественную русскую формулировку, не уточняя, идёт ли речь преимущественно о посвящённой Богу жизни или о жизни в Его присутствии.
- issue: Обращение с притяжательным местоимением в «Моим» и «Мною»
  choice: прописная буква
  alternative: строчная буква
  rationale: Говорящий выступает как небесный посланник-наставник в повествовании; прописная буква следует принятой русской издательской практике уважительного обозначения сакрального говорящего, не утверждая его тождество с Богом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой («кающиеся», «облекшись», «праведность»). Императивы и повтор «итак» сохранены ради увещательного строя оригинала. Местоимения в обращении переданы во множественном числе, как в греческом тексте.
