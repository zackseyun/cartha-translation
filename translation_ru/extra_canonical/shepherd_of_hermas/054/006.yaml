base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/006.yaml
  text: He was pasturing very many sheep, and the sheep were as if luxuriating and being very extravagant, and they were cheerful, skipping here and there. And the shepherd himself was very cheerful over his flock; and the very appearance of the shepherd was exceedingly cheerful, and he ran around among the sheep.
translation:
  language: ru
  text: Он пас великое множество овец. Овцы словно наслаждались роскошью и предавались излишествам; они весело скакали туда и сюда. Сам пастух очень радовался своему стаду; даже вид у него был чрезвычайно радостный, и он бегал среди овец.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡσεὶ τρυφῶντα
  choice: словно наслаждались роскошью
  rationale: Передаёт сравнительное ὡσεὶ и оттенок изнеженного, роскошного удовольствия в τρυφάω, не сводя выражение к нейтральному «наслаждались».
- source_word: λίαν σπαταλῶντα
  choice: предавались излишествам
  rationale: Σπαταλάω обозначает расточительную, невоздержанную, исполненную удовольствий жизнь; выбранная формулировка естественна по-русски и сохраняет нравственно настораживающий оттенок.
- source_word: ἱλαρά / ἱλαρός
  choice: весело / радовался / радостный
  rationale: Повторяющийся корень передан словами одного смыслового поля; небольшое варьирование необходимо для естественного русского синтаксиса.
- source_word: περιέτρεχε
  choice: бегал среди овец
  rationale: Передаёт движение пастуха туда и обратно внутри стада без излишне буквального и неестественного «обегал вокруг».
