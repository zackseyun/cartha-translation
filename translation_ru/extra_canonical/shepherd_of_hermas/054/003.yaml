base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/003.yaml
  text: “These commandments are beneficial for those who are about to repent; for if they do not walk in them, their repentance is in vain.
translation:
  language: ru
  text: Эти заповеди полезны тем, кто намерен покаяться; ведь если они не будут поступать по ним, их покаяние напрасно.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμφοροί
  choice: полезны
  rationale: Передаёт значение пользы и благотворности без усиления до «необходимы».
- source_word: τοῖς μέλλουσι μετανοεῖν
  choice: тем, кто намерен покаяться
  rationale: Μέλλω здесь указывает на предстоящее или предполагаемое действие; «намерен» естественно передаёт это по-русски, сохраняя направленность к покаянию.
- source_word: πορευθῶσιν ἐν αὐταῖς
  choice: будут поступать по ним
  rationale: Греческая метафора хождения по заповедям передана естественным современным русским выражением, обозначающим практическое исполнение.
- source_word: εἰς μάτην
  choice: напрасно
  rationale: Кратко и точно передаёт тщетность, не добавляя богословского истолкования.
theological_decisions:
- issue: Связь покаяния с исполнением заповедей
  choice: Сохранено прямое утверждение, что покаяние без соответствующей жизни напрасно.
  alternative: Смягчить до «не приносит плода» или пояснить покаяние как недействительное.
  rationale: Источник формулирует напряжённую связь между покаянием и поведением; перевод не должен ни ослаблять её, ни превращать в конфессиональное определение действенности покаяния.
translation_notes:
  register: Современный литературный русский язык; краткая наставительная фраза с сохранением причинной связи оригинала. Местоимение «они» отнесено к кающимся, а «по ним» — к заповедям.
