base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/054/002.yaml
  text: 'As I was saying these things within myself, I suddenly see him seated beside me and saying this: “Why are you double-minded about the commandments that I commanded you? They are good. Do not be double-minded at all, but clothe yourself with the faith of the Lord, and you will walk in them; for I will strengthen you in them.'
translation:
  language: ru
  text: 'Когда я говорил это про себя, вдруг увидел, что он сидит рядом со мной и говорит: «Почему ты колеблешься относительно заповедей, которые я дал тебе? Они добры. Нисколько не колеблись, но облекись в веру Господа[a] — и будешь жить по этим заповедям, потому что я укреплю тебя, чтобы ты исполнял их».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «облекись в веру в Господа». Греческое выражение допускает оба понимания.'
    reason: Сохраняет неоднозначность родительного оборота πίστιν τοῦ Κυρίου и указывает привычное объектное прочтение, не навязывая его основному тексту.
lexical_decisions:
- source_word: διψυχεῖς / διψυχήσῃς
  choice: сомневаешься / не сомневайся
  rationale: Греческое слово буквально связано с раздвоенностью души, но здесь обозначает внутреннее колебание относительно исполнимости заповедей. «Сомневаться» естественно передаёт смысл в современном русском языке, а повтор сохраняет настойчивость оригинала.
- source_word: ἔνδυσαι
  choice: облекись
  rationale: Сохранена яркая метафора надевания веры как одежды; глагол «облечься» уместен в возвышенной религиозной прозе и понятен современному читателю.
- source_word: πορεύσῃ ἐν αὐταῖς
  choice: будешь жить по этим заповедям
  rationale: Буквально выражение означает «будешь ходить в них». Русское «жить по заповедям» естественно передаёт образ постоянного образа жизни, не сводя смысл к отдельным поступкам.
- source_word: ἐνδυναμώσω σε ἐν αὐταῖς
  choice: дам тебе силу исполнять их
  rationale: Передаёт обещание наделить адресата силой применительно к заповедям. Буквальное «укреплю тебя в них» по-русски неясно и неестественно.
theological_decisions:
- issue: Значение родительного оборота πίστιν τοῦ Κυρίου
  choice: веру Господа
  alternative: веру в Господа
  rationale: 'Основной текст сохраняет формальную неоднозначность греческого родительного падежа: речь может идти как о вере, связанной с Господом или исходящей от Него, так и о вере, направленной на Господа. Возможное объектное понимание отмечено в сноске.'
- issue: Соотношение исполнения заповедей и даруемой силы
  choice: сохранено прямое обещание «я дам тебе силу исполнять их»
  alternative: обобщить как самостоятельную способность человека соблюдать заповеди
  rationale: Оригинал связывает возможность жить по заповедям с силой, которую говорящий обещает дать; перевод не уточняет сверх текста природу или способ этого укрепления.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Синтаксис упрощён для ясности, но внезапность видения, повтор запрета сомневаться и метафора облачения сохранены.
