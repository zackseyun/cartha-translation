    issue: «Сомневаешься в заповедях»
    rationale: διψυχεῖν περὶ выражает колебание или раздвоенность мысли относительно предмета; русский предлог «в» может создать более узкий смысл сомнения в достоверности либо ценности самих заповедей.
  - severity: low
    issue: «Я дам тебе силу исполнять их»
    rationale: ἐνδυναμώσω σε ἐν αὐταῖς буквально говорит об укреплении адресата «в них», то есть в сфере соблюдения заповедей. Перевод нужно сделать ясным, не сводя укрепление к безличной передаче силы.
