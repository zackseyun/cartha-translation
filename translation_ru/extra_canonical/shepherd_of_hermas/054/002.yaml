  to: 'Когда я говорил это про себя, вдруг увидел, что он сидит рядом со мной и говорит: «Почему ты колеблешься относительно заповедей, которые я дал тебе? Они добры. Нисколько не колеблись, но облекись в веру Господа[a] — и будешь жить по этим заповедям, потому что я укреплю тебя, чтобы ты исполнял их».'
