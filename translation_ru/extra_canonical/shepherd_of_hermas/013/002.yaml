base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/002.yaml
  text: “And the ones drawn up from the deep and set into the building and fitting together at their joints with the other stones already built—who are they?” “These are the ones who suffered on account of the name of the Lord.”
translation:
  language: ru
  text: '— А те камни, которые извлекают из глубины, укладывают в сооружение и которые стыкуются с другими камнями, уже встроенными в него, — кто они?


    — Это те, кто пострадал за имя Господа.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τοῦ βυθοῦ ἑλκόμενοι
  choice: которые поднимают из глубины
  rationale: Передаёт образ камней, извлекаемых снизу; «глубина» сохраняет широкое значение βυθός и не уточняет его как море или бездну.
- source_word: ἐπιτιθέμενοι εἰς τὴν οἰκοδομήν
  choice: укладывают в постройку
  rationale: В контексте строительства естественно передаёт помещение камней в возводимое сооружение.
- source_word: συμφωνοῦντες ταῖς ἁρμογαῖς αὐτῶν
  choice: своими стыками сходятся
  rationale: Сохраняет строительную метафору точного соответствия камней друг другу без неестественного буквального «согласуются сочленениями».
- source_word: οἱ παθόντες
  choice: те, кто пострадал
  rationale: Нейтрально передаёт аорист πάσχω и не сужает смысл до мученической смерти, которой греческий текст прямо не утверждает.
- source_word: ἕνεκεν τοῦ ὀνόματος τοῦ Κυρίου
  choice: за имя Господа
  rationale: Естественная русская формула, сохраняющая причинный смысл и богословски значимое выражение «имя Господа».
theological_decisions:
- issue: Характер страдания названных людей
  choice: «кто пострадал», без уточнения вида или исхода страданий
  alternative: «мученики» или «те, кто умер мученической смертью»
  rationale: παθόντες означает перенёсших страдание, но само по себе не утверждает их смерти; перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского визионерского повествования. Вопрос и ответ оформлены как прямая речь; строительная образность сохранена, синтаксис сделан естественным для широкого круга читателей.
