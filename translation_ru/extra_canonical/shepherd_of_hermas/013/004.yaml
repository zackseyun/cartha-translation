base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/004.yaml
  text: “And the ones being brought and set into the building—who are they?” “They are new in the faith and faithful. But they are being admonished by the angels to do good, because evil was found in them.”
translation:
  language: ru
  text: '— А те, кого приводят и помещают в строение, кто они?


    — Это новообращённые и верующие. Ангелы наставляют их делать добро, потому что в них обнаружилось зло.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγόμενοι καὶ τιθέμενοι
  choice: приносят и укладывают
  rationale: Сохраняет строительный образ камней, которые доставляют и помещают в сооружение.
- source_word: Νέοι ... ἐν τῇ πίστει
  choice: новообращённые
  rationale: Естественно передаёт людей, недавно пришедших к вере, без буквального и неясного «новые в вере».
- source_word: πιστοί
  choice: верные Богу
  rationale: Передаёт самостоятельное сказуемое «верные» и позволяет отличить его от предыдущего выражения о вере; дополнение «Богу» ясно по религиозному контексту.
- source_word: νουθετοῦνται
  choice: наставляют
  rationale: Глагол означает вразумление и нравственное наставление, а не обязательно порицание.
- source_word: εἰς τὸ ἀγαθοποιεῖν
  choice: делать добро
  rationale: Прямое и естественное выражение целевого значения конструкции.
- source_word: πονηρία
  choice: зло
  rationale: Сохраняет широкое значение нравственного зла; более конкретные варианты вроде «порочность» чрезмерно уточняют.
theological_decisions:
- issue: Соотношение «новые в вере» и «верные»
  choice: Это новообращённые, верные Богу
  alternative: Они новы в вере и верующие
  rationale: Греческий текст содержит два определения. Перевод сохраняет оба, не превращая второе в повтор первого.
- issue: Наличие зла в людях, названных верными
  choice: потому что в них обнаружилось зло
  alternative: потому что в них была найдена порочность
  rationale: 'Сохранено напряжение исходного текста: эти люди верны, но всё же нуждаются в наставлении из-за обнаруженного в них зла.'
translation_notes:
  register: Современный литературный русский язык с ясным, достойным тоном. Диалогическое оформление восстановлено по смене говорящих в контексте. Строительная метафора сохранена.
