revisions:
- from: Теперь послушай о камнях, идущих в кладку. Итак, камни четырёхугольные, белые и хорошо пригнанные друг к другу своими стыками — это апостолы, епископы, учители и диаконы, которые жили в благоговейном достоинстве Божьем и чисто и благоговейно надзирали за избранными Божьими, учили их и служили им. Одни из них уже уснули, а другие ещё живы. Они всегда были согласны друг с другом, жили между собой в мире и слушались друг друга. Поэтому и в кладке башни их стыки хорошо сходятся.
  to: Теперь послушай о камнях, идущих в кладку. Итак, камни четырёхугольные, белые и пригнанные друг к другу своими стыками — это апостолы, епископы, учители и диаконы, которые жили сообразно с благоговейным достоинством Божьим и чисто и благоговейно надзирали за избранными Божьими, учили их и служили им. Одни из них уснули, а другие ещё живы. Они всегда были согласны друг с другом, жили между собой в мире и слушали друг друга. Поэтому в кладке башни их стыки сходятся друг с другом.
  rationale: Исправлены смысловое сужение в «слушались» и не обусловленные оригиналом усиления «хорошо». Формулировка о σεμνότης τοῦ Θεοῦ немного перестроена для естественности русского языка, но сохраняет генитивную и смысловую напряжённость греческого выражения без конфессионального истолкования.
