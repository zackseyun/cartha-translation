base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/001.yaml
  text: “Listen now about the stones that go into the building. The stones, then, that are square and white and that fit together at their joints—these are the apostles and bishops and teachers and deacons, who walked in the reverent dignity of God and who oversaw and taught and served God’s elect with purity and reverence—some have fallen asleep, and some are still alive. They were always in agreement with one another, had peace among themselves, and listened to each other; for this reason their joints fit in the building of the tower.
translation:
  language: ru
  text: Теперь послушай о камнях, идущих в кладку. Итак, камни четырёхугольные, белые и пригнанные друг к другу своими стыками — это апостолы, епископы, учители и диаконы, которые жили сообразно с благоговейным достоинством Божьим и чисто и благоговейно надзирали за избранными Божьими, учили их и служили им. Одни из них уснули, а другие ещё живы. Они всегда были согласны друг с другом, жили между собой в мире и слушали друг друга. Поэтому в кладке башни их стыки сходятся друг с другом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπαγόντων εἰς τὴν οἰκοδομήν
  choice: идущих в кладку
  rationale: В контексте камней и башни οἰκοδομή означает не отвлечённое «строительство», а возводимую кладку; выражение сохраняет образ движения камней на своё место.
- source_word: τετράγωνοι
  choice: четырёхугольные
  rationale: Прямо передаёт форму камней, не уточняя сверх греческого текста «квадратные» или «кубические».
- source_word: συμφωνοῦντες ταῖς ἁρμογαῖς αὐτῶν
  choice: хорошо пригнанные друг к другу своими стыками
  rationale: Передаёт строительную метафору согласования поверхностей камней естественным русским языком и подготавливает её нравственное истолкование далее.
- source_word: σεμνότης τοῦ Θεοῦ
  choice: благоговейное достоинство Божье
  rationale: Сохраняет сочетание почтительности, серьёзности и достойного поведения в σεμνότης, а также неоднозначную связь с Богом.
- source_word: ἐπισκοπήσαντες
  choice: надзирали
  rationale: Сохраняет словесную связь со служением ἐπίσκοποι и передаёт попечение и надзор без анахроничного административного оттенка.
- source_word: διακονήσαντες
  choice: служили
  rationale: Естественный эквивалент, сохраняющий связь с существительным «диаконы» без искусственного глагола «диаконствовали».
- source_word: κεκοιμημένοι
  choice: уснули
  rationale: Сохраняет раннехристианский эвфемистический образ смерти, а не раскрывает его пояснительным переводом.
- source_word: ἀλλήλων ἤκουον
  choice: слушались друг друга
  rationale: В данном ряду выражение подразумевает не только слышание, но взаимное принятие наставления; русский вариант естественно передаёт этот смысл.
theological_decisions:
- issue: Значение выражения κατὰ τὴν σεμνότητα τοῦ Θεοῦ
  choice: жили в благоговейном достоинстве Божьем
  alternative: поступали с достоинством, угодным Богу
  rationale: Выбранный вариант не добавляет отсутствующего в тексте понятия «угодности» и сохраняет необычную, богословски напряжённую формулировку оригинала.
- issue: Адресаты трёх служебных глаголов
  choice: надзирали за избранными Божьими, учили их и служили им
  alternative: надзирали, учили и служили избранным Божьим
  rationale: Местоимения делают общий дательный τοῖς ἐκλεκτοῖς τοῦ Θεοῦ ясным для всех трёх глаголов, не меняя референции.
- issue: Состояние уснувших служителей
  choice: уже уснули
  alternative: уже умерли
  rationale: Сохранена метафора оригинала без догматического разъяснения её антропологических следствий.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Синтаксис слегка упрощён относительно длинного греческого периода, но параллелизм перечней и переход от буквальной кладки к взаимному согласию служителей сохранены.
