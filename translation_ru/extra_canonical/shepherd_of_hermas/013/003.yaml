base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/003.yaml
  text: “I want to know who the other stones are that are being carried from the dry land, lady.” She said, “Those that go into the building without being hewn—the Lord approved these, because they walked in the uprightness of the Lord and kept his commandments.”
translation:
  language: ru
  text: '«Я хочу знать, госпожа, кто такие другие камни, которые приносят с суши». Она сказала: «Тех, что поступают в строение без обтёсывания, Господь счёл достойными, потому что они жили в правоте перед Господом и исполняли Его заповеди».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κυρία
  choice: госпожа
  rationale: Прямое и естественное обращение к персонифицированной Церкви; сохраняет уважительный тон греческого текста.
- source_word: ἀπὸ τῆς ξηρᾶς
  choice: с суши
  rationale: Буквально передаёт противопоставление суши ранее упомянутой глубине.
- source_word: μὴ λατομουμένους
  choice: без обтёсывания
  rationale: В строительном образе речь о камнях, не нуждающихся в обработке; «обтёсывание» естественно по-русски и сохраняет метафору.
- source_word: ἐδοκίμασεν
  choice: признал годными
  rationale: Передаёт не только испытание, но и положительный итог проверки в контексте отбора камней для постройки.
- source_word: ἐπορεύθησαν ἐν τῇ εὐθύτητι τοῦ Κυρίου
  choice: следовали прямым путём Господа
  rationale: Сохраняет образ хождения и идею нравственной прямоты, избегая неестественного буквального «ходили в прямоте».
- source_word: κατωρθώσαντο τὰς ἐντολὰς αὐτοῦ
  choice: исполняли Его заповеди
  rationale: Контекстуально передаёт успешное соблюдение заповедей; современная и ясная русская формулировка.
theological_decisions:
- issue: Смысл одобрения Господом
  choice: «признал годными»
  alternative: «испытал» / «одобрил»
  rationale: Греческое ἐδοκίμασεν может обозначать испытание и последующее одобрение. В образе строительных камней «признал годными» удерживает оба оттенка, не вводя учения о заслугах.
- issue: Образ «прямоты Господа»
  choice: «следовали прямым путём Господа»
  alternative: «жили в праведности Господа»
  rationale: Выбранный вариант сохраняет метафору пути в ἐπορεύθησαν и нравственную прямоту εὐθύτης, не отождествляя её однозначно с вменённой или собственной праведностью.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Сохранены строительная метафора, обращение «госпожа» и образ пути; синтаксис сделан естественным для широкого круга читателей.
