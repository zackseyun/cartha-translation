base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/013/005.yaml
  text: '“And those whom they were casting away and throwing aside—who are they?” “These are people who have sinned and want to repent. For this reason they were not flung far away outside the tower, because they will be useful for the building, if they repent. Therefore those who are going to repent—if they repent—will be strong in the faith, if they repent now, while the tower is being built. But if the building is completed, they no longer have a place, but will be cast out. But they have only this: to lie beside the tower.”'
translation:
  language: ru
  text: '— А те, которых они отбрасывали и отшвыривали, кто они?


    — Это согрешившие, которые хотят покаяться. Поэтому их не отбросили далеко за пределы башни: если они покаются, то будут пригодны для строительства. Итак, те, кому ещё предстоит покаяться, станут крепки в вере, если покаются сейчас, пока строится башня. Но когда строительство будет завершено, места для них уже не будет, и они будут выброшены. Им останется только лежать возле башни.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέβαλλον καὶ ἔριττον
  choice: отбрасывали и отшвыривали
  rationale: Передаёт два близких по значению глагола и сохраняет образ камней, удаляемых со стройки.
- source_word: θέλοντες μετανοῆσαι
  choice: которые хотят покаяться
  rationale: Сохраняет буквальное значение желания или намерения покаяться, не представляя покаяние уже совершившимся.
- source_word: εὔχρηστοι
  choice: пригодны
  rationale: Естественно передаёт практическую пригодность камней для строительства.
- source_word: ἰσχυροὶ ... ἐν τῇ πίστει
  choice: крепки в вере
  rationale: Достоинная и понятная формулировка, близкая к греческому образу силы.
- source_word: ἔκβολοι
  choice: отвергнутыми
  rationale: Передаёт состояние выброшенных или исключённых; в контексте сохраняет как строительный, так и нравственно-религиозный оттенок.
- source_word: παρὰ τῷ πύργῳ κεῖσθαι
  choice: лежать возле башни
  rationale: Сохраняет конкретный пространственный образ камней рядом с башней.
theological_decisions:
- issue: Условность восстановления согрешивших
  choice: если они покаются
  alternative: поскольку они покаются
  rationale: Греческое ἐὰν с сослагательным наклонением выражает реальное условие, а не гарантированный исход.
- issue: Срок для покаяния
  choice: сейчас, пока строится башня
  alternative: в нынешней жизни
  rationale: Сохранён образный язык оригинала без навязывания конкретной эсхатологической схемы.
- issue: οἱ μέλλοντες μετανοεῖν и повтор условия
  choice: те, кому ещё предстоит покаяться, станут крепки в вере, если покаются сейчас
  alternative: те, кто намерен покаяться, если покаются, станут крепки в вере, если покаются сейчас
  rationale: Греческая фраза содержит тяжёлое повторение; перевод сохраняет условность и временной акцент, но устраняет неестественную для русского тройную конструкцию.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского назидательного текста. Диалог и строительная метафора сохранены; синтаксис слегка сглажен ради ясности, без устранения богословского напряжения между возможностью покаяния и ограниченностью времени.
