revisions:
- from: 'Он говорит: «В первой заповеди я велел тебе хранить веру, страх и воздержание». — «Да, господин», — отвечаю я. «Теперь же, — говорит он, — я хочу открыть тебе и их силы, чтобы ты понял, какую силу и какое действие имеет каждое из них. Ведь действия их двояки: они относятся к праведному и неправедному. Итак, верь праведному, а неправедному не верь, потому что у праведного путь прямой, а у неправедного — кривой. Ты же иди прямым [и ровным][a] путём, а кривой оставь».'
  to: 'Он говорит: «В первой заповеди я велел тебе хранить веру, страх и воздержание». — «Да, господин», — отвечаю я. «Теперь же, — говорит он, — я хочу открыть тебе и их силы, чтобы ты понял, какую силу и какое действие имеет каждое из них. Ведь их действия двояки: они связаны как с праведностью, так и с неправедностью. Итак, доверяй праведности, а неправедности не доверяй, потому что у праведности путь прямой, а у неправедности — кривой. Ты же иди прямым [и ровным][a] путём, а кривой оставь».'
  rationale: Исправлены только передача κεῖνται ἐπὶ δικαίῳ καὶ ἀδίκῳ и обусловленные ею формы «праведность/неправедность». Правка усиливает точность по греческому тексту, улучшает связность метафоры двух путей и не конкретизирует спорный референт как ангела либо человека. Скобочное чтение и его сноска сохранены.
