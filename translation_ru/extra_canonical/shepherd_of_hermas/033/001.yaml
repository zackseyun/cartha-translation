base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/033/001.yaml
  text: He says, “I commanded you in the first commandment to keep faith and fear and self-control.” “Yes, lord,” I say. “But now,” he says, “I also want to make known to you their powers, so that you may understand what power and activity each of them has. For their activities are twofold; so they are set over the righteous and the unrighteous. So you—trust the righteous, but do not trust the unrighteous; for righteousness has a straight path, but unrighteousness a crooked one. But you, walk on the straight [and level] path, and leave the crooked.
translation:
  language: ru
  text: 'Он говорит: «В первой заповеди я велел тебе хранить веру, страх и воздержание». — «Да, господин», — отвечаю я. «Теперь же, — говорит он, — я хочу открыть тебе и их силы, чтобы ты понял, какую силу и какое действие имеет каждое из них. Ведь их действия двояки: они связаны как с праведностью, так и с неправедностью. Итак, доверяй праведности, а неправедности не доверяй, потому что у праведности путь прямой, а у неправедности — кривой. Ты же иди прямым [и ровным][a] путём, а кривой оставь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «и ровным» отсутствуют в части рукописной традиции.
    reason: Квадратные скобки в исходном издании отмечают текстологически неуверенное чтение; примечание поясняет это читателю.
lexical_decisions:
- source_word: φυλάξῃς
  choice: хранить
  rationale: Передаёт не только соблюдение, но и бережное сохранение веры, страха и воздержания.
- source_word: πίστιν
  choice: веру
  rationale: Сохраняет широкий смысл πίστις без сужения до верности или доверия; далее глагол πιστεύω передан как «верить».
- source_word: φόβον
  choice: страх
  rationale: Формально сохраняет θεологически значимое понятие; источник здесь не уточняет его как благоговение или страх Божий.
- source_word: ἐγκράτειαν
  choice: воздержание
  rationale: Естественный русский эквивалент самообладания и сдержанности в раннехристианской нравственной речи.
- source_word: δυνάμεις / δύναμιν
  choice: силы / силу
  rationale: Сохраняет отличие δύναμις от следующего ἐνέργεια.
- source_word: ἐνέργειαν / ἐνέργειαι
  choice: действие / действия
  rationale: Передаёт проявление или деятельность названных качеств, не смешивая его с «силой».
- source_word: δικαίῳ / ἄδικον
  choice: праведному / неправедному
  rationale: 'Субстантивированные прилагательные оставлены намеренно неоднозначными: речь может идти о праведном и неправедном как нравственных началах или сторонах.'
- source_word: κύριε
  choice: господин
  rationale: В данном диалоге это почтительное обращение к наставнику; строчная буква не отождествляет адресата с Богом или Христом.
- source_word: ὀρθῇ ... ὁδῷ / στρεβλήν
  choice: прямым путём / кривой
  rationale: Сохраняет ясный образ двух путей и лексическое противопоставление оригинала.
theological_decisions:
- issue: Значение «страха» в первой заповеди
  choice: Оставлено «страх» без поясняющего добавления
  alternative: «страх Божий» или «благоговение»
  rationale: В данном предложении объект страха не назван; добавление разрешило бы смысл за автора.
- issue: Референт «праведного» и «неправедного»
  choice: 'Сохранены субстантивированные формы среднего содержания: «праведному» и «неправедному»'
  alternative: «праведности» и «неправедности» либо «праведному ангелу» и «неправедному ангелу»
  rationale: Греческий текст допускает некоторую напряжённость между качествами, путями и последующим учением об ангелах; преждевременная конкретизация нежелательна.
- issue: Фраза κεῖνται ... ἐπὶ δικαίῳ καὶ ἀδίκῳ
  choice: «они относятся к праведному и неправедному»
  alternative: «они поставлены над праведным и неправедным»
  rationale: Выбрана естественная передача смысловой соотнесённости двух видов действия, при этом не вводится идея владычества над людьми, которой контекст явно не требует.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Реплики оформлены естественно, повторы «говорит» сохранены там, где они поддерживают диалогическую структуру. Переведён только заданный читательский сегмент 33:1, хотя источник включает более широкий родительский раздел.
