  yaml_path: translation/extra_canonical/shepherd_of_hermas/033/002.yaml
  text: For the crooked path has no tracks, but pathless places and many stumbling blocks; and it is rough and thorny. Therefore it is harmful. But hear also the works of the other way. First of all, if there should come upon you a quick temper or bitterness, know that he is in you. Then come desire for many activities, and extravagance in many foods and drinks, and many drunken sprees, and various luxuries, and things that are not fitting; and desire for women, and greed, and arrogance, and boastfulness, and whatever things are akin and similar to these. Therefore, whenever these things rise up in your heart, know that the angel of wickedness is with you.
translation:
  language: ru
  text: 'Кривая же дорога не имеет проторённых троп: на ней бездорожье и множество препятствий; она трудна и терниста. Поэтому она опасна. Послушай теперь и о делах другого пути. Прежде всего, если тебя охватит вспыльчивость или горечь, знай: ангел зла находится в тебе. Затем приходят стремление ко множеству дел, роскошь в обильной еде и питье, частые попойки, разнообразные удовольствия и всё неподобающее, вожделение к женщинам, корыстолюбие, высокомерие, хвастовство и всё, что сродни и подобно этому. Итак, когда всё это поднимается в твоём сердце, знай: ангел зла с тобой.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στρεβλὴ ὁδός
  choice: кривая дорога
  rationale: Сохраняет образ дороги, отклоняющейся от прямого пути, и естественно звучит по-русски.
- source_word: τρίβους
  choice: проторённых троп
  rationale: Передаёт не просто пути, а заметные, хоженые тропы.
- source_word: ἀνοδίας
  choice: бездорожье
  rationale: Выражает отсутствие проходимого пути и поддерживает контраст с проторёнными тропами.
- source_word: προσκόμματα
  choice: препятствия
  rationale: В контексте опасной дороги слово обозначает то, обо что спотыкаются; «препятствия» естественно охватывает этот смысл.
- source_word: τραχεῖα
  choice: неровна
  rationale: Сохраняет буквальный дорожный образ шероховатой, трудной для движения поверхности.
- source_word: ἀκανθώδης
  choice: заросла терниями
  rationale: Передаёт образ колючей дороги современным и вместе с тем достойным языком.
- source_word: πικρία
  choice: горечь
  rationale: Сохраняет широкий нравственно-эмоциональный смысл греческого слова, не сводя его только к гневу.
- source_word: πολυτέλεια
  choice: неумеренность
  rationale: В сочетании с многочисленными яствами и напитками речь идёт о расточительной избыточности; русский выбор ясно передаёт осуждаемую чрезмерность.
- source_word: κραιπαλῶν
  choice: попойки
  rationale: Обозначает пьяные кутежи; выбранное слово понятно современному читателю и не смягчает смысла.
- source_word: τρυφῶν
  choice: удовольствия
  rationale: Передаёт чувственные наслаждения и роскошь, не добавляя узкой интерпретации.
- source_word: πλεονεξία
  choice: корыстолюбие
  rationale: Сохраняет нравственный смысл алчного стремления иметь больше, чем следует.
- source_word: ἀλαζονεία
  choice: хвастовство
  rationale: Передаёт самодовольную, претенциозную похвальбу и отличает её от стоящего рядом высокомерия.
- source_word: ὁ ἄγγελος τῆς πονηρίας
  choice: ангел зла
  rationale: Естественно и кратко передаёт принадлежность ангела к сфере зла, не конкретизируя её конфессионально.
theological_decisions:
- issue: Соотношение внутренних порывов и присутствия ангела зла
  choice: «ангел зла находится в тебе» и «ангел зла с тобой»
  alternative: «злой дух овладел тобой»
  rationale: Перевод следует ангельской терминологии текста и сохраняет различие формулировок, не превращая нравственное воздействие в утверждение об одержимости.
- issue: Характер «двух путей»
  choice: сохранён образ другого пути и его дел
  alternative: истолковать пути как две самостоятельные духовные силы
  rationale: Текст соединяет образы путей, дел и ангелов; перевод не устраняет эту образную многослойность.
translation_notes:
  register: Современный литературный русский язык с ясным нравоучительным ритмом. Образы дороги сохранены конкретными и последовательными; перечень пороков передан без архаической тяжеловесности и без конфессиональной конкретизации.
