revisions:
- from: 'Итак, распознав его дела, отступись от него и ни в чём ему не верь, потому что дела его злы и вредны для Божьих рабов. Теперь ты знаешь, как действуют оба ангела; различай их и верь ангелу праведности. От ангела же зла отступись, потому что его наставление во всяком деле ведёт ко злу. Ведь если человек верен, но помысел этого ангела поднимется в его сердце, то этот мужчина или эта женщина непременно в чём-нибудь согрешит. И напротив, если мужчина или женщина крайне злы, но в их сердце поднимутся побуждения к делам ангела праведности, такой человек непременно сделает что-нибудь доброе.


    «Итак, ты видишь, — говорит он, — что хорошо следовать за ангелом праведности и отречься от ангела зла. Эта заповедь разъясняет, что относится к вере: верь делам ангела праведности и, совершая их, будешь жить для Бога. Верь также, что дела ангела зла тяжки; не совершая их, будешь жить для Бога».'
  to: 'Итак, распознав его дела, отступи от него и ни в чём ему не доверяй, потому что дела его злы и вредны для Божьих рабов. Тебе известны проявления обоих ангелов; постигай их и доверяй ангелу праведности. От ангела зла же отступи, потому что всякое его наставление зло. Ведь если какой-нибудь верующий мужчина и помысел этого ангела поднимется в его сердце, то этот мужчина или эта женщина непременно в чём-нибудь согрешит. И наоборот, если какой-нибудь мужчина или женщина крайне злы и в их сердце поднимутся дела ангела праведности, то такой человек непременно сделает что-нибудь доброе.


    «Итак, ты видишь, — говорит он, — что хорошо следовать за ангелом праведности и отречься от ангела зла. Эта заповедь разъясняет то, что относится к вере: доверяй делам ангела праведности и, совершая их, будешь жить для Бога. Верь же, что дела ангела зла тяжки; не совершая их, будешь жить для Бога».'
  rationale: Исправления устраняют добавленное толкование в §7–8 и точнее передают повеление «уразуметь» проявления обоих ангелов. Необычный, но намеренный образ того, что «дела ангела праведности» поднимаются в сердце, сохранён без доктринального или психологизирующего переосмысления.
