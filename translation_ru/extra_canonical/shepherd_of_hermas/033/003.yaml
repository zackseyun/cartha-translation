base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/033/003.yaml
  text: 'So when you recognize his works, withdraw from him and put no trust in him, because his works are wicked and harmful to God’s servants. You therefore have the activities of both angels; understand them, and trust the angel of righteousness. But withdraw from the angel of wickedness, because his teaching is wicked in every deed. For if someone is a faithful man, and the thought of this angel rises up in his heart, that man or woman must commit some sin. But if again some man or woman is very wicked, and the works of the angel of righteousness rise up in his or her heart, that person must of necessity do something good. You see then,” he says, “that it is good to follow the angel of righteousness, and to renounce the angel of wickedness. As to faith, this commandment makes it clear: that you should trust the works of the angel of righteousness, and, having done them, live to God. But believe that the works of the angel of wickedness are grievous; so by not doing them, you will live
    to God.”'
translation:
  language: ru
  text: 'Итак, распознав его дела, отступи от него и ни в чём ему не доверяй, потому что дела его злы и вредны для Божьих рабов. Тебе известны проявления обоих ангелов; постигай их и доверяй ангелу праведности. От ангела зла же отступи, потому что всякое его наставление зло. Ведь если какой-нибудь верующий мужчина и помысел этого ангела поднимется в его сердце, то этот мужчина или эта женщина непременно в чём-нибудь согрешит. И наоборот, если какой-нибудь мужчина или женщина крайне злы и в их сердце поднимутся дела ангела праведности, то такой человек непременно сделает что-нибудь доброе.


    «Итак, ты видишь, — говорит он, — что хорошо следовать за ангелом праведности и отречься от ангела зла. Эта заповедь разъясняет то, что относится к вере: доверяй делам ангела праведности и, совершая их, будешь жить для Бога. Верь же, что дела ангела зла тяжки; не совершая их, будешь жить для Бога».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεργείας
  choice: как действуют
  rationale: Передаёт не отвлечённые «энергии», а различимые проявления и образ действия обоих ангелов в данном контексте.
- source_word: πίστευε
  choice: верь
  rationale: Сохраняет повторяющийся мотив веры и доверия, связывающий отрывок с темой заповеди.
- source_word: ἐνθύμησις
  choice: помысел
  rationale: Обозначает возникшую в сердце мысль или внутреннее внушение; «помысел» естественно звучит в нравственно-духовном контексте.
- source_word: ἀποτάξασθαι
  choice: отречься
  rationale: Передаёт решительный разрыв и отказ следовать ангелу зла, не сводя выражение к простому удалению.
- source_word: χαλεπά
  choice: тяжки
  rationale: 'Сохраняет широту значения: дела ангела зла трудны, мучительны и пагубно обременительны, без искусственного уточнения одного оттенка.'
- source_word: ζήσῃ τῷ Θεῷ
  choice: будешь жить для Бога
  rationale: Естественно передаёт дательный отношения и сохраняет богословски ёмкую формулу жизни, обращённой к Богу.
theological_decisions:
- issue: Необходимость греха или доброго дела при воздействии соответствующего ангела
  choice: «непременно ... согрешит» / «непременно сделает ... доброе»
  alternative: «должен согрешить» / «должен сделать доброе»
  rationale: Греческие δεῖ и ἐξ ἀνάγκης выражают сильную необходимость. «Непременно» сохраняет напряжение текста, но не превращает фразу в нравственное предписание согрешить.
- issue: Соотношение веры и дел в заключении
  choice: 'Сохранена прямая связь: верить делам ангела праведности, совершать их и жить для Бога'
  alternative: Разъяснить эту связь в терминах конкретной доктрины спасения
  rationale: Источник формулирует нравственное увещание без систематического объяснения; перевод не вводит конфессионального толкования.
- issue: Ангелы праведности и зла
  choice: Сохранены как личные действующие лица
  alternative: Передать их как безличные добрые и злые склонности
  rationale: Греческий текст прямо говорит об ангелах и приписывает им наставление, дела и воздействие; психологизирующая замена устранила бы исходную картину.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным нравственно-наставительным тоном. Повторы «верь», «дела», «ангел праведности» и «ангел зла» намеренно сохранены как смысловые связки. Гендерно парная формула ἀνήρ ἢ γυνή передана явно, а последующее обобщение — словами «такой человек».
