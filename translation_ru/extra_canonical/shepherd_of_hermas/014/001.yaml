revisions:
- from: '«Хочешь узнать о тех, кого разбивают и далеко отбрасывают от башни? Это сыны беззакония. Они уверовали лицемерно, и никакое зло не оставило их. Поэтому у них нет спасения: из-за своих злых дел они непригодны для строительства. Потому их разбили и отбросили далеко — из-за гнева Господа, ведь они прогневили Его».'
  to: '«Хочешь узнать о тех, кого разбивают на части и далеко отбрасывают от башни? Это сыны беззакония. Они уверовали лицемерно, и от них не отступило никакое зло. Поэтому у них нет спасения: из-за своих пороков они непригодны для строительства. Потому их разбили на части и отбросили далеко — из-за гнева Господа, ведь они прогневили Его».'
  rationale: 'Исправлены две безопасные смысловые неточности: усилен оттенок κατακόπτω/συνεκόπτω («разбивать на части») и устранено сужение πονηρίαι до одних внешних поступков («пороки»). Не добавлены богословские выводы о сроке или необратимости отсутствия спасения.'
