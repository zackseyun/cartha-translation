base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/001.yaml
  text: “Do you want to know about those who are being cut down and thrown far from the tower? These are the sons of lawlessness; they believed in hypocrisy, and no wickedness departed from them. For this reason they have no salvation, because they are not fit for the building on account of their wicked deeds. Therefore they were cut down and thrown far away because of the anger of the Lord, because they provoked him.
translation:
  language: ru
  text: '«Хочешь узнать о тех, кого разбивают на части и далеко отбрасывают от башни? Это сыны беззакония. Они уверовали лицемерно, и от них не отступило никакое зло. Поэтому у них нет спасения: из-за своих пороков они непригодны для строительства. Потому их разбили на части и отбросили далеко — из-за гнева Господа, ведь они прогневили Его».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακοπτομένους / συνεκόπησαν
  choice: разбивают / разбили
  rationale: Глагол передаёт сильное дробление или рассечение камней; «разбивать» естественно сохраняет образ строительного материала и повтор исходного корня.
- source_word: υἱοὶ τῆς ἀνομίας
  choice: сыны беззакония
  rationale: Сохранён семитизирующий образ принадлежности и характерная для раннехристианского текста торжественная формула.
- source_word: ἐπίστευσαν δὲ ἐν ὑποκρίσει
  choice: они уверовали лицемерно
  rationale: Передаёт как факт веры, так и её неискренний характер, не подменяя выражение более узким толкованием.
- source_word: πᾶσα πονηρία οὐκ ἀπέστη ἀπʼ αὐτῶν
  choice: никакое зло не оставило их
  rationale: Отрицательная конструкция понята в естественном контексте как отсутствие какого-либо отступления зла; сохранена персонифицированная динамика ἀπέστη.
- source_word: εὔχρηστοι εἰς οἰκοδομήν
  choice: пригодны для строительства
  rationale: Естественно по-русски передаёт функциональную пригодность камней для возведения башни.
- source_word: διὰ τὰς πονηρίας αὐτῶν
  choice: из-за своих злых дел
  rationale: Множественное число πονηρίαι в данном нравственном контексте обозначает конкретные проявления зла; «злые дела» яснее обычному читателю.
- source_word: παρώργισαν αὐτόν
  choice: прогневили Его
  rationale: Сохраняет причинную связь с «гневом Господа» и возвышенный, но понятный русский регистр.
theological_decisions:
- issue: Отсутствие спасения у лицемерно уверовавших
  choice: «у них нет спасения»
  alternative: «они не получают спасения»
  rationale: Сохранено прямое настоящее οὐκ ἔχουσιν σωτηρίαν без уточнения механизма, срока или окончательности приговора.
- issue: Характер их веры
  choice: «уверовали лицемерно»
  alternative: «притворно исповедовали веру»
  rationale: Исходник прямо употребляет ἐπίστευσαν, поэтому вера не сведена переводом лишь к внешнему исповеданию; напряжение между верой и лицемерием сохранено.
- issue: Гнев Господа как причина отвержения
  choice: «из-за гнева Господа, ведь они прогневили Его»
  alternative: «по гневу Господню за то, что раздражили Его»
  rationale: Сохранены и божественный гнев, и человеческая ответственность без конфессионального смягчения или расширения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной раннехристианской окраской. Синтаксис упрощён там, где это повышает ясность, но повтор образов и причинных связок греческого текста сохранён. Местоимение «Его» написано с прописной буквы согласно распространённой русской издательской практике для референции к Господу.
