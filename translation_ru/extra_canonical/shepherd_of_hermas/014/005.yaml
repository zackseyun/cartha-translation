base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/005.yaml
  text: 5. “And the white and round ones that do not fit into the building—who are they, Lady?” She answered me, saying, “How long will you be foolish and without understanding, asking about everything and understanding nothing? These are those who have faith, but also have the wealth of this age. When affliction comes, because of their wealth and their business dealings they deny their Lord.”
translation:
  language: ru
  text: '5. «А белые и круглые камни, не подходящие для постройки, — кто они, госпожа?» Она ответила мне: «До каких пор ты будешь глуп и непонятлив, обо всём спрашивая и ничего не понимая? Это те, кто имеет веру, но имеет и богатство нынешнего века. Когда приходит скорбь, они отрекаются от своего Господа из-за своего богатства и деловых занятий».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λευκοὶ καὶ στρογγύλοι
  choice: белые и круглые камни
  rationale: Прилагательные субстантивированы и в контексте видения обозначают камни; явное добавление слова «камни» делает русский текст естественным и сохраняет образ постройки.
- source_word: μὴ ἁρμόζοντες εἰς τὴν οἰκοδομήν
  choice: не подходящие для постройки
  rationale: Передаёт практический смысл ἁρμόζω — соответствовать, прилаживаться или годиться для включения в строение.
- source_word: κυρία
  choice: госпожа
  rationale: Уважительное обращение к явившейся женщине; нейтральное и контекстуально точное соответствие.
- source_word: μωρὸς ... καὶ ἀσύνετος
  choice: глупым и непонятливым
  rationale: 'Сохраняет два близких, но не тождественных упрёка: недостаток здравого рассуждения и недостаток понимания.'
- source_word: πλοῦτον τοῦ αἰῶνος τούτου
  choice: богатство нынешнего века
  rationale: Сохраняет раннехристианскую временную категорию αἰών и её противопоставление будущему веку, не сводя выражение просто к «мирскому богатству».
- source_word: θλῖψις
  choice: скорбь
  rationale: Охватывает бедствие, давление и притеснение, сохраняя возможную религиозную напряжённость контекста.
- source_word: πραγματείας
  choice: деловых забот
  rationale: Слово может обозначать занятия, торговые или хозяйственные дела; вариант передаёт коммерческий оттенок и вовлечённость в них без чрезмерного уточнения.
- source_word: ἀπαρνοῦνται
  choice: отрекаются
  rationale: Передаёт сильный смысл отрицания принадлежности или верности Господу, а не простого словесного отказа.
theological_decisions:
- issue: Характер веры богатых
  choice: «имеет веру, но имеет и богатство»
  alternative: «верующие, но богатые»
  rationale: Сохраняет формулировку источника и напряжение между реальной названной верой и привязанностью к богатству, не объявляя веру заранее ложной.
- issue: Смысл θλῖψις
  choice: «когда приходит скорбь»
  alternative: «когда начинаются гонения»
  rationale: Греческое слово шире собственно гонений; перевод не ограничивает вид испытания и не вносит отсутствующую конкретизацию.
- issue: Причина отречения
  choice: «из-за своего богатства и деловых забот»
  alternative: «ради сохранения богатства и предприятий»
  rationale: Сохраняется выраженная причинная связь, но не добавляется мотив сохранения имущества, прямо не сформулированный в источнике.
- issue: Обозначение Господа
  choice: «своего Господа»
  alternative: «Господа»
  rationale: Притяжательное αὐτῶν передано явно; прописная буква отражает титульное употребление в христианском контексте, не уточняя сверх текста личность Господа.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Реплика сохраняет резкость порицания, а синтаксис упрощён лишь настолько, чтобы звучать естественно для обычного современного читателя.
