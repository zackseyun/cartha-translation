  to: '6. Я спросил её: «Госпожа, когда же они станут пригодны для строительства?» Она ответила: «Когда будет отсечено их богатство, которое их увлекает, тогда они станут полезны Богу. Ведь круглый камень, если его не обтесать и не удалить от него чего-либо, не может стать четырёхугольным. Так и богатые в этом веке: если не будет отсечено их богатство, они не смогут стать полезны Господу».'
