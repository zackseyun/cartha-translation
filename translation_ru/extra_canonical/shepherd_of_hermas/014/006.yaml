review_pass:
  verdict: revise
  source_fidelity: 'Смысл и образность переданы в целом точно: условие отсечения богатства, сопоставление с круглым камнем и различие между пригодностью для строительства и полезностью Богу сохранены. Однако «пригодны Богу/Господу» неестественно по-русски для εὔχρηστοι с дательным адресата; здесь уместнее «полезны Богу/Господу». В образе камня лучше явно передать удаление части материала, а не приписывать камню самостоятельную «утрату».'
  naturalness: 'Текст литературный и понятный. Исправление делает две конструкции более плавными: «полезны Богу» вместо калькированного «пригодны Богу» и «не удалить от него чего-либо» вместо «он не утратит часть себя».'
  terminology: «Госпожа» корректно передаёт обращение Κυρία в данном диалоге. «Богатые в этом веке», «отсечено богатство», «четырёхугольным» и «строительство» приемлемы и сохраняют лексику и метафору оригинала. «Увлекает» допустимо как сдержанная передача ψυχαγωγῶν, не навязывающая одного толкования.
  issues:
  - severity: medium
    issue: Неестественная сочетаемость «пригодны Богу/Господу».
    rationale: εὔχρηστοι τῷ Θεῷ/Κυρίῳ означает «полезны, годны к употреблению для Бога/Господа». Русское «пригодны Богу» звучит как буквальная калька и уступает естественному «полезны Богу».
  - severity: low
    issue: «Он не утратит часть себя» неточно оформляет действие с камнем.
    rationale: В греческом камень должен быть обтёсан и «отбросить/лишиться чего-либо от себя»; русская конструкция лучше передаётся как удаление части материала при обработке камня.
