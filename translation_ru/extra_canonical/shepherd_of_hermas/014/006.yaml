base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/006.yaml
  text: 6. And I answered her, “Lady, when then will they become fit for the building?” She said, “When their wealth that ensnares them has been cut away, then they will be useful to God. For just as a round stone, unless it is cut and casts off something from itself, cannot become square, so also those who are rich in this age, unless their wealth is cut away, cannot become useful to the Lord.
translation:
  language: ru
  text: '6. Я спросил её: «Госпожа, когда же они станут пригодны для строительства?» Она ответила: «Когда будет отсечено их богатство, которое их увлекает, тогда они станут полезны Богу. Ведь круглый камень, если его не обтесать и не удалить от него чего-либо, не может стать четырёхугольным. Так и богатые в этом веке: если не будет отсечено их богатство, они не смогут стать полезны Господу».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὔχρηστοι εἰς τὴν οἰκοδομήν
  choice: пригодны для строительства
  rationale: Сохраняет строительную метафору и значение пригодности камней для включения в башню.
- source_word: ὁ πλοῦτος ὁ ψυχαγωγῶν αὐτούς
  choice: их богатство, которое их увлекает
  rationale: ψυχαγωγέω здесь допускает оттенки увлечения, пленения и обольщения; «увлекает» естественно по-русски и не чрезмерно конкретизирует образ.
- source_word: περικοπῇ
  choice: будет отсечено / обтесать
  rationale: 'Повторяющийся образ удаления лишнего передан с учётом субъектов: богатство «отсекается», а камень «обтёсывают».'
- source_word: τετράγωνος
  choice: четырёхугольным
  rationale: Формально передаёт геометрическое противопоставление круглому камню, не заменяя его более узким «квадратным».
- source_word: ἐν τούτῳ τῷ αἰῶνι
  choice: в этом веке
  rationale: Сохраняет раннехристианское эсхатологическое значение αἰών и его противопоставление иному веку.
theological_decisions:
- issue: Характер связи богатства с непригодностью Богу
  choice: 'Сохранена условная образная формулировка: богатство должно быть «отсечено».'
  alternative: Истолковать это как обязательную полную раздачу имущества либо только как внутреннее отрешение.
  rationale: Греческий текст не уточняет практический способ «отсечения» богатства; перевод не должен разрешать эту богословско-нравственную напряжённость.
- issue: Адресат пригодности
  choice: «пригодны Богу» и «пригодны Господу»
  alternative: «полезны для Бога/Господа»
  rationale: εὔχρηστος обозначает пригодность к употреблению; такой выбор также поддерживает метафору строительных камней.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Синтаксис слегка упрощён ради ясности, при этом сохранены повтор, условные конструкции и развёрнутая метафора обтёсывания камня.
