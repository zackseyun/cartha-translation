base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/003.yaml
  text: 3. “And those that have cracks—who are they? These are the ones who harbor things against one another in their hearts and are not at peace among themselves, but have a face of peace; yet when they depart from one another, their evils remain in their hearts. These, then, are the cracks that the stones have.
translation:
  language: ru
  text: 3. А те, что с трещинами, — кто они? Это те, кто таит в сердцах недобрые чувства друг к другу и не живёт друг с другом в мире. Внешне они сохраняют видимость мира, но, когда расходятся, их недобрые чувства остаются в их сердцах. Вот что представляют собой трещины на камнях.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς σχισμάς
  choice: с трещинами
  rationale: В контексте камней башни слово обозначает физические трещины, которые затем истолковываются как внутренний разлад.
- source_word: οἱ κατ᾿ ἀλλήλων ἐν ταῖς καρδίαις ἔχοντες
  choice: кто в сердце держит зло друг на друга
  rationale: Греческое выражение не называет предмет чувства прямо; русская идиома естественно передаёт подразумеваемую неприязнь, не уточняя её вид.
- source_word: μὴ εἰρηνεύοντες ἐν ἑαυτοῖς
  choice: не живёт друг с другом в мире
  rationale: В данном взаимном контексте передаёт отсутствие мира между людьми; буквальное «в самих себе» по-русски могло бы ошибочно означать лишь внутреннее душевное состояние.
- source_word: πρόσωπον εἰρήνης ἔχοντες
  choice: с виду они мирны
  rationale: Естественная современная передача буквального образа «имеющие лицо мира», сохраняющая противопоставление внешнего мира и скрытого зла.
- source_word: αἱ πονηρίαι αὐτῶν
  choice: зло
  rationale: Собирательное единственное звучит естественно и сохраняет широкое значение πονηρίαι — дурные, злые помыслы и настроения.
theological_decisions:
- issue: Характер скрытого разлада
  choice: «держит зло друг на друга» без уточнения конкретного греха
  alternative: «таит обиду» или «питает ненависть»
  rationale: Источник оставляет содержание взаимной неприязни широким; конкретизация до обиды или ненависти неоправданно сужает смысл.
- issue: Значение трещин в аллегории
  choice: «Вот что означают трещины»
  alternative: буквально «Вот те трещины, которые имеют камни»
  rationale: Ясно выражает истолковательный характер речи и сохраняет связь нравственного состояния с образом камней.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены риторический вопрос, контраст внешней мирности и внутреннего зла, а также строительная метафора. Синтаксис слегка упрощён ради естественного чтения без устранения смысловой напряжённости.
