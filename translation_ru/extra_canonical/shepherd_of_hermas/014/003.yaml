  - severity: low
    issue: Ослаблена идея внешней видимости мира
    rationale: πρόσωπον εἰρήνης ἔχοντες буквально содержит образ «лица мира»; «с виду они мирны» передаёт результат, но не так ясно подчёркивает внешний фасад.
