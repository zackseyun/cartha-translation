review_pass:
  verdict: revise
  source_fidelity: 'Смысловой ход передан верно: внутренний взаимный разлад противопоставлен внешнему виду мира, а «трещины» остаются частью образа камней. Однако «с виду они мирны» несколько ослабляет πρόσωπον εἰρήνης ἔχοντες — намеренно внешнюю, показную видимость мира. «Зло» в единственном числе также сглаживает множественное αἱ πονηρίαι и менее ясно связывает сохраняющееся внутреннее зло с первым описанием.'
  naturalness: Фраза «в сердце держит зло друг на друга» понятна, но для современного литературного русского звучит тяжеловесно и не вполне идиоматично. «Таят в сердцах недобрые чувства друг к другу» естественнее и сохраняет неопределённость греческого оборота. «Внешне сохраняют видимость мира» точно и литературно передаёт образ «лица мира».
  terminology: '«Трещины» — удачный выбор для σχισμάς в строительной метафоре. Не следует заменять их на «расколы», поскольку непосредственно описываются повреждения камней. Для πονηρίαι уместны «недобрые чувства»: это не навязывает конкретно обиду или ненависть и сохраняет множественный характер выражения.'
