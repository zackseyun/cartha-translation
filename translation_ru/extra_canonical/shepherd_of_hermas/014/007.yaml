revisions:
- from: '7. «Прежде всего познай это на собственном примере: когда ты был богат, ты был бесполезен; теперь же ты полезен и служишь жизни. Становитесь полезными Богу! Ведь и ты сам — один из таких же камней, пущенных в дело».[a]'
  to: '7. «Прежде всего суди по себе: когда ты был богат, ты был бесполезен; теперь же ты полезен и полезен для жизни. Становитесь полезными Богу, ибо и ты сам находишь применение среди тех же камней».[a]'
  rationale: Исправлена заключительная строительная метафора, чтобы адресат оставался субъектом сказуемого, как в греческом тексте. «Служишь жизни» заменено более прямым «полезен для жизни». Повтор «полезен» отражает два смежных греческих предиката (εὔχρηστος и ὠφέλιμος); он допустим в кратком увещательном стиле и избегает добавочного толкования.
