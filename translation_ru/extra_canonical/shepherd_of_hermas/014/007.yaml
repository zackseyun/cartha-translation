base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/007.yaml
  text: '7. “Learn first from yourself: when you were rich, you were useless; but now you are useful and beneficial for life. Become useful to God; for you yourself also are used from the same stones.”'
translation:
  language: ru
  text: '7. «Прежде всего суди по себе: когда ты был богат, ты был бесполезен; теперь же ты полезен и полезен для жизни. Становитесь полезными Богу, ибо и ты сам находишь применение среди тех же камней».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст последней фразы синтаксически труден: буквально она говорит, что адресат «находит применение / используется из (среди) тех же камней». Перевод передаёт её в свете ближайшего строительного образа, но не утверждает, что Ерм прямо назван камнем.'
    reason: Сохранить текстуальную и синтаксическую неопределённость χρᾶσαι ἐκ τῶν αὐτῶν λίθων и не выдавать контекстуальное истолкование за буквальное значение.
lexical_decisions:
- source_word: ἀπὸ [δὲ] σεαυτοῦ πρῶτον γνῶθι
  choice: Прежде всего познай это на собственном примере
  rationale: Оборот ἀπὸ σεαυτοῦ предлагает сделать вывод, исходя из собственного опыта; такая передача естественна по-русски и сохраняет призыв к самопознанию. Заключённое издателями в скобки δὲ не влияет существенно на смысл.
- source_word: ἄχρηστος / εὔχρηστος
  choice: бесполезен / полезен
  rationale: Сохранено последовательное противопоставление непригодности и пригодности, важное для образа камней, используемых при строительстве.
- source_word: ὠφέλιμος τῇ ζωῇ
  choice: служишь жизни
  rationale: Дательный τῇ ζωῇ можно понимать как указание на то, чему человек приносит пользу. Формулировка сохраняет краткость и смысловую открытость выражения «жизни».
- source_word: εὔχρηστοι γίνεσθε τῷ Θεῷ
  choice: Становитесь полезными Богу
  rationale: Множественное число γίνεσθε сохранено, несмотря на предшествующее обращение к одному Ерму; вероятно, увещание расширяется на слушателей или читателей.
- source_word: καὶ γὰρ σὺ αὐτὸς χρᾶσαι ἐκ τῶν αὐτῶν λίθων
  choice: Ведь и ты сам — один из таких же камней, пущенных в дело
  rationale: Передача следует строительной метафоре контекста и смыслу консультационного слоя, однако греческая формулировка в данной форме текстуально и синтаксически затруднительна; поэтому неопределённость отмечена сноской.
theological_decisions:
- issue: Связь утраты богатства с полезностью Богу
  choice: Сохранено прямое утверждение текста без смягчения
  alternative: Истолковать богатство исключительно как внутреннюю привязанность к имуществу
  rationale: Контекст прямо говорит об отсечении богатства; перевод не должен заранее разрешать нравственно-богословское напряжение посредством конфессионального толкования.
- issue: Значение выражения τῇ ζωῇ
  choice: «служишь жизни»
  alternative: «полезен для вечной жизни»
  rationale: В оригинале нет определения «вечной»; его добавление сузило бы возможный смысл.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Сохранён переход от единственного числа («ты») к множественному («становитесь»), присутствующий в греческом тексте; строительная образность согласована с ближайшим контекстом.
