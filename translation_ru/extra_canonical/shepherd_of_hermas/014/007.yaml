review_pass:
  verdict: revise
  source_fidelity: 'Первая часть в целом передаёт греческий текст верно, включая переход от единственного числа к множественному. Однако «один из таких же камней, пущенных в дело» существенно переформулирует заключительное καὶ γὰρ σὺ αὐτὸς χρᾶσαι ἐκ τῶν αὐτῶν λίθων: в греческом сказуемое относится к самому адресату («и ты сам… находишь применение / используешься»), а не утверждается, что он является камнем. Синтаксис заключительной фразы действительно труден, поэтому её нельзя переводить с чрезмерной определённостью.'
  naturalness: «Служишь жизни» звучит несколько отвлечённо и менее прямо, чем ὠφέλιμος τῇ ζωῇ. «Полезен для жизни» естественно по-русски и сохраняет открытость слова ζωή, не добавляя «вечной». Формула «находишь применение среди тех же камней» литературна и осторожно передаёт затруднённое ἐκ τῶν αὐτῶν λίθων.
  terminology: 'Противопоставление «бесполезен / полезен» удачно сохраняет связь ἄχρηστος / εὔχρηστος и строительный контекст. «Богу» для τῷ Θεῷ оправдано. Не следует называть адресата «одним из камней» без оговорки: это не выражено прямо в имеющейся греческой форме.'
  issues:
  - severity: medium
    issue: Заключительная фраза превращает адресата в «камень, пущенный в дело».
