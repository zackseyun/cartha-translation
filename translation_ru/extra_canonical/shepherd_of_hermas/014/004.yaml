base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/004.yaml
  text: 4. “And the mutilated ones—these are those who have believed and have the greater part in righteousness, but have certain parts of lawlessness. For this reason they are mutilated and not whole.
translation:
  language: ru
  text: 4. А повреждённые камни — это те, кто уверовали и в большей своей части принадлежат праведности, но имеют и некоторую долю беззакония. Поэтому они повреждены и неполны.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ κεκολοβωμένοι
  choice: камни с обломанными краями
  rationale: Причастие означает «обрубленные, усечённые»; добавление «камни» восстанавливает явный предмет из контекста строительного образа, а «с обломанными краями» естественно передаёт состояние камней по-русски.
- source_word: πεπιστευκότες
  choice: уверовал
  rationale: Перфект указывает на состоявшееся обретение веры с сохраняющимся результатом.
- source_word: τὸ πλεῖον μέρος ἔχοντες ἐν τῇ δικαιοσύνῃ
  choice: большей частью пребывает в праведности
  rationale: Передаёт преобладающую принадлежность их жизни сфере праведности, не превращая оборот в утверждение о заслуге или обладании долей награды.
- source_word: τινὰ δὲ μέρη ἔχουσιν τῆς ἀνομίας
  choice: но отчасти держится беззакония
  rationale: Сохраняет контраст между преобладающей праведностью и остающимися областями беззакония; «держится» выражает продолжающуюся связь без чрезмерного уточнения.
- source_word: κολοβοί
  choice: ущербны
  rationale: В итоговом объяснении метафора относится уже и к нравственной неполноте людей; «ущербны» сохраняет связь с физической повреждённостью и звучит естественнее буквального «обрублены».
- source_word: οὐχ ὁλοτελεῖς
  choice: не вполне целы
  rationale: Передаёт отсутствие целостности или полноты и сохраняет образ повреждённых камней.
theological_decisions:
- issue: Сочетание веры, праведности и сохраняющегося беззакония
  choice: 'Сохранён прямой контраст: они уверовали и преимущественно пребывают в праведности, однако отчасти держатся беззакония.'
  alternative: Истолковать это как различие между оправданным статусом и несовершенным освящением либо как сомнение в подлинности веры.
  rationale: Греческий текст не формулирует систематического учения о статусе верующих, а образно описывает нравственную смешанность; перевод не должен разрешать эту напряжённость конфессионально.
translation_notes:
  register: Современный литературный русский язык с сохранением достоинства раннехристианского наставления и строительной метафоры. Единственное число после собирательного «те, кто» использовано ради естественного согласования с относительным местоимением; исходная множественность группы сохраняется по смыслу.
