  - severity: low
    issue: «Держится беззакония» несколько активнее и конкретнее, чем греческое «имеют некоторые части беззакония».
    rationale: Греческий образ говорит о сохраняющейся доле или области беззакония, не обязательно о сознательном удерживании его.
