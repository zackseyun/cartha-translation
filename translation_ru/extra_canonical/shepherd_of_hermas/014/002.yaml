base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/014/002.yaml
  text: '2. “And the others you saw—many lying there, not going into the building—these are the scabby ones: they came to know the truth, but did not remain in it, nor did they join themselves to the saints; therefore they are useless.'
translation:
  language: ru
  text: '2. А те другие камни, которых ты видел во множестве лежащими и не входящими в постройку, — это покрытые коростой: они познали истину, но не остались в ней и не соединились со святыми; поэтому они непригодны.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐψωριακότες
  choice: покрытые коростой
  rationale: Причастие от ψωριάω обозначает поражение кожной болезнью, коростой; сохранён образ дефектных камней без расплывчатого «шероховатые».
- source_word: ἐγνωκότες τὴν ἀλήθειαν
  choice: познали истину
  rationale: Передаёт результативный смысл перфекта и устойчивую раннехристианскую формулу естественным русским языком.
- source_word: μὴ ἐπιμείναντες δὲ ἐν αὐτῇ
  choice: но не остались в ней
  rationale: ἐπιμένω здесь означает продолжать пребывать, оставаться верным истине; русский вариант сохраняет метафору пребывания.
- source_word: μηδὲ κολλώμενοι τοῖς ἁγίοις
  choice: и не соединились со святыми
  rationale: κολλάω выражает тесное присоединение или связь. «Соединились» понятно современному читателю и не уточняет сверх текста характер этой связи.
- source_word: ἄχρηστοί
  choice: непригодны
  rationale: В контексте камней и строительства слово означает непригодность к употреблению, а не абсолютную бесполезность.
theological_decisions:
- issue: Кого обозначают οἱ ἅγιοι
  choice: святые
  alternative: верующие / народ Божий
  rationale: Сохранено буквальное и традиционно понятное обозначение без конфессионального уточнения состава или статуса этой группы.
- issue: Характер связи с истиной
  choice: познали истину, но не остались в ней
  alternative: узнали истину, но не сохранили верность ей
  rationale: Выбран вариант, который сохраняет напряжение между состоявшимся познанием и последующим непребыванием, не вводя дополнительного объяснения об отступничестве.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Синтаксис слегка упрощён для ясности, при этом строительная образность и повторная идентификация камней сохранены.
