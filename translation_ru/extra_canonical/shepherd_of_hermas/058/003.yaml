  terminology: «Наслаждения», «обман», «безрассудство», «наказание» и «мучение» приемлемо передают греческие ключевые слова без конфессионального истолкования. «Мучение» сохраняет различение βάσανος и τιμωρία; неоднозначный субъект/характер ἀπάτη не уточняется.
