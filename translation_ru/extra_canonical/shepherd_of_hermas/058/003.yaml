  source_fidelity: 'Смысл в целом передан точно: сохранены противопоставление мимолётного потакания удовольствиям и длительного наказания, метафора «облачения» в неразумие и персонификация памяти. Однако настоящее время «пристают» неудачно передаёт аористное/субъюнктивное «когда ... пристанут (прильнут)», а «терпит ... до целого года» звучит менее естественно и несколько размывает временную протяжённость исходного образа.'
