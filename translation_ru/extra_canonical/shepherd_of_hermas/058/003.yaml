base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/003.yaml
  text: “The one who indulges himself and is deceived for a single day and does what he wants has clothed himself with much foolishness and does not perceive the deed he is doing; for on the next day he forgets what he did the day before. For indulgence and deception have no memory because of the foolishness with which he has clothed himself. But when punishment and torment cling to a person for one day, he is punished and tormented for up to a year; for punishment and torment have great memory.
translation:
  language: ru
  text: Кто предаётся наслаждениям и обманывается один день, поступая как ему хочется, тот облёкся в великое безрассудство и не осознаёт того, что делает. Ведь на следующий день он забывает, что сделал накануне, ибо наслаждение и обман лишены памяти из-за безрассудства, в которое он облёкся. Но когда наказание и мучение пристанут к человеку на один день, он подвергается наказанию и мучению вплоть до года, ибо у наказания и мучения долгая память.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφῶν / τρυφή
  choice: предаётся наслаждениям / наслаждение
  rationale: Передаёт потакание приятным желаниям без преждевременного сужения до конкретного порока; сохраняет связь с последующим обсуждением как вредных, так и спасительных удовольствий.
- source_word: ἀπατώμενος / ἀπάτη
  choice: обманывается / обман
  rationale: Сохраняет пассивную форму причастия и широкую семантику заблуждения или обмана, не уточняя источник обмана.
- source_word: πολλὴν ἀφροσύνην ἐνδέδυται
  choice: облекается в великое безрассудство
  rationale: Сохранена выразительная метафора облачения и значение нравственно-духовного неразумия.
- source_word: οὐ νοεῖ τὴν πρᾶξιν ἣν ποιεῖ
  choice: не осознаёт того, что делает
  rationale: Естественная русская передача, сохраняющая мысль об отсутствии понимания собственного поступка.
- source_word: κολληθῇ
  choice: пристают
  rationale: Передаёт образ тесного и длительного прикрепления наказания и мучения к человеку без неестественного буквального «приклеиваются».
- source_word: μέχρις ἐνιαυτοῦ
  choice: до целого года
  rationale: Сохраняет временной предел исходного текста; «целого» естественно подчёркивает контраст одного дня и года.
- source_word: μνήμας μεγάλας ἔχει
  choice: долгая память
  rationale: Идиоматически передаёт персонификацию и смысл продолжительного памятования; множественное μνήμας не воспроизводится механически по-русски.
theological_decisions:
- issue: Природа ἀπάτη
  choice: «обман» без указания, кем или чем человек обманут
  alternative: «самообман» или «заблуждение»
  rationale: Греческий текст оставляет источник и механизм обмана неопределёнными; перевод не должен разрешать эту неоднозначность.
- issue: Соотношение одного дня удовольствия и года страдания
  choice: сохранено как образное утверждение текста без поясняющего смягчения
  alternative: истолковать как строгую формулу воздаяния
  rationale: Отрывок формулирует нравственное сопоставление, но сам по себе не устанавливает исчерпывающую догматическую схему наказания.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Сохранены параллелизм, повтор ключевых слов и метафоры облачения и памяти; синтаксис сделан ясным для обычного читателя без устранения напряжения оригинала.
