base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/007.yaml
  text: “But there are also indulgences that save people; for many, by doing good things, indulge themselves, being carried along by their own pleasure. This indulgence, therefore, is beneficial for the servants of God, and it secures life for such a person; but the harmful indulgences previously mentioned procure torments and punishments for them; and if they persist and do not repent, they procure death for themselves.”
translation:
  language: ru
  text: 'Но есть и такие удовольствия, которые спасают людей: ведь многие, делая добро, получают удовольствие, увлекаясь собственным удовольствием. Поэтому такое удовольствие полезно рабам Божьим и приносит жизнь такому человеку. А упомянутые прежде вредные удовольствия навлекают на них мучения и наказания; если же они упорствуют и не каются, то навлекают на себя смерть.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφαί / τρυφή
  choice: удовольствия / удовольствие
  rationale: В данном отрывке слово обозначает приятное удовлетворение, получаемое как от дурных, так и от добрых дел. «Удовольствие» сохраняет эту нравственно нейтральную основу лучше, чем однозначно отрицательные «излишества» или «потворство».
- source_word: σώζουσαι
  choice: которые спасают
  rationale: Сохранено прямое значение причастия и намеренно не сужен возможный богословский смысл спасения.
- source_word: τῇ ἑαυτῶν ἡδονῇ φερόμενοι
  choice: следуя собственному доброму желанию
  rationale: Передаёт побуждение внутренним удовольствием, а добавление «доброму» естественно связывает желание с непосредственно названным деланием добра и предотвращает ложное отрицательное прочтение.
- source_word: σύμφορός
  choice: полезно
  rationale: Передаёт практическую пользу или благотворность без усиления.
- source_word: ζωὴν περιποιεῖται
  choice: приносит жизнь
  rationale: Глагол выражает приобретение или обеспечение результата; «приносит жизнь» естественно по-русски и сохраняет причинно-результативный смысл.
- source_word: βασάνους καὶ τιμωρίας
  choice: мучения и наказания
  rationale: 'Сохраняет различие двух существительных: страдания и карательного последствия.'
- source_word: ἐπιμένωσι
  choice: упорствуют
  rationale: По контексту речь о продолжении ранее названных вредных удовольствий; «упорствуют» кратко передаёт продолжающееся нравственное состояние.
- source_word: ἑαυτοῖς περιποιοῦνται
  choice: навлекают на себя
  rationale: Естественно передаёт то, что люди сами приобретают для себя пагубное последствие.
theological_decisions:
- issue: Связь добрых дел, удовольствия и спасения
  choice: Сохранено утверждение об удовольствиях, «которые спасают», и о том, что они «приносят жизнь».
  alternative: Ослабить формулировку до «полезны» или истолковать спасение исключительно как земное благополучие.
  rationale: Греческий текст прямо употребляет σώζουσαι и ζωήν; перевод не должен заранее разрешать богословское напряжение между добрыми делами, внутренним удовольствием и жизнью.
- issue: Условие гибельного исхода
  choice: «если же они упорствуют и не каются»
  alternative: Представить смерть безусловным следствием всякого вредного удовольствия.
  rationale: 'Сохранены оба условия исходного текста: продолжение такого поведения и отсутствие покаяния.'
- issue: Смысл смерти
  choice: «смерть» без поясняющего определения
  alternative: «вечная смерть», «духовная смерть» или «телесная смерть».
  rationale: Источник не уточняет вид смерти, поэтому подлинная неоднозначность сохранена.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Повтор ключевого слова τρυφή по возможности сохранён через «удовольствие», чтобы удержать намеренный контраст между спасительными и вредными удовольствиями. Обращение «рабы Божьи» оставлено как исторически и библейски уместная формула.
