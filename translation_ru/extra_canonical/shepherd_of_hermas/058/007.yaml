revisions:
- from: 'Но есть и такие удовольствия, которые спасают людей: ведь многие, делая добро, находят в этом наслаждение, следуя собственному доброму желанию. Поэтому такое удовольствие полезно рабам Божьим и приносит жизнь подобному человеку. А упомянутые прежде вредные удовольствия приносят им мучения и наказания; если же они упорствуют и не каются, то навлекают на себя смерть.'
  to: 'Но есть и такие удовольствия, которые спасают людей: ведь многие, делая добро, получают удовольствие, увлекаясь собственным удовольствием. Поэтому такое удовольствие полезно рабам Божьим и приносит жизнь такому человеку. А упомянутые прежде вредные удовольствия навлекают на них мучения и наказания; если же они упорствуют и не каются, то навлекают на себя смерть.'
  rationale: 'Исправлено лишь выражение τῇ ἑαυτῶν ἡδονῇ φερόμενοι: устранено добавленное «доброму» и восстановлено прямое указание на собственное удовольствие. Повтор «удовольствие» сохранён намеренно, поскольку он отражает терминологическую и смысловую связность греческого текста. Остальная структура и неоднозначность «спасают», «жизнь» и «смерть» сохранены.'
