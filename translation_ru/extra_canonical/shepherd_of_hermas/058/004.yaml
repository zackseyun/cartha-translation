  to: Итак, претерпевая мучения и наказания целый год, он порой вспоминает о потворстве своим желаниям и обмане и понимает, что из-за них терпит бедствия. Так мучается всякий человек, который потворствует своим желаниям и поддаётся обману, потому что, имея жизнь, такие люди предали себя смерти.
