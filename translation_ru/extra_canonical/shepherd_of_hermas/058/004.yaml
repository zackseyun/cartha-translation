base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/004.yaml
  text: “So, being tormented and punished the whole year, he remembers the indulgence and the deception, and he knows that because of them he suffers evil things. Every person who indulges himself and is deceived is tormented in this way, because, though having life, they have handed themselves over to death.”
translation:
  language: ru
  text: Итак, претерпевая мучения и наказания целый год, он порой вспоминает о потворстве своим желаниям и обмане и понимает, что из-за них терпит бедствия. Так мучается всякий человек, который потворствует своим желаниям и поддаётся обману, потому что, имея жизнь, такие люди предали себя смерти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασανιζόμενος
  choice: терпя мучение
  rationale: Передаёт длительное страдание, выраженное причастием настоящего времени, без излишне узкого оттенка пытки.
- source_word: τιμωρούμενος
  choice: терпя ... наказание
  rationale: Сохраняет различие между βάσανος и τιμωρία и их параллелизм.
- source_word: τρυφῆς
  choice: потворство своим желаниям
  rationale: В контексте речь не просто о роскоши или удовольствии, а о пагубном самоуслаждении через удовлетворение страстей; выбранное выражение естественно по-русски и согласуется с пояснением в следующем абзаце.
- source_word: ἀπάτης / ἀπατώμενος
  choice: обман / поддаётся обману
  rationale: Сохраняет лексическую связь однокоренных форм и допускает смысл как самообмана, так и состояния обольщённости, не фиксируя один вариант.
- source_word: πάσχει τὰ πονηρά
  choice: терпит бедствия
  rationale: Естественно передаёт буквальное «претерпевает дурное/злое» в значении тяжких последствий.
- source_word: παραδεδώκασι
  choice: предали себя
  rationale: Сохраняет сильный образ сознательной или фактической отдачи себя во власть смерти.
theological_decisions:
- issue: Соотношение имеющейся жизни и добровольной отдачи смерти
  choice: «имея жизнь, такие люди предали себя смерти»
  alternative: «хотя были живы, обрекли себя на смерть»
  rationale: Выбранная формулировка сохраняет богословское напряжение оригинала между обладанием жизнью и передачей себя смерти, не сводя ζωή только к физическому существованию и не добавляя толкования.
- issue: Числовой переход от единственного к множественному
  choice: «всякий человек... такие люди предали себя»
  alternative: полностью выровнять фразу в единственном числе
  rationale: Оригинал начинает с собирательного единственного πᾶς ... ἄνθρωπος, а затем переходит к множественному ἔχοντες ... ἑαυτούς ... παραδεδώκασι; перевод сохраняет этот риторический переход в понятной русской форме.
translation_notes:
  register: 'Современный литературный русский язык, достойный и общедоступный. Синтаксис слегка упрощён ради ясности, но причинная связь и повтор ключевых понятий сохранены. Местоимение «прежнее» добавлено контекстуально: воспоминание во время годичного наказания относится к предшествовавшему дню потворства и обмана.'
