  text: “What indulgences, sir,” I say, “are harmful?”
translation:
  language: ru
  text: — Какие удовольствия, господин, вредны? — спросил я.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφαί
  choice: удовольствия
  rationale: Во множественном числе слово обозначает приятные занятия или способы потакания своим желаниям. «Удовольствия» естественно по-русски и сохраняет широту значения, которая раскрывается в последующем ответе.
- source_word: κύριε
  choice: господин
  rationale: Уважительное обращение к собеседнику; здесь не является обращением к Богу и потому передано со строчной буквы.
- source_word: βλαβεραί
  choice: вредны
  rationale: Прямо передаёт характеристику удовольствий как причиняющих духовный вред, не уточняя его природу сверх греческого текста.
- source_word: φημί
  choice: спрашиваю я
  rationale: Буквально «говорю я», но форма реплики является вопросом; «спрашиваю я» звучит естественно и ясно обозначает речевой акт.
theological_decisions:
- issue: Нравственная окраска слова τρυφαί
  choice: удовольствия
  alternative: пагубные наслаждения / излишества
  rationale: Сам вопрос выясняет, какие именно удовольствия вредны, а дальнейший контекст различает вредные и спасительные удовольствия. Поэтому заранее отрицательно окрашенный перевод снял бы намеренное смысловое напряжение.
translation_notes:
  register: Современный литературный русский язык; уважительное, но не архаическое обращение. Инверсия «спрашиваю я» сохраняет повествовательную рамку и ритм диалога.
