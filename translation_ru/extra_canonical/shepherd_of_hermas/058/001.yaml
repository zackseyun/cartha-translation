base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/001.yaml
  text: “Since,” I say, “sir, I have not understood at all about the time of deception and indulgence and torment, make it more clear to me.”
translation:
  language: ru
  text: — Господин, — сказал я, — я совсем не понял, какова продолжительность обмана, наслаждения и мучения. Объясни мне это яснее.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: господин
  rationale: В обращении к собеседнику слово передаёт уважительное «господин»; перевод «Господи» мог бы ошибочно представить адресата как Бога.
- source_word: ἀπάτης
  choice: обмана
  rationale: Сохранено основное значение существительного ἀπάτη и его связь с последующим нравственным наставлением; возможный оттенок «заблуждения» не исключён контекстом.
- source_word: τρυφῆς
  choice: наслаждения
  rationale: Здесь речь об удовольствии и потворстве желаниям; нейтральное «наслаждение» сохраняет связь как с вредными, так и со спасительными проявлениями, описанными далее.
- source_word: βασάνου
  choice: мучения
  rationale: Передаёт тяжёлое страдание или истязание без преждевременного уточнения его характера.
- source_word: τηλαυγέστερόν μοι δήλωσον
  choice: Объясни мне яснее
  rationale: Естественно по-русски передаёт просьбу сделать сказанное более ясным и очевидным.
theological_decisions:
- issue: К кому обращено κύριε
  choice: господин
  alternative: Господи
  rationale: Грамматика сама по себе допускает уважительное обращение, а повествовательный контекст указывает на обращение к наставляющему персонажу, поэтому не следует прямо отождествлять его с Богом.
- issue: Нравственная окраска τρυφή
  choice: наслаждение
  alternative: потворство себе
  rationale: В последующем тексте τρυφή бывает как вредной, так и спасительной; исключительно отрицательный перевод снял бы намеренное смысловое напряжение.
translation_notes:
  register: Современная литературная русская речь с достоинством раннехристианского диалога. Синтаксис слегка выровнен для естественности, при этом сохранены три ключевых понятия и просьба о более ясном объяснении.
