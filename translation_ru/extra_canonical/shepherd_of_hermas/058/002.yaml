  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/002.yaml
  text: He answered me and says, “Your foolishness is persistent, and you are unwilling to cleanse your heart and to serve God. Watch out lest the time be fulfilled, and you be found foolish. Listen then,” he says, “as you desire, so that you may understand these things.
translation:
  language: ru
  text: 'Он ответил мне и сказал: «Твоё неразумие не покидает тебя, и ты не желаешь очистить своё сердце и служить Богу. Берегись, — сказал он[a], — как бы не исполнилось время и ты не оказался неразумным. Итак, слушай, — сказал он, — как ты того желаешь, чтобы понять всё это».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте слова «сказал он» в этом месте и далее заключены в квадратные скобки; их принадлежность исходному тексту не вполне несомненна.
    reason: Передаёт текстологическую неопределённость, обозначенную квадратными скобками в предоставленном греческом издании, не скрывая слов, включённых в основной английский аудиторский текст.
lexical_decisions:
- source_word: Ἡ ἀφροσύνη σου παράμονός ἐστι
  choice: Твоё неразумие упорно держится в тебе
  rationale: Передаёт устойчивость и длительность состояния, выраженные прилагательным παράμονος, естественным современным русским оборотом.
- source_word: δουλεύειν τῷ Θεῷ
  choice: служить Богу
  rationale: Обычное и точное соответствие религиозному употреблению δουλεύω с дательным падежом.
- source_word: βλέπε
  choice: Смотри
  rationale: Сохраняет прямое предостережение исходного текста; дальнейший оборот «как бы не» раскрывает предупредительный смысл μήποτε.
- source_word: ὁ χρόνος πληρωθῇ
  choice: не исполнился срок
  rationale: «Срок» здесь естественнее отвлечённого «времени» и сохраняет идею достижения назначенной полноты или предела.
- source_word: ἄφρων εὑρεθῇς
  choice: ты не оказался неразумным
  rationale: Сохраняет образ «быть найденным/оказаться» и лексическую связь с ἀφροσύνη без усиления до морально окрашенного «глупец».
- source_word: καθὼς βούλει
  choice: как ты желаешь
  rationale: Сохраняет несколько необычную формулировку и её возможную связь с просьбой рассказчика о более ясном объяснении.
- source_word: ἵνα νοήσῃς αὐτά
  choice: чтобы понять всё это
  rationale: Естественно передаёт цель; αὐτά относится к объясняемым предметам во множественном числе, по-русски идиоматично выраженным как «всё это».
theological_decisions:
- issue: Характер обозначенного времени в выражении ὁ χρόνος πληρωθῇ
  choice: «исполнится срок» без уточнения, кем он назначен и к какому именно событию относится
  alternative: «истечёт отведённое тебе время» или «исполнится время покаяния»
  rationale: Греческий текст сам не уточняет ни обладателя срока, ни его точного эсхатологического или покаянного значения; перевод сохраняет эту открытость.
- issue: Значение ἀφροσύνη/ἄφρων
  choice: последовательно передано как «неразумие/неразумный»
  alternative: «глупость/глупец» или «безумие/безумный»
  rationale: Выбор сохраняет нравственно-духовную серьёзность слов, но не вносит лишней грубости либо современного психиатрического оттенка.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Синтаксис слегка возвышенный, но понятный обычному читателю; прямая речь оформлена естественно. В данном сегменте примечания не требуются.
