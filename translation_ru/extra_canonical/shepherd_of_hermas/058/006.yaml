revisions:
- from: 'Он говорит: «Всякое дело становится для человека наслаждением, если он делает его с удовольствием. Ведь и вспыльчивый, давая полную волю собственной страсти, услаждает себя. Так же и прелюбодей, и пьяница, и клеветник, и лжец, и алчный, и тот, кто обирает других, и всякий, кто поступает подобным образом, насыщает собственную болезнь — и потому услаждается своим поступком. Все эти наслаждения вредны для рабов Божьих. Поэтому из-за этих обольщений и страдают те, кого наказывают и мучат».'
  to: 'Он говорит: «Всякое дело, которое человек делает с удовольствием, есть для него наслаждение. Ведь и вспыльчивый, давая полную волю собственной страсти, предаётся наслаждению; и прелюбодей, и пьяница, и злословец, и лжец, и алчный, и тот, кто обирает других, и всякий, кто делает подобное, удовлетворяет свою собственную болезнь — и потому предаётся наслаждению своим поступком. Все эти наслаждения вредны для рабов Божьих. Поэтому из-за этих обольщений страдают те, кого наказывают и мучат».'
  rationale: Исправлена первая фраза, чтобы прямо передать определение τρυφή как всякого действия, совершаемого с удовольствием. «Услаждает себя» заменено повторяемым «предаётся наслаждению», которое естественнее передаёт τρυφᾷ и сохраняет ключевой повтор. «Клеветник» заменён на более широкое «злословец». Смысловые связи, термин «рабы Божьи» и образ нравственной «болезни» сохранены.
