base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/058/006.yaml
  text: He says, “Every deed is an indulgence to a person, whatever he does with pleasure. For even the hot‑tempered man, by giving his own passion its fill, indulges himself; and the adulterer and the drunkard and the slanderer and the liar and the greedy person and the defrauder and the one doing things like these gives his own disease its fill; he therefore indulges himself in his act. All these indulgences are harmful to the servants of God. Therefore, because of these deceptions, those who are punished and tormented suffer.
translation:
  language: ru
  text: 'Он говорит: «Всякое дело, которое человек делает с удовольствием, есть для него наслаждение. Ведь и вспыльчивый, давая полную волю собственной страсти, предаётся наслаждению; и прелюбодей, и пьяница, и злословец, и лжец, и алчный, и тот, кто обирает других, и всякий, кто делает подобное, удовлетворяет свою собственную болезнь — и потому предаётся наслаждению своим поступком. Все эти наслаждения вредны для рабов Божьих. Поэтому из-за этих обольщений страдают те, кого наказывают и мучат».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τρυφή / τρυφᾷ
  choice: наслаждение / услаждает себя
  rationale: 'Сохраняет повтор ключевого слова и его намеренно широкий смысл: удовольствие может быть как пагубным, так и, согласно последующему контексту, спасительным.'
- source_word: ὀξύχολος
  choice: вспыльчивый
  rationale: Естественно передаёт человека, быстро поддающегося гневу.
- source_word: τῷ ἑαυτοῦ πάθει τὸ ἱκανὸν ποιῶν
  choice: давая полную волю собственной страсти
  rationale: Передаёт образ удовлетворения страсти до насыщения естественным современным русским выражением.
- source_word: κατάλαλος
  choice: клеветник
  rationale: Обозначает человека, злословящего других; выбор понятен современному читателю.
- source_word: πλεονέκτης
  choice: алчный
  rationale: Передаёт ненасытное стремление к приобретению, а не просто бережливость или желание иметь больше.
- source_word: ἀποστερητής
  choice: тот, кто обирает других
  rationale: Передаёт лишение другого принадлежащего ему имущества без неоправданного сужения до конкретной юридической формы хищения.
- source_word: νόσῳ
  choice: болезнь
  rationale: Сохранена метафора порочного влечения как внутренней болезни.
- source_word: ἀπάτας
  choice: обольщения
  rationale: В данном контексте речь идёт не только о фактическом обмане, но о вводящих человека в заблуждение пагубных удовольствиях.
- source_word: τιμωρούμενοι καὶ βασανιζόμενοι
  choice: те, кого наказывают и мучат
  rationale: Сохраняет два отдельных греческих понятия и пассивный смысл.
theological_decisions:
- issue: Нравственная оценка удовольствия
  choice: Ключевое слово передано нейтральным «наслаждение», а пагубность уточняется контекстом.
  alternative: Последовательно переводить как «порочное удовольствие» или «потворство себе».
  rationale: Греческий текст далее говорит и о наслаждениях, спасающих людей; поэтому нельзя заранее вкладывать отрицательную оценку в каждое употребление τρυφή.
- issue: Образ страсти как болезни
  choice: Метафора «насыщает собственную болезнь» сохранена.
  alternative: Истолковать как «удовлетворяет свой порок».
  rationale: Буквальный образ νόσος создаёт важное напряжение между удовольствием человека и его болезненным нравственным состоянием.
translation_notes:
  register: Современный литературный русский язык с dignified назидательной интонацией. Повторы сохранены там, где они образуют аргументацию текста; громоздкое перечисление слегка расчленено для ясности без изменения содержания.
