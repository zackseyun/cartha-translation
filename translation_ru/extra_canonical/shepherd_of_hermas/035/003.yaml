revisions:
- from: «Какие же, господин, бывают пороки, от которых нам следует воздерживаться?» — спросил я. «Слушай, — сказал он. — От супружеской измены и разврата, от беззаконного пьянства, от порочной роскоши, от излишеств в еде и расточительного богатства, от хвастовства, заносчивости и высокомерия, от лжи, злословия и лицемерия, от злопамятства и всякого богохульства»[a].
  to: «Какие же, господин, пороки, от которых нам следует воздерживаться?» — спросил я. «Слушай, — сказал он. — От супружеской измены и разврата, от беззаконного пьянства, от порочной роскоши, от множества яств и роскоши, связанной с богатством, от хвастовства, заносчивости и высокомерия, от лжи, злословия и лицемерия, от злопамятства и всякого богохульства»[a].
