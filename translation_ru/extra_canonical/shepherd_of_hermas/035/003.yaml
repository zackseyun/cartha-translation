base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/003.yaml
  text: '“What kinds, Lord,” I say, “are the wickednesses from which we must exercise self‑control?” “Listen,” he says: “From adultery and fornication, from lawless drunkenness, from wicked luxury, from many foods and the extravagance of wealth and boasting and haughtiness and arrogance, and from lying and slander and hypocrisy, resentment, and every blasphemy.'
translation:
  language: ru
  text: «Какие же, господин, пороки, от которых нам следует воздерживаться?» — спросил я. «Слушай, — сказал он. — От супружеской измены и разврата, от беззаконного пьянства, от порочной роскоши, от множества яств и роскоши, связанной с богатством, от хвастовства, заносчивости и высокомерия, от лжи, злословия и лицемерия, от злопамятства и всякого богохульства»[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово, переведённое как «богохульство», может также означать хулу, оскорбительную или порочащую речь.
    reason: Исходное βλασφημία имеет более широкий диапазон, чем русское «богохульство»; примечание сохраняет эту смысловую неоднозначность.
lexical_decisions:
- source_word: ποταπαί ... αἱ πονηρίαι
  choice: какие же ... пороки
  rationale: «Пороки» естественно передаёт перечисляемые виды нравственного зла; вопросительное ποταπαί передано без искусственной буквальности.
- source_word: μοιχεία καὶ πορνεία
  choice: супружеская измена и разврат
  rationale: Сохранено различие между нарушением супружеской верности и более широким понятием половой распущенности.
- source_word: μέθυσμα ἀνομίας
  choice: беззаконное пьянство
  rationale: Сохранена необычная связь опьянения/пьянства с ἀνομία — беззаконием, без сведения выражения просто к чрезмерному употреблению вина.
- source_word: τρυφὴ πονηρά
  choice: порочная роскошь
  rationale: τρυφή обозначает изнеженную, потворствующую себе роскошную жизнь; «порочная роскошь» кратко сохраняет нравственную оценку автора.
- source_word: ἐδέσματα πολλά
  choice: излишества в еде
  rationale: Буквально «многие яства»; по-русски смысл невоздержанности естественнее выражен как пищевые излишества.
- source_word: πολυτέλεια πλούτου
  choice: расточительное богатство
  rationale: Передана мысль о богатстве, проявляющемся в чрезмерных расходах и пышности; синтаксическая связь исходного текста сохранена без уточнения, которого в нём нет.
- source_word: καύχησις καὶ ὑψηλοφροσύνη καὶ ὑπερηφανία
  choice: хвастовство, заносчивость и высокомерие
  rationale: Три близких, но отдельных понятия переданы тремя русскими словами, чтобы не сглаживать накопительный ряд.
- source_word: καταλαλιά
  choice: злословие
  rationale: Обозначает уничижительную речь о другом человеке, включая клеветнические или порочащие высказывания.
- source_word: μνησικακία
  choice: злопамятство
  rationale: Точно выражает длительное удерживание обиды и недоброжелательность вследствие неё.
- source_word: βλασφημία
  choice: богохульство
  rationale: Традиционное и контекстуально уместное значение, хотя греческое слово может шире обозначать оскорбительную или порочащую речь.
theological_decisions:
- issue: Обращение κύριε
  choice: господин
  alternative: Господи
  rationale: В диалоге рассказчик обращается к наставляющей его фигуре; «господин» не превращает обращение в прямое именование Бога и сохраняет повествовательную ситуацию.
- issue: Объём значения βλασφημία
  choice: богохульство с поясняющей сноской
  alternative: оскорбительные речи / хула
  rationale: Основной текст сохраняет укоренившийся религиозный смысл, а сноска отмечает более широкий лексический диапазон и не исключает хулы на людей.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Перечень сохранён как единая ритмичная фраза; близкие нравственные понятия не объединены. Реплики оформлены естественно для русского диалога.
