base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/001.yaml
  text: “I said to you,” he says, “that the things created by God are twofold; for self‑control is twofold as well. For with regard to some things one must exercise self‑control, and with regard to others one must not.
translation:
  language: ru
  text: '«Я сказал тебе, — говорит он, — что творения Божьи двояки; ведь и воздержание бывает двух видов: в одних случаях нужно воздерживаться, а в других — не нужно».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ κτίσματα τοῦ θεοῦ
  choice: творения Божьи
  rationale: Сохраняет широкое и несколько необычное выражение греческого текста, не сужая его до поступков, вещей или нравственных категорий.
- source_word: διπλᾶ ἐστι
  choice: двояки
  rationale: Кратко передаёт деление на два разряда и сохраняет параллель с последующим διπλῆ.
- source_word: ἡ ἐγκράτεια
  choice: воздержание
  rationale: В данном контексте речь идёт не об общей выдержке, а о сознательном удержании от определённых действий.
- source_word: ἐπί τινων
  choice: в одних случаях… в других
  rationale: Естественно по-русски передаёт контраст без преждевременного уточнения того, от чего именно следует или не следует воздерживаться.
theological_decisions: []
