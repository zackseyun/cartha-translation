revisions:
- from: «Считаешь ли ты всё это добрым?» — спросил он. «Что же, Господин, может быть лучше этого?» — ответил я. «Так живи согласно этому, — сказал он, — и не удерживайся от таких дел — и будешь жить для Бога».
  to: «Считаешь ли ты эти дела добрыми?» — спросил он. «Что, Господин, может быть лучше их?» — ответил я. «Итак, следуй им и не воздерживайся от них — и будешь жить для Бога».
