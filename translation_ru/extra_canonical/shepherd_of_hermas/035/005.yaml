base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/005.yaml
  text: '“Are there still,” I say, “Lord, evil works?” “Indeed, there are many,” he says, “from which the servant of God must exercise self‑control: theft, falsehood, defrauding, false testimony, greed, evil desire, deceit, vainglory, boastfulness, and whatever things are like these.”'
translation:
  language: ru
  text: '«Есть ли ещё, господин, злые дела? — спрашиваю я. — Да, — отвечает он, — и немало таких, от которых раб Божий должен воздерживаться: воровство, ложь, присвоение чужого, лжесвидетельство, алчность, дурное желание, обман, тщеславие, хвастовство и всё тому подобное».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: господин
  rationale: В обращении к наставнику слово означает уважительное «господин», а не обязательно божественный титул «Господь».
- source_word: κλέμμα
  choice: воровство
  rationale: Передаёт конкретное нравственное зло — кражу или воровство — естественным современным словом.
- source_word: ἀποστέρησις
  choice: присвоение чужого
  rationale: Слово обозначает неправомерное лишение другого принадлежащего ему; этот вариант сохраняет отличие от уже названного воровства и звучит понятнее буквального «лишение».
- source_word: πλεονεξία
  choice: алчность
  rationale: Передаёт ненасытное стремление иметь больше и присваивать себе, не сужая значение только до богатства.
- source_word: κενοδοξία
  choice: тщеславие
  rationale: Устойчиво передаёт стремление к пустой славе и одобрению.
- source_word: ἀλαζονεία
  choice: хвастовство
  rationale: Передаёт показную самоуверенность и претенциозное превозношение, сохраняя отличие от тщеславия.
- source_word: ἐγκρατεύεσθαι
  choice: воздерживаться
  rationale: В данном контексте речь идёт о сознательном отказе от злых поступков; «воздерживаться» естественно выражает эту мысль по-русски.
theological_decisions:
- issue: Обращение κύριε к говорящему наставнику
  choice: господин
  alternative: Господь
  rationale: Контекст диалога не отождествляет собеседника с Богом; прописная форма внесла бы неоправданное богословское уточнение.
- issue: Выражение «раб Божий»
  choice: сохранить «раб Божий»
  alternative: служитель Бога
  rationale: Это прямой и традиционно понятный эквивалент δοῦλος τοῦ θεοῦ, сохраняющий образ принадлежности и служения без конфессионального истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского нравственного наставления. Перечень передан ритмично и ясно; разговорная рамка сохранена в настоящем историческом времени, как в греческом тексте.
