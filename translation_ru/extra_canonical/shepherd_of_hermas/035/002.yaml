base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/002.yaml
  text: '“Make it known to me, Lord,” I say, “with respect to what things one must exercise self‑control, and with respect to what things one must not.” “Listen,” he says: “Exercise self‑control with regard to what is evil and do not do it; but do not exercise self‑control with regard to what is good—rather, do it. For if you exercise self‑control so as not to do the good, you commit a great sin; but if you exercise self‑control so as not to do what is evil, you accomplish great righteousness. Therefore exercise self‑control from every wickedness, doing the good.”'
translation:
  language: ru
  text: '«Объясни мне, господин, — говорю я, — от чего следует воздерживаться, а от чего не следует». Он говорит: «Слушай. Воздерживайся от зла и не делай его; от добра же не воздерживайся, но делай его. Ведь если ты воздерживаешься от добра и не делаешь его, то совершаешь великий грех; а если воздерживаешься от зла и не делаешь его, то совершаешь великую праведность. Итак, воздерживайся от всякого зла, делая добро».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκρατεύεσθαι / ἐγκρατεύου / ἐγκρατεύσῃ
  choice: воздерживаться / воздерживайся / воздерживаешься
  rationale: 'Сохраняет повторяющийся ключевой термин и намеренный парадокс: от зла следует воздерживаться, а от добра — нет.'
- source_word: τὸ πονηρόν / πονηρίας πάσης
  choice: зло / всякое зло
  rationale: Естественно передаёт нравственный смысл слов в данном противопоставлении, не сужая его до отдельных злых поступков.
- source_word: τὸ ἀγαθόν
  choice: добро
  rationale: Сохраняет широкое и слегка абстрактное противопоставление злу.
- source_word: ἐργάζῃ
  choice: совершаешь
  rationale: Один русский глагол естественно сочетается и с «грехом», и с «праведностью», сохраняя параллелизм оригинала.
- source_word: κύριε
  choice: господин
  rationale: В контексте обращения рассказчика к наставляющему его собеседнику это уважительное обращение; строчная буква не отождествляет собеседника с Богом.
theological_decisions:
- issue: Связь воздержания, греха и праведности
  choice: Сохранена формула «совершаешь великий грех / совершаешь великую праведность»
  alternative: «тяжко грешишь / поступаешь весьма праведно»
  rationale: Более формальная передача сохраняет богословскую напряжённость и параллелизм ἁμαρτίαν μεγάλην ἐργάζῃ / δικαιοσύνην μεγάλην ἐργάζῃ, не объясняя природу праведности сверх текста.
translation_notes:
  register: Современный литературный русский с ясным, наставительным ритмом. Повторы сохранены как структурно и смыслово значимые; архаизмы и конфессионально маркированная лексика не вводились.
