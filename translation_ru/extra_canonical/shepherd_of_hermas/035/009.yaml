base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/009.yaml
  text: '“First of all: faith, fear of the Lord, love, concord, words of righteousness, truth, endurance—there is nothing better than these in the life of human beings. If someone keeps these and does not exercise self‑control from them, he becomes blessed in his life.'
translation:
  language: ru
  text: 'Прежде всего: вера, страх Господень, любовь, единодушие, слова праведности, истина и терпение. Нет ничего лучше этих добродетелей в человеческой жизни. Кто соблюдает их и не воздерживается от них, тот становится блаженным в своей жизни.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστις
  choice: вера
  rationale: Прямое и естественное соответствие, сохраняющее широкий смысл верности и доверия.
- source_word: φόβος κυρίου
  choice: страх Господень
  rationale: Устоявшееся библейское выражение, передающее благоговейный страх без устранения исходной строгости.
- source_word: ὁμόνοια
  choice: единодушие
  rationale: Передаёт согласие и общность расположения, звучит естественно в нравственном перечне.
- source_word: ῥήματα δικαιοσύνης
  choice: праведные слова
  rationale: Сохраняет конкретное значение ῥήματα и нравственную характеристику родительного δικαιοσύνης.
- source_word: ὑπομονή
  choice: терпение
  rationale: В данном перечне обозначает стойкое перенесение и постоянство; «терпение» наиболее понятно современному читателю.
- source_word: φυλάσσῃ
  choice: хранит
  rationale: Сохраняет образ бережного соблюдения добродетелей, а не только их исполнения.
- source_word: μακάριος
  choice: блаженным
  rationale: Передаёт религиозно-нравственную полноту слова точнее, чем более бытовое «счастливым».
theological_decisions:
- issue: Необычное употребление ἐγκρατεύηται применительно к добру
  choice: не воздерживается от него
  alternative: не удерживает себя от них
  rationale: 'Буквально сохраняет намеренный парадокс всего наставления: от зла следует воздерживаться, а от добра — нет.'
- issue: Обобщающее τούτων после перечня
  choice: всё это / этого / него
  alternative: их / от них
  rationale: Греческое указательное местоимение охватывает весь перечень как совокупность; русский текст естественно чередует собирательные формы, не меняя смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис слегка разгружен по сравнению с греческим, но перечисление, парадокс «не воздерживаться» и богословская напряжённость оригинала сохранены.
