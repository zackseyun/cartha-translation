  text: “And of the good things, Lord,” I say, “declare to me their power, so that I may walk in them and serve them, that by practicing them I may be able to be saved.” “Listen,” he says, “also to the works of the good, which you must do and not exercise self‑control from.
translation:
  language: ru
  text: '«Расскажи мне также, господин, в чём сила добрых дел, — говорю я, — чтобы я следовал им и служил им[a], чтобы, исполняя их, мог спастись». Он говорит: «Послушай же и о добрых делах, которые тебе надлежит совершать, не воздерживаясь от них».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «служить им», то есть добрым делам.'
    reason: Сохранено необычное олицетворённое выражение δουλεύσω αὐτοῖς; сноска кратко поясняет его референт.
lexical_decisions:
- source_word: τῶν ἀγαθῶν ... τὴν δύναμιν
  choice: силу добрых дел
  rationale: Сохраняет прямое значение δύναμις («сила, действенность») и связь с последующим перечислением добрых дел.
- source_word: πορευθῶ ἐν αὐτοῖς
  choice: ходить в них
  rationale: Сохраняет характерную этическую метафору движения и поведения, не сводя её лишь к отдельным поступкам.
- source_word: ἐργασάμενος αὐτά
  choice: исполняя их
  rationale: Естественно передаёт деятельное совершение перечисляемых добрых дел.
- source_word: σωθῆναι
  choice: обрести спасение
  rationale: Передаёт пассивный смысл «быть спасённым» естественным современным русским выражением, не уточняя источник или механизм спасения.
- source_word: τῶν ἀγαθῶν τὰ ἔργα
  choice: дела добра
  rationale: Передаёт необычную греческую конструкцию и отличает её от более обычного выражения «добрые дела» в первой реплике.
- source_word: μὴ ἐγκρατεύεσθαι
  choice: не удерживая себя от них
  rationale: В контексте двойственной «воздержанности» означает не воздерживаться от совершения добра; формулировка сохраняет словесную связь с темой наставления.
theological_decisions:
- issue: Связь исполнения добра и спасения
  choice: «исполняя их, обрести спасение»
  alternative: «благодаря их исполнению спастись»
  rationale: Выбранный вариант сохраняет заявленную в тексте связь, но не усиливает её до однозначной формулы о заслуге или механизме спасения.
- issue: Обращение κύριε
  choice: «господин» со строчной буквы
  alternative: «Господь»
  rationale: Говорящий обращается к наставляющему его персонажу, а не прямо к Богу; перевод не должен создавать иную референцию.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Сохранены повторения, этическая метафора «ходить» и намеренно необычное «служить им»; синтаксис слегка упорядочен для ясности.
