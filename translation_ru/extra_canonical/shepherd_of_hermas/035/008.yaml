revisions:
- from: '«Покажи мне, господин, и силу добрых дел, — говорю я, — чтобы мне ходить в них и служить им[a] и, исполняя их, обрести спасение». Он говорит: «Послушай же и о делах добра, которые тебе надлежит совершать, не удерживая себя от них».'
  to: '«Расскажи мне также, господин, в чём сила добрых дел, — говорю я, — чтобы я следовал им и служил им[a], чтобы, исполняя их, мог спастись». Он говорит: «Послушай же и о добрых делах, которые тебе надлежит совершать, не воздерживаясь от них».'
  rationale: Исправлены активизирующий оттенок «обрести спасение» и менее естественные русские обороты. Перевод сохраняет обращение к наставнику, этическую направленность «ходить в них» через «следовать им», а также намеренно необычное «служить им».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:49:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'В первой реплике καί означает «также»: просьба относится к «силе/значению» добрых вещей (τῶν ἀγαθῶν), которые далее раскрываются как дела. Формула δυνηθῶ σωθῆναι буквально выражает возможность «смочь быть спасённым»; «обрести спасение» несколько активизирует эту конструкцию. Во второй реплике сохранено противопоставление: добро следует делать, а не воздерживаться от него.'
  naturalness: «Покажи мне ... и силу» и «ходить в них» понятны, но менее естественны в современном литературном русском. «Расскажи мне также, в чём сила добрых дел» и «следовать им» яснее, не утрачивая этического смысла образа πορεύεσθαι. «Не воздерживаясь от них» точнее и терминологически последовательнее, чем «не удерживая себя от них».
  terminology: Обращение «господин» уместно. «Добрые дела» естественно передаёт τὰ ἀγαθά в данном контексте и последующее τῶν ἀγαθῶν τὰ ἔργα. Необычное «служить им» сохранено и пояснено сноской.
  issues:
  - severity: medium
    issue: «обрести спасение» вместо пассивной возможности σωθῆναι
    rationale: Фраза «обрести спасение» звучит как активное достижение, тогда как греческое δυνηθῶ σωθῆναι означает «смогу быть спасённым/смогу спастись».
  - severity: low
    issue: Не вполне естественные «Покажи мне ... и силу» и «ходить в них»
    rationale: Обороты буквально мотивированы, но в современном русском их можно сделать яснее без смысловой потери.
  - severity: low
    issue: «Не удерживая себя от них»
    rationale: В контексте ключевого понятия ἐγκρατεύεσθαι более точна и прозрачна формулировка «не воздерживаясь от них».
  revised_text: '«Расскажи мне также, господин, в чём сила добрых дел, — говорю я, — чтобы я следовал им и служил им[a], чтобы, исполняя их, мог спастись». Он говорит: «Послушай же и о добрых делах, которые тебе надлежит совершать, не воздерживаясь от них».'
