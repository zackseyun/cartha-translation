base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/004.yaml
  text: “These deeds are the most evil of all in the life of human beings. From these works, then, the servant of God must exercise self‑control; for the one who does not exercise self‑control from these is not able to live to God. Listen, then, also to the things that follow these.”
translation:
  language: ru
  text: Эти дела — самые злые из всех в человеческой жизни. Поэтому слуге Бога следует воздерживаться от таких дел, ведь тот, кто от них не воздерживается, не может жить для Бога. Послушай теперь и о том, что следует за ними.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἔργα
  choice: дела
  rationale: Передаёт конкретные нравственные поступки и сохраняет повтор ключевого существительного в следующем предложении.
- source_word: πάντων πονηρότατα
  choice: самые злые из всех
  rationale: Сохраняет усиленную превосходную степень и нравственную оценку оригинала без смягчения.
- source_word: ἐγκρατεύεσθαι ἀπό
  choice: воздерживаться от
  rationale: Естественное русское соответствие для самоконтроля, выраженного как отказ от перечисленных злых дел.
- source_word: ὁ δοῦλος τοῦ θεοῦ
  choice: слуга Бога
  rationale: Современная и понятная формулировка, сохраняющая отношение служения и принадлежности без излишней архаизации.
- source_word: ζῆσαι τῷ θεῷ
  choice: жить для Бога
  rationale: Сохраняет направленность дательного τῷ θεῷ и естественно звучит по-русски, не конкретизируя богословский смысл сверх текста.
- source_word: τὰ ἀκόλουθα τούτων
  choice: то, что следует за ними
  rationale: Сохраняет переход к дальнейшему перечню родственных злых дел; местоимение оставляет референт в той же мере контекстуальным, что и греческий текст.
theological_decisions:
- issue: Смысл выражения ζῆσαι τῷ θεῷ
  choice: жить для Бога
  alternative: жить перед Богом / жить Богу
  rationale: «Для Бога» наиболее естественно передаёт ориентацию жизни на Бога, не вводя идеи судебного предстояния, которой само выражение прямо не требует.
- issue: Обозначение верующего как δοῦλος τοῦ θεοῦ
  choice: слуга Бога
  alternative: раб Божий
  rationale: «Слуга Бога» сохраняет смысл служения и подчинения, оставаясь понятным современному читателю; вариант «раб Божий» возможен, но сильнее маркирован церковной традицией.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Сохранены категоричность нравственной оценки, причинная связь и повелительный переход к продолжению речи; архаизмы и конфессионально маркированные формулы не вводились.
