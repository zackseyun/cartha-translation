base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/012.yaml
  text: “Therefore keep this commandment. If you do the good and do not exercise self‑control from it, you will live to God—and all who act in this way will live to God. And again, if you do not do the evil and exercise self‑control from it, you will live to God; and all will live to God—whoever keeps these commandments and walks in them.”
translation:
  language: ru
  text: 'Итак, соблюдай эту заповедь. Если будешь делать добро и не станешь воздерживаться от него, будешь жить для Бога; и все, кто так поступает, будут жить для Бога. И ещё: если не будешь делать зла и станешь воздерживаться от него, будешь жить для Бога; и все, кто соблюдает эти заповеди и следует им, будут жить для Бога.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φύλασσε
  choice: соблюдай
  rationale: В контексте заповеди глагол означает хранить её через исполнение; «соблюдай» естественно и точно передаёт этот смысл.
- source_word: ἐγκρατεύσῃ ἀπ᾿ αὐτοῦ
  choice: станешь воздерживаться от него
  rationale: 'Сохранена ключевая лексическая связь со всей восьмой заповедью: воздержание направлено на зло, но не должно быть направлено на добро.'
- source_word: ζήσῃ τῷ θεῷ
  choice: будешь жить для Бога
  rationale: Дательный τῷ θεῷ допускает передачу направленности и посвящённости жизни Богу; формулировка сохраняет характерный оборот раздела без лишнего истолкования.
- source_word: πορευθῶσιν ἐν αὐταῖς
  choice: следует им
  rationale: Греческая идиома буквально говорит о хождении в заповедях; современное русское «следовать им» ясно передаёт постоянное устроение жизни по ним.
theological_decisions:
- issue: Связь дел добра и воздержания от зла с жизнью для Бога
  choice: Сохранены прямые условные высказывания источника без пояснения механизма спасения или заслуги.
  alternative: Ослабить условность либо добавить, что речь идёт лишь о свидетельстве уже имеющейся веры.
  rationale: Греческий текст прямо связывает такое поведение с будущим «будешь жить для Бога»; перевод не должен привносить конфессиональное разрешение этой напряжённости.
- issue: Единственное и множественное число слова «заповедь»
  choice: Сохранено «эту заповедь» в первом предложении и «эти заповеди» в заключении.
  alternative: Унифицировать оба упоминания как единственное число.
  rationale: Источник действительно переходит от τὴν ἐντολὴν ταύτην к ταύτας τὰς ἐντολάς; эта текстовая особенность сохранена.
translation_notes:
  register: Современный литературный русский, ясный и достойный по тону. Повторения «будешь жить для Бога» и «будут жить для Бога» сохранены как риторически и богословски значимые. Синтаксис слегка упрощён ради естественного чтения, без устранения параллелизма добра и зла.
