  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/006.yaml
  text: “Do these not seem to you to be evil?” “Very evil,” I say, “for the servants of God.” “From all these the one who serves God must exercise self‑control. Exercise self‑control, then, from all these, that you may live to God and be enrolled with those who exercise self‑control from them. These, then, are the things from which you must exercise self‑control.
translation:
  language: ru
  text: «Разве эти дела не кажутся тебе злыми?» — сказал он. «Да, господин, для служителей Бога они весьма злы», — ответил я. «Тот, кто служит Богу, должен воздерживаться от всего этого. Итак, воздерживайся от всего этого, чтобы жить для Бога и быть вписанным в число тех, кто от этого воздерживается. Вот от чего тебе следует воздерживаться».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρά
  choice: злыми
  rationale: Передаёт нравственную оценку поступков; связь с ранее названными πονηρὰ ἔργα сохраняется добавлением «дела».
- source_word: τοῖς δούλοις τοῦ θεοῦ
  choice: для служителей Бога
  rationale: «Служители» естественнее в современном русском нравственно-религиозном наставлении, чем буквальное «рабы», при сохранении смысла принадлежности и служения Богу.
- source_word: τὸν δουλεύοντα τῷ θεῷ
  choice: тот, кто служит Богу
  rationale: Передаёт причастную конструкцию ясно и без стилистической тяжести.
- source_word: ἐγκρατεύεσθαι / ἐγκράτευσαι
  choice: воздерживаться / воздерживайся
  rationale: В данном контексте глагол означает отказ от перечисленных пороков, а не только общее самообладание.
- source_word: ζήσῃ τῷ θεῷ
  choice: жить для Бога
  rationale: Сохраняет необычную дательную конструкцию и её направленность, не уточняя богословски, означает ли она посвящённость, угодность или жизнь перед Богом.
- source_word: ἐγγραφήσῃ
  choice: быть вписанным
  rationale: Сохраняет образ внесения в список или число определённой группы.
theological_decisions:
- issue: Смысл выражения ζῆν τῷ θεῷ
  choice: жить для Бога
  alternative: жить с Богом / жить перед Богом
  rationale: Греческий дательный допускает оттенки отношения и направленности; выбранная формулировка наиболее прямо сохраняет конструкцию без привнесения идеи мистического единения или суда.
- issue: Обозначение верующих как δοῦλοι τοῦ θεοῦ
  choice: служители Бога
  alternative: рабы Божьи
  rationale: Выбор сохраняет центральную идею служения и избегает ненужной архаичности; в пределах этого отрывка словесная связь с δουλεύοντα передана единым корнем «служ-».
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Диалог оформлен естественно; повторы «от всего этого» и «воздерживаться» сохранены как важная риторическая и смысловая особенность оригинала.
