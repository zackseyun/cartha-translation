base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/007.yaml
  text: '“But the things from which you must not exercise self‑control,” he says, “but rather do them—listen: Do not exercise self‑control with regard to the good, but do it.”'
translation:
  language: ru
  text: «А теперь послушай, — говорит он, — о том, от чего тебе не следует воздерживаться, но что следует делать. Не воздерживайся от добра, а делай его».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκρατεύεσθαι
  choice: воздерживаться
  rationale: В данном контексте глагол означает удерживать себя от совершения чего-либо. «Воздерживаться» естественно по-русски и сохраняет повторяющийся словесный мотив всего наставления.
- source_word: τὸ ἀγαθόν
  choice: добро
  rationale: Субстантивированное прилагательное обозначает добро как нравственную категорию; форма «добро» точнее и естественнее, чем «доброе» без существительного.
- source_word: ποιεῖν / ποίει
  choice: делать / делай
  rationale: Сохраняет прямое противопоставление между воздержанием от добра и его совершением без добавочного истолкования.
- source_word: ἄκουε
  choice: послушай
  rationale: Передаёт повелительную форму в естественной современной русской речи и вводит последующее наставление.
theological_decisions:
- issue: Парадоксальное выражение «не воздерживаться от добра»
  choice: 'Сохранить буквальное противопоставление: «Не воздерживайся от добра»'
  alternative: «Не удерживай себя от добрых дел»
  rationale: Источник намеренно применяет понятие воздержания и к злу, и к добру. Сохранение этой напряжённой формулировки поддерживает логику всего Восьмого наставления и не сводит «добро» только к отдельным делам.
translation_notes:
  register: Современный литературный русский язык с простой, наставительной и dignified интонацией. Повтор ключевого глагола сохранён ради риторической связи с окружающим разделом; порядок слов слегка перестроен для естественности русской речи.
