base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/035/010.yaml
  text: '“Next, hear what follows these: to serve widows; to visit orphans and those in want; to redeem the servants of God from distresses; to be hospitable (for in hospitality one sometimes finds an opportunity for doing good); to oppose no one; to be quiet; to become lower than all people; to honor the elderly; to practice righteousness; to preserve the brotherhood; to endure insult; to be long‑suffering; to have no resentment; to encourage those who are weary in soul; not to cast off those who have stumbled away from the faith, but to turn them back and make them cheerful; to admonish those who sin; not to oppress debtors and the needy; and if there is anything like these.'
translation:
  language: ru
  text: '«Затем послушай, что следует за этим: служить вдовам, навещать сирот и нуждающихся, избавлять рабов Божьих от бедствий, быть гостеприимным (ведь в гостеприимстве порой находится возможность сделать добро), никому не противиться, быть спокойным, ставить себя ниже всех людей, почитать старших, поступать праведно, хранить братское единство, переносить оскорбления, быть долготерпеливым, не таить обиды, ободрять изнемогающих душой, не отвергать тех, кто сбился с пути веры, но возвращать их и вселять в них бодрость, вразумлять согрешающих, не притеснять должников и нуждающихся — и всё тому подобное».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χήραις ὑπηρετεῖν
  choice: служить вдовам
  rationale: Передаёт конкретное деятельное служение без сужения до одной лишь материальной помощи.
- source_word: ὑστερουμένους ἐπισκέπτεσθαι
  choice: навещать ... нуждающихся
  rationale: ἐπισκέπτεσθαι подразумевает заботливое посещение, а ὑστερουμένους — людей, испытывающих недостаток.
- source_word: ἐξ ἀναγκῶν λυτροῦσθαι
  choice: избавлять ... от бедствий
  rationale: Сохраняет образ освобождения из стеснительных обстоятельств; множественное ἀνάγκαι здесь шире, чем денежный выкуп.
- source_word: ἀγαθοποίησις
  choice: возможность сделать добро
  rationale: В скобочном пояснении естественно выражает совершение благого дела, не превращая его в отвлечённую добродетель.
- source_word: μηδενὶ ἀντιτάσσεσθαι
  choice: никому не противиться
  rationale: Сохраняет широкое и несколько напряжённое предписание оригинала, не уточняя без основания вид противодействия.
- source_word: ἡσύχιον εἶναι
  choice: быть мирным
  rationale: В данном нравственном перечне обозначает спокойный, не склонный к распрям образ поведения; буквальное «быть тихим» по-русски может звучать слишком узко.
- source_word: ἐνδεέστερον γίνεσθαι πάντων ἀνθρώπων
  choice: ставить себя ниже всех людей
  rationale: Передаёт сравнительное самоуничижение как установку смирения, избегая неясного буквального «стать более нуждающимся».
- source_word: ἀδελφότητα συντηρεῖν
  choice: хранить братское единство
  rationale: ἀδελφότης может означать братство как общину или братские отношения; формулировка сохраняет обе стороны смысла.
- source_word: ὕβριν ὑποφέρειν
  choice: переносить оскорбления
  rationale: ὕβρις здесь означает унизительное, дерзкое обращение; «оскорбления» естественно передаёт объект терпения.
- source_word: κάμνοντας τῇ ψυχῇ
  choice: изнемогающих душой
  rationale: Сохраняет образ внутренней усталости или упадка сил без диагностического уточнения.
- source_word: ἐσκανδαλισμένους ἀπὸ τῆς πίστεως
  choice: тех, кто отпал от веры
  rationale: Передаёт результат духовного преткновения и удаления от веры; не усиливает его до окончательного отступничества.
- source_word: εὐθύμους ποιεῖν
  choice: вселять в них бодрость
  rationale: Обозначает возвращение мужества и доброго расположения духа.
- source_word: χρεώστας μὴ θλίβειν
  choice: не притеснять должников
  rationale: θλίβειν — давить, теснить, причинять тягость; «притеснять» сохраняет социально-нравственный смысл.
theological_decisions:
- issue: Обозначение членов Божьего народа в выражении τοὺς δούλους τοῦ θεοῦ
  choice: рабов Божьих
  alternative: служителей Божьих
  rationale: «Рабы Божьи» формально и традиционно передаёт δοῦλοι, включая принадлежность и служение Богу; «служители» могло бы ошибочно сузить смысл до церковного служения.
- issue: Состояние ἐσκανδαλισμένους ἀπὸ τῆς πίστεως
  choice: кто отпал от веры
  alternative: кто поколебался в вере / кого вера соблазнила
  rationale: Предлог ἀπό указывает на удаление от веры вследствие преткновения. Перевод сохраняет возможность возвращения и не объявляет состояние необратимым.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского нравственного наставления. Сохранена ритмика перечня инфинитивов, но повторения оформлены естественно для русского синтаксиса. Кавычки показывают прямую речь в рамках диалога.
