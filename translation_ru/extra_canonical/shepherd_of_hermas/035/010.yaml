- from: '«А теперь послушай, что следует за этим: служить вдовам, навещать сирот и нуждающихся, избавлять рабов Божьих от бедствий, быть гостеприимным (ведь гостеприимство порой даёт возможность сделать добро), никому не противиться, быть мирным, ставить себя ниже всех людей, почитать старших, поступать праведно, хранить братское единство, переносить оскорбления, быть долготерпеливым, не таить обиды, ободрять изнемогающих душой, не отвергать тех, кто отпал от веры, но возвращать их и вселять в них бодрость, вразумлять согрешающих, не притеснять должников и нуждающихся — и делать всё тому подобное».'
