base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/005.yaml
  text: 'For the Master swore by his glory concerning his chosen ones: if, after this appointed day, sin should still occur, they have no salvation; for repentance has an end for the righteous. The days of repentance have been fulfilled for all the holy ones, but for the nations there is repentance until the last day.'
translation:
  language: ru
  text: 'Ибо Владыка поклялся Своей славой относительно Своих избранных: если после этого установленного дня грех всё же совершится, им не будет спасения. Ведь покаянию праведных положен предел: дни, отведённые для покаяния, исполнились для всех святых; народам же покаяние доступно до последнего дня.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεσπότης
  choice: Владыка
  rationale: Передаёт значение верховного Господина и отличает этот титул от Κύριος в соседнем контексте.
- source_word: κατὰ τῆς δόξης αὐτοῦ
  choice: Своей славой
  rationale: Естественная русская формула клятвы, соответствующая греческому обороту с κατά.
- source_word: τοὺς ἐκλεκτοὺς αὐτοῦ
  choice: избранных Своих
  rationale: Сохраняет традиционную и богословски нейтральную передачу ἐκλεκτοί.
- source_word: μετάνοια
  choice: покаяние
  rationale: Передаёт не только сожаление, но обращение и перемену жизни в раннехристианском контексте.
- source_word: τοῖς ἔθνεσιν
  choice: для язычников
  rationale: В противопоставлении «праведным» и «святым» речь идёт о людях из народов вне общины, поэтому «язычники» точнее общего «народы».
theological_decisions:
- issue: Ограниченный срок покаяния для праведных и святых
  choice: 'Сохранено прямое утверждение: «для праведных покаяние имеет предел» и «дни покаяния уже исполнились».'
  alternative: Смягчить как предупреждение о том, что возможность покаяния может закончиться.
  rationale: Греческий текст выражается категорично; смягчение устранило бы присущее месту богословское напряжение.
- issue: Отсутствие спасения при последующем грехе
  choice: «им не будет спасения»
  alternative: «они рискуют лишиться спасения»
  rationale: Форма μὴ ἔχειν αὐτοὺς σωτηρίαν не выражает лишь риск, поэтому категоричность источника сохранена.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Синтаксис упрощён лишь настолько, чтобы длинное греческое предложение читалось естественно; категоричность и богословское напряжение оригинала сохранены.
