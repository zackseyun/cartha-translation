revisions:
- from: 'Ибо Владыка поклялся Своей славой об избранных Своих: если после назначения этого дня ещё случится грех[a], им не будет спасения. Ведь для праведных покаяние имеет предел: для всех святых дни покаяния уже исполнились, а для язычников покаяние возможно до последнего дня.'
  to: 'Ибо Владыка поклялся Своей славой относительно Своих избранных: если после этого установленного дня грех всё же совершится, им не будет спасения. Ведь покаянию праведных положен предел: дни, отведённые для покаяния, исполнились для всех святых; народам же покаяние доступно до последнего дня.'
  rationale: Исправлен временной смысл генитива абсолютного ὡρισμένης τῆς ἡμέρας ταύτης и восстановлен широкий смысл τοῖς ἔθνεσιν. Формулировки о пределе покаяния и отсутствии спасения сохранены категоричными, как в греческом тексте. Сноска снята, поскольку исправленный русский текст сохраняет безличность и неопределённость события греха без ущерба для чтения.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:47:58Z'
review_pass:
  verdict: revise
  source_fidelity: Требуется исправление двух мест. ὡρισμένης τῆς ἡμέρας ταύτης означает «после этого назначенного/установленного дня», а не «после назначения этого дня». Кроме того, τοῖς ἔθνεσιν прямо означает «народам»; контекст данного предложения не позволяет без оговорки сужать его до «язычников».
  naturalness: «После назначения этого дня» звучит по-русски так, будто речь идёт о действии назначения, а не о наступлении установленного дня. В исправленном варианте сохранён торжественный, но современный литературный строй фразы.
  terminology: «Владыка», «избранные», «спасение», «покаяние», «праведные» и «святые» передают греческие термины адекватно. «Народы» сохраняет объём ἔθνη и не навязывает интерпретацию «язычники».
  issues:
  - severity: medium
    issue: Неточная передача ὡρισμένης τῆς ἡμέρας ταύτης
    rationale: 'Фраза «после назначения этого дня» изменяет временную отнесённость оборота. Речь идёт о дне, уже определённом как срок: «после этого установленного дня».'
  - severity: medium
    issue: Необоснованное сужение τοῖς ἔθνεσιν до «язычников»
    rationale: Греческое ἔθνη значит «народы»; ближайший контекст не уточняет, что имеются в виду исключительно люди вне общины. Следует сохранить более широкий термин.
  - severity: low
    issue: Сноска повторяет неточное «после назначения этого дня»
    rationale: 'После исправления основного текста пояснение о безличном характере ἁμάρτησις γένηται не требуется: «грех всё же совершится» достаточно естественно передаёт конструкцию без конкретизации вида греха.'
