base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/002.yaml
  text: “Your offspring, Hermas, have rejected God and blasphemed the Lord, and they have betrayed their parents in great wickedness, and they were heard as betrayers of parents; and though they betrayed them, they gained no advantage, but they added still to their sins licentious acts and mixtures of wickedness, and thus their lawless deeds were filled up.
translation:
  language: ru
  text: «Твои дети, Ерма, отвергли Бога и хулили Господа. Они предали своих родителей, совершив великое злодеяние, и прослыли предателями родителей[a]. Но, предав их, они не получили никакой пользы; напротив, к своим грехам они прибавили распутство и разного рода злодеяния, и так их беззакония достигли полноты».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение буквально можно передать как «о них услышали как о предателях родителей»; вероятный смысл — они стали известны под таким именем.
    reason: Исходная конструкция ἤκουσαν προδότας γονέων необычна и допускает более буквальное понимание, поэтому неоднозначность отмечена для читателя.
lexical_decisions:
- source_word: Τὸ σπέρμα σου
  choice: Твои дети
  rationale: Буквально «твоё семя, потомство»; в контексте речь идёт о детях Ермы, поэтому естественное русское обозначение сохраняет конкретный смысл.
- source_word: ἠθέτησαν εἰς τὸν Θεόν
  choice: отвернулись от Бога
  rationale: Ἀθετέω означает отвергать, пренебрегать, нарушать верность; формулировка передаёт личностную направленность выражения без излишнего догматического уточнения.
- source_word: ἐβλασφήμησαν εἰς τὸν Κύριον
  choice: хулили Господа
  rationale: Прямой и устойчивый русский эквивалент для βλασφημέω с сохранением различия между Богом и Господом в исходном тексте.
- source_word: ἤκουσαν προδότας γονέων
  choice: прослыли предателями родителей
  rationale: 'Буквально конструкция необычна: «были услышаны как предатели родителей». По смыслу ἀκούω здесь, вероятно, относится к тому, что о них говорили или как их называли.'
- source_word: οὐκ ὠφελήθησαν
  choice: не принесло им пользы
  rationale: Передаёт медиально-пассивное «не получили пользы» естественной русской фразой, не добавляя предположений о характере ожидаемой выгоды.
- source_word: τὰς ἀσελγηίας
  choice: распутство
  rationale: Ἀσέλγεια обозначает необузданное, бесстыдное поведение, часто с оттенком половой распущенности; собирательное «распутство» уместно в русском контексте.
- source_word: συμφυρμοὺς πονηρίας
  choice: всяческую скверну
  rationale: Буквально «смешения/нагромождения зла»; выбранная формулировка естественно передаёт совокупность порочных дел, не конкретизируя их сверх текста.
- source_word: ἐπλήσθησαν αἱ ἀνομίαι αὐτῶν
  choice: их беззакония достигли полноты
  rationale: Сохраняет образ наполнения и возможный смысл достижения предела, не сводя выражение просто к количественному умножению грехов.
theological_decisions:
- issue: Референты «Бог» и «Господь»
  choice: Сохранены как два последовательно употреблённых обозначения без отождествляющего пояснения.
  alternative: Передать оба слова одним титулом или явно истолковать «Господа» христологически.
  rationale: Исходный текст различает τὸν Θεόν и τὸν Κύριον, но в данном предложении не разъясняет соотношение референтов; перевод сохраняет эту напряжённость.
- issue: Образ полноты беззаконий
  choice: «достигли полноты»
  alternative: «умножились» или «переполнили меру»
  rationale: Первый вариант ослабляет метафору, а второй добавляет отсутствующий в греческом тексте образ меры; выбранная передача ближе к ἐπλήσθησαν.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского обличительного текста. Синтаксис разделён на несколько фраз ради ясности, при этом сохранены нарастание обвинений, повтор слова «родители» и заключительный образ полноты беззаконий.
