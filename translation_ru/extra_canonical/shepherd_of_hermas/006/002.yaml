revisions:
- from: '«Твои дети, Ерма, отвернулись от Бога и хулили Господа. Они с великой злобой предали своих родителей и прослыли предателями родителей[a]. Но предательство не принесло им пользы: к своим грехам они прибавили распутство и всяческую скверну, и так их беззакония достигли полноты».'
  to: «Твои дети, Ерма, отвергли Бога и хулили Господа. Они предали своих родителей, совершив великое злодеяние, и прослыли предателями родителей[a]. Но, предав их, они не получили никакой пользы; напротив, к своим грехам они прибавили распутство и разного рода злодеяния, и так их беззакония достигли полноты».
  rationale: Редакция точнее передаёт прямое «отвергли Бога», не сводит πονηρία к эмоциональной злобе и избегает чрезмерного обобщения συμφυρμοὺς πονηρίας. Сноска сохранена, поскольку она корректно маркирует трудную и, вероятно, текстуально либо идиоматически необычную греческую конструкцию. Добавленное «напротив» передаёт усилительное ἀλλά, а «предав их» сохраняет явный референт προηγующего «родителей».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:47:55Z'
review_pass:
  verdict: revise
  source_fidelity: Нужна небольшая правка. ἠθέτησαν требует более прямой передачи «отвергли», а не «отвернулись». ἐν πονηρίᾳ μεγάλῃ означает не столько «со злобой», сколько «в великом злодеянии/нечестии». «Всяческая скверна» чрезмерно обобщает συμφυρμοὺς πονηρίας — «смешения, нагромождения зла»; следует сохранить хотя бы оттенок смешанных или разнородных злодеяний. Необычная конструкция ἤκουσαν προδότας γονέων удачно отмечена сноской.
  naturalness: Предлагаемая редакция сохраняет современный литературный русский и торжественно-обличительный регистр. Формулировка «совершив великое злодеяние» ясна и не приписывает тексту мотив злобы. «Разного рода злодеяния» естественнее буквальной, но малопонятной «смеси зла», сохраняя множественность συμφυρμούς.
  terminology: «Господь», «хулили», «распутство» и «беззакония достигли полноты» уместны. Различие «Бог» / «Господь» сохранено без интерпретации. «Дети» допустимо контекстуально для σπέρμα; перевод не требует замены на более широкое «потомство».
  issues:
  - severity: medium
    issue: «отвернулись от Бога» для ἠθέτησαν εἰς τὸν Θεόν
    rationale: Глагол ἀθετέω прежде всего выражает отвержение, пренебрежение или отказ признать; «отвернулись» смягчает прямое обвинение и вносит иной образ.
  - severity: medium
    issue: «с великой злобой» для ἐν πονηρίᾳ μεγάλῃ
    rationale: Πονηρία здесь обозначает зло, порочность или злодеяние, а не обязательно внутреннюю эмоцию злобы.
  - severity: medium
    issue: «всяческую скверну» для συμφυρμοὺς πονηρίας
    rationale: Такое решение стирает образ смешений либо нагромождений зла и неоправданно связывает выражение со «скверной».
