base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/001.yaml
  text: 'After fifteen days, when I had been fasting and had asked the Lord many things, the understanding of the writing was revealed to me. And this was written:'
translation:
  language: ru
  text: 'После того как я постился пятнадцать дней и о многом вопрошал Господа, мне открылся смысл написанного. А написано было следующее:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλὰ ἐρωτήσαντος τὸν Κύριον
  choice: о многом вопрошал Господа
  rationale: πολλά допускает значение «о многом / многое»; «вопрошал» сохраняет молитвенно-торжественный оттенок, не уточняя, были ли это вопросы или просьбы.
- source_word: ἡ γνῶσις τῆς γραφῆς
  choice: смысл написанного
  rationale: Буквально — «знание/понимание писания». В данном контексте речь идёт о понимании ранее увиденного письменного текста; выбор естественен по-русски и не создаёт ненужной ассоциации со Священным Писанием как корпусом.
- source_word: ἀπεκαλύφθη μοι
  choice: мне открылся
  rationale: Сохраняет пассивную идею дарованного откровения и естественно сочетается со словом «смысл».
- source_word: ἦν δὲ γεγραμμένα ταῦτα
  choice: А написано было следующее
  rationale: Передаёт вводную формулу перед цитируемым содержанием; средний род множественного числа ταῦτα естественно выражен русским «следующее».
theological_decisions:
- issue: Кем даровано понимание текста
  choice: Сохранена безлично-пассивная формулировка «мне открылся»
  alternative: «Господь открыл мне»
  rationale: Греческий текст прямо не называет действующего субъекта; перевод не добавляет его, хотя контекст позволяет подразумевать Бога.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным оттенком. «Вопрошал» поддерживает достоинство раннехристианского повествования, а синтаксис остаётся ясным для обычного читателя.
