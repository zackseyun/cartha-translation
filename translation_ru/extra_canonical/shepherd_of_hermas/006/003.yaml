base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/003.yaml
  text: But make these words known to all your children and to your wife, who is to be your sister; for she too does not refrain from her tongue, by which she acts wickedly. But when she hears these words, she will refrain, and she will obtain mercy.
translation:
  language: ru
  text: Но передай эти слова всем своим детям и своей супруге, которой предстоит стать тебе сестрой. Ведь и она не удерживает своего языка, которым творит зло. Услышав же эти слова, она станет сдерживаться и обретёт милость.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνώρισον
  choice: передай
  rationale: В данном контексте означает «доведи до сведения, сообщи»; «передай эти слова» естественно по-русски и сохраняет побудительную силу.
- source_word: συμβίῳ
  choice: супруге
  rationale: Слово обозначает спутницу совместной жизни, здесь — жену Ерма; «супруга» соответствует достоинству регистра.
- source_word: τῇ μελλούσῃ σου ἀδελφῇ
  choice: которой предстоит стать тебе сестрой
  rationale: Сохраняет направленность будущего оборота и его необычное, богословски значимое звучание, не подменяя его толкованием о характере дальнейшего брака.
- source_word: οὐκ ἀπέχεται τῆς γλώσσης
  choice: не удерживает своего языка
  rationale: Передаёт устойчивый смысл воздержания от дурной речи естественным русским выражением.
- source_word: ἐν ᾗ πονηρεύεται
  choice: которым творит зло
  rationale: Сохраняет связь злого поведения именно с языком и не сужает значение до одной конкретной разновидности речи.
- source_word: ἕξει ἔλεος
  choice: обретёт милость
  rationale: Передаёт буквально «будет иметь милость» в естественной русской форме, не уточняя явно, от кого она исходит.
theological_decisions:
- issue: Смысл того, что супруга должна стать «сестрой»
  choice: Сохранена формулировка «предстоит стать тебе сестрой»
  alternative: «с которой ты должен жить как с сестрой» или «которая будет тебе сестрой»
  rationale: Греческий текст не разъясняет, подразумевается ли воздержание, изменение отношений или духовное родство; перевод сохраняет эту напряжённость и не вводит конфессионального толкования.
- issue: Характер обещанной милости
  choice: «обретёт милость» без указания субъекта
  alternative: «Бог помилует её»
  rationale: В исходном тексте податель милости прямо не назван, поэтому эксплицировать Бога в основном тексте не следует.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, увещательным тоном. Синтаксис упрощён для ясности, но повтор «эти слова» и логическая последовательность исходника сохранены.
