revisions:
- from: Итак, стойте твёрдо, творящие праведность, и не предавайтесь двоедушию, чтобы ваш переход[a] совершился вместе со святыми ангелами. Блаженны вы, претерпевающие грядущее великое бедствие, и все, кто не отречётся от своей жизни[b].
  to: Итак, будьте стойки, творящие праведность, и не будьте двоедушны, чтобы и ваш переход[a] был вместе со святыми ангелами. Блаженны вы, все, кто претерпевают грядущее великое бедствие и не отрекутся от своей жизни[b].
  rationale: Правка устраняет неестественную русскую сочетаемость, делает синтаксис плавнее и сохраняет множественное число параллельных относительных групп. Неоднозначные πάροδος и «свою жизнь» оставлены в основном тексте и пояснены сносками без смыслового сужения.
