review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан точно: сохранены увещание к стойкости, мотив двоедушия, неоднозначная πάροδος, грядущее великое бедствие и необычный объект «свою жизнь» при ἀρνέομαι. Однако «стойте твёрдо» несколько сужает ἐμμείνατε до героической стойкости, а «чтобы ваш переход совершился» звучит как избыточное и не вполне естественное описание πάροδος.'
  naturalness: '«Не предавайтесь двоедушию» — неестественное для современного литературного русского сочетание. «Будьте стойки ... и не будьте двоедушны» сохраняет лексику и увещательный регистр без этой шероховатости. Также следует сохранить множественное число во втором ὅσοι: «не отрекутся», а не нормативное русское единственное «не отречётся», поскольку речь идёт о тех же множественных адресатах.'
  terminology: «Творящие праведность», «двоедушны», «святые ангелы» и «великое бедствие» уместны. «Переход» допустим для πάροδος при сноске, но фразу следует построить естественнее. Сноска к «жизни» корректно отмечает связь со следующим предложением раздела, не превращая её в догматическое истолкование.
  issues:
  - severity: medium
    issue: Неестественная конструкция «не предавайтесь двоедушию».
    rationale: Греческое μὴ διψυχήσητε прямо запрещает быть/становиться двоедушными; предложенная конструкция в русском звучит искусственно.
  - severity: low
    issue: «Чтобы ваш переход совершился вместе со святыми ангелами» стилистически тяжеловесно.
    rationale: Глагол «совершился» в сочетании с «переходом» не нужен для передачи γένηται и ослабляет ясность образа.
  - severity: low
    issue: Во второй относительной группе использовано единственное число «не отречётся».
    rationale: Хотя конструкция «кто не отречётся» нормативна в отвлечённом русском, здесь ὅσοι стоит во множественном числе и параллельно «претерпевающие»; множественное число яснее сохраняет адресацию текста.
