  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/007.yaml
  text: Persevere, then, you who work righteousness, and do not be double‑minded, so that your passing may be with the holy angels. Blessed are you who endure the great tribulation that is coming, and who will not deny their life.
translation:
  language: ru
  text: Итак, будьте стойки, творящие праведность, и не будьте двоедушны, чтобы и ваш переход[a] был вместе со святыми ангелами. Блаженны вы, все, кто претерпевают грядущее великое бедствие и не отрекутся от своей жизни[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уход». Греческое слово может означать прохождение, переход или уход; здесь, возможно, подразумевается уход из этой жизни либо прохождение грядущего испытания.'
    reason: Сохраняет лексическую и эсхатологическую неоднозначность πάροδος.
  - marker: b
    text: 'Буквально: «не отрекутся от своей жизни». Возможно, это выражение связано с отречением от Господа в следующем предложении исходного раздела.'
    reason: Отмечает необычность греческого оборота и его ближайший контекст, не навязывая определённого богословского толкования.
lexical_decisions:
- source_word: ἐμμείνατε
  choice: стойте твёрдо
  rationale: Передаёт призыв упорно оставаться на избранном пути; естественнее по-русски, чем буквальное «пребывайте» без дополнения.
- source_word: οἱ ἐργαζόμενοι τὴν δικαιοσύνην
  choice: творящие праведность
  rationale: Сохраняет деятельный смысл ἐργάζομαι и раннехристианскую формулу без сведения её только к отдельным «праведным делам».
- source_word: μὴ διψυχήσητε
  choice: не предавайтесь двоедушию
  rationale: Сохраняет характерный образ внутренней раздвоенности, сомнения и непостоянства.
- source_word: πάροδος
  choice: переход
  rationale: Нейтральное слово сохраняет неуточнённый образ прохождения или ухода и не навязывает исключительно значение смерти.
- source_word: θλῖψιν
  choice: бедствие
  rationale: В данном контексте означает тяжёлое испытание или притеснение; «бедствие» понятно современному читателю и не вводит позднейший термин как техническое обозначение.
- source_word: οὐκ ἀρνήσονται τὴν ζωὴν αὐτῶν
  choice: не отречётся от своей жизни
  rationale: Формально сохраняет необычный объект глагола и связанную с ним смысловую напряжённость, не заменяя его пояснительным «не отречётся от Господа» из следующего предложения.
theological_decisions:
- issue: Смысл «вашего перехода» (ἡ πάροδος ὑμῶν)
  choice: Сохранить широкий образ «перехода» и пояснить возможные оттенки в сноске.
  alternative: Перевести однозначно как «отход из этой жизни» либо как «прохождение через бедствие».
  rationale: Сам греческий текст не уточняет, идёт ли речь о смерти, эсхатологическом переходе или прохождении испытания; упоминание святых ангелов допускает несколько прочтений.
- issue: Референт выражения «своей жизни» (τὴν ζωὴν αὐτῶν)
  choice: Оставить буквальное «своей жизни».
  alternative: Писать «не отречётся от Господа» или понимать «Жизнь» как титул Христа.
  rationale: Следующий стих связывает это выражение с отречением от Господа, однако текущая формулировка остаётся необычной и не называет Господа прямо; перевод не должен молча устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным увещательным тоном. Сохранены раннехристианские выражения «творящие праведность» и «двоедушие»; синтаксис слегка выровнен для естественного русского чтения. Местоименное согласование «все, кто не отречётся» выбрано как нормативное для конструкции с «кто».
