    issue: «лишены своей жизни»
    rationale: Фраза не вполне естественна по-русски и может подразумевать прямое лишение физической жизни. В данном контексте лучше передать ἀπεγνωσθαι ἀπὸ τῆς ζωῆς как исключение или отсечение от жизни, сохранив смысловую неопределённость оригинала.
  revised_text: Ибо Господь поклялся Своим Сыном, что отрёкшиеся от своего Господа отсечены от жизни, — те, кому ныне предстоит отречься в грядущие дни; а к тем, кто отрёкся прежде, Он явил милость по Своему великому состраданию.
