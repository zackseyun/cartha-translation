revisions:
- from: Ибо Господь поклялся Своим Сыном, что отрёкшиеся от своего Господа лишены своей жизни, — те, кому ныне предстоит отречься в грядущие дни; а к тем, кто отрёкся прежде, Он явил милость по Своему великому состраданию.
  to: Ибо Господь поклялся Своим Сыном, что отрёкшиеся от своего Господа отсечены от жизни, — те, кому ныне предстоит отречься в грядущие дни; а к тем, кто отрёкся прежде, Он явил милость по Своему великому состраданию.
  rationale: 'Внесена единственная безопасная смыслово-стилистическая правка: «отсечены от жизни» точнее передаёт образ ἀπεγνωσθαι ἀπὸ τῆς ζωῆς, чем «лишены своей жизни», и не определяет, о какой именно «жизни» идёт речь. Остальная структура, временное противопоставление и референт заключительного «Он» сохранены.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:47:58Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан точно: сохранены клятва «Своим Сыном», различение между теми, кому ещё предстоит отречься, и отрёкшимися прежде, а также милость, основанная на великом сострадании. Однако «лишены своей жизни» в русском звучит как лишение уже принадлежащей человеку жизни и несколько сильнее конкретизирует образ, чем греческое ἀπεγνωσθαι ἀπὸ τῆς ζωῆς («быть отсечёнными/исключёнными от жизни»).'
  naturalness: Синтаксис и регистр современны и уместны. Замена «лишены своей жизни» на «отсечены от жизни» делает формулировку естественнее в пророческом контексте и устраняет неудачно буквальное притяжательное «своей».
  terminology: «Господь», «отречься», «милость» и «сострадание» передают ключевые термины без конфессиональных добавлений. «Отсечены от жизни» сохраняет неуточнённость ζωή и образ исключения, не навязывая толкование о физической либо вечной жизни.
  issues:
