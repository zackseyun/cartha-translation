base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/008.yaml
  text: For the Lord swore by his Son that those who denied their Lord are cut off from their life—those who are now about to deny him in the coming days; but to those who denied before, because of his great compassion, he became merciful.”
translation:
  language: ru
  text: Ибо Господь поклялся Своим Сыном, что отрёкшиеся от своего Господа отсечены от жизни, — те, кому ныне предстоит отречься в грядущие дни; а к тем, кто отрёкся прежде, Он явил милость по Своему великому состраданию.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤμοσεν ... κατὰ τοῦ υἱοῦ αὐτοῦ
  choice: поклялся Своим Сыном
  rationale: Сохраняет необычную греческую формулу клятвы без попытки богословски её сгладить.
- source_word: ἀπεγνωσθαι ἀπὸ τῆς ζωῆς αὐτῶν
  choice: лишены своей жизни
  rationale: Передаёт состояние окончательного отлучения или исключения из жизни, сохраняя повтор αὐτῶν и не уточняя, означает ли «жизнь» земную или вечную жизнь.
- source_word: τοὺς νῦν μέλλοντας ἀρνεῖσθαι
  choice: те, кому ныне предстоит отречься
  rationale: Передаёт μέλλοντας как предстоящее действие, а не как уже совершившееся отречение.
- source_word: πολυσπλαγχνίαν
  choice: великому состраданию
  rationale: Естественный современный русский эквивалент усиленного обозначения глубокого милосердия.
- source_word: ἵλεως ἐγένετο αὐτοῖς
  choice: Он явил милость
  rationale: Идиоматично выражает благосклонное и милостивое отношение Господа; субъект восстанавливается из ближайшего контекста.
theological_decisions:
- issue: Смысл выражения «жизнь их»
  choice: своей жизни
  alternative: вечной жизни / спасения
  rationale: Греческий текст не снабжает ζωή уточнением; перевод сохраняет его возможный эсхатологический смысл, не делая толкование частью текста.
- issue: Временное различие между будущим и прежним отречением
  choice: сохранено прямое противопоставление будущих отступников тем, кто отрёкся прежде
  alternative: обобщить всех отрёкшихся в одну категорию
  rationale: Это различие явно присутствует в тексте и создаёт подлинное богословское напряжение, которое нельзя устранять.
- issue: Референт местоимения в заключительной части
  choice: «Он» относится к Господу
  alternative: безличное «им было прощено»
  rationale: Синтаксис естественно возвращает к Господу как субъекту ἐγένετο, при этом текст говорит о милостивом отношении, а не прямо о прощении.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского пророческого увещания. Синтаксическое напряжение оригинала сохранено с помощью тире и точки с запятой; архаизмы и конфессионально нагруженные уточнения исключены.
