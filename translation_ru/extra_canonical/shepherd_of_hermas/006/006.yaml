revisions:
- from: Итак, скажи руководителям церкви, чтобы они направили свои пути к праведности и получили обещанное во всей полноте, с великой славой.
  to: Итак, скажи руководителям церкви, чтобы они исправили свой образ жизни в праведности и получили в полной мере обетования с великой славой.
  rationale: Исправлена передача ἐν δικαιοσύνῃ и восстановлено явное множественное число «обетования». Целевая связь, неопределённость выражения «с великой славой» и нейтральное обозначение церковных руководителей сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:47:52Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан верно: обращение адресовано ведущим церковь, а исправление их путей связано с получением обетований. Однако «направили свои пути к праведности» несколько смещает ἐν δικαιοσύνῃ («в праведности», то есть в сфере/образе праведности) в сторону движения «к» праведности и звучит по-русски не вполне естественно. Множественное τὰς ἐπαγγελίας лучше сохранить явно.'
  naturalness: «Исправили свой образ жизни в праведности» — современная литературная и ясная формулировка, передающая нравственный образ «путей» без неестественного оборота «направить пути».
  terminology: «Руководители церкви» удачно избегает анахроничного иерархического титула. «Обетования» сохраняет множественное число и традиционно-религиозный регистр ἐπαγγελίαι, оставаясь понятным современному читателю. «С великой славой» оставляет неуточнённым носителя славы, как в греческом.
  issues:
  - severity: medium
    issue: Оборот «направили свои пути к праведности»
    rationale: Греческое κατορθώσωνται τὰς ὁδοὺς αὐτῶν ἐν δικαιοσύνῃ говорит об исправлении путей «в праведности», а не буквально о направлении их «к праведности». Русский оборот также стилистически тяжеловат.
  - severity: low
    issue: «обещанное» вместо множественных «обетований»
    rationale: Субстантивация возможна, но сглаживает явное множественное число τὰς ἐπαγγελίας; в наставительном религиозном контексте «обетования» точно и естественно.
  revised_text: Итак, скажи руководителям церкви, чтобы они исправили свой образ жизни в праведности и получили в полной мере обетования с великой славой.
  revised_footnotes: []
