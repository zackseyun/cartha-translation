  text: Therefore you shall say to those who lead the church that they should set their ways straight in righteousness, so that they may receive the promises in full, with much glory.
translation:
  language: ru
  text: Итак, скажи руководителям церкви, чтобы они исправили свой образ жизни в праведности и получили в полной мере обетования с великой славой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς προηγουμένοις τῆς ἐκκλησίας
  choice: руководителям церкви
  rationale: Причастие προηγουμένοις обозначает тех, кто стоит во главе и руководит; современное «руководителям» передаёт функцию без импорта позднейшего церковного титула.
- source_word: κατορθώσωνται τὰς ὁδοὺς αὐτῶν
  choice: направили свои пути
  rationale: Передаёт образ исправления и выпрямления жизненного пути; «направили» естественно по-русски и сохраняет нравственный смысл конструкции.
- source_word: ἐν δικαιοσύνῃ
  choice: к праведности
  rationale: При глаголе направления русский предлог «к» ясно выражает праведность как должную направленность пути, не сводя δικαιοσύνη лишь к юридической справедливости.
- source_word: ἀπολάβωσιν ἐκ πλήρους
  choice: получили обещанное во всей полноте
  rationale: ἀπολαμβάνω означает получить причитающееся, а ἐκ πλήρους усиливает полноту получения.
- source_word: τὰς ἐπαγγελίας
  choice: обещанное
  rationale: Субстантивированная форма естественна в современном русском и сохраняет множественное содержание обетований без тяжеловесности.
- source_word: μετὰ πολλῆς δόξης
  choice: с великой славой
  rationale: Буквально и естественно передаёт сопровождающее обстоятельство; источник не уточняет, кому именно принадлежит слава.
theological_decisions:
- issue: Связь праведного поведения и получения обетований
  choice: 'Сохранена целевая связь: исправление путей ведёт к получению обещанного.'
  alternative: Ослабить связь формулировкой «в надежде получить» или истолковать её как основание заслуги.
  rationale: ἵνα обозначает цель или ожидаемый результат, но текст не разъясняет систематически соотношение благодати, покаяния и заслуги; перевод не должен добавлять такое разъяснение.
- issue: Носитель «великой славы»
  choice: 'Оставлено неопределённым: «с великой славой».'
  alternative: Уточнить «во славе Божьей» или «обретя великую славу».
  rationale: Греческое μετὰ πολλῆς δόξης не называет носителя славы, поэтому подлинная неоднозначность сохранена.
translation_notes:
  register: Современный литературный русский, с достоинством церковно-нравственного наставления. Синтаксис сохранён как одно побудительно-целевое предложение; архаизмы и позднейшие титулы церковной иерархии не вводятся.
