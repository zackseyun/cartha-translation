  revised_text: После того как ты сообщишь им эти слова, которые Владыка повелел мне открыть тебе, им будут прощены все грехи, совершённые ими прежде, а также всем святым, согрешившим до сего дня, — если они покаются всем сердцем и удалят из своих сердец двоедушие.
