base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/006/004.yaml
  text: After you have made known to them these words which the Master commanded me to be revealed to you, then all their sins that they formerly committed are forgiven them, and also to all the holy ones who have sinned up to this day, if they repent with all their heart and remove from their heart their double‑mindedness.
translation:
  language: ru
  text: После того как ты сообщишь им эти слова, которые Владыка повелел мне открыть тебе, им будут прощены все грехи, совершённые ими прежде, а также всем святым, согрешившим до сего дня, — если они покаются всем сердцем и удалят из своих сердец двоедушие.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνωρίσαι
  choice: передашь
  rationale: В данном контексте означает «довести до сведения, сообщить»; естественное русское выражение сохраняет поручение Ерму передать слова семье.
- source_word: ὁ δεσπότης
  choice: Владыка
  rationale: Передаёт более сильный оттенок господства, чем обычное «Господь», и отличает δεσπότης от κύριος в окружающем тексте.
- source_word: ἀφίενται
  choice: простятся
  rationale: 'Настоящее время после τότε имеет результирующе-будущее значение: прощение следует после сообщения слов при названном условии покаяния.'
- source_word: τοῖς ἁγίοις
  choice: святым
  rationale: Сохраняет раннехристианское обозначение членов общины без добавления конфессионального толкования.
- source_word: διψυχίας
  choice: двоедушие
  rationale: Сохраняет характерный образ внутренней раздвоенности, колебания и недостатка цельной верности; множественное число по-русски естественно передано собирательным единственным.
theological_decisions:
- issue: Соотношение прощения и покаяния
  choice: Условие «если они покаются…» сохранено и грамматически относится как к семье Ерма, так и ко всем согрешившим святым.
  alternative: Связать условие только со «всеми святыми» либо представить прощение семьи как безусловный результат передачи слов.
  rationale: Греческий синтаксис допускает ближайшую связь с последней группой, но смысловой охват всей фразы и тема призыва к покаянию поддерживают широкое применение условия; перевод не добавляет объяснения механизма прощения.
- issue: Временная граница «до этого дня»
  choice: Формулировка сохранена буквально без разъяснения её догматического значения.
  alternative: Истолковать её как окончательный срок возможности покаяния или как дату данного откровения исключительно в повествовательном смысле.
  rationale: Сам стих утверждает временную границу, но её дальнейшее значение раскрывается контекстом; перевод не должен заранее снимать напряжение.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Синтаксис слегка упрощён ради ясности, при этом сохранены условность покаяния, временная формула и ключевой термин «двоедушие».
