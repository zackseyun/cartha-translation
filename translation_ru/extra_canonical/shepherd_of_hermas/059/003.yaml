base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/059/003.yaml
  text: '2. He says, “Listen: your sins are many, but not so many that you should be handed over to this angel. Rather, your household has committed great lawless deeds and sins, and the glorious angel was embittered at their works; and for this reason he ordered that you be afflicted for a certain time, so that they too might repent and cleanse themselves from every desire of this age. When therefore they repent and are cleansed, then the angel of punishment will depart.”'
translation:
  language: ru
  text: '2. Он говорит: «Послушай: грехов у тебя много, но не столько, чтобы ты был отдан этому ангелу. Однако твои домашние совершили тяжкие беззакония и грехи, и славный ангел пришёл в негодование из-за их дел. Поэтому он повелел тебе некоторое время терпеть скорбь, чтобы и они покаялись и очистили себя от всякого желания этого века. Итак, когда они покаются и очистятся, тогда ангел наказания отступит».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οἶκός σου
  choice: твой дом
  rationale: Сохраняет образ и коллективное значение греческого οἶκος — домочадцы, семья, домашнее сообщество — не сужая его до одного современного понятия.
- source_word: παρεπικράνθη
  choice: пришёл в негодование
  rationale: Передаёт сильную отрицательную реакцию на их дела естественно и достойно, не сводя её лишь к печали или раздражению.
- source_word: θλιβῆναι
  choice: терпеть скорбь
  rationale: Отражает страдательное значение и широкий смысл притеснения, бедствия или мучительного испытания без излишней конкретизации.
- source_word: ἐπιθυμίας τοῦ αἰῶνος τούτου
  choice: желания этого века
  rationale: Сохраняет раннехристианскую эсхатологическую формулу «этот век» и неоднозначность ἐπιθυμία, которая может обозначать желание или вожделение.
- source_word: ὁ ἄγγελος τῆς τιμωρίας
  choice: ангел наказания
  rationale: Формально и ясно передаёт родительную конструкцию, не добавляя представления о мести или окончательном осуждении.
theological_decisions:
- issue: Связь скорби главы дома с покаянием его домашних
  choice: 'Сохранена причинно-целевая связь: ему велено терпеть скорбь, чтобы они покаялись и очистились.'
  alternative: Смягчить связь и представить скорбь лишь как сопутствующее испытание.
  rationale: Греческое ἵνα прямо выражает цель; текстовую напряжённость между личной и семейной ответственностью нельзя устранять толкованием.
- issue: Условие прекращения наказания
  choice: Ангел наказания отступит после их покаяния и очищения.
  alternative: Ангел будет окончательно удалён или наказание будет прощено.
  rationale: ἀποστήσεται означает, что ангел отступит или удалится; текст не уточняет ни окончательность, ни юридический механизм прощения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным раннехристианским звучанием. Синтаксис диалога сохранён ясным, а ключевые образы «дом», «этот век» и «ангел наказания» переданы без конфессиональной конкретизации.
