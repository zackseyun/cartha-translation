source:
  text: Μετὰ ἡμέρας ὀλίγας εἶδον αὐτὸν εἰς τὸ πεδίον τὸ αὐτὸ ὅπου καὶ τοὺς ποιμένας ἑωράκειν, καὶ λέγει μοι· Τί ἐπιζητεῖς ; Πάρειμι, φημί, κύριε, ἵνα τὸν ποιμένα τὸν τιμωρητὴν κελεύσῃς ἐκ τοῦ οἴκου μου ἐξελθεῖν, ὅτι λίαν με θλίβει. Δεῖ σε, φησί, θλιβῆναι· οὕτω γάρ, φησί, προσέταξεν ὁ ἔνδοξος ἄγγελος τὰ περὶ σοῦ· θέλει γάρ σε πειρασθῆναι. Τί γάρ, φημί, κύριε, ἐποίησα οὕτω πονηρόν, ἵνα τῷ ἀγγέλῳ τούτῳ παραδοθῶ ; 2. Ἄκουε, φησίν· αἱ μὲν ἁμαρτίαι σου πολλαί, ἀλλ' οὐ τοσαῦται ὥστε τῷ ἀγγέλῳ τούτῳ παραδοθῆναι· ἀλλ' ὁ οἶκός σου μεγάλας ἀνομίας καὶ ἁμαρτίας εἰργάσατο, καὶ παρεπικράνθη ὁ ἔνδοξος ἄγγελος ἐπὶ τοῖς ἔργοις αὐτῶν, καὶ διὰ τοῦτο ἐκέλευσέ σε χρόνον τινὰ θλιβῆναι, ἵνα κἀκεῖνοι μετανοήσωσι καὶ καθαρίσωσιν ἑαυτοὺς ἀπὸ πάσης ἐπιθυμίας τοῦ αἰῶνος τούτου. ὅταν οὖν μετανοήσωσι καὶ καθαρισθῶσι, τότε ἀποστήσεται ὁ ἄγγελος τῆς τιμωρίας. 3. λέγω αὐτῷ· Κύριε, εἰ ἐκεῖνοι τοιαῦτα εἰργάσαντο ἵνα παραπικρανθῇ ὁ ἔνδοξος ἄγγελος, τί ἐγὼ ἐποίησα ; Ἄλλως, φησίν, οὐ δύνανται ἐκεῖνοι θλιβῆναι, ἐὰν μὴ σὺ ἡ κεφαλὴ
    τοῦ οἴκου [ὅλου] θλιβῇς· σοῦ γὰρ θλιβομένου ἐξ ἀνάγκης κἀκεῖνοι θλιβήσονται, εὐσταθοῦντος δὲ σοῦ οὐδεμίαν δύνανται θλῖψιν ἔχειν. 4. Ἀλλ' ἰδού, φημί, κύριε, μετανενοήκασιν ἐξ ὅλης καρδίας αὐτῶν. Οἶδα, φησί, κἀγὼ ὅτι μετανενοήκασιν ἐξ
