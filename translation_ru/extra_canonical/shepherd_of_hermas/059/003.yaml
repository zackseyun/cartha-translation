  to: '2. Он говорит: «Послушай: грехов у тебя много, но не столько, чтобы ты был отдан этому ангелу. Однако твои домашние совершили тяжкие беззакония и грехи, и славный ангел пришёл в негодование из-за их дел. Поэтому он повелел тебе некоторое время терпеть скорбь, чтобы и они покаялись и очистили себя от всякого желания этого века. Итак, когда они покаются и очистятся, тогда ангел наказания отступит».'
