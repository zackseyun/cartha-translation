  yaml_path: translation/extra_canonical/shepherd_of_hermas/059/004.yaml
  text: 3. I say to him, “Sir, if they did such things as to embitter the glorious angel, what did I do?” “Otherwise,” he says, “they cannot be afflicted unless you, the head of the whole household, are afflicted; for when you are afflicted, of necessity they also will be afflicted, but if you stand firm, they cannot have any affliction.”
translation:
  language: ru
  text: '3. Я говорю ему: «Господин, если они совершили такое, что прогневали славного ангела, то что сделал я?» Он отвечает: «Иначе они не могут подвергаться страданиям, если и ты, глава всего дома[a], не страдаешь. Ведь когда страдаешь ты, поневоле будут страдать и они; но если ты пребываешь в благополучии, они не могут испытывать никаких страданий».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «всего» присутствует не во всех рукописях.
    reason: Греческое ὅλου в исходном издании отмечено квадратными скобками как текстуально не вполне достоверное.
lexical_decisions:
- source_word: κύριε
  choice: «Господин»
  rationale: В обращении к ангельскому наставнику слово передаёт почтительное «господин», не отождествляя собеседника с Господом Богом.
- source_word: παραπικρανθῇ
  choice: «прогневали»
  rationale: Глагол обозначает причинение горечи и раздражения; «прогневали» естественно передаёт его смысл в данном контексте.
- source_word: θλιβῆναι / θλίβῃς / θλιβομένου / θλιβήσονται / θλῖψιν
  choice: «испытать скорбь / скорбеть»
  rationale: Повтор одного корня сохраняет настойчивый лексический повтор греческого текста и охватывает как страдание, так и тягостное испытание.
- source_word: ὁ οἶκος
  choice: «дом»
  rationale: Здесь имеется в виду не здание, а всё домашнее сообщество; это значение естественно выражается традиционным оборотом «глава дома».
- source_word: εὐσταθοῦντος
  choice: «пребываешь в благополучии»
  rationale: Слово означает устойчивое, благополучное состояние и противопоставлено скорби; такой перевод не сводит его только к нравственной стойкости.
theological_decisions:
- issue: Связь страдания главы дома со страданием домашних
  choice: Сохранена выраженная в тексте причинно-солидарная связь без дополнительного объяснения.
  alternative: Истолковать страдание как заместительное наказание или как исключительно педагогическое средство.
  rationale: Греческий текст утверждает взаимосвязь, но в этом предложении не определяет её точный богословский механизм.
- issue: Обозначение ангела как ἔνδοξος
  choice: «славный ангел»
  alternative: «ангел славы» или «прославленный ангел»
  rationale: Прилагательное прямо характеризует ангела; перевод не вводит особого титула, которого греческая конструкция не требует.
translation_notes:
  register: Современный литературный русский язык с почтительным, но понятным диалогическим тоном. Синтаксический параллелизм и повтор лексемы «скорбь/скорбеть» сохранены для передачи риторики оригинала.
