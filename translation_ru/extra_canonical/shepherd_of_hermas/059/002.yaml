  yaml_path: translation/extra_canonical/shepherd_of_hermas/059/002.yaml
  text: 1. After a few days I saw him in the same field where I had also seen the shepherds, and he says to me, “What are you seeking?” “I am here, sir,” I say, “that you may command the shepherd, the punisher, to go out from my house, because he afflicts me greatly.” He says, “It is necessary for you to be afflicted; for thus the glorious angel has commanded concerning you, for he wants you to be tested.” “For what, sir,” I say, “have I done that was so evil, that I should be handed over to this angel?”
translation:
  language: ru
  text: 2. «Послушай, — говорит он. — Грехов у тебя много, но не столько, чтобы тебя предали этому ангелу. Однако твои домочадцы[a] совершили великие беззакония и грехи, и славный ангел был глубоко огорчён их делами. Поэтому он повелел тебе некоторое время переносить скорбь, чтобы и они покаялись и очистили себя от всякого желания этого века[b]. Когда же они покаются и очистятся, тогда ангел наказания удалится».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «твой дом»; здесь имеются в виду люди его дома, то есть домочадцы.'
    reason: Поясняет метонимию оригинала, подтверждаемую последующими местоимениями множественного числа.
  - marker: b
    text: 'Или: «от всякой страсти этого века».'
    reason: Греческое ἐπιθυμία может означать желание, влечение или страсть, а αἰών — век, эпоху или нынешний мировой порядок.
lexical_decisions:
- source_word: ὁ οἶκός σου
  choice: твои домочадцы
  rationale: Буквально «твой дом», но по согласованию с последующими местоимениями множественного числа речь идёт о людях, составляющих домашнее сообщество.
- source_word: ἀνομίας
  choice: беззакония
  rationale: Сохраняет различие между «беззакониями» и следующим словом «грехами», не сводя оба понятия к одному.
- source_word: παρεπικράνθη
  choice: был глубоко огорчён
  rationale: Передаёт сильную отрицательную реакцию ангела без неоправданного уточнения, была ли это именно ярость, гнев или горечь.
- source_word: θλιβῆναι
  choice: терпел скорбь
  rationale: Передаёт состояние притеснения и страдания; в контексте наказующего ангела это не просто печаль, а переживаемое бедствие.
- source_word: ἐπιθυμίας τοῦ αἰῶνος τούτου
  choice: желания, свойственного нынешнему веку
  rationale: Сохраняет связь желания с «этим веком» и эсхатологический оттенок αἰών, не сужая значение до одной конкретной страсти.
- source_word: ὁ ἄγγελος τῆς τιμωρίας
  choice: ангел наказания
  rationale: Формально передаёт родительную конструкцию и сохраняет функцию ангела, названного ранее наказующим пастырем.
theological_decisions:
- issue: Страдание главы дома ради покаяния домочадцев
  choice: 'Сохранена причинно-целевая связь: его скорбь назначена, чтобы и они покаялись и очистились.'
  alternative: Истолковать страдание как заместительное искупление их грехов.
  rationale: Текст говорит о дисциплинарной цели и последующем покаянии домочадцев, но не утверждает, что их вина искупается его страданием.
- issue: Реакция славного ангела на грехи дома
  choice: «был глубоко огорчён»
  alternative: «разгневался»
  rationale: Греческий глагол допускает оттенки огорчения, раздражения и вызванной горечи; выбранная формулировка не делает богословски более узкого утверждения о гневе.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Диалогическая рамка сохранена; синтаксис умеренно упрощён ради ясности, при этом повторения «покаялись и очистились» и богословская напряжённость текста оставлены без сглаживания.
