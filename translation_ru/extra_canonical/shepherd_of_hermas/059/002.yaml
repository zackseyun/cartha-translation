  to: 2. «Послушай, — говорит он. — Грехов у тебя много, но не столько, чтобы тебя предали этому ангелу. Однако твои домочадцы[a] совершили великие беззакония и грехи, и славный ангел был глубоко огорчён их делами. Поэтому он повелел тебе некоторое время переносить скорбь, чтобы и они покаялись и очистили себя от всякого желания этого века[b]. Когда же они покаются и очистятся, тогда ангел наказания удалится».
