translation:
  language: ru
  text: '**Подобие 7**


    Несколько дней спустя я увидел его на том же поле, где прежде видел пастырей. Он спросил меня:


    — Чего ты ищешь?


    — Я пришёл, господин, — ответил я, — чтобы ты велел пастырю-карателю уйти из моего дома, потому что он причиняет мне тяжкие страдания.


    — Тебе надлежит претерпеть страдания, — сказал он. — Так распорядился о тебе славный ангел, потому что хочет, чтобы ты был испытан.


    — Что же столь злое я совершил, господин, — спросил я, — что меня отдали этому ангелу?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιζητεῖς
  choice: ищешь
  rationale: Передаёт прямое значение глагола и сохраняет открытый характер вопроса.
- source_word: ποιμένα τὸν τιμωρητήν
  choice: пастырь-каратель
  rationale: Сохраняет образ пастыря и его особую карательную функцию; более буквальное «наказывающий пастырь» звучит менее естественно как наименование персонажа.
- source_word: θλίβει / θλιβῆναι
  choice: причиняет тяжкие страдания / претерпеть страдания
  rationale: Передаёт повтор корня через общую лексику страдания, одновременно обеспечивая естественность русской речи.
- source_word: ὁ ἔνδοξος ἄγγελος
  choice: славный ангел
  rationale: Близко передаёт ἔνδοξος без уточнения личности или ранга ангела.
- source_word: πειρασθῆναι
  choice: быть испытанным
  rationale: В данном контексте речь идёт об испытании посредством страдания; перевод не сужает смысл до искушения ко греху.
- source_word: παραδοθῶ
  choice: меня отдали
  rationale: Сохраняет пассивную форму и юридико-властный оттенок передачи под власть карающего ангела.
theological_decisions:
- issue: Цель страдания героя
  choice: «хочет, чтобы ты был испытан»
  alternative: «хочет искусить тебя»
  rationale: Греческое πειρασθῆναι допускает контекстуальные оттенки испытания и искушения, но здесь наказующий пастырь причиняет страдание по распоряжению славного ангела, поэтому «испытан» естественнее и не приписывает ангелу побуждение ко греху.
- issue: Обязательность страдания
  choice: «тебе надлежит претерпеть страдания»
  alternative: «ты должен быть сокрушён/угнетён»
  rationale: Δεῖ выражает необходимость, а пассив θλιβῆναι — претерпевание скорби или притеснения. Выбранная формулировка сохраняет необходимость, не вводя дополнительного учения о природе наказания.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Диалог оформлен естественно; обращение κύριε передано как «господин», поскольку собеседник не отождествлён в данном отрывке с Господом. Переведён только читательский сегмент 59:1, хотя источник для контекста включает начало последующих абзацев.
