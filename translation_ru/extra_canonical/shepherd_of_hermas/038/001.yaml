revisions:
- from: '«Итак, послушай, — говорит он, — неразумный, как печаль истощает Святого Духа и в то же время спасает. Когда двоедушный человек берётся за какое-нибудь дело и терпит неудачу из-за своего двоедушия, эта печаль входит в него, огорчает Святого Духа и истощает Его.[a] А когда человеком по какому-либо поводу овладевает вспыльчивость и он до крайности ожесточается, печаль вновь входит в сердце разгневавшегося: он скорбит о совершённом им поступке и кается в том, что сделал зло. Такая печаль, по-видимому, ведёт к спасению, потому что сделавший зло раскаялся. Итак, и то и другое огорчает Духа: двоедушие — потому, что человек не достиг задуманного, а вспыльчивость — потому, что человек совершил зло. И двоедушие, и вспыльчивость — оба они причиняют скорбь Святому Духу. Поэтому удали от себя печаль и не причиняй страдания Святому Духу, живущему в тебе, чтобы Он не воззвал к Богу[b] и не удалился от тебя. Ведь Дух Божий, данный этой плоти,[c] не терпит ни печали, ни стеснения».'
