base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/038/001.yaml
  text: '“Listen, then,” he says, “foolish one, how sorrow wears down the Holy Spirit and then again saves. Whenever the double‑minded person undertakes some action and fails in it because of his double‑mindedness, this sorrow enters into the person and grieves the Holy Spirit and wears it down. Then again, when quick temper clings to a person concerning some matter, and he becomes exceedingly embittered, again sorrow enters into the heart of the person who became quick‑tempered, and he is grieved over the deed that he did and repents, because he did what is evil. This sorrow, then, seems to bring salvation, because after doing what is evil he repented. Therefore both things grieve the Spirit: double‑mindedness, because it did not attain its purpose; and quick temper grieves the Spirit, because it did what is evil. Both, then, are grievous to the Holy Spirit—double‑mindedness and quick temper. Remove, therefore, sorrow from yourself, and do not afflict the Holy Spirit that dwells in you,
    lest it appeal to God and depart from you. For the Spirit of God that was given to this flesh does not endure sorrow or distress.”'
translation:
  language: ru
  text: '«Итак, слушай, — говорит он, — неразумный человек, как печаль истощает Святого Духа, а затем вновь спасает. Когда двоедушный человек берётся за какое-нибудь дело и терпит в нём неудачу из-за своего двоедушия, эта печаль входит в человека, огорчает Святого Духа и истощает Его.[a] Затем, когда вспыльчивость овладевает человеком по какому-либо поводу и он сильно ожесточается, печаль вновь входит в сердце разгневавшегося человека; он скорбит о совершённом поступке и кается, потому что сделал зло. Такая печаль, по-видимому, несёт спасение, потому что сделавший зло раскаялся. Итак, и то и другое огорчает Духа: двоедушие — потому что из-за него не удалось осуществить задуманное, а вспыльчивость — потому что человек совершил зло. И двоедушие, и вспыльчивость причиняют скорбь Святому Духу. Поэтому удали от себя печаль и не причиняй страдания Святому Духу, живущему в тебе, чтобы Он не обратился к Богу[b] и не удалился от тебя. Ведь Дух Божий, данный этой плоти,[c] не терпит ни печали, ни
    тяготы»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «изнуряет Его», «сокрушает Его». Греческий глагол передаёт образ изнашивания или доведения до истощения.'
    reason: Буквальная сила ἐκτρίβει необычна применительно к Святому Духу и требует обозначить диапазон образа.
  - marker: b
    text: 'Или: «не воззвал к Богу», «не обратился к Богу с просьбой»; возможно, с жалобой. Содержание обращения в греческом тексте не уточняется.'
    reason: ἐντεύξηται не указывает прямо, является ли обращение просьбой, жалобой или ходатайством.
  - marker: c
    text: 'То есть человеческой плоти; греческий текст буквально говорит: «данный в эту плоть».'
    reason: Сохранено конкретное указание на плоть без истолкования антропологии автора.
lexical_decisions:
- source_word: λύπη
  choice: печаль / скорбь
  rationale: Основное соответствие — «печаль»; в выражении о сожалении после злого поступка естественное русское «скорбит» передаёт тот же греческий корень без искусственного повтора.
- source_word: ἐκτρίβει
  choice: истощает
  rationale: Глагол буквально обозначает изнашивание, изнурение или доведение до истощения. «Истощает» сохраняет резкость образа и не подменяет его более общим «огорчает», которое уже передаёт λυπεῖ.
- source_word: δίψυχος / διψυχία
  choice: двоедушный / двоедушие
  rationale: Сохранён характерный раннехристианский образ внутренней раздвоенности и нерешительности; более узкое «сомневающийся» устранило бы часть смыслового диапазона.
- source_word: ὀξυχολία
  choice: вспыльчивость
  rationale: Передаёт склонность к внезапному гневу; контекст последующего ожесточения не требует усиленного перевода «ярость».
- source_word: στενοχωρία
  choice: стеснение
  rationale: Сохраняет образ тесноты, давления и внутренней подавленности, не сводя слово только к современному понятию тревоги.
theological_decisions:
- issue: К кому относится «Святой Дух»
  choice: Святой Дух, живущий в человеке
  alternative: Святой дух как человеческий дух или дарованный духовный склад
  rationale: Текст прямо употребляет τὸ πνεῦμα τὸ ἅγιον и далее τὸ πνεῦμα τοῦ θεοῦ; перевод сохраняет эту явную формулировку, не развивая позднейшую догматическую терминологию.
- issue: Спасительное действие печали
  choice: «печаль… ведёт к спасению»
  alternative: «печаль сама спасает»
  rationale: Начальная парадоксальная формула «спасает» сохранена, а δοκεῖ σωτηρίαν ἔχειν передано осторожнее как «по-видимому, ведёт к спасению», поскольку спасительный смысл связывается с покаянием, а не приписывается всякой печали.
- issue: ἐντεύξηται τῷ θεῷ
  choice: «воззвал к Богу»
  alternative: «пожаловался Богу», «ходатайствовал перед Богом»
  rationale: Глагол допускает обращение, просьбу или жалобу. Нейтральное «воззвал» сохраняет неопределённость относительно содержания обращения и не вводит учение о формальном ходатайстве.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, наставительным звучанием. Синтаксические повторы оригинала частично сохранены ради риторики, но длинные периоды расчленены для ясности. Термин «двоедушие» оставлен как значимый библейско-раннехристианский образ; остальные слова выбраны общеупотребительными.
