  terminology: «Ангел наказания», «праведные ангелы», «нынешний век» и «тяжкие и разнообразные наказания» удачны. «Господин» корректно передаёт почтительное κύριε без преждевременного богословского отождествления. «Берёт под свою власть» точнее отражает παραλαμβάνει в данном контексте, чем «принимает».
