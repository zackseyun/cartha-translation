base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/056/001.yaml
  text: Therefore, seeing them being scourged and afflicted like this, I was grieved for them, because they were being tormented in this way and had no respite at all. I said to the shepherd who was speaking with me, “Sir, who is this shepherd, so pitiless and harsh, showing no compassion at all for these sheep?” He said, “This is the angel of punishment; he is one of the righteous angels, appointed over punishment. Therefore he takes charge of those who have wandered away from God and have gone after the desires and deceits of this age, and he punishes them, as they deserve, with dreadful and various punishments.”
translation:
  language: ru
  text: 'Итак, видя, как их бичуют и мучат, я скорбел о них, потому что они терпели такие истязания и совсем не имели передышки. Я сказал Пастырю, говорившему со мной: «Господин, кто этот пастырь, такой[a] безжалостный и суровый, совсем не жалеющий этих овец?» Он ответил: «Это ангел наказания. Он принадлежит к числу праведных ангелов и поставлен совершать наказание. Он берёт под свою власть тех, кто уклонился от Бога и последовал за желаниями и обманами нынешнего века, и наказывает их, как они того заслуживают, тяжкими и разнообразными наказаниями».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «такой» передаёт греческое οὕτως, наличие которого в тексте отмечено издателями как не вполне уверенное.
    reason: Сохраняет отмеченную в исходном издании неопределённость чтения [οὕτως], не создавая неестественной русской конструкции.
lexical_decisions:
- source_word: μαστιγούμενα
  choice: бичуют
  rationale: Передаёт конкретный образ телесного наказания, сохраняя силу греческого глагола.
- source_word: ταλαιπωρούμενα
  choice: мучат
  rationale: Естественно по-русски передаёт состояние тяжкого страдания, не дублируя буквально соседнее «бичуют».
- source_word: ἀνοχήν
  choice: передышки
  rationale: В данном контексте означает временное облегчение или прекращение мучений.
- source_word: ἄσπλαγχνος καὶ πικρός
  choice: безжалостный и суровый
  rationale: Сохраняет сочетание отсутствия сострадания и жестокой строгости без чрезмерной архаизации.
- source_word: ἄγγελος τῆς τιμωρίας
  choice: ангел наказания
  rationale: Формально сохраняет конструкцию и не сужает τιμωρία до мести или кары.
- source_word: κείμενος ἐπὶ τῆς τιμωρίας
  choice: поставлен совершать наказание
  rationale: Передаёт назначение ангела на определённое служение естественным русским выражением.
- source_word: ἀπάταις τοῦ αἰῶνος τούτου
  choice: обманами нынешнего века
  rationale: Сохраняет раннехристианское значение αἰών как нынешнего мирового порядка, не подменяя его словом «мир».
- source_word: δειναῖς καὶ ποικίλαις τιμωρίαις
  choice: тяжкими и разнообразными наказаниями
  rationale: Передаёт суровость и множественность наказаний без стилистического преувеличения.
theological_decisions:
- issue: Статус ангела наказания
  choice: «принадлежит к числу праведных ангелов»
  alternative: «является одним из ангелов праведников»
  rationale: Греческое τῶν ἀγγέλων τῶν δικαίων естественнее относится к праведности самих ангелов; перевод не привносит идею ангелов-хранителей отдельных праведников.
- issue: Основание наказания
  choice: «как они того заслуживают»
  alternative: «сообразно их достоинству»
  rationale: Сохраняется утверждение текста о соответствии наказания поступкам, но без догматического уточнения природы или окончательности этого наказания.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Обращение κύριε передано как «Господин», чтобы выразить почтительное обращение к Пастырю, не отождествляя его с Господом Богом. Повторы «наказание / наказывает / наказаниями» сохранены вслед за греческим корнем τιμωρ-, поскольку они композиционно подчёркивают функцию ангела.
