base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/056/002.yaml
  text: '“I wished, Sir,” I said, “to know what these various punishments are.” He said, “Listen. The various punishments and torments are torments of this present life: for some are punished with losses, some with deprivations, some with various sicknesses, some with every kind of disorder; some are insulted by the unworthy, and suffer in many other ways. For many, being unsettled in their plans, undertake many things, and nothing at all advances for them. They say of themselves that they do not prosper in their undertakings, and it does not rise up into their heart that they have done evil, but they blame the Lord.'
translation:
  language: ru
  text: '«Мне хотелось бы, господин, — сказал я, — узнать, что представляют собой эти разнообразные наказания». Он сказал: «Слушай. Разнообразные наказания и мучения — это житейские страдания: одни наказываются убытками, другие — лишениями, иные — различными болезнями, иные — всяческими неурядицами; одни терпят оскорбления от недостойных людей, а другие страдают ещё многими способами. Ведь многие, будучи непостоянны в своих замыслах, берутся за многое, но у них решительно ничего не продвигается. Они говорят, что им не сопутствует успех в их делах, и им не приходит в голову, что они совершили злое, но они винят Господа».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: господин
  rationale: В обращении к пастырю передаёт почтительное «господин», не смешивая его с титулом Господа Бога в конце отрывка.
- source_word: τιμωρίαι καὶ βάσανοι
  choice: наказания и мучения / страдания
  rationale: Сохранено различие между карательным τιμωρίαι и βάσανοι; во втором употреблении βάσανοι передано естественным по-русски «страдания» применительно к бедствиям земной жизни.
- source_word: βιωτικαί
  choice: житейские
  rationale: Обозначает относящееся к нынешней, земной жизни, без добавления отсутствующего в греческом указательного определения.
- source_word: ζημίαις
  choice: убытками
  rationale: Передаёт материальные или иные потери как форму наказания.
- source_word: ὑστερήσεσιν
  choice: лишениями
  rationale: Сохраняет общий смысл недостатка и утраты, не сужая его до бедности.
- source_word: ἀκαταστασίᾳ
  choice: неурядицами
  rationale: Передаёт состояние расстройства и нестабильности; чтение πάσῃ отражено словом «всяческими».
- source_word: ἀκαταστατοῦντες ταῖς βουλαῖς αὐτῶν
  choice: будучи непостоянны в своих замыслах
  rationale: Передаёт неустойчивость и беспорядочность намерений, сохраняя связь с предыдущим ἀκαταστασίᾳ.
- source_word: οὐκ ἀναβαίνει αὐτῶν ἐπὶ τὴν καρδίαν
  choice: им не приходит на сердце
  rationale: Сохранён характерный древний образ внутреннего осознания, при этом выражение понятно современному читателю.
theological_decisions:
- issue: Различение обращения к пастырю и имени Бога
  choice: κύριε к пастырю — «господин»; τὸν Κύριον — «Господа»
  alternative: В обоих случаях «Господь/Господи»
  rationale: Контекст различает почтительное обращение к собеседнику и упоминание Бога; русская капитализация и лексический выбор делают это различие ясным без толкования.
- issue: Характер жизненных бедствий как наказания
  choice: 'Сохранена прямая формулировка автора: перечисленные земные страдания названы наказаниями'
  alternative: Смягчить до «испытаний» или «последствий»
  rationale: Греческий текст прямо использует τιμωρίαι и τιμωροῦνται; богословское напряжение не следует устранять переводом.
translation_notes:
  register: 'Современный литературный русский с достоинством раннехристианского наставительного текста. Синтаксис слегка ритмизован, но не архаизирован; сохранён образ «приходит на сердце». Скобочные варианты исходного издания не требуют читательской сноски в данном сегменте: [πάσῃ] естественно отражено в тексте как «всяческими».'
