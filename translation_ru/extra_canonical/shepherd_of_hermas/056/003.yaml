base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/056/003.yaml
  text: “When, then, they are afflicted with every affliction, then they are handed over to me for good discipline, and they are strengthened in the faith of the Lord; and the rest of the days of their life they serve the Lord with a pure heart. And if they repent, then the evil works that they did rise up into their heart; and then they glorify God, saying that he is a righteous judge and that each one suffered justly according to his deeds. Thereafter they serve the Lord with a pure heart, and they prosper in every work of theirs, receiving from the Lord whatever they ask for; and then they glorify the Lord because they were handed over to me, and they no longer suffer any of the evils.”
translation:
  language: ru
  text: Когда же их постигают всевозможные скорби, их передают мне для благого вразумления, и они укрепляются в вере в Господа. В остальные дни своей жизни они служат Господу с чистым сердцем. Если же они покаются, тогда им приходят на сердце злые дела, которые они совершили, и тогда они прославляют Бога, говоря, что Он — праведный Судья и что каждый справедливо пострадал по своим делам. Отныне они служат Господу с чистым сердцем и преуспевают во всех своих делах, получая от Господа всё, о чём ни попросят. Тогда они прославляют Господа за то, что были переданы мне, и больше не терпят никаких бедствий.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλιβῶσι πάσῃ θλίψει
  choice: их постигают всевозможные скорби
  rationale: Передаёт пассивную форму и усиленное сочетание однокоренных слов естественным современным русским выражением, не сужая смысл до одного вида страдания.
- source_word: ἀγαθὴν παιδείαν
  choice: благое вразумление
  rationale: παιδεία здесь означает исправляющее воспитание или дисциплину; «вразумление» сохраняет воспитательно-исправительный смысл без оттенка простого наказания.
- source_word: ἰσχυροποιοῦνται
  choice: укрепляются
  rationale: Точно передаёт становление сильнее или твёрже, а дополнение «в вере» уточняет сферу укрепления согласно греческому тексту.
- source_word: ἀναβαίνει ἐπὶ τὴν καρδίαν
  choice: приходят на сердце
  rationale: Сохраняет образный семитизирующий оборот оригинала и означает, что прежние злые дела входят в сознание, не превращая перевод в толкование «они осознают».
- source_word: εὐοδοῦνται ἐν πάσῃ πράξει
  choice: преуспевают во всех своих делах
  rationale: Естественно передаёт значение успешного хода дел в данном контексте.
- source_word: τῶν πονηρῶν
  choice: бедствий
  rationale: В контексте перечисленных жизненных наказаний субстантивированное выражение обозначает испытываемые ими несчастья или бедствия, а не совершаемое нравственное зло.
theological_decisions:
- issue: Связь покаяния с воспоминанием о злых делах
  choice: Сохранено условное «Если же они покаются, тогда…»
  alternative: 'Передать как неизбежный результат вразумления: «Когда они покаются…»'
  rationale: Греческое ἐὰν δὲ μετανοήσωσι имеет явную условную форму; перевод не устраняет заложенную в тексте возможность отклика или его отсутствия.
- issue: Характер страданий и передачи ангелу
  choice: Страдания представлены как ведущее к благому вразумлению исправительное воздействие
  alternative: Назвать их исключительно карательным возмездием
  rationale: Хотя ближайший контекст говорит о наказании, в данном предложении прямо употреблено ἀγαθὴ παιδεία, поэтому важно сохранить одновременно суровость скорбей и их исправительную цель.
- issue: Обещание получить просимое
  choice: «получая от Господа всё, о чём ни попросят»
  alternative: Ограничить обещание уточнением «всё угодное Богу»
  rationale: Оригинал формулирует обещание без такого явного ограничения; богословское уточнение не следует добавлять в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис упрощён лишь там, где длинная греческая цепочка затруднила бы чтение; повторения «Господь», «чистое сердце» и причинно-временная последовательность сохранены.
