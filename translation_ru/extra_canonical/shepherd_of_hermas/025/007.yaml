base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/007.yaml
  text: 7. If then, having heard them, you keep them and walk in them and do them with a pure heart, you will receive from the Lord what he promised you; but if, having heard, you do not repent, but still add to your sins, you will receive from the Lord the opposite things. The Shepherd, the angel of repentance, commanded me to write all these things in this way.
translation:
  language: ru
  text: 7. Итак, если вы, услышав их, будете соблюдать их, жить по ним и исполнять их с чистым сердцем, то получите от Господа всё, что Он обещал вам. Но если вы, услышав, не покаетесь, а будете и дальше прибавлять к своим грехам, то получите от Господа противоположное. Всё это Пастырь, ангел покаяния, велел мне записать именно так.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξητε
  choice: будете соблюдать
  rationale: Передаёт идею бережного хранения и исполнения заповедей в естественной современной русской формулировке.
- source_word: ἐν αὐταῖς πορευθῆτε
  choice: жить по ним
  rationale: Буквально выражение означает «ходить в них»; русский идиоматический эквивалент сохраняет образ жизненного поведения без неестественной кальки.
- source_word: ἐργάσησθε αὐτὰς
  choice: исполнять их
  rationale: В контексте заповедей глагол означает осуществлять их на деле.
- source_word: ἀπολήμψεσθε
  choice: получите
  rationale: Прямой и естественный эквивалент будущего времени, одинаково сохранённый в обеих условных конструкциях.
- source_word: τὰ ἐναντία
  choice: противоположное
  rationale: Сохраняет намеренную неопределённость греческого выражения и не уточняет самовольно, идёт ли речь о наказании или об утрате обещанного.
- source_word: ὁ ἄγγελος τῆς μετανοίας
  choice: ангел покаяния
  rationale: Формально и богословски нейтрально передаёт родительную конструкцию.
theological_decisions:
- issue: Условная связь между послушанием и получением обещанного
  choice: Сохранена прямая условная конструкция «если… то получите»
  alternative: Ослабить её формулировкой о свидетельстве веры или вероятном результате
  rationale: Греческий текст прямо ставит получение обещанного в условную связь со соблюдением, жизнью по заповедям и их исполнением; перевод не должен разрешать возникающее богословское напряжение.
- issue: Содержание τὰ ἐναντία
  choice: «противоположное» без пояснения
  alternative: «наказание», «проклятие» или «лишение обещанного»
  rationale: Источник не конкретизирует содержание противоположного, поэтому подстановка определённого наказания была бы толкованием.
- issue: Статус Пастыря
  choice: «Пастырь, ангел покаяния»
  alternative: Понимать «ангела» метафорически как вестника либо отождествлять с конкретной небесной фигурой
  rationale: Сохранена аппозиция оригинала без внесения конфессионального или частного истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Местоимение «Он» при упоминании Господа написано с прописной буквы по принятой русской религиозно-издательской норме. Повтор местоимения «их» сохранён ради связи с предшествующими заповедями и притчами; в данном читательском сегменте его референт задаётся контекстом родительского раздела.
