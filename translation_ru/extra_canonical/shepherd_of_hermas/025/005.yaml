  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/005.yaml
  text: 5. But he answered me and says, “Do not be confounded, but be strengthened in my commandments, which I am about to command you. For I have been sent,” he says, “that I may show you again all the things you saw before, especially the main points that are beneficial for you. First of all, write my commandments and the parables; but the other things, as I show you, so you will write.” For this reason, he says, “I command you first to write the commandments and parables, so that you may read them readily at hand and be able to keep them.”
translation:
  language: ru
  text: '5. Он же ответил мне: «Не смущайся, но укрепляйся в моих заповедях, которые я намерен дать тебе. Ведь я послан, — говорит он, — чтобы снова показать тебе всё, что ты видел прежде, сами главные положения, полезные вам. Прежде всего запиши мои заповеди и притчи; а остальное записывай так, как я тебе покажу». Поэтому, говорит он, «я велю тебе сперва записать заповеди и притчи, чтобы они были у тебя под рукой, чтобы ты мог читать их и соблюдать».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ συγχύννου
  choice: Не смущайся
  rationale: Передаёт призыв не оставаться в состоянии потрясения и замешательства, описанном непосредственно перед этим, без более узкого значения «не стыдись».
- source_word: ἰσχυροποιοῦ ἐν ταῖς ἐντολαῖς μου
  choice: укрепляйся в исполнении моих заповедей
  rationale: Возвратное повеление означает «становись сильным, укрепляйся»; добавление «в исполнении» естественно выражает связь с заповедями и не сводит фразу к одному лишь знанию текста.
- source_word: αὐτὰ τὰ κεφάλαια
  choice: именно те главные положения
  rationale: κεφάλαια здесь обозначает основные, главные пункты ранее показанного; «именно те» сохраняет усилительное αὐτά.
- source_word: παραβολάς
  choice: притчи
  rationale: Обычное и уместное название следующего литературного раздела произведения, сохраняющее жанровый оттенок παραβολή.
- source_word: ὑπὸ χεῖρα
  choice: под рукой
  rationale: Естественный русский идиоматический эквивалент выражения о доступности записанного текста для чтения.
- source_word: φυλάξαι
  choice: соблюдать
  rationale: В контексте заповедей глагол значит не просто хранить текст, а исполнять и соблюдать предписанное.
theological_decisions:
- issue: Кому полезны главные положения
  choice: которые полезны вам
  alternative: которые полезны тебе
  rationale: Греческое ὑμῖν однозначно имеет множественное число и расширяет адресат за пределы одного Ермы; это сохранено.
- issue: Связь укрепления с заповедями
  choice: укрепляйся в исполнении моих заповедей
  alternative: укрепляйся моими заповедями
  rationale: Греческое ἐν допускает некоторую смысловую широту. Выбранная формулировка соответствует дальнейшему акценту на соблюдении, не представляя сами заповеди исключительно источником внутренней силы.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Сохранены прямая речь, повторное «говорит он», переход от единственного «тебе» к множественному «вам» и различие между записью заповедей с притчами и последующей записью прочего.
