  text: 3. I thought that he had come to test me, and I say to him, “Who then are you? For I,” I say, “know the one to whom I was entrusted.” He says to me, “Do you not recognize me?” “No,” I say. “I,” he says, “am the Shepherd to whom you were entrusted.”
translation:
  language: ru
  text: '3. Я подумал, что он пришёл испытать меня, и говорю ему: «Но кто ты? Ведь я, — говорю, — знаю, кому я был поручен». Он говорит мне: «Ты меня не узнаёшь?» — «Нет», — говорю я. «Я, — говорит он, — тот Пастырь, которому ты был поручен».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκπειράζων
  choice: испытать
  rationale: Передаёт значение проверки или испытания без более отрицательного оттенка слова «искушать», которого контекст не требует.
- source_word: ἐπιγινώσκεις
  choice: узнаёшь
  rationale: Вопрос касается распознания уже известного лица, поэтому «узнаёшь» точнее общего «знаешь».
- source_word: ποιμήν
  choice: Пастырь
  rationale: Сохраняет ключевое наименование персонажа и название произведения; прописная буква уместна как закреплённый титул в данном повествовании.
- source_word: παρεδόθην
  choice: был поручен
  rationale: Сохраняет пассивную конструкцию и идею передачи под чьё-либо попечение, не уточняя не названного здесь субъекта действия.
theological_decisions:
- issue: Статус и личность Пастыря
  choice: Не уточнять его природу или отношение к другим небесным фигурам
  alternative: Отождествить Пастыря с определённым ангелом или иной фигурой
  rationale: В данном стихе он лишь называет себя Пастырем, которому был поручен Ерма; дальнейшая идентификация вышла бы за пределы исходного текста.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского повествования. Историческое настоящее в речевых вводах («говорю», «говорит») сохранено вслед за греческим текстом; повторения также оставлены как черта живого рассказа.
