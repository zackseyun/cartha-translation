base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/001.yaml
  text: After I had prayed in the house and sat down on the couch, a certain man entered, glorious in appearance, in shepherd’s attire, wearing a white skin, and having a bag on his shoulders and a staff in his hand. And he greeted me, and I returned his greeting.
translation:
  language: ru
  text: 'После того как я помолился в доме и сел на ложе, вошёл некий человек величественного вида, в пастушеском одеянии: он был облачён в белую шкуру, за плечами у него была сумка, а в руке — посох. Он приветствовал меня, и я приветствовал его в ответ.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλίνην
  choice: ложе
  rationale: Передаёт предмет для возлежания или отдыха без неоправданного уточнения «кровать» либо «кушетка» и сохраняет достоинство повествовательного регистра.
- source_word: ἔνδοξος τῇ ὄψει
  choice: величественного вида
  rationale: ἔνδοξος здесь характеризует впечатляющую, исполненную достоинства внешность; «славный на вид» в современном русском звучит двусмысленно и менее естественно.
- source_word: σχήματι ποιμενικῷ
  choice: в пастушеском одеянии
  rationale: Сочетание указывает на внешний облик или наряд пастуха; выбор естественно связывается с последующим перечислением его принадлежностей.
- source_word: δέρμα λευκόν
  choice: белую шкуру
  rationale: Сохранено конкретное значение δέρμα — шкуры или кожи животного, без замены более общим «плащом».
- source_word: πήραν
  choice: сумка
  rationale: Речь о пастушеской дорожной сумке или котомке; нейтральное «сумка» понятно современному читателю и не создаёт лишней архаичности.
- source_word: ἠσπάσατό με / ἀντησπασάμην
  choice: приветствовал меня / приветствовал его в ответ
  rationale: Глаголы обозначают взаимное приветствие; перевод сохраняет ответный характер второго действия, не конкретизируя его как поцелуй или объятие.
