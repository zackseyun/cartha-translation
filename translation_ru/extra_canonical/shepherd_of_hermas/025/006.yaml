lexical_decisions:
- source_word: ἔγραψα
  choice: я записал
  rationale: Передаёт совершённое действие в контексте поручения письменно изложить последующий материал.
- source_word: τὰς ἐντολὰς
  choice: заповеди
  rationale: Естественный и устойчивый религиозно-нравственный эквивалент для ἐντολαί; согласуется с названием раздела произведения.
- source_word: τὰς παραβολάς
  choice: притчи
  rationale: Традиционный и понятный русский эквивалент παραβολαί в раннехристианском тексте.
- source_word: καθὼς ἐνετείλατό μοι
  choice: как он мне повелел
  rationale: Сохраняет прямую связь с данным Пастырем распоряжением и достойный повествовательный регистр.
