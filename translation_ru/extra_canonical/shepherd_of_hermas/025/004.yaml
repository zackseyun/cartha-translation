base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/025/004.yaml
  text: 4. While he was still speaking, his appearance was changed, and I recognized him, that he was the one to whom I had been entrusted, and immediately I was confounded, and fear seized me, and I was completely crushed with grief, because I had answered him so wickedly and foolishly.
translation:
  language: ru
  text: 4. Пока он ещё говорил, облик его изменился, и я узнал в нём того, кому был вверен. Тут же я пришёл в смятение, меня охватил страх, и я был совершенно подавлен скорбью оттого, что ответил ему так дурно и неразумно.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠλλοιώθη ἡ ἰδέα αὐτοῦ
  choice: облик его изменился
  rationale: Передаёт видимое изменение внешности без уточнения характера преображения, которого греческий текст не даёт.
- source_word: συνεχύθην
  choice: я пришёл в смятение
  rationale: Естественно передаёт сильное внутреннее потрясение и замешательство.
- source_word: ὅλος συνεκόπην ἀπὸ τῆς λύπης
  choice: я был совершенно подавлен скорбью
  rationale: Сохраняет интенсивность выражения и причинную связь со скорбью, не прибегая к неестественной буквальности.
- source_word: πονηρῶς καὶ ἀφρόνως
  choice: дурно и неразумно
  rationale: Передаёт нравательно отрицательную оценку ответа и его безрассудство, не усиливая πονηρῶς до более узкого значения «злобно».
theological_decisions:
- issue: Личность того, кому был вверен Ерм
  choice: того, кому был вверен
  alternative: того, чьему попечению был поручен
  rationale: 'Сохранена неопределённость исходного места: стих не поясняет ни природу вверения, ни статус этого лица.'
translation_notes:
  register: Современный литературный русский язык; повествование ясное и достойное по тону. Сохранены эмоциональная последовательность и повторы исходного текста без конфессиональных уточнений.
