  text: 4. “But the Gentiles and the sinners—like the dry trees you saw—will be found such, dry and fruitless in that age, and as …”
translation:
  language: ru
  text: 4. А язычники и грешники, подобно сухим деревьям, которые ты видел, окажутся в том веке сухими и бесплодными и, словно…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: язычники
  rationale: В раннехристианском контексте обозначает народы вне Божьего народа; «язычники» естественно и точно передаёт это значение по-русски.
- source_word: οἱ ἁμαρτωλοί
  choice: грешники
  rationale: Прямой и стилистически уместный эквивалент, сохраняющий нравственно-богословский смысл.
- source_word: ξηροὶ καὶ ἄκαρποι
  choice: сухими и бесплодными
  rationale: Сохраняет образ деревьев и параллель между их внешним состоянием и отсутствием плода.
- source_word: ἐν ἐκείνῳ τῷ αἰῶνι
  choice: в том веке
  rationale: Передаёт эсхатологическое противопоставление нынешнего и грядущего века, не подменяя его более толковательным выражением.
theological_decisions:
- issue: Обозначение эсхатологического αἰών
  choice: «тот век»
  alternative: «будущий мир»
  rationale: «Тот век» сохраняет терминологическую связь с предшествующим противопоставлением веков и не устраняет смысловую широту слова αἰών.
- issue: Незавершённость фразы в предоставленном источнике
  choice: Сохранить обрыв посредством многоточия
  alternative: Восстановить продолжение по иной редакции полного текста
  rationale: Исходный фрагмент обрывается на ὡς ξ; перевод не должен домысливать отсутствующий текст.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского назидательного текста. Синтаксис слегка выровнен для естественного чтения, при этом образ сухих и бесплодных деревьев и эсхатологическое выражение «в том веке» сохранены.
