  verdict: revise
  source_fidelity: 'Смысл передан в целом точно: τὰ ἔθνη и οἱ ἁμαρτωλοί различены, образ сухих бесплодных деревьев сохранён, а ἐν ἐκείνῳ τῷ αἰῶνι корректно передано как «в том веке». Многоточие оправдано: греческий фрагмент и английская контрольная запись обрываются после ὡς / “and as”.'
  naturalness: Оборот «какими ты видел сухие деревья» синтаксически возможен, но в современном русском может означать, что наблюдатель счёл деревья сухими, а не выражать греческое сопоставление «подобно сухим деревьям, которые ты видел». Небольшая перестройка делает образ яснее и естественнее.
  terminology: «Язычники», «грешники», «сухими и бесплодными» и «в том веке» уместны и сохраняют регистр и терминологическую связь с контекстом. Замена «в том веке» на толковательное «в будущем мире» не нужна.
