  source_fidelity: 'Смысл передан верно: речь о состоятельных людях, сознающих Господа источником своего богатства, и о возможности совершать добро. Однако «богатство дано им» звучит как завершённое разовое получение, тогда как греческое πλουτίζονται — настоящее время страдательного залога («обогащаются»).'
