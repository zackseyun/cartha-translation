  text: 10. Blessed are those who have and understand that they are made rich by the Lord; for those who think this way will be able to do some good.
translation:
  language: ru
  text: 10. Блаженны те, кто имеет достаток и понимает, что обогащается от Господа; ибо те, кто так мыслит, смогут совершать добро.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἔχοντες
  choice: те, кто обладает достатком
  rationale: Буквально — «имеющие»; в непосредственном контексте речь идёт о богатых и их имуществе, поэтому подразумеваемый объект выражен естественным по-русски словом «достаток».
- source_word: παρὰ τοῦ Κυρίου πλουτίζονται
  choice: богатство дано им Господом
  rationale: Передаёт пассивную форму и Господа как источник их богатства, не превращая выражение в обещание будущего обогащения.
- source_word: ταῦτα φρονοῦντες
  choice: мыслящие так
  rationale: Сохраняет смысл внутреннего убеждения и образа мыслей, а также связь с предшествующим пониманием происхождения богатства.
- source_word: ἀγαθόν τι ἐργάζεσθαι
  choice: сделать что-нибудь доброе
  rationale: Передаёт неопределённость τι и практическое совершение добра без сужения смысла до конкретного вида благотворительности.
theological_decisions:
- issue: Богатство как полученное от Господа
  choice: Сохранено прямое указание на Господа как источник богатства.
  alternative: «богатеют благодаря Господу»
  rationale: Выбранная формулировка яснее передаёт пассив πλουτίζονται и контекст ответственности состоятельных людей, не утверждая, что материальное богатство само по себе служит знаком особого духовного статуса.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. «Блаженны» сохранено как узнаваемая формула макаризма; синтаксис упрощён для ясного чтения без устранения нравственной связи между пониманием источника достатка и способностью делать добро.
