  to: '2. «Почему же, господин, — спрашиваю я, — они словно сухие и все одинаковые?» Он отвечает мне: «Потому что в этом веке не видны ни праведные, ни грешники, но все они одинаковы; ведь этот век для праведных — зима, и, живя среди грешников, они не видны.»'
  rationale: Правка сохраняет современный литературный русский, но ближе воспроизводит повтор φαίνονται и не закрепляет в самом тексте только одно толкование — «их невозможно распознать». «Сухие» точнее передаёт ξηρά, а «все они одинаковы» отражает ὅμοιοί εἰσιν.
