  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/006.yaml
  text: 2. “Why then, sir, are they as if dry and alike?” I say. “Because,” he says, “neither the righteous nor the sinners are visible in this age, but they are alike; for this age is winter for the righteous, and they are not visible while dwelling among sinners.”
translation:
  language: ru
  text: '2. «Почему же, господин, — спрашиваю я, — они словно сухие и все одинаковые?» Он отвечает мне: «Потому что в этом веке не видны ни праведные, ни грешники, но все они одинаковы; ведь этот век для праведных — зима, и, живя среди грешников, они не видны.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: господин
  rationale: В обращении к истолкователю видения означает почтительное «господин», а не божественный титул «Господь».
- source_word: ὡσεὶ ξηρά
  choice: словно засохшие
  rationale: Сохраняет сравнительный оттенок ὡσεὶ и естественно описывает деревья без листвы.
- source_word: οὔτε οἱ δίκαιοι φαίνονται οὔτε οἱ ἁμαρτωλοί
  choice: не видно, кто праведен, а кто грешен
  rationale: Передаёт не отсутствие людей, а невозможность различить две нравственные группы в нынешнем веке.
- source_word: αἰὼν οὗτος
  choice: этот век
  rationale: Сохраняет эсхатологическое противопоставление нынешнего и грядущего века, заметное в ближайшем контексте.
- source_word: χειμών
  choice: зима
  rationale: Сохраняет центральный образ времени, когда живые и сухие деревья внешне неразличимы.
- source_word: κατοικοῦντες
  choice: с которыми они живут
  rationale: Передаёт совместное пребывание праведных среди грешников естественным современным русским языком.
theological_decisions:
- issue: Смысл глагола φαίνονται применительно к праведным и грешникам
  choice: их нравственное различие сейчас не видно и их невозможно распознать
  alternative: праведные и грешники вообще не являются или не существуют явно
  rationale: Образ лишённых листьев деревьев и последующее сравнение показывают, что речь идёт о внешней неразличимости, а не об отсутствии обеих групп.
- issue: Значение αἰών
  choice: век
  alternative: мир
  rationale: «Век» точнее сохраняет временное и эсхатологическое измерение греческого слова и его контраст с грядущим веком.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставительного текста. Синтаксис слегка перестроен ради ясности реплик; древесная метафора и эсхатологическое напряжение сохранены.
