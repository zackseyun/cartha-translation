review_pass:
  verdict: revise
  source_fidelity: 'В первой части стиха черновик смещает референт: греческое ποταποί εἰσιν относится к плодам («каковы они»), а не к дереву, которое узнают по плодам. В заключении καὶ γνωσθήσονται πάντες ... εὐθαλεῖς ὄντες означает, что все будут признаны/окажутся цветущими (процветающими) в том веке; перевод «будут узнаны: ... будут цвести» неоправданно расчленяет эту конструкцию. Добавленное «даже» не выражено в греческом. Текстологически сомнительные слова сохранены в квадратных скобках без попытки устранить их синтаксическую трудность.'
  naturalness: Предлагаемая редакция сохраняет образ дерева и плодов, звучит по-современному и не приписывает «малым» специального богословского значения. Оборот в скобках намеренно несколько неровен, поскольку такова отмеченная в издании текстологическая проблема.
  terminology: «Праведные» и «тот век» уместно сохраняют регистр и связь с αἰών в ближайшем контексте. «Цветущими» естественно передаёт εὐθαλεῖς и поддерживает древесную метафору.
  issues:
  - severity: medium
    issue: Смысловое смещение в «по ним узнают, каково это дерево».
    rationale: 'В оригинале распознаются сами плоды: «плоды каждого дерева становятся явными и узнаётся, каковы они». Упоминание узнавания дерева является интерпретирующим добавлением.'
  - severity: medium
    issue: Неверно расчленена заключительная конструкция, а «даже» добавлено без основания в тексте.
    rationale: γνωσθήσονται πάντες ... εὐθαλεῖς ὄντες связывает «все» с их признанием цветущими/процветающими. «Даже» отсутствует в οἱ ἐλάχιστοι ὄντες; сомнительное чтение следует передать нейтрально и оставить в скобках.
  revised_text: 3. Ведь как летом плоды каждого дерева становятся явными и можно узнать, каковы они, так и плоды праведных станут явными, и все будут признаны цветущими в том веке [хотя и самыми малыми].
