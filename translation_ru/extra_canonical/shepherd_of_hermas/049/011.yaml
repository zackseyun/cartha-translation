base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/011.yaml
  text: 3. “For just as in summer the fruits of each tree become visible and are recognized for what they are, so also the fruits of the righteous will be visible, and all will be known, [those who are least] being flourishing in that age.”
translation:
  language: ru
  text: 3. Ведь как летом плоды каждого дерева становятся явными и можно узнать, каковы они, так и плоды праведных станут явными, и все будут признаны цветущими в том веке [хотя и самыми малыми].
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποταποί εἰσιν
  choice: каково это дерево
  rationale: Выражение буквально означает «каковы они»; в данном сравнении речь о том, что по плодам распознают качество или природу каждого дерева. Уточнение подлежащего делает русский текст естественным.
- source_word: ἐπιγινώσκονται
  choice: по ним узнают
  rationale: Глагол передаёт распознавание по проявившимся плодам; безличная конструкция естественна по-русски.
- source_word: εὐθαλεῖς
  choice: будут цвести
  rationale: Слово означает «цветущие, пышно растущие, преуспевающие». Глагольная передача сохраняет древесный образ и звучит естественно.
- source_word: ἐν τῷ αἰῶνι ἐκείνῳ
  choice: в том веке
  rationale: Сохраняется эсхатологический термин αἰών и связь с «грядущим веком» в предшествующем контексте.
theological_decisions:
- issue: Кого охватывает πάντες («все»)
  choice: «все они будут узнаны» — все праведные станут распознаваемы по плодам
  alternative: «все плоды будут узнаны»
  rationale: Ближайший широкий контекст говорит о том, что тогда обнаружатся служащие Богу; формулировка сохраняет личную отнесённость, не исключая связи с плодами.
- issue: Смысл οἱ ἐλάχιστοι ὄντες
  choice: сохранить как «даже самые малые» и отметить текстовую неуверенность
  alternative: опустить слова как вторичную вставку или перевести «все, даже самые малые, будут цветущими»
  rationale: Слова присутствуют в представленном тексте в квадратных скобках и синтаксически трудны. Перевод сохраняет их без догматического уточнения того, в каком именно смысле эти люди названы «малыми».
translation_notes:
  register: Современный литературный русский язык с ясным, достойным повествовательным ритмом. Древесная метафора сохранена; синтаксис слегка раскрыт ради понятности обычному читателю.
