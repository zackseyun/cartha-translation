  text: …they make their wealth complete, and in turn the rich, by supplying the poor with the things they need, make their souls complete.
translation:
  language: ru
  text: …они восполняют богатство богатых, а богатые, в свою очередь, предоставляя бедным всё необходимое, восполняют свои души.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληροφοροῦσι
  choice: придают полноту
  rationale: Сохраняет повтор и смысловую симметрию греческого глагола в обеих частях фразы; не сводит его значение ни к материальному умножению, ни к субъективной уверенности.
- source_word: τὸν πλοῦτον αὐτῶν
  choice: их богатству
  rationale: Передаёт форму и референцию исходного текста без добавочного истолкования того, каким образом бедные делают богатство богатых полным.
- source_word: χορηγοῦντες
  choice: снабжая
  rationale: Естественно передаёт предоставление необходимых средств или вещей.
- source_word: τοῖς πένησι
  choice: бедных
  rationale: Современное и нейтральное обозначение нуждающихся людей.
- source_word: τὰ δέοντα
  choice: всем необходимым
  rationale: Идиоматически передаёт «то, что нужно / должное» в контексте материальной помощи.
- source_word: τὰς ψυχὰς αὐτῶν
  choice: своим душам
  rationale: Возвратное «своим» ясно связывает души с богатыми, являющимися подлежащим второй части.
theological_decisions:
- issue: Взаимная духовная польза бедных и богатых
  choice: 'Сохранена параллель: бедные придают полноту богатству богатых, а богатые — своим душам.'
  alternative: Истолковать первую часть как умножение богатства, а вторую как спасение душ.
  rationale: Греческий текст дважды употребляет один и тот же глагол πληροφοροῦσι; перевод не должен заранее разрешать богословское напряжение или вводить отсутствующую в данном предложении формулу спасения.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Лексический повтор намеренно сохранён ради риторической и смысловой структуры оригинала; начальное многоточие отражает то, что читательский сегмент начинается внутри предложения.
