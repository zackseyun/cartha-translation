revisions:
- from: …они придают полноту их богатству, а богатые, в свою очередь, снабжая бедных всем необходимым, придают полноту своим душам.
  to: …они восполняют богатство богатых, а богатые, в свою очередь, предоставляя бедным всё необходимое, восполняют свои души.
  rationale: Исправлены референтная неясность и стилистическая калька. Повтор «восполняют» сохраняет риторическую симметрию πληροφοροῦσι и не истолковывает выражение как материальное обогащение либо гарантированное спасение.
