    issue: «Он спросил меня» вместо «Он сказал мне»
    rationale: В греческом стоит λέγει μοι, обычная повествовательная формула «говорит мне»; вопросительное содержание реплики не требует заменять глагол речи на «спросил».
  - severity: low
    issue: «Засохшими» для ὡσεὶ ξηρά
    rationale: «Засохшими» несколько усиливает образ, предполагая процесс увядания. «Словно сухими» ближе к ξηρά и яснее передаёт сравнительное ὡσεὶ.
