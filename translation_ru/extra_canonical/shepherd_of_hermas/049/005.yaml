base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/005.yaml
  text: 1. He showed me many trees that had no leaves, but they seemed to me to be dry; for they were all alike. And he says to me, “Do you see these trees?” “I see,” I say, “sir, that they are alike and dry.” Answering, he says to me, “These trees that you see are those who dwell in this age.”
translation:
  language: ru
  text: '1. Он показал мне множество деревьев без листьев, но они казались мне словно сухими, потому что все были одинаковы. И он сказал мне: «Видишь эти деревья?» Я ответил: «Вижу, господин: они одинаковы и сухи». В ответ он сказал мне: «Эти деревья, которые ты видишь, — люди, живущие в нынешнем веке».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡσεὶ ξηρὰ
  choice: казались мне засохшими
  rationale: Передаёт сравнительно-впечатлительный оттенок ὡσεὶ и сохраняет образ деревьев, выглядящих безжизненными.
- source_word: κύριε
  choice: господин
  rationale: В обращении к небесному наставнику здесь уместно уважительное «господин»; написание со строчной буквы не отождествляет адресата с Господом Богом без основания в контексте.
- source_word: οἱ κατοικοῦντες
  choice: люди, живущие
  rationale: Естественно по-русски выражает субстантивированное причастие и не сужает круг обозначаемых лиц.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: в нынешнем веке
  rationale: Сохраняет эсхатологическую многозначность αἰών и связь с противопоставлением грядущему веку в дальнейшем контексте.
theological_decisions:
- issue: Значение αἰών как временного периода или мира/миропорядка
  choice: нынешний век
  alternative: этот мир
  rationale: «Нынешний век» точнее сохраняет временно-эсхатологическое противопоставление нынешнего и грядущего века, не исключая значения существующего миропорядка.
translation_notes:
  register: Современный литературный русский язык с простым, достоинственным повествованием. Повтор образов и реплик сохранён, но греческая конструкция ἀποκριθείς μοι передана естественным связующим оборотом «Тогда он сказал мне».
