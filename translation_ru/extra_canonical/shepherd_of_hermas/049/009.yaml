base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/009.yaml
  text: 1. He showed me again many trees, some sprouting and others dry, and he says to me, “Do you see these trees?” “I see,” I say, “sir, some sprouting and others dry.”
translation:
  language: ru
  text: '1. Он снова показал мне множество деревьев: одни распускались, а другие были сухими. И говорит мне: «Видишь эти деревья?» Я отвечаю: «Вижу, господин: одни распускаются, а другие сухие».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλαστῶντα
  choice: распускались / распускаются
  rationale: Причастие от βλαστάνω обозначает появление побегов или листвы. В образе деревьев естественное русское «распускаться» передаёт видимый признак жизни и сохраняет противопоставление сухим деревьям.
- source_word: ξηρά
  choice: сухими / сухие
  rationale: Буквально передаёт состояние деревьев и сохраняет образ, который получает толкование в следующих стихах.
- source_word: κύριε
  choice: господин
  rationale: В прямом обращении к собеседнику здесь уместно значение вежливого титула «господин», без преждевременного отождествления адресата с Господом Богом.
- source_word: πάλιν
  choice: снова
  rationale: Сохраняет связь с предшествующим показанным видением.
theological_decisions:
- issue: Передача κύριε в обращении
  choice: господин
  alternative: Господи / господин мой
  rationale: Контекст представляет обращение к проводнику видения; строчное «господин» сохраняет социально-вежливое значение греческого слова и не вносит дополнительного богословского отождествления.
translation_notes:
  register: Современный литературный русский язык с простой, достойной повествовательной интонацией. Сохранены историческое настоящее («говорит», «отвечаю») и симметричный контраст между распускающимися и сухими деревьями.
