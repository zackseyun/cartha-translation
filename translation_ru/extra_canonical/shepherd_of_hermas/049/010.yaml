base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/010.yaml
  text: 2. “These trees that are sprouting,” he says, “are the righteous, who are about to dwell in the age to come; for the age to come is summer for the righteous, but winter for sinners. Therefore when the mercy of the Lord shines forth, then those serving God will be made manifest, and all will be made manifest.”
translation:
  language: ru
  text: 2. «Эти распускающиеся деревья, — говорит он, — праведники, которым предстоит жить в грядущем веке. Ведь грядущий век для праведников — лето, а для грешников — зима. Итак, когда воссияет милость Господа, тогда станут явными те, кто служит Богу, и все станут явными».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλαστῶντα
  choice: распускающиеся
  rationale: Передаёт образ деревьев, покрывающихся побегами и листвой; естественно звучит по-русски и сохраняет противопоставление сухим деревьям.
- source_word: μέλλοντες κατοικεῖν
  choice: которым предстоит жить
  rationale: Передаёт будущую направленность μέλλοντες и смысл κατοικεῖν без тяжеловесного буквального оборота «намеревающиеся обитать».
- source_word: αἰὼν ὁ ἐρχόμενος
  choice: грядущий век
  rationale: Сохраняет эсхатологический смысл αἰών и традиционно понятное русское выражение, не подменяя его словом «мир».
- source_word: θέρος
  choice: лето
  rationale: Прямо сохраняет сезонную метафору и противопоставление зиме.
- source_word: ἐπιλάμψῃ
  choice: воссияет
  rationale: Сохраняет образ сияния милости Господа и возвышенный, но понятный регистр.
- source_word: φανερωθήσονται
  choice: станут явными
  rationale: 'Передаёт пассивное значение: служащие Богу будут обнаружены и распознаны, а не сами себя проявят.'
theological_decisions:
- issue: Значение «грядущего века»
  choice: грядущий век
  alternative: будущий мир
  rationale: Греческое αἰών обозначает век или эпоху; выбранный вариант сохраняет эсхатологическую формулировку без уточнения природы будущего состояния.
- issue: Субъект всеобщего обнаружения в πάντες φανερωθήσονται
  choice: и откроются все
  alternative: и всё станет явным
  rationale: Форма πάντες — мужской род множественного числа — указывает на людей («все»), а не на вещи или события; перевод сохраняет эту грамматическую определённость.
- issue: Милость Господа как сияющая
  choice: когда воссияет милость Господа
  alternative: когда явится милость Господа
  rationale: Сохранён образ света в глаголе ἐπιλάμπω, без истолкования того, каким именно событием это сияние осуществляется.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Синтаксис упрощён для ясности, но сезонная и световая метафорика греческого текста сохранена.
