base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/007.yaml
  text: 3. “For just as in winter the trees, having cast off their leaves, are alike, and it is not apparent which are dry or which are living, so in this age neither the righteous nor the sinners are apparent, but all are alike.”
translation:
  language: ru
  text: 3. Ведь как зимой деревья, сбросив листья, выглядят одинаково и не видно, какие из них засохли, а какие живы, так и в этом веке не видно, кто праведен, а кто грешен, но все выглядят одинаково.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποβεβληκότα τὰ φύλλα
  choice: сбросив листья
  rationale: Естественно передаёт греческое совершенное причастие и сохраняет образ зимних деревьев без лишнего уточнения.
- source_word: οὐ φαίνονται
  choice: не видно
  rationale: Передаёт идею внешней неразличимости; в русском звучит естественнее буквального «не являются».
- source_word: τὰ ξηρά ... ἢ τὰ ζῶντα
  choice: какие из них засохли, а какие живы
  rationale: Сохраняет противопоставление сухих, то есть мёртвых на вид, и живых деревьев, не заменяя образ отвлечёнными категориями.
- source_word: ἐν τῷ αἰῶνι τούτῳ
  choice: в этом веке
  rationale: Сохраняет эсхатологически значимую лексику αἰών и связь с противопоставлением нынешнего и грядущего века в контексте.
- source_word: οἱ δίκαιοι ... οἱ ἁμαρτωλοί
  choice: кто праведен, а кто грешен
  rationale: Идиоматично выражает неразличимость двух групп, сохраняя нравственно-богословское противопоставление оригинала.
theological_decisions:
- issue: Видимость праведных и грешных в нынешнем веке
  choice: не видно, кто праведен, а кто грешен
  alternative: не явлены ни праведники, ни грешники
  rationale: Греческое οὐ φαίνονται в контексте сравнения с деревьями говорит о невозможности внешне различить людей, а не об отсутствии праведных или грешных и не об окончательном Божьем суде.
translation_notes:
  register: Современный литературный русский язык; образность и ритмический параллелизм оригинала сохранены. Формула «этот век» оставлена ради связи с эсхатологическим контекстом.
