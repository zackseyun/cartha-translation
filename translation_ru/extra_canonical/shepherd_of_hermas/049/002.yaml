base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/049/002.yaml
  text: 9. Thus both become partners in the work of the righteous one. Therefore the one who does these things will not be abandoned by God, but will be inscribed in the books of the living.
translation:
  language: ru
  text: 9. Итак, оба становятся соучастниками дела праведника.[a] Поэтому тот, кто так поступает, не будет оставлен Богом, но будет вписан в книги живых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «праведного дела»; греческое выражение допускает менее личное понимание.'
    reason: Основное значение субстантивированного τοῦ δικαίου — «праведника»; сноска кратко отмечает возможное альтернативное прочтение, не вводя христологическую интерпретацию.
lexical_decisions:
- source_word: ἀμφότεροι
  choice: оба
  rationale: Указывает на две названные в предшествующем контексте стороны — бедных и богатых.
- source_word: κοινωνοὶ
  choice: соучастниками
  rationale: Передаёт участие обеих сторон в одном общем деле, а не только внешнее сотрудничество.
- source_word: ἐγκαταλειφθήσεται
  choice: не будет оставлен
  rationale: Точно сохраняет пассивную форму и мысль о том, что Бог не покинет поступающего так.
- source_word: ἐπιγεγραμμένος
  choice: вписан
  rationale: Естественно передаёт образ внесения имени в небесные книги.
- source_word: βίβλους τῶν ζώντων
  choice: книги живых
  rationale: Сохраняет множественное число βίβλους и буквальный смысл родительного τῶν ζώντων.
theological_decisions:
- issue: Значение τοῦ δικαίου
  choice: дела праведности
  alternative: дела Праведного / дела праведника
  rationale: Форма δικαίου допускает понимание как отвлечённой праведности, так и праведного лица. Контекст взаимной помощи бедных и богатых естественно поддерживает значение «праведное дело» или «дело праведности»; личностное прочтение не исключено и отмечено в сноске.
- issue: Образ «книг живых»
  choice: сохранить образ без поясняющего богословского расширения
  alternative: книги жизни / небесные книги спасённых
  rationale: Греческий текст говорит именно о «книгах живых» во множественном числе; перевод не отождествляет выражение с иной формулой и не уточняет статус записанных сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Синтаксис близок к греческому, но естественен для обычного читателя; причинно-следственные связки «итак» и «поэтому» сохранены.
