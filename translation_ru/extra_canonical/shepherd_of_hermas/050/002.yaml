  source_fidelity: 'Основной смысл передан точно: вопрос о στατίων, ответ «пощусь», затем вопрос о характере такого поста и ответ о привычном способе поста сохранены. Однако сноска a чрезмерно конкретизирует термин, добавляя «установленное» время и «духовное бодрствование», чего данный отрывок сам по себе не определяет. Форму νηστεύετε уместно передать множественным числом «вы».'
