base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/002.yaml
  text: '"What," he says, "is a station?" I say, "I am fasting, sir." He says, "And what is this fasting that you are fasting?" I say, "As I have been accustomed, sir, so I fast."'
translation:
  language: ru
  text: '— Что такое «стояние»[a]? — спросил он.


    — Я пощусь, господин, — ответил я.


    — Что это за пост, который вы держите?[b]


    — Я пощусь так, как привык, господин, — ответил я.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. στατίων — заимствованный из латинского statio технический термин; в данном контексте он обозначает постную практику, буквально связанную со «стоянием».
    reason: Сохраняет необходимое объяснение редкого термина, не навязывая конкретного позднейшего понимания его обряда.
  - marker: b
    text: В некоторых рукописных свидетельствах слова «который вы держите» отсутствуют.
    reason: Исходное издание заключает соответствующие греческие слова в скобки как текстуально неустойчивые.
lexical_decisions:
- source_word: στατίων
  choice: «стояние»
  rationale: Сохранён необычный технический термин и связь с предшествующей репликой; пояснение вынесено в сноску, поскольку простая замена словом «пост» уничтожила бы смысл вопроса.
- source_word: νηστεύω / νηστεία
  choice: «пощусь» / «пост»
  rationale: Естественные современные русские соответствия, сохраняющие различие между действием и названием практики.
- source_word: κύριε
  choice: «господин»
  rationale: В данном обращении к собеседнику это почтительная форма, а не прямое именование Господа; строчная буква помогает сохранить различие.
- source_word: ὡς εἰώθειν … οὕτω
  choice: «так, как привык»
  rationale: Передаёт обычный, установившийся способ поста без добавления сведений о его конкретной форме.
theological_decisions:
- issue: Характер поста, обозначенного словом στατίων
  choice: Сохранить технический термин с кратким историко-языковым пояснением
  alternative: Перевести просто как «пост» или уточнить как определённый церковный постный день
  rationale: Исходный текст намеренно различает название практики и последующее объяснение «я пощусь»; конкретизация её правил внесла бы более позднюю традиционную интерпретацию.
- issue: Число в выражении ἣν νηστεύετε
  choice: Передать вежливым/обобщённым «вы соблюдаете»
  alternative: 'Исправить по контексту на единственное число: «который ты соблюдаешь»'
  rationale: Форма греческого текста — множественное число; перевод сохраняет её, не устраняя возможное обобщение обращения.
translation_notes:
  register: Современный литературный русский с простым, достойным диалогическим строем. Архаический технический термин оставлен в кавычках только там, где он сам становится предметом вопроса; синтаксис остальных реплик сделан естественным для обычного читателя.
