base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/003.yaml
  text: He says, "You do not know how to fast to the Lord, nor is this useless fast that you fast to him a fast."
translation:
  language: ru
  text: 'Он говорит: «Вы не умеете поститься Господу, и этот бесполезный пост, который вы соблюдаете для Него, — не пост».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νηστεύειν τῷ Κυρίῳ
  choice: поститься для Господа
  rationale: Дательный τῷ Κυρίῳ передаёт направленность поста Господу; формулировка сохраняет смысл и естественно звучит по-русски.
- source_word: ἀνωφελής
  choice: бесполезный
  rationale: Прямо передаёт оценку поста как не приносящего пользы, не добавляя толкования о причине его непригодности.
- source_word: οὐδέ ἐστιν νηστεία αὕτη
  choice: этот … пост — вовсе не пост
  rationale: Сохраняет резкое отрицание подлинности такого поста; «вовсе» естественно выражает усилительный смысл конструкции.
theological_decisions:
- issue: Отрицание ценности или самого статуса поста
  choice: «вовсе не пост»
  alternative: «не является постом»
  rationale: Греческий текст отрицает, что описанная практика действительно есть пост, а не только утверждает её малую духовную ценность.
- issue: Направленность поста Господу
  choice: «для Господа»
  alternative: «Господу»
  rationale: В современном русском «поститься Господу» звучит архаично и может быть неясно; «для Господа» сохраняет религиозную направленность без конфессионального уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи наставника. Местоимение «Него» написано с прописной буквы в соответствии с распространённой русской религиозной издательской практикой.
