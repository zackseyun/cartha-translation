translation:
  language: ru
  text: «Ты пришёл?» — «Потому что, господин, — отвечаю я, — я соблюдаю стацию[a]».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Стация — установленный день поста или постного бдения у ранних христиан.
    reason: Термин малоизвестен современному русскому читателю, но важен для логики следующего обмена репликами.
lexical_decisions:
- source_word: ἐλήλυθας
  choice: «Ты пришёл?»
  rationale: Сохранена вопросительная форма перфекта ἔρχομαι без добавления отсутствующих в данном фрагменте обстоятельств или причины.
- source_word: κύριε
  choice: «господин»
  rationale: В обращении к собеседнику это вежливое титулование; строчная буква не отождествляет адресата с Господом Богом.
- source_word: στατίωνα ἔχω
  choice: «я соблюдаю стацию»
  rationale: Στατίων — раннехристианский технический термин для установленного постного дня или постного бдения. Глагол «соблюдаю» естественно передаёт идиому ἔχω («имею») в данном контексте, а сам термин сохранён ввиду его разъяснения в следующей реплике источника.
theological_decisions:
- issue: Характер «стации» как постной практики
  choice: Сохранить исторический термин и пояснить его в сноске
  alternative: Перевести непосредственно как «я пощусь» или «у меня пост»
  rationale: Следующая реплика отдельно спрашивает, что такое στατίων, после чего Ерм отвечает «пощусь». Прямая замена на «пост» устранила бы намеренное различие и сделала бы последующий вопрос тавтологичным.
translation_notes:
  register: Современный литературный русский с краткой, естественной диалогической конструкцией. Начальный вопрос сохранён буквально и без попытки восполнить, вероятно, предшествующий контекст. Обращение «господин» соответствует сцене наставления и звучит достоинственно, но не архаично.
