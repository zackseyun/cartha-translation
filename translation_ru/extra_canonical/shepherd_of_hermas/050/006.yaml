base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/006.yaml
  text: '"After a time the master of the servant [and of the field] came and went into the vineyard. And seeing the vineyard well fenced, and even dug, and [all] the weeds pulled out, he rejoiced greatly over his servant on account of his deed. Summoning again his friends and his son, the master announced to them the deed the servant had done with his portions which he had received; and they approved all the more that the servant should become co-heir with his son."'
translation:
  language: ru
  text: Спустя некоторое время пришёл господин слуги [и поля] и вошёл в виноградник. Увидев, что виноградник прекрасно огорожен и вскопан, а [все] сорняки вырваны, он весьма обрадовался поступку своего слуги. Господин снова созвал друзей и своего сына и рассказал им о поступке слуги с полученными им припасами; и они тем более одобрили то, чтобы слуга стал сонаследником его сына.
  philosophy: optimal-equivalence
  footnotes:
  - marker: и поля
    text: Слова «и поля» в греческом тексте заключены в квадратные скобки как текстологически сомнительные.
    reason: Сохраняет редакционную неопределённость источника.
  - marker: все
    text: Слово «все» в греческом тексте заключено в квадратные скобки как текстологически сомнительное.
    reason: Сохраняет редакционную неопределённость источника.
lexical_decisions:
- source_word: δεσπότης
  choice: господин
  rationale: Передаёт власть хозяина над слугой и полем, не смешивая это обозначение с обычным титулом «Господь».
- source_word: κεχαρακωμένον
  choice: огорожен
  rationale: Глагол связан с устройством ограды или частокола вокруг виноградника; «огорожен» естественно и точно передаёт результат.
- source_word: βοτάνας
  choice: сорняки
  rationale: В данном земледельческом контексте речь идёт о растениях, заглушающих виноградник, поэтому нейтральное «травы» было бы недостаточно определённым.
- source_word: πρᾶξιν
  choice: как … распорядился
  rationale: Второе употребление относится к действию слуги с полученной пищей; глагольная передача по-русски яснее буквального «поступок, который он совершил над пищей».
- source_word: ἐδέσμασιν
  choice: пища
  rationale: Обобщённое собирательное слово естественно передаёт полученные съестные припасы без добавления отсутствующей в тексте конкретики.
- source_word: συγκληρονόμον
  choice: сонаследником
  rationale: 'Сохраняет юридическую и богословскую насыщенность термина: слуга получает наследство совместно с сыном.'
theological_decisions:
- issue: Отношение слуги к сыну при наследовании
  choice: сонаследником его сына
  alternative: сонаследником вместе с его сыном
  rationale: Сохраняется прямое значение συγκληρονόμον τῷ υἱῷ αὐτοῦ без уточнения характера или равенства наследственных долей.
- issue: Оценка решения друзьями и сыном
  choice: ещё охотнее согласились
  alternative: тем более одобрили
  rationale: συνευδόκησαν выражает совместное благосклонное согласие; перевод не превращает их согласие в самостоятельное властное решение.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианской притчи. Сохранены редакционные квадратные скобки источника: [и поля] и [все]. Синтаксис слегка разгружен для ясности, при этом последовательность событий и юридический образ сонаследования сохранены.'
