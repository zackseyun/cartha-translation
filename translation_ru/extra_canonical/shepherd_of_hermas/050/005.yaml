- from: 'Он говорит мне: «Говорю тебе: то, что вы считаете постом перед Господом, — не пост. Послушай притчу. Виноградник, в котором нет сорняков, принесёт больше плодов, потому что сорняки не заглушают его. Тогда раб взялся за дело: вскопал виноградник и вырвал все росшие в нём сорняки. И стал тот виноградник прекрасным и пышным, поскольку не было в нём сорняков, которые заглушали бы его».'
  to: 'Он говорит мне: «Говорю тебе: это не пост, хотя вы и думаете, что поститесь Господу. Послушай притчу. Виноградник, в котором нет сорняков, принесёт больше плода, потому что сорняки не заглушают его. Тогда раб принялся за работу: вскопал виноградник и вырвал все сорняки, которые росли в винограднике. И стал тот виноградник прекрасным и цветущим, потому что в нём не было сорняков, заглушавших его».'
  rationale: Исправлена направленность выражения о посте («Господу»), устранён менее точный пространственный оттенок «перед Господом», а сельскохозяйственное описание виноградника уточнено. Эллипсис повреждённого греческого текста после λαβών передан нейтрально, без внесения названия орудия. Смысл притчи и повтор ключевых образов сохранены.
