base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/050/005.yaml
  text: He says to me, "I tell you, this is not fasting, the kind you suppose you are fasting to the Lord. Listen to a parable. A vineyard, not having weeds, will give more fruit, not being choked by the weeds. So the servant took up [his tool], dug the vineyard, and pulled up all the weeds that were in the vineyard. And that vineyard became very comely and thriving, having no weeds to choke it.
translation:
  language: ru
  text: 'Он говорит мне: «Говорю тебе: это не пост, хотя вы и думаете, что поститесь Господу. Послушай притчу. Виноградник, в котором нет сорняков, принесёт больше плода, потому что сорняки не заглушают его. Тогда раб принялся за работу: вскопал виноградник и вырвал все сорняки, которые росли в винограднике. И стал тот виноградник прекрасным и цветущим, потому что в нём не было сорняков, заглушавших его».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νηστεία / νηστεύειν
  choice: пост / поститься
  rationale: Обычные и точные русские соответствия, сохраняющие религиозный смысл и повтор исходного текста.
- source_word: βοτάνας
  choice: сорняки
  rationale: В контексте виноградника речь идёт о нежелательной растительности, которая заглушает лозы; «сорняки» естественнее и точнее общего «травы».
- source_word: πνιγόμενος / πνιγούσας
  choice: заглушают / заглушали
  rationale: Передаёт сельскохозяйственный образ растений, подавляющих рост виноградника, без неестественного буквального «душат».
- source_word: λαβὼν ἔσκαψε
  choice: 'взялся за дело: вскопал'
  rationale: В сохранившемся тексте после «взяв» не назван предмет; русский оборот сохраняет энергичность действия, не добавляя конкретного орудия.
- source_word: εὐπρεπέστατος καὶ εὐθαλής
  choice: прекрасным и пышным
  rationale: Передаёт одновременно привлекательный вид и здоровое, обильное произрастание виноградника.
theological_decisions:
- issue: Характер отвергаемого поста
  choice: «то, что вы считаете постом перед Господом, — не пост»
  alternative: «это не тот пост, которым вы думаете поститься Господу»
  rationale: Выбран естественный русский синтаксис, сохраняющий критику предполагаемого поста и его направленность к Господу, не объясняя заранее смысл притчи.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Повторы образов поста, виноградника и сорняков сохранены; эллиптическое действие раба передано без внесения отсутствующего в греческом тексте названия орудия.
