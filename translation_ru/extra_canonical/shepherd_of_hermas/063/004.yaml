lexical_decisions:
- source_word: ῥάβδοι
  choice: прутья
  rationale: В данном образном повествовании речь идёт о срезанных древесных прутьях; это слово естественнее и точнее, чем «жезлы» или «палки».
- source_word: κεκομμένας
  choice: надрезанные
  rationale: Форма обозначает прутья, ранее повреждённые режущим воздействием; «надрезанные» сохраняет отличие от полностью отрубленных или разрезанных прутьев.
- source_word: χωρὶς σταθῆναι
  choice: встать отдельно
  rationale: Передаёт буквальный пространственный смысл и естественно звучит по-русски.
