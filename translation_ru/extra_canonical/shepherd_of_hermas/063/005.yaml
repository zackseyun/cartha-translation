translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Синтаксис сделан ясным для широкого читателя; повторения, значимые для последовательной классификации прутьев, сохранены. Добавленное для ясности существительное «прутья» не отмечено квадратными скобками, поскольку оно прямо восстанавливается из греческого контекста и необходимо для естественной русской речи.
