  text: 5. Then those who had the dry but not cut [rods] handed them in. And some of them handed in their rods green, but others dry and cut, as if worm-eaten. So those who had handed in green [rods] he ordered to stand apart, but those with dry—
translation:
  language: ru
  text: 5. Затем передали свои прутья те, у кого они были сухими, но не обрезанными. Некоторые из них передали прутья зелёными, а некоторые — сухими и обрезанными, словно изъеденными червями. Тех, кто передал зелёные прутья, он велел поставить отдельно, а тех, кто передал сухие…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст данного читательского отрывка обрывается после слов «а тех, кто передал сухие…»; предложение продолжается в следующем отрывке.
    reason: Сохранить незавершённость предоставленного исходного сегмента и не создавать впечатления, будто многоточие является авторским стилистическим приёмом.
lexical_decisions:
- source_word: ῥάβδοι
  choice: прутья
  rationale: В данном образном повествовании речь идёт о посаженных и затем вынимаемых древесных прутьях; «прутья» естественнее и точнее контекстуального значения, чем «жезлы».
- source_word: κεκομμένας
  choice: надрезанными
  rationale: Форма обозначает прутья, подвергшиеся резанию; «надрезанные» сохраняет отличие от полностью отрезанных или разрубленных и соответствует повторяющейся классификации прутьев.
- source_word: χλωράς
  choice: зелёными
  rationale: В противопоставлении сухим прутьям слово указывает на свежесть и жизненность; буквальное «зелёные» сохраняет образ.
- source_word: ὡς ὑπὸ σητός
  choice: словно изъеденными червями
  rationale: Передаёт сравнительную конструкцию и смысл повреждения древесины насекомыми или червями, не утверждая это как установленную причину.
- source_word: χωρὶς σταθῆναι
  choice: поставить отдельно
  rationale: Естественно передаёт приказ выделить эту группу и поставить её обособленно.
