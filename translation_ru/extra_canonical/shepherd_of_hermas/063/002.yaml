revisions:
- from: '2. Увидев, что я препоясан и готов служить ему, он сказал: «Позови людей, чьи прутья были посажены, — по порядку, в котором каждый из них отдал свой прут». Я пошёл на поле и позвал всех; и все они встали по порядку.'
  to: '2. Увидев меня опоясанным и готовым служить ему, он сказал: «Позови людей, чьи прутья были посажены, в том порядке, в каком каждый отдал свои прутья». Я пошёл в поле и позвал всех; и все они встали по своим местам.'
  rationale: 'Внесены лишь безопасные уточнения: восстановлено множественное число «прутья» согласно греческому оригиналу и яснее выражен порядок, определяемый прежней передачей прутьев. «По своим местам» передаёт построение людей κατὰ τὰ τάγματα, не приписывая ему должностной или духовной иерархии.'
