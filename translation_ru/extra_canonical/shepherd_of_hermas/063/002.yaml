  yaml_path: translation/extra_canonical/shepherd_of_hermas/063/002.yaml
  text: 2. Seeing me girded and ready to serve him, he says, “Call the men whose rods have been planted, by rank, just as each gave the rods.” And I went out to the field and called them all; and they all stood in their ranks.
translation:
  language: ru
  text: '2. Увидев меня опоясанным и готовым служить ему, он сказал: «Позови людей, чьи прутья были посажены, в том порядке, в каком каждый отдал свои прутья». Я пошёл в поле и позвал всех; и все они встали по своим местам.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιεζωσμένον
  choice: препоясан
  rationale: Сохраняет конкретный образ одежды, подготовленной для служения, и соответствует предшествующему повелению опоясаться.
- source_word: διακονεῖν
  choice: служить
  rationale: Естественно передаёт практическое прислуживание пастырю без ненужного сужения до церковной должности.
- source_word: ῥάβδοι
  choice: прутья
  rationale: В данном образном рассказе речь идёт о срезанных и затем посаженных прутьях; «прутья» точнее, чем «жезлы» или «посохи».
- source_word: κατὰ τὸ τάγμα / κατὰ τὰ τάγματα
  choice: по порядку / по порядку
  rationale: Передаёт организованное распределение людей согласно последовательности сдачи прутьев; русское «по рангам» здесь звучало бы неоправданно иерархично.
- source_word: ἐπέδωκε
  choice: отдал
  rationale: Передаёт вручение прута пастырю в предшествующем эпизоде простым и естественным русским глаголом.
theological_decisions:
- issue: Значение διακονεῖν
  choice: служить ему
  alternative: прислуживать ему
  rationale: «Служить» сохраняет широкий смысл греческого слова и не привносит ни уничижительного оттенка, ни специального значения церковного служения.
- issue: Характер τάγμα
  choice: порядок, определяемый последовательностью сдачи прутьев
  alternative: чин или ранг
  rationale: Контекст связывает распределение с тем, как каждый передал прут, а не с духовной или должностной иерархией.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной повествовательной интонацией. Синтаксис сделан ясным для широкого читателя, при этом сохранены повтор «все» и последовательность действий греческого текста.
