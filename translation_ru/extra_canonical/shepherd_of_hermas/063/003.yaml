lexical_decisions:
- source_word: ἐκτιλάτω
  choice: пусть выдернет
  rationale: Глагол означает «вырывать, выдёргивать»; здесь речь о прутьях, ранее посаженных в землю.
- source_word: ῥάβδους
  choice: прутья
  rationale: В данном образе это отдельные древесные прутья, а не жезлы как знаки власти.
- source_word: φερέτω πρός με
  choice: принесёт их мне
  rationale: Естественно передаёт движение предметов к говорящему; местоимение «их» добавлено для ясной русской связи с прутьями.
