base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/063/001.yaml
  text: And after a few days we came to the place, and the Shepherd sat down in the place of the angel, and I stood beside him. And he says to me, “Gird yourself with a raw-linen garment, and serve me.” So I girded myself with a clean raw-linen garment made from sackcloth.
translation:
  language: ru
  text: 'Через несколько дней мы пришли на то место. Пастырь сел на место ангела, а я встал рядом с ним. Он сказал мне: «Опояшься одеждой из небелёного льна и служи мне». И я опоясался чистой одеждой из небелёного льна, сшитой из мешковины.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Редкое греческое слово ὠμόλινον, вероятно, обозначает одежду или препоясание из грубого необработанного льна; выражение «из мешковины» дополнительно подчёркивает грубость ткани.
    reason: Исходное обозначение материала необычно и допускает некоторую лексическую неопределённость, которую важно не скрывать.
lexical_decisions:
- source_word: ὁ ποιμήν
  choice: Пастырь
  rationale: Сохраняет устойчивое именование центрального персонажа и образ пастыря; прописная буква указывает на титульное употребление в произведении.
- source_word: παρεστάθην αὐτῷ
  choice: я встал рядом с ним
  rationale: Передаёт пространственное значение глагола естественным современным русским языком, не добавляя оттенка противостояния.
- source_word: Περίζωσαι
  choice: Опояшься
  rationale: Сохраняет конкретный образ подпоясывания одеждой и библейски окрашенный, но понятный современному читателю глагол.
- source_word: ὠμόλινον
  choice: одеждой из небелёного льна
  rationale: Редкое слово обозначает грубую, необработанную льняную ткань или предмет одежды из неё; выбран ясный русский эквивалент без излишней технической уверенности.
- source_word: διακόνει μοι
  choice: служи мне
  rationale: Нейтрально передаёт поручение прислуживать Пастырю, не сужая смысл до церковной должности.
- source_word: ἐκ σάκκου γεγονὸς
  choice: сшитой из мешковины
  rationale: Передаёт материал — грубую ткань типа вретища — естественно по-русски и согласует его с подразумеваемой одеждой.
- source_word: καθαρόν
  choice: чистой
  rationale: Сохраняет прямое описание предмета без истолкования чистоты как исключительно ритуальной или нравственной.
theological_decisions:
- issue: Статус Пастыря по отношению к ангелу
  choice: «Пастырь сел на место ангела»
  alternative: «Пастырь сел вместо ангела»
  rationale: Греческое εἰς τὸν τόπον τοῦ ἀγγέλου прежде всего обозначает место, где находился или должен был находиться ангел; перевод не утверждает, что Пастырь заменил ангела по статусу или функции.
- issue: Характер служения рассказчика
  choice: «служи мне»
  alternative: «прислуживай мне» / «совершай для меня служение»
  rationale: Формулировка сохраняет широкое значение διακονεῖν и не навязывает ни бытового уничижения, ни специального церковного смысла.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис упрощён там, где это улучшает чтение, но последовательность действий и повторяющийся образ опоясывания сохранены. Маркер сноски поставлен непосредственно после относящегося к нему выражения.
