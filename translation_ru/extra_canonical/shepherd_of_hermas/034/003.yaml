base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/003.yaml
  text: 3. But fear the works of the devil, for they are evil. So, by fearing the Lord, you will fear the works of the devil, and you will not do them, but will keep away from them.
translation:
  language: ru
  text: 3. Но бойся дел дьявола, потому что они злы. Итак, боясь Господа, ты будешь бояться дел дьявола и не станешь совершать их, а будешь держаться от них подальше.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβήθητι / φοβούμενος / φοβηθήσῃ
  choice: бойся / боясь / будешь бояться
  rationale: Сохранён повтор корня «бояться», важный для противопоставления страха Господня и отношения к делам дьявола.
- source_word: τὰ ἔργα τοῦ διαβόλου
  choice: дела дьявола
  rationale: Прямой и естественный эквивалент, обозначающий поступки и проявления деятельности дьявола.
- source_word: πονηρά
  choice: злы
  rationale: Передаёт нравственную порочность дел; краткая предикативная форма естественна в данном контексте.
- source_word: οὐκ ἐργάσῃ αὐτά
  choice: не станешь совершать их
  rationale: Глагол ἐργάζομαι передан как «совершать», чтобы по-русски естественно сочетаться со словом «дела» и сохранить деятельный смысл.
- source_word: ἀφέξῃ ἀπ᾽ αὐτῶν
  choice: будешь держаться от них подальше
  rationale: Передаёт сознательное воздержание и удаление от злых дел современным понятным выражением.
theological_decisions:
- issue: Связь страха Господня со страхом перед делами дьявола
  choice: Сохранить одинаковый глагол «бояться» в обеих частях
  alternative: Передать второе употребление как «остерегаться дел дьявола»
  rationale: 'Греческий текст намеренно повторяет φοβέομαι. Хотя «остерегаться» звучало бы более идиоматично, повтор сохраняет богословское напряжение: страх Господень порождает должное отвращение и опасение перед злом, а не страх перед самим дьяволом.'
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Структура и ключевой лексический повтор греческого текста сохранены без утяжеления синтаксиса.
