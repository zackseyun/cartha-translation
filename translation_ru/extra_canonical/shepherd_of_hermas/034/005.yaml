  text: 5. “Why,” I said, “sir, did you say about those who keep his commandments, ‘They will live to God’?” “Because,” he said, “all creation fears the Lord, but it does not keep his commandments. Therefore the life of those who fear him and keep his commandments is with God; but for those who do not keep his commandments, there is not even life in them.”
translation:
  language: ru
  text: '5. «Почему, господин, — сказал я, — ты сказал о соблюдающих Его заповеди: „Они будут жить для Бога“?» Он ответил: «Потому что всё творение боится Господа, но заповедей Его не соблюдает. Поэтому жизнь тех, кто боится Его и соблюдает Его заповеди, — у Бога; а у тех, кто не соблюдает Его заповедей, нет даже жизни в Нём».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «а у не соблюдающих Его заповедей нет даже жизни в нём». Греческое местоимение стоит в единственном числе. В контексте оно, вероятнее всего, относится к Богу («в Нём»); формально возможно и распределительное понимание: «в каждом из них».'
    reason: Сноска сохраняет формальную неоднозначность греческого αὐτῷ, не подменяя единственное число местоимением множественного числа в основном тексте.
lexical_decisions:
- source_word: κύριε
  choice: господин
  rationale: В обращении к наставнику слово передаёт почтительное «господин», а не титул «Господь», которым в этом отрывке обозначен Бог.
- source_word: πᾶσα ἡ κτίσις
  choice: всё творение
  rationale: Сохраняет широкий собирательный смысл греческого выражения и естественно звучит по-русски.
- source_word: φυλασσόντων / φυλάσσει
  choice: соблюдающих / соблюдает
  rationale: Глагол означает хранить и исполнять заповеди; «соблюдать» точно и ясно передаёт оба оттенка в данном контексте.
- source_word: ζήσονται τῷ Θεῷ
  choice: будут жить для Бога
  rationale: Дательный τῷ Θεῷ допускает смысл направленности или отношения; буквально-естественная формулировка сохраняет эту неоднозначность и связь с предыдущим стихом.
- source_word: παρὰ τῷ Θεῷ
  choice: у Бога
  rationale: Передаёт пребывание жизни при Боге, не уточняя сверх греческого текста, идёт ли речь об источнике, принадлежности или присутствии.
- source_word: οὐδὲ ζωὴ ἐν αὐτῷ
  choice: в тех … нет и жизни
  rationale: По ближайшему синтаксическому согласованию местоимение соотнесено с людьми, не соблюдающими заповеди; множественное число по-русски необходимо для естественности.
theological_decisions:
- issue: Соотношение выражений «жить для Бога» и «жизнь у Бога»
  choice: 'Сохранены разные формулировки исходника: «для Бога» и «у Бога».'
  alternative: Унифицировать как «жить у Бога» или «жить перед Богом».
  rationale: Греческий текст использует разные конструкции — τῷ Θεῷ и παρὰ τῷ Θεῷ; их уравнивание преждевременно устранило бы смысловое напряжение.
- issue: Референт местоимения в οὐδὲ ζωὴ ἐν αὐτῷ
  choice: Понято как жизнь «в тех», кто не соблюдает заповеди.
  alternative: Понять как «в Нём», то есть в Боге.
  rationale: Ближайший референт — группа не соблюдающих заповеди, и такое понимание поддерживается английским консультационным слоем; при этом форма греческого местоимения допускает формальную двусмысленность, отмеченную в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Диалог оформлен естественно; местоимения, относящиеся к Богу, написаны с прописной буквы по принятой русской религиозно-издательской норме. Номер сегмента сохранён.
