base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/001.yaml
  text: 1. “Fear,” he says, “the Lord, and keep his commandments. By keeping the commandments of God you will be powerful in every deed, and your conduct will be incomparable. For in fearing the Lord you will do everything well. This is the fear that you must have—and you will be saved.
translation:
  language: ru
  text: 1. «Бойся Господа, — говорит он, — и соблюдай Его заповеди. Итак, соблюдая Божьи заповеди, ты будешь силён во всяком деле, и то, что ты делаешь, не будет иметь себе равного. Ведь, боясь Господа, ты всё будешь делать хорошо. Вот тот страх, которого тебе следует бояться, — и ты спасёшься».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φοβήθητι / φοβούμενος / φόβος
  choice: «бойся / боясь / страх»
  rationale: Сохранена ключевая лексическая цепочка от корня φοβ-, важная для аргумента всего наставления; слово «страх» здесь не ослаблено до одного лишь «почтения».
- source_word: φύλασσε / φυλάσσων
  choice: «соблюдай / соблюдая»
  rationale: В контексте заповедей φύλασσω означает беречь их через исполнение; «соблюдать» естественно передаёт оба оттенка.
- source_word: δυνατὸς ἐν πάσῃ πράξει
  choice: «силён во всяком деле»
  rationale: Передаёт прямое значение δυνατός и сохраняет обобщённый характер πρᾶξις, не сужая его до отдельной способности.
- source_word: ἡ πρᾶξίς σου ἀσύγκριτος ἔσται
  choice: «то, что ты делаешь, не будет иметь себе равного»
  rationale: Естественно передаёт единственное число πρᾶξις и сильное значение ἀσύγκριτος, избегая неясного буквального оборота «твоя деятельность будет несравненной».
- source_word: πάντα καλῶς ἐργάσῃ
  choice: «ты всё будешь делать хорошо»
  rationale: Прямо и идиоматично передаёт πάντα и наречие καλῶς.
- source_word: ὃν δεῖ σε φοβηθῆναι
  choice: «какого страха тебе следует исполниться»
  rationale: Сохраняет повтор корня «страх», но устраняет неестественное по-русски буквальное «страх, которого следует бояться».
theological_decisions:
- issue: Связь страха Господня и спасения в καὶ σωθήσῃ
  choice: «— и ты спасёшься»
  alternative: «чтобы спастись»
  rationale: Сохранена греческая сочинительная конструкция и форма будущего времени без превращения высказывания в явно целевую или систематически-богословскую формулу.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Сохранены повелительный тон, повтор ключевых слов и прямая речь; архаизмы и конфессионально окрашенные уточнения не добавлялись.
