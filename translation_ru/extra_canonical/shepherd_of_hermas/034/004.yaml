base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/004.yaml
  text: '4. Therefore there are two fears: if you wish to do what is evil, fear the Lord and you will not do it; and if, on the other hand, you wish to do what is good, fear the Lord and you will do it. Thus the fear of the Lord is strong and great and glorious. So fear the Lord, and you will live to him; and all who fear him, among those who keep his commandments, will live to God.'
translation:
  language: ru
  text: '4. Итак, есть два вида страха: если хочешь сделать зло, бойся Господа — и не сделаешь его; если же, напротив, хочешь сделать добро, бойся Господа — и сделаешь его. Поэтому страх Господень силён, велик и славен. Итак, бойся Господа — и будешь жить для Него; и все боящиеся Его из числа соблюдающих Его заповеди будут жить для Бога.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δισσοὶ ... οἱ φόβοι
  choice: два вида страха
  rationale: По-русски это естественнее буквального «два страха» и передаёт различение двух проявлений страха Господня в зависимости от намерения человека.
- source_word: τὸ πονηρὸν ἐργάσασθαι
  choice: сделать зло
  rationale: Краткая и естественная передача инфинитивной конструкции без ослабления нравственного смысла.
- source_word: τὸ ἀγαθὸν ἐργάσασθαι
  choice: сделать добро
  rationale: Сохраняет прямую антитезу злу и деятельный оттенок глагола ἐργάζομαι.
- source_word: ὁ φόβος τοῦ Κυρίου
  choice: страх Господень
  rationale: Устоявшееся, dignified библейское выражение, понятное современному читателю.
- source_word: ἰσχυρός ... μέγας ... ἔνδοξος
  choice: силён, велик и славен
  rationale: Сохраняет трёхчастное усиление и прямые смысловые соответствия греческим прилагательным.
- source_word: ζήσῃ αὐτῷ
  choice: будешь жить для Него
  rationale: Передаёт дательный αὐτῷ как направленность жизни к Господу или посвящённость Ему, не отождествляя выражение с последующим τῷ Θεῷ.
- source_word: τῶν φυλασσόντων τὰς ἐντολὰς αὐτοῦ
  choice: из числа соблюдающих Его заповеди
  rationale: 'Сохраняет синтаксически неловкое, но значимое ограничение: речь идёт о боящихся Бога среди соблюдающих Его заповеди.'
theological_decisions:
- issue: Соотношение страха Господня, намерения и поступка
  choice: 'Сохранена причинно-практическая формулировка: страх Господа удерживает от зла и ведёт к добру.'
  alternative: Истолковать страх исключительно как благоговение или как боязнь наказания.
  rationale: Греческий текст не сводит φόβος к одному психологическому оттенку; перевод сохраняет его богословскую многозначность.
- issue: Значение ζήσῃ αὐτῷ и ζήσονται τῷ Θεῷ
  choice: «будешь жить для Него» и «будут жить для Бога»
  alternative: «будешь жить у Него» / «будут иметь жизнь у Бога» или «будешь жить Богом»
  rationale: Дательный допускает смысл направленности или отношения. Контекст следующего стиха разъясняет жизнь как находящуюся у Бога, однако здесь важно не вносить это разъяснение раньше текста и сохранить различие формулировок.
- issue: Ограничительная конструкция о боящихся и соблюдающих
  choice: «все боящиеся Его из числа соблюдающих Его заповеди»
  alternative: «все, кто боится Его и соблюдает Его заповеди»
  rationale: Выбранный вариант ближе к форме греческого текста и сохраняет напряжение, которое затем вызывает вопрос в следующем стихе.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Повторы «бойся Господа» и «сделаешь» сохранены как элементы наставительного ритма оригинала. Местоимения, относящиеся к Господу и Богу, написаны с прописной буквы согласно принятой русской религиозной издательской норме.
