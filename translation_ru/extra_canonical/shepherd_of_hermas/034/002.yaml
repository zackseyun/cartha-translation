  terminology: '«Господь», «дьявол», «сила», «страх» и «презираем» переданы последовательно. Не внесено конфессиональных пояснений к категорическому утверждению об отсутствии силы у дьявола. Сноски не требуются: текст не содержит спорного варианта, который следовало бы отмечать в переводе данного читательского сегмента.'
