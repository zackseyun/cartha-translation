base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/034/002.yaml
  text: 2. But do not fear the devil; for by fearing the Lord you will gain mastery over the devil, because there is no power in him. In one in whom there is no power, there is no fear; but in one in whom there is glorious power, there is also fear. For everyone who has power has fear, but the one who has no power is despised by all.
translation:
  language: ru
  text: '2. Дьявола же не бойся: боясь Господа, ты одолеешь дьявола, потому что в нём нет силы. А в ком нет силы, тот и страха не внушает; в ком же сила славна, тот внушает и страх. Ведь всякий, кто обладает силой, внушает страх, а не имеющий силы всеми презираем.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακυριεύσεις
  choice: ты одолеешь
  rationale: Передаёт значение решительного господства и превосходства над дьяволом естественным современным русским выражением.
- source_word: δύναμις
  choice: сила
  rationale: Сохраняет широкий смысл греческого слова — способность и могущество — без уточнения, отсутствующего в источнике.
- source_word: φόβος
  choice: страх / внушает страх
  rationale: В первой фразе обозначает переживаемый страх, а в безличных греческих оборотах естественно передаётся по-русски как способность внушать страх.
- source_word: ἔνδοξος
  choice: славна
  rationale: Формально сохраняет необычное определение силы как славной, не сводя его к более узким значениям «великая» или «достойная почтения».
- source_word: καταφρονεῖται
  choice: презираем
  rationale: Прямо передаёт значение пренебрежения и презрения.
theological_decisions:
- issue: Утверждение ὅτι δύναμις ἐν αὐτῷ οὐκ ἔστιν о дьяволе
  choice: потому что в нём нет силы
  alternative: потому что он бессилен
  rationale: Сохранена категоричность и буквальная структура источника без богословского смягчения или пояснения относительного характера этого бессилия.
- issue: Связь страха Господня с победой над дьяволом
  choice: боясь Господа, ты одолеешь дьявола
  alternative: страхом Господним ты подчинишь себе дьявола
  rationale: Передана причинно-средственная связь, при этом естественная русская формулировка не добавляет отдельного учения о механизме победы.
translation_notes:
  register: Современный литературный русский язык с наставительным, торжественным тоном. Повтор ключевых слов «сила» и «страх» сохранён как основа аргументации; синтаксис слегка перестроен ради ясности.
