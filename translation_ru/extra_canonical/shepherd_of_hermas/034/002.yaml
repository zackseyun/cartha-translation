  source_fidelity: 'Текст точно передаёт ход аргументации греческого оригинала: запрет бояться дьявола, обусловленное страхом Господа превосходство над ним, отсутствие у дьявола силы, а затем общую максиму о силе, страхе и презрении. «Ты одолеешь» несколько менее буквально, чем «будешь госпствовать над / возьмёшь верх над», но в данном контексте надёжно передаёт κατακυριεύσεις без добавления смысла.'
