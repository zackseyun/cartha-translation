  text: 2. Afterward I saw a vision in my house. The old woman came and asked me whether I had already given the book to the elders. I denied having given it. “You have done well,” she says; “for I have words to add. When, therefore, I complete all the words, through you they will be made known to all the elect.
translation:
  language: ru
  text: 2. После этого я увидел видение у себя дома. Пришла та пожилая женщина и спросила меня, отдал ли я уже книгу пресвитерам. Я ответил, что не отдавал. «Хорошо ты сделал, — сказала она, — потому что мне ещё нужно добавить некоторые слова. Когда же я завершу все слова, через тебя это станет известно всем избранным».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ πρεσβυτέρα
  choice: та пожилая женщина
  rationale: Сохраняет связь с ранее упомянутой женщиной и передаёт возрастное значение субстантивированного сравнительного прилагательного; слово «старица» в современном русском может вызывать нежелательные монашеско-духовнические ассоциации.
- source_word: τὸ βιβλίον
  choice: книгу
  rationale: Обычное и естественное обозначение письменного свитка или книги; в данном абзаце форма отличается от уменьшительного βιβλαρίδιον следующего стиха.
- source_word: τοῖς πρεσβυτέροις
  choice: пресвитерам
  rationale: Контекст указывает на руководителей церкви, а не просто пожилых людей; транслитерация сохраняет раннехристианский служебный термин без привнесения позднейшей конфессиональной структуры.
- source_word: ἔχω γὰρ ῥήματα προσθεῖναι
  choice: потому что мне ещё нужно добавить некоторые слова
  rationale: Передаёт наличие дальнейшего содержания для добавления естественным русским языком; «слова» сохраняет буквальный образ ῥήματα.
- source_word: ὅταν οὖν ἀποτελέσω τὰ ῥήματα πάντα
  choice: Когда же я завершу всё, что должна сказать
  rationale: Греческое выражение буквально говорит о завершении всех слов; выбранная формулировка естественна по-русски и не предполагает, что речь лишь о механическом дописывании текста.
- source_word: τοῖς ἐκλεκτοῖς πᾶσιν
  choice: всем избранным
  rationale: Прямо сохраняет раннехристианское обозначение адресатов и не уточняет сверх текста, кем или к чему они избраны.
theological_decisions:
- issue: Значение «избранных»
  choice: всем избранным
  alternative: всем избранным Богом
  rationale: В греческом тексте действующее лицо избрания не названо; перевод сохраняет эту недосказанность и не добавляет явного субъекта.
- issue: Статус пресвитеров
  choice: пресвитерам
  alternative: старейшинам
  rationale: В заключении раздела те же πρεσβύτεροι описаны как возглавляющие церковь, поэтому служебное значение вероятнее; при этом термин не конкретизируется через позднейшие названия церковных должностей.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Прямая речь оформлена естественно; сохранены простота рассказа, переход от видения к диалогу и неопределённость выражения «избранные».
