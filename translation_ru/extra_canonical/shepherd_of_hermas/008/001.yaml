base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/008/001.yaml
  text: 'And it was revealed to me, brothers, while I was asleep, by a very handsome young man who said to me: “The old woman, from whom you received the little book—who do you think she is?” I said, “The Sibyl.” “You are mistaken,” he says; “she is not.” “Then who is she?” I say. “The Church,” he says. I said to him, “Why then is she old?” “Because,” he says, “she was created first of all; for this reason she is old, and for her sake the world was formed.”'
translation:
  language: ru
  text: 'Братья, когда я спал, мне было откровение от юноши дивной красоты, который сказал мне: «Как ты думаешь, кто эта старица, от которой ты получил книжицу?» Я отвечаю: «Сивилла». Он говорит: «Ты заблуждаешься: это не она». «Кто же она?» — спрашиваю я. Он говорит: «Церковь». Я спросил его: «Почему же она старица?» Он говорит: «Потому что она была сотворена первой из всего. Поэтому она и старица, и ради неё был устроен мир».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδελφοί
  choice: братья
  rationale: Прямое и естественное обращение, соответствующее форме мужского множественного числа в греческом тексте.
- source_word: κοιμωμένῳ
  choice: во сне
  rationale: По контексту откровение происходит во время сна; такая передача естественнее буквального «когда я спал» и не меняет смысла.
- source_word: νεανίσκου εὐειδεστάτου
  choice: прекрасный юноша
  rationale: Передаёт превосходную степень εὐειδεστάτου без тяжеловесного «юноша весьма прекрасной наружности».
- source_word: πρεσβυτέραν
  choice: старица
  rationale: Сохраняет образ пожилой женщины и последующую игру с её древностью; «старшая» здесь было бы менее ясно.
- source_word: βιβλίδιον
  choice: книжицу
  rationale: Передаёт уменьшительную форму греческого слова, не уточняя жанр или объём текста.
- source_word: Σίβυλλαν
  choice: Сивилла
  rationale: Устоявшаяся русская форма имени прорицательницы античной традиции.
- source_word: Ἐκκλησία
  choice: Церковь
  rationale: Передаёт персонифицированную Ἐκκλησία; прописная буква указывает на названную фигуру, не устраняя её символического характера.
- source_word: πάντων πρώτη ἐκτίσθη
  choice: была сотворена прежде всего
  rationale: Сохраняет утверждение о первенстве сотворения и пассивную форму ἐκτίσθη.
- source_word: ὁ κόσμος κατηρτίσθη
  choice: был устроен мир
  rationale: Καταρτίζω здесь означает приведение в порядок, устроение или формирование; «устроен» сохраняет это значение без чрезмерной конкретизации.
theological_decisions:
- issue: Предсуществование Церкви
  choice: «она была сотворена прежде всего»
  alternative: «она была создана первой из всего»
  rationale: Сохранено прямое утверждение источника о первенстве Церкви среди сотворённого без попытки согласовать его с позднейшими экклезиологическими системами.
- issue: Цель или основание устроения мира
  choice: «ради неё был устроен мир»
  alternative: «из-за неё был создан мир»
  rationale: «Ради неё» естественно передаёт διὰ ταύτην и сохраняет целевую либо причинно-мотивирующую смысловую напряжённость, не сводя выражение к грубой причинности.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского повествования. Диалог передан живо, с допустимым в русском историческим настоящим («отвечаю», «говорит»), отражающим греческое φημί/φησίν. Переведён только reader_segment 1, то есть первый пронумерованный абзац исходного раздела.
