revisions:
- from: 'И открылось мне, братья, во сне: прекрасный юноша сказал мне: «Как ты думаешь, кто эта старица, от которой ты получил книжицу?» Я отвечаю: «Сивилла». Он говорит: «Ты заблуждаешься; это не она». «Кто же она?» — спрашиваю я. Он говорит: «Церковь». Я спросил его: «Почему же она старица?» Он говорит: «Потому что она была сотворена прежде всего. Поэтому она и старица, и ради неё был устроен мир».'
  to: 'Братья, когда я спал, мне было откровение от юноши дивной красоты, который сказал мне: «Как ты думаешь, кто эта старица, от которой ты получил книжицу?» Я отвечаю: «Сивилла». Он говорит: «Ты заблуждаешься: это не она». «Кто же она?» — спрашиваю я. Он говорит: «Церковь». Я спросил его: «Почему же она старица?» Он говорит: «Потому что она была сотворена первой из всего. Поэтому она и старица, и ради неё был устроен мир».'
  rationale: Исправлена только формулировка, необходимая для ясной передачи агента откровения и превосходной степени в описании юноши; «первой из всего» устраняет русскую двусмысленность. Содержание, образный строй и богословская неоднозначность διὰ ταύτην сохранены.
