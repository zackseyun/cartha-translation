  text: 3. “So you will write two little booklets, and you will send one to Clement and one to Grapte. Then Clement will send it to the cities outside, for this has been entrusted to him; but Grapte will admonish the widows and the orphans. But you will read it aloud in this city with the elders who preside over the church.”
translation:
  language: ru
  text: 3. Итак, ты напишешь две небольшие книги и пошлёшь одну Клименту, а другую — Грапте. Климент пошлёт её в города за пределами этого города, потому что это поручено ему; Грапта же будет наставлять вдов и сирот. А ты прочтёшь её вслух в этом городе вместе с пресвитерами, возглавляющими церковь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δύο βιβλαρίδια
  choice: две небольшие книги
  rationale: Уменьшительная форма βιβλαρίδια обозначает небольшие письменные свитки или книги; «небольшие книги» естественно по-русски и не вносит современного оттенка слова «буклет».
- source_word: τὰς ἔξω πόλεις
  choice: другие города
  rationale: Буквально «внешние города», то есть города за пределами данного города; «другие города» ясно передаёт контекст без неестественного буквализма.
- source_word: νουθετήσει
  choice: будет наставлять
  rationale: Глагол включает увещание, вразумление и наставление; нейтральное «наставлять» сохраняет пастырский смысл.
- source_word: ἀναγνωσῇ
  choice: прочитаешь
  rationale: В контексте обращения к общине речь идёт о публичном чтении; русский глагол вместе с обстоятельством места естественно передаёт это действие.
- source_word: πρεσβυτέρων
  choice: пресвитерами
  rationale: Сохраняется раннехристианский термин для общинных руководителей, отличимый от сравнительного значения «старшие».
- source_word: τῶν προϊσταμένων
  choice: возглавляющими
  rationale: Причастие означает стоящих во главе, руководящих или заботящихся; «возглавляющими» передаёт управленческую функцию без добавления поздней церковной титулатуры.
theological_decisions:
- issue: Роль пресвитеров в общине
  choice: «пресвитерами, возглавляющими церковь»
  alternative: «старейшинами, предстоящими перед церковью»
  rationale: Выбранная формулировка прямо передаёт πρεσβύτεροι и προΐστημι, не уточняя сверх текста устройство церковной власти.
- issue: Распределение экземпляров
  choice: «Климент пошлёт свою… А ты прочитаешь свою»
  alternative: «Климент пошлёт её… А ты прочитаешь»
  rationale: Притяжательные слова проясняют подразумеваемые экземпляры двух книг, не изменяя содержания; греческий текст допускает такое естественное восполнение.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Синтаксис сохранён последовательным и распорядительным; имена переданы как Климент и Грапта. Архаизмы и поздняя конфессиональная терминология не добавлялись.
