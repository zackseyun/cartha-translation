  to: 3. Итак, ты напишешь две небольшие книги и пошлёшь одну Клименту, а другую — Грапте. Климент пошлёт её в города за пределами этого города, потому что это поручено ему; Грапта же будет наставлять вдов и сирот. А ты прочтёшь её вслух в этом городе вместе с пресвитерами, возглавляющими церковь.
