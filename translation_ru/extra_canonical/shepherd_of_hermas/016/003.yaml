base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/003.yaml
  text: Hear their functions. The first of them, the one clasping her hands, is called Faith; through her the chosen of God are saved. And the second, the one girded about and acting bravely, is called Self-control; she is the daughter of Faith. Whoever, then, follows her becomes blessed in his life, because he will refrain from all evil works, believing that if he refrains from every evil desire he will inherit eternal life.”
translation:
  language: ru
  text: Послушай теперь об их делах. Первая из них, та, что со сцепленными руками, зовётся Верой; через неё спасаются избранные Божьи. Вторая, та, что подпоясана и ведёт себя мужественно, зовётся Воздержанием; она — дочь Веры. Поэтому тот, кто следует за ней, становится блаженным в своей жизни, потому что воздержится от всех злых дел, веря, что, если воздержится от всякого злого желания, унаследует вечную жизнь».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνεργείας
  choice: как они действуют
  rationale: Передаёт не отвлечённые «функции», а проявление и действие олицетворённых добродетелей естественным современным русским языком.
- source_word: κρατοῦσα τὰς χεῖρας
  choice: держит руки сцепленными
  rationale: Сохраняет зрительный образ позы женщины, не уточняя сверх греческого текста, чьи именно руки она держит.
- source_word: Πίστις
  choice: Вера
  rationale: Олицетворённая добродетель передана с прописной буквы.
- source_word: περιεζωσμένη καὶ ἀνδριζομένη
  choice: подпоясана и держится мужественно
  rationale: Сохраняет как внешний признак готовности к действию, так и значение смелого, решительного поведения.
- source_word: Ἐγκράτεια
  choice: Воздержание
  rationale: В данном контексте подчёркнуто отрешение от злых дел и желаний; «Воздержание» точнее отражает эту сторону значения, чем более общее «Самообладание».
- source_word: μακάριος
  choice: блаженным
  rationale: Сохраняет религиозно-нравственный оттенок состояния благословенности, оставаясь понятным в литературном русском.
- source_word: ἀφέξεται
  choice: будет воздерживаться / воздержится
  rationale: Одинаковый греческий глагол передан однокоренными формами, чтобы сохранить связь между отказом от злых дел и злого желания.
theological_decisions:
- issue: Спасение избранных через олицетворённую Веру
  choice: «через неё спасаются избранные Божьи»
  alternative: «благодаря ей спасаются Божьи избранники»
  rationale: Буквально сохраняет посредническую конструкцию διὰ ταύτης и не поясняет её в терминах какой-либо конфессиональной системы.
- issue: Условная связь между воздержанием и наследованием вечной жизни
  choice: «если воздержится от всякого злого желания, унаследует вечную жизнь»
  alternative: Перефразировать как свидетельство уже полученного спасения
  rationale: Сохраняет явную условную формулировку источника и её богословское напряжение, не разрешая его посредством привнесённого толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной раннехристианской лексикой. Имена олицетворённых добродетелей даны с прописной буквы. Явное νῦν передано словом «Теперь».
