  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/002.yaml
  text: Looking at me, she smiled and says to me, “Do you see seven women around the tower?” “I do, lady,” I said. “This tower is supported by these women at the Lord’s command.
translation:
  language: ru
  text: 'Она посмотрела на меня, слегка улыбнулась и сказала: «Видишь семь женщин вокруг башни?» — «Вижу, госпожа», — ответил я. «Эти женщины поддерживают башню по повелению Господа».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψασά μοι
  choice: посмотрела на меня
  rationale: Передаёт направленный взгляд естественным современным русским выражением.
- source_word: ὑπεμειδίασεν
  choice: слегка улыбнулась
  rationale: Приставка ὑπο- указывает на лёгкую, едва заметную улыбку.
- source_word: κυρία
  choice: госпожа
  rationale: Уважительное обращение к женщине; сохраняет исторический и литературный регистр без архаического «госпожа моя».
- source_word: βαστάζεται
  choice: поддерживают
  rationale: В контексте башни глагол означает, что женщины служат ей опорой; активная русская конструкция ясна и сохраняет смысл греческого пассива.
- source_word: κατ’ ἐπιταγὴν τοῦ Κυρίου
  choice: по повелению Господа
  rationale: Точно передаёт властное распоряжение, выраженное словом ἐπιταγή.
theological_decisions:
- issue: Роль семи женщин по отношению к башне
  choice: «поддерживают башню»
  alternative: «несут башню»
  rationale: «Поддерживают» сохраняет образ опоры и не уточняет сверх текста, держат ли они башню на себе или обеспечивают её устойчивость.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Историческое настоящее λέγει передано прошедшим временем ради естественной русской повествовательной последовательности; прямой диалог и уважительное обращение сохранены.
