base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/006.yaml
  text: And I kept asking her about the times—whether it is already the end. But she cried out with a loud voice, saying, “Senseless man, do you not see that the tower is still being built? Whenever, then, the tower is completed in its building, it comes to an end. But it will be built up quickly. Do not question me any further; this reminder and the renewal of your spirits are enough for you and for the holy ones.
translation:
  language: ru
  text: 'И я стал расспрашивать её о сроках: не настал ли уже конец. Но она громко воскликнула: «Неразумный человек! Разве ты не видишь, что башня всё ещё строится? Когда строительство башни завершится, ей придёт конец. Но её скоро достроят. Больше ни о чём меня не спрашивай. Для тебя и для святых довольно этого напоминания и обновления ваших духов».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καιρῶν
  choice: сроках
  rationale: В контексте вопроса о завершении строительства и наступлении конца речь идёт об определённых временах или сроках; «сроках» естественно передаёт этот смысл по-русски.
- source_word: συντέλεια
  choice: конец
  rationale: Сохраняет эсхатологическую ёмкость слова, не уточняя сверх текста, конец ли это века, мира или процесса.
- source_word: Ἀσύνετε
  choice: Неразумный
  rationale: Передаёт упрёк в недостатке понимания, не усиливая его до оскорбительного «глупец».
- source_word: ἐποικοδομηθήσεται
  choice: будет достроена
  rationale: В данном образе обозначает скорое продолжение строительства до завершения; русское «достроена» ясно выражает это без тяжеловесного калькирования.
- source_word: ὑπόμνησις
  choice: напоминания
  rationale: Прямо передаёт напоминание или наставительное напоминание и соответствует ближайшему контексту.
- source_word: ἀνακαίνωσις τῶν πνευμάτων ὑμῶν
  choice: обновления ваших духов
  rationale: Сохраняет множественное число πνευμάτων и не сводит выражение к психологическому «духовному обновлению».
theological_decisions:
- issue: Значение «конца» в вопросе о συντέλεια
  choice: Не уточнять объект конца
  alternative: «конец века» или «конец мира»
  rationale: Греческий текст здесь не называет объект; перевод сохраняет подлинную эсхатологическую неоднозначность.
- issue: Связь окончания строительства башни и наступления конца
  choice: «Когда строительство башни завершится, тогда и наступит конец»
  alternative: «Когда башня будет окончательно построена, она достигнет своего завершения»
  rationale: Контекст вопроса о сроках и συντέλεια поддерживает эсхатологическое прочтение, однако перевод не добавляет конфессиональной схемы событий.
- issue: πνευμάτων во множественном числе
  choice: «ваших духов»
  alternative: «вашего духа» или «вашего духовного состояния»
  rationale: Формально сохраняется множественное число оригинала и его антропологическая открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Реплика женщины звучит строго и непосредственно; синтаксис упрощён там, где буквальная греческая конструкция была бы неестественна, но повторы образа строительства и богословская неоднозначность сохранены.
