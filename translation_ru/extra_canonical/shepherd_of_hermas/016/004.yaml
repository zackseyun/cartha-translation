base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/004.yaml
  text: “But the others, lady, who are they?” “They are daughters of one another. And they are called Simplicity, Knowledge, Innocence, Dignity, and Love. Whenever, then, you do all the works of their mother, you are able to live.”
translation:
  language: ru
  text: '— А остальные, госпожа, кто они?


    — Они — дочери одна другой. Их зовут Простота, Знание, Незлобие, Достоинство и Любовь. Итак, когда исполнишь все дела их матери, сможешь жить.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἁπλότης
  choice: Простота
  rationale: Передаёт прямоту и цельность без добавления идеи наивности.
- source_word: Ἐπιστήμη
  choice: Знание
  rationale: Обычное и точное обозначение знания как добродетели в данном перечне.
- source_word: Ἀκακία
  choice: Незлобие
  rationale: Сохраняет значение отсутствия зла и злого умысла; «невинность» могла бы сузить смысл.
- source_word: Σεμνότης
  choice: Благородство
  rationale: Передаёт нравственную достойность и возвышенную серьёзность; буквальное «достоинство» в современном русском звучало бы более отвлечённо.
- source_word: Ἀγάπη
  choice: Любовь
  rationale: Естественный и традиционный эквивалент без внесения конфессиональной терминологии.
- source_word: δύνασαι ζῆσαι
  choice: сможешь жить
  rationale: Сохраняет краткость и открытую эсхатологическую глубину греческой формулы, не добавляя отсутствующего здесь определения «вечной».
theological_decisions:
- issue: Образ родства добродетелей
  choice: «дочери одна другой» и «их матери» сохранены буквально
  alternative: Пояснить последовательность происхождения добродетелей или прямо назвать их мать
  rationale: Источник намеренно использует олицетворение и раскрывает цепь происхождения далее; добавленное пояснение преждевременно сняло бы образную неоднозначность.
translation_notes:
  register: Современный литературный русский с ясным, достойным диалогическим строем. Имена олицетворённых добродетелей написаны с прописной буквы.
