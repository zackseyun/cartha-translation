revisions:
- from: Но это было открыто не тебе одному, а для того, чтобы ты сообщил всё это всем. Через три дня — ведь сначала тебе нужно это осмыслить — передай[a] святым слова, которые Я собираюсь сказать тебе; это Я прежде всего повелеваю тебе, Ерм. Пусть они услышат их и исполнят, чтобы очиститься от своих пороков, а вместе с ними — и ты».
  to: Но это было открыто не тебе одному, а чтобы ты возвестил всё это всем. Через три дня — ведь тебе прежде нужно понять это — я повелеваю тебе, Ерм, возвестить[a] всем святым слова, которые я собираюсь сказать тебе, чтобы они, услышав и исполнив их, очистились от своих злых дел, и ты вместе с ними».
  rationale: 'Редакция возвращает греческую структуру: откровение дано Ерму для возвещения всем; затем ему велено, после трёх дней и предварительного понимания, возвестить святым слова, которые говорящая намерена сообщить. Сохранены «святые», практическое исполнение услышанного и очищение; добавлена передача сомнительного «все» с ясной сноской.'
