    issue: Нарушен порядок и связь повеления в ст. 11.
    rationale: Греческое поручение охватывает «слова, которые я собираюсь сказать тебе» и затем велит через три дня возвестить их святым. В черновике «передай» поставлено раньше этих слов, а фраза «это Я прежде всего повелеваю тебе» разрывает конструкцию.
  - severity: medium
    issue: Не передано «всё» в поручении возвестить слова.
    rationale: Чтение πάντα заключено в квадратные скобки и потому текстологически не вполне надёжно, но его следует отразить с оговоркой в сноске, а не опускать без следа.
  - severity: low
    issue: Необоснованная прописная буква в «Я».
    rationale: В русской прямой речи прописное «Я» не является нейтральной нормой и может создать богословски значимое отождествление, которого греческий текст не делает.
