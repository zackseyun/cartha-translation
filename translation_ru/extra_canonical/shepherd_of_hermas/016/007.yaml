  source_fidelity: Нужна правка синтаксиса заключительного повеления. В греческом «через три дня» относится к поручению возвестить слова, а слова, которые говорящая ещё намерена сообщить, должны быть возвещены «всем святым». Черновик переставляет эти элементы и не передаёт πάνта («всё/все»), отмеченное в издании как сомнительное.
  naturalness: Предлагаемая редакция сохраняет торжественный, но современный литературный русский синтаксис. «Возвестить всем святым» естественно передаёт образ εἰς τὰ ὦτα τῶν ἁγίων без неуклюжей буквальности.
  terminology: '«Святые» сохранено как собственное обозначение общины. «Злые дела» точнее передаёт πονηρίαι в данном нравственно-наставительном контексте, чем психологизированное «пороки». Прописное «Я» не оправдано: говорящая в данном эпизоде не отождествлена текстом с Богом.'
  issues:
