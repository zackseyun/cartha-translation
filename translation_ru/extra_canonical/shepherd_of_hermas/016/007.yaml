base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/007.yaml
  text: But it was not revealed to you alone, but so that you may make them known to all. After three days—for first you must understand, and I first command you, Hermas, the words I am about to say to you—speak them all into the ears of the holy ones, so that, after hearing them and doing them, they may be cleansed from their evils, and you also with them.”
translation:
  language: ru
  text: Но это было открыто не тебе одному, а чтобы ты возвестил всё это всем. Через три дня — ведь тебе прежде нужно понять это — я повелеваю тебе, Ерм, возвестить[a] всем святым слова, которые я собираюсь сказать тебе, чтобы они, услышав и исполнив их, очистились от своих злых дел, и ты вместе с ними».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст при глаголе «возвестить» текстологически сомнителен; слово «всем» в выражении «всем святым» передаёт чтение «все», заключённое в издании в квадратные скобки.
    reason: В издании λαλῆσαι отмечено крестами, а πάντα дано как сомнительное добавление; сноска сохраняет эту двойную текстологическую неопределённость.
lexical_decisions:
- source_word: δηλώσῃς
  choice: сообщил
  rationale: Передаёт значение «сделать известным, объявить» естественным современным русским языком.
- source_word: νοῆσαι
  choice: осмыслить
  rationale: Здесь требуется не просто услышать, а понять и усвоить содержание перед его оглашением.
- source_word: εἰς τὰ ὦτα τῶν ἁγίων
  choice: святым
  rationale: Греческий образ буквально означает «в уши святых», но по-русски естественный смысл — непосредственно передать или огласить им слова.
- source_word: ποιήσαντες
  choice: исполнят
  rationale: В контексте наставлений означает осуществить услышанное на деле, а не просто «сделать».
- source_word: πονηριῶν
  choice: пороков
  rationale: Сохраняет нравственный смысл множественного числа и лучше подходит к очищению, чем абстрактное «зло».
theological_decisions:
- issue: Кого обозначают «святые»
  choice: святым
  alternative: верующим
  rationale: Сохранено собственное обозначение текста без конфессионального уточнения состава общины.
- issue: Связь очищения со слушанием и исполнением
  choice: «услышат их и исполнят, чтобы очиститься»
  alternative: «услышав и исполнив, очистятся»
  rationale: Сохранена выраженная в греческом тексте связь практического послушания с очищением без добавления объяснения механизма или учения о спасении.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Перестановка частей сложной греческой фразы делает речь понятной, не устраняя её временную последовательность и повелительный характер. Прописное «Я» обозначает говорящую в прямой речи по принятой русской издательской норме, без отождествления её с Богом.
