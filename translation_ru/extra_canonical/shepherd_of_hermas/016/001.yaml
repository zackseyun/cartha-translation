base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/001.yaml
  text: When, then, I had stopped questioning her about all these things, she says to me, “Do you want to see something else?” And because I was eager to behold it, I became very glad to see.
translation:
  language: ru
  text: 'Когда я перестал расспрашивать её обо всём этом, она сказала мне: «Хочешь увидеть ещё кое-что?» Мне очень хотелось это увидеть, и я чрезвычайно обрадовался возможности увидеть это.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπαυσάμην ἐρωτῶν
  choice: перестал расспрашивать
  rationale: Передаёт прекращение продолжавшихся расспросов; «расспрашивать» естественно выражает повторные вопросы о многих предметах.
- source_word: ἄλλο
  choice: ещё что-нибудь
  rationale: В вопросе означает не просто «другое», а нечто дополнительное к уже показанному.
- source_word: κατεπίθυμος
  choice: очень хотелось
  rationale: Передаёт усиленное желание без тяжеловесного буквального оборота «будучи страстно желающим».
- source_word: περιχαρής
  choice: чрезвычайно обрадовался
  rationale: Сохраняет усилительное значение слова — очень большую радость.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Историческое настоящее λέγει передано прошедшим временем как естественное для русского рассказа. Повтор греческих глаголов со значением «видеть/созерцать» слегка сглажен, поскольку буквальное воспроизведение было бы неестественно и не добавляло бы смыслового различия.
