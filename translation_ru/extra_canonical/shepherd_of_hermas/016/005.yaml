base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/016/005.yaml
  text: '“I wanted,” I said, “to know, lady, what power each of them has.” “Hear,” she says, “the powers they have. Their powers are held together by one another, and they follow one another, just as they were born: from Faith is born Self-control, from Self-control Simplicity, from Simplicity Innocence, from Innocence Dignity, from Dignity Knowledge, and from Knowledge Love. So, then, the works of these are pure and dignified and divine. Whoever, then, serves these and proves able to hold fast to their works will have his dwelling in the tower with the holy ones of God.”'
translation:
  language: ru
  text: '«Я хотел узнать, госпожа, — сказал я, — какой силой обладает каждая из них». Она говорит: «Послушай, какими силами они обладают. Их силы поддерживаются одна другой и следуют одна за другой, как и были рождены: от Веры рождается Воздержание, от Воздержания — Простота, от Простоты — Незлобие, от Незлобия — Достоинство, от Достоинства — Знание, а от Знания — Любовь. Итак, дела их чисты, благопристойны и божественны. Поэтому тот, кто будет служить им и сумеет овладеть их делами, будет иметь жилище в башне вместе со святыми Божьими».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δύναμις
  choice: сила
  rationale: Сохраняет повтор ключевого слова и передаёт способность или действенную силу каждой олицетворённой добродетели.
- source_word: κρατοῦνται ... ὑπ᾽ ἀλλήλων
  choice: поддерживают одна другую
  rationale: Передаёт взаимную связь и опору сил; буквальное «удерживаются друг другом» по-русски звучало бы неестественно.
- source_word: Ἐγκράτεια
  choice: Воздержание
  rationale: Обозначает самообладание и отказ от дурных желаний; согласуется с объяснением этой добродетели в предшествующем контексте.
- source_word: Ἁπλότης
  choice: Простота
  rationale: Сохраняет обычное для раннехристианской нравственной лексики значение цельности и искренней простоты.
- source_word: Ἀκακία
  choice: Незлобие
  rationale: Точнее, чем «невинность», выражает отсутствие злобы и причинения зла, не смешиваясь с предыдущей «Простотой».
- source_word: Σεμνότης
  choice: Достоинство
  rationale: Передаёт нравственную серьёзность, почтенность и достойное поведение без добавления узкоконфессионального оттенка.
- source_word: Ἐπιστήμη
  choice: Знание
  rationale: Прямой и понятный эквивалент в перечне олицетворённых добродетелей.
- source_word: Ἀγάπη
  choice: Любовь
  rationale: Стандартно передаёт ἀγάπη без искусственного уточнения её вида.
- source_word: κατοίκησις
  choice: поселится
  rationale: Естественно передаёт обещание получить место обитания в башне.
theological_decisions:
- issue: Связь спасения, служения добродетелям и обитания в башне
  choice: 'Сохранена прямая условная формулировка: «кто будет служить им и сумеет твёрдо держаться их дел, поселится...»'
  alternative: Ослабить условность, представив дела лишь как свидетельство уже имеющегося спасения
  rationale: Греческий текст прямо связывает служение этим добродетелям и верность их делам с будущим обитанием в башне; перевод не должен заранее разрешать богословское напряжение.
- issue: Образ рождения добродетелей
  choice: Сохранена последовательность «от ... рождается ...»
  alternative: 'Передать как логическое развитие качеств: «вера ведёт к воздержанию»'
  rationale: Автор персонифицирует добродетели как дочерей, поэтому образ рождения является содержательно значимым.
translation_notes:
  register: Современный литературный русский с умеренно торжественным, раннехристианскому видению соответствующим строем. Названия семи олицетворённых добродетелей написаны с прописной буквы. Реплики оформлены естественно для русской прямой речи; повторы исходника по возможности сохранены.
