base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/041/001.yaml
  text: 'He says to me: “Remove from yourself every evil desire, but clothe yourself with the desire that is good and dignified; for when you are clothed with this desire, you will hate the evil desire and you will bridle it as you wish.'
translation:
  language: ru
  text: 'Он говорит мне: «Удали от себя всякое злое желание, а облекись в доброе и достойное желание. Ведь, облекшись в это желание, ты возненавидишь злое желание и будешь обуздывать его, как захочешь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἆρον ἀπὸ σεαυτοῦ
  choice: Удали от себя
  rationale: Передаёт повеление буквально и естественно по-русски, сохраняя образ решительного устранения.
- source_word: ἐπιθυμίαν πονηράν
  choice: злое желание
  rationale: «Желание» сохраняет широкое значение ἐπιθυμία и не сужает его до похоти; «злое» прямо передаёт πονηράν.
- source_word: ἔνδυσαι
  choice: облекись
  rationale: Сохраняет центральную метафору надевания одежды, продолженную причастием ἐνδεδυμένος.
- source_word: ἀγαθὴν καὶ σεμνήν
  choice: доброе и благородное
  rationale: «Доброе» передаёт нравственную положительность ἀγαθήν, а «благородное» — достойный, почтенный характер σεμνήν без излишне церковного оттенка.
- source_word: χαλιναγωγήσεις
  choice: будешь обуздывать
  rationale: Точно сохраняет метафору управления при помощи узды.
- source_word: καθὼς βούλει
  choice: как захочешь
  rationale: Сохраняет заявленную степень власти над злым желанием и не ослабляет её толкованием.
theological_decisions:
- issue: Соотношение доброго и злого желания
  choice: 'Сохранена образная последовательность: облечься в доброе желание, возненавидеть злое и обуздывать его.'
  alternative: Передать как полное искоренение злого желания.
  rationale: Греческий текст говорит об удалении, ненависти и последующем обуздании; эту напряжённость не следует устранять богословским упрощением.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Архаизирующее «облекись» сохранено как ясный и устойчивый библейский образ; остальная фраза сформулирована естественно для современного читателя.
