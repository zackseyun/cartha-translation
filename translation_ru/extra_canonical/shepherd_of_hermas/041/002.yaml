base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/041/002.yaml
  text: '2. “For evil desire is wild and is hard to tame; for it is fearsome, and by its savagery it greatly consumes people—especially if a servant of God falls into it and is not sensible, he is grievously consumed by it. It consumes such people: those who do not have the garment of good desire, but are entangled with this age. These, therefore, it hands over to death.”'
translation:
  language: ru
  text: 2. Ведь злое желание дико, и его трудно укротить. Оно внушает страх и своей свирепостью жестоко истощает людей. Особенно если раб Божий попадёт под его власть и не будет благоразумен, оно тяжко истощит его. Оно истощает таких людей — тех, кто не имеет одеяния доброго желания, но смешался с этим веком. Таких оно и предаёт смерти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμία ἡ πονηρά
  choice: злое желание
  rationale: Сохраняет устойчивую антитезу со «добрым желанием» в контексте и передаёт нравственно отрицательную направленность ἐπιθυμία без неоправданного сужения до одной конкретной страсти.
- source_word: ἀγρία / ἀγριότητι
  choice: дико / свирепостью
  rationale: Передаёт образ необузданного, опасного зверя и поддерживает последующий глагол «укротить».
- source_word: δαπανᾷ / δαπανᾶται
  choice: губит / причинит ему страшный вред
  rationale: Глагол буквально означает «истощать, растрачивать, пожирать». В русском контексте «губит» естественно выражает разрушительное действие; в среднем/страдательном обороте использована идиоматичная формулировка, не отождествляющая его заранее со смертью, которая прямо названа далее.
- source_word: ἐμπέσῃ εἰς αὐτήν
  choice: поддастся ему
  rationale: Греческий оборот буквально допускает «впадёт в него»; выбран естественный русский эквивалент, обозначающий попадание под власть желания.
- source_word: μὴ ᾖ συνετός
  choice: не будет благоразумен
  rationale: Передаёт отсутствие рассудительности и нравственной осмотрительности, не сводя значение к интеллектуальной способности.
- source_word: ἔνδυμα τῆς ἐπιθυμίας τῆς ἀγαθῆς
  choice: облачён в доброе желание
  rationale: Сохраняет образ одежды из предыдущего стиха («облекись»), избегая тяжеловесного буквального «не имеющих одежды доброго желания».
- source_word: ἐμπεφυρμένους τῷ αἰῶνι τούτῳ
  choice: смешался с нынешним веком
  rationale: Сохраняет сильный и несколько необычный образ смешения/запутанности с настоящим миропорядком; «нынешний век» соответствует раннехристианскому употреблению αἰών.
- source_word: παραδίδωσιν εἰς θάνατον
  choice: предаёт смерти
  rationale: Формально и естественно передаёт передачу во власть смерти, не уточняя вид смерти сверх текста.
theological_decisions:
- issue: Значение «смерти» в заключительной фразе
  choice: 'Оставлено без уточнения: «предаёт смерти»'
  alternative: «ведёт к духовной смерти» или «обрекает на вечную смерть»
  rationale: Греческий текст не определяет, физическая, духовная или эсхатологическая смерть имеется в виду; богословская напряжённость сохранена.
- issue: Обозначение πισующего как δοῦλος Θεοῦ
  choice: «раб Божий»
  alternative: «слуга Бога»
  rationale: «Раб Божий» точно передаёт δοῦλος и остаётся понятным, традиционно укоренённым выражением в русском христианском регистре без привнесения конфессиональной специфики.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Сохранены олицетворение злого желания, образ укрощения зверя, мотив облачения и выражение «нынешний век». Синтаксис умеренно упрощён для ясности, без устранения смысловой неоднозначности.
