base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/041/003.yaml
  text: 3. “What deeds of evil desire,” I say, “hand people over to death, sir? Make them known to me, so that I may keep away from them.” “Listen,” [he says,] “by what deeds evil desire puts the servants of God to death.”
translation:
  language: ru
  text: 3. «Какие дела злого желания, господин, — спрашиваю я, — обрекают людей на смерть? Объясни мне это, чтобы я избегал их». — «Слушай[a], какими делами злое желание убивает рабов Божьих».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте после слова «Слушай» в квадратных скобках стоит «говорит он»; слова считаются текстуально не вполне удостоверенными и не включены в перевод.
    reason: Передаёт редакционную неопределённость вокруг φησίν, не вставляя в русский текст неуверенное слово.
lexical_decisions:
- source_word: ἐπιθυμία ἡ πονηρά
  choice: злое желание
  rationale: Передаёт устойчивое выражение буквально и естественно, сохраняя персонификацию желания в контексте.
- source_word: ἔργα
  choice: дела
  rationale: Сохраняет конкретное значение поступков или проявлений желания и связь вопроса с последующим ответом.
- source_word: παραδιδόντα ... εἰς θάνατον
  choice: предают ... смерти
  rationale: Формально передаёт образ передачи во власть смерти, не заменяя его более толковательным выражением.
- source_word: κύριε
  choice: господин
  rationale: В данном обращении к наставнику это уважительная форма, а не обязательное обозначение Бога.
- source_word: ἀφέξομαι ἀπ’ αὐτῶν
  choice: я держался от них подальше
  rationale: Естественно выражает намеренное воздержание и избегание названных дел.
- source_word: θανατοῖ
  choice: умерщвляет
  rationale: Сохраняет сильный переход от образа «предают смерти» к прямому глаголу «убивает/умерщвляет»; «умерщвляет» соответствует достоинству регистра.
- source_word: δούλους τοῦ Θεοῦ
  choice: Божьих рабов
  rationale: Сохраняет раннехристианское самообозначение и его богословскую силу; «служителей» было бы более узким толкованием.
theological_decisions:
- issue: Характер смерти
  choice: смерть / умерщвляет без уточнения
  alternative: духовная смерть / губит
  rationale: Греческий текст не уточняет, физическая, духовная или окончательная смерть имеется в виду; перевод сохраняет эту напряжённость.
- issue: Персонификация злого желания
  choice: злое желание предаёт смерти и умерщвляет
  alternative: люди погибают из-за злых желаний
  rationale: Активная грамматическая роль желания существенна для авторского нравственного образа и не должна сглаживаться.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной, но понятной лексикой. Синтаксис диалога сделан естественным; повтор «злое желание» и различие между «предают смерти» и «умерщвляет» сохранены ради связи с греческим текстом.
