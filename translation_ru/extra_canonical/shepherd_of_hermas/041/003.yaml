revisions:
- from: 3. «Какие дела злого желания, господин, — спрашиваю я, — предают людей смерти? Дай мне узнать о них, чтобы я держался от них подальше». — «Слушай, [a] какими делами злое желание умерщвляет Божьих рабов».
  to: 3. «Какие дела злого желания, господин, — спрашиваю я, — обрекают людей на смерть? Объясни мне это, чтобы я избегал их». — «Слушай[a], какими делами злое желание убивает рабов Божьих».
  rationale: 'Правка устраняет неестественные обороты, не меняя содержания: дела по-прежнему принадлежат злому желанию и ведут людей к смерти; в ответе злое желание остаётся действующим субъектом, который «убивает» рабов Божьих. Неоднозначность слова «смерть» сохранена. Сноска уточнена и привязана к месту сомнительного φησίν.'
  reviewer_model: gpt-5.6-terra
