  source_fidelity: 'Перевод точно передаёт аргументацию греческого текста: видение сидящей на скамье фигуры истолковывается как знак прочности положения; четыре ножки скамьи сопоставлены с четырьмя στοιχεῖα, которыми держится мир. «Стихии» верно отражает античный космологический смысл στοιχεῖα; причинно-инструментальное «держится четырьмя» естественно передаёт διὰ τεσσάρων.'
