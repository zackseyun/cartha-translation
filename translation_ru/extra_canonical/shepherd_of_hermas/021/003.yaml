base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/021/003.yaml
  text: And because you saw her sitting on a bench, the position is firm; because the bench has four feet and stands firmly. For indeed the world is held together by four elements.
translation:
  language: ru
  text: 'А то, что ты видел её сидящей на скамье, означает прочность её положения: ведь у скамьи четыре ножки, и она стоит прочно. Ибо и мир держится четырьмя стихиями.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμψέλιον
  choice: скамья
  rationale: Редкое слово обозначает сиденье или скамью; упоминание четырёх ножек подтверждает конкретный предмет мебели.
- source_word: ἰσχυρὰ ἡ θέσις
  choice: прочность её положения
  rationale: Передаёт как устойчивость увиденной фигуры, так и символический смысл её положения, не сводя выражение только к физической позе.
- source_word: στοιχεῖα
  choice: стихии
  rationale: В данном космологическом контексте речь идёт о четырёх первоэлементах; «стихии» — естественный и исторически уместный русский эквивалент.
- source_word: κρατεῖται
  choice: держится
  rationale: Сохраняет образ поддерживаемого и устойчиво существующего мира без излишнего уточнения механизма.
theological_decisions:
- issue: Символическое значение четырёх ножек скамьи
  choice: Сохранено прямое сопоставление с четырьмя стихиями
  alternative: Истолковать четыре ножки как стороны света или иные церковные символы
  rationale: Греческий текст сам прямо называет четыре στοιχεῖα; дополнительные символические толкования не следует вносить в перевод.
translation_notes:
  register: Современный литературный русский язык с dignified, ясной синтаксической структурой. Повтор «прочно / прочность» сохранён вслед за греческим словесным повтором и логикой объяснения.
