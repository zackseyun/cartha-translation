base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/021/002.yaml
  text: For just as when some good message comes to someone who is grieving, he immediately forgets his former sorrows and welcomes nothing else except the message that he heard, and from then on he is strengthened for what is good, and his spirit is renewed because of the joy that he received, so also you have received a renewal of your spirits by seeing these good things.
translation:
  language: ru
  text: Ведь как человек, который скорбит, получив добрую весть, тотчас забывает прежние печали и уже не желает ничего другого, кроме услышанной вести, и с тех пор обретает силы для доброго, а дух его обновляется от обретённой радости, — так и вы, увидев эти блага, получили обновление ваших духов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγγελία ἀγαθή
  choice: добрая весть
  rationale: Естественно передаёт значение благоприятного известия без навязывания специального значения «Евангелие».
- source_word: προσδέχεται
  choice: принимает
  rationale: Сохраняет буквальное значение принятия или допущения; в контексте речь о том, что внимание человека более не обращено ни на что иное.
- source_word: ἰσχυροποιεῖται ... εἰς τὸ ἀγαθόν
  choice: укрепляется в добре
  rationale: Передаёт направленность к благому, сохраняя возможную этическую широту выражения.
- source_word: ἀνανέωσιν ... τῶν πνευμάτων ὑμῶν
  choice: обновление ваших духов
  rationale: Сохранены множественное число и необычная формулировка греческого текста, а не сглажены до единственного числа.
- source_word: ταῦτα τὰ ἀγαθά
  choice: эти блага
  rationale: Передаёт субстантивированное множественное число и не сужает его до «хороших вещей» или «добрых событий».
theological_decisions:
- issue: Возможная евангельская окраска выражения ἀγγελία ἀγαθή
  choice: добрая весть
  alternative: благая весть
  rationale: Контекст описывает аналогию с радостным известием вообще; вариант «добрая весть» избегает необоснованного превращения выражения в техническое обозначение Евангелия.
- issue: Число в выражении «ваших духов»
  choice: сохранено множественное число
  alternative: ваш дух
  rationale: Греческий текст прямо употребляет множественное число; его необычность не следует устранять без текстового основания.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставительного текста. Длинное греческое сравнение сохранено как одно связное предложение, но организовано естественными русскими синтаксическими средствами.
