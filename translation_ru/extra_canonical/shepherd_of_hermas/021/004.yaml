revisions:
- from: Итак, те, кто полностью раскаялся, станут новыми и утвердятся на прочном основании — те, кто раскаялся всем сердцем. Теперь у тебя есть полное откровение. Больше ничего не проси об откровении; но если что-либо понадобится, тебе будет открыто.
  to: Итак, те, кто всецело покаялись, станут совершенно новыми и будут основаны — те, кто покаялись от всего сердца. Ты получил откровение полностью. Больше ни о каком откровении не проси; если же будет нужно что-либо, тебе будет открыто.
  rationale: Исправлены два места, где перевод либо ослаблял образ оригинала, либо допускал менее точную терминологическую окраску. «Ты получил откровение полностью» передаёт ἀπέχεις ὁλοτελῆ τὴν ἀποκάλυψιν как обладание завершённым объяснением данного видения, не расширяя его до утверждения о полноте всякого откровения.
