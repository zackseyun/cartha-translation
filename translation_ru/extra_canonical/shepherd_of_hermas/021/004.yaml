base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/021/004.yaml
  text: Therefore those who have repented completely will be new and firmly founded, those who have repented from their whole heart. You have the revelation complete. No longer ask anything about revelation; but if anything is needed, it will be revealed to you.
translation:
  language: ru
  text: Итак, те, кто всецело покаялись, станут совершенно новыми и будут основаны — те, кто покаялись от всего сердца. Ты получил откровение полностью. Больше ни о каком откровении не проси; если же будет нужно что-либо, тебе будет открыто.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοήσαντες
  choice: раскаялся
  rationale: Передаёт совершившееся покаяние и внутреннюю перемену; форма совершенного вида соответствует греческому аористу.
- source_word: ὁλοτελῶς
  choice: полностью
  rationale: Сохраняет усилительное значение полного, всецелого покаяния.
- source_word: νέοι ἔσονται
  choice: станут новыми
  rationale: Буквально сохраняет образ обновления людей, не сводя его лишь к молодости.
- source_word: τεθεμελιωμένοι
  choice: утвердятся на прочном основании
  rationale: Передаёт метафору заложенного основания и состояние прочной утверждённости естественным русским выражением.
- source_word: ἀπέχεις
  choice: теперь у тебя есть
  rationale: В данном контексте означает обладание уже полученным в полной мере; «теперь» естественно выражает итог объяснения.
- source_word: ἀποκάλυψιν
  choice: откровение
  rationale: Прямой и устойчивый эквивалент, уместный для сообщаемого свыше разъяснения видения.
theological_decisions:
- issue: Связь полного покаяния с обновлением и утверждением
  choice: 'Сохранено прямое утверждение: раскаявшиеся станут новыми и утвердятся.'
  alternative: Ослабить до пожелания или возможности обновления.
  rationale: Греческие формы выражают обещанный результат, а не только возможность; текст не уточняет систематическое учение о механизме этого обновления.
- issue: Значение «полного откровения»
  choice: Сохранено как завершённость данного откровения.
  alternative: Понять как обладание всей полнотой божественного откровения вообще.
  rationale: Контекст относится к объяснению конкретного видения; перевод не должен расширять смысл до всеобъемлющего богословского утверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Повтор «те, кто…» сохранён вслед за греческим эмфатическим возобновлением, но оформлен тире для естественности. Форма обращения единственного числа передана последовательно.
