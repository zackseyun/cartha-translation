  text: But in the third vision you saw her younger, beautiful, and cheerful, and her appearance was beautiful.
translation:
  language: ru
  text: В третьем же видении ты увидел её моложе, красивой и радостной, и облик её был прекрасен.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεωτέραν
  choice: более молодой
  rationale: Сравнительная форма указывает, что в третьем видении она выглядела моложе, чем прежде.
- source_word: καλὴν
  choice: красивой / прекрасен
  rationale: Повтор греческого слова сохранён с естественным для русского языка варьированием формы при описании самой женщины и её облика.
- source_word: ἱλαράν
  choice: радостной
  rationale: Передаёт светлое, весёлое расположение, не добавляя отсутствующего в тексте оттенка внешнего сияния.
- source_word: μορφὴν
  choice: облик
  rationale: Естественно передаёт видимую внешность или форму в данном описательном контексте.
