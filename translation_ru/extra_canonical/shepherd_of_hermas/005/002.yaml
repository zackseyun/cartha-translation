base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/002.yaml
  text: So, having come to the place, I knelt and began to pray to the Lord and to glorify his name, because he had deemed me worthy and had made known to me my former sins.
translation:
  language: ru
  text: Итак, придя на то место, я преклонил колени и начал молиться Господу и прославлять Его имя за то, что Он счёл меня достойным и открыл мне мои прежние грехи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τιθῶ τὰ γόνατα
  choice: преклонил колени
  rationale: Естественная и достойная русская передача буквального образа «положил колени», обозначающего коленопреклонение.
- source_word: δοξάζειν αὐτοῦ τὸ ὄνομα
  choice: прославлять Его имя
  rationale: Сохраняет объект прославления и привычную библейскую формулу без упрощения до «прославлять Его».
- source_word: ἄξιον ἡγήσατο
  choice: счёл меня достойным
  rationale: Точно передаёт оценочное значение глагола ἡγέομαι и не добавляет причины, по которой герой признан достойным.
- source_word: ἐγνώρισέν μοι
  choice: открыл мне
  rationale: В данном контексте естественно выражает каузативный смысл «дал узнать, сделал известными».
- source_word: τὰς ἁμαρτίας μου τὰς πρότερον
  choice: мои прежние грехи
  rationale: Передаёт временное определение πρότερον без уточнения, отсутствующего в греческом тексте.
theological_decisions:
- issue: Смысл признания героя достойным
  choice: счёл меня достойным
  alternative: удостоил меня
  rationale: Выбрана более прозрачная формулировка, сохраняющая действие Божьей оценки и не объясняющая, на каком основании герой признан достойным.
- issue: Божественное раскрытие прежних грехов
  choice: открыл мне мои прежние грехи
  alternative: дал мне узнать мои прежние грехи
  rationale: «Открыл» естественно по-русски передаёт сообщённое Богом знание, не утверждая сверх текста конкретный способ откровения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Причастный оборот заменён естественной последовательностью личных форм; сохранены молитвенная поза, прославление имени Господа и богословски значимые формулировки исходного текста.
