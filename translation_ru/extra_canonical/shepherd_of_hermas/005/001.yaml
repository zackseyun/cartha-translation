base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/001.yaml
  text: As I was going to Cumae at the same season as the year before, while walking I recalled last year’s vision, and again the Spirit lifts me up and carries me away to the same place as the year before.
translation:
  language: ru
  text: Когда я шёл в Кумы в то же время года, что и год назад, по дороге я вспомнил прошлогоднее видение, и вновь дух поднял меня и перенёс на то же место, как и год назад.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πορευομένου μου εἰς Κούμας
  choice: Когда я шёл в Кумы
  rationale: Передаёт обстоятельственный генитив абсолютный естественной русской придаточной конструкцией; Κούμας — древний город Кумы.
- source_word: κατὰ τὸν καιρὸν ὃν καὶ πέρυσι
  choice: в то же время года, что и год назад
  rationale: καιρός здесь обозначает соответствующий период или сезон, а πέρυσι — предыдущий год; формулировка сохраняет временное сопоставление без излишней буквальности.
- source_word: περιπατῶν
  choice: по дороге
  rationale: В контексте движения в Кумы причастие указывает на происходящее во время ходьбы; идиоматическая русская передача избегает повтора «шёл… идя».
- source_word: ἀνεμνήσθην τῆς περυσινῆς ὁράσεως
  choice: я вспомнил прошлогоднее видение
  rationale: Прямая и естественная передача значения глагола и родительного дополнения.
- source_word: πνεῦμα
  choice: Дух
  rationale: Субъект сверхъестественного перенесения в повествовании; прописная буква отражает личностно-божественное прочтение, не добавляя уточнения «Святой».
- source_word: αἴρει … καὶ ἀποφέρει
  choice: подхватил меня и перенёс
  rationale: Передаёт сочетание поднятия/взятия и унесения; русское прошедшее время естественно согласует историческое настоящее греческого рассказа с окружающим повествованием.
- source_word: εἰς τὸν αὐτὸν τόπον ὅπου καὶ πέρυσι
  choice: на то же место, где я был год назад
  rationale: Восполняет по-русски подразумеваемое в греческом сказуемое, не добавляя нового события.
theological_decisions:
- issue: Идентификация πνεῦμα
  choice: «Дух» с прописной буквы, без определения
  alternative: «дух» со строчной буквы или «Святой Дух»
  rationale: Контекст описывает сверхъестественного деятеля, однако исходный текст не содержит слова «Святой»; выбранная форма сохраняет возможную богословскую отнесённость и не делает её чрезмерно конкретной.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Устранён неестественный причастный повтор, сохранены повторные указания на прошлый год и внезапное сверхъестественное перенесение.
