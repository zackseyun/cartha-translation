  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/003.yaml
  text: And after I rose from prayer, I see before me the elderly woman whom I had also seen last year, walking and reading a little book. And she says to me, “Are you able to report these things to the elect of God?” I say to her, “Lady, I am not able to remember so many things; but give me the little book, so that I may copy it.” “Take it,” she says, “and you will give it back to me.”
translation:
  language: ru
  text: 'Когда же я встал после молитвы, то увидел перед собой ту пожилую женщину, которую видел и в прошлом году: она шла и читала небольшую книгу. Она сказала мне: «Сможешь ли ты возвестить это избранным Божьим?» Я ответил ей: «Госпожа, я не могу запомнить столько. Дай мне эту небольшую книгу, чтобы я её переписал». «Возьми, — сказала она, — и вернёшь мне».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβυτέραν
  choice: пожилую женщину
  rationale: Передаёт возрастное значение существительного без привнесения церковного титула «пресвитерица»; женщина уже известна из предыдущего видения.
- source_word: βιβλαρίδιον
  choice: небольшую книгу
  rationale: Уменьшительная форма передана естественным современным выражением; «книжечка» могла бы создать неуместно ласковый оттенок.
- source_word: ἀναγγεῖλαι
  choice: возвестить
  rationale: Сохраняет смысл публичного сообщения порученного откровения и достойный религиозный регистр.
- source_word: τοῖς ἐκλεκτοῖς τοῦ Θεοῦ
  choice: избранным Божьим
  rationale: Прямая и привычная передача выражения, сохраняющая его богословскую значимость.
- source_word: μεταγράψωμαι
  choice: переписал
  rationale: Здесь речь идёт о создании письменной копии текста, а не о переводе или пересказе.
theological_decisions:
- issue: Кого обозначает πρεσβυτέρα
  choice: пожилая женщина
  alternative: старица / пресвитерица
  rationale: Контекст непосредственно указывает на возраст и узнаваемую фигуру из прежнего видения; перевод не должен преждевременно отождествлять её с церковной должностью или вводить монашескую ассоциацию.
- issue: Характер поручения избранным Божьим
  choice: возвестить это
  alternative: пересказать это / сообщить об этом
  rationale: «Возвестить» сохраняет торжественный характер передачи откровения, не уточняя сверх текста ни способ, ни официальный статус вестника.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным религиозным регистром. Историческое настоящее греческого βλέπω передано прошедшим временем («увидел») ради естественности русского повествования; смена на настоящее время в репликах сохранена. Синтаксис слегка упорядочен, но последовательность действий и прямая речь оригинала сохранены.
