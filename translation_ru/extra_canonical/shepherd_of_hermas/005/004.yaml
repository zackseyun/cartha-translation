  yaml_path: translation/extra_canonical/shepherd_of_hermas/005/004.yaml
  text: So I took it, and withdrawing to a certain place in the field, I copied it all letter by letter, for I could not make out the syllables. And when I had finished the letters of the book, suddenly the little book was snatched from my hand; but by whom I did not see.
translation:
  language: ru
  text: Я взял её и, отойдя в одно место в поле, переписал всё буква за буквой, потому что не мог разобрать слоги. Когда же я закончил переписывать буквы книги, книжечка внезапно была выхвачена у меня из руки; но кем — я не увидел.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βιβλαρίδιον
  choice: книжечка
  rationale: Уменьшительная форма передаёт значение греческого существительного и сохраняет связь с τὸ βιβλίον далее.
- source_word: εἰς τινα τόπον τοῦ ἀγροῦ ἀναχωρήσας
  choice: отойдя в укромное место в поле
  rationale: ἀναχωρέω здесь указывает на удаление в сторону; «укромное» естественно выражает цель уединения, хотя прямо в тексте не названо.
- source_word: πάντα πρὸς γράμμα
  choice: всё буква за буквой
  rationale: Передаёт тщательное побуквенное копирование и подготавливает противопоставление слогам.
- source_word: οὐχ ηὕρισκον γὰρ τὰς συλλαβάς
  choice: потому что не мог разобрать слоги
  rationale: Буквально «не находил слогов»; русский оборот сохраняет неясность того, почему текст приходилось копировать побуквенно.
- source_word: ἐξαίφνης ἡρπάγη
  choice: внезапно была выхвачена
  rationale: Пассивная конструкция сохраняет неизвестность действующего лица и резкость действия.
