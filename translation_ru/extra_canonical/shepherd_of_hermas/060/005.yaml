  terminology: «Прутья» последовательно и удачно передаёт ῥάβδοι в данном контексте срезанных ветвей. «Моль», «полусухие», «трещины» и «встать отдельно» являются точными, нейтральными и стилистически подходящими соответствиями. Богословски нагруженные термины в сегменте отсутствуют.
