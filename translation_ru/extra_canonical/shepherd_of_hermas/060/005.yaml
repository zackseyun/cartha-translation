  source_fidelity: 'Перевод точно охватывает греческие предложения §§6–14, соответствующие данному читательскому сегменту. Переданы все различаемые состояния прутьев: сухие и как бы изъеденные молью, сухие без такого повреждения, полусухие, треснувшие, а также пропорции зелёных и сухих частей. Повторяющаяся формула χωρὶς ἵστασθαι сохранена. Сравнительное ὡς в «словно изъеденные молью» не утрачено.'
