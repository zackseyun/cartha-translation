base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/005.yaml
  text: From some he received the rods dry and eaten as if by a moth; the angel ordered those who had handed in such rods to stand apart. Others handed in dry rods, but they had not been eaten by a moth; these too he ordered to stand apart. Others handed in rods half-dry; and these stood apart. Others handed in their rods half-dry and having splits; and these stood apart. Others handed in their rods green and having splits; and these stood apart. Others handed in their rods half dry and half green; and these stood apart. Others presented their rods with two parts of the rod green and the third part dry; and these stood apart. Others handed in two parts dry and the third part green; and these stood apart. Others handed in their rods almost entirely green, but a very little of their rods was dry—at the very tip; and they had splits in them; and these stood apart.
translation:
  language: ru
  text: 'У одних он брал прутья сухие и словно изъеденные молью. Ангел велел тем, кто сдал такие прутья, встать отдельно. Другие сдавали сухие прутья, но не изъеденные молью; и им он велел встать отдельно. Другие сдавали полусухие прутья; и они вставали отдельно. Другие сдавали свои прутья полусухими и с трещинами; и они вставали отдельно. Другие сдавали прутья зелёными, но с трещинами; и они вставали отдельно. Другие сдавали свои прутья наполовину сухими, наполовину зелёными; и они вставали отдельно. Другие приносили свои прутья, у которых две части были зелёными, а третья — сухой; и они вставали отдельно. Другие сдавали прутья, у которых две части были сухими, а третья — зелёной; и они вставали отдельно. Другие сдавали свои прутья почти целиком зелёными: лишь самая малость у них была сухой — у самого кончика; но на них были трещины. И они вставали отдельно.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: прутья
  rationale: В данном образном повествовании речь идёт о небольших срезанных ветвях, розданных людям; «прутья» естественно передаёт предмет и сохраняет последовательность образа.
- source_word: βεβρωμένας ὡς ὑπὸ σητός
  choice: словно изъеденные молью
  rationale: Сохраняет сравнительную конструкцию ὡς и обычное значение σητός — «моль», не уточняя без достаточного основания иной вид вредителя.
- source_word: ἡμιξήρους
  choice: полусухие / наполовину сухие
  rationale: Обе русские формы точно передают составное значение; выбор внутри абзаца согласован с синтаксисом соответствующей фразы.
- source_word: σχισμάς
  choice: трещины
  rationale: Передаёт видимые расщелины или расколы в прутьях без чрезмерно технического оттенка.
- source_word: χωρὶς ἵστασθαι
  choice: встать отдельно
  rationale: Прямо передаёт отделение соответствующей группы от остальных и сохраняет повторяющуюся формулу исходного текста.
- source_word: τὰ δύο μέρη ... τὸ δὲ τρίτον
  choice: две части… а третья
  rationale: Сохраняет способ выражения оригинала, не заменяя его истолковывающим «две трети».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с простой, торжественно-сдержанной повествовательной интонацией. Повторы оригинала в основном сохранены как структурно значимые для последовательного разделения групп; чередование «сдавали» и «приносили» следует греческим глаголам и делает текст естественным без устранения параллелизма.
