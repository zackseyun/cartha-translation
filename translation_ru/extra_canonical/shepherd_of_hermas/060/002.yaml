base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/002.yaml
  text: And an angel of the Lord—exceedingly glorious and very tall—was standing beside the willow, holding a great sickle, and he was cutting off branches from the willow and handing them to the people who were being sheltered by the willow; and he kept giving them little rods, about a cubit long.
translation:
  language: ru
  text: Возле ивы стоял ангел Господень — весьма славный и очень высокий. Он держал большой серп, срезал с ивы ветви и раздавал их людям, находившимся под защитой ивы. Он давал им небольшие прутья, длиной примерно в локоть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔνδοξος λίαν
  choice: чрезвычайно славный
  rationale: Передаёт усилительное λίαν и значение ἔνδοξος без добавления конфессиональных оттенков.
- source_word: ὑψηλός
  choice: очень высокий
  rationale: В описании видимого облика ангела естественнее понимать слово как указание на высокий рост.
- source_word: δρέπανον
  choice: серп
  rationale: Обычное и точное соответствие орудию, которым ангел срезает ветви.
- source_word: ῥαβδία
  choice: прутья
  rationale: Уменьшительная форма и контекст срезанных ветвей требуют обозначения небольших тонких веток, а не посохов.
- source_word: ὡσεὶ πηχυαῖα
  choice: длиной примерно в локоть
  rationale: Сохраняет приблизительность ὡσεὶ и древнюю меру длины, выражая конструкцию естественно по-русски.
theological_decisions:
- issue: Титул ангела
  choice: ангел Господень
  alternative: ангел Господа
  rationale: Традиционная, но понятная современному читателю передача ἄγγελος Κυρίου; она не уточняет личность ангела сверх источника.
- issue: Образ укрытия под ивой
  choice: людям, укрывавшимся под ивой
  alternative: людям, находившимся под покровом ивы
  rationale: Передаёт пассивное причастие σκεπαζομένῳ и сохраняет образ покрова, не превращая его преждевременно в богословское толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Синтаксис слегка упрощён ради ясности, но последовательность образов и повторяющееся действие сохранены.
