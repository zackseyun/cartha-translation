base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/001.yaml
  text: …with their whole heart. So then, do you suppose that the sins of those who are repenting are immediately forgiven? Not entirely. Rather, the one who repents must afflict his own soul and be humble-minded in all his conduct, resolutely, and be distressed in all kinds of tribulations; and if he bears the tribulations that come upon him, the One who created all things and strengthened them will surely be moved with compassion and will grant some healing. And this, when [God] sees the heart of the one repenting clean from everything.
translation:
  language: ru
  text: …всем сердцем. Итак, неужели ты думаешь, что грехи кающихся прощаются сразу? Не вполне. Напротив, кающийся должен подвергать свою душу мучительному испытанию, проявлять глубокое смирение во всех своих поступках и испытывать всевозможные скорби. И если он перенесёт постигающие его скорби, то Создавший и укрепивший всё непременно сжалится и дарует некоторое исцеление. И это произойдёт, когда [Бог][a] увидит, что сердце кающегося чисто от всего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «Бог» в используемом греческом издании заключено в редакционные скобки.
    reason: Маркер сохраняет видимой текстологическую неопределённость источника.
lexical_decisions:
- source_word: βασανίσαι τὴν ἑαυτοῦ ψυχήν
  choice: истомить свою душу
  rationale: Передаёт сильное значение βασανίζω — подвергнуть мучительному испытанию или страданию — без неуместной для контекста буквальности «пытать».
- source_word: ταπεινοφρονῆσαι … ἰσχυρῶς
  choice: проявлять глубокое смирение
  rationale: Сохраняет идею смиренного образа мыслей и усилительный оттенок ἰσχυρῶς в естественной русской форме.
- source_word: θλιβῆναι ἐν πάσαις θλίψεσι ποικίλαις
  choice: терпеть всевозможные скорби
  rationale: Естественно воспроизводит однокоренную греческую конструкцию и широкий смысл ποικίλαις.
- source_word: ἴασίν τινα
  choice: некоторое исцеление
  rationale: Сохраняет неопределённость τινα, не превращая её в обещание полного или немедленного исцеления.
theological_decisions:
- issue: Связь прощения, покаяния и скорбей
  choice: Сохранено утверждение «Не вполне» и условная последовательность испытания, терпения, сострадания и исцеления.
  alternative: Сгладить текст так, будто прощение даётся немедленно и без дальнейшего испытания.
  rationale: Греческий текст намеренно выражает напряжение и не позволяет переводчику согласовать его с более поздней конфессиональной схемой.
- issue: Кто является действующим лицом в последней фразе
  choice: «[Бог]» сохранено в квадратных скобках с примечанием.
  alternative: Безоговорочно включить «Бог» в основной текст либо опустить подлежащее.
  rationale: В издании слова ὁ Θεός заключены в редакционные скобки; это текстологическое обстоятельство необходимо обозначить.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Сохранены начальная и конечная фрагментарность отрывка; не относящийся к данному читательскому сегменту последующий текст не переводился.
