base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/003.yaml
  text: After all had received the rods, the angel laid aside the sickle, and that tree was sound, just as I had seen it before. I marveled within myself, saying, How is the tree sound, with so many branches cut off? The shepherd says to me, Do not marvel that the tree remained sound though so many branches were cut off. But wait until you see everything, and it will be shown to you what it is.
translation:
  language: ru
  text: 'Когда все получили прутья, ангел отложил серп, и то дерево было здоровым — таким, каким я видел его прежде. Я удивлялся про себя и говорил: «Как же дерево остаётся здоровым, когда с него срезано столько ветвей?» Пастырь говорит мне: «Не удивляйся, что дерево осталось здоровым, хотя с него срезали столько ветвей. Подожди, пока не увидишь всё, и тебе будет открыто, что это означает».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥαβδία
  choice: прутья
  rationale: Уменьшительная форма обозначает небольшие отрезанные ветви; «прутья» естественно передаёт предмет, розданный людям, и сохраняет отличие от κλάδοι — «ветви».
- source_word: ὑγιές
  choice: здоровым
  rationale: Слово буквально описывает дерево как здоровое, целое и не повреждённое; «здоровым» сохраняет образ и повтор в вопросе и ответе.
- source_word: ἐθαύμαζον
  choice: дивился
  rationale: Передаёт внутреннее изумление рассказчика в dignified, но современном повествовательном регистре.
- source_word: δηλωθήσεταί σοι
  choice: тебе будет открыто
  rationale: Пассивная конструкция сохраняет неопределённость относительно того, кто именно даст объяснение.
- source_word: τὸ τί ἐστιν
  choice: что это означает
  rationale: В контексте символического видения речь идёт о значении увиденного; формулировка естественна по-русски, не конкретизируя само толкование.
theological_decisions:
- issue: Неявный деятель в δηλωθήσεταί σοι
  choice: Сохранить безлично-пассивное «тебе будет открыто»
  alternative: «я объясню тебе» или «Бог откроет тебе»
  rationale: Греческий текст не называет деятеля; перевод не должен приписывать откровение конкретному лицу.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным повествовательным тоном. Повтор «дерево осталось здоровым» сохранён как смысловой акцент оригинала; синтаксис слегка выровнен для естественного русского чтения.
