base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/060/004.yaml
  text: The angel who had given the rods to the people again demanded them back from them; and as they had received them, so too they were called to him, and each one returned the rods. The angel of the Lord took them and examined them.
translation:
  language: ru
  text: Ангел, раздавший народу прутья, снова потребовал их обратно. Их вызывали к нему смотря по тому, какими они получили прутья, и каждый возвращал свои прутья. Ангел Господа брал их и внимательно осматривал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: прутья
  rationale: В данном образе речь идёт о небольших срезанных ветвях, розданных людям; «прутья» естественно передаёт предмет и сохраняет связь с ближайшим контекстом.
- source_word: πάλιν ἀπῄτει ἀπ᾽ αὐτῶν
  choice: снова потребовал их обратно
  rationale: Передаёт повторность πάλιν и значение ἀπαιτέω — требовать возвращения ранее выданного.
- source_word: κατενόει
  choice: внимательно осматривал
  rationale: Глагол обозначает сосредоточенное рассмотрение или проверку, а не беглый взгляд.
theological_decisions:
- issue: Передача ὁ ἄγγελος τοῦ Κυρίου
  choice: Ангел Господа
  alternative: ангел Господень
  rationale: Сохранено буквальное и богословски нейтральное обозначение без отождествления ангела с Богом; современная форма «Господа» звучит естественнее архаического прилагательного.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Пассивное ἐκαλοῦντο передано безличной конструкцией «их вызывали», а καθὼς ἔλαβον — как указание на тот же порядок вызова; это сохраняет структуру греческой фразы без искусственной буквальности.
