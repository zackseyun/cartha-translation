base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/008.yaml
  text: 8. Many other stones lay around the tower, and they were not using them for the building—for some of them were scabby, others had cracks, others were mutilated, others were white and round, not fitting for the building.
translation:
  language: ru
  text: '8. Вокруг башни лежало ещё много камней, но их не использовали при строительстве: одни из них были покрыты струпьями, другие имели трещины, третьи были обломаны, а иные были белыми и круглыми и не подходили для строительства.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐψωριακότες
  choice: покрыты струпьями
  rationale: Причастие обозначает поражение вроде парши или кожной болезни; образное «покрыты струпьями» естественно применимо к камням и сохраняет резкость греческого образа.
- source_word: σχισμὰς ἔχοντες
  choice: имели трещины
  rationale: Буквально «имеющие трещины/расщелины»; выбран прямой и понятный строительный термин.
- source_word: κεκολοβωμένοι
  choice: были обломаны
  rationale: Слово означает «укороченные, усечённые, лишённые части»; «обломаны» естественно описывает повреждённые камни, не уточняя способ повреждения.
- source_word: λευκοὶ καὶ στρογγύλοι
  choice: белыми и круглыми
  rationale: Сохранены оба явно названных признака без истолкования их символического значения.
- source_word: μὴ ἁρμόζοντες εἰς τὴν οἰκοδομήν
  choice: не подходили для строительства
  rationale: Передаёт непригодность формы камней к включению в сооружение естественным современным русским языком.
theological_decisions:
- issue: Символическое значение различных камней
  choice: Не раскрывать символику в основном тексте
  alternative: Добавить истолковательные характеристики людей или их духовного состояния
  rationale: В данном фрагменте видение лишь описывает камни; объяснение символов здесь не дано, поэтому перевод сохраняет повествовательную и богословскую открытость текста.
translation_notes:
  register: Современный литературный русский язык с ясной, dignified повествовательной интонацией. Сохранена последовательность четырёх видов непригодных камней и строительная образность оригинала.
