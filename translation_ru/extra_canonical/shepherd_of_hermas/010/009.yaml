base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/009.yaml
  text: 9. And I saw other stones being thrown far from the tower and coming into the road, and not remaining in the road but rolling into the wasteland; others falling into fire and being burned; others falling near waters and not being able to roll into the water, though they wanted to roll and come into the water.
translation:
  language: ru
  text: '9. Я видел и другие камни: их бросали далеко от башни; они попадали на дорогу, но не оставались на ней, а скатывались в бездорожье. Другие падали в огонь и горели; иные падали возле воды и не могли скатиться в воду, хотя хотели скатиться и войти в неё.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνοδίαν
  choice: бездорожье
  rationale: Греческое слово обозначает место вне дороги или непроходимую местность; «бездорожье» сохраняет контраст с ὁδός («дорога») и не добавляет отсутствующего в тексте образа пустыни.
- source_word: ἐπὶ πῦρ ἐμπίπτοντας
  choice: падали в огонь
  rationale: Естественная русская передача движения на огонь/в область огня без изменения образа.
- source_word: καιομένους
  choice: сгорали
  rationale: Передаёт продолжающееся воздействие огня в данном повествовательном контексте; возможное более буквальное «горели» не меняет основной картины.
- source_word: ἐγγὺς ὑδάτων
  choice: возле воды
  rationale: Множественное число ὕδατα в греческом часто обозначает воду или водоём собирательно; русский единственный вариант здесь звучит естественно и сохраняет смысл.
- source_word: ἐλθεῖν εἰς τὸ ὕδωρ
  choice: войти в неё
  rationale: Сохраняется различие между «скатиться» и общим глаголом движения ἐλθεῖν; местоимение согласовано с русским «вода».
theological_decisions:
- issue: Возможная символическая интерпретация дороги, бездорожья, огня и воды
  choice: Оставить образы без поясняющей богословской конкретизации
  alternative: Передать их как прямые обозначения пути веры, погибели, суда или крещения
  rationale: В данном сегменте видение лишь описывается, а истолкование не дано; перевод не должен преждевременно разрешать символическую многозначность.
translation_notes:
  register: Современный литературный русский язык с ясным, сдержанно-достоинственным повествованием. Повторяющаяся структура греческого перечисления сохранена, но слегка упорядочена русской пунктуацией. Маркеры сносок отсутствуют, поскольку сноски не требуются.
