base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/006.yaml
  text: 6. The stones hauled up from the deep they set, every one, into the building just as they were; for they were fitted and matched the joining with the other stones, and so were joined to one another, so that their joint was not visible. The construction of the tower appeared as if it had been built from a single stone.
translation:
  language: ru
  text: 6. Все камни, которые вытаскивали из глубины, укладывали в строение такими, как они были, ибо они были подогнаны и точно стыковались с другими камнями. Так они соединялись друг с другом, что шва между ними не было видно. Строение башни выглядело так, словно было сложено из одного камня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τοῦ βυθοῦ
  choice: из глубины
  rationale: Передаёт образ камней, извлекаемых из водной глубины, не уточняя сверх греческого текста, идёт ли речь о морской пучине или ином глубоком месте.
- source_word: οὕτως ἐτίθεσαν
  choice: без обработки укладывали
  rationale: В контексте οὕτως указывает, что извлечённые камни клали такими, какими они были; естественная русская формулировка раскрывает это без добавления нового действия.
- source_word: ἡρμοσμένοι
  choice: были подогнаны
  rationale: Сохраняет строительный смысл заранее подходящих друг к другу камней.
- source_word: συνεφώνουν τῇ ἁρμογῇ
  choice: совпадали по стыку
  rationale: Передаёт буквальную идею согласованности их соединения с соединением остальных камней в понятной современной строительной лексике.
- source_word: ἐκολλῶντο ἀλλήλοις
  choice: так плотно соединялись друг с другом
  rationale: Глагол обозначает тесное скрепление; «плотно соединялись» звучит естественно и согласуется с невидимым швом.
- source_word: ἡ ἁρμογὴ αὐτῶν
  choice: шва между ними
  rationale: В данном строительном контексте речь о линии соединения камней; «шов» наглядно и точно передаёт смысл.
- source_word: ἡ οἰκοδομὴ τοῦ πύργου
  choice: вся башня
  rationale: Греческое выражение буквально означает «строение башни»; по-русски итоговый зрительный образ естественнее выражается как вид всей башни.
