  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/007.yaml
  text: 7. But of the other stones being brought from the dry land, some they were rejecting, and some they were putting into the building; others they were cutting and throwing far from the tower.
translation:
  language: ru
  text: 7. А из прочих камней, принесённых с суши, одни отбрасывали, другие укладывали в кладку, а иные разбивали и бросали далеко от башни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τῆς ξηρᾶς
  choice: с суши
  rationale: Передаёт противопоставление камням, извлечённым из глубины вод, сохраняя пространственный образ греческого текста.
- source_word: ἀπέβαλλον
  choice: отбрасывали
  rationale: Естественно передаёт повторяющееся действие и смысл отклонения камней как непригодных.
- source_word: ἐτίθουν εἰς τὴν οἰκοδομήν
  choice: укладывали в строение
  rationale: В контексте каменной кладки «укладывали» точнее и естественнее буквального «помещали».
- source_word: κατέκοπτον
  choice: разбивали
  rationale: Глагол означает рубить или рассекать на части; применительно к камням современное русское «разбивали» ясно передаёт разрушение, не уточняя не названный в тексте инструмент.
- source_word: μακρὰν ἀπὸ τοῦ πύργου
  choice: далеко от башни
  rationale: Прямо сохраняет пространственное удаление от башни.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Сохранены три разные участи камней и незавершённая на данном этапе символика без богословского истолкования.
