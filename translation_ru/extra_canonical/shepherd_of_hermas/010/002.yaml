  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/002.yaml
  text: 2. “But you are eager to sit on the right with them; yet your shortcomings are many. Still, you will be cleansed from your shortcomings, and all who are not double-minded will be cleansed from all their sins up to this day.”
translation:
  language: ru
  text: 2. Ты очень хочешь сидеть по правую сторону вместе с ними, но недостатков у тебя много. Однако ты очистишься от своих недостатков; и все, кто не раздваивается в душе,[a] очистятся от всех грехов, совершённых до сегодняшнего дня.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кто не двоедушен»; речь идёт о внутренней раздвоенности, двойственности или непостоянстве.'
    reason: Греческое διψυχοῦντες образно; такое пояснение передаёт его широту, не сводя значение к интеллектуальному сомнению, конкретным «решениям» или заранее заданной богословской трактовке.
lexical_decisions:
- source_word: κατεπίθυμος
  choice: очень хочешь
  rationale: Усиленная форма передаёт сильное желание; естественное русское выражение сохраняет эмоциональную силу без архаизации.
- source_word: τὰ ὑστερήματά σου
  choice: твои недостатки
  rationale: ὑστέρημα здесь обозначает нравственную ущербность или то, чего человеку недостаёт; «недостатки» сохраняет широту значения.
- source_word: οἱ μὴ διψυχοῦντες
  choice: все, кто не колеблется между двумя решениями
  rationale: διψυχέω буквально связано с раздвоенностью души и в контексте означает внутреннее колебание или неверность; описательный перевод понятен современному читателю и не сводит выражение только к интеллектуальному сомнению.
- source_word: καθαρισθήσῃ / καθαρισθήσονται
  choice: ты очистишься / очистятся
  rationale: Будущие пассивные формы переданы возвратными формами русского глагола, не уточняя действующего лица и сохраняя богословскую открытость пассива.
- source_word: εἰς ταύτην τὴν ἡμέραν
  choice: до этого дня
  rationale: Временной предел относится к грехам, накопившимся к настоящему моменту; дополнение «совершённых ими» делает эту связь ясной по-русски.
theological_decisions:
- issue: Кто совершает очищение
  choice: Пассивная конструкция сохранена через «очистишься / очистятся»
  alternative: «Бог очистит тебя / их»
  rationale: Греческий текст не называет действующее лицо; перевод не должен явно вводить Бога как субъекта, хотя это может подразумеваться.
- issue: Значение διψυχοῦντες
  choice: «кто не колеблется между двумя решениями» с пояснением в сноске
  alternative: «кто не сомневается» или «кто не двоедушен»
  rationale: «Не сомневается» чрезмерно сужает смысл, а «не двоедушен» звучит архаично и может восприниматься как простое лицемерие. Греческое слово охватывает внутреннюю раздвоенность и непостоянство.
- issue: Охват очищаемых грехов
  choice: «от всех грехов, совершённых ими до этого дня»
  alternative: «от всех грехов в этот день»
  rationale: εἰς ταύτην τὴν ἡμέραν естественно указывает на предел времени — вплоть до данного дня, а не только на грехи одного дня.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Обращение на «ты» соответствует единственному числу греческого текста и непосредственной речи к Ерму. Формулировки избегают как церковнославянизмов, так и разговорной сниженности.
