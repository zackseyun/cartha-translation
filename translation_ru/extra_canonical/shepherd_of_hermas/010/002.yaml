    rationale: Оборот «не колеблется между двумя решениями» вводит в текст понятие решений, которого в оригинале нет, и сужает более широкое значение внутренней раздвоенности или двойственности.
  - severity: low
    issue: Сноска a включает интерпретационный оттенок «колеблется в верности»
    rationale: Неверность может подразумеваться контекстуально, но не выражена самим словом; пояснение лучше ограничить внутренней раздвоенностью и непостоянством.
