base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/001.yaml
  text: '1. “What,” I said, “did they endure?” She says, “Listen: scourges, imprisonments, great afflictions, crosses, wild beasts—for the sake of the Name. For this reason the right-hand parts of the sanctuary belong to them, and to whoever suffers because of the Name; but the left-hand parts belong to the rest. Yet for both, those sitting on the right and those on the left, the gifts are the same and the promises the same—only those on the right sit there and have some glory.”'
translation:
  language: ru
  text: '1. «Что же, — спросил я, — они претерпели?» Она ответила: «Слушай: бичевания, заточения, великие бедствия, кресты, диких зверей — ради Имени. Поэтому им и всякому, кто пострадает ради Имени, принадлежат места в святилище по правую сторону, а остальным — места по левую. Однако и у сидящих справа, и у сидящих слева одни и те же дары и одни и те же обещания; только те сидят справа и пользуются особой славой».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάστιγας
  choice: бичевания
  rationale: Передаёт наказание бичом как претерпеваемое мучение и сохраняет ряд существительных.
- source_word: φυλακάς
  choice: заточения
  rationale: В данном перечне гонений множественное число обозначает случаи заключения под стражу; «заточения» звучит естественно и конкретно.
- source_word: σταυρούς
  choice: кресты
  rationale: Сохранён буквальный образ и множественное число греческого текста, вероятно указывающее на казни через распятие, без поясняющего расширения в основном тексте.
- source_word: εἵνεκεν τοῦ ὀνόματος / διὰ τὸ ὄνομα
  choice: ради Имени
  rationale: Сохраняет раннехристианское абсолютное употребление «Имени» и не подставляет прямо не названного референта.
- source_word: τὰ δεξιὰ μέρη τοῦ ἁγιάσματος
  choice: места в святилище по правую сторону
  rationale: Передаёт пространственный смысл μέρη естественным русским выражением, не превращая его в богословский ранг.
- source_word: δόξαν τινά
  choice: особой славой
  rationale: Русское «некоторой славой» звучало бы неестественно; «особой» передаёт дополнительное отличие, не уточняя его природу или степень.
theological_decisions:
- issue: Равенство даров и обещаний при различии мест и славы
  choice: 'Сохранено прямое сопоставление: дары и обещания одинаковы, но сидящие справа пользуются особой славой.'
  alternative: Истолковать правую сторону как более высокую степень награды или, напротив, свести различие только к почётному месту.
  rationale: Греческий текст одновременно утверждает равенство даров и обещаний и наличие отличительной славы; перевод не должен устранять это напряжение.
- issue: Референт «Имени»
  choice: Оставлено «Имени» без добавления «Господа» или «Христа».
  alternative: «ради имени Господа» или «ради имени Христа».
  rationale: В данном предложении референт подразумевается, но не выражен; сохранение абсолютного употребления соответствует источнику.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского повествования. Диалог оформлен естественно; перечень гонений сохранён компактным и ритмичным. Термины не перегружены конфессиональными толкованиями.
