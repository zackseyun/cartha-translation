base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/005.yaml
  text: 5. The tower was being built in a square by the six young men who had come with her; and myriads of other men were bringing stones, some from the deep and others from the land, and were handing them to the six young men. They would take them and build.
translation:
  language: ru
  text: 5. Шесть юношей, пришедших вместе с нею, строили квадратную башню. А мириады других людей приносили камни — одни из глубины, другие с земли — и передавали их шести юношам. Те брали их и строили.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τετραγώνῳ
  choice: четырёхугольной
  rationale: Передаёт форму башни естественно по-русски, не уточняя сверх греческого текста, была ли она строго квадратной.
- source_word: μυριάδες ἀνδρῶν
  choice: многие тысячи других людей
  rationale: Множественное μυριάδες выражает неисчислимое множество; «многие тысячи» сохраняет образ и звучит естественно.
- source_word: ἐκ τοῦ βυθοῦ
  choice: из глубины
  rationale: Сохраняет неоднозначность βυθός; ближайший контекст указывает на водную глубину, но сам стих не называет море.
- source_word: ἐκ τῆς γῆς
  choice: с суши
  rationale: В контрасте с водной глубиной γῆ означает сухую землю; «с суши» ясно передаёт это противопоставление.
- source_word: ᾠκοδόμουν
  choice: вели строительство
  rationale: 'Передаёт продолженное действие и избегает неясного русского «строили их»: объектом является башня, а камни служат материалом.'
