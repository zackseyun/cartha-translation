  text: 4. And again she took hold of my hand, raised me up, and seated me on the bench on the left; and she herself sat on the right. And, lifting up a certain bright rod, she says to me, “Do you see a great thing?” I say to her, “Lady, I see nothing.” She says to me, “[You,] look—do you not see opposite you a great tower being built upon the waters with square, shining stones?”
translation:
  language: ru
  text: '4. Она снова взяла меня за руку, подняла и усадила на место на скамье слева, а сама села справа. Затем, подняв какой-то сияющий жезл, она говорит мне: «Видишь великое зрелище?» Я отвечаю ей: «Госпожа, ничего не вижу». Она говорит мне: «Вот,[a] разве ты не видишь напротив себя огромную башню, которую строят на водах из сияющих четырёхугольных камней?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых греческих свидетелях перед словом «вот» стоит дополнительное «ты»; текст в этом месте не вполне устойчив.
    reason: В данной редакции Σὺ заключено в квадратные скобки как сомнительный элемент текста; примечание сохраняет прозрачность текстологической неопределённости без неестественного русского оборота.
lexical_decisions:
- source_word: συμπλέσιον
  choice: скамья
  rationale: По контексту это сиденье, на котором можно разместиться слева или справа; «скамья» естественно и конкретно передаёт предмет.
- source_word: ῥάβδον τινα λαμπράν
  choice: какой-то сияющий жезл
  rationale: «Жезл» сохраняет широкий смысл ῥάβδος и dignified register, не уточняя его назначение; λαμπράν передано как «сияющий».
- source_word: μέγα πρᾶγμα
  choice: нечто великое
  rationale: Сохраняет неопределённость πρᾶγμα и не подменяет выражение конкретным образом башни до того, как она названа.
- source_word: κατέναντί σου
  choice: прямо перед собой
  rationale: Естественная русская передача пространственного значения «напротив тебя / перед тобой» в прямой речи.
- source_word: λίθοις τετραγώνοις λαμπροῖς
  choice: из сияющих четырёхугольных камней
  rationale: Передаёт оба явных признака камней; «четырёхугольных» не сужает τετραγώνοις до строго кубической формы.
theological_decisions:
- issue: Башня строится ἐπὶ ὑδάτων
  choice: строят на водах
  alternative: строят над водами / на воде
  rationale: «На водах» формально сохраняет множественное число и образ исходного текста, не объясняя символ заранее.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной лексикой («госпожа», «жезл»). Историческое настоящее в репликах («говорит», «отвечаю») сохранено как особенность живого повествования оригинала.
