base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/010/003.yaml
  text: 3. After she had said these things, she wanted to depart; but I fell at her feet and asked her by the Lord to show me the vision that she had promised me.
translation:
  language: ru
  text: 3. Сказав это, она хотела уйти, но я пал к её ногам и стал просить её, заклиная её Господом, показать мне видение, которое она обещала.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα εἴπασα
  choice: Сказав это
  rationale: Естественно передаёт обстоятельственный аорист, сохраняя связь с предыдущей речью.
- source_word: ἤθελεν ἀπελθεῖν
  choice: хотела уйти
  rationale: Прямо передаёт намерение удалиться без излишнего усиления.
- source_word: ἠρώτησα
  choice: стал просить
  rationale: В данном контексте глагол означает настойчивую просьбу, а не вопрос; форма с «стал» естественно сочетается с последующим придаточным.
- source_word: κατὰ τοῦ Κυρίου
  choice: ради Господа
  rationale: Передаёт обращение к авторитету Господа как основание настоятельной просьбы; буквальное «Господом» могло бы звучать как клятва и сильнее разрешать смысловую неоднозначность.
- source_word: ἐπιδείξῃ
  choice: показать
  rationale: Нейтральный современный эквивалент со значением дать увидеть обещанное видение.
- source_word: ὃ ἐπηγγείλατο ὅραμα
  choice: видение, которое она обещала
  rationale: Сохраняет отнесение обещания к видению и женский субъект глагола.
theological_decisions:
- issue: Смысл выражения κατὰ τοῦ Κυρίου
  choice: ради Господа
  alternative: заклинал её Господом
  rationale: Выбранная формулировка сохраняет религиозную весомость просьбы, но не превращает неоднозначное выражение в явно оформленную клятву или заклинание.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования; синтаксис плавный, без архаизмов и конфессионально окрашенной терминологии.
