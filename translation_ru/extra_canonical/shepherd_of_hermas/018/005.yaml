base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/005.yaml
  text: She appeared to me, brothers, in the first vision—the one last year—very aged and sitting on a chair. And in the second vision her appearance was younger, but her flesh and her hair were older, and as she stood she spoke to me; and she was more cheerful than before. And in the third vision she was wholly younger and most distinguished in beauty, only her hair was older; and she was cheerful to the end and was seated on a cushioned seat.
translation:
  language: ru
  text: Братья, в первом видении — в прошлом году — она явилась мне очень престарелой и сидела на кресле. Во втором видении её облик был моложе, но плоть и волосы — старее; она стояла и говорила со мной и была радостнее, чем прежде. А в третьем видении она вся стала моложе и была необычайно прекрасна; только волосы у неё оставались старее. Она до конца была радостна и сидела на мягком сиденье.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβυτέρα
  choice: глубокой старухой / как у старухи
  rationale: В контексте трёх меняющихся обликов слово обозначает не просто сравнительно старший возраст, а явно престарелый вид женщины; современная русская формулировка сохраняет контраст с νεωτέρα.
- source_word: καθέδρα
  choice: кресло
  rationale: Обозначает сиденье или стул; «кресло» естественно передаёт отдельное сиденье и отличает его от συμψέλιον в третьем видении, не придавая ему церковно-иерархического смысла.
- source_word: ὄψις
  choice: выглядела
  rationale: Здесь речь о внешнем облике лица или видимой наружности; глагольная передача звучит по-русски естественно и сохраняет противопоставление телу и волосам.
- source_word: ἱλαρωτέρα / ἱλαρά
  choice: веселее / совершенно весела
  rationale: ἱλαρός выражает радостный, светлый, бодрый вид. «Весела» понятно современному читателю и не добавляет отсутствующего в тексте богословского оттенка.
- source_word: κάλλει ἐκπρεπεστάτη
  choice: необычайно прекрасна
  rationale: Передаёт превосходную степень и выдающуюся красоту без тяжеловесного буквального оборота «выдающаяся красотой».
- source_word: συμψέλιον
  choice: мягкое сиденье
  rationale: Редкое слово, по контексту обозначающее сиденье с подушкой или мягкую скамью; нейтральный перевод сохраняет предметный смысл без чрезмерной конкретизации.
theological_decisions:
- issue: Личность явившейся женщины
  choice: сохранено местоимение «она» без пояснения
  alternative: назвать её Церковью или старицей
  rationale: В данном сегменте греческий текст не называет её прямо; пояснение преждевременно раскрыло бы символическое толкование и сняло бы повествовательную неопределённость.
- issue: Обращение ἀδελφοί
  choice: «Братья»
  alternative: «братья и сёстры» или «братия»
  rationale: Формально сохраняется мужская форма исходного обращения; «братья» современно и достойно, тогда как расширенная формула отсутствует в греческом, а «братия» стилистически архаична.
translation_notes:
  register: Современный литературный русский с ясным повествовательным ритмом. Сохранены последовательность трёх видений, контрасты возраста, позы и настроения. Архаизмы и конфессионально нагруженные пояснения исключены.
