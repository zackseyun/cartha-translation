base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/004.yaml
  text: And as she was going, I asked her to reveal to me about the three forms in which she had appeared to me. She answered me and said, “About these, you must ask another, so that it may be revealed to you.”
translation:
  language: ru
  text: 'Когда она уходила, я попросил её рассказать мне о трёх обликах, в которых она мне являлась. Она ответила мне: «Об этом тебе следует спросить другого, чтобы тебе было открыто».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπάγουσαν
  choice: когда она уходила
  rationale: Передаёт обстоятельственный причастный оборот естественно по-русски и сохраняет незавершённость действия.
- source_word: ἀποκαλύψῃ
  choice: открыть ... смысл
  rationale: В данном контексте просьба касается объяснения значения трёх явлений, поэтому явный объект «смысл» делает русскую фразу естественной, не меняя содержания.
- source_word: μορφῶν
  choice: обликов
  rationale: «Облик» естественно обозначает различные виды внешнего явления одной и той же фигуры; «формы» звучало бы более отвлечённо.
- source_word: ἐνεφανίσθη
  choice: являлась
  rationale: Сохраняет визионерский контекст и повторность трёх явлений.
- source_word: ἕτερον
  choice: другого
  rationale: Греческое слово оставляет лицо неопределённым; перевод не уточняет его личность или статус.
theological_decisions:
- issue: Кого обозначает ἕτερον («другого»)?
  choice: Сохранено неопределённое «другого»
  alternative: «кого-то другого» или конкретизация как ангела/Господа
  rationale: Источник не называет этого другого, поэтому богословская или повествовательная конкретизация была бы привнесением.
- issue: Значение откровения о трёх обликах
  choice: Не дано толкование самих обликов
  alternative: Связать их непосредственно с определёнными состояниями Церкви
  rationale: В данном сегменте объяснение ещё не сообщено; перевод сохраняет развитие повествования.
translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанно-достоинственное. Синтаксис слегка упрощён по сравнению с греческим без утраты последовательности действий и сохранением неопределённости слова «другого».
