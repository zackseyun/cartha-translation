base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/003.yaml
  text: X. When she had ceased speaking with me, the six young men who were building came and carried her to the tower, and four others lifted the cushioned seat and carried it also to the tower. I did not see their faces, because they were turned away.
translation:
  language: ru
  text: X. Когда она закончила говорить со мной, пришли шестеро юношей, строивших башню, и отнесли её к башне. Ещё четверо подняли сиденье с подушкой и тоже отнесли его к башне. Я не видел их лиц, потому что они стояли, отвернувшись.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἓξ νεανίσκοι οἱ οἰκοδομοῦντες
  choice: шестеро юношей, строивших башню
  rationale: Причастие означает «строившие»; объект восстанавливается из ближайшего контекста — речь идёт о строительстве башни.
- source_word: συμψέλιον
  choice: сиденье с подушкой
  rationale: Редкое слово обозначает снабжённое подушкой сиденье; описательный перевод понятнее современному читателю и не навязывает более узкий тип мебели.
- source_word: ἀπεστραμμένοι ἦσαν
  choice: они были отвёрнуты
  rationale: Сохранено буквальное пространственное значение и не добавлено отсутствующее в греческом уточнение о направлении.
