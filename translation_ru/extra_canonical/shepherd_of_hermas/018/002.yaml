base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/002.yaml
  text: 'I say to you who lead the church and to the first-seaters: do not become like poisoners. Poisoners carry their drugs in boxes; but you carry your drug and your poison in your heart. You are encrusted and do not wish to cleanse your hearts and to bring your understanding together as one in a pure heart, so that you may receive mercy from the great King. Watch then, children, lest these dissensions of yours deprive you of life. How can you wish to train the Lord’s chosen ones when you yourselves do not have training? Train one another and be at peace among yourselves, so that I also, standing joyfully before the Father, may give an account on behalf of you all to your Lord.'
translation:
  language: ru
  text: 'Говорю вам, предводителям церкви и занимающим первые места: не уподобляйтесь отравителям. Отравители носят свои снадобья в шкатулках, а вы носите своё снадобье и свой яд в сердце. Вы закоснели и не хотите очистить свои сердца и соединить свои помышления воедино в чистом сердце, чтобы получить милость от великого Царя. Итак, смотрите, дети, как бы эти ваши распри не лишили вас жизни. Как же вы хотите наставлять избранных Господа, если сами не наставлены? Наставляйте друг друга и живите в мире между собой, чтобы и я могла, с радостью представ пред Отцом, дать вашему Господу отчёт за всех вас.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς προηγουμένοις τῆς ἐκκλησίας
  choice: предводителям церкви
  rationale: Передаёт руководящую роль без привнесения позднейшего официального церковного титула.
- source_word: τοῖς πρωτοκαθεδρίταις
  choice: занимающим первые места
  rationale: Сохраняет буквальный образ почётных первых сидений и его критическую направленность.
- source_word: τοῖς φαρμακοῖς
  choice: отравителям
  rationale: В контексте φάρμακον и ἰός речь идёт о людях, несущих губительное снадобье или яд; «отравители» естественно сохраняет отрицательный смысл.
- source_word: τὰ φάρμακα ... εἰς τὰς πυξίδας
  choice: свои снадобья в шкатулках
  rationale: «Снадобья» сохраняет неоднозначность φάρμακα между лекарственными составами и ядовитыми средствами; πυξίδες — небольшие коробочки или шкатулки.
- source_word: ἐνεσκιρωμένοι
  choice: вы ожесточились
  rationale: Редкое слово обозначает затвердение или образование твёрдой корки; по-русски «ожесточились» естественно передаёт метафорическое состояние сердца.
- source_word: συνκεράσαι ὑμῶν τὴν φρόνησιν ἐπὶ τὸ αὐτό
  choice: соединить свои помышления воедино
  rationale: Сохраняет образ смешения или соединения умов в единстве, не сводя его лишь к согласию во мнениях.
- source_word: παιδεύειν / παιδείαν
  choice: наставлять / наставлены
  rationale: Передаёт общий корень и широкий смысл воспитания, обучения и исправления без чрезмерно карательного оттенка.
- source_word: εἰρηνεύετε ἐν αὐτοῖς
  choice: живите в мире между собой
  rationale: Местоимение αὐτοῖς, вероятно, является ненормализованным чтением при ожидаемом значении взаимного мира; перевод следует смыслу ближайшего контекста.
theological_decisions:
- issue: Обозначение церковных руководителей
  choice: «предводителям церкви и занимающим первые места»
  alternative: «настоятелям церкви и первопрестольникам»
  rationale: Выбранное выражение не импортирует поздние должностные титулы и сохраняет обличение влиятельных лиц общины.
- issue: Условие получения милости
  choice: «чтобы получить милость от великого Царя»
  alternative: «и тогда великий Царь помилует вас»
  rationale: Сохраняется целевая конструкция ἵνα и формулировка получения милости без уточнения механизма или богословских условий спасения.
- issue: Опасность лишиться жизни
  choice: «как бы эти ваши распри не лишили вас жизни»
  alternative: «как бы из-за распрей вы не лишились вечной жизни»
  rationale: Источник говорит просто τὴν ζωήν; добавление «вечной» сняло бы намеренно неуточнённый смысл.
- issue: Отчёт женщины-Церкви перед Отцом и Господом адресатов
  choice: «чтобы и я, с радостью представ пред Отцом, могла дать вашему Господу отчёт за всех вас»
  alternative: «чтобы я могла радостно предстать перед Отцом и дать Господу отчёт обо всех вас»
  rationale: Сохранены различие между «Отцом» и «вашим Господом», женский род говорящей и оттенок заступнической ответственности ὑπὲρ ὑμῶν.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Синтаксис умеренно формальный, но доступный; сохранены повторения «сердце», «наставлять» и образ яда. Архаические или конфессионально маркированные титулы намеренно исключены.
