base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/001.yaml
  text: Be made holy from all wickedness and from all crookedness. But you do not want to depart from your wickedness. Now then, listen to me and be at peace among yourselves, and look after one another and support one another; and do not alone partake of God’s creatures in an overflow of abundance, but share also with those who are in want. For some, from their many foods, bring weakness upon the flesh and ruin their flesh; but the flesh of those who do not have food is ruined because they do not have enough nourishment, and their body is destroyed. This lack of moderation then is harmful to you who have and do not share with those who lack. Look to the judgment that is coming. Therefore, you who are well-off, seek out the hungry while the tower is not yet finished; for after the tower has been finished you will want to do good, and you will not have a place. So watch, you who pride yourselves in your wealth, lest those in need should groan, and their groaning go up to the Lord, and you
    be shut out together with your useless goods outside the door of the tower.
translation:
  language: ru
  text: 'Освятитесь, удалившись от всякого зла и всякого лукавства. Но вы не хотите отойти от своего зла. Итак, теперь послушайте меня: живите в мире друг с другом, заботьтесь друг о друге и помогайте друг другу. Не пользуйтесь творениями Божьими только для себя, утопая в изобилии, но делитесь и с теми, кто терпит нужду. Ведь одни множеством яств навлекают немощь на свою плоть и губят её, а у тех, кому нечего есть, плоть гибнет от недостатка необходимой пищи, и тело их разрушается. Поэтому такая неумеренность пагубна для вас, имеющих, но не делящихся с нуждающимися. Помните о грядущем суде. Итак, вы, у кого есть достаток, разыскивайте голодных, пока башня ещё не достроена; ведь после того, как башня будет достроена, вы захотите делать добро, но места вам уже не найдётся. Поэтому смотрите, хвалящиеся своим богатством: как бы нуждающиеся не стали стонать и стон их не поднялся к Господу, а вы вместе со своими бесполезными благами не оказались за дверью башни.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁγιασθῆτε ἀπό
  choice: освятитесь, удалившись от
  rationale: Сохраняет идею освящения через отделение от зла; естественнее по-русски, чем буквальное «освятитесь от».
- source_word: πονηρία
  choice: зло
  rationale: Широкое нравственное значение слова сохранено без неоправданного сужения до «злобы» или «порочности».
- source_word: σκολιότης
  choice: коварство
  rationale: В данном нравственном перечне обозначает внутреннюю и поведенческую кривизну, нечестность; «коварство» звучит понятно и достойно.
- source_word: εἰρηνεύετε ἐν ἑαυτοῖς
  choice: живите в мире друг с другом
  rationale: Передаёт взаимный характер призыва естественным современным русским выражением.
- source_word: ἐπισκέπτεσθε
  choice: заботьтесь
  rationale: Здесь речь не просто о посещении, а о деятельном попечении друг о друге.
- source_word: ἀντιλαμβάνεσθε
  choice: помогайте
  rationale: Передаёт практическую поддержку и содействие.
- source_word: τὰ κτίσματα τοῦ Θεοῦ
  choice: творения Божьи
  rationale: Сохраняет буквальный образ созданных Богом благ, употребляемых в пищу.
- source_word: ἐκ καταχύματος
  choice: утопая в изобилии
  rationale: Редкое выражение указывает на чрезмерный, буквально «льющийся через край», достаток; образно и понятно передано по-русски.
- source_word: ἀσυνκρασία
  choice: неумеренность
  rationale: Контекст противопоставляет излишество богатых нехватке у бедных; выбранное слово сохраняет нравственную оценку дисбаланса.
- source_word: οἱ ὑπερέχοντες
  choice: вы, у кого есть достаток
  rationale: Контекстуально речь о людях, располагающих избытком средств, а не о превосходящих по званию.
- source_word: ἐκζητεῖτε
  choice: разыскивайте
  rationale: Сохраняет усиленный смысл деятельного поиска голодных, а не пассивного ожидания просьбы.
- source_word: οὐχ ἕξετε τόπον
  choice: места вам уже не найдётся
  rationale: Сохраняет неоднозначную связь с образом башни и одновременно эсхатологическое предупреждение.
- source_word: '[ἀσχέτων] ἀγαθῶν'
  choice: бесполезными благами
  rationale: 'Передаёт вероятный смысл текстуально сомнительного определения: имущество окажется бесполезным в момент суда.'
theological_decisions:
- issue: Связь милостыни со спасением и грядущим судом
  choice: Сохранено прямое предупреждение о суде и возможности оказаться вне башни без пояснения механизма спасения.
  alternative: Истолковать помощь бедным как условие заслуживания спасения либо только как свидетельство уже имеющейся веры.
  rationale: Греческий текст создаёт сильное нравственно-эсхатологическое напряжение, но сам не формулирует систематического учения о заслуге или оправдании.
- issue: Символ башни
  choice: Образ «башни» оставлен без истолкования.
  alternative: Заменить или пояснить в тексте как «Церковь».
  rationale: Хотя в более широком контексте «Пастыря» башня связана с Церковью, данный фрагмент сохраняет символический образ; его раскрытие внутри перевода было бы интерпретационной вставкой.
- issue: «Творения Божьи» как материальные блага
  choice: Сохранена формулировка источника, а ближайший контекст пищи и богатства направляет понимание.
  alternative: Перевести прямо как «дары Божьи» или «пищу, созданную Богом».
  rationale: 'Буквальный образ богословски значим: потребляемое богатство принадлежит порядку Божьего творения, однако текст не ограничивает выражение одним техническим термином.'
translation_notes:
  register: Современный литературный русский язык с увещевательно-пророческим, но доступным регистром. Синтаксис разбит на ясные фразы без снижения торжественности. Архаизмы вроде «яства» оставлены лишь там, где они поддерживают ритм и не мешают пониманию; обращения и повторные предупреждения источника сохранены.
