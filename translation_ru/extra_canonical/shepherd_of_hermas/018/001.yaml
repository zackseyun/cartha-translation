  revised_text: 'Освятитесь, удалившись от всякого зла и всякого лукавства. Но вы не хотите отойти от своего зла. Итак, теперь послушайте меня: живите в мире друг с другом, заботьтесь друг о друге и помогайте друг другу. Не пользуйтесь творениями Божьими только для себя, утопая в изобилии, но делитесь и с теми, кто терпит нужду. Ведь одни множеством яств навлекают немощь на свою плоть и губят её, а у тех, кому нечего есть, плоть гибнет от недостатка необходимой пищи, и тело их разрушается. Поэтому такая неумеренность пагубна для вас, имеющих, но не делящихся с нуждающимися. Помните о грядущем суде. Итак, вы, у кого есть достаток, разыскивайте голодных, пока башня ещё не достроена; ведь после того, как башня будет достроена, вы захотите делать добро, но места вам уже не найдётся. Поэтому смотрите, хвалящиеся своим богатством: как бы нуждающиеся не стали стонать и стон их не поднялся к Господу, а вы вместе со своими бесполезными благами не оказались за дверью башни.'
