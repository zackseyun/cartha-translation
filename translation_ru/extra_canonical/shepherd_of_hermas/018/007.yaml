base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/007.yaml
  text: 'And answering him I said, “Lord, this only I ask—that concerning the three forms of the aged woman the revelation may become complete.” He answered me and said: “How long will you be senseless? Rather, your double-mindednesses make you senseless, and your heart is not toward the Lord.”'
translation:
  language: ru
  text: 'Я ответил ему: «Господин, я прошу лишь об одном: чтобы откровение о трёх обликах старицы стало полным». Он сказал мне в ответ: «До каких пор вы будете неразумны? Ваше двоедушие[a] делает вас неразумными, и сердце ваше не обращено к Господу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ваши двоедушия» — внутренние колебания и раздвоенность в верности Господу.'
    reason: Греческое διψυχίαι стоит во множественном числе и несёт выразительный образ, который в естественном русском переводе передан собирательным единственным числом.
lexical_decisions:
- source_word: κύριε
  choice: Господин мой
  rationale: Обращение направлено к явившемуся юноше; перевод сохраняет почтительность, но не отождествляет его с Господом, названным далее как τὸν Κύριον.
- source_word: τῶν τριῶν μορφῶν
  choice: три облика
  rationale: μορφή здесь обозначает различные явленные внешние образы одной и той же старицы; «облик» естественнее и точнее контекстуального «форма».
- source_word: ἀποκάλυψις ὁλοτελὴς γένηται
  choice: чтобы мне было до конца открыто, что означают
  rationale: Передаёт просьбу о полном раскрытии смысла трёх обликов естественным русским синтаксисом, не сводя ἀποκάλυψις к отвлечённому существительному.
- source_word: ἀσύνετοι
  choice: неразумны
  rationale: Передаёт недостаток духовного понимания без чрезмерно резкого оттенка слов «глупы» или «безумны».
- source_word: διψυχίαι
  choice: двоедушие
  rationale: Сохраняет образ внутренней раздвоенности и колебания между двумя направленностями, характерный для данного произведения.
- source_word: τὸ μὴ ἔχειν τὴν καρδίαν ὑμῶν πρὸς τὸν Κύριον
  choice: сердце ваше не обращено к Господу
  rationale: Естественно передаёт направленность сердца «к Господу», сохраняя собирательное единственное число исходного текста.
theological_decisions:
- issue: Различение κύριε как обращения к юноше и Κύριον как обозначения Господа
  choice: «Господин мой» в обращении; «Господь» во второй части
  alternative: В обоих случаях «Господь»
  rationale: Контекст не требует отождествлять юношу с Господом; различение предотвращает внесение отсутствующего в тексте богословского вывода.
- issue: Причина неразумия
  choice: Сохранена связь неразумия с двоедушием и необращённостью сердца к Господу
  alternative: Обобщить как недостаток веры
  rationale: Исходный текст называет две конкретные внутренние причины и не сводит их к одной богословской категории.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, раннехристианским повествовательным тоном. Архаическая инверсия «сердце ваше» сохранена как понятная и ритмически уместная; прочая формулировка остаётся современной.
