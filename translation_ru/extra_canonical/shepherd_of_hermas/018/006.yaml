    rationale: Слово выражает сильную печаль, огорчение или скорбь; одна лишь тревога сужает эмоциональный смысл.
  - severity: medium
    issue: Не отражён оттенок ὑπὸ χεῖρα в описании просьбы об откровениях.
    rationale: Трудный оборот, по смыслу, характеризует просьбу как настойчивую/повторную. Это можно передать без спорной детализации.
