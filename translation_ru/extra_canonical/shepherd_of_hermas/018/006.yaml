base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/018/006.yaml
  text: 'About these things I was very much distressed, wanting to know this revelation. And I see the aged woman in a vision of the night, saying to me: “Every inquiry has need of humility; therefore fast, and you will receive what you ask from the Lord.” So I fasted one day, and on that very night a young man appeared to me and said to me: “Since you are asking for revelations in prayer, watch lest by asking for many things you harm your flesh. These revelations are sufficient for you. Are you able to see revelations more powerful than those you have seen?”'
translation:
  language: ru
  text: 'Я был очень огорчён всем этим, желая узнать смысл этого откровения. И вот, в ночном видении я вижу старицу, говорящую мне: «Всякое вопрошание требует смирения; поэтому постись — и получишь от Господа то, о чём просишь».


    Итак, я постился один день, и в ту же ночь мне явился юноша и сказал: «Поскольку ты настойчиво просишь в молитве об откровениях, смотри, как бы, прося слишком многого, не повредить себе. Тебе довольно этих откровений. Разве ты способен увидеть откровения сильнее тех, которые уже видел?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίλυπος
  choice: очень тревожился
  rationale: Передаёт сильную внутреннюю скорбь и беспокойство, естественно звуча в данном контексте желания понять видение.
- source_word: πρεσβυτέραν
  choice: старицу
  rationale: Сохраняет образ пожилой женщины, уже известной из контекста, и соответствует возвышенному повествовательному регистру.
- source_word: ἐρώτησις
  choice: вопрошание
  rationale: Передаёт не просто единичный вопрос, а настойчивое обращение за разъяснением; слово уместно в религиозно-назидательном контексте.
- source_word: ὑπὸ χεῖρα αἰτεῖς ἀποκαλύψεις ἐν δεήσει
  choice: в молитве просишь откровений
  rationale: Передаёт ясное ядро трудного греческого оборота без искусственного уточнения спорного оттенка ὑπὸ χεῖρα.
- source_word: σάρκα
  choice: плоти
  rationale: Сохраняет телесную лексику источника и вероятную связь вреда с постом и чрезмерным аскетическим напряжением.
- source_word: ἰσχυροτέρας
  choice: более могущественные
  rationale: Сохраняет буквальный образ силы откровений, не сводя его без необходимости к интенсивности или устрашающему воздействию.
theological_decisions:
- issue: Связь получения откровения с постом
  choice: 'Сохранена прямая формулировка: «постись — и получишь»'
  alternative: 'Ослабить причинную связь: «постись, и, возможно, получишь»'
  rationale: Греческий текст использует определённую форму будущего времени и не выражает сомнения; добавлять условность было бы толкованием.
- issue: Предостережение о вреде для плоти
  choice: Сохранён телесный смысл без объяснения механизма вреда
  alternative: Уточнить, что вред причиняется чрезмерным постом
  rationale: Контекст позволяет такое понимание, но сам текст прямо не называет пост причиной, поэтому неоднозначность сохранена.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, раннехристианским повествовательным тоном. Историческое настоящее καὶ βλέπω сохранено формой «я вижу» для живости видения. Синтаксис упрощён лишь там, где это необходимо для естественного русского чтения; повторы и назидательная напряжённость источника сохранены.
