base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/004/001.yaml
  text: So when she had finished reading and had risen from the chair, four young men came, lifted the chair, and went away toward the east.
translation:
  language: ru
  text: Когда же она закончила чтение и встала с кресла, пришли четверо юношей, подняли кресло и понесли его на восток.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτέλεσεν ἀναγινώσκουσα
  choice: закончила чтение
  rationale: Естественно передаёт завершение действия чтения, сохраняя смысл греческой конструкции.
- source_word: καθέδρα
  choice: кресло
  rationale: Обозначает сиденье, на котором находилась женщина; «кресло» в данном повествовании звучит естественно и достойно, не внося позднейшего значения церковной кафедры.
- source_word: τέσσαρες νεανίαι
  choice: четверо юношей
  rationale: Точно передаёт число и обозначение молодых мужчин.
- source_word: ἦραν ... καὶ ἀπῆλθον
  choice: подняли ... и понесли
  rationale: В контексте переносимого кресла русское «понесли» естественно выражает движение с поднятым предметом.
- source_word: πρὸς τὴν ἀνατολήν
  choice: на восток
  rationale: Прямо и ясно передаёт направление движения.
