base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/004/002.yaml
  text: Then she called me over, touched my chest, and said to me, "Did my reading please you?" And I said to her, "Lady, these last things please me, but the earlier things are hard and harsh." But she said to me, "These last things are for the righteous, but the earlier are for the nations and for the apostates."
translation:
  language: ru
  text: 'Тогда она подозвала меня, коснулась моей груди и спросила: «Понравилось ли тебе моё чтение?» Я ответил ей: «Госпожа, последнее мне нравится, а то, что было прежде, трудно и сурово». Она же сказала мне: «Последнее — для праведных, а прежнее — для язычников и отступников».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεῖται
  choice: подозвала
  rationale: Передаёт обращённое к рассказчику приглашение приблизиться естественным современным русским глаголом.
- source_word: ἥψατο τοῦ στήθους μου
  choice: коснулась моей груди
  rationale: Прямо сохраняет телесный жест исходного текста без лишнего истолкования.
- source_word: ἡ ἀνάγνωσίς μου
  choice: моё чтение
  rationale: Сохраняет значение публичного чтения ранее упомянутого текста и личное местоимение говорящей.
- source_word: τὰ ἔσχατα / τὰ πρότερα
  choice: последнее / то, что было прежде; прежнее
  rationale: Передаёт контраст между заключительной и предшествующей частями прочитанного, избегая неоправданного эсхатологического оттенка слова «последнее».
- source_word: χαλεπὰ καὶ σκληρά
  choice: трудно и сурово
  rationale: 'Сохраняет два близких, но не тождественных качества: трудность восприятия и суровость содержания.'
- source_word: τοῖς ἔθνεσιν
  choice: для язычников
  rationale: В данном раннехристианском контексте естественно передаёт ἔθνη как людей из народов вне общины, а не просто политические «народы».
- source_word: τοῖς ἀποστάταις
  choice: для отступников
  rationale: Точно передаёт тех, кто отпал или отступил, не уточняя объект отступничества сверх исходного текста.
theological_decisions:
- issue: Адресаты прежней, суровой части чтения
  choice: «для язычников и отступников»
  alternative: «для народов и отпавших»
  rationale: Выбранные слова соответствуют раннехристианскому употреблению, но не уточняют ни меру вины, ни окончательную участь названных групп.
- issue: Значение τὰ ἔσχατα
  choice: заключительная часть чтения
  alternative: эсхатологические «последние события»
  rationale: Непосредственный контекст противопоставляет более позднюю и более раннюю части только что прочитанного текста; перевод не вводит эсхатологического толкования.
translation_notes:
  register: Современный литературный русский с ясной, сдержанно-достоинственной речью. Обращение «Госпожа» сохраняет уважительный титул Κυρία; синтаксис слегка сглажен для естественного русского диалога без утраты повторов и контрастов греческого текста.
