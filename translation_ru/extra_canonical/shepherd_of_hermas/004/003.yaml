base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/004/003.yaml
  text: While she was speaking with me, two men appeared, lifted her by the elbows, and went away to where the chair also was, toward the east. She went away cheerful, and as she was going she said to me, "Take courage, Hermas."
translation:
  language: ru
  text: 'Когда она говорила со мной, появились двое мужчин, подняли её, взяв под локти, и ушли туда, куда отнесли и кресло, — на восток. Она ушла радостной и по дороге сказала мне: «Мужайся, Ерма!»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δύο τινὲς ἄνδρες
  choice: двое мужчин
  rationale: Передаёт неопределённость τινές без ненужного «некие», которое в современном русском звучало бы отчуждённо.
- source_word: ἦραν αὐτὴν τῶν ἀγκώνων
  choice: подхватили её под локти
  rationale: 'Естественно передаёт физическое действие: мужчины подняли или поддержали её, взяв в области локтей; формулировка не уточняет сверх текста, несли ли они её.'
- source_word: ἱλαρά
  choice: радостная
  rationale: Передаёт значение весёлого, светлого расположения духа и согласуется с женским субъектом.
- source_word: Ἀνδρίζου
  choice: Мужайся
  rationale: Краткий традиционный и понятный императив со значением «будь мужествен, держись, ободрись».
- source_word: Ἑρμᾶ
  choice: Ерма
  rationale: Русская форма имени, употребительная для персонажа и названия раннехристианского произведения «Пастырь Ермы».
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского повествования. Сохранены повтор «уходила… уходя» и направление «на восток», поскольку они заметны в греческом тексте; синтаксис слегка упорядочен для естественного русского чтения.
