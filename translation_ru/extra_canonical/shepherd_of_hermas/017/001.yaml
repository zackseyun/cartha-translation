  text: Listen to me, children. I reared you in great simplicity and innocence and dignity, through the mercy of the Lord, who caused righteousness to drip upon you, so that you might be justified and …
translation:
  language: ru
  text: Послушайте меня, дети. Я вырастила вас в великой простоте, незлобии и благопристойности благодаря милости Господа, оросившего вас праведностью, чтобы вы были оправданы и…
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσατέ μου
  choice: Послушайте меня
  rationale: Естественная русская передача повелительного аориста с родительным местоимением при глаголе слушания.
- source_word: τέκνα
  choice: дети
  rationale: Сохраняет прямое материнское обращение говорящей башни-церкви.
- source_word: ἐξέθρεψα
  choice: вырастила
  rationale: Передаёт длительное попечение и воспитание; женский род обусловлен образом говорящей Церкви/башни в контексте.
- source_word: ἐν πολλῇ ἁπλότητι
  choice: в великой простоте
  rationale: Сохраняет этический смысл ἁπλότης — искренность, цельность, отсутствие двоедушия — без чрезмерного истолкования.
- source_word: ἀκακίᾳ
  choice: незлобии
  rationale: Передаёт отсутствие зла и злого умысла точнее, чем более узкое «невинность».
- source_word: σεμνότητι
  choice: благопристойности
  rationale: Отражает достойную, почтенную нравственную серьёзность, не сводя слово к внешней важности.
- source_word: διὰ τὸ ἔλεος τοῦ Κυρίου
  choice: благодаря милости Господа
  rationale: В данном контексте διά с винительным выражает основание или причину.
- source_word: στάξαντος τὴν δικαιοσύνην
  choice: оросившего вас праведностью
  rationale: Сохраняет образ ниспосланной каплями влаги, но выражает его естественным русским глаголом; прямое «накапавшего» звучало бы недостойно и неестественно.
- source_word: ἵνα δικαιωθῆτε
  choice: чтобы вы были оправданы
  rationale: 'Сохраняет пассивную форму и богословски значимую связь δικαιοσύνη / δικαιωθῆτε: «праведность / оправданы».'
theological_decisions:
- issue: Значение δικαιωθῆτε
  choice: были оправданы
  alternative: стали праведными
  rationale: Пассив «были оправданы» формально ближе греческому и сохраняет неоднозначность между провозглашением праведными и приведением к праведности, не разрешая её конфессионально.
- issue: Образ στάξαντος τὴν δικαιοσύνην
  choice: оросившего вас праведностью
  alternative: излившего на вас праведность
  rationale: «Оросившего» удерживает метафору капающей влаги, тогда как «излившего» усиливает объём действия сверх значения στάζω.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Сохранены материнский голос говорящей и незавершённость исходного читательского сегмента посредством многоточия.
