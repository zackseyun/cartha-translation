  text: Blessed are all who practice righteousness; they will never be destroyed.
translation:
  language: ru
  text: 'Блаженны все, кто творит праведность: они не погибнут вовек.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακάριοι
  choice: Блаженны
  rationale: Сохраняет форму торжественного благословения и соответствует раннехристианскому религиозному регистру.
- source_word: οἱ ἐργαζόμενοι τὴν δικαιοσύνην
  choice: кто творит праведность
  rationale: Передаёт деятельный смысл ἐργάζομαι и сохраняет абстрактное понятие δικαιοσύνη, не сужая его до отдельных добрых поступков.
- source_word: οὐ διαφθαρήσονται
  choice: не погибнут
  rationale: В данном эсхатологическом контексте естественно передаёт пассивную форму со значением окончательной гибели; более буквальное «не будут уничтожены» звучало бы тяжеловесно и могло бы излишне конкретизировать действующего.
- source_word: ἕως αἰῶνος
  choice: вовек
  rationale: Краткая и возвышенная формула, точно выражающая неограниченную продолжительность.
theological_decisions:
- issue: Связь праведных дел и окончательной участи
  choice: Сохранена прямая формулировка источника без пояснения причинной связи.
  alternative: Добавить, что дела лишь свидетельствуют о вере или являются условием спасения.
  rationale: Греческий текст утверждает блаженство творящих праведность и их непреходящую участь, но не раскрывает здесь точный характер связи; конфессиональное разъяснение было бы привнесением.
translation_notes:
  register: Современный литературный русский с кратким, торжественным ритмом макаризма. Архаизирующее «вовек» сохранено как понятное и уместное в сакральном контексте; прочая лексика современна.
