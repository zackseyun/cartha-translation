base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/002.yaml
  text: But what saves you is that you did not depart from the living God, and your simplicity and great self-control. These have saved you, if you continue in them, and they save all who do such things and who walk in innocence and simplicity. These prevail over all wickedness and remain unto eternal life.
translation:
  language: ru
  text: Но спасает тебя то, что ты не отступил от живого Бога, а также твоя простота и великое самообладание. Это спасло тебя — если пребудешь в этом — и спасает всех, кто поступает так и ходит в незлобии и простоте. Они одолевают всякое зло и сохраняются для вечной жизни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μὴ ἀποστήναι σε ἀπὸ Θεοῦ ζῶντος
  choice: то, что ты не отступил от живого Бога
  rationale: Сохраняет причинно-субъектную конструкцию греческого текста и естественно звучит по-русски.
- source_word: ἁπλότης
  choice: простота
  rationale: Передаёт нравственную цельность и искренность, не сужая значение до наивности.
- source_word: ἐγκράτεια
  choice: самообладание
  rationale: Современное и понятное обозначение владения собой; не ограничивает смысл только воздержанием от конкретных вещей.
- source_word: ἀκακία
  choice: незлобие
  rationale: Передаёт отсутствие злого умысла и нравственную безвредность, сохраняя отличие от ἁπλότης.
- source_word: κατισχύουσιν πάσης πονηρίας
  choice: одолевают всякое зло
  rationale: Глагол выражает превосходство и победу над злом; «зло» естественно передаёт широкий смысл πονηρία.
- source_word: παραμένουσιν εἰς ζωὴν αἰώνιον
  choice: пребывают для вечной жизни
  rationale: Сохраняет необычную направительную конструкцию εἰς и не заменяет её более определённым богословским толкованием.
theological_decisions:
- issue: Соотношение уже совершившегося спасения и условия постоянства
  choice: «Это спасло тебя — если пребудешь в этом — и спасает всех…»
  alternative: «Это спасёт тебя, если ты останешься таким…»
  rationale: Сохраняются перфект σέσωκέν и условие ἐὰν ἐμμένῃς, то есть напряжение между уже данным спасением и необходимостью продолжать в названных добродетелях.
- issue: Что является действующим субъектом в «спасает»
  choice: Перечисленные ранее обстоятельства и добродетели переданы собирательным «это»
  alternative: Приписать спасение непосредственно Богу
  rationale: Греческий текст грамматически делает названные качества и неотступление субъектом спасения; явное богословское переформулирование устранило бы эту особенность.
- issue: Смысл пребывания «в вечную жизнь»
  choice: «пребывают для вечной жизни»
  alternative: «будут жить вечно»
  rationale: Более гладкая альтернатива усиливает эсхатологическую определённость, которой необычная греческая формулировка прямо не выражает.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Сохранены повторы «спасает/спасло» и «простота», поскольку они структурно значимы в оригинале; синтаксис слегка выровнен для ясности без устранения богословского напряжения.
