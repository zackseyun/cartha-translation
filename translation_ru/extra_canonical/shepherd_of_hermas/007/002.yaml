  source_fidelity: 'В целом переданы все смысловые элементы греческого текста: настоящее σῴζει, перфект σέσωκέν, условие ἐὰν ἐμμένῃς, а также различие между ἀκακία и ἁπλότης. Однако «пребывают для вечной жизни» неудачно передаёт παραμένουσιν εἰς ζωὴν αἰώνιον: по-русски это звучит семантически неясно и не выражает оттенок стойкого сохранения/пребывания, ведущего к вечной жизни.'
