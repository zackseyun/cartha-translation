  terminology: «Живой Бог», «простота», «самообладание», «незлобие» и «вечная жизнь» удачны. «Самообладание» достаточно широко передаёт ἐγκράτεια. Богословское напряжение между уже совершившимся «спасло» и условием продолжения сохранено без конфессионального перетолкования.
