revisions:
- from: А ты, Ерма, больше не держи зла на своих детей и не оставляй без внимания свою сестру[a], чтобы они очистились от своих прежних грехов. Ведь они будут вразумлены справедливым наказанием, если ты не будешь держать на них зла. Злопамятство ведёт к смерти. Ты же, Ерма, перенёс тяжёлые личные скорби из-за проступков твоих домашних, потому что не заботился о них, а пренебрегал ими и погряз в своих дурных деловых заботах.
  to: 'А ты, Ерма, больше не держи зла на своих детях и не оставляй своей сестры[a], чтобы они очистились от прежних своих грехов. Ведь они получат справедливое наставление, если ты не будешь держать на них зла. Памятование зла производит смерть. Ты же, Ерма, перенёс великие личные скорби из-за проступков твоего дома: ты не заботился о них, но пренебрегал ими и оказался вовлечён в свои дурные дела.'
  rationale: Исправления сохраняют смысл и наставительный регистр, но устраняют добавленное «без внимания», смягчают чрезмерно сильное «погряз» и передают πραγματείαι более широко как «дела». «Наставление» передаёт παιδεία как дисциплину, ориентированную на исправление, без указания её субъекта или способа. Полный текст и сноска приведены, поскольку корректировка затрагивает основной текст и содержание примечания.
