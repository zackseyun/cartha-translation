    rationale: ἐάσῃς буквально значит «не оставляй/не допускай» и не указывает, что именно следует делать; добавление «без внимания» интерпретирует эллипсис. Безопаснее сохранить «не оставляй свою сестру» с поясняющей сноской.
  - severity: medium
    issue: «Погряз в своих дурных деловых заботах»
    rationale: συνανεφύρης обозначает смешение или вовлечённость, а не обязательно глубокое моральное падение; πραγματείαι шире «забот» и может включать занятия либо предприятия. Формулировка завышает экспрессию и сужает смысл.
