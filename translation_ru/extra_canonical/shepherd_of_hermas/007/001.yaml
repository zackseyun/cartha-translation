base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/001.yaml
  text: But you, Hermas, no longer bear a grudge against your children, nor allow your sister to continue, so that they may be cleansed from their former sins. For they will be disciplined with righteous discipline, if you do not bear a grudge against them. Bearing a grudge produces death. But you, Hermas, have had great personal tribulations because of the transgressions of your household, because you did not care for them, but neglected them and became entangled in your wicked business dealings.
translation:
  language: ru
  text: 'А ты, Ерма, больше не держи зла на своих детях и не оставляй своей сестры[a], чтобы они очистились от прежних своих грехов. Ведь они получат справедливое наставление, если ты не будешь держать на них зла. Памятование зла производит смерть. Ты же, Ерма, перенёс великие личные скорби из-за проступков твоего дома: ты не заботился о них, но пренебрегал ими и оказался вовлечён в свои дурные дела.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение буквально: «не оставляй свою сестру». Глагол употреблён без дополнения и не уточняет, что именно значит «оставить». Слово «сестра» может обозначать родную сестру; в раннехристианском употреблении оно также может относиться к жене.'
    reason: Сохраняет эллипсис оригинала и отмечает контекстуальную неоднозначность ἀδελφή, не внося в основной текст конкретное толкование.
lexical_decisions:
- source_word: μνησικακήσῃς / μνησικακία
  choice: держать зла / злопамятство
  rationale: Передаёт устойчивую обиду и памятование причинённого зла; сохраняет повтор ключевого понятия, не сужая его до гнева или мести.
- source_word: παιδευθήσονται ... παιδείᾳ δικαίᾳ
  choice: будут вразумлены справедливым наказанием
  rationale: Сочетает исправительную направленность παιδεία с его дисциплинарно-карательным оттенком; повтор корня по-гречески по-русски дословно звучал бы тяжеловесно.
- source_word: ἰδιωτικὰς
  choice: личные
  rationale: Здесь слово характеризует скорби как частные, семейные, в отличие от общественных; современное «личные» естественно выражает этот смысл.
- source_word: τοῦ οἴκου σου
  choice: твоих домашних
  rationale: В контексте речь идёт не о здании, а о людях, составляющих дом и семью Ермы.
- source_word: παρενεθυμήθης
  choice: пренебрегал ими
  rationale: Контекст противопоставляет должную заботу отвлечённости и небрежению; выбранная формулировка передаёт практическое отсутствие внимания к семье.
- source_word: ταῖς πραγματείαις σου ... ταῖς πονηραῖς
  choice: в своих дурных деловых заботах
  rationale: πραγματεία может обозначать занятия, предприятия или деловые хлопоты; перевод сохраняет широту значения и отрицательную оценку πονηραῖς.
theological_decisions:
- issue: Характер «справедливого наказания»
  choice: Не уточнять, кем и каким способом оно будет осуществлено
  alternative: Явно назвать наказание Божьим или церковным
  rationale: В исходном предложении деятель не назван; добавление субъекта преждевременно разрешило бы богословскую неопределённость.
- issue: Обозначение женщины как ἀδελφή
  choice: Перевести буквально как «сестра» и пояснить неоднозначность в сноске
  alternative: Перевести как «жена»
  rationale: Греческое слово буквально означает сестру, хотя в раннехристианской речи и в контексте «Пастыря» возможно понимание как супруги; основной текст не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Повторы «держать зла» сохранены как смысловая связка; архаизмы и конфессионально окрашенные термины по возможности исключены.
