base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/007/004.yaml
  text: 'And you shall say to Maximus: Behold, tribulation is coming, if it seems good to you to deny again. The Lord is near to those who turn to him, as it is written in Eldad and Modat, who prophesied to the people in the wilderness.'
translation:
  language: ru
  text: 'А Максиму скажи: «Вот, грядёт скорбь, если ты снова решишь отречься. Господь близок к тем, кто обращается к Нему, как написано у Елдада и Модата, пророчествовавших народу в пустыне».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλίψις
  choice: скорбь
  rationale: Передаёт бедствие и тяжёлое испытание; это естественный и устойчивый религиозно-литературный эквивалент.
- source_word: ἐάν σοι δοκῇ
  choice: если тебе снова вздумается
  rationale: Сохраняет условность и оттенок личного решения («если сочтёшь / если решишь»), при этом по-русски звучит как серьёзное предостережение.
- source_word: ἀρνεῖσθαι
  choice: отречься
  rationale: Глагол оставлен без добавленного объекта, как и в греческом тексте; контекст подразумевает отречение от веры или Господа, но не уточняет это прямо.
- source_word: τοῖς ἐπιστρεφομένοις
  choice: к тем, кто обращается к Нему
  rationale: Причастие обозначает поворот или возвращение; «обращается к Нему» естественно передаёт покаянно-религиозный смысл, а местоимение делает русскую фразу ясной.
- source_word: Ἐλδὰδ καὶ Μωδὰτ
  choice: Елдада и Модада
  rationale: Имена переданы близко к греческой форме данного произведения; падеж обусловлен русской конструкцией «написано у».
theological_decisions:
- issue: Неуказанный объект отречения
  choice: Сохранить «отречься» без дополнения
  alternative: «отречься от Господа» или «отречься от веры»
  rationale: Источник не называет объект, поэтому его богословское уточнение неоправданно снимало бы исходную недосказанность.
- issue: Направленность обращения в выражении ἐπιστρεφομένοις
  choice: «обращается к Нему»
  alternative: «обращается» или «возвращается»
  rationale: Дательный оборот «Господь близок к...» позволяет естественно выразить подразумеваемую обращённость к Господу, не вводя конфессионально специфического толкования.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Повелительное «скажи» и прямая речь сохранены; синтаксис упрощён лишь настолько, чтобы фраза звучала естественно для современного читателя.
