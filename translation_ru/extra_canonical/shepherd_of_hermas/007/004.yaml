  source_fidelity: 'Смысл передан в целом точно: сохранены предупреждение Максиму, условность повторного отречения, близость Господа к обращающимся и ссылка на Елдада и Модата. Однако «если тебе снова вздумается» добавляет разговорно-пренебрежительный оттенок, которого в нейтральном ἐὰν σοι δοκῇ нет.'
