  text: '‘How so, sir?’ I say. ‘Make it known to me.’ ‘Listen,’ he says: ‘The rich man has much money, but toward the Lord he is poor, being distracted about his wealth, and he has very little confession and intercession toward the Lord; and what he has is small and feeble, and has no power to go up above. When, therefore, the rich man goes to the needy and supplies him with what is necessary, believing that what he does for the needy he will be able to find as his reward from God—for the needy is rich in intercession [and in confession], and his intercession has great power with God—the rich man supplies the needy with everything without hesitation. And the needy, being supplied by the rich, intercedes for him, giving thanks to God on behalf of the one who gives to him. And that one is still more eager concerning the needy, so that he may be unceasing in his life; for he knows that the intercession of the needy is acceptable and rich before God. Therefore both complete the work: the needy
    performs the intercession in which he is rich, [which he received from the Lord;] this he renders to the Lord for the one who supplies him. And likewise the rich man without hesitation provides to the needy the wealth which he received from the Lord. And this is a great work and acceptable with God, because he understood concerning his wealth and worked for the needy out of the gifts of the Lord and fulfilled the Lord’s ministry rightly. Therefore, among people the elm seems not to bear fruit; and they do not know nor understand that, if there should be a drought, the elm, having water, nourishes the vine, and the vine, having unceasing water, gives double fruit, both for itself and for the elm. In the same way also the needy, interceding with the Lord on behalf of the rich...'
translation:
  language: ru
  text: '«Как это, господин?» — спросил я. «Объясни мне». Он сказал: «Слушай. У богатого много денег, но пред Господом он беден, потому что поглощён заботами о своём богатстве. Его исповедание и ходатайственная молитва пред Господом весьма скудны; и то, что у него есть, мало, немощно и не имеет силы подняться ввысь. Поэтому, когда богатый приходит к нуждающемуся и даёт ему всё необходимое, веря, что за сделанное для нуждающегося сможет получить награду у Бога, — ведь нуждающийся богат ходатайственной молитвой [a], и его молитва имеет великую силу пред Богом, — тогда богатый без колебаний снабжает нуждающегося всем.


    А нуждающийся, получая помощь от богатого, ходатайствует за него и благодарит Бога за того, кто ему даёт. Богатый же ещё усерднее заботится о нуждающемся, чтобы тот и впредь не терпел недостатка в своей жизни, ибо знает, что ходатайственная молитва нуждающегося угодна Богу и богата пред Ним.


    Так оба исполняют своё дело: нуждающийся совершает ходатайственную молитву, которой он богат [b], и возносит её Господу за того, кто его снабжает; а богатый, в свою очередь, без колебаний отдаёт нуждающемуся богатство, которое получил от Господа. Это дело велико и угодно Богу, потому что богатый разумно распорядился своим богатством, послужил нуждающемуся дарами Господа и должным образом исполнил служение Господне.


    Людям кажется, что вяз не приносит плода. Они не знают и не понимают, что при засухе вяз, в котором есть влага, питает виноградную лозу; а лоза, постоянно получая влагу, приносит двойной плод — и за себя, и за вяз. Так и нуждающиеся, ходатайствуя пред Господом за богатых…»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Некоторые рукописи добавляют: «и исповеданием».'
    reason: Передаёт заключённое в квадратные скобки чтение καὶ τῇ ἐξομολογήσει как текстуальный вариант, не включая его безоговорочно в основной текст.
  - marker: b
    text: 'Некоторые рукописи добавляют: «которую он получил от Господа».'
    reason: Передаёт заключённую в квадратные скобки фразу ἣν ἔλαβεν ἀπὸ τοῦ Κυρίου как текстуальный вариант.
lexical_decisions:
- source_word: πένης / πτωχός
  choice: нуждающийся
  rationale: В данном нравственном сравнении речь идёт о материально бедном человеке, которому богатый даёт необходимое. «Нуждающийся» естественно передаёт эту роль и избегает уничижительного оттенка слова «нищий».
- source_word: ἔντευξις / ἐντυγχάνειν
  choice: ходатайственная молитва / ходатайствовать
  rationale: Контекст прямо говорит о молитве за дающего; единая передача сохраняет смысловую связь существительного и глагола.
- source_word: ἐξομολόγησις
  choice: исповедание
  rationale: Греческое слово допускает значения исповедания, хвалы и благодарения. Формальное «исповедание» сохраняет исходную широту и не сводит его только к покаянию или благодарности.
- source_word: χορηγεῖν / ἐπιχορηγεῖν
  choice: давать, снабжать, оказывать помощь
  rationale: В разных синтаксических окружениях использованы естественные русские соответствия, сохраняющие общий смысл щедрого материального обеспечения.
- source_word: πτελέα
  choice: вяз
  rationale: Обычное значение греческого названия дерева; оно также соответствует традиционному образу притчи о вязе и виноградной лозе.
- source_word: διακονία
  choice: служение
  rationale: Сохраняет религиозно-нравственный смысл порученного Богом дела без введения позднейшего институционального оттенка.
theological_decisions:
- issue: Связь помощи бедному с наградой от Бога
  choice: Сохранена формулировка надежды богатого получить у Бога награду за помощь нуждающемуся.
  alternative: Ослабить её до общего Божьего одобрения или исключить мотив награды.
  rationale: Греческий текст прямо употребляет μισθός («награда»); перевод не должен заранее разрешать богословское напряжение между милостыней, молитвой и воздаянием.
- issue: Сила молитвы нуждающегося пред Богом
  choice: Передано буквально как «имеет великую силу пред Богом».
  alternative: Переформулировать как гарантированное воздействие на Бога.
  rationale: Текст утверждает силу и приемлемость молитвы, но не описывает её как механически действенную и не даёт основания для более жёсткой догматической формулы.
- issue: Происхождение богатства
  choice: Богатство названо полученным от Господа и предназначенным для служения.
  alternative: Представить само материальное богатство как безусловный знак Божьего благоволения.
  rationale: Исходный текст подчёркивает ответственность распорядителя и употребление даров на помощь нуждающемуся, а не самостоятельную духовную ценность богатства.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Диалог передан естественно, а развёрнутое толкование притчи — ясно и ритмично. Повторы «богатый», «нуждающийся», «Господь» и «ходатайственная молитва» в основном сохранены, поскольку они связывают аргумент. Незавершённость последней фразы отмечена многоточием в соответствии с границей читательского сегмента.
