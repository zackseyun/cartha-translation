base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/048/001.yaml
  text: For to this end the Master has made you rich, that you might carry out these ministries for him; it is far better to buy such fields [and estates] and houses, which you will find in your city when you arrive in it. This luxury is good and cheerful, having no grief nor fear, but having joy. So do not practice the luxury of the nations; for it is unprofitable for you, the servants of God. Rather practice your own luxury, in which you are able to rejoice. For all luxury of this kind is profitable. But the luxury of the nations is bitter and harsh. This parable, then, is set before the servants of God, for the poor and the rich.
translation:
  language: ru
  text: 'Ведь Владыка обогатил вас для того, чтобы вы совершали для Него эти служения. Гораздо лучше приобретать такие поля [и владения][a] и дома — их вы найдёте в своём городе, когда придёте туда. Такая роскошь добра и радостна: в ней нет ни печали, ни страха, но есть радость. Поэтому не предавайтесь роскоши язычников: вам, рабам Божьим, она не на пользу. Предавайтесь лучше своей роскоши, в которой вы можете радоваться. Всякая такая роскошь приносит пользу, а роскошь язычников горька и сурова. Итак, эта притча относится к рабам Божьим — и к бедным, и к богатым.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «и владения» в греческом тексте имеют неуверенную текстовую засвидетельствованность.
    reason: В представленном издании καὶ κτήματα заключено в редакционные квадратные скобки.
lexical_decisions:
- source_word: δεσπότης
  choice: Владыка
  rationale: Передаёт власть и господство, сохраняя отличие от встречающегося далее κύριος («Господь»).
- source_word: διακονίας
  choice: служение
  rationale: В контексте речь идёт о служении Богу посредством употребления богатства; единственное число по-русски звучит естественно и охватывает названные дела.
- source_word: πολυτέλεια
  choice: роскошь
  rationale: Сохранён намеренный контраст между доброй «роскошью» щедрости и роскошью язычников, без подмены толкованием вроде «благотворительность».
- source_word: ἐπιδημήσῃς
  choice: придёте туда
  rationale: Глагол означает прибытие или пребывание в каком-либо месте; нейтральная передача не уточняет, является ли город небесным образом.
- source_word: ἱλαρά
  choice: радостна
  rationale: Передаёт светлый, радостный характер этой «роскоши» и естественно сочетается с последующим упоминанием радости.
- source_word: τῶν ἐθνῶν
  choice: язычников
  rationale: В раннехристианском контексте ἔθνη обозначает народы вне общины верующих; «язычники» — ясный и традиционно точный русский эквивалент.
- source_word: δούλοις τοῦ Θεοῦ
  choice: рабам Божьим
  rationale: Сохранён сильный образ принадлежности и служения Богу, а не смягчён до «служителей».
theological_decisions:
- issue: Значение «своего города»
  choice: Сохранить выражение «в своём городе» без пояснения его природы
  alternative: Передать как «в небесном городе» или «в будущем городе»
  rationale: Греческий текст сам не добавляет определения; вероятный эсхатологический смысл не следует вводить прямо в перевод.
- issue: Образ доброй роскоши
  choice: Сохранить слово «роскошь» в положительном и отрицательном употреблении
  alternative: В положительном употреблении заменить на «щедрость» или «благотворительность»
  rationale: 'Повтор одного греческого слова создаёт богословско-нравственный парадокс: истинная роскошь состоит в правильном употреблении дарованного Богом богатства.'
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Повторы ключевого слова «роскошь» намеренно сохранены; синтаксис слегка упрощён для ясности, не устраняя образности и эсхатологической неоднозначности.
