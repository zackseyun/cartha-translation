base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/003.yaml
  text: So when I heard these things, I wept greatly. But seeing me weeping, he says, ‘Why are you weeping?’ ‘Because, sir,’ I say, ‘I do not know whether I can be saved.’ ‘Why?’ he says. ‘For,’ I say, ‘sir, never yet in my life have I spoken a true word, but I have always lived deceitfully with everyone, and I made my lie appear true before all people; and no one ever contradicted me, but my word was believed. How then,’ I say, ‘sir, can I live, having done these things?’
translation:
  language: ru
  text: 'Услышав это, я горько заплакал. Увидев, что я плачу, он спросил:


    — Почему ты плачешь?


    — Потому, господин, — ответил я, — что не знаю, могу ли спастись.


    — Почему? — спросил он.


    — Ведь до сих пор, господин, — сказал я, — я за всю свою жизнь не произнёс ни слова правды, но всегда со всеми жил лукаво и свою ложь выдавал перед всеми людьми за правду. Никто никогда мне не возражал — моим словам верили. Как же, господин, я могу жить, совершив всё это?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαυσα λίαν
  choice: горько заплакал
  rationale: Передаёт усиленное выражение сильного плача естественным современным русским оборотом, не сводя его только к количественному «много плакал».
- source_word: κύριε
  choice: господин
  rationale: В обращении Ермы к говорящему наставнику это вежливое обращение, а не бесспорный божественный титул; строчная буква сохраняет данное различие.
- source_word: σωθῆναι
  choice: спастись
  rationale: Сохраняет сотериологическую ёмкость греческого глагола без дополнительного уточнения характера спасения.
- source_word: πανοῦργος ἔζησα
  choice: жил лукаво
  rationale: Передаёт нравственно отрицательный смысл поведения — хитрость и обман — не вводя отсутствующего в тексте более узкого обвинения.
- source_word: τὸ ψεῦδός μου ἀληθὲς ἐπέδειξα
  choice: свою ложь выдавал ... за правду
  rationale: 'Естественно передаёт каузативно-презентативный смысл: ложное представлялось другим как истинное.'
- source_word: ἐπιστεύθη τῷ λόγῳ μου
  choice: моим словам верили
  rationale: Идиоматический русский пассивно-безличный эквивалент, сохраняющий смысл доверия речи рассказчика.
- source_word: δύναμαι ζῆσαι
  choice: могу жить
  rationale: Сохраняет буквальную и богословски напряжённую формулировку «жить», не подменяя её повторно глаголом «спастись».
theological_decisions:
- issue: Связь прежней лжи с возможностью спасения и жизни
  choice: Сохранены вопросы «могу ли спастись» и «могу жить» без поясняющего толкования
  alternative: Уточнить как «получить вечную жизнь» или «остаться в живых»
  rationale: Греческий текст различает σωθῆναι и ζῆσαι, но в данном сегменте не разъясняет точный объём последнего; перевод сохраняет эту напряжённость и неоднозначность.
- issue: Личность собеседника в обращении κύριε
  choice: «господин» со строчной буквы
  alternative: «Господь» или «Господи»
  rationale: Контекст представляет непосредственного наставника-собеседника; перевод не отождествляет его с Богом без явного основания в данном месте.
translation_notes:
  register: Современный литературный русский язык; достоинство раннехристианского наставительного текста сочетается с естественным диалогом. Повторяющиеся формулы λέγει/φημί переданы вариативно («спросил», «ответил», «сказал») ради русской связности, при сохранении смены реплик и настойчивой исповедальной интонации.
