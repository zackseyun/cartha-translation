base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/001.yaml
  text: 'Again he says to me: “Love truth, and let all truth go forth from your mouth, so that the spirit which God has caused to dwell in this flesh may be found true before all people, and thus the Lord who dwells in you will be glorified; for the Lord is true in every word, and there is no falsehood with him.'
translation:
  language: ru
  text: 'И снова он говорит мне: «Люби истину, и пусть всякая истина исходит из твоих уст, чтобы дух, которого Бог поселил в этой плоти, оказался истинным перед всеми людьми; и тогда будет прославлен Господь, живущий в тебе, ибо Господь истинен в каждом слове, и нет в Нём никакой лжи».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάλιν μοι λέγει
  choice: И снова он говорит мне
  rationale: Сохранена повествовательная рамка и настоящее историческое время греческого текста.
- source_word: Ἀλήθειαν ἀγάπα
  choice: Люби истину
  rationale: Прямой и естественный перевод повеления без ослабления смысла.
- source_word: πᾶσα ἀλήθεια ... ἐκπορευέσθω
  choice: пусть из твоих уст исходит только истина
  rationale: Русское «только истина» естественно передаёт всеохватность πᾶσα в данном нравственном повелении, сохраняя образ исходящей из уст речи.
- source_word: κατῴκισεν
  choice: поселил
  rationale: 'Передаёт каузативно-переходное употребление: Бог поместил дух для пребывания в плоти.'
- source_word: ἀληθὲς εὑρεθῇ παρὰ πᾶσιν ἀνθρώποις
  choice: был признан истинным перед всеми людьми
  rationale: εὑρεθῇ передано идиоматически как обнаружение или признание качества; «перед всеми людьми» сохраняет παρὰ πᾶσιν ἀνθρώποις.
- source_word: δοξασθήσεται
  choice: прославится
  rationale: Сохраняет будущее время и богословски нейтральное значение пассивной формы.
- source_word: ἀληθινὸς ἐν παντὶ ῥήματι
  choice: истинен в каждом слове
  rationale: Формально сохраняет связь Божьей истинности со всяким Его речением, не заменяя её более общим утверждением.
- source_word: οὐδὲν παρ’ αὐτῷ ψεῦδος
  choice: нет в Нём никакой лжи
  rationale: Естественная русская формулировка, передающая полное отрицание лжи у Бога.
theological_decisions:
- issue: К кому относится «дух» и как понимать его истинность
  choice: «дух, которого Бог поселил в этой плоти, был признан истинным»
  alternative: «Дух, Которого Бог вселил в это тело, оказался Духом истины»
  rationale: 'Строчная буква и буквальная предикация сохраняют неоднозначность: речь может идти о дарованном человеку духе, а не обязательно о прямом именовании Святого Духа. Перевод не вводит отсутствующее в тексте выражение «Дух истины».'
- issue: «Господь, живущий в тебе» и ранее упомянутый дух
  choice: Сохранены как отдельные обозначения без поясняющего отождествления
  alternative: Явно отождествить живущего в человеке Господа с Духом
  rationale: Греческий текст сближает эти выражения, но не формулирует их явного тождества; богословское напряжение следует сохранить.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Синтаксис слегка упрощён для ясности, но последовательность мысли, телесный образ «в этой плоти» и повтор лексики истины и лжи сохранены.
