  source_fidelity: 'В целом смысл передан точно: сохранены повеление любить истину, образ духа, поселённого Богом «в этой плоти», и мотив прославления Господа. Однако «только истина» несколько изменяет πᾶσα ἀλήθεια («всякая истина»), а «прославится Господь» менее ясно передаёт страдательное будущее δοξασθήσεται, чем «будет прославлен Господь».'
