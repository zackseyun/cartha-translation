  source_fidelity: 'Смысл передан в целом точно: сохранены отвержение Господа, образ доверенного вклада, «нелживый» дух, парадокс его возвращения «лживым», осквернение заповеди и повтор обвинения. Однако описательное «теми, кто лишает Его принадлежащего Ему» неестественно и размывает конкретный смысл ἀποστερηταί — незаконно удерживающие/обкрадывающие.'
  naturalness: Текст в целом современный и ясный, но дважды повторённая тяжеловесная конструкция «становятся теми, кто лишает ... принадлежащего Ему» звучит канцелярски и тавтологично. «Вверенное им на хранение» можно сохранить, но слово «вклад» лучше удерживает финансово-правовой образ παρακαταθήκη.
  terminology: «Господь», «заповедь», «дух» и «оскверняют» уместны. Строчная буква в слове «дух» оправданно сохраняет неоднозначность πνεῦμα. «Обкрадывают Господа» естественно передаёт образ ἀποστερηταί без догматического истолкования.
