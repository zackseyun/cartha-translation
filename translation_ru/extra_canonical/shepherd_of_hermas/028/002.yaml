base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/002.yaml
  text: Therefore those who lie reject the Lord and become defrauders of the Lord, not handing back to him the deposit that they received. For they received from him a spirit without falsehood. If they return it false, they have defiled the command of the Lord and have become defrauders.
translation:
  language: ru
  text: Итак, те, кто лжёт, отвергают Господа и обкрадывают Его, не возвращая Ему доверенный им на хранение вклад[a]. Ведь они получили от Него дух, чуждый лжи. Если же они возвращают его лживым, то оскверняют заповедь Господа и обкрадывают Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не передают Ему доверенный вклад, который получили». Далее этим вкладом назван полученный от Бога дух.'
    reason: Поясняет финансово-правовой образ παρακαταθήκη и его связь с последующим предложением, не заменяя образ толкованием в основном тексте.
lexical_decisions:
- source_word: ἀθετοῦσι
  choice: отвергают
  rationale: Передаёт прямой смысл глагола — отвергать, не признавать, нарушать верность — без добавления конфессиональной интерпретации.
- source_word: ἀποστερηταὶ
  choice: те, кто лишает Его принадлежащего Ему
  rationale: Слово обозначает тех, кто незаконно удерживает или присваивает чужое. Описательный перевод сохраняет образ обмана Господа и звучит естественнее, чем буквальное «похитители Господа».
- source_word: παρακαταθήκην
  choice: вверенное им на хранение
  rationale: Сохраняет образ доверенного вклада или залога, который надлежит возвратить; ближайший контекст отождествляет его с полученным от Бога духом.
- source_word: πνεῦμα ἄψευστον
  choice: дух, в котором нет лжи
  rationale: Передаёт значение «нелживый, чуждый лжи» и сохраняет неопределённость относительно того, следует ли понимать πνεῦμα как человеческий дух или как Божий дар/Дух.
- source_word: ψευδὲς ἀποδώσωσιν
  choice: возвращают этот дух лживым
  rationale: 'Сохраняет намеренно напряжённый образ: полученный нелживым дух возвращают ставшим лживым.'
- source_word: ἐμίαναν
  choice: оскверняют
  rationale: Точно передаёт культово-нравственный оттенок глагола «осквернять, загрязнять».
theological_decisions:
- issue: Значение πνεῦμα и употребление прописной буквы
  choice: «дух» со строчной буквы
  alternative: «Дух» как явное указание на Святого Духа
  rationale: Греческий текст сам по себе не различает прописные и строчные буквы в богословском смысле, а контекст допускает несколько пониманий. Строчная буква не навязывает более определённую пневматологическую интерпретацию.
- issue: Образ возвращения полученного от Бога духа
  choice: сохранён буквально-метафорический образ возвращения духа
  alternative: разъяснить как обязанность сохранить душу или Святого Духа незапятнанными
  rationale: Исходный текст оставляет богословское напряжение образа без разъяснения; перевод не должен устранять его посредством догматической конкретизации.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Синтаксис упрощён ровно настолько, чтобы текст был понятен обычному читателю; повтор заключительной формулы сохранён как риторическое обрамление исходного отрывка.
