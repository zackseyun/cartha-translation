revisions:
- from: Итак, те, кто лжёт, отвергают Господа и становятся теми, кто лишает Его принадлежащего Ему, потому что не возвращают Ему вверенное им на хранение[a]. Ведь они получили от Него дух, в котором нет лжи. Если же они возвращают этот дух лживым, то оскверняют заповедь Господа и становятся теми, кто лишает Господа принадлежащего Ему.
  to: Итак, те, кто лжёт, отвергают Господа и обкрадывают Его, не возвращая Ему доверенный им на хранение вклад[a]. Ведь они получили от Него дух, чуждый лжи. Если же они возвращают его лживым, то оскверняют заповедь Господа и обкрадывают Господа.
  rationale: Заменена громоздкая описательная передача ἀποστερηταί на естественное «обкрадывают», сохраняющее образ неправомерного удержания доверенного Господу. В основной текст внесено «вклад», чтобы яснее воспроизвести παρακαταθήκη; сноска соответственно сокращена и уточнена. Неоднозначность слова πνεῦμα и намеренно парадоксальный образ возвращения духа лживым сохранены.
