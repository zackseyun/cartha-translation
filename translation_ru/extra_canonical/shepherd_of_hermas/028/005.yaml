revisions:
- from: «Теперь же, — говорит он, — ты слышишь эти слова. Соблюдай их, чтобы и прежняя ложь, которую ты говорил в своих делах, когда эти слова окажутся правдивыми, тоже стала заслуживать доверия[a], ведь и она может стать заслуживающей доверия. Если соблюдёшь это и отныне будешь говорить только правду, то сможешь обрести для себя жизнь. И всякий, кто услышит эту заповедь и будет воздерживаться от злейшей лжи, будет жить для Бога».
  to: «Итак, — говорит он, — теперь ты это слышишь; соблюдай это, чтобы и то, что ты прежде говорил ложно в своих делах, когда это окажется истинным, стало достоверным; ибо и оно может стать достоверным[a]. Если будешь соблюдать это и отныне говорить одну лишь правду, сможешь обрести себе жизнь. И всякий, кто услышит эту заповедь и воздержится от самой злой лжи, будет жить для Бога».
  rationale: Правка устраняет необязательное сужение смысла до «слов», сохраняет множественность ψεύδη через естественное русское «то, что ... говорил ложно», улучшает синтаксис и оставляет спорное место открытым в тексте и сноске. Смысловых или богословских добавлений не внесено.
