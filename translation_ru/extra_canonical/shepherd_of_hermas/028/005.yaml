base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/005.yaml
  text: ‘Now then,’ he says, ‘you are hearing; keep them, so that even the former lies that you spoke in your dealings, if these are found true, those also may become credible; for those too can become credible. If you keep these and from now on speak all truth, you will be able to gain life for yourself. And whoever hears this command and abstains from the most evil lie will live to God.’
translation:
  language: ru
  text: «Итак, — говорит он, — теперь ты это слышишь; соблюдай это, чтобы и то, что ты прежде говорил ложно в своих делах, когда это окажется истинным, стало достоверным; ибо и оно может стать достоверным[a]. Если будешь соблюдать это и отныне говорить одну лишь правду, сможешь обрести себе жизнь. И всякий, кто услышит эту заповедь и воздержится от самой злой лжи, будет жить для Бога».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза синтаксически и смыслово не вполне ясна. Буквально: «чтобы и прежние лжи, которые ты говорил в своих делах, когда это окажется истинным, стали достоверными». Не вполне определено, к чему относится «это» (τούτων); вероятно, последующая неизменная правдивость человека со временем сделает заслуживающими доверия даже его прежние слова.'
    reason: Сохраняет неясный референт τούτων и парадоксальное сочетание «лжи» с «достоверными», не навязывая единственного толкования.
lexical_decisions:
- source_word: φύλασσε αὐτά
  choice: соблюдай их
  rationale: Глагол означает хранить и исполнять; местоимение во множественном числе естественно отнесено к только что услышанным словам.
- source_word: ἐν ταῖς πραγματείαις σου
  choice: в своих делах
  rationale: Передаёт широкий смысл занятий и деловых взаимоотношений, не сужая выражение исключительно до торговли.
- source_word: πιστὰ γένηται
  choice: стала заслуживать доверия
  rationale: Сохраняет значение πιστός как достоверного или вызывающего доверие и не превращает парадоксальное высказывание в утверждение, будто прежняя ложь буквально стала истиной.
- source_word: πᾶσαν ἀλήθειαν λαλήσῃς
  choice: будешь говорить только правду
  rationale: Естественная русская передача требования говорить всякую истину, то есть неизменно говорить правду.
- source_word: ζήσεται τῷ Θεῷ
  choice: будет жить для Бога
  rationale: Сохраняет направленность дательного оборота и характерную для раннехристианского текста формулу жизни для Бога.
theological_decisions:
- issue: Возможность обрести жизнь после прежней лжи
  choice: сможешь обрести для себя жизнь
  alternative: сможешь спасти свою жизнь
  rationale: περιποιήσασθαι означает приобрести или обрести; перевод не уточняет сверх текста, идёт ли речь о спасении, вечной жизни или нравственном обновлении.
- issue: Парадокс о прежней лжи, которая может стать достоверной
  choice: сохранить формулировку и снабдить сноской
  alternative: истолковать как исправление последствий прежней лжи
  rationale: Греческий текст действительно выражается напряжённо и неоднозначно; молчаливое богословское или нравственное разрешение этой трудности было бы неоправданным.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Диалогическая рамка и повторения оригинала сохранены, но порядок слов слегка выровнен для ясности.
