  source_fidelity: 'В целом смысл передан верно: сохранены повеление хранить наставления, парадоксальная возможность того, что прежняя ложь станет «достоверной», обещание жизни и заключительное предостережение. Однако в русском тексте αὐτά и ταῦτα без достаточных оснований конкретизированы как «эти слова», а греческое множественное ψεύδη передано единственным числом. Генитив абсолютный τούτων εὑρεθέντων ἀληθινῶν остаётся синтаксически и референциально неясным; эту неясность следует сохранить без утверждения, что именно «слова» окажутся правдивыми.'
  naturalness: Фраза «ложь, которую ты говорил в своих делах, когда эти слова окажутся правдивыми» тяжеловесна и синтаксически затруднена. Перестройка с «то, что ты прежде говорил ложно» делает русский текст естественнее, не устраняя парадокс оригинала. «Будешь соблюдать это» лучше согласуется с условной конструкцией и с множественным ταῦτα.
  terminology: «Соблюдать» для φύλασσειν и «обрести себе жизнь» для περιποιήσασθαι σεαυτῷ ζωὴν допустимы. «Достоверным» удачно передаёт πιστός, не превращая ложь в истину. «Жить для Бога» приемлемо для ζήσεται τῷ Θεῷ и не требует конфессионального уточнения.
