base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/028/004.yaml
  text: He says, ‘You are thinking rightly and truly; for it was necessary for you, as a servant of God, to walk in truth, and not to let an evil conscience dwell with the spirit of truth, nor to bring grief upon the holy and true Spirit.’ ‘Never,’ I say, ‘sir, have I heard such words clearly.’
translation:
  language: ru
  text: 'Он говорит: «Ты рассуждаешь правильно и верно. Ведь тебе, как Божьему слуге, надлежало ходить в истине, не позволяя злой совести обитать вместе с духом истины и не огорчая духа, достойного почтения и истинного». Я говорю: «Никогда, господин, я не слышал таких слов так ясно».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλῶς καὶ ἀληθῶς φρονεῖς
  choice: ты рассуждаешь хорошо и верно
  rationale: Передаёт оценку образа мыслей Ермы без излишней буквализации наречий.
- source_word: ἐν ἀληθείᾳ πορεύεσθαι
  choice: ходить в истине
  rationale: Сохраняет раннехристианскую этическую метафору поведения и её библейское звучание.
- source_word: πονηρὰν συνείδησιν
  choice: порочной совести
  rationale: «Порочная» естественно обозначает нравственно дурную совесть и соответствует πονηράν.
- source_word: τῷ πνεύματι τῷ σεμνῷ καὶ ἀληθεῖ
  choice: почтенного и истинного духа
  rationale: σεμνός означает достойный почтения, благоговейный; выбор не подменяет его словом «святой», которого в греческом тексте нет.
- source_word: ἀκριβῶς ἤκουσα
  choice: слышал столь ясно
  rationale: В контексте ἀκριβῶς указывает на ясное, точное восприятие наставления; «столь» естественно связано с τοιαῦτα.
theological_decisions:
- issue: Отождествление «духа истины» и «почтенного и истинного духа» со Святым Духом
  choice: строчная форма «дух»
  alternative: «Дух истины» и «почтенный и истинный Дух» с прописной буквы
  rationale: Греческий текст допускает богословское отнесение к Божьему Духу, но непосредственно говорит о духе, данном и обитающем в человеке; строчная форма сохраняет неоднозначность и не навязывает позднейшую идентификацию.
- issue: Модальность ἔδει
  choice: «надлежало»
  alternative: «было необходимо» или «следовало»
  rationale: Передаёт нравственную обязанность и лёгкий укор, не усиливая её до утверждения о метафизической необходимости.
- issue: Обращение κύριε к наставнику
  choice: «господин»
  alternative: «Господи»
  rationale: В диалоге это уважительное обращение Ермы к ангельскому наставнику, а не прямое обращение к Богу.
translation_notes:
  register: Современный литературный русский с умеренно библейской образностью. Синтаксис сделан ясным, но сохранены ключевые метафоры «ходить в истине» и совместного обитания совести с духом истины. Прописные не используются для разрешения неоднозначной пневматологии текста.
