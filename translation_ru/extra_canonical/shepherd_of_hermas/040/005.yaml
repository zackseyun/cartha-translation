base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/005.yaml
  text: 5. For no spirit given from God is consulted, but, having the power of the Deity, it speaks everything from itself, because it is from above, from the power of the divine Spirit.
translation:
  language: ru
  text: 5. Ибо духа, данного Богом, не вопрошают; но, обладая силой Божества, он изрекает всё от себя, потому что он — свыше, от силы божественного Духа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπερωτᾶται
  choice: не спрашивают совета
  rationale: В контексте речь идёт об обращении к пророческому духу с вопросами ради ответа или предсказания. Такая передача естественна по-русски и сохраняет противопоставление духу, который говорит не по запросу.
- source_word: τὴν δύναμιν τῆς θεότητος
  choice: силой Божества
  rationale: Сохраняет абстрактное существительное θεότης и не сводит выражение к менее точному «Божьей силе».
- source_word: ἀφ' ἑαυτοῦ λαλεῖ
  choice: говорит всё сам от себя
  rationale: Формально передаёт самостоятельность речи духа в противоположность ответам на человеческие вопросы; это не уточняется как независимость от Бога, поскольку следующая фраза указывает на небесный источник.
- source_word: ἄνωθέν ἐστιν
  choice: происходит свыше
  rationale: По контексту обозначает небесное происхождение духа; глагол «происходит» делает русский текст ясным, не устраняя образ «свыше».
- source_word: τοῦ θείου πνεύματος
  choice: Божьего Духа
  rationale: Естественная современная передача прилагательного θεῖος; заглавная буква отражает отнесённость к Богу, не добавляя отдельного догматического уточнения.
theological_decisions:
- issue: Смысл выражения «говорит сам от себя»
  choice: Сохранить буквальное напряжение формулировки и сразу оставить авторское объяснение о происхождении свыше
  alternative: Передать как «говорит по собственной инициативе» или «говорит от Бога»
  rationale: Греческое ἀφ’ ἑαυτοῦ подчёркивает, что истинный дух не ждёт человеческого запроса. Замена на «от Бога» устранила бы подлинную формулировку, а «по собственной инициативе» чрезмерно истолковала бы её.
- issue: θεότης и θεῖον πνεῦμα
  choice: Различить как «Божество» и «Божий Дух»
  alternative: В обоих случаях использовать формы от «Бог» или «божественный»
  rationale: Так сохраняется лексическое различие исходного текста и его богословская напряжённость без навязывания поздней терминологической схемы.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный регистр. Синтаксическое противопоставление οὐκ… ἀλλά передано словами «не…; напротив», чтобы ясно обозначить контраст. Маркеры сносок не требуются.
