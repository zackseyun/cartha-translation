revisions:
- from: 5. Ведь ни у какого духа, данного Богом, не спрашивают совета; напротив, обладая силой Божества, он говорит всё сам от себя, потому что происходит свыше — от силы Божьего Духа.
  to: 5. Ибо духа, данного Богом, не вопрошают; но, обладая силой Божества, он изрекает всё от себя, потому что он — свыше, от силы божественного Духа.
  rationale: Убрано не имеющее прямой опоры в греческом слово «совета» и заменена тяжеловесная конструкция. «Изрекает всё от себя» сохраняет ἀφ’ ἑαυτοῦ, не истолковывая его как независимость от Бога; заключительная часть сохраняет небесное происхождение духа и его связь с силой божественного Духа.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:50:03Z'
review_pass:
  verdict: revise
  source_fidelity: 'Греческое πνεῦμα ἀπὸ Θεοῦ δοθέν передано верно как дух, данный Богом; τὴν δύναμιν τῆς θεότητος — как «сила Божества». Однако ἐπερωτᾶται означает «бывает вопрошаемо / его спрашивают», а добавление «совета» несколько сужает и конкретизирует смысл: речь о вопросах к духу вообще, в том числе ради прорицания. ἀφ’ ἑαυτοῦ сохраняется в формуле «от себя», при этом последующее указание на происхождение свыше удерживает контекстуальное напряжение оригинала.'
  naturalness: «Ни у какого духа ... не спрашивают совета» тяжеловесно и менее естественно для современного литературного русского. Безличная конструкция «духа ... не вопрошают» ясна, стилистически уместна для наставительного текста и не добавляет значения.
  terminology: «Божество» для θεότης и «божественный Дух» для θείου πνεύματος сохраняют лексическое различие оригинала. Строчная форма «божественный» не навязывает догматическую интерпретацию, тогда как «Дух» в контексте допустимо писать с прописной буквы.
  issues:
  - severity: medium
    issue: Добавлено слово «совета» в передаче ἐπερωτᾶται.
    rationale: Оригинал говорит, что дух не бывает предметом вопрошания, не ограничивая вопросы просьбой о совете. Добавление может неоправданно сузить смысл.
  - severity: low
    issue: Конструкция «ни у какого духа ... не спрашивают совета» не вполне естественна.
    rationale: Более прямое «духа ... не вопрошают» точнее воспроизводит объектный синтаксис греческого и лучше звучит по-русски.
  revised_text: 5. Ибо духа, данного Богом, не вопрошают; но, обладая силой Божества, он изрекает всё от себя, потому что он — свыше, от силы божественного Духа.
