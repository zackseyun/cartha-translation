base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/003.yaml
  text: 3. For he, being empty, answers empty men with empty things; for whatever he is asked, he answers according to the emptiness of the person. But he also speaks some true words; for the devil fills him with his own spirit, if perhaps he may be able to tear away some of the righteous.
translation:
  language: ru
  text: '3. Ведь, будучи пустым сам, он и пустым людям отвечает пустыми словами: о чём бы его ни спросили, он отвечает сообразно пустоте человека. Однако он говорит и некоторые истинные слова, ведь дьявол наполняет его своим духом — быть может, ему удастся вырвать кого-нибудь из числа праведных.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κενὸς / κενὰ / κενοῖς / κένωμα
  choice: пустой / пустыми словами / пустым людям / пустота
  rationale: Сохранён намеренный четырёхкратный повтор корня и риторическая игра слов; добавление «словами» естественно по-русски и ясно передаёт подразумеваемое содержание ответа.
- source_word: πρὸς τὸ κένωμα τοῦ ἀνθρώπου
  choice: сообразно пустоте человека
  rationale: Передаёт соответствие ответа внутренней пустоте спрашивающего, не уточняя сверх исходного текста характер этой пустоты.
- source_word: ῥήματα ἀληθῆ
  choice: истинные слова
  rationale: Формально сохраняет различие между отдельными истинными высказываниями и общей истинностью пророчества.
- source_word: ῥῆξαι
  choice: вырвать … из числа
  rationale: Сохраняет резкий образ отрыва или исторжения; «совратить» было бы более толковательным и ослабило бы метафору.
theological_decisions:
- issue: Источник отдельных истинных слов лжепророка
  choice: «дьявол наполняет его своим духом»
  alternative: смягчить до «им движет злой дух»
  rationale: Прямо сохранено утверждение греческого текста о дьяволе и его духе без догматического разъяснения механизма этого воздействия.
- issue: Цель дьявольского воздействия
  choice: «не сможет ли он вырвать кого-нибудь из числа праведных»
  alternative: «чтобы совратить кого-нибудь из праведных»
  rationale: Вопросительно-условный оттенок εἴ τινα δυνήσεται сохранён; текст не превращён в более определённое утверждение о неизбежном успехе.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Повтор «пуст-» намеренно сохранён как центральный риторический приём оригинала; синтаксис слегка упорядочен для ясного чтения вслух.
