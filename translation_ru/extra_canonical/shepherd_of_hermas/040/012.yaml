base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/012.yaml
  text: 12. First, that man who seems to have a spirit exalts himself and wants to have the first seat; and immediately he is presumptuous and shameless and talkative, and lives among many luxuries and many other deceits, and he receives payment for his prophecy; and if he does not receive it, he does not prophesy. Can a divine spirit receive payment and prophesy? A prophet of God cannot do this; rather, the spirit of such prophets is earthly.
translation:
  language: ru
  text: 12. Прежде всего, тот человек, который считает, что имеет дух, превозносит себя и хочет занимать первое место. Он дерзок, бесстыден и многословен; живёт в роскоши и среди многих других обманов, берёт плату за своё пророчество. Если же он не получает платы, то не пророчествует. Разве может божественный дух брать плату и пророчествовать? Пророк Божий не может так поступать; дух таких пророков — земной.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δοκῶν πνεῦμα ἔχειν
  choice: который лишь кажется имеющим дух
  rationale: Передаёт значение δοκῶν как притязания или внешней видимости, контрастирующей с последующим разоблачением.
- source_word: πρωτοκαθεδρίαν
  choice: первое место
  rationale: Естественно передаёт стремление к почётному и главенствующему месту без излишней буквальности «первого сиденья».
- source_word: ἰταμός
  choice: дерзость
  rationale: В контексте самовозвышения обозначает наглую самоуверенность или дерзость.
- source_word: ἐν τρυφαῖς πολλαῖς ἀναστρεφόμενος
  choice: предаётся многочисленным удовольствиям
  rationale: Передаёт образ жизни в роскоши и изнеженных наслаждениях понятным современным русским языком.
- source_word: ἀπάταις
  choice: обманам
  rationale: Сохраняет широкий смысл лжи, обмана и вводящих в заблуждение практик.
- source_word: μισθὸν λαμβάνει
  choice: берёт плату
  rationale: Ясно выражает получение вознаграждения за пророчество.
- source_word: ἐπίγειόν
  choice: земной
  rationale: Сохраняет противопоставление божественного, приходящего свыше, и земного духа в контексте всей главы.
theological_decisions:
- issue: Отношение слова πνεῦμα к человеку и его пророчеству
  choice: Сохранено общее слово «дух» без уточнения «Святой Дух» в первом и последнем предложениях.
  alternative: «духовный дар» или «некий дух»
  rationale: Греческий текст намеренно противопоставляет божественный и земной дух; конкретизация могла бы преждевременно разрешить эту риторическую напряжённость.
- issue: Риторический вопрос о божественном духе
  choice: «Разве может божественный дух брать плату и пророчествовать?»
  alternative: «Может ли Божий Дух получать плату за пророчество?»
  rationale: Сохранена грамматическая связь платы и пророчествования с духом, а не добавлено отсутствующее в тексте «за пророчество».
- issue: Нормативное утверждение о пророке Божьем
  choice: «Пророк Божий не может так поступать»
  alternative: «Божьему пророку невозможно это делать»
  rationale: Естественная русская формулировка сохраняет категорический смысл οὐκ ἐνδέχεται.
translation_notes:
  register: Современный литературный русский язык, ясный и достоинственный. Сохранены резкие нравственные оценки оригинала и противопоставление божественного и земного духа; синтаксис слегка разделён для удобства чтения.
