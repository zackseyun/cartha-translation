  text: 10. Thus the spirit of the Deity will be made manifest. As for the spirit of the Deity of the Lord, this is its power.
translation:
  language: ru
  text: 10. Так станет явным божественный Дух. Такова, следовательно, сила божественного Духа Господа.[1]
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: 'Буквально: «дух божественности Господа». Греческая цепочка родительных допускает несколько близких способов связи слов; перевод сохраняет связь Духа с Господом, не добавляя значение «исходящий».'
    reason: Передаёт синтаксическую неоднозначность оригинала и предотвращает внесение дополнительного смысла.
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς θεότητος
  choice: божественный Дух
  rationale: Естественно передаёт генитивное выражение «Дух божества», не вводя тяжеловесной и потенциально двусмысленной формулы.
- source_word: φανερὸν ἔσται
  choice: станет явным
  rationale: Сохраняет будущность и смысл распознаваемого проявления Духа в описанных обстоятельствах.
- source_word: ἡ δύναμις αὕτη
  choice: вот какова сила
  rationale: Передаёт указательное αὕτη как итог предшествующего описания действия Духа.
- source_word: τοῦ Κυρίου
  choice: исходящего от Господа
  rationale: Греческая фраза синтаксически шероховата; перевод связывает родительный с происхождением Духа в соответствии с ближайшим контекстом об исходящем свыше Духе, сохраняя связь с Господом.
theological_decisions:
- issue: Соотношение выражений «Дух божества» и «Господь»
  choice: «божественный Дух… Дух, исходящий от Господа»
  alternative: «Дух Божества… Дух Божества Господа»
  rationale: Буквальная цепочка родительных по-русски неясна и может звучать как поздняя догматическая формула. Выбранный вариант сохраняет утверждение о божественном происхождении Духа и его связи с Господом, согласуясь с контекстом 40:8–9 и 40:20–21.
translation_notes:
  register: Современный литературный русский; краткая, достоинственная формулировка. Повтор исходного текста частично сохранён, но громоздкая цепочка родительных устранена ради ясности.
