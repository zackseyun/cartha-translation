base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/006.yaml
  text: 6. But the spirit that is consulted and speaks according to the desires of men is earthly and light, having no power; and it does not speak at all unless it is consulted.
translation:
  language: ru
  text: 6. А дух, которого вопрошают и который говорит согласно желаниям людей, — земной и легковесный[a], не имеющий силы; и он вовсе не говорит, если его не вопрошают.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «несерьёзный», «непостоянный». Греческое слово может указывать на легкомыслие и отсутствие духовной весомости.'
    reason: Русское «легковесный» естественно в контексте, но не исчерпывает диапазон значения ἐλαφρόν.
lexical_decisions:
- source_word: τὸ πνεῦμα τὸ ἐπερωτώμενον
  choice: дух, которого вопрошают
  rationale: 'Сохраняет пассивный смысл причастия и связь с предыдущим противопоставлением: Божий дух не нуждается в расспросах, а этот отвечает лишь на обращения к нему.'
- source_word: κατὰ τὰς ἐπιθυμίας τῶν ἀνθρώπων
  choice: согласно желаниям людей
  rationale: Передаёт κατὰ без усиления нравственной оценки; в данном стихе желания прямо не названы злыми.
- source_word: ἐπίγειον
  choice: земной
  rationale: Прямой и естественный эквивалент, сохраняющий противопоставление духу, приходящему свыше.
- source_word: ἐλαφρόν
  choice: легковесный
  rationale: Передаёт переносный оттенок нравственной и духовной несерьёзности лучше, чем буквальное «лёгкий», которое по-русски здесь двусмысленно.
- source_word: δύναμιν μὴ ἔχον
  choice: не имеющий силы
  rationale: Сохраняет повторяющийся в разделе термин δύναμις и подчёркивает бессилие такого духа.
- source_word: ὅλως οὐ λαλεῖ ἐὰν μὴ ἐπερωτηθῇ
  choice: вовсе не говорит, если его не вопрошают
  rationale: Точно передаёт усиление ὅλως и условную конструкцию без добавления толкования.
theological_decisions:
- issue: Характер «духа» в стихе
  choice: Сохранено обозначение «дух» без уточнения «злой» или «ложный».
  alternative: «злой дух», «дух лжепророчества»
  rationale: Контекст связывает его с лжепророком, однако сам греческий текст стиха называет его земным, легковесным и бессильным, не вводя дополнительного определения.
- issue: Значение ἐλαφρόν
  choice: «легковесный» с пояснительной сноской
  alternative: «лёгкий», «непостоянный»
  rationale: Нужно сохранить оценочную многозначность слова и не свести её исключительно к непостоянству либо слабости.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. «Вопрошать» выбрано как умеренно возвышенное, но понятное слово, позволяющее последовательно передать повтор ἐπερωτάω и отличить ритуальное обращение к прорицателю от обычного вопроса.
