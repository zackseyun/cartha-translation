  source_fidelity: Перевод точно передаёт противопоставленное Божьему духу «вопрошаемое» (ἐπερωτώμενον) земное и бессильное духо́вное влияние. «Согласно желаниям людей» сохраняет нейтральную формулировку κατὰ τὰς ἐπιθυμίας τῶν ἀνθρώπων, а «вовсе не говорит, если его не вопрошают» верно передаёт усилительное ὅλως и условие ἐὰν μὴ ἐπερωτηθῇ.
  naturalness: Текст естественен для современного литературного русского и сохраняет наставительный регистр. «Вопрошать» уместно в данном раннехристианском контексте и последовательно передаёт терминологию отрывка. «Легковесный» несколько книжно, но в сочетании с «дух» понятно и стилистически оправдано.
  terminology: «Дух», «земной», «сила» и «вопрошать» переданы последовательно и без конфессионально окрашенных добавлений. Сноска к «легковесный» уместно отмечает семантическую широту ἐλαφρόν, не навязывая одного спорного оттенка.
