  text: 11. “Hear now,” he says, “about the spirit that is earthly and empty and has no power, but is foolish.
translation:
  language: ru
  text: 11. «Теперь послушай, — говорит он, — о духе земном, пустом и бессильном, но глупом».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπίγειος
  choice: земной
  rationale: Прямо передаёт противопоставление духу, приходящему свыше, и сохраняет пространственно-богословский образ оригинала.
- source_word: κενός
  choice: пустой
  rationale: Сохраняет ключевой повторяющийся образ внутренней пустоты и отсутствия истинного содержания.
- source_word: δύναμιν μὴ ἔχοντος
  choice: бессильный
  rationale: Естественно по-русски выражает буквальное «не имеющий силы» без изменения смысла.
- source_word: μωρός
  choice: глупый
  rationale: Передаёт прямую отрицательную характеристику духа; более нейтрально и современно, чем архаичное «неразумный».
theological_decisions:
- issue: Характеристика ложного пророческого духа
  choice: 'Сохранить последовательность определений: земной, пустой, бессильный, глупый'
  alternative: Свести их к обобщению вроде «ложный и бессильный дух»
  rationale: Каждое определение имеет самостоятельное значение в аргументации раздела и поддерживает противопоставление божественному духу свыше.
translation_notes:
  register: Современный литературный русский язык с простой, достойной устной формой наставления. Вводное φησί передано вставкой «говорит он»; конструкция ἀλλὰ ὄντος μωροῦ естественно выражена как «к тому же глупом».
