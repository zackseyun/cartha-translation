review_pass:
  verdict: revise
  source_fidelity: 'Смысл передан в целом точно, но «даже самое малое» меняет грамматический и образный акцент оригинала: τὰ ἄνωθεν ἐλάχιστα — «самые малые [вещи], нисходящие/падающие свыше». В контексте прямо имеются в виду град и капля из предыдущего стиха. «Божий Дух» допустим по контексту, однако греческое τὸ πνεῦμα τὸ θεῖον буквально и терминологически нейтральнее передать как «божественный дух», без конфессионально закреплённой капитализации.'
  naturalness: Русский текст звучит естественно и наставительно. «Держись подальше» разговорнее, чем общий возвышенно-наставительный регистр; «сторонись другого» естественнее и ближе к ἀπέχου.
  terminology: 'Для τὸ πνεῦμα τὸ θεῖον следует сохранить «божественный дух» (со строчной буквы): это повторяемое в данном разделе различение божественного и земного духа и не требует отождествления с позднейшей терминологией «Божий Дух». «Веруй этому духу» хорошо передаёт πίστευε с дательным и сохраняет наставительный регистр.'
  issues:
  - severity: medium
    issue: «Божий Дух» вместо «божественный дух»
    rationale: Хотя контекст связывает дух с Богом и с тем, что приходит свыше, τὸ πνεῦμα τὸ θεῖον имеет буквальное значение «божественный дух». Прописная буква и формула «Божий Дух» создают более конкретную конфессиональную идентификацию, чем необходимо для передачи текста.
  - severity: low
    issue: «даже самое малое, падая свыше»
    rationale: Оригинал говорит о «самых малых [вещах], падающих свыше», а не вводит уступительное «даже». Более прямое множественное выражение яснее сохраняет отсылку к граду и капле.
  - severity: low
    issue: «держись подальше»
    rationale: Смысл ἀπέχου передан, но формула несколько разговорна; «сторонись» точнее поддерживает литературно-наставительный тон.
  revised_text: 21. Итак, ты видишь, что самые малые вещи, падающие свыше на землю, обладают великой силой. Так и божественный дух, приходящий свыше, силён. Веруй этому духу, а другого сторонись».
