base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/017.yaml
  text: 21. You see, then, that things from above, though very small when they fall upon the earth, have great power; so also the divine spirit that comes from above is powerful. Trust in this spirit, but keep away from the other.”
translation:
  language: ru
  text: 21. Итак, ты видишь, что самые малые вещи, падающие свыше на землю, обладают великой силой. Так и божественный дух, приходящий свыше, силён. Веруй этому духу, а другого сторонись».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἄνωθεν ἐλάχιστα
  choice: даже самое малое, падая свыше
  rationale: Передаёт субстантивированное множественное число естественно по-русски и сохраняет связь с примерами градины и капли в предыдущем стихе.
- source_word: τὸ πνεῦμα τὸ θεῖον
  choice: Божий Дух
  rationale: В данном противопоставлении речь идёт о Духе, приходящем от Бога; прописная буква уместна по контексту, но формулировка не добавляет позднейших догматических уточнений.
- source_word: δυνατόν ἐστι
  choice: силён
  rationale: Кратко и прямо воспроизводит утверждение о силе Духа, созвучное μεγάλην δύναμιν ἔχει в первой части.
- source_word: πίστευε
  choice: верь
  rationale: Сохраняет прямой повелительный смысл, а также намеренную смысловую напряжённость между верой Духу и доверием к нему.
- source_word: ἀπέχου
  choice: держись подальше
  rationale: Естественный современный русский эквивалент призыва избегать и не иметь связи с другим, земным духом.
theological_decisions:
- issue: Референт выражения τὸ πνεῦμα τὸ θεῖον
  choice: Божий Дух
  alternative: божественный дух
  rationale: Контекст неоднократно описывает этот Дух как данный Богом и приходящий свыше. Выбор сохраняет личностно-религиозное звучание, не вводя дополнительной тринитарной терминологии.
- issue: Значение πίστευε с дательным τούτῳ τῷ πνεύματι
  choice: верь этому Духу
  alternative: доверяй этому Духу
  rationale: «Верь» ближе к обычному религиозному употреблению глагола πιστεύω и сохраняет возможный более широкий смысл, не сводя его лишь к практическому доверию.
translation_notes:
  register: Современный литературный русский язык с кратким, наставительным и dignified тоном. Синтаксис слегка упрощён ради ясности, при этом сохранены противопоставление небесного и земного духов и образ силы того, что приходит свыше.
