base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/009.yaml
  text: 9. Therefore, when the man who has the divine spirit comes into a gathering of righteous men who have faith in the divine Spirit, and an intercession is made to God by the gathering of those men, then the angel of the prophetic spirit who is assigned to him fills the man; and being filled with the holy Spirit he speaks to the multitude as the Lord wills.
translation:
  language: ru
  text: 9. Итак, когда человек, имеющий Божественного Духа, приходит в собрание праведных мужей, верующих в Божественного Духа[a], и собрание этих мужей возносит к Богу молитву, тогда ангел пророческого духа, пребывающий при этом человеке, наполняет его. И человек, исполнившись Святого Духа, говорит всем собравшимся так, как желает Господь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «имеющих веру, исходящую от Божественного Духа». Греческое выражение допускает обе смысловые связи.'
    reason: Сохраняет неоднозначность родительного оборота πίστιν θείου πνεύματος.
lexical_decisions:
- source_word: συναγωγή
  choice: собрание
  rationale: В данном контексте слово обозначает собрание людей, а не обязательно учреждение или здание синагоги.
- source_word: ἔντευξις
  choice: возносит молитву
  rationale: Передаёт обращённое к Богу моление; русское «ходатайство» было бы уже и могло бы привнести не выраженный прямо объект ходатайства.
- source_word: ὁ κείμενος πρὸς αὐτόν
  choice: пребывающий при этом человеке
  rationale: Сохраняет образ ангела, находящегося при человеке, не усиливая его до административного «назначенный ему».
- source_word: εἰς τὸ πλῆθος
  choice: всем собравшимся
  rationale: Естественно передаёт обращение к множеству присутствующих в описанном собрании.
theological_decisions:
- issue: Значение πίστιν θείου πνεύματος
  choice: верующих в Божественного Духа
  alternative: имеющих веру, исходящую от Божественного Духа
  rationale: Родительный падеж допускает несколько смысловых связей. Контекст противопоставляет праведных людей двоедушным и поддерживает понимание веры, направленной на Божественного Духа, однако неоднозначность отмечена в сноске.
- issue: Соотношение пророческого духа, ангела и Святого Духа
  choice: сохранены все три обозначения без отождествления или систематического объяснения
  alternative: свести их к одному действующему лицу
  rationale: Греческий текст различает «ангела пророческого духа» и «Святого Духа»; перевод не должен устранять эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Сохранено «праведных мужей», поскольку ἀνδρῶν прямо обозначает мужчин; синтаксис упрощён делением последней части на два предложения без изменения последовательности мысли.
