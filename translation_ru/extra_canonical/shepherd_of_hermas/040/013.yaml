base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/013.yaml
  text: 13. Then, he does not come near a gathering of righteous men at all, but avoids them. He clings to the double‑minded and the empty, and he prophesies to them in a corner, and deceives them by speaking everything according to their desires, emptily; for he also answers the empty. For an empty vessel, placed together with empty ones, is not broken, but they agree with one another.
translation:
  language: ru
  text: 13. Затем он вовсе не приближается к собранию праведных, но избегает их. Он держится двоедушных и пустых, пророчествует им по углам и обманывает их, говоря им всё по их желаниям — пусто; ведь и отвечает он пустым. Ибо пустой сосуд, поставленный вместе с пустыми сосудами, не разбивается, но они согласуются друг с другом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψύχοις
  choice: двоедушных
  rationale: Сохраняет образ внутренней раздвоенности и колебания, характерный для всего произведения, не сводя его лишь к сомнению.
- source_word: κενοῖς / κενῶς / κενὸν
  choice: пустых / пустые слова / пустой
  rationale: Повтор корня κεν- намеренно сохранён, поскольку он связывает людей, их речи и заключительный образ сосуда.
- source_word: κατὰ γωνίαν
  choice: где-нибудь в углу
  rationale: Передаёт буквальный образ скрытого, частного пророчествования и звучит естественно по-русски.
- source_word: κολλᾶται
  choice: держится
  rationale: Естественно выражает устойчивую привязанность и выбор общества без излишне физического оттенка буквального «приклеивается».
- source_word: συμφωνοῦσιν ἀλλήλοις
  choice: они согласуются друг с другом
  rationale: Сохраняет смысл взаимного соответствия и согласия, не добавляя отсутствующего в тексте объяснения метафоры.
theological_decisions:
- issue: Противопоставление истинного пророчества ложному
  choice: Сохранены нравственные и общинные признаки ложного пророка без поясняющих добавлений.
  alternative: Истолковать «собрание праведных» как конкретный церковный чин или конфессиональную структуру.
  rationale: Греческий текст говорит об общем собрании праведных и не уточняет его институциональную форму.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном. Сохранены риторические повторы «пустой/пустые» и образ пустых сосудов; синтаксис слегка выровнен для ясного чтения вслух.
