base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/002.yaml
  text: 2. These, then, the double‑minded, come to him as to a magician and ask him what will happen to them; and that false prophet, having in himself no power of a divine spirit, speaks with them according to their questions [and according to the desires of their wickedness], and fills their souls as they desire.
translation:
  language: ru
  text: 2. Итак, эти двоедушные приходят к нему, как к магу, и спрашивают его, что с ними будет. А этот лжепророк, не имея в себе никакой силы божественного духа, говорит с ними сообразно их вопросам[a] и наполняет их души тем, чего они сами желают.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях добавлено: «и сообразно желаниям их порочности».'
    reason: 'Сохраняет отмеченный в греческом издании сомнительный вариант: καὶ κατὰ τὰς ἐπιθυμίας τῆς πονηρίας αὐτῶν.'
lexical_decisions:
- source_word: δίψυχοι
  choice: двоедушные
  rationale: Сохраняет характерный для раннехристианской литературы образ внутренней раздвоенности и колебания, не сводя его лишь к сомнению.
- source_word: μάγον
  choice: чародей
  rationale: Передаёт обращение к человеку, от которого ожидают оккультного предсказания; в современном русском звучит естественнее, чем транслитерация «маг» в данном контексте.
- source_word: τί ἄρα ἔσται αὐτοῖς
  choice: что с ними будет
  rationale: Естественно передаёт вопрос о собственной будущей участи.
- source_word: δύναμιν πνεύματος θείου
  choice: силы Божьего Духа
  rationale: Передаёт качественное значение θείου и сохраняет связь с последующим противопоставлением истинного и ложного пророческого духа.
- source_word: κατὰ τὰ ἐπερωτήματα αὐτῶν
  choice: сообразно их вопросам
  rationale: Сохраняет мысль, что ответы лжепророка формируются запросами спрашивающих.
- source_word: πληροῖ τὰς ψυχὰς αὐτῶν, καθὼς αὐτοὶ βούλονται
  choice: наполняет их души тем, чего они сами желают
  rationale: Воспроизводит образ наполнения душ и смысл угождения желаниям слушателей без добавочного уточнения содержания.
theological_decisions:
- issue: Значение πνεύματος θείου
  choice: Божьего Духа
  alternative: божественного духа
  rationale: Контекст различает дух, происходящий от Бога, и земной ложный дух; прописная буква и притяжательная конструкция ясно выражают эту связь, не добавляя конфессиональной детализации.
- issue: Текст в квадратных скобках καὶ κατὰ τὰς ἐπιθυμίας τῆς πονηρίας αὐτῶν
  choice: Не включать в основной текст, отметить в сноске как вариант текста
  alternative: Включить в основной текст в квадратных скобках
  rationale: Скобки в исходном издании указывают на текстологическую неуверенность; вынос в примечание сохраняет вариант, не придавая ему равного статуса без оговорки.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Термин «двоедушные» намеренно сохранён как выразительный повторяющийся образ; синтаксис слегка упрощён ради ясности, но логика и напряжение греческого текста сохранены.
