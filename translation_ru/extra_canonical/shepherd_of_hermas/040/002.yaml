  - severity: low
    issue: «Чародей» для μάγος
    rationale: Слово возможно, однако в современном русском тяготеет к фольклорной сказочности. «Маг» точнее передаёт античный контекст человека, к которому обращаются за предсказанием.
  - severity: low
    issue: Тяжеловесная вставная конструкция «эти люди, двоедушные»
    rationale: Эпитет в греческом непосредственно определяет группу; «эти двоедушные» естественнее и не меняет акцента.
