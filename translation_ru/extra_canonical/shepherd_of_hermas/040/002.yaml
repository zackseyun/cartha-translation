review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: δίψυχοι — люди внутренне раздвоенные; они обращаются к лжепророку как к магу, а тот, не обладая силой божественного духа, отвечает применительно к их вопросам и угождает их желаниям. Однако «Божьего Духа» чрезмерно конкретизирует греческое πνεύματος θείου, где стоит неопределённое «божественного духа»; в данном месте это важно сохранить, поскольку далее автор противопоставляет характеры духов.'
  naturalness: Текст в целом литературный. Порядок «эти люди, двоедушные» несколько тяжеловесен; естественнее «эти двоедушные». «Как к чародею» допустимо, но «как к магу» точнее соответствует μάγος и не вызывает сказочно-фольклорных ассоциаций.
  terminology: '«Двоедушные» удачно сохраняет устойчивый для данного сочинения образ δίψυχοι. «Лжепророк» точен. «Божественный дух» следует писать со строчной буквы и без притяжательной конкретизации: это наиболее близко к θείου и не навязывает интерпретацию.'
  issues:
