  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/015.yaml
  text: 19. “How,” I say, “sir, can these things be? For you have said both these things are impossible.” “As these, then, are impossible, so also the spirits that are earthly are impossible and inert.
translation:
  language: ru
  text: '19. Я спросил: «Как, господин, такое может быть? Ведь ты сказал, что и то и другое невозможно». Он ответил: «Как это невозможно, так и земные духи бессильны и бездейственны».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: господин
  rationale: Уважительное обращение ученика к наставнику; сохраняет социально-речевой оттенок греческого слова без обязательного отождествления с обращением к Богу.
- source_word: ἀδύνατα / ἀδύνατά
  choice: невозможно / бессильны
  rationale: В первой реплике слово обозначает невозможность двух ранее названных действий; применительно к земным духам контекст требует смыслового оттенка отсутствия силы. Различие передано естественно по-русски без устранения греческой игры на одном корне.
- source_word: ἀδρανῆ
  choice: бездейственны
  rationale: Передаёт отсутствие действенной силы и способности произвести результат, дополняя «бессильны».
- source_word: τὰ πνεύματα τὰ ἐπίγεια
  choice: земные духи
  rationale: Прямой и естественный эквивалент, сохраняющий противопоставление духу, приходящему свыше.
theological_decisions:
- issue: Характер бессилия земных духов
  choice: «бессильны и бездейственны»
  alternative: «невозможны и бездеятельны»
  rationale: Буквальное повторение «невозможны» применительно к духам неестественно и может ошибочно означать, что они не существуют. Контекст утверждает не их несуществование, а отсутствие у них подлинной силы.
translation_notes:
  register: 'Современный литературный русский с достоинством раннехристианского наставительного диалога. Синтаксис сделан естественным, а повтор греческого ἀδύνατος передан контекстуально: «невозможно» и «бессильны».'
