  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/016.yaml
  text: 20. Take now the power that comes from above. Hail is a very small pellet, and when it falls on a man’s head, how much pain it causes! Or again, take a drop that falls from the roof tile to the ground, and it bores through the stone.
translation:
  language: ru
  text: 20. Рассмотри теперь силу, приходящую свыше. Градина — мельчайшая крупинка; когда она падает человеку на голову, сколько боли она причиняет! Или возьми каплю, которая падает с кровельной черепицы на землю и пробивает камень.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λάβε
  choice: возьми для примера
  rationale: В данном рассуждении повеление вводит наглядный пример; такой перевод естественно передаёт ход мысли, не меняя её содержания.
- source_word: ἡ χάλαζα ἐλάχιστόν ἐστι κοκκάριον
  choice: градина — совсем маленькая крупинка
  rationale: Сохраняет образ отдельной градины и подчёркнуто малый размер, выраженный словами ἐλάχιστον и κοκκάριον.
- source_word: ἀπὸ τοῦ κεράμου
  choice: с кровельной черепицы
  rationale: Κέραμος здесь обозначает черепицу крыши; уточнение «кровельной» устраняет возможное понимание как материала вообще.
- source_word: τρυπᾷ τὸν λίθον
  choice: протачивает камень
  rationale: Передаёт длительное воздействие падающей капли, которая в итоге проделывает углубление или отверстие в камне.
theological_decisions:
- issue: Источник силы
  choice: сила, приходящая свыше
  alternative: вышняя сила
  rationale: Сохраняет пространственно-богословский образ ἄνωθεν и связь со следующим абзацем, не вводя дополнительного конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с ясным, наставительным ритмом. Образы градины и капли сохранены буквально; синтаксис слегка выровнен для естественного русского чтения.
