base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/004.yaml
  text: 4. Therefore, as many as are strong in the faith of the Lord, having put on the truth, do not cling to such spirits, but keep away from them. But those who are double‑minded and often repent practice divination like the nations and bring a greater sin upon themselves by practicing idolatry; for the one who consults a false prophet about any matter is an idolater, empty of the truth and foolish.
translation:
  language: ru
  text: 4. Итак, те, кто твёрды в вере в Господа и облеклись в истину, не связываются с такими духами, но держатся от них подальше. А те, у кого душа раздвоена и кто часто кается, гадают, как и язычники, и навлекают на себя ещё больший грех, впадая в идолопоклонство. Ведь тот, кто спрашивает лжепророка о каком-либо деле, — идолопоклонник, лишённый истины и неразумный.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰσχυροί εἰσιν ἐν τῇ πίστει τοῦ Κυρίου
  choice: твёрд в вере в Господа
  rationale: Передаёт силу и устойчивость в вере естественным современным русским выражением; родительный τοῦ Κυρίου сохранён без излишнего уточнения.
- source_word: ἐνδεδυμένοι τὴν ἀλήθειαν
  choice: облёкся в истину
  rationale: Сохранён образ облачения, значимый для раннехристианской нравственной речи.
- source_word: οὐ κολλῶνται
  choice: не пристают
  rationale: Передаёт буквальный смысл «не прилепляются, не связываются» и хорошо сочетается с духами как опасным влиянием.
- source_word: δίψυχοι
  choice: двоится душой
  rationale: Сохранён образ внутренней раздвоенности, а не сведён к простой нерешительности или сомнению.
- source_word: πυκνῶς μετανοοῦσι
  choice: часто кается
  rationale: Прямая передача частотности; контекстуально речь идёт о повторяющемся покаянии без устойчивости.
- source_word: μαντεύονται
  choice: гадают
  rationale: Естественно передаёт обращение к прорицанию и согласуется с последующим вопрошанием лжепророка.
- source_word: τὰ ἔθνη
  choice: язычники
  rationale: В данном раннехристианском противопоставлении это точнее и естественнее, чем буквальное «народы».
- source_word: κενὸς ἀπὸ τῆς ἀληθείας
  choice: чуждый истине
  rationale: Идиоматическая передача отсутствия истины в человеке; избегает неестественного «пуст от истины».
- source_word: ἄφρων
  choice: неразумный
  rationale: Достоинная и понятная передача нравственно окрашенного «безрассудный, глупый».
theological_decisions:
- issue: Связь гадания с идолопоклонством
  choice: Сохранено прямое утверждение, что обращающийся к лжепророку является идолопоклонником.
  alternative: Смягчить до «поступает подобно идолопоклоннику».
  rationale: Греческий текст употребляет прямую именную конструкцию εἰδωλολάτρης ἐστίν; смягчение устранило бы нравственно-богословскую резкость оригинала.
- issue: Характер повторного покаяния
  choice: «часто кается» без пояснения искренности или неискренности.
  alternative: «постоянно кается, но не исправляется».
  rationale: Последнее уточнение возможно по контексту, но отсутствует в данной фразе; сохранена напряжённость текста без добавочного толкования.
translation_notes:
  register: Современный литературный русский с сохранением раннехристианских образов «облечься в истину» и «двоиться душой». Синтаксис разделён на удобочитаемые фразы, но причинно-следственная структура греческого текста сохранена.
