  to: 4. Итак, те, кто твёрды в вере в Господа и облеклись в истину, не связываются с такими духами, но держатся от них подальше. А те, у кого душа раздвоена и кто часто кается, гадают, как и язычники, и навлекают на себя ещё больший грех, впадая в идолопоклонство. Ведь тот, кто спрашивает лжепророка о каком-либо деле, — идолопоклонник, лишённый истины и неразумный.
