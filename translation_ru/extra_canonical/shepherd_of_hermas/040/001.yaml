  text: 1. He showed me men sitting on a bench, and another man sitting on a chair. And he says to me, “Do you see the ones sitting on the bench?” “I see, sir,” I say. “These,” he says, “are faithful; and the one sitting on the chair is a false prophet who destroys the understanding of the servants of God—of the double‑minded, not of the faithful.
translation:
  language: ru
  text: '1. Он показал мне людей, сидящих на скамье, и другого человека, сидящего на кресле. И говорит мне:


    — Видишь тех, кто сидит на скамье?


    — Вижу, господин, — отвечаю я.


    — Они верные, — говорит он, — а сидящий на кресле — лжепророк, который губит разумение двоедушных[a] рабов Божьих, но не верных.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с двойной душой»; то есть внутренне раздвоенных, колеблющихся.'
    reason: Передаёт образную структуру δίψυχος и поясняет редкое для современного читателя слово «двоедушный».
lexical_decisions:
- source_word: συμψέλλιον
  choice: скамья
  rationale: Обозначает место для совместного сидения нескольких человек; «скамья» естественно передаёт противопоставление отдельному почётному креслу.
- source_word: καθέδρα
  choice: кресло
  rationale: Передаёт отдельное сиденье и заметное положение лжепророка, не привнося позднейшего церковного значения слова «кафедра».
- source_word: διάνοια
  choice: разумение
  rationale: Сохраняет смысл внутренней способности мыслить и понимать; более конкретно, чем общее «разум», и уместно в возвышенном повествовательном регистре.
- source_word: δίψυχος
  choice: двоедушный
  rationale: Сохраняет выразительный состав греческого слова и его раннехристианский смысл внутренней раздвоенности и колебания, не сводя его лишь к сомнению.
- source_word: κύριε
  choice: господин
  rationale: В обращении Ермы к наставнику это уважительное обращение; строчная буква не отождествляет собеседника с Господом Богом.
theological_decisions:
- issue: Кого губит лжепророк
  choice: '«рабов Божьих: двоедушных, но не верных»'
  alternative: «губит разум двоедушных рабов Божьих, но не верных»
  rationale: 'Сохранено напряжение греческой конструкции: двоедушные также названы рабами Божьими, однако противопоставлены верным; перевод не исключает их из Божьего народа.'
- issue: Значение ἀπόλλυσι применительно к διάνοια
  choice: «губит разумение»
  alternative: «развращает мысли»
  rationale: Выбран сильный глагол, соответствующий буквальному «губит/уничтожает», без ослабления духовной опасности и без добавления отсутствующей в тексте нравственной окраски «развращения».
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Диалог оформлен естественно; настоящее историческое время («говорит», «отвечаю») сохранено вслед за греческим текстом. Контраст общей скамьи и отдельного кресла передан явно.
