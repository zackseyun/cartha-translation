base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/008.yaml
  text: 8. First of all, the one who has the [divine] spirit from above is gentle and quiet and humble‑minded, and refrains from every evil and from the vain desire of this age, and makes himself lower than all people; and when consulted he answers nothing to anyone, nor does he speak privately—nor does the holy Spirit speak whenever a person wishes it to speak—but it speaks when God wishes him to speak.
translation:
  language: ru
  text: 8. Прежде всего, тот, кто имеет [божественный][a] Дух, который свыше, кроток, спокоен и смирен; он воздерживается от всякого зла и от суетных желаний этого века и ставит себя ниже всех людей. Когда его спрашивают, он никому ничего не отвечает и не говорит наедине. И Святой Дух говорит не тогда, когда человек хочет, чтобы Он говорил, но тогда, когда Бог хочет, чтобы этот человек говорил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «божественный» имеется не во всех рукописных свидетельствах.
    reason: В критическом греческом тексте τὸ θεῖον заключено в квадратные скобки как текстуально не вполне достоверное чтение.
lexical_decisions:
- source_word: πραΰς
  choice: кроток
  rationale: Передаёт мягкость и незлобивость без оттенка слабости.
- source_word: ἡσύχιος
  choice: спокоен
  rationale: Естественно выражает тихий, неагрессивный нрав в современном русском языке.
- source_word: ταπεινόφρων
  choice: смирен
  rationale: Кратко и ясно передаёт смиренный образ мыслей.
- source_word: ἐπιθυμίας ματαίας
  choice: суетных желаний
  rationale: Сохраняет оценочное значение ματαίας — пустых, тщетных, лишённых истинной ценности.
- source_word: ἑαυτὸν ἐνδεέστερον ποιεῖ
  choice: ставит себя ниже
  rationale: Передаёт добровольное самоуничижение без буквального, но неясного «делает себя более нуждающимся».
- source_word: κατὰ μόνας
  choice: наедине
  rationale: Сохраняет противопоставление частных пророческих речей публичному собранию, раскрываемому далее.
theological_decisions:
- issue: Определение Духа в первом предложении
  choice: '[Божий] Дух'
  alternative: Дух
  rationale: Слова τὸ θεῖον заключены в источнике в редакционные скобки, поэтому добавление сохранено в квадратных скобках и пояснено сноской.
- issue: Субъект последнего λαλεῖ
  choice: Святой Дух говорит; затем этот человек говорит
  alternative: Дух говорит в обоих случаях
  rationale: Греческий текст сначала явно называет Святого Духа субъектом, а в финале употребляет мужское αὐτόν, естественно относящееся к человеку; перевод сохраняет это грамматическое напряжение.
- issue: Одушевлённое обозначение Святого Духа
  choice: Он
  alternative: он / оно
  rationale: В русском литературном и богословском употреблении личное обозначение «Он» естественно для Святого Духа, не добавляя отдельного догматического утверждения сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Синтаксис слегка разделён для ясности, при этом сохранены последовательность признаков и противопоставление человеческого желания Божьей воле.
