base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/040/007.yaml
  text: 7. “How then,” I say, “sir, will a person know which of them is a prophet and which is a false prophet?” “Listen,” he says, “about both prophets; and in the way I am about to tell you, so you shall test the prophet and the false prophet. Test the man who has the divine spirit by his life.
translation:
  language: ru
  text: '7. «Как же, господин, — спросил я, — человеку узнать, кто из них пророк, а кто лжепророк?» Он ответил: «Послушай о том и другом пророке. Как я сейчас объясню тебе, так и испытывай пророка и лжепророка. Человека, имеющего Божественный Дух, испытывай по его жизни».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: господин
  rationale: В обращении к наставнику передаёт почтительность без отождествления с титулом «Господь».
- source_word: δοκιμάσεις / δοκίμαζε
  choice: испытывай
  rationale: Сохраняет повтор греческого корня и смысл проверки, распознавания подлинности.
- source_word: ἀπὸ τῆς ζωῆς
  choice: по его жизни
  rationale: Естественно передаёт критерий оценки — образ и характер жизни человека.
- source_word: τὸ πνεῦμα τὸ θεῖον
  choice: Божественный Дух
  rationale: Передаёт θεῖον как «Божественный», сохраняя формулировку источника и не подменяя её более определённым титулом.
theological_decisions:
- issue: Степень определённости выражения τὸ πνεῦμα τὸ θεῖον
  choice: Божественный Дух
  alternative: Дух Божий / божественный дух
  rationale: Выбран буквальный и контекстуально dignified вариант, который сохраняет связь с Божеством, не устраняя возможную смысловую напряжённость между духом как даром и личным именованием.
- issue: Критерий различения пророка
  choice: испытывай по его жизни
  alternative: суди по образу жизни
  rationale: Форма «испытывай» точнее сохраняет δοκιμάζω и не сводит проверку к окончательному судебному суждению.
translation_notes:
  register: Современный литературный русский, сдержанный и ясный. Сохранены диалогическая форма, повтор «пророк и лжепророк» и императивный характер наставления.
