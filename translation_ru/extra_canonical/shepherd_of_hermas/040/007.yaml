  source_fidelity: Перевод точно передаёт вопрос о распознании пророка и лжепророка, повеление δοκίμαζε («испытывай, проверяй») и критерий ἀπὸ τῆς ζωῆς («по жизни», то есть по образу жизни). Повтор «пророка и лжепророка» сохранён. «Господин» уместно передаёт κύριε как почтительное обращение к собеседнику, не добавляя титулатуры.
  naturalness: Текст звучит естественно на современном литературном русском. Диалоговая пунктуация и порядок фраз ясны; «Как я сейчас объясню тебе, так и испытывай...» хорошо передаёт конструкцию καὶ ὥς ... οὕτω.
