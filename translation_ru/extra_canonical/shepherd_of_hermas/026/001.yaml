    issue: «Во всякую праведную добродетель»
    rationale: Греческое πᾶσαν ἀρετὴν δικαιοσύνης буквально и синтаксически представляет «добродетель праведности». Вариант с прилагательным в целом близок, но слегка сглаживает исходную конструкцию и может сузить её до общей моральной оценки.
  revised_text: Прежде всего веруй, что Бог один — Тот, Кто сотворил и устроил всё, привёл всё из небытия к бытию, всё вмещает, а Сам один невместим. Поэтому веруй Ему и бойся Его; а боясь Его, владей собой. Соблюдай это — и ты отбросишь от себя всякое зло, облечёшься во всякую добродетель праведности и будешь жить для Бога, если сохранишь эту заповедь.
