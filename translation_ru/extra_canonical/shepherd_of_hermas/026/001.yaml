base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/026/001.yaml
  text: First of all, believe that God is one—the one who created and ordered all things, and made all things out of nonexistence into being, and who contains all things, while he alone is uncontainable. Therefore believe him and fear him; and having feared, exercise self-control. Keep these things, and you will cast off all wickedness from yourself and put on every virtue of righteousness, and you will live to God, if you keep this command.
translation:
  language: ru
  text: Прежде всего веруй, что Бог один — Тот, Кто сотворил и устроил всё, привёл всё из небытия к бытию, всё вмещает, а Сам один невместим. Поэтому веруй Ему и бойся Его; а боясь Его, владей собой. Соблюдай это — и ты отбросишь от себя всякое зло, облечёшься во всякую добродетель праведности и будешь жить для Бога, если сохранишь эту заповедь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταρτίσας
  choice: устроил
  rationale: Передаёт приведение творения в надлежащий порядок и состояние, не сужая значение до одного лишь «упорядочил».
- source_word: ἐκ τοῦ μὴ ὄντος εἰς τὸ εἶναι
  choice: из небытия к бытию
  rationale: Сохраняет формулировку исходного текста и её онтологическую выразительность без добавочного толкования.
- source_word: πάντα χωρῶν, μόνος δὲ ἀχώρητος
  choice: всё вмещает, а Сам один невместим
  rationale: Сохраняет парадоксальную антитезу и повтор корня χωρ-/ἀχωρ-, не разрешая богословское напряжение.
- source_word: πίστευσον αὐτῷ
  choice: веруй Ему
  rationale: Дательный αὐτῷ указывает на доверие Богу; формулировка отличает это от предшествующего «веруй, что».
- source_word: ἐγκράτευσαι
  choice: владей собой
  rationale: Естественно передаёт повеление о самообладании и воздержании в широком нравственном смысле.
- source_word: πᾶσαν πονηρίαν
  choice: всякое зло
  rationale: В данном нравственном контексте охватывает порочность и злые проявления без неестественного абстрактного оборота.
- source_word: πᾶσαν ἀρετὴν δικαιοσύνης
  choice: всякую праведную добродетель
  rationale: Передаёт генитив δικαιοσύνης как характеристику добродетели, сохраняя одновременно оба нравственных понятия.
- source_word: ζήσῃ τῷ θεῷ
  choice: будешь жить для Бога
  rationale: Сохраняет направленность дательного τῷ θεῷ и естественно звучит по-русски; буквальное «жить Богу» менее обычно.
- source_word: φύλασσε / φυλάξῃς
  choice: соблюдай / сохранишь
  rationale: Передаёт общий смысл бережного исполнения, при этом избегает тяжёлого троекратного повторения одного русского глагола.
theological_decisions:
- issue: Единство Бога в выражении εἷς ἐστὶν ὁ Θεός
  choice: Бог один
  alternative: есть один Бог
  rationale: Естественная русская формулировка точно сохраняет утверждение единства Бога, не добавляя конфессиональных уточнений.
- issue: Отношение Бога к творению в πάντα χωρῶν, μόνος δὲ ἀχώρητος
  choice: всё вмещает, а Сам один невместим
  alternative: охватывает всё, но Сам ничем не охватывается
  rationale: 'Выбран буквальный параллелизм, сохраняющий подлинную метафизическую неоднозначность: текст не уточняет пространственный, познавательный или иной смысл «вмещения».'
- issue: Создание из небытия
  choice: привёл всё из небытия к бытию
  alternative: сделал так, что всё из несуществующего стало существующим
  rationale: Сохраняет явную формулу греческого текста, не развивая её в более позднюю догматическую терминологию.
- issue: Значение ζῆν τῷ θεῷ
  choice: жить для Бога
  alternative: жить Богу
  rationale: Передаёт посвящённость и направленность жизни Богу, не уточняя сверх текста, идёт ли речь преимущественно о нравственной жизни, принадлежности или эсхатологическом результате.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Повелительные формы прямы и понятны; сохранены риторические параллели «веруй… бойся… владей собой» и образное противопоставление «всё вмещает — Сам невместим». Местоимения, относящиеся к Богу, написаны с прописной буквы как уместная русская издательская норма, без изменения смысла оригинала.
