base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/047/002.yaml
  text: Therefore, believe God—you who, on account of your sins, have despaired of your life, and are adding sins and weighing down your life—that if you turn back to the Lord with your whole heart and work righteousness for the remaining days of your life, and serve him rightly according to his will, he will bring healing to your former sins, and you will have power to gain mastery over the works of the devil. And do not at all fear the devil’s threat; for he is powerless, like the sinews of a dead man.
translation:
  language: ru
  text: 'Итак, поверьте Богу, вы, кто из-за своих грехов отчаялись в своей жизни, продолжаете умножать грехи и обременять свою жизнь: если вы всем сердцем обратитесь к Господу, во все оставшиеся дни своей жизни будете поступать праведно и правильно служить Ему по Его воле, Он дарует исцеление от ваших прежних грехов, и вы обретёте власть над делами дьявола. И нисколько не бойтесь угрозы дьявола: ведь он бессилен, словно жилы мертвеца.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεγνωκότες τὴν ζωὴν ὑμῶν
  choice: отчаялся в своей жизни
  rationale: Сохраняет прямой объект «жизнь» и значение полного отчаяния, не уточняя без достаточных оснований, идёт ли речь о спасении или о земной жизни.
- source_word: προστιθέντες ἁμαρτίαις
  choice: умножает грехи
  rationale: Передаёт продолжающееся прибавление новых грехов естественным современным русским выражением.
- source_word: καταβαρύνοντες τὴν ζωὴν ὑμῶν
  choice: обременяет свою жизнь
  rationale: Сохраняет образ тяжести и параллель с отчаянием в собственной жизни.
- source_word: ἐργάσησθε τὴν δικαιοσύνην
  choice: будете поступать праведно
  rationale: Естественно передаёт деятельное исполнение праведности, не превращая её лишь в отвлечённое качество.
- source_word: δουλεύσητε αὐτῷ ὀρθῶς
  choice: верно служить Ему
  rationale: ὀρθῶς здесь обозначает надлежащее, правильное служение; «верно» звучит естественно и достойно.
- source_word: ποιήσει ἴασιν τοῖς προτέροις ὑμῶν ἁμαρτήμασι
  choice: Он исцелит вас от прежних грехов
  rationale: Сохраняет метафору исцеления и делает необычную греческую конструкцию понятной по-русски, не подменяя её более конфессионально нагруженным «простит».
- source_word: κατακυριεῦσαι τῶν ἔργων τοῦ διαβόλου
  choice: одолеть дела дьявола
  rationale: Передаёт значение господства и победы над делами дьявола без неестественного русского «господствовать над».
- source_word: ἄτονος
  choice: бессилен
  rationale: Соответствует образу лишённого силы противника, пояснённому сравнением с жилами мертвеца.
- source_word: νεκροῦ νεῦρα
  choice: жилы мертвеца
  rationale: Сохраняет резкое телесное сравнение оригинала; νεῦρα может обозначать жилы или сухожилия.
theological_decisions:
- issue: Связь обращения, праведной жизни и исцеления прежних грехов
  choice: Сохранена условная последовательность оригинала без систематического богословского пояснения.
  alternative: Перевести исцеление как безусловное прощение или явно связать его с покаянием как таинством.
  rationale: Греческий текст формулирует условие через обращение, праведные дела и служение по Божьей воле; перевод не должен ни ослаблять эту связь, ни добавлять позднейшую конфессиональную терминологию.
- issue: Значение «жизни» в выражении об отчаянии
  choice: Сохранено широкое «своя жизнь».
  alternative: Уточнить как «спасение» или «надежда на вечную жизнь».
  rationale: В контексте такое понимание возможно, однако сама лексема ζωή не снимает неоднозначности.
- issue: Сила верующего над делами дьявола
  choice: «у вас будет сила одолеть дела дьявола».
  alternative: «вы получите власть господствовать над делами дьявола».
  rationale: Так сохраняется обещание действенной победы без утверждения абсолютной власти над самим дьяволом, поскольку объектом в тексте являются его дела.
translation_notes:
  register: Современный литературный русский с увещевательным и достойным тоном. Синтаксис слегка упрощён ради ясности, но логика длинного греческого периода и выразительные образы сохранены. Местоимения о Боге оформлены с прописной буквы согласно распространённой русской религиозной издательской норме.
