review_pass:
  verdict: revise
  source_fidelity: 'Черновик в целом верно передаёт увещевание, условную конструкцию, деятельную «праведность», образ исцеления прежних грехов и сравнение с жилами умершего. Однако в обращении к множеству адресатов допущено грамматическое рассогласование: «вы, кто ... отчаялся, умножает, обременяет».'
  naturalness: После исправления согласования и перестройки первого обращения фраза звучит естественно в современном литературном русском. «Дарует исцеление от прежних грехов» передаёт образ ἴασις яснее, чем «исцелит вас от прежних грехов», и не заменяет его термином «прощение».
  terminology: «Господь», «праведно», «дьявол» и «жили мертвеца» соответствуют регистру и лексике исходника. «Обрести власть над делами дьявола» точнее передаёт κατακυριεῦσαι, чем более общее «одолеть».
  issues:
  - severity: medium
    issue: Нарушено согласование в обращении к адресатам.
    rationale: Греческие причастия ἀπεγνωκότες, προστιθέντες и καταβαρύνοντες стоят во множественном числе и относятся к ὑμεῖς; русские формы «отчаялся», «умножает», «обременяет» ошибочно единственного числа.
  - severity: low
    issue: «Исцелит вас от прежних грехов» несколько смещает синтаксический образ оригинала.
    rationale: ποιήσει ἴασιν τοῖς ... ἁμαρτήμασιν буквально выражает совершение/дарование исцеления в отношении прежних проступков. Формула «дарует исцеление от» сохраняет метафору, не делая грехи причиной медицинского состояния адресатов.
  - severity: low
    issue: «Одолеть дела дьявола» ослабляет оттенок господства.
    rationale: κατακυριεῦσαι означает обрести господство или власть над чем-либо; «обрести власть над» естественно передаёт этот оттенок, сохраняя объектом именно дела дьявола.
