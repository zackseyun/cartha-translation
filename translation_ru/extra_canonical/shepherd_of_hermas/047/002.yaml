revisions:
- from: 'Итак, поверьте Богу — вы, кто из-за своих грехов отчаялся в своей жизни, умножает грехи и обременяет свою жизнь. Если вы обратитесь к Господу всем сердцем, будете поступать праведно во все оставшиеся дни своей жизни и верно служить Ему по Его воле, Он исцелит вас от прежних грехов, и у вас будет сила одолеть дела дьявола. И нисколько не бойтесь угрозы дьявола: ведь он бессилен, словно жилы мертвеца.'
  to: 'Итак, поверьте Богу, вы, кто из-за своих грехов отчаялись в своей жизни, продолжаете умножать грехи и обременять свою жизнь: если вы всем сердцем обратитесь к Господу, во все оставшиеся дни своей жизни будете поступать праведно и правильно служить Ему по Его воле, Он дарует исцеление от ваших прежних грехов, и вы обретёте власть над делами дьявола. И нисколько не бойтесь угрозы дьявола: ведь он бессилен, словно жилы мертвеца.'
  rationale: 'Исправлено обязательное согласование с множественным «вы» и уточнены две формулировки, чтобы точнее сохранить образы и силу греческих выражений ἴασιν и κατακυριεῦσαι. Условная связь обращения, праведной жизни, служения и последующего исцеления сохранена без конфессиональных добавлений. Сноски не требуются: текст не содержит необходимой для читателя текстологической или смысловой неоднозначности, которую нельзя передать в самом переводе.'
