base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/047/004.yaml
  text: I say to him, “Lord, now I have been strengthened in all the righteous requirements of the Lord, because you are with me; and I know that you will cut off all the devil’s power, and we shall gain mastery over him and prevail against all his works. And I hope, Lord, that now I can keep these commandments that you have commanded, with the Lord strengthening me.”
translation:
  language: ru
  text: 'Я говорю ему: «Господин, теперь я укреплён во всех праведных установлениях Господа, потому что ты со мной. Я знаю, что ты сокрушишь всю силу дьявола, а мы одолеем его и восторжествуем над всеми его делами. И надеюсь, господин, что теперь смогу соблюдать эти заповеди, которые ты мне заповедал, ибо Господь укрепляет меня».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε / κύριε
  choice: Господин / господин
  rationale: Это обращение к небесному собеседнику, отличённому в той же фразе от «Господа» (τοῦ Κυρίου); такой выбор сохраняет различие референтов и не смешивает их титулы.
- source_word: δικαιώμασι
  choice: установлениях
  rationale: Слово означает предписанные праведные нормы или требования; «установления» естественно передаёт нормативный оттенок в данном контексте.
- source_word: συγκόψεις
  choice: сокрушишь
  rationale: Передаёт решительное уничтожение или слом силы противника без чрезмерно буквального «срубишь».
- source_word: κατακυριεύσομεν
  choice: одолеем
  rationale: Выражает овладение и господство над противником в естественной современной русской форме.
- source_word: κατισχύσομεν
  choice: восторжествуем
  rationale: Передаёт превосходство и победу над делами дьявола, сохраняя усиление после «одолеем».
- source_word: φυλάξαι
  choice: соблюдать
  rationale: Обычное и точное сочетание для исполнения заповедей.
theological_decisions:
- issue: Соотношение человеческой способности и Божьего укрепления
  choice: «теперь, когда Господь укрепляет меня, смогу соблюдать»
  alternative: «смогу теперь соблюдать… при укреплении Господа»
  rationale: Перевод сохраняет одновременно надежду говорящего на собственную способность и её зависимость от укрепляющего действия Господа, не разрешая напряжение в пользу одной стороны.
- issue: Различение адресата и Господа
  choice: Обращение κύριε передано как «господин», а τοῦ Κυρίου — как «Господь»
  alternative: В обоих случаях «Господь»
  rationale: Грамматика и контекст показывают, что говорящий обращается к собеседнику и отдельно упоминает Господа; единообразная капитализация могла бы ошибочно отождествить их.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но ясным регистром. Синтаксис сохраняет ход греческой речи, однако избегает тяжеловесной буквальности. Маркеры сносок не требуются.
