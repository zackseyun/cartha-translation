base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/047/003.yaml
  text: Listen to me, then, and fear the One who is able to do all things, to save and to destroy; and keep these commandments, and you will live to God.
translation:
  language: ru
  text: 'Итак, послушайте меня и бойтесь Того, Кто всё может: и спасти, и погубить. Соблюдайте эти заповеди — и будете жить для Бога.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσατε οὖν μου
  choice: Итак, послушайте меня
  rationale: Передаёт следствие οὖν и естественное для современного русского управление глагола «слушать».
- source_word: φοβήθητε
  choice: бойтесь
  rationale: Сохраняет прямое значение призыва к страху перед Богом, не ослабляя его до одного лишь «почитайте».
- source_word: τὸν πάντα δυνάμενον
  choice: Того, Кто всё может
  rationale: Сохраняет широкую формулировку греческого текста и естественно звучит по-русски.
- source_word: σῶσαι καὶ ἀπολέσαι
  choice: и спасти, и погубить
  rationale: Передаёт симметричную смысловую пару и сохраняет напряжение между спасением и погибелью.
- source_word: τηρεῖτε
  choice: Соблюдайте
  rationale: В сочетании с заповедями означает не просто помнить или хранить, а исполнять и соблюдать.
- source_word: ζήσεσθε τῷ Θεῷ
  choice: будете жить для Бога
  rationale: Сохраняет дательный τῷ Θεῷ как направленность и принадлежность жизни Богу, не заменяя его выражением «с Богом».
theological_decisions:
- issue: Смысл ἀπολέσαι применительно к Божьей власти
  choice: погубить
  alternative: уничтожить
  rationale: «Погубить» сохраняет библейскую и богословскую широту глагола, не навязывая более узкого представления о полном уничтожении.
- issue: Значение ζήσεσθε τῷ Θεῷ
  choice: будете жить для Бога
  alternative: будете жить с Богом
  rationale: Вариант «для Бога» ближе к греческому дательному и не вводит отсутствующий в тексте предлог совместности.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Императивы и параллелизм оригинала сохранены; двоеточие раскрывает содержание всеобъемлющей власти без добавления толкования.
