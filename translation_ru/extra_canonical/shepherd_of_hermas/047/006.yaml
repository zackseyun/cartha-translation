base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/047/006.yaml
  text: Foolish, double‑minded, and wretched man, do you not understand that all these things are alien, and are under the authority of another? For the lord of this city will say, ‘I do not want you to dwell in my city; rather, go out from this city, because you do not make use of my laws.’ So then, you—having fields and dwellings and many other possessions—when you are cast out by him, what will you do with your field and your house, and the rest of the things you have prepared for yourself? For the lord of this land says to you, rightly, ‘Either make use of my laws, or withdraw from my land.’ So then, what are you about to do, having…
translation:
  language: ru
  text: 'Глупый, двоедушный и жалкий человек! Неужели ты не понимаешь, что всё это тебе не принадлежит и находится во власти другого? Ведь господин этого города скажет: «Я не хочу, чтобы ты жил в моём городе. Уходи из этого города, потому что ты не соблюдаешь моих законов». Итак, у тебя есть поля, дома и много другого имущества. Но когда он изгонит тебя, что ты сделаешь со своим полем, домом и всем прочим, что приготовил для себя? Ведь господин этой земли справедливо говорит тебе: «Или соблюдай мои законы, или уходи с моей земли». Итак, что ты намерен делать, имея…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄφρον
  choice: глупый
  rationale: Прямо передаёт укоризненное обращение, оставаясь естественным для современного русского языка.
- source_word: δίψυχε
  choice: двоедушный
  rationale: Сохраняет характерный раннехристианский образ внутренней раздвоенности и нерешительности, не сводя его лишь к сомнению.
- source_word: ἀλλότριά
  choice: тебе не принадлежит
  rationale: В данном контексте речь идёт о чужой собственности; развернутая передача яснее естественного, но менее точного «чужое».
- source_word: ὑπ᾽ ἐξουσίαν ἑτέρου
  choice: находится во власти другого
  rationale: Сохраняет юридико-властный оттенок выражения.
- source_word: τοῖς νόμοις μου οὐ χρᾶσαι
  choice: ты не соблюдаешь моих законов
  rationale: χράομαι с законами означает руководствоваться ими, жить по ним; «соблюдать» естественно выражает смысл в русском контексте.
- source_word: ὑπάρξεις
  choice: имущество
  rationale: Передаёт материальные владения в ряду полей и домов.
- source_word: ἐκχώρει
  choice: уходи
  rationale: Естественная передача требования покинуть чужую территорию.
theological_decisions:
- issue: Образ земного города и его господина
  choice: Сохранён как образ без добавленного аллегорического толкования.
  alternative: Явно отождествить город с нынешним миром, а господина — с земной властью или дьяволом.
  rationale: Данный фрагмент сам не раскрывает соответствия полностью; перевод не должен устранять образную напряжённость или вносить частное толкование.
- issue: δίψυχος как нравственно-духовная характеристика
  choice: двоедушный
  alternative: сомневающийся; нерешительный
  rationale: «Двоедушный» сохраняет более широкий смысл внутренней раздвоенности и традиционный библейский резонанс, не ограничивая понятие интеллектуальным сомнением.
translation_notes:
  register: Современный литературный русский язык с достоинством и прямотой увещевательной речи. Синтаксис местами разделён на более короткие предложения ради ясности. Обрыв исходного читательского сегмента сохранён многоточием; повреждённый и смешанный контекст OCR перед целевым отрывком не включён.
