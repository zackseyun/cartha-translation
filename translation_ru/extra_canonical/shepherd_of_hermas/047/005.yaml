review_pass:
  verdict: revise
  source_fidelity: Φυλάξεις correctly retains the future force (“Сохранишь”); its implicit object is supplied by the preceding discussion of commandments. The following Greek wording (ἐὰν ἡ κάμψαι εἰς τὴν ἰδίαν πόλιν) is manifestly difficult/corrupt as transmitted, so a cautiously idiomatic rendering with an explicit note is appropriate. However, ἰδίαν means “one’s own,” not specifically “native/hometown”; “родной” adds a nuance absent from the text.
  naturalness: The concise direct-speech form is natural modern literary Russian. “Обратишься к своему городу” is more idiomatic than a literal rendering of “bend” while retaining the directional image under the stated textual uncertainty.
  terminology: No doctrinal terminology is introduced. “Свой город” preserves the image without identifying it as a heavenly city or otherwise interpreting it.
  issues:
  - severity: medium
    issue: «родному городу» for τὴν ἰδίαν πόλιν
    rationale: «Родной» normally denotes one’s place of origin and is more specific than Greek ἰδίαν (“own, one’s own”). The contrast in the surrounding simile is adequately preserved by «свой город» without this added implication.
  - severity: low
    issue: «устремишься» is more interpretive than necessary
    rationale: Given the defective or incomplete reading, an idiomatic directional verb is defensible, but «обратишься к» more closely retains the underlying image of turning/bending toward a city and avoids intensifying it into eager striving.
  revised_text: «Сохранишь, — говорит он, — если обратишься к своему городу».[a]
