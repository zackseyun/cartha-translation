  text: «Сохранишь, — говорит он, — если обратишься к своему городу».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст в этом месте, по-видимому, повреждён или неполон; перевод передаёт вероятный смысл обращения к своему городу, сохраняя образ без дальнейшего истолкования.
    reason: Отмечает текстологическую неуверенность и объясняет осторожно идиоматический перевод, не приписывая городу не выраженного в тексте значения.
lexical_decisions:
- source_word: Φυλάξεις
  choice: Сохранишь
  rationale: Будущее время передано прямо; подразумеваемое дополнение определяется предшествующим контекстом — заповеди.
- source_word: κάμψαι εἰς
  choice: устремишься к
  rationale: В представленном тексте чтение испорчено или неполно; перевод следует засвидетельствованному в консультационном слое направительному смыслу, не придавая неестественному буквальному «согнёшься» ложной определённости.
- source_word: τὴν ἰδίαν πόλιν
  choice: своему родному городу
  rationale: ἴδιος обозначает собственный, принадлежащий человеку город; «родной» естественно выражает противопоставление нынешнему чужому месту жительства.
theological_decisions:
- issue: Образ «своего города»
  choice: Сохранён без отождествления с конкретным богословским понятием
  alternative: Передать как «небесный город»
  rationale: В данном фрагменте город прямо не назван небесным; конкретизация устранила бы образную и богословскую открытость текста.
translation_notes:
  register: Современный литературный русский язык; краткая реплика сохранена. «Устремишься» звучит естественно и достойно, а сноска отмечает ненадёжность греческого чтения.
