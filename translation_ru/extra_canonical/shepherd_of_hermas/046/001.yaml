  text: 'But I, the angel of repentance, say to you: do not fear the devil. For I was sent," he says, "to be with you who are repenting with all your heart and to streng—'
translation:
  language: ru
  text: '«Я же, ангел покаяния, говорю вам: не бойтесь дьявола. Ведь я послан, — говорит он, — чтобы быть с вами, кающимися всем сердцем, и укреп—»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἄγγελος τῆς μετανοίας
  choice: ангел покаяния
  rationale: Прямая и естественная передача родительного оборота; сохраняет обозначение говорящего.
- source_word: μὴ φοβήθητε
  choice: не бойтесь
  rationale: Аористный запрет здесь естественно передаётся общим русским повелительным выражением.
- source_word: τὸν διάβολον
  choice: дьявола
  rationale: Обычный и точный русский эквивалент διάβολος в раннехристианском контексте.
- source_word: τῶν μετανοούντων
  choice: кающимися
  rationale: Причастная форма сохраняет продолжающееся действие и согласуется с обращением во множественном числе.
- source_word: ἐξ ὅλης καρδίας αὐτῶν
  choice: от всего сердца
  rationale: Идиоматичный русский оборот передаёт полноту внутренней искренности; число в русском естественно нейтрализуется.
- source_word: ἰσχυρο-
  choice: укреп—
  rationale: Источник обрывается внутри слова; перевод также оставлен незавершённым без восстановления по последующему тексту.
theological_decisions:
- issue: Соотношение слов рассказчика и прямой речи ангела
  choice: Сохранена вставка «говорит он» внутри прямой речи
  alternative: Убрать вставку либо отнести всё предложение непосредственно рассказчику
  rationale: Греческое φησί явно маркирует повествовательную вставку и создаёт некоторую шероховатость смены голоса, которую не следует сглаживать.
- issue: Характер покаяния
  choice: «кающимися от всего сердца»
  alternative: «искренне раскаивающимися»
  rationale: Более формальная передача сохраняет образ сердца и не подменяет процесс покаяния только психологическим чувством раскаяния.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Сохранены множественное обращение, внутренняя авторская ремарка и физический обрыв исходного фрагмента.
