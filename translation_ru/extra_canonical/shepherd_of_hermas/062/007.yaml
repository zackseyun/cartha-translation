  text: «Кто же тогда, господин, — спрашиваю я, — те, кто увенчан и идёт в башню?»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: господин
  rationale: Уважительное обращение к собеседнику; в данном контексте это не обязательно божественный титул «Господь».
- source_word: ἐστεφανωμένοι
  choice: увенчанные
  rationale: Передаёт совершенное страдательное причастие и образ полученного венца, не уточняя его вид.
- source_word: εἰς τὸν πύργον ὑπάγοντες
  choice: идущие в башню
  rationale: Сохраняет настоящее причастие и направление движения внутрь башни.
