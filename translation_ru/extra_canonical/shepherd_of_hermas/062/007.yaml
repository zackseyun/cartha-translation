  source_fidelity: Греческое Τίνες ... εἰσὶν οἱ ἐστεφανωμένοι καὶ εἰς τὸν πύργον ὑπάγοντες; означает «кто такие увенчанные и входящие/идущие в башню?». Прошедше-результативное ἐστεφανωμένοι передано верно как «увенчанные»; εἰς требует направления «в башню».
  naturalness: Черновик понятен, однако конструкция «Кто же тогда ... эти увенчанные» в современном литературном русском звучит тяжеловесно и несколько искусственно. Вопрос «Кто же ... те, кто увенчан и идёт в башню?» естественнее и точно сохраняет два определяющих признака.
  terminology: «Господин» уместно для κύριε в обращении к ангелу и не навязывает богословского прочтения. «Башня» точно передаёт πύργος. «Увенчан» сохраняет образ венца без ненужного уточнения.
