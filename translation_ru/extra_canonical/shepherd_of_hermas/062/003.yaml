revisions:
- from: 'А великий и славный ангел — это Михаил, которому вверена власть над этим народом и который им управляет. Ведь именно он даёт им закон — вкладывает его в сердца верующих. Поэтому он сам приходит проверить тех, кому дал закон: соблюли ли они его.'
  to: А великий и славный ангел — Михаил, который имеет власть над этим народом и управляет им. Ведь именно он даёт им закон, то есть вкладывает его в сердца верующих. Поэтому он сам посещает тех, кому дал его, чтобы увидеть, соблюли ли они его.
