base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/003.yaml
  text: “And the great and glorious angel is Michael, who has authority over this people and governs them. For he is the one who gives the law to them, into the hearts of those who believe; therefore he himself visits those to whom he gave it, to see whether they have kept it.
translation:
  language: ru
  text: А великий и славный ангел — Михаил, который имеет власть над этим народом и управляет им. Ведь именно он даёт им закон, то есть вкладывает его в сердца верующих. Поэтому он сам посещает тех, кому дал его, чтобы увидеть, соблюли ли они его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων τὴν ἐξουσίαν τούτου τοῦ λαοῦ
  choice: которому вверена власть над этим народом
  rationale: Передаёт обладание властью естественным русским оборотом, не предполагая неограниченной или самоприсвоенной власти.
- source_word: διακυβερνῶν
  choice: который им управляет
  rationale: Глагол означает направлять, управлять; простой современный эквивалент сохраняет образ руководства без ненужного морского оттенка.
- source_word: ὁ διδοὺς αὐτοῖς τὸν νόμον εἰς τὰς καρδίας τῶν πιστευόντων
  choice: он даёт им закон — вкладывает его в сердца верующих
  rationale: Греческая конструкция неровна; тире ясно связывает дарование закона с его помещением в сердца, сохраняя обе части высказывания.
- source_word: ἐπισκέπτεται
  choice: приходит проверить
  rationale: В контексте последующей проверки соблюдения закона слово означает посещение с целью надзора или рассмотрения, а не просто дружеский визит.
- source_word: τετηρήκασιν
  choice: соблюли
  rationale: Передаёт совершенный вид греческого перфекта и устойчивое значение соблюдения закона.
theological_decisions:
- issue: Роль Михаила в даровании закона верующим
  choice: Сохранено прямое утверждение, что Михаил даёт закон и вкладывает его в сердца верующих.
  alternative: Ослабить формулировку до «передаёт» или добавить, что он действует лишь как посредник Бога.
  rationale: Исходный текст прямо приписывает это действие Михаилу; добавление посреднической оговорки разрешило бы богословское напряжение, которого сам отрывок не разрешает.
- issue: Характер власти Михаила над народом
  choice: «которому вверена власть»
  alternative: «обладающий властью» или «имеющий власть»
  rationale: Формулировка сохраняет реальную власть Михаила, но не утверждает её независимость; это соответствует контексту ангельского служения и не вносит конфессиональной доктрины.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского текста. Синтаксис слегка упрощён для ясности, однако повтор закона и напряжённое утверждение о роли Михаила сохранены.
