  source_fidelity: 'В целом смысл передан точно: Михаил назван великим и славным ангелом, имеющим власть над народом и управляющим им; он даёт закон верующим и проверяет, соблюдают ли они его. Однако «которому вверена власть» добавляет оттенок поручения, которого греческое ὁ ἔχων τὴν ἐξουσίαν прямо не выражает.'
