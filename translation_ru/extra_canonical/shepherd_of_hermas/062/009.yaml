base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/009.yaml
  text: “But the others, who themselves also handed in their rods green and having side-shoots, yet without fruit—these are those who were hard-pressed for the law, but did not suffer, nor did they deny their law.
translation:
  language: ru
  text: А другие — те, кто тоже принёс свои прутья зелёными, с боковыми побегами, но без плодов, — претерпели притеснения за Закон, однако не пострадали и не отреклись от своего Закона.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους
  choice: прутья
  rationale: В данном образном рассказе речь идёт о срезанных и затем посаженных прутьях; «прутья» естественнее русского «жезлы» и сохраняет связь с растительным образом.
- source_word: παραφυάδας
  choice: боковые побеги
  rationale: Передаёт ботанический смысл отростков, выросших сбоку, без излишне специальной лексики.
- source_word: οἱ ὑπὲρ τοῦ νόμου θλιβέντες
  choice: претерпели притеснения за Закон
  rationale: 'Сохраняет значение давления и скорби, а также конструкцию ὑπέρ: притеснения были перенесены из-за верности Закону.'
- source_word: μὴ παθόντες
  choice: не пострадали
  rationale: Сохраняет широкое и контекстуально неоднозначное значение πάσχω, не сужая его до мученической смерти.
- source_word: τὸν νόμον αὐτῶν
  choice: своего Закона
  rationale: Воспроизводит местоимение αὐτῶν и связь с данным им Божьим Законом; прописная буква помогает обозначить конкретный Закон в рамках толкования дерева.
theological_decisions:
- issue: Степень перенесённых страданий
  choice: «претерпели притеснения … однако не пострадали»
  alternative: «были гонимы … но не приняли мучений»
  rationale: Греческий текст различает θλίβω и πάσχω, но не уточняет, означает ли второе мученичество, телесные страдания или более тяжёлое испытание. Перевод сохраняет это напряжение, не навязывая узкого понимания.
- issue: Значение «закона»
  choice: «Закон» без поясняющей идентификации
  alternative: «закон Сына Божьего» или «христианская вера»
  rationale: Контекст отождествляет Закон с Сыном Божьим и возвещённой вестью, однако сам данный стих сохраняет слово νόμος; его не следует заменять богословским истолкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставительного текста. Синтаксис слегка упрощён ради ясности, при этом сохранены противопоставления и повтор слова «Закон».
