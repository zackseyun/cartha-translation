  verdict: revise
  source_fidelity: 'Смысл передан точно: речь о нарушивших закон, полученный от Михаила, оставленных под властью говорящего ради покаяния, в противопоставлении тем, кто угодил закону и соблюл его. Сохранены важные противопоставления «моей власти» и «своей власти», а также необычное для русского, но обусловленное греческим, «угодить закону».'
