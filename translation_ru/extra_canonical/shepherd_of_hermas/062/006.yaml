base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/006.yaml
  text: “All who transgressed the law which they received from him,” he says, “he left under my authority for repentance; but those who have already been pleasing to the law and have kept it, he has under his own authority.”
translation:
  language: ru
  text: «Всех, кто преступил закон, полученный ими от него, — говорит он, — он оставил под моей властью, чтобы они покаялись; а тех, кто уже угодили закону и соблюли его, он держит под своей властью».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέβησαν τὸν νόμον
  choice: преступил закон
  rationale: Передаёт нарушение установленного закона и сохраняет серьёзность греческого выражения.
- source_word: εἰς τὴν ἐμὴν ἐξουσίαν
  choice: под моей властью
  rationale: Естественно по-русски выражает пребывание в сфере чьей-либо власти или полномочий.
- source_word: εἰς μετάνοιαν
  choice: чтобы они покаялись
  rationale: Передаёт целевое значение оборота и делает фразу ясной современному читателю.
- source_word: εὐηρέστησαν τῷ νόμῳ
  choice: угодил закону
  rationale: Сохраняет необычную персонифицирующую формулировку оригинала, не подменяя её более привычным «угодил Богу».
- source_word: τετηρήκασιν αὐτόν
  choice: соблюдал его
  rationale: Глагол τηρέω здесь означает хранить верность закону, исполняя его предписания.
- source_word: ὑπὸ τὴν ἰδίαν ἐξουσίαν ἔχει
  choice: держит под собственной властью
  rationale: Сохраняет контраст с теми, кто оставлен под властью говорящего.
theological_decisions:
- issue: Отношение между законом и теми, кто ему угодил
  choice: Сохранено буквальное «угодил закону»
  alternative: «жил по закону» или «угодил Богу исполнением закона»
  rationale: Греческий текст прямо ставит τῷ νόμῳ при εὐηρέστησαν; исправление этой необычной конструкции внесло бы отсутствующее в тексте толкование.
- issue: Цель передачи согрешивших под власть говорящего
  choice: «чтобы они покаялись»
  alternative: «для покаяния»
  rationale: Личная целевая конструкция яснее в русском и не определяет дополнительно ни характер, ни результат покаяния.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Синтаксис слегка упрощён ради ясности, при этом сохранены параллелизм двух групп, повтор «под ... властью» и богословски значимая необычность выражения «угодил закону».
