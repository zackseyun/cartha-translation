base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/002.yaml
  text: “Listen,” he says. “This great tree that covers plains and mountains and the whole earth is the law of God given to the whole world. And this law is the Son of God, proclaimed to the ends of the earth; and the peoples under the shade are those who heard the proclamation and believed in him.
translation:
  language: ru
  text: «Слушай, — говорит он, — это великое дерево, осеняющее равнины, горы и всю землю, есть Закон Божий, данный всему миру. И этот Закон есть Сын Божий, возвещённый до краёв земли; народы же, находящиеся под сенью этого дерева, — те, кто услышали возвещение и уверовали в Него».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκεπάζον / σκέπην
  choice: осеняющее / под его сенью
  rationale: Сохраняет образ дерева, дающего покров и тень, в естественном и dignified русском изложении.
- source_word: νόμος Θεοῦ
  choice: закон Бога
  rationale: Прямая передача греческой конструкции без внесения конфессионально обусловленного толкования.
- source_word: κηρυχθεὶς / κηρύγματος
  choice: возвещённый / весть
  rationale: Передаёт идею публичного провозглашения; во втором случае «весть» звучит естественнее буквального «проповедь» и сохраняет смысл.
- source_word: πιστεύσαντες εἰς αὐτόν
  choice: уверовал в Него
  rationale: Местоимение относится к Сыну Бога; прописная буква соответствует современному благоговейному русскому регистру.
theological_decisions:
- issue: Отождествление закона с Сыном Бога
  choice: «этот закон — Сын Бога»
  alternative: «этот закон есть Сын Божий»
  rationale: Сохранено прямое и богословски напряжённое отождествление исходного текста без смягчения или поясняющей гармонизации.
- issue: Объём выражения εἰς ὅλον τὸν κόσμον
  choice: «данный всему миру»
  alternative: «данный для всего мира»
  rationale: Выбрана естественная формулировка, сохраняющая универсальный охват закона.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставительного текста. Реплика оформлена живо, но без разговорной сниженности; образ дерева и богословская неоднозначность оригинала сохранены.
