revisions:
- from: «Слушай, — говорит он. — Это великое дерево, осеняющее равнины, горы и всю землю, есть закон Бога, данный всему миру. А этот закон — Сын Бога, возвещённый до краёв земли; народы же, находящиеся под его сенью, — это те, кто услышал весть и уверовал в Него».
  to: «Слушай, — говорит он, — это великое дерево, осеняющее равнины, горы и всю землю, есть Закон Божий, данный всему миру. И этот Закон есть Сын Божий, возвещённый до краёв земли; народы же, находящиеся под сенью этого дерева, — те, кто услышали возвещение и уверовали в Него».
  rationale: Исправлены пунктуация прямой речи, передача κήρυγμα и русская анафорическая ясность образа дерева. «Закон Божий» и «Сын Божий» выбраны как естественные современные литературные соответствия греческим генитивным конструкциям, без изменения их прямого отождествления в тексте.
