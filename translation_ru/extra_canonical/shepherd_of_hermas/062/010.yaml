base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/010.yaml
  text: “And those who handed in green rods just as they received them are dignified and righteous and have walked with a very pure heart, and have guarded the commandments of the Lord. The rest you will learn when I examine these rods that have been planted and watered.”
translation:
  language: ru
  text: 'А те, кто сдал зелёные прутья такими же, какими получил их, — люди достойные и праведные: они жили с совершенно чистым сердцем и соблюдали заповеди Господа. Об остальных ты узнаешь, когда я осмотрю эти посаженные и политые прутья.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χλωρὰς τὰς ῥάβδους
  choice: зелёные прутья
  rationale: Сохраняет образ свежих, неиссохших ветвей; «прутья» естественно передаёт ῥάβδοι в контексте их сдачи, посадки и полива.
- source_word: ἐπιδεδωκότες
  choice: сдал
  rationale: Передаёт вручение прутьев проверяющему; современное «сдал» здесь естественнее буквального «передал».
- source_word: σεμνοὶ
  choice: благочестивые
  rationale: В данном нравственно-религиозном перечне слово обозначает почтенных, достойных людей благочестивого поведения, а не просто «серьёзных».
- source_word: λίαν πορευθέντες ἐν καθαρᾷ καρδίᾳ
  choice: жили с совершенно чистым сердцем
  rationale: Идиоматически передаёт метафорическое «ходили» как образ образа жизни, сохраняя усиление λίαν.
- source_word: πεφυλακότες
  choice: соблюдали
  rationale: Обычная и точная русская передача хранения и исполнения заповедей.
- source_word: κατανοήσω
  choice: осмотрю
  rationale: В контексте проверки прутьев означает внимательное рассмотрение; «осмотрю» ясно передаёт конкретное действие.
theological_decisions:
- issue: Нравственная характеристика σεμνοὶ καὶ δίκαιοι
  choice: благочестивые и праведные
  alternative: достойные и праведные
  rationale: «Благочестивые» уместно отражает религиозно-нравственную окраску σεμνοί, не добавляя конфессиональной специфики.
- issue: Метафора πορεύομαι о жизненном пути
  choice: они жили
  alternative: они ходили
  rationale: Современная русская формулировка раскрывает устойчивую метафору образа жизни, не изменяя её нравственного смысла.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Синтаксис упрощён для ясности, но образ прутьев и последовательность характеристик сохранены.
