base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/004.yaml
  text: “You see the rods of each person; for the rods are the law. You see, then, many rods made worthless; and you will recognize all those who have not kept the law, and you will see the dwelling of each one.”
translation:
  language: ru
  text: '«Ты видишь прутья каждого: ведь прутья — это закон. Ты видишь, что многие прутья пришли в негодность; так ты узнаешь всех, кто не соблюдал закона, и увидишь жилище каждого».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδους / ῥάβδοι
  choice: прутья
  rationale: В данном образе речь идёт о срезанных и осматриваемых ветвях или прутьях; «прутья» естественно передаёт предмет символического испытания и согласуется с ближайшим контекстом.
- source_word: ἠχρειωμένας
  choice: стали негодными
  rationale: Причастие выражает состояние утраты пригодности или ценности; перевод сохраняет отрицательную оценку, не уточняя сверх текста, в чём именно состоит повреждение.
- source_word: τηρήσαντας
  choice: сохранил
  rationale: Глагол означает хранить, соблюдать; применительно к закону «сохранить закон» удерживает образ вверенного дара, хотя по-русски возможно и «соблюсти закон».
- source_word: κατοικίαν
  choice: какое место отведено каждому
  rationale: Буквально «жилище, место пребывания». Контекст предполагает итоговое назначение каждого; формулировка остаётся достаточно открытой и звучит естественно по-русски.
theological_decisions:
- issue: Значение κατοικία как итогового места пребывания
  choice: какое место отведено каждому
  alternative: жилище каждого
  rationale: Выбранный вариант передаёт распределение участи в контексте проверки прутьев, не определяя это место как небесную награду или наказание и тем самым не снимая смысловую напряжённость.
- issue: Отождествление прутьев с законом
  choice: ведь эти прутья — закон
  alternative: ибо прутья означают закон
  rationale: Сохранена прямая предикация греческого текста без превращения её в более явное толкование символа.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Повтор «прутья» сохранён ради ясности аллегории; синтаксис слегка разгружен по сравнению с греческим периодом.
