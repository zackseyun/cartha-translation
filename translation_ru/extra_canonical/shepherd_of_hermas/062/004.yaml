  naturalness: Текст звучит в целом естественно, но «сохранил закон» для τηρήσαντας менее обычно в современном русском, чем «соблюдал закон». «Прутья каждого» можно сохранить как краткое и понятное обозначение прутьев, принадлежащих каждому человеку.
  terminology: «Прутья» уместно для ῥάβδοι и последовательно поддерживает образ данного раздела. «Закон» передаёт νόμος точно.
