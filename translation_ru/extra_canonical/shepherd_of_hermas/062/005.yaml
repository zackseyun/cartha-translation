base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/005.yaml
  text: I say to him, “Sir, why did he send some away into the tower, but leave others to you?”
translation:
  language: ru
  text: 'Я говорю ему: «Господин, почему одних он отправил в башню, а других оставил тебе?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Господин
  rationale: В обращении к ангелу слово передаёт уважительное «господин», а не божественный титул «Господь».
- source_word: ἀπέλυσεν
  choice: отпустил
  rationale: 'Сохраняет основное значение глагола: позволил уйти или отослал; направление выражено отдельно.'
- source_word: εἰς τὸν πύργον
  choice: к башне
  rationale: Предлог εἰς обозначает направление к башне; русский вариант не утверждает без необходимости, что они вошли внутрь.
- source_word: σοὶ κατέλειψεν
  choice: оставил у тебя
  rationale: Естественно передаёт личное местоимение и идею передачи оставшихся под надзор собеседника.
theological_decisions:
- issue: Статус адресата в обращении Κύριε
  choice: Господин
  alternative: Господь
  rationale: Контекст указывает на обращение к ангельскому толкователю; перевод не должен приписывать ему божественный статус.
- issue: Направление εἰς τὸν πύργον
  choice: к башне
  alternative: в башню
  rationale: Выбран вариант, сохраняющий направленность выражения и не уточняющий сверх греческого текста факт входа внутрь.
translation_notes:
  register: Современный литературный русский язык; почтительное, но естественное обращение и ясный синтаксис прямой речи.
