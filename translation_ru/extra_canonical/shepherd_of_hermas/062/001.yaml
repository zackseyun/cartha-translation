base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/062/001.yaml
  text: I say to him, “Sir, make known to me what this tree is; for I am perplexed about it, because, though so many branches have been cut off, the tree is sound, and nothing appears to have been cut away from it. About this, therefore, I am at a loss.”
translation:
  language: ru
  text: 'Я говорю ему: «Господин, объясни мне, что это за дерево. Я недоумеваю о нём: ведь столько ветвей срублено, а дерево остаётся невредимым, и не видно, чтобы от него было что-нибудь отсечено. Вот это и приводит меня в недоумение».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Господин
  rationale: В обращении к ангелу κύριε означает почтительное «господин», а не божественный титул «Господь».
- source_word: γνώρισόν μοι
  choice: объясни мне
  rationale: Передаёт просьбу сделать значение дерева понятным; по-русски естественнее буквального «дай мне узнать».
- source_word: ἀποροῦμαι
  choice: недоумеваю / приводит меня в недоумение
  rationale: Сохраняет повтор глагола и выражает затруднение героя перед увиденным.
- source_word: ὑγιές
  choice: остаётся невредимым
  rationale: В контексте дерева слово означает целость и отсутствие видимого ущерба, а не здоровье в узком смысле.
- source_word: κλάδων κοπέντων … κεκομμένον
  choice: ветвей срублено … отсечено
  rationale: Разные русские глаголы позволяют естественно передать однокоренной греческий образ рубки без тяжёлого повтора.
