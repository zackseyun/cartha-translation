  text: “[Those who grappled with the devil and overcame him,” he says, “are crowned.] These are the ones who suffered for the law.
translation:
  language: ru
  text: «[Те, кто вступили в борьбу с дьяволом и победили его, — говорит он, — увенчаны.] Это те, кто пострадал за Закон».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμπαλαίσαντες
  choice: вступил в борьбу
  rationale: Передаёт образ непосредственной схватки, заложенный в глаголе συμπαλαίω, естественным современным русским выражением.
- source_word: ἐνίκησαν
  choice: победил
  rationale: Сохраняет прямое значение одержанной победы без усиления или богословского истолкования.
- source_word: ἐστεφανωμένοι
  choice: увенчаны
  rationale: Сохраняет образ венца как награды победителям; «увенчаны» звучит достойно и не сужает смысл до современного монаршего венчания.
- source_word: ὑπὲρ τοῦ νόμου παθόντες
  choice: пострадал за Закон
  rationale: Предлог ὑπέρ передан как «за», то есть вследствие верности Закону и ради него; «пострадал» сохраняет широкий смысл παθόντες и не ограничивает его мученической смертью.
- source_word: νόμος
  choice: Закон
  rationale: Заглавная буква указывает на ранее названный Божий Закон, не добавляя отсутствующего в этой фразе определения «Божий».
theological_decisions:
- issue: Характер страдания за Закон
  choice: пострадал за Закон
  alternative: принял мученическую смерть за Закон
  rationale: Греческое παθόντες означает претерпевших страдания и само по себе не требует значения смерти; более узкая мученическая трактовка не внесена.
- issue: Текстуальная неуверенность первой фразы
  choice: Сохранены квадратные скобки и добавлена текстологическая сноска
  alternative: Печатать фразу без оговорки как бесспорный текст
  rationale: Исходное критическое издание заключает фразу в квадратные скобки, поэтому публикационный перевод не должен скрывать её особый текстуальный статус.
translation_notes:
  register: Современный литературный русский с кратким, торжественным звучанием. Образ борьбы и венца сохранён; синтаксис упрощён лишь настолько, чтобы реплика звучала естественно. Формулировка не уточняет вид страдания сверх греческого текста.
