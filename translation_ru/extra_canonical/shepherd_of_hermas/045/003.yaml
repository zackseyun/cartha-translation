base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/003.yaml
  text: '"He is not able," he says, "to tyrannize the servants of God—those who hope in him with their whole heart. The devil can wrestle against them, but he cannot overcome them. If, therefore, you resist him, defeated he will flee from you, disgraced. But those who are empty," he says, "are afraid of the devil as though he had power.'
translation:
  language: ru
  text: «Он не может, — говорит он, — насильно господствовать над рабами Божьими, которые всем сердцем надеются на Него. Дьявол может вступить с ними в борьбу, но одолеть их не может. Поэтому, если вы воспротивитесь ему, он, побеждённый и посрамлённый, убежит от вас. А те, кто пуст, — говорит он, — боятся дьявола, словно он обладает силой».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταδυναστεύειν
  choice: властвовать над
  rationale: Передаёт насильственное господство и притеснение без излишне архаичного или политически узкого оттенка слова «тиранить».
- source_word: ἐξ ὅλης καρδίας ἐλπιζόντων ἐπ’ αὐτόν
  choice: которые всем сердцем надеются на Бога
  rationale: Сохраняет библейскую образность «всем сердцем»; явное «на Бога» естественно уточняет местоимение по ближайшему смысловому антецеденту.
- source_word: ἀντιπαλαῖσαι
  choice: вступить с ними в борьбу
  rationale: Глагол содержит образ борцовского противоборства; русский оборот сохраняет метафору и звучит естественно.
- source_word: καταπαλαῖσαι
  choice: одолеть их
  rationale: Передаёт контраст между самим вступлением в борьбу и окончательной победой в ней.
- source_word: ἀντισταθῆτε
  choice: воспротивитесь
  rationale: Точный и узнаваемый библейский эквивалент со значением активного сопротивления.
- source_word: ἀπόκενοι
  choice: те, кто пуст
  rationale: Сохраняет ключевой образ пустоты, который раскрывается далее сравнением с неполными сосудами; не добавляет отсутствующее в тексте пояснение.
- source_word: ὡς δύναμιν ἔχοντα
  choice: словно он обладает силой
  rationale: Сохраняет модальность ὡς и не утверждает безоговорочно, что дьявол действительно обладает приписываемой ему силой.
theological_decisions:
- issue: Антецедент местоимения αὐτόν в выражении «надеющихся на него»
  choice: на Бога
  alternative: на Него / на Господа
  rationale: Грамматически αὐτόν согласуется с τοῦ Θεοῦ, а смысл говорит о рабах Бога, уповающих на Бога. Имя повторено ради ясности без внесения конфессионального толкования.
- issue: Характер власти дьявола
  choice: сохранить различие между способностью бороться и неспособностью одолеть
  alternative: обобщить как «не может причинить вреда»
  rationale: 'Источник намеренно удерживает напряжение: противодействие дьявола реально, но окончательное господство над верными ему недоступно.'
- issue: Оборот ὡς δύναμιν ἔχοντα
  choice: «словно он обладает силой»
  alternative: «потому что он силён»
  rationale: Источник описывает восприятие «пустых», а не прямо подтверждает действительную власть дьявола.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Сохранены прямая речь, повтор «говорит он», образ борьбы и смысловая связь с последующим образом пустых сосудов. Маркеры сносок не требуются.
