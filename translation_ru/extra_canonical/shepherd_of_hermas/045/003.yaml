review_pass:
  verdict: revise
  source_fidelity: В данном читательском сегменте греческий текст начинается с Οὐ δύναται, φησί («Он не может, — говорит он...»); перевод верно передаёт основную аргументацию, противопоставление ἀντιπαλαῖσαι / καταπαλαῖσαι и образ «пустых». Однако ἐπ’ αὐτόν относится к Богу, что в русском лучше сохранить местоименной отсылкой к непосредственно названному Богу, а καταδυναστεύειν означает не нейтральное «властвовать», а насильственно господствовать / угнетать.
  naturalness: Текст в целом литературный и ясный. «Насильственно господствовать» точнее по смыслу, хотя несколько тяжелее; «не может господствовать над» достаточно естественно, но слабее передаёт приставку κατα-. Замена «словно он обладает силой» на «как будто у него есть власть» естественна, однако «сила» ближе к δύναμις.
  terminology: «Рабы Божьи», «дьявол», «всем сердцем», «воспротивитесь» уместны для современного литературного русского и сохраняют раннехристианский наставительный регистр. «Господствовать» предпочтительнее «властвовать» как прямое обозначение господства; наречие «насильно» отражает усиленный глагол оригинала.
  issues:
  - severity: low
    issue: «Властвовать над» ослабляет καταδυναστεύειν.
    rationale: Греческий глагол обозначает подавляющее, насильственное господство. Добавление «насильно» сохраняет этот оттенок без навязывания толкования.
  - severity: low
    issue: «На Бога» повторяет существительное там, где греческий имеет местоимение αὐτόν.
    rationale: Смысл отсылки ясен из ближайшего «рабами Божьими» и предшествующего контекста. «На Него» точнее воспроизводит форму оригинала и остаётся естественным в прямой речи.
  revised_text: «Он не может, — говорит он, — насильно господствовать над рабами Божьими, которые всем сердцем надеются на Него. Дьявол может вступить с ними в борьбу, но одолеть их не может. Поэтому, если вы воспротивитесь ему, он, побеждённый и посрамлённый, убежит от вас. А те, кто пуст, — говорит он, — боятся дьявола, словно он обладает силой».
