base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/004.yaml
  text: '"When a man fills very many clay jars with good wine, and among those jars a few are empty, he comes to the jars and does not inspect the full ones—for he knows they are full—but he inspects the empty ones, fearing lest they have turned sour; for empty jars quickly turn sour, and the pleasure of the wine is lost.'
translation:
  language: ru
  text: «Когда человек наполняет множество глиняных сосудов хорошим вином и среди этих сосудов есть несколько пустых, он подходит к сосудам и не осматривает полные, потому что знает, что они полны; но осматривает пустые, опасаясь, как бы они не прокисли. Ведь пустые сосуды быстро прокисают, и пропадает вся прелесть вина».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κεράμια
  choice: глиняные сосуды
  rationale: Слово обозначает глиняные ёмкости; «сосуды» естественно звучит по-русски и сохраняет материальный образ.
- source_word: ἀπόκενα
  choice: пустые
  rationale: В контексте противопоставлено наполненным сосудам; простое «пустые» точно и понятно передаёт смысл.
- source_word: ὀξίζουσι
  choice: прокисают
  rationale: Глагол указывает на скисание или приобретение кислого запаха/вкуса; «прокисают» сохраняет конкретность образа.
- source_word: ἡ ἡδονὴ τοῦ οἴνου
  choice: приятный вкус вина
  rationale: Буквально речь об «удовольствии/приятности вина»; контекстуальное выражение передаёт утрату его желанного качества естественным современным русским языком.
