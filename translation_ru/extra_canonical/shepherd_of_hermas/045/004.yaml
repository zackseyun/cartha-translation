revisions:
- from: «Когда человек наполняет множество глиняных сосудов хорошим вином и среди них остаётся несколько пустых, он, подойдя к сосудам, не осматривает полные, потому что знает, что они полны, но осматривает пустые, опасаясь, как бы они не прокисли. Ведь пустые сосуды быстро прокисают, и тогда пропадает приятный вкус вина».
  to: «Когда человек наполняет множество глиняных сосудов хорошим вином и среди этих сосудов есть несколько пустых, он подходит к сосудам и не осматривает полные, потому что знает, что они полны; но осматривает пустые, опасаясь, как бы они не прокисли. Ведь пустые сосуды быстро прокисают, и пропадает вся прелесть вина».
  rationale: 'Внесены только стилистико-семантические уточнения: нейтральное «есть несколько пустых» точнее отражает греческую конструкцию, а «вся прелесть вина» сохраняет более широкий смысл ἡδονή, чем «приятный вкус».'
