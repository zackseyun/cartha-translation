base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/005.yaml
  text: '"So also the devil comes upon all the servants of God, testing them. Therefore, as many as are full in faith have strongly resisted him, and he withdraws from them, having no place where he may enter. He comes then to the empty ones; and having a place, he enters into them, and he does in them what he wishes, and they become enslaved to him."'
translation:
  language: ru
  text: Так и дьявол приходит ко всем рабам Божьим, испытывая их. Поэтому те, кто исполнен веры, стойко противятся ему, и он отступает от них, не имея места, куда войти. Тогда он приходит к тем, кто пуст; найдя место, входит в них, делает в них всё, что хочет, и они становятся его рабами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκπειράζων
  choice: испытывая
  rationale: Передаёт проверку веры посредством искушения, не сужая значение исключительно до «искушая».
- source_word: πλήρεις ... ἐν τῇ πίστει
  choice: исполнен веры
  rationale: Сохраняет образ наполненных сосудов из ближайшего контекста и естественно звучит по-русски.
- source_word: ἀνθεστήκασιν ... ἰσχυρῶς
  choice: твёрдо противостоят
  rationale: Передаёт энергичное сопротивление без неестественного буквального «сильно противостали».
- source_word: ἀπόκενοι
  choice: те, кто пуст
  rationale: Сохраняет ключевую метафору пустых сосудов; добавление «духовно» отсутствовало бы в оригинале.
- source_word: ὑπόδουλοι
  choice: рабы
  rationale: Передаёт состояние полного подчинения; в данном контексте естественнее, чем отвлечённое «порабощённые».
theological_decisions:
- issue: Характер власти дьявола над человеком
  choice: «найдя место, входит в них»
  alternative: «получив возможность, овладевает ими»
  rationale: Сохранён пространственный образ оригинала и связь с предшествующим утверждением, что в исполненных веры нет места для входа; не вводится более сильное понятие «овладения».
- issue: Действие внутри человека
  choice: «делает в них всё, что хочет»
  alternative: «поступает с ними, как хочет»
  rationale: Предлог ἐν указывает на действие «в них»; формулировка сохраняет напряжённость текста и не заменяет внутреннее действие внешним обращением.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Сохранены повторяющиеся образы наполненности, пустоты, места и входа. Синтаксис слегка выровнен для ясности, без устранения богословской напряжённости.
