revisions:
- from: Так и дьявол приходит ко всем рабам Божьим, испытывая их. Те, кто исполнен веры, твёрдо противостоят ему, и он отступает от них, не находя места, куда мог бы войти. Тогда он приходит к тем, кто пуст; найдя место, входит в них, делает в них всё, что хочет, и они становятся его рабами.
  to: Так и дьявол приходит ко всем рабам Божьим, испытывая их. Поэтому те, кто исполнен веры, стойко противятся ему, и он отступает от них, не имея места, куда войти. Тогда он приходит к тем, кто пуст; найдя место, входит в них, делает в них всё, что хочет, и они становятся его рабами.
  rationale: 'Внесены лишь безопасные минимальные правки: восстановлена выводная связь οὖν и уточнён образ отсутствия места для входа. Образ «исполненных» и «пустых» сохранён без интерпретирующих добавлений; смысл подчинения дьяволу не усилен.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:50:15Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл передан точно: дьявол испытывает всех рабов Божьих; исполненные веры сопротивляются ему, и он отступает, не имея места для входа; к «пустым» он приходит, входит и подчиняет их себе. Однако греческое ἀνθεστήκασιν — перфект («оказали/уже оказали твёрдое сопротивление»), а в данном обобщающем контексте русское настоящее «твёрдо противостоят» допустимо, но «стойко противятся» точнее передаёт устойчивое сопротивление и естественнее для современного литературного наставительного регистра. Вторая фраза оригинала имеет явное выводное οὖν («поэтому»), которое лучше сохранить.'
  naturalness: 'Черновик в целом естественен. «Не находя места, куда мог бы войти» несколько меняет синтаксическую опору: греческое μὴ ἔχων τόπον выражает отсутствие доступного места. «Не имея места, куда войти» ближе к образу оригинала и звучит гладко. «Те, кто пуст» сохранено намеренно как образ предыдущего сравнения и не требует пояснения.'
  terminology: «Дьявол», «рабы Божьи», «исполнены веры», «входит», «его рабами» согласованы с греческим и с образным рядом предшествующих параграфов. «Рабы Божьи» сохраняет δοῦλοι τοῦ Θεοῦ; «его рабами» адекватно передаёт ὑπόδουλοι без доктринального усиления.
  issues:
  - severity: low
    issue: Не выражена выводная частица οὖν перед характеристикой исполненных веры.
    rationale: «Поэтому» связывает общее действие дьявола («испытывая») с устойчивым сопротивлением тех, кто полон веры.
  - severity: low
    issue: «Не находя места, куда мог бы войти» менее прямо передаёт μὴ ἔχων τόπον.
    rationale: Оригинал говорит, что у него нет места для входа; вариант «не имея места, куда войти» точнее сохраняет пространственный образ.
  revised_text: Так и дьявол приходит ко всем рабам Божьим, испытывая их. Поэтому те, кто исполнен веры, стойко противятся ему, и он отступает от них, не имея места, куда войти. Тогда он приходит к тем, кто пуст; найдя место, входит в них, делает в них всё, что хочет, и они становятся его рабами.
