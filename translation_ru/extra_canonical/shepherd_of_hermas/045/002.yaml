revisions:
- from: «Человек, — говорю я, — господин, усердно стремится соблюдать заповеди Бога, и нет никого, кто не просил бы Господа укрепить его в исполнении Его заповедей и покорить им; но дьявол жесток и угнетает людей».
  to: 'Он сказал: «Дьявол не может одолеть рабов Божьих, которые всем сердцем надеются на Него. Дьявол может вступить в борьбу, но победить не может. Поэтому, если вы противостанете ему, он, побеждённый и посрамлённый, убежит от вас. Но те, кто пусты, боятся дьявола, словно у него есть сила».'
  rationale: Текст полностью заменён, поскольку исходный русский черновик относится к предыдущему абзацу, а не к 45:2. Перевод сделан по греческому тексту §2. Образ «пусты» сохранён без догматического истолкования, поскольку следующий абзац поясняет его через образ сосудов.
