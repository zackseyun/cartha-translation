base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/002.yaml
  text: '"A person," I say, "Lord, is eager to keep the commandments of God, and there is no one who does not ask from the Lord to be strengthened in his commandments and to be subject to them; but the devil is harsh and tyrannizes them."'
translation:
  language: ru
  text: 'Он сказал: «Дьявол не может одолеть рабов Божьих, которые всем сердцем надеются на Него. Дьявол может вступить в борьбу, но победить не может. Поэтому, если вы противостанете ему, он, побеждённый и посрамлённый, убежит от вас. Но те, кто пусты, боятся дьявола, словно у него есть сила».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: господин
  rationale: В обращении к собеседнику слово передаёт уважительное «господин», тогда как в следующем обороте παρὰ τοῦ Κυρίου относится к Богу и переведено «Господа».
- source_word: πρόθυμός ἐστι
  choice: усердно стремится
  rationale: Передаёт готовность и горячее желание действовать, естественно сочетаясь с соблюдением заповедей.
- source_word: φυλάσσειν
  choice: соблюдать
  rationale: Обычное и точное русское соответствие в контексте заповедей.
- source_word: ἐνδυναμωθῇ ἐν ταῖς ἐντολαῖς αὐτοῦ
  choice: укрепить его в исполнении Его заповедей
  rationale: Русское уточнение «в исполнении» раскрывает необычное греческое сочетание и сохраняет смысл просьбы о силе жить по заповедям.
- source_word: ὑποταγῇ αὐταῖς
  choice: покорить им
  rationale: Сохраняет пассивную форму и сильный смысл подчинения заповедям.
- source_word: σκληρός
  choice: жесток
  rationale: В данном контексте характеризует суровое, безжалостное противодействие дьявола.
- source_word: καταδυναστεύει
  choice: угнетает
  rationale: Передаёт властное подавление и господство без излишне архаичного «тиранствует».
- source_word: αὐτῶν
  choice: людей
  rationale: Явно обозначает подразумеваемую группу людей; русское местоимение «их» могло бы ошибочно отсылать к заповедям.
theological_decisions:
- issue: Соотношение человеческого стремления, молитвы и Божьего укрепления
  choice: Сохранены одновременно стремление человека соблюдать заповеди и его просьба к Господу об укреплении
  alternative: Сформулировать так, будто соблюдение зависит исключительно от человеческой воли или исключительно от Божьего действия
  rationale: Греческий текст удерживает обе стороны вместе и не разрешает это напряжение систематически.
- issue: Значение обращения κύριε
  choice: Первое κύριε передано как «господин», второе τοῦ Κυρίου — как «Господа»
  alternative: В обоих случаях употребить «Господь»
  rationale: Первое является уважительным обращением Гермаса к наставнику, а второе ясно обозначает Бога.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Реплики оформлены естественно; избегнуты как церковнославянизмы, так и разговорная сниженная лексика.
