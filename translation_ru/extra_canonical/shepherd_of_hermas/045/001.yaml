  yaml_path: translation/extra_canonical/shepherd_of_hermas/045/001.yaml
  text: I say to him, "Lord, listen to a few words from me." He says, "Speak what you wish."
translation:
  language: ru
  text: 'Я говорю ему: «Господин, выслушай от меня несколько слов». Он отвечает: «Говори, что хочешь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Господин
  rationale: В обращении к наставнику слово передаёт почтительное «господин», а не обязательно божественный титул «Господь».
- source_word: ἄκουσόν μου ὀλίγων ῥημάτων
  choice: выслушай от меня несколько слов
  rationale: Естественно по-русски передаёт просьбу позволить кратко высказаться, сохраняя образ «нескольких слов».
- source_word: Λέγε ... ὃ βούλει
  choice: Говори, что хочешь
  rationale: Сохраняет прямой и разрешительный характер ответа без лишнего уточнения.
