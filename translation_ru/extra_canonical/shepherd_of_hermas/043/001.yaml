  text: “I wanted,” I said, “sir, to know in what ways I must serve desire…”
translation:
  language: ru
  text: «Я хотел, господин, узнать, какими способами мне следует служить желанию…» — сказал я.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤθελον
  choice: «Я хотел бы»
  rationale: Имперфект θέλω в контексте вежливого обращения естественно передаётся русским условным оборотом, выражающим сдержанное желание.
- source_word: κύριε
  choice: «господин»
  rationale: Сохраняет уважительное обращение к собеседнику без внесения прямого богословского титула «Господь».
- source_word: ποίοις τρόποις
  choice: «какими способами»
  rationale: Прямо передаёт вопрос о способах или образе действия, не сужая его до одного метода.
- source_word: με δεῖ δουλεῦσαι
  choice: «мне следует служить»
  rationale: Передаёт безличную необходимость δεῖ и сильный глагол δουλεύω, буквально обозначающий служение или подчинение.
- source_word: τῇ ἐπιθυμίᾳ
  choice: «желанию»
  rationale: ἐπιθυμία может означать желание, влечение или страсть; нейтральное «желание» сохраняет неоднозначность данного обрезанного фрагмента.
theological_decisions:
- issue: Направленность выражения «служить желанию»
  choice: Сохранить буквальное и напряжённое выражение без пояснения объекта или нравственной оценки желания.
  alternative: Передать как «противостоять дурному желанию» либо «служить доброму желанию».
  rationale: Предоставленный греческий фрагмент обрывается после начальной буквы следующего слова и сам по себе не уточняет характер ἐπιθυμία; контекстуальное разрешение здесь было бы внесением отсутствующего материала.
translation_notes:
  register: Современный литературный русский язык с уважительным, но не архаичным обращением. Многоточие отмечает фактическую незавершённость предоставленного исходного фрагмента.
