base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/055/002.yaml
  text: “Those sheep you saw not skipping but grazing in one place—these are the ones who have handed themselves over to luxuries and deceptions, yet they have not blasphemed the Lord at all. These, then, have been corrupted from the truth; in them there is hope of repentance, by which they can live. Corruption, then, has hope of a certain renewal, but death has eternal destruction.”
translation:
  language: ru
  text: «Ты видел овец, которые не резвились, а паслись на одном месте. Это те, кто предал себя роскоши и обманам, но нисколько не хулил Господа. Итак, они испорчены, отступив от истины[a]; но у них есть надежда на покаяние, в котором они могут жить. Итак, такая порча оставляет надежду на некоторое обновление, а смерть имеет вечную погибель».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «испорчены (или: растлены) от истины»; возможен также смысл: «совращены с истины» или «отпали от истины».'
    reason: Греческое κατεφθαρμένοι ἀπὸ τῆς ἀληθείας допускает оттенки нравственной порчи и удаления от истины. Сноска отмечает диапазон, не навязывая одного толкования.
lexical_decisions:
- source_word: σκιρτῶντα
  choice: резвились
  rationale: Передаёт образ овец, которые скачут или резвятся, естественным русским словом.
- source_word: τρυφαῖς
  choice: роскоши
  rationale: Сохраняет значение изнеживающих удовольствий и безудержной праздности; в данном контексте «роскошь» звучит естественно и нравственно окрашенно.
- source_word: ἀπάταις
  choice: обманам
  rationale: Сохраняет множественное число и допускает как обманы, которым они поддались, так и обманчивые соблазны.
- source_word: κατεφθαρμένοι ... ἀπὸ τῆς ἀληθείας
  choice: уклонились от истины и погрязли в пороке
  rationale: Греческая конструкция буквально говорит об испорченности или растлении по отношению к истине; формулировка передаёт и отделение от истины, и нравственную порчу, не сводя смысл только к интеллектуальному заблуждению.
- source_word: μετανοίας
  choice: покаяние
  rationale: Устоявшийся и точный русский эквивалент перемены ума и жизни.
- source_word: ζῆσαι
  choice: обрести жизнь
  rationale: Передаёт не просто продолжение существования, а возможность войти в жизнь через покаяние, сохраняя богословскую открытость выражения.
- source_word: καταφθορά
  choice: такое падение
  rationale: Абстрактное существительное обозначает порчу, растление или разрушение; контекст противопоставляет обратимое состояние окончательной смерти. «Падение» естественно по-русски и снабжено сноской о буквальном диапазоне.
- source_word: ἀπώλειαν ... αἰώνιον
  choice: вечной погибели
  rationale: Сохраняет сильное эсхатологическое значение ἀπώλεια без уточнения природы вечной погибели.
theological_decisions:
- issue: Возможность жизни через покаяние
  choice: «через которое они могут обрести жизнь»
  alternative: «в котором они могут жить»
  rationale: Местоимение ἐν ᾗ грамматически относится к «покаянию» или «надежде» в зависимости от понимания связи; выбранная формулировка естественно связывает жизнь с покаянием, но не утверждает конкретной сотериологической схемы.
- issue: Противопоставление порчи и смерти
  choice: Порча представлена как обратимое падение, смерть — как ведущая к вечной погибели
  alternative: Отождествить «смерть» с определённым видом греха или окончательным осуждением
  rationale: Источник оставляет образные категории без догматического определения; перевод сохраняет напряжение между надеждой обновления и окончательной погибелью.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Синтаксис упрощён умеренно; пастушеский образ и формальное противопоставление обратимой порчи окончательной смерти сохранены. Все сноски отмечены в основном тексте.
