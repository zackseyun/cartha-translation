base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/055/003.yaml
  text: 5. Again we went on a little, and he shows me a great shepherd, savage in appearance, wearing a white goatskin, and he had a bag on his shoulders, and a very hard staff with knots, and a great whip. He had a very harsh look, so that I was afraid of him—such was his look.
translation:
  language: ru
  text: 5. Мы снова прошли немного вперёд, и он показывает мне большого пастуха, с виду свирепого. На нём была белая козья шкура; за плечами он носил суму, а в руках держал очень крепкий сучковатый посох и большой бич. Взгляд у него был крайне суровый, так что я испугался его, — таким был его взгляд.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιμένα μέγαν
  choice: большого пастуха
  rationale: Передаёт прямое значение прилагательного μέγαν без уточнения, относится ли оно к росту, внушительности или значимости.
- source_word: ἄγριον τῇ ἰδέᾳ
  choice: с виду свирепого
  rationale: ἰδέα здесь обозначает внешний вид, а ἄγριος — дикость или свирепость; выбран естественный русский оборот.
- source_word: δέρμα αἴγειον λευκόν
  choice: белая козья шкура
  rationale: Сохраняет конкретный материал и цвет одеяния.
- source_word: πήραν
  choice: суму
  rationale: Обозначает дорожную или пастушескую сумку; слово «сума» соответствует древнему предмету и сохраняет достоинство стиля.
- source_word: ῥάβδον σκληρὰν λίαν καὶ ὄζους ἔχουσαν
  choice: очень крепкий сучковатый посох
  rationale: σκληρός в описании деревянного посоха естественно передаётся как «крепкий», а наличие ὄζοι — как «сучковатый».
- source_word: μάστιγα μεγάλην
  choice: большой бич
  rationale: Сохраняет образ орудия наказания и буквальную характеристику размера.
- source_word: βλέμμα ... περίπικρον
  choice: взгляд ... крайне суровый
  rationale: Редкое усиленное περίπικρος буквально связано с крайней горечью или жестокостью; «крайне суровый» естественно описывает устрашающий взгляд, не преувеличивая его до прямой злобы.
