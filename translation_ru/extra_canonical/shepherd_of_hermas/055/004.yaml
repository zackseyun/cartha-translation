    rationale: σπαταλῶντα описывает расточительный, распущенно-изнеженный образ жизни; по-русски естественнее «жили расточительно», с сохранением второго глагола для τρυφῶντα.
  - severity: low
    issue: «Не могли устоять на месте» излишне сужает значение οὐκ εὐσταθοῦσαν.
    rationale: Глагол может обозначать отсутствие устойчивости, спокойствия или устроенности. Контекст понукания поддерживает «не находили покоя», но не требует буквальной неспособности стоять.
  - severity: low
    issue: «В одно обрывистое место» звучит шероховато.
    rationale: Для κρημνώδη более естественно «в некое крутое место» или «в крутое, обрывистое место».
