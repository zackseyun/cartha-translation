base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/055/004.yaml
  text: 6. This shepherd, then, took over the sheep from the shepherd who was a young man—those that were living wastefully and self-indulgently, but not skipping—and he cast them into a certain steep, thorny place full of thistles, so that, because of the thorns and thistles, the sheep were unable to disentangle themselves, but [were entangled in the thorns and thistles; these, then,] being entangled, grazed among the thorns and thistles. They suffered greatly, being torn by him; he drove them here and there and gave them no rest, and those sheep were not at all steady.
translation:
  language: ru
  text: 6. Тогда этот пастух принял от молодого пастуха тех овец, которые жили расточительно и предавались удовольствиям, но не резвились, и бросил их в некое крутое место, заросшее колючками и чертополохом. Из-за колючек и чертополоха овцы не могли выпутаться, но [запутывались в колючках и чертополохе; тогда они,] запутавшись, паслись среди колючек и чертополоха. Они жестоко страдали от его побоев; он гонял их туда и сюда и не давал им покоя, и эти овцы вовсе не находили покоя.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и эти овцы вовсе не были устойчивы». Глагол εὐσταθέω может обозначать устойчивость, спокойствие или устроенное состояние; в данном контексте вероятен оттенок отсутствия покоя.'
    reason: Сноска сохраняет смысловую широту греческого глагола, а основной текст следует непосредственному контексту непрестанного понукания и отсутствия отдыха.
lexical_decisions:
- source_word: σπαταλῶντα καὶ τρυφῶντα
  choice: предавались расточительности и наслаждениям
  rationale: 'Передаёт два взаимосвязанных, но различных понятия: беспутно-расточительную жизнь и изнеженную тягу к удовольствиям.'
- source_word: κρημνώδη
  choice: обрывистое
  rationale: Сохраняет прямое значение опасной крутой, обрывистой местности.
- source_word: ἀκανθώδη καὶ τριβολώδη
  choice: заросшее колючками и чертополохом
  rationale: Различает общее обозначение колючих растений и более конкретный вид колючего сорняка; «чертополох» естественно звучит по-русски.
- source_word: ἐταλαιπώρουν δαιρόμενα ὑπ' αὐτοῦ
  choice: жестоко страдали от его побоев
  rationale: Деятель обозначен местоимением «его», как в греческом тексте; δαιρόμενα понимается как «подвергаясь побоям», а не как повреждение колючками.
- source_word: οὐκ εὐσταθοῦσαν
  choice: совсем не могли устоять на месте
  rationale: Передаёт отсутствие устойчивого положения и контекст непрерывного понукания, не сводя выражение лишь к нравственной нестойкости.
theological_decisions:
- issue: Характер наказания овец
  choice: Сохранено прямое указание, что овцы страдают от побоев пастуха
  alternative: Истолковать страдания только как следствие колючек
  rationale: Греческое ὑπ' αὐτοῦ явно указывает на пастуха как деятеля при δαιρόμενα; смягчение устранило бы напряжённость образа суда и исправления.
- issue: Поведение овец до передачи суровому пастуху
  choice: «предавались расточительности и наслаждениям, но не резвились»
  alternative: Обобщить как «жили греховно»
  rationale: Конкретные различия между категориями овец важны для аллегории и должны быть сохранены без внесения доктринального толкования.
translation_notes:
  register: Современный литературный русский язык с сохранением суровой образности оригинала. Повторения «колючки и чертополох» оставлены намеренно, поскольку они заметны в греческом тексте. Квадратные скобки воспроизводят текстуально сомнительный фрагмент источника; маркер сноски присутствует в основном тексте.
