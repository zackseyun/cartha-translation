  yaml_path: translation/extra_canonical/shepherd_of_hermas/055/001.yaml
  text: And he says to me, “Do you see this shepherd?” “I do,” I say, “sir.”
translation:
  language: ru
  text: 'И он говорит мне: «Видишь этого пастуха?» — «Вижу, господин», — отвечаю я.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιμένα
  choice: пастуха
  rationale: В данном повествовательном контексте речь идёт о человеке, пасущем овец; современное русское «пастух» естественнее и конкретнее, чем церковно окрашенное «пастырь».
- source_word: κύριε
  choice: господин
  rationale: Это почтительное обращение к собеседнику; строчная буква и перевод «господин» не отождествляют адресата с Господом.
- source_word: φημί
  choice: отвечаю я
  rationale: Буквально «говорю я», но после вопроса русский глагол «отвечаю» естественно передаёт функцию реплики, сохраняя настоящее историческое время.
