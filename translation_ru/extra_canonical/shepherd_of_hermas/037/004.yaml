base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/004.yaml
  text: “I, lord,” I say, “am senseless, and I do not understand these parables. For how can it wear away and then save? I do not understand.”
translation:
  language: ru
  text: «Господин, — говорю я, — я неразумен и не понимаю этих притч. Как она может губить, а затем снова спасать? Не понимаю».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: Господин
  rationale: В обращении к наставляющему ангелу слово передано как уважительное «Господин», без отождествления собеседника с Господом Богом.
- source_word: ἀσύνετός
  choice: неразумен
  rationale: Передаёт недостаток понимания, сохраняя связь с последующим οὐ συνίω.
- source_word: παραβολὰς
  choice: притч
  rationale: Обычное и уместное в раннехристианском контексте обозначение образных, требующих истолкования речений.
- source_word: ἐκτρίβειν
  choice: изгонять
  rationale: Выбор обусловлен ближайшим контекстом, где печаль «изгоняет Святого Духа»; сохраняется предмет вопроса из предыдущей реплики.
- source_word: σῴζειν
  choice: спасать
  rationale: Сохранено прямое богословски значимое значение глагола без смягчения до «сохранять».
theological_decisions:
- issue: Необычное утверждение, что печаль может «изгонять и затем спасать»
  choice: Сохранить парадокс без поясняющего исправления
  alternative: Передать πάλιν как противопоставление «с другой стороны» либо исправить текст по предполагаемой порче
  rationale: Греческий текст в данном месте намеренно или вследствие текстовой трудности создаёт напряжение, которое сам говорящий прямо отмечает; перевод не должен его устранять.
translation_notes:
  register: Современный литературный русский язык с ясной диалогической пунктуацией; тон почтительный и простой. Повтор «не понимаю» сохранён, поскольку он соответствует греческому тексту и обрамляет вопрос.
