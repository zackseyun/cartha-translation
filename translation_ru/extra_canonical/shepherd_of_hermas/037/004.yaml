  source_fidelity: 'Вопрос в греческом тексте сохраняет два инфинитива без названного дополнения: ἐκτρίβειν («истреблять/губить, изнурять») и πάλιν σῴζειν («и снова спасать»). Черновое «изгонять» необоснованно подставляет действие над Святым Духом из предыдущей реплики, хотя говорящий здесь формулирует именно недоумение о самом парадоксе.'
  naturalness: Диалогическая форма и повтор «не понимаю» естественны для современного литературного русского. Замена «изгонять» на «губить» делает вопрос самостоятельным и ясным, не добавляя отсутствующего в оригинале объекта.
  terminology: «Господин» уместно передаёт κύριε как уважительное обращение. «Неразумен» приемлемо для ἀσύνετος; «притчи» сохраняет традиционное значение παραβολαί и соответствует английскому аудиторскому переводу.
