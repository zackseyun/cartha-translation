  text: “Remove sorrow from yourself,” he says, “for it is a sister of double‑mindedness and quick temper.”
translation:
  language: ru
  text: «Удали от себя печаль, — говорит он, — ведь и она сестра двоедушия и вспыльчивости».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἆρον ἀπὸ σεαυτοῦ
  choice: Удаляй от себя
  rationale: Императив ἆρον буквально означает «убери, удали». Несовершенный по смыслу русский императив естественно передаёт общее нравственное предписание, а не разовое физическое действие.
- source_word: λύπην
  choice: печаль
  rationale: Слово обозначает печаль, скорбь или душевную тяготу. «Печаль» сохраняет широкий нравственно-психологический смысл и соответствует дальнейшему рассуждению автора.
- source_word: διψυχίας
  choice: двоедушия
  rationale: Буквально — состояние «двух душ», внутренняя раздвоенность и колебание. Традиционное русское «двоедушие» сохраняет образ исходного слова и его раннехристианскую нравственную окраску.
- source_word: ὀξυχολίας
  choice: вспыльчивости
  rationale: Слово означает раздражительную горячность, скорую на гнев. «Вспыльчивость» понятно современному читателю и точнее передаёт устойчивую склонность, чем единичный «гнев».
theological_decisions:
- issue: Персонификация печали как родственной другим порокам
  choice: «она сестра двоедушия и вспыльчивости»
  alternative: «она сродни двоедушию и вспыльчивости»
  rationale: Греческое ἀδελφή прямо означает «сестра». Образ сохранён без рационализирующего перефразирования.
translation_notes:
  register: Современный литературный русский с сохранением краткой наставительной формы и прямой персонификации оригинала. «Удаляй» звучит как постоянное нравственное требование; архаизирующие обороты не использованы.
