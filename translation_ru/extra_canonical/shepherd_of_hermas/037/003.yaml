base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/003.yaml
  text: “You are senseless, man,” he says, “and do you not perceive that sorrow is more evil than all the spirits and most dreadful for the servants of God, and that beyond all the spirits it destroys a person and wears away the Holy Spirit—and then saves again?”
translation:
  language: ru
  text: «Неразумный ты человек, — говорит он, — и разве ты не понимаешь, что печаль пагубнее всех духов и страшнее всего для рабов Божьих, что она губит человека сильнее всех духов, вытесняет Святого Духа — а затем снова спасает?»[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и снова спасает». Это выражение в греческом тексте трудно для понимания; возможно, текст здесь повреждён. Следующая реплика также подчёркивает его парадоксальность.'
    reason: Примечание сохраняет засвидетельствованное трудное чтение, не исправляя его в переводе и не утверждая предположительную порчу текста как факт.
lexical_decisions:
- source_word: ἀσύνετος
  choice: неразумный
  rationale: Передаёт недостаток понимания, а не просто отсутствие знаний; соответствует последующему οὐ νοεῖς.
- source_word: λύπη
  choice: печаль
  rationale: Естественное и достаточно широкое обозначение тягостного душевного состояния; сохраняет связь с темой раздела.
- source_word: πάντων τῶν πνευμάτων πονηροτέρα
  choice: злее всех духов
  rationale: Сохраняет сравнительную конструкцию и персонифицированное представление о печали как об одном из духов.
- source_word: δεινοτάτη τοῖς δούλοις τοῦ θεοῦ
  choice: всего страшнее для рабов Божьих
  rationale: Передаёт превосходную степень и направленность угрозы без конфессионального уточнения.
- source_word: καταφθείρει
  choice: губит
  rationale: Выражает разрушительное действие сильнее нейтрального «портит», оставаясь естественным по-русски.
- source_word: ἐκτρίβει τὸ πνεῦμα τὸ ἅγιον
  choice: изгоняет Святого Духа
  rationale: В данном контексте ἐκτρίβει означает вытеснение или изгнание; выбор согласуется с противопоставлением последующему «спасает».
- source_word: πάλιν σώζει
  choice: вновь спасает
  rationale: Буквально сохраняет трудное и, возможно, повреждённое чтение греческого текста, не устраняя его парадокс.
theological_decisions:
- issue: Печаль названа одним из «духов» и сопоставлена с другими духами.
  choice: Сохранить буквальное «злее всех духов» без поясняющей категоризации.
  alternative: Передать как «хуже всех злых духов» или «хуже всякого дурного расположения духа».
  rationale: Греческий текст не содержит здесь слова «злых» при πάντων τῶν πνευμάτων, а контекст допускает персонифицированный язык; уточнение преждевременно разрешило бы неоднозначность.
- issue: Парадоксальная фраза καὶ πάλιν σώζει.
  choice: Перевести «и вновь спасает?» и отметить текстовую трудность.
  alternative: Исправить смысл предположительно на «и снова губит» либо связать спасение с действием Святого Духа.
  rationale: Сохраняется засвидетельствованное чтение и богословское напряжение, которое прямо становится предметом вопроса в следующем предложении.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Обращение «Неразумный ты человек» сохраняет резкость оригинала, а синтаксис слегка упорядочен для ясного чтения вслух.
