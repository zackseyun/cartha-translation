base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/006.yaml
  text: “But those who have the fear of God and inquire about the divine and the truth and have their heart toward the Lord quickly understand and comprehend everything spoken to them, because they have the fear of the Lord within themselves; for where the Lord dwells, there also is abundant understanding. Therefore cling to the Lord, and you will understand and comprehend all things.”
translation:
  language: ru
  text: Те же, кто имеет страх Божий, исследуют Божественное и истину и обращают своё сердце к Господу, быстро понимают и постигают всё, что им говорится, потому что имеют в себе страх Господень. Ведь где обитает Господь, там много разумения. Итак, прилепись к Господу — и всё поймёшь и постигнешь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόβον θεοῦ / φόβον τοῦ κυρίου
  choice: страх Божий / страх Господень
  rationale: Сохраняет устойчивый библейский язык благоговейного страха и различие формулировок оригинала.
- source_word: ἐρευνῶντες περὶ θεότητος
  choice: исследует Божественное
  rationale: Передаёт деятельное, вдумчивое искание, а θεότης здесь — предмет размышления о божественной реальности, не просто абстрактное «божество».
- source_word: τὴν καρδίαν ἔχοντες πρὸς τὸν κύριον
  choice: обращает своё сердце к Господу
  rationale: Естественно по-русски выражает направленность сердца к Господу, не добавляя идеи обращения в конфессиональном смысле.
- source_word: νοοῦσι καὶ συνίουσιν
  choice: понимают и постигают
  rationale: Сохраняет парность близких глаголов оригинала без полного стилистического дублирования.
- source_word: σύνεσις πολλή
  choice: разумения много
  rationale: Сохраняет количественный образ греческого выражения и его слегка афористический строй.
- source_word: κολλήθητι
  choice: прилепись
  rationale: Точно передаёт сильную идею тесной и постоянной приверженности; слово укоренено в русском библейском регистре.
theological_decisions:
- issue: Связь присутствия Господа и разумения
  choice: «где обитает Господь, там и разумения много»
  alternative: «где живёт Господь, там есть и глубокое понимание»
  rationale: Сохранена прямая богословская связь и образ обитания без психологизации или уточнения способа присутствия Господа.
- issue: Значение «страха»
  choice: Сохранить буквальное «страх», не заменяя его словом «благоговение»
  alternative: «благоговение перед Богом»
  rationale: Греческий φόβος допускает благоговейный оттенок, но замена сняла бы присущую исходному выражению смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Сохранены библейские формулы «страх Господень», «обитает Господь» и «прилепись к Господу»; синтаксис слегка упрощён для ясности, но риторический параллелизм оригинала удержан.
