base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/002.yaml
  text: “How, lord,” I say, “is it a sister of these? For quick temper seems to me one thing, double‑mindedness another, and sorrow another.”
translation:
  language: ru
  text: «Как же, господин, — говорю я, — она им сестра? Ведь, как мне кажется, вспыльчивость — это одно, двоедушие — другое, а печаль — третье».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: господин
  rationale: Обращение к наставляющему собеседнику передано уважительно, без необоснованного отождествления его с Господом Богом.
- source_word: ὀξυχολία
  choice: вспыльчивость
  rationale: Передаёт склонность быстро приходить в гнев и звучит естественно в современном русском языке.
- source_word: διψυχία
  choice: двоедушие
  rationale: Сохраняет образ внутренней раздвоенности и устойчивую раннехристианскую нравственную терминологию.
- source_word: λύπη
  choice: печаль
  rationale: Прямо передаёт эмоционально-нравственное понятие λύπη в данном контексте.
- source_word: ἄλλο … καὶ ἄλλο … καὶ ἄλλο
  choice: одно … другое … третье
  rationale: Естественно воспроизводит трёхчастное противопоставление греческого текста.
theological_decisions:
- issue: Значение обращения κύριε
  choice: господин
  alternative: Господи
  rationale: В данном диалоге это уважительное обращение к собеседнику-наставнику; перевод «Господи» мог бы ошибочно представить его как прямое обращение к Богу.
translation_notes:
  register: Современный литературный русский язык; диалогическая интонация сохранена, а краткое «она им сестра?» естественно передаёт сжатую греческую конструкцию ἀδελφή ἐστι τούτων.
