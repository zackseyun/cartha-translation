- from: «Послушай, — говорит он. — Те, кто никогда не исследовал истину и не стремился познать божественное, а лишь уверовал, но при этом погряз в делах, богатстве, дружбе с язычниками и во множестве других забот нынешнего века, — все, кто предаётся этому, не понимают притч о божественном. Ведь эти занятия омрачают их, губят и делают бесплодными. Как хорошие виноградники, оставленные без ухода, зарастают колючками и всевозможными сорняками и становятся бесплодными, так и уверовавшие люди, погружаясь во множество упомянутых дел, сбиваются с верного пути в своих мыслях и уже совершенно ничего не понимают в праведности. Даже когда они слышат о божественном и об истине, их ум занят собственными делами, и они совершенно ничего не понимают».
