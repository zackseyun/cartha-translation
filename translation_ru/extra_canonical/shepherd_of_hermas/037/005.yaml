base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/037/005.yaml
  text: “Listen,” he says. “Those who have never inquired about the truth nor sought concerning the divine, but have only believed, and are mixed up with business affairs and wealth and pagan friendships and many other affairs of this age—so all who devote themselves to these do not understand the parables of the divine; for they are darkened by these pursuits and are corrupted and become barren. Just as good vineyards, when they are neglected, become barren from thorns and various weeds, so also the people who have believed and fall into these many pursuits just mentioned are led astray from their understanding, and they understand nothing at all about righteousness. And even when they hear about the divine and the truth, their mind is occupied with their business, and they understand nothing at all.
translation:
  language: ru
  text: '«Послушай, — говорит он. — Те, кто никогда не исследовал истину и не стремился познать божественное, а только уверовал, погрязли в делах, богатстве, дружбе с язычниками и во множестве других занятий нынешнего века. Все, кто предаётся этому, не понимают притч о божественном: эти занятия омрачают их, губят и делают бесплодными. Как хорошие виноградники, если их оставить без ухода, зарастают колючками и всевозможными сорняками и становятся бесплодными, так и люди, уверовавшие и погружающиеся во множество упомянутых дел, сбиваются в своих мыслях и совершенно ничего не понимают о том, что такое праведность. И даже когда они слышат о божественном и об истине, их ум занят их делами, и они совершенно ничего не понимают».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρευνήσαντες / ἐπιζητήσαντες
  choice: исследовал / стремился познать
  rationale: Передаёт различие между вдумчивым исследованием и настойчивым поиском, сохраняя естественность русской речи.
- source_word: θεότης
  choice: божественное
  rationale: Греческое слово здесь обозначает область знания о Боге или божественной реальности; нейтральное субстантивированное прилагательное сохраняет широту и некоторую необычность выражения.
- source_word: ἐμπεφυρμένοι
  choice: погряз
  rationale: Выражает тесную и пагубную вовлечённость в мирские занятия, а не просто наличие дел.
- source_word: πραγματείαι / πράξεις / πρᾶξις
  choice: дела, заботы, занятия
  rationale: Контекстуально варьируется для естественного русского текста, сохраняя общий мотив поглощённости житейской деятельностью.
- source_word: φιλίαις ἐθνικαῖς
  choice: дружбе с язычниками
  rationale: Прямо передаёт социальные связи с представителями языческого окружения без добавления конфессиональной оценки.
- source_word: κεχερσωμένοι / χερσοῦνται
  choice: бесплодными / становятся бесплодными
  rationale: Сохраняет сельскохозяйственную метафору запустения, подготавливающую сравнение с виноградником.
- source_word: ἀποπλανῶνται ἀπὸ τῆς διανοίας αὐτῶν
  choice: сбиваются с верного пути в своих мыслях
  rationale: Греческое выражение буквально говорит об отклонении от собственного разумения; перевод сохраняет образ уклонения, не превращая его в конкретное догматическое заблуждение.
theological_decisions:
- issue: Смысл θεότης
  choice: божественное
  alternative: Божество; учение о Боге
  rationale: «Божественное» не сужает выражение до систематического богословия и не делает его исключительно именованием Божьей природы.
- issue: Характер первоначальной веры
  choice: лишь уверовал
  alternative: просто поверил
  rationale: Формулировка сохраняет противопоставление между одной только первоначальной верой и последующим поиском истины, не отрицая подлинности самой веры.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Сохранены повторения «совершенно ничего не понимают» и образ запущенного виноградника; синтаксис слегка упрощён для ясности обычному читателю.
