base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/003.yaml
  text: I say to him, “Sir, allow me to ask you a few things.” “Speak,” he says. “Sir,” I say, “if someone has a wife who is faithful in the Lord, and he finds her in some adultery, does the husband sin by living together with her?”
translation:
  language: ru
  text: 'Я говорю ему: «Господин, позволь мне задать тебе несколько вопросов». Он отвечает: «Говори». Я спрашиваю: «Господин, если у человека есть жена, верующая в Господа, и он уличит её в прелюбодеянии, грешит ли муж, продолжая жить с ней?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Господин
  rationale: В обращении к наставнику слово означает уважительное «господин», а не обращение к Богу; это также сохраняет различие с выражением «в Господе» далее.
- source_word: γυναῖκα ... πιστὴν ἐν Κυρίῳ
  choice: жена, верующая в Господа
  rationale: πιστή здесь естественно понимается как принадлежность к верующим; русская формулировка передаёт смысл идиомы ἐν Κυρίῳ без тяжеловесной кальки.
- source_word: εὕρῃ ἐν μοιχείᾳ τινί
  choice: уличит её в прелюбодеянии
  rationale: Греческое выражение буквально говорит, что муж «найдёт» её в некоем прелюбодеянии; «уличит» естественно передаёт обнаружение факта, не добавляя подробностей.
- source_word: συνζῶν μετ᾿ αὐτῆς
  choice: продолжая жить с ней
  rationale: Передаёт совместную супружескую жизнь и контекстуальную мысль о её продолжении после обнаружения измены, не сужая значение до половой связи.
theological_decisions:
- issue: Смысл «верная/верующая в Господе»
  choice: верующая в Господа
  alternative: верная в Господе
  rationale: В раннехристианском контексте πιστή обычно обозначает верующую; выбор не утверждает её супружескую верность, что противоречило бы последующему условию.
- issue: Характер совместной жизни после прелюбодеяния
  choice: продолжая жить с ней
  alternative: сожительствуя с ней
  rationale: Современное «сожительствовать» может ошибочно намекать на незарегистрированный союз или только половую связь; исходный текст говорит шире о совместной жизни супругов.
translation_notes:
  register: Современный литературный русский язык с почтительным, но естественным диалогом. Синтаксис слегка упрощён ради ясности, при этом вопросительная форма и повтор обращения сохранены.
