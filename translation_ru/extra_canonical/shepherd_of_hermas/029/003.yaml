  terminology: «Господин» последовательно отделяет обращение к наставнику от «в Господе». «Жена, верующая в Господа» корректно передаёт πιστὴ ἐν Κυρίῳ и не создаёт ложного впечатления о супружеской верности. «Прелюбодеяние» соответствует μοιχεία и уместно для регистра текста.
