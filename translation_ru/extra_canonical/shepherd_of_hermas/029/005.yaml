  source_fidelity: 'Основной смысл греческого текста (Mand. 4.1.9–10) передан верно: телесное осквернение и изготовление «подобий» уподобляются прелюбодеянию; предписано не жить с нераскаянным человеком, чтобы не стать причастным его греху; затем говорится о пребывании отдельно ввиду возможности покаяния. Однако «оставаться одним» менее точно и несколько неестественно передаёт ἐφ᾽ ἑαυτοῖς μένειν.'
  naturalness: Современный и понятный язык в целом удачен. Сочетание «упорствует и в подобных делах» звучит тяжеловесно, а «вам заповедано оставаться одним — и мужчине, и женщине» грамматически и стилистически неровно. «Оставаться поодиночке» естественнее и лучше выражает предписание.
  terminology: «Прелюбодействует», «оскверняет свою плоть», «кается», «соучастник» уместны и сохраняют терминологическую связь оригинала. «Изображения» допустимо, но τὰ ὁμοιώματα буквально означает «подобия/образы»; сноска правильно предостерегает от чрезмерно определённого толкования как культовых изображений.
