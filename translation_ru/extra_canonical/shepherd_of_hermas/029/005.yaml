revisions:
- from: '«Не только тот прелюбодействует, — говорит он, — кто оскверняет свою плоть, но и тот, кто делает изображения, как язычники.[a] Поэтому, если кто упорствует и в подобных делах и не кается, держись от него подальше и не живи с ним; иначе и ты станешь соучастником его греха. Вот почему вам заповедано оставаться одним — и мужчине, и женщине: ведь в таких случаях возможно покаяние».'
  to: '«Не только тот прелюбодействует, — говорит он, — кто оскверняет свою плоть, но и всякий, кто создаёт подобия, как язычники.[a] Поэтому, если кто продолжает совершать подобные дела и не кается, держись от него подальше и не живи с ним; иначе и ты станешь соучастником его греха. Вот почему вам заповедано оставаться поодиночке — и мужчине, и женщине: ведь в таких случаях возможно покаяние».'
  rationale: 'Исправлены две стилистически и смыслово менее точные формулировки: «продолжает совершать подобные дела» яснее передаёт ἐμμένῃ, а «оставаться поодиночке» точнее передаёт ἐφ᾽ ἑαυτοῖς μένειν в данном брачном контексте. Сноска уточнена так, чтобы сохранить спорную семантическую широту «подобий».'
