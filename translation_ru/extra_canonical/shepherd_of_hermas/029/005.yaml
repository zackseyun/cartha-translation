  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/005.yaml
  text: “Not only,” he says, “is it adultery if someone defiles his flesh, but whoever makes images as the nations do is committing adultery. Therefore, even in such works, if someone persists and does not repent, keep away from him and do not live together with him; otherwise you too are a sharer in his sin. For this reason it was commanded you to remain by yourselves, whether man or woman, for in cases like these there can be repentance.
translation:
  language: ru
  text: '«Не только тот прелюбодействует, — говорит он, — кто оскверняет свою плоть, но и всякий, кто создаёт подобия, как язычники.[a] Поэтому, если кто продолжает совершать подобные дела и не кается, держись от него подальше и не живи с ним; иначе и ты станешь соучастником его греха. Вот почему вам заповедано оставаться поодиночке — и мужчине, и женщине: ведь в таких случаях возможно покаяние».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение буквально: «создаёт подобия, как язычники». Вероятно, речь идёт об образах, связанных с языческой религиозной практикой, однако сама формулировка не уточняет этого прямо.'
    reason: Сохраняет буквальную неопределённость τὰ ὁμοιώματα, не превращая вероятное контекстуальное объяснение в однозначное толкование.
lexical_decisions:
- source_word: μοιχεία / μοιχᾶται
  choice: прелюбодействие / прелюбодействует
  rationale: 'Сохраняет нравственно-богословскую метафору оригинала: далее речь идёт не только о плотском грехе, но и о неверности Богу.'
- source_word: τὰ ὁμοιώματα ποιῇ τοῖς ἔθνεσιν
  choice: делает изображения, как язычники
  rationale: Передаёт буквальный смысл конструкции и сохраняет её некоторую неясность; по контексту, вероятно, имеются в виду языческие культовые изображения.
- source_word: ἀπέχου ἀπ᾽ αὐτοῦ
  choice: держись от него подальше
  rationale: Естественная современная передача предписания отделиться от упорствующего в грехе человека.
- source_word: ἐφ᾽ ἑαυτοῖς μένειν
  choice: оставаться одним
  rationale: В брачном контексте выражение означает не вступать в новый союз, оставаясь отдельно от согрешившего супруга.
- source_word: μέτοχος
  choice: соучастник
  rationale: Точно передаёт участие в чужом грехе, а не только пассивную причастность к нему.
theological_decisions:
- issue: Расширенное понимание прелюбодеяния
  choice: Сохранена формулировка, приравнивающая языческие изображения к прелюбодеянию.
  alternative: Передать смысл прямо как «идолопоклонствует».
  rationale: Оригинал намеренно использует лексику прелюбодеяния и образов; явная замена на «идолопоклонство» устранила бы метафору и неоднозначность текста.
- issue: Предписание оставаться без нового брака
  choice: «оставаться одним — и мужчине, и женщине»
  alternative: «жить отдельно»
  rationale: Ближайший контекст объясняет это ожиданием возможного покаяния супруга; перевод сохраняет применимость предписания к обоим полам, не добавляя конфессиональной брачной доктрины.
translation_notes:
  register: Современный литературный русский язык с достойным наставительным тоном. Синтаксис упрощён для ясности, но повтор ключевых слов «прелюбодействует», «грех», «покаяние» и логическая последовательность оригинала сохранены.
