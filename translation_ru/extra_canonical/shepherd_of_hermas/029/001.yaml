revisions:
- from: «Я повелеваю тебе, — говорит он, — хранить целомудрие. И пусть не восходит тебе на сердце мысль о чужой жене, о каком-либо блуде или о чём-либо подобном и злом. Ведь, поступая так, ты совершаешь великий грех. Но если всегда будешь помнить о своей жене, то никогда не согрешишь».
  to: «Я повелеваю тебе, — говорит он, — хранить целомудрие. Пусть в твоём сердце не возникает мысли о жене другого, о каком-либо блуде или о подобных дурных образах. Ведь, поступая так, ты совершаешь великий грех. Но если всегда будешь помнить о своей жене, то никогда не согрешишь».
  rationale: 'Исправлены только две безопасные точки: более ясно передано «жена другого» и восстановлено значение ὁμοιώματα как «образы». Замена «восходит на сердце» на «возникает в сердце» сохраняет метафорическое местонахождение мысли, но делает фразу естественной для современного литературного русского. Смысл нравственного наставления не смягчён и не расширен.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:49:14Z'
review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан точно: сохранены повеление хранить ἁγνεία, запрет на возникающие в сердце сексуально нечистые помыслы, оценка этого как великого греха и противопоставление собственной жены. Однако τῶν τοιούτων τινῶν ὁμοιωμάτων πονηρῶν обозначает «такие/подобные дурные образы (представления)», а не неопределённое «что-либо подобное и злое».'
  naturalness: «Пусть не восходит тебе на сердце мысль» намеренно библеизирует, но для современного литературного русского звучит тяжеловесно. «Пусть в твоём сердце не возникает мысли» сохраняет образ сердца и естественнее. «О чём-либо подобном и злом» также синтаксически и семантически неясно.
  terminology: «Целомудрие», «блуд» и «согрешишь» уместны в нравственно-наставительном раннехристианском регистре. «Жене другого» яснее передаёт γυνὴ ἀλλοτρία в данном контексте и согласуется с английским контрольным текстом, не вводя дополнительных толкований.
