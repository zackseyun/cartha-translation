base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/001.yaml
  text: “I am commanding you,” he says, “to guard chastity, and do not let a thought about another man’s wife, or about any fornication, or about any such evil likenesses, rise up upon your heart. For in doing this you commit a great sin. But if you remember your own wife always, you will never transgress.
translation:
  language: ru
  text: «Я повелеваю тебе, — говорит он, — хранить целомудрие. Пусть в твоём сердце не возникает мысли о жене другого, о каком-либо блуде или о подобных дурных образах. Ведь, поступая так, ты совершаешь великий грех. Но если всегда будешь помнить о своей жене, то никогда не согрешишь».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁγνεία
  choice: целомудрие
  rationale: Передаёт нравственную и половую чистоту в данном брачном контексте, сохраняя достоинство раннехристианского наставления.
- source_word: ἀναβαινέτω ... ἐπὶ τὴν καρδίαν
  choice: пусть не восходит тебе на сердце
  rationale: Сохраняет образное движение мысли к сердцу, характерное для исходного текста и библейской речи.
- source_word: γυναικὸς ἀλλοτρίας
  choice: чужой жене
  rationale: В контексте противопоставления собственной жене выражение означает женщину, не принадлежащую к брачному союзу адресата; русский оборот также допускает более узкое понимание как жены другого.
- source_word: πορνείας τινὸς
  choice: каком-либо блуде
  rationale: «Блуд» достаточно широко передаёт πορνεία как недозволенное половое поведение, не сужая его до одного конкретного поступка.
- source_word: ὁμοιωμάτων πονηρῶν
  choice: о чём-либо подобном и злом
  rationale: Греческое выражение необычно и обобщает родственные дурные представления или образы; перевод сохраняет эту намеренную широту без искусственной конкретизации.
- source_word: διαμαρτήσεις
  choice: согрешишь
  rationale: По контексту глагол обозначает нравственное прегрешение; «согрешишь» естественно связывает заключение с предшествующим ἁμαρτίαν.
theological_decisions:
- issue: Нравственный статус внутренней мысли
  choice: Сохранено прямое утверждение, что допущенная нечистая мысль является великим грехом.
  alternative: Истолковать речь только как запрет внешнего прелюбодеяния или длительного намерения.
  rationale: Текст прямо связывает восхождение мысли на сердце и «поступая так» с совершением великого греха; перевод не смягчает и не усиливает это утверждение.
- issue: Роль памяти о собственной жене
  choice: 'Передано как практическое противопоставление нечистой мысли: «если всегда будешь помнить о своей жене».'
  alternative: Расширить до учения о супружеской верности или исключительности брака.
  rationale: Исходный текст формулирует наставление кратко и не разъясняет его догматически; перевод сохраняет пределы сказанного.
translation_notes:
  register: Современный литературный русский с умеренно библейской образностью. Реплики оформлены естественно, но сохранены повелительный тон и повтор мысли о сердце. Архаизмы сведены к минимуму; слово «блуд» удержано как понятный и традиционно точный термин для данного раннехристианского контекста.
