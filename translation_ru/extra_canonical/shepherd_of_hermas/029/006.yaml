    issue: «завершалось» для συντελῆται
    rationale: Глагол обозначает осуществление или совершение практики; перевод «завершалось» может создать не содержащийся в оригинале акцент на её финальной стадии.
  - severity: low
    issue: Добавление «но говорю это ради того»
    rationale: Это добавление служит стилистической связкой, но отсутствует в греческом и делает фразу менее непосредственной; целевое значение εἰς τὸ достаточно передаётся союзом «чтобы».
