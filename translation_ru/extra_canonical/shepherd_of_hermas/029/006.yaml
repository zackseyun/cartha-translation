base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/006.yaml
  text: “I therefore,” he says, “do not give an occasion for this practice to be carried through in this way, but so that the one who has sinned may no longer sin. But with regard to his former sin, there is One who is able to give healing—for he is the One who has authority over all.”
translation:
  language: ru
  text: «Итак, — говорит он, — я не даю повода к тому, чтобы это дело совершалось таким образом, но чтобы согрешивший больше не грешил. Что же до его прежнего греха, есть Тот, кто может даровать исцеление, ведь именно Он имеет власть над всем».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφορμή
  choice: повод
  rationale: Передаёт значение основания или возможности для действия, не усиливая его до прямого разрешения либо предписания.
- source_word: ἡ πρᾶξις
  choice: это дело
  rationale: Сохраняет широкое и контекстуально неоднозначное обозначение обсуждаемого порядка действий; более узкое «развод» было бы истолкованием.
- source_word: συντελῆται
  choice: завершалось
  rationale: Отражает идею доведения действия до завершения и сохраняет несколько необычную формулировку оригинала.
- source_word: ἴασιν δοῦναι
  choice: даровать исцеление
  rationale: Сохраняет образ исцеления применительно к прежнему греху и значение глагола «дать».
- source_word: τὴν ἐξουσίαν
  choice: власть
  rationale: Естественный русский эквивалент для полномочия и власти над всем.
theological_decisions:
- issue: К кому относится «Тот, кто может даровать исцеление»
  choice: «Тот» и «Он» написаны с прописной буквы как указание на Бога
  alternative: Строчные «тот» и «он» без редакционного обозначения референта
  rationale: Ближайший контекст говорит о власти над всем и однозначно направляет высказывание к Богу; при этом перевод не уточняет Лицо и не добавляет имени.
- issue: Цель наставления и обсуждаемое «дело»
  choice: Сохранить общее выражение «это дело»
  alternative: Уточнить как «развод», «раздельную жизнь» или «повторный брак»
  rationale: Греческое πρᾶξις допускает контекстуальное толкование, но само по себе не называет конкретную практику; перевод не должен снимать эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достойной, но доступной формой прямой речи. Вставка «говорю это» делает эллиптическое противопоставление естественным по-русски, не меняя его целевой логики. Формулировка «что же до» ясно передаёт переход περὶ δέ.
