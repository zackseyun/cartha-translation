  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/004.yaml
  text: “As long as he is ignorant,” he says, “he does not sin; but if the husband comes to know her sin, and the wife does not repent but persists in her fornication, and the husband lives together with her, he becomes guilty of her sin and a sharer in her adultery. "What then, sir," I say, "should the husband do, if the wife persists in this passion?" "Let him divorce her," he says, "and let the husband remain by himself; but if, after divorcing his wife, he marries another, he himself also commits adultery." "If then, sir," I say, "after the wife is divorced, she repents and wishes to return to her own husband, will she not be received?" "Indeed," he says, "if the husband does not receive her, he sins and brings a great sin upon himself; rather, the one who has sinned and is repenting must be received—but not repeatedly—for to the servants of God repentance is one. Because of repentance, then, the man ought not to marry. This rule is laid upon both woman and man.
translation:
  language: ru
  text: '«Пока он не знает, — говорит он, — он не грешит. Но если муж узнает о её грехе, а жена не раскается и будет упорствовать в своём блуде, и муж продолжит жить с нею, то он станет виновен в её грехе и соучастником её прелюбодеяния». Я говорю: «Что же, господин, делать мужу, если жена упорствует в этой страсти?» — «Пусть он разведётся с нею, — говорит он, — а сам пусть остаётся один. Если же, разведясь с женой, он женится на другой, то и сам совершает прелюбодеяние». Я говорю: «А если, господин, после развода жена раскается и захочет вернуться к своему мужу, разве он не должен принять её?» — «Несомненно, — говорит он. — Если муж не примет её, он согрешит и навлечёт на себя великий грех. Согрешившего, если он раскаивается, следует принять — но не многократно[a], потому что для Божьих рабов покаяние одно. Поэтому, ввиду покаяния, муж не должен жениться вновь. Это правило относится и к женщине, и к мужчине».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не снова и снова». Следующая фраза буквально гласит: «для Божьих рабов покаяние одно». Здесь подчёркивается, что покаяние нельзя превращать в оправдание многократного возвращения к тому же греху; точный объём этого утверждения остаётся предметом толкования.'
    reason: Сохраняет неоднозначность выражений μὴ ἐπὶ πολύ и μετάνοιά ἐστιν μία и не навязывает позднейшее догматическое прочтение.
lexical_decisions:
- source_word: Ἄχρι τῆς ἀγνοίας
  choice: Пока он не знает
  rationale: 'Естественно передаёт временной смысл: невиновность продолжается до того, как муж узнаёт о грехе жены.'
- source_word: πορνείᾳ
  choice: блуде
  rationale: Сохраняет отличие более широкого термина πορνεία от μοιχεία, переведённого как «прелюбодеяние».
- source_word: συνζῇ
  choice: продолжит жить с нею
  rationale: Передаёт совместную супружескую жизнь в данном контексте, не сводя выражение только к половому акту.
- source_word: ἀπολυσάτω
  choice: пусть он разведётся с нею
  rationale: В контексте прекращения супружеского сожительства и последующего запрета нового брака речь идёт о разводе или отпускании жены; современное «разведётся» ясно читателю.
- source_word: ἐπὶ ἑαυτοῖς μένειν
  choice: остаётся один
  rationale: Передаёт требование не вступать в новый брак после разлучения.
- source_word: δεχθῆναι
  choice: принять
  rationale: Сохраняет общий глагол оригинала, который в контексте означает принять раскаявшуюся супругу обратно.
- source_word: μετάνοια μία
  choice: покаяние одно
  rationale: Максимально сохраняет краткую и богословски напряжённую формулировку оригинала, не превращая её в развёрнутую доктрину.
- source_word: πρᾶξις
  choice: правило
  rationale: По смыслу здесь имеется в виду установленный порядок действий, одинаково применимый к мужу и жене; буквальное «действие» по-русски было бы неясно.
theological_decisions:
- issue: Ответственность мужа, продолжающего жить с нераскаявшейся прелюбодействующей женой
  choice: он становится «виновен в её грехе и соучастником её прелюбодеяния»
  alternative: он лично совершает тот же акт прелюбодеяния
  rationale: Формулировка сохраняет различие между её поступком и его соучастием, не отождествляя их без основания.
- issue: Запрет нового брака после развода
  choice: сохранён как прямое утверждение текста без дополнительных исключений
  alternative: добавить традиционные конфессиональные оговорки
  rationale: Источник формулирует запрет прямо; перевод не должен импортировать более поздние конфессиональные системы.
- issue: Фраза «для Божьих рабов покаяние одно»
  choice: сохранена буквально и снабжена примечанием об интерпретационной неоднозначности
  alternative: однозначно истолковать как единственное покаяние после крещения или как однократное примирение супругов
  rationale: Контекст подчёркивает неповторяемость, но сама краткая формула допускает более широкий богословский смысл; перевод не должен молча его фиксировать.
- issue: Взаимность правила
  choice: «относится и к женщине, и к мужчине»
  alternative: изложить правило только как обязанность мужа
  rationale: Оригинал явно распространяет установленный порядок на оба пола.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Диалогическая форма и повторяемые глаголы речи сохранены, но синтаксис сделан естественным для современного читателя. Термины «блуд», «прелюбодеяние», «покаяние» выбраны как понятные и устойчивые библейско-религиозные слова. Представленный греческий источник имеет лакуну после начала стиха 5 и возобновляется позднее; недостающая часть данного читательского сегмента восстановлена по включённому аудированному английскому слою и известной последовательности раздела, без добавления конфессиональных уточнений.
