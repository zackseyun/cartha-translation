base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/029/002.yaml
  text: '“For if this thought rises up upon your heart, you will transgress—and if other such evil things [do], you commit sin. For this thought is a great sin for a servant of God; and if anyone carries out this evil deed, he brings death upon himself. Look to yourself, then: keep away from this thought; for where modesty dwells, there lawlessness ought not to rise up upon the heart of a righteous man.”'
translation:
  language: ru
  text: '«Ведь если этот помысел возникнет у тебя в сердце, ты согрешишь; и если возникнут другие столь же злые помыслы,[a] ты совершишь грех. Ибо такой помысел — великий грех для Божьего раба; а если кто совершит это злое дело, тот навлекает на себя смерть. Итак, следи за собой: держись подальше от этого помысла. Ведь там, где обитает целомудрие, беззаконие не должно возникать в сердце праведного человека».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте фраза эллиптична: буквально — «и если другие столь же злые [вещи]»; по контексту подразумеваются другие злые помыслы, возникающие в сердце.'
    reason: Поясняет восполненное в переводе слово, сохраняя отмеченную синтаксическую неоднозначность оригинала.
lexical_decisions:
- source_word: ἐνθύμησις
  choice: помысел
  rationale: Передаёт внутреннюю мысль или намерение с нравственной направленностью; в данном контексте речь идёт о похотливом помысле, но добавление «похотливый» устранило бы некоторую широту греческого слова.
- source_word: διαμαρτήσεις
  choice: преступишь заповедь
  rationale: Глагол означает совершить проступок или согрешить. Упоминание заповеди естественно в контексте наставления и позволяет сохранить различие с последующим ἁμαρτίαν ἐργάζῃ — «совершишь грех».
- source_word: σεμνότης
  choice: целомудрие
  rationale: В данном рассуждении о сексуальной чистоте слово обозначает достойную нравственную чистоту; «целомудрие» точнее контекстуально, чем более общее «достоинство» или менее естественное здесь «благопристойность».
- source_word: θάνατον ἑαυτῷ κατεργάζεται
  choice: навлекает на себя смерть
  rationale: Сохраняет сильную причинно-следственную формулировку оригинала, не уточняя, имеется ли в виду духовная, эсхатологическая или иная смерть.
- source_word: ἀνομία
  choice: беззаконие
  rationale: Передаёт противопоставление праведности и нарушения Божьего нравственного порядка, не сужая значение до одного конкретного проступка.
theological_decisions:
- issue: Характер смерти, которую человек навлекает на себя
  choice: «навлекает на себя смерть» без пояснения
  alternative: «навлекает на себя духовную смерть»
  rationale: Греческий текст не определяет вид смерти; конкретизация внесла бы богословское толкование в основной текст.
- issue: Степень греховности внутреннего помысла и совершённого поступка
  choice: 'Сохранены оба утверждения: помысел назван великим грехом, а поступок — навлекающим смерть'
  alternative: Смягчить первое утверждение, представив помысел лишь искушением
  rationale: Оригинал прямо называет данный помысел великим грехом для Божьего раба и отличает его от последующего злого дела.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского нравственного наставления. «Помысел» употреблён как понятное, хотя и слегка возвышенное слово; синтаксис сделан естественным для чтения вслух. Местоименные обращения сохранены в единственном числе, как в греческом тексте.
