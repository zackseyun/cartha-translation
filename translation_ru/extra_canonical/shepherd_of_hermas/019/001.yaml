base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/019/001.yaml
  text: “Listen,” he says, “about the three forms you are inquiring about. In the first vision, why did she appear to you as an old woman and seated on a chair? Because your spirit is old and already withered and has no strength because of your weaknesses and your double‑mindedness. For just as the aged, no longer having hope of being renewed, expect nothing else but their sleep, so also you, having been weakened by the affairs of life, have handed yourselves over to negligence, and you did not cast your anxieties upon the Lord; instead your mind has been shattered, and you have grown old in your sorrows.”
translation:
  language: ru
  text: «Послушай, — говорит он, — о трёх образах, о которых ты спрашиваешь. Почему в первом видении она явилась тебе более преклонной и сидящей на кресле? Потому что дух ваш состарился, уже увял и не имеет силы из-за ваших слабостей и двоедушия. Ведь как старики, уже не надеясь обновиться, не ожидают ничего, кроме своего сна, так и вы, ослабев от житейских дел, предались нерадению и не возложили своих забот на Господа; напротив, разум ваш сокрушился, и вы состарились от своих печалей».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μορφῶν
  choice: обликах
  rationale: Передаёт различные явленные внешние виды одной женской фигуры естественно по-русски, не сводя значение к абстрактным «формам».
- source_word: πρεσβυτέρα
  choice: старухой
  rationale: В данном противопоставлении возрастных обликов слово обозначает пожилую женщину; выбран ясный современный эквивалент.
- source_word: καθέδραν
  choice: кресле
  rationale: Речь идёт о сиденье, поддерживающем немощное тело; «кресло» естественнее и конкретнее, чем церковно окрашенная «кафедра».
- source_word: τὸ πνεῦμα ὑμῶν
  choice: дух ваш
  rationale: Сохранена буквальная антропологическая формулировка и переход от обращения к одному Ерму к множественному числу общины.
- source_word: μαλακιῶν
  choice: изнеженности
  rationale: Сохраняет порицательный смысл нравственной расслабленности и слабости, отличаясь от следующего упоминания ослабления жизненными делами.
- source_word: διψυχιῶν
  choice: двоедушия
  rationale: Традиционный и точный раннехристианский термин для внутренней раздвоенности и колебания.
- source_word: βιωτικῶν πραγμάτων
  choice: житейских забот
  rationale: Передаёт жизненные дела и тяготы, которые ослабляют адресатов; «заботы» также естественно связывается с последующим μερίμνας.
- source_word: ἀκηδίας
  choice: беспечности
  rationale: Здесь обозначает нерадение и отсутствие должной заботы; выбор не импортирует позднейшее узкотехническое понимание «уныния».
- source_word: διάνοια
  choice: разум
  rationale: Передаёт внутреннюю мыслительную способность без чрезмерно психологизирующего уточнения.
- source_word: κοίμησιν
  choice: сна
  rationale: Сохранён эвфемистический образ смерти и его возможная эсхатологическая окраска без явного истолкования.
theological_decisions:
- issue: Значение «сна» в выражении τὴν κοίμησιν αὐτῶν
  choice: своего сна
  alternative: своей смерти
  rationale: Греческий текст использует метафору сна; перевод сохраняет образ и не разрешает его богословскую многозначность.
- issue: Антропологический смысл πνεῦμα
  choice: дух
  alternative: внутреннее состояние
  rationale: Формальный термин оригинала сохранён, поскольку замена толкованием устранила бы возможное богословское напряжение.
- issue: Объект образа пожилой женщины
  choice: сохранено местоимение «она» без пояснения
  alternative: добавить «Церковь»
  rationale: В данном сегменте оригинал не называет фигуру прямо; пояснение внесло бы контекстуальное толкование в основной текст.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Сохранены смена единственного числа на множественное, метафоры увядания, сна, сокрушённого разума и старения от печалей. Переведён только reader_segment 1, заканчивающийся перед вопросом о кресле.
