  yaml_path: translation/extra_canonical/shepherd_of_hermas/019/002.yaml
  text: “Why then was she seated in a chair? I wanted to know, sir.” “Because every weak person sits in a chair because of his weakness, in order that the weakness of his body may be supported. You have the pattern of the first vision.”
translation:
  language: ru
  text: «Почему же она сидела в кресле, господин? — хотел я узнать. — Потому что всякий немощный садится в кресло по своей немощи, чтобы немощь его тела получила опору. Вот тебе образ первого видения».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθέδρα
  choice: кресло
  rationale: Обозначает сиденье со спинкой, которое поддерживает немощного; современное «кресло» естественнее и точнее передаёт эту функцию, чем «стул» или «седалище».
- source_word: ἀσθενής / ἀσθένεια
  choice: немощный / немощь; ослабевшее тело
  rationale: Сохраняется повтор корня там, где он звучит естественно; в заключительной части значение передано идиоматично, поскольку буквально «чтобы немощь тела была удержана вместе» по-русски неясно.
- source_word: συνκρατηθῇ
  choice: поддержать
  rationale: В контексте кресло удерживает и укрепляет слабое тело; «поддержать» ясно выражает назначение сиденья без лишнего толкования.
- source_word: τύπος
  choice: образ
  rationale: Здесь речь об объяснительном образе или символическом смысле первого видения; «образ» сохраняет широту греческого слова.
theological_decisions:
- issue: Значение τύπος применительно к видению
  choice: образ первого видения
  alternative: прообраз первого видения
  rationale: «Прообраз» мог бы привнести специальный типологический смысл, которого контекст не требует; «образ» сохраняет символическую открытость.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского текста. Реплики оформлены как связный диалог; обращение κύριε передано словом «господин», без отождествления собеседника с Господом.
