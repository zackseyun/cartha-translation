revisions:
- from: «Почему же она сидела на кресле? — спросил я, желая это узнать, господин. — Потому что всякий немощный садится на кресло из-за своей немощи, чтобы поддержать ослабевшее тело. Вот тебе образ первого видения».
  to: «Почему же она сидела в кресле, господин? — хотел я узнать. — Потому что всякий немощный садится в кресло по своей немощи, чтобы немощь его тела получила опору. Вот тебе образ первого видения».
  rationale: 'Исправлены расположение обращения в диалоге и передача заключительной цели: сохранено различие между телом и его немощью, при этом русский текст остаётся естественным и не навязывает специального толкования τύπος.'
