base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/020/002.yaml
  text: “When an old man, having already given up hope for himself because of his weakness and his poverty, expects nothing else but the last day of his life; then, all at once, an inheritance is left to him. On hearing of it he is stirred up, and, becoming overjoyed, he puts on strength; he no longer lies down, but stands; his spirit—already corrupted by his former deeds—is renewed; and he no longer sits, but takes courage. So also you, when you heard the revelation that the Lord revealed to you.
translation:
  language: ru
  text: Когда некий старик, уже потерявший всякую надежду из-за своей немощи и бедности, не ожидает ничего, кроме последнего дня своей жизни, и вдруг ему оставляют наследство, то, услышав об этом, он воспрянет и, исполнившись великой радости, облечётся в силу. Он уже не лежит, а стоит; его дух, уже повреждённый прежними его поступками, обновляется; и он уже не сидит, а обретает мужество. Так и вы, услышав откровение, которое Господь открыл вам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφηλπικὼς ἑαυτόν
  choice: потерявший надежду
  rationale: Передаёт состояние человека, уже не питающего надежды относительно собственной участи, без неестественного русского оборота «отчаявшийся в себе».
- source_word: προσδέχεται
  choice: не ожидает
  rationale: В данном контексте глагол означает ожидание того, что ещё предстоит человеку.
- source_word: ἐξηγέρθη
  choice: воспрянет
  rationale: Сохраняет образ внезапного подъёма от безнадёжного состояния и согласуется с последующим противопоставлением лежания и стояния.
- source_word: ἐνεδύσατο τὴν ἰσχύν
  choice: облечётся в силу
  rationale: Сохранена метафора облачения, присутствующая в греческом тексте.
- source_word: ἀνανεοῦται
  choice: обновляется
  rationale: Прямо передаёт образ возобновления жизненных сил духа.
- source_word: ἀνδρίζεται
  choice: мужается
  rationale: Передаёт призыв или переход к мужеству, не сводя значение лишь к эмоциональному ободрению.
theological_decisions:
- issue: Значение τὸ πνεῦμα применительно к человеку
  choice: его дух
  alternative: его душевные силы / его настроение
  rationale: Сохранена антропологическая и богословская многозначность слова πνεῦμα; контекст допускает как внутренний дух человека, так и его ожившую внутреннюю силу.
- issue: Повтор ἀκούσαντες ... ἀποκάλυψιν ... ἀπεκάλυψεν
  choice: услышав откровение, которое Господь открыл вам
  alternative: услышав то, что Господь явил вам
  rationale: Сохранён смысловой и корневой повтор исходного текста, несмотря на некоторую избыточность по-русски.
- issue: Нравственная окраска προτέρων πράξεων
  choice: прежних его поступков
  alternative: прежних его дел / прежнего образа жизни
  rationale: Не добавляется отрицательная оценка вроде «дурных поступков», которой существительное само по себе прямо не выражает; отрицательный результат уже обозначен причастием ἐφθαρμένον.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной, раннехристианской образностью. Сохранены параллелизм «не лежит, а стоит; ... не сидит, а мужается», метафора «облечётся в силу» и повтор, связанный с откровением. Глагольное время в развёрнутом сравнении передано преимущественно настоящим и будущим как общеописательное; заключительное применение к адресатам — прошедшим деепричастием согласно греческому ἀκούσαντες.
