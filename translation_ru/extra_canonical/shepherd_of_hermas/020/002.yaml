revisions:
- from: Когда какой-нибудь старик, уже потерявший надежду из-за своей немощи и бедности, не ожидает ничего, кроме последнего дня своей жизни, и вдруг ему оставляют наследство, то, услышав об этом, он воспрянет и, исполнившись великой радости, облечётся в силу. Он уже не лежит, а стоит; его дух, уже пришедший в упадок из-за прежних его поступков, обновляется; и он уже не сидит, а мужается. Так и вы, услышав откровение, которое Господь открыл вам.
  to: Когда некий старик, уже потерявший всякую надежду из-за своей немощи и бедности, не ожидает ничего, кроме последнего дня своей жизни, и вдруг ему оставляют наследство, то, услышав об этом, он воспрянет и, исполнившись великой радости, облечётся в силу. Он уже не лежит, а стоит; его дух, уже повреждённый прежними его поступками, обновляется; и он уже не сидит, а обретает мужество. Так и вы, услышав откровение, которое Господь открыл вам.
  rationale: Внесены только безопасные смысловые и стилистические уточнения. «Некий» лучше соответствует притчевому τις; «потерявший всякую надежду» яснее выражает ἀφηλπικὼς ἑαυτόν без неестественного буквального оборота. «Повреждённый» передаёт силу ἐφθαρμένον, а «обретает мужество» — значение ἀνδρίζεται в современном русском. Незавершённая заключительная конструкция сохранена, поскольку она продолжается в следующем читательском сегменте исходного текста.
