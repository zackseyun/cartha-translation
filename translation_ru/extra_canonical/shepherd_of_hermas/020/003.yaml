base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/020/003.yaml
  text: “For he had compassion on you and renewed your spirits, and you put away your softness; strength came to you and you were strengthened in faith; and when the Lord saw your strengthening, he rejoiced. For this reason he made known to you the building of the tower, and he will make other things known, if, with a whole heart, you are at peace among yourselves.”
translation:
  language: ru
  text: Ибо Он сжалился над вами и обновил ваши силы духа; вы оставили свою слабость, к вам пришла сила, и вы укрепились в вере. Увидев, как вы окрепли, Господь возрадовался. Поэтому Он показал вам строительство башни и покажет ещё другое, если вы от всего сердца будете жить в мире друг с другом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐσπλαγχνίσθη ἐφ’ ὑμᾶς
  choice: сжалился над вами
  rationale: Передаёт сильное сострадание без излишней архаизации.
- source_word: ἀνενεώσατο τὰ πνεύματα ὑμῶν
  choice: обновил ваш дух
  rationale: Греческое множественное число буквально означает «ваши духи», но в естественном русском при обращении к группе уместно собирательное «ваш дух»; сохраняется внутренняя духовная направленность выражения.
- source_word: ἀπέθεσθε τὰς μαλακίας ὑμῶν
  choice: вы отбросили свою малодушную изнеженность
  rationale: μαλακία здесь обозначает ослабляющую мягкотелость, вялость или малодушие; сочетание сохраняет отрицательный нравственный оттенок и связь с последующим обретением силы.
- source_word: προσῆλθεν ὑμῖν ἰσχυρότης
  choice: к вам пришла сила
  rationale: Сохраняет образ силы, пришедшей к адресатам, и близко следует синтаксису оригинала.
- source_word: ἐδυναμώθητε ἐν τῇ πίστει
  choice: вы укрепились в вере
  rationale: Естественная русская формулировка, точно передающая укрепление в сфере веры.
- source_word: τὴν οἰκοδομὴν τοῦ πύργου
  choice: строительство башни
  rationale: οἰκοδομή в данном видении обозначает процесс возведения башни, а не только готовое строение.
- source_word: εἰρηνεύετε ἐν ἑαυτοῖς
  choice: будете жить в мире друг с другом
  rationale: Передаёт взаимный характер мира внутри общины естественным современным русским языком.
theological_decisions:
- issue: Число в выражении τὰ πνεύματα ὑμῶν
  choice: ваш дух
  alternative: ваши духи
  rationale: Собирательное единственное число по-русски звучит естественно при обращении к общине и не решает вопрос о точной антропологии текста.
- issue: Условие дальнейшего откровения
  choice: если вы от всего сердца будете жить в мире друг с другом
  alternative: если вы всем сердцем будете мирны между собой
  rationale: Сохранены условность, сердечная цельность и общинное измерение мира без добавления конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис упрощён умеренно; причинно-следственная последовательность и повторяющийся мотив укрепления сохранены.
