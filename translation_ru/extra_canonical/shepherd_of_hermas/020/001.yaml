  text: But in the second vision you saw her standing, with a countenance younger and more cheerful than before, though her flesh and her hair were older. “Listen,” she says, “to this parable also.
translation:
  language: ru
  text: Но во втором видении ты увидел её стоящей; лицо её было моложе и радостнее, чем прежде, хотя тело и волосы у неё были старческими. «Послушай, — говорит она, — и эту притчу».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄψιν
  choice: лицом
  rationale: В данном описании внешности слово естественно передаётся как «лицо»; именно оно выглядит моложе и веселее.
- source_word: ἱλαρωτέραν
  choice: веселее
  rationale: Сохраняет сравнительное значение и передаёт приветливую, радостную внешность без чрезмерного истолкования.
- source_word: σάρκα
  choice: тело
  rationale: Буквальное «плоть» здесь звучало бы по-русски неестественно при описании видимой старости; «тело» точно передаёт смысл.
- source_word: πρεσβυτέρας
  choice: старческими
  rationale: Согласует общий предикативный признак с телом и волосами и ясно выражает контраст с помолодевшим лицом.
- source_word: παραβολήν
  choice: притчу
  rationale: Обычный и уместный русский эквивалент для назидательного образного сравнения.
theological_decisions:
- issue: Кого обозначает местоимение αὐτήν
  choice: Сохранено местоимение «её» без добавления имени или толкования
  alternative: Назвать женщину Церковью
  rationale: В данном читательском сегменте греческий текст использует анафорическое местоимение; явное отождествление внесло бы контекстуальное толкование в сам перевод.
translation_notes:
  register: 'Современный литературный русский с достоинством раннехристианского повествования. Сохранён контраст: она стоит, её лицо выглядит моложе и радостнее, но тело и волосы остаются старческими. Прямая речь оформлена естественно для русского текста.'
