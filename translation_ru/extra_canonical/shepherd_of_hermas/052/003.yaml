revisions:
- from: Предсуществовавшего Святого Духа, сотворившего всё творение, Бог поселил в плоти, которую избрал. И эта плоть, в которой поселился Святой Дух, верно служила Духу, живя благочинно и чисто и нисколько не осквернив Духа. Поскольку же она жила достойно и чисто, трудилась вместе с Духом и содействовала Ему во всём, проявляя стойкость и мужество, Бог избрал её в сотоварищи Святому Духу. Ведь жизнь этой плоти была угодна [Господу][a], потому что, имея в себе Святого Духа, она не осквернилась на земле.
  to: Предсуществовавшего Святого Духа, сотворившего всё творение, Бог поселил во плоти, которую Он пожелал. Эта плоть, в которой обитал Святой Дух, хорошо служила Духу, живя достойно и чисто и ничем не оскверняя Духа. Итак, поскольку она жила хорошо и чисто, трудилась вместе с Духом и содействовала Ему во всём, проявляя силу и мужество, Бог избрал её как соучастницу Святого Духа; ведь образ жизни этой плоти был угоден [Господу][a], потому что она, имея Святого Духа, не осквернилась на земле.
  rationale: 'Исправлены лишь безопасные лексико-стилистические места: βούλομαι передано без дополнительного значения отбора, конкретная σάρξ — формой «во плоти», а κοινωνός — современным естественным выражением. Неоднозначность раннехристианского рассуждения о Духе и плоти не устраняется; квадратные скобки при спорном чтении сохранены.'
