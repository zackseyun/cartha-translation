base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/003.yaml
  text: The Holy Spirit, which preexisted, which created all creation, God caused to dwell in flesh that he willed. This flesh, then, in which the Holy Spirit dwelt, served the Spirit well, walking in modesty and purity, in no way at all defiling the Spirit. Therefore, since it had conducted itself well and purely, and had toiled together with the Spirit and cooperated in every matter, conducting itself strongly and courageously, he chose it as a partner with the Holy Spirit; for the conduct of this flesh pleased [the Lord], because it was not defiled upon the earth while having the Holy Spirit.
translation:
  language: ru
  text: Предсуществовавшего Святого Духа, сотворившего всё творение, Бог поселил во плоти, которую Он пожелал. Эта плоть, в которой обитал Святой Дух, хорошо служила Духу, живя достойно и чисто и ничем не оскверняя Духа. Итак, поскольку она жила хорошо и чисто, трудилась вместе с Духом и содействовала Ему во всём, проявляя силу и мужество, Бог избрал её как соучастницу Святого Духа; ведь образ жизни этой плоти был угоден [Господу][a], потому что она, имея Святого Духа, не осквернилась на земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «Господу» в греческом издании заключены в скобки и потому текстологически не вполне уверенно засвидетельствованы.
    reason: Передаёт отмеченную в исходном издании неопределённость чтения [τῷ Κυρίῳ].
lexical_decisions:
- source_word: τὸ πνεῦμα τὸ ἅγιον τὸ προόν
  choice: предсуществовавшего Святого Духа
  rationale: Передаёт временной смысл προόν — существовавшего прежде — без уточнения, чему именно Дух предсуществовал.
- source_word: κατῴκισεν ... εἰς σάρκα
  choice: поселил в плоти
  rationale: 'Сохраняет каузативную конструкцию: Бог сделал так, чтобы Дух обитал в плоти.'
- source_word: ἣν ἠβούλετο
  choice: которую избрал
  rationale: По-русски естественно выражает волевой выбор Бога; буквальное «которую пожелал» здесь менее ясно.
- source_word: ἐν σεμνότητι καὶ ἁγνείᾳ πορευθεῖσα
  choice: живя благочинно и чисто
  rationale: πορεύομαι метафорически означает образ жизни; σεμνότης передано как достойная, почтенная упорядоченность поведения.
- source_word: συγκοπιάσασαν ... καὶ συνεργήσασαν
  choice: трудилась вместе ... и содействовала
  rationale: Сохраняет различие между совместным тяжёлым трудом и деятельным сотрудничеством.
- source_word: κοινωνόν
  choice: в сотоварищи
  rationale: Передаёт идею участника и партнёра, не вводя более поздней технической христологической терминологии.
- source_word: πορεία
  choice: жизнь
  rationale: В контексте означает жизненный путь или поведение; «жизнь» естественно связывает весь описанный образ действий.
theological_decisions:
- issue: Соотношение Святого Духа и плоти
  choice: Сохранена грамматическая персонификация плоти и её служение Духу
  alternative: Истолковать «плоть» прямо как Иисуса Христа
  rationale: Греческий текст в данном отрывке говорит именно о σάρξ и πνεῦμα; явное отождествление сняло бы присущую тексту раннехристианскую богословскую напряжённость.
- issue: Субъект εἵλατο
  choice: 'Явно назван Бог: «Бог избрал её»'
  alternative: Безличное или неуточнённое «он избрал её»
  rationale: Ближайший управляющий субъект рассуждения — Бог; экспликация нужна для ясного русского текста, но не меняет смысловой структуры.
- issue: Кого означает добавленное τῷ Κυρίῳ
  choice: «[Господу]» сохранено в квадратных скобках и снабжено примечанием
  alternative: Принять чтение без оговорки или опустить слова
  rationale: Скобки в издании указывают на текстологическую неуверенность; перевод не должен скрывать её.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставительного текста. Синтаксис упрощён лишь настолько, чтобы длинная греческая конструкция оставалась понятной обычному читателю; повторения «Дух» и «плоть» намеренно сохранены как смыслообразующие.
