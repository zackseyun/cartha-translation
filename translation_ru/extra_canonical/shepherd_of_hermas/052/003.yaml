review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан верно: сохранены предсуществование Духа, каузативное действие Бога, служение плоти Духу, совместный труд и текстологически сомнительное «[Господу]». Однако «которую избрал» несколько сужает βούλομαι («желать, хотеть»), а «в плоти» менее естественно и менее точно для конкретной σάρξ, чем «во плоти».'
  naturalness: Русский текст в целом литературный. «В сотоварищи» звучит архаично и не вполне естественно для заявленного современного литературного регистра; «как соучастницу Святого Духа» передаёт κοινωνός яснее, не превращая его в поздний технический термин.
  terminology: «Святой Дух», «плоть», «оскверниться» и «служить» употреблены последовательно. «Во плоти» сохраняет важное повторение конкретной «плоти», в которой обитает Дух.
