  - severity: low
    issue: «которую избрал» для ἣν ἠβούλετο
    rationale: Глагол βούλομαι выражает воление/желание; «избрал» добавляет оттенок выбора между альтернативами, отсутствующий в явном виде.
  - severity: low
    issue: «поселил в плоти»
    rationale: Для конкретной плоти, далее определяемой придаточным, современная литературная форма «поселил во плоти» естественнее и точнее отражает εἰς σάρκα.
  - severity: low
    issue: «избрал её в сотоварищи Святому Духу»
    rationale: Оборот стилистически тяжеловесен и архаичен. «Избрал её как соучастницу Святого Духа» естественнее и сохраняет смысл κοινωνός.
