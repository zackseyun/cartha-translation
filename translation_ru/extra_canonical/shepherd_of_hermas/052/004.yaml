base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/004.yaml
  text: Therefore he took the Son and the glorious angels as counselors, in order that this flesh also, having served the Spirit blamelessly, might have some place of dwelling, and might not seem to have lost the reward of its service. For every flesh that is found undefiled and unstained, in which the Holy Spirit has dwelt, will receive a reward. You have the interpretation of this parable also.”
translation:
  language: ru
  text: Поэтому он принял в советники Сына и славных ангелов, чтобы и эта плоть, безупречно служившая Духу, получила какое-то место для пребывания и чтобы не казалось, будто она лишилась награды за своё служение. Ведь всякая плоть, которая окажется неосквернённой и незапятнанной и в которой обитал Святой Дух, получит награду. У тебя есть и истолкование этой притчи».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύμβουλον ... ἔλαβε
  choice: призвал ... как советников
  rationale: Передаёт принятие Сына и ангелов в качестве участников совета естественным современным русским языком, не предполагая нужды Бога в наставлении.
- source_word: σὰρξ
  choice: плоть
  rationale: Сохраняет ключевой образ и его повторение в богословски напряжённом рассуждении оригинала.
- source_word: τόπον τινὰ κατασκηνώσεως
  choice: место для обитания
  rationale: Передаёт неопределённость τινά и значение пребывания или поселения без чрезмерной конкретизации.
- source_word: μισθὸν τῆς δουλείας
  choice: награды за своё служение
  rationale: Мισθός здесь означает воздаяние, а δουλεία — исполненное служение; выбран естественный и ясный русский оборот.
- source_word: ἀμίαντος καὶ ἄσπιλος
  choice: неосквернённой и незапятнанной
  rationale: Сохраняет парную характеристику нравственной и ритуально-образной чистоты.
- source_word: ἐπίλυσιν
  choice: истолкование
  rationale: В контексте объяснения притчи это литературно естественный эквивалент слова «разъяснение, толкование».
theological_decisions:
- issue: Участие Сына и славных ангелов в Божьем совете
  choice: Сохранено прямое утверждение, что он призвал их как советников
  alternative: Смягчить до «сообщил Сыну и ангелам своё решение»
  rationale: Оригинал прямо говорит σύμβουλον ἔλαβε; богословскую напряжённость нельзя устранять толкованием.
- issue: Отношение «плоти» и Святого Духа
  choice: Сохранены как различимые участники служения и обитания
  alternative: Отождествить плоть с определённой христологической природой или конкретным лицом
  rationale: Данный стих продолжает сложную притчевую аргументацию; перевод не должен вносить более позднюю догматическую схему или разрешать неоднозначность.
- issue: Всеобщность обещания награды
  choice: «всякая плоть ... получит награду»
  alternative: Ограничить высказывание только плотью, упомянутой ранее
  rationale: Сохранено явное πᾶσα σάρξ и будущее ἀπολήψεται без сужения объёма утверждения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, раннехристианским регистром. Синтаксис сделан ясным для обычного читателя, при этом сохранены повторы «плоть», «Дух», «награда» и богословская неоднозначность текста.
