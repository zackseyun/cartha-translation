base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/001.yaml
  text: He says, “I told you just now that you are crafty and headstrong, asking for the interpretations of the parables. But since you are so persistent, I will interpret for you the parable of the field and the rest. He entrusted them to the angels to keep them; and he himself cleansed their sins, having labored much and endured many toils—for no one can dig without toil or labor.
translation:
  language: ru
  text: 'Он сказал: «Я только что сказал тебе, что ты хитёр и своенравен, допытываешься толкований притч. Но, поскольку ты так упорен, я истолкую тебе притчу о поле и прочее[a]. Он поручил их ангелам, чтобы они хранили их, а сам очистил их от грехов, много потрудившись и претерпев многие тяготы, — ведь никто не может копать без труда и усилий».


    [a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст повреждён уже после слова «прочее»; следующие слова в этой фразе не поддаются надёжному восстановлению. Поэтому переход к «Он поручил их ангелам» и референты местоимений «их» остаются неясными.
    reason: Сноска поставлена в точке начала повреждения и сохраняет текстологическую неопределённость, не восполняя её догадками.
lexical_decisions:
- source_word: πανοῦργος
  choice: хитёр
  rationale: Передаёт неодобрительный оттенок находчивости или лукавой изобретательности, не усиливая его до значения «злой».
- source_word: αὐθάδης
  choice: своеволен
  rationale: Сохраняет значение самовольства и упрямства; последующее παράμονος отдельно передано как настойчивость.
- source_word: ἐπιλύσεις
  choice: толкования
  rationale: В контексте притч речь идёт об их разъяснении и истолковании.
- source_word: παράμονος
  choice: настойчив
  rationale: Естественно передаёт упорство Ермы в просьбах о разъяснении, сохраняя лёгкий укор.
- source_word: συντηρεῖν
  choice: хранили
  rationale: Передаёт охрану и сохранение вверенных им людей.
- source_word: ἐκαθάρισε
  choice: очистил
  rationale: Сохраняет образ очищения грехов без замены его более конфессионально нагруженным термином.
- source_word: σκαφεῦσαι
  choice: вскопать землю
  rationale: Делает сельскохозяйственный образ ясным по-русски; глагол означает копать или вскапывать.
theological_decisions:
- issue: Неясный субъект и референт местоимений в повреждённом переходе
  choice: Сохранены местоимения «их», без уточнения, кого именно Господь поручил ангелам и чьи грехи очистил.
  alternative: Явно вставить «народ» или «людей».
  rationale: Сохранившийся греческий текст в этом месте дефектен, а добавление явного существительного преждевременно устранило бы неясность.
- issue: Образ очищения грехов
  choice: «очистил их грехи»
  alternative: «искупил их грехи» или «простил их грехи»
  rationale: Греческое ἐκαθάρισε буквально выражает очищение; термины «искупил» и «простил» вносили бы отсутствующее уточнение механизма или характера действия.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Реплика передана живо, но без разговорной фамильярности; близкие характеристики πανοῦργος, αὐθάδης и παράμονος намеренно разведены как «хитёр», «своеволен» и «настойчив».
