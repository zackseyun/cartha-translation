base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/052/002.yaml
  text: Therefore, having cleansed the sins of the people, he showed them the paths of life, giving them the law that he received from his Father. “You see,” he says, “that he himself is Lord of the people, having received all authority from his Father. And as for the Lord’s taking his Son and the glorious angels as counselors concerning the inheritance of the servant—listen.
translation:
  language: ru
  text: Итак, очистив грехи народа, он показал им пути жизни и дал им закон, который получил от своего Отца. «Видишь, — говорит он, — что он сам есть Господь народа, получивший от своего Отца всю власть. А теперь послушай о том, что Господь взял своего Сына и славных ангелов в советники по вопросу о наследстве раба».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς τρίβους τῆς ζωῆς
  choice: пути жизни
  rationale: Передаёт образ проторённых путей естественным современным русским выражением, не ослабляя метафоры.
- source_word: κύριός ἐστι τοῦ λαοῦ
  choice: есть Господь народа
  rationale: Сохраняет предикативную конструкцию и титульное значение κύριος в данном богословском контексте.
- source_word: σύμβουλον ἔλαβε
  choice: взял … в советники
  rationale: Прямо передаёт совещательный статус Сына и ангелов; множественное число в переводе согласовано с составным дополнением.
- source_word: περὶ τῆς κληρονομίας τοῦ δούλου
  choice: по вопросу о наследстве раба
  rationale: 'Сохраняет объективную неоднозначность родительного оборота: речь может идти о наследстве, предназначенном рабу, либо связанном с ним иным образом.'
theological_decisions:
- issue: Различение референтов в выражениях «он сам», «Господь» и «его/своего Сына»
  choice: Сохранить местоименную структуру и переход к титулу «Господь», не вводя поясняющих имён.
  alternative: Явно назвать референтов, например «Сын Божий» или «Бог».
  rationale: Греческий текст в данном отрывке опирается на контекст и допускает богословское напряжение; экспликация могла бы навязать толкование.
- issue: Фраза о наследстве раба
  choice: «наследство раба»
  alternative: «наследство для раба»
  rationale: Более формальная передача сохраняет неоднозначность τοῦ δούλου и не определяет заранее, является ли раб получателем наследства.
translation_notes:
  register: Современный литературный русский с умеренно торжественным, раннехристианским звучанием. Синтаксис слегка выправлен для ясности, но последовательность аргумента и местоименная неоднозначность оригинала сохранены.
