base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/003.yaml
  text: “Why,” I ask, “does the prayer of the one who is sorrowing not ascend to the altar?” “Because,” he says, “sorrow has settled in his heart. Therefore sorrow, mixed with the prayer, does not allow the prayer to ascend pure to the altar. For just as vinegar and wine, mixed together, do not have the same pleasantness, so also sorrow, mixed with the Holy Spirit, does not have the same prayer.”
translation:
  language: ru
  text: «Почему же, — спросил я, — молитва скорбящего не восходит к жертвеннику?» «Потому, — ответил он, — что скорбь поселилась в его сердце. Смешавшись с молитвой, скорбь не даёт ей в чистоте взойти к жертвеннику. Ведь как уксус и вино, смешанные вместе, не обладают одинаковой приятностью, так и при скорби, смешанной со Святым Духом, молитва уже не та».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально последняя фраза: «так и скорбь, смешанная со Святым Духом, не имеет той же молитвы». Необычная греческая конструкция не уточняет, в каком именно отношении молитва «не та»; контекст может подразумевать её чистоту или действенность.'
    reason: Сохраняет лексическую и богословскую неоднозначность τὴν αὐτὴν ἔντευξιν οὐκ ἔχει, не вводя в основной текст отсутствующее определение «сила».
lexical_decisions:
- source_word: ἔντευξις
  choice: молитва
  rationale: В данном религиозном контексте означает молитвенное обращение или прошение; «молитва» естественно и понятно современному читателю.
- source_word: τοῦ λυπουμένου
  choice: скорбящего
  rationale: Передаёт продолжающееся состояние печали, не уточняя его причины.
- source_word: ἐγκάθηται
  choice: поселилась
  rationale: Сохраняет образ скорби, прочно обосновавшейся в сердце.
- source_word: καθαρὰν
  choice: в чистоте
  rationale: Передаёт наречное значение и сохраняет культовый оттенок чистоты молитвы у жертвенника.
- source_word: ἡδονή
  choice: приятный вкус
  rationale: В сравнении вина с уксусом речь естественнее всего понимать как о приятности вкуса.
- source_word: τὴν αὐτὴν ἔντευξιν οὐκ ἔχει
  choice: уже не имеет прежней силы молитвы
  rationale: Греческое выражение буквально необычно и допускает оттенок действенности молитвы; перевод делает фразу понятной, а сноска сохраняет формальную неоднозначность.
theological_decisions:
- issue: Связь скорби со Святым Духом
  choice: Сохранено прямое утверждение о скорби, смешанной со Святым Духом
  alternative: Истолковать как скорбь, примешанную к молитве, совершаемой Святым Духом
  rationale: Источник формулирует напряжённый образ без разъяснения; перевод не должен устранять эту богословскую неоднозначность.
- issue: Действенность молитвы скорбящего
  choice: «не имеет прежней силы молитвы»
  alternative: «не имеет той же молитвы»
  rationale: Контекст предыдущего предложения говорит о неспособности молитвы взойти к жертвеннику; при этом буквальная конструкция отмечена в сноске, чтобы не скрывать трудность текста.
