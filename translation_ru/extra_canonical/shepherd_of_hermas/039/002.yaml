revisions:
- from: А человек, предающийся печали, всегда поступает дурно. Во-первых, он поступает дурно потому, что огорчает Святого Духа, данного человеку радостным; во-вторых, огорчая Святого Духа, он творит беззаконие, не обращаясь с мольбой и не исповедуясь Господу. Ведь мольба человека, предающегося печали, никогда не имеет силы подняться к жертвеннику Божьему.
  to: А человек, предающийся печали, всегда поступает дурно. Во-первых, он поступает дурно потому, что огорчает Святого Духа, данного человеку исполненным радости; во-вторых, огорчая Святого Духа, он творит беззаконие, не вознося мольбы и не исповедуясь Господу. Ведь мольба человека, предающегося печали, никогда не имеет силы подняться к жертвеннику Божьему.
  rationale: Уточнено, что «исполненным радости» относится к Святому Духу, как того требует грамматическое согласование греческого ἱλαρόν с πνεῦμα. Заменён лишь один несколько тяжеловесный оборот; смысл, риторические повторы и богословски неуточнённая широта ἐξομολογούμενος сохранены.
