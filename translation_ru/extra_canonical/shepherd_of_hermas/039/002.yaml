base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/002.yaml
  text: 'But the sorrowful man always acts wickedly: first, he acts wickedly because he grieves the Holy Spirit that was given to the human being as cheerful; second, by grieving the Holy Spirit he works lawlessness, neither praying nor confessing to the Lord. For the prayer of a sorrowful man never has power to ascend to the altar of God.'
translation:
  language: ru
  text: А человек, предающийся печали, всегда поступает дурно. Во-первых, он поступает дурно потому, что огорчает Святого Духа, данного человеку исполненным радости; во-вторых, огорчая Святого Духа, он творит беззаконие, не вознося мольбы и не исповедуясь Господу. Ведь мольба человека, предающегося печали, никогда не имеет силы подняться к жертвеннику Божьему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυπηρὸς ἀνήρ
  choice: человек, предающийся печали
  rationale: Передаёт не просто краткое чувство грусти, а устойчивое состояние человека; при этом не превращает выражение в психологический диагноз.
- source_word: πονηρεύεται
  choice: поступает дурно
  rationale: Глагол описывает злое или порочное действие; нейтрально-достоинная формулировка сохраняет повтор оригинала.
- source_word: ἱλαρόν
  choice: радостным
  rationale: 'Согласовано по смыслу с «Духом»: Дух дан как радостный, а не «для радости»; сохраняется грамматическая неоднозначность конструкции.'
- source_word: ἐντυγχάνων
  choice: обращаясь с мольбой
  rationale: В данном религиозном контексте означает молитвенное обращение или прошение; «молиться» возможно, но менее точно передаёт просительный оттенок.
- source_word: ἐξομολογούμενος
  choice: исповедуясь
  rationale: Сохраняет широкий религиозный смысл признания или исповедания перед Господом, не уточняя без достаточных оснований, идёт ли речь только о грехах или также о хвале.
- source_word: ἔντευξις
  choice: мольба
  rationale: Передаёт молитвенное прошение и позволяет сохранить лексическую связь с ἐντυγχάνων.
- source_word: θυσιαστήριον
  choice: жертвенник
  rationale: Точный культовый термин, уместный для образа восхождения молитвы к Божьему жертвеннику.
theological_decisions:
- issue: К кому относится ἱλαρόν в выражении τὸ πνεῦμα τὸ ἅγιον τὸ δοθὲν τῷ ἀνθρώπῳ ἱλαρόν
  choice: «Святого Духа, данного человеку радостным»
  alternative: «Святого Духа, данного человеку для радости»
  rationale: Форма ἱλαρόν грамматически согласуется с πνεῦμα и характеризует Духа; перевод не вводит целевое значение, которого прямо нет в греческом.
- issue: Смысл ἐξομολογούμενος τῷ κυρίῳ
  choice: «исповедуясь Господу»
  alternative: «воздавая хвалу Господу» или «признаваясь Господу»
  rationale: Греческий глагол допускает исповедание, признание и благодарственное славословие. Общий русский религиозный термин сохраняет эту широту лучше, чем более узкие варианты.
- issue: Утверждение о молитве опечаленного человека
  choice: Сохранено категорическое «никогда не имеет силы подняться»
  alternative: Смягчить как «ей трудно подняться»
  rationale: Оригинал выражается категорично; богословское напряжение не следует устранять пояснением или смягчением.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Повторы «поступает дурно» и «огорчает Святого Духа» сохранены как часть риторической структуры оригинала. «Человек» употреблено вместо гендерно маркированного «муж», поскольку ἀνήρ здесь имеет обобщённый нравственный смысл.
