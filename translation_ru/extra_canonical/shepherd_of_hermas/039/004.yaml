base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/004.yaml
  text: Cleanse yourself, then, from this evil sorrow, and you will live to God; and all will live to God, as many as cast off sorrow from themselves and clothe themselves with all cheerfulness.
translation:
  language: ru
  text: Итак, очисти себя от этой злой печали — и будешь жить для Бога. И все, кто отбросит от себя печаль и облечётся во всякую радость, будут жить для Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύπη
  choice: печаль
  rationale: 'Передаёт устойчивый термин всего контекста: внутреннюю удручённость, противопоставленную радости; более естественно и точно, чем «скорбь» или «уныние», которые добавили бы особые оттенки.'
- source_word: πονηρά
  choice: злая
  rationale: Сохраняет явную нравственную оценку печали в греческом тексте, не смягчая её до «вредной».
- source_word: ζήσῃ τῷ θεῷ / ζήσονται τῷ θεῷ
  choice: будешь жить для Бога / будут жить для Бога
  rationale: Дательный τῷ θεῷ допускает значение направленности и принадлежности; «для Бога» естественно по-русски и не конкретизирует выражение как «пред Богом» или «в Боге».
- source_word: ἀποβάλωσιν ἀφ᾿ ἑαυτῶν
  choice: отбросит от себя
  rationale: Сохраняет образ намеренного снятия и удаления печали.
- source_word: ἐνδύσωνται πᾶσαν ἱλαρότητα
  choice: облечётся во всякую радость
  rationale: «Облечётся» сохраняет метафору одежды, а «всякая радость» передаёт πᾶσαν ἱλαρότητα и связывает стих с призывом Ἔνδυσαι... τὴν ἱλαρότητα в начале раздела.
theological_decisions:
- issue: Смысл выражения «жить Богу»
  choice: «жить для Бога»
  alternative: «жить пред Богом» / «жить в Боге»
  rationale: Греческий дательный не требует ни пространственного, ни мистико-союзного уточнения; выбран нейтральный вариант направленности жизни к Богу.
- issue: Условность обещания для всех
  choice: «все, кто отбросит... и облечётся...»
  alternative: «все будут жить для Бога, сколько бы ни...»
  rationale: Относительная конструкция ὅσοι ἄν обозначает весь класс людей, исполняющих условие; русский вариант ясно сохраняет эту связь, не превращая её в безусловный универсализм.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Синтаксис упрощён для ясности, но параллелизм и метафора облачения сохранены. Архаизм «облечётся» оправдан ключевым образом текста; прочая лексика современна.
