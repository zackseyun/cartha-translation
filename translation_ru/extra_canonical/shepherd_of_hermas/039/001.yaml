base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/039/001.yaml
  text: Clothe yourself, then, with cheerfulness, which always has favor with God and is acceptable to him, and delight in it. For every cheerful man does good, thinks good things, and despises sorrow.
translation:
  language: ru
  text: Итак, облекись в радость, которая всегда угодна Богу и приятна Ему, и наслаждайся ею. Ведь всякий радостный человек делает добро, помышляет о добром и презирает печаль.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἱλαρότητα / ἱλαρός
  choice: радость / радостный
  rationale: Передаёт устойчивое светлое расположение духа естественным современным русским языком и сохраняет повтор греческого корня.
- source_word: ἔχουσαν χάριν παρὰ τῷ θεῷ
  choice: угодна Богу
  rationale: Идиома означает благоволение и одобрение со стороны Бога; буквальное «имеет благодать у Бога» здесь было бы неясно и могло бы внести лишний богословский оттенок.
- source_word: εὐπρόσδεκτον οὖσαν αὐτῷ
  choice: приятна Ему
  rationale: Сохраняет смысл того, что Бог принимает её благосклонно, и не дублирует «угодна» дословно.
- source_word: ἐντρύφα ἐν αὐτῇ
  choice: наслаждайся ею
  rationale: Передаёт сильный положительный оттенок глагола — находить в ней удовольствие, услаждаться ею.
- source_word: ἀγαθὰ ἐργάζεται
  choice: делает добро
  rationale: Естественно передаёт множественное субстантивированное ἀγαθά как добрые дела в обобщённом смысле.
- source_word: ἀγαθὰ φρονεῖ
  choice: помышляет о добром
  rationale: Сохраняет мыслительный и нравственный смысл φρονεῖ, не сводя выражение только к отдельным «хорошим мыслям».
- source_word: καταφρονεῖ τῆς λύπης
  choice: презирает печаль
  rationale: Сохраняет намеренно сильное выражение оригинала; более мягкое «не поддаётся печали» чрезмерно истолковывало бы текст.
theological_decisions:
- issue: Характер Божьего отношения к радости
  choice: «угодна Богу и приятна Ему»
  alternative: «имеет благодать у Бога и благоприятна Ему»
  rationale: Выбор передаёт две близкие, но не тождественные характеристики без превращения χάρις в технический термин о спасительной благодати.
- issue: Отношение к печали
  choice: «презирает печаль»
  alternative: «не поддаётся печали»
  rationale: Сохранена резкость текста и его нравственное наставление без попытки согласовать его с позднейшими категориями пастырского или психологического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Сохранены повелительная форма, параллелизм «делает… помышляет… презирает» и повтор лексики радости; синтаксис слегка упрощён ради ясности.
