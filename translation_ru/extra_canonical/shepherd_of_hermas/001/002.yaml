base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001/002.yaml
  text: She laughed and says to me, "Evil desire has risen up into your heart. Or does it not seem to you to be a wicked thing for a righteous man if evil desire rises into his heart? It is indeed a sin—and a great one, she says. For a righteous man plans what is righteous. Therefore, in planning what is righteous, his glory is established in the heavens, and he has the Lord readily reconciled in every matter of his. But those who plan evil in their hearts bring upon themselves death and captivity—especially those who secure this present age for themselves, who exult in their wealth, and who do not hold fast to the good things that are coming.
translation:
  language: ru
  text: 'Она рассмеялась и сказала мне: «В твоём сердце возникло злое желание. Или ты не считаешь злом, если в сердце праведного человека возникает злое желание? Это действительно грех, — говорит она, — и грех великий. Ведь праведный человек замышляет праведное. И поскольку он замышляет праведное, его слава утверждается на небесах, а Господь благосклонен к нему во всех его делах. Те же, кто замышляет зло в своих сердцах, навлекают на себя смерть и плен — особенно те, кто приобретают себе нынешний век, кичатся своим богатством и не держатся грядущих благ».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμία τῆς πονηρίας / ἡ πονηρὰ ἐπιθυμία
  choice: злое желание
  rationale: Передаёт нравственно отрицательное желание без неоправданного сужения до конкретного вида страсти.
- source_word: βουλεύεται / βουλευόμενοι
  choice: замышляет / замышляет зло
  rationale: Сохраняет акцент на внутреннем обдумывании и намерении, а не только на внешнем поступке.
- source_word: κατορθοῦται
  choice: утверждается
  rationale: Передаёт достижение или упрочение славы в естественной русской формулировке, не вводя идеи личной заслуги сверх текста.
- source_word: εὐκατάλλακτον ἔχει τὸν Κύριον
  choice: Господь благосклонен к нему
  rationale: Греческая идиома означает, что Господь легко умилостивляем или расположен благоприятно; буквальное «имеет Господа легко примиряемым» по-русски тяжеловесно и может неверно подразумевать вражду.
- source_word: τὸν αἰῶνα τοῦτον περιποιούμενοι
  choice: стремится приобрести себе нынешний век
  rationale: Сохраняет необычный и неоднозначный образ присвоения нынешнего века, не сводя его лишь к любви к миру или накоплению имущества.
- source_word: ἀντεχόμενοι
  choice: держится
  rationale: Передаёт настойчивую приверженность и верность грядущим благам.
theological_decisions:
- issue: Греховность возникшего в сердце злого желания
  choice: Сохранено прямое утверждение, что возникновение злого желания в сердце праведного — великий грех.
  alternative: Истолковать это только как сознательное согласие с искушением.
  rationale: Исходный текст не проводит явного различия между первым движением желания и сознательным согласием, поэтому такое уточнение было бы богословским привнесением.
- issue: εὐκατάλλακτον ἔχει τὸν Κύριον
  choice: Господь благосклонен к нему
  alternative: Он легко примиряет с собой Господа / Господь легко примиряется с ним.
  rationale: Выбранная формулировка сохраняет благоприятное Божье расположение, но не создаёт лишнего утверждения о механизме примирения или заслуге человека.
- issue: Связь праведных замыслов и небесной славы
  choice: 'Сохранена причинно-логическая связь: поскольку человек замышляет праведное, его слава утверждается на небесах.'
  alternative: 'Ослабить связь: «тем самым проявляется его небесная слава».'
  rationale: Конструкция ἐν τῷ ... κατορθοῦται выражает связь действия с утверждением славы; её не следует устранять ради богословского сглаживания.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Синтаксис умеренно формальный, но понятный обычному читателю. Формула «говорит она» сохранена внутри прямой речи как повествовательное уточнение источника; метафоры сердца, небесной славы, смерти и плена оставлены без рационализирующего толкования.
