base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001/001.yaml
  text: '"Did I speak? Did I not always regard you as a goddess? Did I not always respect you as a sister? Why do you falsely accuse me, woman, of these wicked and unclean things?"'
translation:
  language: ru
  text: «Разве я говорил? Разве я не всегда почитал тебя как богиню? Разве я не всегда относился к тебе с уважением, как к сестре? Почему же ты ложно обвиняешь меня, женщина, в этих злых и нечистых вещах?»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλησα
  choice: «Разве я говорил?»
  rationale: Сохраняет краткий риторический вопрос аориста без добавления не выраженного в греческом дополнения.
- source_word: ὡς θεὰν ἡγησάμην
  choice: «почитал тебя как богиню»
  rationale: Передаёт значение ἡγέομαι как высокой оценки и сохраняет прямое сравнение с богиней.
- source_word: ἐνετράπην
  choice: «относился к тебе с уважением»
  rationale: В данном контексте глагол выражает почтительное отношение; буквальное «стыдился» в современном русском исказило бы смысл.
- source_word: τὰ πονηρὰ ταῦτα καὶ ἀκάθαρτα
  choice: «в таких злых и нечистых помыслах»
  rationale: Субстантивированные прилагательные отсылают к вменяемому внутреннему желанию; «помыслы» естественно передаёт контекст, не смягчая нравственной оценки.
- source_word: ὦ γύναι
  choice: «ты, женщина»
  rationale: Сохраняет прямое обращение γύναι без добавления оттенков супружеского или уничижительного обращения.
