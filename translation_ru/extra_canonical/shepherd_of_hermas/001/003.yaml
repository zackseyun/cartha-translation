  source_fidelity: Переданы будущее μετανοήσουσιν, образное ἰάσεται τὰ ἁμαρτήματά σου («исцелит грехи»), широкий οἶκος («дом») и эллиптическое распространение «грехов» на дом и святых. Однако в исходном тексте относительное οἵτινες относится к людям, чьи «души» являются грамматическим подлежащим; русская конструкция нуждается в перестройке и согласовании числа.
