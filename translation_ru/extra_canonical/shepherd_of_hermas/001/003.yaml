base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/001/003.yaml
  text: '"Their souls will repent—those who have no hope, but have despaired of themselves and of their life. But you—pray to God, and he will heal your sins, and those of your whole household, and of all the holy ones."'
translation:
  language: ru
  text: «Души тех, у кого нет надежды, кто отчаялся в себе и в своей жизни, покаятся. Ты же молись Богу, и Он исцелит твои грехи, а также грехи всего твоего дома и всех святых».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετανοήσουσιν
  choice: раскаются
  rationale: Передаёт будущее время и нравственно-религиозный смысл μετανοέω, не сводя его лишь к чувству сожаления.
- source_word: αἱ ψυχαὶ αὐτῶν
  choice: их души
  rationale: Сохраняет явное упоминание душ и порядок смысловых акцентов греческого текста.
- source_word: ἑαυτοὺς ἀπηγνώκασι καὶ τὴν ζωὴν αὐτῶν
  choice: отчаялся в себе и в своей жизни
  rationale: Естественно по-русски передаёт совершенное состояние утраты надежды, выраженное перфектом ἀπηγνώκασι.
- source_word: ὅλου τοῦ οἴκου σου
  choice: всего твоего дома
  rationale: «Дом» сохраняет возможный широкий смысл οἶκος — домочадцы или всё домашнее сообщество — не сужая его до современной нуклеарной семьи.
- source_word: πάντων τῶν ἁγίων
  choice: всех святых
  rationale: Прямо передаёт раннехристианское обозначение членов святого сообщества без добавления конфессионального толкования.
theological_decisions:
- issue: Образ исцеления грехов
  choice: Он исцелит твои грехи
  alternative: Он простит твои грехи
  rationale: Греческое ἰάσεται буквально означает «исцелит». Сохранение лечебного образа не подменяет авторскую метафору более привычным богословским термином «простит».
- issue: К чему относятся грехи в перечислении
  choice: а также грехи всего твоего дома и всех святых
  alternative: и весь твой дом, и всех святых
  rationale: Родительные формы после τὰ ἁμαρτήματά допускают и естественно поддерживают эллипсис «грехи [дома и святых]»; явное восстановление слова по-русски устраняет ложное впечатление, будто исцеляются сами люди, но не добавляет нового содержания.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис сделан ясным для обычного читателя, при этом сохранены необычный образ «исцеления грехов», упоминание души и широкий смысл слова «дом».
