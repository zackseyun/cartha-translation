    rationale: В данном увещательном раннехристианском контексте «покаются» сохраняет значение перемены/обращения, а не только сожаления о содеянном.
  revised_text: «Души тех, у кого нет надежды, кто отчаялся в себе и в своей жизни, покаятся. Ты же молись Богу, и Он исцелит твои грехи, а также грехи всего твоего дома и всех святых».
