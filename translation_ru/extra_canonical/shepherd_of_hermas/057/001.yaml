base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/057/001.yaml
  text: I say to him, "Lord, explain this to me further." He says, "What are you seeking?" I say, "Then, Lord, are those who indulge themselves and are deceived tormented for the same length of time as the time of the deception? For the time of deception is one hour, but the hour of torment has the force of thirty days. Therefore, if someone indulges himself for one day and is deceived, and is tormented for one day, the day of torment amounts to a whole year. So then, for as many days as a person indulges himself, for that many years he is tormented." "You see then," he says, "that the time of indulgence and deception is very short, but the time of punishment and torment is long."
translation:
  language: ru
  text: 'Я говорю ему: «Господин, объясни мне ещё вот что». Он спрашивает: «Что ты хочешь узнать?» Я говорю: «Итак, господин, те, кто живёт в наслаждениях и оказывается обманутым, мучаются столько же времени, сколько длится обман?» Он отвечает: «Время обмана — один час, а час мучения имеет силу тридцати дней. Поэтому, если кто-нибудь один день жил в наслаждениях и был обманут, а один день мучился, день мучения равняется целому году. Итак, сколько дней человек жил в наслаждениях, столько лет он мучается». «Видишь же, — говорит он, — что время наслаждения и обмана очень коротко, а время наказания и мучения долго».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: господин
  rationale: В диалоге это почтительное обращение к наставнику; строчная буква и «господин» не отождествляют собеседника с Богом без достаточного основания.
- source_word: τρυφῶντες / τρυφήσῃ
  choice: предающиеся наслаждениям / предавался наслаждениям
  rationale: Передаёт идею изнеженной, самоугодной жизни и чувственных удовольствий, сохраняя нравственно отрицательный оттенок.
- source_word: ἀπατώμενοι / ἀπατηθῇ
  choice: обманывающиеся / обманывался
  rationale: Средне-страдательная форма допускает смысл пребывания в обмане; русская возвратная форма сохраняет некоторую неоднозначность между самообманом и обманутостью.
- source_word: βασανίζονται / βασάνου
  choice: мучаются / мучения
  rationale: Прямо передаёт страдание или мучение, не конкретизируя способ наказания.
- source_word: δύναμιν ἔχει / ἰσχύει
  choice: имеет силу / засчитывается
  rationale: Первое выражение сохранено близко к форме оригинала; второе естественно поясняет расчётное соответствие одного дня мучения целому году.
- source_word: τιμωρίας
  choice: наказания
  rationale: Обычное и точное обозначение карательного воздаяния в данном контексте.
theological_decisions:
- issue: Статус лица, к которому обращаются как Κύριε
  choice: «господин» со строчной буквы
  alternative: «Господь»
  rationale: Контекст представляет беседу с наставляющим персонажем; перевод не должен безосновательно придавать обращению прямой божественный смысл.
- issue: Характер временного соответствия между наслаждением и мучением
  choice: 'Сохранено буквальное соотношение: день наслаждения соответствует году мучения'
  alternative: Истолковать числа символически или как неопределённо долгий срок
  rationale: Источник прямо формулирует расчёт и не объясняет, является ли он буквальным либо образным; перевод сохраняет эту напряжённость без комментария.
- issue: Субъект обмана
  choice: «обманывающиеся / обманывался»
  alternative: «обманутые / был обманут» или «обманывающие себя»
  rationale: Греческая форма не требует однозначного решения между внешним обманом и вовлечённостью самого человека в заблуждение.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставительного диалога. Синтаксис сделан ясным для обычного читателя, при этом числовая логика и повтор ключевых слов оригинала сохранены. Маркеры сносок не требуются.
