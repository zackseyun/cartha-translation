revisions:
- from: 'Я говорю ему: «Господин, объясни мне ещё вот что». Он спрашивает: «Что ты хочешь узнать?» Я говорю: «Значит ли это, господин, что предающиеся наслаждениям и обманывающиеся мучаются столько же времени, сколько длится обман?» «Время обмана — один час, но час мучения имеет силу тридцати дней. Поэтому, если кто-нибудь один день предавался наслаждениям и обманывался, а затем один день мучился, этот день мучения засчитывается за целый год. Итак, сколько дней человек предавался наслаждениям, столько лет он мучается. Видишь же, — говорит он, — что время наслаждения и обмана совсем коротко, а время наказания и мучения долго».'
