base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/005.yaml
  text: I say to him, "Sir, since I have you with me, I must ask you and question you; for you show me everything and speak with me. But if apart from you I were seeing or hearing these things, I would ask the Lord that it might be made clear to me."
translation:
  language: ru
  text: 'Я говорю ему: «Господин, раз ты со мной, мне необходимо просить тебя и расспрашивать тебя, ведь ты всё мне показываешь и говоришь со мной. А если бы я видел или слышал это без тебя, то попросил бы Господа, чтобы мне это разъяснилось».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Господин
  rationale: Это обращение к собеседнику-наставнику, тогда как далее τὸν Κύριον обозначает Господа; различие передано контекстуально.
- source_word: ἀνάγκην ἔχω
  choice: мне необходимо
  rationale: Передаёт идиоматическое значение необходимости без неестественной кальки «имею нужду».
- source_word: ἐπερωτᾶν
  choice: расспрашивать
  rationale: Сохраняет оттенок настойчивого обращения с вопросами и отличает глагол от более общего αἰτεῖσθαι — «просить».
- source_word: ἄτερ σοῦ
  choice: без тебя
  rationale: Естественный современный русский эквивалент со значением отсутствия наставника при видении или слышании.
- source_word: δηλωθῇ
  choice: разъяснилось
  rationale: Пассивная форма сохранена без указания действующего лица; смысл — стать ясным или быть объяснённым.
theological_decisions:
- issue: Различение Κύριε в обращении к наставнику и τὸν Κύριον как обозначения Господа
  choice: «Господин» в обращении и «Господа» применительно к Богу
  alternative: В обоих случаях «Господь»
  rationale: Контекст различает непосредственного собеседника и Господа, к которому герой обратился бы с просьбой; выбранная передача предотвращает их необоснованное отождествление.
- issue: Неуказанный субъект пассивного δηλωθῇ
  choice: Сохранить безлично-пассивное «чтобы мне это разъяснилось»
  alternative: «чтобы Господь разъяснил мне это»
  rationale: Греческий текст не выражает действующее лицо прямо, поэтому перевод не добавляет его, хотя Господь является адресатом просьбы.
translation_notes:
  register: Современный литературный русский язык с достойным, но доступным повествовательным регистром. Повтор местоимения «тебя» сохранён ради соответствия парным греческим формам; синтаксис слегка сглажен для естественного русского звучания.
