revisions:
- from: 'Я говорю ему: «Господин, пока ты со мной, мне необходимо просить тебя и расспрашивать тебя, ведь ты всё мне показываешь и говоришь со мной. А если бы я увидел или услышал это без тебя, то попросил бы Господа, чтобы мне это разъяснилось».'
  to: 'Я говорю ему: «Господин, раз ты со мной, мне необходимо просить тебя и расспрашивать тебя, ведь ты всё мне показываешь и говоришь со мной. А если бы я видел или слышал это без тебя, то попросил бы Господа, чтобы мне это разъяснилось».'
  rationale: 'Внесены только две безопасные стилистико-семантические правки: причинное «раз ты со мной» вместо временного «пока ты со мной» и несовершенный вид «видел или слышал» для более близкой передачи греческих имперфектов. Смысл, различение титулов и намеренно не названный субъект «разъяснилось» сохранены.'
