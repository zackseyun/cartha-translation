  text: I say, "Sir, I do not know these parables, nor am I able to understand them unless you explain them to me."
translation:
  language: ru
  text: 'Я говорю: «Господин, я не знаю этих притч и не могу их понять, если ты не истолкуешь мне их».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κύριε
  choice: Господин
  rationale: В обращении к наставнику κύριε выражает почтение; «Господин» сохраняет это значение, не отождествляя собеседника с Господом Богом.
- source_word: παραβολὰς
  choice: притч
  rationale: «Притчи» — естественный и традиционный эквивалент παραβολαί в данном назидательно-образном контексте.
- source_word: οὐ γινώσκω
  choice: не понимаю
  rationale: Здесь глагол обозначает отсутствие понимания смысла притч, а не простое незнакомство с ними.
- source_word: νοῆσαι
  choice: постичь
  rationale: Передаёт более глубокое мысленное уразумение и сохраняет различие с γινώσκω.
- source_word: ἐπιλύσῃς
  choice: истолкуешь
  rationale: Глагол означает разъяснить, раскрыть смысл; «истолкуешь» естественно сочетается с притчами.
theological_decisions:
- issue: Передача обращения Κύριε
  choice: Господин
  alternative: Господи
  rationale: Собеседник Ермы — небесный наставник, однако контекст не требует понимать обращение как божественный титул; «Господин» сохраняет почтительность и не вносит лишнего отождествления.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского назидательного текста; синтаксис прямой и доступный, при этом различие между «понимать» и «постичь» сохранено.
