base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/004.yaml
  text: '"You shall keep these things thus—you, with your children and your whole household; and having kept them you will be blessed; and as many as, having heard them, keep them will be blessed, and they will receive understanding from the Lord."'
translation:
  language: ru
  text: Вот как ты должен соблюдать это — вместе со своими детьми и всем своим домом. Если будешь соблюдать это, будешь блажен. И все, кто услышит это и будут соблюдать, будут блаженны и получат разумение от Господа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τηρήσεις / τηρήσας / τηρήσωσι
  choice: соблюдай / соблюдая / станет соблюдать
  rationale: Передаёт повторяющийся призыв не просто помнить услышанное, но исполнять и хранить предписанное; формы по-русски варьируются ради естественности.
- source_word: τέκνων
  choice: дети
  rationale: Обычное современное соответствие в контексте семьи.
- source_word: ὅλου τοῦ οἴκου σου
  choice: весь твой дом
  rationale: Сохраняет ёмкий образ οἶκος, который может охватывать всё домашнее сообщество, а не только жилище.
- source_word: μακάριος / μακάριοι
  choice: блажен / блаженны
  rationale: Сохраняет религиозно-нравственный оттенок греческого слова и достоинство раннехристианского текста.
- source_word: σύνεσιν
  choice: разумение
  rationale: Передаёт способность понимать и постигать, не сужая смысл до простого знания.
theological_decisions:
- issue: Характер обещанного блаженства
  choice: «будешь блажен» без поясняющего дополнения
  alternative: «будешь счастлив» или уточнение вида блаженства
  rationale: Греческий текст не уточняет характер блаженства; традиционное «блажен» сохраняет его богословскую открытость.
- issue: Значение οἶκος
  choice: «весь твой дом»
  alternative: «вся твоя семья» или «все твои домочадцы»
  rationale: «Дом» сохраняет возможную широту древнего понятия домашнего сообщества и не ограничивает его только ближайшими родственниками.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной раннехристианской лексикой. Повтор глагола «соблюдать» сохранён как значимый риторический элемент оригинала; синтаксис разделён на короткие фразы для ясности.
