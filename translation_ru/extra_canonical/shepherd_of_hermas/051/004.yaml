revisions:
- from: Так соблюдай всё это — ты, твои дети и весь твой дом. Соблюдая это, ты будешь блажен. И все, кто услышит это и станет соблюдать, будут блаженны и получат разумение от Господа.
  to: Вот как ты должен соблюдать это — вместе со своими детьми и всем своим домом. Если будешь соблюдать это, будешь блажен. И все, кто услышит это и будут соблюдать, будут блаженны и получат разумение от Господа.
  rationale: Исправление явно передаёт совместность, заключённую в μετά, и убирает добавочный начинательный смысл. Условно-наставительное «должен соблюдать» передаёт будущее τηρήσεις в его предписывающей функции, не меняя смысла обещания.
