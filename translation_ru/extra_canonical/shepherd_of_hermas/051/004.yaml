  terminology: «Блажен/блаженны», «соблюдать», «разумение» и «Господь» уместны и сохраняют возвышенный, но понятный регистр. «Дом» сохранён как широкий образ οἶκος; оборот «со всем своим домом» не сводит его только к зданию.
