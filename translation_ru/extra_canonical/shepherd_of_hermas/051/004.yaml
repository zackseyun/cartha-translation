  source_fidelity: 'Смысл передан верно: предписание относится к адресату, его детям и всему дому; соблюдающим обещаны блаженство и разумение от Господа. Однако «ты, твои дети и весь твой дом» может звучать как простое перечисление самостоятельных субъектов, тогда как μετά выражает соблюдение адресатом вместе с ними. «Станет соблюдать» добавляет не выраженный в греческом начинательный оттенок.'
