  yaml_path: translation/extra_canonical/shepherd_of_hermas/051/003.yaml
  text: '"If, then, you complete the fast in this way as I commanded you, your sacrifice will be acceptable before God, and this fast will be recorded; and the service performed in this way is good and cheerful and acceptable to the Lord.'
translation:
  language: ru
  text: Итак, если ты совершишь пост так, как я повелел тебе, твоя жертва будет угодна Богу, и этот пост будет записан; а служение, совершаемое таким образом, — доброе, радостное и угодное Господу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τελέσῃς τὴν νηστείαν
  choice: совершишь пост
  rationale: Глагол τελέω здесь означает довести предписанный пост до исполнения; «совершишь» естественно передаёт как завершённость, так и религиозный характер действия.
- source_word: δεκτὴ παρὰ τῷ Θεῷ
  choice: угодна Богу
  rationale: Передаёт принятие жертвы Богом в естественной современной русской формулировке, не усиливая смысл до гарантированного одобрения личности.
- source_word: ἔγγραφος
  choice: будет записан
  rationale: Сохраняет образ внесения поста в запись или перечень без уточнения, где именно он записывается, поскольку источник этого не сообщает.
- source_word: λειτουργία
  choice: служение
  rationale: В контексте предписанного религиозного дела слово обозначает служение или исполнение священной обязанности; «служение» сохраняет эту широту.
- source_word: ἱλαρά
  choice: радостное
  rationale: Слово выражает радостный, охотный характер служения; «радостное» подходит к существительному «служение» и звучит естественно.
- source_word: εὐπρόσδεκτος τῷ Κυρίῳ
  choice: угодное Господу
  rationale: Передаёт смысл благосклонного принятия Господом и сохраняет параллель с первой частью фразы.
theological_decisions:
- issue: Соотношение поста, жертвы и принятия Богом
  choice: 'Сохранить условную связь: пост, исполненный предписанным образом, делает жертву угодной Богу.'
  alternative: Переформулировать как общее учение о спасительной заслуге поста.
  rationale: Текст говорит о принятии конкретной жертвы и служения, но не объясняет механизм заслуги или спасения; добавлять такую доктрину нельзя.
- issue: Образ записи поста
  choice: Оставить неопределённое «будет записан».
  alternative: 'Уточнить: «будет записан на небесах» или «в книге Божией».'
  rationale: Греческий текст не называет ни место записи, ни книгу, поэтому образ сохранён без богословского дополнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но понятным религиозным регистром. Синтаксический параллелизм оригинала сохранён; архаизмы и конфессионально маркированные термины не вводились.
