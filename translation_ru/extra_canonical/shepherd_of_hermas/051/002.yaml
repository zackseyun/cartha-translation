  text: He says, "I will explain everything to you, and whatever I speak with you I will show you. The one who has received the commands of prudence will fill his own soul and will pray to the Lord on your behalf.
translation:
  language: ru
  text: 'Он говорит: «Я всё тебе объясню и покажу тебе всё, о чём буду говорить с тобой. Тот, кто принял наставления твоего благоразумия, наполнит свою душу и помолится Господу за тебя».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Последняя фраза в представленном греческом тексте выглядит текстологически или синтаксически нарушенной: буквально сказано «наставления твоего благоразумия», а при «наполнит свою душу» не указан предмет наполнения. Перевод сохраняет эту неясность и не восполняет её предположительным смыслом.'
    reason: Поясняет необычное сочетание φροσύνης σου и отсутствие дополнения при «наполнит», не сглаживая неясность источника.
lexical_decisions:
- source_word: ἐπιλύσω
  choice: объясню
  rationale: Глагол означает разъяснить или истолковать нечто непонятное; «объясню» естественно продолжает просьбу рассказчика объяснить притчи.
- source_word: δείξω
  choice: покажу
  rationale: Сохранено прямое значение глагола и различие между словесным объяснением и наглядным раскрытием.
- source_word: τὰς ἐντολὰ φροσύνης
  choice: наставления благоразумия
  rationale: Передаёт ἐντολά как авторитетные наставления, а φροσύνη — как благоразумие; необычность греческого сочетания не устраняется конфессиональным толкованием.
- source_word: εὔξηται ὑπὲρ σοῦ πρὸς τὸν Κύριον
  choice: помолится за тебя Господу
  rationale: Передано целевое значение ὑπὲρ σοῦ и адресат молитвы πρὸς τὸν Κύριον; будущее по смыслу согласовано с английским консультационным слоем.
theological_decisions:
- issue: Характер «наставлений благоразумия»
  choice: Сохранить как нравственно-духовные наставления без уточнения их происхождения
  alternative: Перевести «заповеди мудрости» или отождествить их с заповедями Господа
  rationale: Греческая формулировка необычна и в предоставленном тексте, вероятно, текстологически нарушена; уточнение внесло бы отсутствующее в источнике богословское отождествление.
- issue: Молитвенное ходатайство
  choice: «помолится за тебя Господу»
  alternative: «будет молиться о тебе перед Господом»
  rationale: Оба варианта возможны; выбран более естественный современный русский оборот, сохраняющий направленность молитвы к Господу.
translation_notes:
  register: Современный литературный русский язык с уважительным, но не архаизированным тоном. Прямая речь оформлена естественно; повтор «тебе» сохранён ради личного характера обещания. Текстологическая шероховатость второй фразы вынесена в примечание, а не сглажена в основном тексте.
