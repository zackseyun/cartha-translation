  source_fidelity: Перевод в целом точно воспроизводит последовательность событий, сравнения ὡσεί («словно») и молитвенное исповедание грехов. Однако «озноб» для φρίκη чрезмерно сужает слово до физиологического ощущения холода; здесь речь о содрогании/ужасе при одиночестве.
