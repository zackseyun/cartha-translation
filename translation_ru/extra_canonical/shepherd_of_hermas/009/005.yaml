base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/005.yaml
  text: Seeing these things set there and no one in the place, I was astonished, and a tremor, as it were, seized me, and my hair stood on end; and a shudder, as it were, came upon me, since I was alone. Then, coming to myself and remembering the glory of God, and taking courage, I knelt and again confessed my sins to the Lord, as before.
translation:
  language: ru
  text: Увидев, что всё это лежит там и что на том месте никого нет, я оцепенел от изумления; меня словно охватила дрожь, волосы у меня встали дыбом, и, поскольку я был один, меня словно охватил ужас. Тогда я пришёл в себя, вспомнил о славе Божьей, ободрился, преклонил колени и снова исповедал Господу свои грехи, как и прежде.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκθαμβος ἐγενόμην
  choice: я оцепенел от изумления
  rationale: Передаёт сильное потрясение и изумление, выраженные греческим ἔκθαμβος, естественным современным русским оборотом.
- source_word: ὡσεί τρόμος με ἔλαβεν
  choice: меня словно охватила дрожь
  rationale: Сохраняет сравнительную частицу ὡσεί и телесный оттенок τρόμος.
- source_word: αἱ τρίχες μου ὀρθαί
  choice: волосы у меня встали дыбом
  rationale: Естественный русский фразеологизм, точно передающий образ вставших волос.
- source_word: ὡσεί φρίκη μοι προσῆλθεν
  choice: на меня словно напал озноб
  rationale: φρίκη может обозначать и содрогание от страха, и озноб; выбран телесно-наглядный эквивалент, не устраняющий атмосферу ужаса.
- source_word: ἐν ἐμαυτῷ οὖν γενόμενος
  choice: тогда я пришёл в себя
  rationale: Устойчивый и точный русский эквивалент идиомы о восстановлении самообладания.
- source_word: μνησθεὶς τῆς δόξης τοῦ Θεοῦ
  choice: вспомнил о славе Божьей
  rationale: Сохраняет прямой богословский образ и родительную конструкцию источника.
- source_word: θεὶς τὰ γόνατα
  choice: преклонил колени
  rationale: Достоинный и понятный русский оборот для действия вставания на колени.
- source_word: ἐξωμολογούμην τῷ Κυρίῳ ... τὰς ἁμαρτίας μου
  choice: исповедал Господу свои грехи
  rationale: Контекст ясно указывает на признание грехов перед Господом; русский глагол «исповедал» сохраняет религиозный смысл без добавления обрядовой конкретики.
theological_decisions:
- issue: Значение «славы Божьей» как источника мужества
  choice: 'Сохранить прямую последовательность: вспомнил о славе Божьей и ободрился'
  alternative: Пояснить, что именно память о славе Бога придала ему смелости
  rationale: Греческий текст ставит действия рядом, но не формулирует причинную связь явно; перевод не должен усиливать её толкованием.
- issue: Характер исповедания грехов
  choice: «исповедал Господу свои грехи»
  alternative: «признался Господу в своих грехах» или терминологически уточнённое сакраментальное прочтение
  rationale: Выбранный вариант передаёт ἐξομολογούμην и не навязывает конфессионального понимания формы исповеди.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, повествовательным регистром. Повторы сравнительного ὡσεί сохранены словом «словно», а последовательность телесного страха и последующего ободрения передана без рационализирующих пояснений.
