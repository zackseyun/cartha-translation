  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/008.yaml
  text: And after the young men withdrew and we were alone, she says to me, “Sit here.” I say to her, “Lady, let the elders sit first.” “What I tell you,” she says, “sit.”
translation:
  language: ru
  text: 'Когда юноши ушли и мы остались одни, она сказала мне: «Сядь здесь». Я сказал ей: «Госпожа, пусть сначала сядут старшие». Она ответила: «Сядь, как я тебе говорю».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεανίσκους
  choice: юноши
  rationale: Прямое и естественное соответствие греческому слову; сохраняет связь с шестью юношами, упомянутыми ранее.
- source_word: Κυρία
  choice: Госпожа
  rationale: Передаёт уважительное обращение к явившейся старице без внесения дополнительного церковного титула.
- source_word: πρεσβυτέρους
  choice: старшим
  rationale: В данном контексте слово допускает значение старших по возрасту или положению; субстантивированное «старшим» сохраняет эту неоднозначность лучше, чем специальный титул «пресвитерам».
- source_word: Ὅ σοι λέγω ... κάθισον
  choice: Сядь, как я тебе говорю
  rationale: Естественно передаёт настойчивую конструкцию и повтор повеления, не утяжеляя русскую фразу буквальным порядком слов.
theological_decisions:
- issue: Значение πρεσβυτέρους
  choice: старшим
  alternative: пресвитерам
  rationale: Непосредственная сцена связана с учтивым предложением уступить место тем, кто старше; контекст не требует однозначно понимать слово как церковную должность, поэтому сохранён более широкий смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Историческое настоящее греческого оригинала сглажено до последовательного прошедшего времени, естественного для русского рассказа; краткость диалога и властный тон последней реплики сохранены.
