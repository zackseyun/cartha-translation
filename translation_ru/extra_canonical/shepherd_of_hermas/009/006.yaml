  verdict: revise
  source_fidelity: 'Греч. πάντα ἐρωτῶν означает «спрашивая/вопрошая обо всём», а не просто «прося обо всём». Вторая ἐρώτα в параллельной форме также лучше передавать тем же глаголом, сохраняя намеренную неуточнённость: речь может идти как о вопросе относительно праведности, так и о молитвенном обращении о ней. Остальные элементы переданы верно: шесть юношей, прикосновение, исповедание грехов Господу и доля праведности для дома/домочадцев.'
  naturalness: «Перестань всё спрашивать о своих грехах» — современная и литературно естественная фраза в данном наставительном контексте. «Чтобы получить для своего дома хотя бы некоторую долю её» сохраняет образ доли и не делает «дом» самостоятельным получателем.
  terminology: «Юноши», «исповедовал ... грехи», «праведность» и «дом» уместны и сохраняют регистр. «Дом» оставляет открытым объём οἶκος (домочадцы, семья, домашнее хозяйство).
