revisions:
- from: 'И она пришла с шестью юношами, которых я уже видел прежде, встала рядом со мной и слушала, как я молился и исповедовал Господу свои грехи. Прикоснувшись ко мне, она сказала: «Ерм, перестань просить обо всём, что касается твоих грехов; проси также о праведности, чтобы и твоему дому досталась от неё некоторая доля».'
  to: 'И она пришла с шестью юношами, которых я уже видел прежде, встала рядом со мной и слушала, как я молился и исповедовал Господу свои грехи. Прикоснувшись ко мне, она сказала: «Ерм, перестань всё спрашивать о своих грехах; спрашивай и о праведности, чтобы получить для своего дома хотя бы некоторую долю её».'
