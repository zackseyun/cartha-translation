base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/006.yaml
  text: And she came with six young men—whom I had seen also before—and she stood by me and listened while I was praying and confessing my sins to the Lord. And touching me she says, “Hermas, stop asking everything about your sins; ask also about righteousness, so that you may receive some share of it for your household.”
translation:
  language: ru
  text: 'И она пришла с шестью юношами, которых я уже видел прежде, встала рядом со мной и слушала, как я молился и исповедовал Господу свои грехи. Прикоснувшись ко мне, она сказала: «Ерм, перестань всё спрашивать о своих грехах; спрашивай и о праведности, чтобы получить для своего дома хотя бы некоторую долю её».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεανίσκων
  choice: юношами
  rationale: Прямое и естественное соответствие слову, обозначающему молодых мужчин; сохраняет связь с ранее явившимися персонажами.
- source_word: κατηκροᾶτο
  choice: слушала
  rationale: Передаёт длительное внимательное слушание без неестественного утяжеления фразы.
- source_word: ἐξομολογουμένου
  choice: исповедовал
  rationale: В данном контексте означает признание грехов перед Господом.
- source_word: παῦσαι ... πάντα ἐρωτῶν
  choice: перестань просить обо всём, что касается
  rationale: Греческая конструкция допускает оттенок просьбы или вопрошания; по контексту молитвы выбран естественный русский глагол «просить», а πάντα соотнесено со всем кругом забот о грехах.
- source_word: δικαιοσύνης
  choice: праведности
  rationale: Сохраняет нравственно-богословский смысл греческого термина и его противопоставление грехам.
- source_word: μέρος τι
  choice: некоторая доля
  rationale: Сохраняет неопределённость τι и образ участия в праведности.
- source_word: οἶκόν σου
  choice: твоему дому
  rationale: 'Сохраняет возможную широту значения οἶκος: домашние, семья или домохозяйство, не сводя его только к зданию.'
theological_decisions:
- issue: Характер просьбы о праведности
  choice: «проси также о праведности»
  alternative: «спрашивай также о праведности»
  rationale: В молитвенном контексте ἐρωτάω естественно передать как просьбу, однако не уточняется, означает ли это дар праведности или наставление о ней; формулировка сохраняет эту напряжённость.
- issue: Получатель доли праведности
  choice: «твоему дому»
  alternative: «для твоей семьи»
  rationale: Буквальная формулировка не решает однозначно, имеется ли в виду семья, домочадцы или весь дом как община.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Синтаксис сделан естественным, но ключевые образы и неопределённости греческого текста сохранены.
