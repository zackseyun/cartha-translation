base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/004.yaml
  text: So I went, brothers, into the field, and I counted the hours, and I came to the place where I had directed her to come; and I see an ivory couch set there, and upon the couch there lay a linen pillow, and on top a spread-out towel of fine linen.
translation:
  language: ru
  text: 'Итак, братья, я отправился в поле, рассчитал время и пришёл к месту, куда велел ей прийти. И вот, вижу: там была поставлена скамья из слоновой кости; на скамье лежала льняная подушка, а сверху было расстелено полотнище из тонкого льна.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово, переведённое как «скамья», редко и может также означать «ложе». Последнее слово может обозначать полотенце; «полотнище» сохраняет неопределённость его назначения.
    reason: Уточняет, какая именно лексема остаётся неясной, и сообщает значимую альтернативу без перегрузки основного текста.
lexical_decisions:
- source_word: συνεψήφισα τὰς ὥρας
  choice: отсчитав часы
  rationale: Передаёт сверку и подсчёт прошедших часов перед назначенным временем естественным русским оборотом.
- source_word: συμπέλιον
  choice: скамья
  rationale: Редкое слово обозначает предмет для сидения; «скамья» сохраняет нейтральность формы лучше, чем более конкретные «ложе» или «диван».
- source_word: ἐλεφάντινον
  choice: из слоновой кости
  rationale: Прямо передаёт материал предмета.
- source_word: κεβριδάριον λινόῦν
  choice: льняная подушка
  rationale: Уменьшительное обозначение мягкой принадлежности для сидения или возлежания естественно передаётся как «подушка».
- source_word: λεντίον ... λινόῦν καρπάσιον
  choice: полотнище из тонкого льна
  rationale: «Полотнище» не сужает назначение ткани до современного полотенца, а «тонкий лён» передаёт указание на качественную льняную ткань.
- source_word: βλέπω
  choice: И вижу
  rationale: Историческое настоящее сохранено ради живости повествования.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского повествования. Синтаксис слегка упрощён для ясности, историческое настоящее «вижу» сохранено. Обращение ἀδελφοί передано инклюзивно по форме оригинала как «братья».
