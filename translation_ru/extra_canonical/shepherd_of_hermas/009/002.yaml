revisions:
- from: 'Много раз постившись и прося Господа открыть мне то откровение, которое Он обещал показать мне через ту старицу, в ту же ночь я увидел старицу, и она сказала мне: «Раз ты так нуждаешься и так стремишься узнать всё, приди на поле, где ты обычно бываешь, и около пятого часа я явлюсь тебе и покажу то, что тебе надлежит увидеть».'
  to: 'Многократно постившись и умоляя Господа открыть мне то откровение, которое Он обещал показать мне через ту пожилую женщину, именно в ту ночь я увидел, как эта пожилая женщина явилась мне и сказала: «Раз ты так во многом нуждаешься и так стремишься узнать всё, приди на поле, где ты проводишь время, и около пятого часа я явлюсь тебе и покажу то, что тебе надлежит увидеть».'
  rationale: Правка сохраняет последовательность и неоднозначности греческого текста, но точнее передаёт явление женщины (ὤφθη μοι), нейтральное обозначение πρεσβυτέρα и значение χρονίζεις. Добавление «во многом» — минимальная русская синтаксическая адаптация абсолютного ἐνδεής; оно не уточняет предмет нужды.
  reviewer_model: gpt-5.6-terra
