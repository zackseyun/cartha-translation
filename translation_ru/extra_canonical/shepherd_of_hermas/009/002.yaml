base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/002.yaml
  text: 'After fasting many times and pleading with the Lord to make known to me the revelation he had promised to show me through that aged woman, on that very night the aged woman appeared to me and said: “Since you are so needy and so eager to know everything, come to the field where you stay, and about the fifth hour I will appear to you and show you what you must see.”'
translation:
  language: ru
  text: 'Многократно постившись и умоляя Господа открыть мне то откровение, которое Он обещал показать мне через ту пожилую женщину, именно в ту ночь я увидел, как эта пожилая женщина явилась мне и сказала: «Раз ты так во многом нуждаешься и так стремишься узнать всё, приди на поле, где ты проводишь время, и около пятого часа я явлюсь тебе и покажу то, что тебе надлежит увидеть».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεηθείς τοῦ Κυρίου
  choice: прося Господа
  rationale: Передаёт молитвенную настойчивую просьбу естественным современным русским языком.
- source_word: τὴν ἀποκάλυψιν
  choice: то откровение
  rationale: Сохраняет ключевой религиозный термин и определённость конкретного обещанного видения.
- source_word: τῆς πρεσβυτέρας ἐκείνης
  choice: ту старицу
  rationale: В контексте речь идёт о ранее известной пожилой женщине; «старица» кратко сохраняет возрастной и почтительный оттенок без введения церковной должности.
- source_word: οὕτως ἐνδεὴς εἶ
  choice: ты так нуждаешься
  rationale: 'Сохраняет необычную формулировку и её неоднозначность: нужду или ощущение недостатка, не подменяя её более толковательным «так настойчив».'
- source_word: εἰς τὸν ἀγρὸν ὅπου χρονίζεις
  choice: на поле, где ты обычно бываешь
  rationale: χρονίζεις указывает на пребывание или проведение времени; такой перевод естественен и не утверждает, что Ерм там живёт.
- source_word: περὶ ὥραν πέμπτην
  choice: около пятого часа
  rationale: Сохраняет древний способ счёта часов, не превращая его без пояснения в современное время суток.
- source_word: ἃ δεῖ σε ἰδεῖν
  choice: то, что тебе надлежит увидеть
  rationale: Передаёт значение необходимости в δεῖ и сохраняет возвышенный, но понятный регистр.
theological_decisions:
- issue: Посредничество старицы в сообщении откровения
  choice: «через ту старицу»
  alternative: «посредством той старицы»
  rationale: Буквально сохраняет διὰ и роль персонажа, не уточняя богословскую природу этого посредничества.
- issue: Кто является действующим лицом в обещании и откровении
  choice: 'Сохранено: Господь обещал показать откровение через старицу, а затем она обещает явиться и показать необходимое'
  alternative: Сгладить всё до прямого откровения Господа
  rationale: Исходный текст удерживает различие между Господом и старицей; перевод не должен устранять это повествовательное напряжение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Синтаксис слегка упрощён относительно длинной греческой конструкции, но последовательность событий и повтор слова «старица» сохранены. Местоимение «Он» написано с прописной буквы в соответствии с распространённой русской издательской практикой для обозначения Господа.
