  text: And she raised me by the hand and leads me to the couch, and she says to the young men, “Go and build.”
translation:
  language: ru
  text: 'Она взяла меня за руку, подняла и подвела к скамье, а юношам сказала: «Ступайте и стройте».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξήγειρέ με τῆς χειρός
  choice: взяла меня за руку, подняла
  rationale: Передаёт действие естественно по-русски, сохраняя и жест руки, и значение глагола «подняла».
- source_word: ἄγει με
  choice: подвела
  rationale: Историческое настоящее передано совершенным прошедшим временем для связного современного русского повествования.
- source_word: συμπέλιον
  choice: скамья
  rationale: Редкое слово обозначает предмет для сидения; нейтральное «скамья» подходит контексту и не вносит излишней роскоши, возможной у слова «ложе».
- source_word: νεανίσκοις
  choice: юношам
  rationale: Прямой и стилистически достойный эквивалент для молодых мужчин из видения.
- source_word: Ὑπάγετε καὶ οἰκοδομεῖτε
  choice: Ступайте и стройте
  rationale: Сохраняет два повеления и продолжительный смысл настоящего императива «стройте».
