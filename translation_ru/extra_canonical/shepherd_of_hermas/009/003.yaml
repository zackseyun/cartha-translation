  source_fidelity: 'Смысл передан точно: Гермас спрашивает о месте в поле, получает свободу выбора, выбирает уединённое место, а старица прежде названия места обещает прийти туда, куда он пожелает. Однако «в какое место на поле?» звучит по-русски менее естественно и несколько размывает связь τόπος τοῦ ἀγροῦ («место в поле»).'
  naturalness: Текст в целом литературный и ясный. Более естественны «в каком месте поля?» и «прежде чем я заговорил с ней и назвал место»; последняя формулировка прямо передаёт два глагола λαλῆσαι и εἰπεῖν без добавочного оттенка «успел».
  terminology: «Госпожа» — уместная современная передача Κυρία как почтительного обращения. «Поле» для ἀγρός и «уединённое место» для τόπον καλὸν ἀνακεχωρηκότα точны и стилистически нейтральны.
