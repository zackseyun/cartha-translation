base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/003.yaml
  text: I asked her, saying, “Lady, to what place in the field?” “Wherever you wish,” she says. I chose a good, secluded spot. But before I spoke to her and named the place, she says to me, “I will come there where you wish.”
translation:
  language: ru
  text: 'Я спросил её: «Госпожа, в каком месте поля?» Она ответила: «Где пожелаешь». Я выбрал хорошее уединённое место. Но прежде чем я заговорил с ней и назвал место, она сказала мне: «Я приду туда, куда ты пожелаешь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κυρία
  choice: Госпожа
  rationale: Передаёт почтительное обращение к старице без излишне архаичного оттенка.
- source_word: ἀγροῦ
  choice: поле
  rationale: Прямое и естественное соответствие контекстуальному значению ἀγρός.
- source_word: τόπον καλὸν ἀνακεχωρηκότα
  choice: хорошее уединённое место
  rationale: ἀνακεχωρηκότα описывает место, удалённое от других, поэтому «уединённое» естественно передаёт смысл.
- source_word: πρὶν δὲ λαλῆσαι αὐτῇ καὶ εἰπεῖν τὸν τόπον
  choice: прежде чем я успел сказать ей и назвать это место
  rationale: Сохраняет два греческих глагольных элемента и по-русски ясно показывает, что старица заговорила раньше Гермаса.
