base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/009/009.yaml
  text: So when I wanted to sit on the right side, she did not permit me, but motioned to me with her hand that I should sit on the left side. So as I reasoned and was grieved that she had not allowed me to sit on the right side, she says to me, “Are you grieved, Hermas? The place on the right side belongs to others—those who have already pleased God and suffered for the sake of the Name; but you lack many things to sit with them. But as you remain in your simplicity, remain, and you will sit with them, as will all who do their works and endure what they also endured.”
translation:
  language: ru
  text: 'Когда же я хотел сесть справа, она не позволила мне, но рукой указала, чтобы я сел слева. Я стал размышлять и печалиться о том, что она не позволила мне сесть справа, а она сказала мне: «Ты печалишься, Ерма? Место справа принадлежит другим — тем, кто уже угодил Богу и пострадал ради Имени. Тебе же многого недостаёт, чтобы сесть вместе с ними. Но поскольку ты остаёшься в своей простоте, оставайся в ней — и сядешь вместе с ними, как и все, кто совершат такие же дела, как они, и перенесут то, что перенесли они».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τὰ δεξιὰ μέρη / εἰς τὰ ἀριστερὰ μέρη
  choice: справа / слева
  rationale: Естественно передаёт пространственное противопоставление без тяжеловесного буквального «в правых/левых местах».
- source_word: εὐαρεστηκότων τῷ θεῷ
  choice: угодил Богу
  rationale: Точно передаёт совершенный вид причастия и является ясным, современным выражением.
- source_word: εἵνεκα τοῦ ὀνόματος
  choice: ради Имени
  rationale: Сохраняет намеренную неуточнённость и раннехристианскую богословскую насыщенность слова «Имя», не добавляя отсутствующего в тексте пояснения.
- source_word: ἁπλότητί
  choice: простоте
  rationale: 'Сохраняет широкий смысл: искренность, цельность и незлобивость; более узкий вариант мог бы преждевременно разрешить смысловую неоднозначность.'
- source_word: ὑπενέγκωσιν
  choice: перенесёт
  rationale: Передаёт стойкое претерпевание страданий и сохраняет параллель с тем, что перенесли упомянутые ранее люди.
theological_decisions:
- issue: Кого обозначает «Имя»
  choice: Оставить «Имя» без поясняющего дополнения и с прописной буквы
  alternative: «ради имени [Христа]» или «ради имени Господа»
  rationale: Греческий текст содержит только τοῦ ὀνόματος. Эксплицирование референта сняло бы присущую тексту краткость и внесло бы слово, которого в источнике нет.
- issue: Связь будущего места рядом с пострадавшими с делами и терпением
  choice: Сохранить условно-наставительный ход речи без догматического пояснения
  alternative: Истолковать это как заслуживание спасения либо только как свидетельство уже имеющегося статуса
  rationale: Текст сопоставляет постоянство в простоте, сходные дела и перенесённые страдания; перевод не должен разрешать эту богословскую напряжённость за автора.
- issue: Повтор глагола μένω
  choice: «остаёшься… оставайся в ней»
  alternative: 'Сгладить повтор: «продолжай хранить свою простоту»'
  rationale: Повтор значим для увещевания и подчёркивает постоянство, хотя местоимение «в ней» добавлено по нормам русского языка для ясности.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского видения. Синтаксис умеренно упрощён ради ясности, но сохранены повтор, обращение и богословски значимые формулы. Форма имени «Ерма» выбрана как традиционная русская передача Ἑρμᾶς.
