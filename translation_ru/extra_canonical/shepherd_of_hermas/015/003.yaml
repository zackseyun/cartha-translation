base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/003.yaml
  text: And those others that fall near the waters yet are not able to roll into the water—do you want to know who they are? These are the ones who have heard the word and want to be baptized into the name of the Lord; then, when the purity of the truth comes to their remembrance, they repent and go back again after their evil desires.
translation:
  language: ru
  text: А те другие, что падают возле воды, но не могут скатиться в воду, — хочешь знать, кто они? Это те, кто услышал слово и хочет креститься во имя Господа; но затем, когда им приходит на память чистота истины, они отказываются от этого намерения и снова идут вслед за своими злыми желаниями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγὺς τῶν ὑδάτων
  choice: у самой воды
  rationale: Естественно передаёт близость к воде; множественное число в греческом допускает собирательное русское «вода» в данном образе.
- source_word: κυλισθῆναι
  choice: скатиться
  rationale: Сохраняет образ камней, которые должны перекатиться или скатиться в воду.
- source_word: τὸν λόγον
  choice: слово
  rationale: Сохраняет краткость и возможную многозначность λόγος без поясняющей вставки.
- source_word: βαπτισθῆναι εἰς τὸ ὄνομα τοῦ Κυρίου
  choice: креститься во имя Господа
  rationale: Передаёт раннехристианскую формулу естественным и привычным русским выражением.
- source_word: ἡ ἁγνότης τῆς ἀληθείας
  choice: чистота истины
  rationale: Формально сохраняет сочетание ἁγνότης и ἀλήθεια, не сводя его лишь к нравственной строгости.
- source_word: μετανοοῦσιν
  choice: передумывают
  rationale: В контексте речь идёт не о положительном покаянии, а об отказе от намерения креститься при осознании требуемой чистоты; «передумывают» ясно передаёт контекстуальный смысл.
- source_word: πορεύονται πάλιν ὀπίσω τῶν ἐπιθυμιῶν αὐτῶν τῶν πονηρῶν
  choice: снова идут вслед за своими злыми желаниями
  rationale: Сохраняет метафору следования за желаниями и отрицательную характеристику πονηρός.
theological_decisions:
- issue: Значение μετανοοῦσιν в отрицательном контексте
  choice: передумывают
  alternative: раскаиваются
  rationale: Обычное богословское значение «каются» здесь способно ошибочно представить их реакцию как обращение к Богу, тогда как следующая фраза показывает возвращение к злым желаниям. Перевод сохраняет контекстуальный поворот без догматического истолкования.
- issue: Формула крещения εἰς τὸ ὄνομα
  choice: во имя Господа
  alternative: в имя Господа
  rationale: «Во имя» — современная литературная и церковно узнаваемая русская формула; она не уточняет способ или богословие крещения сверх греческого текста.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Сохранён развернутый вопрос и образ камней; синтаксис слегка упрощён для ясности, без устранения богословской напряжённости.
