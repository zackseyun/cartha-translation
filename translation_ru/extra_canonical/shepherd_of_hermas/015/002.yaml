base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/002.yaml
  text: But those that fall into the fire and are burned—these are the ones who have finally turned away from the living God, and it no longer came up into their heart to repent because of the desires of their lewdness and the evils they have done.
translation:
  language: ru
  text: А те, что падают в огонь и горят, — это окончательно отступившие от живого Бога. Из-за своих распутных желаний и злых дел, которые они совершили, им уже не приходило на сердце покаяться.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τέλος ἀποστάντες
  choice: окончательно отступившие
  rationale: Передаёт как значение полного, окончательного отпадения, так и прямую связь причастия с образом отступления от Бога.
- source_word: τοῦ Θεοῦ τοῦ ζῶντος
  choice: от живого Бога
  rationale: Естественная и традиционно узнаваемая передача греческого выражения без конфессионального уточнения.
- source_word: οὐκέτι αὐτοῖς ἀνέβη ἐπὶ τὴν καρδίαν
  choice: им уже не пришло на сердце
  rationale: Сохраняет семитизированный образ исходного текста и остаётся понятным в современном литературном русском.
- source_word: ἐπιθυμίας τῆς ἀσελγείας αὐτῶν
  choice: их распутных желаний
  rationale: Передаёт ἀσέλγεια как нравственную распущенность, а не сужает значение исключительно до одного вида сексуального проступка.
- source_word: τῶν πονηριῶν ὧν εἰργάσαντο
  choice: злых дел, которые они совершили
  rationale: Контекстуально раскрывает абстрактное множественное πονηριῶν через совершённые злые поступки, сохраняя смысл глагола εἰργάσαντο.
theological_decisions:
- issue: Характер отступления от Бога
  choice: окончательно отступившие
  alternative: до конца отступившие
  rationale: Формулировка сохраняет силу εἰς τέλος и не добавляет учения о невозможности последующего покаяния сверх того, что прямо утверждает данный контекст.
- issue: Причинная связь с отсутствием покаяния
  choice: не пришло на сердце покаяться из-за их распутных желаний и злых дел
  alternative: они уже не помышляли о покаянии по причине своих похотей и злодейств
  rationale: Сохранена причинная конструкция διά и образ сердца; не уточняется, было ли покаяние объективно невозможно или субъективно не возникло в сердце.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Образ «пришло на сердце» сохранён намеренно; синтаксис слегка упрощён для ясного чтения вслух.
