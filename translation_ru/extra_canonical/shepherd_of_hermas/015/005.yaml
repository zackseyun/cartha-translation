base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/005.yaml
  text: Rather, they will fit in another place, much smaller; and this will be when they have been tormented and have completed the days of their sins. And for this reason they will be transferred, because they have shared in the word of the righteous one. And then it will happen that they are transferred from their torments, if the evil deeds they have done come up into their heart. But if they do not come up into their heart, they are not saved because of their hardness of heart.”
translation:
  language: ru
  text: Но они будут помещены в другом месте, гораздо меньшем; это произойдёт, когда они претерпят мучения и отбудут срок за свои грехи. Потому они будут перемещены, что приобщились к слову Праведного.[a] И тогда случится, что они будут перенесены из своих мучений, если совершённые ими злые дела придут им на сердце.[b] Если же они не придут им на сердце, то из-за своего жестокосердия они не спасутся».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «к праведному слову». Греческая форма допускает понимание «Праведного» как обозначения лица и «праведного» как характеристики слова.'
    reason: Сохраняет грамматическую неоднозначность τοῦ ῥήματος τοῦ δικαίου, не подменяя её не соответствующим форме вариантом «слово праведности».
  - marker: b
    text: 'Буквально: «если взойдут на их сердце злые дела, которые они совершили»; то есть если эти дела станут предметом их внутреннего осознания.'
    reason: Поясняет непривычную идиому, не сводя её к более узко определённой форме покаяния.
lexical_decisions:
- source_word: ἑτέρῳ δὲ τόπῳ ἁρμόσουσιν πολὺ ἐλάττονι
  choice: Но они займут другое место, гораздо меньшее
  rationale: ἁρμόζω продолжает образ камней, пригодных для определённого места в постройке; по-русски «займут место» естественно передаёт этот образ без неясного «будут подогнаны».
- source_word: βασανισθῶσιν
  choice: пройдут мучения
  rationale: Страдательная форма обозначает подвергание мучению или испытанию; «пройдут мучения» сохраняет тяжесть смысла и звучит естественно.
- source_word: ἐκπληρώσωσιν τὰς ἡμέρας τῶν ἁμαρτιῶν αὐτῶν
  choice: исполнятся дни их грехов
  rationale: Сохранён временной образ оригинала и его неоднозначность относительно срока последствий греха.
- source_word: μετέλαβον
  choice: приобщились
  rationale: Передаёт участие или получение доли, не сводя выражение лишь к слушанию.
- source_word: τοῦ ῥήματος τοῦ δικαίου
  choice: к слову Праведного
  rationale: Родительный τοῦ δικαίου допускает личное понимание — «Праведного»; капитализация обозначает вероятную титульную функцию, а примечание сохраняет грамматическую неоднозначность.
- source_word: μετατεθῆναι ἐκ τῶν βασάνων αὐτῶν
  choice: будут избавлены от своих мучений
  rationale: Буквально речь о перемещении из мучений; «избавлены» ясно передаёт исход из этого состояния, тогда как предыдущее «перемещены» уже сохраняет пространственный мотив.
- source_word: ἀναβῇ ἐπὶ τὴν καρδίαν
  choice: придут им на сердце
  rationale: 'Сохранена семитизированная идиома текста: поступки должны войти в сознание и вызвать нравственное осознание.'
- source_word: σκληροκαρδίαν
  choice: жестокосердия
  rationale: Традиционный и понятный русский эквивалент, сохраняющий образ ожесточённого сердца.
theological_decisions:
- issue: Характер посмертных мучений и возможность последующего спасения
  choice: Передать последовательность буквально, не определяя природу, длительность или догматический статус мучений
  alternative: Истолковать их как чистилище, временное наказание либо земное испытание
  rationale: Текст говорит о мучениях, перемещении и спасении, но сам не даёт систематического объяснения; перевод не должен импортировать позднейшую конфессиональную схему.
- issue: Условие избавления
  choice: Сохранить условное «если» и образ прихода злых дел на сердце
  alternative: Разъяснить как полное покаяние или исповедание конкретных грехов
  rationale: Контекст связывает выражение с покаянием, но данная фраза подчёркивает внутреннее осознание; конкретизацию лучше не вносить в основной текст.
- issue: Личность «Праведного»
  choice: Использовать титульное «Праведного» с примечанием об альтернативе
  alternative: 'Перевести безлично: «праведного слова»'
  rationale: Греческое сочетание грамматически допускает оба прочтения; личное понимание хорошо согласуется с артиклем и раннехристианским употреблением, но неоднозначность следует обозначить.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского назидательного текста. Сохранены строительный и сердечный образы, повтор «мучения», условность спасения и напряжение между наказанием, осознанием греха и возможным перемещением. Архаизмы ограничены естественными для религиозной прозы словами «приобщились» и «жестокосердие».
