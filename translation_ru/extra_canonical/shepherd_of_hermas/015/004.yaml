base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/004.yaml
  text: So she finished the explanation of the tower. But, becoming bold again, I questioned her further whether all these stones that were cast away and did not fit into the building of the tower—whether there is repentance for them and whether they have a place in this tower. “They have repentance,” she says, “but they cannot fit into this tower.
translation:
  language: ru
  text: Так она закончила объяснение башни. Я же, снова осмелев, спросил её, есть ли покаяние для всех этих камней, которые были отброшены и не годятся для постройки башни, и найдётся ли им место в этой башне. «Для них есть покаяние, — сказала она, — но в эту башню они не могут быть встроены».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναιδευσάμενος
  choice: снова осмелев
  rationale: В данном контексте причастие обозначает, что рассказчик вновь набрался дерзновения продолжить расспросы; буквальное «став бесстыдным» в современном русском создало бы неверную нравственную окраску.
- source_word: ἀποβεβλημένοι
  choice: были отброшены
  rationale: Сохраняет образ камней, удалённых из строительства, и пассивную форму греческого текста.
- source_word: μὴ ἁρμόζοντες εἰς τὴν οἰκοδομήν
  choice: не подошли для строительства
  rationale: Передаёт значение непригодности или несоответствия камней строению без излишне технической лексики.
- source_word: ἔχουσιν μετάνοιαν
  choice: для них есть покаяние
  rationale: Сохраняет необычную, но значимую формулировку источника и не сводит её однозначно ни к способности, ни к предоставленной возможности покаяться.
- source_word: οὐ δύνανται ἁρμόσαι
  choice: не могут быть встроены
  rationale: Передаёт строительную метафору — камни не могут быть присоединены к данной башне — естественным современным русским выражением.
theological_decisions:
- issue: Смысл выражения «есть покаяние»
  choice: Сохранена формула «для них есть покаяние»
  alternative: «они могут покаяться» / «у них есть возможность покаяться»
  rationale: Греческое ἔχουσιν μετάνοιαν допускает оттенки возможности, доступности или действенности покаяния. Более разъясняющий перевод преждевременно устранил бы эту неоднозначность.
- issue: Отношение покаяния к месту в башне
  choice: Покаяние утверждается, но возможность быть встроенными именно в эту башню отрицается
  alternative: Связать покаяние с гарантированным возвращением в башню
  rationale: Текст намеренно удерживает напряжение между доступностью покаяния и невозможностью войти в эту конкретную постройку; оно сохранено без догматического истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Сохранена развёрнутая строительная метафора и повтор слова «башня»; синтаксис слегка упрощён для ясности, без устранения смысловой напряжённости.
