revisions:
- from: Так она закончила объяснение башни. Я же, снова осмелев, спросил её, есть ли покаяние для всех этих камней, которые были отброшены и не подошли для строительства башни, и найдётся ли им место в этой башне. «Для них есть покаяние, — сказала она, — но в эту башню они не могут быть встроены».
  to: Так она закончила объяснение башни. Я же, снова осмелев, спросил её, есть ли покаяние для всех этих камней, которые были отброшены и не годятся для постройки башни, и найдётся ли им место в этой башне. «Для них есть покаяние, — сказала она, — но в эту башню они не могут быть встроены».
