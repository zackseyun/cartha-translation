revisions:
- from: А другие камни, которые, как ты видел, отбрасывали далеко от башни и которые падали на дорогу, а с дороги скатывались в непроходимые места, — это уверовавшие, но из-за своей раздвоенности они оставляют свой истинный путь. Думая, что смогут найти путь лучше, они сбиваются с дороги и бедствуют, блуждая по непроходимым местам.
  to: А другие камни, которые, как ты видел, были отброшены далеко от башни, падали на дорогу, а с дороги скатывались в бездорожные места, — это уверовавшие, но из-за своей внутренней раздвоенности они оставляют свой истинный путь. Полагая, что смогут найти лучший путь, они сбиваются с дороги и бедствуют, блуждая по бездорожным местам.
  rationale: Исправлен страдательный залог при ῥιπτομένους; «непроходимые места» заменено на «бездорожные места», чтобы точнее передать ἀνοδίαι. Смысл, образность и неопределённость оригинала сохранены; дополнительные сноски не нужны.
