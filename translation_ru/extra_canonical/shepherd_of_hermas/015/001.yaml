base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/015/001.yaml
  text: 'As for the other stones that you saw thrown far from the tower and falling into the road and rolling from the road into the pathless places: these are those who have believed, but because of their double‑mindedness they abandon their true road. Thinking, then, that they are able to find a better road, they go astray and suffer misery as they walk in the pathless places.'
translation:
  language: ru
  text: А другие камни, которые, как ты видел, были отброшены далеко от башни, падали на дорогу, а с дороги скатывались в бездорожные места, — это уверовавшие, но из-за своей внутренней раздвоенности они оставляют свой истинный путь. Полагая, что смогут найти лучший путь, они сбиваются с дороги и бедствуют, блуждая по бездорожным местам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία
  choice: раздвоенность
  rationale: Передаёт внутреннюю неустойчивость и колебание между двумя направлениями, сохраняя образ «раздвоенной души» без громоздкой буквальности.
- source_word: ἀνοδίαι
  choice: непроходимые места
  rationale: Слово обозначает бездорожье, места без пути; такой перевод естественно поддерживает развёрнутый образ дороги и блуждания.
- source_word: πλανῶνται
  choice: сбиваются с дороги
  rationale: В данном дорожном образе это конкретнее и естественнее общего «заблуждаются», при этом сохраняется переносный смысл.
- source_word: ταλαιπωροῦσιν
  choice: бедствуют
  rationale: Передаёт страдание, тяготы и жалкое положение заблудившихся без излишней экспрессии.
theological_decisions:
- issue: Статус изображённых камнями людей
  choice: «уверовавшие»
  alternative: «верующие»
  rationale: Перфект πεπιστευκότες указывает на состоявшееся принятие веры, тогда как дальнейший текст подчёркивает последующее оставление истинного пути.
- issue: Причина оставления пути
  choice: «из-за своей раздвоенности»
  alternative: «из-за своих сомнений»
  rationale: Сохранён более широкий смысл διψυχία — внутренняя двойственность и непостоянство, а не только интеллектуальное сомнение.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского назидательного текста. Сохранена последовательность пространственных образов: башня — дорога — непроходимые места. Повтор слова «путь/дорога» слегка варьирован по-русски для естественности, при этом смысловая связь не утрачена.'
