base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/006.yaml
  text: But those who are complete in faith ask for all things, having put their trust in the Lord, and they receive, because they ask without doubting, not being at all double-minded. For every double-minded man, unless he repents, will be saved with difficulty.
translation:
  language: ru
  text: Те же, кто вполне твёрды в вере, просят обо всём, уповая на Господа, и получают, потому что просят без колебаний, не допуская в себе никакого двоедушия. Ведь всякому двоедушному человеку, если он не покается, будет трудно спастись.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁλοτελεῖς ὄντες ἐν τῇ πίστει
  choice: кто целостен в вере
  rationale: Передаёт идею полноты и цельности веры, не усиливая выражение до спорного «совершенны».
- source_word: πεποιθότες ἐπὶ τὸν κύριον
  choice: уповая на Господа
  rationale: Естественно передаёт совершенное причастие со значением утвердившегося доверия.
- source_word: ἀδιστάκτως
  choice: без сомнения
  rationale: Передаёт отсутствие колебания в контексте молитвенной просьбы.
- source_word: μηδὲν διψυχοῦντες
  choice: нисколько не двоедушничают
  rationale: Сохраняет ключевой для всего наставления образ внутренней раздвоенности и связь с δίψυχος.
- source_word: δυσκόλως σωθήσεται
  choice: трудно будет спастись
  rationale: Формально сохраняет будущее время, пассивную форму и наречие «с трудом», не подменяя их утверждением о невозможности спасения.
theological_decisions:
- issue: Объём обещания πάντα αἰτοῦνται ... καὶ λαμβάνουσιν
  choice: просят обо всём ... и получают
  alternative: просят всё ... и всё получают
  rationale: Сохранена широкая формулировка оригинала, но без добавления второго «всё» при глаголе «получают», которого в соответствующей греческой части нет.
- issue: Спасение двоедушного человека
  choice: если он не покается, трудно будет спастись
  alternative: если не покается, едва спасётся
  rationale: Перевод сохраняет условность и реальную трудность, не превращая высказывание ни в безусловное осуждение, ни в уверенное обещание спасения.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Термин «двоедушный» сохранён как важный повторяющийся образ разделённой верности; синтаксис сделан ясным для обычного читателя.
