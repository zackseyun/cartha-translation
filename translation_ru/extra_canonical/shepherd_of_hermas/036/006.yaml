revisions:
- from: Те же, кто целостен в вере, просят обо всём, уповая на Господа, и получают, потому что просят без сомнения и нисколько не двоедушничают. Ведь всякому двоедушному человеку, если он не покается, трудно будет спастись.
  to: Те же, кто вполне твёрды в вере, просят обо всём, уповая на Господа, и получают, потому что просят без колебаний, не допуская в себе никакого двоедушия. Ведь всякому двоедушному человеку, если он не покается, будет трудно спастись.
  rationale: Внесены только стилистические правки. «Вполне твёрды в вере» передаёт ὁλοτελεῖς ὄντες ἐν τῇ πίστει без навязывания более сильного термина «совершенны». Повтор «двоедушия» сохранён, поскольку он принципиален для аргумента данного раздела. «Будет трудно спастись» естественно выражает δυσκόλως σωθήσεται и не ослабляет ни условие покаяния, ни пассивно-эсхатологическую перспективу оригинала.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:49:57Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан точно: полнота/цельность веры, доверие Господу, прошение без колебаний, противопоставление двоедушию и условное «с трудом спасётся» сохранены. Небольшая правка нужна ради более естественного русского выражения ключевой характеристики и конструкции заключительной фразы.'
  naturalness: «Целостен в вере» и особенно «не двоедушничают» понятны, но звучат несколько искусственно для современного литературного русского. «Твёрды в вере» и «не допуская в себе двоедушия» естественнее, при этом повтор ключевого понятия сохраняется.
  terminology: «Господь», «вера», «покаяться» и «спастись» уместны. «Двоедушие / двоедушный» следует сохранить как сквозной термин данного наставления; глагольная форма «двоедушничать» не нужна.
  issues:
  - severity: low
    issue: Не вполне естественная передача ὁλοτελεῖς ὄντες ἐν τῇ πίστει
    rationale: «Целостен в вере» калькирует образ, но в русском воспринимается как необычная психологическая характеристика. «Вполне твёрды в вере» ясно передаёт полноту и устойчивость веры в данном контексте.
  - severity: medium
    issue: Глагол «двоедушничают»
    rationale: Это стилистически неудачный и малоупотребительный неологизм. Оборот «не допуская в себе двоедушия» сохраняет точную терминологическую связь с δίψυχος и звучит литературно.
  - severity: low
    issue: Порядок слов в заключительной фразе
    rationale: «Всякому двоедушному человеку ... трудно будет спастись» лучше перестроить как «всякому ... будет трудно спастись»; условность греческого ἐὰν μὴ μετανοήσῃ при этом не меняется.
  revised_text: Те же, кто вполне твёрды в вере, просят обо всём, уповая на Господа, и получают, потому что просят без колебаний, не допуская в себе никакого двоедушия. Ведь всякому двоедушному человеку, если он не покается, будет трудно спастись.
