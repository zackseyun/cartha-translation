base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/001.yaml
  text: 'He says to me: Remove double-mindedness from yourself, and do not at all be double-minded when asking anything from God, saying within yourself, “How am I able to ask from the Lord and receive, I who have sinned so much against him?”'
translation:
  language: ru
  text: 'Он говорит мне: «Избавься от двоедушия и, прося чего-либо у Бога, нисколько не сомневайся, говоря про себя: “Как могу я просить у Господа и получить, если я столько согрешил против Него?”»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχίαν / διψυχήσῃς
  choice: двоедушие / сомневаться
  rationale: Существительное передано традиционным и образным словом «двоедушие», а глагол — естественным русским «сомневаться» в контексте молитвенной просьбы; связь понятий сохраняется по смыслу.
- source_word: αἰτήσασθαί τι παρὰ τοῦ θεοῦ
  choice: прося чего-либо у Бога
  rationale: Передаёт просьбу, обращённую к Богу, без лишнего уточнения её содержания.
- source_word: ἡμαρτηκὼς τοσαῦτα εἰς αὐτόν
  choice: если я столько согрешил против Него
  rationale: Причастный оборот естественно развёрнут как условно-причинная конструкция; εἰς αὐτόν передано как «против Него».
theological_decisions:
- issue: Соотношение двоедушия и сомнения
  choice: Сохранить «двоедушие» как название состояния, но глагольную форму передать «сомневаться».
  alternative: В обоих случаях использовать однокоренные «двоедушие / быть двоедушным».
  rationale: Греческий повтор важен, однако буквальное «не будь двоедушным, прося» звучит в современном русском тяжеловесно. Выбранная формулировка сохраняет богословскую связь двоедушия с сомнением при молитве.
- issue: Основание внутреннего сомнения
  choice: «если я столько согрешил против Него»
  alternative: «согрешивший столько против Него»
  rationale: Не добавляет учения о невозможности прощения или недостоинстве молитвы, а лишь точно передаёт внутренний вопрос говорящего.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Прямая речь и внутренний вопрос оформлены ясно; архаизмы и конфессионально маркированная лексика не добавлены.
