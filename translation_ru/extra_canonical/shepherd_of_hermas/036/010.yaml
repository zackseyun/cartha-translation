base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/010.yaml
  text: Therefore despise double-mindedness and master it in every matter, having put on the strong and mighty faith. For faith promises all things and accomplishes all things, but double-mindedness, because it does not trust, fails in all the works that it does.
translation:
  language: ru
  text: Итак, презирай двоедушие и господствуй над ним во всяком деле, облекшись в крепкую и могущественную веру. Ведь вера всё обещает и всё доводит до конца, а двоедушие, не доверяя самому себе, терпит неудачу во всех делах, за которые берётся.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία
  choice: двоедушие
  rationale: Сохраняет характерный для раннехристианского текста образ внутренней раздвоенности и колебания, не сводя его лишь к сомнению.
- source_word: κατακυρίευσον
  choice: господствуй над ним
  rationale: Передаёт сильное значение овладения и установления власти над двоедушием.
- source_word: ἐν παντὶ πράγματι
  choice: во всяком деле
  rationale: Естественно передаёт широкий практический охват выражения.
- source_word: ἐνδυσάμενος
  choice: облекшись
  rationale: Сохраняет метафору надевания веры как одежды.
- source_word: ἰσχυρὰν καὶ δυνατήν
  choice: крепкую и могущественную
  rationale: Воспроизводит два близких, но не полностью тождественных определения силы веры.
- source_word: ἐπαγγέλλεται
  choice: обещает
  rationale: Прямо сохраняет семантику обещания, не подменяя её толкованием вроде «даёт уверенность».
- source_word: τελειοῖ
  choice: доводит до конца
  rationale: Передаёт совершение и завершение, звуча естественнее буквального «совершает всё» в данном противопоставлении.
- source_word: μὴ καταπιστεύουσα ἑαυτῇ
  choice: не доверяя самому себе
  rationale: Сохраняет необычную рефлексивную конструкцию греческого текста и её возможное указание на внутреннюю неуверенность двоедушия.
- source_word: ἀποτυγχάνει
  choice: терпит неудачу
  rationale: Передаёт провал и недостижение цели.
theological_decisions:
- issue: Всеобъемлющие утверждения о вере
  choice: Сохранены формулы «всё обещает» и «всё доводит до конца».
  alternative: 'Ограничить их контекстом молитвенных прошений: «обещает исполнение всего и всё исполняет».'
  rationale: Греческий текст намеренно выражен абсолютно; перевод не должен заранее разрешать богословское напряжение или сужать смысл.
- issue: Персонификация веры и двоедушия
  choice: Сохранена как свойство риторики оригинала.
  alternative: 'Перевести через состояние верующего: «верующий достигает… сомневающийся терпит неудачу».'
  rationale: Оригинал представляет веру и двоедушие как действующих субъектов; замена ими людей была бы интерпретацией.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Сохранены повелительный тон, метафора облачения и персонификация абстрактных сил; архаизм «двоедушие» оправдан ключевой терминологией раздела и понятен из контекста.
