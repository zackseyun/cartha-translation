revisions:
- from: Итак, очисти своё сердце от всей суеты этого века и от того, о чём тебе было сказано прежде, и проси у Господа — и получишь всё; ни в одной из своих просьб ты не останешься без ответа, если будешь просить у Господа без сомнения.
  to: Итак, очисти своё сердце от всей суеты этого века и от слов, сказанных тебе прежде, и проси у Господа — и получишь всё; ни одна из твоих просьб не останется без исполнения, если будешь просить у Господа без колебаний.
  rationale: Уточнены два места, где черновик интерпретировал и частично смягчал исходную формулировку. «Слова, сказанные тебе прежде» сохраняет лексическую конкретность ῥημάτων и не снимает присущую фразе контекстуальную трудность. «Ни одна из твоих просьб не останется без исполнения» передаёт отсутствие недостатка применительно к просьбам, не добавляя идею простого ответа. Остальной текст сохранён.
  reviewer_model: gpt-5.6-terra
