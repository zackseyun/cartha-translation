base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/004.yaml
  text: Therefore cleanse your heart from all the vanities of this age and from the words previously spoken to you, and ask from the Lord; and you will receive everything, and you will lack nothing in any of your petitions, if you ask from the Lord without doubting.
translation:
  language: ru
  text: Итак, очисти своё сердце от всей суеты этого века и от слов, сказанных тебе прежде, и проси у Господа — и получишь всё; ни одна из твоих просьб не останется без исполнения, если будешь просить у Господа без колебаний.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ματαιωμάτων
  choice: суеты
  rationale: Передаёт пустое, тщетное и отвлекающее содержание земных забот; естественно звучит в современном литературном русском.
- source_word: τοῦ αἰῶνος τούτου
  choice: этого века
  rationale: Сохраняет раннехристианское обозначение нынешнего мирового порядка, не сужая его до одной эпохи или человеческой жизни.
- source_word: τῶν προειρημένων σοί ῥημάτων
  choice: того, о чём тебе было сказано прежде
  rationale: По контексту речь идёт о ранее высказанных наставлениях или предметах предшествующей речи; нейтральная формулировка сохраняет некоторую неясность греческого выражения.
- source_word: ἀπολήψῃ
  choice: получишь
  rationale: Прямое и естественное соответствие обещанию получить просимое.
- source_word: ἀνυστέρητος ἔσῃ
  choice: не останешься без ответа
  rationale: Передаёт смысл отсутствия недостатка в отношении просьб без неестественной буквальности «не будешь лишён».
- source_word: ἀδιστάκτως
  choice: без сомнения
  rationale: Передаёт отсутствие внутреннего колебания и сомнения, центральное для всего наставления.
theological_decisions:
- issue: Безусловность обещания получить просимое
  choice: Сохранено сильное обещание текста с прямо названным условием — просить без сомнения.
  alternative: Ограничить обещание формулой «получишь всё угодное Богу».
  rationale: Такого явного ограничения в данном стихе нет; добавление разрешило бы богословское напряжение за автора.
- issue: Значение выражения о ранее сказанных словах
  choice: Использована нейтральная формулировка «то, о чём тебе было сказано прежде».
  alternative: Понять это как повеление очиститься от самих наставлений или, напротив, только от названных ранее пороков.
  rationale: Греческая конструкция допускает контекстуальную трудность; перевод не должен уверенно навязывать одну интерпретацию.
translation_notes:
  register: Современный литературный русский с наставительным и dignified тоном. Синтаксис слегка приподнят, но понятен обычному читателю; местоимение «своё» и глагольные формы второго лица сохраняют личное обращение.
