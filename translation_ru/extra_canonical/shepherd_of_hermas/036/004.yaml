review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан верно: повеление очистить сердце, просить Господа без колебаний и обещание получить просимое сохранены. Однако «то, о чём тебе было сказано прежде» слишком далеко от конкретного ῥημάτων («слов»), а «не останешься без ответа» подменяет отсутствие недостатка в просьбах идеей ответа, который не обязательно означает исполнение.'
  naturalness: Текст звучит естественно и сохраняет наставительный, литературный тон. Прямая передача «слов, сказанных тебе прежде» несколько напряжённа по-русски, но отражает столь же контекстуально трудную греческую конструкцию и предпочтительнее поясняющего пересказа.
  terminology: «Суета этого века» удачно передаёт ματαιώματα τοῦ αἰῶνος τούτου в традиционно понятном, но современно читаемом виде. «Без сомнения» адекватно передаёт ἀδιστάκτως; «без колебаний» точнее акцентирует внутреннюю нераздвоенность и хорошо соответствует ближайшему контексту διψυχία.
  issues:
  - severity: medium
    issue: Перевод τῶν προειρημένων σοί ῥημάτων
    rationale: Формулировка «того, о чём тебе было сказано прежде» заменяет «слова, сказанные тебе прежде» неопределённым содержательным пересказом. Следует сохранить «слова», не решая за текст, что именно имеется в виду.
  - severity: medium
    issue: Перевод ἀνυστέρητος ἔσῃ
    rationale: «Не останешься без ответа» вносит понятие ответа на молитву, тогда как греческое выражение говорит о том, что ни одна просьба не останется без исполнения/не будет без результата. Это особенно важно рядом с прямым обещанием получения.
  revised_text: Итак, очисти своё сердце от всей суеты этого века и от слов, сказанных тебе прежде, и проси у Господа — и получишь всё; ни одна из твоих просьб не останется без исполнения, если будешь просить у Господа без колебаний.
