  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/008.yaml
  text: So do not cease asking for the request of your soul, and you will receive it. But if you grow weary and become double-minded while asking, blame yourself and not the one who gives to you.
translation:
  language: ru
  text: Поэтому не переставай просить о том, чего желает твоя душа, — и получишь это. Если же, прося, ты падёшь духом и станешь сомневаться, вини себя, а не Дарующего тебе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ διαλίπῃς αἰτούμενος
  choice: не переставай просить
  rationale: Передаёт продолжительное, настойчивое прошение естественным современным русским языком.
- source_word: τὸ αἴτημα τῆς ψυχῆς σου
  choice: о желании своей души / желаемое
  rationale: Буквально речь о прошении души; «желание своей души» сохраняет личный и внутренний характер просьбы, а «желаемое» во втором упоминании избегает тяжёлого повтора.
- source_word: ἐκκακήσῃς
  choice: падёшь духом
  rationale: Глагол означает изнемочь, отчаяться или утратить решимость; «пасть духом» здесь естественно связано с утомлением от ожидания ответа.
- source_word: διψυχήσῃς
  choice: начнёшь сомневаться
  rationale: В данном наставлении δίψυχος обозначает внутреннюю раздвоенность и колебание в доверии Богу; русское «сомневаться» ясно передаёт смысл в контексте молитвы.
- source_word: τὸν διδόντα σοι
  choice: Того, кто даёт тебе
  rationale: Субстантивированное причастие оставлено описательным и не заменено прямо словом «Бог», сохраняя форму и подразумеваемую отсылку оригинала.
theological_decisions:
- issue: Обещание получить просимое
  choice: «и получишь желаемое» без добавочных оговорок
  alternative: Уточнить, что будет дано лишь соответствующее Божьей воле
  rationale: Сам стих формулирует обещание прямо; богословские ограничения, отсутствующие в тексте, добавлять не следует. Контекст связывает задержку с испытанием или проступком, но не отменяет обещания.
- issue: Значение διψυχία
  choice: Передать как сомнение в процессе прошения
  alternative: «стать двоедушным» или «колебаться»
  rationale: «Двоедушный» точнее сохраняет образ, но в современной речи звучит неясно и может означать лицемерие. «Сомневаться» сохраняет центральную мысль данного контекста без конфессионального истолкования.
translation_notes:
  register: Современный литературный русский, ясный и наставительный. Сохранено прямое обращение на «ты», параллелизм двух частей и почтительное прописное «Того» как прозрачная отсылка к Богу. Синтаксис слегка разгружен без изменения смысла.
