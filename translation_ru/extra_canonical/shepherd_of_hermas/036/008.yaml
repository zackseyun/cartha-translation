  naturalness: «Просить о желании своей души» по-русски звучит неестественно и может пониматься как просьба именно о самом желании. Исправленная формулировка сохраняет возвышенно-наставительный, но современный литературный регистр.
  terminology: 'ἐκκακήσῃς передано естественным выражением «падёшь духом». Для διψυχήσῃς предпочтено «станешь сомневаться»: в контексте оно обозначает колебание в доверии при молитве, не вводя неясного для современного читателя слова «двоедушие». Субстантивированное «Дарующий тебе» сохраняет отсылку к Богу и избегает ненужного явного подстановления имени.'
