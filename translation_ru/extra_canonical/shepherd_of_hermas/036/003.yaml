base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/003.yaml
  text: For God is not like human beings who remember wrongs; rather, he does not remember wrongs, and he has compassion on what he has made.
translation:
  language: ru
  text: Ибо Бог не таков, как люди, которые злопамятны; он незлопамятен и сострадает своему творению.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μνησικακοῦντες / ἀμνησίκακος
  choice: помнят зло / не помнит зла
  rationale: Сохраняет намеренный контраст и словесный повтор греческого текста; по-русски выражение звучит естественно и передаёт как памятование об обиде, так и отсутствие злопамятности.
- source_word: σπλαγχνίζεται
  choice: сострадает
  rationale: Передаёт глубокое милосердное участие без излишне узкого конфессионального оттенка.
- source_word: τὴν ποίησιν αὐτοῦ
  choice: своему творению
  rationale: Передаёт созданное Богом как совокупное творение и сохраняет богословски ёмкую формулировку оригинала.
theological_decisions:
- issue: Смысл ἀμνησίκακος применительно к Богу
  choice: он не помнит зла
  alternative: он не держит зла / он незлопамятен
  rationale: Буквально и ясно воспроизводит противопоставление людям, «которые помнят зло», не превращая высказывание в специальное учение о природе божественного знания.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, dignified и доступная. Местоимения, относящиеся к Богу, даны со строчной буквы согласно нейтральной современной издательской норме.
