  source_fidelity: 'Смысл в целом передан точно: запрет предаваться прежним мыслям, обращение к Господу всем сердцем, просьба без колебаний, познание милосердия и обещание исполнения просьбы сохранены. Однако «ни за что не оставит» вводит разговорный оттенок и несколько меняет характер усиленного отрицания οὐ μή; более точно и литературно — «не оставит тебя».'
  naturalness: Текст естественен и понятен для современного литературного русского. Небольшая правка устраняет разговорную окраску в ключевом заверении.
