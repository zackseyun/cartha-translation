revisions:
- from: 'Не рассуждай так, но всем сердцем обратись к Господу и проси у Него без колебаний. Тогда ты познаешь Его великое милосердие: Он ни за что не оставит тебя, но исполнит прошение твоей души.'
  to: Не рассуждай так, но всем сердцем обратись к Господу и проси у Него без колебаний. Тогда ты познаешь Его великое милосердие, потому что Он не оставит тебя, но исполнит прошение твоей души.
