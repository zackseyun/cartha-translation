base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/002.yaml
  text: Do not reason about these things, but turn to the Lord with your whole heart, and ask from him without doubting; and you will come to know his great compassion, because he will certainly not abandon you, but will fulfill the request of your soul.
translation:
  language: ru
  text: Не рассуждай так, но всем сердцем обратись к Господу и проси у Него без колебаний. Тогда ты познаешь Его великое милосердие, потому что Он не оставит тебя, но исполнит прошение твоей души.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ διαλογίζου ταῦτα
  choice: Не рассуждай так
  rationale: Передаёт запрет продолжать внутренние рассуждения, изложенные в предыдущем предложении; «так» естественно связывает сегмент с контекстом.
- source_word: ἐξ ὅλης τῆς καρδίας σου ἐπίστρεψον ἐπὶ τὸν κύριον
  choice: всем сердцем обратись к Господу
  rationale: Сохраняет библейскую образность целостного обращения и направление к Господу, оставаясь естественным по-русски.
- source_word: ἀδιστάκτως
  choice: без колебаний
  rationale: В данном наставлении слово обозначает отсутствие сомневающейся нерешительности; формулировка согласуется с повторяющейся темой διψυχία, не сужая её до чисто интеллектуального сомнения.
- source_word: γνώσῃ
  choice: познаешь
  rationale: Будущая форма передана прямо; «познаешь» отражает пережитое узнавание Божьего милосердия, а не только получение сведений.
- source_word: πολλὴν εὐσπλαγχνίαν
  choice: великое милосердие
  rationale: εὐσπλαγχνία означает глубокое сострадание и милосердие; выбранное выражение естественно и достойно в русском религиозном тексте.
- source_word: οὐ μή σὲ ἐγκαταλίπῃ
  choice: Он ни за что не оставит тебя
  rationale: Усиленное греческое отрицание передано категоричным русским оборотом, сохраняющим силу заверения.
- source_word: τὸ αἴτημα τῆς ψυχῆς σου πληροφορήσει
  choice: исполнит прошение твоей души
  rationale: πληροφορήσει здесь означает довести просьбу до исполнения, удовлетворить её; сохранено необычное, но значимое выражение «прошение твоей души».
theological_decisions:
- issue: Характер обещания об исполнении просьбы
  choice: Сохранено безусловно звучащее заверение данного предложения
  alternative: Добавить условие о соответствии просьбы Божьей воле
  rationale: Сам греческий текст этого сегмента такого уточнения не содержит; его добавление разрешило бы напряжение за автора.
- issue: Объект обращения и молитвы
  choice: «к Господу» и «у Него»
  alternative: Отождествить Господа в переводе с Богом или Христом
  rationale: κύριος оставлен без дополнительной конфессиональной идентификации, поскольку данный сегмент её явно не устанавливает.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Синтаксис упрощён для ясности, при этом сохранены повелительные формы, последовательность мысли и категоричность греческого заверения.
