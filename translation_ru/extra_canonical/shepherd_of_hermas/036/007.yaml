revisions:
- from: Итак, очисти своё сердце от двоедушия и облекись в веру, ведь она сильна. Верь Богу, что получишь всё, о чём просишь. И если, попросив о чём-либо Господа, ты получишь просимое не сразу, не предавайся двоедушию из-за того, что желание твоей души исполнилось не скоро. Ведь ты получаешь просимое позднее непременно из-за какого-то испытания или проступка, о котором не знаешь.
