  terminology: «Облекись в веру», «верь Богу», «испытание» и «проступок» соответствуют греческому тексту и не навязывают дополнительной интерпретации. «Просимое» следует сохранить и во второй части стиха, где греческий вновь употребляет αἴτημα.
