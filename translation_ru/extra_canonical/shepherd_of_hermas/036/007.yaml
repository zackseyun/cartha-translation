base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/007.yaml
  text: Cleanse, then, your heart from double-mindedness, and put on faith, because it is strong, and believe God, that all your requests which you ask you will receive. And if ever, after asking some request from the Lord, you receive it more slowly, do not be double-minded because you did not quickly receive the request of your soul; for surely it is because of some testing or some transgression, which you do not know, that you receive your request more slowly.
translation:
  language: ru
  text: Итак, очисти своё сердце от двоедушия и облекись в веру, ведь она сильна. Верь Богу, что получишь всё, о чём просишь. И если, попросив однажды у Господа о чём-либо, получишь просимое не сразу, не предавайся двоедушию из-за того, что не получил сразу того, о чём просит твоя душа. Ведь ты получаешь просимое позднее непременно из-за какого-то испытания или проступка, о котором не знаешь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία / διψυχήσῃς
  choice: двоедушие / предавайся двоедушию
  rationale: Сохраняет ключевой повтор и образ внутренней раздвоенности, характерный для всего наставления; «сомнение» было бы понятнее, но сузило бы значение.
- source_word: ἔνδυσαι
  choice: облекись
  rationale: Передаёт метафору облачения и сохраняет возвышенный, но понятный библейский регистр.
- source_word: πίστευε τῷ θεῷ
  choice: верь Богу
  rationale: Передаёт дательный объект личного доверия, не сводя выражение только к вере в существование Бога.
- source_word: αἴτημα τῆς ψυχῆς σου
  choice: желание твоей души
  rationale: В данном контексте речь о просимом, которого желает душа; естественная русская формулировка избегает тяжеловесного «прошение твоей души».
- source_word: πειρασμόν
  choice: испытание
  rationale: Слово допускает также значение «искушение», но в объяснении задержки ответа нейтральное «испытание» лучше сохраняет контекстуальную открытость.
- source_word: παράπτωμά
  choice: проступок
  rationale: Передаёт нравственное прегрешение без усиления до более общего и богословски нагруженного «грех».
theological_decisions:
- issue: Обещание получить всё просимое
  choice: Сохранено прямое «получишь всё, о чём просишь» без добавочных условий.
  alternative: 'Уточнить: «получишь всё, если это угодно Богу».'
  rationale: Такого уточнения в данном предложении нет; его внесение разрешило бы напряжение текста за автора.
- issue: Причина отсрочки ответа
  choice: 'Сохранено категорическое «непременно» и две возможные причины: испытание или неизвестный проступок.'
  alternative: Смягчить до «возможно, из-за испытания или проступка».
  rationale: Греческое πάντως выражает уверенность; смягчение изменило бы утверждение автора.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Ключевые метафоры «очисти сердце» и «облекись в веру» сохранены. Термин «двоедушие» намеренно повторён как смысловой лейтмотив раздела.
