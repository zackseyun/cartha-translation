revisions:
- from: Но если ты поколеблешься в своём сердце, то ничего из просимого тобой не получишь. Ведь сомневающиеся в Боге — это люди с раздвоенной душой, и они вовсе не получают просимого.
  to: Но если ты поколеблешься в своём сердце, то ничего из того, о чём просишь, не получишь. Ведь сомневающиеся в Боге — это люди с раздвоенной душой, и они вовсе не получают того, о чём просят.
  rationale: Исправлена только неудачная русская конструкция при передаче τῶν αἰτημάτων. Повтор «о чём просишь / просят» намеренно сохраняет связь обеих частей с молитвенными просьбами и не меняет смысл текста.
