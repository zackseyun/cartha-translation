review_pass:
  verdict: revise
  source_fidelity: 'Смысл и категоричность греческого текста в целом переданы верно: διστάσῃ относится к внутреннему колебанию, οὐδὲν οὐ μὴ λήψῃ — к полному неполучению просимого, а δίψυχοι сохраняет образ внутренней раздвоенности. Однако оборот «ничего из просимого тобой» неестественен по-русски и несколько размывает связь с конкретными просьбами (αἰτήματα).'
  naturalness: Текст выдержан в современном литературном регистре. Замена «из просимого тобой» на «из того, о чём просишь» делает первую фразу идиоматичной и ясной, не снижая её торжественной наставительной интонации.
  terminology: «Люди с раздвоенной душой» — допустимая и понятная передача δίψυχοι, сохраняющая ключевой образ. «Сомневающиеся в Боге» соответствует выбранной английской линии и в данном контексте естественно выражает колебание по отношению к Богу; оно не требует доктринального уточнения предмета сомнения.
  issues:
  - severity: low
    issue: Неестественный оборот «ничего из просимого тобой».
    rationale: Русское «просимое» в такой конструкции звучит номинализованно и тяжеловесно. Греческое τῶν αἰτημάτων естественнее передать придаточным оборотом «из того, о чём просишь».
  revised_text: Но если ты поколеблешься в своём сердце, то ничего из того, о чём просишь, не получишь. Ведь сомневающиеся в Боге — это люди с раздвоенной душой, и они вовсе не получают того, о чём просят.
