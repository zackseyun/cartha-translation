base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/005.yaml
  text: But if you waver in your heart, you will by no means receive anything of your petitions. For those who doubt with respect to God—these are the double-minded—and they do not at all obtain their petitions.
translation:
  language: ru
  text: Но если ты поколеблешься в своём сердце, то ничего из того, о чём просишь, не получишь. Ведь сомневающиеся в Боге — это люди с раздвоенной душой, и они вовсе не получают того, о чём просят.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διστάσῃ / διστάζοντες
  choice: поколеблешься / сомневающиеся
  rationale: Передаёт внутреннее колебание и сомнение в контексте молитвенной просьбы; изменение русской формы позволяет избежать тяжёлого повтора.
- source_word: δίψυχοι
  choice: люди с раздвоенной душой
  rationale: Сохраняет яркий образ греческого слова, буквально обозначающего внутреннюю раздвоенность, и остаётся понятным современному читателю.
- source_word: τῶν αἰτημάτων
  choice: из просимого тобой / просимого
  rationale: Естественная русская передача прошений или просьб, обращённых к Богу, без ненужной канцелярской окраски.
- source_word: ἐπιτυγχάνουσι
  choice: получают
  rationale: В сочетании с αἰτημάτων означает достижение желаемого, получение того, о чём просили.
theological_decisions:
- issue: Направленность выражения διστάζοντες εἰς τὸν θεόν
  choice: сомневающиеся в Боге
  alternative: колеблющиеся по отношению к Богу
  rationale: Русская формулировка сохраняет направленность сомнения на Бога и не уточняет сверх текста, касается ли оно Божьей силы, благости или готовности ответить.
- issue: Категоричность двойного отрицания οὐδὲν οὐ μὴ λήψῃ
  choice: ничего ... не получишь
  alternative: ни в коем случае ничего не получишь
  rationale: Категоричность сохраняется сочетанием «ничего ... не», тогда как более развёрнутый вариант звучал бы в русском чрезмерно громоздко.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Синтаксис слегка упрощён ради ясности, а образ «раздвоенной души» сохранён как ключевой для всего наставления.
