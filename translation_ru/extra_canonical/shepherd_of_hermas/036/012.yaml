  rationale: Внесены лишь стилистические правки для современного литературного русского. Сохранены олицетворение веры и двоедушия, параллелизм «имеющей/не имеющего силы», повелительный характер наставления и намеренно не суженная передача ζήσῃ τῷ θεῷ как «будешь жить для Бога».
