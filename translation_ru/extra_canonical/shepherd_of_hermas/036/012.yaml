  text: Therefore serve faith, which has power, and keep away from double-mindedness, which has no power, and you will live to God—and all who think these things will live to God.”
translation:
  language: ru
  text: Итак, служи вере, имеющей силу, и держись в стороне от двоедушия, не имеющего силы; и будешь жить для Бога — как и все, кто так мыслит».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δούλευε
  choice: служи
  rationale: Прямо передаёт повелительное наклонение и смысл подчинения вере как госпоже, сохраняя олицетворение.
- source_word: πίστις
  choice: вера
  rationale: Обычный и контекстуально точный эквивалент; здесь вера олицетворена и противопоставлена двоедушию.
- source_word: διψυχία
  choice: двоедушие
  rationale: Сохраняет образ внутренней раздвоенности и терминологическую связь с δίψυχος; более точно, чем просто «сомнение».
- source_word: ζήσῃ τῷ θεῷ
  choice: будешь жить для Бога
  rationale: Сохраняет дательный τῷ θεῷ без чрезмерного истолкования; русское выражение естественно и допускает смысл жизни, обращённой к Богу.
- source_word: οἱ ταῦτα φρονοῦντες
  choice: мыслящие так
  rationale: Передаёт не только знание, но и внутреннюю установку; лаконично воспроизводит анафорическое ταῦτα.
theological_decisions:
- issue: Смысл выражения ζῆν τῷ θεῷ
  choice: жить для Бога
  alternative: жить в Боге / быть живым перед Богом
  rationale: Греческий дательный допускает оттенки направленности и отношения. Выбранная формулировка естественна по-русски и не навязывает более узкую мистическую или судебно-эсхатологическую трактовку.
- issue: Олицетворение веры и двоедушия
  choice: сохранено через «служи вере» и относительные конструкции
  alternative: верь твёрдо и не сомневайся
  rationale: Перефразирование устранило бы риторическое и богословское противопоставление двух сил, явно присутствующее в оригинале.
translation_notes:
  register: Современный литературный русский язык с dignified раннехристианским звучанием. Синтаксис упрощён лишь настолько, чтобы длинная греческая конструкция читалась естественно; повтор «для Бога» сохранён ради смыслового и риторического соответствия.
