  verdict: revise
  source_fidelity: 'Смысл передан в целом точно: сохранены повеление «служи», олицетворённое противопоставление веры и двоедушия, отсутствие силы у двоедушия и двукратное ζῆν τῷ θεῷ. Однако «все, мыслящие так» менее естественно передаёт οἱ ταῦτα φρονοῦντες, то есть «все, кто так мыслит / придерживается этого».'
  naturalness: «Все, мыслящие так» звучит книжно и синтаксически тяжеловесно для современного литературного русского. «Все, кто так мыслит» естественнее. «Держись вдали от» допустимо, но «держись в стороне от» лучше соответствует образному ἀπόσχου и плавнее в данном параллелизме.
  terminology: «Вера» и «двоедушие» точны и согласованы с греческими πίστις и διψυχία. «Жить для Бога» оставлено как допустимая современная передача дательного τῷ θεῷ без навязывания более узкого толкования.
