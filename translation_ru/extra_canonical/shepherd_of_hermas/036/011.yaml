base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/011.yaml
  text: “You see then,” he says, “that faith is from above, from the Lord, and it has great power; but double-mindedness is an earthly spirit from the devil, having no power.
translation:
  language: ru
  text: «Итак, видишь, — говорит он, — что вера свыше, от Господа, и обладает великой силой, а двоедушие — земной дух от дьявола, не имеющий силы».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ πίστις
  choice: вера
  rationale: Прямой и естественный эквивалент, сохраняющий ключевой термин всего наставления.
- source_word: ἄνωθεν
  choice: свыше
  rationale: Передаёт пространственный и богословский контраст с ἐπίγειον («земной»), не уточняя сверх сказанного источник происхождения.
- source_word: διψυχία
  choice: двоедушие
  rationale: Сохраняет образ внутренней раздвоенности и связь с δίψυχος в контексте; «сомнение» было бы уже и утратило бы словесный образ.
- source_word: ἐπίγειον πνεῦμα
  choice: земной дух
  rationale: Формально сохраняет противопоставление «свыше — земной» и неоднозначность слова πνεῦμα.
- source_word: δύναμις
  choice: сила
  rationale: Последовательно передаёт повтор одного греческого слова в утверждениях о вере и двоедушии.
theological_decisions:
- issue: Происхождение веры и двоедушия
  choice: «вера свыше, от Господа» и «земной дух от дьявола»
  alternative: «вера приходит с небес от Господа» и «сомнение исходит от дьявола»
  rationale: Выбранный вариант сохраняет параллелизм греческого текста и не превращает образное описание в более систематизированное утверждение.
- issue: Отсутствие силы у двоедушия
  choice: «не имеющий силы»
  alternative: «бессильный»
  rationale: Причастная конструкция точнее сохраняет форму оригинала и явный повтор δύναμις.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Синтаксис слегка выровнен для естественного чтения, при этом сохранены антитеза «свыше — земной» и повтор слова «сила».
