base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/036/009.yaml
  text: 'Look at this double-mindedness: for it is evil and senseless, and it uproots many from the faith, even those who are very faithful and strong. For this double-mindedness is a daughter of the devil, and it acts very wickedly toward the servants of God.'
translation:
  language: ru
  text: 'Посмотри на это двоедушие: оно зло и неразумно и вырывает с корнем многих из веры — даже весьма верных и стойких. Ведь это двоедушие — дочь дьявола и крайне злонамеренно действует против рабов Божьих.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διψυχία
  choice: двоедушие
  rationale: 'Сохраняет образную и нравственно-религиозную силу греческого термина: внутреннюю раздвоенность, проявляющуюся в сомнении и недостатке доверия Богу.'
- source_word: ἀσύνετος
  choice: безрассудно
  rationale: Передаёт отсутствие разумения и здравого суждения; наречная форма естественно согласуется с русской конструкцией «оно зло и безрассудно».
- source_word: ἐκριζοῖ ἀπὸ τῆς πίστεως
  choice: искореняет из веры
  rationale: Сохраняет сильную метафору вырывания с корнем и исходную связь с верой.
- source_word: λίαν πιστοὺς καὶ ἰσχυρούς
  choice: весьма верных и стойких
  rationale: «Стойких» естественно выражает силу и твёрдость людей в контексте веры, не добавляя конфессионального толкования.
- source_word: θυγάτηρ ἐστὶ τοῦ διαβόλου
  choice: дочь дьявола
  rationale: Буквально сохраняет яркую персонификацию источника двоедушия.
- source_word: λίαν πονηρεύεται εἰς
  choice: творит великое зло … рабам
  rationale: Передаёт усиленное значение злонамеренного действия против или во вред Божьим рабам естественным современным русским выражением.
theological_decisions:
- issue: Смысл διψυχία
  choice: двоедушие
  alternative: сомнение / нерешительность
  rationale: В ближайшем контексте слово включает сомнение в молитве, но персонифицировано как более широкая внутренняя раздвоенность; поэтому перевод не сужает его до одного психологического состояния.
- issue: Характер утверждения о «дочери дьявола»
  choice: сохранена буквальная персонификация
  alternative: двоедушие происходит от дьявола
  rationale: Исходный текст намеренно использует родственный образ, который не следует сглаживать в отвлечённое причинное утверждение.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Сохранены повтор «двоедушие», корневая метафора и резкая персонификация; синтаксис слегка упорядочен ради ясности для обычного читателя.
