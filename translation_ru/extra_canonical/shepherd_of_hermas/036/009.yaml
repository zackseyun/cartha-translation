    issue: Неестественная конструкция «искореняет из веры».
    rationale: ἐκριζοῖ означает «вырывает с корнем»; этот образ следует сохранить в естественной русской конструкции.
  - severity: low
    issue: «Творит великое зло рабам Божьим» неточно передаёт λίαν πονηρεύεται εἰς τοὺς δούλους τοῦ θεοῦ.
    rationale: Греческий глагол описывает крайне злонамеренное действие против Божьих рабов, а не обязательно «великое» по масштабу зло.
