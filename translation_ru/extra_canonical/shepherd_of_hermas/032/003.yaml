revisions:
- from: 'Ведь если взять немного полыни и добавить её в сосуд с мёдом, разве не пропадёт весь мёд? Даже ничтожное количество полыни портит столько мёда: оно уничтожает сладость мёда, и тот уже не так угоден своему хозяину, потому что стал горьким и утратил свою пригодность. Если же полынь не положить в мёд, мёд останется сладким и будет пригоден своему хозяину.'
  to: 'Ведь если, взяв немного полыни, добавить её в глиняный сосуд с мёдом, разве не пропадёт весь мёд? Столько мёда портится от самого малого количества полыни: она уничтожает сладость мёда, и он уже не имеет прежней ценности в глазах своего хозяина, потому что стал горьким и утратил свою пригодность. Если же полынь не положить в мёд, мёд оказывается сладким и становится пригодным для своего хозяина.'
  rationale: 'Внесены лишь безопасные уточнения, непосредственно обусловленные греческим текстом: κεράμιον передано как «глиняный сосуд», а заключительное обобщающее наблюдение — настоящим временем. Оборот о «ценности в глазах хозяина» сохраняет оценочный оттенок χάριν ἔχει, тогда как «пригодность» отдельно передаёт χρῆσις/εὔχρηστον.'
