base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/003.yaml
  text: 'For if, after taking a little wormwood, you pour it into a jar of honey, does not all the honey perish? So much honey is ruined by the smallest amount of wormwood: it destroys the sweetness of the honey, and it no longer has the same usefulness with its master, because it has been embittered and has lost its use. But if the wormwood is not cast into the honey, the honey is found sweet and becomes serviceable to its master.'
translation:
  language: ru
  text: 'Ведь если, взяв немного полыни, добавить её в глиняный сосуд с мёдом, разве не пропадёт весь мёд? Столько мёда портится от самого малого количества полыни: она уничтожает сладость мёда, и он уже не имеет прежней ценности в глазах своего хозяина, потому что стал горьким и утратил свою пригодность. Если же полынь не положить в мёд, мёд оказывается сладким и становится пригодным для своего хозяина.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀψίνθιον
  choice: полынь
  rationale: Прямой и общеупотребительный русский эквивалент, сохраняющий образ крайней горечи.
- source_word: κεράμιον μέλιτος
  choice: сосуд с мёдом
  rationale: Передаёт ёмкость, наполненную мёдом, естественно для современного русского; материал сосуда в данном сравнении несущественен.
- source_word: ἀφανίζεται / ἀπόλλυται
  choice: пропадёт / портит
  rationale: Различает риторический вопрос о мёде в целом и последующее пояснение о его порче, не подразумевая буквального исчезновения.
- source_word: χάριν ἔχει παρὰ τῷ δεσπότῃ
  choice: угоден своему хозяину
  rationale: Сохраняет личностную оценку со стороны хозяина, выраженную оборотом χάριν ἔχει παρά, и не сводит её только к утилитарной пользе.
- source_word: τὴν χρῆσιν αὐτοῦ ἀπώλεσεν / εὔχρηστον
  choice: утратил свою пригодность / будет пригоден
  rationale: Передаёт противопоставление непригодности и пригодности для употребления.
- source_word: δεσπότης
  choice: хозяин
  rationale: В бытовом сравнении обозначает владельца мёда; «господин» могло бы преждевременно придать слову явно богословское звучание.
theological_decisions:
- issue: Возможный аллегорический оттенок слова δεσπότης
  choice: хозяин
  alternative: Господь / господин
  rationale: 'В данном предложении сохраняется непосредственный уровень сравнения: речь идёт о мёде и его владельце. Богословское применение образа раскрывается в соседнем контексте, поэтому его не следует вносить в этот стих искусственно.'
translation_notes:
  register: Современный литературный русский с ясным, назидательным и образным звучанием. Риторический вопрос и повторение слова «мёд» сохранены; синтаксис слегка упрощён ради естественности без устранения логических ступеней греческого текста.
