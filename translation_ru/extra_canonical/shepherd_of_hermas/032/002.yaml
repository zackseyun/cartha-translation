base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/002.yaml
  text: But if a quick temper comes on, at once the holy spirit—being tender—is cramped, not having a clean place, and it seeks to withdraw from that place; for it is choked by the evil spirit, not having room to minister to the Lord as it desires, being defiled by the quick temper. For in long-suffering the Lord dwells, but in quick temper the devil. Therefore, when both spirits dwell together in one, it is unprofitable and harmful to that person in whom they dwell.
translation:
  language: ru
  text: 'Но если придёт гневливость, то святой дух, будучи нежным, сразу оказывается стеснённым, не имея чистого места, и стремится уйти оттуда. Ведь его душит злой дух: у него нет места служить Господу так, как он желает, потому что гневливость оскверняет его. Ибо в долготерпении обитает Господь, а в гневливости — дьявол. Поэтому, когда оба духа обитают вместе в одном человеке, это неблагоприятно и дурно для того человека, в котором они обитают.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξυχολία
  choice: гневливость
  rationale: Слово обозначает склонность быстро вспыхивать гневом, а не только отдельную вспышку; «гневливость» естественно передаёт устойчивое порочное расположение.
- source_word: τρυφερόν
  choice: чутким
  rationale: В контексте подчёркнуты тонкость и уязвимость духа; «чуткий» звучит естественнее буквального «нежный» и не вносит идеи слабости.
- source_word: στενοχωρεῖται
  choice: оказывается стеснён
  rationale: Сохраняет пространственный образ тесноты, который далее развивается словами о чистом месте и отсутствии места для служения.
- source_word: πνίγεται
  choice: душит его
  rationale: Передаёт сильный телесно-пространственный образ греческого глагола «душить, заглушать».
- source_word: μακροθυμία
  choice: долготерпение
  rationale: Передаёт стойкое терпение и сдержанность перед лицом раздражения; термин понятен в библейском нравственном контексте.
- source_word: ἀσύμφορον … καὶ πονηρόν
  choice: пагубно и вредно
  rationale: Передаёт два отрицательных определения без искусственного буквального «невыгодно и зло»; первое указывает на губительный итог, второе — на причиняемый вред.
theological_decisions:
- issue: Написание выражения τὸ πνεῦμα τὸ ἅγιον
  choice: «святой дух» со строчной буквы
  alternative: «Святой Дух»
  rationale: Греческий текст непосредственно сопоставляет святой дух с «другим злым духом» и развивает образ сосуществующих духов. Строчная буква сохраняет форму и некоторую богословскую неоднозначность древнего текста, не отрицая возможного личностного прочтения.
- issue: Образ ухода святого духа из-за гневливости
  choice: сохранить утверждение без догматического смягчения
  alternative: переформулировать как утрату ощущения присутствия или действия Духа
  rationale: Источник прямо говорит, что дух стремится покинуть место; перевод не должен заранее согласовывать это с позднейшими конфессиональными системами.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Пространственные метафоры тесноты, чистого места, удушения и совместного обитания сохранены; синтаксис слегка упрощён ради ясности, без устранения богословского напряжения.
