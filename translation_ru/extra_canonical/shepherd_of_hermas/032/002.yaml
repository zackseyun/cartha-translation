revisions:
- from: 'Но если вспыхнет гневливость, то святой дух, будучи чутким, сразу оказывается стеснён: у него уже нет чистого места, и он стремится покинуть его. Ведь злой дух душит его, так что у него нет места служить Господу, как он желает, поскольку гневливость оскверняет его. Ибо в долготерпении обитает Господь, а в гневливости — дьявол. Поэтому, когда оба духа обитают вместе, это пагубно и вредно для человека, в котором они обитают.'
