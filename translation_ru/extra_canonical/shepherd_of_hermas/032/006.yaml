base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/006.yaml
  text: For when all these spirits dwell in one vessel, the very vessel in which the holy spirit also dwells, that vessel cannot contain them; it overflows. The tender spirit, having no habit of dwelling with an evil spirit or with harshness, withdraws from such a person and seeks to dwell with gentleness and quiet. Then, when it has departed from that person in whom it dwells, that person becomes empty of the righteous spirit; and thereafter, being filled with evil spirits, he is unstable in all his deeds, dragged here and there by the evil spirits, and is altogether blinded from his good understanding. Thus it happens to all who are quick-tempered.
translation:
  language: ru
  text: 'Когда все эти духи обитают в одном сосуде — в том самом, где обитает и Святой Дух, — этот сосуд уже не может их вместить и переполняется. Поэтому нежный Дух, не привыкший обитать вместе со злым духом или с чёрствостью, удаляется от такого человека и ищет, где обитать вместе с кротостью и спокойствием. А когда Он покидает человека, в котором обитал, тот остаётся без праведного Духа. С тех пор, наполненный злыми духами, он теряет устойчивость во всех своих делах: злые духи влекут его то туда, то сюда, и он совершенно слепнет для доброго разумения. Так бывает со всеми вспыльчивыми.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκεῦος / ἄγγος
  choice: сосуд
  rationale: Сохраняет последовательный образ человека как вместилища духов и связь с предшествующим сравнением.
- source_word: τρυφερὸν πνεῦμα
  choice: чуткий Дух
  rationale: Передаёт уязвимость и несовместимость Духа с порочностью без неестественного русского «нежный дух».
- source_word: σκληρότης
  choice: жестокость
  rationale: Передаёт нравственную чёрствость и суровость, противопоставленные кротости и спокойствию.
- source_word: ἀκαταστατεῖ
  choice: становится неустойчив
  rationale: Сохраняет идею внутренней непостоянности и беспорядочности, раскрытую следующим образом метания из стороны в сторону.
- source_word: ὀξύχολοι
  choice: вспыльчивые
  rationale: Естественно передаёт людей, быстро впадающих в раздражение или гнев.
theological_decisions:
- issue: Обозначение πνεῦμα τὸ ἅγιον и последующие местоименные отсылки
  choice: «Святой Дух», «Дух», «Он» с прописной буквы
  alternative: «святой дух», «дух», «он» со строчной буквы
  rationale: В контексте Дух служит Богу и обитает в человеке; прописная буква естественно обозначает Святого Духа, не устраняя при этом образный язык о духах.
- issue: Передача πνεῦμα τοῦ δικαίου
  choice: «праведный Дух»
  alternative: «дух праведника»
  rationale: Контекст продолжает говорить о ранее названном Святом Духе; перевод сохраняет качественное значение праведности и не вводит нового человеческого обладателя духа.
- issue: Уход Духа от вспыльчивого человека
  choice: Сохранено прямое утверждение текста без догматического смягчения
  alternative: Истолковать как утрату ощущения присутствия или влияния Духа
  rationale: Источник недвусмысленно говорит, что Дух удаляется и человек остаётся без Него; перевод не разрешает возникающее богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Повторы «обитать», «дух» и образ сосуда сохранены как структурно значимые; синтаксис слегка упрощён для ясного чтения.
