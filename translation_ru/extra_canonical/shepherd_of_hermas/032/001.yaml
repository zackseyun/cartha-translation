base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/001.yaml
  text: “Be long-suffering,” he says, “and sensible, and you will gain mastery over all wicked deeds and do every work of righteousness. For if you are long-suffering, the holy spirit that dwells in you will be pure, not being darkened by another evil spirit; rather, dwelling in a wide space it will exult and rejoice with the vessel in which it dwells, and it will minister to God with much cheerfulness, having prosperity within itself.
translation:
  language: ru
  text: «Будь долготерпелив, — говорит он, — и рассудителен; тогда ты одолеешь все злые дела и будешь совершать всякое праведное дело. Ведь если ты будешь долготерпелив, то обитающий в тебе святой дух будет чистым и не будет омрачён другим, злым духом. Напротив, обитая на просторе, он будет ликовать и радоваться вместе с сосудом, в котором живёт, и с великой радостью будет служить Богу, имея в себе благополучие».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακρόθυμος / μακροθυμία
  choice: долготерпелив / долготерпение
  rationale: Передаёт устойчивость, терпение и сдержанность перед лицом раздражения; соответствует контрасту с вспыльчивостью в более широком контексте.
- source_word: συνετός
  choice: рассудителен
  rationale: Естественно передаёт значение разумности и здравого понимания без излишне интеллектуального оттенка.
- source_word: κατακυριεύσεις
  choice: одолеешь
  rationale: Сохраняет сильное значение господства и победы над злыми делами, но звучит естественно по-русски.
- source_word: ἐργάσῃ πᾶσαν δικαιοσύνην
  choice: будешь творить всякую праведность
  rationale: Сохраняет деятельный характер выражения и широкий смысл δικαιοσύνη, не сводя его только к отдельным добрым поступкам.
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: святой дух
  rationale: Строчная буква сохраняет смысловую связь и напряжение с упомянутым рядом «другим, злым духом», не навязывая позднейшую догматическую идентификацию.
- source_word: ἐν εὐρυχώρῳ
  choice: на просторе
  rationale: Передаёт буквальный образ широкого, незатеснённого пространства и естественно противопоставляется последующей тесноте.
- source_word: σκεῦος
  choice: сосуд
  rationale: Сохраняет древний метафорический образ человеческого тела или человека как вместилища духа.
- source_word: λειτουργήσει
  choice: будет служить
  rationale: Передаёт религиозное служение Богу без неоправданного сужения до храмового или литургического действия.
- source_word: εὐθηνία
  choice: благополучие
  rationale: Сохраняет редкий смысл внутреннего достатка, благосостояния или процветания; контекст не позволяет уверенно сузить его до «свободы» или «изобилия».
theological_decisions:
- issue: Идентификация «святого духа»
  choice: «святой дух» со строчной буквы
  alternative: «Святой Дух»
  rationale: Греческое выражение допускает традиционное личностное прочтение, но непосредственный контекст сопоставляет этот дух с «другим злым духом». Строчная буква сохраняет эту неоднозначность и не решает вопрос за читателя.
- issue: Состояние святого духа при долготерпении
  choice: «останется чистым»
  alternative: «будет чист»
  rationale: Добавление «останется» естественно выражает обусловленное сохраняющееся состояние, не меняя богословского содержания утверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Синтаксис слегка приподнят, но понятен обычному читателю; сохранены образы простора и сосуда, а также повтор «обитать/жить» без конфессионально окрашенной терминологии.
