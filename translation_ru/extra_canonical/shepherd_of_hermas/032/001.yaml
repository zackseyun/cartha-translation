    issue: «останется чистым» вместо «будет чистым»
    rationale: Греческое ἔσται выражает будущее состояние, не утверждая явно его сохранение от предшествующего состояния.
  - severity: low
    issue: «будешь творить всякую праведность»
    rationale: Буквально мотивированное выражение менее естественно в современном литературном русском. «Будешь совершать всякое праведное дело» передаёт ἐργάσῃ πᾶσαν δικαιοσύνην без потери смысла.
