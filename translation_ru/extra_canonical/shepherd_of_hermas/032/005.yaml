base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/005.yaml
  text: Quick temper, for its part, is first foolish—flighty and senseless. Then from senselessness comes bitterness; from bitterness, anger; from anger, wrath; and from wrath, rage. Then rage—composed of so many evils—becomes a great and incurable sin.
translation:
  language: ru
  text: Вспыльчивость прежде всего глупа, легкомысленна и неразумна. Затем из неразумия рождается горечь, из горечи — гнев, из гнева — ярость, а из ярости — неистовство. И тогда неистовство, сложившееся из стольких зол, становится великим и неизлечимым грехом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξυχολία
  choice: вспыльчивость
  rationale: Передаёт склонность быстро раздражаться и гневаться, а не единичную вспышку гнева; естественно звучит по-русски и сохраняет отличие от последующих ступеней.
- source_word: μωρά
  choice: глупа
  rationale: Прямое и ясное соответствие нравственной характеристике в греческом тексте.
- source_word: ἐλαφρά
  choice: легкомысленна
  rationale: В данном ряду слово обозначает нравственную неосновательность и ветреность, а не буквальную лёгкость.
- source_word: ἄφρων / ἀφροσύνη
  choice: неразумна / неразумие
  rationale: Сохранена лексическая связь между качеством вспыльчивости и следующей причинной ступенью.
- source_word: πικρία
  choice: горечь
  rationale: Сохраняет образное и нравственно-психологическое значение исходного слова.
- source_word: θυμός
  choice: гнев
  rationale: Выбрано как общее обозначение сильного гневного возбуждения в нарастающей последовательности.
- source_word: ὀργή
  choice: ярость
  rationale: Передаёт усиление по отношению к θυμός и поддерживает градацию.
- source_word: μῆνις
  choice: неистовство
  rationale: Передаёт крайнюю, устойчивую и разрушительную степень гнева, отличая её от θυμός и ὀργή.
- source_word: συνισταμένη
  choice: сложившееся
  rationale: Отражает мысль о конечном состоянии, образованном совокупностью перечисленных зол.
- source_word: ἀνίατος
  choice: неизлечимым
  rationale: Прямо сохраняет сильную медицинскую метафору оригинала.
theological_decisions:
- issue: Характер причинной цепочки от вспыльчивости к греху
  choice: Сохранена последовательная градация состояний без пояснения их догматического статуса.
  alternative: Свести ряд к общему понятию усиливающегося гнева или истолковать каждую ступень как отдельный грех.
  rationale: Греческий текст намеренно выстраивает цепь возникновения и усиления; перевод не должен сглаживать её или добавлять конфессиональное толкование.
- issue: «Неизлечимый грех»
  choice: Сохранено буквальное сильное выражение «неизлечимый грех».
  alternative: Смягчить до «грех, от которого трудно избавиться».
  rationale: ἀνίατος недвусмысленно означает «неизлечимый»; смягчение устранило бы риторическое и богословское напряжение текста.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксический параллелизм оригинальной градации сохранён; архаизмы и излишне специальные психологические термины не использованы.
