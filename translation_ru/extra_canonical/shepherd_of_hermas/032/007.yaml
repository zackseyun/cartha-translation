base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/007.yaml
  text: Therefore keep away from quick temper—that most wicked spirit—but clothe yourself with long-suffering, and stand against quick temper and bitterness, and you will be found with the dignity that is beloved by the Lord. See to it, then, that you never neglect this command; for if you gain mastery over this command, you will also be able to keep the other commands that I am about to give you. Be strong in them and be empowered[—], and let all be empowered who wish to walk in them.”
translation:
  language: ru
  text: Итак, держись подальше от вспыльчивости — этого крайне злого духа; облекись в долготерпение и противостой вспыльчивости и горечи — тогда окажешься вместе с достоинством, любимым Господом. Смотри же, никогда не пренебрегай этой заповедью. Ведь если овладеешь ею, то сможешь соблюдать и остальные заповеди, которые я намерен дать тебе. Будь твёрд в них и укрепляйся; пусть укрепляются и все, кто желает жить по ним».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξυχολία
  choice: вспыльчивость
  rationale: Передаёт склонность быстро впадать в раздражение и гнев; естественнее для современного русского читателя, чем буквальные или архаические варианты.
- source_word: μακροθυμία
  choice: долготерпение
  rationale: Сохраняет устойчивый нравственно-богословский смысл терпеливой выдержки и прямо противопоставлено вспыльчивости.
- source_word: σεμνότης
  choice: благородство
  rationale: Здесь слово обозначает достойное, почтенное качество характера; «благородство» звучит естественно и не сводит смысл только к внешней степенности.
- source_word: κυριεύσῃς
  choice: овладеешь
  rationale: Сохраняет образ достижения господства над данной заповедью, то есть её полного усвоения и исполнения.
- source_word: πορεύεσθαι
  choice: следовать
  rationale: В контексте заповедей греческий образ хождения означает строить по ним жизнь; русский глагол естественно выражает это без излишней буквальности.
theological_decisions:
- issue: Вспыльчивость названа духом
  choice: сохранено прямое обозначение «этого крайне злого духа»
  alternative: понимать «дух» только как настроение или склонность
  rationale: Источник персонифицирует нравственные силы как духов; перевод не должен заранее разрешать, онтологически или образно следует понимать это выражение.
- issue: Связь человека с угодным Господу качеством
  choice: «окажешься среди тех, кто обладает благородством»
  alternative: «будешь обладать благородством» или «будешь найден вместе с благородством»
  rationale: Формула μετὰ τῆς σεμνότητος допускает образ пребывания с добродетелью; выбранная естественная формулировка сохраняет соотнесённость человека с качеством, не превращая её в отдельную сущность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной, наставительной интонацией. Сохранены повелительные формы, метафора облачения и напряжение между нравственными качествами и названными духами; архаическая синтаксическая тяжеловесность устранена.
