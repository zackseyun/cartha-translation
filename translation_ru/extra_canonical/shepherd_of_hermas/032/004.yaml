base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/032/004.yaml
  text: You see, then, that long-suffering is sweeter than honey and is serviceable to the Lord, and he dwells in it; but quick temper is bitter and useless. If, therefore, quick temper is mixed with long-suffering, long-suffering is defiled and is no longer useful to God. Long-suffering at all times has nothing bitter within itself, remaining always gentle and quiet. This long-suffering, then, dwells with those who have the faith complete.
translation:
  language: ru
  text: Итак, ты видишь, что долготерпение слаще мёда, пригодно для Господа и что Он обитает в нём. Вспыльчивость же горька и бесполезна. Поэтому, если вспыльчивость смешивается с долготерпением, долготерпение оскверняется и уже не пригодно для Бога. Долготерпение никогда не имеет в себе ничего горького, но всегда остаётся кротким и спокойным. Итак, такое долготерпение обитает в тех, чья вера целостна.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μακροθυμία
  choice: долготерпение
  rationale: Передаёт стойкое терпение и сдержанность перед лицом раздражения; сохраняет связь с традиционной раннехристианской нравственной лексикой.
- source_word: ὀξυχολία
  choice: вспыльчивость
  rationale: Обозначает склонность быстро раздражаться и гневаться; современное русское слово естественно выражает противопоставление долготерпению.
- source_word: εὔχρηστος / ἄχρηστος
  choice: полезно / бесполезна; приносит пользу
  rationale: Сохраняет образ пригодности для служения Господу, не вводя отсутствующую в тексте специальную культовую терминологию.
- source_word: πραεῖα καὶ ἡσύχιος
  choice: кротким и спокойным
  rationale: Передаёт нравственную мягкость и внутреннюю невозмутимость естественными литературными соответствиями.
- source_word: πίστιν ... ὁλόκληρον
  choice: вера целостна
  rationale: Сохраняет идею полноты и неповреждённости веры, не уточняя её конфессиональное содержание.
theological_decisions:
- issue: Субъект выражения καὶ ἐν αὐτῇ κατοικεῖ
  choice: «Он обитает в нём», где подразумевается Господь
  alternative: Безличное или относящееся к долготерпению прочтение
  rationale: Ближайший названный субъект — Господь; такое понимание также соответствует противопоставлению мест обитания Господа и дьявола в предшествующем контексте.
- issue: Характер «целостной веры»
  choice: Сохранено без догматического пояснения
  alternative: «совершенная», «истинная» или «правоверная вера»
  rationale: ὁλόκληρον указывает на целостность или полноту, но сам текст не определяет это через позднейшие конфессиональные категории.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Сохранено прямое обращение во втором лице единственного числа и развёрнутое противопоставление долготерпения вспыльчивости. В присланном греческом тексте на границе данного читательского сегмента заметен сбой нормализованного OCR/стыковки строк; формулировка восстановлена по непрерывному синтаксису и контексту, согласуясь с аудированной английской консультационной версией.
