revisions:
- from: Итак, ты видишь, что долготерпение слаще мёда и полезно Господу и что Он обитает в нём. Вспыльчивость же горька и бесполезна. Поэтому, если вспыльчивость смешивается с долготерпением, долготерпение оскверняется и уже не приносит пользы Богу. Долготерпение никогда не имеет в себе ничего горького, но всегда остаётся кротким и спокойным. Итак, такое долготерпение обитает в тех, чья вера целостна.
  to: Итак, ты видишь, что долготерпение слаще мёда, пригодно для Господа и что Он обитает в нём. Вспыльчивость же горька и бесполезна. Поэтому, если вспыльчивость смешивается с долготерпением, долготерпение оскверняется и уже не пригодно для Бога. Долготерпение никогда не имеет в себе ничего горького, но всегда остаётся кротким и спокойным. Итак, такое долготерпение обитает в тех, чья вера целостна.
  rationale: 'Заменено «полезно Господу» на «пригодно для Господа» и параллельно «не приносит пользы Богу» на «не пригодно для Бога», чтобы последовательно передать εὔχρηστος / ἄχρηστος и сохранить образ пригодности из предшествующего сравнения с мёдом. Прочие решения сохранены: местоимение «Он» обоснованно относится к Господу по непосредственному контексту, а «целостна» сохраняет недогматизированную семантику ὁλόκληρος.'
