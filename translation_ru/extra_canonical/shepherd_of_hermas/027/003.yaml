base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/003.yaml
  text: Slander is evil; it is an unsettled demon, never at peace, but always dwelling amid divisions. So keep away from it, and you will always have prosperity with all.
translation:
  language: ru
  text: Злословие — зло; это неугомонный демон, который никогда не пребывает в мире, но всегда обитает среди раздоров. Поэтому держись от него подальше — и всегда будешь жить в благополучии со всеми.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλαλία
  choice: злословие
  rationale: Передаёт порочащую речь о другом человеке и сохраняет связь с глаголом καταλαλεῖν в ближайшем контексте; «клевета» было бы уже, поскольку может подразумевать именно ложное обвинение.
- source_word: ἀκατάστατον
  choice: неугомонный
  rationale: В данном олицетворённом описании обозначает беспокойный, не знающий покоя характер; естественно сочетается с последующим «никогда не пребывает в мире».
- source_word: δαιμόνιον
  choice: демон
  rationale: Прямо сохраняет личностно-духовный образ греческого текста, не ослабляя его до абстрактной «силы».
- source_word: ἐν διχοστασίαις κατοικοῦν
  choice: обитает среди раздоров
  rationale: Сохраняет метафору обитания и множественное значение διχοστασίαις — распри, разделения, раздоры.
- source_word: εὐθηνίαν
  choice: благополучии
  rationale: Широкое значение процветания и хорошего состояния; в сочетании μετὰ πάντων по-русски естественно выражается как мирное благополучие в отношениях со всеми.
theological_decisions:
- issue: Статус «демона» как буквального существа или олицетворения порока
  choice: Сохранить прямое выражение «это неугомонный демон»
  alternative: «оно подобно неугомонному демону» или «это беспокойная злая сила»
  rationale: В оригинале нет сравнительной частицы и прямо употреблено δαιμόνιον; перевод не должен заранее разрешать, является ли выражение буквальным утверждением или ярким олицетворением.
- issue: Обещание εὐθηνία μετὰ πάντων
  choice: «будешь жить в благополучии со всеми»
  alternative: «будешь всегда в мире со всеми»
  rationale: «Мир» уже передаёт εἰρηνεῦον в предыдущей фразе, тогда как εὐθηνία шире и означает благополучие или процветание; выбранный вариант сохраняет различие.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Повелительное «держись» сохраняет прямое личное обращение единственного числа; синтаксис сделан естественным, без устранения резкого образа демона.
