base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/001.yaml
  text: 'He says to me: Have simplicity, and become guileless, and you will be like the little ones who do not know the wickedness that destroys the life of human beings.'
translation:
  language: ru
  text: 'Он говорит мне: «Храни в себе простоту, стань незлобивым — и будешь как малые дети, которые не знают зла, губящего жизнь людей».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἁπλότητα
  choice: простоту
  rationale: Передаёт прямоту и цельность без коварства; связь с последующим ἄκακος сохраняет этический смысл.
- source_word: ἄκακος
  choice: незлобивым
  rationale: Естественное для литературного русского обозначение человека, не замышляющего и не причиняющего зла; не означает наивность или безответственность.
- source_word: τὰ νήπια
  choice: малые дети
  rationale: Передаёт образ совсем юных детей и звучит естественнее буквального «младенцы» в данном нравственном сравнении.
- source_word: πονηρίαν
  choice: зла
  rationale: Контекстуально охватывает нравственное зло, порочность и злой умысел, не сужая значение до одного свойства.
- source_word: τὴν ζωὴν τῶν ἀνθρώπων
  choice: человеческую жизнь
  rationale: Естественно передаёт родительное множественного числа как обобщение, относящееся к жизни людей.
theological_decisions:
- issue: Смысл призыва к детскости
  choice: Сохранено сравнение с малыми детьми, не знающими зла
  alternative: Истолковать как призыв к невинности или безгрешности
  rationale: Греческий текст говорит именно о незнании губительного зла и не утверждает общей безгрешности детей.
- issue: Значение ἁπλότης
  choice: «простота» в смысле прямоты и отсутствия двойственности
  alternative: «простодушие» или «щедрость»
  rationale: Ближайший параллельный призыв стать ἄκακος указывает здесь прежде всего на нравственную прямоту и отсутствие коварства.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, наставительным звучанием. Императив ἔχε передан как «храни», чтобы естественно выразить устойчивое обладание качеством; прямая речь оформлена русскими кавычками.
