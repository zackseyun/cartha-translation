base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/006.yaml
  text: Therefore the one who gives is innocent; for just as he received from the Lord the ministry to carry out, he carried it out simply, making no distinction as to whom he should give or not give. Thus this ministry, having been carried out simply, became glorious before God. Therefore the one who thus ministers simply to God will live.
translation:
  language: ru
  text: 'Итак, тот, кто даёт, невиновен: получив от Господа служение, которое надлежало исполнить, он исполнил его с простотой, не разбирая, кому дать, а кому не дать. Поэтому это служение, исполненное с простотой, стало славным пред Богом. Кто же так служит Богу с простотой, тот будет жить.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ διδοὺς
  choice: тот, кто даёт
  rationale: Передаёт субстантивированное причастие естественным современным русским оборотом.
- source_word: ἀθῷός
  choice: невиновен
  rationale: В контексте ответственности за возможное злоупотребление милостыней речь идёт об отсутствии вины дающего.
- source_word: διακονία
  choice: служение
  rationale: Сохраняет религиозно-этический смысл порученного Господом дела раздаяния, не сужая его до должности или отдельного пожертвования.
- source_word: ἁπλῶς
  choice: с простотой
  rationale: Сохраняет повтор и связь с ключевой для всего наставления ἁπλότης — искренней, нерасчётливой простотой.
- source_word: μηθὲν διακρίνων
  choice: не разбирая
  rationale: Естественно выражает отсутствие отбора или различения между возможными получателями.
- source_word: ἔνδοξος παρὰ τῷ Θεῷ
  choice: славным пред Богом
  rationale: Передаёт положительную оценку служения Богом, сохраняя возвышенный, но понятный регистр.
- source_word: ζήσεται
  choice: будет жить
  rationale: Сохраняет краткую эсхатологически открытую формулировку оригинала, не уточняя вид жизни.
theological_decisions:
- issue: Характер поручения от Господа
  choice: «получив от Господа служение, которое надлежало исполнить»
  alternative: «как получил от Господа поручение исполнить служение»
  rationale: Выбранная формулировка сохраняет образ служения как принятого дара и обязанности, не вводя специальной церковной должности.
- issue: Смысл обещания ζήσεται
  choice: «будет жить»
  alternative: «обретёт жизнь» или «будет жить вечно»
  rationale: Оригинал не содержит ни глагола «обрести», ни явного уточнения «вечно»; двусмысленность обещания сохранена.
- issue: Адресат служения в последней фразе
  choice: «служит Богу с простотой»
  alternative: «так просто исполняет служение перед Богом»
  rationale: Синтаксис τῷ Θεῷ естественно допускает понимание Бога как того, кому служат; это значение передано прямо без дальнейшего догматического уточнения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Повтор «с простотой» намеренно сохранён как смысловой стержень отрывка; «пред Богом» поддерживает достоинство регистра без архаизации всего текста.
