base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/004.yaml
  text: But clothe yourself with dignity, in which there is no evil stumbling block, but all things are smooth and cheerful. Do what is good, and from your labors, which God gives you, give simply to all who are in need, not hesitating as to whom you should give or to whom you should not give. Give to all, for God wants all to be given from his own gifts.
translation:
  language: ru
  text: Облекись же в достоинство, в котором нет никакого злого камня преткновения, но всё гладко и радостно. Делай добро и из того, что ты приобретаешь своим трудом, — того, что даёт тебе Бог, — бесхитростно давай всем нуждающимся, не колеблясь, кому дать, а кому не дать. Давай всем, ибо Бог желает, чтобы Его собственные дары раздавались всем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σεμνότης
  choice: достоинство
  rationale: Передаёт нравственную благородную серьёзность и почтенность без архаичного или узкоконфессионального оттенка.
- source_word: πρόσκομμα
  choice: камень преткновения
  rationale: Сохраняет образ препятствия, ведущего к падению, и этическую силу греческого слова.
- source_word: ὁμαλά
  choice: ровно
  rationale: 'Сохраняет метафорический контраст с препятствием: путь без неровностей и поводов к падению.'
- source_word: ἱλαρά
  choice: радостно
  rationale: Передаёт светлый, благожелательный характер состояния; наречная форма естественно согласуется с «всё».
- source_word: ἐκ τῶν κόπων σου
  choice: из плодов трудов
  rationale: В контексте раздачи нуждающимся речь идёт о полученном благодаря труду; добавление «плодов» делает смысл естественным по-русски, не меняя референта.
- source_word: ἁπλῶς
  choice: бесхитростно
  rationale: Передаёт простоту, искренность и отсутствие расчётливой разборчивости; «просто» здесь могло бы означать лишь лёгкость действия.
- source_word: ὑστερουμένοις
  choice: нуждающимся
  rationale: Естественно обозначает тех, кто испытывает недостаток или лишение.
- source_word: ἐκ τῶν ἰδίων δωρημάτων
  choice: из Его собственных даров
  rationale: Сохраняет мысль, что раздаваемое первоначально принадлежит Богу и даровано Им.
theological_decisions:
- issue: Всеобщность призыва «давай всем»
  choice: Сохранено без ограничения круга получателей
  alternative: 'Уточнить: «всем действительно нуждающимся»'
  rationale: Греческий текст намеренно подчёркивает πᾶσιν и запрещает дарителю решать, кому дать; ответственность получателя раскрывается в следующем сегменте.
- issue: Источник человеческого труда и даяния
  choice: «труды, которые даёт тебе Бог» и «Его собственные дары»
  alternative: «заработок, который Бог позволяет тебе получать»
  rationale: 'Сохранена напряжённая формулировка источника: и возможность трудиться, и раздаваемое рассматриваются как Божий дар, без сведения мысли к одной лишь зарплате.'
translation_notes:
  register: Современный литературный русский с нравственно-наставительным, dignified тоном. Императивы сохранены прямо и ясно. Архаизмы сведены к минимуму; устойчивый библейский образ «камень преткновения» оставлен ради точности метафоры.
