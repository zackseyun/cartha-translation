revisions:
- from: Облекись же в достоинство, в котором нет никакого злого камня преткновения, но всё ровно и радостно. Делай добро и из плодов трудов, которые даёт тебе Бог, бесхитростно давай всем нуждающимся, не раздумывая, кому дать, а кому не дать. Давай всем, ибо Бог желает, чтобы из Его собственных даров давали всем.
  to: Облекись же в достоинство, в котором нет никакого злого камня преткновения, но всё гладко и радостно. Делай добро и из того, что ты приобретаешь своим трудом, — того, что даёт тебе Бог, — бесхитростно давай всем нуждающимся, не колеблясь, кому дать, а кому не дать. Давай всем, ибо Бог желает, чтобы Его собственные дары раздавались всем.
  rationale: Правка устраняет небольшие стилистические и смысловые смещения, не ограничивая всеобщий призыв «давай всем» и не предвосхищая пояснение об ответственности получателей в следующем разделе. «Достоинство» и традиционный образ «камень преткновения» оставлены как приемлемые точные соответствия исходному тексту.
  reviewer_model: gpt-5.6-terra
