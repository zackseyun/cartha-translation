review_pass:
  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: призыв облечься в σεμνότης, отсутствие «злого преткновения», благотворительность без различения получателей и Божье происхождение даров сохранены. Однако «не раздумывая» несколько смещает μηδὲ διστάζων («не колеблясь / не сомневаясь»), а «из плодов трудов» добавляет образ, которого в греческом нет, хотя подразумеваемый доход от труда ясен из контекста.'
  naturalness: Текст в целом литературен, но «всё ровно и радостно» звучит по-русски несколько неестественно. Более плавное «всё гладко и радостно» сохраняет образ пути без препятствий. Формула «из того, что ты приобретаешь своим трудом» естественнее для распределяемых материальных средств, чем буквальное «из трудов».
  terminology: '«Достоинство» допустимо для σεμνότης и сохраняет наставительно-нравственный регистр. «Камень преткновения» уместен как устойчивый образ для πρόσκομμα. «Нуждающиеся» точно передаёт ὑστερούμενοι. В заключении лучше прямо выразить греческий пассив δίδοσθαι: Бог желает, чтобы Его дары раздавались всем.'
  issues:
  - severity: low
    issue: «Не раздумывая» для μηδὲ διστάζων
    rationale: Греческое слово означает не колебаться, не сомневаться; «не раздумывая» может подразумевать необдуманность, которой текст не требует.
  - severity: low
    issue: «Из плодов трудов»
    rationale: «Плоды» — интерпретирующее добавление. Контекст оправдывает речь о средствах, полученных трудом, но это лучше выразить без введения дополнительного образа.
  - severity: low
    issue: «Всё ровно и радостно»
    rationale: Буквально отражает ὁμαλά καὶ ἱλαρά, но в современном русском наречие «ровно» здесь звучит шероховато; «гладко» сохраняет метафору отсутствия препятствий.
  revised_text: Облекись же в достоинство, в котором нет никакого злого камня преткновения, но всё гладко и радостно. Делай добро и из того, что ты приобретаешь своим трудом, — того, что даёт тебе Бог, — бесхитростно давай всем нуждающимся, не колеблясь, кому дать, а кому не дать. Давай всем, ибо Бог желает, чтобы Его собственные дары раздавались всем.
