base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/002.yaml
  text: First of all, slander no one, and do not listen with pleasure to someone who slanders; otherwise you too, the hearer, will be guilty of the slanderer’s sin if you believe the slander you hear. For by believing it, you yourself also will have something against your brother. Thus you will be guilty of the slanderer’s sin.
translation:
  language: ru
  text: Прежде всего никого не злословь и не слушай с удовольствием того, кто злословит. Иначе и ты, слушающий, будешь виновен в грехе злословящего, если поверишь услышанному злословию. Ведь, поверив ему, ты и сам будешь иметь что-то против своего брата.[a] Так ты будешь виновен в грехе злословящего.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и сам будешь иметь против своего брата». Греческое выражение не уточняет, что именно возникнет у слушателя против брата.'
    reason: Сохраняет и объясняет эллиптический характер выражения ἕξεις κατὰ τοῦ ἀδελφοῦ σου, не навязывая конкретного психологического или юридического смысла.
lexical_decisions:
- source_word: καταλάλει / καταλαλοῦντος / καταλαλίᾳ
  choice: злословь / злословящего / злословию
  rationale: Греческое семейство слов обозначает порочащую речь о другом человеке; единообразный перевод сохраняет лексический повтор оригинала и не сужает смысл до юридически понимаемой клеветы.
- source_word: ἡδέως ἄκουε
  choice: слушай с удовольствием
  rationale: Передаёт не простое слышание, а охотное, доставляющее удовольствие внимание к злословию.
- source_word: ἔνοχος ἔσῃ
  choice: будешь виновен
  rationale: Естественно передаёт ответственность слушателя и сохраняет нравственно-судебный оттенок ἔνοχος.
- source_word: τοῦ ἀδελφοῦ σου
  choice: своего брата
  rationale: Сохраняет общинное обращение раннехристианского текста без добавления конфессионального толкования.
theological_decisions:
- issue: Соучастие слушателя в грехе злословящего
  choice: «будешь виновен в грехе злословящего, если поверишь»
  alternative: «разделишь грех злословящего»
  rationale: Выбранная формулировка непосредственно сохраняет условие оригинала — вина возникает при доверии злословию — и не усиливает текст утверждением о непременно равной мере вины.
- issue: Неопределённый объект в выражении ἕξεις κατὰ τοῦ ἀδελφοῦ σου
  choice: «станешь держать зло на своего брата»
  alternative: «у тебя самого будет что-то против твоего брата»
  rationale: Русская идиома передаёт возникшее враждебное отношение, но сноска отмечает буквальную неопределённость греческого выражения, не превращая её в более конкретное обвинение.
translation_notes:
  register: Современный литературный русский язык с ясным назидательным тоном. Повтор слова «злословить» намеренно сохранён вслед за оригиналом; синтаксис несколько разгружен для естественного чтения, без устранения логической связи между слушанием, доверием и виной.
