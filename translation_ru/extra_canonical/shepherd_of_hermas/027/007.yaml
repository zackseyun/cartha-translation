revisions:
- from: Итак, соблюдай эту заповедь, как я сказал тебе, чтобы покаяние твоё и твоего дома оказалось искренним, а сердце твоё — чистым и незапятнанным.
  to: Итак, соблюдай эту заповедь, как я сказал тебе, чтобы твоё покаяние и покаяние твоего дома нашлись в простоте, а сердце твоё было чистым и незапятнанным.
  rationale: 'Изменено только выражение, передающее ἐν ἁπλότητι: «в простоте» сохраняет исходную лексику и её широкий этический смысл. Явно повторено «покаяние» во второй части сочетания, чтобы русская фраза не допускала ошибочного понимания «покаяния дома» как свойства здания и чтобы согласование было естественным. Остальные решения сохранены.'
