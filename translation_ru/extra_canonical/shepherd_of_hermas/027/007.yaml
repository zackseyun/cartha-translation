base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/007.yaml
  text: So keep this commandment, as I have spoken to you, so that your repentance and that of your household may be found in simplicity, and your heart clean and unstained.
translation:
  language: ru
  text: Итак, соблюдай эту заповедь, как я сказал тебе, чтобы твоё покаяние и покаяние твоего дома нашлись в простоте, а сердце твоё было чистым и незапятнанным.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φύλασσε
  choice: соблюдай
  rationale: Передаёт продолжительное бережное исполнение заповеди, а не только её сохранение в памяти.
- source_word: μετάνοια
  choice: покаяние
  rationale: Устоявшийся и контекстуально точный эквивалент, включающий обращение и перемену жизни.
- source_word: τοῦ οἴκου σου
  choice: твоего дома
  rationale: Сохраняет образ и возможный смысл домочадцев, не сужая его пояснительным переводом до «семьи».
- source_word: ἐν ἁπλότητι
  choice: искренним
  rationale: В данном контексте ἁπλότης означает простоту без лукавства и раздвоенности; наречная конструкция естественно передана качественной характеристикой покаяния.
- source_word: καθαρὰ καὶ ἀμίαντος
  choice: чистым и незапятнанным
  rationale: Сохраняет парные определения и образ нравственной чистоты.
theological_decisions:
- issue: Смысл выражения ἡ μετάνοιά σου καὶ τοῦ οἴκου σου ἐν ἁπλότητι εὑρεθῇ
  choice: «чтобы покаяние твоё и твоего дома оказалось искренним»
  alternative: «чтобы твоё покаяние и покаяние твоего дома было найдено в простоте»
  rationale: Перевод сохраняет проверяемый характер εὑρεθῇ («оказалось») и этический смысл ἁπλότης, не превращая простоту в отдельное условие спасения.
- issue: Текстуально отмеченное σου после καρδία
  choice: «сердце твоё»
  alternative: «сердце»
  rationale: Местоимение заключено в редакторские скобки, но смысл явно относится к адресату; его включение даёт естественный русский текст без богословского изменения.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Синтаксис ясен для широкого читателя; сохранены ключевые образы «дом», «сердце» и парность заключительных определений.
