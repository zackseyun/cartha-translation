review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан верно: получатели отвечают перед Богом за причину и цель получения; нуждающиеся исключаются из суда, а получающие «в лицемерии» подлежат наказанию. Однако «не будут осуждены» несколько сужает греческое οὐ δικασθήσονται («не будут судимы»), а «из-за нужды» менее точно передаёт θλιβόμενοι — людей, находящихся в тяжёлых, стеснённых обстоятельствах.'
  naturalness: Текст звучит современно и ясно. Формулировка «будучи в нужде» естественнее и точнее, чем «из-за нужды»; «для чего» в данном контексте яснее передаёт εἰς τί, чем разговорно-неопределённое «на что».
  terminology: «Дадут Богу отчёт» и «понесут наказание» удачны. «Лицемерно» сохраняет намеренную неуточнённость ἐν ὑποκρίσει и не навязывает объяснения, будто речь непременно о притворстве нуждающимся.
  issues:
  - severity: medium
    issue: «Не будут осуждены»
    rationale: Греческое οὐ δικασθήσονται буквально означает «не будут судимы». «Осуждены» предполагает итог обвинительного приговора и тем самым несколько меняет судебный образ оригинала.
  - severity: low
    issue: «Те, кто получает из-за нужды»
    rationale: θλιβόμενοι характеризует самих получателей как пребывающих в бедственном/стеснённом положении, а не просто указывает мотив получения.
  - severity: low
    issue: «Почему они взяли и на что»
    rationale: В контексте подаяния λαμβάνω лучше последовательно передать как «получили», а εἰς τί — как «для чего», то есть с указанием цели получения.
  revised_text: Итак, получающие дадут Богу отчёт, почему они получили и для чего; ведь те, кто получает, будучи в нужде, не будут судимы, а те, кто получает лицемерно, понесут наказание.
