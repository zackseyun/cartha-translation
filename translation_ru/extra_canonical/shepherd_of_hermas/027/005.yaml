revisions:
- from: Итак, получающие дадут Богу отчёт, почему они взяли и на что. Те, кто получает из-за нужды, не будут осуждены, а те, кто получает лицемерно, понесут наказание.
  to: Итак, получающие дадут Богу отчёт, почему они получили и для чего; ведь те, кто получает, будучи в нужде, не будут судимы, а те, кто получает лицемерно, понесут наказание.
  rationale: Исправления сохраняют структуру и смысл греческого текста, точнее передают судебный глагол и характеристику нуждающихся, а также делают различие между причиной и целью получения яснее по-русски. Никаких доктринальных уточнений не добавлено.
