base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/027/005.yaml
  text: Therefore those who receive will render an account to God why they received and for what; for those who receive while afflicted will not be judged, but those who receive in hypocrisy will pay the penalty.
translation:
  language: ru
  text: Итак, получающие дадут Богу отчёт, почему они получили и для чего; ведь те, кто получает, будучи в нужде, не будут судимы, а те, кто получает лицемерно, понесут наказание.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποδώσουσιν λόγον
  choice: дадут … отчёт
  rationale: Естественная русская передача устойчивого выражения об ответственности перед Богом.
- source_word: διατί … καὶ εἰς τί
  choice: почему … и на что
  rationale: Сохраняет различие между причиной получения и назначением полученного.
- source_word: θλιβόμενοι
  choice: из-за нужды
  rationale: В контексте раздачи нуждающимся причастие обозначает людей, стеснённых тяжёлыми обстоятельствами; формулировка ясна современному читателю.
- source_word: ἐν ὑποκρίσει
  choice: лицемерно
  rationale: Передаёт притворный, неискренний характер получения помощи без добавления более узкого мотива.
- source_word: τίσουσιν δίκην
  choice: понесут наказание
  rationale: Идиоматическая и точная передача греческого выражения о воздаянии за проступок.
theological_decisions:
- issue: Смысл «не будут осуждены» применительно к получающим в нужде
  choice: Сохранено прямое утверждение текста без уточнения вида или времени суда.
  alternative: «не подвергнутся взысканию» или пояснение, что речь только об ответственности за получение помощи
  rationale: Греческое οὐ δικασθήσονται допускает судебно-богословское звучание; контекст ограничивает его получением милостыни, но перевод не должен устранять исходную напряжённость.
- issue: Характер лицемерного получения
  choice: Не уточняется, в чём именно состоит лицемерие.
  alternative: «те, кто притворяется нуждающимся»
  rationale: Такое пояснение вероятно по контексту, однако в греческом тексте прямо не выражено и сузило бы смысл.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис сохраняет причинно-противительное построение греческого текста; архаизмы и конфессионально окрашенные добавления исключены.
