base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/023/001.yaml
  text: After the beast had passed by me and I had gone forward about thirty feet, behold, a virgin meets me, adorned as if coming out of a bridal chamber, all in white and with white sandals, veiled up to her forehead; her covering was with a turban, and her hair was white.
translation:
  language: ru
  text: 'После того как я миновал зверя и прошёл вперёд около тридцати футов, вижу: навстречу мне идёт дева, нарядная, словно выходящая из брачного чертога, вся в белом и в белых сандалиях, покрытая до лба; её головное покрывало было в виде тюрбана, а волосы у неё были белые.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θηρίον
  choice: зверь
  rationale: Прямое и естественное соответствие греческому слову в контексте видения.
- source_word: ὡσεὶ πόδας τριάκοντα
  choice: около тридцати футов
  rationale: Сохраняет древнюю меру длины и приблизительность ὡσεὶ; речь идёт о расстоянии примерно в девять метров.
- source_word: ἰδοὺ
  choice: 'вижу:'
  rationale: Передаёт внезапность появления в живом повествовании без архаичного «вот».
- source_word: παρθένος
  choice: дева
  rationale: Сохраняет достоинство и образный регистр текста; «девушка» было бы менее точно, а «девственница» — излишне физиологично.
- source_word: κεκοσμημένη
  choice: нарядная
  rationale: В данном свадебном образе означает украшенную и празднично одетую; русское «нарядная» звучит естественно.
- source_word: νυμφῶνος
  choice: брачного чертога
  rationale: Передаёт помещение, связанное со свадьбой и браком, сохраняя возвышенный регистр.
- source_word: ἐν μίτρᾳ δὲ ἦν ἡ κατακάλυψις αὐτῆς
  choice: её покрывало было устроено наподобие тюрбана
  rationale: Греческая конструкция описывает форму головного покрытия; «наподобие тюрбана» понятно современному читателю и не утверждает более точную идентификацию древнего убора, чем позволяет текст.
