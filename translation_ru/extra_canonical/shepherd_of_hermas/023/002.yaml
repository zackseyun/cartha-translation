base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/023/002.yaml
  text: I knew that I would escape it, if your heart becomes pure and without blemish, and if for the remaining days of your life you serve the Lord blamelessly. Cast your cares upon the Lord, and he himself will direct them.
translation:
  language: ru
  text: Я понял, что ускользну от неё[a], если ваше сердце станет чистым и непорочным и если во все оставшиеся дни своей жизни вы будете безупречно служить Господу. Возложите свои заботы на Господа, и Он Сам всё устроит[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте стоит местоимение женского рода: «от неё». Его соотнесённость неясна, поскольку упомянутый ранее «зверь» имеет средний род; поэтому перевод сохраняет эту особенность текста, не определяя референт.'
    reason: Сохраняет грамматический род и текстовую неоднозначность оригинала без предпочтения одному из возможных объяснений.
  - marker: b
    text: 'Или: «Он Сам приведёт их в порядок», то есть ваши заботы.'
    reason: Греческое κατορθώσει допускает оттенки «исправит», «наладит», «благополучно устроит».
lexical_decisions:
- source_word: ἐκφυγεῖν
  choice: избегу
  rationale: Передаёт значение «спастись, ускользнуть, избежать опасности» и естественно сочетается с упомянутым ранее зверем.
- source_word: καθαρὰ καὶ ἄμωμος
  choice: чистым и непорочным
  rationale: 'Сохраняет два взаимодополняющих определения: внутреннюю чистоту и отсутствие порока или изъяна.'
- source_word: ἀμέμπτως
  choice: безупречно
  rationale: Передаёт наречное значение «так, чтобы не заслуживать упрёка» без добавления идеи абсолютного безгрешия.
- source_word: μερίμνας
  choice: заботы
  rationale: Естественный современный эквивалент для тяготящих забот и тревог.
- source_word: κατορθώσει
  choice: всё устроит
  rationale: Глагол означает привести к правильному состоянию, наладить или благополучно устроить; по-русски местоименное «устроит их» звучало бы неестественно применительно к заботам.
theological_decisions:
- issue: Условная связь избавления с чистотой сердца и безупречным служением
  choice: Сохранена прямо, без пояснения характера этой связи
  alternative: Истолковать условие как основание спасения либо только как свидетельство верности
  rationale: Источник оставляет богословское отношение между Божьим избавлением и человеческой верностью неразъяснённым.
- issue: Переход от первого лица единственного числа к обращению во втором лице множественного числа
  choice: 'Сохранён: «Я понял… если ваше сердце… вы будете»'
  alternative: 'Согласовать лица: «вы избежите… если ваше сердце…»'
  rationale: Такой переход присутствует в переданном греческом тексте и в английском консультационном слое; молча устранять его было бы редакционным истолкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис оставлен ясным и доступным; необычная смена лица сохранена как особенность источника, а не сглажена.
