  source_fidelity: 'Основной смысл передан верно: призыв обращён к «двоедушным», сохранены Божье могущество, отвращение гнева, предупреждение о наказаниях и заключительное «лучше не родиться». Однако μάστιγας — конкретное множественное существительное («бичи», в переносном смысле ниспосылаемые бедствия/язвы), тогда как «кары» несколько абстрагирует и не сохраняет множественного образа. Дательный адресата ὑμῖν также точнее передать как «вам», а не повтором «на вас».'
