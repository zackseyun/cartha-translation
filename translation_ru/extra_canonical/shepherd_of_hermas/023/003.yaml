base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/023/003.yaml
  text: Believe in the Lord, you double-minded, because he is able to do all things and turns his anger away from you, but sends plagues upon you who are double-minded. Woe to those who have heard these words and disobeyed; it would have been better for them not to have been born.
translation:
  language: ru
  text: 'Верьте Господу, двоедушные: Он всё может — и отвращает от вас Свой гнев, и посылает вам, двоедушным, бедствия. Горе тем, кто услышал эти слова и не послушался! Лучше было бы им не родиться.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δίψυχοι / διψύχοις
  choice: двоедушные / двоедушных
  rationale: Передаёт буквальный образ внутренней раздвоенности и сохраняет характерный для раннехристианской литературы нравственно-богословский термин.
- source_word: ἀποστρέφει τὴν ὀργὴν αὐτοῦ
  choice: отвращает от вас Свой гнев
  rationale: Сохраняет направленность действия и неоднозначное сочетание милости с последующим предостережением.
- source_word: ἐξαποστέλλει μάστιγας
  choice: насылает кары
  rationale: μάστιγες буквально означает «бичи», но в данном контексте обозначает посылаемые наказания или бедствия; «кары» естественно и достойно передаёт смысл без излишней конкретизации.
- source_word: παρακούσασιν
  choice: не послушался
  rationale: Глагол означает не просто услышать неверно, а не повиноваться услышанному; русское выражение сохраняет связь между слушанием и послушанием.
- source_word: αἱρετώτερον ἦν αὐτοῖς τὸ μὴ γεννηθῆναι
  choice: Лучше было бы им не родиться
  rationale: Прямой и естественный русский эквивалент сравнительной конструкции.
theological_decisions:
- issue: Соотношение отвращения гнева и посылания кар
  choice: 'Сохранены два однородных утверждения: «и отвращает… и насылает…»'
  alternative: «отвращает… но насылает…»
  rationale: Греческий текст соединяет сказуемые союзом καί, а не явно противительным союзом. Перевод не вводит отсутствующее в источнике логическое противопоставление и сохраняет напряжение текста.
- issue: Адресаты посылаемых кар
  choice: «на вас, двоедушных»
  alternative: Обобщённое «на двоедушных»
  rationale: Сохранено прямое обращение второго лица, выраженное ὑμῖν τοῖς διψύχοις.
translation_notes:
  register: Современный литературный русский с кратким пророческим ритмом. Архаизирующий термин «двоедушные» сохранён как точный и узнаваемый эквивалент δίψυχοι; остальная лексика проста и понятна. Пунктуация подчёркивает обращение и параллелизм исходного текста.
