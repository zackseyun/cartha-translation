lexical_decisions:
- source_word: Καλῶς ἤκουσας
  choice: Ты верно слышал
  rationale: Передаёт одобрение услышанного как истинного; естественно звучит по-русски и сохраняет обращение во втором лице.
- source_word: ἄφεσιν
  choice: прощение
  rationale: В данном контексте речь идёт о прощении прежних грехов; существительное «прощение» точно и понятно передаёт смысл.
- source_word: οὕτω γὰρ ἔχει
  choice: ибо так и есть
  rationale: Сохраняет подтверждающий характер греческой идиомы и причинную связь, выраженную γάρ.
theological_decisions:
- issue: Незавершённость последней фразы в предоставленном читательском сегменте
  choice: Сохранить обрыв фразы многоточием после «получил прощение»
  alternative: Дополнить фразу по последующему греческому тексту или завершить её синтаксически
  rationale: Переводимый сегмент намеренно заканчивается внутри предложения; дополнение внесло бы в этот сегмент материал, не представленный в английском слое и обрезанный в данном месте греческого источника.
translation_notes:
  register: Современный литературный русский язык с ясной, сдержанной и достойной повествовательной интонацией. Формула прямой речи сохранена близко к греческому тексту; богословская незавершённость фрагмента не устранена.
