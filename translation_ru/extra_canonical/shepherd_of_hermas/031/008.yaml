base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/031/008.yaml
  text: “He does not sin,” he says; “but if someone remains by himself, he obtains for himself greater honor and great glory with the Lord; but if he also marries, he does not sin. Therefore keep purity and dignity, and you will live to God. These things that I speak to you and am about to speak, keep from now on, from the day you were entrusted to me, and I will dwell in your house. And for your former trespasses there will be forgiveness, if you keep my commandments; and there will also be forgiveness for all, if they keep these commandments of mine and walk in this purity.”
translation:
  language: ru
  text: «Не грешит, — говорит он. — Но если кто останется один, то приобретёт себе бо́льшую честь и великую славу перед Господом; если же и вступит в брак, не грешит. Итак, храни чистоту и благопристойность — и будешь жить для Бога. Всё, что я говорю тебе и ещё намерен сказать, соблюдай отныне, с того дня, когда ты был вверен мне, — и я буду обитать в твоём доме. Прежние твои проступки будут прощены, если соблюдёшь мои заповеди; и всем будет прощено, если они соблюдут эти мои заповеди и будут ходить в этой чистоте».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφ' ἑαυτῷ μείνῃ
  choice: останется один
  rationale: В контексте вопроса о повторном браке выражение означает оставаться без нового супруга; современная формулировка сохраняет смысл и не вводит специальной аскетической терминологии.
- source_word: τιμὴν
  choice: честь
  rationale: Прямое соответствие греческому слову, обозначающему честь или почёт.
- source_word: δόξαν
  choice: славу
  rationale: Сохраняет отличие от τιμήν и возвышенный религиозный регистр.
- source_word: πρὸς τὸν Κύριον
  choice: перед Господом
  rationale: Передаёт отношение к Господу без уточнения, означает ли оно признание у Господа или положение в его присутствии.
- source_word: ἁγνείαν
  choice: чистоту
  rationale: В данном контексте включает нравственную и половую чистоту; более узкое «целомудрие» могло бы чрезмерно связать слово только с воздержанием от брака.
- source_word: σεμνότητα
  choice: благопристойность
  rationale: Передаёт достойное, почтенное и нравственно серьёзное поведение естественным русским словом.
- source_word: ζήσῃ τῷ Θεῷ
  choice: будешь жить для Бога
  rationale: Сохраняет дательный Θεῷ и допускает смысл жизни, посвящённой Богу, не заменяя его формулой «жить с Богом».
- source_word: παρεδόθης
  choice: был вверен
  rationale: Пассивная форма сохранена; речь идёт о том, что Ерма был передан попечению говорящего.
- source_word: κατοικήσω
  choice: буду обитать
  rationale: Сохраняет значение продолжительного пребывания и достоинство стиля.
- source_word: παραπτώμασιν
  choice: проступки
  rationale: Передаёт нарушения и согрешения, не стирая лексического отличия от ἁμαρτία.
- source_word: πορευθῶσιν
  choice: будут ходить
  rationale: Сохраняет библейскую метафору образа жизни, присутствующую в греческом тексте.
theological_decisions:
- issue: Допустимость повторного брака после смерти супруга
  choice: «если же и вступит в брак, не грешит»
  alternative: «если же снова женится, не согрешает»
  rationale: Сохранено ясное утверждение источника, что повторный брак не является грехом, при этом формулировка применима к обоим полам, как требует предшествующий контекст.
- issue: Более высокая честь остающегося без повторного брака
  choice: «приобретёт себе бо́льшую честь и великую славу перед Господом»
  alternative: «заслужит у Господа больше чести и великую славу»
  rationale: Не вводится идея заслуги, которой глагол περιποιεῖται прямо не требует; сравнительная оценка источника сохранена без превращения её в запрет брака.
- issue: Прощение связано с соблюдением заповедей
  choice: условная конструкция сохранена буквально по смыслу
  alternative: ослабить условие до «поскольку они соблюдают»
  rationale: Текст прямо использует ἐάν и ставит прощение в условную связь с соблюдением заповедей; богословское напряжение не следует сглаживать.
- issue: Обещание обитания в доме
  choice: «я буду обитать в твоём доме»
  alternative: истолковать дом как сердце, семью или церковь
  rationale: Источник не разъясняет образ, поэтому перевод не навязывает ему частное аллегорическое толкование.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, раннехристианским звучанием. Диалогическая формула «говорит он» сохранена. Синтаксис слегка упрощён для ясности, но параллелизм и повтор ключевых слов источника удержаны.
