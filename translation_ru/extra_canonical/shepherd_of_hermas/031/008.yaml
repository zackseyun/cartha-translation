  source_fidelity: 'Перевод точно передаёт греческий текст данного сегмента: повторный брак назван не грехом; оставаться без нового брака получает сравнительно большую честь и великую славу у/перед Господом; сохранены повеление хранить ἁγνεία и σεμνότης, обещание обитания и условные формулы прощения. Образное «ходить в этой чистоте» удержано без толковательного расширения.'
  naturalness: Русский текст литературный, ясный и выдержан в умеренно возвышенном регистре. «Остаться один» в ближайшем контексте вопроса о вступлении в новый брак естественно понимается как не вступать в повторный брак. «Буду обитать в твоём доме» удачно сохраняет образ и тон оригинала.
  terminology: «Чистота» и «благопристойность» различают ἁγνεία и σεμνότης без чрезмерного сужения первого термина. «Честь», «слава», «заповеди», «прощены» и «ходить» последовательно и адекватно передают ключевую лексику. Формула «перед Господом» допустимо сохраняет широту πρὸς τὸν Κύριον.
