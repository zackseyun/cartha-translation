  yaml_path: translation/extra_canonical/shepherd_of_hermas/031/003.yaml
  text: “I heard,” I say, “sir, from certain teachers, that there is no other repentance except that one when we went down into the water and received forgiveness of our former sins.”
translation:
  language: ru
  text: «Я слышал, господин, — говорю я, — от некоторых учителей, что нет иного покаяния, кроме того, которое было в то время, когда мы сошли в воду и получили прощение наших прежних грехов».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κύριε
  choice: господин
  rationale: В обращении к наставнику слово передаёт почтительность; «Господь» здесь ошибочно указывало бы на обращение к Богу.
- source_word: ἑτέρα μετάνοια
  choice: иного покаяния
  rationale: Сохраняется буквальное противопоставление другого или последующего покаяния тому, которое связано с сошествием в воду.
- source_word: εἰς ὕδωρ κατέβημεν
  choice: мы сошли в воду
  rationale: Сохранён конкретный пространственный образ греческого текста без добавления отсутствующего здесь слова «крещение».
- source_word: ἄφεσιν ἁμαρτιῶν
  choice: прощение ... грехов
  rationale: Естественный современный русский эквивалент устойчивого выражения об отпущении грехов.
- source_word: τῶν προτέρων
  choice: прежних
  rationale: Определение относится к грехам и обозначает совершённые ранее грехи.
theological_decisions:
- issue: Связь покаяния, воды и прощения
  choice: Сохранить формулировку как сообщение о слышанном учении, не поясняя её догматически.
  alternative: Прямо назвать сошествие в воду крещением и разъяснить его сакраментальное значение.
  rationale: Греческий текст говорит о сошествии в воду и получении прощения, но в данном сегменте не употребляет слово «крещение»; перевод не должен добавлять конфессиональное толкование.
- issue: Значение «иного покаяния»
  choice: Сохранить без уточнения, означает ли это второе, повторное или послекрещальное покаяние.
  alternative: Перевести как «второго покаяния» или «покаяния после крещения».
  rationale: ἑτέρα допускает контекстуальное понимание как иного или последующего покаяния, а данный сегмент сам по себе не требует снять эту смысловую напряжённость.
translation_notes:
  register: Современный литературный русский с почтительным, но не архаическим обращением. Рамка прямой речи перестроена естественно для русского языка при сохранении повторного «говорю я» и содержания исходной реплики.
