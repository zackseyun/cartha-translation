    issue: Неуклюжая временно-относительная конструкция
    rationale: Фраза «кроме того, которое было, когда...» формально понятна, но в современном русском звучит шероховато. Добавление «в то время» точнее отражает ἐκείνη, ὅτε и улучшает читаемость без смыслового расширения.
  revised_text: «Я слышал, господин, — говорю я, — от некоторых учителей, что нет иного покаяния, кроме того, которое было в то время, когда мы сошли в воду и получили прощение наших прежних грехов».
