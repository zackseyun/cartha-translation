  yaml_path: translation/extra_canonical/shepherd_of_hermas/031/007.yaml
  text: “If a woman,” I say, “sir, or again some man, should fall asleep, and one of them marries, does the one who marries sin?”
translation:
  language: ru
  text: «Если женщина, господин, — спросил я, — или, в свою очередь, какой-нибудь мужчина уснёт[a] и кто-то из них вступит в брак, то согрешит ли вступивший в брак?»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «уснёт»; здесь это образное обозначение смерти.'
    reason: Поясняет древний эвфемизм, сохраняя образ исходного текста.
lexical_decisions:
- source_word: κοιμηθῇ
  choice: уснёт сном смерти
  rationale: Сохранён греческий образ сна как обозначения смерти, но его смысл сделан понятным современному читателю.
- source_word: γαμήσῃ / ὁ γαμῶν
  choice: вступит в брак / вступивший в брак
  rationale: Нейтральная современная передача глагола «жениться, выходить замуж» без привязки к полу.
- source_word: κύριε
  choice: господин
  rationale: Передаёт почтительное обращение к собеседнику без внесения в текст божественного титула «Господь».
- source_word: ἢ πάλιν
  choice: или, наоборот
  rationale: В данном сопоставлении выражение вводит соответствующий случай для другого пола; «наоборот» звучит естественно по-русски.
- source_word: τις ἐξ αὐτῶν
  choice: кто-то из них
  rationale: Сохраняет формальную неопределённость греческого текста, не уточняя прямо «оставшийся в живых супруг».
theological_decisions:
- issue: Допустимость нового брака после смерти супруга
  choice: 'Вопрос оставлен открытым, как в данном сегменте: спрашивается, является ли такой брак грехом.'
  alternative: Уточнить в самом вопросе, что речь идёт о повторном браке овдовевшего человека.
  rationale: Контекст указывает на новый брак после смерти супруга, однако греческая формулировка здесь менее разъяснительна; добавление «повторно» преждевременно снимало бы часть её формальной неоднозначности.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставительного диалога. Порядок реплик перестроен естественно для русской прямой речи, при этом содержание и неопределённость исходной формулировки сохранены.
