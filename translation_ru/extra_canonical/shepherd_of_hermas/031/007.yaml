revisions:
- from: «Если женщина, господин, — спросил я, — или, наоборот, мужчина уснёт сном смерти[a] и кто-то из них вступит в брак, то согрешит ли вступивший в брак?»
  to: «Если женщина, господин, — спросил я, — или, в свою очередь, какой-нибудь мужчина уснёт[a] и кто-то из них вступит в брак, то согрешит ли вступивший в брак?»
  rationale: Исправлена неточная передача πάλιν и восстановлен буквальный образ κοιμηθῇ в основном тексте. Неопределённость «кто-то из них» сохранена, как в греческом тексте и английском аудиторском варианте; не добавляется, что это непременно оставшийся в живых супруг или что брак является повторным.
  reviewer_model: gpt-5.6-terra
