base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/003.yaml
  text: '"For this reason then," I say, "sir, I inquire of you carefully about everything: first, because I am a sinner; then, because I do not know by doing what works I shall live, for my sins are many and manifold."'
translation:
  language: ru
  text: '«Поэтому-то, господин, — говорю я, — я и расспрашиваю тебя обо всём подробно: во-первых, потому что я грешник, а во-вторых, потому что не знаю, какие дела мне совершать, чтобы жить, ведь грехи мои многочисленны и разнообразны».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο οὖν
  choice: Поэтому-то
  rationale: Передаёт вывод из предшествующего объяснения и естественное разговорное усиление греческого οὖν.
- source_word: κύριε
  choice: господин
  rationale: В данном обращении к наставнику это почтительное «господин», а не божественный титул «Господь».
- source_word: ἐξακριβάζομαι παρὰ σοῦ πάντα
  choice: я и расспрашиваю тебя обо всём подробно
  rationale: Глагол выражает тщательное выяснение или подробное разузнавание у собеседника.
- source_word: ποῖα ἔργα ἐργαζόμενος ζήσομαι
  choice: какие дела мне совершать, чтобы жить
  rationale: Сохраняет связь ἔργα и ἐργαζόμενος, но избегает ненатурального русского повтора «дела делать»; ζήσομαι оставлено без поясняющего богословского дополнения.
- source_word: πολλαί ... καὶ ποικίλαι
  choice: многочисленны и разнообразны
  rationale: Передаёт как множество грехов, так и различие их видов.
theological_decisions:
- issue: Смысл будущего ζήσομαι
  choice: чтобы жить
  alternative: чтобы обрести жизнь / чтобы жить для Бога
  rationale: Греческий текст данного сегмента не уточняет характер жизни. Формулировка «жить для Бога» появляется в следующем стихе и не должна ретроспективно устранять здесь смысловую открытость.
- issue: Значение ἔργα в связи с жизнью
  choice: какие дела мне совершать
  alternative: какие поступки приведут меня к спасению
  rationale: Сохранена конкретная лексика оригинала без внесения более узкой сотериологической интерпретации.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставительного диалога. Синтаксис сделан естественным для устной реплики, при этом сохранены обе причины, обозначенные πρῶτον и εἶτα.
