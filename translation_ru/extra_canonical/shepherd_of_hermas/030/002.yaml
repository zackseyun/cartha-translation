base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/002.yaml
  text: Answering me, he says, "I," he says, "am appointed over repentance, and I give understanding to all who repent. Or does it not seem to you," he says, "that this very thing—to repent—is understanding? To repent," he says, "is great understanding. For the man who has sinned understands that he has done what is evil before the Lord, and the deed that he did rises up in his heart, and he repents and no longer does evil, but does good abundantly, and he humbles his own soul and afflicts it, because he sinned. You see then that repentance is great understanding."
translation:
  language: ru
  text: 'Он ответил мне: «Я поставлен над покаянием и всем кающимся даю разумение. Или тебе не кажется, — сказал он, — что само покаяние и есть разумение? Покаяние, — сказал он, — есть великое разумение. Ведь согрешивший понимает, что сделал зло пред Господом; содеянное им поднимается в его сердце, и он кается и больше не делает зла, но усердно творит добро, смиряет свою душу и изнуряет её за то, что согрешил. Итак, ты видишь, что покаяние есть великое разумение».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τῆς μετανοίας εἰμί
  choice: Я поставлен над покаянием
  rationale: Оборот обозначает порученную сферу ответственности; перевод сохраняет образ надзора и не уточняет статус говорящего сверх греческого текста.
- source_word: σύνεσις
  choice: разумение
  rationale: Повторяющийся ключевой термин означает способность понимать и нравственное осознание; единообразный перевод сохраняет аргумент о покаянии как разумении.
- source_word: ἀναβαίνει ἐπὶ τὴν καρδίαν αὐτοῦ
  choice: приходит ему на сердце
  rationale: 'Сохранена древняя антропологическая образность: совершённый поступок входит в сознание и становится предметом сердечного осмысления.'
- source_word: τὸ ἀγαθὸν πολυτελῶς ἐργάζεται
  choice: усердно творит добро
  rationale: πολυτελῶς здесь передаёт щедрую, обильную или ревностную меру добрых дел; «усердно» естественно по-русски и не сводит выражение к материальной щедрости.
- source_word: βασανίζει
  choice: подвергает её страданию
  rationale: Глагол силён и буквально связан с мучением или тяжким испытанием; формулировка сохраняет суровость текста, не конкретизируя способ самоизнурения.
theological_decisions:
- issue: Связь покаяния и разумения
  choice: «покаяние есть великое разумение»
  alternative: «покаяние — признак великого благоразумия»
  rationale: Греческий текст прямо отождествляет μετάνοια и σύνεσις в риторическом утверждении; перевод не ослабляет его до признака или следствия.
- issue: Смысл «поставлен над покаянием»
  choice: Сохранена функция надзора без определения личности или чина говорящего
  alternative: «Я ангел покаяния» / «мне вверено покаяние»
  rationale: Источник не употребляет здесь слова «ангел»; буквальная функциональная формула избегает привнесения отсутствующего титула.
- issue: Аскетическое действие кающегося
  choice: «смиряет свою душу и подвергает её страданию»
  alternative: «смиряет себя и терзается»
  rationale: Сохранены два раздельных действия и прямой объект «свою душу», без психологизации или предписания конкретной формы наказания.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Повторы «сказал он», «разумение» и «покаяние» намеренно сохранены как элементы риторики и логики исходного текста; синтаксис слегка упрощён для ясности, не устраняя богословского напряжения.
