base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/001.yaml
  text: I asked him again, saying, "Since the Lord has counted me worthy that you should dwell with me always, bear with a few more words from me, since I understand nothing, and my heart has been hardened by my former deeds. Give me understanding, for I am very foolish and altogether perceive nothing."
translation:
  language: ru
  text: 'Я снова спросил его: «Раз Господь счёл меня достойным того, чтобы ты всегда жил со мной, потерпи ещё несколько моих слов. Ведь я ничего не понимаю, и сердце моё очерствело из-за моих прежних поступков. Вразуми меня, потому что я весьма неразумен и совсем ничего не постигаю».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄξιόν με ἡγήσατο
  choice: счёл меня достойным
  rationale: Сохраняет прямой смысл греческого выражения и возвышенный, но современный регистр.
- source_word: κατοικῇς
  choice: жил со мной
  rationale: Передаёт продолжительное пребывание рядом естественнее по-русски, чем более буквальное «обитал».
- source_word: ὀλίγα μου ῥήματα ἔτι ἀνασχοῦ
  choice: потерпи ещё несколько моих слов
  rationale: Сохраняет образ «вытерпеть/снести слова» и просительный тон говорящего.
- source_word: πεπώρωται
  choice: очерствело
  rationale: Передаёт совершившееся внутреннее ожесточение или утрату восприимчивости сердца.
- source_word: πράξεων
  choice: поступков
  rationale: Нейтральный современный эквивалент для совершённых ранее деяний.
- source_word: συνέτισόν με
  choice: вразуми меня
  rationale: Передаёт просьбу наделить пониманием; слово уместно в духовно-наставительном контексте и понятно современному читателю.
- source_word: ἄφρων
  choice: неразумен
  rationale: Сохраняет нравственно-интеллектуальный оттенок без излишне резкого разговорного «глуп».
- source_word: νοῶ
  choice: постигаю
  rationale: Отличает заключительное обозначение умственного восприятия от предыдущего «не понимаю», сохраняя риторическое усиление оригинала.
theological_decisions:
- issue: Причина очерствения сердца
  choice: «очерствело из-за моих прежних поступков»
  alternative: «очерствело вследствие прежних моих дел»
  rationale: Предлог ἀπό допускает причинный оттенок; перевод сохраняет признание связи между прежними поступками и нынешней духовной невосприимчивостью, не уточняя сверх текста механизм этой связи.
- issue: Постоянное пребывание наставника с говорящим
  choice: «чтобы ты всегда жил со мной»
  alternative: «чтобы ты всегда обитал со мной»
  rationale: Не определяется природа этого пребывания и не добавляется конфессиональное толкование; передаётся только утверждение исходного текста.
translation_notes:
  register: Современный литературный русский язык с dignified духовно-наставительным тоном. Синтаксис слегка возвышенный, но без архаизмов; повтор смысловых глаголов сохранён как риторическое усиление.
