base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/030/004.yaml
  text: '"You will live," he says, "if you keep my commandments and walk in them; and whoever, having heard these commandments, keeps them, will live to God."'
translation:
  language: ru
  text: «Будешь жить, — говорит он, — если соблюдёшь мои заповеди и будешь поступать по ним. И всякий, кто услышит эти заповеди и соблюдёт их, будет жить для Бога».[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «будет жив перед Богом».'
    reason: 'Греческое ζήσεται τῷ Θεῷ допускает разные оттенки дательного: направленность жизни к Богу либо статус живого перед Ним.'
lexical_decisions:
- source_word: ζήσῃ / ζήσεται
  choice: будешь жить / будет жить
  rationale: Сохранено прямое и повторное обещание жизни без уточнения её природы, которого нет в греческом тексте.
- source_word: φυλάξῃς / φυλάξῃ
  choice: соблюдёшь / соблюдёт
  rationale: Обычный современный русский эквивалент для соблюдения заповедей, передающий идею бережного исполнения.
- source_word: πορευθῇς ἐν αὐταῖς
  choice: будешь поступать по ним
  rationale: Естественно передаёт семитизированную метафору хождения в заповедях как постоянного образа жизни.
- source_word: ἀκούσας
  choice: услышит
  rationale: Причастный оборот преобразован в личную форму ради естественности русского синтаксиса; смысл предшествующего восприятия заповедей сохраняется.
- source_word: ζήσεται τῷ Θεῷ
  choice: будет жить для Бога
  rationale: Дательный τῷ Θεῷ сохранён в его наиболее прямом и богословски открытом значении цели или отношения, без замены на более истолковывающее «с Богом».
theological_decisions:
- issue: Условная связь между соблюдением заповедей и жизнью
  choice: «если соблюдёшь… будет жить»
  alternative: Ослабить условие формулировкой о признаке уже имеющейся жизни
  rationale: Греческий текст прямо выражает условие через ἐάν с сослагательным наклонением; его богословское напряжение не следует сглаживать.
- issue: Значение выражения ζήσεται τῷ Θεῷ
  choice: «будет жить для Бога»
  alternative: «будет жить с Богом» или «будет жив перед Богом»
  rationale: Перевод сохраняет дательный и не решает однозначно, обозначает ли он направленность жизни, отношение к Богу или жизнь в Божьих глазах.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Реплика оформлена ясно; повтор ключевых слов «жить» и «соблюдать» сохранён.
