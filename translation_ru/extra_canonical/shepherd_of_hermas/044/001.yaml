base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/044/001.yaml
  text: But I do not know whether these commandments can be kept by a human being, because they are very hard.
translation:
  language: ru
  text: Но я не знаю, может ли человек соблюдать эти заповеди, потому что они очень трудны.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλαχθῆναι
  choice: соблюдать
  rationale: В отношении заповедей глагол естественно передаётся как «соблюдать»; пассивная греческая конструкция преобразована в естественную русскую активную.
- source_word: ὑπὸ ἀνθρώπου
  choice: человек
  rationale: Родовое обозначение человека без уточнения пола; единственное число сохраняет форму и общий смысл оригинала.
- source_word: σκληραί
  choice: трудны
  rationale: В данном контексте речь о трудности исполнения заповедей; «суровы» было бы возможно буквально, но менее точно передавало бы практический смысл.
- source_word: λίαν
  choice: очень
  rationale: Прямо и естественно передаёт усилительное значение наречия.
theological_decisions:
- issue: Возможность исполнения заповедей человеком
  choice: 'Сохранено сомнение говорящего: «не знаю, может ли…»'
  alternative: Утвердить невозможность либо возможность исполнения
  rationale: Греческий текст выражает вопрос и не разрешает его внутри данного сегмента; богословское напряжение необходимо сохранить.
translation_notes:
  register: Современный литературный русский язык; ясная, сдержанная и достойная формулировка. Союз «Но» сохраняет связь с предшествующей репликой в родительском контексте.
