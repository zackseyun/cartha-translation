base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/044/002.yaml
  text: Answering, he says to me, “If you set before yourself that they can be kept, you will keep them easily, and they will not be hard. But if it has already arisen in your heart that they cannot be kept by a human being, you will not keep them.
translation:
  language: ru
  text: 'Он ответил мне: «Если ты поставишь себе целью соблюдать их, то легко соблюдёшь, и они не будут трудными. Но если в твоём сердце уже возникла мысль, что человек не может их соблюдать, то ты их не соблюдёшь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προθῇς
  choice: поставишь себе целью
  rationale: Передаёт волевое решение и внутреннее намерение, а не просто отвлечённое предположение.
- source_word: φυλαχθῆναι / φυλάξεις
  choice: соблюдать / соблюдёшь
  rationale: В контексте заповедей естественное русское соответствие со значением хранить и исполнять.
- source_word: σκληραί
  choice: трудными
  rationale: Здесь слово описывает трудность исполнения заповедей; буквальное «суровыми» звучало бы как характеристика их строгости.
- source_word: ἐπὶ τὴν καρδίαν σου ... ἀναβῇ
  choice: в твоём сердце ... возникла мысль
  rationale: Сохраняет образ сердца как средоточия внутреннего убеждения и естественно передаёт греческий оборот.
theological_decisions:
- issue: Возможность соблюдения заповедей человеком
  choice: что человек не может их соблюдать
  alternative: что они неисполнимы для человека
  rationale: Сохранена прямая формулировка источника без уточнения природы человеческой способности, благодати или безгрешного совершенства.
translation_notes:
  register: Современный литературный русский язык; речь наставительная и dignified, без архаизмов. Повтор глагола «соблюдать» сохранён как смысловой стержень оригинала.
