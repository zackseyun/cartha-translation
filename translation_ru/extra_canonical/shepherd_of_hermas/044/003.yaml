base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/044/003.yaml
  text: 'I say to you: if you do not keep these, but neglect them, do not follow the commandments of the devil, which are difficult and bitter and savage and licentious; and do not fear the devil, because he has no power against you. For I will be with you—I, the angel of repentance, who has mastery over him. The devil has only fear, but his fear has no force. Therefore do not fear him, and he will flee from you.”'
translation:
  language: ru
  text: '«Говорю тебе: если ты не соблюдёшь эти заповеди, а пренебрежёшь ими, не следуй заповедям дьявола — трудным, горьким, жестоким и распутным. И не бойтесь дьявола, потому что у него нет силы против вас. Ведь я буду с вами — я, ангел покаяния, имеющий власть над ним. У дьявола есть лишь страх, но в его страхе нет силы. Поэтому не бойтесь его, и он убежит от вас».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάσσω / τηρέω
  choice: соблюдать
  rationale: Передаёт исполнение заповедей естественным современным русским языком и сохраняет этический смысл исходного глагола.
- source_word: παρενθυμέομαι
  choice: пренебрегать
  rationale: В данном противопоставлении соблюдению обозначает сознательное невнимание или небрежение заповедями; буквальная передача была бы неясна.
- source_word: σκληραί / δύσκολοι
  choice: трудные
  rationale: В этом сегменте относится к заповедям дьявола и передаёт их тягостный, тяжёлый характер без излишней конкретизации.
- source_word: πικραί
  choice: горькие
  rationale: Сохранён образный характер греческого определения.
- source_word: ἀγρίαις
  choice: жестоким
  rationale: По отношению к заповедям естественнее, чем буквальное «диким», и передаёт суровую, свирепую направленность.
- source_word: ἀσελγέσι
  choice: распутным
  rationale: Передаёт нравственную разнузданность, выраженную ἀσέλγεια, без сужения только до одного вида поведения.
- source_word: κατακυριεύων
  choice: имеющий власть над ним
  rationale: Сохраняет сильное значение господства и превосходства над дьяволом, не добавляя пояснений.
- source_word: τόνον οὐκ ἔχει
  choice: нет силы
  rationale: В контексте страха означает отсутствие действенной мощи или напряжения; формулировка сохраняет смысл и звучит понятно по-русски.
theological_decisions:
- issue: Личность говорящего как «ангела покаяния»
  choice: Сохранено прямое самообозначение «Я, ангел покаяния» без отождествления с иной фигурой.
  alternative: Истолковать ангела как Христа, Святого Духа или особого небесного посланника.
  rationale: Исходный текст не разрешает вопрос об идентичности говорящего, поэтому перевод не должен вводить конфессиональное толкование.
- issue: Власть дьявола над адресатами
  choice: «У него нет силы против вас».
  alternative: «Он не имеет над вами власти».
  rationale: Выбранная формулировка ближе к δύναμις и не превращает утверждение об отсутствии действенной силы в более узкое юридическое понятие власти.
- issue: Фраза о страхе дьявола
  choice: «У дьявола есть лишь страх, но в его страхе нет силы».
  alternative: «Дьявол внушает только страх, но этот страх бессилен».
  rationale: 'Сохранена грамматическая и смысловая напряжённость оригинала: не уточняется, означает ли это страх, которым дьявол пугает людей, или страх как единственное его средство.'
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Сохранён переход от единственного числа («тебе», «ты») к множественному («вас»), присутствующий в греческом тексте. Повтор слова «страх» намеренно оставлен ради образа и неоднозначности оригинала.
