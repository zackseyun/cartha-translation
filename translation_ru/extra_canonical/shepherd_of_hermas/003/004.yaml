  terminology: «Бог сил», «разумение», «замысел», «провидение», «святая Церковь», «избранные» и «установления» уместны. «Бог сил» сохраняет форму исходного Θεὸς τῶν δυνάμεων, не подменяя Θεός словом «Господь».
