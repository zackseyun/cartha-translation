  source_fidelity: 'В целом перевод точно передаёт структуру и образы греческого текста: творение мира, украшение творения, утверждение неба, основание земли на водах, создание и благословение Церкви, преобразование космоса ради избранных и условие соблюдения Божьих установлений. Однако в заключительной части следует яснее передать повтор ἐπαγγελίαν ἣν ἐπηγγείλατο («обещание, которое Он обещал») и отнести «с великой славой и радостью» к этому обещанию, а не к не вполне определённому «данному».'
