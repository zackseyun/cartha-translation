base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/004.yaml
  text: “Behold, the God of hosts, who by his invisible and mighty power and by his great understanding created the world, and by his glorious counsel adorned his creation with beauty, and by his mighty word fixed the heaven and founded the earth upon the waters, and by his own wisdom and providence created his holy church, which also he blessed—behold, he is moving the heavens and the mountains and the hills and the seas, and all things become level for his elect, in order that he may give to them the promise which he promised with much glory and joy, if they keep the statutes of God which they received with great faith.”
translation:
  language: ru
  text: Вот Бог сил, который невидимой и могущественной силой Своей и великим разумением Своим сотворил мир, славным замыслом Своим украсил творение красотой, могущественным словом утвердил небо и основал землю на водах, а собственной мудростью и провидением создал святую Церковь Свою и благословил её. Вот, Он сдвигает небеса, горы, холмы и моря, и всё становится ровным для избранных Его, чтобы исполнить для них обещание, которое Он обещал им с великой славой и радостью, если они будут соблюдать установления Бога, которые приняли с великой верой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεὸς τῶν δυνάμεων
  choice: Бог сил
  rationale: Формально передаёт греческое выражение без сужения δυνάμεις до одного возможного смысла («воинства»); сохраняет возвышенный библейский регистр.
- source_word: συνέσει
  choice: разумением
  rationale: Передаёт способность понимать и постигать; «разумение» уместно в достоинственном религиозном регистре и отличается от последующего «мудростью» для σοφίᾳ.
- source_word: βουλῇ
  choice: замыслом
  rationale: В данном контексте обозначает творческий совет или намерение; «замыслом» естественно сочетается с украшением творения.
- source_word: περιθεὶς τὴν εὐπρέπειαν τῇ κτίσει αὐτοῦ
  choice: украсил творение
  rationale: Естественно передаёт буквальный образ «облёк/окружил творение красотой», не утяжеляя русскую фразу.
- source_word: πήξας
  choice: утвердил
  rationale: Сохраняет космогонический смысл прочного установления неба и библейскую стилистику.
- source_word: προνοίᾳ
  choice: провидением
  rationale: Передаёт предусмотрительную заботу и управление; это традиционный, но понятный русский эквивалент в богословском контексте.
- source_word: μεθίστησιν
  choice: сдвигает
  rationale: Глагол означает перемещение или устранение с прежнего места; «сдвигает» сохраняет конкретный космический образ, не истолковывая его как уничтожение.
- source_word: ὁμαλὰ γίνεται
  choice: становится ровным
  rationale: Сохраняет образ выравнивания препятствий перед избранными.
- source_word: νόμιμα
  choice: установления
  rationale: Передаёт предписанные нормы без чрезмерно юридического оттенка «законов» и без конфессиональной конкретизации.
theological_decisions:
- issue: Значение титула Θεὸς τῶν δυνάμεων
  choice: Бог сил
  alternative: Бог воинств / Господь сил
  rationale: Греческий текст имеет Θεός, а не Κύριος, и допускает более широкое понимание δυνάμεις, чем только небесные воинства.
- issue: Условность получения обещания
  choice: 'сохранено прямое условие: «если они будут соблюдать»'
  alternative: переформулировать как уверенность или причинное утверждение
  rationale: ἐὰν с сослагательной формой явно выражает условие; богословское напряжение между обещанием и послушанием не следует сглаживать.
- issue: Объект глагола ἀποδῷ
  choice: «исполнить для них обещание»
  alternative: «воздать им обещание» / «дать им обещанное»
  rationale: Буквальное сочетание «дать обещание, которое обещал» по-русски неестественно; выбранная формулировка сохраняет смысл осуществления ранее данного обещания.
- issue: ἡ ἁγία ἐκκλησία αὐτοῦ
  choice: «святую Церковь Свою»
  alternative: «святое собрание Своё»
  rationale: В раннехристианском контексте речь идёт о Церкви; написание с прописной буквы помогает обозначить общность, не добавляя конфессиональной идентификации.
translation_notes:
  register: Современный литературный русский с достоинственным, умеренно библейским ритмом. Длинный греческий период разделён точкой после благословения Церкви, чтобы текст оставался понятным обычному читателю; повтор «Вот» сохранён как важная риторическая рамка. Архаизмы и конфессионально маркированная терминология по возможности исключены.
