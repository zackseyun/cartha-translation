base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/003.yaml
  text: 'After she had stopped these words, she says to me, “Do you wish to hear me reading?” And I say, “I do, Lady.” She says to me, “Become a hearer, and hear the glories of God.” I heard great and wondrous things which I was not able to remember; for all the words were terrifying—things a human being is not able to bear. So I remembered the last words, for they were beneficial and gentle for us:'
translation:
  language: ru
  text: 'Когда она закончила говорить это, она сказала мне: «Хочешь послушать, как я читаю?» Я ответил: «Хочу, госпожа». Она сказала мне: «Стань слушателем и слушай о славе Бога[a]». Я услышал нечто великое и дивное, чего не смог запомнить, потому что все слова внушали трепет — человеку не под силу их вынести. Поэтому я запомнил последние слова: они были для нас полезны и кротки[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «славы Бога»; возможно также: «проявления славы Бога» или «славные деяния Бога».'
    reason: Сохраняет смысловую широту греческого множественного τὰς δόξας, не закрепляя в основном тексте одно толкование.
  - marker: b
    text: 'Или: «мягки», «нестрашны».'
    reason: Греческое ἥμερα означает мягкое, кроткое или укрощённое; здесь оно противопоставлено грозному и непереносимому.
lexical_decisions:
- source_word: μετὰ τὸ παῦσαι αὐτῆς τὰ ῥήματα ταῦτα
  choice: Когда она окончила говорить это
  rationale: Естественно передаёт греческую конструкцию со значением прекращения речи, не добавляя нового содержания.
- source_word: ἀναγινωσκούσης
  choice: как я читаю
  rationale: Причастие относится к говорящей женщине и означает чтение вслух.
- source_word: Γενοῦ ἀκροατὴς καὶ ἄκουε
  choice: Стань слушателем и внимай
  rationale: Сохранены два отдельных повеления и риторическое усиление оригинала; «внимай» звучит естественно и достойно.
- source_word: τὰς δόξας τοῦ Θεοῦ
  choice: славным деяниям Бога
  rationale: Множественное δόξας может обозначать проявления Божьей славы или славные дела; выражение передано понятно, а буквальная неоднозначность отмечена в сноске.
- source_word: μεγάλως καὶ θαυμαστῶς
  choice: нечто великое и дивное
  rationale: Наречия в контексте описывают содержание услышанного; русская субстантивированная конструкция яснее буквального «велико и дивно».
- source_word: ἔκφρικτα
  choice: внушающими трепет
  rationale: Передаёт сочетание ужаса, благоговейного потрясения и невыразимой грозности, не сужая смысл до простого страха.
- source_word: βαστάσαι
  choice: вынести
  rationale: В данном контексте означает быть способным выдержать или понести услышанное.
- source_word: σύμφορα καὶ ἥμερα
  choice: полезны и кротки
  rationale: 'Сохранены оба определения: первое указывает на пользу, второе — на мягкий, нестрашный характер слов.'
theological_decisions:
- issue: Значение выражения τὰς δόξας τοῦ Θεοῦ
  choice: славные деяния Бога
  alternative: проявления славы Бога / славу Бога
  rationale: Множественное число допускает понимание как славных проявлений или дел Бога. Основной текст выбран ради естественности, а смысловая широта сохранена в сноске.
- issue: 'Характер небесных слов: ἔκφρικτα'
  choice: внушающие трепет
  alternative: ужасные / страшные / неизреченно грозные
  rationale: Такой перевод сохраняет напряжение между страхом и благоговением и не приписывает словам нравственно отрицательного характера.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского повествования. Диалог передан просто и ясно; риторическое повторение «слушатель — внимай» сохранено. Архаизмы сведены к минимуму, но слова «госпожа», «дивное» и «кротки» поддерживают возвышенный регистр.
