base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/001.yaml
  text: But it is not for this that God is angry with you, but so that you may turn back your household, which has sinned against the Lord and against us, their parents. Yet, being fond of your children, you did not admonish your household, but you let it be grievously ruined; for this the Lord is angry with you. But he will heal all the past evils in your household; for because of their sins and lawless deeds you yourself were ruined by worldly affairs.
translation:
  language: ru
  text: Но Бог гневается на тебя не за это, а чтобы ты обратил к Господу и к нам, его родителям, свой дом[a], согрешивший против Господа и против нас. Но ты, любя своих детей, не вразумлял свой дом, а дал ему тяжко погибнуть. Поэтому Господь гневается на тебя. Но Он исцелит всё прежнее зло в твоём доме, ибо из-за их грехов и беззаконий ты сам был разорён житейскими делами[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Здесь «дом» означает семейство, домашних, а не здание.
    reason: Греческое οἶκος в данном контексте обозначает домашних как единое целое; поэтому далее употреблено «его родителям».
  - marker: b
    text: 'Греческое выражение допускает оттенки: быть разорённым, погубленным или потерпеть ущерб вследствие земных, в том числе хозяйственных, дел.'
    reason: Сочетание κατεφθάρης ἀπὸ τῶν βιωτικῶν πράξεων не уточняет вид понесённого ущерба.
lexical_decisions:
- source_word: οἶκος
  choice: дом
  rationale: В контексте слово обозначает не здание, а всё семейство Ерма; «дом» сохраняет библейскую образность и естественно звучит по-русски при пояснении.
- source_word: ἐπιστρέψῃς
  choice: обратил
  rationale: Глагол выражает возвращение или поворот к должному пути; «обратил» сохраняет нравственно-религиозный оттенок без добавления отсутствующего дополнения.
- source_word: ἐνουθέτεις
  choice: вразумлял
  rationale: Передаёт наставление с предостережением и исправительной целью, а не просто сообщение сведений.
- source_word: καταφθαρῆναι δεινῶς
  choice: дошёл до ужасного разложения
  rationale: Сохраняет усиленное значение глубокого нравственного упадка; русский оборот избегает неясного буквального «быть погубленным».
- source_word: ἰάσεται
  choice: исцелит
  rationale: Сохраняет намеренную метафору исцеления применительно к злу, случившемуся в семье.
- source_word: βιωτικῶν πράξεων
  choice: житейских делах
  rationale: Охватывает земные, практические и хозяйственные занятия; контекст допускает, но не требует более узкого значения имущества или торговли.
theological_decisions:
- issue: Соотношение Божьего гнева и цели исправления
  choice: «гневается… для того, чтобы ты обратил»
  alternative: «гневается не из-за этого, но потому, что ты не обратил»
  rationale: Греческое ἵνα формально выражает цель. Перевод сохраняет напряжение между гневом и его исправительной целью, не превращая цель в новую причину.
- issue: Обещание исцеления семейного зла
  choice: «Он исцелит всё прежнее зло»
  alternative: «Он устранит все прежние беды»
  rationale: Сохранена метафора ἰάσεται и не уточняется, идёт ли речь преимущественно о нравственном повреждении или о его последствиях.
- issue: Причинная связь между грехами детей и крахом Ерма
  choice: «из-за их грехов и беззаконий»
  alternative: «вследствие их грехов и беззаконий»
  rationale: Прямо передаёт διὰ с винительным, не вводя дополнительной доктринальной схемы о вменении чужой вины.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис упрощён ровно настолько, чтобы длинная греческая фраза оставалась понятной; сохранены повторы «дом», переход от «Бог» к «Господь» и образ исцеления.
