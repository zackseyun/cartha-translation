revisions:
- from: Но Бог гневается на тебя не за это, а для того, чтобы ты обратил свой дом[a], согрешивший против Господа и против нас, их родителей. Однако ты, любя своих детей, не вразумлял свой дом, а допустил, чтобы он дошёл до ужасного разложения. Вот за это Господь гневается на тебя. Но Он исцелит всё прежнее зло в твоём доме, ведь из-за их грехов и беззаконий ты и сам потерпел крах в житейских делах[b].
  to: Но Бог гневается на тебя не за это, а чтобы ты обратил к Господу и к нам, его родителям, свой дом[a], согрешивший против Господа и против нас. Но ты, любя своих детей, не вразумлял свой дом, а дал ему тяжко погибнуть. Поэтому Господь гневается на тебя. Но Он исцелит всё прежнее зло в твоём доме, ибо из-за их грехов и беззаконий ты сам был разорён житейскими делами[b].
  rationale: Устранено сужение καταφθαρῆναι до исключительно нравственного «разложения»; вместо этого сохранён широкий и сильный образ тяжёлой гибели. «Потерпел крах» заменено на «был разорён», более нейтральное и близкое к греческому. Перестроено первое предложение, чтобы направление обращения — к Господу и к говорящим «родителям» — было выражено непосредственно, как в греческом εἰς.
