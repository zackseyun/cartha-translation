base_translation:
  language: en
  yaml_path: translation/extra_canonical/shepherd_of_hermas/003/002.yaml
  text: But the Lord’s abundant compassion has had mercy on you and your household, and he will strengthen you and establish you in his glory. Only do not be slothful, but take heart and strengthen your household. For, as the blacksmith hammering his work masters the thing he intends, so also the righteous word spoken daily prevails over every wickedness. Do not, therefore, cease admonishing your children; for I know that if they repent with their whole heart, they will be written in the books of life with the holy ones.
translation:
  language: ru
  text: 'Но великое милосердие Господа помиловало тебя и твой дом; Он укрепит тебя и утвердит в Своей славе. Только не будь нерадив, но мужайся и укрепляй свой дом. Ведь как кузнец, куя своё изделие, добивается того, чего хочет, так и праведное слово, звучащее каждый день, одолевает всякое зло. Поэтому не переставай вразумлять своих детей. Ибо я знаю: если они покаются всем сердцем, то будут вписаны в книги жизни вместе со святыми.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ πολυσπλαγχνία τοῦ Κυρίου
  choice: великое милосердие Господа
  rationale: Передаёт усиленное значение редкого существительного πολυσπλαγχνία как глубокой и обильной сострадательности, сохраняя естественность современного русского языка.
- source_word: τὸν οἶκόν σου
  choice: твой дом
  rationale: οἶκος здесь обозначает домашних, семью как единое целое; «дом» сохраняет образ и соответствует повторному употреблению в отрывке.
- source_word: ἰσχυροποιήσει / ἰσχυροποίει
  choice: укрепит / укрепляй
  rationale: Сохраняет лексический повтор греческого текста и различие между Божьим действием и поручением Ерму.
- source_word: μὴ ῥαθυμήσῃς
  choice: не будь нерадив
  rationale: ῥαθυμέω указывает на беспечность, вялость или пренебрежение обязанностью; «нерадив» передаёт нравственно-практический оттенок без излишнего усиления.
- source_word: εὐψύχει
  choice: мужайся
  rationale: Краткий естественный императив, передающий призыв сохранять бодрость и мужество.
- source_word: ὁ χαλκεὺς
  choice: кузнец
  rationale: В данном образе обозначает ремесленника, обрабатывающего металл молотом; общеупотребительное «кузнец» естественнее буквального «медник».
- source_word: περιγίνεται
  choice: добивается / одолевает
  rationale: 'Глагол означает достижение превосходства или успеха. Контекст требует разных естественных соответствий: кузнец достигает желаемого результата, а праведное слово одолевает зло.'
- source_word: ὁ λόγος ὁ καθημερινὸς ὁ δίκαιος
  choice: праведное слово, звучащее каждый день
  rationale: Сохраняет характеристику слова как праведного и ежедневного, при этом ясно выражает подразумеваемое регулярное наставление.
- source_word: νουθετῶν
  choice: вразумлять
  rationale: Передаёт наставление с исправляющим и предостерегающим оттенком.
- source_word: ἐγγραφήσονται εἰς τὰς βίβλους τῆς ζωῆς
  choice: будут вписаны в книги жизни
  rationale: Сохраняет пассивную форму, множественное число «книги» и традиционный библейский образ без уточнения исполнителя действия.
theological_decisions:
- issue: Соотношение Божьего укрепления и человеческой ответственности
  choice: Сохранены рядом обещание «Он укрепит тебя» и повеление «укрепляй свой дом».
  alternative: Сгладить повтор, представив укрепление дома исключительно Божьим или исключительно человеческим действием.
  rationale: Греческий текст намеренно сочетает Божье действие с обязанностью Ерма; перевод не должен устранять это напряжение.
- issue: Условие покаяния и запись в книгах жизни
  choice: 'Сохранена условная конструкция: «если они покаются всем сердцем, то будут вписаны».'
  alternative: Передать запись как уже гарантированный факт либо добавить конфессиональное объяснение её связи со спасением.
  rationale: Исходный текст формулирует условное утверждение и не разъясняет его систематически; перевод сохраняет пределы сказанного.
- issue: Число в образе книг жизни
  choice: «в книги жизни».
  alternative: «в книгу жизни».
  rationale: В греческом стоит множественное число βίβλους, поэтому оно сохранено, несмотря на более привычную русскую библейскую формулу в единственном числе.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Синтаксис умеренно торжественный, но доступный; сохранены ключевые повторы «укрепит / укрепляй» и «твой дом». Архаизмы сведены к понятным словам библейского регистра («мужайся», «вразумлять»).
