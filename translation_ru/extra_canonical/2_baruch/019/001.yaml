  naturalness: «И он ответил и сказал мне» несколько формульно, но естественно для умеренно торжественного перевода древнего диалога и точнее сохраняет оба сирийских глагола. Фраза с многоточием корректно отмечает обрыв предоставленного текста.
  terminology: Специальных богословских терминов и имён нет. Строчная буква в «он» сохраняет неопределённость, не приписывая тексту явно названного божественного говорящего.
