lexical_decisions:
- source_word: ܘܥܢܐ ܘܐܡܪ ܠܝ
  choice: И Он ответил мне
  rationale: Обычная сирийская формула ответа передана естественно и без добавочного усиления; местоимение указывает на говорящего в продолжающемся диалоге.
- source_word: ܡܛܠ ܗܢܐ
  choice: Поэтому
  rationale: Кратко и ясно сохраняет причинно-следственную связь с предшествующими словами.
- source_word: ܒܗܘ ܙܒܢܐ
  choice: в то время
  rationale: Сохраняет явное временное указание и несколько торжественный повествовательный регистр.
- source_word: ܐܡܝܪ
  choice: было сказано
  rationale: Безлично-пассивная передача сохраняет форму сирийского текста и не вводит не названного в нём говорящего.
theological_decisions:
- issue: Определение говорящего в начальной формуле
  choice: Говорящий обозначен местоимением «Он» как участник продолжающегося диалога, без дополнительного именования.
  alternative: 'Назвать говорящего Богом или передать фразу без явного местоимения: «И ответил мне».'
  rationale: Контекст указывает на конкретного собеседника, но данный фрагмент не называет его; поэтому перевод сохраняет связность и не добавляет титула.
- issue: Субъект выражения «было сказано»
  choice: Сохранена безличная пассивная конструкция.
  alternative: «Я сказал» или «было возвещено Богом».
  rationale: Сирийское ܐܡܝܪ не уточняет деятеля, и преждевременная конкретизация сняла бы подлинную неопределённость оборванной фразы.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном. Многоточие отражает незавершённость текста стиха в предоставленном источнике, а не добавленную паузу.
