  text: Therefore, mourn for Zion, and sigh for Jerusalem.
translation:
  language: ru
  text: Итак, скорбите о Сионе и вздыхайте об Иерусалиме.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В предоставленном сирийском фрагменте соответствующая строка не сохранилась из-за смещения границ главы: фрагмент содержит материал соседнего раздела. Перевод данного стиха следует контрольному чтению, указанному в проверенной английской редакции.'
    reason: Несоответствие границ исходного фрагмента целевому стиху.
lexical_decisions:
- source_word: mourn / sigh (контрольное чтение; соответствующая сирийская строка отсутствует в предоставленном фрагменте)
  choice: скорбите / вздыхайте
  rationale: 'Сохранены два разных, но близких выражения скорби: первое обозначает плач о Сионе, второе — тяжёлое сокрушение об Иерусалиме.'
- source_word: therefore (контрольное чтение)
  choice: итак
  rationale: Краткая связка естественно передаёт вывод из предшествующего рассуждения и подходит для современного литературного русского языка.
- source_word: Zion / Jerusalem
  choice: Сион / Иерусалим
  rationale: Сохранён поэтический параллелизм двух традиционных названий святого города без их отождествления в одной формулировке.
theological_decisions:
- issue: Соотношение Сиона и Иерусалима
  choice: Сохранить оба наименования в параллельных строках
  alternative: Передать оба как одно обобщённое обозначение святого города
  rationale: Текст намеренно ставит Сион и Иерусалим рядом; перевод не устраняет этот поэтический и богословский параллелизм.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным ритмом. «Вздыхайте» предпочтено более архаичному «воздыхайте»; параллелизм двух повелений сохранён.
