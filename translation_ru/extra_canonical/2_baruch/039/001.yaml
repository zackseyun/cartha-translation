  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܥܢܐ ܘܐܡܪ ܠܝ
  choice: И он сказал мне в ответ
  rationale: Сирийская парная формула буквально означает «и он ответил и сказал мне». Русское «сказал мне в ответ» естественно передаёт оба глагола без тяжеловесного повтора.
- source_word: ܒܪܡ
  choice: однако
  rationale: Союз сохраняет переходно-противительный оттенок исходного текста; более сильное «но» здесь звучало бы резче, а его опущение устранило бы явную связку.
- source_word: ܦܘܫܩܗ
  choice: толкование
  rationale: Слово обозначает объяснение или истолкование символического видения. «Толкование» соответствует апокалиптическому контексту и современному литературному русскому.
- source_word: ܚܙܘܐ
  choice: видение
  rationale: Прямой и устойчивый русский эквивалент для сверхъестественного видения; он сохраняет жанровую окраску текста.
