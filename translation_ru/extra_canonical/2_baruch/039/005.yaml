  yaml_path: translation/extra_canonical/2_baruch/039/005.yaml
  text: And after these a fourth kingdom will arise, whose power will be harsher and worse than those that were before it. It will rule for many times like the forests of the plain, and it will hold the times in its grasp and lift itself up more than the cedars of Lebanon.
translation:
  language: ru
  text: А после них восстанет четвёртое царство, власть которого будет суровее и злее, чем у прежних царств. Оно будет править многие времена, как леса на равнине; оно застанет многие времена и утвердится прочнее ливанских кедров.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܠܟܘܬܐ
  choice: царство
  rationale: Обычное соответствие сирийскому слову «царство, царская власть»; в контексте речь идёт о последовательности мировых царств.
- source_word: ܩܫܝܐ … ܒܝܫ
  choice: суровее и злее
  rationale: Передаёт два отрицательных определения силы или власти четвёртого царства, не сводя их к одному качеству.
- source_word: ܙܒ̈ܢܐ ܣܓܝ̈ܐܐ
  choice: многие времена
  rationale: Сохранено апокалиптическое и намеренно неопределённое обозначение длительности, а не введено точное число лет.
- source_word: ܥܒ̈ܐ ܕܦܩܥܬܐ
  choice: леса на равнине
  rationale: Сохранён необычный образ сирийского текста; «леса» передаёт множественное число, а «равнина» — ܦܩܥܬܐ.
- source_word: ܬܬܩܢ / контекстуальное чтение фразы о временах
  choice: удержится на долгие времена
  rationale: Русская формулировка передаёт устойчивость и длительность царства; она согласуется с контекстом, где рукописное чтение в этой строке текстологически не вполне ясно.
- source_word: ܬܬܪܝܡ ܝܬܝܪ ܡܢ ܐܪ̈ܙܐ ܕܠܒܢܢ
  choice: превознесётся выше ливанских кедров
  rationale: Сохраняет пространственный образ и оттенок надменного самовозвышения.
theological_decisions:
- issue: Идентификация четвёртого царства
  choice: Оставить царство без исторического названия
  alternative: Назвать его Римом либо иной державой
  rationale: Сам стих царство не называет; перевод не должен превращать толкование апокалиптического образа в текст.
- issue: Смысл «многих времён»
  choice: Сохранить неопределённую продолжительность
  alternative: Истолковать как конкретные эпохи или годы
  rationale: Источник не задаёт точной хронологии, поэтому неоднозначность сохранена.
translation_notes:
  register: Современный литературный русский с торжественным апокалиптическим звучанием. Синтаксис сделан ясным для обычного читателя, но необычное сравнение с лесами на равнине и неопределённое «многие времена» сохранены.
