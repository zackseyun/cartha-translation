revisions:
- from: А после них восстанет четвёртое царство, власть которого будет суровее и злее, чем власть прежних царств. Оно будет господствовать многие времена, словно леса на равнине, удержится на долгие времена и превознесётся выше ливанских кедров.
  to: А после них восстанет четвёртое царство, власть которого будет суровее и злее, чем у прежних царств. Оно будет править многие времена, как леса на равнине; оно застанет многие времена и утвердится прочнее ливанских кедров.
  rationale: Перевод исправлен по представленному сирийскому тексту. Сохранены последовательность царств, два отрицательных определения власти, неопределённое «многие времена» и необычное сравнение с лесами равнины. Заключительные образы переданы без интерпретационного усиления и без следования английской формулировке там, где она не совпадает с сирийским источником.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T21:07:36Z'
review_pass:
  verdict: revise
  source_fidelity: 'Начало стиха передано верно: речь о четвёртом царстве, более суровом и худшем прежних. Однако заключительные глаголы в сирийском тексте говорят, что царство «увидит/застанет времена» и «утвердится (будет установлено) более [чем] ливанские кедры». Черновое «удержится на долгие времена» сливает эти два элемента и добавляет длительность, а «превознесётся» не соответствует имеющемуся сирийскому глаголу «утвердится». Английская аудиторская формулировка («hold the times in its grasp»; «lift itself up») расходится с представленным сирийским текстом; приоритет отдан источнику.'
  naturalness: Исправленный вариант сохраняет ясный современный литературный строй и торжественный регистр. «Застанет многие времена» естественно передаёт образное «увидит времена» без неясного буквального «увидит времена».
  terminology: «Царство», «восстанет», «суровее и злее», «ливанские кедры» уместны и последовательны. «Будет править» естественно передаёт сирийское «управлять/господствовать».
  issues:
  - severity: high
    issue: «удержится на долгие времена»
    rationale: Фраза не передаёт отдельно стоящих в источнике «увидит/застанет времена» и «утвердится» и вводит «долгие», которого в данном месте нет.
  - severity: high
    issue: «превознесётся выше ливанских кедров»
    rationale: Сирийский глагол ܬܬܩܢ означает «утвердится, будет установлено», а не «вознесётся/превознесётся». Это, вероятно, отражает английский аудит, но не первичный источник.
  revised_text: А после них восстанет четвёртое царство, власть которого будет суровее и злее, чем у прежних царств. Оно будет править многие времена, как леса на равнине; оно застанет многие времена и утвердится прочнее ливанских кедров.
  revised_footnotes: []
  revision_rationale: Перевод исправлен по представленному сирийскому тексту. Сохранены последовательность царств, два отрицательных определения власти, неопределённое «многие времена» и необычное сравнение с лесами равнины. Заключительные образы переданы без интерпретационного усиления и без следования английской формулировке там, где она не совпадает с сирийским источником.
