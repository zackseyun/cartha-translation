revisions:
- from: И оно спустя некоторое время будет уничтожено. Затем восстанет другое — третье [царство][a]; оно тоже будет властвовать в своё время, а потом будет уничтожено.
  to: И это царство тоже спустя некоторое время будет уничтожено. После него возникнет ещё одно, третье [царство]; оно тоже будет властвовать в своё время и будет уничтожено.
  rationale: Правка устраняет неясность местоимения в самостоятельном русском стихе и точнее передаёт обозначение следующего царства как «третьего». Повтор о его владычестве и уничтожении сохранён, как и временная ограниченность власти.
