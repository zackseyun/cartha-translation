  text: And that one too, after a time, will be destroyed, and another will arise, a third; and it too will rule in its time and will be destroyed.
translation:
  language: ru
  text: И это царство тоже спустя некоторое время будет уничтожено. После него возникнет ещё одно, третье [царство]; оно тоже будет властвовать в своё время и будет уничтожено.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܬܚܒܠ
  choice: будет уничтожено
  rationale: Глагол передаёт гибель или разрушение; в контексте сменяющих друг друга царств «будет уничтожено» естественно и сохраняет силу исходного выражения.
- source_word: ܬܩܘܡ
  choice: восстанет
  rationale: Буквально означает «встанет, поднимется»; применительно к царству указывает на его появление и возвышение.
- source_word: ܬܫܬܠܛ
  choice: будет властвовать
  rationale: Передаёт осуществление власти и господства царства в отведённый ему срок.
- source_word: ܒܙܒܢܗ
  choice: в своё время
  rationale: Сохраняет временную ограниченность господства, не уточняя, кем установлен этот срок.
theological_decisions:
- issue: Отождествление третьего царства
  choice: Не называть конкретную историческую державу
  alternative: Указать предполагаемую империю
  rationale: Сам стих даёт порядковое обозначение, но не прямое историческое имя; перевод не должен разрешать эту неопределённость за текст.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Повторение «будет уничтожено» сохранено как элемент симметрии при описании смены царств.
