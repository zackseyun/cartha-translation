  text: 'As for the great forest that you saw, with the lofty and rugged mountains surrounding it, this is the interpretation:'
translation:
  language: ru
  text: Что касается большого леса, который ты видел, окружённый высокими и суровыми горами, то вот его истолкование:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «вот слово»; в этом контексте — «вот истолкование».'
    reason: Сохраняет буквальное значение сирийского ܡܠܬܐ и поясняет его функцию во вступлении к объяснению видения.
lexical_decisions:
- source_word: ܥܒ̈ܐ ܣܓܝ̈ܐܐ
  choice: большой лес
  rationale: В контексте видения кедра и виноградной лозы речь идёт о лесной чаще; русский перевод «большой лес» естественно передаёт образ и согласуется с ближайшим контекстом.
- source_word: ܪ̈ܒܐ ܘܩܫܝܐ
  choice: высокими и крутыми
  rationale: Первое прилагательное означает «большие/великие», но применительно к горам естественно «высокие»; второе передаёт суровость и труднодоступность рельефа как «крутые».
- source_word: ܗܕܐ ܗܝ ܡܠܬܐ
  choice: вот его истолкование
  rationale: Буквально «вот слово», однако в формуле разъяснения видения ܡܠܬܐ обозначает смысл или истолкование увиденного.
theological_decisions:
- issue: Отнесение заключительной формулы к истолкованию видения
  choice: «вот его истолкование»
  alternative: «вот слово»
  rationale: Контекст прямо вводит объяснение символического видения. Перевод сохраняет функцию выражения, не добавляя определения царства из последующих стихов.
translation_notes:
  register: Современный литературный русский язык; синтаксис торжественный, но ясный. Образность исходного текста сохранена без конфессиональных уточнений и без переноса содержания последующих стихов.
