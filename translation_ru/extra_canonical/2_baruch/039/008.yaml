base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/039/008.yaml
  text: 'And when it is revealed, it will uproot the multitude of its host. And as for the tall cedar that you saw left from that forest, and the words that the vine spoke with it which you heard—this is the meaning:'
translation:
  language: ru
  text: 'Когда же она откроется, то искоренит множество её воинства. А высокий кедр, который ты видел оставшимся от того леса, и слова, которые виноградная лоза сказала ему и которые ты слышал,[a] означают следующее:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…сказала ему, — ты слышал эти слова. Вот их смысл:»'
    reason: Синтаксическое присоединение слов «которые ты слышал» допускает несколько способов пунктуационного членения.
lexical_decisions:
- source_word: ܐܬܓܠܝܬ
  choice: явится
  rationale: Передаёт раскрытие или явление ранее скрытого субъекта; в данном контексте естественнее, чем буквальное «будет открыта».
- source_word: ܬܥܩܘܪ
  choice: искоренит
  rationale: Сохраняет образ вырывания с корнем и смысл полного уничтожения.
- source_word: ܐܪܙܐ ܕܪܡܐ
  choice: высокий кедр
  rationale: Прямая и естественная передача существительного с определением.
- source_word: ܓܦܢ
  choice: виноградная лоза
  rationale: Уточнение «виноградная» делает образ однозначным для современного русского читателя.
- source_word: ܗܢܘ ܡܠܬܐ
  choice: означают следующее
  rationale: Формула вводит последующее истолкование видения; перевод передаёт её функцию, не опуская явного перехода.
theological_decisions:
- issue: Референт местоимения в выражении о воинстве
  choice: «его воинства»
  alternative: «её воинства» или «воинства из неё»
  rationale: Сохранено чтение консультационного слоя, не вводя дополнительного отождествления носителя воинства.
- issue: Переход к толкованию образа кедра и лозы
  choice: явная формула «означают следующее»
  alternative: одно тире без формулы
  rationale: Сирийский текст явно вводит смысл или истолкование; простое тире утратило бы эту смысловую связь.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Образы кедра, леса и виноградной лозы сохранены; заключительная формула толкования выражена явно.
