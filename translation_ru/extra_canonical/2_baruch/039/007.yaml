  yaml_path: translation/extra_canonical/2_baruch/039/007.yaml
  text: And it will happen that, when the time of its completion draws near for it to fall, then the reign of my Messiah will be revealed, which is like the fountain and like the vine.
translation:
  language: ru
  text: 'И будет так: когда приблизится время её конца, когда ей надлежит пасть, тогда откроется правление Моего Мессии[a], подобное источнику и виноградной лозе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «владычество Моего Мессии»; буквально: «начало Моего Мессии».'
    reason: Сирийское ܪܝܫܝܬܗ может означать «начало», а в данном контексте — также первенство, верховную власть или правление.
lexical_decisions:
- source_word: ܫܘܠܡܗ̇
  choice: её конца
  rationale: Слово обозначает завершение, окончание; в контексте речь идёт о конце названного ранее царства.
- source_word: ܕܐܦܠܐ
  choice: и ей предстоит пасть
  rationale: Передаёт явно присутствующий в сирийском тексте глагол «пасть» и сохраняет отнесение к царству.
- source_word: ܪܝܫܝܬܗ ܕܡܫܝܚܝ
  choice: владычество Моего Мессии
  rationale: В контексте выражение указывает на наступление власти или правления Мессии; «владычество» сохраняет связь с главенством, не сводя смысл к территории.
- source_word: ܡܒܘܥܐ
  choice: источнику
  rationale: Прямое и естественное соответствие образу бьющего или текущего источника.
- source_word: ܓܦܢ
  choice: виноградной лозе
  rationale: Точное обозначение лозы; уточнение «виноградной» делает образ ясным современному читателю.
theological_decisions:
- issue: Значение выражения ܪܝܫܝܬܗ ܕܡܫܝܚܝ
  choice: владычество Моего Мессии
  alternative: царство Моего Мессии; начало правления Моего Мессии
  rationale: Сирийское выражение допускает оттенки главенства, власти и начала правления. В контексте смены царств «владычество» естественно передаёт мессианскую власть, не уточняя спорно её форму или длительность.
translation_notes:
  register: Современный литературный русский язык; торжественный, но понятный повествовательный строй. Женское местоимение «её» сохраняет связь с упомянутым ранее царством. Союз «и» перед «ей предстоит пасть» ясно передаёт не опущенную в источнике идею падения.
