  verdict: revise
  source_fidelity: Смысл падения предшествующего царства передан и не опущен. Однако ܪܝܫܝܬܗ буквально имеет значение «начало», а в данном контексте также допускает «верховная власть/правление»; «владычество» возможно, но несколько сужает и стилистически утяжеляет выражение.
  naturalness: 'Фраза «когда приблизится время её конца и ей предстоит пасть» по-русски несколько неровна: обстоятельство времени логичнее связать с обоими элементами через «когда ей надлежит пасть». «Правление» — естественное современное литературное соответствие в контексте смены царств.'
  terminology: «Мессия» и образы «источник» и «виноградная лоза» переданы точно. «Правление Моего Мессии» согласуется с английской контрольной формулировкой «reign of my Messiah», при этом примечание должно сохранять буквальное значение «начало».
  issues:
  - severity: low
    issue: Не вполне естественная синтаксическая связь обстоятельства времени с падением царства.
    rationale: Сирийский текст включает приближение времени завершения и падение царства; русское «когда приблизится время её конца, когда ей надлежит пасть» передаёт эту связь яснее.
  - severity: low
    issue: Основной вариант «владычество» недостаточно прозрачно отражает буквальную многозначность ܪܝܫܝܬܗ.
    rationale: Термин может обозначать начало либо первенство/верховную власть. «Правление» уместно в контексте, а примечание сохраняет буквальный вариант без навязывания интерпретации.
  revised_text: 'И будет так: когда приблизится время её конца, когда ей надлежит пасть, тогда откроется правление Моего Мессии[a], подобное источнику и виноградной лозе.'
