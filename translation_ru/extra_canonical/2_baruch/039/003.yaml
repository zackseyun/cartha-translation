  source_fidelity: 'Основная синтаксическая и смысловая линия передана точно: царство, прежде разрушившее Сион, само будет разрушено и окажется в подчинении у последующего субъекта. Однако «тому, что» в русском языке обычно отсылает к предмету или явлению и ослабляет личное значение сирийского субстантивированного указательного оборота («тому, кто»).'
  naturalness: Фраза в целом литературна и ясна. Замена «тому, что придёт» на «тому, кто придёт» делает заключительный оборот естественным для современного русского без лишней конкретизации.
  terminology: «Царство», «Сион», «разрушить» и «подчинить» уместны и последовательно передают текст. Не следует добавлять «царству» или называть преемника, поскольку исходник этого прямо не делает.
