translation:
  language: ru
  text: И это царство, некогда разрушившее Сион, будет разрушено и подчинено тому, кто придёт после него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܚܒܠ
  choice: будет разрушено
  rationale: Страдательная форма передаёт гибель или сокрушение царства; «будет разрушено» естественно по-русски и сохраняет связь с тем же корнем в последующем определении.
- source_word: ܡܟܝ ܚܒܠܬ ܠܨܗܝܘܢ
  choice: некогда разрушившее Сион
  rationale: Оборот обозначает прежнее разрушительное действие этого царства по отношению к Сиону; причастная конструкция ясно связывает действие с царством.
- source_word: ܬܫܬܥܒܕ
  choice: будет подчинено
  rationale: Передаёт страдательное значение порабощения или подчинения без добавления политико-богословской конкретизации.
- source_word: ܠܗ̇ܘ ܕܐܬܐ ܒܬܪܗ
  choice: тому, что придёт после него
  rationale: 'Сохраняет неопределённость сирийского указательного оборота: преемник подразумевается, но прямо не назван царством.'
theological_decisions:
- issue: Кто именно придёт после разрушенного царства
  choice: «тому, что придёт после него»
  alternative: «царству, которое придёт после него»
  rationale: Источник не повторяет существительное «царство», поэтому перевод не уточняет сверх текста, хотя контекст допускает такое понимание.
translation_notes:
  register: Современный литературный русский язык; возвышенный, но понятный повествовательный стиль. Повтор «разрушено — разрушившее» намеренно сохраняет риторическую взаимность исходного текста.
