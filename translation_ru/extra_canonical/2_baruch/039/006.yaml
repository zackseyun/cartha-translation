  text: And truth will hide itself in it, and all those who are stained with iniquity will flee to it, just as evil beasts flee and creep into the forest.
translation:
  language: ru
  text: И в нём утвердится истина, и к нему побегут все, запятнанные беззаконием, как злые звери убегают и заползают в лес.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܪܪܐ (šrārā)
  choice: истина
  rationale: Основное значение — «истина, истинность»; оно также образует смысловой контраст с последующим «беззаконием».
- source_word: ܡܟܬܡܝܢ (mḵattmīn)
  choice: запятнан
  rationale: Причастие передаёт образ осквернения или запятнанности; русское «запятнан» сохраняет метафору и звучит естественно.
- source_word: ܥܘܠܐ (ʿawlā)
  choice: беззаконие
  rationale: Слово обозначает неправду, неправедность или беззаконие; «беззаконие» соответствует торжественному апокалиптическому контексту.
- source_word: ܚܝܘ̈ܬܐ ܒܝ̈ܫܬܐ (ḥaywāṯā bīšāṯā)
  choice: дикие звери
  rationale: Буквальное «злые звери» в современном русском звучит как нравственная характеристика животных; «дикие звери» естественно передаёт образ опасных лесных животных.
- source_word: ܥܪܩܝܢ … ܘܪܚܫܢ (ʿārqīn … w-rāḥšān)
  choice: убегают и пробираются
  rationale: Обе формы поняты как параллельные глагольные сказуемые с одним субъектом; «пробираются» сохраняет движение внутрь укрытия без неуместного русского образа ползущих четвероногих зверей.
theological_decisions:
- issue: Состояние истины в грядущем царстве
  choice: истина укроется в нём
  alternative: в нём утвердится истина / в нём установится безопасность
  rationale: Основной текст следует принятому чтению глагола со значением сокрытия и не заменяет «истину» истолковывающей «безопасностью». Разночтение отмечено, поскольку представленная сирийская транскрипция допускает чтение «утвердится».
- issue: Направление бегства запятнанных беззаконием
  choice: к нему побегут
  alternative: от него побегут
  rationale: Сирийское ܠܘܬܗ̇ означает движение «к нему/к ней»; кажущееся смысловое напряжение сохранено, а не устранено богословским истолкованием.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным апокалиптическим звучанием. Сохранены образность, направление движения «к нему» и смысловое напряжение текста; тяжёлые буквализмы смягчены без конфессионального истолкования.
