revisions:
- from: И истина укроется в нём[a], и к нему побегут все, кто запятнан беззаконием, как дикие звери убегают и пробираются в лес[b].
  to: И в нём утвердится истина, и к нему побегут все, запятнанные беззаконием, как злые звери убегают и заползают в лес.
  rationale: 'Текст исправлен по первичному сирийскому чтению: «истина утвердится в нём». Удалены сноски, поскольку они поддерживали не засвидетельствованное данным источником чтение и альтернативный синтаксис, тогда как в тексте ясно выражены два сказуемых при «злых зверях». Сохранены намеренно напряжённое направление «к нему» и образ запятнанности беззаконием.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T21:07:02Z'
review_pass:
  verdict: revise
  source_fidelity: 'Сирийский текст в представленном источнике читает ܘܬܬܩܝܡ ܒܗ̇ ܫܪܪܐ: «и истина утвердится/будет установлена в нём», а не «истина укроется». Глагол ܬܬܩܝܡ (от ܩܘܡ) требует передачи «утвердится», «установится» или «будет утверждена». Направление ܠܘܬܗ̇ сохранено: запятнанные беззаконием бегут именно к царству. ܚܝ̈ܘܬܐ ܒܝ̈ܫܬܐ буквально означает «злые звери», а ܪܚܫܢ — второй глагол «ползут/заползают», не существительное.'
  naturalness: «И в нём утвердится истина» и «все, запятнанные беззаконием, побегут к нему» естественны для современного литературного русского и сохраняют возвышенный регистр. «Злые звери» намеренно сохраняет образ оригинала; «заползают в лес» ясно передаёт второй глагол движения.
  terminology: 'ܫܪܪܐ передано как «истина», ܥܘܠܐ — как «беззаконие». Не следует вносить в основной текст «безопасность»: это не значение ܫܪܪܐ в данном чтении. Сноска о «укроется» и утверждение о соответствующем чтении в представленной сирийской строке не подтверждаются источником и должны быть удалены.'
  issues:
  - severity: high
    issue: Основной текст передаёт ܬܬܩܝܡ как «укроется».
    rationale: В источнике стоит форма от ܩܘܡ со значением «утвердится/будет установлено», а не глагол «скрыться». Английская аудиторская правка расходится с представленным первичным сирийским текстом.
  - severity: medium
    issue: Сноска a сообщает неподтверждённую текстовую неоднозначность и предлагает «утвердится» лишь как вариант.
    rationale: Для приведённого сирийского текста «утвердится» — прямой смысл глагола. Внесённое в сноску «укроется» не имеет опоры в предоставленном источнике.
  - severity: medium
    issue: «Дикие звери» смягчает ܒܝ̈ܫܬܐ («злые»), а «пробираются» ослабляет ܪܚܫܢ («ползут/заползают»).
    rationale: Без необходимости заменены содержательные элементы образа. Их можно передать по-русски без тяжеловесности.
  revised_text: И в нём утвердится истина, и к нему побегут все, запятнанные беззаконием, как злые звери убегают и заползают в лес.
  revised_footnotes: []
  revision_rationale: 'Текст исправлен по первичному сирийскому чтению: «истина утвердится в нём». Удалены сноски, поскольку они поддерживали не засвидетельствованное данным источником чтение и альтернативный синтаксис, тогда как в тексте ясно выражены два сказуемых при «злых зверях». Сохранены намеренно напряжённое направление «к нему» и образ запятнанности беззаконием.'
