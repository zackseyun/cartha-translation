base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/059/001.yaml
  text: 'Hear what the great cloud is that you saw ascending from the sea and going forth and covering this earth: it is the world which his power made when he considered making creation. And when the word went out from before him, the structure of the world stood forth, very small, and it was established according to what was sought for it to become.


    And as for the first black waters that you saw descending upon it from the cloud, this is the first sin, the transgression that the first Adam committed. For when he sinned, death was stirred up, though it was not in its time; and mourning was made known, and sorrows were prepared, and pain was created, and toil was completed, and greatness began to be brought low.


    And as for the last day, which was shown in a form and took on a likeness, know that the time will be examined, and the law of humanity will be measured, and its strength will be tested. Therefore Adam, while he was one who heard from God something of what was to be, considered the release of the dead that had been given, and what had been commanded him from God. He kept considering, and he devised five thoughts. For he made himself liable; he also made the angels liable. And even at that time when he was created, a vision was shown to him: the fierce beasts, and the elements with fire. Thus God gathered in Eden, in the likeness of those who were created.'
translation:
  language: ru
  text: '1 Выслушай, что означает великая туча, которую ты видел поднимающейся из моря, идущей вперёд и покрывающей эту землю: это мир, который сотворила Его сила, когда Он замыслил сотворить мироздание. И когда слово вышло от Него, возникло устроение мира — совсем малое — и оно стало таким, каким ему надлежало стать.


    А первые чёрные воды, которые ты видел нисходящими на него из тучи, — это первый грех, преступление, которое первым совершил Адам. Ибо, когда он согрешил, смерть пришла в движение, хотя её время ещё не настало; явился плач, были уготованы скорби, возникла боль, завершились труды, и величие начало умаляться.


    А о последнем дне, который был явлен в некоем образе и принял подобие, знай: время будет исследовано, мера человечества[a] будет отмерена, и сила его будет испытана. Итак, Адам, услышав от Бога нечто о том, что должно было произойти, размышлял об освобождении мёртвых[b], которое ему было дано, и о том, что было заповедано ему Богом. Он продолжал размышлять и задумал пять помыслов. Ибо он сделал виновным самого себя, а также ангелов[c]. И уже в то время, когда он был сотворён, ему было показано видение: свирепые звери и стихии вместе с огнём. Так Бог собрал в Эдеме, по подобию тех, кто был сотворён[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «норма человечества»; возможно также: «закон человечества».'
    reason: Сирийское ܢܘܡܫܐ допускает значения меры, нормы и закона.
  - marker: b
    text: Выражение неясно; возможно, речь идёт о воскресении мёртвых, но буквально — «освобождение мёртвых». Слова «которое ему было дано» в сирийском относятся к Адаму.
    reason: Не следует без достаточного основания догматически уточнять многозначное ܫܘܒܩܢܐ; синтаксическая связь последующих слов с Адамом сохранена.
  - marker: c
    text: 'Смысл труден: сирийский текст говорит, что Адам сделал виновными также ангелов.'
    reason: Фраза необычна и, возможно, текстуально нарушена, однако её существенная трудность должна быть видна читателю.
  - marker: d
    text: 'Заключительная фраза в сирийском тексте неясна; дословно: «Так Бог собрал в Эдеме, по подобию тех, кто был сотворён».'
    reason: Синтаксическая и смысловая связь заключительных слов неясна, поэтому буквальность и примечание предпочтительнее скрытого истолкования.
lexical_decisions:
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  choice: устройство мира
  rationale: Передаёт образ возникшего и устроенного миропорядка, не сужая значение до одного лишь начала или основания.
- source_word: ܚܛܗܐ / ܡܬܒܪܝܢܘܬܐ
  choice: первый грех, преступление
  rationale: Сохраняет двойное обозначение первородного проступка Адама и его усилительный характер.
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  choice: смерть пришла в движение
  rationale: Глагол означает приведение в действие или движение; перевод сохраняет причинную связь с грехом Адама.
- source_word: ܪܘܪܒܘܬܐ ܫܪܝܬ ܕܬܡܘܟ
  choice: величие начало умаляться
  rationale: Сохраняет как начало процесса, так и направленность вниз, выраженную сирийским текстом.
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  choice: мера человечества
  rationale: В контексте исследования времени, измерения и испытания это лучше сохраняет оценочный смысл, хотя возможно и значение нормы или закона.
- source_word: ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ
  choice: освобождение мёртвых
  rationale: Буквальный и богословски нейтральный вариант сохраняет неясность выражения и не подменяет его однозначно воскресением.
- source_word: ܡܚܝܒܢܘܗܝ
  choice: навлёк ответственность
  rationale: Передаёт судебный оттенок виновности или подотчётности, не делая трудное высказывание об ангелах более определённым, чем оригинал.
- source_word: ܚܝܘܬܐ ܡܪܝܪܬܐ
  choice: свирепые звери
  rationale: ܚܝܘܬܐ обозначает зверей или животных, а определение допускает значение свирепости; перевод соответствует контексту видения.
- source_word: ܐܣܛܘܟܣܐ
  choice: стихии
  rationale: Греческое заимствование обозначает космические элементы; «стихии» естественно и точно звучит по-русски.
- source_word: ܒܥܕܢ
  choice: в Эдеме
  rationale: Чтение как географическое указание на Эдем соответствует сирийской форме и контексту Адама.
theological_decisions:
- issue: Грех Адама и начало действия смерти
  choice: Смерть пришла в движение вследствие греха Адама прежде наступления её времени.
  alternative: Смерть лишь стала известна или упомянута.
  rationale: Сирийский текст выражает причинную связь и активацию смерти; перевод сохраняет эту силу, не добавляя более поздних догматических формулировок.
- issue: Ответственность ангелов
  choice: Сохранено трудное утверждение, что Адам навлёк ответственность также на ангелов.
  alternative: Считать строку испорченной либо ограничить ответственность ангелов ролью свидетелей.
  rationale: Переданный сирийский текст прямо упоминает ангелов; неясность отмечена, но не устранена толкованием.
- issue: Освобождение мёртвых
  choice: Оставлено буквальное выражение «освобождение мёртвых».
  alternative: «Воскресение мёртвых» или «прощение, относящееся к мёртвым».
  rationale: Точное богословское содержание выражения не вполне ясно, поэтому перевод не выбирает без достаточного основания более узкое учение.
- issue: Последний день
  choice: Переведено «последний день».
  alternative: «Последнее время».
  rationale: В источнике стоит ܝܘܡܐ, «день», тогда как слово «время» отдельно появляется далее; эсхатологическая конкретность сохранена.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным апокалиптическим звучанием. Сохранены повторения, причинные связи и резкие богословские формулировки источника; наиболее тёмные места не сглажены и снабжены краткими примечаниями.
