revisions:
- from: '1 Выслушай, что означает великая туча, которую ты видел поднимающейся из моря, идущей вперёд и покрывающей эту землю. Это — мир, который сотворила Его сила, когда Он замыслил создать творение. И когда слово вышло от Него, возникло устройство мира — совсем малое — и было устроено таким, каким ему надлежало стать.


    А первые чёрные воды, которые ты видел нисходящими на него из тучи, — это первый грех, преступление, которое вначале совершил первый Адам. Ибо, когда он согрешил, смерть пришла в движение, хотя её время ещё не настало; явился плач, были уготованы скорби, возникла боль, завершились труды, и величие начало умаляться.


    А о последнем дне, который был явлен в некоем образе и принял подобие, знай: время будет исследовано, мера человечества[a] будет отмерена, и сила его будет испытана. Итак, Адам, услышавший от Бога нечто о том, что должно было произойти, размышлял об освобождении мёртвых[b], которое было даровано, и о том, что было заповедано ему Богом. Он продолжал размышлять и задумал пять помыслов. Ибо он навлёк ответственность на самого себя, а также на ангелов[c]. И уже в то время, когда он был сотворён, ему было показано видение: свирепые звери и стихии вместе с огнём. Так Бог собрал в Эдеме, по подобию тех, кто был сотворён[d].'
