- source_word: ܘܗܘܐ
  choice: И случилось так
  rationale: Сохранён повествовательный переход исходного текста, но использована естественная для современного русского языка формулировка вместо архаичного «и было».
- source_word: ܡܢ ܒܬܪ ܝܘܡܐ ܫܒܝܥܝܐ
  choice: после седьмого дня
