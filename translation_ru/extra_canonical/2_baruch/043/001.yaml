  yaml_path: translation/extra_canonical/2_baruch/043/001.yaml
  text: 'But you, Baruch, fix your heart on what has been said to you, and understand the things shown to you, for much eternal consolation is yours.

    For from now on you will not again see the evil things that are now happening.

    Therefore go and command my people, and do not stir them up, because after these things, in the times to come, many days of affection will come. And I will make known to you and speak in your understanding.'
translation:
  language: ru
  text: А ты, Варух, утверди своё сердце в том, что было сказано тебе, и постигни то, что было показано тебе, потому что тебе дано великое вечное утешение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܩܢ ܠܒܟ
  choice: утверди своё сердце
  rationale: Сохраняет конкретный сирийский образ сердца и передаёт призыв к внутренней твёрдости; по-русски звучит естественно и торжественно.
- source_word: ܐܣܬܟܠ
  choice: постигни
  rationale: Передаёт не простое зрительное восприятие, а осмысленное понимание показанного откровения.
- source_word: ܒܘܝܐܐ ܣܓܝܐܐ ܕܒܠܥܕܡ
  choice: великое вечное утешение
  rationale: ܒܘܝܐܐ означает утешение или ободрение; ܣܓܝܐܐ здесь естественно передать как «великое», а заключительное определение — как указание на непреходящий характер утешения.
theological_decisions:
- issue: Характер обещанного Варуху утешения
  choice: великое вечное утешение
  alternative: многие вечные утешения; обильная надежда
  rationale: Формулировка сохраняет эсхатологический и утешительный смысл, не сводя обещание лишь к нынешнему эмоциональному облегчению и не добавляя деталей о посмертной участи Варуха.
