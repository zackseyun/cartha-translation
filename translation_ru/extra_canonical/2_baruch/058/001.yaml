lexical_decisions:
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  choice: начало мира
  rationale: Передаёт первичное возникновение и установление мира, не сводя выражение только к позднейшему устройству или основанию.
- source_word: ܚܛܗܐ ܡܬܒܪܝܢܘܬܐ
  choice: грех, первое преступление
  rationale: «Преступление» сохраняет смысл нарушения установленной границы; добавление «первое» естественно передаёт повтор ܩܕܡܝܬ рядом с упоминанием первого Адама.
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  choice: смерть была пробуждена
  rationale: Глагол обозначает приведение смерти в действие, а не просто её существование; «пробуждена» сохраняет образность оригинала.
- source_word: ܪܘܪܒܘܬܐ ܫܪܝܬ ܕܬܡܘܟ
  choice: величие начало умаляться
  rationale: Сохраняет мотив нисхождения и утраты величия после преступления Адама.
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  choice: мера человечества
  rationale: В параллели с исследованием времени и испытанием силы выражение имеет оценочный смысл; буквальный образ меры сохранён.
- source_word: ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ
  choice: освобождение мёртвых
  rationale: Трудное выражение оставлено относительно буквальным; оно не истолковано однозначно как воскресение или прощение.
- source_word: ܡܚܝܒܢܘܗܝ
  choice: сделал виновным
  rationale: Передаёт судебный оттенок возникшей виновности и ответственности, а не только внутреннее чувство вины.
- source_word: ܐܣܛܘܟܣܐ
  choice: стихии
  rationale: Греческое заимствование обозначает космические элементы; «стихии» — естественный и богословски нейтральный русский эквивалент.
theological_decisions:
- issue: Преступление Адама и приведение смерти в действие
  choice: Сохранена прямая причинная связь между грехом Адама, преждевременным пробуждением смерти и последующей человеческой скорбью.
  alternative: Истолковать этот ряд лишь как общее описание падшего состояния человечества.
  rationale: Сирийский текст прямо связывает поступок Адама со смертью, плачем, страданиями и тяжким трудом; перевод не ослабляет эту апокалиптическую причинность.
- issue: Освобождение мёртвых
  choice: Трудное выражение переведено буквально и снабжено примечанием с возможным лексическим оттенком.
  alternative: Однозначно истолковать его как воскресение мёртвых либо как прощение умерших.
  rationale: Синтаксис и значение ܫܘܒܩܢܐ здесь не позволяют безусловно выбрать конкретное догматическое толкование.
- issue: Виновность ангелов через Адама
  choice: 'Сохранено неожиданное утверждение текста: «через него виновными стали и ангелы».'
  alternative: Сгладить фразу или заменить ангелов людьми.
  rationale: Хотя богословская связь остаётся неясной, переданный сирийский текст явно упоминает ангелов, поэтому напряжение оригинала не устраняется.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным повествовательным регистром. Синтаксис разделён на удобочитаемые фразы, при этом сохранены повтор, параллелизм и необычные образы сирийского текста. Местоимения, относящиеся к Богу, оформлены с прописной буквы согласно распространённой русской библейской издательской практике.
