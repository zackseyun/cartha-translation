  text: Therefore I have now taken Zion away, so that I may visit the world more swiftly in its appointed time.
translation:
  language: ru
  text: Итак, теперь я отнял Сион, чтобы скорее посетить мир в назначенное для него время.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Посетить» здесь означает не просто прийти, а вмешаться в дела мира; в контексте это может подразумевать суд.
    reason: Поясняет непривычное современному читателю библейское употребление, не устраняя смысловую широту глагола.
lexical_decisions:
- source_word: ܡܟܝܠ
  choice: теперь
  rationale: Передаёт временно-выводное значение сирийского наречия в данном контексте; начальное «итак» выражает связь с предшествующей мыслью.
- source_word: ܢܣܒ / ܐܦܩ
  choice: отнял
  rationale: Сохраняет образ удаления Сиона, не уточняя сверх текста, идёт ли речь о разрушении города, лишении защиты или ином действии.
- source_word: ܨܗ / корень со значением посещения
  choice: посетить
  rationale: Намеренно сохраняет широкое библейское значение посещения как решительного божественного вмешательства, которое может включать суд, а не заменяет его однозначным «наказать».
- source_word: ܙܒܢܐ
  choice: время
  rationale: Естественный русский эквивалент для назначенного срока или момента.
theological_decisions:
- issue: Характер божественного «посещения» мира
  choice: посетить мир
  alternative: взыскать с мира / судить мир
  rationale: Более узкие варианты заранее разрешили бы смысл в пользу суда; формулировка сохраняет присущую библейскому понятию напряжённость между явлением, вмешательством и судом.
- issue: Референт выражения «назначенное для него время»
  choice: для него
  alternative: в назначенное время
  rationale: Местоименная связь с «миром» сохранена по консультационному тексту, хотя русская формулировка допускает понимание как установленного Богом срока для мира.
translation_notes:
  register: Современный литературный русский с торжественной, но ясной синтаксической формой. Местоимение «я» оставлено со строчной буквы согласно общим нормам современного русского текста; дополнительных конфессиональных оттенков не внесено.
