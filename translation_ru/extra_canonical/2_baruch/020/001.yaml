  yaml_path: translation/extra_canonical/2_baruch/020/001.yaml
  text: Therefore, behold, days are coming when the times will hasten more than the former ones, and the seasons will pass more swiftly than those that have gone by, and the years will move faster than the present years.
translation:
  language: ru
  text: Итак, вот, наступают дни, когда времена будут ускоряться сильнее, чем прежде, сроки будут проходить быстрее, чем минувшие, а годы — идти быстрее нынешних.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒ̈ܢܐ
  choice: времена / сроки
  rationale: В стихе повторяется временная лексика с параллельными, но различимыми обозначениями периодов; два русских соответствия сохраняют поэтическое нарастание и не сводят все члены к одному слову.
- source_word: ܫܢܝ̈ܐ
  choice: годы
  rationale: Прямое и естественное соответствие сирийскому обозначению лет.
- source_word: ܢܣܬܝܟ (чтение источника повреждено)
  choice: устремятся
  rationale: Контекст и контрольный перевод указывают на ускорение хода времён; «устремятся» естественно передаёт образ движения, не превращая его в строго техническое утверждение.
theological_decisions:
- issue: Характер ускорения времени
  choice: Сохранён образ ускоряющихся времён, сроков и лет
  alternative: Истолковать фразу как буквальное сокращение продолжительности дней
  rationale: Сирийский текст выражает движение временных периодов и не разъясняет механизм; перевод не добавляет космологического или эсхатологического толкования.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Тройной параллелизм оригинала сохранён; архаизмы и конфессионально окрашенные формулы не вводились.
