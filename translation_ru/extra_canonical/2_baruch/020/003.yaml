  text: And now, hold fast in your heart all that I command you, and seal it in the inner chambers of your mind.
translation:
  language: ru
  text: И теперь твёрдо храни в своём сердце всё, что Я повелеваю тебе, и запечатай это в тайниках своего разума.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: «сердце» (сирийский лексический эквивалент в восстанавливаемом тексте стиха)
  choice: в своём сердце
  rationale: Сохранён библейский антропологический образ сердца как средоточия внутренней памяти и воли; он естественен и понятен по-русски.
- source_word: «запечатай»
  choice: запечатай
  rationale: Передаёт образ надёжного сокрытия и сохранения без ослабления метафоры.
- source_word: «внутренние покои / тайники разума»
  choice: в тайниках своего разума
  rationale: Естественная русская метафора, сохраняющая и пространственный образ внутренних хранилищ, и связь с мыслительной способностью.
- source_word: «всё, что повелеваю тебе»
  choice: всё, что Я повелеваю тебе
  rationale: Сохраняет охват «всё» и силу повелительной речи; настоящее время соответствует непосредственному Божьему наставлению Варуху.
theological_decisions:
- issue: Обозначение говорящего как Бога
  choice: местоимение «Я» написано с прописной буквы
  alternative: строчная буква «я»
  rationale: В русском библейском регистре прописная буква ясно указывает на божественного говорящего, не добавляя отдельного богословского толкования.
- issue: Соотношение сердца и разума
  choice: 'сохранены оба различных образа: «сердце» и «разум»'
  alternative: объединить их как «в душе» или «в уме»
  rationale: Различение удерживает поэтический параллелизм и антропологическое напряжение исходной формулировки.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Формулировка следует представленному контрольному английскому слою там, где стих нельзя надёжно изолировать в обширном и местами нарушенном сирийском фрагменте; метафоры сердца, запечатывания и внутренних тайников сохранены без конфессионального истолкования.
