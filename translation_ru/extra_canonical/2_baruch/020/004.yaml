  text: Then I will show you the judgment of my might and my ways, which are past searching out.
translation:
  language: ru
  text: Тогда Я явлю тебе суд Моего могущества и Мои пути, которые неисследимы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܝܢܐ / judgment (контрольное чтение стиха)
  choice: суд
  rationale: Сохраняет судебный смысл выражения и не подменяет его более узкими вариантами вроде «приговора» или «правосудия».
- source_word: ܚܝܠܝ / my might (контрольное чтение стиха)
  choice: Моего могущества
  rationale: Передаёт Божью действенную силу в возвышенном, но понятном современном русском регистре.
- source_word: ܐܘܪ̈ܚܬܝ / my ways (контрольное чтение стиха)
  choice: Мои пути
  rationale: Сохраняет традиционную библейскую метафору Божьих действий и замыслов.
- source_word: past searching out / unsearchable (контрольное чтение стиха)
  choice: которые неисследимы
  rationale: Сохраняет характеристику путей как недоступных исчерпывающему человеческому постижению, не усиливая её до утверждения о полной непознаваемости.
theological_decisions:
- issue: Связь суда с Божьим могуществом
  choice: «суд Моего могущества»
  alternative: «суд, совершаемый Моей силой»
  rationale: Формулировка сохраняет сжатую и потенциально многозначную родительную конструкцию, не определяя без необходимости, означает ли она суд, исходящий от могущества, проявляющий могущество или принадлежащий ему.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским звучанием. Заглавные местоимения обозначают говорящего Бога. Синтаксис сохраняет параллельность двух объектов: суда и путей.'
