  yaml_path: translation/extra_canonical/2_baruch/020/006.yaml
  text: Afterward come to this place, and I will appear to you there and speak true things with you, and I will instruct you concerning the order of the times, for they are coming and will not delay.
translation:
  language: ru
  text: После этого приди на это место, и Я явлюсь тебе там, буду говорить с тобой об истинном и наставлю тебя относительно порядка времён, ибо они приближаются и не задержатся.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܪܝܪ̈ܬܐ
  choice: об истинном
  rationale: Передаёт субстантивированное множественное «истинные вещи / истины», не сужая смысл до одного лишь «правдивые слова».
- source_word: ܛܟܣܐ ܕܙܒ̈ܢܐ
  choice: порядке времён
  rationale: Сохраняет идею установленной последовательности или устройства грядущих периодов.
- source_word: ܐܬܝܢ
  choice: приближаются
  rationale: В данном эсхатологическом контексте естественно передаёт буквальное «приходят» применительно ко временам.
- source_word: ܠܐ ܢܘܚܪܘܢ
  choice: не замедлят
  rationale: Сохраняет смысл отсутствия промедления без уточнения срока или причины.
theological_decisions:
- issue: Содержание будущего откровения
  choice: «об истинном» и «о порядке времён» сохранены как два связанных, но не отождествлённых предмета речи и наставления
  alternative: Истолковать «истинное» исключительно как сведения о конце времён
  rationale: Текст не требует полного отождествления этих выражений; сохранение синтаксического различия не навязывает толкование.
- issue: Приход времён
  choice: Сохранена персонифицирующая формулировка «они приближаются и не замедлят»
  alternative: «их наступление уже близко»
  rationale: Более буквальная конструкция удерживает напряжённость и непосредственность исходного образа.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Заглавная «Я» указывает на говорящего Бога по русской издательской традиции, не добавляя имени или титула. Формулировки достаточно ясны для широкого читателя и не вносят конфессиональных уточнений.
