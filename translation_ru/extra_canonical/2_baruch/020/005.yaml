translation:
  language: ru
  text: 'Итак, пойди и освяти себя на семь дней: не ешь хлеба, не пей воды и ни с кем не разговаривай.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܩܕܫ (предполагаемая форма в стихе; «освяти/посвяти себя»)
  choice: освящай себя
  rationale: Сохраняет сакральный смысл самоотделения и подготовки перед Богом, не сводя выражение только к посту или нравственному очищению.
- source_word: ܫܒܥܐ ܝܘܡܝܢ («семь дней»)
  choice: семь дней
  rationale: Прямая и естественная передача длительности предписанного приготовления.
- source_word: ܠܚܡܐ («хлеб»)
  choice: хлеба
  rationale: Сохранён конкретный образ исходного предписания; его не следует расширять до «пищи», поскольку это устранило бы возможное различие между хлебом и иной пищей.
- source_word: ܡܝܐ («вода»)
  choice: воды
  rationale: Буквально передаёт строгость указанного воздержания.
- source_word: ܐܢܫ («человек; кто-либо»)
  choice: ни с кем
  rationale: Идиоматический современный русский эквивалент запрета говорить с каким-либо человеком.
theological_decisions:
- issue: Характер освящения
  choice: освящай себя
  alternative: очищай себя
  rationale: «Освящай» сохраняет религиозный смысл посвящения и отделения для встречи с Богом; «очищай» могло бы неоправданно сузить его до ритуальной или нравственной чистоты.
- issue: Объём запрета на пищу
  choice: не ешь хлеба
  alternative: ничего не ешь
  rationale: Сохранена формулировка о хлебе без расширения запрета, хотя общий контекст может подразумевать пост.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Повеления переданы ясно и ритмично; двоеточие объединяет три запрета как содержание семидневного освящения. Представленная сирийская страница не позволяет надёжно визуально выделить строку 20:5 из-за состояния и границ извлечённого фрагмента, поэтому формулировка сверена с предоставленным английским контрольным слоем и ожидаемой сирийской лексикой, без добавления отсутствующих толкований.
