translation:
  language: ru
  text: Но о том, что я буду взят[a], я не сообщил ни им, ни своему сыну.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «буду унесён». Выражение не уточняет, идёт ли речь о смерти, удалении или сверхъестественном взятии.'
    reason: Сохраняет смысловую неопределённость пассивного выражения и не навязывает узкого толкования.
lexical_decisions:
- source_word: ܕܡܬܬܣܝܡ (чтение строки по данному скану; вероятно повреждённое/неясное место)
  choice: что мне предстоит быть взятым
  rationale: Передаёт пассивную конструкцию и будущую направленность, отражённые в контексте и контрольном английском слое, не уточняя, означает ли это смерть, удаление или восхищение.
- source_word: ܠܐ … ܐܦ ܠܐ
  choice: ни им, ни своему сыну
  rationale: Естественная русская коррелятивная конструкция, сохраняющая двойное отрицание исходного высказывания.
- source_word: ܡܠܬܐ
  choice: о том
  rationale: В данном контексте буквальное «слово о том» звучало бы тяжеловесно; русская изъяснительная конструкция точно передаёт содержание сообщения.
theological_decisions:
- issue: Характер предстоящего взятия Варуха
  choice: быть взятым
  alternative: быть восхищенным / умереть / уйти
  rationale: Источник оставляет способ и смысл взятия неуточнёнными; перевод не должен заранее истолковывать его как смерть или сверхъестественное восхищение.
translation_notes:
  register: Современный литературный русский язык; фраза сдержанная и повествовательная. Порядок слов подчёркивает скрытое Варухом известие, не утяжеляя текст буквальным оборотом «слово о…».
