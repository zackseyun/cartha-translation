  naturalness: Текст краток, грамматически ясен и соответствует современному литературному русскому с уместным умеренно библейским регистром. Оборот «твёрдо держаться разумения» несколько возвышен, но естественен в данном регистре и не препятствует пониманию.
  terminology: «Закон» с прописной буквы оправдан контекстом израильского Закона. «Разумение» удачно сохраняет абстрактность английского audit trail и не превращает выражение в конфессионально нагруженный термин.
