translation:
  language: ru
  text: Но приготовьте свои сердца, чтобы слушать Закон и твёрдо держаться разумения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'ܠܒܘ̈ܬܟܘܢ (в предоставленном тексте распознано неуверенно: ܠܒܩ̈ܝܟܘܢ)'
  choice: свои сердца
  rationale: По контексту и параллельному свидетельству речь идёт о внутренней готовности слушателей; «сердца» сохраняет библейскую антропологию исходного выражения.
- source_word: ܕܬܫܡܥܘܢ
  choice: чтобы слушать
  rationale: Глагол может включать оттенок послушания, однако «слушать» сохраняет исходную многозначность и не усиливает её без необходимости.
- source_word: ܢܡܘܣܐ
  choice: Закон
  rationale: В контексте имеется в виду данный Израилю Закон, поэтому употреблена прописная буква.
- source_word: выражение о разумении (текст строки в предоставленной сирийской транскрипции повреждён)
  choice: твёрдо держаться разумения
  rationale: Формулировка следует контрольному смысловому свидетельству английского POB и сохраняет различие между слушанием Закона и удержанием разумения.
theological_decisions:
- issue: Связь слушания с послушанием
  choice: слушать Закон
  alternative: повиноваться Закону
  rationale: Сирийский глагол допускает оба оттенка; выбран более буквальный вариант, не устраняющий подразумеваемого призыва к послушанию.
- issue: Характер «разумения»
  choice: разумение
  alternative: понимание
  rationale: «Разумение» звучит достойно и по-библейски, но остаётся понятным современному читателю; оно не превращает выражение в обозначение особого учения или группы толкователей.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским регистром. Повеление передано ясно и сдержанно; подлинная смысловая широта глагола «слушать/повиноваться» сохранена.
