  text: 'And my son and the elders of the people answered and said to me,


    "Has the Mighty One humbled us so greatly as to take you from us so suddenly?'
translation:
  language: ru
  text: 'И мой сын и старейшины народа ответили мне:


    «Неужели Могущественный так смирил нас, чтобы столь внезапно забрать тебя у нас?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: Могущественный
  rationale: Передаёт устойчивый божественный титул со значением силы и могущества, не подменяя его другим именованием Бога.
- source_word: ܡܟܟܢ
  choice: смирил
  rationale: Сохраняет значение уничижения или приведения в смирение и естественно звучит в данном риторическом вопросе.
- source_word: ܫܠܝ
  choice: внезапно
  rationale: По контексту обозначает неожиданность и резкость предстоящего ухода Варуха.
theological_decisions:
- issue: Риторический вопрос о действии Бога
  choice: «Неужели Могущественный так смирил нас…?»
  alternative: «Разве Могущественный настолько унизил нас…?»
  rationale: Форма вопроса и напряжение жалобы сохранены; «смирил» передаёт смысл без чрезмерно отрицательной окраски слова «унизил».
translation_notes:
  register: Современный литературный русский; речь торжественная, но ясная. Синтаксическая двусмысленность риторического вопроса не превращена в категорическое утверждение.
