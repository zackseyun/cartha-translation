  source_fidelity: 'Сирийский текст передаёт условное обещание: «если вы будете делать/исполнять это, надежда будет покоиться для вас», с последующим указанием на «то (мн. ч.), что было сказано вам прежде». В черновике условие и образ «покоится надежда» переданы удачно, но относительное «та, о которой вам говорили» делает ранее сказанное сообщением именно о надежде. В источнике указание, вероятнее, относится к содержанию надежды — к прежде сказанному.'
