translation:
  language: ru
  text: Ибо если вы будете исполнять это, на вас почиет надежда — надежда на то, о чём вам говорили прежде.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܥܒܪܘܢ ܗܠܝܢ
  choice: будете исполнять это
  rationale: Буквально глагол может означать «пройдёте / совершите»; в данном увещевательном контексте речь идёт о выполнении ранее данных наставлений, поэтому естественное русское соответствие — «исполнять это».
- source_word: ܢܬܬܢܝܚ ܠܟܘܢ ܣܒܪܐ
  choice: на вас почиет надежда
  rationale: Сохранён образ надежды, которая «обретает покой / покоится» у адресатов; «почиет» передаёт возвышенный регистр и направленность конструкции ܠܟܘܢ.
- source_word: ܗܠܝܢ ܕܩܕܡܘ ܐܡܪܘ ܠܟܘܢ
  choice: та, о которой вам говорили прежде
  rationale: Фраза соотнесена с «надеждой» и передана естественной русской относительной конструкцией; наречное значение ܩܕܡܘ отражено словом «прежде».
theological_decisions:
- issue: Характер обещанной надежды
  choice: Не уточнять, относится ли «надежда» к избавлению, воскресению или иному будущему благу
  alternative: Назвать конкретное содержание надежды
  rationale: Сам стих оставляет содержание надежды нераскрытым; конкретизация внесла бы толкование, отсутствующее в исходной формулировке.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. Синтаксис сохранён кратким, а тире ясно связывает заключительную фразу с «надеждой».
