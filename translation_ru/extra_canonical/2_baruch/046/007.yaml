translation:
  language: ru
  text: И вы не впадёте в мучение, о котором вам было сказано заранее.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܦܠ
  choice: впадёте
  rationale: Сохраняет исходный образ «пасть/впасть», оставаясь естественным по-русски.
- source_word: ܬܘܝܒܘܬܐ
  choice: мучение
  rationale: В данном контексте обозначает ожидаемое бедствие или кару; «мучение» соответствует смыслу и консультационному английскому тексту, не уточняя природу наказания.
- source_word: ܕܩܕܡܘ ܐܡܪܘܗ ܠܟܘܢ
  choice: о котором вам было сказано заранее
  rationale: Передаёт значение предварительного возвещения без добавления явно не названного говорящего.
theological_decisions:
- issue: Характер предсказанного мучения
  choice: Не уточнять, является ли оно земным бедствием, судом или посмертным наказанием.
  alternative: Перевести как «кара» или «вечные муки».
  rationale: Стих сам по себе не определяет точную природу мучения; уточнение снимало бы сохраняемую источником неоднозначность.
translation_notes:
  register: Современный литературный русский; краткая, торжественная формулировка с сохранением исходного образа «впасть в мучение».
