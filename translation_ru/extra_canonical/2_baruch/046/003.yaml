translation:
  language: ru
  text: «Где же нам снова искать Закон, и кто поведёт нас из дома смерти к жизни?»
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܡܘܣܐ (nāmوسā)
  choice: Закон
  rationale: В контексте речь идёт о Божьем Законе как руководстве для Израиля; прописная буква естественно передаёт это значение по-русски.
- source_word: ܡܕܪܟܢ (madrəḵan)
  choice: выведет нас
  rationale: Форма обозначает того, кто направляет или ведёт. С направлением «к жизни» русское «выведет» естественно выражает переход из области смерти, не меняя образа.
- source_word: ܒܝܬ ܡܘܬܐ (bēṯ mawtā)
  choice: из дома смерти
  rationale: Сохраняется конкретный и напряжённый образ сирийского текста; английский консультационный слой подтверждает такое понимание.
- source_word: ܠܚܝ̈ܐ (ləḥayyē)
  choice: к жизни
  rationale: Предлог ܠ передаёт направленность к жизни; в русском единственное число «жизнь» здесь идиоматично.
theological_decisions:
- issue: Смысл слова «Закон»
  choice: Сохранено «Закон» без поясняющего богословского определения
  alternative: «закон Божий» или «Тора»
  rationale: Источник говорит просто о Законе; добавление определения сузило бы возможный смысл и внесло бы отсутствующую экспликацию.
- issue: Образ перехода от смерти к жизни
  choice: Сохранён образ «из дома смерти к жизни»
  alternative: «между смертью и жизнью» или «от смерти к жизни»
  rationale: Так перевод удерживает образность засвидетельствованного чтения и не сводит её к отвлечённому противопоставлению.
translation_notes:
  register: Современный литературный русский с торжественной, но ясной вопросительной интонацией. Параллелизм двух вопросов сохранён; архаизмы и конфессионально окрашенная терминология не использованы.
