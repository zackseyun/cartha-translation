  yaml_path: translation/extra_canonical/2_baruch/046/004.yaml
  text: 'And I said to them,

    "I cannot stand against the will of the Mighty One.

    Yet Israel will not lack a wise man,

    nor the seed of Jacob a son of the law.'
translation:
  language: ru
  text: 'И я сказал им:


    «Я не могу противостоять Могущественному.


    Но Израиль не останется без мудреца,


    и род Иакова — без сына Закона».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: Могущественный
  rationale: Передаёт титул со значением силы и могущества, сохраняя его как обозначение Бога без внесения дополнительной конфессиональной терминологии.
- source_word: ܚܟܝܡܐ
  choice: мудрец
  rationale: Естественно и кратко передаёт субстантивированное значение «мудрый человек».
- source_word: ܒܪ ܢܡܘܣܐ
  choice: сын Закона
  rationale: Сохраняет выразительную семитскую конструкцию и связь с Законом; более свободное «знаток Закона» устранило бы образность оригинала.
- source_word: ܓܢܣܗ ܕܝܥܩܘܒ
  choice: род Иакова
  rationale: ܓܢܣܐ обозначает род, племя или народ; «род Иакова» естественно в русском библейском регистре и не сужает выражение до биологического потомства.
theological_decisions:
- issue: Характер невозможности противостоять Могущественному
  choice: не могу противиться воле Могущественного
  alternative: не могу устоять перед Могущественным
  rationale: Контекст и древняя переводческая традиция указывают на невозможность идти против божественной воли; формулировка не объясняет, почему эта воля непреодолима, и потому не снимает богословского напряжения.
- issue: Статус выражения «сын Закона»
  choice: сохранить буквальный образ
  alternative: знаток/учитель Закона
  rationale: Оригинал не уточняет конкретную должность или функцию этого человека, поэтому буквальный образ позволяет сохранить смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллелизм двух последних строк сохранён; архаические формы и избыточно церковнославянская лексика не использованы.
