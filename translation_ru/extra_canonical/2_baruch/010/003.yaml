  text: But you, remain here in the desolation of Zion, and after these days I will show you what is to happen in the latter times.”
translation:
  language: ru
  text: А ты оставайся здесь, среди запустения Сиона, и по прошествии этих дней Я покажу тебе, чему предстоит произойти в последние времена».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܢܬ ܕܝܢ
  choice: А ты
  rationale: Передаёт контрастивное обращение без излишнего усиления.
- source_word: ܒܚܘܫܒܝܟ ܕܢܗܘܘܢ
  choice: оставайся здесь, среди запустения Сиона
  rationale: Строка в предоставленном сирийском фрагменте текстологически неясна и, вероятно, искажена при распознавании; перевод следует смыслу контрольного чтения, отражённого в аудированном английском слое.
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ ܝܘܡ̈ܬܐ
  choice: по прошествии этих дней
  rationale: Естественно и точно передаёт временную последовательность «после этих дней».
- source_word: ܡܕܡ ܕܥܬܝܕ ܕܢܓܕܫ
  choice: чему предстоит произойти
  rationale: Сохраняет безличный характер грядущего события и модальность предстояния.
- source_word: ܒܙܒܢܐ ܝܘܡ̈ܝܐ
  choice: в последние времена
  rationale: Контекстуально передаёт эсхатологическое временное обозначение, не конкретизируя его как единственный «конец света».
theological_decisions:
- issue: Характер грядущих событий
  choice: чему предстоит произойти в последние времена
  alternative: что случится при конце времён
  rationale: Выбрана формулировка, сохраняющая эсхатологическую направленность, но не отождествляющая выражение с определённой конфессиональной схемой конца мира.
- issue: Говорящий в формуле откровения
  choice: Я покажу тебе
  alternative: я покажу тебе
  rationale: Прописная буква указывает на Бога как говорящего согласно контексту, не добавляя имени или титула, отсутствующего в данной фразе.
translation_notes:
  register: Современный литературный русский язык; тон торжественный, но ясный. «Среди запустения Сиона» звучит естественнее буквального пространственного оборота и сохраняет образ разорённого города. Кавычка закрывает продолжающуюся прямую речь.
