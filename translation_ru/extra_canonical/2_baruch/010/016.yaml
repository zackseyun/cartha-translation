base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/016.yaml
  text: 'Or why should people again have children,

    or why should the seed of their nature again be named,

    when this mother lies desolate

    and her children have gone away into captivity?'
translation:
  language: ru
  text: 'И зачем людям снова рождать детей?


    Зачем же вновь называться семени их рода[a],


    когда эта мать лежит опустошённой,


    а её дети уведены в плен?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «зачем семени их природы (или: рода) вновь называться»; выражение может означать появление потомства на свет и продолжение рода.'
    reason: Формула оригинала необычна и допускает несколько близких смысловых оттенков, которые не следует молча сводить к одному.
lexical_decisions:
- source_word: ܐܢܫܐ ܕܡܘܠܕܝܢ
  choice: людям снова рождать детей
  rationale: Передаёт речь о людях, производящих потомство, естественным современным русским языком и согласуется с параллельной строкой.
- source_word: ܡ̈ܢܝ / семантически восстанавливаемая формула о семени природы
  choice: семени их рода
  rationale: «Род» по-русски естественно выражает природное происхождение и потомство, не устраняя образ семени.
- source_word: ܐܡܐ
  choice: эта мать
  rationale: Сохранена персонификация Сиона/Иерусалима как матери; имя не подставлено в основной текст, поскольку источник оставляет образ явным, но не называет его здесь прямо.
- source_word: ܐܬܬܒܝܘ
  choice: уведены в плен
  rationale: Глагол обозначает пленение; формулировка передаёт как состояние плена, так и насильственное удаление детей.
theological_decisions:
- issue: Отождествление «этой матери» с Сионом или Иерусалимом
  choice: сохранить «эта мать» без поясняющей подстановки
  alternative: «когда Сион, их мать, опустошён»
  rationale: Контекст делает отождествление понятным, но замена метафоры прямым названием сузила бы образ и добавила бы отсутствующее в строке уточнение.
- issue: Смысл выражения о том, что семя «получает имя»
  choice: сохранить буквальный образ с примечанием
  alternative: «зачем продолжаться их роду» или «зачем их потомству появляться на свет»
  rationale: Формула допускает оттенки рождения, признанного существования и продолжения рода; буквальная передача не снимает эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ритмом плача. Сохранены параллелизм, материнская персонификация города и намеренно необычный образ семени, получающего имя.
