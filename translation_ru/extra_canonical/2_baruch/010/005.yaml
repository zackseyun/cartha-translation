  text: 'And he went with the people, but I, Baruch, returned and sat before the gates of the temple, and I lifted up this lament over Zion and said:'
translation:
  language: ru
  text: 'И он пошёл с народом, а я, Варух, вернулся, сел перед воротами храма, произнёс этот плач о Сионе и сказал:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܢܐ ܕܝܢ ܒܪܘܟ
  choice: А я, Варух
  rationale: Сохраняет противопоставление предыдущему действующему лицу и естественно передаёт сирийскую именную конструкцию.
- source_word: 'ܐܦܟܬ (в предоставленной транскрипции: ܐܦܩܬ ܐܢܘܢ)'
  choice: вернулся
  rationale: По контексту и древней текстовой традиции здесь ожидается форма со значением «повернул назад, вернулся»; чтение предоставленной транскрипции буквально означало бы «я вывел их» и нарушало бы последовательность повествования.
- source_word: ܝܬܒܬ ܩܕܡ ܬܪ̈ܥܘܗܝ ܕܗܝܟܠܐ
  choice: сел перед воротами храма
  rationale: Прямая и естественная передача местоположения; множественное число «воротами» соответствует сирийскому тексту.
- source_word: ܐܠܝܬ ܐܠܝܬܐ ܗܕܐ
  choice: вознёс этот плач
  rationale: Однокоренная сирийская конструкция обозначает произнесение плача или причитания; «вознёс» сохраняет торжественный, но современный регистр.
- source_word: ܥܠ ܨܗܝܘܢ
  choice: о Сионе
  rationale: Предлог указывает на предмет плача; русский оборот «плач о Сионе» естественен и не устраняет поэтической окраски.
