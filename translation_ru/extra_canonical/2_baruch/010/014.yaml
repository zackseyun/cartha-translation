base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/014.yaml
  text: 'Rather, let the barren rejoice,

    and let those who have no children be glad;

    but let those who have children grieve.'
translation:
  language: ru
  text: 'Напротив, пусть радуются бесплодные,

    и пусть веселятся те, у кого нет детей;

    а те, у кого есть дети, пусть скорбят.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܩܪ̈ܬܐ / контекстуальное «бесплодные»
  choice: бесплодные
  rationale: Сохраняет телесный и социальный смысл бесплодия, не сужая его до семейного положения.
- source_word: ܐܝܠܝܢ ܕܠܝܬ ܠܗܘܢ ܒܢ̈ܝܐ / «те, у кого нет детей»
  choice: те, у кого нет детей
  rationale: Естественная современная формулировка, сохраняющая отличие от первого параллельного члена.
- source_word: ܐܝܠܝܢ ܕܐܝܬ ܠܗܘܢ ܒܢ̈ܝܐ / «те, у кого есть дети»
  choice: те, у кого есть дети
  rationale: Буквально и ясно передаёт контраст с бездетными.
- source_word: ܢܬܐܒܠܘܢ / контекстуальное «пусть скорбят»
  choice: пусть скорбят
  rationale: Передаёт не просто печаль, а призыв к трауру в плаче о постигшем Иерусалим бедствии.
theological_decisions:
- issue: Парадоксальное обращение обычных представлений о деторождении
  choice: 'Сохранён прямой контраст: бесплодные и бездетные радуются, имеющие детей скорбят.'
  alternative: Смягчить высказывание пояснением, что речь только о грядущем бедствии.
  rationale: Текст намеренно выражает напряжение плача и не должен получать вставное богословское объяснение в основном переводе.
translation_notes:
  register: Современный литературный русский; сохранены поэтический параллелизм, повелительная форма третьего лица и торжественно-трагический тон. Из-за неясной границы стиха в предоставленном сирийском страничном корпусе формулировка сверена с аудированным английским консультационным слоем.
