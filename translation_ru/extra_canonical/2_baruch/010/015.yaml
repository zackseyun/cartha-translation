  text: 'Зачем им рожать в муках

    и хоронить со стенаниями?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝܠܕ / смысловой контекст рождения
  choice: рожать
  rationale: Передаёт действие рождения естественным современным русским глаголом и сохраняет параллель между появлением на свет и погребением.
- source_word: ܟܐܒܐ / контекст страдания
  choice: в муках
  rationale: Кратко и идиоматично выражает боль, сопровождающую рождение, не усиливая её сверх контекста плача.
- source_word: смысловой контекст погребения
  choice: хоронить
  rationale: Современное и ясное обозначение предания умерших погребению.
- source_word: смысловой контекст плача
  choice: со стенаниями
  rationale: Сохраняет торжественно-скорбный регистр и параллелизм второй строки.
theological_decisions:
- issue: Риторический вопрос о рождении и смерти после бедствия Сиона
  choice: Сохранён прямой вопрос без пояснения причин страдания.
  alternative: Добавить, что дети обречены на смерть или плен.
  rationale: Источник выражает скорбь через риторический параллелизм; явное богословское или историческое истолкование сузило бы смысл.
translation_notes:
  register: Современный литературный русский с приподнятым плачевным тоном. Двухстрочная форма сохраняет поэтический параллелизм; местоимение «им» оставлено без уточнения референта, как в контексте.
