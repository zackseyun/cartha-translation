base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/012.yaml
  text: 'And you, sun, hold back the light of your rays;

    and you, moon, extinguish the abundance of your light.

    For why should light rise again,

    where the light of Zion has been darkened?'
translation:
  language: ru
  text: 'А ты, солнце, удержи свет своих лучей;

    и ты, луна, погаси обилие своего света.

    Ибо зачем вновь восходить свету там,

    где померк свет Сиона?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܡܫܐ
  choice: солнце
  rationale: Прямое соответствие сирийскому существительному; сохранено поэтическое обращение.
- source_word: ܙܠܝ̈ܩܝܟ ܕܢܘܗܪܐ
  choice: свет своих лучей
  rationale: Передаёт сочетание «лучи/сияния света» естественным современным русским выражением без потери образа.
- source_word: ܚܫܟܐ
  choice: померк
  rationale: Глагольная передача образа наступившей тьмы естественнее по-русски и сохраняет противопоставление свету.
- source_word: ܨܗܝܘܢ
  choice: Сиона
  rationale: Традиционная русская форма топонима в родительном падеже.
theological_decisions:
- issue: Олицетворённое обращение к небесным светилам
  choice: Сохранены прямые обращения «ты, солнце» и «ты, луна»
  alternative: Передать как безличное пожелание о прекращении света
  rationale: Источник использует риторическое обращение в плаче; оно не утверждает поклонения светилам и потому не требует конфессионального пояснения.
- issue: Причина космического траура
  choice: Сохранено буквальное противопоставление света небесных светил и померкшего света Сиона
  alternative: Истолковать «свет Сиона» как храм, славу или Божье присутствие
  rationale: Текст допускает несколько смысловых ассоциаций; перевод не должен сужать образ до одного богословского толкования.
translation_notes:
  register: Современный литературный русский с торжественным ритмом плача. Параллелизм строк и обращения к солнцу и луне сохранены; архаизмы и избыточно церковнославянская лексика не использованы.
