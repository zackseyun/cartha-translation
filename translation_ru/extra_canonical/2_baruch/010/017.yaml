source:
  text: '# Source page p0224 (printed 118)

    ܡܒܥܕܝ̈ܒܘܗܝ ܘܐܘ ܣܢ̈ܝܐ

    ܐܦܝܩ ܓܝܪ ܗܘ̣ ܕܢܛܪ

    ܒܝܬ̣ܐ ܘܐܬܒܥ ܒܝܬ ܐܢ

    ܒܪܘ̣ܗܝ ܗܘ̣ܘ ܡܢ ܒܝܬ

    ܗܠܝܢ. ܐܠܐ ܚܢܢ ܕܒܚܪܢ.

