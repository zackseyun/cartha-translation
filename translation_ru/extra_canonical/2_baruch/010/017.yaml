translation:
  language: ru
  text: 'Отныне не воспевайте более красоту

    и не говорите о прекрасном…[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный сирийский фрагмент обрывается после начала второго запрета («и не …»). Многоточие обозначает незавершённость текста; слова «о прекрасном» следуют английской контрольной передаче и не представляют собой уверенно сохраняемое продолжение сирийской строки.
    reason: Уточняет фактическое место обрыва и отделяет консультационную английскую передачу от непосредственно засвидетельствованного сирийского текста.
lexical_decisions:
- source_word: ܡܢ ܗܫܐ
  choice: Отныне
  rationale: Точно передаёт временной оборот «с этого времени / отныне» и естественно звучит в русском плаче.
- source_word: ܠܐ ܗܘܝ ܬܙܡܪܘܢ
  choice: не воспевайте больше
  rationale: Глагол ܙܡܪ прежде всего означает «петь»; «воспевать» сохраняет поэтический образ и в сочетании с отрицанием передаёт прекращение прежнего действия.
- source_word: ܥܠ ܫܘܦܪܐ
  choice: красоту
  rationale: ܫܘܦܪܐ означает «красота, великолепие»; винительная конструкция после «воспевать» естественна по-русски.
- source_word: ܘܠܐ ܬܚܬܘܢ
  choice: и не говорите о прелести…
  rationale: Строка в предоставленном фрагменте обрывается; перевод следует контексту параллельного запрета и аудированному английскому консультационному слою, не скрывая незавершённости текста.
theological_decisions:
- issue: Объект и смысл плача
  choice: Сохранить риторический запрет воспевать красоту и говорить о прелести
  alternative: Истолковать красоту как конкретно красоту Сиона или Иерусалима
  rationale: Ближайший контекст — плач о Сионе, однако сам стих не называет объект прямо; конкретизация сняла бы подлинную контекстуальную недосказанность.
translation_notes:
  register: Современный литературный русский с поэтической торжественностью плача. Параллелизм двух запретов сохранён; архаизмы и конфессионально окрашенные уточнения не добавлены.
