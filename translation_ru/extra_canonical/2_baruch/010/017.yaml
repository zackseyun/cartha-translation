  naturalness: '«Отныне не воспевайте более красоту» и «не говорите о прекрасном» звучат естественно в современном литературном русском и сохраняют поэтический, плачевный параллелизм. «Прелесть» нежелательна: в русском у слова есть разговорные и конфессионально окрашенные ассоциации.'
