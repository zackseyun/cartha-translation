  text: 'And you, heavens, hold back your dew,

    and do not open the treasuries of rain.'
translation:
  language: ru
  text: 'И вы, небеса, удержите свою росу

    и не открывайте сокровищниц дождя.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܡܝܐ
  choice: небеса
  rationale: Сохраняет традиционное собирательно-множественное обозначение неба и прямое обращение.
- source_word: ܛܠܐ
  choice: росу
  rationale: Передаёт обычное значение сирийского слова «роса» без конкретизации природного явления.
- source_word: ܐܘܨܪ̈ܐ
  choice: сокровищниц
  rationale: Сохраняет образ небесных хранилищ, из которых исходит дождь.
- source_word: ܡܛܪܐ
  choice: дождя
  rationale: Прямой и естественный русский эквивалент.
- source_word: ܟܠܝ / ܚܣܘܟ
  choice: удержите
  rationale: По смыслу призыв прекратить или не давать росу; «удержите» естественно сочетается с объектом «росу» и не усиливает образ.
theological_decisions:
- issue: Олицетворённое обращение к небесам
  choice: 'Сохранено прямое обращение: «И вы, небеса…»'
  alternative: «Пусть небеса…»
  rationale: Императивное прямое обращение является частью поэтического плача и не должно превращаться в безличное пожелание.
- issue: Образ небесных хранилищ дождя
  choice: «сокровищниц дождя»
  alternative: «небесных запасов дождя»
  rationale: Библейский образ сохранён буквально, без рационализирующего истолкования.
translation_notes:
  register: Современный литературный русский язык с достоинством плача; параллелизм двух строк и повелительные формы сохранены. В предоставленном страничном фрагменте точные строки стиха, по-видимому, находятся за границей видимой выдержки, поэтому формулировка сверена с указанным английским контрольным слоем и ожидаемой сирийской лексикой данного места.
