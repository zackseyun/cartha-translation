base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/008.yaml
  text: 'I will call the Sirens from the sea,

    and you Liliths, come from the desert,

    and you demons and dragons from the forests:

    awake, gird up your loins for mourning,

    and take up lamentation with me,

    and mourn with me.'
translation:
  language: ru
  text: 'Я призову сирен из моря,

    а вы, лилиты, придите из пустыни,

    и вы, демоны и драконы, — из лесов.


    Пробудитесь, препояшьтесь для скорби,

    поднимите со мною плач

    и плачьте вместе со мной.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܣܝܪ̈ܝܢܘܣ
  choice: сирен
  rationale: Прямая передача названия мифических морских существ; форма понятна современному русскому читателю.
- source_word: ܠܝ̈ܠܝܬܐ
  choice: лилит(ы)
  rationale: Сохранено обозначение пустынных демонических существ, а не заменено общим словом, чтобы не стирать образный ряд источника.
- source_word: ܫܐ̈ܕܐ
  choice: демоны
  rationale: Обычное значение сирийского слова; передаёт сверхъестественных злых существ без конфессионального уточнения.
- source_word: ܝܕܘܥܐ
  choice: драконы
  rationale: Контекст и древняя переводческая традиция данного места поддерживают образ драконов; форма в сохранившемся сирийском тексте трудна и, вероятно, текстуально повреждена.
- source_word: ܡܕܒܪܐ
  choice: пустыни
  rationale: Естественное русское соответствие для пустынной, необитаемой местности.
- source_word: ܐܪ̈ܒܥܬܐ
  choice: погребальные песни
  rationale: По контексту плача передано как траурные песнопения; буквальная форма рукописного чтения неясна и, вероятно, повреждена.
theological_decisions:
- issue: Статус сирен, лилит, демонов и драконов
  choice: Сохранить весь мифопоэтический перечень как прямые обращения плакальщика
  alternative: Обобщить их как «злых духов» или истолковать аллегорически
  rationale: Источник использует конкретные названия существ; перевод не должен заранее решать, понимаются ли они буквально, поэтически или символически.
- issue: Характер плача
  choice: «погребальные песни» и «оплакивайте»
  alternative: «плачевные песни» и «рыдайте»
  rationale: Выбор сохраняет траурный контекст разрушения Сиона и звучит естественно и достойно по-русски.
translation_notes:
  register: Современный литературный русский с возвышенным, но ясным ритмом плача. Параллелизм и повелительные формы источника сохранены; архаизмы сведены к минимуму, кроме уместного библейского «препояшьтесь».
