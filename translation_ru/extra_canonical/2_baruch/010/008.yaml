  rationale: Устранена излишняя интерпретация «погребальные песни»; «поднимите со мною плач» сохраняет образ совместного причитания, не добавляя ритуальной конкретики. Остальные решения сохранены как верные по источнику и согласные с английским контрольным переводом.
