  text: “Tell Jeremiah to go and accompany the captivity of the people as far as Babylon.
translation:
  language: ru
  text: «Скажи Иеремии, чтобы он пошёл и сопровождал пленённый народ до Вавилона».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܡܝܐ
  choice: Иеремии
  rationale: Обычная русская форма имени пророка Иеремии.
- source_word: ܫܒܝܬܐ ܕܥܡܐ
  choice: пленённый народ
  rationale: Буквальное сочетание «пленение народа» в данном контексте обозначает народ, уводимый в плен; выбран естественный русский эквивалент без устранения коллективного смысла.
- source_word: ܥܕ ܠܒܒܝܠ
  choice: до Вавилона
  rationale: Передаёт конечный пункт пути и соответствует направлению изгнания.
- source_word: ܢܣܥܕ
  choice: сопровождал
  rationale: Глагол допускает оттенок помощи и поддержки; в контексте пути вместе с пленниками «сопровождал» наиболее естественно передаёт действие, не добавляя частных толкований.
theological_decisions:
- issue: Роль Иеремии среди уводимого в плен народа
  choice: сопровождал пленённый народ
  alternative: поддерживал пленников
  rationale: Сохранена практическая роль Иеремии рядом с народом, но не уточняется, была ли она исключительно пастырской, пророческой или физической помощью.
