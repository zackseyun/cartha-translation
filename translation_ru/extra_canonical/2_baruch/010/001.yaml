lexical_decisions:
- source_word: ܡܢ ܒܬܪ ... ܝܘܡ̈ܬܐ
  choice: спустя семь дней
  rationale: Передаёт временную формулу естественным современным русским языком, сохраняя указанную длительность.
- source_word: ܨܒܘܬ ܕܐܠܗܐ
  choice: слово Бога
  rationale: По контексту это обращённое к Варуху Божье слово; форма «слово Бога» ясна, достоинственна и не добавляет конфессиональной терминологии.
- source_word: ܗܘ̣ ... ܘܐܡ̣ܪ ܠܝ
  choice: было ко мне ... и сказало мне
  rationale: Сохранена семитская формула прихода откровения и грамматическое олицетворение слова как говорящего субъекта.
theological_decisions:
- issue: Характер Божьего сообщения
  choice: «слово Бога» как субъект, который приходит к Варуху и говорит
  alternative: «Бог обратился ко мне»
  rationale: Выбранный вариант не сводит образную формулу к пересказу и сохраняет различение между Богом и пришедшим от Него словом, не превращая его при этом в отдельную именованную фигуру.
translation_notes:
  register: Современный литературный русский с сохранением библейской формулы «было ко мне слово». Двоеточие оставляет фразу открытой к последующей прямой речи.
