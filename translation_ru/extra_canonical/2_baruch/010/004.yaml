  text: И я сказал Иеремии, брату моему, как повелел мне Господь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܐܡܪܬ
  choice: И я сказал
  rationale: Сирийский глагол ܐܡܪ означает «сказать»; форма передаёт повествование от первого лица.
- source_word: ܠܐܪܡܝܐ ܐܚܝ
  choice: Иеремии, брату моему
  rationale: Сохранены имя, дательный объект и буквальное родственное обозначение ܐܚܝ — «мой брат».
- source_word: ܕܦܩܕܢܝ
  choice: как повелел мне
  rationale: Частица ܕ здесь естественно передаёт соответствие речи данному повелению; ܦܩܕ — «повелевать», суффикс обозначает «мне/меня».
- source_word: ܡܪܝܐ
  choice: Господь
  rationale: Обычная литературная передача сирийского божественного титула ܡܪܝܐ.
theological_decisions:
- issue: Характер связи между словами Варуха и Божьим повелением
  choice: «как повелел мне Господь»
  alternative: «то, что повелел мне Господь»
  rationale: Сирийская частица ܕ допускает обе связи. Контекст и синтаксис хорошо поддерживают обстоятельственное значение «как», не добавляя содержания самого повеления.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом; инверсия «брату моему» сохраняет достоинство стиля и остаётся понятной.
