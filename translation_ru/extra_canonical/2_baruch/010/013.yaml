  text: 'And you, bridegrooms, do not enter;

    and let not the virgins adorn themselves.

    And you, women, do not pray to bear children.'
translation:
  language: ru
  text: 'А вы, женихи, не входите;

    и вы, девы, не украшайте себя.

    А вы, женщины, не молитесь о том, чтобы родить детей.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܬܘܠܬܝܐ
  choice: девы
  rationale: Сирийское слово обозначает девушек-девственниц; «девы» сохраняет поэтический и скорбный регистр плача.
- source_word: ܢܫܝ̈ܐ
  choice: женщины
  rationale: Общее обозначение женщин без добавления отсутствующего в тексте уточнения о брачном положении.
- source_word: ܡ̈ܢܝ ܒܛܢܝ̈ܗܝܢ
  choice: о том, чтобы родить детей
  rationale: Передаёт смысл контекстуальной фразы о надежде на беременность и рождение детей естественным современным русским языком.
theological_decisions:
- issue: Характер запретов в плаче
  choice: Сохранены прямые повелительные формы без богословского обобщения.
  alternative: Передать их как универсальные нравственные запреты на брак, украшения и деторождение.
  rationale: Контекст представляет риторический плач о бедствии Иерусалима, а не самостоятельное нормативное учение о браке или рождении детей.
translation_notes:
  register: 'Современный литературный русский с торжественно-плачевным ритмом. Сохранён трёхчастный параллелизм обращений: женихи — девы — женщины.'
