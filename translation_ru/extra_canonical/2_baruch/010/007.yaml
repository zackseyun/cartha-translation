  text: 'But as for us who live, woe to us,

    because we have seen the afflictions of Zion

    and what has happened to Jerusalem.'
translation:
  language: ru
  text: 'Но горе нам, живущим,

    потому что мы увидели бедствия Сиона

    и то, что произошло с Иерусалимом.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܢ ܕܝܢ ܠܐܝܠܝܢ ܕܚܝ̈ܝܢ
  choice: Но горе нам, живущим
  rationale: Передаёт противопоставление ܕܝܢ и обращённое к оставшимся в живых сетование; по-русски причастная конструкция звучит естественно и сохраняет смысл исходника.
- source_word: ܒܩ̈ܠܢܐ ܕܨܗܝܘܢ
  choice: бедствия Сиона
  rationale: Контекст плача требует значения страданий или бедствий; «бедствия» сохраняет широкий смысл и соответствует возвышенному регистру.
- source_word: ܘܡܕܡ ܕܓܕܫܗ ܠܐܘܪܫܠܡ
  choice: и то, что произошло с Иерусалимом
  rationale: Нейтрально передаёт событие, постигшее Иерусалим, не конкретизируя его сверх выраженного в исходном тексте.
