  yaml_path: translation/extra_canonical/2_baruch/010/010.yaml
  text: 'And you, vine, why do you still give your wine?

    For no offering from you will again be received in Zion,

    and no firstfruits will again be accepted.'
translation:
  language: ru
  text: 'И ты, виноградная лоза, зачем всё ещё даёшь своё вино?


    Ведь на Сионе никакого приношения от тебя вновь не примут,


    и начатки вновь не будут приняты.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܢܒܐ
  choice: виноградная лоза
  rationale: В контексте обращения к творению слово обозначает лозу; развёрнутая русская форма ясна современному читателю и сохраняет образ.
- source_word: ܠܡܢܐ ܡܘܣܦܐܢܬܝ ܕܬܬܠܝܢ
  choice: зачем всё ещё даёшь
  rationale: Передаёт вопрос о продолжающемся плодоношении после разорения Сиона; «всё ещё» выражает значение продолжения.
- source_word: ܡܬܩܒܠ
  choice: примут / будут приняты
  rationale: Сохраняет мотив принятия культовых даров, не уточняя сверх источника, кем именно они принимаются.
- source_word: ܦܐܪ̈ܐ
  choice: начатки
  rationale: В данном культовом контексте речь идёт не просто о плодах, а о первых плодах, приносимых Богу.
theological_decisions:
- issue: Кем принимаются приношение и начатки
  choice: Сохранена безличная конструкция
  alternative: «Бог уже не примет» или «священники уже не примут»
  rationale: Источник не называет действующее лицо; безличная формулировка сохраняет эту неоднозначность и не вводит дополнительного толкования.
translation_notes:
  register: Современный литературный русский с торжественным ритмом плача. Обращение к лозе сохранено; культовая лексика передана словами «приношение» и «начатки» без конфессионального уточнения.
