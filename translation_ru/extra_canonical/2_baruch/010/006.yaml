  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܛܘܒܘܗܝ
  choice: Блажен
  rationale: Сирийская формула выражает признание человека счастливым или достойным блаженной участи; «Блажен» сохраняет торжественный плачевный регистр.
- source_word: ܠܗܘ ܕܠܐ ܐܬܝܠܕ
  choice: тот, кто не родился
  rationale: Прямая передача отрицательной формы страдательного глагола «быть рождённым».
- source_word: ܐܘ
  choice: и
  rationale: Хотя обычное значение — «или», в данном параллелизме частица сопоставляет две категории, обе названные блаженными; русское «и» естественно передаёт присоединение без обязательного взаимоисключения.
- source_word: ܠܗܘ ܕܐܬܝܠܕ ܘܡܝܬ
  choice: тот, кто родился и умер
  rationale: Сохранены последовательность действий и лаконичный параллелизм сирийского текста.
theological_decisions:
- issue: Смысл блаженства в контексте плача о Сионе
  choice: Сохранить резкое утверждение без смягчающего пояснения
  alternative: Передать как пожелание лучше не родиться либо уже умереть
  rationale: Источник формулирует макаризм, а не отвлечённое учение о ценности рождения или смерти; контекст скорби должен определять его восприятие, но не вноситься в сам стих.
- issue: Связь двух названных блаженными категорий
  choice: Соединить их союзом «и»
  alternative: Сохранить буквальное «или»
  rationale: Сирийское ܐܘ допускает «или», однако здесь оно вводит вторую параллельную категорию в поэтическом возгласе. «И» яснее сохраняет совокупный смысл; логическая взаимоисключительность контекстом не подчёркнута.
translation_notes:
  register: Современный литературный русский с краткой, торжественной формой плача. Параллелизм и синтаксическая простота оригинала сохранены.
