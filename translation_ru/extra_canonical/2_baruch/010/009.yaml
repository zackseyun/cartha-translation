base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/010/009.yaml
  text: 'You farmers, do not sow again;

    and you, O earth, why do you still give the fruit of your produce?

    Keep within you the sweetness of your nourishment.'
translation:
  language: ru
  text: 'Вы, земледельцы, больше не сейте;


    а ты, земля, зачем по-прежнему приносишь плоды своего урожая?


    Удержи в себе сладость своего пропитания.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܦܠܚܝ̈ܐ (контекстуально восстановленное обращение)
  choice: земледельцы
  rationale: Передаёт обращение к тем, кто возделывает и засевает землю; современно и литературно.
- source_word: ܐܪܥܐ
  choice: земля
  rationale: Прямое обращение к земле как к олицетворённой собеседнице сохранено.
- source_word: ܦܐܪ̈ܐ
  choice: плоды
  rationale: Обычное значение слова и естественное соответствие земледельческому контексту.
- source_word: ܚܠܝܡܘܬܐ
  choice: сладость
  rationale: Сохраняет образ приятности и благости земного пропитания, не сводя его лишь к изобилию.
- source_word: ܡܙܘ̈ܢܝܟܝ
  choice: своей пищи
  rationale: Передаёт пропитание или питание, которое земля даёт живущим; местоимение согласовано с русским олицетворением земли.
theological_decisions:
- issue: Масштаб повеления прекратить посев
  choice: больше не сейте
  alternative: никогда более не сейте
  rationale: Фраза выражает плач и повеление в связи с бедствием, но сама по себе не требует догматически абсолютного или вечного запрета.
- issue: Олицетворение земли
  choice: сохранено прямое обращение
  alternative: передать как описание прекращения плодородия
  rationale: Прямое обращение является частью поэтики плача и не должно превращаться в отвлечённое утверждение.
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией плача. Синтаксический параллелизм трёх строк сохранён; архаизмы и конфессионально окрашенная терминология не использованы.
