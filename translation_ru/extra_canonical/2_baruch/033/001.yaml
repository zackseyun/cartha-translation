  source_fidelity: Черновик в целом точно передаёт обращение народа, поручение Иеремии, заботу о находящихся в Вавилоне братьях и эмоционально окрашенную просьбу не оставлять народ. Однако «умереть раньше тебя» по-русски означает умереть раньше, чем умрёт адресат, тогда как конструкция «перед тобой» в данном контексте относится к смерти в его присутствии / прежде его ухода. Это требует исправления.
  naturalness: Современный литературный регистр в целом выдержан. «Таковы ли наставления» несколько тяжеловесно, а «сподвижник» может нести добавочный оттенок общей идейной борьбы. Более естественны «Неужели таковы повеления» и «товарищ».
  terminology: 'Для ܦܘܩ̈ܕܢܐ «повеления» лучше сохраняет директивную силу, чем более мягкое «наставления». «Товарищ» адекватно передаёт ܚܒܪܟ без конфессионального или идеологического уточнения. «Братья», «Вавилон» и «попавшие в плен» сохранены уместно. Примечания не требуются: в русском тексте нет соответствующих маркеров, а вариант «Иеремия-пророк» не следует вводить в основной текст.'
