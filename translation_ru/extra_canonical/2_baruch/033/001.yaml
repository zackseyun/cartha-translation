revisions:
- from: '«Таковы ли наставления, которые дал тебе твой сподвижник Иеремия, сказав: „Позаботься об этом народе, пока я пойду утешить остальных наших братьев в Вавилоне, попавших в плен“? И теперь, если и ты оставишь нас, всем нам лучше умереть раньше тебя, чем тебе уйти от нас».'
  to: '«Неужели таковы повеления, которые дал тебе твой товарищ Иеремия, сказав: „Позаботься об этом народе, пока я пойду утешить остальных наших братьев в Вавилоне, попавших в плен“? И теперь, если и ты оставишь нас, то всем нам лучше умереть у тебя на глазах, чем тебе уйти от нас».'
  rationale: 'Исправлена смысловая двусмысленность заключительной фразы: «у тебя на глазах» передаёт смерть перед адресатом, не утверждая, будто народ умрёт раньше Варуха. Одновременно «повеления» точнее передаёт силу исходного существительного, а «товарищ» сохраняет нейтральный смысл ܚܒܪܟ. Остальная структура и смысл черновика сохранены.'
  reviewer_model: gpt-5.6-terra
