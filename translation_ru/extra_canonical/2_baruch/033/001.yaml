base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/033/001.yaml
  text: “Are these the commands that your companion Jeremiah commanded you, saying, ‘Look after this people while I go and comfort the rest of our brothers in Babylon, those who have fallen into captivity’? And now, if you also leave us, it would be better for all of us to die before you than for you to depart from us.”
translation:
  language: ru
  text: '«Неужели таковы повеления, которые дал тебе твой товарищ Иеремия, сказав: „Позаботься об этом народе, пока я пойду утешить остальных наших братьев в Вавилоне, попавших в плен“? И теперь, если и ты оставишь нас, то всем нам лучше умереть у тебя на глазах, чем тебе уйти от нас».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܦܘܩ̈ܕܢܐ
  choice: наставления
  rationale: Слово обозначает данные поручения или предписания. «Наставления» естественно звучит по-русски и подходит к поручению Иеремии Варуху.
- source_word: ܚܒܪܟ
  choice: твой сподвижник
  rationale: Буквально это «твой товарищ, спутник». «Сподвижник» передаёт близость и совместное служение Иеремии и Варуха, не делая выражение чрезмерно разговорным.
- source_word: ܚܙܝ ܠܗܘܢ ܥܡܐ
  choice: позаботься об этом народе
  rationale: Буквальное «смотри за этим народом» в контексте означает попечение и надзор; выбранная формулировка ясна современному читателю.
- source_word: ܐܦܝܣ
  choice: утешить
  rationale: Каузативная форма глагола допускает значения «убеждать, умолять, утешать». В контексте изгнанных братьев значение «утешить» наиболее естественно, при этом не вводит неподтверждённого смысла «подготовить».
- source_word: ܐܚ̈ܝ
  choice: наших братьев
  rationale: Сохранён семейно-общинный язык сирийского текста; современное «братьев» предпочтительнее архаичного «братьев по племени» или «собратьев».
- source_word: ܕܢܦܠܘ
  choice: попавших в плен
  rationale: Оборот с глаголом «пасть» относится к постигшему братьев пленению. Русская формулировка передаёт результат бедствия без искусственной буквальности.
- source_word: ܫܪܘܟ
  choice: оставишь нас / уйти от нас
  rationale: В контексте глагол выражает не только физический уход, но и переживаемую народом оставленность. Две естественные русские формулировки сохраняют этот эмоциональный оттенок без избыточного усиления.
theological_decisions:
- issue: Обозначение пленников как «наших братьев»
  choice: Сохранить прямое родственное и общинное обозначение
  alternative: Передать как «соплеменников» или «соотечественников»
  rationale: Сирийский текст говорит именно о братьях; более отвлечённые обозначения сузили бы или истолковали характер этой общности.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Синтаксис обращения сделан плавным, но вопросительная форма и напряжённая просьба народа сохранены. «Сподвижник» передаёт ܚܒܪܟ точнее, чем неподтверждённое чтение «пророк»; поэтому прежнее альтернативное примечание не включено.
