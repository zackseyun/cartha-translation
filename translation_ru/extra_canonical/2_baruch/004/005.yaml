translation:
  language: ru
  text: А после этого Я показал его ночью Моему рабу Аврааму, между рассечёнными частями жертвы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܡܢ ܒܬܪ ܗܟܝܢ
  choice: А после этого
  rationale: Естественно передаёт временную последовательность сирийского выражения.
- source_word: ܚܘܝܬܗ
  choice: Я показал его
  rationale: Сохраняет мужской род местоименного суффикса, относящегося по ближайшему контексту к раю; неоднозначность референта не устраняется добавлением существительного.
- source_word: ܠܥܒܕܝ ܐܒܪܗܡ
  choice: Моему рабу Аврааму
  rationale: Прямая и стилистически уместная передача конструкции принадлежности.
- source_word: ܒܠܠܝܐ
  choice: ночью
  rationale: Точное современное соответствие обстоятельству времени.
- source_word: ܒܝܢܬ ܦܓܪ̈ܐ ܕܕܒܚܐ
  choice: между рассечёнными частями жертвы
  rationale: Буквально ܦܓܪ̈ܐ означает тела/части туши; «рассечёнными» ясно передаёт контекст жертвоприношения в Быт 15 и даёт естественный русский текст.
theological_decisions:
- issue: Референт местоимения в слове ܚܘܝܬܗ
  choice: Сохранено местоимение «его»
  alternative: «Я показал рай»
  rationale: Хотя контекст указывает на рай, исходный текст использует местоименный суффикс; перевод не должен делать подразумеваемый референт более явным, чем источник.
- issue: Связь с жертвоприношением Авраама в Быт 15
  choice: «между рассечёнными частями жертвы»
  alternative: «между телами жертв»
  rationale: Выбранная формулировка сохраняет образ исходного текста и делает аллюзию понятной без внесения конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Прописные «Я» и «Моему» обозначают речь Бога согласно русской издательской традиции. Синтаксис краткий и близкий к сирийскому оригиналу.
