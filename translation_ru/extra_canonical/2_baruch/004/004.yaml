translation:
  language: ru
  text: Но, когда он преступил заповедь, этот город был отнят у него, как и рай.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܟܕ ܐܫܬܕ ܦܘܩܕܢܐ
  choice: когда он преступил заповедь
  rationale: Сирийская конструкция передаёт нарушение или отвержение заповеди; по контексту субъектом является Адам. «Преступил заповедь» естественно и точно выражает смысл.
- source_word: ܐܬܢܣܒܬ ܡܢܗ
  choice: она была отнята у него
  rationale: Форма глагола женского рода указывает на подразумеваемый объект женского рода — показанный Адаму город из предыдущего стиха; русский перевод сохраняет эту анафору местоимением «она».
- source_word: ܐܝܟ ܕܐܦ ܦܪܕܝܣܐ
  choice: как и рай
  rationale: Кратко сохраняет сравнительную конструкцию и включительную частицу «также/и» без добавочного толкования.
theological_decisions:
- issue: Что было отнято у Адама
  choice: Сохранено местоимение «она», отсылающее к городу из предыдущего стиха
  alternative: Явно назвать «город» либо понять отнятым рай
  rationale: Женский род сирийского глагола и ближайший контекст поддерживают отсылку к городу, тогда как рай назван отдельно в сравнении. Местоимение сохраняет связность и не делает подразумеваемое существительное излишне явным.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, торжественная и понятная. Синтаксическая связь с предыдущим стихом сохранена.
