  yaml_path: translation/extra_canonical/2_baruch/004/001.yaml
  text: And the Lord said to me, “This city will be delivered up for a time, and the people will be led away into captivity, but the world will not be forgotten.
translation:
  language: ru
  text: 'И Господь сказал мне: «Этот город на время будет отдан, а народ будет уведён в плен, но мир не будет забыт».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܫܬܠܡܐ
  choice: будет предан врагам
  rationale: Страдательная форма означает «будет отдан/предан». Добавление «врагам» естественно передаёт подразумеваемую военную сдачу города, не меняя смысла.
- source_word: ܒܙܒܢܐ
  choice: на время
  rationale: Передаёт временный, ограниченный характер участи города; соответствует контексту и сохраняет отличие от окончательного разрушения.
- source_word: ܡܬܕܒܪ ܫܒܝܐ
  choice: уведут в плен
  rationale: Идиоматически и точно передаёт пассивную конструкцию «будет отведён пленником/в плен».
- source_word: ܥܠܡܐ
  choice: мир
  rationale: Сохраняет широкое и потенциально неоднозначное значение сирийского слова, не сужая его до «века» или «вечности» без достаточных оснований.
- source_word: ܠܐ ܡܬܬܢܫܐ
  choice: не будет забыт
  rationale: Прямое соответствие сирийской страдательной форме; субъект, который не забудет мир, остаётся подразумеваемым, как в источнике.
theological_decisions:
- issue: Значение ܥܠܡܐ
  choice: мир
  alternative: век / вечность
  rationale: Контекст противопоставляет временную сдачу земного города более широкому Божьему замыслу. «Мир» сохраняет лексическую широту источника и не вводит преждевременно конкретную эсхатологическую схему.
- issue: Подразумеваемый деятель в выражении «не будет забыт»
  choice: сохранена безличная страдательная конструкция
  alternative: Бог не забудет мир
  rationale: Источник не называет деятеля прямо. Русская страдательная форма сохраняет эту особенность и не делает неявное явным.
translation_notes:
  register: 'Современный литературный русский язык; речь торжественная, но понятная. Синтаксис сохраняет трёхчастное противопоставление оригинала: временная участь города, плен народа и непреходящая забота о мире.'
