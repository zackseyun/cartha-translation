translation:
  language: ru
  text: И снова Я показал его Моисею на горе Синай, когда показывал ему образец скинии и всю её утварь».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܘܝܬܗ
  choice: показал его
  rationale: Местоименный суффикс передаёт ранее упомянутый небесный город; в русском род согласован со словом «город», при этом референт не добавлен в сам стих.
- source_word: ܛܘܪܐ ܕܣܝܢܝ
  choice: на горе Синай
  rationale: Естественная современная русская форма традиционного библейского топонима.
- source_word: ܕܡܘܬܐ
  choice: образец
  rationale: В контексте показанного Моисею устройства скинии слово обозначает явленный образец или модель; «образец» сохраняет связь с библейской формулировкой, не уточняя её природу.
- source_word: ܡܫܟܢܐ
  choice: скиния
  rationale: Устоявшееся и точное русское библейское обозначение переносного святилища.
- source_word: ܡܐܢ̈ܘܗܝ
  choice: всех её принадлежностей
  rationale: Слово охватывает сосуды, утварь и прочие предметы скинии; «принадлежности» естественно передаёт собирательный смысл без неоправданного сужения.
theological_decisions:
- issue: Референт местоимения «его»
  choice: Сохранено местоименное указание на ранее названный город
  alternative: Повторить «город» или истолковать объект как рай
  rationale: Сирийский текст использует местоименный объект, а ближайший контекст говорит о предуготованном городе; явное повторение или отождествление с раем устранило бы связность и неоднозначность оригинала.
- issue: Природа показанного Моисею образца
  choice: «образец скинии» без дальнейшего истолкования
  alternative: «небесный прообраз скинии»
  rationale: Текст утверждает соответствие показанному образцу, но не вводит здесь специальную типологическую терминологию и не требует слова «небесный».
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранено первое лицо Бога и последовательность исходной фразы; «скиния» оставлена как широко узнаваемый библейский термин.
