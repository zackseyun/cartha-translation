base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/004/003.yaml
  text: For it is not that which is by the hands of men; it is that which will be revealed, which was prepared beforehand from the time I resolved to make Paradise, and I showed it to Adam before he sinned.
translation:
  language: ru
  text: Ибо это не то, что сделано руками людей; это то, что будет явлено, что было приготовлено заранее — с тех пор, как Я замыслил создать рай и показал его Адаму прежде, чем тот согрешил.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܝܕ ܒܢܝܢܫܐ
  choice: руками людей
  rationale: Буквально передаёт сирийское выражение «рукой/руками сынов человеческих» и естественно звучит по-русски.
- source_word: ܕܡܬܓܠܐ
  choice: что будет явлено
  rationale: Страдательная форма указывает на будущее раскрытие или явление; формулировка сохраняет эсхатологический оттенок, не уточняя действующее лицо.
- source_word: ܕܐܬܟܢ ܡܢܩܕܡ
  choice: что было приготовлено заранее
  rationale: Передаёт идею предварительного приготовления без добавления отсутствующих в тексте обстоятельств.
- source_word: ܐܬܚܫܒܬ ܕܐܥܒܕ
  choice: Я замыслил устроить
  rationale: ܐܬܚܫܒܬ обозначает решение или замысел, а ܕܐܥܒܕ — действие по созданию/устройству; «устроить» здесь естественно сочетается с раем.
- source_word: ܦܪܕܝܣܐ
  choice: рай
  rationale: Обычный и точный русский эквивалент заимствованного сирийского слова «парадис».
theological_decisions:
- issue: Соотношение земного, рукотворного святилища и будущей реальности
  choice: «это не то, что создано руками людей, а то, что будет явлено»
  alternative: «это не нынешнее здание среди вас, но то, которое откроется»
  rationale: Основной текст следует непосредственно сохранившейся сирийской формулировке и не вводит слово «храм» или «здание», хотя контекст подразумевает небесный прообраз святилища.
- issue: Кем будет явлено приготовленное
  choice: Сохранена безличная страдательная конструкция «будет явлено»
  alternative: «Я явлю» или «оно явится»
  rationale: Сирийский текст не называет действующее лицо явно; перевод не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Повтор сирийского указательного построения сглажен конструкцией «а то… — то…», при этом противопоставление рукотворного и заранее приготовленного сохранено.
