  source_fidelity: 'Сирийское ܕܗܘܐ ܒܝܕ ܒܢܝܢܫܐ буквально означает «то, что [сделано] руками людей», а не обязательно «создано» в смысле сотворения. Будущее «будет явлено» согласуется с английским POB audit trail и допустимо для формы ܡܬܓܠܐ в данном контексте. Последовательность: не рукотворное — будущее явление — предуготовление до замысла создать рай — показ Адаму до его греха, сохранена.'
