translation:
  language: ru
  text: 'Или ты думаешь, что это тот город, о котором Я сказал: «Я начертал тебя на ладонях Моих»?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܕܝܢܬܐ
  choice: город
  rationale: Обычное и точное соответствие сирийскому слову «город»; по контексту речь идёт о земном Иерусалиме.
- source_word: ܓܠܦ / ܪܫܡ (цитатная формула, отражённая в традиции текста)
  choice: начертал
  rationale: Передаёт образ неизгладимой надписи и естественно отсылает к Ис 49:16, не усиливая его до более узкого «вырезал».
- source_word: ܦܣ̈ܬܐ / образ ладоней в цитате
  choice: на ладонях Моих
  rationale: «Ладони» точнее сохраняют конкретный телесный образ цитаты, чем более общее «руки».
- source_word: ܣܟܠ / вопросительная конструкция контекста
  choice: думаешь
  rationale: В русском вопрос «Или ты думаешь…?» естественно передаёт упрёк и противопоставление предшествующему утверждению.
theological_decisions:
- issue: Отождествление земного города с городом, обещанным Богом
  choice: Сохранён риторический вопрос без поясняющего отождествления или отрицания внутри стиха.
  alternative: Добавить «неужели» либо прямо назвать город небесным Иерусалимом.
  rationale: Стих намеренно ставит под сомнение такое отождествление, а последующий контекст раскрывает различие; перевод не должен преждевременно устранять напряжение.
- issue: Маркирование божественной речи
  choice: Местоимения «Я» и «Моих» написаны с прописной буквы.
  alternative: Строчные «я» и «моих».
  rationale: В современной русской библейской прозе прописные буквы ясно обозначают речь Бога, не добавляя нового доктринального содержания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Порядок слов «на ладонях Моих» слегка возвышенный, но понятный и уместный для встроенной цитаты. Стих оставлен без сносок, поскольку текстовая и смысловая передача не требует пояснения.
