base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/072/002.yaml
  text: 'This is the word: after the signs have come that were told to you before, the nations will be thrown into confusion, and the time of my Messiah will come. He will summon all the nations, and some of them he will keep alive, but others of them he will put to death.'
translation:
  language: ru
  text: 'Вот это слово: после того как явятся знамения, о которых Я прежде говорил тебе, народы придут в смятение, и наступит время Моего Мессии[a]. Он созовёт все народы: одних оставит в живых, а других предаст смерти.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моего Помазанника».'
    reason: Показывает буквальное значение сирийского мессианского титула и сохраняет его смысловую прозрачность.
lexical_decisions:
- source_word: ܡܠܬܐ
  choice: слово
  rationale: Сохраняет формулу, вводящую пророческое изречение, без превращения её в расплывчатое «вот что будет».
- source_word: ܥܡܡ̈ܐ
  choice: народы
  rationale: Обычное и точное соответствие сирийскому обозначению народов или языческих наций; контекст требует собирательного множественного числа.
- source_word: ܡܫܝܚܐ
  choice: Мессия
  rationale: В современном русском библейском употреблении естественно передаёт титул «Помазанник» и не подменяет его именем собственным; вариант раскрыт в сноске.
- source_word: ܢܚܐ / ܢܫܬܒܩܘܢ (по контексту стиха)
  choice: оставит в живых
  rationale: Передаёт противопоставление тем, кого Мессия предаст смерти, и избегает добавочного оттенка прощения, возможного у слова «пощадит».
- source_word: ܢܩܛܘܠ (по контексту стиха)
  choice: предаст смерти
  rationale: Достоинная современная формулировка, ясно сохраняющая активное причинение смерти без эвфемистического устранения смысла.
theological_decisions:
- issue: Титул эсхатологического деятеля
  choice: Моего Мессии
  alternative: Моего Помазанника
  rationale: «Мессия» понятно широкому читателю и сохраняет традиционный эсхатологический титул; буквальное значение дано в сноске, без христологического уточнения сверх текста.
- issue: Суд над народами
  choice: одних оставит в живых, а других предаст смерти
  alternative: одних пощадит, а других убьёт
  rationale: Сохранено резкое противопоставление жизни и смерти, но не внесён возможный дополнительный смысл прощения или милосердия в глагол первой части.
- issue: Лицо говорящего в выражении «мой Мессия»
  choice: Я / Моего с прописной буквы
  alternative: я / моего со строчной буквы
  rationale: Контекст пророческой речи указывает на божественного говорящего; прописная буква соответствует русской библейской издательской норме, не меняя грамматического содержания.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным пророческим звучанием. Синтаксис сделан плавным, при этом сохранены вводная формула, последовательность событий и суровое противопоставление участи народов.
