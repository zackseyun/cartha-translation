translation:
  language: ru
  text: Итак, вот что произойдёт с теми народами, которых он пощадит.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܡܡ̈ܐ
  choice: народы
  rationale: Обычное значение сирийского множественного числа; оно соответствует контексту судьбы различных народов.
- source_word: ܢܫܬܒܩܘܢ
  choice: пощадит
  rationale: В данном контексте форма от ܫܒܩ передаёт оставление в живых, то есть избавление от гибели, а не просто прощение.
- source_word: ܗܠܝܢ
  choice: вот что
  rationale: Естественно передаёт указательное «это/эти вещи» при отсылке к перечисляемым событиям.
theological_decisions:
- issue: Референт действующего лица в выражении «которых Он пощадит»
  choice: Сохранить местоимение «Он» без поясняющего имени
  alternative: Заменить местоимение на «Мессия» или «Всевышний»
  rationale: Источник оставляет действующее лицо выраженным местоименно; добавление титула неоправданно устранило бы возможную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая пророческая формула передана естественно и торжественно, без архаизации. Заглавная буква в «Он» указывает на божественного или мессианского референта согласно непосредственному контексту, не уточняя его сверх текста.
