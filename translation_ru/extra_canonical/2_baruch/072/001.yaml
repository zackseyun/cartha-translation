  text: But hear also about the bright waters that are to come at the end, after these dark waters.
translation:
  language: ru
  text: Но выслушай также о светлых водах, которые придут в конце, после этих тёмных вод.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ (светлые воды; чтение подтверждается контекстом и контрольной традицией)
  choice: светлые воды
  rationale: Сохраняет образный контраст с «тёмными водами» и не сводит смысл лишь к прозрачности воды.
- source_word: ܗܠܝܢ
  choice: эти
  rationale: Ближнее указательное местоимение отсылает к только что упомянутым тёмным водам; перевод «те» был бы менее точен.
- source_word: ܒܫܘܠܡܐ / выражение со значением завершения
  choice: в конце
  rationale: Естественно передаёт временное завершение последовательности видения, не добавляя толкования о природе самого конца.
- source_word: ܫܡܥ / форма повеления со значением «услышь, выслушай»
  choice: выслушай
  rationale: В данном вводном обращении речь идёт не о простом слуховом восприятии, а о внимательном принятии дальнейшего объяснения.
theological_decisions:
- issue: Следует ли уточнять, что «конец» означает окончательный конец мира
  choice: оставить «в конце» без уточнения
  alternative: «при конце мира»
  rationale: В стихе сохраняется эсхатологический оттенок, однако уточнение «мира» здесь могло бы сузить подлинную формулировку источника.
- issue: Как передать символический контраст вод
  choice: «светлые воды» и «тёмные воды»
  alternative: «чистые воды» и «чёрные воды»
  rationale: Так сохраняется противопоставление света и тьмы без преждевременного сведения образов исключительно к нравственной чистоте или к цвету.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным апокалиптическим звучанием. Синтаксис оставлен ясным для широкого читателя; символика вод не истолковывается внутри перевода.
