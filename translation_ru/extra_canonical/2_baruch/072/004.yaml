translation:
  language: ru
  text: Всякий народ, который не знал Израиля и не попирал семя Иакова, останется в живых.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܡܡܐ
  choice: народ
  rationale: Обычное соответствие для обозначения отдельного народа; форма «всякий народ» естественно передаёт универсальность высказывания.
- source_word: ܝܕܥ
  choice: знал
  rationale: Сохранено широкое значение глагола «знать», без уточнения, идёт ли речь о знакомстве, признании или отношениях.
- source_word: ܙܪܥܗ ܕܝܥܩܘܒ
  choice: семя Иакова
  rationale: Сохранён библейский образ потомства как «семени», связывающий выражение с языком Писания.
- source_word: ܕܫ
  choice: попирал
  rationale: Передаёт буквальный образ топтания и его переносный смысл — жестокое угнетение, не сводя его к одному конкретному виду насилия.
- source_word: ܚܝܐ
  choice: останется в живых
  rationale: В данном будущем контексте это естественная русская передача «будет жить»; она указывает на сохранение жизни, не уточняя способ избавления.
theological_decisions:
- issue: Основание сохранения народов в живых
  choice: 'Сохранены оба отрицательных условия: народ не знал Израиля и не попирал семя Иакова.'
  alternative: Истолковать «не знал» как «не признал» либо объединить условия в общее отсутствие вражды к Израилю.
  rationale: Текст различает два утверждения; перевод не превращает их в конфессиональное или политическое толкование.
- issue: Значение обещания жизни
  choice: «останется в живых»
  alternative: «будет спасён» или «получит вечную жизнь»
  rationale: Сирийская формулировка говорит о жизни, но сама по себе не определяет её как сотериологическое спасение или вечную жизнь; богословская неоднозначность сохранена.
translation_notes:
  register: Современный литературный русский с умеренно библейской образностью. Синтаксис прост и торжественен; архаизмы не используются, но выражение «семя Иакова» сохранено как узнаваемая формула Писания.
