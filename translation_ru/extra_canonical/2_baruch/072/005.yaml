  text: And this is because they shall be subjected, from among all the nations, to your people.
translation:
  language: ru
  text: И это потому, что из всех народов они будут подчинены твоему народу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܫܬܥܒܕܘܢ (предполагаемая лексема, соответствующая засвидетельствованному смыслу)
  choice: будут подчинены
  rationale: Пассивная формулировка сохраняет направленность действия и не усиливает её до «будут порабощены» или «будут уничтожены».
- source_word: ܥܡܡ̈ܐ
  choice: народы
  rationale: Обычное соответствие сирийскому обозначению народов; форма «из всех народов» сохраняет выделение данной группы из их совокупности.
- source_word: ܥܡܟ (предполагаемая форма по контексту стиха)
  choice: твоему народу
  rationale: Сохраняется обращение во втором лице и коллективный смысл слова «народ».
theological_decisions:
- issue: Кого обозначает местоимение «они»
  choice: Оставить местоимение без уточняющей замены существительным
  alternative: Назвать конкретную группу или «все народы»
  rationale: Референт определяется предшествующим контекстом; его явное называние в этом стихе устранило бы присущую формулировке контекстуальную неоднозначность.
- issue: Характер подчинения
  choice: «будут подчинены»
  alternative: «будут служить» / «будут порабощены»
  rationale: Нейтральный пассив не превращает политико-эсхатологическое подчинение ни в добровольное служение, ни в более жёсткое рабство без достаточного основания.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным синтаксисом. Союзная формула «И это потому, что» сохранена как связь с предыдущим утверждением. Представленный сирийский материал является широким и местами нарушенным страничным фрагментом, где границы 72:5 надёжно не выделены; поэтому черновик следует смыслу аудированной консультационной версии, не добавляя отсутствующих уточнений.
