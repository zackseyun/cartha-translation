base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/025/001.yaml
  text: 'Then he answered me and said, “You too shall be spared until that time, until the sign that the Mighty One will perform for the inhabitants of the earth at the end of the days. And this will be the sign: bewilderment will seize the inhabitants of the earth, and they will fall into many afflictions; then again into great anguish. And when, because of the abundance of their distress, they say in their thoughts, ‘The Mighty One no longer remembers the earth,’ and they have given up hope, then the time will awaken.”'
translation:
  language: ru
  text: 'И он ответил мне: «Ты тоже будешь сохранён до того времени — до знамения[a], которое Могущественный явит жителям земли при завершении дней. И вот это знамение: жителей земли охватит смятение, и они подвергнутся многим бедствиям, а затем — великой муке. Когда же из-за множества своих несчастий они подумают: „Могущественный больше не помнит о земле“, — и утратят надежду, тогда пробудится назначенное время».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «установленного порядка», «предопределённого устроения».'
    reason: Сирийское ܬܘܩܢܐ может обозначать не только знак, но также установленный порядок или устроение.
lexical_decisions:
- source_word: ܬܘܩܢܐ
  choice: знамение
  rationale: В апокалиптическом контексте речь идёт об опознаваемом событии, указывающем на завершение дней. При этом сноска сохраняет возможный смысл установленного порядка или предопределённого устроения.
- source_word: ܡܪܝܡܢܐ
  choice: Могущественный
  rationale: Сохранён возвышенный божественный титул без добавления слова «Бог», отсутствующего в самом титуле.
- source_word: ܙܘ̈ܥܐ
  choice: смятение
  rationale: Передаёт охватывающее людей внутреннее потрясение и растерянность, не сводя значение только к страху.
- source_word: ܐܘܠܨܢܐ
  choice: бедствия / несчастья
  rationale: Контекст описывает нарастающие тяготы. Варьирование по-русски избегает тяжёлого повтора, сохраняя общую семантику скорби и притеснения.
- source_word: ܡܬܕܟܪ
  choice: помнит
  rationale: Сохраняет библейский образ Божьего памятования и резкость отчаянной человеческой мысли.
- source_word: ܥܪ (образ пробуждения)
  choice: пробудится
  rationale: Сохранено олицетворение времени, которое из состояния ожидания переходит к действию.
theological_decisions:
- issue: Отчаянное утверждение людей о Божьем отношении к земле
  choice: «Могущественный больше не помнит о земле»
  alternative: «Могущественный больше не заботится о земле»
  rationale: Буквальный образ памятования сохраняет напряжение плача и не подменяет его богословским разъяснением.
- issue: Субъект заключительного пробуждения
  choice: «тогда пробудится назначенное время»
  alternative: «тогда пробудится надежда»
  rationale: Основное чтение следует контрольной реконструкции данного стиха и его апокалиптической логике; слово «назначенное» поясняет подразумеваемый срок, не снимая олицетворения.
