  terminology: «Могущественный» удачно сохраняет возвышенный божественный титул без конфессионально обусловленного расширения. «Знамение», «смятение», «бедствия», «помнит о земле» и «пробудится назначенное время» точны в контексте. Сноска к «знамению» обоснованно отмечает более широкий семантический диапазон ܬܘܩܢܐ.
