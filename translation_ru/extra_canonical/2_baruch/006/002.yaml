  yaml_path: translation/extra_canonical/2_baruch/006/002.yaml
  text: And behold, suddenly a spirit of strength lifted me up and carried me above the wall of Jerusalem; and I saw four angels standing at the four corners of the city, each one holding a flaming torch in his hands.
translation:
  language: ru
  text: И вот, внезапно я исполнился духа силы и был поднят над стеной Иерусалима. Я увидел четырёх ангелов, стоявших на четырёх углах города; каждый держал в руках огненный факел.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪܘܚܐ ܕܚܝ̈ܠܐ
  choice: дух силы
  rationale: Сохраняет буквальную конструкцию с ܪܘܚܐ («дух») и ܚܝܠܐ («сила, мощь»), не превращая её без необходимости в обозначение Святого Духа.
- source_word: ܐܣܬܠܩ ܠܥܠܐ
  choice: поднял меня и перенёс
  rationale: По контексту передаёт сверхъестественное вознесение рассказчика вверх и далее над городской стеной естественным русским языком.
- source_word: ܐܪܒܥܐ ܡܠܐܟ̈ܝܢ
  choice: четырёх ангелов
  rationale: Прямой эквивалент сирийского выражения.
- source_word: ܐܪܒܥܬܝܗܝܢ ܙܘܝ̈ܬܗ̇ ܕܡܕܝ̣ܢܬܐ
  choice: у четырёх углов города
  rationale: Точно сохраняет пространственный образ четырёх углов города; предлог «у» естественен при глаголе «стояли».
- source_word: ܠܡܦܝܕܐ ܕܢܘܪܐ … ܒܐܝ̈ܕܘܗܝ
  choice: в руках огненный факел
  rationale: Передаёт и огненную природу факела, и указание на руки, засвидетельствованные продолжением текста и подтверждённые контрольной редакцией.
theological_decisions:
- issue: Идентичность «духа силы»
  choice: строчное «дух силы»
  alternative: «Дух силы» или «могучий дух»
  rationale: Сирийский текст сам по себе не требует отождествления с отдельной божественной Личностью; строчная буква сохраняет эту открытость.
translation_notes:
  register: Современный литературный русский язык с возвышенным повествовательным тоном. Синтаксис разделён на два предложения ради ясности; начальное «И вот» сохраняет характер видения. Формулировка избегает архаизмов и не устраняет неоднозначность выражения «дух силы».
