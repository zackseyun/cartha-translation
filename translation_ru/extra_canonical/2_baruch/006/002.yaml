revisions:
- from: И вот, внезапно дух силы поднял меня и перенёс над стеной Иерусалима. Я увидел четырёх ангелов, стоявших у четырёх углов города; каждый держал в руках огненный факел.
  to: И вот, внезапно я исполнился духа силы и был поднят над стеной Иерусалима. Я увидел четырёх ангелов, стоявших на четырёх углах города; каждый держал в руках огненный факел.
  rationale: Правка восстанавливает явно выраженные в сирийском тексте исполнение духом силы и последующее пассивное вознесение рассказчика, не определяя личность этого духа. Также уточнено расположение ангелов на углах города. Остальные элементы черновика, включая огненный характер факела и указание на руки, сохранены.
