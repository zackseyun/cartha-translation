translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Повторное сирийское указательное средство перед видением передано как «И вот», а в первом предложении опущено как избыточное для естественного русского рассказа. Имя ܒܪܘܟ передано в принятой русской форме «Варух».
