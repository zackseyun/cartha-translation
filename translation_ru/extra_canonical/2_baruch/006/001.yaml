  yaml_path: translation/extra_canonical/2_baruch/006/001.yaml
  text: And it happened on the next day that, behold, the forces of the Chaldeans surrounded the city. And at evening time I, Baruch, left the people, and I went out and stood by the oak, and I was grieving over Zion and lamenting over the captivity that had come upon the people. And I was filled with a spirit of strength, and I was lifted up on high above the square of Jerusalem. And I saw, behold, four angels standing at the four corners of the city, each of them holding a torch.
translation:
  language: ru
  text: 'На следующий день войска халдеев окружили город. Вечером я, Варух, оставил народ, вышел и встал у дуба. Я скорбел о Сионе и оплакивал пленение, постигшее народ. Тогда я исполнился духа силы и был вознесён над площадью Иерусалима. И вот, я увидел четырёх ангелов: они стояли у четырёх углов города, и каждый держал в руке факел.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢܐ ܕܡܚܪ
  choice: на следующий день
  rationale: Естественный современный русский эквивалент обычного сирийского обозначения следующего дня, сохраняющий последовательность повествования.
- source_word: ܚܝ̈ܠܐ ܕܒ̈ܥܝܕܐ
  choice: войска халдеев
  rationale: Контрольное свидетельство подтверждает военный смысл и отнесение к халдеям; множественное «войска» близко к форме источника и естественно по-русски.
- source_word: ܘܐܬܬܙܝܥܝ ... ܒܟܝܐ
  choice: скорбел ... и оплакивал
  rationale: Два русских глагола сохраняют сочетание внутренней скорби и выраженного плача, не сводя исходную пару к одному действию.
- source_word: ܪܘܚܐ ܕܚܝ̈ܠܐ
  choice: духа силы
  rationale: Формально близкая передача сохраняет образ дарованной укрепляющей силы и не превращает выражение в позднейший фиксированный богословский титул.
- source_word: ܫܘܩܐ ܕܐܘܪܫܠܡ
  choice: площадью Иерусалима
  rationale: Сирийское слово допускает значения улицы и торгового пространства; «площадь» уместно в сцене обзора города сверху, не акцентируя торговую функцию.
- source_word: ܠܡܦܝܕܐ
  choice: факел
  rationale: Образ огненного предмета в руке ангела лучше передаётся словом «факел», чем более мягким «светильник».
