  yaml_path: translation/extra_canonical/2_baruch/018/001.yaml
  text: And I answered and said, “He who took from the light is able to know it. But the many who exist took from Adam’s darkness, and did not rejoice in the light of Moses.”
translation:
  language: ru
  text: 'И я ответил: «Тот, кто принял от света, способен познать его. Многие же приняли от тьмы Адама и не возрадовались свету Моисея».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܣܒ / ܢܣܒܘ
  choice: принял / приняли
  rationale: Сохраняет широкий и конкретный образ получения чего-либо от света или от тьмы, не уточняя способ передачи.
- source_word: ܢܘܗܪܐ
  choice: свет
  rationale: Прямо передаёт ключевой образ откровения и нравственного просвещения.
- source_word: ܚܫܘܟܐ ܕܐܕܡ
  choice: тьма Адама
  rationale: Сохраняет личный генитив и связь именно с Адамом, не превращая выражение в общее обозначение человеческого неведения.
- source_word: ܐܬܒܣܡܘ (исправление оцифрованного ܐܬܒܣܣܘ)
  choice: не возрадовались
  rationale: Следует исправленному чтению сирийского текста со значением радости, а не ошибке распознавания, допускающей значение утверждения или укоренения.
- source_word: ܢܘܗܪܐ ܕܡܘܫܐ
  choice: свет Моисея
  rationale: Сохраняет явное упоминание Моисея и образ света, не заменяя его толкованием вроде «закон».
theological_decisions:
- issue: Противопоставление тьмы Адама и света Моисея
  choice: Сохранены оба личных имени и образное противопоставление.
  alternative: Передать это как общее противопоставление неведения и наставления.
  rationale: Текст сам представляет нравственную и откровенную историю через Адама и Моисея; нейтрализация этих фигур обеднила бы смысл.
- issue: Отношение Моисея к свету
  choice: Формула «свет Моисея» сохранена без поясняющего расширения.
  alternative: «Свет, данный через Моисея».
  rationale: Так перевод не делает Моисея ни независимым источником света, ни явно лишь посредником, сохраняя краткость и напряжение исходного генитива.
- issue: Лицо глаголов в первом предложении
  choice: 'Третье лицо: «тот, кто принял… способен познать».'
  alternative: 'Второе лицо: «Ты принял… и можешь познать посредством него».'
  rationale: Третье лицо следует контрольному чтению, восстанавливающему повреждённые при оцифровке формы, и согласуется с общим рассуждением о людях; второе лицо возникло из дефектного OCR.
translation_notes:
  register: Современный литературный русский язык с приподнятой, но ясной библейской интонацией. Формула «И я ответил» естественнее буквального удвоения «ответил и сказал». Глагол «возрадовались» выбран для достоинства регистра и для передачи смысловой силы сирийского чтения.
