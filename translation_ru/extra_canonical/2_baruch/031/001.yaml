    rationale: «Скажу им свои слова» передаёт адресатов и притяжательность, но заменяет «говорить с ними» на однонаправленное «сказать им». Безопасно сохранить оба компонента через «обращусь к ним со своими словами».
  - severity: low
    issue: Формула «я обратился к ним и сказал» сглаживает глагол «спросил/попросил».
    rationale: Сирийское ܒܥܝܬ в сочетании с «и сказал» следует сохранить в переводе; контекстуальная неловкость не оправдывает устранения смыслового элемента.
