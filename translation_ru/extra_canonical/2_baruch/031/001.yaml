  verdict: revise
  source_fidelity: 'Основная последовательность передана верно: Барух идёт к народу, велит собрать старейшин и детей, все собираются в долине Кедрон. Однако контрольное чтение, на которое опирается сам проект, содержит «с ними» и «мои слова»; «скажу им свои слова» несколько ослабляет именно совместно-адресную конструкцию. Заключительное ܒܥܝܬ ܘܐܡܪܬ — «я спросил/попросил и сказал» — в переводе «обратился ... и сказал» сглажено без достаточной необходимости.'
  naturalness: «Созовите ко мне» естественнее, чем «Соберите ко мне», когда речь идёт о приглашении людей. «Я обращусь к ним со своими словами» — современная литературная и при этом близкая передача контрольного «буду говорить с ними мои слова». «Я спросил их и сказал» сохраняет исходную двойную формулу, хотя в русском она намеренно оставлена несколько формульной.
  terminology: «Старейшины», «дети» и «долина Кедрон» уместны. Форма «Кедрон» соответствует обычной русской библейской передаче топонима. Богословски нагруженных терминов в стихе нет.
