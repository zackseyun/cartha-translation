  yaml_path: translation/extra_canonical/2_baruch/031/001.yaml
  text: 'And it happened after these things, that I went to the people and said to them, “Gather to me your elders and your children, and I will speak my words with them."”


    And they all assembled in the valley of Kidron.


    And I asked and said to them,'
translation:
  language: ru
  text: 'После этого я пошёл к народу и сказал им: «Созовите ко мне ваших старейшин и ваших детей, и я обращусь к ним со своими словами».[a]


    И все они собрались в долине Кедрон.


    Тогда я спросил их и сказал:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В сохранившейся строке издания чтение повреждено или искажено: буквально его можно понять как «и сказал: “Ищите мои слова”». Здесь принято чтение, поддерживаемое контрольным текстом: «и я обращусь к ним со своими словами» (букв. «буду говорить с ними мои слова»).'
    reason: Основная сирийская строка на границе страницы текстологически нестабильна; примечание сохраняет свидетельство печатного источника и объясняет выбор контрольного чтения.
lexical_decisions:
- source_word: ܟܢܫܘ
  choice: соберите
  rationale: Императив прямо призывает собрать названных людей у говорящего; «соберите» сохраняет побудительную силу и естественно звучит по-русски.
- source_word: ܣܒܝܟܘܢ
  choice: ваших старейшин
  rationale: Слово может обозначать пожилых мужчин, но в обращении ко всему народу естественно указывает на его старейшин.
- source_word: ܒܢܝ̈ܟܘܢ
  choice: ваших детей
  rationale: Буквально возможно «ваших сыновей», однако в данном собирательном призыве «детей» естественно передаёт возрастное противопоставление старейшинам и не сужает значение без необходимости.
- source_word: ܒܚܠܬܐ ܕܩܕܪܘܢ
  choice: в долине Кедрон
  rationale: Передаёт географическое название в принятой русской библейской форме и сохраняет указание на долину.
- source_word: ܒܥܝܬ ܘܐܡܪܬ ܠܗܘܢ
  choice: я обратился к ним и сказал
  rationale: Глагол ܒܥܐ может означать просьбу, вопрошание или обращение. Вводная формула перед речью по-русски естественно передаётся без неуместного предположения, что далее следует вопрос.
theological_decisions:
- issue: Адресаты предстоящей речи
  choice: 'Сохранено третье лицо: «скажу им свои слова»'
  alternative: «скажу вам свои слова»
  rationale: Контрольное чтение предполагает ܥܡܗܘܢ, «с ними/им», и сохраняет формальное различие между непосредственно призываемым народом и собранными старейшинами и детьми. Текст не исправлен ради более гладкого согласования лиц.
- issue: Возрастные группы внутри народа
  choice: «старейшин и детей»
  alternative: «стариков и сыновей»
  rationale: Перевод сохраняет две названные группы, не придавая им дополнительного конфессионального или символического значения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Формула «После этого» передаёт семитское последовательное повествование без тяжеловесного «И было». Заключительное двоеточие намеренно оставляет ввод к речи следующего стиха.
