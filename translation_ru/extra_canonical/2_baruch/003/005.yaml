    issue: Добавлено слово «других» в выражении «среди других народов».
    rationale: Исходное ܥܡܡ̈ܐ и английский audit trail содержат просто «народы». Контекст не даёт достаточных оснований вводить противопоставление «других»; оно сужает и уточняет формулировку источника.
  revised_text: Если Ты и впрямь погубишь Свой город, отдашь Своё святилище на время и рассеешь Свой народ среди народов, так что его больше не станет,
