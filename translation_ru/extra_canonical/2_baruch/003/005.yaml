  text: If indeed you destroy your city and give over your sanctuary for a time and scatter your people among the nations so that they may be no more,
translation:
  language: ru
  text: Если Ты и впрямь погубишь Свой город, отдашь Своё святилище на время и рассеешь Свой народ среди народов, так что его больше не станет,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܢ ܓܝܪ
  choice: Если Ты и впрямь
  rationale: Передаёт условную конструкцию с усилительной частицей ܓܝܪ, не превращая её в утверждение.
- source_word: ܬܘܒܕ
  choice: погубишь
  rationale: Сохраняет сильное значение причинения гибели или уничтожения; более мягкое «разрушишь» неоправданно сужало бы смысл до физического разрушения.
- source_word: ܡܕܝܢܬܟ
  choice: Свой город
  rationale: Буквально «твой город»; возвратное притяжательное местоимение естественно по-русски при подлежащем «Ты».
- source_word: ܬܫܠܡ
  choice: отдашь
  rationale: В данном контексте означает передать или выдать во власть других; «отдашь» звучит естественно и сохраняет эту направленность.
- source_word: ܥܡܡ̈ܐ
  choice: других народов
  rationale: «Среди народов» по-русски может ошибочно включать и сам рассеиваемый народ; «других» ясно выражает контекст, не добавляя конфессиональной окраски.
theological_decisions:
- issue: Бог назван возможным деятелем разрушения и рассеяния
  choice: 'Сохранена прямая условная формулировка: «Ты… погубишь… отдашь… рассеешь»'
  alternative: 'Смягчить до позволения: «допустишь гибель»'
  rationale: Источник прямо ставит действия в зависимость от Бога; перевод не должен устранять заключённое в тексте богословское напряжение.
- issue: Значение конечной фразы о народе
  choice: «так что его больше не станет»
  alternative: «чтобы они погибли»
  rationale: Выбранная формулировка сохраняет двусмысленность между исчезновением народа как общности и гибелью его представителей, не уточняя её догматически.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Местоимения, относящиеся к Богу, написаны с прописной буквы для ясности адресата. Конечная запятая сохранена, поскольку стих синтаксически продолжается в следующем стихе.
