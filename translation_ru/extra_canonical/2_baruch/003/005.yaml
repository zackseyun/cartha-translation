revisions:
- from: Если Ты и впрямь погубишь Свой город, на время отдашь Своё святилище и рассеешь Свой народ среди других народов, так что его больше не станет,
  to: Если Ты и впрямь погубишь Свой город, отдашь Своё святилище на время и рассеешь Свой народ среди народов, так что его больше не станет,
  rationale: Удалено не имеющее опоры в источнике слово «других». Сохранены условность, прямая божественная агентность, значение временной передачи святилища и открытая синтаксическая связь со следующим стихом. Концовка «так что его больше не станет» сохраняет референцию к народу как к общности, не конкретизируя способ исчезновения.
