base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/003/001.yaml
  text: And I said, “O Lord, my Lord, have I come into the world for this, that I should see the evil of my mother? No, my Lord.
translation:
  language: ru
  text: 'И я сказал: «О Господи, Господь мой! Для того ли я пришёл в мир, чтобы увидеть бедствие моей матери?[a] Нет, Господь мой!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Образ «матери», вероятно, относится к Иерусалиму или Сиону.
    reason: Поясняет поэтическую персонификацию, не выдавая контекстуальное отождествление за буквальное значение и не заменяя образ в основном тексте.
lexical_decisions:
- source_word: ܐܬܝܬ ܠܥܠܡܐ
  choice: я пришёл в мир
  rationale: 'Перевод следует исправленному чтению сирийского текста, подтверждённому сверкой с изданием: речь идёт о приходе в мир, а не о просьбе. Выражение сохранено буквально и естественно по-русски.'
- source_word: ܒܝܫܬܗ̇
  choice: бедствие
  rationale: Слово обозначает зло или несчастье, постигшее олицетворённый город. «Бедствие» передаёт здесь переживаемую катастрофу, не смешивая её с более конкретным «разрушением» следующего стиха.
- source_word: ܐܡܝ
  choice: моей матери
  rationale: Сохранён образ матери, под которым подразумевается Иерусалим (Сион). Замена на «мой город» устранила бы намеренную поэтическую персонификацию.
theological_decisions:
- issue: Кого Варух называет своей матерью
  choice: Сохранить выражение «моя мать» и пояснить, что речь об Иерусалиме (Сионе).
  alternative: Передать в основном тексте как «мой город» или «Сион».
  rationale: Материнский образ выражает глубокую связь пророка с Иерусалимом и усиливает плач; толковательное уточнение уместнее вынести в сноску.
- issue: Смысл риторического вопроса Варуха
  choice: Варух скорбит о том, что его жизнь привела его к созерцанию бедствия Иерусалима.
  alternative: Считать, что Варух спрашивает, просил ли он увидеть разрушение города.
  rationale: Исправленное чтение сирийского текста говорит о приходе в мир; вариант с просьбой возник из-за ошибочного распознавания текста.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного плача. Обращение «О Господи, Господь мой!» сохраняет торжественность и повтор исходного текста; синтаксис риторического вопроса сделан естественным для современного читателя.
