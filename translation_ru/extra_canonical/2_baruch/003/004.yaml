  rationale: Настоящее время сирийского глагола в данном речевом контексте естественно передаётся русским будущим совершенного вида как ввод к непосредственному высказыванию.
- source_word: ܩܕܡܝܟ
  choice: пред Тобой
  rationale: Формально и естественно передаёт «перед Тобой / в Твоём присутствии», сохраняя молитвенный регистр.
- source_word: ܡܪܝܐ
  choice: Господи
  rationale: Звательная форма соответствует прямому обращению к Господу.
