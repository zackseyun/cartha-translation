  yaml_path: translation/extra_canonical/2_baruch/003/003.yaml
  text: 'For these two things are too much for me: I cannot forsake half of your people, nor can my soul bear to see the destruction of my mother.'
translation:
  language: ru
  text: 'Ибо эти две вещи для меня непосильны: я не могу оставить половину Твоего народа,[a] и душа моя не в силах видеть гибель моей матери.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сирийский текст здесь неясен. Возможно: «я не могу умереть со многими или умереть вместе с моим собранием».'
    reason: Сохраняет существенную текстологическую неоднозначность первой части стиха.
  - marker: b
    text: 'Буквально: «видеть бедствие моей матери».'
    reason: Показывает более формальное значение сирийского выражения, переданного в тексте словом «гибель».
lexical_decisions:
- source_word: ܠܐ ܡܫܟܚ ܐܢܐ
  choice: я не могу / не в силах
  rationale: Сирийское выражение буквально означает неспособность что-либо сделать; два русских соответствия естественно передают повторяющуюся конструкцию без стилистической монотонности.
- source_word: ܟܢܘܫܬܝ
  choice: Твоего народа (в основном тексте); моего собрания (в примечании)
  rationale: Рукописный текст допускает чтение «моё собрание», однако основной текст следует наиболее связной реконструкции фразы, отражённой в проверочном английском слое; буквальное чтение сохранено в примечании.
- source_word: ܐܡܝ
  choice: моей матери
  rationale: Сохранена женская персонификация города/Иерусалима, прямо выраженная сирийским словом «моя мать».
- source_word: ܒܒܝܫܬܗ̇
  choice: гибель
  rationale: Буквально «её бедствие/зло»; в контексте предстоящего разрушения города «гибель» естественно передаёт смысл, а более буквальный вариант отмечен в сноске.
theological_decisions:
- issue: Кого обозначает «моя мать»
  choice: Сохранить образ без поясняющей подстановки «Иерусалим»
  alternative: «гибель Иерусалима, моей матери»
  rationale: Источник оставляет метафору нерасшифрованной; её сохранение не навязывает толкование внутри текста.
- issue: Неясная первая половина стиха
  choice: 'Основной текст: «я не могу оставить половину Твоего народа»'
  alternative: «я не могу умереть со многими или умереть вместе с моим собранием»
  rationale: Сирийский текст в этом месте, по-видимому, повреждён или труден для разбора. Связная реконструкция помещена в основной текст, а буквальнее отражающий сохранившиеся слова вариант дан в примечании, чтобы не скрывать текстологическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Заглавное «Твоего» указывает на обращение к Господу. Синтаксис сделан ясным для обычного читателя, но образ «моей матери» и неясность повреждённого сирийского чтения сохранены.
