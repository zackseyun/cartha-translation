review_pass:
  verdict: revise
  source_fidelity: Основной текст черновика следует английской реконструкции, но не передаёт непосредственно засвидетельствованное сирийское чтение. В доступном сирийском тексте после «ибо» читаются слова о невозможности «умереть со многими / с моим собранием», тогда как «оставить половину Твоего народа» не имеет явной опоры в приведённой сирийской строке. Это чтение может отражать реконструкцию или иную текстовую традицию, но его нельзя без оговорки ставить в основной русский текст при приоритете источника.
  naturalness: «Ибо эти две вещи для меня непосильны» и «душа моя не в силах видеть» естественны в современном литературном русском с возвышенным регистром. Формулировку о смерти следует построить как два параллельных инфинитивных оборота, без искусственного сведения их к варианту «оставить половину народа».
  terminology: '«Моя мать» следует сохранить как образ исходного текста. Для ܒܒܝܫܬܗ̇ предпочтительно «бедствие», а не «гибель»: последнее чрезмерно сужает значение слова. Заглавное «Твоего» в молитвенном обращении допустимо. «Собрание» является точной и нейтральной передачей ܟܢܘܫܬܝ.'
  issues:
  - severity: high
    issue: «Я не могу оставить половину Твоего народа» не соответствует явному сирийскому чтению на приведённой странице.
    rationale: Сирийский текст содержит ܕܐܡܘܬ ... ܥܡ ܣܓܝܐ и ܕܐܡܘܬ ܥܡ ܟܢܘܫܬܝ («умереть со многими / с моим собранием»). Поскольку первичен исходный текст, английскую реконструкцию нельзя предпочесть ему без текстологического обоснования.
  - severity: medium
    issue: Сноска a помещает непосредственно засвидетельствованное сирийское чтение лишь как возможность, а реконструкцию — в основной текст.
    rationale: 'Следует поменять приоритет: в основном тексте передать доступное сирийское чтение, а альтернативу из английской контрольной традиции привести как вероятную реконструкцию.'
  - severity: low
    issue: «Гибель» для ܒܒܝܫܬܗ̇ слишком определённо.
    rationale: Слово означает «бедствие, зло, несчастье»; «бедствие» сохраняет широту исходного выражения и не требует отдельной буквальной сноски.
  revised_text: 'Ибо эти две вещи для меня непосильны: я не могу умереть вместе со многими, не могу умереть вместе с моим собранием,[a] и душа моя не в силах видеть бедствие моей матери.'
