  rationale: 'Исправлена только первая фраза: добавлено «воздаваемой», чтобы по-русски ясно передать направленность хвалы к Богу. Два параллельных вопроса, модальность будущего и пассивная конструкция второго вопроса сохранены. Смысл «то, что в Твоём Законе» намеренно не конкретизируется, поскольку исходная формулировка допускает общую отсылку к содержанию Закона.'
