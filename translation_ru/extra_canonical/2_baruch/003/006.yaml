  text: Or how will one speak of your praise? Or to whom will what is in your law be explained?
translation:
  language: ru
  text: Или как можно будет говорить о хвале, воздаваемой Тебе? И кому будет разъяснено то, что в Твоём Законе?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܫܒܚܬܟ (teshbuḥtāk)
  choice: о хвале Тебе
  rationale: Сохраняет значение существительного в единственном числе — «хвала» — и притяжательное отношение, переданное по-русски естественной конструкцией «Тебе».
- source_word: ܢܬܦܫܩ (netpaššaq)
  choice: будет истолковано
  rationale: Глагол обозначает разъяснение или истолкование; пассивная форма исходного текста сохранена.
- source_word: ܢܡܘܣܟ (nāmōsāk)
  choice: Твоём Законе
  rationale: Передаёт «закон» как религиозно значимое установление; прописная буква указывает на Божий Закон без внесения дополнительного толкования.
theological_decisions:
- issue: Возможность передачи ܬܫܒܚܬܟ как «Твоей славе» или «хвале Тебе»
  choice: «о хвале Тебе»
  alternative: «о Твоей славе»
  rationale: Выбрано более прямое значение «хвала», чтобы не смещать смысл к понятию славы и сохранить вопрос о воздаянии Богу хвалы.
translation_notes:
  register: Современный литературный русский с торжественной, но ясной вопросительной интонацией. Два параллельных вопроса исходного текста сохранены; местоимения, относящиеся к Богу, написаны с прописной буквы.
