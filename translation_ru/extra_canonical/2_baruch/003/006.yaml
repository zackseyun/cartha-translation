  naturalness: «О хвале Тебе» для современного литературного русского звучит неестественно. Оборот «как можно будет говорить о хвале, воздаваемой Тебе?» ясен, сохраняет смысл и не перегружает стих.
  terminology: «Закон» уместен для ܢܡܘܣܐ; прописная буква согласуется с обращением к Богу и религиозным контекстом. «Разъяснено» естественно передаёт ܢܬܦܫܩ без сужения к специальному экзегетическому «истолковано».
