  source_fidelity: 'Основной образ и лексика переданы верно: город сравнивается с «горькой вдовой», а его унижение — со «сладкой добычей». Однако «что стало с этим городом» и особенно «он стал» вносят в текст дополнительный результативный смысл, которого в сирийском сравнительном обороте явно нет. Причинная связь «из-за злых дел своих» также является лишь одним из возможных синтаксических членений и не должна быть закреплена в основном тексте без оговорки.'
