  text: And that they may see concerning this city, because of the evil of her deeds, that this city is like a bitter widow, and that her humiliation is like sweet spoil?”
translation:
  language: ru
  text: И пусть они увидят этот город[a] — из-за злых дел рук его — словно горькую вдову, а унижение его — словно сладкую добычу».[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «увидят от (или: из) этого города»; возможно: «увидят на примере этого города» или «увидят относительно этого города».'
    reason: Сирийский предлог ܡܢ допускает буквальное пространственное и более широкое смысловое прочтение; в основном тексте выбран естественный русский вариант без уточнения значения предлога.
  - marker: b
    text: 'Синтаксис допускает иное членение: «пусть они увидят относительно этого города, что из-за злых дел рук его этот город — словно горькая вдова, а унижение его — словно сладкая добыча».'
    reason: В сирийском тексте границы синтаксических групп и подразумеваемая глагольная связка не выражены однозначно.
lexical_decisions:
- source_word: ܕܬܚܙܘܢ ܠܟܘܢ ܡܢ ܗܕܐ ܡܕܝܢܬܐ
  choice: пусть они увидят, что стало с этим городом
  rationale: Буквальное «увидят от/из этого города» по-русски неясно. Контекстуальное «что стало с этим городом» естественно передаёт наблюдение его участи, не устраняя отмеченной в сноске неоднозначности предлога ܡܢ.
- source_word: ܥܡܗܕܐ ܡܪܝܪܐ
  choice: словно горькая вдова
  rationale: Сохраняется резкий исходный образ и определение ܡܪܝܪܐ «горькая, исполненная горечи»; более толковательные варианты вроде «несчастная» не подменяют его.
- source_word: ܨܥܪܘܗܝ
  choice: унижение его
  rationale: Отглагольное понятие передано как состояние униженности/бесчестья. Мужской род местоимения в русском согласован со словом «город», тогда как английский использует персонифицированное her.
- source_word: ܫܘܕܐ ܚܠܝܬܐ
  choice: сладкая добыча
  rationale: Сохранено парадоксальное сочетание «сладкая добыча», вероятно описывающее желанную для врагов добычу; смысл не разъясняется внутри текста.
theological_decisions:
- issue: Связь злых дел города с последующим сравнением
  choice: «из-за злых дел своих он стал…»
  alternative: «из-за зла его дел [они увидят] этот город словно…»
  rationale: Русская синтаксическая связка делает фразу понятной, сохраняя причинную связь и не добавляя богословского объяснения суда.
- issue: Необычный образ «сладкой добычи»
  choice: сохранить буквально без истолкования
  alternative: «желанная добыча»
  rationale: Исходное напряжение между унижением города и «сладостью» добычи намеренно не сглаживается.
translation_notes:
  register: Современный литературный русский с достоинством пророческой речи. Необычные образы «горькая вдова» и «сладкая добыча» сохранены, а шероховатая сирийская синтаксическая конструкция умеренно прояснена; подлинная неоднозначность вынесена в сноски.
