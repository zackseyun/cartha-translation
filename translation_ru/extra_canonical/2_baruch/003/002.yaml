  text: If I have found grace in your sight, let your mercies quickly take my spirit to yourself, that I may go to my fathers and not see the destruction of my mother.
translation:
  language: ru
  text: Если я обрёл милость в Твоих глазах, пусть милости Твои скорее возьмут мой дух к Тебе, чтобы мне отойти к моим отцам и не увидеть гибели моей матери.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܫܟܚܬ ܪ̈ܚܡܐ ܩܕܡܝܟ
  choice: я обрёл милость в Твоих глазах
  rationale: Условная формула восстановлена по засвидетельствованному сирийскому чтению; естественное русское соответствие буквальному «нашёл милость перед Тобой».
- source_word: ܪ̈ܚܡܝܟ
  choice: милосердие Твоё
  rationale: Передаёт множественную сирийскую форму как собирательное понятие, естественное для современного литературного русского языка.
- source_word: ܣܒ ܠܘܬܟ ܪܘܚܝ
  choice: возьмёт мой дух к Тебе
  rationale: Сохраняет образ взятия духа Богом и направление «к Тебе», не подменяя его истолкованием смерти.
- source_word: ܕܐܙܠ ܠܝ ܠܘܬ ܐܒ̈ܗܝ
  choice: чтобы мне отойти к моим отцам
  rationale: Сохраняет традиционную семитскую формулу соединения с предками; «отойти» звучит достоинственно и естественно.
- source_word: ܒܚܪܒܗ̇ ܕܐܡܝ
  choice: гибели моей матери
  rationale: Сохраняет олицетворение города как матери и не сужает многозначное обозначение разорения до одного конкретного способа разрушения.
theological_decisions:
- issue: Условие о найденной милости
  choice: 'Сохранено: «Если я обрёл милость в Твоих глазах»'
  alternative: Опустить условную формулу
  rationale: Условие принадлежит исходному чтению и выражает смиренную, не самоуверенную просьбу говорящего.
- issue: Просьба о взятии духа
  choice: 'Сохранён образ: «возьмёт мой дух к Тебе»'
  alternative: Передать прямо как «дай мне умереть»
  rationale: Исходный образ богословски содержателен и не должен молча заменяться интерпретацией.
translation_notes:
  register: Современный литературный русский с библейской торжественностью. Местоимения, обращённые к Богу, даны с прописной буквы. Метафоры «отойти к отцам» и «моя мать» сохранены без поясняющего расширения.
