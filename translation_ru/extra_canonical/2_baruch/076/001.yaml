  yaml_path: translation/extra_canonical/2_baruch/076/001.yaml
  text: And he answered and said to me, “Because you have prayed that I show you what will happen to you after these things, for this reason I have shown you this vision, that you may see what will happen to you after these things. For you shall surely depart from this earth—but not unto death; rather, you shall be kept for the appointed times. Therefore go up to the summit of that mountain, and the regions of that land shall pass before you, and the form of the inhabited world, and the tops of the mountains, and the depths of the valleys, and the depths of the seas, and the number of the rivers, so that you may see what you are leaving and where you are going. And this shall be after forty days. Go therefore now, during these days, and instruct the people as much as you are able, so that they may learn, lest they die at the last time, but may learn so that they may live at the last time.”
translation:
  language: ru
  text: 'Он ответил мне: «Поскольку ты убедил меня показать тебе, что произошло и как это совершилось, тебе дано возвышенное наставление о том, что будет после этого».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Текст этого места в предоставленном сирийском свидетельстве труден и, вероятно, повреждён. Иное чтение: «Поскольку ты просил Меня показать тебе, что случится с тобой после этого, Я показал тебе это видение, чтобы ты увидел, что случится с тобой после этого».'
    reason: Сохраняет заметную текстовую неопределённость и фиксирует существенно отличающуюся реконструкцию, отражённую в проверочном английском слое.
lexical_decisions:
- source_word: ܘܥܢܐ ܘܐܡܪ ܠܝ
  choice: Он ответил мне
  rationale: Естественно передаёт обычную сирийскую повествовательную формулу без тяжеловесного буквального повтора «ответил и сказал мне».
- source_word: ܕܐܦܝܣܬ ܠܝ
  choice: ты убедил меня
  rationale: Глагол ܐܦܝܣ в данной форме означает «убедил, уговорил»; это точнее представленного в консультационном английском слое варианта «молился».
- source_word: ܕܐܚܘܝܟ
  choice: показать тебе
  rationale: Форма глагола ܚܘܝ означает «показать, явить» и включает объект второго лица единственного числа.
- source_word: ܕܐܘ ܗܘܐ ܐܝܟ ܕܥܒܝܕ
  choice: что произошло и как это совершилось
  rationale: Передаёт различимые в свидетельстве элементы бытия/события и совершённого действия, не устраняя трудность текста догматическим истолкованием.
- source_word: ܝܘܠܦܢܐ ܡܥܠܝܬ
  choice: возвышенное наставление
  rationale: ܝܘܠܦܢܐ обозначает учение или наставление, а ܡܥܠܝܐ — высокое, превосходное; русское сочетание сохраняет торжественный регистр.
- source_word: ܕܥܬܝܕ ܠܡܗܘܐ ... ܡܢ ܒܬܪ ܗܠܝܢ
  choice: о том, что будет после этого
  rationale: Прямо передаёт будущность и временную формулу «после этого».
theological_decisions:
- issue: Содержание откровения в 76:1
  choice: Стих говорит о показанном прошлом и наставлении о будущем.
  alternative: Стих повторно говорит о том, что случится с Варухом после этих событий.
  rationale: В предоставленном тексте Ceriani различимы выражения о том, «что произошло/совершилось», и о том, «что будет после этого». Более развёрнутое чтение английского консультационного слоя опирается на иную реконструкцию и не должно молча заменять первичное свидетельство.
