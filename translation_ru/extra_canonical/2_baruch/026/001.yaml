  text: And I answered and said, "Will that tribulation that is to come continue a long time, and will this necessity embrace many years?"
translation:
  language: ru
  text: 'И я ответил ему: «Долго ли будет длиться то грядущее бедствие и продлится ли эта необходимость многие годы?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܘܠܨܢܐ
  choice: бедствие
  rationale: Слово обозначает притеснение, скорбь или тяжёлое испытание; «бедствие» естественно звучит в современном русском и соответствует апокалиптическому контексту.
- source_word: ܗܘ̇ ܕܐܬܝ̇
  choice: то грядущее
  rationale: Дальний указательный элемент передан словом «то», а причастная конструкция со значением предстоящего — прилагательным «грядущее».
- source_word: ܡܐ ܣܓܝܐܐ ܡܣܘܟ
  choice: долго ли продлится
  rationale: Несмотря на неустойчивость чтения на границе главы, контекст и синтаксис указывают на вопрос о продолжительности; русский оборот передаёт смысл без воспроизведения неестественной буквальности.
- source_word: ܡܢܝ ܣܓܝ̈ܐܬܐ
  choice: на многие ли годы
  rationale: Вопросительное выражение относится к большому числу лет; выбран естественный русский порядок слов.
- source_word: ܐܢܘܣܝܐ
  choice: тяжкая пора
  rationale: Термин передаёт необходимость, тяготу или стеснённое положение. «Тяжкая пора» сохраняет смысл периода вынужденных страданий и избегает неясного буквального «необходимость».
theological_decisions:
- issue: Характер грядущего испытания
  choice: Не уточнять, является ли бедствие наказанием, гонением или общей эсхатологической скорбью.
  alternative: Назвать его прямо «великой скорбью» или «наказанием».
  rationale: Сирийский текст здесь говорит о бедствии широко и не даёт основания вводить более узкий богословский термин.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Повтор исходных близких понятий передан как «бедствие» и «тяжкая пора», чтобы вопрос звучал ясно и естественно, не устраняя смыслового параллелизма.
