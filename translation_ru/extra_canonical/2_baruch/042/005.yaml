  source_fidelity: 'Доступный сирийский фрагмент подтверждает начало конструкции: «и те, кто прежде не…» (ܘܐܝܠܝܢ ܕܡܢ ܩܕܝܡ ܠܐ). Продолжение на предоставленной странице отсутствует, поэтому сверка оставшейся части возможна лишь по английскому контрольному слою. Перевод сохраняет его основные смысловые элементы: незнание жизни прежде, последующее познание, соединение с семенем отделившегося народа и оценку прежнего времени как ничто.'
