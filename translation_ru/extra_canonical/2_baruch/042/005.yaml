source:
  text: '# Source page p0205 (printed 137)

    ܢܣܒܘ ܩܕܡܝܗܘܢ ܟܠܗܘܢ

    ܥܒ̈ܕܝܗܘܢ ܕܒܝܫܘܬܗܘܢ. ܘܡܢ

    ܫܪܐ ܡܢ ܢܦܫܝܗܘܢ. ܘܠܡ

    ܐܠܐ ܫܪܝܪܐ ܕܥܡܢ ܗܘ

    ܘܡܬܚܙܝ ܒܐܪܥܐ

    ܓܠܝܬ. ܘܬܘܒ ܢܚܙܝܗ

    ܫܘܦܪܐ ܠܥܠܡ. ܒܕܡܘܬ

    ܕܢܒܥܐ ܒܥܡܘܛ ܚܒܠܐ.

    ܘܒܕܡܘܬ ܕܐܬܝܠܕܬ ܙܒܢܐ

    ܕܡܫܕܪܝܢ ܐܢܘܢ. ܗܢܘ

