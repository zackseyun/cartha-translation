base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/042/005.yaml
  text: But those who formerly did not know life, and afterward came to know it, and mingled with the seed of the people which has separated itself—their former time is also reckoned as nothing.”
translation:
  language: ru
  text: Но те, кто прежде не знали жизни, а потом познали её и смешались с семенем народа, отделившего себя, — их прежнее время также считается ничем».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝ̈ܐ (контекстуально восстанавливаемое продолжение после ܠܐ)
  choice: жизни
  rationale: Сохраняет ключевое понятие «жизнь» без поясняющего богословского расширения.
- source_word: семитское обозначение потомства/рода (в продолжении стиха, отражённом в контрольном английском слое)
  choice: семенем народа
  rationale: Буквальная метафора «семя» сохраняет родовой и общинный оттенки и не сужает смысл до одного лишь «потомства».
- source_word: ܡܬܚܫܒܝܢ / соответствующая форма в продолжении
  choice: считается
  rationale: Передаёт идею вменения или признания без уточнения, кем именно производится счёт.
theological_decisions:
- issue: Смысл «жизни»
  choice: не уточнять, является ли жизнь физической, нравственной или эсхатологической
  alternative: перевести как «истинная жизнь» или «путь жизни»
  rationale: Исходное понятие допускает богословскую глубину, но не содержит такого явного уточнения.
- issue: Характер отделения народа
  choice: «народа, отделившего себя»
  alternative: «избранного народа» или «народа, который был отделён»
  rationale: Возвратная формулировка сохраняет выраженную в консультационном слое субъектность народа и не вводит прямо понятие избрания либо божественного пассива.
- issue: Оценка прежнего времени
  choice: «считается ничем»
  alternative: «не ставится им в вину»
  rationale: 'Более буквальная формулировка сохраняет неясность: речь может идти об отмене значения прежнего периода, а не обязательно о юридическом прощении.'
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис упрощён ровно настолько, чтобы длинная причинно-временная конструкция читалась естественно. Представленный сирийский лист обрывается в начале данного предложения (ܘܐܝܠܝܢ ܕܡܢ ܩܕܝܡ ܠܐ, «но те, кто прежде не…»), поэтому оставшаяся часть сверена по предоставленному аудированному английскому консультационному слою; формулировка не добавляет конфессионального толкования.
