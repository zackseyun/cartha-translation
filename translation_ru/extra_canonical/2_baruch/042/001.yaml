  text: And he answered and said to me, “These things also I will show you.
translation:
  language: ru
  text: 'И он ответил мне: «Я покажу тебе и это».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܢܐ ܘܐܡܪ ܠܝ
  choice: И он ответил мне
  rationale: Обычная сирийская формула ответа буквально сочетает глаголы «ответить» и «сказать». В современном русском одного глагола «ответил» достаточно, чтобы естественно передать её смысл без тяжеловесного «ответил и сказал».
- source_word: ܐܦ ܗܠܝܢ
  choice: и это
  rationale: Сочетание означает «также эти [вещи]». Русское «и это» кратко и естественно сохраняет присоединительное значение частицы ܐܦ.
- source_word: ܐܚܘܝܟ
  choice: Я покажу тебе
  rationale: Форма выражает обещание показать или открыть собеседнику дальнейшее. «Покажу» сохраняет конкретный образ исходного глагола и не усиливает его до богословски нагруженного «открою».
theological_decisions:
- issue: Характер обещанного сообщения
  choice: Сохранено нейтральное «покажу»
  alternative: «открою» или «объясню»
  rationale: Стих обещает дальнейшее явление или разъяснение, но сам по себе не уточняет его способ. Нейтральное «покажу» не снимает этой смысловой открытости.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественная реплика без архаического «ответил и сказал». Местоимение «он» не капитализировано, поскольку исходный текст не кодирует конфессиональное правило почтительного написания.
