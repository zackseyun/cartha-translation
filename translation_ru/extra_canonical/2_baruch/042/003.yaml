  text: 'And as for what you said concerning those who drew near and those who withdrew, this is the word:'
translation:
  language: ru
  text: А о том, что ты сказал о тех, кто отделился, и о тех, кто был взят, — вот слово:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сирийский текст здесь труден. Буквально: «о тех, кто отделился (или: был отделён), и о тех, кто был взят». В некоторых реконструкциях первую группу понимают как «тех, кто приблизился».'
    reason: Отмечает расхождение между непосредственно засвидетельствованными сирийскими формами и реконструированным чтением, отражённым в английском консультационном тексте.
lexical_decisions:
- source_word: ܐܬܦܪܫܘ
  choice: отделился
  rationale: Форма означает «отделились / были отделены»; перевод сохраняет неопределённость относительно добровольности отделения.
- source_word: ܐܬܢܣܒܘ
  choice: был взят
  rationale: Буквально «были взяты»; не уточняется, кем, куда и означает ли это смерть или иное устранение.
- source_word: ܡܠܠ
  choice: вот слово
  rationale: Передано в согласии с формулой, засвидетельствованной консультационным английским текстом; русская формулировка сохраняет вводный, незавершённый характер стиха.
theological_decisions:
- issue: Кого обозначают отделившиеся и взятые
  choice: Не уточнять их идентичность и участь
  alternative: Истолковать их как умерших, отступников либо приблизившихся к Богу
  rationale: Сам стих не даёт достаточных оснований для такого богословского уточнения.
translation_notes:
  register: 'Современный литературный русский язык с достоинством библейской речи. Синтаксис намеренно оставлен вводным: двоеточие показывает, что последующее изречение продолжается в следующем стихе.'
