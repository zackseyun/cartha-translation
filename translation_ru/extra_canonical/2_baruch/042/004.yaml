  text: Those who were formerly under subjection and afterward withdrew and mingled themselves with the seed of the mixed peoples—their former time is reckoned as nothing.
translation:
  language: ru
  text: Те, кто прежде находились в подчинении, а потом отделились и смешались с потомством смешанных народов, — их прежнее время считается за ничто.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܦܪܫܘ
  choice: отделился
  rationale: Передаёт значение отделения или ухода, не уточняя без достаточных оснований, было ли оно добровольным или принудительным.
- source_word: ܐܬܢܣܒܘ
  choice: находился в подчинении
  rationale: В данном контексте выражение понято как прежнее подчинённое положение; формулировка сохраняет официально-исторический оттенок.
- source_word: ܒܙܒܢܐ
  choice: прежнее их время
  rationale: Сохраняет временную категорию источника и не заменяет её более толковательными понятиями вроде прежних заслуг или прежнего положения.
- source_word: ܒܡܘ̈ܬܐ
  choice: с потомством смешанных народов
  rationale: Следует смыслу засвидетельствованного чтения и консультационного слоя, естественно передавая образ семени как потомства.
- source_word: ܢܚܝܒܘܢ
  choice: считается за ничто
  rationale: Передаёт итоговую отрицательную оценку прежнего времени без добавления конкретной юридической или богословской категории.
theological_decisions:
- issue: Значение прежнего времени после отделения и смешения
  choice: прежнее их время считается за ничто
  alternative: их прежнее положение более не принимается в расчёт
  rationale: Выбрана менее истолковывающая формулировка, сохраняющая резкость и некоторую неясность исходного утверждения.
translation_notes:
  register: Современный литературный русский язык с достоинством историко-апокалиптической прозы. Синтаксис сделан ясным, но неоднозначность выражения «прежнее их время» сохранена.
