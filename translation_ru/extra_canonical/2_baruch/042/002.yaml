base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/042/002.yaml
  text: And as for what you said, ‘For whom and for how many will these things be?’ — for those who have believed, there will be the good things spoken beforehand; but for those who despise them, the opposite of these things.
translation:
  language: ru
  text: 'А о том, что ты сказал: «Для кого и для скольких будет всё это?» — тем, кто ожидает благ, о которых было сказано заранее, достанутся эти блага; а тем, кто презирает их, — противоположное.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܣܒܪܝܢ
  choice: поверил
  rationale: Форма передаёт доверие или веру; в данном контексте естественное русское соответствие — «поверил».
- source_word: ܛܒ̈ܬܐ
  choice: блага
  rationale: Множественное число обозначает обещанные благие дары или участь; «блага» сохраняет широту значения.
- source_word: ܕܡܩܕܡܐ ܐܡܝܪܢ
  choice: предвозвещённые прежде
  rationale: Передаёт смысл благ, о которых было сказано заранее, сохраняя пророческий оттенок.
- source_word: ܒܡܘܒܠܐ ܕܗܠܝܢ
  choice: противоположное
  rationale: По контексту речь идёт об участи, противоположной названным благам; единственное собирательное звучит по-русски естественно.
theological_decisions:
- issue: Характер обещанных благ и противоположной участи
  choice: Оставить их неопределёнными
  alternative: Уточнить как спасение и осуждение
  rationale: Стих сам не конкретизирует содержание обеих участей, поэтому перевод не вводит дополнительного богословского толкования.
- issue: Объект пренебрежения
  choice: «ими», то есть предвозвещёнными благами
  alternative: «пренебрегает этим» или без выраженного объекта
  rationale: Местоимение обеспечивает ясную русскую связь с ближайшим множественным обозначением благ, не меняя общей смысловой оппозиции.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Риторический вопрос и противопоставление двух групп сохранены; синтаксис сделан ясным без конфессиональных уточнений.
