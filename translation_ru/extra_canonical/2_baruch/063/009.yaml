- source_word: ܐܘܪܫܠܡ (предполагаемое чтение целевого стиха)
  choice: Иерусалим
  rationale: Нормативная русская форма названия города.
- source_word: ܐܝܣܪܐܝܠ (предполагаемое чтение целевого стиха)
  choice: Израиль
  rationale: Сохраняет коллективно-историческое обозначение народа без уточнения, которого нет в консультационном тексте.
- source_word: ܐܘܠܨܢܐ / эквивалент со значением стеснения (предполагаемое чтение)
  choice: бедствия
  rationale: Передаёт смысл тяжёлого стеснения или скорби естественным современным русским словом, не сужая его до конкретного вида опасности.
theological_decisions:
- issue: Кем совершено спасение и избавление
  choice: Сохранены страдательные конструкции без названного деятеля.
  alternative: 'Добавить: «Бог спас Сион…»'
  rationale: Источник в предоставленном консультационном слое не называет действующее лицо прямо; его добавление устранило бы возможную богословскую и повествовательную недосказанность.
- issue: Соотношение Сиона, Иерусалима и Израиля
  choice: Все три наименования сохранены как отдельные параллельные члены.
  alternative: Объединить Сион и Иерусалим или истолковать Израиль как их население.
  rationale: Так сохраняются поэтический параллелизм и объём исходных обозначений без навязанного отождествления.
