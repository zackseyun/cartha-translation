revisions:
- from: Когда царь Езекия услышал, что замышляет царь Ассирии — прийти, схватить его, погубить его народ, оставшиеся два с половиной колена и даже низвергнуть Сион, — он положился на свои дела, возложил надежду на свою праведность и обратился к Могущественному.
  to: Когда царь Езекия услышал, что замышляет царь Ассирии — прийти, захватить его, погубить его народ, то есть оставшиеся два с половиной колена, и даже низвергнуть Сион, — он положился на свои дела, возложил надежду на свою праведность и обратился к Могущественному.
  rationale: Внесены только синтаксическое уточнение приложения «оставшиеся два с половиной колена» и более естественный для контекста глагол «захватить». Значение, титул и намеренная богословская напряжённость формулы о делах и праведности сохранены.
