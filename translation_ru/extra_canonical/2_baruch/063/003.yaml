base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/063/003.yaml
  text: and when Hezekiah the king heard what the king of Assyria was devising—to come, seize him, destroy his people, the two and a half tribes that remained, and even overthrow Zion—then Hezekiah trusted in his works, hoped in his righteousness, and spoke with the Mighty One.
translation:
  language: ru
  text: Когда царь Езекия услышал, что замышляет царь Ассирии — прийти, захватить его, погубить его народ, то есть оставшиеся два с половиной колена, и даже низвергнуть Сион, — он положился на свои дела, возложил надежду на свою праведность и обратился к Могущественному.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܙܘܩܐ ܡ̇ܠܟܐ
  choice: царь Езекия
  rationale: Передача имени и титула в принятой современной русской библейской форме.
- source_word: ܡ̇ܠܟܐ ܕܐܬܘܪ
  choice: царь Ассирии
  rationale: Естественная русская передача сирийского обозначения ассирийского царя.
- source_word: ܥܒ̈ܕܝܗܘܢ / works (по контрольному слою)
  choice: свои дела
  rationale: Сохранено предметное значение «дела, деяния», без богословского уточнения их характера.
- source_word: ܙܕܝܩܘܬܐ / righteousness (по контрольному слою)
  choice: свою праведность
  rationale: Сохраняет связь надежды Езекии с его собственной праведностью и не сглаживает богословское напряжение.
- source_word: Mighty One (контрольное чтение)
  choice: Могущественному
  rationale: Титульное обозначение Бога передано с прописной буквы; вариант достаточно понятен и не подменяет исходный эпитет словом «Бог».
theological_decisions:
- issue: Езекия полагается на свои дела и праведность
  choice: Сохранить прямую формулировку без оценочного комментария
  alternative: Сгладить как «уповал на Бога за свои праведные дела»
  rationale: Текст связывает упование с делами и праведностью самого Езекии; толкование или исправление этого напряжения не принадлежит переводу.
- issue: Божественный титул
  choice: Могущественный
  alternative: Всесильный / Бог
  rationale: «Могущественный» сохраняет характер эпитета и не вносит дополнительного догматического оттенка абсолютного всемогущества, которого само обозначение не обязательно выражает.
translation_notes:
  register: Современный литературный русский язык с библейски достойным, но ясным синтаксисом. Перечень угроз оформлен через инфинитивы; «низвергнуть Сион» сохраняет сильный образ исходного сообщения. Из-за повреждённости и неустойчивой сегментации сирийского корпусного фрагмента содержание стиха сверено с аудированным английским консультационным слоем, но формулировка не копирует его механически.
