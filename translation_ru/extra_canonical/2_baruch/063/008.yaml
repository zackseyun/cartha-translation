  to: И в то время Я сжёг их тела изнутри, но снаружи сохранил невредимыми их одежды и оружие, чтобы были видны ещё более великие чудеса Могущественного и чтобы имя Его возвещалось по всей земле.
  rationale: 'Исправлено значение целевой части: чудеса должны быть видны, а не «явиться». Также уточнено синтаксическое соотнесение пространственного контраста «изнутри — снаружи». Остальные ключевые элементы и возвышенный современный литературный регистр сохранены.'
