base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/063/008.yaml
  text: And at that time I burned their bodies from within, but I preserved their garments and their weapons outwardly, so that the still greater wonders of the Mighty One might be seen, and that his name might be spoken throughout the whole earth.
translation:
  language: ru
  text: И в то время Я сжёг их тела изнутри, но снаружи сохранил невредимыми их одежды и оружие, чтобы были видны ещё более великие чудеса Могущественного и чтобы имя Его возвещалось по всей земле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܦܓܪ̈ܐ
  choice: тела
  rationale: Обычное значение сирийского слова в данном повествовательном контексте; речь идёт о поражённых воинах.
- source_word: ܠܒܪ
  choice: снаружи
  rationale: Сохраняет пространственное противопоставление внутреннего сожжения тел и внешней неповреждённости одежды и оружия.
- source_word: ܚܝܠܬܢܐ
  choice: Могущественный
  rationale: Передаёт божественный титул без замены его конфессионально окрашенным или более узким наименованием.
- source_word: ܢܬܩܪܐ ܫܡܗ
  choice: имя Его возвещалось
  rationale: В контексте всемирной известности чуда оборот означает не простое произнесение имени, а его провозглашение и прославление.
theological_decisions:
- issue: Лицо говорящего в описании сверхъестественного поражения
  choice: «Я сжёг… сохранил» с прописной буквы
  alternative: «я сжёг… сохранил» со строчной буквы
  rationale: Контекст речи связывает действие с божественным говорящим; прописная буква в русском тексте помогает обозначить референта, не добавляя нового титула.
- issue: Характер сохранения одежды и оружия
  choice: «сохранил невредимыми»
  alternative: «сохранил»
  rationale: Неповреждённость внешних предметов подразумевается контрастом со сожжёнными изнутри телами; слово делает этот контраст естественным по-русски, не меняя сути чуда.
- issue: Цель знамения
  choice: «чтобы имя Его возвещалось по всей земле»
  alternative: «чтобы имя Его произносилось по всей земле»
  rationale: «Возвещалось» естественно передаёт распространение славы имени благодаря знамению, не уточняя сверх текста, было ли это поклонением, хвалой или простым рассказом.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Сохранены параллельные целевые конструкции и резкий контраст «изнутри — снаружи»; архаизмы и конфессионально специфическая терминология не вводятся.
