  text: “Behold, Sennacherib is prepared to destroy us, and he will be exalted and lifted up when he destroys Zion.”
translation:
  language: ru
  text: '[b]«Вот, Сеннахирим готов погубить нас; он возвысится и вознесётся, когда[a] погубит Сион».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «если погубит».'
    reason: Возможное условное понимание оборота, хотя временное значение лучше соответствует сирийскому тексту и контексту.
  - marker: b
    text: 'Или: «И сказал он: „Вот…“»'
    reason: Возможный иной способ провести границу между стихами 3 и 4.
lexical_decisions:
- source_word: ܚܙܘܩܐ
  choice: Сеннахирим
  rationale: В данном повествовательном контексте это имя ассирийского царя; использована закрепившаяся русская библейская форма.
- source_word: ܡܬܬܪܝܡ … ܪܡܐ
  choice: возвысится и вознесётся
  rationale: Сохранена усилительная пара близких по смыслу глаголов, передающая надменное самовозвышение царя.
- source_word: ܡܕܐ
  choice: когда
  rationale: Оборот имеет временное значение и выражает уверенное ожидание события, а не простое условие.
- source_word: ܨܗܝܘܢ
  choice: Сион
  rationale: Традиционная и общепонятная русская передача библейского топонима.
theological_decisions:
- issue: Уверенность Сеннахирима в уничтожении Сиона
  choice: когда погубит Сион
  alternative: если погубит Сион
  rationale: Временная формулировка сохраняет самоуверенность говорящего; условное прочтение оставлено в примечании как текстуально возможный вариант.
- issue: Граница реплики между стихами 3 и 4
  choice: Стих начинается непосредственно со слова «Вот»
  alternative: '«И сказал он: „Вот…“»'
  rationale: Вводная формула, вероятно, относится к концу предыдущего стиха по принятому делению; вариант отмечен, чтобы не скрывать пограничную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Повтор «возвысится и вознесётся» намеренно сохранён как риторическое усиление; синтаксис сделан ясным для обычного читателя.
