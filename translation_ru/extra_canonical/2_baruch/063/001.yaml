  text: And the eighth bright waters that you saw—these are the integrity and uprightness of Hezekiah king of Judah, and the gracious favor that came upon him.
translation:
  language: ru
  text: А восьмые светлые воды, которые ты видел, — это непорочность и праведность Езекии, царя Иудеи, и милостивое благоволение, сошедшее на него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܘܗܪ̈ܐ
  choice: светлые воды
  rationale: Сохраняет символический образ благоприятных вод и естественно противопоставляется тёмным водам в видении.
- source_word: ܬܪܝܨܘܬܐ / ܬܩܢܘܬܐ (control-backed sense)
  choice: непорочность и праведность
  rationale: Передаёт двойной нравственный акцент, не сводя два близких понятия к одному; формулировка понятна и уместна в возвышенном повествовании.
- source_word: ܛܝܒܘܬܐ
  choice: милостивое благоволение
  rationale: Сочетание выражает благую, даруемую свыше милость, не ограничивая слово узким конфессиональным значением термина «благодать».
theological_decisions:
- issue: Относится ли похвала только к нравственным качествам Езекии или также к оказанному ему Божьему благоволению
  choice: Сохранены и непорочность с праведностью Езекии, и отдельное милостивое благоволение, сошедшее на него.
  alternative: Понять всю фразу только как описание нравственного совершенства Езекии либо только как отвлечённое указание на Божью благость.
  rationale: Два нравственных определения и последующее благоволение представлены как различимые элементы; перевод не сливает их и не уточняет сверх текста источник благоволения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет отождествление символа с его истолкованием; подлинная смысловая двойственность близких нравственных терминов передана парой существительных.
