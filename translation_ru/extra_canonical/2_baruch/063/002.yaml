  text: For when Sennacherib was stirred up for destruction, and his wrath was inflamed so as to destroy, together with the multitude of the nations that were with him,
translation:
  language: ru
  text: Ибо когда Сеннахирим был подвигнут к гибели и ярость его воспылала, чтобы уничтожить вместе со множеством народов, бывших с ним,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܣܢܚܪܝܒ (имя, отражённое в контексте и контрольном английском слое)
  choice: Сеннахирим
  rationale: Традиционная и узнаваемая русская форма имени ассирийского царя.
- source_word: ܐܬܬܙܝܥ / семантика побуждения, приведения в движение
  choice: был подвигнут
  rationale: Сохраняет пассивность исходной конструкции и не называет явно деятеля.
- source_word: ܐܒܕ / семантика гибели и уничтожения
  choice: к гибели; погубить
  rationale: Передаёт повторяющуюся в стихе лексику гибели, не сглаживая напряжение между участью Сеннахирима и намерением уничтожить.
- source_word: ܣܘܓܐܐ ܕܥܡ̈ܡܐ
  choice: множество народов
  rationale: Естественный русский эквивалент собирательного выражения.
theological_decisions:
- issue: Неуказанный источник действия в пассивной конструкции
  choice: был подвигнут к гибели
  alternative: Бог подвиг Сеннахирима к гибели
  rationale: В стихе деятель прямо не назван; добавление Бога устранило бы подлинную недосказанность.
- issue: К кому относится цель «погубить»
  choice: чтобы погубить его вместе со множеством народов
  alternative: чтобы он погубил множество народов
  rationale: Выбранное чтение соответствует эсхатологически-судебному ходу контекста и контрольному слою, но сохраняет необычное сочетание пассива и воспылавшей ярости.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического повествования. Конечная запятая сохранена, поскольку стих синтаксически продолжается в следующем стихе.
