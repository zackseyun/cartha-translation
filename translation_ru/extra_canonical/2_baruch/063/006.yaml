translation:
  language: ru
  text: И тогда Могущественный повелел Рамиилу, Своему ангелу, который говорит с тобой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܢܐ (контекстуально восстановленный титул)
  choice: Могущественный
  rationale: Передаёт божественный титул со значением силы и могущества естественным и возвышенным русским словом, не заменяя его истолковывающим именованием.
- source_word: ܦܩܕ
  choice: повелел
  rationale: Соответствует властному распоряжению и сохраняет торжественный повествовательный регистр.
- source_word: ܪܡܝܐܝܠ / Ramiel
  choice: Рамиилу
  rationale: Традиционная русская передача семитского имени; дательный падеж обусловлен глаголом «повелел».
- source_word: ܡܠܐܟܗ
  choice: Своему ангелу
  rationale: Возвратное притяжательное местоимение ясно связывает ангела с Могущественным и звучит естественно по-русски.
- source_word: ܕܡܡܠܠ ܥܡܟ
  choice: который говорит с тобой
  rationale: Сохраняет настоящее время и прямое обращение без уточнения личности адресата.
theological_decisions:
- issue: Передача божественного титула Mighty One
  choice: Могущественный
  alternative: Всесильный / Сильный
  rationale: «Могущественный» сохраняет титульный характер и смысл силы, не внося более абсолютного утверждения, которое может подразумевать «Всесильный».
- issue: Отнесение притяжательного местоимения при слове «ангел»
  choice: Своему ангелу
  alternative: его ангелу
  rationale: Русское возвратное местоимение однозначно указывает на подлежащее главной части и не меняет богословского содержания.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования. Порядок слов слегка адаптирован к русской норме; краткость и синтаксическая структура исходного высказывания сохранены.
