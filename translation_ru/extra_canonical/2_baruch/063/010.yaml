lexical_decisions:
- source_word: ܚܝܠܬܢܐ (предполагаемое титульное обозначение в стихе; «Могущественный» / «Сильный»)
  choice: Могущественный
  rationale: Передаёт божественный титул без сведения его к более узкому «Всемогущий» и естественно звучит в современном литературном русском.
- source_word: «говорилось о нём / произносилось» (формулировка, отражённая в контрольном английском слое)
  choice: было у всех на устах
  rationale: Естественная русская передача широкой известности и постоянного упоминания имени; связь с «именем» сохраняется.
- source_word: «святая земля»
  choice: в святой земле
  rationale: Сохраняет сакральное определение территории без добавления географического уточнения, которого нет в свидетельстве стиха.
theological_decisions:
- issue: Передача божественного титула Mighty One
  choice: Могущественный
  alternative: Всемогущий; Сильный
  rationale: «Могущественный» сохраняет самостоятельный титул и не усиливает его до идеи абсолютного всемогущества; «Сильный» в данном контексте по-русски звучит менее ясно как титул.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным строем. Параллелизм радости народа и прославления Божьего имени сохранён; последняя часть передана идиоматически, без конфессиональных добавлений.
