  text: And he went out and destroyed their multitude; the number of the chiefs alone was one hundred and eighty-five thousand, and each one of them had the like number.
translation:
  language: ru
  text: И он вышел и истребил всё их множество; одних только предводителей было сто восемьдесят пять тысяч, и у каждого из них было столько же людей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܢܦܩ ... ܘܐܘܒܕ
  choice: «И он вышел и истребил»
  rationale: Передано как последовательность действий одного лица в третьем лице мужского рода; по контексту речь идёт о посланном ангеле. Глагол «истребил» соответствует контексту уничтожения войска.
- source_word: ܣܘܓܐܗܘܢ
  choice: «их множество»
  rationale: Сохраняет собирательное значение сирийского выражения и связь с многочисленным вражеским войском.
- source_word: ܪ̈ܝܫܢܐ
  choice: «предводителей»
  rationale: В военном контексте обозначает начальников или командиров; «предводители» понятно современному читателю и не задаёт излишне точного воинского звания.
- source_word: ܚܕ ܚܕ ܡܢܗܘܢ ... ܐܝܟ
  choice: «у каждого из них было столько же людей»
  rationale: Явно выражает подразумеваемое число подчинённых при каждом предводителе, устраняя неестественную для русского языка оборванность фразы «столько же», но не меняя числового утверждения.
theological_decisions:
- issue: Лицо подлежащего в начале стиха
  choice: «он»
  alternative: «я»
  rationale: 'Сирийское свидетельство и ближайший контекст указывают на третье лицо: действие совершает посланный свыше ангел, а не рассказчик. Вариант первого лица отражает прежнее ошибочное прочтение и не вынесен в примечание как равноправный.'
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис сохраняет две части исходного сообщения: уничтожение множества и уточнение его численности. Числительное дано словами в соответствии с книжным стилем.'
