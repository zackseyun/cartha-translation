lexical_decisions:
- source_word: ܥܢܐ ܘܐܡܪ ܠܝ
  choice: Он ответил и сказал мне
  rationale: Сохранена характерная для сирийского повествования парная формула «ответил и сказал», без сведения её к одному глаголу.
- source_word: ܫܡܥ
  choice: выслушай
  rationale: Повелительная форма единственного числа означает призыв внимательно принять последующее сообщение; «выслушай» естественнее по-русски в данном контексте, чем буквальное «услышь».
- source_word: ܒܪܡ
  choice: итак
  rationale: Здесь частица вводит ответ и переход к последующему разъяснению; «итак» передаёт выводно-переходный оттенок лучше, чем противительное «однако».
- source_word: ܡܠܬܐ
  choice: слово
  rationale: Выбрано широкое соответствие, сохраняющее возможные значения «слово», «речь» и «сообщение» без преждевременного уточнения.
