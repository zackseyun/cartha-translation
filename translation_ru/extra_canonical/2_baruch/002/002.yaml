lexical_decisions:
- source_word: ܥܒ̈ܕܝܟܘܢ (смысл, отражённый в контрольном чтении)
  choice: ваши дела
  rationale: Передаёт поступки или деяния адресатов без добавления нравственной оценки, которой само слово не требует.
- source_word: ܥܡܘܕܐ / ܥܡܗܕܐ (неясное печатное чтение)
  choice: столп
  rationale: Сохраняет архитектурный образ опоры; «крепкий столп» естественно передаёт устойчивость, выраженную определением.
- source_word: ܨܠܘܬܟܘܢ (смысл, отражённый в контрольном чтении)
  choice: ваша молитва
  rationale: Сохранено единственное число, соответствующее параллельной конструкции и проверенному чтению.
- source_word: ܫܘܪܐ
  choice: стена
  rationale: Обычный образ защитной городской стены; «прочная» передаёт её силу без излишнего усиления.
theological_decisions:
- issue: Защитная роль дел и молитвы праведников
  choice: Сохранено прямое образное сопоставление дел со столпом, а молитвы со стеной.
  alternative: Истолковать фразу как утверждение, что праведники заслуживают сохранение города.
  rationale: Текст выражает образ поддержки и защиты, но не разъясняет механизм или основание этой защиты; перевод не вводит дополнительной доктринальной причинности.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Параллелизм двух частей сохранён; связка и тире делают образную конструкцию естественной по-русски.
