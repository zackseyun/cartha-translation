lexical_decisions:
- source_word: ܐܝܠܝܢ ܕܕܡ̇ܝܢ ܠܟܘܢ
  choice: всем, кто подобен вам
  rationale: Сохраняет прямое сопоставление с адресатами и естественно передаёт сирийское множественное местоимение ܠܟܘܢ («вам»), относящееся к Варуху и Иеремии.
- source_word: ܕܬܚܙܘܢ ܠܟܘܢ ܡܢ
  choice: покиньте
  rationale: Сирийское выражение буквально означает «посмотрите за собой от» и идиоматически призывает удалиться из города; повелительная форма естественно передаёт содержание обращения.
- source_word: ܡܟܝܠ ܕܝܢ
  choice: Но теперь
  rationale: Передаёт временное значение ܡܟܝܠ и контрастивно-переходную функцию ܕܝܢ без утяжеления русской фразы.
