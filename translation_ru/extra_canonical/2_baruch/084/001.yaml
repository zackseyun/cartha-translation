base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/001.yaml
  text: Look, while I am still alive I have made these things known to you, because I said that you should learn what is good; for the Mighty One commanded me to instruct you, and before I die I will set before you some of the ordinances of his judgment.
translation:
  language: ru
  text: Вот, пока я ещё жив, я открыл вам всё это, потому что сказал вам учиться добру. Ведь Могущественный повелел мне наставить вас, и прежде чем умру, я изложу перед вами некоторые установления Его суда.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܐ
  choice: Могущественный
  rationale: Сохранён особый божественный титул, характерный для 2 Варуха; он не заменён общим наименованием «Бог».
- source_word: ܫܦܝܪ̈ܬܐ
  choice: добро
  rationale: В данном наставительном контексте слово указывает на нравственно доброе и достойное; «учиться добру» звучит естественно и ясно по-русски.
- source_word: ܦܘܩ̈ܕܢܐ / ܦܘܩ̈ܕܢܘܗܝ
  choice: установления
  rationale: Слово передаёт обязательные предписания, а сочетание «установления Его суда» сохраняет судебный оттенок контекста.
- source_word: ܚܝ̈ܐ / ܚܝ
  choice: жив
  rationale: Передано прямое указание на то, что Варух сообщает наставление до своей смерти.
theological_decisions:
- issue: Божественный титул
  choice: Могущественный
  alternative: Бог; Господь; Сильный
  rationale: Сохранение титула передаёт особую риторическую и богословскую окраску сирийского текста без конфессионального уточнения.
- issue: Связь наставления с судом
  choice: «установления Его суда»
  alternative: «заповеди Его правосудия»; «судебные постановления»
  rationale: Выбранная формулировка сохраняет возможность понимать выражение и как предписания, относящиеся к Божьему суду, и как установленные Им нормы суда.
- issue: Причинная связь в первой фразе
  choice: «потому что сказал вам учиться добру»
  alternative: «чтобы вы научились добру»
  rationale: Сохранена несколько напряжённая причинная конструкция засвидетельствованного текста, а не заменена более гладкой целевой связью.
