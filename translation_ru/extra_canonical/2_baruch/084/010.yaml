revisions:
- from: И во всякое время настойчиво просите и усердно молитесь всем сердцем, чтобы Сильный примирился с вами[a] и не вменил вам множества ваших грехов, но вспомнил праведность ваших отцов.
  to: И во всякое время настойчиво просите и усердно молитесь всем сердцем, чтобы Сильный примирился с вами[a] и не вменил вам в вину множество ваших грехов, но вспомнил праведность ваших отцов.
  rationale: 'Внесены только безопасные редакторские правки: добавлено нормативное «в вину» при глаголе «вменить» и естественнее сформулирована сноска. Смысл, богословская сдержанность и отмеченная в английской аудиторской традиции неоднозначность сохранены.'
