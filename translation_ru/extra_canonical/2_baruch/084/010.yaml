base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/010.yaml
  text: And at all times keep asking earnestly, and pray diligently with your whole heart, that the Mighty One may be reconciled to you and may not reckon the multitude of your sins, but remember the uprightness of your fathers.
translation:
  language: ru
  text: И во всякое время настойчиво просите и усердно молитесь всем сердцем, чтобы Сильный примирился с вами[a] и не вменил вам в вину множество ваших грехов, но вспомнил праведность ваших отцов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «оказал вам милость».'
    reason: Сирийское выражение допускает передачу как восстановления благосклонности, так и проявления милости.
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: Сильный
  rationale: Сохраняет характерное для 2 Варуха обозначение Бога через могущество, не заменяя его более конфессионально окрашенным титулом.
- source_word: ܡܢ ܟܠܗ ܢܦܫܟܘܢ
  choice: всем сердцем
  rationale: Сирийское выражение буквально связано со «всей душой»; в данном контексте естественная русская формула «всем сердцем» передаёт цельность и искренность молитвы.
- source_word: ܚ̈ܛܗܘܗܝ
  choice: грехов
  rationale: Передаёт нравственно-богословский смысл сирийского слова без смягчения до «проступков».
- source_word: ܙܕܝܩܘܬܐ ܕܐܒܗ̈ܝܗܘܢ
  choice: праведность ваших отцов
  rationale: Сохраняет явную отсылку к праведности предков и не уточняет сверх текста, каким образом она может быть принята во внимание.
theological_decisions:
- issue: Значение просьбы о благосклонности Сильного
  choice: примирился с вами
  alternative: смилостивился над вами
  rationale: Основной вариант сохраняет relationalный оттенок восстановления расположения; вариант с милостью также возможен и указан в сноске.
- issue: Упоминание праведности отцов
  choice: вспомнил праведность ваших отцов
  alternative: зачёл вам праведность ваших отцов
  rationale: «Вспомнил» формально ближе к тексту и не вводит определённой доктрины о вменении заслуг предков.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной библейской окраской. Параллелизм просьбы и молитвы сохранён; синтаксис упрощён лишь настолько, чтобы стих естественно читался по-русски.
