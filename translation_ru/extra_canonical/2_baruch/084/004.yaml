  text: But after his death you cast them away from yourselves, and because of this what had been foretold came upon you.
translation:
  language: ru
  text: Но после смерти Иисуса[a] вы отбросили их от себя, и потому с вами произошло то, что было предсказано.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть Иисуса Навина.
    reason: В сирийском тексте назван Иисус без дополнительного уточнения; контекст указывает на Иисуса Навина.
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܡܘܬܗ ܕܝܫܘܥ
  choice: после смерти Иисуса
  rationale: В сирийском тексте прямо назван Иисус; по контексту речь идёт об Иисусе Навине. Сноска устраняет возможную для современного читателя неясность, не расширяя основной текст.
- source_word: ܐܢܝܢ ܡܢܟܘܢ
  choice: вы отвергли их
  rationale: Местоименное дополнение сохранено без искусственного уточнения его референта; глагольная форма в представленном тексте повреждена или распознана неполно, а значение подтверждается контекстом и контрольным английским слоем.
- source_word: ܐܝܟܢܐ ܕ... ܗܘܝ
  choice: и потому с вами произошло то, что было предсказано
  rationale: Передаёт причинно-следственную связь и исполнение ранее возвещённого; формулировка согласуется с контекстом, хотя строка сирийского свидетельства текстуально неустойчива.
theological_decisions:
- issue: Референт местоимения «их»
  choice: Сохранить местоимение без поясняющей подстановки
  alternative: Заменить на «заповеди», «слова» или «Закон»
  rationale: Доступный сирийский текст не позволяет с полной уверенностью определить референт; конкретизация разрешила бы подлинную неоднозначность за читателя.
- issue: Личность Иисуса
  choice: Оставить в основном тексте «Иисуса», пояснив в сноске, что это Иисус Навин
  alternative: Сразу перевести «Иисуса Навина»
  rationale: Так сохраняется форма исходного текста и одновременно предотвращается ошибочное отнесение имени к Иисусу Христу.
translation_notes:
  register: Современный литературный русский язык, сдержанный и торжественный. Синтаксис сделан ясным, но неоднозначный референт местоимения намеренно не уточняется. Из-за повреждённости или нестабильного распознавания соответствующей сирийской строки перевод опирается на различимые элементы текста, ближайший контекст и аудированный английский консультационный слой.
