base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/002.yaml
  text: Remember how Moses once called heaven and earth as witnesses against you and said, “If you transgress the law, you will be scattered; but if you keep it, you will be kept.”
translation:
  language: ru
  text: 'Вспомните, как Моисей некогда призвал небо и землю в свидетели против вас и сказал: «Если вы преступите Закон[a], то будете рассеяны; но если будете хранить его, то будете сохранены».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нарушите Закон».'
    reason: Отмечает допустимый более нейтральный перевод выражения о преступлении Закона.
lexical_decisions:
- source_word: ܢܡܘܣܐ
  choice: Закон
  rationale: Сирийское слово обозначает закон, прежде всего данный Богом Закон; прописная буква уместна в данном библейском контексте.
- source_word: ܬܬܪܚܩܘܢ / контекстуальный глагол рассеяния
  choice: будете рассеяны
  rationale: Передаёт угрозу удаления и рассеяния народа, сохраняя пассивную форму и не уточняя исполнителя.
- source_word: контекстуальная пара «хранить — быть сохранёнными»
  choice: будете хранить его — будете сохранены
  rationale: Сохраняет смысловую взаимность между верностью Закону и сохранением народа, не превращая её в более узкое конфессиональное утверждение.
theological_decisions:
- issue: Характер связи между соблюдением Закона и сохранением народа
  choice: 'Сохранена условная формулировка без пояснения механизма: «если будете хранить его, то будете сохранены»'
  alternative: «если исполните его, Бог сохранит вас»
  rationale: Источник не требует явно называть Бога действующим лицом; пассивная конструкция сохраняет богословскую недосказанность.
- issue: Свидетельство неба и земли
  choice: «призвал небо и землю в свидетели против вас»
  alternative: «засвидетельствовал вам небом и землёй»
  rationale: Формулировка естественна по-русски и сохраняет судебно-заветный оттенок свидетельства против народа.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. «Некогда» передаёт прежнее действие без архаической тяжеловесности; параллелизм условия сохранён.
