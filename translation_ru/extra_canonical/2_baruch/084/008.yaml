lexical_decisions:
- source_word: ܢܡܘܣܐ
  choice: Закон
  rationale: Сирийское слово означает закон; прописная буква уместна, поскольку речь идёт о данном Богом Законе как определённой священной реальности.
- source_word: ܥܕ̈ܐ
  choice: праздники
  rationale: Передаёт установленные дни священных собраний и празднований без добавления конфессионально специфической терминологии.
- source_word: ܫ̈ܒܐ
  choice: субботы
  rationale: Сохраняет множественное число и прямое значение обозначения субботних дней.
- source_word: ܕܝܬܩܐ ܕܐܒ̈ܗܝܟܘܢ
  choice: завет ваших отцов
  rationale: Сохраняет библейскую формулу родительного отношения и обращение во множественном числе.
theological_decisions:
- issue: Статус Закона в перечне святынь, которые следует помнить
  choice: «Закон» с прописной буквы
  alternative: «закон» со строчной буквы
  rationale: Контекст перечисляет Сион, святую землю и завет отцов; поэтому речь, вероятнее всего, о конкретном богооткровенном Законе, однако перевод не уточняет его объём и не вводит позднейших богословских категорий.
- issue: Смысл повеления помнить
  choice: Сохранено буквальное «помните»
  alternative: «храните верность» или «не забывайте» во всём стихе
  rationale: Формулировка сохраняет напряжение между памятью как внутренним отношением и памятью, выраженной в верности и практике, не сводя её только к одному аспекту.
