base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/006.yaml
  text: 'So I also say to you after your suffering: if you listen to these words that have been spoken to you, you will receive from the Mighty One what has been kept ready and stored up for you.'
translation:
  language: ru
  text: 'И я также говорю вам: после того как вы претерпели страдания, если будете внимать тому, что было сказано вам, то получите от Могущественного то, что приготовлено и сохранено для вас.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܐ
  choice: Могущественного
  rationale: Сохраняет характерное для 2 Варуха обозначение Бога — «Могущественный», не заменяя его более общим словом «Бог».
- source_word: ܬܣܒܘܢ
  choice: получите
  rationale: Передаёт прямое значение глагола «взять, принять, получить» в данном контексте обещания.
- source_word: ܕܩܝܡܐ … ܠܟܘܢ
  choice: то, что приготовлено и сохранено для вас
  rationale: Контекст и контрольный перевод указывают на заранее уготованное и сберегаемое для адресатов; парная формулировка по-русски сохраняет оба смысловых оттенка.
theological_decisions:
- issue: Связь обещанного воздаяния с послушанием услышанному
  choice: «если будете внимать тому, что было сказано вам, то получите…»
  alternative: «если послушаетесь этих слов, то получите…»
  rationale: Условная связь сохранена без уточнения природы или основания воздаяния; «внимать» естественно охватывает и слушание, и принятие сказанного.
- issue: Обозначение Бога титулом
  choice: «от Могущественного»
  alternative: «от Всемогущего»
  rationale: «Могущественный» точнее соответствует сирийскому ܚܝܠܬܐ и не усиливает титул до более специального богословского термина «Всемогущий».
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис слегка приподнят, но не архаичен; подлинная условность обещания и традиционный божественный титул сохранены.
