translation:
  language: ru
  text: И вот, Моисей заранее говорил вам, прежде чем это случилось с вами; и вот, это случилось с вами, потому что вы оставили Закон.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܘܫܐ
  choice: Моисей
  rationale: Общепринятая русская форма библейского имени.
- source_word: ܡܢ ܩܕܝܡ
  choice: заранее
  rationale: Передаёт временное значение «прежде, заблаговременно» естественным современным русским языком.
- source_word: ܢܓܕܫܟܘܢ
  choice: это постигло вас
  rationale: Глагол обозначает случившееся с адресатами событие, здесь бедствие; «постигло» сохраняет серьёзный пророческий тон.
- source_word: ܢܡܘܣܐ
  choice: Закон
  rationale: В контексте Моисея речь идёт о данном Богом Законе; прописная буква ясно передаёт референт без добавления конфессионального толкования.
theological_decisions:
- issue: Причина постигшего бедствия
  choice: «потому что вы оставили Закон»
  alternative: «ибо вы отступили от Закона»
  rationale: Формулировка следует засвидетельствованному смыслу стиха и сохраняет прямую связь между оставлением Закона и произошедшим, не усиливая её дополнительным богословским объяснением.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Повтор «и вот» сохранён как риторический указатель исполнения прежнего предостережения.
