translation:
  language: ru
  text: И многое другое он говорил вам, когда вы, двенадцать племён, были вместе в пустыне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܐܦ … ܐܡܪ ܗܘܐ ܠܟܘܢ
  choice: И многое другое он говорил вам
  rationale: Конструкция ܐܡܪ ܗܘܐ передаёт продолженное или повторявшееся действие в прошлом. Неясно распознанное в наборе слово перед глаголом по контексту и контрольному переводу означает «другое»; по-русски естественно «многое другое».
- source_word: ܟܕ … ܬܪܥܣܪ ܫܒܛ̈ܐ … ܒܡܕܒܪܐ
  choice: когда вы, двенадцать племён, были вместе в пустыне
  rationale: Сохранены временная связь, обращение ко всем двенадцати племенам и указание на их совместное пребывание в пустыне.
theological_decisions:
- issue: К кому относится местоимение «он»
  choice: Сохранить местоимение «он» без подстановки имени
  alternative: «Моисей говорил вам»
  rationale: Контекст указывает на Моисея, однако в самом стихе субъект выражен местоименно; явное имя устранило бы исходную анафорическую связь.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная и понятная формулировка. Обособление «двенадцать племён» делает приложение ясным без добавления толкования.
