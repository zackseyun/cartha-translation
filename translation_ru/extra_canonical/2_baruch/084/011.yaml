  naturalness: Фраза звучит как современный литературный русский с уместно сжатым, торжественным библейским ритмом. Оборот «рождённым» несколько возвышен, но в данном жанре естественен и ясен.
  terminology: «Судить», «милости» и «горе» согласованы с библейским регистром. Множественное число «милостей» обоснованно сохраняет форму и образ оригинала. Написание «Он / Своих» последовательно отражает уважительное обозначение Бога и не меняет смысла.
