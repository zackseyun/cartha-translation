translation:
  language: ru
  text: Ибо если Он станет судить нас не по множеству Своих милостей, горе всем нам, рождённым.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐ ܐܝܟ
  choice: не по
  rationale: 'Сочетание передаёт отрицание нормы или меры суда: «не согласно», «не по»; в данном контексте естественно по-русски «не по множеству».'
- source_word: ܣܘܓܐܐ ܕܪ̈ܚܡܘܗܝ
  choice: множеству Своих милостей
  rationale: Сохраняет количественный образ источника и множественное число слова «милости», не сводя выражение к более толковательному «безмерному милосердию».
- source_word: ܘܝ ܠܟܠܢ ܝܠܝ̈ܕܐ
  choice: горе всем нам, рождённым
  rationale: Передаёт краткое общее обозначение всех родившихся и сохраняет торжественную форму предостережения.
theological_decisions:
- issue: Соотношение Божьего суда и милости
  choice: «судить нас не по множеству Своих милостей»
  alternative: «судить нас без Своих великих милостей»
  rationale: Выбранный вариант сохраняет исходное напряжение между судом и мерой милости и не превращает фразу в утверждение о полном отсутствии милости.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским строем. Местоимение «Своих» написано с прописной буквы как уважительное указание на Бога; дополнительных пояснений, отсутствующих в тексте, не внесено.
