  text: Hand on this letter and the traditions of the law to your children after you, just as your fathers handed them on to you.
translation:
  language: ru
  text: Передайте это письмо и предания Закона своим детям после вас, как и ваши отцы передали их вам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܓܪܬܐ (предполагаемое чтение в стихе; «письмо, послание»)
  choice: это письмо
  rationale: «Письмо» естественно по-русски обозначает данный письменный текст; указательное «это» сохраняет отсылку к самому посланию.
- source_word: ܡܫܠܡܢܘܬܐ / лексема со значением «предание, передача» (реконструируется по контрольному переводу)
  choice: предания
  rationale: Существительное передаёт не просто сведения, а унаследованное и передаваемое наставление; множественное число согласовано с контрольным слоем, не уточняя содержание сверх источника.
- source_word: ܢܡܘܣܐ («закон»)
  choice: Закона
  rationale: Здесь имеется в виду религиозно-нравственный Закон как определённое священное установление, поэтому употреблена прописная буква.
- source_word: ܒܢ̈ܝܟܘܢ («ваши дети/сыновья»)
  choice: своим детям
  rationale: «Дети» сохраняет общий родовой смысл и естественнее современного ограничительного «сыновья».
theological_decisions:
- issue: Характер «преданий Закона»
  choice: Сохранено широкое выражение «предания Закона»
  alternative: «учение Закона» или «установления Закона»
  rationale: Перевод не отождествляет предание исключительно с письменными постановлениями или поздней устной традицией и тем самым сохраняет смысловую широту передачи Закона.
- issue: Преемственность между поколениями
  choice: 'Сохранена параллель: «передайте… как… передали»'
  alternative: Перефразировать как обязанность обучать потомков
  rationale: Формальная параллель подчёркивает именно получение и последующую передачу наследия, не добавляя богословских выводов.
translation_notes:
  register: Современный литературный русский язык с достоинством эпистолярного наставления. Повтор глагола «передать» намеренно сохранён ради межпоколенческой параллели. Из-за того что предоставленный сирийский материал представляет собой широкий, местами повреждённый и перекрывающийся корпус страниц, формулировка сверена с аудированным английским консультационным слоем, но не расширена за его пределы.
