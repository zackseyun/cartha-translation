revisions:
- from: Но если мы теперь не знаем, для чего пришли, и не распознаём того, что уже было, то не увидим и неизмеримого, и не станет известно превосходство того, кто установил это от начала; и немало живых существ изумилось бы».[a]
  to: Но если мы теперь не знаем, для чего пришли, и не распознаём того, что уже было, то неизмеримое не будет увидено и не будет явлено превосходство того, кто установил это от начала; и немалое число живых существ изумилось бы»[a]
  rationale: Правка сохраняет все намеренно неуточнённые референты, но точнее воспроизводит пассивные будущие формы контрольного чтения и исправляет неестественную количественно-условную конструкцию в конце. Сноска и её содержание сохранены; исправлено лишь размещение маркера.
