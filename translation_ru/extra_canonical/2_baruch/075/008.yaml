  yaml_path: translation/extra_canonical/2_baruch/075/008.yaml
  text: But if we do not now know why we came, and do not recognize what has been, neither shall the immeasurable be seen, nor shall the preeminence of him who established it from the beginning be made known; and not a few living creatures would be astonished.”
translation:
  language: ru
  text: Но если мы теперь не знаем, для чего пришли, и не распознаём того, что уже было, то неизмеримое не будет увидено и не будет явлено превосходство того, кто установил это от начала; и немалое число живых существ изумилось бы»[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сирийский текст в сохранившейся разметке этого места повреждён или смещён относительно границ стиха; поэтому синтаксис и некоторые соответствия восстановлены с опорой на контекст и контрольное чтение. Не вполне ясно, к чему именно относятся слова «неизмеримое» и «это».
    reason: Предупреждает читателя о текстовой и референциальной неопределённости, не перегружая основной текст реконструктивными деталями.
lexical_decisions:
- source_word: ܝܕܥ / ܐܬܝܕܥ
  choice: знаем / распознаём / станет известно
  rationale: Передаёт повторяющееся в сирийском смысловое поле знания и узнавания, сохраняя различия, уместные в русском контексте.
- source_word: неизмеримое (по контрольному чтению английского POB)
  choice: неизмеримое
  rationale: Сохраняет отвлечённость и подлинную неопределённость предмета речи, не подставляя толкование вроде «безмерное величие» или «вечность».
- source_word: preeminence (контрольное чтение английского POB)
  choice: превосходство
  rationale: Нейтрально передаёт идею высшего положения или величия, не вводя дополнительного конфессионального содержания.
- source_word: established it from the beginning (контрольное чтение английского POB)
  choice: установил это от начала
  rationale: Сохраняет указательное местоимение и временную формулу, не конкретизируя неоднозначный референт.
- source_word: living creatures (контрольное чтение английского POB)
  choice: живых существ
  rationale: Более широкий эквивалент, чем «людей», и потому не сужает круг подразумеваемых существ.
theological_decisions:
- issue: Кто именно «установил это от начала»
  choice: того, кто установил это от начала
  alternative: Того, Кто установил всё изначально
  rationale: Строчная буква и сохранение местоименной конструкции не навязывают отождествление, хотя контекст может указывать на Бога.
- issue: Референт «неизмеримого»
  choice: оставлен неуточнённым
  alternative: безмерное величие Бога
  rationale: Уточнение устранило бы смысловую напряжённость и добавило бы толкование, отсутствующее в доступном свидетельстве.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической молитвенной речи. Синтаксис несколько торжественный, но понятный; архаизмы и конфессионально маркированные формулы исключены.
