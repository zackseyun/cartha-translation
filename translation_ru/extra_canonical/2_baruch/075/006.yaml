base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/075/006.yaml
  text: For unless, in compassion, you have mercy on human beings, those who are under your right hand cannot come to these things, except those who are called in the excellent number.
translation:
  language: ru
  text: Ибо, если Ты по состраданию не помилуешь людей, те, кто находится под Твоей десницей, не смогут достичь этого, кроме призванных в славное число.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «кроме тех, кто призван войти в достойное число». Сирийский текст в этой части труден, а точный смысл характеристики этого «числа» не вполне ясен.'
    reason: Фиксирует реальную текстовую и смысловую неопределённость, не навязывая читателю учение о составе этой группы.
lexical_decisions:
- source_word: ܒܪ̈ܚܡܝܢ / compassion-context wording
  choice: по состраданию
  rationale: Передаёт основание милости естественным современным русским оборотом, не сливая сострадание с последующим глаголом «помилуешь».
- source_word: ܬܪܘܗܝ ܕܝܡܝܢܐ (textually difficult; cf. consultation layer “under your right hand”)
  choice: под Твоей десницей
  rationale: Сохраняет образ власти и покровительства Божьей правой руки; «десница» уместна в торжественном библейском регистре и понятна в контексте.
- source_word: ܢܣܩܘܢ / attainment wording
  choice: достичь этого
  rationale: Естественно выражает вступление в описанное выше блаженное состояние, не уточняя сверх текста его механизм.
- source_word: ܒܡܢܝܢܐ ... / excellent number
  choice: в славное число
  rationale: Передаёт положительную качественную характеристику названной группы без искусственного русского выражения «превосходное число».
theological_decisions:
- issue: Соотношение всеобщей Божьей милости и особой группы призванных
  choice: 'Сохранено противопоставление: никто не достигает обещанного без Божьей милости, при этом отдельно названы «призванные в славное число».'
  alternative: Истолковать исключение как указание на заранее избранных, которые якобы не нуждаются в милости.
  rationale: Такое догматическое уточнение отсутствует в тексте; формулировка сохраняет его напряжение и синтаксическую неоднозначность.
- issue: Образ Божьей правой руки
  choice: «под Твоей десницей»
  alternative: «находящиеся под Твоей властью» или «Твои избранники»
  rationale: Метафору не следует заменять богословским толкованием, поскольку она может одновременно указывать на власть, защиту и благоволение.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Сохранено традиционное слово «десница», тогда как остальной синтаксис сделан прозрачным и современным.
