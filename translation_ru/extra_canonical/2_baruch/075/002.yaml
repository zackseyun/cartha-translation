lexical_decisions:
- source_word: ܪ̈ܚܡܝܟ
  choice: Твои милости
  rationale: Передаёт множественное число и личное обращение; «милости» сохраняет библейскую многогранность сострадания и благоволения.
- source_word: ܢܒܨܐ / ܢܥܩܒ
  choice: постичь
  rationale: В контексте риторического вопроса глагол означает исследовать до понимания; «постичь» звучит естественно по-русски и передаёт невозможность исчерпывающего познания.
- source_word: ܕܠܐ ܡܣܬܝܟܝܢ
  choice: которым нет конца
  rationale: Естественная русская передача значения безграничности или неисчерпаемости при сохранении относительной конструкции.
theological_decisions:
- issue: Неисчерпаемость Божьих милостей
  choice: сохранён прямой риторический вопрос без пояснения
  alternative: «Твои бесконечные милости непостижимы»
  rationale: Прямой вопрос сохраняет форму исходного высказывания и не превращает её в отвлечённое догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык; краткая, возвышенная и понятная формулировка. Заглавная буква в местоимении «Твои» отмечает обращение к Богу в принятом русском библейском регистре.
