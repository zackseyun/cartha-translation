  yaml_path: translation/extra_canonical/2_baruch/075/007.yaml
  text: But we who live—if we know why we came, and submit ourselves to him who brought us out from Egypt—we shall come again, and we shall remember what has passed, and rejoice over what was.
translation:
  language: ru
  text: Но мы, живущие, — если знаем, для чего пришли, и подчиняемся Тому, кто вывел нас из Египта, — вновь придём, вспомним минувшее и будем радоваться тому, что было.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ḥayyînan (reconstructed from the audited verse evidence)
  choice: живущие
  rationale: Передаёт значение «жить», а не «оставаться»; субстантивированное причастие естественно звучит по-русски.
- source_word: mšaʿbdînan (reconstructed from the audited verse evidence)
  choice: подчиняемся
  rationale: Настоящее время сохраняет параллелизм с «знаем» и выражает продолжающееся состояние, а не завершённое действие.
- source_word: appeq (reconstructed from the audited verse evidence)
  choice: вывел
  rationale: Глагол означает «вывести»; в упоминании Египта явно слышен контекст исхода. Вариант «возвёл» был бы лексически неточен.
- source_word: what has passed / what was (audited consultation layer)
  choice: минувшее / тому, что было
  rationale: Различение двух близких выражений сохраняет поэтический параллелизм и не сводит их без необходимости к одной формуле.
theological_decisions:
- issue: К кому относится «Тому, кто вывел нас из Египта»
  choice: Местоимение «Тому» написано с прописной буквы как указание на Бога, но имя не добавлено.
  alternative: тому / Господу
  rationale: Контекст исхода однозначно указывает на Бога; при этом перевод не вводит отсутствующего в формулировке божественного имени.
- issue: Смысл будущего возвращения
  choice: вновь придём
  alternative: вернёмся
  rationale: Более формальная передача сохраняет глагол движения и наречие повторности, не уточняя, куда именно или в каком эсхатологическом смысле состоится приход.
translation_notes:
  register: 'Современный литературный русский язык с торжественным, но понятным синтаксисом. Тире выделяют условную конструкцию и позволяют сохранить протяжённость исходной мысли. Примечания из английского консультационного слоя не перенесены: последние сверки прямо устраняют предполагаемые варианты «остающиеся», «подчинились» и «возвёл» как менее точные, поэтому они не отражают подлинной неоднозначности источника.'
