  yaml_path: translation/extra_canonical/2_baruch/075/005.yaml
  text: Or who among those born can hope to come to these things, unless it is one to whom you show mercy and are gracious?
translation:
  language: ru
  text: И кто из рождённых может надеяться достичь всего этого, кроме того, кого Ты помилуешь и к кому явишь благоволение?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܘ
  choice: И кто
  rationale: В данном контексте частица продолжает ряд риторических вопросов; русское «И кто» естественнее буквального «Или кто», не меняя логической связи.
- source_word: ܝ̈ܠܝܕܐ / «those born»
  choice: из рождённых
  rationale: Сохранено широкое обозначение смертных людей без уточнения, которого источник не даёт.
- source_word: «hope to come to these things»
  choice: надеяться достичь этого
  rationale: Передаёт направленность к описанной реальности; единственное «этого» естественно обобщает предшествующее содержание.
- source_word: «show mercy»
  choice: помилуешь
  rationale: Краткий и ясный русский глагол сохраняет личный акт милости.
- source_word: «are gracious»
  choice: явишь благоволение
  rationale: Сохраняет отдельный от помилования оттенок благосклонности и не сливает два параллельных выражения.
theological_decisions:
- issue: Условие достижения обещанного
  choice: «кроме того, кого Ты помилуешь и к кому явишь благоволение»
  alternative: «если только Ты не помилуешь его и не окажешь ему милость»
  rationale: Сохранена направленность милости к человеку и различие двух параллельных действий, без уточнения механизма спасения или внесения конфессиональной терминологии.
translation_notes:
  register: Современный литературный русский язык с достоинством риторической молитвенной речи. Заглавное «Ты» указывает на обращение к Богу. Маркеры сносок не требуются.
