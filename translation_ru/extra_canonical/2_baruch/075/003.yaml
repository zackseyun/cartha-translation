lexical_decisions:
- source_word: ܣܘܟܠܐ
  choice: разум
  rationale: Передаёт значение «понимание, разумение» естественным современным русским словом, не сужая смысл до отдельного замысла или намерения.
- source_word: ܡܬܕܪܟܐ
  choice: постичь
  rationale: Глагол выражает достижение понимания; «постичь» сохраняет возвышенный, но понятный регистр.
theological_decisions:
- issue: Непостижимость Божьего разума
  choice: Сохранён риторический вопрос без пояснения причин непостижимости.
  alternative: «Кто может понять Твои замыслы?»
  rationale: Вариант с «замыслами» конкретизировал бы объект и снял бы более широкую мысль о непостижимости Божьего разума.
translation_notes:
  register: Современный литературный русский язык; краткая риторическая формулировка с умеренно возвышенным звучанием. Местоимение «Твой» написано с прописной буквы как обращение к Богу.
