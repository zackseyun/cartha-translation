  text: And when I had gone out and dismissed them, I went away from there and said to them, “Look, I am going to my dwelling in Hebron.”
translation:
  language: ru
  text: 'Когда я вышел и отпустил их, то ушёл оттуда, сказав им: «Вот, я иду в своё жилище в Хевроне».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В дошедшем сирийском тексте формы глаголов в начале стиха допускают текстовую неясность относительно числа и лица; по ходу повествования они поняты как действия Варуха: «я вышел и отпустил их».'
    reason: Сохраняет прозрачность в отношении формального расхождения между напечатанными формами сирийского свидетеля и связным повествовательным смыслом, отражённым также в контрольной традиции.
lexical_decisions:
- source_word: ܫ̇ܪܝܘ ܐܢܘܢ
  choice: отпустил их
  rationale: Глагол означает освобождать, отпускать или позволять уйти. В данном официальном повествовательном контексте «отпустил их» естественно передаёт завершение собрания.
- source_word: ܠܕܝܪܝ ܠܚܒܪܘܢ
  choice: в своё жилище в Хевроне
  rationale: Перевод сохраняет засвидетельствованное сирийским текстом указание на жилище перед названием места, не сводя выражение просто к «в Хеврон».
- source_word: ܗܐ
  choice: вот
  rationale: «Вот» сохраняет указательно-привлекающую внимание функцию сирийской частицы и уместно в торжественной прямой речи.
- source_word: ܐ̇ܙܠܬ ܠܝ ܡܢ ܬܡܢ
  choice: ушёл оттуда
  rationale: Возвратная частица при глаголе движения не требует отдельной передачи по-русски; «ушёл оттуда» точно и естественно выражает переход к новому месту.
