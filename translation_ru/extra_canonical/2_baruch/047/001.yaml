translation_notes:
  register: Современный литературный русский язык; повествование передано просто и достойно. Прямая речь сохраняет библейскую торжественность без архаизмов. Союзно-деепричастная перестройка «сказав им» устраняет тяжеловесное повторение личных форм, не меняя последовательности действий.
