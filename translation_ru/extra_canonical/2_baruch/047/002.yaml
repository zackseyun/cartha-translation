  text: And afterward my companions left me, and I came to the cedar where he had spoken with me; and I sat there and fasted seven days.
translation:
  language: ru
  text: А затем спутники оставили меня, и я пришёл к кедру, где Он говорил со мной. Там я сел и постился семь дней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܒܪܐ
  choice: спутники
  rationale: В данном повествовательном контексте слово обозначает сопровождавших Варуха людей; «спутники» естественнее и точнее, чем общее «друзья».
- source_word: ܐܪܙܐ
  choice: кедр
  rationale: Прямое соответствие сирийскому слову «кедр»; определённость передана сочетанием «к кедру».
- source_word: ܐܬܡܠܠ ܥܡܝ
  choice: Он говорил со мной
  rationale: Пассивно-возвратная сирийская форма в этом контексте идиоматически выражает речь божественного собеседника; местоимение с прописной буквы сохраняет референцию, не добавляя имени.
- source_word: ܨܡܬ
  choice: постился
  rationale: Обычное значение глагола в религиозном контексте — соблюдал пост.
- source_word: ܫܒܥܐ ܝܘܡ̈ܝܢ
  choice: семь дней
  rationale: Прямое и естественное соответствие исходному выражению.
theological_decisions:
- issue: Не названный прямо субъект речи у кедра
  choice: «Он» с прописной буквы
  alternative: «со мной говорили» / «Бог говорил со мной»
  rationale: Контекст указывает на божественного собеседника, однако исходный текст в самом стихе не называет Его Богом. Местоимение сохраняет эту сдержанность и связь с предшествующим повествованием.
translation_notes:
  register: Современный литературный русский язык, повествовательный и сдержанно возвышенный регистр. Разбивка на два предложения облегчает чтение, не меняя последовательности действий.
