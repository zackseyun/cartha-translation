  naturalness: 'Русский текст литературный и понятный. Небольшие правки устраняют несколько менее естественных или менее точных оборотов: «во главе облака» заменено на «над его вершиной», «смешивались между собой» — на «в них было смешение», а «сошли» применительно к водам — на «низверглись».'
