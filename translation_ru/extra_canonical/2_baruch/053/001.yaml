  yaml_path: translation/extra_canonical/2_baruch/053/001.yaml
  text: 'And when I had said these things, I slept there, and I saw a vision by night. And behold, I saw a cloud ascending from the great sea, and it was full of white and black waters, and there were many colors in those waters, and at its head there appeared the likeness of a great lightning. And I looked, and that cloud passed swiftly in a violent rush and covered the whole earth. And after this, waters began to descend from it upon the earth, and I saw that the appearance of those waters was not one and the same. And after these things again I saw black, and after these things again bright, again black, and again bright. And this happened up to twelve times, but in all of them the black were more than the bright.


    And it came to pass, at the end of the cloud, that black waters, darker than all the former waters, descended, and there was a mingling in them, and wherever those waters descended they produced devastation and destruction. And after these things I saw the lightning that I had seen at the head of the cloud, and it seized the cloud and dragged it down to the earth. And after this I saw, and behold, twelve rivers[a] were ascending from the sea, and they surrounded that lightning and became subject to it, and they rejoiced over that proclamation and praised it. And I awoke because of my fear.'
translation:
  language: ru
  text: 'И когда я сказал это, я уснул там и увидел ночью видение. И вот, я увидел облако, поднимавшееся из великого моря. Оно было наполнено белыми и чёрными водами, и в этих водах было много разных цветов; над вершиной облака показалось подобие великой молнии. Я смотрел: это облако стремительно неслось в неудержимом порыве и покрыло всю землю. После этого из него стали изливаться на землю воды, и я увидел, что вид этих вод был неодинаков. Затем я снова увидел чёрное, после него — светлое, потом опять чёрное и опять светлое. Так повторилось до двенадцати раз, но во всех случаях чёрного было больше, чем светлого.


    Когда облако подошло к концу, из него низверглись чёрные, тёмные воды, темнее всех прежних вод. В них было смешение, и всюду, куда нисходили эти воды, они несли разорение и гибель. После этого я увидел молнию, которую прежде видел над вершиной облака: она схватила облако и повлекла его вниз, к земле. Затем я увидел: вот, двенадцать рек[a] поднимались из моря. Они окружили ту молнию и подчинились ей; они радовались этому возвещению[b] и прославляли его. И от страха я пробудился.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «двенадцать светов».'
    reason: 'Текстуальный вариант: близость сирийских написаний допускает чтение «светы» вместо «реки».'
  - marker: b
    text: 'Возможно: «радовались тому вестнику и прославляли его». Сирийское слово допускает как личное значение («глашатай, вестник»), так и значение возвещения.'
    reason: Лексическая и синтаксическая неоднозначность ܟܪܘܙ; сноска сохраняет возможное личное прочтение, не навязывая его основному тексту.
lexical_decisions:
- source_word: ܥܢܢܐ
  choice: облако
  rationale: Обычное значение сирийского слова; в видении облако движется и изливает воды.
- source_word: ܩ̈ܝܐ / ܡ̈ܝܐ
  choice: воды
  rationale: Единообразно передаёт текучее содержимое облака и сохраняет образ нисходящих вод, не сужая его до обычного дождя.
- source_word: ܐܘܟܡܐ / ܢܗܝܪܐ
  choice: чёрное / светлое
  rationale: Сохраняет прямое цветовое и световое противопоставление сирийского текста.
- source_word: ܒܪܩܐ
  choice: молния
  rationale: Основное значение слова и центральный зрительный образ повествования.
- source_word: ܒܪܗܛܐ ܩܫܝܐ
  choice: в неудержимом порыве
  rationale: Естественно по-русски выражает быстроту и силу движения облака, заложенные в сирийской фразе.
- source_word: ܚܒܠܐ ܘܐܒܕܢܐ
  choice: разорение и гибель
  rationale: Передаёт парные понятия ущерба и уничтожения, сохраняя их риторическое усиление.
- source_word: ܐܚܕܗ̇ ܘܐܬܚ…
  choice: схватила облако и повлекла его вниз, к земле
  rationale: Сохраняет силу первого глагола и нисходящее движение повреждённого второго выражения с опорой на контрольное чтение.
- source_word: ܢܗ̈ܪܐ / ܢܘܗ̈ܪܐ
  choice: реки
  rationale: «Реки» лучше согласуются с их восхождением из моря и поддерживаются контрольной традицией; графически близкое чтение «светы» отмечено в сноске.
- source_word: ܟܪܘܙ
  choice: вестник
  rationale: Форма обозначает вестника или глашатая; мужской указательный элемент и последующее местоимение поддерживают личное, а не отвлечённое значение.
theological_decisions:
- issue: Историческое отождествление чёрных и светлых вод
  choice: Оставить символы без толкования
  alternative: Назвать соответствующие исторические эпохи или лица
  rationale: В данном месте сначала излагается само видение; последующее истолкование не следует вносить в его текст заранее.
- issue: Двенадцать рек или двенадцать светов
  choice: В основном тексте «двенадцать рек», вариант «двенадцать светов» в сноске
  alternative: Поставить «двенадцать светов» в основной текст
  rationale: Контекст моря и движение образов благоприятствуют «рекам», но чтение первичной сирийской формы в предоставленной транскрипции требует прозрачного отражения варианта.
- issue: Значение ܟܪܘܙ
  choice: Передать как «вестник»
  alternative: Передать как «возвещение» или заменить местоимением, относящимся к молнии
  rationale: Сирийская грамматическая форма допускает и, вероятнее, предполагает личного глашатая; перевод не отождествляет его богословски и сохраняет напряжённость образа.
