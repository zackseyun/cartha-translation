- from: 'И когда я сказал это, я уснул там и увидел ночью видение. И вот, я увидел облако, поднимавшееся из великого моря. Оно было наполнено белыми и чёрными водами, и в этих водах было много разных цветов; а во главе облака показалось подобие великой молнии. Я смотрел: это облако стремительно неслось в неудержимом порыве и покрыло всю землю. После этого из него стали изливаться на землю воды, и я увидел, что вид у этих вод был неодинаков. Затем я снова увидел чёрное, после него — светлое, потом опять чёрное и опять светлое. Так повторилось до двенадцати раз, но во всех случаях чёрного было больше, чем светлого.


    Когда облако подошло к концу, из него сошли чёрные и мрачные воды, темнее всех прежних вод. Они смешивались между собой, и всюду, куда сходили эти воды, они несли разорение и гибель. После этого я увидел молнию, которую прежде видел во главе облака: она схватила облако и повлекла его вниз, к земле. Затем я увидел: вот, двенадцать рек[a] поднимались из моря. Они окружили ту молнию и подчинились ей; они радовались тому вестнику[b] и прославляли его. И от страха я пробудился.'
  to: 'И когда я сказал это, я уснул там и увидел ночью видение. И вот, я увидел облако, поднимавшееся из великого моря. Оно было наполнено белыми и чёрными водами, и в этих водах было много разных цветов; над вершиной облака показалось подобие великой молнии. Я смотрел: это облако стремительно неслось в неудержимом порыве и покрыло всю землю. После этого из него стали изливаться на землю воды, и я увидел, что вид этих вод был неодинаков. Затем я снова увидел чёрное, после него — светлое, потом опять чёрное и опять светлое. Так повторилось до двенадцати раз, но во всех случаях чёрного было больше, чем светлого.


    Когда облако подошло к концу, из него низверглись чёрные, тёмные воды, темнее всех прежних вод. В них было смешение, и всюду, куда нисходили эти воды, они несли разорение и гибель. После этого я увидел молнию, которую прежде видел над вершиной облака: она схватила облако и повлекла его вниз, к земле. Затем я увидел: вот, двенадцать рек[a] поднимались из моря. Они окружили ту молнию и подчинились ей; они радовались этому возвещению[b] и прославляли его. И от страха я пробудился.'
