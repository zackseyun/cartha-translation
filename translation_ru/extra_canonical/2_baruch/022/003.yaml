- source_word: ܐܙܠ ܒܐܘܪܚܐ
  choice: отправился в путь
  rationale: Передаёт сирийское «идёт по дороге / отправляется дорогой» естественным современным русским выражением.
- source_word: ܡܫܟܚ ܕܢܬܢܝܚ
  choice: может обрести покой
  rationale: Сохраняет значение возможности найти отдых или успокоение после плавания.
- source_word: ܠܠܡܐܢܐ
  choice: гавани
  rationale: Точное и естественное соответствие морскому порту или пристани как цели плавания.
theological_decisions:
- issue: Неясный объект местоимения в первом риторическом вопросе
  choice: не найдёт его
  alternative: не достигнет цели пути
  rationale: Сирийский текст сохраняет местоименную, несколько неясную формулировку; перевод не вводит отсутствующую в источнике «цель» и отмечает трудность сноской.
translation_notes:
  register: Современный литературный русский; сохранена форма двух параллельных риторических вопросов и образность дороги, моря и гавани.
