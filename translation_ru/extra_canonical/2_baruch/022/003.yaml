  text: Does one who sets out on a road fail to find it? Or can one who sails on the sea find rest unless he reaches the harbor?
translation:
  language: ru
  text: Разве тот, кто идёт по дороге, не найдёт её[a]? Или плывущий по морю может обрести покой, не достигнув гавани?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «не найдёт её»; местоимение относится к дороге, однако точный смысл этого выражения не вполне ясен. Возможно: «не достигнет конца пути».'
    reason: Сохраняет грамматический референт сирийского текста и отмечает смысловую трудность, не устраняя её интерпретацией.
