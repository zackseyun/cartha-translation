  text: Or if a treasure is given to someone, does he not take confidence from it, so that he is no longer shaken?
translation:
  language: ru
  text: Или тот, кому дано сокровище, разве не обретает в нём уверенность, так что уже не колеблется?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܓܙܐ (gazzā)
  choice: сокровище
  rationale: 'Прямое и естественное соответствие: ценность, переданная человеку и служащая ему надёжной опорой.'
- source_word: ܡܣܬܒܪ (mestbar)
  choice: обретает уверенность
  rationale: Форма связана с надеждой, уверенностью и ободрением; в данном риторическом сравнении речь о чувстве надёжности, которое даёт полученное сокровище.
- source_word: ܡܬܬܙܝܥ (mettezīʿ)
  choice: колеблется
  rationale: Передаёт состояние потрясённости, беспокойства или утраты устойчивости; «колеблется» сохраняет образ и естественно сочетается с «уверенностью».
theological_decisions:
- issue: Характер уверенности, которую даёт сокровище
  choice: Не уточнять, является ли эта уверенность психологическим спокойствием или объективной защищённостью.
  alternative: Перевести как «чувствует себя в безопасности» или «уже не тревожится».
  rationale: Сирийский текст допускает оттенки надежды, уверенности и устойчивости; нейтральная формулировка сохраняет широту сравнения и не привносит богословского толкования.
translation_notes:
  register: Современный литературный русский язык; сохранены риторический вопрос и образ внутренней устойчивости. Формулировка достаточно близка к сирийской конструкции, но перестроена ради естественного русского синтаксиса.
