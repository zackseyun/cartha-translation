  text: Or if someone sows the earth, unless he loses instead of his fruits, is he afterward ruined by famine?
translation:
  language: ru
  text: 'Или тот, кто засевает землю: если вместо плодов он понесёт убыток, разве не погубит его затем голод?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сирийский оборот буквально означает: «если он потеряет (или: погубит) вместо его плодов». Объект глагола не назван; перевод «понесёт убыток» передаёт смысл утраты, не уточняя, что именно было потеряно.'
    reason: Глагол ܡܘܒܕ может означать «терять, губить», а ܚܠܦ — «вместо, взамен»; сжатая конструкция не позволяет надёжно назвать объект утраты.
lexical_decisions:
- source_word: ܙܪܥ ܐܪܥܐ
  choice: засевает землю
  rationale: Передаёт обычное сирийское выражение о посеве земли естественным современным русским языком.
- source_word: ܡܘܒܕ
  choice: отдаст
  rationale: Буквально глагол может значить «губит, теряет, расходует». В контексте земледелия речь, вероятно, о семени, которое земледелец расходует при посеве; «отдаст» сохраняет идею утраты ради будущего урожая.
- source_word: ܚܠܦ ܦܐܪ̈ܘܗܝ
  choice: ради её плодов
  rationale: ܚܠܦ допускает значения «в обмен на, вместо, ради». Здесь выбрано целевое значение обмена нынешнего семени на будущие плоды, при этом неоднозначность отмечена в сноске.
- source_word: ܡܚܒܠ ܠܗ ܟܦܢܐ
  choice: голод … не будет губить его
  rationale: Сохраняет сильное значение ܚܒܠ — причинять ущерб, губить — и персонификацию голода.
theological_decisions:
- issue: Образ посева и будущего избавления от голода
  choice: Сохранить риторический вопрос и земледельческую метафору без богословского истолкования.
  alternative: Явно связать посев с наградой, воскресением или эсхатологическим упованием.
  rationale: Сам стих выражает мысль посредством житейского сравнения, а его конкретное богословское применение раскрывается более широким контекстом и не должно вноситься в перевод.
translation_notes:
  register: Современный литературный русский, с достоинством и ясностью. Риторическая структура оригинала сохранена; подразумеваемое «семя» введено для понятности и сопровождено текстологической сноской.
