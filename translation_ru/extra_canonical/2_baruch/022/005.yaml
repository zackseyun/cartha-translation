revisions:
- from: Или тот, кто засевает землю, если не отдаст семя ради её плодов, разве после этого голод уже не будет губить его?[a]
  to: 'Или тот, кто засевает землю: если вместо плодов он понесёт убыток, разве не погубит его затем голод?[a]'
  rationale: 'Исправлены два взаимосвязанных смысловых сдвига: добавленное «семя» и целевое «ради её плодов» заменены нейтральным выражением утраты вместо ожидаемых плодов; заключительный вопрос приведён в соответствие с логикой сравнения и английским аудиторским следом. Сноска сохраняет грамматическую и смысловую неопределённость исходного сирийского оборота.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T21:06:46Z'
review_pass:
  verdict: revise
  source_fidelity: 'Черновик верно передаёт образ посева и персонификацию голода, но существенно меняет условие: сирийское ܐܠܐ ܡܘܒܕ ܚܠܦ ܦܐܪ̈ܘܗܝ естественнее понимается как «если вместо плодов он понесёт утрату/убыток», а не как добровольная отдача семени ради получения плодов. Риторический вопрос далее предполагает, что голод погубит такого человека, а не что не будет губить его.'
  naturalness: Формулировка «не отдаст семя ради её плодов» неестественно мотивирует образ и создаёт обратную причинно-следственную связь. «Если вместо плодов он понесёт убыток» ясно передаёт сжатый оборот и сохраняет невыраженный объект утраты.
  terminology: Специальных богословских терминов в стихе нет. «Засевает землю», «плоды», «голод» и «погубит» соответствуют регистру и образности сирийского текста.
  issues:
  - severity: high
    issue: Смысл ܡܘܒܕ ܚܠܦ ܦܐܪ̈ܘܗܝ передан как «отдаст семя ради её плодов».
    rationale: Конструкция указывает на утрату вместо ожидаемых плодов, а не на расходование семени ради урожая; добавление «семя» и значение «ради» вносят неподтверждённую интерпретацию.
  - severity: high
    issue: 'Риторический вопрос передан с отрицанием результата: «голод уже не будет губить его».'
    rationale: 'В контексте условие отсутствия плодов ведёт к губительному голоду; английская контрольная версия также передаёт: «is he afterward ruined by famine?».'
  - severity: low
    issue: «Уже» не имеет явной опоры в тексте.
    rationale: ܬܘܒ уместнее передать как «затем/после этого» в связи с последовательностью образа, не усиливая его разговорным «уже».
