  text: 'And it happened after these things, and behold, I heard a voice, and I saw a might fixed upon me. And a voice was heard from on high and said to me:'
translation:
  language: ru
  text: 'И было после этих событий: вот, я услышал голос и увидел силу, установленную надо мной[a]. И с высоты послышался голос, который сказал мне:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «силу, установленную для меня»; сирийское выражение допускает оттенки закрепления, установления или назначения.'
    reason: 'Форма ܕܐܬܩܒܥ ܠܝ неоднозначна: она может описывать силу как установленную над Варухом либо предназначенную для него. Примечание сохраняет эту неопределённость.'
lexical_decisions:
- source_word: ܘܗܘܐ ܡܢ ܒܬܪ ܗܠܝܢ
  choice: И было после этого
  rationale: Сохраняет семитскую повествовательную формулу, но звучит понятно и достойно на современном русском.
- source_word: ܚܝܠܐ
  choice: силу
  rationale: ܚܝܠܐ обозначает силу или могущество; нейтральное «сила» сохраняет широту исходного слова.
- source_word: ܕܐܬܩܒܥ ܠܝ
  choice: утвердившуюся на мне
  rationale: Передаёт пассивную идею чего-то установленного или закреплённого по отношению к Варуху, не подменяя её более истолковывающим «снизошедшую».
- source_word: ܡܢ ܡܪܘܡܐ
  choice: с высоты
  rationale: Прямое и естественное соответствие выражению «из вышины/с высоты», без уточнения, отсутствующего в тексте.
theological_decisions:
- issue: Характер увиденной силы
  choice: сила, утвердившаяся на мне
  alternative: сила, данная мне / сошедшая на меня
  rationale: Сирийская форма подчёркивает установленность или закреплённость; перевод не определяет без достаточного основания, была ли сила дарована, ниспослана или являлась отдельным видимым могуществом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским ритмом. Частица «вот» сохранена как элемент видения и внезапного восприятия; повтор слова «голос» сохранён вслед за сирийским текстом.
