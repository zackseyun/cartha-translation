  language: ru
  text: Или беременная женщина, если родит без мук, разве не ожидает, что в её утробе — мёртвое дитя?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «убитого (или умерщвлённого) в её утробе». Формулировка сирийского текста необычна.'
    reason: Поясняет сильное буквальное значение ܩܛܝܠܐ и сохраняет заметную смысловую трудность оригинала.
lexical_decisions:
- source_word: ܐܢܬܬܐ ܕܒܛܢܐ
  choice: беременная женщина
  rationale: Прямо передаёт сирийское обозначение женщины, носящей ребёнка.
- source_word: ܕܠܐ ܟܐܒ̈ܐ
  choice: без мук
  rationale: ܟܐܒ̈ܐ буквально означает «боли»; в контексте родов естественное русское соответствие — «муки».
- source_word: ܠܐ ܡܣܒܪܐ
  choice: разве не ожидает
  rationale: Сохранены отрицание и риторическая форма сирийского текста; глагол допускает значения «ожидать, предполагать, надеяться».
- source_word: ܩܛܝܠܐ
  choice: мёртвое дитя
  rationale: Буквально это «убитый, умерщвлённый»; по контексту беременности субстантивированное слово обозначает мёртвого ребёнка.
- source_word: ܒܥܘܒܗ̇
  choice: в её утробе
  rationale: Формально и естественно передаёт пространственный образ оригинала, не устраняя его необычное сочетание с уже упомянутыми родами.
theological_decisions:
- issue: Необычная логика образа рождения и мёртвого дитяти в утробе
  choice: Сохранить формулировку и её напряжение
  alternative: Сгладить до «разве ожидает родить мёртвого ребёнка?»
  rationale: Сирийский текст прямо упоминает «в её утробе» и не даёт достаточных оснований устранять эту трудность как ошибку или истолковывать её богословски.
translation_notes:
  register: Современный литературный русский язык; риторический вопрос и образность оригинала сохранены. Слово «дитя» выбрано ради достоинства и краткости библейского регистра без архаизации.
