  text: Or if someone plants a vineyard, unless he takes from it fruit for nourishment, does not the one who planted it expect to take fruit from it?
translation:
  language: ru
  text: 'Или тот, кто сажает виноградник: разве, если он не получит от него плодов для пропитания, не надеется он получить от него плоды?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܨܒ ܟܪܡܐ
  choice: насадил виноградник
  rationale: Глагол ܢܨܒ означает «сажать, насаждать»; традиционное русское сочетание «насадить виноградник» точно и естественно.
- source_word: ܢܣܒ ܡܢܗ ܦܐܪ̈ܐ
  choice: собирает с него плоды
  rationale: Буквально — «берёт от него плоды»; в контексте виноградника русское «собирает плоды» передаёт действие естественнее, не меняя смысла.
- source_word: ܕܢܬܪܣܐ
  choice: чтобы насытиться
  rationale: Форма от корня со значением питания и насыщения; здесь обозначает назначение плодов — служить пищей.
- source_word: ܡܣܒܪ
  choice: надеется
  rationale: Глагол выражает ожидание с надеждой; «надеется получить» сохраняет направленность ожидания на будущий плод.
theological_decisions:
- issue: Риторическая форма образа о винограднике
  choice: Передать первую часть как риторический вопрос, а вторую как пояснение причины ожидания.
  alternative: Сохранить буквальную конструкцию с «если не» или «разве только не».
  rationale: Контекст представляет ряд риторических сравнений; русская вопросительная форма ясно передаёт их функцию, не добавляя богословского истолкования.
