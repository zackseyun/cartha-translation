  yaml_path: translation/extra_canonical/2_baruch/055/001.yaml
  text: 'And it happened, when I was praying, speaking the first words of this prayer, that I was disturbed and I trembled; and I was reflecting on the seed of humankind—how many are those who have gone, and how few are those who are kept. And as I was considering these things, I heard a voice that said to me:


    “Son of man, why are you troubled, and why are you alarmed? For before you were created, you were known to me, and before you came forth from your mother’s womb, you were promised to me. And for this reason these things that are to come were shown to you.”


    And I said to him, “Lord, you have shown me the multitude of the times, and what has happened in them; but you have not shown me how long it will be. Therefore I ask that I may hear concerning those who have borne witness for righteousness, what is the reward kept for them.” And a multitude of good things and of evil things that are coming was promised to me, and then I went up to the mountain.


    And it came to pass, after seven days, that I came to that place where there was a spring. And as I was sitting there, I was taken up on the chariot of a cloud—not in the body, and I did not know it. And a mystery was shown to me, and I heard a voice that said to me: “See and know how, in this world, their works and their labors are preserved, of those who have acted well and of those who have acted wickedly.”'
translation:
  language: ru
  text: 'И случилось, когда я молился, произнося первые слова этой молитвы, что я пришёл в смятение и задрожал. Я размышлял о роде человеческом: как много тех, кто ушёл, и как мало тех, кто сохраняется. И когда я размышлял об этом, то услышал голос, говоривший мне:


    «Сын человеческий, отчего ты смущён и отчего испуган? Ведь прежде, чем ты был создан, Я знал тебя, и прежде, чем ты вышел из утробы матери, Я знал тебя. Потому тебе и было показано то, чему предстоит совершиться».[a]


    Я сказал Ему: «Господи, Ты показал мне великую протяжённость времени и то, что в нём происходило, но не показал мне, как долго оно продлится.[c] Поэтому прошу: дай мне услышать о тех, кто свидетельствовал ради праведности: какая награда сохраняется для них?» И мне было обещано множество грядущих благ и бедствий. Тогда я поднялся на гору.


    И спустя семь дней я пришёл к тому месту, где был источник. Когда я сидел там, я был вознесён на колеснице из облака[b] — не в теле и сам того не ведал. Мне была показана тайна, и я услышал голос, говоривший мне: «Смотри и узнай, как в этом мире сохраняются дела и труды тех, кто поступал хорошо, и тех, кто поступал нечестиво».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Потому Я показал тебе то, чему предстоит совершиться».'
    reason: Сирийская форма допускает как пассивное «тебе было показано», так и чтение от первого лица «Я показал тебе».
  - marker: b
    text: 'Или: «Когда я сидел там на колеснице из облака, я был вознесён».'
    reason: Синтаксическое присоединение оборота о колеснице допускает обе связи.
  - marker: c
    text: 'Буквально: «от какого времени до какого».'
    reason: Сирийский оборот буквально обозначает границы периода, а по смыслу задаёт вопрос о его продолжительности.
lexical_decisions:
- source_word: ܙܪܥܗ ܕܐܢܫܐ
  choice: роде человеческом
  rationale: Буквально «семя человека/человечества»; современное русское «род человеческий» естественно передаёт собирательное значение потомства, не ограничивая речь одним лицом.
- source_word: ܡܬܕܘܕ / ܡܬܪܗܒ
  choice: смущён / испуган
  rationale: Передаёт сочетание внутренней тревоги и страха, сохраняя различие между двумя сирийскими глаголами.
- source_word: ܬܬܒܪܐ
  choice: был создан
  rationale: Глагол обозначает создание или формирование; в данном контексте «создан» ясно и не вводит дополнительных представлений о способе формирования.
- source_word: ܝܕܝܥ ܗܘܝܬ ܠܝ / ܐܬܝܕܥܬ ܠܝ
  choice: Я знал тебя
  rationale: Естественно передаёт сирийское «ты был известен Мне» и не поддерживает ошибочное чтение «был обещан Мне».
- source_word: ܐܬܚܘܝܬ ܠܟ
  choice: тебе было показано
  rationale: Сохраняет пассивное понимание формы; возможное чтение от первого лица «Я показал тебе» отмечено в сноске.
- source_word: ܪܘܒܐ ܕܙܒܢܐ
  choice: великая протяжённость времени
  rationale: Передаёт идею обширного временного пространства естественнее, чем буквальное и неясное «множество времени».
- source_word: ܡܢ ܐܝܕܐ ܥܕܡܐ ܠܐܝܕܐ
  choice: как долго оно продлится
  rationale: Контекстуально передаёт вопрос о пределах временного периода; буквальная форма сохранена в сноске.
- source_word: ܬܘܪܨܐ
  choice: праведность
  rationale: В контексте свидетельства и сохраняемой награды слово указывает на правильность или правый порядок; «праведность» передаёт нравственный смысл, не уточняя его конфессионально.
- source_word: ܐܫܬܘܕܝܘ
  choice: было обещано
  rationale: Форма от ܫܘܕ в данном контексте обозначает обещание; согласуется с множеством грядущих благ и бедствий как содержанием откровения.
- source_word: ܡܪܟܒܬܐ ܕܥܢܢܐ
  choice: колесница из облака
  rationale: Сохраняет апокалиптический образ и звучит естественно по-русски; возможная синтаксическая связь отмечена в сноске.
- source_word: ܐܬܢܣܒܬ
  choice: был вознесён
  rationale: Передаёт пассивное перемещение вверх в видении, не утверждая окончательного телесного взятия.
- source_word: ܪܐܙܐ
  choice: тайна
  rationale: Обычное сирийское обозначение сокрытой божественной реальности; «тайна» сохраняет апокалиптический регистр.
theological_decisions:
- issue: Предведение Бога до создания пророка
  choice: Передано прямым личным утверждением «Я знал тебя» без дальнейшего догматического пояснения.
  alternative: Понять это как формулу пророческого призвания по образцу Иеремии 1:5 или как одно лишь образное знание.
  rationale: Сирийский текст утверждает предваряющее личное знание, но сам не объясняет его природу и не требует отождествления с конкретной формулой призвания.
- issue: «Многие ушли, немногие сохраняются»
  choice: Сохранена открытая формулировка о человеческом роде.
  alternative: Истолковать это как точное соотношение спасённых и погибших.
  rationale: Глаголы допускают размышление о смертности, остатке или сохранении для будущего; перевод не сводит неоднозначность к численной сотериологии.
- issue: Характер восхождения Варуха
  choice: Передано как нетелесное вознесение в рамках видения.
  alternative: Телесное восхищение либо исключительно внутренний сон.
  rationale: Текст прямо говорит «не телом», но не определяет точный механизм переживания.
- issue: Сохранение дел и трудов
  choice: Оставлено неопределённое «сохраняются».
  alternative: Явно перевести как запись для последнего суда или как немедленное воздаяние.
  rationale: Сирийский глагол выражает сохранение или удержание, не уточняя здесь времени и способа воздаяния.
- issue: Свидетельство ради праведности и награда
  choice: Формулировка сохранена как вопрос о награде, сберегаемой для свидетелей праведности.
  alternative: Уточнить мученичество, исполнение Закона или определённую посмертную награду.
  rationale: Контекст связывает свидетельство с правым порядком, но не даёт достаточных оснований для более узкого доктринального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим регистром. Синтаксис упрощён там, где буквальное следование сирийскому затемняло бы смысл, но ключевые образы — человеческий род, колесница из облака, тайна и сохраняемые дела — оставлены открытыми и не снабжены конфессиональными уточнениями.
