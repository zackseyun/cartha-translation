  yaml_path: translation/extra_canonical/2_baruch/008/002.yaml
  text: '"Pull down its walls and overturn them to their foundations, lest the enemies boast and say, ''We ourselves have pulled down the wall of Zion, and we have burned the dwelling place of the mighty God.''"'
translation:
  language: ru
  text: '«Обрушьте его стены и ниспровергните их до основания, чтобы враги не стали хвалиться и не сказали: „Это мы сами разрушили стену Сиона и сожгли обитель могущественного Бога“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܪ̈ܝܗ
  choice: его стены
  rationale: Форма в данном месте передана как множественное число с притяжательным суффиксом; это также согласуется с последующим множественным местоимением.
- source_word: ܥܘܪ̈ܩܘ
  choice: ниспровергните их до основания
  rationale: Передаёт приказ полностью разрушить стены вплоть до оснований, сохраняя образ исходного текста и естественность по-русски.
- source_word: ܕܘܟܬܐ
  choice: обитель
  rationale: В контексте храма означает место пребывания Бога; «обитель» звучит естественно и достойно, не уточняя сверх текста, что речь именно о здании храма.
- source_word: ܐܠܗܐ ܚܝܒܬܐ
  choice: могущественного Бога
  rationale: Следует смыслу засвидетельствованного эпитета и не превращает его без необходимости в закреплённый конфессиональный титул «Всемогущий».
theological_decisions:
- issue: Характер божественного эпитета
  choice: могущественного Бога
  alternative: Бога Всемогущего
  rationale: Выбрано описательное выражение, которое сохраняет смысл могущества, не усиливая текст до специального богословского титула.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Перевод ограничен текстом 8:2 и не включает соседние стихи из перекрывающегося страничного фрагмента.
