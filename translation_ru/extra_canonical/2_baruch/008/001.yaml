review_pass:
  verdict: revise
  source_fidelity: 'В целом перечень святынь, тройное обращение к земле, повеление хранить предметы и мотив будущего восстановления переданы верно. Однако «вынес» излишне конкретизирует простое «взял», «предан врагам» добавляет отсутствующее в стихе действующее лицо, а «завладев им» расширяет смысл простого запрета чужеземцам хвалиться предметами. Следует также явно сохранить будущее значение восстановления: «будет восстановлен навеки».'
  naturalness: 'Фраза «чтобы по велению возвратить это» синтаксически неясна: адресат повеления — земля, а предметы — множественное число. Перестройка на «чтобы, когда тебе будет велено, ты возвратила их» естественна, ясна и сохраняет структуру оригинала. «Очистительная крышка» звучит в современном литературном русском естественнее, чем несколько искусственное «крышка очищения».'
  terminology: «Святое святых», «завесы», «эфод», «скрижали», «священные облачения», «кадильница», «скиния» уместны. Неопределённость в определении ܚܘܣܝܐ, двух скрижалей/досок и ܦܝܪܡܐ надлежащим образом отмечена сносками. Формулировка сноски к [a] уточнена, чтобы не утверждать идентификацию ковчега как безусловную.
  issues:
  - severity: medium
    issue: Добавлено «врагов» в выражении о предании Иерусалима.
    rationale: Сирийский текст и английский контрольный перевод говорят, что Иерусалим будет «предан/отдан» на время, но в данном стихе не называют тех, кому он предан. Добавление сужает и интерпретирует смысл.
  - severity: medium
    issue: Добавлено значение овладения предметами в «чтобы чужеземцы не хвалились, завладев им».
    rationale: Исходная формула запрещает чужеземцам хвалиться «ими»; она не утверждает, что они завладели святынями.
  - severity: medium
    issue: Не вполне передано будущее восстановление города.
    rationale: '«Пока не будет сказано, что он вновь восстановлен навеки» может читаться как констатация уже совершившегося восстановления. Контекст и контрольный перевод требуют будущего: «будет восстановлен».'
  - severity: low
    issue: «Вынес оттуда» сильнее, чем исходное «взял оттуда».
    rationale: Глагол «вынес» вводит движение наружу, которое непосредственно не выражено.
  - severity: low
    issue: Конструкция о возвращении предметов неясна.
    rationale: Нужно обозначить землю как адресата будущего повеления и согласовать возврат с множественным числом предметов.
