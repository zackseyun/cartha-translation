base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/008/001.yaml
  text: And I saw that he went into the Holy of Holies, and took from there the veils, the ephod, the altar, the mercy seat, the two tables, the holy garments of the priests, the censer, the forty-eight precious stones, and all the holy vessels of the tabernacle. And he said to the earth with a loud voice, "Earth, earth, earth, hear the word of the mighty God, and receive what I commit to you, and guard them until the last times, so that, when you are commanded, you may restore them, so that strangers may not boast over them. For the time has drawn near when Jerusalem also will be delivered up for a time, until it is said that it will be restored again forever."
translation:
  language: ru
  text: '1 И я увидел, как он вошёл в Святое святых и взял оттуда завесы, эфод, жертвенник, очистительную крышку,[a] две скрижали,[b] священные облачения священников, кадильницу,[c] сорок восемь драгоценных камней и все священные сосуды скинии. И он громко сказал земле: «Земля, земля, земля! Услышь слово могущественного Бога. Прими то, что я вверяю тебе, и храни всё это до последних времён, чтобы, когда тебе будет велено, ты возвратила их и чтобы чужеземцы не хвалились ими. Ибо приблизилось время, когда и Иерусалим будет на время предан, пока не будет сказано, что он снова будет восстановлен навеки».


    [a] Или: «престол милости». Вероятно, речь идёт о священной крышке ковчега, однако наименование предмета в данном месте не вполне бесспорно.


    [b] Буквально: «две доски»; вероятно, имеются в виду скрижали завета.


    [c] Наименование этого культового предмета в сирийском тексте допускает разное понимание; возможны также значения «нагрудник» или «украшение».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «престол милости». Вероятно, речь идёт о священной крышке ковчега, однако наименование предмета в данном месте не вполне бесспорно.'
    reason: Передаёт вероятный культовый референт, не выдавая его за несомненный.
  - marker: b
    text: 'Буквально: «две доски»; вероятно, имеются в виду скрижали завета.'
