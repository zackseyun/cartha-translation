  - marker: c
    text: Наименование этого культового предмета в сирийском тексте допускает разное понимание; возможны также значения «нагрудник» или «украшение».
    reason: Отмечает неуверенность в идентификации предмета.
lexical_decisions:
- source_word: ܒܝܬ ܩܘܕܫܐ ܩܘܕܫܐ
  choice: Святое святых
  rationale: Устойчивое русское соответствие семитскому превосходному выражению, обозначающему внутреннее святилище.
- source_word: ܦܪ̈ܘܟܬܐ
  choice: завесы
  rationale: Сохраняет культовый смысл храмовых тканых преград и естественно звучит в русском библейском регистре.
- source_word: ܚܘܣܝܐ
  choice: крышка очищения
  rationale: Передаёт функцию священной крышки ковчега, не сводя значение исключительно к одной традиционной богословской формуле; вариант «престол милости» указан в сноске.
- source_word: ܘܬܪ̈ܬܝܢ ܟܘܪ̈ܣܘ
  choice: две скрижали
  rationale: Хотя форма буквально допускает «две доски» и чтение нестабильно, перечень храмовых святынь с высокой вероятностью указывает на скрижали завета.
- source_word: ܦܝܪܡܐ
  choice: кадильница
  rationale: Это вероятное обозначение культового предмета; из-за лексической и текстовой неуверенности иные возможности отмечены в сноске.
- source_word: ܐܪܥܐ ܐܪܥܐ ܐܪܥܐ
  choice: Земля, земля, земля!
  rationale: Сохранены тройное обращение и его торжественная риторическая сила; «земля» соответствует её роли как хранительницы святынь.
theological_decisions:
- issue: Сокрытие храмовых святынь в земле
  choice: Земле повелевается принять, хранить и впоследствии возвратить священные предметы.
  alternative: Представить происходящее как обычное погребение или случайную утрату святынь.
  rationale: Текст описывает намеренное сохранение по Божьему распоряжению до назначенного времени.
- issue: Временная преданность Иерусалима и окончательное восстановление
  choice: Сохранены и временный характер предания города, и обещание его вечного восстановления.
  alternative: Сделать восстановление немедленным либо истолковать «навеки» как указание на конкретную историческую эпоху.
  rationale: Сирийская формулировка удерживает напряжение между близким судом и будущим окончательным восстановлением, не уточняя его способа или срока.
- issue: Хвастовство чужеземцев святынями
  choice: Чужеземцы не должны хвалиться тем, что завладели святынями.
  alternative: Понимать место лишь как запрет хвалиться разрушением города.
  rationale: В пределах данного стиха ближайший референт — предметы святилища, переданные земле на хранение; тема разрушения стен развивается далее.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис упрощён лишь там, где это необходимо для ясности; тройное обращение, перечень святынь, временность суда и открытая формула будущего восстановления сохранены.
