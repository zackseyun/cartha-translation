  yaml_path: translation/extra_canonical/2_baruch/037/001.yaml
  text: And after these things I saw that the cedar was burning, and the forest that was around it, and the vine was growing, and the plain around it was full of unfading flowers. And I awoke and arose.
translation:
  language: ru
  text: После этого я увидел, что горят кедр и окружавший его лес, а виноградная лоза растёт и равнина вокруг неё полна неувядающих цветов. И я пробудился и встал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܙܐ
  choice: кедр
  rationale: Сохраняется конкретный и символически значимый образ дерева без пояснительного расширения.
- source_word: ܥܒܐ
  choice: лес
  rationale: Передаёт окружающую кедр лесную чащу и сохраняет связь с образом видения.
- source_word: ܓܘܦܬܐ
  choice: виноградная лоза
  rationale: Более ясно и естественно по-русски, чем одно слово «лоза», при этом образ не истолковывается преждевременно.
- source_word: ܗܒ̈ܒܐ ܕܠܐ ܚܡܝܢ
  choice: неувядающие цветы
  rationale: Сохраняет чудесное свойство цветов и естественно звучит в современном литературном русском.
- source_word: ܐܬܬܥܝܪܬ ܘܩܡܬ
  choice: я пробудился и встал
  rationale: Последовательность двух действий передана прямо, без их объединения или перестановки.
theological_decisions:
- issue: Следует ли прямо назвать виноградную лозу Мессией
  choice: В основном тексте сохранён образ «виноградной лозы».
  alternative: Заменить образ истолкованием «Мессия» или выделить его прописной буквой.
  rationale: Истолкование видения даётся позднее; здесь важно сохранить повествовательную последовательность и не вносить объяснение в само видение.
- issue: Связь огня с кедром и окружающим лесом
  choice: Огонь отнесён и к кедру, и к окружавшему его лесу.
  alternative: Отнести сказуемое «горит» только к кедру, оставив состояние леса неуточнённым.
  rationale: Синтаксис и контекст видения поддерживают совместное горение кедра и леса; русская формулировка делает эту связь ясной, не добавляя нового образа.
translation_notes:
  register: Современный литературный русский язык; краткий, торжественный и образный рассказ о видении. Настоящее время «горит», «растёт», «полна» сохраняет непосредственность увиденного, тогда как рамочные действия переданы прошедшим временем.
