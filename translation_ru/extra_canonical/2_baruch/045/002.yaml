translation:
  language: ru
  text: Ибо то, что существует ныне, — ничто; а то, что грядёт, будет чрезвычайно велико.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܕܡ ܕܗܘܐ ܗܫܐ
  choice: то, что существует ныне
  rationale: Передаёт временное противопоставление настоящего будущему; ܗܘܐ в данном контексте имеет широкий смысл «быть, существовать».
- source_word: ܠܐ ܗܘܐ ܡܕܡ
  choice: ничто
  rationale: Естественно и кратко передаёт буквальное «не есть что-либо», сохраняя резкое обесценивание нынешнего.
- source_word: ܡܕܡ ܕܥܬܝܕ ܕܢܗܘܐ
  choice: то, чему предстоит быть
  rationale: Сохраняет будущую направленность конструкции ܥܬܝܕ ܕܢܗܘܐ, не уточняя природу грядущего.
- source_word: ܪܒ ܣܓܝ
  choice: чрезвычайно велико
  rationale: Передаёт усиленное сочетание «весьма велико» современным литературным русским языком.
theological_decisions:
- issue: Соотношение нынешнего и грядущего
  choice: 'Сохранено абсолютное по форме противопоставление: нынешнее — «ничто», грядущее — «чрезвычайно велико».'
  alternative: Смягчить до «нынешнее незначительно» или истолковать грядущее как конкретное эсхатологическое царство.
  rationale: Сирийский текст выражается резко и не называет прямо предмет грядущего; перевод не должен ни ослаблять напряжение, ни вводить отсутствующее уточнение.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной синтаксической формой. Местоименные конструкции оставлены нейтральными, чтобы не конкретизировать неоднозначное «то, что есть/будет».
