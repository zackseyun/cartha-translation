  naturalness: Фраза литературна и понятна, однако «взыскание за то, через что…» в современном русском естественно прочитывается как наказание за некое действие, чего исходный текст не утверждает. «Посещения того, через что…» сохраняет трудную конструкцию и звучит умеренно возвышенно.
