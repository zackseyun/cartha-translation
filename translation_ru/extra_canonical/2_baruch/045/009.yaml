translation:
  language: ru
  text: Они хотят исследовать сокрытое страдание грядущего народа; но посещения[a] того, через что многие были оправданы, они не увидят.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «исследования»; сирийское слово может также означать «взыскание».'
    reason: Лексическая многозначность ܡܒܩܪܐ в трудном контексте; основной текст не навязывает карательного значения.
lexical_decisions:
- source_word: ܥܘܩܢ
  choice: страдание
  rationale: Слово обозначает бедствие, тяготу или мучение; «страдание» естественно передаёт смысл в данном контексте.
- source_word: ܡܬܚܣܟ
  choice: сокрытое
  rationale: Передаёт значение скрытости или недоступности; синтаксис сирийского текста повреждён или не вполне ясен, поэтому сохранена смысловая неоднозначность.
- source_word: ܥܡܐ ܕܐܬܐ
  choice: грядущего народа
  rationale: Формально передаёт «народ, который приходит/придёт», не уточняя его тождество.
- source_word: ܡܒܩܪܐ
  choice: взыскания
  rationale: Слово может означать посещение, проверку, исследование или взыскание; здесь «взыскание» лучше выражает судебно-проверочный оттенок, не делая его однозначным.
- source_word: ܐܙܕܕܩܘ
  choice: были оправданы
  rationale: Форма передаёт оправдание или признание правыми; выбран традиционно понятный русский эквивалент без уточнения механизма оправдания.
theological_decisions:
- issue: Характер «взыскания» и смысл оправдания многих
  choice: 'Сохранить неопределённость: «взыскания за то, через что многие были оправданы»'
  alternative: «посещения того, чем многие были признаны праведными»
  rationale: Сирийская лексика и трудный синтаксис допускают несколько оттенков. Перевод не определяет, является ли это взыскание судом, проверкой или особым божественным посещением, и не вводит конфессионального толкования оправдания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Неясность сирийского синтаксиса сохранена, но фраза сделана читаемой; заключительное «не увидят» переведено полностью.
