  source_fidelity: Сирийское ܥܬܝܕܝܢ передано как «предназначенные», без неоправданного уточнения референта. ܡܬܚܣܟ имеет настоящее значение «не удерживается / не отказывается», поэтому будущее «не будет ... удержано» в черновике следует исправить. Заключительный оборот ܠܐ ܡܘܒܠܐ ܠܐܒܕܢܐ допускает более безличное прочтение; основной текст естественно передаёт его пассивной формой, а примечание сохраняет альтернативу.
  naturalness: Фраза в целом литературна и понятна. Настоящее время в «не удерживается от них» ближе к исходнику, чем будущее в черновике. Формулировка примечания «нет приведения к погибели» по-русски тяжеловесна; её заменяет естественный безлично-неопределённый вариант.
  terminology: «Погибель» уместно передаёт ܐܒܕܢܐ и соответствует возвышенному, но современному регистру. Местоименные референты («него», «оно», «нём») намеренно не конкретизируются, поскольку в самом стихе они не названы.
  issues:
  - severity: medium
    issue: 'В первой части употреблено будущее время: «оно не будет от них удержано».'
    rationale: Сирийское ܠܐ ܡܬܚܣܟ — настоящее/обобщённое «не удерживается», как и в английском контрольном переводе («it is not withheld»). Будущее вносит не выраженную исходником временную спецификацию.
  - severity: low
    issue: 'Примечание сформулировано неестественно: «нет приведения к погибели».'
    rationale: Смысл альтернативного безличного синтаксиса можно сохранить более естественной русской конструкцией «живущих в нём не ведут к погибели».
