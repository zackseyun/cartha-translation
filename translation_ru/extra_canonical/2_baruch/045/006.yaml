  text: And if there are any who are appointed for it, it is not withheld from them; and for those who live in it, they will not be led to destruction.
translation:
  language: ru
  text: И если есть предназначенные для него, оно не удерживается от них; а живущие в нём не будут приведены к погибели.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «живущих в нём не ведут к погибели».'
    reason: Сирийская конструкция допускает более безличное прочтение, чем выбранная в основном тексте личная пассивная форма.
lexical_decisions:
- source_word: ܥܬܝܕܝܢ
  choice: предназначенные
  rationale: Причастие передаёт назначенность или уготованность для того, о чём говорится в контексте, не уточняя её характера.
- source_word: ܡܬܚܣܟ
  choice: будет… удержано
  rationale: Сохраняет значение недопущения или удерживания чего-либо от предназначенных для него людей и воспроизводит безлично-пассивную форму источника.
- source_word: ܡܘܒܠܐ ܠܐܒܕܢܐ
  choice: будут приведены к погибели
  rationale: Естественная русская пассивная конструкция, передающая образ ведения или приведения к уничтожению/погибели.
theological_decisions:
- issue: Неясный референт местоимений «для него», «оно» и «в нём»
  choice: Сохранить местоименную отсылку без поясняющей подстановки существительного
  alternative: Назвать референт, например «грядущий век» или «будущее благо»
  rationale: В выделенном стихе референт определяется только более широким контекстом и остаётся грамматически неявным; его конкретизация могла бы навязать толкование.
- issue: Синтаксис последней части стиха
  choice: «живущие в нём не будут приведены к погибели»
  alternative: «для живущих в нём нет приведения к погибели»
  rationale: Основной текст делает фразу понятной по-русски, не меняя её пассивного смысла; примечание сохраняет более буквальную синтаксическую возможность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Местоименная неоднозначность источника сохранена; искусственно архаические слова не использованы.
