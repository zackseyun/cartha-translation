base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/045/004.yaml
  text: For what has passed away into corruption, and what is corrupted falls and is forgotten. But what is to come is what is sought; what has passed from the hand is no longer reckoned.
translation:
  language: ru
  text: Ибо то, что было, миновало[a] и подвержено разрушению; а то, что разрушается, выпадает из памяти и забывается. Ибо ищут того, что ещё будет, а то, что ушло из рук, уже не принимают в расчёт.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «перешло».'
    reason: Сирийское ܚܠܦ может обозначать как то, что миновало или прошло, так и то, что перешло.
lexical_decisions:
- source_word: ܚܠܦ
  choice: миновало
  rationale: Передаёт основной контекстуальный смысл ухода и прекращения, не сводя выражение только к пространственному переходу.
- source_word: ܡܬܚܒܠ
  choice: предано тлению / тлеет
  rationale: Корень обозначает порчу и разрушение; «тление» сохраняет образ распада и соответствует возвышенному, но понятному регистру.
- source_word: ܒܥܘܗܕܢܐ ܢܦܠܐ ܘܡܬܛܥܐ
  choice: выпадает из памяти и забывается
  rationale: Естественно передаёт буквальный образ падения в отношении памяти и последующее забвение.
- source_word: ܡܬܒܥܐ
  choice: ищут
  rationale: Сохраняет значение поиска или стремления к тому, что ещё будет, без уточнения неназванного действующего лица.
- source_word: ܥܒܪ ܡܢ ܐܝܕܐ
  choice: ушло из рук
  rationale: Сохраняет исходную метафору утраты того, что прежде было в руках или во власти человека.
- source_word: ܡܬܚܫܒ
  choice: принимают в расчёт
  rationale: Передаёт смысл счёта, учёта или признания значимым и сохраняет безличность высказывания.
theological_decisions:
- issue: Соотношение преходящего настоящего и грядущего
  choice: Сохранено противопоставление тления и забвения тому, что ещё будет и потому становится предметом поиска.
  alternative: Истолковать грядущее как явно вечную жизнь или эсхатологическое спасение.
  rationale: Сам стих не называет предмет грядущего прямо; конкретизация устранила бы присущую тексту широту и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Параллелизм и повтор исходного текста сохранены, синтаксис сделан понятным для обычного читателя.
