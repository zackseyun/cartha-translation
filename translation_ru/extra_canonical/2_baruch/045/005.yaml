base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/045/005.yaml
  text: For when the time that does not pass away comes and its season arrives, it sets its deeds in order and examines its sins. Those who belong to it do not add anguish to destruction.
translation:
  language: ru
  text: Ибо, когда наступит время, которое не проходит, и придёт его срок, оно приведёт в порядок свои дела и исследует свои грехи. Те, кто принадлежит ему, не прибавят муки к погибели.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒܢܐ ܕܠܐ ܥܒܕ
  choice: время, которое не проходит
  rationale: Передаёт противопоставление непреходящего грядущего времени нынешнему преходящему в ближайшем контексте, не заменяя образ отвлечённым термином «вечность».
- source_word: ܡܫܘܐ ܥܒܕܘܗܝ
  choice: приведёт в порядок свои дела
  rationale: Сохраняет предметное значение «упорядочить/устроить свои дела» и необычное олицетворение времени.
- source_word: ܡܒܩܪ ܚܛܗܝܗ̇
  choice: исследует свои грехи
  rationale: Глагол может обозначать исследование, проверку или взыскание; «исследует» сохраняет судебно-проверочный оттенок, не усиливая его до наказания без необходимости.
- source_word: ܠܐܚܝܕܝܢ ܕܡܢܘܗܝ ܐܢܘܢ
  choice: те, кто принадлежит ему
  rationale: Следует смыслу принадлежности к грядущему времени; местоименная соотнесённость намеренно сохранена.
- source_word: ܠܐ ܡܘܣܦܝܢ ܥܘܩܢ ܥܚܒܠܐ
  choice: не прибавят муки к погибели
  rationale: Сохраняет краткую и напряжённую формулировку источника, где соотношение «муки» и «погибели» не разъясняется.
theological_decisions:
- issue: Олицетворение непреходящего времени как действующего лица
  choice: 'Сохранено: время упорядочивает дела и исследует грехи'
  alternative: Передать субъектом Бога или последний суд
  rationale: В сирийском тексте грамматическим субъектом остаётся время/его срок; богословское отождествление с Богом или судом было бы толкованием.
- issue: Смысл последней фразы о муке и погибели
  choice: 'Сохранена буквальная связь: «не прибавят муки к погибели»'
  alternative: «Не подвергнутся муке погибели» или «не умножат гибельные страдания»
  rationale: Источник допускает трудное синтаксическое прочтение; перевод не устраняет эту напряжённость посредством догматически более определённой формулировки.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Сохранены необычное олицетворение времени и местоименная неоднозначность оригинала; архаизмы и конфессионально маркированная терминология не вводились.
