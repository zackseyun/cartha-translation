  text: Therefore, let those who desire to see it beware of the time spoken of, and let them pass beyond the burden of the troubled time.
translation:
  language: ru
  text: И пусть те, кто желает явиться[a], остерегаются времени, о котором сказано, и преодолеют бремя[b] тревожного времени.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сирийская форма может также означать: «быть увиденными». Английский переводческий след понимает её в контексте как «увидеть это».'
    reason: Сохранить грамматическую и контекстуальную неоднозначность ܕܢܬܚܙܝܢ, не добавляя в основной русский текст невыраженный объект.
  - marker: b
    text: 'Или: «долг», «обязанность», «вину».'
    reason: Отразить широкий смысловой диапазон сирийского ܚܘܒܐ.
lexical_decisions:
- source_word: ܕܢܬܚܙܝܢ
  choice: увидеть его
  rationale: По контексту речь идёт о желании увидеть грядущее великое событие; местоимение «его» восстанавливает подразумеваемый объект по-русски. Сирийская форма, однако, буквально допускает значение «быть увиденными / явиться», поэтому неоднозначность отмечена в сноске.
- source_word: ܕܢܬܙܗܪܘܢ
  choice: пусть остерегаются
  rationale: Передаёт значение бдительности и осторожности перед лицом названного времени, сохраняя увещевательную силу формы.
- source_word: ܙܒܢܐ ܕܐܡܝܪ
  choice: предсказанного времени
  rationale: Буквально «времени, о котором сказано»; «предсказанного» естественно передаёт эсхатологический контекст, не уточняя содержание предсказания.
- source_word: ܚܘܒܐ
  choice: бремя
  rationale: Слово может обозначать долг, вину, обязательство или обременение; в связи с тяжёлым временем контекстуально уместно «бремя», при сохранении альтернатив в сноске.
- source_word: ܙܒܢܐ ܕܡܥܝܪ
  choice: времени, несущего смятение
  rationale: Причастная конструкция связана с пробуждением или возбуждением; в контексте бедственного времени выражение передано как время, вызывающее смятение, без сведения смысла просто к «скорби».
theological_decisions:
- issue: Объект желанного видения
  choice: «увидеть его», с отсылкой к грядущему событию из контекста
  alternative: «быть увиденными» или «явиться»
  rationale: Контекст поддерживает стремление дожить до явления грядущего, но сирийская грамматическая форма создаёт реальную неоднозначность, которая не должна устраняться без примечания.
- issue: Характер испытания грядущего времени
  choice: «бремя времени, несущего смятение»
  alternative: «вина», «долг» или «обязанность тревожного времени»
  rationale: Перевод не превращает фразу в специальное учение о вине или наказании, а сохраняет общий образ тяжести переходного времени.
translation_notes:
  register: Современный литературный русский язык; тон возвышенный, но ясный. Синтаксис сохраняет параллелизм двух увещаний. «Предсказанное время» и «несущее смятение» выбраны как естественные русские соответствия без конфессиональной конкретизации.
