  text: For everything corruptible passes away and comes to nothing, and the time that has been is now forgotten; nor after this is it sought in remembrance.
translation:
  language: ru
  text: Ибо всё, что подвержено тлению, проходит и обращается в ничто, и время, которое было, теперь забыто; о нём уже не вспоминают.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܚܒܠ
  choice: разрушается
  rationale: Передаёт сирийское причастие со значением порчи, разрушения или тления, не сужая его до одной лишь физической порчи.
- source_word: ܐܙܠ
  choice: уходит
  rationale: Сохраняет простой пространственно-временной образ исходного глагола.
- source_word: ܠܐ ܡܢ ܕܡܢܐ
  choice: обращается в ничто
  rationale: Естественно по-русски выражает исчезновение и утрату бытия, соответствующие контексту фразы.
- source_word: ܡܬܛܥܐ
  choice: забывается
  rationale: Точно передаёт пассивно-возвратный смысл утраты из памяти.
- source_word: ܡܬܒܥܐ ܒܥܘܗܕܢܐ
  choice: ищут в памяти
  rationale: Сохраняет необычный образ исходного текста — разыскивать нечто в воспоминании, — не заменяя его толкованием.
theological_decisions:
- issue: Отношение преходящего настоящего к грядущему
  choice: Сохранено общее утверждение о том, что разрушающееся исчезает и забывается.
  alternative: Уточнить, что речь идёт исключительно о нынешнем мире или веке.
  rationale: В самом стихе объект сформулирован широко; конфессиональное или эсхатологическое уточнение неоправданно сужало бы исходную неоднозначность.
