revisions:
- from: Ведь всё, что разрушается, уходит и обращается в ничто; отныне минувшее время забывается, и впоследствии его уже не ищут в памяти.
  to: Ибо всё, что подвержено тлению, проходит и обращается в ничто, и время, которое было, теперь забыто; о нём уже не вспоминают.
  rationale: Исправлены временные наречия и сглажен русский синтаксис. Сохранены общий охват «всего тленного», образ исчезновения и утверждение, что бывшее время утрачено для памяти. Смысл не дополнен эсхатологическими или конфессиональными интерпретациями.
