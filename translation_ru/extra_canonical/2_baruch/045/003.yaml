review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: всё тленное/подверженное разрушению исчезает, а прошедшее время забывается и более не вызывается в памяти. Однако «отныне» не соответствует сирийскому наречию со значением «впредь, затем, после этого» в связи с уже минувшим временем; оно создаёт ненужную точку отсчёта в настоящем. «Впоследствии» также менее точно, поскольку исходник выражает не будущее событие, а последующее отсутствие обращения к прошлому.'
  naturalness: 'Текст в целом литературен, но сочетание «отныне минувшее время забывается» стилистически и логически шероховато: минувшее время уже прошло, и естественнее сказать, что оно «впредь забыто» или «забывается». Формула «его уже не ищут в памяти» допустима, но «не вспоминают о нём» естественнее и сохраняет образ обращения к памяти.'
  terminology: «Разрушается» возможно для ܡܬܚܒܠ, но в данном обобщающем афоризме «подвержено тлению» лучше охватывает порчу, гибель и преходящесть без чрезмерного акцента на физическом разрушении. Богословски нагруженных терминов и имён нет.
  issues:
  - severity: medium
    issue: «Отныне»
    rationale: В контексте сирийского текста речь о времени, которое было и теперь забыто; «отныне» означает «с этого момента» и вносит иной временной ракурс.
  - severity: low
    issue: «Впоследствии»
    rationale: Оригинал говорит, что после этого прошедшее не разыскивается в памяти; по-русски лучше передать это как «и больше не вспоминают о нём», без оттенка отдалённого будущего.
  revised_text: Ибо всё, что подвержено тлению, проходит и обращается в ничто, и время, которое было, теперь забыто; о нём уже не вспоминают.
