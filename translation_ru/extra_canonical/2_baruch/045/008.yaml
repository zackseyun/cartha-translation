    rationale: Такой оборот не является понятной современной русской передачей страдательного чтения. Необходимо дать ясный вариант, например «были найдены среди суеты», и отметить залоговую неопределённость.
  - severity: low
    issue: Синтаксическое согласование основного текста стилистически шероховато.
    rationale: После «Но те, кто» последовательность форм единственного числа («принял», «утратил», «устремился») возможна при формальном согласовании с «кто», но в длинном перечислении современнее и яснее употребить «которые» и множественное число.
  revised_text: Но те, которые обратились ко тьме и приняли ложь, утратили сокровище надежды и искали суетного[a], не проявляли милости[b] и не держались пути наставления, —
