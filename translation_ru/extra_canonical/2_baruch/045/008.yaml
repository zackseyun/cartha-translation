  text: But those who turned themselves toward darkness and received lies, and lost the settledness of hope, and sought out vanities, and did not show mercy, nor keep the path of discipline—
translation:
  language: ru
  text: Но те, которые обратились ко тьме и приняли ложь, утратили сокровище надежды и искали суетного[a], не проявляли милости[b] и не держались пути наставления, —
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «были найдены среди суеты»; форма глагола допускает среднее или страдательное понимание.'
    reason: Сохраняет залоговую неоднозначность сирийской формы ясным современным русским языком.
  - marker: b
    text: 'Буквально также возможно: «не щадили милости».'
    reason: Отмечает более буквальную, но неестественную для основного текста передачу выражения.
lexical_decisions:
- source_word: ܚܫܘܟܐ (предполагаемое чтение повреждённого/неясного ܥܘܩܢ в представленном распознавании)
  choice: тьма
  rationale: Контекст и контрольное чтение указывают на «тьму»; это сохраняет нравственно-образное противопоставление, не подменяя его словом «скорбь».
- source_word: ܕ̈ܓܠܐ
  choice: ложь
  rationale: Множественная форма допускает «обманы/лживые вещи», но собирательное «ложь» естественнее по-русски и сохраняет смысл.
- source_word: ܣܝܡܬܐ ܕܣܒܪܐ
  choice: сокровище надежды
  rationale: ܣܝܡܬܐ означает отложенное сокровище, запас или вклад; буквальный образ предпочтительнее более толковательного «твёрдая надежда».
- source_word: ܒܗܘܐܢܬ ܐܬܒܥܝܘ
  choice: устремился к суете
  rationale: Глагольная форма допускает среднее или страдательное понимание. В основном тексте передан естественный возвратный смысл, а формальная неоднозначность отмечена в сноске.
- source_word: ܡܘܣܪ
  choice: наставление
  rationale: Слово охватывает наставление, вразумление и дисциплину; «наставление» современно и не сужает смысл до наказания.
theological_decisions:
- issue: Образ «сокровища надежды»
  choice: Сохранить исходную метафору
  alternative: «твёрдая надежда» или «опора надежды»
  rationale: Метафора текста не требует догматического уточнения и потому не должна заменяться богословским толкованием.
- issue: Отрицание при «держаться пути наставления»
  choice: Передать «не держался» в соответствии со смысловым рядом и консультационным текстом
  alternative: Формально читать сохранившееся ܢܛܪܘ как «держались/соблюдали»
  rationale: Все однородные определения описывают порочных людей; положительное «держались» нарушило бы последовательность. Однако представленное распознавание не показывает отрицательной частицы, поэтому решение учитывает вероятную текстовую или OCR-утрату.
translation_notes:
  register: Современный литературный русский, с достоинством и ритмическим параллелизмом. Повтор «кто» делает длинный перечень ясным; конечное тире сохраняет незавершённость синтаксиса и связь со следующим стихом.
