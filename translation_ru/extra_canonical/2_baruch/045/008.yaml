  verdict: revise
  source_fidelity: 'Основной смысл передан верно: обращение ко тьме, принятие лжи, утрата «сокровища/запаса надежды», связь с суетой, отсутствие милости и несоблюдение пути наставления. «Тьма» соответствует контрольному чтению, а не «скорбь». Для глагола о суете сохраняется залоговая неоднозначность, но исходная сноска предлагает по-русски неудачное «был взыскан».'
  naturalness: Текст в целом литературен, однако множественные «кто» с формами единственного числа в длинном ряду менее естественны после «те». Более естественен параллельный ряд глаголов во множественном числе. «Искали суетного» точнее передаёт активное/среднее понимание, чем несколько интерпретирующее «устремился к суете».
  terminology: «Тьма», «ложь», «сокровище надежды», «милость» и «путь наставления» уместны. «Наставление» удачно сохраняет широту ܡܘܣܪ (вразумление, дисциплина), не превращая термин в узкоконфессиональный.
