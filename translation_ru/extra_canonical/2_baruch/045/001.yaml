  yaml_path: translation/extra_canonical/2_baruch/045/001.yaml
  text: …that belong to corruption and its ways, ways that cannot be searched out, whatever they may be. But if you endure and stand in his fear and do not go astray from his law, the times will be changed in their season for good, and you will see the consolation of Zion.
translation:
  language: ru
  text: …которые принадлежат тлению и его путям — путям, которые невозможно исследовать, каковы бы они ни были.[a] Но если вы будете терпеливы, будете твёрдо стоять в страхе перед Ним и не уклонитесь от Его Закона, времена переменятся к добру в предназначенное им время, и вы увидите утешение Сиона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сирийское выражение буквально можно передать: «и каковы они»; его связь с предшествующими словами несколько неясна.'
    reason: Сохраняется необычная и неоднозначная сирийская идиома ܘܐ̈ܢܝܢ ܐ̈ܢܝܢ, которую не следует молча сглаживать.
lexical_decisions:
- source_word: ܕܝܠܗ ܕܚܒܠܬܐ
  choice: принадлежат тлению
  rationale: Формулировка сохраняет принадлежность к сфере тления, не сужая значение до одного лишь физического разрушения.
- source_word: ܐܘܪ̈ܚܬܗ ܕܠܐ ܡܬܒ̈ܩܥܢ
  choice: его путям — путям неисследимым
  rationale: «Неисследимые» передаёт невозможность постичь или исследовать эти пути и сохраняет приподнятый апокалиптический регистр.
- source_word: ܬܣܝܒܪܘܢ
  choice: будете терпеливы
  rationale: Глагол выражает терпеливое перенесение и стойкость; русский оборот естественен и не добавляет идеи пассивного смирения.
- source_word: ܬܩܘܡܘܢ ܒܕܚܠܬܗ
  choice: устоите в страхе перед Ним
  rationale: Сохранены образ стояния и богобоязненность; прописное местоимение ясно указывает на Бога в русском религиозном контексте.
- source_word: ܡܬܚܠܦܝܢ ܒܥܕܢܗܘܢ ܙܒ̈ܢܐ ܠܛܒܬܐ
  choice: времена в свой срок переменятся к добру
  rationale: Переданы и смена времён, и назначенный им срок, и направление перемены к добру без абстрактного пересказа как перемены судьбы.
- source_word: ܒܘܝܐܐ ܕܨܝܘܢ
  choice: утешение Сиона
  rationale: «Утешение» сохраняет эсхатологический и общинный смысл восстановления Сиона, не сводя его к субъективному душевному облегчению.
theological_decisions:
- issue: Условная связь стойкости с грядущей переменой времён
  choice: если вы будете терпеливы, устоите… и не уклонитесь… времена… переменятся
  alternative: поскольку вы выстоите, времена переменятся
  rationale: Сирийская условная конструкция сохранена без превращения её ни в гарантированное предсказание поведения слушателей, ни в разработанную схему заслуги.
- issue: Эсхатологическая надежда, сосредоточенная на Сионе
  choice: увидите утешение Сиона
  alternative: увидите спасение / восстановление
  rationale: Сохранён прямой образ утешения Сиона, не обобщённый до отвлечённого спасения и не конкретизированный сверх исходного текста.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптической речи. Начальное многоточие сохранено, поскольку стих начинается продолжением предыдущего предложения. Повтор «времена… в свой срок» намеренно удерживает временную образность сирийского текста.
