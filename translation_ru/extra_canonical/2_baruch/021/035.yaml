lexical_decisions:
- source_word: ܫܘܒܚܐ
  choice: слава
  rationale: Обычное и контекстуально уместное соответствие сирийскому слову со значениями «слава, величие, хвала».
- source_word: ܒܣܝܡܘܬܐ / ܛܝܒܘܬܐ
  choice: благость
  rationale: Передаёт нравственную доброту и щедрое благорасположение Бога; возвышенное, но понятное слово, соответствующее молитвенному регистру.
- source_word: ܪܒܘܬܐ
  choice: величие
  rationale: Сохраняет прямое значение величины или превосходства качества, не заменяя его более толковательным выражением.
theological_decisions:
- issue: Просьба о проявлении Божьей славы
  choice: «Да явится Твоя слава»
  alternative: «Пусть будет видна Твоя слава»
  rationale: Форма с «да» сохраняет молитвенно-пожелательное звучание и не уточняет, идёт ли речь о зрительном явлении или более широком откровении славы.
- issue: Характер Божьей доброты
  choice: «благость»
  alternative: «доброта»
  rationale: «Благость» естественна в возвышенной молитвенной речи и не вводит конфессионально специфического толкования.
