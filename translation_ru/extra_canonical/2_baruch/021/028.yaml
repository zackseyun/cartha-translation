  verdict: revise
  source_fidelity: 'Юссивная сила «пусть … остаётся» передана верно. Однако «до назначенного ему времени» меняет отношение времени: английская контрольная формула и сирийское выражение говорят о сохранённом «для/к своему времени», а не о сохранении вплоть до этого времени. Прилагательное «назначенного» также вносит невыраженную экспликацию.'
  naturalness: Фраза в целом литературна, но «сохранённое до назначенного ему времени» семантически двусмысленно и тяжеловесно. «Сохранённое к своему сроку» кратко и естественно в возвышенном молитвенном регистре.
  terminology: Специальных богословских терминов и имён нет. «Срок» удачно передаёт временной смысл без лишней интерпретации о том, кем он назначен.
  issues:
  - severity: medium
    issue: Предлог «до» и слово «назначенного» в основном тексте.
    rationale: Они представляют сохранение как действие, продолжающееся до заранее назначенного момента. В контрольном тексте сказано «preserved for its time»; такая конкретизация не нужна и сужает исходную формулировку.
  - severity: low
    issue: Сноски a и b излишне утверждают текстовую неоднозначность.
    rationale: Английский audit trail отмечает варианты как прежние рендеринги, но представленный сирийский контекст не даёт достаточного основания оформлять их как варианты чтения. Кроме того, сноска a противоречит выбранной юссивной передаче, называя изъявительное прочтение возможным без необходимости.
  revised_text: И пусть сохранённое к своему сроку остаётся.
