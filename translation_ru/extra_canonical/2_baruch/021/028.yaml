lexical_decisions:
- source_word: ܕܢܣܬܝܟ
  choice: пусть … остаётся
  rationale: Форма понята как юссив в контексте молитвенного прошения; «остаётся» естественно передаёт продолжение или сохранение состояния.
- source_word: ܒܙܒܢܗ
  choice: до назначенного ему времени
  rationale: Буквально выражение связано с «его временем»; добавление «назначенного» по-русски ясно передаёт идею определённого для него срока, не уточняя, кем именно он назначен.
- source_word: ܗܢܐ
  choice: сохранённое
  rationale: Указательный элемент передан субстантивированным причастием согласно ближайшему смыслу фразы и контрольному переводу.
theological_decisions:
- issue: Юссивное или изъявительное значение глагола
  choice: пусть … остаётся
  alternative: остаётся / продолжает существовать
  rationale: Контекст молитвы поддерживает значение просьбы, однако возможное изъявительное прочтение отмечено в сноске.
- issue: Число существительного «время»
  choice: 'единственное число: «времени»'
  alternative: 'множественное число: «времён»'
  rationale: Сингулярное чтение лучше соответствует обычному пониманию сирийской формы и представлению о назначенном сроке; вариант сохранён в сноске.
translation_notes:
  register: Современный литературный русский язык; краткая молитвенная формула сохранена. Союз «И» поддерживает связь с предыдущим прошением, а порядок слов сделан естественным для русского текста.
