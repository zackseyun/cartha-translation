revisions:
- from: И пусть сохранённое до назначенного ему времени остаётся.[a][b]
  to: И пусть сохранённое к своему сроку остаётся.
  rationale: Сохранены союзная связь, юссивное прошение и краткий высокий регистр. «К своему сроку» передаёт «for its time», не превращая его в указание на сохранение «до» срока и не добавляя идею внешнего назначения. Сноски удалены, поскольку в данном стихе они не требуются для понимания и не должны создавать неподтверждённую текстологическую неопределённость.
