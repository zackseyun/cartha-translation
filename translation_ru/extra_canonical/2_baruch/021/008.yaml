translation:
  language: ru
  text: И небесные воинства знают духом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посредством духа». Сирийский текст не уточняет, о каком именно духе идёт речь.'
    reason: Сохраняет инструментальное и референциальное различие выражения ܒܪܘܚܐ, не перегружая основной текст.
lexical_decisions:
- source_word: ܐܘܡܘܗܝ ܕܫܡܝܐ
  choice: небесные воинства
  rationale: Передаёт совокупность небесных сил; формулировка согласуется с ближайшим чтением сирийского текста и не уточняет их природу.
- source_word: ܝܕܥ
  choice: знают
  rationale: Сохраняет простое значение глагола познания, засвидетельствованное в консультационном английском слое.
- source_word: ܒܪܘܚܐ
  choice: духом
  rationale: Творительный падеж естественно передаёт сирийскую конструкцию с ܒ («посредством духа», «духом»), не разрешая её референциальную неоднозначность.
theological_decisions:
- issue: Следует ли понимать ܪܘܚܐ как собственное именование Святого Духа
  choice: «духом» со строчной буквы
  alternative: «Духом» или «Святым Духом»
  rationale: В источнике нет уточнения «Святой» и нет графического средства, требующего персонализирующего прочтения; строчная буква сохраняет неоднозначность и не вносит позднейшую тринитарную конкретизацию.
translation_notes:
  register: Краткая, возвышенная и понятная современному читателю формулировка. Слово «воинства» сохраняет библейский регистр, а «знают духом» — компактность и неоднозначность источника.
