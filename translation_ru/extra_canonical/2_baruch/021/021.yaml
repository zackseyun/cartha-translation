  text: For if this life alone were given to human beings, nothing would be more bitter than this.
translation:
  language: ru
  text: Ибо если бы людям была дана только эта жизнь, не было бы ничего горше неё.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܐ
  choice: жизнь
  rationale: Передаёт обычное значение сирийского существительного и соответствует контексту противопоставления нынешней жизни иной участи.
- source_word: ܒܢܝ̈ܢܫܐ
  choice: людям
  rationale: Естественная современная передача семитского выражения «сыны человеческие» без изменения его общего значения.
- source_word: ܡܪܝܪ
  choice: горше
  rationale: Сохраняет образ вкусовой горечи, употреблённый для обозначения тяжкой и мучительной участи.
theological_decisions:
- issue: Относится ли ограничение «только» к жизни или к факту её дарования
  choice: «только эта жизнь»
  alternative: «если бы одна лишь эта жизнь была дана людям»
  rationale: 'Ограничение естественнее всего относится к данной людям жизни: смысл условного высказывания в том, что существование было бы невыносимо горьким, если бы исчерпывалось нынешней жизнью. Формулировка не уточняет природу последующей жизни.'
- issue: Модальность условного высказывания
  choice: «если бы … была дана»
  alternative: «если … дана»
  rationale: Сослагательная конструкция сохраняет гипотетический характер рассуждения и не превращает его в прямое утверждение о нынешнем человеческом уделе.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная, без архаизма «сыны человеческие». Сравнительная конструкция «ничего горше неё» сохраняет выразительность исходного образа.
