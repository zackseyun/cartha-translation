lexical_decisions:
- source_word: ܙܒܢܐ
  choice: время
  rationale: Основное значение сирийского слова — «время, срок»; контекст указывает на определённое, назначенное время.
theological_decisions:
- issue: Неясный антецедент местоимения «с ними»
  choice: Сохранено местоимение без поясняющей подстановки.
  alternative: Назвать конкретную группу, к которой относится «с ними».
  rationale: Предоставленный стих не называет эту группу однозначно; её конкретизация устранила бы подлинную неопределённость текста.
translation_notes:
  register: Современный литературный русский язык; возвышенная, но понятная формулировка. Оборот «то самое время» естественно передаёт определённость выражения «the time», не уточняя природу этого времени.
