translation:
  language: ru
  text: По Твоему знаку Ты повелеваешь молнии[a], и Ты видел грядущее, как минувшее.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «молнии дано повеление по Твоему знаку».'
    reason: Сохраняет пассивно-олицетворённую конструкцию сирийского текста, тогда как основной перевод передаёт её естественным русским глаголом.
lexical_decisions:
- source_word: ܒܪܘܙܝܟ
  choice: по твоему знаку
  rationale: Передаёт смысл скрытого знака или повелительного сигнала естественным современным русским выражением; сохраняет связь с тем, что молния подчиняется Божьей воле.
- source_word: ܕܥܬܝ̈ܕܢ
  choice: грядущее
  rationale: Краткое и возвышенное обозначение того, чему предстоит произойти.
- source_word: ܕܥܒܪ̈ܝ
  choice: уже минувшее
  rationale: Корень ܥܒܪ означает «проходить, миновать» и образует временное противопоставление грядущему; наречие «уже» делает это противопоставление ясным по-русски.
theological_decisions:
- issue: Божественное знание будущего и прошлого
  choice: «грядущее Ты видишь так же, как уже минувшее»
  alternative: «Ты увидел будущее, как совершённое Тобою»
  rationale: Выбранное чтение следует временному противопоставлению ܕܥܬܝ̈ܕܢ и ܕܥܒܪ̈ܝ и не вводит дополнительного утверждения о причинении всех будущих событий.
translation_notes:
  register: Современный литературный русский с молитвенно-возвышенным, но понятным строем. Местоимение «Ты» написано с прописной буквы как обращение к Богу; синтаксис сделан кратким и ритмичным.
