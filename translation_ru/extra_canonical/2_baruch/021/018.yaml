translation:
  language: ru
  text: тех, кто живёт, и тех, кто словно ничто. Ведь жизнь без радости — не жизнь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܐ
  choice: жизнь / живёт
  rationale: Передаёт повторяющийся корень со значением жизни; в русском формы распределены по синтаксису.
- source_word: ܠܐ ܐܝܬ
  choice: словно ничто
  rationale: Отрицание существования передано естественно и без утверждения буквального небытия людей.
- source_word: ܡܒܣܡܐ
  choice: радость
  rationale: Корень допускает значения приятности, услады и радости; выражение «жизнь без радости» естественно передаёт смысл состояния жизни, не приносящей отрады.
theological_decisions:
- issue: Статус тех, кто «как ничто»
  choice: словно ничто
  alternative: не существует
  rationale: Сравнительная формулировка сохраняет смысл английского контрольного слоя и не превращает риторическое описание в онтологическое утверждение.
- issue: Определение подлинной жизни
  choice: «жизнь без радости — не жизнь»
  alternative: «жизнь, не исполненная радости, не является жизнью»
  rationale: Сохранён афористический парадокс текста без догматического истолкования причины или природы этой радости.
