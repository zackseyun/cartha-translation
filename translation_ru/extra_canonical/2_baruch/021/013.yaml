  text: For if the things that have been are not remembered, the things that stand before you are yours, and the things that are to come are remembered in their times.
translation:
  language: ru
  text: Ведь если то, что было, не вспоминается, то, что стоит перед Тобой, принадлежит Тебе, а то, чему предстоит быть, вспоминается в своё время.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно иное синтаксическое членение: «то, что стоит перед Тобой, — Твоё, вспоминаемое в своё время».'
    reason: Сирийский текст допускает неоднозначное синтаксическое присоединение заключительного выражения о времени.
lexical_decisions:
- source_word: ܗܠܝܢ ܕܗܘܘ
  choice: то, что было
  rationale: Передаёт отсылку к уже бывшему и сохраняет противопоставление прошлого, настоящего и будущего.
- source_word: ܗܠܝܢ ܕܩܝܡܝܢ ܩܕܡܝܟ
  choice: то, что стоит пред Тобой
  rationale: Сохраняет образ стоящего перед Богом и суффикс второго лица единственного числа; вариант «друг перед другом» не подтверждается данным чтением сирийского текста.
- source_word: ܕܝܠܟ
  choice: принадлежит Тебе
  rationale: Естественно выражает принадлежность при сохранении прямого обращения к Богу.
- source_word: ܐܝܠܝܢ ܕܥܬܝ̈ܕܢ
  choice: то, чему предстоит быть
  rationale: Передаёт будущую направленность без уточнения характера грядущих событий.
- source_word: ܒܙܒܢܘܬܐ
  choice: в своё время
  rationale: Идиоматично передаёт временную формулу и допускаемое контекстом распределительное значение.
theological_decisions:
- issue: Божественное знание о прошлом, настоящем и будущем
  choice: Сохранены три отдельные, сопоставленные части высказывания без пояснения того, в каком смысле Бог «вспоминает».
  alternative: Передать «помнит» или истолковать фразу как прямое утверждение всеведения.
  rationale: Глагол воспоминания создаёт напряжение в речи о Боге; перевод не должен устранять его богословским истолкованием.
- issue: Синтаксическое присоединение выражения о времени
  choice: В основном тексте оно отнесено к тому, чему предстоит быть.
  alternative: Отнести его к стоящему перед Богом и принадлежащему Ему.
  rationale: Трёхчастное чтение лучше сохраняет противопоставление бывшего, стоящего перед Богом и будущего, однако сирийская пунктуация допускает иное членение, отмеченное в сноске.
translation_notes:
  register: Современный литературный русский язык с молитвенно-возвышенным, но понятным строем. Местоимение «Тобой» написано с прописной буквы как прямое обращение к Богу; архаические формы избегаются.
