revisions:
- from: Ведь если не вспоминается то, что было, то, что стоит пред Тобой, принадлежит Тебе, а то, чему предстоит быть, вспоминается в своё время.[a]
  to: Ведь если то, что было, не вспоминается, то, что стоит перед Тобой, принадлежит Тебе, а то, чему предстоит быть, вспоминается в своё время.[a]
  rationale: Внесена только стилистическая правка порядка слов и заменено слегка архаизирующее «пред» на нейтральное «перед». Перевод по-прежнему сохраняет исходную пассивную формулировку, обращение к Богу во втором лице и отмеченную в английской аудиторской традиции синтаксическую неоднозначность.
