translation:
  language: ru
  text: Ибо что в них видимо? Или какая видимая надежда есть? Или какое видимое жилище — не тщета?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܚܙܐ
  choice: видимо / видимая / видимое
  rationale: Сохранён повтор понятия видимости во всех трёх вопросах, как в сирийской формулировке и в контрольном английском слое; формы согласованы с русским синтаксисом.
- source_word: «обиталище» (соответствующая сирийская лексема в предоставленном фрагменте надёжно не локализуется)
  choice: обиталище
  rationale: Достоинный и понятный современный эквивалент для места пребывания; не сужает значение до дома или здания.
- source_word: «тщета» (соответствующая сирийская лексема в предоставленном фрагменте надёжно не локализуется)
  choice: тщета
  rationale: Передаёт пустоту, преходящесть и бесплодность без добавления конфессионального толкования.
theological_decisions:
- issue: Риторический характер последнего вопроса
  choice: 'Сохранён вопрос: «какое видимое обиталище — не тщета?»'
  alternative: 'Утвердительное истолкование: «всякое видимое обиталище — тщета»'
  rationale: Вопросительная форма сохраняет напряжение исходной мысли и не превращает подразумеваемый вывод в прямое догматическое утверждение.
- issue: Неясный референт местоимения «в них»
  choice: Оставлено «в них» без поясняющего существительного
  alternative: Подставить предполагаемый референт из более широкого контекста
  rationale: Предоставленный исходный фрагмент не позволяет уверенно установить референт; его уточнение внесло бы в текст толкование.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но доступным библейским регистром. Трёхчастный риторический параллелизм и повтор «видим-» сохранены. Глагол «существует» во втором вопросе добавлен ради естественности русского синтаксиса, не меняя смысла.
