translation:
  language: ru
  text: Ибо в Его царстве видна смерть сынов человеческих. Что же поистине существует[a], чей конец неизвестен?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что вообще есть».'
    reason: Сирийский оборот допускает как экзистенциальное «существует», так и более буквальное «есть».
lexical_decisions:
- source_word: ܡܠܟܘܬܗ
  choice: Его царство
  rationale: Передаёт царственное владычество без добавления конфессионально обусловленного толкования.
- source_word: ܒ̈ܢܝ ܐܢܫܐ
  choice: сыны человеческие
  rationale: Сохраняет семитский коллективный оборот в понятной и возвышенной русской форме.
- source_word: ܐܝܬ
  choice: существует
  rationale: В данном риторико-философском вопросе естественно передаёт значение бытия или наличия.
- source_word: ܚܪܬܐ
  choice: конец
  rationale: Сохраняет широкое значение исход, завершение или конечная участь, не уточняя его преждевременно.
theological_decisions:
- issue: Референт местоимения в выражении «Его царство»
  choice: Сохранено «Его» без поясняющей замены на имя или титул
  alternative: «в Божьем царстве»
  rationale: Источник выражает референт местоименно; явное называние Бога сняло бы формальную неоднозначность контекста.
- issue: Смысл вопроса о неизвестном конце
  choice: Сохранён открытый риторический вопрос
  alternative: Утвердительное толкование о неизбежной смерти всего сущего
  rationale: Текст связывает существование и неизвестность конца, но не формулирует вывод прямо; перевод не должен устранять эту напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Формула «сыны человеческие» сохранена ради семитского колорита; вопрос сформулирован естественно, без устранения исходной философской неоднозначности.
