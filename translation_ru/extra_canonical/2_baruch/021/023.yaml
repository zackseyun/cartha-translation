  - severity: low
    issue: Тяжеловесное «конец чего»
    rationale: Относительное местоимение «чей» точнее связывает «конец» с предметом вопроса и соответствует современному литературному употреблению.
  - severity: low
    issue: Сноска b предлагает чрезмерно переформулированную альтернативу
    rationale: Формулировка «есть ли нечто подлинно сущее» добавляет философски маркированное «сущее» и меняет степень эксплицитности. Сноска должна отмечать лишь допустимое членение, а не вводить иной регистр.
