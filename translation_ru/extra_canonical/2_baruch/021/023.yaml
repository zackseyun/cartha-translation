  verdict: revise
  source_fidelity: 'Сирийский текст в предоставленном страничном корпусе для ст. 23 непосредственно не изолирован, однако английская контрольная передача отражает смысл: в Его царстве наблюдаема смерть людей; затем следует риторический вопрос о том, существует ли нечто, чей конец неизвестен. Русский черновик в целом передаёт этот смысл, но «И что ... существует» — неудачная калька английского вопросительного оборота.'
  naturalness: «И что поистине существует, конец чего неизвестен?» грамматически возможно, но в современном литературном русском звучит тяжеловесно и неестественно. Лучше сохранить вопросительное значение через «Что же ... существует...»; относительное «чей» естественнее, чем «конец чего».
  terminology: «Его царство» и «смерть сынов человеческих» допустимы и сохраняют возвышенный регистр. Слово «поистине» несколько архаизирует, но уместно; «действительно» было бы стилистически слабее. Не следует заменять местоименный референт на «Бога».
