  text: And let no one who reigns and has become king boast and grow proud through the pride of man.”
translation:
  language: ru
  text: И пусть никто[a], кто правит и стал царём[b], не хвалится и не превозносится в человеческой гордыне».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пусть ничто царствующее, ставшее царём, не хвалится».'
    reason: Сохраняет менее вероятное безличное прочтение, отмеченное в английском контрольном слое; сирийский текст данного места повреждён и выровнен с номером стиха не вполне надёжно.
  - marker: b
    text: 'Или: «пусть никто из правящих не хвалится — тот, кто стал царём».'
    reason: Сохраняет возможное иное синтаксическое присоединение определения «кто стал царём».
lexical_decisions:
- source_word: ܡܠܟ / ܡܠܟܘ (предполагаемая основа в повреждённом и не вполне выровненном месте)
  choice: правит / стал царём
  rationale: 'Сохранены оба близких, но не тождественных образа английского контрольного слоя: осуществление власти и обретение царского положения.'
- source_word: лексема со значением хвалиться / превозноситься (исходная строка в предоставленном развороте повреждена)
  choice: хвалится и не превозносится
  rationale: Пара передаёт как словесное самовосхваление, так и внутреннее возвышение себя, не сводя их к одному понятию.
- source_word: 'человеческая гордыня (по контрольному слою: pride of man)'
  choice: в человеческой гордыне
  rationale: Естественная русская формулировка сохраняет нравственный смысл и не уточняет неоднозначную инструментальную связь сильнее, чем позволяет свидетельство.
theological_decisions:
- issue: К кому относится запрет хвалиться
  choice: к человеку, который правит и стал царём
  alternative: к безличному «ничто», которое царствует или стало царём
  rationale: Личное прочтение лучше согласуется с царским статусом и человеческой гордыней, однако альтернативная синтаксическая возможность сохранена в сноске.
- issue: Соотношение «правит» и «стал царём»
  choice: оба определения относятся к одному лицу и стоят перед сказуемым
  alternative: «кто стал царём» можно присоединить после «не хвалится» как отдельное уточнение
  rationale: Основной текст звучит естественно по-русски, но не устраняет засвидетельствованную синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-назидательного контекста. Формулировка ясна обычному читателю; лексическая и синтаксическая неуверенность повреждённого источника вынесена в сноски, а не скрыта.
