review_pass:
  verdict: revise
  source_fidelity: 'Основной текст верно следует английскому контрольному слою: запрет адресован лицу, которое правит и стало царём; сохранены два действия — хвалиться и возвышать себя. Однако «в человеческой гордыне» не вполне точно передаёт инструментально-причинную связь английского «through the pride of man»; более ясно и естественно «из-за человеческой гордыни». Поскольку сирийская строка в предоставленном развороте повреждена и привязка к стиху ненадёжна, альтернативы следует сохранять только как явно обозначенные варианты контрольного слоя, не выдавая их за твёрдо установленное чтение.'
  naturalness: '«Не хвалится и не превозносится» естественно для современного литературного русского в назидательно-молитвенном регистре. Замена «в человеческой гордыне» на «из-за человеческой гордыни» делает фразу идиоматичнее и точнее. Альтернативная формулировка в сноске a нуждается в синтаксической правке: «ничто царствующее, ставшее царём» звучит не по-русски.'
  terminology: «Царь», «правит», «хвалится» и «гордыня» уместны. «Человеческая гордыня» сохраняет нравственно-назидательный тон без конфессионального переосмысления.
  issues:
  - severity: low
    issue: Неясная связь «в человеческой гордыне».
    rationale: Предлог «в» описывает состояние, тогда как контрольный текст выражает связь посредством/вследствие гордыни. «Из-за человеческой гордыни» передаёт её яснее, не добавляя толкования.
  - severity: low
    issue: Сноска a сформулирована неестественно.
    rationale: 'Вариантное чтение следует сохранить из английского контрольного слоя, но его можно передать грамматически яснее: «пусть ничто, что царствует и стало царём, не хвалится».'
  - severity: low
    issue: Сноска b чрезмерно перестраивает русскую фразу.
    rationale: Следует обозначить альтернативное присоединение «ставший царём» без неестественной конструкции «пусть никто из правящих ... тот, кто стал царём».
  revised_text: И пусть никто[a], кто правит и стал царём[b], не хвалится и не превозносится из-за человеческой гордыни».
  revised_footnotes:
  - marker: a
    text: 'Или: «пусть ничто, что царствует и стало царём, не хвалится».'
    reason: Сохраняет менее вероятное безличное прочтение, отмеченное в английском контрольном слое; сирийский текст данного места повреждён, и его привязка к номеру стиха не вполне надёжна.
  - marker: b
    text: 'Или: «пусть никто, кто правит, не хвалится, став царём».'
    reason: Передаёт возможное иное синтаксическое присоединение определения о воцарении, отмеченное в английском контрольном слое.
  revision_rationale: Сделана минимальная правка для более точной и естественной передачи связи с «человеческой гордыней». Обе отмеченные в английском контрольном слое синтаксические альтернативы сохранены в сносках, но переформулированы на естественном русском. Из-за повреждённости и ненадёжного выравнивания сирийского свидетельства исправление не претендует на снятие текстологической неопределённости.
