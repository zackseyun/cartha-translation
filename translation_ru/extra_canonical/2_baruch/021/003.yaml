    reason: Предоставленный сирийский текст читает ܘܐܡܪܬ ܡܢ ܬܡܢ («И оттуда я сказал»), тогда как контрольная традиция и английский консультационный текст отражают чтение «И я ответил и сказал».
lexical_decisions:
- source_word: ܘܐܡܪܬ
  choice: «я сказал»
  rationale: Форма означает «и я сказал»; в представленном сирийском тексте перед ней нет глагола «ответил».
- source_word: ܡܢ ܬܡܢ
  choice: «оттуда»
  rationale: Буквально «из/от того места, оттуда»; оборот сохранён, поскольку он прямо засвидетельствован в предоставленном сирийском источнике.
