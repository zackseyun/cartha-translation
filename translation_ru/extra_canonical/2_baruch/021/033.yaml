translation:
  language: ru
  text: '[Обрати взор на][a] любовь к Твоему имени, которая пред Тобой превыше всего.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Слова «Обрати взор на» восстановлены по смыслу: соответствующее место сирийского текста повреждено или не полностью представлено в сохранившемся фрагменте.'
    reason: Квадратные скобки обозначают редакционное восполнение; примечание поясняет его текстовую неопределённость.
lexical_decisions:
- source_word: ܫܡܟ (предполагаемая форма в повреждённом/неполно представленном месте)
  choice: Твоему имени
  rationale: Передаёт обращение к Богу и соответствует засвидетельствованному смыслу английского контрольного слоя; прописная буква указывает на божественного Адресата.
- source_word: ܚܘܒܐ / конструкция со значением любви (предполагаемое чтение)
  choice: любовь к
  rationale: В современном русском родительное «любовь Твоего имени» двусмысленно и неестественно; «любовь к Твоему имени» ясно выражает направленность любви, не добавляя конфессионального толкования.
- source_word: ܩܕܡܝܟ … ܡܢ ܟܠ
  choice: пред Тобой превыше всего
  rationale: Сохраняет пространственно-судебный образ «пред Тобой» и превосходную характеристику «превыше всего», не решая, относится ли последняя прежде всего к положению этой любви или к её ценности.
theological_decisions:
- issue: Смысл выражения «любовь к Твоему имени»
  choice: Сохранено как любовь, направленная к Божьему имени
  alternative: «любовь Твоего имени» или «ради любви к Твоему имени»
  rationale: Выбранная формулировка наиболее естественно передаёт объект любви и не превращает её без достаточного основания в любовь, исходящую от имени, либо в мотив Божьего действия.
- issue: Синтаксическая связь «превыше всего»
  choice: Оставлена при всей фразе «которая пред Тобой превыше всего»
  alternative: «превыше всего обрати внимание»
  rationale: Так сохраняется структура контрольного чтения и присущая ей лёгкая смысловая напряжённость, без перестановки, которая сделала бы «превыше всего» наречным определением повеления.
translation_notes:
  register: Современный литературный русский, молитвенно-возвышенный, но понятный. Местоимения, обращённые к Богу, написаны с прописной буквы. Порядок слов сохраняет торжественность и допускает исходную синтаксическую напряжённость.
