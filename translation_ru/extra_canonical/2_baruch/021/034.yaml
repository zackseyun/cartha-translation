  text: Therefore from now on show your greatness, and do not overlook what is brought to nothing under the kingdom of death.
translation:
  language: ru
  text: Итак, отныне яви Своё величие и не оставь без внимания то, что обращается в ничто под властью царства смерти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܠܟܘܬܐ / kingdom (consultation-layer alignment)
  choice: царство
  rationale: Сохраняет образ смерти как господствующей силы, не сводя его просто к факту умирания.
- source_word: ܡܬܚܒܠ / brought to nothing, perishes (consultation-layer alignment)
  choice: обращается в ничто
  rationale: Передаёт разрушение или уничтожение и сохраняет широту значения, не уточняя без достаточных оснований, идёт ли речь только о людях.
- source_word: show your greatness
  choice: яви Своё величие
  rationale: Естественная для молитвенного контекста современная литературная формулировка; «яви» выражает публичное обнаружение Божьего величия.
theological_decisions:
- issue: Персонификация смерти и характер её власти
  choice: под властью царства смерти
  alternative: в царстве смерти
  rationale: Формулировка сохраняет образ царства и одновременно ясно передаёт господство смерти, не превращая выражение в строго разработанное учение о загробном мире.
- issue: Объект Божьего внимания
  choice: то, что обращается в ничто
  alternative: те, кто погибает
  rationale: Сохранена грамматическая и смысловая широта консультационного текста; перевод не ограничивает объект исключительно людьми.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенной речи. Местоимение «Своё» написано с прописной буквы как обращённое к Богу; синтаксис остаётся ясным для широкого читателя.
