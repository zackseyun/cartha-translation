translation:
  language: ru
  text: Ты, Который мановением повелел воздуху и увидел грядущее как то, что Ты совершаешь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐܐܪ
  choice: воздуху
  rationale: Сирийское заимствование ܐܐܪ обозначает «воздух»; это прямой объект повеления с предлогом ܠ.
- source_word: ܒܪܘܙܝܟ
  choice: мановением
  rationale: ܪܘܙܐ означает знак или едва заметный жест; «мановением» естественно и достойно передаёт способ властного повеления. Суффикс второго лица не требует отдельного «Твоим» по-русски.
- source_word: ܕܥܬܝ̈ܕܢ
  choice: грядущее
  rationale: Форма обозначает то, чему предстоит быть; собирательное «грядущее» звучит естественнее буквального «то, что должно прийти».
- source_word: ܐܝܟ ܐܝܠܝܢ ܕܥܒܕ ܐܢܬ
  choice: как уже совершаемое Тобою
  rationale: Передаёт сравнение будущего с тем, что Бог совершает в настоящем; «уже» эксплицирует временное противопоставление, подразумеваемое контекстом, а буквальная форма сохранена в примечании.
theological_decisions:
- issue: Соотношение Божьего предвидения и действия в заключительной фразе
  choice: увидел грядущее как уже совершаемое Тобою
  alternative: увидел грядущее как то, что Ты совершаешь
  rationale: Текст связывает видение будущего с Божьим совершающим действием, не объясняя механизм этого соотношения. Перевод сохраняет напряжение и не сводит фразу только к предведению.
translation_notes:
  register: Современный литературный русский с торжественным молитвенным обращением. Заглавные местоименные формы использованы последовательно в обращении к Богу; синтаксис остаётся ясным для обычного читателя.
