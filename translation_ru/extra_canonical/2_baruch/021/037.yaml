  text: And let the treasuries of the souls restore those who are shut up in them, that there may be a gathering of the sons of men, as you commanded from of old.
translation:
  language: ru
  text: И пусть сокровищницы душ возвратят заключённых в них, чтобы состоялось собрание сынов человеческих, как Ты повелел издревле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен иной синтаксический разбор: «И пусть заключённые в них возвратят их сынам человеческим, как Ты повелел издревле, и пусть они будут собраны воедино».'
    reason: Сохраняет засвидетельствованную альтернативу в синтаксическом членении фразы, не приписывая ей степень вероятности, которой нет в английском аудиторском следе.
lexical_decisions:
- source_word: ܐܘܨܪ̈ܐ ܕܢܦܫ̈ܬܐ
  choice: сокровищницы душ
  rationale: «Сокровищницы» сохраняет образ небесных хранилищ, где души удерживаются до назначенного времени; более общее «хранилища» было бы яснее, но ослабило бы традиционный образ.
- source_word: ܢܗܦܟܘܢ
  choice: возвратят
  rationale: Передаёт действие возвращения или выдачи находившихся там душ, не уточняя сверх текста, куда именно они возвращаются.
- source_word: ܐܝܠܝܢ ܕܚܒܝܫܢ ܒܗܘܢ
  choice: заключённых в них
  rationale: Сохраняет пассивное значение и связь местоимения со «сокровищницами».
- source_word: ܕܢܗܘܐ ܟܢܘܫܝܐ ܕܒܢܝܢܫܐ
  choice: чтобы состоялось собрание сынов человеческих
  rationale: Передаёт целевое придаточное и не присоединяет «сынов человеческих» к глаголу «возвратят».
- source_word: ܡܢ ܩܕܝܡ
  choice: издревле
  rationale: Естественно и кратко передаёт временное значение «с давних времён / от начала».
theological_decisions:
- issue: Кто или что возвращается из сокровищниц душ
  choice: Сокровищницы возвращают тех, кто заключён в них
  alternative: Заключённые в сокровищницах возвращают их сынам человеческим, после чего их собирают
  rationale: Основной синтаксический разбор делает «сокровищницы душ» подлежащим, а «заключённых в них» — дополнением; это также сохраняет отдельную целевую фразу о собрании людей. Альтернативный разбор отмечен как менее вероятный, но засвидетельствованный.
- issue: Эсхатологический характер образа
  choice: Сохранён образ сокровищниц без пояснения природы или состояния душ
  alternative: Истолковать их как конкретное место пребывания умерших до воскресения
  rationale: Стих использует образный язык, но сам не даёт полного учения о промежуточном состоянии; перевод не должен добавлять конфессиональное толкование.
translation_notes:
  register: Современный литературный русский язык с торжественным молитвенным звучанием. Местоимение «Ты» написано с прописной буквы как обращение к Богу. Термин «сыны человеческие» сохранён ради библейского регистра и коллективного значения.
