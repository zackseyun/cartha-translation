  verdict: approve
  source_fidelity: 'Сирийский текст передаёт обращение к Богу: «[Ты], кто от начала мира призывает то, чего нет, и они слушаются/повинуются Тебе». «От начала мира» верно соответствует ܡܢ ܪܝܫ ܥܠܡܐ; «призываешь» хорошо передаёт ܩܪܐ. Собирательное русское «то, чего нет» правомерно передаёт трудное обозначение несуществующего без добавления «ещё». «Повинуется Тебе» обоснованно выбирает значение послушания для ܡܫܬܡܥܝܢ ܠܝ, хотя исходная форма имеет множественное число; русское «оно» согласовано с собирательным «то».'
