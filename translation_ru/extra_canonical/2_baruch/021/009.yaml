translation:
  language: ru
  text: От начала мира Ты призываешь то, чего нет, и оно повинуется Тебе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩ̣ܪܐ
  choice: призываешь
  rationale: Передаёт значение «звать, призывать», сохраняя образ властного слова, вызывающего к отклику.
- source_word: ܡܢ ܪܝܫ ܥܠܡܐ
  choice: от начала мира
  rationale: Прямое и естественное соответствие сирийскому временному обороту.
- source_word: ܠܥܡ̣ܡܐ ܕܒ̣ܕܓܠܐ ܠܐ
  choice: то, чего нет
  rationale: Текст в данном месте рукописно и типографически труден; выбор следует засвидетельствованному смыслу контрольного чтения — несуществующее, без добавления «ещё».
- source_word: ܡܫܬܡܥܝܢ ܠܝ
  choice: повинуется Тебе
  rationale: ܫܡܥ с объектом лица может означать не просто слышание, а послушание; «повинуется» естественно выражает отклик на Божий призыв.
theological_decisions:
- issue: Призывание несуществующего
  choice: то, чего нет
  alternative: то, чего ещё нет
  rationale: Не добавлено временное «ещё», которого явно нет в предложенном чтении; так сохраняется возможная отсылка к творящей силе Божьего слова без её догматического уточнения.
- issue: Характер отклика на Божий призыв
  choice: повинуется Тебе
  alternative: слушает Тебя
  rationale: Контекст обращения к Богу и семантика сирийского глагола поддерживают значение послушания, однако не вводится более конкретное толкование способа действия.
translation_notes:
  register: Современный литературный русский; молитвенный и возвышенный, но понятный регистр. Местоимения обращения к Богу написаны с прописной буквы. Единственное число «оно» согласовано с собирательным «то, чего нет».
