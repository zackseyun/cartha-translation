  terminology: «Призываешь» сохраняет образ властного призыва, не сужая его до технического богословского термина. «Повинуется» адекватно передаёт послушный отклик и соответствует английской контрольной формулировке “they listen to you” в контексте. Добавочного догматического истолкования нет.
