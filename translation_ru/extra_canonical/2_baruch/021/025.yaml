translation:
  language: ru
  text: Если бы в них не было того, что уготовано миру[a][b], они находили бы утешение в своей надежде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «того, что отложено для мира».'
    reason: Сохраняет возможный оттенок заранее отложенного или сохраняемого.
  - marker: b
    text: 'Возможен иной порядок слов: «Если бы того, что уготовано миру, не было в них». Смысл местоимения «в них» в данном месте не вполне ясен.'
    reason: Отражает синтаксическую неоднозначность и неясность референта, не подменяя перевод толкованием.
lexical_decisions:
- source_word: ܥܬܝ̈ܕܢ / выражение со значением предназначенного или сохраняемого на будущее
  choice: то, что уготовано
  rationale: Передаёт идею предназначенного и сохраняемого для будущего, оставаясь естественным и торжественным в современном русском языке; не уточняет сверх источника, идёт ли речь о событиях, благах или судах.
- source_word: ܥܠܡܐ
  choice: миру
  rationale: Обычный эквивалент для «мира»; контекст не требует однозначно понимать слово как «век».
- source_word: ܒܘܝܐ / утешение
  choice: находили бы утешение
  rationale: Естественная русская передача состояния утешенности без архаичного оборота.
- source_word: ܣܒܪ / надежда
  choice: в своей надежде
  rationale: Сохраняет личную соотнесённость надежды с упомянутыми лицами.
theological_decisions:
- issue: Неясная связь между находящимся «в них» и тем, что уготовано миру
  choice: Сохранить условную конструкцию без объяснения природы уготованного
  alternative: Истолковать уготованное как будущий суд, награду или удел
  rationale: Источник и консультационный слой не определяют предмет достаточно ясно; конкретизация сняла бы подлинную неоднозначность.
- issue: Значение ܥܠܡܐ
  choice: мир
  alternative: век
  rationale: «Мир» лучше соответствует непосредственной традиции текста, но возможное временно-эсхатологическое значение отмечено примечанием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка намеренно сохраняет необычную логику условного высказывания и не раскрывает, что именно уготовано миру.
