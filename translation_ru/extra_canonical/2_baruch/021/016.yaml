translation:
  language: ru
  text: Ты один, оставаясь непоколебимым, знаешь учение о временах[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наставление о временах»; по контексту возможно также: «установленный ход времён».'
    reason: ܝܘܠܦܢܐ обычно означает «учение, наставление»; «установленный ход времён» — возможное контекстуальное, а не основное лексическое значение.
lexical_decisions:
- source_word: ܝܘܠܦܢܘܗܝ ܕܙܒ̈ܢܐ
  choice: порядок времён
  rationale: ܝܘܠܦܢܐ обычно означает «учение», «наставление», однако в данном апокалиптическом контексте выражение указывает на установленный ход или устройство времён. «Порядок времён» естественно звучит по-русски и сохраняет идею их устроения; основное словарное значение отмечено в сноске.
- source_word: ܟܕ ܠܐ ܢܬܬܙܝܥ
  choice: оставаясь непоколебимым
  rationale: Оборот относится к явно названному далее адресату ܐܢܬ («Ты») и буквально передаёт отсутствие колебания или потрясения. Причастная конструкция яснее связывает характеристику с Богом.
- source_word: ܐܢܬ ܒܠܚܘܕܝܟ ܝ̣ܕܥܬ
  choice: Ты один… знаешь
  rationale: Сохраняет усилительное ܒܠܚܘܕܝܟ («Ты один») и естественный для русского языка порядок слов.
theological_decisions:
- issue: Божественная неизменность и знание времён
  choice: Фраза «оставаясь непоколебимым» отнесена к Богу, а знание порядка времён представлено как принадлежащее Ему одному.
  alternative: Связать отсутствие движения или колебания с самими временами.
  rationale: В сирийском тексте присутствует явное местоимение второго лица ܐܢܬ, а глагольная форма также обращена к единственному адресату; поэтому синтаксически характеристика относится к Богу. Перевод не развивает это в отдельное догматическое утверждение.
translation_notes:
  register: Современный литературный русский язык с молитвенно-возвышенным, но понятным строем. Местоимение «Ты» написано с прописной буквы как обращение к Богу. Маркер сноски помещён непосредственно после неоднозначного выражения.
