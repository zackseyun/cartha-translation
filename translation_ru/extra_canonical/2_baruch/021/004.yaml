review_pass:
  verdict: revise
  source_fidelity: 'Сирийский текст 21:4 читается как «Горе сердцу моему, которое [или: ибо оно] мучится/сокрушается у источника скорби; и воды мои выходят оттуда; и я не насыщаюсь плачем». Драфт верно удерживает образы источника и плача, но «раскрылось источником» слишком уверенно превращает неясный глагол в конкретную метафору раскрытия и синтаксически неестественно. «Воды мои» в данном контексте лучше передать как «слёзы мои», а не снабжать перевод избыточной буквальной сноской.'
  naturalness: «Оно раскрылось источником скорби» не является естественным современным литературным русским. Формула «сердце моё изнывает у источника скорби» сохраняет образ и не утверждает спорного значения глагола. Порядок «из него текут слёзы мои» естественен и ясно соотносит слёзы с источником.
  terminology: Термины специально-богословского характера отсутствуют. «Горе сердцу моему» соответствует возвышенному плачевному регистру. «Изнывает» передаёт скорбное состояние без доктринальной интерпретации.
  issues:
  - severity: medium
    issue: Слишком определённая передача ܕܡܨܪ как «раскрылось источником».
    rationale: Значение и синтаксическая связь сирийского выражения не вполне определённы; английская традиция также фиксирует альтернативу. Русская формулировка создаёт не засвидетельствованное с достаточной уверенностью утверждение, будто сердце само превратилось в источник или раскрылось как источник.
  - severity: medium
    issue: Неестественная русская конструкция «раскрылось источником скорби».
    rationale: Даже при выборе образной интерпретации инструментально-предикативная конструкция звучит искусственно и затемняет смысл.
  - severity: low
    issue: Сноска b не нужна в предлагаемой форме.
    rationale: «Воды мои» — буквальный образ, однако в непосредственном контексте плача «слёзы мои» является ясной смысловой передачей. Сноска не отмечает существенной текстологической или переводческой неопределённости.
