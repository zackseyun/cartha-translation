  rationale: 'Перевод исправлен для более осторожной передачи спорного сирийского глагола и для естественного современного русского синтаксиса. Сохранены все основные элементы: восклицание о сердце, источник скорби, исходящие от него слёзы и ненасытный плач. Буквальная сноска о «водах» удалена, поскольку контекст однозначно определяет их как слёзы и она не нужна для понимания перевода.'
