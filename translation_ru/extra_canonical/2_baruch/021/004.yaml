  text: “Woe to my heart, for it bursts open into a spring of grief, and from there tears flow from my eyes, and I am not satisfied with weeping.”
translation:
  language: ru
  text: «Горе сердцу моему, изнывающему у источника скорби[a]! Из него текут слёзы мои, и я не насыщаюсь плачем».
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «сердцу моему, которое сокрушается у источника скорби». Значение сирийского глагола и его точная синтаксическая связь здесь не вполне ясны.'
    reason: Сохраняет реальную лексико-синтаксическую неопределённость оригинала, не навязывая образ «раскрытия» или «превращения в источник».
lexical_decisions:
- source_word: ܘܝܠܗ ܠܒܒܝ
  choice: Горе моему сердцу
  rationale: Прямо передаёт плачевное восклицание и сохраняет торжественный молитвенный строй.
- source_word: ܕܡܨܪ ܒܡܒܘܥܐ ܕܐܒܠܐ
  choice: оно раскрылось источником скорби
  rationale: Передаёт образ сердца, из которого прорывается источник скорби, и естественно связывает его со следующим упоминанием текущих слёз; форма и точный оттенок глагола в сирийском допускают иное понимание, поэтому оно отмечено в сноске.
- source_word: ܘܡ̈ܝܢܝ ܢܦܩܝܢ ܬܡܢ
  choice: и оттуда из глаз моих текут слёзы
  rationale: Буквально речь идёт о «моих водах»; в контексте плача это слёзы. Слово «оттуда» сохраняет связь с образом источника.
- source_word: ܘܠܡܒܟܐ ܠܐ ܐܫܒܥ
  choice: не могу я насытиться плачем
  rationale: Сохраняет семитскую идиому «не насыщаюсь плачем» в понятной современной русской форме без ослабления интенсивности скорби.
