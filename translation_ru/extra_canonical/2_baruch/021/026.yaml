  text: But because he was created from the earth and from dust, whatever passes away departs from it to its own place.
translation:
  language: ru
  text: Но так как он был создан из земли и из праха, всё преходящее[a] уходит из неё в своё место.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «всё, что проходит (уходит)».'
    reason: Сохраняет возможное более буквальное понимание выражения, которое может обозначать как преходящесть, так и уход.
lexical_decisions:
- source_word: ܡܢ ܐܪܥܐ ܘܡܢ ܥܦܪܐ (reconstructed from the verse’s control-backed reading)
  choice: из земли и из праха
  rationale: Сохраняет оба параллельных обозначения вещества, из которого создан человек, не сливая их в одно.
- source_word: ܐܬܒܪܝ (masculine verbal form, as reflected in the reviewed verse reading)
  choice: он был создан
  rationale: Мужская форма указывает на человека как подразумеваемое подлежащее; земля не может быть подлежащим этой формы.
- source_word: whatever passes away / corresponding Syriac verse reading not fully visible in the supplied page excerpt
  choice: всё преходящее
  rationale: Передаёт исчезновение и смертность, не сводя выражение исключительно к физической смерти и не создавая в русском смысла простого движения мимо.
- source_word: to its own place
  choice: в своё место
  rationale: Сохраняет возвратное значение и лаконичность исходного выражения.
theological_decisions:
- issue: Кто был создан из земли и праха
  choice: 'Подразумеваемый человек: «он был создан»'
  alternative: «земля была создана из праха»
  rationale: Альтернатива противоречит мужской форме сирийского глагола и нарушает образ возвращения человека к земле.
- issue: Значение преходящего
  choice: Оставлено обобщённое «всё преходящее»
  alternative: «всякий умирающий»
  rationale: Более узкая формулировка прямо вводила бы смерть там, где выражение допускает более широкую мысль о бренности и уходе.
translation_notes:
  register: Современный литературный русский язык; синтаксис торжественный, но ясный. Местоимение «он» оставлено без добавления слова «человек», чтобы не устранять подразумеваемость оригинала. Маркер [a] помещён в основном тексте.
