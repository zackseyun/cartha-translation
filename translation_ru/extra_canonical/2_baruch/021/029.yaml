  text: And because the world was created for a time, and those in it are sustained with much trouble, command concerning evil.
translation:
  language: ru
  text: И поскольку мир создан на время[a], а живущие в нём существуют среди многих тягот[b], повели о зле.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «для времени».'
    reason: Сирийское выражение допускает как указание на ограниченный срок, так и более буквальное отношение к времени.
  - marker: b
    text: 'Возможно: «со многими тяготами».'
    reason: Связь выражения с глаголом допускает передачу как обстоятельства, сопровождающего существование обитателей мира; точный оттенок не вполне ясен.
  - marker: c
    text: 'Или: «отдай повеление относительно зла». Фраза, по-видимому, продолжается в следующем стихе.'
    reason: Сохраняются широкое значение слова «зло», направление повеления и синтаксическая незавершённость на границе стихов.
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: мир
  rationale: Обычное значение в данном космологическом контексте; речь идёт о сотворённом мире.
- source_word: ܙܒܢܐ
  choice: время
  rationale: Передаёт временную ограниченность существования мира, не уточняя длительность.
- source_word: ܡܬܚܫܒܝܢ
  choice: поддерживают своё существование
  rationale: Контекстуально передаёт идею пребывания или сохранения жизни обитателей мира; форма исходного текста и состояние рукописной передачи не позволяют чрезмерно конкретизировать способ этого поддержания.
- source_word: ܒܝܫܬܐ
  choice: зло
  rationale: Сохраняет широкое значение — зло, бедствие или несчастье — без преждевременного снятия неоднозначности.
theological_decisions:
- issue: Временность сотворённого мира
  choice: мир создан на время
  alternative: мир создан для времени
  rationale: Первый вариант естественнее по-русски и выражает ограниченность нынешнего мирового порядка, но примечание сохраняет возможное понимание конструкции как «для времени».
- issue: Повеление относительно зла
  choice: повели относительно зла
  alternative: отдай повеление против зла
  rationale: Сохранена необычная и богословски напряжённая формулировка, не уточняющая, должен ли Бог распорядиться о зле, против зла или о его прекращении; контекст следующего стиха может прояснять её.
translation_notes:
  register: Современный литературный русский язык с молитвенно-возвышенным, но понятным строем. Императив «повели» сохраняет обращение к Богу и намеренную резкость исходной формулировки; неоднозначности вынесены в примечания.
