revisions:
- from: И поскольку мир создан на время[a], а живущие в нём поддерживают своё существование среди многих тягот[b], повели относительно зла.[c]
  to: И поскольку мир создан на время[a], а живущие в нём существуют среди многих тягот[b], повели о зле.[c]
  rationale: Исправлен только небезопасный активный смысл «поддерживают своё существование» и слегка выровнен регистр финального императива. Временность мира, множество тягот, широкое понятие зла и возможное продолжение фразы в следующем стихе сохранены; примечания привязаны к тем же местам.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T21:06:49Z'
review_pass:
  verdict: revise
  source_fidelity: 'Основная структура передана верно: временность мира, его обитатели, тяготы и обращённый к Богу императив сохранены. Однако «живущие в нём поддерживают своё существование» меняет зависимую/страдательную идею английского аудиторского текста («those in it are sustained») в активное самоподдержание. Более нейтральное «существуют среди многих тягот» не вносит этого смыслового сдвига. Подача сирийского фрагмента в предоставленном корпусе не позволяет надёжно локализовать именно ст. 29, поэтому спорную синтаксическую незавершённость конца следует сохранять, а не устранять догматическим толкованием.'
  naturalness: «Повели относительно зла» понятно, но несколько канцелярско. «Повели о зле» — сжатая литературно-библейская формула, естественная в обращении-молитве и сохраняющая намеренно неполный характер фразы. «Существуют среди многих тягот» современно и не утяжеляет предложение.
  terminology: «Мир», «время» и «зло» удачны. «Зло» следует оставить широким термином, не сужая его до морального зла, бедствия или конкретного противника. «На время» адекватно передаёт временный характер; альтернативное буквальное прочтение отмечено в примечании.
  issues:
