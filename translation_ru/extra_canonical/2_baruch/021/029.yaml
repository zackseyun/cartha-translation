    issue: Активный оборот «поддерживают своё существование».
    rationale: Он представляет обитателей мира как самостоятельно поддерживающих своё бытие, тогда как контрольный английский текст выражает их существование/поддержание как испытываемое ими состояние. Это ненужное изменение залога и смыслового акцента.
  - severity: low
    issue: Оборот «повели относительно зла» стилистически тяжеловесен.
    rationale: Он не является ошибкой, но «повели о зле» лучше соответствует высокому молитвенному регистру и оставляет ту же синтаксическую и смысловую открытость до следующего стиха.
