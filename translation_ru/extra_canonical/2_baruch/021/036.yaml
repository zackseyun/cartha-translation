translation:
  language: ru
  text: Да будет запечатан Шеол[a], чтобы отныне он не принимал умерших.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шеол — мир мёртвых.
    reason: Кратко поясняет современному читателю редкий древний термин, не сужая его значения до «ада».
lexical_decisions:
- source_word: ܫܝܘܠ (предполагаемая форма в стихе по контрольному чтению)
  choice: Шеол
  rationale: Сохраняет древнее название мира мёртвых и не отождествляет его без достаточных оснований с адом как местом окончательного наказания.
- source_word: ܬܬܚܬܡ
  choice: да будет запечатан
  rationale: Передаёт страдательное значение глагола «быть запечатанным, закрытым печатью»; чтение «пробудится/придёт в движение» источником не поддерживается.
- source_word: ܬܩܒܠ
  choice: принимал
  rationale: Основное значение — «принимать»; оно точнее, чем «удерживать».
- source_word: ܡܝ̈ܬܐ
  choice: умерших
  rationale: Естественное русское обозначение умерших людей в данном контексте.
theological_decisions:
- issue: Обозначение места пребывания умерших
  choice: Шеол
  alternative: ад / преисподняя
  rationale: Транслитерация сохраняет историко-религиозную широту термина и не вносит представление об окончательном наказании, которого сам термин здесь не требует.
translation_notes:
  register: Современный литературный русский; торжественная форма пожелания «да будет» соответствует молитвенному контексту. Синтаксис сохранён ясным и компактным.
