translation:
  language: ru
  text: Приблизь тех, кого ищут, и пусть то, что началось в тяготах, возрадуется приходу Твоей славы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܪܒ (смысловой эквивалент в стихе)
  choice: «приблизь»
  rationale: Сохраняет пространственно-реляционный образ исходного призыва и не уточняет, к кому именно следует приблизить искомых.
- source_word: «те, кого ищут» (пассивная конструкция источника)
  choice: «тех, кого ищут»
  rationale: Пассивность сохранена, чтобы не вводить отсутствующего в тексте субъекта поиска.
- source_word: «началось в тяготах»
  choice: «то, что началось в тяготах»
  rationale: Русское местоименное выражение естественно передаёт намеренно неопределённый субъект и сохраняет образ трудного начала.
- source_word: «приход / прибытие Твоей славы»
  choice: «приходу Твоей славы»
  rationale: Передаёт динамику прибытия без более узкого богословского термина «пришествие».
theological_decisions:
- issue: Кто именно ищет названных людей
  choice: 'Субъект не назван: «кого ищут»'
  alternative: «тех, кого Ты ищешь»
  rationale: Источник оставляет деятеля при пассивной форме невыраженным; добавление обращения к Богу устранило бы подлинную неоднозначность.
- issue: Характер прихода славы
  choice: «приход Твоей славы»
  alternative: «пришествие Твоей славы»
  rationale: Нейтральная формулировка не связывает стих автоматически с конкретной эсхатологической схемой.
translation_notes:
  register: Современный литературный русский язык с молитвенно-возвышенным, но понятным строем. Местоимение «Твоей» написано с прописной буквы как часть прямого обращения к Богу. Предоставленный сирийский материал представляет собой более широкий и местами повреждённый фрагмент главы, поэтому формулировка стиха сверена с аудированным английским консультационным слоем без попытки восстановить отсутствующие детали.
