lexical_decisions:
- source_word: ܘܡܢ ܒܬܪܗܝܢ
  choice: После этого
  rationale: 'Естественно передаёт временную последовательность: «и после этих [событий]».'
- source_word: ܠܐܬܪܐ ܗܘ
  choice: на то место
  rationale: Указательное ܗܘ уточняет уже известное место; по-русски естественно «то место».
- source_word: ܕܡܠܠܬ ܥܡܝ
  choice: где Ты говорил со мной
  rationale: 'Сирийская глагольная форма ܡܠܠܬ имеет второе лицо единственного числа, поэтому исходный текст прямо обращён к Богу: «Ты говорил», а не «Он говорил».'
theological_decisions:
- issue: Лицо глагола при обращении к Богу
  choice: Ты говорил
  alternative: Он говорил
  rationale: Выбрано чтение сирийского первоисточника во втором лице; английский консультационный текст с «he» не соответствует форме ܡܠܠܬ в данном контексте молитвы.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и молитвенно-повествовательная. Местоимение «Ты» написано с прописной буквы как прямое уважительное обращение к Богу.
