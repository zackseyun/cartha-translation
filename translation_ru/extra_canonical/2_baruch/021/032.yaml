translation:
  language: ru
  text: Они видят то, что есть, но не то, что будет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܙܝܢ / ܚܙܝܬ (корень ܚܙܐ)
  choice: видят
  rationale: Передаёт обычное значение сирийского глагола «видеть» и сохраняет параллельное противопоставление настоящего будущему.
- source_word: «то, что есть»
  choice: то, что есть
  rationale: Естественная русская формулировка, которая не сужает смысл до материально «существующего».
- source_word: «то, что будет»
  choice: то, что будет
  rationale: Сохраняет открытое указание на будущее без добавления толкования о конкретных событиях.
theological_decisions:
- issue: Предел человеческого или иного знания о будущем
  choice: Сохранено краткое противопоставление видимого настоящего и неведомого будущего.
  alternative: Уточнить субъект или истолковать будущее как последние времена.
  rationale: Контекстуальный фрагмент и английский контрольный слой не требуют такого уточнения; добавление разрешило бы сохраняемую исходным текстом неопределённость.
translation_notes:
  register: Современный литературный русский; краткая, ритмически уравновешенная фраза. Из-за предположительной постраничной привязки стиха в предоставленном сирийском корпусе формулировка сверена с английским аудированным слоем без внесения отсутствующих уточнений.
