translation:
  language: ru
  text: При великом исчислении пред Тобой памятны прегрешения тех, кто был прежде Тебя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝ̈ܒܘܬܐ (ḥayyāḇūṯā)
  choice: прегрешения
  rationale: Передаёт нравственную вину и отдельные виновные деяния, не ограничивая смысл юридическими «преступлениями».
- source_word: ܒܚܘܫܒܐ ܪܒܐ (bə-ḥuššāḇā rabbā)
  choice: при великом исчислении
  rationale: Сохраняет образ великого подсчёта/сведения счёта; слово «исчисление» естественно сочетается с контекстом Божьего суда, не сводя выражение только к судопроизводству.
- source_word: ܩܕܡ̈ܝܟ / ܩܕܡܝܟ (qḏāmayk / qḏāmayk)
  choice: тех, кто пред Тобой / пред Тобой
  rationale: Сохранён повтор пространственно-реляционного выражения источника и его возможный судебный оттенок.
- source_word: ܡܕܟܪܐ (mḏakkarā)
  choice: сохраняются
  rationale: 'Основной текст следует контрольному пассивному пониманию: проступки остаются удержанными в памяти/учёте перед Богом. Активное прочтение формы отражено в сноске.'
theological_decisions:
- issue: Характер великого исчисления
  choice: не называть его прямо «Страшным судом»
  alternative: «на великом суде»
  rationale: Сирийское ܚܘܫܒܐ обозначает счёт, расчёт или отчёт и допускает судебный смысл, но прямое внесение слова «суд» устранило бы образную и лексическую неоднозначность.
- issue: Как Бог относится к прегрешениям
  choice: «пред Тобой сохраняются»
  alternative: «Ты помнишь пред Собой»
  rationale: Пассивная формулировка соответствует аудированной текстологической поправке и не развивает учение о Божьей памяти сверх сказанного; активная возможность сохранена в примечании.
translation_notes:
  register: Современный литературный русский с достоинством молитвенной речи. Заглавные формы «Тобой», «Ты» указывают на обращение к Богу. Повтор «пред Тобой» намеренно сохранён как черта источника, хотя по-русски он звучит несколько торжественно.
