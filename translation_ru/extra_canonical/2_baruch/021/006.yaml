translation:
  language: ru
  text: И после этого я пришёл на то место, где Ты говорил со мной, и сел в пещере земли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܪܐ
  choice: место
  rationale: Прямое и естественное соответствие сирийскому слову со значением «место».
- source_word: ܡܠܠܬ ܥܡܝ
  choice: Ты говорил со мной
  rationale: Сохраняет прямое обращение к Богу и значение сирийской конструкции «говорить с кем-либо».
- source_word: ܡܥܪܬܐ
  choice: пещера
  rationale: Передаёт обычное значение сирийского существительного; образ сохранён без поясняющего расширения.
- source_word: ܐܪܥܐ
  choice: земля
  rationale: В сочетании «пещера земли» сохранена конкретная образность исходного текста, хотя по-русски она несколько необычна.
theological_decisions:
- issue: Обращение к Богу во втором лице
  choice: Ты с прописной буквы
  alternative: ты со строчной буквы
  rationale: Прописная буква соответствует принятому русскому библейскому регистру и не добавляет конфессионально специфического содержания.
translation_notes:
  register: Современный литературный русский с достоинством библейской молитвенной речи. Сирийское указательное наречие «там» после относительной конструкции не воспроизведено, поскольку сочетание «где… там» здесь было бы по-русски избыточным. Необычное выражение «пещера земли» сохранено ради близости к источнику.
