translation:
  language: ru
  text: Ибо дух человека — правитель мира, однако люди не знают, что ему принадлежит.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «Множество мира — дух человека, однако люди не знают, что ему принадлежит».'
    reason: Сохраняет засвидетельствованное альтернативное понимание неясной сирийской формулировки, ранее отражённое в переводческой традиции проекта.
lexical_decisions:
- source_word: ܪܘܚ
  choice: дух
  rationale: Основное значение сирийского слова; сохраняет антропологическую формулировку без истолкования как «душа» или «разум».
- source_word: ܡܕܒܪܢܘܬܐ / ܡܕܒܪܢܐ (предполагаемая основа чтения, отражённого в контрольном переводе)
  choice: правитель
  rationale: Передаёт значение управления и владычества естественнее, чем канцелярское «управитель» или современное «администратор».
- source_word: ܕܝܠܗ
  choice: что ему принадлежит
  rationale: Сохраняет широкое и неоднозначное значение принадлежности, не уточняя, идёт ли речь о владении, уделе или сфере власти.
theological_decisions:
- issue: Степень власти человеческого духа над миром
  choice: «правитель мира»
  alternative: «управитель мира» / «распорядитель мира»
  rationale: Формулировка сохраняет сильное утверждение текста о власти, не добавляя учения о её происхождении, абсолютности или отношении к Божьему владычеству.
- issue: Референт субъекта незнания
  choice: «люди не знают»
  alternative: «они не знают»
  rationale: В русском изолированном стихе местоимение «они» не имеет ясного антецедента; экспликация «люди» соответствует английскому контрольному слою и не отождествляет незнание с самим духом.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным синтаксисом. Тире оформляет именную связку; «однако» сохраняет смысловое напряжение второй части. Из-за повреждённого и пересекающего границы страниц сирийского материала перевод опирается на доступное исходное свидетельство в сопоставлении с аудированным английским контрольным слоем, а подлинная лексико-синтаксическая неоднозначность отмечена сноской.
