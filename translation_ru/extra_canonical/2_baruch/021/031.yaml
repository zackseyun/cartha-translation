  terminology: «Дух человека» — корректный и терминологически нейтральный выбор. «Правитель мира» намеренно сильнее, чем «администратор», но соответствует утверждённому английскому audit trail («ruler of the world»); он не добавляет утверждений о независимом или абсолютном владычестве человека. Сноска надлежащим образом отмечает альтернативное, существенно менее ясное понимание спорной формулы.
