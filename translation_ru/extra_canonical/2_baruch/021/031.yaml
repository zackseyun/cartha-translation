  source_fidelity: 'Доступный сирийский фрагмент в предоставленном page-bucket не позволяет надёжно локализовать именно ст. 21:31; поэтому прямое пословное подтверждение ограничено. Основной текст точно следует английскому контрольному чтению: «дух человека» передаёт ܪܘܚ в антропологическом смысле, «правитель мира» соответствует принятому в аудиторской цепочке пониманию управительно-властной формулы, а «что ему принадлежит» сохраняет широкую референцию без догматического уточнения.'
