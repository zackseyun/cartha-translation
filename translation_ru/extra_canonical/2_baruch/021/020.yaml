  text: And I saw that, because of one man, those who live came to be, and also the dwelling place of those who are to come.
translation:
  language: ru
  text: И я увидел, что из-за одного человека появились живущие, а также жилище тех, кому предстоит прийти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܙܝܬ
  choice: я увидел
  rationale: Передаёт форму глагола видения прямо и естественно для молитвенно-пророческого контекста.
- source_word: ܡܛܠ ... ܚܕ
  choice: ради одного человека
  rationale: Сохраняет причинно-целевой оттенок выражения и не уточняет личность этого человека сверх текста.
- source_word: живущие (по контексту контрольного чтения)
  choice: живущие
  rationale: Сохраняет субстантивированное обозначение тех, кто живёт, не заменяя его более узким словом «люди».
- source_word: dwelling place / соответствующее сирийское обозначение обиталища
  choice: жилище
  rationale: Естественное русское слово для места пребывания; оно не вносит уточнения о земле, мире или небесной обители.
- source_word: те, кому предстоит прийти
  choice: тех, кому предстоит прийти
  rationale: Сохраняет будущую направленность и намеренно не определяет, идёт ли речь о будущих поколениях или иной группе.
theological_decisions:
- issue: Кого обозначает «один человек»
  choice: 'Оставить без отождествления: «одного человека»'
  alternative: Назвать Адама, Мессию или другую конкретную фигуру
  rationale: Сам стих в предоставленном чтении не называет этого человека, поэтому перевод не должен разрешать богословскую неоднозначность.
- issue: Значение «тех, кому предстоит прийти»
  choice: Сохранить широкую формулировку
  alternative: Перевести как «будущие поколения»
  rationale: Более конкретный вариант сужает возможный смысл и устраняет присущую тексту открытость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сохраняет две параллельные части исходного высказывания; богословски значимые референты не конкретизируются.
