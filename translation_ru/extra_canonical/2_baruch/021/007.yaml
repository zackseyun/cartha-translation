translation:
  language: ru
  text: И Ты знаешь число тех, кто уходит[a], и тех, кто остаётся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «проходит»; возможно также: «уходит из жизни».'
    reason: Сирийское слово может обозначать прохождение, уход или кончину; примечание сохраняет его смысловую широту.
lexical_decisions:
- source_word: ܝܕܥ ܐܢܬ (ydaʿ ant)
  choice: Ты знаешь
  rationale: Передаёт явное местоимение второго лица и глагол «знать»; заглавная буква указывает на обращение к Богу в контексте молитвы.
- source_word: ܡܢܝܢܐ (menyānā)
  choice: число
  rationale: Прямой и естественный эквивалент существительного со значением «число, количество».
- source_word: ܕܥܒܪܢ (d-ʿābrān)
  choice: тех, кто уходит
  rationale: Сохраняет образ прохождения или ухода и не сводит выражение однозначно только к физической смерти.
- source_word: ܘܕܡܩܘܝܢ (w-d-maqwayn)
  choice: и тех, кто остаётся
  rationale: Передаёт контраст с уходящими и параллельное построение сирийского текста.
theological_decisions:
- issue: Относится ли «уходят» именно к умирающим
  choice: Сохранено более широкое «уходит»
  alternative: «умирает» или «уходит из жизни»
  rationale: Сирийский корень допускает значения прохождения, ухода и исчезновения; прямое указание на смерть сузило бы возможный смысл.
translation_notes:
  register: Современный литературный русский язык с молитвенно-библейской сдержанностью. Союз «И» сохранён; параллелизм двух групп воспроизведён без добавочного толкования.
