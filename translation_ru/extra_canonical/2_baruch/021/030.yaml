  text: so that man's ruin may not again appear as if man had not been created.
translation:
  language: ru
  text: чтобы гибель человека вновь не казалась такой, словно человек вовсе не был сотворён.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܚܒܠܐ / ܡܬܚܒܠܘܬܐ
  choice: гибель
  rationale: Сирийский корень ܚܒܠ выражает разрушение, порчу или погибель; в данном контексте «гибель» естественно передаёт участь человека, не сужая смысл до одной только физической смерти.
- source_word: ܡܬܚܙܐ
  choice: казалась
  rationale: Форма обозначает явление или видимость («показываться, казаться»); русское «казалась такой, словно» ясно и естественно передаёт сравнительную конструкцию.
- source_word: ܒܪܝ / ܐܬܒܪܝ
  choice: был сотворён
  rationale: Сохраняется богословски значимое указание на сотворение человека, а не нейтральное «появился» или «родился».
theological_decisions:
- issue: Связь гибели человека с его сотворением
  choice: 'Сохранена парадоксальная формулировка: гибель может казаться равнозначной тому, будто человек вообще не был сотворён.'
  alternative: Перефразировать как утверждение о тщетности сотворения человека.
  rationale: Текст выражает сравнение посредством «словно», а не прямо утверждает, что сотворение было тщетным; перевод не должен разрешать эту напряжённость.
translation_notes:
  register: Современный литературный русский язык; придаточная конструкция сохранена, но синтаксис сделан естественным. Частица «вовсе» подчёркивает ирреальность сравнения, не превращая его в прямое утверждение.
