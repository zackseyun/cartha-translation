  text: And I went away from there and sat in the valley of Kidron, in a cave of the earth. And I sanctified my soul there. I ate no bread, yet I was not hungry; and I drank no water, yet I was not thirsty. And I remained there until the seventh day, as he had commanded me.
translation:
  language: ru
  text: '1 И сказал я оттуда: «Горе моему сердцу, стеснённому у источника скорби![a]»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В предоставленном сирийском издании Ceriani глава 21 начинается здесь, с молитвы Варуха. В некоторых системах нумерации к 21:1 относят предшествующий рассказ о его уединении и посте.
    reason: Текстологически значимое расхождение между первичным сирийским источником и предоставленным английским консультационным слоем.
lexical_decisions:
- source_word: ܘܐܡܪܬ ܡܢ ܬܡܢ
  choice: И сказал я оттуда
  rationale: Сохранены исходные лицо, последовательность повествования и пространственное наречие; перестановка слов соответствует естественному русскому порядку.
- source_word: ܘܝܠܗ ܠܒܒܝ
  choice: Горе моему сердцу
  rationale: Междометие плача передано прямо и торжественно, без ослабления образа сердца как средоточия страдания.
- source_word: ܕܡܨܪ
  choice: оно терзается
  rationale: Передаёт состояние тесноты, мучения и скорби естественным современным русским глаголом, не сводя выражение к одному лишь физическому повреждению.
- source_word: ܒܡܒܘܥܐ ܕܐܒܠܐ
  choice: у источника скорби
  rationale: Сохраняет конкретную метафору источника и траурно-скорбный смысл ܐܒܠܐ; «скорбь» здесь звучит естественнее, чем более обрядовое «плач».
theological_decisions:
- issue: Характер плача Варуха
  choice: Сохранить образ сердца, терзающегося у «источника скорби»
  alternative: 'Передать описательно: «моё сердце исполнено печали»'
  rationale: Исходный текст использует насыщенную поэтическую метафору; её не следует превращать в отвлечённое психологическое утверждение.
- issue: Граница и нумерация стиха
  choice: Следовать сирийскому тексту Ceriani, где глава 21 начинается словами ܘܐܡܪܬ ܡܢ ܬܡܢ
  alternative: Следовать английскому консультационному слою, относящему к 21:1 предшествующий рассказ об удалении, посте и седьмом дне
  rationale: Первичным основанием перевода является оригинальноязычное свидетельство. В предоставленном издании номер главы 21 непосредственно стоит перед началом молитвы, поэтому английская разбивка отражает иную или ошибочно смещённую систему нумерации.
translation_notes:
  register: Современный литературный русский с достоинством молитвенного плача. Сохранена яркая исходная метафора, но синтаксис сделан естественным для обычного читателя.
