  philosophy: optimal-equivalence
lexical_decisions:
- source_word: '[соответствующее сирийское выражение в представленном фрагменте повреждено или неразборчиво]'
  choice: то, что сохранено
  rationale: Передаёт значение сохранности без уточнения, кем или каким образом нечто сохраняется.
- source_word: '[выражение со значением «остаётся»]'
  choice: остаётся
  rationale: Сохраняет простую аспектуальную связь исходного высказывания.
- source_word: '[выражение со значением «делается новым / обновляется»]'
  choice: то, что обновляется
  rationale: Возвратная форма сохраняет неопределённость относительно действующего лица и естественно звучит по-русски.
theological_decisions:
- issue: Кто сохраняет и кто обновляет
  choice: Не называть действующее лицо
  alternative: «то, что Бог сохраняет… то, что Он обновляет»
  rationale: В доступном свидетельстве субъект прямо не указан; его богословское уточнение было бы интерпретационным добавлением.
- issue: Характер обновления
  choice: «обновляется»
  alternative: «создаётся заново»
  rationale: «Обновляется» сохраняет возможную идею преображения существующего, не сводя её к новому творению из ничего.
translation_notes:
  register: Краткая, ритмически уравновешенная фраза в современном литературном русском. Формулировка намеренно сохраняет пассивность и смысловую открытость исходного высказывания.
