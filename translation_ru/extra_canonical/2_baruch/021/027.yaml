review_pass:
  verdict: revise
  source_fidelity: Доступный сирийский фрагмент для данного стиха повреждён/не локализуется надёжно в предоставленной странице, поэтому проверка опирается также на английскую контрольную формулировку. «То, что обновляется» означает процесс обновления уже существующего объекта и не вполне передаёт «what is made new», то есть появление/становление нового без указанного деятеля.
  naturalness: Фраза в целом понятна, но начальное «А» без контекста менее нейтрально, чем «И». Исправленная конструкция сохраняет краткость и литературную ясность.
  terminology: «Сохранено» удачно передаёт сохранность без добавления субъекта. «Становится новым» не навязывает ни творения из ничего, ни конкретного богословского деятеля и точнее, чем «обновляется», сохраняет открытость формулы «made new».
  issues:
  - severity: medium
    issue: «обновляется» сужает значение второй части
    rationale: Возвратный глагол обычно описывает обновление того, что уже существует; английский контрольный текст говорит о том, что делается/становится новым. Следует избежать такого смыслового сужения.
  - severity: low
    issue: Начальное «А»
    rationale: В изолированной стиховой подаче союз «И» более нейтрален и естественно передаёт продолжение рассуждения.
  revised_text: И то, что сохранено, остаётся для того, что становится новым.
  revised_footnotes: []
  revision_rationale: Заменено «обновляется» на «становится новым», чтобы не отождествлять новое с обновлением прежнего и не добавлять субъект действия. «А» заменено на нейтральное «И».
