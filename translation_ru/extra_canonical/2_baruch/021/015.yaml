  text: Ты не повелеваешь дождю и потопу прийти иначе как из-за грешного человека.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܡܠܠ
  choice: повелеваешь
  rationale: Сирийский глагол буквально означает «говорить», но при прямых дополнениях «дождь» и «потоп» обозначает властное речевое действие; «повелеваешь» естественно передаёт этот смысл по-русски, не устраняя буквальный вариант, отмеченный в сноске.
- source_word: ܡܛܠ
  choice: из-за
  rationale: Предлог выражает основание или причину действия; в данном контексте «из-за» точнее и естественнее, чем тематическое «о» или «касательно».
- source_word: ܐܢܫܐ ܡܣܟܠܢܐ
  choice: грешного человека
  rationale: Сочетание обозначает человека, повинного в грехе или проступке; формулировка сохраняет единственное число исходного текста.
theological_decisions:
- issue: Причинная связь между человеческим грехом и дождём/потопом
  choice: иначе как из-за грешного человека
  alternative: кроме как ради грешного человека / говоря о грешном человеке
  rationale: Причинное прочтение согласуется с обычным значением ܡܛܠ и контекстом суда, однако иной оттенок предлога сохраняется в сноске.
translation_notes:
  register: Современный литературный русский язык; молитвенное обращение передано на «Ты». Синтаксис краткий и возвышенный, но понятный обычному читателю.
