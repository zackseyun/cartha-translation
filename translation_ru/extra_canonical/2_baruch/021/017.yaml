  text: Look, for you alone are able to sustain all who are, those who have passed, and those who are to come,
translation:
  language: ru
  text: 'Взгляни: ведь Ты один способен поддерживать всех, кто пред Тобой: тех, кто был, и тех, кто ещё будет.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «нести просьбу тех, кто пред Тобой».'
    reason: Сирийское чтение допускает буквальное понимание, в котором объектом глагола является «просьба/прошение тех, кто пред Тобой».
  - marker: b
    text: 'Или: «и тех, кто был, и тех, кто ещё будет».'
    reason: Две последние группы могут быть присоединены к первой, а не пояснять её.
  - marker: c
    text: 'Или: «нести».'
    reason: Более буквальная передача глагола; в контексте он может означать как несение, так и поддерживание.
lexical_decisions:
- source_word: ܚܘܪ
  choice: Взгляни
  rationale: Императив передан прямо и естественно; он сохраняет молитвенное обращение к Богу.
- source_word: ܐܢܬ ܓܝܪ ܒܠܚܘܕܝܟ
  choice: ведь Ты один
  rationale: Сохраняет эмфатическое указание на исключительную способность Бога.
- source_word: ܡܫܟܚ ܐܢܬ
  choice: Ты … способен
  rationale: Естественная русская передача значения возможности или способности.
- source_word: ܕܬܣܒܪ
  choice: поддерживать
  rationale: По контексту речь идёт не просто о физическом несении, а о поддержании существующих; при этом буквальная возможность «нести» отмечена в сноске.
- source_word: ܐܝܠܝܢ ܕܩܕܡ̈ܝܟ
  choice: всех, кто пред Тобой
  rationale: Сохраняет образное и несколько неоднозначное сирийское выражение, не сводя его без необходимости лишь к «живущим».
theological_decisions:
- issue: Божественное поддержание людей разных времён
  choice: Не уточнять, означает ли «поддерживать» сохранение бытия, попечение или принятие пред Богом.
  alternative: Развернуть как «поддерживать существование всех».
  rationale: Источник допускает более широкое понимание; конкретизация сняла бы подлинную богословскую напряжённость.
- issue: Связь прошедших и грядущих с первой группой
  choice: Представить их как поясняющий ряд после тире.
  alternative: 'Передать отдельными присоединёнными группами: «и тех, кто ушёл, и тех, кто придёт».'
  rationale: Так русский текст остаётся грамматически ясным, а альтернативная синтаксическая связь фиксируется в сноске.
translation_notes:
  register: Современный литературный русский с молитвенно-возвышенным, но понятным строем. Местоимение «Ты» написано с прописной буквы как часть прямого обращения к Богу. Неоднозначность выражения «кто пред Тобой» сохранена и пояснена сноской.
