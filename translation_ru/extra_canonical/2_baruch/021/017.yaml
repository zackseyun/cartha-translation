    issue: «Тех, кто ушёл» интерпретирует прошедшую группу как ушедших/умерших.
    rationale: Английское audit reading «those who have passed» и временной контекст не требуют значения смерти или ухода. «Тех, кто был» сохраняет временную и референциальную неопределённость.
  - severity: low
    issue: «Кому ещё предстоит прийти» конкретизирует будущую группу как предстоящее прибытие.
    rationale: Нейтральное «кто ещё будет» точнее сохраняет общий временной контраст и лучше соответствует параллелизму.
