review_pass:
  verdict: revise
  source_fidelity: Основной текст в целом следует принятому английскому POB, однако «кто ушёл» неоправданно сужает временную категорию «those who have passed» до умерших или ушедших. Сирийское чтение также допускает буквальное понимание «нести просьбу тех, кто пред Тобой»; это следует сохранить как реальную альтернативу в сноске, не выдавая её за однозначный смысл.
  naturalness: Фраза звучит литературно и молитвенно. Замена «кто ушёл» на «кто был» делает временной ряд нейтральнее и параллельнее; «кто ещё будет» естественнее, чем «кому ещё предстоит прийти», поскольку речь может идти о людях будущего вообще, а не о событии их прихода.
  terminology: «Поддерживать» — удачная современная передача в основном тексте; буквальное «нести» уместно оставить в сноске. «Прошение» точно передаёт альтернативное буквальное прочтение сирийской формы.
