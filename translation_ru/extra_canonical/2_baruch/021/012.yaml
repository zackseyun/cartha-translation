  text: For even the former things that have passed away are not distant from you, with all their possessors and their remembrance.
translation:
  language: ru
  text: Ведь и прежнее, что миновало, недалеко от Тебя — вместе со всеми, кому оно принадлежало[a], и памятью о нём.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «со всеми его владельцами». Возможно также: «со всеми, кто был с ним связан».'
    reason: Сирийское слово буквально обозначает господ или владельцев, но в данном контексте точный характер их связи с «прежним» не вполне ясен.
lexical_decisions:
- source_word: ܩܕ̈ܡܝܬܐ
  choice: прежнее
  rationale: Передаёт субстантивированное «прежние вещи / то, что было прежде», не вводя отсутствующего в тексте значения «прегрешения».
- source_word: ܕܫܠܝܢ
  choice: что миновало
  rationale: В контексте речь идёт о прежнем, уже прошедшем; такая формулировка естественна по-русски и сохраняет временной смысл.
- source_word: ܠܝܬ ܠܗܝܢ ܕܒܥܝܕܐ ܡܢܟ
  choice: не далеко от Тебя
  rationale: Сохраняет пространственную метафору недалёкости, выражающую доступность прошлого для Бога.
- source_word: ܡܪ̈ܝܗܝܢ
  choice: всеми, кому оно принадлежало
  rationale: Передаёт буквальный смысл «их господа / владельцы» без криминальной окраски слова «виновники» и звучит естественнее, чем «обладатели прежнего».
- source_word: ܕܘܟܪܢܗܝܢ
  choice: памятью о нём
  rationale: Согласовано с русским собирательным единственным числом «прежнее» и передаёт значение памяти/поминовения.
theological_decisions:
- issue: Отношение Бога к минувшему
  choice: Сохранена формулировка «не далеко от Тебя»
  alternative: «не забыто Тобой»
  rationale: Источник использует образ удалённости, а не прямое утверждение о забывании; буквальный образ сохраняет поэтическое и богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с молитвенно-возвышенным обращением к Богу; местоимение «Тебя» написано с прописной буквы. Синтаксис слегка торжественный, но понятный современному читателю.
