translation:
  language: ru
  text: И только Тебе[a] подобает исследовать начало всего миропорядка.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тебе одному».'
    reason: Допустимая перестановка слов точнее отражает буквальное расположение местоимения и ограничительной частицы в сирийском тексте.
lexical_decisions:
- source_word: ܒܠܚܘܕܝܟ
  choice: только Тебе
  rationale: Передаёт исключительное значение «тебе одному» естественным современным русским оборотом.
- source_word: ܙܕܩܐ
  choice: подобает
  rationale: Сохраняет значение должного и надлежащего, а также возвышенный молитвенный регистр.
- source_word: ܕܬܒܥܝܟ
  choice: исследовать
  rationale: Глагол обозначает разыскание или тщательное выяснение; «исследовать» естественно сочетается с последующим «начало».
- source_word: ܒܪܝܫܘܬܗ
  choice: начало
  rationale: Передаёт идею первоистока или происхождения, не уточняя способ возникновения.
- source_word: ܟܘܠܐ ܕܒ̣ܝܬ
  choice: всего миропорядка
  rationale: В данном космологическом контексте выражение относится к целокупному устроению сущего; «миропорядок» сохраняет эту широту лучше, чем бытовое «порядок».
theological_decisions:
- issue: Исключительность знания и исследования Бога
  choice: «только Тебе подобает»
  alternative: «Тебе одному подобает»
  rationale: Обе формы сохраняют исключительность; основной вариант звучит естественнее по-русски и не приписывает тексту дополнительного учения о природе божественного знания.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Начальное «И» сохранено как связь с предшествующей хвалой. Местоимение «Тебе» написано с прописной буквы как обращение к Богу.
