  yaml_path: translation/extra_canonical/2_baruch/021/019.yaml
  text: Therefore, the one who lives is not gladdened in his life. And I considered the sons of men, and I saw that they were not many and were nothing but the vanity of Adam.
translation:
  language: ru
  text: Поэтому живущий не радуется своей жизни.[a] Я размышлял о сынах человеческих и увидел, что их немного и что они — не что иное, как суета Адама.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «живущий, пока длится его жизнь, не радуется».'
    reason: Сирийское предложное выражение допускает временное прочтение, хотя основной текст передаёт его более естественно для современного русского языка.
lexical_decisions:
- source_word: ܒܚܝܘܗܝ (b-ḥayyawhy)
  choice: своей жизни
  rationale: Предлог допускает значение «в своей жизни» или «своей жизнью»; по-русски «не радуется своей жизни» естественно передаёт обе смысловые стороны без лишнего уточнения.
- source_word: ܠܐ ܐܚܪܢ ܐܠܐ (lā ʾḥrān ʾellā)
  choice: не что иное, как
  rationale: Это идиоматическое ограничительное выражение «ничто иное, кроме», а не указание на «других» людей.
- source_word: ܣܪܝܩܘܬܗ ܕܐܕܡ (srīqūteh d-ʾĀdām)
  choice: суета Адама
  rationale: «Суета» сохраняет широкий смысл пустоты, тщетности и преходящести; имя Адам оставлено как в источнике, без истолковывающего обобщения «человечество».
theological_decisions:
- issue: Смысл выражения «суета Адама»
  choice: Сохранена буквальная и богословски напряжённая формулировка «суета Адама».
  alternative: «тщета человеческого рода»
  rationale: Обобщающий вариант преждевременно истолковал бы Адама как собирательное обозначение человечества и сузил возможную связь с прародителем.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенно-сапиенциальной прозы. Синтаксис сделан ясным, при этом сохранены повтор «и что» и неоднозначный образ «суеты Адама».
