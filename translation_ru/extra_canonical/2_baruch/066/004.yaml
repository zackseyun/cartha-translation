  text: And the workers of magic he burned with fire; and the lying prophets who were leading the people astray, these also he gave over to burning. And the people who had listened to them while they were alive, he cast into the brook.
translation:
  language: ru
  text: Чародеев он сжёг в огне; лжепророков, вводивших народ в заблуждение, он также предал огню. А народ, слушавший их, когда те были живы, он бросил в поток.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܡܩ̈ܢܫܐ
  choice: чародеев
  rationale: По контексту обозначает занимающихся магией; «чародеи» — ясное и достойное современное соответствие без излишне специальной терминологии.
- source_word: ܠܥܝ̈ܒ̣ܝܐ ܕ̈ܕ̈ܠܐ
  choice: лжепророков
  rationale: Передаёт обозначение обманных, ложных пророков естественным русским библейским термином.
- source_word: ܕܡܣܒܝܢ ܗܘܘ ܠܥܡܡ̣ܐ
  choice: которые вводили народ в заблуждение
  rationale: Сохраняет длительный характер действия и его направленность на народ.
- source_word: ܒܢܚܠܐ
  choice: в поток
  rationale: Сирийское слово может обозначать ручей или водный поток; «поток» сохраняет широкое значение и естественно звучит в данном повествовании.
theological_decisions:
- issue: К кому относится выражение о жизни
  choice: «пока они были живы» отнесено к тем, кого народ слушал
  alternative: «при своей жизни» — отнести к самому народу
  rationale: Ближайший контекст и английский контрольный слой поддерживают отнесение к лжепророкам; местоименная формулировка не добавляет богословского толкования.
translation_notes:
  register: Современный литературный русский с возвышенной повествовательной интонацией; сохранены параллелизм, резкость судебных действий и повтор подлежащего «он».
