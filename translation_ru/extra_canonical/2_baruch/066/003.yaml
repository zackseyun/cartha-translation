  yaml_path: translation/extra_canonical/2_baruch/066/003.yaml
  text: And not only did they kill the impious who were living, but they also brought the bones of the dead out from the graves and burned them with fire.
translation:
  language: ru
  text: И они убивали не только живых праведников, но также извлекали из могил кости умерших и сжигали их огнём.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܙܕܝ̈ܩܐ (чтение, искажённое в предоставленной OCR-транскрипции)
  choice: праведников
  rationale: Контекст и различимые элементы сирийского чтения указывают на «праведников», а не на «нечестивых»; это также соответствует описанию злодеяний Амона.
- source_word: ܕܚܝܝܢ ܗܘܘ
  choice: которые были ещё живы
  rationale: Передаёт противопоставление живых праведников умершим, чьи останки были извлечены из могил.
- source_word: ܡܢ ܩܒܪܐ
  choice: из могил
  rationale: Естественное русское выражение для сирийского «из могилы/гробницы» в собирательном контексте.
- source_word: ܒܢܘܪܐ (восстанавливаемое чтение за OCR ܒܙܘܪܐ)
  choice: в огне
  rationale: Соответствует глаголу сожжения и принятому чтению повреждённой/OCR-искажённой строки.
theological_decisions:
- issue: Нравственная характеристика убитых
  choice: праведники
  alternative: нечестивые
  rationale: 'Английский консультационный слой, по-видимому, содержит смысловую ошибку: злодеяние Амона состоит в убийстве праведников. Перевод следует сирийскому источнику, а не исправляет его по английскому тексту.'
- issue: Смена грамматического субъекта
  choice: «он убивал» — «извлекали… и сжигали»
  alternative: унифицировать всё в единственном или множественном числе
  rationale: Сирийский текст переходит от глагола в единственном числе к глаголам во множественном; эта неоднозначная смена сохранена, а не устранена молча.
translation_notes:
  register: Современный литературный русский язык; изложение ясное и сдержанно-достоинственное. «Ещё живы» подчёркивает контраст с умершими, не добавляя конфессионального толкования.
