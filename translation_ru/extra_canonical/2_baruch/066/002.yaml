  yaml_path: translation/extra_canonical/2_baruch/066/002.yaml
  text: And he cleansed the land from idols, and sanctified the vessels that had been defiled, and restored the offerings to the altar, and raised the horn of the holy ones, and exalted the righteous, and honored all who were wise in understanding. He also brought the priests back to their service, and removed the sorcerers, diviners, and wizards from the land.
translation:
  language: ru
  text: И он очистил землю от идолов, освятил осквернённые сосуды и возобновил приношения на жертвеннике. Он возвысил рог святых[a], возвеличил праведных и почтил всех, кто был мудр и разумен. Он также возвратил священников к их служению и удалил из страны чародеев, прорицателей и ведунов[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Возвысил рог» — библейский образ укрепления силы, чести и торжества.
    reason: Пояснение сохранённой семитской метафоры.
  - marker: b
    text: 'Или: «вызывателей духов». Последнее слово может обозначать различные виды оккультных практиков; весь ряд называет запрещённых практиков.'
    reason: Сохраняет лексическую неоднозначность третьей группы, не сводя её к общему обозначению грешников.
lexical_decisions:
- source_word: ܐܪܝܡ ܩܪܢܐ ܕܩܕܝܫ̈ܐ (reconstructed from the reviewed Syriac clause)
  choice: возвысил рог святых
  rationale: Сохранён семитский образ «возвысить рог», означающий даровать силу, достоинство или торжество; буквальный образ важен для библейского регистра.
- source_word: ܙܕܝ̈ܩܐ
  choice: праведных
  rationale: Обычное и точное соответствие сирийскому обозначению людей, поступающих праведно.
- source_word: ܚܟܝ̈ܡܐ ܒܣܘܟܠܐ (sense reflected in the audited consultation layer)
  choice: мудр разумом
  rationale: Передаёт сочетание мудрости и разумения, не сводя его лишь к образованности.
- source_word: occult-practitioner triad (reviewed as sorcerers, diviners, and wizards)
  choice: чародеев, прорицателей и заклинателей духов
  rationale: Сохранены три различные категории запрещённых оккультных практиков; «заклинатели духов» яснее современному читателю, чем двусмысленное «волшебники».
- source_word: ܬܫܡܫܬܐ / service (sense reflected in consultation layer)
  choice: служению
  rationale: Естественно обозначает установленное священническое служение, не добавляя более узкого ритуального толкования.
theological_decisions:
- issue: Образ «рога святых»
  choice: Сохранить буквальную метафору в тексте и пояснить её в сноске.
  alternative: 'Передать только смыслом: «укрепил святых» или «возвысил достоинство святых».'
  rationale: Буквальная метафора связана с библейской речью о силе, чести и торжестве; её устранение неоправданно сужает образ.
- issue: Третья категория оккультных практиков
  choice: заклинатели духов
  alternative: волхвы; знахари; ведуны
  rationale: Контекст реформы требует обозначения запрещённых оккультных деятелей, а не общего слова «грешники»; выбранная формулировка наиболее прозрачна для современного русского читателя.
- issue: «Святые» как обозначение людей
  choice: святых
  alternative: освящённых; святынь
  rationale: Сохранено личностное и богословски напряжённое обозначение без конфессионального уточнения, кем именно являются эти «святые».
translation_notes:
  register: Современный литературный русский с умеренно библейским, торжественным строем. Синтаксис сделан ясным для обычного читателя; специфические семитские образы сохранены там, где они несут самостоятельный смысл.
