  source_fidelity: 'Нужна правка порядка слов в начальном образе: сирийская и английская контрольная традиция определяют увиденные воды как «десятые светлые», а не как светлые воды, увиденные «после этого». Смысл «чистота поколения/эпохи Иосии» и двойное выражение о сердце и душе следует сохранить. Божественный титул не следует заменять словом «царь»: «царь Иудеи» относится к Иосии, тогда как далее подразумевается Могущественный.'
