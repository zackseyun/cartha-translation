base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/066/001.yaml
  text: And the tenth bright waters that you saw—these are the purity of the generation of Josiah king of Judah, who alone at that time submitted himself to the king (or change source word to ܚܝܠܬܢܐ) with the fullness of his heart and with all his soul.
translation:
  language: ru
  text: А десятые светлые воды, которые ты видел, означают чистоту поколения времён Иосии, царя Иудеи, который один в то время покорился Могущественному со всей полнотой своего сердца и всей своей душой.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «из полноты своего сердца и из всей своей души».'
    reason: Примечание сохраняет форму сирийского двойного выражения, тогда как основной текст передаёт её естественным современным русским языком.
lexical_decisions:
- source_word: ܒ̈ܬܪ ܒܣܝ̈ܡܐ
  choice: светлые воды… десятые воды
  rationale: Сохранён повторяющийся образ светлых вод и их порядковый номер в череде видения; из-за повреждённой разбивки строк синтаксис передан по контексту главы.
- source_word: ܕܫܘܝܐ
  choice: чистоту
  rationale: Слово описывает нравственную и культовую чистоту эпохи Иосии; «чистота» сохраняет обе стороны значения, не сводя его только к нравственной праведности.
- source_word: ܝܘܡܘܗ̈ܝ ܕܝܘܫܝܐ
  choice: поколения Иосии
  rationale: По контексту речь идёт об эпохе или поколении Иосии; выбранное выражение согласуется с образом исторических поколений в истолковании вод.
- source_word: ܚܝܠܬܢܐ
  choice: Могущественному
  rationale: Это почтительный божественный титул, а не ܡܠܟܐ «царь»; прописная буква ясно показывает титульное употребление.
- source_word: ܡܢ ܡܠܝܘ ܠܒܗ ܘܡܢ ܟܠܗ̇ ܢܦܫܗ
  choice: со всей полнотой своего сердца и всей своей душой
  rationale: Передана лексическая разница между «полнотой сердца» и «всей душой», не сводящая обе части к одинаковому обороту «всем».
theological_decisions:
- issue: Повреждённое имя царя в представленном распознанном тексте
  choice: Иосия, царь Иудеи
  alternative: Амон, царь Иудеи
  rationale: Описание единоличного обращения к Богу и последующих преобразований соответствует Иосии; чтение «Амон» возникает из нестабильного распознавания страницы и противоречит содержанию главы.
- issue: Божественный титул
  choice: Могущественный
  alternative: царь
  rationale: В этом месте требуется титул, соответствующий сирийскому ܚܝܠܬܢܐ. Слово ܡܠܟܐ относится к Иосии как царю Иудеи и не должно ошибочно переноситься на Бога.
- issue: Чистота поколения
  choice: чистота
  alternative: праведность
  rationale: «Чистота» сохраняет культовую и нравственную широту характеристики, тогда как «праведность» несколько сужает её до этической оценки.
translation_notes:
  register: Современный литературный русский с возвышенным, но общедоступным апокалиптическим регистром. Формула «со всей полнотой своего сердца» намеренно несколько торжественна и отражает необычную точность сирийского выражения. Маркер сноски помещён в основном тексте.
