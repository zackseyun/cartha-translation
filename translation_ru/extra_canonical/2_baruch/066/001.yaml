  terminology: «Иосия, царь Иудеи» и «Могущественный» уместны. «Чистота» допустимо сохраняет культово-нравственную характеристику. Формула «со всей полнотой своего сердца и всей своей душой» верно удерживает различие между полнотой сердца и всей душой.
