base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/080/001.yaml
  text: 'Knowing first what was to happen, that Nebuchadnezzar king of Babylon set it in his heart... But we knew that no command from his mouth would go forth in vain, nor otherwise than he had appointed beforehand. For what had been determined beforehand was shown openly. And it was also revealed to me that angels were engaged against the city: they shook its walls and uprooted them, and the mighty wall with its strong iron corners they cast down. But at that time they hid the holy vessels, so that they might not be seen by the enemies.


    And when they had done these things, then they handed over to the enemies the broken wall, the plundered house, the burned temple, and the people who had been overcome and were being carried away, so that the enemies might not boast and say, ‘We have surrounded even the house of the Most High, and in battle we have thrown it down.’


    They also bound your brothers and led them away to Babylon, and there they made them dwell. But we and our seed were left here, few and small. This is the affliction of the people about which I wrote to you. For you surely know that the humiliation of Zion has weighed heavily upon you, because your knowledge of her was greater than that of the people, since you were those who served there, while we were helping.'
translation:
  language: ru
  text: 'Зная прежде, чему надлежало произойти, — что Навуходоносор, царь Вавилона, положил это в своём сердце…[a] Но мы знали, что ни одно повеление из его уст не выйдет напрасно и что всё будет не иначе, чем он заранее назначил. Ибо то, что было предрешено, явилось открыто. Мне также было открыто, что против города действовали ангелы: они потрясли его стены и вырвали их из основания, а могучую стену с её крепкими железными углами низвергли. Но в то время они скрыли священные сосуды, чтобы враги их не увидели.


    Совершив это, они предали врагам разрушенную стену, разграбленный дом, сожжённый храм и побеждённый народ, который уводили в плен, — чтобы враги не хвалились и не говорили: «Мы окружили даже дом Всевышнего и повергли его в битве».


    Они также связали ваших братьев, увели их в Вавилон и поселили там. А мы и наши потомки остались здесь — малочисленные и слабые. Вот то бедствие народа, о котором я писал вам. Ведь вы хорошо знаете, как тяжко было для вас уничижение Сиона, потому что вы знали его лучше, чем остальной народ: вы служили там, а мы помогали.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно прежнему прочтению: «Итак, братья мои, узнайте прежде, чему надлежало произойти. Навуходоносор, царь Вавилона, положил в своём сердце выступить против города».'
    reason: Прежнее прочтение восполняет повреждённое начало словами, не засвидетельствованными ясно в предоставленном сирийском тексте; вариант отмечен, но не внесён в основной текст.
lexical_decisions:
- source_word: ܡܠܐܟ̈ܐ
  choice: ангелы
  rationale: В апокалиптическом контексте это небесные исполнители суда; «ангелы» точнее передаёт смысл, чем общее «вестники».
- source_word: ܫܘܪ̈ܝܗ̇ / ܫܘܪܝܐ ܕܒܪܝܬܐ
  choice: его стены … могучая стена
  rationale: «Стены» естественно обозначает городские укрепления, а «могучая стена» сохраняет усиленное описание повреждённой строки.
- source_word: ܡܐ ܛܒܝ̈ܢ
  choice: священные сосуды
  rationale: Буквально выражение допускает «драгоценные вещи», однако храмовый контекст указывает на священные сосуды.
- source_word: ܐܫܠܡܘ
  choice: предали
  rationale: Глагол означает передачу во власть другого и сохраняет как повествовательный, так и судебный оттенок.
- source_word: ܚܘܪܐ
  choice: разграбленный дом
  rationale: Текст строки повреждён; в последовательности разрушенной стены, дома и сожжённого храма «разграбленный» наиболее естественно передаёт контекст.
- source_word: ܡܟܝܟ
  choice: уничижение
  rationale: Слово передаёт низведение Сиона и связанный с этим публичный позор; «уничижение» уместно в dignified modern literary register.
theological_decisions:
- issue: Кто в действительности разрушил укрепления города
  choice: До передачи города врагам против него действуют ангелы.
  alternative: Город разрушили только вавилоняне либо ангелы упомянуты метафорически.
  rationale: Сирийский текст прямо называет ангелов и представляет падение города как совершившееся по небесному суду, прежде чем врагам позволено торжествовать.
- issue: Зачем были скрыты храмовые сосуды
  choice: Священные предметы скрыты от врагов в рамках богословской логики повествования.
  alternative: Речь идёт лишь о сокрытии обычных ценностей ради защиты от грабежа.
  rationale: Контекст не позволяет врагам приписать себе победу над тем, что принадлежит Всевышнему, хотя выражение само по себе допускает более общее значение.
- issue: Фрагментарный синтаксис начала стиха
  choice: Сохранена незавершённость фразы с многоточием.
  alternative: Дополнить её словами о братьях и о походе царя против города.
  rationale: Предоставленное сирийское свидетельство испорчено и не содержит надёжного основания для этих дополнений; сглаживание создало бы отсутствующий в источнике текст.
