  naturalness: Русская фраза сама по себе понятна и в целом литературна; «как ныне процветает благополучие народов» несколько тяжеловесно, но это вторично, поскольку не установлено соответствие исходнику.
  terminology: Примечание к «народам» и выбор «пар» могли бы быть приемлемы при подтверждённом исходном тексте, однако в приложенном сирийском фрагменте для них нет проверяемой опоры. Английская аудиторская дорожка также не содержит соответствующего предложения.
