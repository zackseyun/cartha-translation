    rationale: Перевод говорит о нынешнем благополучии нечестивых народов и их уподоблении пару, тогда как представленный источник не содержит этого высказывания или его ключевых слов. Поэтому проверка верности оригиналу невозможна и данный текст нельзя утвердить как 2 Baruch 83:1.
