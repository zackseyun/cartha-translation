  text: And the holy land shall have mercy on its own, and at that time it shall protect its inhabitants.
translation:
  language: ru
  text: И святая земля помилует тех, кто принадлежит ей, и в то время защитит своих жителей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܥܐ ܩܕܝܫܬܐ
  choice: святая земля
  rationale: Сохраняет традиционный библейский оборот и эсхатологическую персонификацию земли.
- source_word: ܬܪܚܡ
  choice: помилует
  rationale: Передаёт деятельное милосердие в торжественном регистре, не сводя значение к чувству жалости.
- source_word: ܕܝܠܗ̇
  choice: тех, кто принадлежит ей
  rationale: Раскрывает сирийский оборот принадлежности естественным современным русским языком и сохраняет связь народа с персонифицированной землёй.
- source_word: ܬܢܛܪ
  choice: защитит
  rationale: Ясно передаёт охрану и сохранение жителей, обещанные в изречении.
theological_decisions:
- issue: Сохранять ли землю как действующий субъект
  choice: святая земля помилует… и… защитит
  alternative: Бог помилует принадлежащих земле и защитит её жителей
  rationale: Традиция текста персонифицирует землю. Прямое сохранение этого образа не вводит в текст не названного в нём субъекта и удерживает связь земли с её народом.
- issue: Как передать отношение земли к «своим»
  choice: тех, кто принадлежит ей
  alternative: своих
  rationale: Развёрнутый оборот устраняет возможную неясность русского субстантивированного «своих», не уточняя сверх источника, о какой именно группе идёт речь.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием. Персонификация святой земли сохранена. Предоставленная страница сирийского корпуса содержит материал предшествующих глав и не включает читаемый текст 71:1; поэтому формулировка опирается на указанное для данного стиха сирийское чтение, подтверждённое контрольной традицией и аудированным консультационным слоем, а не на ошибочно сопоставленный фрагмент страницы.
