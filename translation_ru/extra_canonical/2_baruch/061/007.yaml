base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/061/007.yaml
  text: And the land, because it then received mercy, and because its inhabitants did not sin, was glorified above all lands; and the city Zion then ruled over all lands and regions.
translation:
  language: ru
  text: И земля, поскольку тогда получила милость и поскольку её жители не грешили, была прославлена превыше всех земель; а город Сион тогда владычествовал над всеми землями и областями.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный вариант: «владычествовал над всеми землями».'
    reason: Сохраняет засвидетельствованный более краткий вариант передачи объёма власти Сиона.
lexical_decisions:
- source_word: ܐܪܥܐ (ʾarʿā)
  choice: земля
  rationale: Сохраняет повтор ключевого существительного в обеих частях стиха и естественно передаёт как страну, так и землю в широком смысле.
- source_word: ܫܠܛ (šlṭ), форма со значением владычества
  choice: владычествовал
  rationale: Передаёт реальное господство Сиона над землями и областями, сохраняя возвышенный повествовательный регистр.
- source_word: ܗܝܕܝܢ (hāydēn)
  choice: тогда
  rationale: Сохраняет явное временное указание в исходном свидетельстве, особенно важное во второй части стиха.
- source_word: лексема со значением «быть прославленным»
  choice: была прославлена превыше
  rationale: Сохраняет пассивную конструкцию и сравнительное возвышение земли над всеми прочими землями.
theological_decisions:
- issue: Основание прославления земли
  choice: 'Сохранены две параллельные причины: полученная милость и отсутствие греха у жителей.'
  alternative: Объединить их причинно, представив милость следствием безгрешности.
  rationale: Текст ставит причины рядом и не определяет причинной зависимости между Божьей милостью и поведением жителей.
- issue: Характер власти Сиона
  choice: «владычествовал» без уточнения политического или духовного характера власти
  alternative: «духовно господствовал» или «управлял»
  rationale: Исходное выражение обозначает господство, но не разрешает его характер; конфессиональное уточнение было бы привнесением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повторы «земля/земли» сохранены ради смысловой связи, а временное «тогда» явно передано во второй части.
