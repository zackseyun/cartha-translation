  yaml_path: translation/extra_canonical/2_baruch/061/002.yaml
  text: And at that time there came the building of Zion, and the dedication of the sanctuary, and much blood of the nations who sinned then was shed, and many offerings were offered then at the dedication of the sanctuary.
translation:
  language: ru
  text: И в то время произошло[a] возведение Сиона и освящение святилища; пролилось много крови народов, согрешивших тогда, и при освящении святилища было принесено много жертв.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «наступило».'
    reason: Сохраняет отмеченную контрольным слоем неоднозначность начального глагола, допускающего более буквальное значение прихода или наступления.
lexical_decisions:
- source_word: ܗܘܐ (предполагаемая глагольная форма, отражённая в контрольном переводе)
  choice: произошло
  rationale: Естественно передаёт наступление названных событий и действий, не превращая их в намеренный акт одного явно названного деятеля.
- source_word: «building of Zion» (контрольный слой; соответствующий сирийский фрагмент неразличим в предоставленном диапазоне страниц)
  choice: возведение Сиона
  rationale: «Возведение» в современном русском языке естественно обозначает строительство города или его укреплений и сохраняет торжественный регистр.
- source_word: «dedication of the sanctuary» (контрольный слой)
  choice: освящение святилища
  rationale: Передаёт ритуальное посвящение святилища без привнесения узкоконфессиональной терминологии.
- source_word: «offerings» (контрольный слой)
  choice: жертвы
  rationale: В храмовом контексте «жертвы» точнее и естественнее общего слова «приношения»; формулировка не уточняет их вид сверх доступных данных.
theological_decisions:
- issue: Характер события, выраженного начальным глаголом
  choice: «произошло» с примечанием
  alternative: «пришло» / «наступило»
  rationale: Основной текст должен звучать естественно по-русски, однако примечание сохраняет более буквальную пространственно-временную образность альтернативного чтения.
- issue: Связь пролития крови с грехом народов
  choice: «крови народов, согрешивших тогда»
  alternative: «крови народов, которые тогда согрешили»
  rationale: Сохранена явная связь кровопролития с народами, названными согрешившими, без дополнительных выводов о природе суда или виновности отдельных лиц.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным звучанием. Точка с запятой разделяет храмовые события и их кровавые последствия, не разрывая единого временного контекста. Предоставленный сирийский блок является приблизительно выделенным корпусом главы и не позволяет надёжно локализовать сам стих; поэтому конкретные формулировки стиха сверены прежде всего по аудированному английскому контрольному слою, а неопределённость начального глагола сохранена в примечании.
