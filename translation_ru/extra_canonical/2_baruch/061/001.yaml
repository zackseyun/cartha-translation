  text: And the sixth bright waters that you saw—this is the time in which David and Solomon were born.a
translation:
  language: ru
  text: А шестые светлые воды, которые ты видел, — это время, когда родились Давид и Соломон.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В сирийском буквально: «они — время»; образ множественного числа («воды») сочетается с единственным числом слова «время».'
    reason: Передаёт засвидетельствованную грамматическую особенность без неестественного переноса её в основной русский текст.
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ
  choice: светлые воды
  rationale: Сохраняет образ сияющих, благоприятных вод и их противопоставление тёмным водам, не сводя значение лишь к прозрачности.
- source_word: ܙܒܢܐ
  choice: время
  rationale: Нейтрально и точно обозначает историческую эпоху, связанную с рождением Давида и Соломона.
- source_word: ܐܬܝܠܕܘ
  choice: родились
  rationale: Передаёт прямое значение сирийской формы и естественно согласуется с двумя названными лицами.
theological_decisions:
- issue: Следует ли понимать упоминание Давида и Соломона как прямое описание мессианского царства или как историческую эпоху.
  choice: Историческая эпоха Давида и Соломона, имеющая типологическое значение в последовательности видения.
  alternative: Прямое указание на мессианское царство.
  rationale: В данном стихе шестые светлые воды прямо отождествлены со временем рождения Давида и Соломона; мессианское раскрытие относится к последующей части видения.
translation_notes:
  register: Современный литературный русский язык; образная терминология видения сохранена, синтаксис сделан естественным без устранения засвидетельствованной грамматической неоднозначности.
