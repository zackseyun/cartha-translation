  text: And the judgments of the rulers were then seen to be without deceit, and the righteousness of the commandments of the Mighty One was accomplished in truth.
translation:
  language: ru
  text: И тогда стало видно, что суды правителей оказались чужды обмана, и праведность заповедей Могущественного осуществилась в истине.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܝ̈ܢܐ (dīnē)
  choice: суды
  rationale: Передаёт множественное число сирийского существительного и сохраняет судебно-нормативный смысл, не сужая его до отдельных приговоров.
- source_word: ܫܠܝ̈ܛܢܐ (šallīṭānē)
  choice: правителей
  rationale: Естественное русское обозначение носителей власти; контекст не требует уточнять их как царей, судей или небесные силы.
- source_word: ܚܝܠܬܢܐ (ḥayltānā)
  choice: Могущественного
  rationale: Сохраняет титульное обозначение Бога через идею силы, не подменяя его более конфессионально закреплённым титулом.
- source_word: ܒܩܘܫܬܐ (b-quštā)
  choice: в истине
  rationale: Формально сохраняет абстрактное существительное и возможный оттенок истинности, верности и справедливости, не сводя выражение к наречию «истинно».
theological_decisions:
- issue: Согласование слова «суды» и сказуемого
  choice: 'Множественное число: «суды… лишены»'
  alternative: 'Единственное число: «суд… лишён»'
  rationale: Сирийское ܕܝ̈ܢܐ и относящаяся к нему глагольная форма имеют множественное число; прежний вариант с единственным числом грамматически не поддерживается.
- issue: Исполнение праведности заповедей
  choice: «праведность… исполнилась»
  alternative: «правота… подтвердилась» или «заповеди были праведно исполнены»
  rationale: Сохранена необычная конструкция источника, где субъектом выступает праведность заповедей; её не следует без необходимости рационализировать или переносить действие на самих исполнителей заповедей.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Формулировка сохраняет параллелизм двух частей и богословскую насыщенность исходного высказывания; устаревшая лексика не используется.
