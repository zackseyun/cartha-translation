lexical_decisions:
- source_word: ܚܟܡܬܐ
  choice: мудрость
  rationale: Прямое и естественное соответствие сирийскому слову со значением «мудрость».
- source_word: ܥܘܬܪܐ
  choice: богатство
  rationale: Сохранён образ изобилия, выраженный сирийским существительным «богатство».
- source_word: ܣܘܟܠܬܢܘܬܐ
  choice: разумение
  rationale: Передаёт способность понимать и постигать; в возвышенном библейском регистре звучит естественнее, чем техническое «интеллектуальность».
- source_word: ܟܢܘܫܬܐ / ܟܢܘܫ̈ܬܐ
  choice: собрание / общины
  rationale: Различение единственного и множественного числа сохранено по смысловой структуре стиха; «общины» передаёт собравшиеся сообщества без конфессионального уточнения.
