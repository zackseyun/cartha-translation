lexical_decisions:
- source_word: ܫܪ̈ܝܐ (предполагаемое чтение в данном стихе)
  choice: праздники
  rationale: По контексту и контрольному английскому слою речь идёт о священных праздничных установлениях; «праздники» естественно и понятно передаёт смысл.
- source_word: ܐܬܫܠܡܘ (предполагаемая глагольная форма)
  choice: совершались
  rationale: Сохраняет оттенок исполнения установленного обряда и при этом образует в современном русском естественное сочетание с «праздниками».
- source_word: ܒܛܒܘܬܐ
  choice: в благости
  rationale: Передаёт положительное нравственное качество, не сужая значение до простого «хорошо».
- source_word: ܘܒܚܕܘܬܐ ܣܓܝܐܬܐ
  choice: и великой радости
  rationale: Формально и естественно передаёт усиленное выражение «с большой/великой радостью».
theological_decisions:
- issue: Значение глагола при святых праздниках
  choice: совершались
  alternative: исполнялись
  rationale: «Совершались» естественно для богослужебных и праздничных установлений, но примечание сохраняет буквальный оттенок исполнения или осуществления.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Формулировка краткая и ясная; «святые праздники» сохранено без конфессионального уточнения.
