  text: For these are the things that filled this world with evils, and because of these the life of mankind was greatly troubled.[c]
translation:
  language: ru
  text: Ибо всё это наполнило мир злом, и из-за этого жизнь людей была тяжко отягощена.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В предоставленном сирийском фрагменте стих обрывается после слов «ибо они суть…»; его продолжение передано по контрольному тексту данного стиха.
    reason: Обозначает границу непосредственно доступного сирийского свидетельства и основание для передачи окончания стиха.
lexical_decisions:
- source_word: ܗܢܝܢ ܐܢܝܢ ܓܝܪ
  choice: Ибо всё это
  rationale: 'Сирийское выражение буквально указывает на перечисленные выше явления: «ибо они суть…». В русском обобщающее «всё это» естественно связывает стих с предшествующим перечнем.'
- source_word: evils (продолжение стиха в контрольном английском слое; сирийский фрагмент в предоставленной выборке обрывается)
  choice: бедствиями
  rationale: «Бедствия» сохраняет конкретный смысл несчастий и зол, перечисленных в контексте, и звучит естественнее, чем абстрактное «злом» после глагола «наполнило».
- source_word: the life of mankind was greatly troubled (контрольный английский слой)
  choice: жизнь людей стала крайне тягостной
  rationale: Передаёт сильную степень отягчения человеческой жизни без добавления причин или богословского истолкования.
theological_decisions:
- issue: Причинная связь между перечисленными пороками и тягостью человеческой жизни
  choice: 'Сохранена прямая причинная формулировка: «из-за этого»'
  alternative: Смягчить до «при этом» или истолковать как прямое божественное наказание
  rationale: Текст утверждает причинную связь, но сам по себе не уточняет её механизм; перевод не вводит дополнительного учения о воздаянии.
translation_notes:
  register: Современный литературный русский язык; формулировка торжественная, но понятная. Связь с предшествующим перечнем передана оборотом «всё это».
