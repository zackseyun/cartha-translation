  yaml_path: translation/extra_canonical/2_baruch/073/002.yaml
  text: And then healing will descend in dew,[b] and anxiety will be quieted, and misery and disease and groanings will flee from the sons of men; and gladness will be in all the earth.
translation:
  language: ru
  text: И тогда исцеление сойдёт росой,[a] тревога утихнет, а страдание, болезнь и стоны покинут людей; и по всей земле воцарится радость.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сирийский текст в этом месте передан не вполне ясно; возможно также: «исцеление сойдёт, подобно росе».'
    reason: Сохраняет текстовую и синтаксическую неопределённость образа росы, не превращая её в простое сопутствующее обстоятельство.
lexical_decisions:
- source_word: ܒܒܘܣܡܐ / ܛܠܐ (неясно переданный фрагмент)
  choice: исцеление сойдёт с росой
  rationale: Контекст и контрольный английский слой указывают на образ нисходящего исцеления, связанного с росой. Русское «с росой» сохраняет образ и не навязывает точного пространственного отношения, не вполне ясного в дошедшем сирийском тексте.
- source_word: ܢܝܚܐ / ܫܠܝܐ
  choice: тревога утихнет
  rationale: Передаёт состояние беспокойства и последующее успокоение естественным современным русским языком.
- source_word: ܕܘܝܐ ܘܟܘܪܗܢܐ ܘܐܢܚ̈ܬܐ
  choice: страдание, болезнь и стоны
  rationale: 'Сохраняет трёхчленное перечисление: бедствие или мучение, болезнь и вздохи/стоны.'
- source_word: ܒܢܝܢܫ̈ܐ
  choice: людей
  rationale: Идиома буквально означает «сынов человеческих», но в современном русском повествовании естественно обозначает человечество словом «людей».
- source_word: ܚܕܘܬܐ
  choice: радость
  rationale: Прямое и стилистически уместное соответствие.
theological_decisions:
- issue: Характер обещанного исцеления
  choice: Оставлено обобщённое «исцеление»
  alternative: «духовное исцеление» или «телесное исцеление»
  rationale: Источник не ограничивает исцеление одной сферой; контекст включает и болезнь, и страдание, и всеобщую радость.
- issue: Образ росы
  choice: Сохранён как образ, связанный с нисхождением исцеления
  alternative: Устранить образ и перевести просто «наступит исцеление»
  rationale: Метафора присутствует в текстовой традиции и несёт смысл мягкого, животворящего нисхождения.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим звучанием. «Воцарится радость» естественно передаёт всеохватное утверждение «радость будет по всей земле», не вводя конфессиональной терминологии.
