lexical_decisions:
- source_word: ܘܬܘܒ ܠܐ ܢܡܘܬ ܕܠܐ ܒܙܒܢܗ
  choice: И никто больше не умрёт прежде своего срока
  rationale: Сирийское выражение буквально связывает смерть с тем, что происходит «не в своё время»; естественная русская передача — «прежде своего срока».
- source_word: ܡܕܡ ܡܥܝܩ
  choice: никакая беда
  rationale: Сочетание обозначает нечто тягостное, причиняющее бедствие; «беда» сохраняет широкий смысл и звучит естественно.
- source_word: ܢܓܕܫ ... ܡܕܡ
  choice: не постигнет внезапно
  rationale: Глагол передаёт событие, которое случается или постигает человека; наречный элемент в повреждённом/неясном чтении по контексту соответствует внезапности.
theological_decisions:
- issue: Характер обещания о смерти и бедствии
  choice: Сохранено прямое всеобщее утверждение в будущем времени
  alternative: Ослабить до пожелания или общей надежды
  rationale: Сирийский текст формулирует обещание категорически; перевод не уточняет его временные или богословские рамки сверх контекста главы.
