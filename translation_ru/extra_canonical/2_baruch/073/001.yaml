base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/073/001.yaml
  text: And it shall be, after he has brought low all that is in the world, and has sat down in peace forever on the throne of his kingdom, then joy will be revealed, and rest will appear.[a]
translation:
  language: ru
  text: 'И будет: когда он смирит всё, что есть в мире, и воссядет в мире на престоле своего царства навеки, тогда откроется радость и явится покой.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В сирийском тексте «в мире» и «покой» переданы разными словами; первое относится к мирному состоянию царствования, второе — к покою, который явится.
    reason: Сохраняет якорь и поясняет различие двух параллельных образов без добавления толкования.
lexical_decisions:
- source_word: ܡܟܟ
  choice: смирит
  rationale: Передаёт каузативный смысл «сделает низким, покорит», не уточняя насильственный или судебный характер действия.
- source_word: ܒܫܠܡܐ
  choice: в мире
  rationale: Естественно передаёт состояние мира и невозмутимости при воцарении; отличается по смыслу от следующего «покоя».
- source_word: ܠܥܠܡ
  choice: навеки
  rationale: В данном эсхатологическом контексте обозначает непреходящую длительность царствования.
- source_word: ܚܕܘܬܐ
  choice: радость
  rationale: Прямое и общепонятное соответствие сирийскому слову.
- source_word: ܢܝܚܐ
  choice: покой
  rationale: Сохраняет самостоятельный образ покоя наряду с открывающейся радостью.
theological_decisions:
- issue: Лицо мессианского правителя
  choice: местоимение «он» со строчной буквы
  alternative: «Он» с прописной буквы
  rationale: Контекст указывает на Мессию, однако в самом стихе употреблено местоимение; строчная буква не вносит дополнительного конфессионального оформления.
- issue: Длительность пребывания на престоле
  choice: «навеки»
  alternative: «на век» / «вовеки»
  rationale: Передаёт эсхатологическую непреходящесть, не вводя дополнительных утверждений о природе царства.
translation_notes:
  register: Современный литературный русский с торжественным, но ясным библейским ритмом. Конструкция «И будет» сохранена как формула пророческого перехода; «воссядет» уместно передаёт царское воцарение.
