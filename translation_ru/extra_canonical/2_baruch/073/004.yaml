  yaml_path: translation/extra_canonical/2_baruch/073/004.yaml
  text: And judgments, and accusations, and contentions, and retaliations, and bloodshed, and cravings, and envy, and hatred, and everything like these will pass away into condemnation when they are removed.
translation:
  language: ru
  text: И суды, и обвинения, и распри, и взыскания, и кровопролитие, и желания, и зависть, и ненависть, и всё им подобное будут отнесены к осуждению, когда будут удалены.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будут вознесены (или отнесены) к осуждению, когда будут убраны (или унесены)». Синтаксическая связь двух глаголов и точный оттенок первого из них в сирийском тексте не вполне ясны.'
    reason: Примечание сохраняет реальную неоднозначность заключительного сирийского оборота и объясняет необычную формулировку перевода.
lexical_decisions:
- source_word: ܕ̈ܝܢܐ
  choice: суды
  rationale: Сохраняет юридический смысл сирийского множественного числа и не уточняет, имеются ли в виду судебные разбирательства или приговоры.
- source_word: ܡܕ̈ܝܢܝܘܬܐ
  choice: обвинения
  rationale: В данном перечне общественных зол слово обозначает судебные обвинения или тяжбы; выбран вариант, соответствующий контексту и древней переводческой традиции.
- source_word: ܚܪ̈ܝܢܐ
  choice: распри
  rationale: Передаёт ссоры и противоборство, сохраняя отличие от юридических обвинений.
- source_word: ܬܒ̈ܥܬܐ
  choice: возмездие
  rationale: Слово связано с взысканием и требованием расплаты; в контексте цепочки вражды естественно передаётся как возмездие.
- source_word: ܕܡܐ
  choice: кровопролитие
  rationale: Буквально «кровь», но в перечне насилия метонимически означает пролитие крови.
- source_word: ܪ̈ܓܝܓܬܐ
  choice: страсти
  rationale: Передаёт сильные, нравственно разрушительные желания, не сужая значение до одного конкретного вида влечения.
- source_word: ܚܣܡܐ
  choice: зависть
  rationale: Обычное значение слова в данном отрицательном нравственном контексте.
- source_word: ܣܢܐܬܐ
  choice: ненависть
  rationale: Прямой современный русский эквивалент.
- source_word: ܠܚܘܝܒܐ
  choice: в осуждение
  rationale: Сохраняет направительную конструкцию оригинала и её несколько необычную образность.
theological_decisions:
- issue: Связь устранения зол с их осуждением
  choice: «когда будет устранено, уйдёт в осуждение»
  alternative: «будет устранено как осуждённое»
  rationale: Сирийский текст ставит рядом отдельные выражения движения/перехода к осуждению и удаления. Перевод не превращает их без достаточных оснований в причинно-следующее толкование.
translation_notes:
  register: Современный литературный русский язык с торжественным ритмом перечисления. Повтор союза «и» отражает структуру сирийского текста; итоговое «всё подобное этому» позволяет естественно согласовать длинный разнородный ряд.
