revisions:
- from: И суды, и обвинения, и распри, и возмездие, и кровопролитие, и страсти, и зависть, и ненависть — всё подобное этому, когда будет устранено, уйдёт в осуждение.[a]
  to: И суды, и обвинения, и распри, и взыскания, и кровопролитие, и желания, и зависть, и ненависть, и всё им подобное будут отнесены к осуждению, когда будут удалены.[a]
  rationale: Исправлены «возмездие» на более точное «взыскания» и «страсти» на более широкое «желания». Заключительная фраза приведена к множественному числу и к более близкой исходнику последовательности двух пассивных действий; примечание уточнено без догматического истолкования.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T21:08:27Z'
review_pass:
  verdict: revise
  source_fidelity: 'Перечень в целом передан близко к сирийскому тексту: «суды/судебные дела», обвинения, распри, взыскания, кровь, желания, зависть и ненависть. Однако ܬܒ̈ܥܬܐ точнее означает «требования, взыскания, притязания», а не «возмездие». Финальный оборот ܠܚܘܝܒܐ ܢܬ̈ܪܝܡܢ ܟܕ ܢܫ̈ܬܩܠܢ буквально сочетает «будут вознесены/отнесены к осуждению» с «когда будут убраны/унесены»; его неоднозначность следует сохранить, не превращая удаление в ясное условие.'
  naturalness: Текст читается естественно, но согласование «всё подобное этому, когда будет устранено, уйдёт» несколько тяжеловесно и создаёт ненужную синтаксическую определённость. «Всё подобное этому» лучше заменить литературным «и всё им подобное», а финальную конструкцию передать ближе к форме оригинала.
  terminology: «Обвинения», «распри», «кровопролитие», «зависть» и «ненависть» уместны. Для ܪ̈ܓܝܓܬܐ предпочтительнее «желания» или «вожделения»; «желания» сохраняет широту слова. «Взыскания» точнее «возмездия» для ܬܒ̈ܥܬܐ и не приписывает личную месть.
  issues:
  - severity: medium
    issue: ܬܒ̈ܥܬܐ передано как «возмездие».
    rationale: Слово обозначает требования, претензии или взыскания; «возмездие» сдвигает смысл к наказанию либо ответной мести.
  - severity: medium
    issue: Финальный оборот чрезмерно нормализован как «когда будет устранено, уйдёт в осуждение».
    rationale: 'В сирийском стоят два пассивных глагола, относящиеся к перечисленным явлениям: «будут отнесены/вознесены к осуждению, когда будут удалены». Следует сохранить множественное число и не делать связь между действиями более прозрачной, чем в источнике.'
  - severity: low
    issue: «Страсти» сужает ܪ̈ܓܝܓܬܐ.
    rationale: Более общее «желания» точнее сохраняет значение слова в перечне пороков.
