    ܡܬܒܥܝܢ ܕܒܥ̈ܝܟܝ ܥܡܠܐ

    ܕܛܒܬܐ. ܐܠܐ ܡܢܘ ܡܪܝܐ

    ܡܢܝ ܡܕܡ ܠܘ ܠܝܕܝܥܘ.

    ܐܘ ܡܢܘ ܡܟܡܟ ܠܡܘܟܡܘ

    ܕܐܘܪܚܟ. ܐܘ ܡܢܘ

    ܡܫܟܚ ܠܐ ܝܘܠܦܢܘ

    ܕܡܠܟܟ. ܐܘ ܡܢܘ ܡܫܟܚ

    ܡܫܟܚ ܠܐ ܬܪܥܝܬܟ

    ܕܠܐ ܡܬܕܪܟܐ. ܐܘ ܡܢܘ

