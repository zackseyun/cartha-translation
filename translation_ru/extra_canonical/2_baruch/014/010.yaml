    ܡܢܐ ܝܬܝܪ ܗ̇ܢܘܢ ܕܝܕܥܘ

    ܩܕܡܝܟ ܘܠܐ ܐܢܛܪܘ

    ܀ ܒܣ

    ܀ܝ܀ ܗܘܘ. ܘܐܬܚܙܝܘ ܠܝ

    ܐܦܝܟ. ܘܐܘ ܐܬܚܫܒܬ.

    ܘܐܦܠܐ ܡܟܝܟܘܬܗܘܢ

    ܢܚܙܘ ܐܠܐ ܨܒܝܢܝ. ܘܠܐ

    ܐܚܙܐ ܙܥܘܪܘ ܡܘܠܕܟܘܢ

    ܗܘܐ ܠܘܬ ܠܒܝܟܘܢ

    ܕܡܬܒܥܝܢ. ܕܐܝܠܝܢ ܕܦܠܚܘ

