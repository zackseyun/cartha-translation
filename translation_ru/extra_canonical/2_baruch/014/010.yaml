lexical_decisions:
- source_word: ܗܒܠܐ
  choice: дыханию
  rationale: Сирийское слово обозначает дыхание, дуновение или нечто мимолётное. «Дыхание» естественно передаёт образ краткости и непрочности человеческой жизни, не сводя его лишь к отвлечённой «тщете».
theological_decisions:
- issue: Обобщение человеческой бренности
  choice: «все мы»
  alternative: «все люди»
  rationale: Сохранена включающая форма первого лица, соответствующая молитвенному контексту и не превращающая высказывание в отстранённое суждение о человечестве.
translation_notes:
