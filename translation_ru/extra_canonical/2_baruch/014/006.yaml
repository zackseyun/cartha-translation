translation:
  language: ru
  text: И для кого искали добрых дел[a][c], и для кого были даны пророки[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «труд добра».'
    reason: Сохраняет более буквальную передачу выражения ܥܡܠܐ ܕܛܒܬܐ.
  - marker: b
    text: 'Буквально: «нашлись» или «оказались».'
    reason: Отражает прямое значение сирийского глагола, переданного в основном тексте контекстуально как «были даны».
  - marker: c
    text: 'Или: «для кого требовался добрый труд».'
    reason: Передаёт возможное единственное число и значение сирийской пассивной формы «требовался / искался».
lexical_decisions:
- source_word: ܡܬܒܥܝܢ
  choice: предназначались
  rationale: Буквально форма может означать «разыскивались / требовались»; в данном риторическом контексте «предназначались» естественно передаёт направленность действия на тех, ради кого были предусмотрены добрые дела, не превращая фразу в неясное «искали добрых дел».
- source_word: ܥܡܠܐ ܕܛܒܬܐ
  choice: добрые дела
  rationale: Буквально возможно «труд добра» или «добрый труд»; множественное «добрые дела» ясно и естественно по-русски и соответствует смыслу английского контрольного слоя.
- source_word: ܢܫܬܟܚ
  choice: были даны
  rationale: Буквально глагол связан со значением «найтись / оказаться»; применительно к пророкам контекстуальное «были даны» выражает их предоставление людям и сохраняет риторический параллелизм.
theological_decisions:
- issue: Божественное назначение добрых дел и дарование пророков
  choice: Сохранить два параллельных вопроса без уточнения, кем именно предназначены дела и даны пророки
  alternative: Явно добавить субъект «Богом»
  rationale: В источнике субъект не назван; его добавление сделало бы подразумеваемую богословскую связь эксплицитной и тем самым сузило бы текст.
translation_notes:
  register: Современный литературный русский язык; риторический параллелизм сохранён. Формулировка возвышенная, но понятная без специальной богословской подготовки.
