  text: Or who can learn your judgment, or search out the depth of your way, or calculate the weight of your path, or comprehend your counsel which cannot be grasped?
translation:
  language: ru
  text: Или кто может познать Твой суд? Или кто может исследовать глубину Твоего пути? Или кто может измерить вес Твоей стези? Или кто может постичь Твой непостижимый замысел?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Последняя часть стиха — «Или кто может постичь Твой непостижимый замысел?» — при ином делении текста может относиться к началу следующего стиха.
    reason: Граница стиха в рукописной последовательности неочевидна; примечание сохраняет возможную вариативность деления на стихи, не исключая засвидетельствованную фразу из перевода.
lexical_decisions:
- source_word: ܕܡܠܟܟ
  choice: Твой суд
  rationale: Передаёт контекстуальное значение Божьего решения или суда; формулировка согласуется с контрольным переводом, хотя сирийское чтение в данном месте текстуально не вполне ясно.
- source_word: ܐܘܪܚܟ
  choice: Твоего пути
  rationale: Прямой и естественный эквивалент образа Божьего пути.
- source_word: ܥܘܡܩܐ (восстанавливаемое контрольным чтением)
  choice: глубину
  rationale: Сохраняет пространственную метафору неисследимости Божьего пути.
- source_word: ܬܘܩܠܐ (восстанавливаемое контрольным чтением)
  choice: вес
  rationale: Сохраняет необычную метафору взвешивания пути, не заменяя её более толковательным выражением.
- source_word: ܬܪܥܝܬܟ
  choice: Твой замысел
  rationale: В контексте означает Божье намерение, совет или промысел; «замысел» наиболее естественно сочетается с определением «непостижимый».
- source_word: ܕܠܐ ܡܬܕܪܟܐ
  choice: непостижимый
  rationale: Кратко и точно выражает то, что невозможно охватить или уразуметь.
theological_decisions:
- issue: Неисследимость Божьего суда, пути и замысла
  choice: Сохранён ряд риторических вопросов и образов без объяснения причин непостижимости
  alternative: Перефразировать как утверждение о человеческой неспособности понять Божий промысел
  rationale: Источник подчёркивает богословское напряжение посредством вопроса и нескольких параллельных метафор; поясняющий пересказ сузил бы смысл.
- issue: Передача ܬܪܥܝܬܟ
  choice: замысел
  alternative: совет
  rationale: «Замысел» в современном русском яснее обозначает Божье намерение, при этом не привносит конфессиональной терминологии.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным синтаксисом. Местоимения, обращённые к Богу, написаны с прописной буквы. Необычный образ «измерить вес Твоей стези» сохранён намеренно как отражение исходной метафоры.
