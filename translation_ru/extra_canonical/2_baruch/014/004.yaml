  source_fidelity: Сирийский риторический вопрос и противопоставление тем, кто знает Бога и не живёт «в суете», остальным народам в целом переданы верно. Однако «что больше приобрели» неестественно передаёт ܡܢܐ ܝܬܝܪ («какое преимущество / что же больше»), а единственное число «не ходил» не согласуется с «те, кто».
