  text: 'But I will speak before you: What more have those who knew you and did not walk in vanity like the rest of the nations gained?'
translation:
  language: ru
  text: 'Но я скажу Тебе: какое же преимущество получили те, кто знал Тебя и не ходил в суете, как остальные народы?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܡܠܠ ܩܕܡܝܟ
  choice: я скажу пред Тобой
  rationale: Сохраняет прямую обращённость речи к Богу и возвышенный, но понятный современному читателю регистр.
- source_word: ܡܢܐ ܝܬܝܪ
  choice: что больше приобрели
  rationale: 'Передаёт сравнительно-вопросительный смысл: какое преимущество или приобретение они получили.'
- source_word: ܝܕܥܘ
  choice: знал Тебя
  rationale: Глагол передан как личное знание Бога, без добавления более узких значений вроде «признавал» или «исповедовал».
- source_word: ܠܐ ܐܢܛܪܘ … ܒܣ
  choice: не ходил в суете
  rationale: Контекст и контрольный перевод поддерживают традиционную формулировку о поведении в суете; русское «ходить» сохраняет библейскую метафору образа жизни.
- source_word: остальные народы (контекстуально восстановленная фраза)
  choice: подобно остальным народам
  rationale: Сохраняет засвидетельствованное уточнение о народах и присоединяет сравнительный оборот к образу жизни в суете.
theological_decisions:
- issue: Как передать преимущество знавших Бога и не живших в суете
  choice: 'Оставить вопрос открытым: «что больше приобрели»'
  alternative: Уточнить ответ или назвать их праведниками
  rationale: Текст выражает богословское напряжение вопросом и сам не даёт в этом стихе явного ответа; добавление оценки разрешило бы его за автора.
- issue: Отношение к «остальным народам»
  choice: Передать прямое сопоставление без характеристики их как язычников
  alternative: «подобно остальным языческим народам»
  rationale: Слово «языческим» внесло бы дополнительную конфессионально-религиозную квалификацию, не необходимую для перевода.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Местоимения в обращении к Богу написаны с прописной буквы. Синтаксис сохранён как единый риторический вопрос; «ходил в суете» оставлено ради исходной метафоры образа жизни.
