  verdict: approve
  source_fidelity: 'Перевод точно передаёт сирийские риторические вопросы: «кто, Господи, знает Твой суд?» соответствует ܡܢܘ ܡܪܝܐ ... ܕܝܢܟ, а «Кто может исследовать глубину Твоего пути?» сохраняет и «глубину» (ܥܘܡܩܐ), и образ «пути» (ܐܘܪܚܟ). Модальное «может» естественно выражает риторически подразумеваемую невозможность исчерпывающего исследования и не добавляет самостоятельного доктринального вывода.'
