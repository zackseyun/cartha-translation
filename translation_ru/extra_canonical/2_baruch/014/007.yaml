translation:
  language: ru
  text: И кто, Господи, знает Твой суд? Кто может исследовать глубину Твоего пути?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܝܢܟ (dīnak)
  choice: Твой суд
  rationale: Передаёт значение «суд, судебное решение»; притяжательный суффикс второго лица сохранён.
- source_word: ܥܘܡܩܐ ܕܐܘܪܚܟ (‘umqā d-’urḥak)
  choice: глубину Твоего пути
  rationale: Сохраняет образ глубины и метафорическое «путь» без истолкования того, идёт ли речь о Божьем замысле, действии или установлении.
- source_word: ܒܨܐ (bṣā)
  choice: исследовать
  rationale: Передаёт действие тщательного разыскания или исследования; в контексте риторического вопроса подразумевается невозможность исчерпывающе постичь Божий путь.
theological_decisions:
- issue: Постижимость Божьего суда и пути
  choice: Сохранены два риторических вопроса без поясняющего богословского вывода.
  alternative: Перевести «кто способен постичь» и тем самым прямо подчеркнуть непостижимость.
  rationale: Исходный текст выражает мысль вопросами; перевод не должен сильнее оригинала формулировать доктрину о непостижимости Бога.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но ясным библейским звучанием. Местоимения, относящиеся к Богу, даны с прописной буквы по принятой русской издательской традиции.
