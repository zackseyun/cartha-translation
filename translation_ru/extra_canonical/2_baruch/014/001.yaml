  text: Then I answered and said, “Behold, you have shown me the course of the times, and what is to happen after these things, and you have told me that the retribution which was spoken of by you will come upon the nations.
translation:
  language: ru
  text: 'Тогда я ответил: «Вот, Ты показал мне ход времён и то, что произойдёт после этих событий, и сказал мне, что воздаяние, изречённое Тобой, постигнет народы».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܘܪܚܐ
  choice: ход
  rationale: В данном апокалиптическом контексте слово обозначает не буквальный путь, а развёртывание и установленный порядок времён; выражение «ход времён» естественно передаёт этот смысл по-русски.
- source_word: ܦܘܪܥܢܐ
  choice: воздаяние
  rationale: Слово несёт судебный смысл отплаты. «Воздаяние» сохраняет этот смысл, не уточняя сверх текста, идёт ли речь исключительно о наказании.
- source_word: ܥܡܡ̈ܐ
  choice: народы
  rationale: Множественное число прямо обозначает народы; дополнение сохранено, поскольку оно существенно для направленности предстоящего воздаяния.
theological_decisions:
- issue: Характер предстоящего воздаяния
  choice: воздаяние
  alternative: наказание
  rationale: Выбрано более широкое судебное слово, сохраняющее идею справедливой отплаты и не сужающее её без достаточных оснований до одного лишь карательного действия.
- issue: Связь воздаяния с прежней речью Бога
  choice: «о котором Ты говорил»
  alternative: «которое было изречено Тобой»
  rationale: Фраза сохраняет указание на то, что это воздаяние уже было возвещено Богом, но звучит естественно в современной русской речи.
translation_notes:
  register: Современный литературный русский язык с достоинством пророческой речи. Обращение к Богу передано местоимениями с прописной буквы. Синтаксис сделан ясным для обычного читателя, при этом сохранены апокалиптические понятия «ход времён» и «воздаяние».
