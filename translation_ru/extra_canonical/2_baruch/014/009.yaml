  text: Or who among mortals can find the beginning and the end of your wisdom?
translation:
  language: ru
  text: И кто из смертных может найти[a] начало и конец Твоей мудрости?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «отыскать».'
    reason: Глагол допускает оттенок обнаружения или разыскания; примечание сохраняет эту смысловую возможность.
lexical_decisions:
- source_word: ܡܫܟܚ
  choice: может найти
  rationale: Основное значение глагола — «находить, обнаруживать»; в сочетании с вопросительным оборотом передано естественной русской конструкцией «может найти».
- source_word: ܫܘܠܡܐ
  choice: конец
  rationale: Слово означает «завершение, конец» и здесь образует смысловую пару с «началом».
- source_word: ܚܟܡܬܟ
  choice: Твоей мудрости
  rationale: Сохранено прямое обращение к Богу; прописная буква соответствует принятому русскому библейскому регистру.
theological_decisions:
- issue: Предел постижения Божьей мудрости смертными
  choice: Сохранён риторический вопрос без поясняющего богословского вывода.
  alternative: 'Передать как прямое утверждение: «Никто из смертных не может постичь…»'
  rationale: Вопросительная форма источника выразительнее и сохраняет заложенное в тексте напряжение между человеческой ограниченностью и Божьей мудростью.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. «Смертных» сохраняет антропологический контраст, а «начало и конец» передаёт меризм без его разъяснения.
