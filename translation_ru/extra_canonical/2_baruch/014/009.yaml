    ܐܦܝܟ. ܘܐܘ ܐܬܚܫܒܬ.

    ܘܐܦܠܐ ܡܟܝܟܘܬܗܘܢ

    ܢܚܙܘ ܐܠܐ ܨܒܝܢܝ. ܘܠܐ

    ܐܚܙܐ ܙܥܘܪܘ ܡܘܠܕܟܘܢ

    ܗܘܐ ܠܘܬ ܠܒܝܟܘܢ

