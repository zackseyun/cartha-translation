  text: Therefore they leave this world without fear, and with trust and gladness they wait to receive the world that you promised them …
translation:
  language: ru
  text: Поэтому они уходят из этого мира без страха и с доверием и радостью ожидают[a], когда получат мир, который Ты им обещал…
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «уверенно и с радостью ожидают».'
    reason: Допустимый вариант передачи наречного выражения, подчёркивающий уверенный характер ожидания.
lexical_decisions:
- source_word: ܬܟܝܠܐܝܬ (reconstructed from the verse tradition; adverbial sense)
  choice: с доверием
  rationale: Передаёт уверенное упование как обстоятельственную характеристику ожидания, не делая саму радость предметом доверия.
- source_word: ܒܚܕܘܬܐ
  choice: с радостью
  rationale: Естественно и точно передаёт сопутствующую ожиданию радость.
- source_word: ܥܠܡܐ
  choice: мир
  rationale: 'Сохраняет повтор ключевого слова: они уходят из этого мира и ожидают обещанного мира; перевод «век» возможен, но здесь менее прозрачен для современного читателя.'
theological_decisions:
- issue: К кому относится доверие
  choice: Не называть объект доверия прямо
  alternative: «доверяя Тебе»
  rationale: В исходной формулировке объект упования подразумевается, но не выражен; добавление «Тебе» неоправданно устранило бы эту формальную неоднозначность.
- issue: Характер обещанного будущего
  choice: «мир, который Ты им обещал»
  alternative: «грядущий век, обещанный Тобой»
  rationale: Перевод сохраняет образ и лексический повтор источника, не вводя более специализированной эсхатологической терминологии.
translation_notes:
  register: Современный литературный русский язык; интонация торжественная, но ясная. Многоточие сохранено, поскольку предоставленный стих и английский контрольный текст обозначают продолжение или лакуну.
