  yaml_path: translation/extra_canonical/2_baruch/014/003.yaml
  text: For what profit is there in this, or what is worse than these things that we have seen, that we should desire to wait to see?
translation:
  language: ru
  text: Ибо какая в этом польза? И что может быть хуже того, что мы видим, чего бедные желают увидеть?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝܘܬܪܢܐ
  choice: польза
  rationale: Обычное значение — «польза, выгода»; оно естественно передаёт риторический вопрос.
- source_word: ܕܒܝܫ
  choice: хуже
  rationale: Сравнительная конструкция с ܡܢ требует значения «хуже, чем».
- source_word: ܡܣܟܢܝܢ
  choice: ждать
  rationale: Глагол допускает оттенки ожидания и надежды; «ждать» сохраняет последовательность желания, ожидания и видения, не сужая смысл до уверенной надежды.
- source_word: ܕܢܚܙܘܢ
  choice: увидеть
  rationale: Инфинитив цели после глагола ожидания естественно передаёт «чтобы увидеть / увидеть».
theological_decisions:
- issue: Неясная связь заключительной цепочки глаголов с уже увиденными бедствиями
  choice: Сохранить напряжённую формулировку «желаем ждать и увидеть»
  alternative: Сгладить как «хотим увидеть, что будет дальше»
  rationale: Сирийский текст соединяет желание, ожидание и видение; добавление «что будет дальше» прояснило бы подразумеваемый объект, которого в тексте прямо нет.
translation_notes:
  register: Современный литературный русский с достоинством риторической молитвенной речи. Частица «ибо» сохраняет связь с предшествующим рассуждением; неоднозначная и несколько шероховатая цепочка глаголов намеренно не заменена пояснительным пересказом.
