review_pass:
  verdict: revise
  source_fidelity: Предоставленный сирийский страничный фрагмент не позволяет надёжно выделить 14:12, поэтому сверка конкретной формулировки ограничена аудированным английским контрольным текстом. В нём присутствуют «праведные», «конец», уход «из этого жилища» без страха и запас/собрание дел, хранимый в сокровищницах. Добавления «добрых» и «небесных» не имеют опоры в контрольной формулировке и сужают либо усиливают образ.
  naturalness: Русский текст в целом литературен. «Вправе надеяться» и «уходят из этого жилища» звучат естественно; перестройка заключительной части делает образ хранения яснее и избегает тяжеловесного «сокровище добрых дел в небесных хранилищах».
  terminology: «Праведные» и «конец» сохранены. «Сокровищницы» точно передаёт образ treasuries, не навязывая конкретную локализацию как «небесные». «Запас дел» передаёт store of works без богословски интерпретирующего эпитета «добрых».
  issues:
  - severity: medium
    issue: Добавлены определения «добрых» и «небесных».
    rationale: Английский контрольный текст говорит о «делах» и «сокровищницах», но не квалифицирует дела как добрые и не называет сокровищницы небесными. Хотя оба уточнения могут казаться контекстуально вероятными, они вносят дополнительную интерпретацию.
  revised_text: Но праведные вправе надеяться на конец и без страха уходят из этого жилища, потому что у Тебя для них в сокровищницах хранится запас дел.
  revised_footnotes: []
  revision_rationale: Убраны неподтверждённые уточнения, при этом сохранены синтаксическая связь надежды с хранимыми у Бога делами, образ сокровищниц и широкое значение слова «конец».
