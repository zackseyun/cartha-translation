  text: But the righteous may rightly hope for the end, and they depart from this dwelling without fear, because they have with you a store of works kept in treasuries.
translation:
  language: ru
  text: Но праведные по праву могут надеяться на конец и без страха покидают это жилище, потому что у Тебя для них хранится сокровище добрых дел в небесных хранилищах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܕܝ̈ܩܐ (контекстуально восстанавливаемое чтение)
  choice: праведные
  rationale: Передаёт этическое и богословское обозначение людей, противопоставленных согрешившим; соответствует контрольному английскому слою.
- source_word: ܣܟܐ / ܫܘܠܡܐ (контекстуально предполагаемое выражение)
  choice: конец
  rationale: Сохраняет эсхатологическую широту понятия и не уточняет без достаточного основания, идёт ли речь исключительно о смерти или о завершении века.
- source_word: ܡܥܡܪܐ (контекстуально предполагаемое чтение)
  choice: это жилище
  rationale: Естественная русская метафора нынешней земной жизни; указательное слово сохраняет противопоставление нынешнего состояния будущему.
- source_word: ܣܝܡܬܐ / ܓܙ̈ܐ (контекстуально предполагаемая лексика)
  choice: сокровище добрых дел в небесных хранилищах
  rationale: Передаёт образ накопленного и сохранённого у Бога достояния. «Добрых» эксплицирует положительный смысл дел, а «небесных» делает понятной отнесённость хранилищ к Богу.
theological_decisions:
- issue: Связь праведности, дел и будущей надежды
  choice: Сохранён образ добрых дел как сокровища, хранимого у Бога.
  alternative: Переформулировать как заслуженную делами награду или, напротив, устранить связь с делами.
  rationale: Текст связывает надежду праведных с хранимыми у Бога делами, но сам по себе не формулирует систематического учения о заслуге; перевод не должен усиливать или ослаблять это напряжение.
- issue: Значение «конца»
  choice: Оставлено общее слово «конец».
  alternative: «смерть», «конец жизни» или «конец века»
  rationale: Так сохраняется возможная двусмысленность между личной смертью и эсхатологическим завершением.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис сделан плавным, а образ жилища и небесных хранилищ сохранён. Поскольку предоставленный сирийский фрагмент представляет собой повреждённый и смещённый страничный корпус, конкретная формулировка стиха опирается также на аудированный английский контрольный слой; спорные элементы не превращены в конфессионально окрашенные утверждения.
