base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/014/011.yaml
  text: 'For as a breath rises without intention and vanishes, so is the nature of men: they do not go by their own will, and they do not know what will happen to them in the end.'
translation:
  language: ru
  text: 'Ибо как дыхание возникает без намерения и исчезает, такова и природа людей: они уходят не по своей воле и не знают, что случится с ними в конце.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܒܠܐ
  choice: дыхание
  rationale: Слово обозначает дыхание, дуновение или пар; «дыхание» естественно передаёт образ чего-то непроизвольно возникающего и быстро исчезающего.
- source_word: ܒܢ̈ܝܢܫܐ
  choice: людей
  rationale: Обобщающее обозначение человеческого рода передано современным нейтральным словом «люди».
- source_word: ܫܘܠܡܐ
  choice: в конце
  rationale: Передаёт конечный исход или завершение, не уточняя, идёт ли речь исключительно о смерти или о более широком окончательном уделе.
theological_decisions:
- issue: Человеческая воля и неизбежность ухода
  choice: «они уходят не по своей воле»
  alternative: «они умирают не по своей воле»
  rationale: Более широкий глагол сохраняет образ и не сужает смысл до явно названной смерти, хотя контекст, вероятно, подразумевает смертность.
- issue: Неопределённость конечного исхода
  choice: «что случится с ними в конце»
  alternative: «каков будет их конечный удел»
  rationale: Выбрана ясная формулировка, сохраняющая неопределённость текста и не вводящая конкретного учения о посмертной участи.
translation_notes:
  register: Современный литературный русский язык; фраза построена торжественно, но без архаизмов. Параллелизм между исчезающим дыханием и зависимостью человеческой жизни сохранён.
