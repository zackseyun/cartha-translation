  text: And now I know that many have sinned and lived, and only a few will remain in those times to whom these words may be spoken.
translation:
  language: ru
  text: И теперь я знаю, что многие согрешили и жили, а в те времена останутся лишь немногие, к которым могут быть обращены эти слова.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܗܫܐ ܝܕܥܬ
  choice: И теперь я знаю
  rationale: Передаёт временное наречие и глагол знания прямо, без прежнего варианта «я сказал в своих мыслях».
- source_word: ܐܝܠܝܢ ܕܚܛܘ ... ܚܝܘ
  choice: многие согрешили и жили
  rationale: Сохраняет параллельные совершенные действия без добавления отсутствующей в данном свидетельстве оценки их благополучия.
- source_word: ܩܠܝܠܝܢ ... ܡܫܬܚܪܝܢ
  choice: останутся лишь немногие
  rationale: Естественно передаёт противопоставление многих и немногих и смысл сохранения остатка.
- source_word: ܒܗܘܢ ܙܒ̈ܢܐ
  choice: в те времена
  rationale: Прямое и естественное соответствие сирийскому временному обороту.
- source_word: ܡ̈ܠܐ
  choice: эти слова
  rationale: Контекстуально указательное «эти» ясно отсылает к словам пророчества и соответствует консультационному английскому слою.
theological_decisions:
- issue: Судьба согрешивших, которые жили
  choice: Не уточнять, что они жили благополучно или избежали суда
  alternative: «согрешили и жили в благополучии»
  rationale: Предоставленное текстовое свидетельство и проверенный консультационный слой не требуют такого уточнения; добавление могло бы преждевременно разрешить смысловую напряжённость.
- issue: Модальность последних слов
  choice: «которым можно будет сказать эти слова»
  alternative: «которым будут сказаны эти слова»
  rationale: Сохранена модальность консультационного перевода без утверждения неизбежности произнесения.
translation_notes:
  register: Современный литературный русский язык; синтаксис ясный и торжественно-сдержанный. Союз «а» подчёркивает исходное противопоставление многих согрешивших и немногих оставшихся.
