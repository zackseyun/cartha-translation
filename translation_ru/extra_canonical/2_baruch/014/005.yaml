  text: who did not seek the vanity of the dead, but desired you, and did not turn their hearts to what is small and passing,
translation:
  language: ru
  text: которые не искали тщеты мёртвых[a], но желали Тебя и не обращали своих сердец к малому и преходящему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не искали мёртвых».'
    reason: Отражает альтернативное понимание сирийского выражения и ранее засвидетельствованный перевод, не устраняя из основного текста существительное со значением тщеты.
lexical_decisions:
- source_word: ܣܪܝܩܘܬܐ ܕܡܝ̈ܬܐ
  choice: тщеты мёртвых
  rationale: Сохраняет выраженный в сирийском существительным смысл пустоты, тщетности или суетности, не сводя фразу просто к поиску мёртвых.
- source_word: ܨܒܝܢܝ
  choice: желали Тебя
  rationale: Передаёт направленное к Богу желание; прописная буква ясно обозначает адресата в молитвенной речи.
- source_word: ܙܥܘܪܘ ... ܥܒܪ
  choice: малому и преходящему
  rationale: Естественно по-русски передаёт противопоставление ничтожного и временного Богу, сохраняя оба смысловых признака.
theological_decisions:
- issue: Объект поиска в первой части стиха
  choice: «тщеты мёртвых» в основном тексте
  alternative: «мёртвых»
  rationale: В источнике засвидетельствовано слово со значением пустоты или тщеты; его нельзя опускать, хотя синтаксис допускает традиционное понимание «искали мёртвых», отмеченное в сноске.
- issue: Объект желания
  choice: «Тебя» с прописной буквы
  alternative: «тебя» со строчной буквы
  rationale: Контекст представляет обращение к Богу; прописная буква соответствует достоинству современной русской молитвенной речи и не добавляет нового богословского содержания.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной молитвенной интонацией. «Тщета» выбрана вместо более разговорной или двусмысленной «суеты»; конструкция остаётся понятной, а богословское напряжение между вечным и преходящим сохранено.
