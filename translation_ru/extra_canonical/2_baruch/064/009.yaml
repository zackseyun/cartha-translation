base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/064/009.yaml
  text: Not because he had lived blamelessly, for he was not worthy, but so that from then on he might know by whom he would finally be punished.
translation:
  language: ru
  text: Не потому, что он жил безупречно, — ведь он не был достоин, — но чтобы с того времени он знал, кем в конце концов будет наказан.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܠܐ
  choice: не потому, что
  rationale: Отрицательная причинная конструкция передана естественным русским оборотом, сохраняющим противопоставление следующему «но чтобы».
- source_word: ܕܡܢ
  choice: кем
  rationale: Вопросительно-относительное обозначение действующего лица сохранено без уточнения его личности.
- source_word: ܠܡܘܒܕܘ
  choice: будет наказан
  rationale: В данном контексте эсхатологического воздаяния русский глагол «наказать» естественнее буквального «погубить», при этом сохраняет направленность действия против виновного.
theological_decisions:
- issue: Основание оказанной ему отсрочки или милости
  choice: Отрицать его безупречность и достоинство, не объясняя, в чём именно он был недостоин
  alternative: 'Уточнить: «он не был достоин милости/избавления»'
  rationale: Исходная формулировка оставляет объект достоинства невыраженным; перевод не должен вводить богословское уточнение.
- issue: Личность будущего карателя
  choice: Сохранить неопределённое «кем»
  alternative: Назвать Бога или иной субъект наказания
  rationale: Текст подчёркивает знание о том, от кого придёт наказание, но в самом стихе не называет этого деятеля прямо.
translation_notes:
  register: Современный литературный русский язык; торжественный, но ясный синтаксис. Вставное пояснение выделено парными тире, а временное выражение передано как «с того времени». Разночтения или пояснения, требующие сноски, не вводились.
