  text: And the impiety of Manasseh grew so great that it removed the glory of the Most High from the sanctuary.
translation:
  language: ru
  text: И нечестие Манассии настолько возросло, что удалило славу Всевышнего из святилища.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «так что слава Всевышнего была удалена из святилища».'
    reason: Сохраняет альтернативную пассивную передачу, не подменяя ею активную грамматику основного текста.
lexical_decisions:
- source_word: ܪܘܫܥܗ ܕܡܢܫܐ
  choice: нечестие Манассии
  rationale: Передаёт нравственно-религиозный смысл сирийского обозначения нечестия и сохраняет прямое указание на Манассию.
- source_word: ܐܣܓܝ
  choice: настолько возросло
  rationale: Выражает усиление и чрезвычайную степень нечестия, естественно связываясь в русском с последующим результатом.
- source_word: ܫܘܒܚܗ ܕܡܪܝܡܐ
  choice: славу Всевышнего
  rationale: «Слава» сохраняет богословски значимое обозначение явленного Божьего присутствия, а «Всевышний» соответствует титулу Бога.
- source_word: ܡܢ ܡܩܕܫܐ
  choice: из святилища
  rationale: «Святилище» точно передаёт культовое священное место без неоправданного уточнения «храм».
theological_decisions:
- issue: Залог глагола при удалении славы
  choice: нечестие… удалило славу
  alternative: слава Всевышнего была удалена
  rationale: Активная форма с существительным женского рода «нечестие» в роли субъекта подчёркивает причинную связь; пассивная возможность сохранена в примечании как засвидетельствованный вариант понимания.
translation_notes:
  register: Современный литературный русский; формулировка ясная и торжественная, без архаизмов. Причинная сила активной конструкции сохранена, а богословская неоднозначность отмечена в сноске.
