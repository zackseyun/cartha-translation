  text: And the ninth black waters that you saw—this is all the wickedness that was in the days of Manasseh son of Hezekiah.
translation:
  language: ru
  text: Девятые чёрные воды, которые ты видел, — это всё нечестие[a], бывшее во дни Манассии, сына Езекии.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «они — всё нечестие».'
    reason: Сохраняет неоднозначность числа указательного оборота при множественном образе вод и единственном собирательном сказуемом.
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟ̈ܡܐ (текстовая формула видения; в представленном OCR искажена)
  choice: чёрные воды
  rationale: Сохраняет устойчивое цветовое противопоставление светлых и чёрных вод в апокалиптическом видении; «тёмные» могло бы ослабить образ конкретного цвета.
- source_word: ܚܒܠܐ
  choice: нечестие
  rationale: В данном объяснении речь идёт прежде всего о нравственном и религиозном зле времён Манассии, а не только о вызванном им разрушении.
- source_word: ܟܠܗ
  choice: всё
  rationale: 'Передаёт явно выраженную в сирийском тексте полноту: «всё нечестие».'
- source_word: ܡܢܫܐ
  choice: Манассия
  rationale: Устоявшаяся русская форма библейского имени царя, сына Езекии.
theological_decisions:
- issue: Характер зла времён Манассии
  choice: всё нечестие
  alternative: вся порочность / всё зло
  rationale: «Нечестие» сохраняет одновременно нравственный и религиозный смысл обвинения, не сводя его ни к абстрактной порочности, ни к последствиям в виде разрушения.
- issue: Число указательного оборота при множественном образе «вод» и единственном обобщающем понятии
  choice: это всё нечестие
  alternative: они — всё нечестие
  rationale: Единственное число естественно согласуется с обобщающим сказуемым и соответствует предпочтительному прочтению сирийского указательного элемента; вариант с множественным числом сохранён в примечании как текстово-грамматическая возможность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Оборот «во дни» сохранён как понятная традиционная формула; синтаксис остаётся ясным для современного читателя.
