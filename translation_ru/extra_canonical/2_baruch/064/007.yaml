  rationale: Прямая передача образа огня без добавочного конфессионального толкования.
theological_decisions:
- issue: Характер огня и конечной участи Манассии
  choice: «в конце его обиталищем стал огонь»
  alternative: «в конце он оказался в адском огне»
  rationale: Текст говорит об огне, но не требует уточнения «адский»; буквальный образ сохраняет богословскую сдержанность и напряжение источника.
