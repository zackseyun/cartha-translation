lexical_decisions:
- source_word: ܡܢܫܐ
  choice: Манассия
  rationale: Передача имени в принятой русской библейской форме.
- source_word: ܪܫܝܥܐ
  choice: нечестивец
  rationale: Сохраняет нравственно-религиозный смысл сирийского обозначения нечестивого человека и естественно звучит в данном именном сказуемом.
- source_word: ܡܥܡܘܪܐ
