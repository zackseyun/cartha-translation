  text: And a decree also went out against the two and a half tribes, that they too should be led away captive, as you have now seen.
translation:
  language: ru
  text: И о двух с половиной коленах также вышло постановление, чтобы и их увели в плен, как ты только что видел.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܪܝܢ ܫܒ̈ܛܝܢ ܘܦܠܓܗ
  choice: два с половиной колена
  rationale: Передаёт традиционное библейское обозначение племенных подразделений Израиля; форма исходного текста буквально указывает на «два колена и половину».
- source_word: ܫܒ̈ܝܐ / контекст пленения
  choice: увели в плен
  rationale: Естественная русская формулировка, сохраняющая значение насильственного переселения в качестве пленников.
- source_word: ܐܝܟ ܕܚܙܝܬ ܗܫܐ
  choice: как ты теперь видел
  rationale: Сохраняет прямое обращение в единственном числе и визионный контекст глагола «видеть».
theological_decisions:
- issue: Характер постановления о пленении
  choice: постановление
  alternative: приговор
  rationale: «Постановление» сохраняет административно-судебную широту выражения и не уточняет без необходимости, кем именно оно вынесено; «приговор» сильнее сужал бы смысл до судебного осуждения.
translation_notes:
  register: Современный литературный русский язык с библейски уместной лексикой. Синтаксис сделан ясным и естественным, без добавления не названного в стихе субъекта постановления.
