  text: Then wrath went out from before the Mighty One, that Zion should be uprooted—as it also happened in your days.
translation:
  language: ru
  text: Тогда от Могущественного изошёл гнев, чтобы Сион был искоренён, как это произошло и в ваши дни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪܘܓܙܐ
  choice: гнев
  rationale: Прямое и естественное соответствие сирийскому слову со значением «гнев, ярость».
- source_word: ܡܢ ܩܕܡ
  choice: от
  rationale: Идиома буквально означает «от лица / из присутствия»; краткое «от» естественно передаёт исходное направление без ненужного буквализма.
- source_word: ܚܝܠܬܢܐ
  choice: Могущественный
  rationale: Сохранён божественный титул, а не заменён толкованием «Бог» или конфессионально окрашенным именованием.
- source_word: ܨܗܝܘܢ
  choice: Сион
  rationale: Традиционная и общепонятная русская передача топонима.
theological_decisions:
- issue: Причинная связь между гневом и искоренением Сиона
  choice: «изошёл гнев, чтобы Сион был искоренён»
  alternative: «изошёл гнев, и Сион был искоренён»
  rationale: Сохранена целевая конструкция исходного текста и английского контрольного слоя; она не сводится молча к простой последовательности событий.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Формула «от Могущественного» естественнее буквального «от лица Могущественного», а страдательная конструкция сохраняет акцент источника на судьбе Сиона.
