  yaml_path: translation/extra_canonical/2_baruch/064/003.yaml
  text: 'And he made an image with five faces: four looked toward the four winds, and the fifth was on top of the image, as a rival to the zeal of the Mighty One.'
translation:
  language: ru
  text: 'И он сделал изваяние с пятью лицами: четыре были обращены к четырём ветрам, а пятое находилось на вершине изваяния[a] — как соперник ревности Могущественного[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «над изваянием».'
    reason: Предлог допускает как расположение на верхней части изваяния, так и более буквально — над ним.
  - marker: b
    text: 'Или: «словно противостоя ревности Могущественного».'
    reason: Сирийский оборот можно передать либо через существительное «соперник», либо как указание на противостояние.
lexical_decisions:
- source_word: ܨܠܡܐ (ṣalmā)
  choice: изваяние
  rationale: Передаёт материальный культовый образ естественным и dignified русским словом; «изображение» здесь было бы слишком отвлечённым.
- source_word: ܪ̈ܘܚܐ (rūḥē)
  choice: ветры
  rationale: В сочетании с четырьмя направлениями сирийское слово обозначает четыре ветра, то есть стороны света; сохранён образный язык источника.
- source_word: ܕܠܥܠ ܡܢ ܨܠܡܐ (d-lʿel men ṣalmā)
  choice: на вершине изваяния
  rationale: Контекст описывает расположение пятого лица на самом изваянии; формулировка избегает впечатления, будто оно парило отдельно над ним, при этом вариант «над изваянием» отмечен в сноске.
- source_word: ܚܪܘܝܐ (ḥarwāyā)
  choice: соперник
  rationale: Сохраняет предметное значение существительного «соперник, противник», а не превращает его в абстрактное указание на противодействие.
- source_word: ܛܢܢܐ (ṭnānā)
  choice: ревность
  rationale: Сохраняет богословски напряжённое значение божественной ревности и не сужает его до гнева или рвения.
- source_word: ܚܝܠܬܢܐ (ḥayltānā)
  choice: Могущественный
  rationale: Передаёт божественный титул без замены его более привычным, но иным титулом «Всемогущий».
theological_decisions:
- issue: Характер вызова божественной ревности
  choice: «как соперник ревности Могущественного»
  alternative: «словно противостоя ревности Могущественного»
  rationale: Основной текст сохраняет существительное «соперник» и прямую дерзость идолопоклоннического образа; сноска отмечает возможное более обстоятельственное понимание оборота.
- issue: Божественный эпитет
  choice: «Могущественный»
  alternative: «Всемогущий»
  rationale: «Могущественный» ближе к сирийскому эпитету и не привносит более сильное утверждение о всемогуществе, которого данная форма сама по себе не требует.
translation_notes:
  register: Современный литературный русский язык с торжественным, но ясным повествовательным строем. Повтор «четыре — к четырём» сохранён ради структуры исходного описания; «лицами» выбрано вместо менее естественного здесь «ликами», а божественный титул оформлен с прописной буквы.
