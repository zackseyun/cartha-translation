  yaml_path: translation/extra_canonical/2_baruch/064/008.yaml
  text: For although his prayer was heard by the Most High, yet at last, when he was cast into the bronze horse and the bronze horse melted, it became a sign for him for the moment.
translation:
  language: ru
  text: Хотя Всевышний и услышал его молитву, но в конце концов, когда его бросили в медного коня и медный конь расплавился, это стало для него знамением на время.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «знамением тогда».'
    reason: Сирийское временное выражение может обозначать «на время» или «тогда, в тот момент»; оно не означает «о часе».
lexical_decisions:
- source_word: ܐܫܬܡܥܬ ܒܥܘܬܗ ܠܘܬ ܡܪܝܡܐ
  choice: Всевышний услышал его молитву
  rationale: Естественная русская передача сирийской пассивной конструкции «его молитва была услышана у Всевышнего» без изменения смысла.
- source_word: ܡܪܝܡܐ
  choice: Всевышний
  rationale: Устойчивый и понятный русский эквивалент титула «Высочайший / Всевышний».
- source_word: ܠܫܥܬܐ
  choice: лишь на время
  rationale: Идиоматическая передача временного значения «на краткое время, на тот момент»; слово «лишь» выявляет контраст между временным знамением и последующим исходом, не превращая выражение в указание на предмет пророчества.
theological_decisions:
- issue: Соотношение услышанной молитвы и окончательной участи Манассии
  choice: 'Сохранён уступительный контраст: молитва услышана, но последующее знамение имеет лишь временное значение.'
  alternative: Истолковать услышанную молитву как полное и окончательное избавление.
  rationale: Сирийская конструкция и контекст намеренно удерживают напряжение между услышанной молитвой и ограниченным по времени результатом; перевод не должен разрешать его конфессиональным толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного религиозного текста. Повтор «медного коня» во второй части естественно снят местоимением «тот», поскольку референт однозначен; образ и последовательность событий сохранены.
