  text: Ибо тот, кто способен творить добро, способен и творить зло.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܛܒ / ܒܝܫ (предполагаемая смысловая пара; текст стиха не удаётся надёжно выделить в предоставленном корпусе)
  choice: творить добро / творить зло
  rationale: Сохраняется уравновешенный нравственный контраст и параллельное построение фразы; современное «творить» звучит естественно и достойно.
- source_word: ܡܫܟܚ / ܡܨܐ (предполагаемое обозначение способности)
  choice: способен
  rationale: Передаёт именно возможность или способность, не добавляя оттенка разрешения, намерения либо неизбежности.
theological_decisions:
- issue: Соотношение способности к добру и способности ко злу
  choice: 'Сохранено прямое утверждение: способный творить добро способен и творить зло.'
  alternative: «Кто может принести пользу, может также причинить мучение».
  rationale: Предпочтён широкий нравственный контраст, засвидетельствованный проверочным английским слоем; не уточняется, о каком лице идёт речь, и не снимается богословское напряжение высказывания.
translation_notes:
  register: Современный литературный русский язык; краткая симметричная формулировка. Предоставленный сирийский материал представляет собой повреждённый или рассогласованный корпус страниц, и точную строку 64:10 в нём нельзя уверенно локализовать, поэтому перевод сформулирован осторожно с опорой на доступный смысловой контроль.
