base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/064/002.yaml
  text: 'For he committed much impiety: he killed the righteous, twisted judgment, shed innocent blood, violated married women by force, overturned altars, abolished their offerings, and drove out the priests so that they could not minister in the sanctuary.'
translation:
  language: ru
  text: 'Ибо он совершил много нечестивых дел: убивал праведников, извращал правосудие, проливал невинную кровь, насиловал замужних женщин, разрушал жертвенники, отменял приношения и изгонял священников, чтобы они не могли служить в святилище.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܝܫܬܐ / impiety context
  choice: нечестивых дел
  rationale: Передаёт нравственно-религиозный характер зла естественным современным русским языком, не сужая его до одного конкретного преступления.
- source_word: judgment (судебный контекст)
  choice: правосудие
  rationale: Формулировка «извращал правосудие» ясно передаёт сознательное искажение суда, а не просто ошибочное суждение.
- source_word: married women
  choice: замужних женщин
  rationale: Сохраняет указание на брачный статус пострадавших без архаического «жён».
- source_word: minister
  choice: служить
  rationale: В сочетании «служить в святилище» слово естественно обозначает священническое служение и не требует конфессионально окрашенного уточнения.
theological_decisions:
- issue: Характер нечестия правителя
  choice: Сохранён перечень как совокупность религиозных, судебных и насильственных преступлений.
  alternative: Обобщить перечень выражением «творил великое зло».
  rationale: Конкретный перечень существен для смысла стиха и показывает одновременно общественную и культовую стороны нечестия.
- issue: Цель изгнания священников
  choice: «чтобы они не могли служить в святилище»
  alternative: «так что они не служили в святилище»
  rationale: Целевая конструкция соответствует представленному английскому контрольному слою и логике намеренного изгнания, при этом не добавляет богословских деталей.
translation_notes:
  register: Современный литературный русский язык; торжественный, но понятный регистр. Синтаксический параллелизм перечня сохранён. Термины выбраны без конфессионально-специфической окраски.
