lexical_decisions:
- source_word: ܠܐ ܚܣ
  choice: не пощадил
  rationale: Передаёт обычное значение сирийского выражения о том, что Бог не удержал суда и наказания.
- source_word: ܒܢܘ̈ܗܝ
  choice: Своих сыновей
  rationale: Возвратное «Своих» естественно передаёт притяжательный суффикс и сохраняет противопоставление сыновей врагам.
- source_word: ܐܝܟ ܒܥܠܕܒܒ̈ܘܗܝ
  choice: как Своих врагов
  rationale: Сохранены и сравнительная конструкция, и притяжательный суффикс «Своих».
- source_word: ܡܛܠ ܕܚܛܘ
  choice: потому что они согрешили
  rationale: Прямо сохраняет причинную связь между грехом и постигшим их наказанием.
theological_decisions:
- issue: Кого обозначают «сыновья» и «враги»
  choice: Сохранить оба образа без поясняющей конкретизации
  alternative: Уточнить, что речь идёт о народе Божьем или Израиле
  rationale: Сам стих выражает напряжённое сопоставление близости к Богу и суда над согрешившими; добавленная идентификация сузила бы смысл.
- issue: Божественный субъект местоимений
  choice: 'Передать местоимения с прописной буквы: «Он», «Своих»'
  alternative: Использовать строчные буквы
  rationale: По контексту субъектом является Бог; прописная буква соответствует принятому русскому библейскому регистру и не добавляет нового содержания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Наречие «прежде» поставлено перед сказуемым для естественного порядка слов; оборот «подверг их бедствиям» передаёт действие достаточно широко, не конкретизируя вид наказания.
