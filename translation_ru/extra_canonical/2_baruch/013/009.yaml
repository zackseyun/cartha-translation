  source_fidelity: 'Смысловые элементы, отражённые в английском аудиторском тексте и его сирийской основе, сохранены: выводная связь, временное «прежде», «не пощадил», «Своих сыновей», сравнение с Его врагами и причина — их грех. Однако «подверг их бедствиям, как Своих врагов» синтаксически неудачно: сравнительный оборот неясно соотнесён с глаголом и может звучать так, будто сыновья сами являются врагами.'
