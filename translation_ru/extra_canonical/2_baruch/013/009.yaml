  terminology: «Не пощадил», «сыновей» и «согрешили» удачны. Прописные буквы в местоимениях, относящихся к Богу, допустимы в выбранном библейском регистре. «Бедствия» остаётся достаточно широким эквивалентом английского «afflicted» и не навязывает конкретный вид кары.
