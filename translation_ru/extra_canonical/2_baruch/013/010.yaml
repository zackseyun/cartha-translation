translation:
  language: ru
  text: Поэтому тогда они подверглись наказанию, чтобы быть освящёнными.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: '[соответствующий сирийский оборот в предоставленном страничном корпусе не удаётся надёжно локализовать из-за повреждённой разбивки]'
  choice: подверглись наказанию
  rationale: Передаёт исправительное или дисциплинарное наказание, отражённое в контрольном английском слое словом “chastened”, не сужая смысл до телесной кары.
- source_word: '[целевой оборот со значением освящения]'
  choice: быть освящёнными
  rationale: 'Сохраняет пассивную форму и целевое значение: наказание представлено как ведущее к освящению, без уточнения способа или деятеля.'
theological_decisions:
- issue: Цель наказания и субъект освящения
  choice: «чтобы быть освящёнными»
  alternative: «чтобы они освятились»
  rationale: Пассивная конструкция лучше сохраняет подразумеваемое действие Бога и не превращает освящение исключительно в самостоятельное действие людей.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая и достойная. Из-за ненадёжной локализации стиха в предоставленном сирийском страничном корпусе перевод сверён с английским POB как контрольным слоем, при сохранении его смысловой структуры.
