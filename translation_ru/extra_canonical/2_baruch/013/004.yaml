  text: If the cities that now prosper should ever say, ‘Why has the mighty God brought this retribution upon us?’
translation:
  language: ru
  text: 'Если города, которые ныне процветают, однажды скажут: «Почему могущественный Бог навёл на нас это возмездие?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܕܝܢܬܐ
  choice: города
  rationale: Прямое соответствие сирийскому множественному числу «города».
- source_word: ܡ̈ܠܝܢ
  choice: процветают
  rationale: Буквально слово связано с полнотой («наполнены»), но в данном обращении к благополучным городам естественный русский эквивалент — «процветают»; он сохраняет подразумеваемое нынешнее благополучие.
- source_word: ܐܠܗܐ ܚܝܠܬܢܐ
  choice: могущественный Бог
  rationale: Передаёт титул буквально и без конфессионального уточнения.
- source_word: ܦܘܪܥܢܐ
  choice: возмездие
  rationale: Слово обозначает воздаяние или расплату; «возмездие» сохраняет судебно-нравственный оттенок и не сводит смысл просто к бедствию.
theological_decisions:
- issue: Причина постигшего города воздаяния
  choice: «За что ... навёл на нас это возмездие?»
  alternative: «Почему ... совершил над нами это воздаяние?»
  rationale: Формулировка сохраняет представление о Божьем воздаянии, но не добавляет не названной в стихе конкретной вины; «за что» естественно выражает вопрос пострадавших о причине наказания.
translation_notes:
  register: Современный литературный русский язык; вопрос оформлен прямо и торжественно, без архаизмов. Наречия «ныне» и «когда-нибудь» передают временное противопоставление нынешнего благополучия и будущего воздаяния.
