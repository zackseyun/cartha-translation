    ܡܕܥܝܗܝܢ ܘܐܘܦܢ ܚܕ̈ܕܐ.

    ܡܢܗ ܗܘܘ ܢܝܕ ܟܠ

    ܗܠܝܢ. ܐܘ ܠܡܢܘ ܢܫܟܘܚ

    ܟܠ ܡܕܡ ܕܕ̈ܝܩܢ. ܐܘ

    ܡܢܘ ܐܡܪ ܣܓܝܐܘ

    ܚܟܡܗ ܐܟܡܐ ܕܠܐ

    ܡܐ̈ܙܐ ܘܕ̈ܢܦܐ ܗܘܐ

    ܕܡܢܝܢ ܟܐܢܐ ܟܢܝܫܘ.

    ܠܐ ܓܝܪ ܝܕܥܘܗ̇ ܠܥܡܬܐ

    ܗܘܬ ܘܐܦ ܠܐ ܚܫܒܘܗ

    ܟܠ ܡܕܡ ܕܕ̈ܝܩܢ. ܢܘ̈ܦܝ

