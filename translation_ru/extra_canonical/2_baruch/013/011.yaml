  source_fidelity: В доступном сирийском фрагменте в конце страницы различимы «земля/страна», «цари», «народы» и «виновны»; он обрывается, поэтому полная сверка последующих членов стиха по данному снимку невозможна. Русский текст точно следует предоставленному английскому POB audit trail и не добавляет смысловых уточнений.
  naturalness: Фраза звучит как современный литературный русский с уместным торжественно-обличительным регистром. Сочетание «обращались с творением без праведности» несколько книжное, но понятно и сохраняет намеренно широкий смысл «творения».
  terminology: «Народы и племена», «виновны», «земля», «творение» и «праведность» переданы последовательно. Термин «праведность» сохраняет нравственно-богословскую широту исходной английской контрольной формулировки и не подменяется более узким юридическим «справедливость».
