  text: But now, you nations and peoples, you are guilty, because at all times you have trodden the earth and dealt with creation without righteousness.
translation:
  language: ru
  text: Но теперь вы, народы и племена, виновны, потому что во все времена попирали землю и обращались с творением без праведности.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܡ̈ܘܬܐ
  choice: народы
  rationale: Передаёт коллективное обозначение народов в современном литературном русском без конфессиональной окраски.
- source_word: ܐܬܪܘܬ
  choice: племена
  rationale: В данном повреждённом и трудно читаемом месте выбрано второе обобщённое обозначение человеческих сообществ, согласующееся с параллельной конструкцией.
- source_word: ܚܝܒܝܢ
  choice: виновны
  rationale: Сохраняет судебно-нравственный смысл сирийского слова, не уточняя характер наказания.
- source_word: ܡ̇ܚܝܢ
  choice: попирали
  rationale: По контексту выражает насильственное, неправедное обращение с землёй; форма прошедшего времени естественна после указания «во все времена».
- source_word: ܕܠܐ … ܟܐܢܐ
  choice: без праведности
  rationale: Сохраняет буквальную нравственно-богословскую категорию праведности, не сужая её до простой несправедливости.
theological_decisions:
- issue: Значение «творения»
  choice: творением
  alternative: созданным миром
  rationale: '«Творение» сохраняет широкий диапазон понятия: сотворённый мир и всё созданное, не сводя смысл только к природе.'
- issue: Характер вины народов
  choice: виновны
  alternative: подлежите осуждению
  rationale: 'Выбрана менее интерпретирующая формулировка: она утверждает вину, но не добавляет прямо выраженного судебного приговора.'
translation_notes:
  register: Современный литературный русский; тон торжественный и обличительный, но синтаксис остаётся понятным. Из-за повреждённости и неустойчивой сегментации сирийского текста формулировка сверена с предоставленным аудированным английским консультационным слоем, при сохранении ключевых сирийских нравственно-судебных понятий.
