  text: You shall say to them, and to those like them, ‘You who have seen this calamity and this retribution that has come upon you and upon your city at its appointed time—
translation:
  language: ru
  text: 'Скажи им и тем, кто подобен им: «Вы, увидевшие это бедствие и это возмездие, постигшее вас и ваш город[a] в назначенное для него время, —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ваш народ».'
    reason: Сохраняет контекстуальную альтернативу, отмеченную в английском аудиторском следе, без изменения основного перевода.
lexical_decisions:
- source_word: ܦܘܪܥܢܐ (purʿānā)
  choice: возмездие
  rationale: Передаёт судебно-карательный смысл сирийского слова и сохраняет его отличие от более общего «бедствие» в предшествующей части фразы.
- source_word: ܡܕܝܢܬܐ / контекстуальная форма с притяжательным значением
  choice: ваш город
  rationale: Соответствует наиболее вероятному чтению в контексте обращения к пережившим гибель города; альтернативное понимание отмечено в сноске.
- source_word: ܒܙܒܢܗ (b-zabneh)
  choice: в назначенное ему время
  rationale: Суффикс имеет единственное число и соотнесён с единственным числом «возмездие»; «назначенное» естественно выражает идею определённого срока.
theological_decisions:
- issue: Характер постигшего события
  choice: «бедствие» и «возмездие» сохранены как два связанных, но не тождественных обозначения
  alternative: Объединить их в одно общее понятие наказания
  rationale: Исходный текст удерживает одновременно переживаемое несчастье и его смысл как воздаяния; перевод не должен устранять это напряжение.
- issue: Число слова «возмездие» и согласование времени
  choice: 'Единственное число: «это возмездие… в назначенное ему время»'
  alternative: 'Множественное число: «воздаяния… в назначенное им время»'
  rationale: Основное сирийское чтение и форма местоименного суффикса указывают на единственное число, хотя прежняя традиция передачи отражена в сносках.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Начальное повеление передано прямо; причастный оборот сохраняет незавершённость исходной фразы, продолжающейся в следующем стихе. Все варианты вынесены в сноски без догматического разрешения неоднозначности.
