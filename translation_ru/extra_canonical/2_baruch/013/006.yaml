translation:
  language: ru
  text: Поэтому тогда они были вразумлены, чтобы быть прощёнными.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы они были пощажены (оставлены в живых)».'
    reason: Сирийский глагол может означать как прощение, так и оставление или избавление от гибели.
lexical_decisions:
- source_word: ܐܬܪܕܝܘ
  choice: были вразумлены
  rationale: Перфектная страдательная форма обозначает уже совершившееся исправительное воздействие; «вразумлены» сохраняет смысл дисциплинарного наказания, не сводя его лишь к каре.
- source_word: ܗܝܕܝܢ
  choice: тогда
  rationale: Кратко и естественно передаёт временное указание «в то время».
- source_word: ܢܫܬܒܩܘܢ
  choice: им было прощено
  rationale: В контексте последующего прощения после вразумления глагол естественно означает «быть прощёнными», хотя допускает также значение «быть пощажёнными/оставленными».
theological_decisions:
- issue: Цель вразумления и значение ܢܫܬܒܩܘܢ
  choice: чтобы им было прощено
  alternative: чтобы они были пощажены (оставлены в живых)
  rationale: Основной текст отражает контекстуально вероятный смысл прощения, а примечание сохраняет подлинную лексическую неоднозначность без догматического её разрешения.
- issue: Неявное подлежащее
  choice: они
  alternative: народы
  rationale: В сирийском тексте данного высказывания нет существительного «народы»; местоименное подлежащее сохранено без внесения отсутствующего уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Конструкция краткая и сохраняет причинно-целевую связь оригинала.
