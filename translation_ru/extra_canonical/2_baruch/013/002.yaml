  text: And a voice came from on high and said to me, “Stand on your feet, Baruch, and hear the word of the Mighty One.”
translation:
  language: ru
  text: 'И раздался с высоты голос, сказавший мне: «Встань на ноги, Варух, и выслушай слово Могущественного».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܠܐ ... ܡܢ ܡܪܘܡܐ
  choice: голос ... с высоты
  rationale: Передаёт пространственный образ сирийского текста естественно и без уточнения, отсутствующего в источнике.
- source_word: ܩܘܡ ܥܠ ܪ̈ܓܠܝܟ
  choice: встань на ноги
  rationale: Сохраняет конкретную идиому источника и звучит естественно по-русски.
- source_word: ܫܡܥ ܡܠܬܐ
  choice: выслушай слово
  rationale: Глагол «выслушай» здесь естественно выражает повеление внимательно принять возвещаемое слово.
- source_word: ܐܠܗܐ ܚܝܠܬܢܐ
  choice: Могущественного
  rationale: Сохраняет самостоятельное божественное именование-эпитет и согласуется с контекстом, не сводя его к простому описательному сочетанию «могущественный Бог».
theological_decisions:
- issue: Передача божественного именования ܐܠܗܐ ܚܝܠܬܢܐ
  choice: Могущественного
  alternative: могущественного Бога
  rationale: Выбран субстантивированный эпитет, чтобы сохранить функцию традиционного божественного титула и не добавлять конфессиональной конкретизации.
