  text: Because you were shaken by what has happened to Zion, therefore you will surely be preserved until the consummation of the times, that you may be a testimony.
translation:
  language: ru
  text: Поскольку ты был потрясён тем, что произошло с Сионом, ты непременно будешь сохранён до завершения времён, чтобы быть свидетельством.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܬܙܝܥ
  choice: был потрясён
  rationale: Передаёт сильное внутреннее потрясение, сохраняя страдательную форму сирийского выражения.
- source_word: ܠܐܬܪܘܬ / формула завершения времён в контексте стиха
  choice: до завершения времён
  rationale: Современная и понятная передача эсхатологического временного предела без архаического «скончания».
- source_word: свидетельственная формула в заключительной цели
  choice: чтобы стать свидетельством
  rationale: Сохраняет значение отвлечённого существительного «свидетельство», не подменяя его обозначением лица «свидетель».
theological_decisions:
- issue: Кем будет сохранён Варух
  choice: страдательная конструкция «будешь сохранён» без названного действующего лица
  alternative: «Бог сохранит тебя»
  rationale: Сохраняет характерный для исходной формулировки божественный пассив и не вводит явно названного субъекта.
- issue: Значение цели сохранения Варуха
  choice: «чтобы стать свидетельством»
  alternative: «чтобы быть свидетелем»
  rationale: Не устраняет возможное различие между самим Варухом как свидетелем и его сохранением как свидетельством для других.
translation_notes:
  register: Современный литературный русский язык; фраза торжественная, но не архаизированная. Сохранены причинно-следственная структура, усиление «непременно» и эсхатологическая напряжённость исходного текста.
