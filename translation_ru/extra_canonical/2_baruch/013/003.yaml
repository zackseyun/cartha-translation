    ܘܟܕ ܐܡ̇ܪܢܐ ܗܠܝܢ ܪ̇ܡܬ

    ܫܒܥܐ ܝܘܡ̈ܝܢ.܀ ܘܗܘܬ

    ܡܢ ܒܬܪ ܗܠܝܢ ܐܢܐ ܒܪܘܟ

    ܩܐܡ ܗܘܝܬ ܥܠ ܨܝܕܐ

    ܕܢܗܪܐ. ܘܗܘܐ ܩܠܐ

    ܐܙܐ ܡܢ ܡܪܘܡܐ

