translation:
  language: ru
  text: Ибо во всякое время Я делал вам добро, а вы во всякое время отвергали Мою доброту.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܟܠ ܙܒܢ
  choice: во всякое время
  rationale: Сохраняет повтор временного оборота и подчёркивает постоянство Божьего действия и человеческого ответа.
- source_word: делать добро / благотворить (смысловой эквивалент в данном стихе)
  choice: делал вам добро
  rationale: Естественная современная русская формулировка, прямо передающая благодеяние без конфессиональной терминологии.
- source_word: доброта / благость (смысловой эквивалент в данном стихе)
  choice: Мою доброту
  rationale: Передаёт личную благосклонность говорящего; прописная буква согласуется с тем, что речь ведётся от лица Бога.
theological_decisions:
- issue: Характер Божьего отношения к адресатам
  choice: доброту
  alternative: милость; благость
  rationale: «Доброта» сохраняет общий смысл благого и благосклонного отношения, не сужая его до специального богословского понятия.
- issue: Смысл ответа адресатов
  choice: отвергали
  alternative: отрицали; не признавали
  rationale: «Отвергали» естественно выражает сознательное неприятие Божьей доброты, не уточняя сверх источника, было ли это словесным отрицанием или поведением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Параллель «во всякое время … во всякое время» сохранена ради риторической структуры и контраста.
