translation:
  language: ru
  text: 'Я говорю вам: «Вы, пившие процеженное вино, пейте также его осадок, потому что суд Всевышнего нелицеприятен».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܐܡܪ ܠܗܘܢ
  choice: Скажи им
  rationale: В данном контексте форма естественно читается как повеление, продолжающее обращение Бога к Варуху; местоименный суффикс означает «им», а не «вам».
- source_word: ܚܡܪܐ ܡܕܝܠܢܐ
  choice: процеженное вино
  rationale: Передаёт образ очищенного, отфильтрованного вина и сохраняет противопоставление последующему осадку.
- source_word: ܕܠܡܐ
  choice: осадок
  rationale: По контексту обозначает оставшуюся на дне густую часть вина; современное «осадок» ясно сохраняет метафору.
- source_word: ܕܝܢܗ ܕܡܪܝܡܐ ... ܠܐ ܡܣܒ ܒܐܦ̈ܐ
  choice: суд Всевышнего нелицеприятен
  rationale: Устойчиво и точно выражает семитскую идиому «не принимает лица», то есть не оказывает предпочтения из-за положения или личности.
theological_decisions:
- issue: Беспристрастность суда Всевышнего
  choice: суд Всевышнего нелицеприятен
  alternative: суд Всевышнего не взирает на лица
  rationale: Выбранный вариант сохраняет богословский смысл исходной идиомы, но звучит естественнее в современном литературном русском и не уточняет основания суда сверх сказанного в тексте.
translation_notes:
  register: Современный литературный русский с достоинством афористического пророческого изречения. Метафора вина и осадка сохранена без поясняющего расширения; обращение во множественном числе передано формой «вы».
