lexical_decisions:
- source_word: ܥܒ̈ܐ
  choice: лес
  rationale: Передаёт обширную символическую совокупность деревьев и сохраняет апокалиптический масштаб образа.
- source_word: ܓܦܢ
  choice: виноградная лоза
  rationale: В русском языке уточнение «виноградная» сразу обозначает нужный вид лозы и сохраняет библейскую символику без преждевременного истолкования.
- source_word: ܡܒܘܥܐ
  choice: источник
  rationale: Естественное современное обозначение бьющей и текущей воды; подходит как для мирного появления, так и для последующего мощного потока.
- source_word: ܐܪܙܐ
  choice: кедр
  rationale: Сохраняет устойчивый библейский образ могучего дерева без поясняющего расширения.
- source_word: ܒܫܠܡܐ
  choice: в мире
  rationale: Сохраняет буквальную лексику мира и намеренное противопоставление спокойного приближения разрушительной силе источника.
theological_decisions:
- issue: Следует ли уже в тексте видения прямо отождествлять лозу и источник с фигурами из последующего толкования
  choice: Символы оставлены без прямого истолкования и без маркирующей их богословской капитализации.
  alternative: Назвать или графически обозначить лозу и источник как мессианские фигуры на основании последующего объяснения.
  rationale: В композиции произведения сначала сообщается видение, а его толкование даётся позднее; перевод не должен устранять эту повествовательную дистанцию.
- issue: Напряжение между «покоиться» и «мучением» в приговоре кедру
  choice: «покойся в мучении»
  alternative: Сгладить выражение как «оставайся в мучении».
  rationale: Парадоксальная формулировка сохранена, поскольку она может обозначать пребывание в состоянии мучения и не должна без необходимости гармонизироваться.
- issue: Возвращение кедра в последний срок
  choice: «тогда ты снова вернёшься и подвергнешься ещё большей муке»
  alternative: Истолковать возвращение как воскресение, окончательный суд или конкретное эсхатологическое событие.
  rationale: Перевод сохраняет эсхатологическую неопределённость самого видения и не вводит конфессионально обусловленного пояснения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, визионерским ритмом. Повторы «И вот», «лес», «источник» и «кедр» сохранены ради структуры образов; архаизмы сведены к минимуму. Формулы «открыла уста» и «настал твой час» оставлены как понятные библейские обороты.
