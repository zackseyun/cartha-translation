base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/074/001.yaml
  text: '1. And it shall be in those days: the reapers will not grow weary, and the builders will not labor; for the works will move forward of themselves with those who do them, in much tranquility.'
translation:
  language: ru
  text: '1 И будет в те дни: жнецы не будут утомляться, и строители не будут трудиться, потому что дела у тех, кто их делает, будут сами собой спориться в глубоком покое.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: probable Syriac term corresponding to messores
  choice: жнецы
  rationale: Сохраняет конкретный земледельческий образ и не расширяет его до общего обозначения сельских работников.
- source_word: probable Syriac term corresponding to aedificantes
  choice: строители
  rationale: Прямо передаёт второй образ в паре со жнецами.
- source_word: non fatigabuntur ... neque laborabunt (control witness)
  choice: не будут утомляться ... не будут трудиться
  rationale: Два разных глагола сохранены, чтобы передать параллелизм и не свести оба выражения к одному понятию.
- source_word: sponte erunt currentia opera (control witness)
  choice: работы сами собой будут продвигаться
  rationale: Передаёт чудесную лёгкость исполнения, не превращая образ в современную идею автоматизации.
- source_word: tranquillitate multa (control witness)
  choice: среди великого покоя
  rationale: Сохраняет усиленное значение и атмосферу восстановленного порядка; «покой» естественнее и шире, чем технически звучащее «спокойствие».
theological_decisions:
- issue: Степень подчёркивания лёгкости труда в грядущую эпоху
  choice: работы сами собой будут продвигаться
  alternative: работа будет даваться легко; труды будут успешны
  rationale: Контрольное свидетельство описывает не просто успех, а необычайно беспрепятственное совершение дел; апокалиптический образ сохранён без чрезмерной механизации.
- issue: Значение заключительного образа покоя
  choice: среди великого покоя
  alternative: в великом мире; в глубоком отдохновении
  rationale: Фраза указывает не только на отсутствие усталости, но и на всеобъемлющую умиротворённость восстановленного порядка.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Повтор «не будут» намеренно сохраняет параллелизм. Поскольку предоставленный сирийский лист содержит пограничный материал соседней главы и текст стиха восстанавливается прежде всего по контрольному свидетельству, перевод избегает детализации, не подтверждённой свидетельствами.
