  text: But concerning the nations, it would be too much to tell how they continually acted in impiety and wickedness and never showed themselves righteous.
translation:
  language: ru
  text: 'А о народах было бы слишком долго рассказывать: они постоянно творили нечестие и беззаконие и никогда не поступали праведно.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: «народы» (сир. мн. ч.; соответствующий фрагмент в предоставленном страничном блоке распознан неполно)
  choice: народы
  rationale: Нейтрально передаёт этнические народы вне Израиля и, в отличие от слова «язычники», не добавляет конфессиональной окраски.
- source_word: «нечестие»
  choice: нечестие
  rationale: Сохраняет религиозно-нравственный смысл поведения, направленного против должного почитания Бога.
- source_word: «беззаконие / зло»
  choice: беззаконие
  rationale: Передаёт нравственную порочность поступков и естественно сочетается с глаголом «творили».
- source_word: «поступать / творить праведность»
  choice: поступали праведно
  rationale: Естественная современная русская формулировка, сохраняющая деятельный, а не только статусный смысл праведности.
theological_decisions:
- issue: Кого обозначают «народы»
  choice: Сохранено общее слово «народы».
  alternative: «язычники» или «прочие народы»
  rationale: Текст не следует уточнять конфессиональным термином или явно противопоставлять Израилю там, где это уже определяется контекстом.
- issue: Праведность как действие или состояние
  choice: «никогда не поступали праведно»
  alternative: «никогда не были праведными»
  rationale: Выбранная формулировка сохраняет акцент источника на совершаемых делах и не превращает утверждение в отвлечённое суждение о неизменном статусе людей.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Конструкция «было бы слишком долго рассказывать» естественно передаёт риторическое нежелание подробно перечислять проступки; двучленная формула «нечестие и беззаконие» сохранена без богословского сглаживания.
