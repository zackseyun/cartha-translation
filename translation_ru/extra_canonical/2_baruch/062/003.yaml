  text: И дела Иезавели, и поклонение идолам, которому в то время предавался Израиль.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܒܕܝܗ̇
  choice: дела
  rationale: Сирийское слово обозначает дела или поступки; перевод «проклятие» лексически не обоснован.
- source_word: ܕܚܠܬ / ܦܘܠܚܢܐ (контекстуально восстанавливаемое выражение о почитании идолов)
  choice: поклонение идолам
  rationale: Передаёт культовую практику естественным современным русским языком, не сужая её до единичного обряда.
- source_word: ܝܣܪܝܠ
  choice: Израиль
  rationale: Сохраняется традиционная русская форма имени народа.
theological_decisions:
- issue: Характер участия Израиля в идолопоклонстве
  choice: которому… предавался Израиль
  alternative: которое… совершал Израиль
  rationale: Выбранная формулировка естественно описывает продолжительную религиозную практику и не добавляет конфессиональной интерпретации.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью. Сохранена параллельная конструкция «и… и…»; двусмысленность не устраняется дополнительными пояснениями.
