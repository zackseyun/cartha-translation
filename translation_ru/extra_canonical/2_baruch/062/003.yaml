    ܘܕܚܠܬ ܦܘܪܥܢܐ ܕܦܓܪܐ

    ܐܬܦܪܣܝܬ. ܒܐܘܬ ܙܒܢܐ.

    ܘܒܥܝܘܬ ܕܡܘܬܐ ܩܦܚܬ

    ܕܗܘܘ ܒ'
