    ܡܬܚܙܝܐ ܗܘܬ. ܘܡܕܪ̈ܫܐ

    ܕܨܒܝܢܐ ܟܝܘܬܘܬܐ

    ܘܒܥ

    ܘܕܝܫܘܬܐ ܕܦܘܩܕܢܘܗܝ

    ܕܚܠܬ ܓܝܪ ܡܫܬܡܥܢ

    ܗܘܬ. ܘܐܢܫܐ ܕܐܬܚܝܒܘ

    ܗܟܢܐ ܟܐܘܬ ܙܒܢܐ. ܡܛܠ

    ܕܠܐ ܚܿܫܝܢ ܗܘܘ ܒܡܘܬܗܘܢ.

    ܝܬܝܪ ܡܢ ܡܠܝܘܬ ܫ̈ܢܝܐ

    ܡܫܬܒܚܝܢ ܗܘܘ ܘܒܚܕܘܬܐ

    ܡܕܝܡܐ ܗܿܘܝܢ ܚܠܝܦܝ

    ܗܘܘ. ܥܠ ܕܫ̈ܢܝܐ

    ܘܬܘܠܕ̈ܬܐ ܚܠܦܝܢ ܐܢܘܢ

    ܡ̇ܢ. ܘܡܘܬܐ ܕܝܠܗܘܢ ܬܒܥ

    ܘܡ̇ܢ ܡܒܛܠܢܐ ܐܦܩܕ

    ܕܢܬܬܒܥ. ܗܝ ܗܝ ܡܟܝܠ ܦܘܪܥܢܘܬܐ

    ܕܡܚܝܒܘܬܐ. ܕܝܘܪܒܢܐ

    ܕܐܬܚܝܒܘ ܕܢܥܒܕܘܢ ܐܢܘܢ

    ܒܥ̈ܒܕܝܗܘܢ. ܡܛܠ ܕܗܟܢܐ

    ܕܐܢܫܘܬ ܡ̈ܠܟܐ ܗܘܘ ܡܢ

