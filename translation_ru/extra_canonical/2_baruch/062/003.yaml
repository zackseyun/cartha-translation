source:
  text: '# Source page p0188 (printed 154)

    ܐܦ ܝܡܝܢܐ ܒܪܘܬ ܙܒܢܐ

    ܕܐܬܚܙܝܬ ܡܢ ܬܪ̈ܘܝܗܝܢ.

    ܘܐܬܚܙܝܬ ܬܘܒܘܗܝ

    ܕܚܒܠܬܐ ܕܐܬܚܙܝܬ. ܟܕ

