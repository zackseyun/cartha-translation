    ܘܒܬܪ ܝܘܫܝܐ ܢܘܚܪܐ

    ܕܐܝܬܝ ܗܘܘ ܗܘ ܙܒܢܐ

    ܕܐܬܠܒܟ ܒܗ ܙܕܩܝܐ

    ܘܡܠܟܘܬܗ. ܘܗܘ̣ܐ ܒܝܘܡ

    ܙܒܢܐ ܒܝܫܘܬܐ ܕܗܘ̣ܬ.

    ܘܚܙܝܬ ܕܥܠ ܡܟܝܟܘܬܗ

    ܘܕܟ̣ܘܬ ܣܓܝ̈ܐܐ

    ܕܒܟ̈ܘܡܐ ܢܣ̣ܒܘ ܗܝܕܝܢ.

    ܘܗܘ̈ܒܠܝ ܣܓܝ̈ܐܐ

    ܕܐܬܪܒܘ ܗܝܕܝܢ ܒܚܘܒ̣ܐ

    ܕܥܠ ܡܟܝܟܘܬܗ ܡܥܒܕ

    ܘܡܚܙܝ ܒܗܘ̇ ܙܒܢܐ ܩܕܡ

    ܗܘ̣ܘ. ܘܚܟܡܬܐ ܟܟܝܘܬܐ

    ܡܬܡܢܝܐ ܗܘܬ ܘܡܘܬܪܢܘܬܐ

