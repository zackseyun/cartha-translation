    ܬܬܛܪܦ ܗܝܕܝܢ ܒܚܫ̈ܟܐ

    ܒܝܘ̈ܡܝܐ ܕܕܝܠܗ ܟܕ

    ܚܙܝܢ ܗܘܘ ܬܘ̈ܠܥܐ

    ܣܓܝ̈ܐܐ ܕܢܦ̈ܩܢ ܗܘ̈ܝ

