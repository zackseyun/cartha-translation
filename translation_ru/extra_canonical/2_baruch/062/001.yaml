  rationale: Удалена сноска, поскольку она ошибочно представляет грамматически разрешённое сирийским текстом согласование как содержательную альтернативу. Причинный оборот уточнён без изменения смысла и без утраты повторно выраженной в оригинале идеи замысла/решения.
