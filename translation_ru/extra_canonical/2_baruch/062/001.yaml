  text: And the seventh black waters that you saw—this is the perversion brought about by the counsel of Jeroboam, who took counsel to make two calves of gold.
translation:
  language: ru
  text: И седьмые чёрные воды, которые ты видел, — это извращение, вызванное замыслом Иеровоама, который решил сделать двух золотых тельцов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟܡ̈ܐ / ܚܫ̈ܟܐ
  choice: чёрные воды
  rationale: Сохраняет резкий цветовой контраст чередующихся вод в апокалиптическом видении; «тёмные» было бы менее конкретно.
- source_word: ܚܒܠܬܐ
  choice: извращение
  rationale: Передаёт нравственное и культовое искажение, связанное с действиями Иеровоама, не сужая смысл до одного лишь разрушения.
- source_word: ܡܠܟܐ / ܕܒܪܐ (control-backed counsel sense)
  choice: замысел
  rationale: Естественно передаёт обдуманное решение Иеровоама; последующее «решил» сохраняет повтор идеи совещания без тяжеловесного «советовался».
- source_word: ܬܪܝܢ ܥܓ̈ܠܐ ܕܕܗܒܐ (control-backed wording)
  choice: двух золотых тельцов
  rationale: Устоявшееся и точное библейское обозначение культовых изображений Иеровоама.
theological_decisions:
- issue: Согласование указательного оборота с множественным числом «воды» или с единственным числом «извращение»
  choice: это извращение
  alternative: они — извращение
  rationale: Единственное число следует сирийскому женскому единственному указательному местоимению и сказуемому, а по-русски оборот «это извращение» звучит естественно и сохраняет отождествление символа с его истолкованием.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной апокалиптической образностью. Имена и выражение «золотые тельцы» даны в привычной библейской форме.
