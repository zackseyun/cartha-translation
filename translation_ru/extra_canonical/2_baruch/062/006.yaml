  rationale: Традиционная русская передача имени ассирийского царя Шалманесера; она естественна для библейского контекста и позволяет соотнести это лицо с русской библейской ономастикой.
- source_word: ܡܠܟܐ ܕܐܬܘܪ
  choice: царь Ассирии
  rationale: Прямая и ясная передача титула и географического названия.
- source_word: ܫܒܐ / ܐܫܒܝ (предполагаемая лексема пленения)
  choice: увёл их в плен
  rationale: По-русски естественно передаёт каузативное действие захвата и переселения пленников, не добавляя сведений о месте назначения.
