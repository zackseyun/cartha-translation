  text: And the time of the captivity that came upon the nine and a half tribes, because of their many sins.
translation:
  language: ru
  text: И время пленения, постигшего девять с половиной колен из-за их многочисленных грехов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «потому что они пребывали во многих грехах».'
    reason: Сохраняет доступ к семитской форме выражения, тогда как в основном тексте дан её естественный русский эквивалент.
lexical_decisions:
- source_word: ܙܒܢܐ
  choice: время
  rationale: Передаёт временной период, названный в ряду исторических событий.
- source_word: ܫܒܝܬܐ / ܚܒܠܬܐ (контекстуально восстанавливаемое обозначение плена)
  choice: пленение
  rationale: Сохраняет отвлечённое название события и естественно сочетается с «время».
- source_word: ܬܫܥ ܘܦܠܓܘܬ ܫܒܛ̈ܐ (смысл, подтверждённый контрольным слоем)
  choice: девять с половиной колен
  rationale: Точно сохраняет необычное числовое обозначение племён Израиля, не пытаясь его истолковать.
- source_word: ܒܚܛܗ̈ܐ ܣܓܝ̈ܐܐ (смысл, подтверждённый контрольным слоем)
  choice: из-за их многочисленных грехов
  rationale: Естественно передаёт семитское причинное выражение, буквально связанное с пребыванием «во многих грехах».
theological_decisions:
- issue: Причинная связь между грехами и пленением
  choice: из-за их многочисленных грехов
  alternative: потому что они пребывали во многих грехах
  rationale: Основной текст ясно сохраняет заявленную причинность, но не добавляет объяснения механизма суда и не усиливает богословскую формулировку.
- issue: Определение пленения как принадлежащего коленам или постигшего их
  choice: пленения, постигшего девять с половиной колен
  alternative: их пленения — девяти с половиной колен
  rationale: Выбранный вариант устраняет неясную русскую конструкцию, сохраняя колена как тех, кого постиг плен.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет характер элемента более широкого перечисления. Употреблено традиционное библейское «колена», а не нейтральное «племена».
