lexical_decisions:
- source_word: ܒܝܫܘܬܐ
  choice: зло
  rationale: Передаёт нравственное зло и злодеяние естественным современным русским словом, не сужая значение до отдельного проступка.
- source_word: ܡ̈ܠܟܐ
  choice: цари
  rationale: Обычное и исторически уместное соответствие сирийскому обозначению царей.
- source_word: ܥܘܠܐ
  choice: в неправедности
  rationale: Сохраняет нравственно-богословскую характеристику образа действий, не заменяя её более узким понятием беззакония.
theological_decisions:
- issue: Соотношение зла и неправедности
  choice: 'Сохранены оба понятия: «зло… совершили в неправедности».'
  alternative: «все неправедные злодеяния»
  rationale: Раздельная передача не устраняет смысловое напряжение между самими деяниями и нравственной сферой, в которой они совершались.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет краткость, торжественность и последовательную структуру исходного высказывания.
