  yaml_path: translation/extra_canonical/2_baruch/062/004.yaml
  text: And the withholding of rain, and the famines that came to pass until women ate the fruit of their womb.
translation:
  language: ru
  text: И прекращение дождей, и голод, дошедший до того, что женщины ели плод своей утробы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܛܪܐ
  choice: дожди
  rationale: Сирийское слово обозначает дождь; во множественном русском выражении «прекращение дождей» естественно передаёт отсутствие осадков.
- source_word: fruit of their womb (consultation-layer wording; exact phrase not securely isolated in the supplied Syriac bucket)
  choice: плод своей утробы
  rationale: Сохраняет библейскую телесную образность и трагическую силу исходного выражения без смягчения.
- source_word: famines (consultation-layer wording; exact phrase not securely isolated in the supplied Syriac bucket)
  choice: голод
  rationale: В русском собирательное единственное число естественно охватывает бедствие и лучше сочетается с оборотом «дошедший до того».
theological_decisions:
- issue: Характер бедствия и крайняя степень голода
  choice: Сохранено прямое указание на то, что женщины ели плод своей утробы
  alternative: Смягчить как «ели собственных детей» или передать эвфемистически
  rationale: Прямая формулировка сохраняет ветхозаветную образность суда и не ослабляет напряжение текста.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Конструкция с повтором «и» сохраняет перечислительный ритм; «дошедший до того» естественно связывает голод с его страшнейшим последствием. Предоставленный сирийский материал представляет широкий и частично перекрывающийся фрагмент главы, поэтому границы стиха устанавливаются с опорой на контрольный английский слой.
