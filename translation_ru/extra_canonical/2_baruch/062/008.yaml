- issue: Символическое значение чёрных вод
  choice: Оставить образ без поясняющего истолкования
  alternative: Передать как эпоху зла или бедствий
  rationale: Сам стих отождествляет описанное с образом видения, но не заменяет этот образ богословским толкованием.
