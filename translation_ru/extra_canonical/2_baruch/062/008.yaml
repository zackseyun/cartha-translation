    ܕܡܚܝܒܘܬܐ. ܕܝܘܪܒܢܐ

    ܕܐܬܚܝܒܘ ܕܢܥܒܕܘܢ ܐܢܘܢ

    ܒܥ̈ܒܕܝܗܘܢ. ܡܛܠ ܕܗܟܢܐ

    ܕܐܢܫܘܬ ܡ̈ܠܟܐ ܗܘܘ ܡܢ

