    ܐܦ ܒܘ̈ܩܘܗܝ ܕܬܗܘܡܐ.

    ܘܡܫܪ̈ܘܝ ܕܪ̈ܘܚܐ. ܘܡܢܝܢܐ

    ܕܢܛ̈ܦܐ ܡܛܪܐ. ܘܐܚܝܕܘܬ

    ܕܪ̈ܘܓܙܐ. ܘܣܓܝܘ̈ܬܐ

    ܕܓܝܓ̈ܠܐ ܪܘܚܐ. ܘܫܪܪܗ

    ܕܕܝܢܐ. ܘܥܘܪܒܐ ܕܚܟܡܬܐ.

    ܘܥܘܬܪܐ ܕܣܘܟܠܬܢܘܬܐ.

    ܕܒܥ̈ܠܕܒܒܐ܂ ܘܪܢܝܐ ܝܘܡܢܐ

