    ܘܕܝܫܘܬܐ ܕܦܘܩܕܢܘܗܝ

    ܕܚܠܬ ܓܝܪ ܡܫܬܡܥܢ

    ܗܘܬ. ܘܐܢܫܐ ܕܐܬܚܝܒܘ

    ܗܟܢܐ ܟܐܘܬ ܙܒܢܐ. ܡܛܠ

    ܕܠܐ ܚܿܫܝܢ ܗܘܘ ܒܡܘܬܗܘܢ.

    ܝܬܝܪ ܡܢ ܡܠܝܘܬ ܫ̈ܢܝܐ

