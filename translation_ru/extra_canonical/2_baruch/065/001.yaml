  text: And after Manasseh, Amon arose, and in his own time he thought that the Mighty One would not call these things to account.
translation:
  language: ru
  text: После Манассии появился Амон, и в своё время он думал, что Могущественный не потребует ответа за всё это.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܒܬܪ ܕܝܢ ܡܢܫܐ ܗܘܐ
  choice: После него пришёл к власти Манассия
  rationale: Синтаксис и историческая последовательность глав указывают на появление Манассии после Езекии; формулировка «пришёл к власти» естественно передаёт воцарение, не смешивая Манассию с Амоном, который вводится в следующей главе.
- source_word: ܘܡܬܚܫܒ ܗܘܐ
  choice: и думал
  rationale: Глагольная форма обозначает внутреннее суждение или предположение; «думал» сохраняет этот смысл без оттенка публичного заявления.
- source_word: ܒܙܒܢܗ
  choice: в своё время
  rationale: Передаёт временную привязку к периоду правления Манассии и звучит естественно по-русски.
- source_word: ܚܝܒܘܬܐ
  choice: не призовёт его к ответу
  rationale: Сохраняет судебный оттенок выражения, не сужая его до одного лишь наказания или расследования.
- source_word: ܡܪܫܥܐ (вероятное чтение повреждённой/искажённой строки)
  choice: поступал нечестиво
  rationale: Соответствует контексту рассказа о Манассии и традиционному чтению этой строки; состояние представленного текста не позволяет считать графическую форму полностью надёжной.
theological_decisions:
- issue: Кто является действующим лицом стиха
  choice: Манассия, пришедший после ранее названного царя
  alternative: Амон, пришедший после Манассии
  rationale: Следующая глава отдельно начинает повествование об Амоне, тогда как глава 65 посвящена Манассии; поэтому английская формулировка с Амоном нарушает последовательность источника.
- issue: Смысл Божьего ответа на зло
  choice: «не призовёт его к ответу»
  alternative: «не накажет»
  rationale: Более широкая судебная формулировка сохраняет напряжение текста и не утверждает заранее конкретную форму воздаяния.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и торжественное. Имя ܚܝܠܬܢܐ передано традиционным титулом «Могущественный». Местоимение «его» добавлено для естественной русской связи с Манассией и смыслом привлечения к ответу.
