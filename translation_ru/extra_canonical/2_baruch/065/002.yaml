  yaml_path: translation/extra_canonical/2_baruch/065/002.yaml
  text: For he committed much impiety, and he killed the righteous, and he perverted the law, and he shed innocent blood, and he polluted the sanctuary, and he caused the people to sin.
translation:
  language: ru
  text: Ибо он совершил много нечестия, убил праведников, извратил Закон, пролил невинную кровь, осквернил святилище и ввёл народ в грех.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܛܝܬܐ
  choice: грех / нечестие
  rationale: В контексте описания деяний Манассии передаёт нравственно-религиозное зло; в первой обобщающей части по-русски естественно «нечестие», а в заключительной каузативной формуле — «грех».
- source_word: ܙܕܝ̈ܩܐ
  choice: праведников
  rationale: Обычное и точное соответствие сирийскому обозначению праведных людей.
- source_word: ܢܡܘܣܐ
  choice: Закон
  rationale: В данном иудейском контексте речь идёт не просто о правиле, а о Божьем Законе; прописная буква передаёт это без конфессионального уточнения.
- source_word: ܕܡܐ
  choice: кровь
  rationale: Сохраняет библейскую формулу о пролитии невинной крови.
- source_word: ܡܩܕܫܐ
  choice: святилище
  rationale: Нейтральный и точный религиозный термин, не сужающий значение до конкретной части храмового комплекса.
theological_decisions:
- issue: Характер нечестия Манассии
  choice: Сохранить последовательный перечень деяний без смягчения и без дополнительных толкований.
  alternative: Обобщить весь перечень как идолопоклонство или отступничество.
  rationale: Текст подчёркивает несколько самостоятельных форм зла; их нельзя сводить к одной богословской категории.
- issue: Значение слова «Закон»
  choice: Передать как «Закон» без уточнения «Моисеев».
  alternative: «Моисеев закон» или «Тора».
  rationale: Так сохраняется исходная формулировка и не вносится отсутствующее в стихе уточнение.
- issue: Причинение греха народу
  choice: «вводил народ в грех».
  alternative: «заставлял народ грешить».
  rationale: Выбранная формула сохраняет каузативный смысл, не утверждая непременно прямого принуждения.
