  register: Современный литературный русский язык с библейской торжественностью; синтаксический параллелизм перечня сохранён. Перевод следует аттестованному содержанию 2 Варуха 65:2, поскольку предоставленный страничный OCR представляет собой перекрывающийся и местами повреждённый корпус главы.
