  yaml_path: translation/extra_canonical/2_baruch/081/001.yaml
  text: 'But also hear a word of consolation. For I was mourning over Zion, and I sought mercy from the Most High, and I said, “Will these things remain for us until the end? And will these afflictions come upon us at every time?” And the Mighty One acted according to the abundance of his mercies, and he spared according to the greatness of his grace. And he revealed a word to me, that I might be strengthened, and he gave me visions, that I might not again be shaken; and he made known to me the mysteries of the times, and showed me the coming of the ages.


    Therefore, my brothers, I have written to you so that you may be comforted because of the multitude of your tribulations. For know that our Maker will require vengeance from all our enemies for all the evil things they have done against us, and that the consummation which the Most High has prepared is near, and his mercy is coming, and the completion of his judgment is not far away.


    For now we see the abundance of the prosperity of the nations while they act wickedly, but they will be reckoned like a drop. And we look at the strength of their power, but it will be accounted as spittle. We think on the glory of their greatness, while they do not keep the commandments of the Mighty One, but have treated them with contempt. And we think on the beauty that is seen, though it is shaken in afflictions, and they will be sought out like flesh in pain. And we reckon only the confidence in which they trust, though it is shaken before our eyes; but they will be crushed like a wave. And we seek only the hope of their strength, when it flourishes in the good things that God gave them; but it will be laid away, and lamentation will overtake it.'
translation:
  language: ru
  text: 'Но выслушайте также слово утешения[a]. Я скорбел о Сионе, просил милости у Всевышнего и говорил: «Неужели всё это останется с нами до конца? Неужели эти бедствия будут постигать нас во всякое время?» И Могущественный поступил по изобилию Своего милосердия и по величию Своей благодати пощадил. Он открыл мне слово, чтобы я укрепился, и дал мне видения, чтобы я впредь не колебался; Он поведал мне тайны времён и показал наступление веков.


    Поэтому, братья мои, я написал вам, чтобы вы утешились среди множества ваших бедствий. Знайте: наш Создатель взыщет со всех наших врагов за всё зло, которое они причинили нам. Близко завершение, уготованное Всевышним; приближается Его милость, и недалеко исполнение Его суда.


    Теперь мы видим великое благоденствие народов, хотя они творят зло, но оно будет сочтено лишь каплей. Мы смотрим на могущество их силы, но оно будет сочтено за слюну. Мы размышляем о славе их величия, хотя они не соблюдают заповедей Могущественного, а относятся к ним с презрением. Мы думаем о видимой красоте, хотя она колеблется среди бедствий, но народы будут разысканы, как страждущая плоть. Мы принимаем в расчёт лишь ту уверенность, на которую они полагаются, хотя она колеблется у нас на глазах, но они будут сокрушены, словно волна. Мы ищем лишь надежду, которую даёт их сила, когда она расцветает среди благ, дарованных им Богом, но она будет сокрыта, и её настигнет плач.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слово об утешении».'
    reason: Сирийское сочетание допускает прямое понимание как «слово утешения» и менее предпочтительное тематическое — «слово об утешении».
lexical_decisions:
- source_word: ܡܪܝܡܐ
  choice: Всевышний
  rationale: Устоявшийся русский библейский титул, сохраняющий смысл Божьего превознесения и высокий апокалиптический регистр.
- source_word: ܚܝܠܬܐ
  choice: Могущественный
  rationale: Сохранён отдельно от титула «Всевышний», чтобы не сглаживать различие сирийских наименований.
- source_word: ܪ̈ܚܡܘܗܝ / ܚܢܢܗ
  choice: Его милосердие / Его благодать
  rationale: Передаёт два близких, но не тождественных понятия и сохраняет их параллелизм.
- source_word: ܚܘ̈ܘܝ
  choice: видения
  rationale: Соответствует апокалиптическому контексту и параллели с открытым словом.
- source_word: ܫܘܠܡܐ / completion language
  choice: завершение / исполнение
  rationale: Сохраняет эсхатологический смысл, не сводя выражение только к хронологическому «концу».
- source_word: ܢܘܛܦܬܐ / spittle-comparison
  choice: будет сочтено плевком
  rationale: Сохраняет намеренно уничижительный и резкий образ исходного текста.
- source_word: ܩܝ̈ܡܘܗܝ / ܦܘܩܕܢܐ
  choice: заповеди
  rationale: Ясное современное соответствие, сохраняющее идею обязательного заветного установления.
theological_decisions:
- issue: Божественное возмездие
  choice: наш Создатель взыщет со всех наших врагов за всё зло
  alternative: наш Создатель отомстит всем нашим врагам
  rationale: Формулировка сохраняет суровый смысл Божьего судебного воздаяния, не придавая ему оттенка личной мстительности.
- issue: Эсхатологическая близость
  choice: Близко завершение… приближается Его милость, и недалеко исполнение Его суда
  alternative: Близок конец…
  rationale: Сохранено напряжённое сочетание близких суда и милости, а «завершение» передаёт более широкий эсхатологический смысл.
