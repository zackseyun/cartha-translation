    Теперь мы видим великое благоденствие народов, хотя они творят зло, но оно будет сочтено лишь каплей. Мы смотрим на могущество их силы, но оно будет сочтено за слюну. Мы размышляем о славе их величия, хотя они не соблюдают заповедей Могущественного, а относятся к ним с презрением. Мы думаем о видимой красоте, хотя она колеблется среди бедствий, но народы будут разысканы, как страждущая плоть. Мы принимаем в расчёт лишь ту уверенность, на которую они полагаются, хотя она колеблется у нас на глазах, но они будут сокрушены, словно волна. Мы ищем лишь надежду, которую даёт их сила, когда она расцветает среди благ, дарованных им Богом, но она будет сокрыта, и её настигнет плач.'
