  register: Современный литературный русский с умеренно торжественным повествовательным тоном. Перечень имён оформлен естественно для русского синтаксиса; повторение союзов не воспроизводится механически. Выражение «взял с собой» избегает неестественного буквального «взял» применительно к людям.
