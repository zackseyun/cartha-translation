  yaml_path: translation/extra_canonical/2_baruch/005/005.yaml
  text: And I went and took Jeremiah, Addo, Seraiah, Jabish, Gedaliah, and all the honorable men of the people, and I brought them down to the valley of Kidron, and I told them everything that had been said to me.
translation:
  language: ru
  text: И я пошёл, взял с собой Иеремию, Аддо, Сераию, Иависа, Гедалию и всех знатных людей народа, свёл их[a] в долину Кедрона и рассказал им всё, что было сказано мне.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «привёл их».'
    reason: В основном тексте «свёл» передаёт каузативный глагол движения вниз; вариант отражает менее конкретную передачу того же глагола.
lexical_decisions:
- source_word: ܢܚܬ (каузативная порода)
  choice: свёл
  rationale: Каузативное значение глагола движения вниз передано как «свёл»; это сохраняет направление спуска в долину и звучит естественно по-русски.
- source_word: ܢܚܠܐ ܕܩܕܪܘܢ
  choice: долина Кедрон
  rationale: Традиционное и понятное русское обозначение Кедронской долины; форма «Кедрон» сохраняет привычную библейскую передачу топонима.
- source_word: ܝܩܝܪ̈ܐ ܕܥܡܐ
  choice: почтенные люди из народа
  rationale: Передаёт общественное уважение и положение этих людей, не вводя более узкого официального титула.
- source_word: ܟܠ ܡܕܡ ܕܐܬܐܡܪ ܠܝ
  choice: всё, что было сказано мне
  rationale: Сохранена пассивная конструкция источника без уточнения говорящего, чтобы не устранять заложенную в тексте недосказанность.
