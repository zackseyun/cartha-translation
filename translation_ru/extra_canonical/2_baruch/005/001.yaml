review_pass:
  verdict: reject
  source_fidelity: Черновик не соответствует предоставленному сирийскому тексту 5:1. В источнике различимы, в частности, высказывание о надежде «жить/обитать в Сионе», упоминание народов, затем «тех, кого я любил и лелеял», оказавшихся «в месте их разлучения/изгнания», и заключительный вопрос. Формулировки «Сион был построен», «ненавидящие нас завладели им» и «ради Своего великого имени» не имеют достаточной опоры в данном стихе.
  naturalness: Русский текст сам по себе гладкий и выдержан в современном литературном библейском регистре, но его стилистическая удачность не может компенсировать несоответствие источнику.
  terminology: «Сион» передан нормально. Однако «ненавидящие нас» заменяет исходное упоминание любимых говорящего, а «великое имя» вводит богословски значимый мотив, отсутствующий в предоставленном сирийском тексте. Сохранение прописных букв в обращении к Богу не является проблемой, но не исправляет смыслового расхождения.
  issues:
  - severity: high
    issue: Подмена содержания стиха
    rationale: 'Черновик следует английской линии аудита, но она не согласуется с сирийским текстом на указанной странице: отсутствуют надежда жить в Сионе и судьба любимых, зато добавлены построение Сиона, захват ненавидящими и великое имя Бога.'
  - severity: high
    issue: Невозможность безопасной полной реконструкции по данному пакету
    rationale: Страница содержит трудночитаемые и, по помете самого корпуса, не вполне надежно разграниченные фрагменты; без сверки с критическим сирийским текстом и надежной сегментацией стиха нельзя ответственно предложить полный исправленный русский текст.
  - severity: medium
    issue: Английский audit trail не может быть принят как контрольный текст
    rationale: Его текст, включая восстановленную историю редакций, представляет иной смысловой текст и поэтому не должен диктовать русский перевод вопреки первичному сирийскому свидетельству.
