  yaml_path: translation/extra_canonical/2_baruch/005/001.yaml
  text: And I said, “So then, I have hoped in vain, and in vain was Zion built. For if those who hate us have taken possession of her, what will you do for your great name?”
translation:
  language: ru
  text: 'И я сказал: «Значит, напрасно я надеялся и напрасно был построен Сион. Ведь если им завладели ненавидящие нас, что Ты сделаешь ради Своего великого имени?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܣܒܪܬܝ
  choice: я надеялся
  rationale: Передаёт личную надежду говорящего без добавления оттенка уверенности или ожидания конкретного события.
- source_word: ܨܗܝܘܢ
  choice: Сион
  rationale: Устоявшаяся русская библейская форма имени; здесь обозначает город в его богословски значимом качестве.
- source_word: ܐܝܠܝܢ ܕܐܚܒܬ / контекстуальное чтение о противниках
  choice: ненавидящие нас
  rationale: Следует смыслу контекста о враждебных захватчиках и сохраняет коллективную перспективу плача Баруха.
- source_word: ܠܡܣܒ ܪܒܘ / контекст имени и величия
  choice: ради Своего великого имени
  rationale: Естественная русская передача обращения к Богу, где речь идёт о защите чести Его имени.
theological_decisions:
- issue: Смысл слов о напрасно построенном Сионе
  choice: 'Сохранён риторический плач Баруха: «напрасно был построен Сион»'
  alternative: Пояснить, что речь идёт только о земном городе, в отличие от заранее приготовленного небесного Сиона
  rationale: Сам стих выражает потрясение говорящего и не разрешает напряжение, возникшее после откровения в предыдущей главе; пояснение внутри текста преждевременно сняло бы это напряжение.
- issue: Власть врагов над Сионом
  choice: «если им завладели» — реальное историческое овладение городом
  alternative: Представить врагов лишь видимыми участниками, не обладающими Сионом в каком-либо смысле
  rationale: Вопрос Баруха признаёт захват как историческую реальность; последующий ответ Господа уточняет пределы и подчинённый характер действий врагов.
- issue: Вопрос о великом имени Бога
  choice: 'Оставлен прямой и напряжённый вопрос: «что Ты сделаешь…?»'
  alternative: Смягчить как просьбу защитить или прославить имя
  rationale: Исходная реплика имеет форму дерзновенного вопроса; превращение её в молитвенную просьбу устранило бы заложенное в тексте напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Синтаксис сделан ясным для обычного читателя; сохранены повтор «напрасно» и прямой вопрос Баруха. Местоимения обращения к Богу написаны с прописной буквы согласно распространённой русской библейской практике.
