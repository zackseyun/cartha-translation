  yaml_path: translation/extra_canonical/2_baruch/005/003.yaml
  text: And you will see with your eyes that it is not the enemies who overthrow Zion, nor those who burn Jerusalem, but that they are ministers of the Judge for a time.
translation:
  language: ru
  text: И ты своими глазами увидишь, что не враги низвергают Сион и не они сжигают Иерусалим, но лишь на время служат Судье[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «служат исполнителями суда».'
    reason: Сирийское выражение допускает как личное понимание («служат Судье»), так и отвлечённое («исполняют суд», «служат суду»).
lexical_decisions:
- source_word: ܡܒܕܩܢܐ
  choice: враги
  rationale: В данном контексте слово обозначает враждебных разрушителей; «враги» естественно передаёт их роль и согласуется с ближайшим контекстом падения Сиона.
- source_word: ܣ̇ܝܡܝܢ ܠܨܗܝܘܢ
  choice: низвергают Сион
  rationale: Конструкция описывает гибель или низложение Сиона; выбран краткий литературный оборот без добавления причинной интерпретации.
- source_word: ܡܘܩܕܝܢ ܠܐܘܪܫܠܡ
  choice: сжигают Иерусалим
  rationale: Прямое и естественное соответствие глаголу со значением «жечь, предавать огню».
- source_word: ܠܕܝ̈ܢܐ ܡ̇ܫܡܫܝܢ
  choice: служат Судье
  rationale: Передаёт агентную роль врагов как временных исполнителей высшего суда. Невокализованная сирийская форма допускает также понимание «служат суду / исполняют суд», что отмечено в сноске.
- source_word: ܒܙܒܢܐ
  choice: лишь на время
  rationale: Передаёт временную ограниченность их служения; частица «лишь» ясно выражает противопоставление, заложенное в контексте.
theological_decisions:
- issue: Враги как самостоятельные победители или орудия Божьего суда
  choice: Они не окончательные победители, а лишь временно служат Судье
  alternative: Они исполняют суд в назначенное время
  rationale: Текст отрицает их самостоятельную власть над Сионом и Иерусалимом, но не снимает напряжения между их виной и их ролью в осуществлении суда.
- issue: Личное или отвлечённое понимание ܕܝܢܐ
  choice: Судья
  alternative: суд / судебное решение
  rationale: Основной текст следует контекстуальному личному прочтению, не превращая его в явно конфессиональную формулу; лексическая неоднозначность сохранена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор местоимения «они» во второй отрицательной части устраняет синтаксическую двусмысленность; «низвергают» сохраняет достоинство стиля, а «лишь на время» подчёркивает ограниченность власти разрушителей.
