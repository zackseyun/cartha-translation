revisions:
- from: 'И Господь сказал мне: «Моё имя и Моя слава пребывают вовеки, а Мой суд в своё время отстоит своё право[a]».


    [a] Или: «сохранит за собой право».'
  to: 'И Господь сказал мне: «Моё имя и Моя слава пребывают вовеки, но Мой суд в своё время сохранит своё право[a]».


    [a] Или: «утвердит своё право».'
  rationale: Основной текст приведён к более прямой и семантически нейтральной передаче сирийского глагола «хранить/сохранять». Исправлена капитализация божественного местоимения и уточнена функция сноски. Смысл, временная оговорка и юридическая неоднозначность исходника сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T20:11:46Z'
review_pass:
  verdict: revise
  source_fidelity: 'Сирийское «Мои имя и слава ... пребывают вовеки; но Мой суд в своё время сохранит/утвердит своё право» передано в целом верно. Однако глагол «отстоит» в данном контексте звучит семантически неясно: обычно он предполагает защиту права от оспаривания, тогда как ܢܛܪ ... ܙܕܩܗ допускает более прямое «сохранит/соблюдёт своё право»; английская контрольная версия также сохраняет эту осторожную юридическую неоднозначность.'
  naturalness: 'Фраза торжественна и в целом естественна. «Моё имя и Моя слава» с разным регистром местоимения выглядит типографически непоследовательно. Более естественно: «Моё имя и Моя слава пребывают вовеки, но Мой суд в своё время сохранит своё право».'
  terminology: «Господь», «слава» и «суд» уместны. «Сохранит своё право» ближе к сирийскому и не навязывает конкретный оттенок активного судебного отстаивания. Сноска должна давать действительно отличающийся вариант, а не повторять основной смысл почти дословно.
  issues:
  - severity: medium
    issue: «Отстоит своё право» чрезмерно конкретизирует юридический образ.
    rationale: Такое выражение предполагает, что право оспаривается и суд его защищает. Сирийское nṭar («хранить, сохранять, соблюдать») и английское audit trail позволяют, но не требуют этого оттенка.
  - severity: low
    issue: Непоследовательная прописная буква в «Моё имя и Моя слава».
    rationale: При выбранном редакционном принципе почтительной прописной буквы оба притяжательных местоимения, относимые к Богу, следует оформить одинаково.
  - severity: low
    issue: Сноска почти повторяет предлагаемый основной смысл.
    rationale: После выбора более буквального «сохранит своё право» полезнее вынести в сноску интерпретирующий вариант «утвердит своё право».
  revised_text: 'И Господь сказал мне: «Моё имя и Моя слава пребывают вовеки, но Мой суд в своё время сохранит своё право[a]».


