translation:
  language: ru
  text: 'И Господь сказал мне: «Моё имя и Моя слава пребывают вовеки, но Мой суд в своё время сохранит своё право[a]».


    [a] Или: «утвердит своё право».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «утвердит своё право».'
    reason: Отражает возможный юридически более активный оттенок сирийского выражения, не делая его основным чтением.
lexical_decisions:
- source_word: ܡܪܝܐ
  choice: Господь
  rationale: Обычное и уместное в библейском русском языке соответствие сирийскому обозначению Господа.
- source_word: ܫܡܝ ... ܐܝܩܪܝ (чтение, отражённое в контрольной традиции)
  choice: Моё имя и Моя слава
  rationale: Передаёт два параллельных понятия без их отождествления; контрольный английский слой подтверждает это чтение при повреждённом OCR страницы.
- source_word: ܠܥܠܡ ܥܠܡܝܢ
  choice: пребывают вовеки
  rationale: Естественно передаёт формулу вечной длительности в современном литературном русском языке.
- source_word: ܕܝܢܝ
  choice: Мой суд
  rationale: Сохраняет возможный смысл как судебного решения, так и Божьего акта суда, не сужая его до наказания.
- source_word: ܢܛܪ ... ܙܕܩܗ
  choice: отстоит своё право
  rationale: Передаёт юридический оттенок сохранения и утверждения законного права более естественно по-русски, чем буквальное «сохранит своё право».
- source_word: ܒܙܒܢܗ
  choice: в своё время
  rationale: Сохраняет указание на надлежащий, установленный для суда срок.
theological_decisions:
- issue: Связь вечной славы Бога и своевременного осуществления суда
  choice: 'Сохранено противопоставление: «пребывают вовеки, а Мой суд в своё время…»'
  alternative: Сделать суд также явно вечным или пояснить причину его отсрочки
  rationale: Источник утверждает вечность имени и славы, но говорит об определённом времени суда; добавочное объяснение устранило бы заложенное в тексте напряжение.
- issue: Значение слова «суд»
  choice: Мой суд
  alternative: Мой приговор / Моё правосудие
  rationale: «Суд» сохраняет более широкий и богословски нейтральный диапазон исходного понятия.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис краткий и ясный; местоимения, относящиеся к Богу, написаны с прописной буквы согласно распространённой русской библейской традиции.
