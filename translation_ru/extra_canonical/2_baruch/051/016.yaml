base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/016.yaml
  text: For they chose for themselves this time that cannot pass away without anguish, and they chose for themselves that time whose end is full of laments and evils, and they rejected the world that does not age those who come to it, and they rejected the time of glory, so that they should not come to the honor of which I told you before.
translation:
  language: ru
  text: Ибо они избрали себе это время, которое не может пройти без страданий, и избрали себе то время, конец которого полон плача и бедствий. Они отвергли мир, который не старит тех, кто входит в него[a], и отвергли время славы, чтобы не прийти к той чести, о которой Я говорил тебе прежде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «который не стареет для тех, кто входит в него».'
    reason: Фиксирует возможную непереходную передачу выражения, при том что каузативная форма источника поддерживает основной перевод «не старит».
lexical_decisions:
- source_word: ܡܣܐܒ (causative form of ܣܐܒ)
  choice: не старит
  rationale: Каузативное, переходное значение передаёт мысль о том, что грядущий мир не подвергает старению входящих в него, а не просто сам не стареет.
- source_word: ܥܠܡܐ
  choice: мир
  rationale: В данном эсхатологическом контексте слово обозначает мир или век; «мир» естественно сочетается с образом входящих в него и сохраняет формулировку контекста.
- source_word: ܐܝܩܪܐ
  choice: честь
  rationale: Передаёт значение чести и почётного достоинства, не подменяя его более узким понятием награды.
theological_decisions:
- issue: Характер мира, отвергнутого нечестивыми
  choice: мир, который не старит тех, кто входит в него
  alternative: мир, который не стареет для тех, кто входит в него
  rationale: 'Выбран переходный смысл сирийского каузатива: речь идёт о воздействии грядущего мира на его обитателей. Вариант с непереходным глаголом сохранён в примечании как возможная традиционная передача.'
- issue: Связь времени славы с обещанной честью
  choice: чтобы не прийти к той чести
  alternative: и потому они не придут к той чести
  rationale: Целевая конструкция сохраняет напряжённую причинно-целевую форму текста, не превращая её в отдельный богословский вывод.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Повтор «избрали себе» сохранён ради риторического параллелизма; местоимение «Я» написано с прописной буквы как прямая речь Бога.
