translation:
  language: ru
  text: Ибо облик тех, кто ныне творит зло, станет хуже, чем теперь, чтобы они претерпели мучение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܡܘܬܗܘܢ
  choice: облик
  rationale: Слово обозначает подобие, образ или внешний вид; в контексте преображения воскресших «облик» естественно передаёт телесно-зримый аспект, не сводя его только к лицу.
- source_word: ܐܝܠܝܢ ܕܗܘܐ ܩܕܡܝܟܝܢ ܒܝܫ
  choice: тех, кто ныне творит зло
  rationale: Передаёт людей, чьё нынешнее поведение является злым; глагольная формулировка по-русски яснее буквального и неестественного «являются злыми перед вами».
- source_word: ܢܣܒܪܘܢ
  choice: претерпели
  rationale: В сочетании с «мучением» означает перенесение или выдерживание страдания; «претерпели» сохраняет возвышенный, но современно понятный регистр.
- source_word: ܬܫܢܝܩܐ
  choice: мучение
  rationale: Точно передаёт наказательное страдание без добавления отсутствующих в тексте представлений о его длительности или природе.
theological_decisions:
- issue: Связь ухудшения облика с мучением
  choice: сохранён целевой оборот «чтобы они претерпели мучение»
  alternative: «и они претерпят мучение» или «потому что им предстоит мучение»
  rationale: Сирийская конструкция выражает цель или результат; перевод не устраняет напряжённую мысль о том, что изменённый облик связан с предстоящим мучением.
translation_notes:
  register: Современный литературный русский язык с достойным апокалиптическим звучанием. «Творит зло» понятно широкому читателю, а «облик» и «претерпели мучение» сохраняют серьёзность и образность исходного текста.
