lexical_decisions:
- source_word: ܙܒܢܐ
  choice: время
  rationale: Сохраняет ключевое повторение и эсхатологический смысл исходного термина, не уточняя его как «век» или «будущее».
- source_word: 'ܟܣܝ / ܛܫܝ (смысловая форма в стихе: «скрыто»)'
  choice: скрыто
  rationale: Передаёт недоступность этого времени людям в настоящем, не добавляя идеи тайного знания.
- source_word: ܢܣܐܒ / форма со значением старения
  choice: будет … старить
  rationale: Естественно выражает действие времени как причины старения и сохраняет персонифицированную конструкцию.
theological_decisions:
- issue: Характер грядущего времени
  choice: время
  alternative: грядущий век
  rationale: Перевод не отождествляет выражение прямо с определённой богословской схемой и сохраняет повтор исходного слова.
- issue: Прекращение старения
  choice: время больше не будет их старить
  alternative: они больше не будут стареть
  rationale: Сохранена причинная роль времени, присутствующая в исходной формулировке, без расширения до общего учения о природе воскресшего тела.
translation_notes:
  register: Современный литературный русский язык; синтаксис ясный и торжественный. Повтор слова «время» сохранён намеренно как смысловой и риторический элемент.
