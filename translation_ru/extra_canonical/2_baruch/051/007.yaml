base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/007.yaml
  text: But for those who have been saved by their works, and for whom the law was hope, and understanding an expectation, and wisdom a confidence, wonders will appear in their time.
translation:
  language: ru
  text: Но тем, кто был спасён своими делами, для кого Закон был надеждой, разумение — ожиданием[a], а мудрость — уверенностью, в своё время явятся чудеса.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, при иной пунктуации: «разумение ожидания».'
    reason: Грамматическая связь соседних существительных допускает менее вероятное чтение как единого словосочетания; примечание сохраняет эту неоднозначность.
lexical_decisions:
- source_word: ܐܙܕܩܘ / source tradition reflected as “have been saved”
  choice: был спасён
  rationale: Сохраняет страдательное значение и не уточняет без необходимости, кем или каким образом совершено спасение.
- source_word: ܥܒܕܘ̈ܗܘܢ / “their works”
  choice: своими делами
  rationale: Передаёт инструментальную связь буквально, не превращая её в конфессионально нагруженную формулу «за дела» или «заслужил спасение».
- source_word: ܢܡܘܣܐ / “law”
  choice: Закон
  rationale: Заглавная буква указывает на Божий Закон в данном религиозном контексте, не добавляя более узкого толкования.
- source_word: “hope”
  choice: надеждой
  rationale: Естественный современный эквивалент, сохраняющий параллелизм ряда.
- source_word: “understanding”
  choice: разумение
  rationale: Достоинный литературный термин для способности духовно постигать; точнее в этом контексте, чем бытовое «понимание».
- source_word: “expectation”
  choice: ожиданием
  rationale: Сохраняет отдельное звено параллельной конструкции и не отождествляет его с надеждой.
- source_word: “wisdom” / ܚܟܡܬܐ
  choice: мудрость
  rationale: Прямой и устойчивый эквивалент сирийского термина.
- source_word: “confidence”
  choice: уверенностью
  rationale: Передаёт смысл внутренней уверенности без дополнительной конкретизации как «опоры» или «упования».
- source_word: “wonders”
  choice: чудеса
  rationale: Естественное обозначение необычайных божественных явлений; не сужает значение до «знамений».
theological_decisions:
- issue: Связь спасения с делами
  choice: «спасён своими делами»
  alternative: «спасён за свои дела» / «спасён благодаря своим делам»
  rationale: Формулировка сохраняет напряжение текста и не вводит идеи награды, заслуги или разработанной доктрины причинности.
- issue: Статус Закона, разумения и мудрости
  choice: 'Три параллельные именные конструкции: «Закон был надеждой, разумение — ожиданием, а мудрость — уверенностью»'
  alternative: Понимать элементы как зависимые словосочетания, например «разумение ожидания»
  rationale: Так лучше всего сохраняются синтаксический параллелизм и смысловая последовательность, отражённые в источниковой традиции, при признании возможной иной пунктуации.
- issue: Временная формула
  choice: «в своё время»
  alternative: «в их время»
  rationale: Русская идиома естественно выражает назначенное им время, не определяя, идёт ли речь о времени их жизни, преображения или будущего воздаяния.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Параллелизм исходной фразы сохранён с помощью тире; устаревшие и конфессионально маркированные обороты избегаются.
