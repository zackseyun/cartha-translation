base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/010.yaml
  text: For they will dwell in the heights of that world, and they will be made like the angels, and be made equal to the stars; and they will be changed into every form they desire, from beauty into loveliness, and from light into the splendor of glory.
translation:
  language: ru
  text: 'Ибо они будут обитать на высотах того мира, уподобятся ангелам и станут равны звёздам. Они будут преображены в любой облик, какой пожелают: от красоты — к прелести, от света — к сиянию славы.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܪܘܡܐ / «в высотах» (чтение, отражённое в контрольной традиции стиха)
  choice: на высотах
  rationale: Сохраняет пространственный образ и не заменяет его богословским толкованием вроде «на небесах».
- source_word: «будут сделаны подобными ангелам»
  choice: уподобятся ангелам
  rationale: Естественная русская формулировка передаёт итог божественного преобразования без тяжеловесного двойного пассива.
- source_word: «будут сделаны равными звёздам»
  choice: станут равны звёздам
  rationale: Сохраняет прямое сопоставление со звёздами и параллелизм с предыдущей фразой.
- source_word: ܨܘܪܬܐ / «образ, облик»
  choice: облик
  rationale: В контексте преображения «облик» звучит естественнее, чем отвлечённая «форма», и не сводит выражение к телесному устройству.
- source_word: «от красоты к loveliness»
  choice: от красоты — к великолепию
  rationale: Передаёт нарастание степени красоты и избегает неестественного повтора «от красоты к красоте».
- source_word: «сияние славы»
  choice: сияние славы
  rationale: Сохраняет библейский образ света, переходящего в более высокое проявление славы.
theological_decisions:
- issue: Характер уподобления ангелам и звёздам
  choice: Сохранено как преображение и уподобление, без утверждения, что люди буквально становятся ангелами или звёздами.
  alternative: «станут ангелами и звёздами»
  rationale: Исходная формулировка говорит о подобии и равенстве, а не о смене сущности.
- issue: Свобода желаемого облика
  choice: «в любой облик, какого пожелают»
  alternative: Ограничить преображение одним заранее заданным прославленным обликом
  rationale: Сохранена необычная и богословски напряжённая формулировка текста без её догматического сглаживания.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским ритмом. Поскольку предоставленный сирийский фрагмент обрывается до полного текста 51:10, формулировка сверена с засвидетельствованным содержанием стиха в контрольной переводной традиции; спорные образы сохранены без конфессионального истолкования.
