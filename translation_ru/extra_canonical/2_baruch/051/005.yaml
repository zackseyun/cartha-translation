base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/005.yaml
  text: 'When therefore they see that those over whom they are now exalted are then exalted and glorified more than they, then these and those will be changed: the latter into the splendor of angels, but the former will waste away yet more in wonder at the visions and at the sight of the forms.'
translation:
  language: ru
  text: 'Итак, когда они увидят, что те, кого они теперь превосходят, тогда возвышены и прославлены более них[a], и те и другие изменятся: последние обретут сияние ангелов, а первые будут ещё более изнемогать от изумления перед видениями и образами.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «увидят тех, кого они теперь превосходят, — что те тогда возвышены».'
    reason: Сирийская конструкция допускает сохранение вынесенного вперёд дополнения; основной текст передаёт её более естественным для русского языка придаточным.
lexical_decisions:
- source_word: ܢܬܬܥܝܪ … ܒܫܘܒ̈ܚܐ / ܬܬܢܗܪ … ܒܢܘܗܪܐ
  choice: возвышены и прославлены; в ангельское сияние
  rationale: Передаёт контраст славы и света в ближайшем сирийском контексте и согласуется с древней традицией текста, не сводя преображение лишь к общественному возвышению.
- source_word: forms (древняя текстовая традиция продолжения стиха)
  choice: образы
  rationale: Сохраняет конкретное и вместе с тем неоднозначное обозначение видимых форм, не уточняя без основания, чьи именно это образы.
- source_word: waste away
  choice: изнемогать
  rationale: Естественно передаёт постепенное угасание или истощение и сохраняет противопоставление славному преображению праведных.
theological_decisions:
- issue: Кто превращается в ангельское сияние, а кто изнемогает
  choice: «последние» — прежде униженные, «первые» — ныне превозносящиеся
  alternative: Поменять группы местами или назвать их прямо «праведными» и «нечестивыми»
  rationale: Таково грамматическое соотнесение групп в предложении; прямые богословские наименования не добавлены, чтобы не устранять риторическую неоднозначность текста.
- issue: Характер будущего изменения
  choice: «в ангельское сияние»
  alternative: «в великолепие ангелов»
  rationale: «Сияние» лучше соответствует световой образности ближайшего контекста, тогда как текст не утверждает прямо, что люди станут ангелами.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической прозы. Синтаксис сделан ясным, но контраст между двумя группами и неоднозначность «образов» сохранены.
