  to: 'Итак, когда они увидят, что те, кого они теперь превосходят, тогда возвышены и прославлены более них[a], и те и другие изменятся: последние обретут сияние ангелов, а первые будут ещё более изнемогать от изумления перед видениями и образами.'
  rationale: Исправлена семантическая чрезмерность «превозносятся» и сглажена неестественная русская эллиптическая конструкция. Соотношение «последних» и «первых», а также намеренная неоднозначность «образов» сохранены. Сноска приведена в соответствие с исправленным основным текстом.
