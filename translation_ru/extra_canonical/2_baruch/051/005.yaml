    rationale: Это выражение обычно обозначает надменное самовозвышение, тогда как исходный контраст говорит о тех, над кем первая группа ныне возвышена/имеет превосходство. Нейтральное «кого они теперь превосходят» не вносит лишней оценки.
  - severity: low
    issue: «Последние — в ангельское сияние»
    rationale: Эллипсис понятен, но звучит незавершённо в современном русском. Явный глагол «обретут» естественнее и сохраняет смысл будущего преображения.
