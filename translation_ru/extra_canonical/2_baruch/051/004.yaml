revisions:
- from: И более всего будут потрясены те, кто придёт после, потому что они презрели Мои законы и заткнули уши, чтобы не слышать мудрости и не принять разумения.
  to: А ещё сильнее будут потрясены те, кто отвергли Мои законы и заткнули уши, чтобы не слышать мудрости и не принять разумения.
  rationale: Исправлен добавленный смысл «придёт после», который не подтверждается сирийским текстом, и восстановлено сравнительное усиление «ещё сильнее». Сохранены множественное число «Мои законы», образ закрытых ушей и параллелизм «мудрости» — «разумения».
  reviewer_model: gpt-5.6-terra
