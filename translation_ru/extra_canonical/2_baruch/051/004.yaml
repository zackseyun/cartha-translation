  text: And above all, those who come after will be grieved, because they despised my law and stopped their ears so that they would not hear wisdom or receive understanding.
translation:
  language: ru
  text: А ещё сильнее будут потрясены те, кто отвергли Мои законы и заткнули уши, чтобы не слышать мудрости и не принять разумения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܬܬܙܝܥܘܢ
  choice: будут потрясены
  rationale: Глагол передаёт сильное потрясение или смятение; этот вариант точнее исходного образа, чем более узкое «будут скорбеть».
- source_word: ܢܡܘܣܝ̈
  choice: Мои законы
  rationale: В сирийском тексте стоит форма множественного числа с притяжательным суффиксом первого лица.
- source_word: ܚܟܡܬܐ
  choice: мудрости
  rationale: Прямое и естественное соответствие сирийскому слову «мудрость».
- source_word: ܣܘܟܠܐ
  choice: разумения
  rationale: Сохраняет значение осмысленного понимания и поддерживает параллелизм с «мудростью».
theological_decisions:
- issue: Единственное или множественное число в выражении о Божьем законе
  choice: Мои законы
  alternative: Мой Закон
  rationale: Перевод следует засвидетельствованной множественной форме и не сводит её без текстового основания к богословски более привычному единственному числу.
- issue: Характер будущего переживания отвергших закон
  choice: будут потрясены
  alternative: будут скорбеть
  rationale: Исходный глагол допускает сильное смятение или потрясение; выбранный вариант сохраняет широту значения и не ограничивает его одной скорбью.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Заткнули уши» — ясное и естественное воспроизведение конкретного образа источника; «разумение» сохраняет достоинство регистра и смысловой параллелизм.
