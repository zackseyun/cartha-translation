base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/001.yaml
  text: And it shall be, after that appointed day has passed, that then the form of those who are condemned will be changed, and also the glory of those who are vindicated.
translation:
  language: ru
  text: 'И будет так: когда минует тот назначенный день, тогда изменится облик осуждённых[a], а также слава тех, чья правота была признана.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…облик осуждённых изменится после этого…»'
    reason: 'Возможна иная синтаксическая привязка временного наречия: не к наступлению события в целом, а непосредственно к изменению облика.'
lexical_decisions:
- source_word: ܨܘܪܬܐ / ܨܘܪܬܗܘܢ
  choice: облик
  rationale: «Облик» естественно передаёт видимую форму человека в контексте будущего преображения; слово сохраняет конкретность апокалиптического образа и не сводит его лишь к внешности.
- source_word: ܐܙܕܩܘ
  choice: те, чья правота была признана
  rationale: Описательный перевод сохраняет судебный оттенок — оправдание и подтверждение правоты, — не привнося в текст позднейшую конфессиональную терминологию.
- source_word: ܝܘܡܐ … ܡܦܩܕ
  choice: назначенный день
  rationale: Передаёт день, заранее установленный или определённый, без уточнения того, кто именно назван субъектом назначения в данной фразе.
theological_decisions:
- issue: Судебный смысл праведности
  choice: «те, чья правота была признана»
  alternative: «оправданные» / «признанные праведными»
  rationale: Формулировка сохраняет эсхатологическое оправдание и не разрешает его механизм в терминах какой-либо позднейшей богословской системы.
- issue: Преображение осуждённых и оправданных
  choice: 'Сохранена параллель: меняется облик первых и слава вторых'
  alternative: Явно повторить глагол «изменится» перед словом «слава»
  rationale: Сирийская фраза сопоставляет две группы, а русское эллиптическое построение ясно передаёт общий глагол, не конкретизируя характер изменения сверх сказанного.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным апокалиптическим звучанием. Начальное «И будет так» сохраняет повествовательно-пророческий переход; «облик» и описательная судебная формула избегают как архаической тяжеловесности, так и узкоконфессиональных ассоциаций.
