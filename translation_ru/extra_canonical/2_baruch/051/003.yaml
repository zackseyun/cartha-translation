revisions:
- from: Что же до славы тех, кто ныне признан праведным по Моему Закону, кто при жизни обладал разумением и насадил в своём сердце корень мудрости, — тогда их сияние преобразится в славе[a], а облик их лиц озарится светом их красоты, чтобы они обрели и приняли мир, который не умирает и который им обещан.
  to: Что же до славы тех, кто был оправдан в своё время, кто в своей жизни обладал разумением и насадил в сердце корень мудрости, — тогда их сияние прославится в преображениях[a], а черты их лиц обратятся в свет их славы, чтобы они получили обещанный им мир, который не умирает.
  rationale: Исправлены добавления, не подтверждаемые сирийским текстом данного стиха; «красота» заменена на «слава» как соответствие ܐܝܩܪܐ. Сохранены оправдание, разумение, образ корня мудрости, вынесенная тема и различие между «славой» оправданных и «их сиянием» в основной части. Повторное «получили и приняли» сведено к естественному русскому «получили»; обещанность мира сохранена.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T21:07:36Z'
review_pass:
  verdict: revise
  source_fidelity: 'Нужна правка. В представленном сирийском тексте в этом стихе нет соответствия «ныне» или «по Моему Закону»: он говорит о тех, кто «был оправдан в своё время». Кроме того, ܐܝܩܪܗܘܢ означает «их честь/слава», а не «их красота». Следует также сохранить вынесенную тему («слава тех…») и отдельное подлежащее основной части («их сияние»).'
  naturalness: Общий строй литературен, но «обрели и приняли» неоправданно удваивает близкие глаголы и тяжеловесно. «Облик их лиц» можно сделать более естественным как «черты их лиц», не утрачивая смысла.
  terminology: «Оправдан» адекватно передаёт ܐܙܕܩܘ, но добавление «по Моему Закону» не имеет опоры в данном стихе. «Разумение» и «корень мудрости» приемлемы. Для ܐܝܩܪܗܘܢ требуется «слава» (либо «честь»), а не «красота».
  issues:
  - severity: high
    issue: Добавлены «ныне» и «по Моему Закону».
    rationale: В сирийской формулировке стиха сказано, что эти люди «были оправданы в своё время»; упоминания Божьего Закона здесь нет. Добавление меняет основание и временную характеристику оправдания.
  - severity: medium
    issue: «Свет их красоты» передаёт ܐܝܩܪܗܘܢ неточно.
    rationale: Существительное ܐܝܩܪܐ обозначает честь, достоинство, славу. В контексте эсхатологического прославления «слава» — прямое и естественное соответствие.
  - severity: medium
    issue: «Их сияние преобразится в славе» недостаточно ясно отражает образ «будет прославлено в преображениях/изменениях».
    rationale: Сирийское выражение допускает трудную, образную конструкцию с множественным числом; основной текст должен не обращать её в простое «преобразится в славе», а примечание должно сохранять возможную более буквальную передачу.
