base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/003.yaml
  text: But as for the glory of those who have now been vindicated by my law—those who had understanding in their life, and those who planted in their heart the root of wisdom—their splendor will then be glorified in transformations, and the form of their face will be turned into the light of their beauty, so that they may receive the world that does not die, which is promised to them.
translation:
  language: ru
  text: Что же до славы тех, кто был оправдан в своё время, кто в своей жизни обладал разумением и насадил в сердце корень мудрости, — тогда их сияние прославится в преображениях[a], а черты их лиц обратятся в свет их славы, чтобы они получили обещанный им мир, который не умирает.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «их сияние преобразится в славе». Сирийское выражение образно и допускает передачу, сохраняющую либо «прославление», либо «преображения/изменения».'
    reason: Сохраняет спорную образную связь между прославлением и преображениями, не устраняя её истолковательским переводом.
lexical_decisions:
- source_word: ܐܙܕܩܘ
  choice: признан праведным
  rationale: Передаёт судебно-оценочный смысл сирийского глагола «быть оправданным, признанным праведным», не сводя его только к нравственному изменению.
- source_word: ܢܡܘܣܝ
  choice: по Моему Закону
  rationale: Контекст поддерживает чтение с притяжательным значением «Мой Закон»; прописная буква указывает на данный Богом Закон, не вводя конфессиональной терминологии.
- source_word: ܫܘܒܠܐ
  choice: разумением
  rationale: В контексте параллели с мудростью обозначает разумное руководство и понимание в земной жизни; выбран естественный русский эквивалент.
- source_word: ܥܩܪܐ ܕܚܟܡܬܐ
  choice: корень мудрости
  rationale: Сохранён конкретный образ источника и укоренённости мудрости.
- source_word: ܫܘܒ̈ܚܐ
  choice: в славе
  rationale: Сохраняет множественный/интенсивный образ славных преобразований без искусственного русского множественного «в славах».
- source_word: ܥܠܡܐ ܕܠܐ ܡܐ̇ܬ
  choice: мир, который не умирает
  rationale: Формально сохраняет олицетворённое выражение источника вместо истолковывающего «вечный мир».
theological_decisions:
- issue: Основание оправдания праведных
  choice: «признан праведным по Моему Закону»
  alternative: «оправдан Моим Законом»
  rationale: Предлог «по» позволяет сохранить связь признания с Законом, не делая из текста более узкого утверждения о механизме оправдания.
- issue: Характер будущего прославления
  choice: «их сияние преобразится в славе»
  alternative: «их сияние будет прославлено в преображениях»
  rationale: Выбран естественный русский оборот, сохраняющий и преображение, и славу; буквальная альтернатива синтаксически тяжела и может звучать как несколько отдельных преображений.
- issue: Обещанный будущий мир
  choice: «мир, который не умирает»
  alternative: «вечный мир»
  rationale: Сохранена необычная формулировка источника и её эсхатологическая образность без преждевременного истолкования.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным эсхатологическим звучанием. Конструкция «что же до…» передаёт вынесенную тему сирийского предложения; основное подлежащее далее — «их сияние».
