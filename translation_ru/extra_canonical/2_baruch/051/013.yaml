  text: For the first will receive the last, those for whom they were waiting; and the last, those of whom they had heard that they had passed away.
translation:
  language: ru
  text: Ибо первые примут последних — тех, кого они ожидали, а последние — первых, о которых они слышали, что те отошли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܕܡ̈ܝܐ / ܐܚܪ̈ܝܐ (восстанавливается по контексту стиха и контрольной традиции)
  choice: первые / последние
  rationale: Сохранена взаимная временная противоположность без уточнения, идёт ли речь о поколениях, порядке смерти или воскресения.
- source_word: ܢܩܒܠܘܢ
  choice: примут
  rationale: Передаёт личную встречу и принятие одних другими естественным русским глаголом.
- source_word: ܥܒܪܘ
  choice: отошли
  rationale: Сохраняет эвфемистическую и несколько неоднозначную идею ухода из жизни, не заменяя её прямым «умерли».
theological_decisions:
- issue: Кого обозначают «первые» и «последние»
  choice: Не конкретизировать эти группы
  alternative: Истолковать их как прежде умерших праведников и праведников последних времён
  rationale: Сам стих выражается относительно и не даёт достаточных оснований для внесения такого толкования в основной текст.
- issue: Подразумеваемое дополнение во второй половине
  choice: Добавить «первых» после «последние»
  alternative: 'Оставить объект невыраженным: «а последние — тех…»'
  rationale: В русском языке добавление ясно передаёт симметричную конструкцию и взаимную встречу, не меняя её смысла.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической прозы. Синтаксический параллелизм сохранён; «отошли» намеренно оставлено как эвфемизм смерти и как отражение исходной образности.
