translation:
  language: ru
  text: Ибо сначала они увидят, а затем уйдут, чтобы терпеть мучения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܩܕܡ
  choice: сначала
  rationale: Передаёт временную последовательность, противопоставленную последующему действию.
- source_word: ܢܚܙܘܢ / ܡܬܚܙܝܢ
  choice: они увидят
  rationale: Объект видения в данном стихе не назван; русский перевод сохраняет эту неопределённость.
- source_word: ܢܐܙܠܘܢ / ܐܙܠܘ
  choice: отойдут
  rationale: Сохраняет буквальный образ ухода и торжественный повествовательный регистр.
- source_word: ܬܫܢܝܩܐ
  choice: мучение
  rationale: Сирийское слово обозначает мучение или кару; единственное число соответствует абстрактному значению.
theological_decisions:
- issue: Неуказанный объект видения
  choice: Оставить глагол «увидят» без дополнения
  alternative: Добавить «славу праведных» или иной объект из контекста
  rationale: Источник не выражает объект в самом стихе, поэтому его уточнение неоправданно снимало бы смысловую открытость.
- issue: Цель последующего ухода
  choice: «отойдут на мучение»
  alternative: «уйдут, чтобы быть мучимыми»
  rationale: Выбранная формулировка естественна по-русски и не уточняет ни деятеля наказания, ни его способ.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным и слегка торжественным синтаксисом. Последовательность «сначала… а затем…» подчёркивает структуру сирийского высказывания.
