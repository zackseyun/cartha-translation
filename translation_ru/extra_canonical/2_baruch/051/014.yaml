translation:
  language: ru
  text: Ибо они будут избавлены от этого мира страданий и сложат с себя бремя скорбей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: мир
  rationale: Обычное значение сирийского слова в эсхатологическом противопоставлении нынешнего и грядущего мира.
- source_word: ܫܘܒܠܐ / лексика избавления в продолжении фразы
  choice: избавятся
  rationale: Будущее время соответствует окружающему эсхатологическому контексту главы и передаёт освобождение из нынешнего мира.
- source_word: лексика бремени и скорби в продолжении стиха
  choice: сложат с себя бремя скорбей
  rationale: 'Естественная русская метафора сохраняет оба образа: тяжесть как бремя и множественные бедствия как скорби.'
theological_decisions:
- issue: Временная форма эсхатологического избавления
  choice: 'будущее время: «избавятся… сложат»'
  alternative: 'прошедшее результативное время: «избавлены… сложили»'
  rationale: Контекст 2 Варуха 51 описывает предстоящее преображение праведных; будущее время не превращает ожидаемое событие в уже совершившееся.
translation_notes:
  register: Современный литературный русский язык; возвышенный, но общепонятный библейский регистр. Союз «ибо» сохраняет логическую связь с предшествующим рассуждением.
