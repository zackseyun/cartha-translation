translation:
  language: ru
  text: Ради чего же тогда[a] люди утратили свою жизнь и на что те, кто был на земле, променяли свою душу?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Почему же тогда».'
    reason: Вопросительное выражение допускает как целевой оттенок («ради чего»), так и причинный («почему»).
lexical_decisions:
- source_word: ܚܝ̈ܝܗܘܢ
  choice: свою жизнь
  rationale: Сохраняет различие между «жизнью» в первой части и «душой» во второй, а также естественно передаёт притяжательное местоимение множественного числа в русском.
- source_word: ܢܦܫܗܘܢ
  choice: свою душу
  rationale: Передаёт сирийское обозначение души/самой личности, не смешивая его с «жизнью» из параллельной части.
- source_word: ܚܠܦ
  choice: променяли
  rationale: Глагол «променяли» естественно выражает обмен с оттенком утраты и сохраняет нравственное напряжение вопроса.
- source_word: ܕܥܠ ܐܪܥܐ
  choice: живущие на земле
  rationale: Идиоматическая русская передача обозначения людей, находящихся на земле; соответствует смыслу английского консультационного слоя.
theological_decisions:
- issue: Соотношение «жизни» и «души»
  choice: 'Сохранены два разных существительных: «жизнь» и «душа».'
  alternative: Передать оба выражения одним словом, например «жизнь».
  rationale: Параллелизм различает эти понятия; их уравнивание устранило бы смысловое и богословское напряжение текста.
- issue: Причинный или целевой оттенок вопроса
  choice: «Зачем же тогда» / «на что»
  alternative: «Почему же тогда» / «ради чего»
  rationale: Выбран естественный современный русский вопрос о цели или выгоде поступка, при этом альтернативный причинный оттенок отмечен в сноске.
translation_notes:
  register: Современный литературный русский; риторический параллелизм сохранён, формулировка понятна без архаизмов и не вводит конфессиональной терминологии.
