translation:
  language: ru
  text: Тогда величие праведных превзойдёт величие ангелов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪܒܘܬܐ / сравнительная формула в реконструируемом тексте стиха
  choice: величие… превзойдёт
  rationale: Передаёт не просто количественное «будет больше», а превосходство в славном состоянии праведных; при этом сохраняет прямое сравнение с ангелами.
- source_word: ܙܕܝ̈ܩܐ
  choice: праведных
  rationale: Обычное и точное соответствие сирийскому обозначению праведников в контексте эсхатологического прославления.
- source_word: ܡܠܐ̈ܟܐ
  choice: ангелов
  rationale: Прямое современное русское соответствие без конфессионального уточнения.
theological_decisions:
- issue: Характер превосходства праведных над ангелами
  choice: Сохранено общее слово «величие», без пояснения, в чём именно состоит превосходство.
  alternative: «Слава праведных превзойдёт славу ангелов» или «праведные станут выше ангелов».
  rationale: Контекст говорит о будущем прославлении праведных, но сам стих формулирует сравнение шире. Перевод не ограничивает его одной лишь внешней славой и не превращает в утверждение об иерархическом статусе.
translation_notes:
  register: Краткая, торжественная фраза на современном литературном русском. Глагольная конструкция «превзойдёт» естественнее буквального «будет больше величия», сохраняя смысл сравнительного утверждения. Представленный фрагмент первичного сирийского источника обрывается до полного текста 51:12, поэтому формулировка сверена с ближайшим контекстом главы и аудированным английским консультационным слоем.
