  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: мир
  rationale: Обычное значение в данном эсхатологическом контексте — грядущий мир, а не просто временной век.
- source_word: ܚܙܐ (предполагаемая форма по контексту стиха)
  choice: увидят
  rationale: Передаёт непосредственное созерцание ныне недоступной реальности и согласуется с параллельной структурой отрывка.
- source_word: ܟܣܐ / ܛܫܐ (предполагаемая лексема по засвидетельствованному смыслу)
  choice: скрыт
  rationale: Сохраняет смысл недоступности этого мира для нынешнего восприятия, не уточняя способ сокрытия.
theological_decisions:
- issue: Значение «того мира»
  choice: Сохранено буквальное «тот мир» без пояснения «грядущий».
  alternative: «грядущий мир»
  rationale: Указательное выражение сохраняет формулировку текста и не добавляет явного временного определения.
- issue: Характер будущего видения
  choice: «увидят»
  alternative: «узрят» или «познают»
  rationale: Современное и ясное «увидят» сохраняет образ зрительного восприятия без архаизации и богословского расширения до познания.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и естественная фраза. Представленный сирийский фрагмент обрывается до полного текста данного стиха, поэтому формулировка сверена с аудированным английским консультационным слоем и ближайшим эсхатологическим контекстом; предполагаемые сирийские лексемы отмечены как реконструируемые, а не непосредственно засвидетельствованные в предоставленном отрывке.
