base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/011.yaml
  text: For the expanses of Paradise will be spread out before them; and the beauty of the majesty of the living beings beneath the throne will be shown to them, and all the armies of the angels—those now held fast by my word so that they may not appear, and those kept by my command, to stand in their places until their arrival.
translation:
  language: ru
  text: Ибо перед ними раскинутся просторы рая; им будет явлена красота величия живых существ, что под престолом, и все воинства ангелов — и те, что ныне удерживаются Моим словом, чтобы не являться, и те, которым Моим повелением предписано оставаться на своих местах до их прибытия[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока не наступит время их явления».'
    reason: 'Финальное выражение допускает иной синтаксический и смысловой разбор: речь может идти не о прибытии лиц, а о назначенном времени явления удерживаемых ангелов.'
lexical_decisions:
- source_word: ܦܬܝܚ̈ܬܐ ܕܦܪܕܝܣܐ (reconstructed from the verse tradition; the supplied page excerpt ends before v. 11)
  choice: просторы рая
  rationale: Передаёт образ раскинувшихся областей или пространств рая естественным современным русским языком, не сводя его к «вратам» или иной более узкой конкретизации.
- source_word: ܚܝ̈ܘܬܐ
  choice: живые существа
  rationale: Сохраняет видение небесных существ под престолом и не отождествляет их без достаточного основания с животными или ангелами.
- source_word: ܚܝ̈ܠܘܬܐ ܕܡܠܐܟ̈ܐ
  choice: воинства ангелов
  rationale: Традиционно и понятно передаёт небесные множества, сохраняя организованный, величественный образ исходного выражения.
- source_word: ܐܣܝܪܝܢ / held fast
  choice: удерживаются
  rationale: Сохраняет смысл наложенного словом Божьим ограничения, не усиливая его до заключения или оков.
- source_word: ܒܕܘܟܝ̈ܬܗܘܢ
  choice: на своих местах
  rationale: Прямо передаёт назначенные ангелам места и естественно сочетается с повелением оставаться.
theological_decisions:
- issue: Кто или что названо «живыми существами под престолом»
  choice: Сохранено общее обозначение «живые существа»
  alternative: «небесные животные» или «херувимы»
  rationale: Текст описывает особых престольных существ, но не требует их дальнейшего догматического отождествления.
- issue: Отнесение притяжательного местоимения в выражении «до их прибытия»
  choice: Неоднозначное местоимение сохранено в основном тексте
  alternative: «пока не наступит время их явления»
  rationale: Источник допускает понимание как прибытия ожидаемых людей, так и наступления назначенного явления; явное разрешение референции было бы интерпретацией.
- issue: Божественная речь от первого лица
  choice: Местоимения «Моим» и «Моё» написаны с прописной буквы
  alternative: Строчная буква
  rationale: Так в русском тексте ясно обозначена речь Бога без внесения дополнительного богословского содержания.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Сохранены образность небесного престола, параллелизм двух групп ангелов и неоднозначность заключительной фразы. Предоставленный сирийский фрагмент обрывается в начале главы 51 до данного стиха, поэтому формулировка сверена с засвидетельствованной традицией текста стиха и английским аудированным слоем.
