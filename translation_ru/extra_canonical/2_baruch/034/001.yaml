base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/034/001.yaml
  text: Then I lifted up my eyes and wept, and I said at that time, “Far be it from me that I should be silent toward you or forget you. But only as far as the house of the tombs of my fathers, in affliction and in the distress of lamentation cry aloud, so that I may not be forgotten before you and afterward. And these things I have declared to you for your remembrance.”
translation:
  language: ru
  text: 'Тогда я поднял глаза, заплакал и сказал: «Не бывать тому, чтобы я перестал говорить с вами или забыл вас. Но лишь до дома гробниц моих отцов,[a] в скорби и мучительном плаче громко взывайте, чтобы я не был забыт среди вас и впредь. И это я возвестил вам для напоминания».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сирийский текст в этой части синтаксически не вполне ясен; возможно также: «Но только вы идите до дома гробниц моих отцов»; далее следует повеление взывать в скорби.'
    reason: Связь слов «вы», «до дома гробниц» и последующего повеления допускает более одного членения.
  - marker: b
    text: 'Последняя фраза может означать также: «И об этом я поведал вам, чтобы вы помнили».'
    reason: Сочетание со словом «напоминание/память» позволяет как буквальное целевое выражение, так и более свободное русское изложение.
lexical_decisions:
- source_word: ܚܣ ܠܝ
  choice: Не бывать тому
  rationale: Сирийская идиома выражает решительное отвержение мысли, а не просьбу о милости. Русское выражение сохраняет торжественную силу и естественно вводит придаточное с «чтобы».
- source_word: ܕܐܫܬܘܩܘܟܘܢ
  choice: чтобы я молчал перед вами
  rationale: Форма восходит к глаголу «молчать» и сохраняет направленность действия к слушателям, не превращая его в более широкое понятие оставления.
- source_word: ܕܐܢܫܝܢ ܡܢܟܘܢ
  choice: или забыл кого-нибудь из вас
  rationale: 'Сочетание с ܡܢܟܘܢ естественно понимается партитивно: «кого-нибудь из вас»; так точнее, чем обобщённое «забыл вас».'
- source_word: ܠܒܝܬ ܩܘ̣ܒܘܪ ܩܘ̈ܒ̣ܪܐ ܕܐܒܗܝ
  choice: до дома погребения — гробниц моих отцов
  rationale: Сохранена необычная удвоенная погребальная образность источника; тире делает её понятной по-русски, не сводя выражение к нейтральному «кладбищу».
- source_word: ܡܢ ܚܒܠܬܐ ܒܥܝܩܘܬ ܝܠܠܐ ܨܘܝܘ
  choice: громко взывайте в скорби и в мучительном плаче
  rationale: Передана накопительная риторика страдания и повелительное значение ܨܘܝܘ; ни один из основных компонентов скорби и плача не опущен.
- source_word: ܥܘܗܕܢܘܢ
  choice: чтобы вы помнили
  rationale: Корень обозначает память или памятование. Контекст позволяет передать цель предыдущего наставления простым современным выражением.
theological_decisions:
- issue: Кто должен помнить и кого не следует забывать
  choice: чтобы вы не забыли меня ни теперь, ни впоследствии
  alternative: чтобы я не был забыт перед вами и впоследствии
  rationale: Сирийский текст употребляет пассивное выражение «чтобы я не был забыт перед вами»; активная русская конструкция естественнее, но не меняет участников действия и не вводит богословского толкования.
- issue: Синтаксическая связь указания идти к гробницам отцов
  choice: пока я не достигну дома погребения
  alternative: идите лишь до дома погребения
  rationale: Переданный корпусный текст в этом месте синтаксически шероховат. Выбрано контекстуально связное чтение, при этом альтернативная возможность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной интонацией. Сохранены риторическая решительность, погребальная образность и нагнетание слов скорби; наиболее сомнительные места не сглажены без оговорки.
