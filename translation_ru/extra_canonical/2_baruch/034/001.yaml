  source_fidelity: Черновик верно передаёт решительное значение ܚܣ ܠܝ и повеление громко взывать. Однако «молчал перед вами» по-русски значит молчать в вашем присутствии, а не сохраняет направленность речи к адресатам; «пока я не достигну» добавляет действие говорящего, которого в сирийской синтаксически трудной фразе нет. Активное «чтобы вы не забыли меня» допустимо по смыслу, но пассивная конструкция точнее воспроизводит источник.
  naturalness: Предлагаемая редакция сохраняет торжественный, но современный литературный строй. «Дом гробниц моих отцов» намеренно несколько необычен, поскольку передаёт удвоенную погребальную образность оригинала; сноска поясняет спорную синтаксическую связь.
  terminology: «Не бывать тому» удачно передаёт идиому сильного неприятия. «В скорби и мучительном плаче громко взывайте» сохраняет накопление терминов страдания и императив. Формула «для напоминания» не навязывает более определённый объект памяти, чем позволяет текст.
