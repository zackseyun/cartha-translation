  text: For I know what has happened to us, but what will happen to our enemies I do not know, nor when you will visit your works.”
translation:
  language: ru
  text: Ведь я знаю, что постигло нас; но я не знаю, что произойдёт с нашими врагами и когда Ты посетишь дела Твои[a].»
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «когда Ты посетишь творения Твои». Слова «посетишь» и «дела» могут подразумевать Божье вмешательство, попечение или воздаяние по отношению к сотворённому Им.'
    reason: Сохранить и пояснить лексическую неоднозначность исходного выражения.
lexical_decisions:
- source_word: ܓܕܫܢܝ / контекстуальная форма 1-го лица
  choice: что постигло нас
  rationale: Передаёт событие, случившееся с говорящим и его народом; множественное число подтверждается английским контрольным слоем и контекстом общей беды.
- source_word: ܒܥܪܝܢ (по контексту)
  choice: наши враги
  rationale: В данном противопоставлении обозначает противников говорящего и его народа; современное русское «враги» естественно и точно.
- source_word: ܬܦܩܘܕ (реконструируется по продолжению стиха и контрольному слою)
  choice: посетишь
  rationale: 'Сохраняет библейскую многозначность глагола: обратить внимание, вмешаться, воздать или позаботиться, не уточняя преждевременно характер Божьего действия.'
- source_word: ܥܒ̈ܕܝܟ (реконструируется по продолжению стиха и контрольному слою)
  choice: дела Твои
  rationale: Формально сохраняет двусмысленность между Божьими делами и тем, что Им создано; возможное значение разъясняется в сноске.
theological_decisions:
- issue: Характер будущего Божьего «посещения»
  choice: не уточнять, будет ли это суд, воздаяние или попечение
  alternative: «когда Ты взыщешь с творений Твоих» или «когда Ты позаботишься о творениях Твоих»
  rationale: Исходная формулировка допускает несколько оттенков; конкретизация внесла бы отсутствующее в тексте богословское толкование.
- issue: Значение выражения «дела Твои»
  choice: сохранить буквальную и неоднозначную формулировку
  alternative: «творения Твои»
  rationale: Так не устраняется напряжение между значениями «совершённые Богом дела» и «созданные Им существа/творение».
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Повтор «я не знаю» сохранён ради ясного противопоставления знанию о постигшей беде и незнанию о будущем врагов. Прописная буква в «Ты/Твои» обозначает обращение к Богу и соответствует принятому русскому религиозному регистру.
