  yaml_path: translation/extra_canonical/2_baruch/024/001.yaml
  text: For look, days are coming when the books will be opened, in which the sins of all who have sinned are written, and also the storehouses in which the righteousness of all who were righteous in creation is gathered.
translation:
  language: ru
  text: 1 Вот, наступают дни, когда раскроются книги, в которых записаны грехи всех согрешивших, а также хранилища, в которых собрана праведность всех, кто был праведен в творении.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «во всём творении»; возможно также понимание: «со времени сотворения».'
    reason: Сирийское выражение допускает пространственное либо временное осмысление, и контекст не устраняет неоднозначность полностью.
lexical_decisions:
- source_word: ܟܬܒ̈ܐ / ܣܦܪ̈ܐ (по смыслу текстовой традиции)
  choice: книги
  rationale: Передаёт небесные записи суда естественным и достаточно формальным русским словом; «свитки» было бы более конкретным, чем позволяет свидетельство.
- source_word: ܓܙ̈ܐ
  choice: хранилища
  rationale: Сохраняет образ мест, где сберегается накопленное, не навязывая представление о материальных «сокровищницах».
- source_word: ܙܕܝܩܘܬܐ
  choice: праведность
  rationale: Прямо сохраняет богословски значимое понятие, не заменяя его толкованием вроде «добрые дела» или «заслуги».
- source_word: ܒܒܪܝܬܐ
  choice: в творении
  rationale: Формально отражает сирийское выражение и не устраняет его возможную смысловую широту.
theological_decisions:
- issue: Что именно собрано в хранилищах
  choice: праведность
  alternative: праведные дела / заслуги
  rationale: Исходная формулировка говорит о праведности; конкретизация как дел или заслуг внесла бы богословское истолкование.
- issue: Значение выражения «в творении»
  choice: сохранить в основном тексте буквальную формулировку
  alternative: во всём творении / со времени сотворения
  rationale: Выражение допускает различное понимание; перевод не должен без необходимости разрешать эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. «Вот» естественно передаёт вводную частицу внимания; «наступают дни» сохраняет пророческий регистр.
