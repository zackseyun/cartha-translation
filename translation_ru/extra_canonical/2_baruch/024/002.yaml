  yaml_path: translation/extra_canonical/2_baruch/024/002.yaml
  text: And at that time you will see—and the many who are with you—the forbearance of the Most High that has been through all generations, how he has been patient with all who are born, both those who sin and those who are righteous.
translation:
  language: ru
  text: 'И в то время ты увидишь — и множество тех, кто с тобой, — долготерпение Всевышнего во всех поколениях: как Он терпеливо относился ко всем рождённым — и к грешащим, и к праведным.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܗܘ̇ ܙܒܢܐ
  choice: в то время
  rationale: Естественная русская передача сирийского временного оборота без ненужного уточнения.
- source_word: ܣܘܓܐܐ
  choice: множество
  rationale: Сохраняет собирательное значение и соответствует указанию на многих, находящихся вместе с адресатом.
- source_word: ܡܥܝܪܢܘܬܐ (контекстуально восстанавливаемое понятие)
  choice: долготерпение
  rationale: Передаёт терпеливую сдержанность Всевышнего на протяжении поколений; это достоинственный и понятный современный религиозный термин.
- source_word: ܒܟܠ ܕܪ
  choice: во всех поколениях
  rationale: Сохраняет универсальный временной охват исходного выражения.
- source_word: ܚܛܝܢ ... ܡܙܕܩܦܝܢ
  choice: грешащим ... праведным
  rationale: Сохраняет противопоставление двух нравственных категорий, не усиливая его дополнительными толкованиями.
theological_decisions:
- issue: Долготерпение Всевышнего распространяется и на грешащих, и на праведных
  choice: Сохранено прямое отнесение Божьего долготерпения к обеим группам.
  alternative: Истолковать долготерпение только как терпимость к грешникам, а праведных выделить отдельно.
  rationale: Исходная формулировка намеренно объединяет обе группы; перевод не должен устранять эту богословскую напряжённость.
- issue: Обозначение Бога
  choice: Всевышний
  alternative: Высочайший
  rationale: «Всевышний» — естественное, традиционное и внеконфессиональное русское соответствие титулу Бога в апокалиптической литературе.
translation_notes:
  register: Современный литературный русский язык с достоинством, подходящим для апокалиптического религиозного текста. Вставная конструкция об окружающем Варуха множестве сохранена тире; синтаксис слегка упорядочен ради ясности без устранения смысловой неоднозначности.
