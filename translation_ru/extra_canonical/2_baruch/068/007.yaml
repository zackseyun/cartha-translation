translation:
  language: ru
  text: Но после этого падут многие народы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ
  choice: после этого
  rationale: Естественно передаёт сирийское временное выражение «после этих [событий]»; единственное число «этого» по-русски звучит плавнее и сохраняет собирательный смысл.
- source_word: ܥܡ̈ܡܐ / ܐܘ̈ܡܬܐ (контекстуально восстанавливаемое обозначение народов)
  choice: многие народы
  rationale: Соответствует смыслу стиха в контрольном переводческом слое; «народы» здесь означает этнополитические сообщества, а не отдельных людей.
- source_word: ܢܦܠܘܢ (контекстуально восстанавливаемая глагольная форма)
  choice: падут
  rationale: Будущее совершенного вида уместно для пророческого предсказания и сохраняет широкое значение падения без уточнения его характера.
theological_decisions:
- issue: Характер падения народов
  choice: падут
  alternative: будут уничтожены / потерпят поражение
  rationale: Исходная формулировка не уточняет, идёт ли речь о военном поражении, политическом крахе или гибели; нейтральное «падут» сохраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая пророческая фраза с достоинством и без избыточного уточнения. Представленный сирийский страничный фрагмент повреждён и охватывает более широкий участок главы, поэтому конкретные лексемы частично устанавливаются по контексту и контрольному слою.
