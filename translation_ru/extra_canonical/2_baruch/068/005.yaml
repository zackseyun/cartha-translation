  yaml_path: translation/extra_canonical/2_baruch/068/005.yaml
  text: And at that time, after a short interval, Zion will be rebuilt, its offerings restored, and the priests will return to their ministry.
translation:
  language: ru
  text: И в то время[a], спустя недолгий срок, Сион будет отстроен, его приношения будут восстановлены, и священники вернутся к своему служению.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И тогда».'
    reason: Допустимая более последовательная передача временного выражения.
lexical_decisions:
- source_word: ܘܒܗܘ ܙܒܢܐ
  choice: И в то время
  rationale: Передаёт временную конструкцию с указательным элементом буквально и естественно по-русски; последовательное «И тогда» также возможно.
- source_word: ܨܗܝܘܢ
  choice: Сион
  rationale: Традиционная и общеупотребительная русская передача топонима.
- source_word: ܩܘܪ̈ܒܢܝܗ̇
  choice: его приношения
  rationale: «Приношения» сохраняет более широкий культовый смысл, не сужая его без необходимости до кровавых жертв.
- source_word: ܬܫܡܫܬܗܘܢ
  choice: своему служению
  rationale: Естественно обозначает культовое служение священников и сохраняет связь служения с ними.
theological_decisions:
- issue: Характер восстановленных приношений
  choice: приношения
  alternative: жертвы
  rationale: Выбран более широкий и нейтральный культовый термин, чтобы не вносить в текст излишнее уточнение о виде жертвоприношений.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования; синтаксис ясен широкому кругу читателей, культовая терминология не перегружена архаизмами.
