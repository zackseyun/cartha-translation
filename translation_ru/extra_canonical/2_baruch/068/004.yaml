  text: And at that time they will have much joy.
translation:
  language: ru
  text: И в то время они будут очень радоваться.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܙܒܢܐ ܗܘ
  choice: в то время
  rationale: Предлог с существительным «время» и указательным местоимением передаёт отсылку к определённому времени, а не неопределённое «со временем».
- source_word: ܚܕܘܬܐ ܣܓܝܐܬܐ
  choice: очень радоваться
  rationale: Естественная русская передача сочетания со значением великой или обильной радости; она сохраняет интенсивность без тяжеловесного «иметь много радости».
theological_decisions:
- issue: Характер временной отсылки
  choice: «в то время» — конкретный период, указанный контекстом
  alternative: «со временем» или «когда-нибудь»
  rationale: Указательный элемент в сирийской фразе требует определённой отсылки; более расплывчатая передача ослабила бы её, в том числе возможный эсхатологический смысл.
translation_notes:
  register: Современный литературный русский; краткая, ясная и достойная формулировка. Местоимение «они» сохранено без уточнения референта, поскольку данный фрагмент сам его не определяет.
