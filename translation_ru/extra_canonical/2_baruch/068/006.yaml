  text: The nations also will come to honor it, but not as fully as before.
translation:
  language: ru
  text: И народы придут почтить его, но уже не в той мере, что прежде.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܢܘܢ
  choice: народы
  rationale: В данном контексте форма относится к народам; существительное восстановлено по ближайшему контексту главы и подтверждено контрольным английским слоем.
- source_word: ܐܝܩܪܐ
  choice: почтить
  rationale: Корень выражает честь или почитание; глагольная передача естественна по-русски и соответствует движению народов к объекту почитания.
- source_word: ܒܨܪ
  choice: не в той мере
  rationale: Передаёт идею уменьшения или недостатка без чрезмерно буквального и неестественного оборота.
- source_word: ܡܢ ܩܕܝܡ
  choice: что прежде
  rationale: Краткое современное соответствие временному сравнению «чем/как прежде».
theological_decisions:
- issue: Объект почитания
  choice: сохранено местоимение «его»
  alternative: 'назвать объект прямо: «город», «Сион» или «храм»'
  rationale: Предоставленный сирийский материал представляет широкий и местами повреждённый фрагмент главы, а контрольный слой сохраняет местоименную отсылку. Конкретизация могла бы необоснованно устранить неоднозначность.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная. Частица «уже» подчёркивает контраст с прежним почитанием, не добавляя конфессионального толкования.
