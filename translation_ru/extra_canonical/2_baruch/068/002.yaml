  source_fidelity: 'Сирийский фрагмент предоставлен как широкий, местами повреждённый корпус главы и не позволяет надёжно выделить формулировку данного стиха без наложения соседнего материала. Поэтому смысл стиха сверяется прежде всего с английской контрольной записью: временная последовательность, бедствие народа, всеобщая опасность и возможность совместной гибели сохранены. Перевод не превращает угрозу в уже совершившуюся или безусловно предрешённую гибель.'
  naturalness: 'Сочетание «всем им будет грозить гибель вместе» тяжеловесно и не вполне естественно: обстоятельство «вместе» относится к возможной гибели, а не к самому глаголу «грозить». Перестановка делает эту связь ясной и сохраняет современный литературный строй фразы.'
  terminology: «Бедствие» уместно в пророческом контексте и точнее передаёт тяжесть distress, чем разговорное «беда». «Твой народ» соответствует обращению к одному адресату; специальных богословских терминов и примечаний стих не требует.
