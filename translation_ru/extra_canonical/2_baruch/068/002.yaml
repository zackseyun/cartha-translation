  text: After these things a time will come when your people will fall into such distress that they will all be in danger of perishing together.
translation:
  language: ru
  text: После этого настанет время, когда твой народ окажется в таком бедствии, что всем им вместе будет грозить гибель.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ
  choice: После этого
  rationale: Передаёт временную последовательность естественно для современного русского языка.
- source_word: ܐܒܗܝܟܘܢ / контекст адресата
  choice: твой народ
  rationale: Согласовано с адресованным Варуху пророческим контекстом и консультационным английским слоем; предоставленный сирийский фрагмент охватывает более широкий и местами повреждённый блок главы.
- source_word: лексика крайнего бедствия и гибели в контексте
  choice: окажется в такой беде, что всем им будет грозить гибель вместе
  rationale: Сохраняет причинную связь, всеобщность опасности и совместный характер возможной гибели, не утверждая, что гибель уже совершилась.
theological_decisions:
- issue: Степень неизбежности гибели
  choice: будет грозить гибель
  alternative: все вместе погибнут
  rationale: Формулировка сохраняет различие между опасностью погибнуть и состоявшейся либо безусловно предрешённой гибелью.
translation_notes:
  register: Современный литературный русский язык; пророческий тон сохранён без архаизации. Местоименная форма «твой» следует обращению к одному собеседнику, а «всем им» ясно относится к народу.
