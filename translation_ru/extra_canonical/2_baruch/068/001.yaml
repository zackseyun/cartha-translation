  text: 'And the twelfth bright waters that you saw—this is the word:'
translation:
  language: ru
  text: '1 А двенадцатые светлые воды, которые ты видел, означают вот что:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ
  choice: светлые воды
  rationale: Сохраняет повторяющийся символический образ и его противопоставление тёмным водам; «светлые» естественно и точно передаёт сияние и ясность образа.
- source_word: ܗܕܐ ܗܝ ܡܠܬܐ
  choice: означают вот что
  rationale: Передаёт вводную формулу толкования («вот слово / вот смысл») естественным современным русским языком, не подменяя её указанием «вот они».
theological_decisions:
- issue: Является ли заключительная формула отождествлением вод или введением к их истолкованию
  choice: 'Формула вводит истолкование видения: «означают вот что».'
  alternative: «Вот они».
  rationale: Сирийская формула с ܡܠܬܐ («слово, дело, смысл») указывает на последующее объяснение образа, а не просто отождествляет воды с перечисленными событиями.
translation_notes:
  register: Современный литературный русский; фраза торжественна, но понятна. Порядок слов сохраняет связь определения «двенадцатые светлые» с символом вод, а двоеточие вводит дальнейшее толкование.
