- source_word: ܗܠܝܢ ܐܢܘܢ
  choice: Это те
  rationale: Передаёт указательно-отождествительную конструкцию естественно для современного русского языка и связывает её с ранее увиденным образом.
- source_word: ܡ̈ܝܐ … ܢܘܗܪܐ
  choice: светлые воды
  rationale: Контекст главы противопоставляет светлые и тёмные воды; «светлые» сохраняет образ и не сужает его до значения «чистые» или «сияющие».
- source_word: ܕܐܬܚܙܝܬ
  choice: которые ты видел
  rationale: Естественная русская передача обращения к Баруху с отсылкой к прежнему видению.
