  text: Nevertheless, they will be saved, and their enemies will fall before them.
translation:
  language: ru
  text: Однако они будут спасены, и их враги падут перед ними.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܬܦܪܩܘܢ (контрольное чтение стиха)
  choice: будут спасены
  rationale: Передаёт пассивную форму и не уточняет, идёт ли речь об избавлении в исторических обстоятельствах или о спасении в более широком смысле.
- source_word: ܢܦܠܘܢ ܩܕܡܝܗܘܢ (контрольное чтение стиха)
  choice: падут перед ними
  rationale: Сохраняет образное выражение источника о поражении врагов, не подменяя его более узким толкованием вроде «будут убиты».
- source_word: ܒܪܡ / связка противопоставления (контрольное чтение стиха)
  choice: однако
  rationale: Естественно передаёт противопоставление предыдущему контексту в современном литературном русском языке.
theological_decisions:
- issue: Характер спасения
  choice: Сохранено неопределённое «будут спасены».
  alternative: «будут избавлены»
  rationale: Контекст может подразумевать историческое избавление, однако более буквальное «спасены» сохраняет смысловую широту и не навязывает исключительно земное либо эсхатологическое понимание.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная фраза с сохранением параллелизма и исходной смысловой неопределённости. Конкурирующее чтение о «падении многих народов» не принято, поскольку согласно последней сверке оно относится к 68:6, а не к 68:3.
