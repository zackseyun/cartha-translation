- from: 'И я сказал: «Для кого и для скольких будет всё это? И кто будет признан достойным увидеть то время?[a]


    Я выскажу Тебе всё, о чём думаю, и спрошу Тебя о тех из Твоего народа, которых я видел во множестве: они отступили от Твоего завета и сбросили с себя ярмо Твоего Закона.


