  yaml_path: translation/extra_canonical/2_baruch/041/001.yaml
  text: 'And I said, “For whom and for how many will these things be? And who will be counted worthy to see that time?[a]

    But I will speak with you of all that I think, and I will ask of you concerning those of your people whom I have seen in great number, who withdrew from your covenant and cast from themselves the yoke of your law.

    But others again I have seen who left their vanity[b] and fled beneath your wings.

    What then will happen to these? Or how will that last time receive them?

    Or will the time of these perhaps be weighed, and as the balance inclines, so will they be judged?”'
translation:
  language: ru
  text: 'И я сказал: «Для кого и для скольких будет всё это? И кто будет признан достойным увидеть то время?[a]


    Я выскажу Тебе всё, о чём думаю, и спрошу Тебя о тех из Твоего народа, которых я видел великое множество: они отступили от Твоего завета и сбросили с себя ярмо Твоего Закона.


    Но я видел и других: они оставили свою суету[b] и укрылись под Твоими крыльями.


    Что же будет с ними? И как примет их то последнее время?


    Или, быть может, будет взвешено их время и, смотря куда склонятся весы, их будут судить?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В сохранившемся сирийском тексте границы этого места не вполне ясны: данный фрагмент перекрывает конец 40-й и начало 42-й главы. Смысл вопроса ясен, а его точная граница уточняется по контрольному изданию Кмоско.'
    reason: textual_variant
  - marker: b
    text: 'Сирийское чтение в этой строке не вполне надёжно из-за локальной неясности распознавания в издании Ceriani; перевод «свою суету» подтверждается латинским контрольным свидетельством Кмоско. Возможный смысл: «свою тщету» или «своё заблуждение».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ܩܝܡܐ / ܩܝܡ̈ܐ (текст повреждён при распознавании)
  choice: Твоего завета
  rationale: В данном иудейском апокалиптическом контексте «завет» естественно передаёт смысл обязательства и верности, засвидетельствованный также контрольным чтением.
- source_word: ܢܡܘܣܐ
  choice: Закона
  rationale: Сочетание «ярмо Закона» сохраняет устойчивый образ, а также заветный и нормативный смысл слова.
- source_word: ܡܘܒܠܐ / локально неясное чтение
  choice: свою суету
  rationale: Контрольное свидетельство поддерживает значение «суета, тщета»; перевод сохраняет нравственно-духовную пустоту, не уточняя её сверх источника.
- source_word: ܓܢܦ̈ܐ / выражение, подтверждаемое контрольным свидетельством
  choice: под Твоими крыльями
  rationale: Буквальный образ Божьего покрова сохранён вместо отвлечённого «под Твоей защитой».
- source_word: ܡܬܬܚܒܘ / выражение взвешивания (чтение распознано неуверенно)
  choice: будет взвешено
  rationale: Последующее упоминание склоняющейся чаши весов подтверждает именно метафору взвешивания при суде.
theological_decisions:
- issue: Участь отступивших от завета и возвратившихся под Божий покров
  choice: Сохранён открытый вопрос, обращённый к Богу, без предварительного ответа.
  alternative: Заранее вынести однозначный приговор одной или обеим группам.
  rationale: В этом месте Варух спрашивает, как последнее время примет этих людей; ответ следует далее, поэтому напряжение повествования не снимается.
- issue: Образ «под Твоими крыльями»
  choice: Сохранена буквальная метафора Божьего убежища.
  alternative: 'Передать отвлечённо: «под Твоей защитой».'
  rationale: Образ показывает покаяние как бегство под Божий покров, а не только как нравственное исправление.
- issue: Кого обозначает выражение в заключительном вопросе
  choice: Передано «тех и других», чтобы связать взвешивание с двумя ранее названными группами, при сохранении вопросительной формы.
  alternative: 'Передать буквально, но менее ясно: «время этих».'
  rationale: Контекст перечисляет две группы, однако сам текст не выносит решения об их участи; уточнение относится лишь к связи местоимения с контекстом.
translation_notes:
  register: Современный литературный русский язык с торжественной библейской интонацией. Местоимения, обращённые к Богу, написаны с прописной буквы. Образы «ярмо Закона», «под Твоими крыльями» и весов сохранены; синтаксис сделан понятным без устранения эсхатологической и судебной неопределённости.
