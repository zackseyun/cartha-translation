  text: while they themselves are reckoned among the heaps of sins, and the evil of their forms wastes away still more. For first they see, and afterward they go away to be tormented.
translation:
  language: ru
  text: Сами же они причисляются к грудам грехов, а зло их обликов[a] всё больше истлевает. Ибо сначала они видят, а затем уходят на мучение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «зло их обликов»; возможно также: «безобразие их обликов».'
    reason: Сирийское выражение необычно и допускает как более формальное, так и качественное понимание.
lexical_decisions:
- source_word: ܓܘܡܥܐ ܕܚ̈ܛܗܐ
  choice: грудам грехов
  rationale: Сохраняет конкретный образ скопления или груды, присутствующий в сирийском выражении, не заменяя его отвлечённым «множеством».
- source_word: ܒܝܫܬܐ ܕܕܡ̈ܘܬܐ
  choice: зло их облика
  rationale: Формально передаёт сочетание «зло/дурное [свойство] обликов» и сохраняет трудность исходной метафоры; местоимение «их» следует контексту и английскому контрольному слою.
- source_word: ܢܫܘܚܘܢ
  choice: истлевает
  rationale: Передаёт постепенное разрушение или угасание формы; наречие ܝܬܝܪܐܝܬ отражено словами «всё больше».
- source_word: ܢܫܬܢܩܘܢ
  choice: на мучение
  rationale: Глагольная форма обозначает подвергание мучению; конструкция «уходят на мучение» естественна по-русски и сохраняет последовательность действий.
theological_decisions:
- issue: Что именно видят осуждённые перед мучением
  choice: оставить объект глагола «видят» невыраженным
  alternative: уточнить, что они видят участь праведных или грядущий суд
  rationale: В данном стихе объект в сирийском тексте не назван; его конкретизация снимала бы намеренную контекстуальную недосказанность.
- issue: Образ «груд грехов»
  choice: сохранить буквальный коллективный образ
  alternative: перевести как «множество грешников» или «совокупность грехов»
  rationale: Исходный текст связывает осуждённых именно со скоплениями грехов; богословски истолковывать эти скопления как определённую группу лиц без прямого основания не следует.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной эсхатологической лексикой. Синтаксис сохраняет последовательность и причинную связь оригинала; неоднозначный объект «видят» не восполнен.
