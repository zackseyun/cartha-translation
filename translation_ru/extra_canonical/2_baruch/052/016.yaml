  text: For they have been delivered from this world of affliction and have laid down the burden of distresses.
translation:
  language: ru
  text: Ибо они были избавлены от этого мира страданий и сложили с себя бремя бедствий.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܦܨܝܘ
  choice: были избавлены
  rationale: Пассивная форма сохраняет подразумеваемого, но не названного деятеля и передаёт совершившееся избавление.
- source_word: ܥܠܡܐ ܕܐܘܠܨܢܐ
  choice: мир страданий
  rationale: Сочетание передаёт мир, характеризуемый скорбью, притеснением и страданием; «страданий» естественно в современном русском контексте.
- source_word: ܐܢܝܚܘ ܡܢܗܘܢ
  choice: сложили с себя
  rationale: Идиоматический русский оборот точно выражает прекращение несения тяжёлой ноши.
- source_word: ܛܘܥܢܐ ܕܥܩ̈ܬܐ
  choice: бремя бедствий
  rationale: Сохраняется образ ноши; множественное число передаёт совокупность тягот и невзгод.
theological_decisions:
- issue: Кем совершено избавление
  choice: 'Сохранён безличный пассив: «были избавлены»'
  alternative: «Бог избавил их»
  rationale: В сирийском тексте деятель не назван; его явное отождествление с Богом было бы богословски вероятным, но текстуально добавленным уточнением.
translation_notes:
  register: Современный литературный русский язык с торжественным, но ясным звучанием; параллелизм двух частей и метафора бремени сохранены.
