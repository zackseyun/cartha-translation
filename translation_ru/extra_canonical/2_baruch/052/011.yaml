  text: But for those who were delivered by their works, and for whom the law was hope, and understanding expectation, and wisdom confidence, and purity a crown,
translation:
  language: ru
  text: А те, кто был избавлен благодаря своим делам, для кого Закон стал надеждой, разумение — упованием, а мудрость — стойкостью,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܦܨܝܘ
  choice: были избавлены
  rationale: Страдательная форма передаёт избавление или спасение; «избавлены» сохраняет смысл, не усиливая здесь специальную богословскую терминологию.
- source_word: ܒܥ̈ܒܕܝܗܘܢ
  choice: благодаря своим делам
  rationale: Предлог ܒ допускает инструментально-причинный смысл; такая передача естественна по-русски и сохраняет напряжение исходной формулировки, не переосмысливая роль дел.
- source_word: ܢܡܘܣܐ
  choice: Закон
  rationale: В контексте речь идёт о Законе как определённой нравственно-религиозной реальности; прописная буква помогает передать это употребление.
- source_word: ܣܒܪܐ
  choice: надеждой
  rationale: Обычное значение — надежда; именная метафора сохранена.
- source_word: ܣܘܟܠܐ
  choice: разумение
  rationale: Передаёт способность понимать и полученное понимание, сохраняя возвышенный, но современно понятный регистр.
- source_word: ܬܘܟܠܢܐ
  choice: упованием
  rationale: Слово обозначает доверие, уверенность или опору; «упование» поддерживает параллелизм с «надеждой», не сводя оба понятия к одному слову.
- source_word: ܚܟܡܬܐ ܡܚܡܣܢܘܬܐ
  choice: мудрость — стойкостью
  rationale: В представленном сирийском тексте прямо стоят «мудрость» и «стойкость/терпение». Поэтому чтение консультационного английского слоя «чистота — венцом» не принято как не подтверждаемое данным первичным текстом.
theological_decisions:
- issue: Связь избавления с делами
  choice: «избавлен благодаря своим делам»
  alternative: «избавлен своими делами»
  rationale: Сохранена исходная причинно-инструментальная связь без добавления оговорок, которые разрешили бы богословское напряжение вместо текста.
- issue: Расхождение сирийского источника с английским консультационным слоем
  choice: «мудрость — стойкостью»
  alternative: «чистота — венцом»
  rationale: Приоритет отдан явно засвидетельствованному чтению ܘܚܟܡܬܐ ܡܚܡܣܢܘܬܐ; альтернативная английская редакция не поддерживается предоставленным сирийским фрагментом.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясным риторическим параллелизмом. Конечная запятая сохранена, поскольку стих синтаксически продолжается в следующем стихе.
