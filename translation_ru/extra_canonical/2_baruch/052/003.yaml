  yaml_path: translation/extra_canonical/2_baruch/052/003.yaml
  text: And it shall be, when they recognize one another—those who now know one another—that then the appearance of those who are now condemned will become more dreadful.
translation:
  language: ru
  text: 'И будет так: когда узнают друг друга те, кто теперь знают друг друга, облик ныне осуждённых станет страшнее, чем прежде.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܝܕܥܘ ܚܕ ܠܚܕ
  choice: узнают друг друга
  rationale: Взаимная конструкция передана естественным русским выражением; контекст подразумевает узнавание после воскресения, а не простое получение сведений.
- source_word: ܚܙܘܗ
  choice: облик
  rationale: Передаёт видимую внешность или явление лица, не сужая смысл до одного лишь выражения лица.
- source_word: ܐܝܠܝܢ ܕܡܩܕܡܝܢ ܐܡܝܢ
  choice: ныне осуждённых
  rationale: Выбор следует удостоверенному английскому консультационному слою и сохраняет судебно-эсхатологический смысл данного места; наречие «ныне» связывает состояние этих людей с текущим временем повествования.
- source_word: ܢܒܛܠ
  choice: станет ещё ужаснее
  rationale: Контекстуально передано усиление устрашающего вида осуждённых; «ещё» естественно выражает сравнительное усиление в русском.
theological_decisions:
- issue: Состояние нечестивых после взаимного узнавания воскресших
  choice: «облик ныне осуждённых станет ещё ужаснее»
  alternative: «тогда усилится суд»
  rationale: Выбранное чтение соответствует предоставленному аудированному POB-слою и ближайшему контексту о преображении внешнего облика, не добавляя описания природы или вечности наказания.
translation_notes:
  register: Современный литературный русский с торжественным, но ясным синтаксисом. Повтор «друг друга» сохранён ради смыслового противопоставления нынешнего знакомства и будущего узнавания.
