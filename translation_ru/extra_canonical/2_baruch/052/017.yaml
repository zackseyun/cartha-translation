review_pass:
  verdict: revise
  source_fidelity: 'В доступном сирийском фрагменте непосредственно засвидетельствовано начало вопроса: «Итак, чем/посредством чего они погубили свои жизни…». Английский контрольный слой продолжает параллелизм вопросом о том, за что обитатели земли отдали (обменяли) душу. Русский «из-за чего» сдвигает значение ܒܡܢܐ от средства/основания к причине; нейтральное «чем» точнее и сохраняет вопросительную двусмысленность оригинала.'
  naturalness: «Чем же люди погубили свою жизнь и за что отдали свою душу те, кто был на земле?» — естественная современная литературная фраза. «Те, кто был на земле» точнее передаёт английское audit trail «were on the earth», не превращая временную характеристику в «жил».
  terminology: Различение «жизнь» и «душа» следует сохранить. «Отдали свою душу» хорошо передаёт обменный смысл, не навязывая конкретного богословского толкования. Распределительное единственное число («свою жизнь», «свою душу») при «люди/те, кто» допустимо.
  issues:
  - severity: medium
    issue: «Из-за чего» вместо «чем»
    rationale: Сирийское ܒܡܢܐ в засвидетельствованной части буквально спрашивает «чем?/посредством чего?». «Из-за чего?» интерпретирует его как исключительно причинное и сужает формулировку.
  - severity: low
    issue: «те, кто жил на земле»
    rationale: Контрольный английский текст говорит «those who were on the earth»; «жил на земле» добавляет более сильный и иной временно-экзистенциальный оттенок. «Был на земле» сохраняет нейтральность.
  - severity: low
    issue: «променяли»
    rationale: Слово допустимо, но «отдали … за что» воспроизводит вопросительную структуру «for what … exchange» и естественнее сочетается с «душу».
  revised_text: Чем же люди погубили свою жизнь и за что отдали свою душу те, кто был на земле?[a]
