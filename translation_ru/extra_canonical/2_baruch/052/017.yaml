  text: By what, then, did people lose their life, and for what did those who were on the earth exchange their soul?
translation:
  language: ru
  text: Чем же люди погубили свою жизнь и за что отдали свою душу те, кто был на земле?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный сирийский фрагмент обрывается после слов «Чем же они погубили свои жизни, и…». Окончание стиха передано по контрольному английскому слою, отражающему продолжение текста.
    reason: Примечание указывает на физическую неполноту предоставленного сирийского фрагмента и на источник восстановления второй части стиха.
lexical_decisions:
- source_word: ܒܡܢܐ
  choice: из-за чего / на что
  rationale: В первом вопросе сочетание с глаголом «погубили» естественно передаётся как причина — «из-за чего»; во второй параллельной части, засвидетельствованной консультационным слоем, речь идёт об обмене, поэтому по-русски естественно «на что».
- source_word: ܐܘܒܕܘ
  choice: погубили
  rationale: Глагол означает «потерять, погубить, уничтожить». «Погубили свою жизнь» сохраняет активную ответственность действующих лиц и звучит естественнее буквального «потеряли посредством чего».
- source_word: ܚܝܝ̈ܗܘܢ
  choice: свою жизнь
  rationale: Сирийская форма буквально имеет множественное число «их жизни», но при русском собирательном «люди» распределительное единственное число «свою жизнь» естественно и не меняет смысла.
- source_word: ܗܟܝܠ
  choice: же
  rationale: Передаёт выводно-переходный оттенок частицы «итак, следовательно, же» без утяжеления вопроса.
theological_decisions:
- issue: Соотношение «жизни» и «души»
  choice: сохранить оба разных обозначения без их отождествления
  alternative: унифицировать оба как «жизнь» либо истолковать «душу» конфессионально
  rationale: Параллелизм текста допускает смысловую близость, но не требует полного тождества; перевод сохраняет богословское напряжение исходной формулировки.
- issue: Ответственность людей за утрату жизни
  choice: «погубили свою жизнь»
  alternative: «лишились жизни»
  rationale: Активная глагольная форма указывает не только на постигшую их утрату, но и на их участие в ней; пассивная формулировка ослабила бы этот оттенок.
translation_notes:
  register: Современный литературный русский язык; вопросительная конструкция сохранена, синтаксис сделан плавным и понятным без устранения параллелизма «жизнь — душа».
