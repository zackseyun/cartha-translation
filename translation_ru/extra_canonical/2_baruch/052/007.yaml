revisions:
- from: Тогда их сияние прославится в преображениях, и облик их лиц преобразится в свет их красоты, чтобы они обрели и приняли неумирающий мир, обещанный им.[a]
  to: Тогда в преображениях будет прославлено их сияние, и облик их лиц преобразится в свет их славы, так что они обретут и примут неумирающий мир, обещанный им.[a]
  rationale: Исправлены значение ܐܝܩܪܐ («слава») и будущая перспектива заключительных глаголов. Сноска сохранена как требуемый след английского аудита, но её основание сформулировано без неподтверждённого заявления о рукописной вариативности.
