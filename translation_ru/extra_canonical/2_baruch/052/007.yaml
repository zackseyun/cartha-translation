  yaml_path: translation/extra_canonical/2_baruch/052/007.yaml
  text: then their splendor will be glorified in transformations, and the form of their faces will be changed into the light of their beauty, so that they may acquire and receive the world that does not die, which is promised to them.
translation:
  language: ru
  text: Тогда в преображениях будет прославлено их сияние, и облик их лиц преобразится в свет их славы, так что они обретут и примут неумирающий мир, обещанный им.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Тогда их сияния пробудятся, и облик их лиц засияет светом их славы».'
    reason: Сохраняет альтернативную формулировку из английского аудиторского следа; это не утверждение о рукописном варианте.
lexical_decisions:
- source_word: ܫܘܚܠܦ̈ܐ (šūḥlāpē)
  choice: преображениях
  rationale: Передаёт множественное число и смысл изменений облика, не сводя выражение лишь к сиянию.
- source_word: ܨܘܪܬܐ (ṣurtā)
  choice: облик
  rationale: В сочетании с «лиц» естественнее современного русского «форма» и сохраняет значение видимого образа.
- source_word: ܥܠܡܐ ܕܠܐ ܡܐܬ
  choice: неумирающий мир
  rationale: Сохраняет конкретную отрицательную формулировку источника — мир, который не умирает, — без замены её более отвлечённым «вечный мир».
- source_word: ܢܣܒܘܢ ܘܢܩܒܠܘܢ
  choice: обрели и приняли
  rationale: Сохраняет парность исходных глаголов; «обрели» по-русски естественнее буквального «взяли» в данном контексте.
theological_decisions:
- issue: Характер будущего преображения праведных
  choice: Сохранено образное описание сияния, преображений и изменения облика без догматического уточнения природы воскресшего тела.
  alternative: Истолковать выражение как прямое утверждение об ангельской или нетленной телесности.
  rationale: Стих описывает результат образами, но не определяет его в систематических богословских категориях.
- issue: Значение «мира, который не умирает»
  choice: неумирающий мир
  alternative: вечный мир
  rationale: Более буквально сохраняет напряжённую персонифицированную формулировку источника и не подменяет её привычным богословским термином.
translation_notes:
  register: Современный литературный русский с торжественной апокалиптической образностью. Синтаксис сделан ясным для широкого читателя, при этом сохранены последовательные образы преображения, света и неумирающего мира.
