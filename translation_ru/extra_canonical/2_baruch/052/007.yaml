review_pass:
  verdict: revise
  source_fidelity: Основной смысл передан, включая множественное число «преображения» и два будущих глагола получения. Однако «красоты» не соответствует сирийскому ܐܝܩܪܐ (слава, честь, величие), а прошедшее «обрели» нарушает будущую временную перспективу ܢܣܒܘܢ ܘܢܩܒܠܘܢ.
  naturalness: «Их сияние прославится в преображениях» грамматически возможно, но тяжеловесно. Перестановка «в преображениях будет прославлено их сияние» делает фразу несколько яснее, сохраняя образ и смысл.
  terminology: Для ܐܝܩܪܐ следует «слава», а не «красота». «Неумирающий мир» уместно сохраняет намеренно конкретный образ источника.
  issues:
  - severity: medium
    issue: «свет их красоты»
    rationale: Сирийское ܢܘܗܪܐ ܕܐܝܩܪܗܘܢ означает «свет их славы/чести», а не «свет их красоты».
  - severity: medium
    issue: «чтобы они обрели и приняли»
    rationale: Оба глагола в источнике имеют будущее значение; требуется «чтобы они обрели и приняли» только при будущем главном действии, но форма «обрели» в данном синтаксисе двусмысленно-прошедшая. Явное «чтобы обрести и принять» или «так что они обретут и примут» точнее.
  - severity: low
    issue: Обоснование сноски
    rationale: Альтернативный вариант является следом прежней английской передачи, а не установленным рукописным вариантом; причина не должна утверждать неподтверждённую текстологическую вариативность.
  revised_text: Тогда в преображениях будет прославлено их сияние, и облик их лиц преобразится в свет их славы, так что они обретут и примут неумирающий мир, обещанный им.[a]
