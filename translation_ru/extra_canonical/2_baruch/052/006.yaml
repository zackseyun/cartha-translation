  text: But the glory of those who were justified in their time, and those who had understanding in their life, and those who planted in their heart the root of wisdom—
translation:
  language: ru
  text: А слава тех, кто был оправдан в своё время, кто имел надежду в своей жизни и кто насадил в своём сердце корень мудрости, —
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܙܕܩܘ
  choice: были оправданы
  rationale: Сохраняет страдательную форму сирийского глагола и не уточняет, кем или на каком основании они были оправданы.
- source_word: ܫܘܒܠܐ
  choice: разумение
  rationale: В данном перечислении праведных качеств слово передаёт внутреннее нравственно-духовное руководство или понимание; «разумение» естественно согласуется с параллельным образом корня мудрости, не сужая смысл до учёности.
- source_word: ܥܩܪܐ ܕܚܟܡܬܐ
  choice: корень мудрости
  rationale: Буквально сохраняет метафору источника и укоренённости мудрости.
- source_word: ܢܨܒܘ
  choice: насадил
  rationale: Передаёт сельскохозяйственный образ намеренного укоренения; русское единственное число согласовано с повторяющимся обобщённым «кто».
theological_decisions:
- issue: Значение страдательной формы «были оправданы»
  choice: Не указывать деятеля оправдания и не объяснять его механизм.
  alternative: «Кого Бог оправдал» или «кто оказался праведен».
  rationale: Источник оставляет деятеля и основание невыраженными; перевод сохраняет эту богословскую открытость.
- issue: Связь стиха со следующим предложением
  choice: Завершить стих тире, показывая синтаксическое продолжение.
  alternative: Поставить точку и превратить фрагмент в самостоятельное предложение.
  rationale: Сирийский текст продолжает мысль в следующем стихе сказуемым о пробуждении в славе; тире предотвращает искусственное завершение фразы.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Параллельная конструкция с повтором «кто» сохраняет ритм перечисления; архаизмы и конфессионально окрашенные пояснения исключены.
