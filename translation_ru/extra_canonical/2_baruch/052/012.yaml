base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/012.yaml
  text: Wonders will appear to them in their time. For they will see that world which is now invisible to them, and that time which is now hidden from them.
translation:
  language: ru
  text: В свой срок им явятся чудеса[a]. Ведь они увидят тот мир, который им не виден, и то их время, которое от них сокрыто.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «им будут явлены чудеса».'
    reason: Сирийская страдательная форма может подчёркивать не самостоятельное появление чудес, а то, что они станут видимы или будут показаны людям.
lexical_decisions:
- source_word: ܬܡܝ̈ܗܬܐ
  choice: чудеса
  rationale: Сирийское множественное число обозначает дивные, чудесные явления; «чудеса» естественно и точно передаёт смысл в данном эсхатологическом контексте.
- source_word: ܢܬܚܙܝܢ ܠܗܘܢ
  choice: им явятся
  rationale: Форма допускает значение «станут видимы им / будут явлены им»; «явятся» сохраняет образ видимого раскрытия и звучит естественно по-русски.
- source_word: ܒܙܒܢܗܝܢ
  choice: в своё время
  rationale: Буквально — «в их время/времена» с согласованием с «чудесами»; русская идиома «в своё время» передаёт наступление назначенного срока без излишнего уточнения.
- source_word: ܗ̇ܘ ܥܠܡܐ
  choice: тот мир
  rationale: Сохраняет указательное значение и противопоставление нынешней невидимости будущему видению.
- source_word: ܙܒܢܐ ܗ̇ܘ ܕܝܠܗܘܢ
  choice: то их время
  rationale: Формально сохраняет притяжательное «их» и не истолковывает его как непременно «уготованное» или «назначенное» время.
- source_word: ܒܣܝܡ ܡܢܗܘܢ
  choice: было от них сокрыто
  rationale: По контексту и консультационному слою выражение обозначает скрытость от них; выбран литературный русский оборот, не добавляющий «ныне», которого в данной фразе явно нет.
theological_decisions:
- issue: Характер будущего видения
  choice: «увидят тот мир»
  alternative: «видят тот мир»
  rationale: Сирийский текст употребляет форму настоящего времени, способную иметь живое или пророческое значение; русское будущее согласует фразу с предшествующим будущим явлением чудес, не превращая видение в уже происходящее событие.
- issue: Значение «их времени»
  choice: сохранено буквальное «их время»
  alternative: «уготованное им время»
  rationale: Источник не объясняет здесь, является ли это сроком награды, грядущим веком или иной назначенной порой; буквальная формулировка сохраняет богословскую открытость.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для широкого читателя; указательные слова и неопределённость выражения «их время» сохранены.
