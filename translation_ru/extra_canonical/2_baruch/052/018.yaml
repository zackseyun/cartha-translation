base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/018.yaml
  text: For they chose for themselves this present time, which cannot pass apart from anguish, and they chose for themselves that time whose outcomes are full of groanings and evils; and they rejected the world that does not age those who come to it, and they rejected the time of glory, so that they might not come to the honor of which I told you before.
translation:
  language: ru
  text: Ибо они избрали для себя нынешнее время, которое не может миновать без мучений, и избрали для себя то время, исход которого полон стенаний и бед. Они отвергли мир, который не старит вступающих в него[a], и отвергли время славы, чтобы не прийти к той чести, о которой Я говорил тебе прежде.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в котором не стареют вступающие в него».'
    reason: Отражает более естественную по-русски, но менее буквально переходную трактовку сирийского выражения.
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: мир
  rationale: Сохраняет обычное для апокалиптического контекста значение «мир/век», не устраняя возможный временной оттенок.
- source_word: ܠܐ ܡܣܐܒ
  choice: не старит
  rationale: 'Передаёт переходное значение сирийской глагольной формы: грядущий мир не подвергает старению тех, кто входит в него.'
- source_word: ܐܝܩܪܐ
  choice: честь
  rationale: Естественно передаёт значение почёта и высокого достоинства, отличая его от упомянутой рядом «славы».
theological_decisions:
- issue: Воздействие грядущего мира на вошедших в него
  choice: «мир, который не старит вступающих в него»
  alternative: «мир, в котором не стареют вступающие в него»
  rationale: Основной текст сохраняет грамматически переходную формулировку источника и не ослабляет мысль о том, что этот мир не подвергает своих обитателей старению; более привычный русский вариант приведён в примечании.
- issue: Первое лицо в заключительной фразе
  choice: «о которой Я говорил тебе прежде»
  alternative: «о которой тебе было сказано прежде»
  rationale: Сохранено личное высказывание говорящего, присутствующее в консультационном слое и соответствующее контексту обращения; прописная буква не вводит имени говорящего, но следует принятому русскому библейскому регистру.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Параллелизм повторов «избрали» и «отвергли» сохранён; тяжеловесные кальки по возможности устранены без сглаживания противопоставления нынешнего времени и грядущего мира.
