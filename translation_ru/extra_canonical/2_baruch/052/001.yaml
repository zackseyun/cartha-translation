  yaml_path: translation/extra_canonical/2_baruch/052/001.yaml
  text: For the earth will then certainly give back the dead whom it now receives in order to preserve them, changing nothing in their form; but as it received them, so it will restore them, and as I delivered them to it, so it will raise them.
translation:
  language: ru
  text: 1 Ибо тогда земля непременно отдаст мёртвых, которых теперь принимает, чтобы сохранить их, ничего не изменяя в их облике; но какими она их приняла, такими и возвратит, и какими Я предал их ей, такими она их и воскресит.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «как она их приняла, так и возвратит; и как Я предал их ей, так она их и воскресит».'
    reason: Основной текст естественно передаёт сирийскую коррелятивную конструкцию через «какими… такими»; примечание сохраняет её более буквальную форму.
lexical_decisions:
- source_word: ܡܦܩܢܗ / ܡܦܩܐ / ܡܩܝܡܐ
  choice: отдаст / возвратит / воскресит
  rationale: Сочетание глаголов передаёт возвращение землёй принятых ею мёртвых и завершает высказывание недвусмысленным образом воскресения.
- source_word: ܕܬܢܛܪ ܐܢܘܢ
  choice: чтобы сохранить их
  rationale: Целевая конструкция изображает землю как хранилище мёртвых; это чтение учитывает контрольное свидетельство, исправляющее повреждённую передачу строки в основном наборе.
- source_word: ܒܨܘܪܬܗܘܢ
  choice: в их облике
  rationale: «Облик» естественно выражает видимую и узнаваемую форму, не уточняя сверх текста телесную механику воскресения.
- source_word: ܐܝܟ ܕܩܒܠܬ ... ܐܝܟ ܕܐܫܠܡܬ
  choice: какими она их приняла ... какими Я предал их
  rationale: Повтор «какими ... такими» сохраняет параллелизм и подчёркивает непрерывность тождества умерших.
theological_decisions:
- issue: Преемственность между умершим и воскресшим человеком
  choice: Сохранён акцент на неизменности облика и возвращении умерших такими, какими земля их приняла.
  alternative: Истолковать стих как чисто духовное воскресение без преемственности формы.
  rationale: Повторяющиеся глаголы принятия, сохранения, возвращения и воскресения указывают на непрерывность личности и узнаваемого облика, но не объясняют механизм воскресения.
- issue: Субъект речи в выражении «Я предал их ей»
  choice: Местоимение «Я» написано с прописной буквы как речь Бога в данном контексте.
  alternative: Писать «я» со строчной буквы, оставляя говорящего графически неопределённым.
  rationale: Первое лицо описывает власть предавать умерших земле и в ближайшем контексте соответствует божественному говорящему; прописная буква является нормальным русским оформлением, а не добавлением нового титула.
translation_notes:
  register: Современный литературный русский с торжественным, но ясным библейским звучанием. «Мёртвых» и «воскресит» прямо передают эсхатологический смысл; «облик» сохраняет широту исходного слова и не вводит физиологических подробностей.
