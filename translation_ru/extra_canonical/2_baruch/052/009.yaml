  text: когда они увидят, что те, кого они ныне ни во что не ставят, пребывают в покое и прославлены вместе с ангелами,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܬܢܝܚܝܢ
  choice: пребывают в покое
  rationale: Передаёт состояние обретённого покоя естественным и достойным русским выражением, не сводя его непременно ко сну.
- source_word: ܡܫܬܒܚܝܢ
  choice: прославлены
  rationale: Сохраняет пассивное значение сирийской формы и эсхатологический контекст дарованной славы.
- source_word: ܥܡ ܡܠܐܟ̈ܐ
  choice: вместе с ангелами
  rationale: Естественно передаёт совместность; слово «ангелами» подтверждается смыслом контекста и контрольным английским слоем.
- source_word: ܐܝܟ ܠܐ ܡܕܡ (смысл, отражённый в контрольном слое)
  choice: считают за ничто
  rationale: 'Сохраняет оценочное значение: речь не о буквальном небытии, а о нынешнем презрительном отношении.'
theological_decisions:
- issue: Характер покоя праведных
  choice: «пребывают в покое» без уточнения места или состояния души
  alternative: «спят» или «обрели небесный покой»
  rationale: Текст говорит о покое, но не требует здесь ни метафоры сна, ни развёрнутой доктринальной локализации.
- issue: Источник прославления
  choice: пассивное «прославлены»
  alternative: «прославились»
  rationale: Пассив сохраняет возможность подразумеваемого божественного действия, не добавляя прямо не названного деятеля.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным эсхатологическим регистром. Синтаксис сохранён как придаточный фрагмент, соответствующий форме данного стиха; конечная запятая указывает на продолжение мысли.
