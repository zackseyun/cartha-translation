review_pass:
  verdict: revise
  source_fidelity: 'Сирийское ܬܫܢܝܩܐ точно передано как «мучения», но глагол ܢܣܒܪܘܢ означает «будут ожидать / надеяться», а не «будут терпеть». Поэтому в черновике утрачен важный смысл: речь о предвосхищении мучений, а не прямо об их претерпевании. Передача «ныне поступает нечестиво» согласуется с английским POB audit trail и приемлема в данном контексте.'
  naturalness: Фраза литературна и понятна. Однако «когда они будут терпеть мучение» неестественно связывает изменение облика с уже происходящим страданием и основана на неточной передаче глагола. «Когда они будут ожидать мучений» естественно и сохраняет временно-обстоятельственную неопределенность конструкции.
  terminology: «Облик» удачно передает ܕܡܘܬܗܘܢ в контексте посмертного преображения. «Нечестиво» уместно по регистру. Для ܬܫܢܝܩܐ предпочтительно множественное «мучений», поскольку это естественная русская форма при глаголе «ожидать» и не меняет собирательного значения.
