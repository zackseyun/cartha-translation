translation:
  language: ru
  text: Ибо облик тех, кто ныне поступает нечестиво, станет хуже, чем теперь, когда они будут ожидать мучений.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܡܘܬܗܘܢ
  choice: облик тех
  rationale: Сирийское слово обозначает внешний вид, образ или облик; в контексте преображения воскресших естественно передать его как «облик».
- source_word: ܒܝܫ
  choice: хуже
  rationale: Сравнительная конструкция с ܡܢ требует значения «хуже, чем».
- source_word: ܬܫܢܝܩܐ
  choice: мучение
  rationale: Слово обозначает мучение или истязание; единственное число по-русски сохраняет собирательно-абстрактный характер выражения.
theological_decisions:
- issue: Связь ухудшения облика с мучением
  choice: «когда они будут терпеть мучение»
  alternative: «поскольку они будут терпеть мучение»
  rationale: Сирийская конструкция допускает обстоятельственную связь без однозначного указания на причинность; временное прочтение сохраняет эту сдержанность и не добавляет богословского объяснения.
translation_notes:
  register: Современный литературный русский язык; формулировка торжественная, но понятная. Сохранено различие между нынешним нечестивым поведением и будущим ухудшением облика.
