  text: And it shall be that, after that appointed day has passed, afterward the forms of those who are condemned will be changed, and also the glory of those who are justified.
translation:
  language: ru
  text: 'И будет: когда минует тот назначенный день, тогда изменятся облик осуждённых, а также слава оправданных.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝܘܡܐ
  choice: день
  rationale: Прямое соответствие сирийскому слову «день»; указательное определение передано как «тот».
- source_word: ܕܡܘ̈ܬܐ
  choice: облик
  rationale: В данном контексте речь идёт о внешнем виде или образе воскресших; «облик» естественно звучит по-русски и не предполагает изменения их тождества.
- source_word: ܫܘܒܚܬܗܘܢ
  choice: слава
  rationale: Сохраняет основное значение сирийского слова и намеренную параллель между обликом осуждённых и славой оправданных.
- source_word: ܐܙܕܩܘ
  choice: оправданных
  rationale: Передаёт судебно-нравственный смысл сирийского глагола и не уточняет сверх текста, кем или на каком основании они оправданы.
theological_decisions:
- issue: Характер изменения осуждённых и оправданных
  choice: Нейтральное «изменится» без описания результата
  alternative: «преобразится» или явное указание на ухудшение и прославление
  rationale: Сам стих утверждает изменение, а его характер раскрывается далее; перевод не должен преждевременно снимать эту последовательность и напряжение.
- issue: Значение «оправданных»
  choice: Сохранён пассивный смысл без названного деятеля
  alternative: «тех, кого оправдал Бог»
  rationale: Источник в этой строке не называет деятеля прямо, поэтому он не добавлен в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Конструкция «И будет» сохраняет повествовательно-пророческий переход, а порядок частей отражает последовательность источника.
