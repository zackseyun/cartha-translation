revisions:
- from: И то время уже не будет тяготить их.[a] Ведь перед ними раскроются просторы рая, и им будет явлена красота величия живых существ, находящихся под престолом,[b] и все воинства ангелов, которые ныне удерживаются Моим словом, чтобы не являться, и которым повелено оставаться на своих местах до назначенного им пришествия.[c]
  to: То время больше не будет тяготить их.[a] Ведь перед ними раскроются просторы рая, и им будет явлена красота величия живых существ под престолом, и все сонмы ангелов, которые ныне удерживаются Моим словом, чтобы оставаться невидимыми, и удерживаются повелением, чтобы стоять на своих местах до их прихода.
  rationale: Исправления удаляют необоснованную текстологическую сноску, устраняют невыраженное исходником уточнение о «назначенном» пришествии и делают синтаксис естественнее. Смысл образов, а также формула «Моим словом», подтверждаемая английской аудиторской версией, сохранены.
