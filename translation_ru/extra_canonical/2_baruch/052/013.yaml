review_pass:
  verdict: revise
  source_fidelity: 'Начало стиха передано верно по сирийскому: глагол ܥܘܩ означает «теснить, угнетать, тяготить», а не буквально «стареть». Образы просторов рая, живых существ под престолом и ангельских сонмов сохранены. Однако сноска b необоснованно характеризует «под престолом» как контекстуальную реконструкцию: в контексте местоимение ясно отсылает к престолу. Формулировка «назначенное им пришествие» слишком уверенно вводит признак назначения и несколько неестественна для прихода ангелов.'
  naturalness: «То время больше не будет тяготить их» звучит естественнее, чем «уже не будет». «Чтобы оставаться невидимыми» точнее и яснее, чем «чтобы не являться». «До их прихода» сохраняет эсхатологическое ожидание, не придавая слову «пришествие» специального христологического оттенка.
  terminology: «Рай», «престол», «живые существа» и «сонмы ангелов» соответствуют возвышенному апокалиптическому регистру. «Моим словом» сохранено вслед за английским контрольным переводом; оно не должно заменяться догматически более определёнными объяснениями. Ложную текстологическую оговорку о престоле следует удалить.
  issues:
  - severity: medium
    issue: Сноска b называет чтение «под престолом» контекстуально восстановленным и утверждает неполноту или повреждённость свидетельства.
    rationale: В предоставленном сирийском контексте речь непосредственно идёт о величии живых существ «под ним», где антецедентом служит только что упомянутый престол. Такая сноска создаёт неоправданное впечатление текстологической неопределённости.
  - severity: low
    issue: «До назначенного им пришествия» избыточно уточняет исходную формулу и стилистически тяжеловесно.
    rationale: Смысл ожидаемого прихода/явления ангелов следует сохранить без явного добавления признака «назначенный»; «приход» естественнее применительно к ангелам.
  - severity: low
    issue: «И то время уже не будет...»
    rationale: «Уже» не требуется исходным выражением и хуже передаёт противопоставление будущему состоянию; «больше не будет» естественно выражает прекращение тяготы.
