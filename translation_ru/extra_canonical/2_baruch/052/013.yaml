base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/052/013.yaml
  text: And that time will no longer grow old for them. For the expanses of Paradise will be spread out before them, and the beauty of the majesty of the living beings beneath the throne will be shown to them, and all the companies of the angels, who are now restrained by my word so that they are not seen, and are kept by command to stand in their places until their appointed coming.
translation:
  language: ru
  text: То время больше не будет тяготить их.[a] Ведь перед ними раскроются просторы рая, и им будет явлена красота величия живых существ под престолом, и все сонмы ангелов, которые ныне удерживаются Моим словом, чтобы оставаться невидимыми, и удерживаются повелением, чтобы стоять на своих местах до их прихода.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «время больше не будет причинять им скорби».'
    reason: Сирийский глагол обозначает притеснение, тяготу или скорбь; это значение ближе к источнику, чем буквальное «стареть» в английском контрольном переводе.
lexical_decisions:
- source_word: ܠܐ ܢܥܘܩ ܐܢܘܢ ܙܒܢܐ
  choice: время уже не будет тяготить их
  rationale: Глагол ܥܘܩ передаёт притеснение, тяготу или причинение скорби; «тяготить» естественно по-русски и ближе к сирийскому, чем консультационное «стареть».
- source_word: ܦܠܝ̈ܛܘܗܝ ܕܦܪܕܝܣܐ
  choice: просторы рая
  rationale: Передаёт образ открывающихся пространств или пределов рая, не сужая его до конкретных садовых участков.
- source_word: ܚܝ̈ܐ
  choice: живые существа
  rationale: Контекст небесного престола и ангельских воинств указывает на небесных «живых существ»; сохранён традиционный библейский образ без уточнения их природы.
- source_word: ܫܒܘܥܘܗܝ ܚܒܝ̈ܫܐ ܕܡܠܐܟ̈ܐ
  choice: все воинства ангелов
  rationale: По контексту речь идёт о собраниях или воинствах ангелов; «воинства» сохраняет возвышенный апокалиптический регистр.
- source_word: ܥܕܡܐ ܕܬܐܬܐ ܡܕܝܢܬܗܘܢ
  choice: до назначенного им пришествия
  rationale: Форма в представленном свидетельстве допускает понимание определённого или назначенного момента их прихода; русский перевод сохраняет эсхатологический смысл без указания, куда именно они придут.
theological_decisions:
- issue: Кто или что удерживает ангелов
  choice: удерживаются Моим словом
  alternative: удерживаются властью / находятся под властью
  rationale: Аудированная консультационная версия читает здесь первое лицо Бога — «Моим словом»; распознанный сирийский текст в этом месте графически неустойчив. Выбранное чтение согласуется с последующим божественным повелением, но не разворачивается в отдельное учение.
- issue: Обозначение небесных существ у престола
  choice: живые существа
  alternative: живые / существа жизни
  rationale: Сохранён образ исходного текста и его связь с престольной сценой; не введены более конфессионально нагруженные названия.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Синтаксис сделан ясным для обычного читателя; образы рая, престола и ангельских воинств сохранены. Неясные места не устранены молча, а отмечены сносками.
