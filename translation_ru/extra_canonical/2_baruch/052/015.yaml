translation:
  language: ru
  text: Ибо первые примут последних, которых они ожидали, а последние — тех, о чьей смерти они слышали.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «тех, о ком они слышали, что те ушли из жизни».'
    reason: Сирийская конструкция может быть передана более буквально с повторением местоимения; основной текст выражает тот же смысл естественным русским оборотом.
lexical_decisions:
- source_word: ܢܩܒܠܘܢ
  choice: примут
  rationale: Передаёт обычное значение глагола «принимать, встречать» и сохраняет взаимную встречу воскресших поколений.
- source_word: ܩܕܡܝܐ / ܐܚܪ̈ܝܐ
  choice: первые / последние
  rationale: Сохранена формальная и смысловая антитеза сирийского текста без уточнения, которого нет в оригинале.
- source_word: ܡܣܟܝܢ ܗܘܘ
  choice: ожидали
  rationale: Прошедшее продолженное значение выражено естественным русским глаголом в прошедшем времени.
- source_word: ܫܡܥܝܢ ܗܘܘ
  choice: слышали
  rationale: Сохраняет косвенное знание последних о ранее умерших.
theological_decisions:
- issue: Кого обозначают «первые» и «последние»
  choice: Оставить обозначения без поясняющей вставки
  alternative: Уточнить как «умершие прежде» и «умершие позднее»
  rationale: Контекст допускает понимание как разных поколений праведников, однако сам стих использует относительные обозначения; перевод не должен превращать контекстуальный вывод в явное утверждение текста.
- issue: Значение ухода
  choice: «ушли из жизни»
  alternative: «скончались»
  rationale: Выражение сохраняет образ ухода, стоящий за традиционным пониманием текста, и при этом ясно сообщает русскому читателю о смерти.
translation_notes:
  register: Современный литературный русский язык с торжественной, но простой синтаксической параллелью. Тире восполняет подразумеваемый во второй части глагол «примут» и делает противопоставление ясным.
