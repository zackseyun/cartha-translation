  text: 'For this is required: that it may be shown to the living that the dead have come to life, and that those who had departed have returned.'
translation:
  language: ru
  text: Ибо необходимо показать живым, что мёртвые ожили и что ушедшие возвратились.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܒܥܐ
  choice: необходимо
  rationale: Передаёт безличное значение необходимости в данном контексте естественным современным русским языком.
- source_word: ܕܚܝܝܢ
  choice: живым
  rationale: Сохраняет прямое противопоставление живых и мёртвых.
- source_word: ܕܚܝܘ ܡ̈ܝܬܐ
  choice: что мёртвые ожили
  rationale: Буквально и ясно передаёт утверждение о возвращении мёртвых к жизни, не уточняя способ или природу воскресения сверх текста.
- source_word: ܘܐܬܘ ܗܢܘܢ ܕܐܙܠܘ ܗܘܘ
  choice: и что ушедшие возвратились
  rationale: Глагол «возвратились» естественно выражает приход назад тех, кто прежде ушёл; добавление второго «что» делает параллелизм ясным по-русски.
theological_decisions:
- issue: Характер возвращения мёртвых к жизни
  choice: мёртвые ожили
  alternative: мёртвые воскресли
  rationale: Выбранная формулировка ближе к исходному глаголу «жить/ожить» и не вносит более специальный богословский термин там, где сирийский текст выражается непосредственно.
translation_notes:
  register: Современный литературный русский язык; формулировка краткая, торжественная и понятная. Причинная частица «ибо» сохраняет связь стиха с предшествующим рассуждением.
