lexical_decisions:
- source_word: ܡܬܚܙܝܐ
  choice: окажется
  rationale: Форма означает «явится, станет видимым, окажется»; в данном сравнительном высказывании естественное русское «окажется» передаёт раскрытие будущего состояния.
- source_word: ܕܡܘܬܐ
  choice: облик
  rationale: Слово может означать «подобие, образ, облик». Здесь речь идёт о преображённом виде праведных, поэтому «облик» точнее и естественнее отвлечённого «превосходство».
- source_word: ܝܬܝܪ ܡܢ ܕܡܠܐܟ̈ܐ
  choice: превосходнее ангельского
  rationale: 'Буквально: «более, чем [облик] ангелов». Эллиптическое русское сравнение сохраняет смысл и не перегружает строку повтором слова «облик».'
theological_decisions:
- issue: Что именно превосходит ангелов
  choice: Облик праведных окажется превосходнее ангельского.
  alternative: Превосходство праведных будет больше, чем превосходство ангелов.
  rationale: Сирийское ܕܡܘܬܐ прямо обозначает подобие или облик, а не отвлечённое нравственное либо статусное «превосходство». Перевод не уточняет природу этого превосходства сверх сказанного источником.
translation_notes:
  register: Современный литературный русский; краткая, возвышенная формулировка. Местоимение «их» восстановлено из контекста, где речь идёт о праведных.
