  text: But they will especially be confounded—those who rejected the law and stopped their ears so as not to hear wisdom and not to receive understanding—
translation:
  language: ru
  text: Но ещё сильнее будут потрясены те, кто отвергли законы, заткнули уши, чтобы не слышать мудрости и не принимать разумения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܬܬܙܝܥܘܢ
  choice: смятутся
  rationale: Форма передаёт сильное потрясение или смятение; «смятутся» естественно по-русски и не сужает смысл до одного лишь стыда.
- source_word: ܕܐܣܠܝܘ
  choice: кто отверг
  rationale: Глагол означает пренебречь, отвергнуть или счесть презренным; в связи с законом «отверг» ясно передаёт сознательное неприятие.
- source_word: ܢܡܘܣܝ̈
  choice: Мой закон
  rationale: Суффикс первого лица указывает на принадлежность говорящему; собирательно-множественная сирийская форма в русском естественно передаётся единственным числом «закон».
- source_word: ܣܟܪܘ ܐܕܢܝ̈ܗܘܢ
  choice: заткнул уши
  rationale: Сохранён выразительный телесный образ намеренного отказа слушать.
- source_word: ܚܟܡܬܐ
  choice: мудрости
  rationale: Прямое и устойчивое соответствие сирийскому слову.
- source_word: ܣܘܟܠܐ
  choice: разумения
  rationale: Слово обозначает понимание, постижение, разумение; «разумение» соответствует возвышенному, но доступному регистру текста.
theological_decisions:
- issue: Число существительного «закон»
  choice: Мой закон
  alternative: Мои законы
  rationale: Хотя сирийская форма морфологически множественная, в данном контексте она может обозначать совокупный божественный Закон; русский перевод в единственном числе сохраняет привычную цельность понятия без конфессионального уточнения.
- issue: Характер реакции нечестивых
  choice: смятутся
  alternative: будут посрамлены
  rationale: Источник прежде всего выражает потрясение или внутреннее смятение, а не однозначно судебное посрамление; выбранный вариант сохраняет смысловую широту.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптической речи. Синтаксис сделан цельным и ясным; намеренно сохранён образ «заткнул уши». Местоимение «Мой» написано с прописной буквы как указание на божественного говорящего, без внесения дополнительных толкований.
