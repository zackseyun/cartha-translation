  yaml_path: translation/extra_canonical/2_baruch/011/001.yaml
  text: 'Then I, Baruch, said: “And I said to you, O Babylon: ‘If you had prospered, and Zion had dwelt in her glory, our grief would still have been great that you had been made equal to Zion. But now, behold, the grief is infinite and the lamentation beyond measure, because Babylon has prospered and Zion lies desolate. For who can judge concerning these things, or to whom shall we complain about what has come upon us? O Lord, how have you endured it? Our fathers went to rest without grief, and behold, the righteous sleep quietly in the earth, because they did not know this distress, nor had they heard what has happened to us. Would that you had ears, O earth, and that you had a heart, O dust, so that you might go and announce in Sheol and say to the dead, ‘Blessed are you more than we who live.’”'
translation:
  language: ru
  text: '1 Тогда я, Варух, сказал: «И сказал я тебе, Вавилон: „Если бы ты благоденствовал, а Сион пребывал в своей славе, всё равно велика была бы наша скорбь оттого, что ты был бы приравнен к Сиону“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܡ̇ܪ ܐܢܐ ܕܝܢ ܗ̣ܘ ܐܢܐ ܒܪܘܟ
  choice: Тогда я, Варух, сказал
  rationale: Передаёт продолжение плача и явное самоименование Варуха, не придавая повреждённому начальному обороту излишней определённости.
- source_word: ܒܒܠ
  choice: Вавилон
  rationale: Сохраняет прямое обращение к олицетворённому городу и не заменяет его общим обозначением империи.
- source_word: prosperity concept in the address to Babylon
  choice: благоденствовал
  rationale: Естественно передаёт процветание Вавилона и поддерживает контраст со славой Сиона без добавочной нравственной оценки.
- source_word: ܨܗܝܘܢ
  choice: Сион
  rationale: Устоявшаяся русская библейская форма имени; сохраняет олицетворение города.
- source_word: equality comparison with Zion
  choice: был приравнен к Сиону
  rationale: Передаёт болезненное для говорящего сопоставление Вавилона с Сионом, не уточняя, кем именно произведено это приравнивание.
theological_decisions:
- issue: Смысл условного противопоставления Вавилона и Сиона
  choice: Вавилон благоденствует, тогда как Сион пребывает в своей славе
  alternative: Сион благоденствует, а Вавилон разрушен
  rationale: Основное чтение следует исправленной сверке источника и сохраняет обращение к Вавилону; альтернативное чтение отражает прежнюю реконструкцию неясного места, но переставляет участников условия.
- issue: Приравнивание Вавилона к Сиону
  choice: Пассивная формулировка без указания действующего лица
  alternative: Бог приравнял Вавилон к Сиону
  rationale: Источник не требует прямо называть Бога действующим лицом; пассив сохраняет богословское напряжение плача, не усиливая обвинение.
translation_notes:
  register: Современный литературный русский язык с торжественной интонацией плача. Синтаксис сохранён достаточно близко к сирийскому, но сделан понятным для обычного читателя; прямые обращения и олицетворение городов удержаны.
