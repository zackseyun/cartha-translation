base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/054/001.yaml
  text: O You who created the earth, hear me—You who established the firmament by the word, and made firm the height of heaven by the spirit[a].
translation:
  language: ru
  text: О Ты, сотворивший землю, услышь меня — Ты, утвердивший небосвод словом и укрепивший небесную высь духом[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сирийское слово ܪܘܚܐ может означать и «дух», и «дыхание»; параллель со «словом» перекликается с Пс 32:6 (33:6).
    reason: lexical_choice
lexical_decisions:
- source_word: ܕܒܪܐ
  choice: Кто сотворил
  rationale: Глагол ܒܪܐ в данном обращении обозначает творение; причастная конструкция естественно передаётся русским придаточным с «Кто».
- source_word: ܬܩܢܬ
  choice: утвердил
  rationale: 'Передаёт каузативно-интенсивный смысл формы от ܬܩܢ: установить, привести в устойчивое состояние; хорошо сочетается с «небосводом».'
- source_word: ܪܩܝܥܐ
  choice: небосвод
  rationale: Современный литературный библейский эквивалент для небесной тверди, сохраняющий космологический образ без архаичной формы «твердь».
- source_word: ܒܡܠܬܐ
  choice: словом
  rationale: Творительный оборот естественно передаёт сирийское ܒ־ как средство творческого действия; ܡܠܬܐ означает «слово».
- source_word: ܘܫܪܪܬ
  choice: и укрепил
  rationale: Передаёт значение придания прочности и устойчивости, сохраняя смысловой параллелизм с «утвердил» без полного лексического повтора.
- source_word: ܪܘܚܐ
  choice: духом
  rationale: Сохраняет обычное богословски насыщенное значение ܪܘܚܐ, тогда как возможное значение «дыханием» отмечено в сноске и не исключается.
theological_decisions:
- issue: Значение ܪܘܚܐ как «дух» или «дыхание»
  choice: духом
  alternative: дыханием
  rationale: Основной текст сохраняет традиционное и естественное в апокалиптической речи «духом», но сноска прямо удерживает подлинную лексическую двусмысленность и параллель со «словом».
- issue: Следует ли писать «Духом» с прописной буквы как прямое указание на Святого Духа
  choice: духом со строчной буквы
  alternative: Духом
  rationale: Сирийский текст сам по себе не требует однозначной тринитарной конкретизации; строчная буква не навязывает позднейшее догматическое прочтение и сохраняет возможность значения «дыхание».
translation_notes:
  register: Возвышенная молитвенная речь передана современным литературным русским языком. Восклицание устраняет возможную синтаксическую двусмысленность после «услышь меня», а повторное «Ты» ясно продолжает обращение к Богу. Сохранён параллелизм двух творческих действий.
