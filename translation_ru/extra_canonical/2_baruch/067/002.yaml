  to: 'Или вы думаете, что даже у ангелов перед Могущественным нет скорби оттого, что Сион был так отдан и что — вот — народы превозносятся в сердцах своих, собираются[a] перед своими идолами и говорят: «Та, что долго попирала других, сама попрана; та, что подчиняла других, сама подчинена»?'
  rationale: Заменено потенциально чрезмерно окрашенное «предан» на нейтральное «отдан» и восстановлена более близкая к оригиналу конструкция «нет скорби». Альтернативное прочтение формы при «собираются» сохранено в сноске; основной текст следует контекстуальному глагольному чтению, поддержанному английским аудитом.
