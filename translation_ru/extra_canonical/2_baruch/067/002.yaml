  - severity: low
    issue: Первое предложение передаёт «скорбь» личным глаголом «ангелы ... не скорбят»
    rationale: Смысл не искажён, но исходный риторический вопрос сформулирован через наличие скорби у ангелов. Номинальная конструкция естественнее и точнее передаёт акцент.
