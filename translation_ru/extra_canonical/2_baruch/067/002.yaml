base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/067/002.yaml
  text: Or do you think there is no grief, even for the angels before the Mighty One, because Zion was handed over in this way, and because, look, the nations boast in their hearts, and they gather before their idols and say, “She who long trampled others is trampled down; she who brought others into subjection has herself been subjected”?
translation:
  language: ru
  text: 'Или вы думаете, что даже у ангелов перед Могущественным нет скорби оттого, что Сион был так отдан и что — вот — народы превозносятся в сердцах своих, собираются[a] перед своими идолами и говорят: «Та, что долго попирала других, сама попрана; та, что подчиняла других, сама подчинена»?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно: «и толпы перед своими идолами говорят».'
    reason: Форма допускает альтернативное прочтение как существительное «толпы», хотя глагольное «собираются» лучше соответствует синтаксической цепочке.
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: Могущественный
  rationale: Сохраняет субстантивированный божественный титул сирийского текста без замены его конфессионально привычным именованием.
- source_word: ܡܫܬܒܗܪܝܢ
  choice: превозносятся
  rationale: Передаёт хвастливое, надменное самовозвышение народов и естественно сочетается с уточнением «в своих сердцах».
- source_word: ܡܬܟܢܫܝܢ / ܟܢܫܝܢ
  choice: собираются
  rationale: Контекст и синтаксический параллелизм с другими глагольными формами поддерживают активное значение «собираются», а не существительное «толпы».
- source_word: ܨܗܝܘܢ
  choice: Сион
  rationale: Традиционная русская форма топонима; женский род далее позволяет сохранить олицетворение города.
theological_decisions:
- issue: Скорбь ангелов перед Богом из-за предания Сиона
  choice: Сохранён риторический вопрос и утверждаемая им возможность ангельской скорби
  alternative: Переформулировать как прямое утверждение либо ослабить «скорбят» до «сожалеют»
  rationale: Исходная напряжённость текста не должна устраняться или согласовываться с какой-либо заранее принятой ангелологией.
- issue: Божественный титул
  choice: Могущественный
  alternative: Всемогущий
  rationale: «Могущественный» ближе передаёт сирийский титул и не усиливает его до более специализированного богословского термина.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Частица «вот» выделена тире, чтобы сохранить её риторическую силу; параллелизм заключительной прямой речи воспроизведён симметрично.
