lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: Всевышний
  rationale: В данном контексте это божественный титул; выбор согласуется с английским контрольным слоем и звучит естественно в русской библейской прозе.
- source_word: ܢܫܬܒܚ
  choice: прославляется
  rationale: Передаёт значение восхваления или обретения славы, сохраняя пассивную форму.
- source_word: ܐܝܩܪܗ / ܫܡܗ
  choice: Его имя
  rationale: Текст предоставленного сирийского блока повреждён и не вполне надёжно сегментирован; формулировка следует проверенному смысловому чтению стиха в английском POB.
theological_decisions:
- issue: Риторический вопрос о Божьем одобрении человеческих дел
  choice: Сохранён единый вопрос с отрицательно подразумеваемым ответом
  alternative: Разделить на два самостоятельных вопроса или прямо сказать, что Всевышний не радуется
  rationale: Такая форма сохраняет риторическую напряжённость и не превращает подразумеваемый ответ в явное утверждение.
- issue: Божественный титул
  choice: Всевышний
  alternative: Всемогущий
  rationale: Контрольный текст указывает на Most High; «Всевышний» — традиционный и при этом понятный современному читателю титул.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской речи. Местоимение «Его» написано с прописной буквы как уважительное обозначение Бога. Из-за повреждённости и широкого охвата сирийского источника перевод опирается на различимый смысловой контекст и аудированный английский контрольный слой.
