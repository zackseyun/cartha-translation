  text: Yet after these things they will be seized by tribulation in the dispersion among the nations, and they will dwell in shame in every place.
translation:
  language: ru
  text: Но после этого, в рассеянии среди народов, их постигнет бедствие, и повсюду они будут жить в унижении.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в нужде»; сирийское выражение может обозначать также лишение или недостаток.'
    reason: Лексема допускает как смысл униженного, постыдного положения, так и смысл нужды или лишения.
lexical_decisions:
- source_word: ܐܬܚܙܝܬ
  choice: их постигнет
  rationale: По контексту и контрольному чтению форма передаёт то, что они будут охвачены или настигнуты бедствием; по-русски «их постигнет» естественно сочетается с существительным «бедствие».
- source_word: ܒܡ̈ܢܘܬܐ
  choice: в рассеянии среди народов
  rationale: Передаёт положение рассеянного народа среди иных народов, не сужая смысл до добровольного переселения.
- source_word: ܒܚܣܝܪܘ
  choice: в унижении
  rationale: Контекст допускает оттенки позора, лишения и униженного положения; «в унижении» сохраняет социальный и эмоциональный смысл и звучит естественно в современном русском.
- source_word: ܒܟܠ ܐܬܪ
  choice: повсюду
  rationale: Краткий естественный эквивалент буквального «в каждом месте».
