  text: And the eleventh black waters that you saw—this is the calamity that has now come upon Zion.[a]
translation:
  language: ru
  text: И одиннадцатые чёрные воды, которые ты видел, — это бедствие, ныне постигшее Сион.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟ̈ܡܐ
  choice: чёрные воды
  rationale: Сохранён устойчивый образ видения и структурное противопоставление чёрных и светлых вод.
- source_word: ܫܘܚܬܐ
  choice: бедствие
  rationale: Слово передаёт обрушившееся на Сион несчастье; «бедствие» естественно звучит по-русски и сохраняет тяжесть происходящего.
- source_word: ܨܗܝܘܢ
  choice: Сион
  rationale: Сохранено традиционное библейское имя города с его богословскими и символическими ассоциациями.
theological_decisions:
- issue: Характер падения Сиона
  choice: Событие названо бедствием, постигшим Сион, без дополнительного объяснения его богословского смысла.
  alternative: Прямо обозначить бедствие как окончательное отвержение Сиона или как предмет Божьего благоволения.
  rationale: Стих описывает бедствие, но сам по себе не разрешает напряжение между Божьим судом, участью Сиона и торжеством народов; перевод не добавляет конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; тон краткий, торжественный и соответствующий апокалиптическому видению. Единственное число в обороте «это бедствие» отражает сирийские формы единственного числа ܗܕܐ ܗܝ и существительное в единственном числе, несмотря на множественное «воды».
