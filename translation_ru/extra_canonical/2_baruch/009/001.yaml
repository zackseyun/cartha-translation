base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/009/001.yaml
  text: And I, Baruch, came with Jeremiah, whose heart had been found pure from sins, and who had not been taken in the capture of the city. And we rent our garments, wept, mourned, and fasted seven days.
translation:
  language: ru
  text: И я, Варух, пришёл вместе с Иеремией, сердце которого оказалось чистым от грехов и который не был взят при захвате города. Мы разодрали одежды, плакали, скорбели и постились семь дней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܒܥ
  choice: пришёл
  rationale: Начало главы в рукописном источнике читается не вполне ясно, однако контекст и контрольная традиция указывают на простой глагол движения. «Пришёл» не уточняет без необходимости, было ли это возвращением или уходом.
- source_word: ܕܟܝ ... ܡܢ ܚܛܝ̈ܗ̣ܐ
  choice: сердце которого было признано чистым от грехов
  rationale: Формулировка сохраняет и образ сердца, и значение засвидетельствованной нравственной чистоты, не превращая контекстуальную характеристику Иеремии в отвлечённое догматическое утверждение о полной безгрешности.
- source_word: ܒܥܒܕܘܗܝ ܕܡܕܝܢܬܐ
  choice: при захвате города
  rationale: Выражение относится к насильственному взятию города; «захват» естественно передаёт военный смысл.
- source_word: ܐܬܚܙܝ
  choice: было признано
  rationale: В данном контексте глагол выражает оценку состояния сердца Иеремии, а не простое зрительное восприятие.
- source_word: ܘܒܩ̈ܝ
  choice: плакали, скорбели
  rationale: Два близких глагола плача и скорби переданы раздельно, чтобы сохранить усиление плача в сцене траура.
theological_decisions:
- issue: Иеремия назван чистым от грехов
  choice: Сохранена формулировка о сердце, признанном чистым от грехов, без дополнительных толкований в основном тексте.
  alternative: Передать как утверждение об абсолютной безгрешности Иеремии либо сузить смысл до одной лишь ритуальной чистоты.
  rationale: Ближайший контекст связывает характеристику Иеремии с виной города и его падением. Перевод сохраняет нравственный смысл и присущую выражению напряжённость, но не навязывает более широкого догматического вывода.
translation_notes:
  register: 'Современный литературный русский язык с достоинством повествования. Последовательность траурных действий сохранена полностью: разрыв одежд, плач, скорбь и семидневный пост. Союзы и пунктуация сделаны естественными для русского чтения.'
