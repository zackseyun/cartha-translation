  text: И мы разорвали на себе одежды, плакали, скорбели и постились семь дней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: (сир. выражение со значением «разорвать одежды»; строка стиха неразборчива в предоставленном фрагменте)
  choice: разорвали на себе одежды
  rationale: Естественно передаёт древний жест скорби и сохраняет конкретный образ исходного выражения.
- source_word: (сир. «скорбеть / оплакивать»)
  choice: скорбели
  rationale: Отличает внутреннее и обрядовое выражение скорби от непосредственно предшествующего «плакали».
- source_word: (сир. «поститься»)
  choice: постились
  rationale: Прямой и общеупотребительный русский эквивалент без добавочного конфессионального оттенка.
