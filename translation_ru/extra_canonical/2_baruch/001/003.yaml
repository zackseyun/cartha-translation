  terminology: «Колена» — уместный традиционный термин для израильских племён. «Побуждали» хорошо передаёт первый, менее категоричный глагол ܕܚܨܘ, а «принуждали» — ܐܠܨܘ. Уточнение «своих царей» необходимо и сохранено.
