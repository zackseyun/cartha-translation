  yaml_path: translation/extra_canonical/2_baruch/001/003.yaml
  text: For the former tribes were compelled by their kings to sin, but these two tribes themselves desired to sin and compelled their kings to sin.
translation:
  language: ru
  text: Ибо цари принуждали прежние колена грешить, а эти два колена сами побуждали[a] и принуждали своих царей грешить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «подталкивали», «оказывали давление».'
    reason: Сирийский глагол ܕܚܨܘ обозначает настойчивое побуждение или давление; варианты передают его смысловой диапазон без заявления о буквальности.
lexical_decisions:
- source_word: ܫܪ̈ܒܬܐ / ܫܪ̈ܒܢ
  choice: колена
  rationale: В данном контексте речь идёт о коленах Израиля; это естественный и устоявшийся русский эквивалент.
- source_word: ܐܬܐܠܨܘ
  choice: принуждали
  rationale: Страдательная форма передаёт внешнее принуждение со стороны царей; по-русски предложение естественно перестроено в действительный залог.
- source_word: ܕܚܨܘ
  choice: побуждали
  rationale: Сирийский текст Ceriani–Kmosko имеет глагол со значением давления или настойчивого понуждения, а не глагол «желать»; «побуждали» сохраняет отличие от следующего, более сильного «принуждали».
- source_word: ܘܐܠܨܘ
  choice: и принуждали
  rationale: 'Передаёт усиление: эти два колена не только побуждали царей, но и принуждали их.'
- source_word: ܕܢܚܛܘܢ
  choice: грешить
  rationale: Инфинитив естественно и точно выражает цель или результат понуждения.
theological_decisions:
- issue: Противопоставление ответственности народа и царей
  choice: 'Сохранено: прежние колена принуждались царями, тогда как два колена сами побуждали и принуждали царей.'
  alternative: 'Следовать английскому слою: «сами желали грешить и принуждали своих царей».'
  rationale: Предоставленный сирийский первичный текст читает ܕܚܨܘ, «побуждали/оказывали давление», поэтому внутреннее желание народа прямо не утверждается. Перевод сохраняет заложенное в источнике противопоставление направлений принуждения.
translation_notes:
  register: Современный литературный русский с библейски уместным, но понятным словом «колена». Частица «ведь» передаёт ܓܝܪ и связь с предыдущим стихом. «Сами» делает явным контраст субъектов, уже выраженный сирийской конструкцией.
