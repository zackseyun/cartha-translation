  source_fidelity: 'Сирийский текст в предоставленном первичном свидетеле читает ܕܚܨܘ («теснили, оказывали давление, настойчиво побуждали») перед ܘܐܠܨܘ («принуждали»). Поэтому русский перевод не должен следовать английскому аудиторскому варианту «сами желали грешить»: этот смысл не выражен в данном сирийском чтении. Противопоставление сохранено: прежние колена испытывали принуждение со стороны царей, тогда как два колена воздействовали на своих царей.'
