base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/001/001.yaml
  text: In the twenty-fifth year of Jeconiah king of Judah, the word of the Lord came to Baruch son of Neriah, saying, / and He said to him,
translation:
  language: ru
  text: В двадцать пятый год царствования Иехонии, царя Иудеи, к Варуху, сыну Нерии, пришло[a] слово Господа и сказало ему:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «слово Господа было на Варухе»; возможный перевод: «слово Господа сошло на Варуха».'
    reason: Сирийский предлог ܥܠ означает «на, над», хотя в пророческой формуле по-русски естественнее «пришло к».
  - marker: b
    text: 'Или: «и Господь сказал ему». В сирийском подлежащее здесь прямо не названо.'
    reason: Форма глагола позволяет связать говорящего как со «словом Господа», так и с подразумеваемым Господом; сноска сохраняет эту неоднозначность.
lexical_decisions:
- source_word: ܒܫܢܬ ܥܣܪܝܢ ܘܚܡܫ ܕܝܘܟܢܝܐ
  choice: В двадцать пятый год царствования Иехонии
  rationale: Слово «царствования» естественно передаёт датировочную конструкцию и ясно показывает, что год отсчитывается от правления Иехонии.
- source_word: ܗܘܐ ܦܬܓܡܗ ܕܡܪܝܐ ܥܠ
  choice: пришло слово Господа к
  rationale: Естественная русская передача пророческой формулы; предлог ܥܠ буквально допускает значение «на», что отмечено в сноске.
- source_word: ܒܪܘܟ ܒܪ ܢܪܝܐ
  choice: Варуху, сыну Нерии
  rationale: Традиционные русские формы библейских имён, при этом родственная связь передана прямо.
- source_word: ܘܐܡܪ ܠܗ
  choice: и сказало ему
  rationale: Глагол оставлен связанным с грамматически мужским ܦܬܓܡܐ («слово»); русское среднее согласование естественно продолжает названное подлежащее, не добавляя прямо отсутствующее в сирийском имя Господа.
theological_decisions:
- issue: Кто является подразумеваемым подлежащим глагола «сказал»
  choice: «слово Господа … сказало ему»
  alternative: «Господь сказал ему»
  rationale: В сирийском подлежащее второго глагола отдельно не названо; ближайшее выраженное подлежащее — «слово Господа», но возможно понимание Господа как подразумеваемого говорящего. Основной текст следует синтаксической связи, а альтернатива сохранена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис сделан ясным для обычного читателя; традиционные формы имён сохранены. Выражение «слово Господа … сказало» несколько необычно, но осознанно удерживает образ и синтаксическую неоднозначность сирийского текста.
