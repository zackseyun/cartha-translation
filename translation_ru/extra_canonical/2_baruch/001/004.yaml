base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/001/004.yaml
  text: Therefore behold, I am bringing evil upon this city and upon its inhabitants, and it will be removed from before me for a time, and I will scatter this people among the nations, that they may be servants to the nations.
translation:
  language: ru
  text: Вот почему Я навожу бедствие[a] на этот город и на его жителей. На время он будет удалён от Моего лица, а этот народ Я рассею среди народов, чтобы он служил народам.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зло».'
    reason: Сирийское ܒܝܫܬܐ может обозначать как зло, так и бедствие или несчастье.
lexical_decisions:
- source_word: ܒܝܫܬܐ (bīštā)
  choice: бедствие
  rationale: В контексте суда слово обозначает губительное несчастье или беду; «бедствие» естественно по-русски и не приписывает Богу нравственное зло, не устраняя при этом суровость высказывания.
- source_word: ܬܬܬܪܝܡ (tettettrīm)
  choice: будет удалён
  rationale: Передаёт пассивную форму со значением удаления или унесения; подлежащее — «этот город».
- source_word: ܡܒܕܪ (mbaddar)
  choice: рассею
  rationale: Обычное значение сирийского глагола в контексте рассеяния народа среди других народов.
- source_word: ܕܠܥܡܡ̈ܐ ܢܘܬܪ (d-la-ʿammē newtar)
  choice: чтобы он был оставлен им
  rationale: 'Следует представленному сирийскому тексту: ܢܘܬܪ связано с корнем «оставаться / быть оставленным», а ܠܥܡܡ̈ܐ — «народам». Местоимение «им» относится к другим народам.'
theological_decisions:
- issue: Бог наводит ܒܝܫܬܐ
  choice: «навожу бедствие» с примечанием «зло»
  alternative: «навожу зло»
  rationale: Контекст говорит о карающем бедствии, однако примечание сохраняет более буквальную и богословски напряжённую возможность перевода.
- issue: Смысл заключительной цели рассеяния
  choice: «чтобы он был оставлен им»
  alternative: «чтобы он оставался среди народов»
  rationale: Формулировка сохраняет неоднозначность сирийского оборота между пребыванием среди народов и отданностью им; чтение «служил народам» не подтверждается представленным сирийским текстом.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Заглавные местоимения в речи Бога применены последовательно. «Других» добавлено для естественности и ясного различения рассеянного народа и народов, среди которых он будет рассеян.
