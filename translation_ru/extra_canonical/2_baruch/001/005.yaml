translation:
  language: ru
  text: И Мой народ будет наказан, и придёт время, когда он станет искать благополучия своих времён».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܡܬܪܕܐ
  choice: будет наказан
  rationale: Страдательная форма глагола со значением наказания или вразумления; «будет наказан» ясно передаёт основной смысл, не уточняя способ наказания.
- source_word: ܡܘܨܠܚܘܬܗܘܢ
  choice: благополучия
  rationale: Существительное обозначает преуспевание, благоденствие или успех; «благополучие» естественно сочетается с глаголом «искать» и сохраняет широкое значение.
- source_word: ܕܙܒܢܝ̈ܗܘܢ
  choice: своих времён
  rationale: Буквально сохранена связь с «их временами/порами» без добавления отсутствующего в сирийском определения «прежних».
theological_decisions:
- issue: Характер воздействия на народ
  choice: будет наказан
  alternative: будет вразумлён
  rationale: Исходный глагол допускает оттенок исправляющего наказания, однако контекст объявленного бедствия поддерживает более прямое «наказан»; исправительная цель при этом не исключается.
- issue: Связь прихода времени с последующим поиском
  choice: придёт время, и они станут искать
  alternative: придёт время, когда они станут искать
  rationale: Сохранена сочинительная структура сирийского текста и присущая ей небольшая смысловая открытость; по-русски такая последовательность остаётся естественной.
translation_notes:
  register: Современный литературный русский язык с торжественной пророческой интонацией. Местоимение «Мой» написано с прописной буквы как обращённое к Богу притяжательное местоимение. Неясное выражение о «благополучии своих времён» сохранено без поясняющих добавлений.
