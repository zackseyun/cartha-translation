  source_fidelity: 'Сирийский текст передан в целом точно: ܡܬܪܕܐ означает, что народ будет подвергнут наказанию/вразумлению; ܢܐܬܐ ܙܒܢܐ — «придёт (наступит) время»; ܢܒܥܘܢ ܡܘܨܠܚܘܬܗܘܢ ܕܙܒܢܝ̈ܗܘܢ — «они будут искать благополучия/преуспеяния своих времён». Относительное «когда» правомерно передаёт координацию сирийских предложений и соответствует уточнённой английской линии аудита.'
  naturalness: В исходном варианте переход от собирательного единственного «народ будет наказан» к «они станут искать» несколько резок, хотя и возможен. Согласование «народ ... он» делает русскую фразу цельной. «Благополучия своих времён» намеренно сохраняет необычность исходного выражения; это не следует заменять интерпретирующим «прежнего времени» или «счастливых дней».
  terminology: «Наказан» адекватно для контекста возвещённого бедствия и не исключает присущий глаголу оттенок дисциплинирующего вразумления. «Благополучие» удачно сохраняет широкий смысл ܡܘܨܠܚܘܬܐ («процветание, успех, благоденствие»).
