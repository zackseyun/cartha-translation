  text: “You have seen all that this people has done to me; the evil that these two tribes that remain have done is greater than that of the ten tribes that were taken captive.”
translation:
  language: ru
  text: '«Ты видел всё, что сделал Мне этот народ: злодеяния, совершённые этими двумя оставшимися коленами, превосходят те, что совершили десять колен, уведённые в плен.»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܙܝܬ
  choice: Ты видел
  rationale: Передаёт перфект второго лица единственного числа без добавочного истолкования.
- source_word: ܬܪ̈ܬܝܢ ܫܪ̈ܒܢ
  choice: два колена
  rationale: В данном контексте ܫܪ̈ܒܢ обозначает племенные подразделения Израиля; традиционное и понятное русское соответствие — «колена».
- source_word: ܕܐܫܬܚܪܝ
  choice: оставшимися
  rationale: Сирийская форма выражает состояние тех, кто остался; причастная конструкция естественна по-русски.
- source_word: ܕܐܫܬܒܝܘ
  choice: отведённых в плен
  rationale: Точно выражает пассивное «были пленены/уведены в плен» и сохраняет исторический смысл.
- source_word: ܝܬܝܪ ܡܢ
  choice: превосходит
  rationale: Явно завершает сравнительную конструкцию «больше, чем», подразумеваемый предмет сравнения повторён как «зло» ради ясности.
theological_decisions:
- issue: Характер сравнения вины двух и десяти колен
  choice: «зло… превосходит зло»
  alternative: «они совершили больше зла, чем десять колен»
  rationale: Сохраняет предметом сравнения зло/злодеяния, не превращая утверждение в подсчёт отдельных поступков и не смягчая оценку.
- issue: Божественная речь и местоимение первого лица
  choice: «Мне» с прописной буквы
  alternative: «мне» со строчной буквы
  rationale: Следует принятой русской библейской издательской норме для местоимений, относящихся к Богу, не добавляя нового богословского содержания.
translation_notes:
  register: Современный литературный русский язык с библейской торжественностью без архаизмов. Синтаксис сохраняет прямую божественную речь и сравнительную напряжённость оригинала; двоеточие естественно вводит уточнение того, что сделал народ.
