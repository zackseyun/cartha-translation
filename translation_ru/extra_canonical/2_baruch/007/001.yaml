- from: 'После этого я услышал, как тот ангел сказал ангелам, державшим факелы: «Теперь разберите опоры её стен и обрушьте их, чтобы враги не хвалились, говоря: „Это мы разрушили стену Сиона и сожгли место могущественного Бога“. И встаньте там, где прежде стоял я».'
  to: 'После этого я услышал, как тот ангел сказал ангелам, державшим факелы: «Теперь обрушьте опоры её стен и разрушьте их, чтобы враги не хвалились, говоря: „Это мы разрушили стену Сиона и сожгли место могущественного Бога“. И встаньте там, где прежде стоял я».'
  rationale: 'Заменено «разберите» на «обрушьте», чтобы не вносить представление о поэтапном демонтаже и точнее передать насильственное низвержение. Повторное «разрушьте их» сохраняет исходную синтаксическую неясность: объект может быть соотнесён с опорами либо со стенами.'
