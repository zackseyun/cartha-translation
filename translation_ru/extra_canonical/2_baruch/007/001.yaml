  yaml_path: translation/extra_canonical/2_baruch/007/001.yaml
  text: And after these things I heard that angel say to those angels who were holding the torches, “Now pull down the supports of its walls and overthrow them, lest the enemies boast and say, ‘We ourselves have cast down the wall of Zion, and we have burned the place of the mighty God.’ And stand there in the place where I had been standing before.”
translation:
  language: ru
  text: 'После этого я услышал, как тот ангел сказал ангелам, державшим факелы: «Теперь обрушьте опоры её стен и разрушьте их, чтобы враги не хвалились, говоря: „Это мы разрушили стену Сиона и сожгли место могущественного Бога“. И встаньте там, где прежде стоял я».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܡܥܬܗ (исправленное чтение вместо распознанного ܫܒܩܬܗ)
  choice: я услышал
  rationale: 'Контекст требует глагола слухового восприятия: далее приводятся слова ангела. Чтение «я оставил его» связано с ошибкой распознавания сирийского текста и нарушает синтаксис фразы.'
- source_word: ܠܡܦܐܕ̈ܐ / ܠܡܦܝܕܐ
  choice: факелы
  rationale: В сцене предстоящего сожжения речь идёт об огненных светильниках; «факелы» естественно передаёт их назначение и сохраняет яркость образа.
- source_word: ܣܡܝܟܘܬ ܫܘܪ̈ܝܗ
  choice: опоры её стен
  rationale: Выражение обозначает несущие или поддерживающие части стены, не позволяя с уверенностью уточнить, были ли это основания либо подпорки.
- source_word: ܣܚܦܢܝܗܝ
  choice: разрушили
  rationale: Глагол выражает насильственное низвержение или разрушение стены; русский глагол передаёт смысл ясно и без ненужной архаизации.
- source_word: ܕܘܟܬܐ ܕܐܠܗܐ ܚܝܠܬܢܐ (чтение, стоящее за повреждённым распознаванием ܚܝܒܬܐ)
  choice: место могущественного Бога
  rationale: Определение подчёркивает силу и величие Бога. «Могущественного» точнее сохраняет значение ‘mighty’, чем «Всемогущего», которое могло бы привнести более абсолютный смысл.
- source_word: ܘܐܬܩܝܡܘ
  choice: и встаньте
  rationale: Форма понимается как повелительное наклонение множественного числа, продолжающее обращение к ангелам, а не как рассказ Варуха о том, что его поставили на прежнее место.
theological_decisions:
- issue: Кто в конечном счёте разрушает Иерусалим
  choice: Стена обрушивается ангелами по небесному повелению, поэтому враги не могут приписать разрушение себе.
  alternative: Разрушение совершено исключительно земными врагами либо стена пала сама.
  rationale: Ангел прямо приказывает другим ангелам обрушить стену, чтобы враги не хвалились своей победой. Тем самым падение города представлено как допущенный и осуществлённый свыше суд.
- issue: Значение божественного эпитета
  choice: «могущественного Бога»
  alternative: «Всемогущего Бога»
  rationale: Перевод сохраняет заявленное в сирийском тексте могущество Бога, не усиливая эпитет до формулы абсолютного всемогущества.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Прямая речь оформлена ясно; синтаксическая неоднозначность местоимения в повелении «обрушьте их» сохранена, поскольку сирийская формулировка допускает соотнесение с названными опорами/стенами. Конъектуры, исправляющие ошибки распознавания, не вынесены в читательские сноски, поскольку они восстанавливают связный контрольный текст, а не представляют содержательно значимые варианты рукописи.
