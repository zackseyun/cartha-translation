base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/027/001.yaml
  text: 'And I answered and said to him, “After this, that time is divided into twelve parts, and each one of them is known for what has been appointed in it. In the first part: the beginning of upheavals. In the second part: the slaying of the great ones. In the third part: the fall of many. In the fourth part: the sending forth of the sword. In the fifth part: famine. In the sixth part: earthquakes. In the seventh part: terrors and plagues. In the eighth part: assaults of spirits and of demons of apparitions. In the ninth part: the fall of fire. In the tenth part: plundering and much oppression.”'
translation:
  language: ru
  text: 'И я ответил ему: «После этого время будет разделено на двенадцать частей, и каждая из них определяется тем, что в ней назначено. В первой части — начало потрясений; во второй — избиение великих; в третьей — падение многих; в четвёртой — меч будет послан; в пятой — голод; в шестой — землетрясения; в седьмой — ужасы и бедствия; в восьмой — нападения духов и демонов[a]; в девятой — падение огня; в десятой — разграбление и многочисленные притеснения».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сирийское выражение после слова «демонов» трудно для точного истолкования; буквально оно содержит слово со значениями «лица», «облики» или «явления». Возможный перевод: «нападения духов и демонов, являющихся в разных обликах». «Духов» может также быть понято как «душ».'
    reason: Сохраняет текстовую и синтаксическую неоднозначность ܫܘ̈ܕܐ ܕܢܦܫ̈ܬܐ ܘܕܫ̈ܐܕܐ ܕܦܪ̈ܨܘܦܐ, не превращая один спорный вариант в утверждение основного текста.
lexical_decisions:
- source_word: ܡܢܝܢ ... ܙܒܢܝ̈ܢ
  choice: то время будет разделено на двенадцать частей
  rationale: Последовательное перечисление частей и контрольная рукописная традиция поддерживают двенадцатичленную схему, хотя распознанное чтение числительного на странице нестабильно.
- source_word: ܡܬܬܝܕܥܐ
  choice: известна
  rationale: Сохраняет значение «известна, распознаётся» и не подменяет его более узким «сберегается» или «открывается».
- source_word: ܙ̈ܘܥܐ
  choice: потрясения
  rationale: Первое употребление передаёт более широкие смуты и потрясения, не смешивая их с названными далее землетрясениями.
- source_word: ܪ̈ܘܪܒܢܐ
  choice: великих
  rationale: Сохраняет широкое обозначение влиятельных или знатных людей без уточнения их общественного положения.
- source_word: ܫܕܪܘܬܐ ܕܚܪܒܐ
  choice: меч будет послан
  rationale: Передаёт активный образ посылаемого меча естественнее, чем буквальное русское существительное «послание меча».
- source_word: ܬܗܪ̈ܐ
  choice: ужасы
  rationale: В данном перечне слово обозначает вызывающие ужас явления; выбор сохраняет зловещий апокалиптический тон.
- source_word: ܡܚܘ̈ܬܐ
  choice: бедствия
  rationale: Передаёт совокупные поражения и кары, не сужая значение исключительно до эпидемий.
- source_word: ܫܘ̈ܕܐ ܕܢܦܫ̈ܬܐ
  choice: нападения духов
  rationale: Контекст перечня бедствий указывает на враждебную духовную активность; «духов» оставляет возможное значение «душ» для примечания.
- source_word: ܫ̈ܐܕܐ ... ܦܪ̈ܨܘܦܐ
  choice: демонов-призраков
  rationale: Компактно сохраняет упоминание демонических существ и зримых призрачных проявлений, не сводя их к психологическим страхам.
- source_word: ܚܛܘܦܝܐ
  choice: разграбление
  rationale: Передаёт насильственное отнятие имущества как событие в ряду бедствий.
- source_word: ܐܢܘܣܝܐ
  choice: угнетение
  rationale: Отражает принуждение и насильственное притеснение в естественной для пророческого регистра форме.
theological_decisions:
- issue: Число частей времени бедствий
  choice: двенадцать частей
  alternative: тридцать времён или периодов
  rationale: Чтение на данной странице нестабильно, однако структура последовательного перечня и более широкая текстовая традиция весомо поддерживают двенадцать частей.
- issue: Сверхъестественные существа в восьмой части
  choice: духи и демоны-призраки представлены как реальные участники образного мира видения
  alternative: психологические страхи или обезличенные бедствия
  rationale: Сирийский текст прямо называет духов и демонов, поэтому сверхъестественная сторона высказывания не натурализуется.
- issue: Неясный синтаксис описания восьмой части
  choice: нападения духов и демонов-призраков
  alternative: нападения духов и демонов, являющихся в разных обликах
  rationale: Основной текст сохраняет сжатость и напряжённость сирийской конструкции, а примечание указывает на возможную иную связь последних слов.
