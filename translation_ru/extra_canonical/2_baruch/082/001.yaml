  text: 'For now we see the abundance of the prosperity of the nations while they act wickedly, but they are compared to a drop. We look on the force of their power, but they will be reckoned as spittle. We consider the glory of their greatness, though they do not keep the commandments of the Mighty One, but have treated them with contempt. And we consider the beauty that is seen, though it is shaken in afflictions; but they will be sought out like flesh in pain. We think on the confidence in which they trust, though before our eyes it is shaken; but they will be crushed like a wave. And we seek only the hope of their strength, though it flourishes in the good things God gave them; but it will be laid away, and lamentation will come upon it.


    For the Most High is indeed hastening his times and bringing near his hours. He will judge those who oppress, and the heraldings of the age will go forth. The hidden things of all their sins will be revealed, and the quiet thoughts of what is right will spring forth. Those who now think they can escape will not be able to save themselves, nor will anyone make a covenant with famine by abundance of food. The humble will not place their hope in prosperity; rather, their heart rejoices in those things that endure. Instead, they will hope all the more because that fearsome end has arrived. They will not look on the delights of the present age, and they will know only that they are being brought to the end. But the consummation of the world will show the great strength of his governance, when everything enters what is inward and returns to what from the beginning had been appointed. Then it will be seen that what has been found was not established by men, but has truly reached its completion.


    For whatever stood, or was made, or came in conflict and passed away, shows this: evil is not forever evil, and good is not forever good. Every health is turned into sickness, every strength into weakness, every beauty into deformity, and all the bloom of youth into burdened old age. All the beauty you saw turns into darkness and corruption, and every ruin you made turns into peace and pleasantness. Every darkness that had been given turns into the light of truth. Every error and weakness turns into the lowliness of stillness. Every vengeance and wrath turns into rest and strength. And every voice of the wakeful turns into dust-born silence.


    And no possession will again be a return to death for those who seek it. Those who snatch wages will no longer bring forth death before its time, and the death that is the wage of sufferings will be taken away. There will no longer be any occasion of joy merely for delight. The realm of change will be turned into accomplished conflict, and the sound of sinners in Sheol will no longer be heard.


    So when all these things happen, do you think they will not be required from the inhabitants of the earth on one day? If then their own disclosures show that they live, their guilt itself teaches the falsehood that is in them. I have set down its full measure, because they were begotten from falsehood before I die. And I said that they were putting their trust in evil.'
translation:
  language: ru
  text: 'Пока же мы видим, как велико благополучие народов, хотя они творят зло; но сами они — всё равно что капля. Мы смотрим на могущество их силы, но они будут сочтены за плевок. Мы созерцаем славу их величия, хотя они не соблюдают повелений Могущественного, а относятся к ним с презрением. Мы видим их зримую красоту, хотя в бедствиях она колеблется; но их взыщут, словно плоть, терзаемую болью. Мы размышляем об уверенности, на которую они полагаются, хотя на наших глазах она колеблется; но они будут сокрушены, как волна. Мы ищем лишь надежду, которую они возлагают на свою силу, хотя она расцветает среди благ, дарованных им Богом; но она будет сокрыта, и её постигнет плач.


    Ибо Всевышний поистине ускоряет Свои времена и приближает Свои часы. Он будет судить угнетателей, и выйдут возвещения века[a]. Тайны всех их грехов откроются, а смиренные помыслы о праведном дадут ростки. Все, кто теперь думает, что сумеет избежать суда, не смогут спастись; и никто не заключит союза с голодом при помощи изобилия пищи. Смиренные не станут возлагать надежду на благополучие: их сердце радуется тому, что пребывает. Напротив, они будут надеяться ещё больше, потому что настал тот страшный конец. Они не станут смотреть на наслаждения нынешнего века и будут знать лишь то, что их ведут к концу. А завершение мира явит великую силу Его правления, когда всё войдёт во внутреннее[b] и возвратится к тому, что было определено от начала. Тогда станет ясно: найденное было установлено не людьми, но воистину достигло своего завершения.


    Ибо всё, что существовало, было создано или вступило в борьбу и миновало, показывает: зло не навеки остаётся злом, и добро не навеки остаётся добром. Всякое здоровье обращается в болезнь, всякая сила — в немощь, всякая красота — в уродство, а весь цвет юности — в тягостную старость. Вся красота, которую вы видели, обращается во тьму и тление, а всякое разорение, которое вы учинили, — в мир и отраду. Всякая данная тьма обращается в свет истины. Всякое заблуждение и всякая немощь обращаются в смирение безмолвия. Всякое возмездие и всякий гнев обращаются в покой и силу. И всякий голос бодрствующих обращается в безмолвие рождённых из праха.


    И никакое владение уже не станет возвращением к смерти для тех, кто его ищет. Похищающие плату уже не будут навлекать преждевременную смерть, и смерть — воздаяние за страдания — будет устранена. Больше не будет повода к радости лишь ради наслаждения. Царство перемен будет обращено в завершившуюся борьбу, и голос грешников в Шеоле больше не будет слышен.


    Итак, когда всё это произойдёт, разве не взыщут за это с жителей земли в один день? Если их собственные свидетельства показывают, что они живы, то сама их вина обличает ложь, которая в них. Я изложил её полную меру, потому что они были рождены от лжи, прежде чем я умру. И я сказал, что они возлагали надежду на зло.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «провозглашения века» или «знамения века». Сирийское выражение в этом месте текстуально не вполне устойчиво.'
    reason: Сохраняет апокалиптическую неоднозначность шероховатого исходного выражения, не превращая возвещения в людей-вестников.
  - marker: b
    text: 'Буквально: «когда всё войдёт во внутреннее». Смысл сирийского выражения неясен; возможно, речь идёт о возвращении всего к сокрытому изначальному установлению.'
    reason: Не позволяет молча устранить трудность исходного текста.
lexical_decisions:
- source_word: ܡܣܪܗܒ
  choice: ускоряет
  rationale: Передаёт активное ускорение Богом эсхатологических сроков, а не просто их приближение.
- source_word: ܟܘܪ̈ܙܐ ܕܥܠܡܐ
  choice: вестники грядущего века
  rationale: Сохраняет образ возвещения и апокалиптическую отнесённость к наступающему веку; из-за шероховатости текста отмечено примечанием.
- source_word: ܩܨܐ
  choice: конец
  rationale: Естественно передаёт страшный эсхатологический предел; для космического завершения далее использовано «завершение мира».
- source_word: ܚܘܠܡ̈ܢܐ
  choice: здоровье
  rationale: Сохраняет конкретную антитезу здоровья и болезни.
- source_word: ܕܘ̈ܓܐ
  choice: уродство
  rationale: Передаёт резкое превращение красоты в обезображенность, не ослабляя контраст.
- source_word: ܢܗܝܪܘܬܐ ܕܫܪܪܐ
  choice: свет истины
  rationale: Сохраняет и образ света, и смысл истины.
- source_word: ܡܘܩܣܢ
  choice: гнев
  rationale: Соответствует парному ряду языка воздаяния без внесения лишней доктринальной окраски.
- source_word: ܫܝܘܠ
  choice: Шеол
  rationale: Не отождествляет древнее обозначение мира мёртвых с более поздним и богословски узким понятием ада.
- source_word: ܢܘܛܦܬܐ / ܪܘܩܩܐ
  choice: капля / плевок
  rationale: Сохраняет два конкретных уничижительных образа и не подменяет второй образом мимолётного пара.
theological_decisions:
- issue: Божественные титулы
  choice: Различены «Всевышний» и «Могущественный»
  alternative: Передать оба одним общим титулом
  rationale: Различение сохраняет риторическую и богословскую фактуру сирийского текста.
- issue: Ряд эсхатологических превращений
  choice: Передан как апокалиптическое окончательное преображение
  alternative: Истолковать как общее наблюдение о переменчивости земной жизни
  rationale: Контекст суда, завершения мира и Шеола указывает на окончательный расчёт и преображение.
- issue: ܫܝܘܠ
  choice: Сохранено «Шеол»
  alternative: Перевести как «ад» или «преисподняя»
  rationale: Это сохраняет древнюю неоднозначность представления о мире мёртвых и не вносит позднейшей конкретизации.
- issue: Парадокс о добре и зле
