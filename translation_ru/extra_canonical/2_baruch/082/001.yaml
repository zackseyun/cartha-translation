revisions:
- from: 'Пока же мы видим, как велико благополучие народов, хотя они творят зло, но сами они — всё равно что капля. Мы смотрим на могущество их силы, но они будут сочтены плевком. Мы созерцаем славу их величия, хотя они не соблюдают повелений Могущественного, а относятся к ним с презрением. Мы видим их зримую красоту, хотя в бедствиях она колеблется, но их взыщут, словно плоть, терзаемую болью. Мы размышляем об уверенности, на которую они полагаются, хотя на наших глазах она колеблется, но они будут сокрушены, как волна. Мы ищем лишь надежду, которую даёт им их сила, хотя она расцветает среди благ, дарованных им Богом, но она будет сокрыта, и её постигнет плач.


    Ибо Всевышний поистине ускоряет Свои времена и приближает Свои часы. Он будет судить угнетателей, и выйдут вестники грядущего века[a]. Тайны всех их грехов откроются, а кроткие помыслы о праведном дадут ростки. Все, кто теперь думает, что сумеет избежать суда, не смогут спастись; и никто не заключит союза с голодом при помощи изобилия пищи. Смиренные не станут возлагать надежду на благополучие: их сердце радуется тому, что пребывает. Напротив, они будут надеяться ещё больше, потому что настал тот страшный конец. Они не станут смотреть на наслаждения нынешнего века и будут знать лишь то, что их ведут к концу. А завершение мира явит великую силу Его правления, когда всё войдёт внутрь[b] и возвратится к тому, что было определено от начала. Тогда станет ясно: найденное было установлено не людьми, но воистину достигло своего завершения.


    Ибо всё, что существовало, было создано или вступило в борьбу и миновало, показывает: зло не навеки остаётся злом, и добро не навеки остаётся добром. Всякое здоровье обращается в болезнь, всякая сила — в немощь, всякая красота — в уродство, а весь цвет юности — в тягостную старость. Вся красота, которую вы видели, обращается во тьму и тление, а всякое разорение, которое вы учинили, — в мир и отраду. Всякая данная тьма обращается в свет истины. Всякое заблуждение и всякая немощь обращаются в смирение безмолвия. Всякое возмездие и всякий гнев обращаются в покой и силу. И всякий голос бодрствующих обращается в безмолвие рождённых из праха.


    И никакое владение уже не станет возвращением к смерти для тех, кто его ищет. Похищающие плату уже не будут навлекать преждевременную смерть, и смерть — воздаяние за страдания — будет устранена. Больше не будет повода к радости лишь ради наслаждения. Царство перемен будет обращено в завершившуюся борьбу, и голос грешников в Шеоле больше не будет слышен.


    Итак, когда всё это произойдёт, неужели ты думаешь, что в один день с жителей земли этого не взыщут? Если их собственные признания показывают, что они живы, то сама их вина обличает ложь, которая в них. Я изложил её полную меру, потому что они были рождены от лжи, прежде чем я умру. И я сказал, что они возлагали надежду на зло.'
