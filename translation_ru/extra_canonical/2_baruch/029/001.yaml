  text: And he answered and said to me, “Whatever is destined to happen at that time will happen upon the whole earth; therefore, all who live will experience[a] it.”
translation:
  language: ru
  text: 'И он ответил и сказал мне: «Всё, чему предстоит произойти в то время, произойдёт по всей земле; поэтому все живущие испытают это на себе[a]».'
