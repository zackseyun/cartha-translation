lexical_decisions:
- source_word: ܕܥܬܝܕ
  choice: чему предстоит
  rationale: Передаёт направленность в будущее, выраженную ܥܬܝܕ, не усиливая её до однозначного утверждения о предопределении.
- source_word: ܢܪܓܫܘܢ
  choice: испытают это на себе
  rationale: Корень ܪܓܫ буквально связан с ощущением и восприятием; в контексте событий, охватывающих всю землю, выражение означает, что все живущие непосредственно их ощутят или переживут.
- source_word: ܥܠ ܟܠܗ̇ ܐܪܥܐ
  choice: по всей земле
  rationale: Естественно передаёт всеобщий земной охват происходящего, сохраняя возможность понимать ܐܪܥܐ как землю или мир людей.
theological_decisions:
- issue: Оттенок будущей предопределённости в ܕܥܬܝܕ
  choice: чему предстоит произойти
  alternative: чему суждено произойти
  rationale: Выбранный вариант сохраняет эсхатологическую неизбежность контекста, но не вводит более сильного учения о предопределении, чем требует сирийское слово.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Формула «ответил и сказал» сохранена как характерная для исходного текста, несмотря на её смысловую избыточность по-русски.
