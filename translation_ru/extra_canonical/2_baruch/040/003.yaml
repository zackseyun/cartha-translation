  text: And his dominion will stand forever, until the world of corruption comes to its end, and until the times spoken of before are fulfilled.
translation:
  language: ru
  text: И его владычество пребудет вовеки, пока не придёт конец миру тления и не исполнятся времена, о которых было сказано прежде.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܠܛܢܗ (восстанавливается по контексту продолжения стиха)
  choice: его владычество
  rationale: Передаёт царскую власть и господство Мессии; «владычество» соответствует возвышенному апокалиптическому регистру.
- source_word: ܠܥܠܡ (восстанавливается по контексту продолжения стиха)
  choice: вовеки
  rationale: Сохраняет формулу неограниченной длительности и её намеренное соседство с последующим «пока».
- source_word: ܥܠܡܐ ܕܚܒܠܐ (восстанавливается по контексту продолжения стиха)
  choice: мир тления
  rationale: Сохраняет апокалиптическое обозначение нынешнего порядка, подверженного порче и разрушению, не сводя его только к нравственной испорченности.
theological_decisions:
- issue: Соотношение «вовеки» и временного предела, вводимого словом «пока»
  choice: Сохранить обе формулировки без согласующего пояснения
  alternative: Ослабить «вовеки» до «надолго» либо истолковать конец мира как конец самого владычества
  rationale: В тексте присутствует подлинное напряжение между вечностью владычества и завершением мира тления; перевод не должен заранее разрешать его богословским толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным апокалиптическим звучанием. «Пребудет» и «вовеки» уместны в сакральном контексте, но остаются понятными современному читателю. Представленный сирийский фрагмент страницы обрывается в начале главы 40 до полного текста стиха 3, поэтому формулировка сверена с предоставленным контрольным английским слоем и ожидаемым продолжением сирийского текста.
