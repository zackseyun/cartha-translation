base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/040/001.yaml
  text: The last ruler of that time will be left alive, when the multitude of his hosts has been struck down by the sword; and he will be bound, and they will bring him up to Mount Zion. And my Messiah will convict him of all his impieties, and will set before him all the wicked deeds of his hosts.
translation:
  language: ru
  text: Последний правитель того времени будет оставлен в живых после того, как множество его воинов будет поражено мечом. Его свяжут и приведут на гору Сион. И Мой Мессия обличит его во всём его нечестии и представит ему все злодеяния его войск.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܝܫܘܬܗ
  choice: во всём его нечестии
  rationale: «Нечестие» сохраняет не только нравственную порочность, но и направленность зла против Бога; оборот естественно звучит в сцене мессианского суда.
- source_word: ܥܒ̈ܕܝܗܘܢ ܕܒܝܫܘܬܗܘܢ
  choice: все злые дела его воинств
  rationale: Перевод сохраняет и конкретное указание на дела, и их нравственную оценку, и собирательный военный субъект.
- source_word: ܛܘܪ ܨܗܝܘܢ
  choice: гора Сион
  rationale: Это естественная русская библейская форма географического названия, сохраняющая место мессианского суда.
- source_word: ܡܫܝܚܝ
  choice: Мой Мессия
  rationale: Притяжательная форма и явное мессианское наименование переданы непосредственно, без сведения фигуры к безличной эпохе или символу.
theological_decisions:
- issue: Роль Мессии в суде над последним правителем
  choice: Мессия представлен как личный судья, обличающий последнего правителя на горе Сион.
  alternative: Понимать Мессию лишь как символ мессианской эпохи или как неназванного помазанного посредника.
  rationale: Текст прямо говорит «Мой Мессия» и приписывает ему конкретное судебное действие; личный смысл следует сохранить, не добавляя дальнейших догматических уточнений.
- issue: Судебный оттенок глагола, относящегося к нечестию правителя
  choice: обличит
  alternative: осудит; докажет его виновность
  rationale: «Обличит» сохраняет значение выявления и предъявления вины, но не уточняет сверх текста юридическую процедуру или окончательный приговор.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Пассивные конструкции сохранены там, где они важны для последовательности событий; архаизмы и конфессионально маркированные формулы не использованы.
