  text: And afterward he will put him to death, and he will protect the rest of my people, those who are found in the place that I have chosen.
translation:
  language: ru
  text: После этого он предаст его смерти[a] и сохранит остаток Моего народа — тех, кто окажется в месте, которое Я избрал.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: По контексту «он» — Мессия, а «его» — последний враждебный властитель.
    reason: Русские местоимения сохраняют неоднозначность изолированного стиха; примечание уточняет ближайшие контекстуальные референты, не подменяя ими основной текст.
lexical_decisions:
- source_word: 'English consultation: put him to death'
  choice: предаст его смерти
  rationale: Передаёт каузативный смысл без стилистически резкого «убьёт» и соответствует достоинству апокалиптической речи.
- source_word: 'English consultation: protect'
  choice: сохранит
  rationale: В контексте остатка народа обозначает и защиту, и сохранение от гибели; формулировка естественна для современного литературного русского языка.
- source_word: 'English consultation: the rest of my people'
  choice: остаток Моего народа
  rationale: Сохраняет библейски значимое понятие уцелевшего остатка, не сводя его к нейтральному «остальным».
- source_word: 'English consultation: are found in the place'
  choice: окажется в месте
  rationale: Естественно выражает факт нахождения людей в избранном месте, избегая неидиоматического «будут найдены».
theological_decisions:
- issue: Референты местоимений «он» и «его»
  choice: Сохранены местоимениями без внесения имён в основной текст.
  alternative: Явно назвать Мессию и противника.
  rationale: Контекст связывает действующее лицо с Мессией, а объект — с последним властителем, однако сам стих выражает их местоимениями; раскрытие имён в тексте устранило бы исходную анафорическую зависимость.
- issue: Значение «остатка»
  choice: Сохранён термин «остаток Моего народа».
  alternative: «Остальных из Моего народа».
  rationale: «Остаток» сохраняет богословскую и межтекстовую насыщенность выражения, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Заглавные буквы в «Моего» и «Я» передают речь Бога; местоимение, относящееся к Мессии, намеренно оставлено со строчной буквы. Исходный сирийский фрагмент на предоставленной странице обрывается у начала главы 40 и не содержит полного текста стиха 40:2, поэтому формулировка опирается на доступный контекст главы и проверенный английский консультационный слой; спорные референты не внесены в основной текст.
