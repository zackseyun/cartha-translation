  text: Итак, кто понимает, тот в то время будет мудр.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленный сирийский фрагмент заканчивается текстом предыдущей главы и не содержит слов этого стиха; перевод следует восстановленному чтению 2 Варуха 28:1, сохранённому в контрольном слое.
    reason: textual_source_gap
lexical_decisions:
- source_word: (текст 28:1 отсутствует в предоставленном сирийском фрагменте)
  choice: кто понимает
  rationale: Формулировка следует восстановленному, прошедшему проверку чтению; «понимает» естественно передаёт интеллектуальное и духовное разумение, не добавляя толкования.
- source_word: (соответствие ‘then’)
  choice: в то время
  rationale: Так яснее сохраняется временной, апокалиптический смысл, чем при более расплывчатом «тогда».
- source_word: (соответствие ‘shall be wise’)
  choice: будет мудр
  rationale: Краткая предикативная конструкция сохраняет связь между пониманием и мудростью, не превращая её в причинное или нравоучительное пояснение.
theological_decisions:
- issue: Следует ли понимать мудрость как обещание, повеление или характеристику понимающего
  choice: 'Сохранено утверждение будущего времени: «будет мудр».'
  alternative: «пусть поступает мудро»; «проявит мудрость»
  rationale: Аудированное чтение имеет форму утверждения, а не повеления; более разъясняющие варианты необоснованно сужают смысл.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, возвышенная, но общепонятная. Синтаксический параллелизм «кто… тот…» сохраняет афористичность исходного чтения.
