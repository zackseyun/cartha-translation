  text: Ибо они знают, что настало их мучение и пришла их погибель.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܢܩܗܘܢ (контекстуально восстанавливаемое чтение)
  choice: их мучение
  rationale: Передаёт значение страдания или кары без уточнения её характера; соответствует сирийской смысловой традиции данного стиха.
- source_word: ܐܒܕܢܗܘܢ (контекстуально восстанавливаемое чтение)
  choice: их погибель
  rationale: Сохраняет сильное значение уничтожения или гибели и не сужает его до смерти отдельных лиц.
theological_decisions:
- issue: Соотношение мучения и погибели
  choice: 'Сохранены два самостоятельных образа: «мучение» и «погибель».'
  alternative: Объединить их как единое окончательное наказание.
  rationale: Параллелизм исходного свидетельства следует сохранить, не отождествляя и не разграничивая эти понятия богословски сверх текста.
