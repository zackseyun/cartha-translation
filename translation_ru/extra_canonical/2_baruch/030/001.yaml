    rationale: Исходная конструкция говорит о завершении назначенного времени; «срок пришествия» точнее передаёт этот временной предел и естественнее по-русски.
  - severity: low
    issue: «С надеждой на Него» менее идиоматично в этом контексте.
    rationale: «В надежде на Него» сохраняет направленность надежды и лучше соответствует литературному русскому употреблению.
