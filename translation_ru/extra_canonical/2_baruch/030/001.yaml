  naturalness: «И будет после этого» и «завершится время пришествия» понятны, но несколько тяжеловесны для современного литературного русского. «После этих событий» и «завершится срок пришествия» звучат естественнее, не меняя смысла. Предлог «в надежде на Него» более обычен в данном контексте, чем «с надеждой на Него».
  terminology: «Мессия», «пришествие», «во славе», «уснувшие» и «восстанут» удачно сохраняют мессианскую и воскресную лексику без конфессионального истолкования. Прописное «Он/Него» допустимо как ясная анафорическая отсылка к Мессии.
