  text: And it will happen after these things, when the time of the coming of the Messiah is completed and he returns with glory, then all those who sleep in hope of him will rise.
translation:
  language: ru
  text: И после этих событий, когда завершится срок пришествия Мессии и Он возвратится во славе, восстанут все уснувшие в надежде на Него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܐܬܝܬܗ ܕܡܫܝܚܐ
  choice: пришествия Мессии
  rationale: Сохраняет прямое мессианское наименование и естественно передаёт сирийское выражение о приходе Мессии.
- source_word: ܢܬܦܣܩ
  choice: завершится
  rationale: Передаёт достижение срока или завершение назначенного времени, не усиливая оттенок исполнения пророчества.
- source_word: ܕܡܟܝܢ / источник отражён в контрольном чтении
  choice: уснувшие
  rationale: Сохраняет традиционную и богословски значимую метафору смерти как сна.
- source_word: ܒܣܒܪܗ
  choice: с надеждой на Него
  rationale: Естественное русское выражение, сохраняющее направленность надежды на Мессию.
- source_word: ܢܩܘܡܘܢ
  choice: восстанут
  rationale: В контексте уснувших обозначает воскресение, но сохраняет образный глагол исходного текста.
theological_decisions:
- issue: Характер возвращения Мессии
  choice: возвратится во славе
  alternative: возвратится со славой
  rationale: «Во славе» естественно для современного литературного русского и не превращает славу в отдельный сопровождающий предмет.
- issue: Объём обещанного воскресения
  choice: все уснувшие с надеждой на Него
  alternative: все умершие
  rationale: Сохраняется ограничение, заданное надеждой на Мессию, и метафора сна; текст не расширяется до всеобщего воскресения без уточнения.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. Местоимение «Он» написано с прописной буквы как ясная отсылка к Мессии; архаизмы и конфессионально специфическая терминология не вводятся.
