translation:
  language: ru
  text: Ибо я знаю, что наступило время, о котором сказано, что это — завершение времён.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝܕܥ
  choice: знают
  rationale: Передаёт значение корня «знать»; множественное число определяется ближайшим контекстом, где речь идёт о многих душах.
- source_word: ܡܛܐ ܙܒܢܐ
  choice: наступило время
  rationale: Естественная русская передача идиомы со значением достижения или наступления назначенного времени.
- source_word: ܫܘܠܡܗ ܕܙܒܢܐ
  choice: завершение времён
  rationale: «Завершение» сохраняет эсхатологический смысл ܫܘܠܡܐ без более конфессионально окрашенного слова «исполнение»; множественное «времён» согласуется с контекстом и древней традицией текста.
theological_decisions:
- issue: Характер эсхатологического завершения
  choice: завершение времён
  alternative: конец времён
  rationale: «Завершение» точнее сохраняет идею достижения полноты или предела, не сводя выражение исключительно к прекращению существования мира.
- issue: Синтаксическая связь относительной конструкции
  choice: '«о котором было сказано: “Это завершение времён”»'
  alternative: «которое, как было сказано, является завершением времён»
  rationale: Прямая цитатная форма ясно и естественно передаёт вложенное высказывание, не уточняя, кем именно оно было произнесено.
translation_notes:
  register: Современный литературный русский язык; краткий, торжественный и доступный эсхатологический стиль. Подлежащее «они» сохранено контекстуально без поясняющей вставки, которой нет в стихе.
