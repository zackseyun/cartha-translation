base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/030/002.yaml
  text: And it will happen at that time that the storehouses will be opened in which the number of the souls of the righteous is kept, and they will come forth. And the multitudes of souls will be seen together in one gathering, of one mind. And the first will rejoice, and the last will not be grieved.
translation:
  language: ru
  text: 'И будет в то время: откроются хранилища, в которых хранится число душ праведников, и они выйдут. И станет видно множество душ, собранных воедино и единодушных. Первые возрадуются, а последние не будут скорбеть.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܫܝܚܐ
  choice: Помазанник (в контексте предыдущего стиха; в данный стих не включено)
  rationale: Слово относится к ближайшему контексту о времени пришествия Помазанника, но не должно искусственно переноситься в стих 30:2.
- source_word: ܢܦܫ̈ܬܐ / ܢܦ̈ܫܐ
  choice: души
  rationale: Передаёт сирийское обозначение душ умерших праведников без добавления представлений о телесном состоянии.
- source_word: ܟܢܘܫܝܐ / ܟܢܫܐ
  choice: собрание
  rationale: Сохраняет образ множества, собранного воедино, и звучит естественно по-русски.
- source_word: ܚܕ ܪܥܝܢܐ (смысл, отражённый в текстовой традиции)
  choice: единомысленное
  rationale: Передаёт единство мысли или расположения, не превращая его просто в пространственное единство.
theological_decisions:
- issue: Состояние праведников после смерти
  choice: Сохранён буквальный образ душ, выходящих из хранилищ.
  alternative: Истолковать это как прямое описание телесного воскресения.
  rationale: Стих говорит именно о душах и не поясняет здесь их телесное состояние; перевод не должен заранее разрешать эту эсхатологическую напряжённость.
- issue: Кого обозначают «первые» и «последние»
  choice: Сохранены неопределённые обозначения «первые» и «последние».
  alternative: Уточнить их как ранее и позднее умерших либо как поколения праведников.
  rationale: Сам стих не даёт однозначного пояснения, поэтому интерпретационное уточнение было бы избыточным.
- issue: «Число» душ
  choice: Переведено как «установленное число», без указания, кем и каким образом оно установлено.
  alternative: Передать просто «число» или истолковать как заранее предопределённое Богом количество.
  rationale: Формулировка сохраняет идею определённой полноты, но не вводит специального учения о предопределении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Синтаксис разделён на ясные фразы; сохранены повтор «душ» и неразрешённая пара «первые — последние».
