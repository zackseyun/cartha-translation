  yaml_path: translation/extra_canonical/2_baruch/085/001.yaml
  text: '… the times are close and already pressing in. The pitcher is near the well, the ship the harbor, the journey the city, and life its completion.


    So then receive his commandments, that you may not be cut off from the greatness of his mercy, but may find rest and not condemnation.


    For when the Most High brings these things to pass, there will no longer be room for repentance, or a boundary for the times, or an extension of the seasons, or a turning toward rest; nor will anyone be helped by prayer, or by the mediation of fathers, or by the petition of prophets, or by the aid of the righteous, or by the weeping of women, or by the tenderness of little children, or by the crying of infants, or by the innocence of newborns, or by the righteousness of their fathers. None of the things once thought and seen to be helpers will be able to help.


    For each of us will then be judged by himself alone.


    And he will preserve for his age those who have hope in him, but he will at once destroy those who are defiled with sins.'
translation:
  language: ru
  text: '…времена близки и уже надвигаются. Кувшин — у колодца, корабль — у гавани, путь — у города, а жизнь — у своего завершения.


    Итак, примите Его заповеди, чтобы не лишиться полноты Его милости, но обрести покой, а не осуждение.


    Ибо, когда Всевышний совершит всё это, уже не останется ни места для покаяния, ни предела временам, ни продления сроков, ни обращения к покою; и никто не получит помощи ни через молитву, ни через заступничество отцов, ни через прошение пророков, ни через содействие праведников, ни через плач женщин, ни через нежность маленьких детей, ни через плач младенцев, ни через чистоту новорождённых, ни через праведность их отцов. Ничто из того, что прежде считалось и представлялось способным помочь, помочь не сможет.


    Ибо тогда каждый из нас будет судим сам по себе.


    А тех, кто возлагает на Него надежду, Он сохранит для Своего века, но тех, кто осквернён грехами, сразу погубит.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܦܩ̈ܘܕܘܗܝ
  choice: Его заповеди
  rationale: Передаёт авторитетные божественные повеления и сохраняет заветно-наставительный оттенок.
- source_word: ܬܐܢܝܚܘܢ
  choice: обрести покой
  rationale: Сохраняет как значение облегчения, так и эсхатологический оттенок покоя в противопоставлении осуждению.
- source_word: ܒܒܟܝܐ ܕܢܫ̈ܐ
  choice: через плач женщин
  rationale: Буквальная и естественная передача сохраняет выразительность перечисления тщетных ходатайств.
- source_word: ܒܛܝܒܘܬܐ ܕܛܠܝ̈ܐ
  choice: через кротость малых детей
  rationale: Слово допускает оттенки доброты, приятности и трогательной мягкости; «кротость» естественно обозначает нравственно-эмоциональную привлекательность детей, не сводя её прямо к безгрешности.
- source_word: ܒܕܟܝܘܬܐ ܕܝܠܝ̈ܕܐ
  choice: через чистоту новорождённых
  rationale: «Чистота» непосредственно передаёт ܕܟܝܘܬܐ и сохраняет отличие от предшествующей характеристики малых детей.
- source_word: ܐܬܪܐ ܠܬܝܒܘܬܐ (контрольное чтение вместо повреждённого ܐܪܙܐ ܠܬܚܘܝܬܐ)
  choice: места для покаяния
  rationale: Следует восстановленному по контрольным свидетельствам чтению, согласующемуся с контекстом окончательного суда.
- source_word: ܡܬܬܕܝܢ
  choice: будет судим
  rationale: Прямо передаёт значение глагола «быть судимым», не заменяя его менее точным образом стояния на суде.
- source_word: ܡܦܠܓܝܢ ܒܚܛܝ̈ܬܐ
  choice: осквернён грехами
  rationale: Идиоматически выражает нравственное состояние; буквальная идея разделённости или рассеянности по грехам в русском была бы неясна.
theological_decisions:
- issue: Следует ли свести длинный перечень бессильных ходатайств к общему утверждению
  choice: Сохранены отдельно молитва, отцы, пророки, праведники, женщины, дети и младенцы.
  alternative: 'Обобщить: «тогда никакое заступничество не поможет».'
  rationale: Накопительная риторика сирийского текста подчёркивает окончательность суда и личную ответственность; сокращение ослабило бы этот акцент.
- issue: Как передать личную ответственность каждого
  choice: «каждый из нас будет судим сам по себе»
  alternative: «каждый из нас будет стоять сам по себе»
  rationale: Основное чтение прямо отражает глагол со значением суда; образ «стоять» оставлен в примечании как традиционно возможная контекстуальная передача.
- issue: Насколько явно обозначить объект надежды в заключении
  choice: «тех, кто возлагает на Него надежду»
  alternative: «тех, в ком есть надежда»
  rationale: Явное местоименное отношение соответствует контексту и делает русский синтаксис ясным, не вводя дополнительного учения.
- issue: Как передать выражение о сохранении «для Его века»
  choice: Сохранено непривычное, но значимое выражение «для Своего века».
  alternative: «навеки» или «для будущего века».
  rationale: Сирийское выражение допускает эсхатологический смысл, однако развёртывание его до «будущего века» устранило бы сохраняющуюся в источнике неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским ритмом. Длинное перечисление сохранено ради риторической силы оригинала; архаизмы и конфессионально окрашенные уточнения не добавлялись.
