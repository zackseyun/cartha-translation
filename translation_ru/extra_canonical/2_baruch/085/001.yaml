  verdict: revise
  source_fidelity: 'Основной текст в целом точно следует сирийскому смыслу, отражённому в английской контрольной версии: сохранены образы близости конца, перечень бесполезных ходатайств, прямой смысл «будет судим» и намеренно не конкретизированное «для Своего века». Однако примечание предлагает вариант «будет стоять сам по себе», хотя сирийский глагол ܡܬܬܕܝܢ означает «быть судимым»; этот вариант не следует представлять как текстуально равноправный.'
  naturalness: Текст литературный и в целом естественный. Исправлены несколько шероховатостей управления («продления сроков») и лексика «кротость малых детей», где «нежность маленьких детей» точнее передаёт эмоционально-привлекательный оттенок ܛܝܒܘܬܐ и лучше звучит по-русски. «Отлучёнными» заменено, поскольку в современном русском оно вызывает специфическую ассоциацию с церковным отлучением, отсутствующую в исходном образе лишения милости.
  terminology: «Заповеди», «покой», «покаяние», «праведники», «осуждение» и «осквернён грехами» уместны. Высокое «Всевышний» соответствует регистру. Формула «для Своего века» сохранена без догматического уточнения.
  issues:
  - severity: medium
    issue: Сноска a вводит «стоять сам по себе» как альтернативу к «будет судим».
    rationale: Сирийское ܡܬܬܕܝܢ прямо означает «будет судим». Образ стояния не является альтернативным переводом данного глагола и был в контрольной истории заменён как менее точный.
  - severity: low
    issue: «Кротость малых детей» неточно передаёт ܒܛܝܒܘܬܐ ܕܛܠܝ̈ܐ.
    rationale: Здесь речь о трогательной нежности/привлекательности детей как предполагаемом основании для мольбы, а не о нравственной добродетели кротости.
  - severity: low
    issue: «Продления срокам» нарушает норму управления.
    rationale: В конструкции с «ни» требуется форма «ни продления сроков».
  - severity: low
    issue: «Отлучёнными от полноты Его милости» имеет нежелательную конфессионально-юридическую окраску.
    rationale: «Отлучить» в современном церковном русском обычно означает исключить из общины; исходный смысл — лишиться/быть отсечённым от великой милости.
