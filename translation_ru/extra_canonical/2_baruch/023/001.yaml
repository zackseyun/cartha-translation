theological_decisions:
- issue: Грех Адама и определение смерти для будущих поколений
  choice: «для тех, кому предстояло родиться, была определена смерть»
  alternative: «смертность была установлена для потомков Адама»
  rationale: Выбранная формулировка сохраняет коллективную и апокалиптическую логику текста, не вводя более поздней доктринальной системы.
- issue: Божественное животворящее действие и приём мёртвых Шеолом
  choice: «Мой Дух даёт жизнь, а Шеол принимает мёртвых»
  alternative: «Мой дух творит живых, а преисподняя хранит мёртвых»
  rationale: Перевод ясно сохраняет противопоставление жизни и смерти, но не делает утверждение более догматически точным, чем позволяет свидетельство.
- issue: Оживление творения после достижения установленного числа
  choice: «творение не оживёт вновь»
  alternative: «создание не будет снова жить»
  rationale: Сохранено собирательное единственное число и эсхатологическое напряжение фразы без подмены его конкретной схемой воскресения.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Параллелизм вопросов и противопоставление Духа и Шеола сохранены. Заглавные буквы в местоимениях и выражении «Мой Дух» обозначают речь Бога, но формулировка не навязывает позднейшей конфессиональной трактовки. Поскольку предоставленный сирийский фрагмент на странице относится к соседнему материалу и не содержит надёжно различимого полного текста данного стиха, проект следует аудированной английской консультационной версии, сохраняя отмеченные ею смысловые напряжения.
