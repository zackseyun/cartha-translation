  yaml_path: translation/extra_canonical/2_baruch/023/001.yaml
  text: And I answered and said, “No, Lord, my Lord.” And he answered and said to me, “Why are you troubled about what you do not know, and why are you disturbed over matters of which you are ignorant? For just as you have not forgotten those who now exist and those who have passed away, so I remember those who are to come. For when Adam sinned and death was decreed for those who would be born, then the multitude of those who would be born was numbered, and for that number a place was prepared, where the living might dwell and the dead might be kept. Unless, therefore, that number which was appointed beforehand is completed, the creature will not live again. For my Spirit is the giver of life, and Sheol receives the dead. Moreover, it has been granted to you to hear what will come after these times. For my salvation has truly drawn near, and is not as far off as it was before.”
translation:
  language: ru
  text: 'И я ответил: «Нет, Господи, Владыка мой». Тогда Он сказал мне: «Почему ты тревожишься о том, чего не знаешь, и смущаешься из-за того, что тебе неведомо? Как ты не забыл ни тех, кто живёт ныне, ни тех, кто уже ушёл, так и Я помню тех, кому ещё предстоит прийти. Когда Адам согрешил и для тех, кому предстояло родиться, была определена смерть, тогда было исчислено всё множество будущих рождений и для него приготовлено место, где могли бы обитать живые и содержаться мёртвые. Поэтому, пока не достигнет полноты заранее установленное число, творение не оживёт вновь. Ведь Мой Дух даёт жизнь, а Шеол принимает мёртвых[a]. Кроме того, тебе дано услышать, что произойдёт после этих времён. Ибо Моё спасение воистину приблизилось: теперь оно не так далеко, как прежде».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Шеол — в древнееврейской и иудейской традиции область мёртвых; здесь это не обязательно обозначение места окончательного наказания.
