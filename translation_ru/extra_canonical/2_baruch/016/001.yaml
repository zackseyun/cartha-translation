base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/016/001.yaml
  text: And I answered and said, "O Lord, my Lord, the years of this age are few and evil, and who can acquire, in so little time, that which is immeasurable?"
translation:
  language: ru
  text: 'И я ответил: «Господи, Владыка мой! Годы этого века[a] коротки и полны зла. Кто же может за столь краткий срок обрести[b] то, что неизмеримо?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «этого времени»; слово может обозначать как определённый период, так и нынешний век.'
    reason: Сохраняет смысловую широту временного выражения в сирийском тексте.
  - marker: b
    text: 'Или: «достичь».'
    reason: Глагол допускает оттенки приобретения и достижения.
lexical_decisions:
- source_word: ܫ̈ܢܝܗܝ
  choice: годы
  rationale: Сирийское слово обозначает годы и сохраняет конкретный образ краткости человеческой жизни.
- source_word: ܙܒܘ̈ܢܝ
  choice: этого века
  rationale: В апокалиптическом контексте выражение относится к нынешнему смертному порядку, хотя буквально может пониматься и как «это время».
- source_word: ܡܫܟܚ
  choice: может обрести
  rationale: Глагольная формулировка передаёт вопрос о способности человека достичь или приобрести желаемое в пределах краткой жизни.
- source_word: ܡܟܝܠܐ
  choice: за столь краткий срок
  rationale: Контекст противопоставляет малую меру отпущенного человеку времени тому, что не поддаётся измерению.
- source_word: ܡܫܘܚܬܐ
  choice: то, что неизмеримо
  rationale: Такая передача сохраняет риторическое противопоставление краткого, измеримого срока и неизмеримой цели.
theological_decisions:
- issue: Ставит ли Варух под сомнение Божью справедливость или сетует на ограниченность человеческой жизни перед неизмеримой целью?
  choice: Передать слова как скорбный вопрос о человеческой ограниченности, не отрицая реальности и ценности самой цели.
  alternative: Передать вопрос как прямое сомнение в справедливости Божьего требования.
  rationale: Ближайший контекст отвечает Варуху, указывая, что итог определяется не продолжительностью жизни, а послушанием и нравственным выбором; при этом вопрос сохраняет напряжённость и не превращается в отвлечённое утверждение.
translation_notes:
  register: Современный литературный русский язык с достоинством молитвенного обращения. Формула «Господи, Владыка мой» передаёт повторное обращение без тяжеловесности; «коротки и полны зла» звучит естественнее буквального «немногочисленны и злы», сохраняя смысл исходного сетования.
