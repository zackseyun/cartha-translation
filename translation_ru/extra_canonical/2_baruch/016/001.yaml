  source_fidelity: 'Русский текст точно передаёт риторическую структуру сирийского стиха: ответ Варуха, двойное обращение к Господу, краткость и бедственность лет нынешнего порядка, а затем вопрос о возможности обрести неизмеримое за малый срок. «Годы этого века» обоснованно отражает апокалиптическое значение ܙܒܘ̈ܢܝ, а сноска сохраняет возможное более узкое «этого времени».'
  naturalness: Формулировка современная, литературная и молитвенно-возвышенная без архаизации. «Господи, Владыка мой» естественно передаёт усиленное обращение; «коротки и полны зла» ясно выражает смысл «немногие/краткие и злые».
  terminology: «Век» уместен для нынешнего мирового порядка и не навязывает доктринального толкования благодаря сноске. «Обрести» соответствует активному значению глагола; сноска «достичь» достаточна. «То, что неизмеримо» сохраняет предметную и несколько открытую формулировку оригинала.
