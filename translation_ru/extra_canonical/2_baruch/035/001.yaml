  yaml_path: translation/extra_canonical/2_baruch/035/001.yaml
  text: 'And I, Baruch, went to the holy gate, and sat down in humility, and I wept and said:


    “O my eyes, become springs,

    and eyelids of water, a fountain of tears.

    For how can I find rest over Zion?

    And how can I weep for Jerusalem?

    For the people whom I nourished

    and who were formerly greater than I in vision

    have been shaken with trembling.”'
translation:
  language: ru
  text: 'И я, Варух, пошёл к святым воротам, сел в смирении, заплакал и сказал:


    «О, глаза мои, станьте родниками,


    пусть веки мои станут источником вод,

    источником слёз!


    Ибо как мне обрести покой о Сионе?


    Как мне оплакивать Иерусалим?[a]


    Ведь народ, который я вскормил


    и который прежде превосходил меня видением,


    содрогнулся в трепете».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, согласно буквальному чтению сохранившегося сирийского текста: «Как мне плакать о скорби и обрести это?»'
    reason: Слово в сирийском свидетельстве нестабильно; основное чтение «Иерусалим» восстанавливает параллелизм с Сионом, а сноска сохраняет доступный буквальный вариант.
lexical_decisions:
- source_word: ܬܪܥܐ ܩܕܝܫܐ
  choice: к святым воротам
  rationale: Сирийское выражение конкретно обозначает святые ворота или дверь. Русское «ворота» естественно передаёт вход в священное место, не заменяя образ более общим «святым местом».
- source_word: ܡ̈ܟܝܟܐܝܬ
  choice: в смирении
  rationale: Наречие выражает приниженность и смирение; предложная форма сохраняет торжественный тон плача и остаётся понятной современному читателю.
- source_word: ܡܒܘ̈ܥܐ
  choice: родниками
  rationale: Сохраняются множественное число и живой образ непрерывно текущей воды.
- source_word: ܐܡܘ̈ܬܐ
  choice: веки мои
  rationale: Контрольная текстовая традиция поддерживает значение части глаза. Выбор «веки» сохраняет телесный образ слёз, хотя следующая метафора намеренно остаётся необычной.
- source_word: ܐܬܬܢܝܚ
  choice: обрести покой
  rationale: Глагол допускает оттенки покоя, облегчения и утешения. «Обрести покой» сохраняет напряжение плача Варуха, не сводя его только к утешению.
- source_word: ܐܒܠܐ
  choice: Иерусалим
  rationale: В доступном сирийском тексте это место повреждено или нестабильно. «Иерусалим» принят по более широкому текстовому свидетельству и восстанавливает параллель «Сион — Иерусалим»; неопределённость отмечена в сноске.
- source_word: ܒܙܘܥܐ ܐܬܬܙܝܥ
  choice: содрогнулся в трепете
  rationale: Сочетание существительного и однокоренного глагола усиливает образ потрясения; по-русски он передан без механического повтора корня.
theological_decisions:
- issue: Отношение Сиона и Иерусалима в плаче
  choice: Сохранён поэтический параллелизм «Сион — Иерусалим»
  alternative: Читать повреждённую строку буквально как упоминание скорби или плача
  rationale: 'Такое чтение опирается на более широкую традицию текста, но не выдаётся за бесспорное: вариант отражён в сноске.'
- issue: Неясное превосходство народа «видением»
  choice: Сохранена формулировка «превосходил меня видением»
  alternative: Истолковать её как величие народа перед взором Варуха или как духовное превосходство
  rationale: Сирийская строка трудна; перевод не вводит определённого богословского толкования там, где источник его однозначно не задаёт.
translation_notes:
  register: Современный литературный русский язык с достоинством поэтического плача. Синтаксис сделан ясным, но необычные образы и текстовая напряжённость не сглажены; конфессионально специфическая терминология не вводилась.
