  text: And I, Baruch, went from there and came to the people, and I gathered them from the great to the small. 2 And I said to them, “Hear, children of Israel. See how few of you are left from the twelve tribes of Israel. 3 Yet to you and to your fathers the Lord gave the law more than to all the nations. 4 And because your brothers transgressed the commandments of the Most High, he brought upon them what you have seen. 5 But you also, if you do not do what is right, as your brothers did, 6 the righteous one will judge his works, because he is the Mighty One whom you seek, and he is the Mighty One in whom you hope. 7 And he sees to preserve, not to forsake. 8 Have you not seen what happened to Zion? 9 Or do you think that the place sinned, and for this it was overthrown? Or that the land did some wrong, and for this it was handed over? 10 And do you not know that because of you those things that did not sin were destroyed, and because of what you did, that which did no wrong was delivered
    up? 11 And all the people answered and said to me, “Because we remember the good testimonies that the Mighty One did with you, 12 as we have seen, and also those that we have not seen, the Anointed One will come. 13 But now, ask on our behalf from above, and write also to our brothers in Babylon a letter of instruction and a writing of hope, 14 that you may show them also that which has not departed from you. 15 For the counsels of Israel have perished, and the lamps that gave light are extinguished, and the springs from which we used to drink have ceased. 16 And we are left in darkness, and in the thicket of the forest, and in the thirst of the wilderness.”
translation:
  language: ru
  text: '1 Я, Варух, ушёл оттуда, пришёл к народу и собрал всех — от великого до малого. 2 Я сказал им: «Слушайте, сыны Израиля! Посмотрите, как мало вас осталось от двенадцати колен Израиля. 3 Однако вам и вашим отцам Господь дал Закон, чего не дал ни одному из прочих народов. 4 Но ваши братья преступили заповеди Всевышнего, и Он навёл на них то, что вы видели. 5 Если же и вы, подобно вашим братьям, не будете поступать праведно, 6 праведный будет судить их беззакония, ибо Он — Могущественный, Которого вы ищете, и Могущественный, на Которого вы надеетесь. 7 Он заботится о том, чтобы сохранить, а не оставить. 8 Разве вы не видели, что случилось с Сионом? 9 Или вы думаете, что это место согрешило и потому было разрушено? Или что земля в чём-то провинилась и потому была отдана врагам? 10 Разве вы не знаете, что из-за вас было погублено то, что не согрешило, и из-за ваших дел было отдано то, что ни в чём не провинилось?»


    11 Весь народ ответил мне: «Мы помним добрые свидетельства о том, что Могущественный совершил с вами, — 12 как те, которые мы видели, так и те, которых не видели; Помазанник[a] придёт. 13 Но теперь попроси за нас свыше и напиши также нашим братьям в Вавилоне письмо с наставлением и слово надежды, 14 чтобы и им показать то, что ещё не покинуло тебя. 15 Ведь исчезли советы Израиля, угасли светившие светильники и иссякли источники, из которых мы пили. 16 Мы остались во тьме, в лесной чаще и среди жажды пустыни».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'То есть Мессия; буквально: «Христос». В сирийском тексте сказано, что Он придёт.'
    reason: Поясняет титул и фиксирует наличие глагола «придёт», поскольку ранее предлагалось чтение «он — Помазанник».
lexical_decisions:
- source_word: ܢܡܘܣܐ
  choice: Закон
  rationale: Сохраняет заветный и писанийный смысл термина; прописная буква указывает на данный Израилю Закон, не вводя дополнительного толкования.
- source_word: ܡܪܝܡܐ
  choice: Всевышний
  rationale: Устоявшаяся и естественная русская передача возвышенного божественного титула.
- source_word: ܡܚܣܢܢܐ
  choice: Могущественный
  rationale: Контекст и параллельные титулы требуют обозначения силы Бога; выбран титульный перевод, соответствующий консультационному слою и не подменяющий его качествами милости или благодати.
- source_word: ܐܓܪܬܐ ܕܝܘܠܦܢܐ
  choice: письмо с наставлением
  rationale: Естественно передаёт одновременно эпистолярную форму и наставительный характер текста.
- source_word: ܡܕܡ ܕܣܒܪܬܐ
  choice: слово надежды
  rationale: Сирийское выражение неопределённо; русский вариант сохраняет его содержание, не утверждая без достаточных оснований конкретный вид документа.
- source_word: ܪ̈ܥܘܬܐ
  choice: советы
  rationale: Следует вокализованному контрольному свидетельству Кмоско, указывающему на мысли или советы, а не на пастырей; образ согласуется с последующими светильниками и источниками.
- source_word: ܫܪ̈ܓܐ
  choice: светильники
  rationale: Сохраняет конкретный образ источников света.
- source_word: ܡܒܘ̈ܥܐ
  choice: источники
  rationale: Передаёт образ текущей, животворящей воды естественным литературным русским языком.
- source_word: ܟܪܝܣܛܘܣ
  choice: Помазанник
  rationale: Передаёт титульное значение заимствованного сирийского слова без конфессионального уточнения личности.
theological_decisions:
- issue: Виновны ли Сион и земля в постигшем их разорении
  choice: Риторические вопросы прямо отрицают вину святого места и земли и связывают их разорение с поступками народа.
  alternative: Общее утверждение о суде без явного признания невиновности места и земли.
  rationale: Сирийский текст противопоставляет не согрешившее и не провинившееся творение виновным человеческим поступкам.
- issue: Следует ли понимать ܟܪܝܣܛܘܣ как именной титул или как утверждение «он — Помазанник»
  choice: «Помазанник придёт».
  alternative: «Он — Помазанник».
  rationale: В засвидетельствованной фразе присутствует глагольная форма ܢܝܬ̣ܐ, выражающая приход; вариант без глагола прихода не отражает данного чтения.
- issue: Кого обозначает «праведный» в ст. 6
  choice: Сохранено строчное «праведный» и не добавлено прямое отождествление с Богом.
  alternative: «Праведный» как однозначный божественный титул с прописной буквы.
  rationale: Ближайший контекст связывает высказывание с Могущественным, однако синтаксис повреждён или неясен; перевод сохраняет напряжение и не делает титульное отождествление более определённым, чем источник.
translation_notes:
  register: Современный литературный русский с библейским достоинством, без архаизмов. Риторические вопросы сохранены; метафоры светильников, источников, лесной чащи и жажды пустыни не сглажены. Неясные местоименные связи в ст. 5–7 переданы осторожно, без конфессионального доопределения.
