base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/049/001.yaml
  text: 'But nevertheless I will ask you, O Mighty One, and I will seek mercy from him who made all: In what form will those who live in his days live? Or how will the splendor of those who come after that time be preserved? Will they then take on this present form, and will those human likenesses then remain and will they be established as living beings?? Or will you perhaps change these things that have been in the world, as also the world itself?'
translation:
  language: ru
  text: 'Но всё же я спрошу Тебя, о Могущественный, и буду молить о милости Того, Кто сотворил всё: каким будет облик тех, кто будет жить в Его дни? И как сохранится сияние тех, кто придёт после того времени?[a] Примут ли они тогда этот нынешний облик? Останутся ли тогда эти человеческие облики и будут ли они оживлены? Или Ты, быть может, изменишь то, что существовало в мире, — как и сам мир?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Переданное сирийское чтение в выражении «сияние тех» неясно и, возможно, повреждено; возможны также переводы «блеск» или «слава».
    reason: Текстологическая неопределённость затрагивает ключевое существительное, поэтому она обозначена, а не скрыта выбором одного гладкого варианта.
lexical_decisions:
- source_word: ܕܡܘܬܐ
  choice: облик / подобие
  rationale: В данном контексте слово обозначает форму или подобие, а не смерть. «Облик» естественно звучит в первом вопросе, а «подобия» сохраняет повтор и тему телесной тождественности далее.
- source_word: ܙܥܘܪܬܗ
  choice: сияние
  rationale: Переданное чтение затруднительно и, возможно, повреждено; контрольная традиция указывает на значение «сияние, блеск, слава». «Сияние» сохраняет образность, не усиливая его до явно богословского термина «слава».
- source_word: ܡܚܠܦ
  choice: изменишь
  rationale: Глагол допускает значения изменения и преобразования. Нейтральное «изменишь» не предрешает вопрос о степени преображения.
- source_word: ܡܩܝܡܝܢ ܚܝ̈ܐ
  choice: будут утверждены как живые существа
  rationale: Передаёт пассивно-результативный смысл фразы в контексте будущего оживления и избегает ошибочного понимания, будто облики сами поддерживают жизнь.
theological_decisions:
- issue: Преемственность и изменение человеческого облика после перелома века
  choice: 'Вопрос Варуха оставлен открытым: нынешний облик может сохраниться либо подвергнуться изменению.'
  alternative: Однозначно утверждать полное тождество воскресшего тела нынешнему или, напротив, его полное преобразование.
  rationale: Сирийский текст формулирует вопрос, а не даёт здесь ответа; перевод сохраняет эсхатологическое напряжение и не вносит конфессионального толкования.
- issue: Адресат молитвенного обращения
  choice: «о Могущественный» и далее обращение на «Ты» с прописной буквы.
  alternative: Следовать трудному чтению рукописного фрагмента как «возлюбленный мой».
  rationale: Контрольное чтение и контекст молитвы поддерживают божественный титул; это также согласуется с исправленной текстологической оценкой, тогда как представленное OCR-чтение, вероятно, дефектно.
translation_notes:
  register: Современный литературный русский язык с молитвенно-апокалиптической торжественностью. Синтаксис упрощён настолько, чтобы цепь вопросов оставалась понятной обычному читателю, но повторы «облик / подобия» и нерешённость вопроса о будущем состоянии людей сохранены.
