- from: 'Но всё же я спрошу Тебя, о Могущественный, и буду молить о милости Того, Кто сотворил всё: каким будет облик тех, кто будет жить в Его дни? И как сохранится сияние тех, кто придёт после того времени?[a] Примут ли они тогда этот нынешний облик? Останутся ли тогда эти человеческие подобия и будут ли утверждены как живые существа? Или Ты, быть может, изменишь то, что существовало в мире, как и сам мир?'
  to: 'Но всё же я спрошу Тебя, о Могущественный, и буду молить о милости Того, Кто сотворил всё: каким будет облик тех, кто будет жить в Его дни? И как сохранится сияние тех, кто придёт после того времени?[a] Примут ли они тогда этот нынешний облик? Останутся ли тогда эти человеческие облики и будут ли они оживлены? Или Ты, быть может, изменишь то, что существовало в мире, — как и сам мир?'
  rationale: 'Внесена одна безопасная смысло-стилистическая правка: пассивно-результативный вопрос о жизни передан естественным русским глаголом «оживлены», без утверждения конкретной доктрины воскресения. Повтор δܡܘܬܐ унифицирован как «облик», что лучше сохраняет образную связность вопроса.'
