  text: For surely wrath will be aroused against you at its appointed time; for now it is restrained by longsuffering, as by a bridle.
translation:
  language: ru
  text: Ибо гнев непременно возгорится против вас в назначенное ему время; ныне же он удерживается долготерпением, словно уздой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܪܘܓܙܐ (смысл, отражённый в контрольном чтении)
  choice: гнев
  rationale: Передаёт идею надвигающегося гнева без добавления не выраженного явно определения «Божий».
- source_word: ܒܙܒܢܗ (смысл, отражённый в контрольном чтении)
  choice: в назначенное ему время
  rationale: Сохраняет указание на определённый срок и естественно звучит по-русски.
- source_word: ܡܓܪܬ ܪܘܚܐ (смысл, отражённый в контрольном чтении)
  choice: долготерпением
  rationale: Традиционный и понятный русский эквивалент семитского выражения о длительном сдерживании гнева.
- source_word: образ узды/удил
  choice: словно уздой
  rationale: Сохраняет исходную метафору внешнего сдерживания и делает сравнение прозрачным для современного читателя.
theological_decisions:
- issue: Чей именно гнев имеется в виду
  choice: Оставлено просто «гнев»
  alternative: «Божий гнев»
  rationale: Контекст может подразумевать Божий гнев, однако явное уточнение устранило бы сохраняемую исходным текстом недосказанность.
- issue: Кто проявляет долготерпение
  choice: 'Без названного субъекта: «удерживается долготерпением»'
  alternative: «Бог по Своему долготерпению удерживает его»
  rationale: Не добавляет субъекта, которого стих прямо не называет, и сохраняет богословскую напряжённость формулировки.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным звучанием. Формулировка сохраняет пассивную конструкцию, временную определённость и метафору узды.
