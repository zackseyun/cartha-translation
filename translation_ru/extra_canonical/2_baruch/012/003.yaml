  text: Do not expect or hope that you will always have prosperity and joy. Do not exalt yourselves too highly, and do not oppress.
translation:
  language: ru
  text: Не ожидайте и не надейтесь, что благополучие и радость всегда будут с вами. Не превозноситесь слишком и никого не притесняйте.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'English consultation: “expect or hope” (corresponding Syriac wording is not visible in the supplied chapter-bucket excerpt)'
  choice: «не ожидайте и не надейтесь»
  rationale: Передаёт два близких, но не тождественных действия естественной русской отрицательной конструкцией.
- source_word: 'English consultation: “prosperity and joy”'
  choice: «благополучие и радость»
  rationale: «Благополучие» охватывает удачу и процветание, а «радость» сохраняет эмоциональную составляющую.
- source_word: 'English consultation: “exalt yourselves too highly”'
  choice: «не превозноситесь слишком высоко»
  rationale: Сохраняет образ чрезмерного самовозвышения и возвышенный, но понятный современный регистр.
- source_word: 'English consultation: “do not oppress”'
  choice: «никого не притесняйте»
  rationale: Русский глагол обычно требует объекта; «никого» делает запрет естественным, не сужая подразумеваемый круг тех, кого нельзя притеснять.
theological_decisions:
- issue: Число адресата
  choice: 'Множественное число: «ожидайте», «надейтесь», «превозноситесь», «притесняйте»'
  alternative: 'Единственное число: «ожидай», «надейся», «не превозносись», «не притесняй»'
  rationale: Аудированная консультационная редакция указывает, что сирийские глаголы и местоимения имеют форму второго лица множественного числа и обращены к жителям Вавилона как к группе.
- issue: Отсутствие видимого текста стиха в предоставленном сирийском фрагменте
  choice: Следовать аудированному английскому консультационному слою, не заявляя о прямой пословной сверке данного стиха
  alternative: Реконструировать сирийский текст стиха по контексту
  rationale: Предоставленный фрагмент начинается и заканчивается иными строками главы и не содержит распознаваемых соответствий тексту 12:3; реконструкция без источника была бы недостоверной.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Формулировка ясна для широкого читателя; архаизмы и конфессионально окрашенные толкования не вводятся. Прямую сверку ключевой лексики с сирийским оригиналом этого стиха ограничивает то, что сам текст 12:3 не виден в предоставленном фрагменте.
