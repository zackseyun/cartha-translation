base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/017/001.yaml
  text: And the Lord answered and said to me, “With the Most High there is no reckoning of many years or few years. For what did it profit Adam that he lived nine hundred and thirty years, yet transgressed what had been commanded him? So the multitude of time that he lived did not benefit him, but brought death and cut short the years of those born from him. And what did Moses lack because he lived only one hundred and twenty years? Because he was subject to the one who formed him, he brought the law near to the offspring of Jacob and kindled a lamp for the people of Israel.”
translation:
  language: ru
  text: 'И Господь ответил и сказал мне[a]: «Всевышний не ведёт счёта многим или немногим годам. Ибо какую пользу принесло Адаму то, что он прожил девятьсот тридцать лет, если он преступил данную ему заповедь? Поэтому множество прожитых им лет не принесло ему пользы, но навлекло смерть и сократило годы родившихся от него. И чего недоставало Моисею оттого, что он прожил лишь сто двадцать лет? Поскольку он повиновался Тому, кто создал его, он принёс закон потомкам Иакова и зажёг светильник для народа Израиля».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И Господь сказал мне».'
    reason: В текстовой традиции и прежнем переводческом варианте возможно чтение без глагола «ответил»; основной текст следует полному сирийскому выражению «ответил и сказал».
lexical_decisions:
- source_word: ܡܢܝܗܝ
  choice: не ставится в счёт
  rationale: Передаёт смысл счёта или учёта перед Всевышним и сохраняет возможный оттенок оценки, не сводя фразу просто к различию между долгой и короткой жизнью.
- source_word: ܙܒܘ̈ܢܝ / ܫ̈ܢܝܗܝ
  choice: много ли лет или мало
  rationale: Естественно по-русски выражает контраст долгого и краткого срока жизни при не вполне устойчивом чтении отдельных форм в рукописном свидетельстве.
- source_word: ܡܘܬܪܐ
  choice: пользу / принесло пользы
  rationale: В риторическом рассуждении об Адаме речь идёт не о торговой выгоде, а о том, принесла ли долгая жизнь подлинное благо.
- source_word: ܡܒܣܪܝܢ
  choice: зажёг
  rationale: В сочетании со светильником глагол естественно передаёт образ возжённого света и наставления.
- source_word: ܢܣܘܒܘܬ ܒܪܢܫܐ ܕܒܣܘܪ
  choice: народ Израиля
  rationale: Коллективное обозначение передано привычным библейским выражением без навязывания более узкого биологического смысла.
- source_word: ܕܡܬܕܒܪ
  choice: был покорен
  rationale: Сохраняет нравственный контраст между непослушанием Адама и верностью Моисея своему Создателю.
theological_decisions:
- issue: Нравственная ценность продолжительности жизни
  choice: Долголетие само по себе не приносит пользы, если человек преступает Божью заповедь.
  alternative: Текст лишь сопоставляет Адама и Моисея, не формулируя общего принципа.
  rationale: Риторические вопросы и прямое противопоставление долгой жизни Адама краткой жизни Моисея выражают общий принцип, однако перевод не добавляет утверждения о спасении, которого в формулировке стиха нет.
- issue: Моисей как носитель света
  choice: Светильник обозначает принесённое через Моисея откровение и руководство, связанное с законом.
  alternative: Светильник может обозначать прежде всего самого Моисея как пример для Израиля.
  rationale: Образы закона и светильника стоят рядом; перевод сохраняет оба образа и не уточняет сверх текста, является ли светильником закон или служение Моисея.
- issue: Причинная связь смерти и долгой жизни Адама
  choice: Сохранена парадоксальная формулировка, согласно которой множество прожитых лет не принесло пользы, но навлекло смерть и сократило годы потомков.
  alternative: 'Сделать Адама явным подлежащим: «он навлёк смерть».'
  rationale: Так сохраняется риторическая напряжённость исходной конструкции и не вводится синтаксическое разрешение, отсутствующее в консультационном чтении.
translation_notes:
  register: Современный литературный русский язык с достоинством библейской прозы. Риторические вопросы, параллелизм Адама и Моисея и образы приближения закона и возжённого светильника сохранены; архаизмы сведены к минимуму.
