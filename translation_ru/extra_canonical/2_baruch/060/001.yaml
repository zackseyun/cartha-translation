revisions:
- from: И пятые чёрные воды, которые, как ты видел, пролились дождём, — это дела амореев, заклинания, которыми они занимались, злодейство их тайных обрядов и смешение их нечистоты.
  to: И пятые чёрные воды, которые ты видел проливающимися дождём, — это дела, совершённые амореями, заклинания, которые они творили своими чародействами, зло их мистерий и смешение их нечистоты.
  rationale: 'Исправлены две смысловые конкретизации: «тайные обряды» заменены на более нейтральные «мистерии», а связь заклинаний с чародействами выражена явно. Остальные образы и структура перечисления сохранены.'
