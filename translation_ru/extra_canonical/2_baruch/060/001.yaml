  yaml_path: translation/extra_canonical/2_baruch/060/001.yaml
  text: And the fifth black waters that you saw raining—these are the deeds that the Amorites did, and the spells of their enchantments that they practiced, and the wickedness of their mysteries, and the mingling of their uncleanness.
translation:
  language: ru
  text: И пятые чёрные воды, которые ты видел проливающимися дождём, — это дела, совершённые амореями, заклинания, которые они творили своими чародействами, зло их мистерий и смешение их нечистоты.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: «пятые чёрные воды» (стиховая формула, контролируемая контекстом видения)
  choice: «пятые чёрные воды»
  rationale: Сохранены порядковый номер и символика вод, связывающие стих с последовательностью частей видения.
- source_word: «деяния/дела амореев»
  choice: «дела амореев»
  rationale: Нейтральное и естественное соответствие, не добавляющее оценки сверх дальнейшего описания.
- source_word: «заклинания их чародейств»
  choice: «заклинания, которыми они занимались»
  rationale: Передаёт практику магических действий современным русским языком без тяжеловесного тавтологического сочетания.
- source_word: «зло их тайн/мистерий»
  choice: «злодейство их тайных обрядов»
  rationale: В данном перечислении «тайны» имеют культово-ритуальный и отрицательный смысл; «тайные обряды» делает его понятным, не связывая с конкретной конфессией.
- source_word: «смешение их нечистоты»
  choice: «смешение их нечистоты»
  rationale: Сохранён необычный и неоднозначный образ исходной формулы без попытки уточнить вид нечистоты.
theological_decisions:
- issue: Характер «тайн» амореев
  choice: «тайные обряды»
  alternative: «тайны» / «мистерии»
  rationale: Контекст перечисляет чародейные практики; выбранное выражение передаёт вероятный ритуальный оттенок, не вводя специальной доктринальной терминологии.
- issue: Значение «нечистоты»
  choice: оставлено без уточнения
  alternative: «ритуальная нечистота», «нравственная нечистота» или «половая нечистота»
  rationale: Источник не требует однозначно выбирать между ритуальным и нравственным смыслом, поэтому богословское напряжение сохранено.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического повествования; синтаксис упрощён ровно настолько, чтобы длинное перечисление оставалось понятным. Нумерация стиха не включена в текст поля.
