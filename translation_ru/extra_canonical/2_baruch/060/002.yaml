  yaml_path: translation/extra_canonical/2_baruch/060/002.yaml
  text: But Israel also was defiled with sins in the days of the judges, while they were seeing many signs that were done by him who made them.
translation:
  language: ru
  text: Но и Израиль осквернялся грехами во дни судей, хотя израильтяне видели множество знамений, совершённых Тем, кто сотворил их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Israel
  choice: Израиль / израильтяне
  rationale: В первой части сохранено собирательное название народа, а во второй местоименное продолжение передано словом «израильтяне» для естественного русского синтаксиса и ясности множественного числа.
- source_word: was defiled with sins
  choice: осквернялся грехами
  rationale: Сохраняет образ ритуально-нравственного осквернения и допускает повторяемость происходившего в эпоху судей.
- source_word: signs
  choice: знамения
  rationale: Обычное библейское обозначение явлений и деяний, свидетельствующих о Божьей силе.
- source_word: him who made them
  choice: Тем, кто сотворил их
  rationale: Сохраняет описательное именование Творца и объект во множественном числе, относящийся к народу как к людям.
theological_decisions:
- issue: Личность совершающего знамения
  choice: Тем, кто сотворил их
  alternative: их Творцом
  rationale: Описательная формула точнее сохраняет форму текста и не добавляет конфессиональной конкретизации.
- issue: Логическая связь между грехом и виденными знамениями
  choice: хотя
  alternative: в то время как
  rationale: 'Передаёт уступительное напряжение: народ грешил вопреки множеству увиденных знамений; при этом не добавляется объяснение причины его греха.'
translation_notes:
  register: Современный литературный русский язык с умеренно библейской лексикой. Формулировка краткая и торжественная, но понятная; архаизм «во дни судей» сохранён как устойчивое обозначение эпохи. Предоставленный сирийский фрагмент является широким и частично перекрывающимся корпусом главы, а строка данного стиха в нём явно не локализуется; поэтому формулировка сверена с аудированным английским консультационным слоем без попытки восстановить отсутствующие сирийские словоформы.
