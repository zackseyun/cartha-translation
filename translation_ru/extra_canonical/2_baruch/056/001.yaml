base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/056/001.yaml
  text: 'That great cloud which you saw ascending from the sea and going to cover the earth—understand this: it is the ordering of the world which the Mighty One made when he resolved to create it.[1][2] And it came to pass that, when the word went forth from before him, the establishment of the world arose—fair, small—and it was prepared as it was fitting to be.[3]


    And as for the first black waters which you saw descending from that cloud, this is the sin and transgression which the first Adam committed first. For when he transgressed, death was aroused before its time, and mourning became known, and afflictions were prepared, and pains were created, and toil was completed; and greatness began to wane.


    And the last day, which appeared in a form and took on a likeness—you will know that the time will be demanded, and the measure of humanity will be measured, and its strength will be tested.[4][5]


    Therefore, because Adam—when he heard from God something of what was to be, and understood that the release of the dead had been given, and had been commanded by God—considered, and he thought five thoughts: for he was condemning himself; he was also condemning the angels; and even at the time when he was created in it, there was for him a seen vision, and the fierce living creatures, and the elements with fire.[6][7]


    And thus God gathered in time, in the likeness in which they had been created.'
translation:
  language: ru
  text: 'Великое облако, которое ты видел поднимающимся из моря, а затем идущим и покрывающим эту землю, — пойми: это устроение мира, которое совершил Могущественный, когда замыслил создать мир.[a][b] И когда слово вышло от Него, возникло основание мира — прекрасное, малое, — и всё было устроено так, как надлежало.[c]


    Первые же чёрные воды, которые ты видел нисходящими сверху из этого облака, — это грех и преступление, которое первым совершил первый Адам.[d] Ибо, когда он согрешил, смерть пробудилась прежде своего времени, стало известно горе, были уготованы бедствия, сотворены страдания и доведён до полноты тяжкий труд; а величие начало умаляться.


    И последний день, явившийся в образе и принявший подобие, будет таким: станет известно, что настало взыскание времени, мера человечества будет отмерена, а его сила — испытана.[e][f]


    Итак, Адам, услышав от Бога кое-что из того, что должно было случиться, поняв, что мёртвым дано освобождение и что это было заповедано Богом, стал размышлять и помыслил пять мыслей.[g][h] Ведь он признавал виновным себя; признавал виновными и ангелов. И ещё в то время, в котором он был сотворён, ему было дано видимое видение — свирепые живые существа и стихии вместе с огнём.[i]


    И таким образом Бог собрал их во времени, в том подобии, в каком они были сотворены.[j]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: У Ceriani стоит глагол со значением «покрыл», тогда как контрольное чтение Kmosko использует другой глагол с тем же основным значением. На смысл перевода различие не влияет.
    reason: textual_variant
  - marker: b
    text: Сирийский текст здесь труден. Контрольное чтение поддерживает «устроение мира, которое совершил Могущественный»; текст Ceriani может быть понят как «в мире Он явил Свою силу».
    reason: textual_variant
  - marker: c
    text: 'Буквально: «прекрасное, малое». Неожиданное сочетание сохранено; возможно, «малое» описывает мир в его первоначальном состоянии.'
    reason: lexical_alternative
  - marker: d
    text: 'Возможно также: «это преступление, которым впервые преступил первый Адам».'
    reason: lexical_alternative
  - marker: e
    text: Фраза о последнем дне синтаксически сжата. Буквально в ней говорится, что он «явился в образе и принял подобие»; чему именно он уподобился, прямо не названо.
    reason: lexical_alternative
  - marker: f
    text: 'Редкое слово можно понимать как «меру» или «облик». Поэтому возможен иной перевод: «облик человечества будет изглажен».'
    reason: lexical_alternative
  - marker: g
    text: Выражение допускает также перевод «мёртвым дано прощение». Оно понимается как дар, относящийся к мёртвым, а не как действие самого Адама.
    reason: lexical_alternative
  - marker: h
    text: 'Буквально: «были помыслены пять мыслей». Следующие сжатые фразы не позволяют уверенно восстановить их точное перечисление.'
    reason: textual_difficulty
  - marker: i
    text: 'Фраза о вине допускает и другое членение: Адам «делал себя виновным также перед ангелами». Перевод не предполагает, что Адам стал причиной греха ангелов.'
    reason: theological_ambiguity
  - marker: j
    text: Заключительная фраза трудна и, вероятно, продолжает мысль за пределами данного отрывка. Множественное «они» не имеет бесспорно установленного ближайшего референта.
    reason: textual_difficulty
