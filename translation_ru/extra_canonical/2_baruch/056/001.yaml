theological_decisions:
- issue: Значение великого облака
  choice: Облако означает устроение мира при сотворении.
  alternative: Облако означает власть царства или распространение суда.
  rationale: Непосредственный контекст связывает образ с решением Бога сотворить мир и с исходящим от Него словом.
- issue: Смерть прежде своего времени
  choice: Грех Адама преждевременно привёл смерть в действие.
  alternative: Речь только о сокращении личной жизни Адама.
  rationale: Список последствий имеет всеобщий и космический характер; перевод не уточняет механизм наследования смерти.
- issue: Последний день
  choice: Сохранён эсхатологический смысл взыскания времени и испытания человечества.
  alternative: Это день личной смерти Адама или один из последующих периодов видения.
  rationale: Сочетание последнего дня, времени, меры человечества и испытания силы указывает на итоговую проверку, но трудный синтаксис оставлен видимым.
- issue: Освобождение мёртвых
  choice: Освобождение дано Богом мёртвым.
  alternative: Адам сам отпускает или прощает мёртвых; прощение дано только Адаму.
  rationale: Пассив «дано» и упоминание Божьего повеления поддерживают божественное дарование, но перевод «освобождение» не задаёт его точную сотериологическую природу.
- issue: Вина Адама и ангелов
  choice: Сжатая фраза передана как признание виновными себя и ангелов.
  alternative: Адам оказался виновен перед ангелами или навлёк вину на ангелов.
  rationale: Сирийский синтаксис допускает разные связи; основной текст следует наиболее прямому параллелизму, а примечание сохраняет неопределённость.
- issue: Стихии с огнём
  choice: Оставлено общее космологическое обозначение «стихии».
  alternative: Буквы, элементарные духи или строго определённые философские элементы.
  rationale: Контекст огня поддерживает космический смысл, но не позволяет навязать конкретную философскую систему.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптической речи. Сохранены повторы, необычные образы и местами сжатый синтаксис сирийского текста; там, где буквальность стала бы непонятной, применена умеренная синтаксическая перестройка. Божественный эпитет написан с прописной буквы, но конфессионально специфическая терминология не вводилась.
