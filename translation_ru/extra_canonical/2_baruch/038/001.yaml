  yaml_path: translation/extra_canonical/2_baruch/038/001.yaml
  text: And I prayed and said, “Lord, my Lord, you continually give light to those who are guided in understanding. Your law is life, and your wisdom is uprightness. Therefore show me the interpretation of this vision. For you know that my soul has walked in your law, and from my earliest days I have not been cut off from your wisdom.”
translation:
  language: ru
  text: 'И я помолился и сказал: «Господи, мой Господь, Ты неизменно озаряешь тех, кого ведёт разумение. Твой Закон — жизнь, и Твоя мудрость — правота. Поэтому открой мне истолкование этого видения. Ведь Ты знаешь, что душа моя ходила по Твоему Закону и с первых моих дней не была отделена от Твоей мудрости».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܒܣܘܟܠܐ ܡܬܕܒܪܝܢ
  choice: тех, кого ведёт разумение
  rationale: Передаёт пассивное значение «быть ведомым, направляемым» и сохраняет интеллектуально-нравственный смысл ܣܘܟܠܐ — «разумение, проницательность».
- source_word: ܢܡܘܣܟ ܚ̈ܝܐ ܗܘ
  choice: Твой Закон — жизнь
  rationale: Именное предложение сохранено как сильное прямое отождествление; перевод «даёт жизнь» неоправданно ослабил бы формулировку.
- source_word: ܚܟܡܬܟ ܬܪܝܨܘܬܐ ܗܝ
  choice: Твоя мудрость — правота
  rationale: «Правота» естественно передаёт прямоту и нравственную правильность ܬܪܝܨܘܬܐ, не сужая смысл до исключительно судебной праведности.
- source_word: ܦܘܫܩܗ ܕܚܙܘܐ ܗܢܐ
  choice: истолкование этого видения
  rationale: В апокалиптическом контексте речь идёт не просто о пояснении, а о раскрытии смысла символического видения.
- source_word: ܠܐ ܐܬܢܣܝܬ
  choice: не была отлучена
  rationale: Сохраняет более сильный оттенок отделения или удаления, отражённый в исходном глаголе, и не сводит выражение к добровольному уходу.
theological_decisions:
- issue: Соотношение Закона и мудрости с божественным откровением
  choice: «Твой Закон — жизнь, и Твоя мудрость — правота»
  alternative: «Твой Закон даёт жизнь, и Твоя мудрость — праведность»
  rationale: 'Прямые именные сказуемые сохраняют напряжённую богословскую силу текста: Закон отождествляется с жизнью, а мудрость — с нравственной прямотой, без добавления причинного значения или узкого конфессионального оттенка.'
- issue: Характер верности мудрости
  choice: «не была отлучена от Твоей мудрости»
  alternative: «не отходила от Твоей мудрости»
  rationale: Выбранный вариант сохраняет заложенную в форме глагола возможность переживаемого отделения, а не только сознательного отступления.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Формулы «душа моя ходила по Твоему Закону» и «Господи, мой Господь» сохранены ради образности и торжественного регистра; архаические грамматические формы не используются. Перевод следует установленному чтению сирийского текста, отражённому контрольной традицией; очевидно повреждённое электронное распознавание в предоставленном фрагменте не принято за самостоятельный вариант рукописи.
