  terminology: «Закон», «мудрость», «жизнь», «правота» и «истолкование видения» переданы последовательно. Капитализация соответствует обращению к Богу и библейскому регистру. Замена «отлучена» на «отделена» устраняет неуместный терминологический оттенок без ослабления смысла.
