base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/086/001.yaml
  text: So then, when you receive the letter, read it in your assemblies with care. And consider its words more carefully on the days of the weeks, so that you may remember and be set right.
translation:
  language: ru
  text: Итак, когда вы получите это послание, прочитайте его внимательно в своих собраниях. В дни недель[a] ещё внимательнее вникайте в его слова, вспоминайте их и исправляйтесь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в дни недель»; возможно также понимание: «в будние дни». Сирийская формулировка не вполне ясна.'
    reason: Необычное сочетание слов допускает разные толкования; примечание сохраняет текстовую неоднозначность, не подменяя её догадкой в основном тексте.
lexical_decisions:
- source_word: ܒܒܛܝܠܘܬܐ
  choice: внимательно
  rationale: Слово может обозначать спокойствие, досуг или неторопливую заботливость. В контексте общего чтения «внимательно» естественно передаёт серьёзное, вдумчивое отношение, не сводя смысл ни к досугу, ни к усердию как таковому.
- source_word: ܬܬܗܪܘܢ ... ܝܬܝܪܐܝܬ
  choice: особенно вдумывайтесь
  rationale: Глагол выражает внимательное отношение и размышление, а наречие усиливает его. Такой перевод сохраняет призыв тщательно вникать в слова послания и звучит естественно по-русски.
- source_word: ܝܘܡ̈ܬܐ ܕܒ ܫܒ̈ܘܥܐ
  choice: в дни недель
  rationale: Сирийский текст буквально говорит о «днях» и «неделях». Не вполне ясная формулировка сохранена, поскольку замена её на «будние дни» или «дни поста» устранила бы реальную текстовую неоднозначность.
- source_word: ܬܬܥܗܕܘܢ
  choice: чтобы помнить их
  rationale: Корень прямо указывает на памятование. Местоимение «их» в русском тексте естественно относит действие к словам послания.
- source_word: ܬܬܪܨܘܢ
  choice: исправиться
  rationale: Глагол несёт образ выпрямления, приведения в правильное состояние. «Исправиться» кратко и естественно передаёт нравственно-преобразующий смысл, не уточняя его сверх источника.
theological_decisions:
- issue: Следует ли превращать наставление в привычную литургическую или аскетическую формулу
  choice: Сохранён сдержанный призыв к общинному чтению, памятованию и исправлению
  alternative: Истолковать неясное выражение как указание читать послание в дни поста либо передать весь стих как общий призыв к духовному размышлению
  rationale: Текст носит практический наставительный характер и не называет ни пост, ни особый обряд. Перевод не вводит позднейшую церковную терминологию и сохраняет неопределённость выражения о днях недель.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис наставительный, но не архаизированный; неясная календарная формула намеренно не сглажена.
