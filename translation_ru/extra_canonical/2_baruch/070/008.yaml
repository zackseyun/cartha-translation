  text: And whoever escapes from the war will die in the earthquake, and whoever escapes from the earthquake will be burned by fire, and whoever escapes from the fire will perish by famine.
translation:
  language: ru
  text: Кто уцелеет в войне, умрёт при землетрясении; кто уцелеет при землетрясении, будет сожжён огнём; а кто уцелеет в огне, погибнет от голода.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܙܒ (глагольная основа со значением спасения, избавления, сохранения в живых)
  choice: уцелеет
  rationale: В контексте последовательных бедствий речь идёт не о богословском спасении, а о том, что человек останется в живых после очередной катастрофы; «уцелеет» ясно и естественно передаёт этот смысл.
- source_word: ܡܘܬ / глагол «умирать»
  choice: умрёт
  rationale: Сохранено прямое обозначение смерти в первой части, без стилистического сглаживания.
- source_word: глагол со значением уничтожения, гибели
  choice: погибнет
  rationale: В заключительной части выбран более широкий глагол «погибнет», соответствующий гибели от голода и сохраняющий смысловое различие с «умрёт».
- source_word: ܟܦܢܐ
  choice: голод
  rationale: Обычное и точное обозначение голода как последнего из перечисленных бедствий.
