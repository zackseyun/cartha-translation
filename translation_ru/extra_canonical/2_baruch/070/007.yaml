lexical_decisions:
- source_word: ܓܠܝܘ (корень ܓܠܐ)
  choice: явит
  rationale: Сирийский корень означает «открыть, явить». В апокалиптическом контексте «явит» сохраняет смысл появления народов, прежде сокрытых или удерживаемых до назначенного времени; «поднимет» было бы менее точно.
- source_word: ܐܬܝܢ
  choice: они придут
  rationale: Перед действием войны источник прямо называет приход; отдельный глагол сохранён, а не опущен.
- source_word: ܩܪܒܐ
  choice: начнут войну
  rationale: 'Естественно передаёт ведение войны в данном контексте и сохраняет последовательность: сначала народы придут, затем выступят против оставшихся правителей.'
- source_word: ܡܪܝܡܢܐ
  choice: Всевышний
  rationale: Устоявшееся и точное русское соответствие божественному титулу.
theological_decisions:
- issue: Апокалиптическое действие Всевышнего по отношению к заранее приготовленным народам
  choice: Всевышний «явит» их
  alternative: Всевышний «поднимет» или «возбудит» их
  rationale: Формулировка следует значению сирийского корня «открывать, являть» и не заменяет откровение причинным побуждением к войне.
- issue: Предварительное приготовление народов
  choice: «которые Он приготовил заранее»
  alternative: «которые были приготовлены заранее»
  rationale: Личное местоимение отражает наиболее естественную связь с Всевышним, не добавляя объяснения о цели или характере этого приготовления.
translation_notes:
  register: Современный литературный русский язык с достойным апокалиптическим регистром. Начальная строчная буква сохраняет связь стиха с предыдущим предложением. Оборот «от рук своих же» намеренно оставляет неуточнённым, кто именно подразумевается под «своими», не снимая неоднозначности источника.
