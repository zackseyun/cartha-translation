  naturalness: Предлагаемая правка остаётся современной литературной русской прозой и лучше сохраняет намеренно непрояснённое «своих же». «Придут и будут воевать против» естественно и не вносит оттенка начала войны.
  terminology: '«Всевышний» — уместная передача ܡܪܝܡܢܐ. «Явит» удачно сохраняет апокалиптический смысл раскрытия прежде приготовленных народов. Дополнительные сноски не требуются: вариантность английского прежнего «stir up» уже не относится к принятому чтению, а значение «вести войну» прямо передано текстом.'
