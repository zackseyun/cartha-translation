  naturalness: Текст звучит естественно на современном литературном русском. Замена «всех людей» на «все народы» точнее и сохраняет торжественный, пророческий регистр. «Будут погублены своими же» несколько естественнее, чем «будут уничтожены своими же», и не сужает смысл.
  terminology: «Смятение», «падут на войне» и «бедствия» приемлемы. Выражение «своими же» обоснованно сохраняет намеренно неуточнённый круг лиц; пояснительная сноска не должна выбирать между родственниками, соплеменниками и соотечественниками.
