  yaml_path: translation/extra_canonical/2_baruch/070/006.yaml
  text: When those things that were foretold have come to pass, confusion will fall upon all people. Some will fall in war, some will perish in tribulations, and some will be destroyed by their own.
translation:
  language: ru
  text: Когда сбудется всё предсказанное, смятение охватит все народы. Одни падут на войне, другие погибнут в бедствиях, а третьи будут погублены своими же[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть людьми из их собственного круга; источник не уточняет, идёт ли речь о родных, соплеменниках или соотечественниках.
    reason: Сохраняется смысловая широта выражения «свои».
lexical_decisions:
- source_word: ܐܝܠܝܢ ܕܡܩܕ̈ܡܢ ܐܡܝܪ̈ܢ
  choice: всё предсказанное
  rationale: Передаёт выражение о том, что было сказано прежде, естественным русским оборотом, не добавляя содержания.
- source_word: ܢܗܘ ... ܥܡܡ̈ܐ
  choice: всех людей охватит смятение
  rationale: «Смятение» передаёт общественную растерянность и беспорядок; «людей» соответствует контексту всеобщего бедствия и не превращает фразу в утверждение только об этнических народах.
- source_word: ܒܙܒܘܪ̈ܐ
  choice: на войне
  rationale: Контекст указывает на вооружённую борьбу; русский оборот «пасть на войне» звучит естественно и сохраняет смысл гибели в сражении.
- source_word: ܒܫܪܝܪܐ
  choice: в бедствиях
  rationale: Выбрано широкое обозначение тягот и мучительных обстоятельств, без неоправданного уточнения их вида.
- source_word: ܕ̈ܡܝܟܐ ... ܓܒܪ̈ܐ
  choice: будут уничтожены своими же
  rationale: Сохраняет резкий смысл гибели от рук тех, кто принадлежит к своему кругу, не уточняя без основания, родственники ли это, соплеменники или соотечественники.
theological_decisions:
- issue: Круг лиц, обозначенных как «свои»
  choice: своими же
  alternative: своими соплеменниками
  rationale: Источник не требует более узкого определения; нейтральная формулировка сохраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной ритмикой. Параллель «одни… другие… третьи…» передаёт трёхчастную структуру стиха; архаизмы и конфессионально окрашенная терминология не используются.
