  text: And it will happen that anyone who escapes and is delivered from all these aforementioned things—both those who conquered and those who were conquered—will be delivered into the hands of my servant, the Messiah.
translation:
  language: ru
  text: 'И будет так: всякий, кто спасётся и избегнет всего упомянутого выше, — как из победителей, так и из побеждённых, — будет отдан в руки Моего слуги, Мессии.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܫܬܘܙܒ
  choice: избежит гибели и спасётся
  rationale: Передаёт сочетание избавления и спасения естественным русским языком, не сводя два близких образа к одному глаголу.
- source_word: ܐܡܝܪ̈ܢ
  choice: упомянутого выше
  rationale: Сохраняет значение относительного оборота, указывающего на уже названные бедствия.
- source_word: ܡܫܝܚܐ
  choice: Мессии
  rationale: Обычное и понятное русское соответствие титулу; форма с заглавной буквы отражает его употребление как определённого эсхатологического титула.
- source_word: ܢܫܬܠܡ
  choice: будет отдан в руки
  rationale: Сохраняет пассивную конструкцию и библейскую идиому передачи во власть другого.
theological_decisions:
- issue: Статус Мессии как слуги говорящего
  choice: «Моего слуги, Мессии»
  alternative: «Моего раба Мессии»
  rationale: «Слуга» точно передаёт отношение служения, оставаясь естественным и не внося в текст лишней социальной окраски русского слова «раб».
- issue: Судьба победителей и побеждённых
  choice: Сохранены обе группы без уточнения их нравственного или этнического статуса
  alternative: Истолковать победителей и побеждённых как конкретные исторические стороны
  rationale: Источник оставляет обозначения обобщёнными; перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Парные конструкции и образ «в руки» сохранены; синтаксис упорядочен для ясного чтения.
