  text: The wise will be silent and the foolish will speak. Then the thought of men will not be fulfilled, nor the counsel of the strong, nor the hope of those who hope.
translation:
  language: ru
  text: Мудрые умолкнут, а глупые заговорят. Тогда не осуществятся ни замысел людей, ни совет сильных, ни надежда тех, кто надеется.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܣܟܠܐ
  choice: глупые
  rationale: Передаёт обычное значение сирийского слова и сохраняет нравственно-интеллектуальный контраст с мудрыми без архаизма «безумные».
- source_word: ܡܚܫܒܬܐ
  choice: замысел
  rationale: В данном контексте речь идёт не просто о мысли, а о человеческом намерении или замысле, который не осуществится.
- source_word: ܬܪܥܝܬܐ
  choice: совет
  rationale: Слово допускает значения «помышление», «намерение», «решение» и «совет»; здесь «совет» естественно соответствует параллельному ряду человеческих замыслов и надежд.
- source_word: ܫܒܪ̈ܘܗܝ ܕܐܝܠܝܢ ܕܡܣܒܪܝܢ
  choice: надежда тех, кто надеется
  rationale: Сохранена намеренная корневая фигура исходного текста, подчёркивающая тщетность самой надежды надеющихся.
theological_decisions:
- issue: Характер неисполнения человеческих замыслов, совета и надежды
  choice: не осуществятся
  alternative: не спасутся / не устоят
  rationale: Контекст перечисляет человеческие ожидания и намерения; формулировка «не осуществятся» передаёт их крушение, не вводя дополнительного сотериологического смысла.
translation_notes:
  register: Современный литературный русский язык с кратким пророческим ритмом. Сохранены антитеза «мудрые — глупые» и трёхчастный параллелизм второй фразы.
