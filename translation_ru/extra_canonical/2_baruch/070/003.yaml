  yaml_path: translation/extra_canonical/2_baruch/070/003.yaml
  text: They will hate one another and provoke one another to fight; the base will rule over the honorable, and the ignoble will be exalted over the illustrious.
translation:
  language: ru
  text: Они возненавидят друг друга и станут подстрекать друг друга к борьбе; низкие будут властвовать над почтенными, а незнатные возвысятся над прославленными.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܣܢܐ / ܣܢܝܢ (контекстуальная лексема, соответствующая «ненавидеть»)
  choice: возненавидят
  rationale: Передаёт взаимную вражду естественным современным русским глаголом, не ослабляя её до неприязни.
- source_word: лексема со значением «побуждать, возбуждать» в сочетании с борьбой
  choice: станут подстрекать друг друга к войне
  rationale: Сохраняет взаимность и активное разжигание столкновения; «к войне» звучит в русском яснее и достойнее, чем буквальное «к сражению», при сохранении смысла.
- source_word: лексема со значением «низкие, подлые»
  choice: низкие
  rationale: Сохраняет социально-нравственную неоднозначность исходного противопоставления и не сужает значение до конкретного сословия.
- source_word: лексема со значением «почтенные, достойные чести»
  choice: почтенные
  rationale: Передаёт общественное достоинство и уважение без добавления идеи нравственной безупречности.
- source_word: лексема со значением «незнатные, неименитые»
  choice: незнатные
  rationale: Поддерживает параллель социального переворота и не дублирует слово «низкие».
- source_word: лексема со значением «славные, именитые»
  choice: прославленные
  rationale: Передаёт высокий общественный статус и известность, сохраняя отличие от «почтенных».
theological_decisions:
- issue: Характер описанного переворота общественного порядка
  choice: Сохранить как пророческое описание взаимной вражды и возвышения людей низкого положения над уважаемыми и именитыми.
  alternative: Истолковать стих как прямую нравственную оценку определённых классов или как указание на конкретные исторические группы.
  rationale: Текст описывает хаос и инверсию порядка, но сам по себе не называет конкретных групп и не требует конфессионального или исторического отождествления.
translation_notes:
  register: Современный литературный русский язык с пророческой торжественностью. Синтаксический параллелизм сохранён; архаизмы и сословно узкие термины избегаются.
