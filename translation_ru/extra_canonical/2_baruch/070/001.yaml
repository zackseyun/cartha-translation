  source_fidelity: 'Проект точно сохраняет все смысловые компоненты контрольной формулировки: вводное «итак», повеление обратиться к слушателю, «толкование», образ «последних чёрных вод», их следование за прежними чёрными водами и ввод к последующему объяснению. «Последних» удачно передаёт символически-эсхатологическое ܐܚܪ̈ܝܐ, не превращая образ в уже истолкованную катастрофу. Предоставленный сирийский фрагмент в поле source_context относится к соседнему/повреждённо перебранному участку и не позволяет заново пословно проверить именно 70:1; однако перевод согласуется с английской контрольной дорожкой и зафиксированными лексическими решениями.'
