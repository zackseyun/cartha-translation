lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟܡ̈ܐ ܐܚܪ̈ܝܐ
  choice: последние чёрные воды
  rationale: Сохраняет кульминационный апокалиптический образ и передаёт ܐܚܪ̈ܝܐ как «последние» в контексте заключительной последовательности вод.
- source_word: ܦܘܫܩܐ
  choice: толкование
  rationale: Естественно передаёт раскрытие смысла символического видения, не сводя его лишь к формальному «объяснению».
- source_word: ܡܠܬܐ
  choice: вот что это означает
  rationale: Контекстуальная передача вводной формулы «это слово / вот слово», которая по-русски естественно открывает последующее истолкование.
theological_decisions:
- issue: Характер образа последних чёрных вод
  choice: Сохранить образ без преждевременного отождествления с конкретными бедствиями или политическими событиями.
  alternative: Заменить образ поясняющим обозначением всемирной катастрофы.
  rationale: Сам стих только вводит толкование; богословское содержание символа должно раскрываться последующим текстом, а не вноситься в перевод заранее.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным апокалиптическим звучанием. Повтор «чёрных вод» сохранён, поскольку он отражает структуру исходной формулировки и связь последовательных частей видения.
