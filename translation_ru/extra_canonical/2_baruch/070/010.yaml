lexical_decisions:
- source_word: ܐܪܥܐ
  choice: земля
  rationale: Сохраняет обычное значение «земля» и всеобщий охват, выраженный определением «вся».
- source_word: ܐܟܠ
  choice: пожрёт
  rationale: Передаёт сильный образ поглощения или истребления, не ослабляя его до нейтрального «уничтожит».
- source_word: ܥܡܘܪ̈ܐ
  choice: обитатели
  rationale: Естественно обозначает всех живущих на земле и сохраняет связь с местом их обитания.
theological_decisions:
- issue: Образ земли как действующего лица суда
  choice: 'Сохранить буквальную персонификацию: «земля пожрёт»'
  alternative: «Жители всей земли будут истреблены»
  rationale: Исходный образ намеренно представляет землю поглощающей собственных обитателей; нейтральная пассивная конструкция устранила бы эту напряжённую образность.
translation_notes:
  register: Краткий, торжественный и понятный современному читателю русский текст. Глагол «пожрёт» выбран как литературный и образно сильный; архаические синтаксические формы не используются.
