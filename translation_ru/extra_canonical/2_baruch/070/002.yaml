base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/070/002.yaml
  text: Behold, days are coming when the time of the world has ripened and the harvest of the seed of the evil and the good has come. Then the Mighty One will bring confusion of spirit and consternation of heart upon the earth, its inhabitants, and its rulers.
translation:
  language: ru
  text: Вот, наступают дни, когда срок этого мира созреет и придёт жатва семени злых и добрых[a]. Тогда Могущественный наведёт на землю, на её жителей и её правителей смятение духа и тревогу сердца.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, при иной связи слов: «его злых и добрых семян».'
    reason: Сохраняет засвидетельствованную альтернативу, в которой «злые» и «добрые» понимаются как определения к «семенам», тогда как основной текст понимает их как людей, которым принадлежит семя.
lexical_decisions:
- source_word: ܙܒܢܗ ܕܥܠܡܐ
  choice: время мира
  rationale: Сохраняет космологическое значение «мира/века», не сужая его до истории или эпохи.
- source_word: ܙܪܥܐ ... ܕܒܝ̈ܫܐ ܘܕܛܒ̈ܐ
  choice: семени злых и добрых
  rationale: «Злые» и «добрые» поняты как субстантивированные определения во множественном числе, зависимые от единственного «семя», а не как нравственные качества разных семян.
- source_word: ܚܝܠܬܢܐ
  choice: Могущественный
  rationale: Передаёт божественный титул без добавления имени или конфессионально окрашенного толкования.
- source_word: ܫܓܘܫܝܐ ܕܪܘܚܐ ... ܬܘܗܝܐ ܕܠܒܐ
  choice: смятение духа и тревогу сердца
  rationale: Сохраняет параллелизм внутренних потрясений и звучит естественно в современном литературном русском.
theological_decisions:
- issue: Кому принадлежит «семя»
  choice: «семя злых и добрых», то есть людей обеих групп
  alternative: «злые и добрые семена»
  rationale: Генитивная конструкция и формы множественного числа у «злых» и «добрых» указывают прежде всего на группы людей; альтернативу сохранено в примечании как традиционно возможное прочтение.
- issue: Обозначение Бога титулом
  choice: Могущественный
  alternative: Всемогущий
  rationale: Более буквально сохраняет данный титул и не усиливает его до отдельного богословского утверждения о всемогуществе.
translation_notes:
  register: Современный литературный русский с торжественным пророческим звучанием; синтаксис упрощён лишь настолько, чтобы текст оставался ясным обычному читателю. Повтор притяжательного местоимения перед «правителями» делает ряд однозначным.
