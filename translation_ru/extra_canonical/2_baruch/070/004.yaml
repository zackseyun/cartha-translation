base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/070/004.yaml
  text: Many will be delivered into the hands of the few. Those who were nothing will rule over the strong, the poor will have more than the rich, and the impious will exalt themselves over the brave.
translation:
  language: ru
  text: Многие будут отданы в руки немногих. Те, кто был ничем[a], будут властвовать над сильными; у бедных будет больше, чем у богатых, а нечестивые возвысятся над храбрыми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «те, кто был никем».'
    reason: Отмечает возможную идиоматическую передачу буквального выражения «те, кто был ничем», не заменяя ею более торжественный основной текст.
lexical_decisions:
- source_word: ܣ̈ܓܝܐܐ / ܒܙܒܘܪ̈ܐ
  choice: многие / немногие
  rationale: Сохраняет выраженное в сирийском тексте резкое противопоставление множества и малого числа.
- source_word: ܕܠܐ ... ܡܕܡ
  choice: те, кто был ничем
  rationale: Передаёт буквальный образ «не быть чем-либо» без разговорного и уничижительного «никто».
- source_word: ܒܫܪܝܪܐ
  choice: над сильными
  rationale: В данном перечне переворота общественного порядка слово естественно обозначает сильных или могущественных; «сильные» сохраняет широкое значение.
- source_word: ܡܣܒܪܝܢ ... ܒܐܝܕ̈ܝܐ
  choice: у бедных будет больше, чем у богатых
  rationale: Следует смысловому противопоставлению бедных и богатых, выражая обладание естественным современным русским оборотом.
- source_word: ܣܟܠܐ ... ܓܒܪ̈ܐ
  choice: нечестивые возвысятся над храбрыми
  rationale: Сохраняет нравственное обозначение первой группы и значение мужества/доблести второй, не сужая его до воинского титула.
theological_decisions:
- issue: Апокалиптическое переворачивание общественного порядка
  choice: Передать все четыре контраста прямо, не объясняя их как нравственное воздаяние или конкретное историческое событие.
  alternative: Истолковать их как окончательный суд либо как предсказание определённого политического кризиса.
  rationale: Сам стих перечисляет бедствия и переворот обычных иерархий, но не устанавливает здесь однозначно их богословский или исторический референт.
translation_notes:
  register: Современный литературный русский язык с торжественным апокалиптическим звучанием. Синтаксис ясен и ритмичен; намеренно избегаются разговорные «ничтожества» и «никтошки», а также архаизмы.
