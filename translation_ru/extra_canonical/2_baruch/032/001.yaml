  terminology: «Плоды Закона» сохраняет множественное число и аграрную метафору; прописная буква в «Законе» уместно обозначает нормативно-заветный контекст. «Всё творение» верно передаёт космический объём, а «Могущественный» не усиливает титул до «Всемогущего». Якорь сноски расположен после «вас» и относится к альтернативной передаче именно этой глагольной формы.
