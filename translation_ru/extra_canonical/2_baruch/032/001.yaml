  source_fidelity: 'Перевод точно передаёт смысловой состав стиха: условную подготовку сердец, посев плодов Закона, активную защиту и грядущее потрясение всего творения Могущественным. Активное «это защитит вас» согласуется с контрольной традицией и не превращает глагол в пассив. Указательное «это» осторожно сохраняет не вполне определённую связь субъекта защиты с предшествующим образом.'
