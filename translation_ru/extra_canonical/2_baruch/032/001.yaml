  language: en
  yaml_path: translation/extra_canonical/2_baruch/032/001.yaml
  text: 'But you, if you prepare your hearts so as to sow in them the fruits of the law, it will protect you in that time when the Mighty One shakes the whole creation.


    For after a little time the building of Zion will be shaken, so that it may be rebuilt again. Yet that very building will not remain; rather, after a time it will again be uprooted and will remain desolate until the time. And afterward it must be renewed in glory and be established forever.


    Therefore we should not grieve so greatly over the evil that has come now, as over that which is to come.'
translation:
  language: ru
  text: Вы же, если приготовите свои сердца, чтобы посеять в них плоды Закона, — это защитит вас[a] в то время, когда Могущественный потрясёт всё творение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «вы будете защищены».'
    reason: Грамматическая традиция допускает пассивную передачу, хотя активное чтение лучше соответствует контрольным данным.
lexical_decisions:
- source_word: ܠܒܘܗܝ / corda vestra
  choice: свои сердца
  rationale: Сохраняет библейский образ внутренней нравственной готовности и естественно звучит по-русски.
- source_word: ܦܐܪ̈ܐ / fructus legis
  choice: плоды Закона
  rationale: Сохраняет множественное число сирийского слова и земледельческую метафору, не сводя её к отвлечённому «послушанию».
- source_word: ܢܓܢ / proteget vos
  choice: это защитит вас
  rationale: Активная конструкция сохранена, но нейтральное «это» не вынуждает выбирать между плодами Закона, Законом и всем предшествующим действием как грамматическим субъектом.
- source_word: Fortis
  choice: Могущественный
  rationale: Передаёт почтительный божественный титул, не подменяя его более конкретным именованием Бога.
- source_word: omnem creaturam
  choice: всё творение
  rationale: Передаёт космический масштаб грядущего потрясения естественным русским библейским выражением.
theological_decisions:
- issue: Что именно защищает
  choice: это защитит вас
  alternative: вы будете защищены; плоды Закона защитят вас
  rationale: Активность глагола сохранена, однако указательное «это» удерживает реальную неоднозначность относительно того, относится ли действие к плодам Закона, к Закону или ко всему описанному приготовлению сердца.
- issue: Божественный титул
  choice: Могущественный
  alternative: Сильный; Всемогущий
  rationale: «Могущественный» сохраняет форму эпитета и не усиливает исходное слово до более специального титула «Всемогущий».
- issue: Границы стиха
  choice: В основной текст включено только первое предложение
  alternative: Присоединить последующие абзацы английского консультационного слоя
  rationale: Последующие абзацы относятся к дальнейшим стихам главы; при точной ссылке 2 Варуха 32:1 их не следует включать в данный стих, несмотря на расширенный английский консультационный блок.
