base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/057/001.yaml
  text: 'For you saw a great cloud that ascended from the sea and went and covered this earth, hear this: that it is the world that the Mighty One made when he planned to make creation. And it happened that, when the word went out from before him, the beginning of the world stood, small and beautiful, and was established as it was destined to be.


    And the black waters that you saw first, which descended upon it from the cloud—this is the transgression that the first Adam committed at first. For when he sinned, death was stirred up, though it was not its time, and grief was made known, and pains were prepared, and suffering was created, and toil was accomplished, and greatness began to be brought low.


    And the last day, which was shown in the form and took the likeness, know that the time will be inquired into, and the measure of humanity will be measured, and its strength will be tested. Therefore, because Adam, while he was, heard from God something of what was to be, and understood the release of the dead that was to be given, and what had been commanded him by God, he considered it, and he devised five thoughts. For he made himself liable, and he also made the angels liable. And also at that time when he was created, there was shown to him a vision of the bitter life and of the elements with fire. Thus God gathered in Eden, in the likeness of those that were created.'
translation:
  language: ru
  text: 'Ты видел великое облако, поднявшееся из моря, которое пошло и покрыло эту землю; знай же: это — мир, который Сильный создал, когда замыслил сотворить творение.[a] И когда от Него изошло слово, начало мира возникло — малое и прекрасное — и было устроено таким, каким ему надлежало быть.


    А чёрные воды, которые ты видел прежде и которые сошли на него из облака, — это преступление, совершённое вначале первым Адамом. Ибо, когда он согрешил, смерть пришла в движение, хотя её время ещё не настало; стала известна скорбь, были уготованы муки, сотворено страдание, труд достиг полноты, и величие начало умаляться.


    А о последнем дне, который был показан в образе и принял подобие, знай: время будет исследовано, мера человечества будет измерена и сила его испытана. Итак, поскольку Адам ещё при жизни услышал от Бога кое-что о грядущем, понял, что мёртвым будет даровано освобождение, и обдумал то, что было повелено ему Богом, он стал размышлять и замыслил пять помыслов. Ведь он навлёк ответственность на самого себя, а также на ангелов. И ещё в то время, когда он был сотворён, ему было явлено видение горькой жизни и стихий вместе с огнём. Так Бог собрал в Эдеме — по подобию тех, кто был сотворён.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможна иная расстановка границы фразы: «…покрыло эту землю. Это — мир, который Сильный создал…»'
    reason: Сирийский синтаксис допускает иное членение фразы.
  - marker: b
    text: Заключительная фраза в сирийском тексте сжата и неясна; предмет глагола «собрал» прямо не назван.
    reason: Сохранена подлинная неясность источника без восполнения предполагаемого дополнения.
lexical_decisions:
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  choice: начало мира
  rationale: Контрольное чтение указывает на первичный исток или начало мира; «основание» было бы возможным, но менее точно передавало бы здесь временно-космогонический смысл.
- source_word: ܚܛܗܐ ܡܬܒܪܝܢܘܬܐ
  choice: преступление
  rationale: Сочетание обозначает не просто абстрактный грех, а совершённый Адамом проступок с последствиями для миропорядка.
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  choice: смерть пришла в движение
  rationale: Сохранён образ приведения смерти в действие; нейтральное «появилась смерть» ослабило бы апокалиптическую образность.
- source_word: ܪܘܪܒܘܬܐ ܫܪܝܬ ܕܬܡܘܟ
  choice: величие начало умаляться
  rationale: Передано постепенное нисходящее движение без уточнения, чьё именно величие имеется в виду.
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  choice: мера человечества
  rationale: Судебно-оценочный контекст и параллелизм с исследованием времени и испытанием силы поддерживают значение «мера».
- source_word: ܡܚܝܒܢܘܗܝ
  choice: навлёк ответственность
  rationale: Формулировка сохраняет смысл возникшей вины или юридической ответственности, не сводя его к субъективному чувству виновности.
- source_word: ܐܣܛܘܟܣܐ
  choice: стихии
  rationale: Греческое заимствование stoicheia имеет здесь космологический оттенок; «стихии» естественно и ёмко передаёт его по-русски.
theological_decisions:
- issue: Роль проступка Адама
  choice: Поступок первого Адама представлен как событие, приведшее в действие преждевременную смерть и весь ряд последствий падения.
  alternative: Понимать его лишь как пример общей человеческой греховности.
  rationale: Сам текст прямо связывает с этим проступком космические и человеческие последствия, поэтому причинная сила высказывания сохранена.
- issue: Ответственность Адама и ангелов
  choice: Сохранено трудное утверждение, что Адам навлёк ответственность и на себя, и на ангелов.
  alternative: Смягчить фразу до утверждения, что Адам повредил только самому себе, либо устранить упоминание ангелов.
  rationale: Сирийский текст выражается резко и не вполне прозрачно; перевод не должен устранять эту богословскую напряжённость.
- issue: Освобождение мёртвых
  choice: Фраза передана без уточнения способа, времени или объёма освобождения.
  alternative: Истолковать её как прямое указание на конкретную разработанную доктрину воскресения.
  rationale: Источник утверждает будущее освобождение мёртвых, но в данном месте не раскрывает его механизм.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейско-апокалиптическим звучанием. Архаизмы ограничены устойчивыми словами «изошло», «уготованы», «надлежало»; трудные места не сглажены конфессиональным толкованием.
