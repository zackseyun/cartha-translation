translation:
  language: ru
  text: И концы времён праведников, которым предстояло исполниться перед Ним, пребывают в Его памяти как нечто единое и неизменное, помимо того, что Он совершит при завершении века.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܒ̈ܒ̣ܐ
  choice: концы
  rationale: Передаёт значение завершений или пределов; форма в рукописном тексте трудна, но контекст и древняя переводческая традиция поддерживают смысл «концы».
- source_word: ܢ̈ܦܫܐ ܕܙܕܝ̈ܩܐ
  choice: времён праведников
  rationale: В данном контексте выражение понимается как относящееся к назначенным срокам праведников; буквальное чтение формы как «души» нарушило бы синтаксис и смысл фразы.
- source_word: ܩܿܝܡ ܚܕܐ ܕܘܟܪܢܗܘܢ ܫܪܐ
  choice: пребывают в Его памяти как нечто единое и неизменное
  rationale: Естественно передаёт сочетание идей стояния/пребывания, единства, памяти и твёрдой установленности, не превращая сжатую сирийскую конструкцию в неясную кальку.
- source_word: ܒܫܘܠܡܗ ܕܥܠܡܐ
  choice: при завершении века
  rationale: ܫܘܠܡܐ означает завершение или исполнение, а ܥܠܡܐ может обозначать век/эпоху либо мир; «завершение века» сохраняет эсхатологический смысл без преждевременного отождествления с уничтожением мира.
theological_decisions:
- issue: Смысл выражения ܥܠܡܐ в эсхатологической формуле
  choice: века
  alternative: мира
  rationale: Сирийское слово допускает оба оттенка. «Век» лучше сохраняет временной смысл формулы и её подлинную неоднозначность.
- issue: Отношение грядущего деяния Бога к уже установленным срокам
  choice: «помимо того, что Он совершит»
  alternative: «за исключением того, что Он совершит»
  rationale: Фраза отмечает дополнительное, ещё будущее действие при завершении века; «помимо» не вводит более сильного логического противопоставления, чем есть в источнике.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным синтаксисом. Местоимения, относящиеся к Богу, даны с прописной буквы для ясности референции; конфессионально специфическая терминология не вводится.
