review_pass:
  verdict: revise
  source_fidelity: Черновик следует английской контрольной формулировке, но не представленному сирийскому тексту. В сирийском читается ܕܒ̈ܒ̣ܐ («враги») и ܢ̈ܦܫܐ ܕܙܕܝ̈ܩܐ («души праведников»), а не «концы времён праведников». Глагол ܢܫܬܒܩܘܢ допускает «будут оставлены»; более определённые варианты («прощены», «отпущены») здесь не следует навязывать. Формула о памяти передана с сохранением образа единого твёрдо установленного памятования.
  naturalness: Предлагаемый текст сохраняет торжественный, но современный литературный русский синтаксис. «Оставлены пред Ним» несколько необычно, однако намеренно точно отражает неясный пассив сирийского текста и пояснено в сноске.
  terminology: «Души праведников» — прямое и естественное соответствие ܢ̈ܦܫܐ ܕܙܕܝ̈ܩܐ. «Завершение века» адекватно передаёт ܫܘܠܡܗ ܕܥܠܡܐ и сохраняет возможное эсхатологическое значение без конфессионального истолкования.
  issues:
  - severity: high
    issue: Подмена «врагов душ праведников» выражением «концы времён праведников».
    rationale: Лексические решения черновика переосмысляют ܕܒ̈ܒ̣ܐ как «концы», а ܢ̈ܦܫܐ как «времена», хотя их обычные и контекстуально непосредственно доступные значения — «враги» и «души». Английский POB audit trail расходится с представленным сирийским чтением и не должен иметь приоритета над источником.
  - severity: medium
    issue: Не отражена текстовая и семантическая неопределённость ܢܫܬܒܩܘܢ.
    rationale: «Которым предстояло исполниться» не соответствует глаголу «быть оставленными/отпущенными». Нейтральный перевод с примечанием сохраняет возможную неоднозначность.
  revised_text: И враги душ праведников, которым предстоит быть оставленными пред Ним,[a] пребывают в едином, твёрдо установленном памятовании — наряду с тем, что Он совершит при завершении века.
  revised_footnotes:
  - marker: a
    text: Сирийский глагол может означать «быть оставленными» или «быть отпущенными/прощёнными»; в данном трудном контексте точный оттенок неясен.
    reason: Сохраняет лексическую неоднозначность глагола ܢܫܬܒܩܘܢ, не выбирая богословски обусловленное значение.
  revision_rationale: Текст исправлен по сирийскому источнику, а не по расходящейся с ним английской аудиторской формулировке. Восстановлены прямые соответствия «враги» и «души праведников»; сомнительный пассив передан нейтрально и снабжён сноской. «Завершение века» сохранено как удачный эквивалент заключительной эсхатологической формулы.
