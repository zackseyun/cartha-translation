lexical_decisions:
- source_word: ܡ̈ܢܝܢ
  choice: исчисляются
  rationale: Передаёт значение счёта или сопоставления при счёте; возвышенная, но понятная современная формулировка.
- source_word: ܐܘ̈ܩܢܘܐ
  choice: часы
  rationale: Следует наиболее вероятному пониманию первого временного обозначения и сохраняет установленный источником порядок.
- source_word: ܢܗܝܪܐ
  choice: времена
  rationale: В данном контексте передано как второе обозначение временных периодов; рукописное чтение и его точная семантика не вполне прозрачны.
theological_decisions:
- issue: Сопоставимость эсхатологических периодов
  choice: Сохранено отрицание возможности исчислять одни часы вместе с другими и одни времена вместе с другими.
  alternative: Пояснить, что речь идёт о несопоставимости бедствий или эпох.
  rationale: Источник формулирует мысль кратко и неоднозначно; богословское объяснение не следует вносить непосредственно в текст.
