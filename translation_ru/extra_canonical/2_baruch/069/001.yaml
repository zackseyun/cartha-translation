translation:
  language: ru
  text: 1. Последние воды, которые ты видел и которые были чернее всех прежних, — это они…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Сирийский текст здесь обрывается; буквально: «это они…».'
    reason: Сноска отмечает незавершённость сохранившейся формулировки и даёт буквальную передачу указательной конструкции, не восполняя утраченного продолжения.
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܚܪ̈ܢܐ
  choice: последние воды
  rationale: В данном месте ܐܚܪ̈ܢܐ может означать «другие», «последующие» или «последние». Контекст завершающего этапа видения поддерживает «последние», при этом вариант отмечен в сноске.
- source_word: ܕܐܘܟܡܝܢ ܗܘܘ
  choice: были чернее
  rationale: 'Сравнительная конструкция с ܡܢ передаёт степень: эти воды чернее всех предшествующих. «Чернее» также сохраняет устойчивый образ чёрных вод в видении.'
- source_word: ܗܢܘܢ ܗܘ
  choice: это те самые…
  rationale: Сохраняет указательную формулу, не восполняя отсутствующее или повреждённое продолжение фразы. Многоточие показывает, что имеющийся сирийский текст здесь обрывается.
theological_decisions:
- issue: Следует ли восполнять, что последние воды относятся ко всему миру
  choice: Не восполнять отсутствующие слова
  alternative: «это те, которые относятся ко всему миру»
  rationale: Предоставленный сирийский свидетель заканчивается указательной формулой и не содержит слов «весь мир». Их добавление превратило бы предположение о лакуне в основной текст.
translation_notes:
  register: Современный литературный русский язык с торжественной, но ясной апокалиптической интонацией. Синтаксис сохранён близким к сирийскому; многоточие обозначает реальный обрыв источника, а не стилистическую недосказанность.
