lexical_decisions:
- source_word: ܡܛܠ ܕ
  choice: Ибо
  rationale: Передаёт причинно-пояснительную связь с предыдущим высказыванием естественнее, чем начинающее самостоятельный стих «потому что».
- source_word: ܗܘ ܟܠܚܘܕܘܗܝ
  choice: только он
  rationale: 'Сохраняет усиленное значение исключительности: «он один / только он».'
- source_word: ܝܿܕܥ
  choice: знает
  rationale: Прямое соответствие глаголу знания в настоящем времени.
- source_word: ܡܕܡ ܕܥܬܝܕ ܠܡܗܘܐ
  choice: что должно произойти
  rationale: Естественно передаёт будущее событие; «должно» здесь выражает предстоящее, а не моральную обязанность.
theological_decisions:
- issue: Написание местоимения, относящегося к Богу
  choice: он со строчной буквы
  alternative: Он с прописной буквы
  rationale: В сирийском тексте нет графического выделения почтительного местоимения; строчная буква не добавляет поздней русской конфессионально-редакторской условности и сохраняет связность референции с контекстом.
