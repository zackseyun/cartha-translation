lexical_decisions:
- source_word: ܒܝ̈ܫܬܐ ... ܘ̈ܛܒܬܐ
  choice: бедствия и блага
  rationale: Передаёт противопоставление множественных «злых» и «добрых» вещей естественно для современного русского языка, не превращая их без основания в нравственные поступки.
- source_word: ܥܬܝܕܝܢ ... ܕܢܗܘܘܢ
  choice: которым предстоит быть
  rationale: Конструкция выражает предстоящее, предназначенное осуществление; сохранена некоторая отвлечённость сирийского выражения.
- source_word: ܩܕܡܘܗܝ ܩܿܝܡܢ
  choice: стоят перед Ним
  rationale: Буквально сохраняет пространственно-судебный образ предстояния и настоящее время причастия.
- source_word: ܚܕܐ ܕܘܟܪܢܗܘܢ ܫܪܐ
  choice: как единое непреложное воспоминание
  rationale: Сохраняет необычный образ единого закреплённого воспоминания, относимого даже к будущему, не устраняя его напряжение поясняющим пересказом.
theological_decisions:
- issue: Будущие события как уже стоящие перед Богом в виде воспоминания
  choice: Сохранить парадоксальный образ без разъяснения
  alternative: Пересказать как «Он заранее знает всё зло и добро»
  rationale: Пересказ сделал бы смысл более однозначным, чем сирийский текст, и заменил бы его образы доктринальной формулировкой.
- issue: Референт местоимения ܩܕܡܘܗܝ
  choice: «перед Ним» с прописной буквы
  alternative: «перед ним»
  rationale: Контекст говорит о Том, Кто один знает грядущее; прописная буква соответствует достоинству русского религиозного регистра, не добавляя имени или титула.
translation_notes:
  register: Современный литературный русский язык возвышенного, но понятного регистра. Сохранены лаконичность, повтор корней «быть/стоят» и намеренно необычный образ воспоминания о будущем.
