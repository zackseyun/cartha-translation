base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/087/001.yaml
  text: and in my prayer. And you also have learned from them the commandments of this letter, and you will be subdued in excellence, the nations for the promise, and you will be loved, and you will be comforted, lest you fall and be tormented.
translation:
  language: ru
  text: И в молитве моей. И вы также научились из них заповедям этого послания; смиритесь же в добродетели, народы, ради обетования[a], и будете любимы и утешены, чтобы вам не пасть и не подвергнуться мучениям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Смысл и синтаксическая связь этих слов в дошедшем сирийском тексте неясны; буквально: «и будете смирены в добродетели, народы — ради обетования».'
    reason: Сохраняет свидетельство трудного текста и предупреждает читателя, что гладкая русская конструкция не устраняет исходной неоднозначности.
lexical_decisions:
- source_word: ܒܒܥܘܬܝ
  choice: в молитве моей
  rationale: Существительное допускает значения «молитва», «прошение», «мольба»; «молитва» естественно продолжает предшествующее упоминание о том, что Варух помнит адресатов.
- source_word: ܝܠܦܬܘܢ
  choice: вы также научились
  rationale: Форма передаёт обучение или усвоение наставления; прошедшее значение сохранено без превращения фразы в прямое повеление.
- source_word: ܡܢܗܘܢ
  choice: из них
  rationale: Местоимённая отсылка не вполне ясна; буквальная передача сохраняет возможность соотнести её с предшествующими словами или содержанием послания.
- source_word: ܦܘ̈ܩܕܢܐ
  choice: заповедям
  rationale: Слово обозначает повеления или авторитетные предписания; «заповеди» сохраняет возвышенный увещательный строй.
- source_word: ܘܬܬܟܦܘܢ
  choice: смиритесь же
  rationale: Форма от корня со значением сгибания или подчинения передана как призыв к смирению; это ближе к засвидетельствованному сирийскому, чем «укрепитесь».
- source_word: ܒܡܝܬܪܘܬܐ
  choice: в добродетели
  rationale: Слово может обозначать превосходство, достоинство или добродетель; в нравственном увещании «добродетель» звучит естественно.
- source_word: ܠܡܘܠܟܢܐ
  choice: ради обетования
  rationale: Передаёт значение «для/ради обетования» и не смешивает существительное «обетование» с корнем «царствовать».
- source_word: ܘܬܬܪܚܡܘܢ ܘܬܬܢܚܡܘܢ
  choice: и будете любимы и утешены
  rationale: Сохранена последовательность страдательных форм и их богословски открытый субъект.
- source_word: ܕܠܡܐ ܬܦܠܘܢ ܘܬܫܬܢܩܘܢ
  choice: чтобы вам не пасть и не подвергнуться мучениям
  rationale: Финальное предостережение передано как цель или предотвращаемая опасность, без уточнения природы мучений.
theological_decisions:
- issue: Характер упоминания молитвы Варуха
  choice: Сохранено краткое «в молитве моей» без развития темы ходатайства.
  alternative: Явно перевести как «в моём ходатайстве за вас».
  rationale: Сирийский текст называет молитву, но не даёт оснований вводить более разработанное учение о ходатайстве.
- issue: Кто любит и утешает адресатов
  choice: Сохранены безличные страдательные формы «будете любимы и утешены».
  alternative: Указать Бога как явного действующего субъекта.
  rationale: В исходном тексте субъект не назван; его богословское уточнение устранило бы подлинную открытость формулировки.
- issue: Неясная связь смирения, народов и обетования
  choice: Лексемы сохранены в наиболее связной увещательной конструкции, а текстовая и синтаксическая трудность отмечена сноской.
  alternative: Исправить текст по предположению и перевести «укрепитесь, чтобы превосходно править народами».
  rationale: Такое исправление требует незасвидетельствованных замен и смешивает «обетование» с «царствованием».
translation_notes:
  register: Современный литературный русский с достоинством эпистолярного увещания. Архаизмы сведены к минимуму; «обетование» и «заповеди» сохранены как понятные библейские термины. Неясный участок не исправлен догадочно, а дан в читабельной форме со сноской.
