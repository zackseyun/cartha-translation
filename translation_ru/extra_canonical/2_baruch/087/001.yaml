review_pass:
  verdict: revise
  source_fidelity: 'Начальная фраза корректно сохранена как продолжение предыдущего предложения. В трудной последовательности ܘܬܬܟܦܘܢ … ܥܡܡܐ ܠܡܘܠܟܢܐ черновик верно не принимает прежнюю необоснованную конъектуру «укрепитесь, чтобы править народами». Однако повелительное «смиритесь же» и обращение «народы» вводят синтаксический разбор, которого сирийская форма и контекст надёжно не поддерживают: форма естественнее передаётся будущим страдательным «будете смирены», а функция «народов» остаётся неясной.'
  naturalness: «Научились из них заповедям» тяжеловесно и не вполне естественно по-русски. «Узнали от них заповеди» передаёт смысл глагола обучения/получения знания более гладко, не уточняя неназванный антецедент местоимения. Из-за реально неясного участка после «в добродетели» допустима намеренно сдержанная, отмеченная сноской конструкция.
  terminology: «Молитва», «заповеди», «обетование», «добродетель», а также страдательные «будете любимы и утешены» уместны и не навязывают богословского субъекта. «Будете смирены» точнее передаёт засвидетельствованное значение формы, чем обращённое к адресатам «смиритесь».
  issues:
  - severity: medium
    issue: Неверно задано наклонение ܘܬܬܟܦܘܢ.
    rationale: В черновике стоит «смиритесь же», тогда как в последовательности с дальнейшими будущими страдательными формами безопаснее сохранить «будете смирены». Повелительное прочтение — дополнительная интерпретация.
  - severity: medium
    issue: «Народы» превращены в обращение.
    rationale: Ни пунктуация, ни грамматика сирийского отрывка не позволяют уверенно считать ܥܡܡܐ вокативом. Это следует оставить синтаксически неразрешённым и пояснить в сноске.
  - severity: low
    issue: Неестественная связь «научились из них заповедям».
    rationale: Русское «узнали от них заповеди» литературнее, при этом «от них» сохраняет неясность референта сирийского местоимения.
  revised_text: И в моей молитве. И вы также узнали от них заповеди этого послания и будете смирены в добродетели, народы — ради обетования[a]; и будете любимы и утешены, чтобы не пасть и не подвергнуться мучениям.
  revised_footnotes:
  - marker: a
    text: 'Смысл и синтаксическая связь слов «народы — ради обетования» в дошедшем сирийском тексте неясны. Буквально: «и будете смирены в добродетели, народы — ради обетования».'
    reason: 'Сохраняет свидетельство трудного текста: не превращает «народы» в обращение и не исправляет текст догадочно.'
  revision_rationale: Исправление устраняет необоснованные повелительное наклонение и вокативное прочтение в текстуально трудном месте. Остальная увещательная последовательность и её намеренно открытые богословские формулировки сохранены; сноска прямо отмечает, что гладкое истолкование данного участка невозможно без конъектуры.
