  yaml_path: translation/extra_canonical/2_baruch/015/001.yaml
  text: 'And the Lord answered and said to me:

    “You are right to be astonished at man’s passing, but your judgment about the evils that befall sinners is not right.


    And as for what you said about the righteous who are taken away and the wicked who prosper,

    and as for what you said—that man does not know your judgment—

    because of this, listen now and I will speak to you; pay attention and I will make my words heard.


    Indeed, man would not have understood my judgment if he had not received the Law and if I had not instructed him in understanding.

    But now, because he has transgressed while understanding, he will surely be punished because of that understanding.

    And as for the righteous, concerning whom you said that the world came on their account: what is coming is likewise on their account.

    For to them this world is a struggle and a labor with much trouble, but what is to come is a crown with great glory.”'
translation:
  language: ru
  text: 'И Господь ответил мне:


    «Ты справедливо изумляешься уходу человека[a], но неверно судишь о бедствиях, постигающих грешников.


    Что же до сказанного тобой о праведниках, которых забирают из жизни, и о нечестивых, которые благоденствуют, а также до твоих слов, что человек не знает Моего суда, — выслушай теперь, и Я буду говорить тебе; внимай, и Я дам тебе услышать Мои слова.


    Ведь человек не мог бы понять Моего суда, если бы не получил Закона и если бы Я не наставил его в разумении. Но теперь, поскольку он преступил, обладая разумением, он непременно понесёт наказание за то, что преступил при таком разумении.


    Что же до праведников, о которых ты сказал, что ради них возник мир, — грядущее также будет ради них[b]. Ибо для них этот мир — борьба и тяжкий труд среди многих скорбей, а грядущее — венец великой славы».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть уходу человека из этой жизни, смерти.
    reason: Основной текст сохраняет образное и несколько неоднозначное выражение, а примечание поясняет его наиболее вероятный смысл.
  - marker: b
    text: 'Или: «грядущий мир также будет ради них».'
    reason: Сохраняет возможное эсхатологическое прочтение, не делая его единственным в основном тексте.
lexical_decisions:
- source_word: ܐܬܡܗܬ
  choice: изумляешься
  rationale: Передаёт потрясённое изумление, а не простое любопытство; соответствует ответу на размышление о человеческом уходе и суде.
- source_word: ܢܡܘܣܐ
  choice: Закон
  rationale: Определённая форма и ход рассуждения указывают на данный Богом Закон как основание осведомлённости и ответственности человека.
- source_word: ܡܕܥܐ / ܚܟܡܬܐ
  choice: разумение
  rationale: Сохраняет связь между наставлением, нравственным знанием и возросшей ответственностью за сознательное преступление Закона.
- source_word: ܩ̈ܠܝ
  choice: Мои слова
  rationale: Сирийское выражение буквально связано с «голосами/звуками», но в данном речевом контексте естественно означает произносимые слова.
theological_decisions:
- issue: Почему разумение усиливает суд
  choice: Сознательное преступление Закона влечёт наказание именно в силу полученного разумения.
  alternative: Знание лишь обнаруживает грех, не усиливая ответственности.
  rationale: Аргумент отрывка прямо связывает наставление и понимание с ответственностью за последующее преступление.
- issue: Отношение праведников к нынешнему миру и грядущему
  choice: Нынешний мир приносит праведникам борьбу и скорбный труд, тогда как грядущее несёт им оправдание и славу.
  alternative: Речь относится только к нынешнему миру.
  rationale: Текст намеренно противопоставляет нынешние тяготы грядущему венцу, не устраняя ни одной стороны этого напряжения.
- issue: Значение выражения о грядущем
  choice: Оставлено обобщённое «грядущее», допускающее как грядущий мир, так и грядущую действительность или участь.
  alternative: Явно перевести как «грядущий мир».
  rationale: Так сохраняется широта исходного выражения и не вводится более узкое толкование непосредственно в основной текст.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего религиозного обращения. Синтаксис упрощён настолько, чтобы длинное рассуждение оставалось понятным, но повторяющаяся формула «что же до» сохранена как композиционный приём. Заглавные буквы в местоимениях Бога употреблены последовательно в рамках выбранного русского издательского регистра.
