  text: But remember and admonish the people who remain, lest they withdraw from the commandments of the Mighty One.
translation:
  language: ru
  text: Но помните и наставляйте тех из народа, кто остался, чтобы они не отступили от заповедей Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢ̇ܛܪܘ
  choice: помните
  rationale: Императив от корня ܢܛܪ допускает значения «хранить, соблюдать, держать в памяти»; в данном обращении естественно передано как призыв помнить.
- source_word: ܠܥܡܐ ܕܐܫܬܚܪ
  choice: тех из народа, кто остался
  rationale: Передаёт оставшуюся часть народа естественным современным русским оборотом.
- source_word: ܢܫܒܘܩ ܡܢ
  choice: не отступили от
  rationale: По контексту оставление заповедей означает отход от них; «отступили» звучит ясно и достойно.
- source_word: ܦܘܩ̈ܕܢܘܗܝ ܕܐܠܗܐ
  choice: заповедей Бога
  rationale: Сирийское ܐܠܗܐ прямо означает «Бог»; перевод следует исходному тексту, не заменяя обозначение на английское «Могущественный».
theological_decisions:
- issue: Божественное именование в конце стиха
  choice: Бога
  alternative: Могущественного
  rationale: В представленном сирийском тексте стоит ܐܠܗܐ («Бог»). Поэтому выбран формально и лексически прямой эквивалент без внесения иного титула.
- issue: Цель наставления оставшегося народа
  choice: чтобы они не отступили
  alternative: дабы они не оставили
  rationale: Формулировка сохраняет предостережение против отхода от заповедей и не уточняет мотив или степень такого отхода.
translation_notes:
  register: Современный литературный русский язык; речь наставительная и торжественная, но без архаизмов. Синтаксис упрощён ради ясности, при этом сохранены повелительный тон и богословская направленность исходного текста.
