    rationale: 'Выражение «согласно иному прочтению» предполагает засвидетельствованный текстовый вариант. Аудиторский след говорит об альтернативной передаче трудного места; безопаснее сказать «Или: ...» и объяснить синтаксическую/текстовую трудность в причине примечания.'
