base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/044/001.yaml
  text: And I, Baruch, went from there and came to the people. And I called my firstborn, its inhabitants, and the elders of its great ones, and the lowly from the elders of the people, and I said to them,
translation:
  language: ru
  text: 'И я, Варух, ушёл оттуда и пришёл к народу. Я созвал моего первенца, его жителей, старейшин из числа его знатных людей и простых среди старейшин народа[a] и сказал им:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «могущественных людей народа и старейшин».'
    reason: Сирийский перечень синтаксически и текстологически труден и допускает иное членение; примечание отмечает альтернативную передачу, не подменяя ею основной текст.
lexical_decisions:
- source_word: ܒܘܟܪܝ
  choice: моего первенца
  rationale: Обычное значение формы — «мой первенец». Хотя в контексте собрания возможен смысл «первейшие, предводители», основной текст сохраняет прямое значение сирийской формы и не вносит неподтверждённых имён.
- source_word: ܥܡܘܪܝܗ
  choice: его жителей
  rationale: Передаёт буквальное значение «его жители» и сохраняет местоименную связь с упомянутым народом, несмотря на необычность перечня.
- source_word: ܩܫ̈ܝܫܝ ܪ̈ܘܪܒܢܘܗܝ
  choice: старейшин его знатных людей
  rationale: Сохраняет конструктивную связь слов и значение ܪ̈ܘܪܒܢܘܗܝ как людей высокого положения, не упрощая сложный перечень.
- source_word: ܡܟܝܟܐ
  choice: простых
  rationale: В данном общественном перечне слово обозначает людей невысокого положения. «Простых» естественнее по-русски, чем субстантивированное «низких», и не превращает социальное обозначение в оценку духовного смирения.
- source_word: ܣ̈ܒܐ ܕܥܡܐ
  choice: старейшин народа
  rationale: Прямо передаёт обозначение старших представителей народа.
theological_decisions:
- issue: Статус «первенца» в перечне призванных
  choice: моего первенца
  alternative: первейших людей / предводителей
  rationale: Сохранено наиболее прямое лексическое значение без попытки согласовать трудный текст посредством конъектуры.
- issue: Социальный или духовный смысл ܡܟܝܟܐ
  choice: простых
  alternative: смиренных
  rationale: Контраст со знатными в перечне указывает прежде всего на общественное положение; духовная характеристика здесь не навязывается.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной прозы. Необычная структура перечня сохранена настолько, насколько это допускает понятный русский синтаксис; подлинная текстовая неясность отмечена сноской.
