review_pass:
  verdict: revise
  source_fidelity: 'Основные лексические соответствия сохранены: «Варух», «ушёл оттуда», «пришёл к народу», «мой первенец», «жители», «старейшины», «знатные», «простые», «старейшины народа». Однако русская последовательность «старейшин его знатных людей и простых из старейшин народа» создаёт ложное впечатление, будто «простые» являются старейшинами народа, тогда как сирийское ܘܠܡܟܝܟܐ ܡܢ ܣ̈ܒܐ ܕܥܡܐ естественнее передать как отдельную группу: «и простых среди старейшин народа» / «и простых людей из старейшин народа».'
  naturalness: Текст в целом литературен, но «старейшин его знатных людей» звучит тяжеловесно и двусмысленно. Перестановка на «старейшин из числа его знатных людей» делает синтаксическую связь яснее, не устраняя текстологическую трудность. «Простых среди старейшин народа» сохраняет необычность оригинала, но читается по-русски яснее.
  terminology: '«Первенец» точно передаёт ܒܘܟܪܝ и оправданно снабжён примечанием. Для ܡܟܝܟܐ «простые» допустимо в социальном смысле. «Знатные люди» уместно для ܪ̈ܘܪܒܢܘܗܝ. Сноска должна соответствовать английскому аудиторскому следу: альтернативное членение — «могущественные люди народа и старейшины», без утверждения о конкретном ином чтении, поскольку в предоставленном материале засвидетельствована именно альтернативная передача/реконструкция, а не документированный вариант рукописи.'
