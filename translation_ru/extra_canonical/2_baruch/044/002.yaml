base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/044/002.yaml
  text: But you, do not withdraw from the way of the law, but guard and admonish the people who remain, lest they withdraw from the commandments of the Mighty One.
translation:
  language: ru
  text: Вы же не отступайте от пути Закона, но оберегайте и наставляйте оставшийся народ, чтобы он не отступил от заповедей Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܘܪܚܐ / ܢܡܘܣܐ (смысл, отражённый в контрольном чтении)
  choice: путь Закона
  rationale: Сохраняет образ пути и юридико-религиозный смысл Закона; прописная буква указывает на данный Богом Закон.
- source_word: ܥܡܐ ܕܐܫܬܚܪ
  choice: оставшийся народ
  rationale: Передаёт народ, который уцелел или остался после бедствия, не добавляя толкования о конкретном составе остатка.
- source_word: ܦܘܩ̈ܕܢܘܗܝ ܕܐܠܗܐ
  choice: заповеди Бога
  rationale: В предоставленном сирийском тексте непосредственно читается «его заповеди — Бога»; поэтому выбрано «Бога», а не английское титульное «Могущественного».
- source_word: ܢ̇ܛܪܘ
  choice: храните
  rationale: Сохраняет значение бережного соблюдения и охраны, естественное в контексте Закона и народа.
theological_decisions:
- issue: Обозначение Бога в заключительной фразе
  choice: Бога
  alternative: Могущественного / Всесильного
  rationale: Сирийское чтение в предоставленном фрагменте содержит ܐܠܗܐ («Бог»). Английский консультационный слой использует «the Mighty One», но исходное свидетельство здесь имеет приоритет.
- issue: Смысл повеления по отношению к оставшемуся народу
  choice: храните и наставляйте
  alternative: берегите оставшийся народ / будьте с оставшимся народом
  rationale: Формулировка следует контрольному смыслу английского слоя и передаёт двойную обязанность руководителей. При этом повреждённость и неясность строк сирийского фрагмента не позволяют уверенно свести повеление только к физической защите.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Обращение передано во множественном числе. Устаревшие формы и конфессионально окрашенная терминология не используются.
