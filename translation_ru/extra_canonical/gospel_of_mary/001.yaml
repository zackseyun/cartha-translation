translation:
  language: ru
  text: '«Тогда [материя] будет [уничтожена] или нет?»[a]


    Спаситель сказал: «Всякая природа, всякая форма и всякое творение существуют друг в друге и друг с другом, но затем снова растворятся в собственных корнях, потому что природа материи растворяется лишь в собственной природе. У кого есть уши, чтобы слышать, пусть слышит!»


    Пётр сказал ему: «Раз ты всё нам объяснил, скажи нам ещё одно: что такое грех мира?»


    Спаситель сказал: «Греха не существует, но это вы создаёте грех, когда поступаете согласно природе прелюбодеяния, которая и называется „грехом“. Поэтому Благое пришло к вам, в самую сущность всякой природы, чтобы восстановить её в её корне».[b]


    Затем он продолжил: «Вот почему вы болеете и умираете: [вы любите то, что вас обманывает. Кто] способен понять, пусть поймёт![c]


    Материя [породила] страсть, не имеющую образа, потому что она происходит из того, что противно природе. Тогда во всём теле возникает смятение. Поэтому я и сказал вам: пусть ваше сердце будет спокойно. Если же вы неспокойны, обретайте спокойствие среди разнообразных образов природы.[d] У кого есть уши, чтобы слышать, пусть слышит!»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Квадратные скобки отмечают слова, восстановленные переводчиком свидетельства в повреждённом месте рукописи. Прямую сверку с коптским и греческими фрагментами для этого проекта ещё предстоит выполнить.
    reason: Предупредить читателя о текстологической неопределённости и промежуточном характере основы перевода.
  - marker: b
    text: Выражение, переданное как «в самую сущность всякой природы», в доступном английском свидетельстве буквально и не вполне ясно звучит как «до вещей всякой природы»; перевод следует принятому по смыслу прочтению, не устраняя общей загадочности фразы.
    reason: Отметить место, где естественный русский требует осторожного смыслового упорядочения неясного текста.
  - marker: c
    text: Слова в квадратных скобках представляют редакционное восстановление утраченного или повреждённого текста.
    reason: Сохранить видимым различие между рукописным текстом и реконструкцией.
  - marker: d
    text: '«Пусть ваше сердце будет спокойно» передаёт призыв к внутренней удовлетворённости или умиротворённости; возможна более буквальная, но менее естественная передача: «будьте довольны сердцем».'
    reason: Показать семантический диапазон ключевого наставления, не выдавая выбранный русский эквивалент за единственно возможный.
lexical_decisions:
- source_word: matter
  choice: материя
  rationale: Сохраняет философско-космологический термин и не сужает его до вещества или плоти.
- source_word: nature
  choice: природа
  rationale: Последовательно передаёт повторяющийся ключевой термин, сохраняя смысловые связи и намеренную абстрактность рассуждения.
- source_word: roots / root
  choice: корни / корень
  rationale: Сохранён образ возвращения сущего к собственному происхождению, включая смену числа в свидетельстве.
- source_word: the Good
  choice: Благое
  rationale: Субстантивированное прилагательное с прописной буквы передаёт персонифицированное или высшее Благо, не отождествляя его прямо с конкретным догматическим титулом.
- source_word: adultery
  choice: прелюбодеяние
  rationale: Сохраняет резкий нравственно-религиозный термин свидетельства, не заменяя его более общим словом «неверность».
- source_word: passion
  choice: страсть
  rationale: Передаёт антропологический и нравственный оттенок термина, не сводя его к эмоции или физическому страданию.
- source_word: image
  choice: образ
  rationale: Сохраняет повторяющуюся образную и философскую лексику отрывка.
- source_word: content / contentment
  choice: спокойно / спокойствие
  rationale: Естественная современная русская передача внутреннего состояния сердца; буквальное «довольны / довольство» здесь могло бы ошибочно звучать как удовлетворённость обстоятельствами.
theological_decisions:
- issue: Утверждение «греха не существует»
  choice: 'Сохранено буквально: «Греха не существует»'
  alternative: «Грех не является самостоятельной сущностью»
  rationale: Расширенная альтернатива истолковывает онтологический смысл за читателя. Основной текст сохраняет провокационность и напряжение свидетельства.
- issue: Действие людей по отношению к греху
  choice: «это вы создаёте грех»
  alternative: «это вы совершаете грех»
  rationale: «Создаёте» сохраняет противопоставление между отсутствием греха как самостоятельной реальности и его возникновением через человеческие поступки.
- issue: Идентичность «Благого»
  choice: Сохранён самостоятельный титул «Благое»
  alternative: «Благой» или прямое отождествление со Спасителем
  rationale: Не устранена возможная философская персонификация и не внесено конфессиональное толкование.
- issue: Восстановление природы в её корне
  choice: «восстановить её в её корне»
  alternative: «возвратить её к её корню»
  rationale: Выбрана формулировка, ближе сохраняющая пространственный образ внутреннего восстановления и странность исходного свидетельства.
- issue: «Природа прелюбодеяния»
  choice: Формула сохранена без поясняющей замены
  alternative: Истолковать как космическое смешение, духовную неверность или половую распущенность
  rationale: Контекст допускает несколько уровней смысла; перевод не навязывает один из них.
translation_notes:
  register: 'Современный литературный русский с достоинством и умеренной формальностью. Повторы ключевых слов («природа», «грех», «образ») сохранены как смыслообразующие. Синтаксис местами намеренно остаётся необычным, поскольку текст философски плотен и местами повреждён. Проект предварительный: предоставленная основа — публичное английское свидетельство, а прямая проверка по коптскому тексту и греческим фрагментам ещё не завершена.'
