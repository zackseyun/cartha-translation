  terminology: Выбор «Желание», «Неведение», «плоть», «Гнев», «Спаситель» последователен и регистрово уместен. Кавычки при мнимой «мудрости» оправданно сохранены. «Победительница пространства» допустимо передаёт гендерно маркированное обращение к душе, хотя исходная формулировка остаётся неясной.
