base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_mary/004.yaml
  text: 'Desire said, “I did not see you going down, but now I see you going up. So why are you lying, since you belong to me?”


    The soul answered, “I saw you, but you did not see or know me. To you I was just a garment, and you did not recognize me.” When it said these things, it left, rejoicing greatly.


    Again, it came to the third power, called “Ignorance.” [It] questioned the soul and [said], “Where are you going? You are bound in wickedness. Since you are bound, do not judge!”


    [And] the soul said, “Why do you judge me, since I have not judged? I was bound, even though I have not bound. They did not recognize me, but I have recognized that everything will dissolve—both the things of the [earth] and the things of [heaven].”


    When the soul had overcome the third power, it went up and saw the fourth power, which took seven forms:


    The first form is Darkness;

    The second, Desire;

    The third, Ignorance;

    The fourth, Zeal for Death;

    The fifth, the Kingdom of the Flesh;

    The sixth, the Foolish “Wisdom” of Flesh;

    The seventh, the “Wisdom” of Anger.


    These are the seven powers of Wrath.


    They ask the soul, “Where do you come from, you murderer, and where are you going, conqueror of space?”


    The soul answered, “What binds me has been killed, what surrounds me has been overcome, my desire is gone, and ignorance has died. In a [world] I was released from a world, [and] in a type from a type which is above, and from the chain of forgetfulness, which exists only for a time. From now on, I will receive the rest of the time of the season of the age in silence.”


    When Mary had said these things, she fell silent, because the Savior had spoken with her up to this point.'
translation:
  language: ru
  text: 'Желание сказало: «Я не видело, как ты спускалась, но теперь вижу, как ты поднимаешься. Так почему же ты лжёшь, если принадлежишь мне?»


    Душа ответила: «Я видела тебя, но ты не видело и не знало меня. Для тебя я была лишь одеждой, и ты меня не узнало». Сказав это, душа удалилась, исполненная великой радости.


    Затем она подошла к третьей силе, именуемой Неведением. [Она][a] стала допрашивать душу и [сказала]: «Куда ты идёшь? Ты скована злом. Раз ты скована, не суди!»


    [И] душа сказала: «Почему ты судишь меня, если я не судила? Я была связана, хотя сама не связывала. Меня не узнали, но я познала, что всё распадётся — и то, что на [земле], и то, что на [небе]».


    Одолев третью силу, душа поднялась и увидела четвёртую силу, которая предстала в семи обликах:


    первый облик — Тьма;


    второй — Желание;


    третий — Неведение;


    четвёртый — Рвение к смерти;


    пятый — Царство плоти;


    шестой — Безумная «мудрость» плоти;


    седьмой — «Мудрость» гнева.


    Таковы семь сил Гнева.


    Они спрашивают душу: «Откуда ты пришла, убийца, и куда идёшь, победительница пространства?[b]»


    Душа ответила: «То, что связывало меня, убито; то, что окружало меня, побеждено; моё желание исчезло, и неведение умерло. В [мире] я была освобождена от мира, [и] в образе — от образа, который свыше, и от цепи забвения, существующей лишь некоторое время. Отныне в молчании я обрету покой оставшегося времени, поры века».[c]


    Сказав это, Мария умолкла, потому что до этого места Спаситель говорил с ней.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Квадратные скобки здесь и далее отмечают слова, восстановленные или восполненные в используемом текстовом свидетельстве.
    reason: Сохраняет видимым различие между засвидетельствованным и редакционно восстановленным текстом.
  - marker: b
    text: Обращения «убийца» и «победительница пространства» переданы буквально; их точный смысл в этом месте неясен.
    reason: Предупреждает о подлинной смысловой трудности, не устраняя её толкованием.
  - marker: c
    text: Заключительная фраза души синтаксически и смыслово трудна. Перевод сохраняет последовательность образов используемого свидетельства; возможны иные понимания выражений об «образе», «времени», «поре» и «веке».
    reason: Фиксирует неопределённость трудного места и не создаёт ложной ясности.
lexical_decisions:
- source_word: Desire
  choice: Желание
  rationale: Персонифицированное абстрактное существительное передано с прописной буквы; средний род последовательно сохранён в согласовании.
- source_word: Ignorance
  choice: Неведение
  rationale: «Неведение» звучит достоинственно и обозначает не просто недостаток сведений, а состояние непознания; как имя силы пишется с прописной буквы.
- source_word: power
  choice: сила
  rationale: Нейтральная передача, не уточняющая природу этих сущностей и не привносящая специальной ангелологии или демонологии.
- source_word: Zeal for Death
  choice: Рвение к смерти
  rationale: Сохранена необычная направленность выражения без истолкования как «жажды смерти».
- source_word: Kingdom of the Flesh
  choice: Царство плоти
  rationale: Сохраняет ключевой образ владычества и богословски нагруженное слово «плоть».
- source_word: Foolish “Wisdom” of Flesh
  choice: Безумная «мудрость» плоти
  rationale: Кавычки сохраняют ироническое отрицание подлинной мудрости; «безумная» естественнее в данном перечне, чем буквальное «глупая».
- source_word: Wrath
  choice: Гнев
  rationale: Персонифицированное собирательное имя передано с прописной буквы, не отождествляя его с человеческой эмоцией в обычном смысле.
- source_word: garment
  choice: одежда
  rationale: Сохранён образ внешнего покрова без пояснения его возможного антропологического смысла.
- source_word: space
  choice: пространство
  rationale: Буквальная передача сохраняет космологическую широту и не сужает смысл до конкретного места.
- source_word: age
  choice: век
  rationale: Традиционное и достаточно широкое соответствие, способное обозначать как эпоху, так и мировой век.
theological_decisions:
- issue: Статус и природа «сил»
  choice: Названия переданы как персонифицированные силы с прописной буквы, без дальнейшей идентификации.
  alternative: Назвать их демонами, страстями или космическими властями.
  rationale: Свидетельство оставляет их онтологический статус не вполне определённым; конфессиональное или систематическое уточнение было бы привнесением.
- issue: Связь души с одеждой
  choice: Сохранена формула «для тебя я была лишь одеждой».
  alternative: Истолковать одежду как тело или материальную оболочку.
  rationale: Перевод не должен заранее разрешать антропологическую метафору.
- issue: Освобождение «от мира» и «от образа»
  choice: Сохранены повтор и параллелизм трудного высказывания.
  alternative: Перефразировать как освобождение души от материального мира и высших форм.
  rationale: Такое пояснение навязало бы определённую космологию там, где текст неясен.
- issue: «Не судила» и «не связывала»
  choice: Сохранено различие двух глаголов и пассивно-активная напряжённость.
  alternative: Сгладить до общего заявления о невиновности.
  rationale: Необычная логика ответа может быть значима и не должна устраняться.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего религиозно-философского диалога. Короткие реплики оставлены прямыми и напряжёнными; перечень оформлен ритмически. Архаизмы сведены к минимуму, но термины «плоть», «век» и «Спаситель» сохранены как естественные для жанра. Проект остаётся предварительным, поскольку предоставленная основа — английское публичное свидетельство, а непосредственная сверка с коптским и греческими фрагментами ещё не выполнена.
