base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_mary/002.yaml
  text: 'When the Blessed One had said these things, he greeted them all and said, “Peace be with you! Acquire my peace. Be careful not to let anyone mislead you by saying, ‘Look over here!’ or ‘Look over there!’ For the Son of Humanity exists within you. Follow him! Those who seek him will find him.


    “Go, then, and preach the gospel about the kingdom. Do not lay down any rules beyond what I have given you, nor make a law like the lawgiver, or you may be bound by it.” When he had said these things, he left.


    But they grieved and wept bitterly. They said, “How can we go up to the Gentiles to preach the gospel about the kingdom of the Son of Humanity? If they did not spare him, why would they spare us?”'
translation:
  language: ru
  text: 'Сказав это, Благословенный приветствовал их всех и сказал: «Мир вам! Обретите мой мир. Смотрите, чтобы никто не ввёл вас в заблуждение, говоря: „Вот, здесь!“ или „Вот, там!“ — ведь Сын Человеческий внутри вас. Следуйте за ним! Кто ищет его, тот найдёт его.


    Итак, идите и возвещайте благую весть о Царстве. Не устанавливайте никаких предписаний сверх того, что я дал вам, и не издавайте закона, подобно законодателю, чтобы не оказаться связанными им».[a] Сказав это, он ушёл.


    Они же скорбели и горько плакали. Они говорили: «Как нам идти к язычникам и возвещать благую весть о Царстве Сына Человеческого?[b] Если они не пощадили его, то почему пощадят нас?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Перевод этого места предварительный. Формулировки о предписаниях, законодателе и связанности нуждаются в прямой сверке с сохранившимся коптским текстом и греческими фрагментами.
    reason: Предоставленная основа — английское свидетельство, а проверка по древним языкам ещё не выполнена.
  - marker: b
    text: Возможны различия в синтаксическом членении выражения «благая весть о Царстве Сына Человеческого»; здесь сохранено чтение предоставленного английского свидетельства.
    reason: Необходимо честно обозначить текстовую и синтаксическую предварительность без молчаливого разрешения неоднозначности.
lexical_decisions:
- source_word: the Blessed One
  choice: Благословенный
  rationale: Сохранён титульный характер выражения без уточнения личности или богословского статуса.
- source_word: Peace be with you! Acquire my peace.
  choice: Мир вам! Обретите мой мир.
  rationale: «Обретите» передаёт активный оттенок acquire и сохраняет необычность формулировки, не сводя её к простому пожеланию.
- source_word: Son of Humanity
  choice: Сын Человеческий
  rationale: Устойчивое и узнаваемое русское выражение, соответствующее традиционному антропологическому титулу; не заменено конфессионально окрашенным толкованием.
- source_word: exists within you
  choice: внутри вас
  rationale: Сохранено пространственно-антропологическое звучание английского свидетельства и возможная неоднозначность между внутренним присутствием и пребыванием среди сообщества.
- source_word: preach the gospel
  choice: возвещайте благую весть
  rationale: Естественная современная передача смысла без утраты связи с понятием Евангелия.
- source_word: Gentiles
  choice: язычникам
  rationale: Общеупотребительный библейский эквивалент, обозначающий нееврейские народы в данном контексте.
theological_decisions:
- issue: Местонахождение Сына Человеческого
  choice: «внутри вас»
  alternative: «среди вас»
  rationale: Основной текст следует предоставленному свидетельству within, но не превращает эту фразу в развёрнутое учение о природе человека.
- issue: Связь слова «Царство» с выражением «Сын Человеческий» в вопросе учеников
  choice: «о Царстве Сына Человеческого»
  alternative: «о Царстве» с пониманием последующих слов как отдельного оборота
  rationale: Сохранён синтаксис предоставленного свидетельства; из-за возможности иной пунктуации или реконструкции отмечена необходимость сверки с коптским и греческим материалом.
- issue: Предостережение о законе
  choice: «чтобы не оказаться связанными им»
  alternative: «иначе вы будете им скованы/ограничены»
  rationale: Передана метафора связанности без догматического вывода о Законе вообще; речь остаётся предостережением против дополнительных предписаний.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; сохранены краткие повелительные фразы и эмоциональный переход к скорби учеников. Проект предварительный, поскольку выполнен по общедоступному английскому свидетельству; обязательна последующая проверка по коптскому тексту Papyrus Berolinensis 8502,1 и сохранившимся греческим фрагментам.
