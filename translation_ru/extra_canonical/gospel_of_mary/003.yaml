translation:
  language: ru
  text: 'Тогда Мария встала и приветствовала их всех. Она сказала своим братьям и сёстрам[a]: «Не плачьте, не скорбите и не допускайте разделения в ваших сердцах, потому что его благодать будет со всеми вами и защитит вас. Лучше будем прославлять его величие, ведь он подготовил нас и сделал нас Людьми[b]».


    Сказав это, Мария обратила их сердца [к] Благу[c], и они [начали] обсуждать слова [Спасителя].


    Пётр сказал Марии: «Сестра, мы знаем, что Спаситель любил тебя больше всех других женщин. Расскажи нам слова Спасителя, которые ты помнишь, — то, что знаешь ты, но не знаем и не слышали мы».


    Мария ответила: «Я расскажу вам то, что от вас скрыто». И она начала говорить им: «Я, — сказала она, — увидела Господа в видении и сказала ему: „Господи, сегодня я увидела тебя в видении“.


    Он ответил мне: „Блаженна ты, потому что не поколебалась при виде меня. Ибо где ум, там и сокровище“.


    Я сказала ему: „Господи, тот, кто видит видение, видит его в душе или в духе?“


    Спаситель ответил: „Он видит не в душе и не в духе; но ум, находящийся между ними, — вот что видит видение, и именно он…[d]“


    Страницы 11–14 отсутствуют.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в представленном английском свидетельстве: «братьям (и сёстрам)». Уточнение в скобках показывает, что обращение понимается как включающее всю общину.'
    reason: Объяснить включающий перевод и не скрывать форму доступного свидетеля.
  - marker: b
    text: '«Людьми» может иметь здесь особый смысл: людьми, достигшими предназначенной им полноты. Точное значение термина остаётся неясным.'
    reason: Сохранить возможную техническую антропологическую окраску без догматического уточнения.
  - marker: c
    text: Слова в квадратных скобках восстановлены или добавлены переводчиком там, где текст повреждён либо подразумевает недостающее слово.
    reason: Разъяснить редакционные сигналы рукописной сохранности.
  - marker: d
    text: На этом месте предложение обрывается из-за утраты следующих страниц рукописи.
    reason: Показать, что незавершённость принадлежит состоянию текста, а не авторской конструкции.
  - marker: e
    text: В рукописи Papyrus Berolinensis 8502,1 утрачены страницы 11–14.
    reason: Зафиксировать крупную физическую лакуну перед продолжением произведения.
lexical_decisions:
- source_word: brothers (and sisters)
  choice: братьям и сёстрам
  rationale: В данном обращении группа, вероятно, включает последователей обоих полов; явное парное обозначение передаёт смысл английского свидетеля без тяжеловесных скобок в основном тексте.
- source_word: Humans
  choice: Людьми
  rationale: Прописная буква сохранена как сигнал особого, вероятно антропологического значения; формулировка не сводится к «настоящим людьми» или «совершенными людьми», чтобы не навязывать толкование.
- source_word: the Good
  choice: Благу
  rationale: Субстантивированное «Благо» сохраняет абстрактное или титульное значение и не превращает выражение в наречие «к добру».
- source_word: mind
  choice: ум
  rationale: «Ум» естественно передаёт мыслительную способность и сохраняет его отличие от «души» и «духа»; более техническое «разум» могло бы чрезмерно рационализировать термин.
- source_word: vision
  choice: видение
  rationale: Последовательно передаёт и событие откровения, и воспринимаемый образ, не уточняя его природу.
theological_decisions:
- issue: Смысл утверждения «сделал нас Humans»
  choice: «сделал нас Людьми» с прописной буквы и сноской
  alternative: «сделал нас настоящими/совершенными людьми»
  rationale: Источник допускает особое антропологическое значение, но не даёт основания уточнять его богословское содержание.
- issue: Отношение ума к душе и духу
  choice: сохранить трёхчленное различение и пространственную метафору «между ними»
  alternative: истолковать ум как часть души либо как посредника между душой и духом
  rationale: Высказывание намеренно сохраняет напряжение между тремя понятиями; перевод не должен разрешать его согласно позднейшей антропологической системе.
- issue: Место сокровища
  choice: «где ум, там и сокровище»
  alternative: «где твой ум, там твоё сокровище»
  rationale: Притяжательные местоимения не добавлены, поскольку в представленном свидетельстве они отсутствуют и могли бы сузить общий афористический смысл.
- issue: Грамматический субъект в описании видения
  choice: нейтральное обобщённое «тот, кто… / он»
  alternative: множественное безличное «видят»
  rationale: Русская формулировка сохраняет общий смысл вопроса и ответа, не приписывая способность видеть исключительно Марии.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского диалога. Речь сделана ясной для широкого читателя, но ключевые термины «благодать», «Благо», «душа», «дух», «ум», «видение» сохранены раздельно. Квадратные скобки и многоточие используются как текстологические сигналы. Проект остаётся предварительным, поскольку прямое сопоставление с коптским и греческими фрагментами ещё не выполнено.
