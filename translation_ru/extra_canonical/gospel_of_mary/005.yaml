  verdict: revise
  source_fidelity: В целом передача содержания точна и бережно сохраняет спор об авторитете Марии, включая прямое утверждение Левия о предпочтении Спасителем Марии. Однако «повернуться» не передаёт в русском риторический смысл английского turn around, а «ходить» в заключении искажает значение «выйти/отправиться». Формулировку вопроса Петра следует также сделать менее двусмысленной, не превращая два признака речи в противопоставление.
  naturalness: Современный литературный регистр в целом выдержан. Исправлены неестественные «повернуться и слушать её» и «начали ходить, учить». «Совершенная человечность» оставлена как намеренно осторожная, несколько необычная формулировка, поскольку свидетельство и его капитализация допускают несколько пониманий; это объяснено в сноске.
  terminology: '«Спаситель», «Евангелие» и «благая весть» употреблены последовательно. «Противники» не конкретизируются. Неоднозначное perfect Humanity не догматизируется: основной текст выбирает абстрактное прочтение, а сноска отмечает варианты «совершенный Человек/человек».'
  issues:
  - severity: medium
    issue: «Неужели теперь мы все должны повернуться и слушать её?»
    rationale: 'Русское «повернуться» обычно означает физически развернуться и здесь звучит немотивированно. Английское идиоматическое turn around в контексте выражает вывод/смену позиции: «Неужели теперь нам всем слушать её?».'
  - severity: medium
    issue: «без нашего ведома, а не открыто, при нас»
    rationale: Союз «а не» создаёт в русском ложное противопоставление. Свидетельство перечисляет подозрение в непубличной речи и отсутствии общинного знания; это лучше передать как «тайно, без нашего ведома, а не открыто при нас».
  - severity: medium
    issue: «они начали ходить, учить и возвещать благую весть»
    rationale: Go out означает выйти/отправиться, а не регулярно ходить. В русском нужно «они отправились учить и возвещать благую весть».
  - severity: low
    issue: «Лучше нам устыдиться»
    rationale: В оригинальном свидетельстве Instead вводит контраст с отвержением Марии, а не сравнительную рекомендацию. «Напротив, нам следует устыдиться» точнее сохраняет ход аргумента.
