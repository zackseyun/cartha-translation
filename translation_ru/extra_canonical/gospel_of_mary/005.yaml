  yaml_path: translation/extra_canonical/gospel_of_mary/005.yaml
  text: 'Andrew replied to the brothers (and sisters), “Say what you will about what she has said. I myself do not believe that the Savior said these things, because these teachings seem like different ideas.”


    Peter responded with the same concerns. He asked them about the Savior: “He did not speak with a woman without our knowledge and not openly with us, did he? Are we now to turn around and all listen to her? Did he prefer her to us?”


    Then Mary wept and said to Peter, “My brother Peter, what are you thinking? Do you really think that I made this up by myself in my heart, or that I am lying about the Savior?”


    Levi replied to Peter, “Peter, you have always been angry. Now I see you arguing with this woman like the adversaries. But if the Savior made her worthy, who are you to reject her? Surely the Savior knows her very well. That is why he loved her more than us.


    “Instead, we should be ashamed, clothe ourselves with perfect Humanity, acquire it for ourselves as he instructed us, and preach the gospel, without laying down any other rule or law beyond what the Savior said.”


    When [Levi said these things], they began to go out to teach and to preach.


    The Gospel

    According to

    Mary'
translation:
  language: ru
  text: 'Андрей ответил братьям и сёстрам[a]: «Говорите о её словах что хотите, но лично я не верю, что Спаситель говорил такое, потому что эти учения кажутся чуждыми».


    Пётр высказал те же сомнения. Он спросил их о Спасителе: «Неужели Он говорил с женщиной без нашего ведома, а не открыто, при нас? Неужели теперь мы все должны повернуться и слушать её? Разве Он предпочёл её нам?»


    Тогда Мария заплакала и сказала Петру: «Брат мой Пётр, о чём ты думаешь? Неужели ты и вправду считаешь, что я сама придумала это в своём сердце или что я лгу о Спасителе?»


    Левий ответил Петру: «Пётр, ты всегда был гневлив. И теперь я вижу, что ты споришь с этой женщиной, уподобляясь противникам. Но если Спаситель счёл её достойной, то кто ты такой, чтобы отвергать её? Несомненно, Спаситель очень хорошо её знает. Потому Он и любил её больше, чем нас.


    Лучше нам устыдиться, облечься в совершенную человечность[b], обрести её для себя, как Он нам велел, и возвещать благую весть, не устанавливая никаких иных правил или законов сверх того, что сказал Спаситель».


    Когда [Левий сказал это][c], они начали ходить, учить и возвещать благую весть.


    Евангелие


    от


    Марии'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально или по форме обращения возможно также: «братьям»; в таком употреблении слово могло охватывать всю общину, включая женщин.'
    reason: Предоставленное английское свидетельство добавляет «and sisters» в круглых скобках, поэтому степень явности женского включения в древнем тексте требует оговорки.
  - marker: b
    text: 'Возможный перевод: «в совершенного Человека» или «в совершенного человека». Без прямой сверки коптского и греческих фрагментов неясно, обозначает ли выражение качество совершенной человечности, идеального человека или персонифицированную реальность.'
    reason: Свидетельство пишет Humanity с прописной буквы, однако такая капитализация уже содержит элемент толкования.
  - marker: c
    text: Слова в квадратных скобках восстановлены там, где рукописный текст повреждён или утрачен.
    reason: Сохраняет сигнал текстуальной реконструкции, присутствующий в предоставленном свидетельстве.
lexical_decisions:
- source_word: brothers (and sisters)
  choice: братьям и сёстрам
  rationale: Передаёт явно инклюзивное понимание, отражённое в предоставленном свидетельстве; неопределённость отмечена в сноске.
- source_word: different ideas
  choice: чуждыми
  rationale: В контексте речь не просто об отличии, а о подозрении Андрея, что учение не соответствует словам Спасителя; «чуждыми» естественно выражает это без уточнения, чему именно они чужды.
- source_word: adversaries
  choice: противникам
  rationale: Сохраняет общее обозначение оппонентов и не отождествляет их с какой-либо конкретной группой или сверхъестественным Противником.
- source_word: perfect Humanity
  choice: совершенную человечность
  rationale: Сохраняет абстрактный смысл качества или состояния человеческой полноты и согласуется с последующим местоимением «её»; возможное личностное прочтение отмечено в сноске.
- source_word: gospel
  choice: благую весть
  rationale: В повествовательной части передаёт значение провозглашаемой вести; в заглавии употреблено традиционное «Евангелие».
theological_decisions:
- issue: Утверждение о том, что Спаситель любил Марию больше остальных
  choice: Потому Он и любил её больше, чем нас
  alternative: Потому Он ценил её выше нас
  rationale: Сохранено прямое и богословски напряжённое утверждение свидетельства без смягчения или истолкования природы этой любви.
- issue: Совершенная человечность / совершенный Человек
  choice: облечься в совершенную человечность
  alternative: облечься в совершенного Человека
  rationale: Основной текст сохраняет абстрактное прочтение предоставленного английского свидетельства, тогда как сноска открыто фиксирует возможное конкретное или персонифицированное понимание.
- issue: Авторитет частного откровения Марии
  choice: Сохранён спор в форме вопросов и взаимных обвинений
  alternative: Пояснить, кто из участников прав
  rationale: Текст сам противопоставляет сомнение Петра и Андрея защите Марии Левием; перевод не разрешает этот конфликт от имени читателя.
translation_notes:
  register: 'Современный литературный русский язык с достойным, но не архаизированным звучанием. Реплики переданы естественно и прямо; традиционные церковные слова сохранены лишь там, где они общеупотребительны («Спаситель», «Евангелие»). Проект предварительный: он основан на предоставленном англоязычном свидетельстве Papyrus Berolinensis 8502,1; прямая сверка с коптским текстом и греческими фрагментами ещё требуется.'
