    Левий ответил Петру: «Пётр, ты всегда был гневлив. И теперь я вижу, что ты споришь с этой женщиной, подобно противникам. Но если Спаситель счёл её достойной, то кто ты такой, чтобы отвергать её? Несомненно, Спаситель очень хорошо её знает. Потому Он и любил её больше, чем нас.


