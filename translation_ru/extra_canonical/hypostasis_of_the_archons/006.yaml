review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод следует предоставленному английскому свидетелю и корректно сохраняет важные неопределённости: «познал», восстановленные слова в квадратных скобках, неназванный субъект «Он», а также отсутствие прямого сообщения об убийстве Авеля. Однако «семикратное возмездие» сглаживает множественное «seven revenges», а добавочное «стал» в описании преследования не выражено в свидетеле.'
  naturalness: Текст в основном литературен и выдержан в умеренно библейском регистре. «Женская пара» по-русски звучит неестественно и непонятно вне специального контекста; «женская половина» естественнее и всё же сохраняет необычное обозначение Евы. Для характеристики Каина более обычна и терминологически точна форма «плотской», а не «плотский».
  terminology: «Плотской», «силы», «познал», «сторож брату моему» удачно поддерживают библейско-религиозный регистр без конфессионального истолкования. «Женская половина» передаёт female counterpart лучше, чем «женская пара». Пустые квадратные скобки свидетеля должны оставаться отмеченными с ясной сноской.
  issues:
  - severity: medium
    issue: «Плотский Каин»
    rationale: Для религиозно-литературного употребления и соответствия эпитету fleshly предпочтительна форма «плотской Каин»; «плотский» здесь стилистически менее естественен.
  - severity: medium
    issue: «стал преследовать»
    rationale: Свидетель сообщает лишь «pursued»; глагол «стал» добавляет значение начала действия, отсутствующее в исходной формулировке.
  - severity: medium
    issue: «семикратное возмездие»
    rationale: Формулировка преобразует множественное «seven revenges» в единственное абстрактное возмездие. «Семь возмездий» ближе к свидетельству и сохраняет его странную, неуточнённую формулу.
  - severity: medium
    issue: «женская пара»
    rationale: Выражение не является естественным современным литературным русским. «Женская половина» ясно передаёт обозначение Евы как соответствующей Адаму женщины, не сводя его просто к «жене».
  revised_text: 'Затем Ева родила их сына Каина, и Каин стал возделывать землю. После этого Адам познал свою жену. Она снова забеременела и родила Авеля, а Авель был пастухом. Каин принёс урожай со своего поля, а Авель — приношение из своих ягнят. Бог благосклонно посмотрел на приношение Авеля, но приношений Каина не принял.


    Плотской Каин преследовал своего брата Авеля.


    Бог сказал Каину:


    — Где Авель, брат твой?


    Каин ответил:


    — Разве я сторож брату моему?


    Бог сказал Каину:


    — Слушай! Голос крови твоего брата взывает ко Мне. Ты согрешил устами. Это вернётся к тебе. Кто убьёт Каина, навлечёт семь возмездий, а ты будешь жить на земле, стеная и дрожа.


    Адам снова [познал] свою женскую половину, Еву. Она забеременела и родила Адаму [Сифа]. Она сказала:


    — Через Бога я родила [другого] человека взамен [Авеля].


