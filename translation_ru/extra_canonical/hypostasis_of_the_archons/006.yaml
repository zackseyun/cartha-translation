  revision_rationale: Исправлены стилистически неудачная характеристика «плотский», добавленное значение начала действия в «стал преследовать», сглаживание множественного числа в «семикратном возмездии» и неестественная калька «женская пара». «Через Бога» ближе к буквально сохранённому through God и не определяет характер божественного участия. Все скобочные восстановления, неопределённый субъект «Он» и неясное «Это» сохранены.
