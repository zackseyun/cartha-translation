  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/006.yaml
  text: 'Next, Eve gave birth to their son Cain, and Cain cultivated the land. Then Adam knew his wife. She became pregnant again and gave birth to Abel, and Abel was a shepherd. Cain brought crops from his field, while Abel brought an offering from among his lambs. God looked favorably on Abel’s offering, but he did not accept Cain’s offerings.


    The fleshly Cain pursued his brother Abel.


    God said to Cain, “Where is your brother Abel?”


    Cain answered, “Am I my brother’s keeper?”


    God said to Cain, “Listen! The voice of your brother’s blood cries out to me. You have sinned with your mouth. It will return to you. Whoever kills Cain will unleash seven acts of revenge, and you will live moaning and trembling on the earth.”


    Adam once again [knew] his female counterpart Eve, and she became pregnant and bore [Seth] to Adam. She said, “I have given birth to [another] man through God, to replace [Abel].”


    Eve became pregnant again and gave birth to [Norea]. Eve said, “He has begotten a virgin for me to help many generations of humans.” [] She is the virgin whom the forces did not defile.


    And humanity began to multiply and progress.'
translation:
  language: ru
  text: 'Затем Ева родила их сына Каина, и Каин стал возделывать землю. После этого Адам познал свою жену. Она снова забеременела и родила Авеля, а Авель стал пастухом. Каин принёс урожай со своего поля, а Авель — жертву из своих ягнят. Бог благосклонно посмотрел на жертву Авеля, но приношений Каина не принял.


    Плотский Каин стал преследовать своего брата Авеля.


    Бог сказал Каину:


    — Где Авель, брат твой?


    Каин ответил:


    — Разве я сторож брату моему?


    Бог сказал Каину:


    — Слушай! Голос крови твоего брата взывает ко Мне. Ты согрешил своими устами. Это вернётся к тебе. Кто убьёт Каина, навлечёт семикратное возмездие, а ты будешь жить на земле, стеная и дрожа.


    Адам снова [познал] свою женскую пару, Еву. Она забеременела и родила Адаму [Сифа]. Она сказала:


    — При помощи Бога я родила [другого] человека взамен [Авеля].


    Ева снова забеременела и родила [Норею]. Ева сказала:


    — Он породил для меня деву, чтобы она помогла многим поколениям людей.[a]


    Она и есть та дева, которую силы не осквернили.


    И человечество стало умножаться и развиваться.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В предоставленном английском свидетеле после этих слов стоит пустая пара квадратных скобок, вероятно обозначающая лакуну или место невосстановленного текста.
    reason: Фиксирует текстологический сигнал свидетеля, не вводя неподтверждённого восстановления.
lexical_decisions:
- source_word: knew
  choice: познал
  rationale: Сохранён библейский эвфемизм, обозначающий супружескую близость, без его разъяснения в основном тексте.
- source_word: fleshly Cain
  choice: плотский Каин
  rationale: Необычный эпитет сохранён как значимая характеристика персонажа; варианты «телесный» и «земной» сильнее истолковывали бы выражение.
- source_word: female counterpart
  choice: женская пара
  rationale: Передаёт идею соответствующей Адаму женщины и не сводит выражение просто к слову «жена», которое уже употреблено выше.
- source_word: keeper
  choice: сторож
  rationale: Узнаваемая и естественная русская формулировка библейского вопроса, сохраняющая практический смысл обязанности охранять брата.
- source_word: seven revenges
  choice: семикратное возмездие
  rationale: Передаёт усиленное семью воздаяние без уточнения его исполнителя и механизма.
- source_word: forces
  choice: силы
  rationale: Сохраняет нейтральное обозначение сверхчеловеческих сил и не подменяет его более интерпретирующим термином «архонты».
- source_word: progress
  choice: развиваться
  rationale: Современная естественная передача общего движения вперёд; не уточняет, было ли развитие духовным, общественным или численным.
theological_decisions:
- issue: Неясный субъект слов «Он породил»
  choice: Сохранено местоимение «Он» без названного референта
  alternative: «Бог породил для меня деву»
  rationale: Свидетель не называет субъект непосредственно, поэтому перевод не отождествляет его с Богом безоговорочно.
- issue: Средство или участие Бога в рождении Сифа
  choice: «При помощи Бога»
  alternative: «от Бога» или «Богом»
  rationale: Формулировка сохраняет инструментальный оттенок supplied witness и не делает более сильного утверждения о непосредственном божественном отцовстве.
- issue: Возвращающееся последствие греха
  choice: «Это вернётся к тебе»
  alternative: «Твой грех обратится против тебя»
  rationale: 'Неопределённое местоимение сохраняет неясность того, что именно возвращается к Каину: грех, сказанное устами или воздаяние.'
- issue: Судьба Авеля при преследовании
  choice: «стал преследовать» без добавления сообщения об убийстве
  alternative: «напал на него и убил»
  rationale: Перевод не восполняет отсутствующее в данном свидетеле прямое описание убийства из канонического рассказа.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейской торжественностью в прямой речи. Квадратные скобки вокруг слов сохранены как указания на восстановленный или повреждённый текст. Черновик предварительный: он подготовлен по предоставленному англоязычному публичному свидетелю; непосредственная сверка с коптским текстом Nag Hammadi Codex II,4 ещё требуется.'
