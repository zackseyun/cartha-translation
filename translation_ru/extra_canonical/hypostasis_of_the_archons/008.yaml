base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/008.yaml
  text: 'The archons went to meet her, plotting to deceive her. Their leader said to her, “Your mother, Eve, came to us.” But Norea turned to them and said, “You are the archons of darkness. Cursed are you! You did not know my mother. Instead, you knew your own female counterpart, because I am not your offspring. I come from the world above.”


    In his might, the arrogant archon turned, and his face became like a flaming [inferno]. He acted presumptuously toward her and [said], “You must serve us sexually, as your mother Eve did, because [. . .] has been delegated to me.”


    But Norea, in the power of [God], turned and cried out in a loud voice to the Holy One, the God of the All: [] “Rescue me from the archons of injustice, and save me immediately from their hands!” [4]


    An angel descended from heaven and said to her, “Why do you call upon God? Why are you so presumptuous toward the holy Spirit?”


    Norea asked, “Who are you?”


    Meanwhile, the archons of injustice had withdrawn from her.'
translation:
  language: ru
  text: 'Архонты вышли ей навстречу, замышляя обмануть её. Их предводитель сказал ей: «Твоя мать Ева пришла к нам». Но Норея повернулась к ним и сказала: «Вы — архонты тьмы. Будьте прокляты! Вы не познали моей матери, но познали собственное женское подобие. Я не ваше потомство: я пришла из мира вышнего».


    Тогда надменный архонт во всей своей силе повернулся, и лицо его стало подобно пылающему [пеклу][a]. Он дерзко приступил к ней и [сказал]: «Ты должна служить нам своим телом, как служила твоя мать Ева, потому что мне вверено [. . .][b]».


    Но Норея, укреплённая силой [Бога][c], повернулась и громко воззвала к Святому, Богу Всего: «Избавь меня от архонтов неправды и тотчас спаси меня из их рук!»


    С небес сошёл ангел и сказал ей: «Почему ты призываешь Бога? Почему ты так дерзновенно обращаешься к святому Духу?[d]»


    Норея спросила: «Кто ты?»


    Тем временем архонты неправды отступили от неё.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «пеклу» передаёт восстановленный фрагмент; квадратные скобки отмечают редакционное восполнение повреждённого текста.
    reason: Сохранить видимый сигнал текстуальной неуверенности.
  - marker: b
    text: В этом месте рукопись повреждена; содержание пропуска восстановить по представленному свидетельству невозможно.
    reason: Обозначить лакуну и не домысливать основание притязания архонта.
  - marker: c
    text: Слово «Бога» восстановлено издателями в повреждённом месте.
    reason: Сохранить отличие восстановленного чтения от сохранившегося текста.
  - marker: d
    text: Фраза может выражать упрёк в дерзости либо удивление дерзновенной смелостью Нореи; перевод намеренно не устраняет эту неоднозначность.
    reason: Сохранить богословское и повествовательное напряжение реплики.
lexical_decisions:
- source_word: archons
  choice: архонты
  rationale: Сохранён традиционный термин, обозначающий космических властителей в данном сочинении; замена на «правители» стёрла бы его специфический смысл.
- source_word: knew
  choice: познали
  rationale: Глагол сохраняет возможный двойной смысл знания и половой близости, важный для контекста.
- source_word: female counterpart
  choice: женское подобие
  rationale: Формулировка передаёт соотнесённость женской фигуры с самими архонтами, не уточняя её природу сверх свидетельства.
- source_word: world above
  choice: мир вышний
  rationale: Достоинная и понятная формула, передающая пространственно-космологическое противопоставление высшего мира нижнему.
- source_word: render us sexual services
  choice: служить нам своим телом
  rationale: Естественная русская формулировка ясно передаёт сексуальное принуждение, не прибегая к канцеляризму «оказывать сексуальные услуги».
- source_word: God of the All
  choice: Бог Всего
  rationale: Сохранён космологический титул и его неоднозначность; не заменено истолковывающим «Бог всего сущего».
- source_word: archons of injustice
  choice: архонты неправды
  rationale: «Неправда» охватывает неправедность, несправедливость и ложь, не сужая выражение до юридической несправедливости.
- source_word: presumptuous
  choice: дерзко / дерзновенно
  rationale: 'Контекст требует разных русских оттенков: в действиях архонта — наглая дерзость, в обращении Нореи к Духу — необычайная смелость, смысл которой остаётся напряжённым и не до конца ясным.'
theological_decisions:
- issue: Личность «женского подобия» архонтов
  choice: Не отождествлять её с Евой и не давать ей специального имени
  alternative: Передать как «вашу собственную женщину» или назвать конкретную мифологическую фигуру
  rationale: Свидетельство говорит о соответствующей им женской фигуре, но предложенный материал не позволяет надёжно уточнить её идентичность.
- issue: Происхождение Нореи
  choice: «Я пришла из мира вышнего»
  alternative: «Я принадлежу высшему миру»
  rationale: Сохранено утверждение о происхождении/приходе, а не заменено более статичным утверждением о принадлежности.
- issue: Неожиданный вопрос ангела о дерзновении перед святым Духом
  choice: Сохранить вопрос без гармонизации и без изменения его оценочного напряжения
  alternative: Истолковать реплику как похвалу смелости Нореи или как её порицание
  rationale: Текст допускает напряжение и не объясняет сразу, положительно или отрицательно оценивается её дерзновение.
- issue: Регистр слова Spirit
  choice: «святому Духу»
  alternative: «святому духу»
  rationale: Заглавная буква уместна в русском религиозном регистре при обозначении божественного Духа, но формулировка не вносит позднейших догматических уточнений.
translation_notes:
  register: Современный литературный русский с достоинством религиозно-апокрифического повествования. Термин «архонты» сохранён без упрощения. Синтаксис сделан естественным для современного читателя, при этом квадратные скобки и лакуна сохранены. Поскольку прямое изучение коптского источника ещё предстоит, проект остаётся предварительным и основан на предоставленном англоязычном публичном свидетельстве.
