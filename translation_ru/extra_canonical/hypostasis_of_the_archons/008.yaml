review_pass:
  verdict: revise
  source_fidelity: Черновик в целом следует предоставленному английскому свидетельству и сохраняет скобки и лакуну. Однако причинная связь в реплике Нореи («because I am not your offspring») в русском тексте ослаблена, а «in the power of [God]» передано интерпретирующе как «укреплённая силой». «Служить нам своим телом» также заметно смягчает прямое указание на требуемые сексуальные услуги.
  naturalness: 'Регистр в целом современный литературный и уместно возвышенный. Уточнены несколько формулировок для естественности без эвфемистического затушёвывания насилия: «дерзко обошёлся с нею» и «оказать нам сексуальные услуги».'
  terminology: «Архонты», «Норея», «Бог Всего» и «святой Дух» сохранены. «Архонты неправды» заменены на более близкое к witness «архонты несправедливости». «Женская пара» передаёт female counterpart без отождествления фигуры с Евой или иной конкретной персонажностью.
  issues:
  - severity: medium
    issue: Утрачена явная причинная связь в словах Нореи.
    rationale: В свидетельстве «because I am not your offspring» объясняет предыдущее утверждение; в черновике фраза разделена на самостоятельное «Я не ваше потомство».
  - severity: medium
    issue: «Укреплённая силой [Бога]» добавляет смысл укрепления.
    rationale: Witness говорит, что Норея обратилась/повернулась «in the power of [God]», но не утверждает, что она была укреплена.
  - severity: medium
    issue: Формула «служить нам своим телом» эвфемистически и менее точно передаёт sexual services.
    rationale: Требование архонта является прямым сексуальным принуждением; нейтральное «оказать нам сексуальные услуги» точнее отражает свидетельство, не добавляя деталей.
  - severity: low
    issue: «Архонты неправды» сужает injustice до лжи/неистины.
    rationale: «Архонты несправедливости» ближе к предоставленному тексту и сохраняет отвлечённо-космологический характер выражения.
  revised_text: 'Архонты вышли ей навстречу, замышляя обмануть её. Их предводитель сказал ей: «Твоя мать, Ева, пришла к нам». Но Норея повернулась к ним и сказала: «Вы — архонты тьмы. Будьте прокляты! Вы не познали моей матери, а познали собственную женскую пару, ибо я не ваше потомство: я пришла из мира вышнего».


    Тогда надменный архонт во всей своей силе повернулся, и лицо его стало подобно пылающему [пеклу][a]. Он дерзко обошёлся с нею и [сказал]: «Ты должна оказать нам сексуальные услуги, как твоя мать Ева, потому что мне вверено [. . .][b]».


    Но Норея, силою [Бога][c], повернулась и громко воззвала к Святому, Богу Всего: «Избавь меня от архонтов несправедливости и тотчас спаси меня из их рук!»


