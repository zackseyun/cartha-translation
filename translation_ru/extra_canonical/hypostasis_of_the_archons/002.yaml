translation:
  language: ru
  text: 'Их предводитель слеп. [Из-за своей] силы, неведения и гордыни он провозгласил в своей [силе]: «Я — Бог, и нет другого [кроме меня]».


    Сказав это, он согрешил против [Всего]. Эта похвальба поднялась к Нетленности. [][a] И из Нетленности донёсся голос: «Ты заблуждаешься, Самаэль», — а это имя означает «слепой бог», ибо помыслы его были слепы. Он изверг свою силу — то есть произнесённое им богохульство — и вслед за ней сошёл в Хаос, к своей матери Бездне, побуждаемый Пистис Софией. Она определила место каждому из его порождений сообразно его силе, по подобию высших вечных эонов, потому что видимое произошло от невидимого.


    Нетленность взглянула вниз, туда, где были воды. Её образ отразился в водах, и власти тьмы воспылали к ней любовью. Но они не могли удержать образ, явившийся им на водах, потому что были немощны. Ведь душевное не может удержать духовное:[b] власти произошли снизу, а образ Нетленности — свыше.


    Поэтому Нетленность взглянула вниз, в то место, чтобы по воле Отца соединить их всех со светом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Пустые квадратные скобки отмечают лакуну в рукописном тексте; предполагаемое содержание не восполняется.
    reason: Сохраняет явно обозначенный в свидетельстве пробел и не создаёт ложной уверенности в реконструкции.
  - marker: b
    text: «Душевное» и «духовное» здесь обозначают различные уровни или виды бытия, а не просто эмоциональное и религиозное.
    reason: Предупреждает вероятное современное неверное прочтение специальной антропологической лексики.
lexical_decisions:
- source_word: indestructability / indestructibility
  choice: Нетленность
  rationale: Передаёт персонифицированную высшую реальность естественным для русского религиозно-философского регистра словом; прописная буква сохраняет её личностно-ипостасный характер в повествовании.
- source_word: authorities
  choice: власти
  rationale: Сохраняет традиционный и достаточно буквальный термин для космических правителей, не подменяя его более истолковывающим «архонты» там, где свидетель использует общее обозначение.
- source_word: soulish / spiritual
  choice: душевное / духовное
  rationale: Сохраняет антропологическое и космологическое противопоставление исходного свидетельства, не истолковывая «душевное» как просто эмоциональное или плотское.
- source_word: the All
  choice: Всё
  rationale: Передаёт техническое обозначение божественной полноты максимально буквально; квадратные скобки сохраняют редакционное восстановление текста.
- source_word: aeons
  choice: эоны
  rationale: Сохраняет специальный космологический термин, знакомый по русской передаче гностических текстов, без сведения его к обычным «векам».
- source_word: Abyss
  choice: Бездна
  rationale: Прописная буква отражает персонификацию и роль Бездны как матери предводителя.
- source_word: Pistis Sophia
  choice: Пистис София
  rationale: Имя транслитерировано, чтобы не устранять возможное напряжение между собственным именем и его значением «Вера-Премудрость».
theological_decisions:
- issue: Характер Нетленности
  choice: 'Сохранена женская персонификация: «Нетленность… её образ»'
  alternative: Безличное «нетление… его образ»
  rationale: Свидетель последовательно использует женские местоимения и описывает действующее высшее начало; перевод не должен устранять эту особенность.
- issue: Высказывание «Я — Бог»
  choice: Сохранено прямое и исключительное притязание без поясняющей квалификации
  alternative: Добавить «единственный Бог» или обозначить говорящего как ложного бога
  rationale: Оценка притязания следует из ответа свыше и контекста; внесение её внутрь реплики ослабило бы литературное и богословское напряжение.
- issue: Связь между силой и богохульством
  choice: «Он изверг свою силу — то есть произнесённое им богохульство — и вслед за ней сошёл…»
  alternative: «Он излил свою силу… и низверг богохульство…»
  rationale: Сохранена трудная идентификация силы с произнесённым богохульством и неоднозначная образность движения вниз, без догматического переосмысления.
- issue: Цель нисхождения Нетленности
  choice: «чтобы… соединить их всех со светом»
  alternative: «чтобы… привести их всех к свету»
  rationale: «Соединить» сохраняет более сильное утверждение исходного свидетельства и не ослабляет его до простого направления или наставления.
translation_notes:
  register: 'Современный литературный русский язык с достоинством древнего религиозно-философского повествования. Синтаксис умеренно упрощён ради ясности, но технические термины и квадратные скобки сохранены. Проект предварительный: он основан на предоставленном англоязычном публичном свидетельстве; прямая сверка с коптским текстом Nag Hammadi Codex II,4 ещё требуется.'
