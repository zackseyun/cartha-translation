lexical_decisions:
- source_word: authorities / archon
  choice: власти / архонт
  rationale: В первом вопросе сохранено обычное значение «власти», а при обозначении конкретного космического правителя употреблён закрепившийся термин «архонт»; это передаёт связь понятий без искусственного единообразия.
- source_word: Indestructibility
  choice: Нетленность
  rationale: Абстрактное именование передано с прописной буквы как название высшей реальности; «нетленность» естественно и не сужает смысл до одной лишь физической неразрушимости.
- source_word: aeons
  choice: эоны
  rationale: Сохранён историко-религиозный термин, поскольку замены вроде «века» или «миры» устранили бы его космологическую многозначность.
- source_word: Sophia / Pistis / Zoe
  choice: София / Пистис / Зоя
  rationale: Имена транслитерированы в традиционной русской форме; их буквальные значения не подставлены в основной текст, чтобы не смешивать имена персонажей с отвлечёнными понятиями.
- source_word: companion
  choice: спутник
  rationale: Нейтральная формулировка сохраняет неопределённость характера парного отношения и не вводит брачную или иную доктрину.
- source_word: the All
  choice: Всё
  rationale: Субстантивированное «Всё» сохраняет космологическую широту термина и не отождествляет его без основания с конкретным лицом.
- source_word: androgynous
  choice: двуполый
  rationale: Понятная современному читателю передача телесно-космологической характеристики; она не заменена более специальным и потенциально неоднозначным словом «андрогинный».
- source_word: Tartaros
  choice: Тартар
  rationale: Использована устоявшаяся русская форма греческого названия глубинного места заключения.
theological_decisions:
- issue: Статус Софии, Пистис и Зои
  choice: Имена и родственные отношения переданы буквально, без догматического истолкования.
  alternative: Отождествить их с христианскими добродетелями, ипостасями или иными богословскими категориями.
  rationale: Сам отрывок представляет их как действующих персонажей собственной космологии; перевод не должен навязывать внешнюю конфессиональную систему.
- issue: Притязание архонта «Я — Бог»
  choice: Высказывание сохранено прямо, вместе с последующим обвинением в заблуждении.
  alternative: Смягчить титул или пояснить, что речь идёт о ложном божестве.
  rationale: Теологическое напряжение создаётся самим повествованием и не нуждается во встроенном толковании.
- issue: Выражение «против Всего»
  choice: Сохранено «Всего» с прописной буквы.
  alternative: Передать как «против Бога» или «против всего мироздания».
  rationale: Обе альтернативы разрешают подлинную неопределённость исходного космологического обозначения.
- issue: Фраза о существующем «прежде меня»
  choice: Передано «кто-то иной», с сохранением временного «прежде меня».
  alternative: «Что-либо ещё выше меня» или «до меня».
  rationale: Формулировка сохраняет сочетание личного и временного смысла, не превращая вопрос исключительно в пространственную иерархию.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего откровенного повествования. Термины гностической космологии сохранены там, где общеупотребительная замена исказила бы смысл. Основа черновика — предоставленное англоязычное публично-доменное свидетельство; прямая сверка с коптским текстом ещё требуется. Голые номера страниц рукописи [5] и [6] удалены, а сигналы лакун и восстановлений сохранены.
