translation:
  language: ru
  text: 'Я сказал: «Господин мой, наставь меня о [силе] этих властей. [Как] они возникли, из какого рода сущности и из [] какой материи? Кто сотворил их и их силу?»[a]


    Великий ангел Элелет, который есть Мудрость, сказал мне: «Нетленность обитает в бесконечных эонах. София, называемая Пистис, пожелала создать нечто самостоятельно, отдельно от своего спутника, и созданное ею произошло свыше.


    Между вышним миром и эонами внизу есть завеса. Под завесой возникла тень; тень стала материей и упала в отдельное место.


    Созданное ею развилось в нечто вещественное, подобное выкидышу. Облик его был вылеплен из тени, и оно стало надменным зверем, похожим на льва. Оно было двуполым, как я уже говорил, потому что произошло из материи.


    Он открыл глаза и увидел огромное, беспредельное множество материи. Возгордившись, он сказал: „Я — Бог, и кроме меня ничего не существует“.


    Сказав это, он согрешил против Всего. И свыше, из места верховного владычества, раздался голос: „Ты заблуждаешься, Самаэль“, — что означает „слепой бог“.


    Он сказал: „Если прежде меня существует кто-то иной, пусть явится мне“.


    София тотчас простёрла палец и внесла свет в материю, а затем последовала за ним вниз, до места хаоса. После этого она возвратилась ввысь, к своему свету, и тьма снова [опустилась на] материю.[b]


    Этот архонт, будучи двуполым, создал себе обширное царство — беспредельный простор.


    [] Он задумал создать себе потомство и создал семерых потомков, двуполых, как и их родитель.


    Он сказал своему потомству: „Я — Бог Всего“.


    Зоя, дочь Пистис Софии, воззвала к нему: „Ты заблуждаешься, Сакла“, — другое имя которого Иалдаваоф. Зоя дохнула ему в лицо, и её дыхание стало для неё ангелом огня. Этот ангел связал Иалдаваофа и низверг его в Тартар, под бездну».'
