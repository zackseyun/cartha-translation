  text: 'I said, “My Lord, do I too come from their matter?”


    “You and your offspring come from the Father, who existed from the beginning.


    “The souls come from above, from indestructible light. Therefore, the authorities cannot approach them because the spirit of truth is within them. Everyone who knows this path of truth will be deathless among mortal humans.


    “However, that seed will not yet be known. It will become known after three ages, and then it will free them from bondage to the error of the authorities.”


    I asked, “My Lord, how much longer will it be before this happens?”


    He said to me, “Until the moment the True Man, in a moldable substance, reveals [the spirit of] truth that the Father has sent.


    [] “Then he will instruct them about all things, anointing them with the oil of eternal life bestowed on him by the kingless generation.


    “Then they will be freed from blind thought. They will tread on death, which comes from the authorities, and they will ascend to the infinite light where this seed dwells.


    “Then the authorities will give up their times. Their angels will weep because of their destruction, and their demons will grieve because of their death.


    “Then all the sons of light will truly know the truth, their root, the Father of the All, and the holy Spirit. They will all proclaim with one voice, ‘The truth of the Father is just. The Son reigns over the All.’ And everyone will proclaim, ‘Forever and ever, holy, holy, holy! Amen.’”


    The Substance of the Archons'
translation:
  language: ru
  text: 'Я сказала: «Господин мой, неужели и я происхожу из их материи?»


    «Ты и твоё потомство происходите от Отца, существовавшего от начала.


    Души происходят свыше, из нерушимого света. Поэтому власти не могут приблизиться к ним: ведь в них пребывает дух истины. И всякий, кто знает этот путь истины, будет бессмертен среди смертных людей.


    Однако то семя пока не будет узнано. Оно станет известно по прошествии трёх веков и тогда освободит их от рабства заблуждению властей».


    Я спросила: «Господин мой, сколько ещё ждать, прежде чем это свершится?»


    Он сказал мне: «До того мгновения, когда Истинный Человек в податливой для создания материи[a] явит [дух] истины, посланный Отцом.


    […] Тогда он наставит их во всём, помазав их елеем вечной жизни, дарованным ему родом, над которым нет царя.


    Тогда они освободятся от слепого помышления. Они попирают смерть, происходящую от властей, и взойдут к беспредельному свету, где обитает это семя.


    Тогда власти отдадут отпущенные им времена; их ангелы будут плакать об их уничтожении, а их демоны — скорбеть об их смерти.


    Тогда все сыны света воистину познают истину, свой корень, Отца Всего и Святого Духа. Все они единым голосом возгласят: „Истина Отца праведна; Сын царствует над Всем“. И от всех прозвучит: „Во веки веков — свят, свят, свят! Аминь“».


    Сущность архонтов[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в формуемом веществе»; здесь употреблено греческое заимствование plasma — вещество, которому придают форму.'
    reason: Термин необычен и существенен для связи заключительного отрывка с темой материального происхождения архонтов.
  - marker: b
    text: В заглавии стоит греческое заимствование hypostasis. В контексте трактата оно обозначает не только отвлечённую «сущность», но также вещественную основу, происхождение или состав архонтов.
    reason: Русское «сущность» без пояснения может ошибочно навести на позднейший исключительно онтологический смысл.
lexical_decisions:
- source_word: hyle / matter
  choice: материя
  rationale: Сохраняет конкретный космологический смысл исходного термина и связь с материальным происхождением властей.
- source_word: authorities
  choice: власти
  rationale: Передаёт нейтральное обозначение космических правителей, не подменяя его более конфессионально или интерпретационно нагруженным словом.
- source_word: indestructible light
  choice: нерушимый свет
  rationale: «Нерушимый» естественно по-русски выражает невозможность уничтожения, сохраняя возвышенный регистр.
- source_word: seed
  choice: семя
  rationale: Сохраняет образную и коллективно-родовую неоднозначность термина.
- source_word: plasma
  choice: податливая для создания материя
  rationale: Передаёт вещество, которому можно придать форму, и отличает его от готового «образа» или «формы».
- source_word: kingless generation
  choice: род, над которым нет царя
  rationale: Сохраняет необычный апофатический образ, не превращая его в отвлечённое «нецарственное поколение».
- source_word: blind thought
  choice: слепое помышление
  rationale: Сохраняет метафору духовной слепоты и возвышенный, но понятный регистр.
- source_word: the All
  choice: Всё
  rationale: Передаёт космологическую совокупность сущего; прописная буква отмечает терминологическое употребление.
- source_word: hypostasis
  choice: сущность
  rationale: Традиционный русский эквивалент заглавного термина, однако примечание уточняет его конкретно-материальный смысл в данном трактате.
theological_decisions:
- issue: Кто или что освобождает людей после трёх веков
  choice: «семя… освободит их»
  alternative: «познание семени освободит их»
  rationale: Грамматика свидетельства называет семя непосредственным деятелем; причинное толкование через познание не внесено.
- issue: Восстановление повреждённого текста перед словом «истины»
  choice: «[дух] истины»
  alternative: «истину» без восстановления
  rationale: Сохранено предложенное свидетелем восстановление и явно отмечено квадратными скобками как не полностью засвидетельствованное.
- issue: Отношение Истинного Человека к формуемой материи
  choice: «Истинный Человек в податливой для создания материи»
  alternative: «Истинный Человек, воплощённый в материи»
  rationale: Не вводится более определённое учение о воплощении, которого формулировка источника сама по себе не требует.
- issue: Судьба властей
  choice: «отдадут отпущенные им времена»
  alternative: «откажутся от своих эпох»
  rationale: Сохранена неясная связь властей с принадлежащими или назначенными им периодами, без догматического уточнения.
- issue: Формула о Сыне и Всём
  choice: «Сын царствует над Всем»
  alternative: «Сын царствует над вселенной»
  rationale: «Всё» сохраняет техническую космологическую широту выражения и не сужает его до физической вселенной.
translation_notes:
  register: Современный литературный русский с достоинством древнего религиозно-философского диалога. Синтаксис умеренно торжественный, но без архаизмов вроде «доколе» и «оный». Женский род реплик рассказчицы выбран по контексту Нореи. Лакуна перед «Тогда он наставит» отмечена многоточием в квадратных скобках; редакторское восстановление «[дух]» также сохранено. Черновик основан на предоставленном публичном английском свидетельстве; прямая сверка с коптским текстом ещё требуется.
