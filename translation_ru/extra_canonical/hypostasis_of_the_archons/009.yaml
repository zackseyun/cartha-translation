base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/009.yaml
  text: 'The angel said, “I am Eleleth, the great angel Wisdom, who stands before the holy Spirit. I have been sent to speak with you and to save you from the hand of the lawless ones. I will also instruct you about your root.”


    As for that angel, I am unable to describe his power. His appearance is like fine gold, and his clothing is like snow. My mouth is truly unable to describe his power or the appearance of his face.


    The great angel Eleleth spoke to me and said, “I am Wisdom, one of the Four Lights who stand before the great unseen Spirit. Do you (really) think that these archons can exercise (any) power over you? Not one of them will be able to conquer the root of the truth, because he has appeared in the last days on account of the root of the truth, and these authorities will be confined. Moreover, these authorities will be unable to defile you and that generation, because your dwelling is in indestructibility, where the virgin Spirit dwells, who is superior over the authorities of chaos and over their world.”'
translation:
  language: ru
  text: 'Ангел сказал: «Я — Элелет, великий ангел Премудрости, стоящий пред святым Духом. Я послан говорить с тобой и спасти тебя из руки беззаконных. Я также наставлю тебя о твоём корне».[a]


    Что же до того ангела, я не в силах описать его могущество. Облик его подобен чистому золоту, а одеяние — снегу. Поистине, уста мои не в силах описать ни его могущество, ни вид его лица.


    Великий ангел Элелет заговорил со мной и сказал: «Я — Премудрость, один из Четырёх Светов,[b] стоящих пред великим незримым Духом. Неужели ты думаешь, что эти архонты[c] могут иметь над тобой хоть какую-то власть? Ни один из них не сможет одолеть корень истины, ибо он явился в последние дни ради корня истины, и эти власти будут заключены.[d] Более того, эти власти не смогут осквернить ни тебя, ни то поколение,[e] потому что обитель ваша — в нетленности, где пребывает девственный Дух, превосходящий власти хаоса и их мир».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Корень» — ключевой образ трактата, обозначающий происхождение или глубинную принадлежность адресата; точный объём значения здесь не поясняется.
    reason: Технический и многозначный термин может быть непонятен современному читателю.
  - marker: b
    text: «Четыре Света» — именование группы небесных существ в мифологической системе трактата.
    reason: Прописное написание и необычное множественное число требуют краткого контекстуального пояснения.
  - marker: c
    text: Архонты — буквально «правители»; в трактате это враждебные космические властители.
    reason: Заимствованный специальный термин нуждается в пояснении.
  - marker: d
    text: Не вполне ясно, к кому относится «он» и каким именно образом власти будут «заключены»; перевод сохраняет неясность текста-свидетеля.
    reason: Необходимо обозначить подлинную синтаксическую и смысловую неоднозначность, не разрешая её в основном тексте.
  - marker: e
    text: «То поколение» может также пониматься как особый «род» или духовная общность; перевод не уточняет это сверх текста.
    reason: Термин имеет возможное специальное богословско-мифологическое значение.
lexical_decisions:
- source_word: Eleleth
  choice: Элелет
  rationale: Транслитерация имени в форме, естественной для русского текста и близкой к передаче в научной литературе.
- source_word: Wisdom
  choice: Премудрость
  rationale: Сохраняет персонифицированный и сакральный характер понятия; прописная буква показывает, что это именование говорящего.
- source_word: root
  choice: корень
  rationale: Буквальный образ сохранён, поскольку в данном мифологическом контексте это значимый технический термин, который не следует истолковывать прямо в тексте.
- source_word: archons
  choice: архонты
  rationale: Сохранён традиционный термин для космических правителей данного трактата; перевод «правители» мог бы стереть его специальное значение.
- source_word: authorities
  choice: власти
  rationale: Отличает обозначение властных сил от термина «архонты», не утверждая без достаточного основания, что слова полностью взаимозаменяемы.
- source_word: indestructibility
  choice: нетленность
  rationale: Естественный русский сакрально-философский эквивалент, передающий состояние, не подверженное разрушению или тлению.
- source_word: virgin Spirit
  choice: девственный Дух
  rationale: Сохраняет необычное определение свидетеля и его смысловую открытость; вариант «Дух-Дева» был бы более интерпретирующим.
theological_decisions:
- issue: Род и личностный статус Премудрости
  choice: «Я — Премудрость, один из Четырёх Светов»
  alternative: «Я — Премудрость, одна из Четырёх Светил»
  rationale: Согласование «один» относится к ангелу Элелету, а не навязывает Премудрости женскую персонификацию; «Светы» сохраняет специальное именование группы.
- issue: Местоимение в выражении «ибо он явился»
  choice: Сохранено мужское местоимение «он» без явного уточнения референта
  alternative: Заменить на «корень истины явился» или назвать конкретного спасителя
  rationale: Свидетель допускает неясность референта; её нельзя устранять догматическим истолкованием.
- issue: Связь адресата с «тем поколением»
  choice: «ни тебя, ни то поколение»
  alternative: «тебя и твой род»
  rationale: Сохранена дистанция указательного выражения и возможное техническое значение «поколения»; притяжательное «твой» внесло бы дополнительную связь.
- issue: Статус святого/девственного Духа
  choice: Переданы как «святой Дух» и «девственный Дух» без отождествляющего пояснения
  alternative: Унифицировать оба наименования или пояснить их как одно лицо
  rationale: Текст сам не разъясняет соотношение этих обозначений, поэтому богословская неоднозначность сохранена.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, но понятным регистром. Формулы «пред Духом», «уста мои», «обитель» поддерживают достоинство апокрифического откровения, не делая текст намеренно архаичным. Черновик основан на предоставленном англоязычном публичном свидетельстве; прямая сверка с коптским текстом Nag Hammadi Codex II,4 ещё требуется.
