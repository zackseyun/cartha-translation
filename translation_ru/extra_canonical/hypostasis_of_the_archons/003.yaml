  source_fidelity: 'В целом перевод точно следует предоставленному английскому свидетельству и бережно сохраняет терминологию, неоднозначный субъект «Он», редакционные квадратные скобки и различение души и Духа. Однако пустая лакуна `[]` не должна заменяться на `[…]`: свидетель фиксирует именно пустые скобки. Добавленное «лежавшего» вносит невыраженную характеристику положения человека.'
  naturalness: 'Регистр в целом современный литературный и уместно сдержанный. «Архонты составили замысел» возможно, но менее естественно, чем «архонты замыслили». Формула «его нашли движущимся» лучше передаётся без искусственного оттенка внешнего обнаружения: «он оказался движущимся по земле».'
  terminology: «Архонты», «душевный человек», «Отец Всего», «Нетленность» и «Адамова Земля» сохранены последовательно. «Нетленность» оставлена со строчной буквы в тексте, поскольку свидетель не требует однозначно превращать её в имя собственное; примечание сохраняет космологическую возможность.
  issues:
  - severity: medium
    issue: Лакуна передана как «[…]» вместо «[]».
    rationale: В английском свидетельстве и исходной подаче повреждение обозначено пустыми квадратными скобками. Многоточие является дополнительным редакторским знаком и меняет форму сигнала.
  - severity: low
    issue: Добавлено «лежавшего» в описании душевного человека.
    rationale: Источник говорит лишь, что человек был «на земле»; положение лёжа прямо не утверждается.
  - severity: low
    issue: «Составили замысел» звучит несколько канцелярски.
    rationale: «Замыслили» естественнее в современном литературном русском и сохраняет смысл plotted/schemed.
  - severity: low
    issue: «Его нашли движущимся» не вполне естественно и может подразумевать отдельного обнаружившего субъекта.
    rationale: Формула «он оказался движущимся по земле» сохраняет исходную неопределённость и естественнее по-русски.
