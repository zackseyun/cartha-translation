    reason: Отмечает необычный космологический термин и пределы свидетельства.
  - marker: e
    text: «Нетленность» здесь может обозначать не только качество, но и высшую нетленную область, откуда исходит голос.
    reason: Сохраняет возможную пространственно-космологическую и абстрактную семантику.
lexical_decisions:
- source_word: archons
  choice: архонты
  rationale: Сохраняется устоявшийся термин для космических властителей в данном трактате, без замены толковательным словом «правители».
- source_word: to be soil of the earth
  choice: чтобы он стал почвой земли
  rationale: Намеренно сохранена необычная и, вероятно, значимая формулировка свидетеля, связывающая человека с земной почвой.
- source_word: soulish man
  choice: душевный человек
  rationale: Сохраняется различие между человеком, уже получившим душу, и последующим вселением Духа; более гладкое «одушевлённый» могло бы стереть эту напряжённость.
- source_word: Father of the All
  choice: Отец Всего
  rationale: Передаёт космологический титул буквально и не подменяет «Всё» словом «вселенная».
- source_word: indestructibility
  choice: нетленность
  rationale: Естественный русский религиозно-философский эквивалент для сферы или состояния, не подверженного разрушению.
- source_word: Adamic Land
  choice: Адамова Земля
  rationale: Передано как особое наименование с прописной буквы, а не отождествлено без пояснения с обычной землёй.
theological_decisions:
- issue: Соотношение души и Духа
  choice: Различены «обрёл душу», «душевный человек» и вселение Духа
  alternative: Свести все выражения к общему понятию оживления
  rationale: Текст проводит последовательное различие между душевной жизнью и пребыванием Духа; перевод не должен заранее устранять эту антропологическую напряжённость.
- issue: Неясный субъект действия «He blew»
  choice: Сохранено единственное число «Он» с примечанием о неясности
  alternative: Заменить на «один из архонтов» или «главный архонт»
  rationale: Уточнение субъекта отсутствует в предоставленном свидетельстве и стало бы интерпретационной вставкой.
- issue: «Образ» и его мужское подобие
  choice: Сохранены образ, мужское подобие и мотив влюблённости
  alternative: Истолковать образ как конкретную небесную сущность или как душу
  rationale: Предоставленный текст не разрешает однозначно природу образа; перевод сохраняет его референциальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром. Синтаксис сделан ясным для обычного читателя, но технические термины («архонты», «душевный человек») и намеренно необычные образы сохранены. Рукописные восстановления оставлены в квадратных скобках; лакуна обозначена многоточием в скобках.
