translation:
  language: ru
  text: '[] О сущности властей — о том, из чего они произошли.


    Духом Отца истины великий апостол упомянул власти тьмы и сообщил нам: «Наша борьба не против плоти и [крови], но против космических властей и духов зла».[a] Я послал тебе это сочинение, потому что ты спрашивал о сущности властей — о том, из чего они произошли.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ср. Еф 6:12. Квадратные скобки в слове «[крови]» отмечают повреждение текста или редакционное восстановление в рукописном свидетеле.
    reason: Указывает источник апостольской цитаты и объясняет сохранённые текстологические скобки.
lexical_decisions:
- source_word: substance
  choice: сущность
  rationale: Передаёт предмет трактата и сохраняет возможный онтологический оттенок; пояснение «о том, из чего они произошли» удерживает смысл, данный самим свидетелем.
- source_word: authorities
  choice: власти
  rationale: Соответствует устойчивой библейской лексике о сверхчеловеческих силах и не сужает значение до земных правителей.
- source_word: cosmic authorities
  choice: космические власти
  rationale: Сохраняет необычную формулировку английского свидетеля и её космологический оттенок, не подменяя её более конфессионально привычным выражением.
- source_word: spirits of evil
  choice: духи зла
  rationale: Формально и естественно передаёт конструкцию свидетеля, не разрешая её как «злые духи».
- source_word: writing
  choice: сочинение
  rationale: В контексте означает отправленный адресату письменный труд; «сочинение» звучит естественнее буквального «писание» и не придаёт тексту канонического статуса.
theological_decisions:
- issue: Природа «властей»
  choice: Сохранено нейтральное «власти» без определения их как демонов, ангелов или земных правителей.
  alternative: «начальства», «правители», «демонические силы»
  rationale: Свидетель говорит о властях тьмы и космических властях, но перевод не должен устранять заложенную в термине смысловую широту.
- issue: Формула «Духом Отца истины»
  choice: Сохранена инструментальная конструкция «Духом Отца истины».
  alternative: «По вдохновению Духа Отца истины»
  rationale: Более развёрнутый вариант истолковал бы характер действия Духа; краткая форма сохраняет напряжение оригинальной формулировки.
- issue: Аллюзия на Ефесянам 6:12
  choice: Цитата переведена по данному древнему свидетелю, а не приведена в редакции какого-либо русского библейского перевода.
  alternative: Заменить формулировкой из традиционного русского перевода Еф 6:12.
  rationale: Текст трактата имеет собственную форму цитаты, которую следует сохранить.
translation_notes:
  register: Современный литературный русский с достоинством древнего трактата. Синтаксис сделан ясным для обычного читателя; специализированные термины «сущность», «власти» и «космические» сохранены из-за их концептуальной роли. Начальный знак [] оставлен как переданный в исходном свидетеле, хотя его функция неясна. Черновик остаётся предварительным, поскольку непосредственная сверка с коптским текстом ещё не выполнена.
