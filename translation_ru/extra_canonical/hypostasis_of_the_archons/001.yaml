  verdict: revise
  source_fidelity: 'Черновик в целом точно следует предоставленному английскому свидетелю и сохраняет его терминологическую неопределённость. Однако «из чего они произошли» не вполне передаёт twice-repeated «from which they were made»: «произошли» может обозначать происхождение без подразумеваемого изготовления/создания.'
  naturalness: Русский текст литературен и понятен. Оборот «Духом Отца истины великий апостол упомянул» намеренно близок к свидетелю и допустим в возвышенном регистре; его не следует разворачивать в интерпретирующее «по вдохновению».
  terminology: «Сущность», «власти», «космические власти» и «духи зла» удачно сохраняют лексику свидетеля без конфессионального уточнения. «Сочинение» уместно для отправленного письменного труда. Заменено лишь «произошли» на «были созданы», чтобы удержать смысл made.
  issues:
  - severity: medium
    issue: «из чего они произошли» в заглавии и заключительной фразе
    rationale: Английский свидетель уточняет substance выражением «from which they were made». Глагол «произошли» ослабляет указание на то, что власти были сделаны/созданы из чего-либо. «Из чего они были созданы» передаёт это точнее, не определяя творца и не вводя богословского истолкования.
