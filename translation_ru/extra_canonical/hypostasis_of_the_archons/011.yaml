  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/011.yaml
  text: 'When Sabaoth, the son of Yaldabaoth, witnessed that angel’s power, he repented and sentenced his father and Matter, his mother, whom he reviled, to judgment.


    He sang songs of praise to Sophia above and to her daughter Zoe. Sophia and Zoe raised him up and appointed him over the seventh heaven, beneath the veil that divides the upper and lower realms. He is called “God of hosts, Sabaoth” because he is over the hosts of chaos, since Sophia appointed him.


    After these events had taken place, Sabaoth made for himself a massive, four-faced chariot of cherubim, an infinity of angels to serve him, and harps and lyres.


    Sophia brought her daughter Zoe and had her sit at his right hand to instruct him about the things of the eighth heaven. She placed the angel of wrath at his left hand.


    [From] that day onward, [his right hand] was called “life,” [] while the left hand came to symbolize the injustice of the upper realm of the autocrat. [7] Before the time you existed, these events had taken place.


    When Yaldabaoth saw Sabaoth in such great majesty and so highly exalted, he became envious of him, and his envy became an androgynous entity. This was the origin of Envy, who gave birth to Death. Death gave birth to offspring and appointed each of them to rule over its own heaven. All the heavens of chaos were filled with their multitudes.


    All these events, however, took place by the will of the Father of the All, according to the pattern of everything above, so that the summation of chaos could be achieved.


    Behold, I have instructed you about the mold of the archons, the matter in which was made manifest, as well as their parent and their world. [8]'
translation:
  language: ru
  text: 'Когда Саваоф, сын Иалдаваофа, увидел силу того ангела, он раскаялся и предал суду своего отца и Материю, свою мать, которую поносил.


    Он воспел хвалебные песни вышней Софии и её дочери Зое. София и Зоя вознесли его и поставили над седьмым небом, под завесой, разделяющей верхние и нижние области. Его называют «Богом воинств, Саваофом», потому что он поставлен над воинствами хаоса: это София назначила его.


    После этого Саваоф создал себе огромную четырёхликую колесницу херувимов, бесчисленное множество ангелов себе в услужение, а также арфы и лиры.


    София привела свою дочь Зою, посадила её по правую руку от него и поручила ей наставлять его в том, что относится к восьмому небу. А по левую руку от него она поставила ангела гнева.


    С того дня [его правая рука] стала называться «жизнью», [а…][a] левая рука стала олицетворять неправедность верхней области Самовластца. Всё это произошло ещё до того времени, когда появились вы.


    Когда Иалдаваоф увидел Саваофа в столь великом величии и так высоко вознесённым, он позавидовал ему, и его зависть стала двуполым существом. Так возникла Зависть, которая породила Смерть. Смерть породила потомство и поставила каждого из своих потомков над его собственным небом. И все небеса хаоса наполнились их множествами.


    Однако всё это произошло по воле Отца Всего, по образцу всего, что пребывает в вышине, чтобы хаос пришёл к своему завершению.


    Вот, я наставил вас об образе архонтов, о материи, в которой он явился, а также об их родителе и их мире.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В предоставленном текстовом свидетельстве после слова «жизнью» имеется лакуна. Слова в квадратных скобках восстановлены или обозначают утраченный участок; проверка по коптскому тексту ещё предстоит.
    reason: Сохранить видимую текстуальную неопределённость и не выдавать вероятную реконструкцию за сохранившийся текст.
lexical_decisions:
- source_word: Sabaoth / God of hosts
  choice: Саваоф / Бог воинств
  rationale: Традиционная русская форма имени сохранена, а титул передан буквально и связан с последующим объяснением о воинствах хаоса.
- source_word: Sophia / Zoe
  choice: София / Зоя
  rationale: Имена переданы в привычных греческих формах; их смысловые ассоциации с мудростью и жизнью не подменяют имена в основном тексте.
- source_word: Matter
  choice: Материя
  rationale: Прописная буква сохраняет персонификацию Материи как матери Саваофа.
- source_word: autocrat
  choice: Самовластец
  rationale: Передаёт значение самовластного правителя и не отождествляет фигуру с Богом Вседержителем.
- source_word: androgynous entity
  choice: двуполое существо
  rationale: Ясная современная передача существа, соединяющего мужское и женское начала, без сглаживания необычного образа.
- source_word: mold
  choice: образ
  rationale: Сохраняет значение формообразующего образца и естественно согласуется с явлением этого образа в материи.
- source_word: summation of chaos
  choice: хаос пришёл к своему завершению
  rationale: Передаёт целевое достижение полноты или завершённости хаоса, не вводя без необходимости специальный термин «плерома».
theological_decisions:
- issue: Титул Саваофа и его власть над воинствами хаоса
  choice: 'Сохранено буквальное объяснение: «Бог воинств» назван так потому, что поставлен над воинствами хаоса.'
  alternative: Передать титул традиционным библейским выражением «Господь Саваоф».
  rationale: Текст сам объясняет титул внутри собственной космологии; добавление «Господь» могло бы преждевременно отождествить эту фигуру с библейским употреблением титула.
- issue: Воля Отца Всего и действия сил хаоса
  choice: 'Причинное напряжение сохранено: всё произошло по воле Отца Всего и по небесному образцу.'
  alternative: Ослабить формулировку до дозволения или попущения.
  rationale: Источник прямо говорит о воле; конфессиональное уточнение о попущении было бы истолкованием, отсутствующим в данном свидетельстве.
- issue: Зоя как правая рука и «жизнь»
  choice: Сохранены повреждённость текста и связь правой стороны с жизнью без реконструкции пропуска.
  alternative: Явно назвать Зою «Жизнью» в утраченном фрагменте.
  rationale: Контекст допускает такую реконструкцию, но предоставленное свидетельство содержит лакуну, поэтому уверенно восполнять её нельзя.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной торжественностью. Необычная космологическая терминология сохранена, но синтаксис сделан понятным обычному читателю. Проект основан на предоставленном англоязычном публичном свидетельстве; прямая сверка с коптским текстом Nag Hammadi Codex II,4 пока не выполнена.
