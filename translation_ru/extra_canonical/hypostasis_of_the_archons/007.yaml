review_pass:
  verdict: revise
  source_fidelity: В целом перевод точно следует предоставленному английскому свидетельству и не гармонизирует гностическое повествование с библейским рассказом Бытия. Без прямой сверки с коптским текстом остаются предварительными детали титула «архонт сил», топонима «Сир» и редакционного знака [3].
  naturalness: Современный литературный русский в целом удачен. Формулировка «поставив его на горе Сир» синтаксически менее ясна и создаёт ненужную деепричастную конструкцию; прямое повеление «поставь его» естественнее. «Спрячься» ближе к hide in it, чем «укройся».
  terminology: «Архонты», «архонт сил», «ковчег» и «всякая плоть» выбраны последовательно и уместно. Для beasts естественно «звери»; термин не следует уточнять как домашних или диких животных. Редакционный/рукописный знак [3] следует сохранить в самом тексте в его исходной форме, а не заменять буквенным сносочным знаком.
  issues:
  - severity: medium
    issue: Знак «[3]» заменён маркером «[a]».
    rationale: Английское свидетельство и сопровождающая заметка требуют сохранить именно скобочный числовой сигнал. Его значение можно пояснить в сноске, но сам якорь должен остаться «[3]».
  - severity: low
    issue: «поставив его на горе Сир» менее ясно передаёт заключительное повеление.
    rationale: Прямое «и поставь его на горе Сир» лучше отражает синтаксис инструкции и устраняет тяжёлую деепричастную конструкцию.
  - severity: low
    issue: «укройся» несколько смещает значение hide.
    rationale: «Спрячься в нём» ближе к английскому свидетельству, сохраняя отсутствие дополнительного толкования.
  revised_text: 'Архонты сговорились между собой и сказали: «Давайте своими руками устроим потоп и истребим всякую плоть — людей и зверей».


    Когда архонт сил узнал об их замысле, он сказал Ною: «Сделай себе ковчег из дерева, не подверженного гниению, и спрячься в нём — ты, твои дети, звери и небесные птицы, малые и большие, — и поставь его на горе Сир».


    Тогда Орея[3] подошла к Ною, желая войти в ковчег. Когда он ей отказал, она дунула на ковчег, и тот был пожран огнём. Тогда Ной во второй раз сделал ковчег.'
  revised_footnotes:
  - marker: '[3]'
    text: В предоставленном английском свидетельстве после имени Ореи стоит знак «[3]». Вероятно, это редакционный или рукописный сигнал; его точное значение требует сверки с изданием коптского текста.
    reason: Сохраняет исходный якорь без предположения о его функции.
  revision_rationale: Исправления ограничены сохранением исходного числового якоря [3], прояснением повеления о размещении ковчега и более близкой передачей hide. Неоднозначности повествования, титула и образа гибели ковчега не истолковываются дополнительно.
