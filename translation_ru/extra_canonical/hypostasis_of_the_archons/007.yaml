    Orea [3] then approached Noah, desirous to board the ark. When he refused her, she blew on the ark so that it was devoured by fire. So a second time he made an ark.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/007.yaml
  text: 'The rulers plotted together and said, “Come, let us cause a flood with our own hands and destroy all flesh, humans and animals.”


    When the ruler of the forces learned of their plot, he said to Noah, “Make yourself an ark from wood that does not rot, and hide in it—you, your children, the animals, and the birds of the sky, both small and large—placing it on Mount Sir.”


    Orea [3] then approached Noah, wanting to board the ark. When he refused her, she blew on the ark, and it was devoured by fire. So he made an ark a second time.'
translation:
  language: ru
  text: 'Архонты сговорились между собой и сказали: «Давайте своими руками устроим потоп и истребим всякую плоть — людей и животных».


    Когда архонт сил узнал об их замысле, он сказал Ною: «Сделай себе ковчег из негниющего дерева и укройся в нём — ты, твои дети, животные и небесные птицы, малые и большие, — поставив его на горе Сир».


    Тогда Орея[a] подошла к Ною, желая войти в ковчег. Когда он ей отказал, она дунула на ковчег, и тот был пожран огнём. Тогда Ной во второй раз сделал ковчег.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В английском свидетельстве после имени Ореи стоит редакционный или рукописный знак «[3]». Здесь он передан как сноска; его точное значение требует сверки с изданием коптского текста.
    reason: Исходные данные требуют сохранить знак [3], однако в русском публикационном тексте буквенный маркер связывает его с пояснением и не выдаёт число за часть имени.
lexical_decisions:
- source_word: archons
  choice: архонты
  rationale: Сохранён характерный для трактата технический термин, а не более толковательное «правители»; это позволяет не стирать космологический смысл названия существ.
- source_word: all flesh
  choice: всякую плоть
  rationale: Сохранён библейский и антропологический оборот исходного свидетельства; последующее уточнение «людей и животных» делает его понятным.
- source_word: archon of the forces
  choice: архонт сил
  rationale: Формальная передача сохраняет возможную титульность и неоднозначность выражения; «силы» не уточняются как войска или небесные власти без коптской сверки.
- source_word: ark
  choice: ковчег
  rationale: Устоявшийся русский библейский эквивалент в повествовании о Ное.
- source_word: wood that does not rot
  choice: негниющее дерево
  rationale: Естественная и достаточно близкая передача без попытки определить неизвестную породу древесины.
- source_word: Mount Sir
  choice: гора Сир
  rationale: Название передано транслитерацией и не отождествлено с другой известной горой.
- source_word: blew on the ark
  choice: дунула на ковчег
  rationale: Сохранено необычное непосредственное действие Ореи без рационализирующего пояснения.
theological_decisions:
- issue: Кто замышляет потоп
  choice: Архонты сговорились и решили устроить потоп своими руками
  alternative: Бог посылает потоп, как в каноническом повествовании Бытия
  rationale: Перевод следует собственной космологии трактата и не гармонизирует её с книгой Бытия.
- issue: Личность «архонта сил»
  choice: Оставлен неопределённый титул «архонт сил»
  alternative: Отождествить его с конкретным божеством, ангелом или правителем
  rationale: Предоставленный материал не даёт достаточных оснований для однозначного отождествления.
- issue: Причина гибели первого ковчега
  choice: Ковчег сгорает от дуновения Ореи
  alternative: Истолковать действие символически или как сверхъестественный огонь
  rationale: Необычный образ сохранён без навязанного богословского объяснения.
translation_notes:
  register: 'Современный литературный русский с умеренно библейской торжественностью. Перевод предварительный: он выполнен по предоставленному англоязычному свидетельству, поскольку прямая сверка с коптским текстом Наг-Хаммади II,4 ещё не проведена. Термин «архонты» сохранён как специальное понятие трактата.'
