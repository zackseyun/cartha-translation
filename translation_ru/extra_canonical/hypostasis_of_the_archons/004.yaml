base_translation:
  language: en
  yaml_path: translation/extra_canonical/hypostasis_of_the_archons/004.yaml
  text: 'The archons brought Adam and placed him in the garden so that he might tend it and guard it. They commanded him, saying, “You may eat from [all] the trees in the garden, but do not eat from the tree of the knowledge of good and evil. Do not [touch] it, because on the day you eat from it, you will certainly die.”


    [This] they [said to him], yet they did not understand what [they had said] to him. Instead, it was according to the will of the Father [] that they spoke this way, so that Adam would indeed eat and so that Adam would <not> regard them as a thoroughly material person would.


    The archons plotted with one another and said, “Come, let us cause a deep sleep to fall upon Adam,” and Adam fell asleep. The deep sleep they caused to fall upon him, which he slept, is ignorance. They opened his side, like a living woman. Then they closed his side with flesh in its place, and Adam became merely soulish.


    The spiritual woman approached him and spoke to him, saying, “Arise, Adam.”


    When he looked at her, he said, “You have given me life. You will be called the Mother of the Living, because she is my mother. She is the physician, the woman, the one who has given birth.”


    The authorities approached their Adam. When they saw his female counterpart speaking with him, they became aroused and lusted after her. They said to one another, “Come, let us sow our semen in her,” and they pursued her. She, however, laughed at them because of their stupidity and blindness. As they seized her, she became a tree, and as she placed before them a shadowy likeness of herself, they defiled it most vilely, defiling the signet of her voice. Thus they brought judgment upon themselves by means of the form they had modeled in their own image.'
translation:
  language: ru
  text: 'Архонты привели Адама и поместили его в сад, чтобы он возделывал и охранял его. Они дали ему повеление: «Ты можешь есть плоды [всех] деревьев в саду, но не ешь плодов дерева познания добра и зла. Не [прикасайся] к нему, потому что в день, когда ты вкусишь от него, ты непременно умрёшь».


    [Это] они [сказали ему], но сами не понимали, что [сказали] ему. Они сказали это именно так по воле Отца [], чтобы Адам действительно вкусил и чтобы Адам <не> думал о них так, как думал бы человек, всецело принадлежащий материи.[a]


    Архонты сговорились между собой и сказали: «Давайте наведём на Адама глубокий сон», — и Адам уснул. Глубокий сон, который они навели на него и которым он спал, — это неведение. Они раскрыли его бок, подобный живой женщине.[b] Затем они закрыли его бок плотью на прежнем месте, и Адам стал лишь душевным.[c]


    Духовная женщина подошла к нему и сказала ему: «Встань, Адам».


    Увидев её, он сказал: «Ты даровала мне жизнь. Тебя назовут Матерью живых, потому что она — моя мать. Она — целительница, женщина, родившая».[d]


    Власти приблизились к своему Адаму. Увидев, что его женское соответствие разговаривает с ним, они возбудились и воспылали к ней похотью. Они сказали друг другу: «Давайте изольём в неё наше семя», — и погнались за ней. Но она смеялась над ними из-за их глупости и слепоты. Когда они схватили её, она стала деревом и выставила перед ними своё призрачное подобие. Они самым мерзким образом осквернили его, осквернив печать её голоса.[e] Так через облик, который они создали по собственному образу, они навлекли суд на самих себя.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Квадратные и угловые скобки здесь и выше сохраняют текстовые сигналы английского свидетеля: квадратные скобки отмечают восполнение или неуверенно восстановленный текст, пустые скобки — лакуну, а угловые — редакционное исправление. Прямая сверка с коптским текстом ещё предстоит.'
    reason: Необходимо объяснить читателю критические знаки и явно обозначить предварительный характер основы перевода.
  - marker: b
    text: Фраза «раскрыли его бок, подобный живой женщине» синтаксически и образно трудна; её смысл без проверки коптского текста остаётся неясным.
    reason: Следует сохранить подлинную неясность, а не подменять её привычной формулировкой из Бытия.
  - marker: c
    text: «Душевным» передаёт особую антропологическую категорию текста, отличную как от духовного, так и от сугубо материального.
    reason: Обычное русское понимание слова может не передать его специального значения.
  - marker: d
    text: В речи Адама обращение «ты» сменяется высказываниями о «ней» в третьем лице. Эта неровность сохранена по свидетелю.
    reason: Не следует без источниковедческого основания унифицировать местоимения или определять, меняется ли референт.
  - marker: e
    text: «Печать её голоса» — буквальное сохранение трудного образа свидетеля; точный смысл выражения неясен.
    reason: Любая конкретизация — например, «отпечаток», «знак» или «подобие» голоса — преждевременно разрешила бы неоднозначность.
lexical_decisions:
- source_word: archons
  choice: архонты
  rationale: Сохранён устоявшийся термин для космических правителей в наг-хаммадской литературе; он отличает их от названных далее «властей», хотя в контексте обозначается та же группа.
- source_word: tend it and guard it
  choice: возделывал и охранял его
  rationale: Передаёт обе функции и сохраняет узнаваемую связь с повествованием о саде в Бытии.
- source_word: ignorance
  choice: неведение
  rationale: В данном тексте это не просто недостаток сведений, а духовно-антропологическое состояние; «неведение» сохраняет этот оттенок.
- source_word: soulish
  choice: душевным
  rationale: Сохранена необычная антропологическая категория, противопоставленная «духовной» женщине; нейтральное «живым» или «одушевлённым» устранило бы это противопоставление.
- source_word: spiritual woman
  choice: духовная женщина
  rationale: Формально передаёт характеристику женщины и сохраняет противопоставление душевному состоянию Адама.
- source_word: female counterpart
  choice: женское соответствие
  rationale: Не сводит выражение без достаточных оснований к «жене», «двойнику» или «женской половине».
- source_word: signet of her voice
  choice: печать её голоса
  rationale: Сохранён трудный и образный оборот свидетеля без догматизирующего истолкования.
theological_decisions:
- issue: Воля Отца и запрет архонтов
  choice: Сохранено утверждение, что архонты невольно говорят по воле Отца, чтобы Адам вкусил.
  alternative: Сгладить до общего допущения или предведения Отца.
  rationale: Источник намеренно создаёт напряжение между повелением, неведением архонтов и высшей волей; перевод не должен разрешать его.
- issue: Антропологический статус Адама после глубокого сна
  choice: «Адам стал лишь душевным»
  alternative: «Адам стал просто одушевлённым»
  rationale: «Душевный» сохраняет категориальное противопоставление духовному и материальному, важное для внутренней антропологии текста.
- issue: Переход между «ты» и «она» в речи Адама
  choice: Смена лица сохранена буквально.
  alternative: Унифицировать речь как обращение к женщине во втором лице.
  rationale: Неровность может отражать сложную текстовую историю или смену референта; её нельзя молча исправлять.
- issue: Суд над властями
  choice: «навлекли суд на самих себя»
  alternative: «осудили сами себя»
  rationale: Первая формулировка сохраняет возможность как самоосуждения, так и суда, вызванного их поступком, не уточняя субъект суда.
translation_notes:
  register: 'Современный литературный русский с достоинством и ясностью, но без искусственной церковнославянизации. Термины «архонты», «душевный» и «духовная» сохранены ради понятийной структуры текста. Перевод предварительный: представленная основа является англоязычным публичным свидетелем, а прямая проверка по коптскому тексту Nag Hammadi Codex II,4 ещё не выполнена.'
