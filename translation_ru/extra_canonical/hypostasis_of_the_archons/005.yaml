translation:
  language: ru
  text: 'Тогда женская духовная природа явилась в облике змея-наставника. Змей наставил Адама и Еву и спросил: «Что сказал вам Самаэль? Не так ли он сказал: „Вам позволено есть со всех деревьев в саду, но не ешьте с [дерева] познания добра и зла“?»


    [a] Плотская женщина ответила: «Он сказал не только: „Не ешьте“, но даже: „Не прикасайтесь к нему, потому что в тот день, когда вы вкусите от него, вы непременно умрёте“».


    Змей-наставник сказал: «Нет, вы вовсе не умрёте: он сказал вам это из зависти. Напротив, ваши глаза откроются, и вы станете как боги, знающие добро и зло». И женская наставляющая природа удалилась из змея, покинув его как нечто земное.


    Плотская женщина взяла плод с дерева и съела; дала она и своему мужу, и так они вкусили — эти существа, бывшие лишь душевными.[b] Их изъян обнаружился в их неведении. Они поняли, что лишились духовного, взяли смоковные листья и прикрепили их вокруг своих обнажённых чресл.


    Не зная о том, что произошло, предводитель архонтов пришёл и спросил: «Адам, где ты?»


    Адам ответил: «Я услышал твой голос и испугался, потому что был наг, и потому спрятался».


    Архонт сказал: «Почему ты спрятался, если не потому, что ел с того единственного дерева, с которого я запретил тебе есть? Ты ел с него!»


    Адам ответил: «Женщина, которую ты дал мне, [подала] мне плод, и я съел его».


    И надменный [архонт] проклял женщину.


    Женщина сказала: «Змей обманул меня, и потому я съела».


    [Архонты обратились] к змею, прокляли его тень и [ослабили] её.


    Они не знали, что это был тот самый образ, который они создали. С того времени змей находился под проклятием властей, продолжавшимся [c] до пришествия Совершенного Человека.[d]


    Они обратились к своему Адаму и изгнали его вместе с женой из сада. У них не было благословения, потому что и сами они находились под проклятием.


    Они ввергли человечество в великое смятение и обрекли на жизнь в трудах, чтобы созданные ими люди были заняты земными заботами и у них не оставалось времени заботиться о святом Духе.'
