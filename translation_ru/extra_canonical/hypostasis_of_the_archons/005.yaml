  footnotes:
  - marker: a
    text: Пустой знак в рукописном свидетельстве указывает на утрату или неразборчивое место перед словами женщины.
    reason: Сохраняет сигнал повреждения, представленный как пустые квадратные скобки в исходном свидетельстве.
  - marker: b
    text: '«Душевные» — особая категория текста: существа, обладающие душой, но лишённые духовного начала; это не просто характеристика их чувств или нрава.'
    reason: Предотвращает современное бытовое прочтение слова «душевный».
  - marker: c
    text: В этом месте рукописное свидетельство содержит утрату текста; неизвестно, были ли пропущены дополнительные слова.
    reason: Передаёт пустые квадратные скобки источника в форме понятной сноски.
  - marker: d
    text: «Совершенный Человек» — титульное выражение; данный отрывок не уточняет прямо, кого именно оно обозначает.
    reason: Сохраняет богословскую неоднозначность и не навязывает отождествление.
lexical_decisions:
- source_word: female spiritual nature
  choice: женская духовная природа
  rationale: Сохранена необычная персонифицированная формулировка свидетеля без сведения её к Еве или иной заранее определённой фигуре.
- source_word: serpent, the teacher
  choice: змей-наставник
  rationale: «Наставник» естественно передаёт обучающую роль и сохраняет положительную окраску персонажа в данном трактате.
- source_word: fleshly woman
  choice: плотская женщина
  rationale: Буквально сохраняет противопоставление духовного, душевного и плотского.
- source_word: merely soulish
  choice: бывшие лишь душевными
  rationale: Термин «душевные» удерживает антропологическую категорию текста и не заменяет её оценочными словами вроде «бездуховные».
- source_word: archon / archons
  choice: архонт / архонты
  rationale: Закрепившийся русский термин для правителей-властителей в гностических текстах; он не смешивается с обычными земными начальниками.
- source_word: authorities
  choice: власти
  rationale: Сохранено отличие от «архонтов», хотя в контексте обозначения могут относиться к одной группе сверхъестественных правителей.
- source_word: shape
  choice: образ
  rationale: «Образ» литературно естественнее «форма» и оставляет открытым, идёт ли речь о внешнем облике или созданном подобии.
- source_word: Perfect Man
  choice: Совершенный Человек
  rationale: Заглавные буквы отмечают титульный характер выражения, не отождествляя фигуру с конкретным лицом сверх сказанного в тексте.
- source_word: holy Spirit
  choice: святой Дух
  rationale: 'Сохранена неоднозначность: прилагательное передано со строчной буквы по форме свидетеля, а «Дух» — как обозначение персонифицированной или высшей духовной реальности.'
theological_decisions:
- issue: Роль змея
  choice: Сохранён образ змея как наставника, говорящего истину против Самаэля
  alternative: Смягчить формулировки в соответствии с каноническим рассказом о змее-обманщике
  rationale: Трактат намеренно переосмысливает повествование Бытия; перевод не должен устранять его богословское напряжение.
- issue: Трёхчастная антропология
  choice: Различены духовное, душевное и плотское
  alternative: Передать всё общими словами «духовное/телесное»
  rationale: Это смыслообразующее различие текста, и его необходимо сохранить.
- issue: Неосведомлённость предводителя архонтов
  choice: Прямо сказано, что он не знал о происшедшем
  alternative: Ослабить до «не видев происшедшего»
  rationale: Свидетель подчёркивает ограниченность знания архонта; перевод не гармонизирует её с представлениями о всеведении Бога.
- issue: «их Адам» и «их человечество»
  choice: Сохранена принадлежность созданных людей архонтам
  alternative: Нейтрально сказать «Адам» и «люди»
  rationale: Притяжательные конструкции выражают космологию трактата и дистанцируют архонтское создание от духовной природы.
- issue: Совершенный Человек
  choice: Сохранён титул без поясняющего отождествления
  alternative: Перевести как «Христос» или «совершенный человек»
  rationale: Источник в данном отрывке не называет фигуру прямо; неоднозначность не разрешается догматически.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным регистром, подходящим для древнего религиозного трактата. Архаизмы сведены к нескольким прозрачным словам («чресла», «смоковные»), поддерживающим достоинство стиля. Квадратные скобки сохранены для редакционных восстановлений; пустые скобки источника преобразованы в маркированные пояснения. Поскольку прямая сверка с коптским оригиналом ещё не выполнена, решения остаются предварительными и основаны на предоставленном публичном английском свидетельстве.
