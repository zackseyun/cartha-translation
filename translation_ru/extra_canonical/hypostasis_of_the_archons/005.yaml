review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод точно следует предоставленному английскому свидетельству и сохраняет его гностическую терминологию, различение духовного, душевного и плотского, а также текстологическую неопределённость. Однако в нескольких местах добавлены или слегка усилены элементы, которых свидетель не требует: «плод» при первом вкушении, «пришествие» для простого «came», а также более свободное «обрекли». Исправленная редакция ближе удерживает лексику и синтаксическую неоднозначность свидетельства.'
  naturalness: 'Регистр выдержан и в основном естественен для современного литературного русского. Улучшены несколько тяжеловесных или не вполне точных оборотов: «женская наставляющая природа» заменена на более ясную персонифицированную конструкцию, а действие со смоковными листьями передано естественнее.'
  terminology: «Архонт(ы)», «плотская», «душевные», «образ», «власти» и «Совершенный Человек» сохранены последовательно. «Святой Дух» дан с прописной буквы как устойчивое русское обозначение, не разрешающее вопрос о точной идентификации этой реальности в трактате. Скобочные восстановления и лакуны сохранены; пояснительные сноски привязаны к соответствующим местам.
  issues:
  - severity: medium
    issue: Добавление слова «плод» в эпизоде первого вкушения
    rationale: Свидетель говорит лишь, что женщина «взяла от дерева и съела»; плод прямо назван только в последующей реплике Адама. Добавление безопасно в контексте Бытия, но не необходимо для оптимально-эквивалентного перевода.
  - severity: low
    issue: «Пришествие Совершенного Человека» усиляет простое «came»
    rationale: Слово «пришествие» в русском несёт дополнительную традиционно-христианскую окраску. Нейтральное «пока не явился Совершенный Человек» точнее сохраняет формулировку свидетеля и не навязывает идентификацию титула.
  - severity: low
    issue: Передача «making it grow weak» как «[ослабили] её»
    rationale: Свидетель сохраняет восстановление именно в конструкции причинения слабости. «[Сделав её] слабой» ближе передаёт это действие и отчётливее сохраняет скобочную реставрацию.
  - severity: low
    issue: «Обрекли на жизнь в трудах» несколько свободнее исходного выражения
    rationale: Свидетель буквально говорит, что человечество было ввергнуто в смятение и жизнь труда. Более прямой перевод сохраняет образ без дополнительного оттенка окончательного приговора.
  revised_text: 'Тогда женская духовная природа явилась в облике змея, наставника. Змей наставил Адама и Еву и спросил: «Что сказал вам Самаэль? Не так ли он сказал: „Вам позволено есть со всех деревьев в саду, но не ешьте с [дерева] познания добра и зла“?»


    [a] Плотская женщина ответила: «Он сказал не только: „Не ешьте“, но даже: „Не прикасайтесь к нему, потому что в тот день, когда вы вкусите от него, вы непременно умрёте“».


    Змей, наставник, сказал: «Нет, вы вовсе не умрёте, потому что он сказал вам это из зависти. Напротив, ваши глаза откроются, и вы станете как боги, знающие добро и зло». И женская природа-наставница удалилась из змея и покинула его как нечто земное.


    Плотская женщина взяла с дерева и съела; дала также своему мужу, и так они вкусили — эти существа, бывшие лишь душевными.[b] Их изъян обнаружился в их неведении. Они поняли, что лишились духовного, взяли смоковные листья и обвязали ими свои обнажённые чресла.


    Не зная о том, что произошло, предводитель архонтов пришёл и спросил: «Адам, где ты?»


    Адам ответил: «Я услышал твой голос и испугался, потому что был наг, и потому спрятался».


    Архонт сказал: «Почему ты спрятался, если не потому, что ел с того единственного дерева, с которого я запретил тебе есть? Ты ел с него!»


    Адам ответил: «Женщина, которую ты дал мне, [подала] мне плод, и я съел его».


    И надменный [архонт] проклял женщину.


    Женщина сказала: «Змей обманул меня, и потому я съела».


    [Архонты обратились] к змею, прокляли его тень и [сделали её] слабой.


    Они не знали, что это был тот же образ, который они создали. С того времени змей находился под проклятием властей, продолжавшимся [c] до тех пор, пока не явился Совершенный Человек.[d]


    Они обратились к своему Адаму и изгнали его вместе с женой из сада. У них не было благословения, потому что и сами они находились под проклятием.


    Они ввергли человечество в великое смятение и жизнь, полную труда, чтобы созданные ими люди были заняты земными заботами и у них не оставалось времени уделять внимание Святому Духу.'
