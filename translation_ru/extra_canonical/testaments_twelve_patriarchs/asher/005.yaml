base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005.yaml
  text: '1[a]. See, my children, how there are two in all things, one opposite the other, and one is hidden under the other: in wealth, greed; in merriment, drunkenness; in laughter, grief[b]; in marriage, debauchery. 2. Death follows life, dishonor glory, night day, darkness light; but all things are under the day: righteous things under life, and unrighteous things under death. Therefore eternal life also awaits death. 3. And one cannot say that truth is falsehood, nor that what is righteous is unrighteous, because all truth is under the light, just as all things are under God. 4. Therefore I tested all these things in my life, and I did not go astray from the truth of the Lord, and I sought out the commandments of the Most High[c], walking according to all my strength.'
translation:
  language: ru
  text: '1. Смотрите, дети мои, как во всём есть два: одно напротив другого, и одно скрыто под другим: в творении — алчность[a], в веселье — пьянство, в смехе — скорбь, в браке — распутство. 2. За жизнью следует смерть, за славой — бесчестье, за днём — ночь, за светом — тьма; но всё — под днём: праведное — под жизнью, а неправедное — под смертью. Поэтому и смерть ожидает вечная жизнь[b]. 3. Нельзя назвать истину ложью, а праведное — неправедным, потому что всякая истина — под светом, как и всё — под Богом[c]. 4. Итак, всё это я испытал в своей жизни и не уклонился от истины Господа; я тщательно искал заповеди Всевышнего, поступая изо всех сил.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое κτίσις означает «творение» или «созданный мир». Сжатая связь «в творении — алчность» сохранена по тексту; её точный смысл не разъяснён.
    reason: lexical_alternative
  - marker: b
    text: Фраза «и смерть ожидает вечная жизнь» трудна и по смыслу парадоксальна. Перевод сохраняет наиболее естественный синтаксис греческого текста, не заменяя его истолкованием «после смерти ожидает вечная жизнь».
    reason: textual_variant
  - marker: c
    text: Повтор слова «под» — «под днём… под жизнью… под смертью… под светом… под Богом» — вероятно, обозначает нравственную или космическую область, однако точный смысл отношения в тексте не разъяснён.
    reason: cultural_note
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Смотрите
  rationale: Повелительная форма сохраняет прямое отцовское увещание и звучит естественно в современном русском.
- source_word: δύο ... ἓν κατέναντι τοῦ ἑνός
  choice: две стороны, одна напротив другой
  rationale: Слово «стороны» добавлено для естественности русского выражения, при этом сохранено противопоставление двух начал; род существительного позволяет согласовать последующее «одна».
- source_word: κέκρυπται
  choice: скрыта под
  rationale: Сохраняет образ сокрытия и пространственный предлог, подготавливающий повторение «под» далее.
- source_word: ἐν τῇ κτίσει
  choice: в богатстве
  rationale: Следует засвидетельствованному чтению и смыслу консультационного слоя; греческая форма в данной строке текстуально трудна и допускает связь с приобретением или обладанием.
- source_word: πλεονεξία
  choice: алчность
  rationale: Передаёт жадное стремление иметь больше и естественно сочетается с богатством; «корыстолюбие» возможно, но менее кратко.
- source_word: εὐφροσύνη
  choice: веселье
  rationale: Современный и ясный эквивалент праздничного радостного состояния.
- source_word: μέθη
  choice: пьянство
  rationale: Прямо передаёт порок опьянения без эвфемизма.
- source_word: πένθος
  choice: скорбь
  rationale: Сохраняет широкий смысл печали и риторический контраст со смехом.
- source_word: ἀσωτία
  choice: распутство
  rationale: В контексте брака указывает на нравственную разнузданность; буквальное «расточительство» здесь менее вероятно.
- source_word: διαδέχεται
  choice: следует за
  rationale: Передаёт последовательность и позволяет ясно оформить цепь противопоставлений по-русски.
- source_word: τὰ δίκαια / τὰ ἄδικα
  choice: праведное / неправедное
  rationale: Субстантивированные формы среднего рода сохраняют категориальный, а не исключительно личный смысл греческого множественного числа.
- source_word: ἐξεζήτησα
  choice: тщательно искал
  rationale: Передаёт усилительный оттенок сложного глагола и не превращает поиск в утверждение о полном постижении.
- source_word: κατὰ πᾶσαν ἰσχύν μου
  choice: по мере всех своих сил
  rationale: Естественная русская формула, сохраняющая указание на полноту приложенных сил.
theological_decisions:
- issue: Синтаксис парадокса διὸ καὶ τὸν θάνατον ἡ αἰώνιος ζωὴ ἀναμένει
  choice: Поэтому и смерть ожидает вечная жизнь
  alternative: Поэтому после смерти ожидает вечная жизнь
  rationale: Именительный падеж делает «вечную жизнь» подлежащим, а «смерть» — дополнением. Необычный парадокс сохранён без истолковывающего сглаживания.
- issue: Повторяющиеся конструкции с ὑπό
  choice: 'Сохранить формулу «под»: под днём, под жизнью, под смертью, под светом, под Богом'
  alternative: Передать как «принадлежит», «относится к области» или «находится во власти»
  rationale: Повтор создаёт намеренный нравственно-космический рисунок, а точный характер отношения остаётся неоднозначным.
- issue: 'Моральный контраст в браке: ἀσωτία'
  choice: распутство
  alternative: расточительность
  rationale: Контекст перечня пороков и непосредственная связь с браком поддерживают значение половой или общей нравственной разнузданности, но перевод не уточняет конкретный вид проступка.
translation_notes:
  register: Современный литературный русский с достоинством завещательного увещания. Афористическая цепь противопоставлений сохранена, но во 2-м стихе повтор «за» добавлен ради ясной русской синтаксической связи. Необычная образность «под» и парадокс о вечной жизни оставлены без конфессионального истолкования. Все маркеры сносок размещены в основном тексте.
