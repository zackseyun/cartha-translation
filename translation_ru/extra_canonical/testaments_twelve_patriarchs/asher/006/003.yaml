    rationale: Греческое ἐν αὐτῷ καταπαύοντες означает «покоясь/находясь в покое в нём». Формула «находя покой» может обозначать результативное обретение покоя и поэтому чуть менее буквально передаёт причастие настоящего времени.
  revised_text: Итак, дети мои, храните закон Господа и не смотрите на зло как на добро, но обращайте взор к тому, что истинно хорошо, и соблюдайте это во всех заповедях Господа, обращаясь к нему и покоясь в нём.
