source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: ⌈Ὑμεῖς οὖν, τέκνα μου⁷ᵃ, τὸν νόμον Κυρίου⁹ φυλάξατε· καὶ¹⁰ μὴ προσέχετε *τῷ κακῷ ὡς καλῷ¹¹, ἀλλὰ κατὰ¹² τὸ ὄντως⁹ καλὸν¹³ ἀποβλέπετε, καὶ διατηρεῖτε αὐτὸ ἐν πάσαις ταῖς¹⁴ ἐντολαῖς Κυρίου, εἰς αὐτὸ¹⁵ ἀναστρεφόμενοι, καὶ ἐν αὐτῷ καταπαύοντες¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/003.yaml
  text: You therefore, my children, keep the law of the Lord, and do not look upon evil as good; but look instead to what is truly good, and keep it in all the commandments of the Lord, turning toward it and resting in it.
translation:
  language: ru
  text: Итак, дети мои, храните закон Господа и не смотрите на зло как на добро, но обращайте взор к тому, что истинно хорошо, и соблюдайте это во всех заповедях Господа, обращаясь к нему и покоясь в нём.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξατε
  choice: храните
  rationale: Передаёт не только исполнение, но и бережное соблюдение закона; соответствует возвышенному наставительному регистру.
- source_word: μὴ προσέχετε τῷ κακῷ ὡς καλῷ
  choice: не смотрите на зло как на добро
  rationale: Сохраняет зрительный оттенок προσέχετε и противопоставление зла добру, не добавляя толкования.
- source_word: τὸ ὄντως καλόν
  choice: то, что истинно хорошо
  rationale: ὄντως подчёркивает подлинность добра; нейтральное «хорошо» сохраняет связь с καλόν и не сужает смысл до нравственной категории.
- source_word: διατηρεῖτε αὐτό
  choice: соблюдайте это
  rationale: В данном контексте глагол означает постоянное хранение и соблюдение; местоимение сохраняет возможную отсылку к истинному добру.
- source_word: εἰς αὐτὸ ἀναστρεφόμενοι
  choice: обращаясь к нему
  rationale: Передаёт направленность εἰς и смысл поворота/обращения, не вводя более спорное значение «поступая».
- source_word: ἐν αὐτῷ καταπαύοντες
  choice: находя в нём покой
  rationale: Естественно по-русски выражает пребывание в покое или обретение покоя в истинном добре.
theological_decisions:
- issue: Референт местоимений αὐτό / αὐτῷ
  choice: «это / к нему / в нём» с отсылкой к «тому, что истинно хорошо»
  alternative: Понимать местоимения как отсылку к закону Господа
  rationale: Ближайший грамматический антецедент — τὸ ὄντως καλόν; перевод сохраняет эту наиболее естественную связь, не превращая её в отдельное богословское утверждение.
- issue: Связь истинного добра с заповедями Господа
  choice: «соблюдайте это во всех заповедях Господа»
  alternative: «храните его, исполняя все заповеди Господа»
  rationale: Формулировка сохраняет необычную конструкцию оригинала и напряжение между добром как ориентиром и заповедями как сферой его соблюдения.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксис сохранён как единый ритмичный период; архаизмы и конфессионально маркированная лексика не вводятся.
