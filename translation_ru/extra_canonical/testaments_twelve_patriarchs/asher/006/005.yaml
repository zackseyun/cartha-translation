review_pass:
  verdict: revise
  source_fidelity: В дошедшем греческом тексте относительное ὃ формально является подлежащим при активном ἐδούλευεν («который/которое служил»), относясь к πνεῦμα («дух»). Поэтому перевод «которому она служила» передаёт вероятный подразумеваемый смысл, но не наличную синтаксическую форму. Знак † в издании отмечает текстуальную трудность; перевод не должен без оговорки превращать её в однозначное утверждение. Английское audit trail с «enslaved it» не подтверждается формой ἐδούλευεν и не должен быть предпочтён греческому источнику.
  naturalness: Основной русский текст остаётся литературным и понятным. Конструкцию с «служил в ... желаниях и ... делах» приходится несколько буквально сохранять, поскольку предмет служения в греческом не выражен; её смысловая неясность отмечена сноской.
  terminology: «Злая душа» и «злой дух» точно сохраняют повтор πονηρός. «Отходит» удачно не добавляет смерть или выход из тела. «Порочные желания и злые дела» передаёт ἐπιθυμίαις καὶ ἔργοις πονηροῖς без присоединения отсутствующего притяжательного «своими».
  issues:
  - severity: high
    issue: Синтаксическая перестройка ὃ καὶ ἐδούλευεν
    rationale: Вариант «которому она служила» требует дательного относительного местоимения и другого распределения синтаксических ролей, тогда как изданный текст имеет номинативное ὃ и активный глагол. Поскольку место помечено †, вероятный смысл можно пояснить только в сноске, а не выдавать за несомненный текст.
  - severity: medium
    issue: Добавлено «своими»
    rationale: Притяжательное местоимение отсутствует в греческом. Хотя оно может подразумеваться, при текстуальной трудности лучше не уточнять принадлежность желаний и дел.
  - severity: low
    issue: «порочными желаниями и делами» ослабляет модификацию второго существительного
    rationale: В греческом πονηροῖς непосредственно согласовано с «делами». Перевод «порочные желания и злые дела» яснее сохраняет распределение определения.
  revised_text: Ибо, когда злая душа отходит, её мучит злой дух, который также служил в порочных желаниях и злых делах.†
  revised_footnotes:
  - marker: †
    text: 'Греческий текст в этом месте испорчен или неясен († в издании): буквально — «который также служил в желаниях и злых делах». По смыслу некоторые понимают это как указание на то, что душа служила злому духу; такая перестройка не выражена прямо в дошедшей греческой форме.'
    reason: Сохраняет синтаксис изданного греческого текста и явно отмечает его текстуальную неопределённость, не навязывая одну реконструкцию.
  revision_rationale: Перевод исправлен, чтобы не подменять формально засвидетельствованную греческую конструкцию реконструированным «душа служила духу». Текстуальная проблема, обозначенная в исходном издании, сохранена сноской. Английское «enslaved it» не принято, поскольку оно не соответствует активному ἐδούλευεν.
