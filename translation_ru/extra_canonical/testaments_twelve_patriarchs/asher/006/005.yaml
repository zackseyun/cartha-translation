base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/005.yaml
  text: For when a wicked soul departs, it is tormented by the evil spirit, which also enslaved it in lusts and wicked deeds.
translation:
  language: ru
  text: Ибо, когда злая душа отходит, её мучит злой дух, которому она и служила своими порочными желаниями и делами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρὰ ἡ ψυχὴ
  choice: злая душа
  rationale: Передаёт нравственную характеристику ποηρά прямо и сохраняет повтор с последующим «злой дух».
- source_word: ἀπέρχεται
  choice: отходит
  rationale: Сохраняет эвфемистическую и несколько неопределённую формулировку об уходе души, не добавляя отсутствующего в греческом уточнения «из тела» или «из жизни».
- source_word: βασανίζεται
  choice: её мучит
  rationale: Естественно передаёт страдательное «подвергается мучению» при выраженном деятеле ὑπὸ τοῦ πονηροῦ πνεύματος.
- source_word: ἐδούλευεν
  choice: служила
  rationale: 'Форма является активным имперфектом: подразумеваемый субъект — душа, а относительное ὃ относится к духу. Поэтому смысл — «дух, которому душа служила», а не «дух, который порабощал её».'
- source_word: ἐν ἐπιθυμίαις καὶ ἔργοις πονηροῖς
  choice: своими порочными желаниями и делами
  rationale: Творительный падеж естественно выражает сферу или способ служения; «своими» проясняет связь с душой без изменения смысла. «Порочными» здесь звучит естественнее повторного «злыми».
theological_decisions:
- issue: Кто кому служил в выражении ὃ καὶ ἐδούλευεν
  choice: Душа служила злому духу
  alternative: Злой дух порабощал душу
  rationale: ἐδούλευεν — активная форма глагола δουλεύω («служить, быть рабом»), тогда как для смысла «порабощал» ожидалась бы иная синтаксическая конструкция. Выбор следует греческой грамматике, даже несмотря на формулировку английского консультационного текста.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным и понятным синтаксисом. Сохранены параллель «злая душа — злой дух» и неопределённость глагола «отходит».
