  verdict: revise
  source_fidelity: В черновике верно переданы Προσέχετε, обращение «дети мои», «заповеди Господа» и «истина». Однако «неуклонно» не передаёт достаточно определённо μονοπροσώπως — образ «единого лица», то есть цельности/отсутствия раздвоенности. Кроме того, русская конструкция способна представить «следование истине» единственным содержанием заключительного оборота, тогда как в греческом отдельно стоят внимание к заповедям и следование истине.
  naturalness: «Будьте внимательны к» естественно, но «внимайте заповедям» более компактно и соответствует наставительному регистру. Координированные повелительные формы в исправленном тексте естественно передают греческое повеление с причастием без тяжеловесной кальки.
  terminology: «Господь», «заповеди» и «истина» сохранены. «С единой устремлённостью» передаёт μονοπροσώπως современным литературным языком, не навязывая более узкого толкования («без лицемерия» или «с чистым сердцем»).
  issues:
