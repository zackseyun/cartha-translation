  text: Therefore take heed, you also, my children, following the commandments of the Lord with singleness of purpose, in truth.
translation:
  language: ru
  text: Итак, и вы, дети мои, внимайте заповедям Господа и с единой устремлённостью следуйте истине.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέχετε
  choice: будьте внимательны к
  rationale: Глагол означает «обращать внимание, быть настороже, остерегаться»; в сочетании с винительным τὰς ἐντολάς естественно передаётся призывом внимательно относиться к заповедям.
- source_word: τὰς ἐντολὰς Κυρίου
  choice: к заповедям Господа
  rationale: Прямо сохраняет ключевую лексику и родительный оборот греческого текста.
- source_word: μονοπροσώπως
  choice: неуклонно
  rationale: Редкое наречие буквально связано с единой направленностью или «одним лицом»; «неуклонно» естественно выражает цельность и отсутствие раздвоенности, не перегружая русский текст неясной калькой.
- source_word: ἀκολουθοῦντες τῇ ἀληθείᾳ
  choice: следуя истине
  rationale: Сохраняет причастную конструкцию и дательный объект при ἀκολουθέω; «истине» оставлено без уточнения, как в источнике.
theological_decisions:
- issue: Связь заповедей Господа с истиной
  choice: 'Не отождествлять их пояснительной вставкой, а сохранить отдельные элементы: внимание к заповедям и следование истине.'
  alternative: «следуя заповедям Господа в истине»
  rationale: Греческий синтаксис ставит τὰς ἐντολάς при Προσέχετε, а τῇ ἀληθείᾳ — при ἀκολουθοῦντες; выбранный вариант сохраняет это различие и не снимает возможного смыслового напряжения.
translation_notes:
  register: Современный литературный русский, наставительный и достойный по тону. Порядок слов слегка перестроен ради естественности; обращение «дети мои» и связка «итак» сохранены.
