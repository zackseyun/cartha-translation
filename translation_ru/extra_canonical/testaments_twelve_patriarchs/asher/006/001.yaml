    rationale: τὰς ἐντολὰς Κυρίου относится к Προσέχετε, а τῇ ἀληθείᾳ — к ἀκολουθοῦντες. Исправление ясно сохраняет и внимание к заповедям, и следование истине.
  revised_text: Итак, и вы, дети мои, внимайте заповедям Господа и с единой устремлённостью следуйте истине.
