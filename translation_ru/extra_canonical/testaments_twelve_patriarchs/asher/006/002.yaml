source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ὅτι οἱ διπρόσωποι δισσῶς †κολάζονται⁵, ⌜Ὅτι καὶ πράσσουσι τὸ κακόν, καὶ συνευδοκοῦσι τοῖς πράσσουσιν⁶, *μιμούμενοι τὰ πνεύματα τῆς πλάνης καὶ κατὰ τῶν ἀνθρώπων συναγωνιζόμενοι⁷.⌝
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/002.yaml
  text: For the double-faced are punished doubly, because they both do evil and approve those who do it, imitating the spirits of deceit and contending against men.
translation:
  language: ru
  text: 'Ибо двуличные наказываются вдвойне[a]: они и сами творят зло, и одобряют тех, кто творит его, подражая духам заблуждения и вместе с ними борясь против людей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописных свидетельствах чтение слова, переведённого как «наказываются», не вполне уверенно.
    reason: В издании Charles слово κολάζονται отмечено крестом как текстуально сомнительное; сноска сообщает об этом, не перегружая основной текст.
lexical_decisions:
- source_word: διπρόσωποι
  choice: двуличные
  rationale: Передаёт буквальный образ «имеющих два лица» и естественно обозначает непоследовательных, лицемерных людей в современном русском языке.
- source_word: δισσῶς κολάζονται
  choice: наказываются вдвойне
  rationale: Сохраняет словесную связь между двуличием и двойным наказанием и не уточняет ни исполнителя, ни характер наказания.
- source_word: συνευδοκοῦσι
  choice: одобряют
  rationale: Передаёт активное нравственное согласие с поступками других, а не только пассивное допущение.
- source_word: τὰ πνεύματα τῆς πλάνης
  choice: духам заблуждения
  rationale: '«Заблуждение» сохраняет широту πλάνη: обман, уклонение от истины и введение в заблуждение.'
- source_word: συναγωνιζόμενοι
  choice: вместе с ними выступая
  rationale: Сохраняет значение совместного противоборства; местоимение делает подразумеваемую связь с духами явной ради естественности русского синтаксиса.
theological_decisions:
- issue: Кто совершает наказание и в чём оно состоит
  choice: 'Оставлено без уточнения: «наказываются»'
  alternative: «Бог наказывает их» или указание на посмертное наказание
  rationale: Греческий пассив не называет действующее лицо и не определяет время либо вид наказания.
- issue: Природа «духов заблуждения»
  choice: Сохранено выражение источника без поясняющей классификации
  alternative: «злые духи», «демоны» или персонифицированные человеческие склонности
  rationale: Текст не разрешает однозначно природу этих духов; перевод не должен устранять эту открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством параветхозаветного наставления. Сохранены риторический параллелизм («и сами… и…») и игра между двуличием и двойным наказанием; архаизмы и конфессионально окрашенные уточнения исключены.
