base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/004.yaml
  text: For the ends of men reveal their righteousness, and they are made known to the angels of the Lord and to Beliar.
translation:
  language: ru
  text: Ибо кончины людей обнаруживают их праведность, и они становятся известны[a] ангелам Господа и Велиара.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст этой части стиха не вполне надёжен; неясно, что именно «становится известно»: люди или их кончины.'
    reason: В издании оборот отмечен как текстуально сомнительный, а грамматический антецедент γνωρίζονται неоднозначен.
lexical_decisions:
- source_word: τὰ τέλη τῶν ἀνθρώπων
  choice: кончина людей
  rationale: Во множественном греческом обороте речь идёт об исходе земной жизни каждого человека. Русское собирательное единственное число звучит естественно и сохраняет смысл жизненного конца, а не цели.
- source_word: δεικνύουσι
  choice: обнаруживает
  rationale: Глагол означает «показывать, выявлять»; «обнаруживает» естественно передаёт мысль о том, что итог жизни делает нравственную сущность явной.
- source_word: τὴν δικαιοσύνην αὐτῶν
  choice: их праведность
  rationale: Сохранён прямой богословски значимый эквивалент δικαιοσύνη без замены более широкими понятиями вроде «характер» или «поступки».
- source_word: τοῖς ἀγγέλοις Κυρίου, καὶ τοῦ Βελίαρ
  choice: ангелам Господа и Велиара
  rationale: 'Оба родительных определения — Κυρίου и τοῦ Βελίαρ — естественно относятся к существительному «ангелам»: ангелам, принадлежащим соответственно Господу и Велиару.'
theological_decisions:
- issue: К кому относится «Велиара»
  choice: 'к «ангелам»: «ангелам Господа и Велиара»'
  alternative: «ангелам Господа и самому Велиару»
  rationale: Форма τοῦ Βελίαρ — родительный падеж, параллельный Κυρίου, тогда как значение «Велиару» ожидало бы дательного падежа. Поэтому греческий текст говорит о двух группах ангелов.
- issue: Антецедент формы γνωρίζονται («становятся известны»)
  choice: сохранить местоименную неоднозначность
  alternative: явно назвать «людей» или «их кончину»
  rationale: Греческая форма допускает не вполне ясную связь в данном текстуально трудном месте; эксплицитное уточнение без достаточных оснований разрешило бы напряжение за автора.
translation_notes:
  register: Современный литературный русский язык с достоинством псевдоэпиграфического наставления. «Кончина» выбрана как понятное, но возвышенное слово; синтаксическая неоднозначность второй части намеренно сохранена и пояснена сноской.
