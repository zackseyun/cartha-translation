  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/006.yaml
  text: But if it is at rest in joy, it recognizes the angel of peace, and he brings it into eternal life.
translation:
  language: ru
  text: Но если она спокойна в радости, то узнаёт ангела мира, и он вводит её в вечную жизнь.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст последней части стиха, по-видимому, испорчен или передаёт синтаксически неясную форму: при продолжающемся подлежащем «душа» буквально получается «она вводит его», причём местоимение стоит в мужском роде. По смыслу контекста здесь принято: «ангел мира вводит её», то есть душу, в вечную жизнь.'
    reason: Явно отмечает грамматическую несогласованность оригинального текста и сообщает читателю, что перевод следует контекстуальному смысловому исправлению, не выдавая его за бесспорную форму греческого текста.
lexical_decisions:
- source_word: ἥσυχος
  choice: пребывает в покое
  rationale: Передаёт состояние тишины и внутреннего покоя естественным современным русским оборотом; форма греческого текста синтаксически неровна.
- source_word: ἐν χαρᾷ
  choice: в радости
  rationale: Сохраняет образ действия или состояния без уточнения причинной либо временной связи.
- source_word: γνωρίζει
  choice: узнаёт
  rationale: Передаёт распознавание или узнавание ангела; более сильное «познаёт» здесь звучало бы отвлечённо и могло бы привнести лишний богословский оттенок.
- source_word: ὁ ἄγγελος τῆς εἰρήνης
  choice: ангел мира
  rationale: Формально и естественно передаёт родительную конструкцию; «мир» понимается как покой и примирённость, а не как вселенная.
- source_word: ζωὴ αἰώνιος
  choice: вечная жизнь
  rationale: Устоявшееся и точное русское соответствие выражению.
theological_decisions:
- issue: Кто вводит кого в вечную жизнь
  choice: ангел мира вводит душу в вечную жизнь
  alternative: душа вводит ангела в вечную жизнь
  rationale: Греческое αὐτόν формально имеет мужской род («его»), однако смысл контекста и консультационный английский текст указывают на ангела как действующее лицо и душу как вводимую. Неустойчивость текста отмечена в сноске, а не скрыта.
- issue: Неявное подлежащее в начале стиха
  choice: местоимение «она», относящееся к душе из контекста
  alternative: безличная или неопределённо-личная конструкция
  rationale: Так сохраняется связность с предшествующим рассуждением о душе и естественный русский синтаксис, при этом новое понятие в стих не вводится.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной литературы. Формулировка ясна обычному читателю; синтаксическая неровность греческого текста не воспроизводится механически, но существенная текстовая трудность раскрыта в сноске.
