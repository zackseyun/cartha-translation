  text: But you, my children, do not become double-faced like them, with both goodness and wickedness; rather cling to goodness alone, because the Lord God rests in it, and people long for it. But flee wickedness, destroying its scheme by your good deeds; for the double-faced are not of God, but serve their own desires, so that they may please Beliar.
translation:
  language: ru
  text: III. 1 Вы же, дети мои, не становитесь, как они, двуличными, сочетая в себе добро и зло, но держитесь одного лишь добра, потому что в нём находит покой Господь Бог и к нему стремятся люди. 2 А от зла бегите, разрушая его замысел своими добрыми делами, потому что двуличные не принадлежат Богу, но служат собственным желаниям, чтобы угождать Велиару[a] и людям, подобным им.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Велиар — имя олицетворённого зла, противника Бога, в древней иудейской литературе.
    reason: Кратко поясняет незнакомое современному читателю имя, не навязывая более узкого конфессионального отождествления.
  - marker: b
    text: 'Буквально: «и подобным им людям»; греческое местоимение допускает некоторую неясность в том, к кому именно относится сходство.'
    reason: Сохраняет местоименную неоднозначность оригинала и отмечает фразу, отсутствующую в английском консультационном тексте.
lexical_decisions:
- source_word: διπρόσωποι
  choice: двуличными
  rationale: Буквально «двуликими/двули́чными»; современное «двуличными» сохраняет образ раздвоенности между добром и злом и нравственный смысл контекста.
- source_word: κολλήθητε
  choice: держитесь
  rationale: Глагол означает «прилепитесь, крепко присоединитесь»; «держитесь» естественно передаёт постоянную и исключительную приверженность добру.
- source_word: ἀναπαύεται ἐν αὐτῇ
  choice: в нём пребывает
  rationale: «Пребывает» звучит естественно и достойно, сохраняя образ Божьего покоя/пребывания в добре без излишней конкретизации.
- source_word: τὸ διαβούλιον
  choice: его замысел
  rationale: Передаёт значение намерения, плана или замысла; местоимение соотнесено со злом по непосредственному контексту.
- source_word: οὐκ εἰσὶ τοῦ Θεοῦ
  choice: не принадлежат Богу
  rationale: Родительный принадлежности передан прямо и естественно; формулировка не усиливает текст до утверждения о происхождении или предопределении.
- source_word: Βελίαρ
  choice: Велиару
  rationale: Сохранена греческая форма имени Βελίαρ, обычная для данного псевдоэпиграфического корпуса, без отождествления в основном тексте с иным именованием.
- source_word: τοῖς ὁμοίοις αὐτῶν ἀνθρώποις
  choice: подобным себе людям
  rationale: Фраза, присутствующая в греческом источнике, сохранена; возвратное «себе» естественно относит сходство к двуличным людям, хотя местоименная связь в греческом несколько сжата.
theological_decisions:
- issue: Образ пребывания Господа Бога в добре
  choice: «в нём пребывает Господь Бог»
  alternative: «в нём почивает Господь Бог»
  rationale: 'Выбрано нейтральное «пребывает»: оно сохраняет богословский образ близости и присутствия, не превращая метафору ἀναπαύεται в утверждение о буквальном отдыхе.'
- issue: Принадлежность двуличных Богу
  choice: «не принадлежат Богу»
  alternative: «не от Бога»
  rationale: Так точнее передан родительный τοῦ Θεοῦ и сохранено напряжение между нравственной принадлежностью Богу и рабством собственным желаниям.
- issue: Заключительный адресат угождения
  choice: сохранить «Велиару и подобным себе людям»
  alternative: закончить словами «угождать Велиару» вслед за английским консультационным слоем
  rationale: Греческий источник явно содержит καὶ τοῖς ὁμοίοις αὐτῶν ἀνθρώποις, поэтому фразу нельзя опускать; перевод не догматизирует точную отсылку местоимения.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Обращение «дети мои» и параллелизм «добро — зло» сохранены; архаизмы сведены к минимуму. Нумерация главы и стихов воспроизведена для удобства сверки.
