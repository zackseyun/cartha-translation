  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001.yaml
  text: '1[1]. The copy of the testament of Asher.


    2. In the one hundred and twenty-fifth year of his life, while still healthy, he said to them, “Hear, children of Asher, your father, and I will show you everything upright before God.


    3. God has given two ways to the sons of men, and two purposes, and two actions, and two modes, and two outcomes.


    4. Therefore all things are twofold[2], set one over against the other.


    5. For there are two ways, of good and of evil; and in them are the two purposes in our breasts, distinguishing them.


    6. If, then, the soul desires to walk well, it does all its deeds in righteousness; and even if it sins, it immediately repents.


    7. For by thinking righteous thoughts and casting away wickedness, it at once overturns evil and uproots sin.


    8. But if its purpose inclines to evil, all its deeds are in wickedness, driving away the good and clinging to the evil, and it is ruled by Beliar; and even if it does something good, it turns it into evil.


    9. For whenever it begins to do good in an evil way, it drives the end of the action for him into evil, because the treasure of its purpose is filled with an evil spirit.


    10. My children, obey your father, and bury me near my fathers.”


    11. And after he had drawn up his feet, he fell asleep in peace.


    12. And after five years they carried him up to Hebron[3], and placed him with his fathers.'
translation:
  language: ru
  text: 'Завещание Асира, десятого сына Иакова и Зелфы


    1. Вот список завещания Асира — слов, которые он сказал своим сыновьям на сто двадцать пятом году своей жизни. 2. Будучи в добром здравии, он сказал им: «Выслушайте, дети Асира, вашего отца, и я укажу вам всё, что праведно перед Богом. 3. Бог дал сынам человеческим два пути, два намерения, два рода дел, два образа действий и два исхода. 4. Поэтому всё двойственно: одно противостоит другому. 5. Ибо есть два пути — добра и зла; и в них — два намерения в нашей груди, различающие их[a]. 6. Итак, если душа желает хорошо поступать[b], то все свои дела совершает в праведности; и даже если согрешит, тотчас раскаивается. 7. Помышляя о праведном и отвергая нечестие, она тотчас низлагает зло и искореняет грех. 8. Если же её намерение склоняется ко злу[c], то все её дела совершаются в нечестии: она отталкивает добро, прилепляется ко злу и оказывается под властью Велиара; и даже если сделает что-либо доброе, обращает это во зло. 9. Ибо, когда она начинает делать добро, конец этого дела увлекает его
    ко злу[d], потому что сокровищница её намерения наполнена злым духом».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в нашей груди». Греческое слово сохраняет телесный образ груди как средоточия внутреннего размышления; возможный более свободный перевод — «в наших сердцах».'
    reason: lexical_alternative
  - marker: b
    text: Греческий текст в этом месте повреждён или не вполне устойчив; буквально сохранившаяся фраза близка к «желает хорошо идти».
    reason: textual_uncertainty
  - marker: c
    text: 'Греческая фраза в начале стиха не вполне ясна; далее в последовательности причастий также происходит смена грамматического рода. Перевод передаёт вероятный смысл: внутреннее намерение склоняется ко злу.'
    reason: textual_uncertainty
  - marker: d
    text: 'В греческом тексте здесь происходит смена грамматической перспективы: речь идёт о душе и её деле, но затем появляется местоимение мужского рода — «его». Перевод сохраняет эту смену, не определяя её точнее, чем позволяет текст.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: ὑγιαίνων
  choice: будучи в добром здравии
  rationale: Передаёт обстоятельственное причастие и подчёркивает, что Асир произносит завещание, ещё сохраняя здоровье.
- source_word: εὐθές
  choice: праведно
  rationale: В данном нравственном контексте речь идёт о том, что право и угодно перед Богом; русское «праведно» естественнее буквального «прямо».
- source_word: διαβούλια
  choice: намерения
  rationale: Слово обозначает внутренние решения и нравственную направленность, а не только внешние планы или советы.
- source_word: πράξεις
  choice: рода дел / дела
  rationale: В перечислении множественное число передано как парные категории дел, а далее — как конкретные поступки души.
- source_word: τρόπους
  choice: образы действий
  rationale: Так сохраняется отличие от уже названных ὁδοί, «путей», без неестественного русского «модусы».
- source_word: τέλεα
  choice: исходы
  rationale: Обозначает завершения или конечные результаты нравственных путей.
- source_word: ἐν κατέναντι τοῦ ἑνός
  choice: противостоящие одна другой
  rationale: Сохраняет резкую антитетическую структуру греческой фразы и при этом звучит естественно по-русски.
- source_word: στέρνοις
  choice: в нашей груди
  rationale: Сохранён конкретный телесный образ груди как вместилища внутреннего размышления; «в сердцах» было бы более истолковывающим.
- source_word: πορευθῆναι
  choice: идти добрым путём
  rationale: Сохраняет библейскую метафору нравственного хождения, одновременно делая спорное сочетание понятным по-русски.
- source_word: μετανοεῖ
  choice: раскаивается
  rationale: Контекст прямо говорит о совершённом грехе и немедленном нравственном обращении.
- source_word: Βελίαρ
  choice: Велиар
  rationale: Передана форма собственного имени именно греческого свидетеля, без замены на «Велиал» или отвлечённое «нечестие».
theological_decisions:
- issue: Два пути и парные нравственные начала
  choice: Сохранить последовательное противопоставление двух путей, намерений, действий и исходов
  alternative: Свести речь к общему психологическому выбору или истолковать её как абсолютный метафизический дуализм
  rationale: Текст подчёркивает нравственную двойственность человеческого пути и внутреннего намерения, но сам по себе не формулирует учения о двух равных космических началах.
- issue: Личный или отвлечённый характер Βελίαρ
  choice: Передать как личное имя «Велиар»
  alternative: Перевести как «нечестие» либо нормализовать как «Велиал»
  rationale: В греческом тексте Велиар выступает господствующей злой силой; транслитерация сохраняет и личностный оттенок, и форму источника.
- issue: Действие души в стихах 6–9
  choice: Сохранить олицетворение души и внутреннего намерения, не устраняя смену грамматической перспективы
  alternative: Последовательно заменить все действия души прямыми действиями человека
  rationale: Греческий текст намеренно описывает душу и намерение как действующие начала; сглаживание ослабило бы нравственно-антропологическое напряжение отрывка.
translation_notes:
  register: Современный литературный русский с достоинством завещательного наставления. Синтаксис умеренно библейский, но без архаизмов; повторение «два» и резкие противопоставления сохранены. Переведён только предоставленный греческий материал, заканчивающийся стихом 9; отсутствующие в исходном фрагменте стихи 10–12 из английского консультационного слоя не добавлены.
