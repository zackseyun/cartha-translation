  - severity: low
    issue: 'Ст. 6: «помогает бедняку» менее конкретно, чем ἀναπαύει.'
    rationale: Глагол означает «даёт отдых, облегчает, успокаивает». «Даёт облегчение бедняку» сохраняет контраст и ближе к источнику.
