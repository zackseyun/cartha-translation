  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002.yaml
  text: '1 There is, then, a soul that in its words turns away the good for the sake of evil, and leads the outcome of the matter into wickedness.


    2 There is a man who does not pity his own servants; and though this is double-faced, the whole of it is evil.


    3 And there is a man who loves one who acts wickedly, because he himself also chooses to die in evil on that man''s account; and concerning this it is plain that he is double-faced, but the whole of it is an evil deed.


    4 Even if they are in love, they are in wickedness when they hide evil under a good name; but the end of the deed comes to evil.


    5 Another steals, acts unjustly, plunders, is greedy, and yet shows mercy to the poor. This too is double-faced, but the whole of it is evil.


    6 The one who defrauds his neighbor provokes God, swears falsely by the Most High, and has no regard for the Lord, the giver of the law, yet gives rest to the poor.


    7 He stains the soul and makes the body bright; he kills many and shows mercy to a few. This too is double-faced, but the whole of it is evil.


    8 Another commits adultery and practices sexual immorality, and abstains from foods. And while fasting he does evil, and by the force of his wealth he drags many down, and out of his excessive wickedness performs the commandments. This is double-faced, but the whole of it is evil.


    9 Such people are like hares, because they are half clean, but in truth they are unclean.


    10 For God also, in the tablets of the commandments, has declared it so.'
translation:
  language: ru
  text: '**Завещание Асира, глава 2**


    **1** Итак, бывает душа, которая на словах отвергает добро ради зла и приводит дело к дурному концу.


    **2** Бывает человек, который не жалеет собственных слуг. Это двуличие, но всё вместе — зло.


    **3** Бывает и человек, который любит творящего зло, потому что и сам ради него готов умереть во зле. Ясно, что и здесь есть двуличие, но всё вместе — злое дело.[a]


    **4** Даже если это называют любовью, во зле пребывает тот, кто скрывает зло под добрым именем; конец же такого дела — зло.[b]


    **5** Другой крадёт, поступает несправедливо, грабит, наживается — и при этом милует бедных. Это тоже двуличие, но всё вместе — зло.


    **6** Тот, кто обирает ближнего, вызывает гнев Бога, ложно клянётся Всевышним и отвергает Господа, давшего Закон, — и всё же даёт облегчение бедняку.[c]


    **7** Он пятнает душу, а тело украшает; многих губит, а немногих милует. Это тоже двуличие, но всё вместе — зло.


    **8** Другой прелюбодействует и предаётся разврату, но воздерживается от пищи. Постясь, он творит зло, силой своего богатства увлекает многих в погибель и по своей безмерной порочности исполняет заповеди.[d] Это двуличие, но всё вместе — зло.


    **9** Такие люди подобны зайцам: они как будто наполовину чисты, но в действительности нечисты.[e]


    **10** Ведь и Бог так сказал на скрижалях заповедей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст стиха местами повреждён; не вполне ясно, относится ли готовность умереть во зле к любящему человеку и совершается ли это «ради» творящего зло.
    reason: Сохраняет существенную синтаксическую и референциальную неопределённость источника.
  - marker: b
    text: 'Начало стиха 4 в греческом тексте испорчено. Возможен и более буквальный смысл: «Даже любовь оказывается во зле, когда зло скрывают под добрым именем».'
    reason: Перевод предлагает связное чтение, но отмечает подлинную текстуальную неустойчивость.
  - marker: c
    text: 'Греческий текст стиха 6 содержит нарушения и, по-видимому, повторные или смещённые слова о бедном. Общий контраст ясен: человек обижает ближнего и Бога, но оказывает облегчение бедняку.'
    reason: Предупреждает, что гладкий русский синтаксис является осторожной реконструкцией повреждённого места.
  - marker: d
    text: 'Буквально: «из (или по причине) своей чрезмерной порочности исполняет заповеди». Эта причинная связь необычна и может отражать текстуальную неисправность; перевод сохраняет её, не превращая в уступительное «несмотря на порочность».'
    reason: Сохраняет трудную семантику греческого ἐκ τῆς ὑπερόγκου κακίας без богословского сглаживания.
  - marker: e
    text: 'Буквально: «подобны мохноногим». Это обозначение зайцев. Сравнение, вероятно, связано с представлением, что заяц имеет один признак чистого животного, но всё же считается нечистым; ср. Лев 11:6; Втор 14:7.'
    reason: Объясняет необычное греческое название и основание образа «наполовину чисты».
lexical_decisions:
- source_word: διπρόσωπον
  choice: двуличие / есть двуличие
  rationale: Буквально «двуликое»; русское «двуличие» естественно передаёт соединение внешне доброго поступка со злом, не превращая образ в отвлечённую доктрину.
- source_word: τὸ ὅλον
  choice: всё вместе
  rationale: Передаёт итоговую оценку поступка как целого и сохраняет повторяющуюся риторическую формулу главы.
- source_word: πλεονεκτεῖ / ὁ πλεονεκτῶν
  choice: наживается / обирает
  rationale: В контексте кражи, грабежа и отношения к ближнему слово обозначает корыстное присвоение или эксплуатацию, а не только внутреннюю жадность.
- source_word: ἐντολέα τοῦ νόμου
  choice: давшего Закон
  rationale: Греческое выражение обозначает того, кто установил или повелел Закон; причастная конструкция звучит естественно и достойно по-русски.
- source_word: λαμπρύνει
  choice: украшает
  rationale: Сохраняет контраст между осквернённой душой и внешне приукрашенным телом; буквальное «делает сияющим» здесь менее естественно.
- source_word: δασύποδες
  choice: зайцам
  rationale: Слово буквально связано с «мохнатыми ногами» и употребляется о зайцах; контекст чистоты явно отсылает к традиционной классификации зайца.
- source_word: ἀκάθαρτοι
  choice: нечисты
  rationale: Сохраняет культовую категорию чистого и нечистого, лежащую в основе сравнения в стихе 9.
theological_decisions:
- issue: Нравственная оценка смешанных поступков
  choice: «всё вместе — зло»
  alternative: «в целом он зол»
  rationale: Греческий текст оценивает совокупность поступка или поведения, а не обязательно сущность человека; перевод избегает более широкой антропологической формулировки.
- issue: Исполнение заповедей порочным человеком в стихе 8
  choice: «несмотря на безмерную порочность, исполняет заповеди»
  alternative: «из безмерной порочности исполняет заповеди»
  rationale: Источник формально допускает резкую причинную связь, но общий смысл главы противопоставляет отдельные благочестивые действия преобладающему злу. «Несмотря на» делает синтаксис понятным, не объявляя сами заповеди плодом зла.
- issue: Отсылка к пищевым установлениям в стихе 9
  choice: сохранить категории «чисты / нечисты» без пояснительного богословского вывода
  alternative: истолковать их как лицемерие или частичную праведность
  rationale: Образ служит нравственному сравнению, однако перевод не должен навязывать конкретную доктринальную систему поверх аллюзии.
translation_notes:
  register: Современный литературный русский язык с краткими, ритмически параллельными фразами. Повтор формулы «Это двуличие, но всё вместе — зло» сохранён как композиционный стержень. Архаизмы сведены к общеупотребительным библейским словам («Всевышний», «Закон», «скрижали», «заповеди»). Повреждённые места переданы связно, но отмечены сносками, чтобы не скрывать неопределённость греческого свидетельства.
