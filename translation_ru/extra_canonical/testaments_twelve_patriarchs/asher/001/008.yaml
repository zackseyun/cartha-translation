source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἐὰν δὲ *ἐν †πονηρᾷ³⁶ κλίνῃ³⁷ †τὸ διαβούλιον†³⁸, *πᾶσα πρᾶξις αὐτῆς ἐστιν³⁹ ἐν πονηρίᾳ, καὶ⁴⁰ ἀπωθουμένη⁴¹ τὸ ἀγαθόν, *καὶ προσκολλώμενος⁴² τὸ κακόν, καὶ κυριευθεὶς⁴³ ὑπὸ⁴⁴ τοῦ Βελίαρ· κἂν⁴⁵ ἀγαθὸν⁴⁶ πράξει⁴⁷, Γἐν πονηρίᾳ⁴⁸ αὐτὸ⁴⁹ μεταστρέφει⁵⁰˥.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/008.yaml
  text: But if the intent inclines to evil, all its actions are in wickedness, driving away the good and clinging to the evil, and ruled by Beliar; and even if it does something good, it turns it into evil.
translation:
  language: ru
  text: 'Но если намерение склоняется ко злу, то все его дела совершаются в нечестии: оно отвергает добро, прилепляется ко злу и оказывается во власти Велиара; и даже если сделает что-нибудь доброе, обращает это во зло.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ διαβούλιον
  choice: намерение
  rationale: Передаёт внутренний замысел или направленность решения; естественнее в данном контексте, чем буквальное «совещание» или более отвлечённый «помысел».
- source_word: ἐν πονηρίᾳ
  choice: в нечестии
  rationale: Сохраняет нравственно-религиозный оттенок πονηρία и отличает его от конкретного κακόν — «зла».
- source_word: ἀπωθουμένη τὸ ἀγαθόν
  choice: отвергает добро
  rationale: Передаёт активное отталкивание или удаление добра естественным современным русским выражением.
- source_word: προσκολλώμενος τὸ κακόν
  choice: прилепляется ко злу
  rationale: Сохраняет сильный образ тесной привязанности, выраженный глаголом προσκολλάω.
- source_word: κυριευθεὶς ὑπὸ τοῦ Βελίαρ
  choice: оказывается во власти Велиара
  rationale: Передаёт пассивное подчинение господству Велиара без внесения дополнительных богословских уточнений.
- source_word: μεταστρέφει
  choice: обращает
  rationale: Отражает значение изменения или превращения добра во зло и соответствует достоинству литературного регистра.
theological_decisions:
- issue: Степень власти Велиара над склонённым ко злу намерением
  choice: оказывается во власти Велиара
  alternative: управляется Велиаром
  rationale: Формулировка сохраняет идею господства из κυριευθείς, но не уточняет механизм контроля и не усиливает её до полного лишения воли.
- issue: Превращение доброго поступка во зло
  choice: обращает это во зло
  alternative: делает его злым
  rationale: Сохранена напряжённая мысль источника о преобразовании даже доброго дела, без пояснения, происходит ли это из-за мотива, последствий или нравственного качества действующего.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной литературы. Синтаксис сделан ясным за счёт двоеточия и восстановления подлежащего «оно», относящегося к намерению. Образ «прилепляется» сохранён как выразительный и привычный для библейского регистра, но в целом перевод избегает архаизмов.
