base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/003.yaml
  text: God has given two ways to the sons of men, and two purposes, and two actions, and two modes, and two ends.
translation:
  language: ru
  text: Бог дал сынам человеческим два пути, два намерения, два дела, два образа действий и два исхода.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁδοὺς
  choice: пути
  rationale: Прямой и естественный эквивалент, сохраняющий нравственную метафору двух путей.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: сынам человеческим
  rationale: Формально близкая передача библейского выражения, уместная для достоинства завещательного текста.
- source_word: διαβούλια
  choice: намерения
  rationale: Передаёт замыслы или решения внутреннего совета, не сужая значение до одних мыслей.
- source_word: πράξεις
  choice: рода дел
  rationale: В контексте парной классификации обозначает совершаемые поступки; добавление «рода» делает русское перечисление естественным и подчёркивает две категории.
- source_word: τρόπους
  choice: образы действий
  rationale: Передаёт способы или манеры поведения яснее, чем буквальное и здесь расплывчатое «способы».
- source_word: τέλεα
  choice: исхода
  rationale: Сохраняет возможное значение конечных результатов или завершений, не подменяя его телеологически более узким «цели».
theological_decisions:
- issue: Источник двух путей и остальных пар
  choice: Сохранено прямое утверждение «Бог дал»
  alternative: «Бог положил перед людьми» или смягчение божественной причинности
  rationale: Греческое ἔδωκεν прямо приписывает действие Богу; напряжение, связанное с происхождением двух нравственных альтернатив, не следует устранять толкованием.
- issue: Значение τέλεα
  choice: «два исхода»
  alternative: «две цели» или «два конца»
  rationale: «Исхода» естественно по-русски выражает конечный результат и сохраняет смысловую открытость между завершением и последствием.
translation_notes:
  register: Современный литературный русский с умеренно библейским оборотом «сынам человеческим». Синтаксический параллелизм греческого перечисления сохранён, но однообразное повторение союза перед каждым членом слегка сглажено по нормам русского языка. Поздняя ревизия не принята, поскольку приведённый в ней текст не соответствует данному греческому источнику.
