base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/005.yaml
  text: For there are two ways, of good and of evil; and in them are the two purposes in our breasts, distinguishing them.
translation:
  language: ru
  text: Ибо есть два пути — добра и зла; и в них — два намерения в нашей груди, различающие их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁδοὶ … δύο, καλοῦ καὶ κακοῦ
  choice: два пути — добра и зла
  rationale: Сохраняет образ двух путей и родительные определения оригинала в естественной русской форме.
- source_word: διαβούλια
  choice: намерения
  rationale: Передаёт внутренние замыслы или устремления; нейтральнее, чем «помыслы», и не снимает смысловой напряжённости фразы.
- source_word: ἐν στέρνοις ἡμῶν
  choice: в нашей груди
  rationale: Сохраняет конкретный телесный образ оригинала, не заменяя его интерпретирующим «в наших сердцах».
- source_word: διακρίνοντα αὐτά
  choice: различающие их
  rationale: Формально сохраняет причастие и неоднозначность местоимения αὐτά, которое может относиться к путям или к добру и злу.
theological_decisions:
- issue: Соотношение двух путей и двух внутренних намерений
  choice: Сохранена формулировка, согласно которой намерения «различают их».
  alternative: «определяющие выбор между ними» или «разделяющие их»
  rationale: Оригинал не объясняет точный механизм действия внутренних намерений; более развёрнутые варианты внесли бы отсутствующее в тексте толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной близостью к греческому синтаксису. Тире помогают ясно передать эллиптическую структуру второй части стиха.
