source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ὅτε γὰρ⁵¹ ἄρξεται⁵² *τὸ ἀγαθὸν ποιεῖν⁵³, τὸ τέλος τῆς πράξεως *εἰς πονηρὸν αὐτῷ ἐλαύνει⁵⁴. ἐπειδὴ ὁ⁵⁵ θησαυρὸς⁵⁶ τοῦ διαβουλίου⁵⁷ πονηροῦ⁵⁸ πνεύματος πεπλήρωται⁵⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/009.yaml
  text: For whenever it begins to do good, the end of the action drives him into evil, because the treasure of its purpose is filled with an evil spirit.
translation:
  language: ru
  text: Ибо когда начинает делать добро[a], исход поступка влечёт его ко злу, потому что сокровищница замысла злого духа полна.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом подлежащее глагола «начинает» прямо не названо; оно восстанавливается из ближайшего контекста.
    reason: Сохраняет грамматическую недосказанность греческого текста, не вводя в основной текст невыраженное местоимение.
lexical_decisions:
- source_word: τὸ ἀγαθὸν ποιεῖν
  choice: делать добро
  rationale: 'Прямо передаёт греческую конструкцию: субстантивированное τὸ ἀγαθόν обозначает «добро», а ποιεῖν — «делать».'
- source_word: τὸ τέλος τῆς πράξεως
  choice: итог поступка
  rationale: τέλος здесь естественно понимать как результат или исход действия; «итог поступка» звучит по-русски ясно и сохраняет связь с πράξεως.
- source_word: εἰς πονηρὸν ... ἐλαύνει
  choice: увлекает его ко злу
  rationale: ἐλαύνει буквально выражает движение или понуждение вперёд; «увлекает» сохраняет образ направляющей силы без чрезмерного усиления принуждения.
- source_word: θησαυρὸς τοῦ διαβουλίου
  choice: сокровищница его замысла
  rationale: θησαυρός — хранилище или сокровищница, а διαβούλιον — замысел, намерение, решение. Образ внутреннего вместилища сохранён.
- source_word: πονηροῦ πνεύματος
  choice: злым духом
  rationale: Сохраняет буквальное и богословски открытое значение πνεῦμα, не сводя его ни к настроению, ни к конкретно названному демоническому существу.
theological_decisions:
- issue: Природа «злого духа»
  choice: злым духом
  alternative: злым настроем / духом зла
  rationale: Греческий текст допускает личностное или качественное понимание; буквальная формулировка сохраняет эту напряжённость и не навязывает толкование.
- issue: Связь доброго начала со злым итогом
  choice: 'сохранено прямое противопоставление: начинает делать добро, но итог увлекает ко злу'
  alternative: начинает творить зло против добра
  rationale: Засвидетельствованный греческий текст ясно содержит τὸ ἀγαθὸν ποιεῖν («делать добро»). Исправление английского слоя в latest_revisions не поддерживается приведённым оригиналом.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Образы «сокровищницы» и движения «ко злу» сохранены; синтаксис упрощён лишь настолько, чтобы фраза была естественной и понятной.
