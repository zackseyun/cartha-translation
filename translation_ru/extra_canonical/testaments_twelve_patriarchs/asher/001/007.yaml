id: T12P.ASH.1.7
reference: Testament of Asher 1:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Δίκαια *γὰρ λογιζομένη³¹ καὶ ἀπορρίπτουσα³² τὴν πονηρίαν ἀνατρέπει εὐθὺς τὸ κακόν³³, καὶ³⁴ ἐκριζοῖ³⁵ τὴν ἁμαρτίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/007.yaml
  text: For by considering what is righteous and casting away wickedness, it at once overturns evil and uproots sin.
translation:
  language: ru
  text: Ибо, размышляя о праведном и отвергая нечестие, она тотчас ниспровергает зло и искореняет грех.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δίκαια … λογιζομένη
  choice: размышляя о праведном
  rationale: Передаёт субстантивированное множественное Δίκαια («праведное», «то, что праведно») и λογιζομένη как обдумывание или принятие в расчёт, не добавляя отсутствующего в греческом слова «мысли».
- source_word: ἀπορρίπτουσα τὴν πονηρίαν
  choice: отвергая нечестие
  rationale: ἀπορρίπτω обозначает отбрасывание или решительный отказ, а πονηρία здесь естественно передаётся как нравственное «нечестие».
- source_word: ἀνατρέπει εὐθὺς τὸ κακόν
  choice: тотчас ниспровергает зло
  rationale: Сохраняет усиленный образ ἀνατρέπει — опрокидывать, ниспровергать — и непосредственность εὐθύς.
- source_word: ἐκριζοῖ τὴν ἁμαρτίαν
  choice: искореняет грех
  rationale: Точно сохраняет метафору удаления с корнем в ἐκριζόω.
theological_decisions:
- issue: Неявное подлежащее женского рода
  choice: она
  alternative: не повторять местоимение и оставить только формы деепричастий и сказуемых
  rationale: Женский род причастий λογιζομένη и ἀπορρίπτουσα указывает на подлежащее из контекста. Местоимение «она» делает русское предложение самостоятельным и сохраняет грамматическую отсылку, не называя подлежащее и не разрешая контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с dignified нравственно-наставительным звучанием. «Ниспровергает» слегка возвышенно, но естественно для образной силы греческого глагола; синтаксис остаётся ясным для широкого читателя.
