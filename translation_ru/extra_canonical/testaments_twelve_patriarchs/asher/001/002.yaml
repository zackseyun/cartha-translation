  text: While still healthy, he said to them, “Hear, children of Asher, your father, and I will show you everything that is upright before God.”
translation:
  language: ru
  text: 'Ибо, будучи здоров, он сказал им: «Послушайте своего отца, дети Асира, и я покажу вам всё, что правильно перед Богом».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑγιαίνων
  choice: Будучи ещё здоров
  rationale: Причастие передаёт состояние здоровья Асира в момент речи; «ещё» естественно по-русски подчёркивает обстоятельство, не меняя основной мысли.
- source_word: Ἀκούσατε
  choice: Послушайте
  rationale: Повелительная форма означает не только физическое слышание, но внимательное восприятие наставления.
- source_word: τέκνα Ἀσήρ
  choice: дети Асира
  rationale: Сохранено прямое обращение к потомкам патриарха с обычной русской формой имени Асир.
- source_word: πᾶν τὸ εὐθὲς
  choice: всё, что право
  rationale: Субстантивированное выражение охватывает всё прямое, правильное и нравственно угодное; «право» сохраняет его широкую нравственную семантику.
- source_word: ἐνώπιον τοῦ Θεοῦ
  choice: пред Богом
  rationale: Достоинственная и понятная формула, буквально передающая оценку с точки зрения Бога.
- source_word: ὑποδείξω
  choice: покажу
  rationale: Передаёт обещание указать или разъяснить, не усиливая его до специального учительного термина.
theological_decisions:
- issue: Смысл выражения πᾶν τὸ εὐθὲς ἐνώπιον τοῦ Θεοῦ
  choice: всё, что право пред Богом
  alternative: всё правильное перед Богом
  rationale: Выбранная формулировка сохраняет нравственно-богословский критерий текста и его некоторую широту, не сводя εὐθύς к одной конкретной добродетели.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис прямого обращения сохранён; архаизмы сведены к понятной формуле «пред Богом».
