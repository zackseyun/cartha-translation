translation:
  language: ru
  text: 'Завещание Асира, десятого сына Иакова и Зелфы.


    1. Копия завещания Асира — слова, которые он произнёс своим сыновьям на сто двадцать пятом году своей жизни.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: Завещание
  rationale: В заглавии обозначает предсмертное наставление и последнюю волю патриарха; «завещание» точно передаёт жанр произведения.
- source_word: Ἀσὴρ / Ἀσήρ
  choice: Асир / Асира
  rationale: Использована традиционная русская библейская форма имени.
- source_word: Ζέλφας
  choice: Зелфы
  rationale: Использована традиционная русская библейская форма имени матери Асира.
- source_word: Ἀντίγραφον
  choice: Список
  rationale: Слово означает письменную копию или переписанный экземпляр; «список» сохраняет рукописный оттенок и уместен в заголовочной формуле.
- source_word: ἃ ἐλάλησε
  choice: слова, которые он произнёс
  rationale: Местоимение среднего рода множественного числа передано с подразумеваемым «слова», что делает русскую фразу ясной, не меняя содержания.
- source_word: ἐν ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: на сто двадцать пятом году своей жизни
  rationale: Естественная русская формула, точно обозначающая год жизни, а не обязательно уже исполнившийся возраст.
