base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/006.yaml
  text: If, then, the soul wants to walk well, it does all its actions in righteousness; and even if it sins, it immediately repents.
translation:
  language: ru
  text: Итак, если душа хочет идти добрым путём¹, она совершает все свои поступки в праведности; и даже если согрешит, тотчас кается.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ψυχὴ
  choice: душа
  rationale: Прямое и естественное соответствие греческому существительному ψυχή в данном нравственном контексте.
- source_word: θέλει
  choice: хочет
  rationale: Передаёт обычное значение глагола θέλω без усиления до «сильно желает».
- source_word: καλῶς πορευθῆναι
  choice: идти добрым путём
  rationale: Естественно передаёт образ нравственного хождения; «хорошо идти» по-русски звучало бы неясно. Кресты в издании указывают на текстологическую сомнительность выражения, но доступный текст переведён без конъектуры.
- source_word: πάσας τὰς πράξεις αὐτῆς ποιεῖ
  choice: она совершает все свои поступки
  rationale: Сохраняет полноту πάσας и предметное значение πράξεις, избегая неестественного «делает все свои действия».
- source_word: ἐν δικαιοσύνῃ
  choice: в праведности
  rationale: Формально сохраняет ключевое нравственно-богословское понятие δικαιοσύνη.
- source_word: κἂν ἁμάρτῃ
  choice: и даже если согрешит
  rationale: Передаёт уступительное значение κἄν и аористный сослагательный как возможный отдельный случай, не утверждая безгрешности или неизбежности греха.
- source_word: εὐθὺς μετανοεῖ
  choice: тотчас кается
  rationale: «Тотчас» соответствует εὐθύς и поддерживает достоинство регистра; «кается» естественно передаёт μετανοεῖ в данном контексте.
theological_decisions:
- issue: Соотношение праведного поведения и возможного греха
  choice: «и даже если согрешит, тотчас кается»
  alternative: «а согрешив, тотчас кается»
  rationale: 'Условно-уступительная конструкция сохраняет напряжение оригинала: душа действует в праведности, но возможность согрешить не исключена; перевод не превращает грех в обязательное событие.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Образ пути сохранён, но выражен идиоматично; синтаксис остаётся ясным для обычного читателя.
