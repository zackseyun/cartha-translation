  source_fidelity: 'Греч. Ἐὰν οὖν ... θέλει καλῶς πορευθῆναι передано по смыслу верно: условное «если», волевое θέλει, нравственно окрашенное πορεύεσθαι и наречие καλῶς сохранены. πάσας τὰς πράξεις αὐτῆς ... ἐν δικαιοσύνῃ, κἂν ἁμάρτῃ и εὐθὺς μετανοεῖ также переданы точно. Однако выражение καλῶς πορευθῆναι в указанном издании специально отмечено как текстологически сомнительное; это необходимо отразить примечанием.'
