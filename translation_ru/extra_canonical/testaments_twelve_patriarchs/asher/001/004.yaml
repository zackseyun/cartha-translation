  text: Διὰ τοῦτο πάντα¹⁷ δύο¹⁸ εἰσίν¹⁹, ἐν κατέναντι τοῦ ἑνός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/004.yaml
  text: Therefore all things are twofold, one over against the other.
translation:
  language: ru
  text: 'Поэтому всё двойственно: одно — напротив другого.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντα
  choice: всё
  rationale: Передаёт обобщающее значение среднего множественного числа «все вещи / всё» естественным современным русским выражением.
- source_word: δύο εἰσίν
  choice: существует в двух видах
  rationale: Буквальное «суть два» по-русски неестественно; выражение сохраняет мысль о двойственности всего, не уточняя её природу сверх греческого текста.
- source_word: ἐν κατέναντι τοῦ ἑνός
  choice: одно напротив другого
  rationale: Передаёт взаимное противопоставление; форма исходного выражения необычна, поэтому выбран естественный русский эквивалент, согласующийся с контекстом парности.
theological_decisions:
- issue: Характер двойственности всего
  choice: в двух видах
  alternative: двойственно / разделено надвое
  rationale: Формулировка не превращает высказывание ни в учение о метафизическом дуализме, ни в утверждение о буквальном разделении каждой вещи; сохраняется общая и несколько неопределённая мысль источника.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая конструкция с сохранением параллелизма и смысловой напряжённости греческого текста. Позднейшая ревизия о «поднятых ногах» не соответствует предоставленному греческому источнику и потому не принята.
