  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007.yaml
  text: '...crushing the head of the dragon upon the water[a]. He will save Israel and all the nations [God appearing as a man].


    4 Therefore, my children, you also tell these things to your children, so that they may not disobey him. 5 For I know that, by disobeying, you will disobey, and by acting ungodly, you will act ungodly, paying no attention to the law of God, but being corrupted by wickedness through the commandments of men. 6 And because of this you will be scattered, like Gad and Dan my brothers, and you will not know their land, tribe, and language. 7 But the Lord will gather you in faith through his compassion[c][b], and through Abraham and Isaac and Jacob.'
translation:
  language: ru
  text: 'Завещание Асира, 7


    1 Не уподобляйтесь Содому, который не признал ангелов Господних и погиб навеки. 2 Ибо я знаю, что вы согрешите и будете преданы в руки своих врагов; земля ваша будет опустошена, святыни ваши разрушены, а вы будете рассеяны по четырём концам земли и в рассеянии станете презираемы, словно ни на что не годная вода. 3 Так будет, пока Всевышний не посетит землю. Он Сам придёт как человек, будет есть и пить среди людей и сокрушит голову дракона на воде. Он спасёт Израиль и все народы — [Бог, принявший облик человека].[a]


    4 Итак, дети мои, и вы передайте это своим детям, чтобы они не ослушались Его. 5 Ибо я знаю, что вы непременно ослушаетесь и будете поступать нечестиво, не внимая Закону Божьему, но следуя человеческим заповедям и развращаясь во зле. 6 За это вы будете рассеяны, подобно моим братьям Гаду и Дану, и не будете знать их земель, племени и языка. 7 Но Он соберёт вас в вере[b] по Своему милосердию[c] и через Авраама, Исаака и Иакова.


    [a] Слова в квадратных скобках — «Бог, принявший облик человека» — принадлежат текстуально неустойчивому месту и, возможно, являются позднейшим расширением греческой традиции. Они переведены здесь, поскольку присутствуют в представленном греческом свидетельстве.


    [b] Греческое выражение можно также понять как «в верности».


    [c] Рассеяние, а затем собирание народа перекликаются с проходящей через Писания Израиля темой суда за нарушение завета и последующего восстановления.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова в квадратных скобках — «Бог, принявший облик человека» — принадлежат текстуально неустойчивому месту и, возможно, являются позднейшим расширением греческой традиции. Они переведены здесь, поскольку присутствуют в представленном греческом свидетельстве.
    reason: textual_variant
  - marker: b
    text: Греческое выражение можно также понять как «в верности».
    reason: lexical_alternative
  - marker: c
    text: Рассеяние, а затем собирание народа перекликаются с проходящей через Писания Израиля темой суда за нарушение завета и последующего восстановления.
    reason: cross_reference
lexical_decisions:
- source_word: ἠγνόησε
  choice: не признал
  rationale: В контексте Содома глагол выражает не просто отсутствие знания, а отказ признать и принять ангелов; перевод сохраняет нравственную силу высказывания.
- source_word: τὰ ἅγια
  choice: святыни
  rationale: Субстантивированное множественное число обозначает священные места или предметы; «святыни» естественно сохраняет обобщённость.
- source_word: ἐξουδενωμένοι
  choice: презираемы
  rationale: Передаёт состояние унижения и пренебрежения в рассеянии, не уточняя, кем именно народ будет презираем.
- source_word: συντρίβων
  choice: сокрушит
  rationale: Глагол передаёт решительное поражение дракона; русское «сокрушит» сохраняет яркость пророческого образа.
- source_word: κάραν
  choice: голову
  rationale: Естественное обозначение части тела в образе победы над драконом; «череп» было бы излишне физиологичным.
- source_word: δράκοντος
  choice: дракона
  rationale: Греческий текст прямо называет дракона; замена на «змея» ослабила бы апокалиптический образ.
- source_word: ὑποκρινόμενος
  choice: принявший облик
  rationale: В данном трудном и текстуально сомнительном обороте выражение передаёт явление в человеческом облике, но не вводит прямо идею обмана, которую могло бы создать буквальное «притворяющийся».
- source_word: ἀπειθήσωσιν
  choice: не ослушались
  rationale: Передаёт неповиновение конкретному лицу и естественно сочетается с местоимением «Его».
- source_word: ἀπειθοῦντες ἀπειθήσετε
  choice: непременно ослушаетесь
  rationale: Греческое сочетание причастия и личной формы усиливает утверждение; русское наречие передаёт усиление без неестественного повтора.
- source_word: ἀσεβοῦντες ἀσεβήσετε
  choice: будете поступать нечестиво
  rationale: Сохраняет нравственно-религиозный смысл однокоренного греческого повтора в естественной русской форме.
- source_word: νόμῳ θεοῦ
  choice: Закону Божьему
  rationale: В иудейском завещательном контексте речь идёт о Божьем Законе; прописная буква указывает на это устойчивое значение.
- source_word: ἐντολαῖς ἀνθρώπων
  choice: человеческим заповедям
  rationale: Сохраняет прямое противопоставление Закону Божьему и не привносит конкретной позднейшей полемики.
- source_word: κακίᾳ διαφθειρόμενοι
  choice: развращаясь во зле
  rationale: Передаёт продолжающееся нравственное разложение; оборот оставляет открытым, выступает ли зло средой, причиной или средством развращения.
- source_word: διασκορπισθήσεσθε
  choice: будете рассеяны
  rationale: Традиционный и ясный язык заветного суда и изгнания.
- source_word: ἀγνοήσετε
  choice: не будете знать
  rationale: Сохраняет прямое значение глагола и подразумеваемую утрату связи с землёй, коленом и языком без поясняющей парафразы.
- source_word: ἐπισυνάξει
  choice: вновь соберёт
  rationale: Приставочный глагол обозначает собирание воедино после рассеяния; «вновь» делает восстановительный контраст ясным.
- source_word: ἐν πίστει
  choice: в вере
  rationale: Краткий перевод сохраняет открытость между значениями веры и верности; альтернатива отмечена в сноске.
- source_word: εὐσπλαγχνίας
  choice: милосердию
  rationale: Передаёт глубокое сострадание и милость Бога современным, достоинственным русским словом.
theological_decisions:
- issue: Фраза θεὸς εἰς ἄνδρα ὑποκρινόμενος
  choice: Сохранена в квадратных скобках как «Бог, принявший облик человека»
  alternative: Опустить как вторичную вставку; либо перевести буквально как «Бог, притворяющийся человеком»
  rationale: Предоставленное греческое свидетельство содержит фразу в скобках, что указывает на текстологическую неуверенность. Перевод сохраняет её и трудность формулировки, не превращая её в позднейшую догматическую формулу и не приписывая Богу обман без необходимости.
- issue: Лицо, которое спасёт Израиль и все народы
  choice: Сохранено местоимение «Он» без дополнительного именования
  alternative: Явно назвать Его Господом, Всевышним или Спасителем
  rationale: В греческом употреблено указательное местоимение, а ближайшая синтаксическая связь сложна. Явное именование разрешило бы то, что источник оставляет не вполне определённым.
- issue: Значение ἐν πίστει
  choice: «в вере»
  alternative: «в верности» или «через веру»
  rationale: Предложный оборот допускает несколько смысловых оттенков. Основной текст сохраняет краткость и богословскую открытость, а лексическая альтернатива вынесена в сноску.
- issue: Субъект глагола ἐπισυνάξει в стихе 7
  choice: Передан местоимением «Он»
  alternative: Добавить «Господь» по смыслу английского консультационного слоя
  rationale: В предоставленном греческом тексте существительное «Господь» в этом месте отсутствует. Местоимение не добавляет чтения сверх источника.
- issue: Связь собирания с Авраамом, Исааком и Иаковом
  choice: «ради Авраама, Исаака и Иакова»
  alternative: «через Авраама, Исаака и Иакова»
  rationale: Буквальное διά допускает инструментальное «через», однако патриархи здесь естественно понимаются как основание милости в рамках завета. «Ради» передаёт этот смысл без утверждения о непосредственном посредничестве умерших праотцов.
translation_notes:
  register: Современный литературный русский язык с достоинственным завещательно-пророческим звучанием. Синтаксис умеренно библейский, но без архаизмов вроде «доколе», «внемлите» и «нечестие творить». Повторы греческого усилительного типа переданы естественными русскими средствами. Текстологически сомнительная фраза оставлена в квадратных скобках; все сноски имеют маркеры в основном тексте.
