revisions:
- from: И нельзя назвать истину ложью, а праведное — неправедным, потому что всякая истина пребывает под светом, как и всё пребывает под Богом.
  to: И нельзя назвать истину ложью, ни праведное — неправедным, потому что всякая истина — под светом, как и всё — под Богом.
  rationale: Заменено «а» на «ни» для точной передачи οὐδέ. «Пребывает» удалено, чтобы не прибавлять аспектуального значения; сохранены исходная неоднозначность пространственно-властного образа и параллелизм «под светом — под Богом».
  reviewer_model: gpt-5.6-terra
