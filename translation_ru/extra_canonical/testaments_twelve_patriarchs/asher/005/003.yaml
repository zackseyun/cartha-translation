source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Καὶ οὐκ¹⁵ ἔστιν εἰπεῖν τὴν ἀλήθειαν ψεῦδος, οὐδὲ *τὸ δίκαιον ἄδικον¹⁶, ὅτι πᾶσα ἀλήθεια ὑπὸ *τοῦ φωτός¹⁷ ἐστιν, ⌜καθὼς τὰ πάντα¹⁸ ὑπὸ *τοῦ Θεοῦ¹⁹⌝.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/003.yaml
  text: And one cannot call truth falsehood, nor what is righteous unrighteous, because all truth is under the light, just as all things are under God.
translation:
  language: ru
  text: И нельзя назвать истину ложью, ни праведное — неправедным, потому что всякая истина — под светом, как и всё — под Богом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰπεῖν
  choice: назвать
  rationale: В сочетании с двойным винительным передаёт смысл «назвать одно другим» естественнее, чем буквальное «сказать».
- source_word: τὸ δίκαιον
  choice: праведное
  rationale: Сохраняет субстантивированное и нравственно-богословское значение греческого прилагательного среднего рода.
- source_word: ὑπὸ τοῦ φωτός
  choice: под светом
  rationale: Формально сохраняет необычный образ и предлог ὑπό, не заменяя его толкованием вроде «озарена светом».
- source_word: ὑπὸ τοῦ Θεοῦ
  choice: под Богом
  rationale: Сохраняет параллелизм с «под светом» и допускает заложенное в выражении значение подчинённости или власти.
theological_decisions:
- issue: Соотношение света и Бога
  choice: Сохранён параллелизм «под светом — под Богом» без отождествления света с Богом.
  alternative: «В Божьем свете» или «под властью Бога».
  rationale: Греческий текст проводит сопоставление, но прямо не утверждает тождества и не разъясняет точный характер отношений.
- issue: Значение πᾶσα ἀλήθεια
  choice: «всякая истина»
  alternative: «вся истина»
  rationale: Форма допускает оба понимания; «всякая истина» естественно выражает каждое истинное утверждение или проявление истины и сохраняет обобщающий характер.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; необычные пространственно-властные образы оригинала сохранены. Тире подчёркивает противопоставление «праведное — неправедным».
