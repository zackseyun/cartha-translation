review_pass:
  verdict: revise
  source_fidelity: 'Основная мысль передана точно: εἰπεῖν с двойным винительным естественно выражено как «назвать», а τὸ δίκαιον сохранено субстантивированным («праведное»). Однако οὐδέ требует присоединительного отрицания, а не противительного «а». Глагол «пребывает» не выражен в греческом ἐστιν и добавляет оттенок длительного пребывания.'
  naturalness: «Нельзя назвать ... ни ...» — естественная современная литературная конструкция. Формула «под светом / под Богом» намеренно необычна, но сохраняет образ и параллелизм оригинала; тире позволяет избежать неестественного повторения «находится», не добавляя смыслового компонента.
  terminology: «Истина», «ложь», «праведное», «неправедное», «свет» и «Бог» соответствуют исходным терминам и регистру. Отношение света к Богу не истолковано и не отождествлено.
  issues:
  - severity: medium
    issue: Противительный союз «а» вместо отрицательного присоединения
    rationale: Греческое οὐδέ означает «и не / ни», а не противопоставление. Русское «ни» точнее передаёт синтаксическую связь с «нельзя».
  - severity: low
    issue: Добавочный аспект в «пребывает»
    rationale: ἐστιν означает «есть / находится»; «пребывает» вводит неявный в оригинале оттенок продолжительного состояния и несколько архаизирует фразу.
  revised_text: И нельзя назвать истину ложью, ни праведное — неправедным, потому что всякая истина — под светом, как и всё — под Богом.
