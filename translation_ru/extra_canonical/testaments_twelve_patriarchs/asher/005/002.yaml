  terminology: «Слава», «бесчестие», «праведное», «неправедное», «вечная жизнь» точны и регистрово уместны. «Праведное / неправедное» сохраняет неоднозначность среднеродовых субстантивированных прилагательных τὰ δίκαια / τὰ ἄδικα.
