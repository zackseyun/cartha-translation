source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Τὴν⁷ ζωὴν ὁ θάνατος διαδέχεται, τὴν δόξαν ἡ ἀτιμία, τὴν ἡμέραν ἡ νύξ⁸, τὸ φῶς τὸ σκότος· τὰ δὲ πάντα⁹ ὑπὸ ἡμέραν εἰσίν¹⁰, ὑπὸ ζωὴν¹¹ τὰ δίκαια, ⌜ὑπὸ θανάτου τὰ ἄδικα⌝¹². διὸ καὶ¹³ τὸν θάνατον ἡ αἰώνιος ζωὴ ἀναμένει¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/002.yaml
  text: 'Death follows life, dishonor follows glory, night follows day, darkness follows light. But all things are under day: the righteous under life, and the unrighteous under death. Therefore eternal life also awaits death.'
translation:
  language: ru
  text: 'За жизнью следует смерть, за славой — бесчестие, за днём — ночь, за светом — тьма. Но всё находится под днём: праведное — под жизнью, а неправедное — под смертью. Поэтому и смерть ожидает вечная жизнь.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαδέχεται
  choice: следует за
  rationale: Передаёт последовательную смену одного другим и сохраняет параллелизм четырёх начальных противопоставлений.
- source_word: ἀτιμία
  choice: бесчестие
  rationale: Естественная и точная противоположность «славе», включающая утрату чести и позор.
- source_word: ὑπό
  choice: под властью
  rationale: В данном контексте простое «под» звучало бы по-русски неясно; выражение передаёт отношение подчинённости или принадлежности сфере дня, жизни и смерти.
- source_word: τὰ δίκαια / τὰ ἄδικα
  choice: праведное / неправедное
  rationale: Средний род множественного числа допускает значение «всё праведное / неправедное» или «праведные / неправедные». Выбор сохраняет грамматическую категориальную широту греческого и параллель с «всё».
- source_word: ἀναμένει
  choice: ожидает
  rationale: Сохраняет необычный образ исходного текста, где вечная жизнь выступает субъектом, ожидающим смерть.
theological_decisions:
- issue: Смысл заключительного утверждения «вечная жизнь ожидает смерть»
  choice: Сохранена исходная формулировка без поясняющего перефразирования.
  alternative: «После смерти наступает вечная жизнь» или «смерть ожидает вечная жизнь».
  rationale: Греческий текст грамматически называет «вечную жизнь» субъектом глагола и «смерть» объектом. Необычная персонификация и возможное эсхатологическое напряжение не должны устраняться переводом.
- issue: Референт τὰ δίκαια и τὰ ἄδικα
  choice: «праведное» и «неправедное».
  alternative: «праведники» и «неправедные» либо «праведные дела» и «неправедные дела».
  rationale: Оригинал формально допускает более одного понимания; нейтральные субстантивированные формы не сужают смысл до лиц или поступков.
translation_notes:
  register: Современный литературный русский язык с торжественным афористическим ритмом. Параллелизм оригинала передан повтором «за ... — ...» и «под властью». Архаизмы и конфессионально окрашенная терминология не используются.
