source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: V. Ὁρᾶτε¹, τέκνα², πῶς δύο³ εἰσὶν ⌜ἐν πᾶσιν⌝, ἓν⁴ κατέναντι τοῦ ἑνός, *καὶ ἓν ὑπὸ τοῦ ἑνὸς⁵ κέκρυπται· ⌜ἐν τῇ κτίσει ἡ πλεονεξία, ἐν τῇ εὐφροσύνῃ ἡ μέθη, ἐν τῷ γέλωτι τὸ πένθος, ἐν τῷ γάμῳ ἡ ἀσωτία⌝⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/001.yaml
  text: 'See, my children, how there are two in all things, one opposite the other, and one is hidden under the other: in creation, greed; in merriment, drunkenness; in laughter, grief; in marriage, debauchery.'
translation:
  language: ru
  text: 'Смотрите, дети, как во всём есть по два: одно — напротив другого, и одно скрыто под другим: в творении — алчность, в веселье — пьянство, в смехе — печаль, в браке — распутство.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Посмотрите
  rationale: Передаёт повелительное «смотрите, заметьте» естественным современным русским языком.
- source_word: τέκνα
  choice: дети мои
  rationale: Обращение передано естественно; притяжательное «мои» следует смыслу отцовского обращения, явно выраженному в английском консультационном слое, хотя в данной греческой форме отсутствует.
- source_word: δύο … ἐν πᾶσιν
  choice: во всём есть две стороны
  rationale: Слово «стороны» добавлено для ясности по-русски, поскольку субстантивированное «два» звучало бы неестественно; неопределённость природы этих двух начал не устраняется конкретизацией.
- source_word: ἓν κατέναντι τοῦ ἑνός
  choice: одна противостоит другой
  rationale: Сохраняет взаимное противопоставление и параллельную конструкцию.
- source_word: ἓν ὑπὸ τοῦ ἑνὸς κέκρυπται
  choice: одна скрыта под другой
  rationale: Буквально сохраняет пространственную метафору ὑπό, не заменяя её толкованием «внутри» или «за».
- source_word: κτίσει
  choice: творении
  rationale: Основное значение κτίσις — «творение/создание»; выбор следует греческому тексту и не возвращается к неподтверждённому «накоплению богатства».
- source_word: πλεονεξία
  choice: алчность
  rationale: Передаёт жадное стремление иметь больше; «алчность» уместна в нравственном перечне и понятна современному читателю.
- source_word: εὐφροσύνῃ
  choice: веселье
  rationale: Естественный эквивалент радости или праздничного веселья в данном контрасте с пьянством.
- source_word: μέθη
  choice: пьянство
  rationale: Обозначает состояние и порок опьянения, соответствуя нравственному контексту.
- source_word: πένθος
  choice: печаль
  rationale: Сохраняет широкий смысл скорби/печали, не усиливая его до исключительно траурного значения.
- source_word: ἀσωτία
  choice: распутство
  rationale: В контексте брака передаёт нравственную невоздержанность и развратный образ жизни, не сужая значение до конкретного проступка.
theological_decisions:
- issue: Природа «двух» во всём
  choice: две стороны
  alternative: два начала / две сущности
  rationale: Текст не определяет их онтологический статус. «Стороны» сохраняет наблюдаемую двойственность и не вводит дуалистическую доктрину.
- issue: Связь порока с положительной сферой
  choice: Сохранён эллиптический перечень без поясняющих глаголов
  alternative: в творении скрывается алчность и т. п.
  rationale: 'Так сохраняется напряжённая и неоднозначная форма оригинала: не уточняется, является ли порок неизбежным свойством, скрытой опасностью или возможным искажением.'
translation_notes:
  register: Современный литературный русский, с достоинством и ясностью. Синтаксис слегка раскрыт словом «стороны», но образ противоположности и сокрытия сохранён. Пунктуация оформляет заключительный ряд как пояснение к общей мысли.
