  to: Итак, всё это я испытал в своей жизни, и не уклонился от истины Господа, и изо всех сил искал заповедей Всевышнего, идя по жизни.
  rationale: Исправлены несоответствие «всем сердцем» греческому «со всей силой» и неоправданное добавление «своим путём». Сопутствующее значение πορευόμενος сохранено естественным русским оборотом «идя по жизни»; сноска ограничена реальной синтаксической неоднозначностью.
