source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ταῦτα οὖν²⁰ πάντα ⌜ἐγὼ⌝²¹ ἐδοκίμασα ἐν τῇ ζωῇ μου, καὶ οὐκ ἐπλανήθην ἀπὸ τῆς ἀληθείας Κυρίου, καὶ²² τὰς ἐντολὰς τοῦ ὑψίστου²³ ἐξεζήτησα²⁴ κατὰ πᾶσαν ἰσχύν μου πορευόμενος²⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/004.yaml
  text: So then I tested all these things in my life, and I did not go astray from the truth of the Lord, and I sought the commandments of the Most High with all my strength as I walked.
translation:
  language: ru
  text: Итак, всё это я испытал в своей жизни, и не уклонился от истины Господа, и изо всех сил искал заповедей Всевышнего, идя по жизни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδοκίμασα
  choice: испытал
  rationale: Передаёт проверку и удостоверение на собственном жизненном опыте, сохраняя ёмкость греческого глагола.
- source_word: ἐπλανήθην
  choice: уклонился
  rationale: Естественно выражает отход или сбивание с верного пути; образ пути поддерживается последующим πορευόμενος.
- source_word: ἐξεζήτησα
  choice: искал
  rationale: В контексте заповедей означает усердное стремление узнать и соблюдать их; интенсивность дополнительно выражена оборотом «всем сердцем».
- source_word: κατὰ πᾶσαν ἰσχύν μου
  choice: всем сердцем
  rationale: Контекстуально передаёт действие со всей внутренней решимостью и силой; буквальное «всей моей силой» по-русски здесь звучит менее естественно.
- source_word: πορευόμενος
  choice: следуя своим путём
  rationale: Сохраняет самостоятельное значение причастия движения и образ жизненного пути, не превращая его лишь в служебный оборот.
theological_decisions:
- issue: Связь «истины» с Господом
  choice: истины Господа
  alternative: Господней истины
  rationale: Сохранён родительный оборот оригинала без уточнения, означает ли он истину, исходящую от Господа, принадлежащую Ему или относящуюся к Нему.
- issue: Отношение последнего причастия к поиску заповедей
  choice: «следуя своим путём» вынесено как сопутствующее действие
  alternative: «искал заповедей… на всём своём пути»
  rationale: Греческое πορευόμενος допускает различную синтаксическую связь; текст сохраняет мотив хождения, а сноска отмечает неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством завещательного наставления. Союз «и» сохранён между однородными утверждениями по греческому тексту; архаизирующая лексика избегается.
