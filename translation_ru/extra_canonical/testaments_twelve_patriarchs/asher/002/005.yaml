    rationale: В греческом это личная глагольная форма в ряду с «крадёт», «поступает несправедливо» и «грабит». Передача через действие точнее и стилистически ровнее.
  - severity: low
    issue: «Милует бедных» имеет несколько архаизирующую окраску.
    rationale: Греческое ἐλεεῖ естественно передать современным нейтральным выражением «проявляет милость к бедным», не меняя смысла и не добавляя противопоставления.
