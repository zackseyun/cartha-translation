base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/005.yaml
  text: Another steals, acts unjustly, plunders, is greedy, and shows mercy to the poor. This too is double-faced, but the whole of it is evil.
translation:
  language: ru
  text: Другой крадёт, поступает несправедливо, грабит, наживается за чужой счёт и проявляет милость к бедным. И это тоже[a] двулично, но всё это в целом — зло.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «тоже» соответствует текстуально не вполне надёжному καί; в части греческой традиции оно может отсутствовать.
    reason: Критические скобки в исходном издании указывают на сомнение в наличии καί; сноска сохраняет эту текстологическую неопределённость, не перегружая основной текст.
lexical_decisions:
- source_word: κλέπτει
  choice: крадёт
  rationale: Прямой современный эквивалент, сохраняющий конкретный смысл тайного присвоения чужого.
- source_word: ἀδικεῖ
  choice: поступает несправедливо
  rationale: Передаёт широкий смысл причинения неправды, не сужая его до одного вида проступка.
- source_word: ἁρπάζει
  choice: грабит
  rationale: Передаёт насильственное или хищническое присвоение и отличает этот глагол от κλέπτει.
- source_word: πλεονεκτεῖ
  choice: корыстолюбив
  rationale: Передаёт устойчивую жадность и стремление приобретать за чужой счёт; русская именная конструкция естественно продолжает ряд сказуемых.
- source_word: ἐλεεῖ πτωχούς
  choice: милует бедных
  rationale: Сохраняет выраженную в ἐλεεῖ идею милосердия, не добавляя отсутствующего в греческом противительного оттенка «однако».
- source_word: διπρόσωπον
  choice: двулично
  rationale: Сохраняет образ двух лиц и нравственную противоречивость описанного поведения.
- source_word: τὸ δὲ ὅλον πονηρόν
  choice: но всё это в целом — зло
  rationale: Передаёт итоговую оценку поведения как единого целого и сохраняет сильное нравственное значение πονηρόν.
theological_decisions:
- issue: Соотношение милосердного поступка и общей нравственной оценки
  choice: 'Сохранить парадокс без пояснения: человек милует бедных, но всё его поведение в целом названо злом.'
  alternative: Добавить «всё же» или пояснить, что милостыня не искупает прочих поступков.
  rationale: Греческий текст сополагает действия и выносит общую оценку, но не формулирует причинного или искупительного учения; добавленное толкование сняло бы напряжение текста.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным перечислением. Сохранены нравственная резкость заключения и двусмысленное напряжение между милостью к бедным и общей порочностью поведения; не добавлен отсутствующий в греческом союз «однако» перед милосердием.
