  source_fidelity: 'Основной смысл передан верно: ἐν λόγοις — «на словах», ἀφιστῶσα — «отступает от», ὑπὲρ τοῦ κακοῦ — «ради зла», а τέλος τοῦ πράγματος — «исход дела». Однако «бывает душа» несколько ослабляет прямое экзистенциально-типологическое утверждение ἔστιν … ἡ ψυχή; «есть душа» ближе к греческому и естественно в русском нравоучительном контексте. Из-за отмеченной в издании синтаксической трудности при ἀφιστῶσα τὸ καλόν перевод сохраняет выбранное английской контрольной версией непереходное понимание «отступает от добра».'
  naturalness: Фраза в целом литературна и ясна. Замена «бывает душа» на «есть душа» делает начало менее разговорно-неопределённым. «Приводит исход дела ко злу» естественнее, чем «к нечестию».
