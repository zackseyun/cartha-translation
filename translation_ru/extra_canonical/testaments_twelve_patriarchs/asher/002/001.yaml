  text: There is, then, a soul that in words turns away from the good for the sake of evil, and leads the outcome of the matter into wickedness.
translation:
  language: ru
  text: Итак, есть душа, которая на словах отступает от добра ради зла и приводит исход дела ко злу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔστιν οὖν ἡ ψυχὴ
  choice: Итак, бывает душа
  rationale: Оборот передаёт существование такого типа души в контексте рассуждения; «бывает» звучит по-русски естественнее буквального «есть душа».
- source_word: ἐν λόγοις
  choice: на словах
  rationale: Естественный русский оборот, сохраняющий противопоставление слов фактической нравственной направленности.
- source_word: ἀφιστῶσα τὸ καλὸν
  choice: отступает от добра
  rationale: Несмотря на трудность формы и конструкции в изданном тексте, такое понимание соответствует непереходному значению ἀφίστημι и сохраняет направление «прочь от добра».
- source_word: ὑπὲρ τοῦ κακοῦ
  choice: ради зла
  rationale: Передаёт значение предпочтения или действия в пользу зла, не уточняя сверх текста точный оттенок ὑπέρ.
- source_word: τὸ τέλος τοῦ πράγματος
  choice: исход дела
  rationale: τέλος здесь естественно понимать как конечный результат, а πρᾶγμα — как дело или поступок.
- source_word: εἰς κακίαν ἄγων
  choice: приводит … к нечестию
  rationale: Сохраняет образ направления к нравственному злу; «нечестие» соответствует возвышенному этическому регистру κακία.
theological_decisions:
- issue: Соотношение слов и нравственного результата
  choice: Сохранено утверждение, что душа на словах отступает от добра, а исход дела направляет к нечестию.
  alternative: Понять фразу как словесное отвержение добра в пользу зла либо как удаление добра.
  rationale: Греческий текст испорчен или синтаксически неровен; перевод следует наиболее вероятному непереходному пониманию ἀφιστῶσα и не вводит дополнительной богословской интерпретации.
translation_notes:
  register: Современный литературный русский с достоинством нравоучительного текста. Синтаксис сделан естественным, но сохранены причинно-целевая связь «ради зла» и направленность исхода дела к κακία.
