  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/003.yaml
  text: And there is a man who loves one who acts wickedly, because he himself also chooses to die in evil on that man's account; and concerning this it is plain that he is double-faced, but the whole of it is an evil deed.
translation:
  language: ru
  text: 'Есть человек, который любит того, кто поступает дурно, — а это и есть зло[a], — ибо и сам он предпочитает умереть во зле. О таком человеке ясно: всё[b] двулично, но всё — злое деяние.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческие слова, переданные как «а это и есть зло», отмечены в издании как текстуально сомнительные. Их первоначальная форма и точная связь с предложением неясны.
    reason: Оборот ὃ ἐστι πονηρία отмечен в издании крестами как повреждённый или сомнительный.
  - marker: b
    text: 'Буквально в сохранившемся греческом: «целое» или «всё». Этот участок текста отмечен как сомнительный, поэтому точная синтаксическая связь слова «двулично» неясна.'
    reason: Оборот τὸ ὅλον отмечен издателем как сомнительный и допускает несколько синтаксических толкований.
lexical_decisions:
- source_word: ἀγαπῶν πονηρευόμενον
  choice: любит поступающего нечестиво
  rationale: Причастие πονηρευόμενον обозначает человека, поступающего дурно или нечестиво; перевод сохраняет объект любви без добавления отсутствующего в греческом тексте уточнения «ради него».
- source_word: αἱρεῖται
  choice: предпочитает
  rationale: Глагол означает сознательно выбирать или предпочитать; «предпочитает» передаёт волевой характер решения.
- source_word: ἐν κακῷ
  choice: во зле
  rationale: Сохранена широкая нравственная формулировка источника без сужения до конкретного проступка.
- source_word: διπρόσωπον
  choice: двулично
  rationale: Буквально «двулико»; современное «двулично» естественно передаёт нравственную непоследовательность, хотя грамматическая связь слова в повреждённом месте не вполне ясна.
- source_word: κακὴ πρᾶξις
  choice: злое деяние
  rationale: Сочетание обозначает дурной поступок или действие; «деяние» соответствует достоинству и нравственному регистру текста.
theological_decisions:
- issue: Причина готовности умереть во зле
  choice: не добавлять «ради того человека»
  alternative: «ради него предпочитает умереть во зле»
  rationale: Оборот «ради него» присутствует в английском консультационном тексте, но не выражен явно в сохранившемся греческом; перевод не должен без необходимости устранять неоднозначность.
- issue: Оценка любви к нечестивцу
  choice: сохранить формулу «что и есть зло» с указанием текстовой неясности
  alternative: опустить формулу как позднюю или испорченную вставку
  rationale: Слова засвидетельствованы в издании, хотя отмечены как сомнительные; их сохранение позволяет не скрывать нравственное напряжение текста.
translation_notes:
  register: Современный литературный русский с кратким нравоучительным ритмом. Сохранены повтор «зло / злое» и напряжённая, местами шероховатая логика греческого текста; повреждённые места не сглажены молча и снабжены сносками.
