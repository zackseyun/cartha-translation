  source_fidelity: 'В целом переданы основные элементы греческого текста: человек любит того, кто поступает дурно; он сознательно выбирает смерть «во зле»; заключение содержит характеристики «двуличное» и «злое деяние». Однако «в целом» в последней фразе ослабляет и частично подменяет повторное πᾶν («всё»), а «о нём» менее точно передаёт περὶ τούτου («об этом/о таком человеке») в контексте. Английское добавление «ради того человека» правильно не перенесено, поскольку в греческом оно не выражено.'
