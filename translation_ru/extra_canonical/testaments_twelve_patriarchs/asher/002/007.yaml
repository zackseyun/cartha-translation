base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/007.yaml
  text: It stains the soul and makes the body bright; it kills many and shows mercy to a few. This too is double-faced, but the whole of it is evil.
translation:
  language: ru
  text: Оно оскверняет душу и придаёт телу блеск; многих убивает, а немногих милует. И это тоже двулико, но всё оно — зло.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπιλοῖ
  choice: оскверняет
  rationale: Передаёт не просто внешнее «пятнает», а нравственное загрязнение души, естественно звучащее по-русски.
- source_word: λαμπρύνει
  choice: придаёт телу блеск
  rationale: Сохраняет буквальный образ внешнего блеска тела и его противопоставление осквернению души, не уточняя подразумеваемый способ прославления или украшения.
- source_word: ἀναιρεῖ
  choice: убивает
  rationale: В данном сочетании с прямым объектом «многих» глагол естественно означает лишение жизни.
- source_word: ἐλεεῖ
  choice: милует
  rationale: Сохраняет смысл проявления милости и резкий параллелизм с «убивает».
- source_word: διπρόσωπον
  choice: двулико
  rationale: Прямо передаёт образ двух лиц и нравственную двойственность, не заменяя его более узким толкованием «лицемерно».
- source_word: τὸ ὅλον πονηρόν ἐστιν
  choice: в целом оно — зло
  rationale: Передаёт итоговую оценку всего описываемого явления, сохраняя нейтральное соотнесение и не конкретизируя не названный в стихе референт.
theological_decisions:
- issue: Неявный референт среднего рода
  choice: «оно» и «это»
  alternative: Мужской или женский род с восстановленным существительным
  rationale: Греческий текст использует формы среднего рода и не называет референт в самом стихе; нейтральные местоимения сохраняют эту неопределённость и не вносят толкование.
- issue: Соотношение внешнего блеска и внутреннего осквернения
  choice: Сохранено без поясняющего истолкования
  alternative: Передать блеск как славу, красоту или показную праведность
  rationale: Исходный текст намеренно оставляет напряжённое противопоставление без объяснения; перевод не должен разрешать его за автора.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным синтаксисом. Сохранены параллелизм, нравственная напряжённость и образ двуликости; неявный референт не конкретизирован.
