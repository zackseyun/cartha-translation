  text: Ведь и Бог так сказал на скрижалях заповедей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Ибо и
  rationale: 'Сохраняет присоединительно-обосновывающий смысл сочетания: автор подкрепляет предыдущее утверждение ссылкой на слова Бога.'
- source_word: ἐν ταῖς πλαξὶ τῶν ἐντολῶν
  choice: на скрижалях заповедей
  rationale: Естественная русская библейская формулировка; πλαξί обозначает скрижали, а родительный τῶν ἐντολῶν связывает их с заповедями.
- source_word: οὕτως εἶπεν
  choice: сказал так
  rationale: Прямо передаёт глагол речи εἶπεν и указательное наречие οὕτως, не усиливая его до более официального «возвестил» или «провозгласил».
theological_decisions:
- issue: Характер Божьего высказывания на скрижалях
  choice: сказал так
  alternative: возвестил это
  rationale: Греческое εἶπεν означает «сказал»; нейтральный перевод не добавляет особого богословского оттенка официального провозглашения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис краток и близок к греческому оригиналу; слово «скрижали» сохранено как общеизвестный библейский термин.
