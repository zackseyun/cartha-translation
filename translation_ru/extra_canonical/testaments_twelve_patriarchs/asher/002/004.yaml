base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/004.yaml
  text: Even if they are in love, they are in wickedness, hiding evil under a good name; but the end of the deed comes to evil.
translation:
  language: ru
  text: Даже если он любит, тот, кто скрывает зло под добрым именем, пребывает в порочности[a]; конец же этого дела заканчивается злом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст первой части стиха отмечен в издании обелами и синтаксически неясен. Возможен также смысл: «Даже любовь бывает порочной, скрывая зло под добрым именем».'
    reason: Сочетание ἀγάπη οὖσα с мужским субстантивированным причастием ὁ συγκρύπτων допускает разные способы восстановления синтаксической связи; сноска сохраняет эту неопределённость.
lexical_decisions:
- source_word: ἀγάπη
  choice: любовь
  rationale: Прямое и естественное соответствие греческому существительному; условная конструкция «даже если это любовь» передаёт уступительный смысл, отражённый контекстом и консультационным английским текстом.
- source_word: πονηρίᾳ
  choice: порочности
  rationale: Передаёт нравственно отрицательный смысл πονηρία и позволяет избежать неестественного повтора слова «зло» в той же части предложения.
- source_word: ὁ συγκρύπτων
  choice: тот, кто скрывает
  rationale: Передаёт субстантивированное причастие настоящего времени как характеристику действующего лица.
- source_word: τὸ κακὸν ὑπὲρ τὸ ὄνομα τὸ καλόν
  choice: зло под добрым именем
  rationale: Сохраняет образ сокрытия зла под благовидным наименованием; ὑπέρ здесь понято в пространственно-метафорическом смысле «под прикрытием».
- source_word: τὸ τέλος τῆς πράξεως ἔρχεται εἰς κακόν
  choice: конец же такого поступка ведёт ко злу
  rationale: Естественно по-русски передаёт направленность исхода действия к злу, не усиливая выражение до утверждения о наказании или гибели.
theological_decisions:
- issue: Нравственная оценка любви, связанной с сокрытием зла
  choice: Уступительное «даже если это любовь» отделено от утверждения о порочности скрывающего зло человека.
  alternative: «Даже любовь бывает порочной, когда скрывает зло под добрым именем».
  rationale: Выбранный вариант сохраняет напряжение текста, но не утверждает без достаточного основания, что любовь сама по себе названа порочностью; при этом греческий текст в данном месте синтаксически неустойчив.
translation_notes:
  register: Современный литературный русский язык с достоинством нравственного наставления. Синтаксис сделан ясным для обычного читателя, а подлинная текстовая неопределённость вынесена в сноску.
