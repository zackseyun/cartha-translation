source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἄλλος⁴⁸ μοιχεύει *καὶ πορνεύει⁴⁹ καὶ ἀπέχεται ἐδεσμάτων⁵⁰. καὶ⁵¹ νηστεύων κακοποιεῖ, καὶ τῇ³⁵ δυναστείᾳ *τοῦ πλούτου⁵² πολλοὺς κατασύρει⁵³, καὶ ἐκ⁵⁴ τῆς ὑπερόγκου⁵⁵ κακίας ποιεῖ⁵⁶ ⌈τὰς⌉⁵⁷ ἐντολάς⁵⁸. τοῦτο διπρόσωπόν ἐστιν⁵⁹, *τὸ δὲ ὅλον⁶⁰ κακόν ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/008.yaml
  text: Another commits adultery and practices sexual immorality, and abstains from foods. And while fasting he does evil, and by the power of wealth he drags many down, and out of excessive wickedness keeps the commandments. This is double-faced, but it is altogether evil.
translation:
  language: ru
  text: Другой прелюбодействует и предаётся разврату, и воздерживается от пищи. Постясь, он творит зло, силой богатства увлекает многих за собой и по причине чрезмерного зла исполняет заповеди. Это двуличие, но всё это — зло.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μοιχεύει καὶ πορνεύει
  choice: прелюбодействует и предаётся разврату
  rationale: Сохраняется различие между супружеской неверностью и более широким понятием половой распущенности; формулировка естественна для современного литературного русского языка.
- source_word: ἀπέχεται ἐδεσμάτων
  choice: воздерживается от пищи
  rationale: Передаёт религиозно-аскетическое воздержание без неоправданного уточнения вида пищи.
- source_word: κακοποιεῖ
  choice: творит зло
  rationale: Кратко и буквально передаёт действие, противопоставленное посту.
- source_word: τῇ δυναστείᾳ τοῦ πλούτου
  choice: силой богатства
  rationale: Естественно передаёт власть или могущество, которое даёт богатство; притяжательность в греческом прямо не выражена.
- source_word: πολλοὺς κατασύρει
  choice: увлекает многих к погибели
  rationale: Глагол обозначает стягивание или низведение вниз; добавление «к погибели» ясно выражает отрицательную направленность метафоры, не конкретизируя её сверх контекста.
- source_word: ἐκ τῆς ὑπερόγκου κακίας
  choice: по чрезмерной своей порочности
  rationale: 'Сохраняет парадокс: исполнение заповедей исходит не из добра, а из непомерного зла; «порочность» здесь естественнее абстрактного «злодейства».'
- source_word: ποιεῖ τὰς ἐντολάς
  choice: исполняет заповеди
  rationale: Устойчивое русское соответствие выражению «делать заповеди», сохраняющее парадокс исходного текста.
- source_word: διπρόσωπόν
  choice: двулично
  rationale: Передаёт буквальный образ «двух лиц» и нравственную двойственность поведения.
- source_word: τὸ δὲ ὅλον κακόν ἐστιν
  choice: но в целом — зло
  rationale: Сохраняет итоговую оценку всего описанного поведения как злого, не превращая фразу в оценку личности.
theological_decisions:
- issue: Парадокс исполнения заповедей из чрезмерной порочности
  choice: 'Сохранить прямое парадоксальное высказывание: «по чрезмерной своей порочности исполняет заповеди»'
  alternative: Истолковать как лицемерное или показное исполнение заповедей
  rationale: Греческий текст не объясняет мотив и намеренно удерживает напряжение между внешне добрым поступком и злым источником; толкование не следует вводить в основной текст.
- issue: Итоговая нравственная оценка
  choice: «но в целом — зло»
  alternative: «но он всецело зол»
  rationale: Средний род τοῦτο и τὸ ὅλον скорее указывает на описанное двоякое поведение как целое, а не обязательно выносит онтологический приговор человеку.
translation_notes:
  register: Современный литературный русский язык с кратким, назидательным ритмом. Сохранены резкие противопоставления поста и злодеяния, исполнения заповедей и порочности. Архаизмы и конфессионально окрашенные уточнения исключены.
