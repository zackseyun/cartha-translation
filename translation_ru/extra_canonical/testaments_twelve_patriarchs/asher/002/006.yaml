revisions:
- from: Кто обирает ближнего[a], тот вызывает гнев Бога, ложно клянётся Всевышним — и жалеет бедняка; отвергает Господа, давшего Закон, и раздражает Его — и даёт покой неимущему.
  to: Кто обирает ближнего[a], тот гневит Бога, ложно клянётся Всевышним и оказывает милость бедняку; отвергает и раздражает Господа, даровавшего Закон, и даёт покой неимущему.
