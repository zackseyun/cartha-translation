base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/006.yaml
  text: The one who defrauds his neighbor provokes God, swears falsely by the Most High, sets aside and provokes the Lord, the giver of the law, and gives rest to the poor.
translation:
  language: ru
  text: Кто обирает ближнего[a], тот гневит Бога, ложно клянётся Всевышним и оказывает милость бедняку; отвергает и раздражает Господа, даровавшего Закон, и даёт покой неимущему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: После слов «ближнего» греческое чтение добавляет πτωχούς («бедных», винительный падеж множественного числа), что не согласуется с построением фразы. Основной текст передаёт связное чтение «обирает ближнего»; возможно, πτωχούς относится к нему в смысле «бедных [ближних]», но это остаётся неясным.
    reason: Сноска фиксирует грамматически трудное чтение рукописной традиции и не выдаёт предположительное исправление за смысл основного текста.
lexical_decisions:
- source_word: πλεονεκτῶν
  choice: обирает
  rationale: Глагол обозначает корыстное присвоение чужого или несправедливое использование другого; «обирает» ясно и естественно передаёт действие по отношению к ближнему.
- source_word: παροργίζει
  choice: вызывает гнев
  rationale: 'Передаёт каузативный смысл: человек навлекает на себя или возбуждает Божий гнев.'
- source_word: ἐπιορκεῖ
  choice: ложно клянётся
  rationale: Глагол означает нарушать клятву или клясться ложно; при дополнении «Всевышним» выбран естественный русский оборот.
- source_word: ἐλεεῖ
  choice: жалеет
  rationale: Сохраняет прямой смысл проявления жалости или милосердия к бедняку и подчёркивает нравственную противоречивость описанного человека.
- source_word: ἐντολέα τοῦ νόμου
  choice: давшего Закон
  rationale: Естественно выражает образ Господа как Того, Кто установил и заповедал Закон, не вводя специального конфессионального термина.
- source_word: ἀθετεῖ
  choice: отвергает
  rationale: Передаёт смысл непризнания, отвержения или пренебрежения властью Господа.
- source_word: παροξύνει
  choice: раздражает
  rationale: Сохраняет отдельный второй глагол исходного текста и его значение побуждения к негодованию.
- source_word: ἀναπαύει
  choice: даёт покой
  rationale: Формально и понятно передаёт идею облегчения, отдыха или утешения, не сужая её до одного вида помощи.
theological_decisions:
- issue: Сочетание порочных и милосердных поступков у одного человека
  choice: Сохранить резкое противопоставление без гармонизации
  alternative: Опустить «жалеет бедняка» или истолковать добрые поступки как притворство
  rationale: Греческий текст прямо соединяет противоречащие друг другу действия; контекст нравственной двойственности требует сохранить напряжение, а не объяснять его сверх сказанного.
- issue: Титул Бога как ἐντολέα τοῦ νόμου
  choice: «Господа, давшего Закон»
  alternative: «Господа Законодателя»
  rationale: Выбранная формулировка понятнее широкому читателю и сохраняет мысль о божественном источнике Закона без добавочного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Тире подчёркивают намеренные нравственные контрасты исходного текста; параллелизм глагольных конструкций сохранён.
