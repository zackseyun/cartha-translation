base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/002.yaml
  text: There is a man who does not pity his servants; and though this is double-faced, the whole of it is evil.
translation:
  language: ru
  text: Есть человек, который не жалеет своих слуг; и это двулично, но всё это — зло.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔστιν ἄνθρωπος
  choice: Бывает человек
  rationale: Естественно передаёт экзистенциальную конструкцию и вводит типичный случай, не превращая её в указание на конкретного человека.
- source_word: οὐκ οἰκτείρει
  choice: не жалеет
  rationale: Передаёт отсутствие жалости или сострадания; в данном контексте современное «не жалеет» звучит естественно и не означает экономию.
- source_word: λειτουργοὺς αὐτοῦ
  choice: своих слуг
  rationale: «Слуг» соответствует значению λειτουργούς здесь, а возвратное «своих» естественно выражает принадлежность при подлежащем «человек», не добавляя особого усиления.
- source_word: καίγε τοῦτο
  choice: И это также
  rationale: Сохраняет присоединительное значение καί и усилительно-указательный оттенок γε без тяжеловесности.
- source_word: διπρόσωπον
  choice: двулико
  rationale: Сохраняет образность греческого слова «имеющее два лица» и связь с темой двойственности поступков, не объясняя заранее характер двух сторон.
- source_word: τὸ ὅλον πονηρόν ἐστιν
  choice: но в целом является злом
  rationale: Передаёт итоговую отрицательную оценку всего рассматриваемого действия; «является злом» сохраняет предикативную силу существительного/прилагательного πονηρόν.
theological_decisions:
- issue: Оценка «двуликого» поступка
  choice: Сохранить напряжение между его двуликостью и итоговой оценкой как зла
  alternative: Истолковать две стороны как смесь добра и зла
  rationale: Греческий текст не раскрывает здесь обе стороны и прямо утверждает, что целое является злом; перевод не должен дополнять эту мысль богословским объяснением.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Необычное слово «двулико» сохранено намеренно как ключевой образ исходного текста.
