revisions:
- from: Бывает человек, который не жалеет своих слуг. И это также двулико, но в целом является злом.
  to: Есть человек, который не жалеет своих слуг; и это двулично, но всё это — зло.
  rationale: Убрано интерпретирующее «также» и уточнена передача τὸ ὅλον как «всё это». Сохранены краткий афористичный строй, образ «двулично» и нераскрытая исходником двусмысленность этого определения.
