base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/009.yaml
  text: Such people are like hares, because they are half clean, but in truth they are unclean.
translation:
  language: ru
  text: 'Такие люди — зайцы: они чисты наполовину, но в действительности нечисты.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ τοιοῦτοι
  choice: Такие люди
  rationale: Передаёт указание на описанный ранее тип людей; слово «люди» естественно восполняется по смыслу.
- source_word: δασύποδες
  choice: подобны зайцам
  rationale: δασύπους, буквально «мохноногий», употребляется как название зайца; сравнительная формулировка ясно передаёт метафору применительно к людям.
- source_word: ἐξ ἡμισείας ... καθαροί
  choice: чисты лишь наполовину
  rationale: Сохраняет образ частичной чистоты и подчёркивает её недостаточность без дополнительного толкования.
- source_word: τὸ δ᾽ ἀληθὲς ἀκάθαρτοί εἰσι
  choice: а на самом деле нечисты
  rationale: Естественно передаёт противопоставление кажущейся частичной чистоты истинному состоянию.
theological_decisions:
- issue: Образ ритуальной чистоты зайца
  choice: Сохранить утверждение о половинной чистоте без пояснения в тексте
  alternative: Разъяснить связь с признаками чистых животных по закону Моисея
  rationale: Греческий текст оставляет аллюзию неразвёрнутой; перевод не должен превращать её в добавленное толкование.
translation_notes:
  register: Современный литературный русский язык; краткая, афористичная фраза с сохранением нравственно-ритуальной метафоры оригинала.
