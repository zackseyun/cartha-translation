  text: '*Τὴν ⌜δὲ⌝ κακίαν ἀποδράσατε¹⁰, ἀναιροῦντες *τὸ διαβούλιον¹¹ ἐν ταῖς ἀγαθαῖς ὑμῶν πράξεσι, ὅτι οἱ διπρόσωποι *οὐκ εἰσὶ τοῦ Θεοῦ¹², ἀλλὰ ταῖς ἐπιθυμίαις αὐτῶν δουλεύουσιν, ἵνα τῷ Βελίαρ ἀρέσωσιν, καὶ τοῖς ὁμοίοις¹³ αὐτῶν ἀνθρώποις.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/003/002.yaml
  text: But flee wickedness, destroying its plan by your good deeds; for the double-faced are not of God, but are enslaved to their own desires, so that they may please Beliar[b].
translation:
  language: ru
  text: Но бегите от зла, разрушая его замысел своими добрыми делами, потому что двуличные — не от Бога, но служат собственным желаниям, чтобы угождать Велиару[a] и подобным себе людям.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Велиар — греческая форма имени, которое также передают как «Велиал».
    reason: lexical_alternative
lexical_decisions:
- source_word: κακίαν
  choice: зла
  rationale: Передаёт нравственное зло и порочность естественным современным русским словом.
- source_word: ἀποδράσατε
  choice: бегите
  rationale: Сохраняет сильный образ удаления и спасения бегством, а не ослабляет его до «избегайте».
- source_word: τὸ διαβούλιον
  choice: его замысел
  rationale: В контексте обозначает замысел или намерение зла; местоимение связывает выражение с предшествующим «злом».
- source_word: διπρόσωποι
  choice: двуличные
  rationale: Естественный русский эквивалент буквального «двуликие», обозначающий нравственную неискренность и двойственность.
- source_word: δουλεύουσιν
  choice: порабощены
  rationale: Сохраняет смысл рабского служения и зависимости, выраженный глаголом δουλεύω.
- source_word: Βελίαρ
  choice: Велиару
  rationale: Передаёт греческую форму имени Βελίαρ русской транслитерацией; связь с формой «Велиал» пояснена в сноске.
- source_word: τοῖς ὁμοίοις αὐτῶν ἀνθρώποις
  choice: подобным себе людям
  rationale: Восстанавливает присутствующую в греческом источнике, но опущенную в английском консультационном тексте вторую группу тех, кому стремятся угодить двуличные.
theological_decisions:
- issue: οὐκ εἰσὶ τοῦ Θεοῦ
  choice: не от Бога
  alternative: не принадлежат Богу
  rationale: Формулировка «не от Бога» сохраняет родительный оборот и его возможную смысловую широту, не сводя его исключительно к принадлежности.
- issue: ἵνα ... ἀρέσωσιν
  choice: стремятся угодить
  alternative: чтобы угождать
  rationale: Русская формулировка естественно выражает целевую направленность порабощённости желаниям, не уточняя сверх текста степень намеренности.
translation_notes:
  register: Современный литературный русский язык с наставительным, достойным тоном. Образ бегства сохранён, синтаксис сделан ясным для обычного читателя; заключительная фраза переведена полностью по греческому источнику.
