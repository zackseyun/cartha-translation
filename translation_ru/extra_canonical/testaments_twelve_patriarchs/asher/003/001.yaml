source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: III. Ὑμεῖς¹ δὲ², *τέκνα μου³, μὴ γίνεσθε *κατ᾽ αὐτοὺς⁴ διπρόσωποι, ἀγαθότητος καὶ κακίας, ἀλλὰ τῇ ἀγαθότητι μόνῃ⁵ κολλήθητε, ὅτι ⌜Κύριος⌝⁶ ὁ Θεὸς *ἀναπαύεται ἐν⁷ αὐτῇ⁸, καὶ οἱ ἄνθρωποι *αὐτὴν ποθοῦσιν⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/003/001.yaml
  text: But you, my children, do not become double-faced[a] like them, in goodness and wickedness, but cling to goodness alone, because the Lord God rests in it, and people long for it.
translation:
  language: ru
  text: А вы, дети мои, не становитесь, подобно им, двуликими[a] — обращёнными и к добру, и ко злу, — но прилепитесь лишь к добру, потому что Господь Бог покоится в нём и люди стремятся к нему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «двуличными». Греческое слово изображает раздвоенность нравственного облика, а не только неискренность в отношениях с людьми.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διπρόσωποι
  choice: двуликими
  rationale: Буквально «двуликие»; слово передаёт раздвоенность нравственного облика, а не только неискренность в отношениях.
- source_word: ἀγαθότητος καὶ κακίας
  choice: обращёнными и к добру, и ко злу
  rationale: Родительные поясняют, в чём состоит двуликость; развёрнутая формулировка естественна по-русски и сохраняет нравственное противопоставление.
- source_word: κολλήθητε
  choice: прилепитесь
  rationale: Сохраняет сильный образ тесной и постоянной приверженности, привычный для возвышенной библейской речи.
- source_word: ἀναπαύεται ἐν αὐτῇ
  choice: покоится в нём
  rationale: Сохранён пространственный образ пребывания Бога в добре; местоимение согласовано с русским существительным среднего рода.
- source_word: ποθοῦσιν
  choice: стремятся к нему
  rationale: Передаёт сильное желание и влечение без неуместного в данном контексте романтического оттенка русского «жаждут» или «возлюбляют».
theological_decisions:
- issue: Смысл утверждения, что Господь Бог «покоится» в добре
  choice: 'сохранить образ буквально: «покоится в нём»'
  alternative: «пребывает в нём»
  rationale: Греческое ἀναπαύεται содержит образ покоя; его не следует сводить к более общему «пребывает» и тем самым устранять возможную богословскую насыщенность.
- issue: Референт местоимений αὐτῇ / αὐτήν
  choice: «добро»
  alternative: «доброта» или «благость»
  rationale: В греческом местоимения относятся к ἀγαθότης. Русское «добро» естественно обозначает нравственное начало и сохраняет противопоставление злу.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. «Прилепитесь» и «покоится» сохраняют образы оригинала; пояснительный оборот с тире делает структуру греческой фразы понятной обычному читателю.
