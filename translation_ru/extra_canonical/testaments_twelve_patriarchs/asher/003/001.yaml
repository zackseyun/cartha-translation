  source_fidelity: 'Текст точно передаёт греческое наставление: запрет уподобляться «им» в двойственности добра и зла, призыв держаться одного добра, а также образы того, что Господь Бог «покоится» в добре и что люди к нему стремятся. «Подобно им» корректно передаёт κατ᾽ αὐτούς; «лишь к добру» — τῇ ἀγαθότητι μόνῃ; «прилепитесь» удачно сохраняет образ κολλήθητε.'
