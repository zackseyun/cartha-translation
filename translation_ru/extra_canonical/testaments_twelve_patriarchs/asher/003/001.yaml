  terminology: «Двуликими» сохраняет образ διπρόσωποι, а сноска верно предохраняет от сведения значения к одной лишь бытовой неискренности. «Добро» и «зло» уместно передают нравственное противопоставление ἀγαθότης / κακία. «Господь Бог» соответствует Κύριος ὁ Θεός.
