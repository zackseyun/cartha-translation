  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/008.yaml
  text: And after saying these things to them[a], he commanded them, saying, “Bury me in Hebron.” And he died, having fallen asleep in a good sleep. And his sons did as he had commanded them, and they carried him away to Hebron and buried him with his fathers.
translation:
  language: ru
  text: '8 Когда он сказал им это, то заповедал им: «Похороните меня в Хевроне». И он умер, уснув добрым сном[a]. 2 Его сыновья исполнили всё, что он им заповедал: отнесли его в Хеврон и похоронили с его отцами.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в греческом тексте: «он умер, уснув добрым сном»; прямое указание на смерть здесь соединено с традиционным образом сна.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνετείλατο
  choice: заповедал
  rationale: В контексте предсмертного наставления передаёт властный и торжественный характер распоряжения; повтор того же русского глагола во втором стихе отражает повтор греческого глагола.
- source_word: Θάψατέ
  choice: Похороните
  rationale: Прямой и естественный русский эквивалент повелительной формы без дополнительных смысловых оттенков.
- source_word: Χεβρών
  choice: Хеврон
  rationale: Использована устоявшаяся русская библейская форма географического названия.
- source_word: ἀπέθανεν
  choice: умер
  rationale: Прямо передаёт явное утверждение о смерти, не подменяя его последующим образом сна.
- source_word: ὕπνῳ καλῷ κοιμηθείς
  choice: уснув добрым сном
  rationale: Сохраняет образ сна и намеренный лексический повтор корня, хотя оборот звучит необычно по-русски; «мирно уснув» было бы более истолковывающим.
- source_word: ἀπήγαγον
  choice: отнесли
  rationale: В погребальном контексте естественно обозначает перенесение тела в другое место.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: с его отцами
  rationale: Сохраняет традиционную родственную и погребальную формулу, не расширяя её до более общего «с предками».
theological_decisions:
- issue: Описание смерти посредством образа сна
  choice: Сохранены и прямое «умер», и образное «уснув добрым сном»
  alternative: «Он мирно умер» или только «он уснул»
  rationale: Греческий текст сочетает прямое обозначение смерти с традиционным образом сна. Сохранение обоих элементов не устраняет заложенное в тексте напряжение и не превращает метафору в толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным завещательным тоном. Синтаксис упрощён лишь там, где это необходимо для естественности; необычный повтор образа сна сохранён сознательно.
