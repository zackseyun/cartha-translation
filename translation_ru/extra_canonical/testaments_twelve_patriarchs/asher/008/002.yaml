  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/008/002.yaml
  text: And his sons did as he had commanded them, and they carried him away to Hebron and buried him with his fathers.
translation:
  language: ru
  text: И сыновья его сделали всё, что он им повелел, и отнесли его в Хеврон, и похоронили его вместе с отцами его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίησαν ... ὅσα ἐνετείλατο αὐτοῖς
  choice: исполнили всё, что он повелел им
  rationale: Передаёт выполнение всего завещанного; «повелел» сохраняет силу ἐνετείλατο и звучит естественно в литературном русском.
- source_word: ἀπήγαγον αὐτὸν
  choice: отнесли его
  rationale: В контексте смерти глагол означает перенесение тела к месту погребения; формулировка не добавляет отсутствующего в греческом слова «тело».
- source_word: ἐν Χεβρὼν
  choice: в Хеврон
  rationale: Хотя ἐν обычно означает «в», контекст движения и последующего погребения указывает на направление; русская конструкция требует винительного падежа.
- source_word: ἔθαψαν αὐτὸν μετὰ τῶν πατέρων αὐτοῦ
  choice: похоронили с его отцами
  rationale: Сохраняется буквальный библейский образ совместного погребения с предками без пояснительного расширения.
theological_decisions:
- issue: Значение выражения «с его отцами»
  choice: с его отцами
  alternative: рядом с его предками
  rationale: Буквальная формулировка сохраняет традиционный образ и не уточняет характер погребения сверх исходного текста.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Двоеточие естественно связывает общее исполнение повеления с последующими конкретными действиями; смысловых добавлений нет.
