  text: VIII. Καὶ¹ εἰπὼν αὐτοῖς ταῦτα ἐνετείλατο λέγων²· Θάψατέ με ἐν³ Χεβρών⁴. Καὶ ἀπέθανεν⁵ †ὕπνῳ⁶ καλῷ κοιμηθείς⁷.
  language: Greek
base_translation:
