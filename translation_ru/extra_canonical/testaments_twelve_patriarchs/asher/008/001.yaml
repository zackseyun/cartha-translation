  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/008/001.yaml
  text: And after saying these things to them, he commanded them, saying, “Bury me in Hebron.” And he died, having fallen asleep in a good sleep.
translation:
  language: ru
  text: 'И, сказав им это, он повелел: «Похороните меня в Хевроне». И он умер, уснув добрым сном[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст выражения «добрым сном» отмечен в издании как текстуально сомнительный.
    reason: Критический знак в исходном издании указывает на неуверенность в сохранности этого места; примечание предупреждает читателя, не заменяя засвидетельствованный текст догадкой.
lexical_decisions:
- source_word: ἐνετείλατο λέγων
  choice: он повелел
  rationale: Греческая формула буквально означает «повелел, говоря», но по-русски естественно и полно передаётся одним глаголом перед прямой речью.
- source_word: Θάψατέ με
  choice: Похороните меня
  rationale: Повелительное наклонение множественного числа передано прямо и естественно.
- source_word: Χεβρών
  choice: Хевроне
  rationale: Употреблена традиционная русская форма библейского топонима с требуемым предложным падежом.
- source_word: ἀπέθανεν … ὕπνῳ καλῷ κοιμηθείς
  choice: умер, уснув добрым сном
  rationale: Сохранены и прямое указание на смерть, и образ сна; необычное сочетание не сглажено и не истолковано.
theological_decisions:
- issue: Соотношение смерти и сна
  choice: И он умер, уснув добрым сном
  alternative: И он мирно почил
  rationale: Источник одновременно употребляет прямой глагол «умер» и причастие «уснув»; перевод сохраняет это напряжение и не сводит выражение к одному эвфемизму.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным повествовательным строем. Прямая речь и повтор образов смерти и сна сохранены; неестественная для русского формула «повелел, говоря» устранена без потери смысла.
