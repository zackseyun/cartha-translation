  to: Есть человек, который ненавидит и милосердного, и несправедливого, и прелюбодея, и постящегося. И это тоже двуличие, однако всё это — доброе дело, потому что такой человек подражает Господу, не ожидая того, что кажется добром, вместе с истинным добром.[a]
  rationale: 'Исправлен только небезопасный смысловой сдвиг в заключении: «принимая» заменено на соответствующее греческому тексту «ожидая». Неясность повреждённого места сохранена и ясно обозначена в сноске. «Весь поступок благ» заменено на более естественное «всё это — доброе дело», без изменения парадоксального утверждения источника.'
