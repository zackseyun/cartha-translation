reference: Testament of Asher 4:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ἔστι τις μισῶν¹³ τὸν ἐλεήμονα καὶ ἄδικον¹⁴, ⌜καὶ⌝¹⁵ τὸν μοιχὸν καὶ¹⁶ νηστεύοντα¹⁷, *καὶ αὐτό ἐστι διπρόσωπον¹⁸, ἀλλὰ ⌈τὸ πᾶν⌉ ἔργον ἀγαθόν¹⁹, ὅτι μιμεῖται²⁰ Κύριον, μὴ²¹ †προσδοκώμενος²² τὸ δοκοῦν καλὸν †μετὰ²³ *τοῦ ἀληθινοῦ²⁴ καλοῦ²⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/003.yaml
  text: There is one who hates the merciful and the unjust, and the adulterer and the one who fasts; this too is double-faced, but the whole work is good, because he imitates the Lord, not expecting what seems good along with what is truly good.
translation:
  language: ru
  text: Есть человек, который ненавидит и милосердного, и несправедливого, и прелюбодея, и постящегося. И это тоже двуличие, однако всё это — доброе дело, потому что такой человек подражает Господу, не ожидая того, что кажется добром, вместе с истинным добром.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Заключительная часть греческого текста сохранилась в неясном, вероятно повреждённом виде. В издании сомнительны чтения προσδοκώμενος («ожидая») и μετά («вместе с»); поэтому точная связь между «кажущимся добром» и «истинным добром» неясна.
    reason: Сноска отмечает текстологическую неопределённость, не заменяя засвидетельствованное значение глагола контекстуальным толкованием.
lexical_decisions:
- source_word: μισῶν
  choice: ненавидит
  rationale: Прямо передаёт сильное значение греческого причастия, не смягчая его до «не одобряет».
- source_word: τὸν ἐλεήμονα
  choice: милосердного
  rationale: Субстантивированное прилагательное передано естественно для русского языка; речь идёт о милосердном человеке.
- source_word: ἄδικον
  choice: несправедливого
  rationale: Сохраняет нравственный контраст с «милосердным» и не сужает смысл до юридического «беззаконника».
- source_word: διπρόσωπον
  choice: двуличие
  rationale: Передаёт буквальный образ «двух лиц» и отрицательную нравственную оценку; конструкция перестроена ради естественного русского синтаксиса.
- source_word: τὸ πᾶν ἔργον ἀγαθόν
  choice: весь поступок благ
  rationale: «Поступок» здесь естественнее отвлечённого «дело» и сохраняет парадоксальную положительную оценку всего описанного действия.
- source_word: μιμεῖται Κύριον
  choice: подражает Господу
  rationale: Точно сохраняет глагол подражания и титул Κύριος.
- source_word: προσδοκώμενος
  choice: принимая
  rationale: Текст в этом месте испорчен или сомнителен; контекстуальное «принимая» позволяет связать противопоставление кажущегося и истинного добра, не воспроизводя семантически неясное «ожидая» без пояснения.
- source_word: τὸ δοκοῦν καλὸν … τοῦ ἀληθινοῦ καλοῦ
  choice: кажущееся добром … с истинным добром
  rationale: Сохраняет важное противопоставление видимого и подлинного добра.
theological_decisions:
- issue: Почему ненависть к милосердному и постящемуся всё же названа благим поступком
  choice: Сохранить парадокс текста без доктринального объяснения
  alternative: Истолковать фразу как различение добрых и злых сторон одного человека
  rationale: Греческий текст формулирует напряжённую и внешне противоречивую мысль; перевод не должен устранять её посредством добавленного толкования.
- issue: Подражание Господу
  choice: 'Передать прямо: «подражает Господу»'
  alternative: Уточнить, что Господь отвергает зло, но принимает добро
  rationale: Такого уточнения в данном стихе нет; его добавление разрешило бы сохранённую источником неоднозначность.
- issue: Смысл повреждённой заключительной конструкции
  choice: Основной текст передаёт контекстуальный смысл, а сомнение отмечено сноской
  alternative: Буквально перевести «не ожидая кажущееся добром вместе с истинным добром»
  rationale: Буквальный вариант по имеющемуся чтению неясен по-русски и, вероятно, отражает порчу греческого текста; сноска честно сохраняет текстологическую проблему.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной мудрости. Синтаксис умеренно формальный, но понятный; повтор союза «и» сохранён как значимая риторическая структура. Источниковая неоднозначность заключения вынесена в сноску.
