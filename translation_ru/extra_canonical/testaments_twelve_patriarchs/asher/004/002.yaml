  source_fidelity: 'В целом переданы все основные элементы греческого текста: устранение злых, два противоположно оценённых дела, положительная оценка целого и двойное обозначение удаления зла. Однако «такой человек» не имеет прямого соответствия в оригинале: греческий текст неожиданно переходит от множественного числа к мужскому единственному, и этот сдвиг следует передать без добавочного обобщающего указания.'
