base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/002.yaml
  text: And many, in doing away with the wicked, do two things, good and evil; yet the whole is good, because he has uprooted and destroyed the evil.
translation:
  language: ru
  text: И многие, устраняя нечестивых, совершают два дела — одно доброе, другое злое; однако всё в целом — добро, ибо он, искоренив зло, уничтожил его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναιροῦντες τοὺς πονηρούς
  choice: устраняя нечестивых
  rationale: «Устраняя» сохраняет широту ἀναιρέω, которое в данном контексте может означать устранение, вплоть до умерщвления; «нечестивых» естественно передаёт субстантивированное πονηρούς и его нравственную окраску.
- source_word: δύο ποιοῦσιν ἔργα καλοῦ τε καὶ κακοῦ
  choice: совершают два дела — доброе и злое
  rationale: Передаёт два ἔργα как два противопоставленных дела, не превращая их в отвлечённые понятия.
- source_word: τὸ δὲ ὅλον καλόν
  choice: однако всё в целом — добро
  rationale: Сохраняет итоговую оценку совокупного действия и контраст, выраженный δέ.
- source_word: τὸ κακὸν ἐκριζώσας ἀπώλεσεν
  choice: искоренил и уничтожил зло
  rationale: 'Сохраняет оба сильных глагола: ἐκριζόω — «искоренять», ἀπόλλυμι — «уничтожать».'
theological_decisions:
- issue: Нравственная оценка устранения нечестивых
  choice: Сохранено напряжение между добрым и злым аспектами поступка и итоговой оценкой целого как добра.
  alternative: Смягчить «злое» до «дурного последствия» или оправдать поступок как безусловно праведный.
  rationale: Греческий текст прямо называет два дела добрым и злым, а затем положительно оценивает целое; перевод не должен устранять это напряжение.
- issue: Смена числа и подразумеваемый субъект в финальной части
  choice: «такой человек»
  alternative: «они» или безличное «зло было искоренено и уничтожено».
  rationale: После множественного ποιοῦσιν греческий переходит к причастию мужского рода единственного числа ἐκριζώσας и глаголу ἀπώλεσεν. «Такой человек» естественно отражает обобщённый единичный субъект, не исправляя текст под множественное число.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной литературы. Синтаксис сохраняет резкое нравственное противопоставление оригинала; архаизмы и конфессионально окрашенные пояснения не добавлены.
