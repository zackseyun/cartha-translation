base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/004.yaml
  text: Another does not wish to see good days with the wasteful, lest he disgrace the body and defile the soul. Even though this is double-faced, yet it is wholly good.
translation:
  language: ru
  text: Другой не желает видеть добрые дни вместе с невоздержными, чтобы не опозорить тело и не осквернить душу. Хотя и это двулико, всё же оно целиком добро.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: проводить добрые дни
  rationale: Буквально «видеть добрые дни»; по-русски выражение передано естественно, с сохранением смысла благополучной жизни или приятного времяпрепровождения.
- source_word: ἀσώτων
  choice: распутными
  rationale: Ἄσωτος обозначает человека невоздержного, распущенного или расточительного. В данном нравственном контексте «распутные» лучше связывает совместное времяпрепровождение с угрозой телу и душе, не сужая смысл лишь до денежных трат.
- source_word: αἰσχράνει
  choice: опозорить
  rationale: Сохраняет значение причинения бесчестья или постыдного состояния и отличает этот глагол от следующего μολυνεῖ.
- source_word: μολυνεῖ
  choice: осквернить
  rationale: Передаёт образ загрязнения и нравственного осквернения души.
- source_word: διπρόσωπον
  choice: двулико
  rationale: Сохраняет буквальный образ «двух лиц» и связь с темой двойственности поведения, не заменяя его толкованием вроде «лицемерно».
- source_word: ὅλον δὲ καλόν
  choice: всё же оно целиком добро
  rationale: Сохраняет парадоксальное утверждение источника о полной благости поступка, несмотря на его двуликость.
theological_decisions:
- issue: Нравственная оценка «двуликого» поведения
  choice: 'Сохранено напряжение: «Хотя и это двулико, всё же оно целиком добро»'
  alternative: Истолковать διπρόσωπον как «двойственно» или «лицемерно» и пояснить причину положительной оценки
  rationale: Греческий текст соединяет διπρόσωπον с ὅλον…καλόν без явного разрешения противоречия; перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис близок к оригиналу, но «видеть добрые дни» естественно передано как «проводить добрые дни». Местоимение при «тело» и «душу» не добавлено, поскольку его нет в греческом тексте.
