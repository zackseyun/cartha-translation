revisions:
- from: Другой не желает проводить добрые дни с распутными, чтобы не опозорить тело и не осквернить душу. Хотя и это двулико, всё же оно целиком добро.
  to: Другой не желает видеть добрые дни вместе с невоздержными, чтобы не опозорить тело и не осквернить душу. Хотя и это двулико, всё же оно целиком добро.
  rationale: 'Заменены два выражения: «распутными» на более широкое «невоздержными» и «проводить добрые дни» на близкое к исходному образу «видеть добрые дни». Остальные решения сохранены: они точно передают нравственную лексику и не снимают намеренную неоднозначность заключительного парадокса.'
