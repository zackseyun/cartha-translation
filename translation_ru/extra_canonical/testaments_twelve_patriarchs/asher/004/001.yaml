source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: IV. Οἱ γὰρ ἀγαθοὶ ἄνθρωποι¹ *⌜καὶ⌝ μονοπρόσωποι κἂν² νομισθῶσι παρὰ τῶν³ διπροσώπων⁴ ἁμαρτάνειν⁵, δίκαιοί εἰσι παρὰ τῷ⁶ Θεῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/001.yaml
  text: For good men, being single-faced, even if they are thought by the double-faced to be sinning, are righteous before God.
translation:
  language: ru
  text: 'Ибо добрые люди чистосердечны[a]: даже если двуличные считают, что они грешат, перед Богом они праведны.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «однолики»; то есть цельны и искренни, в противоположность двуличным.'
    reason: Передаёт исходную метафору μονοπρόσωποι, которую невозможно естественно сохранить в основном русском тексте без пояснения.
lexical_decisions:
- source_word: ἀγαθοὶ ἄνθρωποι
  choice: добрые люди
  rationale: Прямо передаёт нравственную характеристику без добавочного богословского оттенка.
- source_word: μονοπρόσωποι
  choice: чистосердечны
  rationale: Буквально слово означает «одноликие» и противопоставлено «двуличным»; по-русски «чистосердечны» естественно выражает цельность и отсутствие притворства.
- source_word: διπροσώπων
  choice: двуличные
  rationale: Сохраняет образ двух лиц и ясное противопоставление цельным, искренним людям.
- source_word: ἁμαρτάνειν
  choice: грешат
  rationale: Сохраняет прямой религиозно-нравственный смысл греческого глагола.
- source_word: δίκαιοί εἰσι παρὰ τῷ Θεῷ
  choice: перед Богом они праведны
  rationale: Естественная русская формулировка, сохраняющая Божью оценку как противоположность человеческому мнению.
theological_decisions:
- issue: Соотношение человеческого обвинения и Божьей оценки
  choice: 'Сохранено прямое утверждение: хотя двуличные считают добрых людей грешащими, перед Богом те праведны.'
  alternative: «Бог считает их праведными»
  rationale: Формулировка «перед Богом» ближе к παρὰ τῷ Θεῷ и не уточняет механизм или основание праведности сверх сказанного в источнике.
translation_notes:
  register: Современный литературный русский; краткий назидательный стиль. Сохранено образное «двуличные», а необычное «одноликие» передано идиоматически с буквальным значением в сноске.
