source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Οἱ γὰρ τοιοῦτοι³⁴ δορκάσι³⁵ καὶ ἐλάφοις³⁶ *εἰσὶν ὅμοιοι³⁷, ὅτι ἐν ἤθει ἀγρίων³⁸ δοκοῦσιν ἀκάθαρτοι εἶναι, *τὸ δὲ πᾶν³⁹ καθαροί εἰσιν³⁹, ὅτι ἐν ζήλῳ Κυρίου⁴⁰ ⌈πορεύονται⌉, ἀπεχόμενοι *ὧν καὶ ὁ Θεὸς διὰ τῶν ἐντολῶν μισῶν ἀπαγορεύει⁴¹, *ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ⁴².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/005.yaml
  text: 'For such men are like gazelles and deer: though in the manner of wild animals they seem to be unclean, yet in every way they are clean, because they walk in zeal for the Lord, abstaining from what God also hates and forbids through the commandments, keeping evil away from good.'
translation:
  language: ru
  text: 'Ибо такие люди подобны газелям и оленям: по повадкам диких животных они кажутся нечистыми, но во всём чисты, потому что ходят в ревности к Господу, воздерживаясь от того, что и Бог ненавидит и запрещает через заповеди, не подпуская зло к добру.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δορκάσι καὶ ἐλάφοις
  choice: газелям и оленям
  rationale: Сохраняет различие двух названных животных и прямой образ греческого текста.
- source_word: ἐν ἤθει ἀγρίων
  choice: по повадкам диких животных
  rationale: Ἦθος здесь обозначает характерные повадки или образ поведения; «повадки» естественно передаёт внешнее сходство с дикими животными.
- source_word: τὸ δὲ πᾶν καθαροί
  choice: но во всём чисты
  rationale: Передаёт усилительное значение τὸ πᾶν и сохраняет контраст между кажущейся нечистотой и действительной чистотой.
- source_word: ἐν ζήλῳ Κυρίου πορεύονται
  choice: ходят в ревности к Господу
  rationale: Сохраняет библейскую метафору хождения и значение ζῆλος как усердной ревности, направленной к Господу.
- source_word: ἀπεχόμενοι
  choice: воздерживаясь
  rationale: Точно передаёт сознательное уклонение от запрещённого, не сводя выражение лишь к физическому удалению.
- source_word: ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ
  choice: удерживая зло вдали от добра
  rationale: Передаёт пространственно-разделительное значение ἀπείργω и не заменяет образ более интерпретирующим «отделяя».
theological_decisions:
- issue: Кто «удерживает зло вдали от добра»
  choice: Сохранена синтаксическая открытость основной фразы с пояснением в сноске
  alternative: Однозначно отнести действие либо к Богу, либо к «таким людям»
  rationale: Причастие ἀπείργων стоит в мужском роде единственного числа и грамматически тяготеет к ὁ Θεός, тогда как ход мысли допускает связь действия с описываемыми людьми. Перевод не должен молча устранять это напряжение.
- issue: Характер чистоты
  choice: «во всём чисты»
  alternative: «совершенно чисты» или «по существу чисты»
  rationale: Так сохраняется полнота утверждения без добавления философского различия между внешностью и сущностью и без усиления сверх греческого текста.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранена метафора «ходят», но избегнуты архаизмы и конфессионально нагруженные уточнения.
