  naturalness: «Следуйте истине без двуличия» — современная литературная и ясная передача ключевого образа. «Держитесь того, что поистине добро» естественнее, чем «сохраняйте его во всех заповедях», при сохранении призыва удерживаться истинного добра в соблюдении заповедей.
  terminology: «Господь», «закон», «заповеди», «праведность», «Велиар», «ангел мира», «вечная жизнь» употреблены последовательно и без конфессионально-специфических добавлений. «Велиар» соответствует греческой форме Βελίαρ.
