base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006.yaml
  text: 'Therefore take heed, you also, my children, following the commandments of the Lord with a single face, in truth. For the double-faced are punished doubly, because they both do evil and approve those who do it, imitating the spirits of deceit and contending against mankind. You therefore, my children, keep the law of the Lord, and do not attend to evil as though it were good; but look instead to what is truly good, and preserve it in all the commandments of the Lord, conducting yourselves in it and resting in it. For the ends of men reveal their righteousness, and they are made known to the angels of the Lord and of Beliar. For when a wicked soul departs, it is tormented by the evil spirit, which it also served in lusts and wicked deeds. But if it is peaceful in joy, it knows the angel of peace, and rejoices in him; and at its death he leads it into eternal life. And it does not come into the destruction of Beliar, as do the souls of sinners. You see, therefore, that in the last
    times the sons of truth will escape the spirits of deceit and Beliar, but the sons of lawlessness will be destroyed. For the latter will hand over their souls to Beliar in confusion, but the former will be found in joy. For every one of those who are double-faced, though he says, ''I am for the Lord,'' serves Beliar, and his works go to the evil one. Be persuaded, therefore, my children, that there are two ways of all things, one of good and one of evil; and in these are the two dispositions in our breasts that discern them. Therefore if the soul takes pleasure in the good, all its deeds are in righteousness; and if it sins, it immediately repents. For, having its mind set on righteousness and hating wickedness, it casts away the evil and roots out the sin. But if it inclines to evil, all its deeds are in wickedness, and it drives away the good and clings to the evil, and is ruled by Beliar. For even if it does what is good, it twists it toward evil. For when it begins to do good, it
    brings the end of the action over to evil, since the treasure of its inclination is filled with an evil spirit. Another may steal, deal unjustly, plunder, defraud, and yet show compassion to the poor: this too has a double face, but the whole is evil. He who defrauds his neighbor provokes God, and swears falsely by the Most High, and yet has pity on the poor. The Lord who gave the law he sets at naught and provokes, yet he refreshes the poor. He defiles the soul and makes the body glad; he kills many and has mercy on a few: this too has a double face. Another does not commit adultery, nor fornication, and abstains from foods, but when he fasts he does evil, and by his power and his wealth he overthrows many; and despite his excessive goodness, he practices lawlessness: this too has a double face. Such men are hares, clean like those that divide the hoof, but in fact they are unclean. For God said in the tablets of the commandments. But do not become, my children, like Sodom, which did
    not recognize the angels of the Lord and perished forever. For I know that you will sin, and be handed over into the hands of your enemies; and your land will be made desolate, and your holy places destroyed, and you will be scattered to the four corners of the earth. And you will be counted in the dispersion as water that vanishes, until the Most High visits the earth, himself coming as a man, with men eating and drinking, and breaking the head of the dragon in the water. He will save Israel and all the nations, God speaking in the person of man. Therefore tell these things to your children also, that they may disobey him. For I know that they will surely be lawless and will not heed the law of God, but the commandments of men; and they will be scattered as leaves are scattered by the wind, and as water is dispersed. But you, my children, if you walk in holiness according to the commandments of the Lord, you will dwell again in safety, and all Israel will be gathered to the Lord.'
translation:
  language: ru
  text: '**Завещание Асира, 6**


    1 Итак, и вы, дети мои, будьте внимательны к заповедям Господа и следуйте истине без двуличия[a]. 2 Ведь двуликие несут двойное наказание: они и сами творят зло, и одобряют тех, кто его творит, подражая духам заблуждения и сражаясь против людей.


    3 Итак, дети мои, храните закон Господа. Не принимайте зло за добро, но устремляйте взор к тому, что поистине добро; держитесь этого, соблюдая все заповеди Господа, живя в этом и находя в этом покой. 4 Ведь по тому, каков конец людей, обнаруживается их праведность, и они становятся известны ангелам Господа и ангелам Велиара[b].


    5 Когда злая душа отходит, её мучит злой дух, которому она служила своими страстями и злыми делами. 6 Если же душа пребывает в покое и радости, ангел мира узнаёт её и вводит в вечную жизнь[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с одним лицом». Этот образ противопоставлен «двуликим» в следующем стихе.'
    reason: Сохраняет существенную словесную связь с διπρόσωποι, не вводя неестественный буквальный оборот в основной текст.
  - marker: b
    text: Велиар — имя олицетворённого зла, противостоящего Господу.
    reason: Кратко поясняет непривычное имя без привнесения позднейшей демонологической системы.
  - marker: c
    text: 'Греческий текст этого предложения грамматически труден: буквально его можно понять и так, что душа «узнаёт ангела мира и вводит его в вечную жизнь». Перевод следует наиболее связному по контексту пониманию, согласно которому ангел узнаёт душу и вводит её в жизнь.'
    reason: Открыто отмечает текстуальную неопределённость и объясняет контекстуальное решение.
lexical_decisions:
- source_word: μονοπροσώπως / διπρόσωποι
  choice: «с одним лицом» / «двуликие»
  rationale: Сохранён намеренный образ одного и двух лиц, связывающий наставление первого стиха с осуждением раздвоенности во втором; более отвлечённое «искренне» утратило бы эту словесную связь.
- source_word: προσέχετε ... τὰς ἐντολὰς
  choice: «будьте внимательны к заповедям»
  rationale: Передаёт значение προσέχω «обращать внимание, внимать» и сохраняет заповеди как прямой предмет увещания.
- source_word: συνευδοκοῦσιν
  choice: «одобряют»
  rationale: Глагол означает согласие и одобрение чужого действия, а не только пассивное присутствие при нём.
- source_word: τὰ τέλη τῶν ἀνθρώπων
  choice: «по тому, каков конец людей»
  rationale: Русская конструкция естественно передаёт буквальное «концы людей» в смысле исхода или кончины, не уточняя преждевременно, идёт ли речь только о смерти или об окончательном уделе.
- source_word: Βελίαρ
  choice: «Велиар»
  rationale: Использована традиционная русская передача греческой формы имени; не подменено более знакомой, но иной формой «Велиал».
- source_word: ἀναστρεφόμενοι ... καταπαύοντες
  choice: «живя в нём и находя в нём покой»
  rationale: Передаёт образ поведения или образа жизни и последующего успокоения в истинном добре.
- source_word: ἐπιθυμίαις
  choice: «страстями»
  rationale: В данном отрицательном контексте речь идёт о порочных желаниях; «страсти» звучит естественно и сохраняет нравственную окраску.
- source_word: ἄγγελον τῆς εἰρήνης
  choice: «ангел мира»
  rationale: εἰρήνη означает мир, примирённость и благополучие; эта формула также противопоставлена злому духу предыдущего стиха.
theological_decisions:
- issue: Отношение ангелов Господа и Велиара в стихе 4
  choice: «ангелам Господа и ангелам Велиара»
  alternative: «ангелам Господа и Велиара»
  rationale: Повтор существительного в русском поясняет общий для обоих родительный оборот и не превращает Велиара в одного из ангелов Господа.
- issue: Действующие лица в стихе 6
  choice: Ангел мира узнаёт мирную душу и вводит её в вечную жизнь
  alternative: Душа узнаёт ангела мира и вводит его в вечную жизнь
  rationale: Сохранившийся греческий текст грамматически нарушен и при буквальном согласовании даёт контекстуально трудный смысл. Основной текст передаёт наиболее связное противопоставление злому духу из стиха 5, а неопределённость открыто отмечена в сноске.
- issue: Посмертное мучение злой души
  choice: Сохранено прямое утверждение текста без догматического уточнения природы или длительности мучения
  alternative: Истолковать как окончательный суд, чистилище или метафору
  rationale: Источник не даёт оснований выбирать одну позднейшую конфессиональную систему толкования.
translation_notes:
  register: Современный литературный русский с достоинством завещательного наставления. Синтаксис умеренно торжественный, но без церковнославянизмов. Образы «одного лица» и «двуликости» сохранены как ключевая риторическая связка. Переведены только стихи, представленные в греческом источнике (6:1–6); продолжение английского консультационного слоя не включено, поскольку соответствующий оригинальный текст в задании отсутствует.
