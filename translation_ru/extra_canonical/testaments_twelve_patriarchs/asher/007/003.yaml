revisions:
- from: До тех пор, пока Всевышний не посетит землю и сам не придёт как человек среди людей, вкушая пищу и питьё вместе с ними и сокрушая голову дракона над водой[b]. Он спасёт Израиль и все народы — [Бог, принявший облик человека][a].
  to: Лишь когда Всевышний посетит землю, сам придя как человек, разделяя с людьми пищу и питьё и сокрушая голову дракона над водой[b], Он спасёт Израиль и все народы — [Бог, принявший человеческий облик][a].
  rationale: 'Исправлены две безопасные редакторские проблемы: русская сочетаемость в описании еды и питья и неудачная временная конструкция. Ревизия не добавляет догматических выводов, сохраняет образный ряд, временную связь, скобочную отмеченность и пространственную неоднозначность ἐπὶ τοῦ ὕδατος.'
