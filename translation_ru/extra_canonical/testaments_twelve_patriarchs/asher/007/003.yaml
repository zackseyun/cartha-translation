base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/003.yaml
  text: Until the Most High visits the earth, himself coming as a man, eating and drinking with men, and crushing the head of the dragon upon the water; this one will save Israel and all the nations [God appearing as a man].
translation:
  language: ru
  text: Лишь когда Всевышний посетит землю, сам придя как человек, разделяя с людьми пищу и питьё и сокрушая голову дракона над водой[b], Он спасёт Израиль и все народы — [Бог, принявший человеческий облик][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Фраза в квадратных скобках так отмечена в исходном издании. Греческое ὑποκρινόμενος может означать «исполняющий роль», «принимающий вид», а также «притворяющийся» или «скрывающийся под видом».
    reason: Необходимо сохранить текстуальную отмеченность заключительной фразы и смысловую неоднозначность глагола.
  - marker: b
    text: 'Или: «на воде»; греческое выражение допускает оба пространственных понимания.'
    reason: Предлог ἐπί с родительным в данном образе не позволяет полностью исключить альтернативное пространственное прочтение.
lexical_decisions:
- source_word: ἐπισκέψηται
  choice: посетит
  rationale: Сохраняет библейское значение действенного Божьего посещения, не сводя его лишь к осмотру или приходу.
- source_word: ὡς ἄνθρωπος μετὰ ἀνθρώπων
  choice: как человек среди людей
  rationale: Естественно передаёт образ пребывания в человеческом облике и общения с людьми, не устраняя сравнительное ὡς.
- source_word: ἐσθίων καὶ πίνων
  choice: вкушая пищу и питьё вместе с ними
  rationale: Передаёт буквальные действия «есть и пить» в контексте совместной жизни с людьми; добавление «вместе с ними» естественно раскрывает μετὰ ἀνθρώπων.
- source_word: συντρίβων τὴν κάραν τοῦ δράκοντος
  choice: сокрушая голову дракона
  rationale: Сохраняет сильный глагол συντρίβω и понятный современному читателю образ; поэтическое κάρα передано обычным русским «голову».
- source_word: ἐπὶ τοῦ ὕδατος
  choice: над водой
  rationale: Предлог ἐπί с родительным допускает пространственное значение «над»; неоднозначность отмечена в сноске.
- source_word: σώσει
  choice: спасёт
  rationale: Прямой эквивалент будущего времени глагола σῴζω.
- source_word: ὑποκρινόμενος
  choice: принявший облик
  rationale: Глагол может означать исполнение роли, притворство или явление в некотором образе. В основном тексте выбран нейтральный вариант, а более резкие оттенки сохранены в сноске.
theological_decisions:
- issue: Отождествление грядущего человека со Всевышним
  choice: Сохранено прямое отнесение действий к Всевышнему и заключительная формула «Бог, принявший облик человека»
  alternative: Понять «он» как отдельного человеческого избавителя
  rationale: Грамматическая последовательность текста связывает приходящего и спасающего с Всевышним; перевод не разрывает эту связь, но и не вводит позднейшую догматическую терминологию.
- issue: Смысл ὑποκρινόμενος в описании Бога
  choice: «принявший облик человека» с пояснением неоднозначности
  alternative: «притворившийся человеком» или «скрывшийся под видом человека»
  rationale: Негативно окрашенное «притворившийся» способно навязать идею обмана, тогда как греческое слово допускает более широкое значение исполнения роли или принятия внешнего вида.
- issue: Статус заключительной фразы в квадратных скобках
  choice: Квадратные скобки сохранены
  alternative: Включить фразу в основной текст без обозначения
  rationale: Так сохраняется редакционная/текстуальная отмеченность фразы в предоставленном греческом издании без предположений о точной истории варианта.
translation_notes:
  register: Современный литературный русский с торжественным библейским оттенком. Синтаксис упрощён до ясного периода, однако последовательность действий и напряжение между человеческим обликом и божественной идентичностью сохранены. Местоимение «Он» начинает новое предложение ради естественности и ясности.
