source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ἐγὼ γὰρ ἔγνων³³ ὅτι ⸀ἀπειθοῦντες⸀³⁴ *ἀπειθήσετε, καὶ ἀσεβοῦντες ἀσεβήσετε³⁵, μὴ προσέχοντες³⁶ *τῷ νόμῳ³⁷ θεοῦ, ἀλλ᾽ ἐντολαῖς ἀνθρώπων *κακίᾳ διαφθειρόμενοι³⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/005.yaml
  text: For I know that, by disobeying, you will disobey, and by acting ungodly, you will act ungodly, paying no attention to the law of God, but being corrupted by wickedness through the commandments of men.
translation:
  language: ru
  text: Ибо я знал, что вы, проявляя неповиновение, будете непокорны и, поступая нечестиво, будете поступать нечестиво, не внимая закону Бога, но внимая заповедям людей и будучи развращаемы злом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπειθοῦντες ἀπειθήσετε
  choice: будете упорствовать в неповиновении
  rationale: Однокоренной греческий оборот усиливает мысль о продолжающемся неповиновении; по-русски смысл передан естественно, без тяжеловесного буквального повтора.
- source_word: ἀσεβοῦντες ἀσεβήσετε
  choice: будете упорствовать… в нечестии
  rationale: Вторая однокоренная конструкция параллельна первой и обозначает устойчивое нечестивое поведение; общий глагол «упорствовать» сохраняет параллелизм в плавной русской фразе.
- source_word: μὴ προσέχοντες τῷ νόμῳ θεοῦ
  choice: не внимая закону Бога
  rationale: προσέχω с дательным падежом означает обращать внимание, внимать или держаться чего-либо; «внимать» сохраняет возвышенный, но понятный регистр.
- source_word: ἀλλ᾽ ἐντολαῖς ἀνθρώπων
  choice: а следуя человеческим заповедям
  rationale: При противопоставлении закону Бога подразумевается тот же смысл направленного внимания; «следуя» ясно выражает практическое подчинение заповедям людей.
- source_word: κακίᾳ διαφθειρόμενοι
  choice: развращаясь злом
  rationale: Дательный κακίᾳ естественно понимается как обозначение причины или средства развращения; перевод не уточняет сверх текста конкретную разновидность зла.
theological_decisions:
- issue: Соотношение закона Бога и человеческих заповедей
  choice: Сохранено прямое противопоставление без уточнения, какие именно человеческие заповеди имеются в виду.
  alternative: Истолковать человеческие заповеди как конкретную религиозную традицию или учение.
  rationale: Греческий текст не называет конкретной группы и не дает основания вводить конфессионально окрашенное толкование.
- issue: Связь κακίᾳ с развращением и человеческими заповедями
  choice: 'κακίᾳ передано как средство или причина развращения: «развращаясь злом».'
  alternative: Передать так, будто развращение совершается непосредственно посредством человеческих заповедей.
  rationale: Форма κακίᾳ непосредственно сочетается с διαφθειρόμενοι, тогда как ἐντολαῖς естественно продолжает управление προσέχοντες; выбранный вариант следует наиболее прозрачному синтаксическому членению, не отождествляя безусловно все человеческие заповеди со злом.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Греческие усилительные однокоренные повторы переданы общей конструкцией «упорствовать в…», чтобы сохранить настойчивость высказывания и избежать неестественной тавтологии.
