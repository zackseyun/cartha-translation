source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Καὶ διὰ τοῦτο³⁹ διασκορπισθήσεσθε⁴⁰ ὡς Γὰδ καὶ⁴¹ Δάν, οἱ ἀδελφοί μου⁴², *καὶ ἀγνοήσετε χώρας αὐτῶν⁴³ καὶ φυλὴν καὶ γλῶσσαν⁴⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/006.yaml
  text: And because of this you will be scattered, like Gad and Dan, my brothers, and you will not know their land, tribe, and language.
translation:
  language: ru
  text: И потому вы будете рассеяны, как Гад и Дан, мои братья, и не будете знать ни их стран, ни племени, ни языка.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διασκορπισθήσεσθε
  choice: будете рассеяны
  rationale: Передаёт будущее страдательного залога и образ насильственного рассеяния без лишнего уточнения.
- source_word: χώρας αὐτῶν
  choice: их страны
  rationale: Сохраняет местоимение αὐτῶν и широкое значение χώρα как земли или страны.
- source_word: φυλὴν
  choice: племени
  rationale: В данном перечислении естественно обозначает племенную принадлежность или народность; более узкое толкование не навязывается.
- source_word: γλῶσσαν
  choice: языка
  rationale: В контексте страны и племени γλῶσσα означает язык.
theological_decisions:
- issue: К кому относится αὐτῶν («их»)?
  choice: Сохранено «их» без разъяснения референта.
  alternative: Передать «своей страны» либо прямо назвать Гада и Дана.
  rationale: Греческий текст допускает синтаксическую неясность; перевод не должен молча устранять её.
translation_notes:
  register: Современный литературный русский с торжественной библейской сдержанностью. Конструкция «ни… ни… ни…» естественно передаёт отрицание, распространяющееся на весь однородный ряд. Обращение «братья мои» выделено запятыми.
