translation:
  language: ru
  text: Не уподобляйтесь Содому, который не узнал ангелов Господа и погиб навеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: Не уподобляйтесь
  rationale: Передаёт запрещение становиться подобными Содому естественным и ёмким русским выражением.
- source_word: ὡς Σόδομα
  choice: Содому
  rationale: После «уподобляйтесь» сравнительное ὡς естественно выражается дательным падежом без отдельного «как».
- source_word: ἠγνόησε
  choice: не распознал
  rationale: Сохраняет значение неспособности узнать или признать, не сводя глагол к простому отсутствию знания.
- source_word: τοὺς ἀγγέλους Κυρίου
  choice: ангелов Господа
  rationale: Прямо передаёт определённую именную группу и родительный Κυρίου.
- source_word: ἀπώλετο ἕως αἰῶνος
  choice: погиб навеки
  rationale: Естественно и точно передаёт гибель с необратимой, вечной длительностью.
theological_decisions:
- issue: Смысл ἠγνόησε применительно к ангелам
  choice: не распознал
  alternative: не признал / не знал
  rationale: «Не распознал» сохраняет возможную отсылку к тому, что жители Содома не узнали в пришедших ангелов, не утверждая сверх текста, что речь исключительно об отказе признать их власть или статус.
- issue: Значение ἕως αἰῶνος
  choice: навеки
  alternative: до века
  rationale: «Навеки» является современным русским соответствием идиомы и сохраняет её усиленный, окончательный характер без искусственного буквализма.
translation_notes:
  register: Современный литературный русский язык; краткая увещательная формулировка сохраняет достоинство и резкость греческого текста. Местоимение «который» согласовано с русской формой названия города мужского рода.
