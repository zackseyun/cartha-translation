  source_fidelity: «Не уподобляйтесь Содому» точно передаёт Μὴ γίνεσθε ὡς Σόδομα. Однако «не распознал» несколько сужает ἠγνόησε до неузнавания их ангельской природы. Глагол допускает более широкое «не узнал / не признал»; «не узнал» в данном контексте сохраняет эту неоднозначность. «Погиб навеки» адекватно передаёт ἀπώλετο ἕως αἰῶνος.
