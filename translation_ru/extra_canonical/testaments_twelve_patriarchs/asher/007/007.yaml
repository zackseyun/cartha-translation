  source_fidelity: 'Греческий текст имеет два параллельных оборота с διά: «через Его милосердие» и «через Авраама, Исаака и Иакова». В основном тексте черновика первое διά передано как «по», тогда как второе — как «через»; это ослабляет заметный синтаксический параллелизм оригинала. Будущее «соберёт» и оборот «в вере» переданы верно. Подлежащее в греческом стихе не выражено; «Он» не добавляет титула, отсутствующего в данном стихе.'
