  text: But the Lord will gather you in faith through his compassion, and through Abraham and Isaac and Jacob.
translation:
  language: ru
  text: Но Он соберёт вас в вере через Своё милосердие и через Авраама, Исаака и Иакова.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπισυνάξει
  choice: соберёт
  rationale: Передаёт будущее время и смысл совместного собирания рассеянных без излишнего уточнения.
- source_word: ἐν πίστει
  choice: в вере
  rationale: 'Сохраняет формальную и смысловую неоднозначность греческого оборота: вера может пониматься как сфера или состояние собирания.'
- source_word: διὰ τῆς εὐσπλαγχνίας αὐτοῦ
  choice: по Своему милосердию
  rationale: Естественно по-русски выражает основание или средство действия; εὐσπλαγχνία обозначает глубокое сострадание и милосердие.
- source_word: δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: через Авраама, Исаака и Иакова
  rationale: Сохраняет повторное διά и его инструментально-посредническую возможность, не объясняя сверх текста характер участия праотцов.
theological_decisions:
- issue: Подлежащее глагола ἐπισυνάξει в данном фрагменте не названо явно
  choice: Он
  alternative: Господь
  rationale: Греческий текст этого стиха содержит подразумеваемое подлежащее, но не слово «Господь»; местоимение сохраняет связь с контекстом и не вносит отсутствующий титул.
- issue: Связь διά с милосердием и праотцами
  choice: «по Своему милосердию — через Авраама, Исаака и Иакова»
  alternative: «через Своё милосердие и через Авраама, Исаака и Иакова»
  rationale: Русское «по милосердию» естественнее для основания божественного действия, тогда как «через» при именах сохраняет возможный посреднический оттенок; тире не утверждает точного богословского механизма.
translation_notes:
  register: Современный литературный русский язык, сдержанный и достойный регистр. Заглавные местоимения относятся к подразумеваемому Богу по контексту. Формулировка сохраняет неоднозначность выражения «в вере» и не уточняет характер участия праотцов.
