id: T12P.ASH.7.2
reference: Testament of Asher 7:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ἐγὼ γὰρ οἶδα⁵ ὅτι ἁμαρτήσετε⁶ καὶ παραδοθήσεσθε εἰς χεῖρας ἐχθρῶν ὑμῶν, ⌜καὶ¹⁸ ἡ γῆ ὑμῶν⁹ ἐρημωθήσεται¹⁰, καὶ τὰ ἅγια ὑμῶν καταφθαρήσονται¹¹, καὶ ὑμεῖς¹² διασκορπισθήσεσθε¹³ εἰς τὰς τέσσαρας¹⁴ γωνίας *τῆς γῆς¹⁵, καὶ ἔσεσθε *εἰς διασπορὰν¹⁶ ἐξουδενωμένοι ὡς¹⁷ ὕδωρ¹⁸ ἄχρηστον¹⁹.⌝'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/002.yaml
  text: For I know that you will sin and be handed over into the hands of your enemies, and your land will be made desolate, and your holy things destroyed, and you will be scattered to the four corners of the earth, and you will be in the dispersion, despised like useless water.
translation:
  language: ru
  text: Ибо я знаю, что вы согрешите и будете преданы в руки ваших врагов; ваша земля опустеет, ваши святыни будут разрушены, а вы будете рассеяны по четырём концам земли и в рассеянии станете презренными, словно негодная вода.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραδοθήσεσθε
  choice: будете преданы
  rationale: Сохраняет пассивную форму и смысл передачи во власть врагов, не уточняя не названного в тексте деятеля.
- source_word: τὰ ἅγια ὑμῶν
  choice: ваши святыни
  rationale: Передаёт широкое значение субстантивированного множественного «святое/священные предметы или места», не сужая его до одного храма или святилища.
- source_word: διασποράν
  choice: рассеяние
  rationale: Передаёт состояние народа вне своей земли и сохраняет связь с предшествующим глаголом «будете рассеяны».
- source_word: ἐξουδενωμένοι
  choice: презренными
  rationale: Отражает значение униженности и отсутствия ценности в глазах других.
- source_word: ὕδωρ ἄχρηστον
  choice: негодная вода
  rationale: Буквально и естественно передаёт образ воды, непригодной для употребления или пользы, не добавляя отсутствующего уточнения.
theological_decisions:
- issue: Значение τὰ ἅγια ὑμῶν
  choice: ваши святыни
  alternative: ваши священные предметы / ваши святые места
  rationale: Выбрана собирательная формулировка, сохраняющая неоднозначность греческого выражения и не отождествляющая его исключительно с храмом, утварью или святыми местами.
translation_notes:
  register: Современный литературный русский язык с торжественным завещательным звучанием. Синтаксический параллелизм пророческого перечисления сохранён; архаизмы и конфессионально маркированная лексика не используются.
