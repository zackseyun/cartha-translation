lexical_decisions:
- source_word: Εἴπατε
  choice: передайте
  rationale: В данном контексте наставления последующим поколениям естественное русское «передайте» выражает повеление сообщить сказанное детям, не сводя смысл к буквальному «скажите».
- source_word: ταῦτα
  choice: это
  rationale: Русское собирательное «это» естественно отсылает к предшествующим наставлениям.
- source_word: μὴ ἀπειθήσωσιν
  choice: чтобы они не ослушались
  rationale: Передаёт отрицательную целевую конструкцию с аористом сослагательного наклонения и значение неповиновения.
- source_word: αὐτῷ
  choice: его
  rationale: Сохраняет мужской род и местоименную отсылку греческого текста, не уточняя референта сверх источника.
theological_decisions:
- issue: Референт местоимения αὐτῷ
  choice: его
  alternative: Бога / Господа
  rationale: Греческий текст содержит лишь местоимение; эксплицитное именование устранило бы сохраняемую источником контекстуальную неоднозначность.
