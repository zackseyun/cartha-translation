base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004.yaml
  text: '1 For good men[a], being single-faced, even if they are thought by the double-faced to be sinning, are righteous before God. 2 And many, in doing away with the wicked, perform two works, one good and one evil; yet the whole is good, because he has uprooted and destroyed the evil. 3 There is one who hates the merciful man and the unjust man, and the adulterer and the one who fasts; this too is double-faced, but the whole work is good, because he imitates the Lord, not expecting what only seems good together with what is truly good[b]. 4 Another does not wish to see good days with the wasteful, lest he defile his body and pollute his soul. Even though this is double-faced, yet it is wholly good. 5 For such men are like gazelles and deer: in the bearing of wild animals they seem to be unclean, but in every respect they are clean, because they walk in zeal for the Lord, keeping away from those things which God also hates and forbids through the commandments[d][c], thus holding back
    evil from good.'
translation:
  language: ru
  text: '1 Ибо добрые люди — однолики[a]; хотя двуличные и считают, что они грешат, перед Богом они праведны. 2 Многие, уничтожая злых, совершают два дела — доброе и злое; но в целом это добро, потому что они искоренили и уничтожили зло. 3 Бывает человек, который ненавидит милосердного и несправедливого, прелюбодея и постящегося. И это двулично, но всё дело доброе, потому что он подражает Господу, не стремясь к тому, что кажется добром, наряду с истинным добром[b]. 4 Другой не желает видеть добрые дни вместе с распутными, чтобы не обесчестить своё тело и не осквернить душу. И это двулично, но в целом добро. 5 Ибо такие люди подобны газелям и оленям: из-за повадок диких животных они кажутся нечистыми, но всецело чисты[c], потому что с ревностью к Господу ходят, воздерживаясь от того, что и Бог ненавидит и запрещает через заповеди, удерживая зло вдали от добра[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «имеют одно лицо»; далее этому противопоставлены «двуличные». Здесь говорится о внутренней цельности, а не о внешности.'
    reason: lexical_alternative
  - marker: b
    text: Греческая фраза текстологически трудна. Буквально говорится о том, чтобы не стремиться или не ожидать «того, что кажется добром», вместе с истинным добром; точная логическая связь остаётся неясной.
    reason: textual_ambiguity
  - marker: c
    text: Сравнение, вероятно, указывает на животных, которые по своим диким повадкам могут казаться нечистыми, хотя сами относятся к чистым. Так противопоставлены внешний вид и подлинная чистота.
    reason: cultural_note
  - marker: d
    text: 'Заключительная греческая фраза очень сжата; возможно также: «отделяя зло от добра» или «не допуская зла к добру». Причастие может относиться к Богу, который запрещает зло через заповеди.'
    reason: alternative_reading
lexical_decisions:
- source_word: μονοπρόσωποι
  choice: однолики
  rationale: Необычное, но понятное слово сохраняет сквозной образ одного лица в противопоставлении двуличию; замена на «искренни» устранила бы важную метафору главы.
- source_word: διπρόσωποι / διπρόσωπον
  choice: двуличные / двулико
  rationale: Естественное русское соответствие сохраняет образ двух лиц и нравственную неоднозначность внешнего впечатления.
- source_word: ἀναιροῦντες
  choice: устраняя
  rationale: Глагол допускает значения от удаления до умерщвления. «Устраняя» сохраняет широту греческого выражения и не сужает его без необходимости до физического убийства.
- source_word: τὸ δὲ ὅλον καλόν
  choice: однако в целом это добро
  rationale: Передаёт повторяющуюся итоговую нравственную оценку всего поступка, не отрицая его внешне смешанного характера.
- source_word: μιμεῖται Κύριον
  choice: подражает Господу
  rationale: Прямо передаёт этический образ подражания, не подменяя его более общим «следует».
- source_word: τὸ δοκοῦν καλὸν ... τοῦ ἀληθινοῦ καλοῦ
  choice: кажущееся добро ... истинное добро
  rationale: Сохраняет принципиальное для рассуждения противопоставление видимой и подлинной доброты.
- source_word: ἀσώτων
  choice: распутными
  rationale: В контексте речь идёт о нравственно разнузданных, беспутных людях; «расточительные» в современном русском неоправданно сузило бы значение до обращения с имуществом.
- source_word: αἰσχράνει ... μολυνεῖ
  choice: обесчестить ... осквернить
  rationale: Два разных глагола сохраняют параллелизм телесного бесчестия и душевного осквернения.
- source_word: δορκάσι καὶ ἐλάφοις
  choice: газелям и оленям
  rationale: Сохраняются оба названных животных и естественная для русского языка зоологическая образность.
- source_word: ἐν ἤθει ἀγρίων
  choice: повадками они напоминают диких зверей
  rationale: Передаёт внешний образ или манеру, из-за которых возникает ошибочное суждение о нечистоте.
- source_word: ἐν ζήλῳ Κυρίου
  choice: ревностно следуют Господу
  rationale: Понимается как человеческая ревность, направленная к Господу; формулировка естественна по-русски и не превращает её в «ревность Господа».
- source_word: ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ
  choice: не допускают зло к добру
  rationale: Сжатая греческая фраза передана без излишнего уточнения характера разделения или удерживания.
theological_decisions:
- issue: Нравственная оценка поступков, внешне выглядящих двойственными
  choice: Некоторые суровые или внешне неоднозначные поступки могут в целом быть добрыми, если направлены на искоренение зла и отделение кажущегося добра от истинного.
  alternative: Любая двойственность без исключения осуждается как лицемерие; либо текст безоговорочно оправдывает любые сомнительные средства.
  rationale: 'Повторяющаяся формула о «двуликом» внешнем виде и добром целом требует сохранить напряжение: автор не восхваляет лицемерие, но отличает внешнюю смешанность от внутренней нравственной раздвоенности.'
- issue: Значение Κύριον в иудейском завещательном тексте
  choice: Господь
  alternative: Бог; ГОСПОДЬ
  rationale: Так непосредственно передаётся греческий титул без внесения более поздней христологической конкретизации или особого конфессионального прочтения.
- issue: Смешанные качества людей в стихе 3
  choice: Речь идёт о милосердном, но несправедливом человеке и о прелюбодее, который постится.
  alternative: 'Речь идёт о четырёх отдельных людях: милосердном, несправедливом, прелюбодее и постящемся.'
  rationale: Артикли и согласование естественнее объединяют качества попарно; именно сочетание доброго и злого в одном человеке объясняет дальнейшее рассуждение о кажущейся двойственности.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Сквозная метафора лица намеренно сохранена словами «однолики» и «двуличные», а синтаксис местами слегка прояснён для обычного читателя. Неясности повреждённой фразы в стихе 3 и сжатого окончания стиха 5 отмечены в сносках, а не устранены догматическим толкованием.
