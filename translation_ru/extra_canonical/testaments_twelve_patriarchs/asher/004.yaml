revisions:
- from: '1 Ибо добрые люди однолики[a]. Даже если двуличные считают, что они грешат, перед Богом они праведны. 2 Многие же, устраняя злых, совершают два дела — доброе и злое; однако в целом это добро, потому что такой человек искоренил и уничтожил зло. 3 Бывает, что человек ненавидит милосердного, но несправедливого, и прелюбодея, который постится. Это тоже выглядит двулико, однако всё это дело — доброе, потому что такой человек подражает Господу, не признавая кажущееся добро наряду с истинным добром[b]. 4 Другой не желает проводить счастливые дни с распутными, чтобы не обесчестить тело и не осквернить душу. Это также выглядит двулико, но в целом является добром. 5 Такие люди подобны газелям и оленям: повадками они напоминают диких зверей и потому кажутся нечистыми, но во всём чисты[c], ибо ревностно следуют Господу, воздерживаясь от того, что Бог ненавидит и запрещает в заповедях, и тем самым не допускают зло к добру[d].'
  to: '1 Ибо добрые люди — однолики[a]; хотя двуличные и считают, что они грешат, перед Богом они праведны. 2 Многие, уничтожая злых, совершают два дела — доброе и злое; но в целом это добро, потому что они искоренили и уничтожили зло. 3 Бывает человек, который ненавидит милосердного и несправедливого, прелюбодея и постящегося. И это двулично, но всё дело доброе, потому что он подражает Господу, не стремясь к тому, что кажется добром, наряду с истинным добром[b]. 4 Другой не желает видеть добрые дни вместе с распутными, чтобы не обесчестить своё тело и не осквернить душу. И это двулично, но в целом добро. 5 Ибо такие люди подобны газелям и оленям: из-за повадок диких животных они кажутся нечистыми, но всецело чисты[c], потому что с ревностью к Господу ходят, воздерживаясь от того, что и Бог ненавидит и запрещает через заповеди, удерживая зло вдали от добра[d].'
  rationale: Исправленное чтение сохраняет образную и нравственную напряжённость главы, не превращая трудный синтаксис стиха 3 в утверждение о двух конкретных сочетаниях качеств. Глагол προσδοκώμενος передан без семантической подмены, а синтаксическая связь финального причастия в стихе 5 отражена в основном тексте и оговорена в сноске. Сохранены современные литературные формулировки и ключевые повторяющиеся образы «одноликий/двуличный».
