  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005.yaml
  text: 'And they said to Jacob[a], “Recognize, then, whether this is your son’s tunic.” And they did so. For they stripped Joseph of the tunic when they were selling him, and clothed him in a servant’s garment. And Simeon took the tunic and did not want to give it. For he wanted to cut him down with the sword, being angry because he had not killed him. But we all rose up and said to him, “If you do not give the tunic, we will tell our father that you alone did this evil thing in Israel.” And so he gave it to them.


    And now, my children, I command you to guard your neighbor and to have compassion toward all, not only among people, but also toward unreasoning animals. For because of these things the Lord blessed me, and when all my brothers were sick, I passed through without illness. For the Lord knows each person’s purpose. Have mercy, therefore, in your hearts[b], because whatever a person does to his neighbor, so the Lord also will do with him. For the sons of my brothers were sick and were dying because of Joseph, because they had not shown mercy in their hearts; but my sons were kept free from sickness, as you know.


    And when I was in the land of Canaan, by the seashore, I used to catch fish[c] for Jacob my father, and when many were being choked in the sea, I came through unharmed[d].'
translation:
  language: ru
  text: 'И сказали Иакову: «Узнай: это ли хитон твоего сына?»[a] Так они и сделали. Ведь, продавая Иосифа, они сняли с него хитон и одели его в рабскую одежду. Симеон же взял хитон и не хотел отдавать его, потому что хотел изрубить его мечом, гневаясь, что не убил Иосифа. Но мы все встали и сказали ему: «Если не отдашь хитон, мы скажем нашему отцу, что ты один совершил это зло в Израиле». Тогда он отдал им хитон, и они сделали так, как сказал Дан.


    5 И теперь, дети мои, я заповедую вам соблюдать заповеди Господа, оказывать милость ближнему и сострадать всем — не только людям, но и неразумным животным. За это Господь благословил меня: когда все мои братья болели, я остался здоров. Ведь Господь знает намерение каждого. Поэтому носите милость в своих сердцах,[b] ибо что бы человек ни сделал своему ближнему, так и Господь поступит с ним. Сыновья моих братьев болели и умирали из-за Иосифа, потому что в их сердцах не было милости; мои же сыновья были сохранены от болезни, как вы знаете.


    Когда я был в земле Ханаанской, у морского берега, я охотился за добычей[c] для моего отца Иакова; и когда многие задыхались в море, я оставался невредим.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Хитон — основная древняя одежда, которую носили непосредственно на теле; возможные более общие переводы: «одежда», «одеяние».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «имейте милость во внутренностях ваших». В греческой идиоме внутренности считались средоточием глубокого сострадания.'
    reason: cultural_note
  - marker: c
    text: 'Буквально: «охотился за добычей». Прибрежная обстановка может подразумевать рыбную ловлю или добывание морских животных, однако греческий текст этого прямо не уточняет.'
    reason: lexical_alternative
  - marker: d
    text: На этом предоставленный фрагмент греческого источника обрывается; предложение или повествование могло продолжаться далее.
    reason: textual_variant
lexical_decisions:
- source_word: χιτών
  choice: хитон
  rationale: Точное обозначение нижней или основной одежды древнего мира; слово известно в современном литературном русском и сохраняет предметную специфику.
- source_word: ἱμάτιον δουλικόν
  choice: рабская одежда
  rationale: δουλικός прямо указывает на принадлежность рабу; перевод сохраняет обозначенный в тексте несвободный статус.
- source_word: κατακόψαι
  choice: зарубить
  rationale: Передаёт сильное значение глагола и сохраняет прямую связь с мечом, не добавляя идеи расчленения.
- source_word: φυλάσσειν τὰς ἐντολὰς Κυρίου
  choice: соблюдать заповеди Господа
  rationale: Греческий источник содержит объект «заповеди Господа», отсутствующий в английском основном тексте; русский перевод восстанавливает его по оригиналу.
- source_word: ποιεῖν ἔλεος πρὸς τὸν πλησίον
  choice: миловать ближнего
  rationale: Компактно передаёт деятельную милость к ближнему и естественно сочетается с последующим призывом к состраданию.
- source_word: ἀλόγοις ζώοις
  choice: неразумным животным
  rationale: Сохраняет явное противопоставление людям и существам, не обладающим разумом, без уничижительного оттенка.
- source_word: προαίρεσιν
  choice: намерение
  rationale: Передаёт внутреннюю сознательную направленность и не сужает значение до единичного решения.
- source_word: ἔλεος ἐν σπλάγχνοις
  choice: милость в своих сердцах
  rationale: Естественный русский эквивалент древней идиомы, в которой внутренности понимаются как средоточие глубокого чувства.
- source_word: ἐθήρευον θήραν
  choice: ловил добычу
  rationale: Сохраняет буквальную неопределённость выражения «охотился за добычей»; прибрежный контекст допускает рыбную ловлю, но сам греческий текст рыбу не называет.
- source_word: ἀβλαβὴς διέμενον
  choice: оставался невредим
  rationale: Передаёт продолженное сохранение от вреда без добавления отсутствующих в греческом подробностей.
theological_decisions:
- issue: Взаимность нравственного воздаяния в 5:3
  choice: «что бы человек ни сделал своему ближнему, так и Господь поступит с ним»
  alternative: «Господь воздаст ему тем же»
  rationale: Сохраняется резкая симметрия греческого высказывания без смягчения или догматического разъяснения механизма воздаяния.
- issue: Распространение сострадания на животных
  choice: «не только людям, но и неразумным животным»
  alternative: «не только людям, но и животным»
  rationale: Перевод сохраняет необычно широкий нравственный охват и явное определение ἀλόγοις.
- issue: Причинная связь болезней с поступком против Иосифа
  choice: «болели и умирали из-за Иосифа»
  alternative: «болели и умирали за то, что сделали Иосифу»
  rationale: Более буквальная формулировка сохраняет краткость и некоторую неоднозначность διὰ Ἰωσήφ, не уточняя сверх текста природу причинности.
translation_notes:
  register: Современный литературный русский с достоинством завещательной речи. Синтаксис упрощён там, где это необходимо для ясности, но сохранены повторения «милость», строгая нравственная взаимность и неопределённость выражения о добыче. Начальные строки относятся к завершению предыдущей главы исходного отрывка; обозначение главы 5 поставлено перед её началом.
