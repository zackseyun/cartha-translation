  text: Reuben was grieved, and he did not eat bread on that day. Then Dan came near and said to him,
translation:
  language: ru
  text: 'Рувим же скорбел и в тот день не ел хлеба. Тогда Дан подошёл и сказал ему:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυπούμενος
  choice: скорбел
  rationale: Передаёт продолжительное состояние печали в естественном и достойном русском регистре.
- source_word: οὐκ ἔφαγεν ἄρτον
  choice: не ел хлеба
  rationale: Сохраняет выраженный в греческом тексте прямой объект и допускает как буквальный, так и идиоматический смысл отказа от пищи.
- source_word: προσελθών
  choice: подошёл
  rationale: Естественно передаёт приближение Дана к Рувиму без избыточного уточнения.
