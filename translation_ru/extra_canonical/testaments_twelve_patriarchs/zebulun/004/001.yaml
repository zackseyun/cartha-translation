base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/001.yaml
  text: For they had heard how much evil had been done against him. And after he had been thrown into the pit, my brothers sat down to eat and drink.
translation:
  language: ru
  text: Ведь они услышали, сколько зла ему причинили. А после того как его продали[a], мои братья сели есть и пить.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте: «продали». Перевод «бросили в яму» отражает контекст повествования, но не значение данного греческого слова.'
    reason: В издании слово отмечено как текстологически сомнительное, а английский POB расходится с сохранившимся греческим чтением; примечание сохраняет прозрачность текстологической проблемы.
lexical_decisions:
- source_word: ἐνεδείξαντο αὐτῷ κακά
  choice: ему причинили зла
  rationale: Передаёт направленное против него злое обращение естественным современным русским языком, не конкретизируя действия сверх греческого текста.
- source_word: πραθῆναι
  choice: его продали
  rationale: Греческий инфинитив аориста страдательного залога от πιπράσκω прямо означает «быть проданным»; поэтому перевод следует оригиналу, а не английскому консультационному слою «брошен в яму».
- source_word: ἐκάθησαν ... ἐσθίειν καὶ πίνειν
  choice: сели есть и пить
  rationale: Естественно и достаточно близко передаёт греческую конструкцию с глаголом «сесть» и инфинитивами.
