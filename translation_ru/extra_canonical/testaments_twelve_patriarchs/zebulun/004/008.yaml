- source_word: τί εἴπωμεν
  choice: что сказать
  rationale: 'Естественно передаёт совещательный оттенок аористного конъюнктива: какое объяснение дать.'
- source_word: τῷ πατρὶ ἡμῶν
  choice: нашему отцу
  rationale: Прямое и естественное соответствие греческому выражению.
