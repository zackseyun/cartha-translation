  text: 2. Ἐγὼ δὲ σπλαγχνιζόμενος τὸν Ἰωσὴφ *οὐκ ἔφαγον³, προσέχων⁴ δὲ τῷ λάκκῳ, ἐπειδὴ⁵ ἐφοβεῖτο⁶ Ἰούδας μήπως ἀποπηδήσαντες⁷ Συμεὼν καὶ ὁ Δὰν καὶ ὁ Γὰδ ἀνέλωσιν αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/002.yaml
  text: But I, having compassion for Joseph, did not eat; for I kept watch by the pit, because Judah feared that Simeon and Dan and Gad might leap up and kill him.
translation:
  language: ru
  text: А я, сжалившись над Иосифом, не ел, но следил за ямой, потому что Иуда боялся, как бы Симеон, Дан и Гад не бросились и не убили его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπλαγχνιζόμενος
  choice: сжалившись
  rationale: Передаёт глубокое сострадание естественным современным русским глаголом, сохраняя обстоятельственное значение причастия.
- source_word: οὐκ ἔφαγον
  choice: не ел
  rationale: Прямое и точное соответствие аористу; контекст не требует уточнения вида пищи или длительности действия.
- source_word: προσέχων δὲ τῷ λάκκῳ
  choice: но следил за ямой
  rationale: προσέχω с дательным здесь означает пристально наблюдать или стеречь; «следил за ямой» звучит естественно и не добавляет отсутствующего в тексте указания места.
- source_word: ἀποπηδήσαντες
  choice: не бросились
  rationale: В данном контексте глагол обозначает внезапное стремительное движение; «бросились» естественно передаёт угрозу нападения, не навязывая буквальное направление прыжка.
- source_word: ἀνέλωσιν
  choice: не убили
  rationale: В контексте угрозы Иосифу глагол ἀναιρέω имеет ясное значение «убить».
theological_decisions:
- issue: Мотив воздержания Завулона от еды
  choice: Сохранена причинная связь с состраданием к Иосифу без дополнительных нравственных пояснений.
  alternative: Истолковать отказ от еды как пост или знак покаяния.
  rationale: Греческий текст говорит лишь о сострадании и отказе от еды; религиозная квалификация поступка была бы добавлением.
- issue: Роль Иуды
  choice: Иуда представлен как опасающийся возможного убийства Иосифа.
  alternative: Представить Иуду непосредственным защитником или распорядителем стражи.
  rationale: Текст сообщает о страхе Иуды, но не уточняет, какие именно действия он предпринял.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Имена переданы в традиционной русской библейской форме. Сохранена неопределённость местоимения «его», хотя из контекста ясно, что речь об Иосифе.
