  text: When Reuben came and heard that he had been sold while he was away, he tore his garments and mourned, saying, “How shall I look upon the face of my father Jacob?”
translation:
  language: ru
  text: 'Когда Рувим пришёл и услышал, что во время его отсутствия Иосифа продали, он разорвал на себе одежду и с плачем сказал: «Как я посмотрю в лицо моему отцу Иакову?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν
  choice: вернулся
  rationale: В контексте отсутствия Рувима причастие естественно передаётся как возвращение к месту событий.
- source_word: ἐπράθη
  choice: продали
  rationale: Аорист пассивного залога означает «был продан»; неопределённо-личная русская конструкция звучит естественно и не добавляет действующего лица.
- source_word: περιεσχίσατο τὸν χιτῶνα αὐτοῦ
  choice: разорвал на себе одежду
  rationale: Передаёт жест скорби; «одежда» понятнее современному читателю, чем узкое «хитон», а «на себе» отражает притяжательное αὐτοῦ.
- source_word: θρηνῶν
  choice: с плачем
  rationale: Сохраняет значение оплакивания и естественно связывается с последующей речью.
- source_word: Πῶς ὄψωμαι τὸ πρόσωπον
  choice: Как я теперь посмотрю в лицо
  rationale: Естественная русская формула, сохраняющая стыд и страх перед встречей, выраженные буквально через созерцание лица.
theological_decisions:
- issue: Не названный в данной греческой фразе субъект продажи
  choice: Иосифа продали
  alternative: его продали
  rationale: Имя «Иосиф» проясняет местоименную отсылку для отдельного стиха, следуя аудированной английской консультационной версии; никакого богословского вывода это не добавляет.
translation_notes:
  register: Современный литературный русский язык с достойной повествовательной интонацией. Реплика Рувима передана живо, без архаизмов; добавленное по смыслу «теперь» подчёркивает возникшую после продажи невозможность предстать перед отцом.
