  text: And taking the silver, he ran after the merchants, but found no one; for they had left the main road and gone by a shorter route through the Troglodytes.
translation:
  language: ru
  text: Взяв серебро, он побежал вслед за купцами, но, не найдя их, вернулся в скорби. Купцы же, покинув широкую дорогу, пошли коротким путём через землю троглодитов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἀργύριον
  choice: серебро
  rationale: Передаёт вещественное значение греческого слова и сохраняет связь с повествованием о плате серебром.
- source_word: κατέδραμεν ὀπίσω τοῖς ἐμπόροις
  choice: побежал вслед за купцами
  rationale: 'Естественно и точно передаёт направленное действие: он бросился догонять купцов.'
- source_word: ὑπέστρεψεν ὀδυρόμενος
  choice: вернулся в скорби
  rationale: В отличие от английского консультационного текста сохраняет засвидетельствованное в греческом оригинале возвращение и сильное душевное страдание.
- source_word: τὴν πλατεῖαν ὁδὸν
  choice: широкую дорогу
  rationale: Формально передаёт прилагательное πλατεῖαν; в контексте это основная, более широкая дорога.
- source_word: διὰ Τρωγλοδιτῶν
  choice: через землю троглодитов
  rationale: Эллиптическое греческое обозначение территории или народа раскрыто минимально для ясного русского синтаксиса без отождествления с конкретным современным местом.
- source_word: ἐν συντόμῳ
  choice: кратчайшим путём
  rationale: 'Передаёт наречное значение выражения: более коротким, прямым маршрутом.'
