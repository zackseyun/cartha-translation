- source_word: ἐν τῷ λάκκῳ
  choice: во рву
  rationale: «Ров» естественно передаёт яму или углубление, куда был брошен Иосиф, без излишнего уточнения формы.
- source_word: ἐποίησε ... τρεῖς ἡμέρας καὶ τρεῖς νύκτας
  choice: провёл ... три дня и три ночи
  rationale: Идиоматичный русский эквивалент греческой конструкции со значением продолжительности пребывания.
- source_word: ἄσιτος
  choice: ничего не ев
  rationale: Передаёт конкретное значение «без пищи, не евший» естественнее, чем неоднозначное в современном русском «постясь».
