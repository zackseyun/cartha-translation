translation_notes:
  register: Современный литературный русский язык; повествование ясное и сдержанное. Частица δέ передана связностью повествования без отдельного «же», а спорное μὴ⁸ переведено по основному тексту. Значение «также» из английского консультационного слоя не добавлено, поскольку в представленном греческом тексте отдельного καί при ἐγώ/με нет.
