  text: And when they saw that I also was not eating, they set me to guard him until he was sold.
translation:
  language: ru
  text: Увидев, что я не ем, меня поставили охранять его, пока его не продали измаильтянам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρῶντές
  choice: Увидев
  rationale: Естественно передаёт обстоятельственное причастие аориста со значением действия, предшествующего основному.
- source_word: μὴ ἐσθίοντα
  choice: не ем
  rationale: 'В зависимой конструкции сохраняется настоящее значение причастия: братья заметили, что Завулон не ест.'
- source_word: ἔθετό με τηρεῖν αὐτόν
  choice: они поставили меня сторожить его
  rationale: Передаёт назначение Завулона охранять Иосифа; множественное «они» следует смыслу контекста, несмотря на форму ἔθετο в приведённом тексте.
- source_word: ἕως οὗ ἀπεδόθη
  choice: пока он не был продан
  rationale: Сохраняет пассивную конструкцию и временную границу действия.
- source_word: τοῖς Ἰσμαηλίταις
  choice: измаильтянам
  rationale: Прямое и традиционно узнаваемое соответствие этнониму в дательном падеже, обозначающему покупателей.
