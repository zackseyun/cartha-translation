  text: 1[a]. Therefore, my children, have compassion in mercy toward every person, so that the Lord also may have compassion in mercy toward you. 2. Because in the last days you also will send forth your compassion upon the earth, and wherever the Most High finds a heart of compassion, there he dwells. 3. For in the measure that a man has compassion on his neighbors, so also the Lord has compassion on him. 4. And when we came down into Egypt, Joseph my brother tested us, and he learned that I was compassionate. 5. For when I sat by him, I did not grieve him with envy, and I did not speak bitterly against him. 6. And after these things, my children, I urge you not to hold malice in your hearts against one another[b], and to love one another in deed and in word. 7. For in the presence of my father I spoke peaceably to Joseph; and when I had gone out, Dan told us that the prince of the eunuchs was seeking to destroy him, because he had become attached to him as a pure and good young man. 8.
    But I wept over Joseph, and I prayed for him, that the Lord would deliver him from every evil intention. 9. And afterward the Ishmaelites came and took him away, and they persuaded him to go with them, and they sold him to Potiphar in Egypt. 10. But because of the compassion that I had shown to my brother, the Lord did not let me fall into the same testing. 11. And when all my brothers were sick, and our father was grieving because of them, I had compassion on every poor man and every sick man, and I gave to all in simplicity of heart. 12. And if I had nothing to give to the needy, I walked with him for seven stadia, weeping with him in mercy. 13. Therefore, my children, have compassion in mercy toward every person with a good heart, so that God also may give you compassion and mercy. 14. For if a man does not have compassion on his neighbor, he provokes the Lord. 15. And if he hardens his heart, and does not have compassion on his neighbor, and does not help the poor, the Lord will
    judge him. 16. For throughout all my life I did not walk in crookedness, but in all simplicity. 17. I did not set my mind on silver or gold, or on any glory of men. 18. I did not wear a double face. 19. I did not devise evil against my neighbor. 20. I did not corrupt my speech with many-colored words. 21. I walked with all men in simplicity of heart. 22. Therefore, my children, do you also have these things, and every spirit of Beliar will flee from you, and no deed of wicked men will rule over you; and every wild beast you will master, since you have with you the God of heaven and earth and walk with men in simplicity of heart. 23. And after he had said these things, he commanded them to carry his body to Hebron and to bury it with his fathers. 24. And when he had fallen asleep at a good old age, his sons laid him in a coffin. 25[c][d]. And afterward they carried him up to Hebron and buried him with his fathers.
translation:
  language: ru
  text: 'Завещание Завулона 7


    1. Я натянул полотно на другом прямом брусе, стоявшем посередине.[a] 2. На нём я ходил вдоль берегов, ловя рыбу для дома моего отца, пока мы не пришли в Египет. 3. Из своего улова я с состраданием давал каждому чужеземцу.[b] 4. Если же кто был чужеземцем, больным или старым, я готовил рыбу и, хорошо приготовив её сообразно нужде каждого, предлагал её всем, разделяя их боль и страдания. 5. Потому и Господь даровал мне много рыбы во время рыбной ловли. Ведь тот, кто делится с ближним, получает от Господа во много раз больше. 6. Так я рыбачил пять лет, делясь со всяким, кого видел, и обеспечивая весь дом моего отца. 7. А половину зимой я готовил вместе с моими братьями.[c] 8. Если же вам нечего дать нуждающемуся, сострадайте ему в милосердии сердца. 9. Знаю, что, когда рука моя не находила, что дать нуждающемуся, я шёл вместе с ним семь стадиев[d] и плакал; внутри у меня всё переворачивалось от сострадания к нему.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая конструкция в ст. 1–2 трудна: не вполне ясно, к какому предмету относится «на нём» и как именно следует представлять описанное устройство. Перевод намеренно не называет его лодкой или мачтой.'
    reason: textual_difficulty
  - marker: b
    text: В греческом издании стихи 3–5 и заключительная часть стиха 6 выделены скобками как текстуально неустойчивый материал.
    reason: textual_variant
  - marker: c
    text: 'Греческая формулировка стиха неясна: не названо, половину чего именно Завулон готовил зимой.'
    reason: textual_difficulty
  - marker: d
    text: Семь стадиев — примерно 1,3 километра.
    reason: cultural_note
lexical_decisions:
- source_word: ὀθόνη
  choice: полотно
  rationale: Слово может обозначать ткань или парус. Нейтральное «полотно» сохраняет предметный образ и не устраняет неоднозначность конструкции.
- source_word: ξύλον ὀρθόν
  choice: прямой брус
  rationale: Буквально речь идёт о стоящем прямо деревянном элементе; перевод не уточняет его как мачту, хотя контекст плавания допускает такое понимание.
- source_word: σπλαγχνίζομαι / σπλάγχνα
  choice: сострадать / сердце
  rationale: В русском буквальный телесный образ «внутренностей» звучал бы неестественно. «Сострадать» передаёт этическую силу глагола, а «сердце» сохраняет представление о глубоком внутреннем движении.
- source_word: μεταδίδωμι
  choice: давать / делиться
  rationale: Глагол обозначает передачу части имеющегося другому; выбор варьируется по синтаксису, сохраняя повторяющийся мотив щедрого участия.
- source_word: πλησίον
  choice: ближний
  rationale: Это естественный русский библейско-этический термин, сохраняющий межличностную направленность наставления.
- source_word: ἐξαρκέω
  choice: обеспечивать
  rationale: Передаёт значение достаточного снабжения всего отцовского дома без искусственной буквальности.
- source_word: στάδιον
  choice: стадий
  rationale: Сохранена древняя мера расстояния; приблизительное современное соответствие вынесено в примечание.
- source_word: συμπάσχω / συναλγέω
  choice: разделять страдания / боль
  rationale: Два близких греческих глагола переданы раздельно, чтобы сохранить усиление, а не свести его к одному общему понятию.
theological_decisions:
- issue: Связь человеческой щедрости с воздаянием Господа
  choice: 'Сохранить прямую формулу: делящийся с ближним получает от Господа во много раз больше.'
  alternative: Ослабить формулу до общего утверждения, что Бог благословляет добрых.
  rationale: Греческий текст прямо связывает участие в нужде ближнего с многократным получением от Господа; перевод не должен превращать это в безличный нравственный принцип.
- issue: Телесный язык сострадания
  choice: Передать σπλάγχνα как глубокое движение сердца, сохранив силу переживания.
  alternative: Буквально перевести как «внутренности» либо обобщить до «жалости».
  rationale: Так сохраняется богословско-нравственный акцент на внутреннем милосердии, но избегается в современном русском непреднамеренно физиологическое звучание.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным завещательным тоном. Предпочтена оптимальная эквивалентность: повторы о сострадании и участии сохранены, тогда как неясные морская конструкция в стихе 1 и пропуск объекта в стихе 7 не конкретизированы. Английский консультационный текст описывает иной набор эпизодов и поэтому не использован как основание для содержания данного отрывка.'
