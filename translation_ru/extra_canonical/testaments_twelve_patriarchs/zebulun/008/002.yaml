  text: For indeed in the last days God will send his compassion upon the earth, and wherever he finds compassion of mercy, there he dwells.
translation:
  language: ru
  text: Ибо ведь в последние дни Бог пошлёт на землю своё сострадание, и где бы Он ни нашёл милосердие, там Он обитает.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ σπλάγχνα αὐτοῦ
  choice: Своё сострадание
  rationale: Буквально «Свои внутренности», но в данном контексте σπλάγχνα обозначает глубокое сострадание; современный русский эквивалент передаёт смысл естественно и достойно.
- source_word: σπλάγχνα ἐλέους
  choice: милосердное сердце
  rationale: Буквально «внутренности милости/милосердия». Русское выражение сохраняет образ внутреннего источника милосердия, не создавая неестественной формулировки.
- source_word: κατοικεῖ
  choice: поселится
  rationale: Форма настоящего времени следует после будущего ἀποστελεῖ и может выражать последующее или обобщённое действие; по-русски будущее время согласует последовательность событий.
theological_decisions:
- issue: Место Божьего обитания
  choice: «в ком… в том»
  alternative: «где… там»
  rationale: Местоимение αὐτῷ грамматически указывает на носителя найденного милосердия; личная формулировка по-русски ясна, но не уточняет природу Божьего присутствия.
translation_notes:
  register: Современный литературный русский язык, сдержанный и возвышенный. Синтаксис близок к греческому, а буквальные семитизирующие образы со σπλάγχνα переданы понятными русскими выражениями.
