  text: 6. Ὅτι τοῦτο⁷ χωρίζει ἑνότητα¹⁸, καὶ Γπᾶσαν συγγένειαν˥¹⁹ διασκορπίζει²⁰, Γκαὶ τὴν ψυχὴν ταράσσει˥²¹ καὶ τὸ πρόσωπον ἀφανίζει²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/006.yaml
  text: For this divides unity, and scatters every kinship, and troubles the soul, and disfigures the face.
translation:
  language: ru
  text: Ибо это разрушает единство, рассеивает всякие родственные связи, тревожит душу и обезображивает лицо.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χωρίζει ἑνότητα
  choice: разрушает единство
  rationale: Буквально выражение означает «разделяет/разъединяет единство»; по-русски естественнее передать результат действия как разрушение единства.
- source_word: πᾶσαν συγγένειαν διασκορπίζει
  choice: разрывает всякие родственные узы
  rationale: συγγένεια обозначает родство или родственные отношения, а διασκορπίζει — рассеивание и разобщение; формулировка передаёт распад связей без неестественного буквального «рассеивает родство».
- source_word: τὴν ψυχὴν ταράσσει
  choice: тревожит душу
  rationale: Сохраняется прямое и естественное соответствие греческому выражению, включая внутреннее смятение.
- source_word: τὸ πρόσωπον ἀφανίζει
  choice: искажает лицо
  rationale: ἀφανίζω может означать делать неузнаваемым, обезображивать или портить внешний вид; «искажает лицо» сохраняет образ и не усиливает его до обязательного физического обезображивания.
