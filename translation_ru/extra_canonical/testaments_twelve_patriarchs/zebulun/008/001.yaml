  text: VIII. Καὶ ὑμεῖς οὖν, τέκνα μου, ἔχετε εὐσπλαγχνίαν *κατὰ παντὸς ἀνθρώπου¹ ἐν ἐλέει, ἵνα καὶ ὁ Κύριος *εἰς ὑμᾶς σπλαγχνισθεὶς² ἐλεήσῃ ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/001.yaml
  text: And so, my children, have compassion toward every person in mercy, so that the Lord also, having compassion on you, may show you mercy.
translation:
  language: ru
  text: Так и вы, дети мои, относитесь с состраданием и милосердием ко всякому человеку, чтобы и Господь, сжалившись над вами, помиловал вас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ὑμεῖς οὖν
  choice: Так и вы
  rationale: Передаёт одновременно связующее «и», обращённое к слушателям «вы» и выводное значение οὖν; по-русски звучит естественно и сохраняет связь с предыдущим наставлением.
- source_word: ἔχετε εὐσπλαγχνίαν … ἐν ἐλέει
  choice: относитесь с состраданием и милосердием
  rationale: 'Сохраняет оба близких, но не тождественных понятия: внутреннее сострадание и деятельное милосердие. Буквальное «имейте сострадание в милости» по-русски неестественно.'
- source_word: κατὰ παντὸς ἀνθρώπου
  choice: ко всякому человеку
  rationale: Передаёт всеобщий охват выражения без ограничения по группе или положению.
- source_word: σπλαγχνισθεὶς … ἐλεήσῃ
  choice: сжалившись … помиловал
  rationale: Различает однокоренные по смыслу, но разные греческие глаголы и сохраняет связь между человеческим состраданием и милостью Господа.
theological_decisions:
- issue: Связь человеческого милосердия с милостью Господа
  choice: «чтобы и Господь, сжалившись над вами, помиловал вас»
  alternative: «и тогда Господь сжалится над вами и помилует вас»
  rationale: Союз ἵνα передан целевым «чтобы», без усиления до однозначной причинно-юридической формулы или гарантированной сделки.
translation_notes:
  register: Современный литературный русский язык; наставительный, тёплый и достойный тон. Повтор смыслового поля сострадания и милости намеренно сохранён как важная черта греческого текста.
