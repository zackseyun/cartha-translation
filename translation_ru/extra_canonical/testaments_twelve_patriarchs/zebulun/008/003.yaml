  text: For as much as a man has compassion on his neighbor, so much also the Lord has compassion on him.
translation:
  language: ru
  text: Ибо насколько человек сострадает своему ближнему, настолько и Господь сострадает ему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπλαγχνίζεται
  choice: сострадает
  rationale: Передаёт глубокое милосердие и сердечное сочувствие, выраженные греческим глаголом, естественным современным русским словом.
- source_word: τὸν πλησίον αὐτοῦ
  choice: своему ближнему
  rationale: Традиционное и понятное библейское соответствие, сохраняющее личное отношение, выраженное αὐτοῦ.
- source_word: τοσοῦτον ... τοσοῦτον
  choice: насколько ... настолько
  rationale: Сохраняет прямую меру-соответствие между человеческим состраданием и состраданием Господа.
theological_decisions:
- issue: Характер соответствия между состраданием человека и Господа
  choice: Сохранена буквальная взаимосвязь «насколько… настолько» без пояснения её механизма.
  alternative: 'Передать обобщённо: «как человек сострадает ближнему, так и Господь сострадает ему».'
  rationale: Греческая сравнительно-количественная конструкция выражает степень соответствия; перевод не должен ослаблять или догматически истолковывать эту напряжённую формулировку.
