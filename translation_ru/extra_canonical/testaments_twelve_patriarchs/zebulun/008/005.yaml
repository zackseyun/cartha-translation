source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 5. Εἰς¹⁴ ὃν *προσέχοντες καὶ ὑμεῖς, τέκνα μου ἀγαπᾶτε ἀλλήλους¹⁵, καὶ μὴ λογίζεσθε¹⁶ ἕκαστος *κακίαν πρὸς τὸν ἀδελφὸν¹⁷ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/005.yaml
  text: Paying attention to him, you also, my children, love one another, and let each one not reckon evil against his brother.
translation:
  language: ru
  text: И вы, дети мои, обращая внимание на него, любите друг друга, и пусть никто не питает злобы против своего брата.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχοντες
  choice: взирая
  rationale: Причастие означает направлять внимание, держать кого-либо в поле нравственного внимания; «взирая» естественно передаёт призыв ориентироваться на упомянутого ранее человека, не добавляя отсутствующего в тексте следствия.
- source_word: ἀγαπᾶτε ἀλλήλους
  choice: любите друг друга
  rationale: Прямое и естественное соответствие взаимному повелению.
- source_word: μὴ λογίζεσθε … κακίαν
  choice: пусть никто не замышляет зла
  rationale: λογίζομαι буквально связано с обдумыванием или расчётом; в сочетании с κακίαν πρὸς передаёт внутреннее намерение причинить зло. «Не замышляет зла» звучит ясно и современно, сохраняя направленность мысли против брата.
- source_word: ἕκαστος
  choice: никто
  rationale: Греческая конструкция «не [пусть] каждый» в русском естественно выражается как «пусть никто не», без изменения всеобщего запрета.
- source_word: ἀδελφόν
  choice: брата
  rationale: Сохранён конкретный родственный термин источника, который в контексте также может обозначать ближнего или члена общины.
theological_decisions:
- issue: Референт местоимения ὃν («на него/которого»)
  choice: «на него» без уточнения личности
  alternative: назвать предполагаемого референта по предшествующему контексту
  rationale: Стих сам не называет референта; уточнение сняло бы присущую связному тексту зависимость от контекста и могло бы привнести толкование.
- issue: Характер зла в выражении λογίζεσθε κακίαν
  choice: внутренний злой умысел против брата
  alternative: «не считайте брата злым» или «не вменяйте зла брату»
  rationale: Синтаксис κακίαν πρὸς τὸν ἀδελφόν естественнее указывает на зло, направленное против брата, а не на оценку его характера или вменение ему проступка.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксис упрощён до естественной русской формы, но последовательность призывов и зависимость начального причастного оборота от предыдущего контекста сохранены.
