- source_word: κατήλθομεν εἰς Αἴγυπτον
  choice: мы сошли в Египет
  rationale: Глагол κατέρχομαι передаёт традиционное пространственное представление о движении «вниз» в Египет; «сошли» сохраняет этот образ и звучит естественно в повествовании.
- source_word: οὐκ ἐμνησικάκησεν ἡμῖν
  choice: не затаил на нас обиды
  rationale: Глагол μνησικακέω означает помнить причинённое зло, держать зло или обиду; выбранная формулировка точно и естественно передаёт отсутствие злопамятства по отношению к братьям.
