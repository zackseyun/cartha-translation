base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010.yaml
  text: 'And you will return to your land, and you will see him in Jerusalem because of his holy name; and healing and compassion will be in his wings. He himself will redeem every captivity of the sons of men from Beliar, and every spirit of deceit will be trampled down. And he will turn all the nations to zeal for him, and you will see God in the form of a man, whom the Lord will choose—Jerusalem is his name.


    9. And again, by the craftiness of your deeds you will provoke him to anger, and you will be cast away from him until the time of completion.


    10. And now, my children, do not be grieved because I am dying, nor fall down in sorrow because I am coming to my end. For I will rise again in your midst, as a ruler in the midst of the sons of righteousness; and I will rejoice in the midst of my tribe, all who keep the law of the Lord. But upon the ungodly the Lord will bring eternal fire, and he will destroy them for generations of generations. But as for me, I now hasten to my rest, as also my fathers did. But you, fear the Lord all the days of your life with all your strength.


    And when he had said these things, he fell asleep, and his sons placed him in a wooden coffin. Later they carried him up and buried him in Hebron with his fathers.'
translation:
  language: ru
  text: 'И вы возвратитесь в свою землю и увидите Его в Иерусалиме ради святого имени Его. И исцеление и милосердие будут на крыльях Его. Он Сам избавит всякий плен сынов человеческих от Велиара, и всякий дух заблуждения будет попран. И Он обратит все народы к ревности по Нему, и вы увидите Бога в облике человека, которого изберёт Господь, — Иерусалим имя Ему.[a]


    9. И снова коварством своих дел вы вызовете Его гнев и будете отвергнуты Им до времени завершения.


    10. А теперь, дети мои, не скорбите о том, что я умираю, и не падайте духом оттого, что я приближаюсь к концу. 2 Ведь я снова восстану среди вас как правитель среди сынов праведности и буду радоваться среди моего племени — среди тех, кто соблюдает закон Господа.[b] 3 А на нечестивых Господь наведёт вечный огонь и погубит их во веки веков. 4 Я же теперь спешу к месту своего покоя, как и мои отцы. 5 Вы же бойтесь Господа всеми силами своими во все дни вашей жизни.[c]


    6 Сказав это, он уснул, и его сыновья положили его в деревянный гроб. 7 Позднее они перенесли его и похоронили в Хевроне вместе с его отцами.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Фраза «Иерусалим имя Ему» в греческом тексте синтаксически трудна; возможны иные способы членения, в том числе связь слова «Иерусалим» с глаголом «изберёт».
    reason: Подлинная текстовая и синтаксическая неоднозначность не должна быть скрыта.
  - marker: b
    text: 'В ряде рукописей после «закона Господа» добавлено: «и заповеди Завулона, отца их».'
    reason: Значимый вариант рукописной традиции.
  - marker: c
    text: 'В ряде рукописей текст пространнее: «бойтесь Господа, Бога нашего, всеми силами своими во все дни вашей жизни».'
    reason: Значимый вариант рукописной традиции; основной текст следует более краткому чтению.
lexical_decisions:
- source_word: εὐσπλαγχνία
  choice: милосердие
  rationale: Передаёт сострадание и глубокую жалость естественным и достойным русским словом.
- source_word: Βελίαρ
  choice: Велиар
  rationale: Сохранена греческая форма имени, характерная для межзаветной литературы.
- source_word: παραζήλωσιν αὐτοῦ
  choice: к ревности по Нему
  rationale: Сохранена необычная и неоднозначная конструкция источника без сведения её к более определённому «поклонению» или «подражанию».
- source_word: σχήματι ἀνθρώπου
  choice: в облике человека
  rationale: Естественно передаёт видимую форму, не добавляя позднейших догматических формулировок.
- source_word: συμπέσητε
  choice: не падайте духом
  rationale: В контексте скорби выражение означает внутренне надломиться; русский оборот сохраняет образ падения и звучит естественно.
- source_word: ἡγούμενος
  choice: правитель
  rationale: Передаёт властное руководство сильнее, чем нейтральное «руководитель», не уточняя природу власти.
- source_word: ἀνάπαυσιν
  choice: место своего покоя
  rationale: Сохраняет эвфемистическое представление о смерти как упокоении.
- source_word: ἐκοιμήθη
  choice: уснул
  rationale: Сохранён традиционный эвфемизм смерти, поддержанный контекстом погребения.
- source_word: θήκην ξυλίνην
  choice: деревянный гроб
  rationale: В погребальном контексте это наиболее ясный современный эквивалент деревянного вместилища.
theological_decisions:
- issue: Фраза «увидите Бога в облике человека»
  choice: Сохранена буквально и без христологического пояснения
  alternative: «увидите Богочеловека» или явное отождествление с Мессией
  rationale: Источник говорит θεὸν ἐν σχήματι ἀνθρώπου; более поздняя догматическая терминология устранила бы историческую неоднозначность.
- issue: Неясная синтаксическая связь «Иерусалим имя Ему»
  choice: Сохранена как отдельное присоединённое утверждение с тире
  alternative: Исправить смысл на «которого Господь изберёт в Иерусалиме»
  rationale: Греческий текст труден и допускает текстологические сомнения; перевод не должен молча перестраивать его по предположению.
- issue: «вечный огонь» и «во веки веков»
  choice: Сохранены обе временные формулы
  alternative: Смягчить до длительного наказания или унифицировать выражения
  rationale: Перевод передаёт напряжённую эсхатологическую лексику источника без конфессионального истолкования.
- issue: «снова восстану»
  choice: Сохранён язык будущего воскресения
  alternative: Передать метафорически как продолжение памяти или наследия
  rationale: ἀναστήσομαι естественно означает «восстану»; метафоризация была бы толкованием сверх текста.
translation_notes:
  register: Современный литературный русский с библейской торжественностью без архаизмов вроде «доколе» и «да не». Местоимения, относящиеся к Богу или ожидаемой небесной фигуре, написаны с прописной буквы для русской религиозно-литературной нормы, но синтаксическая неоднозначность референта не устранена. Нумерация внутри главы сохранена.
