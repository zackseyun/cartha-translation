revisions:
- from: И когда он с горестью произносил эти слова, я, не в силах вынести его стенаний, заплакал; словно печень моя излилась, и всё внутри меня обессилело.
  to: И когда он с горестью произносил эти слова, я, не в силах вынести его стенаний, заплакал; печень моя излилась, и всё существо моих внутренностей изнемогло.
  rationale: Убрано не имеющее соответствия в источнике «словно». Сохранены оба древних соматических образа и передано ὑπόστασις как «существо», без доктринального оттенка. «Изнемогло» естественно передаёт ἐχαυνοῦτο — ослабевало, утрачивало силу.
