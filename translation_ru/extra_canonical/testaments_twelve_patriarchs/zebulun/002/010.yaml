  text: And as he spoke these words in grief, while I could not bear his cries, I began to weep, and my liver was poured out, and all the substance of my inward parts grew faint.
translation:
  language: ru
  text: И когда он с горестью произносил эти слова, я, не в силах вынести его стенаний, заплакал; печень моя излилась, и всё существо моих внутренностей изнемогло.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γὀδυρόμενος˥
  choice: с горестью
  rationale: Передаёт обстоятельственное значение причастия ὀδυρόμενος — речь, сопровождаемую скорбью или сетованием, — естественно для современного русского языка.
- source_word: τῶν οἰμωγῶν
  choice: его стенаний
  rationale: οἰμωγή обозначает громкий скорбный плач, вопль или стон; «стенаний» сохраняет эмоциональную силу и хорошо сочетается с «вынести».
- source_word: τὰ ἤπατά μου ἐξεχύθησαν
  choice: словно печень моя излилась
  rationale: Сохранён древний телесный образ глубочайшего переживания. Добавление «словно» обозначает его образный характер и предотвращает непреднамеренно буквальное анатомическое прочтение.
- source_word: πᾶσα ἡ ὑπόστασις τῶν σπλάγχνων μου
  choice: всё внутри меня
  rationale: Буквально выражение говорит о всей «сущности/основе» внутренних органов; русская формулировка естественно передаёт целостное внутреннее, телесно-душевное потрясение без искусственной анатомичности.
- source_word: ἐχαυνοῦτο
  choice: обессилело
  rationale: Глагол передаёт ослабление, вялость или утрату сил; «обессилело» ясно выражает состояние полного внутреннего изнеможения.
