  text: 'Ибо Симеон, Дан и Гад выступили против Иосифа, чтобы убить его, а он со слезами говорил им:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τὸν Ἰωσήφ
  choice: к Иосифу
  rationale: В данном враждебном контексте конструкция обозначает направленное выступление против Иосифа; по-русски цель и враждебность ясно раскрывает последующее «чтобы убить его».
- source_word: τοῦ ἀνελεῖν αὐτόν
  choice: чтобы убить его
  rationale: Артикль с инфинитивом выражает цель; ἀναιρέω здесь означает лишить жизни.
- source_word: ἔλεγεν αὐτοῖς
  choice: говорил им
  rationale: Имперфект передаёт продолжающуюся или начинающуюся речь; двоеточие естественно вводит её содержание в следующем стихе.
- source_word: μετὰ δακρύων
  choice: со слезами
  rationale: Прямое и естественное соответствие греческому обороту, сохраняющее эмоциональную сдержанность оригинала.
