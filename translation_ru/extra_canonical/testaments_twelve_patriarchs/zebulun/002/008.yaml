base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/008.yaml
  text: “Have mercy on me, my brothers; have compassion, by the compassion of Jacob our father. Do not bring your hands upon me to shed innocent blood, for I have not sinned against you.”
translation:
  language: ru
  text: '«Смилуйтесь надо мной, братья мои; пощадите чувства Иакова, отца нашего¹. Не поднимайте на меня рук, чтобы пролить невинную кровь, ведь я не согрешил против вас».


    ¹ Букв. «внутренности Иакова». Греч. σπλάγχνα может обозначать внутренности, а образно — глубокие чувства, сострадание.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλεήσατέ με
  choice: Смилуйтесь надо мной
  rationale: Передаёт повелительную форму и просьбу о милости естественным, достойным русским выражением.
- source_word: οἰκτειρήσατε σπλάγχνα Ἰακὼβ τοῦ πατρὸς ἡμῶν
  choice: сжальтесь ради сострадания Иакова, отца нашего
  rationale: Сохраняет повторный призыв к состраданию и образ σπλάγχνα как глубокого внутреннего сострадания; «ради» естественно выражает не вполне явную синтаксическую связь.
- source_word: Μὴ ἐπαγάγετε τὰς χεῖρας ὑμῶν
  choice: Не поднимайте на меня рук
  rationale: Русская идиома точно передаёт запрет направить руки против говорящего; объект «на меня» подразумевается греческим контекстом.
- source_word: ἐκχέαι αἷμα ἀθῷον
  choice: чтобы пролить невинную кровь
  rationale: Сохраняет традиционный и ясный библейский оборот.
- source_word: οὐχ ἥμαρτον … εἰς ὑμᾶς
  choice: я не согрешил против вас
  rationale: Обычная передача конструкции ἁμαρτάνω εἰς, обозначающей проступок против кого-либо.
theological_decisions:
- issue: Основание второго призыва к состраданию
  choice: ради сострадания Иакова
  alternative: пощадите утробу Иакова / сжальтесь над Иаковом
  rationale: Греческое σπλάγχνα буквально обозначает внутренности и образно глубокое сострадание. Формулировка сохраняет образный смысл, не превращая неясную конструкцию в однозначное утверждение, будто объектом жалости является сам Иаков.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «смилуйтесь… сжальтесь» сохранён как риторический параллелизм оригинала; архаизмы и конфессионально окрашенные добавления исключены.
