  text: 4. Οὐκ ἔγνων ⌜δὲ²⁶⌝ ὅτι ἥμαρτον ἐν ταῖς ἡμέραις μου ⌜παρεκτὸς ἐννοίας⌝.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/003.yaml
  text: And I did not know that I had sinned in my days, except in intention.
translation:
  language: ru
  text: Однако я не сознавал, что согрешил в дни своей жизни, разве только в помыслах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: не сознавал
  rationale: Передаёт аорист глагола «знать, осознавать, признавать» в ретроспективном контексте естественным русским выражением.
- source_word: ἐν ταῖς ἡμέραις μου
  choice: в дни своей жизни
  rationale: Сохраняет библейский образ «моих дней», одновременно ясно выражая его временной смысл.
- source_word: παρεκτὸς ἐννοίας
  choice: разве только в помыслах
  rationale: 'Передаёт исключительное значение παρεκτός и сохраняет широту ἔννοια: внутреннюю мысль, намерение или замысел, не сужая смысл исключительно до сознательного намерения.'
theological_decisions:
- issue: Характер признанного греха
  choice: в помыслах
  alternative: в намерении
  rationale: Греческое ἔννοια допускает значения мысли, замысла и намерения. Более широкое «в помыслах» сохраняет неоднозначность и не определяет степень сознательности греха.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис близок к греческому, но остаётся естественным и понятным; временная форма согласована с ретроспективным повествованием.
