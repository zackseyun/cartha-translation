  text: But even if I have sinned, discipline me with discipline, my brothers; but do not raise your hand in the murder of your brother, for the sake of Jacob your father.”
translation:
  language: ru
  text: Но даже если я согрешил, вразумите меня наказанием, братья мои; но не поднимайте руку на вашего брата, убивая его, ради Иакова, отца вашего».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν παιδείᾳ παιδεύσατέ με
  choice: накажите меня
  rationale: Греческая этимологическая фигура буквально означает «наказанием накажите/вразумите меня». В современном русском повтор звучал бы тяжеловесно, поэтому значение дисциплинарного наказания передано естественно и кратко.
- source_word: τὴν δὲ χεῖρα ὑμῶν μὴ ἐνέγκατε ἐν φόνῳ
  choice: только не поднимайте руки, чтобы убить
  rationale: Передаёт образ поднятой против человека руки и ясно выражает направленность действия на убийство, не превращая φόνῳ в отвлечённое «убийство».
- source_word: διὰ Ἰακὼβ τὸν πατέρα ὑμῶν
  choice: ради Иакова, отца вашего
  rationale: Сохраняет мотивирующее значение διά с винительным и торжественный порядок определения.
theological_decisions:
- issue: Степень признания вины в условной конструкции
  choice: даже если я согрешил
  alternative: хотя я и согрешил
  rationale: Сохранено подлинно условное значение εἰ δὲ καί; фраза не превращена в безоговорочное признание вины.
- issue: Смысл παιδεία
  choice: дисциплинарно наказать
  alternative: наставить / воспитать
  rationale: Контекст противопоставляет допустимое исправительное наказание убийству; русский глагол «наказать» сохраняет это напряжение, не уточняя конкретную меру.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Обращение «братья мои» и постпозиция «отца вашего» поддерживают достоинство речи; синтаксис остаётся ясным для обычного читателя.
