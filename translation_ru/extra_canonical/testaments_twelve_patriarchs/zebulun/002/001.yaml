  text: Сыновья Завулона, внимайте словам вашего отца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: υἱοὶ Ζαβουλών
  choice: Сыновья Завулона
  rationale: Прямое обращение с сохранением родительного падежа имени; форма «Завулон» соответствует принятой русской библейской традиции.
- source_word: προσέχετε
  choice: внимайте
  rationale: Повелительная форма передаёт призыв внимательно слушать и принимать к сердцу; «внимайте» звучит достойно и естественно в наставлении отца.
- source_word: ῥήμασιν
  choice: словам
  rationale: Дательный падеж обусловлен глаголом προσέχετε; нейтральное «словам» сохраняет широкий смысл речи или наставления.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: вашего отца
  rationale: Точно передаёт родительный оборот и обращение к нескольким сыновьям; в русском языке местоимение естественно согласуется с собирательным адресатом.
