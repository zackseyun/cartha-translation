  text: But I wept in secret for many days because of Joseph. For I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be killed.
translation:
  language: ru
  text: Но я много дней тайно плакал об Иосифе. Ведь я боялся своих братьев, потому что все они условились убить того, кто раскроет тайну.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν κρυφῇ
  choice: тайно
  rationale: Естественно и точно передаёт обстоятельственное значение «втайне, скрытно».
- source_word: διὰ τὸν Ἰωσήφ
  choice: об Иосифе
  rationale: В контексте плача выражает причину и предмет скорби; по-русски «плакал об Иосифе» звучит естественнее буквального «из-за Иосифа» и не подразумевает его вину.
- source_word: συνέθεντο πάντες
  choice: все они условились
  rationale: Передаёт взаимное соглашение всех братьев, сохраняя повествовательный и несколько торжественный регистр.
- source_word: ὅστις ἐξείπῃ τὸ μυστήριον
  choice: того, кто раскроет тайну
  rationale: ἐξείπῃ здесь означает сообщить или выдать скрываемое; «раскроет тайну» — ясное современное соответствие.
- source_word: ἀναιρεθῆναι αὐτόν
  choice: убить того
  rationale: Пассивный инфинитив в конструкции соглашения обозначает, что нарушитель должен быть убит; русская активная конструкция естественна и прямо передаёт смысл.
