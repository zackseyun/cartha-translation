  terminology: «Беззаконие» является удачным эквивалентом παρανομία и сохраняет нравственно-правовую силу термина. Иосиф передан в традиционной русской форме; богословски нагруженные или конфессионально спорные добавления отсутствуют. Оба сносочных маркера стоят непосредственно после соответствующих мест.
