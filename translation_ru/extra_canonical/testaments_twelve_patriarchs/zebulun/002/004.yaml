base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/004.yaml
  text: I do not remember that I committed lawlessness, except for the ignorance that I committed concerning Joseph, in that I assured my brothers not to tell my father what had happened.
translation:
  language: ru
  text: 'Я не помню, чтобы я совершил какое-либо беззаконие, кроме поступка по неведению[a] в деле Иосифа: я заверил братьев, что не расскажу отцу о случившемся.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «кроме неведения, которое я совершил».'
    reason: Поясняет необычное греческое сочетание и показывает, почему оно передано естественным русским выражением.
  - marker: b
    text: 'Греческую фразу можно также понять так: «я утвердил братьев в том, чтобы они не рассказывали моему отцу о случившемся».'
    reason: Сохраняет синтаксическую неоднозначность относительно того, кто именно должен был молчать.
lexical_decisions:
- source_word: παρανομίαν
  choice: беззаконие
  rationale: Передаёт нарушение нравственного закона и сохраняет более сильную окраску исходного слова, чем нейтральное «проступок».
- source_word: τὴν ἄγνοιαν ἣν ἐποίησα
  choice: поступка по неведению
  rationale: Греческое выражение буквально говорит о «неведении», которое было совершено; по-русски сочетание «совершить неведение» неестественно, поэтому смысл и повтор глагола ἐποίησα переданы идиоматически.
- source_word: ἐπὶ τοῦ Ἰωσήφ
  choice: в деле Иосифа
  rationale: Сохраняет широкое значение оборота — поступок, связанный с тем, что произошло с Иосифом, — не уточняя сверх текста.
- source_word: ἐβεβαίωσα
  choice: заверил
  rationale: Передаёт значение твёрдого подтверждения или обещания в данном контексте.
- source_word: τὸ γενόμενον
  choice: о случившемся
  rationale: Естественный русский эквивалент выражения «то, что произошло».
theological_decisions:
- issue: Нравственная оценка участия Завулона в деле Иосифа
  choice: Сохранено напряжение между заявлением об отсутствии иных беззаконий и признанием поступка «по неведению».
  alternative: Ослабить признание до простой ошибки или, напротив, назвать его сознательным грехом.
  rationale: Исходный текст одновременно употребляет сильное слово παρανομία и характеризует конкретный поступок как ἄγνοια; перевод не должен устранять это напряжение.
- issue: Подразумеваемый субъект инфинитива μὴ εἰπεῖν
  choice: «что не расскажу» — обещание самого говорящего.
  alternative: «чтобы они не рассказывали» — заверение или укрепление братьев в молчании.
  rationale: Такое прочтение естественно связывает инфинитив с говорящим и соответствует консультационному английскому тексту, однако греческая конструкция допускает и отнесение действия к братьям; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного повествования. Синтаксис сделан ясным для обычного читателя, при этом ключевые нравственные термины и неоднозначность греческой конструкции сохранены.
