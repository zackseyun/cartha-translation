  source_fidelity: 'Перевод точно передаёт основной смысл греческого текста: отрицание совершённого «беззакония» (παρανομία), исключение в связи с неведением относительно Иосифа и последующее заверение, касающееся несообщения отцу о произошедшем. Необычное сочетание «неведение, которое я совершил» удачно и прозрачно разъяснено сноской. Синтаксическая соотнесённость инфинитива μὴ εἰπεῖν с говорящим либо с братьями действительно не вполне бесспорна; основной вариант избирает одно допустимое прочтение, а сноска честно фиксирует другое.'
