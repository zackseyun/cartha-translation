  text: And I wept together with Joseph, and my heart thundered, and the joints of my body trembled, and I had no strength.
translation:
  language: ru
  text: И я плакал вместе с Иосифом; сердце моё гудело, суставы тела моего дрожали, и я не мог устоять на ногах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβόμβει
  choice: гудело
  rationale: Передаёт буквальный образ сильного внутреннего гула или рокота, не сводя его к обычному сердцебиению и сохраняя необычность греческого выражения.
- source_word: οἱ ἁρμοὶ τοῦ σώματός μου
  choice: все суставы тела моего
  rationale: ἁρμοί буквально означает соединения или суставы; добавление «все» естественно по-русски передаёт греческий артикль при множественном числе в обобщённом значении.
- source_word: οὐκ ἠδυνάμην στῆναι
  choice: я не мог устоять на ногах
  rationale: Глагол στῆναι буквально связан со стоянием; русское выражение ясно передаёт физическую неспособность стоять, не подменяя её более общим отсутствием сил.
