- source_word: ἀνελεῖν
  choice: убить
  rationale: В контексте намерения братьев означает лишить жизни; прямой русский эквивалент сохраняет силу исходного выражения.
- source_word: μετὰ δακρύων προσεκάλουν
  choice: со слезами умолял
  rationale: Сочетание передаёт и слёзы, и настойчивую мольбу; русская формулировка звучит естественно и достойно.
- source_word: μὴ ποιῆσαι τὴν ἁμαρτίαν ταύτην
  choice: не совершать этого греха
  rationale: Близко воспроизводит греческую конструкцию и не ослабляет нравственной оценки поступка.
