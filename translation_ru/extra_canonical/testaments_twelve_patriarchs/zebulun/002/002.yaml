  source_fidelity: Начальная фраза передана точно. Однако ηὐξήνθη относится прямо к отцу как грамматическому подлежащему, а овцы и крупный скот присоединены как также увеличившиеся; «отец ... умножил своё достояние» заменяет эту конструкцию причинно-агентивным пересказом. В заключении «благодаря» и деепричастие «получив» добавляют инструментальное значение и завершённость, которых в ἐν ... εἶχον τὸν κλῆρον нет. Неоднозначность εἶχον (1-е лицо ед. числа или 3-е лицо мн. числа) следует оставить в сноске, не выдавая одно толкование за смысл текста.
