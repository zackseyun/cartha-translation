base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/002.yaml
  text: I, Zebulun, became a good gift to my parents; for when I was born, my father increased greatly, and so did the sheep and the cattle, when he had his portion among the variegated rods.
translation:
  language: ru
  text: Я, Завулон, стал добрым даром для своих родителей. Ведь когда я родился, мой отец весьма разбогател, и овцы и крупный скот тоже умножились, когда среди пёстрых прутьев была его доля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая форма «имел» здесь грамматически неоднозначна: она может значить «я имел» или «они имели». В основном тексте «его доля» следует контекстуальному пониманию, связывающему эту фразу с отцом Завулона; отсылка, вероятно, относится к пёстрым прутьям в повествовании об Иакове (Быт. 30:37–43).'
    reason: Уточняет реальную грамматическую неоднозначность формы εἶχον, отмечает, что основное чтение контекстуально, и не добавляет в перевод отсутствующее причинное значение.
lexical_decisions:
- source_word: δόσις ἀγαθή
  choice: добрым даром
  rationale: Сохраняет прямой образ «доброго дара» и естественно звучит по-русски.
- source_word: ηὐξήνθη ... σφόδρα
  choice: весьма умножил своё достояние
  rationale: Греческий глагол буквально обозначает сильное увеличение; контекст овец и крупного скота показывает, что речь идёт о росте имущества отца, а не о его физическом росте.
- source_word: τὰ πρόβατα καὶ τὰ βουκόλια
  choice: овец и крупный скот
  rationale: Передаёт оба вида стад без избыточного повторения слова «стада».
- source_word: ἐν ταῖς ποικίλαις ῥάβδοις
  choice: благодаря пёстрым прутьям
  rationale: Выражает связь с пёстрыми прутьями из рассказа о приумножении стад Иакова; предлог ἐν допускает инструментально-обстоятельственное понимание.
- source_word: τὸν κλῆρον
  choice: свою долю
  rationale: Передаёт значение назначенной или доставшейся доли в данном хозяйственном контексте.
theological_decisions:
- issue: Субъект заключительной формы εἶχον
  choice: По смыслу отнести получение доли к отцу Завулона
  alternative: 'Буквально: «когда у меня была доля среди пёстрых прутьев»'
  rationale: Форма εἶχον формально может быть первым лицом единственного числа, однако ближайший контекст говорит об отце и его стадах; буквальное отнесение к Завулону создаёт хронологическую несообразность. Разночтение отражено в сноске, а не устранено молча.
translation_notes:
  register: Современный литературный русский язык с достоинством патриархального завещания. Синтаксис сделан естественным для широкого читателя, при этом образ «доброго дара» и конкретная деталь о пёстрых прутьях сохранены.
