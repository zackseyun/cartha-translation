revisions:
- from: Я, Завулон, стал добрым даром для своих родителей. Ведь когда я родился, мой отец весьма умножил своё достояние — овец и крупный скот, — получив свою долю благодаря пёстрым прутьям.[a]
  to: Я, Завулон, стал добрым даром для своих родителей. Ведь когда я родился, мой отец весьма разбогател, и овцы и крупный скот тоже умножились, когда среди пёстрых прутьев была его доля.[a]
  rationale: 'Перевод исправлен для сохранения грамматических отношений оригинала: отец и его стада представлены как увеличившиеся, а не как деятель и его имущество. Заключительная фраза передана без добавленного значения «благодаря» или «получив»; контекстуальное отнесение доли к отцу сохранено, но её спорная грамматика прозрачно отмечена в сноске.'
