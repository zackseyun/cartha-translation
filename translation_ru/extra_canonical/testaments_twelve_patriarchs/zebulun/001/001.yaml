  text: A copy of the words of Zebulun, which he charged his sons before he died, in the one hundred and fourteenth year of his life, two years after the death of Joseph.
translation:
  language: ru
  text: 'Завещание Завулона, шестого сына Иакова и Лии.


    1 Вот запись слов Завулона, которые он завещал своим сыновьям перед смертью, на сто четырнадцатом году своей жизни, через два года после смерти Иосифа.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον λόγων
  choice: запись слов
  rationale: «Список/копия слов» в данном заголовочном контексте естественно передаётся как «запись слов», сохраняя представление о письменном воспроизведении речи.
- source_word: διέθετο
  choice: обратился
  rationale: Средний аорист от διατίθημι здесь связан с предсмертным распоряжением или завещательной речью; «обратился» звучит естественно и не навязывает более узкого юридического смысла.
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν
  choice: перед смертью
  rationale: Краткая и точная современная передача временной конструкции «прежде чем ему умереть».
- source_word: ἐν τῷ ἑκατοστῷ τετάρτῳ καὶ δεκάτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: на сто четырнадцатом году своей жизни
  rationale: Сохраняет греческий способ обозначения возраста и чтение 114, ясно засвидетельствованное предоставленным текстом.
- source_word: μετὰ οὖν δύο ἔτη τοῦ θανάτου Ἰωσήφ
  choice: через два года после смерти Иосифа
  rationale: Передаёт временное отношение прямо и по-русски естественно; οὖν не требует отдельного выражения в заголовочной хронологической формуле.
theological_decisions:
- issue: Идентичность завещателя и его возраст
  choice: Завулон; сто четырнадцатый год
  alternative: Дан; сто двадцатый год
  rationale: Предоставленный греческий источник недвусмысленно называет Ζαβουλών и указывает ἑκατοστῷ τετάρτῳ καὶ δεκάτῳ, то есть сто четырнадцатый год. Противоречащая этому последняя ревизия относится, по-видимому, к иному завещанию и не может переопределять исходный текст.
- issue: Характер слов Завулона
  choice: «с которыми он обратился»
  alternative: «которые он завещал / которыми наставлял»
  rationale: Форма διέθετο допускает завещательно-распорядительный оттенок. Выбранная формулировка сохраняет предсмертный контекст, не сужая значение до юридического завещания или только наставления.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего заголовка. Заглавие включено как часть предоставленного греческого фрагмента, а стих 1 отделён абзацем. Маркеры сносок не добавлены, поскольку публикационных сносок в проекте нет.
