  source_fidelity: 'Имя, родословное определение, возраст (114 лет) и указание на два года после смерти Иосифа переданы верно и соответствуют греческому тексту. Однако «с которыми он обратился к своим сыновьям» ослабляет значение διέθετο: в данном завещательном заголовке речь о словах, которые он оставил/завещал сыновьям как предсмертное наставление, а не просто о факте обращения к ним.'
  naturalness: Текст в целом написан естественным современным литературным русским языком. Формула «которые он завещал своим сыновьям» одновременно естественна в жанре и точнее передаёт исходный смысл.
  terminology: '«Завещание», «Завулон», «Иаков», «Лия» и «Иосиф» употреблены последовательно и в принятой русской библейской форме. «Запись слов» допустимо передаёт Ἀντίγραφον λόγων. Сносочные маркеры не требуются: в предоставленном проекте нет текста публикационных примечаний, к которым их можно было бы привязать.'
