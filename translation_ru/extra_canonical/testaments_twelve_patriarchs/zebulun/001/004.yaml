lexical_decisions:
- source_word: I do not know that I sinned in my days
  choice: Я не знаю за собой иного греха за всю мою жизнь
  rationale: Так по-русски естественно передаётся заявление говорящего о том, что ему не известен за собой какой-либо иной грех; «в мои дни» выражено идиоматически как «за всю мою жизнь».
- source_word: except in thought
  choice: кроме греха в мыслях
  rationale: Сохраняет противопоставление между совершённым поступком и внутренним согрешением, не уточняя ни содержания мысли, ни степени вины.
theological_decisions:
- issue: Характер утверждения о безгрешности
  choice: 'Формулировка ограничена субъективным знанием говорящего: «не знаю за собой»'
  alternative: «Я не грешил»
  rationale: Более сильная альтернатива превратила бы заявление о знании и совести в безусловное утверждение о полной безгрешности.
translation_notes:
  register: Современный литературный русский язык, сдержанный и исповедальный тон. Предоставленный греческий фрагмент на уровне главы заканчивается раньше данного стиха и не позволяет непосредственно сверить его греческую формулировку; поэтому проектная формулировка следует аудированному английскому консультационному слою и должна считаться предварительной до выравнивания греческого текста стиха.
