base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/005.yaml
  text: I do not remember that I committed any lawlessness, except for the unwitting wrong I did concerning Joseph, in that I gave my brothers my pledge not to tell my father what had happened.
translation:
  language: ru
  text: 'Я не помню за собой никакого беззакония, кроме того неумышленного проступка в деле Иосифа: я дал братьям слово не рассказывать отцу о случившемся.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lawlessness
  choice: беззаконие
  rationale: Сохраняет нравственно-правовой смысл и возвышенный тон, не сужая значение до конкретного преступления.
- source_word: unwitting wrong
  choice: неумышленный проступок
  rationale: Передаёт отсутствие намерения и одновременно признаёт нравственную вину; звучит естественно по-русски.
- source_word: gave my brothers my pledge
  choice: дал братьям слово
  rationale: Современное и ясное выражение обязательства хранить молчание без излишне юридического оттенка.
- source_word: concerning Joseph
  choice: в деле Иосифа
  rationale: Передаёт широкую отсылку к событиям вокруг Иосифа, не уточняя того, чего исходное свидетельство здесь не уточняет.
theological_decisions:
- issue: Степень нравственной ответственности Завулона
  choice: неумышленный проступок
  alternative: невольный грех
  rationale: Формулировка сохраняет напряжение между заявлением об отсутствии беззакония и признанием проступка, не вводя более узкий богословский термин «грех» без выровненного греческого текста стиха.
translation_notes:
  register: Современный литературный русский язык с достойным завещательным тоном. Поскольку предоставленный греческий фрагмент не выровнен со стихом 1:5 и содержит только начало главы, перевод данного стиха опирается на проверенный английский консультационный слой и не приписывает ему отсутствующие в доступном греческом фрагменте детали.
