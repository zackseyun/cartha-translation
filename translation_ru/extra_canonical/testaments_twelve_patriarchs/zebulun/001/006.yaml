base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/006.yaml
  text: But I wept in secret for many days because of Joseph; for I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be put to death.
translation:
  language: ru
  text: 'Но я много дней тайно плакал об Иосифе, потому что боялся своих братьев: все они условились предать смерти того, кто раскроет тайну.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'English consultation: “wept in secret”'
  choice: тайно плакал
  rationale: Естественно передаёт скрытый от других плач, не добавляя отсутствующих подробностей.
- source_word: 'English consultation: “because of Joseph”'
  choice: об Иосифе
  rationale: В данном контексте речь идёт о скорби по поводу участи Иосифа; оборот «плакал об Иосифе» сохраняет связь с ним и звучит литературно.
- source_word: 'English consultation: “had all agreed”'
  choice: все они условились
  rationale: Передаёт общее соглашение братьев, не уточняя его формальную сторону.
- source_word: 'English consultation: “disclosed the secret”'
  choice: раскроет тайну
  rationale: Современный и ясный русский эквивалент разглашения скрытого дела.
- source_word: 'English consultation: “should be put to death”'
  choice: предать смерти
  rationale: Достоинству древнего текста соответствует нейтрально-литературная формулировка без уточнения способа казни.
theological_decisions:
- issue: Основание страха Завулона
  choice: Сохранена причинная связь между страхом перед братьями и их общим смертным решением.
  alternative: Истолковать страх как общее чувство вины или угрозу со стороны отдельных братьев.
  rationale: Консультационный текст прямо связывает страх с соглашением всех братьев; иных мотивов добавлять не следует.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Представленный греческий фрагмент относится к началу главы и не содержит выровненного текста стиха 1:6, поэтому формулировка осторожно следует английскому POB как аудированному консультационному слою, не выдавая её за прямое пословное восстановление греческого оригинала.
