  text: I, Zebulun, became a good gift to my parents; for when I was born, my father increased very greatly, and so did the flocks and the herds, when by the speckled rods he gained his portion.
translation:
  language: ru
  text: 'Я, Завулон, стал добрым даром для моих родителей: ведь с моим рождением мой отец чрезвычайно разбогател — у него умножились овцы и крупный скот; благодаря пёстрым прутьям он получил свою долю.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δῶρον ἀγαθόν
  choice: добрым даром
  rationale: Сохраняет образ имени Завулона как благого дара родителям и естественно звучит по-русски.
- source_word: τοῖς γονεῦσί μου
  choice: для своих родителей
  rationale: Передаёт отношение адресата дара современным и ясным русским оборотом.
- source_word: τὰ πρόβατα καὶ τὰ βοσκήματα
  choice: овцы и крупный скот
  rationale: Различает стада мелкого скота, конкретизированные как овцы, и пасущийся крупный скот, не сливая их в одно общее понятие.
- source_word: ἐν ταῖς ῥάβδοις ταῖς ποικίλαις
  choice: с помощью пёстрых прутьев
  rationale: Сохраняет конкретный образ из рассказа Бытия о прутьях с разноцветным рисунком или полосами и выражает их инструментальную роль.
- source_word: ἔλαβε τὸ μέρος αὐτοῦ
  choice: получил свою долю
  rationale: Буквально и ясно передаёт получение Иаковом причитавшейся ему части стад.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной речи. Двоеточие сохраняет причинное пояснение. Формулировка не пытается дополнительно истолковать связь имени Завулона с образом дара. Предоставленный греческий фрагмент на уровне главы заканчивается в 1:2 и не содержит выровненного текста 1:3; поэтому формулировка стиха сверена с доступным содержанием греческой традиции данного места и с английским POB как консультационным слоем.
