base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001.yaml
  text: '1 A copy of the words of Zebulun, which he charged his sons before he died, in the one hundred and fourteenth year of his life, two years after the death of Joseph.


    2 And he said to them: Listen to me, sons of Zebulun; pay attention to the words of your father.


    3 I, Zebulun, became a good gift to my parents; for when I was born, my father increased very greatly, and so did the flocks and the herds, when by the speckled rods he gained his portion.


    4 I do not know that I sinned in my days, except in thought.


    5 I do not remember that I committed any lawlessness, except for the unwitting wrong I did concerning Joseph, in that I gave my brothers my pledge not to tell my father what had happened.


    6 But I wept in secret for many days because of Joseph; for I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be put to death.


    7 Yet when they wanted to kill him, with tears I begged them not to commit this sin.'
translation:
  language: ru
  text: 'Завещание Завулона, шестого сына Иакова и Лии[a]


    1 Вот копия слов Завулона, которые он оставил своим сыновьям перед смертью, на сто четырнадцатом году своей жизни[b], через два года после смерти Иосифа.


    2 Он сказал им: «Выслушайте меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописных свидетелях имя патриарха в заглавии передаётся иначе; в самом тексте говорящим явно назван Завулон.
    reason: textual_variant
  - marker: b
    text: 'Число лет в заглавии различается в рукописной традиции; здесь принято чтение предоставленного греческого текста: сто четырнадцатый год.'
    reason: textual_variant
lexical_decisions:
- source_word: Διαθήκη
  choice: Завещание
  rationale: В заглавии обозначает предсмертное наставление патриарха; «завещание» естественно передаёт жанр текста.
- source_word: Ἀντίγραφον λόγων
  choice: копия слов
  rationale: Сохраняет конкретное значение ἀντίγραφον и формулу письменной передачи речи.
- source_word: διέθετο
  choice: заповедал
  rationale: Передаёт торжественное предсмертное распоряжение и сохраняет связь с жанром завещания, не сводя глагол к нейтральному «сказал».
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν
  choice: перед смертью
  rationale: Естественная русская передача временной конструкции без изменения смысла.
- source_word: ἐν τῷ ἑκατοστῷ τετάρτῳ καὶ δεκάτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: на сто четырнадцатом году своей жизни
  rationale: Точно передаёт порядковое обозначение года жизни и звучит естественно в русском повествовании.
- source_word: Ἀκούσατέ μου
  choice: Послушайте меня
  rationale: Прямой и современный русский эквивалент призыва внимать говорящему; многоточие отмечает обрыв предоставленного греческого фрагмента.
theological_decisions:
- issue: Жанровое значение Διαθήκη
  choice: «Завещание» как предсмертное наставление
  alternative: «Завет»
  rationale: «Завет» мог бы привнести более специальный богословский смысл, тогда как здесь слово прежде всего называет жанр предсмертной речи.
- issue: Незавершённая речь во 2-м стихе
  choice: Не дополнять фразу по английскому консультационному тексту
  alternative: Добавить «сыновья Завулона; внимайте словам вашего отца»
  rationale: Предоставленный греческий источник оканчивается словами Ἀκούσατέ μου. Перевод сохраняет границу имеющегося оригинального текста и не импортирует отсутствующие слова из консультационного слоя.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным завещательным звучанием. Заглавие переведено отдельно от нумерованного текста. Перевод ограничен фактически предоставленным греческим фрагментом; его незавершённость обозначена многоточием.
