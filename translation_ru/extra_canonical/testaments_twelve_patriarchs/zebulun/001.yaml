  - severity: low
    issue: Многоточие в конце 2-го стиха
    rationale: Оно редакторски акцентирует обрыв, хотя имеющиеся слова образуют самостоятельную фразу. Границу предоставленного источника можно сохранить, просто не добавляя отсутствующее продолжение.
