  verdict: revise
  source_fidelity: 'Заглавие и хронология переданы верно: Διαθήκη уместно передано как «Завещание», а возраст — как «на сто четырнадцатом году жизни». Однако διέθετο в данном жанровом контексте точнее и естественнее передать как «оставил сыновьям», а не «заповедал»: речь идёт о предсмертно оставленных словах/наставлениях, не обязательно о заповеди. Во 2-м стихе греческий фрагмент действительно обрывается после Ἀκούσατέ μου; перевод не должен дополнять его по английскому тексту.'
  naturalness: '«Завещание Завулона» и основная синтаксическая структура звучат естественно в современном литературном русском. «Которые он оставил своим сыновьям» более идиоматично в сочетании со «словами», чем «которые он заповедал своим сыновьям». Многоточие после прямой речи не требуется: предоставленный текст заканчивается законченным призывом «Выслушайте меня».'
  terminology: Имена «Завулон», «Иаков», «Лия», «Иосиф» переданы последовательно и в обычной русской библейской форме. Выбор «завещание» не навязывает богословского значения «завет». Сноски a и b соответствуют указанному английскому аудиторскому следу и привязаны к надлежащим местам.
  issues:
  - severity: low
    issue: «заповедал своим сыновьям» для διέθετο
