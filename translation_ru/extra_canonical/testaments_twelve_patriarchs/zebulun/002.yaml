base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002.yaml
  text: '1 Sons of Zebulun[a], pay attention to the words of your father.

    2 I, Zebulun, became a good gift to my parents; for when I was born, my father prospered greatly, and the sheep and the cattle also, when with the variegated rods he had his share.

    3 And I do not know that I sinned in my days, except in intention.

    4 I do not remember that I committed lawlessness, except for the ignorance that I showed concerning Joseph, in that I gave my brothers my word not to tell my father what had happened.

    5 But I wept in secret for many days because of Joseph. For I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be put to death.

    6 Yet when they wanted to kill him, I pleaded with them with tears not to commit this sin[b].

    7 For Simeon and Dan and Gad came against Joseph to kill him, and he said to them with tears,

    8 “Have mercy on me, my brothers; pity the inward compassion of Jacob our father. Do not lay your hands on me to shed innocent blood, for I have not sinned against you.

    9 But even if I have sinned, discipline me with correction, my brothers; yet do not bring your hand to the murder of your brother, for the sake of Jacob your father.”

    10 And as he spoke these words in grief, while I could not bear his cries, I began to weep, and my liver was poured out, and all the substance of my inward parts grew faint.

    11 And I wept together with Joseph, and my heart thundered, and the joints of my body trembled[c][d], and I had no strength.'
translation:
  language: ru
  text: '1 Сыновья Завулона, внимайте словам вашего отца.


    2 Я, Завулон, стал добрым даром для своих родителей: когда я родился, благосостояние моего отца сильно возросло; умножились также овцы и крупный скот — в то время, когда его доля была связана с пёстрыми прутьями[a].


    3 Не знаю, чтобы во дни моей жизни я согрешил, разве что в помысле[b].


    4 Не помню, чтобы я совершил беззаконие, кроме проступка по неведению в отношении Иосифа: я дал братьям слово не рассказывать отцу о случившемся.


    5 Но из-за Иосифа я много дней тайно плакал. Я боялся своих братьев, потому что все они условились предать смерти того, кто раскроет тайну.


    6 И всё же, когда они хотели убить его, я со слезами умолял их не совершать этого греха.


    7 Ведь Симеон, Дан и Гад подошли к Иосифу, чтобы убить его, а он со слезами говорил им:


    8 «Смилуйтесь надо мной, братья мои! Сжальтесь над Иаковом, нашим отцом[d]. Не простирайте рук, чтобы пролить невинную кровь, ведь я не согрешил против вас.


    9 Но даже если я согрешил, вразумите меня наказанием, братья мои; только не заносите руки, чтобы убить своего брата, ради Иакова, вашего отца».


    10 Когда он с рыданиями говорил это, я не мог вынести его воплей и тоже заплакал. Печень моя излилась[c], и вся внутренняя сила моя иссякла.


    11 Я плакал вместе с Иосифом; сердце моё гудело, суставы тела дрожали, и я не мог стоять.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Пёстрые прутья напоминают о том, как Иаков разводил стада; см. Бытие 30.
    reason: cross_reference
  - marker: b
    text: Греческое выражение, переведённое как «разве что в помысле», трудно для истолкования; вероятно, оно указывает на внутренний помысел, в отличие от совершённого поступка.
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «печень моя излилась». Это яркий древний образ мучительной скорби.'
    reason: cultural_note
  - marker: d
    text: 'Буквально: «сжальтесь над внутренностями Иакова, нашего отца». В древней речи внутренние органы могли обозначать глубокую привязанность и сострадание.'
    reason: cultural_note
lexical_decisions:
- source_word: προσέχετε
  choice: внимайте
  rationale: Передаёт настойчивый призыв прислушаться к отцовскому наставлению; слово возвышенное, но понятное современному читателю.
- source_word: δόσις ἀγαθή
  choice: добрый дар
  rationale: Сохраняет конкретный образ дара и самоописание Завулона по отношению к родителям.
- source_word: ηὐξήνθη ... σφόδρα
  choice: благосостояние ... сильно возросло
  rationale: В контексте стад речь идёт о росте имущества Иакова, а не о его физическом росте.
- source_word: ποικίλαις ῥάβδοις
  choice: пёстрым прутьям
  rationale: Естественно передаёт внешний вид прутьев и сохраняет отсылку к рассказу Бытия 30.
- source_word: παρεκτὸς ἐννοίας
  choice: кроме греха в намерении
  rationale: Фраза трудна; перевод сохраняет различие между внутренним намерением и внешним поступком, не устраняя неясность текста.
- source_word: παρανομίαν
  choice: беззаконие
  rationale: Сохраняет нравственно-правовую силу греческого слова.
- source_word: ἄγνοιαν
  choice: проступка по неведению
  rationale: Передаёт признание вины, которую Завулон характеризует как совершённую по незнанию или непониманию, не превращая её в полную невиновность.
- source_word: ἐβεβαίωσα
  choice: дал братьям слово
  rationale: По контексту Завулон твёрдо присоединился к уговору молчать; русское выражение ясно передаёт взятое обязательство.
- source_word: μυστήριον
  choice: тайну
  rationale: Здесь имеется в виду скрываемое происшествие с Иосифом, а не богословское таинство.
- source_word: ἀναιρεθῆναι
  choice: предать смерти
  rationale: Ясно выражает угрозу смертной казни и сохраняет торжественно-серьёзный регистр.
- source_word: σπλάγχνα
  choice: утробу
  rationale: Сохраняет древний телесный образ глубокой родительской привязанности, а примечание поясняет его смысл.
- source_word: τὰ ἤπατά μου ἐξεχύθησαν
  choice: печень моя словно излилась
  rationale: Сохраняет яркий древний телесный образ скорби; «словно» делает метафорический характер выражения понятным по-русски.
- source_word: ἐβόμβει ἡ καρδία μου
  choice: сердце моё гудело
  rationale: Передаёт необычный образ сильного внутреннего гула или рокота, не заменяя его обычным «билось».
theological_decisions:
- issue: Заявление Завулона о своей невиновности при последующем признании вины в деле Иосифа
  choice: 'Сохранено напряжение: он не знает за собой греха, кроме греха в намерении, а затем называет поступок по неведению в отношении Иосифа.'
  alternative: 'Свести оба высказывания к простой формуле: он был безупречен, кроме случая с Иосифом.'
  rationale: Греческий текст даёт нравственно сложную самооценку; сглаживание устранило бы подлинное напряжение свидетельства.
- issue: Телесная образность сострадания и скорби
  choice: Сохранены «утроба», «печень», «внутренности» и телесная дрожь.
  alternative: Заменить их отвлечёнными формулами вроде «пожалейте отца» и «я глубоко скорбел».
  rationale: Такие образы существенны для эмоциональной риторики текста и отражают древнее представление о внутренних органах как средоточии чувств.
- issue: Невиновность Иосифа перед братьями
  choice: «я не согрешил против вас»
  alternative: «я не согрешил и попал к вам» либо более буквальная, но неясная конструкция.
  rationale: Синтаксис греческой фразы труден, однако контекст прямой мольбы и засвидетельствованное понимание поддерживают указание на отсутствие проступка против братьев; перевод не расширяет это до абсолютной безгрешности.
translation_notes:
  register: 'Современный литературный русский язык с достоинством завещательного наставления. Синтаксис сделан ясным для обычного читателя, но необычная телесная образность и нравственная неоднозначность оригинала сохранены. Имена переданы в принятой русской библейской форме: Завулон, Иосиф, Иаков, Симеон, Дан и Гад.'
