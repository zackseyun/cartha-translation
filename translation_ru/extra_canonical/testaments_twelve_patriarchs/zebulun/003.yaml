  text: '1[a]. And when they had done this, they all sat down to eat and drink. But I, seeing that Joseph was grieving, did not eat with them, but I kept watch over the pit, praying for help for him.


    2. And in the meantime Reuben arose and said, “Come, my brothers, let us not kill him, but let us throw him into one of these dry pits which our fathers dug and found no water.”


    3. For this reason the Lord prevented water from springing up in them, so that Joseph might be preserved[b].


    4. And they did so until they sold him to the Ishmaelites.


    5. As for his price, my children, I had no share in it. But Simeon and Dan and Gad, and their sons, took his price and bought sandals for themselves and for their wives and their children,


    6. saying, “We will not eat from it, because it is the price of our brother’s blood; rather, we will trample it underfoot, because he said that he would reign over us, and then we shall see what his dreams are.”


    7. Therefore it is written in the record of the law of Moses: “The man who does not wish to raise up seed for his brother—his sandal shall be removed, and they shall spit in his face.”


    8. And the brothers of Joseph were not willing to raise up the life of their brother, and the Lord removed from them the sandal which they wore against Joseph their brother.


    9. For when they came into Egypt, they had their sandals removed by the attendants of Joseph outside the gate, and so they bowed down to Joseph in the manner of those before King Pharaoh.


    10. And not only did they bow down to him, but immediately, as they fell before him, they were also spat upon[c], and they were put to shame by the Egyptians.'
translation:
  language: ru
  text: '1. Сделав это, все они сели есть и пить. Но я, видя скорбь Иосифа, не стал есть вместе с ними, а остался сторожить у ямы и молился, чтобы ему пришла помощь.


    2. Тем временем Рувим встал и сказал: «Братья мои, не будем убивать его. Лучше бросим его в одну из этих сухих ям, которые выкопали наши отцы, но воды не нашли».


    3. Ведь Господь потому и не дал воде забить в них, чтобы Иосиф был сохранён.


    4. Они так поступали, пока не продали его измаильтянам.


    5. Но в полученной за него плате, дети мои, я не участвовал. Симеон же, Дан и Гад со своими сыновьями взяли плату за него и купили сандалии себе, своим жёнам и детям.


    6. Они говорили: «Мы не будем тратить эту плату на пищу, потому что это цена крови нашего брата. Лучше потопчем её за то, что он сказал, будто будет царствовать над нами. Тогда и посмотрим, что станется с его снами».


    7. Поэтому в книге закона Моисея написано: «С того, кто не желает воздвигнуть потомство своему брату, пусть снимут сандалию и плюнут ему в лицо»[a].


    8. Братья Иосифа не пожелали воздвигнуть жизнь своего брата[b], и Господь снял с них сандалию, которую они носили, выступая против своего брата Иосифа.


    9. Ведь когда они пришли в Египет, слуги Иосифа сняли с них сандалии перед воротами, и тогда они поклонились Иосифу, как кланяются перед царём, фараоном.


    10. И они не только поклонились ему: когда они пали перед ним, на них тотчас же плюнули[c], и египтяне предали их позору.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ср. Второзаконие 25:5–10: отказ исполнить долг перед умершим братом влечёт публичное бесчестие — снятие сандалии и плевок в лицо.'
    reason: cross_reference
  - marker: b
    text: 'Греческое выражение необычно; буквально: «не пожелали воздвигнуть жизнь своего брата». По-видимому, здесь язык закона о продолжении рода брата переносится на поступок братьев с Иосифом как нравственная аналогия, а не как точное юридическое соответствие.'
    reason: lexical_alternative
  - marker: c
    text: Плевок можно понимать как символическое продолжение приведённого выше закона, однако греческое повествование говорит о нём прямо как о совершившемся действии.
    reason: alternative_reading
lexical_decisions:
- source_word: λάκκων / ξηρῶν λάκκων
  choice: ям / сухих ям
  rationale: «Яма» сохраняет широкий смысл λάκκος и естественно обозначает выкопанное углубление; определение «сухая» и последующее упоминание воды раскрывают назначение без чрезмерно узкого «цистерна».
- source_word: ἐκώλυσε ... τοῦ μὴ ἀναβλῦσαι ὕδωρ
  choice: не дал воде забить
  rationale: Передаёт Господа как действующего субъекта и образ воды, начинающей бить из земли, естественным современным русским языком.
- source_word: περιποίησις τῷ Ἰωσήφ
  choice: чтобы Иосиф остался жив
  rationale: В данном повествовательном контексте речь о сохранении Иосифа от смерти в яме; формулировка ясна и не привносит более широкого сотериологического смысла.
- source_word: τιμή / τιμὴ αἵματος
  choice: плата / цена крови
  rationale: Первое обозначает выручку от продажи Иосифа, а второе сохраняет нравственно насыщенное выражение греческого текста.
- source_word: ὑποδήματα
  choice: сандалии
  rationale: Соответствует древнему предмету обуви и сохраняет связь с юридическим образом снятия сандалии.
- source_word: καταπατήσωμεν
  choice: будем попирать их ногами
  rationale: Передаёт презрительное и одновременно буквальное действие, связанное с покупкой сандалий на полученные деньги.
- source_word: ἀναστῆσαι σπέρμα
  choice: воздвигнуть потомство
  rationale: Сохраняет библейско-юридический оборот и глагольную связь с необычным применением этой формулы к «жизни» в следующем стихе.
- source_word: ζωὴν ἀδελφοῦ αὐτῶν
  choice: воздвигнуть жизнь своего брата
  rationale: Намеренно сохраняет необычную формулировку греческого свидетеля, не исправляя её молча на «потомство» и не ослабляя авторскую нравственную аналогию.
- source_word: παῖδες Ἰωσήφ
  choice: слуги Иосифа
  rationale: В придворном контексте слово обозначает служащих при Иосифе; «слуги» естественно и не требует уточнения их правового положения.
- source_word: κατὰ τὸν τύπον βασιλέως Φαραώ
  choice: как кланяются царю-фараону
  rationale: Передаёт царский образ и церемониальный характер поклонения без утверждения, будто Иосиф сам был фараоном.
theological_decisions:
- issue: Провиденциальный смысл сухих ям
  choice: Господь намеренно не дал воде забить, чтобы Иосиф остался жив.
  alternative: Представить сухость ямы как случайное обстоятельство или безличное провидение.
  rationale: В греческом тексте Господь прямо назван субъектом действия, а сохранение Иосифа выражено как его цель.
- issue: Применение закона о левиратном браке к братьям Иосифа
  choice: Сохранить формулу закона и необычное выражение «воздвигнуть жизнь своего брата».
  alternative: Нормализовать оба места как «продолжить род брата» или заменить применение общей формулировкой о покушении на жизнь.
  rationale: Текст строит намеренную нравственную аналогию между отказом дать брату потомство и отказом сохранить жизнь Иосифа; его словесное и богословское напряжение не следует устранять.
- issue: Плевок перед Иосифом
  choice: Передать как прямо рассказанное событие.
  alternative: Представить исключительно как символическое толкование закона, а не событие повествования.
  rationale: Хотя эпизод явно продолжает образ из закона Моисея, греческий текст утверждает действие прямо.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Архаизмы сведены к тем оборотам, которые нужны для юридической цитаты и её словесной связи с последующим толкованием («воздвигнуть потомство / жизнь»). Необычные места греческого текста сохранены и пояснены, а не сглажены.
