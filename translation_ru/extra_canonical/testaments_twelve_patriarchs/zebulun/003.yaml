    rationale: Греческое αὐτήν относится к τιμή, «плате/цене». «Проедать» разговорно и сдвигает буквальное «не будем есть её»; местоимение множественного числа также ослабляет связь с «платой».
  - severity: low
    issue: 'Ст. 8: «сандалию, которую они носили против своего брата Иосифа»'
    rationale: Сочетание «носить против» не соответствует естественной русской сочетаемости. Следует передать образную направленность действия более понятно, не устраняя символический мотив сандалии.
