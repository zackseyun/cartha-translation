  naturalness: 'Регистр в основном удачен: современный литературный русский с уместным библейским оттенком. Небольшая правка улучшает синтаксис ст. 4, 6, 8 и 9 без сглаживания исходной риторической странности в ст. 8.'
  terminology: «Ямы», «сандалии», «цена крови», «воздвигнуть потомство» и «воздвигнуть жизнь» удачны. «Был сохранён» в ст. 3 точнее передаёт περιποίησις, чем более узкое «остался жив».
