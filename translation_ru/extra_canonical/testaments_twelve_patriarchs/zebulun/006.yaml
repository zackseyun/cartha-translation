base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/006.yaml
  text: First[a], then, I made a boat to sail on the sea, because the Lord gave me understanding and wisdom in it. And I fastened a piece of wood behind it[b], and
translation:
  language: ru
  text: 6:1 Итак, я первым построил судно, чтобы плавать по морю, потому что Господь дал мне в этом разумение и мудрость[a]. 2 Я прикрепил позади него кусок дерева, и…[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «мудрость» здесь может включать практическое умение и мастерство в строительстве, а не только отвлечённую мудрость.
    reason: lexical_alternative
  - marker: b
    text: 'Доступный греческий текст главы фрагментарен: он обрывается посреди предложения после слов «Я прикрепил позади него кусок дерева, и…».'
    reason: textual_variant
lexical_decisions:
- source_word: Πρῶτος ⌈οὖν⌉ ἐγώ
  choice: Итак, я первым
  rationale: Передаёт значение Πρῶτος как первенства Завулона в названном деле, а οὖν — естественной русской связкой «итак».
- source_word: ἐποίησα σκάφος
  choice: построил судно
  rationale: В контексте изготовления плавательного средства «построил» естественнее буквального «сделал»; «судно» сохраняет общий характер σκάφος и не уточняет размер или тип.
- source_word: ἐπιπλέειν ἐν τῇ θαλάσσῃ
  choice: чтобы плавать по морю
  rationale: Передаёт назначение построенного судна и не вводит более узкого указания на парусное плавание, отсутствующего в греческом тексте.
- source_word: σύνεσιν καὶ σοφίαν
  choice: разумение и мудрость
  rationale: Сохраняет парное сочетание умственного понимания и мудрости; контекст допускает также оттенок практического мастерства.
- source_word: ἐν αὐτῷ
  choice: в этом
  rationale: Русское «в этом» естественно отсылает к описанному делу, не делая сомнительное «в нём» прямой ссылкой исключительно на судно.
- source_word: καθῆκα ξύλον ὄπισθεν αὐτοῦ
  choice: Я прикрепил позади него кусок дерева
  rationale: «Прикрепил» соответствует строительному контексту, тогда как «кусок дерева» не навязывает не названную в сохранившемся тексте конкретную корабельную деталь.
- source_word: καί
  choice: и…
  rationale: Союз сохранён, а многоточие показывает, что доступный греческий отрывок обрывается сразу после него.
theological_decisions:
- issue: Божественный источник способности к строительству
  choice: Господь дал Завулону «разумение и мудрость» для описанного дела.
  alternative: σοφία в данном ремесленном контексте можно было бы передать более узко как «умение» или «мастерство».
  rationale: Прямое упоминание Господа и полный смысл пары σύνεσις—σοφία сохранены; примечание отмечает практический оттенок, не сводя богословски значимое слово только к техническому навыку.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной речи. Формулировки ясны неспециалисту; техническая деталь судна не конкретизирована из-за фрагментарности источника.
