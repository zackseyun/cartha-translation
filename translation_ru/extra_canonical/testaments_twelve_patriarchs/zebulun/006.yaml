  source_fidelity: 'Перевод точно передаёт сохранившийся греческий фрагмент: Πρῶτος οὖν ἐγώ — «Итак, я первым»; ἐποίησα σκάφος — «построил судно»; ἐπιπλέειν ἐν τῇ θαλάσσῃ — «чтобы плавать по морю». Пара σύνεσιν καὶ σοφίαν адекватно передана как «разумение и мудрость». «В этом» для ἐν αὐτῷ сохраняет возможную отсылку к описываемому делу, не притязая на чрезмерно точное разрешение референции местоимения. «Прикрепил позади него кусок дерева» обоснованно отражает строительный контекст καθῆκα ξύλον ὄπισθεν αὐτοῦ, не называя предполагаемую деталь судна. Оборванный союз καί сохранён.'
