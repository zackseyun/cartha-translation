  rationale: 'Исправления ограничены 4:9: восстановлено названное в источнике орудие («мечом»), устранено невыраженное дополнение «кровью» и уточнён глагол Ἐπίγνωθι. «Сострадая» точнее передаёт σπλαγχνιζόμενος. Остальной текст и все сноски сохранены, поскольку они соответствуют представленному греческому фрагменту и корректно отмечают варианты.'
