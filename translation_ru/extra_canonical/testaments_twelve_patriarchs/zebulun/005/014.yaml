source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: V. Καὶ νῦν¹, τέκνα μου, παραγγέλλω² ὑμῖν *τοῦ φυλάσσειν τὰς ἐντολὰς Κυρίου³, καὶ ποιεῖν⁴ ἔλεος ⌜πρὸς⌝⁵ τὸν⁶ πλησίον⁷, καὶ εὐσπλαγχνίαν *ἔχειν πρὸς πάντας⁸ οὐ μόνον *ἐν ἀνθρώποις⁹, ἀλλὰ *καὶ ἐν ἀλόγοις ζώοις¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/014.yaml
  text: And now, my children, I command you to keep the commandments of the Lord, and to show mercy to your neighbor, and to have compassion toward all, not only toward people but also toward unreasoning animals.
translation:
  language: ru
  text: И ныне, дети мои, я заповедую вам соблюдать заповеди Господа, проявлять милость к ближнему и сострадать всем — не только людям, но и неразумным животным.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγγέλλω
  choice: я заповедую
  rationale: Передаёт торжественное отцовское наставление и смысл властного предписания; в данном завещательном контексте естественнее и достойнее, чем разговорное «приказываю».
- source_word: φυλάσσειν τὰς ἐντολὰς Κυρίου
  choice: соблюдать заповеди Господа
  rationale: Устойчиво и точно передаёт идею хранения заповедей через верность и исполнение; синтаксис источника не связывает φυλάσσειν с «ближним».
- source_word: ποιεῖν ἔλεος πρὸς τὸν πλησίον
  choice: проявлять милость к ближнему
  rationale: Естественная современная передача буквального «делать милость по отношению к ближнему», сохраняющая этическое содержание выражения.
- source_word: εὐσπλαγχνίαν ἔχειν πρὸς πάντας
  choice: сострадать всем
  rationale: Кратко и естественно выражает «иметь сострадание ко всем», сохраняя всеобщий охват πάντας.
- source_word: ἄλογοις ζώοις
  choice: неразумным животным
  rationale: Передаёт отсутствие разумной речи или рассудка в ἄλογος без архаичного «бессловесным»; не подразумевает нравственного осуждения животных.
theological_decisions:
- issue: Объект глагола φυλάσσειν
  choice: «соблюдать заповеди Господа»
  alternative: «хранить/беречь ближнего»
  rationale: В греческом тексте прямым дополнением служит τὰς ἐντολὰς Κυρίου; τὸν πλησίον относится к следующему выражению ποιεῖν ἔλεος πρὸς. Поэтому исправление консультационного английского слоя, связывающее «keep» с neighbor, не поддерживается синтаксисом источника.
- issue: Объём сострадания
  choice: ко всем, включая людей и животных
  alternative: сострадание только ко всем людям, с отдельным добавлением о животных
  rationale: Конструкция πρὸς πάντας с последующим οὐ μόνον… ἀλλὰ καί раскрывает всеобщий охват и прямо включает в него как людей, так и животных.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. «И ныне» сохраняет торжественный переход источника; однородные инфинитивные предписания переданы ясным русским рядом. Смысловая структура греческого текста восстановлена независимо от противоречивой записи последней английской ревизии.
