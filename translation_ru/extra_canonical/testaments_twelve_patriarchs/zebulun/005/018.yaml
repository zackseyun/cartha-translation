  text: And when I was in the land of Canaan, by the seashore, I used to catch prey[c] for Jacob my father, and when many were being choked in the sea, I came through unharmed[d].
translation:
  language: ru
  text: И когда я был в земле Ханаанской, у морского берега, я ловил добычу[a] для Иакова, отца моего; и когда многие захлёбывались в море, я оставался невредимым[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по-гречески: «охотился за добычей». Однако упоминание морского берега позволяет понимать это как ловлю рыбы или иных морских животных для отца.'
    reason: lexical_alternative
  - marker: b
    text: По-видимому, предложение продолжается за пределами сохранившегося здесь отрывка; перевод оканчивается вместе с греческим текстом данного фрагмента.
    reason: textual_variant
lexical_decisions:
- source_word: ἐθήρευον θήραν
  choice: ловил добычу
  rationale: Сохраняет значение греческой этимологической конструкции «охотился за добычей / добывал добычу», но глагол «ловил» естественно согласуется с прибрежной обстановкой, не сводя неоднозначную θήρα исключительно к рыбе.
- source_word: πολλῶν ἀγχομένων ἐν τῇ θαλάσσῃ
  choice: когда многие захлёбывались в море
  rationale: ἀγχόμενοι буквально передаёт удушье; в морском контексте русское «захлёбывались» естественно обозначает гибель или опасность от воды, не добавляя прямо отсутствующего глагола «утонули».
- source_word: ἀβλαβὴς διέμενον
  choice: я оставался невредимым
  rationale: διέμενον означает продолжавшееся пребывание или сохранение состояния, а ἀβλαβής — отсутствие вреда; формулировка ближе к греческому, чем «я вышел невредимым».
- source_word: Ἰακὼβ τῷ πατρί μου
  choice: для Иакова, отца моего
  rationale: Передаёт дательный адресата/пользы и сохраняет явное именование отца в торжественном повествовательном регистре.
