  text: And Simeon took the tunic and did not want to give it up. For he wanted to cut him down with the sword, being angry because he had not killed him.
translation:
  language: ru
  text: А Симеон взял хитон и не хотел отдавать его, потому что хотел зарубить Иосифа мечом, разгневавшись из-за того, что не убил его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιτών
  choice: хитон
  rationale: Сохраняет конкретное название нижней одежды и узнаваемую связь с повествованием об Иосифе.
- source_word: δοῦναι αὐτόν
  choice: отдавать его
  rationale: Передаёт обычное значение «дать, отдать»; контекст подразумевает отказ передать хитон другим.
- source_word: τῇ ῥομφαίᾳ κατακόψαι αὐτόν
  choice: зарубить Иосифа мечом
  rationale: «Зарубить мечом» естественно передаёт сильный глагол κατακόπτω — рассечь или изрубить; имя проясняет мужской референт местоимения, отличая его от хитона.
- source_word: ἀνεῖλεν αὐτόν
  choice: не убил его
  rationale: Прямо передаёт ἀναιρέω в данном контексте; местоимение сохраняет связность с явно названным Иосифом.
