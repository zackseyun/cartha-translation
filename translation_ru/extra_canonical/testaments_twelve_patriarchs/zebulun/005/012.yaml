base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/012.yaml
  text: But we all rose up and said to him, “If you do not give the tunic, we will tell our father that you alone did this evil thing in Israel.”
translation:
  language: ru
  text: 'Но мы все встали и сказали ему: «Если не дашь хитон, мы скажем нашему отцу, что ты один совершил это злое дело в Израиле».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάντες
  choice: встали
  rationale: Прямо передаёт аористное причастие со значением вставания перед речью; по-русски естественно в последовательном повествовании.
- source_word: τὸν χιτῶνα
  choice: хитон
  rationale: Сохраняет конкретное название древней нижней одежды и связь с повествованием об одежде Иосифа.
- source_word: τὸ πονηρὸν τοῦτο
  choice: это злодеяние
  rationale: Субстантивированное πονηρόν обозначает дурной поступок; «злодеяние» передаёт его нравственную тяжесть без добавления конкретики.
- source_word: ἐν Ἰσραήλ
  choice: в Израиле
  rationale: 'Сохранена неоднозначность: выражение может относиться к народу/семье Израиля, а не обязательно к территории.'
theological_decisions:
- issue: Значение имени «Израиль»
  choice: в Израиле
  alternative: в доме Израиля
  rationale: Греческий текст не содержит слова «дом»; буквальная формулировка сохраняет возможную отсылку как к патриарху и его семье, так и к общности Израиля.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Синтаксис упрощён естественно для прямой речи, при этом сохранены все смысловые элементы греческого текста.
