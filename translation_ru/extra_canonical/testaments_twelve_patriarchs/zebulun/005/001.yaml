  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/001.yaml
  text: And they said to Jacob, “Recognize, then, whether this is your son’s tunic[a].” And they did so.
translation:
  language: ru
  text: 'И они сказали Иакову: «Распознай же: не хитон ли это твоего сына[a]?» И они так и сделали.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «одежда», «рубаха»; греческое χιτών обозначает предмет одежды, обычно тунику.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπίγνωθι
  choice: Распознай же
  rationale: Императив передаёт призыв внимательно опознать предмет; частица «же» естественно отражает усилительный оттенок контекста.
- source_word: χιτών
  choice: хитон
  rationale: «Хитон» точно обозначает нижнюю или основную одежду древнего мира и сохраняет исторический колорит; значение пояснено в сноске.
- source_word: ἐποίησαν οὕτως
  choice: они так и сделали
  rationale: Естественная русская передача буквального «сделали так», сохраняющая связь с описанным действием.
