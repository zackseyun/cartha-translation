  text: For they stripped Joseph of the tunic when they sold him, and clothed him in a servant’s garment.
translation:
  language: ru
  text: Ведь, продавая Иосифа, они сняли с него хитон и одели его в рабскую одежду.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιτών
  choice: хитон
  rationale: Передаёт конкретный предмет древней одежды и сохраняет связь с повествованием об Иосифе; слово известно современному русскому читателю по библейскому употреблению.
- source_word: ἐν τῷ πιπράσκειν αὐτόν
  choice: продавая Иосифа
  rationale: Греческая конструкция с субстантивированным инфинитивом обозначает обстоятельство времени; деепричастие естественно передаёт одновременность действий.
- source_word: ἱμάτιον δουλικόν
  choice: рабскую одежду
  rationale: δουλικόν прямо указывает на принадлежность или подобие рабу; «рабская» точнее, чем более широкое «слуги».
