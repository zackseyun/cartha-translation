  text: Have mercy, therefore, in your hearts[b], because whatever anyone does to his neighbor, so the Lord will do to him.
translation:
  language: ru
  text: Итак, имейте милосердие в сердцах ваших[a], ибо что бы ни сделал человек по отношению к своему ближнему, так и Господь поступит с ним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «имейте милосердие во внутренностях ваших». В греческой речи внутренние органы считались средоточием глубокого сострадания.'
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεος
  choice: милосердие
  rationale: Передаёт нравственное качество сострадания и милости естественным и достойным русским словом.
- source_word: ἐν σπλάγχνοις ὑμῶν
  choice: в глубине сердца
  rationale: Греческий образ буквально указывает на внутренности как средоточие сострадания; русская идиома сохраняет внутренний, глубинный характер чувства без анатомической неестественности.
- source_word: εἴ τι ἂν ποιήσῃ
  choice: как человек поступит
  rationale: По смыслу неопределённая конструкция относится к любому возможному поступку; «как… так и» естественно передаёт соразмерность ответа.
- source_word: τῷ πλησίον αὐτοῦ
  choice: со своим ближним
  rationale: «Ближний» сохраняет этическую и библейскую значимость πλησίον, а управление «поступить с» естественно для русского языка.
- source_word: μετʼ αὐτοῦ
  choice: с ним
  rationale: Сохраняет буквальную конструкцию «поступит с ним», не заменяя её более узким понятием воздаяния.
theological_decisions:
- issue: Характер соответствия между поступком человека и действием Господа
  choice: как человек поступит… так и Господь поступит с ним
  alternative: что бы человек ни сделал… то же Господь сделает ему
  rationale: Формулировка сохраняет нравственную взаимосвязь и возможную соразмерность, не утверждая непременно механически тождественного действия.
translation_notes:
  register: Современный литературный русский язык с библейски достойным звучанием. Повеление передано через «храните», чтобы естественно выразить устойчивое наличие милосердия внутри человека; архаичная анатомическая идиома разъяснена в сноске.
