base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/015.yaml
  text: For because of these things the Lord blessed me, and when all my brothers were ill, I passed through unharmed. For the Lord knows each person’s intention.
translation:
  language: ru
  text: Ибо за это Господь благословил меня, и, когда все мои братья болели, я прошёл через это, не заболев. Ибо Господь знает намерение каждого.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ γὰρ ταῦτα
  choice: Именно за это
  rationale: Передаёт причинное значение оборота естественно по-русски; частица γάρ связывает утверждение с предшествующим контекстом, а «именно» подчёркивает ταῦτα.
- source_word: ἀσθενούντων
  choice: болели
  rationale: Причастие обозначает состояние болезни или немощи; в данном противопоставлении здоровью естественнее конкретное «болели».
- source_word: ἄνοσος παρῆλθον
  choice: я остался здоров
  rationale: ἄνοσος буквально означает «не больной, свободный от болезни», а παρῆλθον здесь описывает прохождение периода общей болезни без заболевания; русский оборот передаёт смысл ясно и естественно.
- source_word: τὴν προαίρεσιν
  choice: намерение
  rationale: προαίρεσις может означать осознанный выбор, намерение или нравственную направленность воли; «намерение» сохраняет широту значения без излишней философской терминологии.
theological_decisions:
- issue: Связь благословения с предшествующим поведением говорящего
  choice: Сохранена прямая причинная формулировка «за это Господь благословил меня»
  alternative: «Поэтому Господь благословил меня»
  rationale: Греческое Διὰ ... ταῦτα прямо выражает основание благословения; перевод не ослабляет и не усиливает заявленную причинность.
- issue: Божественное знание внутренней нравственной установки человека
  choice: «Господь знает намерение каждого»
  alternative: «Господь знает выбор каждого»
  rationale: Сохранено утверждение текста без уточнения того, подразумевается ли единичный выбор, мотив или устойчивая направленность воли.
translation_notes:
  register: Современный литературный русский язык; краткий, достойный повествовательный стиль. Синтаксис сглажен без устранения причинной связи и смыслового противопоставления болезни братьев здоровью говорящего.
