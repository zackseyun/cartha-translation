source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 4. *Καὶ γὰρ²⁵ υἱοὶ²⁶ τῶν ἀδελφῶν μου ἠσθένουν καὶ²⁷ ἀπέθνησκον διὰ Ἰωσήφ²⁸, ⌈ὅτι οὐκ ἐποίησαν ἔλεος *ἐν σπλάγχνοις αὐτῶν²⁹⌉. οἱ δὲ *ἐμοὶ υἱοὶ³⁰ ἄνοσοι διεφυλάχθησαν³¹ καθὼς³² οἴδατε³³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/017.yaml
  text: For the sons of my brothers were sick and were dying because of Joseph, because they had not shown mercy in their inward parts; but my sons were kept free from sickness, as you know.
translation:
  language: ru
  text: Ведь сыновья моих братьев болели и умирали из-за Иосифа, потому что не проявили милосердия, идущего из глубины души; мои же сыновья были сохранены свободными от болезни, как вы знаете.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ Ἰωσήφ
  choice: из-за Иосифа
  rationale: Передаёт причинное значение διά с винительным, не уточняя сверх текста, каким именно образом отношение к Иосифу стало причиной болезни и смерти.
- source_word: ἐποίησαν ἔλεος
  choice: проявили милосердие
  rationale: Естественное современное соответствие греческой идиоме «сделали милость», сохраняющее нравственный смысл.
- source_word: ἐν σπλάγχνοις αὐτῶν
  choice: в глубине души
  rationale: σπλάγχνα буквально обозначает внутренности, но здесь метафорически указывает на глубочайший внутренний источник сострадания; русский оборот естественно передаёт этот образ без анатомической неясности.
- source_word: ἄνοσοι διεφυλάχθησαν
  choice: оставались невредимы от болезни
  rationale: Передаёт и состояние ἄνοσοι («не подверженные болезни»), и охранительно-сохранительное значение διεφυλάχθησαν.
theological_decisions:
- issue: Причинная связь между поступком против Иосифа и болезнью сыновей братьев
  choice: сохранена прямая формулировка «из-за Иосифа, потому что…»
  alternative: истолковать болезнь как явное Божье наказание
  rationale: Греческий текст устанавливает причинную связь, но прямо не называет действующего судью и не объясняет механизм воздаяния; перевод не должен добавлять это истолкование.
- issue: Внутренний характер отсутствия милосердия
  choice: «не проявили милосердия в глубине души»
  alternative: «в сердцах своих не имели милосердия»
  rationale: Выбранная формулировка сохраняет связь с глагольным выражением ἐποίησαν ἔλεος и подчёркивает внутреннее, искреннее сострадание, не заменяя образ словом «сердце», которого в источнике нет.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксическое противопоставление οἱ δὲ ἐμοὶ υἱοί передано конструкцией «мои же сыновья»; заключительное καθὼς οἴδατε сохранено как «как вы знаете».
