  verdict: revise
  source_fidelity: 'Смысл в целом передан верно: διά с винительным сохранено как причинное «из-за Иосифа», нравственная причина не истолкована как прямо названное Божье наказание, а противопоставление потомков и заключительное «как вы знаете» отражены. Однако «оставались невредимы от болезни» не вполне передаёт пассивное охранительное значение διεφυλάχθησαν и по-русски может ассоциироваться с физическими повреждениями, а не со здоровьем.'
