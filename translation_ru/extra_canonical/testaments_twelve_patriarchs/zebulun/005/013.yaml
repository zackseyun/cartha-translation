  text: И таким образом он отдал его им. И они сделали, как сказал Дан.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτόν
  choice: его
  rationale: Местоимение стоит в мужском роде и обозначает человека; перевод «его» сохраняет это указание исходного текста.
- source_word: δέδωκεν
  choice: отдал
  rationale: В данном повествовательном контексте естественное русское «отдал» точнее передаёт передачу человека другим лицам, чем нейтральное «дал».
- source_word: ἐποίησαν καθὼς εἶπεν
  choice: поступили, как сказал
  rationale: Передаёт смысл исполнения сказанного естественным современным русским языком, не добавляя того, чего нет в греческом тексте.
