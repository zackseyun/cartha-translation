base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/006/001.yaml
  text: First, then, I made a boat to sail on the sea, because the Lord gave me understanding and wisdom in it.
translation:
  language: ru
  text: Итак, я первым сделал судно, чтобы плавать по морю, потому что Господь дал мне для этого разумение и мудрость.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρῶτος ⌈οὖν⌉ ἐγώ
  choice: Итак, я первым
  rationale: Передаёт личное первенство говорящего («я первым»), а οὖν — естественной связкой «итак»; порядок слов адаптирован к современному русскому.
- source_word: σκάφος
  choice: судно
  rationale: Нейтральное обозначение плавательного средства; по достоинству регистра уместнее разговорного «лодка» и не уточняет конструкцию сверх греческого текста.
- source_word: ἐπιπλέειν ἐν τῇ θαλάσσῃ
  choice: способное плавать по морю
  rationale: Инфинитив выражает назначение или способность сделанного судна; перевод сохраняет естественный русский синтаксис.
- source_word: σύνεσιν καὶ σοφίαν
  choice: разумение и мудрость
  rationale: 'Сохраняет два близких, но не тождественных понятия: способность понимать и мудрость.'
- source_word: ἐν αὐτῷ
  choice: для этого
  rationale: Местоименная фраза может относиться к данному делу или занятию; «для этого» естественно передаёт инструментально-сферическое значение, не связывая дар с нахождением внутри судна.
theological_decisions:
- issue: Источник технического умения рассказчика
  choice: Господь дал мне разумение и мудрость
  alternative: я приобрёл разумение и мудрость
  rationale: Греческий текст прямо приписывает этот дар Господу; формулировка сохранена без дополнительного богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным регистром. Синтаксис сделан естественным, при этом сохранены заявление о первенстве и причинная связь с даром Господа.
