id: T12P.ZEB.10.2
reference: Testament of Zebulun 10:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: '(bdg-text expansion: καὶ ἴασις *καὶ εὐσπλαγχνία⁵⁷ ἐν⁵⁸ ταῖς πτέρυξιν αὐτοῦ. Αὐτὸς λυτρώσεται πᾶσαν αἰχμαλωσίαν υἱῶν ἀνθρώπων ἐκ τοῦ Βελίαρ καὶ πᾶν πνεῦμα πλάνης πατηθήσεται⁵⁹.)'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/002.yaml
  text: And healing and compassion will be in his wings. He himself will redeem every captivity of the sons of men from Beliar, and every spirit of deception will be trampled down.
translation:
  language: ru
  text: И исцеление, и сострадание будут в его крыльях. Он сам освободит сынов человеческих из всякого плена Велиара, и всякий дух заблуждения будет попран.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴασις
  choice: исцеление
  rationale: Прямо передаёт значение существительного и сохраняет образ исцеления в крыльях.
- source_word: εὐσπλαγχνία
  choice: милосердие
  rationale: Естественное и достойное русское соответствие глубокому состраданию и милости.
- source_word: ἐν ταῖς πτέρυξιν αὐτοῦ
  choice: в его крыльях
  rationale: Сохранён исходный метафорический образ без истолковывающего уточнения.
- source_word: λυτρώσεται
  choice: избавит
  rationale: Передаёт освобождение из плена; не вводит более узкое конфессиональное толкование термина.
- source_word: πᾶσαν αἰχμαλωσίαν υἱῶν ἀνθρώπων
  choice: всех пленённых сынов человеческих
  rationale: Греческое выражение буквально говорит о «всяком плене», но по смыслу обозначает людей, находящихся в плену; выбран естественный русский оборот, сохраняющий универсальность πᾶσαν.
- source_word: Βελίαρ
  choice: Велиара
  rationale: Сохранена форма имени, представленная в греческом тексте и традиционная для данного корпуса.
- source_word: πνεῦμα πλάνης
  choice: дух заблуждения
  rationale: πλάνη обозначает заблуждение, обман или уклонение; «заблуждение» сохраняет смысловой диапазон без сведения только к намеренному обману.
- source_word: πατηθήσεται
  choice: будет попран
  rationale: Сохраняет сильный образ буквального попрания и возвышенный пророческий регистр.
theological_decisions:
- issue: Объект избавления в выражении πᾶσαν αἰχμαλωσίαν υἱῶν ἀνθρώπων
  choice: всех пленённых сынов человеческих
  alternative: весь плен сынов человеческих
  rationale: Буквальная конструкция допускает отвлечённое «весь плен», однако в русском это неясно и может означать саму совокупность пленных. Выбран личный объект избавления без уточнения природы плена.
- issue: Субъект местоимений αὐτοῦ и αὐτός
  choice: его / Он сам
  alternative: уточнить титул или имя действующего лица
  rationale: Источник в данном стихе оставляет референта местоимений контексту; перевод не добавляет отсутствующего здесь имени или христологического титула.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Сохранены библейские образы «в его крыльях», «сыны человеческие» и «будет попран»; синтаксис сделан ясным для современного читателя.
