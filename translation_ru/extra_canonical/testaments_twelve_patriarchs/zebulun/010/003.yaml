id: T12P.ZEB.10.3
reference: Testament of Zebulun 10:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: '(bdg-text expansion: καὶ ἐπιστρέψει *πάντα τὰ⁶⁰ ἔθνη εἰς παραζήλωσιν αὐτοῦ⁶¹, καὶ ὄψεσθε *θεὸν ἐν σχήματι ἀνθρώπου⁶² *ὃν ἂν ἐκλέξηται Κύριος Ἱερουσαλὴμ ὄνομα αὐτῷ⁶³.)'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/003.yaml
  text: And he will turn all the nations to his jealousy, and you will see God in human form, whom the Lord will choose for him—Jerusalem is his name.
translation:
  language: ru
  text: И он обратит все народы к его ревности[a], и вы увидите Бога в человеческом облике — Того, кого изберёт Господь[b]; имя ему — Иерусалим[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое παραζήλωσις может означать также ревностное соперничество или побуждение к ревности. Местоимение «его» передаёт αὐτοῦ; его референт не вполне ясен.
    reason: Сохраняет семантическую и референциальную неоднозначность χωρίς навязывания конкретного лица.
  - marker: b
    text: 'В греческом: «кого изберёт Господь». Дополнение вроде «для себя» или «для него» в тексте не выражено.'
    reason: Предотвращает внесение подразумеваемого дополнения в перевод.
  - marker: c
    text: 'Греческий текст буквально: «Иерусалим — имя ему». Отнесение этого имени к предшествующему лицу синтаксически необычно и остаётся неясным.'
    reason: Отмечает трудность исходного чтения, не устраняя её толковательным переводом.
lexical_decisions:
- source_word: ἐπιστρέψει
  choice: обратит
  rationale: 'Передаёт каузативный смысл будущего времени: он побудит народы повернуться или обратиться.'
- source_word: εἰς παραζήλωσιν αὐτοῦ
  choice: возбудив в них ревность к Нему
  rationale: Сохраняет трудный образ ревности/соперничества в παραζήλωσις и неоднозначность местоимения αὐτοῦ, не сводя выражение просто к усердию.
- source_word: θεὸν ἐν σχήματι ἀνθρώπου
  choice: Бога в человеческом облике
  rationale: Естественно и достаточно формально передаёт Бога, явленного в виде или облике человека.
- source_word: ὃν ἂν ἐκλέξηται Κύριος
  choice: Того, кого Господь изберёт
  rationale: Сохраняет относительную конструкцию и потенциальный оттенок ἄν с сослагательным наклонением без излишнего уточнения личности избранного.
- source_word: Ἱερουσαλὴμ ὄνομα αὐτῷ
  choice: имя Ему — Иерусалим
  rationale: Сохраняет необычное именное утверждение греческого текста и его мужское местоименное отнесение.
theological_decisions:
- issue: Референт местоимения αὐτοῦ после παραζήλωσιν
  choice: к Нему, с прописной буквы по ближайшему богословскому контексту
  alternative: к нему / Его ревность
  rationale: Греческое местоимение допускает разные связи; примечание сохраняет неоднозначность, тогда как основной текст остаётся читаемым.
- issue: Дополнение при ἐκλέξηται
  choice: для Себя
  alternative: для него или без выраженного дополнения
  rationale: Греческий текст буквально не содержит отдельного дополнения «для Себя»; оно вводится как естественное русское раскрытие действия Господа, но отмечено как текстуально неоднозначное.
- issue: Связь имени Иерусалим с предшествующим лицом
  choice: сохранена прямая формулировка «имя Ему — Иерусалим»
  alternative: понять Иерусалим как место или как имя Господа
  rationale: Источник синтаксически труден; перевод не устраняет напряжение и не навязывает конфессиональную идентификацию.
translation_notes:
  register: Современный литературный русский с достоинством завещательного пророческого высказывания. Синтаксис сглажен лишь настолько, чтобы текст был понятен обычному читателю; необычные богословские и референциальные связи сохранены и отмечены в сносках.
