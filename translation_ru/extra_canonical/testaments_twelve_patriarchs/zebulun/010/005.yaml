  text: X. Καὶ νῦν τέκνα μου, μὴ λυπεῖσθε *ὅτι ἀποθνῄσκω¹, μηδὲ συμπέσητε² ὅτι ἀπολήγω³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/005.yaml
  text: And now, my children, do not be grieved that I am dying, nor fall down that I am coming to my end.
translation:
  language: ru
  text: А теперь, дети мои, не печальтесь о том, что я умираю, и не падайте духом оттого, что жизнь моя подходит к концу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυπεῖσθε
  choice: не печальтесь
  rationale: Передаёт повеление не предаваться скорби естественным и достойным современным русским языком.
- source_word: συμπέσητε
  choice: не падайте духом
  rationale: Глагол буквально связан с падением или крушением; русская идиома сохраняет образ падения и передаёт призыв не быть сломленными горем.
- source_word: ἀπολήγω
  choice: жизнь моя подходит к концу
  rationale: Передаёт значение прекращения, достижения конца; добавление «жизнь моя» делает подразумеваемый смысл естественным по-русски, не меняя содержания.
