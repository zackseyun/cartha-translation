  text: 4. *Ἐγὼ δὲ νῦν¹⁵ εἰς τὴν ἀνάπαυσίν μου¹⁶ ἀποτρέχω¹⁷, *ὡς καὶ¹⁸ οἱ πατέρες μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/008.yaml
  text: But as for me, now I hasten to my rest, as also my fathers did.
translation:
  language: ru
  text: А я теперь спешу к своему упокоению, как и мои отцы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: А я
  rationale: Передаёт контрастивное выделение местоимения и частицы δέ естественным современным русским оборотом.
- source_word: νῦν
  choice: теперь
  rationale: Прямо сохраняет временное значение наречия.
- source_word: εἰς τὴν ἀνάπαυσίν μου
  choice: к своему упокоению
  rationale: Сохраняет образ смерти как покоя и направление, выраженное εἰς; «упокоение» уместно в dignified завещательном контексте.
- source_word: ἀποτρέχω
  choice: спешу
  rationale: Передаёт идею быстрого устремления; буквальное «убегаю» здесь звучало бы неестественно и могло бы создать неверную коннотацию бегства.
- source_word: ὡς καὶ οἱ πατέρες μου
  choice: как и мои отцы
  rationale: Сохраняет сравнительную конструкцию и καί со значением «и/также»; подразумеваемый глагол в русском естественно опускается.
theological_decisions:
- issue: Образ смерти в выражении ἀνάπαυσις
  choice: упокоение
  alternative: покой
  rationale: «Упокоение» сохраняет метафору смерти как вхождения в покой, не уточняя посмертное состояние и не снимая присущую выражению богословскую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной речи. Формулировка краткая и ясная; архаизмов и конфессионально маркированных добавлений нет.
