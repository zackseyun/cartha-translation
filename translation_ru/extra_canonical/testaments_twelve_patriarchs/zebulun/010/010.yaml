  text: 6. Καὶ ταῦτα εἰπὼν ἐκοιμήθη [†ὕπνῳ²⁴ καλῷ], καὶ ἔθηκαν αὐτὸν *οἱ υἱοὶ αὐτοῦ²⁵ *εἰς θήκην ξυλίνην²⁶. 7. Ὕστερον δὲ *ἀναγαγόντες ἔθαψαν αὐτὸν ἐν Χεβρών²⁷ μετὰ τῶν πατέρων αὐτοῦ²⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/010.yaml
  text: And when he had said these things, he fell asleep, and his sons placed him in a wooden coffin. Later they carried him up and buried him in Hebron with his fathers.
translation:
  language: ru
  text: И, сказав это, он уснул, и сыновья положили его в деревянный гроб. Позднее они перенесли его и похоронили в Хевроне вместе с его отцами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκοιμήθη
  choice: уснул
  rationale: Сохраняет греческий эвфемизм смерти, не устраняя его образность прямым «умер».
- source_word: θήκην ξυλίνην
  choice: деревянный гроб
  rationale: Естественное современное соответствие погребальному вместилищу; определение «деревянный» передано явно.
- source_word: ἀναγαγόντες
  choice: перенесли
  rationale: В контексте останков передаёт перемещение к месту погребения; буквальное направление «подняв/отнеся вверх» по-русски здесь звучало бы неясно и могло бы ошибочно подразумевать эксгумацию.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: вместе с его отцами
  rationale: Сохраняет буквальный родовой язык источника и возможный смысл погребения рядом с предками.
theological_decisions:
- issue: Сон как обозначение смерти
  choice: уснул
  alternative: умер
  rationale: Источник использует ἐκοιμήθη; образ сохранён без догматического истолкования.
- issue: Значение «с его отцами»
  choice: вместе с его отцами
  alternative: рядом с его предками
  rationale: Более формальная передача сохраняет формулу источника и её смысловую ёмкость.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного завещательного текста; синтаксис упрощён умеренно, без добавлений и конфессионально окрашенных формулировок.
