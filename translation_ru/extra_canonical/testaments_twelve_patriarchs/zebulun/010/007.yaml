  verdict: revise
  source_fidelity: 'Основная передача точна: «нечестивые», «наведёт», «вечный огонь» и «погубит» адекватно соответствуют ἀσεβεῖς, ἐπάξει, πῦρ αἰώνιον и ἀπολεῖ. Однако «на веки веков» заменяет необычное греческое ἕως γενεὰς γενεῶν («до/вплоть до поколений поколений») традиционной формулой с иной образностью и более категоричным значением бесконечной длительности. Английский audit trail также сохраняет именно «generations of generations».'
  naturalness: «А на нечестивых Господь наведёт вечный огонь» звучит естественно в современном литературном русском с умеренно библейским регистром. Буквальное «до поколений поколений» намеренно необычно, но понятно и необходимо для сохранения своеобразной, потенциально спорной формулы оригинала; сноска поясняет его.
  terminology: «Господь», «нечестивые», «вечный огонь» и «погубит» терминологически уместны. Не следует переводить ἕως γενεὰς γενεῶν как «во веки веков», поскольку это не греческое αἰῶνας τῶν αἰώνων и такой выбор сглаживает различие формулировок.
