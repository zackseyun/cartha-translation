  text: But upon the ungodly the Lord will bring eternal fire, and he will destroy them for generations of generations.
translation:
  language: ru
  text: А на нечестивых Господь наведёт вечный огонь и погубит их до поколений поколений¹⁴.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσεβεῖς
  choice: нечестивых
  rationale: Передаёт религиозно-нравственный смысл греческого слова и соответствует достоинству контекста.
- source_word: ἐπάξει
  choice: наведёт
  rationale: 'Сохраняет значение будущего действия: Господь обрушит или наведёт огонь на нечестивых.'
- source_word: πῦρ αἰώνιον
  choice: вечный огонь
  rationale: Прямой и естественный эквивалент устойчивого греческого сочетания без дополнительного истолкования.
- source_word: ἀπολεῖ
  choice: погубит
  rationale: Передаёт сильное значение уничтожения или гибели, не уточняя способ сверх сказанного в тексте.
- source_word: ἕως γενεὰς γενεῶν
  choice: на веки веков
  rationale: Естественная для русского библейского регистра формула длительности; греческое выражение буквально связано с последовательностью поколений, но здесь имеет усилительный временной смысл.
theological_decisions:
- issue: Соотношение «вечного огня» и длительности погибели
  choice: Сохранены оба утверждения без попытки согласовать или систематизировать их.
  alternative: Истолковать выражение как указание на определённую доктрину окончательной участи нечестивых.
  rationale: Исходный текст утверждает вечность огня и погибель «до поколений поколений»; перевод не должен добавлять конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским, торжественным регистром. Союз «А» естественно передаёт контраст δέ; порядок фразы сделан плавным для русского чтения.
