source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 9. Καὶ⁶⁴ πάλιν ⌈ἐν *τῇ πανουργίᾳ⁶⁵ *τῶν ἔργων⁶⁶ ὑμῶν⁶⁷⌉ παροργίσετε⁶⁸ αὐτόν, καὶ ἀπορριφήσεσθε⁶⁹ ⌈ἀπ᾽ αὐτοῦ⌉⁷⁰ ἕως καιροῦ συντελείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/004.yaml
  text: And again, in the craftiness of your works you will provoke him, and you will be cast away from him until the time of completion.
translation:
  language: ru
  text: И снова коварством своих дел вы прогневаете Его и будете отвергнуты Им до времени завершения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ πανουργίᾳ τῶν ἔργων ὑμῶν
  choice: коварством своих дел
  rationale: Инструментальное «коварством» естественно по-русски передаёт обстоятельственный смысл ἐν, а «дел» сохраняет широкое значение ἔργων.
- source_word: παροργίσετε
  choice: прогневаете
  rationale: Глагол означает вызвать гнев; краткая переходная форма сохраняет прямое дополнение αὐτόν и достоинство пророческой речи.
- source_word: ἀπορριφήσεσθε ἀπ᾽ αὐτοῦ
  choice: будете отвергнуты Им
  rationale: Передаёт пассивную форму и удаление от названного лица без неестественного русского «отброшены от Него».
- source_word: ἕως καιροῦ συντελείας
  choice: до времени завершения
  rationale: 'Сохраняет неопределённость συντέλεια: контекст не требует уточнять, идёт ли речь о завершении срока, эпохи или всего установленного периода.'
theological_decisions:
- issue: К кому относится αὐτόν / αὐτοῦ
  choice: Его / Им с прописной буквы
  alternative: его / им со строчной буквы
  rationale: Ближайший широкий контекст завещания указывает на Бога; прописная буква соответствует русской библейской издательской традиции, не добавляя имени в основной текст.
- issue: Значение συντέλεια
  choice: завершение
  alternative: конец
  rationale: «Завершение» сохраняет формальную и эсхатологическую открытость греческого слова и не усиливает его до однозначного «конца мира».
translation_notes:
  register: Современный литературный русский язык с кратким пророческим ритмом. Синтаксис естественный, но сохраняет последовательность двух будущих событий и богословскую неоднозначность заключительной фразы.
