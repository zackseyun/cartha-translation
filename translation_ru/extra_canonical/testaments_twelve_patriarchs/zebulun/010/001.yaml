source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: καὶ ἐπιστρέψετε⁵² *εἰς τὴν γῆν⁵³ ὑμῶν⁵⁴, καὶ ὄψεσθε αὐτὸν⁵⁵ ἐν Ἱερουσαλὴμ ⌈διὰ τὸ ὄνομα αὐτοῦ *τὸ ἅγιον⁵⁶⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/001.yaml
  text: And you will return to your land, and you will see him in Jerusalem because of his holy name.
translation:
  language: ru
  text: И вы вернётесь в свою землю и увидите его в Иерусалиме по причине его святого имени.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψετε
  choice: вернётесь
  rationale: Будущее время передано естественным русским глаголом возвращения; контекст указывает на возвращение в свою землю.
- source_word: εἰς τὴν γῆν ὑμῶν
  choice: в свою землю
  rationale: Возвратное местоимение «свою» естественно соотносит землю с подлежащим «вы» и точно передаёт ὑμῶν.
- source_word: ὄψεσθε αὐτόν
  choice: увидите его
  rationale: Сохраняется прямое значение глагола зрения и неопределённость референта мужского местоимения.
- source_word: διὰ τὸ ὄνομα αὐτοῦ τὸ ἅγιον
  choice: ради его святого имени
  rationale: «Ради» передаёт причинно-мотивирующий оттенок διά с винительным и звучит естественно в возвышенном повествовательном регистре.
theological_decisions:
- issue: Референт местоимения αὐτόν
  choice: его
  alternative: Его
  rationale: Строчная буква сохраняет формальную неоднозначность греческого текста и не навязывает отождествление референта.
- issue: Значение διά в выражении об имени
  choice: ради его святого имени
  alternative: из-за его святого имени / благодаря его святому имени
  rationale: «Ради» не уточняет сверх текста, является ли святое имя причиной, основанием или целью происходящего, и сохраняет богословское напряжение выражения.
translation_notes:
  register: Современный литературный русский язык с кратким, достоинственным библейским звучанием. Синтаксис близок к греческому, но естественен по-русски; подлинная неоднозначность местоимения сохранена.
