revisions:
- from: И вы вернётесь в свою землю и увидите его в Иерусалиме ради его святого имени.
  to: И вы вернётесь в свою землю и увидите его в Иерусалиме по причине его святого имени.
  rationale: Заменено только «ради» на «по причине», чтобы восстановить причинное значение διά с винительным. Все прочие формулировки, включая неоднозначное «его», сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T22:32:31Z'
review_pass:
  verdict: revise
  source_fidelity: Греческие ἐπιστρέψετε εἰς τὴν γῆν ὑμῶν и ὄψεσθε αὐτὸν точно переданы как «вернётесь в свою землю» и «увидите его»; строчное «его» обоснованно сохраняет неопределённость референта. Однако διά с винительным в данном контексте выражает основание/причину («because of» в английском аудиторском переводе), а «ради» преимущественно вносит целевой смысл «для/во имя».
  naturalness: Текст краток, грамматически безупречен и соответствует современному литературному русскому. «По причине его святого имени» несколько книжнее, но уместно в возвышенном переводе и нейтрально передаёт причинную связь без нежелательной отрицательной окраски «из-за».
  terminology: '«Иерусалим», «земля», «святое имя» переданы последовательно и естественно. Не следует писать «Его»: капитализация преждевременно отождествила бы неуточнённого референта с божественным лицом.'
  issues:
  - severity: medium
    issue: «Ради его святого имени» меняет значение διά с винительным.
    rationale: «Ради» обычно обозначает цель или действие в чьих-либо интересах; исходный текст и английский audit trail указывают на причинно-оснóвное значение. Нейтральное «по причине» сохраняет это значение, не решая, является ли имя причиной, основанием либо мотивом в более широком контексте.
  revised_text: И вы вернётесь в свою землю и увидите его в Иерусалиме по причине его святого имени.
  revised_footnotes: []
