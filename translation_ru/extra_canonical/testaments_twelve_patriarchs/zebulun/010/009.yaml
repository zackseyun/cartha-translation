  text: But you, fear the Lord our God with all your strength all the days of your life.
translation:
  language: ru
  text: Вы же бойтесь Господа, Бога нашего, всей своей силой во все дни своей жизни.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «Бога нашего, всей своей силой во все дни своей жизни» в используемом греческом издании заключены в квадратные скобки, что отмечает текстуальную неопределённость.
    reason: Передаёт редакционное обозначение в исходном издании, не уточняя характер неопределённости без критического аппарата.
lexical_decisions:
- source_word: φοβεῖσθε
  choice: бойтесь
  rationale: В контексте наставления форма передана как повеление; «бояться Господа» сохраняет библейское понятие благоговейного страха, не сводя его только к почтению.
- source_word: Κύριον
  choice: Господа
  rationale: Обычный и точный русский эквивалент для Κύριος в религиозном контексте.
- source_word: τὸν θεὸν ἡμῶν
  choice: нашего Бога
  rationale: Сохраняет явно выраженное местоимение «нашего» и естественно звучит в современном литературном русском.
- source_word: ἐν πάσῃ ἰσχύι ὑμῶν
  choice: всей своей силой
  rationale: Передаёт единственное число ἰσχύι и соотносит притяжательное местоимение с подлежащим; формулировка понятна современному читателю.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς ὑμῶν
  choice: во все дни своей жизни
  rationale: Близко передаёт греческую временную формулу и сохраняет её торжественный библейский оттенок.
theological_decisions:
- issue: Значение «страха Господня»
  choice: Сохранено прямое «бойтесь Господа»
  alternative: «почитайте Господа» или «благоговейте перед Господом»
  rationale: Греческое φοβεῖσθε допускает религиозный смысл благоговейного страха, но более узкие варианты заранее снимают присущую выражению смысловую напряжённость.
- issue: Текстуальная неопределённость расширенной фразы
  choice: Полная фраза оставлена в основном тексте и отмечена сноской
  alternative: Оставить только «Вы же бойтесь Господа»
  rationale: Предоставленный текст издания заключает продолжение стиха в редакционные квадратные скобки; его следует перевести, одновременно открыто обозначив текстуальную неопределённость.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Порядок слов сделан естественным для русского языка; архаизмы вроде «крепостью вашею» не использованы.
