base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/006.yaml
  text: For I will rise again in your midst, as a leader in the midst of the sons of righteousness; and I will rejoice in the midst of my tribe, those who keep the law of the Lord and the commandments of Zebulun their father.
translation:
  language: ru
  text: Ибо я снова восстану среди вас — как предводитель среди сынов праведности — и буду радоваться среди моего племени — тех, кто будет соблюдать закон Господа и заповеди Завулона, их отца.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «и заповеди Завулона, их отца» в греческом издании заключены в квадратные скобки, что указывает на сомнительность их текстуального статуса.
    reason: Необходимо отразить редакционную помету источника, не удаляя засвидетельствованную фразу из основного текста.
lexical_decisions:
- source_word: Ἀναστήσομαι
  choice: я снова восстану
  rationale: Глагол ἀνίστημι допускает смысл «встать/подняться» и в данном посмертном контексте — «воскреснуть». Формулировка «снова восстану» сохраняет образ и его эсхатологическую многозначность, не устраняя её в пользу одного толкования.
- source_word: ἡγούμενος
  choice: предводитель
  rationale: Передаёт значение руководящего лица естественным современным русским словом, не придавая ему специального церковного смысла.
- source_word: υἱῶν δικαιοσύνης
  choice: сынов праведности
  rationale: Сохранён семитизированный образ оригинала, обозначающий людей, принадлежащих праведности или характеризуемых ею.
- source_word: φυλῆς
  choice: племени
  rationale: В контексте двенадцати патриархов означает родоплеменную общность Завулона; «племя» здесь точнее общего слова «род».
- source_word: φυλάξουσιν
  choice: соблюдает
  rationale: Настоящее время в русском придаточном естественно характеризует названную группу, тогда как греческая форма будущего времени согласуется с пророческой перспективой всего высказывания.
theological_decisions:
- issue: Значение Ἀναστήσομαι в посмертной и эсхатологической перспективе
  choice: «снова восстану»
  alternative: «снова воскресну»
  rationale: Выбранный вариант не отрицает воскресения, но сохраняет лексическую широту греческого глагола и не делает подразумеваемое толкование более однозначным, чем источник.
- issue: Текстуальный статус заключительных слов о заповедях Завулона
  choice: сохранить в основном тексте с примечанием
  alternative: опустить как вторичное добавление
  rationale: Фраза присутствует в предоставленном греческом тексте, хотя редакционные квадратные скобки указывают на сомнительность её текстуального статуса; поэтому она переведена, а неопределённость отмечена сноской.
translation_notes:
  register: Современный литературный русский с достоинством завещательно-пророческой речи. Повтор «среди» намеренно сохранён вслед за трёхкратным ἐν μέσῳ, но третье вхождение оформлено естественно для русского синтаксиса. Термин «сыны праведности» сохранён как значимый древний образ.
