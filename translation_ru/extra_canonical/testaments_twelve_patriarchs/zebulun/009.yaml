  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009.yaml
  text: 1 Therefore pay attention to the waters[a], and understand that when they move to one place, they carry down stones, wood, earth, and various other things. 2 But if they are divided into many streams, the ground swallows them up, and they become easy to despise. 3 So also you, if you are divided, will become like this. 4 Therefore do not be split under two heads, for everything that the Lord made has one head, and two shoulders, two hands, two feet, and all the other members. 5 For I have learned from the writings of my fathers that you will be divided in Israel, and you will follow two kingdoms, and you will do every abomination. 6 And your enemies will take you captive, and you will be afflicted among the nations with many weaknesses and distresses. 7 And after these things, when you remember the Lord, you will return, and he will have mercy on you, because he is merciful and compassionate, and he does not reckon wickedness against the sons of men, because they are flesh and go
    astray in their evil deeds. 8 And after these things the Lord himself will rise for you[c][b], the light of righteousness.
translation:
  language: ru
  text: '1 Итак, обратите внимание на воды и поймите: когда они текут в одно и то же место, то увлекают за собой камни, древесину, землю и многое другое. 2 Но если они разделяются на множество потоков, земля поглощает их, и ими становится легко пренебречь. 3 Так будет и с вами, если вы разделитесь. 4 Поэтому не раскалывайтесь, имея две головы, ведь всё, что создал Господь, имеет одну голову, два плеча, две руки, две ноги и все прочие члены. 5 Ибо из писаний моих отцов я узнал, что вы разделитесь в Израиле, пойдёте за двумя царствами и совершите всякую мерзость. 6 Ваши враги возьмут вас в плен, и среди народов вы будете страдать, терпя многие немощи и скорби. 7 После этого, вспомнив Господа, вы вернётесь[a], и Он помилует вас, потому что Он милостив и сострадателен и не вменяет зла сынам человеческим, ибо они — плоть и заблуждаются в своих злых делах[b]. 8 После этого для вас взойдёт[c] Сам Господь — свет праведности.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых рукописях: «вы вспомните Господа и покаетесь, и Он возвратит вас» — вместо: «вспомнив Господа, вы вернётесь».'
    reason: textual_variant
  - marker: b
    text: 'В некоторых рукописях эта причина изложена подробнее: «ибо они — плоть, и духи заблуждения вводят их в заблуждение во всех их делах».'
    reason: textual_variant
  - marker: c
    text: 'Или: «воссияет для вас»; Господь представлен как восходящий свет.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἐπὶ τὰ ὕδατα
  choice: обратите внимание на воды
  rationale: Передаёт прямой призыв наблюдать за водами естественным современным русским языком.
- source_word: πορεύονται ἐπὶ τὸ αὐτό
  choice: текут в одно и то же место
  rationale: Сохраняет движение вод к одному месту, не усиливая образ до явно выраженного слияния потоков.
- source_word: κατασύρουσιν
  choice: увлекают за собой
  rationale: Передаёт действие сильного течения естественнее, чем буквальное «стаскивают вниз», не преувеличивая его разрушительность.
- source_word: ἀφανίζει
  choice: поглотит
  rationale: Конкретно изображает, как земля впитывает разделившиеся потоки и они исчезают.
- source_word: εὐκαταφρόνητα
  choice: ими станет легко пренебречь
  rationale: Сохраняет смысл утраты значимости вследствие разделения без неестественного выражения «легко презираемыми».
- source_word: χωρισθῆτε ἐν δυσὶ κεφαλαῖς
  choice: не раскалывайтесь под властью двух глав
  rationale: Глагол «раскалываться» отличает χωρίζω от повторяющегося διαιρέω, а «главы» сохраняют телесно-политическую метафору; слова «под властью» делают её понятной по-русски.
- source_word: γραφῇ τῶν πατέρων μου
  choice: из писаний моих отцов
  rationale: Не приписывает этим текстам канонического статуса, но сохраняет их письменный и авторитетный характер.
- source_word: βδέλυγμα
  choice: мерзость
  rationale: Передаёт сильную нравственную и культовую отрицательную оценку привычным русским библейским словом.
- source_word: οὐ λογίζεται κακίαν
  choice: не вменяет зла
  rationale: Сохраняет образ учёта или причисления вины и не превращает выражение в утверждение, будто Бог вовсе не замечает зла.
- source_word: ἀνατελεῖ
  choice: взойдёт
  rationale: Сохраняет образ появления Господа как восходящего света и оставляет открытым возвышенный богословский смысл метафоры.
theological_decisions:
- issue: Текстовый вариант в последовательности воспоминания, покаяния и возвращения в стихе 7
  choice: «вспомнив Господа, вы вернётесь, и Он помилует вас»
  alternative: «вы вспомните Господа и покаетесь, и Он возвратит вас»
  rationale: Основной текст следует представленному греческому чтению, а вариант отмечен, поскольку он меняет субъект возвращения и оттенок покаяния.
- issue: Причина человеческого заблуждения в стихе 7
  choice: «они — плоть и заблуждаются в своих злых делах»
  alternative: «они — плоть, и духи заблуждения вводят их в заблуждение во всех их делах»
  rationale: Краткое чтение соответствует основному представленному тексту; расширенное чтение сохранено в примечании без внесения дополнительной демонологии в основной текст.
- issue: Образ «света праведности» в стихе 8
  choice: 'Сохранить приложение к Самому Господу: «Сам Господь — свет праведности»'
  alternative: Истолковать выражение исключительно как мессианский титул либо только как общую метафору восстановления
  rationale: Греческий текст связывает восходящего Господа со светом праведности, но не требует в переводе выбирать одно позднейшее догматическое толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Образы вод, тела, плена, плоти и восходящего света сохранены; синтаксис сделан ясным для обычного современного читателя. Прописные местоимения при упоминании Господа использованы последовательно в рамках принятого русского религиозно-литературного регистра.
