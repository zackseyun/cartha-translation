base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008.yaml
  text: 'And so, my children, have compassion toward every person with mercy, so that the Lord also, having had compassion on you, may show you mercy. For indeed in the last days God will send his compassion upon the earth, and wherever he finds merciful compassion, there he dwells. For as much as a man has compassion on his neighbor, so much also the Lord has compassion on him.


    And when we went down into Egypt, Joseph did not hold a grudge against us. Giving heed to him, then, you also, my children, love one another, and let each one not reckon evil against his brother. For this divides unity, and scatters every kinship, and troubles the soul, and disfigures the face.'
translation:
  language: ru
  text: '8 Итак, дети мои, будьте милосердны ко всякому человеку, чтобы и Господь, сжалившись над вами, помиловал вас. 2 Ведь в последние дни Бог пошлёт Своё сострадание на землю, и где найдёт милосердное сердце[a], там и поселится. 3 Ибо насколько человек сострадает своему ближнему, настолько и Господь сострадает ему.


    4 Когда же мы сошли в Египет, Иосиф не держал на нас зла. 5 Берите пример с него и вы, дети мои: любите друг друга, и пусть никто не питает злых мыслей против своего брата. 6 Ибо зло разрушает единство, разрывает всякие родственные узы, тревожит душу и искажает лицо.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «внутренности милости» — семитизированный образ глубокого, сердечного сострадания.'
    reason: Поясняет необычный исходный образ, который в основном тексте передан естественным русским выражением.
lexical_decisions:
- source_word: εὐσπλαγχνίαν ... ἐν ἐλέει
  choice: будьте милосердны
  rationale: Естественно передаёт сочетание сострадания и деятельной милости без тяжеловесного русского повтора.
- source_word: τὰ σπλάγχνα αὐτοῦ
  choice: Своё сострадание
  rationale: Греческая телесная метафора означает глубокое сердечное сострадание; буквальное «внутренности» по-русски здесь вводило бы в заблуждение.
- source_word: σπλάγχνα ἐλέους
  choice: милосердное сердце
  rationale: Сохраняет образ внутреннего источника милости в естественной русской форме; буквальное «внутренности милости» неприемлемо.
- source_word: οὐκ ἐμνησικάκησεν ἡμῖν
  choice: не держал на нас зла
  rationale: Точно и современно передаёт отсутствие злопамятства и обиды.
- source_word: προσέχοντες ... εἰς ὃν
  choice: берите пример с него
  rationale: По смыслу призывает внимательно смотреть на Иосифа как на образец поведения.
- source_word: μὴ λογίζεσθε ... κακίαν
  choice: пусть никто не замышляет зла
  rationale: Передаёт внутреннее обдумывание или вынашивание зла; русский оборот понятен и нравственно конкретен.
- source_word: τὸ πρόσωπον ἀφανίζει
  choice: искажает лицо
  rationale: Сохраняет зримое воздействие внутреннего зла на внешний облик; греческий глагол допускает значение порчи или обезображивания.
theological_decisions:
- issue: Взаимосвязь человеческого сострадания и сострадания Господа
  choice: Сохранена пропорциональная формулировка «насколько… настолько»
  alternative: Ослабить её до общего утверждения, что Господь милует сострадательных
  rationale: Греческий текст намеренно устанавливает напряжённое соответствие ὅσον… τοσοῦτον; перевод не должен заранее разрешать вопрос о заслуге и благодати.
- issue: Пребывание Бога там, где найдено милосердие
  choice: «там и поселится»
  alternative: «в том человеке обитает»
  rationale: Местоимение ἐν αὐτῷ может относиться к месту или человеку; ближайшее ὅπου поддерживает пространственную формулировку, которая сохраняет часть неоднозначности.
- issue: Подлежащее в стихе 6
  choice: Явно названо «зло»
  alternative: «это»
  rationale: Указательное τοῦτο отсылает к замышлению зла в предыдущей фразе; экспликация делает русский текст связным, не добавляя новой доктрины.
translation_notes:
  register: Современный литературный русский, ясный и достойный. Обращение «дети мои» и параллелизм наставления сохранены; архаизмы и конфессионально маркированная лексика не использованы.
