  naturalness: Русский текст современный, литературный и хорошо читается. Замена в 8:5 на «не питает злых мыслей» естественно передаёт внутренний характер греческого выражения и избегает впечатления о непременно заранее продуманном злодеянии.
  terminology: «Милосердны», «сострадание», «помиловал», «Господь» и «Бог» соответствуют греческому тексту и не вносят конфессионально ограниченного толкования. «Там и поселится» сохраняет пространственно-личную неопределённость ὅπου ... ἐν αὐτῷ настолько, насколько это возможно по-русски.
  issues:
