  text: 8. Καὶ μετὰ ταῦτα⁴⁵ ἀνατελεῖ⁴⁶ ⌜ὑμῖν⌝ *αὐτὸς ὁ⁴⁷ Κύριος, *φῶς δικαιοσύνης⁴⁸,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/008.yaml
  text: And after these things the Lord himself will rise for you, the light of righteousness.
translation:
  language: ru
  text: И после этого сам Господь взойдёт для вас¹ — свет праведности.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: после этого
  rationale: Естественно передаёт указание на последующие события без излишне буквального «после этих вещей».
- source_word: ἀνατελεῖ
  choice: взойдёт
  rationale: Сохраняет образ восходящего светила, поддержанный последующим выражением «свет праведности»; не сужает смысл до простого «явится».
- source_word: ὑμῖν
  choice: для вас
  rationale: Передаёт дательный падеж адресата или благоприятной направленности; греческое чтение текстуально отмечено как не вполне уверенное.
- source_word: αὐτὸς ὁ Κύριος
  choice: сам Господь
  rationale: Сохраняет эмфатическое αὐτός и естественный русский порядок слов.
- source_word: φῶς δικαιοσύνης
  choice: свет праведности
  rationale: Формально и ясно сохраняет родительную конструкцию и её возможную образно-богословскую многозначность.
theological_decisions:
- issue: Соотношение Господа и «света праведности»
  choice: Оформить «свет праведности» как приложение после тире
  alternative: «сам Господь, свет праведности, взойдёт для вас»
  rationale: Тире естественно показывает, что выражение характеризует Господа, не добавляя отсутствующей в греческом связки и не разрешая образ сверх исходного текста.
translation_notes:
  register: Современный литературный русский язык; краткая, возвышенная и понятная формулировка. Образ восхода сохранён как существенная часть греческой метафоры.
