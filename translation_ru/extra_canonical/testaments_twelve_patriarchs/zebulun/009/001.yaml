  text: Therefore pay attention to the waters, and understand that when they flow together to the same place, they carry down stones, wood, earth, and various other things.
translation:
  language: ru
  text: 'Итак, обратите внимание на воды и поймите: когда они стекаются в одно место, то увлекают за собой камни, древесину, землю и прочее.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέχετε
  choice: обратите внимание
  rationale: Естественно передаёт призыв внимательно наблюдать за водами; в данном контексте точнее, чем предостерегающее «берегитесь».
- source_word: πορεύονται ἐπὶ τὸ αὐτό
  choice: стекаются в одно место
  rationale: Для вод передаёт движение и схождение к одной точке, сохраняя контекстуальный смысл греческого выражения.
- source_word: κατασύρουσιν
  choice: увлекают за собой
  rationale: Передаёт энергичное движение вниз или по течению вместе с водой и звучит естественно по-русски.
- source_word: λίθους, ξύλα, γῆν
  choice: камни, древесину, землю
  rationale: Сохраняет конкретное перечисление; собирательное «древесину» уместно рядом с переносимыми водой веществами и предметами.
- source_word: ἕτερά τινα
  choice: прочее
  rationale: Кратко и естественно передаёт неопределённое «некоторые другие [вещи]», не добавляя отсутствующей в тексте классификации.
