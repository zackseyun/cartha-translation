  text: Therefore do not be divided into two heads, for everything that the Lord made has one head, and two shoulders, two hands, two feet, and all the other members.
translation:
  language: ru
  text: Итак, не разделяйтесь на две головы, потому что у всего, что создал Господь, одна голова, два плеча, две руки, две ноги и все прочие члены тела.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χωρισθῆτε ἐν δυσὶ κεφαλαῖς
  choice: не разделяйтесь на две головы
  rationale: Сохраняет необычный телесный образ греческого текста и его связь с последующим перечислением частей тела, не заменяя его толкованием о вождях или партиях.
- source_word: πᾶν ὃ ἐποίησεν ὁ Κύριος
  choice: у всего, что создал Господь
  rationale: Естественно передаёт греческую обобщающую конструкцию и позволяет ясно выразить принадлежность перечисленных частей.
- source_word: τὰ λοιπὰ μέλη ἅπαντα
  choice: все прочие члены тела
  rationale: «Члены тела» в современном русском ясно обозначают части тела; добавление «тела» раскрывает подразумеваемый контекст, не меняя смысла.
theological_decisions:
- issue: Значение образа двух голов
  choice: Сохранить буквальный образ без уточнения, обозначают ли головы руководителей, партии или внутреннее разделение.
  alternative: 'Передать толковательно: «не разделяйтесь на два лагеря» или «не подчиняйтесь двум главам».'
  rationale: Греческий текст сам не объясняет образ, а последующее описание тела поддерживает его буквальную метафорическую форму; конкретизация сняла бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством наставительного изречения. Намеренно сохранена несколько необычная формула «разделяйтесь на две головы», поскольку её образность является существенной частью аргумента оригинала.
