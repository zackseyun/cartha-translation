lexical_decisions:
- source_word: Καὶ ὑμεῖς
  choice: И вы также
  rationale: Прямо передаёт соединительное καί и усиленное местоимение ὑμεῖς; оборот естественен для современного русского языка.
- source_word: ἐὰν διαιρεθῆτε
  choice: если разделитесь
  rationale: Условная конструкция с аористом пассивного διαιρέω выражает возможное разделение; русская возвратная форма сохраняет естественность и не уточняет насильственно, будет ли разделение внутренним или произведённым извне.
- source_word: ἔσεσθε οὕτως
  choice: будете такими
  rationale: ἔσεσθε — будущее от «быть», поэтому перевод не добавляет значения становления; «такими» естественно отсылает к ранее описанному состоянию или примеру.
