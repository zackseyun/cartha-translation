  text: And your enemies will take you captive, and you will be afflicted among the nations with many weaknesses and distresses.
translation:
  language: ru
  text: И враги ваши уведут вас в плен, и среди народов вы будете терпеть многие немощи и скорби.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰχμαλωτεύσουσιν ὑμᾶς
  choice: уведут вас в плен
  rationale: Передаёт будущее активного глагола и естественно звучит по-русски, сохраняя образ пленения.
- source_word: κακωθήσεσθε
  choice: будете терпеть бедствия
  rationale: Греческая пассивная форма обозначает причинение зла, мучение или бедственное положение; такая передача сохраняет широту смысла без излишнего уточнения.
- source_word: ἐν ἔθνεσιν
  choice: среди народов
  rationale: Естественный современный эквивалент, указывающий на пребывание в среде иных народов.
- source_word: ἐν πολλαῖς ἀσθενείαις καὶ θλίψεσιν
  choice: многие немощи и скорби
  rationale: «Немощи» сохраняют широкий смысл ἀσθένειαις — слабости, недуги, бессилие; «скорби» передают θλίψεσιν как страдания и притеснения.
