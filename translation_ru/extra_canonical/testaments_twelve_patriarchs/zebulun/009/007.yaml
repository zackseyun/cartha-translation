source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 7. Καὶ μετὰ ταῦτα μνησθέντες Κύριον †ἐπιστρέψετε³³ καὶ ἐλεήσει³⁴ ὑμᾶς, ὅτι ἐλεήμων ἐστὶ καὶ εὔσπλαγχνος, *καὶ οὐ λογίζεται³⁵ κακίαν τοῖς υἱοῖς τῶν ἀνθρώπων διότι σάρξ εἰσιν καὶ πλανῶνται ἐν ταῖς πονηραῖς αὐτῶν πράξεσιν³⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/007.yaml
  text: And after these things, when you remember the Lord, you will return, and he will have mercy on you, because he is merciful and compassionate, and he does not reckon wickedness against the sons of men, because they are flesh and go astray in their evil deeds.
translation:
  language: ru
  text: И после этого, вспомнив Господа, вы обратитесь[a], и Он помилует вас, потому что Он милостив и сострадателен и не вменяет зла сынам человеческим, поскольку они — плоть и сбиваются с пути в своих злых поступках.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое чтение «обратитесь» отмечено в издании как текстологически не вполне уверенное.
    reason: Перед ἐπιστρέψετε в предоставленном греческом тексте стоит критический знак †; примечание сообщает о неуверенности, не выдумывая отсутствующий вариант чтения.
lexical_decisions:
- source_word: μνησθέντες Κύριον
  choice: вспомнив Господа
  rationale: Деепричастная конструкция естественно передаёт аористное причастие и сохраняет смысловую последовательность греческого текста.
- source_word: ἐπιστρέψετε
  choice: вы обратитесь
  rationale: Передаёт будущее время и идею возвращения или обращения, не уточняя, идёт ли речь прежде всего о покаянии либо о возвращении к Господу.
- source_word: ἐλεήσει ὑμᾶς
  choice: Он помилует вас
  rationale: Обычное и точное соответствие глаголу ἐλεέω в религиозном контексте.
- source_word: ἐλεήμων … καὶ εὔσπλαγχνος
  choice: милостив и сострадателен
  rationale: 'Сохраняет два близких, но не тождественных качества: милость и глубокое сострадание.'
- source_word: οὐ λογίζεται κακίαν τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: не вменяет зла сынам человеческим
  rationale: «Вменяет» точно передаёт λογίζεται в значении принятия чего-либо в расчёт или постановки в вину; дательный объект сохранён без добавления предлога «против».
- source_word: σάρξ εἰσιν
  choice: они — плоть
  rationale: Сохранён конкретный библейский образ «плоти», а не заменён толкованием вроде «слабы» или «смертны».
- source_word: πλανῶνται ἐν ταῖς πονηραῖς αὐτῶν πράξεσιν
  choice: сбиваются с пути в своих злых поступках
  rationale: Передаёт образ отклонения или блуждания в πλανῶνται и сохраняет связь с дурными делами, не определяя точнее причинное или обстоятельственное отношение.
theological_decisions:
- issue: Смысл обращения после воспоминания о Господе
  choice: «вы обратитесь»
  alternative: «вы вернётесь»
  rationale: «Обратитесь» сохраняет возможный духовно-нравственный оттенок ἐπιστρέφω, однако не добавляет прямого указания «к Господу», которого в данной фразе нет.
- issue: Причина невменения зла
  choice: «поскольку они — плоть»
  alternative: «поскольку они немощны»
  rationale: Сохранена богословски значимая и потенциально напряжённая формулировка оригинала без сведения «плоти» к одному истолкованию.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Формулы «помилует», «не вменяет зла», «сынам человеческим» и «они — плоть» сохранены ради точности и межтекстовых связей; синтаксис при этом остаётся понятным современному читателю.
