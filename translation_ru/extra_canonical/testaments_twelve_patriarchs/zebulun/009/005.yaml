base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/005.yaml
  text: For I have learned from the writings of my fathers that you will be divided in Israel, and you will follow after two kingdoms, and you will commit every abomination.
translation:
  language: ru
  text: Ибо из писания моих отцов я узнал, что вы будете разделены в Израиле, последуете за двумя царствами и совершите всякую мерзость.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔγνων
  choice: я узнал
  rationale: Аорист γινώσκω передаёт приобретённое знание; «узнал» естественно и точно в данном контексте.
- source_word: ἐν γραφῇ τῶν πατέρων μου
  choice: из писаний моих отцов
  rationale: Предлог ἐν здесь указывает на письменный источник знания. Единственное γραφῇ может быть собирательным; русское множественное «писаний» соответствует смыслу и консультационному слою.
- source_word: Διαιρεθήσεσθε ἐν Ἰσραήλ
  choice: вы разделитесь в Израиле
  rationale: Сохранены пассивно-возвратный смысл будущего времени и несколько неоднозначная связь оборота «в Израиле».
- source_word: ἐξακολουθήσετε
  choice: последуете за
  rationale: Глагол означает следование за кем-либо или чем-либо, в том числе приверженность; выбранное выражение естественно по-русски и не уточняет мотив следования.
- source_word: πᾶν βδέλυγμα ποιήσετε
  choice: совершите всякую мерзость
  rationale: «Совершить мерзость» — современное литературное и достаточно формальное соответствие сочетанию ποιεῖν с βδέλυγμα.
theological_decisions:
- issue: Характер следования двум царствам
  choice: последуете за двумя царствами
  alternative: будете держаться двух царств
  rationale: Сохранена направленность ἐξακολουθέω без добавления конфессионального или политического толкования.
- issue: Объём выражения πᾶν βδέλυγμα
  choice: всякую мерзость
  alternative: все мерзости
  rationale: Единственное число с πᾶν сохранено как обобщающее «всякую», не ограничивая выражение конкретным видом культового или нравственного проступка.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис близок к греческому, но остаётся естественным для обычного читателя; подлинная неоднозначность оборота «в Израиле» не устранена.
