review_pass:
  verdict: revise
  source_fidelity: Требуется уточнение двух мест. Греч. γραφῇ стоит в единственном числе, поэтому «из писаний» необоснованно меняет число. Διαιρεθήσεσθε — форма будущего страдательного залога; «разделитесь» в русском обычно подразумевает действие самих субъектов, тогда как «будете разделены» сохраняет залог оригинала. Остальные соответствия передают текст точно, включая неуточнённое «в Израиле» и направленное ἐξακολουθήσετε.
  naturalness: Исправленный текст остаётся современным литературным русским с уместно сдержанным библейским регистром. «Писание моих отцов» несколько торжественно, но естественно в контексте древнего завещательного текста и позволяет сохранить единственное число оригинала.
  terminology: «Отцов» сохраняет традиционное значение предков; «царствами» точно передаёт βασιλείαις. «Совершите всякую мерзость» адекватно передаёт ποιήσετε πᾶν βδέλυγμα и не сужает смысл до одного вида проступка.
  issues:
  - severity: medium
    issue: Изменено число у γραφῇ.
    rationale: В исходном греческом γραφῇ — единственное число; следует перевести «из писания», а не «из писаний».
  - severity: medium
    issue: Будущий пассив Διαιρεθήσεσθε передан возвратной формой.
    rationale: «Разделитесь» может означать, что адресаты сами разделятся; «будете разделены» точнее сохраняет страдательный залог и не добавляет агента.
  revised_text: Ибо из писания моих отцов я узнал, что вы будете разделены в Израиле, последуете за двумя царствами и совершите всякую мерзость.
