  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/002.yaml
  text: But if they are divided into many parts, the earth destroys them, and they become easy to despise.
translation:
  language: ru
  text: Но если они будут разделены на множество частей, земля уничтожит их, и ими станут легко пренебрегать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς πολλὰ διαιρεθῶσιν
  choice: разделятся на множество частей
  rationale: Передаёт буквальный смысл деления на многое, не вводя отсутствующий в греческом тексте образ потоков.
- source_word: ἡ γῆ
  choice: земля
  rationale: Прямое и естественное соответствие греческому существительному; в данном контексте возможно понимание земли или почвы, но текст не уточняет.
- source_word: ἀφανίζει
  choice: уничтожит
  rationale: Сохраняет сильное значение устранения или истребления, не добавляя образа поглощения.
- source_word: γίνονται εὐκαταφρόνητα
  choice: ими станет легко пренебрегать
  rationale: Естественно передаёт значение «становятся легко презираемыми / такими, которыми легко пренебречь», сохраняя результативный оттенок γίνονται.
