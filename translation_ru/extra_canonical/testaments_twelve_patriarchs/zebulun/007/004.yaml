  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/004.yaml
  text: And from my catch, showing compassion, I shared with every stranger.
translation:
  language: ru
  text: И из своей добычи я, сострадая, делился со всяким чужеземцем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θήρας
  choice: добычи
  rationale: Передаёт результат охоты или промысла без неоправданного уточнения его вида.
- source_word: παντὶ ἀνθρώπῳ ξένῳ
  choice: со всяким чужеземцем
  rationale: Сохраняет всеобщность παντί и значение ξένος как человека, не принадлежащего к своей среде; по-русски выражено естественно и кратко.
- source_word: σπλαγχνιζόμενος
  choice: сострадая
  rationale: Причастный оборот передаёт внутреннее сострадание как побуждение к действию.
- source_word: μετεδίδουν
  choice: делился
  rationale: Имперфект передан глаголом несовершенного вида, допускающим повторяющееся или обычное действие; значение — уделять другому часть своего.
