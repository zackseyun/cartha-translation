  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/006.yaml
  text: For this reason the Lord also filled me with many fish in the catch of fish. For the one who shares with his neighbor receives many times more from the Lord.
translation:
  language: ru
  text: Поэтому и Господь дал мне богатый улов во время рыбной ловли. Ведь тот, кто делится с ближним, получает от Господа во много раз больше.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ ἄγρᾳ τῶν ἰχθύων
  choice: мой улов
  rationale: ἄγρα обозначает ловлю или улов; по-русски «наполнил мой улов множеством рыбы» естественно передаёт образ, не добавляя отсутствующей в греческом тексте сети.
- source_word: ὁ μεταδιδοὺς
  choice: тот, кто делится
  rationale: Причастие μεταδιδούς выражает передачу или уделение другому; современное «делится» ясно и сохраняет обобщённый характер изречения.
- source_word: τῷ πλησίον
  choice: с ближним
  rationale: «Ближний» — точный и привычный библейский эквивалент πλησίον, здесь без неоправданного сужения до друга или родственника.
- source_word: πολλαπλασίονα
  choice: во много раз больше
  rationale: Передаёт сравнительное значение «многократно больше», сохраняя количественную усиленность исходного выражения.
theological_decisions:
- issue: Характер связи между щедростью и воздаянием Господа
  choice: 'Сохранено прямое обобщённое утверждение: делящийся получает от Господа во много раз больше.'
  alternative: Смягчить до вероятности или ограничить воздаяние духовными благами.
  rationale: Греческий текст формулирует утверждение прямо и не уточняет ни вид получаемого, ни механизм воздаяния; перевод не должен добавлять такие ограничения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис упрощён для ясности, а буквальная, но неестественная конструкция «наполнил меня многими рыбами при ловле рыб» передана идиоматически без введения образа сети, которого нет в источнике.
