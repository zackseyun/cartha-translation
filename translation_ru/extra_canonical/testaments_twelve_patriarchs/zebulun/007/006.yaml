revisions:
- from: Поэтому и Господь наполнил мой улов множеством рыбы. Ведь тот, кто делится с ближним, получает от Господа во много раз больше.
  to: Поэтому и Господь дал мне богатый улов во время рыбной ловли. Ведь тот, кто делится с ближним, получает от Господа во много раз больше.
  rationale: 'Первая фраза переработана, чтобы не превращать улов в объект глагола «наполнил» и при этом естественно передать образ обильной рыбной ловли. Вторая фраза оставлена по существу без изменений: она верно сохраняет прямую связь между щедростью к ближнему и многократным получением от Господа. В предоставленном русском черновике отсутствуют сноски; надстрочные номера 25–28 в критическом исходном тексте не сопровождаются их содержанием, поэтому новые сноски и маркеры не создаются.'
