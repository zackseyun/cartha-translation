source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 4. *Εἰ δὲ ἦν ξένος, ἢ νοσῶν, ἢ²¹ γηράσας, ἐψήσας²² τοὺς ἰχθύας, καὶ *ποιήσας αὐτὰ ἀγαθῶς²³ κατὰ τὴν ἑκάστου χρείαν προσέφερον πᾶσι, συναλγῶν²⁴ καὶ συμπάσχων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/005.yaml
  text: If anyone was a foreigner, or sick, or aged, after boiling the fish and preparing them well, I would offer them to each according to need, suffering with them and feeling their pain.
translation:
  language: ru
  text: Если же кто-нибудь был чужеземцем, болен или стар, то, сварив рыбу и хорошо приготовив её, я подавал её всем по нужде каждого, разделяя их боль и сострадая им.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ξένος
  choice: чужеземец
  rationale: Передаёт человека, пришедшего из чужой земли; в данном контексте это естественнее и точнее, чем многозначное «чужой».
- source_word: ἐψήσας
  choice: варил
  rationale: Глагол в данном контексте обозначает приготовление рыбы варкой; деепричастная форма по-русски утяжелила бы длинную фразу.
- source_word: ποιήσας αὐτὰ ἀγαθῶς
  choice: готовил её как следует
  rationale: Естественно передаёт буквальное «сделав их хорошо» применительно к приготовлению рыбы, не добавляя конкретного способа обработки.
- source_word: κατὰ τὴν ἑκάστου χρείαν
  choice: сообразно нужде каждого
  rationale: Сохраняет индивидуальный характер помощи и смысл соответствия потребности каждого человека.
- source_word: συναλγῶν καὶ συμπάσχων
  choice: сострадая им и разделяя их страдания
  rationale: 'Сохраняет два близких, но не полностью тождественных выражения: внутреннее сочувствие боли и участие в страдании.'
theological_decisions:
- issue: К кому относится условное перечисление ξένος, νοσῶν, γηράσας
  choice: «Если же кто-нибудь был…»
  alternative: «Если же он был…»
  rationale: В греческой фразе субъект подразумевается. Неопределённое «кто-нибудь» естественно выражает общий характер милосердного отношения и согласуется с последующим «каждого».
- issue: Связь κατὰ τὴν ἑκάστου χρείαν
  choice: с приготовлением рыбы
  alternative: с предложением или раздачей рыбы
  rationale: Положение оборота непосредственно после ποιήσας αὐτὰ ἀγαθῶς поддерживает связь с приготовлением, хотя по смыслу он может распространяться и на всю помощь. Пунктуация не делает эту связь чрезмерно жёсткой.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Длинная греческая цепочка причастий преобразована в ряд личных глаголов для ясности; первое лицо единственного числа восстановлено по форме προσέφερον и ближайшему контексту. «Рыба» употреблена как собирательное существительное.
