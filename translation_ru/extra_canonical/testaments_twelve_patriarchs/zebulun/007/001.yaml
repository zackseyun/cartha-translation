  text: Я натянул полотно на другом вертикальном брусе посередине.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀθόνην
  choice: полотно
  rationale: Передаёт ткань или полотнище без излишнего уточнения её назначения.
- source_word: ἐξέτεινα
  choice: натянул
  rationale: В данном предметном контексте естественно выражает расправление и закрепление полотна.
- source_word: ἐν ἑτέρῳ ξύλῳ ὀρθῷ
  choice: на другом вертикальном брусе
  rationale: ξύλον здесь обозначает деревянную опору; «брус» звучит естественнее буквального «дерево», а ὀρθῷ передано как «вертикальном».
- source_word: ἐν μέσῳ
  choice: посередине
  rationale: Сохраняет пространственную неопределённость греческого выражения, не уточняя, посреди чего находилась опора.
