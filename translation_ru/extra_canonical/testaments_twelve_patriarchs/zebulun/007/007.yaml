  text: 6. *Πέντε οὖν ἔτη²⁹ ἡλίευσα³⁰, [παντὶ ἀνθρώπῳ *ὃν ἑωράκειν³¹ μεταδιδούς, καὶ παντὶ τῷ οἴκῳ τοῦ πατρός μου ἐξαρκῶν].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/007.yaml
  text: For five years, then, I fished, sharing with everyone I had seen, and providing for all my father’s house.
translation:
  language: ru
  text: Итак, пять лет я ловил рыбу, уделяя каждому человеку, которого я видел, и обеспечивая весь дом моего отца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡλίευσα
  choice: я рыбачил
  rationale: Прямо передаёт аорист глагола «ловить рыбу, рыбачить»; обстоятельство «пять лет» естественно задаёт длительность занятия.
- source_word: παντὶ ἀνθρώπῳ ὃν ἑωράκειν
  choice: со всяким, кого встречал
  rationale: Буквально конструкция означает «каждому человеку, которого я видел»; по-русски «кого встречал» естественно выражает раздачу всем попадавшимся ему людям, не ограничивая смысл знакомыми.
- source_word: μεταδιδούς
  choice: делясь
  rationale: Причастие означает «уделяя, давая долю, делясь»; сохраняется подразумеваемый объект — улов или добытое рыбной ловлей.
- source_word: ἐξαρκῶν
  choice: обеспечивая
  rationale: Передаёт значение «быть достаточным для, снабжать всем необходимым, содержать» и хорошо сочетается с домом как семьёй/хозяйством.
- source_word: παντὶ τῷ οἴκῳ τοῦ πατρός μου
  choice: весь дом моего отца
  rationale: Сохраняет библейское выражение «дом» в значении семьи и хозяйства; παντί передано как «весь».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно библейской интонацией. Синтаксический параллелизм двух греческих причастных оборотов сохранён деепричастиями; квадратные скобки из критического представления источника не перенесены в основной текст, поскольку без предоставленного пояснения они отражают редакционную разметку, а не содержание стиха.
