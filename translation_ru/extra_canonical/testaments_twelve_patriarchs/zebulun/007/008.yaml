review_pass:
  verdict: revise
  source_fidelity: «Нуждающемуся» точно передаёт τῷ χρήζοντι, а «сострадайте ему» — συμπάσχετε αὐτῷ. Оборот ἐν σπλάγχνοις ἐλέους образно обозначает глубокое, внутреннее милосердное сострадание. Вариант «всем своим милосердным сердцем» передаёт общий смысл, но добавляет не выраженное в оригинале «своим» и несколько неестественно воспроизводит образ.
  naturalness: Фраза в целом ясна и соответствует наставительному регистру, однако сочетание «всем своим милосердным сердцем» тяжеловесно для современного литературного русского. «От всего сердца» — естественный русский эквивалент внутренней глубины чувства.
  terminology: Терминологически «нуждающийся» и «сострадайте» удачны. В исправлении «милосердие» сохранено явно, чтобы не утратить семантический компонент ἐλέους.
  issues:
  - severity: low
    issue: Неестественный и избыточный оборот «всем своим милосердным сердцем».
    rationale: Он добавляет притяжательное «своим» и создаёт стилистически тяжёлую конструкцию. Греческий образ требует передачи глубокого внутреннего милосердия, но не обязательно буквального упоминания «сердца» в таком виде.
  revised_text: Если же вам нечего дать нуждающемуся, сострадайте ему от всего сердца, с милосердием.
