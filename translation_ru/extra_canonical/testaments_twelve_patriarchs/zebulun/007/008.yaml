base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/008.yaml
  text: Half of it I would set aside in winter with my brothers. But if you do not have anything to give to the one in need, suffer with him in inward parts of mercy. I know that my own hand did not find anything to give to the one in need, and walking together with him for seven stadia I would weep; and my inward parts turned toward him in sympathy.
translation:
  language: ru
  text: Если же вам нечего дать нуждающемуся, сострадайте ему от всего сердца, с милосердием.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῷ χρήζοντι
  choice: нуждающемуся
  rationale: Передаёт субстантивированное причастие «тому, кто нуждается» естественным современным русским словом.
- source_word: συμπάσχετε αὐτῷ
  choice: сострадайте ему
  rationale: Сохраняет значение совместного переживания чужого страдания, а не только отвлечённой жалости.
- source_word: ἐν σπλάγχνοις ἐλέους
  choice: всем своим милосердным сердцем
  rationale: Греческий образ «внутренностей милосердия» обозначает глубочайшее внутреннее сострадание; русское «сердце» естественно передаёт этот образ без анатомической неуместности.
theological_decisions:
- issue: Характер призыва к состраданию при отсутствии материальных средств
  choice: Сохранить сострадание как самостоятельный нравственный ответ на нужду другого человека.
  alternative: Истолковать фразу как требование только материальной помощи или как особое религиозное предписание.
  rationale: Текст прямо противопоставляет невозможность дать что-либо и возможность разделить страдание нуждающегося; более узкая конфессиональная трактовка не выражена.
translation_notes:
  register: Современный литературный русский язык; тон наставительный и достойный. Идиома со σπλάγχνα передана естественным русским образом сердца, при этом усилитель «всем своим» сохраняет глубину внутреннего участия.
