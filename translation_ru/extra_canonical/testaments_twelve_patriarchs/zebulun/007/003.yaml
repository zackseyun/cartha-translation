  text: And I was walking along the shore, fishing for fish for my father's house until we came to Egypt.
translation:
  language: ru
  text: И я ходил вдоль берегов, ловя рыбу для дома моего отца, пока мы не пришли в Египет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαπορευόμενος τοὺς αἰγιαλούς
  choice: ходил вдоль берегов
  rationale: Передаёт продолжительное передвижение по прибрежным местам; множественное число «берегов» сохраняет форму греческого текста и звучит естественно по-русски.
- source_word: ἁλιεύων ἰχθύας
  choice: ловя рыбу
  rationale: Естественная русская передача буквального «ловя рыб» без избыточного повтора.
- source_word: τῷ οἴκῳ τοῦ πατρός μου
  choice: для дома моего отца
  rationale: Сохраняет значение οἶκος как домашнего хозяйства или семьи, не сужая его до одного здания.
- source_word: ἕως ὅτου ἤλθομεν εἰς Αἴγυπτον
  choice: пока мы не пришли в Египет
  rationale: Точно передаёт временной предел действия и смену числа с первого лица единственного на первое лицо множественного.
