  text: And the brothers of Joseph were not willing to preserve the life of their brother, and the Lord took from them the sandal that they wore against Joseph their brother.
translation:
  language: ru
  text: И братья Иосифа не захотели сохранить жизнь своему брату[a], и Господь снял с них сандалию, которую они носили против Иосифа, своего брата[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст в этом месте, вероятно, повреждён: буквально — «не захотели жизнь своего брата»; подразумеваемый глагол передан как «сохранить».'
    reason: Сообщает читателю о текстологической трудности, не перегружая основной текст неестественной конструкцией.
  - marker: b
    text: Выражение «носили против Иосифа» буквально передаёт необычный греческий оборот; его точный смысл неясен.
    reason: Сохраняет подлинную неоднозначность образа и предупреждает, что формулировка не является обычным русским оборотом.
lexical_decisions:
- source_word: οὐκ ἠθέλησαν †ζωὴν ἀδελφοῦ αὐτῶν
  choice: не захотели сохранить жизнь своему брату
  rationale: В дошедшем греческом тексте после «не захотели» стоит «жизнь» без ожидаемого глагола; «сохранить» естественно передаёт смысл в контексте намерения братьев погубить Иосифа, не маскируя повреждение текста, отмеченное сноской.
- source_word: ὑπέλυσεν αὐτοὺς τὸ ὑπόδημα
  choice: снял с них сандалию
  rationale: ὑπολύω обозначает развязывание или снятие обуви; выбран конкретный и естественный русский оборот, сохраняющий единственное число «сандалия».
- source_word: ἐφόρεσαν κατὰ Ἰωσήφ
  choice: носили против Иосифа
  rationale: Буквально сохранён необычный образ с κατά («против»), поскольку его точный смысл не вполне ясен и его не следует молча истолковывать.
theological_decisions:
- issue: Связь Божьего действия с поступком братьев
  choice: и Господь снял с них сандалию
  alternative: и Господь наказал их, отняв у них сандалию
  rationale: Перевод не добавляет прямо не выраженного слова «наказал», сохраняя повествовательное сопоставление человеческого поступка и действия Господа.
- issue: Смысл образа сандалии
  choice: сохранить буквальный образ
  alternative: заменить образ истолкованием, например «лишил их защиты»
  rationale: Источник говорит именно о сандалии; аллегорическое или богословское толкование не должно подменять текст.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Повтор «Иосифа, своего брата» сохранён вслед за греческим текстом ради риторического акцента; необычная образность не сглажена толкованием.
