  text: For I had no share in his price, my children.
translation:
  language: ru
  text: Ведь я не имел доли в сумме, вырученной за него, дети мои.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Ведь я не участвовал в получении платы за него, дети мои».'
    reason: Греческое ἐκοινώνησα может подчёркивать как отсутствие доли в вырученной сумме, так и более широкое неучастие в получении платы за Иосифа.
lexical_decisions:
- source_word: Εἰς γὰρ τὸ τίμημα αὐτοῦ
  choice: Ведь … из вырученного за него
  rationale: τίμημα здесь означает цену или сумму, полученную за проданного Иосифа; оборот «вырученное за него» естественно передаёт смысл в данном повествовательном контексте.
- source_word: ἐγὼ οὐκ ἐκοινώνησα
  choice: я не получил доли
  rationale: κοινωνέω с εἰς указывает на участие в чём-либо или долю в этом; перевод сохраняет утверждение Завулона, что он не участвовал в распределении выручки.
- source_word: τέκνα μου
  choice: дети мои
  rationale: Прямое и естественное обращение, соответствующее наставительному жанру завещания.
