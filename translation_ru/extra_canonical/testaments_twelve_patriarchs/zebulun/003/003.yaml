base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/003.yaml
  text: For this reason the Lord prevented water from springing up in them, so that provision might be made for Joseph, his brother.
translation:
  language: ru
  text: Поэтому Господь не дал воде забить в них ключом, чтобы позаботиться об Иосифе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκώλυσε
  choice: не дал
  rationale: Естественно передаёт каузативный смысл «воспрепятствовал, удержал», не утяжеляя русскую фразу.
- source_word: ἀναβλῦσαι ὕδωρ
  choice: воде забить… ключом
  rationale: Передаёт образ воды, начинающей бить или бурлить из источника, а не просто наличия воды.
- source_word: περιποίησις
  choice: был сохранён
  rationale: В данном контексте слово обозначает сохранение Иосифа в живых; пассивная конструкция сохраняет цель действия Господа и не вводит отсутствующее в греческом тексте значение материального снабжения.
theological_decisions:
- issue: Божественное действие и сохранение Иосифа
  choice: Господь не дал воде забить… чтобы Иосиф был сохранён
  alternative: чтобы обеспечить Иосифа необходимым
  rationale: Греческий контекст связывает отсутствие воды с сохранением Иосифа; перевод не добавляет конфессиональной интерпретации и оставляет подразумеваемое средство сохранения неуточнённым.
- issue: Упоминание родства Иосифа
  choice: не добавлять «его брат»
  alternative: Иосиф, его брат
  rationale: В предоставленном греческом тексте стоит только τῷ Ἰωσήφ; добавление родства из английского консультационного слоя не подтверждается данным оригиналом.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного стиля. Местоимение «в них» сохранено вслед за греческим ἐν αὐτοῖς, чтобы не подменять его предполагаемый антецедент.
