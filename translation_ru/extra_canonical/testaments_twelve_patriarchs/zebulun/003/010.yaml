review_pass:
  verdict: revise
  source_fidelity: 'Черновик верно передаёт προσεκύνησαν, страдательную форму ἐνεπτύσθησαν («были оплёваны»), παραχρῆμα («тотчас») и πεσόντες ἔμπροσθεν αὐτοῦ («пав перед ним»). Однако исходный греческий текст расходится с последней английской редакцией: ἐνεπτύσθησαν — аорист страдательного залога, а не «они плюнули». Оборот παρὰ τῶν Αἰγυπτίων непосредственно относится к ἠσχύνθησαν; в русской координированной страдательной конструкции его положение после двух глаголов может ошибочно распространить египтян также на оплёвывание.'
  naturalness: «Пав перед ним» и «тотчас были оплёваны» естественны для современного литературного русского с умеренно возвышенным регистром. Небольшая перестройка делает область действия «египтянами» однозначной и сохраняет краткость.
  terminology: «Поклонились» оправданно сохраняет семантическую широту προσκυνέω. «Оплёваны» точно передаёт публичное унижение без ненужного разговорного оттенка. «Посрамили» адекватно выражает ἠσχύνθησαν и позволяет не приписывать египтянам действие оплёвывания.
  issues:
  - severity: medium
    issue: Неоднозначная область действия «египтянами» в русском тексте
    rationale: В формуле «были оплёваны и посрамлены египтянами» творительный падеж может синтаксически относиться к обоим страдательным сказуемым. В греческом παρὰ τῶν Αἰγυπτίων стоит при ἠσχύνθησαν, поэтому безопаснее явно связать египтян только с посрамлением.
  - severity: high
    issue: Английский audit trail неверно истолковывает ἐνεπτύσθησαν как активное действие
    rationale: Греческая форма является аористом страдательного залога. Русский перевод должен сохранять чтение «были оплёваны», а не следовать ошибочной английской редакции.
  revised_text: И они не только поклонились ему, но и, пав перед ним, тотчас были оплёваны; египтяне посрамили их.
