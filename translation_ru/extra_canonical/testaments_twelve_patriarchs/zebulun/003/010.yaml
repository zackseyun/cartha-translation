revisions:
- from: И они не только поклонились ему, но, пав перед ним, тотчас были оплёваны и посрамлены египтянами.
  to: И они не только поклонились ему, но и, пав перед ним, тотчас были оплёваны; египтяне посрамили их.
  rationale: 'Исправление ограничено синтаксическим уточнением: оно сохраняет все действия и их греческие формы, но исключает необоснованное впечатление, будто египтяне были названными исполнителями и оплёвывания, и посрамления. Оно также удерживает страдательное значение ἐνεπτύσθησαν вопреки ошибочной английской audit-trail редакции.'
