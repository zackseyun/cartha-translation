source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 7. Οὐ μόνον δὲ προσεκύνησαν αὐτῷ⁴² ἀλλὰ καὶ ἐνεπτύσθησαν⁴³ παραχρῆμα⁴⁴ πεσόντες ἔμπροσθεν αὐτοῦ, καὶ⁴⁵ ἠσχύνθησαν⁴⁶ παρὰ⁴⁷ τῶν⁴⁸ Αἰγυπτίων⁴⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/010.yaml
  text: And not only did they bow down to him, but they also immediately fell before him and spat, and they were put to shame by the Egyptians.
translation:
  language: ru
  text: И они не только поклонились ему, но и, пав перед ним, тотчас были оплёваны; египтяне посрамили их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεκύνησαν
  choice: поклонились
  rationale: Передаёт совершённое действие и сохраняет возможный диапазон смысла — от почтительного поклона до коленопреклонения — без излишнего уточнения.
- source_word: ἐνεπτύσθησαν
  choice: были оплёваны
  rationale: Форма является аористом страдательного залога от ἐμπτύω и означает, что плевали на них, а не что они сами плевали.
- source_word: παραχρῆμα
  choice: тотчас
  rationale: Кратко и естественно передаёт значение немедленности.
- source_word: πεσόντες ἔμπροσθεν αὐτοῦ
  choice: пав перед ним
  rationale: Сохраняет причастную конструкцию и пространственное значение исходного текста.
- source_word: ἠσχύνθησαν
  choice: посрамлены
  rationale: Передаёт страдательное значение и публичное унижение; литературно и понятно в данном контексте.
- source_word: παρὰ τῶν Αἰγυπτίων
  choice: египтянами
  rationale: Творительный падеж естественно выражает деятеля при страдательной конструкции.
theological_decisions:
- issue: Характер поклонения в προσεκύνησαν
  choice: поклонились
  alternative: поклонились как божеству / пали ниц в поклонении
  rationale: Греческий глагол сам по себе не устанавливает, было ли действие религиозным поклонением; перевод сохраняет эту неоднозначность.
- issue: Кто совершает оплёвывание
  choice: они были оплёваны
  alternative: они плюнули
  rationale: Окончание -θησαν однозначно указывает на страдательный залог. Английская последняя редакция ошибочно трактует форму как действительную.
- issue: Объём действия оборота παρὰ τῶν Αἰγυπτίων
  choice: египтянами отнесено к «были оплёваны и посрамлены»
  alternative: отнести только к «посрамлены»
  rationale: Близкое расположение непосредственно связывает оборот с ἠσχύνθησαν, однако по смыслу общий деятель двух координированных страдательных глаголов наиболее естественен; русская формулировка допускает такое совместное прочтение без добавления нового субъекта.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сжатый, последовательность исходных действий сохранена; архаизмы и конфессионально окрашенные уточнения не добавлены.
