  text: For when they came into Egypt, they had their sandals removed by the attendants of Joseph outside the gate, and so they bowed down to Joseph in the manner before King Pharaoh.
translation:
  language: ru
  text: Ведь когда они пришли в Египет, слуги Иосифа сняли с них обувь[a] снаружи у ворот, и так они поклонились Иосифу, как перед царём-фараоном.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «разули их»; вероятно, речь идёт о снятии сандалий.'
    reason: Греческий глагол передаёт разувание, но сам предмет обуви прямо не назван.
lexical_decisions:
- source_word: ὑπελύθησαν
  choice: сняли с них обувь
  rationale: Глагол употреблён в пассивной форме и в данном контексте означает, что их разули; русская активная конструкция со «слугами Иосифа» естественнее и сохраняет действующее лицо, указанное оборотом ὑπὸ τῶν παίδων.
- source_word: παίδων
  choice: слуги
  rationale: Здесь слово обозначает состоящих при Иосифе служителей, а не детей; «слуги» ясно и естественно передаёт смысл.
- source_word: ἔξωθεν τοῦ πυλῶνος
  choice: перед воротами
  rationale: ἔξωθεν буквально указывает на место снаружи; по-русски «перед воротами» естественно обозначает пространство вне входа.
- source_word: κατὰ τὸν τύπον
  choice: как полагалось
  rationale: Оборот выражает соответствие установленному образцу или порядку. Такая передача естественно связывает поклон с придворным обычаем, не добавляя конкретного ритуала.
- source_word: βασιλέως Φαραώ
  choice: царём-фараоном
  rationale: Сохранены оба титульных элемента греческого выражения; дефис делает сочетание понятным и литературным по-русски.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Причинное γὰρ передано словом «ведь», а οὕτως — связкой «и тогда». Необычная придворная формула сохранена без конфессионального или толковательного расширения.
