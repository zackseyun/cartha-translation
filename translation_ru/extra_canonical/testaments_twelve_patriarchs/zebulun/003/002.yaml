  text: And in the meantime Reuben arose and said, “Come, my brothers, let us not kill him, but let us throw him into one of these dry pits, which our fathers dug and found no water.”
translation:
  language: ru
  text: 'Тем временем Рувим встал и сказал: «Давайте, братья мои, не будем убивать его, а бросим его в одну из этих сухих ям, которые выкопали наши отцы, но воды не нашли».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῷ μεταξὺ
  choice: Тем временем
  rationale: Естественно и точно передаёт временной переход без избыточного буквального «а в промежутке».
- source_word: ἀναστὰς
  choice: встал
  rationale: Сохраняет прямое значение аористного причастия и последовательность действий.
- source_word: Δεῦτε ἀδελφοί μου
  choice: Братья мои
  rationale: В данном побудительном контексте Δεῦτε выполняет призывную функцию; по-русски отдельное «идите» или «давайте» перед «не будем» звучало бы тяжеловесно. Побуждение ясно выражено формой «не будем».
- source_word: μὴ ἀποκτείνωμεν
  choice: не будем убивать его
  rationale: Передаёт увещательное значение конъюнктива первого лица множественного числа.
- source_word: ῥίψωμεν
  choice: бросим
  rationale: Сохраняет конкретное физическое действие и параллелизм с «не будем убивать».
- source_word: ξηρῶν λάκκων
  choice: сухих ям
  rationale: «Ямы» — ясное и контекстуально уместное обозначение выкопанных углублений; «сухих» прямо передаёт отсутствие воды.
- source_word: καὶ οὐχ εὗρον ὕδωρ
  choice: но воды не нашли
  rationale: Греческое καί формально соединительное, однако здесь в русском естественно выражается контраст между рытьём и безрезультатным поиском воды.
