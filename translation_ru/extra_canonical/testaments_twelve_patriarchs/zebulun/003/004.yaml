  text: And they did so until they sold him to the Ishmaelites.
translation:
  language: ru
  text: И они поступали так, пока не продали его измаильтянам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίησαν οὕτως
  choice: поступали так
  rationale: Передаёт сочетание «сделали/поступили так» естественным русским выражением; форма несовершенного вида соответствует продолжавшемуся действию вплоть до продажи.
- source_word: ἕως ὅτου
  choice: пока не
  rationale: Естественно обозначает предел продолжавшегося действия, наступивший с последующим событием.
- source_word: ἐπώλησαν αὐτόν
  choice: продали его
  rationale: Прямо сохраняет значение глагола и местоименный объект.
- source_word: τοῖς Ἰσμαηλίταις
  choice: измаильтянам
  rationale: Традиционная и понятная русская передача этнонима; дательный падеж обозначает покупателей.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; краткий повествовательный стиль. Несовершенный вид «поступали» передаёт повторяемость или длительность, предполагаемую контекстом и конструкцией с «пока не».
