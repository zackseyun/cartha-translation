  text: 9. *Καὶ ἐποίησαν⁴⁷ *οὕτως ἕως ὅτου⁴⁸ ἐπώλησαν⁴⁹ αὐτὸν⁵⁰ τοῖς Ἰσμαηλίταις⁵¹.
