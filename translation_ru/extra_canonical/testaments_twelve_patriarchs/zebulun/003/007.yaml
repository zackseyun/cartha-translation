  rationale: Исправлена синтаксическая связь при снятии сандалии, чтобы отразить принадлежность обуви самому отказавшемуся. «Продолжить род своего брата» ясно передаёт контекстуальный смысл выражения «воздвигнуть семя брату своему», не добавляя сведений о статусе брата или исполнителе обряда.
