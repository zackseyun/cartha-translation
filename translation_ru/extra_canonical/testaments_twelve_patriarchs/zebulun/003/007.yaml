base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/007.yaml
  text: 'Therefore it is written in the book of the law of Moses: “The one who does not want to raise up seed for his brother—his sandal shall be removed, and they shall spit in his face.”'
translation:
  language: ru
  text: 'Поэтому в книге Закона Моисея написано: «У того, кто не хочет продолжить род своего брата, пусть снимут сандалию и плюнут ему в лицо».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν γραφῇ νόμου Μωσέως
  choice: в книге закона Моисея
  rationale: Здесь γραφή обозначает письменный свод или книгу; выражение передано естественно по-русски и согласуется с явной отсылкой к предписанию Закона Моисея.
- source_word: ἀναστῆσαι σπέρμα
  choice: восстановить потомство
  rationale: Буквально — «воздвигнуть семя». В контексте левиратного обычая речь о продолжении рода умершего брата; выбранная формулировка сохраняет библейскую образность глагола и ясно передаёт смысл существительного.
- source_word: ὑπολύεσθαι τὸ ὑπόδημα αὐτοῦ
  choice: пусть снимут сандалию
  rationale: Форма выражает предписанное снятие обуви с отказавшегося; русская конструкция передаёт действие без неоправданного уточнения исполнителя.
- source_word: ἐμπτύεσθαι εἰς τὸ πρόσωπον
  choice: плюнут ему в лицо
  rationale: Передано прямо и естественно; пассивная греческая форма по-русски лучше звучит как неопределённо-личная конструкция.
theological_decisions:
- issue: Значение «семени» в предписании о левирате
  choice: потомство
  alternative: семя
  rationale: «Потомство» ясно выражает династико-родовой смысл σπέρμα и не сводит фразу к физиологическому значению; при этом глагол «восстановить» сохраняет связь с идеей воздвижения рода брату.
