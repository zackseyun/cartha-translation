base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/006.yaml
  text: saying, “We will not eat it, because it is the price of our brother’s blood; rather, let us trample it underfoot, because he said that he would reign over us, and then we shall see what his dreams are.”
translation:
  language: ru
  text: 'говоря: «Мы не станем тратить эти деньги на пищу, потому что это цена крови нашего брата. Давайте растопчем их за то, что он сказал, что будет царствовать над нами, и тогда увидим, что представляют собой его сны».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ φαγόμεθα αὐτήν
  choice: Мы не станем тратить эти деньги на пищу
  rationale: 'Буквально: «не съедим её». Местоимение женского рода относится к ранее названной цене/плате (τιμή), то есть к вырученным деньгам; по-русски естественно передать подразумеваемое расходование денег на пищу.'
- source_word: τιμὴ ... αἵματος
  choice: цена крови
  rationale: Сохранён образ цены, полученной за пролитие или продажу брата, без поясняющего сужения смысла.
- source_word: καταπατήσωμεν αὐτήν
  choice: растопчем их ногами
  rationale: Передан побудительный конъюнктив «давайте растопчем»; местоимение по смыслу обозначает деньги, поэтому в русском использовано множественное число.
- source_word: ἀνθ' ὧν
  choice: за то, что
  rationale: 'Передаёт причинно-возмездный оттенок выражения: деньги надлежит попрать в ответ на его притязание.'
- source_word: τί ἐστι τὰ ἐνύπνια αὐτοῦ
  choice: что станется с его снами
  rationale: 'Идиоматически передаёт насмешливый вызов: братья хотят увидеть, чем обернутся и исполнятся ли сны Иосифа.'
theological_decisions:
- issue: Связь денег с «кровью брата»
  choice: Сохранить формулу «цена крови нашего брата»
  alternative: «плата за кровь нашего брата» или «деньги, полученные за нашего брата»
  rationale: Формула текста намеренно нравственно нагружена и перекликается с представлением о кровавой цене; её не следует нейтрализовать.
- issue: Высказывание о царствовании
  choice: «говорил, будто будет царствовать над нами»
  alternative: «сказал, что будет царствовать над нами»
  rationale: «Будто» естественно выражает презрительное неверие говорящих, уже присутствующее в контексте насмешки, не утверждая объективной ложности сна.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной литературы. Синтаксис сделан естественным для прямой речи; неоднозначное местоимение раскрыто через «эти деньги», поскольку его референт находится в предыдущем стихе.
