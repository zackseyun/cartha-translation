  terminology: Имена и ключевые выражения переданы последовательно. «Умоляя меня помочь ему» адекватно выражает просьбу о помощи, направленной к Иосифу, без неоправданной богословской или интерпретационной нагрузки.
  issues:
  - severity: medium
    issue: Формальное лицо греческого κατέφυγον не совпадает с переводом «он укрылся».
