  text: And when Joseph saw me weeping with him, and the brothers coming on to kill him, he took refuge behind me, begging me for help on his behalf.
translation:
  language: ru
  text: Иосиф увидел, что я плачу вместе с ним и что братья приближаются, чтобы убить его; тогда он укрылся за моей спиной†, умоляя меня помочь ему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνκλαίοντά μοι αὐτῷ
  choice: что я плачу вместе с ним
  rationale: Передаёт совместный плач естественным современным русским оборотом; αὐτῷ понято как относящееся к Иосифу.
- source_word: τοὺς ἀδελφοὺς ἐπερχομένους
  choice: братья приближаются
  rationale: Сохраняет значение движения в сторону Иосифа без добавления лишней образности.
- source_word: ἀνελεῖν αὐτόν
  choice: чтобы убить его
  rationale: Прямо передаёт целевое значение инфинитива и обычное в данном контексте значение ἀναιρέω.
- source_word: κατέφυγον ὄπισθεν μου
  choice: он укрылся за моей спиной
  rationale: Естественно выражает поиск убежища позади рассказчика; форма κατέφυγον контекстуально истолкована как действие Иосифа, несмотря на формальную неоднозначность формы.
- source_word: δεόμενος τῆς πρὸς αὐτὸν βοηθείας
  choice: стал умолять меня помочь ему
  rationale: Идиоматично передаёт просьбу о помощи, направленной к Иосифу, без тяжеловесной номинальной конструкции.
