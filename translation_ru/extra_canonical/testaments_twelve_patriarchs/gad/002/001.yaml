source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: II. Ὁμολογῶ τοίνυν¹ τὴν ἁμαρτίαν μου, τέκνα², ὅτι πλειστάκις ἤθελον³ ἀνελεῖν αὐτόν, *ἐπειδὴ ἐμίσουν αὐτὸν ἐκ ψυχῆς⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/001.yaml
  text: Therefore I confess my sin, children, that many times I wanted to kill him, because I hated him from my soul.
translation:
  language: ru
  text: 'Итак, дети, я признаюсь в своём грехе: много раз я хотел убить его, потому что ненавидел его всей душой.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμολογῶ
  choice: я признаюсь
  rationale: Передаёт открытое признание собственной вины; возвратная форма естественна в современном русском контексте.
- source_word: τοίνυν
  choice: итак
  rationale: Сохраняет выводно-связующее значение частицы.
- source_word: τέκνα
  choice: дети
  rationale: Прямое и естественное обращение отца к детям.
- source_word: πλειστάκις
  choice: много раз
  rationale: Точно передаёт повторяемость намерения без стилистической архаизации.
- source_word: ἤθελον ἀνελεῖν
  choice: я хотел убить
  rationale: Передаёт неоднократно возникавшее намерение лишить его жизни; несовершенный вид «хотел» соответствует контексту.
- source_word: ἐμίσουν αὐτὸν ἐκ ψυχῆς
  choice: ненавидел его всей душой
  rationale: Естественный русский эквивалент буквального «ненавидел его из души», сохраняющий силу и внутреннюю глубину ненависти.
theological_decisions:
- issue: Характер признания греха
  choice: я признаюсь в своём грехе
  alternative: я исповедую свой грех
  rationale: «Признаюсь» ясно выражает признание вины и не привносит более узкого конфессионального оттенка, возможного у слова «исповедую».
translation_notes:
  register: Современный литературный русский язык, прямой и достойный тон отцовского признания. Двоеточие естественно вводит содержание признания, выраженное в греческом союзом ὅτι.
