  text: '[β, Α, S¹] 5. Καὶ ὁ Θεὸς τῶν πατέρων μου²⁰ ἐρρύσατο αὐτὸν ἐκ τῶν χειρῶν μου, ἵνα μὴ²¹ ποιήσω ἀνόμημα²² ἐν Ἰσραήλ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/005.yaml
  text: But the God of my fathers rescued him from my hands, so that I might not commit a lawless deed in Israel.
translation:
  language: ru
  text: Но Бог моих отцов вырвал его из моих рук, чтобы я не совершил беззакония в Израиле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεὸς τῶν πατέρων μου
  choice: Бог моих отцов
  rationale: Прямая и естественная передача родительного оборота с сохранением библейской формулы.
- source_word: ἐρρύσατο αὐτὸν ἐκ τῶν χειρῶν μου
  choice: вырвал его из моих рук
  rationale: Глагол ῥύομαι обозначает избавление или спасение от опасности; «вырвал» естественно передаёт здесь активное освобождение человека из власти говорящего.
- source_word: ποιήσω ἀνόμημα
  choice: совершил беззаконие
  rationale: Сохраняется юридико-нравственный оттенок ἀνόμημα — поступка, нарушающего закон.
- source_word: ἐν Ἰσραήλ
  choice: в Израиле
  rationale: Буквальная формулировка сохраняет возможную отсылку как к народу, так и к общине Израиля, не устраняя исходную смысловую широту.
theological_decisions:
- issue: Действие Бога как предотвращение греха
  choice: «чтобы я не совершил»
  alternative: «дабы мне не совершить»
  rationale: Передаёт целевое ἵνα μή и сохраняет мысль о том, что Божье избавление предотвратило беззаконный поступок говорящего, без дополнительного богословского истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис ясен и близок к греческому оригиналу; архаизмы не используются.
