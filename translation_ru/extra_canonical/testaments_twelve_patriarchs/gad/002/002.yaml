revisions:
- from: И из-за снов я стал ненавидеть его ещё сильнее и хотел слизнуть его с земли живых, как телёнок слизывает зелень на поле.
  to: И из-за снов я ещё усилил свою ненависть к нему и хотел слизнуть его с земли живых¹, как телёнок слизывает зелень поля.
  rationale: Правка точнее передаёт усилительное значение προσεθέμην и генитив τοῦ πεδίου, сохраняя резкий образ «слизнуть». Добавлена сноска к восстановленному в критическом тексте слову «живых», чтобы перевод не создавал впечатления бесспорности этого чтения.
  reviewer_model: gpt-5.6-terra
