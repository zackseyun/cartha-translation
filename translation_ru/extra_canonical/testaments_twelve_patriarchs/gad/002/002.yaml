base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/002.yaml
  text: And because of the dreams I added hatred toward him, and I wanted to lick him up from the land of the living, as a calf licks up the green growth of the field.
translation:
  language: ru
  text: И из-за снов я ещё усилил свою ненависть к нему и хотел слизнуть его с земли живых¹, как телёнок слизывает зелень поля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τὰ ἐνύπνια
  choice: из-за снов
  rationale: Передаёт причинное значение διά с винительным и сохраняет прямую связь ненависти со снами.
- source_word: προσεθέμην αὐτῷ τὸ μῖσος
  choice: я стал ненавидеть его ещё сильнее
  rationale: Греческая идиома буквально означает «прибавил к нему ненависть»; естественная русская формулировка сохраняет значение усиления уже существующей ненависти.
- source_word: ἐκλεῖξαι ἐκ γῆς ζώντων
  choice: слизнуть его с земли живых
  rationale: Сохранён намеренно резкий образ глагола «слизывать», который далее прямо развивается сравнением с телёнком; «земля живых» воспроизводит традиционный библейский оборот.
- source_word: τὰ χλωρὰ τοῦ πεδίου
  choice: зелень на поле
  rationale: χλωρά обозначает зелёную растительность или свежую поросль; краткое «зелень» естественно по-русски и не сужает образ до конкретного растения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с сохранением библейского оборота «земля живых» и необычной, но значимой метафоры «слизнуть». Синтаксис сделан естественным, без устранения жестокости и образной напряжённости оригинала.
