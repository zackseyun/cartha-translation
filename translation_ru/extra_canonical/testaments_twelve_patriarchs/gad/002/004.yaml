source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: '[α-text] 5. Οὕτως¹⁴ ὁ Θεὸς τῶν πατέρων ἡμῶν ἐρρύσατο αὐτὸν ἐκ τῶν χειρῶν ἡμῶν, ἵνα μὴ ποιήσωμεν ἐν τῷ Ἰσραὴλ ἀνομίαν μεγάλην. [β, Α, S¹] 4. Καὶ οὕτως τῇ πλεονεξίᾳ ἐπληροφορήθημεν¹⁹ τῆς ἀναιρέσεως αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/004.yaml
  text: 'Thus the God of our fathers rescued him from our hands, so that we might not commit a great lawless deed in Israel.


    And so, through greed, we were fully persuaded of his murder.'
translation:
  language: ru
  text: 'Так Бог наших отцов избавил его от наших рук, чтобы мы не совершили великого беззакония в Израиле.[a]



    И так, из-за алчности мы окончательно убедились в необходимости убить его.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В α-тексте это предложение имеет номер 5; в представленной совокупности вариантов оно предшествует предложению, которое другие свидетели нумеруют как стих 4.
    reason: Источник объединяет чтения с различающейся нумерацией; примечание предупреждает читателя о текстологической особенности.
  - marker: b
    text: 'Буквально: «через алчность мы полностью уверились относительно его умерщвления». Греческое выражение необычно: оно говорит о полной убеждённости, а контекст позволяет отнести её к намерению убить его.'
    reason: Примечание сохраняет доступ к неоднозначной, несколько шероховатой конструкции оригинала и поясняет контекстуальное развёртывание в основном тексте.
lexical_decisions:
- source_word: ἐρρύσατο
  choice: избавил
  rationale: Передаёт спасение от непосредственной опасности и естественно сочетается с выражением «от наших рук».
- source_word: ἀνομίαν μεγάλην
  choice: великого беззакония
  rationale: Сохраняет правовой и нравственно-религиозный оттенок ἀνομία, не сужая смысл до простого «преступления».
- source_word: τῇ πλεονεξίᾳ
  choice: поддавшись алчности
  rationale: Творительно-причинное значение дательного передано естественным русским оборотом; πλεονεξία здесь обозначает корыстную алчность.
- source_word: ἐπληροφορήθημεν
  choice: окончательно решились
  rationale: В данном контексте передаёт достижение полной внутренней убеждённости и твёрдого намерения; буквальное «полностью уверились в его убийстве» по-русски неясно и может ошибочно подразумевать уже совершившееся убийство.
- source_word: τῆς ἀναιρέσεως αὐτοῦ
  choice: убить его
  rationale: Передаёт направленность решения на насильственное лишение его жизни и устраняет несвойственную русскому языку абстрактную конструкцию «в его убийстве».
theological_decisions:
- issue: Предотвращение беззакония приписано действию Бога отцов
  choice: сохранено прямое утверждение «Бог наших отцов избавил его»
  alternative: ослабленное «Бог допустил ему спастись»
  rationale: Греческое ἐρρύσατο прямо называет Бога действующим избавителем; оснований ослаблять это утверждение нет.
- issue: Цель избавления выражена через ἵνα μή с первым лицом множественного числа
  choice: «чтобы мы не совершили»
  alternative: «и потому мы не совершили»
  rationale: Сохранено целевое значение конструкции и нравственная ответственность говорящих, без превращения цели в простое следствие.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной речи. «Бог наших отцов» и «беззаконие в Израиле» сохранены как значимые библейские формулы; синтаксис упрощён лишь там, где буквальная передача греческого родительного оборота стала бы двусмысленной.
