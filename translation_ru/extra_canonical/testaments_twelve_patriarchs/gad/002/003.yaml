source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: '[α-text] 3. Καὶ κρυφῆ πράσας αὐτὸν Ἰούδας τοῖς Ἰσμαιλίταις. [β, Α, S¹] 3. Διὸ¹⁵ ἐγὼ καὶ Συμεὼν¹⁶ πεπράκαμεν αὐτὸν τοῖς Ἰσμαηλίταις [*τριάκοντα χρυσίων¹⁷, καὶ τὰ δέκα ἀποκρύψαντες τὰ εἴκοσι ἐδείξαμεν τοῖς ἀδελφοῖς ἡμῶν¹⁸].'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/003.yaml
  text: 'But Judah sold him secretly to the Ishmaelites.


    Therefore Simeon and I sold him to the Ishmaelites for thirty pieces of gold; and after hiding ten, we showed twenty to our brothers.'
translation:
  language: ru
  text: '[α-текст] И Иуда тайно продал его измаильтянам.


    [β, A, S¹] Поэтому мы с Симеоном продали его измаильтянам за тридцать золотых[a]; спрятав десять, мы показали нашим братьям двадцать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «за тридцать золотых; спрятав десять, мы показали нашим братьям двадцать» имеют особый текстуальный статус в издании и присутствуют не во всех формах текста.
    reason: Отражает скобки и критические пометы исходного издания, не перегружая основной текст редакционными символами.
lexical_decisions:
- source_word: κρυφῆ
  choice: тайно
  rationale: Передаёт наречное значение скрытого от других действия, не уточняя, от кого именно оно было скрыто.
- source_word: πράσας / πεπράκαμεν
  choice: продал / продали
  rationale: Обычное и точное соответствие глаголу πιπράσκω в контексте продажи Иосифа.
- source_word: Ἰσμαιλίταις / Ἰσμαηλίταις
  choice: измаильтянам
  rationale: Современная русская форма этнонима при сохранении традиционного библейского написания.
- source_word: τριάκοντα χρυσίων
  choice: за тридцать золотых
  rationale: Сохраняет неопределённость греческого обозначения денежных единиц и не вводит отсутствующее в источнике слово «монет» или конкретный номинал.
- source_word: ἀποκρύψαντες
  choice: спрятав
  rationale: Естественно передаёт предшествующее сопутствующее действие аористного причастия.
- source_word: ἐδείξαμεν
  choice: показали
  rationale: Формально сохраняет значение «показали», не заменяя его интерпретирующим «отдали» или «предъявили».
theological_decisions:
- issue: Различие текстовых форм о том, кто продал Иосифа
  choice: Представить α-текст и чтение β, A, S¹ отдельно
  alternative: Свести их в единый согласованный рассказ
  rationale: 'Варианты называют разных действующих лиц: в α-тексте — Иуда, в другой традиции — Гад и Симеон. Объединение устранило бы подлинное текстовое напряжение.'
- issue: Упоминание тридцати золотых и сокрытия части суммы
  choice: Сохранить как текстуально отмеченный элемент чтения β, A, S¹ с примечанием
  alternative: Опустить без указания или включить без оговорки
  rationale: Квадратные скобки и критические знаки в источнике указывают на особый текстуальный статус отрывка; читателю следует сообщить об этом.
translation_notes:
  register: Современный литературный русский язык с библейской сдержанностью. Синтаксис сделан естественным для обычного читателя; при этом варианты рукописной традиции не гармонизированы. Все добавленные для ясности элементы сведены к минимуму.
