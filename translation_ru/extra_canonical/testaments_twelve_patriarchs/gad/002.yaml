base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002.yaml
  text: '1 Therefore I confess my sin[a], children: many times I wanted to kill him, because I hated him from my soul. 2 And because of the dreams I added hatred toward him, and I wanted to wipe him out from the land of the living, as a calf licks up the green growth of the field. 3 But Judah sold him secretly to the Ishmaelites. 4 Thus the God of our fathers rescued him from our hands, so that we might not commit a great lawless deed in Israel.


    3 Therefore Simeon and I sold him to the Ishmaelites for thirty pieces of gold; and after hiding ten, we showed twenty to our brothers. 4 And so, through greed, we were fully set on his murder. 5 But the God of my fathers rescued him from my hands[d][c][b], so that I might not commit a lawless deed in Israel.'
translation:
  language: ru
  text: '1 Итак, я исповедую свой грех[a], дети: много раз я хотел убить его, потому что ненавидел его всей душой. 2 Из-за его снов я стал ненавидеть его ещё сильнее и хотел стереть его с земли живых[b], как телёнок слизывает полевую зелень. 3 И Иуда тайно продал его исмаильтянам[c]. 4 Так Бог наших отцов избавил его из наших рук, чтобы мы не совершили великого беззакония в Израиле.


    3 Поэтому мы с Симеоном продали его исмаильтянам за тридцать золотых монет[d]; спрятав десять, мы показали нашим братьям двадцать. 4 И так из-за алчности мы окончательно решились убить его. 5 Но Бог моих отцов избавил его из моих рук, чтобы я не совершил беззакония в Израиле.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В этой главе сохранились две текстовые формы рассказа о продаже Иосифа. Здесь переведены обе, без попытки свести их в одну версию.
    reason: textual_variant
  - marker: b
    text: 'Или: «поглотить его», «слизать его». Греческий глагол буквально означает «слизывать», что отражено в следующем сравнении с телёнком.'
    reason: lexical_alternative
  - marker: c
    text: 'Согласно одной группе рукописей, Иосифа тайно продал Иуда; в другой текстовой форме ниже говорится: «мы с Симеоном продали его исмаильтянам».'
    reason: textual_variant
  - marker: d
    text: «Тридцать золотых монет» — чтение этой греческой текстовой формы; к ней же относится сообщение о десяти спрятанных и двадцати показанных братьям монетах.
    reason: textual_variant
lexical_decisions:
- source_word: Ὁμολογῶ ... τὴν ἁμαρτίαν μου
  choice: я исповедую свой грех
  rationale: «Исповедую» передаёт открытое покаянное признание и сохраняет нравственно-религиозный вес слова ἁμαρτία.
- source_word: ἐμίσουν αὐτὸν ἐκ ψυχῆς
  choice: ненавидел его всей душой
  rationale: Естественная русская библейская формула сохраняет буквальный образ ψυχή и силу чувства.
- source_word: προσεθέμην αὐτῷ τὸ μῖσος
  choice: стал ненавидеть его ещё сильнее
  rationale: Передаёт нарастание ненависти, выраженное глаголом «прибавлять», без неестественного русского оборота.
- source_word: ἐκλεῖξαι ... ἐκ γῆς ζώντων
  choice: стереть его с земли живых
  rationale: В основном высказывании передан идиоматический смысл устранения, тогда как конкретный образ «слизывать» сохранён в следующем сравнении с телёнком.
- source_word: τὰ χλωρὰ τοῦ πεδίου
  choice: полевую зелень
  rationale: Передаёт собирательное значение зелёной растительности и звучит естественно по-русски.
- source_word: ἐρρύσατο
  choice: избавил
  rationale: Передаёт конкретное спасение Иосифа от непосредственной опасности и соответствует возвышенному библейскому регистру.
- source_word: ἀνομίαν μεγάλην / ἀνόμημα
  choice: великое беззаконие / беззаконие
  rationale: Сохраняет правовой и нравственно-религиозный оттенок греческой лексики.
- source_word: τῇ πλεονεξίᾳ ἐπληροφορήθημεν τῆς ἀναιρέσεως αὐτοῦ
  choice: из-за алчности мы окончательно решились убить его
  rationale: Естественно передаёт алчность как побуждение и полную решимость довести убийство до конца.
theological_decisions:
- issue: Две расходящиеся текстовые формы рассказа о продаже Иосифа
  choice: Перевести обе формы раздельно, сохранив повторную нумерацию стихов 3–5 и различия между множественным и единственным числом.
  alternative: Свести формы в один последовательный рассказ или выбрать только одну из них.
  rationale: 'Греческое свидетельство сохраняет параллельные версии: в одной Иосифа тайно продаёт Иуда, в другой — Гад вместе с Симеоном. Их объединение скрыло бы реальное текстовое расхождение.'
- issue: Образ ἐκλεῖξαι и последующее сравнение с телёнком
  choice: В основной фразе передать смысл как «стереть его», а буквальное «слизывает» сохранить в явно поясняющем сравнении.
  alternative: Дважды употребить буквальное «слизать» или полностью заменить образ нейтральным «уничтожить».
  rationale: Так сохраняются одновременно идиоматический смысл намерения убить Иосифа и конкретная образность греческого сравнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; традиционные выражения «всей душой», «земля живых» и «беззаконие» сохранены ради образности и нравственно-религиозного тона. Две текстовые формы визуально разделены абзацем и не гармонизированы.
