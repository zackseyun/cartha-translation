lexical_decisions:
- source_word: παραινῶ
  choice: призываю
  rationale: Передаёт настойчивое наставление в завещательной речи, не снижая его до простого совета.
- source_word: πλησίον
  choice: ближний
  rationale: Устоявшийся русский этический термин, точно соответствующий межличностному смыслу.
- source_word: ἐξάρατε τὸ μῖσος
  choice: удалит ненависть
  rationale: Передаёт решительное устранение ненависти из сердца и естественно звучит по-русски.
- source_word: διανοίᾳ ψυχῆς
  choice: помышлением души
  rationale: Сохраняет необычное сочетание внутреннего намерения и души, не сводя его просто к искренности.
- source_word: εἰρηνικά
  choice: мирно
  rationale: Естественно выражает внешний мирный тон речи в противопоставлении внутренней ненависти.
- source_word: τὸ πνεῦμα τοῦ μίσους
  choice: дух ненависти
  rationale: Сохраняет яркую персонификацию или духовно-нравственную силу выражения, не определяя её природу точнее источника.
- source_word: νοῦν / λογισμόν
  choice: ум / мысли
  rationale: Различает два близких понятия и передаёт омрачение ума и смятение внутреннего рассуждения.
- source_word: εἰπὲ αὐτῷ εἰρήνην / ἐν εἰρήνῃ
  choice: говори с ним мирно
  rationale: Естественная современная русская формулировка, сохраняющая призыв к мирному обращению.
- source_word: δόλον
  choice: коварство
  rationale: Передаёт скрытую недоброжелательность и двоедушие сильнее, чем нейтральный «обман».
- source_word: μετανοήσας
  choice: раскается
  rationale: В контексте признания проступка обозначает нравственное сожаление и перемену отношения; русское «раскается» здесь естественно и не добавляет конфессиональной специфики.
- source_word: φιλονείκει
  choice: не препирайся
  rationale: Передаёт упорный, склонный к ссоре спор и звучит понятно в современном литературном русском.
- source_word: δολοφωνεῖ
  choice: вероломно убивает
  rationale: Сохраняет и значение убийства, и элемент предательства или коварства.
- source_word: δὸς τῷ Θεῷ τὴν ἐκδίκησιν
  choice: возмездие предоставь Богу
  rationale: Точно передаёт отказ от личной мести и передачу суда Богу, не смягчая богословского напряжения.
theological_decisions:
- issue: Природа «духа ненависти»
  choice: Сохранено буквальное выражение «дух ненависти»
  alternative: «чувство ненависти»
  rationale: Источник допускает как персонифицированное нравственное влияние, так и более сильный духовный смысл; перевод не должен заранее устранять эту неоднозначность.
- issue: Значение μετανοέω в личном конфликте
  choice: «раскается»
  alternative: «изменит своё решение»
  rationale: Признание вины и последующее прощение требуют не только когнитивной перемены, но нравственного поворота; «раскается» передаёт это без уточнения его доктринального объёма.
- issue: Последняя фраза о воздаянии
  choice: «возмездие предоставь Богу»
  alternative: «предоставь Богу отмщение»
  rationale: Сохраняется мысль о Божьем суде и запрете личной мести, однако избегается архаичность слова «отмщение».
- issue: Раскаяние человека, который продолжает отрицать вину
  choice: 'Сохранено внутреннее напряжение: «отрицающий раскаивается»'
  alternative: Объяснить отрицание как внешнее, а раскаяние как внутреннее
  rationale: Греческий текст соединяет отрицание и раскаяние парадоксальным образом; перевод не вводит отсутствующего в источнике психологического объяснения.
translation_notes:
  register: 'Современный литературный русский с достоинством завещательного наставления. Синтаксис сделан ясным для обычного читателя, но сохранены ключевые образы источника: «дух ненависти», «яд», «возмездие». Архаизмы сведены к минимуму; «ближний» сохранён как живой и узнаваемый этический термин.'
