  text: '1[a]. And now, my children, I urge you: let each one love his neighbor, and remove hatred from your hearts. Love one another in deed and word and with the intention of the soul.


    2. For I myself, in my father’s presence, spoke peaceably to Joseph; but when I went out from his presence, the spirit of hatred darkened my mind and disturbed my understanding so that I wanted to kill him.


    3. Love one another from the heart; and if anyone sins against you[b], speak peace to him, and in your soul hold no deceit; and if he confesses and changes his mind, forgive him.


    4. But if he denies it, do not contend with him, lest, when he swears an oath, you sin doubly.


    5. Do not let a stranger hear your secret in a quarrel, lest, hating you, he become your enemy and commit a great sin against you; for many times he either kills by treachery or entangles you in evils, having taken in from you the poison.


    6. But if he denies it and is ashamed when reproved, be still and do not reprove him further. For the one who denies it repents of having done wrong against you, so as not to wrong you again, and, being afraid, makes peace.


    7. But even if he is shameless and persists in his wrongdoing, even so forgive him from the heart[c], and leave vengeance to God.'
translation:
  language: ru
  text: '1. И теперь, дети мои, я призываю вас: пусть каждый из вас любит своего ближнего; изгоните ненависть из ваших сердец. Любите друг друга делом, словом и помышлением души.


    2. Я сам в присутствии отца говорил с Иосифом мирно, но, выйдя от него, дух ненависти омрачил мой ум и смутил мои мысли, так что я хотел убить его.


    3. Любите друг друга от сердца. Если кто-нибудь согрешит против тебя, говори с ним мирно[a] и не таи коварства в своей душе. Если же он признается и раскается, прости его.


    4. А если он станет отрицать, не препирайся с ним, чтобы тебе, когда он поклянётся, не согрешить вдвойне.


    5. Не допускай, чтобы во время ссоры посторонний услышал твою тайну[b], иначе он может возненавидеть тебя, стать твоим врагом и совершить против тебя великий грех. Ведь нередко, переняв от тебя этот яд, он либо вероломно убивает тебя, либо вовлекает тебя в беды.


    6. Если же он станет отрицать, но, будучи обличён, устыдится, успокойся и больше не обличай его. Ведь отрицающий раскаивается в том, что провинился перед тобой, и, устрашившись, примиряется[c].


    7. Но даже если он бесстыден и упорствует во зле, всё равно прости его от сердца, а возмездие предоставь Богу.


    [a] В стихе 3 рукописи различаются в формулировке призыва говорить с согрешившим мирно и в расположении слов «не таи коварства в своей душе». Общий смысл — мирное обращение без скрытого коварства — остаётся ясным.


    [b] Текст стиха 5 в ряде мест труден. Здесь содержится предостережение не раскрывать личное дело во время ссоры, поскольку услышанное может породить в постороннем вражду и привести к вероломству. «Яд» — образ перенятой ненависти.


    [c] В стихе 6 рукописи расходятся в формулировках о раскаянии и страхе отрицающего свою вину. Общий смысл, по-видимому, в том, что стыд может побудить его прекратить зло и примириться.'
  philosophy: optimal-equivalence
