  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008.yaml
  text: 'Say these things[a], you also, to your children:


    that they honor Levi and Judah; for from them the Lord will raise up salvation for Israel.

    And tell them concerning Joseph, that they should love him, because in every affliction he was innocent,

    and he kept the commandment of God, not returning evil for evil.

    For he suffered much from his brothers, yet he loved them,

    and though they plotted against him, he spoke peaceably to them.


    And now, my children, I command you: love one another from the heart,

    and if anyone sins against you, speak peaceably to him, and in your soul hold no deceit;

    and if he confesses and repents, forgive him.

    But if he denies it, do not become heated in argument with him,

    lest, after taking in poison[b], he begin to swear and so commit a double sin.

    If anyone prospers beyond you, do not be grieved;

    but pray also for him, that he may be made complete in every good thing.


    If anyone is glorified, do not envy him;

    if anyone is enriched, do not be jealous.

    Bless the Lord who gives good things to all,

    because the poor man, if he is free from envy, is rich before the Lord.

    Do not hate a beautiful woman because of her appearance,

    and do not hate a man because of the abundance of his glory.

    For God gives the good things of the earth to whom he wills.


    Seek uprightness in your own works,

    and pray for your neighbor, so that if he prospers in every good thing, you may not be jealous.

    For the one who is jealous is always in turmoil,

    and the one who hates is always darkened.

    Love one another in deed and in word and in the intention of the soul.

    For I also spoke peaceably with Joseph, but in my heart I intended to kill him.

    The spirit of hatred is evil, because it is never at peace with men;

    it always desires their downfall.

    It weakens the body and disturbs the soul,

    and it puts wrath upon the mind.


    Therefore, if anyone does evil to you, do good to him,

    and pray for him; and you will be redeemed by the Lord from every evil.

    For if anyone prospers, and if he is shameless or lawless, do not be jealous;

    but wait for the end from the Lord.

    For either he receives his reward in this life,

    or, if he is kept for punishment, he will be repaid in the judgment.

    And if a poor man prospers and is without envy, even if he is not rich,

    he is blessed beyond all men, because he has the treasure that does not perish.

    Therefore cast away hatred[c], and love one another in uprightness of heart.'
translation:
  language: ru
  text: '8


    1 И вы скажите это своим детям, чтобы они чтили Иуду и Левия, ибо от них взойдёт для вас Господь — спасение Израиля.[a]


    2 Ибо я знаю, что ваши дети отступят от него[b] и окажутся во власти всякого нечестия, зла и развращения, вдали от Господа.


    3 Немного помолчав, он вновь сказал: «Дети мои, послушайтесь отца вашего и похороните меня возле моих предков».


    4 Затем он поднял ноги и почил с миром.


    5 Через пять лет они перенесли его в Хеврон и положили рядом с его предками.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза синтаксически трудна; буквально в ней стоят слова «Господь» и «спасение» в необычном сочетании. Возможен также перевод: «ибо от них Господь воздвигнет для вас спасение Израилю». Основной текст передаёт распространённое понимание: Господь, происходящий от них, назван спасением Израиля.'
    reason: syntactic_ambiguity
  - marker: b
    text: 'Неясно, к кому относится «от него»: возможно, к Господу либо к одному из ранее упомянутых лиц. Неопределённость греческого текста сохранена.'
    reason: referent_ambiguity
lexical_decisions:
- source_word: τιμήσωσιν
  choice: чтили
  rationale: Передаёт уважение и признание особого положения Иуды и Левия, не придавая глаголу значения культового поклонения.
- source_word: ἀνατελεῖ
  choice: воздвигнет
  rationale: Сохраняет образ возникновения или восхождения спасения и пророческую направленность высказывания; более буквальное «взрастит» здесь звучало бы неестественно.
- source_word: σωτηρίαν
  choice: спасение
  rationale: Сохраняет широкий смысл Божьего избавления и не сужает его до одной исторической либо богословской реализации.
- source_word: ἀποστήσονται
  choice: отступят
  rationale: Передаёт осознанное удаление и возможный религиозно-нравственный оттенок глагола, не усиливая его до формального вероотступничества.
- source_word: κακώσει
  choice: бедствия
  rationale: Существительное может обозначать дурное обращение, угнетение или бедственное состояние; «бедствия» естественно сочетается с соседними отвлечёнными существительными и сохраняет широту смысла.
- source_word: ἐκοιμήθη
  choice: почил
  rationale: Сохраняет традиционную метафору сна как смерти и соответствует достоинству завещательного повествования.
- source_word: ἀνήγαγον
  choice: перенесли
  rationale: В контексте посмертного перемещения останков в Хеврон естественное русское обозначение действия; направление движения не перегружено отдельным «вверх».
theological_decisions:
- issue: Спасение, происходящее от Иуды и Левия
  choice: «от них Господь воздвигнет для вас спасение Израилю»
  alternative: «от них взойдёт для вас Господь, спасение Израиля»
  rationale: Греческий порядок слов допускает напряжённое прочтение, но форма σωτηρίαν как винительный падеж естественнее понимается как дополнение к ἀνατελεῖ, а Κύριος — как подлежащее. Формулировка оставляет открытым, идёт ли речь о священническо-царском руководстве вообще или о более конкретном мессианском ожидании.
- issue: Неясный референт местоимения αὐτοῦ во 2-м стихе
  choice: Сохранено «от него» с пояснительной сноской
  alternative: «от Господа» либо «от Иуды и Левия»
  rationale: В греческом тексте стоит местоимение единственного числа без однозначно названного ближайшего референта; подстановка конкретного имени устранила бы подлинную неясность текста.
- issue: Метафора смерти как сна
  choice: «мирно почил»
  alternative: «уснул в мире»
  rationale: Русское «почил» сохраняет метафорический характер выражения, но не заставляет современного читателя принять повествование за описание обычного сна.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным завещательным регистром. Синтаксис упрощён там, где буквальное воспроизведение греческого было бы неясным, однако пророческая формула и неоднозначное местоимение сохранены. Переведён только представленный греческий текст главы 8; отсутствующий в нём обширный материал английского консультационного слоя не включён.
