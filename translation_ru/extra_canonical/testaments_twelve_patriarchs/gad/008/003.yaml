base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008/003.yaml
  text: 'And after resting a little he spoke again: My children, obey your father, and bury me near my fathers.'
translation:
  language: ru
  text: 'Немного помолчав, он снова сказал: «Дети мои, послушайтесь своего отца и похороните меня рядом с моими предками».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡσυχάσας ὀλίγον
  choice: немного отдохнув
  rationale: Причастный оборот естественно передаёт краткую передышку или покой перед возобновлением речи.
- source_word: ὑπακούσατε
  choice: послушайтесь
  rationale: Аорист повелительного наклонения выражает прямой призыв исполнить волю отца; совершенный вид уместен в данном контексте.
- source_word: θάψατέ με ἐγγὺς τῶν πατέρων μου
  choice: похороните меня рядом с моими предками
  rationale: ἐγγύς передано пространственно как «рядом с», а πατέρες в погребальном контексте означает умерших предков, а не нескольких буквальных отцов.
