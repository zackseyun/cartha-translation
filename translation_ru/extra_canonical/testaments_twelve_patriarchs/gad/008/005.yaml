lexical_decisions:
- source_word: ἀνήγαγον
  choice: перенесли
  rationale: В данном погребальном контексте глагол означает, что останки доставили в расположенный выше Хеврон; «перенесли» по-русски естественно передаёт действие, не добавляя прямо не названного в тексте предмета — тела или костей.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: рядом с его предками
  rationale: Передаёт погребение среди ранее умерших праотцов современным и понятным языком; «предки» здесь естественнее буквального «отцы» и сохраняет семейно-родовой смысл.
