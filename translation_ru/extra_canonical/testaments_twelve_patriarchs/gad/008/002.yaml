source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. *Ἐγὼ γὰρ ἔγνων⁶, ὅτι ἀποστήσονται⁷ τὰ τέκνα ὑμῶν ἀπ᾽ αὐτοῦ⁸, καὶ⁹ πάσῃ πονηρίᾳ καὶ κακώσει καὶ διαφθορᾷ ἔσονται ἀπὸ¹⁰ Κυρίου.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008/002.yaml
  text: For I have known that your children will turn away from him, and in every wickedness and affliction and corruption they will be away from the Lord.
translation:
  language: ru
  text: Ибо я узнал, что ваши дети отступят от него[a] и, вдали от Господа, будут пребывать во всяком зле, бедствии и порче.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «от Него»; референт греческого местоимения в данном стихе прямо не назван.'
    reason: Сохраняет неоднозначность αὐτοῦ и не отождествляет его с Господом безоговорочно.
lexical_decisions:
- source_word: ἔγνων
  choice: я узнал
  rationale: Передаёт аорист глагола γινώσκω без добавления способа или источника знания.
- source_word: ἀποστήσονται
  choice: отступят
  rationale: Сохраняет значение отхода и отпадения, естественное как в нравственном, так и в религиозном контексте.
- source_word: πάσῃ πονηρίᾳ
  choice: во всяком зле
  rationale: Естественно передаёт обобщающее нравственное значение πονηρία.
- source_word: κακώσει
  choice: бедствии
  rationale: κάκωσις может обозначать тяготу, угнетение или бедственное состояние; «бедствие» сохраняет широту значения и не превращает его однозначно в действие самих детей.
- source_word: διαφθορᾷ
  choice: развращении
  rationale: Передаёт нравственную порчу, соответствующую контексту ряда πονηρία—κάκωσις—διαφθορά.
- source_word: ἔσονται ἀπὸ Κυρίου
  choice: вдали от Господа, будут пребывать
  rationale: Отражает состояние отделённости от Господа и одновременно естественно связывает ἔσονται с перечисленными существительными.
theological_decisions:
- issue: Референт местоимения αὐτοῦ в ἀπ᾽ αὐτοῦ
  choice: Сохранено «от него» со строчной буквы и с примечанием
  alternative: «от Него», прямо относя местоимение к Господу
  rationale: Греческое местоимение само по себе не обозначает референта типографически; перевод не должен без контекста молча устранять возможную неоднозначность.
- issue: Значение ἀπὸ Κυρίου
  choice: 'Передано пространственно-отношенчески: «вдали от Господа»'
  alternative: «от Господа» в смысле происхождения или источника
  rationale: В сочетании с отступничеством наиболее естественно значение отделения; вариант источника создал бы богословски резкое утверждение, будто зло исходит от Господа.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейско-завещательным звучанием. Синтаксис слегка перестроен ради ясности; смысловые отношения исходного греческого сохранены.
