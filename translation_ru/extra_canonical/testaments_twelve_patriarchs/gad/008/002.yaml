revisions:
- from: Ибо я узнал, что ваши дети отступят от него[a] и, вдали от Господа, будут пребывать во всяком зле, бедствии и развращении.
  to: Ибо я узнал, что ваши дети отступят от него[a] и, вдали от Господа, будут пребывать во всяком зле, бедствии и порче.
  rationale: 'Внесена единственная смысловая правка: «развращении» заменено на «порче», чтобы не сужать значение διαφθορά. Остальная формулировка точно и естественно передаёт греческий текст, включая неявный референт αὐτοῦ и отделённость ἀπὸ Κυρίου.'
