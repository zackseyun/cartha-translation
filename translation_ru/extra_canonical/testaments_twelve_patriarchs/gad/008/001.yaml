  source_fidelity: 'Требуется исправление вида глагола: греч. Εἴπατε — аористное повелительное наклонение («скажите»), а не настоящее «говорите». Остальные основные соответствия сохранены: «Иуда и Левий» следуют порядку греческого текста; τιμήσωσιν адекватно передано как «почитали»; оба дополнения при «спасении» («вам» и «Израилю») не опущены.'
  naturalness: «И вы также скажите это своим детям» — естественная для современного литературного русского форма прямого завещательного наставления. «Воздвигнет вам спасение для Израиля» сохраняет несколько напряжённое сочетание адресатов, наличествующее в исходном тексте; стилистически оно допустимо и не требует интерпретирующей перестройки.
  terminology: '«Господь», «спасение», «Иуда», «Левий» переданы корректно и нейтрально. Перевод не вносит конфессионального отождествления Господа со «спасением»: Κύριος остаётся субъектом, σωτηρίαν — дополнением.'
