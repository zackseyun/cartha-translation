  text: Speak these things, you also, to your children, so that they may honor Judah and Levi; for from them the Lord will raise up for you salvation for Israel.
translation:
  language: ru
  text: И вы также скажите это своим детям, чтобы они почитали Иуду и Левия, потому что от них Господь воздвигнет вам спасение для Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴπατε
  choice: говорите
  rationale: Повелительное наклонение передано естественной формой наставления; настоящее несовершенного вида уместно для продолжающейся обязанности.
- source_word: τιμήσωσιν
  choice: почитали
  rationale: Передаёт уважение и оказываемую честь, не сужая смысл до простого послушания.
- source_word: ἀνατελεῖ
  choice: воздвигнет
  rationale: Сохраняет образ возникновения или появления спасения по действию Господа; русское «воздвигнет» естественнее буквального «взрастит» при дополнении «спасение».
- source_word: σωτηρίαν
  choice: спасение
  rationale: Прямой и богословски нейтральный эквивалент, сохраняющий широту значения избавления и спасения.
theological_decisions:
- issue: Источник спасения и роль Иуды и Левия
  choice: «от них Господь воздвигнет… спасение»
  alternative: «из их среды явится Господь — спасение Израиля»
  rationale: Греческая синтаксическая форма представляет «Господа» субъектом действия, а «спасение» — его объектом; перевод не отождествляет Господа со спасением вопреки данной грамматике.
- issue: Соотношение «вам» и «для Израиля»
  choice: 'сохранены оба определения: «вам… для Израиля»'
  alternative: опустить «вам» как возможный вариант текста или слить адресатов с Израилем
  rationale: Так передаётся засвидетельствованная формулировка и сохраняется её некоторая смысловая напряжённость без скрытого устранения одного из элементов.
translation_notes:
  register: 'Современный литературный русский язык с достоинством завещательного наставления. Порядок имён следует предоставленному греческому тексту: Иуда, затем Левий. Добавлений из более пространной редакции стиха нет.'
