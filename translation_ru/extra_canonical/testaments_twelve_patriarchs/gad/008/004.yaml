  text: And drawing up his feet, he fell asleep in peace.
translation:
  language: ru
  text: И, подняв ноги, он уснул в мире.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάρας τοὺς πόδας αὐτοῦ
  choice: поджав ноги
  rationale: 'Оборот описывает предсмертный жест: он подтянул или собрал ноги, вероятно на ложе. «Поджав ноги» естественно по-русски и не добавляет отсутствующего в данном греческом тексте упоминания ложа.'
- source_word: ἐκοιμήθη
  choice: уснул
  rationale: Сохранена эвфемистическая метафора сна, обозначающая смерть, без её разъясняющей замены словом «умер».
- source_word: ἐν εἰρήνῃ
  choice: мирно
  rationale: Наречие естественно передаёт состояние покоя при смерти; буквальное «в мире» в современном русском могло бы ошибочно пониматься как противопоставление войне.
theological_decisions:
- issue: Образ сна как обозначение смерти
  choice: уснул
  alternative: умер
  rationale: Греческий текст говорит «уснул»; сохранение образа не навязывает толкования о состоянии после смерти и удерживает смысловую окраску оригинала.
translation_notes:
  register: Краткая, достойная повествовательная формулировка на современном литературном русском. Союз «И» сохраняет связь с предшествующим повествованием; местоимение «он» делает субъект явным и соответствует английскому консультационному слою.
