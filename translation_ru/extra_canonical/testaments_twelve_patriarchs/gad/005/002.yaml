base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/002.yaml
  text: Therefore I say these things to you from experience, my children, so that you may drive out devilish hatred and cling to the love of God.
translation:
  language: ru
  text: Итак, я говорю вам это по собственному опыту, дети мои, чтобы вы изгнали дьявольскую ненависть и прилепились к любви Божьей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ πείρας
  choice: по собственному опыту
  rationale: Передаёт указание на личный опыт говорящего естественным современным русским выражением.
- source_word: ἐξώσητε
  choice: изгнали
  rationale: Сохраняет сильное значение удаления, вытеснения ненависти, а не просто отказа от неё.
- source_word: τὸ μῖσος τὸ διαβολικόν
  choice: дьявольскую ненависть
  rationale: Передаёт определение διαβολικόν без искусственного артиклевого оттенка; формулировка сохраняет возможный смысл ненависти как дьявольской по происхождению или характеру.
- source_word: κολληθῆτε
  choice: прилепились
  rationale: Сохраняет образ тесной и стойкой привязанности, выраженный греческим глаголом.
- source_word: τῇ ἀγάπῃ τοῦ Θεοῦ
  choice: к любви Божьей
  rationale: 'Естественно передаёт родительный оборот, не устраняя его возможную смысловую широту: любовь Бога или любовь, направленная к Богу.'
theological_decisions:
- issue: Значение родительного оборота τοῦ Θεοῦ при ἀγάπῃ
  choice: любви Божьей
  alternative: любви к Богу / Божьей любви к людям
  rationale: Греческий оборот допускает неоднозначность; русское «любовь Божья» сохраняет её и не навязывает только объективное или субъектное прочтение.
- issue: Характер определения διαβολικόν
  choice: дьявольскую ненависть
  alternative: ненависть дьявола
  rationale: Прилагательное характеризует ненависть, но не требует однозначно понимать её как принадлежащую дьяволу; прилагательная конструкция точнее сохраняет исходную напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Обращение «дети мои» и глагол «прилепились» сохраняют библейский регистр, оставаясь понятными современному читателю.
