  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/011.yaml
  text: Since, then, my liver was pitilessly set against Joseph, I too, suffering in my liver, was judged pitilessly for ten years.
translation:
  language: ru
  text: 11. Итак, поскольку моя печень[a] была безжалостно настроена против Иосифа, меня, страдающего печенью, десять лет безжалостно судили — всё то время, пока я враждовал с Иосифом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В древних представлениях печень могла считаться средоточием сильных чувств и внутренних побуждений. Здесь повтор образа печени связывает вражду Гада с его страданием.
    reason: Поясняет непривычное современному читателю употребление «печени» как образа внутренних побуждений, не уточняя характер телесного страдания сверх текста.
lexical_decisions:
- source_word: τὰ ἥπατά μου / τῷ ἥπατι
  choice: моя печень / печенью
  rationale: Сохранён конкретный образ печени как средоточия внутренних чувств и одновременно поражённого органа; это передаёт намеренную связь между грехом и наказанием.
- source_word: ἀνιλέως
  choice: безжалостно
  rationale: Одно и то же наречие сохранено в обеих частях фразы, чтобы передать словесное соответствие между отношением Гада к Иосифу и постигшим его судом.
- source_word: ἐπὶ χρόνους δέκα
  choice: десять лет
  rationale: В данном хронологическом контексте χρόνοι обозначает годы; принято чтение, отражённое в исправленном консультационном слое, а не прежнее «десять месяцев».
- source_word: ἐπείχον τῷ Ἰωσήφ
  choice: враждовал с Иосифом
  rationale: Передано устойчивое враждебное отношение к Иосифу; буквальная калька с глагола была бы неясна по-русски.
theological_decisions:
- issue: Воздаяние, соответствующее враждебности Гада
  choice: Сохранить параллель «безжалостно… безжалостному» и временное соответствие
  alternative: Сгладить повтор и опустить заключительную временную фразу, как в английском консультационном тексте
  rationale: Греческий текст подчёркивает меру воздаяния лексическим повтором и заключением καθ’ ὃν χρόνον ἐπείχον τῷ Ἰωσήφ; перевод не должен устранять эту богословскую напряжённость.
translation_notes:
  register: Современный литературный русский язык с сохранением древнего телесного образа. Синтаксис сделан естественным, но повтор «безжалостно» и заключительная фраза о продолжительности вражды сохранены по греческому тексту.
