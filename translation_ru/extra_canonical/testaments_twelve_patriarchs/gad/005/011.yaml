  - severity: low
    issue: Избыточная конкретизация в сноске
    rationale: Слова «постигшей его болезнью» интерпретируют τῷ ἥπατι πάσχων как определённую болезнь. Текст говорит о страдании, связанном с печенью, но не устанавливает диагноз.
