source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 8. *Καὶ οὐκ ἔμαθεν ἀπὸ ἀνθρώπων τοῦτο ἀλλ᾽ οἶδε διὰ μετανοίας τοὺς ἐπιστρέφοντας δέχεσθαι⁵⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/008.yaml
  text: And he did not learn this from men, but through repentance he knows how to receive those who turn back.
translation:
  language: ru
  text: И он научился этому не от людей, но умеет через покаяние принимать тех, кто обращается.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но через покаяние знает, как принимать тех, кто возвращается». Греческая фраза допускает разные способы связи слов «через покаяние».'
    reason: Сохраняет синтаксическую неоднозначность διὰ μετανοίας и отражает значение οἶδε с инфинитивом как знания способа действия или умения, не вводя значения долженствования.
lexical_decisions:
- source_word: οὐκ ἔμαθεν ἀπὸ ἀνθρώπων
  choice: научился этому не от людей
  rationale: Сохраняет прямое значение греческой конструкции и естественный порядок слов в современном русском языке.
- source_word: διὰ μετανοίας
  choice: через покаяние
  rationale: Передаёт значение средства или пути, не устраняя возможной смысловой связи как с принимающим, так и с обращающимися.
- source_word: τοὺς ἐπιστρέφοντας
  choice: тех, кто обращается
  rationale: Настоящее причастие передаёт процесс возвращения или обращения; «обращается» сохраняет религиозный оттенок и не уточняет без основания, от чего или к кому происходит обращение.
- source_word: δέχεσθαι
  choice: принимать
  rationale: Нейтрально передаёт идею принятия без добавления более узких значений вроде прощения или восстановления в общине.
theological_decisions:
- issue: Синтаксическая связь выражения διὰ μετανοίας
  choice: Сохранена формулировка «через покаяние», допускающая неоднозначность связи.
  alternative: «принимать тех, кто возвращается через покаяние» или «благодаря покаянию умеет принимать возвращающихся»
  rationale: Греческий порядок допускает некоторую неоднозначность; текст не должен без необходимости определять, чьё покаяние имеется в виду и к какому именно элементу относится предложная группа.
- issue: Модальное значение конструкции οἶδε ... δέχεσθαι
  choice: «знает, что ... следует принимать»
  alternative: «умеет принимать» / «знает, как принимать»
  rationale: Буквальное «знает принимать» по-русски неестественно. Выбранная формулировка передаёт знание надлежащего образа действия, хотя греческий оборот также может пониматься как способность или умение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но общедоступным библейским регистром. Избегаются конфессионально нагруженные уточнения.
