  text: 4. *Οὐ καταλαλεῖ³⁷ *ἀνδρὸς ὁσίου³⁸, ἐπειδὴ ὁ φόβος τοῦ Θεοῦ³⁹ *οἰκεῖ ἐν αὐτῷ⁴⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/004.yaml
  text: He does not speak against a holy man, because the fear of God dwells in him.
translation:
  language: ru
  text: Он не злословит благочестивого человека, потому что в нём обитает страх Божий.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλαλεῖ
  choice: злословит
  rationale: Глагол означает говорить против кого-либо, порочить или злословить; «злословит» естественно и ёмко передаёт этот смысл.
- source_word: ἀνδρὸς ὁσίου
  choice: благочестивого человека
  rationale: ὅσιος обозначает человека, преданного Богу и благочестивого; «человека» здесь по-русски естественнее буквального «мужа» и не усиливает гендерную специфику сверх контекста.
- source_word: ὁ φόβος τοῦ Θεοῦ
  choice: страх Божий
  rationale: Устойчивое библейское выражение сохраняет религиозный смысл почтительного страха перед Богом.
- source_word: οἰκεῖ ἐν αὐτῷ
  choice: обитает в нём
  rationale: Сохраняет образ постоянного внутреннего пребывания, выраженный глаголом οἰκέω.
theological_decisions:
- issue: К кому относится местоимение αὐτῷ
  choice: Сохранена неоднозначность русского «в нём»
  alternative: 'Явно отнести страх Божий к субъекту: «в самом злословящем» или к благочестивому человеку'
  rationale: Греческая форма допускает формальную соотнесённость с ближайшим «благочестивым человеком», тогда как смысловой ход может указывать на субъекта; русский текст сохраняет исходную неоднозначность и не навязывает толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис краткий и близкий к греческому; термин «страх Божий» сохранён как узнаваемое библейское выражение.
