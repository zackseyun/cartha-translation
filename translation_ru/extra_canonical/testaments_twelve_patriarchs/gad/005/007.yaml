source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Ἡ γὰρ κατὰ Θεὸν ἀληθὴς⁵¹ μετάνοια⁵² [ἀναιρεῖ *τὴν ἄγνοιαν⁵³ καὶ] φυγαδεύει τὸ σκότος, καὶ φωτίζει τοὺς ὀφθαλμοὺς καὶ γνῶσιν παρέχει τῇ ψυχῇ, καὶ ὁδηγεῖ *τὸ διαβούλιον⁵⁴ *πρὸς σωτηρίαν⁵⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/007.yaml
  text: For true repentance according to God [removes ignorance and] puts darkness to flight, enlightens the eyes, gives knowledge to the soul, and guides the mind toward salvation.
translation:
  language: ru
  text: Ибо истинное покаяние по Богу [устраняет неведение и] обращает тьму в бегство, просвещает очи, даёт душе знание и направляет разум ко спасению.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ κατὰ Θεὸν ἀληθὴς μετάνοια
  choice: истинное покаяние по Богу
  rationale: Сохранена необычная, но богословски значимая конструкция κατὰ Θεόν без её истолкования как просто «угодного Богу» покаяния.
- source_word: ἀναιρεῖ τὴν ἄγνοιαν
  choice: устраняет неведение
  rationale: Передаёт смысл устранения отсутствия знания; слова заключены в квадратные скобки вслед за исходным критическим текстом.
- source_word: φυγαδεύει τὸ σκότος
  choice: обращает тьму в бегство
  rationale: Сохраняет яркий образ глагола φυγαδεύει, буквально обозначающего принуждение к бегству.
- source_word: φωτίζει τοὺς ὀφθαλμούς
  choice: просвещает очи
  rationale: Передан традиционный образ внутреннего прозрения; «очи» поддерживает достойный библейский регистр без архаизации всего стиха.
- source_word: γνῶσιν παρέχει τῇ ψυχῇ
  choice: даёт душе знание
  rationale: Прямая и естественная передача конструкции, не уточняющая вид знания сверх сказанного в греческом тексте.
- source_word: τὸ διαβούλιον
  choice: разум
  rationale: В данном контексте обозначает внутреннюю рассудительную способность или помышление; «разум» естественнее по-русски и не превращает слово в «намерение» или «цель».
- source_word: πρὸς σωτηρίαν
  choice: ко спасению
  rationale: Сохраняет направительное значение πρός и богословски открытое значение σωτηρία.
theological_decisions:
- issue: Значение выражения κατὰ Θεόν
  choice: по Богу
  alternative: угодное Богу
  rationale: 'Более формальная передача сохраняет возможную смысловую широту: соответствие Богу, Божьей воле или Божьему образцу, не выбирая одно толкование.'
- issue: Характер спасения в πρὸς σωτηρίαν
  choice: ко спасению
  alternative: к избавлению
  rationale: «Спасение» сохраняет обычную религиозную и возможную эсхатологическую широту σωτηρία, не ограничивая её временным избавлением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм греческого перечня сохранён. Квадратные скобки воспроизводят текстуальную неуверенность источника и не являются сноской.
