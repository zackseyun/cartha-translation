- from: Итак, ненависть — зло, потому что она постоянно держится лжи и выступает против истины; малое она делает великим, свет представляет тьмой, а сладкое называет горьким. Она учит клевете, разжигает гнев и войну и наполняет сердце дерзостью и всякой алчностью, злом и дьявольским ядом.
  to: Итак, ненависть — зло, потому что она непрестанно связана с ложью, говоря против истины; малое она делает великим, свет представляет тьмой, а сладкое называет горьким. Она учит клевете, разжигает гнев и войну и наполняет сердце дерзостью, всякой алчностью, всяким злом и дьявольским ядом.
