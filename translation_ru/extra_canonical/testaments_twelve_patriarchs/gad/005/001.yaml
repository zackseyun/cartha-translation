base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/001.yaml
  text: Hatred, then, is evil, because it continually associates with falsehood, speaking against the truth; it makes small things great, presents light as darkness, and calls the sweet bitter. It teaches slander, stirs up wrath and war, and fills the heart with insolence and every greed, with evils and a devilish poison.
translation:
  language: ru
  text: Итак, ненависть — зло, потому что она непрестанно связана с ложью, говоря против истины; малое она делает великим, свет представляет тьмой, а сладкое называет горьким. Она учит клевете, разжигает гнев и войну и наполняет сердце дерзостью, всякой алчностью, всяким злом и дьявольским ядом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μῖσος
  choice: ненависть
  rationale: Прямой и естественный русский эквивалент, сохраняющий нравственную силу исходного понятия.
- source_word: ἐνδελεχεῖ συνεχῶς τῷ ψεύδει
  choice: постоянно держится лжи
  rationale: Передаёт устойчивую, непрерывную связь ненависти с ложью и звучит естественно по-русски.
- source_word: τὰ μικρὰ μεγάλα ποιεῖ
  choice: малое она делает великим
  rationale: Сохраняет образную антитезу оригинала, не сводя её лишь к идее преувеличения.
- source_word: συκοφαντίαν
  choice: клевете
  rationale: В данном нравственном перечне слово обозначает злонамеренное ложное обвинение или очернение.
- source_word: ὕβριν
  choice: дерзостью
  rationale: Передаёт вызывающую, надменную и оскорбительную сторону ὕβρις без чрезмерного сужения смысла.
- source_word: πλεονεξίαν
  choice: алчностью
  rationale: Выражает ненасытное стремление иметь больше; определение πᾶσαν передано как «всякой».
- source_word: ἰοῦ διαβολικοῦ
  choice: дьявольским ядом
  rationale: Сохраняет сильную метафору и явную характеристику яда как дьявольского.
theological_decisions:
- issue: Персонификация ненависти
  choice: Сохранить ненависть как действующий субъект во всём стихе
  alternative: Передать безлично как последствия чувства ненависти
  rationale: 'Греческий текст последовательно приписывает ненависти действия: она говорит, делает, называет, учит, разжигает и наполняет.'
- issue: Связь выражения κακῶν καὶ ἰοῦ διαβολικοῦ с наполнением сердца
  choice: 'Передать как дополнительные составляющие того, чем наполняется сердце: «злом и дьявольским ядом»'
  alternative: Понимать как пояснение или характеристику предшествующих пороков
  rationale: Такое чтение соответствует общей структуре перечня и не вводит отсутствующей в тексте богословской конкретизации.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной литературы. Сохранены риторические противопоставления «малое — великое», «свет — тьма», «сладкое — горькое» и последовательная персонификация ненависти; синтаксис слегка упорядочен ради ясности.
