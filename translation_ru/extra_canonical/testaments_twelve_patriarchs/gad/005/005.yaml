  text: 5. Φοβούμενος γὰρ⁴¹ μὴ προσκρούσαι⁴² Κυρίῳ⁴³, οὐ θέλει τὸ καθόλου⁴⁴ οὐδὲ⁴⁵ ἕως ἐννοίας⁴⁶ ἀδικῆσαι ἄνθρωπον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/005.yaml
  text: For, fearing lest he offend the Lord, he does not wish at all, not even in thought, to wrong a man.
translation:
  language: ru
  text: Ибо, боясь согрешить против Господа, он вовсе не желает — даже в мыслях — поступить несправедливо с человеком.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβούμενος
  choice: боясь
  rationale: Передаёт причинно-мотивирующее причастие и сохраняет прямую связь со страхом перед Господом.
- source_word: προσκρούσαι Κυρίῳ
  choice: согрешить против Господа
  rationale: В данном нравственно-религиозном контексте προσκρούω с дательным означает провиниться перед Богом; буквальное «преткнуться о Господа» по-русски исказило бы смысл.
- source_word: τὸ καθόλου οὐδὲ ἕως ἐννοίας
  choice: ни за что … даже в мыслях
  rationale: 'Естественно выражает усиленное отрицание: нежелание причинить зло вообще, включая внутреннее намерение или помысел.'
- source_word: ἀδικῆσαι ἄνθρωπον
  choice: обидеть человека
  rationale: ἀδικέω охватывает несправедливое причинение вреда или неправду по отношению к человеку; «обидеть» здесь кратко и понятно, хотя имеет несколько более узкий бытовой оттенок.
theological_decisions:
- issue: Характер проступка, выраженного προσκρούσαι Κυρίῳ
  choice: согрешить против Господа
  alternative: провиниться перед Господом
  rationale: «Согрешить против» ясно передаёт религиозно-нравственную направленность проступка, не вводя специального конфессионального толкования.
- issue: Объём внутреннего запрета в ἕως ἐννοίας
  choice: даже в мыслях
  alternative: даже в намерении
  rationale: Греческое ἔννοια допускает мысль, замысел или намерение. «В мыслях» сохраняет более широкий и естественный смысл, не сводя выражение только к сформированному намерению.
