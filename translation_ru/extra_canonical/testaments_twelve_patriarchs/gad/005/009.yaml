source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 9. Ἐπήγαγε γάρ⁴¹ μοι ὁ Θεὸς νόσον ἥπατος, καὶ εἰ μὴ⁵⁷ *αἱ εὐχαὶ⁵⁸ τοῦ πατρός μου⁵⁹ *ἐβοήθησάν μοι⁶⁰, ὀλίγου δεῖν⁶¹ *ἐξέλειπε τὸ πνεῦμα μου⁶².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/009.yaml
  text: For God brought upon me a disease of the liver, and if the prayers of my father had not helped me, my spirit would almost have failed.
translation:
  language: ru
  text: Ибо Бог наслал на меня болезнь печени, и, если бы молитвы моего отца не помогли мне, дух мой едва не угас бы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπήγαγε
  choice: навёл
  rationale: Передаёт значение «навёл, ниспослал на кого-либо», сохраняя прямое указание на действие Бога без ослабления причинной связи.
- source_word: νόσον ἥπατος
  choice: болезнь печени
  rationale: Прямой и естественный современный эквивалент греческого обозначения заболевания печени.
- source_word: αἱ εὐχαὶ τοῦ πατρός μου
  choice: молитвы моего отца
  rationale: Сохраняет множественное число εὐχαί и принадлежность молитв отцу говорящего.
- source_word: ἐβοήθησάν μοι
  choice: не помогли мне
  rationale: В условной конструкции передаёт обычное значение глагола «помогать, приходить на помощь».
- source_word: ὀλίγου δεῖν ἐξέλειπε τὸ πνεῦμα μου
  choice: дух мой едва не оставил бы меня
  rationale: Передаёт близость смерти и образ ухода духа, не сводя πνεῦμα однозначно к дыханию или жизни.
theological_decisions:
- issue: Прямое участие Бога в болезни Гада
  choice: Бог навёл на меня болезнь
  alternative: меня постигла посланная Богом болезнь
  rationale: Греческий текст прямо называет Бога подлежащим при ἐπήγαγε; перевод сохраняет это напряжённое утверждение и не смягчает его без текстовых оснований.
- issue: Роль молитв отца
  choice: молитвы моего отца… помогли мне
  alternative: по молитвам моего отца я получил помощь
  rationale: Сохранена грамматическая персонификация молитв как действующего средства помощи, без добавления объяснения о механизме их действия.
- issue: Значение πνεῦμα в контексте близкой смерти
  choice: дух мой… оставил бы меня
  alternative: я едва не испустил дух
  rationale: Выбран вариант, сохраняющий отдельное упоминание «духа» и образ исходного текста, не уточняя сверх текста антропологический смысл термина.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Порядок слов «дух мой» поддерживает достоинство и ритм фразы; условное наклонение последовательно выражено в обеих частях нереального условия.
