  text: 10. Δι’ ὧν γὰρ δ⁶³ ἄνθρωπος παρανομεῖ, δι’ ἐκείνων⁶⁴ κολάζεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/010.yaml
  text: For by the very things through which a man transgresses, through those he is punished.
translation:
  language: ru
  text: Ибо чем человек преступает закон, тем и наказывается.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρανομεῖ
  choice: преступает закон
  rationale: Передаёт значение нарушения закона или установленных норм, сохраняя явную связь греческого глагола с νόμος («закон»).
- source_word: κολάζεται
  choice: наказывается
  rationale: Естественный русский эквивалент страдательной формы со значением наказания или кары.
- source_word: δι’ ὧν … δι’ ἐκείνων
  choice: через то самое, посредством чего … он и
  rationale: Сохраняет инструментально-причинную соотнесённость греческой конструкции и подчёркивает, что средством наказания становится то, посредством чего совершено нарушение.
theological_decisions:
- issue: Характер связи между проступком и наказанием
  choice: Сохранена формулировка, согласно которой человек наказывается через то, посредством чего нарушает закон.
  alternative: 'Перевести толковательно: «чем человек грешит, тем и бывает наказан».'
  rationale: Исходный текст говорит не общо о грехе, а использует παρανομεῖ и повторную конструкцию διά, поэтому перевод не уточняет механизм воздаяния сверх сказанного.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая структура оригинала сохранена. Выражение «преступает закон» несколько возвышенное, но ясное и уместное для завещательного наставления.
