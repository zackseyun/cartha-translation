source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 3. Ἡ²⁵ δικαιοσύνη²⁶ ἐκβάλλει τὸ μῖσος²⁷, ἡ ταπείνωσις ἀναιρεῖ *τὸ ζῆλος²⁸. ὁ γὰρ δίκαιος καὶ ταπεινῶς αἰδεῖται ποιῆσαι ἄδικον²⁹, ⸀οὐχ ὑπ᾽ ἄλλου³⁰ καταγινωσκόμενος³¹ ἀλλ᾽³² ὑπὸ τῆς ἰδίας καρδίας³³, ὅτι Κύριος ἐπισκοπεῖ³⁴ *τὴν ψυχὴν³⁵ αὐτοῦ³⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/003.yaml
  text: Righteousness casts out hatred, and humility removes jealousy. For the righteous man, being humble, is ashamed to do what is unjust, not because he is condemned by another, but by his own heart, because the Lord watches over his soul.
translation:
  language: ru
  text: 'Праведность изгоняет ненависть, а смирение устраняет зависть. Ведь праведный, будучи смиренным, стыдится поступать несправедливо: его осуждает не кто-то другой, а собственное сердце, ибо Господь наблюдает за его душой.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύνη
  choice: праведность
  rationale: Передаёт нравственно-религиозный смысл греческого существительного и сохраняет связь с δίκαιος далее в стихе.
- source_word: ταπείνωσις
  choice: смирение
  rationale: Естественный для современного русского языка эквивалент в контексте добродетели; не сводит значение к унижению.
- source_word: τὸ ζῆλος
  choice: зависть
  rationale: Хотя ζῆλος может означать также ревность или рвение, параллелизм с ненавистью и контекст пороков поддерживают отрицательное значение «зависть».
- source_word: αἰδεῖται
  choice: стыдится
  rationale: Сохраняет значение внутреннего нравственного стыда или совестливого удержания от неправды.
- source_word: καταγινωσκόμενος
  choice: осуждает
  rationale: В среднем/страдательном употреблении означает признание виновным или осуждение; конструкция противопоставляет внешний суд внутреннему свидетельству сердца.
- source_word: ἐπισκοπεῖ
  choice: наблюдает за
  rationale: Передаёт идею внимательного надзора или попечения, не уточняя однозначно, идёт ли речь прежде всего о суде или заботе.
theological_decisions:
- issue: Характер Божьего действия в ἐπισκοπεῖ
  choice: Господь наблюдает за его душой
  alternative: Господь печётся о его душе / испытывает его душу
  rationale: Греческий глагол допускает оттенки надзора, посещения и попечения. Нейтральное «наблюдает за» сохраняет напряжение между Божьим вниманием, заботой и судом.
- issue: Источник нравственного осуждения
  choice: его осуждает собственное сердце
  alternative: он осуждён собственным сердцем
  rationale: Активная русская конструкция яснее передаёт греческое ὑπὸ τῆς ἰδίας καρδίας, сохраняя сердце как внутреннего обличителя, а не заменяя его понятием совести.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной мудрости. Сохранён параллелизм первых двух утверждений и повтор корня «праведность — праведный». Синтаксис слегка развернут ради ясного противопоставления внешнего осуждения и суда собственного сердца.
