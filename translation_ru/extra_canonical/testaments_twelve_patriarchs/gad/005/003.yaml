review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан точно: δικαιοσύνη/δίκαιος сохранены как «праведность/праведный», ταπείνωσις — как «смирение», а αἰδεῖται — как внутренний нравственный стыд. Однако в противопоставлении с καταγινωσκόμενος греческий текст говорит не «потому, что его осуждает собственное сердце», а «не будучи осуждаем другим, но [будучи осуждаем] собственным сердцем». Следует сохранить именно антитезу внешнего и внутреннего обличения.'
  naturalness: Текст в целом литературен и ясен. Замена «а потому, что» на прямое «а собственным сердцем» делает фразу одновременно ближе к греческому синтаксису и естественнее по-русски.
  terminology: «Зависть» для τὸ ζῆλος допустима в данном контексте пороков; «смирение», «праведность», «Господь» и «душа» уместны. «Наблюдает за» корректно передаёт ἐπισκοπεῖ, не снимая возможных оттенков надзора и попечения.
  issues:
  - severity: medium
    issue: 'Противопоставление в конструкции οὐχ ὑπ᾽ ἄλλου ... ἀλλ᾽ ὑπὸ τῆς ἰδίας καρδίας передано как две причинные придаточные части: «не потому, что ... а потому, что ...».'
    rationale: Греческий текст противопоставляет источник осуждения, а не две причины стыда. Формулировка с «а потому, что» несколько перестраивает логическую связь и ослабляет прямую антитезу «не другим, а собственным сердцем».
