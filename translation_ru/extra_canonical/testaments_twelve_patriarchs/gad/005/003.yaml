revisions:
- from: Праведность изгоняет ненависть, а смирение устраняет зависть. Ведь праведный, будучи смиренным, стыдится поступать несправедливо — не потому, что его осуждает кто-то другой, а потому, что его осуждает собственное сердце, ибо Господь наблюдает за его душой.
  to: 'Праведность изгоняет ненависть, а смирение устраняет зависть. Ведь праведный, будучи смиренным, стыдится поступать несправедливо: его осуждает не кто-то другой, а собственное сердце, ибо Господь наблюдает за его душой.'
  rationale: Исправлена только логико-синтаксическая передача противопоставления «не другим, но собственным сердцем». Остальные решения сохранены, поскольку они верно и естественно передают греческий текст и его сдержанный нравственно-религиозный регистр.
