  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/008.yaml
  text: And beyond this I was angry with Joseph until the day of his being sold.
translation:
  language: ru
  text: 8. И сверх того я гневался на Иосифа до дня, когда его продали.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ τοῦτο
  choice: сверх того
  rationale: 'Передаёт добавочное основание или усиление: «помимо этого / более того», не уточняя того, чего сам греческий текст здесь не поясняет.'
- source_word: ἐνεκότουν τῷ Ἰωσήφ
  choice: я гневался на Иосифа
  rationale: Глагол обозначает затаённый гнев или неприязнь; управление с дательным естественно передаётся по-русски конструкцией «гневаться на».
- source_word: ἕως ἡμέρας διαπράσεως αὐτοῦ
  choice: до дня, когда его продали
  rationale: Контекстуально διαπράσεως относится к продаже Иосифа; придаточная конструкция звучит естественнее буквального отглагольного оборота «до дня его продажи» и сохраняет страдательное значение.
