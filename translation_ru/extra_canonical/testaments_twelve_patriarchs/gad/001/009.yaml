  verdict: revise
  source_fidelity: 'Первая часть стиха в целом передана точно. Однако «слышать об Иосифе» добавляет значение «о нём», которого греческое οὔτε δι᾽ ἀκοῆς ... ἰδεῖν τὸν Ἰωσήφ не выражает; речь о том, что Гад не хотел ни слышать, ни видеть самого Иосифа. Заключительное предложение передано согласно английской POB-аудиторской версии и естественному контексту: отец верил Иосифу во всём, что тот говорил ему.'
  naturalness: Текст звучит естественно и сохраняет умеренно возвышенный повествовательный регистр. Замена «слышать об Иосифе» на «слышать Иосифа» устраняет смысловое добавление, хотя сочетание намеренно отражает необычную парную конструкцию оригинала.
  terminology: «Дух ненависти», «обличил нас прямо в лицо», «скот» и имена Иосиф, Иуда выбраны удачно. Неоднозначность статуса «духа ненависти» и выражения «без Иуды» не снимается. Аппаратные номера в критическом греческом издании не являются требующими переноса переводческими сносками; специальных сносок не требуется.
  issues:
