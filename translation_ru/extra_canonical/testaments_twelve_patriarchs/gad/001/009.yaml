  text: 9. Καὶ τὸ πνεῦμα τοῦ⁵⁹ μίσους ἦν ἐν ἐμοί, καὶ⁶⁰ οὐκ ἤθελον⁶¹ *οὔτε †δι᾽ ἀκοῆς οὔτε δι᾽ ὀφθαλμῶν⁶² ἰδεῖν τὸν Ἰωσήφ, ὅτι⁶³ κατὰ πρόσωπον⁶⁴ ἤλεγξεν ἡμᾶς Γλέγων¹⁶⁵, ὅτι χωρὶς⁶⁶ Ἰούδα⁶⁷ ἠσθίομεν *τὰ θρέμματα⁶⁸. *πάντα γὰρ⁶⁹ ὅσα ἔλεγε *τῷ πατρὶ⁷⁰ ἐπείθετο αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/009.yaml
  text: And the spirit of hatred was in me, and I did not want to perceive Joseph, neither through hearing nor through sight, because he rebuked us to our face, saying that we were eating the livestock without Judah. For in everything he said to our father, he believed him.
translation:
  language: ru
  text: 9. И дух ненависти был во мне, и я не хотел ни слышать Иосифа, ни видеть его, потому что он прямо в лицо обличил нас, сказав, что мы ели скот без Иуды. Ведь отец верил всему, что Иосиф ему говорил.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ μίσους
  choice: дух ненависти
  rationale: Формально и естественно передаёт греческое выражение, сохраняя представление о ненависти как действующей в человеке силе.
- source_word: οὔτε δι᾽ ἀκοῆς οὔτε δι᾽ ὀφθαλμῶν ἰδεῖν τὸν Ἰωσήφ
  choice: не хотел ни слышать об Иосифе, ни видеть его
  rationale: Передаёт необычную греческую конструкцию через естественную русскую парную формулу, сохраняя оба канала восприятия — слух и зрение.
- source_word: κατὰ πρόσωπον ἤλεγξεν ἡμᾶς
  choice: прямо в лицо обличил нас
  rationale: Сохраняет как открытый, личный характер упрёка, так и более сильное значение глагола ἐλέγχω — «обличать», а не просто «упрекать».
- source_word: χωρὶς Ἰούδα
  choice: без Иуды
  rationale: 'Буквальная передача сохраняет неуточнённость: Иуда мог отсутствовать либо действие совершалось без его участия или согласия.'
- source_word: τὰ θρέμματα
  choice: скот
  rationale: Краткое и обычное русское обозначение домашних животных или стад в данном повествовательном контексте.
- source_word: ἐπείθετο αὐτῷ
  choice: верил всему, что Иосиф ему говорил
  rationale: Средняя форма πείθομαι здесь естественно означает доверие сообщению; явное называние отца и Иосифа устраняет неестественную для русского языка путаницу местоимений, не меняя смысла.
theological_decisions:
- issue: Статус «духа ненависти»
  choice: Сохранено буквальное «дух ненависти» без пояснения его природы.
  alternative: Передать как внутреннее чувство или настроение ненависти.
  rationale: Текст может подразумевать как персонифицированную духовную силу, так и овладевшее человеком расположение; перевод не должен заранее разрешать эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для обычного читателя; подлинная неоднозначность выражения «без Иуды» сохранена. Переведён только указанный стих 1:9, включая заключительное предложение греческого текста.
