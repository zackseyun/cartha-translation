  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/006.yaml
  text: And Joseph told our father that the sons of Zilpah and Bilhah were slaughtering the best of the livestock and eating them without the consent of Reuben and Judah.
translation:
  language: ru
  text: И Иосиф сказал нашему отцу, что сыновья Зелфы и Валлы закалывают отборный скот и едят его без согласия Рувима и Иуды.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θύουσι
  choice: закалывают
  rationale: В данном контексте речь идёт об убое скота для еды; «закалывают» сохраняет конкретность действия, не навязывая жертвенного смысла.
- source_word: τὰ θρέμματα τὰ καλὰ
  choice: лучший скот
  rationale: Естественно передаёт сочетание «хорошие/отборные выращенные животные» и соответствует контексту хозяйственного скота.
- source_word: παρὰ γνώμην
  choice: без согласия
  rationale: Оборот означает действие вопреки мнению или без одобрения названных лиц; здесь «без согласия» ясно и естественно по-русски.
- source_word: οἱ υἱοὶ Ζέλφας καὶ Βάλλας
  choice: сыновья Зелфы и Валлы
  rationale: Сохранены традиционные русские формы библейских имён и буквальное обозначение обеих родственных групп.
theological_decisions:
- issue: Возможный жертвенный оттенок глагола θύω
  choice: закалывают
  alternative: приносят в жертву
  rationale: Контекст непосредственно говорит об убое и последующем употреблении животных в пищу, но не указывает ясно на культовое жертвоприношение; поэтому жертвенный смысл не добавлен.
- issue: Отнесение παρὰ γνώμην к Рувиму и Иуде
  choice: без согласия Рувима и Иуды
  alternative: вопреки мнению Рувима и Иуды
  rationale: Греческий текст называет обоих; перевод сохраняет это чтение и не следует сокращённому варианту, где упомянут только Иуда.
translation_notes:
  register: Современный литературный русский язык, сдержанный повествовательный стиль. Формулировка близка к греческому тексту и при этом естественна для обычного читателя.
