  text: And he returned to Hebron to our father. And he made him recline near himself, because he loved him very much.
translation:
  language: ru
  text: И он вернулся в Хеврон к нашему отцу. И он велел ему возлечь рядом с собой, потому что очень любил его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: вернулся
  rationale: Передаёт обычное значение аориста ὑποστρέφω — возвращение к прежнему месту.
- source_word: ἀνέκλινεν αὐτὸν πλησίον αὐτοῦ
  choice: Отец велел ему возлечь рядом с собой
  rationale: Сохраняет каузативный смысл ἀνακλίνω («уложил / велел возлечь») и устраняет лишь неестественную для русского языка цепочку местоимений; субъект восстанавливается из ближайшего референта — отца.
- source_word: πάνυ
  choice: очень
  rationale: Естественно передаёт усилительное наречие «весьма, очень» в современном литературном русском.
theological_decisions:
- issue: Неявный субъект глаголов ἀνέκλινεν и ἠγάπα
  choice: «Отец велел… потому что очень любил»
  alternative: «Он велел ему возлечь… потому что очень любил его»
  rationale: В греческом субъект формально не назван, однако ближайший референт «наш отец» и смысл фразы указывают на отца. Явное существительное необходимо для ясности по-русски и не привносит богословского толкования.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским оттенком. «Возлечь» сохраняет реалии трапезы или почётного размещения рядом с отцом, не сводя выражение к современному «лечь».
