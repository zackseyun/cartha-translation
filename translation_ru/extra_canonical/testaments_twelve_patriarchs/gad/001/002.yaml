  text: 'Послушайте, дети мои: я был девятым сыном Иакова и был храбр, когда пас стада.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσατε
  choice: Послушайте
  rationale: Аорист повелительного наклонения передан естественным русским призывом, требующим внимания к последующей речи.
- source_word: ἐγενόμην ἔννατος υἱὸς τῷ Ἰακώβ
  choice: я был девятым сыном Иакова
  rationale: Греческая конструкция обозначает место Гада среди сыновей Иакова; русский родительный падеж передаёт это ясно и естественно, без добавления отсутствующего в тексте глагола «родился».
- source_word: ἀνδρεῖος
  choice: отважен
  rationale: Слово обозначает мужество и храбрость; «отважен» сохраняет прямую характеристику говорящего и звучит естественно в данном контексте.
- source_word: ἐπὶ τῶν ποιμνίων
  choice: охраняя стада
  rationale: Буквальное «над стадами» неестественно по-русски; деепричастная конструкция передаёт пастушескую сферу, в которой проявлялась отвага, не уточняя способ её проявления сверх контекста.
