base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/003.yaml
  text: I therefore guarded the flock by night; and when a lion or a wolf or any wild beast came against the flock, I would chase it down, and overtaking it I would seize its foot with my hand, and hurl it about a stone's throw, and so kill it.
translation:
  language: ru
  text: Поэтому я стерёг стадо ночью. И когда лев, волк или какой-нибудь дикий зверь шёл на стадо, я гнался за ним; настигнув его, я хватал его рукой за лапу, швырял его примерно на расстояние броска камня и убивал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφύλαττον ... τὸ ποίμνιον
  choice: стерёг стадо
  rationale: Имперфект передаёт продолжительное или обычное действие; «стерёг» естественно описывает охрану пастухом.
- source_word: ἐν τῇ νυκτί
  choice: по ночам
  rationale: В контексте повторяющихся действий русское «по ночам» естественно выражает обычное время несения стражи.
- source_word: ἐπὶ τὴν ποίμνην
  choice: нападал на стадо
  rationale: Буквально зверь «приходил на/против стада»; по контексту это враждебное приближение, естественно передаваемое глаголом «нападал».
- source_word: κατεδίωκον
  choice: гнался за ним
  rationale: Передаёт настойчивое преследование зверя без излишнего усиления.
- source_word: φθάνων ἐκράτουν
  choice: настигнув его, я хватал
  rationale: Причастие φθάνων обозначает достижение или настигание, а ἐκράτουν — схватывание и удерживание; конструкция сохраняет последовательность действий.
- source_word: τὸν πόδα αὐτοῦ
  choice: его ... за лапу
  rationale: Для льва, волка и другого зверя современное русское «лапа» естественнее буквального «нога».
- source_word: ἠκόντισα αὐτὸ ὡσεὶ λίθου βολήν
  choice: отбрасывал примерно на расстояние броска камня
  rationale: Сохраняется образ броска и приблизительность ὡσεὶ; речь идёт о расстоянии, сопоставимом с дальностью броска камня.
- source_word: ἀνῄρουν αὐτό
  choice: убивал
  rationale: В данном контексте ἀναιρέω означает умерщвлять; имперфект согласован с рядом повторявшихся действий.
