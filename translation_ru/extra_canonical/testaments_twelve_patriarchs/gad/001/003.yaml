revisions:
- from: Поэтому я стерёг стадо по ночам. И когда лев, волк или любой другой дикий зверь нападал на стадо, я гнался за ним; настигнув его, я хватал его рукой за лапу, отбрасывал примерно на расстояние броска камня и убивал.
  to: Поэтому я стерёг стадо ночью. И когда лев, волк или какой-нибудь дикий зверь шёл на стадо, я гнался за ним; настигнув его, я хватал его рукой за лапу, швырял его примерно на расстояние броска камня и убивал.
  rationale: Исправлены добавленное значение «другой», число обстоятельства времени и передача глагола броска. Сохранены повторительный характер основных имперфектов, последовательность действий, образ удерживания зверя за лапу и приблизительность ὡσεὶ.
