  text: 7. *Ἦν γὰρ ἰδὼν⁴⁶ ὅτι ἀρνα⁴⁷ ἐξειλάμην⁴⁸ *ἐκ τοῦ⁴⁹ στόματος τῆς⁵⁰ ἄρκου, κἀκείνην⁵¹ ἐθανάτωσα, *τὸν δὲ⁵² ἀρνὸν ἔθυσα· *περὶ οὗ ἐλυπούμην⁵³, ὅτι οὐκ *ἠδύνατο ζῆν⁵⁴, καὶ⁵⁵ ἐφάγομεν αὐτόν⁵⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/007.yaml
  text: For he had seen that I rescued a lamb from the mouth of a bear, and I killed her, but I slaughtered the lamb — over which I grieved, because it could not live — and we ate it.
translation:
  language: ru
  text: Ведь он видел, как я вырвал ягнёнка из пасти медведицы и убил её; ягнёнка же я заколол — скорбя о нём, потому что он не мог выжить, — и мы съели его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξειλάμην
  choice: вырвал
  rationale: Передаёт избавление ягнёнка непосредственно «из пасти» зверя; в данном контексте естественнее и выразительнее нейтрального «спас».
- source_word: ἄρκου
  choice: медведицы
  rationale: Последующее местоимение κἀκείνην стоит в женском роде и указывает на самку медведя.
- source_word: ἔθυσα
  choice: заколол
  rationale: В контексте вынужденного умерщвления и последующего употребления в пищу обозначает убой животного, а не обязательно культовое жертвоприношение.
- source_word: οὐκ ἠδύνατο ζῆν
  choice: не мог выжить
  rationale: Естественно передаёт невозможность ягнёнка остаться в живых вследствие полученных повреждений.
theological_decisions: []
