  text: So Joseph my brother was shepherding all the livestock with us for thirty days, and being young, he was weakened by the heat.
translation:
  language: ru
  text: Итак, Иосиф, брат мой, пас стадо вместе с нами тридцать дней и, будучи ещё юным, ослабел от зноя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίμαινε μεθ’ ἡμῶν
  choice: пас стадо вместе с нами
  rationale: Глагол означает пасти; дополнение в греческом не выражено, поэтому естественное русское «стадо» передаёт подразумеваемый объект без расширительного «весь скот».
- source_word: ἕως ἡμέρας τριάκοντα
  choice: тридцать дней
  rationale: Передано как обозначение продолжительности; буквальное «до тридцати дней» в данном контексте по-русски звучало бы двусмысленно.
- source_word: ὑπάρχων νέος
  choice: будучи ещё юным
  rationale: Сохраняет причинно-обстоятельственную связь причастного оборота и подчёркивает молодость Иосифа.
- source_word: ἐμαλακίσθη ὑπὸ τοῦ καύσωνος
  choice: ослабел от зноя
  rationale: В контексте телесного воздействия жары ἐμαλακίσθη означает «ослабел», а καύσων — сильный зной, палящий жар.
