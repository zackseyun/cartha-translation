  text: 'The copy of the testament of Gad, which he spoke to his sons in the one hundred and twenty-fifth year of his life, saying to them:'
translation:
  language: ru
  text: 'Список завещания Гада, которое он изложил своим сыновьям на сто двадцать пятом году своей жизни, сказав им:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: Список
  rationale: В заглавной формуле означает письменную копию или переписанный экземпляр; «список» сохраняет этот смысл и соответствует достоинству древнего текста.
- source_word: διαθήκης
  choice: завещания
  rationale: В данном жанровом контексте речь идёт о предсмертном наставлении, оформленном как завещание.
- source_word: ἐλάλησε
  choice: изложил
  rationale: Глагол буквально обозначает устную речь; «изложил» естественно передаёт произнесённое наставление, не превращая его в письменное авторство.
- source_word: ἐν τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: на сто двадцать пятом году своей жизни
  rationale: Точно воспроизводит возрастную формулу греческого текста и звучит естественно по-русски.
- source_word: λέγων αὐτοῖς
  choice: сказав им
  rationale: Сохраняет причастную вводную формулу перед последующей прямой речью.
