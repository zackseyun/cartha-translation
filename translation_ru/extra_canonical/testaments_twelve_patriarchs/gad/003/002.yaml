  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003/002.yaml
  text: Whatever the one who hates may do is abominable. If anyone does the law of the Lord, the hater does not praise him. If anyone fears the Lord and desires what is righteous, the hater does not love him.
translation:
  language: ru
  text: Что бы ни делал ненавидящий, всё это отвратительно. Если кто исполняет закон Господа, ненавидящий его не хвалит. Если кто боится Господа и желает того, что праведно, ненавидящий его не любит.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μισῶν
  choice: ненавидящий
  rationale: Субстантивированное причастие передано последовательно и без добавления явного объекта ненависти, которого нет в греческом тексте.
- source_word: βδελυκτόν
  choice: отвратительно
  rationale: Передаёт сильную отрицательную оценку исходного слова естественным современным русским языком.
- source_word: ποιῇ τὸν νόμον Κυρίου
  choice: исполняет закон Господа
  rationale: Русское «исполнять закон» естественно выражает соблюдение и осуществление его предписаний.
- source_word: τὸ δίκαιον
  choice: то, что праведно
  rationale: Сохраняет субстантивированное прилагательное и его смысловую широту, не сводя выражение только к праведности как отвлечённому качеству.
theological_decisions:
- issue: Неявное подлежащее глаголов ἐπαινεῖ и ἀγαπᾷ
  choice: ненавидящий
  alternative: он
  rationale: Контекст указывает на ὁ μισῶν из первого предложения; явное повторение по-русски устраняет неясность местоимения, не меняя смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Повтор «ненавидящий» сохранён ради смысловой связности и соответствия греческому контексту.
