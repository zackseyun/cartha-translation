revisions:
- from: Он порицает истину, завидует тому, кто поступает правильно, приветствует злословие и любит гордыню, потому что ненависть ослепляет его душу, как ослепляла и мою, когда я смотрел на Иосифа.
  to: Он порицает истину, завидует тому, кто преуспевает, приветствует злословие и любит гордыню, ибо ненависть ослепляет его душу, как ослепляла и мою, когда я смотрел на Иосифа.
  rationale: 'Заменено только «тому, кто поступает правильно» на «тому, кто преуспевает», чтобы не сужать κατορθοῦντι до моральной оценки и сохранить значение, наиболее непосредственно выраженное греческим текстом и английским аудитом. «Потому что» заменено на литературное «ибо» без изменения смысла. Заключительная эллиптическая конструкция сохранена: она естественно восполняет «мою [душу]» из предшествующей фразы и не вносит нового толкования.'
