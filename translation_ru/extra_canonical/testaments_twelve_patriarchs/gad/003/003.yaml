base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003/003.yaml
  text: He reproaches the truth, envies the one who prospers, embraces slander, and loves arrogance, because hatred blinds his soul, as it did mine when I looked at Joseph.
translation:
  language: ru
  text: Он порицает истину, завидует тому, кто преуспевает, приветствует злословие и любит гордыню, ибо ненависть ослепляет его душу, как ослепляла и мою, когда я смотрел на Иосифа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψέγει
  choice: порицает
  rationale: Передаёт значение неодобрения и осуждения; сохраняет парадоксальное сочетание «порицает истину».
- source_word: τῷ κατορθοῦντι
  choice: тому, кто поступает правильно
  rationale: Причастие κατορθοῦντι обозначает того, кто действует верно или успешно. Контекст допускает оттенок преуспевания, но «поступает правильно» ближе к нравственной направленности перечня и не сводит выражение к материальному успеху.
- source_word: καταλαλιὰν ἀσπάζεται
  choice: приветствует злословие
  rationale: ἀσπάζεται буквально связано с приветствием и радушным принятием; «приветствует» сохраняет выразительную персонификацию. καταλαλιά означает злословие, клеветническую или порочащую речь.
- source_word: ὑπερηφανίαν ἀγαπᾷ
  choice: любит гордыню
  rationale: «Гордыня» естественно передаёт порочную надменность ὑπερηφανία в нравоучительном контексте.
- source_word: ἐκτυφλοῖ
  choice: ослепляет
  rationale: Прямой и образно естественный эквивалент глагола со значением «делает слепым».
- source_word: ὡς κἀγὼ τότε ἔβλεπον τὸν Ἰωσήφ
  choice: как ослепляла и мою, когда я смотрел на Иосифа
  rationale: По смыслу восполняется объект «мою [душу]» и повторяется глагол «ослепляла». Такое синтаксическое оформление естественно по-русски и связывает ослепление Гада с его отношением к Иосифу.
theological_decisions:
- issue: Нравственный или результативный смысл τῷ κατορθοῦντι
  choice: тому, кто поступает правильно
  alternative: тому, кто преуспевает
  rationale: Греческое выражение допускает оба оттенка. В данном перечне действий ненависти нравственное прочтение наиболее непосредственно, однако перевод не уточняет, в чём именно состоит правильность поступков.
- issue: Субъект и объект эллиптической заключительной конструкции
  choice: ненависть ослепляла мою душу, когда я смотрел на Иосифа
  alternative: как и я тогда смотрел на Иосифа
  rationale: Изолированная буквальная конструкция в переданном тексте синтаксически шероховата. Связь с предыдущим утверждением и консультационный английский текст поддерживают восполнение подразумеваемого действия и объекта без добавления богословского толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством нравоучительного текста. Сохранены параллельные глагольные конструкции и резкий образ ненависти, ослепляющей душу; архаизмы и конфессионально маркированная терминология не использованы.
