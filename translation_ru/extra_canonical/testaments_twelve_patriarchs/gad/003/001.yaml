    rationale: «Пагубен для всех человеческих дел» выражает вредоносность по отношению к делам, тогда как κακόν ἐστιν ἐπὶ πάσαις ταῖς πράξεσι τῶν ἀνθρώπων и английский контрольный текст характеризуют дух как злой «во всех делах людей».
  - severity: low
    issue: Не вполне прямое воспроизведение запрета μὴ πλανᾶσθε.
    rationale: «Не позволяйте» возможно по смыслу, но добавляет оттенок позволения; «не дайте ... ввести вас в заблуждение» ближе к тому, чтобы не быть введёнными в заблуждение.
  revised_text: И теперь выслушайте слово истины, чтобы поступать праведно и исполнять всякий закон Всевышнего. Не дайте духу ненависти ввести вас в заблуждение, дети, ибо он зол во всех делах людей.
