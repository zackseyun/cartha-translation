  text: III. Καὶ νῦν ἀκούσατε¹ λόγον² ἀληθείας³, *τοῦ ποιεῖν⁴ δικαιοσύνην, καὶ πάντα⁵ νόμον⁶ ὑψίστου, καὶ μὴ⁷ πλανᾶσθε⁸ τέκνα *τῷ πνεύματι⁹ τοῦ μίσους¹⁰, ὅτι κακόν ἐστιν ἐπὶ πάσαις ταῖς¹¹ πράξεσι τῶν¹¹ ἀνθρώπων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003/001.yaml
  text: 'And now hear a word of truth: listen in order to practice righteousness and every law of the Most High, and do not be led astray, children, by the spirit of hatred, because it is evil in all the deeds of men.'
translation:
  language: ru
  text: И теперь выслушайте слово истины, чтобы поступать праведно и исполнять всякий закон Всевышнего. Не дайте духу ненависти ввести вас в заблуждение, дети, ибо он зол во всех делах людей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσατε
  choice: выслушайте
  rationale: Повелительная форма передаёт призыв не просто услышать, а внимательно принять наставление; современное литературное слово сохраняет торжественный тон.
- source_word: λόγον ἀληθείας
  choice: слово истины
  rationale: Сохранена прозрачная родительная конструкция оригинала и традиционно понятное библейское выражение.
- source_word: τοῦ ποιεῖν δικαιοσύνην
  choice: чтобы поступать праведно
  rationale: Греческий оборот выражает цель или содержание наставления. Буквальное «творить праведность» возможно, но в современном русском звучит менее естественно.
- source_word: πάντα νόμον ὑψίστου
  choice: всякий закон Всевышнего
  rationale: πάντα при существительном в единственном числе передано распределительно как «всякий»; титул ὕψιστος передан общепонятным «Всевышний».
- source_word: μὴ πλανᾶσθε
  choice: не позволяйте… вводить вас в заблуждение
  rationale: Передано пассивно-медиальное значение «не будьте введены в заблуждение» в естественной русской конструкции без добавления образа пути.
- source_word: τῷ πνεύματι τοῦ μίσους
  choice: духу ненависти
  rationale: Сохранены личностно-духовная образность πνεῦμα и неоднозначная родительная связь с ненавистью.
- source_word: κακόν ἐστιν ἐπὶ πάσαις ταῖς πράξεσι τῶν ἀνθρώπων
  choice: он пагубен для всех человеческих дел
  rationale: «Пагубен для» естественно передаёт отрицательное воздействие, выраженное κακόν и ἐπί с дательным, не сводя смысл только к нравственной характеристике духа.
theological_decisions:
- issue: Референт местоименного смысла в ὅτι κακόν ἐστιν
  choice: «он» относится к духу ненависти
  alternative: 'Понимать κακόν безлично: «это зло во всех делах людей»'
  rationale: Средний род κακόν грамматически согласуется с πνεῦμα в греческом; в русском естественно использовать мужской род по слову «дух», не превращая фразу в отвлечённое утверждение о зле.
- issue: Связь τοῦ ποιεῖν с призывом слушать
  choice: 'Передать как цель: «чтобы поступать… и исполнять…»'
  alternative: Передать как содержание слова истины или отдельный повторный призыв «слушайте, чтобы…»
  rationale: Целевое прочтение хорошо соответствует генитивному инфинитиву в данном контексте, но не добавляет отсутствующего в греческом второго глагола «слушайте».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Обращение «дети» сохранено без добавления «мои», отсутствующего в греческом. Предложения разделены для ясности, при этом логическая связь оригинала сохранена.
