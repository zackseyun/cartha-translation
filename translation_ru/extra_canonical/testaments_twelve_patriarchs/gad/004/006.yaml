review_pass:
  verdict: revise
  source_fidelity: В целом перевод точно передаёт параллелизм, три употребления θέλει («хочет») и юридический смысл «приговорён к смерти». Однако частица «даже» в последней части добавляет усиление, которого нет в ἐν ὀλίγῳ; греческое выражение обозначает согрешивших «в малом / в небольшом».
  naturalness: Фраза звучит естественно для современного литературного русского и сохраняет афористический, наставительный регистр. Конструкция «не хочет, чтобы жили» удачна и ясна.
  terminology: «Любовь», «ненависть», «оживить», «согрешившие» и «приговорён к смерти» уместны. «В малом» достаточно буквально и не вводит классификации грехов или дополнительного эмфатического оттенка.
  issues:
  - severity: medium
    issue: Добавлено «даже» в выражении «согрешившие даже в малом».
    rationale: ἐν ὀλίγῳ означает «в малом», «в небольшой мере» или, по контексту, «в небольшом деле/проступке». Слово «даже» усиливает контраст и тем самым вносит оттенок, не выраженный греческим текстом.
  revised_text: Как любовь хочет оживить мёртвых и вернуть тех, кто приговорён к смерти, так и ненависть хочет убить живых и не хочет, чтобы жили согрешившие в малом.
