source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 6. Ὥσπερ²³ ἡ ἀγάπη Γκαὶ¹ τοὺς νεκροὺς *θέλει ζωοποιῆσαι²⁴ καὶ τοὺς ἐν²⁵ ἀποφάσει θανάτου θέλει²⁶ ἀνακαλέσασθαι, οὕτως καὶ²⁷ τὸ μῖσος τοὺς ζῶντας θέλει ἀποκτεῖναι, καὶ *τοὺς ἐν ὀλίγῳ ἁμαρτήσαντας²⁸ οὐ θέλει ζῆν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/006.yaml
  text: Just as love wants to make the dead alive and to call back those under sentence of death, so also hatred wants to kill the living, and it does not want those who have sinned in a little matter to live.
translation:
  language: ru
  text: Как любовь хочет оживить мёртвых и вернуть тех, кто приговорён к смерти, так и ненависть хочет убить живых и не хочет, чтобы жили согрешившие в малом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλει ζωοποιῆσαι
  choice: хочет оживить
  rationale: Прямо передаёт волеизъявление θέλει и каузативное значение ζωοποιῆσαι естественным современным русским выражением.
- source_word: τοὺς ἐν ἀποφάσει θανάτου
  choice: тех, кто приговорён к смерти
  rationale: ἀπόφασις здесь означает судебное решение, или приговор; формулировка сохраняет юридический смысл и понятна современному читателю.
- source_word: ἀνακαλέσασθαι
  choice: вернуть
  rationale: Глагол означает призвать или позвать обратно. В данном контексте «вернуть» естественно передаёт образ отмены смертного приговора, не уточняя способ возвращения.
- source_word: τοὺς ἐν ὀλίγῳ ἁμαρτήσαντας
  choice: согрешившие даже в малом
  rationale: 'Сохраняет неопределённость ἐν ὀλίγῳ: речь может идти о малом проступке или малой мере согрешения. Частица «даже» ясно выражает резкий контраст ненависти с незначительностью вины.'
theological_decisions:
- issue: Образ оживления мёртвых и возвращения осуждённых
  choice: Сохранить как образ того, чего желает любовь, без догматического пояснения
  alternative: Истолковать как буквальное воскресение или как помилование
  rationale: Текст соединяет два сильных образа и не объясняет их буквальный либо метафорический статус; перевод не должен устранять эту напряжённость.
- issue: Степень вины в выражении ἐν ὀλίγῳ
  choice: «согрешившие даже в малом»
  alternative: «совершившие небольшой грех»
  rationale: Выбранная формулировка не навязывает классификацию грехов и сохраняет широту греческого выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством афористического наставления. Сохранена симметричная конструкция «как… так и…» и троекратное выражение желания, соответствующее θέλει; последнее вхождение передано конструкцией «не хочет, чтобы жили» ради естественного русского синтаксиса.
