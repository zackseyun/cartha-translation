    issue: Мужской род местоимения «он»
    rationale: В греческом подлежащее при θέλει не названо. Английский audit trail также сохраняет его нейтральным («it»). Русское «он» добавляет не подтверждённую текстом гендерно-лексическую идентификацию и может неверно связать фразу с предшествующим контекстом.
  - severity: low
