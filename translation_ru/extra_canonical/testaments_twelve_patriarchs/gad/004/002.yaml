  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/002.yaml
  text: For it does not want to hear the words of his commandments concerning love for his neighbor, and it sins against God.
translation:
  language: ru
  text: Ибо не хочет слушать слова его заповедей о любви к ближнему и грешит против Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλει ἀκούειν
  choice: хочет внимать
  rationale: Передаёт не просто физическое слушание, а готовность прислушаться и повиноваться; отрицание сохранено в основном тексте.
- source_word: λόγων ἐντολῶν αὐτοῦ
  choice: словам Его заповедей
  rationale: Сохранены оба греческих существительных и притяжательное местоимение; прописная буква указывает на Бога как референта в данном контексте.
- source_word: περὶ ἀγάπης τοῦ πλησίον
  choice: о любви к ближнему
  rationale: Естественная современная русская формулировка, точно выражающая направленность любви на ближнего.
- source_word: εἰς Θεὸν ἁμαρτάνει
  choice: грешит против Бога
  rationale: Обычное и точное русское соответствие конструкции со значением греха, направленного против Бога.
theological_decisions:
- issue: Референт местоимения αὐτοῦ
  choice: «Его» отнесено к Богу
  alternative: «его» как ссылка на иной субъект из более широкого контекста
  rationale: Непосредственное упоминание Бога в конце фразы и содержание заповедей делают божественный референт наиболее вероятным, хотя изолированный стих не устраняет контекстуальную зависимость полностью.
- issue: Смысл ἀκούειν применительно к заповедям
  choice: «внимать»
  alternative: «слушать» или «слышать»
  rationale: «Внимать» сохраняет волевой и этический оттенок принятия заповедей, не вводя более сильного понятия полного послушания.
translation_notes:
  register: Современный литературный русский язык с достоинством библейско-нравственного наставления. Синтаксис близок к греческому, но звучит естественно; богословская связь любви к ближнему и греха против Бога сохранена без дополнительного толкования.
