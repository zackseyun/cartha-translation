source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Τὸ γὰρ πνεῦμα τοῦ μίσους *διὰ τῆς²⁹ ὀλιγοψυχίας συνεργεῖ τῷ Σατανᾷ ἐν πᾶσιν εἰς θάνατον τῶν ἀνθρώπων, τὸ δὲ πνεῦμα τῆς ἀγάπης *ἐν μακροθυμίᾳ³⁰ συνεργεῖ *τῷ νόμῳ³¹ τοῦ Θεοῦ εἰς σωτηρίαν τῶν³² ἀνθρώπων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/007.yaml
  text: For the spirit of hatred, through faintheartedness, works together with Satan in everything for the death of men; but the spirit of love, through longsuffering, works together with the law of God for the salvation of men.
translation:
  language: ru
  text: Ведь дух ненависти через малодушие во всём содействует Сатане, ведя людей к смерти; а дух любви через долготерпение содействует закону Божьему, ведя людей к спасению.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀλιγοψυχία
  choice: малодушие
  rationale: Передаёт недостаток душевной стойкости и мужества; естественно звучит в современном литературном русском языке.
- source_word: μακροθυμία
  choice: долготерпение
  rationale: Сохраняет традиционный нравственно-богословский смысл терпеливой выдержки и противопоставление малодушию.
- source_word: συνεργεῖ
  choice: содействует
  rationale: Передаёт значение совместного действия, не усиливая его до полного подчинения или отождествления.
- source_word: εἰς θάνατον / εἰς σωτηρίαν
  choice: ведя людей к смерти / ведя людей к спасению
  rationale: Естественно выражает направленность действия εἰς, сохраняя параллелизм двух частей.
theological_decisions:
- issue: Соотношение духа любви и закона Божьего
  choice: «дух любви… содействует закону Божьему»
  alternative: «действует вместе с законом Божьим»
  rationale: Формулировка сохраняет буквальное направление дательного τῷ νόμῳ и не разрешает дополнительно вопрос о том, как именно соотносятся дух любви и закон.
- issue: Значение εἰς в выражениях о смерти и спасении
  choice: 'направленность: «ведя… к»'
  alternative: 'цель: «ради смерти / ради спасения»'
  rationale: Так сохраняется возможная смысловая широта греческого оборота между результатом и направленностью без утверждения, что смерть людей является сознательной конечной целью.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Сохранены строгий антитетический параллелизм, повтор «дух» и симметрия «к смерти / к спасению».
