id: T12P.GAD.4.4
reference: Testament of Gad 4:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 4. Ἐὰν δὲ *δοῦλός τις ᾖ¹³, συμβαλεῖ¹⁴ αὐτὸν πρὸς τὸν κύριον αὐτοῦ, καὶ ἐν πάσῃ θλίψει¹⁵ *ἐπιχαίρει αὐτῷ¹⁶, εἴπως¹⁷ θανατωθῇ¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/004.yaml
  text: And if someone is a servant, it slanders him to his master, and in every distress it rejoices over him, if perhaps he may be put to death.
translation:
  language: ru
  text: А если кто-нибудь — раб, ненависть оклевещет его перед господином и будет злорадствовать при всякой его беде, надеясь, что его предадут смерти.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в надежде, что его убьют»; греческое выражение передаёт желаемую, но ещё не определённую возможность.'
    reason: Сохраняет оттенок неопределённости εἴπως и поясняет более торжественную формулировку основного текста.
lexical_decisions:
- source_word: δοῦλος
  choice: раб
  rationale: Прямое значение греческого слова; «слуга» неоправданно смягчило бы обозначенный социальный статус.
- source_word: συμβαλεῖ
  choice: оклевещет
  rationale: В данном сочетании с направлением действия «перед его господином» глагол передаёт враждебное оговаривание или обвинение; «оклевещет» естественно выражает смысл в контексте ненависти.
- source_word: κύριος
  choice: господин
  rationale: В паре с «рабом» речь идёт о владельце или господине, а не о божественном титуле.
- source_word: ἐπιχαίρει αὐτῷ
  choice: будет злорадствовать
  rationale: Передаёт радость по поводу чужого несчастья, подразумеваемую глаголом с данным объектом.
- source_word: θλίψει
  choice: беде
  rationale: В контексте страдания другого человека современное «беда» звучит естественнее буквального «скорбь» и сохраняет широкий смысл притеснения или тяжёлого положения.
- source_word: θανατωθῇ
  choice: предадут смерти
  rationale: Сохраняет страдательный залог и не уточняет ни исполнителя, ни способ умерщвления.
theological_decisions:
- issue: Подлежащее действий выражено контекстуально
  choice: явно назвать «ненависть»
  alternative: передать местоимением «она» или безличной конструкцией
  rationale: В греческом фрагменте подлежащее восстанавливается из контекста раздела о ненависти. Явное повторение делает отдельный стих понятным по-русски, не добавляя нового толкования.
- issue: Неопределённость εἴπως
  choice: «надеясь, что» с пояснительной сноской
  alternative: «не убьют ли его» или «чтобы его убили»
  rationale: Форма выражает желаемую, но не гарантированную возможность. «Чтобы» чрезмерно усилило бы целевую определённость, а буквальный вопрос звучал бы неестественно.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Синтаксис сделан естественным для отдельного стиха; ключевые резкие образы («раб», «оклевещет», «предадут смерти») сохранены без смягчения.
