revisions:
- from: Ведь ненависть действует заодно с завистью против тех, кто преуспевает; и ненавидящий, слыша и видя, как они преуспевают, всегда изнемогает.[a]
  to: Ведь ненависть действует заодно с завистью и против тех, кто преуспевает; тот, кто слышит и видит их успех, всегда слабеет.[a]
  rationale: Правка устраняет необязательное уточнение субъекта во второй части, сохраняет непереходный смысл ἀσθενεῖ («слабеет») и точнее воспроизводит καὶ κατὰ («и против»). Смысловой объект слуха и зрения естественно соотнесён с ранее названными преуспевающими людьми, а неопределённость субъекта сохранена в сноске.
