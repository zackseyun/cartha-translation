  text: 5. *Τῷ γὰρ φθόνῳ συνεργεῖ τὸ μῖσος¹⁹, καὶ²⁰ κατὰ τῶν εὐπραγούντων· *ἐν προκοπῇ²¹ ἀκούων καὶ²² ὁρῶν πάντοτε ἀσθενεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/005.yaml
  text: For hatred works together with envy, even against those who prosper; hearing and seeing them in their progress, it is always weakened.
translation:
  language: ru
  text: Ведь ненависть действует заодно с завистью и против тех, кто преуспевает; тот, кто слышит и видит их успех, всегда слабеет.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте не назван субъект слов «слышит», «видит» и «слабеет». Их формы мужского рода указывают на подразумеваемого человека; возможно, имеется в виду завистник или ненавидящий.
    reason: Сноска сохраняет грамматическую и смысловую неопределённость невыраженного субъекта, которую русский текст вынужденно передаёт обобщённым «тот, кто».
lexical_decisions:
- source_word: φθόνῳ
  choice: с завистью
  rationale: Дательный падеж после συνεργεῖ выражает того, с кем ненависть действует сообща; «зависть» сохраняет отличие φθόνος от μῖσος.
- source_word: μῖσος
  choice: ненависть
  rationale: Прямой и естественный эквивалент, сохраняющий олицетворение ненависти как действующей силы.
- source_word: τῶν εὐπραγούντων
  choice: тех, кто преуспевает
  rationale: Передаёт людей, у которых дела идут хорошо, без сужения смысла до материального благополучия.
- source_word: ἐν προκοπῇ
  choice: как они преуспевают
  rationale: Оборот обозначает продвижение или успех упомянутых людей; глагольная передача естественна по-русски и связывает его с объектом слуха и зрения.
- source_word: ἀσθενεῖ
  choice: изнемогает
  rationale: Сохраняет непереходное значение «слабеет, теряет силы», не превращая его без достаточных оснований в переходное «ослабляет».
theological_decisions:
- issue: Подразумеваемый субъект ἀκούων, ὁρῶν и ἀσθενεῖ
  choice: ненавидящий
  alternative: завистник; ненависть
  rationale: Причастия стоят в мужском роде и не согласуются с τὸ μῖσος среднего рода, поэтому грамматически подразумевается человек. Контекст первой части позволяет обозначить его как ненавидящего, не отождествляя при этом ненависть и зависть.
translation_notes:
  register: Современный литературный и нравственно-наставительный регистр. Синтаксис сделан ясным для обычного читателя, но различие между «ненавистью» и «завистью» и неоднозначность второй части не устранены молча.
