  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/001.yaml
  text: Therefore guard yourselves, my children, from hatred, because it even commits lawlessness against the Lord himself.
translation:
  language: ru
  text: Итак, дети мои, берегитесь ненависти, потому что она совершает беззаконие даже против самого Господа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: берегитесь
  rationale: 'Естественно передаёт повелительное значение аориста среднего залога: быть настороже и ограждать себя от ненависти.'
- source_word: μίσους
  choice: ненависти
  rationale: Прямой и общеупотребительный эквивалент греческого существительного μῖσος.
- source_word: ἀνομίαν ποιεῖ
  choice: беззаконно поступает
  rationale: Передаёт устойчивое сочетание буквально означающее «творит беззаконие», сохраняя нравственно-богословскую силу выражения в естественном русском синтаксисе.
- source_word: καὶ εἰς αὐτὸν τὸν Κύριον
  choice: даже против самого Господа
  rationale: καί в данном положении имеет усилительное значение «даже», αὐτόν — «самого», а εἰς при враждебно направленном действии естественно передаётся как «против».
theological_decisions:
- issue: Олицетворение ненависти как действующего субъекта
  choice: она беззаконно поступает
  alternative: человек из-за неё поступает беззаконно
  rationale: Греческий текст грамматически делает ненависть субъектом ποιεῖ; перевод сохраняет это олицетворение и не вводит отсутствующего в источнике субъекта «человек».
translation_notes:
  register: Современный литературный русский язык с наставительным и достойным тоном. Обращение «дети мои» сохранено; порядок слов слегка адаптирован для естественности русской речи.
