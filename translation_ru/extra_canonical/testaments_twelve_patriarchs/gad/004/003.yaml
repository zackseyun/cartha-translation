source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 3. ΓἘὰν γὰρ πέσῃ ὁ ἀδελφός⁹, *σπουδάζει εὐθὺς¹⁰ ἀναγγεῖλαι τοῖς¹¹ πᾶσιν, καὶ σπεύδει *περὶ αὐτοῦ ἵνα κριθεὶς¹² καὶ κολασθεὶς ἀποθάνῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/003.yaml
  text: For if a brother falls, it is eager at once to report it to everyone, and it hastens concerning him so that, having been judged and punished, he may die.
translation:
  language: ru
  text: Ведь если брат падёт, она тотчас старается рассказать об этом всем и торопится с его делом, чтобы он, осуждённый и наказанный, умер.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέσῃ
  choice: падёт
  rationale: 'Сохраняет образное и смысловое поле греческого глагола: падение может означать проступок или нравственное падение; перевод не уточняет это без достаточных оснований.'
- source_word: σπουδάζει εὐθύς
  choice: тотчас старается
  rationale: Передаёт как немедленность, так и деятельное рвение субъекта.
- source_word: ἀναγγεῖλαι τοῖς πᾶσιν
  choice: рассказать об этом всем
  rationale: Естественная современная формулировка для публичного разглашения случившегося.
- source_word: σπεύδει περὶ αὐτοῦ
  choice: торопит дело против него
  rationale: Передаёт настойчивое действие, направленное на брата и имеющее в контексте явно враждебную цель; выражение «против него» делает направление действия понятным по-русски, не опуская περὶ αὐτοῦ.
- source_word: ἵνα κριθεὶς καὶ κολασθεὶς ἀποθάνῃ
  choice: чтобы он, осуждённый и наказанный, умер
  rationale: 'Сохраняет последовательность и зависимость греческих аористных причастий: смерть следует после суда и наказания.'
theological_decisions:
- issue: Не названный в пределах стиха субъект глаголов σπουδάζει и σπεύδει
  choice: она
  alternative: повторить предполагаемый антецедент, например «ненависть»
  rationale: Греческий текст продолжает мысль предшествующего контекста и не повторяет подлежащее. Русское местоимение сохраняет эту связность и не вносит в данный стих отсутствующее в нём существительное.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Образ «брат падёт» сохранён намеренно; синтаксис заключительной цели близок к греческому, но остаётся естественным для русского чтения.
