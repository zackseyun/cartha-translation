source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. Καὶ ἐὰν ἐπὶ πλεῖον ὑψοῦται, μὴ φθονεῖτε ⌜αὐτῷ⌝⁷, μνημονεύοντες ὅτι πᾶσα σὰρξ ἀποθανεῖται. Κυρίῳ δὲ ὕμνους⁸ προσφέρετε⁹ τῷ παρέχοντι τὰ καλὰ καὶ¹⁰ συμφέροντα *πᾶσιν ἀνθρώποις¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/002.yaml
  text: And if he is exalted still more, do not envy him, remembering that all flesh will die. But offer hymns to the Lord, who provides good and beneficial things to all people.
translation:
  language: ru
  text: И если он возвысится ещё больше, не завидуйте ему, помня, что всякая плоть умрёт. Господу же приносите хвалебные песни — Тому, кто дарует всем людям доброе и полезное.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑψοῦται
  choice: возвысится
  rationale: Передаёт пассивно-возвратный смысл «быть возвышенным / подняться выше», не уточняя, идёт ли речь о положении, почёте или благополучии.
- source_word: πᾶσα σὰρξ
  choice: всякая плоть
  rationale: Сохраняет традиционный библейский образ и обобщённое указание на смертность всех людей.
- source_word: ὕμνους προσφέρετε
  choice: приносите хвалебные песни
  rationale: Сохраняет как предмет «гимны, хвалебные песни», так и оттенок глагола προσφέρω — «приносить, преподносить».
- source_word: παρέχοντι
  choice: дарует
  rationale: Естественно по-русски выражает постоянное благодетельное предоставление со стороны Господа.
- source_word: τὰ καλὰ καὶ συμφέροντα
  choice: доброе и полезное
  rationale: Передаёт сочетание нравственно или качественно доброго с тем, что служит на пользу.
theological_decisions:
- issue: Адресаты Божьих благодеяний в πᾶσιν ἀνθρώποις
  choice: всем людям
  alternative: всем человекам
  rationale: Сохраняет универсальный объём греческого выражения без архаизации и без богословского ограничения его смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис следует греческому противопоставлению через «же», но порядок слов слегка приспособлен к естественной русской речи.
