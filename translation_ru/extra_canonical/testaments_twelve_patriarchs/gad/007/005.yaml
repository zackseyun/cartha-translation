  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/005.yaml
  text: For if what was taken away in evil is taken from him, or if he repents, he is forgiven; but if he remains unrepentant, he is kept for eternal punishment.
translation:
  language: ru
  text: Ибо если отнятое злым путём будет у него отнято[a], то, если он раскается, ему будет прощено; если же он останется нераскаявшимся, то будет сохранён для вечного наказания.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст этой части фразы неясен; возможно также: «если это будет отнято у него среди бедствий».'
    reason: В издании αὐτά отмечено как сомнительное чтение, а сочетание ἀφαιρεῖται αὐτὰ ἐν κακοῖς допускает разные синтаксические и смысловые толкования.
lexical_decisions:
- source_word: ἀφαιρεῖται αὐτὰ ἐν κακοῖς
  choice: отнятое злым путём будет у него отнято
  rationale: Передаёт пассивное ἀφαιρεῖται и связь с αὐτά, не устраняя трудность повреждённого или неясного греческого текста; «злым путём» естественно передаёт ἐν κακοῖς в данном контексте.
- source_word: μετανοήσαντι
  choice: если он раскается
  rationale: Условная конструкция по смыслу передаёт дательный причастия аориста и сохраняет нравственный смысл μετάνοια.
- source_word: ἀφίησι
  choice: ему будет прощено
  rationale: Пассивная по-русски формулировка естественно выражает подразумеваемое прощение, хотя греческая форма буквально активна и её субъект не назван.
- source_word: ἀμετανόητος
  choice: нераскаявшимся
  rationale: Точно сохраняет противопоставление предыдущему «раскается».
- source_word: τηρεῖται εἰς αἰωνίαν κόλασιν
  choice: будет сохранён для вечного наказания
  rationale: Сохраняет образ τηρεῖται — удерживания или сохранения до наказания — и прямо передаёт αἰωνίαν κόλασιν.
theological_decisions:
- issue: Связь раскаяния, прощения и окончательного наказания
  choice: 'Сохранено прямое условное противопоставление: раскаяние ведёт к прощению, нераскаянность — к вечному наказанию.'
  alternative: Уточнить субъект прощения или истолковать наказание в рамках определённой конфессиональной системы.
  rationale: Греческий текст не называет субъекта ἀφίησι и не развивает учение о природе наказания; перевод не должен добавлять такого толкования.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис сделан понятным для обычного читателя, однако текстовая неясность первой части не устранена догматически и отмечена сноской.
