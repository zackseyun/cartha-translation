  source_fidelity: 'Греч. Ἐξέτασον передано верно как призыв к внимательному рассмотрению. κρίματα Κυρίου точнее передавать «суды Господа»: «решения» сужает слово до отдельных постановлений и менее ясно сохраняет судебно-нравственный смысл κρίματα. У τὸ διαβούλιόν σου два однородных сказуемых в греческом тексте; «замысел озарится и успокоится» воспроизводит эту структуру и образность καταλάμψει точнее, чем «прояснится».'
