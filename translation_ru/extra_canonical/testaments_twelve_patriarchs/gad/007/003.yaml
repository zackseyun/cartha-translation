translation:
  language: ru
  text: Вникай в суды Господа — и твой замысел озарится и успокоится.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перед глаголом «озарится» в греческом тексте стоит критический знак †; чтение или его смысл, вероятно, вызывает текстологическое затруднение. Буквально: «озарится и успокоится».'
    reason: Точно отражает критический знак, присутствующий в предоставленном греческом тексте, и сохраняет образную двусмысленность без необоснованного утверждения о статусе второго глагола.
lexical_decisions:
- source_word: Ἐξέτασον
  choice: Исследуй
  rationale: Повелительная форма передаёт призыв внимательно рассмотреть и испытать, а не лишь бегло ознакомиться.
- source_word: κρίματα Κυρίου
  choice: решения Господа
  rationale: κρίματα может означать суды, судебные решения или установления. «Решения» естественно по-русски и сохраняет здесь достаточно широкий смысл.
- source_word: τὸ διαβούλιόν σου
  choice: твой замысел
  rationale: διαβούλιον обозначает намерение, замысел или результат обдумывания. «Замысел» хорошо сочетается с последующими глаголами и не сводит выражение только к интеллектуальному рассуждению.
- source_word: καταλάμψει
  choice: прояснится
  rationale: Греческая форма буквально связана с сиянием или озарением. В данном контексте «прояснится» естественно передаёт образ обретения ясности, не усиливая его до прямого божественного откровения.
- source_word: ἡσυχάσει
  choice: обретёт покой
  rationale: Передаёт значение успокоения, утишения и прекращения внутренней тревоги; выражение звучит естественно и dignified в современном русском языке.
theological_decisions:
- issue: Связь между исследованием решений Господа и состоянием человеческого замысла
  choice: 'Сохранена последовательность без уточнения механизма: замысел «прояснится и обретёт покой».'
  alternative: «Господь озарит и успокоит твой замысел».
  rationale: В греческом тексте Господь прямо не назван действующим лицом двух последних глаголов. Выбранный вариант не вводит дополнительного богословского пояснения.
translation_notes:
  register: Современный литературный русский язык с кратким наставительным ритмом. Тире подчёркивает связь между повелением и его результатом; архаизмы и конфессионально окрашенные формулы не используются.
