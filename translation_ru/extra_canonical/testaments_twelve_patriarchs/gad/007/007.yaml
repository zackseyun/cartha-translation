  text: Итак, изгоните ненависть из ваших душ и любите друг друга в искренности сердца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξάρατε
  choice: изгоните
  rationale: Повелительный аорист передаёт решительное удаление; «изгоните» естественно по-русски и сохраняет силу греческого глагола.
- source_word: τὸ μῖσος
  choice: ненависть
  rationale: Прямой и общепонятный эквивалент греческого существительного.
- source_word: ἀπὸ τῶν ψυχῶν ὑμῶν
  choice: из ваших душ
  rationale: Сохраняет образ внутренней жизни и множественное число оригинала.
- source_word: ἀγαπήσατε ἀλλήλους
  choice: любите друг друга
  rationale: Естественная русская передача взаимной любви, выраженной ἀλλήλους.
- source_word: ἐν εὐθύτητι καρδίας
  choice: с чистосердечием
  rationale: εὐθύτης обозначает прямоту, искренность и нравственную честность; «с чистосердечием» естественно передаёт образ прямого, не лукавого сердца, не сводя выражение только к моральной «праведности».
