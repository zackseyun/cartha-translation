  source_fidelity: Греческое ἐκ κακῶν обозначает обретение богатства посредством зла/дурных средств; «на злых делах» передаёт общий смысл, но для современного русского звучит неестественно. «На зле» сохраняет широту κακά и естественнее сочетается с «разбогатеет». «Брат моего отца» точно передаёт πατράδελφος, а «не завидуйте ему» — контекстуальное значение μὴ ζηλώσητε. «Предела Господня» обоснованно сохраняет неуточнённость ὅρον Κυρίου; сноска корректно указывает возможное временное значение, не навязывая его основному тексту.
