- from: '4. Но если кто-нибудь разбогатеет на злых делах, как Исав, брат моего отца, не завидуйте ему: ждите предела Господня[a].'
  to: '4. Но если кто-нибудь разбогатеет на зле, как Исав, брат моего отца, не завидуйте ему: ждите предела Господня[a].'
  rationale: Заменено только «на злых делах» на «на зле» ради естественной современной русской сочетаемости и более широкого соответствия ἐκ κακῶν. Остальные элементы точно и уместно передают греческий текст, включая родственное обозначение, увещевание не завидовать и намеренно неразрешённый смысл ὅρον Κυρίου.
