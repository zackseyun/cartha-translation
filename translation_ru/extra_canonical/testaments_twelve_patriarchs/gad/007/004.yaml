  text: 4. Ἐὰν δὲ¹⁵ ἐκ κακῶν¹⁶ τις πλουτήσει, ὡς Ἡσαῦ ὁ πατράδελφός¹⁷ μου, μὴ ζηλώσητε¹⁸· ὅρον¹⁹ γὰρ²⁰ Κυρίου ἐκδέξασθε²¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/004.yaml
  text: But if someone becomes rich through evil, like Esau my father's brother, do not be jealous; rather, await the appointed limit of the Lord.
translation:
  language: ru
  text: '4. Но если кто-нибудь разбогатеет на зле, как Исав, брат моего отца, не завидуйте ему: ждите предела Господня[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «назначенного Господом срока»; греческое слово может означать предел, установленную границу или назначенный срок (конец).'
    reason: Поясняет реальную смысловую широту слова ὅρον, не разрешая её однозначно в основном тексте.
lexical_decisions:
- source_word: ἐκ κακῶν
  choice: на злых делах
  rationale: Передаёт источник богатства — зло или дурные дела — естественным современным русским оборотом, не сужая смысл до одного вида нечестности.
- source_word: πλουτήσει
  choice: разбогатеет
  rationale: 'Прямое и естественное соответствие будущей форме глагола πλουτέω: «станет богатым, разбогатеет».'
- source_word: πατράδελφος
  choice: брат моего отца
  rationale: Сохраняет явное родственное обозначение греческого текста, не заменяя его словом «дядя».
- source_word: μὴ ζηλώσητε
  choice: не завидуйте ему
  rationale: В данном контексте ζηλόω означает завистливо желать чужого благополучия; местоимение добавлено для естественности русского синтаксиса.
- source_word: ὅρον Κυρίου
  choice: предела Господня
  rationale: 'Сохраняет лаконичность и неоднозначность выражения: ὅρος может обозначать предел, установленную границу или назначенный срок/конец.'
- source_word: γὰρ ... ἐκδέξασθε
  choice: 'не завидуйте ему: ждите'
  rationale: Двоеточие естественно передаёт пояснительную связь, выраженную γάρ, избегая неестественного русского «ибо ждите» и не вводя отсутствующий в греческом противительный союз.
theological_decisions:
- issue: Значение выражения ὅρον Κυρίου
  choice: предела Господня
  alternative: назначенного Господом срока / установленного Господом конца
  rationale: Основной текст не определяет, идёт ли речь о сроке, границе благополучия или назначенном Богом конце; эта богословски значимая неопределённость сохранена и пояснена в сноске.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. Конструкция «предела Господня» намеренно сохраняет краткость и напряжённую неоднозначность оригинала; пояснительная связь γάρ передана двоеточием.
