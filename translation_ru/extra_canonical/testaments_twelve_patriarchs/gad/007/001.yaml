- from: Но если кто-то преуспевает больше вас, не огорчайтесь, а молитесь о нём, чтобы он достиг совершенства. Ведь это вам на пользу.
  to: Но если кто-то преуспевает больше вас, не огорчайтесь, а молитесь о нём, чтобы он был приведён к совершенству. Ибо так будет вам на пользу.
