source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: VII. Ἐὰν *δὲ εἰς¹ ὑπὲρ ὑμᾶς εὐοδοῦται μὴ λυπεῖσθε², ἀλλ᾿³ εὔχεσθε ὑπὲρ αὐτοῦ⁴ ἵνα τελειωθῇ⁵. *οὕτως γὰρ ἐστιν ὑμῖν συμφέρον⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/001.yaml
  text: But if someone prospers more than you, do not be grieved; rather, pray for him, that he may be made complete. For in this way it is to your advantage.
translation:
  language: ru
  text: Но если кто-то преуспевает больше вас, не огорчайтесь, а молитесь о нём, чтобы он был приведён к совершенству. Ибо так будет вам на пользу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐοδοῦται
  choice: преуспевает
  rationale: Передаёт значение благополучного продвижения и успеха без неоправданного сужения до материального достатка.
- source_word: μὴ λυπεῖσθε
  choice: не огорчайтесь
  rationale: Естественно передаёт запрет испытывать печаль или досаду из-за чужого успеха.
- source_word: τελειωθῇ
  choice: достиг совершенства
  rationale: Сохраняет идею доведения до полноты или завершённости; русская формулировка звучит естественно и не уточняет, кем или каким способом это совершается.
- source_word: συμφέρον
  choice: на пользу
  rationale: Кратко и естественно выражает то, что выгодно или полезно адресатам.
theological_decisions:
- issue: Смысл τελειωθῇ
  choice: чтобы он достиг совершенства
  alternative: чтобы он был доведён до совершенства
  rationale: Выбранная формулировка сохраняет смысл полноты и завершённости, не вводя явно отсутствующего в стихе деятеля и не ограничивая совершенство только нравственной либо духовной областью.
translation_notes:
  register: Современный литературный русский язык; наставительный, сдержанный и достойный тон. Противительное δὲ передано словом «Но», а пояснительное γὰρ — словом «Ведь».
