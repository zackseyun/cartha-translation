review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: речь о чужом преуспеянии, запрете огорчаться и призыве молиться. Однако τελειωθῇ — аорист сослагательного наклонения страдательного залога («чтобы он был доведён до полноты/совершенства»), тогда как «чтобы он достиг совершенства» заменяет страдательный залог активным. Кроме того, «это вам на пользу» несколько ослабляет οὕτως («так, таким образом»).'
  naturalness: Текст в целом современный и литературный. Формулировка «чтобы он был приведён к совершенству» несколько более книжная, но в данном наставительном контексте естественна и позволяет сохранить залог оригинала.
  terminology: «Преуспевает», «не огорчайтесь» и «на пользу» удачны. «Совершенство» соответствует τελειόω, не навязывая узкого догматического толкования; сохранённый страдательный залог не называет деятеля, как и греческий текст.
  issues:
  - severity: medium
    issue: Залог τελειωθῇ передан активной конструкцией.
    rationale: «Достиг совершенства» представляет человека действующим субъектом, тогда как греческий глагол стоит в страдательном залоге. Следует сохранить неназванного деятеля и результат доведения до совершенства.
  - severity: low
    issue: Ослаблен указательный оттенок οὕτως.
    rationale: «Это вам на пользу» понятно по контексту, но «Так будет вам на пользу» точнее передаёт «таким образом».
  revised_text: Но если кто-то преуспевает больше вас, не огорчайтесь, а молитесь о нём, чтобы он был приведён к совершенству. Ибо так будет вам на пользу.
