base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/006.yaml
  text: For the poor man, if being free from envy in all things he is pleasing to the Lord, this one is richer than all, because he does not have the distraction of vain people.
translation:
  language: ru
  text: Ибо бедняк, если он во всём щедр[a] и угоден Господу, богаче всех, потому что не знает суеты пустых людей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое ἄφθονος может также означать «изобилен» или «не знает зависти».
    reason: Слово многозначно, а варианты заметно меняют оттенок высказывания; примечание сохраняет подлинную лексическую неоднозначность.
lexical_decisions:
- source_word: ὁ πένης
  choice: бедняк
  rationale: Прямое и естественное обозначение неимущего человека в современном русском языке.
- source_word: ἄφθονος ἐπὶ πᾶσι
  choice: во всём щедр
  rationale: ἄφθονος может означать «обильный», «щедрый, не скупящийся» или «не знающий зависти». В отношении бедняка буквальное «изобилен во всём» звучало бы как материальное противоречие; «во всём щедр» сохраняет парадокс внутреннего изобилия и не устраняет многозначность без пояснения.
- source_word: Κυρίῳ εὐαρεστῇ
  choice: угоден Господу
  rationale: Передаёт значение εὐαρεστεῖν как соответствия Божьей воле и сохраняет краткую греческую конструкцию.
- source_word: ὑπὲρ πάντας πλουτεῖ
  choice: богаче всех
  rationale: Естественно передаёт сравнительное значение ὑπὲρ πάντας и смысл πλουτεῖ, здесь противопоставляющий духовное богатство материальной бедности.
- source_word: περισπασμὸν
  choice: забот
  rationale: В данном контексте слово обозначает отвлекающую поглощённость и житейскую озабоченность; «заботы» звучит естественнее буквального «отвлечения».
- source_word: τῶν ματαίων ἀνθρώπων
  choice: которыми обременены суетные люди
  rationale: Родительный оборот допускает связь забот с людьми, живущими суетными, пустыми устремлениями. Развёрнутая конструкция делает эту связь ясной, не приписывая бедняку отсутствие контакта с такими людьми.
theological_decisions:
- issue: Природа богатства бедняка
  choice: Сохранено парадоксальное утверждение «бедняк… богаче всех» без уточнения, что речь исключительно о духовном богатстве.
  alternative: «духовно богаче всех»
  rationale: Греческий текст не содержит определения «духовно»; добавление преждевременно разрешило бы намеренное смысловое напряжение.
- issue: Условность угождения Господу
  choice: «если он… угоден Господу»
  alternative: «если он… угождает Господу»
  rationale: Форма εὐαρεστῇ допускает передачу состояния или действия. Именная конструкция по-русски лучше связывает щедрость с одобрением Господа, не делая её единственной заслугой или причиной.
translation_notes:
  register: Современный литературный русский язык с кратким, назидательным и достоинственным звучанием. Синтаксис слегка сглажен ради ясности, но парадокс бедности и богатства сохранён.
