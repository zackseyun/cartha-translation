  to: Но если он станет отрицать и, будучи обличён, устыдится, молчи и не обличай его. Ведь тот, кто отрицает, раскаивается в том, что согрешил против тебя, и, убоявшись[a], примиряется.
  rationale: Исправление восстанавливает прямое значение ἡσύχασον, убирает не засвидетельствованное греческим текстом следствие «чтобы больше не причинять тебе зла» и добавляет сноску к заключённому в квадратные скобки причастию. Остальная терминология сохранена как точная и естественная для современного литературного русского.
