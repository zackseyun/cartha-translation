source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 6. Ἐὰν *δὲ ἀρνήσηται⁴⁵ καὶ *αἰδεσθῇ ἐλεγχόμενος⁴⁶, ἡσύχασον⁴⁷ μὴ †ἐλέγξῃς⁴⁸ αὐτόν· ὁ γὰρ ἀρνούμενος⁴⁹ μετανοεῖ *τοῦ πλημμελῆσαι⁵⁰ *εἰς σέ⁵¹. *καὶ [φοβηθεὶς] εἰρηνεύει⁵².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/006.yaml
  text: But if he denies it and is ashamed when reproved, be still; do not reprove him. For the one who denies it repents of having sinned against you, so that he may not do wrong to you again, and being afraid he makes peace.
translation:
  language: ru
  text: Но если он станет отрицать и, будучи обличён, устыдится, молчи и не обличай его. Ведь тот, кто отрицает, раскаивается в том, что согрешил против тебя, и, убоявшись[a], примиряется.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «убоявшись» передаёт греч. φοβηθεὶς; в используемом критическом издании оно заключено в квадратные скобки как текстологически сомнительное.
    reason: Отмечает неопределённость чтения, не устраняя его из основного текста и не добавляя толковательного содержания.
lexical_decisions:
- source_word: ἀρνήσηται / ἀρνούμενος
  choice: станет отрицать / отрицающий
  rationale: Сохраняет прямой смысл греческого глагола и последовательность между условной и поясняющей частями.
- source_word: αἰδεσθῇ ἐλεγχόμενος
  choice: будучи обличён, устыдится
  rationale: Передаёт стыд как реакцию на обличение, не сводя выражение лишь к смущению.
- source_word: ἡσύχασον
  choice: оставь это
  rationale: В контексте призыв означает прекратить дальнейшее действие и умолкнуть; буквальное «успокойся» по-русски могло бы ошибочно указывать лишь на эмоциональное состояние.
- source_word: μὴ ἐλέγξῃς αὐτόν
  choice: не обличай его
  rationale: Прямо передаёт запрет без добавления значения повторности или длительности.
- source_word: μετανοεῖ
  choice: раскаивается
  rationale: Естественный современный эквивалент, сохраняющий нравственный смысл перемены отношения к проступку.
- source_word: τοῦ πλημμελῆσαι εἰς σέ
  choice: в том, что согрешил против тебя
  rationale: Передаёт нравственно-религиозную окраску πλημμελέω и направленность проступка против другого человека.
- source_word: εἰρηνεύει
  choice: примиряется
  rationale: В данном межличностном контексте естественно выражает восстановление мира, сохраняя лаконичность греческого текста.
theological_decisions:
- issue: Связь отрицания с раскаянием
  choice: Сохранено утверждение, что отрицающий раскаивается
  alternative: Истолковать отрицание как доказательство отсутствия раскаяния
  rationale: Греческий текст прямо связывает ὁ ἀρνούμενος с μετανοεῖ; кажущееся психологическое напряжение не следует устранять толкованием.
- issue: Значение πλημμελῆσαι
  choice: «согрешил»
  alternative: «поступил неправильно» или «провинился»
  rationale: Выбор сохраняет нравственную весомость слова и соответствует контексту проступка против ближнего, не добавляя конфессиональной специфики.
translation_notes:
  register: Современный литературный русский язык с достоинством параветхозаветного наставления. Синтаксис упрощён лишь настолько, чтобы фраза была ясна обычному читателю; причинно-целевая связь и напряжение между отрицанием, стыдом и раскаянием сохранены.
