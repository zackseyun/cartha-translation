base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/005.yaml
  text: Do not let another hear your secret in a quarrel, lest, having come to hate you, he become your enemy and commit a great sin against you; for many times he either murders you by treachery or entangles you in evils, having received the poison from you.
translation:
  language: ru
  text: Не позволяй постороннему услышать твою тайну во время ссоры, чтобы он, возненавидев тебя, не стал твоим врагом и не совершил против тебя тяжкого греха.[a] Ведь нередко он либо коварно убивает тебя, либо вовлекает тебя в беды, получив от тебя яд.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «против тебя» передают греч. выражение ἐν σοί («в тебе / по отношению к тебе»), заключённое в квадратные скобки в данном издании; его присутствие в тексте не вполне устойчиво.
    reason: Отмечает текстологически сомнительное выражение и сохраняет его смысловую неоднозначность, не перегружая основной текст.
lexical_decisions:
- source_word: ἀλλότριος
  choice: посторонний
  rationale: Передаёт человека, не принадлежащего к близкому кругу, естественнее русского буквального «чужой» в данном наставлении.
- source_word: ἐν μάχῃ
  choice: во время ссоры
  rationale: В контексте разглашения тайны речь, вероятнее всего, о межличностной распре или ссоре, а не о вооружённом сражении.
- source_word: τὸ μυστήριόν σου
  choice: твою тайну
  rationale: Прямое и естественное соответствие личному секрету в данном контексте.
- source_word: δολοφωνεῖ σε
  choice: предательски убивает тебя
  rationale: Сохраняет значение умышленного убийства посредством коварства или обмана, не сужая его до конкретного способа.
- source_word: περιεργάζεται σε ἐν κακοῖς
  choice: вовлекает тебя в беды
  rationale: Идиоматично передаёт причинение человеку запутанных злых последствий; необычная конструкция оригинала не допускает чрезмерной конкретизации.
- source_word: λαβὼν ἀπό σου τὸν ἰόν
  choice: приняв яд от тебя
  rationale: 'Сохраняет метафору яда и направленность ἀπό σου: повод или пагубный материал исходит от самого адресата через раскрытую тайну.'
theological_decisions:
- issue: Великий грех и его направленность
  choice: совершил против тебя великий грех
  alternative: совершил великий грех в тебе / из-за тебя
  rationale: ἐν σοί текстуально отмечено скобками и буквально неоднозначно; «против тебя» соответствует ближайшему смыслу английского консультационного текста и естественно связывает грех с враждебным действием, не вводя специальной доктринальной трактовки.
- issue: Причинная ответственность говорящего в образе яда
  choice: сохранить «приняв яд от тебя»
  alternative: получив от тебя повод к злу
  rationale: 'Метафора намеренно оставлена без разъяснения: текст удерживает напряжение между виной врага и неосмотрительностью человека, разгласившего тайну.'
translation_notes:
  register: Современный литературный русский язык с наставительным, dignified тоном. Синтаксис сохраняет последовательность причин и последствий греческого текста, но избегает неестественных буквализмов. Текстуальные сиглы из критического издания в основной перевод не перенесены, поскольку они не являются сносками публикационного перевода.
