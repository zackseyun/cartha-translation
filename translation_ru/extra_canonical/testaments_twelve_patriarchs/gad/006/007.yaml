source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Ἐὰν δέ *ἔστω ἀναιδὴς⁵³ καὶ ἐνίσταται⁵⁴ τῇ κακίᾳ, *καὶ οὕτως⁵⁵ ἄφες αὐτῷ ἀπὸ καρδίας, καὶ δὸς⁵⁶ τῷ Θεῷ τὴν ἐκδίκησιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/007.yaml
  text: But even if he is shameless and persists in evil, even so forgive him from the heart, and give vengeance to God.
translation:
  language: ru
  text: Но даже если он бесстыден и упорствует во зле, всё равно прости его от всего сердца и предоставь отмщение Богу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναιδής
  choice: бесстыден
  rationale: Прямо передаёт значение «лишённый стыда, бесстыдный» и естественно звучит в современном русском.
- source_word: ἐνίσταται τῇ κακίᾳ
  choice: упорствует во зле
  rationale: Сохраняет идею стойкого сопротивления или продолжения в κακία, не сужая её до отдельного проступка.
- source_word: ἀπὸ καρδίας
  choice: от всего сердца
  rationale: Естественный русский эквивалент, обозначающий искреннее, внутреннее прощение.
- source_word: δὸς τῷ Θεῷ τὴν ἐκδίκησιν
  choice: предоставь отмщение Богу
  rationale: 'Передаёт буквальную конструкцию «дай Богу отмщение» идиоматично и ясно: не мсти сам, а передай право на воздаяние Богу.'
theological_decisions:
- issue: Кому принадлежит отмщение
  choice: предоставь отмщение Богу
  alternative: отдай отмщение Богу
  rationale: Формулировка сохраняет повеление отказаться от личной мести в пользу Божьего воздаяния, не уточняя его способа или времени.
translation_notes:
  register: 'Современный литературный русский язык; тон назидательный и достойный. Союзная конструкция сохраняет уступительное усиление греческого текста: «даже если… всё равно».'
