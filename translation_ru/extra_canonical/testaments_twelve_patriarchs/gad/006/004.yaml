source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 4. Ἐὰν δὲ ἀρνεῖται²⁸, μὴ φιλονείκει αὐτῷ, μήποτε²⁹ ὁμόσαντος αὐτοῦ δισσῶς ἁμαρτάνεις³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/004.yaml
  text: But if he denies it, do not contend with him, lest, when he swears, you sin doubly.
translation:
  language: ru
  text: Но если он отрицает это, не вступай с ним в спор, чтобы, когда он поклянётся, ты не согрешил вдвойне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρνεῖται
  choice: отрицает это
  rationale: Глагол передан естественным русским выражением; подразумеваемое дополнение «это» восстанавливает связь с предметом обвинения, не добавляя нового содержания.
- source_word: μὴ φιλονείκει αὐτῷ
  choice: не вступай с ним в спор
  rationale: Передаёт запрет спорить или препираться с человеком, сохраняя повелительную форму и межличностную направленность.
- source_word: ὁμόσαντος αὐτοῦ
  choice: когда он поклянётся
  rationale: Абсолютный генитив передан временным придаточным; объект или содержание клятвы в греческом не указаны и не добавляются.
- source_word: δισσῶς ἁμαρτάνεις
  choice: тебе не согрешить вдвойне
  rationale: Сохраняется обращение ко второму лицу и буквальная идея двойного согрешения; русская конструкция естественно зависит от предостережения «чтобы… не».
theological_decisions:
- issue: Кто совершает двойной грех
  choice: двойной грех относится к адресату наставления
  alternative: отнести грех к отрицающему и клянущемуся человеку
  rationale: Форма ἁμαρτάνεις — второе лицо единственного числа, тогда как отрицающий обозначен третьим лицом.
- issue: Нравственная оценка самой клятвы
  choice: не уточнять, истинна она или ложна и почему адресат согрешает вдвойне
  alternative: явно назвать клятву ложной или объяснить двойной грех
  rationale: Греческий текст оставляет эти детали невыраженными; уточнение разрешило бы сохранённую источником смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык; краткое нравственное наставление передано ясно и достойно. Синтаксис слегка перестроен ради естественности русского, при этом логика греческого условия и предостережения сохранена.
