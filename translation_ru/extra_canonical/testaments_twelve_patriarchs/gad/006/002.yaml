base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/002.yaml
  text: For I myself, in my father’s presence, spoke peaceably to Joseph; but when I had gone out from him, the spirit of hatred darkened my mind and disturbed my thoughts to kill him.
translation:
  language: ru
  text: Ведь я в присутствии отца мирно говорил с Иосифом; но, уйдя от него, дух ненависти омрачал мой ум и смущал мои помыслы, направляя их к тому, чтобы убить его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ πρόσωπον τοῦ πατρὸς μου
  choice: в присутствии отца
  rationale: Естественно передаёт идиому «перед лицом моего отца», то есть в его присутствии.
- source_word: εἰρηνικὰ ἐλάλουν
  choice: мирно говорил
  rationale: 'Сохраняет наречный смысл: речь была мирной, дружелюбной.'
- source_word: τὸ πνεῦμα τοῦ μίσους
  choice: дух ненависти
  rationale: Формально сохраняет персонифицированное или духовное обозначение источника ненависти, не сводя его к одному психологическому состоянию.
- source_word: ἐσκότιζέ μου τὸν νοῦν
  choice: омрачил мой ум
  rationale: Точно и естественно передаёт метафору затемнения νοῦς.
- source_word: ἐτάρασσέ μου τὸν λογισμόν
  choice: возмутил мои помыслы
  rationale: «Помыслы» передаёт λογισμός как внутренние мысли и намерения; «возмутил» сохраняет образ внутреннего смятения.
- source_word: πρὸς τὸ ἀνελεῖν αὐτόν
  choice: побуждая убить его
  rationale: Передаёт направленность возмущённых помыслов к убийству, не добавляя прямо выраженного желания.
theological_decisions:
- issue: Онтологический статус «духа ненависти»
  choice: сохранить выражение «дух ненависти»
  alternative: перевести как «ненависть» или «дух, исполненный ненависти»
  rationale: Греческий текст допускает как духовно-персонифицированное, так и психологическое прочтение; буквальная конструкция сохраняет эту неоднозначность.
- issue: Связь πρὸς τὸ ἀνελεῖν с λογισμόν
  choice: передать как направленность или побуждение помыслов к убийству
  alternative: «так что я захотел убить его»
  rationale: В тексте нет отдельного глагола желания; перевод не должен превращать целевую направленность помысла в явно сформулированное волеизъявление.
translation_notes:
  register: Современный литературный русский с достоинством межзаветного наставительного текста. Синтаксис сделан естественным, но образность «духа ненависти», омрачения ума и возмущения помыслов сохранена.
