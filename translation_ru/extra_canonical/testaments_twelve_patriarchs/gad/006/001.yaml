  text: 'And now, my children, I urge you: let each one love his neighbor, and remove hatred from your hearts. Love one another in deed and word and in thought of soul.'
translation:
  language: ru
  text: 'И теперь, дети мои, призываю вас: пусть каждый любит своего ближнего и удалит ненависть из своих сердец. Любите друг друга делом, словом и мыслью души.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραινῶ
  choice: призываю
  rationale: Передаёт настойчивое нравственное увещание естественным и dignified современным русским словом.
- source_word: τὸν πλησίον αὑτοῦ
  choice: своего ближнего
  rationale: Точно сохраняет единственное число и взаимосвязь с ἕκαστος — «каждый».
- source_word: ἐξάρατε
  choice: удалите
  rationale: Передаёт повеление устранить ненависть из сердца без добавочного образного оттенка.
- source_word: ἐν ἔργῳ καὶ λόγῳ
  choice: делом, словом
  rationale: Естественная русская формула, сохраняющая инструментально-сферическое значение греческого выражения.
- source_word: διανοίᾳ ψυχῆς
  choice: помышлением души
  rationale: Сохраняет связь мысли или внутреннего разумения с душой и не сужает смысл до намерения.
theological_decisions:
- issue: Значение διανοίᾳ ψυχῆς
  choice: помышлением души
  alternative: намерением души; в мыслях души
  rationale: Выбранная формулировка сохраняет внутренний, мыслительный аспект любви и необычную конструкцию оригинала, не разрешая её в пользу одной узкой психологической категории.
translation_notes:
  register: Современный литературный русский язык с достоинством нравственного завещания. Сохранены прямое обращение «дети мои», переход от единственного «каждый» к множественному повелению и трёхчастная формула поступка, речи и внутренней мысли.
