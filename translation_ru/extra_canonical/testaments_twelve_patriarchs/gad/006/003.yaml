base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/003.yaml
  text: Love one another from the heart; and if anyone sins against you, speak peace to him, and in your soul hold no deceit; and if he confesses and repents, forgive him.
translation:
  language: ru
  text: Любите друг друга всем сердцем. Если кто согрешит против тебя, скажи ему слова мира¹ и не таи в душе обмана; если он, раскаявшись, признается, прости его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ καρδίας
  choice: от всего сердца
  rationale: Естественное русское выражение, передающее искренность и полноту сердечного отношения.
- source_word: ἁμαρτήσει εἰς σέ
  choice: согрешит против тебя
  rationale: Сохраняет нравственно-религиозный смысл ἁμαρτάνω и направленность проступка, выраженную εἰς σέ.
- source_word: εἰπὲ αὐτῷ ἐν εἰρήνῃ / εἰπὲ αὐτῷ εἰρήνην
  choice: говори с ним мирно
  rationale: Передает общий смысл двух греческих вариантов — мирный, не враждебный разговор — без неестественного русского оборота «скажи ему мир».
- source_word: μὴ κρατήσῃς δόλον
  choice: не таи коварства
  rationale: «Таить» естественно передает удерживание чего-либо в душе, а «коварство» сохраняет значение δόλος — обманный или злонамеренный умысел.
- source_word: ὁμολογήσας μετανοήσῃ
  choice: признается и раскается
  rationale: 'Передает оба действия: признание проступка и последующее раскаяние; порядок соответствует основному варианту β, Α, S¹ и английскому аудированному слою.'
- source_word: ἄφες αὐτῷ
  choice: прости его
  rationale: Нормальное современное русское выражение для прощения виновного; буквальное управление «прости ему» здесь менее естественно без названия проступка.
theological_decisions:
- issue: Соотношение признания, раскаяния и прощения
  choice: Если же он признается и раскается, прости его
  alternative: Если же он, раскаявшись, признается, прости его
  rationale: 'Греческие текстовые формы расходятся в порядке действий: α-текст ставит раскаяние перед признанием, а β, Α, S¹ — признание перед раскаянием. Выбран порядок, засвидетельствованный вторым вариантом и консультационным английским текстом, без добавления учения о механических условиях Божьего прощения.'
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксис сделан ясным для обычного читателя; архаизмы и конфессионально окрашенные формулы не использованы.
