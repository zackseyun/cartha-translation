    issue: 'Ст. 8: «И не от людей он научился этому»'
    rationale: В греческом субъект οἶδε/ἔμαθεν не выражен; русский «он» требует антецедента, которого в ближайшем контексте нет. Следует передать неопределённость без искусственно неясного местоимения и сохранить пояснение в сноске.
  - severity: low
    issue: 'Ст. 11: «страдая печенью»'
