  text: '1[a]. Hatred, then, is evil, because it keeps company with falsehood continually, speaking against the truth; it makes small things great, presents light as darkness, and calls the sweet bitter. It teaches slander, stirs up wrath and war, and fills the heart with insolence and every greed, with evils and a devilish poison.


    2. Therefore I say these things to you from experience, my children, so that you may drive out the devilish hatred and cling to the love of God. 3. Righteousness casts out hatred, and humility removes jealousy[b]. For the righteous man, being humble, is ashamed to do what is unjust, not because he is condemned by another, but by his own heart, because the Lord watches over his soul. 4. He does not speak against a holy man, because the fear of God dwells in him. 5. For, fearing lest he offend the Lord, he does not wish at all, not even in thought, to wrong a man.


    6. These things I learned at last after I repented concerning Joseph. 7. For true repentance according to God [removes ignorance and] puts darkness to flight, enlightens the eyes, gives knowledge to the soul, and guides the purpose toward salvation. 8. And he did not learn this from men, but through repentance he knows how to receive those who turn back.


    9. For God brought upon me a disease of the liver, and if the prayers of my father had not helped me, my spirit would almost have failed. 10. For by the very things through which a man transgresses, through those he is punished. 11. Since, then, my liver lay pitilessly set against Joseph, I too, suffering in my liver[c], was judged pitilessly for ten years.'
translation:
  language: ru
  text: '1. Итак, ненависть — зло, потому что она постоянно водится с ложью и говорит против истины; малое она делает великим, свет выдаёт за тьму, а сладкое называет горьким. Она учит клевете, разжигает гнев и войну и наполняет сердце дерзостью, всякой алчностью, злом и дьявольским ядом.


    2. Поэтому, дети мои, я говорю вам это по собственному опыту, чтобы вы изгнали дьявольскую ненависть и прилепились к любви Божьей. 3. Праведность изгоняет ненависть, а смирение устраняет ревность[a]. Ведь праведный и смиренный человек стыдится поступать несправедливо — не потому, что его осуждает другой, а потому, что его осуждает собственное сердце, ибо Господь наблюдает за его душой. 4. Он не злословит святого человека, потому что в нём обитает страх Божий. 5. Боясь оскорбить Господа, он вовсе не желает причинить человеку несправедливость — даже в мыслях.


    6. Это я понял лишь впоследствии, раскаявшись в своём отношении к Иосифу. 7. Ибо истинное покаяние по Богу [устраняет неведение и][b] обращает тьму в бегство, просвещает глаза, даёт душе знание и направляет намерение ко спасению. 8. И не от людей этому научаются, но через покаяние узнают, как принимать тех, кто обращается[c].


    9. Бог наслал на меня болезнь печени, и если бы молитвы моего отца не помогли мне, дух мой едва не угас. 10. Ибо чем человек преступает закон, тем он и наказывается. 11. Поскольку моя печень была безжалостно настроена против Иосифа, я и сам, страдая от болезни печени, был безжалостно судим десять лет[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «зависть». Греческое слово может обозначать как враждебную ревность, так и завистливое соперничество.'
    reason: lexical_alternative
  - marker: b
    text: Слова «устраняет неведение и» текстологически не вполне надёжны в греческом свидетельстве, поэтому заключены в квадратные скобки.
    reason: textual_variant
  - marker: c
    text: Субъект этой фразы в греческом тексте не назван явно. Вероятнее всего, имеется в виду Бог, принимающий через покаяние обращающихся; возможно и иное синтаксическое понимание.
    reason: ambiguity
  - marker: d
    text: 'Буквально: «десять времён (периодов)». Единица времени в греческом тексте не указана; перевод «лет» является контекстуальным истолкованием.'
    reason: alternative_reading
lexical_decisions:
- source_word: μῖσος
  choice: ненависть
  rationale: Абстрактное существительное сохраняет основную тему порока и естественно повторяется по всему отрывку.
- source_word: ἐνδελεχεῖ συνεχῶς τῷ ψεύδει
  choice: постоянно водится с ложью
  rationale: Передаёт длительную тесную связь и сохраняет олицетворение ненависти, союзной лжи.
- source_word: τὸ φῶς σκότος παρέχει
  choice: свет выдаёт за тьму
  rationale: Естественная русская формулировка сохраняет нравственное переворачивание понятий.
- source_word: συκοφαντίαν
  choice: клевете
  rationale: Кратко и точно передаёт злонамеренное ложное обвинение в контексте перечня пороков.
- source_word: ὕβριν
  choice: дерзостью
  rationale: Передаёт вызывающую, оскорбительную самонадеянность, не сводя значение только к внутренней гордости.
- source_word: πλεονεξίαν
  choice: алчностью
  rationale: Современное литературное слово для ненасытного стремления приобретать и присваивать.
- source_word: τὸ ζῆλος
  choice: ревность
  rationale: Сохраняет широту греческого слова между враждебной ревностью и завистливым соперничеством; альтернатива отмечена в сноске.
- source_word: μετάνοια
  choice: покаяние
  rationale: В стихах 7–8 слово обозначает нравственно-религиозное обращение, а не только интеллектуальную перемену мнения.
- source_word: τὸ διαβούλιον
  choice: намерение
  rationale: Передаёт внутренний замысел или решение, направляемое покаянием ко спасению.
- source_word: χρόνους δέκα
  choice: десять лет
  rationale: Сохраняет принятую в данной редакционной традиции временную интерпретацию, но неопределённость буквального выражения отмечена в сноске.
theological_decisions:
- issue: μετανοῆσαί με περὶ Ἰωσήφ в ст. 6
  choice: раскаявшись в своём отношении к Иосифу
  alternative: изменив своё мнение об Иосифе
  rationale: Контекст включает и пересмотр отношения, и нравственное раскаяние; русская формулировка не сводит действие к чисто интеллектуальной перемене.
- issue: Сомнительная фраза ἀναιρεῖ τὴν ἄγνοιαν καὶ в ст. 7
  choice: сохранить в квадратных скобках
  alternative: опустить как вторичную вставку
  rationale: Скобки честно отражают текстологическую неуверенность греческого свидетельства.
- issue: Субъект в ст. 8
  choice: сохранить мужское местоимение «он», вероятнее всего относящееся к Богу
  alternative: считать субъектом кающегося человека или перестроить безлично
  rationale: Греческий текст допускает синтаксическую неясность; перевод сохраняет её, а сноска обозначает наиболее вероятное понимание без догматического разрешения.
- issue: Принцип воздаяния в ст. 10
  choice: чем человек преступает закон, тем он и наказывается
  alternative: через что человек беззаконствует, через то и терпит наказание
  rationale: Сохраняется риторическая соразмерность проступка и наказания без расширения в универсальную доктринальную формулу.
- issue: χρόνους δέκα в ст. 11
  choice: десять лет
  alternative: десять периодов; десять месяцев
  rationale: Контекст не называет единицу времени буквально. Основной текст следует принятому чтению «лет», а сноска сохраняет реальную неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Сохранены олицетворение ненависти, параллелизм нравственных противопоставлений и намеренно резкая связь печени как средоточия вражды с болезнью печени. Архаизмы ограничены устойчивыми религиозными выражениями («любовь Божья», «страх Божий», «ко спасению»).
