  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003.yaml
  text: '1[a]. And now hear a word of truth: listen in order to practice righteousness and every law of the Most High, and do not be led astray, my children, by the spirit of hatred, because it is evil in all the deeds of men. 2. For whatever the one who hates may do, it is abominable. If someone does the law of the Lord[b], the hater does not praise him. If someone fears the Lord and desires what is righteous, the hater does not love him. 3. He reproaches the truth, envies the one who prospers, embraces slander, and loves arrogance, because hatred blinds his soul, as it did mine when I looked at Joseph.'
translation:
  language: ru
  text: 1[a]. А теперь выслушайте слово истины, чтобы творить праведность и исполнять всякий закон Всевышнего. И не позволяйте духу ненависти вводить вас в заблуждение, дети мои, потому что он несёт зло во всех человеческих делах. 2. Всё, что делает ненавидящий, отвратительно. Если кто исполняет закон Господа, ненавидящий его не хвалит. Если кто боится Господа и желает того, что праведно, ненавидящий его не любит. 3. Он порицает истину, завидует преуспевающему[b], охотно принимает клевету и любит высокомерие, потому что ненависть ослепляет его душу, как ослепляла и мою, когда я смотрел на Иосифа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выслушайте истинное слово»; греческое выражение допускает оба понимания.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «тому, кто добивается успеха»; возможно также: «тому, кто поступает правильно». В контексте зависти вероятнее значение успешного действия.'
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον ἀληθείας
  choice: слово истины
  rationale: Сохраняет торжественную увещательную формулу и неоднозначную связь двух существительных; возможное понимание «истинное слово» отмечено в сноске.
- source_word: τοῦ ποιεῖν δικαιοσύνην
  choice: чтобы творить праведность
  rationale: Передаёт целевое значение инфинитива и библейский этический смысл δικαιοσύνη без сужения до общественной справедливости.
- source_word: πάντα νόμον ὑψίστου
  choice: исполнять всякий закон Всевышнего
  rationale: «Всякий закон» сохраняет дистрибутивный смысл πάντα, а добавленное по-русски «исполнять» естественно связывает оборот с призывом к действию.
- source_word: πλανᾶσθε ... τῷ πνεύματι τοῦ μίσους
  choice: не позволяйте духу ненависти вводить вас в заблуждение
  rationale: Передаёт средне-страдательный оттенок глагола и сохраняет образ духа ненависти как действующей нравственно-духовной силы.
- source_word: βδελυκτόν
  choice: отвратительно
  rationale: Сильное нравственное осуждение передано современным и весомым русским словом без архаизации.
- source_word: φοβεῖται Κύριον
  choice: боится Господа
  rationale: Сохранён традиционный библейский оборот, включающий благоговение и нравственную ответственность.
- source_word: θέλει τὸ δίκαιον
  choice: стремится к праведному
  rationale: Передаёт волевую направленность θέλει и сохраняет связь с δικαιοσύνη в первом стихе.
- source_word: τῷ κατορθοῦντι
  choice: преуспевающему
  rationale: В сочетании с завистью наиболее вероятен смысл успешного действия или благополучного исхода; неоднозначность отмечена в сноске.
- source_word: καταλαλιὰν ἀσπάζεται
  choice: приветствует клевету
  rationale: Сохраняет образ охотного принятия злоречия, оставаясь естественным по-русски.
- source_word: ἐκτυφλοῖ
  choice: ослепляет
  rationale: Прямо передаёт метафору нравственной слепоты и её продолжающееся действие.
theological_decisions:
- issue: Олицетворение ненависти как духовной силы
  choice: «дух ненависти» с личными местоимениями и активным действием
  alternative: «ненавистное расположение» или «дух, исполненный ненависти»
  rationale: Греческий текст допускает нравственно-психологическое и квазиличностное прочтение. Формулировка сохраняет эту напряжённость, не утверждая прямо демонологического толкования.
- issue: Смысл праведности и праведного
  choice: «праведность» и «праведное»
  alternative: «справедливость» и «справедливое» либо «то, что правильно»
  rationale: В контексте закона Всевышнего речь идёт о целостном правильном поведении перед Богом, а не только о социальной справедливости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис упрощён там, где буквальное воспроизведение греческих конструкций звучало бы тяжеловесно, но повтор «ненавидящий» сохранён ради риторического рисунка и ясности субъекта.
