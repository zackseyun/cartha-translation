  terminology: «Ненависть», «беззаконие», «ближний», «малодушие», «долготерпение», «сатана», «закон Божий» уместны. «Доносит на него его господину» точно передаёт враждебное обращение к господину; сноска корректно отмечает возможный оттенок выражения.
