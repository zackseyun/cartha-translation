  source_fidelity: 'В целом перевод точно передаёт персонификацию ненависти и любви, нравственно-судебные образы и противопоставление духов. Однако в ст. 3 «предали смерти» сильнее греческого ἀποθάνῃ («умер»): текст выражает злорадное стремление к смерти брата, не обязательно формальное приведение приговора в исполнение. В ст. 5 πάντοτε означает «всегда», а не «всякий раз».'
