base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004.yaml
  text: Therefore guard yourselves[a], my children, from hatred, because it works lawlessness even against the Lord himself. For it does not want to hear the words of his commandments concerning love of one's neighbor, and it sins against God. For if a brother falls, it is eager at once to report it to everyone, and it hastens that he may be judged and punished and die. And if it is some servant, it brings accusations against him before his master, and in every distress it rejoices over him, if perhaps he may be put to death. For hatred works together with envy also against those who prosper; hearing of their success and seeing it, it is always weakened. Just as love would even make the dead alive and would call back those under sentence of death, so also hatred wants to kill the living, and it does not want those who have sinned only a little to live. For the spirit of hatred, through faintheartedness, works together with Satan in everything for the death of men; but the spirit of love,
    through longsuffering[c][b], works together with the law of God for the salvation of men.
translation:
  language: ru
  text: '**Завещание Гада 4**


    1 Итак, дети мои, остерегайтесь ненависти, потому что она поступает беззаконно даже против Самого Господа. 2 Ведь она не желает слушать слов Его заповедей, касающихся любви к ближнему, и грешит против Бога. 3 Если брат падёт, ненависть спешит тотчас рассказать об этом всем и добивается, чтобы его осудили, наказали и он умер. 4 А если это раб, она доносит на него его господину[a] и при всякой его беде злорадствует, надеясь, что его умертвят. 5 Ибо ненависть действует заодно с завистью, в том числе против преуспевающих: слыша об их успехе и видя его, она всегда изнемогает. 6 Как любовь желает оживить даже мёртвых и вернуть осуждённых на смерть, так ненависть желает убить живых и не хочет, чтобы согрешившие в малом[b] оставались в живых. 7 Ибо дух ненависти через малодушие[c] во всём действует вместе с сатаной ради гибели людей, а дух любви через долготерпение действует вместе с законом Божьим ради спасения людей.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «настраивает против него его господина». Греческое выражение допускает несколько оттенков, но в данном контексте указывает на враждебный донос властному лицу.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «согрешившие лишь немного». Выражение может обозначать как небольшой проступок, так и малую степень вины.'
    reason: lexical_alternative
  - marker: c
    text: Греческое слово может также означать упадок духа, робость или трусость; буквально оно связано с представлением о «малости души».
    reason: lexical_alternative
lexical_decisions:
- source_word: μῖσος
  choice: ненависть
  rationale: Абстрактное существительное сохранено и последовательно персонифицировано как деятельная нравственная сила.
- source_word: ἀνομίαν ποιεῖ
  choice: поступает беззаконно
  rationale: Передаёт идиому естественным современным русским языком, сохраняя активное совершение беззакония.
- source_word: λόγων ἐντολῶν αὐτοῦ
  choice: слов Его заповедей
  rationale: Оба греческих существительных сохранены, чтобы не сводить выражение просто к «заповедям».
- source_word: ἀγάπης τοῦ πλησίον
  choice: любви к ближнему
  rationale: Устоявшееся и ясное библейское выражение в современном русском языке.
- source_word: πέσῃ
  choice: падёт
  rationale: 'Сохраняет образ и некоторую неоднозначность греческого глагола: речь может идти о нравственном падении либо постигшей человека беде.'
- source_word: συμβαλεῖ αὐτὸν πρὸς τὸν κύριον αὐτοῦ
  choice: доносит на него его господину
  rationale: Контекст требует враждебного сообщения властному лицу; формулировка остаётся краткой, а неоднозначность отмечена в сноске.
- source_word: ἐπιχαίρει αὐτῷ
  choice: при всякой его беде злорадствует
  rationale: «Злорадствует» естественно выражает предосудительную радость по поводу чужого страдания.
- source_word: ἐν προκοπῇ
  choice: об их успехе
  rationale: Передаёт продвижение и благополучие преуспевающих без излишней конкретизации.
- source_word: ἀνακαλέσασθαι
  choice: вернуть
  rationale: В контексте осуждённых на смерть означает желание отозвать или возвратить их от смертного приговора; краткий глагол сохраняет сильную параллель с оживлением.
- source_word: ὀλιγοψυχίας
  choice: малодушие
  rationale: Ближайший русский эквивалент буквального представления о «малости души», допускающий трусость и упадок духа.
- source_word: μακροθυμίᾳ
  choice: долготерпение
  rationale: Сохраняет традиционный библейский нравственный термин и противопоставление малодушию.
theological_decisions:
- issue: Персонификация ненависти и любви как деятельных сил
  choice: Сохранять ненависть и любовь как персонифицированные силы, переходя в стихе 7 к выражениям «дух ненависти» и «дух любви».
  alternative: Передавать их только как человеческие чувства или склонности.
  rationale: Греческий текст сам переходит от отвлечённых существительных к явному πνεῦμα; перевод не сводит духовное измерение к психологии и не превращает его в разработанную демонологию.
- issue: Животворящее действие любви в стихе 6
  choice: Сохранить сильные образы оживления мёртвых и возвращения осуждённых на смерть.
  alternative: Ослабить до общего смысла «любовь всем помогает» либо однозначно истолковать как буквальное воскресение.
  rationale: Текст допускает звучание как яркой нравственной гиперболы, так и более сильного богословского образа; перевод не разрешает эту напряжённость за читателя.
- issue: Содействие закону Божьему
  choice: 'Перевести буквально-направленно: дух любви «действует вместе с законом Божьим».'
  alternative: Истолковать как «исполняет закон Божий» или «действует по Божьей воле».
  rationale: Так сохраняется необычная конструкция συνεργεῖ τῷ νόμῳ и параллель с действием духа ненависти вместе с сатаной.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сделан доступным для обычного читателя, но сохранены параллелизм, персонификация нравственных сил и повтор «действует вместе». Формы «Самого Господа», «закон Божий» и «долготерпение» поддерживают сакральный регистр без конфессиональной конкретизации.
