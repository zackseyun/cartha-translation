  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007.yaml
  text: 1[a]. But if someone prospers more than you, do not be grieved; rather, pray for him, that he may be brought to completion. For in this way it is to your advantage. 2. And if he is exalted still more[b], do not envy him, remembering that all flesh will die. But offer hymns to the Lord, who gives good and profitable things to all people. 3. Examine the judgments of the Lord, and your purpose will be illumined and be at rest. 4. But if someone grows rich through evil, like Esau my father's brother, do not be jealous; rather, wait for the appointed limit of the Lord. 5. For if what was taken away in evil is taken from him, or if he repents, he is forgiven; but if he remains unrepentant, he is kept for eternal punishment. 6. For the poor man, if being free from envy in all things he is pleasing to the Lord, is richer than all, because he does not have the distraction of vain people. 7. Therefore cast out hatred from your souls[d][c], and love one another in deed and in word and in the
    disposition of your soul.
translation:
  language: ru
  text: 1. Если же кто-то преуспевает больше вас, не огорчайтесь, но молитесь о нём, чтобы он достиг полноты[a]. Ведь это полезно и для вас. 2. И если он возвысится ещё больше, не завидуйте ему, помня, что всякая плоть умрёт. Но возносите Господу хвалебные песни — Тому, кто даёт всем людям доброе и полезное. 3. Исследуй суды Господа — и твой замысел озарится и успокоится. 4. Если же кто-нибудь разбогатеет благодаря злу, как Исав, брат моего отца, не завидуйте ему, но ожидайте предела, установленного Господом[b]. 5. Если это отнимается через бедствия[c], кающегося Он прощает; если же тот остаётся нераскаянным, то сохраняется для вечного наказания[d]. 6. Ведь бедняк, если он никому не завидует и во всём угождает Господу, богаче всех, потому что его не отвлекает суета людская. 7. Итак, исторгните ненависть из своих душ и любите друг друга с искренним сердцем.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы он стал совершенным»; греческое слово может указывать и на завершение, и на совершенство.'
    reason: lexical_alternative
  - marker: b
    text: Греческое выражение можно также понять как «назначенного Господом срока» или «решения Господа».
    reason: lexical_alternative
  - marker: c
    text: 'Греческий текст этого предложения труден. «Это» (греч. множественное число) вероятно относится к неправедно приобретённому, но сам предмет не назван. Возможен также перевод: «Если Он отнимает это через бедствия, то прощает кающегося».'
    reason: textual_difficulty
  - marker: d
    text: Греческое αἰώνιος обычно переводится здесь как «вечный», но буквально связано со словом «век»; возможно также понимание «относящийся к грядущему веку».
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐοδοῦται
  choice: преуспевает
  rationale: В данном нравственном наставлении глагол означает благополучие или успех, а не буквальное удачное путешествие.
- source_word: τελειωθῇ
  choice: достиг полноты
  rationale: Передаёт идею завершённости и зрелого итога, не ограничивая её материальным преуспеванием и не вводя технического учения о совершенстве.
- source_word: συμφέρον
  choice: полезно
  rationale: Естественно выражает пользу для адресатов и поддерживает смысловую связь с συμφέροντα в стихе 2.
- source_word: ὑψοῦται
  choice: возвысится
  rationale: Сохраняет возможность социального возвышения или роста положения.
- source_word: πᾶσα σὰρξ
  choice: всякая плоть
  rationale: Сохраняет традиционную библейскую формулу смертности в понятном русском выражении.
- source_word: ὕμνους προσφέρετε
  choice: возносите хвалебные песни
  rationale: Глагол «возносите» сохраняет оттенок приношения, а сочетание остаётся естественным для современного русского читателя.
- source_word: κρίματα Κυρίου
  choice: суды Господа
  rationale: Формулировка допускает как Божьи решения, так и Его судебные деяния, не сужая значение до предписаний.
- source_word: διαβούλιον
  choice: замысел
  rationale: Передаёт внутреннее намерение или обдуманное решение; сохраняет образ того, что оно может быть озарено и обрести покой.
- source_word: ὅρον Κυρίου
  choice: предел, установленный Господом
  rationale: Сохраняет основное значение границы или назначенной меры и одновременно делает ясной принадлежность установления Господу.
- source_word: ἄφθονος
  choice: никому не завидует
  rationale: Передаёт нравственную свободу от зависти; местоименная формулировка естественно связывает качество бедняка с окружающими людьми.
- source_word: περισπασμὸν τῶν ματαίων ἀνθρώπων
  choice: его не отвлекает суета людская
  rationale: Передаёт одновременно отвлечение и пустую, суетную направленность человеческих забот, избегая неестественного буквального сочетания.
- source_word: ἐν εὐθύτητι καρδίας
  choice: с искренним сердцем
  rationale: В этическом контексте «прямота сердца» означает искренность и отсутствие лукавства; выбран естественный современный русский эквивалент.
theological_decisions:
- issue: Значение τελειωθῇ в молитве о преуспевающем человеке
  choice: «чтобы он достиг полноты»
  alternative: «чтобы он стал совершенным»; «чтобы его успех достиг завершения»
  rationale: Перевод сохраняет как нравственную, так и целевую завершённость и не сводит просьбу к дальнейшему материальному успеху.
- issue: Смысл ὅρον Κυρίου при неправедном богатстве
  choice: «предел, установленный Господом»
  alternative: «срок Господа»; «решение Господа»
  rationale: Греческое ὅρος может обозначать границу, меру или установленный срок. Основной текст сохраняет образ предела, а примечание указывает другие контекстуально возможные оттенки.
- issue: Смысл αἰωνίαν κόλασιν
  choice: «вечное наказание»
  alternative: «наказание грядущего века»; «вековое наказание»
  rationale: «Вечное наказание» является прямым и естественным прочтением в контексте предостережения, однако семантическая связь αἰώνιος с «веком» отмечена без догматического разрешения вопроса.
- issue: Неясная смена подлежащего в стихе 5
  choice: Явно назван Господь как прощающий, а неправедно разбогатевший — как лишающийся богатства или кающийся
  alternative: Безличное чтение либо понимание ἀφαιρεῖται как действия, совершаемого Богом
  rationale: Такой перевод делает трудный греческий синтаксис читаемым, но текстовая и синтаксическая неуверенность сохранена в примечании.
translation_notes:
  register: 'Современный литературный русский с достоинством библейского наставления. Сохранены обращения во множественном числе и формула «всякая плоть». Архаизмы ограничены прозрачными словами «возносите» и «исторгните». Стих 7 переведён строго по предоставленному греческому тексту: после «любите друг друга» следует только ἐν εὐθύτητι καρδίας; расширенная фраза английского консультационного слоя не внесена.'
