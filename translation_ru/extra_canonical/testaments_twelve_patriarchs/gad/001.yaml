  language: ru
  text: 'Завещание Гада, 1


    1. Список завещания Гада — того, что он сказал своим сыновьям на сто двадцать пятом году своей жизни:


    2. «Послушайте, дети мои. Я был девятым сыном Иакова и отличался отвагой, когда пас стада.


    3. По ночам я стерёг стадо, и если на него нападал лев, волк или какой-нибудь другой зверь, я гнался за ним, настигал его, хватал рукой за лапу, швырял на расстояние броска камня и убивал.[a]


    4. Иосиф, брат мой, пас вместе с нами около тридцати дней, но был он ещё юн и ослабел от зноя.


    5. Он вернулся в Хеврон к нашему отцу, и тот уложил его рядом с собой, потому что очень любил его.


    6. Иосиф сказал нашему отцу, что сыновья Зелфы и Валлы закалывают лучших животных из стада и едят их без ведома Рувима и Иуды.


    7. Ведь он видел, как я вырвал ягнёнка из пасти медведицы и убил её. Ягнёнка же я заколол, скорбя о нём, потому что он уже не мог выжить, и мы съели его.


    8. За это я таил злобу на Иосифа до того дня, когда его продали.


    9. Дух ненависти был во мне, и я не хотел ни слышать Иосифа, ни видеть его, потому что он прямо обличил нас, сказав, что мы ели животных из стада без Иуды. Ведь отец верил всему, что Иосиф ему говорил».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческие рукописи в этом месте различаются в деталях, а выражение о том, как Гад расправлялся со зверем, синтаксически трудно. Основной смысл ясен: охраняя стадо, Гад настигал нападавшего зверя, хватал его за лапу, швырял на расстояние броска камня и убивал.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀντίγραφον διαθήκης
  choice: список завещания
  rationale: 'Сохраняет формальный характер заглавия: ἀντίγραφον обозначает письменную копию или список, а διαθήκη в жанровом контексте — завещание.'
- source_word: ἀνδρεῖος ἐπὶ τῶν ποιμνίων
  choice: отличался отвагой, когда пас стада
  rationale: ἀνδρεῖος выражает храбрость и силу; естественная русская конструкция передаёт это качество в пастушеском контексте.
- source_word: ἐμαλακίσθη ὑπὸ τοῦ καύσωνος
  choice: ослабел от зноя
  rationale: Передаёт физическую слабость юного Иосифа под действием сильной жары без лишнего уточнения причины или тяжести состояния.
- source_word: τὰ θρέμματα
  choice: животные из стада
  rationale: Термин шире овец и может обозначать выращиваемый скот; контекст стада сохранён, но значение не сужено до конкретного вида животных.
- source_word: παρὰ γνώμην
  choice: без ведома
  rationale: В данном контексте выражение указывает на действие без согласия или одобрения названных братьев; «без ведома» звучит естественно и не усиливает обвинение.
- source_word: ἐνεκότουν
  choice: таил злобу
  rationale: Глагол обозначает продолжительную враждебность или злопамятство, а не кратковременный гнев; это согласуется с последующим «духом ненависти».
- source_word: τὸ πνεῦμα τοῦ μίσους
  choice: дух ненависти
  rationale: Буквально сохраняет центральный нравственно-духовный образ текста, не сводя его ни к простой эмоции, ни к однозначно демонической личности.
- source_word: κατὰ πρόσωπον ἤλεγξεν
  choice: прямо обличил
  rationale: Передаёт открытую, личную конфронтацию; русское «обличил» сохраняет нравственный смысл ἐλέγχω.
- source_word: διαπράσεως
  choice: когда его продали
  rationale: В повествовании об Иосифе слово относится к совершившейся передаче или продаже; перевод делает подразумеваемое событие понятным, не добавляя покупателей или цену.
theological_decisions:
- issue: Природа «духа ненависти»
  choice: Сохранено выражение «дух ненависти» без пояснения, является ли это духовным существом, олицетворением порока или властвующим внутренним состоянием.
  alternative: «Ненависть овладела мной» или «злой дух ненависти был во мне».
  rationale: Греческий текст допускает нравственно-психологическое и личностно-духовное прочтение; перевод не должен устранять эту неоднозначность.
- issue: Характер обвинения Иосифа против братьев
  choice: Передано, что они ели животных «без ведома Рувима и Иуды».
  alternative: «Вопреки решению Рувима и Иуды» или «без разрешения Рувима и Иуды».
  rationale: παρὰ γνώμην может подразумевать отсутствие согласия, но степень полномочий Рувима и Иуды текст не разъясняет; нейтральная формулировка не вводит дополнительной семейной иерархии.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным завещательным тоном. Речь Гада передана ясно и непосредственно; архаизмы сведены к минимуму. Перевод следует представленному греческому тексту главы 1, а не расширенному и иначе организованному английскому консультационному слою.
