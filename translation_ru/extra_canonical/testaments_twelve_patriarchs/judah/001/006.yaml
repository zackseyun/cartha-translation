  text: And when I had grown up, my father prayed for me, saying, ‘You shall be a king, prospering in all things.’
translation:
  language: ru
  text: 'И когда я возмужал, отец мой помолился обо мне, сказав: «Ты будешь царём, преуспевая во всём».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδρύνθην
  choice: возмужал
  rationale: Глагол описывает достижение зрелости или укрепление; «возмужал» естественно передаёт взросление мужчины в данном повествовательном контексте.
- source_word: ηὔξατό μοι
  choice: помолился обо мне
  rationale: Форма от εὔχομαι означает молитву или произнесение молитвенного пожелания; этот перевод точнее, чем «благословил меня», и сохраняет адресованное Иуде благопожелание.
- source_word: Βασιλεὺς ἔσῃ
  choice: Ты будешь царём
  rationale: Прямо передаёт именное сказуемое с будущей связкой, не уточняя характер или время царствования.
- source_word: κατευοδούμενος ἐν πᾶσιν
  choice: преуспевая во всём
  rationale: Причастие выражает успешное продвижение или благополучный исход во всех делах; деепричастный оборот сохраняет его связь с обещанием царского положения.
theological_decisions:
- issue: 'Характер слов отца: благословение или молитва'
  choice: помолился обо мне
  alternative: благословил меня
  rationale: Греческое ηὔξατό μοι непосредственно указывает на молитву или молитвенное пожелание. Перевод не превращает этот акт в более специальную формулу благословения.
- issue: Объём обещания «во всём»
  choice: сохранена абсолютная формулировка «во всём»
  alternative: во всех делах
  rationale: Текст оставляет πᾶσιν без явно названного существительного; буквальная широта формулировки сохраняет исходную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Инверсия «отец мой» поддерживает достоинство речи, оставаясь понятной; пунктуация прямой речи соответствует современной русской норме.
