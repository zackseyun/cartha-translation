  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/001/001.yaml
  text: 'The Testament of Judah, the fourth son of Jacob and Leah.


    A copy of the words of Judah, which he spoke to his sons before he died.'
translation:
  language: ru
  text: 'Завещание Иуды, четвёртого сына Иакова и Лии


    1. Список слов Иуды, которые он сказал своим сыновьям перед своей смертью.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: Завещание
  rationale: В заглавии произведения слово обозначает предсмертное наставление, оформленное как завещание; это естественный и жанрово точный русский эквивалент.
- source_word: Ἀντίγραφον
  choice: Список
  rationale: Греческое слово означает письменную копию или переписанный экземпляр. «Список» сохраняет этот книжный смысл и звучит уместно в заголовочной формуле.
- source_word: λόγων
  choice: слов
  rationale: Прямой и естественный эквивалент, сохраняющий широкое значение λόγοι без уточнения как «речи» или «наставления».
- source_word: ἐλάλησε
  choice: сказал
  rationale: Нейтрально передаёт акт речи на современном литературном русском языке.
- source_word: πρὸ τοῦ ἀποθανεῖν αὐτόν
  choice: перед своей смертью
  rationale: Естественная русская передача оборота «прежде чем ему умереть» без изменения смысла.
