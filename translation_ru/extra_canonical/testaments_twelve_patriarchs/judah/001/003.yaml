    rationale: Фраза «Послушайте, дети мои, Иуду, вашего отца» в русском воспринимается как ошибочная конструкция. «Послушайте меня, Иуду, вашего отца» эксплицирует требуемый русским синтаксисом объект и соответствует говорящему от первого лица.
  - severity: low
    issue: Оборот о порядке рождения стилистически тяжеловесен.
    rationale: «Родившимся у моего отца» не является естественным современным способом сказать, что Иуда был четвёртым сыном Иакова.
