- from: '«Послушайте, дети мои, Иуду, вашего отца. Я был четвёртым сыном, родившимся у моего отца Иакова, и моя мать Лия нарекла меня Иудой, сказав: „Я воздаю хвалу Господу за то, что Он дал мне и четвёртого сына“».'
  to: '«Послушайте меня, дети мои, Иуду, вашего отца. Я был четвёртым сыном моего отца Иакова, и моя мать Лия нарекла меня Иудой, сказав: „Я воздаю хвалу Господу, потому что Он даровал мне ещё и четвёртого сына“».'
  rationale: 'Текст исправлен только для русской синтаксической ясности и естественности: добавлено подразумеваемое «меня» при призыве слушать говорящего, упрощён оборот о рождении и более ясно передано усилительное καί в заключительной цитате. Смысл, имена, регистр и контекстуальное исправление явно испорченного греческого оборота о Лии сохранены.'
