  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/001/003.yaml
  text: “Hear, my children, Judah your father. I was born the fourth son to my father Jacob, and Leah my mother named me Judah, saying, ‘I give praise to the Lord, because he has given me also a fourth son.’
translation:
  language: ru
  text: '«Послушайте меня, дети мои, Иуду, вашего отца. Я был четвёртым сыном моего отца Иакова, и моя мать Лия нарекла меня Иудой, сказав: „Я воздаю хвалу Господу, потому что Он даровал мне ещё и четвёртого сына“».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσατε
  choice: Послушайте
  rationale: Естественный современный призыв внимательно выслушать речь; сохраняет императив аориста.
- source_word: ἐγὼ τέταρτος υἱὸς ἐγενόμην τῷ πατρί μου Ἰακώβ
  choice: Я был четвёртым сыном, родившимся у моего отца Иакова
  rationale: Передаёт порядок рождения и устраняет неестественную для русского буквальную конструкцию «стал четвёртым сыном моему отцу».
- source_word: ἐπωνόμασέν με Ἰούδαν
  choice: нарекла меня Иудой
  rationale: Достоинный библейский оборот для наречения имени, понятный современному читателю.
- source_word: Ἀνθομολογοῦμαι τῷ Κυρίῳ
  choice: Я воздаю хвалу Господу
  rationale: Глагол выражает открытое благодарственное восхваление; формулировка сохраняет связь имени Иуды с хвалой.
- source_word: καὶ τέταρτον υἱόν
  choice: и четвёртого сына
  rationale: Сохранено усилительное καί («также, ещё и»), здесь естественно переданное частицей «и».
theological_decisions:
- issue: Референт подразумеваемого подлежащего в ἔδωκέν
  choice: Он дал
  alternative: дал
  rationale: В русском цитатном высказывании местоимение естественно указывает на непосредственно названного Господа, не добавляя нового богословского содержания.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Синтаксически дефектное чтение источника «Λεία ἡ μήτηρ μου ἤμην» понято по очевидному контексту и английскому контрольному слою как указание на Лию, мать Иуды; грамматическая порча в основной текст не перенесена.
