  text: I was keen in my youth, and I obeyed my father in every matter.
translation:
  language: ru
  text: В юности я был проворен и во всём слушался своего отца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀξύς
  choice: проворен
  rationale: В контексте рассказа Иуды о своих юношеских качествах слово передаёт живость, быстроту и деятельную расторопность. «Проворен» сохраняет эту широту лучше, чем интеллектуально окрашенное «проницателен» или слишком неопределённое «способен».
- source_word: ὑπήκουον
  choice: слушался
  rationale: Естественный современный русский эквивалент со значением послушания отцу, а не только слышания его слов.
- source_word: κατὰ πάντα λόγον
  choice: во всём
  rationale: Идиоматично передаёт всеохватность греческого выражения — послушание каждому слову или указанию отца — без неестественного буквального оборота.
