  text: 'And now I command you[a], my children: hear Judah your father, and keep my words, with thoughts set on doing all the righteous requirements of the Lord and obeying the commands of God.


    Because I boasted that in wars the face of a beautiful woman had not deceived me, and I reproached Reuben my brother concerning Bilhah, my father’s wife, the spirit of jealousy and of sexual immorality arrayed themselves against me, until I sinned with Anan the Canaanite woman and with Tamar my daughter-in-law.


    For I said to my father-in-law, “I will consult my father, and then I will take your daughter.” But he was unwilling; instead, in the name of his daughter, he showed me an immeasurable abundance of gold, for he was a king. And he adorned her with gold and pearls[d][c][b], and made her pour wine for us at the banquet.'
translation:
  language: ru
  text: '13


    1 И теперь я заповедую вам, дети мои: слушайте Иуду, отца вашего[a], и храните мои слова, чтобы исполнять все праведные установления Господа и повиноваться Божьим заповедям.


    2 Не следуйте своим желаниям и не ходите в гордыне сердца; не хвалитесь ни делами, ни силой своей юности, потому что и это — зло перед Господом.


    3 Ведь и я хвалился, что на войне меня не прельстило лицо красивой женщины[b], и укорял своего брата Рувима за Валлу, жену нашего отца[c]. Тогда дух ревности и разврата ополчился против меня, пока я не согрешил с хананеянкой[d] и с Фамарью, моей невесткой.


    4 Я сказал своему тестю: «Посоветуюсь с отцом и тогда возьму твою дочь». Но он не согласился, а показал мне несметное множество золота в связи с выдачей своей дочери[e], ведь он был царём. 5 Он украсил её золотом и жемчугом и велел ей в женском великолепии подавать нам вино на пиру.


    6 Вино исказило мой взгляд, а наслаждение помрачило моё сердце. 7 Я влюбился в неё и сошёлся с ней; так я преступил повеление Господа и повеление моего отца и взял её себе в жёны.


    8 И Господь воздал мне по замыслу моей души: я не познал радости в её детях.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начало греческого текста синтаксически неровно; общий смысл — призыв слушать Иуду как отца и хранить его наставление.
    reason: textual_variant
  - marker: b
    text: 'Греческая формулировка в этом месте трудна и в издании отмечена как сомнительная. В сохранившемся тексте отрицание не выражено, однако контекст хвастовства и последующего падения предполагает смысл: «меня не прельстило».'
    reason: textual_variant
  - marker: c
    text: Валла — женщина, с которой был связан проступок Рувима; см. Бытие 35:22.
    reason: cross_reference
  - marker: d
    text: Греческий текст называет её просто «хананеянкой»; имени «Анан» в этой фразе нет. Рассказ соотносится с хананеянкой, на которой женился Иуда, в Бытии 38:2.
    reason: lexical_alternative
  - marker: e
    text: 'Греческое выражение буквально связано с «выдачей её» и допускает разные толкования: богатство могло быть показано в связи с предполагаемым браком, как приданое или как средство склонить Иуду к браку.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐντέλλομαι
  choice: заповедую
  rationale: Сохраняет властную, завещательную силу отцовского наставления и естественно сочетается с последующими повелениями.
- source_word: φυλάξασθε τοὺς λόγους μου
  choice: храните мои слова
  rationale: Передаёт как бережное удержание наставления, так и предполагаемое послушание ему.
- source_word: δικαιώματα Κυρίου
  choice: праведные установления Господа
  rationale: Сохраняет нормативный смысл δικαιώματα и его связь с праведностью, отличая термин от ἐντολαί.
- source_word: ἐπιθυμιῶν
  choice: желаниям
  rationale: Нейтрально передаёт желания или влечения, не сужая значение до одной лишь похоти.
- source_word: πνεῦμα τοῦ ζήλου καὶ τῆς πορνείας
  choice: дух ревности и разврата
  rationale: Сохраняет олицетворённый язык нравственного противоборства; «разврат» ясно передаёт сексуальную распущенность без архаизма.
- source_word: παρετάξατο ἐπ᾽ ἐμέ
  choice: ополчился против меня
  rationale: Передаёт военную метафору греческого глагола и согласуется с единственным числом πνεῦμα.
- source_word: συνετέλεσα εἰς
  choice: согрешил с
  rationale: В исповедальном контексте передаёт нравственный смысл трудного эвфемистического оборота, не предлагая ложной точности.
- source_word: τὴν Χανανανίτην
  choice: хананеянкой
  rationale: В данном греческом тексте это определённое обозначение женщины по происхождению, а не засвидетельствованное здесь имя «Анан».
- source_word: εἰς δόσιν αὐτῆς
  choice: чтобы отдать её за меня
  rationale: Передаёт брачный контекст буквально трудного оборота, связывающего показ богатства с выдачей дочери.
- source_word: ἐν κάλλει γυναικῶν
  choice: во всей женской красе
  rationale: Естественно по-русски передаёт указание на привлекательное убранство и облик женщины на пиру.
- source_word: διέστρεψέν μου τοὺς ὀφθαλμούς
  choice: исказило мой взгляд
  rationale: Сохраняет образ искажения зрения вином, включая возможный переносный смысл нравственного восприятия.
- source_word: συνέπεσα εἰς αὐτήν
  choice: сошёлся с ней
  rationale: Сохраняет некоторую эвфемистичность выражения и в контексте допускает как сближение, так и половую связь.
- source_word: κατὰ τὸ διαβούλιον τῆς ψυχῆς μου
  choice: по замыслу моей души
  rationale: Формально отражает внутреннее решение или намерение Иуды, не подменяя его более узким «желанием».
theological_decisions:
- issue: Олицетворение порочных сил
  choice: Сохранить единого «духа ревности и разврата», который «ополчился» против Иуды.
  alternative: 'Передать это как внутренние чувства: «меня охватили ревность и похоть».'
  rationale: Грамматическое единственное число πνεῦμα и военная метафора поддерживают образ активной враждебной силы; перевод не определяет её онтологический статус.
- issue: Нравственный смысл συνετέλεσα
  choice: «пока я не согрешил с…»
  alternative: «пока я не вступил в связь с…» или буквальное «не довёл до конца с…».
  rationale: Текст носит характер покаянного предостережения; выбранная формулировка выявляет его нравственную оценку, сохраняя неопределённость самого действия.
- issue: Божественное воздаяние в стихе 8
  choice: «Господь воздал мне по замыслу моей души».
  alternative: «Господь воздал мне по желанию моей души».
  rationale: Сохраняется напряжение между собственным решением Иуды и последующим Божьим воздаянием без дополнительных догматических объяснений.
- issue: Различение δικαιώματα и ἐντολαί
  choice: «праведные установления» и «заповеди».
  alternative: Оба термина передать словом «заповеди».
  rationale: Лексическое различие исходного текста важно для риторики наставления и не затрудняет современного читателя.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксис умеренно библейский, но без архаизмов; имена переданы в привычной русской библейской форме (Иуда, Рувим, Валла, Фамарь). Нумерация стихов восстановлена по полному греческому источнику, поскольку английский консультационный слой неполон.
