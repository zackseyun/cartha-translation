  text: '*Ἐπάξει¹ δὲ αὐτοῖς Κύριος διαιρέσεις *κατ᾽ ἀλλήλων¹³, καὶ ἔσονται *συνεχεῖς ἔσονται³ ἐν Ἰσραήλ⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/022/001.yaml
  text: The Lord will bring divisions among them against one another, and continual wars will be in Israel.
translation:
  language: ru
  text: Господь наведёт на них раздоры между ними, и в Израиле будут непрестанные войны.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπάξει
  choice: наведёт
  rationale: Глагол ἐπάγω означает «наводить, навлекать, приводить на кого-либо»; «наведёт на них» естественно передаёт направленность действия.
- source_word: διαιρέσεις κατ᾽ ἀλλήλων
  choice: раздоры друг с другом
  rationale: Здесь διαιρέσεις обозначает разделения или распри внутри группы, а κατ᾽ ἀλλήλων — их взаимную направленность. «Раздоры друг с другом» звучит естественно и сохраняет смысл внутреннего противостояния.
- source_word: συνεχεῖς
  choice: непрестанные
  rationale: Прилагательное означает «непрерывные, постоянные»; в данном контексте «непрестанные» передаёт длительность и повторяемость войн.
- source_word: ἐν Ἰσραήλ
  choice: в Израиле
  rationale: Сохранено прямое географическое или общинное обозначение без дополнительного толкования.
theological_decisions:
- issue: Господь представлен как тот, кто наводит раздоры
  choice: 'Сохранить прямую причинную формулировку: «Господь наведёт»'
  alternative: «Господь допустит» или «среди них возникнут»
  rationale: Греческое ἐπάξει прямо приписывает действие Господу; смягчение до дозволения внесло бы отсутствующее в тексте богословское толкование.
- issue: Подразумеваемое существительное при συνεχεῖς
  choice: Передать как «непрестанные войны»
  alternative: «непрестанные распри» или буквальное неполное «будут непрестанные»
  rationale: В предоставленном греческом тексте существительное не выражено, однако форма множественного числа допускает его контекстуальное восполнение; «войны» соответствует древней переводческой традиции и проверочному английскому слою, не устраняя общего смысла продолжительного насилия в Израиле.
translation_notes:
  register: Современный литературный русский язык, сдержанный пророческий регистр. Синтаксис близок к греческому, но естественен для обычного читателя; архаизмы и конфессионально окрашенные уточнения не вводятся.
