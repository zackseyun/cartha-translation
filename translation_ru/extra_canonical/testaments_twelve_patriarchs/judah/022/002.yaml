  text: Καὶ ἐν ἀλλοφύλοις⁵ συντελεσθήσεται ἡ βασιλεία μου⁶, ἕως⁷ τοῦ ἐλθεῖν⁸ τὸ⁹ σωτήριον τοῦ¹⁰ Ἰσραήλ¹⁰,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/022/002.yaml
  text: And my kingdom will be brought to an end among foreigners, until the salvation of Israel comes,
translation:
  language: ru
  text: И среди иноплеменников царство моё придёт к концу, пока не придёт спасение Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἀλλοφύλοις
  choice: среди иноплеменников
  rationale: Передаёт пребывание царства в среде чужих народов; «иноплеменники» сохраняет библейский регистр без чрезмерной архаизации.
- source_word: συντελεσθήσεται
  choice: придёт к концу
  rationale: Естественно и точно выражает будущее завершение или прекращение; пассивная форма греческого допускает такой непереходный русский оборот.
- source_word: ἡ βασιλεία μου
  choice: царство моё
  rationale: Сохраняет значение βασιλεία и эмфатичный порядок с постпозицией притяжательного местоимения.
- source_word: ἕως τοῦ ἐλθεῖν
  choice: пока не придёт
  rationale: Идиоматически передаёт временную границу, обозначенную ἕως с субстантивированным инфинитивом.
- source_word: τὸ σωτήριον τοῦ Ἰσραήλ
  choice: спасение Израиля
  rationale: 'Сохраняет двусмысленность родительного падежа: спасение, принадлежащее Израилю, предназначенное ему или исходящее от него.'
theological_decisions:
- issue: Референт выражения «спасение Израиля»
  choice: Сохранено без уточнения личности или способа спасения
  alternative: «Спаситель Израиля» или «спасение для Израиля»
  rationale: Греческое τὸ σωτήριον обозначает спасение/избавление и не требует персонализации; родительный τοῦ Ἰσραήλ остаётся семантически открытым.
- issue: Характер прекращения царства
  choice: «царство моё придёт к концу»
  alternative: «моё царство будет уничтожено»
  rationale: συντελεσθήσεται указывает на завершение, но само по себе не уточняет насильственный характер; более сильная формулировка внесла бы лишнюю интерпретацию.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис следует структуре греческой фразы, оставаясь естественным для русского чтения.
