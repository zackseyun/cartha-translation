  source_fidelity: Текст точно передаёт греческое Καὶ ἐν ἀλλοφύλοις συντελεσθήσεται ἡ βασιλεία μου, ἕως τοῦ ἐλθεῖν τὸ σωτήριον τοῦ Ἰσραήλ. «Среди иноплеменников» соответствует ἐν ἀλλοφύλοις; «царство моё придёт к концу» адекватно передаёт будущее страдательное συντελεσθήσεται без неоправданного усиления; «пока не придёт» естественно выражает временной предел ἕως τοῦ ἐλθεῖν. «Спасение Израиля» сохраняет смысловую открытость τὸ σωτήριον τοῦ Ἰσραήλ.
