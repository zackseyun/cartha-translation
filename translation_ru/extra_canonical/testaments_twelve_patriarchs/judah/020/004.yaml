revisions:
- from: Ибо правитель заблуждения ослепил меня, и я, будучи человеком и плотью, растлённой грехами, не понимал и осознал собственную слабость, хотя считал себя непобедимым.
  to: Ибо правитель заблуждения ослепил меня, и я не ведал, как человек и как плоть, растлённый грехами, и познал свою слабость, считая себя непобедимым.
  rationale: Исправлены русская синтаксическая неясность и добавленная уступительная интерпретация. Сохранены образ «плоти», пассивный смысл «растлённый грехами», неуточнённый титул «правитель заблуждения» и неоднозначная связь заключительного причастного оборота.
