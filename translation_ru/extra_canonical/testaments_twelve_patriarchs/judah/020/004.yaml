base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/004.yaml
  text: 'For the ruler of deceit blinded me, and I was ignorant as a man, and, as flesh corrupted in sins, I recognized my own weakness, thinking myself invincible.


    5. Understand, then, my children, that two spirits attend a man: the spirit of truth and the spirit of deceit. 6. And between them is the conscience of the mind, to which it may incline as it wills. 7. The works of truth and the works of deceit are written upon the breast of a man, and the Lord knows each one of them. 8. And there is no time when the works of men can escape his notice, for they are inscribed before the Lord upon the breast.'
translation:
  language: ru
  text: Ибо правитель заблуждения ослепил меня, и я не ведал, как человек и как плоть, растлённый грехами, и познал свою слабость, считая себя непобедимым.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: правитель заблуждения
  rationale: Сохраняет личностное обозначение ἄρχων и широкий смысл πλάνη — заблуждение, обман, совращение, — не сужая его до одной разновидности лжи.
- source_word: ἠγνόησα
  choice: не понимал
  rationale: Передаёт отсутствие осознания или ведения естественным современным русским выражением.
- source_word: σὰρξ ἐν ἁμαρτίαις φθαρείς
  choice: плотью, растлённой грехами
  rationale: Сохраняет телесно-нравственную образность σάρξ и пассивный смысл причастия φθαρείς.
- source_word: ἐπέγνων τὴν ἐμαυτοῦ ἀσθένειαν
  choice: осознал собственную слабость
  rationale: ἐπιγινώσκω здесь означает распознание или полное осознание; «слабость» прямо передаёт ἀσθένεια.
- source_word: νομίζων ἀκαταμάχητος εἶναι
  choice: хотя считал себя непобедимым
  rationale: Причастный оборот выражает ошибочное представление Иуды; «хотя» естественно выявляет напряжение между осознанием слабости и прежней либо сопутствующей самоуверенностью.
theological_decisions:
- issue: Личность «правителя заблуждения»
  choice: Сохранено общее титульное выражение без отождествления.
  alternative: «дьявол» или «сатана»
  rationale: Греческий текст не называет эту фигуру прямо, поэтому конфессионально или интерпретационно уточнять её не следует.
- issue: Связь человеческой природы, плоти и греха
  choice: 'Сохранены оба параллельных определения: человек и плоть, растлённая грехами.'
  alternative: Свести их к утверждению о всеобщей греховности человеческой природы.
  rationale: Перевод не должен превращать образное признание говорящего в более широкую догматическую формулу.
- issue: Временное и логическое отношение νομίζων к основному глаголу
  choice: 'Передано уступительно: «хотя считал».'
  alternative: «считая себя непобедимым»
  rationale: Греческое причастие допускает некоторую неоднозначность, но буквальное русское присоединение создаёт впечатление, будто осознание слабости и уверенность в непобедимости логически совпадают; уступительная связь сохраняет напряжение без чрезмерного пояснения.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего наставительного текста. Синтаксис сделан ясным, но сохранены ключевые образы «правитель заблуждения», «плоть» и «непобедимый».
