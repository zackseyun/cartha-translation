base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/002.yaml
  text: Because of silver I lost my children; and if my repentance and my humiliation, and the prayers of my father, had not come to my aid, I would have died childless.
translation:
  language: ru
  text: Из-за серебра я, дети мои, потерял своих детей; и если бы моё покаяние, моё смирение и молитвы моего отца не пришли мне на помощь, я умер бы бездетным.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τὸ ἀργύριον
  choice: Из-за серебра
  rationale: Сохраняет буквальный образ и причинное значение предлога διά; «серебро» здесь может обозначать деньги, но нет необходимости устранять эту образность.
- source_word: τέκνα μου
  choice: дети мои
  rationale: Передаёт прямое обращение Иуды к потомкам и сохраняет его положение внутри первой части фразы.
- source_word: ἀπώλεσα τὰ τέκνα μου
  choice: потерял своих детей
  rationale: В данном контексте ἀπόλλυμι означает утрату детей; русский глагол «потерял» естественно передаёт смысл, не уточняя способ их гибели.
- source_word: μετάνοιά μου
  choice: моё покаяние
  rationale: Передаёт религиозно-нравственный смысл μετάνοια как раскаяния и обращения, не сводя его лишь к чувству сожаления.
- source_word: ταπείνωσίς μου
  choice: моё смирение
  rationale: Сохраняет традиционный и контекстуально уместный смысл ταπείνωσις — уничижение или смирение перед Богом.
- source_word: ηὐχαι τοῦ πατρός μου
  choice: молитвы моего отца
  rationale: ηὐχαί — орфографический вариант εὐχαί; множественное число передано прямо.
- source_word: συνεδράμον
  choice: пришли мне на помощь
  rationale: Идиоматически передаёт буквальное «сбежались вместе, содействовали» и соответствует функции перечисленных средств спасения.
- source_word: ἄτεκνος εἶχον ἀποθανεῖν
  choice: я умер бы бездетным
  rationale: Естественная русская условная конструкция точно передаёт контрфактический смысл перифразы.
theological_decisions:
- issue: Соотношение покаяния, смирения и молитв отца в избавлении Иуды
  choice: Сохранено совместное содействие всех трёх факторов без уточнения механизма спасения
  alternative: Истолковать их как основание божественного прощения или как непосредственную причину сохранения жизни
  rationale: Греческий текст лишь говорит, что они «пришли на помощь»; более точное богословское объяснение выходило бы за пределы источника.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксис слегка упрощён ради ясности, но повтор «дети мои / своих детей» сохранён, поскольку первое выражение является обращением, а второе — объектом утраты.
