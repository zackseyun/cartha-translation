  text: And the Spirit of truth accuses all, and the sinner is consumed from his own heart, and to lift up
translation:
  language: ru
  text: И дух истины обвиняет всех, а грешник охвачен огнём, исходящим из его собственного сердца[a], и не может поднять лицо перед судьёй.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «грешник охвачен огнём из собственного сердца»; выражение может указывать как на источник огня внутри самого грешника, так и на причину его мучения.'
    reason: Греческое ἐκ τῆς ἰδίας καρδίας допускает оттенки источника и причины, тогда как буквальная русская конструкция неестественна.
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: дух истины
  rationale: Сохранена форма греческого выражения без внесения отсутствующего в тексте уточнения о природе этого духа; строчная буква не предрешает богословскую идентификацию.
- source_word: κατηγορεῖ
  choice: обвиняет
  rationale: Глагол имеет прямое судебно-обвинительное значение, которое соответствует последующему упоминанию судьи.
- source_word: πάντων
  choice: всех
  rationale: Родительный падеж при κατηγορεῖ естественно передаётся как объект обвинения; личное «всех» уместно в контексте грешника и судьи, хотя форма сама по себе допускает более широкое понимание.
- source_word: ἐμπεπύρισται
  choice: охвачен огнём
  rationale: Перфектная пассивная форма обозначает наступившее и сохраняющееся состояние воспламенения; выражение передано естественно по-русски без усиления до полного уничтожения.
- source_word: ἆραι πρόσωπον
  choice: поднять лица
  rationale: Сохранён библейский образ поднятия лица как способности предстать перед судьёй без стыда или страха.
- source_word: πρὸς τὸν κριτὴν
  choice: перед судьёй
  rationale: Контекстуально естественная русская передача направления лица к судье; греческий текст явно содержит это выражение.
theological_decisions:
- issue: Идентификация «духа истины»
  choice: строчное «дух истины»
  alternative: «Дух истины» с прописной буквы
  rationale: Греческое письмо не устанавливает богословскую идентификацию посредством регистра; строчная буква сохраняет неоднозначность и не навязывает отождествление со Святым Духом.
- issue: Источник огня, поражающего грешника
  choice: огонь исходит из собственного сердца грешника
  alternative: грешник воспламенён собственным сердцем / из-за собственного сердца
  rationale: Предлог ἐκ выражает исходную точку или источник. Основной текст делает образ понятным, а примечание сохраняет буквальную конструкцию и её возможную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с сохранением возвышенного судебного образа. Синтаксис остаётся близким к греческому, но причинно-образная конструкция с ἐκ передана естественно и снабжена примечанием. Конечная фраза переведена полностью по предоставленному греческому источнику, где слова πρὸς τὸν κριτὴν οὐ δύναται присутствуют.
