source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: ὁδηγεῖ³, ὅτι⁴ ἐν πλάνῃ ἀργυρίου τοὺς μὴ ὄντας θεοὺς⁵ ὀνομάζουσι, καὶ ποιεῖ τὸν ἔχοντα⁷ αὐτὴν εἰς ἔκστασιν ἐμπεσεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/001.yaml
  text: For it leads astray, because in the delusion of silver they call those who are not gods gods, and it causes the one who has it to fall into ecstasy.
translation:
  language: ru
  text: 'Ибо она сбивает с пути: в заблуждении из-за серебра люди называют богами тех, кто не боги, и она заставляет того, кто ею обладает, впасть в исступление.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в экстатическое состояние»; греч. ἔκστασις может означать выход из обычного состояния, исступление или помрачение рассудка.'
    reason: Сохраняет смысловой диапазон ἔκστασις и отмечает неоднозначность, которую невозможно полностью передать одним русским словом.
lexical_decisions:
- source_word: ὁδηγεῖ
  choice: сбивает с пути
  rationale: 'В данном контексте глагол имеет отрицательный смысл: не просто «ведёт», а уводит в заблуждение.'
- source_word: ἐν πλάνῃ ἀργυρίου
  choice: обольщённые серебром
  rationale: Передаёт причинно-средственный смысл выражения естественным современным русским языком; ἀργύριον здесь может обозначать серебро как деньги или богатство.
- source_word: τοὺς μὴ ὄντας θεοὺς
  choice: тех, кто не боги
  rationale: Сохраняет прямое и подчёркнутое отрицание греческого текста.
- source_word: τὸν ἔχοντα αὐτὴν
  choice: того, кто ею обладает
  rationale: Сохраняет женское местоимение αὐτήν и его связь с подразумеваемой в контексте сущностью, не подменяя её явным толкованием.
- source_word: ἔκστασιν
  choice: исступление
  rationale: Слово обозначает выход из обычного состояния, помрачение или утрату самообладания; «исступление» лучше подходит отрицательному контексту, чем современное «экстаз».
theological_decisions:
- issue: Кого называют богами
  choice: 'назвать объект поклонения неопределённо: «тех, кто не боги»'
  alternative: уточнить как идолов или богатых людей
  rationale: Греческий текст не определяет этих лиц или предметы; конкретизация устранила бы подлинную неоднозначность.
- issue: Референт женского местоимения αὐτήν
  choice: сохранить местоимение «ею»
  alternative: заменить на «серебром», «алчностью» или «заблуждением»
  rationale: Антецедент находится в более широком контексте и в данном фрагменте не назван; перевод не должен молча разрешать эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего наставления. Синтаксис сделан естественным для русского читателя, при этом сохранены повтор женского местоимения и намеренно неопределённые места исходного текста.
