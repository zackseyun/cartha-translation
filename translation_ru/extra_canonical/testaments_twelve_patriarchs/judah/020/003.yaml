lexical_decisions:
- source_word: ὁ Θεὸς τῶν πατέρων μου
  choice: Бог моих отцов
  rationale: Естественно и точно передаёт родительный оборот, сохраняя библейское обозначение Бога предков говорящего.
- source_word: ἐλέησε με
  choice: помиловал меня
  rationale: Глагол «помиловал» сохраняет религиозно-нравственный смысл ἐλεέω и соответствует достоинству контекста.
- source_word: ἐν ἀγνωσίᾳ
  choice: по неведению
  rationale: 'Передаёт обстоятельственное значение греческого оборота: поступок был совершён без знания или осознания; более литературно и ёмко, чем «в неведении».'
- source_word: τοῦτο ἐποίησα
  choice: я сделал это
  rationale: Прямо передаёт местоимение τοῦτο и глагол ποιέω, не уточняя характер поступка сверх источника.
theological_decisions:
- issue: Связь Божьей милости с неведением говорящего
  choice: потому что я сделал это по неведению
  alternative: ведь я сделал это по неведению
  rationale: Союз ὅτι допускает причинное прочтение; перевод сохраняет прямую причинную связь текста, не превращая неведение в безусловное оправдание и не добавляя богословских пояснений.
