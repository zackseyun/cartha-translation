  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009.yaml
  text: 'For eighteen years my father made peace with his brother Esau, and his sons were with us after we came from Mesopotamia, from Laban.


    2 And when the eighteen years were fulfilled, Esau, my father''s brother, came against us with a heavy and powerful people.


    3 And Jacob struck Esau with a bow, and he fell, slain by Jacob''s bow, dead on Mount Seir.


    4 And we pursued the sons of Esau, and they also had a fortified city, and we were not able to enter it. But sitting down around it, we besieged it.


    5 And because they did not open to us after twenty days, while they were watching, I brought up a ladder; and placing my shield over my head, and receiving the stones, I went up and killed four of their mighty men.


    6 And Reuben and Gad killed another six. Then they entered in succession.


    7 Then they asked from us terms of peace, and after counsel had been taken with our father, we accepted them.


    8 And they were giving us five hundred cors of wheat, and five hundred measures of oil, and five hundred measures of wine, until the famine, when we went down into Egypt.'
translation:
  language: ru
  text: '9.1 Восемнадцать лет мой отец жил в мире со своим братом Исавом, а его сыновья были с нами после того, как мы пришли из Месопотамии, от Лавана.


    2 Когда исполнилось восемнадцать лет, Исав, брат моего отца, выступил против нас с многочисленным и могучим народом.


    3 Иаков поразил Исава стрелой из лука, и на горе Сеир подняли мёртвого.


    4 Мы погнались за сыновьями Исава. У них был укреплённый город, и мы не могли войти в него. Тогда мы расположились вокруг него и осадили его.


    5 Они не открывали ворот двадцать дней. Пока они наблюдали за нами, я приставил лестницу и, прикрыв голову щитом, полез наверх, принимая на себя камни, летевшие со стены, и убил четырёх могущественных людей их города.


    6 Рувим и Гад убили ещё шестерых.


    7 Тогда они попросили у нас мира. Посоветовавшись с нашим отцом, мы приняли их как данников.


    8 Они давали нам пятьсот коров пшеницы, пятьсот мер масла[a] и пятьсот мер вина — до голода, когда мы сошли в Египет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название меры масла в греческом тексте неясно из-за повреждения текста.
    reason: Греческое †ὕφης текстуально повреждено или не поддаётся надёжному истолкованию; нейтральное «мер» не выдаёт догадку за установленный смысл.
lexical_decisions:
- source_word: ἐποίησεν εἰρήνην
  choice: жил в мире
  rationale: Естественно передаёт продолжительное мирное состояние в течение восемнадцати лет, не превращая выражение в разовый договор.
- source_word: ἐν λαῷ βαρεῖ καὶ ἰσχυρῷ
  choice: с многочисленным и могучим народом
  rationale: βαρύς здесь описывает внушительную, грозную массу людей; буквальное «тяжёлым народом» по-русски неясно.
- source_word: ἔπαισεν ἐν τόξῳ
  choice: поразил ... стрелой из лука
  rationale: Русская формулировка ясно передаёт орудие действия и не добавляет повторного упоминания лука, отсутствующего в греческом тексте.
- source_word: ἤρθη ὁ νεκρὸς ἐν ὄρει Σεείρ
  choice: мёртвого унесли на гору Сеир
  rationale: Сохраняет пассивное ἤρθη и не добавляет утверждение, будто Исав просто упал; субъект обозначен как уже мёртвый.
- source_word: ὑποδεξάμενοι αὐτοὺς ὑποφόρους
  choice: мы приняли их и обложили данью
  rationale: Передаёт существенное значение ὑποφόρους — зависимые данники, пропущенное в английском консультационном слое.
- source_word: κόρους
  choice: коров
  rationale: Транслитерация древней меры объёма «кор» во множественном числе; она точнее нейтрального «мер» для пшеницы.
- source_word: †ὕφης
  choice: мер
  rationale: Термин в греческом источнике текстуально испорчен или неясен, поэтому выбран нейтральный родовой эквивалент с примечанием.
theological_decisions:
- issue: Смерть Исава в небиблейском повествовании
  choice: 'Передать утверждение источника прямо: Иаков поразил Исава, после чего мёртвого унесли на Сеир.'
  alternative: Согласовать рассказ с каноническим повествованием или смягчить смерть Исава.
  rationale: Перевод не должен устранять напряжение между данным завещательным преданием и книгой Бытия.
- issue: Статус сыновей Исава после мира
  choice: Сохранить указание, что они стали данниками.
  alternative: Ограничиться словами «мы приняли их», как в английском консультационном тексте.
  rationale: Греческое ὑποφόρους явно выражает данническую зависимость; её пропуск изменил бы смысл повествования.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Синтаксис упрощён там, где греческий текст шероховат, но последовательность действий и подлинные неясности сохранены. Имена и географические названия даны в привычной русской библейской форме.
