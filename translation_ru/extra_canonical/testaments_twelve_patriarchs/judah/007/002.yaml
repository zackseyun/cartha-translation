  text: So Dan and I, pretending to be allies to the Amorites, entered their city.
translation:
  language: ru
  text: И вот мы с Даном отправились к аморреям, притворились их союзниками и вошли в их город.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγὼ δὲ καὶ ὁ Δὰν
  choice: И вот мы с Даном
  rationale: Естественная русская передача сочетания «я же и Дан»; δέ в повествовательном переходе передано как «и вот», без излишнего противопоставления.
- source_word: πορευθέντες πρὸς Ἀμορραίους
  choice: отправились к аморреям
  rationale: Причастие πορευθέντες передаёт предшествующее действие; πρὸς с винительным указывает на движение к аморреям.
- source_word: προσποιησάμενοι αὐτοῖς συμμάχους
  choice: притворились их союзниками
  rationale: Передаёт смысл притворного представления себя союзниками аморреев, не создавая ошибочного впечатления, будто герои выдавали себя за аморреев.
- source_word: εἰσήλθομεν εἰς τὴν πόλιν αὐτῶν
  choice: вошли в их город
  rationale: Прямая и естественная передача греческой конструкции; местоимение относится к аморреям.
