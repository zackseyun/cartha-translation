lexical_decisions:
- source_word: ἐπροσεγγίσαμεν
  choice: мы приблизились
  rationale: Точно передаёт движение к месту без добавления отсутствующей в греческом тексте идеи входа или нападения.
- source_word: Θάμνῃ
  choice: Фамне
  rationale: Традиционная русская библейская передача топонима Θάμνα; дательный падеж обусловлен греческой конструкцией.
- source_word: πᾶσα ἡ ἀποσκευή
  choice: весь обоз
  rationale: В военном контексте ἀποσκευή обозначает совокупность поклажи, припасов и сопровождающего имущества; «обоз» естественно и ёмко передаёт это значение.
- source_word: τῶν πολεμίων βασιλέων
  choice: вражеских царей
  rationale: Сохраняет явное упоминание царей в исходном тексте, опущенное в английском консультационном слое.
