  text: Then, being insulted by them, I became angry, and I rushed against them up to the summit. And they kept pelting me with stones and shooting arrows at me.
translation:
  language: ru
  text: Тогда, оскорблённый ими, я разгневался и устремился на них к вершине. А они осыпали меня камнями и стреляли в меня из луков.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑβριζόμενος
  choice: оскорблённый
  rationale: Передаёт страдательное причастие и смысл унизительного, дерзкого обращения без излишнего уточнения характера оскорбления.
- source_word: ὥρμησα ἐπ᾽ αὐτοὺς ἐπὶ τὴν κορυφήν
  choice: устремился на них к самой вершине
  rationale: Сохраняет направленность нападения против них и движение к вершине; «самой» естественно подчёркивает конечную верхнюю точку.
- source_word: ἐσφενδόνιζον με ἐν λίθοις
  choice: осыпали меня камнями
  rationale: Естественно передаёт многократное метание камней в рассказе; буквальное упоминание пращи в данной конструкции не обязательно и могло бы внести отсутствующую конкретизацию.
- source_word: τοξεύοντες
  choice: стреляли в меня из луков
  rationale: Ясно выражает стрельбу из лука, подразумеваемую греческим глаголом, и сохраняет направленность действия на рассказчика.
