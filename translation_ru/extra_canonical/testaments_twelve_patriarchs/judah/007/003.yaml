translation_notes:
  register: Современный литературный русский язык, сжатый повествовательный регистр. Перевод следует предоставленному греческому тексту. Содержащиеся в английском консультационном слое упоминания «всего, что им принадлежало» и разрушения трёх стен в данном греческом источнике отсутствуют, поэтому в основной текст не внесены.
