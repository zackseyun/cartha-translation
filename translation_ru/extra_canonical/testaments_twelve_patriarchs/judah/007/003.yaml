  text: And in the deep night, when our brothers came, we opened the gates to them, and we destroyed all of them and all that was theirs; and after plundering all that was theirs, we tore down their three walls.
translation:
  language: ru
  text: Глубокой ночью к нам пришли мои братья; открыв им ворота, мы истребили их всех и предались грабежу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Νυκτὸς δὲ βαθείας
  choice: Глубокой ночью
  rationale: Естественная современная передача временного оборота с сохранением образа глубокой ночи; δέ здесь выполняет связующую повествовательную функцию и не требует отдельного «но».
- source_word: οἱ ἀδελφοί μου
  choice: мои братья
  rationale: Прямая и однозначная передача греческого выражения.
- source_word: ἀνοίξαντες τὰς πύλας αὐτοῖς
  choice: Мы открыли им ворота
  rationale: Причастный оборот передан личной глагольной формой для естественного русского повествования; αὐτοῖς относится к пришедшим братьям.
- source_word: πάντας αὐτοὺς ἐξωλοθρεύσαμεν
  choice: истребили всех жителей города
  rationale: Глагол означает полное уничтожение. Буквальное «истребили их всех» в изолированном русском стихе ошибочно воспринималось бы как уничтожение братьев, тогда как смена референта местоимения определяется повествовательным контекстом; явное существительное делает смысл понятным без изменения действия.
- source_word: ἐπρονομεύσαμεν
  choice: разграбили его
  rationale: Глагол передаёт совершённое разграбление. Дополнение «его» по-русски естественно указывает на город и не добавляет отсутствующих в греческом подробностей о добыче.
