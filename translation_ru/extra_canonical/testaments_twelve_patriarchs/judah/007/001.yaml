  text: And on the next day it was reported to us that the king of the city of Gaas was coming against us with a great multitude.
translation:
  language: ru
  text: А на следующий день нам сообщили, что царь города Гааса идёт на нас с многочисленным войском.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ἑξῆς
  choice: на следующий день
  rationale: Выражение указывает на следующий день; слово «день» подразумевается и естественно восполняется по-русски.
- source_word: ἐρρέθη πρὸς ἡμᾶς
  choice: нам сообщили
  rationale: Естественная русская передача безличной пассивной конструкции «было сказано нам».
- source_word: Γαὰς πόλεως βασιλεὺς
  choice: царь города Гаас
  rationale: Сохраняет структуру и географическое имя исходного текста без попытки отождествления.
- source_word: ἔρχεται πρὸς ἡμᾶς
  choice: идёт на нас
  rationale: В военном контексте πρός с глаголом движения передаёт враждебное наступление; настоящее время сохраняет живость сообщения.
- source_word: ἐν λαῷ πολλῷ
  choice: с многочисленным войском
  rationale: Буквально «с многочисленным народом», но в контексте похода царя λαός обозначает собранные вооружённые силы; «войско» ясно и естественно передаёт смысл.
