  text: Мне он дал то, что на земле, а ему — то, что на небесах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἐπὶ γῆς
  choice: то, что на земле
  rationale: Передаёт субстантивированное выражение естественным современным русским языком, не уточняя, какие именно земные вещи или полномочия имеются в виду.
- source_word: τὰ ἐν οὐρανοῖς
  choice: то, что на небесах
  rationale: Сохраняет множественное число греческого οὐρανοῖς и параллелизм с «то, что на земле».
theological_decisions:
- issue: Неуказанный субъект ἔδωκε и содержание дара
  choice: Сохранить местоимение «он» и обобщённые выражения «то, что…»
  alternative: Назвать дающего или истолковать дар как власть, удел либо служение
  rationale: Сам стих не называет субъекта и не конкретизирует содержание дара; перевод сохраняет эту смысловую открытость.
translation_notes:
  register: Краткая, торжественная и естественная фраза. Противопоставление усилено союзом «а» и нормативным тире при пропуске сказуемого во второй части.
