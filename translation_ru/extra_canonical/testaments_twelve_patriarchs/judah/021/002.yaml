source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Ἐμοὶ γὰρ¹⁰ ἔδωκεν¹¹ ὁ Θεὸς¹² τὴν βασιλείαν, κἀκείνῳ¹² τὴν ἱερατείαν¹³, καὶ¹⁴ ὑπέταξε¹⁴ τὴν βασιλείαν τῇ ἱερωσύνῃ¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/002.yaml
  text: For God gave me the kingship, and to him the priesthood, and he subjected the kingship to the priesthood.
translation:
  language: ru
  text: Ибо Бог дал мне царскую власть, а ему — священство, и подчинил царскую власть священству.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεία
  choice: царская власть
  rationale: В контексте распределения полномочий между Иудой и другим лицом слово обозначает не территорию царства, а царское достоинство и власть.
- source_word: ἱερατεία / ἱερωσύνη
  choice: священство
  rationale: Оба близких греческих термина переданы одним естественным русским словом; здесь они обозначают священническое служение и установление.
- source_word: ὑπέταξε
  choice: подчинил
  rationale: Прямо сохраняет выраженное в источнике отношение подчинения, не смягчая богословское напряжение.
theological_decisions:
- issue: Соотношение царской власти и священства
  choice: «подчинил царскую власть священству»
  alternative: «поставил царство в зависимость от священства»
  rationale: Выбрана формально близкая передача, которая сохраняет недвусмысленную иерархию исходного текста, не поясняя ее конфессионально.
- issue: Референт местоимения κἀκείνῳ
  choice: «а ему»
  alternative: указать имя предполагаемого лица
  rationale: Источник использует местоимение; его референт не следует конкретизировать внутри стиха без прямого текстового основания.
translation_notes:
  register: Современный литературный русский язык; синтаксис краткий и торжественный. Эллипсис «а ему — священство» естественно воспроизводит параллелизм греческой фразы.
