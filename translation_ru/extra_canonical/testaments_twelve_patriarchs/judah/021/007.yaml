base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/007.yaml
  text: For the kings will be like sea monsters, swallowing people like fish; they will make sons and daughters of free people servants, and they will seize houses, fields, flocks, and wealth.
translation:
  language: ru
  text: Ибо те, кто будет царствовать, будут подобны морским чудовищам, поглощающим людей, как рыб; свободных сыновей и дочерей они обратят в рабство, а дома, поля, стада и имущество захватят.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ βασιλεύσουσιν
  choice: цари
  rationale: Субстантивированная форма со значением «те, кто будет царствовать» естественно передаётся в контексте как «цари».
- source_word: κήτη
  choice: морские чудовища
  rationale: κήτη обозначает огромных морских существ или чудовищ; такой перевод сохраняет устрашающий образ и не сужает его до конкретного животного.
- source_word: ἀνθρώπους
  choice: людей
  rationale: Общее обозначение людей без ограничения по полу.
- source_word: υἱοὺς καὶ θυγατέρας ἐλευθέρους
  choice: свободных сыновей и дочерей
  rationale: Прилагательное ἐλευθέρους отнесено к обоим существительным; формулировка сохраняет прямой смысл греческого текста, хотя возможна и синтаксическая трактовка «сыновей и дочерей свободных людей».
- source_word: καταδουλώσουσιν
  choice: обратят в рабство
  rationale: 'Передаёт каузативный смысл: насильственно сделают рабами.'
- source_word: χρήματα
  choice: имущество
  rationale: В ряду захватываемой собственности слово естественно означает имущество, материальные ценности или богатство.
- source_word: ἁρπάσουσιν
  choice: разграбят
  rationale: Передаёт насильственное присвоение перечисленной собственности и естественно сочетается со всем рядом объектов.
