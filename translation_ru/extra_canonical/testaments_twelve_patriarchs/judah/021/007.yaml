revisions:
- from: Ибо цари будут словно морские чудовища, поглощающие людей, как рыб; свободных сыновей и дочерей они обратят в рабство, а дома, поля, стада и имущество разграбят.
  to: Ибо те, кто будет царствовать, будут подобны морским чудовищам, поглощающим людей, как рыб; свободных сыновей и дочерей они обратят в рабство, а дома, поля, стада и имущество захватят.
  rationale: Исправлено начало, чтобы передать субстантивированную будущую форму βασιλεύσουσιν, и «разграбят» заменено на «захватят» для более точной передачи ἁρπάσουσιν. Остальные формулировки сохранены, поскольку они точно и естественно передают греческий текст.
