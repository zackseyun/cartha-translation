review_pass:
  verdict: revise
  source_fidelity: 'Начальное οἱ βασιλεύσουσιν — не просто существительное «цари», а субстантивированная будущая форма: «те, кто будет царствовать / править». В черновике будущее сохранено лишь частично («цари будут»), но значение самого глагола «царствовать» утрачено. ἁρπάσουσιν означает насильственно захватят, отнимут; «разграбят» может сместить смысл к разорению имущества, а не к его присвоению.'
  naturalness: Фраза в целом литературна и ясна. «Те, кто будет царствовать, будут подобны морским чудовищам» естественно передаёт пророческую конструкцию. «Захватят дома, поля, стада и имущество» хорошо сочетается со всеми объектами.
  terminology: «Морские чудовища» адекватно передаёт κήτη без неоправданного отождествления с конкретным животным. «Людей», «свободных сыновей и дочерей» и «обратят в рабство» точно передают ἀνθρώπους, υἱοὺς καὶ θυγατέρας ἐλευθέρους и καταδουλώσουσιν. Неоднозначность синтаксической связи «свободных» не следует разрешать добавлением отсутствующего в греческом слова «людей».
  issues:
  - severity: medium
    issue: Утрачен глагольный смысл οἱ βασιλεύσουσιν.
    rationale: «Цари» передаёт возможный референт, но не выражает «те, кто будет царствовать». Следует сохранить субстантивированную будущую форму.
  - severity: low
    issue: «Разграбят» не вполне точно передаёт ἁρπάσουσιν.
    rationale: Греческий глагол акцентирует захват или насильственное присвоение перечисленных владений; «захватят» ближе к этому значению.
  revised_text: Ибо те, кто будет царствовать, будут подобны морским чудовищам, поглощающим людей, как рыб; свободных сыновей и дочерей они обратят в рабство, а дома, поля, стада и имущество захватят.
  revised_footnotes: []
