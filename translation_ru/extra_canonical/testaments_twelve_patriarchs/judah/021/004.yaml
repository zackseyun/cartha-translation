  text: For thus the priesthood of God surpasses the earthly kingdom, unless through sin it falls away from the Lord and is ruled by the earthly kingdom.
translation:
  language: ru
  text: Ибо именно так священство Божие превосходит земное царство, если только из-за грехов оно не отпадёт от Господа и не окажется под властью земного царства.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερέχει
  choice: превосходит
  rationale: Передаёт сравнительное превосходство священства над земной царской властью без добавочного толкования.
- source_word: ἡ ἱερατεία τοῦ Θεοῦ
  choice: священство Божье
  rationale: Естественное и точное обозначение священнического института, принадлежащего Богу.
- source_word: τῆς ἐπιγείου βασιλείας
  choice: земное царство
  rationale: Сохраняет буквальный образ и противопоставление Божьего священства земной царской власти.
- source_word: ἐκπέσῃ ἀπὸ Κυρίου
  choice: отпадёт от Господа
  rationale: Передаёт идею утраты верности и положения по отношению к Господу, сохраняя богословскую напряжённость выражения.
- source_word: κυριευθῇ
  choice: окажется под властью
  rationale: Естественно по-русски передаёт страдательное значение — быть подчинённым или управляемым кем-либо.
theological_decisions:
- issue: Условный оборот ἐὰν μή
  choice: если только ... не
  alternative: если не
  rationale: 'Ясно сохраняет условие: превосходство священства предполагает, что оно не отпало из-за грехов и не подчинилось земной власти.'
- issue: Отношение двух глаголов в условной части
  choice: не отпадёт ... и не окажется под властью
  alternative: не отпадёт ... и окажется под властью
  rationale: Отрицание при ἐὰν μή естественно распространяется на составное сказуемое, связанное καί; формулировка не превращает второе действие в безусловное следствие.
translation_notes:
  register: Современный литературный русский язык; тон краткий и достойный. Сохранены институциональные образы «священство» и «земное царство», а также условность и нравственно-богословская напряжённость греческого текста.
