  verdict: revise
  source_fidelity: Нужна правка двух смысловых оттенков. διαμείνητε означает «оставаться, пребывать, сохраняться», тогда как «устоять» добавляет идею противостояния испытанию. μὴ ἐπαίρεσθε ἐπ᾽ αὐτόν говорит о самовозвышении по отношению к Левию; «не восставайте» чрезмерно конкретизирует это как мятеж. ἐξολοθρευθῆτε — усиленное пассивное «быть полностью уничтоженными/истреблёнными», а не просто «погибнуть».
  naturalness: Исправленный вариант сохраняет современный литературный строй и умеренно торжественный тон. Формула «чтобы не быть вам полностью уничтоженными» несколько возвышенна, но естественна для завещательно-наставительного жанра и точно передаёт греческий пассив.
  terminology: «Повелеваю» хорошо передаёт παραγγέλλω в данном контексте. «Любите Левия» сохраняет имя и форму повеления. «Не превозноситесь над ним» передаёт основной смысл ἐπαίρεσθε, не подменяя его открытым восстанием.
  issues:
