    issue: «Чтобы вам устоять» для διαμείνητε
    rationale: Формулировка вносит не выраженный в глаголе образ сопротивления; исходный глагол говорит о пребывании или сохранении.
  - severity: medium
    issue: «Не восставайте против него» для μὴ ἐπαίρεσθε ἐπ᾽ αὐτόν
    rationale: «Восставать» означает мятеж или открытое противление, тогда как греческий глагол прежде всего обозначает превозношение себя.
