base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/001.yaml
  text: 'And now, my children, I command you: love Levi, so that you may remain, and do not exalt yourselves against him, lest you be utterly destroyed.'
translation:
  language: ru
  text: 'И теперь, дети мои, я повелеваю вам: любите Левия, чтобы вы сохранились, и не превозноситесь над ним, чтобы не быть вам полностью уничтоженными.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγγέλλω
  choice: я заповедую
  rationale: Передаёт властное наставление в торжественном завещательном контексте, не сужая значение до простого совета.
- source_word: ἀγαπᾶτε
  choice: любите
  rationale: Прямое и естественное соответствие повелительной форме настоящего времени.
- source_word: διαμείνητε
  choice: вам устоять
  rationale: Сохраняет идею продолжительного пребывания и сохранения; в данном контексте естественное русское «устоять» передаёт возможность не погибнуть.
- source_word: μὴ ἐπαίρεσθε ἐπ᾽ αὐτόν
  choice: не восставайте против него
  rationale: ἐπαίρεσθε буквально связано с возношением или поднятием себя, а ἐπ᾽ αὐτόν задаёт направленность против Левия; «восставайте против» естественно передаёт враждебное самовозвышение, не превращая фразу в указание лишь на внутреннюю гордость.
- source_word: ἐξολοθρευθῆτε
  choice: погибнуть окончательно
  rationale: Передаёт усиленный смысл полного истребления или уничтожения, сохраняя при этом естественность русского предупреждения.
theological_decisions:
- issue: Связь сохранения адресатов с любовью к Левию
  choice: чтобы вам устоять
  alternative: чтобы вам сохраниться / чтобы вы пребывали
  rationale: Сохранена выраженная в тексте целевая или результативная связь без пояснения её богословского механизма.
- issue: Характер действия против Левия
  choice: не восставайте против него
  alternative: не превозноситесь над ним
  rationale: Выбранная формулировка подчёркивает направленность ἐπ᾽ αὐτόν и не сводит предупреждение исключительно к сравнению статуса; оттенок самовозвышения отмечен в лексическом обосновании.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным завещательным тоном. Синтаксис сохраняет две параллельные заповеди и два соответствующих следствия. Сноски не требуются.
