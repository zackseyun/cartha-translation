revisions:
- from: 'Ведь ангел Господень сказал мне: «Господь избрал его прежде тебя, чтобы он приближался к Нему, вкушал за Его столом и приносил Ему начатки лучших плодов сынов Израиля[a]. Ты же будешь царём Иакова».'
  to: 'Ведь ангел Господень сказал мне: «Господь избрал его, предпочтя тебе, чтобы он приближался к Нему, вкушал за Его столом и приносил Ему начатки благ сынов Израиля[a]. Ты же будешь царём Иакова».'
  rationale: Исправлено сравнительное «выше/предпочтительнее тебя» и устранено неоправданное уточнение о плодах. Остальные соответствия, порядок служебных действий и контекстуальная неопределённость лиц сохранены.
