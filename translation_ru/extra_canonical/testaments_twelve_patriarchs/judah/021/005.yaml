  - severity: medium
    issue: «Лучших плодов» сужает значение ἐντρυφημάτων.
    rationale: Слово обозначает предметы наслаждения, роскошь, изысканные или желанные блага; источник не ограничивает их плодами земли. Сохранение более широкого «благ» лучше передаёт неоднозначность.
