base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/005.yaml
  text: For the angel of the Lord told me that the Lord chose him above you, to draw near to him, and to eat at his table, and to offer the firstfruits of the delights of the sons of Israel[c] to him. But you shall be king of Jacob.
translation:
  language: ru
  text: 'Ведь ангел Господень сказал мне: «Господь избрал его, предпочтя тебе, чтобы он приближался к Нему, вкушал за Его столом и приносил Ему начатки благ сынов Израиля[a]. Ты же будешь царём Иакова».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «начатки благ сынов Израиля» может означать первые приношения из отборных, желанных благ Израиля; оно не обязательно ограничено плодами земли.
    reason: cultural_note
lexical_decisions:
- source_word: ὑπὲρ σὲ
  choice: прежде тебя
  rationale: В контексте избрания выражает предпочтение одного другому; по-русски «прежде тебя» естественно передаёт превосходящее предпочтение, не вводя пространственного смысла.
- source_word: προσεγγίζειν αὐτῷ
  choice: приближался к Нему
  rationale: Сохраняет культовый оттенок допущения к служению перед Господом и не сводит выражение к обычной физической близости.
- source_word: ἐσθίειν τὴν τράπεζαν αὐτοῦ
  choice: вкушал за Его столом
  rationale: Греческое выражение буквально необычно — «есть Его стол»; русский идиоматический оборот передаёт участие в трапезе при сохранении возвышенного регистра.
- source_word: ἀπαρχὰς ... ἐντρυφημάτων
  choice: начатки лучших плодов
  rationale: ἀπαρχαί передано традиционным культовым словом «начатки», а неоднозначное ἐντρυφήματα — как отборные, желанные произведения земли; формулировка остаётся понятной современному читателю.
- source_word: βασιλεὺς Ἰακώβ
  choice: царём Иакова
  rationale: Сохранён исходный генитив и возможная коллективная отсылка к народу Иакова без поясняющего добавления в основной текст.
theological_decisions:
- issue: Относительная роль избранного священнослужителя и Иуды
  choice: 'Сохранено противопоставление: «его» Господь избрал для приближения и приношения, а адресату обещано царство.'
  alternative: Уточнить личности или прямо назвать разделение священнической и царской власти.
  rationale: Источник использует местоимения и функциональное противопоставление; добавление имён или развитой доктринальной схемы разрешило бы то, что стих сам оставляет контексту.
- issue: Референт αὐτῷ в приношении
  choice: «Ему» с прописной буквы, то есть Господу.
  alternative: Понять как отсылку к ранее упомянутому лицу.
  rationale: Последовательность «приближаться к Нему… Его столом… приносить Ему» наиболее естественно относит местоимения к Господу, хотя греческая форма сама по себе грамматически не маркирует божественный референт.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой («ангел Господень», «вкушал», «начатки»). Синтаксис упрощён ровно настолько, чтобы длинный ряд инфинитивов естественно звучал по-русски; местоименная неоднозначность исходного контекста не устранена добавлением имён.
