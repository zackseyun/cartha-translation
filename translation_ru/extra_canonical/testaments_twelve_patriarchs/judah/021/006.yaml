source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καὶ ἔσῃ³⁶ ἐν αὐτοῖς³⁷ ὡς³⁸ ἡ³⁹ θάλασσα. Καθάπερ⁴⁰ γὰρ⁴¹ ἐν αὐτῇ δίκαιοι καὶ ἄδικοι, οἱ μὲν αἰχμαλωτίζονται οἱ δὲ πλουτοῦσιν⁴⁴, οὕτως καὶ ἐν σοὶ πᾶν γένος ἀνθρώπων· οἱ μὲν †κωδυνεύσουσιν αἰχμαλωτιζόμενοι, οἱ δὲ πλουτοῦντες ἁρπάζοντες τὰ ἀλλότρια.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/006.yaml
  text: 'And you shall be among them like the sea. For just as in it the righteous are storm-tossed, some being taken captive and others growing rich, so also in you every race of men: some are endangered, being taken captive, and others grow rich by seizing what belongs to others.'
translation:
  language: ru
  text: 'И будешь ты среди них, как море. Ибо как в нём есть праведные и неправедные — одни попадают в плен, а другие богатеют, — так и в тебе будут люди всякого рода: одни, попадая в плен, окажутся в опасности[a], а другие будут богатеть, захватывая чужое.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово, переведённое как «окажутся в опасности», в рукописной традиции испорчено; вероятное восстановление имеет значение «будут в опасности».
    reason: Критический знак † при форме κωδυνεύσουσιν указывает на текстуальную порчу, поэтому степень уверенности следует обозначить читателю.
lexical_decisions:
- source_word: ἔσῃ ἐν αὐτοῖς ὡς ἡ θάλασσα
  choice: будешь ты среди них, как море
  rationale: Сохранены пространственное выражение «среди них» и прямое сравнение с морем без добавочного истолкования.
- source_word: δίκαιοι καὶ ἄδικοι
  choice: праведные и неправедные
  rationale: Передаёт нравственно-религиозное противопоставление исходного текста; не следует английскому слою, где синтаксис этого сочетания передан неясно.
- source_word: αἰχμαλωτίζονται
  choice: попадают в плен
  rationale: Естественная современная передача страдательного значения греческого глагола.
- source_word: πᾶν γένος ἀνθρώπων
  choice: люди всякого рода
  rationale: Сохраняет широту выражения, но избегает неестественного буквального оборота «всякий род людей».
- source_word: ἁρπάζοντες τὰ ἀλλότρια
  choice: захватывая чужое
  rationale: Передаёт и насильственно-хищнический оттенок ἁρπάζω, и обобщённое значение «принадлежащее другим».
theological_decisions:
- issue: Образ моря и выражение «в тебе»
  choice: Сохранить образ и формулировку без пояснения, кого именно обозначает «ты».
  alternative: Истолковать «ты» как колено Иуды или его землю непосредственно в тексте.
  rationale: Исходный текст оставляет референт в контексте и допускает образно-корпоративное прочтение; перевод не должен устранять эту открытость.
- issue: Соотношение праведных и неправедных с пленением и богатством
  choice: Сохранить перечислительную конструкцию без жёсткого распределения двух участей между праведными и неправедными.
  alternative: Явно связать праведных с пленом, а неправедных — с богатством.
  rationale: Конструкция οἱ μὲν… οἱ δὲ… может подталкивать к такому соответствию, но не выражает его настолько однозначно, чтобы вводить явные связки в перевод.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного пророческого тона. Синтаксис слегка упорядочен для ясности, но параллелизм «одни… другие…» и намеренная образность оригинала сохранены.
