review_pass:
  verdict: revise
  source_fidelity: 'Драфт верно не вводит ибисов: в предоставленной греческой строке есть только κόρακας («воронов»). Однако ἀδίκως означает «несправедливо, неправедно», а не «беззаконно». Кроме того, в греческом тексте перед «воронов» и «плотью многих» нет выраженного глагола; «наполнят» является слишком конкретным реконструированием. Вторая часть сохраняет трудную, вероятно повреждённую или эллиптическую последовательность: «продвинутся ко злу и к такой гордыне, пока не вознесутся».'
  naturalness: Предлагаемая правка сохраняет намеренную шероховатость источника, но делает русскую фразу понятной. «Отдадут воронам плоть многих» — сдержанное восполнение необходимого для русского глагола; оно не утверждает отсутствующее в греческом значение «наполнят». «В своей алчности» естественно передаёт инструментально-обстоятельственное πλεονεξίᾳ.
  terminology: «Вороны» точно передаёт κόρακας. «Алчность» приемлема для πλεονεξία; «гордыня» передаёт ὑπερηφανία в данном обличительном контексте. Повтор «возносясь / вознесутся» сохранён, как и неуказанный субъект последнего пассива.
  issues:
  - severity: medium
    issue: «Беззаконно» вместо ἀδίκως
    rationale: ἀδίκως обозначает неправедность или несправедливость действия, но не обязательно нарушение закона; «несправедливо» точнее и не сужает смысл.
  - severity: medium
    issue: «Наполнят воронов плотью многих» как неотмеченная конкретизация
    rationale: В предоставленном греческом тексте глагол при σάρκας πολλῶν и κόρακας отсутствует. Такая реконструкция допустима лишь как минимальное восполнение для русского и должна быть оговорена; «отдадут воронам» менее конкретно, чем «наполнят».
  - severity: low
    issue: «Во зле» при ἐπὶ κακῷ
    rationale: Формула ἐπὶ κακῷ здесь лучше передаётся направлением или целью («ко злу»); это также согласуется с последующим «продвигаться ко злу».
  - severity: low
    issue: Английская аудиторская формулировка об ибисах не подтверждается данной греческой строкой
    rationale: 'Она не должна влиять на русский перевод: в указанном исходном тексте отсутствует слово для «ибисов».'
  revised_text: И они несправедливо отдадут воронам плоть многих,[a] возносясь в своей алчности ко злу; и будут продвигаться ко злу и к такой гордыне, пока не вознесутся.
  revised_footnotes:
  - marker: a
    text: В предоставленном греческом тексте при словах «плоть многих» и «воронам» отсутствует глагол. «Отдадут» — минимальное восполнение, необходимое для связной русской фразы; точный способ действия не назван.
    reason: textual_difficulty
  revision_rationale: Исправлено значение ἀδίκως, устранено чрезмерно определённое «наполнят», а текстологическая трудность отмечена непосредственно у места восполнения. Не добавлены ибисы или иные птицы, которых нет в предоставленной греческой форме. Сохранены повторяющиеся мотивы зла и вознесения и не разрешена неоднозначность последнего «вознесутся».
