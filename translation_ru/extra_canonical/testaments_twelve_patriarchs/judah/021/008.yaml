  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/008.yaml
  text: And they will unjustly fill ravens and ibises[b] with the flesh of many, and they will advance in evil, being lifted up in greed.
translation:
  language: ru
  text: И они беззаконно наполнят[a] воронов плотью многих, возносясь во зле из-за алчности; и будут преуспевать во зле и в такой гордыне, пока не вознесутся.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте предложение синтаксически неполно; глагол «наполнят» восстановлен по смыслу конструкции «воронов — плотью многих».
    reason: textual_difficulty
lexical_decisions:
- source_word: κόρακας
  choice: воронов
  rationale: Передаёт конкретное греческое название птиц; упоминание ибисов в предоставленном греческом тексте отсутствует и поэтому не внесено.
- source_word: πλεονεξίᾳ
  choice: из-за алчности
  rationale: Слово обозначает ненасытное стремление иметь больше, корыстолюбие или алчность; творительный падеж передан как причина возношения.
- source_word: ὑψούμενοι / ὑψοῦνται
  choice: возносясь / вознесутся
  rationale: Сохранены повтор корня и смысл самовозвышения, не устраняя возможную иронию последнего выражения.
- source_word: προκόψουσιν ἐπὶ κακὰ
  choice: будут преуспевать во зле
  rationale: Сохраняет парадоксальную формулировку об успехе или продвижении в дурном.
theological_decisions:
- issue: Смысл последнего «вознесутся»
  choice: Сохранено без уточнения, кем или каким образом они будут вознесены.
  alternative: «пока не достигнут вершины [гордыни]» или «пока не будут низвергнуты»
  rationale: Греческий текст говорит о вознесении и не называет действующее лицо; богословски мотивированное разрешение напряжения было бы добавлением.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной лексикой. Повторы «во зле» и «возносясь / вознесутся» сохранены как особенности исходного текста; его шероховатость отмечена, а не сглажена за счёт добавления отсутствующих в данной греческой форме ибисов.
