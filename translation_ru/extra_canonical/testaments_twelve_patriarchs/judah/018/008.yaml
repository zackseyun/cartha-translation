  text: They hinder the sacrifices of God, and do not remember the blessing of God. They do not listen when a prophet speaks, and resent words of godliness.
translation:
  language: ru
  text: 8. Он препятствует жертвоприношениям Богу и не помнит Божьего благословения. Когда говорит пророк, он не слушает и негодует на слова благочестия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте все глаголы этого стиха стоят в единственном числе: «он препятствует… не помнит… не слушает… негодует».'
    reason: Отмечает расхождение с английским консультационным текстом, где употреблено множественное число, и объясняет источник русского решения.
lexical_decisions:
- source_word: Θυσίας Θεοῦ
  choice: жертвоприношениям Богу
  rationale: Передаёт жертвенный смысл θυσίαι и сохраняет связь с Богом; по-русски это естественнее буквального «жертвам Бога».
- source_word: εὐλογίαν Θεοῦ
  choice: Божьего благословения
  rationale: Естественно передаёт греческое сочетание с родительным падежом, не уточняя сверх текста, идёт ли речь прежде всего о благословении от Бога или принадлежащем Богу.
- source_word: Προφήτου λαλοῦντος
  choice: Когда говорит пророк
  rationale: Естественная временная передача греческой конструкции с причастием, без добавления отсутствующего содержания пророческой речи.
- source_word: λόγους εὐσεβείας
  choice: слова благочестия
  rationale: «Благочестие» сохраняет религиозный смысл εὐσέβεια — почтение к Богу и соответствующую ему жизнь.
- source_word: προσοχθίζει
  choice: негодует на
  rationale: Передаёт сильную неприязненную реакцию глагола, не ослабляя её до простого недовольства.
theological_decisions:
- issue: Число подразумеваемого подлежащего
  choice: 'Единственное число: «он»'
  alternative: 'Множественное число: «они», как в английском POB'
  rationale: 'Все четыре личные глагольные формы в предоставленном греческом тексте стоят в третьем лице единственного числа: ἐμποδίζει, μνημονεύει, ἀκούει, προσοχθίζει. Поэтому перевод следует исходному языку, не исправляя его по английскому консультационному слою.'
- issue: Направленность родительного Θεοῦ при θυσίας
  choice: «жертвоприношениям Богу»
  alternative: «Божьим жертвоприношениям»
  rationale: Выбранная формулировка наиболее естественно понимает Бога как адресата жертвоприношений, но не вводит конфессионально специфического толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для широкого читателя; богословская лексика «благословение», «пророк», «благочестие» сохранена.
