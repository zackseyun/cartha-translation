  text: And Abraham my forefather blessed me to reign in Israel, and Jacob blessed me likewise.
translation:
  language: ru
  text: И Авраам, мой праотец, благословил меня царствовать в Израиле, и Иаков благословил меня так же.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πρόπατός μου
  choice: мой праотец
  rationale: «Праотец» естественно и достойно передаёт обозначение далёкого предка, которым Иуда называет Авраама.
- source_word: εὐλόγησέ με βασιλεύειν
  choice: благословил меня царствовать
  rationale: Инфинитив βασιλεύειν передан непосредственно, без добавления отсутствующих в греческом тексте слов о праве или предназначении.
- source_word: ἐν Ἰσραήλ
  choice: в Израиле
  rationale: Сохранена формально и контекстуально естественная передача предложной конструкции.
- source_word: οὕτως
  choice: так же
  rationale: В данном сопоставлении означает, что Иаков также благословил Иуду подобным образом; раздельное написание отличает наречное сочетание от союза «также».
theological_decisions:
- issue: Характер благословения на царствование
  choice: благословил меня царствовать
  alternative: благословил меня, чтобы я царствовал / благословил меня на царствование
  rationale: Выбранная формулировка сохраняет синтаксическую сжатость и не уточняет сверх текста, выражает ли инфинитив цель, предназначение или содержание благословения.
