  text: '*Δυσὶ γὰρ πάθεσιν ἐναντίοις δουλεύει³⁵, *καὶ Θεῷ ὑπακοῦσαι³⁶ οὐ δύναται³⁷, ὅτι ἐτύφλωσε³⁸ τὴν ψυχὴν αὐτοῦ καὶ ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/009.yaml
  text: For he is enslaved to two contrary passions, and is not able to obey God, because they have blinded his soul.
translation:
  language: ru
  text: Ибо он служит двум противоположным страстям и не может повиноваться Богу, потому что ослепил свою душу и ходит днём, как ночью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάθεσιν ἐναντίοις
  choice: противоположным страстям
  rationale: Передаёт представление о двух противоборствующих влечениях; «страсти» естественно и точно соответствует πάθη в нравственном контексте.
- source_word: δουλεύει
  choice: служит
  rationale: Сохраняет образ подчинённости господину; в данном контексте это естественнее буквального «рабствует».
- source_word: ὑπακοῦσαι
  choice: повиноваться
  rationale: Передаёт не просто слушание, а послушание Богу.
- source_word: ἐν ἡμέρᾳ ὡς ἐν νυκτί
  choice: даже среди бела дня… словно ночью
  rationale: Естественный русский оборот, сохраняющий противопоставление дня и ночи и образ духовной слепоты.
theological_decisions:
- issue: Причина неспособности повиноваться Богу
  choice: 'Сохранена причинная связь: душа ослеплена, поэтому человек не способен повиноваться Богу и ходит как во тьме.'
  alternative: Свести стих к рабству двум страстям и опустить образ хождения днём как ночью, как в английском консультационном тексте.
  rationale: Последняя часть прямо засвидетельствована в греческом источнике и важна для образа нравственной и духовной слепоты.
- issue: Неясный субъект глагола ἐτύφλωσε
  choice: Использована безлично-пассивная формулировка «душа его ослеплена» с примечанием.
  alternative: «Потому что оно ослепило его душу».
  rationale: В греческом глагол стоит в единственном числе, тогда как ближайшее возможное предшествующее слово «страсти» — во множественном; перевод не должен без основания назначать конкретного деятеля.
translation_notes:
  register: Современный литературный русский язык с достоинством нравственного наставления. Синтаксис сделан ясным для широкого читателя; сохранены метафоры служения страстям, ослепления души и хождения днём как ночью.
