  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/004.yaml
  text: And I know what evils you will do in the last days.
translation:
  language: ru
  text: И я знаю, какие злые дела вы совершите в [последние дни].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «в последние дни» в греческом издании заключены в квадратные скобки, что указывает на текстуальную неуверенность.
    reason: Передать отмеченную издателем неустойчивость текста, не исключая фразу из перевода.
lexical_decisions:
- source_word: ἔγνωκα
  choice: знаю
  rationale: Греческий перфект передаёт достигнутое знание с сохраняющимся результатом; в естественном русском контексте это лучше всего выражается настоящим временем «знаю».
- source_word: ὅσα κακὰ
  choice: какие злые дела
  rationale: Субстантивированное κακά означает зло или злые поступки; сочетание с ποιήσετε естественно передано как «какие злые дела… совершите».
- source_word: ποιήσετε
  choice: совершите
  rationale: Будущее время сохранено; «совершите» соответствует контексту поступков и звучит литературно.
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: в последние дни
  rationale: Устойчивое и понятное соответствие эсхатологическому выражению без дополнительного толкования.
theological_decisions:
- issue: Текстуальная неуверенность выражения «в последние дни»
  choice: Сохранить выражение в основном тексте и отметить его текстуальную особенность сноской.
  alternative: Опустить выражение или заключить его в редакторские скобки.
  rationale: Фраза присутствует в предоставленном греческом тексте, но квадратные скобки в издании указывают на текстуальную неуверенность; сноска сохраняет и чтение, и прозрачность.
translation_notes:
  register: Современный литературный русский язык; формулировка торжественная, но ясная. Союз «И» сохранён как связь с предшествующим контекстом.
