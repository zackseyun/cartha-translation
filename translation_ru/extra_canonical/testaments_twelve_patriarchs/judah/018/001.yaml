lexical_decisions:
- source_word: ἣν
  choice: которую
  rationale: Сохранено относительное местоимение женского рода и связь с предшествующим контекстом; подразумеваемое существительное не добавлено в основной текст.
- source_word: ἔδωκέ μοι
  choice: даровал мне
  rationale: «Даровал» естественно передаёт значение данного Господом благоволения и сохраняет достойный литературный регистр.
- source_word: Κύριος
  choice: Господь
  rationale: Обычный и контекстуально уместный русский эквивалент титула Κύριος.
- source_word: ἐν ὑπακοῇ πατρός μου
  choice: когда я был послушен своему отцу
  rationale: По-русски ясно выражает обстоятельство послушания отцу, не сводя неоднозначную конструкцию ἐν с дательным исключительно к причинному значению «за» или «потому что».
theological_decisions:
- issue: Связь дара Господа с послушанием Иуды отцу
  choice: когда я был послушен своему отцу
  alternative: за послушание моему отцу
  rationale: Выбранная формулировка сохраняет обстоятельственную связь, но не утверждает однозначно, что дар был наградой или заслугой за послушание.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным глаголом «даровал». Начальная относительная конструкция и завершающая запятая сохранены, поскольку стих представляет собой часть более длинного предложения.
