  source_fidelity: 'Русский текст точно передаёт греческое утверждение: emphatic ἐγώ сохранено как «Я», οὐδέποτε — «никогда», а имперфекты ἔλεγεν и ἐποίουν естественно отражены формами «говорил» и «исполнял». «Огорчал» является уместной контекстуальной передачей παρελάλησα: последующее мотивирующее пояснение о неизменном послушании отцу определяет смысл как причинение огорчения/недовольства, а не буквальное «говорил в сторону».'
