  text: Therefore I never grieved Jacob my father, for I did everything he told me.
translation:
  language: ru
  text: Я никогда не огорчал Иакова, отца моего, потому что исполнял всё, что он мне говорил.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρελάλησα
  choice: огорчал
  rationale: В данном контексте глагол передаёт причинение отцу огорчения или недовольства; выбран естественный русский эквивалент, согласующийся с контекстом послушания.
- source_word: πάντα ὅσα μοι ἔλεγεν ἐποίουν
  choice: исполнял всё, что он мне говорил
  rationale: Сохраняет обобщённо-прошедшее значение греческих имперфектов и передаёт ποιεῖν как исполнение отцовских наставлений.
- source_word: Ἰακὼβ τὸν πατέρα μου
  choice: Иакова, отца моего
  rationale: Сохранены имя и приложение исходного текста; порядок слов звучит достойно и естественно по-русски.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Начальное ἐγώ передано местоимением «Я» без дополнительного усиления. Союз ὅτι передан причинным «потому что». Не добавлено «поэтому», поскольку в представленном греческом тексте отдельного следственного союза нет.
