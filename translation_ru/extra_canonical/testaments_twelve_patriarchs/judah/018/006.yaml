  text: Ὅτι¹⁰ ταῦτα¹¹ ἀφιστᾷ¹² τοῦ νόμου τοῦ θεοῦ, καὶ τυφλοῖ¹⁴ τὸ διαβούλιον τῆς ψυχῆς, καὶ ὑπερηφανίαν¹⁵ ἐκδιδάσκει, καὶ οὐκ ἀφίει¹⁶ ἄνδρα ἐλεῆσαι¹⁷ τὸν¹⁸ πλησίον αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/006.yaml
  text: For these turn one away from the law of God, and blind the judgment of the soul, and teach arrogance, and do not allow a man to show mercy to his neighbor.
translation:
  language: ru
  text: Ибо всё это отвращает от закона Божьего, ослепляет рассудок души, учит высокомерию и не позволяет человеку проявлять милость к своему ближнему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: всё это
  rationale: Указательное местоимение среднего рода множественного числа отсылает к перечисленным ранее явлениям; по-русски собирательное «всё это» звучит естественно.
- source_word: ἀφιστᾷ
  choice: отвращает
  rationale: Передаёт значение удаления и увода от закона; единственное число согласовано с русским собирательным «всё это».
- source_word: τὸ διαβούλιον τῆς ψυχῆς
  choice: рассудок души
  rationale: διαβούλιον обозначает способность к обдумыванию и вынесению суждения; «рассудок» сохраняет этот смысл и избегает неверного значения «цель».
- source_word: ὑπερηφανίαν ἐκδιδάσκει
  choice: приучает к высокомерию
  rationale: Передаёт каузативно-наставительный смысл выражения естественным современным русским языком.
- source_word: ἐλεῆσαι τὸν πλησίον αὐτοῦ
  choice: проявлять милость к своему ближнему
  rationale: Сохраняет этически и богословски значимые понятия милости и ближнего.
theological_decisions:
- issue: Природа «рассудка души»
  choice: Сохранён антропологический оборот «рассудок души»
  alternative: «способность души рассуждать» или «суждение души»
  rationale: Греческий текст связывает διαβούλιον с ψυχή; буквальная образность сохранена без уточнения конкретной философской модели души.
- issue: Закон Бога
  choice: «закон Божий»
  alternative: «закон Бога»
  rationale: Оба варианта точны; традиционный русский оборот остаётся понятным, достоинственным и не вносит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксический параллелизм греческого перечисления сохранён, но формулировки сделаны естественными для обычного читателя.
