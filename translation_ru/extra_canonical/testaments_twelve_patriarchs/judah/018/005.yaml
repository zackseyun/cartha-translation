base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/005.yaml
  text: Guard yourselves, therefore, my children, from sexual immorality and the love of money, and listen to Judah your father.
translation:
  language: ru
  text: Итак, дети мои, берегитесь блуда и любви к деньгам и послушайте Иуду, вашего отца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: берегитесь
  rationale: Естественно передаёт повелительный аорист среднего залога со значением «остерегайтесь, храните себя от».
- source_word: πορνείας
  choice: блуда
  rationale: Краткий и уместный для древнего нравственного наставления русский эквивалент, обозначающий половую распущенность и недозволенные половые связи.
- source_word: φιλαργυρίας
  choice: любви к деньгам
  rationale: Прямо и понятно передаёт буквально «любовь к серебру/деньгам», не сужая значение до одной лишь жадности.
- source_word: ἀκούσατε
  choice: слушайте
  rationale: Сохраняет повелительное значение и допускает подразумеваемый оттенок послушания, не делая его явным вопреки тексту.
- source_word: Ἰούδα τοῦ πατρὸς ὑμῶν
  choice: Иуду, вашего отца
  rationale: Передаёт имя как объект глагола и приложение «вашего отца» естественным русским оборотом.
