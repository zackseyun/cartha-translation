  text: It deprives his soul of every goodness, and holds him fast in pains and labors; it drives sleep away from him, and consumes his flesh.
translation:
  language: ru
  text: Она лишает его душу всякого блага и держит его в страданиях и трудах; она отгоняет от него сон и истощает его плоть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Στερίσκει
  choice: лишает
  rationale: Точно передаёт значение лишения чего-либо; форма единственного числа сохранена в согласовании с подразумеваемым субъектом из контекста.
- source_word: πάσης ἀγαθότητος
  choice: всякого блага
  rationale: Естественная русская передача всеохватного выражения; «благо» здесь обозначает всё доброе и благотворное.
- source_word: συνέχει
  choice: держит ... в тисках
  rationale: Передаёт не просто пребывание, а удерживание и сковывание в мучительном состоянии.
- source_word: πόνοις καὶ μόχθοις
  choice: страданий и тяжких трудов
  rationale: 'Сохраняет два близких, но различных понятия: мучительные страдания и изнурительный труд.'
- source_word: τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ
  choice: отгоняет от него сон
  rationale: Идиоматично выражает удаление сна от человека, не вводя дополнительного толкования.
- source_word: καταδαπανᾷ τὰς σάρκας αὐτοῦ
  choice: истощает его плоть
  rationale: Глагол выражает полное изнурение или растрачивание; множественное «плоти» по-русски естественно передаётся собирательным единственным числом.
theological_decisions:
- issue: Род подразумеваемого субъекта при глаголах единственного числа
  choice: Женское местоимение «она»
  alternative: Среднее «оно» или повтор названия субъекта из предыдущего стиха
  rationale: Греческий текст данного стиха подразумевает единичный субъект из контекста; русское женское местоимение сохраняет анафорическую связь с вероятным существительным женского рода, не превращая субъект во множественное число.
