  text: And the Lord gave me favor in all my works[a], in the field and in the house. I know that I ran with a hind and caught it, and I made it food for my father, and he ate. And I would seize the gazelle in its course, and I overtook everything that was in the fields. I killed the lion and snatched a kid from its mouth. I took hold of the bear by its foot and cast it down the cliff, and it was crushed. I ran down the wild boar, and I overtook it as I ran and tore it apart. I caught a wild mare and, after seizing it, subdued it. A leopard in Hebron sprang upon the dog, and I caught it by the tail and flung it against the rock, and it was split in two. I found a wild ox grazing in the land, and taking hold of its horns[c][b], I shook it round and round and struck it blind.
translation:
  language: ru
  text: '**Завещание Иуды, 2**


    1 И даровал мне Господь благоволение[b] во всех моих делах[a] — и в поле, и в доме. 2 Я знаю, что бежал наперегонки с ланью, поймал её, приготовил из неё пищу для моего отца, и он ел. 3 Газель я хватал прямо на бегу и настигал всё, что было в полях. 4 Я убил льва и вырвал козлёнка из его пасти. Схватив медведя за лапу, я сбросил его с обрыва, и он разбился. 5 Я догнал дикого кабана, настиг его на бегу и растерзал. 6 В Хевроне леопард бросился на пса; я схватил леопарда за хвост, швырнул о скалу, и он разорвался надвое. 7 Я нашёл дикого быка[c], пасшегося в той земле, схватил его за рога и, раскачав его кругом, ослепив и бросив, убил его. 8 И льва я укротил.


    [a] Греческий текст этой главы местами шероховат, особенно в последовательности рассказов об охоте. Перевод следует сохранившемуся греческому свидетельству и не устраняет полностью его отрывистость.


    [b] Или: «милость». Здесь речь идёт о дарованном Богом успехе в делах Иуды, поэтому в основном тексте выбрано слово «благоволение».


    [c] Или: «дикого вола». Греческое слово допускает оба перевода; имеется в виду крупное неприручённое животное из рода быков.'
  philosophy: optimal-equivalence
