lexical_decisions:
- source_word: χάριν
  choice: благоволение
  rationale: Передаёт благосклонность Господа, благодаря которой Иуде сопутствовал успех, не сводя слово к отвлечённому богословскому термину; вариант «милость» отмечен в сноске.
- source_word: Κύριος
  choice: Господь
  rationale: Обычное и достойное русское соответствие божественному титулу κύριος.
- source_word: ἐλάφῳ
  choice: ланью
  rationale: Местоимение αὐτήν указывает на животное женского пола; «лань» сохраняет это указание точнее общего слова «олень».
- source_word: συνέδραμον
  choice: состязался в беге
  rationale: Сохраняет образ движения вместе с ланью, а не подменяет его простым «догнал», поскольку последующий глагол отдельно сообщает о поимке.
- source_word: δορκάδα
  choice: газель
  rationale: Наиболее ясное современное соответствие названию животного δορκάς.
- source_word: ἀφειλόμην
  choice: вырвал
  rationale: Передаёт силой отнятого у льва козлёнка и динамику сцены.
- source_word: κρημνόν
  choice: обрыва
  rationale: Естественно передаёт крутой отвесный склон, с которого был сброшен медведь.
- source_word: κατεσπάραξα
  choice: растерзал
  rationale: Передаёт насильственное разрывание кабана кратким и естественным русским глаголом.
- source_word: βοῦν ἄγριον
  choice: дикого быка
  rationale: В контексте подчёркнуты рога и сила неприручённого крупного рогатого животного; «дикий вол» оставлен как допустимый вариант в сноске.
- source_word: ἡμέρωσα
  choice: укротил
  rationale: Прямо передаёт действие приручения или усмирения льва без добавления отсутствующих подробностей.
theological_decisions:
- issue: Источник успеха Иуды
  choice: Господь дарует Иуде благоволение во всех его делах
  alternative: Фраза может пониматься как общая формула благословения без акцента на непосредственном содействии каждому подвигу
  rationale: Начальная строка явно связывает достижения Иуды с благоволением Господа, однако дальнейшее повествование сохраняет личную действенность самого Иуды.
