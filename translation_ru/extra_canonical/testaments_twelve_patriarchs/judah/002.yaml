  register: Современный литературный русский язык с достоинством древнего повествования и короткими, энергичными фразами. Сохранена отрывистая последовательность подвигов. В отличие от английского консультационного слоя, не добавлен эпизод с дикой кобылицей, отсутствующий в предоставленном греческом тексте; при этом переведена заключительная фраза стиха 8 об укрощении льва, присутствующая в источнике.
