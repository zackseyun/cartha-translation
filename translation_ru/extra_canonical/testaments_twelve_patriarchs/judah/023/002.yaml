base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/002.yaml
  text: You will make your daughters musicians and public women, and you will mingle with the abominations of the nations.
translation:
  language: ru
  text: Вы сделаете своих дочерей музыкантками и публичными женщинами[a] и смешаетесь с мерзостями народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Букв. «публичными»; вероятно, эвфемистическое обозначение женщин, доступных любому, то есть проституток.
    reason: «Публичные женщины» сохраняет эвфемистическую форму оригинала, а примечание поясняет её вероятный смысл, не устраняя возможную неоднозначность.
lexical_decisions:
- source_word: μουσικὰς
  choice: музыкантками
  rationale: Прилагательное μουσικός здесь употреблено предикативно и обозначает женщин, занимающихся музыкой; нейтральное «музыкантками» не сужает значение до певиц или танцовщиц.
- source_word: δημοσίας
  choice: общедоступными женщинами
  rationale: В отношении женщин δημόσιος может быть эвфемистическим обозначением женщин, доступных любому, то есть проституток. Перевод сохраняет образное выражение оригинала, а сноска поясняет смысл.
- source_word: ἐπιμιγήσεσθε
  choice: смешаетесь
  rationale: Глагол означает смешиваться или вступать в смешение с кем-либо или чем-либо; «смешаетесь» сохраняет метафору и связь с предлогом ἐν.
- source_word: βδελύγμασι ἐθνῶν
  choice: мерзостями народов
  rationale: «Мерзости» передаёт сильную нравственно-религиозную окраску βδέλυγμα, а «народов» сохраняет нейтральное значение ἔθνη без автоматической замены на «язычников».
theological_decisions:
- issue: Связь с «мерзостями народов»
  choice: смешаетесь с мерзостями народов
  alternative: станете участвовать в мерзостях народов
  rationale: Более разъяснительный вариант устранил бы метафору смешения и сузил неоднозначность конструкции ἐπιμιγήσεσθε ἐν; основной текст сохраняет напряжённую образность греческого текста.
translation_notes:
  register: Современный литературный русский язык с сохранением сурового пророческого тона. Синтаксис сделан прямым и понятным, при этом метафора смешения и эвфемизм оригинала не устранены.
