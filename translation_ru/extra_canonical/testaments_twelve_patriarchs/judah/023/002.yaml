  text: Τὰς θυγατέρας ὑμῶν μουσικὰς καὶ δημοσίας¹² ποιήσετε¹³, *καὶ ἐπιμιγήσεσθε¹⁴ ἐν βδελύγμασι ἐθνῶν.
