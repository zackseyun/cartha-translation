base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/003.yaml
  text: Because of these things the Lord will bring upon you famine and pestilence, death and the avenging sword, siege, and the reproaches of enemies and friends. By foreigners my kingdom will be brought to an end.
translation:
  language: ru
  text: За это Господь наведёт на вас голод и мор, смерть и карающий меч, осаду, псов для растерзания, вражеские поношения и погибель от врагов[a], поражение глаз[b], убийство младенцев, разграбление имущества[c], сожжение храмов Божьих, опустошение земли, а вас самих — в рабство среди народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «гибель врагов». Греческое сочетание допускает понимание родительного падежа как указания либо на виновников гибели, либо на тех, кто погибает; контекст бедствий, наведённых «на вас», поддерживает основной перевод.'
    reason: Сохранение реальной грамматической и контекстуальной неоднозначности ἀπώλειαν ἐχθρῶν.
  - marker: b
    text: Греческое слово может означать омертвение или тяжёлое, в том числе гангренозное, поражение глаз.
    reason: Уточнение широкого и редкого медицинского значения σφακελισμός без чрезмерной конкретизации в основном тексте.
  - marker: c
    text: 'В ряде свидетельств соответствующее слово текстуально неустойчиво; буквально: «грабёж того, что имеется», то есть владений или имущества.'
    reason: Отражение отмеченной в представленном греческом тексте текстуальной неуверенности при сохранении наиболее вероятного чтения.
lexical_decisions:
- source_word: Ἀνθ᾽ ὧν
  choice: За это
  rationale: Естественно передаёт причинно-следственное «вследствие чего / за эти дела» без излишнего уточнения отсутствующего в стихе антецедента.
- source_word: λιμὸν καὶ λοιμόν
  choice: голод и мор
  rationale: Сохраняет традиционную парность и различает нехватку пищи и повальную болезнь.
- source_word: ῥομφαίαν, ἐκδικοῦσαν
  choice: карающий меч
  rationale: Причастие описывает меч как совершающий возмездие; «карающий» ясно и кратко передаёт этот смысл.
- source_word: κύνας εἰς διασπασμόν
  choice: псов, разрывающих тела
  rationale: Буквально речь о псах «для растерзания/разрывания»; добавление «тела» делает эллиптический греческий оборот понятным по-русски, не меняя образа.
- source_word: σφακελισμὸν ὀφθαλμῶν
  choice: поражение глаз
  rationale: Σφακελισμός может обозначать омертвение, гангренозное поражение или тяжёлое воспаление; общий русский термин сохраняет неопределённость вида болезни.
- source_word: νηπίων ἀναιρέσεις
  choice: убийство младенцев
  rationale: Передаёт множественные насильственные лишения жизни без неестественного русского множественного числа «убийства» в перечне бедствий.
- source_word: ὑπαρχόντων ἁρπαγήν
  choice: разграбление имущества
  rationale: Τὰ ὑπάρχοντα — имеющееся имущество или владения; «разграбление» точно выражает насильственный захват.
- source_word: δουλείαν ἐν ἔθνεσι
  choice: рабство среди народов
  rationale: Сохраняет общий смысл пребывания в рабстве у/среди иных народов, не подменяя ἔθνη более узким этнонимом.
theological_decisions:
- issue: Божественное действие в перечне бедствий
  choice: «Господь наведёт на вас»
  alternative: «Господь допустит, чтобы вас постигли»
  rationale: Греческое ἐπάξει прямо представляет Господа субъектом действия «наведёт/приведёт»; перевод не смягчает богословское напряжение посредством идеи одного лишь допущения.
- issue: ναῶν θεοῦ во множественном числе
  choice: «храмов Божьих»
  alternative: «святилищ Бога»
  rationale: Сохранено множественное число исходного текста. «Храмы Божьи» понятно современному читателю и не сводит выражение к единственному Иерусалимскому храму.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным ритмом пророческого перечня. Синтаксическая протяжённость оригинала сохранена одним предложением; устаревшая лексика ограничена прозрачными словами «мор» и «псы». Английский консультационный текст отражает существенно более краткую форму и содержит отсутствующие в данном греческом источнике мотивы друзей, чужеземцев и конца царства; поэтому русский проект следует предоставленному греческому тексту, а не этим расхождениям.
