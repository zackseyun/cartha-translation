- from: …до пришествия Бога праведности, чтобы Иаков и все народы обрели покой в мире. И Он сохранит могущество моего царства навеки, ибо Господь поклялся мне, что не изгладит царство из числа моих потомков навеки.[a]
  to: …до пришествия Бога праведности, чтобы дать Иакову и всем народам покой в мире. И он сохранит могущество моего царства навеки, ибо Господь поклялся мне, что не уничтожит царства среди моих потомков навеки.
