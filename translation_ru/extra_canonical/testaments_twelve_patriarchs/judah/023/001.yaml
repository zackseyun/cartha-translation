base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/001.yaml
  text: Until the coming of the God of righteousness, to give Jacob rest in peace, and all the nations. And he will preserve the might of my kingdom forever; for the Lord swore to me by an oath not to blot out the kingdom. Much grief is mine, my children, because of the sexual immoralities and sorceries that you will do in the kingdom, following ventriloquists, omens, and deceiving demons.
translation:
  language: ru
  text: …до пришествия Бога праведности, чтобы дать Иакову и всем народам покой в мире. И он сохранит могущество моего царства навеки, ибо Господь поклялся мне, что не уничтожит царства среди моих потомков навеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρουσία
  choice: пришествие
  rationale: Передаёт личное явление или прибытие; традиционное слово здесь остаётся понятным современному читателю.
- source_word: Θεοῦ τῆς δικαιοσύνης
  choice: Бога праведности
  rationale: Сохранён буквальный родительный оборот и его возможная титульная сила без сведения смысла к более однозначному «праведного Бога».
- source_word: τοῦ ἡσυχάσαι
  choice: чтобы … обрели покой
  rationale: Естественно передаёт целевое значение инфинитива и смысл прекращения смуты, не перегружая русскую фразу буквальным «успокоить».
- source_word: φυλάξει κράτος τῆς βασιλείας μου
  choice: сохранит могущество моего царства
  rationale: φυλάσσω передано как сохранение, а κράτος — как могущество/властная сила, с сохранением связи с царством Иуды.
- source_word: ἐκ τοῦ σπέρματός μου
  choice: из числа моих потомков
  rationale: Контекстуально передаёт династический смысл σπέρμα и естественно сочетается с «не изгладит царство».
- source_word: ἕως αἰῶνος
  choice: навеки
  rationale: Краткий современный эквивалент формулы длительности; повтор исходного выражения сохранён.
theological_decisions:
- issue: К кому относится αὐτός («Он»)
  choice: Он
  alternative: он
  rationale: Наиболее близкий референт — Бог; прописная буква уместна в русском религиозном тексте, но местоименная форма не добавляет имени или титула.
- issue: Значение выражения «Бог праведности»
  choice: сохранить родительный оборот
  alternative: праведный Бог / Бог, дарующий праведность
  rationale: Греческое выражение допускает оттенки качества, принадлежности и источника праведности; перевод не должен устранять эту неоднозначность.
- issue: Объём стиха при расхождении источников
  choice: перевести только засвидетельствованный греческий текст
  alternative: включить фразы английского консультационного слоя о разврате, колдовстве и демонах
  rationale: Эти фразы отсутствуют в предоставленном греческом отрывке, поэтому их включение как перевода исходного текста было бы необоснованным.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего завещательного пророчества. Начальное многоточие отмечает фрагментарное начало предоставленного греческого текста. Синтаксис слегка упорядочен для ясности, но повторы «царство» и «навеки» сохранены как смысловые элементы оригинала.
