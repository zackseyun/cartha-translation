lexical_decisions:
- source_word: κατέδραμον
  choice: погнался за
  rationale: Глагол передаёт стремительное преследование; по-русски «погнался за» естественно выражает начало погони и не дублирует последующее «настиг».
- source_word: προέλαβον
  choice: настиг
  rationale: В данном контексте означает догнать преследуемого зверя; «настиг» соответствует энергичному повествовательному регистру.
- source_word: ἐν τῷ τρέχειν με
  choice: на бегу
  rationale: 'Естественно и кратко передаёт одновременность: Иуда настиг зверя, продолжая бежать.'
- source_word: κατεσπάραξα
  choice: растерзал
  rationale: Глагол обозначает разрывание на части; «растерзал» сохраняет силу образа без лишнего пояснения.
