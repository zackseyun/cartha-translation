lexical_decisions:
- source_word: Πάρδαλις
  choice: барс
  rationale: Передаёт крупную пятнистую кошку; в современном литературном русском уместнее и естественнее, чем более специальное «пардус».
- source_word: προσεπήδησεν ἐπὶ
  choice: бросился на
  rationale: Естественно передаёт резкое нападение прыжком.
- source_word: πιάσας ... ἀπὸ τῆς κέρκου
  choice: схватил ... за хвост
  rationale: Точно и естественно выражает действие и точку захвата.
- source_word: ἀπηκόντισα
  choice: швырнул
  rationale: Передаёт сильный метательный бросок, заложенный в глаголе.
- source_word: ἐρράγη εἰς δύο
  choice: разорвался надвое
  rationale: 'Сохраняет пассивно-результативный смысл: тело животного от удара разделилось на две части.'
