  text: I caught a wild mare and, after seizing it, I subdued it.
translation:
  language: ru
  text: Я убил льва и вырвал козлёнка из его пасти. Схватив медведицу за лапу, я сбросил её с обрыва, и она разбилась.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых реконструкциях и переводах этого места говорится о поимке и укрощении дикой кобылицы, однако приведённый греческий текст повествует об убийстве льва и низвержении медведицы с обрыва.
    reason: Английский консультационный текст существенно расходится с предоставленным греческим источником; примечание сохраняет прозрачность текстовой проблемы.
lexical_decisions:
- source_word: ἀπέκτεινα
  choice: убил
  rationale: Прямо передаёт аорист первого лица единственного числа.
- source_word: ἀφειλόμην
  choice: вырвал
  rationale: В контексте спасения козлёнка из пасти хищника естественно передаёт значение «отнял, извлёк силой».
- source_word: ἔριφον
  choice: козлёнка
  rationale: Обычное значение греческого существительного; родительный оборот передан естественно по-русски.
- source_word: ἄρκον
  choice: медведицу
  rationale: Форма винительного падежа женского рода указывает на самку медведя.
- source_word: ἀπὸ τοῦ ποδὸς
  choice: за лапу
  rationale: Буквально «за ногу»; применительно к медведице современное русское «за лапу» звучит естественно и точно.
- source_word: ἀπέλυσα τὸν κρημνόν
  choice: сбросил её с обрыва
  rationale: Греческая конструкция в данном чтении необычна; по контексту обозначает низвержение медведицы с обрыва.
- source_word: συνετρίβη
  choice: разбилась
  rationale: Пассивный аорист означает, что животное было сокрушено при падении; русский возвратный глагол естественно передаёт результат.
