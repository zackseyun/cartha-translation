  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002/007.yaml
  text: I found a wild ox grazing in the land, and, taking hold of its horns, I shook it all around and blinded it.
translation:
  language: ru
  text: Я нашёл дикого быка, пасшегося в той земле, схватил его за рога, раскачал из стороны в сторону, ослепил[a], повалил и убил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «помрачил» или «лишил света».'
    reason: Греческое σκοτίσας буквально обозначает помрачение; перевод «ослепил» передаёт наиболее вероятный смысл в контексте, не скрывая образности исходного слова.
lexical_decisions:
- source_word: Βοῦν ἄγριον
  choice: дикого быка
  rationale: Прямое и естественное соответствие греческому выражению; «дикий вол» в современном русском звучал бы менее естественно.
- source_word: τὴν χώραν νεμόμενον
  choice: пасшегося в той земле
  rationale: Передаёт причастие νέμομαι в значении «пастись» и сохраняет указание на местность.
- source_word: κρατήσας τῶν κεράτων
  choice: схватил его за рога
  rationale: 'Естественно передаёт физическое действие: крепко взяться за рога.'
- source_word: κύκλῳ συσσείσας
  choice: раскачал из стороны в сторону
  rationale: Передаёт интенсивное встряхивание; буквальное «вокруг» по-русски здесь неясно и может ошибочно означать обход вокруг животного.
- source_word: σκοτίσας
  choice: ослепил
  rationale: В данном контексте глагол со значением «помрачить, лишить света» естественнее всего относится к лишению зрения, хотя греческая формулировка допускает более буквальное понимание.
- source_word: ῥίψας
  choice: повалил
  rationale: Контекстуальное соответствие «бросив/повергнув» применительно к борьбе с животным.
- source_word: ἀνεῖλον αὐτόν
  choice: и убил
  rationale: Сохраняет заключительное личное сказуемое греческого текста, отсутствующее в английском консультационном слое.
theological_decisions: []
