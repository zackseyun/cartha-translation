  text: Βοῦν ἄγριον εὗρον τὴν χώραν νεμόμενον, καὶ κρατήσας³⁰ τῶν κεράτων³¹ καὶ³² κύκλῳ³³ συσσείσας³⁴ *καὶ σκοτίσας ῥίψας³⁵ *ἀνεῖλον³⁶ αὐτόν³⁷. 8. *Καὶ λέοντα³⁸ ἡμέρωσα³⁹.
