  text: I know that I ran with a hind and caught it, and I made it food for my father, and he ate.
translation:
  language: ru
  text: Я знаю, что бежал вместе с ланью, поймал её, приготовил из неё пищу для моего отца, и он съел это.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἶδα
  choice: Я знаю
  rationale: Передаёт форму настоящего времени и уверенное свидетельство говорящего без добавления временного оттенка.
- source_word: συνέδραμον ἐλάφῳ
  choice: бежал наравне с ланью
  rationale: Глагол συντρέχω означает совместный или сопоставимый бег; «наравне» естественно передаёт здесь состязательный смысл. ἔλαφος в данном контексте и согласно английскому консультационному слою передано как самка оленя — «лань».
- source_word: ἐπίασα αὐτήν
  choice: поймал её
  rationale: Прямое и естественное соответствие греческому выражению.
- source_word: ἐποίησα αὐτὴν βρῶμα
  choice: приготовил из неё пищу
  rationale: Буквально — «сделал её пищей»; выбранная формулировка сохраняет смысл и звучит естественно по-русски.
- source_word: τῷ πατρί μου
  choice: для моего отца
  rationale: Сохраняет значение дательного адресата/получателя.
- source_word: ἔφαγεν
  choice: он ел
  rationale: Передаёт простой аорист без добавления объекта, отсутствующего в греческом тексте.
