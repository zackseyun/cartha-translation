    rationale: Формулировка добавляет смысл равенства или состязания, которого греческое συνέδραμον с дательным падежом и английское «ran with» не требуют.
  - severity: low
    issue: «И он ел»
    rationale: Несовершенный вид звучит как длительное или повторяющееся действие, тогда как аорист обозначает единичное завершённое действие; в русском также требуется естественно восстановить подразумеваемый объект.
