  source_fidelity: 'Основное содержание передано верно: δορκάς — «газель», ἐκράτουν и κατελάμβανον сохранены как повторяющиеся действия в прошедшем времени, а «в полях» точно соответствует ἐν τοῖς πεδίοις. Однако «прямо на бегу» не передаёт διὰ τοῦ δρόμου: в предоставленном греческом тексте сказано о дороге/пути, а не о способе бега. Английская контрольная версия также понимает этот оборот как «along the road».'
  naturalness: «Газель же я ловил на дороге» — естественная современная литературная формулировка; союз «же» уместно передаёт δέ. «Настигал всё, что было в полях» сохраняет энергичный повествовательный стиль и не перегружает фразу.
  terminology: «Газель» — точный и общепонятный эквивалент δορκάς. Специальной богословской терминологии в отрывке нет. В исходной выдержке имеются якоря примечаний 7–9, поэтому они сохранены; содержание самих примечаний в предоставленных данных отсутствует и не должно реконструироваться предположительно.
