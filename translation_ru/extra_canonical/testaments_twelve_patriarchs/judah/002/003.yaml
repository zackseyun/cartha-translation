  text: And I would seize the gazelle along the road, and I overtook everything that was in the fields. I killed the lion and snatched a kid from its mouth. I took hold of the bear by its foot and threw it down the cliff, and it was crushed.
translation:
  language: ru
  text: Газель же я ловил прямо на бегу и настигал всё, что было в полях.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δορκάδα
  choice: газель
  rationale: Прямое и общепонятное обозначение животного; сохраняет образ греческого текста.
- source_word: διὰ τοῦ δρόμου
  choice: прямо на бегу
  rationale: Оборот допускает понимание, связанное с бегом или преследованием. В контексте необычайной быстроты Иуды передано естественно по-русски без привнесения образа дороги, который здесь менее вероятен.
- source_word: ἐκράτουν
  choice: ловил
  rationale: Глагол означает овладевать, схватывать, удерживать. «Ловил» естественно описывает поимку быстро бегущей газели и сохраняет длительно-повторяющийся оттенок имперфекта.
- source_word: κατελάμβανον
  choice: настигал
  rationale: Передаёт значение догнать или настичь и согласуется с контекстом быстроты; имперфект отражён формой несовершенного вида.
- source_word: ἐν τοῖς πεδίοις
  choice: в полях
  rationale: Естественный русский эквивалент множественного πεδία; возможное «на равнинах» не требуется контекстом.
theological_decisions:
- issue: Расхождение между греческим источником и английским консультационным текстом
  choice: Переведено только предложение, засвидетельствованное в предоставленном греческом тексте
  alternative: Добавить рассказы об убийстве льва и медведя из английского POB
  rationale: Эти предложения отсутствуют в предоставленном оригинально-языковом источнике данного стиха; их включение сделало бы русский текст несоответствующим исходному свидетельству.
translation_notes:
  register: Современный литературный русский язык с простым, энергичным повествованием. Союз «же» передаёт δέ, а несовершенный вид глаголов сохраняет повторяющийся или характерный характер действий в греческом имперфекте.
