  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/001.yaml
  text: 'The Testament of Judah[a], the fourth son of Jacob and Leah.


    A copy of the words of Judah, which he spoke to his sons before he died.


    2 So they gathered and came to him, and he said to them:


    3 “Hear, my children, Judah your father. I was born the fourth son to my father Jacob, and Leah my mother named me Judah, saying, ‘I give praise to the Lord, because he has given me also a fourth son.’ 4 I was keen in my youth, and I obeyed my father in every matter. 5 And I honored my mother and my mother''s sister. 6 And when I had grown up, my father blessed me, saying, ‘You shall be a king[b], prospering in all things.’”'
translation:
  language: ru
  text: 'Завещание Иуды, четвёртого сына Иакова и Лии.


    Копия слов Иуды, которые он произнёс своим сыновьям перед смертью.


    2 Итак, собравшись, они пришли к нему, и он сказал им:


    3 «Послушайте меня, дети мои, — Иуду, вашего отца. Я родился четвёртым сыном у моего отца Иакова, и моя мать Лия назвала меня Иудой, сказав: „Я воздаю хвалу Господу за то, что Он дал мне ещё и четвёртого сына“.


    4 В юности я был проворен и во всём слушался своего отца. 5 Я почитал свою мать и сестру моей матери[a]. 6 Когда же я возмужал, отец помолился обо мне, сказав: „Ты будешь царём и во всём будешь преуспевать[b]“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сестру моей матери»; то есть тётку по материнской линии.'
    reason: Сохранено явно выраженное в греческом тексте родство, а не только более общее обозначение «тётя».
  - marker: b
    text: Греческое причастие может также означать, что путь человека направляется к успеху или устраивается благополучно.
    reason: Сохранён широкий смысл κατευοδούμενος, который не ограничивается только материальным благополучием.
lexical_decisions:
- source_word: Διαθήκη
  choice: Завещание
  rationale: В заглавии этого произведения слово обозначает предсмертное наставление патриарха, а не богословски понимаемый завет.
- source_word: Ἀντίγραφον
  choice: Список
  rationale: Слово задаёт документальную рамку и обозначает письменную копию или запись произнесённых слов.
- source_word: Ἀκούσατε
  choice: Послушайте
  rationale: Естественный современный русский императив, сохраняющий настойчивость торжественного отцовского обращения.
- source_word: ἐγὼ τέταρτος υἱὸς ἐγενόμην
  choice: Я родился четвёртым сыном
  rationale: Идиоматично передаёт порядок рождения, не воспроизводя неестественное по-русски буквальное «стал четвёртым сыном».
- source_word: Ἀνθομολογοῦμαι
  choice: Я воздаю хвалу
  rationale: Передаёт благодарственное прославление Бога в объяснении имени Иуды.
- source_word: ὀξύς
  choice: проворен
  rationale: Сохраняет широкий положительный смысл быстроты, живости и деятельной энергии, не сводя его только к уму или пылкости.
- source_word: κατὰ πάντα λόγον
  choice: во всём
  rationale: В контексте послушания выражение относится ко всякому слову или указанию отца; по-русски это естественно передаётся обобщённо.
- source_word: ἡδρύνθην
  choice: возмужал
  rationale: Передаёт достижение зрелости и крепости более точно и достойно, чем нейтральное «вырос».
- source_word: ηὔξατό μοι
  choice: помолился обо мне
  rationale: Сохраняет непосредственное значение греческого глагола «молиться, возносить пожелание», не заменяя его без пояснения словом «благословил».
- source_word: κατευοδούμενος
  choice: во всём будешь преуспевать
  rationale: Причастие выражает успешное продвижение или благополучный исход; личная глагольная конструкция естественна в русском предсказании.
theological_decisions:
- issue: Передача Κυρίῳ в словах Лии
  choice: Господу
  alternative: Владыке
  rationale: Здесь κύριος является божественным титулом в формуле хвалы Богу Израиля; традиционное «Господь» ясно и не вносит конфессионального уточнения.
- issue: Характер слов Иакова в 1:6
  choice: отец помолился обо мне
  alternative: отец благословил меня
  rationale: Хотя высказывание функционально напоминает патриархальное благословение, греческий текст использует ηὔξατο, «помолился, выразил молитвенное пожелание». Перевод сохраняет это различие и не снимает напряжение между формой молитвы и пророческим содержанием.
- issue: Значение царского обещания
  choice: Ты будешь царём
  alternative: Ты будешь царствовать
  rationale: Именная форма βασιλεὺς ἔσῃ прямо говорит о будущем статусе Иуды, не уточняя ни исторического осуществления, ни мессианского толкования.
translation_notes:
  register: Современный литературный русский с умеренно торжественным тоном завещательного наставления. Синтаксис сделан естественным для устной речи отца к детям, при этом сохранены документальное вступление, явные родственные связи и неоднозначность ключевых греческих слов.
