  text: 1[a]. After this, when Tamar had been a widow for two years and heard that I was going up to shear the sheep, she adorned herself with bridal adornment and sat in Enaim, at the city gate of the inn. 2. For it was a law of the Amorites that a widow should sit there openly for prostitution. 3. So when I was drunk with wine, I did not recognize her, and she deceived me by her beauty through the appearance of her adornment. 4[b]. And turning aside to her I said, “I will come in to you.” And she said, “What will you give me?” And I gave her my staff and my ring and the diadem of my kingdom as a pledge. And when I had gone in to her, she conceived. 5. But I, not knowing what I had done, wanted to kill her. Yet she sent the pledges secretly and put me to shame. 6. And when I called her, I heard also the secret words that, while sleeping with her in my drunkenness, I had spoken. And I was not able to kill her, because it was from the Lord. 7. For I said, “Perhaps she did this deceitfully,
    having received the pledge from another.” 8. But I did not approach her again for the rest of my life, because I had done this abomination in all Israel. 9. Yet those in the city said that there had been no harlot sitting at the gate, because she had come from another place and sat for a short time at the gate. 10. And I supposed that no one knew that I had gone in to her. 11. And after this we came into Egypt to Joseph because of the famine. 12. Now I was forty-six years old[d][c], and I spent seventy-three years in Egypt.
translation:
  language: ru
  text: '**Завещание Иуды, 12**


    1. После этого, когда Фамарь уже два года была вдовой, она услышала, что я иду стричь овец, украсила себя как невеста и села в городе Енан у ворот.[a] 2. Ибо у аморреев был закон: вдова должна была в течение семи дней сидеть у ворот. 3. Я же, опьянев от вина, не узнал её, и её красота обманула меня видом её убранства. 4. Свернув к ней, я сказал: «Я войду к тебе». Она спросила: «Что ты мне дашь?» Я отдал ей в залог свой посох и свою диадему.[b] И когда я сошёлся с ней, она зачала. 5. Не зная, что я сделал, я хотел убить её; но она тайно прислала залоги и пристыдила меня. 6. Позвав её, я услышал также тайные слова, которые произнёс, когда в опьянении спал с ней. И я не смог убить её, потому что это было от Господа.[c] 7. Ведь я говорил: «Не сделала ли она это обманом, получив залоги от другой женщины, и не воспользовалась ли со мной прежними словами?» 8. Но я больше не приближался к ней до конца своей жизни. 9. И всё же жители города говорили, что у ворот не было никого, кто совершал бы
    это,[d] потому что она пришла из другого места и лишь ненадолго села у ворот. 10. Я думал, что никто не узнал, что я вошёл к ней. 11. После этого из-за голода мы пришли в Египет, к Иосифу. 12. Мне тогда было сорок шесть лет, и я прожил в Египте семьдесят три года.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В представленном греческом тексте сказано: «в городе Енан у ворот». Упоминания постоялого двора здесь нет; название места сопоставимо с Энаимом в Быт 38:14.'
    reason: textual_variant
  - marker: b
    text: 'Греческий текст называет два залога: посох и диадему. Кольцо и слова «моего царства», встречающиеся в иной форме текста, в данном источнике отсутствуют.'
    reason: textual_variant
  - marker: c
    text: Слова «это было от Господа» могут указывать на усмотренное Иудой действие или провидение Бога, не обязательно на одобрение самого поступка.
    reason: theological_tension
  - marker: d
    text: Греческое τελεσικόμενον здесь неясно. Оно может относиться к человеку, совершающему некое действие или обряд; контекст допускает связь с ситуацией у ворот, но не позволяет уверенно определить термин точнее.
    reason: lexical_alternative
