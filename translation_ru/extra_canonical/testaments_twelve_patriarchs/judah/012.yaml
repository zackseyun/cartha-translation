- issue: παρὰ Κυρίου ἦν в стихе 6
  choice: потому что это было от Господа
  alternative: потому что такова была воля Господа
  rationale: Буквальная формулировка сохраняет неопределённость между действием, попущением и провиденциальным устроением и не превращает её в утверждение об одобрении поступка.
- issue: Царственная диадема в стихе 4
  choice: сохранить «свою диадему»
  alternative: гармонизировать с Быт 38 и перевести как шнур или печать
  rationale: Представленный греческий текст содержит διάδημα и не содержит ни кольца, ни слов «моего царства»; перевод честно следует данному свидетельству.
- issue: Обычай аморреев в стихе 2
  choice: передать как семидневное сидение вдовы у ворот
  alternative: истолковать как публичную проституцию
  rationale: В представленном греческом тексте прямо названы семь дней у ворот, но отсутствует слово πορνεία; конфессионально или нарративно мотивированное дополнение не внесено.
