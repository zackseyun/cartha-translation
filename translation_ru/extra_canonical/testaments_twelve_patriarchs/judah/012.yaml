- source_word: ἑβδομήκοντα καὶ τρία ἔτη ἐποίησα εἰς Αἴγυπτον
  choice: прожил в Египте семьдесят три года
  rationale: Греческая конструкция не вполне обычна, но её смысл — продолжительность пребывания Иуды в Египте.
