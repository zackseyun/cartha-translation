  source_fidelity: Основной текст добавляет глагол «преступить», которого в греческом нет. Конструкция οὐκ ᾐσχύνθην τὴν ἐντολὴν τοῦ Θεοῦ буквально выражает отсутствие стыда по отношению к Божьей заповеди; её точный прагматический оттенок может быть дискуссионным, но прямое утверждение о сознательном преступлении заповеди — излишняя экспликация. «Выпив вина» и «взял в жёны хананеянку» точно и уместно передают остальные части стиха.
  naturalness: «Не устыдился Божьей заповеди» сохраняет намеренно необычную для современного русского сочетаемость оригинала, но остаётся понятным в литературном контексте. Она предпочтительнее более гладкого, но интерпретирующего «не постыдился преступить».
  terminology: «Божья заповедь» — естественная и точная передача τὴν ἐντολὴν τοῦ Θεοῦ. «Хананеянка» и брачная формула «взял в жёны» соответствуют γυναῖκα Χαναναίαν, не вводя конфессиональной интерпретации.
