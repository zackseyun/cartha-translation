  text: Выпив вина, я не устыдился Божьей заповеди и взял в жёны хананеянку.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιὼν τὸν οἶνον
  choice: Выпив вина
  rationale: Естественный русский деепричастный оборот точно передаёт предшествующее действие; определённый артикль при «вине» по-русски отдельно не выражается.
- source_word: οὐκ ᾐσχύνθην τὴν ἐντολὴν τοῦ Θεοῦ
  choice: я не постыдился преступить Божью заповедь
  rationale: Греческое αἰσχύνομαι с винительным допускает значение стыда или почтительного страха перед кем-либо или чем-либо. В контексте последующего брака с хананеянкой русская формулировка передаёт нравственный смысл конструкции, сохраняя образ стыда; «преступить» эксплицирует подразумеваемое нарушение.
- source_word: ἔλαβον γυναῖκα Χαναναίαν
  choice: взял в жёны хананеянку
  rationale: Идиоматический русский эквивалент выражения «взять женщину/жену», ясно обозначающий заключение брака; этноним передан естественной современной формой.
theological_decisions:
- issue: Характер отношения к Божьей заповеди
  choice: не постыдился преступить Божью заповедь
  alternative: не устыдился перед Божьей заповедью / не проявил почтения к Божьей заповеди
  rationale: Выбор не уточняет содержание заповеди и не вводит конфессионального толкования, но связывает редкую греческую конструкцию с явно порицаемым поступком в самом стихе. Смысловой оттенок почтительного страха отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Формула «Божья заповедь» понятна широкому читателю; «взял в жёны» естественно передаёт брачный смысл без архаизации.
