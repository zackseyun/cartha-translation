source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Πολλὴ⁴⁰ γὰρ⁴¹ τῷ πίνοντι οἶνον⁴², τέκνα μου⁴³, καὶ αὕτη ἐστὶν ἡ σύνεσις⁴⁴ τῆς οἰνοποσίας, *ἕως ὅτε ἔχει αἰδῶ⁴⁵, πίνει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/006.yaml
  text: 'For the one who drinks wine, my children, has need of much understanding, and this is the understanding for drinking wine: as long as he still has shame, let him drink.'
translation:
  language: ru
  text: 'Ибо тому, кто пьёт вино, дети мои, нужно большое благоразумие; и вот в чём состоит благоразумие при употреблении вина: пусть он пьёт лишь до тех пор, пока сохраняет стыд.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «пока имеет стыд». Греческое слово может обозначать стыд, стыдливость или чувство приличия.'
    reason: Поясняет буквальную форму и диапазон αἰδώς, не сводя слово к одному контекстуальному толкованию.
lexical_decisions:
- source_word: σύνεσις
  choice: благоразумие
  rationale: Здесь слово обозначает практическую рассудительность и самообладание при употреблении вина; «понимание» по-русски звучало бы слишком отвлечённо.
- source_word: οἰνοποσία
  choice: употребление вина
  rationale: Естественно и точно передаёт значение питья вина без разговорного или заведомо осуждающего оттенка.
- source_word: αἰδώς
  choice: стыд
  rationale: 'Сохраняет прямой нравственно-психологический смысл греческого слова: способность испытывать стыд и соблюдать пристойность.'
- source_word: ἕως ὅτε
  choice: лишь до тех пор, пока
  rationale: Передаёт временную границу, установленную сохранением стыда, и естественно звучит в русском наставлении.
theological_decisions:
- issue: Допустимость употребления вина
  choice: 'Сохранена условно-разрешительная формулировка: «пусть он пьёт лишь до тех пор»'
  alternative: Передать стих как полный запрет пить вино
  rationale: Греческий текст не устанавливает полного запрета, а связывает питьё с благоразумием и сохранением стыда; ужесточение внесло бы отсутствующую в источнике доктрину.
translation_notes:
  register: Современный литературный русский с достоинством наставления отца к детям. Синтаксис слегка приподнят, но прозрачен; сохранены обращение «дети мои» и напряжённая мысль источника о допустимости питья лишь при сохраняющемся нравственном самообладании.
