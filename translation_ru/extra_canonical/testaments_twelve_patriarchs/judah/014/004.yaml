base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/004.yaml
  text: For behold, it also led me astray, so that I was not ashamed before the multitude of the city. For in the sight of all I turned aside to Tamar, and I committed a great sin, and I uncovered the covering of uncleanness of my sons.
translation:
  language: ru
  text: Ибо вот, оно[a] ввело в заблуждение и меня, так что я не постыдился перед толпой горожан. Ибо у всех на глазах я свернул к Фамари, совершил великий грех и открыл покров нечистоты моих сыновей[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В этом стихе субъект действия не назван; «оно» отсылает к предшествующему контексту.
    reason: Не добавлять к греческому тексту конкретное истолкование подразумеваемого субъекта.
  - marker: b
    text: 'Буквально: «открыл покров нечистоты моих сыновей»; смысл необычного выражения не вполне ясен.'
    reason: Предупредить читателя о трудности и неоднозначности греческого оборота, сохранённого в основном тексте.
lexical_decisions:
- source_word: Ἰδοὺ γὰρ κἀμέ
  choice: Ведь вот, оно и меня
  rationale: Сохранены усилительные частицы γάρ, ἰδού и καί; порядок слегка приспособлен к естественной русской речи.
- source_word: ἐπλάνησεν
  choice: ввело в заблуждение
  rationale: Передаёт каузативный смысл «сбило с пути, ввело в заблуждение», не добавляя отсутствующий в данном стихе субъект.
- source_word: μὴ αἰσχυνθῆναι τὸ πλῆθος πόλεως
  choice: так что я не постыдился перед множеством горожан
  rationale: Греческая конструкция передана естественно по-русски; «множество города» осмыслено как собравшиеся жители города.
- source_word: ἐξέκλινα πρὸς τὴν Θαμάρ
  choice: я свернул к Фамари
  rationale: Сохранён пространственно-нравственный оттенок ἐκκλίνω («свернуть, уклониться»), не заменённый более истолковывающим глаголом.
- source_word: ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου
  choice: открыл покров нечистоты моих сыновей
  rationale: Необычный и неоднозначный образ оригинала сохранён почти буквально, без сведения его к одному предполагаемому эвфемистическому смыслу.
theological_decisions:
- issue: Неуказанный субъект глагола ἐπλάνησεν
  choice: Сохранить местоимение «оно» с примечанием
  alternative: Назвать предполагаемую силу или порок из предшествующего контекста
  rationale: В самом стихе субъект не назван; его явное уточнение могло бы преждевременно снять текстовую неоднозначность.
- issue: Образ «покрова нечистоты»
  choice: Сохранить формулировку и образ
  alternative: Передать истолковательно как «обнажил позор моих сыновей» или иной эвфемизм
  rationale: Греческое выражение необычно и допускает разные способы понимания; буквальная образность сохраняет богословское и повествовательное напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной речи. Синтаксис сделан понятным для широкого читателя, но ключевые повторы, усиление «ведь вот», последовательность признаний и необычный заключительный образ сохранены.
