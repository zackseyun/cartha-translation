lexical_decisions:
- source_word: ὅτι καίγε
  choice: ведь
  rationale: Передаёт пояснительно-причинную связь ὅτι с усилительным оттенком καίγε естественным современным русским союзом.
- source_word: τὰ δύο ταῦτα
  choice: эти две вещи
  rationale: Сохраняет указательность и намеренно общее обозначение двух ранее названных предметов.
- source_word: ἀφιστῶσι
  choice: отвращают
  rationale: Передаёт значение удаления или увода от должного направления; переходная конструкция соответствует греческому употреблению с прямым дополнением.
- source_word: τὴν διάνοιαν τοῦ ἀνθρώπου
  choice: разум человека
  rationale: διάνοια здесь обозначает мыслительную способность или внутреннюю направленность; «разум» звучит естественно и сохраняет смысл без ненужного уточнения объекта, от которого происходит отвлечение.
