  source_fidelity: «Ведь эти две вещи отвращают разум человека» точно передаёт ὅτι καίγε как пояснительно-усилительное «ведь», τὰ δύο ταῦτα как «эти две вещи» и ἀφιστῶσι τὴν διάνοιαν τοῦ ἀνθρώπου как воздействие, отворачивающее человеческий разум. Не названо направление, от которого разум отвращается, и исходная недоговорённость тем самым сохранена.
  naturalness: Фраза краткая, литературная и естественная для современного русского афористического контекста. Сочетание «отвращают разум человека» несколько возвышенно, но не архаично и уместно для переводного нравоучительного текста.
