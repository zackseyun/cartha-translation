  text: For if you drink wine to drunkenness, it throws your mind into turmoil with filthy thoughts, and heats your body toward pleasure for sexual immorality, and it commits sin and is not ashamed.
translation:
  language: ru
  text: Ведь если кто пьёт вино до опьянения, оно приводит твой ум в смятение нечистыми помыслами, разгорячает тело для наслаждения и толкает к блуду; тогда грех совершается без стыда¹.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς μέθην
  choice: до опьянения
  rationale: Передаёт результат или степень употребления вина естественным современным выражением, не ослабляя смысла «до состояния пьянства».
- source_word: ἐν διαλογισμοῖς ῥυπαροῖς
  choice: нечистыми помыслами
  rationale: «Помыслы» уместно передаёт внутренние мысли и намерения, а «нечистые» сохраняет нравственную окраску ῥυπαροῖς без излишней грубости.
- source_word: συνταράσσει τὸν νοῦν σου
  choice: приводит твой ум в смятение
  rationale: Сохраняет интенсивный смысл συνταράσσει — глубокое внутреннее расстройство или смятение — и переход оригинала от неопределённого «кто» ко второму лицу «твой».
- source_word: εἰς πορνείαν
  choice: желание разврата
  rationale: В данном синтаксисе обозначает направленность телесного возбуждения к сексуальной распущенности; «разврат» шире и естественнее в русском, чем узкое «блуд».
- source_word: πρὸς ἡδονήν
  choice: возбуждая желание
  rationale: Передаёт направленность к чувственному наслаждению идиоматично, связывая удовольствие с телесным возбуждением и последующим развратом.
- source_word: πράσσει τὴν ἁμαρτίαν
  choice: человек совершает грех
  rationale: Явно обозначенный субъект делает русский текст грамматически ясным; источник допускает смену или неясность субъекта после среднего рода «тело».
theological_decisions:
- issue: Причинная роль вина и человеческая ответственность
  choice: Сохранить вино как непосредственный грамматический субъект первых действий, но назвать человека субъектом совершения греха
  alternative: «оно совершает грех и не стыдится» либо «тело совершает грех»
  rationale: Так сохраняется предостережение о воздействии опьянения, но грех не приписывается неодушевлённому вину; при этом не вводится особая доктринальная трактовка.
- issue: Значение πορνεία
  choice: разврат
  alternative: блуд / половая распущенность
  rationale: «Разврат» понятно современному читателю и сохраняет широкий смысл незаконного или безнравственного сексуального поведения без конфессионально обусловленного уточнения.
translation_notes:
  register: Современный литературный русский язык с назидательным и достойным тоном. Сохранена заметная смена от «кто» к «твой», присутствующая в греческом тексте. Последняя субъектная неоднозначность сглажена минимально ради ясного русского синтаксиса.
