revisions:
- from: Ведь если кто пьёт вино до опьянения, оно нечистыми помыслами приводит твой ум в смятение, разгорячает тело, возбуждая желание разврата, и человек совершает грех, не испытывая стыда.
  to: Ведь если кто пьёт вино до опьянения, оно приводит твой ум в смятение нечистыми помыслами, разгорячает тело для наслаждения и толкает к блуду; тогда грех совершается без стыда¹.
  rationale: 'Перевод уточнён по греческому синтаксису: наслаждение и πορνεία переданы как связанные, но не слитые направления действия. Последний член сформулирован безлично с примечанием, поскольку исходный текст не даёт бесспорного антецедента для активных глаголов. Английский аудитный вариант также сохраняет неуточнённое «it», поэтому его смысловая неопределённость не должна разрешаться в русском без пометы.'
  reviewer_model: gpt-5.6-terra
