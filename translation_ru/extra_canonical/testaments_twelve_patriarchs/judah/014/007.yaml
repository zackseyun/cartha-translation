source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν δὲ παρέλθῃ⁴⁶ τὸν ὅρον, ἐμβάλλει⁴⁸ εἰς⁴⁹ τὸν νοῦν αὐτοῦ⁵⁰ τὸ πνεῦμα τῆς πλάνης, καὶ ποιεῖ τὸν μέθυσον αἰσχρορρημονεῖν⁵¹ καὶ παρανομεῖν καὶ μὴ αἰσχύνεσθαι ἀλλὰ καυχᾶσθαι⁵³ τῇ ἀτιμίᾳ⁵⁴ καὶ νομίζειν εἶναι καλόν⁵⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/007.yaml
  text: But if he goes on until he passes the limit, a spirit of deception enters into his mind and makes the drunkard speak shamefully and act lawlessly and not feel shame, but rather boast in his dishonor and think it good.
translation:
  language: ru
  text: Но если он переступает меру, в его разум проникает дух заблуждения и заставляет пьяного говорить непристойности, поступать беззаконно и не стыдиться, а, напротив, хвалиться своим бесчестием и считать его чем-то хорошим.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέλθῃ τὸν ὅρον
  choice: переступает меру
  rationale: Передаёт буквальный образ перехода установленной границы и естественно звучит по-русски в контексте опьянения.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: дух заблуждения
  rationale: Сохраняет прямое значение πνεῦμα и смысл πλάνη как обмана, ошибки или уклонения, не сужая выражение до одного толкования.
- source_word: αἰσχρορρημονεῖν
  choice: говорить непристойности
  rationale: Глагол обозначает постыдную, непристойную речь; выбран ясный современный оборот.
- source_word: παρανομεῖν
  choice: беззаконничать
  rationale: Передаёт действие вопреки закону или должному порядку, сохраняя нравственно-правовой оттенок греческого слова.
- source_word: καυχᾶσθαι τῇ ἀτιμίᾳ
  choice: хвалиться своим бесчестием
  rationale: Сохраняет резкое противопоставление стыда и похвальбы, а также сильный смысл ἀτιμία — бесчестие, позор.
- source_word: νομίζειν εἶναι καλόν
  choice: считать его чем-то хорошим
  rationale: Местоимение ясно отсылает к бесчестию; καλόν здесь передано этически нейтральным «хорошим», без внесения более узкого эстетического смысла.
theological_decisions:
- issue: Способ действия «духа заблуждения»
  choice: «в его разум проникает дух заблуждения»
  alternative: «[оно] влагает в его разум дух заблуждения»
  rationale: В греческом при ἐμβάλλει формально подразумевается невыраженное подлежащее, вероятно понятное из предыдущего контекста, тогда как «дух заблуждения» стоит как дополнение. Поскольку стих дан отдельно и референт подлежащего не назван, русский вариант избегает необоснованно добавленного субъекта и сохраняет сам образ проникновения духа в разум, следуя также проверенному консультационному слою.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; сохранены нравственная резкость текста, последовательность действий и противопоставление стыда похвальбе. Архаизмы и конфессионально окрашенные пояснения не вводятся.
