    rationale: Оборот «был увлечён к ханаанеянке Бесуе» не является естественным современным русским и недостаточно ясно выражает уклонение/соблазнение. «Сбился с пути, последовав за…» сохраняет пассивно-претерпевательный смысл глагола без добавления доктринальных выводов.
  - severity: low
    issue: «Так же» в ст. 4 чрезмерно уточняет οὕτως
    rationale: οὕτως значит «так», тогда как «так же» подчёркивает идентичность благословения с благословением Авраама. Лучше сохранить менее определённое «так».
  - severity: medium
    issue: «Восстанет царство» в ст. 5 двусмысленно
    rationale: В современном русском «восстанет» обычно воспринимается как мятеж. Для στήσεται безопаснее «произойдёт царство», с примечанием о возможных значениях установления и утверждения.
  - severity: low
    issue: Противительное «но» в ст. 3 не выражено в оригинале
    rationale: ὅτι вводит основание утверждения. Перестройка с «ведь» точнее передаёт связь и сохраняет естественный русский синтаксис.
