base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017.yaml
  text: 'And now I command you, my children: do not love silver, and do not set your gaze on the beauty of women; for I too, because of gold and beauty, was led astray to Besue the Canaanite woman.


    And I know that because of these two things my seed will come to the ruin of sexual immorality. For they will even corrupt wise men from among my sons, and they will cause the kingdom of Judah to be diminished, which the Lord gave me because of my obedience to my father Jacob.'
translation:
  language: ru
  text: '**Завещание Иуды, 17**


    **1** И теперь я заповедую вам, дети мои: не любите серебра и не заглядывайтесь на красоту женщин, потому что и я из-за золота и красоты сбился с пути, последовав за ханаанеянкой Бесуе[a].


    **2** Я знаю, что из-за этих двух вещей мой род придёт к гибели через блуд[b]. Они развратят даже мудрых мужей из числа моих сыновей и приведут царство Иуды в упадок[c] — царство, которое Господь дал мне за послушание моему отцу.


    **3** Я никогда не перечил моему отцу Иакову, ведь исполнял всё, что он мне говорил.


    **4** И Авраам, мой праотец, благословил меня царствовать в Израиле, и Иаков благословил меня так.


    **5** И я знаю, что от меня произойдёт царство[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Бесуе — передача греческой формы имени Βησουέ; точное отождествление имени неясно.
    reason: Редкое имя может быть незнакомо читателю, а его форма и связь с повествованием имеют текстовую неопределённость.
  - marker: b
    text: 'Буквально: «к гибели блуда»; выражение может означать гибель, вызванную блудом, или гибель, состоящую в блудной распущенности.'
    reason: Греческое сочетание ἀπώλειαν πορνείας допускает несколько отношений между существительными, и эту неоднозначность нельзя полностью воспроизвести гладким русским текстом.
  - marker: c
    text: 'Буквально: «сделают царство Иуды меньшим».'
    reason: Основной текст естественно передаёт каузативную конструкцию, а примечание сохраняет её конкретный образ уменьшения.
  - marker: d
    text: 'Или: «от меня будет установлено» или «утвердится царство».'
    reason: Глагол στήσεται может обозначать происхождение, установление или прочное утверждение царства; субъектом глагола в греческом является «царство».
lexical_decisions:
- source_word: ἀργύριον
  choice: серебро
  rationale: Передаёт прямое значение слова и сохраняет параллель с χρυσίον («золото»), не сводя речь обобщённо к деньгам.
- source_word: ἐπιβλέπει εἰς κάλλος γυναικῶν
  choice: заглядывайтесь на красоту женщин
  rationale: Естественная современная формулировка, сохраняющая значение направленного, пристального внимания и нравственно предостерегающий тон.
- source_word: ἐπλανήθην εἰς
  choice: был увлечён к
  rationale: Сохраняет пассивную форму и идею уклонения с верного пути по направлению к названной женщине.
- source_word: τὸ γένος μου
  choice: мой род
  rationale: В контексте потомков Иуды «род» естественнее буквального «семя», при этом охватывает его потомство как общность.
- source_word: εἰς ἀπώλειαν πορνείας
  choice: к гибели через блуд
  rationale: Сохраняет тесную связь гибели с πορνεία, не устраняя неоднозначность греческого родительного падежа и не создавая неестественного русского сочетания «гибель блуда».
- source_word: ἀλλοιώσουσι
  choice: развратят
  rationale: В данном нравственном контексте глагол означает пагубно изменить, испортить; «развратят» ясно передаёт эту мысль и связывает её с предостережением о блуде.
- source_word: σμικρυνθῆναι ποιήσουσιν
  choice: приведут … в упадок
  rationale: Передаёт каузативную конструкцию «сделают уменьшенным» естественным русским выражением, применимым к царству.
- source_word: παρελάλησα
  choice: перечил
  rationale: Передаёт речь вопреки отцу — противоречие или непослушание на словах — и согласуется с последующим утверждением об исполнении всего сказанного.
- source_word: στήσεται τὸ βασίλειον
  choice: восстанет царство
  rationale: Сохраняет образ возникновения и утверждения царства, не уточняя сверх текста, кем именно оно будет установлено.
theological_decisions:
- issue: Основание дарования царства Иуде
  choice: «за послушание моему отцу»
  alternative: «в послушании моему отцу»
  rationale: διά с винительным обычно выражает причину; перевод сохраняет заявленную в тексте связь между послушанием Иуды и данным ему Господом царством, не развивая её в систематическое учение о заслуге.
- issue: Возникновение царства от Иуды
  choice: «от меня восстанет царство»
  alternative: «из меня будет установлено царство»
  rationale: Формулировка сохраняет генеалогическое ἐξ ἐμοῦ и допускает как происхождение царской линии, так и будущее утверждение царства, не вводя в сам текст конкретную мессианскую идентификацию.
- issue: Кто развратит мудрых мужей и ослабит царство
  choice: «Они» с отсылкой к двум ранее названным вещам
  alternative: безличное «даже мудрые мужи… развратятся»
  rationale: Греческие глаголы стоят во множественном числе, а ближайший смысловой антецедент — «эти две вещи», то есть любовь к богатству и женской красоте; перевод сохраняет эту грамматическую связь.
translation_notes:
  register: 'Современный литературный русский язык с торжественным, но доступным завещательным тоном. Сохранены повелительная форма обращения к детям, повторяющиеся связки и краткие утверждения источника. Архаизмы ограничены словами, уместными для жанра и понятными современному читателю: «заповедую», «праотец», «восстанет».'
