  source_fidelity: 'В целом перевод точно передаёт греческий текст и сохраняет его предостерегающий и пророческий характер. Нужны небольшие правки в ст. 1, 3–5: «был увлечён к» неестественно передаёт ἐπλανήθην εἰς, οὕτως означает «так», а не непременно «так же», и «восстанет царство» в современном русском слишком двусмысленно для στήσεται τὸ βασίλειον.'
  naturalness: 'Регистр в целом удачен: современный литературный язык с уместной торжественностью. Более естественны «сбился с пути, последовав за…» и «от меня произойдёт царство».'
  terminology: «Серебро», «золото», «блуд», «Господь», «праотец» и «царство» переданы последовательно и уместно. Имя Бесуе следует сохранить как передачу формы данного греческого текста; примечание необходимо.
  issues:
