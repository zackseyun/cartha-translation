  footnotes:
  - marker: a
    text: В исходном издании после названия «Хозива» стоит редакционный знак ¹; содержание соответствующего аппарата в предоставленном материале не приведено.
    reason: Сохраняет якорь исходного издания, не измышляя текстологическое объяснение.
  - marker: b
    text: Название «Иовил» в исходном издании отмечено знаком † и редакционным знаком ²; содержание соответствующего аппарата в предоставленном материале не приведено.
    reason: Нейтрально передаёт видимую текстологическую маркировку, не предрешая характер трудности чтения.
  - marker: c
    text: После слова «против» в исходном издании стоит редакционный знак ³; содержание соответствующего аппарата в предоставленном материале не приведено.
    reason: Сохраняет третий исходный якорь без неподтверждённых пояснений.
lexical_decisions:
- source_word: ὡς ἤμην
  choice: когда я находился
  rationale: Передаёт временное значение конструкции естественным современным русским языком, не добавляя причинного оттенка.
- source_word: ἐν τοῖς ὕδασι Χωζηβά
  choice: у вод Хозивы
  rationale: Предлог ἐν при обозначении местности здесь естественно передаётся как «у»; топоним Χωζηβά транслитерирован как «Хозива».
- source_word: οἱ ἀπὸ Ἰωβὴλ
  choice: жители Иовила
  rationale: Субстантивированное выражение буквально означает «те, кто из Иовила»; «жители Иовила» звучит естественно и сохраняет географический смысл.
- source_word: ἦλθον ἐφ᾽ ἡμᾶς εἰς πόλεμον
  choice: пришли воевать против нас
  rationale: Ясно передаёт враждебное движение и цель «для войны», избегая тяжеловесного буквального оборота.
