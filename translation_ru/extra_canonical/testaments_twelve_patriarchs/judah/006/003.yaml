  text: But those from Machir attacked us again on the fifth day; and charging at them with a mighty sword[a], we prevailed over them and killed them before they could scale the ascent[b].
translation:
  language: ru
  text: Но на пятый день люди из Махира снова напали на нас; и, бросившись на них с могучим мечом[a], мы одолели их и убили прежде чем они успели подняться по склону[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Глагол προσδίδωσι стоит в 3-м лице единственного числа настоящего времени, что синтаксически необычно в повествовании, ведущемся от 1-го лица множественного числа в аористе. Возможно, перед нами сокращение или искажение текста. Перевод передаёт предполагаемый смысл решительного выступления против неприятеля, не внося исправления в греческий текст.
    reason: textual_variant
  - marker: b
    text: 'Выражение τὴν ἀνάβασιν — однокоренное дополнение при ἀναβῆναι; буквально: «прежде чем взойти восхождение». Оно может обозначать склон, проход или укреплённый подступ, на который противник пытался подняться.'
    reason: lexical_note
lexical_decisions:
- source_word: ἐπῆλθον ἡμῶν
  choice: напали на нас
  rationale: ἐπέρχομαι с обозначением лица в родительном падеже передаёт враждебное наступление; «напали на нас» ясно выражает военный контекст.
- source_word: πάλιν
  choice: снова
  rationale: Наречие указывает на повторное нападение; «снова» естественно в современном русском повествовании.
- source_word: ἐν κραταιᾷ μαχαίρᾳ
  choice: с могучим мечом
  rationale: κραταιός означает «сильный, могучий», а μάχαιρα — «меч»; предлог ἐν здесь передаёт средство действия. Формулировка сохраняет возвышенный воинский образ.
- source_word: περιγινόμεθα αὐτῶν
  choice: мы одолели их
  rationale: περιγίγνομαι с родительным означает взять верх над кем-либо; «одолели их» точно и естественно передаёт результат схватки.
- source_word: ἀναβῆναι τὴν ἀνάβασιν
  choice: взошли на подъём
  rationale: Однокоренная конструкция буквально означает «взойти восхождение» и обозначает достижение или преодоление склона, прохода либо укреплённого подступа. Русская формулировка сохраняет направленность действия без неестественного повтора.
