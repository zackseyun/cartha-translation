  - severity: low
    issue: Сноска a избыточно перечисляет несоотносимые с контекстом словарные глоссы προσδίδωσι.
    rationale: Перечень «прибавляет, присоединяется, отдаётся» может запутать читателя. Для данного места существенны грамматическая аномалия и вероятная смысловая функция оборота, а не полный набор изолированных значений.
