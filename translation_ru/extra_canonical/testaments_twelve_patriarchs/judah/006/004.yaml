  text: And as we came to the city[a], their women were rolling stones down on us from the summit of the mountain on which the city stood.
translation:
  language: ru
  text: Когда же мы подошли к городу[a], их женщины скатывали на нас камни с вершины горы, на которой стоял город.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В источнике стоит τῇ τῇ πόλει — артикль в дательном падеже по ошибке переписчика повторён дважды. Перевод следует чтению с одним артиклем: τῇ πόλει, «к городу».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐκύλιον
  choice: стали скатывать
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие; «стали скатывать» естественно описывает начавшийся при приближении отряда обстрел камнями.
- source_word: λίθους ἐφ’ ἡμᾶς
  choice: скатывать на нас камни
  rationale: λίθους означает «камни», а ἐπί с винительным указывает направленное, в данном контексте враждебное движение; глагол «скатывать» также сохраняет обусловленное рельефом движение сверху вниз.
- source_word: ἀπὸ τῆς κορυφῆς τοῦ ὄρους
  choice: с вершины горы
  rationale: Передаёт как исходную точку движения (ἀπό), так и верхнюю точку горы (κορυφή).
- source_word: ἐν ᾗ ἦν ἡ πόλις
  choice: на которой стоял город
  rationale: Естественная русская передача местного значения относительного оборота; «стоял» уместно выражает расположение города на горе, не добавляя сведений о его укреплённости.
