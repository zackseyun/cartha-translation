  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006/005.yaml
  text: And having hidden Simeon and the others[a] behind them[b], we seized the height, and utterly destroyed this city also.
translation:
  language: ru
  text: Спрятав Симеона и ещё кого-то[a] у них в тылу[b], мы захватили высоту и полностью уничтожили также и этот город.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение τὸν τε καὶ Συμεών синтаксически не вполне ясно. Буквально его можно передать как «того вместе с Симеоном» или «Симеона и ещё кого-то». Слово τὸν формально стоит в единственном числе; оборот τε … καί связывает Симеона с неназванным участником.
    reason: lexical_note
  - marker: b
    text: Редкое греческое наречие ἐξωπίσθεν означает «сзади», «позади» или «с тыла» и указывает на расположение скрытого отряда позади противника.
    reason: cultural_note
lexical_decisions:
- source_word: ὑποκρύψας
  choice: спрятав
  rationale: Аористное причастие обозначает намеренное сокрытие как часть тактического замысла; деепричастие «спрятав» естественно и точно передаёт предшествующее действие.
- source_word: τὸν τε καὶ Συμεὼν
  choice: Симеона и других
  rationale: Корреляция τε ... καί связывает Симеона с ещё одним лицом или группой, прямо не названными; «Симеона и других» сохраняет недосказанность состава отряда и даёт связный русский текст.
- source_word: ἐξωπίσθεν
  choice: у них в тылу
  rationale: Редкое наречие указывает на расположение сзади или действие с тыла. Военный оборот «у них в тылу» ясно передаёт позицию скрытого отряда, не добавляя способа нападения.
- source_word: ἐπελαβόμεθα τοῦ ὑψηλοῦ
  choice: мы захватили высоту
  rationale: ἐπιλαμβάνομαι с родительным означает «завладеть, захватить», а субстантивированное ὑψηλός — «высота, возвышенность». «Захватили высоту» — естественный современный военный оборот.
- source_word: ἐξωλοθρεύσαμεν
  choice: полностью уничтожили
  rationale: Интенсивный глагол означает полное уничтожение; сочетание сохраняет усиление приставки и звучит менее стилистически перегруженно, чем «истребили дотла».
- source_word: καὶ ταύτην τὴν πόλιν
  choice: также и этот город
  rationale: Добавочное καί показывает, что город входит в ряд покорённых городов; «также и» сохраняет накопительный акцент.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного военного рассказа. Синтаксис сохранён компактным; «в тылу» естественно передаёт пространственно-тактическое значение, а примечания отмечают подлинную неясность неназванного спутника или отряда.
