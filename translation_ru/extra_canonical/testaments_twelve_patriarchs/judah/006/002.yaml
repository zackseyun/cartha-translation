  text: And when we joined battle, we routed them; and we killed those from Shiloh, their allies, and gave them no way of escape.
translation:
  language: ru
  text: И, вступив в бой, мы обратили их в бегство; их союзников из Силома мы убили и не дали им возможности прорваться к нам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνάψαντες
  choice: вступив в бой
  rationale: Причастие употреблено в военном контексте и подразумевает начало или завязывание сражения.
- source_word: ἐτρέψαμεν
  choice: обратили их в бегство
  rationale: Глагол в данном военном контексте означает разгромить противника и заставить его отступить.
- source_word: διέξοδον τοῦ εἰσελθεῖν πρὸς ἡμᾶς
  choice: возможности прорваться к нам
  rationale: Перевод сохраняет выраженную в греческом тексте идею прохода или доступа к говорящим; английское «пути к бегству» не следует буквальному синтаксису исходного текста.
- source_word: Σιλὼμ
  choice: Силома
  rationale: Передана форма топонима, непосредственно засвидетельствованная в данном греческом тексте, без замены на нормализованную английскую форму Shiloh.
