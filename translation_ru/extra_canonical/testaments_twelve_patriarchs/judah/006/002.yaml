  terminology: «Обратили их в бегство», «союзники» и «Силом/из Силома» употреблены последовательно и понятно. Форма «из Силома» нормативно оформляет в русском языке топоним, переданный от греческого Σιλώμ. Английская контрольная версия упрощает последний оборот до «no way of escape», но русский перевод обоснованно следует греческому тексту, где говорится о входе/проходе к говорящим.
