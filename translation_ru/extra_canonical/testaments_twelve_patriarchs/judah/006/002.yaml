  source_fidelity: 'Русский текст точно передаёт греческую последовательность: после вступления в бой говорящие обратили противников в бегство, убили их союзников из Силома и не дали им возможности пройти к говорящим. «Прорваться к нам» уместно передаёт военный контекст διέξοδον τοῦ εἰσελθεῖν πρὸς ἡμᾶς, не превращая выражение в «путь к бегству».'
