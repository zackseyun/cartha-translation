  text: '*Καὶ νῦν ἐντέλλομαι ὑμῖν, τέκνα μου, μὴ ἀγαπᾶτε⁵ ἀργύριον⁶ μηδὲ ἐπιβλέπει⁷ *εἰς κάλλος⁸ γυναικῶν, ὅτι κἀγὼ διὰ χρυσίον καὶ εὐμορφίαν¹⁰ ἐπλανήθην εἰς Βησουὲ¹¹ τὴν Χαναναίαν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017/001.yaml
  text: 'And now I command you, my children: do not love silver, nor set your gaze on the beauty of women; for I too, because of gold and beauty, was led astray to Besue the Canaanite woman.'
translation:
  language: ru
  text: 'И теперь я повелеваю вам, дети мои: не любите серебро и не засматривайтесь на красоту женщин, ибо и я из-за золота и красоты был введён в заблуждение и увлечён к Бесуе, хананеянке.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντέλλομαι
  choice: заповедую
  rationale: Передаёт весомое отцовское наставление и повелительный характер глагола, сохраняя достоинство речи.
- source_word: ἀργύριον
  choice: серебро
  rationale: Сохранено прямое значение металла/денег без расширительного толкования как богатства вообще.
- source_word: ἐπιβλέπει εἰς κάλλος
  choice: заглядывайтесь на красоту
  rationale: Естественная современная русская формулировка, передающая направленный и пристрастный взгляд, а не простое зрительное восприятие.
- source_word: ἐπλανήθην
  choice: был увлечён
  rationale: Сохраняет пассивную форму и смысл отклонения с верного пути, не уточняя явно, кем или чем субъект был введён в заблуждение.
- source_word: Βησουὲ τὴν Χαναναίαν
  choice: хананеянке Бесуе
  rationale: Имя передано транслитерацией, а определение — естественным русским обозначением происхождения женщины.
theological_decisions:
- issue: Причина заблуждения Иуды
  choice: из-за золота и красоты
  alternative: золотом и красотой
  rationale: Конструкция διὰ с винительным обозначает причину; перевод не добавляет нравственной или демонологической интерпретации.
- issue: Направленность ἐπλανήθην εἰς Βησουὲ
  choice: был увлечён к хананеянке Бесуе
  alternative: впал в заблуждение из-за хананеянки Бесуи
  rationale: Сохранена необычная направительная конструкция εἰς и не превращена в утверждение, будто сама женщина была непосредственной причиной заблуждения.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Параллелизм «серебра… золота» и «красоту… красоты» сохранён; синтаксис слегка сглажен ради естественности, без устранения смыслового напряжения оригинала.
