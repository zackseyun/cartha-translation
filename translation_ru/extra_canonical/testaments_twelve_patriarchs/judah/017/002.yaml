  to: И я знаю, что из-за этих двух вещей мой род будет обречён на гибель из-за сексуальной распущенности.
  rationale: Заменена менее точная формулировка «придёт к погибели» на «будет обречён на гибель», лучше соответствующую ἔσται εἰς ἀπώλειαν. «Сексуальная распущенность» выбрана как более современный и естественный эквивалент πορνεία. Сноска удалена, поскольку причинная связь является наиболее обоснованным чтением здесь и уже прямо выражена в переводе.
