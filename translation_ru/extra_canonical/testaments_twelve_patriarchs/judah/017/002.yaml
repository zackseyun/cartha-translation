  source_fidelity: 'Смысл передан в целом верно: διὰ τὰ δύο ταῦτα обозначает причину, τὸ γένος μου — род/потомство, а πορνεία относится к недозволенному сексуальному поведению. Однако «придёт к погибели» несколько сглаживает конструкцию ἔσται εἰς ἀπώλειαν, выражающую обречённость на гибель. Родительный πορνείας в данном контексте естественнее передать как причину гибели, в согласии с английским контрольным текстом.'
