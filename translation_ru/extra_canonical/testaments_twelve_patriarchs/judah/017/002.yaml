  text: And I know that because of these two things my offspring will be for destruction because of sexual immorality.
translation:
  language: ru
  text: И я знаю, что из-за этих двух вещей мой род будет обречён на гибель из-за сексуальной распущенности.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶδα
  choice: я знаю
  rationale: Прямо передаёт значение глагола совершенного вида с настоящим значением.
- source_word: διὰ τὰ δύο ταῦτα
  choice: из-за этих двух вещей
  rationale: Сохраняет причинное значение διά с винительным падежом и не уточняет, что именно представляют собой «эти два», поскольку греческий текст этого здесь не называет.
- source_word: τὸ γένος μου
  choice: мой род
  rationale: γένος может обозначать род, племя или потомство; «мой род» естественно по-русски и сохраняет коллективный и родовой оттенок.
- source_word: ἔσται εἰς ἀπώλειαν
  choice: придёт к погибели
  rationale: Естественно передаёт конструкцию εἶναι εἰς со значением направленности к гибели, не ослабляя её до общего несчастья.
- source_word: πορνείας
  choice: половой распущенности
  rationale: Передаёт широкий смысл πορνεία как недозволенного сексуального поведения, не сужая его до одного конкретного проступка.
theological_decisions:
- issue: Связь родительного πορνείας с ἀπώλειαν
  choice: вследствие половой распущенности
  alternative: погибель половой распущенности / погибель, связанная с половой распущенностью
  rationale: Родительный падеж допускает более чем одну смысловую связь. В контексте причинного διὰ наиболее вероятно, что распущенность ведёт род к погибели, однако неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но доступным библейско-завещательным звучанием. Формулировка избегает архаизма «блуд» и чрезмерно специальной лексики; «мой род» поддерживает родовую перспективу речи Иуды.
