  terminology: '«Господь» обязателен: в представленном греческом тексте имеется Κύριος. Это расходится с текущей английской редакцией, где стоит местоимение «he», однако русский вариант обоснованно следует первоисточнику. Термины «царство», «Иуда», «послушание» переданы последовательно и без конфессиональных уточнений.'
