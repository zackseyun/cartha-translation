source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: ὅτι καὶ¹⁶ καίγε σοφοὺς ἄνδρας τῶν υἱῶν μου ἀλλοιώσουσι, καὶ βασιλείαν¹⁷ Ἰούδα σμικρυνθῆναι ποιήσουσιν¹⁸, ἣν ἔδωκέ μοι Κύριος ἐν ὑπακοῇ πατρός μου¹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017/003.yaml
  text: For they will even corrupt wise men from among my sons, and they will cause the kingdom of Judah to be diminished, which he gave me because of my obedience to my father Jacob.
translation:
  language: ru
  text: Ибо они совратят даже мудрых мужей из числа моих сыновей и сделают так, что царство Иуды умалится, — царство, которое Господь дал мне за послушание моему отцу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλοιώσουσι
  choice: совратят
  rationale: Глагол означает «изменят, сделают иными»; применительно к мудрым людям в данном контексте естественно передаёт нравственное и духовное искажение, не уточняя его способ.
- source_word: σμικρυνθῆναι ποιήσουσιν
  choice: сделают так, что … умалится
  rationale: Сохраняет каузативную конструкцию ποιήσουσιν с пассивным инфинитивом и передаёт уменьшение силы или величия царства без лишнего уточнения.
- source_word: ἐν ὑπακοῇ
  choice: за послушание
  rationale: В контексте дара выражение указывает на основание, связанное с послушанием Иуды; по-русски эта причинная связь естественно выражается предлогом «за».
theological_decisions:
- issue: Субъект глагола ἔδωκεν
  choice: Господь дал
  alternative: он дал
  rationale: В предоставленном греческом тексте прямо стоит Κύριος, поэтому именование «Господь» необходимо сохранить, несмотря на расхождение с последней английской редакцией.
- issue: Уточнение имени отца
  choice: моему отцу
  alternative: моему отцу Иакову
  rationale: Имени «Иаков» в греческом тексте нет; оно не добавлено, чтобы перевод оставался источниковым.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Повтор слова «царство» устраняет возможную неясность связи относительного местоимения и сохраняет смысл греческой конструкции.
