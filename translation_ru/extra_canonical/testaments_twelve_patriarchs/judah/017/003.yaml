  source_fidelity: 'Перевод точно передаёт ключевые элементы греческого текста: ἀλλοιώσουσι как нравственное/духовное совращение мудрых мужей, каузативное «сделают так, что ... умалится», а также явное Κύριος как «Господь». Относительное «которое» однозначно отнесено к царству. «За послушание моему отцу» приемлемо передаёт ἐν ὑπακοῇ πατρός μου, не добавляя имени Иакова, отсутствующего в греческом тексте.'
