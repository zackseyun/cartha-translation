lexical_decisions:
- source_word: ἀναστήσεται / ἀναστήσονται
  choice: воскреснут
  rationale: В эсхатологическом контексте глагол означает восстание умерших к жизни; современное «воскреснут» передаёт это естественно и точно.
- source_word: ἔξαρχοι
  choice: вождями
  rationale: Слово обозначает предводителей или глав; добавление «колен» отсутствует в данном греческом тексте.
- source_word: ὁ ἄγγελος τοῦ προσώπου
  choice: ангел присутствия
  rationale: Буквальное «ангел лица» неестественно по-русски; «присутствия» сохраняет библейский смысл выражения, не отождествляя ангела с Богом.
- source_word: αἱ δυνάμεις τῆς δόξης
  choice: силы славы
  rationale: Сохранена необычная образность и возможный смысл небесных сил без конфессионального уточнения.
- source_word: πνεῦμα πλάνης τοῦ Βελιάρ
  choice: дух заблуждения Велиара
  rationale: πλάνη здесь означает заблуждение, обман или совращение; родительная связь с Велиаром сохранена без попытки её догматически уточнить.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Греческий текст говорит о вечном низвержении, но не упоминает огонь; слово «огонь» из английского консультационного текста не внесено.
- source_word: οἱ ἔλαφοι Ἰακώβ
  choice: олени Иакова
  rationale: Переведено по представленному греческому тексту; чтение «Иосифа» в английском слое не принято.
- source_word: ἐν ἀγαλλιάσει / ἐν χαρᾷ
  choice: ликуя / в радости
  rationale: Различие близких греческих выражений передано естественно и без ненужного однообразия.
theological_decisions:
- issue: Кто воскресает и к чему
  choice: «Авраам, Исаак и Иаков воскреснут к жизни»
  alternative: «восстанут для жизни»
  rationale: Выбран ясный современный язык, при этом сохранено прямое утверждение о возвращении к жизни.
- issue: Суд над духом Велиара
  choice: «будет низвергнут навеки»
  alternative: «будет брошен в огонь навеки»
  rationale: В представленном греческом тексте есть ἐμβληθήσεται εἰς τὸν αἰῶνα, но нет слова «огонь»; богословски значимая деталь не добавлена из английского слоя.
- issue: Состояние воскресших после скорбной смерти
  choice: «умершие в скорби воскреснут»
  alternative: «воскреснут в радости»
  rationale: Слова «в радости» отсутствуют в представленном греческом тексте, поэтому не добавлены.
- issue: Сомнительная строка о нечестивых и грешниках
  choice: сохранена в квадратных скобках с примечанием
  alternative: опустить строку, как в английском POB
  rationale: Строка присутствует в греческом источнике, но уже отмечена редакционными скобками; её сохранение честно отражает и содержание, и текстологическую неуверенность.
