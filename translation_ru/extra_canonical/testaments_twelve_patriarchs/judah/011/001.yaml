  text: And I knew that the race of the Canaanites was evil, but the impulse of youth blinded my understanding.
translation:
  language: ru
  text: И я знал, что род хананеев был порочен, но юношеский порыв ослепил мой разум.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρόν
  choice: порочен
  rationale: Передаёт нравственную оценку «злой, дурной, порочный» естественным литературным русским языком, не усиливая её до утверждения о безусловной сущностной испорченности.
- source_word: γένος
  choice: род
  rationale: В данном этническом контексте означает народ или племенной род; «род хананеев» сохраняет форму и тон исходного выражения.
- source_word: τὸ διαβούλιον τῆς νεότητος
  choice: юношеская опрометчивость
  rationale: Редкое διαβούλιον связано с намерением, замыслом или внутренним побуждением; в контексте юности выражение обозначает неосмотрительный юношеский порыв. Выбор даёт естественный русский смысл, не превращая его в устойчивый богословский термин.
- source_word: ἐτύφλωσε τὴν διάνοιάν μου
  choice: ослепила мой разум
  rationale: Сохраняет метафору духовно-нравственной слепоты и передаёт διάνοια как способность понимать и рассуждать.
theological_decisions:
- issue: Коллективная нравственная характеристика хананеев
  choice: «род хананеев был порочен»
  alternative: «хананеи были злым народом»
  rationale: Сохранена общая оценка источника, однако не добавлено утверждение о врождённой или расовой природе зла; «род» здесь понимается как этническая общность.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксический параллелизм греческого предложения сохранён; архаизмы и конфессионально маркированная лексика не использованы.
