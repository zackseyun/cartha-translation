lexical_decisions:
- source_word: Ἐπιγνοὺς
  choice: Узнав
  rationale: Аористное причастие передаёт наступившее осознание совершённого поступка; «узнав» естественно и точно выражает эту последовательность.
- source_word: κατηρασάμην
  choice: я проклял
  rationale: Прямое соответствие глаголу со значением произнесения проклятия; возвратная форма греческого аориста не требует отдельного выражения в русском.
- source_word: ἐν ὀδύνῃ ψυχῆς μου
  choice: в душевной муке
  rationale: Сохраняет силу ὀδύνη как глубокой боли и естественно передаёт греческий генитив «моей души» современным литературным русским языком.
