    rationale: Греческое ἔλαβον αὐτήν буквально означает «я взял её»; брачный смысл может следовать из более широкого контекста, но не выражен в этой фразе. Для оптимально-эквивалентного перевода его не следует вносить в основной текст.
  - severity: medium
    issue: «Без совета моего отца» неточно передаёт генитивный абсолют.
    rationale: μὴ βουλευσαμένου τοῦ πατρός μου называет отца субъектом βουλεύομαι («советоваться, обдумывать, принимать решение»), тогда как русская конструкция обычно обозначает отсутствие совета, данного отцом говорящему.
  - severity: low
    issue: Сноска чрезмерно конкретизирует текстологическую помету и неточно формулирует буквальный смысл.
    rationale: В предоставленном тексте редакционные знаки стоят перед ἔλαβον αὐτήν, но без аппарата нельзя уверенно описывать их как сомнение именно в данном чтении. Формула «отец не дал совета» также меняет смысл βουλεύομαι.
