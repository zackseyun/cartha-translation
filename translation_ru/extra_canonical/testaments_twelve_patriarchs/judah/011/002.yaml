  text: And when I saw her pouring wine, I was deceived, and I took her, my father not having taken counsel.
translation:
  language: ru
  text: И, увидев, как она разливает вино, я был обманут и взял её, когда мой отец ещё не принял решения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «пока мой отец не посовещался». В греческом тексте стоит оборот, буквально означающий: «когда мой отец не посовещался / не принял решения».'
    reason: Передаёт субъект действия в греческом генитивном абсолюте и сохраняет возможные значения βουλεύομαι, не делая неподтверждённых утверждений о характере редакционных знаков.
lexical_decisions:
- source_word: οἰνοχοοῦσαν
  choice: разливает вино
  rationale: Причастие означает, что она наливала или подавала вино; «разливает вино» естественно передаёт действие по-русски.
- source_word: ἠπατήθην
  choice: я был обманут
  rationale: Сохранены страдательный залог и прямое значение глагола, без уточнения не названного в тексте обманщика.
- source_word: ἔλαβον αὐτήν
  choice: взял её в жёны
  rationale: В данном брачном контексте «взять женщину» означает взять её в жёны; дополнение устраняет в русском нежелательное впечатление физического захвата.
- source_word: μὴ βουλευσαμένου τοῦ πατρός μου
  choice: без совета моего отца
  rationale: Передаёт обстоятельственный родительный оборот и сохраняет роль отца как того, чьего совета или решения не было, не перенося действие грамматически на Иуду.
