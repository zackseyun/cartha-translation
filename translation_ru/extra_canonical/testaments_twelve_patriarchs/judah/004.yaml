  text: IV. *Καὶ μετὰ τοῦτο γέγονεν ἡμῖν κατὰ νότον¹ πόλεμος² *τοῦ ἐν Σικίμοις³· καὶ παραταξάμενοι *σὺν τοῖς ἀδελφοῖς⁴ μου ἐδιώξαμεν⁵ χιλίους⁶ καὶ ἀπεκτείναμεν⁷ ἐξ αὐτῶν διακοσίους⁸ *καὶ τέσσαρας βασιλεῖς⁹. 2. Καὶ ἀνῆλθον ἐγὼ¹⁰ ἐπὶ *τοῦ τείχους¹¹, καὶ¹² *ἀνεῖλον †τὸν βασιλέα αὐτῶν¹³, καὶ ἐλάβομεν *πᾶσαν τὴν αἰχμαλωσίαν¹⁴. 3. *Καὶ τῇ ἑξῆς ἀπήλθομεν¹⁵ εἰς Ἀρετὰν¹⁶, πόλιν κραταιάν¹⁷, *ἀπειλοῦσαν ἡμῖν θάνατον¹⁸· *Ἐγὼ δὲ καὶ ὁ Γὰδ¹⁹ προσέφθημεν *ἀπὸ ἀνατολῶν τῆς πόλεως²⁰· *Ῥουβὴμ δὲ²¹ καὶ²² Λευὶ²³ ἀπὸ δυσμῶν²⁴, καὶ οὕτως ἠλευθερώσαμεν²⁵ τὴν αἰχμαλωσίαν²⁶.
