  source_fidelity: 'Черновик верно следует предоставленному греческому тексту из трёх стихов, а не расходящемуся английскому аудиторскому слою. Однако προσέφθημεν нельзя без достаточных оснований передавать как «первыми подошли»: в военном контексте естественнее и точнее «напали/атаковали». В 1-м стихе следует также недвусмысленно показать, что четырёх царей убили наряду с двумястами людьми, а не включать их в число двухсот.'
  naturalness: После устранения двусмысленности в перечне убитых и замены «первыми подошли» на естественное военное «напали» текст звучит современно и литературно. «Сильный город» уместнее, чем «могучий город» в данном повествовательном контексте.
