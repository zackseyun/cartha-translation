  text: '1. And after this there came to us a greater war toward the south than the one at Shechem; and when I had drawn up in battle with my brothers, we pursued a thousand men and killed two hundred of them, and four kings.

    2. And I went up upon the wall and killed their king.

    3. And so we set Hebron free and took all the captives.

    4. But the rest fled.

    5. Then my father Jacob killed Belisath, king of all the kings, a man giant in strength, twelve cubits high.

    6. And terror fell upon them, and they stopped making war against us.

    7. Therefore my father was without anxiety in the wars while I was with my brothers.

    8. For he saw in a vision concerning me that an angel of power went along with me in all things, so that no one might touch me.'
translation:
  language: ru
  text: '1. После этого у нас на юге случилась война — [более тяжёлая], чем та, что была в Сихеме[a]. Выстроившись в боевой порядок вместе с моими братьями, мы преследовали тысячу человек и убили из них двести человек, а также четырёх царей.


    2. Я взошёл на стену и убил их царя[b], а мы захватили всех пленных.


    3. На следующий день мы пошли к Аретe[c], сильному городу, грозившему нам смертью. Я и Гад напали на город с востока, а Рувим и Левий — с запада; так мы освободили пленных.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст здесь не вполне ясен: буквально — «случилась у нас на юге война той, что в Сихеме». Слова «более тяжёлая» подразумеваются сравнительной конструкцией и добавлены для связности.'
    reason: Необходимо обозначить отсутствующее в явном виде сравнительное прилагательное и сохранить текстовую неоднозначность.
  - marker: b
    text: Чтение «их царя» в греческом источнике отмечено как сомнительное.
    reason: В издании соответствующие слова помечены знаком текстологической неуверенности.
  - marker: c
    text: Арета — название города в данном греческом тексте; его отождествление неясно.
    reason: Предотвращает необоснованную замену топонима на Хеврон вслед за отличающимся английским слоем.
lexical_decisions:
- source_word: κατὰ νότον
  choice: на юге
  rationale: Передаёт пространственное значение выражения естественным современным русским языком.
- source_word: παραταξάμενοι
  choice: выстроившись в боевой порядок
  rationale: Сохраняет военное значение глагола, а не сводит его к общему «сражаясь».
- source_word: πᾶσαν τὴν αἰχμαλωσίαν
  choice: всех пленников
  rationale: В данном повествовательном контексте αἰχμαλωσία обозначает совокупность захваченных людей; такое понимание согласуется с последующим освобождением пленников.
- source_word: προσέφθημεν
  choice: первыми подошли
  rationale: Передаёт значение опережения/прибытия прежде других и при этом естественно сочетается с указанием направления.
- source_word: ἠλευθερώσαμεν τὴν αἰχμαλωσίαν
  choice: освободили пленников
  rationale: Ясно передаёт освобождение находившихся в плену людей.
theological_decisions:
- issue: Сопоставление войны на юге с войной в Сихеме
  choice: '[более тяжёлая], чем в Сихеме'
  alternative: война на юге, связанная с происшедшим в Сихеме
  rationale: Греческий текст содержит родительный оборот τοῦ ἐν Σικίμοις, который в традиции понимается сравнительно, но явное сравнительное прилагательное в предоставленном греческом тексте отсутствует. Вставка отмечена квадратными скобками и пояснена сноской, чтобы не скрывать текстовую трудность.
- issue: Объект, захваченный во 2-м стихе
  choice: всех пленников
  alternative: всю добычу
  rationale: αἰχμαλωσία допускает связь как с пленом, так и с захваченным, однако стих 3 прямо говорит об освобождении τὴν αἰχμαλωσίαν, поэтому личное значение наиболее связно и не требует догматического уточнения.
