base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/005.yaml
  text: And when I threatened him, he went in to her, but he wasted the seed on the ground, according to the command of his mother. So he too died in wickedness. And I wanted to give Shelah also to her, but his mother did not allow it; for she acted wickedly, because she was not from the daughters of Canaan, as she herself was.
translation:
  language: ru
  text: '5 Когда я пригрозил ему, он вошёл к ней, но погубил семя на земле, как велела ему мать. И он тоже умер в нечестии.


    6 Я хотел отдать ей и Шелу, но его мать не позволила, потому что поступила нечестиво: та, в отличие от неё самой, не принадлежала к дочерям Ханаана.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνῆλθε αὐτῇ
  choice: он вошёл к ней
  rationale: Естественный для библейского повествования эвфемизм, передающий половое сближение без излишней эксплицитности.
- source_word: διέφθειρε δὲ τὸ σπέρμα ἐπὶ τῆν γῆν
  choice: но погубил семя на земле
  rationale: Сохраняет прямой объект «семя» и значение уничтожения или растраты в глаголе διαφθείρω, не подменяя его более узкой физиологической формулировкой.
- source_word: ἐν πονηρίᾳ
  choice: в нечестии
  rationale: Передаёт нравственно-религиозный оттенок πονηρία и звучит естественно в современном литературном русском.
- source_word: ἐπονηρεύσατο
  choice: поступила нечестиво
  rationale: Передаёт нравственную оценку действия, сохраняя связь с однокоренным πονηρία в предыдущем предложении.
- source_word: ἐκ τῶν θυγατέρων τῶν Χαναναίων
  choice: принадлежала к дочерям Ханаана
  rationale: Сохраняет традиционную семитскую формулу греческого текста и её этнический смысл.
theological_decisions:
- issue: Причина смерти Онана
  choice: «умер в нечестии» без уточнения непосредственного божественного действия
  alternative: «Бог умертвил его за нечестие»
  rationale: Греческий текст здесь сообщает о смерти в нечестии, но прямо не называет действующего лица; перевод не импортирует уточнение из параллельного повествования Бытия.
- issue: Соотнесение женских местоимений в заключительной фразе
  choice: «та, в отличие от неё самой»
  alternative: прямо назвать первую женщину Фамарью, а вторую — матерью Шелы
  rationale: Контекстуальные референты различены настолько, насколько это необходимо русской грамматике, однако имена, отсутствующие в данной греческой фразе, не добавлены.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Сохранена повествовательная прямота оригинала; сексуальная формула передана традиционным эвфемизмом, а этническая формула «дочери Ханаана» оставлена без модернизирующего пересказа.
