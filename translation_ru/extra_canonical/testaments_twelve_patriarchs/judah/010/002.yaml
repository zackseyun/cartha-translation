  text: Ἦν δὲ ὁ Ἦρ⁵ πονηρός, καὶ ἐθανάτωσεν αὐτὸν ἄγγελος Κυρίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/002.yaml
  text: But Er was wicked, and an angel of the Lord killed him.
translation:
  language: ru
  text: Но Ир был нечестив, и ангел Господа умертвил его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρός
  choice: нечестив
  rationale: В данном нравственно-религиозном контексте передаёт не просто дурной характер, а виновную порочность перед Богом.
- source_word: ἐθανάτωσεν
  choice: умертвил
  rationale: Точно передаёт каузативное значение «предал смерти, умертвил», сохраняя прямоту греческого выражения без разговорного оттенка слова «убил».
- source_word: ἄγγελος Κυρίου
  choice: ангел Господа
  rationale: Формально и естественно передаёт греческую конструкцию без добавления определённости, которой в тексте нет.
theological_decisions:
- issue: Исполнитель смерти Ира
  choice: ангел Господа умертвил его
  alternative: Господь умертвил его через ангела
  rationale: Сохранён явно названный в греческом тексте деятель — ангел Господа; причинная роль самого Господа не добавляется сверх исходной формулировки.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Имя Ἦρ передано традиционной русской библейской формой «Ир».
