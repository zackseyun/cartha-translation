base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/001.yaml
  text: After these things, Er my son took Tamar for himself as a wife, from Mesopotamia, a daughter of Aram.
translation:
  language: ru
  text: После этого мой сын Ир взял себе в жёны Фамарь, дочь Арама, из Месопотамии.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: После этого
  rationale: Естественно передаёт последовательность событий без избыточно буквального «после этих вещей».
- source_word: Ἦρ
  choice: Ир
  rationale: Использована традиционная русская библейская форма имени.
- source_word: ἄγεται … ἑαυτῷ εἰς γυναῖκα
  choice: взял себе в жёны
  rationale: Передаёт брачную формулу современным, понятным и достойным русским выражением; историческое настоящее по-гречески передано русским прошедшим временем.
- source_word: Θαμὰρ
  choice: Фамарь
  rationale: Использована традиционная русская библейская форма имени.
- source_word: θυγατέρα Ἀρὰμ
  choice: дочь Арама
  rationale: Сохранено прямое значение греческого текста без переосмысления Арама как области или этнонима.
- source_word: ἐκ Μεσοποταμίας
  choice: из Месопотамии
  rationale: Оборот отнесён к Фамари в соответствии с ближайшим смыслом конструкции; постановка в конце сохраняет связь со всем её описанием.
