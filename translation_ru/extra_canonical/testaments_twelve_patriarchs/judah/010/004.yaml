  source_fidelity: 'Смысл участников левиратного брака передан верно: Иуда отдаёт женщину Онану. «Во время брачных дней» допустимо как естественная передача выражения «в дни брачного чертога». Эвфемизм «не познал её» точно сохраняет лексику источника. Однако «по злобе» сужает ἐν πονηρίᾳ до личной злости; греческое слово шире и прежде всего характеризует порочность/злонамеренное нечестие.'
