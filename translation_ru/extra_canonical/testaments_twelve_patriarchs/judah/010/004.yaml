base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/004.yaml
  text: During the days of the bridal chamber I gave her to Onan in levirate marriage; yet he too, in wickedness, did not know her, though he was with her for a year.
translation:
  language: ru
  text: Во время брачных дней я отдал её Онану в левиратный брак; но и он по своей порочности не познал её, хотя прожил с ней год.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τοῦ θαλάμου
  choice: во время брачных дней
  rationale: Выражение буквально связано с «чертогом/брачной комнатой», но обозначает период свадебного торжества или брака; выбран естественный русский эквивалент без излишнего уточнения.
- source_word: ἐπεγυμβρευσα αὐτῇ τὸν Αὐνάν
  choice: я отдал её Онану в левиратный брак
  rationale: Редкий глагол передаёт устройство брака с деверем ради продолжения рода умершего брата. Формулировка следует смыслу контекста и исправленному порядку участников в консультационном английском тексте.
- source_word: οὐκ ἔγνω αὐτήν
  choice: не познал её
  rationale: Сохранён библейский эвфемизм для половой близости, понятный в данном контексте и не устраняющий стилистическую связь с традицией.
- source_word: ἐν πονηρίᾳ
  choice: по злобе
  rationale: Передаёт нравственно отрицательный и намеренный характер поведения; греческое πονηρία допускает значения зла, порочности или злого умысла.
- source_word: ποιήσας σὺν αὐτῇ ἐνιαυτόν
  choice: хотя прожил с ней год
  rationale: Идиоматически передаёт буквальное «проведя/сделав с ней год» как совместную жизнь на протяжении года.
theological_decisions:
- issue: Смысл «не познал её»
  choice: Сохранить эвфемизм без пояснения в основном тексте
  alternative: 'Перевести прямо: «не вступал с ней в близость»'
  rationale: Источник использует традиционный библейский эвфемизм; его сохранение удерживает литературную и богословскую окраску, не навязывая дополнительных толкований.
- issue: Характер левиратного действия
  choice: Явно назвать левиратный брак
  alternative: «Я женил на ней Онана» или «отдал её Онану»
  rationale: Глагол обозначает именно обязанность деверя, а явное обозначение предотвращает утрату важного родового и правового смысла.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сделан ясным для обычного читателя; архаизм «познал» сохранён как узнаваемый библейский эвфемизм. Маркеры сносок не требуются, поскольку сноски не добавлены.
