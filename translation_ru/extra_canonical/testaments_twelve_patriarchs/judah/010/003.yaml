  text: Καὶ¹⁴ αὐτὸς οὐκ ἔγνω αὐτὴν¹⁵ κατὰ πανουργίαν τῆς μητρὸς αὐτοῦ¹⁵, οὐ γὰρ ἤθελεν ἔχειν τέκνα ἐξ¹⁷ αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/003.yaml
  text: And he did not know her, by the scheming of his mother, for he did not want to have children by her.
translation:
  language: ru
  text: И он не познал её — по коварному замыслу своей матери, потому что не хотел иметь от неё детей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνω αὐτήν
  choice: не познал её
  rationale: Сохранён библейский эвфемизм со значением половой близости; он естественен для данного литературно-религиозного контекста и формально соответствует греческому.
- source_word: κατὰ πανουργίαν
  choice: по коварному замыслу
  rationale: πανουργία здесь обозначает хитрость или коварство; добавление «замыслу» делает причинно-направляющий смысл оборота с κατά ясным по-русски, не устраняя отрицательной оценки.
- source_word: τῆς μητρὸς αὐτοῦ
  choice: своей матери
  rationale: Русское возвратное притяжательное местоимение недвусмысленно относит мать к подлежащему и звучит естественнее буквального «его матери».
- source_word: ἔχειν τέκνα ἐξ αὐτῆς
  choice: иметь от неё детей
  rationale: Обычный современный русский оборот точно передаёт желание не иметь потомства от этой женщины.
theological_decisions:
- issue: Характер участия матери в отказе мужчины вступить в близость
  choice: по коварному замыслу своей матери
  alternative: из-за коварства своей матери
  rationale: 'Выбранная формулировка сохраняет некоторую неоднозначность κατά: поступок мог совершаться под влиянием, по наущению или в соответствии с замыслом матери; текст не уточняет механизм.'
translation_notes:
  register: Современный литературный русский с достоинством древнего религиозного повествования. Эвфемизм «познал её» намеренно сохранён; тире помогает естественно присоединить обстоятельство, не меняя синтаксической связи.
