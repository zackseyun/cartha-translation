  naturalness: Русский текст в целом современный и литературный. «Всё это» делает синтаксическую связь ст. 3–5 более ясной и естественной, не устраняя древний нравственно-наставительный регистр.
  terminology: «Распутство», «любовь к деньгам», «Закон Божий», «милость», «благочестие» и «страсти» приемлемы. «Жертвы Богу» чуть прямее воспроизводит θυσίας Θεοῦ, чем «жертвоприношения Богу», при сохранении культового смысла.
