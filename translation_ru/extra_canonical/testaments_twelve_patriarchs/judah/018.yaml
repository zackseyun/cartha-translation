  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018.yaml
  text: '1. The Lord gave me favor because I obeyed my father. 2. Therefore I never grieved Jacob my father, for I did everything he told me. 3. And Abraham my forefather blessed me to reign in Israel, and Jacob blessed me in the same way. 4. And I know what evils you will do in the last days.


    5. Guard yourselves, therefore, my children, from sexual immorality and from the love of money, and listen to Judah your father. 6. For these turn one away from the law of God, and blind the purpose of the soul, and teach arrogance, and do not allow a man to show mercy to his neighbor. 7. They deprive his soul of every goodness, and hold him fast in pains and labors; they drive sleep away from him, and consume his flesh. 8. They hinder the sacrifices of God, and he does not remember the blessing of God. He does not listen when a prophet speaks, and he resents words of godliness. 9. For he is enslaved to two contrary passions, and is not able to obey God, because they have blinded his soul.'
translation:
  language: ru
  text: '1. И я знаю, какие злые дела вы совершите в последние дни[a].


    2. Поэтому берегитесь, дети мои, распутства и любви к деньгам и послушайте Иуду, вашего отца. 3. Ведь всё это уводит от Закона Божьего, ослепляет рассудок души, приучает к высокомерию и не даёт человеку проявлять милость к ближнему. 4. Всё это лишает его душу всякой доброты, держит его в тяготах и изнурительном труде, прогоняет от него сон и истощает его тело. 5. Всё это препятствует жертвам Богу и не помнит о Божьем благословении; не слушает пророка, когда тот говорит, и негодует на слова благочестия. 6. Ведь он служит двум противоположным страстям и не может повиноваться Богу, потому что ослепил свою душу и среди дня ходит словно ночью.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «в последние дни» в греческом издании отмечены как текстуально неустойчивые.
    reason: В предоставленном основном тексте выражение заключено в редакционные квадратные скобки; примечание обозначает текстологическую неуверенность, не исключая слова из перевода.
lexical_decisions:
- source_word: πορνεία
  choice: распутство
  rationale: Передаёт широкий смысл половой безнравственности, не сужая его до одного конкретного проступка.
- source_word: φιλαργυρία
  choice: любовь к деньгам
  rationale: Прямое и понятное современному читателю обозначение страсти к накоплению денег.
- source_word: τὸ διαβούλιον τῆς ψυχῆς
  choice: рассудок души
  rationale: Сохраняет антропологический образ оригинала; διαβούλιον обозначает способность обдумывать и принимать решения.
- source_word: ὑπερηφανίαν ἐκδιδάσκει
  choice: приучают к высокомерию
  rationale: Естественно передаёт буквальное «обучают высокомерию» без ослабления нравственного смысла.
- source_word: προσοχθίζει
  choice: негодует на
  rationale: Глагол выражает раздражение, досаду или неприязненную реакцию, а не просто интеллектуальное несогласие.
- source_word: πάθεσιν
  choice: страстям
  rationale: В данном нравственном контексте это устойчивое и точное обозначение властвующих над человеком порочных влечений.
- source_word: ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται
  choice: среди дня ходит словно ночью
  rationale: Сохранён яркий заключительный образ духовной слепоты, присутствующий в греческом источнике.
theological_decisions:
- issue: Связь двух пороков с последующими грамматическими формами единственного числа
  choice: Сначала пороки представлены во множественном числе, затем речь продолжена о человеке, который им служит
  alternative: Считать подлежащим на всём протяжении только любовь к деньгам или персонифицированный порок
  rationale: Греческий текст допускает резкий переход от названных пороков к порабощённому ими человеку; перевод сохраняет смысловую напряжённость и не приписывает все последствия лишь одному пороку.
- issue: Кто ослепил душу в стихе 6
  choice: «потому что ослепил свою душу»
  alternative: «потому что они ослепили его душу»
  rationale: Форма ἐτύφλωσε — третье лицо единственного числа; ближайший явный субъект — порабощённый человек. Перевод следует основной греческой форме, не вводя множественного субъекта из контекста.
- issue: «Жертвоприношения Богу» в стихе 5
  choice: Сохранить культовое выражение без конфессионального истолкования
  alternative: Обобщить как «служение Богу» или «дары Богу»
  rationale: Θυσίας Θεοῦ прямо означает жертвы/жертвоприношения Богу; более широкая передача устранила бы конкретику источника.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксис сделан ясным для обычного читателя, но сохранены характерные образы души, рабства страстям и хождения днём словно ночью. Переведён только предоставленный греческий текст главы XVIII; дополнительные четыре стиха из английского консультационного слоя не включены, поскольку в данном оригинально-языковом источнике их нет.
