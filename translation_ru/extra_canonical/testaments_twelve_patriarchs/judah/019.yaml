  text: My children[b][a], the love of money leads to idolatry.
translation:
  language: ru
  text: '19


    1 Дети мои, любовь к деньгам ведёт к идолопоклонству[a], потому что, обольстившись деньгами, люди называют богами тех, кто не является богами. Она доводит того, кто ею одержим, до исступления[b].


    2 Из-за денег я, дети мои, лишился своих детей. И если бы мне не помогли моё покаяние, моё смирение и молитвы моего отца, я умер бы бездетным.


    3 Но Бог моих отцов помиловал меня, потому что я сделал это по неведению.


    4 Ведь правитель заблуждения ослепил меня, и я был в неведении как человек, как плоть, растлённая грехами; и я познал собственную слабость, считая себя непобедимым.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст говорит, что любовь к деньгам ведёт к идолопоклонству, а не прямо отождествляет её с ним.
    reason: theological_ambiguity
  - marker: b
    text: Греч. ἔκστασις здесь может означать исступление, помрачение рассудка или состояние, в котором человек оказывается «вне себя».
    reason: lexical_alternative
lexical_decisions:
- source_word: Τέκνα μου
  choice: Дети мои
  rationale: Сохраняет прямое семейное обращение патриарха и не сужает его до сыновей, чего греческое τέκνα само по себе не требует.
- source_word: ἡ φιλαργυρία
  choice: любовь к деньгам
  rationale: Передаёт конкретное значение любви к серебру или деньгам яснее для современного читателя, чем более широкие слова «алчность» или «корыстолюбие».
- source_word: πρὸς εἰδωλολατρίαν ὁδηγεῖ
  choice: ведёт к идолопоклонству
  rationale: ὁδηγεῖ прямо выражает движение или приведение к чему-либо; перевод сохраняет направленность πρὸς и не отождествляет любовь к деньгам с идолопоклонством.
- source_word: ἐν πλάνῃ ἀργυρίου
  choice: обольстившись деньгами
  rationale: Естественно передаёт заблуждение или обман, вызванный деньгами, и сохраняет причинную связь контекста.
- source_word: εἰς ἔκστασιν ἐμπεσεῖν
  choice: до исступления
  rationale: В данном нравоучительном контексте ἔκστασις обозначает выход из нормального состояния, помрачение или исступление, а не положительный религиозный экстаз.
- source_word: συνεδράμον
  choice: помогли
  rationale: Глагол буквально выражает совместное содействие; «помогли» естественно соединяет покаяние, смирение и молитвы как способствовавшие спасению Иуды.
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: правитель заблуждения
  rationale: Формально сохраняет титул ἄρχων и родительный оборот, не уточняя личность этого правителя сверх исходного текста.
- source_word: ἐπέγνων τὴν ἐμαυτοῦ ἀσθένειαν
  choice: я познал собственную слабость
  rationale: Сохраняет усиленный оттенок осознания в ἐπέγνων и личную направленность ἐμαυτοῦ.
- source_word: ἀκαταμάχητος
  choice: непобедимым
  rationale: Передаёт представление о том, кому невозможно противостоять или кого невозможно одолеть, естественным русским словом.
theological_decisions:
- issue: Связь любви к деньгам с идолопоклонством
  choice: «любовь к деньгам ведёт к идолопоклонству»
  alternative: «любовь к деньгам есть идолопоклонство»
  rationale: Греческий текст выражает направленное движение посредством πρὸς и ὁδηγεῖ, а не прямое тождество; перевод не усиливает утверждение сверх источника.
- issue: Личность «правителя заблуждения»
  choice: Сохранить описательный титул без отождествления
  alternative: «дьявол» или «сатана»
  rationale: Хотя выражение может подразумевать враждебную духовную силу, исходный текст её прямо не называет; сохранена намеренная недосказанность.
- issue: Причина помилования
  choice: «потому что я сделал это по неведению»
  alternative: «хотя я сделал это по неведению»
  rationale: ὅτι обычно вводит причину; перевод сохраняет прямую причинную формулировку текста, не разъясняя её богословские пределы.
- issue: Человеческая и плотская слабость
  choice: «как человек, как плоть, растлённая грехами»
  alternative: Объединить в обобщение «по человеческой греховной слабости»
  rationale: Раздельные сравнения ὡς ἄνθρωπος и ὡς σάρξ сохранены, чтобы не сгладить антропологическое напряжение исходника.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным завещательно-нравоучительным тоном. Синтаксис сделан ясным для обычного читателя, при этом сохранены повтор обращения «дети мои», образ «плоти» и неуточнённый титул «правитель заблуждения».
