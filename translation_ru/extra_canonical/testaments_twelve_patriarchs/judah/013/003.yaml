base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/003.yaml
  text: and I reproached Reuben my brother concerning Bilhah, my father’s wife, and the spirit of jealousy and sexual immorality arrayed themselves against me, until I completed it with Anan the Canaanite woman and with Tamar my daughter-in-law.
translation:
  language: ru
  text: И я укорял своего брата Рувима за Валлу, жену моего отца, а дух ревности и блуда ополчился против меня, пока я не довёл дело до конца с хананеянкой[a] и с Фамарью, моей невесткой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте перед словом «хананеянкой» отмечено повреждённое место. Возможно, здесь первоначально стояло имя женщины, но оно не восстанавливается с уверенностью.
    reason: Крест в издании указывает на текстуальную неисправность; примечание сохраняет неопределённость, не вводит неподтверждённое имя и не предлагает неудачную буквальную кальку предлога εἰς.
lexical_decisions:
- source_word: ὠνείδιζον
  choice: укорял
  rationale: Передаёт продолженное или повторявшееся порицание без излишнего усиления.
- source_word: τὸ πνεῦμα τοῦ ζήλου καὶ τῆς πορνείας
  choice: дух ревности и разврата
  rationale: Сохраняет единственное число «дух» и две зависимые характеристики; «разврат» естественно передаёт πορνεία в данном нравственном контексте.
- source_word: παρετάξατο ἐπ᾽ ἐμέ
  choice: ополчился против меня
  rationale: Передаёт образ выстраивания к бою и враждебного выступления, сохраняя единственное число греческого сказуемого.
- source_word: συνετέλεσα εἰς
  choice: довёл это до конца с
  rationale: Сохраняет необычную и не вполне явную формулировку источника, не подменяя её более определённым «согрешил».
- source_word: νύμφην
  choice: невесткой
  rationale: В контексте отношений Иуды и Фамари обозначает жену сына, то есть невестку.
theological_decisions:
- issue: Личная ответственность Иуды и действие «духа»
  choice: 'Сохранена последовательность: Иуда укоряет Рувима, затем дух ополчается против самого Иуды.'
  alternative: Истолковать дух лишь как психологическую склонность или снять личностно-образный язык.
  rationale: Греческий текст использует τὸ πνεῦμα и военный глагол παρετάξατο; перевод не решает, является ли этот дух внешней силой или олицетворённой страстью.
- issue: Характер поступка, выраженного συνετέλεσα
  choice: «довёл это до конца»
  alternative: «согрешил» или «вступил в связь»
  rationale: Более конкретные варианты богословски и повествовательно правдоподобны, но добавляют определённость, которой необычная греческая конструкция прямо не выражает.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис остаётся близким к греческому, но читается естественно; подлинная неясность повреждённого места и выражения συνετέλεσα εἰς не устранена догматическим или повествовательным уточнением.
