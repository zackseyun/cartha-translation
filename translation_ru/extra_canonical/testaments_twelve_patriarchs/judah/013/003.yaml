  source_fidelity: 'Перевод в целом точно передаёт последовательность греческого текста: Иуда укоряет Рувима, затем единственный «дух ревности и блуда» выступает против него. «Ополчился против меня» хорошо воспроизводит военный образ παρετάξατο. Однако примечание неточно называет «буквальным» переводом греческого εἰς выражение «в хананеянку»; это неудачное русское калькирование предлога, не проясняющее и не описывающее синтаксическую трудность.'
