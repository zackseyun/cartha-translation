lexical_decisions:
- source_word: ἐγκαυχησάμενος
  choice: хвалился
  rationale: Передаёт причастие со значением самоуверенного хвастовства естественным современным русским языком.
- source_word: ἐν πολέμοις
  choice: на войнах
  rationale: Сохраняет множественное число и военный контекст греческого выражения.
- source_word: πρόσωπον γυναικὸς εὐμόρφου
  choice: лицо красивой женщины
  rationale: Формально и естественно передаёт образ, не заменяя «лицо» более общим понятием привлекательности.
- source_word: ἠπάτησέ με
  choice: меня не обмануло
  rationale: Следует контексту хвастовства и засвидетельствованному смыслу консультационного текста; предполагаемое отрицание отмечено как текстуально неуверенное.
