  text: '*Καὶ νῦν ἐντέλλομαι ὑμῖν, τέκνα μου, ἀκούσατε *Ἰούδα¹ τοῦ πατρὸς ὑμῶν⁷² καὶ φυλάξασθε⁹ τοὺς λόγους μου¹⁰ τοῦ ποιεῖν⁷ πάντα¹¹ τὰ δικαιώματα Κυρίου¹³ καὶ ὑπακούειν¹⁴ ἐντολαῖς⁵ Θεοῦ¹⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/001.yaml
  text: 'And now I command you, my children: listen to Judah, your father, and keep my words in your hearts, to do all the righteous commands of the Lord and to obey the commands of God.'
translation:
  language: ru
  text: 'А теперь я заповедую вам, дети мои: слушайте Иуду, вашего отца, и храните мои слова, чтобы исполнять все установления Господа и повиноваться заповедям Бога.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντέλλομαι
  choice: я заповедую
  rationale: Передаёт торжественное отцовское наставление и связь с последующими заповедями, не ослабляя глагол до простого «прошу» или «советую».
- source_word: ἀκούσατε
  choice: слушайте
  rationale: Императив подразумевает не только физическое восприятие речи, но и внимательное принятие наставления; «слушайте» естественно сохраняет оба оттенка.
- source_word: φυλάξασθε τοὺς λόγους μου
  choice: храните мои слова
  rationale: Сохраняет образ бережного соблюдения наставлений без добавления отсутствующего в представленном греческом тексте уточнения «в сердцах».
- source_word: δικαιώματα Κυρίου
  choice: установления Господа
  rationale: δικαιώματα здесь обозначает установленные нормы или предписания; «установления» точнее, чем оценочное «праведные повеления».
- source_word: ὑπακούειν
  choice: повиноваться
  rationale: Передаёт требуемое послушание Божьим заповедям, а не только их выслушивание.
theological_decisions:
- issue: Соотношение «установлений Господа» и «заповедей Бога»
  choice: Сохранены оба выражения и параллелизм исходного текста.
  alternative: Объединить их в одно обобщённое выражение о Божьих заповедях.
  rationale: Различие между δικαιώματα Κυρίου и ἐντολαῖς Θεοῦ присутствует в греческом тексте; его не следует сглаживать или наделять конфессионально заданным смыслом.
- issue: Целевой оттенок инфинитивов τοῦ ποιεῖν и ὑπακούειν
  choice: «чтобы исполнять… и повиноваться…»
  alternative: «исполняя… и повинуясь…»
  rationale: Конструкция допускает пояснение цели хранения слов; русский союз «чтобы» ясно передаёт эту связь, не утверждая более узкой богословской интерпретации.
translation_notes:
  register: Современный литературный русский язык с достойным завещательным тоном. Синтаксис остаётся ясным для широкого читателя. Самоназвание «Иуда, отец ваш» сохранено, несмотря на его необычность, поскольку оно прямо присутствует в источнике. Добавление «в сердцах» из английского консультационного слоя не принято, так как в предоставленном греческом тексте ему нет выраженного соответствия.
