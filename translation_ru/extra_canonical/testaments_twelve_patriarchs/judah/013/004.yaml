revisions:
- from: 'Ведь я сказал своему тестю: «Я посоветуюсь с отцом и тогда возьму твою дочь». Но он не захотел этого и показал мне несметное количество золота как дар за неё[a], потому что был царём.'
  to: 'Ведь я сказал своему тестю: «Я посоветуюсь с отцом и тогда возьму твою дочь». Но он не согласился и показал мне несметное количество золота в связи с её выдачей замуж[a], потому что был царём.'
  rationale: Заменено толкование «как дар за неё» на нейтральное «в связи с её выдачей замуж», а примечание уточнено так, чтобы явно сохранить спорность синтаксической и смысловой связи. Также слегка улучшена естественность передачи отказа тестя. Смысл, порядок событий и причинное указание на царский статус сохранены.
