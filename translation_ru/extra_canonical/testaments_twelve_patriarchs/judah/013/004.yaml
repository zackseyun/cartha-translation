source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ἔλεγον γὰρ τῷ πενθερῷ μου ὅτι συμβουλεύσομαι τῷ πατρί μου καὶ οὕτως λήψομαι³⁴ τὴν θυγατέρα σου⁵· ὁ δὲ οὐκ ἠθέλησεν, ἀλλ᾽ ἔδειξέ³⁵ μοι *εἰς δόσιν αὐτῆς³⁶ χρυσίου πλῆθος³⁷ ἄπειρον³⁸. *Βασιλεὺς γὰρ ἦν³⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/004.yaml
  text: For I said to my father-in-law, “I will consult my father, and then I will take your daughter.” But he was unwilling; instead, he showed me an immense amount of gold in the name of his daughter, for he was a king.
translation:
  language: ru
  text: 'Ведь я сказал своему тестю: «Я посоветуюсь с отцом и тогда возьму твою дочь». Но он не согласился и показал мне несметное количество золота в связи с её выдачей замуж[a], потому что был царём.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греч. εἰς δόσιν αὐτῆς, буквально: «для её отдачи/выдачи». Оборот может относиться к выдаче дочери замуж; точная роль упомянутого золота не вполне ясна.'
    reason: Сохраняет неоднозначность выражения εἰς δόσιν αὐτῆς и не предрешает, было ли золото приданым, даром или иной частью брачного соглашения.
lexical_decisions:
- source_word: πενθερῷ
  choice: тестю
  rationale: Прямое современное обозначение отца жены; родственная связь названа с точки зрения рассказчика.
- source_word: συμβουλεύσομαι τῷ πατρί μου
  choice: посоветуюсь с отцом
  rationale: Естественно передаёт намерение обратиться к отцу за советом, не усиливая его до формального испрашивания разрешения.
- source_word: λήψομαι τὴν θυγατέρα σου
  choice: возьму твою дочь
  rationale: Сохраняет конкретный образ греческого выражения; в контексте речь идёт о вступлении в брак.
- source_word: χρυσίου πλῆθος ἄπειρον
  choice: несметное количество золота
  rationale: Передаёт буквально неисчислимое, чрезвычайно большое количество и звучит естественно в русском повествовании.
- source_word: Βασιλεὺς
  choice: царём
  rationale: Традиционное и уместное обозначение древнего правителя в данном литературно-историческом контексте.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Прямая речь передана ясно и естественно; причинное γὰρ в начале переведено как «ведь», а в конце — как «потому что».
