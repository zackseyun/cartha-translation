  text: And he adorned her with gold and pearls, and made her pour wine for us at the banquet.
translation:
  language: ru
  text: Он украсил её золотом и жемчугом и велел ей наливать нам вино на пиру, в женской красе.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в красоте женщин». Необычный греческий оборот может относиться к женскому убранству, внешности или к тому, как она прислуживала.'
    reason: Сохраняет неоднозначность ἐν κάλλει γυναικῶν и поясняет выбранную передачу, не навязывая одного толкования.
lexical_decisions:
- source_word: ἐκόσμησεν
  choice: украсил
  rationale: Передаёт прямое значение глагола в контексте украшений из золота и жемчуга.
- source_word: ἐν χρυσίῳ καὶ μαργαρίταις
  choice: золотом и жемчугом
  rationale: Естественная русская передача инструментального значения ἐν; собирательное «золото» уместно для золотых украшений.
- source_word: οἰνοχοεῖν ἡμῖν
  choice: наливать нам вино
  rationale: Точно и естественно передаёт действие виночерпия, не расширяя его до общего прислуживания.
- source_word: ἐν τῷ δείπνῳ
  choice: на пиру
  rationale: В данном повествовательном контексте δείπνον обозначает устроенное совместное праздничное застолье.
- source_word: ἐν κάλλει γυναικῶν
  choice: во всём женском великолепии
  rationale: Сохраняет образ красоты и пышного убранства, не сводя неоднозначную греческую фразу только к одежде или внешности.
