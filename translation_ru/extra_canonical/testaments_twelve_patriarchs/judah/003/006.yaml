  text: But I wrapped my garment around my arm and slung four stones at them; from behind and in front around the waist of one seated on a horse, I picked up a stone of sixty litras and hurled it, struck the horse, and killed it. And I fought King Nahor for about two hours, and after smashing the shield into pieces, I cut off his feet, and so I killed him.
translation:
  language: ru
  text: Я же обмотал руку своей одеждой и, метнув в них из пращи камни, убил четверых из них, а остальные обратились в бегство.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐνελύθην … τὴν στολήν μου ἐπὶ τὴν χεῖρά μου
  choice: обмотал одеждой руку
  rationale: Передаёт действие естественно по-русски; χείρ может обозначать кисть или руку в более широком смысле, поэтому нейтральное «руку» сохраняет допустимую широту значения.
- source_word: σφενδονήσας αὐτοὺς λίθοις
  choice: метнув в них камни из пращи
  rationale: Глагол связан с метанием из пращи; формулировка ясно передаёт способ нападения и множественное число λίθοις, не добавляя отсутствующего в данном греческом тексте точного числа камней.
- source_word: τέσσαρας ἐξ αὐτῶν ἀνεῖλον
  choice: убил четверых
  rationale: ἀναιρέω в данном боевом контексте означает «убить»; принадлежность к группе уже понятна из «в них», поэтому «из них» можно естественно опустить без потери смысла.
- source_word: οἱ δὲ λοιποὶ ἔφυγον
  choice: а остальные бежали
  rationale: Прямое и естественное соответствие греческому противопоставлению и аористу.
