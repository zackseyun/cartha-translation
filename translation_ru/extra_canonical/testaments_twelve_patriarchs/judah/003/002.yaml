  text: And the other king, Taphou, while he was sitting on the horse, I killed; and so I scattered all his people.
translation:
  language: ru
  text: А другого царя, Тафуа, сидевшего на коне, я убил и так рассеял весь его народ.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸν δὲ ἕτερον βασιλέα
  choice: А другого царя
  rationale: Винительный падеж сохранён как вынесенное дополнение; δέ естественно передано союзом «а», обозначающим переход к другому царю.
- source_word: τὸν Ταφούα
  choice: Тафуа
  rationale: Имя передано транслитерацией греческой формы Ταφούα без искусственного склонения.
- source_word: καθήμενον ἐπὶ τοῦ ἵππου
  choice: сидевшего на коне
  rationale: Причастный оборот передан естественным русским причастием; определённый артикль при ἵππου не выражает явно принадлежность, поэтому местоимение «своём» не добавлено.
- source_word: ἀνεῖλον
  choice: я убил
  rationale: Форма аориста ἀναιρέω в данном повествовательном контексте означает насильственно лишить жизни; первое лицо выражено русским местоимением для ясности.
- source_word: καὶ οὕτως πάντα τὸν λαὸν αὐτοῦ διεσκόρπισα
  choice: и так рассеял весь его народ
  rationale: οὕτως передано как «так», αὐτοῦ — как «его»; во второй части местоимение «я» не повторено, что естественно для русского синтаксиса.
