  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/003.yaml
  text: And I found Achor, a giant man, shooting arrows. Leaping up, I took a stone of sixty litras and hurled it; I struck the horse and killed him.
translation:
  language: ru
  text: И я встретил царя Ахора, великана, который, сидя на коне, пускал стрелы вперёд и назад. Вскочив, я взял камень весом в шестьдесят литр[a], бросил его в коня и убил его.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Литра — древняя единица веса; её точная величина в данном тексте неясна.
    reason: Предотвращает ошибочное отождествление с современной единицей объёма и не навязывает спорный пересчёт.
  - marker: b
    text: 'Или: «и убил Ахора»; возможно также, что речь идёт о коне.'
    reason: Греческое местоимение «его» может относиться как к Ахору, так и к коню.
lexical_decisions:
- source_word: Ἀχὼρ βασιλέα γίγαντα
  choice: царя Ахора, великана
  rationale: Сохранены и царский титул, и характеристика Ахора как великана; приложение передаёт греческую конструкцию естественно для русского языка.
- source_word: βάλλοντα τόξα ἔμπροσθεν καὶ ὄπισθεν ἐφ᾽ ἵππου
  choice: сидя на коне, пускал стрелы вперёд и назад
  rationale: Греческий текст прямо указывает стрельбу вперёд и назад с коня; эти детали сохранены, хотя в английском консультационном тексте они сокращены.
- source_word: ἀνελάμενος λίθον
  choice: подняв камень
  rationale: Причастие означает взятие или поднятие камня; перевод не вводит отсутствующего в греческом тексте прыжка.
- source_word: δέδωκα τῷ ἵππῳ
  choice: я ударил им коня
  rationale: Буквально выражение значит «дал коню», но в данном боевом контексте обозначает нанесение удара поднятым камнем. Местоимение «им» ясно связывает удар с камнем.
- source_word: ἑξήκοντα λιτρῶν
  choice: весом в шестьдесят литр
  rationale: Сохранена древняя единица веса без недостоверного пересчёта в современные единицы.
theological_decisions:
- issue: К кому относится αὐτόν в словах καὶ ἀπέκτεινα αὐτόν
  choice: убил его
  alternative: убил Ахора / убил коня
  rationale: И Ахор, и конь имеют мужской род, поэтому греческое местоимение формально допускает обе референции. Русское «его» сохраняет эту подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Сохранены существенные детали греческого текста, отсутствующие в английском слое, а текстуальная и референциальная неоднозначность не устранена без основания.
