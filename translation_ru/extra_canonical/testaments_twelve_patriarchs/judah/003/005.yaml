  text: And while I was stripping off his breastplate, behold, eight men, his companions, began to fight me.
translation:
  language: ru
  text: И когда я снимал с него панцирь, вот, восемь человек, его товарищи, начали сражаться со мной.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν δὲ τῷ ἐκδύειν με
  choice: И когда я снимал
  rationale: Артикль с инфинитивом и ἐν передаёт действие, происходящее одновременно с последующим событием; естественная русская временная конструкция сохраняет этот смысл.
- source_word: τὸν θώρακα αὐτοῦ
  choice: с него панцирь
  rationale: θώραξ здесь обозначает защитный нагрудный доспех; «панцирь» звучит естественно и исторически уместно, а местоимение αὐτοῦ передано сочетанием «с него».
- source_word: ἰδού
  choice: вот
  rationale: Сохраняет повествовательный сигнал внезапного появления и привлекает внимание читателя.
- source_word: ἄνδρες ὀκτώ
  choice: восемь человек
  rationale: В данном контексте ἄνδρες означает взрослых мужчин, однако по-русски при числительном наиболее естественно «восемь человек».
- source_word: ἑταῖροι αὐτοῦ
  choice: его товарищи
  rationale: ἑταῖροι обозначает спутников или соратников; нейтральное «товарищи» не добавляет более узкой характеристики.
- source_word: ἤρξαντο πολεμεῖν με
  choice: начали сражаться со мной
  rationale: Сохраняет начинательный аспект ἤρξαντο и передаёт πολεμεῖν в контексте непосредственной схватки.
