  text: And when the two kings of the Canaanites came in armor against our flocks, with many people with them, I alone ran at one of the kings; and striking him on the shins, I brought him down and so killed him.
translation:
  language: ru
  text: Когда же два ханаанских царя в доспехах выступили против наших стад и с ними было множество людей, я один бросился на одного из царей и раздробил ему кости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τεθωρακισμένοι
  choice: в доспехах
  rationale: Передаёт состояние вооружённых защитным доспехом царей без излишнего уточнения вида брони.
- source_word: ἐπὶ τὰ ποίμνια ἡμῶν
  choice: напали на наши стада
  rationale: Предлог ἐπί в контексте вражеского выступления естественно выражает направленное нападение.
- source_word: λαὸς πολύς
  choice: множество воинов
  rationale: Буквально «много народа»; военный контекст указывает на сопровождавший царей отряд.
- source_word: δραμὼν ἐπὶ
  choice: бросился на
  rationale: Сохраняет буквальную идею стремительного бега к противнику и естественно звучит по-русски.
- source_word: κατεσπάραξα τὰ ὀστᾶ αὐτοῦ
  choice: раздробил ему кости
  rationale: 'Следует представленному греческому тексту: глагол κατεσπάραξα выражает разрывание или сокрушение, а прямое дополнение — «его кости».'
