  verdict: revise
  source_fidelity: 'Смысл передан точно: ἱερατεία τοῦ Θεοῦ — «священство Божье», ὑπερέχει — превосходство над земной βασιλεία, а условие выражает возможность утраты этого положения вследствие греха, отпадения от Господа и подчинения земной власти. Английское вступительное сравнение неба и земли в представленной греческой редакции отсутствует, поэтому его не следует вносить в русский текст.'
  naturalness: Начальное «Ибо так священство… превосходит» звучит по-русски как буквальная и не вполне связная калька οὕτως γὰρ. В данном самостоятельном фрагменте естественнее передать основное утверждение без «так»; смысловое «thus/so» зависит от более широкого контекста и не требует неестественного русского соответствия.
  terminology: «Священство Божье», «Господь», «отпадёт» и «земное царство» уместны и сохраняют возвышенный, но современный регистр. «Окажется под властью» адекватно передаёт пассив κυριευθῇ, не вводя лишнего представления о насилии.
