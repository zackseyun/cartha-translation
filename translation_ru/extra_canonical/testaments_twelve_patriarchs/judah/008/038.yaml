  text: Οὕτως γὰρ *ὑπερέχει ἡ ἱερατεία τοῦ Θεοῦ τῆς ἐπιγείου βασιλείας, ἐὰν μὴ διὰ ἁμαρτιῶν ἐκπέσῃ ἀπὸ Κυρίου καὶ διὰ τοῦ τῆς ἐπιγείου βασιλείας *κυριευθῇ.
  language: Greek
