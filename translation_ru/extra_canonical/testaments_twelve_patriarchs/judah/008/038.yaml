base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/038.yaml
  text: As heaven is higher than earth, so is the priesthood of God higher than the earthly kingdom—unless it falls away through sin from the Lord and is dominated by the earthly kingdom.
translation:
  language: ru
  text: Ибо священство Божье превосходит земное царство, если только оно из-за грехов не отпадёт от Господа и не окажется под властью земного царства.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερέχει
  choice: превосходит
  rationale: Передаёт сравнительное превосходство священства без добавленного в английском тексте образа высоты неба над землёй, которого в представленном греческом тексте нет.
- source_word: ἡ ἱερατεία τοῦ Θεοῦ
  choice: священство Божье
  rationale: Естественная современная формулировка, сохраняющая принадлежность священства Богу.
- source_word: τῆς ἐπιγείου βασιλείας
  choice: земное царство
  rationale: Сохраняет противопоставление Божьего священства земной царской власти; «царство» соответствует βασιλεία и поддерживает связь со второй половиной стиха.
- source_word: ἐκπέσῃ ἀπὸ Κυρίου
  choice: отпадёт от Господа
  rationale: Передаёт духовное отпадение и сохраняет направленность ἀπό — удаление от Господа.
- source_word: κυριευθῇ
  choice: окажется под властью
  rationale: Естественно передаёт пассивное значение «будет подчинено, окажется во власти», не усиливая его до насильственного порабощения.
theological_decisions:
- issue: Условный характер превосходства священства
  choice: «если только оно… не отпадёт… и не окажется под властью»
  alternative: «если оно не отпадёт… и не будет подчинено»
  rationale: 'Формулировка сохраняет напряжение греческого текста: превосходство священства связано с верностью Господу и может быть утрачено через грех и подчинение земной власти.'
- issue: Референт подразумеваемого субъекта в условной части
  choice: явно указано местоимение «оно», относящееся к священству
  alternative: оставить субъект невыраженным
  rationale: В русском языке местоимение устраняет ненужную синтаксическую неясность; по ближайшему согласуемому смыслу условие относится к священству.
translation_notes:
  register: Современный литературный русский язык, торжественный, но понятный. Перевод следует представленному греческому тексту. Английское сравнение «как небо выше земли» не включено, поскольку в данном греческом свидетельстве оно отсутствует; наречие οὕτως передано как «так».
