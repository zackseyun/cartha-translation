source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τοιοῦτός ἐστιν ὁ πάροινος, τέκνα μου, ὅτι ὁ μεθύων οὐκ αἰδεῖται οὐδένα. 5. *Ἰδοὺ γὰρ κἀμὲ ἐπλάνησεν μὴ αἰσχυνθῆναι τὸ πλῆθος πόλεως ὅτι ἐν ὀφθαλμῶν πάντων ἐξέκλινα πρὸς τὴν Θαμὰρ, καὶ ἐποίησα ἁμαρτίαν μεγάλην, καὶ ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου.
  language: Greek
  note: Greek from Charles XIV.4-5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/019.yaml
  text: Such is the drunkard, my children. For the one who is drunk does not reverence anyone. For behold, it made me also transgress the commandment of God, and I went in to Tamar, not being ashamed of the multitude in the city, and before the eyes of all I uncovered the shame of my sons, since I went in to Tamar.
translation:
  language: ru
  text: 'Таков пьяница, дети мои: пьяный ни с кем не считается. Ибо вот, оно и меня сбило с пути: я не постыдился множества горожан, потому что на глазах у всех уклонился к Фамари, совершил великий грех и открыл покров нечистоты моих сыновей.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «открыл покров нечистоты моих сыновей». Смысл этого необычного выражения не вполне ясен; оно может подразумевать, что поступок Иуды сделал явными семейную нечистоту или позор.'
    reason: Примечание объясняет непрозрачность выражения, не выдавая вероятное толкование за единственное значение текста.
lexical_decisions:
- source_word: ὁ πάροινος
  choice: пьяница
  rationale: Слово обозначает человека, склонного к пьянству или находящегося под властью вина; «пьяница» естественно передаёт личностную характеристику в данном наставлении.
- source_word: ὁ μεθύων
  choice: опьяневший
  rationale: Причастие описывает того, кто пьян; выбранное слово сохраняет связь с состоянием опьянения и не повторяет буквально «пьяница».
- source_word: οὐκ αἰδεῖται οὐδένα
  choice: никого не стыдится
  rationale: Глагол αἰδέομαι сочетает значения стыда, почтения и сдержанности перед другими; в контексте публичного бесстыдства основным выбрано значение «стыдиться».
- source_word: ἐπλάνησεν
  choice: ввело в заблуждение
  rationale: Глагол означает «сбило с пути, ввело в заблуждение». Подлежащее понято по ближайшему контексту как вино или опьянение и выражено словом «вино» для ясности.
- source_word: ἐξέκλινα πρὸς τὴν Θαμάρ
  choice: свернул к Фамари
  rationale: Сохранён образ уклонения или поворота к Фамари без добавления отсутствующего в данном греческом тексте прямого обозначения половой связи.
- source_word: ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου
  choice: открыл покров нечистоты моих сыновей
  rationale: Необычный и не вполне прозрачный образ передан близко к форме греческого текста, без сведения его только к «позору» или иной однозначной интерпретации.
theological_decisions:
- issue: Упоминание нарушения Божьей заповеди
  choice: Не добавлять
  alternative: «Это побудило и меня преступить заповедь Божью»
  rationale: Этой фразы нет в предоставленном греческом тексте редакции Charles XIV.4–5 (α), хотя она присутствует в английском консультационном слое; перевод следует первичному источнику.
- issue: Повторное прямое указание на связь с Фамарью
  choice: Передать только имеющееся ἐξέκλινα πρὸς τὴν Θαμάρ как «свернул к Фамари»
  alternative: «вошёл к Фамари» или повторить эту формулу в конце
  rationale: Предоставленный греческий текст не содержит английского повторения «I went in to Tamar»; добавление сняло бы образную неоднозначность глагола ἐκκλίνω.
translation_notes:
  register: 'Современный литературный русский, с достоинством завещательного наставления. Синтаксис сделан ясным для обычного читателя, но образные и богословски значимые неясности греческого текста не устранены. Имена переданы в традиционной русской библейской форме: Фамарь.'
