revisions:
- from: 'Таков пьяница, дети мои: опьяневший никого не стыдится. И вот, вино ввело в заблуждение и меня: я не постыдился множества горожан, но на глазах у всех свернул к Фамари, совершил великий грех и открыл покров нечистоты моих сыновей.[a]'
  to: 'Таков пьяница, дети мои: пьяный ни с кем не считается. Ибо вот, оно и меня сбило с пути: я не постыдился множества горожан, потому что на глазах у всех уклонился к Фамари, совершил великий грех и открыл покров нечистоты моих сыновей.[a]'
  rationale: Перевод исправлен только там, где черновик добавлял невыраженное в греческом подлежащее, неточно передавал αἰδέομαι или снижал образный наставительный стиль. Не добавлены фразы из английского audit trail, поскольку они отсутствуют в предоставленном первичном греческом тексте. Неоднозначное «оно» намеренно сохраняет отсутствие явно названного подлежащего при ἐπλάνησεν; его ближайший смысловой референт — опьянение или связанное с ним состояние.
