revisions:
- from: 'Ибо ангел Господа сказал мне: «Господь избрал его прежде тебя, чтобы он приближался к Нему, ел за Его столом и приносил Ему начатки лакомств сынов Израиля. А ты будешь царём Иакова».[a]'
