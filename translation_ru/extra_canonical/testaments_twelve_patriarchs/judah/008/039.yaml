    issue: «прежде тебя» для ὑπὲρ σέ
    rationale: Фраза в русском языке обычно означает «раньше тебя» во времени. В греческом здесь обозначено избрание одного лица в предпочтение другому; перевод следует сделать явно сравнительным.
  - severity: medium
    issue: «начатки лакомств сынов Израиля» для ἀπαρχὰς ... ἐντρυφημάτων υἱῶν Ἰσραήλ
    rationale: «Лакомства» разговорно сужает значение до особых кушаний и сочетание с «начатками» звучит не по-русски. Нужна формулировка, сохраняющая культовый смысл первых приношений и ценность даров.
