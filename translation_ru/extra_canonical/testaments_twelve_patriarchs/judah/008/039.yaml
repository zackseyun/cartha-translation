source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὁ γὰρ ἄγγελος Κυρίου εἶπέ μοι· Αὐτὸν ὑπὲρ σὲ ἐξελέξατο Κύριος προσεγγίζειν αὐτῷ, καὶ ἐσθίειν τὴν τράπεζαν αὐτοῦ, καὶ ἀπαρχὰς αὐτῷ προσφέρειν ἐντρυφημάτων υἱῶν Ἰσραήλ. *Σὺ δὲ ἔσῃ βασιλεὺς Ἰακὼβ.
  language: Greek
  note: Greek from Charles XXI.5 (α). The project English's closing simile 'as a lion' (ὡς λέων) does not appear in α here; α has only 'βασιλεὺς Ἰακὼβ' ('king of Jacob'). The lion image draws on the broader testamentary tradition (cf. apocalyptic 'lion' imagery in ch.XXIV-XXV). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/039.yaml
  text: For the angel of the Lord said to me, "The Lord chose Levi before you, to be near him, and for you to be king with him, as a lion."
translation:
  language: ru
  text: 'Ибо ангел Господа сказал мне: «Господь избрал его, предпочтя тебе, чтобы он приближался к Нему, ел за Его столом и приносил Ему начатки от лучших даров сынов Израиля. А ты будешь царём Иакова».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В некоторых пересказах и в более широкой традиции Завета Иуды к заключению добавляется образ льва; в данном греческом тексте сказано только: «ты будешь царём Иакова».'
    reason: Поясняет расхождение с английским POB и не допускает внесения отсутствующей в основном греческом свидетеле фразы в текст.
lexical_decisions:
- source_word: Αὐτόν
  choice: его
  rationale: Греческий текст использует местоимение «его»; имя Левия известно из контекста, но в данном стихе прямо не названо, поэтому оно не внесено в основной текст.
- source_word: ὑπὲρ σὲ ἐξελέξατο
  choice: избрал его прежде тебя
  rationale: В этом контексте ὑπέρ с винительным выражает преимущество или предпочтение одного перед другим; «прежде тебя» естественно передаёт сравнительный смысл, не сводя его непременно к хронологии.
- source_word: προσεγγίζειν αὐτῷ
  choice: чтобы он приближался к Нему
  rationale: Сохранён культовый оттенок приближения к Богу, соответствующий священнической роли.
- source_word: ἐσθίειν τὴν τράπεζαν αὐτοῦ
  choice: ел за Его столом
  rationale: Буквальное греческое выражение «есть Его стол» идиоматически означает участие в трапезе или питание от стола; по-русски естественно «есть за столом».
- source_word: ἀπαρχὰς ... ἐντρυφημάτων
  choice: начатки лакомств
  rationale: ἀπαρχαί обозначает первые или начальные приношения, а ἐντρυφήματα — изысканные, приятные яства; формулировка сохраняет образ даров от лучших яств.
- source_word: βασιλεὺς Ἰακώβ
  choice: царём Иакова
  rationale: Сохранена краткая родительная конструкция оригинала, где Иаков может обозначать народ, происходящий от патриарха.
theological_decisions:
- issue: Соотношение священнического избрания и царской власти
  choice: Лицо, обозначенное местоимением «его», избрано для приближения к Господу и приношений, тогда как Иуде обещано царствование над Иаковом.
  alternative: 'Следовать сокращённому английскому тексту: «быть царём вместе с ним».'
  rationale: В представленном греческом тексте нет выражения «вместе с ним»; роли сопоставлены, но не слиты.
- issue: Образ льва в заключении
  choice: Не включать «как лев» в основной текст.
  alternative: Добавить «как лев» вслед за английским POB и более широкой традицией Завета Иуды.
  rationale: ὡς λέων отсутствует в указанном греческом свидетеле α; добавление образа сделало бы перевод данного источника менее точным.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно библейским звучанием. Прописные местоимения «Нему», «Его» обозначают Господа и облегчают различение референтов. Сохранены параллельные инфинитивные цели и напряжение между священнической и царской ролями.
