source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἔγνωκα ὅσα κακὰ ποιήσετε ἐν [ταῖς ἐσχάταις ἡμέραις].'
  language: Greek
  note: Greek from Charles XVIII.1 (α). The project English's 'I have read in the books of Enoch the righteous' reflects the β-recension reading 'καίγε ἀνέγνων ἐν βίβλοις Ἐνὼχ τοῦ δικαίου' (Charles 1908 raw apparatus, p164 n.1); the α-text here has only 'Καὶ ἔγνωκα' ('And I have come to know'). The 'sons turning away from the Lord and committing every wickedness' is captured in α by 'ὅσα κακὰ ποιήσετε ἐν [ταῖς ἐσχάταις ἡμέραις]' (the bracketed clause is Charles' marked Christian interpolation, preserved per project policy). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/042.yaml
  text: And now I have commanded you these things, because I have read in the books of Enoch the righteous that your sons will turn away from the Lord, and will commit every wickedness and every affliction before the Lord.
translation:
  language: ru
  text: И я узнал, сколько зла вы совершите в [последние дни].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «в последние дни» в издании Чарльза заключены в квадратные скобки как предполагаемая христианская вставка.
    reason: Нужно пояснить читателю смысл квадратных скобок и открыто отразить текстологическую неопределённость.
lexical_decisions:
- source_word: ἔγνωκα
  choice: я узнал
  rationale: Перфект γινώσκω передаёт достигнутое знание; эта формулировка не добавляет отсутствующего в α-тексте упоминания книг Еноха.
- source_word: ὅσα κακά
  choice: сколько зла
  rationale: Сохраняет обобщённое и несколько неоднозначное выражение греческого текста, не разворачивая его в отсутствующие перечни проступков и бедствий.
- source_word: ποιήσετε
  choice: вы совершите
  rationale: Будущее время и обращение во втором лице множественного числа переданы прямо.
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: в последние дни
  rationale: Устойчивый и понятный русский эквивалент эсхатологического выражения; квадратные скобки сохраняют редакционную маркировку источника.
theological_decisions:
- issue: Расширенное чтение β-рецензии о книгах праведного Еноха
  choice: Не включать
  alternative: «я прочёл в книгах праведного Еноха»
  rationale: Предоставленный основной греческий текст α-рецензии содержит только Καὶ ἔγνωκα; перевод следует исходному чтению, а не расширению консультационного английского текста.
- issue: Уточнение о сыновьях, отступлении от Господа и всяком бедствии пред Господом
  choice: Не добавлять
  alternative: Включить подробности английского POB
  rationale: Эти подробности отсутствуют в данном греческом α-тексте; ὅσα κακὰ ποιήσετε следует оставить общим выражением.
- issue: Предполагаемая христианская интерполяция
  choice: Сохранить в квадратных скобках
  alternative: Опустить слова «в последние дни»
  rationale: Проектная политика требует сохранить отмеченную Чарльзом интерполяцию, не скрывая её текстологический статус.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским звучанием. Перевод намеренно следует α-тексту и не воспроизводит расширения β-рецензии, вошедшие в английский консультационный слой.
