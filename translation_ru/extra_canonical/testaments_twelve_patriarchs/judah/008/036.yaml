id: T12P.JUD.8.36
reference: Testament of Judah 8:36
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐμοὶ γὰρ ἔδωκεν ὁ Θεὸς τὴν βασιλείαν, κἀκείνῳ τὴν ἱερατείαν, καὶ ὑπέταξε τὴν βασιλείαν τῇ ἱερωσύνῃ.
  language: Greek
  note: Greek from Charles XXI.2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/036.yaml
  text: For to me the Lord gave the kingship, and to him the priesthood; and he set the kingdom under the priesthood.
translation:
  language: ru
  text: Ибо мне Бог дал царскую власть, а ему — священство, и подчинил царство священству.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεός
  choice: Бог
  rationale: Греческий текст прямо называет Бога; вариант «Господь» в английском консультационном слое не воспроизводит исходную лексику.
- source_word: τὴν βασιλείαν
  choice: царскую власть
  rationale: В первом употреблении речь идёт о дарованной Иуде царской власти; такой перевод естественнее по-русски, чем «царство», и сохраняет институциональный смысл.
- source_word: τὴν ἱερατείαν / τῇ ἱερωσύνῃ
  choice: священство / священству
  rationale: Оба близких греческих существительных обозначают священническое служение или институт; единообразный русский корень передаёт смысловую связь без искусственного разграничения.
- source_word: ὑπέταξε
  choice: подчинил
  rationale: Передаёт сильное иерархическое значение глагола ὑποτάσσω без смягчения.
theological_decisions:
- issue: Соотношение царской власти и священства
  choice: «подчинил царство священству»
  alternative: «поставил царство в подчинение священству»
  rationale: Сохранено прямое утверждение греческого текста об иерархическом подчинении, без попытки согласовать его с какой-либо позднейшей конфессиональной моделью.
- issue: Неуказанный референт местоимения κἀκείνῳ
  choice: «а ему»
  alternative: указать имя предполагаемого лица
  rationale: Имя в данном стихе отсутствует; местоименная форма сохраняет зависимость от контекста и не устраняет исходную неоднозначность.
translation_notes:
  register: Современный литературный русский язык, сжатый и торжественный синтаксис. Эллипсис «а ему — священство» естественно передаёт греческое противопоставление и избегает ненужного повторения глагола.
