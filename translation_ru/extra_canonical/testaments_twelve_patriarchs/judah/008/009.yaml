  text: καὶ δέδωκα αὐτῇ τὴν ῥάβδον μου καὶ τὸ διάδημά μου *εἰς ἀρραβῶνα.
  language: Greek
  note: 'Greek from Charles XII.4b (α): the pledge handover. Project''s English distributes this single α-clause across project vv 9-10. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/009.yaml
  text: And I said, "What pledge shall I give you?" And she said, "Your staff, and your girdle, and the diadem of your kingdom."
translation:
  language: ru
  text: И я отдал ей в залог свой посох и свою диадему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте названы посох и диадема; пояс здесь не упоминается.
    reason: Фиксирует существенное расхождение с английским консультационным текстом и не позволяет молча внести отсутствующий предмет.
lexical_decisions:
- source_word: δέδωκα
  choice: отдал
  rationale: Передаёт совершившуюся передачу предметов; русское прошедшее время естественно в повествовании.
- source_word: ῥάβδον
  choice: посох
  rationale: Наиболее естественное обозначение личного жезла или дорожного посоха в данном повествовательном контексте.
- source_word: διάδημα
  choice: диадема
  rationale: Формально сохраняет конкретный предмет греческого текста, не добавляя отсутствующее в источнике пояснение «твоего царства».
- source_word: εἰς ἀρραβῶνα
  choice: в залог
  rationale: Устойчиво и точно передаёт назначение переданных предметов как обеспечения обещания.
theological_decisions:
- issue: Расхождение греческой строки с английским консультационным слоем
  choice: 'Следовать непосредственно греческому источнику: Иуда отдаёт два предмета — посох и диадему.'
  alternative: 'Воспроизвести диалог и три предмета из English POB: посох, пояс и диадему царства.'
  rationale: Предоставленная греческая строка не содержит ни вопроса и ответа, ни пояса, ни определения «царства». Добавление этих элементов означало бы перевод не данной исходной строки.
translation_notes:
  register: Современный литературный русский язык; краткая, достойная повествовательная формулировка. Порядок слов слегка сглажен ради естественности, при этом состав и смысл греческой фразы сохранены.
