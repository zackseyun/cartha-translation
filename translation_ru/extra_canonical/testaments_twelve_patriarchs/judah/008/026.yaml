source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἔδειξέ μοι ὁ ἄγγελος τοῦ Θεοῦ ὅτι αἱ γυναῖκες κρατοῦσι τοῦ βασιλέως καὶ τοῦ πτωχοῦ κατακυριεύουσιν αἱ γυναῖκες, *τοῦ μὲν βασιλέως αἴρουσιν τὴν δόξαν τοῦ ἀνδρὸς τὴν δύναμιν, *τοῦ δὲ πτωχοῦ *τὴν πτωχείας ἐλάχιστον στήριγμα.
  language: Greek
  note: Greek from Charles XV.5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/026.yaml
  text: And the angel of God showed me that women rule forever over king and beggar alike. From a king they take away his glory, and from a strong man his strength, and from a beggar even the little support of his poverty.
translation:
  language: ru
  text: 'И ангел Божий показал мне, что женщины имеют власть над царём и господствуют над бедняком: у царя они отнимают славу, у мужчины — силу, а у бедняка — даже ту малую опору, что остаётся ему в нищете.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρατοῦσι τοῦ βασιλέως
  choice: имеют власть над царём
  rationale: Передаёт значение господства или преобладания над кем-либо; наречие «вечно» из английского консультационного текста не имеет соответствия в данном греческом источнике.
- source_word: κατακυριεύουσιν
  choice: господствуют над
  rationale: Сохраняет усиленное значение властного подчинения, не сглаживая резкости высказывания.
- source_word: τοῦ ἀνδρὸς τὴν δύναμιν
  choice: у мужчины — силу
  rationale: Ἀνήρ здесь буквально означает взрослого мужчину; перевод «сильный человек» добавлял бы характеристику, отсутствующую в греческом тексте.
- source_word: τὴν πτωχείας ἐλάχιστον στήριγμα
  choice: даже ту малую опору, что остаётся ему в нищете
  rationale: Естественно по-русски передаёт синтаксически неровкое греческое выражение о скудной опоре бедняка, не превращая ἐλάχιστον в более категоричное «последнюю».
theological_decisions:
- issue: Обобщающее утверждение о власти женщин
  choice: Сохранено как прямое утверждение персонажа в рамках древнего назидательного текста
  alternative: Смягчить до «некоторые женщины могут властвовать»
  rationale: Греческий текст употребляет определённое множественное число без смягчающего ограничения; перевод не должен исправлять или усиливать его мировоззренческое напряжение.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего назидательного повествования. Синтаксис слегка упорядочен для ясности, но резкие параллели «царь — мужчина — бедняк» и общий характер высказывания сохранены.
