  text: Πιὼν τὸν οἶνον οὐκ ᾐσχύνθην τὴν ἐντολὴν τοῦ Θεοῦ, καὶ ἔλαβον γυναῖκα Χαναναίαν. 7. Πολλὴ γὰρ τῷ πίνοντι οἶνον, τέκνα μου,
  language: Greek
  note: Greek from Charles XIV.6-7a (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/020.yaml
  text: After I had drunk wine, I did not respect the commandment of God, and I took a woman of Canaan as wife. For much discretion is needed by the man who drinks wine, my children.
translation:
  language: ru
  text: Выпив вина, я не проявил почтения к Божьей заповеди[a] и взял себе в жёны хананеянку. Ведь тому, кто пьёт вино, дети мои, нужна большая рассудительность.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение можно также понять как «я не устыдился перед Божьей заповедью»; его смысл здесь — Иуда пренебрёг должным уважением к ней.
    reason: Форма ᾐσχύνθην в сочетании с винительным падежом необычна и допускает более буквальную передачу через стыд, которая по-русски требует пояснения.
lexical_decisions:
- source_word: οὐκ ᾐσχύνθην τὴν ἐντολὴν τοῦ Θεοῦ
  choice: я не проявил почтения к Божьей заповеди
  rationale: 'Греческое выражение необычно: форма от αἰσχύνω с прямым дополнением здесь передаёт отсутствие стыда или должного уважения перед Божьей заповедью. Выбран естественный русский оборот, сохраняющий нравственный смысл без добавления конкретного содержания заповеди.'
- source_word: ἔλαβον γυναῖκα Χαναναίαν
  choice: взял себе в жёны хананеянку
  rationale: Передаёт брачное значение λαμβάνω с γυναῖκα и этническое обозначение Χαναναίαν естественным современным русским языком.
- source_word: Πολλὴ γὰρ τῷ πίνοντι οἶνον
  choice: Ведь тому, кто пьёт вино, … нужна большая рассудительность
  rationale: Предоставленный греческий отрывок обрывается после прилагательного πολλή; смысловое существительное и сказуемое восстановлены по синтаксису фразы и проверенному английскому консультационному слою. «Рассудительность» естественно выражает требуемую осмотрительность и самообладание.
theological_decisions:
- issue: Как выразить отношение Иуды к Божьей заповеди после употребления вина
  choice: «не проявил почтения к Божьей заповеди»
  alternative: «не постыдился нарушить Божью заповедь»
  rationale: Альтернатива яснее связывает фразу с нарушением, но вводит отсутствующий в греческом глагол «нарушить». Основной вариант сохраняет необычность и нравственное напряжение исходного выражения.
translation_notes:
  register: Современный литературный русский язык, ясный и сдержанно-достоинный. Обращение «дети мои» сохранено. Фраза о рассудительности оформлена естественно, хотя предоставленный греческий фрагмент обрывается посреди предложения.
