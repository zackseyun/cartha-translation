  source_fidelity: 'В целом перевод верно передаёт причинную цепочку греческого текста: опьянение, нечистые мысли, телесное распаление, совершение греха и отсутствие стыда. В отличие от английского контрольного текста, проект не добавляет отсутствующее в греческом условие о «случае» для желания. Переход исходника от τις («кто-либо») к σου («твой») в русском допустимо сглажен в третьем лице, чтобы не создавать неестественного смешения лиц.'
