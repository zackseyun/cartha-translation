  terminology: «Нечистые помыслы» и «блуд» соответствуют нравственно окрашенной лексике ῥυπαροί и πορνεία и уместны в современном литературном переводе нравоучительного текста. «Совершает грех» точно передаёт πράσσει τὴν ἁμαρτίαν.
