base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/018.yaml
  text: For if one drinks wine to drunkenness, it disturbs the mind with filthy thoughts and leads the body on to sexual union; and if the occasion of desire is present, he commits the sin and is not ashamed.
translation:
  language: ru
  text: Ибо если кто пьёт вино до опьянения, оно мутит его ум нечистыми помыслами, распаляет его тело, побуждая к блуду ради наслаждения, — и он совершает грех, не стыдясь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς μέθην
  choice: до опьянения
  rationale: Передаёт направленность и результат чрезмерного питья естественным современным русским выражением.
- source_word: ἐν διαλογισμοῖς ῥυπαροῖς
  choice: нечистыми помыслами
  rationale: Сохраняет нравственный смысл ῥυπαρός и внутренний характер διαλογισμοί; «помыслы» уместно в возвышенном нравоучительном тексте.
- source_word: συνταράσσει τὸν νοῦν σου
  choice: мутит его ум
  rationale: Передаёт сильное внутреннее смятение без тяжеловесного буквального «приводит в смятение»; местоимение согласовано с обобщённым «кто», хотя греческий текст переходит ко второму лицу.
- source_word: εἰς πορνείαν
  choice: к блуду
  rationale: πορνεία обозначает половую безнравственность шире, чем нейтральное «половое сношение»; «блуд» сохраняет нравственную оценку источника.
- source_word: ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν
  choice: распаляет его тело к блуду ради наслаждения
  rationale: Сохраняет образ разогревания/возбуждения тела и целевую направленность πρὸς ἡδονήν, не добавляя отсутствующего в греческом условия о наличии случая.
- source_word: πράσσει τὴν ἁμαρτίαν
  choice: совершает грех
  rationale: Прямой и естественный эквивалент, сохраняющий определённость проступка в контексте.
- source_word: οὐκ αἰσχύνεται
  choice: не стыдясь
  rationale: Естественно связывает заключительное действие с совершением греха и сохраняет отсутствие стыда.
theological_decisions:
- issue: Нравственная характеристика πορνεία
  choice: блуд
  alternative: половая связь
  rationale: Нейтральная формулировка ослабила бы явно отрицательную нравственную оценку греческого термина.
- issue: Причинная последовательность опьянения, помыслов, возбуждения и греха
  choice: Сохранена последовательность греческого текста без дополнительного условия
  alternative: «если представится случай удовлетворить желание»
  rationale: Условие, присутствующее в английском консультационном слое, отсутствует в данном греческом тексте и потому не внесено.
translation_notes:
  register: 'Современный литературный русский с достоинством нравоучительного завещания. Синтаксис сделан плавным и доступным; архаизмы сведены к минимуму, но слово «помыслы» сохранено как точное и общеупотребительное в нравственном контексте. Непоследовательный переход греческого текста от τις к σου устранён как вероятная текстовая/синтаксическая шероховатость: весь стих выдержан в третьем лице.'
