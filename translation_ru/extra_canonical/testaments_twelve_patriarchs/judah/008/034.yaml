  text: VIII. *Ἦσαν δέ μοι¹ κτήνη πολλά, καὶ *εἶχον ἀρχιποίμενα² Ἱρὰμ³ τὸν Ὀδολομίτην⁴. 2. Πρὸς ὃν ἐλθὼν⁵ ἤμην, καὶ ἦλθεν Βαρσαβὰ⁶ τὸν⁷ βασιλεὺς⁸ Ὀδολλὰμ⁹, καὶ¹⁰ ἐποίησεν ἡμῖν πότον¹², καὶ †παρακαλέσας¹³ δέδωκέ¹⁴ μοι τὴν θυγατέρα αὐτοῦ¹⁵ *ὀνόματι Σαβά¹⁶ εἰς γυναῖκα. 3. Αὕτη¹⁷ ἔτεκέν μοι τὸν Ἦρ¹⁸ καὶ τὸν¹⁹ Αὐνὰν καὶ τὸν²⁰ Σηλώμ²¹. *Καὶ τοὺς μὲν δύο²² ἀνεῖλεν²³ Κύριος· ὁ γὰρ Σηλὼμ ἔζησεν²⁴.
  text_scope: related_parent_record_source
  language: Greek
  note: Project verse 8:34 ('after my death you will act lawlessly and contend against Levi, and you will not be able to prevail against him, because the angel of the Lord guides him') has no direct α-counterpart in Charles VIII-XXVI. The 'contend against Levi' / 'angel guides Levi' theme is the project's homiletic bridge between the wine-warning section and the Levi/Judah priesthood-vs-kingship discourse of Charles XXI; the α-text moves directly from Judah's Canaanite-marriage shame (XIX-XX) to the 'love Levi' command at XXI.1 without the lawlessness-prediction the project English supplies. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/034.yaml
  text: For I know that after my death you will act lawlessly and contend against Levi, and you will not be able to prevail against him, because the angel of the Lord guides him and me the spirit of deceit has misled.
translation:
  language: ru
  text: Ибо я знаю, что после моей смерти вы станете поступать беззаконно и вступите в борьбу с Левием, но не сможете одолеть его, потому что его направляет ангел Господень, а меня ввёл в заблуждение дух обмана.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: У этого стиха нет прямого соответствия в греческом α-тексте издания Чарлза 1908 года. Мысль о борьбе с Левием и об ангеле, направляющем его, представляет собой проектный связующий переход к последующему рассуждению о Левии и Иуде; греческий текст переходит от рассказа о постыдном браке Иуды с хананеянкой непосредственно к повелению любить Левия (XXI.1).
    reason: 'Текстологическая прозрачность: русский основной текст не должен создавать впечатление прямого перевода отсутствующего греческого оригинала.'
lexical_decisions:
- source_word: act lawlessly
  choice: поступать беззаконно
  rationale: Передаёт нравственно-религиозный смысл беззаконного поведения естественным современным русским выражением.
- source_word: contend against Levi
  choice: вступите в борьбу с Левием
  rationale: Сохраняет широкий смысл противостояния, не сужая его до спора или вооружённой схватки.
- source_word: prevail against him
  choice: одолеть его
  rationale: Кратко и естественно передаёт невозможность взять верх над Левием.
- source_word: guides him
  choice: его направляет
  rationale: Сохраняет идею продолжающегося руководства, не усиливая её до полного управления или защиты.
- source_word: the spirit of deceit has misled
  choice: ввёл в заблуждение дух обмана
  rationale: Сохраняет персонифицированный образ духа и завершённый результат заблуждения.
theological_decisions:
- issue: Отношение ангельского водительства Левия к заблуждению Иуды
  choice: 'Сохранено прямое противопоставление: «его направляет… а меня ввёл в заблуждение…»'
  alternative: Сгладить противопоставление или объяснить его как различие священства и царской власти
  rationale: Фраза богословски напряжённа и не должна получать в переводе отсутствующее в свидетельстве конфессиональное толкование.
- issue: Текстуальный статус стиха
  choice: Текст переведён по предоставленному английскому проектному слою и снабжён явной текстологической сноской
  alternative: Представить стих как прямо засвидетельствованный греческим текстом либо исключить его без перевода
  rationale: У данного проектного стиха нет прямого соответствия в указанном греческом α-свидетельстве; это необходимо открыто обозначить.
translation_notes:
  register: Современный литературный русский язык с достойным завещательным тоном. Синтаксис ясен для обычного читателя; сохранены параллелизм и контраст исходной проектной формулировки. Архаизмы и конфессионально маркированные термины не вводились.
