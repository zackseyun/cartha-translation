source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ οἶδα ὅτι διὰ τὰ δύο ταῦτα ἔσται τὸ γένος μου *εἰς ἀπώλειαν πορνείας, καὶ καίγε σοφοὺς ἄνδρας τῶν υἱῶν μου ἀλλοιώσουσι, καὶ βασιλείαν Ἰούδα σμικρυνθῆναι ποιήσουσιν, ἣν ἔδωκέ μοι Κύριος ἐν ὑπακοῇ πατρός μου.'
  language: Greek
  note: 'Greek from Charles XVII.2 (α): the warning that the two vices (gold and beauty of women) will ruin Judah''s race. Project''s English at v33 is a parenetic exhortation that paraphrases this material together with the broader Canaanite-marriage warnings of Charles ch.XIV-XVII; closest α-anchor is XVII.2. Project ch.8 is a thematic consolidation; sourced from Charles ch.XVII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/033.yaml
  text: Therefore, if you do not walk in sobriety in truth and in the fear of God, you will perish through every evil deed and every plague, if you take wives from the daughters of Canaan and are joined to their wealth, being led astray by gifts.
translation:
  language: ru
  text: И я знаю, что из-за двух этих вещей[a] мой род будет обречён на гибель из-за распутства. Они испортят даже мудрых мужей из числа моих сыновей и приведут к умалению царства Иуды, которое Господь дал мне за послушание отцу моему.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть из-за золота и красоты женщин, упомянутых в предшествующем контексте.
    reason: Местоименная отсылка «двух этих вещей» неясна вне контекста стиха; примечание называет её референты, не внося пояснение в основной текст.
lexical_decisions:
- source_word: διὰ τὰ δύο ταῦτα
  choice: из-за этих двух вещей
  rationale: Сохраняет отсылку к двум порокам из предшествующего контекста, не подменяя её развернутым пересказом английского консультационного слоя.
- source_word: εἰς ἀπώλειαν πορνείας
  choice: придёт к гибели через распутство
  rationale: Передаёт трудную греческую конструкцию естественно по-русски, сохраняя причинную связь погибели с сексуальной распущенностью.
- source_word: ἀλλοιώσουσι
  choice: совратят
  rationale: В данном нравственном контексте глагол означает пагубно изменить, исказить или сбить с верного пути; «совратят» ясно выражает это без лишней конкретизации.
- source_word: σμικρυνθῆναι ποιήσουσιν
  choice: приведут к умалению
  rationale: 'Сохраняет каузативный смысл: названные силы станут причиной ослабления или сокращения царства.'
- source_word: ἐν ὑπακοῇ πατρός μου
  choice: за послушание моему отцу
  rationale: Контекстуально передаёт основание дара; конструкция также допускает более буквальное «в послушании моему отцу».
theological_decisions:
- issue: Основание, по которому Господь дал Иуде царство
  choice: за послушание моему отцу
  alternative: в послушании моему отцу
  rationale: Греческое ἐν может обозначать обстоятельство или основание. Основной текст выражает наиболее естественный здесь причинный смысл, не превращая послушание в отвлечённую доктрину заслуги.
- issue: Предмет пророческого предостережения
  choice: переведено прямое свидетельство греческого текста о гибели рода, совращении мудрых и умалении царства
  alternative: английское расширение о трезвости, дочерях Ханаана, богатстве и дарах
  rationale: Английский текст тематически объединяет более широкий материал, тогда как предоставленный греческий источник прямо подтверждает более краткое предсказание. Приоритет отдан исходному свидетельству.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного предостережения. Синтаксис сделан ясным для обычного читателя, но повтор причинно-следственной структуры и напряжённость пророчества сохранены.
