source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Μεθυσθεὶς οὖν οἴνῳ οὐκ ἐπέγνων αὐτὴν, καὶ ἠπάτησέ με τὸ κάλλος αὐτῆς διὰ τοῦ σχήματος τῆς κοσμήσεως.
  language: Greek
  note: Greek from Charles XII.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/006.yaml
  text: Therefore, being drunk with wine, I did not recognize her; and her beauty led my mind astray through the fashion of her adornment.
translation:
  language: ru
  text: Итак, опьянев от вина, я не узнал её, и её красота обманула меня видом её убранства.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «из-за облика её наряда». Предлог διά с родительным может обозначать средство или причину; сочетание σχῆμα τῆς κοσμήσεως допускает понимание как внешнего вида наряда либо убранства.'
    reason: Сноска сохраняет синтаксико-семантическую неоднозначность греческого оборота, не навязывая единственного понимания.
lexical_decisions:
- source_word: Μεθυσθεὶς οὖν οἴνῳ
  choice: Итак, опьянев от вина
  rationale: Причастная конструкция передана естественным русским деепричастным оборотом; οὖν сохраняет выводную связь как «итак».
- source_word: οὐκ ἐπέγνων αὐτὴν
  choice: я не узнал её
  rationale: 'Прямо сохраняет значение ἐπιγινώσκω в данном контексте: Иуда не распознал женщину.'
- source_word: ἠπάτησέ με
  choice: обманула меня
  rationale: Глагол ἀπατάω означает «обманывать, вводить в заблуждение»; субъектом в греческом тексте выступает красота, поэтому эта персонификация сохранена.
- source_word: διὰ τοῦ σχήματος τῆς κοσμήσεως
  choice: благодаря виду её убранства
  rationale: σχῆμα здесь обозначает внешний вид или облик, а κόσμησις — убранство, наряд, украшение. Формулировка сохраняет неоднозначность между одеждой и украшениями.
theological_decisions:
- issue: Степень внутреннего нравственного истолкования глагола ἠπάτησεν
  choice: «обманула меня»
  alternative: «ввела мой разум в заблуждение»
  rationale: Упоминание «разума» отсутствует в греческом тексте и усилило бы психологическое и нравственное толкование. Выбран более формально точный вариант.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис близок к греческому, но естественен по-русски; буквальная персонификация красоты сохранена.
