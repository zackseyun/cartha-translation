reference: Testament of Judah 8:14
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἡ δὲ ἀπέστειλε πρός με λέγουσα· Τοῦ ἀνθρώπου οὗτινος ταῦτά εἰσιν, ἐγὼ ἐν γαστρὶ ἔχω· ἐπίγνωθι οὖν τίνος ὁ δακτύλιος καὶ ἡ ῥάβδος καὶ τὸ διάδημα.
  language: Greek
  note: Greek from Charles XII α-replacement passage (Charles 1908 raw apparatus, p156). The α-replacement gives the order 'ring, staff, diadem' (δακτύλιος καὶ ἡ ῥάβδος καὶ τὸ διάδημα), rather than the project English's 'staff, girdle, diadem'; the girdle (ζώνη) belongs to β (XII.4) and to Judah's later interpretation in XV.3. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/014.yaml
  text: But as she was being brought out, she sent secretly to me the staff and the girdle and the diadem, saying, "By the man to whom these belong I am with child."
translation:
  language: ru
  text: 'Она же послала ко мне сказать: «Я беременна от человека, которому принадлежат эти вещи. Итак, узнай, кому принадлежат перстень, посох и диадема».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡ δὲ ἀπέστειλε πρός με λέγουσα
  choice: Она же послала ко мне сказать
  rationale: Передаёт посреднический характер сообщения без добавления отсутствующих в греческом тексте подробностей о тайной передаче или о том, что женщину выводили.
- source_word: ἐν γαστρὶ ἔχω
  choice: Я беременна от
  rationale: Естественный современный русский эквивалент идиомы «имею во чреве»; связь с отцом ребёнка ясна из родительного оборота.
- source_word: ἐπίγνωθι
  choice: узнай
  rationale: Императив означает распознать или определить по предъявленным предметам; «узнай» естественно сохраняет этот смысл.
- source_word: ὁ δακτύλιος
  choice: перстень
  rationale: Точно передаёт «кольцо», служащее опознавательным личным предметом; «перстень» уместен в повествовательном древнем контексте и остаётся понятным.
- source_word: ἡ ῥάβδος
  choice: посох
  rationale: В данном контексте личный предмет владельца; «посох» естественнее общего «жезл» и не привносит специального властного значения.
- source_word: τὸ διάδημα
  choice: диадема
  rationale: Формально и ясно сохраняет греческое обозначение головного украшения или знака достоинства, не подменяя его отсутствующим здесь поясом.
theological_decisions:
- issue: Расхождение между греческим источником и английским консультационным текстом в перечне предметов
  choice: перстень, посох и диадема
  alternative: посох, пояс и диадема
  rationale: 'Перевод следует указанному греческому α-тексту: δακτύλιος, ῥάβδος, διάδημα. «Пояс» относится к иной текстовой форме и не должен заменять «перстень» в этом стихе.'
- issue: Дополнительные повествовательные детали английского слоя
  choice: не включать «когда её выводили» и «тайно»
  alternative: включить эти детали по английскому POB
  rationale: В предоставленном греческом тексте этих элементов нет; источник говорит только, что она послала к Иуде сообщение.
translation_notes:
  register: Современный литературный русский с достоинством древнего повествования. Синтаксис слегка приподнят, но прозрачен; сохранён порядок предметов греческого источника. Местоименное «эти вещи» естественно предваряет перечисление, как в оригинале.
