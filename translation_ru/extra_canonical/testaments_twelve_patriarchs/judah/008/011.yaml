  text: Ἔπεμψα τοῦ λαβεῖν τοὺς ἀρραβῶνας. Καὶ οὐχ εὗρον αὐτήν,
  language: Greek
  note: Greek from Charles XII α-replacement passage (the abbreviated LXX-Gen 38.20-30 form that α substitutes for XII.6-10; preserved in Charles 1908 raw apparatus, p156). Project's English 'asked the people of the place' has no α counterpart and is drawn from the Genesis tradition. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/011.yaml
  text: And after this I sent the kid, but I did not find her. And I asked the people of the place, saying, "Where is the woman who sat at Enaim by the road?"
translation:
  language: ru
  text: Я послал за залогами, но её не нашли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «но я её не нашёл». Греческая форма εὗρον допускает оба прочтения.'
    reason: Сохраняет неоднозначность формы εὗρον (1-е лицо единственного или 3-е лицо множественного числа), не навязывая контекстуального решения.
lexical_decisions:
- source_word: Ἔπεμψα
  choice: Я послал
  rationale: Сохраняет прямое значение аориста; подразумеваемый посланник в греческом тексте не назван.
- source_word: τοῦ λαβεῖν
  choice: забрать
  rationale: Передаёт целевую конструкцию с инфинитивом естественным современным русским языком.
- source_word: τοὺς ἀρραβῶνας
  choice: залог
  rationale: Во множественном числе греческое слово обозначает отданные в обеспечение вещи; собирательное русское «залог» здесь естественнее и согласуется с контекстом Быт 38.
- source_word: οὐχ εὗρον αὐτήν
  choice: её не нашли
  rationale: Форма εὗρον допускает 1-е лицо единственного либо 3-е лицо множественного числа. После «я послал» контекстуально вероятно безлично-агентивное «её не нашли», но неоднозначность отмечена в сноске.
theological_decisions:
- issue: Расширение по традиции Бытия и английскому консультационному тексту
  choice: Не добавлять козлёнка, расспрос местных жителей и вопрос о женщине в Енаиме
  alternative: «После этого я послал козлёнка... И спросил жителей того места...»
  rationale: Эти сведения отсутствуют в предоставленном греческом тексте α-замены; перевод следует непосредственно исходному свидетельству и не гармонизирует его молча с Быт 38.
translation_notes:
  register: Современный литературный русский, краткий и повествовательный. Синтаксис сохраняет лаконичность греческого источника; отсутствующие в нём подробности английского POB не внесены.
