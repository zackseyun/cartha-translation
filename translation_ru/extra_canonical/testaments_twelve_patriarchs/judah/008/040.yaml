review_pass:
  verdict: revise
  source_fidelity: Предоставленный греческий текст относится к VIII.1–3 и не содержит данной строки. В примечании к источнику прямо указано, что проектный стих является сводным переложением мотивов XXI.1 и XXI.5, с добавлением без прямого соответствия в α-тексте. Поэтому перевод может быть верен лишь по отношению к английской проектной формулировке; это должно быть ясно отмечено в сноске.
  naturalness: '«В обоих чтите Господа всей полнотой чести» звучит по-русски тяжеловесно и синтаксически неясно: «в обоих» не имеет естественной опоры, а «всей полнотой чести» является неудачной калькой. «Держитесь близ Левия» также менее точно передаёт побудительное «draw near».'
  terminology: «Левий» и «Господь» переданы корректно. «Не превозноситесь» удачно передаёт предостережение против самовозвышения. «Воздавайте Господу полную честь» — современная литературная и торжественная передача honor in full, без добавления доктринального смысла.
  issues:
  - severity: medium
    issue: Неестественная передача выражения «honor in full the Lord in both».
    rationale: Оборот «в обоих чтите Господа всей полнотой чести» грамматически и стилистически затруднён. Перестановка и замена кальки на «воздавайте Господу полную честь» делают фразу естественнее, сохраняя намеренно нераскрытое «в обоих».
  - severity: low
    issue: «Держитесь близ Левия» ослабляет побудительный глагол приближения.
    rationale: «Приблизьтесь к Левию» непосредственно передаёт проектное draw near и соотносится с указанным προσεγγίζειν.
  - severity: medium
    issue: Сноска недостаточно прямо сообщает, что предоставленный основной греческий отрывок VIII.1–3 вообще не содержит этот стих.
    rationale: Для честности по отношению к источнику следует отделить отсутствие строки в данном отрывке от более широкого пояснения о сводном характере проектной формулировки.
  revised_text: Поэтому не превозноситесь над Левием и не восставайте против меня, но в обоих воздавайте Господу полную честь и среди людей приблизьтесь к Левию.[a]
  revised_footnotes:
  - marker: a
    text: 'Эта строка отсутствует в предоставленном греческом отрывке VIII.1–3 и является проектным сводным переложением. Она объединяет тему «не превозноситься» из XXI.1 с языком «приближаться» из XXI.5. Слова «в обоих воздавайте Господу полную честь» не имеют прямого соответствия в греческом α-тексте; значение «в обоих» намеренно не уточняется. В XXI.6 α-текст продолжается словами: «И будешь среди них, как море…».'
    reason: Сноска честно обозначает отсутствие данной строки в предоставленном греческом тексте, её составной проектный характер и добавление без прямого α-соответствия, не навязывая толкования неоднозначного «в обоих».
  revision_rationale: Исправлена стилистически неудачная калька «всей полнотой чести» на естественное «полную честь», при этом сохранено нераскрытое «в обоих». «Приблизьтесь к Левию» точнее передаёт побудительное «draw near». Сноска уточнена, чтобы явно отразить фактическое отсутствие проектного стиха в предоставленном греческом отрывке и отсутствие прямого α-соответствия для одной из его частей.
