  note: Project verse 8:40 ('be not lifted up over Levi, nor against me, but honor in full the Lord in both, and among men draw near to Levi') is a project paraphrase that consolidates the 'do not exalt yourselves' theme of Charles XXI.1 with the 'draw near' (προσεγγίζειν) language of XXI.5, plus an addition ('honor the Lord in both') with no direct α counterpart. The α-text proceeds at XXI.6 to 'Καὶ ἔσῃ ἐν αὐτοῖς ὡς ἡ θάλασσα...' rather than this exhortation. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/040.yaml
  text: Therefore be not lifted up over Levi, nor against me, but honor in full the Lord in both, and among men draw near to Levi.
translation:
  language: ru
  text: Поэтому не превозноситесь над Левием и не восставайте против меня, но в обоих чтите Господа всей полнотой чести и среди людей держитесь близ Левия.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Эта строка представляет собой проектное сводное переложение: она объединяет тему «не превозноситесь» из XXI.1 с языком «приближаться» из XXI.5. Слова «в обоих чтите Господа всей полнотой чести» не имеют прямого соответствия в греческом α-тексте; в XXI.6 тот продолжается словами: «И будешь среди них, как море…».'
    reason: Необходимо открыто обозначить, что проектная строка не засвидетельствована как единый стих в предоставленном греческом источнике и содержит добавление без прямого α-соответствия.
lexical_decisions:
- source_word: ὑψοῦσθαι / «be lifted up» (проектная формулировка, ср. XXI.1)
  choice: превозноситесь
  rationale: Естественно передаёт предостережение против самовозвышения и сохраняет нравственный смысл темы.
- source_word: προσεγγίζειν (ср. XXI.5)
  choice: держитесь близ
  rationale: Передаёт идею приближения и близости без искусственного буквального оборота «приближайтесь к Левию».
- source_word: «honor in full the Lord in both» (без прямого соответствия в α-тексте)
  choice: в обоих чтите Господа всей полнотой чести
  rationale: Сохраняет необычность и возможную смысловую неоднозначность проектного текста, не уточняя самовольно, кого обозначает «в обоих».
theological_decisions:
- issue: Отношение Иуды и Левия
  choice: Сохранено увещание не превозноситься над Левием и держаться близ него.
  alternative: Истолковать Левия как безусловно подчинённого Иуде либо Иуду как безусловно подчинённого Левию.
  rationale: Проектная формулировка подчёркивает почтение и близость, но не даёт основания вводить более определённую конфессиональную иерархию.
- issue: Фраза «чтите Господа... в обоих»
  choice: Неоднозначное «в обоих» сохранено.
  alternative: Разъяснить как «в обоих коленах», «в обоих служениях» или «через нас обоих».
  rationale: Эти уточнения были бы толкованием, а у данного выражения нет прямого соответствия в указанном α-свидетельстве.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного увещания. Синтаксис сделан ясным для обычного читателя, но необычное «в обоих» намеренно не сглажено из-за неопределённости проектной формулировки.
