  text: Καὶ νῦν, τέκνα μου, παραγγέλλω ὑμῖν, ἀγαπᾶτε τὸν Λευὶ, ἵνα διαμείνητε, καὶ μὴ ἐπαίρεσθε ἐπ᾽ αὐτὸν, ἵνα μὴ ἐξολοθρευθῆτε.
  language: Greek
  note: Greek from Charles XXI.1 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/035.yaml
  text: And now I command you to love Levi, that you may live, and do not exalt yourselves against him, lest you be utterly destroyed.
translation:
  language: ru
  text: 'И теперь, дети мои, заповедую вам: любите Левия, чтобы вы сохранились, и не превозноситесь над ним, чтобы вы не были истреблены.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγγέλλω
  choice: заповедую
  rationale: Передаёт весомое отцовское повеление и соответствует возвышенному завещательному контексту.
- source_word: ἀγαπᾶτε
  choice: любите
  rationale: Прямое и естественное соответствие повелительной форме настоящего времени.
- source_word: ἵνα διαμείνητε
  choice: чтобы вам устоять
  rationale: διαμένω означает «оставаться, пребывать, сохраняться»; «устоять» естественно выражает продолжение существования без чрезмерного уточнения смысла как просто «жить».
- source_word: μὴ ἐπαίρεσθε ἐπ᾽ αὐτόν
  choice: не превозноситесь над ним
  rationale: Сохраняет образ возвышения себя против или над Левием и предостерегающий тон оригинала.
- source_word: ἐξολοθρευθῆτε
  choice: быть истреблёнными
  rationale: Передаёт сильное значение полного уничтожения, не ослабляя угрозу.
theological_decisions:
- issue: Связь любви к Левию с сохранением потомков Иуды
  choice: Сохранена целевая формула «чтобы вам устоять» без догматического пояснения.
  alternative: «чтобы вам жить» или «чтобы вы сохранились»
  rationale: Греческое διαμένω допускает оттенки пребывания, продолжения и сохранения; перевод не должен определять, идёт ли речь исключительно о физической жизни, историческом продолжении рода или духовной стойкости.
- issue: Направленность гордого противостояния Левию
  choice: «не превозноситесь над ним»
  alternative: «не восставайте против него»
  rationale: ἐπαίρομαι прежде всего обозначает возношение или превознесение; вариант сохраняет нравственный образ гордыни, не подменяя его открытым мятежом.
translation_notes:
  register: Современный литературный русский язык с достоинством патриархального завещания. Синтаксис сохранён компактным и параллельным греческому оригиналу; архаизмы и конфессионально окрашенные добавления исключены.
