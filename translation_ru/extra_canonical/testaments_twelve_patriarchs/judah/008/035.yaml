  source_fidelity: 'Греч. διαμείνητε означает «оставаться, продолжаться, сохраняться»; «устоять» сужает его до стойкости перед испытанием и вносит не выраженный прямо образ сопротивления. «Чтобы вы сохранились» точнее сохраняет семантическую широту. Остальные ключевые соответствия переданы верно: παραγγέλλω — веское наставление/повеление, ἀγαπᾶτε — «любите», ἐπαίρεσθε ἐπ᾽ αὐτόν — горделивое возвышение над/против Левия, ἐξολοθρευθῆτε — полное истребление.'
