  text: Τὸ γὰρ πνεῦμα τῆς πορνείας τὸν οἶνον ὡς διάκονον ἔχει πρὸς τὴν ἡδονὴν τοῦ νοός. ὅτι καίγε τὰ δύο ταῦτα ἀφιστῶσι τὴν διάνοιαν τοῦ ἀνθρώπου.
  language: Greek
  note: Greek from Charles XIV.2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/017.yaml
  text: For the spirit of sexual immorality has wine as a servant to give pleasure to the mind; for these two also take away a person's understanding.
translation:
  language: ru
  text: Ибо дух распутства использует вино как слугу, чтобы доставлять уму удовольствие; ведь оба они лишают человека способности здраво мыслить.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς πορνείας
  choice: дух распутства
  rationale: Передаёт персонифицированную пагубную силу; «распутство» здесь естественнее для широкого значения πορνεία, чем более узкое «блуд».
- source_word: τὸν οἶνον ὡς διάκονον ἔχει
  choice: использует вино как слугу
  rationale: Сохраняет образ вина, состоящего на службе у духа распутства, и ясно выражает конструкцию ἔχει ... ὡς διάκονον.
- source_word: πρὸς τὴν ἡδονὴν τοῦ νοός
  choice: для услаждения ума
  rationale: Сохраняет направленность πρὸς и связь удовольствия с νοῦς; «услаждение» поддерживает возвышенный, но понятный регистр.
- source_word: ἀφιστῶσι τὴν διάνοιαν τοῦ ἀνθρώπου
  choice: лишают человека рассудительности
  rationale: Идиоматически передаёт буквальную мысль об удалении или отнятии способности разумного суждения, не сводя διάνοια лишь к фактическому знанию.
theological_decisions:
- issue: Онтологический статус «духа распутства»
  choice: Сохранена формулировка «дух распутства» без пояснения его природы.
  alternative: «склонность к распутству» или явное указание на демонического духа
  rationale: Греческий текст персонифицирует πνεῦμα, но сам по себе не разрешает, следует ли понимать его как самостоятельное духовное существо или как действующую нравственную силу.
- issue: Соотношение распутства и вина
  choice: «И то и другое» представлено как совместно лишающее рассудительности.
  alternative: Истолковать вино лишь как средство, тогда как единственным действующим началом считать дух распутства
  rationale: Множественное число ἀφιστῶσι прямо относит действие к обоим названным началам и сохраняет нравственное напряжение исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейско-назидательным звучанием. Синтаксис остаётся близким к греческому, но избегает неестественной буквальности.
