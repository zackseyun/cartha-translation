id: T12P.JUD.8.23
reference: Testament of Judah 8:23
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὁ πορνεύσας γυμνούμενος οὐκ αἰσθάνεται καὶ ἀδοξῶν οὐκ αἰσχύνεται. 2. Κἂν γάρ τις *βασιλεὺς ἐστι καὶ πορνεύῃ, γυμνοῦται τῆς βασιλείας, δουλεύσας τῇ πορνείᾳ ὡς κἀγὼ ἔπαθον.
  language: Greek
  note: Greek from Charles XV.1-2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/023.yaml
  text: One who commits sexual immorality does not know when he suffers loss, and he is not ashamed when dishonored. For even if a man is a king and commits sexual immorality, he is stripped of his kingship by becoming a servant to sexual immorality, as I myself also suffered.
translation:
  language: ru
  text: Кто предаётся разврату, не замечает, когда терпит ущерб, и не стыдится, когда его бесчестят. Ведь даже царь, если предаётся разврату, лишается царского достоинства, став рабом разврата, как и я сам это испытал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ πορνεύσας / πορνεύῃ
  choice: кто предаётся разврату / предаётся разврату
  rationale: Передаёт половую распущенность как устойчивое порабощающее поведение; современно и естественно по-русски, без неоправданного сужения до одного конкретного проступка.
- source_word: γυμνούμενος
  choice: как лишается всего
  rationale: Буквально означает «будучи обнажаем»; в данном параллелизме речь идёт о лишении положения и достоинства. Добавление «всего» естественно выражает масштаб утраты, не сводя её исключительно к одежде.
- source_word: ἀδοξῶν
  choice: подвергаясь бесчестию
  rationale: Сохраняет пассивно-состояльный смысл утраты чести и соответствует контексту последующего лишения царского достоинства.
- source_word: γυμνοῦται τῆς βασιλείας
  choice: лишается царской власти
  rationale: Передаёт образ снятия или утраты царства через естественное русское выражение; βασιλεία здесь обозначает царское положение и власть.
- source_word: δουλεύσας τῇ πορνείᾳ
  choice: становясь рабом разврата
  rationale: Сохраняет сильную метафору порабощения и дательный объект служения.
theological_decisions:
- issue: Характер последствий πορνεία
  choice: Сохранена связь разврата с утратой чести, власти и свободы
  alternative: Истолковать утрату как прямое божественное наказание
  rationale: Греческий текст описывает порабощение и лишение, но в этих предложениях не называет непосредственно действующего субъекта наказания.
- issue: Значение βασιλεία
  choice: царская власть
  alternative: царство
  rationale: В конструкции «лишиться βασιλεία» и при упоминании царя наиболее вероятно его царское достоинство или власть, а не обязательно территория либо народ.
translation_notes:
  register: Современный литературный русский язык, с достоинством и ясностью. Сохранены риторический параллелизм, образ рабства и личное признание Иуды; архаизмы и конфессионально окрашенная терминология исключены.
