revisions:
- from: Кто предаётся разврату, тот не замечает, как лишается всего, и, подвергаясь бесчестию, не стыдится. Ведь даже если человек — царь, но предаётся разврату, он лишается царской власти, становясь рабом разврата, как это случилось и со мной.
  to: Кто предаётся разврату, не замечает, когда терпит ущерб, и не стыдится, когда его бесчестят. Ведь даже царь, если предаётся разврату, лишается царского достоинства, став рабом разврата, как и я сам это испытал.
  rationale: Исправление устраняет необоснованное расширение смысла в «лишается всего», сохраняет образную неопределённость γυμνούμενος и точнее передаёт βασιλεία как царский статус. Смысловой порядок, риторический параллелизм и отсутствие названного субъекта наказания сохранены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T21:47:22Z'
review_pass:
  verdict: revise
  source_fidelity: Черновик в целом верно передаёт параллелизм, бесчестие, утрату царского статуса, образ рабства и личное признание. Однако «лишается всего» существенно расширяет γυμνούμενος («быть лишаемым, терпеть утрату; букв. быть обнажаемым») и снимает его лаконичную образную неопределённость. Его следует заменить нейтральным «терпит ущерб».
  naturalness: Текст звучит современно и литературно. Перестройка первого предложения с повтором «когда» делает связь с греческими причастными оборотами яснее и устраняет добавленный смысл.
  terminology: «Разврат» допустимо передаёт πορνεία в данном нравственном контексте и сохраняет повтор ключевого понятия. «Царское достоинство» точнее, чем «царская власть», передаёт βασιλεία как царский статус/сан, не исключая его властного аспекта. Метафора δουλεύσας сохранена как «став рабом разврата».
  issues:
  - severity: medium
    issue: Добавление «всего» в первом предложении
    rationale: Греческое γυμνούμενος не уточняет, что именно утрачивается, и не говорит «всего». Добавление усиливает высказывание сверх исходного текста.
  - severity: low
    issue: «Царская власть» несколько сужает βασιλεία
    rationale: В сочетании с βασιλεύς слово может обозначать царство, царский сан или царское достоинство; «царское достоинство» лучше сохраняет этот статусный смысл.
  revised_text: Кто предаётся разврату, не замечает, когда терпит ущерб, и не стыдится, когда его бесчестят. Ведь даже царь, если предаётся разврату, лишается царского достоинства, став рабом разврата, как и я сам это испытал.
