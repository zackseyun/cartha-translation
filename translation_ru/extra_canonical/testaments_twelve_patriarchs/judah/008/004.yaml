base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/004.yaml
  text: And after these things, while Tamar was a widow, and after two years had passed, there was reported to me that she was going up to shear sheep at Timnah. And I also went to shear my sheep.
translation:
  language: ru
  text: После этого, когда Фамарь уже два года была вдовой, она услышала, что я иду стричь овец.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χηρευούσης τῆς Θαμάρ
  choice: когда Фамарь… была вдовой
  rationale: Генитивная абсолютная конструкция передаёт обстоятельство состояния Фамари; современная придаточная конструкция звучит естественно и сохраняет смысл.
- source_word: μετὰ ἔτη δύο
  choice: уже два года
  rationale: Оборот указывает на истечение двух лет в состоянии вдовства; включение его в придаточную часть даёт ясный современный русский текст.
- source_word: ἀκούσασα
  choice: она услышала
  rationale: Причастие женского рода относится к Фамари, а не к рассказчику.
- source_word: ὅτι ἀνέρχομαι
  choice: что я иду
  rationale: Сохранено первое лицо настоящего времени греческого текста; контекстуальное движение вверх не подчёркивается без указанного здесь места назначения.
- source_word: τοῦ κεῖραι τὰ πρόβατα
  choice: стричь овец
  rationale: Инфинитив с артиклем выражает цель движения; по-русски цель естественно передаётся инфинитивом.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Перевод следует греческому источнику, где именно Фамарь услышала о намерении Иуды идти стричь овец; добавленные в английском консультационном тексте упоминания Фимны и отдельное предложение о походе Иуды отсутствуют в представленном греческом фрагменте и потому не внесены.
