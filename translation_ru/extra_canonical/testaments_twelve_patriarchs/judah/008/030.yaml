base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/030.yaml
  text: And he is hindered from offering sacrifices to God; and he does not remember blessing God; and when he hears a prophet speaking, he is offended and angered.
translation:
  language: ru
  text: Он препятствует принесению жертв Богу и не помнит, чтобы благословлять Бога. Когда пророк говорит, он не слушает и негодует на слова благочестия.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θυσίας Θεοῦ ἐμποδίζει
  choice: Он препятствует принесению жертв Богу
  rationale: Греческий глагол ἐμποδίζει имеет активное значение «препятствует, мешает», а Θυσίας — прямое дополнение во множественном числе. Сочетание передано естественно по-русски без перехода к пассивному смыслу английского консультационного текста.
- source_word: εὐλογίαν Θεοῦ
  choice: о Божьем благословении
  rationale: 'Родительный Θεοῦ естественно понимать как указание на источник или принадлежность: «благословение Бога». Возможное значение «благословение Бога человеком» сохранено в примечании.'
- source_word: οὐκ ἀκούει
  choice: не слушает
  rationale: В контексте речи пророка выражение означает не просто отсутствие слухового восприятия, а отказ внимать.
- source_word: λόγους εὐσεβείας προσοχθίζει
  choice: негодует на слова благочестия
  rationale: προσοχθίζει выражает раздражение или негодование против чего-либо; «слова благочестия» формально и естественно передаёт λόγους εὐσεβείας.
theological_decisions:
- issue: Направленность выражения εὐλογίαν Θεοῦ
  choice: Божье благословение, о котором не вспоминают
  alternative: благословение или прославление Бога человеком
  rationale: Греческий родительный допускает оба отношения. В основном тексте выбран наиболее прямой смысл, а подлинная неоднозначность отмечена сноской.
- issue: Активное или пассивное значение первой фразы
  choice: субъект препятствует принесению жертв
  alternative: субъекту мешают приносить жертвы
  rationale: Предоставленный греческий текст содержит активную форму ἐμποδίζει с винительным Θυσίας; поэтому английское пассивное прочтение не принято в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Параллелизм греческих клауз сохранён; архаизмы и конфессионально окрашенные уточнения не вводились.
