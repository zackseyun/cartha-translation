  text: '*Θυσίας Θεοῦ ἐμποδίζει, *καὶ εὐλογίαν Θεοῦ οὐ μνημονεύει. *Προφήτου λαλοῦντος οὐκ ἀκούει, καὶ λόγους εὐσεβείας προσοχθίζει.'
  language: Greek
