  text: Φυλάξασθε οὖν, τέκνα μου, ἀπὸ τῆς πορνείας *καὶ τῆς φιλαργυρίας, καὶ ἀκούσατε Ἰούδα τοῦ πατρὸς ὑμῶν.
  language: Greek
  note: Greek from Charles XVIII.2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/027.yaml
  text: Therefore keep yourselves, my children, from sexual immorality and from the love of money, and listen to Judah your father.
translation:
  language: ru
  text: Итак, дети мои, берегитесь разврата и любви к деньгам и слушайте Иуду, вашего отца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: берегитесь
  rationale: 'Передаёт повелительное значение аориста среднего залога: быть настороже и хранить себя от названных пороков.'
- source_word: πορνείας
  choice: разврата
  rationale: Широкое и естественное обозначение половой безнравственности без неоправданного сужения до одного конкретного проступка.
- source_word: φιλαργυρίας
  choice: любви к деньгам
  rationale: Прямо передаёт смысл φιλαργυρία и понятнее современному читателю, чем более книжное «сребролюбие».
- source_word: ἀκούσατε
  choice: слушайте
  rationale: Сохраняет прямой призыв внимать отцовскому наставлению.
- source_word: Ἰούδα τοῦ πατρὸς ὑμῶν
  choice: Иуду, вашего отца
  rationale: Сохраняет необычное самоименование говорящего в третьем лице и приложение из греческого текста.
theological_decisions:
- issue: Объём значения πορνεία
  choice: разврат
  alternative: блуд; сексуальная безнравственность
  rationale: Выбрано широкое нравственное понятие, не ограничивающее значение супружеской изменой или проституцией.
translation_notes:
  register: Современный литературный русский язык; отцовское обращение звучит ясно и достойно. Синтаксический параллелизм двух предостережений сохранён.
