  text: '*κοσμηθεῖσα κόσμῳ νυμφικῷ ἐκάθισεν *ἐν Ἐνὰν *τῇ πόλει *πρὸς τὴν πύλην. 2. Νόμος γὰρ ἦν τῶν Ἀμορραίων τὴν *χηρεύουσαν προκαθεσθαι ἐπὶ ἑπτὰ ἡμέρας παρὰ τὴν πύλην.'
  language: Greek
  note: Greek from Charles XII.1b-2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/005.yaml
  text: And she, having learned that I was going up, adorned herself in bridal array and sat in the city Enaim by the gate. For it was a law of the Amorites that she who was about to marry should sit for seven days by the gate in fornication.
translation:
  language: ru
  text: Украсившись свадебным нарядом, она села в городе Энане у ворот. Ведь у аморреев был закон, по которому вдова[a] должна была семь дней сидеть у ворот.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «женщина, оставшаяся без мужа». Греческий текст называет её вдовой; слов о блуде здесь нет.'
    reason: Сохраняет необычное сочетание свадебного наряда со статусом вдовы и предупреждает против неподтверждённого данным греческим чтением истолкования.
lexical_decisions:
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  choice: украсившись свадебным нарядом
  rationale: Передаёт игру однокоренных слов κοσμηθεῖσα / κόσμῳ настолько естественно, насколько позволяет русский язык, и ясно сохраняет значение νυμφικός — «свадебный, невестин».
- source_word: ἐν Ἐνὰν τῇ πόλει
  choice: в городе Энане
  rationale: Ἐνάν передано как название города; русская форма поставлена в предложный падеж.
- source_word: πρὸς τὴν πύλην / παρὰ τὴν πύλην
  choice: у ворот
  rationale: Оба оборота обозначают положение возле городских ворот; единая формулировка естественна по-русски и не вносит лишних пространственных различий.
- source_word: χηρεύουσαν
  choice: вдова
  rationale: Причастие от χηρεύω означает женщину, оставшуюся без мужа, то есть вдову; это чтение непосредственно засвидетельствовано в предоставленном греческом тексте.
- source_word: προκαθεσθαι
  choice: должна была… сидеть
  rationale: Инфинитив в конструкции закона передаёт установленное обычаем действие. Возможный оттенок сидения на виду или впереди не выражен отдельно, поскольку местоположение уже уточнено словами «у ворот».
theological_decisions:
- issue: Напряжение между свадебным нарядом и статусом вдовы
  choice: Сохранить обе детали без согласования или объясняющей вставки
  alternative: Истолковать χηρεύουσαν как женщину, готовящуюся вступить в брак, и добавить указание на блуд
  rationale: Греческий текст прямо говорит о свадебном наряде, а затем употребляет χηρεύουσαν — «вдову». Исправление этого напряжения не поддерживается данным источником и внесло бы отсутствующее в нём содержание.
translation_notes:
  register: Современный литературный русский, ясный и сдержанно-повествовательный. Синтаксис слегка торжественный, но доступный; необычная логика исходного текста не сглажена.
