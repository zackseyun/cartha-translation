id: T12P.JUD.8.22
reference: Testament of Judah 8:22
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν δὲ παρέλθῃ τὸν ὅρον, ἐμβάλλει εἰς τὸν νοῦν αὐτοῦ τὸ πνεῦμα τῆς πλάνης, καὶ ποιεῖ τὸν μέθυσον αἰσχρορρημονεῖν καὶ παρανομεῖν καὶ μὴ αἰσχύνεσθαι ἀλλὰ καυχᾶσθαι τῇ ἀτιμίᾳ καὶ νομίζειν εἶναι καλόν.
  language: Greek
  note: Greek from Charles XIV.8 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/022.yaml
  text: But if he goes beyond the limit, the spirit of deceit attacks his mind and makes the drunkard speak obscenities and transgress, and not be ashamed, but even boast in his disgrace and count it glory.
translation:
  language: ru
  text: Но если он переступит предел, дух заблуждения вторгается в его разум и заставляет пьяного говорить непристойности, нарушать закон и не стыдиться, а хвалиться своим бесчестием и считать его чем-то хорошим.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέλθῃ τὸν ὅρον
  choice: переступит предел
  rationale: Передаёт образ перехода установленной границы и естественно звучит в контексте чрезмерного употребления вина.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: дух заблуждения
  rationale: Сохраняет личностно-духовную формулировку оригинала; «заблуждение» охватывает как обман, так и введение в ошибку.
- source_word: ἐμβάλλει εἰς τὸν νοῦν αὐτοῦ
  choice: вторгается в его разум
  rationale: Передаёт резкое воздействие, выраженное ἐμβάλλει εἰς, не уточняя сверх текста точный способ действия духа.
- source_word: αἰσχρορρημονεῖν
  choice: говорить непристойности
  rationale: Ясно передаёт постыдную или непристойную речь без неоправданного сужения только до брани.
- source_word: παρανομεῖν
  choice: нарушать закон
  rationale: Сохраняет связь слова с действием вопреки закону или установленной норме.
- source_word: τῇ ἀτιμίᾳ
  choice: своим бесчестием
  rationale: Передаёт состояние позора и утраты чести, которым пьяный начинает хвалиться.
- source_word: νομίζειν εἶναι καλόν
  choice: считать его чем-то хорошим
  rationale: Следует греческому καλόν («хорошее», «прекрасное»), не заменяя его словом «слава», как в английском консультационном тексте.
theological_decisions:
- issue: Характер действия «духа заблуждения» на разум человека
  choice: 'Сохранить дух как действующий субъект: «дух заблуждения вторгается в его разум»'
  alternative: «ему приходят заблуждения» или «дух заблуждения овладевает им»
  rationale: Первый вариант ослабил бы личностную грамматику греческого текста, а второй утверждал бы полное обладание человеком, чего оригинал прямо не говорит.
- issue: Нравственная оценка бесчестия в последней фразе
  choice: «считать его чем-то хорошим»
  alternative: «считать его славой»
  rationale: 'Так сохраняется парадокс оригинала: человек принимает постыдное за хорошее; богословская и нравственная напряжённость не сглаживается.'
translation_notes:
  register: 'Современный литературный русский язык с dignified, но доступной формулировкой. Синтаксис сохраняет последовательное нравственное падение: превышение меры, воздействие на разум, непристойная речь, беззаконие, утрата стыда и переоценка бесчестия как добра.'
