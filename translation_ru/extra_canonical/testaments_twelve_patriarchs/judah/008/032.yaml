revisions:
- from: Дети мои, любовь к деньгам ведёт к идолопоклонству, потому что, обольстившись деньгами, люди называют богами тех, кто не является богами; а того, кем она овладела, она доводит до исступления.[a]
  to: Дети мои, любовь к деньгам ведёт к идолопоклонству, ибо люди, введённые деньгами в заблуждение, называют богами то, что богами не является; и тот, кто питает эту любовь, впадает в исступление.[a]
  rationale: Исправления уточняют референт ложных «богов», точнее воспроизводят образ заблуждения, связанного с деньгами, и делают заключительный параллелизм естественнее по-русски. Тематические добавления английской проектной консолидации о вине, сексуальной безнравственности и законе Божьем не включены, поскольку их нет в данном греческом тексте.
