review_pass:
  verdict: revise
  source_fidelity: 'Первая часть точно передаёт φιλαργυρία и её связь с идолопоклонством. Однако «обольстившись деньгами» несколько смещает ἐν πλάνῃ ἀργυρίου: в греческом это скорее пребывание в обмане/заблуждении, связанном с деньгами, а не непременно завершённое действие. «Тех, кто не является богами» грамматически применимо преимущественно к лицам, тогда как τοὺς μὴ ὄντας θεούς может охватывать и идолов либо иные предметы ложного почитания. Финальное «доводит до исступления» передаёт ἔκστασις удачно.'
  naturalness: Текст в целом литературен и понятен. Замена личного «тех, кто» на «то, что» естественнее в русском при неопределённости референта. «И тот, кто питает эту любовь, впадает в исступление» яснее выражает субъект ἐμπεσεῖν, чем повтор «того, кем она овладела, она».
  terminology: «Любовь к деньгам» — точный современный эквивалент φιλαργυρία; «идолопоклонство» — точный эквивалент εἰδωλολατρία. «Исступление» обоснованно сохраняет широту ἔκστασις; примечание уместно.
  issues:
