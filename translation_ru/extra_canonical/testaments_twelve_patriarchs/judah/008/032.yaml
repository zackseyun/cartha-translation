source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τέκνα μου, ἡ φιλαργυρία πρὸς εἰδωλολατρίαν ὁδηγεῖ, ὅτι ἐν πλάνῃ ἀργυρίου τοὺς μὴ ὄντας θεοὺς ὀνομάζουσι, καὶ ποιεῖ τὸν ἔχοντα αὐτὴν εἰς ἔκστασιν ἐμπεσεῖν.
  language: Greek
  note: 'Greek from Charles XIX.1 (α): love of money leads to idolatry. The project English compresses this with a ''wine to immorality'' summary that recapitulates ch.XIV; the wine half is implicit, the φιλαργυρία/εἰδωλολατρία half is α XIX.1. Project ch.8 is a thematic consolidation; sourced from Charles ch.XIX.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/032.yaml
  text: My children, I have shown you that wine leads to sexual immorality, and the love of money to idolatry; and these things turn the mind away from the law of God.
translation:
  language: ru
  text: Дети мои, любовь к деньгам ведёт к идолопоклонству, ибо люди, введённые деньгами в заблуждение, называют богами то, что богами не является; и тот, кто питает эту любовь, впадает в исступление.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово, переведённое как «исступление», может означать выход из обычного состояния сознания, помрачение рассудка или утрату самообладания.
    reason: Примечание сохраняет смысловую широту ἔκστασις и не позволяет принять один русский эквивалент за однозначное толкование.
lexical_decisions:
- source_word: φιλαργυρία
  choice: любовь к деньгам
  rationale: Передаёт буквальное значение слова и звучит естественно в современном русском языке; более традиционное «сребролюбие» менее понятно широкому читателю.
- source_word: πρὸς εἰδωλολατρίαν ὁδηγεῖ
  choice: ведёт к идолопоклонству
  rationale: Прямо сохраняет образ пути и причинную направленность греческого выражения.
- source_word: ἐν πλάνῃ ἀργυρίου
  choice: обольстившись деньгами
  rationale: Передаёт πλάνη как введение в заблуждение или обольщение, а ἀργύριον — в контексте φιλαργυρία — как деньги, а не буквально серебро.
- source_word: τοὺς μὴ ὄντας θεοὺς
  choice: тех, кто не является богами
  rationale: Сохраняет подчёркнутое отрицание подлинной божественности названных богами существ или предметов.
- source_word: εἰς ἔκστασιν ἐμπεσεῖν
  choice: доводит до исступления
  rationale: Сохраняет сильное значение выхода из нормального состояния рассудка, не сужая его до одного конкретного психологического или религиозного смысла.
theological_decisions:
- issue: Расширение английского проектного текста упоминанием вина, сексуальной распущенности и закона Божьего
  choice: Переведено только засвидетельствованное в данном греческом источнике высказывание о любви к деньгам и идолопоклонстве
  alternative: 'Включить английскую тематическую консолидацию: «вино ведёт к сексуальной распущенности… эти вещи отвращают разум от закона Божьего»'
  rationale: Указанные элементы отсутствуют в приведённом греческом тексте XIX.1 и представляют собой тематическое обобщение других мест. Перевод с оригинала не должен выдавать имплицитную или редакторскую связь за текст данного стиха.
- issue: Смысл ἔκστασις
  choice: Сохранён широкий и напряжённый образ «исступления»
  alternative: Истолковать как «отвращает разум от закона Божьего», «сводит с ума» или «лишает самообладания»
  rationale: Греческое слово допускает оттенки выхода из себя, помрачения или смещения обычного состояния сознания; источник не уточняет, какой именно оттенок подразумевается.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Обращение «Дети мои» естественно и соответствует Τέκνα μου. Синтаксис сохраняет причинную связь и параллелизм оригинала, избегая архаизмов и отсутствующих в греческом тексте тематических добавлений.
