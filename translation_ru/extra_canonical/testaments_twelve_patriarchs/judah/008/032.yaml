    issue: «Тех, кто не является богами» чрезмерно персонализирует референт.
    rationale: Греческое τοὺς μὴ ὄντας θεούς не требует, чтобы речь шла о людях; в контексте идолопоклонства естественно сохранить возможность предметов или образов.
  - severity: low
    issue: «Обольстившись деньгами» делает конструкцию более событийной, чем исходное выражение.
    rationale: ἐν πλάνῃ ἀργυρίου буквально указывает на обман/заблуждение, связанное с деньгами. «Введённые деньгами в заблуждение» передаёт это прозрачнее.
  - severity: low
    issue: Заключительная русская конструкция повторяет местоимение и представляет любовь как активно овладевающую человеком.
    rationale: 'В оригинале субъектом глагола является φιλαργυρία, но объект определён нейтрально: «тот, кто имеет её». Более прямой русский синтаксис сохранит эту связь без лишнего оттенка одержимости.'
