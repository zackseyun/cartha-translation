source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Στερίσκει τὴν ψυχὴν αὐτοῦ ἀπὸ πάσης ἀγαθότητος, καὶ συνέχει αὐτὸν ἐν πόνοις καὶ μόχθοις, *τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ, καὶ καταδαπανᾷ τὰς σάρκας αὐτοῦ.
  language: Greek
  note: Greek from Charles XVIII.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/029.yaml
  text: They deprive his soul of every goodness and oppress him with toils and troubles, and drive sleep away from him and devour his flesh.
translation:
  language: ru
  text: Оно лишает его душу всякого блага, держит его в муках и трудах, прогоняет от него сон и изнуряет его плоть.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Στερίσκει
  choice: лишает
  rationale: Передаёт значение отнятия или лишения; форма единственного числа сохранена, поскольку греческое сказуемое указывает на единственный подразумеваемый субъект.
- source_word: πάσης ἀγαθότητος
  choice: всякого добра
  rationale: Естественное современное выражение, охватывающее нравственное благо и благополучие без искусственного сужения смысла.
- source_word: συνέχει
  choice: держит
  rationale: Сохраняет образ удерживания человека в состоянии трудов и тягот; «угнетает» было бы более интерпретирующим.
- source_word: πόνοις καὶ μόχθοις
  choice: в трудах и тяготах
  rationale: 'Передаёт близкие, но не тождественные понятия: мучительные усилия и изнурительные невзгоды.'
- source_word: τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ
  choice: прогоняет от него сон
  rationale: Идиоматично выражает удаление сна, соответствуя контексту бессонного изнурения.
- source_word: καταδαπανᾷ τὰς σάρκας αὐτοῦ
  choice: изнуряет его плоть
  rationale: Глагол обозначает полное истощение или израсходование; «плоть» сохраняет телесную образность множественного греческого τὰς σάρκας.
theological_decisions:
- issue: Число и референция подразумеваемого субъекта
  choice: 'Единственное число среднего рода: «оно»'
  alternative: 'Множественное число: «они»'
  rationale: Все греческие глаголы стоят в третьем лице единственного числа. Поскольку предоставленный отрывок не называет субъект, нейтральное «оно» сохраняет грамматику и не вводит конкретного деятеля; референция должна определяться предшествующим контекстом тематической консолидации.
translation_notes:
  register: Современный литературный русский с достоинством и ясностью; параллелизм греческой фразы сохранён. Архаизмы и конфессионально нагруженные уточнения не добавлены.
