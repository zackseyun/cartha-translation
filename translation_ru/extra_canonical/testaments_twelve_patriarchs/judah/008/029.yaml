    rationale: «Тяготы» может передавать μόχθοι, но πόνοι прежде всего обозначает боль, мучение или страдание. Перевод «в муках и трудах» точнее отражает оба близких, но различимых слова.
  - severity: low
    issue: «Всякого добра» менее естественно, чем «всякого блага»
    rationale: ἀγαθότης охватывает благо/доброту; в конструкции с «лишать душу» «благо» звучит литературнее и лучше сохраняет широкий смысл, не сужая его до отдельных добрых вещей.
  revised_text: Оно лишает его душу всякого блага, держит его в муках и трудах, прогоняет от него сон и изнуряет его плоть.
