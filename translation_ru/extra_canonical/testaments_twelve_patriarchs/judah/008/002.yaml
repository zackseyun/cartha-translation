base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/002.yaml
  text: She bore me Er and Onan and Shelah. And the Lord killed the first two, for Er was wicked; and Onan, when he had married Tamar, spilled the seed upon the ground, according to the commandment of his mother, and he also died through wickedness.
translation:
  language: ru
  text: Она родила мне Ира, Онана и Шелу. А первых двух Господь умертвил, Шела же остался жив.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В расширенном чтении после слов о первых двух сыновьях поясняется: «Ир был нечестив; а Онан, женившись на Фамари, излил семя на землю по велению своей матери и также умер из-за нечестия». Этих слов нет в приведённом греческом тексте.'
    reason: Английский POB содержит значительное расширение, отсутствующее в предоставленном греческом источнике; примечание открыто фиксирует текстовое различие, не смешивая чтения.
lexical_decisions:
- source_word: Αὕτη
  choice: Она
  rationale: Указательное местоимение относится к ранее названной женщине; в современном русском простое «она» звучит естественнее, не устраняя референцию.
- source_word: ἔτεκέν μοι
  choice: родила мне
  rationale: Сохраняет прямую конструкцию греческого текста и патриархальный способ выражения происхождения сыновей.
- source_word: Ἦρ, Αὐνὰν, Σηλώμ
  choice: Ир, Онан, Шела
  rationale: Использованы привычные русские библейские формы имён; Σηλώμ здесь соответствует библейскому Шеле.
- source_word: τοὺς μὲν δύο
  choice: первых двух
  rationale: Греческое выражение буквально означает «двух» и в перечне из трёх естественно указывает на первых двух сыновей.
- source_word: ἀνεῖλεν
  choice: умертвил
  rationale: Передаёт активное действие со стороны Господа, сохраняя торжественный повествовательный регистр без излишней разговорности.
- source_word: ἔζησεν
  choice: остался жив
  rationale: В данном противопоставлении смерти двух братьев глагол означает, что Шела жил или выжил; выбран естественный русский эквивалент.
theological_decisions:
- issue: Причина смерти Ира и Онана
  choice: Не добавлять объяснений, отсутствующих в предоставленном греческом тексте
  alternative: Включить расширенное повествование английского POB о нечестии Ира и поступке Онана
  rationale: Предоставленный греческий источник сообщает лишь, что Господь умертвил двух сыновей, и противопоставляет им оставшегося в живых Шелу. Расширение английского консультационного текста не подтверждено процитированным греческим чтением и потому вынесено в примечание как иной вариант.
- issue: Божественное действие в смерти двух сыновей
  choice: «Господь умертвил»
  alternative: «они умерли по воле Господа»
  rationale: Активная форма греческого ἀνεῖλεν прямо называет Господа действующим лицом; её не следует смягчать или богословски переосмысливать.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Синтаксис краткий и ясный; сохранены прямое приписывание действия Господу и лаконичность греческого чтения.
