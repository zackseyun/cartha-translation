base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/007.yaml
  text: And I turned aside to her and said, "Let me go in to you." And she said, "What will you give me, that you may come in to me?"
translation:
  language: ru
  text: 'И, свернув к ней, я сказал: «Я войду к тебе». Она спросила: «Что ты мне дашь?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλίνας πρὸς αὐτήν
  choice: свернув к ней
  rationale: Передаёт направленное отклонение от пути к женщине, сохраняя конкретность греческого оборота.
- source_word: Εἰσέρχομαι πρὸς σε
  choice: Я войду к тебе
  rationale: Формально сохраняет настоящее время и эвфемистическую двусмысленность библейского выражения о вступлении в половую связь, не делая перевод искусственно откровенным.
- source_word: Τί μοι δώσεις;
  choice: Что ты мне дашь?
  rationale: Прямо воспроизводит краткий вопрос греческого текста без добавленной в английском консультационном слое цели «чтобы ты мог войти ко мне».
