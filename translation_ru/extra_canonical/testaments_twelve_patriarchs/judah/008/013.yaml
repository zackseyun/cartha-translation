  source_fidelity: 'Русский текст точно следует предоставленному греческому тексту α-замены: «через несколько дней» передаёт μεθ’ ἡμέρας τινάς без внесения варианта «через три месяца»; обвинение в πορνεία и сообщение о беременности переданы без добавлений. Приказ «Выведите её, и пусть её сожгут» сохраняет повелительную конструкцию Ἐξαγάγετε αὐτὴν и пассивный приказ καυθήτω. Добавленная в английском POB нравственная характеристика говорящего в греческом тексте отсутствует и обоснованно не включена.'
