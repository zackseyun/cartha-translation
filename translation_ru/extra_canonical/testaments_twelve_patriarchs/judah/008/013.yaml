source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: καὶ μεθ’ ἡμέρας τινὰς ἠκούσθη ὅτι Θαμὰρ ἐκπεπόρνευκε καὶ ἐν γαστρὶ ἔχει. Ἀκούσας δὲ ἐγὼ εἶπον· Ἐξαγάγετε αὐτὴν καὶ καυθήτω.
  language: Greek
  note: 'Greek from Charles XII α-replacement passage (Charles 1908 raw apparatus, p156): α omits XII.6-10 of β and substitutes an abbreviated LXX form of Gen 38.20, 24-30. The ''three months'' detail is from the Genesis tradition; α has ''μεθ'' ἡμέρας τινὰς'' (''after some days''). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/013.yaml
  text: And after three months it was reported to me, "Tamar your daughter-in-law has played the prostitute, and behold, she is with child." And I, being without understanding in the arrogance of my anger, said, "Bring her out, and let her be burned."
translation:
  language: ru
  text: 'И через несколько дней стало известно, что Фамарь предалась блуду и беременна. Услышав об этом, я сказал: «Выведите её, и пусть её сожгут».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας τινὰς
  choice: через несколько дней
  rationale: Следует непосредственно греческому тексту α-версии и не вводит отсутствующее здесь указание «через три месяца» из традиции Бытия.
- source_word: ἐκπεπόρνευκε
  choice: предалась блуду
  rationale: Передаёт обвинительный смысл глагола πορνεύω в естественном и достойном русском регистре, не добавляя отсутствующего в греческом обращения «твоя невестка».
- source_word: ἐν γαστρὶ ἔχει
  choice: беременна
  rationale: Современный естественный эквивалент буквального выражения «имеет во чреве».
- source_word: Ἀκούσας δὲ ἐγὼ εἶπον
  choice: Услышав об этом, я сказал
  rationale: Сохраняет повествование от первого лица и причинно-временную связь без добавленного в английском слое самоосуждающего пояснения.
- source_word: Ἐξαγάγετε αὐτὴν καὶ καυθήτω
  choice: Выведите её, и пусть её сожгут
  rationale: Точно сохраняет повеление и пассивную форму смертного приговора.
theological_decisions:
- issue: Добавление нравственной оценки говорящего
  choice: Не включать фразу «в неразумии и надменности моего гнева»
  alternative: Добавить её по английскому POB
  rationale: Такой характеристики нет в предоставленном греческом источнике; её добавление разрешило бы нравственное напряжение посредством внесённого толкования.
- issue: Срок до сообщения о беременности
  choice: «через несколько дней»
  alternative: «через три месяца»
  rationale: Перевод следует конкретной α-замене в издании Charles 1908; вариант «три месяца» принадлежит традиции Бытия и английскому консультационному слою, но отсутствует в данном греческом тексте.
translation_notes:
  register: Современный литературный русский язык; повествование краткое и строгое, с сохранением резкости судебного приказа. Имена переданы в привычной библейской форме «Фамарь».
