base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/003.yaml
  text: And Shelah lived, and I did not give Tamar to him as wife. For I said, "Lest he also die like his brothers." For I did not know that the Lord was judging me because of the things I had done at Timnah to my father Jacob and to Joseph.
translation:
  language: ru
  text: Я хотел также отдать ей Шелу, но его мать не позволила. Ведь она поступила дурно, потому что та не была из дочерей хананеев, как и она сама.[а]
  philosophy: optimal-equivalence
  footnotes:
  - marker: а
    text: 'В греческом тексте местоимения в конце стиха неоднозначны. Перевод передаёт наиболее естественное по контексту различение: «та» — женщина, которой предполагалось отдать Шелу (Фамарь), а «она сама» — его мать. Отрицание относится к обеим: обе не были «из дочерей хананеев».'
    reason: Примечание сохраняет отмечаемую греческим текстом неопределённость референтов и предотвращает ошибочное понимание, будто одна из женщин была хананеянкой.
lexical_decisions:
- source_word: Ἤθελον
  choice: Я хотел
  rationale: Имперфект передаёт сохранявшееся намерение Иуды; современное «хотел» естественно выражает его без добавления неуказанных мотивов.
- source_word: δοῦναι αὐτῇ
  choice: отдать ей
  rationale: Сохранена формулировка греческого текста; брачный контекст понятен из повествования, поэтому слово «в жёны» не добавлено.
- source_word: Ἐπονηρεύσατο
  choice: Она поступила коварно
  rationale: Глагол обозначает злонамеренное, дурное действие. «Поступила коварно» передаёт нравственную оценку и намеренность, не перегружая фразу архаизмами.
- source_word: τῶν θυγατέρων τῶν Χαναναίων
  choice: из дочерей ханаанских
  rationale: Сохранён библейский образ принадлежности к народу; формулировка литературна и понятна современному читателю.
theological_decisions:
- issue: Расхождение греческого источника с английским консультационным текстом
  choice: 'Следовать представленному греческому тексту: мать Шелы препятствует браку из-за происхождения Фамари'
  alternative: 'Следовать английскому POB: Иуда сам не отдаёт Фамарь Шеле из страха за его жизнь и говорит о Божьем суде'
  rationale: Английский текст содержит иной повествовательный материал, отсутствующий в данном греческом стихе. Согласно принципу перевода, первичны свидетельства исходного языка.
- issue: Определение референтов местоимений
  choice: Назвать Фамарь и пояснить сопоставление с матерью Шелы
  alternative: Сохранить два неоднозначных местоимения «она»
  rationale: Греческий синтаксис связывает первую женщину с той, кому предполагалось отдать Шелу, а αὐτή — с его матерью. Явное именование по контексту устраняет неестественную русскую двусмысленность, не меняя содержания.
translation_notes:
  register: Современный литературный русский с умеренно библейской окраской. Синтаксис краткий и повествовательный; устранена лишь местоименная неясность, неизбежная в русском без явного называния Фамари.
