    rationale: В черновике сказано, что Фамарь «в отличие от неё самой, не была» хананеянкой. В греческом οὐκ ... ὡς καὶ αὐτή связывает обеих женщин как не принадлежащих к «дочерям хананеев»; контраст отсутствует.
  - severity: medium
    issue: Местоименные референты представлены как бесспорные.
    rationale: Греческие αὐτῇ / αὐτοῦ / αὐτή допускают контекстуальное соотнесение, но заключительная цепочка местоимений синтаксически и традиционно трудна. Примечание должно отметить эту неоднозначность, а основной текст не должен вводить невыраженный контраст.
  - severity: low
    issue: «Поступила коварно» чрезмерно конкретизирует оценочный глагол.
    rationale: Ἐπονηρεύσατο обозначает дурной/злой поступок; «поступила дурно» точнее и не предполагает определённый способ действия.
