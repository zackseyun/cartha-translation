review_pass:
  verdict: revise
  source_fidelity: 'Черновик верно следует греческому тексту, а не расходящемуся с ним английскому POB. Однако заключительное сопоставление передано вопреки отрицанию в греческом: ὡς καὶ αὐτή означает, что вторая женщина также «не была из дочерей хананеев», а не что Фамарь отличалась от неё этим происхождением. Референция местоимений в греческом тексте не вполне прозрачна и не должна догматически устраняться без примечания.'
  naturalness: «Я хотел также отдать ей Шелу» и «но его мать не позволила» естественны для современного литературного русского. «Поступила дурно» передаёт отрицательную оценку Ἐπονηρεύσατο без не подтверждаемого текстом оттенка расчётливого коварства.
  terminology: '«Шела», «Фамарь» и «дочери хананеев» соответствуют обычной русской библейской передаче имён и этнонима. Явное «Фамарь, в отличие от неё самой» следует убрать: оно не только снимает местоименную неоднозначность, но и меняет смысл отрицательной конструкции оригинала.'
  issues:
