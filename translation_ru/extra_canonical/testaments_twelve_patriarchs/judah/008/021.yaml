base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/021.yaml
  text: 'And this is the discretion in drinking wine: if a man drinks wine and keeps modesty, and if he does not go astray into shamelessness, he may drink wine.'
translation:
  language: ru
  text: 'И вот в чём благоразумие при употреблении вина: пока человек сохраняет чувство стыда, пусть пьёт.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «И вот благоразумие винопития: пока имеет чувство стыда, пьёт». В греческом подлежащее не названо; по смыслу речь идёт о человеке, который пьёт вино. Настоящее время «пьёт» передано нормативно: «пусть пьёт».'
    reason: Поясняет эллиптическую конструкцию оригинала и отмечает, что нормативное «пусть пьёт» является контекстуальной передачей формы «пьёт».
lexical_decisions:
- source_word: σύνεσις
  choice: благоразумие
  rationale: Передаёт практическую рассудительность и самообладание в данном нравственном наставлении.
- source_word: οἰνοποσίας
  choice: при употреблении вина
  rationale: Естественная современная передача существительного со значением питья вина, без добавления идеи пьянства.
- source_word: αἰδῶ
  choice: стыдливость
  rationale: Сохраняет нравственный смысл αἰδώς — чувство стыда, сдержанность и соблюдение приличий — не сводя его только к внешней благопристойности.
- source_word: ἕως ὅτε
  choice: пока
  rationale: Отражает временно-условную границу дозволения в греческом тексте.
- source_word: πίνει
  choice: пусть пьёт
  rationale: В контексте сентенции настоящее изъявительное допускает нормативное прочтение; русская форма ясно выражает дозволение, подразумеваемое фразой.
theological_decisions:
- issue: Допустимость употребления вина
  choice: 'Сохранено условное дозволение: «пока человек сохраняет стыдливость, пусть пьёт»'
  alternative: Расширить запретом уклоняться в бесстыдство, как в английском консультационном тексте
  rationale: Греческий источник краток и прямо связывает питьё с сохранением αἰδώς; не следует вводить отсутствующую в данной строке дополнительную формулировку.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным и достойным звучанием. Формулировка следует сохранившемуся греческому тексту, а не расширению английского консультационного слоя.
