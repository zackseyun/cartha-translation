  text: '*Δυσὶ γὰρ πάθεσιν ἐναντίοις δουλεύει, *καὶ Θεῷ ὑπακοῦσαι οὐ δύναται, ὅτι ἐτύφλωσε τὴν ψυχὴν αὐτοῦ καὶ ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται.'
  language: Greek
  note: Greek from Charles XVIII.6 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/031.yaml
  text: For he is enslaved to two contrary passions and cannot obey God, because they have blinded his soul and he walks in the day as in the night.
translation:
  language: ru
  text: Ибо он порабощён двумя противоположными страстями и не может повиноваться Богу, потому что ослепил свою душу и ходит днём, как ночью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δυσὶ ... πάθεσιν ἐναντίοις δουλεύει
  choice: служит двум противоположным страстям
  rationale: Сохраняет образ рабского подчинения, выраженный глаголом δουλεύει, и смысл внутренне противоборствующих πάθη.
- source_word: Θεῷ ὑπακοῦσαι
  choice: повиноваться Богу
  rationale: Точно передаёт значение ὑπακούω — слушаться и подчиняться — в естественном для современного русского библейском регистре.
- source_word: ἐτύφλωσε τὴν ψυχὴν αὐτοῦ
  choice: ослепил свою душу
  rationale: Форма ἐτύφλωσε — единственное число, поэтому сохранено чтение «он ослепил», засвидетельствованное данным греческим текстом, а не множественное «они ослепили» из английского консультационного слоя.
- source_word: ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται
  choice: среди дня ходит, словно ночью
  rationale: Передаёт контраст дня и ночи и метафорическое πορεύεται естественной, но близкой к форме оригинала русской фразой.
theological_decisions:
- issue: Кто ослепляет душу
  choice: 'Сам человек: «ослепил свою душу»'
  alternative: 'Страсти: «они ослепили его душу»'
  rationale: В представленном греческом источнике ἐτύφλωσε стоит в 3-м лице единственного числа и соотносится с подразумеваемым субъектом предыдущих глаголов. Это сохраняет напряжение между порабощённостью страстям и личной ответственностью человека.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего наставительного текста. Синтаксис достаточно близок к греческому, но не тяжеловесен; образность рабства, слепоты, дня и ночи сохранена.
