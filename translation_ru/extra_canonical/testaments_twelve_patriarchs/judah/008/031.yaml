  source_fidelity: 'Греческий текст передан в целом верно: сохраняются две противоположные страсти, неспособность повиноваться Богу, личный субъект ἐτύφλωσε («он ослепил») и образ хождения днём как ночью. Однако «служит» несколько ослабляет рабскую семантику δουλεύει; более точное «порабощён» также согласуется с английским audit trail («is enslaved»).'
