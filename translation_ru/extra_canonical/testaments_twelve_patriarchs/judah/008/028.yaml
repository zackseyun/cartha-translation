source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὅτι ταῦτα ἀφιστᾷ τοῦ νόμου τοῦ θεοῦ, καὶ τυφλοῖ τὸ διαβούλιον τῆς ψυχῆς, καὶ ὑπερηφανίαν ἐκδιδάσκει, καὶ οὐκ ἀφίει ἄνδρα ἐλεῆσαι τὸν πλησίον αὐτοῦ.
  language: Greek
  note: Greek from Charles XVIII.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/028.yaml
  text: For these things draw a person away from the law of God and blind the inclination of the soul, and teach arrogance, and do not allow one to have compassion on his neighbor.
translation:
  language: ru
  text: Ведь всё это уводит человека от закона Божьего, ослепляет рассудительность души, приучает к высокомерию и не позволяет человеку проявлять милосердие к ближнему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: всё это
  rationale: Передаёт собирательное указание на перечисленные ранее пороки или явления, не уточняя их сверх греческого текста.
- source_word: ἀφιστᾷ
  choice: уводит
  rationale: Естественно передаёт причиняемое удаление или отчуждение от закона без излишне буквального «отставляет».
- source_word: τὸ διαβούλιον τῆς ψυχῆς
  choice: помышление души
  rationale: Сохраняет внутренний, рассудительно-волевой смысл διαβούλιον и не сводит неоднозначное выражение только к «намерению» или «способности рассуждать».
- source_word: ὑπερηφανίαν ἐκδιδάσκει
  choice: приучает к высокомерию
  rationale: Передаёт усиленное значение ἐκδιδάσκω как обучения или приучения; «высокомерие» — современный и точный эквивалент ὑπερηφανία.
- source_word: ἐλεῆσαι
  choice: проявлять милосердие
  rationale: Передаёт деятельное сострадание, выраженное глаголом, в естественной русской форме.
- source_word: τὸν πλησίον αὐτοῦ
  choice: к ближнему
  rationale: Сохраняет традиционно-библейский и понятный эквивалент без добавления отсутствующего в оригинале ограничения.
theological_decisions:
- issue: Характер действия перечисленных явлений на человека
  choice: «уводит… ослепляет… приучает… не позволяет»
  alternative: Ослабить причинность формулировками «может увести» или «мешает»
  rationale: Греческие глаголы выражают прямое действие; модальное смягчение отсутствует и изменило бы нравственно-богословскую силу высказывания.
- issue: Значение «души» в выражении τῆς ψυχῆς
  choice: Сохранить «души»
  alternative: Передать как «внутреннего человека» или опустить
  rationale: Сохранение ψυχή удерживает антропологический язык источника и не навязывает более узкое толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сохранён как единая причинно-следственная фраза; родовое ἄνδρα естественно передано словом «человека» и далее местоимением «ему».
