  text: Καίγε *μετανοήσας ἐπὶ τούτοις, οἶνον καὶ κρέα οὐκ ἔφαγον ἕως γήρους μου, καὶ *πᾶσαν εὐφροσύνην οὐκ εἶδον.
  language: Greek
  note: Greek from Charles XV.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/025.yaml
  text: And indeed I repented of these things; and wine and meat I did not consume until old age, and I saw no joy.
translation:
  language: ru
  text: И действительно, раскаявшись в этом, я до старости не пил вина и не ел мяса и не видел никакой радости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: И
  rationale: Частица усиливает и связывает высказывание с предыдущим контекстом; в естественном русском повествовании это передано союзом «и» без тяжеловесного «воистину».
- source_word: μετανοήσας ἐπὶ τούτοις
  choice: раскаявшись в этом
  rationale: Сохраняет обстоятельственное значение аористного причастия и направленность раскаяния на ранее названные поступки.
- source_word: οἶνον καὶ κρέα οὐκ ἔφαγον
  choice: не пил вина, не ел мяса
  rationale: Греческий глагол ἐσθίω употреблён при вине и мясе в общем смысле потребления; по-русски естественно разделить его на «пил» и «ел».
- source_word: ἕως γήρους μου
  choice: до самой старости
  rationale: Передаёт временной предел и личную отнесённость выражения; «самой» естественно подчёркивает длительность воздержания.
- source_word: πᾶσαν εὐφροσύνην οὐκ εἶδον
  choice: не знал никаких радостей
  rationale: Русское «не знал радостей» естественно передаёт семитизированную идиому «не видел радости», а πᾶσαν под отрицанием — полное отсутствие радостей.
theological_decisions:
- issue: Характер покаянного воздержания
  choice: Оставить как личное повествование Иуды без оценки и обобщения
  alternative: Представить отказ от вина, мяса и радостей как обязательную покаянную практику
  rationale: Греческий текст сообщает о действиях говорящего, но не формулирует всеобщего религиозного предписания.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Параллельные отрицательные конструкции делают перечисление ясным и ритмичным; архаизмы и конфессионально окрашенные добавления исключены.
