  text: Δέδωκα γὰρ τὴν ῥάβδον μου, τουτέστι τὸ στήριγμα τῆς ἐμῆς φυλῆς, καὶ τὴν ζώνην μου, τουτέστιν τὴν δύναμιν, καὶ τὸ διάδημα, τουτέστιν τὴν δόξαν τῆς βασιλείας μου.
  language: Greek
  note: Greek from Charles XV.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/024.yaml
  text: For I gave my staff, that is, the stay of my tribe; and my girdle, that is, my power; and my diadem, that is, the glory of my kingdom.
translation:
  language: ru
  text: Ибо я отдал свой посох, то есть опору моего племени, и свой пояс, то есть силу, и диадему, то есть славу моего царства.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδον
  choice: посох
  rationale: Передаёт основной предметный смысл слова и сохраняет образ знака власти и опоры, поясняемый далее самим текстом.
- source_word: στήριγμα
  choice: опора
  rationale: Естественный современный эквивалент со значением поддержки и того, на чём держится племя.
- source_word: φυλῆς
  choice: племени
  rationale: В контексте патриарха Иуды обозначает родоплеменную общность; «племя» точнее и естественнее, чем «колено» вне специально библейской формулы.
- source_word: ζώνην
  choice: пояс
  rationale: Прямой и понятный эквивалент, сохраняющий символический предмет исходного текста.
- source_word: δύναμιν
  choice: силу
  rationale: Сохраняет широкое значение физической, общественной или властной силы без неоправданного уточнения.
- source_word: διάδημα
  choice: диадему
  rationale: Точно обозначает царский знак и поддерживает связь с последующим упоминанием царства.
- source_word: δόξαν
  choice: славу
  rationale: Передаёт смысл величия, чести и блеска царской власти, не сужая многозначность греческого слова.
- source_word: βασιλείας
  choice: царства
  rationale: Соответствует прямому значению в контексте царского достоинства Иуды.
theological_decisions:
- issue: Символическое значение посоха, пояса и диадемы
  choice: Сохранены явные толкования, данные в самом греческом тексте, без дополнительной богословской конкретизации.
  alternative: Истолковать предметы как пророческие знаки династии, мессианской власти или отдельных царских полномочий.
  rationale: Исходный текст сам отождествляет предметы с опорой племени, силой и славой царства, но не уточняет дальнейшую богословскую систему этих образов.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего завещательного повествования. Синтаксический параллелизм оригинала сохранён; архаизмы и конфессионально маркированные термины не добавлены.
