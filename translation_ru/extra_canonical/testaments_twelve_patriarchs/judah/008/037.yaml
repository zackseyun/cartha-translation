source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐμοὶ ἔδωκε τὰ ἐπὶ γῆς, ἐκείνῳ τὰ ἐν οὐρανοῖς.
  language: Greek
  note: Greek from Charles XXI.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/037.yaml
  text: To me he gave the things on earth; to him the things in heaven.
translation:
  language: ru
  text: Мне он дал то, что на земле, а ему — то, что на небесах.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐμοὶ … ἐκείνῳ
  choice: Мне … ему
  rationale: Сохранено контрастное противопоставление двух лиц, выраженное ударными греческими местоимениями.
- source_word: ἔδωκε
  choice: дал
  rationale: Прямое и естественное соответствие аористу δίδωμι; подразумеваемый субъект сохранён без уточнения.
- source_word: τὰ ἐπὶ γῆς
  choice: то, что на земле
  rationale: Передаёт субстантивированное выражение без добавления значения власти или владения, которого непосредственно нет в тексте.
- source_word: τὰ ἐν οὐρανοῖς
  choice: то, что на небесах
  rationale: Сохраняет множественное число οὐρανοῖς и параллелизм с первой частью фразы.
theological_decisions:
- issue: Кто является дающим и кто обозначен местоимением «ему»
  choice: Не называть лиц прямо
  alternative: Уточнить имена или титулы из более широкого контекста
  rationale: В данном греческом предложении оба референта выражены только местоимениями; уточнение сняло бы сохранённую оригиналом контекстуальную зависимость.
- issue: Характер переданного
  choice: «дал то, что…»
  alternative: «дал власть над тем, что…» или «поручил земное/небесное»
  rationale: Текст прямо говорит о даровании «того, что» находится на земле и на небесах, но не называет власть, управление или поручение.
translation_notes:
  register: Краткая, торжественная и естественная современная русская формулировка. Точка с запятой оригинального английского слоя заменена союзом «а» и тире во второй части, чтобы ясно передать греческий контраст и избежать тяжеловесности.
