  source_fidelity: 'Русский текст точно передаёт греческий параллелизм: Ἐμοὶ / ἐκείνῳ («мне / ему»), ἔδωκε («дал»), а также два субстантивированных выражения τὰ ἐπὶ γῆς и τὰ ἐν οὐρανοῖς. Подразумеваемый субъект не добавлен и не отождествлён. Союз «а» и тире естественно выражают заложенное в ударных местоимениях противопоставление, не меняя смысла.'
