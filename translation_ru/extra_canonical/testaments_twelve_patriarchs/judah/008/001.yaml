  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/001.yaml
  text: And while I was there, Barshaba, the king of Adullam, entertained us and made a drinking feast for us; and when he urged me, he gave me his daughter, whose name was Shua, as a wife.
translation:
  language: ru
  text: И когда я пришёл к которому, Варсава, царь Адоллама, устроил для нас пир с вином; и, уговорив меня, отдал мне в жёны свою дочь по имени Сава.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческой рукописной традиции имя дочери передаётся в разных формах; здесь переведено чтение «Сава». Слово, переведённое как «уговорив», также текстуально не вполне надёжно.
    reason: Исходное издание отмечает ὀνόματι Σαβά вариантностью, а παρακαλέσας — критическим знаком; сноска сохраняет текстологическую неопределённость.
lexical_decisions:
- source_word: Πρὸς ὃν ἐλθὼν ἤμην
  choice: И когда я пришёл туда
  rationale: Передаёт смысл несколько неровной греческой конструкции естественным современным русским языком, не добавляя нового участника или действия.
- source_word: Βαρσαβὰ ... βασιλεὺς Ὀδολλὰμ
  choice: Баршава, царь Адоллама
  rationale: Сохраняет греческую аппозицию и транслитерирует имена и топоним в принятой русской библейской форме.
- source_word: ἐποίησεν ἡμῖν πότον
  choice: устроил для нас пир с вином
  rationale: πότος обозначает пиршество, связанное с питьём; буквальное «устроил питьё» по-русски неестественно, а «пир с вином» ясно сохраняет смысл.
- source_word: παρακαλέσας
  choice: уговорив меня
  rationale: В данном брачном контексте передаёт значение настойчивого увещевания или убеждения; дополнение «меня» следует из контекста, но само чтение текстуально сомнительно и отмечено сноской.
- source_word: εἰς γυναῖκα
  choice: в жёны
  rationale: Естественная русская формула для передачи назначения женщины в качестве супруги.
- source_word: ὀνόματι Σαβά
  choice: по имени Сава
  rationale: Сохраняет засвидетельствованную в данном греческом тексте форму имени, не подменяя её более известным вариантом из Бытия.
