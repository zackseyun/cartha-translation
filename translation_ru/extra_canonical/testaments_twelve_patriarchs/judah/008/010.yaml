  text: So I gave them to her and went in to her, and she conceived by me. And because of the wine I did not perceive what I had done; neither did I recognize her when I went away.
translation:
  language: ru
  text: И когда я сошёлся с ней, она зачала. Я же не знал, что сделал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήλθον αὐτῇ
  choice: я сошёлся с ней
  rationale: Естественная и достаточно сдержанная русская передача эвфемизма о половом союзе; сохраняет смысл греческого выражения.
- source_word: συνελήφθη
  choice: она зачала
  rationale: В данном контексте пассивная форма означает наступление зачатия; по-русски это естественно выражается активной конструкцией.
- source_word: Ἀγνοῶν
  choice: не сознавал
  rationale: Передаёт отсутствие осознания совершённого поступка, не добавляя отсутствующего в данном греческом фрагменте объяснения опьянением.
- source_word: ὃ ἐποίησα
  choice: что сделал
  rationale: Близкая и ясная передача неопределённого относительного оборота без конкретизации, которой нет в источнике.
theological_decisions:
- issue: Причина неосознания Иудой своего поступка
  choice: Не указывать причину
  alternative: 'Добавить: «из-за вина»'
  rationale: В предоставленном греческом тексте причина не названа; её добавление из английского консультационного слоя вышло бы за пределы данного исходного свидетельства.
- issue: Неузнавание женщины при уходе
  choice: Не включать
  alternative: 'Добавить: «и, уходя, я не узнал её»'
  rationale: Этого утверждения нет в предоставленном греческом отрывке, поэтому оно не включено в основной текст.
translation_notes:
  register: Современный литературный русский язык; изложение сдержанное и прямое. Формула «сошёлся с ней» сохраняет эвфемистический характер оригинала, оставаясь понятной обычному читателю.
