source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καίγε οἱ ἐν τῇ πόλει ἔλεγον, μὴ *εἶναι ἐν τῇ πύλῃ τελεσικόμενον, ὅτι ἐξ ἄλλου χωρίου ἐλθοῦσα πρὸς βραχὺ ἐκαθέσθη ἐν τῇ πύλῃ. 10. Καὶ ἐνόμιζον, ὅτι οὐδεὶς ἔγνω ὅτι εἰσῆλθον πρὸς αὐτήν.
  language: Greek
  note: Greek from Charles XII.9-10 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/012.yaml
  text: And they said, "There has been no prostitute here, nor any stranger sitting by the gate." And I understood that I had sinned, and I did not make the matter known publicly, because I was ashamed.
translation:
  language: ru
  text: И жители города говорили, что у ворот не было блудницы[a], потому что она пришла из другого места и лишь ненадолго села у ворот. Они полагали, что никто не узнал, что я вошёл к ней.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово в этом месте текстуально и лексически неясно; перевод «блудница» следует из контекста.
    reason: Сохраняет прозрачность в отношении реальной неопределённости исходного текста.
lexical_decisions:
- source_word: τελεσικόμενον
  choice: блудницы
  rationale: Форма и значение греческого слова в данном месте неясны, однако контекст женщины у ворот и последующего входа Иуды к ней указывает на блудницу; по-русски естественно требуется форма женского рода.
- source_word: πρὸς βραχύ
  choice: лишь ненадолго
  rationale: Передаёт кратковременность пребывания без добавления не выраженных в тексте обстоятельств.
- source_word: εἰσῆλθον πρὸς αὐτήν
  choice: я вошёл к ней
  rationale: Сохраняет эвфемистическую и несколько неоднозначную формулировку греческого текста, не заменяя её прямым описанием половой связи.
theological_decisions:
- issue: Добавленные в английском консультационном тексте признание греха, публичность и стыд
  choice: Не включать эти утверждения
  alternative: «И я понял, что согрешил, и не предал это дело огласке, потому что стыдился»
  rationale: Эти сведения отсутствуют в предоставленном греческом источнике; вместо них греческий текст говорит, что Иуда полагал, будто никто не узнал о его входе к женщине.
translation_notes:
  register: Современный литературный русский язык с dignified, но понятной лексикой. Синтаксис слегка библейский, без архаизмов. Перевод следует предоставленному греческому тексту, а не расширениям английского консультационного слоя.
