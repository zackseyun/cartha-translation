  text: Ἐπιγνοὺς δὲ ἐγὼ εἶπον· Δεδικαίωται Θαμὰρ ἢ ἐγώ. Καὶ οὐ προσεθέμην ἔτι τοῦ γνῶναι αὐτήν.
  language: Greek
