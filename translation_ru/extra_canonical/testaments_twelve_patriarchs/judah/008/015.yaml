base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/015.yaml
  text: And I recognized them and was ashamed, and I said, "Tamar is more righteous than I, because I did not give her to Shelah my son." And I did not know her again.
translation:
  language: ru
  text: 'Узнав, я сказал: «Фамарь была права, а я — нет».[a] И после этого я больше не вступал с ней в близость.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Фамарь оправдана (или: признана правой) более, чем я». Греческое δεδικαίωται выражает признание её правоты или оправданности; конструкция ἢ ἐγώ может иметь сравнительный либо противопоставительный оттенок.'
    reason: Передаёт значение δεδικαίωται и сохраняет отмеченную греческой конструкцией неоднозначность, не превращая признание правоты в утверждение о нравственном качестве.
  - marker: b
    text: 'Буквально: «И я больше не стал познавать её». «Познавать» здесь — библейский эвфемизм половой близости.'
    reason: Поясняет значение γνῶναι αὐτήν и связь современного русского выражения с греческим эвфемизмом.
lexical_decisions:
- source_word: Ἐπιγνούς
  choice: Узнав это
  rationale: Передаёт распознавание/осознание, выраженное аористным причастием; дополнение «это» естественно по-русски и не добавляет конкретного предмета, отсутствующего в данном греческом отрывке.
- source_word: Δεδικαίωται
  choice: праведнее
  rationale: Форма буквально связана с признанием оправданной или правой; в сравнительной конструкции с ἢ ἐγώ по-русски естественно «праведнее меня», в согласии с библейским контекстом.
- source_word: τοῦ γνῶναι αὐτήν
  choice: имел с ней близости
  rationale: Глагол «знать» здесь является эвфемизмом половой связи. Русское выражение сохраняет достоинство и ясно передаёт смысл без неестественной кальки.
theological_decisions:
- issue: Содержание признания Иуды
  choice: 'Сохранена краткая формулировка греческого источника: «Фамарь праведнее меня»'
  alternative: 'Добавить: «потому что я не отдал её Шеле, моему сыну»'
  rationale: Причинная фраза присутствует в английском консультационном тексте и библейской параллели, но отсутствует в предоставленном греческом исходном тексте; её добавление сделало бы перевод менее источниковым.
- issue: Смысл «не знать её снова»
  choice: Передать как отсутствие дальнейшей половой близости
  alternative: 'Буквально: «больше не познал её»'
  rationale: В данном контексте γινώσκω употреблено как устойчивый библейский эвфемизм; ясный современный русский перевод не снимает богословского напряжения и не привносит толкования.
translation_notes:
  register: Современный литературный русский с библейским достоинством. Имя Θαμάρ передано традиционной русской библейской формой «Фамарь». Формулировка следует предоставленному греческому тексту, а не расширенному английскому слою.
