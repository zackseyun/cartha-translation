  text: VIII. *Ἦσαν δέ μοι¹ κτήνη πολλά, καὶ *εἶχον ἀρχιποίμενα² Ἱρὰμ³ τὸν Ὀδολομίτην⁴. 2. Πρὸς ὃν ἐλθὼν⁵ ἤμην, καὶ ἦλθεν Βαρσαβὰ⁶ τὸν⁷ βασιλεὺς⁸ Ὀδολλὰμ⁹, καὶ¹⁰ ἐποίησεν ἡμῖν πότον¹², καὶ †παρακαλέσας¹³ δέδωκέ¹⁴ μοι τὴν θυγατέρα αὐτοῦ¹⁵ *ὀνόματι Σαβά¹⁶ εἰς γυναῖκα. 3. Αὕτη¹⁷ ἔτεκέν μοι τὸν Ἦρ¹⁸ καὶ τὸν¹⁹ Αὐνὰν καὶ τὸν²⁰ Σηλώμ²¹. *Καὶ τοὺς μὲν δύο²² ἀνεῖλεν²³ Κύριος· ὁ γὰρ Σηλὼμ ἔζησεν²⁴.
  text_scope: related_parent_record_source
  language: Greek
  note: Project verse 8:41 ('because of him the Lord will choose from you the kingship, and from Levi the priesthood, that the Lord may be for all the nations and the race of Israel') has no direct α-counterpart. The 'kingship from Judah, priesthood from Levi, Lord for all nations' theme is the project's homiletic synthesis of Charles XXII.2-3 ('ἕως τοῦ ἐλθεῖν τὸ σωτήριον τοῦ Ἰσραὴλ') and XXIV.6 ('κρῖναι καὶ σῶσαι πάντας τοὺς ἐπικαλουμένους τὸν Κύριον'), but α has no single verse that says what the project English says here. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/041.yaml
  text: For because of him the Lord will choose from you the kingship, and from Levi the priesthood, that the Lord may be for all the nations and the race of Israel.
translation:
  language: ru
  text: Ибо благодаря ему Господь изберёт из вашей среды царскую власть, а из Левия — священство, чтобы Господь был для всех народов и для рода Израиля.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: У этого проектного стиха нет прямого соответствия в представленном греческом α-свидетельстве. Его содержание представляет собой тематический синтез Завещания Иуды 22:2–3 и 24:6, где говорится о приходе спасения Израиля, а также о суде и спасении всех призывающих Господа.
    reason: Предупреждает читателя, что основной текст здесь основан на проектном синтезе, а не на одном непосредственно засвидетельствованном греческом предложении.
lexical_decisions:
- source_word: because of him
  choice: благодаря ему
  rationale: Прямого греческого соответствия у проектного стиха нет; местоименная неопределённость английского консультационного слоя сохранена без уточнения личности.
- source_word: the kingship
  choice: царскую власть
  rationale: Передаёт не отдельного царя и не территориальное царство, а царское достоинство и правление.
- source_word: the priesthood
  choice: священство
  rationale: Естественный русский термин для священнического служения и института; связь с Левием сохранена.
- source_word: all the nations and the race of Israel
  choice: всех народов и для рода Израиля
  rationale: Сохранено различение между народами и Израилем, присутствующее в английском проектном тексте; повтор предлога делает синтаксис яснее.
theological_decisions:
- issue: Разделение царской власти и священства между Иудой и Левием
  choice: Сохранить формулировку английского проектного текста без конфессионального истолкования.
  alternative: Свести обе роли к одной мессианской фигуре или истолковать их как конкретные позднейшие институты.
  rationale: Такие уточнения отсутствуют в представленном греческом свидетельстве и разрешили бы богословское напряжение за источник.
- issue: Отсутствие прямого греческого соответствия проектному стиху
  choice: Пометить текст сноской как редакционный синтез, а не как прямой перевод сохранившегося греческого стиха.
  alternative: Представить русский текст без оговорки как непосредственный перевод греческого оригинала.
  rationale: α-свидетель не содержит единого стиха с данной формулировкой; прозрачная маркировка необходима для источниковой честности.
translation_notes:
  register: Современный литературный русский язык; тон возвышенный, но понятный. Синтаксический параллелизм «из вашей среды… а из Левия…» сохраняет торжественное звучание и структуру консультационного текста. Из-за отсутствия прямого греческого оригинала перевод не выдаётся за реконструкцию α-текста.
