review_pass:
  verdict: revise
  source_fidelity: 'В представленном греческом α-свидетельстве нет прямого соответствия этому проектному стиху: оно содержит текст Завещания Иуды 8:1–3, тогда как данная формулировка является проектным тематическим синтезом более поздних мест. Сноска корректно сообщает это обстоятельство. Русский текст в целом сохраняет намеренную неопределённость местоимения «ему», а также различение царской власти и священства.'
  naturalness: 'Сочетание «изберёт из вашей среды царскую власть» в русском языке семантически неудачно: избирают лицо либо наделяют/устанавливают власть, но не «избирают власть из среды». Безопаснее явно, но без догматического уточнения, назвать носителей соответствующего служения.'
  terminology: «Господь», «Левий», «священство» и «род Израиля» уместны в современном литературном и библейском регистре. «Царская власть» точно передаёт kingship, но требует синтаксической переработки. «Род Израиля» сохраняет значение race без современного биологизирующего оттенка.
  issues:
  - severity: medium
    issue: Неестественная сочетаемость «изберёт из вашей среды царскую власть».
    rationale: Власть не может быть избрана «из среды» людей; такая формулировка затемняет смысл английского проектного текста. Указание на людей, которым принадлежат царская власть и священство, делает фразу грамматически и семантически естественной, не называя конкретных лиц или институтов.
  revised_text: Ибо благодаря ему Господь изберёт из вашей среды тех, кому принадлежит царская власть, а из Левия — тех, кому принадлежит священство, чтобы Господь был для всех народов и для рода Израиля.[a]
  revised_footnotes:
  - marker: a
    text: У этого проектного стиха нет прямого соответствия в представленном греческом α-свидетельстве. Его содержание представляет собой тематический синтез Завещания Иуды 22:2–3 и 24:6, где говорится о приходе спасения Израиля, а также о суде и спасении всех призывающих Господа.
    reason: Предупреждает читателя, что основной текст здесь основан на проектном синтезе, а не на одном непосредственно засвидетельствованном греческом предложении.
  revision_rationale: Исправлена только неестественная русская конструкция с объектом «царская власть». Новая формулировка передаёт выбор людей из среды адресатов и из Левия для соответствующих функций, сохраняя абстрактные термины «царская власть» и «священство», неопределённость референта «ему» и прозрачную сноску о том, что перед нами не прямой перевод α-свидетельства.
