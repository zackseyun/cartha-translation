  note: Project verse 8:8 (the 'I will send you a kid from the flock... will you give me a pledge until you send it?' exchange) has no direct counterpart in the Charles α-text of XII.4, which collapses Tamar's question 'Τί μοι δώσεις;' directly into Judah handing over the pledges. The kid-from-the-flock question is drawn from the broader Genesis 38 tradition that informs the project English; α witnesses no Greek for this specific exchange. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/008.yaml
  text: And I said, "I will send you a kid from the flock." And she said, "Will you give me a pledge until you send it?"
translation:
  language: ru
  text: 'И я сказал: «Я пришлю тебе козлёнка из стада». Она же спросила: «Дашь ли ты мне залог, пока не пришлёшь его?»[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Этой реплики нет в греческом α-тексте «Завещания Иуды» у Чарльза: там вопрос Фамари «Что ты дашь мне?» непосредственно переходит к передаче залога. Текст стиха следует более полной традиции Быт. 38:17.'
    reason: Прямой греческий источник для данной реплики отсутствует; необходимо прозрачно обозначить её происхождение из лежащей в основе повествования традиции Бытия 38.
lexical_decisions:
- source_word: גְּדִי־עִזִּים (Genesis 38:17 tradition)
  choice: козлёнка
  rationale: Естественная современная передача обещанного молодого животного; контекстуальное «из стада» сохраняет формулировку проектного английского текста.
- source_word: עֵרָבוֹן (Genesis 38:17 tradition)
  choice: залог
  rationale: Точно передаёт предмет, временно оставляемый как обеспечение до исполнения обещания.
