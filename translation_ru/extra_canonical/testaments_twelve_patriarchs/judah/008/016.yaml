  rationale: 'Сохранены порядок и образность греческого текста, включая неоднозначное сочетание ὀργὴν ἐπιθυμίας. Изменены лишь два глагольных выражения: «вселяет» точнее передаёт ἐμβάλλει без дополнительной метафоры, а «ведёт глаза к заблуждению» делает заключительный образ естественным для современного литературного русского. Английская контрольная формулировка («inspires the passion of desire») не требует сглаживать греческое «ярость/гнев вожделения».'
