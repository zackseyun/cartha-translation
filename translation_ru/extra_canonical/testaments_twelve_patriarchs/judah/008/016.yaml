source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ νῦν λέγω ὑμῖν, τέκνα μου, μὴ μεθύσκεσθε οἴνῳ, ὅτι ὁ οἶνος διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας καὶ ἐμβάλλει ὀργὴν ἐπιθυμίας, καὶ ὁδηγεῖ εἰς πλάνην τοὺς ὀφθαλμούς.
  language: Greek
  note: 'Greek from Charles XIV.1 (α): the wine-warning exhortation. Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/016.yaml
  text: 'And now, my children, I say to you: do not be drunk with wine. For wine turns the mind away from the truth and inspires the passion of desire, and it leads the eyes into error.'
translation:
  language: ru
  text: 'И теперь говорю вам, дети мои: не упивайтесь вином, потому что вино отвращает ум от истины, вселяет ярость вожделения и ведёт глаза к заблуждению.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ μεθύσκεσθε οἴνῳ
  choice: не упивайтесь вином
  rationale: Передаёт запрет на опьянение вином естественной и традиционно понятной русской формулой, не превращая его в полный запрет употребления вина.
- source_word: διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας
  choice: отвращает ум от истины
  rationale: 'Сохраняет образ и направленность греческого выражения: вино искажает или уводит разум прочь от истины.'
- source_word: ἐμβάλλει ὀργὴν ἐπιθυμίας
  choice: разжигает гнев вожделения
  rationale: Сохраняет трудное сочетание двух существительных и его смысловую напряжённость; «разжигает» естественно передаёт внесение и возбуждение сильного порыва.
- source_word: ὁδηγεῖ εἰς πλάνην τοὺς ὀφθαλμούς
  choice: вводит глаза в заблуждение
  rationale: Близко сохраняет олицетворённый образ глаз, ведомых к ошибке, не подменяя его более узким толкованием.
theological_decisions:
- issue: Характер запрета, связанного с вином
  choice: 'Запрещается опьянение: «не упивайтесь вином»'
  alternative: «не пейте вина»
  rationale: Глагол μεθύσκεσθε обозначает состояние опьянения, поэтому текст не следует расширять до безусловного запрета всякого употребления вина.
- issue: Неясная связь гнева и желания в ὀργὴν ἐπιθυμίας
  choice: 'Сохранить генитивную конструкцию: «гнев вожделения»'
  alternative: «страсть желания» или «гнев и вожделение»
  rationale: Греческий текст допускает трудное для однозначного истолкования сочетание; перевод не должен без необходимости превращать его в два отдельных порока или сглаживать до одного понятия.
translation_notes:
  register: Современный литературный русский с достоинством завещательного наставления. Синтаксис достаточно близок греческому, но звучит естественно; намеренно сохранены необычные образы «гнев вожделения» и «вводит глаза в заблуждение».
