  source_fidelity: 'Требуется исправление ст. 1: в предоставленном α-тексте после καὶ ἔσονται стоит συνεχεῖς ἔσονται ἐν Ἰσραήλ, без слова «войны». Поэтому «в Израиле не прекратятся войны» вводит слово, которого в данном исходном тексте нет. Непрерывность следует отнести к уже названным распрям. В ст. 2 инфинитив τοῦ ἡσυχάσαι имеет Бога праведности своим естественным подразумеваемым деятелем; русское «чтобы Иаков и все народы обрели покой» ослабляет эту причинную связь. В ст. 3 «в моём потомстве» точнее передаёт ἐκ τοῦ σπέρματός μου, чем конструкция «лишит моих потомков царства».'
