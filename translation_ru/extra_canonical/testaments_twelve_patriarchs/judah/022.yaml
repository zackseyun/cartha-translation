  text: The Lord will bring divisions among them against one another[a], and there will be continual wars in Israel. And my kingdom will be brought to an end among foreigners, until the salvation of Israel comes[c][b],
translation:
  language: ru
  text: 1 Господь наведёт на них распри между ними, и в Израиле они будут непрестанны. 2 Моему царству будет положен конец среди чужеземцев[a], пока не придёт спасение Израиля[b], до пришествия Бога праведности, чтобы Он даровал покой Иакову и всем народам. 3 Он сохранит могущество моего царства вовек, ибо Господь поклялся мне, что не уничтожит царскую власть в моём потомстве вовек.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «моё царство достигнет завершения среди чужеземцев»; греческий глагол может означать как прекращение, так и завершение.'
    reason: lexical_alternative
  - marker: b
    text: 'Или: «избавление Израиля». Выражение может также иметь мессианский оттенок, хотя прямо не называет личного Спасителя.'
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπάξει ... διαιρέσεις
  choice: наведёт ... распри
  rationale: Будущее ἐπάξει выражает действие, которое Господь вызывает или навлекает, а διαιρέσεις здесь обозначает внутренние раздоры и раскол. «Наведёт распри» естественно передаёт и причинность, и напряжённый пророческий тон.
- source_word: κατ᾽ ἀλλήλων
  choice: они восстанут друг против друга
  rationale: Оборот указывает на взаимную вражду. Развёрнутая русская конструкция яснее связывает распри с противостоянием, не сводя их к простому разделению.
- source_word: πόλεμοι συνεχεῖς / συνεχεῖς
  choice: не прекратятся войны
  rationale: Контекст и засвидетельствованное чтение с πόλεμοι передают непрерывные войны. Русская отрицательная конструкция естественно выражает длительное, неослабевающее действие συνεχεῖς.
- source_word: ἀλλοφύλοις
  choice: среди чужеземцев
  rationale: В данном широком пророческом контексте слово означает иноплеменников или чужеземцев, а не обязательно филистимлян.
- source_word: συντελεσθήσεται
  choice: будет положен конец
  rationale: Пассивная форма может означать как завершение, так и доведение до конца. Контекст распрей и войн склоняет к прекращению царства, однако альтернативный оттенок отмечен в сноске.
- source_word: τὸ σωτήριον τοῦ Ἰσραήλ
  choice: спасение Израиля
  rationale: Средний род σωτήριον естественнее всего обозначает спасение или избавление. Формулировка не решает без необходимости, является ли выражение только событийным или также имеет мессианский смысл.
- source_word: παρουσίας Θεοῦ τῆς δικαιοσύνης
  choice: не явится Бог праведности
  rationale: παρουσία передаёт пришествие или явление, а Θεὸς τῆς δικαιοσύνης — буквально «Бог праведности». Личная конструкция по-русски звучит естественно и сохраняет торжественный характер пророчества.
- source_word: φυλάξει κράτος τῆς βασιλείας μου
  choice: сохранит силу моего царства
  rationale: φυλάξει означает сохранение или охрану, κράτος — силу, могущество либо власть. «Сохранит силу» близко следует греческой конструкции, не отождествляя её полностью с территориальным государством.
- source_word: μὴ ἐξαλείψειν τὸ βασίλειον ἐκ τοῦ σπέρματός μου
  choice: никогда не лишит моих потомков царства
  rationale: Буквальное «не изгладит царство из моего семени» по-русски неестественно. Выбранная формулировка сохраняет смысл непрекращающегося обладания царской властью потомством Иуды.
theological_decisions:
- issue: Значение τὸ σωτήριον τοῦ Ἰσραήλ
  choice: спасение Израиля
  alternative: избавление Израиля; Спаситель Израиля
  rationale: Грамматическая форма прежде всего обозначает спасение или избавление, но в пророческом контексте может иметь мессианский оттенок. Основной текст сохраняет абстрактное существительное и не превращает его без достаточных оснований в прямое именование личности.
- issue: Смысл συντελεσθήσεται ἡ βασιλεία μου ἐν ἀλλοφύλοις
  choice: моему царству будет положен конец среди чужеземцев
  alternative: моё царство достигнет завершения среди чужеземцев
  rationale: Контекст внутренних распрей и непрерывных войн поддерживает значение прекращения. Поскольку глагол допускает также нейтральное или положительное «завершиться», это сохранено в сноске.
- issue: Референт αὐτός в стихе 3
  choice: Он
  alternative: Бог праведности; Господь
  rationale: Местоимение отсылает к ближайшему божественному референту, но греческий текст не повторяет титул. Местоимение с прописной буквы сохраняет связь и не добавляет отсутствующего имени.
- issue: Династическое обещание в стихе 3
  choice: никогда не лишит моих потомков царства
  alternative: не изгладит царства из моего семени навеки
  rationale: Перевод сохраняет обещание непрерывности царской власти в потомстве Иуды, не уточняя конфессионально, каким образом и в ком оно исполняется.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, завещательно-пророческим звучанием. Синтаксис упрощён там, где буквальное воспроизведение греческих инфинитивных оборотов было бы неестественным; ключевые неоднозначности сохранены в тексте и сносках.
