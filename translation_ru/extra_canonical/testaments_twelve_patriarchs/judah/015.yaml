  text: 1[a]. The man who commits sexual immorality, even while being ruined, does not perceive it; and while being dishonored, he is not ashamed. 2. For even if a man is a king and commits sexual immorality, he is stripped of his kingship, having been enslaved to sexual immorality, as I also suffered. 3[b]. I gave my staff—that is, the support of my tribe—and my belt—that is, my strength—and my diadem—that is, the glory of my kingdom. 4. And although I repented concerning these things, I ate neither meat nor drank wine until my old age, and I saw no joy at all. 5. And the angel of God showed me that women rule forever over king and beggar alike, and they take away a king's glory and a strong man's might and the poor man's very support.
translation:
  language: ru
  text: '15


    1. Предающийся разврату, когда его обнажают, этого не замечает; и, будучи обесчещен, не стыдится. 2. Ведь даже если человек — царь, но предаётся разврату, он лишается царского достоинства, став рабом разврата, как случилось и со мной. 3. Ибо я отдал свой посох, то есть опору моего племени, свой пояс, то есть силу, и диадему, то есть славу моего царства. 4. Раскаявшись в этом, я до самой старости не ел мяса и не пил вина и не знал никакой радости. 5. И ангел Божий показал мне, что женщины берут верх над царём и властвуют над бедняком: у царя они отнимают славу, у мужчины — силу, а у бедняка — последнюю опору в его бедности[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Синтаксис конца стиха допускает иное распределение: «у царя отнимают славу, у мужа — силу, а у бедняка — даже малейшую опору в бедности».'
    reason: синтаксическая неоднозначность
lexical_decisions:
- source_word: πορνεύσας / πορνεύῃ / πορνείᾳ
  choice: предающийся разврату / предаётся разврату / разврат
  rationale: «Разврат» сохраняет нравственную тяжесть греческого термина и звучит естественно в современном литературном русском; повтор корня передаёт настойчивость оригинала.
- source_word: γυμνούμενος
  choice: его обнажают
  rationale: Сохранён буквальный образ обнажения, который затем развивается в выражении «лишается царского достоинства»; значение «губят» было бы более толковательным.
- source_word: ἀδοξῶν
  choice: его лишают чести
  rationale: Передаёт утрату чести и общественного достоинства и связывает стих с последующим мотивом утраты царской славы.
- source_word: γυμνοῦται τῆς βασιλείας
  choice: лишается царского достоинства
  rationale: Греческий образ буквально означает снятие или лишение царского статуса. «Царское достоинство» здесь точнее личного «царства».
- source_word: δουλεύσας τῇ πορνείᾳ
  choice: став рабом разврата
  rationale: Сохраняет сильный образ рабского подчинения пороку без ненужного смягчения.
- source_word: ῥάβδον / στήριγμα
  choice: посох / опора
  rationale: «Посох» естественно допускает буквальный и символический смысл; авторское пояснение «опора» сохранено.
- source_word: ζώνην
  choice: пояс
  rationale: Прямой современный эквивалент, сохраняющий последовательность трёх символических предметов.
- source_word: διάδημα
  choice: диадема
  rationale: Точно передаёт особый знак царской власти и не смешивает его с более общим словом «венец».
- source_word: μετανοήσας
  choice: раскаявшись
  rationale: В данном контексте последующие аскетические действия представлены как ответ Иуды на собственный проступок, поэтому покаянный смысл причастия наиболее естественен; когнитивное «переменив решение» остаётся возможным, но здесь слабее.
- source_word: εὐφροσύνην οὐκ εἶδον
  choice: не знал никакой радости
  rationale: Русская идиома естественно передаёт буквальное «не видел никакой радости», не меняя смысла полного отказа от веселья.
- source_word: κρατοῦσι / κατακυριεύουσιν
  choice: берут верх / властвуют
  rationale: Сохранены два разных греческих глагола господства и параллель между царём и бедняком.
- source_word: ἐλάχιστον στήριγμα
  choice: последнюю опору
  rationale: По смыслу это самое малое, что ещё поддерживает бедняка; «последняя опора» ясно и естественно передаёт предельную скудость, отмеченную превосходной степенью.
theological_decisions:
- issue: Смысл μετανοήσας в рассказе Иуды о последствиях греха
  choice: раскаявшись
  alternative: переменив решение / изменив образ мыслей
  rationale: Непосредственный контекст связывает внутренний поворот с продолжительным воздержанием после признанного проступка. «Раскаявшись» естественно выражает это, не вводя конфессионально специфической схемы покаяния.
- issue: Образ рабства по отношению к разврату
  choice: став рабом разврата
  alternative: подчинившись разврату
  rationale: Буквальный рабский образ важен для нравственного напряжения текста и не должен быть ослаблен до общего понятия подчинения.
- issue: Обобщение о власти женщин в стихе 5
  choice: сохранено как утверждение ангельского откровения внутри речи Иуды
  alternative: смягчить до утверждения лишь о некоторых соблазняющих женщинах
  rationale: В греческом тексте стоит общее αἱ γυναῖκες. Перевод не расширяет и не смягчает формулировку, а передаёт исторический текст как речь персонажа.
- issue: Социальные категории и трёхчастная утрата в стихе 5
  choice: царь — слава; мужчина — сила; бедняк — опора
  alternative: 'свести «царя» и «мужчину» в одну категорию: «у царя — мужскую силу и славу»'
  rationale: Греческая последовательность допускает синтаксическую неоднозначность. Основной текст сохраняет все три названных элемента и их параллелизм, не устраняя напряжение молча; неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский с достоинством завещательной речи. Сохранены повтор «разврат», образы обнажения, рабства и символические предметы. Архаизмы ограничены уместным глаголом «вкушал» и термином «диадема»; текст остаётся понятным обычному читателю.
