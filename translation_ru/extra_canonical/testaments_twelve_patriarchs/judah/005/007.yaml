lexical_decisions:
- source_word: Ἀπεκτείναμεν πάντας
  choice: Мы убили всех
  rationale: Прямо передаёт аорист ἀπεκτείναμεν и объект πάντας, не добавляя отсутствующих в греческом тексте сведений о сожжении города.
- source_word: πάλιν ἐλάβομεν
  choice: вновь вернули себе
  rationale: Буквально сочетание означает «снова взяли»; в контексте повторного обретения принадлежащей говорящим группы естественное русское выражение «вернули себе» передаёт значение πάλιν.
- source_word: τὴν αἰχμαλωσίαν ἡμῶν
  choice: пленников
  rationale: Существительное αἰχμαλωσία может обозначать плен, совокупность пленников или захваченную добычу. Здесь конкретное «пленников» лучше сочетается с глаголом «взяли/вернули»; местоимение ἡμῶν передано конструкцией «себе».
