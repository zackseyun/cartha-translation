  text: And as we were departing, men of Thapphoue fell upon our captives; and after handing them over to our sons, we joined battle with them as far as Thapphoue.
translation:
  language: ru
  text: Когда же мы уходили, жители Бавуэ[a] захватили наших пленников; увидев это, мы вступили с ними в бой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Название «Бавуэ» передаёт чтение греческой рукописной традиции; точная форма и отождествление этого места неясны.
    reason: В издании название отмечено как текстуально сомнительное; английский консультационный текст читает здесь другое название — «Тапфуэ».
lexical_decisions:
- source_word: ἐν δὲ τῷ ἀπιέναι ἡμᾶς
  choice: Когда же мы уходили
  rationale: Естественно передаёт греческую временную конструкцию с инфинитивом и сохраняет значение удаления или ухода.
- source_word: ἄνδρες
  choice: жители
  rationale: В сочетании с названием местности слово обозначает людей из данного места; буквальное «мужи» в современном русском здесь звучало бы неестественно.
- source_word: ἐπελάβοντο τὴν αἰχμαλωσίαν ἡμῶν
  choice: захватили наших пленников
  rationale: Абстрактное αἰχμαλωσία в контексте употреблено собирательно — о захваченных людях; «наших» означает пленников, находившихся у говорящих.
- source_word: ἰδόντες
  choice: увидев это
  rationale: У греческого причастия нет выраженного дополнения; нейтральное «это» сохраняет связь с предшествующим событием, не добавляя отсутствующей детали.
- source_word: συνῆψαν πόλεμον μετ᾽ αὐτῶν
  choice: вступили с ними в бой
  rationale: Передаёт идиоматическое значение выражения «связали/завязали войну» естественным современным русским языком.
