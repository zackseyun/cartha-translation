  text: '*Ἐγὼ δὲ⁵ καὶ ὁ Γὰδ⁶ προσέφθημεν *ἀπὸ ἀνατολῶν τῆς πόλεως⁷, *Ῥουβὴμ δὲ⁸ καὶ⁹ Λευὶ¹⁰ ἀπὸ δυσμῶν¹¹.'
