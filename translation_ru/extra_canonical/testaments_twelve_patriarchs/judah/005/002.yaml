  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/002.yaml
  text: But I and Gad attacked from the east of the city, and Reuben and Levi from the west.
translation:
  language: ru
  text: Я же и Гад напали на город с востока, а Рувим и Левий — с запада.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέφθημεν
  choice: напали
  rationale: По контексту военного повествования глагол передаёт наступательное действие; выбор согласуется с консультационным английским текстом и естественно звучит по-русски.
- source_word: ἀπὸ ἀνατολῶν τῆς πόλεως
  choice: на город с востока
  rationale: Оборот указывает направление подхода или нападения относительно города; такая формулировка яснее буквального «от востоков города».
- source_word: ἀπὸ δυσμῶν
  choice: с запада
  rationale: Естественный русский эквивалент греческого обозначения западной стороны или направления.
