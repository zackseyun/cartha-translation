  text: И те, кто был на стене, потянулись к нам, потому что мы были одни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἐπὶ τοῦ τείχους
  choice: стоявшие на стене
  rationale: Естественно передаёт субстантивированное обозначение людей, находившихся на городской стене.
- source_word: ὅτι ἡμεῖς μόνοι ἐσμέν
  choice: решив, что мы одни
  rationale: В данном контексте ὅτι-сочетание выражает основание их действия; «решив» естественно передаёт их ошибочный вывод, не добавляя к нему лишних подробностей.
- source_word: ἐφειλκύσθησαν
  choice: двинулись
  rationale: Средне-пассивная форма обозначает, что увиденное побудило или увлекло их приблизиться. Русское «двинулись» ясно и естественно передаёт результат, не вводя неуместного буквального «были привлечены».
- source_word: πρὸς ἡμᾶς
  choice: к нам
  rationale: Сохраняет пространственное направление πρὸς и не усиливает его до значения «против нас».
