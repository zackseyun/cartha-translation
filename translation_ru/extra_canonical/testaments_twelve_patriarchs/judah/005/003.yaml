  verdict: revise
  source_fidelity: 'В черновике верно переданы «те, кто [находился] на стене» и направление πρὸς ἡμᾶς — «к нам». Однако «решив» добавляет волевое, обдуманное решение, которого греческое ὅτι не выражает: здесь оно вводит причину («потому что мы были одни»). «Двинулись» передаёт итог движения, но несколько ослабляет оттенок ἐφειλκύσθησαν: их потянуло/они потянулись.'
  naturalness: «И те, кто был на стене, потянулись к нам, потому что мы были одни» — естественная современная литературная фраза. Порядок частей слегка перестроен для русского синтаксиса, без изменения логических связей.
  terminology: Специальных богословских терминов, собственных имён и подлежащих сносочному комментированию форм в этом предложении нет. «Потянулись к нам» сохраняет ненасильственный, неуточнённый характер ἐφειλκύσθησαν и не превращает движение в нападение.
