    issue: «Решив, что мы одни»
    rationale: Греческое ὅτι ἡμεῖς μόνοι ἐσμὲν формулирует причинное обстоятельство, а не акт принятия решения. «Решив» вносит отсутствующий в источнике оттенок намеренного вывода.
  - severity: low
    issue: «Двинулись к нам»
    rationale: Фраза понятна, но ἐφειλκύσθησαν имеет оттенок того, что их привлекло или потянуло. «Потянулись» точнее передаёт этот нюанс, оставаясь естественным по-русски.
