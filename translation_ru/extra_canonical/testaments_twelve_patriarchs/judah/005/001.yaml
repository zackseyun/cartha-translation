  text: Καὶ¹ τῇ ἑξῆς ἀπήλθομεν εἰς Ἀρετὰν², πόλιν κραταιάν³, *ἀπειλοῦσαν ἡμῖν θάνατον⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/001.yaml
  text: And on the next day we went to Areta, a city still mighty and strong, threatening us with death.
translation:
  language: ru
  text: На следующий день мы отправились в Арету — могущественный город, грозивший нам смертью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ἑξῆς
  choice: на следующий день
  rationale: По контексту субстантивированное выражение естественно обозначает следующий день; такой перевод ясен и литературен.
- source_word: ἀπήλθομεν
  choice: мы отправились
  rationale: Передаёт движение к названному месту без неестественного для русского акцента на удалении от исходной точки.
- source_word: Ἀρετάν
  choice: Арету
  rationale: Название города передано транслитерацией и поставлено в винительный падеж после предлога «в».
- source_word: πόλιν κραταιάν
  choice: могущественный город
  rationale: κραταιός означает сильный, могучий; «могущественный» сохраняет представление о силе города без добавленного в английском консультационном тексте удвоения «mighty and strong».
- source_word: ἀπειλοῦσαν ἡμῖν θάνατον
  choice: грозивший нам смертью
  rationale: Естественная русская конструкция точно передаёт угрозу смерти, исходящую от города в персонифицированном описании.
