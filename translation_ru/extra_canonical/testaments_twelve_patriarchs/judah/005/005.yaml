  text: '*Καὶ κατελάβομεν αὐτὴν¹⁸ ἐν στόματι μαχαίρας¹⁹, καὶ τοὺς ἐν τῷ πύργῳ²⁰ καταφυγόντας ἐν πυρὶ ἐνεπρήσαμεν, καὶ οὕτως πάντας ἐλάβομεν, καὶ πάντα τὰ αὐτῶν²¹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/005.yaml
  text: And we took it by the edge of the sword, and those who had fled for refuge in the tower we burned with fire; and so we captured them all.
translation:
  language: ru
  text: И мы взяли её силой меча, а тех, кто укрылся в башне, сожгли огнём. Так мы захватили всех их и всё, что им принадлежало.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν στόματι μαχαίρας
  choice: силой меча
  rationale: Буквально «устами/остриём меча»; русское «силой меча» естественно передаёт военное взятие города, не затемняя смысл архаичным оборотом.
- source_word: τῷ πύργῳ
  choice: в башне
  rationale: Сохранено единственное число определённой формы греческого текста.
- source_word: ἐνεπρήσαμεν
  choice: сожгли
  rationale: Точно передаёт преднамеренное сожжение; добавление «огнём» сохраняет эксплицитное ἐν πυρί.
- source_word: πάντα τὰ αὐτῶν
  choice: всё, что им принадлежало
  rationale: Передаёт присутствующий в греческом тексте объект — всё их имущество или достояние, опущенное в английском консультационном слое.
