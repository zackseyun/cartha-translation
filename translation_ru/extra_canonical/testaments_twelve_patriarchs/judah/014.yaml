  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014.yaml
  text: 'These two things turn away a man''s mind[a]. For if you drink wine to drunkenness, it throws your mind into turmoil with filthy thoughts, and heats your body toward pleasure for sexual immorality, and it commits sin and is not ashamed.


    Such is the wine-drinker, my children, because the one who gets drunk has regard for no one. For see, it also led me astray, so that I was not ashamed before the multitude of the city. In the sight of all I turned aside to Tamar, and I committed a great sin, and I uncovered the covering of uncleanness of my sons.


    After drinking wine, I was not ashamed of the commandment of God, and I took a Canaanite woman. For the one who drinks wine, my children, has need of much understanding, and this is the understanding for drinking wine: as long as he still has shame, let him drink. But if he goes on until he passes the limit, a spirit of deception enters into his mind and makes the drunkard speak shamefully and act lawlessly and feel no shame[c][b], but even boast in his dishonor and think it good.'
translation:
  language: ru
  text: '14


    1 И теперь говорю вам, дети мои: не упивайтесь вином, потому что вино отвращает ум от истины, разжигает ярость похоти и вводит глаза в заблуждение.


    2 Ведь дух разврата пользуется вином как слугой ради наслаждения ума, ибо и то и другое уводит человеческий разум в сторону.


    3 Если кто напивается вином допьяна, оно приводит твой ум в смятение нечистыми помыслами, распаляет тело, побуждая его к разврату ради наслаждения, и человек совершает грех и не стыдится.


    4 Таков предающийся вину, дети мои, потому что пьяный ни с кем не считается.


    5 Вот и меня вино ввело в заблуждение, так что я не постыдился множества жителей города: на глазах у всех я уклонился к Фамари, совершил великий грех и обнажил покров нечистоты моих сыновей[a].


    6 Выпив вина, я не устыдился перед заповедью Божией и взял себе жену-хананеянку.


    7 Пьющему вино, дети мои, нужно великое благоразумие. Вот в чём благоразумие при употреблении вина: пусть человек пьёт лишь до тех пор, пока в нём остаётся стыд[b].


    8 Но если он перейдёт меру, дух заблуждения[c] войдёт в его ум и заставит пьяного говорить постыдное, поступать беззаконно и не стыдиться, а хвалиться своим бесчестием и считать его добром.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза трудна. Возможно также: «выставил напоказ постыдный покров моих сыновей». Вероятно, речь идёт о том, что грех Иуды с Фамарью сделал явной семейную нечистоту или навлёк на семью позор, однако точный образ остаётся неясным.'
    reason: lexical_alternative
  - marker: b
    text: Слова «пока в нём остаётся стыд» описывают умеренность как сохранение нравственного самообладания. Когда человек теряет стыд и переходит меру, он уже оказывается во власти опьянения.
    reason: cultural_note
  - marker: c
    text: 'Или: «дух ошибки». Греческое πλάνη может обозначать заблуждение, обман или нравственное уклонение.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας
  choice: отвращает ум от истины
  rationale: Передаёт как изменение направления ума, так и нравственное уклонение, не сужая смысл до простого умственного помрачения.
- source_word: ἐμβάλλει ὀργὴν ἐπιθυμίας
  choice: разжигает ярость похоти
  rationale: Сохраняет необычное и напряжённое сочетание гнева или ярости с желанием, не устраняя трудность греческой фразы.
- source_word: τὸ πνεῦμα τῆς πορνείας
  choice: дух разврата
  rationale: Сохраняет персонификацию πνεῦμα и широкий нравственно-сексуальный смысл πορνεία без конфессионального уточнения.
- source_word: ἀφιστῶσι τὴν διάνοιαν
  choice: уводит человеческий разум в сторону
  rationale: Глагол выражает отстранение или уклонение; «разум» естественно передаёт здесь нравственно-интеллектуальную способность человека.
- source_word: συνταράσσει
  choice: приводит ... в смятение
  rationale: 'Передаёт усиленное значение глагола: глубокое внутреннее возмущение и потерю устойчивости.'
- source_word: εἰς πορνείαν ... πρὸς ἡδονήν
  choice: к развратному наслаждению
  rationale: Естественно объединяет направление к πορνεία и цель удовольствия, сохраняя нравственную оценку текста.
- source_word: πάροινος
  choice: предающийся вину
  rationale: Передаёт устойчивую склонность к вину, не отождествляя слово полностью с обозначением уже пьяного человека в следующей части стиха.
- source_word: οὐκ αἰδεῖται οὐδένα
  choice: ни с кем не считается
  rationale: Выражает потерю и стыда перед людьми, и уважения к ним; по-русски звучит естественнее буквального «никого не стыдится».
- source_word: ἐξέκλινα πρὸς τὴν Θαμάρ
  choice: я уклонился к Фамари
  rationale: Сохраняет образ нравственного отклонения и направленность действия к Фамари, не добавляя отсутствующих подробностей.
- source_word: ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου
  choice: обнажил покров нечистоты моих сыновей
  rationale: Намеренно близкая передача трудной метафоры сохраняет её непрозрачность и не решает насильственно, идёт ли речь о семейном позоре, нечистоте или сексуальном обнажении.
- source_word: πολλὴ ... σύνεσις
  choice: нужно великое благоразумие
  rationale: В контексте меры при питье σύνεσις обозначает практическую рассудительность и самообладание, для чего «благоразумие» точнее простого «понимания».
- source_word: αἰσχρορρημονεῖν
  choice: говорить постыдное
  rationale: Передаёт постыдный характер речи, не конкретизируя её как ругань или непристойность сверх греческого текста.
theological_decisions:
- issue: Степень персонификации выражений «дух разврата» и «дух заблуждения»
  choice: Оба выражения переведены буквально-персонифицированно как действующие духи.
  alternative: 'Передать их неперсонифицированно: «развратное влечение» и «заблуждение».'
  rationale: Греческий текст прямо употребляет πνεῦμα и приписывает ему действие. Перевод сохраняет эту богословскую напряжённость, не определяя природу этих духов.
- issue: Кто совершает грех и не стыдится в стихе 3
  choice: В естественном русском тексте субъект выражен как «человек».
  alternative: Сохранить грамматически неясное «оно совершает грех», относя его к телу, вину или духу.
  rationale: Последовательность описывает поведение пьющего человека; экспликация делает фразу понятной, не меняя нравственного содержания, хотя греческая смена субъекта синтаксически не вполне прозрачна.
- issue: Смысл признания Иуды о Фамари и его сыновьях
  choice: 'Трудная метафора переведена близко: «обнажил покров нечистоты моих сыновей».'
  alternative: Истолковать её как обнародование семейного позора или как сексуальное обнажение.
  rationale: Источник допускает более одного понимания. Основной текст не должен превращать один из возможных смыслов в несомненный.
- issue: Допустимость умеренного употребления вина в стихе 7
  choice: 'Сохранена условная формулировка источника: пить лишь пока сохраняется стыд.'
  alternative: Переформулировать как полный запрет пить вино.
  rationale: Хотя начало главы предостерегает от опьянения, стих 7 буквально формулирует предел умеренности. Перевод сохраняет внутреннее напряжение увещания и не вводит более строгой доктрины.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного увещания. Сохранены повторения «вино», «ум», «стыд/стыдиться» и нравственная резкость оригинала. Архаизмы ограничены общеупотребительными библейскими формами («Фамарь», «заповедь Божия», «хананеянка»); синтаксис разделён на ясные фразы без упрощения трудных метафор.
