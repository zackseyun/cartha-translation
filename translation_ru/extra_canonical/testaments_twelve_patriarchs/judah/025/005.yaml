base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/005.yaml
  text: And the deer of Joseph will run in exultation, and the eagles of Israel will fly in joy, and all the peoples will glorify the Lord forever.
translation:
  language: ru
  text: И олени Иакова побегут, ликуя, и орлы Израиля полетят с радостью; нечестивые же будут скорбеть, и грешники — плакать[a], а все народы будут прославлять Господа вовеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «нечестивые же будут скорбеть, и грешники — плакать» в греческом издании заключены в квадратные скобки, что указывает на неуверенность в их принадлежности к исходному тексту.
    reason: Примечание передаёт текстуальную неопределённость, обозначенную квадратными скобками в предоставленном греческом источнике.
lexical_decisions:
- source_word: οἱ ἔλαφοι Ἰακώβ
  choice: олени Иакова
  rationale: Перевод следует греческому тексту α-колонки, где стоит «Иакова», а не «Иосифа», как в английском консультационном слое. ἔλαφοι передано обычным и понятным словом «олени».
- source_word: δραμοῦνται ἐν ἀγαλλιάσει
  choice: побегут, ликуя
  rationale: Причастно-обстоятельственный оборот естественно передаёт образ действия и сохраняет сильную радость, выраженную ἀγαλλίασις.
- source_word: πετασθήσονται ἐν χαρᾷ
  choice: взлетят с радостью
  rationale: «Взлетят» сохраняет направленный образ полёта, а «с радостью» ясно передаёт ἐν χαρᾷ без искусственной буквальности.
- source_word: δοξάσουσι Κύριον εἰς αἰῶνας
  choice: будут прославлять Господа вовеки
  rationale: «Прославлять» соответствует δοξάζω в религиозном контексте; «вовеки» кратко и достойно передаёт εἰς αἰῶνας.
theological_decisions:
- issue: Расхождение имени в образе «оленей»
  choice: Иакова
  alternative: Иосифа
  rationale: Первичным свидетельством задан греческий текст, в котором читается Ἰακώβ. Английский POB служит лишь консультационным слоем и здесь не определяет перевод.
- issue: Текстуально отмеченная фраза о нечестивых и грешниках
  choice: включить в основной текст с примечанием
  alternative: опустить, как в английском POB
  rationale: Фраза присутствует в предоставленном греческом источнике, хотя выделена квадратными скобками, указывающими на текстуальную неуверенность. Её включение с прозрачным примечанием сохраняет и содержание источника, и его неоднозначность.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но понятным библейским звучанием. Параллелизм двух образов и контраст с нечестивыми сохранены; архаизмы сведены к общеупотребительному «вовеки».
