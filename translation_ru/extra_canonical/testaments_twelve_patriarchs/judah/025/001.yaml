source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: XXV. Καὶ¹ μετὰ ταῦτα *ἀναστήσεται Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ εἰς ζωήν², *καὶ ἐγὼ καὶ οἱ ἀδελφοί μου ἔξαρχοι³ *ἐν Ἰσραὴλ ἐσόμεθα⁵, πρῶτος Λευί⁶, δεύτερος ἐγώ⁷, τρίτος Ἰωσήφ⁸, τέταρτος Βενιαμίν⁹, *πέμπτος Συμεών, ἕκτος Ἰσαχάρ¹⁰, καὶ¹² *πάντες καθεξῆς¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/001.yaml
  text: 'And after these things Abraham and Isaac and Jacob will rise to life, and I and my brothers will be rulers of scepters in Israel: Levi first, I second, Joseph third, Benjamin fourth, Simeon fifth, Issachar sixth, and thus all the rest in order.'
translation:
  language: ru
  text: 'И после этого Авраам, Исаак и Иаков воскреснут к жизни, а я и мои братья станем предводителями в Израиле: первым — Левий, вторым — я, третьим — Иосиф, четвёртым — Вениамин, пятым — Симеон, шестым — Иссахар, и все остальные — по порядку.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστήσεται … εἰς ζωήν
  choice: воскреснут для жизни
  rationale: Передаёт буквальное движение «встать/восстать к жизни» естественным русским выражением о воскресении, сохраняя направленность εἰς ζωήν.
- source_word: ἔξαρχοι
  choice: предводителями
  rationale: В данном греческом тексте слово означает руководителей или предводителей. В отличие от английского консультационного слоя, источник не содержит σκήπτρων («скипетров») и не называет племена прямо, поэтому эти элементы не добавлены.
- source_word: πάντες καθεξῆς
  choice: все остальные по порядку
  rationale: Естественно передаёт продолжение перечисления в установленной последовательности; «остальные» выводится из уже названных первых шести.
theological_decisions:
- issue: Характер возвращения патриархов к жизни
  choice: воскреснут для жизни
  alternative: восстанут к жизни
  rationale: Форма ἀναστήσεται в сочетании с εἰς ζωήν наиболее естественно указывает на воскресение, однако перевод не уточняет его время, природу или эсхатологическую схему.
- issue: Статус Иуды и его братьев в Израиле
  choice: предводителями в Израиле
  alternative: главами в Израиле
  rationale: Выбрано нейтральное обозначение руководящей роли без добавления отсутствующих в исходном тексте «скипетров» или «племён» и без уточнения политического либо культового характера власти.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного и пророческого высказывания. Параллельное перечисление сохранено, а порядок подчёркнут краткими именными конструкциями.
