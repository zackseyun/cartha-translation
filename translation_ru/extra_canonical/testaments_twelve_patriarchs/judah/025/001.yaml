  terminology: «Предводителями» — нейтральная и допустимая передача ἔξαρχοι, не навязывающая политическую, племенную или культовую конкретизацию. Имена переданы в устоявшейся русской библейской форме. «По порядку» адекватно передаёт καθεξῆς.
