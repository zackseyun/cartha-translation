- from: 'И после этого Авраам, Исаак и Иаков воскреснут для жизни, а я и мои братья станем предводителями в Израиле: первым — Левий, вторым — я, третьим — Иосиф, четвёртым — Вениамин, пятым — Симеон, шестым — Иссахар, а затем и все остальные по порядку.'
  to: 'И после этого Авраам, Исаак и Иаков воскреснут к жизни, а я и мои братья станем предводителями в Израиле: первым — Левий, вторым — я, третьим — Иосиф, четвёртым — Вениамин, пятым — Симеон, шестым — Иссахар, и все остальные — по порядку.'
  rationale: Сделана только безопасная стилистико-семантическая замена «для жизни» на «к жизни» для более естественной передачи εἰς ζωήν. Перевод ἔξαρχοι как «предводители» сохранён; не добавлены «скипетры» или «племена», которых в предоставленном греческом тексте нет. «И все остальные — по порядку» сохраняет включительное καὶ и последовательное καθεξῆς без излишнего временного оттенка «затем».
