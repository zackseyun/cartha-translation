  source_fidelity: 'Перевод в целом точно передаёт греческий текст: названы патриархи, их восстание εἰς ζωήν, руководящая роль Иуды и братьев ἐν Ἰσραήλ и последовательность перечисления. В исходном α-тексте после ἔξαρχοι нет слова «скипетры» и нет прямого упоминания племён; их отсутствие в русском переводе оправдано и предпочтительно перед английским аудиторским слоем.'
