base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/003.yaml
  text: And you will be the Lord’s people, with one language, and there will not be there a spirit of Belial’s deceit, because it will be thrown into the fire forever.
translation:
  language: ru
  text: И станете вы народом Господа, и будет у вас один язык; и не будет там духа заблуждения Велиара, потому что он будет брошен навеки.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «будет брошен навеки». В предоставленном греческом тексте слова «в огонь» нет.'
    reason: Английский консультационный текст содержит «into the fire», однако это дополнение не подтверждается указанным греческим текстом; примечание делает расхождение прозрачным.
lexical_decisions:
- source_word: λαὸν Κυρίου
  choice: народом Господа
  rationale: Прямо и естественно передаёт греческое выражение, сохраняя библейскую формулу принадлежности Господу.
- source_word: γλῶσσα μία
  choice: один язык
  rationale: Сохраняет конкретный образ единого языка; добавленное по-русски «будет у вас» естественно связывает именную конструкцию с предыдущим будущим временем.
- source_word: πνεῦμα πλάνης
  choice: дух заблуждения
  rationale: 'Передаёт πλάνη без сужения смысла только до обмана: возможны оттенки заблуждения, обольщения и увода с верного пути.'
- source_word: τοῦ Βελιάρ
  choice: Велиара
  rationale: 'Родительный падеж оставлен неоднозначным: это может быть дух, принадлежащий Велиару, исходящий от него или характеризуемый им.'
- source_word: ἐμβληθήσεται
  choice: будет брошен
  rationale: Сохраняет пассивную форму будущего времени и соотносит местоимение с ближайшим смысловым центром — духом заблуждения.
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Точно передаёт временное значение выражения; слово «огонь», присутствующее в английском консультационном тексте, отсутствует в предоставленном греческом источнике и поэтому не внесено в основной текст.
theological_decisions:
- issue: Судьба духа заблуждения Велиара
  choice: «он будет брошен навеки» без указания места
  alternative: «он будет брошен в огонь навеки»
  rationale: В данном греческом тексте после ἐμβληθήσεται стоит лишь εἰς τὸν αἰῶνα; внесение «в огонь» сделало бы явным чтение, которого нет в предоставленном первичном тексте.
- issue: Связь родительного τοῦ Βελιάρ
  choice: «духа заблуждения Велиара»
  alternative: «духа обмана, исходящего от Велиара»
  rationale: Более буквальная конструкция сохраняет синтаксическую и богословскую неоднозначность родительного падежа, не навязывая конкретного вида связи.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Синтаксис слегка упорядочен для естественности, при этом сохранены повтор союза «и», образ одного языка и неоднозначность выражений «дух заблуждения Велиара» и «будет брошен навеки».
