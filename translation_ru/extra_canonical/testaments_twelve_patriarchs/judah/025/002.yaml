base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/002.yaml
  text: And the Lord blessed Levi, but the angel of the presence blessed me; the powers of glory, Simeon; heaven, Reuben; the earth, Issachar; the sea, Zebulun; the mountains, Joseph; the tent, Benjamin; the lights, Dan; delight, Naphtali; the sun, Gad; the moon, Asher.
translation:
  language: ru
  text: И Господь благословил Левия; ангел присутствия — меня; силы славы — Симеона; небо — Рувима; земля — [имя не названо][a]; море — Иосифа; светила — Дана; отрада — Неффалима; солнце — Гада; луна — Асира.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В предоставленном греческом тексте после слова «земля» имя благословляемого не названо; в более полном ряду здесь ожидается Иссахар.
    reason: Сноска сохраняет видимую лакуну первичного текста и сообщает о вероятном месте пропущенного имени, не внося его в основной текст.
lexical_decisions:
- source_word: ὁ ἄγγελος τοῦ προσώπου
  choice: ангел Присутствия
  rationale: Родительное τοῦ προσώπου буквально связано с «лицом», но в данном устойчивом религиозном выражении обозначает непосредственное присутствие перед Богом. «Ангел Присутствия» естественнее в современном русском и не добавляет отсутствующего в греческом притяжательного местоимения.
- source_word: αἱ δυνάμεις τῆς δόξης
  choice: силы славы
  rationale: 'Сохранена формальная широта δυνάμεις: это могут быть силы, могущества или небесные силы; контекст не позволяет безоговорочно конкретизировать.'
- source_word: αἱ φωστῆρες
  choice: светила
  rationale: Так передаётся множественное число со значением небесных источников света без сведения его только к звёздам.
- source_word: ἡ τρυφή
  choice: услада
  rationale: Слово обозначает наслаждение, отраду или роскошь; «услада» сохраняет персонифицированный характер ряда и его положительную окраску.
theological_decisions:
- issue: Эллипсис глагола εὐλόγησε после первого звена
  choice: Передать последующие благословения с помощью тире, подразумевая «благословил(а)»
  alternative: Повторить глагол «благословил/благословили» в каждом звене
  rationale: Греческий ряд после первого звена эллиптичен. Тире естественно воспроизводит эту структуру по-русски и не навязывает каждому небесному или космическому субъекту дополнительного толкования.
- issue: Лакуна после ἡ γῆ
  choice: Открыто обозначить отсутствие названного получателя и снабдить сноской
  alternative: Восстановить «Иссахара» по английскому консультационному тексту или иной версии ряда
  rationale: В предоставленном первичном греческом тексте после «земля» отсутствует винительный объект. Молчаливое восстановление имени превратило бы консультационный слой в основной источник и скрыло бы состояние греческого свидетельства.
- issue: Состав перечня колен и благословляющих реалий
  choice: Перевести только элементы, засвидетельствованные в предоставленном греческом тексте
  alternative: Дополнить отсутствующие пары «Иссахар», «Завулон», «горы», «Вениамин», «шатёр» по английскому POB
  rationale: Первичным основанием указан греческий текст α-колонки. Английская версия свидетельствует о более полном или реконструированном ряде, однако не даёт достаточного основания вставлять эти слова в основной русский текст без греческого свидетельства.
translation_notes:
  register: Современный литературный русский с торжественным, но прозрачным библейским ритмом. Имена переданы в привычной русской библейской форме. Эллиптический перечень оформлен точками с запятой и тире; повреждение или пропуск в источнике не сглажен.
