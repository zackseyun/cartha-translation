reference: Testament of Judah 25:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: '*Καὶ³⁹ ἐν λύπῃ τελευτήσαντες ἀναστήσονται ⁴⁰καὶ οἱ πτωχοὶ⁴¹ διὰ Κύριον⁴³ πλουτισθήσονται⁴⁴ καὶ⁴⁴ οἱ ἀποθνήσκοντες διὰ Κύριον⁴⁵ ἐξυπνισθήσονται⁴⁶ εἰς ζωήν⁴⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/004.yaml
  text: And those who died in sorrow will rise in joy, and the poor because of the Lord will be made rich, and those dying because of the Lord will awake to life.
translation:
  language: ru
  text: И умершие в скорби воскреснут, и бедные благодаря Господу обогатятся, и умирающие ради Господа пробудятся к жизни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν λύπῃ
  choice: в скорби
  rationale: Сохраняет обстоятельственное значение греческого оборота и его сдержанный, возвышенный тон.
- source_word: ἀναστήσονται
  choice: воскреснут
  rationale: В данном эсхатологическом контексте глагол естественно обозначает воскресение умерших.
- source_word: οἱ πτωχοί
  choice: бедные
  rationale: Прямое и понятное соответствие социально-экономическому значению πτωχοί.
- source_word: πλουτισθήσονται
  choice: обогатятся
  rationale: Естественно передаёт пассивную идею «станут богатыми / будут обогащены», не уточняя вид богатства.
- source_word: ἐξυπνισθήσονται εἰς ζωήν
  choice: пробудятся к жизни
  rationale: Сохраняет метафору пробуждения и направленность εἰς ζωήν.
theological_decisions:
- issue: Двукратное διὰ Κύριον допускает разные оттенки причины и посвящённости.
  choice: В первой клаузе — «благодаря Господу», во второй — «ради Господа».
  alternative: «из-за Господа» или единообразное «ради Господа» в обеих клаузах
  rationale: Контекст бедных естественно указывает на Господа как источник их обогащения, тогда как применительно к умирающим выражение обычно обозначает смерть ради Господа. Различие передаёт контекстуальные оттенки одной греческой конструкции, не утверждая более узкой догматической трактовки.
- issue: Английский консультационный текст добавляет «in joy» после «will rise», но в предоставленном греческом тексте соответствующих слов нет.
  choice: Не добавлять «в радости».
  alternative: «воскреснут в радости»
  rationale: Перевод следует первичному греческому свидетельству; ἐν λύπῃ относится к τελευτήσαντες, а выражение со значением «в радости» в данном тексте отсутствует.
translation_notes:
  register: Современный литературный русский язык с кратким, ритмичным построением и сохранением трёх параллельных клауз. Союз «и» повторён в соответствии с греческим полисиндетоном.
