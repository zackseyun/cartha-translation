  rationale: 'Исправлено терминологическое соответствие φυλή → «колено» и восстановлен явный притяжательный параллелизм в третьем члене перечисления. Авторские пояснения через «то есть», модальность «отдал» и значение царских символов сохранены без дополнительной интерпретации. Отдельные сноски не нужны: надстрочные номера в приведённом греческом издании относятся к его критическому аппарату, а не к содержательным примечаниям перевода.'
