base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/003.yaml
  text: I gave my staff—that is, the support of my tribe—and my belt—that is, my strength—and my diadem—that is, the glory of my kingdom.
translation:
  language: ru
  text: Ибо я отдал свой посох — то есть опору моего колена, — и свой пояс — то есть силу, — и свою диадему — то есть славу моего царства.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδον
  choice: посох
  rationale: Передаёт конкретный предмет и сохраняет его символическое истолкование как опоры племени.
- source_word: στήριγμα
  choice: опора
  rationale: Естественный современный эквивалент со значением поддержки и устойчивости.
- source_word: φυλῆς
  choice: племени
  rationale: В контексте патриархальных колен обозначает родоплеменную общность Иуды; «племя» понятно без внесения лишней конфессиональной окраски.
- source_word: ζώνην
  choice: пояс
  rationale: Прямой и естественный эквивалент предмета, символически истолкованного в тексте как сила.
- source_word: δύναμιν
  choice: силу
  rationale: Сохраняет широкое значение δύναμις без уточнения характера силы.
- source_word: διάδημα
  choice: диадему
  rationale: Точно передаёт царский знак достоинства и согласуется с последующим упоминанием царства.
- source_word: δόξαν τῆς βασιλείας μου
  choice: славу моего царства
  rationale: Формально и естественно сохраняет связь между царской диадемой и славой царства.
theological_decisions:
- issue: Символическое значение трёх отданных предметов
  choice: Сохранены явные авторские пояснения «то есть» без дальнейшей интерпретации.
  alternative: Раскрыть предметы как пророческие или династические символы.
  rationale: Греческий текст сам задаёт соответствия, но не требует уточнять их богословское или историческое исполнение.
- issue: Значение φυλή применительно к Иуде
  choice: «племя»
  alternative: «колено»
  rationale: «Племя» является понятным современным обозначением родовой общности; при этом контекст не был дополнительно сужен до специального библейского термина «колено».
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной речи. Параллельная трёхчастная структура оригинала сохранена; вставные толкования выделены тире. Начальное γάρ передано словом «ибо», поскольку оно связывает утверждение с предшествующим рассуждением.
