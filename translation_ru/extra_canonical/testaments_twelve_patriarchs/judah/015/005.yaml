base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/005.yaml
  text: And the angel of God showed me that women rule forever over king and beggar alike, and they take away a king's glory and a strong man's might and the poor man's support.
translation:
  language: ru
  text: 'И ангел Божий показал мне, что женщины имеют власть над царём и бедняком; они господствуют над ними: у царя они отнимают славу, у мужчины — силу, а у бедняка — самую малую опору в нищете.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст в конце стиха синтаксически неровен; буквально: «у бедняка — самую малую опору нищеты».'
    reason: Примечание отмечает реальную синтаксическую трудность греческого текста и объясняет естественную русскую передачу, не устраняя его неоднозначность.
lexical_decisions:
- source_word: κρατοῦσι τοῦ βασιλέως καὶ τοῦ πτωχοῦ
  choice: подчиняют себе и царя, и бедняка
  rationale: Глагол κρατέω с родительным падежом здесь означает властвовать над кем-либо, держать кого-либо в своей власти; добавленное в английском слое «forever» в греческом источнике отсутствует.
- source_word: κατακυριεύουσιν
  choice: господствуют над ними
  rationale: Передаёт усиленное значение «властвовать, господствовать» и сохраняет повтор мысли после κρατοῦσι.
- source_word: αἴρουσιν
  choice: отнимая
  rationale: В данном перечислении означает лишение царя славы, мужчины силы и бедняка опоры.
- source_word: τὴν δόξαν
  choice: славу
  rationale: Прямое и естественное соответствие δόξα в контексте царского достоинства.
- source_word: τὴν δύναμιν
  choice: силу
  rationale: Сохраняет широкое значение δύναμις без неоправданного сужения до физической силы.
- source_word: ἐλάχιστον στήριγμα
  choice: даже самую малую опору
  rationale: Сохраняет превосходную степень ἐλάχιστος и смысл скудной, минимальной опоры бедняка.
