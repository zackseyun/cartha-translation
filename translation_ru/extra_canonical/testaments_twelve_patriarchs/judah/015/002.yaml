source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Κἂν γάρ τις *βασιλεὺς ἐστι² καὶ πορνεύῃ, γυμνοῦται τῆς βασιλείας*, δουλεύσας τῇ πορνείᾳ⁶ ὡς κἀγὼ ἔπαθον⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/002.yaml
  text: For even if a man is a king and commits sexual immorality, he is stripped of his kingship, having been enslaved to sexual immorality, as I also suffered.
translation:
  language: ru
  text: Ибо даже если человек — царь и предаётся разврату, он лишается царской власти, став рабом разврата, как и я это испытал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνεύῃ
  choice: предаётся разврату
  rationale: Передаёт длительное или практикуемое сексуально безнравственное поведение естественным современным русским выражением.
- source_word: γυμνοῦται τῆς βασιλείας
  choice: лишается царской власти
  rationale: Греческое «обнажается/остаётся без царства» здесь означает утрату царского достоинства или власти; формулировка сохраняет образ утраты без неестественной буквальности.
- source_word: δουλεύσας τῇ πορνείᾳ
  choice: став рабом разврата
  rationale: Сохраняет метафору рабства и смысл подчинения разврату.
- source_word: ὡς κἀγὼ ἔπαθον
  choice: как это случилось и со мной
  rationale: Передаёт личное признание Иуды; ἔπαθον обозначает пережитое им пагубное последствие.
theological_decisions:
- issue: Связь царского статуса и сексуального греха
  choice: Сохранено прямое утверждение об утрате царской власти вследствие порабощения развратом.
  alternative: Истолковать «царство» как духовное достоинство или будущее спасение.
  rationale: Греческий текст не уточняет метафизический или эсхатологический смысл βασιλεία; перевод не должен снимать эту смысловую напряжённость конфессиональным толкованием.
translation_notes:
  register: Современный литературный русский язык, сдержанный и назидательный тон. «Царь» и «царская власть» естественно передают βασιλεύς и βασιλεία в данном контексте; метафора рабства сохранена.
