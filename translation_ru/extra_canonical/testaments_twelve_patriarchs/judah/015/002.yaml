revisions:
- from: Ведь даже если человек — царь, но предаётся разврату, он лишается царской власти, став рабом разврата, как это случилось и со мной.
  to: Ибо даже если человек — царь и предаётся разврату, он лишается царской власти, став рабом разврата, как и я это испытал.
  rationale: Убрано не поддержанное оригиналом противопоставительное «но» и уточнено личное признание в заключительной части. Смысловой объём βασιλεία не сужается до политического, духовного или эсхатологического толкования.
  reviewer_model: gpt-5.6-terra
