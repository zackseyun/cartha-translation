base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/001.yaml
  text: The one who commits sexual immorality, while being ruined, does not perceive it; and while being dishonored, he is not ashamed.
translation:
  language: ru
  text: Кто предаётся разврату,[a] не сознаёт, что его обнажают,[b] и, терпя бесчестие,[c] не стыдится.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «совершивший половую безнравственность». Греческое слово охватывает различные формы недозволенных половых отношений.'
    reason: Поясняет широкое значение πορνεύω и форму греческого причастия, не сужая смысл.
  - marker: b
    text: 'Буквально: «будучи обнажаем». Этот образ может также подразумевать лишение защиты, разорение или позор.'
    reason: Сохраняет буквальный образ γυμνούμενος и отмечает возможные переносные оттенки без выбора одного из них в основном тексте.
  - marker: c
    text: 'Или: «будучи обесчещен»; буквально: «будучи без чести, доброго имени».'
    reason: 'Передаёт широкий смысл ἀδοξῶν: бесчестие, отсутствие общественного признания или унижение.'
lexical_decisions:
- source_word: Ὁ πορνεύσας
  choice: Кто предаётся разврату
  rationale: Субстантивированное причастие передаёт человека, совершающего половую безнравственность. «Предаётся разврату» естественно по-русски и сохраняет нравственную силу πορνεύω без неоправданного сужения до одного конкретного вида проступка.
- source_word: γυμνούμενος
  choice: как обнажается
  rationale: Сохраняется конкретный образ греческого глагола «обнажаться, лишаться покрова», а не принимается контекстуально возможное, но менее буквальное толкование «губит себя».
- source_word: οὐκ αἰσθάνεται
  choice: не замечает
  rationale: Передаёт отсутствие осознания происходящего; в данном контексте звучит естественнее буквального «не чувствует».
- source_word: ἀδοξῶν
  choice: теряя честь
  rationale: Причастие связано с утратой славы, почёта или доброго имени. «Теряя честь» выражает этот процесс по-русски, не сводя его только к внешнему унижению.
- source_word: οὐκ αἰσχύνεται
  choice: не стыдится
  rationale: Прямое и естественное соответствие греческому выражению.
theological_decisions:
- issue: Образ γυμνούμενος
  choice: Сохранить образ обнажения
  alternative: «губя себя» / «разоряясь»
  rationale: Греческий текст буквально говорит об обнажении или лишении покрова. Хотя это может подразумевать разорение, уязвимость или позор, перевод не должен молча выбирать одно толкование.
- issue: Смысл ἀδοξῶν
  choice: «теряя честь»
  alternative: «подвергаясь бесчестью» / «будучи обесчещен»
  rationale: Греческая форма допускает оттенки пребывания без чести и утраты доброй славы. Выбранная формулировка сохраняет процессуальность причастия и параллель с «обнажается».
translation_notes:
  register: Современный литературный русский язык с краткой афористической структурой. Сохранён параллелизм двух причастных оборотов и нравственно-наставительный тон; архаизмы и конфессионально окрашенная терминология избегаются.
