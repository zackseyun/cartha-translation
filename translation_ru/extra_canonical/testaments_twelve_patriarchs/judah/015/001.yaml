  terminology: «Разврат» — уместная современная обобщающая передача πορνεύω, без искусственного сужения значения. «Обнажают» сохраняет буквальный образ γυμνούμενος; сноска отмечает возможные переносные следствия, не навязывая их. «Бесчестие» точно передаёт отсутствие чести, доброго имени или общественного признания в ἀδοξῶν.
