  source_fidelity: Первая часть черновика передаёт общий смысл, но союз «как» превращает причастие γυμνούμενος («будучи обнажаем / лишаясь покрова») в придаточное образа действия и ослабляет параллельное обстоятельственное значение греческих причастий. «Теряя честь» допустимо как толкование ἀδοξῶν, но глагол прежде всего обозначает пребывание в бесчестии или унижении, а не обязательно процесс утраты чести. Предлагаемый текст сохраняет образ обнажения и одновременность обоих состояний. Английский аудитный вариант толкует γυμνούμενος как «being ruined»; такое толкование возможно контекстуально, но не должно вытеснять буквальный образ в русском основном тексте.
