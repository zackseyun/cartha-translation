id: T12P.JUD.15.4
reference: Testament of Judah 15:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καίγε *μετανοήσας ἐπὶ τούτοις¹⁴, οἶνον καὶ κρέα¹⁶ οὐκ¹⁷ ἔφαγον ἕως γήρους¹⁹ μου²⁰, καὶ *πᾶσαν εὐφροσύνην²¹ οὐκ εἶδον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/004.yaml
  text: And indeed, having repented concerning these things, I ate neither wine nor meat until my old age, and I saw no joy at all.
translation:
  language: ru
  text: И действительно, раскаявшись в этом, я до самой старости не вкушал ни вина, ни мяса и не видел никакой радости.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: И действительно
  rationale: Передаёт усилительно-подтвердительный оттенок частицы в естественной современной русской форме.
- source_word: μετανοήσας ἐπὶ τούτοις
  choice: раскаявшись в этом
  rationale: Сохраняет нравственно-религиозный смысл μετανοέω и соотносит раскаяние с ранее упомянутыми поступками.
- source_word: οἶνον καὶ κρέα οὐκ ἔφαγον
  choice: не вкушал ни вина, ни мяса
  rationale: Конструкция «ни… ни…» ясно передаёт общее отрицание; «вкушал» позволяет естественно отнести глагол и к вину, и к мясу, не исправляя необычность греческого выражения чрезмерно буквально.
- source_word: ἕως γήρους μου
  choice: до самой старости
  rationale: Естественно передаёт продолжительность воздержания вплоть до старости говорящего.
- source_word: πᾶσαν εὐφροσύνην οὐκ εἶδον
  choice: не видел никакой радости
  rationale: Сохраняет образный глагол «видеть» и категоричность отрицания.
theological_decisions:
- issue: Характер μετανοήσας
  choice: раскаявшись
  alternative: изменив своё решение
  rationale: В данном контексте речь идёт не просто о перемене мнения, а о нравственном раскаянии в совершённом; при этом перевод не добавляет конфессионально специфического содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан плавным и понятным, а образ «не видел никакой радости» сохранён близко к греческому тексту.
