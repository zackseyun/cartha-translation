  text: After these things[a], Er my son took Tamar for himself as a wife, from Mesopotamia, a daughter of Aram. But Er was wicked, and an angel of the Lord killed him. And I gave her to Onan, my second son, and behold, the Lord struck him down also. For he did not know her, through the scheming of his mother, because he did not want to have children by her. During the days of the bridal chamber I gave Onan to her in levirate marriage; yet he too, in wickedness, did not know her, though he was with her for a year. And when I threatened him, he went in to her[b], but he wasted the seed on the ground, according to the command of his mother. So he too died in wickedness. And I wanted to give Shelah also to her, but his mother did not allow it; for she acted wickedly, because Tamar was not from the daughters of Canaan[d][c], as she herself was.
translation:
  language: ru
  text: X. После этого[a] мой сын Ир взял себе в жёны Фамарь — дочь Арама из Месопотамии. 2 Ир был нечестив, и ангел Господа умертвил его[b]. 3 И он не познал её из-за коварного замысла своей матери, потому что не хотел иметь от неё детей[c]. 4 Во время брачных дней я отдал ей Онана, чтобы он исполнил долг брата умершего[d]. Но и он, поступая нечестиво, не познал её, хотя пробыл с ней год. 5 Когда же я пригрозил ему, он сошёлся с ней, но погубил семя на земле, исполняя веление своей матери. И он умер в своём нечестии. 6 Я хотел отдать ей и Шелу, но его мать не позволила. Она поступила нечестиво, потому что Фамарь была не из дочерей Ханаана, как она сама.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческих свидетелях встречаются небольшие различия в последовательности событий и указаниях времени; в некоторых из них здесь также помещён рассказ о передаче Фамари Онану и о его смерти от руки Господа.
    reason: textual_variant
  - marker: b
    text: Греческое выражение можно передать как «ангел Господа»; оно не требует отождествлять этого ангела с особой библейской фигурой, традиционно называемой «Ангелом Господним».
    reason: lexical_alternative
  - marker: c
    text: «Познать» здесь — библейское иносказательное обозначение половой близости.
    reason: lexical_alternative
  - marker: d
    text: Речь идёт об обязанности брата умершего дать ему потомство через его вдову; ср. Бытие 38.
    reason: cultural_note
lexical_decisions:
- source_word: πονηρός / ἐν πονηρίᾳ / ἐπονηρεύσατο
  choice: нечестив / поступая нечестиво / в своём нечестии / поступила нечестиво
  rationale: Сохраняет сильную и повторяющуюся нравственную оценку Ира, Онана и матери, не сводя её к общей характеристике «плохой».
- source_word: ἄγγελος Κυρίου
  choice: ангел Господа
  rationale: Передаёт безартиклевую греческую конструкцию без отождествления с особой фигурой «Ангела Господня»; русский язык не позволяет буквально выразить неопределённый артикль.
- source_word: ἔγνω / οὐκ ἔγνω αὐτήν
  choice: познал / не познал её
  rationale: Сохраняет библейский эвфемизм, пояснённый в сноске, и возвышенный регистр.
- source_word: πανουργία
  choice: коварный замысел
  rationale: Передаёт намеренную хитрость и направляющую роль матери естественным современным русским выражением.
- source_word: ἔχειν τέκνα ἐξ αὐτῆς
  choice: иметь от неё детей
  rationale: Естественно передаёт репродуктивный и родовой смысл выражения.
- source_word: ἐπεγυμβρευσα αὐτῇ
  choice: отдал ей Онана, чтобы он исполнил долг брата умершего
  rationale: Явно передаёт левиратный смысл редкого глагола, не создавая впечатления обычного брака.
- source_word: ἐν ταῖς ἡμέραις τοῦ θαλάμου
  choice: во время брачных дней
  rationale: Передаёт свадебно-брачный период понятнее, чем буквальное и неестественное «в дни чертога».
- source_word: συνῆλθε μὲν αὐτῇ
  choice: он сошёлся с ней
  rationale: Сохраняет эвфемистическое обозначение половой связи и остаётся понятным современному читателю.
- source_word: διέφθειρε τὸ σπέρμα ἐπὶ τὴν γῆν
  choice: погубил семя на земле
  rationale: Следует сильному значению διέφθειρε и сохраняет конкретный образ греческого текста, не заменяя его медицинской терминологией.
- source_word: οὐκ ἀφῆκεν
  choice: не позволила
  rationale: Ясно передаёт, что мать воспрепятствовала намерению Иуды.
- source_word: τῶν θυγατέρων τῶν Χαναναίων
  choice: из дочерей Ханаана
  rationale: Сохраняет семейно-этническую библейскую формулу исходного текста.
theological_decisions:
- issue: Кто умертвил Ира
  choice: 'Сохранено прямое указание греческого текста: Ира умертвил ангел Господа.'
  alternative: Передать смерть как непосредственное действие Господа или добавить отсутствующее в основном тексте описание смерти Онана от удара Господа.
  rationale: Основной предоставленный греческий текст называет ангела Господа только в связи с Иром; перевод не гармонизирует его с иными свидетелями и не вносит отсутствующую фразу.
- issue: Левиратный долг Онана
  choice: Смысл обычая раскрыт в тексте как исполнение долга брата умершего и дополнительно пояснён в сноске.
  alternative: Оставить общий глагол «женить» или употребить малопонятный термин «левиратный брак» без пояснения.
  rationale: Греческий глагол обозначает культурно определённую обязанность; ясное раскрытие смысла помогает читателю и не навязывает богословской трактовки.
- issue: Причина отказа Ира от супружеской связи
  choice: Сохранена связь с коварным замыслом матери и нежеланием Ира иметь детей от Фамари.
  alternative: Перенести эти слова на Онана вслед за иной последовательностью чтений.
  rationale: В представленном основном греческом тексте местоимение αὐτός в стихе 3 непосредственно относится к Иру; неоднозначность рукописной последовательности отмечена в сноске.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейским достоинством. Имена переданы в привычной русской библейской форме: Ир, Фамарь, Онан, Шела, Арам, Ханаан. Архаизмы ограничены смыслонесущим эвфемизмом «познал» и формулой «дочери Ханаана»; оба выражения либо пояснены, либо прозрачны из контекста. Нумерация следует предоставленному греческому тексту, без добавления отсутствующего в нём материала из консультационного английского слоя.'
