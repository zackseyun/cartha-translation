review_pass:
  verdict: revise
  source_fidelity: Черновик в целом верно передаёт запрет на погребение в дорогом облачении и повеление доставить говорящего в Хеврон. Однако ἐσθῆτι стоит в единственном числе («одеянии», «одежде»), тогда как «в роскошных одеждах» меняет число без необходимости. Английский POB-слой относится к иному, оборванному тексту и не может служить подтверждением данного перевода; приоритетно следует греческому источнику.
  naturalness: Фраза звучит естественно в современном литературном русском с умеренным библейским регистром. «Покоятся» является уместным восполнением эллиптического «где также мои отцы», но более точно в данном погребальном контексте сказать «погребены».
  terminology: «Хеврон» передан правильно. «Отцы» сохраняет библейско-родовое обозначение οἱ πατέρες μου; в связной русской фразе «мои отцы» допустимо. «Дорогое одеяние» точнее соответствует единственному числу πολυτελεῖ ἐσθῆτι, чем множественное «роскошные одежды».
  issues:
  - severity: low
    issue: Изменено число существительного в выражении ἐν πολυτελεῖ ἐσθῆτι.
    rationale: 'Греческое ἐσθῆτι — дательный падеж единственного числа: «в дорогом/роскошном одеянии». Русское единственное число здесь естественно и сохраняет форму источника.'
  - severity: low
    issue: «Покоятся» несколько шире, чем эллиптическое греческое выражение «где и мои отцы».
    rationale: В контексте распоряжения о погребении «где также погребены мои отцы» ясно восполняет подразумеваемую информацию и не утверждает ничего о посмертном состоянии.
  revised_text: Пусть никто не хоронит меня в дорогом одеянии; отнесите меня в Хеврон, где также погребены мои отцы.
