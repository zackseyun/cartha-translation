translation:
  language: ru
  text: Пусть никто не хоронит меня в дорогом одеянии; отнесите меня в Хеврон, где также погребены мои отцы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνταφιάσει
  choice: хоронит
  rationale: Передаёт прямое значение глагола «погребать, хоронить» в естественной современной русской форме.
- source_word: ἐν πολυτελεῖ ἐσθῆτι
  choice: в роскошных одеждах
  rationale: Сохраняет смысл дорогого, пышного погребального облачения; множественное «одеждах» по-русски звучит естественнее собирательного единственного.
- source_word: ἀναγάγετε
  choice: отнесите
  rationale: В контексте перенесения тела в Хеврон глагол означает доставить или отнести туда; направление «вверх» не выражено отдельно, чтобы избежать неестественного русского оборота.
- source_word: οἱ πατέρες μου
  choice: мои отцы
  rationale: Сохранено буквальное родовое обозначение предков, соответствующее библейскому регистру.
theological_decisions:
- issue: Подразумеваемое состояние отцов в Хевроне
  choice: где покоятся и мои отцы
  alternative: где и мои отцы
  rationale: В греческом сказуемое эллиптически опущено. «Покоятся» естественно восполняет его в погребальном контексте, не добавляя утверждения о загробном состоянии.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Перевод следует представленному греческому тексту, а не расходящемуся с ним английскому консультационному слою.
