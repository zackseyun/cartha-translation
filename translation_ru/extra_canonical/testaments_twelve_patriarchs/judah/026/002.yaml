- from: Пусть никто не хоронит меня в роскошных одеждах; отнесите меня в Хеврон, где покоятся и мои отцы.
  to: Пусть никто не хоронит меня в дорогом одеянии; отнесите меня в Хеврон, где также погребены мои отцы.
  rationale: Исправлено только неоправданное множественное число «одеждах» на соответствующее греческому единственному числу «одеянии» и уточнено контекстуально подразумеваемое сказуемое в заключительной эллиптической части. Повелительное «отнесите» сохранено как естественная передача ἀναγάγετε в контексте перенесения тела. Неиспользуемый английский аудитный текст не отражает данный греческий фрагмент.
