  source_fidelity: 'Начальная часть передана точно: «Итак», обращение «дети мои», повеление соблюдать «весь закон Господа» и причинный союз сохранены. Однако «кто прямо идёт Его путями» заменяет переходный греческий глагол κατευθύνουσι («направляют; делают прямыми») непереходным «идёт» и тем самым не вполне воспроизводит образ исходного текста. Английское «in righteousness» не имеет опоры в приведённом греческом тексте и не должно добавляться.'
