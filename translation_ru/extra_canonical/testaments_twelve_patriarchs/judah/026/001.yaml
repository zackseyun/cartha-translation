  text: Therefore keep, my children, the whole law of the Lord, for it is hope for all who keep his ways in righteousness.
translation:
  language: ru
  text: Итак, дети мои, соблюдайте весь закон Господа, ибо он — надежда для тех, кто делает прямыми Его пути.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξατε
  choice: соблюдайте
  rationale: В сочетании с «законом» глагол естественно означает верное исполнение и хранение предписаний.
- source_word: πάντα τὸν νόμον Κυρίου
  choice: весь закон Господа
  rationale: Сохранены полнота, выраженная словом πάντα, и родительный оборот Κυρίου.
- source_word: ἐλπὶς
  choice: надежда
  rationale: Прямое соответствие греческому существительному без конкретизации предмета надежды.
- source_word: τοῖς κατευθύνουσι τὰς ὁδοὺς αὐτοῦ
  choice: для тех, кто прямо идёт Его путями
  rationale: Κατευθύνω передаёт направленность и прямоту движения; русский оборот сохраняет образ путей и звучит естественнее буквального «выпрямляет Его пути».
theological_decisions:
- issue: Связь закона Господа с надеждой
  choice: «он — надежда»
  alternative: «в нём надежда»
  rationale: Именная конструкция греческого текста утверждает, что закон является надеждой; более объяснительное «в нём» не вводится.
- issue: Нравственный смысл κατευθύνουσι
  choice: «прямо идёт»
  alternative: «соблюдает в праведности»
  rationale: Сохранена метафора прямого пути, присутствующая в греческом; слово «праведность» в данном тексте явно не выражено.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Обращение «дети мои» и метафора путей сохранены; добавление английского consultation layer «for all» не воспроизведено, поскольку в представленном греческом стоит просто артиклированное «для тех, кто…».
