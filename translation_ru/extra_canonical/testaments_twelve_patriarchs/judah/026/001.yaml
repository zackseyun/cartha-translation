    rationale: Оборот «прямо идёт Его путями» передаёт общую этическую мысль, но не действие над «путями», выраженное в греческом переходным глаголом. «Делают прямыми Его пути» сохраняет объект, образ пути и значение κατευθύνω без добавления «праведности».
