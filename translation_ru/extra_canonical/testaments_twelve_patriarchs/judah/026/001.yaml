  terminology: «Соблюдайте весь закон Господа» и «надежда» удачны. Местоимение αὐτοῦ оставлено с прописной буквы по ближайшему и естественному в контексте отнесению к Господу; исходная греческая формулировка при этом не разъясняется доктринально.
