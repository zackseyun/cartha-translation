  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/026/003.yaml
  text: And he fell asleep in a good old age. And his sons did as he had commanded them, and they carried him up to Hebron and buried him there with his fathers.
translation:
  language: ru
  text: Сказав это, он почил. Его сыновья во всём исполнили то, что он им заповедал, и похоронили его с его отцами в Хевроне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκοιμήθη
  choice: почил
  rationale: Передаёт буквальный образ сна как благоговейный эвфемизм смерти и соответствует достоинству завещательного повествования.
- source_word: κατὰ πάντα ὅσα ἐνετείλατο αὐτοῖς
  choice: во всём исполнили то, что он им заповедал
  rationale: Сохраняет полноту исполнения и силу глагола ἐντέλλομαι, не сводя его к нейтральной просьбе.
- source_word: ἔθαψαν αὐτὸν μετὰ τῶν πατέρων αὐτοῦ ἐν Χεβρών
  choice: похоронили его с его отцами в Хевроне
  rationale: Следует представленному греческому тексту и сохраняет традиционную родовую формулу «с его отцами».
theological_decisions:
- issue: Эвфемизм смерти как сон
  choice: почил
  alternative: умер
  rationale: Греческое ἐκοιμήθη буквально обозначает «уснул» и здесь служит эвфемизмом смерти; «почил» естественно сохраняет этот образ без дополнительного толкования.
- issue: Расхождение греческого источника и английского консультационного текста
  choice: Не добавлять «в доброй старости» и отдельное «перенесли его в Хеврон»
  alternative: Включить обе детали по английскому POB
  rationale: В предоставленном греческом тексте отсутствует выражение о доброй старости, а Хеврон прямо относится к месту погребения; перевод основан прежде всего на исходном свидетельстве.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Синтаксис упрощён для ясности, при этом сохранены последовательность действий и родовая погребальная формула греческого текста.
