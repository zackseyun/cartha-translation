  source_fidelity: 'Русский текст точно передаёт греческую последовательность и содержание: «Сказав это» соответствует Καὶ ταῦτα εἰπών; «почил» уместно передаёт эвфемистическое ἐκοιμήθη; «во всём исполнили то, что он им заповедал» отражает κατὰ πάντα ὅσα ἐνετείλατο αὐτοῖς; погребение «с его отцами в Хевроне» следует имеющемуся греческому тексту. Английские детали о «доброй старости» и перенесении в Хеврон не имеют опоры в предоставленном греческом фрагменте, поэтому обоснованно не включены.'
