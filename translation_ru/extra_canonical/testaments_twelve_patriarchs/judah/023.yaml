base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023.yaml
  text: 'Until the coming of the God of righteousness[a], to give Jacob rest in peace, and all the nations. And he will preserve the might of my kingdom forever; for the Lord swore to me with an oath not to blot out the kingdom.


    Great indeed is my grief, my children, because of the acts of sexual immorality and sorceries that you will practice in the kingdom, following ventriloquists and omens and demons of deception. You will make your daughters musicians and prostitutes, and you will mingle in the abominations of the nations. Because of these things the Lord will bring upon you famine and pestilence, death and a sword of vengeance, siege, and the insults of enemies and friends[d][c][b]. By foreigners my kingdom will be brought to its end.'
translation:
  language: ru
  text: '**Завещание Иуды, 23**


    **1** Велика моя скорбь, дети мои, из-за распутства и колдовства, которым вы предадитесь в царстве, следуя за чревовещателями[a], гадательными знамениями и бесами заблуждения. **2** Вы сделаете своих дочерей музыкантками и публичными женщинами[b] и приобщитесь к мерзостям народов.


    **3** За это Господь наведёт на вас голод и мор, смерть и карающий меч, осаду, псов, которые будут разрывать вас на части, поношения от врагов, гибель от врагов, омертвение глаз, умерщвление младенцев, разграбление имущества, сожжение храмов Божьих, опустошение земли, а вас самих отдаст в рабство среди народов. **4** Ваших сыновей оскопят, чтобы сделать евнухами для их женщин.


    **5** Так будет, пока Господь ваш не посетит вас, когда вы раскаетесь всем сердцем и будете жить по всем Его заповедям, и не выведет вас из плена среди народов[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорящими из чрева». В древности этим словом могли называть медиумов, которые, как считалось, говорили голосом духа.'
    reason: cultural_note
  - marker: b
    text: Греч. «музыкантками и публичными [женщинами]». В данном контексте «публичные женщины», вероятно, означает проституток и может подразумевать как развлечение публики, так и сексуальную эксплуатацию.
    reason: lexical_alternative
  - marker: c
    text: 'Греческое построение стиха неровно. Форму, переданную здесь как «раскаетесь», можно также понимать как призыв: «раскайтесь всем сердцем и живите по всем Его заповедям»; после этого говорится, что Господь выведет народ из плена.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἀσελγείας
  choice: распутства
  rationale: Слово обозначает бесстыдную нравственную, особенно половую, распущенность; «распутство» естественно и достаточно конкретно по-русски.
- source_word: γοητείας
  choice: колдовства
  rationale: Передаёт запрещённые магические практики без архаического или конфессионально окрашенного уточнения.
- source_word: ἐγγαστρομύθους
  choice: чревовещателями
  rationale: Сохраняет буквальный образ «говорящих из чрева»; культурный смысл как обозначение духов-медиумов пояснён в сноске.
- source_word: κληδόσι
  choice: знамениями
  rationale: Речь идёт о знаках или случайных речениях, истолковываемых в гадательных целях; «знамения» сохраняет некоторую широту значения.
- source_word: δαίμοσιν πλάνης
  choice: бесами заблуждения
  rationale: Формально сохраняет родительную конструкцию, не решая, означает ли она качество, источник или действие заблуждения.
- source_word: μουσικὰς καὶ δημοσίας
  choice: музыкантшами и публичными женщинами
  rationale: Первое слово прямо указывает на музыкальных исполнительниц; второе буквально значит «публичными» и в данном сочетании, вероятно, подразумевает проституток. Необычность исходной пары сохранена и пояснена.
- source_word: ἐπιμιγήσεσθε
  choice: приобщитесь
  rationale: Передаёт смешение или вступление в связь, не сужая смысл исключительно до полового союза.
- source_word: κύνας εἰς διασπασμόν
  choice: псов, которые будут разрывать вас на части
  rationale: Разворачивает сжатую греческую конструкцию в ясную русскую фразу, сохраняя её жестокий конкретный образ.
- source_word: σφακελισμὸν ὀφθαλμῶν
  choice: омертвение глаз
  rationale: σφακελισμός обозначает омертвение или гангренозное поражение; буквальный патологический образ сохранён, хотя выражение необычно.
- source_word: ὑπαρχόντων ἁρπαγήν
  choice: разграбление имущества
  rationale: ὑπάρχοντα в данном контексте означает владения или имущество, а ἁρπαγή — их насильственное похищение.
- source_word: ἐπισκέψηται
  choice: посетит
  rationale: 'Сохраняет библейски значимую широту глагола: Божье посещение может подразумевать вмешательство, попечение или суд.'
theological_decisions:
- issue: Причинная связь между грехами и перечисленными бедствиями
  choice: «За это Господь наведёт на вас…»
  alternative: «Вместо этого Господь приведёт на вас…»
  rationale: Ἀνθ᾽ ὧν здесь естественно выражает воздаяние за перечисленные поступки. Формулировка не смягчает утверждение текста о Божьем суде.
- issue: Неоднозначный оборот о посещении Господа, покаянии и возвращении из плена в стихе 5
  choice: Покаяние оформлено как вставное обстоятельство внутри конструкции «пока не… и не…»
  alternative: «Пока Господь ваш не посетит вас, вы не раскаетесь… и Он не выведет вас…»
  rationale: 'Греческий синтаксис неровен: ἐπισκέψηται и ἀναγάγῃ стоят в сослагательном наклонении, тогда как μεταμελήθητε может пониматься как форма повелительного наклонения или как текстуально затруднённая часть временной конструкции. Перевод сохраняет связь избавления с искренним покаянием, не превращая её в более разработанную доктринальную формулу.'
- issue: Множественное «храмы Божьи»
  choice: Сохранено «храмов Божьих»
  alternative: «храма Божьего»
  rationale: Источник имеет множественное ναῶν θεοῦ. Оно сохранено, несмотря на возможное историко-богословское напряжение, и не исправлено по ожиданиям позднейшей традиции.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательно-пророческой речи. Перечень бедствий передан ритмично, но без сокращений и эвфемизмов. Архаизмы сведены к минимуму; «чревовещатели» оставлено ради конкретного образа источника и снабжено пояснением. Переведён только предоставленный греческий текст главы XXIII; вступительные строки английского консультационного слоя относятся к иному исходному фрагменту и в данный текст не включены.
