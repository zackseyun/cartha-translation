  naturalness: «Музыкантками» — современнее и стилистически нейтральнее, чем разговорно-оценочное «музыкантшами». «Жить по всем Его заповедям» естественнее, чем «ходить по всем Его заповедям». Перестройка последней фразы делает русскую связь условий и избавления яснее, оставляя синтаксическую оговорку в сноске.
