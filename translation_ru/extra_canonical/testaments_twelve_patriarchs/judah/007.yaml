  text: '1. And on the next day it was reported to us that the king of the city of Gaas was coming against us with a great multitude.


    2. So Dan and I, pretending to be Amorites as though allies, entered their city.


    3. And in the deep night, when our brothers came, we opened the gates to them, and we destroyed all of them and all that was theirs; and after plundering everything that belonged to them, we tore down their three walls.


    4. And we drew near to Thamna, where all their baggage was.


    5. Then, being insulted by them, I became angry, and I rushed up against them to the summit. And they kept hurling stones and shooting arrows at me.


    6. And if Dan my brother had not fought alongside me,'
translation:
  language: ru
  text: '1. На следующий день нам сообщили, что царь города Гааса идёт на нас с многочисленным войском.


    2. Тогда мы с Даном отправились к аморреям и, притворившись их союзниками, вошли в их город.


    3. Глубокой ночью к нам подошли мои братья. Мы открыли им ворота, истребили их всех и разграбили город.


    4. Затем мы приблизились к Фамне, где находился весь обоз вражеских царей.


    5. Они оскорбляли меня, и я, разгневавшись, бросился на них к вершине. Они же метали в меня камни из пращей и стреляли из луков.


    6. И если бы мой брат Дан не сражался рядом со мной…'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν λαῷ πολλῷ
  choice: с многочисленным войском
  rationale: В военном контексте λαός обозначает собранных людей царя, то есть войско; буквальное «с многочисленным народом» по-русски менее ясно.
- source_word: προσποιησάμενοι αὐτοῖς συμμάχους
  choice: притворившись их союзниками
  rationale: Греческий текст говорит о притворном союзничестве с аморреями, а не о том, что Иуда и Дан выдавали себя за аморреев.
- source_word: ἐπρονομεύσαμεν
  choice: разграбили его
  rationale: Глагол означает «разграбить, предать грабежу»; подразумеваемым объектом по контексту является город.
- source_word: ἀποσκευή
  choice: обоз
  rationale: В военном повествовании слово обозначает багаж, имущество и снаряжение, сопровождающее войско; «обоз» естественно передаёт этот смысл.
- source_word: ἐσφενδόνιζον με ἐν λίθοις
  choice: метали в меня камни из пращей
  rationale: Передаёт как орудие, выраженное глаголом, так и названный материал — камни.
- source_word: τοξεύοντες
  choice: стреляли из луков
  rationale: Глагол буквально относится к стрельбе из лука; объект «стрелы» в греческом не выражен.
- source_word: συνεμάχησεν
  choice: сражался рядом со мной
  rationale: Передаёт совместное участие Дана в бою без усиления смысла до спасения или победы, которых фрагмент не утверждает.
theological_decisions:
- issue: Незавершённое условное предложение в стихе 6
  choice: Сохранить обрыв фразы многоточием
  alternative: Дополнить следствием из иных текстовых свидетельств или английского слоя
  rationale: Предоставленный греческий источник заканчивается придаточным условия и не содержит главной части; дополнение было бы необоснованным разрешением текстовой лакуны.
- issue: Объект истребления в стихе 3
  choice: «всех жителей города»
  alternative: «их всех»
  rationale: Местоимение πάντας αὐτούς по контексту относится к находившимся в городе противникам; явное обозначение референта делает русский текст понятным, не добавляя богословского толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным регистром. Синтаксис сделан ясным для широкого читателя, при этом сохранены военный характер рассказа, вспышка гнева Иуды и незавершённость последней фразы. Материал английского консультационного слоя о разрушении трёх стен не включён, поскольку его нет в предоставленном греческом тексте.
