  text: 1[a]. And on the next day we went to Areta, a city still mighty and strong, threatening us with death. 2. But I and Gad attacked from the east of the city, and Reuben and Levi from the west. 3. And those on the wall, thinking that we were alone[b], were drawn out toward us. 4. So my brothers secretly, from both sides of the wall, climbed it with stakes and entered the city without their knowing it. 5. And we took it by the edge of the sword, and those who had fled for refuge in the towers we burned with fire; and so we captured them all. 6. And as we were departing, men of Thapphoue fell upon our captives; and after handing them over to our sons, we joined battle with them as far as Thapphoue. 7. And we killed them also, and burned the city[c], and everything in it.
translation:
  language: ru
  text: 'Завещание Иуды, 5


    1. На следующий день мы пошли в Арету, могучий город, грозивший нам смертью. Я и Гад подошли к городу с востока, а Рувим и Левий — с запада.


    2. Стоявшие на стене, решив, что мы одни, двинулись к нам.


    3. И стена взметнулась[a].


    4. Тогда мои братья тайно вошли в город с обеих сторон стены.


    5. Мы взяли город остриём меча, а тех, кто укрылся в башне, сожгли огнём. Так мы захватили всех и всё их имущество.


    6. Когда мы уходили, люди из Бавуэ[b] захватили наших пленников. Увидев это, мы вступили с ними в бой.


    7. Мы убили их всех и снова забрали своих пленников.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст здесь буквально гласит: «стена взметнулась». Вероятно, это повреждённое или искажённое чтение; по смыслу могло подразумеваться, что нападавшие вскочили или взобрались на стену. В других формах текста проникновение в город описано подробнее.'
    reason: textual_variant
  - marker: b
    text: Написание названия «Бавуэ» в греческой рукописной традиции неустойчиво; встречаются и другие формы этого топонима.
    reason: textual_variant
lexical_decisions:
- source_word: κραταιάν
  choice: могучий
  rationale: В представленном греческом тексте стоит одно усилительное прилагательное, а не пара синонимов; перевод сохраняет силу выражения, не добавляя отсутствующего определения.
- source_word: ἀπειλοῦσαν ἡμῖν θάνατον
  choice: грозивший нам смертью
  rationale: Естественно передаёт причастную конструкцию и прямую угрозу смерти.
- source_word: προσέφθημεν ἀπὸ ἀνατολῶν
  choice: подошли ... с востока
  rationale: Глагольная форма в данном тексте трудна, однако контекст описывает согласованное приближение к городу с противоположных сторон; «подошли» не усиливает смысл до явно не выраженного нападения.
- source_word: ἐφειλκύσθησαν πρὸς ἡμᾶς
  choice: двинулись к нам
  rationale: Передаёт направленное движение защитников к отряду Иуды, не навязывая предположения о приманке сверх текста.
- source_word: λάθρα
  choice: тайно
  rationale: Кратко и ясно сохраняет смысл скрытного проникновения.
- source_word: ἐν στόματι μαχαίρας
  choice: остриём меча
  rationale: Русский библейский военный оборот естественно передаёт греческую идиому «устами меча».
- source_word: τοὺς ἐν τῷ πύργῳ καταφυγόντας
  choice: тех, кто укрылся в башне
  rationale: Сохраняет единственное число «башня» и значение поиска убежища.
- source_word: πάντα τὰ αὐτῶν
  choice: всё их имущество
  rationale: В контексте взятия города субстантивированное выражение обозначает принадлежавшее жителям; «имущество» естественно выражает это по-русски.
- source_word: τὴν αἰχμαλωσίαν ἡμῶν
  choice: наших пленников
  rationale: Абстрактно-собирательное существительное в военном повествовании обозначает захваченных людей; тот же выбор последовательно сохранён в стихе 7.
- source_word: συνῆψαν πόλεμον μετ᾽ αὐτῶν
  choice: мы вступили с ними в бой
  rationale: Контекст и предшествующее «мы, увидев» указывают на отряд Иуды как участника боя, хотя форма сказуемого в представленном тексте грамматически затруднительна.
theological_decisions:
- issue: Неясная формулировка стиха 3
  choice: Сохранено буквальное «И стена взметнулась» с примечанием
  alternative: Исправить текст по смыслу как «они взобрались на стену» или присоединить действие к стиху 4
  rationale: Представленный основной греческий текст грамматически говорит о стене как подлежащем. Молчаливое исправление устранило бы реальную текстовую трудность.
- issue: Содержание стихов 6–7
  choice: 'Переведён представленный греческий текст: жители Бавуэ захватывают пленников, Иуда с братьями вступает в бой, убивает противников и возвращает пленников'
  alternative: Включить передачу пленников сыновьям, преследование до другого города и сожжение города
  rationale: Эти дополнительные детали имеются в английском консультационном слое или иных формах текста, но отсутствуют в предоставленном основном греческом тексте; потому они не внесены в основной перевод.
- issue: Насилие в повествовании
  choice: Описательные утверждения переданы прямо, без смягчения и без богословского оправдания
  alternative: Эвфемизировать убийство и сожжение либо добавить нравственную оценку
  rationale: Перевод должен сохранять напряжение повествования и не привносить конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Синтаксис сделан ясным для широкого читателя, но необычные и текстологически трудные места не сглажены. Перевод следует представленному греческому тексту α-колонки, а английский POB использован только как консультационный материал.
