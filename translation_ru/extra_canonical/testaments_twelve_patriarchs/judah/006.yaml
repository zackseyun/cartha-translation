lexical_decisions:
- source_word: ἐν τοῖς ὕδασι Χωζηβά
  choice: у вод Хозевы
  rationale: Множественное число ὕδασι сохранено естественным русским оборотом «у вод», а топоним передан транслитерацией греческой формы.
- source_word: οἱ ἀπὸ Ἰωβὴλ / οἱ ἀπὸ Σιλὼμ / οἱ ἀπὸ Μαχίρ
  choice: жители Иовела / Силома / Махира
  rationale: Конструкция οἱ ἀπό обозначает людей из названного места; «жители» ясно передаёт смысл и не превращает топонимы в этнонимы.
- source_word: ἐφ᾽ ἡμᾶς εἰς πόλεμον
  choice: пошли на нас войной
  rationale: Русский устойчивый оборот сохраняет и направленность враждебного движения, и явное указание на войну.
- source_word: συνάψαντες ἐτρέψαμεν
  choice: вступив с ними в бой, мы обратили их в бегство
  rationale: В военном контексте συνάπτω означает вступить в схватку, а τρέπω — обратить неприятеля в бегство.
- source_word: διέξοδον
  choice: пути для отступления
  rationale: Слово означает выход или путь наружу; в данном военном контексте «путь для отступления» звучит естественно и конкретно.
- source_word: ἐν κραταιᾷ μαχαίρᾳ
  choice: с могучим мечом
  rationale: Сохранён конкретный образ сильного или могучего меча без замены его отвлечённым описанием силы нападения.
- source_word: τὴν ἀνάβασιν
  choice: по склону
  rationale: В контексте укреплённого города на горе существительное обозначает подъём или восходящий путь; «подняться по склону» естественно по-русски.
- source_word: ἐξωλοθρεύσαμεν
  choice: полностью уничтожили
  rationale: Передаёт усиленное значение глагола без архаичного или конфессионально окрашенного оборота.
theological_decisions:
- issue: Повреждённый синтаксис стиха 3
  choice: Передать вероятный тактический смысл как «устремившись на них», снабдив место примечанием
  alternative: Буквально воспроизвести несогласованную форму «он присоединяет/добавляет к ним» либо исправить греческий текст без пояснения
  rationale: Так сохраняются связность повествования и прозрачность текстологической трудности без скрытой эмендации.
- issue: Неясная фраза о Симеоне в стихе 5
  choice: Сохранить принятое контекстуальное восполнение «Симеона и остальных», но отметить повреждение и неоднозначность местоимения
  alternative: Перевести только буквально сохранившиеся слова или однозначно определить, за кем их спрятали
  rationale: Источник, по-видимому, дефектен; примечание не позволяет выдать реконструкцию за бесспорное чтение и сохраняет подлинную неоднозначность.
- issue: Объём главы в предоставленном свидетельстве
  choice: Перевести только пять предоставленных стихов
  alternative: Дополнить главу по другим рукописям или современным переводам
  rationale: Приоритет имеет данный греческий источник; отсутствующий материал не реконструируется без рукописных данных.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего военного повествования, но без церковнославянизмов. Синтаксис сделан ясным для обычного читателя; топонимы транслитерированы по греческим формам. Текстовые нарушения не сглажены без примечаний.
