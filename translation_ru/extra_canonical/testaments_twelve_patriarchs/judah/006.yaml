  terminology: Топонимы последовательно транслитерированы; «Симеон», «союзники», «могучий меч» и «полностью уничтожили» приемлемы. «Возможности прорваться к нам» точнее передаёт спорное, но направленно ясное τοῦ εἰσελθεῖν πρὸς ἡμᾶς, чем «пути для отступления».
