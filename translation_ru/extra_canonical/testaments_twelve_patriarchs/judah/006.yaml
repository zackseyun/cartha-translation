  text: 1. And when I was at the waters of Chozeba[a], those from Jobel came against us for battle. 2. And joining battle, we put them to flight; and we killed those from Shilom, their allies, and gave them no way of escape. 3. But those from Machir attacked us again on the fifth day; and charging at them with a mighty sword[b], we prevailed over them and killed them before they could scale the ascent. 4. And as we came to the city, their women were rolling stones down on us from the summit of the mountain on which the city stood[c]. 5. And having hidden Simeon and the others behind them, we seized the height, and utterly destroyed this city also.
translation:
  language: ru
  text: '6


    1 Когда я был у вод Хозевы[a], жители Иовела пошли на нас войной. 2 Вступив с ними в бой, мы обратили их в бегство; жителей Силома, их союзников, мы убили и не оставили им пути для отступления. 3 Но на пятый день жители Махира вновь напали на нас; устремившись на них с могучим мечом[b], мы одолели их и убили прежде, чем они успели подняться по склону. 4 Когда мы подошли к городу, их женщины стали скатывать на нас камни с вершины горы, на которой стоял город[c]. 5 Спрятав Симеона и остальных позади них[d], мы овладели высотой и полностью уничтожили также и этот город.


    [a] Названия «Хозева», «Иовел» и «Силом» передают формы греческой рукописи; их точное отождествление остаётся неясным.


    [b] Греческий текст в этом месте синтаксически нарушен: форма προσδίδωσι («он/она дополнительно даёт; присоединяет») не согласуется с повествованием от первого лица множественного числа. Перевод передаёт вероятный смысл боевого действия, не исправляя текст молча.


    [c] В греческом тексте перед словом «город» дважды повторён артикль τῇ — очевидная ошибка переписчика. В переводе он передан один раз.


    [d] Греческая фраза в начале стиха повреждена или неполна; буквально в ней читается нечто вроде «спрятав и Симеона позади». Слова «и остальных» следуют принятому пониманию контекста, а местоимение «них» может относиться к противникам либо к женщинам.'
