  text: '1[a]. For it leads astray, because in the delusion of silver they call those who are not gods gods, and it makes the one who has it fall into frenzy. 2. Because of silver I lost my children; and if my repentance and my humiliation, and the prayers of my father, had not come to my aid, I would have died childless. 3. But the God of my fathers had mercy on me, because I did this in ignorance[b]. 4. For the ruler of deceit blinded me, and I was ignorant as a man, and, as flesh corrupted in sins, I recognized my own weakness, thinking myself invincible.


    5. Understand, then, my children, that two spirits attend a man: the spirit of truth and the spirit of deceit. 6. And between them is the conscience of the mind, to which it may incline as it wills. 7. The works of truth and the works of deceit are written upon the breast of a man, and the Lord knows each one of them. 8. And there is no time when the works of men can escape his notice, for they are inscribed before the Lord upon the breast. 9. And the spirit of truth testifies against all things, and the sinner is burned up by his own heart[c], and cannot lift up his face to the judge.'
translation:
  language: ru
  text: '**Завещание Иуды, 20**


    1. Итак, знайте, дети мои: при человеке пребывают два духа — дух истины и дух заблуждения. 2. А между ними находится совесть[a], и человек может склониться туда, куда пожелает. 3. Каждый из них распознаётся по делам людей, ибо в груди их костей написано пред Господом[b]. 4. И нет такого времени, когда человек сможет взять дела людей[c], ибо в груди их костей написано пред Господом. 5. Дух истины обвиняет всех; грешник воспламеняется от собственного сердца и не может поднять лица перед Судьёй.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст этого места труден; в других формах текстовой традиции встречается более развёрнутое выражение, которое можно понять как «разумение ума» или «совесть разума».
    reason: textual_variant
  - marker: b
    text: 'Буквально: «в груди их костей написано пред Господом». Выражение необычно и, вероятно, сохранилось в повреждённом виде. Неясно также, относится ли «пред Господом» к месту записи или к её совершению; перевод сохраняет эту неопределённость и телесную образность.'
    reason: textual_difficulty
  - marker: c
    text: 'Греческий текст буквально говорит: «нет времени, когда человек сможет взять дела людей». Смысл глагола «взять» в этом контексте неясен. В других формах традиции и по общему контексту речь, вероятно, идёт о том, что человеческие дела не могут укрыться от ведения и суда Господа.'
    reason: textual_difficulty
lexical_decisions:
- source_word: δύο πνεύματα
  choice: два духа
  rationale: Сохраняет явный духовный язык греческого текста, не сводя его ни к чисто психологическим побуждениям, ни к строго определённым сверхъестественным существам.
- source_word: σχολάζουσι τῷ ἀνθρώπῳ
  choice: при человеке пребывают
  rationale: Передаёт присутствие и деятельность духов в отношении человека, не уточняя сверх меры характер этой связи.
- source_word: ἀλήθεια
  choice: истина
  rationale: Прямой и естественный эквивалент, сохраняющий нравственное и духовное противопоставление истине и заблуждению.
- source_word: πλάνη
  choice: заблуждение
  rationale: Передаёт уклонение от истины и нравственное введение в ошибку; «обман» было бы более узким и предполагало бы прежде всего сознательное мошенничество.
- source_word: συνείδησις
  choice: совесть
  rationale: Сохраняет внутреннюю нравственную способность человека, помещённую текстом между двумя духами.
- source_word: κλῖναι
  choice: склониться
  rationale: Сохраняет образ направленного нравственного выбора без добавления отсутствующего в тексте объекта.
- source_word: γνωρίζεται κατὰ τὰ ἔργα
  choice: распознаётся по делам
  rationale: Передаёт мысль о том, что природа каждого духа становится известна через человеческие поступки.
- source_word: ἐν στήθει τῶν ὀστέων αὐτῶν
  choice: у них в груди, среди костей
  rationale: Сохраняет необычную телесную образность испорченного или трудного греческого выражения, не заменяя её истолковывающим словом «сердце».
- source_word: κατηγορεῖ
  choice: обвиняет
  rationale: Передаёт судебный оттенок глагола и подготавливает упоминание Судьи в конце стиха.
- source_word: ἐμπεπύρισται
  choice: воспламеняется
  rationale: Сохраняет образ внутреннего огня и допускает как мучение совестью, так и более широкую судебную образность.
- source_word: ἆραι πρόσωπον
  choice: поднять лицо
  rationale: Естественно передаёт идиому о способности предстать перед Судьёй без стыда и страха.
theological_decisions:
- issue: Природа двух духов
  choice: Сохранены как «дух истины» и «дух заблуждения», пребывающие при человеке.
  alternative: Истолковать их как два психологических побуждения либо как строго определённых ангельского и демонического существ.
  rationale: Греческое πνεύματα требует сохранить духовную реальность образа, но сам отрывок не даёт оснований окончательно определять её онтологический статус.
- issue: Свобода нравственного склонения
  choice: Человек может склониться туда, куда пожелает.
  alternative: Представить совесть как самостоятельно выбирающий субъект или снять указание на волю человека.
  rationale: Неясное место связывает внутреннюю способность с возможностью склонения; перевод сохраняет нравственную ответственность, не выстраивая из краткой фразы законченную доктрину свободы воли.
- issue: Внутреннее обвинение и суд
  choice: Дух истины обвиняет, а грешник воспламеняется от собственного сердца и не может поднять лица перед Судьёй.
  alternative: Свести огонь исключительно к психологическим угрызениям совести либо исключительно к будущему наказанию.
  rationale: Текст соединяет внутреннее сердце с судебной сценой, не уточняя, является ли огонь только переживаемым ныне осуждением или также образом окончательного суда.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксис сделан ясным для обычного читателя, но необычная образность груди и костей, судебная лексика и напряжение между действием духов, совестью и человеческим выбором сохранены. Нумерация следует предоставленному греческому тексту главы XX (стихи 1–5), а не расширенной английской консультационной разбивке.
