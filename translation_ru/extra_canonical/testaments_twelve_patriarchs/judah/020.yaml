review_pass:
  verdict: revise
  source_fidelity: В целом верно переданы два духа, совесть, судебная образность и внутреннее воспламенение грешника. Однако в ст. 3 добавлен отсутствующий в греческом объект («всё»), а выражение «записано Господом» излишне определяет двусмысленное παρὰ Κυρίου. В ст. 4 основной текст заменяет крайне трудное греческое «взять дела людей» контекстуальным истолкованием («остаться незамеченными»). Поскольку предоставленный греческий текст следует ставить первым и трудность отмечена, это место следует передать осторожнее, сохранив его неясность.
  naturalness: Русский текст в целом литературен, ясен и выдержан в наставительном регистре. Формула «в груди, среди костей» несколько тяжеловесна, но оправдана стремлением сохранить необычную телесную образность. Более естественное «в груди их костей» позволяет сохранить ту же синтаксическую странность источника без добавления толкования.
  terminology: '«Дух истины», «дух заблуждения», «совесть», «Судья» и «обвиняет» уместны и не навязывают конфессионального прочтения. В ст. 3–4 предпочтительно «написано пред Господом»: оно передаёт судебно-учётный образ и не решает спорно, является ли Господь писцом или местом/инстанцией записи.'
  issues:
  - severity: medium
    issue: 'Ст. 3: добавлено «всё» и уточнено «записано Господом».'
    rationale: В греческом тексте нет слова «всё», а конструкция παρὰ Κυρίου допускает более чем одно отношение к Господу. Добавление делает неясную фразу более определённой, чем источник.
  - severity: high
    issue: 'Ст. 4: «дела людей не смогут остаться незамеченными» заменяет буквальное, хотя и трудное, «человек сможет взять дела людей».'
    rationale: Английская консультационная версия обоснованно отражает общий смысл традиции, но первичный греческий текст содержит иную и неясную формулировку. Её следует оставить в основном тексте и пояснить сноской, а не устранять.
  - severity: low
    issue: 'Ст. 5: «обвиняет во всём» не вполне ясно передаёт πάντων.'
