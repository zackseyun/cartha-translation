  text: For it was a law of the Amorites that a widow should sit openly in prostitution.
translation:
  language: ru
  text: '2. Ведь у аморреев был закон: овдовевшая женщина должна была семь дней сидеть на виду у ворот.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сидеть впереди у ворот». Вероятно, имеется в виду сидеть там открыто, на заметном месте.'
    reason: Поясняет пространственный оттенок редкого глагола προκαθεσθαι, не превращая возможный контекстуальный смысл в часть перевода.
lexical_decisions:
- source_word: Νόμος ... ἦν τῶν Ἀμορραίων
  choice: у аморреев был закон
  rationale: Естественно передаёт греческую конструкцию принадлежности и сохраняет прямое указание на обычай аморреев.
- source_word: τὴν χηρεύουσαν
  choice: овдовевшая женщина
  rationale: Причастие обозначает женщину, ставшую вдовой; такая передача точнее и естественнее буквального «вдовствующая».
- source_word: προκαθεσθαι
  choice: сидеть на виду
  rationale: Глагол выражает сидение впереди, на открытом или заметном месте; «на виду» передаёт публичный характер действия без внесения отсутствующего в данном греческом тексте указания на проституцию.
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: семь дней
  rationale: Временное значение ἐπί с винительным передано обычной русской конструкцией длительности.
- source_word: παρὰ τὴν πύλην
  choice: у ворот
  rationale: Передаёт расположение возле ворот; определённый артикль не требует искусственного уточнения, о каких именно воротах идёт речь.
theological_decisions:
- issue: Связь обычая с проституцией
  choice: Не добавлять упоминание проституции
  alternative: «сидеть открыто, занимаясь проституцией»
  rationale: В предоставленном греческом источнике нет слов πορνεία или иного прямого обозначения проституции. Возможный контекстуальный подтекст нельзя вводить в основной текст как явно сказанное.
translation_notes:
  register: Современный литературный русский язык; фраза ясная и сдержанная. Сохранены конкретные детали греческого текста — семь дней и место у ворот, отсутствующие в английском консультационном слое.
