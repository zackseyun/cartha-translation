  text: Καλέσας δὲ αὐτὴν⁴⁵, ἤκουσα καὶ τοὺς ἐν μυστηρίῳ λόγους⁴⁶, *οὓς καθεύδων σὺν αὐτῇ ἐν τῇ μέθῃ μου⁴⁷ ἐλάλησα. *Καὶ οὐκ ἠδυνήθην ἀνελεῖν αὐτήν, ὅτι παρὰ Κυρίου ἦν⁴⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/006.yaml
  text: And when I called her, I also heard the secret words that, while sleeping with her in my drunkenness, I had spoken. And I was not able to kill her, because it was from the Lord.
translation:
  language: ru
  text: Позвав её, я услышал и тайные слова, которые произнёс, когда в пьяном виде спал с ней. И я не смог убить её, потому что это было от Господа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς ἐν μυστηρίῳ λόγους
  choice: тайные слова
  rationale: Передаёт слова, произнесённые втайне или составлявшие тайну, не добавляя толкования их содержания.
- source_word: καθεύδων σὺν αὐτῇ
  choice: спал с ней
  rationale: 'Сохраняет естественную для контекста двусмысленность: выражение может обозначать как совместное пребывание во сне, так и половую близость.'
- source_word: ἐν τῇ μέθῃ μου
  choice: в пьяном виде
  rationale: Современная и естественная передача состояния опьянения без стилистически тяжёлого буквального оборота «в моём пьянстве».
- source_word: ἀνελεῖν
  choice: убить
  rationale: В данном контексте глагол означает лишить жизни; прямой русский эквивалент звучит ясно и естественно.
- source_word: παρὰ Κυρίου
  choice: от Господа
  rationale: Сохраняет указание на исходящий от Господа источник или обусловленность события.
theological_decisions:
- issue: Неопределённый референт выражения ὅτι παρὰ Κυρίου ἦν
  choice: потому что это было от Господа
  alternative: потому что она была от Господа
  rationale: Греческая конструкция не называет подлежащее явно. Нейтральное «это» сохраняет возможность отнести слова к событию, обстоятельству или происходящему в целом и не навязывает отнесение непосредственно к женщине.
translation_notes:
  register: Современный литературный русский язык с прямым, сдержанным повествованием. Синтаксис близок к греческому, но перестроен ради естественного русского звучания; неоднозначность выражений «спал с ней» и «это было от Господа» сохранена.
