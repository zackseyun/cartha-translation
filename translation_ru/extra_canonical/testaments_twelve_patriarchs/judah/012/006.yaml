  source_fidelity: 'Текст точно передаёт греческий оригинал: причастный оборот Καλέσας δὲ αὐτήν естественно воспроизведён как «Позвав её»; καὶ при ἤκουσα сохранено союзом «и»; τοὺς ἐν μυστηρίῳ λόγους передано без излишней конкретизации как «тайные слова». Оборот «когда в пьяном виде спал с ней» сохраняет связь обстоятельств с произнесением слов и не устраняет присущую σὺν αὐτῇ двусмысленность. Нейтральное «это было от Господа» обоснованно сохраняет невыраженный референт греческого ἦν.'
