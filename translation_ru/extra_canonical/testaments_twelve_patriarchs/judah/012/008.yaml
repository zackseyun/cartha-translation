lexical_decisions:
- source_word: ἤγγισα αὐτῇ
  choice: приближался к ней
  rationale: Сохраняет прямое значение греческого выражения и его возможный контекстуальный оттенок близости, не делая его более явным, чем оригинал.
- source_word: ἔτι
  choice: больше не
  rationale: В сочетании с отрицанием естественно передаёт значение «уже не / больше не».
- source_word: ἕως τῆς ζωῆς μου
  choice: до конца своей жизни
  rationale: Идиоматичный современный русский эквивалент временного выражения со смыслом «в течение всей оставшейся жизни».
theological_decisions:
- issue: Дополнительная причинная фраза в английском консультационном тексте
  choice: Не включать фразу «потому что я совершил эту мерзость во всём Израиле»
  alternative: Добавить её вслед за английским POB
  rationale: Этой фразы нет в предоставленном греческом тексте; перевод следует первичному оригинально-языковому свидетельству и не вносит текстовое расширение.
