  text: After this, when Tamar had been a widow for two years and heard that I was going up to shear the sheep, she adorned herself with bridal attire and sat in Enaim, at the city gate of the inn.
translation:
  language: ru
  text: 12. После этого Фамарь, прожив два года вдовой и услышав, что я поднимаюсь стричь овец, нарядилась в брачный наряд и села в Енане, в городе, у ворот.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в Енане, в городе, у ворот». Греческий текст не упоминает постоялый двор; синтаксическая связь слов допускает различное понимание топонима и указания места.'
    reason: Сохраняет синтаксическую неоднозначность заключительной фразы и поясняет, что представленный греческий текст не содержит «постоялого двора».
lexical_decisions:
- source_word: χηρευούσης ... μετὰ ἔτη δύο
  choice: прожив два года вдовой
  rationale: Естественно передаёт греческую генитивную конструкцию и длительность вдовства, не утяжеляя русскую фразу.
- source_word: ἀνέρχομαι
  choice: я иду
  rationale: Глагол буквально означает «поднимаюсь / иду вверх», но без ясного географического ориентира по-русски естественнее нейтральное «иду».
- source_word: τοῦ κεῖραι τὰ πρόβατα
  choice: стричь овец
  rationale: Инфинитив цели передан естественной русской конструкцией; речь идёт о стрижке овец.
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  choice: нарядилась в брачный наряд
  rationale: Сохраняет смысл специального наряда, связанного с невестой или браком, и словесную выразительность однокоренных форм κοσμηθεῖσα / κόσμῳ.
- source_word: ἐν Ἐνὰν
  choice: в Енаиме
  rationale: Название передано как топоним; форма «Енаим» согласуется с известным библейским названием места и русской традицией его передачи.
- source_word: τῇ πόλει πρὸς τὴν πύλην
  choice: у городских ворот
  rationale: Передаёт естественный смысл «у ворот города» без внесения отсутствующего в греческом упоминания постоялого двора.
