  source_fidelity: Русский текст передаёт обе части греческого предложения, включая вторую клаузу, отсутствующую в английском аудиторском слое. «Поступила коварно» точно отражает ἐν δολιότητι ἐποίησε; деепричастие «получив» корректно передаёт предшествующее/сопутствующее действие λαβοῦσα. «От другой женщины» обоснованно воспроизводит женский род субстантивированного ἑτέρας. Риторические вопросы адекватно передают μήποτε в данном контексте.
