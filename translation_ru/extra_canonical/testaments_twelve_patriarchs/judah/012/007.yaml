  terminology: «Залоги» уместно передаёт множественное число τοὺς ἀρραβῶνας как предметы обеспечения. Терминологически значимых богословских выражений в стихе нет. Сноска b надлежащим образом сохраняет лексическую неопределённость πρώτοις («прежними» / «первоначальными»).
