  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/007.yaml
  text: For I said, “Perhaps she acted deceitfully, having received the pledge from another.”
translation:
  language: ru
  text: '7. Ибо я говорил: «Не поступила ли она коварно, получив залоги от другой женщины[a], и не обратилась ли ко мне с прежними словами[b]?»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от другой»; греческая форма — женского рода.'
    reason: Отмечает грамматически выраженный род и буквальную возможность более краткой передачи.
  - marker: b
    text: 'Или: «с первоначальными словами».'
    reason: πρῶτος может означать как «прежний, сказанный раньше», так и «первоначальный, первый»; контекст не устраняет эту неоднозначность полностью.
lexical_decisions:
- source_word: ἐν δολιότητι ἐποίησε
  choice: поступила коварно
  rationale: Передаёт греческое выражение естественно по-русски, сохраняя значение намеренного обмана.
- source_word: τοὺς ἀρραβῶνας
  choice: залоги
  rationale: Множественное число соответствует греческому тексту и обозначает отданные в обеспечение предметы.
- source_word: παρὰ ἑτέρας
  choice: от другой женщины
  rationale: Субстантивированное ἑτέρας имеет форму женского рода; перевод следует первичному греческому свидетельству, не оставляя грамматически выраженный род без передачи.
- source_word: τοῖς πρώτοις λόγοις ἐχρήσατο πρὸς ἐμέ
  choice: обратилась ко мне с прежними словами
  rationale: Естественно передаёт конструкцию χρῆσθαι с дательным и сохраняет возможную отсылку к сказанному ранее.
