source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: '*Καὶ ἐκκλίνας²⁶ πρὸς αὐτὴν εἶπον²⁶· *Εἰσέρχομαι²⁷ πρὸς σε. *Καὶ²⁸ εἶπεν¹³¹· Τί μοι δώσεις³²; καὶ δέδωκα³³ αὐτῇ τὴν ῥάβδον μου καὶ τὸ διάδημά μου³⁷ *εἰς ἀρραβῶνα³⁸. *Καὶ ὡς συνήλθον³⁹ αὐτῇ συνελήφθη⁴⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/004.yaml
  text: And turning aside to her, I said, “I will come in to you.” And she said, “What will you give me?” And I gave her my staff and my ring and the diadem of my kingdom as a pledge. And when I had gone in to her, she conceived.
translation:
  language: ru
  text: 'И, свернув к ней, я сказал: «Я войду к тебе». Она спросила: «Что ты мне дашь?» И я отдал ей в залог свой посох и свою диадему. И когда я сошёлся с ней, она зачала.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλίνας πρὸς αὐτήν
  choice: свернув к ней
  rationale: Передаёт физическое уклонение с пути в её сторону и сохраняет связь с повествованием Быт 38:16.
- source_word: Εἰσέρχομαι πρὸς σε
  choice: Я войду к тебе
  rationale: Сохранён эвфемистический библейский оборот с ясным в контексте сексуальным значением.
- source_word: ῥάβδον
  choice: посох
  rationale: Естественное соответствие предмету, служащему личным залогом.
- source_word: διάδημα
  choice: диадема
  rationale: Греческий текст называет один предмет — диадему; добавленное в английском consultation layer слово ring не имеет соответствия в данном исходном тексте.
- source_word: εἰς ἀρραβῶνα
  choice: в залог
  rationale: Точно передаёт предметы, оставленные как обеспечение обещанной платы.
- source_word: συνήλθον αὐτῇ
  choice: сошёлся с ней
  rationale: Естественный русский эвфемизм, сохраняющий сексуальное значение глагола в контексте.
- source_word: συνελήφθη
  choice: она зачала
  rationale: В данном контексте глагол означает наступление беременности.
theological_decisions:
- issue: Число и состав предметов, отданных в залог
  choice: посох и диадема
  alternative: посох, кольцо и диадема царства
  rationale: Предоставленный греческий текст содержит только τὴν ῥάβδον μου καὶ τὸ διάδημά μου — «мой посох и мою диадему». Перевод не вносит отсутствующие слова «кольцо» и «царства» из английского слоя.
- issue: Передача полового союза
  choice: эвфемистические выражения «войду к тебе» и «сошёлся с ней»
  alternative: эксплицитное описание полового акта
  rationale: Сохранён сдержанный эвфемистический характер греческого текста без смягчения причинно-следственной связи с зачатием.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис сделан естественным, но повторяющееся «И» преимущественно сохранено. Текст переведён непосредственно по предоставленной греческой α-колонке; расхождения английского POB с греческим источником не перенесены.
