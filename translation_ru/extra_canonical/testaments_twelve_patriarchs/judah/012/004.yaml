  terminology: «Посох», «диадема», «в залог», «зачала» выбраны точно. Эвфемизмы не становятся ни излишне прямыми, ни неясными в контексте. Английский audit trail содержит добавления «ring» и «of my kingdom», однако в представленном греческом источнике им не соответствуют слова; русская версия обоснованно не переносит эти добавления.
