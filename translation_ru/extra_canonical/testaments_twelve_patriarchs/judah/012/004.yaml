  source_fidelity: 'Русский текст точно передаёт предоставленный греческий текст α-колонки. ἐκκλίνας πρὸς αὐτήν естественно передано как «свернув к ней»; сохранены эвфемистические формулы «войду к тебе» и «сошёлся с ней», а συνελήφθη правильно истолковано в данном контексте как «она зачала». Перечень залога соответствует именно греческому тексту: «посох и диадема».'
