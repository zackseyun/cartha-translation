- source_word: ἑβδομήκοντα καὶ τρία ἔτη ἐποίησα εἰς Αἴγυπτον
  choice: семьдесят три года я провёл в Египте
  rationale: ἔτη ποιεῖν в данном контексте означает проводить годы; εἰς с названием места передано идиоматическим русским «в Египте», как указание на место проживания.
