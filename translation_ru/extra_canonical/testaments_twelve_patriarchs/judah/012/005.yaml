  text: But I, not knowing what I had done, wanted to kill her. But she sent the pledges secretly and put me to shame.
translation:
  language: ru
  text: 5. Я же, не зная, что сделал, хотел убить её. Но она тайно прислала залоги и пристыдила меня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγνοῶν
  choice: не зная
  rationale: Естественно передаёт причастие настоящего времени и сохраняет причинно-обстоятельственный оттенок.
- source_word: ἀνελεῖν
  choice: убить
  rationale: В данном контексте глагол означает лишить жизни; прямой русский эквивалент сохраняет резкость высказывания.
- source_word: τοὺς ἀρραβῶνας
  choice: залоги
  rationale: Речь идёт о предметах, оставленных в обеспечение обещанной платы; «залоги» точно и лаконично передаёт смысл.
- source_word: κατῄσχυνέ με
  choice: пристыдила меня
  rationale: Передаёт то, что предъявленные залоги обличили Иуду и заставили его испытать стыд, не добавляя отсутствующих в тексте подробностей.
