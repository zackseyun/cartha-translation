base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/009.yaml
  text: Yet those in the city said that there had been no prostitute at the gate, because she had come from another place and sat at the gate for a short time.
translation:
  language: ru
  text: 9. Однако жители города говорили, что у ворот не было проститутки, потому что она пришла из другого места и лишь ненадолго села у ворот.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἐν τῇ πόλει
  choice: жители города
  rationale: Естественная русская передача буквального «те, кто в городе»; по контексту речь идёт о людях, находившихся или живших в городе.
- source_word: τελεσικόμενον
  choice: проститутки
  rationale: По повествовательному контексту слово обозначает женщину, оказывающую сексуальные услуги; современное прямое обозначение точнее и понятнее архаичного «блудница».
- source_word: ἐξ ἄλλου χωρίου
  choice: из другого места
  rationale: Сохраняет широкое значение χωρίον и не уточняет без достаточных оснований, было ли это селение, область или иная местность.
- source_word: πρὸς βραχύ
  choice: лишь ненадолго
  rationale: Естественно передаёт кратковременность пребывания и объясняет, почему горожане не считали её местной проституткой у ворот.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; формулировка прямая, ясная и сдержанная. Повтор «у ворот» сохранён вслед за греческим текстом, поскольку он связывает отрицание жителей с кратким пребыванием женщины именно там.
