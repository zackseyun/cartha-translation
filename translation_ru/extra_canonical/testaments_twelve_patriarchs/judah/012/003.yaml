- from: Опьянев от вина, я не узнал её, и она обманула меня своей красотой и видом своих украшений.
  to: Опьянев от вина, я не узнал её, и её красота обманула меня благодаря виду её убранства.
  rationale: Исправление восстанавливает грамматический субъект «её красота» и передаёт посредствующее διά с родительным через «благодаря». «Вид её убранства» сохраняет различение между σχῆμα («вид, облик») и κόσμησις («убранство, украшение»), не вводя дополнительных подробностей.
