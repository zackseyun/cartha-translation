    issue: Неверно определён субъект глагола «обманула».
    rationale: 'Греческое τὸ κάλλος αὐτῆς — нейтральное единственное число и грамматический субъект ἠπάτησέ με: «её красота обманула меня». Русское «она обманула меня» меняет утверждаемую субъектную связь.'
  - severity: medium
    issue: Конструкция с двумя творительными падежами изменяет связь последнего оборота с глаголом.
    rationale: «Своей красотой и видом своих украшений» представляет красоту и вид как однородные орудия действия женщины. В оригинале красота действует как субъект, а διά τοῦ σχήματος τῆς κοσμήσεως обозначает способ/посредство этого обмана.
  revised_text: Опьянев от вина, я не узнал её, и её красота обманула меня благодаря виду её убранства.
