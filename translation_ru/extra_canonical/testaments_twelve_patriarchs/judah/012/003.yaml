  text: So when I was drunk with wine, I did not recognize her, and she deceived me by her beauty through the appearance of her adornment.
translation:
  language: ru
  text: Опьянев от вина, я не узнал её, и её красота обманула меня благодаря виду её убранства.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεθυσθεὶς … οἴνῳ
  choice: Опьянев от вина
  rationale: Передаёт обстоятельственный аористальный причастный оборот и причинно-временной контекст естественным современным русским языком.
- source_word: οὐκ ἐπέγνων αὐτὴν
  choice: я не узнал её
  rationale: ἐπιγινώσκω здесь означает распознание личности; «не узнал» ясно и идиоматично.
- source_word: ἠπάτησέ με
  choice: она обманула меня
  rationale: Сохраняет активное действие и прямое дополнение греческого текста без дополнительного истолкования.
- source_word: τὸ κάλλος αὐτῆς
  choice: своей красотой
  rationale: Творительный падеж естественно передаёт средство обмана; возвратное местоимение однозначно относится к подлежащему «она».
- source_word: διὰ τοῦ σχήματος τῆς κοσμήσεως
  choice: видом своих украшений
  rationale: σχῆμα передано как внешний «вид», а κόσμησις — как украшения/убранство; формулировка сохраняет инструментальное значение διά с родительным в данном контексте и избегает тяжеловесного «через внешний вид».
