lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: после этого
  rationale: Естественно и точно передаёт временную последовательность.
- source_word: ἤλθομεν εἰς Αἴγυπτον
  choice: мы пришли в Египет
  rationale: Сохраняет значение движения к месту; «пришли» соответствует ἤλθομεν в данном повествовательном контексте.
- source_word: πρὸς Ἰωσήφ
  choice: к Иосифу
  rationale: 'Передаёт направленность πρὸς на лицо: целью прибытия был Иосиф.'
- source_word: διὰ τὸν λιμόν
  choice: из-за голода
  rationale: Передаёт причинное значение διά с винительным падежом современным и ясным русским оборотом.
