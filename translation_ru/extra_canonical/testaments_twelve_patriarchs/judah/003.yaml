  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003.yaml
  text: '1[a]. And when the two kings of the Canaanites came in armor against our flocks, with many people with them, I alone ran at one of the kings; and striking him on the shins, I dragged him down and so killed him.


    2. And the other king, Taphou, while he was sitting on his horse, I killed; and so I scattered all his people[b].


    3. And I found Achor, a giant of a man, shooting arrows. Leaping up, I took a stone of sixty litras and hurled it; I struck the horse and killed him.


    4. And after fighting with Achor for two hours, I killed him; and when I had cut his shield into two pieces, I hacked through his feet.


    5. And while I was stripping off his breastplate, behold, eight men, his companions, began to fight me.


    6. But I wrapped my garment around my arm and slung stones at them; four of them I killed[c], and the others fled.'
translation:
  language: ru
  text: '**Завещание Иуды, 3**


    **1.** Когда два ханаанских царя в доспехах и с многочисленным войском пришли к нашим стадам, я один устремился на одного из царей и раздробил ему кости.[a]


    **2.** Другого царя, Тафую, сидевшего на коне, я убил и так рассеял всё его войско.


    **3.** Я встретил царя Ахора, великана, который верхом на коне стрелял из лука вперёд и назад. Вскочив, я поднял камень весом в шестьдесят литр,[b] ударил им коня и убил его.


    **4.** Я сражался с Ахором два часа и убил его; рассёк его щит надвое и перерубил ему ноги.


    **5.** Когда же я снимал с него панцирь, восемь его соратников стали сражаться со мной.


    **6.** Тогда я обмотал свою одежду вокруг руки и стал метать в них камни из пращи. Четверых из них я убил, а остальные бежали.


    **7.** Мой отец Иаков убил Белисата, царя всех царей, могучего великана двенадцати локтей ростом.[c]


    **8.** Тогда на них напал ужас, и они перестали воевать с нами.


    **9.** Поэтому отец мой не тревожился во время войн, когда я был вместе с моими братьями.


    **10.** Ведь он увидел в видении обо мне, что во всех делах меня сопровождает ангел силы, чтобы я не терпел поражения.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческая рукописная традиция этой главы значительно расходится в именах противников и в расположении отдельных эпизодов; некоторые свидетели повторяют или переставляют части рассказа о сражениях.
    reason: textual_variant
  - marker: b
    text: Литра — древняя мера веса. Здесь она подчёркивает необычайную тяжесть камня; перевод в современные единицы дал бы лишь приблизительное значение.
    reason: cultural_note
  - marker: c
    text: 'Греческое выражение необычно: «двенадцать локтей» грамматически связано с мощью великана. Поскольку локоть является мерой длины, в переводе эта величина отнесена к его росту.'
    reason: translation_note
lexical_decisions:
- source_word: τεθωρακισμένοι
  choice: в доспехах
  rationale: Передаёт состояние полной вооружённости естественным и достаточно широким русским выражением, не сужая значение до одного панциря.
- source_word: ποίμνια
  choice: стада
  rationale: Общее пастушеское обозначение домашнего скота; исходный текст не уточняет его вид.
- source_word: κατεσπάραξα τὰ ὀστᾶ αὐτοῦ
  choice: раздробил ему кости
  rationale: Следует именно предоставленному греческому тексту, где речь идёт о костях, а не о голенях и не о стаскивании противника вниз.
- source_word: ἀνεῖλον
  choice: убил
  rationale: Современный и прямой эквивалент обычного повествовательного глагола со значением лишения жизни; не создаёт лишней архаичности.
- source_word: διεσκόρπισα
  choice: рассеял
  rationale: Сохраняет образ разогнанного, рассеянного войска и не усиливает значение до полного разгрома.
- source_word: βάλλοντα τόξα ἔμπροσθεν καὶ ὄπισθεν ἐφ᾽ ἵππου
  choice: верхом на коне стрелял из лука вперёд и назад
  rationale: Естественно передаёт необычную боевую ловкость противника и сохраняет оба направления стрельбы.
- source_word: ἀνελάμενος λίθον
  choice: подняв камень
  rationale: В данном тексте форма естественно понимается как взятие или поднятие камня; вариант «вскочив» из консультационного слоя не навязывается греческому чтению.
- source_word: λίθον ἑξήκοντα λιτρῶν
  choice: камень весом в шестьдесят литр
  rationale: Древняя единица сохранена транслитерацией, поскольку точный перевод в современную систему мер создал бы ложную определённость.
- source_word: ἐνελύθην ... τὴν στολήν μου ἐπὶ τὴν χεῖρά μου
  choice: обмотал свою одежду вокруг руки
  rationale: Передаёт защитное обёртывание руки одеждой ясным современным русским языком.
- source_word: σφενδονήσας αὐτοὺς λίθοις
  choice: стал метать в них камни из пращи
  rationale: Сохраняет прямое указание на применение пращи, не превращая действие в простое бросание рукой.
- source_word: ἄγγελος δυνάμεως
  choice: ангел силы
  rationale: 'Формально сохраняет родительное сочетание и его возможную многозначность: ангел, связанный с силой, наделённый ею или принадлежащий небесной силе.'
- source_word: συνέπεταί μοι ἐν πᾶσι
  choice: во всех делах меня сопровождает
  rationale: Идиоматично передаёт постоянное сопутствие во всём, не конкретизируя его как исключительно военную помощь.
theological_decisions:
- issue: Текстуальная неустойчивость и повторение эпизода с Ахором в стихах 3–4
  choice: Сохранить последовательность предоставленного греческого текста, включая повторную встречу и убийство Ахора, не сглаживая повествование.
  alternative: Объединить стихи 3–4 в один бой либо считать одно из имён или убийств поздней дублетной вставкой.
  rationale: Рукописная история здесь сложна, однако молчаливое устранение повтора подменило бы источник реконструкцией. Трудность обозначена примечанием.
- issue: Неясный референт αὐτόν в стихе 3
  choice: Перевести «ударил им коня и убил его», сохранив грамматическую возможность отнести местоимение и к коню, и к Ахору.
  alternative: Явно написать «убил коня» или «убил Ахора».
  rationale: В греческом оба возможных референта мужского рода, а последующее повторное убийство Ахора усиливает, но не снимает текстуальную трудность.
- issue: Образ ангела в стихе 10
  choice: Сохранить выражение «ангел силы» и цель его сопровождения — отсутствие поражения.
  alternative: Истолковать его как личного ангела-хранителя, военного ангела или ангела конкретной небесной иерархии.
  rationale: Источник не даёт основания для более узкой конфессиональной или ангелологической идентификации.
translation_notes:
  register: 'Современный литературный русский язык с достоинством героического повествования, но без искусственной церковнославянской архаики. Короткие энергичные фразы сохраняют хвастливую воинскую интонацию Иуды. Имена переданы близко к греческим формам: Тафуя, Ахор, Белисат. Реальные повторы и неясности источника не гармонизированы.'
