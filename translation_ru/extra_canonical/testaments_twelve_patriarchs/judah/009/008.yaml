  text: Καὶ ἦσαν διδόντες⁴⁷ ἡμῖν πυροῦ⁴⁸ κόρους⁴⁹ πεντακοσίους⁵⁰, καὶ ἐλαίου †ὕφης⁵² πεντακοσίους⁵³, καὶ⁵⁴ οἴνου *μέτρα πεντακόσια ἕως τοῦ λιμοῦ⁵⁴ ὅτε⁵⁵ κατήλθομεν⁵⁶ εἰς Αἴγυπτον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/008.yaml
  text: And they were giving us five hundred cors of wheat, and five hundred baths of oil, and five hundred measures of wine, until the famine, when we went down into Egypt.
translation:
  language: ru
  text: И они давали нам пятьсот ко́ров[a] пшеницы, пятьсот батов[b] оливкового масла и пятьсот мер вина — вплоть до голода, когда мы спустились в Египет.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кор — древняя мера объёма сыпучих продуктов.
    reason: Редкая единица измерения может быть непонятна современному читателю; сноска поясняет её, не подменяя приблизительным пересчётом.
  - marker: b
    text: Греческое слово, обозначающее здесь меру масла, сохранилось в повреждённом виде; вероятно, имеется в виду бат — древняя мера объёма жидкостей.
    reason: Необходимо открыто обозначить текстологическую неуверенность исходного чтения и основание принятого перевода.
lexical_decisions:
- source_word: πυροῦ κόρους πεντακοσίους
  choice: пятьсот ко́ров пшеницы
  rationale: Сохранена названная в греческом тексте мера объёма κόρος, а не заменена приблизительным современным эквивалентом; ударение помогает отличить редкое название меры от обычного слова «коров».
- source_word: ἐλαίου †ὕφης πεντακοσίους
  choice: пятьсот батов масла
  rationale: Контекст и засвидетельствованная текстологическая реконструкция указывают на конкретную меру жидкостей — бат; при этом повреждённость греческого чтения отмечена в сноске.
- source_word: οἴνου *μέτρα πεντακόσια
  choice: пятьсот мер вина
  rationale: Передано обобщённо как «мер», поскольку само чтение μέτρα отмечено в источнике как не вполне надёжное и конкретная единица не установлена.
- source_word: ἦσαν διδόντες
  choice: давали
  rationale: Русский несовершенный вид естественно передаёт греческую перифрастическую конструкцию с длительным или повторяющимся действием.
- source_word: κατήλθομεν εἰς Αἴγυπτον
  choice: мы спустились в Египет
  rationale: Сохранён традиционный пространственный образ нисхождения в Египет без ненужного смыслового уточнения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Редкие древние меры сохранены там, где исходный текст позволяет их определить; неопределённая мера вина передана общим словом. Синтаксис сделан плавным и понятным, а длительность снабжения передана несовершенным видом.
