  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/005.yaml
  text: And because they did not open to us after twenty days, while they were watching, I brought a ladder; and placing my shield over my head and receiving the stones, I went up and killed four of their mighty men.
translation:
  language: ru
  text: И поскольку они в течение двадцати дней не открывали нам ворот, когда сами наблюдали, я поднёс лестницу и, прикрыв голову щитом и принимая камни, летевшие со стены, взобрался и убил четырёх влиятельных людей их города.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἠνοίγον
  choice: не открывали нам ворота
  rationale: Глагол «открывать» употреблён без дополнения; в контексте осады естественно подразумеваются городские ворота. «Нам» передаёт направленность действия, отражённую в английском слое, не меняя смысла.
- source_word: δρώντων αὐτῶν
  choice: хотя сами стояли на страже
  rationale: Буквально оборот связан с «видеть/наблюдать»; выбран естественный русский оборот, сохраняющий смысл бдительного наблюдения осаждённых и контраст с действиями Иуды.
- source_word: προσάγω κλίμακα
  choice: поднёс лестницу
  rationale: Передаёт προσάγω как доставление или подведение лестницы к стене, без избыточного уточнения направления.
- source_word: ἀποδεχόμενος ἀπὸ τοίχου λίθους
  choice: принимая на него камни, летевшие со стены
  rationale: Сохраняет образ принятия падающих камней и явно передаёт ἀπὸ τοίχου; местоимение «на него» естественно связывает действие со щитом.
- source_word: τέσσαρας ... δυνάστας
  choice: четырёх могущественных мужей
  rationale: δυνάσται может означать правителей, властителей или влиятельных и сильных людей. Нейтральное «могущественные мужи» сохраняет эту широту и не превращает их без достаточного основания только в воинов или правителей.
