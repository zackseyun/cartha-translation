    rationale: δρώντων αὐτῶν, согласно исходному тексту и английскому аудиторскому слою, обозначает их наблюдение в момент действия. Уступительность и конкретизация как караульной службы в греческом тексте не выражены.
  - severity: low
    issue: «Могущественных мужей»
    rationale: Слово «мужей» заметно архаично для заявленного современного литературного регистра; при этом δυνάστας требует сохранить широкое значение влиятельных/могущественных лиц.
  revised_text: И поскольку они в течение двадцати дней не открывали нам ворот, когда сами наблюдали, я поднёс лестницу и, прикрыв голову щитом и принимая камни, летевшие со стены, взобрался и убил четырёх влиятельных людей их города.
