  verdict: revise
  source_fidelity: 'Нужна небольшая правка. Генитив абсолютный δρώντων αὐτῶν передаёт одновременность («когда/пока они наблюдали»), а не уступительное «хотя» и не обязательно конкретное несение караула. Остальные основные действия переданы верно: доставка лестницы, защита головы щитом, принятие камней со стены, подъём и убийство четырёх δυνάσται.'
  naturalness: Предлагаемая редакция сохраняет современный литературный строй фразы. «Не открывали нам ворот» естественно эксплицирует подразумеваемый в осадном контексте объект, а «влиятельных людей» избегает архаичного «мужей».
  terminology: δυνάστας не следует безоговорочно сужать до воинов или правителей. «Влиятельных людей их города» передаёт их могущество/высокий статус без чрезмерной исторической конкретизации. «Камни, летевшие со стены» адекватно передаёт ἀπὸ τοίχου.
