  text: Then they asked us for terms of peace, and after counsel had been taken with our father, we accepted them.
translation:
  language: ru
  text: Тогда они попросили у нас условий мира, и, посоветовавшись с нашим отцом, мы приняли их как данников.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πρὸς εἰρήνην
  choice: условий мира
  rationale: Выражение буквально обозначает «то, что служит миру»; в контексте переговоров естественно передаётся как просьба об условиях мира.
- source_word: γενομένης βουλῆς μετὰ τοῦ πατρὸς ἡμῶν
  choice: посоветовавшись с нашим отцом
  rationale: Естественная русская передача генитивной абсолютной конструкции со значением предшествующего совместного совета.
- source_word: ὑποδεξάμενοι
  choice: мы приняли
  rationale: Причастие передано личной глагольной формой для ясного и естественного русского синтаксиса.
- source_word: ὑποφόρους
  choice: как данников
  rationale: Слово означает людей, обязанных платить дань; этот смысл присутствует в греческом тексте и не должен опускаться.
