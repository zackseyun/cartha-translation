lexical_decisions:
- source_word: ἔπαισεν ἐν τόξῳ
  choice: поразил … из лука
  rationale: Передаёт удар или поражение посредством лука, не добавляя отсутствующего в греческом тексте упоминания стрелы.
- source_word: ἤρθη ὁ νεκρός
  choice: мёртвого подняли
  rationale: Неопределённо-личная русская конструкция естественно передаёт греческий пассив и субстантивированное «мёртвый», не называя неуказанного деятеля.
- source_word: ἐν ὄρει Σεείρ
  choice: на гору Сеир
  rationale: 'В сочетании с глаголом поднятия передаёт наиболее вероятное направительное значение: мёртвого подняли на гору.'
