lexical_decisions:
- source_word: πληρωθέντων τῶν δεκαοκτὼ ἐτῶν
  choice: когда исполнилось восемнадцать лет
  rationale: Естественно передаёт завершение указанного восемнадцатилетнего срока, не уточняя отсчёт, которого нет в исходной фразе.
- source_word: ἐπανῆλθεν ἡμῖν
  choice: вернулся к нам
  rationale: Сохраняет значение возвращения в ἐπανῆλθεν и дательный ἡμῖν без добавления отсутствующего в тексте смысла нападения.
- source_word: ἐν λαῷ βαρεῖ καὶ ἰσχυρῷ
  choice: с многочисленным и сильным народом
  rationale: В данном сочетании βαρύς характеризует народ как значительный по численности или внушительный; «многочисленным» естественно по-русски и не дублирует ἰσχυρός — «сильным».
