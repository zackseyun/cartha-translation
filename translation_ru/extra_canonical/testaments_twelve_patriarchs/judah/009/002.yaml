  source_fidelity: 'Смысл передан в целом точно: ἐπανῆλθεν отражено как «вернулся», а родственная связь — буквально. Однако «Когда исполнилось восемнадцать лет» в русском легко понимается как достижение кем-либо восемнадцатилетнего возраста, тогда как греческий говорит об истечении периода. Для βαρύς в сочетании с λαός «многочисленный» допустимо, но «большой» ближе сохраняет широкую характеристику оригинала и английского аудита, не сводя её только к численности.'
