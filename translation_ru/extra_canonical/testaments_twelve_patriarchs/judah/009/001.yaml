  text: For eighteen years my father made peace with his brother Esau, and his sons were with us after we came from Mesopotamia, from Laban.
translation:
  language: ru
  text: Восемнадцать лет мой отец жил в мире со своим братом Исавом, а его сыновья — с нами, после того как мы пришли из Месопотамии, от Лавана.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δέκα καὶ ὀκτὼ ἔτη
  choice: Восемнадцать лет
  rationale: Естественная русская передача продолжительности; сохраняет начальную позицию временного обстоятельства.
- source_word: ἐποίησεν ... εἰρήνην
  choice: жил в мире
  rationale: Греческое выражение буквально означает «сделал/установил мир», но в данном контексте описывает мирные отношения на протяжении восемнадцати лет; «жил в мире» естественно передаёт длительность, не добавляя идеи разового договора.
- source_word: μετὰ τοῦ ἀδελφοῦ αὐτοῦ Ἡσαῦ
  choice: со своим братом Исавом
  rationale: Сохраняет родственную связь и имя; «своим» ясно соотносит брата с отцом говорящего.
- source_word: καὶ οἱ υἱοὶ αὐτοῦ μεθ᾽ ἡμῶν
  choice: а его сыновья — с нами
  rationale: Сохраняет эллиптическую конструкцию оригинала, где сказуемое во второй части подразумевается, и не уточняет сверх текста характер пребывания или отношений.
- source_word: μετὰ τὸ ἐλθεῖν ἡμᾶς
  choice: после того как мы пришли
  rationale: Прямая и естественная передача временной конструкции с артикульным инфинитивом.
- source_word: ἀπὸ Μεσοποταμίας ἀπὸ Λαβάν
  choice: из Месопотамии, от Лавана
  rationale: Сохраняет повтор предлога ἀπό и различие между географическим исходным пунктом и уходом от человека.
