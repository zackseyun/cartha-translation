review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан верно: преследование сыновей Исава, их укреплённый город, невозможность войти и последующая осада сохранены. Однако «Тогда» добавляет невыраженную в греческом временно-следственную связь, а совершенное «осадили» сглаживает процессуальный оттенок греческого имперфекта ἐπολιορκοῦμεν.'
  naturalness: Текст понятен и соответствует современному литературному русскому. «Преследовали» несколько нейтральнее и точнее по регистру, чем разговорно-динамичное «погнались за». Деепричастный оборот естественно передаёт περικαθίσαντες.
  terminology: «Сыновья Исава» и «укреплённый город» удачны. Специальной богословской терминологии нет. Имя Исава передано нормативно.
  issues:
  - severity: medium
    issue: Добавлено «Тогда»
    rationale: Греческое δέ при причастном обороте связывает действия, но не требует временно-следственного вывода; «тогда» несколько усиливает связь, которой текст прямо не маркирует.
  - severity: medium
    issue: «Осадили» вместо процессуального «осаждали»
    rationale: ἐπολιορκοῦμεν стоит в имперфекте и описывает ведение осады; «осаждали» лучше сохраняет этот аспект.
  - severity: low
    issue: «Погнались за»
    rationale: Выражение допустимо, но «преследовали» точнее передаёт κατεδιώξαμεν в нейтральном повествовательном регистре.
