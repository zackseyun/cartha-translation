  text: And we pursued the sons of Esau, and they also had a fortified city, and we were not able to enter it. But sitting around it, we besieged it.
translation:
  language: ru
  text: И мы преследовали сыновей Исава. У них также был укреплённый город, и мы не смогли войти в него. Расположившись вокруг него, мы осаждали его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεδιώξαμεν
  choice: погнались за
  rationale: Передаёт активное преследование противника естественным современным русским выражением.
- source_word: τοὺς υἱοὺς Ἡσαῦ
  choice: сыновьями Исава
  rationale: Сохраняет буквальное родовое обозначение исходного текста.
- source_word: πόλις ὀχυρά
  choice: укреплённый город
  rationale: Точно и естественно передаёт город, защищённый укреплениями.
- source_word: οὐκ ἠδυνήθημεν εἰσελθεῖν ἐν αὐτῇ
  choice: мы не смогли войти в него
  rationale: Сохраняет значение невозможности проникнуть в город без добавления неуказанного способа.
- source_word: περικαθίσαντες
  choice: расположились вокруг него
  rationale: Передаёт буквальный образ размещения войска вокруг города, но избегает неестественного русского «сев вокруг»; по контексту обозначает обложение города.
- source_word: ἐπολιορκοῦμεν αὐτῇ
  choice: осадили его
  rationale: Глагол означает ведение осады; русское совершенное прошедшее естественно продолжает повествовательную последовательность.
