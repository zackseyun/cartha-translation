  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021.yaml
  text: 'And now, my children, I command you: love Levi, so that you may remain, and do not exalt yourselves over him, lest you be utterly destroyed. For God gave me the kingship, and to him the priesthood, and he subjected the kingship to the priesthood. To me he gave the things on earth; to him, the things in the heavens. For thus the priesthood of God surpasses the earthly kingdom, unless through sin it falls away from the Lord and is ruled by the earthly kingdom.


    For the angel of the Lord told me that the Lord chose him above you, to draw near to him, and to eat at his table, and to offer him the firstfruits of the delights of the sons of Israel[c]. But you shall be king of Jacob. And you shall be among them like the sea. For just as in it the righteous are storm-tossed, some being taken captive and others growing rich, so also in you every race of men: some are endangered, being taken captive, and others grow rich by seizing what belongs to others.


    For the kings will be like sea-monsters, swallowing men like fish; they will enslave sons and daughters of free people, and they will seize houses, fields, flocks, and wealth. And they will unjustly fill ravens and ibises[b] with the flesh of many, and they will advance in evil, being lifted up in greed. And there will be false prophets like storms[a],'
translation:
  language: ru
  text: '21 И теперь, дети мои, заповедую вам: любите Левия, чтобы вам устоять, и не превозноситесь над ним, чтобы не быть истреблёнными. 2 Ведь мне Бог дал царскую власть, а ему — священство, и подчинил царскую власть священству. 3 Мне Он дал то, что на земле, а ему — то, что на небесах. 4 Ибо священство Божье превосходит земную царскую власть, если только оно из-за грехов не отпадёт от Господа и не подпадёт под власть земного царства.


    5 Ведь ангел Господа сказал мне: «Господь избрал его выше тебя, чтобы он приближался к Нему, ел за Его столом и приносил Ему начатки лучших даров сынов Израиля.[a] А ты будешь царём Иакова». 6 И будешь среди них словно море. Ведь как в море есть праведные и неправедные: одни попадают в плен, а другие богатеют, — так и в тебе будут люди всякого рода: одни окажутся в опасности, попадая в плен, а другие будут богатеть, захватывая чужое.[b]


    7 Ибо те, кто будет царствовать, станут подобны морским чудовищам: будут поглощать людей, как рыб; свободных сыновей и дочерей обратят в рабство, а дома, поля, стада и имущество захватят. 8 И плотью многих, несправедливо погубленных, они накормят воронов;[c] возвышаясь в злой алчности, будут преуспевать во зле и в такой гордыне, пока не вознесутся. 9 И лжепророки станут подобны бурям и будут преследовать всех праведников.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Начатки лучших даров» — вероятно, отборные плоды или иные ценные первые приношения сынов Израиля.
    reason: cultural_note
  - marker: b
    text: Греческий текст этого сравнения местами неясен; перевод следует его наиболее вероятному смыслу, сохраняя противопоставление плена и обогащения.
    reason: textual_variant
  - marker: c
    text: Греческая фраза трудна и синтаксически неполна. По контексту речь, вероятно, о телах несправедливо погубленных людей, оставленных воронам на съедение; в данном греческом тексте названы именно вороны.
    reason: textual_variant
lexical_decisions:
- source_word: παραγγέλλω
  choice: заповедую
  rationale: Передаёт силу обязательного предсмертного наставления, не сводя его к простому совету.
- source_word: ἀγαπᾶτε
  choice: любите
  rationale: Сохраняет прямое нравственное повеление.
- source_word: ἐπαίρεσθε ἐπ᾽ αὐτόν
  choice: не превозноситесь над ним
  rationale: Сохраняет пространственный образ самовозвышения над Левием.
- source_word: ἐξολοθρευθῆτε
  choice: не быть истреблёнными
  rationale: Передаёт усиленное значение полного уничтожения.
- source_word: βασιλεία
  choice: царская власть
  rationale: В контексте речь прежде всего о дарованном Иуде царском служении и правлении, а не о территории.
- source_word: ἱερατεία / ἱερωσύνη
  choice: священство
  rationale: Естественное единообразное обозначение священнического сана и служения Левия.
- source_word: ὑπέταξε
  choice: подчинил
  rationale: Ясно сохраняет выраженную в греческом иерархию между царской властью и священством.
- source_word: τὰ ἐπὶ γῆς / τὰ ἐν οὐρανοῖς
  choice: то, что на земле / то, что на небесах
  rationale: Сохраняет широкий смысл сфер и параллелизм исходного текста.
- source_word: ὑπερέχει
  choice: превосходит
  rationale: Передаёт сравнительное превосходство без дополнительного доктринального истолкования.
- source_word: ἐκπέσῃ ἀπὸ Κυρίου
  choice: отпадёт от Господа
  rationale: Сохраняет нравственно-религиозный смысл отпадения.
- source_word: κυριευθῇ
  choice: окажется во власти
  rationale: 'Передаёт переворот установленного порядка: согрешившее священство само подпадает под земную власть.'
- source_word: προσεγγίζειν
  choice: приближался
  rationale: Сохраняет культовый оттенок доступа священника к Богу.
- source_word: ἐντρυφημάτων
  choice: лучших даров
  rationale: В сочетании с начатками обозначает отборные, драгоценные плоды или приношения; буквальная передача через «наслаждения» по-русски затемнила бы культовый контекст.
- source_word: κήτη
  choice: морским чудовищам
  rationale: Передаёт крупных и грозных морских существ в образе хищной царской власти.
- source_word: κόρακας
  choice: воронов
  rationale: Следует представленному греческому тексту, где прямо названы вороны; упоминания ибисов в данном источнике нет.
- source_word: καταιγίδες
  choice: бурям
  rationale: Сохраняет образ внезапной разрушительной непогоды применительно к лжепророкам.
theological_decisions:
- issue: Соотношение царской власти Иуды и священства Левия
  choice: Бог даровал Иуде царскую власть, Левию — священство и подчинил царскую власть священству.
  alternative: Представить оба служения как равноправные и лишь взаимодополняющие.
  rationale: Глагол ὑπέταξε прямо обозначает подчинение; перевод не ослабляет заявленную текстом иерархию.
- issue: Условность превосходства священства
  choice: Именно священство может из-за грехов отпасть от Господа и оказаться во власти земного царства.
  alternative: Отнести отпадение к земному царству либо устранить условие как порчу текста.
  rationale: Ближайший грамматический субъект — ἡ ἱερατεία; так сохраняется напряжение между установленным превосходством священства и возможностью утратить его через грех.
- issue: Избрание Левия «прежде тебя»
  choice: Передать ὑπὲρ σέ как преимущественное избрание Левия по отношению к Иуде, не утверждая временной последовательности.
  alternative: «Выше тебя» или «вместо тебя».
  rationale: Фраза обозначает предпочтение и более высокий культовый статус; «прежде тебя» естественно по-русски, но понимается как преимущество, а не обязательно как время.
- issue: Священнические привилегии Левия
  choice: Приближение к Господу, трапеза у Него и принесение начатков сохранены как культовые действия.
  alternative: Истолковать всё исключительно как метафору духовной близости.
  rationale: Последовательность образов имеет явный храмово-священнический характер.
- issue: Образ моря и царской линии Иуды
  choice: Иуда и его царская сфера уподоблены морю, в котором одни терпят плен, а другие богатеют захватом чужого.
  alternative: Отнести сравнение только к народам вообще, без связи с властью Иуды.
  rationale: Выражение ἐν σοὶ непосредственно связывает происходящее с Иудой, тогда как πᾶν γένος ἀνθρώπων расширяет круг затронутых людей.
translation_notes:
  register: 'Современный литературный русский язык с достоинством завещательного наставления. Синтаксис сделан ясным для обычного читателя, но иерархия царской власти и священства, условность превосходства священства и резкие образы осуждения царей сохранены. В неясных местах 6-го и 8-го стихов смысл не представлен как бесспорный: неопределённость отмечена сносками.'
