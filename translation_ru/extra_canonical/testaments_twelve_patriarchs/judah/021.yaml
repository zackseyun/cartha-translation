  to: '21 И теперь, дети мои, заповедую вам: любите Левия, чтобы вам устоять, и не превозноситесь над ним, чтобы не быть истреблёнными. 2 Ведь мне Бог дал царскую власть, а ему — священство, и подчинил царскую власть священству. 3 Мне Он дал то, что на земле, а ему — то, что на небесах. 4 Ибо священство Божье превосходит земную царскую власть, если только оно из-за грехов не отпадёт от Господа и не подпадёт под власть земного царства.


