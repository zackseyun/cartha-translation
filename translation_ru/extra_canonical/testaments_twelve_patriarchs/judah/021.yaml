- from: '21 И теперь, дети мои, заповедую вам: любите Левия, чтобы вам устоять, и не превозноситесь над ним, чтобы не быть истреблёнными. 2 Ведь мне Бог дал царскую власть, а ему — священство, и подчинил царскую власть священству. 3 Мне Он дал то, что на земле, а ему — то, что на небесах. 4 Ибо священство Божье настолько превосходит земную царскую власть — если только из-за грехов не отпадёт от Господа и не окажется во власти земного царства.


