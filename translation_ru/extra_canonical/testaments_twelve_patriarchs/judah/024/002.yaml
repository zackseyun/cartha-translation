  text: '*Καὶ ἔσεσθε αὐτῷ εἰς υἱοὺς¹⁷ ἐν ἀληθείᾳ¹⁸, *καὶ πορεύεσθε¹⁸ ἐν προστάγμασιν¹⁹ αὐτοῦ πρώτοις καὶ ἐσχάτοις.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/002.yaml
  text: And you will be to him sons in truth, and you will walk in his commandments, the first and the last.
translation:
  language: ru
  text: И вы поистине будете Ему сыновьями и будете следовать[a] Его заповедям — первым и последним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческую форму можно также понять как повеление: «и следуйте». Здесь она передана в будущем времени по связи с предшествующим «будете».'
    reason: Форма πορεύεσθε допускает повелительное прочтение, тогда как контекст с ἔσεσθε поддерживает будущее значение.
lexical_decisions:
- source_word: εἰς υἱούς
  choice: Ему сыновьями
  rationale: 'Оборот передаёт отношение принадлежности: они будут для Него сыновьями. Современное «сыновьями» здесь естественнее архаичного «сынами».'
- source_word: ἐν ἀληθείᾳ
  choice: поистине
  rationale: Передаёт наречное значение подлинности сыновнего отношения, не утяжеляя русский текст буквальным оборотом «в истине».
- source_word: πορεύεσθε ἐν προστάγμασιν αὐτοῦ
  choice: будете следовать Его заповедям
  rationale: Греческая метафора хождения означает образ жизни и послушание; «следовать заповедям» сохраняет смысл и звучит естественно в современном русском.
- source_word: πρώτοις καὶ ἐσχάτοις
  choice: первым и последним
  rationale: Определения согласованы с «заповедями» и сохранены буквально, без истолкования выражения как «всем заповедям».
theological_decisions:
- issue: Смысл выражения «первым и последним»
  choice: Сохранено буквальное «первым и последним».
  alternative: «всем Его заповедям»
  rationale: Возможный всеохватный смысл не следует подставлять вместо формулировки источника; буквальный вариант сохраняет её напряжение и неоднозначность.
- issue: Связь выражения ἐν ἀληθείᾳ
  choice: «поистине» отнесено к тому, что адресаты будут Ему сыновьями.
  alternative: «будете Ему сыновьями в истине»
  rationale: Наречное прочтение синтаксически естественно и ясно по-русски, при этом не вводит специального догматического значения слова «истина».
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Избегнуты архаизмы «сыны» и буквальный, менее естественный оборот «ходить в заповедях»; сохранена структура заключительной пары «первым и последним».
