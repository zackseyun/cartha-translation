  text: Then the scepter of my kingdom will shine forth, and from your root a shoot will arise.
translation:
  language: ru
  text: Тогда воссияет скипетр моего царства, и от вашего корня произрастёт побег.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλάμψει
  choice: воссияет
  rationale: Передаёт будущее значение глагола «ярко засиять, воссиять» и сохраняет возвышенный образ.
- source_word: σκῆπτρον βασιλείας μου
  choice: скипетр моего царства
  rationale: Формально и естественно передаёт царственный символ власти без снятия возможного мессианского подтекста.
- source_word: ἀπὸ τῆς ῥίζης ὑμῶν
  choice: от вашего корня
  rationale: Сохраняет метафору происхождения и местоимение множественного числа ὑμῶν.
- source_word: πυθμήν
  choice: побег
  rationale: В растительном контексте с «корнем» обозначает возникающий от него росток или побег; «побег» звучит естественно и сохраняет образ.
- source_word: γενήσεται
  choice: произрастёт
  rationale: Контекстуально передаёт «возникнет, появится», одновременно поддерживая растительную метафору.
theological_decisions:
- issue: Возможный мессианский смысл образов скипетра, корня и побега
  choice: Сохранить образный язык без прямого отождествления
  alternative: Добавить явное указание на Мессию или конкретного потомка
  rationale: Греческий текст говорит метафорически и не называет фигуру прямо; перевод не должен устранять эту содержательную открытость.
translation_notes:
