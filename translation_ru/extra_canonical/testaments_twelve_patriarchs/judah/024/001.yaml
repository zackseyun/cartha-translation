source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἀνοιγήσονται ἐπ᾽ αὐτῷ¹⁰ οἱ οὐρανοὶ ἐκχέαι¹⁴ πνεῦμα¹⁵ εὐλογίαν πατρὸς ἁγίου¹⁶, καὶ αὐτὸς ἐκχέει ἐφ᾽ ὑμᾶς πνεῦμα χάριτος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/001.yaml
  text: He will pour out the spirit of the holy Father’s blessing upon him, and he himself will pour out a spirit of grace upon you.
translation:
  language: ru
  text: Над ним откроются небеса, чтобы излить дух — благословение святого Отца; и сам он изольёт на вас дух благодати.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνοιγήσονται ἐπ᾽ αὐτῷ οἱ οὐρανοί
  choice: Над ним откроются небеса
  rationale: Сохранён пассивный образ открывающихся небес; ἐπί с дательным здесь естественно передано пространственным «над ним».
- source_word: ἐκχέαι
  choice: чтобы излить
  rationale: Инфинитив цели передан без добавления отсутствующего в греческом личного подлежащего.
- source_word: πνεῦμα εὐλογίαν πατρὸς ἁγίου
  choice: дух — благословение святого Отца
  rationale: Приложение через тире сохраняет необычное соседство двух винительных форм и позволяет понимать благословение как пояснение к духу, не сглаживая синтаксическое напряжение.
- source_word: πνεῦμα χάριτος
  choice: дух благодати
  rationale: Формальное и естественное соответствие греческому родительному сочетанию, без уточнения, является ли «дух» личностью, даром или внутренним состоянием.
theological_decisions:
- issue: Соотношение духа и благословения святого Отца
  choice: «дух — благословение святого Отца»
  alternative: «дух благословения святого Отца»
  rationale: Греческое εὐλογίαν стоит в винительном падеже, а не в родительном; поэтому приложение точнее сохраняет форму источника и его смысловую неоднозначность.
- issue: Кто изливает дух на мессианскую фигуру
  choice: Не вводить личное «Он»
  alternative: «Он изольёт на него…»
  rationale: В данной греческой формулировке прямо названы открывающиеся небеса, после чего следует инфинитив; перевод не должен добавлять невыраженного личного деятеля.
translation_notes:
  register: Современный литературный русский язык с возвышенной, но ясной библейской образностью. Повтор «излить / изольёт» намеренно сохраняет лексическую связь двух частей стиха.
