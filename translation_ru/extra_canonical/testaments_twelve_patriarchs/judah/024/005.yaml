source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἐξ αὐτῆς βλαστήσει²⁴ ῥάβδος δικαιοσύνης²⁵ τοῖς ἔθνεσι, *κρῖναι καὶ σῶσαι²⁶ πάντας τοὺς²⁷ ἐπικαλουμένους τὸν²⁸ Κύριον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/005.yaml
  text: And from it will spring up a rod of righteousness for the nations, to judge and to save all who call upon the Lord.
translation:
  language: ru
  text: И из неё произрастёт жезл праведности для народов, чтобы судить и спасти всех, кто призывает Господа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ αὐτῆς
  choice: из неё
  rationale: Сохранена грамматическая отсылка женского рода к предшествующему контексту без попытки уточнить подразумеваемый предмет вне данного стиха.
- source_word: βλαστήσει
  choice: произрастёт
  rationale: Глагол передаёт образ появления растительного побега и соответствует возвышенному пророческому регистру.
- source_word: ῥάβδος δικαιοσύνης
  choice: жезл праведности
  rationale: '«Жезл» сохраняет многозначность ῥάβδος: это может быть растущий побег, посох или знак власти; перевод не сводит образ только к «ветви».'
- source_word: τοῖς ἔθνεσι
  choice: для народов
  rationale: Дательный падеж естественно передан значением предназначения; «народы» сохраняет широкий смысл ἔθνη и не вводит конфессионально окрашенное «язычники».
- source_word: κρῖναι καὶ σῶσαι
  choice: чтобы судить и спасти
  rationale: Инфинитивы цели переданы придаточным цели; порядок и богословское напряжение между судом и спасением сохранены.
- source_word: ἐπικαλουμένους τὸν Κύριον
  choice: кто призывает Господа
  rationale: Передано обычное библейское значение обращения к Господу с призывом или молитвой; настоящее причастие выражено естественной русской конструкцией.
theological_decisions:
- issue: Объём слова ἔθνη
  choice: народы
  alternative: язычники
  rationale: «Народы» не предрешает, противопоставлены ли здесь нееврейские народы Израилю, и сохраняет более широкий смысл греческого слова.
- issue: Образ ῥάβδος δικαιοσύνης
  choice: жезл праведности
  alternative: ветвь праведности
  rationale: Выбор сохраняет одновременно возможные ассоциации с произрастанием и царской властью, не разрешая образ исключительно в ботаническом или мессианском смысле.
- issue: Действующий субъект инфинитивов «судить и спасти»
  choice: синтаксически связан с «жезлом праведности» без дополнительного пояснения
  alternative: добавить явного личного субъекта
  rationale: Греческий текст допускает персонифицированное или личностное понимание жезла; перевод сохраняет эту форму и не вводит толкование.
translation_notes:
  register: Современный литературный русский с dignified пророческим звучанием. Синтаксис близок к греческому, но естественен по-русски; подлинная образная и богословская неоднозначность сохранена.
