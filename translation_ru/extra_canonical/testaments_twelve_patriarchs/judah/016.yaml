  text: XVI. Φυλάξασθε² οὖν, τέκνα μου, *τὸν ὅρον τοῦ οἴνου³, *ἔστι γὰρ ἐν αὐτῷ τέσσαρα⁵ πνεύματα πονηρά⁷, ἐπιθυμίας, πυρώσεως, ἀσωτίας, αἰσχροκερδίας. 2. *Ἐὰν πίνητε οἶνον¹⁰ ἐν εὐφροσύνῃ¹¹, ἐστὶ αἰδούμενος μετὰ φόβου Θεοῦ. 3. Εἰ δὲ θέλετε σωφρόνως ζῆσαι, μηδ᾽ ὅλως τοῦ οἴνου ἐφάπτεσθε¹⁵, ἵνα μὴ ἁμαρτήσητε¹⁶ ἐν λόγοις ὕβρεως¹⁷ καὶ μάχαις²⁰ καὶ συκοφαντίαις²¹ καὶ παραβάσεσι²² ἐντολῶν²³ Θεοῦ²⁴, καὶ ἀπολεῖσθε²⁵ οὐκ²⁶ ἐν καιρῷ ὑμῶν. 4. Καίγε²⁷ μυστήρια Θεοῦ καὶ ἀνθρώπων²⁸ ἀποκαλύπτει³¹ ὁ οἶνος, ὡς³⁰ κἀγὼ τὰς ἐντολὰς τοῦ Θεοῦ καὶ μυστήρια Ἰακὼβ τοῦ πατρὸς ἀπεκάλυψα τῇ Χαναναίτιδι³³, ἃ³⁴ μοι εἶπεν ὁ Θεὸς³⁵ μὴ ἀποκαλῦψαι³⁷.
