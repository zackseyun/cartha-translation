base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016.yaml
  text: '1[a]. Guard yourselves, therefore, my children, against the limit of wine; for in it there are four evil spirits: desire, heated passion, dissipation, and shameful gain[b].


    2. If you drink wine in gladness, be modest with the fear of God. For if, in gladness, the fear of God departs, then drunkenness follows, and shamelessness enters.


    3. But if you want to live with self-control, do not touch wine at all, lest you sin in words of insolence and in fights and in slanders and in transgressions of the commandments of God, and perish before your time.


    4. Wine also reveals the mysteries of God and of men, just as I too revealed the commandments of God and the mysteries of Jacob my father to the Canaanite woman—things that God told me not to reveal.


    5[c]. And wine becomes the cause of war and turmoil.'
translation:
  language: ru
  text: '**Завещание Иуды, 16**


    **1.** Итак, дети мои, соблюдайте меру в вине[a], потому что в нём — четыре злых духа[b]: вожделение, разжигающая страсть, разгул и постыдная корысть.


    **2.** Если пьёте вино в радости, будьте сдержанны в страхе Божьем[c].


    **3.** Если же хотите жить в самообладании, вовсе не прикасайтесь к вину, чтобы не согрешить в дерзких речах, драках, клевете и нарушениях Божьих заповедей — иначе погибнете прежде срока.


    **4.** Кроме того, вино раскрывает тайны Бога и людей. Так и я открыл хананеянке Божьи заповеди и тайны Иакова, моего отца, — то, что Бог велел мне не открывать[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «предел (или границу) вина». Необычное греческое выражение, вероятно, призывает не переходить надлежащую меру.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «злые духи» может обозначать олицетворённые пороки либо духовные силы; греческий текст не устраняет эту двусмысленность.
    reason: lexical_alternative
  - marker: c
    text: Греческая форма в этой фразе грамматически неровна; по смыслу это призыв к сдержанности в страхе Божьем.
    reason: textual_difficulty
  - marker: d
    text: Иуда признаётся, что открыл хананеянке то, что Бог запретил ему разглашать.
    reason: clarification
lexical_decisions:
- source_word: τὸν ὅρον τοῦ οἴνου
  choice: соблюдайте меру в вине
  rationale: ὅρος обозначает границу, предел или меру. Буквальное «берегитесь предела вина» по-русски неясно; выбранная формулировка естественно передаёт предостережение не переходить надлежащую границу, а примечание сохраняет образ предела.
- source_word: πνεύματα πονηρά
  choice: злых духа
  rationale: Сохранён буквальный язык источника, допускающий как олицетворение пороков, так и более прямой духовный смысл.
- source_word: ἐπιθυμία
  choice: вожделение
  rationale: В перечне пороков слово обозначает сильное порочное желание; «вожделение» сохраняет нравственную окраску, не ограничивая значение исключительно сексуальной сферой.
- source_word: πύρωσις
  choice: разжигающая страсть
  rationale: Передаёт образ горения и возбуждения, заключённый в πύρωσις, и связь этого состояния с воздействием вина.
- source_word: ἀσωτία
  choice: распутство
  rationale: Слово указывает на распущенную, неумеренную и расточительную жизнь. «Распутство» естественно в русском перечне пороков, хотя не исчерпывает оттенка расточительности.
- source_word: αἰσχροκερδία
  choice: постыдная корысть
  rationale: 'Сохраняет оба элемента сложного слова: нравственную постыдность и стремление к выгоде.'
- source_word: αἰδούμενος
  choice: будьте сдержанны
  rationale: Передаёт стыдливую сдержанность и достойное поведение в непосредственной связи со страхом Божьим.
- source_word: σωφρόνως
  choice: в самообладании
  rationale: Выражает дисциплинированную, рассудительную и нравственно трезвую жизнь, не сводя слово только к физической трезвости.
- source_word: μηδ᾽ ὅλως τοῦ οἴνου ἐφάπτεσθε
  choice: вовсе не прикасайтесь к вину
  rationale: Сохраняет категорическую форму увещания и яркий глагол «прикасаться», не ослабляя её до требования одной лишь умеренности.
- source_word: λόγοις ὕβρεως
  choice: дерзкими речами
  rationale: ὕβρις здесь обозначает наглую, оскорбительную и заносчивую речь; русский вариант сохраняет возвышенный нравственный регистр.
- source_word: οὐκ ἐν καιρῷ ὑμῶν
  choice: не в свой срок
  rationale: Сохраняет необычную временную формулировку греческого текста и её смысл преждевременной гибели.
- source_word: μυστήρια
  choice: тайны
  rationale: В данном контексте речь идёт о сокрытом и доверенном, которое не следовало разглашать; нейтральное «тайны» не привносит специального обрядового значения.
theological_decisions:
- issue: Следует ли понимать πνεύματα πονηρά психологически или как духовные существа
  choice: Сохранено буквальное «злые духи».
  alternative: «злые побуждения» или «порочные склонности»
  rationale: Греческий текст прямо использует πνεύματα. Перевод не устраняет намеренно оставленную возможность как олицетворённого, так и более чем метафорического прочтения.
- issue: Сила запрета на вино в стихе 3
  choice: 'Передан полный запрет: «вовсе не прикасайтесь к вину».'
  alternative: «не злоупотребляйте вином»
  rationale: Сочетание μηδ᾽ ὅλως с ἐφάπτεσθε сильнее совета соблюдать умеренность. Категоричность сохранена, несмотря на предшествующее наставление о мере.
- issue: Добавочные предложения английского консультационного текста
  choice: Не включены отсутствующие в предоставленном греческом источнике продолжение стиха 2 и стих 5.
  alternative: 'Включить: «если страх Божий отступает…» и «вино становится причиной войны и смуты».'
  rationale: Первичным основанием перевода является предоставленный греческий текст α-колонки. Английский POB служит консультационным слоем и не может восполнять фразы, отсутствующие в указанном исходном свидетельстве.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего нравственного наставления. Синтаксис сделан ясным для обычного читателя, но сохранены резкие переходы, духовная образность и напряжение между мерой в стихе 1 и полным воздержанием в стихе 3. В перевод не внесены предложения английского консультационного слоя, не засвидетельствованные предоставленным греческим источником.
