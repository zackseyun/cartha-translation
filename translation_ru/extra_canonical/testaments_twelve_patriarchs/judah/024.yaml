  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024.yaml
  text: '1. He will pour out the spirit of the holy Father’s blessing upon him, and he himself will pour out a spirit of grace upon you.

    2. And you will be for him sons in truth, and you will walk in his commands, first and last.

    3. [This is the shoot of the Most High God, a spring for the life of all flesh.]

    4. Then the scepter of my kingdom will shine forth, and from your root a stem will arise.

    5. And from it will spring up a rod of righteousness for the nations, to judge and to save all who call upon the Lord.'
translation:
  language: ru
  text: 'Завещание Иуды, 24


    1. После этого в мире взойдёт для вас звезда из Иакова, и восстанет человек из моего семени, подобный солнцу праведности. Он будет идти вместе с людьми в кротости и праведности, и никакого греха не найдётся в нём.


    2. И откроются над ним небеса, чтобы излить на него дух, благословение святого Отца[a], а сам он изольёт на вас дух благодати.


    3. И вы поистине станете для него сынами и будете ходить в его повелениях — первых и последних[b].


    4. [Это — росток Всевышнего Бога и источник, дающий жизнь всем.][c]


    5. Тогда воссияет скипетр моего царства, и от вашего корня поднимется ствол.


    6. Из него произрастёт жезл праведности для народов, чтобы судить и спасти всех, кто призывает Господа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение буквально читается приблизительно как «излить дух, благословение святого Отца»; связь слов «дух» и «благословение» синтаксически не вполне ясна.
    reason: Сохранить заметную в исходном тексте грамматическую неоднозначность, не превращая её безоговорочно в «дух благословения».
  - marker: b
    text: 'Или: «в его первых и последних повелениях». Смысл определения «первых и последних» не уточнён.'
    reason: Оборот может указывать на совокупность повелений от первых до последних либо характеризовать сами повеления.
  - marker: c
    text: Весь этот стих заключён в квадратные скобки в основном греческом источнике, что указывает на сомнение издателя в его принадлежности к первоначальному тексту.
    reason: Отразить текстологический статус отмеченного издателем фрагмента.
lexical_decisions:
- source_word: ἀνατελεῖ ... ἄστρον ἐξ Ἰακώβ
  choice: взойдёт ... звезда от Иакова
  rationale: Сохранены образ восходящей звезды и исходное ἐξ, выражающее происхождение.
- source_word: ἥλιος δικαιοσύνης
  choice: солнце праведности
  rationale: Формально сохраняет устойчивый пророческий образ без дополнительного толкования.
- source_word: συμπορευόμενος τοῖς ἀνθρώποις
  choice: будет жить среди людей
  rationale: Буквально глагол означает «идти вместе»; по-русски выбран естественный оборот, передающий совместное пребывание и земной путь среди людей.
- source_word: πνεῦμα χάριτος
  choice: дух благодати
  rationale: Сохраняет многозначность πνεῦμα без навязанной догматической капитализации.
- source_word: προστάγμασιν
  choice: повелениях
  rationale: Передаёт обязательный характер предписаний точнее, чем более широкое «заповедях».
- source_word: βλαστός
  choice: росток
  rationale: Сохраняет растительный мессианский образ и отличается от последующих «ствола» и «жезла».
- source_word: πυθμήν
  choice: ствол
  rationale: Слово обозначает нижнюю часть дерева, ствол или основание; «ствол» естественно сочетается с происхождением от корня.
- source_word: ῥάβδος δικαιοσύνης
  choice: жезл праведности
  rationale: Сохраняет царственно-судебный оттенок ῥάβδος и параллель со скипетром.
- source_word: ἔθνεσι
  choice: народов
  rationale: Нейтрально передаёт «народы», не сужая значение до этнически или конфессионально окрашенного термина.
theological_decisions:
- issue: Идентичность восстающего человека и образов звезды, солнца, ростка и жезла
  choice: Оставить образы и местоименные связи без прямого именования личности
  alternative: Явно назвать фигуру Мессией или Христом
  rationale: Греческий текст содержит мессианские образы, но в данной главе прямо не называет фигуру; перевод не должен устранять эту формальную недосказанность.
- issue: Капитализация πνεῦμα во 2-м стихе
  choice: «дух» со строчной буквы
  alternative: «Дух» как однозначное указание на Святого Духа
  rationale: В греческом нет различающей капитализации, а синтаксис фразы нестабилен; строчная буква сохраняет возможность как личного, так и неличного понимания.
- issue: υἱούς в обращении ко всей аудитории
  choice: «сынами»
  alternative: Гендерно-обобщающее «детьми»
  rationale: Сохранён конкретный образ сыновства в источнике, имеющий богословский вес.
- issue: κρῖναι καὶ σῶσαι
  choice: «судить и спасти»
  alternative: Смягчить до «рассудить и избавить»
  rationale: Прямой перевод сохраняет напряжение между судом и спасением, не объясняя заранее их взаимосвязь.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Сохранены повторения «излить», последовательность растительных и царских образов, а также библейские формулы «ходить в повелениях» и «призывать Господа». Архаизмы ограничены понятными словами «скипетр» и «жезл», необходимыми для образной системы текста.
