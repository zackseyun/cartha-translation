source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Εἶδε⁵⁶ γὰρ⁵⁷ *ἐν ὁράματι⁵⁸ †περὶ ἐμοῦ⁵⁹ ὅτι ἄγγελος δυνάμεως⁶⁰ συνέπεταί μοι⁶¹ ἐν πᾶσι, τοῦ μὴ⁶² ἡττᾶσθαί⁶³ μοι.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/008.yaml
  text: For he saw in a vision concerning me that an angel of power accompanied me in all things, so that I might not be touched.
translation:
  language: ru
  text: Ибо он увидел в видении обо мне, что ангел силы[a] сопутствует мне во всём, чтобы я не был побеждён.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ангел могущества».'
    reason: δύναμις допускает значения «сила» и «могущество»; основной вариант более краток и естественен.
lexical_decisions:
- source_word: ἄγγελος δυνάμεως
  choice: ангел силы
  rationale: Прямо передаёт родительное сочетание; δύναμις здесь означает силу или могущество, без добавления не выраженного в тексте конфессионального толкования.
- source_word: συνέπεταί μοι
  choice: сопутствует мне
  rationale: Глагол буквально может описывать совместный полёт, но в контексте естественно выражает постоянное сопровождающее присутствие ангела; «сопутствует» сохраняет возвышенный регистр.
- source_word: ἐν πᾶσι
  choice: во всём
  rationale: Сохраняет широту и некоторую неопределённость греческого выражения, не сужая его до отдельных дел или обстоятельств.
- source_word: τοῦ μὴ ἡττᾶσθαί μοι
  choice: чтобы я не был побеждён
  rationale: ἡττάομαι означает «терпеть поражение, быть побеждённым, уступать»; форма передана как цель или результат сопровождения. Это точнее греческого текста, чем английское «чтобы меня не коснулись».
theological_decisions:
- issue: Роль ангела в сохранении Иуды
  choice: сопровождение выражено как средство, благодаря которому Иуда не терпит поражения
  alternative: ангел делает Иуду неуязвимым для прикосновения
  rationale: Греческий текст говорит о поражении (ἡττᾶσθαι), а не о прикосновении; перевод не усиливает утверждение до абсолютной физической неуязвимости.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис близок к греческому, но остаётся естественным для обычного читателя.
