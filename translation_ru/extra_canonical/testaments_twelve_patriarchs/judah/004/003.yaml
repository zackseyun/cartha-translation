  text: And so we set Hebron free and took all the captives.
translation:
  language: ru
  text: На следующий день мы пошли к Арету[a], хорошо укреплённому городу, грозившему нам смертью. Я и Гад напали на город с востока, а Рувим и Левий — с запада; так мы освободили пленников.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Арета — название города; его точное местонахождение неизвестно.
    reason: Топоним малоизвестен и может быть неясен современному читателю.
lexical_decisions:
- source_word: τῇ ἑξῆς
  choice: на следующий день
  rationale: Субстантивированное выражение в повествовательном контексте естественно подразумевает следующий день.
- source_word: Ἀρετάν
  choice: Арету
  rationale: Название передано транслитерацией как топоним и поставлено в требуемый русским управлением винительный падеж.
- source_word: πόλιν κραταιάν
  choice: укреплённому городу
  rationale: κραταιός здесь описывает мощный, хорошо защищённый город; «укреплённый» естественно передаёт военный контекст.
- source_word: ἀπειλοῦσαν ἡμῖν θάνατον
  choice: жители которого грозили нам смертью
  rationale: В греческом угрожает сам город — обычная метонимия; по-русски явное указание на жителей звучит естественно и сохраняет смысл.
- source_word: προσέφθημεν
  choice: первыми подошли
  rationale: Глагол выражает опережение или более раннее прибытие; выбранный вариант сохраняет этот смысл без излишней конкретизации.
- source_word: ἀπὸ ἀνατολῶν τῆς πόλεως
  choice: к городу с востока
  rationale: Передаёт направление подхода и естественно сочетается с глаголом движения.
- source_word: ἠλευθερώσαμεν τὴν αἰχμαλωσίαν
  choice: освободили пленников
  rationale: Буквально «освободили плен/пленение»; абстрактное существительное употреблено метонимически о людях, находившихся в плену.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Сохранены последовательность действий, разделение участников на две группы и направление их подхода к городу; не соответствующее данному греческому тексту упоминание Хеврона из английского консультационного слоя не принято.
