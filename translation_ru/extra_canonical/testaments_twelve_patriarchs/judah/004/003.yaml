    issue: προσέφθημεν передано как «первыми подошли».
    rationale: В контексте взятия города глагол обозначает нападение, а не приоритет прибытия. Добавленное «первыми» не имеет опоры в греческом и существенно ослабляет описание совместной атаки.
  - severity: low
    issue: Фраза «жители которого грозили нам смертью» эксплицирует субъект угрозы.
    rationale: Это приемлемая метонимическая развёртка, но исходный текст говорит о городе как об угрожающем; сохранение метонимии точнее и лаконичнее.
