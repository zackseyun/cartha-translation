  text: И я взошёл на стену, убил их царя, и мы захватили всех пленников.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνῆλθον … ἐπὶ τοῦ τείχους
  choice: я взошёл на стену
  rationale: Передаёт движение вверх и нахождение на стене естественным современным русским языком. В предоставленном греческом тексте стоит единственное число τείχους; определения «двойная» в нём нет.
- source_word: ἀνεῖλον τὸν βασιλέα αὐτῶν
  choice: убил их царя
  rationale: ἀναιρέω в данном военном контексте означает лишение жизни; прямое «убил» точно и ясно.
- source_word: ἐλάβομεν πᾶσαν τὴν αἰχμαλωσίαν
  choice: мы захватили всех пленников
  rationale: Существительное αἰχμαλωσία может обозначать плен или совокупность захваченных людей. Русское «захватили всех пленников» сохраняет военный смысл и согласуется с πᾶσαν, избегая неестественного буквального «весь плен».
