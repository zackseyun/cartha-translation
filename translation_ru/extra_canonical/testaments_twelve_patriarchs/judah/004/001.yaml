  text: '*Καὶ μετὰ τοῦτο γέγονεν ἡμῖν κατὰ νότον¹ πόλεμος² *τοῦ ἐν Σικίμοις³· καὶ παραταξάμενοι *σὺν τοῖς ἀδελφοῖς⁴ μου ἐδιώξαμεν⁵ χιλίους⁶ καὶ ἀπεκτείναμεν⁷ ἐξ αὐτῶν διακοσίους⁸ *καὶ τέσσαρας βασιλεῖς⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/001.yaml
  text: And after this there came to us a war toward the south, greater than the one at Shechem; and having drawn up in battle with my brothers, we pursued a thousand men and killed two hundred of them, and four kings.
translation:
  language: ru
  text: И после этого началась у нас война на юге[a], более крупная, чем война в Сихеме. Выстроившись к бою вместе с моими братьями, мы преследовали тысячу человек, убили из них двести, а также четырёх царей.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «по направлению к югу».'
    reason: Греческое κατὰ νότον допускает как областное, так и направительное понимание.
lexical_decisions:
- source_word: γέγονεν ἡμῖν ... πόλεμος
  choice: началась у нас война
  rationale: Естественно передаёт греческое выражение возникновения войны, сохраняя участника «у нас».
- source_word: κατὰ νότον
  choice: на юге
  rationale: В контексте войны обозначает южное направление или область; русский вариант звучит естественно, а неоднозначность отмечена в сноске.
- source_word: τοῦ ἐν Σικίμοις
  choice: чем война в Сихеме
  rationale: Восстанавливает подразумеваемое существительное «война» при сравнительной конструкции и передаёт топоним принятой русской библейской формой.
- source_word: παραταξάμενοι
  choice: выстроившись к бою
  rationale: Передаёт военное построение, не сводя значение лишь к общему вступлению в сражение.
- source_word: ἐδιώξαμεν
  choice: мы преследовали
  rationale: Сохраняет прямое значение глагола и последовательность военных действий.
- source_word: ἀπεκτείναμεν ἐξ αὐτῶν διακοσίους
  choice: убили из них двести
  rationale: 'Точно сохраняет количественное отношение: двести из преследуемой тысячи.'
- source_word: καὶ τέσσαρας βασιλεῖς
  choice: а также четырёх царей
  rationale: Ясно присоединяет царей как дополнительную группу убитых, не утверждая, входили ли они в число двухсот.
