  text: Then my father Jacob killed Belisath, king of all, father of kings, a giant man in strength, twelve cubits tall.
translation:
  language: ru
  text: Мой отец Иаков убил Велисафа, царя всех царей, человека исполинской силы, ростом в двенадцать локтей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεῖλε
  choice: убил
  rationale: Прямое значение глагола в данном повествовательном контексте — лишил жизни, убил.
- source_word: Βελισάθ
  choice: Велисафа
  rationale: Имя передано по традиционным принципам русской библейской транслитерации греческих имён; форма винительного падежа обусловлена синтаксисом.
- source_word: βασιλέα πάντων τῶν βασιλέων
  choice: царя всех царей
  rationale: 'Точно передаёт представленный греческий текст: πάντων τῶν βασιλέων означает «всех царей». Чтение английского консультационного слоя «king of all, father of kings» не подтверждается приведённым греческим источником.'
- source_word: ἄνδρα γίγαντα τῇ ἰσχύι
  choice: человека исполинской силы
  rationale: Естественно передаёт сочетание ἄνδρα, γίγαντα и ограничивающий оборот τῇ ἰσχύι, не превращая характеристику силы в отдельное утверждение о происхождении или природе героя.
- source_word: πηχῶν δώδεκα
  choice: ростом в двенадцать локтей
  rationale: В контексте описания великана мера понимается как указание роста; добавление «ростом» восполняет естественную для греческого текста эллиптическую связь.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Начальное английское «Then» не воспроизведено, поскольку в представленном греческом тексте ему нет соответствия. Архаизирующая мера «локоть» сохранена как элемент древнего мира; приблизительный пересчёт не добавлен из-за исторической вариативности локтя.
