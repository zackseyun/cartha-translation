  source_fidelity: 'Основной смысл передан верно: ἀνεῖλε — «убил», βασιλέα πάντων τῶν βασιλέων — «царя всех царей», а πηχῶν δώδεκα — «ростом в двенадцать локтей». Русский текст вернее английского аудиторского слоя в отношении βασιλέα πάντων τῶν βασιλέων: приведённый греческий текст не содержит основания для «king of all, father of kings». Однако в переводе не сохранены пять якорей примечаний критического издания (43–47), присутствующие в источнике.'
  naturalness: Фраза звучит естественно в современном литературном русском и сохраняет уместный возвышенный повествовательный тон. «Ростом в двенадцать локтей» ясно передаёт эллиптическую меру оригинала.
  terminology: «Иаков», «Велисаф», «царь», «локоть» употреблены последовательно и уместно. «Человека исполинской силы» допустимо передаёт ἄνδρα γίγαντα τῇ ἰσχύι; это не утверждает сверхъестественную природу персонажа. «Царь всех царей» является буквальным переводом греческой конструкции, хотя и имеет знакомый библейский оттенок в русском языке.
