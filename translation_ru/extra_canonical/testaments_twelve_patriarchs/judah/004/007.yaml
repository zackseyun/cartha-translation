source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Διὰ τοῦτο ὁ πατήρ μου ἀμέριμνος⁵² ἦν ἐν τοῖς πολέμοις⁵³, ὅτε⁵⁴ ἐγὼ σὺν τοῖς ἀδελφοῖς μου ἤμην⁵⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/007.yaml
  text: Therefore my father was free from चिंता in the wars while I was with my brothers.
translation:
  language: ru
  text: Поэтому мой отец не тревожился во время войн, когда я был вместе с моими братьями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμέριμνος
  choice: не тревожился
  rationale: Передаёт состояние отсутствия беспокойства естественным современным русским выражением; буквальное «был беззаботен» могло бы ошибочно намекать на беспечность.
- source_word: ἐν τοῖς πολέμοις
  choice: во время войн
  rationale: В данном контексте ἐν имеет временно-обстоятельственное значение; множественное число сохранено.
- source_word: ὅτε
  choice: когда
  rationale: Сохраняет временную связь без уточнения, которого нет в греческом тексте.
- source_word: σὺν τοῖς ἀδελφοῖς μου
  choice: вместе с моими братьями
  rationale: Прямо и естественно передаёт совместность, выраженную σὺν с дательным падежом.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; фраза проста и достойна по тону. Причинно-следственное «Поэтому» и временная неоднозначность придаточного с «когда» сохранены.
