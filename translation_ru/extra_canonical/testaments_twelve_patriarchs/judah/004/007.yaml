  source_fidelity: Текст точно передаёт греческое Διὰ τοῦτο («Поэтому»), ἀμέριμνος («не тревожился» в значении отсутствия заботы/беспокойства), ἐν τοῖς πολέμοις («во время войн») и временную связь ὅτε… («когда я был вместе с моими братьями»). Видовая форма «не тревожился» естественно передаёт длительное состояние в прошедшем времени, не добавляя причины или богословского истолкования.
