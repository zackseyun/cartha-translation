  text: 'Therefore keep[a], my children, the whole law of the Lord, for it is hope for all who keep his ways in righteousness. And bury me near my fathers.


    And he fell asleep in a good old age. And his sons did as he had commanded them, and they carried him up to Hebron and buried him there with his fathers.


    And if you walk in holiness according to all the commandments of the Lord, you will again dwell securely with me[b], and all Israel will be gathered to the Lord forever.'
translation:
  language: ru
  text: '26


    1 Итак, дети мои, соблюдайте весь закон Господа, потому что он — надежда для тех, кто держится прямоты Его путей. 2 И сказал он им: «Вот, мне сто восемнадцать лет, и сегодня я умираю. 3 Пусть никто не хоронит меня в дорогом одеянии; отнесите меня в Хеврон, где покоятся и мои отцы».


    4 Сказав это, он почил[a]. Его сыновья исполнили всё, что он им повелел, и похоронили его вместе с его отцами в Хевроне.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Почил» — традиционное древнее и библейское иносказание смерти.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φυλάξατε
  choice: соблюдайте
  rationale: В сочетании с «законом» этот глагол естественно передаёт тщательное исполнение предписаний, сохраняя силу повеления.
- source_word: τέκνα μου
  choice: дети мои
  rationale: Сохраняет прямое семейное обращение и, в отличие от «сыновья мои», допускает более широкий круг потомков.
- source_word: πάντα τὸν νόμον Κυρίου
  choice: весь закон Господа
  rationale: Передаёт подчёркнутую полноту закона и сохраняет библейско-заветную лексику.
- source_word: ἐλπίς
  choice: надежда
  rationale: Прямой и естественный эквивалент, сохраняющий религиозно-наставительный смысл.
- source_word: τοῖς κατευθύνουσι τὰς ὁδοὺς αὐτοῦ
  choice: для тех, кто прямо следует Его путями
  rationale: Передаёт образ прямого, верного движения по путям Господа, не добавляя отсутствующего в греческом тексте слова «праведность».
- source_word: ἑκατὸν δέκα καὶ ὀκτὼ ἐτῶν
  choice: мне сто восемнадцать лет
  rationale: Сохраняет точный возраст, указанный в представленном греческом тексте.
- source_word: ἀναγάγετε με ἐν Χεβρὼν
  choice: отнесите меня в Хеврон
  rationale: Естественно передаёт распоряжение доставить тело в Хеврон; пространственная идея движения сохраняется без неестественного буквализма «поднимите».
- source_word: ἐκοιμήθη
  choice: почил
  rationale: Сохраняет древний эвфемизм смерти и достоинство завещательного повествования; значение пояснено в сноске.
theological_decisions:
- issue: Закон Господа как основание наставления
  choice: Сохранена прямая формулировка «весь закон Господа» и связь закона с надеждой.
  alternative: Передать это как общее нравственное наставление.
  rationale: Греческий текст прямо использует заветно-религиозную лексику и не позволяет свести наставление к общей этике.
- issue: Формула смерти патриарха
  choice: ἐκοιμήθη передано как «почил».
  alternative: «умер» или буквальное «уснул».
  rationale: «Почил» сохраняет эвфемистический характер формулы, но в современном русском яснее обозначает смерть, чем буквальное «уснул».
- issue: Расширенное окончание английского консультационного текста
  choice: Не включены фразы о благой старости, хождении в святости, безопасном пребывании и собрании Израиля.
  alternative: Включить их вслед за английским POB.
  rationale: Эти фразы отсутствуют в предоставленном греческом источнике данной редакции; источник имеет приоритет над консультационным английским слоем.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным завещательным регистром. Синтаксис упрощён лишь там, где буквальная греческая конструкция была бы неестественной. Добавления английского консультационного текста, не подтверждённые данным греческим источником, исключены.
