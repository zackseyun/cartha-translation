  text: Εἰ δὲ θέλετε σωφρόνως ζῆσαι, μηδ᾽ ὅλως τοῦ οἴνου ἐφάπτεσθε¹⁵, ἵνα μὴ ἁμαρτήσητε¹⁶ ἐν λόγοις ὕβρεως¹⁷ καὶ μάχαις²⁰ καὶ συκοφαντίαις²¹ καὶ παραβάσεσι²² ἐντολῶν²³ Θεοῦ²⁴, καὶ ἀπολεῖσθε²⁵ οὐκ²⁶ ἐν καιρῷ ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/003.yaml
  text: But if you want to live with self-control, do not touch wine at all, lest you drink and sin in words of insolence and in fights and in slanders and in transgressions of the commandments of God, and perish before your time.
translation:
  language: ru
  text: Но если вы хотите жить благоразумно, вовсе не прикасайтесь к вину, чтобы не согрешить, впадая в дерзкие речи, драки, клевету и нарушение Божьих заповедей, и не погибнуть прежде времени.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφρόνως
  choice: с самообладанием
  rationale: Передаёт нравственную сдержанность и владение собой, не сужая значение до одного лишь трезвого образа жизни или целомудрия.
- source_word: μηδ᾽ ὅλως τοῦ οἴνου ἐφάπτεσθε
  choice: вовсе не прикасайтесь к вину
  rationale: Сохраняет усиленное запрещение и образное выражение греческого текста.
- source_word: λόγοις ὕβρεως
  choice: дерзкими речами
  rationale: Передаёт надменный, оскорбительный характер речи без чрезмерного уточнения.
- source_word: μάχαις
  choice: драками
  rationale: В данном перечне последствий вина естественно обозначает физические столкновения и ссоры.
- source_word: συκοφαντίαις
  choice: клеветой
  rationale: Основное значение в контексте — ложные обвинения и злословие.
- source_word: οὐκ ἐν καιρῷ ὑμῶν
  choice: безвременно
  rationale: Естественно передаёт буквальное «не в своё время», то есть преждевременную или несвоевременную гибель.
theological_decisions:
- issue: Характер наставления о вине
  choice: Сохранён прямой призыв вовсе не прикасаться к вину.
  alternative: Ослабить до предостережения против пьянства или чрезмерного употребления.
  rationale: Греческое μηδ᾽ ὅλως ... ἐφάπτεσθε выражает полное воздержание именно в рамках этого наставления; текст не следует превращать в общее догматическое утверждение о вине.
- issue: Отсутствие глагола «пить» в предоставленном греческом тексте
  choice: Глагол «пить» не добавлен.
  alternative: Следовать английскому слою и перевести «чтобы вы не пили и не согрешили».
  rationale: В предоставленном оригинальном тексте после запрета стоит ἵνα μὴ ἁμαρτήσητε, без πίνητε. Перевод следует непосредственно приведённому греческому источнику, тогда как английская редакционная заметка, по-видимому, опирается на иной вариант или ошибочную сверку.
translation_notes:
  register: Современный литературный русский язык с достоинством назидательного завещания. Синтаксис сохранён как единое причинно-следственное наставление, но перечень оформлен естественно для русского читателя.
