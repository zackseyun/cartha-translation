revisions:
- from: Но если хотите жить с самообладанием, вовсе не прикасайтесь к вину, чтобы вам не согрешить дерзкими речами, драками, клеветой и нарушением Божьих заповедей и не погибнуть безвременно.
  to: Но если вы хотите жить благоразумно, вовсе не прикасайтесь к вину, чтобы не согрешить, впадая в дерзкие речи, драки, клевету и нарушение Божьих заповедей, и не погибнуть прежде времени.
  rationale: 'Сделаны только стилистически безопасные уточнения: σωφρόνως передано более естественным «благоразумно», а греческий перечень оформлен плавнее для русского языка. Глагол «пить» не добавлен, поскольку он отсутствует в предоставленном греческом источнике. «Прежде времени» явно раскрывает значение οὐκ ἐν καιρῷ ὑμῶν, не добавляя нового содержания.'
  reviewer_model: gpt-5.6-terra
