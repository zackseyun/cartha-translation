  text: If you drink wine in gladness, be modest with the fear of God. For if, in gladness, the fear of God departs, then drunkenness follows, and shamelessness slips in.
translation:
  language: ru
  text: Если пьёте вино в радости, будьте скромны, сохраняя страх Божий.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В предоставленном греческом тексте нарушено согласование: обращение «если пьёте» стоит во множественном числе, а далее читается форма единственного числа «он сдерживается». Перевод передаёт очевидный наставительный смысл фразы. Следующие два предложения английского консультационного текста в предоставленном греческом источнике отсутствуют.'
    reason: Зафиксировать грамматическую неровность источника и расхождение между греческим свидетельством и английским консультационным слоем, не скрывая текстологической неопределённости.
lexical_decisions:
- source_word: ἐν εὐφροσύνῃ
  choice: с весельем
  rationale: Передаёт радость и праздничное веселье без подразумеваемого уже опьянения.
- source_word: αἰδούμενος
  choice: будьте сдержанны
  rationale: В данном нравственном наставлении причастие от αἰδέομαι обозначает стыдливую сдержанность и соблюдение приличий; буквальное «стыдитесь» здесь звучало бы неестественно и могло бы исказить смысл.
- source_word: μετὰ φόβου Θεοῦ
  choice: и храните страх Божий
  rationale: Естественно выражает сопровождающее употребление вина благоговейное сознание ответственности перед Богом; «страх Божий» сохраняет устойчивый библейский смысл выражения.
theological_decisions:
- issue: Отношение веселья и страха Божьего
  choice: 'Они представлены как совместимые: во время веселья следует сохранять сдержанность и страх Божий.'
  alternative: Понять фразу как осуждение самого веселья или употребления вина.
  rationale: Условная конструкция не запрещает вино и веселье, а задаёт нравственную меру поведения.
- issue: Дополнительные предложения из английского консультационного текста
  choice: Не включать их в основной текст.
  alternative: 'Добавить: «Ибо если в веселье отступает страх Божий, тогда следует пьянство и входит бесстыдство».'
  rationale: Эти предложения отсутствуют в предоставленном греческом источнике; включать их без исходноязыкового свидетельства было бы несоответствием заданному принципу перевода.
translation_notes:
  register: Современный литературный русский язык с достоинством нравственного наставления. «Будьте сдержанны» понятно широкому читателю и не вводит конфессионально окрашенной терминологии.
