  terminology: «Тайны», «заповеди», «хананеянка» и «Бог» — точные, регистрово уместные соответствия. Формула «тайны моего отца Иакова» однозначно передаёт приложение Ἰακὼβ τοῦ πατρὸς и не вносит богословского истолкования.
