base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/004.yaml
  text: Wine also reveals the mysteries of God and of men, just as I too revealed to the Canaanite woman the commandments of God and the mysteries of Jacob my father—things that God told me not to reveal.
translation:
  language: ru
  text: Вино также открывает тайны Бога и людей. Так и я открыл хананеянке заповеди Бога и тайны моего отца Иакова — то, что Бог велел мне не открывать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μυστήρια
  choice: тайны
  rationale: Передаёт то, что было сокрыто и затем открыто; естественно по-русски и сохраняет повтор греческого текста.
- source_word: ἀποκαλύπτει / ἀπεκάλυψα / ἀποκαλῦψαι
  choice: открывает / открыл / открывать
  rationale: Сохраняет общий корень и риторический повтор оригинала.
- source_word: τῇ Χαναναίτιδι
  choice: хананеянке
  rationale: Точная и лаконичная передача обозначения женщины-хананеянки.
- source_word: ἐντολὰς
  choice: заповеди
  rationale: Обычный религиозно-нравственный эквивалент для предписаний Бога.
theological_decisions:
- issue: Связь слов ἃ μοι εἶπεν ὁ Θεὸς μὴ ἀποκαλῦψαι с предшествующим перечислением
  choice: «то, что Бог велел мне не открывать» относится вместе к заповедям Бога и тайнам Иакова
  alternative: Отнести запрет только к ближайшему выражению «тайны моего отца Иакова»
  rationale: Средний род множественного ἃ естественно обобщает оба существительных разных родов в перечислении; формулировка сохраняет широкий охват оригинала.
- issue: Смысл εἶπεν ... μὴ ἀποκαλῦψαι
  choice: «велел мне не открывать»
  alternative: «сказал мне не открывать»
  rationale: В данном сочетании речь идёт о запрете; «велел» естественно выражает директивную силу, не добавляя конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Два предложения облегчают восприятие длинной греческой конструкции; повтор «открывать» сохранён намеренно. Местоимение «моего» поставлено перед «отца Иакова» для естественного русского порядка слов.
