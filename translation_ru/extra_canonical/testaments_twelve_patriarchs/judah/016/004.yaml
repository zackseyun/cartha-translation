  source_fidelity: 'Перевод точно передаёт основной синтаксический ход и лексику греческого текста: вино «открывает» тайны, а Иуда признаёт, что открыл хананеянке заповеди Бога и тайны Иакова, хотя Бог велел ему этого не открывать. Обобщающее «то, что» корректно охватывает оба элемента перечисления и не устраняет присущую греческому относительному предложению широту соотнесения.'
