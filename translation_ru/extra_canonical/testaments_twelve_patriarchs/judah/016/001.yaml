review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл передан точно: сохранены увещевание, образ «четырёх злых духов» и перечисление. Однако «распутство» неоправданно сужает ἀσωτία до преимущественно сексуальной распущенности; слово обозначает более широкую необузданную, распущенную жизнь. «Разжигающая страсть» активизирует πυρώσεως («то, что разжигает»), тогда как греческое слово называет состояние пылания/жара.'
  naturalness: «Остерегайтесь предела в употреблении вина» тяжеловесно и создаёт впечатление, будто опасен именно установленный предел. «Остерегайтесь меры вина» короче и естественнее, сохраняя необычность исходного выражения; примечание должно прямо оговорить неясность.
  terminology: «Злые духи», «вожделение» и «постыдная корысть» приемлемы. Для ἀσωτία предпочтительно «распущенность», а для πυρώσις — «жгучая страсть».
  issues:
