    issue: Сужение значения ἀσωτίας
    rationale: «Распутство» в современном русском прежде всего связано с сексуальной распущенностью, тогда как ἀσωτία охватывает распущенность, невоздержность и разнузданный образ жизни в целом.
  - severity: medium
    issue: Неточное направление образа в «разжигающая страсть»
    rationale: πυρώσεως означает горение, жар или воспламенённость; предложенный вариант делает страсть причиной разжигания, а не самой «жгучей» страстью.
  - severity: low
