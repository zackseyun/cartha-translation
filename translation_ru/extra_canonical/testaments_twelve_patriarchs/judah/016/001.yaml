source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Φυλάξασθε² οὖν, τέκνα μου, *τὸν ὅρον τοῦ οἴνου³, *ἔστι γὰρ ἐν αὐτῷ τέσσαρα⁵ πνεύματα πονηρά⁷, ἐπιθυμίας, πυρώσεως, ἀσωτίας, αἰσχροκερδίας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/001.yaml
  text: 'Guard yourselves, therefore, my children, from the boundary of wine; for in it there are four evil spirits: desire, burning passion, debauchery, and shameful gain.'
translation:
  language: ru
  text: 'Итак, дети мои, остерегайтесь меры вина[a], ибо в нём — четыре злых духа: вожделение, жгучая страсть, распущенность и постыдная корысть.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «предела (границы) вина». Смысл выражения не вполне ясен; возможно также: «границы, связанной с вином» или «чрезмерного употребления вина».'
    reason: Необычное сочетание τὸν ὅρον τοῦ οἴνου допускает несколько пониманий; примечание сохраняет эту неоднозначность, не выдавая одно толкование за несомненное.
lexical_decisions:
- source_word: Φυλάξασθε
  choice: остерегайтесь
  rationale: Средний императив передаёт призыв оберегать себя от обозначенной опасности; по-русски «остерегайтесь» звучит естественно и прямо.
- source_word: τὸν ὅρον τοῦ οἴνου
  choice: предела в употреблении вина
  rationale: ὅρος буквально означает «граница, предел». Добавление «в употреблении» делает необычное греческое выражение понятным, не устраняя его смысловую неоднозначность.
- source_word: ἐπιθυμίας
  choice: вожделение
  rationale: Передаёт сильное, нравственно окрашенное желание в перечне злых духов.
- source_word: πυρώσεως
  choice: разжигающая страсть
  rationale: Сохраняет образ огня и накала, заключённый в слове πύρωσις, при естественном русском звучании.
- source_word: ἀσωτίας
  choice: распутство
  rationale: В данном нравственном перечне слово обозначает развратную, необузданную жизнь, а не только расточительность.
- source_word: αἰσχροκερδίας
  choice: постыдная корысть
  rationale: Сочетает значения позорности/низости и стремления к выгоде; «корысть» естественнее по-русски, чем буквальное «постыдная прибыль».
theological_decisions:
- issue: Онтологический статус «четырёх злых духов»
  choice: Сохранено буквальное выражение «четыре злых духа»
  alternative: Передать как четыре порока или пагубных побуждения
  rationale: Текст персонифицирует перечисленные пороки как πνεύματα πονηρά; перевод не должен заранее решать, понимаются ли они буквально или образно.
- issue: Связь злых духов с вином
  choice: Сохранено «в нём»
  alternative: «от него происходят» или «оно вызывает»
  rationale: Греческое ἐν αὐτῷ обозначает нахождение «в нём» и не формулирует прямо причинную связь.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Обращение «дети мои» и образный ряд оригинала сохранены; синтаксис упрощён лишь настолько, чтобы перечень ясно читался.
