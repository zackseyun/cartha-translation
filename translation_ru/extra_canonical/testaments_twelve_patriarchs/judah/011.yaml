  text: 1 And I knew that the race of the Canaanites was evil[a], but the impulse of youth blinded my understanding. 2 And when I saw her pouring wine, I was deceived, and I took her, though my father had not given counsel. 3 But while I was away, she went and took for Shelah a wife from Canaan. 4 And when I learned what she had done, I cursed her in the anguish of my soul. 5 And indeed she died in her wickedness[c][b], with her children.
translation:
  language: ru
  text: 1 И я знал, что род хананеев был порочен[a], но юношеский порыв ослепил мой разум. 2 Увидев, как она разливает вино, я был обманут и взял её[b] без совета моего отца[c]. 3 А в моё отсутствие она пошла и взяла Силе жену из Ханаана. 4 Узнав, что она сделала, я проклял её в терзании души моей. 5 И действительно, она умерла в своём нечестии вместе со своими детьми.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «род хананеев был зол». Греческое γένος означает род, происхождение или народную общность.'
    reason: lexical_alternative
  - marker: b
    text: Выражение «взял её», вероятно, означает «взял её в жёны», однако по-гречески оно звучит более кратко и резко.
    reason: lexical_alternative
  - marker: c
    text: Греческую фразу можно также понять как «хотя отец мой не дал на это совета» или как указание на действие без его одобрения.
    reason: alternative_reading
lexical_decisions:
- source_word: πονηρὸν γένος τῶν Χαναναίων
  choice: род хананеев был порочен
  rationale: «Род» передаёт значение происхождения и общности у γένος, не привнося современных биологических представлений о расе; «порочен» сохраняет нравственную оценку πονηρός.
- source_word: τὸ διαβούλιον τῆς νεότητος
  choice: юношеский порыв
  rationale: В контексте исповеди Иуды выражение обозначает свойственное юности внутреннее побуждение или замысел, возобладавший над рассудком; «порыв» естественно звучит по-русски и не превращает фразу в формальный «совет».
- source_word: ἐτύφλωσε τὴν διάνοιάν μου
  choice: ослепил мой разум
  rationale: Сохранён образ ослепления способности мыслить и понимать.
- source_word: οἰνοχοοῦσαν
  choice: разливает вино
  rationale: Причастие описывает наливание или подачу вина; конкретное «разливает вино» естественно передаёт сцену.
- source_word: ἠπατήθην
  choice: я был обманут
  rationale: Пассивная форма исходника сохранена без устранения исповедальной ответственности Иуды.
- source_word: ἔλαβον αὐτὴν
  choice: взял её
  rationale: Сохранена резкая краткость греческого выражения; в контексте оно, вероятно, подразумевает взятие в жёны, что пояснено в сноске.
- source_word: μὴ βουλευσαμένου τοῦ πατρός μου
  choice: без совета моего отца
  rationale: Формулировка сохраняет связь действия с отсутствием отцовского совета или обсуждения и не сужает смысл до юридического согласия.
- source_word: ἀπόντος ἐμοῦ
  choice: в моё отсутствие
  rationale: Естественная русская передача генитивной абсолютной конструкции.
- source_word: ἔλαβε τῷ Σηλὼμ γυναῖκα
  choice: взяла Силе жену
  rationale: Сохранён библейский оборот, обозначающий выбор или приобретение жены для другого лица.
- source_word: ἐκ τῆς Χαναάν
  choice: из Ханаана
  rationale: Формулировка сохраняет возможное совмещение географического происхождения и принадлежности к народу.
- source_word: ἐν ὀδύνῃ ψυχῆς μου
  choice: в терзании души моей
  rationale: Передана сильная внутренняя боль и сохранён торжественный завещательный регистр.
- source_word: ἐν τῇ πονηρίᾳ αὐτῆς
  choice: в своём нечестии
  rationale: «Нечестие» сохраняет нравственно-религиозную тяжесть πονηρία и естественно сочетается с оборотом «умерла в».
theological_decisions:
- issue: Коллективная нравственная характеристика хананеев
  choice: 'Прямо передать: «род хананеев был порочен».'
  alternative: «хананейский народ был зол»; «потомство хананеев было нечестиво»
  rationale: Греческий текст содержит широкое суждение о родовой общности. Перевод не смягчает его до характеристики одного человека, но слово «род» удерживает древний смысл происхождения, не навязывая современной расовой категории.
- issue: Брачный смысл ἔλαβον αὐτήν
  choice: Оставить в тексте краткое «взял её», пояснив вероятный брачный смысл в сноске.
  alternative: «взял её в жёны»; «женился на ней»
  rationale: Контекст указывает на брак, однако сам греческий оборот резок и краток; явное уточнение в основном тексте устранило бы присущую ему недосказанность.
- issue: Роль отца в μὴ βουλευσαμένου τοῦ πατρός μου
  choice: «без совета моего отца»
  alternative: «без согласия моего отца»; «хотя отец мой не дал совета»
  rationale: Исходная конструкция может указывать на отсутствие совета, обсуждения или одобрения со стороны Иакова. Выбранная формулировка не сводит смысл исключительно к формальному разрешению.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сделан ясным для обычного читателя; сохранены исповедальная резкость, образ ослепления разума и напряжённость спорных выражений. Нумерация следует связному тексту главы, представленному в консультационном слое; явно повреждённые и синтаксически несвязные фрагменты греческого свидетельства не внесены в основной текст без реконструкции.
