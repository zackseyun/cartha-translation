  source_fidelity: 'Основной связный текст передан точно: πονηρὸν γένος отражено как «род ... был порочен», образ ослеплённого разума сохранён; οἰνοχοοῦσαν естественно передано как «разливает вино»; пассив «я был обманут», резкое «взял её», отсутствие отцовского совета, устройство брака для Силы, проклятие и смерть «в нечестии» соответствуют греческому и английскому контрольному тексту. Формулировка «из Ханаана» удачно не снимает географически-этническую неоднозначность. Фрагменты между нынешними ст. 2 и 3 в приведённом греческом свидетельстве синтаксически повреждены и не имеют безопасного связного перевода; их отсутствие согласуется с английским POB audit trail, однако требует редакционного контроля источника.'
  naturalness: Русский текст литературный, ясный и сохраняет умеренно библейское достоинство. «Юношеский порыв», «в моё отсутствие», «в терзании души моей» и «в своём нечестии» звучат естественно в данном регистре. Оборот «взяла Силе жену» намеренно близок к библейской идиоме и понятен по контексту.
  terminology: «Род хананеев» корректно избегает современного биологизирующего значения слова «раса», не смягчая коллективную характеристику источника. «Порочен» приемлемо передаёт πονηρός в характеристике рода. «Нечестие» уместно для πονηρία. Имя «Сила» соответствует обычной русской библейской передаче Σηλώμ/Шелаха. Сноски поставлены у надлежащих слов и корректно разъясняют лексические и синтаксические варианты.
