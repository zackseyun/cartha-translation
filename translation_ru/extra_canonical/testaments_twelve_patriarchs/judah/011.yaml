    rationale: Эти слова не образуют надёжно переводимого связного предложения, а английский POB audit trail также их не включает. Не следует реконструировать или переводить их догадочно; редактору источника следует подтвердить, что пропуск оправдан принятой политикой обработки повреждённого текста.
