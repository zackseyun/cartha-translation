  text: And I said to her, “You have filled it with the sorcery of death. And how could you say, ‘I do not draw near to idols, but to the Lord alone’?”
translation:
  language: ru
  text: 'И я сказал ей: «Ты наполнила его чарами смерти. Как же ты могла сказать: „Я не приближаюсь к идолам, но только к Господу“?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γοητείας θανάτου
  choice: чарами смерти
  rationale: Сохраняет образную конструкцию греческого текста и не сводит её к менее точному прилагательному «смертоносными».
- source_word: προσεγγίζω
  choice: приближаюсь
  rationale: Передаёт основное значение глагола и сохраняет возможный культовый оттенок приближения для поклонения, не раскрывая его толкованием.
- source_word: μόνῳ
  choice: только
  rationale: 'Естественно передаёт исключительность: она утверждает, что приближается не к идолам, а лишь к Господу.'
- source_word: αὐτό
  choice: его
  rationale: Сохраняет местоименную отсылку исходного текста, не подставляя предполагаемый предмет из контекста.
theological_decisions:
- issue: Характер приближения к идолам и Господу
  choice: Сохранено буквальное «приближаюсь»
  alternative: «поклоняюсь» или «служу»
  rationale: Греческое προσεγγίζω допускает культовый смысл, но прямо не называет поклонение; перевод не должен устранять эту смысловую широту.
- issue: Риторический смысл πῶς εἶπας
  choice: «Как же ты могла сказать»
  alternative: «Как ты сказала»
  rationale: Форма вопроса в контексте выражает упрёк и сомнение в правомерности её слов; русская модальная конструкция естественно передаёт эту силу, не меняя содержания цитаты.
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Синтаксис прямой речи сделан естественным для русского, а необычный образ «чары смерти» сохранён без конфессионального истолкования.
