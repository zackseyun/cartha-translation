  text: Then after one day she came to me, and when she noticed the food, she said to me, “Why is it that you did not eat the food?”
translation:
  language: ru
  text: 'На следующий день она пришла ко мне и, заметив еду, спросила меня: «Почему ты не поел этой еды?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ μίαν ἡμέραν
  choice: На следующий день
  rationale: Естественная русская передача временной последовательности; буквальное «после одного дня» здесь звучало бы неестественно.
- source_word: ἐπιγνοῦσα τὸ βρῶμα
  choice: заметив еду
  rationale: В данном контексте ἐπιγινώσκω означает, что женщина увидела и осознала состояние оставленной еды; «узнав еду» по-русски создало бы неверное впечатление опознания.
- source_word: λέγει μοι
  choice: спросила меня
  rationale: Настоящее историческое передано прошедшим временем, естественным для русского повествования; вопросительная реплика позволяет конкретизировать λέγει как «спросила».
- source_word: οὐκ ἔφαγες τοῦ βρώματος
  choice: ты не ел этой еды
  rationale: Родительный τοῦ βρώματος при ἔφαγες передан естественной русской конструкцией; указательное «этой» соотносит вопрос с уже упомянутой едой.
