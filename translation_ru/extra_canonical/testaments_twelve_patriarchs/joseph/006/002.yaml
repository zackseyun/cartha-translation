base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/002.yaml
  text: But when the eunuch who was bringing it came, I looked up and saw a terrifying man handing me a sword with the dish; and I understood that it was a scheme to lead me astray.
translation:
  language: ru
  text: Но когда пришёл евнух, нёсший блюдо, я поднял глаза и увидел страшного человека, который вместе с блюдом протягивал мне меч. И я понял, что это была уловка, чтобы сбить меня с пути.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέβλεψα
  choice: я поднял глаза
  rationale: Естественно передаёт направленный вверх взгляд в данном повествовательном контексте.
- source_word: φοβερὸν ἄνδρα
  choice: грозного мужа
  rationale: Сохраняет внушающий страх облик видения и достоинство регистра; «муж» уместно для фигуры, увиденной Иосифом.
- source_word: μάχαιραν
  choice: меч
  rationale: В контексте символического видения обобщённое «меч» звучит естественно; греческое слово может обозначать меч или большой нож.
- source_word: περιέργεια
  choice: коварство
  rationale: В контексте попытки обольщения обозначает хитрую, злонамеренную уловку, а не современное русское «любопытство».
- source_word: εἰς ἀποπλάνησίν μου
  choice: призванное сбить меня с пути
  rationale: Передаёт цель — увести Иосифа с правильного пути, не уточняя сверх текста, идёт ли речь прежде всего о нравственном или ином заблуждении.
theological_decisions:
- issue: Природа увиденного грозного мужа
  choice: Не определять его как ангела, демона или иной конкретный духовный образ
  alternative: Назвать его демоном либо сверхъестественным посланником
  rationale: Греческий текст говорит лишь ἄνδρα, «мужа/человека», поэтому перевод сохраняет неопределённость.
- issue: Смысл ἀποπλάνησις
  choice: «сбить меня с пути»
  alternative: «совратить меня»
  rationale: Выбранная формулировка сохраняет образ ухода с верного пути и не сводит значение исключительно к сексуальному совращению, хотя контекст допускает такой оттенок.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан плавным, но последовательность событий и неоднозначность образа сохранены.
