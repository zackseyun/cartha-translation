    issue: «Грозного мужа»
    rationale: φοβερόν прежде всего характеризует фигуру как страшную/внушающую страх, а «муж» в современном русском здесь менее естественен и может отвлекать иными значениями.
  - severity: low
    issue: «Это было коварство»
    rationale: «Коварство» возможно по смыслу, но «уловка» точнее передаёт значение замысла или приёма (περιέργεια) и естественнее в конструкции с обозначением цели.
