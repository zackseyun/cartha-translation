  text: И после этого она послала мне пищу с подмешанным колдовским средством.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστέλλει
  choice: послала
  rationale: Историческое настоящее греческого повествования естественно передано русским прошедшим временем; подразумеваемый субъект женского рода сохранён по контексту.
- source_word: βρῶμα
  choice: пищу
  rationale: Общее обозначение еды передано нейтральным и литературным словом «пища».
- source_word: ἐν γοητείᾳ πεφυρμένον
  choice: смешанную с колдовским зельем
  rationale: πεφυρμένον означает «смешанное, замешанное»; γοητεία обозначает магическое или колдовское средство/воздействие. Формулировка передаёт конкретный образ примеси, не утверждая точнее, чем позволяет текст, её состав.
theological_decisions:
- issue: Характер γοητεία
  choice: колдовское зелье
  alternative: колдовство / чары
  rationale: Контекст смешивания с пищей указывает на применённое колдовское средство, однако перевод не уточняет его предполагаемый сверхъестественный механизм и не вводит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык; краткая повествовательная фраза сохраняет достоинство и ясность оригинала.
