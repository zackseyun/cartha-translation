  text: Know now, then, that the God of my father, through his angel, revealed your wickedness to me; and by this I preserved it as evidence against you, in hope that perhaps, seeing it, you might repent.”
translation:
  language: ru
  text: 'Итак, знай: Бог моего отца через Своего ангела открыл мне твоё злодеяние; и тем самым я сохранил это[a] для твоего обличения — в надежде, что, увидев это, ты, быть может, раскаешься.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «его» или «это». Точный референт местоимения в данном предложении не вполне ясен.'
    reason: Греческое αὐτό имеет форму винительного падежа мужского или среднего рода и не согласуется с κακίαν («злодеяние», женский род). Нейтральное «это» сохраняет неопределённость без неестественного для русского неясного мужского местоимения.
lexical_decisions:
- source_word: γνῶθι
  choice: знай
  rationale: Прямой и естественный русский эквивалент повелительной формы аориста.
- source_word: τὴν κακίαν σου
  choice: твоё злодеяние
  rationale: Передаёт нравственно предосудительное действие в данном контексте; «зло» было бы менее конкретно, а «порочность» смещало бы акцент на качество характера.
- source_word: ἐν τούτῳ
  choice: благодаря этому
  rationale: Выражает средство или обстоятельство сохранения, не превращая оборот в простое причинное «поэтому».
- source_word: ἐφύλαξα
  choice: сохранил
  rationale: Сохраняет основной смысл глагола — уберечь или оставить невредимым — и согласуется с мужским местоимением αὐτό.
- source_word: εἰς ἔλεγχόν σου
  choice: для твоего обличения
  rationale: 'Сохраняет судебно-нравственный оттенок ἔλεγχος: выявление вины и побуждение признать её.'
- source_word: εἴπως ἄρα ... μετανοήσεις
  choice: в надежде, что ... возможно, раскаешься
  rationale: Передаёт целевую направленность и подчёркнутую исходником неопределённость, не превращая раскаяние в гарантированный результат.
theological_decisions:
- issue: Посредничество ангела в откровении
  choice: через Своего ангела открыл мне
  alternative: посредством ангела явил мне
  rationale: Прямо сохраняет δι’ ἀγγέλου αὐτοῦ и притяжательное местоимение, не уточняя природу или статус ангела.
- issue: Неясный референт αὐτό
  choice: сохранил его
  alternative: сохранил это как свидетельство
  rationale: Форма αὐτό — винительный падеж мужского или среднего рода; она грамматически не согласуется с κακίαν женского рода. Перевод «его» сохраняет вероятную отсылку к лицу и не подменяет местоимение толкованием «свидетельство».
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной речи. Синтаксис слегка возвышенный, но понятный; сохранены исходная неопределённость местоимения и неуверенность относительно будущего раскаяния.
