  terminology: «Бог моего отца», «через Своего ангела», «злодеяние», «обличение» и «раскаешься» уместны для современного литературного, сдержанно возвышенного регистра. «Обличение» хорошо передаёт ἔλεγχος, не навязывая судебно-технического толкования.
