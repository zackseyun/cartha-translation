  source_fidelity: 'Основной смысл передан верно: Бог через Своего ангела открыл Иосифу зло женщины, а сохранение чего-то должно послужить её обличению и, возможно, привести к раскаянию. Однако «благодаря этому» делает ἐν τούτῳ преимущественно причинным («вследствие этого»), тогда как оборот естественнее передать как средство или результат: «тем самым».'
