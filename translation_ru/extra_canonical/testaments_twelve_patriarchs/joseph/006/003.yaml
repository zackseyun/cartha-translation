  text: And after he had gone out, I ate neither that food nor any of her other foods, but wept, not having tasted them.
translation:
  language: ru
  text: И когда он вышел, я плакал, не отведав ни того кушанья, ни какого-либо другого из её блюд.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ
  choice: когда он вышел
  rationale: Естественно передаёт греческий родительный абсолют с сохранением мужского местоимения и временной связи.
- source_word: ἔκλαιον
  choice: я плакал
  rationale: Сохраняет основное значение глагола и порядок смысловых частей греческого текста.
- source_word: μὴ γευσάμενος
  choice: не отведав
  rationale: Передаёт предшествующее обстоятельство и буквальный образ вкушения пищи; форма мужского рода согласуется с говорящим Иосифом.
- source_word: μήτε ἐκείνου μήτε ἄλλου τῶν ἐδεσμάτων αὐτῆς
  choice: ни того кушанья, ни какого-либо другого из её блюд
  rationale: Сохраняет парную отрицательную конструкцию, различие между указанным кушаньем и любым другим блюдом, а также принадлежность женщине.
