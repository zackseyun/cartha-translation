source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: ⌜Καὶ *ἐάν τις θέλει⁷ κακοποιῆσαι ὑμᾶς, ὑμεῖς τῇ ἀγαθοεργείᾳ⁸ εὔχεσθε ὑπὲρ αὐτοῦ, καὶ ἀπὸ παντὸς κακοῦ λυτρωθήσεσθε ὑπὸ⁹ Κυρίου¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/002.yaml
  text: And if anyone wants to do evil to you, you, by doing good, pray for him, and you will be delivered from every evil by the Lord.
translation:
  language: ru
  text: И если кто захочет причинить вам зло, то вы, творя добро, молитесь за него — и Господь избавит вас от всякого зла.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κακοποιῆσαι
  choice: причинить зло
  rationale: Передаёт направленное на адресатов злое действие естественным современным русским выражением, не сужая смысл до физического вреда.
- source_word: τῇ ἀγαθοεργείᾳ
  choice: творя добро
  rationale: Греческий дательный обозначает средство или сопутствующий образ действия; деепричастный оборот ясно и естественно выражает призыв отвечать добром.
- source_word: εὔχεσθε ὑπὲρ αὐτοῦ
  choice: молитесь за него
  rationale: Стандартно и точно передаёт ходатайственную молитву о человеке, желающем причинить зло.
- source_word: ἀπὸ παντὸς κακοῦ
  choice: от всякого зла
  rationale: 'Сохраняет широкий смысл κακόν: зло, бедствие или вред; контекст не требует его искусственного уточнения.'
- source_word: λυτρωθήσεσθε ὑπὸ Κυρίου
  choice: Господь избавит вас
  rationale: Активная русская конструкция естественнее буквального пассива и сохраняет Господа как действующего избавителя.
theological_decisions:
- issue: Связь между добрыми делами, молитвой и избавлением
  choice: Сохранена последовательность увещания и обещания без пояснения механизма избавления.
  alternative: Истолковать избавление как награду за добрые дела либо как безусловную гарантию отсутствия страданий.
  rationale: Греческий текст связывает повеление с обещанием, но не объясняет причинно-богословский механизм и не уточняет характер избавления.
translation_notes:
  register: Современный литературный русский язык с ясным, назидательным и dignified тоном. Конструкция «творя добро» сохраняет смысл ἀγαθοεργία без тяжеловесного «посредством благодеяния»; тире подчёркивает переход к обещанию.
