  source_fidelity: 'Смысл передан точно: διὰ τὴν ταπείνωσιν καὶ τὴν μακροθυμίαν выражает причинную связь, ἐμαυτῷ сохранено в «себе», а αὐτούς оставлено без искусственного уточнения. Однако «за моё смирение» в современном русском может означать награду или плату за добродетель, тогда как греческое διὰ здесь прежде всего обозначает основание/причину. «Благодаря моему» передаёт эту связь точнее.'
