source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἰδοὺ¹⁰ ⌜γὰρ⌉¹¹ ὁρᾶτε ὅτι ⌜διὰ τὴν *ταπείνωσιν καὶ τὴν μακροθυμίαν μου¹²⌉ θυγατέρα *ἱερέως ἡλιουπόλεως¹³ ἔλαβον ἐμαυτῷ¹⁴ εἰς γυναῖκα¹⁵, καὶ ἑκατὸν τάλαντα *χρυσίου δέδονταί μοι¹⁶ *σὺν αὐτῇ¹⁷, *καὶ ὁ¹⁸ Κύριός μου¹⁹ αὐτοὺς²⁰ κατεδούλωσεν²¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/003.yaml
  text: For see, you know that through my humility and my long-suffering I took for myself as wife the daughter of the priest of Heliopolis, and a hundred talents of gold were given to me with her, and my Lord made them subject to me.
translation:
  language: ru
  text: Ибо, как видите, благодаря моему смирению и долготерпению я взял себе в жёны дочь жреца Гелиополя; вместе с ней мне дали сто талантов золота, и мой Господь подчинил их мне.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «поработил их для меня» или «сделал их моими рабами». К кому относится «их», в греческом тексте не вполне ясно; грамматически это местоимение не относится к «талантам».'
    reason: Поясняет сильное значение κατεδούλωσεν и сохраняет неуточнённый референт αὐτούς, не навязывая интерпретацию.
lexical_decisions:
- source_word: ταπείνωσις
  choice: смирение
  rationale: Передаёт нравственное самоумаление и кротость без сужения значения до унижения как внешнего состояния.
- source_word: μακροθυμία
  choice: долготерпение
  rationale: Сохраняет традиционно-библейский оттенок терпеливой стойкости по отношению к людям и испытаниям.
- source_word: ἱερεύς
  choice: жрец
  rationale: В контексте языческого культа Гелиополя современное русское «жрец» точнее, чем «священник».
- source_word: τάλαντα χρυσίου
  choice: талантов золота
  rationale: Сохраняет древнюю меру веса и материальное значение χρυσίον.
- source_word: κατεδούλωσεν
  choice: подчинил
  rationale: Естественно передаёт каузативное «сделал подвластными», не вводя здесь излишне буквальное «поработил».
theological_decisions:
- issue: Референт местоимения αὐτούς («их»)
  choice: Сохранено местоимение «их» с пояснительной сноской
  alternative: Истолковать как «подчинил мне египтян/моих врагов» или согласовать с ближайшим существительным «таланты»
  rationale: Греческое местоимение мужского рода множественного числа не согласуется с «талантами» среднего рода и имеет не вполне явный антецедент; перевод не должен молча устранять эту неоднозначность.
- issue: Титул Κύριός μου
  choice: мой Господь
  alternative: мой господин
  rationale: Заглавная буква отражает наиболее вероятное указание на Бога в контексте свидетельства Иосифа, при сохранении притяжательной формы оригинала.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Ибо вот» сохраняет связку γὰρ и указательное ἰδού; точка с запятой облегчает длинную греческую конструкцию. Использовано «жрец Гелиополя» как естественное обозначение служителя египетского культа.
