base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/004.yaml
  text: Indeed he gave me beauty beyond the handsome men of Israel, and preserved me until old age in strength and in beauty; for I was like Jacob in all things.
translation:
  language: ru
  text: И действительно, Он даровал мне красоту, превосходящую красоту прекрасных мужчин Израиля, и сохранил меня до старости в силе и красоте, ибо во всём я был подобен Иакову.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε καὶ
  choice: Поистине
  rationale: Передаёт усилительно-утвердительное значение сочетания естественным литературным русским языком.
- source_word: ὡραιότητα ... ὑπὲρ ὡραίους Ἰσραήλ
  choice: красоту, превосходившую красоту всех красавцев Израиля
  rationale: Сохраняет смысл превосходства внешней красоты Иосифа над красивыми мужчинами Израиля; добавление «всех» естественно выражает сравнительную конструкцию с множественным числом, не меняя её направленности.
- source_word: ἐφύλαξέ με ἕως γήρους
  choice: сохранил меня до старости
  rationale: Прямо и естественно передаёт длительное Божье сохранение Иосифа вплоть до преклонного возраста.
- source_word: ἐν δυνάμει καὶ ἐν κάλλει
  choice: в силе и красоте
  rationale: Сохраняет параллельные существительные исходного текста без ненужного уточнения характера силы.
- source_word: ὅμοιος ἤμην ἐν πᾶσι τῷ Ἰακώβ
  choice: во всём я был подобен Иакову
  rationale: Формально сохраняет широкое и потенциально неоднозначное «во всём», не конкретизируя основание сходства.
theological_decisions:
- issue: Не названный в данном стихе субъект глаголов ἔδωκε и ἐφύλαξε
  choice: Он
  alternative: Бог
  rationale: Местоимение сохраняет дискурсивную связь с предшествующим контекстом и не вносит в сам стих имени, отсутствующего в представленном греческом тексте.
- issue: Объём сходства Иосифа с Иаковом
  choice: во всём я был подобен Иакову
  alternative: я был во всём похож на Иакова
  rationale: Сохранена намеренно широкая формулировка источника без богословского или психологического ограничения сходства.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной речи. Синтаксис сохраняет единство исходного высказывания; прописное «Он» указывает на божественного референта, не подставляя отсутствующее в стихе имя.
