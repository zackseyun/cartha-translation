id: T12P.JOS.18.1
reference: Testament of Joseph 18:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: ⌜Ἐὰν⌉¹ οὖν καὶ ὑμεῖς² πορευθῆτε ἐν ταῖς³ ἐντολαῖς Κυρίου⁴, ὑψώσει ὑμᾶς⁵ *ὁ θεὸς⁶ ⌜ἐν ἀγαθοῖς⁷ εἰς αἰῶνας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/001.yaml
  text: If, then, you also walk in the commandments of the Lord, God will exalt you with good things forever.
translation:
  language: ru
  text: Итак, если и вы будете следовать заповедям Господа, Бог возвысит вас, даруя блага навеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορευθῆτε ἐν ταῖς ἐντολαῖς
  choice: будете следовать заповедям
  rationale: Буквально выражение означает «ходить в заповедях», однако по-русски естественно передаётся как постоянное следование заповедям.
- source_word: ὑψώσει ὑμᾶς
  choice: возвысит вас
  rationale: Сохраняет прямой смысл глагола ὑψόω и не уточняет, в чём именно состоит возвышение.
- source_word: ἐν ἀγαθοῖς
  choice: даруя блага
  rationale: Передаёт инструментально-обстоятельственный оттенок выражения естественным русским оборотом, не сводя широкое τὰ ἀγαθά лишь к материальным благам.
- source_word: εἰς αἰῶνας
  choice: навеки
  rationale: Краткая и стилистически достойная передача значения неограниченной длительности.
theological_decisions:
- issue: Связь послушания заповедям с последующим возвышением
  choice: сохранено прямое условное построение
  alternative: ослабить условие формулировкой о простом временном следовании
  rationale: Греческое ἐάν с сослагательным наклонением прямо выражает условие; текст не поясняет богословский механизм этой связи, поэтому он не добавлен.
- issue: Содержание обещанных ἀγαθά
  choice: оставлено широкое «блага»
  alternative: «благословения» или «добрые дела»
  rationale: Исходное слово допускает широкий смысл и не требует конфессионально окрашенного или более узкого уточнения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Союз «итак» передаёт οὖν; порядок слов сделан естественным для русского языка. Сноски не требуются.
