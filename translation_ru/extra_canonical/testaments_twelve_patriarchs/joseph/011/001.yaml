id: T12P.JOS.11.1
reference: Testament of Joseph 11:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ ὑμεῖς οὖν¹, *τέκνα μου², ⌜ἔχετε ἐν πάσῃ³ πράξει ὑμῶν *πρὸ ὀφθαλμῶν ὑμῶν⁴ *τὸν τοῦ θεοῦ φόβον⁵, καὶ⁷ τιμᾶτε⁶ τοὺς ἀδελφοὺς ὑμῶν· πᾶς γὰρ ὁ⁷ ποιῶν⁸ νόμον Κυρίου ἀγαπηθήσεται ὑπʼ⁹ αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/011/001.yaml
  text: And so, my children, in every deed of yours keep the fear of God before your eyes, and honor your brothers; for everyone who does the law of the Lord will be loved by him.
translation:
  language: ru
  text: Итак, дети мои, во всех своих делах держите страх Божий перед глазами и почитайте своих братьев, ибо всякий, кто исполняет закон Господа, будет любим Им.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ὑμεῖς οὖν
  choice: Итак
  rationale: Передаёт итогово-побудительный переход οὖν; местоимение ὑμεῖς естественно выражено формами повелительных глаголов и обращением.
- source_word: τέκνα μου
  choice: дети мои
  rationale: Прямое и естественное соответствие ласковому обращению τέκνα μου.
- source_word: ἐν πάσῃ πράξει ὑμῶν
  choice: во всех своих делах
  rationale: 'Русское множественное число естественно передаёт распределительное значение греческого единственного числа: в каждом совершаемом деле.'
- source_word: πρὸ ὀφθαλμῶν ὑμῶν
  choice: перед глазами
  rationale: Сохраняет зрительный образ греческого выражения без ненужного повторения местоимения.
- source_word: τὸν τοῦ θεοῦ φόβον
  choice: страх Божий
  rationale: Традиционное и понятное русское обозначение благоговейного страха перед Богом; не сводит выражение лишь к почтению.
- source_word: τιμᾶτε
  choice: почитайте
  rationale: Передаёт значение уважения и оказания чести, а не только внутреннего отношения.
- source_word: τοὺς ἀδελφοὺς ὑμῶν
  choice: своих братьев
  rationale: Сохраняет родственный язык источника и естественную русскую возвратную притяжательность.
- source_word: ποιῶν νόμον Κυρίου
  choice: исполняет закон Господа
  rationale: Идиоматически передаёт буквальное «делающий закон» как деятельное соблюдение и исполнение закона.
- source_word: ἀγαπηθήσεται ὑπʼ αὐτοῦ
  choice: будет любим Им
  rationale: Сохраняет пассивную конструкцию и будущность; «Им» соотнесено с Господом, как в ближайшем контексте.
theological_decisions:
- issue: Значение выражения «страх Божий»
  choice: Сохранено «страх Божий»
  alternative: «благоговение перед Богом»
  rationale: Греческое φόβος действительно означает страх; замена на одно лишь «благоговение» преждевременно устранила бы смысловую напряжённость.
- issue: Референт местоимения αὐτοῦ
  choice: «Им» с прописной буквы, относящееся к Господу
  alternative: «им» без уточняющей капитализации либо понимание как относящегося к закону
  rationale: Грамматика и смысл ближайшей фразы естественнее относят αὐτοῦ к Κυρίου; капитализация делает эту связь ясной в русском тексте, не добавляя нового участника.
translation_notes:
  register: Современный литературный русский с достоинством завещательного наставления. Синтаксис сделан плавным и общедоступным, при этом сохранены ключевые образы и богословски значимые формулировки греческого текста.
