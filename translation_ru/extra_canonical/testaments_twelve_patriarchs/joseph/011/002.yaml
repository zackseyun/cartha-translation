  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/011/002.yaml
  text: And when I was coming with the Ishmaelites, they kept asking me, saying, “Are you a servant?” And I said that I was a household servant, so that I might not put my brothers to shame.
translation:
  language: ru
  text: 'Когда я шёл с измаильтянами, они всё спрашивали меня: «Ты раб?» Я сказал, что я домашний раб, чтобы не опозорить своих братьев.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐρχόμενος
  choice: Когда я шёл
  rationale: Передаёт сопутствующее обстоятельство движения естественным русским оборотом, не уточняя направление, которого греческий текст здесь не выражает.
- source_word: μετὰ τῶν Ἰσμαϊλιτῶν
  choice: с измаильтянами
  rationale: Традиционная и понятная передача этнонима; предлог сохраняет значение совместного следования.
- source_word: ἐπηρώτων
  choice: всё спрашивали
  rationale: Имперфект указывает на продолжавшееся или повторявшееся расспрашивание.
- source_word: Δοῦλος
  choice: раб
  rationale: Основное значение δοῦλος — человек в рабском положении; «слуга» могло бы неоправданно смягчить социальный статус.
- source_word: δοῦλος ἐξ οἴκου
  choice: домашний раб
  rationale: Естественно передаёт буквальное «раб из дома/домашнего хозяйства» и согласуется с контекстом ответа о статусе.
- source_word: αἰσχύνω
  choice: опозорить
  rationale: Передаёт причинение стыда или бесчестья братьям; в данном контексте речь о том, чтобы не выставить их поступок постыдным.
