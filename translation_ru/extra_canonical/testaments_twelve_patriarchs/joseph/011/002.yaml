- from: 'Когда я шёл с измаильтянами, они всё спрашивали меня: «Ты раб?» Я отвечал, что я домашний раб, чтобы не опозорить своих братьев.'
  to: 'Когда я шёл с измаильтянами, они всё спрашивали меня: «Ты раб?» Я сказал, что я домашний раб, чтобы не опозорить своих братьев.'
  rationale: Заменён только глагол «отвечал» на «сказал», чтобы сохранить аористное, единичное действие εἶπον. Остальные решения черновика соответствуют греческому тексту и современному литературному русскому употреблению.
