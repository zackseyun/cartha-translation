lexical_decisions:
- source_word: Ὁρᾶτε
  choice: посмотрите
  rationale: Повелительное наклонение передано естественным русским призывом обратить внимание на пример Иосифа.
- source_word: τέκνα μου
  choice: дети мои
  rationale: Прямое и стилистически естественное соответствие обращению.
- source_word: πόσα ὑπέμεινα
  choice: сколько я вытерпел
  rationale: ὑπομένω обозначает стойкое перенесение тягот; «вытерпел» ясно и естественно передаёт этот смысл.
- source_word: ἵνα μὴ αἰσχύνω
  choice: чтобы не опозорить
  rationale: 'Передаёт целевую конструкцию и каузативный смысл глагола: навлечь позор или бесчестье на других.'
- source_word: τοὺς ἀδελφούς μου
  choice: моих братьев
  rationale: Буквальное и однозначное соответствие контексту повествования об Иосифе.
