source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὅτε ⌜δὲ⌉¹³ ἦλθον οἱ ἀδελφοί μου εἰς Αἴγυπτον, αὐτοὶ¹⁴ γινώσκουσιν¹⁵ ὅτι *ἀπέστρεψα τὸ ἀργύριον αὐτοῖς¹⁶, καὶ οὐκ ὠνείδισα *αὐτούς, καὶ¹⁷ παρεκάλεσα¹⁸ ⌜αὐτούς⌉¹⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/004.yaml
  text: And when my brothers came to Egypt, they themselves know that I returned their money to them, and did not reproach them, but encouraged them.
translation:
  language: ru
  text: Когда же мои братья пришли в Египет, они сами знают, что я вернул им серебро, не упрекнул их и ободрил их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἀργύριον
  choice: серебро
  rationale: Буквальное значение греческого слова; в данном контексте речь идёт о серебре, уплаченном за зерно, то есть о деньгах.
- source_word: οὐκ ὠνείδισα
  choice: не упрекнул
  rationale: 'Передаёт смысл глагола ὀνειδίζω: порицать, укорять или попрекать; нейтральное современное выражение соответствует контексту.'
- source_word: παρεκάλεσα
  choice: утешил
  rationale: Глагол παρακαλέω допускает значения «утешать», «ободрять», «увещевать». Здесь, после отказа Иосифа упрекать братьев, наиболее естественно значение утешения, созвучное повествованию Быт 50:21, при сохранении смысловой близости к «ободрил».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с близким к греческому синтаксисом. Усилительное αὐτοὶ передано как «они сами». Союз καὶ сохранён как «и», а не противопоставительное «но», поскольку греческий текст прямо не выражает противопоставления.
