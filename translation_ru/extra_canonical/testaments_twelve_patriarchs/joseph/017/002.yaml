  verdict: approve
  source_fidelity: 'Текст точно передаёт греческое увещание: καὶ ὑμεῖς οὖν отражено как «Итак, и вы», ἀγαπᾶτε ἀλλήλους — «любите друг друга», а ἐν μακροθυμίᾳ συγκρύπτετε ἀλλήλων τὰ ἐλαττώματα — «с долготерпением покрывайте недостатки друг друга». «Покрывайте» удачно сохраняет образный смысл συγκρύπτετε («скрывать, не выставлять наружу») без неоправданного усиления. Неустойчивое в рукописной традиции οὖν, заключённое в скобки в исходном издании, передано так же, как в английской контрольной версии; это допустимо и не создаёт ложной определённости относительно более широкого текста.'
  naturalness: Фраза грамматически ясна и естественна для современного литературного русского в наставительном, несколько возвышенном регистре. «Долготерпение» является уместным книжно-библейским словом и точно передаёт μακροθυμία. Повтор «друг друга» оправдан явной взаимностью ἀλλήλους в обеих частях греческой фразы.
  terminology: «Любите», «долготерпение», «покрывайте» и «недостатки» терминологически последовательны и не вносят конфессионального истолкования. «Недостатки» верно передаёт ἐλαττώματα, не сужая его до «грехов».
