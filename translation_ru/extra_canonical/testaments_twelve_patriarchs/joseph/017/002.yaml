  text: Καὶ ὑμεῖς ⌜οὖν⌉ ἀγαπᾶτε ἀλλήλους, ⌜καὶ ἐν μακροθυμίᾳ⁴ *συγκρύπτετε ἀλλήλων⁵ τὰ ἐλαττώματα⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/002.yaml
  text: You also, therefore, love one another, and with patience conceal one another’s shortcomings.
translation:
  language: ru
  text: Итак, и вы любите друг друга и с долготерпением покрывайте недостатки друг друга.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: итак
  rationale: Передаёт вывод или увещательный переход, сохраняя связь с предшествующим контекстом.
- source_word: ἐν μακροθυμίᾳ
  choice: с долготерпением
  rationale: Сохраняет оттенок длительного терпения и сдержанности, присущий μακροθυμία; выражение уместно в возвышенном наставительном регистре.
- source_word: συγκρύπτετε
  choice: покрывайте
  rationale: Передаёт повеление не выставлять чужие слабости напоказ и сохраняет образность греческого глагола, не усиливая его до оправдания или отрицания недостатков.
- source_word: τὰ ἐλαττώματα
  choice: недостатки
  rationale: Естественный современный эквивалент для слабостей или изъянов; не вводит более узкое нравственно-богословское понятие «грехи».
theological_decisions:
- issue: Смысл призыва покрывать недостатки
  choice: покрывайте недостатки друг друга
  alternative: скрывайте недостатки друг друга
  rationale: «Покрывайте» сохраняет метафору и допускает смысл терпеливого, милосердного отношения, тогда как «скрывайте» может звучать как призыв утаивать проступки.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксический параллелизм и взаимность ἀλλήλους сохранены; несколько архаизирующее «долготерпение» оправдано точностью и узнаваемостью библейского регистра.
