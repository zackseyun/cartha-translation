  text: And I did not exalt myself among them in arrogance because of my worldly glory, but I was among them as one of the least.
translation:
  language: ru
  text: И я не возвысил себя среди них в своей надменности из-за своей мирской славы, но был среди них как один из самых незначительных.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕψωσα ἐμαυτόν
  choice: превозносился
  rationale: Возвратная форма естественно передаёт буквальное «возвысил себя» и нравственный оттенок самовозвышения.
- source_word: ἐν ἀλαζονείᾳ
  choice: высокомерно
  rationale: Наречная передача сохраняет значение надменности и делает русскую фразу плавной.
- source_word: κοσμικήν μου δόξαν
  choice: своей мирской славы
  rationale: «Мирская» прямо передаёт κοσμικήν и здесь обозначает славу, связанную с положением в этом мире.
- source_word: ὡς εἷς τῶν ἐλαχίστων
  choice: как один из самых незначительных
  rationale: Передаёт сравнительно-превосходный смысл ἐλαχίστων, не конкретизируя его как социальный ранг или нравственное достоинство.
theological_decisions:
- issue: Характер самоуничижения Иосифа
  choice: как один из самых незначительных
  alternative: как один из меньших
  rationale: Выбран естественный современный русский оборот, сохраняющий открытым, идёт ли речь о положении, значимости или почёте среди людей.
translation_notes:
  register: Современный литературный русский язык; достоинство и лаконизм оригинала сохранены. Союзное противопоставление «но» передаёт ἀλλά, а повтор «среди них» сохраняет структуру греческого текста.
