  source_fidelity: 'Основная часть передана точно. Однако «угодно и ведёт ко благу» не соответствует надёжно греческому εὐδοκοῦσιν εἰς ἀγαθόν: εὐδοκέω выражает благоволение, одобрение или расположенность, но не «вести ко благу». Кроме того, ἀγαθῆς грамматически определяет καρδίας, поэтому «намерение доброго сердца» точнее, чем «доброе намерение сердца».'
  naturalness: «Согласию братьев» и «намерению доброго сердца» соответствуют современному литературному русскому и сохраняют сжатый назидательный стиль. Неясный заключительный оборот лучше передать кратко и пояснить в сноске, не превращая его в однозначное причинно-следственное утверждение.
  terminology: «Согласие» удачно передаёт ὁμόνοια, а «намерение» — προαίρεσις. «Расположены к добру» передаёт возможный смысл εὐδοκοῦσιν εἰς ἀγαθόν без богословского уточнения адресата или бездоказательного значения «ведёт ко благу».
