base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/003.yaml
  text: For God delights in the harmony of brothers and in the good intention of the heart; these are well-pleasing for good.
translation:
  language: ru
  text: Ибо Бог радуется согласию братьев и намерению доброго сердца; они расположены к добру.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий оборот «они расположены к добру» (εὐδοκοῦσιν εἰς ἀγαθόν) в издании отмечен как текстуально сомнительный. Его подлежащее неясно; буквально: «они благоволят к добру».'
    reason: Сохраняет перевод всех слов источника, отмечает текстуальную сомнительность чтения и не приписывает неясному множественному числу однозначный референт.
lexical_decisions:
- source_word: ὁμονοίᾳ ἀδελφῶν
  choice: согласию братьев
  rationale: ὁμόνοια обозначает единодушие, согласие и гармоничные отношения; «согласие братьев» естественно и точно передаёт выражение без излишнего уточнения.
- source_word: προαιρέσει καρδίας ἀγαθῆς
  choice: доброму намерению сердца
  rationale: προαίρεσις здесь означает сознательное намерение или нравственную направленность; ἀγαθῆς грамматически относится к καρδίας, но по смыслу характеризует всё выражение. Формулировка сохраняет компактность и возможную смысловую связь обоих слов.
- source_word: εὐδοκοῦσιν εἰς ἀγαθόν
  choice: угодно и ведёт ко благу
  rationale: 'Греческая фраза текстуально и синтаксически трудна: εὐδοκοῦσιν имеет форму множественного числа и может передавать благоволение или угодность, а εἰς ἀγαθόν — направленность к благу. Перевод делает предполагаемый смысл понятным, не скрывая неопределённости, отмеченной сноской.'
theological_decisions:
- issue: Кому угодны согласие и доброе намерение
  choice: Не добавлять явное «Богу» во второй части
  alternative: «и то и другое угодно Богу и ведёт ко благу»
  rationale: Хотя Бог является естественным смысловым ориентиром после первой части, в трудном греческом обороте дополнение «Богу» отсутствует. Его явное добавление чрезмерно разрешило бы неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; сохранён афористический строй стиха. «Согласие братьев» звучит естественно, а неясность заключительного оборота вынесена в сноску, чтобы основной текст оставался читаемым.
