base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/007.yaml
  text: And their sons were my sons, and my sons were as servants to them, and their souls were my soul, and every pain of theirs was my pain, and every weakness of theirs was my sickness, and their purpose was my purpose.
translation:
  language: ru
  text: Их сыновья были моими сыновьями, а мои сыновья — как их рабы[a]; их душа была моей душой, всякая их боль — моей болью, всякая их немощь — моей болезнью, и их замысел — моим замыслом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуги».'
    reason: Греческое δοῦλοι обычно указывает на рабское, подчинённое положение, но в зависимости от контекста может передаваться более широко как «слуги».
lexical_decisions:
- source_word: οἱ υἱοὶ αὐτῶν υἱοί μου
  choice: их сыновья были мне как родные сыновья
  rationale: В греческом связка опущена. Добавление «были мне как родные» естественно по-русски передаёт отождествление и заботу, не утверждая буквального отцовства.
- source_word: δοῦλοι
  choice: слуги
  rationale: В данном сравнении «слуги» звучит естественно и сохраняет идею подчинённого служения; возможное более жёсткое значение отмечено в сноске.
- source_word: ἡ ψυχὴ αὐτῶν ψυχή μου
  choice: их душа была моей душой
  rationale: Сохранено единственное число ψυχή и выразительное отождествление исходного текста, хотя обладатель обозначен формой множественного числа.
- source_word: ἄλγημα
  choice: боль
  rationale: Передаёт телесное или душевное страдание без ненужного сужения значения.
- source_word: μαλακία … ἀσθένεια
  choice: немощь … болезнь
  rationale: 'Разные русские слова сохраняют лексическое различие греческой пары: состояние слабости и воспринимаемое им заболевание.'
- source_word: βουλή
  choice: замысел
  rationale: Передаёт намерение или общий план; это лучше соответствует параллельному отождествлению, чем более узкое «совет».
theological_decisions:
- issue: Степень отождествления Иосифа с сыновьями других лиц
  choice: 'Сохранена последовательность сильных образных отождествлений: «их душа была моей душой», «их замысел — моим замыслом».'
  alternative: Ослабить до «я разделял их чувства и намерения».
  rationale: Исходный текст намеренно повторяет именные конструкции и выражает глубокую солидарность; пересказ устранил бы их напряжённость и риторику.
translation_notes:
  register: Современный литературный русский с торжественным параллелизмом. Точки с запятой и тире поддерживают ритм греческой цепочки, не делая фразу архаичной.
