  text: Καὶ²⁰ μετὰ θάνατον *Ἰακώβ, τοῦ πατρός μου²¹, ⌜περισσοτέρως⌉ ἠγάπησα αὐτούς, καὶ πάντα ὅσα ἤθελον²² ⌜ὑπερεκπερισσοῦ⌉²³ *ἐποίουν αὐτοῖς²⁴.
