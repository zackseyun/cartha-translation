  text: And after the death of Jacob my father, I loved them even more, and whatever they wanted I did for them beyond measure.
translation:
  language: ru
  text: И после смерти Иакова, отца моего, я полюбил их ещё больше и делал для них всё, чего они хотели, даже сверх всякой меры.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περισσοτέρως
  choice: ещё больше
  rationale: Передаёт усиленную сравнительную степень любви естественным современным русским выражением.
- source_word: πάντα ὅσα ἤθελον
  choice: всё, чего они хотели
  rationale: Сохраняет широкий и прямой смысл греческой конструкции без уточнения, кого именно обозначает местоимение.
- source_word: ὑπερεκπερισσοῦ
  choice: даже сверх всякой меры
  rationale: Выражает предельную усиленность наречия и звучит достойно и понятно по-русски.
- source_word: ἐποίουν αὐτοῖς
  choice: делал для них
  rationale: Естественно передаёт дательный αὐτοῖς как указание на тех, в чью пользу совершались действия.
