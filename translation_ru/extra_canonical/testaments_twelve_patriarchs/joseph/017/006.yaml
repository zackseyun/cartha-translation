  text: '*Καὶ οὐκ ἀφῆκα²⁵ αὐτοὺς²⁶ θλιβῆναι *ἕως μικροῦ πράγματος²⁷. καίγε πᾶν ὃ ἦν ἐν τῇ²⁸ χειρί μου αὐτοῖς δέδωκα²⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/006.yaml
  text: And I did not allow them to be distressed even in the smallest matter; indeed, everything that was in my hand I gave to them.
translation:
  language: ru
  text: И я не допускал, чтобы они терпели тяготы даже в самом малом; более того, всё, что было в моих руках, я отдал им.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλιβῆναι
  choice: терпели тяготы
  rationale: Пассивный инфинитив передаёт переживание притеснения, бедствия или тяжёлых обстоятельств; формулировка сохраняет широту греческого слова и естественно звучит по-русски.
- source_word: ἕως μικροῦ πράγματος
  choice: даже в самом малом
  rationale: Передаёт смысл предельной малости дела или обстоятельства без неестественного буквального оборота.
- source_word: καίγε
  choice: более того
  rationale: Частица имеет усилительно-присоединительное, а не противопоставительное значение и вводит более сильное утверждение.
- source_word: ἐν τῇ χειρί μου
  choice: в моих руках
  rationale: Сохранён образ руки как обозначение имущества, средств или того, чем говорящий мог распоряжаться; русский оборот допускает ту же смысловую широту.
- source_word: δέδωκα
  choice: отдал
  rationale: Перфект указывает на совершённую передачу с сохраняющимся результатом; в русском повествовании это естественно выражается совершенным видом.
