  text: Тогда они решили продать меня, чтобы я не оказался в их руках.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε οὖν
  choice: Тогда
  rationale: Передаёт временно-следственную связь естественно по-русски; отдельное «итак» здесь утяжеляло бы фразу, а οὖν текстуально отмечено как вариант.
- source_word: ἐβουλεύσαντο
  choice: решили
  rationale: Средний аорист обозначает принятое ими после обдумывания решение; «решили» точнее и естественнее, чем буквальное «посоветовались».
- source_word: πωλῆσαί με
  choice: продать меня
  rationale: Прямое соответствие греческому инфинитивному обороту.
- source_word: ἵνα μὴ εὑρεθῶ ἐν ταῖς χερσὶν αὐτῶν
  choice: чтобы меня не нашли у них в руках
  rationale: Сохранены пассивная конструкция и образ «в руках», подразумевающий их власть и ответственность, без снятия присущей оригиналу неоднозначности.
