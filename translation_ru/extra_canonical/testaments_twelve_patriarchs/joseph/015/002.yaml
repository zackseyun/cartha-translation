  text: “Why did you say that you were a servant? For behold, we have learned that you are the son of a great man in the land of Canaan, and that your father is still mourning for you in sackcloth and ashes.”
translation:
  language: ru
  text: «Почему ты сказал, что ты раб? Ведь вот, мы узнали, что ты — сын знатного человека в земле Ханаанской и что твой отец до сих пор оплакивает тебя во вретище и пепле»[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вретище — грубая ткань и одежда из неё; вретище и пепел были древними знаками глубокой скорби.
    reason: Поясняет редкое слово и культурный смысл образа, не добавляя деталей, которых нет в исходном тексте.
lexical_decisions:
- source_word: δοῦλον
  choice: раб
  rationale: Прямое соответствие греческому слову; сохраняет социальный статус, заявленный Иосифом, без смягчения до «слуги».
- source_word: ἀνδρὸς μεγάλου
  choice: знатного человека
  rationale: В данном контексте μέγας указывает на высокое положение и значительность человека; «знатный» естественно передаёт этот смысл по-русски.
- source_word: πενθεῖ
  choice: оплакивает
  rationale: Глагол обозначает скорбь, особенно траур по предполагаемой смерти; «оплакивает» точно соответствует контексту.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: сидя во вретище и пепле
  rationale: Сохраняется традиционная библейская образность траура; добавленное «сидя» делает русскую конструкцию естественной и отражает подразумеваемое пребывание в таком состоянии.
