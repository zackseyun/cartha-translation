  rationale: Исправление удаляет не засвидетельствованное оригиналом «мне», точнее передаёт «среди них» и оставляет спорную связь «возмездия» и «опасности» в самом тексте, с кратким пояснением в сноске. Остальные формулировки не требуют изменения.
