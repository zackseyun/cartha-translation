  source_fidelity: 'Вставка «мне угрожала» отсутствует в греческом тексте: родительный κινδύνου («опасности») не уточняет, кому именно угрожала опасность. Её следует не добавлять в основной текст. «Придя в их среду» точнее передаёт ἐλθὼν ἐν αὐτοῖς, чем «прийти к ним».'
  naturalness: Предлагаемая редакция остаётся современным литературным русским. Оборот «как бы ... не совершил» естественно выражает опасение; несколько формульное «совершил возмездие» оправдано сохранением необычной и не до конца ясной конструкции оригинала.
  terminology: «Возмездие» точно передаёт ἐκδίκησις без преждевременного уточнения объекта или характера угрозы. «Велик пред Богом и людьми» приемлемо в умеренно возвышенном регистре и точно отражает μέγας ... παρὰ Θεῷ καὶ ἀνθρώποις.
