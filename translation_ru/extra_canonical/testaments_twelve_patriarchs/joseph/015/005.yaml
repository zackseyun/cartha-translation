base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/005.yaml
  text: For they feared my father, lest he come among them and take vengeance for the danger; for they had heard that he was great before God and men.
translation:
  language: ru
  text: 'Ибо они боялись моего отца: как бы он, придя в их среду, не совершил возмездия за опасность[a]. Ведь они слышали, что он велик пред Богом и людьми.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «совершил возмездие за опасность». Сочетание ἐκδίκησιν κινδύνου необычно; не вполне ясно, какую именно опасность оно имеет в виду.'
    reason: Сохраняет и объясняет лексико-синтаксическую неясность греческого выражения, не добавляя невыраженное в оригинале указание на того, кому угрожала опасность.
lexical_decisions:
- source_word: ἐλθὼν ἐν αὐτοῖς
  choice: пришёл к ним
  rationale: Передаёт движение в их среду естественным современным русским выражением, не опуская значение ἐν αὐτοῖς.
- source_word: ποιήσῃ ἐκδίκησιν
  choice: отомстил
  rationale: Компактно и естественно передаёт идиому «совершить возмездие» в данном контексте опасения перед личной местью.
- source_word: μέγας ἐστὶ παρὰ Θεῷ καὶ ἀνθρώποις
  choice: он велик пред Богом и людьми
  rationale: Сохраняет форму и смысл исходного выражения о высоком положении или признании перед Богом и людьми, не уточняя основание величия.
theological_decisions:
- issue: Значение παρὰ Θεῷ καὶ ἀνθρώποις
  choice: пред Богом и людьми
  alternative: у Бога и у людей
  rationale: Выбрана традиционно-достоинственная, но понятная формула, сохраняющая возможный смысл признания или высокого положения без богословского переосмысления.
- issue: Неясная связь родительного κινδύνου с ἐκδίκησιν
  choice: за то, что мне угрожала опасность
  alternative: за опасность
  rationale: Контекстуально раскрывает эллиптическое сочетание, однако не превращает его в утверждение о состоявшемся вреде; неопределённость отмечена сноской.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской формулой «пред Богом и людьми». Синтаксис сделан ясным для обычного читателя; подлинная лексическая неясность κινδύνου сохранена в сноске.
