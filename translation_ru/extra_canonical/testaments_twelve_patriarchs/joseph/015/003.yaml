  terminology: «Раб» точно передаёт δοῦλος и не нуждается в смягчении. «Сердце моё таяло» сохраняет образ ἐτάκη. Текстологические знаки и номера критических примечаний из издания не являются содержательными сносками для перевода; добавлять сноски на их основании не следует.
  issues:
