source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ταῦτα ἀκούσας ἐγὼ διελύθη τὰ σπλάγχνα μου, καὶ ἡ καρδία μου ἐτάκη, καὶ ἤθελον δακρῦσαι πάνυ¹⁶, ἀλλ''¹⁷ ἐπέσχον ἐμαυτόν¹⁸, ἵνα μὴ αἰσχύνω¹⁹ τοὺς ἀδελφούς μου, ⌜*καὶ εἶπον αὐτοῖς²⁰ Ἐγὼ οὐκ οἶδα·²¹ δοῦλός εἰμι⌉.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/003.yaml
  text: When I heard these things, my inward parts were torn apart, and my heart melted, and I wanted very much to weep. But I restrained myself, so that I might not put my brothers to shame. And I said to them, “I do not know; I am a servant.”
translation:
  language: ru
  text: 'Услышав это, я почувствовал, что у меня всё внутри разрывается, и сердце моё таяло; мне очень хотелось заплакать. Но я сдержался, чтобы не пристыдить моих братьев, и сказал им: «Я не знаю; я раб».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελύθη τὰ σπλάγχνα μου
  choice: я почувствовал, как разрывается всё внутри меня
  rationale: Греческое σπλάγχνα обозначает внутренности как средоточие глубоких чувств; естественная русская формулировка сохраняет телесную силу образа, не сводя его просто к эмоциям.
- source_word: ἡ καρδία μου ἐτάκη
  choice: тает моё сердце
  rationale: Сохранена метафора глагола τήκω — «таять, плавиться, истомляться» — и параллелизм с предыдущим образом.
- source_word: ἤθελον δακρῦσαι πάνυ
  choice: мне очень хотелось заплакать
  rationale: Передаёт сильное желание плакать; «заплакать» звучит естественнее буквального «пролить слёзы».
- source_word: ἐπέσχον ἐμαυτόν
  choice: я сдержался
  rationale: Краткий современный эквивалент действия самообладания.
- source_word: αἰσχύνω
  choice: опозорить
  rationale: Глагол может значить «постыдить, посрамить»; «опозорить» ясно передаёт причинение братьям стыда перед другими.
- source_word: δοῦλός εἰμι
  choice: я раб
  rationale: Буквально сохраняет социальный статус δοῦλος и не смягчает его словом «слуга».
theological_decisions:
- issue: Причина сокрытия чувств Иосифом
  choice: чтобы не опозорить своих братьев
  alternative: чтобы не пристыдить своих братьев
  rationale: Сохранена направленность действия на братьев без добавления мотивов или богословского толкования.
- issue: Краткое заявление о незнании и рабском положении
  choice: «Я не знаю; я раб»
  alternative: '«Не знаю: я раб»'
  rationale: Сохранены оба отрывистых утверждения и их смысловая напряжённость; причинная связь между ними не добавлена.
translation_notes:
  register: Современный литературный русский язык с dignified, но доступной интонацией. Сохранены яркие телесные метафоры греческого текста и лаконичность прямой речи; квадратные текстологические знаки издания не перенесены, поскольку они относятся к редакционной разметке источника, а не к содержанию стиха.
