    issue: Добавлен оттенок субъективного восприятия и изменён вид первого образа.
    rationale: «Я почувствовал, как разрывается» не прямо соответствует «внутренности мои были/оказались разорваны» (διελύθη τὰ σπλάγχνα μου). Более близкая русская конструкция не добавляет глагол восприятия.
  - severity: low
    issue: «Опозорить» сильнее и уже по смыслу, чем αἰσχύνω.
    rationale: Глагол означает причинить стыд, пристыдить; публичное позорение не выражено явно.
