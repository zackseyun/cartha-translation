base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/001.yaml
  text: For she wanted to see me in sinful desire, but I was unaware of all these things. And he said to her, “This is not the custom among the Egyptians, to take what belongs to others before proof is given.” So he said this concerning the merchant. But the boy ought to be kept confined.
translation:
  language: ru
  text: 'Ведь она хотела видеть меня, движимая греховной страстью, а я обо всём этом не догадывался. И он сказал ей: «У египтян не принято отнимать чужое, пока не представлены доказательства». Так он сказал о купце. Но мальчика следует держать взаперти.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πόθῳ ⌈ἁμαρτίας⌉
  choice: движимая греховной страстью
  rationale: Передаёт сильное порочное влечение естественным современным русским языком, не сводя πόθος к нейтральному желанию.
- source_word: ἠγνόουν
  choice: не догадывался
  rationale: В данном контексте означает, что Иосиф не сознавал её намерений; выражение естественнее буквального «не знал».
- source_word: πρὸ ἀποδείξεως
  choice: пока не представлены доказательства
  rationale: Сохраняет судебно-доказательный оттенок ἀπόδειξις и не уточняет сверх текста, что именно должно быть доказано.
- source_word: τὰ ἀλλότρια
  choice: чужое
  rationale: Естественно передаёт субстантивированное множественное «принадлежащее другим» как чужую собственность.
- source_word: περὶ τοῦ μεταβόλου
  choice: о купце
  rationale: В контексте μεταβόλος обозначает торговца или перекупщика; «купец» ясно и литературно.
- source_word: ὁ παῖς
  choice: юношу
  rationale: По контексту речь об Иосифе; «юноша» лучше, чем двусмысленное современное «мальчик» или социально окрашенное «слуга».
- source_word: ἐγκατάκλειστος εἶναι
  choice: держать под стражей
  rationale: Передаёт требование содержать взаперти или в заключении естественной русской формулой.
theological_decisions:
- issue: Характер желания женщины
  choice: греховная страсть
  alternative: желание греха
  rationale: Выбрана естественная формулировка, сохраняющая нравственную оценку, присутствующую в греческом тексте, без дополнительной конфессиональной интерпретации.
- issue: Неопределённость действующего лица в εἶπε
  choice: он сказал ей / он сказал
  alternative: я сказал ей / я сказал
  rationale: Сохранено чтение представленного греческого текста с формой третьего лица εἶπε; повествовательная трудность не исправляется молча по контексту или по иной текстовой традиции.
translation_notes:
  register: Современный литературный русский язык с достоинством повествования. Сохранён неожиданный переход к третьему лицу в греческом источнике. Прямая речь оформлена ясно, без архаизмов и без внесения отсутствующих пояснений.
