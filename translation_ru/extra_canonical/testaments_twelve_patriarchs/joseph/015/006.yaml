  text: 'Тогда торговец сказал им: «Освободите меня от суда Потифара».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετάβολος
  choice: торговец
  rationale: В данном повествовательном контексте слово обозначает торговца или перекупщика; «торговец» ясно и естественно передаёт роль персонажа.
- source_word: Λύσατέ με
  choice: Избавьте меня
  rationale: Форма λύσατε выражает просьбу освободить или избавить говорящего; сочетание с ἀπό естественно передаётся по-русски как «избавьте меня от».
- source_word: κρίσεως
  choice: суда
  rationale: κρίσις может означать суд, судебное разбирательство или приговор. Нейтральное «суд» сохраняет широту значения и не уточняет без достаточных оснований, идёт ли речь о процессе или осуждении.
- source_word: Πεντεφρί
  choice: Потифара
  rationale: Использована укоренившаяся русская форма библейского имени Потифар в родительном падеже.
