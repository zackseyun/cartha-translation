  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013.yaml
  text: '1. But Pentephris, persuaded by her words, ordered the broker to be brought, and said to him, “What is this that I hear concerning you—that you steal souls from the land of Canaan and sell them again as servants?”


    2. But the broker fell at his feet and begged him, saying, “I beg you, lord, I do not know what you are saying.”


    3. And Pentephris fell upon him and said to him, “From where, then, is this Hebrew servant before me?” And he said, “The Ishmaelites entrusted him to me until they return.”


    4. But he did not believe him; rather, he ordered him to be beaten naked. And when he persisted in these words, Pentephris said, “Then let the young man be brought.”


    5. And when I was brought in, I bowed down to Pentephris, for he was, he said, third in rank among Pharaoh’s rulers.


    6. And after separating me from him, he said to me, “Are you a servant or free?” And I said, “A servant.”


    7. And he said, “Whose?” And I said, “The Ishmaelites’.”


    8. But he said, “How did you become their servant?” And I said, “They bought me from the land of Canaan.”


    9. But he said to me, “You are truly lying.” And immediately he ordered me also to be stripped naked...'
translation:
  language: ru
  text: '1. Пентефрис, поверив её словам, велел привести перекупщика и сказал ему:


    — Что это я слышу о тебе? Ты похищаешь людей[a] из земли Ханаанской и перепродаёшь их в рабство?


    2. Перекупщик пал к его ногам и стал умолять:


    — Прошу тебя, господин, я не знаю, о чём ты говоришь.


    3. Пентефрис сказал ему:


    — Откуда же тогда этот раб-еврей?


    Тот ответил:


    — Измаильтяне оставили его у меня до своего возвращения.


    4. Но Пентефрис ему не поверил и велел раздеть его и бить. Когда же тот продолжал твердить то же самое, Пентефрис сказал:


    — Тогда приведите юношу.


    5. Когда меня ввели, я поклонился Пентефрису, потому что он занимал третье место среди сановников фараона.


    6. Отведя меня от перекупщика, он спросил:


    — Ты раб или свободный?


    Я ответил:


    — Раб.


    7. Он спросил:


    — Чей?


    Я ответил:


    — Измаильтян.


    8. Он спросил:


    — Как ты стал их рабом?


    Я ответил:


    — Они купили меня в земле Ханаанской.


    9. Тогда он сказал мне:


    — Ты и вправду лжёшь.


    И тотчас велел раздеть и бить также и меня.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «души».'
    reason: Сохраняет для читателя антропологический образ оригинала, тогда как в основном тексте естественнее русское «людей».
lexical_decisions:
- source_word: ψυχὰς
  choice: людей[a]
  rationale: Буквально «души», но в данном контексте слово обозначает людей; сноска сохраняет заметный образ оригинала.
- source_word: μετάβολος
  choice: перекупщик
  rationale: Обозначает посредника или торговца, который приобретает и перепродаёт; «перекупщик» естественно согласуется с обвинением в перепродаже похищенных людей.
- source_word: εἰς παῖδας μεταπωλεῖς
  choice: перепродаёшь их в рабство
  rationale: παῖς может значить слугу или раба, однако контекст купли-продажи людей требует значения рабского состояния; русская конструкция передаёт смысл естественно.
- source_word: παῖς ὁ Ἑβραῖος
  choice: раб-еврей
  rationale: Вопрос касается происхождения и принадлежности Иосифа как проданного человека, поэтому здесь значение «раб», а не нейтральное «слуга».
- source_word: γυμνὸν τύπτεσθαι
  choice: раздеть его и бить
  rationale: 'Передаёт оба элемента греческой конструкции: наготу и телесное наказание, не оставляя фразу оборванной.'
- source_word: τρίτος ἦν ἐν ἀξιώματι
  choice: занимал третье место
  rationale: Естественная русская передача положения третьего по рангу.
theological_decisions: []
translation_notes:
  register: 'Современный литературный русский с достоинством повествовательной прозы. Диалог оформлен естественно, повторяющиеся формулы сохранены без архаизации. Перевод следует греческому тексту там, где английский консультационный слой отклоняется от него: в ст. 3 Пентефрис просто «сказал», в ст. 5 отсутствует вставное «он сказал», а в ст. 9 явно названо избиение обнажённого Иосифа.'
