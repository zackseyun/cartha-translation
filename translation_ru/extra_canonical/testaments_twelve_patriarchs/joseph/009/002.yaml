revisions:
- from: 'Много раз она посылала ко мне сказать: «Согласись исполнить моё желание, и я освобожу тебя от оков и избавлю от тьмы». Но я даже в мыслях не склонился к ней, ибо Бог больше любит того, кто в яме, во тьме, верен и целомудрен, чем того, кто царём живёт в роскоши среди сокровищниц, предаваясь распутству.[a]'
  to: 'Много раз она посылала ко мне с вестью: «Согласись исполнить моё желание, и я освобожу тебя от оков и избавлю от тьмы». Но я даже в мыслях не склонился к ней, ибо Бог больше любит того, кто верен в воздержании в яме мрака, чем царя, который в покоях живёт в роскоши и распутстве.[a]'
  rationale: Редакция исправляет русскую синтаксическую неестественность и восстанавливает роль βασιλέα как существительного «царя». «Верен в воздержании» точнее отражает πιστὸν ἐν σωφροσύνῃ; «яма мрака» сохраняет образ λάκκος σκότους. Сноска перенесена к концу сравнения, поскольку относится к двум сомнительным словам в нём.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T21:45:38Z'
review_pass:
  verdict: revise
  source_fidelity: Нужна правка двух мест. «Посылала ко мне сказать» не передаёт естественно греческое ἔπεμψε πρός με λέγουσα («посылала ко мне с вестью, говоря»). В заключительном противопоставлении βασιλέα — существительное в винительном падеже («царя»), а не обстоятельственное «царём»; σωφροσύνῃ точнее передать как «воздержание/самообладание», не сужая слово до целомудрия.
  naturalness: Предлагаемая редакция сохраняет литературный, ясный и несколько возвышенный регистр. «Посылала ко мне с вестью» устраняет синтаксическую неестественность исходного варианта, а параллельное построение сравнения остаётся прозрачным.
  terminology: «Воздержание» передаёт σωφροσύνη как нравственное самообладание в сексуальном контексте, не ограничивая значение исключительно сексуальной чистотой. «Покои» — естественная передача ταμεῖα в данном контексте внутренних помещений; не следует без необходимости конкретизировать их как «сокровищницы». Текстуально сомнительные πιστόν и βασιλέα сохранены и отмечены одной сноской.
  issues:
  - severity: medium
    issue: Неестественная конструкция «она посылала ко мне сказать».
    rationale: При ἔπεμψε πρός με λέγουσα подразумевается посланное сообщение или посланец; русская конструкция без дополнения звучит неполно и двусмысленно.
  - severity: medium
    issue: «Царём живёт» меняет синтаксическую роль βασιλέα.
    rationale: 'Βασιλέα является объектом сравнения: речь о «царе», а не о человеке, который живёт «царём».'
  - severity: low
    issue: «Целомудрен» сужает σωφροσύνη и меняет связь с πιστόν.
    rationale: Ἐν σωφροσύνῃ означает «в воздержании/самообладании»; «верен и целомудрен» превращает это в два равноправных качества.
