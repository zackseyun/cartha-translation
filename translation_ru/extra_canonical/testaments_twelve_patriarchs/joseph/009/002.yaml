source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Πολλάκις δὲ¹ ἔπεμψε πρός με λέγουσα². Εὐδόκησον³ ⸀πληρῶσαι τὴν ἐπιθυμίαν⸀ μου, καὶ λύω⁴ σε ἐκ⁵ τῶν δεσμῶν, ⸀καὶ ἀπαλλάξω σε ἐκ⁶ τοῦ σκότους⸀. *Ἐγὼ δὲ οὐδὲ⁷ ἕως⁸ ἐννοίας⁹ ἐξέκλινα¹⁰ πρὸς αὐτήν· *ὁ γὰρ θεὸς ἀγαπᾷ¹¹ μᾶλλον τὸν¹² ἐν¹³ λάκκῳ σκότους †πιστὸν¹⁴ ἐν σωφροσύνῃ¹⁵, ἢ τὸν ἐν ταμείοις †βασιλέα¹⁶ τρυφῶντα μετ’ ἀκολασίας.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/002.yaml
  text: Many times she sent to me, saying, “Consent to fulfill my desire, and I will release you from your chains, and I will free you from the darkness.” But I did not turn even in thought toward her; for God loves more the one who is faithful in self-control in a pit of darkness than the one who, as a king in storerooms, lives in luxury with lawlessness.
translation:
  language: ru
  text: 'Много раз она посылала ко мне с вестью: «Согласись исполнить моё желание, и я освобожу тебя от оков и избавлю от тьмы». Но я даже в мыслях не склонился к ней, ибо Бог больше любит того, кто верен в воздержании в яме мрака, чем царя, который в покоях живёт в роскоши и распутстве.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова, переведённые как «верен» и «царя», в греческом тексте имеют признаки текстуальной неуверенности.
    reason: В издании πιστόν и βασιλέα отмечены крестами как сомнительные чтения; основной текст сохраняет чтения из данного издания, а сноска указывает на их неопределённость.
lexical_decisions:
- source_word: Εὐδόκησον
  choice: Согласись
  rationale: Передаёт призыв дать согласие и благосклонно принять предложение, естественно звуча по-русски.
- source_word: πληρῶσαι τὴν ἐπιθυμίαν μου
  choice: исполнить моё желание
  rationale: Сохраняет эвфемистическую форму греческого текста и не делает сексуальный смысл более явным, чем в источнике.
- source_word: οὐδὲ ἕως ἐννοίας ἐξέκλινα πρὸς αὐτήν
  choice: я даже в мыслях не склонился к ней
  rationale: Сохраняет образ внутреннего уклонения и подчёркивает отказ не только на деле, но и в помысле.
- source_word: σωφροσύνῃ
  choice: целомудрен
  rationale: В данном контексте слово обозначает нравственное и сексуальное самообладание; «целомудрен» передаёт это естественно и ёмко.
- source_word: τρυφῶντα μετ’ ἀκολασίας
  choice: живёт в роскоши… предаваясь распутству
  rationale: Передаёт противопоставление роскошной жизни и нравственной разнузданности; «распутство» соответствует сексуальному контексту главы.
theological_decisions:
- issue: Сравнительное утверждение о Божьей любви
  choice: Бог больше любит того… чем того…
  alternative: Богу угоднее тот… чем тот…
  rationale: Сохранён прямой смысл ἀγαπᾷ μᾶλλον без смягчения возможного богословского напряжения.
- issue: Текстуально сомнительные πιστόν и βασιλέα
  choice: верен… / царём
  alternative: достоин доверия… / царь
  rationale: Оба чтения сохранены в основном тексте, поскольку они дают связный контраст, но их текстуальная неуверенность отмечена сноской.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис слегка приподнят, но доступен обычному читателю; сохранены параллелизм и нравственный контраст оригинала.
