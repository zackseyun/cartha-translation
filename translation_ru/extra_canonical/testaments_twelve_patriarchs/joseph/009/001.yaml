source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ ὡς²³ ἤμην ἐν τοῖς δεσμοῖς²⁴, ἡ Αἰγυπτία συνείχετο²⁵ ἀπὸ τῆς λύπης· ἐλθοῦσα δὲ ἐπηκροᾶτό μου πῶς ηὐχαρίστουν τῷ Κυρίῳ καὶ ὕμνουν ἐν οἴκῳ *τοῦ σκότους²⁶, καὶ ἔχαιρον ἐν *ἱλαρᾷ φωνῇ²⁷ δοξάζων τὸν Θεόν μου, ὅτι διὰ προφάσεως ἀπηλλάγην²⁸ τῆς Αἰγυπτίας.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/001.yaml
  text: And while I was in chains, the Egyptian woman was held together by grief; and when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and rejoiced with a cheerful voice, glorifying my God, because by a pretext I had been delivered from the Egyptian woman.
translation:
  language: ru
  text: И когда я был в оковах, египтянка была подавлена скорбью. Приходя, она слушала, как я благодарил Господа, пел гимны в доме тьмы и радовался, радостным голосом прославляя моего Бога, ибо благодаря предлогу был избавлен от египтянки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τοῖς δεσμοῖς
  choice: в оковах
  rationale: Передаёт буквальный образ уз и естественно звучит по-русски в контексте заключения.
- source_word: συνείχετο ἀπὸ τῆς λύπης
  choice: была подавлена скорбью
  rationale: Глагол выражает охваченность или стеснённость сильным чувством; буквальное «удерживалась скорбью» по-русски неестественно.
- source_word: ἐπηκροᾶτό μου
  choice: прислушивалась к тому, как я…
  rationale: Передаёт направленное, внимательное слушание и управление греческого глагола родительным падежом без излишнего оттенка тайного подслушивания.
- source_word: ἐν οἴκῳ τοῦ σκότους
  choice: в доме тьмы
  rationale: Сохраняет выразительную греческую метафору, обозначающую место заключения.
- source_word: ἐν ἱλαρᾷ φωνῇ
  choice: весёлым голосом
  rationale: ἱλαρός здесь означает радостный, бодрый тон; «весёлым» естественно сочетается с голосом и соответствует контексту радости.
- source_word: διὰ προφάσεως
  choice: под этим предлогом
  rationale: 'Сохраняет неоднозначность προφάσεως: заключение по обвинению стало поводом или предлогом, посредством которого Иосиф оказался отделён от египтянки.'
- source_word: ἀπηλλάγην
  choice: избавился
  rationale: Медиально-пассивная форма допускает «был избавлен» и «избавился»; русский возвратный глагол естественно сохраняет отсутствие явно названного деятеля.
theological_decisions:
- issue: Кому адресованы благодарение, гимны и прославление
  choice: «благодарил Господа и пел гимны… прославляя моего Бога»
  alternative: Повторить «Господа» после «пел гимны»
  rationale: В предоставленном греческом тексте после ὕμνουν нет второго τῷ Κυρίῳ; дополнение не требуется и могло бы создать отсутствующий в источнике параллелизм.
- issue: Деятель избавления
  choice: «избавился» без указания деятеля
  alternative: «Бог избавил меня» или «я освободился»
  rationale: Греческий текст не называет деятеля прямо; формулировка сохраняет эту богословски значимую недосказанность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Сохранены образы «оковы» и «дом тьмы», но синтаксис упрощён для ясного чтения. Повтор «египтянка» в конце оставлен вслед за оригиналом, поскольку он подчёркивает избавление именно от её домогательств.
