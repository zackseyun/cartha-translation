  text: How often, though she was sick, she came down to me at an untimely hour, and heard my voice as I prayed; and I, understanding her groanings, kept silent.
translation:
  language: ru
  text: Сколько раз, хотя она и была больна, она спускалась ко мне в неурочный час и слышала мой голос, когда я молился; а я, понимая эти стоны, молчал.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποσάκις
  choice: Сколько раз
  rationale: Сохраняет восклицательно-риторический оттенок греческого наречия и естественно звучит по-русски.
- source_word: κατῄει
  choice: спускалась
  rationale: Передаёт пространственное значение глагола κατάειμι без замены более общим «приходила».
- source_word: ἐν ἀωρίᾳ
  choice: в неурочный час
  rationale: Передаёт значение неподобающего или необычного времени; выражение не ограничивается исключительно ночным временем.
- source_word: προσευχομένου
  choice: когда я молился
  rationale: Естественная русская передача причастной конструкции при сохранении одновременности действий.
- source_word: συνίων τοὺς στεναγμούς
  choice: понимая, о чём говорят её стоны
  rationale: Греческое сочетание буквально означает понимание стонов; развёрнутая формулировка ясно передаёт распознавание их смысла, не уточняя его сверх текста.
- source_word: ἐσιώπων
  choice: молчал
  rationale: Сохраняет значение продолжительного или повторявшегося молчания в контексте серии эпизодов.
