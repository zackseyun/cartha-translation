source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Εἰ δὲ¹⁷ ἐν σωφροσύνῃ διάγων *θέλει καὶ¹⁸ δόξαν, καὶ¹⁹ οἶδεν ὁ ὕψιστος ὅτι συμφέρει, παρέχει²⁰ καὶ αὐτῷ καὶ ταῦτα²¹ ὡς κἀμοί.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/003.yaml
  text: But if one lives in self-control and also desires glory, and the Most High knows that it is beneficial, he grants these things also to him, as also to me.
translation:
  language: ru
  text: Но если человек живёт в самообладании и также желает славы, и Всевышний знает, что это ему на пользу, то и ему дарует всё это, как и мне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνῃ
  choice: в целомудрии
  rationale: В контексте Завещания Иосифа слово обозначает нравственное самообладание, особенно половую чистоту; «целомудрие» естественно передаёт эту контекстуальную направленность.
- source_word: δόξαν
  choice: славы
  rationale: Прямое соответствие греческому δόξα; здесь речь о даруемой человеку славе или почёте.
- source_word: συμφέρει
  choice: это ему на пользу
  rationale: Передаёт значение «полезно, благоприятно» и сохраняет мысль, что Всевышний судит о пользе желаемой славы.
- source_word: παρέχει
  choice: дарует
  rationale: Отражает предоставление блага Всевышним и соответствует возвышенному, но современному регистру.
- source_word: ταῦτα
  choice: это
  rationale: Хотя греческая форма формально множественного числа («эти вещи»), по-русски указательное «это» естественно охватывает упомянутые дары без неуклюжего буквального оборота.
theological_decisions:
- issue: Условие дарования славы
  choice: Сохранены и желание человека, и знание Всевышнего о пользе этого
  alternative: Истолковать текст так, будто Всевышний лишь знает, что слава человеку подобает
  rationale: Греческое θέλει καὶ δόξαν прямо указывает на желание славы, а ὅτι συμφέρει — на то, что она полезна; перевод не устраняет напряжения между человеческим желанием и Божьим усмотрением.
- issue: Сравнение с Иосифом
  choice: «как даровал и мне»
  alternative: «как и мне»
  rationale: Добавление подразумеваемого глагола делает русскую фразу ясной, не добавляя нового богословского содержания.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксис сохраняет условную структуру и последовательность мысли греческого текста, избегая чрезмерной буквальности.
