  source_fidelity: 'Основной смысл передан верно: повторяющееся обнажение рук и голеней, красота женщины, её намерение обмануть Иосифа и Божья защита сохранены. Однако «обманом соблазнить меня» добавляет к ἀπάτη явно выраженное «соблазнение», тогда как греческий текст говорит шире — о её обмане; это лучше не вносить в перевод как отдельный смысл. У συμπέσω εἰς αὐτήν сохранён образ падения, но его естественная смысловая передача нуждается в сноске.'
