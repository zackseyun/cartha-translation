base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/005.yaml
  text: For when I was in her house, she would uncover her arms and her legs, so that I might fall into her. For she was very beautiful, especially adorned to deceive me. But the Lord guarded me from her schemes.
translation:
  language: ru
  text: Ведь когда я был в её доме, она обнажала свои руки и голени, чтобы я уступил ей[a]. Она была очень красива, особенно нарядившись, чтобы обмануть меня. Но Господь хранил меня от её замыслов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «чтобы я пал в неё (или: к ней)». Греческое выражение сохраняет образ падения; в данном контексте оно относится к её сексуальному искушению.'
    reason: Сохраняет неоднозначный пространственный образ συμπέσω εἰς αὐτήν и поясняет контекст, не выдавая более конкретное толкование за буквальный смысл.
lexical_decisions:
- source_word: ἐγύμνου τοὺς βραχίονας αὐτῆς καὶ τὰς κνήμας
  choice: она обнажала руки и голени
  rationale: Имперфект передаёт повторяющееся действие; «голени» точно соответствует κνήμας и сохраняет конкретность греческого текста.
- source_word: συμπέσω εἰς αὐτήν
  choice: чтобы я поддался ей
  rationale: Естественная русская передача образа падения перед сексуальным искушением; буквальная конструкция по-русски неясна, поэтому её неоднозначность отмечена в сноске.
- source_word: ὡραία πάνυ
  choice: очень красива
  rationale: Прямо и естественно передаёт усилительное πάνυ без стилистического преувеличения.
- source_word: μάλιστα κοσμουμένη πρὸς ἀπάτην μου
  choice: особенно тщательно украшала себя, чтобы обманом соблазнить меня
  rationale: Сохраняет и внешний смысл κοσμουμένη, и целевое значение πρὸς ἀπάτην μου; «обманом соблазнить» передаёт сочетание обольщения и обмана в контексте.
- source_word: ἐγχειρημάτων
  choice: замыслов
  rationale: Передаёт враждебные попытки и ухищрения без излишне архаичного оттенка.
theological_decisions:
- issue: Роль Господа в избавлении Иосифа
  choice: Господь хранил меня
  alternative: Господь уберёг меня
  rationale: Имперфект ἐφύλαξέ в повествовательном контексте допускает итоговое «уберёг», но «хранил» лучше согласуется с продолжающейся защитой от неоднократных замыслов и не ослабляет прямое утверждение о Божьем действии.
- issue: Характер падения в выражении συμπέσω εἰς αὐτήν
  choice: поддался ей с пояснением буквального образа в сноске
  alternative: лёг с ней
  rationale: Контекст явно сексуален, однако греческий текст выражается образом падения и не употребляет прямой идиомы полового союза; перевод не должен устранять эту образность без пояснения.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис остаётся ясным для широкого читателя; конкретные части тела и мотив обмана сохранены без эвфемистического смягчения.
