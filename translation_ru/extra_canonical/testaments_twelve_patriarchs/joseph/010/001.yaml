  text: Ὁρᾶτε οὖν, τέκνα μου, πόσα κατεργάζεται¹ ἡ² ὑπομονὴ καὶ ἡ³ προσευχὴ μετὰ νηστείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/001.yaml
  text: See, then, my children, how much endurance and prayer with fasting accomplish.
translation:
  language: ru
  text: Итак, дети мои, посмотрите, как много совершают терпение и молитва с постом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: посмотрите
  rationale: Императив настоящего времени здесь призывает обратить внимание и осмыслить сказанное; «посмотрите» естественно передаёт это в современном русском.
- source_word: τέκνα μου
  choice: дети мои
  rationale: Прямое и естественное обращение, сохраняющее семейную образность оригинала.
- source_word: πόσα κατεργάζεται
  choice: как много совершают
  rationale: Передаёт значительный действенный результат; единственное число греческого сказуемого допустимо при согласовании с ближайшим однородным подлежащим, тогда как по-русски требуется естественное множественное число.
- source_word: ἡ ὑπομονὴ
  choice: терпение
  rationale: Сохраняет широкий смысл стойкости, выдержки и терпеливого перенесения испытаний без неоправданного сужения.
- source_word: ἡ προσευχὴ μετὰ νηστείας
  choice: молитва с постом
  rationale: 'Близко воспроизводит конструкцию μετὰ с родительным падежом: молитва, сопровождаемая постом.'
theological_decisions:
- issue: Соотношение терпения и молитвы с постом
  choice: 'Оба выражения представлены как однородные субъекты общего действия: «совершают».'
  alternative: Понимать «как много» только при терпении, а молитву с постом выделить отдельно.
  rationale: Артикли перед ὑπομονὴ и προσευχὴ и союз καὶ указывают на два согласованных подлежащих; русский перевод сохраняет эту структуру, не разделяя их действие.
translation_notes:
  register: Современный литературный русский язык; тон наставительный и достойный. Синтаксис близок к греческому, но согласование сказуемого приведено к естественной русской норме.
