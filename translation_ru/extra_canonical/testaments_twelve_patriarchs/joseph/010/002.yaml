  source_fidelity: 'Перевод точно передаёт основную синтаксическую и смысловую структуру греческого текста: условное увещание, стремление к σωφροσύνη и ἁγνεία, стойкость, молитву с постом, смирение сердца, а также обещание, что Господь будет обитать ἐν ὑμῖν. Глагольное развёртывание «молиться и поститься» несколько свободнее буквальной конструкции «в молитве с постом», но не меняет её смысла и естественно для русского языка.'
