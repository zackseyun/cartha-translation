id: T12P.JOS.10.2
reference: Testament of Joseph 10:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Οὕτως καὶ ὑμεῖς⁴, ⌜ἐὰν τὴν σωφροσύνην καὶ τὴν ἁγνείαν μεταδιώκητε⁵ ἐν ὑπομονῇ καὶ *προσευχῇ μετὰ νηστείας ἐν ταπεινώσει⁶ καρδίας, ὁ⁷ Κύριος κατοικήσει⁸ ἐν ὑμῖν, ὅτι ἀγαπᾷ⁹ τὴν σωφροσύνην.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/002.yaml
  text: So you also, if you pursue self-control and purity with endurance and prayer with fasting, in humility of heart, the Lord will dwell in you, because he loves self-control.
translation:
  language: ru
  text: 'Так и вы: если будете со стойкостью стремиться к самообладанию и чистоте, молиться и поститься в смирении сердца, Господь будет обитать в вас, потому что Он любит самообладание.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνην
  choice: самообладание
  rationale: Передаёт нравственную сдержанность и власть над своими желаниями; тот же перевод сохранён в обоих употреблениях слова.
- source_word: ἁγνείαν
  choice: чистота
  rationale: Естественное и достаточно широкое соответствие нравственной и половой чистоте без неоправданного сужения смысла.
- source_word: μεταδιώκητε
  choice: будете ... стремиться к
  rationale: Выражает настойчивое следование и усердное искание, заложенные в усиленном глаголе.
- source_word: ἐν ὑπομονῇ
  choice: со стойкостью
  rationale: В данном призыве ὑπομονή обозначает устойчивую выдержку и постоянство, а не только пассивное терпение.
- source_word: προσευχῇ μετὰ νηστείας
  choice: молиться и поститься
  rationale: Глагольная передача естественна по-русски и сохраняет сочетание молитвы с постом.
- source_word: ἐν ταπεινώσει καρδίας
  choice: в смирении сердца
  rationale: Формально близкая и естественная для возвышенного русского регистра передача.
- source_word: κατοικήσει ἐν ὑμῖν
  choice: будет обитать в вас
  rationale: Сохраняет внутреннюю локативную формулировку ἐν ὑμῖν и не заменяет её смыслом «среди вас».
theological_decisions:
- issue: Значение множественного ἐν ὑμῖν
  choice: в вас
  alternative: среди вас
  rationale: Греческое выражение допускает обращение к общине, но непосредственное локативное чтение «в вас» лучше сохраняет формулировку источника и не снимает возможной смысловой напряжённости.
- issue: Смысл σωφροσύνη
  choice: самообладание
  alternative: целомудрие
  rationale: Контекст рядом с отдельным ἁγνεία поддерживает более широкое значение нравственной сдержанности; «целомудрие» чрезмерно сблизило бы два понятия.
translation_notes:
  register: 'Современный литературный русский с достоинством увещательного религиозного текста. Синтаксис слегка перестроен ради ясности: существительные «молитва» и «пост» переданы однородными глаголами, без изменения смысловых компонентов.'
