source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Γινώσκουσιν¹⁹ οἱ ἀδελφοί μου²⁰ πῶς ἠγάπησέ με ὁ πατήρ μου²¹, καὶ οὐχὶ²² ὑψούμην²³ ⸀ἐν τῇ διανοίᾳ²⁴ μου⸃, καίπερ νήπιος ὑπάρχων²⁵, ⸀εἶχον τὸν *φόβον τοῦ θεοῦ²⁶ ἐν τῇ καρδίᾳ²⁷ μου⸃· ᾔδειν²⁸ γὰρ ὅτι πάντα²⁹ παρελεύσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/005.yaml
  text: My brothers knew how my father loved me, yet I was not exalted in my mind; though I was a child, I had the fear of God in my heart, for I knew that surely all things will pass away.
translation:
  language: ru
  text: 'Мои братья знают, как любил меня отец, но я не превозносился в своих мыслях. Хотя я был ещё ребёнком, в сердце моём был страх Божий, потому что я знал: всё пройдёт.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκουσιν
  choice: знают
  rationale: Настоящее время греческого глагола сохранено; речь обращена к братьям как к живым свидетелям отцовской любви.
- source_word: ὑψούμην ἐν τῇ διανοίᾳ μου
  choice: я не превозносился в своих мыслях
  rationale: Передаёт буквальный образ внутреннего возвышения без добавления более узкого понятия гордости.
- source_word: νήπιος
  choice: ребёнком
  rationale: В данном повествовательном контексте слово обозначает юный возраст, а не духовную незрелость.
- source_word: φόβον τοῦ θεοῦ
  choice: страх Божий
  rationale: Сохранено устойчивое библейское выражение, включающее благоговение и сознание ответственности перед Богом.
- source_word: πάντα παρελεύσεται
  choice: всё пройдёт
  rationale: Естественно и ёмко передаёт всеохватное πάντα и будущее значение παρελεύσεται, не уточняя, что именно должно пройти.
theological_decisions:
- issue: Смысл выражения «страх Божий»
  choice: Сохранить традиционную формулу «страх Божий»
  alternative: «благоговение перед Богом»
  rationale: Греческое φόβος допускает как страх, так и благоговение; замена одним лишь «благоговением» сузила бы значимую богословскую многозначность.
- issue: Всеохватность πάντα
  choice: «всё пройдёт»
  alternative: «всё земное пройдёт»
  rationale: В оригинале нет определения «земное»; перевод не должен вводить отсутствующее богословское ограничение.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис сделан ясным для обычного читателя; сохранены внутренний образ «не превозносился в мыслях» и традиционная формула «страх Божий».
