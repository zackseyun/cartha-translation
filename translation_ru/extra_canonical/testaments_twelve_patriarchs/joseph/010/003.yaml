  rationale: Исправлены естественность согласования, чрезмерное семантическое сужение σωφροσύνη и неясность заключительной русской эллиптической конструкции. Перевод сохраняет порядок и параллелизм исходного высказывания, а также не уточняет спорное пространственное значение ἐπ᾽ αὐτόν сверх английского audit trail («with him» / «с ним»).
