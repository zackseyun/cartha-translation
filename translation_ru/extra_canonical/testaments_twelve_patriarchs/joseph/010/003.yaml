source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὅπου δὲ κατοικεῖ ὁ ὕψιστος¹⁰, κἂν *φθόνος τις περιπέσῃ, κἂν δουλία, κἂν συκοφαντία¹¹, *ὁ Κύριος κατοικῶν ἐπ᾽ αὐτὸν¹² διὰ τὴν σωφροσύνην οὐ μόνον⁷ ἐκ τῶν κακῶν ῥύεται¹³ αὐτόν¹⁴, ⸀ἀλλὰ καὶ ὑψοῖ¹⁵ καὶ δοξάζει αὐτὸν ὡς κἀμέ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/003.yaml
  text: But where the Most High dwells, even if envy should fall upon someone, or slavery, or slander, the Lord who dwells with him, because of his self-control, not only rescues him from evils, but also exalts and glorifies him, as he did me.
translation:
  language: ru
  text: Но там, где обитает Всевышний, даже если кого-нибудь постигнет зависть, рабство или клевета, Господь, пребывающий с ним, благодаря его самообладанию не только избавляет его от бед, но и возвышает и прославляет, как поступил и со мной.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνη
  choice: целомудрие
  rationale: В контексте Завещания Иосифа слово обозначает прежде всего нравственную и половую чистоту, проявленную Иосифом; «целомудрие» точнее контекстуально, чем более широкие «самообладание» или «благоразумие».
- source_word: συκοφαντία
  choice: клевета
  rationale: Передаёт ложное обвинение и злонамеренный оговор, соответствующие повествованию об Иосифе.
- source_word: τῶν κακῶν
  choice: от бед
  rationale: Здесь множественное κακά обозначает постигшие человека несчастья и враждебные обстоятельства; естественное русское соответствие — «беды».
- source_word: ὑψοῖ καὶ δοξάζει
  choice: возвышает и прославляет
  rationale: Сохраняет два параллельных греческих глагола и их богословски значимый образ Божьего возвышения и наделения славой.
theological_decisions:
- issue: Связь Божьего пребывания и целомудрия человека
  choice: «Господь, пребывающий с ним, за его целомудрие»
  alternative: «Господь, обитающий на нём, через целомудрие»
  rationale: Греческое ἐπ᾽ αὐτόν буквально допускает направительное «на него», но по смыслу пребывания естественно передаётся «с ним». διά с винительным указывает на основание или причину; «за его целомудрие» сохраняет эту связь, не превращая целомудрие в самостоятельное средство спасения.
- issue: Отнесение заключительного «как и меня»
  choice: Сохранено краткое «как и меня»
  alternative: «как Он поступил и со мной»
  rationale: Греческое ὡς κἀμέ эллиптично и соотносится с предшествующими действиями избавления, возвышения и прославления. Краткая форма сохраняет исходную эллиптичность и не уточняет сверх текста.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксический параллелизм сохранён; архаизмы и конфессионально маркированные формулы не вводились.
