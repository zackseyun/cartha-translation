  source_fidelity: 'Перевод точно передаёт основные элементы греческого текста: отрицательное οὐκ ἐπήρθην ἐν κακῷ сохранено без догматической конкретизации; ἐτίμουν — «почитал»; διὰ τὸν φόβον αὐτῶν — «из страха перед ними»; одновременность в ἐσιώπουν πιπρασκόμενος — «молчал, когда меня продавали»; а также содержание инфинитива εἰπεῖν и характеристику Иакова как «великого и праведного человека». «Не говоря измаильтянам» естественно выражает отрицательное несообщение, подразумеваемое контекстом инфинитива после «молчал».'
