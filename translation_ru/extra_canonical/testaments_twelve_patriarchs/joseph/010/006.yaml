base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/006.yaml
  text: And I was not puffed up in evil; rather, I honored my brothers, and because of fear of them I kept silent when I was being sold, not telling the Ishmaelites that I was a son of Jacob, a great and righteous man.
translation:
  language: ru
  text: И я не превозносился во зле[a], но почитал своих братьев и из страха перед ними молчал, когда меня продавали, не говоря измаильтянам, что я сын Иакова, великого и праведного человека.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст этого выражения не вполне надёжен; буквально: «не был вознесён во зле».'
    reason: В издании слова οὐκ ἐπήρθην ἐν κακῷ отмечены критическими знаками как сомнительные; сноска сохраняет текстологическую прозрачность и возможный буквальный смысл.
lexical_decisions:
- source_word: οὐκ ἐπήρθην ἐν κακῷ
  choice: не превозносился во зле
  rationale: Сохраняет значение ἐπαίρω в пассивной форме («возноситься, превозноситься») и намеренно не устраняет неясность сочетания ἐν κακῷ, отмеченного в издании как текстологически сомнительное.
- source_word: ἐτίμουν
  choice: почитал
  rationale: Передаёт продолженное действие и значение уважения, оказываемого братьям.
- source_word: διὰ τὸν φόβον αὐτῶν
  choice: из страха перед ними
  rationale: 'В данном контексте естественно передаёт объективное понимание местоимения: Иосиф боялся братьев; при этом не вводит дополнительного объяснения причин страха.'
- source_word: ἐσιώπουν πιπρασκόμενος
  choice: молчал, когда меня продавали
  rationale: Передаёт имперфект как продолжающееся действие, а причастие настоящего времени — как одновременное пассивное действие.
- source_word: τοῖς Ἰσμαϊλίταις
  choice: измаильтянам
  rationale: Устоявшаяся русская библейская форма этнонима.
- source_word: ἀνδρὸς μεγάλου καὶ δικαίου
  choice: великого и праведного человека
  rationale: μέγας передано как «великий», а δίκαιος — точно как «праведный», без ошибочной подмены значением «могущественный».
theological_decisions:
- issue: Нравственный смысл сомнительного выражения οὐκ ἐπήρθην ἐν κακῷ
  choice: Сохранено буквальное и неоднозначное «не превозносился во зле» с текстологической сноской.
  alternative: «не возгордился, творя зло» или «не был превознесён злом»
  rationale: Греческое выражение отмечено крестами как повреждённое или сомнительное; конкретизация могла бы без достаточных оснований приписать тексту определённое нравственное толкование.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Синтаксис сделан плавным, но причинная связь, временная одновременность и неопределённость повреждённого начального оборота сохранены.
