source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Πάντας⁷ γὰρ ⸀ἀνθρώπους¹⁶ ἢ ἐν ἔργῳ⁷ *ἢ ἐν λόγῳ, ἢ ἐν διανοίᾳ¹⁷ †συνέρχεται¹⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/004.yaml
  text: For it comes upon all people either in deed or in word or in mind.
translation:
  language: ru
  text: Ибо это настигает всех людей — в поступке, слове или мысли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст в этом месте не вполне ясен; буквально употреблён глагол со значением «сходиться, соединяться», тогда как по контексту речь, вероятно, о том, что нечто настигает или охватывает людей.
    reason: Форма συνέρχεται отмечена издателем как сомнительная и в данном синтаксисе необычна; примечание сохраняет текстологическую неопределённость.
lexical_decisions:
- source_word: Πάντας … ἀνθρώπους
  choice: всех людей
  rationale: Передаёт винительный падеж и всеобщность выражения без изменения числа или смысла.
- source_word: ἐν ἔργῳ
  choice: в поступке
  rationale: ἔργον здесь противопоставлено слову и мысли и означает совершённое действие; «поступок» естественнее современного буквального «дело».
- source_word: ἐν λόγῳ
  choice: в слове
  rationale: 'Сохраняет краткую трёхчастную последовательность: поступок, слово, мысль.'
- source_word: ἐν διανοίᾳ
  choice: в мысли
  rationale: Передаёт внутреннюю умственную сферу без необоснованного добавления оттенка воображения.
- source_word: συνέρχεται
  choice: настигает
  rationale: По контексту и синтаксису передано как действие подразумеваемого явления, направленное на всех людей; выбор согласуется с консультационным английским текстом, хотя греческая форма текстуально трудна.
theological_decisions:
- issue: Не выраженный явно субъект глагола
  choice: это
  alternative: назвать конкретную силу или грех по контексту
  rationale: Греческий текст не называет субъект в самом предложении; нейтральное «это» сохраняет анафорическую и богословскую неопределённость и не вводит толкование.
- issue: Сферы проявления
  choice: в поступке, слове или мысли
  alternative: через поступок, слово или мысль
  rationale: Предлог ἐν допускает сферовое значение; «в» лучше сохраняет формальную неоднозначность между областью проявления и средством.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная трёхчастная конструкция сохранена. Тон достоинственный и доступный, без конфессионально окрашенных уточнений.
