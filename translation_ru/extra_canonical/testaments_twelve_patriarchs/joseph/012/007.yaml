  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/007.yaml
  text: And God blessed him in my hand, and increased him on my account in gold and silver and goods.
translation:
  language: ru
  text: И Бог благословил его, когда он был под моим попечением, и умножил его богатство золотом, серебром и имуществом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «и делом (трудом)»; греческое ἔργῳ может означать дело, труд, произведение труда или имущество. В данном материальном перечне возможно значение «имущество», но оно не бесспорно.'
    reason: Сохраняет неоднозначность ἔργῳ, не устраняя её контекстуальным предпочтением.
lexical_decisions:
- source_word: ἐν χειρί μου
  choice: через меня
  rationale: Буквально «в моей руке»; в данном контексте оборот обозначает посредничество или содействие Иосифа. «Через меня» естественно передаёт этот смысл по-русски, не превращая выражение в указание на физическую руку.
- source_word: ἐπλήθυνεν αὐτόν
  choice: умножил у него
  rationale: Греческое выражение буквально говорит, что Бог «умножил его», после чего перечисляются золото, серебро и имущество. Русская конструкция с «умножил у него» сохраняет действие Бога и естественно связывает глагол с перечисленными благами.
- source_word: ἔργῳ
  choice: имущество
  rationale: 'Основное значение слова — «дело, труд, произведение», однако в ряду с золотом и серебром здесь вероятен собирательный материальный смысл: нажитое, хозяйство или имущество. Неоднозначность отмечена в сноске.'
theological_decisions:
- issue: Соотношение Божьего благословения и посредничества Иосифа
  choice: «Бог благословил его через меня»
  alternative: «Бог благословил его в моей руке»
  rationale: Перевод сохраняет Бога как источник благословения, а Иосифа — как его посредника, не приписывая Иосифу самостоятельной силы благословлять.
translation_notes:
  register: Современный литературный русский язык; фраза построена ясно и торжественно без архаизма «в руке моей». Сохранены Божье действие и посредническая роль Иосифа; лексическая неоднозначность последнего элемента вынесена в сноску.
