  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/010.yaml
  text: And she said to her husband, “The merchant has grown rich through the hands of a certain young Hebrew; and they say that he also was stolen by theft from the land of Canaan.”
translation:
  language: ru
  text: 'И она говорит своему мужу: «Торговец разбогател благодаря одному молодому еврею; говорят также[a], что его похитили — похитив из земли Ханаанской».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописных свидетельствах слова «также» нет.
    reason: Греческое καὶ отмечено как вариантное чтение; примечание помещено непосредственно после передающего его слова.
lexical_decisions:
- source_word: ὁ μετάβολος
  choice: торговец
  rationale: Слово обозначает торговца или перекупщика; «торговец» естественно и соответствует контексту.
- source_word: ἐπλούτησεν ... ἐν χερσίν
  choice: разбогател благодаря труду
  rationale: Буквально «разбогател в руках»; русское выражение передаёт посредство и результат деятельности молодого еврея без неестественной кальки.
- source_word: τινος νέου Ἑβραίου
  choice: одного молодого еврея
  rationale: Передаёт неопределённость τινος и обычное для современного русского обозначение происхождения.
- source_word: κλοπῇ ἔκλεψαν αὐτόν
  choice: его самого похитили
  rationale: Греческая конструкция с однокоренными существительным и глаголом эмфатична; по-русски усиление естественно выражено сочетанием «его самого», тогда как «похитили похищением» было бы ненормативно и тяжеловесно.
- source_word: ἐκ γῆς Χαναάν
  choice: из земли Ханаанской
  rationale: Сохраняет библейский географический оборот в понятной литературной форме.
