revisions:
- from: 'И она говорит своему мужу: «Торговец разбогател благодаря труду одного молодого еврея; говорят также, что его самого похитили из земли Ханаанской».[a]'
  to: 'И она говорит своему мужу: «Торговец разбогател благодаря одному молодому еврею; говорят также[a], что его похитили — похитив из земли Ханаанской».'
  rationale: Убрано невыраженное в оригинале «труду»; сохранены неопределённость «одному» и посреднический смысл ἐν χερσίν. Эмфатическое κλοπῇ ἔκλεψαν передано экспликативным повтором «похитили — похитив», без добавления исторических или интерпретационных деталей. Маркер текстологической сноски перенесён к «также».
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T21:45:49Z'
review_pass:
  verdict: revise
  source_fidelity: Требуется небольшая правка. «Благодаря труду» вводит в текст отсутствующее уточнение о характере деятельности юноши; ἐν χερσίν передаёт посредство/участие. Кроме того, «его самого похитили» не воспроизводит эмфатическое однокоренное κλοπῇ ἔκλεψαν («похитили похищением»).
  naturalness: Текст в целом литературный и понятный. Оборот «похитили, похитив» намеренно сохраняет греческое усиление, но в русском его следует выделить тире, чтобы он читался как экспликативное повторение, а не как неуклюжая тавтология.
  terminology: «Торговец» — удачная передача ὁ μετάβολος; «молодой еврей» верно передаёт τις νέος Ἑβραῖος. «Земля Ханаанская» допустима в библейском регистре. Вариантное καὶ следует сохранить в основном тексте и снабдить примечанием непосредственно у слова, к которому оно относится.
  issues:
  - severity: medium
    issue: Добавлено значение «труду»
    rationale: Греческое ἐν χερσίν означает «через руки», то есть посредством или благодаря участию юноши, но не называет его труд.
  - severity: medium
    issue: Недостаточно передана эмфатическая конструкция κλοπῇ ἔκλεψαν
    rationale: «Его самого» не соответствует греческому усилению, построенному на повторе существительного и глагола со значением кражи/похищения.
  - severity: low
    issue: Сноска поставлена после всей реплики, а не у вариантного слова
    rationale: Примечание относится именно к «также» (καὶ), поэтому маркер должен непосредственно следовать за этим словом.
  revised_text: 'И она говорит своему мужу: «Торговец разбогател благодаря одному молодому еврею; говорят также[a], что его похитили — похитив из земли Ханаанской».'
