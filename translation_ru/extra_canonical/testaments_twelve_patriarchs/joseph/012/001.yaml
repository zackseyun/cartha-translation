base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/001.yaml
  text: And when I was coming with the Ishmaelites, they kept asking me, saying, “Are you a servant?” And I said that I was a household servant, so that I might not put my brothers to shame.
translation:
  language: ru
  text: 'Когда же я шёл с измаильтянами, они всё спрашивали меня: «Ты раб?» Я сказал, что я раб из дома[a], чтобы не опозорить моих братьев.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «домашний раб». Греческое выражение буквально означает «раб из дома» и допускает более одного понимания.'
    reason: Необычное ἐξ οἴκου семантически неоднозначно; сноска сохраняет буквальную форму в тексте и сообщает наиболее вероятную альтернативу.
lexical_decisions:
- source_word: Ἐρχόμενος ... μετὰ τῶν Ἰσμαϊλιτῶν
  choice: Когда же я шёл с измаильтянами
  rationale: Причастный оборот передан естественной русской придаточной конструкцией; сохраняется совместное передвижение с измаильтянами без уточнения направления, которого нет в греческом.
- source_word: ἐπηρώτων
  choice: они всё спрашивали
  rationale: Имперфект передаёт продолженное или повторявшееся расспрашивание.
- source_word: Δοῦλος εἶ; / δοῦλός εἰμι
  choice: «Ты раб?» / «я раб»
  rationale: δοῦλος прямо обозначает раба; более мягкое «слуга» ослабило бы социальный смысл реплики.
- source_word: ἐξ οἴκου
  choice: из дома
  rationale: Сохранена краткость и неоднозначность греческого выражения, которое может указывать на принадлежность к домашним рабам или на происхождение из некоего дома.
- source_word: ἵνα μὴ αἰσχύνω
  choice: чтобы не опозорить
  rationale: 'Переданы цель и каузативный оттенок: Иосиф стремится не навлечь позор на братьев.'
theological_decisions:
- issue: Характер заявления Иосифа о рабстве
  choice: Сохранено его прямое самообозначение как раба, без пояснения, было ли это ложью, сокрытием или проявлением верности семье.
  alternative: Истолковать фразу как «домашний слуга» и тем самым сгладить напряжение.
  rationale: Текст сам не даёт нравственной оценки ответа Иосифа; перевод не должен разрешать эту неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством повествовательного стиля. Повтор слова «раб» намеренно сохраняет лексику оригинала; «всё спрашивали» естественно передаёт длительность имперфекта.
