base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/005.yaml
  text: So it seemed good to all of them for me to remain in Egypt with the merchant of their trade until they should return bringing merchandise.
translation:
  language: ru
  text: Поэтому все сочли правильным, чтобы я оставался в Египте у купца, занимавшегося их торговлей, пока они не вернутся, привезя товар.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδοξεν
  choice: решили
  rationale: Безличное выражение «показалось правильным» здесь естественно передаётся как совместное принятое решение.
- source_word: τοῦ εἶναι με
  choice: что мне следует остаться
  rationale: Передаёт субъект винительного падежа при инфинитиве и контекстуальное значение пребывания, не вводя более сильного смысла «оставить меня».
- source_word: πρὸς τὸν μετάβολον τῆς ἐμπορίας αὐτῶν
  choice: у купца, с которым они вели торговлю
  rationale: Сохраняет связь купца с их торговыми делами и звучит естественно по-русски; «μετάβολος» понимается как купец/торговец.
- source_word: ἕως ὅτου ἐπιστρέψουσιν
  choice: пока они не вернутся
  rationale: Естественная русская передача временного предела с ожидаемым будущим действием.
- source_word: φέροντες ἐμπορίαν
  choice: с товаром
  rationale: Причастная конструкция буквально означает возвращение с предметами торговли; «товар» избегает неестественного повтора слова «торговля».
