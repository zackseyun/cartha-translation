  text: '*Ὁ δὲ Κύριος ἔδωκέ μοι³⁰ χάριν ἐν ὀφθαλμοῖς τοῦ μεταβόλου καὶ ἐπίστευσέ³¹ μοι τὸν οἶκον αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/006.yaml
  text: But the Lord gave me favor in the eyes of the merchant, and he entrusted his house to me.
translation:
  language: ru
  text: Но Господь даровал мне благосклонность в глазах торговца, и тот доверил мне свой дом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριν ἐν ὀφθαλμοῖς
  choice: благосклонность в глазах
  rationale: Сохраняет семитизированный греческий оборот и его библейское звучание, оставаясь понятным современному читателю.
- source_word: τοῦ μεταβόλου
  choice: торговца
  rationale: В данном повествовательном контексте обозначает купца или торговца; «торговец» — естественный и достаточно широкий русский эквивалент.
- source_word: ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ
  choice: доверил мне свой дом
  rationale: Передаёт управление или попечение, вверенное Иосифу, не добавляя отсутствующих в тексте уточнений о хозяйстве.
theological_decisions:
- issue: Господь как источник расположения торговца
  choice: Господь даровал мне благосклонность
  alternative: Господь дал мне милость
  rationale: «Благосклонность» ясно выражает расположение человека к Иосифу и не смешивает его с богословским значением спасительной милости.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейским достоинством. Местоимение «тот» устраняет возможную двусмысленность: дом доверил торговец, а не Господь.'
