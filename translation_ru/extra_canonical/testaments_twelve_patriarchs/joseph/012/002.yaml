  text: And the chief of them said to me, “You are not a servant, for your appearance also makes it plain.” But I told them plainly that I was their servant.
translation:
  language: ru
  text: 'И главный среди них сказал мне: «Ты не раб, ведь это видно и по твоему облику». Но я сказал им, что я их раб.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μείζων αὐτῶν
  choice: старший из них
  rationale: Передаёт сравнительную форму μείζων как указание на главного или старшего в группе, не вводя более специального титула.
- source_word: δοῦλος
  choice: раб
  rationale: Точное обозначение несвободного человека; «слуга» могло бы ослабить социальный смысл греческого слова.
- source_word: ἡ ὄψις σου
  choice: твой облик
  rationale: Естественно передаёт внешность или наружный вид человека в данном контексте.
- source_word: δηλοῖ
  choice: это видно
  rationale: Идиоматически выражает смысл «показывает, делает явным», сохраняя утверждение о внешнем облике как свидетельстве.
- source_word: ὑπάρχω
  choice: я … раб
  rationale: В конструкции с именной частью означает фактическое состояние или положение; по-русски естественно передаётся простой связкой.
