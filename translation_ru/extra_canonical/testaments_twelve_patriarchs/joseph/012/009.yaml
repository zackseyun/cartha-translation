  register: Современный литературный русский язык с достоинством древнего повествования. Синтаксис сохраняет последовательность и причинную связь греческого текста; текстологически отмеченное ἐν λαμπήνῃ включено без сноски, поскольку его смысл достаточно ясен и оно присутствует в указанном исходном чтении.
