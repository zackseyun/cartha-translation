base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/009.yaml
  text: At that time the wife of Pentephri came down to Memphis in a litter, with great splendor, because she had heard about me from her eunuchs.
translation:
  language: ru
  text: В то время жена Пентефрия спустилась в Мемфис в паланкинеа, с великой пышностью, потому что услышала обо мне от своих евнухов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατ᾽ ἐκεῖνον τὸν καιρόν
  choice: В то время
  rationale: Естественная русская передача временного оборота без добавления лишнего повествовательного маркера.
- source_word: κατῆει Μεμφίς
  choice: спустилась в Мемфис
  rationale: Сохраняет пространственное значение глагола κατάειμι и направление движения к Мемфису.
- source_word: ἐν λαμπήνῃ
  choice: в паланкине
  rationale: Редкое существительное обозначает крытые носилки или паланкин; выбран понятный современному читателю эквивалент. Кресты в издании указывают на текстологическую неуверенность, но чтение переводимо.
- source_word: μετὰ δόξης πολλῆς
  choice: с великой пышностью
  rationale: В данном контексте δόξα означает великолепие и торжественную роскошь, а не отвлечённую «славу».
- source_word: παρὰ τῶν εὐνούχων αὐτῆς
  choice: от своих евнухов
  rationale: Передаёт источник полученных сведений; возвратное притяжательное местоимение естественно указывает на евнухов женщины.
theological_decisions: []
