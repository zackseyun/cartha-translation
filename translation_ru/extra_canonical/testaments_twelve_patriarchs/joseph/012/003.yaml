  text: And the chief of them said to me, “You are not a servant, for your appearance also makes it plain.” But I told them plainly that I was their servant.
translation:
  language: ru
  text: 'И старший из них сказал мне: «Ты не раб, ведь и твой вид ясно говорит об этом». А я сказал им, что я их[а] раб.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: а
    text: «Их» — редакторское восстановление в греческом тексте.
    reason: Передаёт текстологический статус заключённого в редакторские скобки αὐτῶν, не изменяя смысла перевода.
lexical_decisions:
- source_word: ὁ μείζων αὐτῶν
  choice: старший из них
  rationale: Передаёт сравнительную форму μείζων без уточнения, идёт ли речь о возрасте, положении или главенстве; «старший» сохраняет эту возможную широту.
- source_word: δοῦλος
  choice: раб
  rationale: Прямое соответствие греческому δοῦλος; более точное, чем смягчённое «слуга», особенно при заявлении о принадлежности хозяевам.
- source_word: ἡ ὄψις σου
  choice: твой вид
  rationale: Естественное современное выражение для внешнего облика человека.
- source_word: δηλοῖ
  choice: ясно говорит об этом
  rationale: Идиоматично передаёт значение «делает очевидным, показывает», сохраняя явность признака во внешности.
- source_word: ὑπάρχω
  choice: я … раб
  rationale: Русская именная конструкция естественно передаёт «являюсь / состою» без тяжеловесного глагола-связки.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Сохранено повторение слова «раб» и неоднозначное «старший»; восстановленный издателем элемент αὐτῶν передан как «их» без сноски, поскольку он согласуется с контекстом и отмечен в исходном тексте как редакционно неуверенный, но не как самостоятельный вариант чтения.
