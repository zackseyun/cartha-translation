base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/004.yaml
  text: And when we had come into Egypt, they disputed concerning me, as to who, after betraying me, would receive the gold.
translation:
  language: ru
  text: Когда же мы прибыли в Египет, они спорили обо мне — кто, предав меня, получит золото.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφθάσαμεν
  choice: мы прибыли
  rationale: В данном контексте глагол обозначает достижение места назначения; «прибыли» естественно и точно передаёт смысл.
- source_word: ἐμάχοντο περὶ ἐμοῦ
  choice: они спорили обо мне
  rationale: Медиальная форма передаёт их прение или борьбу между собой; контекст требует словесного спора о судьбе Иосифа.
- source_word: προδούς
  choice: предав меня
  rationale: Причастие от προδίδωμι означает «предать, выдать»; дополнение «меня» восстанавливается из конструкции и контекста, не вводя отсутствующего в греческом тексте купца.
- source_word: χρυσίον
  choice: золото
  rationale: Слово прямо обозначает золото, здесь — плату золотом; более общее «деньги» было бы менее точным.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным ритмом. Тире перед косвенным вопросом естественно передаёт пояснение содержания спора. Не добавлены «купец» или иные участники, отсутствующие в греческом тексте.
