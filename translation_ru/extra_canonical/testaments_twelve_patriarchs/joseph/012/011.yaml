base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/011.yaml
  text: Now therefore render judgment concerning him, and take the young man into our house, and the God of the Hebrews will bless you, because grace from heaven is upon him.
translation:
  language: ru
  text: Итак, теперь рассуди его дело, возьми юношу в наш дом, и Бог евреев благословит тебя, потому что на нём — благодать с небес.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποίησον μετ᾿ αὐτοῦ κρίσιν
  choice: рассуди его дело
  rationale: Передаёт судебный смысл выражения буквально «соверши суд относительно него», избегая неестественного русского оборота и не уточняя заранее исход решения.
- source_word: ἀφελοῦ τὸν νεανίαν εἰς τὸν οἶκον ἡμῶν
  choice: возьми юношу в наш дом
  rationale: В данном контексте ἀφαιρέω выражает взятие или отведение юноши; выбран естественный русский оборот, соответствующий направлению εἰς.
- source_word: εὐλογῆσαί σε ἔχει
  choice: благословит тебя
  rationale: Перифрастическая конструкция передана естественным русским будущим временем.
- source_word: χάρις ἐκ τοῦ οὐρανοῦ ἐστι πρὸς αὐτόν
  choice: на нём — благодать с небес
  rationale: Сохраняет богословски значимое «благодать» и небесный источник; πρὸς αὐτόν по контексту выражено идиоматическим «на нём» без излишнего истолкования.
theological_decisions:
- issue: Значение χάρις
  choice: благодать
  alternative: милость / благоволение
  rationale: «Благодать» сохраняет широкий религиозный диапазон греческого χάρις и не сводит его только к человеческой благосклонности.
- issue: Наименование Бога
  choice: Бог евреев
  alternative: еврейский Бог
  rationale: Формально и достойно передаёт ὁ Θεὸς τῶν Ἑβραίων, не меняя отношения родительного падежа.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Судебная формула сделана понятной обычному читателю, а фраза о благодати сохраняет краткость и некоторую образную неоднозначность оригинала.
