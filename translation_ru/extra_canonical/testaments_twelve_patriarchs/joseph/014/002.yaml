  text: But since I did not alter my statement even while I was being beaten, he ordered that I be kept under guard until the masters of the boy should come.
translation:
  language: ru
  text: Но поскольку я не изменил своих слов даже под побоями, он приказал держать меня под стражей, пока не придут господа мальчика.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἤλλαξα τὸν λόγον μου
  choice: я не изменил своих слов
  rationale: Передаёт устойчивость прежнего свидетельства естественным современным русским языком; единственное число λόγον здесь означает сказанное или изложение, а не отдельное «слово».
- source_word: τυπτόμενος
  choice: даже под побоями
  rationale: Причастие настоящего времени обозначает избиение, происходившее одновременно с отказом изменить сказанное; конструкция сохраняет уступительный оттенок контекста.
- source_word: φυλαχθῆναί με
  choice: держать меня под стражей
  rationale: Пассивный аорист инфинитива в данном контексте означает содержание под охраной или в заключении; выбранная формулировка не уточняет степень заключения сверх греческого текста.
- source_word: οἱ κύριοι τοῦ παιδός
  choice: господа мальчика
  rationale: Сохраняет множественное число κύριοι и зависимость τοῦ παιδός, не заменяя социальное отношение более конкретным словом «хозяева», хотя оно также возможно.
