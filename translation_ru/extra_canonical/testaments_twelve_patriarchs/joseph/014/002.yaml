  text: Ὡς δὲ ⌜ἐγὼ⌉¹¹ οὐκ ἤλλαξα *τὸν λόγον μου¹² ⌜τυπτόμενος⌉, ἐκέλευσε *φυλαχθῆναί με¹³, ἕως οὗ ἔλθωσιν¹⁴ οἱ κύριοι *τοῦ παιδός¹⁵.
