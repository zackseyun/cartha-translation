  text: And the woman kept saying to her husband, “Why do you keep this captive and noble boy in chains, when he ought rather to be set free and waited upon?”
translation:
  language: ru
  text: 'А женщина всё говорила своему мужу: «Почему ты держишь этого пленного юношу благородного происхождения в оковах? Ведь его следовало бы, напротив, освободить и прислуживать ему».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγε
  choice: всё говорила
  rationale: Имперфект передаёт продолжавшееся или повторявшееся действие; это естественно выражено по-русски сочетанием «всё говорила».
- source_word: αἰχμάλωτον
  choice: пленного
  rationale: Сохраняет прямое значение человека, находящегося в плену, без сужения до юридического статуса заключённого.
- source_word: εὐγενῆ παῖδα
  choice: юношу благородного происхождения
  rationale: παῖς в контексте Иосифа естественно передаётся как «юноша», а εὐγενής указывает на благородное происхождение; формулировка избегает двусмысленного современного «благородный юноша», которое может означать лишь нравственные качества.
- source_word: ἐν δεσμοῖς
  choice: в оковах
  rationale: Передаёт буквальный образ уз и соответствует положению пленника.
- source_word: ἄνετον εἶναι
  choice: освободить
  rationale: В данном противопоставлении оковам выражение означает быть свободным от уз; русская активная конструкция естественна после «следовало бы».
- source_word: ὑπηρετεῖσθαι
  choice: прислуживать ему
  rationale: Страдательная форма означает получать услуги или обслуживание; «прислуживать ему» сохраняет усиленный контраст с его нынешним положением.
