  text: And Memphis saw me being beaten through the windows—for her house was nearby—and she sent word to him, saying, “Your judgment is unjust, because you punish as a wrongdoer a free man who has been kidnapped.”
translation:
  language: ru
  text: 'А Мемфис увидела через окна, как меня бьют, — ведь её дом был рядом, — и послала к нему со словами: «Твой приговор несправедлив: ты наказываешь как преступника свободного человека, которого похитили».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεμφὶς
  choice: Мемфис
  rationale: Имя передано традиционной русской транслитерацией; по контексту это женщина, что отражено формой глагола «увидела».
- source_word: ἑώρα διὰ τῶν θυρίδων
  choice: увидела через окна
  rationale: Сохраняется пространственное значение διά с родительным; «окна» естественно передаёт θυρίδες в данном повествовательном контексте.
- source_word: τυπτόμενόν με
  choice: как меня бьют
  rationale: Естественная русская конструкция передаёт страдательное причастие настоящего времени и продолжающееся действие.
- source_word: ἀπέστειλε πρὸς αὐτόν, λέγουσα
  choice: послала к нему сказать
  rationale: Идиоматично передаёт отправку сообщения адресату без необоснованного уточнения посланника.
- source_word: Ἄδικος ἡ κρίσις σου
  choice: Твой приговор несправедлив
  rationale: В судебном контексте κρίσις означает вынесенное решение или приговор, а не абстрактное суждение.
- source_word: τὸν κλαπέντα ἐλεύθερον
  choice: свободного человека, которого похитили
  rationale: κλαπέντα буквально связано с «украсть», но применительно к человеку естественно означает похищение; ἐλεύθερον сохранено как социально значимое определение.
- source_word: τιμωρεῖς, ὡς ἀδικήσαντα
  choice: наказываешь как преступника
  rationale: Кратко и естественно передаёт наказание человека так, словно он совершил неправду; «преступник» соответствует судебному контексту, не уточняя конкретного преступления.
