  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006.yaml
  text: 1 And after this she sent me food mixed with sorcery[a]. 2 But when the eunuch who was bringing it came, I looked up and saw a terrifying man handing me, together with the dish, a sword; and I understood that it was a scheme to lead me astray. 3 So after he had gone out, I ate neither that food nor any of her other foods, but wept without tasting them. 4 Then after one day she came to me, and when she recognized the food, she said to me, “Why is it that you did not eat the food?” 5 And I said to her, “Because you filled it with deadly sorcery. And how did you say, ‘I do not draw near to idols, but to the Lord alone’? 6 Know now, then, that the God of my father, through his angel, revealed your wickedness to me; and for this reason I kept it as evidence against you, to expose you, in hope that perhaps, when you saw it[b][a], you might repent.”
translation:
  language: ru
  text: 'Завещание Иосифа, 6


    1 После этого она прислала мне пищу, смешанную с колдовством. 2 Когда евнух, нёсший её, пришёл, я поднял глаза и увидел грозного мужа[a], который вместе с блюдом протягивал мне меч. И я понял, что это уловка[b], чтобы сбить меня с пути. 3 Когда он вышел, я заплакал и не попробовал ни этой пищи, ни каких-либо других её кушаний. 4 На следующий день она пришла ко мне и, узнав эту пищу, сказала мне:


    — Почему ты не съел пищу?


    5 Я ответил ей:


    — Потому что ты наполнила её смертоносным колдовством. Как же ты могла сказать: «Я приближаюсь не к идолам, а только к Господу»? 6 Теперь знай: Бог моего отца через Своего ангела открыл мне твоё злодейство. Поэтому я сохранил эту пищу для твоего обличения[c] — в надежде, что, увидев её, ты, быть может, раскаешься. 7 А чтобы ты узнала, что злодейство нечестивых не одолеет тех, кто в целомудрии чтит Бога, вот: я беру эту пищу и ем перед тобой.


    Сказав это, я произнёс:


    — Бог моих отцов и ангел Авраама будут со мной.


    И я поел. 8 Увидев это, она пала ниц к моим ногам и заплакала. Я поднял её и вразумил. 9 Тогда она дала мне слово больше не совершать этого нечестия.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст не объясняет, кем был этот «грозный муж»: видением, символическим образом, ангелом или фигурой, связанной с колдовством.'
    reason: Сохранение намеренной неопределённости исходного текста.
  - marker: b
    text: 'Или: «магическое ухищрение, чтобы сбить меня с пути». Слово может обозначать как хитроумную уловку, так и необычное или магическое действие.'
    reason: Лексическая неоднозначность περιέργεια в данном контексте.
  - marker: c
    text: 'Или: «как свидетельство против тебя»; греческое выражение также может означать средство обличения или доказательство вины.'
    reason: Лексическая неоднозначность εἰς ἔλεγχόν σου.
lexical_decisions:
- source_word: βρῶμα
  choice: пища
  rationale: Широкое обозначение еды; последовательно передаёт повторяющееся слово, не сводя его к отдельному блюду.
- source_word: ἐν γοητείᾳ πεφυρμένον
  choice: смешанную с колдовством
  rationale: Сохраняет и значение γοητεία — магия, колдовство, — и конкретный образ примешивания в πεφυρμένον.
- source_word: φοβερὸν ἄνδρα
  choice: грозного мужа
  rationale: «Грозный» передаёт внушающий страх облик, а «муж» поддерживает возвышенный повествовательный регистр, не определяя природу явившегося.
- source_word: τρύβλιον
  choice: блюдо
  rationale: Естественное общее название сосуда для пищи без неоправданного уточнения его формы.
- source_word: μάχαιρα
  choice: меч
  rationale: Слово может означать также большой нож, однако «меч» уместно сохраняет угрожающий характер увиденного образа.
- source_word: περιέργεια
  choice: уловка
  rationale: В контексте обозначает намеренную хитрость или искусный замысел, направленный на совращение Иосифа; возможный магический оттенок отмечен в сноске.
- source_word: εἰς ἀποπλάνησίν μου
  choice: чтобы сбить меня с пути
  rationale: Передаёт нравственную и духовную направленность ἀποπλάνησις, сохраняя образ отклонения от верного пути.
- source_word: γοητείας θανάτου
  choice: смертоносным колдовством
  rationale: Родительный θανάτου естественно понимается как характеристика губительного действия колдовства.
- source_word: ἐν σωφροσύνῃ θεοσεβούντων
  choice: тех, кто в целомудрии чтит Бога
  rationale: Сохраняет как религиозное почитание Бога, так и нравственный акцент σωφροσύνη, особенно важный в контексте искушения Иосифа.
- source_word: ὁ ἄγγελος Ἀβραάμ
  choice: ангел Авраама
  rationale: Формально сохраняет необычное выражение греческого текста и не заменяет его толкованием вроде «ангел-хранитель Авраама».
- source_word: συνεθέτό μου τοῦ μηκέτι ποιῆσαι
  choice: дала мне слово больше не совершать
  rationale: Идиоматично передаёт согласие или обязательство прекратить указанное нечестие.
theological_decisions:
- issue: Природа грозного мужа с мечом
  choice: Личность видимого мужа не определяется.
  alternative: Назвать его ангелом, демоном или чисто символическим видением.
  rationale: Греческий текст сообщает лишь о том, что Иосиф увидел мужа; богословская природа фигуры остаётся неуточнённой.
- issue: Значение выражения ὁ ἄγγελος Ἀβραάμ
  choice: «ангел Авраама»
  alternative: «ангел-хранитель Авраама» или «ангел Бога Авраама»
  rationale: Исходный текст допускает вопросы о характере связи ангела с Авраамом, но не разъясняет её; буквальная конструкция сохраняет эту напряжённость.
- issue: Передача μετανοήσεις
  choice: «раскаешься»
  alternative: «изменишь своё решение»
  rationale: Речь идёт о прямом обличении конкретного злодейства, поэтому нравственно-религиозное «раскаешься» точнее нейтральной перемены мнения.
- issue: Божественная защита при вкушении заколдованной пищи
  choice: Сохранено прямое упование Иосифа на Бога и ангела Авраама без объяснения механизма защиты.
  alternative: Пояснить, что пища была обезврежена чудом или что колдовство было бессильно само по себе.
  rationale: Текст повествует о действии и исповедании Иосифа, но не формулирует теорию о природе колдовства или способе защиты.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, но доступным повествовательным тоном. Диалог оформлен естественно для русского текста. Повторы «пища» и ключевые религиозно-нравственные слова сохранены там, где они поддерживают связность и акценты оригинала; синтаксически трудное место в стихе 7 выстроено как цельное обращение без устранения необычного выражения «ангел Авраама».
