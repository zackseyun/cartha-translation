base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019.yaml
  text: 'And he gave me beauty beyond the handsome men of Israel[a], and preserved me until old age in strength and in beauty; for I was like Jacob in all things.


    Now listen, my children, also concerning the dream that I saw.


    2. Twelve deer were feeding in one place, and the nine were scattered over all the earth; and likewise the three also. So hear the dream that I saw. 3. And I saw that the three deer became three lambs, and they cried out to the Lord, and the Lord led them out into a flourishing and well-watered place, and brought them from darkness into light. 4. And there they cried out to the Lord until the nine deer were gathered to them, and they themselves became like twelve sheep; and after a little time they increased and became many flocks. 5. And after these things I saw, and behold, twelve bulls suckling one heifer, and from her there came a sea of milk, and the twelve flocks and innumerable flocks drank from it. 6. And from the fourth bull the horns went up as far as heaven and became like a wall for the flocks, and between the two horns another horn sprang up. 7. And I saw a calf that encircled them twelve times, and it became for the bulls wholly a help.


    8. And I saw that a virgin was born, and from her was born a lamb, and on his left there rushed forth something like a lion; and all the beasts rushed against him, but the lamb overcame them and destroyed them and trampled them down. 9. And the angels and men and all the earth rejoiced over him. 10. And these things will happen in their season in the last days.


    11. Therefore you, my children, keep the commandments of the Lord, and honor Levi and Judah; for from their seed there will arise for you the salvation of Israel. 12. For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will come to an end, like a watchman''s hut after the summer[d][c][b], vanishing away.'
translation:
  language: ru
  text: '**Завещание Иосифа 18:4б; 19**


    **18:4б** Он даровал мне красоту, превосходившую красоту израильтян, и сохранил меня до старости в силе и красоте, потому что во всём я был подобен Иакову.


    **19:1** Послушайте же, дети мои, и о сновидениях, которые мне известны.


    **2** Двенадцать оленей паслись в одном месте. Девять из них рассеялись по всей земле, и так же рассеялись три. **3** И я увидел, что три оленя превратились в трёх ягнят. Они воззвали к Господу, и Господь вывел их в цветущую, изобилующую водой землю и привёл их из тьмы к свету. **4** Там они взывали к Господу до тех пор, пока к ним не собрались девять оленей. Все они стали словно двенадцать овец, а немного времени спустя умножились и превратились во множество стад.


    **5** После этого я увидел двенадцать быков, сосавших молоко у одной телицы. Из её молока возникло целое море,[a] и из него пили двенадцать стад и бесчисленное множество других стад. **6** Рога четвёртого быка поднялись до самого неба и стали словно стеной для стад, а между этими двумя рогами вырос ещё один рог. **7** Затем я увидел телёнка, который двенадцать раз обошёл их кругом и стал для быков помощью во всём.


    **8** И я увидел, что родилась дева,[b] а от неё родился ягнёнок.[c] Слева от него было нечто подобное льву.[d] Все звери устремились на ягнёнка, но он победил их, уничтожил и растоптал. **9** Ангелы, люди и вся земля радовались о нём. **10** Всё это произойдёт в своё время, в последние дни.


    **11** Поэтому вы, дети мои, соблюдайте заповеди Господа и почитайте Левия и Иуду, потому что от их потомства восстанет для вас тот, кто спасёт Израиль.[e] **12** Его царство будет вечным царством, которое не пройдёт. Моё же царство среди вас подойдёт к концу и исчезнет, словно сторожевой шалаш в саду после окончания лета.[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В этом месте греческий текст повреждён; общий смысл образа — море молока, которым питаются двенадцать и бесчисленные стада, — остаётся ясным.
    reason: textual_difficulty
  - marker: b
    text: 'В некоторых греческих свидетелях сказано подробнее: «от Иуды родилась дева, одетая в льняное одеяние»; в другой форме текста Иосиф видит некую деву среди рогов.'
    reason: textual_variant
  - marker: c
    text: Некоторые свидетели добавляют, что ягнёнок был «непорочным».
    reason: textual_variant
  - marker: d
    text: Фраза о находившемся слева подобии льва текстуально трудна. Другая форма этого места описывает сцену иначе, но также сохраняет нападение враждебных зверей на ягнёнка.
    reason: alternative_reading
  - marker: e
    text: 'Некоторые расширенные свидетели читают здесь: «Агнец Божий, берущий на себя грех мира», и добавляют, что он спасает «все народы и Израиль».'
    reason: textual_variant
  - marker: f
    text: Имеется в виду временный полевой шалаш, из которого сторож охранял созревающие плоды. После окончания сезона его оставляли, и он исчезал или разрушался.
    reason: cultural_note
lexical_decisions:
- source_word: ὡραιότητα
  choice: красоту
  rationale: Слово обозначает телесную красоту или привлекательность; современное «красота» естественно передаёт смысл без архаизации.
- source_word: ἐφύλαξέ
  choice: сохранил
  rationale: В контексте речь о Божьем продолжительном хранении Иосифа вплоть до старости, поэтому «сохранил» точнее нейтрального «берёг».
- source_word: ἐνύπνιον
  choice: сон
  rationale: Речь идёт о символическом сновидении; простое слово «сон» понятно и не добавляет отсутствующего в тексте толкования.
- source_word: ἔλαφοι
  choice: олени
  rationale: Общее название животного сохраняет образ, не уточняя пол там, где это не требуется греческим текстом.
- source_word: ἀμνοί / ἀμνός
  choice: ягнята / ягнёнок
  rationale: Современные русские слова сохраняют пастушескую и жертвенную образность, не вводя заранее позднейший титул «Агнец Божий», присутствующий лишь в расширенном чтении.
- source_word: τόπον εὐθαλῆ καὶ ἔνυδρον
  choice: цветущую, изобилующую водой землю
  rationale: 'Переданы оба элемента образа: пышная растительность и обилие воды. «Земля» в данном контексте звучит естественнее буквального «место».'
- source_word: ἐκ σκότους εἰς φῶς
  choice: из тьмы к свету
  rationale: Прямой перевод сохраняет прозрачную метафору избавления.
- source_word: πρόβατα / ποίμνια
  choice: овцы / стада
  rationale: Различение отдельных овец и умножившихся стад сохраняет развитие образа во сне.
- source_word: βόες
  choice: быки
  rationale: Мужской образ и последующее упоминание рогов поддерживают конкретное «быки», а не более широкое «скот».
- source_word: θηλάζοντες
  choice: сосавших молоко
  rationale: Так прямо и понятно передано необычное действие двенадцати быков у одной телицы.
- source_word: δάμαλιν
  choice: телицы
  rationale: Это обычное русское соответствие для молодой коровы и подходит образному ряду домашнего скота.
- source_word: ὀπωροφυλάκιον
  choice: сторожевой шалаш в саду
  rationale: Слово обозначает временное укрытие сторожа, охраняющего плоды; перевод раскрывает предметный образ без громоздкости.
theological_decisions:
- issue: Расширенный мессианский текст в стихах 8 и 11
  choice: 'В основном тексте сохранено более краткое чтение: дева рождает ягнёнка, а от потомства Левия и Иуды восстаёт тот, кто спасёт Израиль.'
  alternative: «От Иуды родилась дева… от неё родился непорочный агнец» и «Агнец Божий, берущий на себя грех мира, спасающий все народы и Израиль».
  rationale: Явно христианские формулировки заключены в издании греческого текста в скобки и принадлежат расширенным свидетелям. Они отмечены в примечаниях, но не внесены молча в основной текст.
- issue: Личность будущего спасителя и царя
  choice: «Тот, кто спасёт Израиль» и далее «его царство».
  alternative: Безличное «спасение Израиля» либо прямое отождествление с конкретным позднейшим христологическим титулом.
  rationale: Нескобочный греческий текст содержит причастие σώζων, предполагающее действующее лицо, а следующее «его царство» поддерживает личное понимание. При этом перевод не уточняет его личность сверх текста.
- issue: Образы Левия и Иуды
  choice: Сохранено совместное упоминание потомства Левия и Иуды без догматического объяснения их ролей.
  alternative: Явное распределение между священническим и царским служениями.
  rationale: Такое распределение возможно как толкование, но в самом стихе не разъясняется; перевод сохраняет напряжение и открытость образа.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной и пророческой речи. Синтаксис сделан ясным для обычного читателя, но необычные образы сна сохранены без рационализирующего пересказа. Архаизмы употреблены только там, где они укоренены в понятном библейском регистре («воззвали», «царство»); позднейшие конфессионально нагруженные формулы не перенесены из вариантных чтений в основной текст.
