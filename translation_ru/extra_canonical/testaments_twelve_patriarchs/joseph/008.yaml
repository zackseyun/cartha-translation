  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008.yaml
  text: '6[a]. And she said to me, “See then, you love me. Let this be enough for me: only take thought for my life and for my children, and I have hope that I shall also obtain my desire.” 7. But she did not know that I spoke thus because of my Lord, and not because of her. 8. For if anyone falls under the passion of desire and is enslaved to it, as she also was, even if he hears something good, he interprets it in terms of that passion, toward his evil desire[b].


    1. So I say, my children, that it was about the sixth hour when she left me. And bending my knee to the Lord all that day and all that night, toward dawn I rose, weeping and asking for deliverance from her. 2. At last, with evil intent, she seized my garments by force, dragging me violently toward intercourse. 3. Therefore, when I saw that in her frenzy she had hold of my tunic, I left it behind and fled naked. 4. But she, taking hold of it, slandered me; and when her husband came, he cast me into prison in his house, and on the next day, after scourging me, he sent me into Pharaoh’s dungeon. 5. And while I was in chains[c], the Egyptian woman was constrained by grief.'
translation:
  language: ru
  text: '**Завещание Иосифа 7:6–8; 8:1–5**


    **7:6** И она сказала мне: «Вот, значит, ты любишь меня. Этого мне довольно. Только позаботься о моей жизни и о моих детях, и я надеюсь, что добьюсь также исполнения своего желания». **7** Но она не знала, что я сказал это ради моего господина, а не ради неё. **8** Ведь если кто подпадёт под власть страсти и станет её рабом, как и она, то, даже услышав нечто доброе, истолкует это в свете той страсти — в угоду своему порочному желанию.


    **8:1** Итак, говорю, дети мои: было около шестого часа, когда она ушла от меня. Преклонив колено пред Господом, я весь тот день и всю ночь оставался так; а на рассвете встал, плача и прося избавить меня от неё. **2** Наконец она силой схватила меня за одежды и стала насильно тащить к соитию[a]. **3** Увидев, что она в исступлении держит меня за хитон, я оставил его и, вырвавшись[b], убежал нагим. **4** Она же, удержав хитон, ложно обвинила меня. Когда пришёл её муж, он бросил меня в темницу при своём доме, а на следующий день, подвергнув бичеванию, отправил в темницу фараона. **5** Когда я был в оковах, египтянка изнемогала от печали. Она приходила и прислушивалась к тому, как я благодарил Господа и пел хвалу в доме тьмы, как радостным голосом прославлял моего Бога за то, что под этим предлогом[c] избавился от египтянки.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. συνουσία здесь прямо означает половое сношение.
    reason: lexical_alternative
  - marker: b
    text: Слова «и, вырвавшись» в издании Чарлза заключены в квадратные скобки; их текстовая достоверность не вполне ясна. Ср. Быт. 39:12, где Иосиф оставляет одежду в руке женщины и убегает.
    reason: textual_variant_and_cross_reference
  - marker: c
    text: То есть ложное обвинение и заключение, послужившие поводом удалить Иосифа из дома, одновременно избавили Иосифа от дальнейших домогательств египтянки.
    reason: clarification
lexical_decisions:
- source_word: ἀντιποιῆσαι τῆς ζωῆς μου καὶ τῶν τέκνων μου
  choice: позаботься о моей жизни и о моих детях
  rationale: Оборот означает принять чьё-либо положение и благополучие близко к сердцу, сделать их предметом своей заботы. Русское «позаботься» естественно передаёт манипулятивную просьбу без избыточного истолкования.
- source_word: ὑποπέσῃ πάθει ἐπιθυμίας καὶ δουλωθῇ αὐτῷ
  choice: подпадёт под власть страсти и станет её рабом
  rationale: Сохраняются образы подчинения и рабства; значение желания раскрывается контекстом, поэтому тяжеловесное «страсть желания» не воспроизводится буквально.
- source_word: ἐκλαμβάνει αὐτὸ πρὸς τὴν πονηρὰν ἐπιθυμίαν
  choice: истолкует это в свете той страсти — в угоду своему порочному желанию
  rationale: 'ἐκλαμβάνει здесь описывает искажённое понимание услышанного: страсть заставляет человека обратить даже доброе слово к дурному желанию.'
- source_word: κλίνας γόνυ πρὸς Κύριον
  choice: преклонив колено пред Господом
  rationale: Сохранены телесный образ молитвы и возвышенный, но понятный современный регистр.
- source_word: μετὰ βίας ἐφελκομένη με εἰς συνουσίαν
  choice: стала насильно тащить к соитию
  rationale: συνουσία в данном контексте прямо обозначает половое сношение; «соитие» точно и сдержанно передаёт смысл.
- source_word: μαινομένη
  choice: в исступлении
  rationale: Слово обозначает неистовство, вызванное страстью; русский вариант передаёт потерю самообладания, не вводя медицинского диагноза.
- source_word: ἐσυκοφάντησέ με
  choice: ложно обвинила меня
  rationale: Глагол подразумевает злонамеренный ложный донос; «ложно обвинила» здесь точнее повествовательного «оклеветала».
- source_word: οἴκῳ τοῦ σκότους
  choice: в доме тьмы
  rationale: Сохранён выразительный образ греческого текста, а не заменён нейтральным повтором слова «темница».
- source_word: διὰ προφάσεως ἀπηλλάγην τῆς Αἰγυπτίας
  choice: под этим предлогом избавился от египтянки
  rationale: 'Перевод сохраняет необычную причинную формулировку: ложное обвинение и последовавшее заключение парадоксально стали средством избавления Иосифа от женщины.'
theological_decisions:
- issue: Кого обозначает «мой Господь» в 7:7
  choice: Бога, обозначенного словом «Господь» с прописной буквы
  alternative: Земного господина Иосифа
  rationale: Ближайшее продолжение говорит о молитве Господу и прославлении «моего Бога»; поэтому богословский референт наиболее естественен, хотя само существительное κύριος допускает значение земного господина.
- issue: Действие порабощающей страсти в 7:8
  choice: Страсть искажает восприятие, так что даже доброе истолковывается в пользу порочного желания
  alternative: Высказывание относится только к единичной ошибке египтянки
  rationale: Греческий текст формулирует общее условное наставление и одновременно связывает его с женщиной словами «как и она»; перевод сохраняет обе стороны.
- issue: Радость Иосифа в заключении
  choice: Иосиф прославляет Бога за избавление от египтянки, наступившее через последствия ложного обвинения
  alternative: Он благодарит Бога только за духовное утешение в темнице
  rationale: Финальная причинная конструкция прямо связывает прославление с избавлением от египтянки, не отрицая тяжести заключения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным завещательным и молитвенным регистром. Синтаксис упрощён там, где буквальное воспроизведение греческого было бы неестественным, но сохранены образы рабства, преклонённого колена, дома тьмы и парадоксального избавления через ложное обвинение.
