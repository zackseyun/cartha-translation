review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод точно передаёт повествование, включая продолжение 8:5, отсутствующее в английском тексте POB. Нужны две безопасные правки: убрать добавленное «вам» в 8:1 (его нет в греческом) и не устранять неоднозначность κύριός μου в 7:7 прописной буквой, поскольку слово может означать и Бога, и земного господина. В 8:1 также полезно не добавлять прямо глагол «молился», а сохранить образ непрестанно преклонённого колена.'
  naturalness: Русский текст в основном естественен и выдержан в современном литературном, слегка возвышенном регистре. «Преклонял колено пред Господом» и «стала насильно тащить к соитию» звучат ясно и уместно. «Дом тьмы» намеренно сохраняет образ источника.
  terminology: «Страсть», «раб», «хитон», «темница», «фараон» и «соитие» употреблены последовательно и точно. «Мой господин» в 7:7 сохраняет исходную референциальную неопределённость без доктринального решения; в прямой молитве 8:1 и прославлении Бога в 8:5 «Господь» и «Бог» остаются с прописной буквы.
  issues:
  - severity: medium
    issue: В 7:7 «моего Господа» однозначно делает κύριός μου именем Бога.
    rationale: Хотя контекст допускает богословское понимание, греческое κύριος может также относиться к господину Иосифа. При спорном референте перевод должен сохранить неоднозначность.
  - severity: low
    issue: В 8:1 добавлено «говорю вам».
    rationale: Греческий текст имеет μόνο λέγω οὖν, τέκνα μου («итак, говорю, дети мои») без местоимения «вам».
  - severity: low
    issue: В 8:1 прямо добавлено «я ... молился».
    rationale: Молитвенный смысл ясен из «преклонив колено пред Господом», но исходник выражает его через этот телесный образ, не употребляя отдельного глагола «молиться».
