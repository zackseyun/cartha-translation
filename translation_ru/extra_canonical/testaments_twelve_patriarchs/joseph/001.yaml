base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001.yaml
  text: '3. In my life I saw envy and death, and I was not led astray, but remained in the truth of the Lord.

    4. My brothers hated me, but the Lord loved me. They wanted to kill me, but the God of my fathers kept me safe. They lowered me into a pit, and the Most High brought me up.

    5. I was sold into slavery, and the Master of all set me free. I was taken into captivity, and his mighty hand helped me. I was gripped by famine, and the Lord himself nourished me.

    6. I was alone, and God comforted me. I was weak, and the Lord visited me. I was in prison, and the Savior showed me favor. [I was in chains, and he loosed me.]

    7. Amid slanders he spoke in my defense. In the bitter talk of dreams he rescued me.'
translation:
  language: ru
  text: 'Завещание Иосифа, одиннадцатого сына Иакова и Рахили


    1. Список завещания Иосифа. Когда приблизилась его смерть, он созвал своих сыновей и братьев и сказал им:


    2. «Братья мои и дети мои, послушайте меня, Иосифа, которого любил Израиль; внимайте словам моих уст.


    3. В своей жизни я видел зависть и смерть, но не сбился с пути, а остался в истине Господа.


    4. Братья мои возненавидели меня, но Господь возлюбил меня. Они хотели убить меня, но Бог моих отцов сохранил меня. Они спустили меня в яму, но Всевышний поднял меня оттуда.


    5. Я был продан в рабство, но Владыка всего освободил меня. Я был взят в плен, но Его могучая рука помогла мне. Голод сковал меня, но Сам Господь питал меня.


    6. Я был один, но Бог утешил меня. Я был немощен, но Господь посетил меня. Я был в темнице, но Спаситель явил мне милость. [Я был в оковах, но Он освободил меня.][a]


    7. Среди клевет Он выступил в мою защиту. Среди горьких речей о снах Он избавил меня.[b] Я был рабом, но Он возвысил меня».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «Я был в оковах, но Он освободил меня» в издании отмечены как текстуально неустойчивые.
    reason: Квадратные скобки в исходном критическом тексте указывают на сомнение в принадлежности фразы первоначальному тексту.
  - marker: b
    text: Греческое выражение можно понять и как «при горьких словах снов»; его точный смысл неясен.
    reason: Синтаксическая связь λόγοις, ἐνυπνίων и πικροῖς допускает разные понимания, и неясность следует сохранить.
lexical_decisions:
- source_word: ἀντίγραφον
  choice: список
  rationale: Слово обозначает письменную копию или экземпляр документа; «список» сохраняет древний документальный оттенок и понятно в контексте заголовка.
- source_word: ἐνωτίσασθε
  choice: внимайте
  rationale: Передаёт усиленный призыв внимательно слушать и сохраняет возвышенный, но понятный регистр.
- source_word: οὐκ ἐπλανήθην
  choice: не сбился с пути
  rationale: Сохраняет образ заблуждения или уклонения, не сужая его до чисто интеллектуальной ошибки.
- source_word: συνεσχέθην
  choice: сковал меня
  rationale: Глагол означает быть охваченным, удерживаемым или стеснённым; образное «голод сковал меня» передаёт силу состояния без неоправданного уточнения.
- source_word: ἐπεσκέψατό με
  choice: посетил меня
  rationale: Сохранён традиционный библейский глагол, который может подразумевать заботливое вмешательство, но не сводится просто к исцелению.
- source_word: ἐχαρίτωσέ με
  choice: явил мне милость
  rationale: Передаёт оказание благоволения или милости естественным русским выражением, не внося специального догматического смысла.
- source_word: συνηγόρησέ μοι
  choice: выступил в мою защиту
  rationale: Юридически окрашенный глагол означает говорить за кого-либо или защищать его; перевод сохраняет этот оттенок.
- source_word: λόγοις ἐνυπνίων πικροῖς
  choice: среди горьких речей о снах
  rationale: Сохраняет необычную и неоднозначную связь «слов/речей» со «снами», не заменяя её толкованием.
theological_decisions:
- issue: Чередование наименований Бога
  choice: Сохранены «Господь», «Бог моих отцов», «Всевышний», «Владыка всего», «Бог» и «Спаситель»
  alternative: Унифицировать все обозначения как «Бог» или «Господь»
  rationale: Разнообразие титулов присутствует в греческом тексте и составляет часть его богословской и поэтической ткани.
- issue: «Истина Господа» в 3-м стихе
  choice: остался в истине Господа
  alternative: остался верен Господу
  rationale: 'Более формальный вариант сохраняет неоднозначность выражения ἐν τῇ ἀληθείᾳ Κυρίου: речь может идти и о Божьей истине, и о верности ей.'
- issue: «Господь посетил меня» в 6-м стихе
  choice: Господь посетил меня
  alternative: Господь позаботился обо мне / исцелил меня
  rationale: Исходный глагол шире конкретного исцеления; буквальное библейское выражение сохраняет возможный смысл Божьего благодатного вмешательства.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Параллельные противопоставления сохранены повтором «но», чтобы воспроизвести исповедальный ритм текста. Редакторские звёздочки, крест и цифровые знаки аппарата не перенесены как часть авторского текста; текстуально значимая квадратная вставка сохранена и пояснена.
