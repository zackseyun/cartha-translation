base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017.yaml
  text: 1[a]. See then, my children, how much I endured so that I might not put my brothers to shame. 2. You also, therefore, love one another, and with patience conceal one another’s shortcomings. 3. For God delights in the harmony of brothers and in the purpose of a good heart that intends what is good. 4[b]. And when my brothers came to Egypt, they themselves know that I returned their money to them, and did not reproach them, but encouraged them. 5. And after the death of Jacob my father, I loved them even more, and whatever they wanted I did for them beyond measure. 6. And I did not allow them to be distressed even in the smallest matter; rather, everything that was in my hand I gave to them. 7. And their sons were my sons, and my sons were as servants to them, and their soul was my soul, and every pain of theirs was my pain, and every weakness of theirs was my sickness, and their purpose was my purpose. 8. And I did not exalt myself among them in arrogance because of my worldly glory[c],
    but I was among them as one of the least.
translation:
  language: ru
  text: 1. Итак, видите, дети мои, сколько я перенёс, чтобы не опозорить моих братьев. 2. Так и вы любите друг друга и с долготерпением покрывайте недостатки друг друга.[a] 3. Ведь Бог радуется согласию братьев и намерению доброго сердца, устремлённого к добру.[b] 4. Когда мои братья пришли в Египет, они сами знают, что я возвратил им серебро, не укорял их, а ободрял. 5. И после смерти Иакова, отца моего, я полюбил их ещё больше и всё, чего они желали, делал для них с избытком. 6. Я не допускал, чтобы они терпели бедствие даже в самом малом; напротив, всё, что было в моей власти, я отдавал им. 7. Их сыновья — мои сыновья, а мои сыновья — как их рабы;[c] их душа — моя душа, всякая их боль — моя боль, всякая их немощь — моя болезнь, и их замысел — мой замысел. 8. Я не превозносился над ними в высокомерии из-за своей мирской славы, но был среди них как один из самых малых.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «скрывайте недостатки друг друга». Греческий глагол выражает мысль о том, чтобы не выставлять чужие недостатки напоказ.'
    reason: lexical_alternative
  - marker: b
    text: 'Фраза о намерении доброго сердца в греческом тексте синтаксически неровна. Перевод следует её вероятному этическому смыслу: сердце сознательно направлено к добру.'
    reason: textual_variant
  - marker: c
    text: «Рабы» — буквальный перевод греческого δοῦλοι. Намеренно сильное выражение подчёркивает смирение Иосифа и подчинённое положение его сыновей по отношению к его братьям.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσχύνω
  choice: опозорить
  rationale: Передаёт причинение стыда и публичного унижения, от которого Иосиф сознательно удержался.
- source_word: μακροθυμία
  choice: долготерпение
  rationale: Сохраняет смысл продолжительного терпеливого самообладания по отношению к другим и соответствует возвышенному увещательному регистру.
- source_word: συγκρύπτετε
  choice: покрывайте
  rationale: Глагол указывает на то, чтобы не выставлять недостатки другого напоказ; «покрывайте» сохраняет образность и не обязательно означает обманное сокрытие.
- source_word: ἐλαττώματα
  choice: недостатки
  rationale: Естественно обозначает реальные изъяны или проступки без чрезмерно резкой либо клинической окраски.
- source_word: ὁμονοία
  choice: согласие
  rationale: Передаёт единомыслие и мирное согласие между братьями естественным современным русским словом.
- source_word: προαίρεσις καρδίας
  choice: намерение доброго сердца
  rationale: Сохраняет акцент на сознательной внутренней нравственной направленности.
- source_word: παρεκάλεσα
  choice: ободрял
  rationale: В сцене примирения передаёт утешение и успокоение братьев, не сужая значение до наставления.
- source_word: ὑπερεκπερισσοῦ
  choice: в избытке
  rationale: Передаёт усиленное значение чрезвычайной, превосходящей меру щедрости без тяжеловесной конструкции.
- source_word: θλιβῆναι
  choice: терпели нужду
  rationale: В контексте практической заботы Иосифа выражает допущение бедствия или стеснения; русская формулировка звучит естественно.
- source_word: ἕως μικροῦ πράγματος
  choice: даже в самом малом
  rationale: Передаёт всеохватность заботы, распространяющейся и на самые незначительные дела.
- source_word: δοῦλοι
  choice: рабы
  rationale: Сохраняет намеренно сильный образ подчинённого положения сыновей Иосифа по отношению к его братьям.
- source_word: κοσμικήν δόξαν
  choice: мирская слава
  rationale: Передаёт славу и положение Иосифа в земном общественном порядке, не придавая выражению более позднего узкоконфессионального смысла.
theological_decisions:
- issue: Призыв покрывать недостатки братьев
  choice: «с долготерпением покрывайте недостатки друг друга»
  alternative: «терпеливо скрывайте проступки друг друга»
  rationale: Избранная формулировка передаёт милосердный отказ выставлять чужие изъяны напоказ, но не утверждает отрицания или оправдания зла.
- issue: Текстуально трудная фраза в стихе 3
  choice: «намерению доброго сердца, устремлённого к добру»
  alternative: «решению доброго сердца, благоволящего к добру»
  rationale: Греческая конструкция шероховата и допускает разные синтаксические связи. Перевод сохраняет очевидную этическую направленность к добру, не делая вид, будто текст однозначен.
- issue: Сильная социальная метафора δοῦλοι в стихе 7
  choice: «рабы»
  alternative: «слуги»
  rationale: Буквальное сильное слово подчёркивает смирение Иосифа и готовность поставить собственный дом в подчинённое положение по отношению к братьям; это не вводит учение о нормативности рабства.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного увещания. Синтаксис преимущественно ясный и прямой; сохранены повторения и параллелизм греческого текста. Архаизмы ограничены словом «долготерпение», которое здесь точно и понятно передаёт нравственный термин.
