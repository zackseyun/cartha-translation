base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/002.yaml
  text: Twelve deer were feeding in one place, and the nine were scattered over all the earth; and likewise the three also.
translation:
  language: ru
  text: Двенадцать оленей паслись в одном месте; девять рассеялись по всей земле, и то же произошло с тремя.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαφοι
  choice: олени
  rationale: Прямое и естественное соответствие греческому существительному; родовое обозначение сохраняет образ без ненужного уточнения пола животных.
- source_word: ἐνέμοντο
  choice: паслись
  rationale: 'Средний имперфект передаёт продолжительное действие: животные кормились, паслись.'
- source_word: διεσπάρησαν
  choice: рассеялись
  rationale: Сохраняет образ разъединения и распространения по разным местам; форма допускает неназванную внешнюю причину, но по-русски естественнее непереходная конструкция.
- source_word: εἰς πᾶσαν τὴν γῆν
  choice: по всей земле
  rationale: Естественно передаёт распространение по всему пространству земли, не уточняя, имеется ли в виду мир или конкретная страна.
- source_word: ὁμοίως δὲ καὶ οἱ τρεῖς
  choice: а вслед за ними — и трое остальных
  rationale: Передаёт, что та же участь постигла и оставшихся троих; слово «остальных» ясно из числа двенадцать минус девять, хотя в греческом подразумевается контекстом.
theological_decisions:
- issue: Символическое значение групп из девяти и трёх оленей
  choice: Не истолковывать символику внутри перевода
  alternative: Назвать их коленами или историческими группами
  rationale: Греческий текст сохраняет образ видения и сам не раскрывает его в данном стихе; перевод не должен подменять образ толкованием.
- issue: Направленность рассеяния трёх
  choice: «вслед за ними» как указание на аналогичное рассеяние
  alternative: «так же и трое» без явного дополнения
  rationale: ὁμοίως указывает на повторение предыдущего события; русская эллиптическая конструкция сохраняет смысл и читается естественно.
translation_notes:
  register: Современный литературный русский язык с достоинством повествования о видении. Сохранены числовая структура, образ оленей и географическая неопределённость слова γῆ. Точка с запятой разграничивает исходную сцену и последующее рассеяние.
