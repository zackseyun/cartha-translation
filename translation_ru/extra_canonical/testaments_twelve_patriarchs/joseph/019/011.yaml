  source_fidelity: 'Смысл в целом передан точно: сохранены повеления хранить заповеди и почитать Левия с Иудой, происхождение спасителя от их потомства, образ его «восхождения», а также причастный оборот «спасая». Квадратные скобки исходного издания должны сохраняться. Однако «от их семени» и особенно «уносит грех» менее естественны в современном литературном русском, чем точные по смыслу «из их потомства» и «снимает грех».'
