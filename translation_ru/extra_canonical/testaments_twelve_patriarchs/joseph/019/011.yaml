base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/011.yaml
  text: Therefore you, my children, keep the commandments of the Lord, and honor Levi and Judah; for from their seed there will arise for you [the lamb of God, who takes away the sin of the world,] saving [all the nations and] Israel.
translation:
  language: ru
  text: Итак, дети мои, соблюдайте заповеди Господа и почитайте Левия и Иуду, потому что из их потомства взойдёт для вас [Агнец Божий, Который снимает грех мира][a], спасая [все народы и][b] Израиль.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «Агнец Божий, Который снимает грех мира» в используемом греческом издании заключены в квадратные скобки, что отмечает текстуальную неуверенность этого фрагмента.
    reason: Сноска поставлена у первого скобочного фрагмента, как в исходном издании.
  - marker: b
    text: Слова «все народы и» в используемом греческом издании заключены в квадратные скобки, что отмечает текстуальную неуверенность этого фрагмента.
    reason: Сноска поставлена у второго скобочного фрагмента, как в исходном издании.
lexical_decisions:
- source_word: φυλάξατε
  choice: соблюдайте
  rationale: В контексте заповедей глагол означает хранить их верностью и исполнением; современное русское «соблюдайте» передаёт это естественно.
- source_word: τιμᾶτε
  choice: почитайте
  rationale: Передаёт длительное уважительное отношение, выраженное формой настоящего времени, и сохраняет возвышенный регистр.
- source_word: ἐκ τοῦ σπέρματος αὐτῶν
  choice: от их семени
  rationale: Сохраняет собирательную родовую метафору оригинала и неоднозначную соотнесённость местоимения с Левием и Иудой.
- source_word: ἀνατελεῖ
  choice: взойдёт
  rationale: Сохраняет образ восхода или появления, возможный в греческом глаголе, не сводя его к нейтральному «произойдёт».
- source_word: ὁ ἀμνὸς τοῦ Θεοῦ
  choice: Агнец Божий
  rationale: Устоявшееся и узнаваемое библейское выражение, соответствующее достоинству текста.
- source_word: ὁ αἴρων
  choice: Который уносит
  rationale: Передаёт основное образное значение αἴρω — поднять и унести; не устраняет возможный смысл удаления греха.
- source_word: σώζων
  choice: спасая
  rationale: Причастная конструкция сохраняет синтаксическую связь и некоторую неопределённость временного отношения к «взойдёт».
theological_decisions:
- issue: Текстуальная вторичность христиански звучащих выражений
  choice: Сохранить слова в квадратных скобках и пояснить их текстуальную неустойчивость в сноске
  alternative: Включить их без обозначения либо удалить из основного текста
  rationale: Издание источника само отмечает скобками спорные элементы; перевод не должен скрывать эту текстологическую напряжённость.
- issue: Объект спасения
  choice: «[все народы и] Израиль»
  alternative: «Израиль и все народы» либо только «Израиль»
  rationale: Сохранён порядок греческого текста и его редакционная неопределённость без богословского согласования.
- issue: Значение αἴρων применительно к греху
  choice: «уносит грех»
  alternative: «берёт на Себя грех» или «устраняет грех»
  rationale: Выбор сохраняет лексическую образность и не решает однозначно, идёт ли речь о несении греха или его удалении.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным для широкого читателя, при этом сохранены родовая метафора «семя», образ «восхода» и текстологические скобки.
