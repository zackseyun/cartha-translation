base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/001.yaml
  text: Indeed he gave me beauty beyond the handsome men of Israel, and preserved me until old age in strength and in beauty; for I was like Jacob in all things. Now listen, my children, also concerning the dreams that I know about.
translation:
  language: ru
  text: И действительно, он даровал мне красоту, превосходящую красоту красивых мужей Израиля, и сохранил меня до старости в силе и красоте, потому что во всём я был подобен Иакову. Послушайте же, дети мои, также о снах, о которых мне известно.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческая формулировка в конце стиха текстуально не вполне ясна; буквально она говорит о снах, о которых Иосиф знает, а не прямо о снах, которые он видел.
    reason: Отмечает реальную трудность греческого текста и объясняет перевод οἶδα без молчаливой замены его другим глаголом.
lexical_decisions:
- source_word: ὡραιότητα … ὑπὲρ ὡραίους Ἰσραήλ
  choice: красоту, превосходившую красоту прекрасных мужей Израиля
  rationale: Передаёт сравнительное значение ὑπέρ и связь однокоренных слов ὡραιότητα/ὡραίους, сохраняя достоинство стиля без добавления превосходной степени.
- source_word: ἐφύλαξέ με ἕως γήρους
  choice: сохранил меня до старости
  rationale: Прямо передаёт длительное Божье сохранение Иосифа вплоть до преклонного возраста.
- source_word: ὅμοιος ἤμην ἐν πᾶσι τῷ Ἰακώβ
  choice: во всём я был подобен Иакову
  rationale: Сохраняет широкий и намеренно неуточнённый смысл ἐν πᾶσι — «во всём».
- source_word: περὶ ὧν οἶδα ἐνυπνίων
  choice: о снах, о которых мне известно
  rationale: Сохраняет множественное число ἐνυπνίων и значение знания в οἶδα, не заменяя его неподтверждённым «которые я видел».
theological_decisions:
- issue: Подлежащее в начале стиха
  choice: сохранено местоимение «он»
  alternative: явно назвать Бога
  rationale: Греческий текст подразумевает подлежащее по контексту; добавление имени «Бог» устранило бы контекстуальную неявность оригинала.
- issue: Объём сходства с Иаковом
  choice: «во всём» без пояснения
  alternative: ограничить сходство внешностью, судьбой или добродетелью
  rationale: Оригинал не уточняет характер сходства, поэтому перевод не должен разрешать эту богословско-повествовательную неопределённость.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным, повествовательным звучанием. Синтаксис близок к греческому, но естественен по-русски; сохранены повтор «красота» и неуточнённые формулировки источника.
