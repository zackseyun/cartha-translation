    issue: «Завершится и исчезнет» относит исчезновение непосредственно к царству и заменяет настоящее время ἐπιτελεῖται будущим.
    rationale: В греческом ἐπιτελεῖται стоит в настоящем времени, тогда как ἐξαφανίζεται — сказуемое образа «сторожевая хижина».
  - severity: low
    issue: «После сбора урожая» сужает μετὰ τὸ θέρος.
    rationale: θέρος в данном тексте означает «лето»; хотя сезонный контекст допускает связь с уборкой, исходное слово не требует такой конкретизации.
  revised_text: Ибо его царство будет вечным царством, которое не пройдёт. Моё же царство среди вас приходит к завершению, подобно тому как сторожевая хижина после лета исчезает.
