id: T12P.JOS.19.12
reference: Testament of Joseph 19:12
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/012.yaml
  text: For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will be brought to completion, like a watchman's hut after the summer, vanishing away.
translation:
  language: ru
  text: Ибо его царство будет вечным царством, которое не пройдёт. Моё же царство среди вас приходит к завершению, подобно тому как сторожевая хижина после лета исчезает.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεία
  choice: царство
  rationale: Прямой и естественный эквивалент, сохраняющий династический и политико-богословский смысл.
- source_word: αἰώνιος
  choice: вечным
  rationale: Передаёт длительность без ограничения и соответствует противопоставлению преходящему царству Иосифа.
- source_word: οὐ παρελεύσεται
  choice: не пройдёт
  rationale: Сохраняет образное значение глагола и естественно звучит в возвышенной русской прозе.
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: В данном контексте речь о царстве или власти Иосифа в среде его потомков; «среди вас» естественнее буквального «в вас» и не вносит идеи внутреннего царства.
- source_word: ἐπιτελεῖται
  choice: завершится
  rationale: Передаёт достижение завершения и одновременно контекстуальное прекращение, не сводя глагол лишь к «придёт конец».
- source_word: ὀπωροφυλάκιον
  choice: сторожевая хижина
  rationale: Обозначает временное укрытие сторожа в саду или на поле; выбран понятный современному читателю функциональный эквивалент.
- source_word: μετὰ τὸ θέρος
  choice: после сбора урожая
  rationale: θέρος может означать лето или жатву; в сочетании с сезонной сторожевой хижиной здесь вероятен смысл окончания уборки урожая.
- source_word: ἐξαφανίζεται
  choice: исчезнет
  rationale: Точно передаёт исчезновение временного сооружения; глагол синтаксически включён в основное предложение ради естественности русского текста.
theological_decisions:
- issue: Противопоставление «его царства» и «моего царства»
  choice: Сохранено без уточнения личности обладателя вечного царства.
  alternative: Назвать мессианского обладателя царства прямо.
  rationale: Греческий текст использует местоимение αὐτοῦ и не даёт в самом стихе явного имени; уточнение устранило бы исходную референциальную зависимость от контекста.
- issue: Значение ἐπιτελεῖται применительно к царству Иосифа
  choice: «завершится»
  alternative: «придёт к концу» или «будет доведено до полноты»
  rationale: Выбор сохраняет лексическую идею завершения и согласуется с образом исчезающей сезонной хижины, не навязывая отдельного учения о совершенствовании царства.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Образ упрощён до понятной «сторожевой хижины», а причастное «исчезая» преобразовано в однородное сказуемое для ясности и естественности.
