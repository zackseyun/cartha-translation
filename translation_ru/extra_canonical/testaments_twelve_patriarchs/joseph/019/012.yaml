review_pass:
  verdict: revise
  source_fidelity: Первая часть передана точно. Во второй части ἐπιτελεῖται — настоящее время («приходит к завершению», «завершается»), а ἐξαφανίζεται относится в греческом синтаксисе к «сторожевой хижине» в сравнении, не является вторым сказуемым о царстве. θέρος прямо означает «лето»; перевод «сбор урожая» возможен лишь как контекстуальная интерпретация и здесь излишне сужает образ.
  naturalness: Предлагаемая редакция сохраняет современный литературный русский и ясный библейский ритм. Оборот «подобно тому как» делает синтаксическую связь исчезновения именно с хижиной недвусмысленной.
  terminology: «Царство», «вечное», «среди вас» и «сторожевая хижина» приемлемы. Личность, обозначенная «его», не уточняется, как и в источнике.
  issues:
