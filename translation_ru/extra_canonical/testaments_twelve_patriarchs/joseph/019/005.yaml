  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/005.yaml
  text: And after these things I saw, and behold, twelve bulls suckling one heifer, and it made a sea of milk, and the twelve flocks and innumerable flocks drank from it.
translation:
  language: ru
  text: 'И после этого я увидел: вот, двенадцать быков сосали молоко у одной телицы, и образовывалось море молока[a]; из него пили двенадцать отар и бесчисленные отары.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст после предлога «из» повреждён; опущенное слово или слова и точное построение этой части фразы неясны.
    reason: Указывает место лакуны после ἐκ и объясняет, почему перевод не уточняет источник моря молока.
lexical_decisions:
- source_word: ἑώρων
  choice: я увидел
  rationale: Контекст передаёт единое последующее видение; русский совершенный вид здесь естественнее греческого имперфекта без утраты смысла.
- source_word: δώδεκα βόες
  choice: двенадцать быков
  rationale: Сохраняется конкретный образ крупного рогатого скота мужского пола.
- source_word: θηλάζοντες μίαν δάμαλιν
  choice: сосали молоко у одной телицы
  rationale: Так естественно по-русски передаётся необычный образ взрослых быков, питающихся молоком одной молодой коровы.
- source_word: γάλακτος θάλασσαν
  choice: море молока
  rationale: Сохранена выразительная метафора оригинала.
- source_word: αἱ δώδεκα ποίμναι καὶ ἀνηρίθμητα ποίμνια
  choice: двенадцать стад и бесчисленные множества стад
  rationale: Различие форм существительного невозможно полноценно воспроизвести по-русски; добавление «множества» естественно передаёт идею неисчислимого числа стад.
theological_decisions:
- issue: Кто или что произвело море молока
  choice: безличное «образовалось море молока»
  alternative: «она произвела море молока» / «из неё возникло море молока»
  rationale: Греческий текст в этом месте повреждён и синтаксически неясен. Безличная конструкция сохраняет образ, не навязывая определённого субъекта и не разрешая неоднозначность.
translation_notes:
  register: Современный литературный русский язык с dignified библейской образностью; необычность видения сохранена, синтаксис сделан понятным для широкого читателя.
