  text: Ταῦτα δὲ³⁶ γενήσεται ἐν καιρῷ αὐτῶν³⁷ ἐν ἐσχάταις ἡμέραις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/010.yaml
  text: But these things will happen in their time, in the last days.
translation:
  language: ru
  text: Но это произойдёт в назначенное для них время, в последние дни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα δὲ
  choice: Но это
  rationale: Указательное местоимение передано естественным русским единственным числом как собирательное «это»; δέ обозначает переход или лёгкое противопоставление и передано союзом «но».
- source_word: γενήσεται
  choice: произойдёт
  rationale: Форма будущего времени среднего залога от γίνομαι здесь означает «случится, произойдёт» и не выражает необходимости.
- source_word: ἐν καιρῷ αὐτῶν
  choice: в назначенное для них время
  rationale: καιρός обозначает надлежащее, определённое время; αὐτῶν сохранено как «для них», соотнося срок с упомянутыми событиями.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: в последние дни
  rationale: Прямой и традиционно понятный перевод эсхатологического временного выражения без дополнительного истолкования.
theological_decisions:
- issue: Характер будущего события
  choice: «произойдёт»
  alternative: «должно произойти»
  rationale: В представленном греческом тексте стоит γενήσεται, а не конструкция необходимости δεῖ γίνεσθαι; поэтому модальность долженствования не добавлена.
- issue: Эсхатологическая временная рамка
  choice: сохранено «в последние дни»
  alternative: опустить фразу по варианту рукописной традиции
  rationale: Фраза ἐν ἐσχάταις ἡμέραις присутствует в предоставленном исходном тексте и потому включена в основной перевод.
translation_notes:
  register: Современный литературный русский язык; краткая пророческая формулировка сохранена. Перевод остаётся торжественным, но понятным, без конфессионально обусловленных уточнений.
