lexical_decisions:
- source_word: ἔχαιρον ἐπ᾽ αὐτῷ
  choice: радовались о нём
  rationale: Сохраняет значение радости по поводу этого лица и близко передаёт греческую конструкцию ἐπί с дательным, не уточняя не выраженную в тексте причину радости.
- source_word: οἱ ἄγγελοι καὶ οἱ ἄνθρωποι
  choice: ангелы, и люди
  rationale: Прямо передаёт обе группы; повтор союза поддерживает торжественный перечислительный строй оригинала.
- source_word: πᾶσα ἡ γῆ
  choice: вся земля
  rationale: Сохраняет широкий и потенциально персонифицированный образ всей земли без сужения до её жителей.
theological_decisions:
- issue: Референт местоимения αὐτῷ
  choice: о нём
  alternative: из-за него / ему
  rationale: Оригинал использует местоимение без уточнения референта в пределах стиха; перевод сохраняет эту контекстуальную зависимость и не вводит толкования.
translation_notes:
  register: Современный литературный русский язык с кратким торжественным ритмом. Союз «и» сохранён перед каждым членом перечисления для передачи греческой полисиндетической структуры.
