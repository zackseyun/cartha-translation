source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἑώρων ὅτι τρεῖς¹⁴ ἔλαφοι τρεῖς ἀμνοὶ ἐγίνοντο καὶ ἐβόησαν πρὸς Κύριον καὶ ἐξήγαγε αὐτοὺς Κύριος¹⁵ εἰς τόπον εὐθαλῆ καὶ ἔνυδρον, καὶ ἤγαγε¹⁶ αὐτοὺς ἐκ σκότους εἰς φῶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/003.yaml
  text: And I saw that the three deer became three lambs, and they cried out to the Lord, and the Lord brought them out to a flourishing and well-watered place, and brought them from darkness into light.
translation:
  language: ru
  text: И я увидел, что три оленя стали тремя ягнятами. Они воззвали к Господу, и Господь вывел их в цветущее, обильное водой место и привёл их из тьмы в свет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαφοι
  choice: олени
  rationale: Прямое и естественное соответствие греческому множественному числу; сохраняет образ исходного текста.
- source_word: ἀμνοὶ
  choice: ягнята
  rationale: Передаёт обычное значение слова ἀμνός и сохраняет контраст с оленями.
- source_word: ἐβόησαν πρὸς Κύριον
  choice: воззвали к Господу
  rationale: «Воззвали» естественно для возвышенного повествования и передаёт настойчивое обращение, выраженное глаголом βοάω.
- source_word: ἐξήγαγε
  choice: вывел
  rationale: Точно передаёт направленное движение наружу, выраженное приставочным глаголом ἐξάγω.
- source_word: εὐθαλῆ καὶ ἔνυδρον
  choice: цветущее, обильное водой
  rationale: 'Сохраняет оба признака места: пышную растительность и наличие достаточного количества воды.'
- source_word: ἤγαγε
  choice: привёл
  rationale: Передаёт ἄγω как целенаправленное ведение; отличие от предыдущего ἐξήγαγε сохраняется.
theological_decisions:
- issue: Обозначение Κύριος без артикля
  choice: Господь
  alternative: Владыка
  rationale: В контексте молитвенного обращения и избавления «Господь» является естественным и традиционным соответствием, не добавляя к тексту конфессионального толкования.
- issue: Образ перехода из тьмы в свет
  choice: сохранён буквально
  alternative: истолковать как избавление или просвещение
  rationale: Исходный текст оставляет метафору открытой; перевод не должен заранее определять её богословский смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис разделён на два предложения для ясности, без изменения последовательности образов и действий.
