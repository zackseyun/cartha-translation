  text: And from the fourth bull its horns went up as far as heaven and became like a wall of the flocks, and in the midst of the two horns another horn sprouted.
translation:
  language: ru
  text: И у четвёртого быка рога поднялись до самого неба и стали словно стеной стад, а посреди двух рогов пророс ещё один рог.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦ τετάρτου βοὸς
  choice: у четвёртого быка
  rationale: Естественно передаёт исходную конструкцию, связывая рога с четвёртым быком без добавления отсутствующего в греческом притяжательного местоимения.
- source_word: ἀνέβησαν τὰ κέρατα μέχρι τοῦ οὐρανοῦ
  choice: рога поднялись до самого неба
  rationale: Сохраняет пространственный образ; «до самого» естественно выражает предел μέχρι.
- source_word: ὡς τεῖχος τῶν ποιμνῶν
  choice: словно стена для стад
  rationale: Родительный τῶν ποιμνῶν допускает смысл отношения или предназначения; по-русски «стена для стад» ясно передаёт защитный образ, не уточняя его сверх текста.
- source_word: ἐν μέσῳ τῶν δύο κεράτων
  choice: посреди двух рогов
  rationale: Близко передаёт ἐν μέσῳ и звучит естественно в современном литературном русском.
- source_word: ἐξεβλάστησε ἄλλο κέρας
  choice: пророс ещё один рог
  rationale: Сохраняет ботаническую метафору глагола ἐκβλαστάνω; ἄλλο в данном контексте естественно передано как «ещё один».
theological_decisions:
- issue: Символическое значение быка, рогов и стад
  choice: Оставить образы без истолкования
  alternative: Уточнить предполагаемых исторических или мессианских референтов
  rationale: Сам стих даёт символическое видение, но не раскрывает здесь его значения; перевод не должен вносить конфессиональное или частное толкование.
translation_notes:
  register: Современный литературный русский язык; сохранены торжественность и образность апокалиптического видения без архаизации. Маркеры сносок не добавлены, поскольку текст не требует переводческих примечаний.
