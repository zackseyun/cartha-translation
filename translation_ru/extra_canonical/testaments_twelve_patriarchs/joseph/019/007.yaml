  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/007.yaml
  text: And I saw a calf that encircled them twelve times, and it became wholly a help to the bulls.
translation:
  language: ru
  text: И я увидел телёнка, который двенадцать раз обошёл вокруг них и стал для быков полной помощью.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Чтение греческого слова, переведённого как «полной», в издании отмечено вопросительным знаком.
    reason: Источник печатает ὁλοκλήρως со знаком вопроса; примечание сохраняет текстологическую прозрачность.
lexical_decisions:
- source_word: μόσχον
  choice: телёнка
  rationale: Прямое и естественное соответствие греческому существительному; образ молодого представителя крупного рогатого скота сохранён без уточнения пола, которого форма здесь не требует.
- source_word: δωδεκάκις περιέβαλλε αὐτούς
  choice: двенадцать раз обошёл вокруг них
  rationale: Передаёт повторность δωδεκάκις и пространственное значение περιβάλλω; по-русски естественнее, чем буквальное «окружил их двенадцать раз».
- source_word: τοῖς βουσὶ
  choice: для быков
  rationale: Сохраняет зооморфный образ и значение дательного падежа как получателя помощи.
- source_word: ὁλοκλήρως … εἰς βοήθειαν
  choice: всецелой помощью
  rationale: Передаёт значение полноты или целостности, не усиливая его до «единственной» либо «совершенной» помощи.
theological_decisions:
- issue: Символическое значение телёнка и двенадцати обходов
  choice: Оставить образ без истолкования в основном тексте
  alternative: Раскрыть предполагаемое историческое или мессианское соответствие
  rationale: Греческий текст сообщает видение, но в данном стихе не объясняет символы; перевод не должен вносить конфессиональное толкование.
- issue: Текстовая неуверенность при ὁλοκλήρως
  choice: Перевести в основном тексте как «всецелой» и отметить сомнение в примечании
  alternative: Опустить наречие либо выбрать более свободное «полностью помог»
  rationale: Слово присутствует в печатном источнике, однако редакторский знак вопроса требует прозрачного указания на неуверенность чтения.
translation_notes:
  register: Современный литературный русский язык с достоинством визионерского повествования. Синтаксис слегка сглажен для естественного чтения, при этом порядок образов, число обходов и необычное выражение о помощи быкам сохранены.
