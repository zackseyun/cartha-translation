source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ εἶδον²⁶ *ὅτι [ἐκ τοῦ Ἰούδα ἐγεννήθη] †παρθένος, [ἔχουσα στολὴν βυσσίνην, καὶ ἐξ αὐτῆς] ἐγεννήθη ἀμνὸς [ἄμωμος]²⁷ *καὶ ἦν²⁸ ἐξ ἀριστερῶν αὐτοῦ ὡς λέων· καὶ πάντα τὰ θηρία ὥρμων³⁰ *κατ᾽ αὐτοῦ³¹ καὶ ἐνίκησεν αὐτὰ ὁ ἀμνός, καὶ ἀπώλεσεν *αὐτὰ εἰς καταπάτημα³².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/008.yaml
  text: And I saw that [from Judah was born] a virgin, [wearing a robe of fine linen, and from her] a [blameless] lamb was born; and on his left there was, as it were, a lion; and all the beasts were rushing against him, and the lamb overcame them and destroyed them for trampling.
translation:
  language: ru
  text: И я увидел, что [от Иуды родилась][a] дева, [облачённая в виссонную одежду, и от неё][b] родился [непорочный][c] агнец; и слева от него был словно лев. И все звери устремлялись на него, и агнец победил их и погубил их, предав на попрание.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «от Иуды родилась» в издании отмечены квадратными скобками как текстуально неуверенные.
    reason: Сохранить обозначенную в исходном издании неопределённость текста.
  - marker: b
    text: Слова «облачённая в виссонную одежду, и от неё» в издании отмечены квадратными скобками как текстуально неуверенные.
    reason: Сохранить обозначенную в исходном издании неопределённость текста.
  - marker: c
    text: Слово «непорочный» в издании отмечено квадратными скобками как текстуально неуверенное.
    reason: Сохранить обозначенную в исходном издании неопределённость текста.
  - marker: d
    text: 'Буквально: «погубил их для попрания»; выражение может обозначать результат или предназначение их погибели.'
    reason: Отразить необычную и допускающую несколько оттенков конструкцию εἰς καταπάτημα.
lexical_decisions:
- source_word: παρθένος
  choice: дева
  rationale: Передаёт девственницу в возвышенном, но понятном современному читателю регистре и соответствует образному характеру видения.
- source_word: στολὴν βυσσίνην
  choice: виссонная одежда
  rationale: Сохраняет указание на тонкую льняную ткань и традиционный библейский термин «виссон», не сводя στολή непременно к конкретному виду одеяния.
- source_word: ἀμνός
  choice: агнец
  rationale: Сохраняет сакрально-образную окраску текста; обычное «ягнёнок» было бы естественнее разговорно, но ослабило бы литературные и интертекстуальные ассоциации.
- source_word: ἐξ ἀριστερῶν αὐτοῦ
  choice: слева от него
  rationale: Прямо передаёт пространственное отношение, не приписывая льву действие, которого в греческом тексте нет.
- source_word: ὡς λέων
  choice: словно лев
  rationale: Сохраняет сравнительность и неопределённость образа, не утверждая больше, чем позволяет греческая конструкция.
- source_word: ὥρμων κατ᾽ αὐτοῦ
  choice: устремлялись на него
  rationale: Передаёт длительное или разворачивающееся нападение зверей и верно относит глагол к πάντα τὰ θηρία.
- source_word: ἀπώλεσεν αὐτὰ εἰς καταπάτημα
  choice: погубил, отдав на попрание
  rationale: Сохраняет и значение уничтожения, и целевую/результативную конструкцию εἰς καταπάτημα, не превращая её без пояснения в отдельное действие «растоптал».
theological_decisions:
- issue: Мессианская образность девы, агнца и льва
  choice: Сохранить образы без прямого отождествления их с конкретными лицами
  alternative: Добавить явное христологическое толкование
  rationale: Греческий текст представляет видение образами, но в самом стихе не даёт явного истолкования; перевод не должен устранять эту богословскую открытость.
- issue: Отношение льва к агнцу
  choice: «слева от него был словно лев»
  alternative: «слева от него устремился некто, подобный льву»
  rationale: В источнике ἦν относится к образу льва, тогда как ὥρμων относится ко всем зверям; выбранный вариант не переносит нападение зверей на льва.
- issue: Смысл εἰς καταπάτημα
  choice: «погубил, отдав на попрание»
  alternative: «погубил и растоптал»
  rationale: Альтернатива делает попрание самостоятельным действием агнца, хотя греческий оборот допускает значение результата или предназначения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской образностью. Термины «дева», «виссон» и «агнец» сохранены ради жанра видения и интертекстуальной окраски; синтаксис упрощён до ясных русских фраз без устранения текстологических скобок и смысловой неоднозначности.
