  text: Καὶ ἐκεῖ ἐβόησαν πρὸς Κύριον μέχρι οὐ συνήχθησαν *πρὸς αὐτοὺς¹⁷ οἱ ἐννέα ἔλαφοι καὶ ἐγίνοντο αὐτοὶ ὡς δώδεκα πρόβατα, καὶ μετ’ ὀλίγον χρόνον ηὐξάνοντο καὶ ἐγίνοντο ποίμνια πολλά.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/004.yaml
  text: And there they cried out to the Lord until the nine deer were gathered to them, and they themselves became like twelve sheep; and after a little time they increased and became many flocks.
translation:
  language: ru
  text: И там они взывали к Господу, пока к ним не собрались девять оленей. И сами они стали как двенадцать овец, а спустя немного времени умножились и стали многочисленными стадами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐβόησαν πρὸς Κύριον
  choice: взывали к Господу
  rationale: Передаёт усиленное обращение с мольбой и сохраняет возвышенный, но понятный современному читателю библейский регистр.
- source_word: συνήχθησαν πρὸς αὐτούς
  choice: к ним не собрались
  rationale: Сохраняет направленность действия и множественное число греческой формы, не уточняя сверх текста, кто именно подразумевается под «ними».
- source_word: ἔλαφοι
  choice: олени
  rationale: Прямое и естественное соответствие греческому названию животного.
- source_word: ὡς δώδεκα πρόβατα
  choice: как двенадцать овец
  rationale: Союз «как» сохраняет сравнительный смысл ὡς и необычный образ исходного текста, не превращая сравнение в однозначное буквальное изменение.
- source_word: ηὐξάνοντο
  choice: умножились
  rationale: В контексте превращения в многочисленные стада глагол обозначает численное возрастание; «умножились» естественно передаёт этот смысл и соответствует библейскому регистру.
- source_word: ποίμνια πολλά
  choice: многие стада
  rationale: Буквально и естественно передаёт множественность стад без добавления отсутствующего в греческом определения их вида.
theological_decisions:
- issue: Необычное превращение оленей в образ двенадцати овец
  choice: сохранить формулировку «стали как двенадцать овец»
  alternative: «превратились в двенадцать овец»
  rationale: Греческое ὡς выражает сравнение и допускает образное, видéнческое прочтение; перевод не должен устранять эту неоднозначность.
- issue: Местоименное соотнесение αὐτοί
  choice: «сами они» без явного уточнения референта
  alternative: «все они» или «олени»
  rationale: Исходный текст не называет референт повторно; сохранение местоимения не навязывает конкретного толкования участникам видения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Синтаксис разделён на два предложения для ясности, при этом последовательность и образность греческого текста сохранены.
