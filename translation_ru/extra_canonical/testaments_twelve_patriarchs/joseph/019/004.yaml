revisions:
- from: И там они взывали к Господу, пока к ним не собрались девять оленей. И сами они стали как двенадцать овец, а спустя немного времени умножились и превратились во многие стада.
  to: И там они взывали к Господу, пока к ним не собрались девять оленей. И сами они стали как двенадцать овец, а спустя немного времени умножились и стали многочисленными стадами.
  rationale: 'Сделана одна безопасная стилистико-семантическая правка: повтор греческого «становились» передан глаголом «стали», без усиления образа до однозначного физического превращения. Разделение на два предложения, местоименная неоднозначность и сравнительный характер образа сохранены. Критический знак ¹⁷ в предоставленном греческом тексте не снабжён содержанием примечания, поэтому переводческая сноска не создаётся и не реконструируется.'
