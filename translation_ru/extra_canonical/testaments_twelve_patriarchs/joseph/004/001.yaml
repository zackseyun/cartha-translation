base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/001.yaml
  text: And when I understood, I was grieved unto death. But after she had gone out, I came to myself and mourned over her for many days, because I knew her deceit and her delusion.
translation:
  language: ru
  text: Осознав это, я опечалился до смерти. После того как она вышла, я пришёл в себя и много дней скорбел о ней, потому что узнал её коварство и заблуждение[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «обман». Греческое слово может означать как заблуждение, так и введение в заблуждение.'
    reason: πλάνη допускает как субъективный смысл «заблуждение», так и объективный «обман»; контекст не требует устранять эту неоднозначность.
lexical_decisions:
- source_word: νοήσας
  choice: поняв
  rationale: Передаёт осознанное понимание происходящего естественным русским деепричастием.
- source_word: ἐλυπήθην ἕως θανάτου
  choice: опечалился до смерти
  rationale: Сохраняет сильную исходную формулировку и её библейскую выразительность без ослабления смысла.
- source_word: ἦλθον εἰς ἐμαυτόν
  choice: пришёл в себя
  rationale: Точный и естественный русский эквивалент идиомы.
- source_word: ἐπένθησα περὶ αὐτῆς
  choice: скорбел о ней
  rationale: Предлог περὶ с родительным допускает направленность скорби на неё; формулировка сохраняет сочувственный оттенок и не заменяет его скорбью лишь о случившемся.
- source_word: δόλον
  choice: коварство
  rationale: Передаёт намеренную хитрость или злой умысел, сохраняя отличие от следующего πλάνη.
- source_word: πλάνην
  choice: заблуждение
  rationale: Сохраняет возможный смысл ошибочности или самообмана и не сливает слово с δόλος.
