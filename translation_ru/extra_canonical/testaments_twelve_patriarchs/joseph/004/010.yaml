source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἐγὼ δὲ⁴⁵ προσετιθέμην *νηστείαν καὶ⁴⁶ προσευχήν, ὅπως ῥύσεταί⁴⁷ με ὁ⁴⁸ Κύριος ἀπ᾽ αὐτῆς⁴⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/010.yaml
  text: And I added fasting and prayer, so that the Lord might rescue me from her.
translation:
  language: ru
  text: А я прибавлял к этому пост и молитву, чтобы Господь избавил меня от неё.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσετιθέμην
  choice: прибавлял к этому
  rationale: Имперфект передаёт продолжающееся или повторявшееся действие; выражение «к этому» естественно обозначает добавление поста и молитвы к прежним усилиям Иосифа.
- source_word: νηστείαν καὶ προσευχήν
  choice: пост и молитву
  rationale: Прямые и привычные русские соответствия, сохраняющие религиозный смысл исходных существительных.
- source_word: ὅπως ῥύσεταί με
  choice: чтобы … избавил меня
  rationale: Передаёт целевое значение ὅπως и смысл избавления или спасения от угрожающего воздействия.
- source_word: ἀπ᾽ αὐτῆς
  choice: от неё
  rationale: Сохраняет женское местоимение и отсылку к женщине, не добавляя отсутствующего в стихе пояснения.
theological_decisions:
- issue: Соотношение человеческой аскезы и Божьего избавления
  choice: 'Сохранена цель: Иосиф прибавляет пост и молитву, чтобы Господь избавил его.'
  alternative: Передать так, будто пост и молитва сами обеспечивают избавление.
  rationale: Греческий текст называет Господа действующим избавителем и не объясняет механически, каким образом пост и молитва связаны с избавлением.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Имперфект προσετιθέμην передан несовершенным видом «прибавлял», а не разовым «прибавил».
