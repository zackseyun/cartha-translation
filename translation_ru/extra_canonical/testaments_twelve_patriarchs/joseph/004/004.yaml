source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*᾿Εδόξαζε ⌜γάρ⌝¹¹ με ὡς σώφρονα *φανερῶς, καὶ ἐν κρυφῇ¹² ἔλεγέ μοι· Μὴ φοβηθῇς τὸν ἄνδρα μου· καὶ γὰρ πέπεισται¹⁴ περὶ τῆς σωφροσύνης σου¹⁵· ὅτι κἂν *τις αὐτῷ εἴπῃ¹⁶ περὶ ἡμῶν, *οὐ πιστεύσει¹⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/004.yaml
  text: For she openly extolled me as self-controlled, but in secret she said to me, “Do not be afraid of my husband; for he is persuaded about your purity, and even if someone should tell him about us, he will not believe it.”
translation:
  language: ru
  text: 'Ведь при всех она хвалила меня за целомудрие, а тайно говорила мне: «Не бойся моего мужа: он уверен в твоём целомудрии, и даже если кто-нибудь расскажет ему о нас, он не поверит».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδόξαζε
  choice: хвалила
  rationale: Передаёт публичное одобрение и возвеличивание Иосифа естественным современным русским глаголом.
- source_word: σώφρονα / σωφροσύνης
  choice: за целомудрие / в твоём целомудрии
  rationale: В данном контексте домогательств речь прежде всего о нравственной и половой чистоте; единый корень в русском сохранён повтором слова «целомудрие».
- source_word: φανερῶς
  choice: при всех
  rationale: Естественно выражает открытый, публичный характер похвалы и создаёт ясный контраст с «наедине».
- source_word: ἐν κρυφῇ
  choice: наедине
  rationale: В контексте тайной речи передаёт скрытость встречи идиоматичнее буквального «втайне».
- source_word: πέπεισται
  choice: уверен
  rationale: Перфект указывает на сложившуюся убеждённость мужа в целомудрии Иосифа.
- source_word: περὶ ἡμῶν
  choice: о нас
  rationale: Сохраняет намеренную недосказанность обвинения или слуха об их предполагаемой связи.
- source_word: οὐ πιστεύσει
  choice: не поверит
  rationale: Прямо и естественно передаёт будущее время и отказ мужа поверить сообщению.
theological_decisions:
- issue: Нравственное значение σωφροσύνη
  choice: целомудрие
  alternative: самообладание / благоразумие
  rationale: Хотя слово может обозначать самообладание или рассудительность шире, эпизод связан с сексуальным искушением, поэтому «целомудрие» здесь контекстуально точнее без добавления конфессионального толкования.
- issue: Неопределённость выражения «о нас»
  choice: сохранить формулировку «о нас»
  alternative: о нашей связи / о том, что между нами
  rationale: Греческий текст не уточняет содержание возможного сообщения; конкретизация незаметно разрешила бы сохранённую источником двусмысленность.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Контраст между публичной похвалой и тайным соблазнением передан парой «при всех — наедине». Синтаксис прямой речи оставлен ясным и естественным.
