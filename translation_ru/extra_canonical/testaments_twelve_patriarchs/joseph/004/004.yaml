  source_fidelity: 'Греческое ἐν κρυφῇ означает «тайно, скрытно» и не обязательно подразумевает разговор с глазу на глаз. Поэтому «наедине» неоправданно сужает обстоятельство речи. Остальные основные соответствия верны: φανερῶς передано как «при всех», σώφρων/σωφροσύνη в данном контексте обоснованно передано через «целомудрие», а намеренно неопределённое περὶ ἡμῶν сохранено как «о нас».'
  naturalness: Текст звучит естественно в современном литературном русском. Замена «наедине» на «тайно» одновременно точнее и стилистически не нарушает контраста с публичной похвалой.
  terminology: «Целомудрие» уместно в контексте сексуального искушения и последовательно отражает σώφρονα и σωφροσύνης. «Уверен в твоём целомудрии» естественно передаёт πέπεισται περὶ τῆς σωφροσύνης σου.
