    issue: «Страсть» вместо «желание»
    rationale: «Страсть» сужает и усиливает значение ἐπιθυμία, добавляя эмоционально-нравственную окраску. Контекст может подразумевать сексуальное влечение, но сам греческий текст называет его просто «желанием».
