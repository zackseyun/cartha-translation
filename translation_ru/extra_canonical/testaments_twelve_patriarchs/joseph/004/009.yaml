lexical_decisions:
- source_word: ἀντεφιλονείκει
  choice: продолжала настаивать
  rationale: Глагол передаёт упорное противодействие или настойчивое добивание своего; в данном контексте естественное русское выражение сохраняет длительность, заданную имперфектом.
- source_word: πληρῶσαι
  choice: удовлетворить
  rationale: В сочетании с ἐπιθυμία означает довести желание до осуществления; «удовлетворить» звучит естественно и не добавляет деталей.
- source_word: ἐπιθυμίαν
  choice: страсть
  rationale: В контексте настойчивого влечения слово обозначает сильное желание; «страсть» сохраняет интенсивность и отрицательную контекстуальную окраску.
