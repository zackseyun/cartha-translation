  terminology: «Идолы» и «отступить от идолов» удачно сохраняют лексику и повтор εἴδωλα / εἰδώλων. «Ходить перед Господом» является уместной передачей образного будущего πορευσόμεθα и не вносит отсутствующего в данном тексте упоминания закона.
