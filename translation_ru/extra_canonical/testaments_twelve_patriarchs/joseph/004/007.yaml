  source_fidelity: 'В целом перевод точно передаёт условную конструкцию, повтор «идолов», отказ мужа от идолов и финальное πορευσόμεθα ἐνώπιον Κυρίου σου. Обращение συγγενοῦς μου сохранено; грамматическая трудность греческой формы не должна устраняться добавлением толкования. Однако «то и я» придаёт κἀγώ оттенок ответного соответствия, которого в оригинале нет: это простое «и я».'
