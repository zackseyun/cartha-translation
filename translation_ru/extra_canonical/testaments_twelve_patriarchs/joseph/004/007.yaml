  text: And she says to me, “If you want me to leave the idols, my kinsman, I will persuade my husband to withdraw from the idols, and we will walk before your Lord.”
translation:
  language: ru
  text: 'И она говорит мне: «Если ты хочешь, чтобы я оставила идолов, родич мой, я уговорю своего мужа отступить от идолов, и мы будем ходить перед твоим Господом».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συγγενοῦς μου
  choice: мой родич
  rationale: Сохранено обращение, буквально обозначающее родственника или соплеменника; форма исходного текста грамматически трудна, но контекст поддерживает звательное употребление.
- source_word: ἀποστῆναι ἀπὸ τῶν εἰδώλων
  choice: отступить от идолов
  rationale: Передаёт отделение и отказ от идолопоклонства, сохраняя повтор слова «идолы» в греческом тексте.
- source_word: πορευσόμεθα ἐνώπιον Κυρίου σου
  choice: мы будем ходить пред твоим Господом
  rationale: Библейская формула «ходить пред» естественно передаёт образ жизни в присутствии Бога; «пред» сохраняет dignified biblical register without obscuring meaning.
theological_decisions:
- issue: Значение финальной фразы ἐνώπιον Κυρίου σου
  choice: мы будем ходить пред твоим Господом
  alternative: мы пойдём пред твоим Господом
  rationale: Будущее πορευσόμεθα может обозначать как движение, так и образ жизни. Контекст отказа от идолов допускает этическое «ходить пред Господом», однако дополнение «по закону твоего Господа», встречающееся в иной редакции, отсутствует в предоставленном греческом тексте и не внесено.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис сохранён близким к греческому, а обращение «мой родич» оставлено ради текстовой точности.
