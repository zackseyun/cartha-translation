    rationale: Форма ἔλεγον действительно омонимична, но при отсутствии текстового варианта предпочтение, принятое в аудиторской цепочке, следует отразить в тексте; альтернативное прочтение можно сохранить сноской.
  - severity: medium
    issue: «Надеясь, что» добавляет психологическое состояние говорящего.
    rationale: εἰ ἄρα выражает неуверенную возможность или ожидаемый результат, но не называет надежду как внутреннее состояние; русское «не отвратится ли» передаёт это точнее.
