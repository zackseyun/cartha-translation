source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἔλεγον *πρὸς αὐτὴν⁶¹ ῥήματα ὑψίστου, εἰ ἄρα ἐπιστρέψει⁶² ἀπὸ τῆς ἐπιθυμίας⁶³ τῆς πονηρᾶς⁶⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/002.yaml
  text: And I would speak to her words of the Most High, whether perhaps she might turn back from the evil desire.
translation:
  language: ru
  text: 'И они говорили[a] ей слова Всевышнего: не отвратится ли она от злого желания.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая форма может также означать: «я говорил».'
    reason: 'Форма ἔλεγον грамматически неоднозначна: это может быть 1-е лицо единственного числа или 3-е лицо множественного числа. Основной текст следует множественному числу, принятому в английской аудиторской версии, но сохраняет альтернативное прочтение.'
lexical_decisions:
- source_word: ἔλεγον
  choice: я говорил
  rationale: Форма имперфекта может быть понята как 1-е лицо единственного числа или 3-е лицо множественного числа; повествовательный контекст речи Иосифа поддерживает первое лицо, а имперфект передаёт продолжавшееся или повторявшееся действие.
- source_word: ῥήματα ὑψίστου
  choice: слова Всевышнего
  rationale: Сохранено прямое и традиционно понятное обозначение речи, исходящей от Бога.
- source_word: εἰ ἄρα ἐπιστρέψει
  choice: надеясь, что, быть может, она отвратится
  rationale: Сочетание εἰ ἄρα выражает неуверенную надежду или возможность; по-русски её естественно передаёт оборот «надеясь, что, быть может», без утверждения результата.
- source_word: ἀπὸ τῆς ἐπιθυμίας τῆς πονηρᾶς
  choice: от злого желания
  rationale: Передано буквально по смыслу; «отвратится от» естественно сочетается с нравственно порочным желанием и сохраняет образ поворота прочь от него.
theological_decisions:
- issue: Источник «слов Всевышнего»
  choice: слова Всевышнего
  alternative: слова о Всевышнем
  rationale: Греческий родительный ὑψίστου естественнее понимать как указание на принадлежность или источник слов; текст не уточняет их содержание, поэтому перевод не сужает смысл до слов лишь «о» Боге.
- issue: Характер возможного обращения женщины
  choice: отвратится от злого желания
  alternative: раскается в своём злом желании
  rationale: Глагол ἐπιστρέφω с ἀπό обозначает поворот прочь от чего-либо; «раскается» внесло бы более специальную богословскую терминологию, которой здесь прямо нет.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Синтаксис сделан естественным для русского читателя; неопределённость εἰ ἄρα сохранена, а грамматическая неоднозначность сказуемого отмечена сноской.
