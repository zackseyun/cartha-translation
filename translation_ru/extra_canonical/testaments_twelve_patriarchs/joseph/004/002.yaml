- from: И я говорил[a] ей слова Всевышнего, надеясь, что, быть может, она отвратится от злого желания.
  to: 'И они говорили[a] ей слова Всевышнего: не отвратится ли она от злого желания.'
  rationale: Исправлен субъект глагола в соответствии с английской аудиторской цепочкой при сохранении реальной грамматической альтернативы в сноске. Удалено добавленное «надеясь»; условительно-вопросительный оборот «не отвратится ли» точнее передаёт εἰ ἄρα и сохраняет неопределённость результата.
  reviewer_model: gpt-5.6-terra
