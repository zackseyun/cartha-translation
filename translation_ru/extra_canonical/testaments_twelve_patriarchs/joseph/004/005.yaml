id: T12P.JOS.4.5
reference: Testament of Joseph 4:5
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*᾿Εν τούτοις πᾶσιν¹⁸ ἐγὼ¹⁹ *χαμοκοιτῶν ἐδεόμην τοῦ Θεοῦ²⁰ ὅπως *ῥύσεταί με²¹ ἐκ *τῆς δολιότητος αὐτῆς²².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/005.yaml
  text: In all these things I, lying on the ground, kept begging God that he would rescue me from her deceit.
translation:
  language: ru
  text: Во всём этом я, лёжа на земле, не переставал молить Бога, чтобы Он избавил меня от её коварства.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτοις πᾶσιν
  choice: во всём этом
  rationale: Естественно передаёт охват всех описываемых обстоятельств, не уточняя сверх греческого текста их характер или продолжительность.
- source_word: χαμοκοιτῶν
  choice: лёжа на земле
  rationale: Причастие означает пребывание или сон на земле; нейтральное «лёжа на земле» сохраняет образ и не вводит прямо не выраженное указание на сон.
- source_word: ἐδεόμην
  choice: не переставал молить
  rationale: Имперфект обозначает продолжавшееся или повторявшееся действие; такая передача естественно выражает настойчивую длительную мольбу.
- source_word: ῥύσεταί με
  choice: избавил меня
  rationale: Глагол ῥύομαι означает спасать или избавлять от опасности либо власти чего-либо; «избавил» хорошо сочетается с последующим указанием на коварство.
- source_word: τῆς δολιότητος αὐτῆς
  choice: её коварства
  rationale: δολιότης обозначает лживость, вероломство или коварный умысел; «коварство» сохраняет нравственную и практическую сторону угрозы.
theological_decisions:
- issue: Характер ожидаемого Божьего действия
  choice: чтобы Он избавил меня
  alternative: чтобы Он спас меня
  rationale: Выбрано «избавил», поскольку речь идёт об освобождении от конкретного коварства; при этом не добавляется утверждение о способе или моменте Божьего вмешательства.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного и молитвенного контекста. Синтаксис сохраняет подчёркнутое греческое ἐγώ через явное «я», а прописное «Он» употреблено как принятая в русском религиозном письме форма почтительного местоимения.
