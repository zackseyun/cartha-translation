source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἐγὼ δὲ πρὸς αὐτὴν ἔλεγον³⁸ *ὅτι οὐχ³⁹ ἐν ἀκαθαρσίᾳ θέλει⁴⁰ Κύριος τοὺς σεβομένους αὐτόν, οὔτε⁴¹ *τοῖς μοιχεύουσιν εὐδοκεῖ⁴², ⌈ἀλλὰ τοῖς ἐν καθαρᾷ καρδίᾳ καὶ στόμασιν ἀμίαντοις αὐτῷ προσερχομένοις⁴³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/008.yaml
  text: But I said to her, “The Lord does not will that those who revere him should be in uncleanness, nor does he delight in adulterers, but in those who draw near to him with a pure heart and undefiled lips.”
translation:
  language: ru
  text: 'Но я говорил ей: «Господь не желает, чтобы почитающие Его пребывали в нечистоте, и не благоволит к прелюбодеям, но благоволит тем, кто приближается к Нему с чистым сердцем и неосквернёнными устами».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἀκαθαρσίᾳ
  choice: в нечистоте
  rationale: Сохраняет нравственно-религиозную широту греческого выражения, не сводя его исключительно к телесной или ритуальной нечистоте.
- source_word: τοὺς σεβομένους αὐτόν
  choice: почитающие Его
  rationale: Передаёт благоговейное отношение к Богу естественным современным русским выражением.
- source_word: τοῖς μοιχεύουσιν
  choice: к прелюбодеям
  rationale: В контексте соблазнения речь идёт о нарушении супружеской верности; существительное по-русски естественно передаёт греческое субстантивированное причастие.
- source_word: εὐδοκεῖ
  choice: благоволит
  rationale: Сохраняет значение одобрения и благосклонности и соответствует возвышенному, но понятному библейскому регистру.
- source_word: τοῖς ... αὐτῷ προσερχομένοις
  choice: к тем, кто приближается к Нему
  rationale: Сохраняет образ приближения к Богу и не конкретизирует его как молитву или богослужение.
- source_word: ἐν καθαρᾷ καρδίᾳ καὶ στόμασιν ἀμίαντοις
  choice: с чистым сердцем и неосквернёнными устами
  rationale: Близко воспроизводит параллельные образы внутренней чистоты и чистоты речи; русский единственный падеж для «сердца» и множественное число «уст» следуют естественной норме.
theological_decisions:
- issue: Связь Божьего благоволения с нравственной чистотой
  choice: Сохранено прямое противопоставление нечистоты и прелюбодеяния тем, кто приближается к Богу в чистоте.
  alternative: Ослабить утверждение до общего нравственного совета.
  rationale: Греческий текст прямо говорит о воле и благоволении Господа, поэтому его богословское напряжение не следует сглаживать.
- issue: Значение «приближаться к Богу»
  choice: Оставлен широкий образ «приближается к Нему».
  alternative: Истолковать как «молится Ему» или «поклоняется Ему».
  rationale: Источник не уточняет форму приближения; перевод сохраняет эту содержательную открытость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой. Синтаксис сохраняет трёхчастное противопоставление оригинала, оставаясь ясным для обычного читателя.
