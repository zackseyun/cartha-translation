revisions:
- from: Итак, она часто льстила мне словами, словно святому мужу, и с коварством хвалила моё целомудрие перед своим мужем, желая наедине привести меня к падению.
  to: Итак, она часто льстила мне словами, как святому человеку, и коварно, в речах, хвалила моё целомудрие перед своим мужем, желая, когда мы оставались наедине, подставить мне подножку.
  rationale: Исправление явно передаёт оба словесных оборота (ἐν λόγοις и διὰ ῥημάτων), сохраняет «целомудрие» для σωφροσύνη и заменяет обобщённое «привести к падению» образом «подставить подножку» для ὑποσκελίσαι. Уточнение «когда мы оставались наедине» передаёт обстоятельство κατὰ μόνας без доктринальной или сюжетной конкретизации.
  reviewer_model: gpt-5.6-terra
