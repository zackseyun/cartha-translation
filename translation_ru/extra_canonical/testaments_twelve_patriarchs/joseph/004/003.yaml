source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Πολλάκις οὖν¹ *ὡς ἁγίῳ ἀνδρὶ ἐν λόγοις² ἐκολάκευέ³ με⁴ καὶ⁵ μετὰ δόλου διὰ⁶ ῥημάτων ἐπαίνει⁷ *τὴν σωφροσύνην⁸ μου ἐνώπιον τοῦ ἀνδρὸς αὐτῆς⁹, βουλομένη *κατὰ μόνας¹⁰ ὑποσκελίσαι με.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/003.yaml
  text: So then, many times, as to a holy man, she flattered me with words; and with deceit she praised my self-control before her husband, wishing to trip me up when we were alone.
translation:
  language: ru
  text: Итак, она часто льстила мне словами, как святому человеку, и коварно, в речах, хвалила моё целомудрие перед своим мужем, желая, когда мы оставались наедине, подставить мне подножку.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ἁγίῳ ἀνδρὶ
  choice: словно святому мужу
  rationale: Сохраняет сравнительный оттенок ὡς и достоинство выражения, не утверждая прямо, что говорящая искренне признавала Иосифа святым.
- source_word: ἐκολάκευέ με
  choice: льстила мне
  rationale: Прямо передаёт неодобрительный смысл глагола κολακεύω.
- source_word: τὴν σωφροσύνην μου
  choice: моё целомудрие
  rationale: В данном контексте σωφροσύνη обозначает прежде всего половую чистоту и нравственную сдержанность; «целомудрие» естественно передаёт оба аспекта.
- source_word: κατὰ μόνας
  choice: наедине
  rationale: Идиоматично передаёт обстоятельство пребывания без посторонних, не уточняя субъект сверх греческого текста.
- source_word: ὑποσκελίσαι με
  choice: привести меня к падению
  rationale: Сохраняет метафору «подставить подножку, заставить оступиться» и её нравственный смысл в контексте искушения.
theological_decisions:
- issue: Характер святости Иосифа в словах женщины
  choice: словно святому мужу
  alternative: как святому мужу
  rationale: «Словно» сохраняет возможную неискренность её обращения и не превращает льстивую речь в безусловное повествовательное утверждение.
- issue: Смысл предполагаемого «падения»
  choice: не уточнять вид падения
  alternative: соблазнить меня / склонить меня ко греху
  rationale: Образный глагол допускает более широкий смысл — заставить оступиться или погубить нравственно; конкретизация сняла бы напряжение оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной речи. Синтаксис слегка упрощён для ясности, но причинно-риторическая последовательность и образ нравственного падения сохранены.
