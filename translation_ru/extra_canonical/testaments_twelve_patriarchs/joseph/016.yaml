  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016.yaml
  text: 'But Memphis said to her husband[a], “I hear that they are selling the young man.”


    2 So she immediately sent a eunuch to the Ishmaelites, asking that I be sold to her.

    3 But the eunuch, not wishing to buy me, withdrew after testing them, and reported to his mistress that they were asking a high price for the boy.

    4 Then she sent another eunuch, saying, “Even if they ask two minas, pay it. Do not spare the gold. Only buy the boy and bring him to me.”

    5 So the eunuch came and gave them eighty pieces of gold and took me; but to the Egyptian woman he said, “I have given a hundred.”

    6 But I, knowing it, kept silent[b][c], so that'
translation:
  language: ru
  text: '**Завещание Иосифа, 16**


    1 Мемфис сказала своему мужу: «Купи этого юношу, потому что я слышала, что его продают».


    2 И тотчас она послала евнуха к измаильтянам, прося, чтобы меня продали ей.


    3 Но евнух, не желая покупать меня, ушёл, разузнав их условия, и сообщил своей госпоже, что за юношу просят высокую цену.


    4 Тогда она послала другого евнуха со словами: «Даже если они попросят две мины[a], заплатите. Не жалейте золота. Только купи юношу и приведи его ко мне».


    5 Евнух пришёл, дал им восемьдесят золотых[b] и забрал меня, а египтянке сказал: «Я отдал сто».


    6 Я же, зная об этом, промолчал, чтобы евнух не был пристыжен.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Мина — древняя мера веса и денежная единица; здесь сохранено греческое название без пересчёта в современные деньги.
    reason: cultural_note
  - marker: b
    text: 'Буквально: «восемьдесят золотых»; точный вид или номинал денег в данном греческом тексте не указан. То же относится к последующему числу «сто».'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μεμφὶς
  choice: Мемфис
  rationale: Передано транслитерацией как личное имя женщины, как того требует контекст; название не заменено толкованием.
- source_word: νεανίαν / παιδός / παῖδα
  choice: юноша
  rationale: В контексте продажи Иосифа обозначает молодого человека; единообразное «юноша» естественно по-русски и сохраняет указание на возраст.
- source_word: εὐνοῦχος
  choice: евнух
  rationale: Сохранено прямое значение греческого слова, а не более общее «придворный» или «служитель».
- source_word: αἰτοῦσά με εἰς διάπρασιν
  choice: прося, чтобы меня продали ей
  rationale: Естественно выражает коммерческий смысл просьбы и направление предполагаемой продажи.
- source_word: πειράσας αὐτούς
  choice: разузнав их условия
  rationale: В торговом контексте причастие указывает на предварительное выяснение требований продавцов, а не на нравственное искушение.
- source_word: δεσποίνῃ
  choice: своей госпоже
  rationale: Передаёт властное положение женщины в доме и отношение евнуха к ней.
- source_word: πολλὴν τιμήν
  choice: высокую цену
  rationale: Контекстуальное и идиоматичное выражение цены при покупке.
- source_word: μνᾶς
  choice: мины
  rationale: Сохранено древнее название меры веса и денежной единицы без неточного пересчёта в современные деньги.
- source_word: μὴ φείσασθε χρυσίου
  choice: Не жалейте золота
  rationale: Передаёт повеление не скупиться и сохраняет конкретный образ золота.
- source_word: χρυσοῦς
  choice: золотых
  rationale: Субстантивированное обозначение сохранено без уточнения «монеты», поскольку точный номинал в данном греческом тексте не назван.
- source_word: ἀνελάβετό με
  choice: забрал меня
  rationale: В контексте совершившейся продажи естественно обозначает принятие купленного Иосифа во владение и сопровождение.
- source_word: ἐσιώπησα
  choice: промолчал
  rationale: Кратко и естественно передаёт сознательное решение Иосифа ничего не говорить.
- source_word: ἵνα μὴ αἰσχυνθῇ
  choice: чтобы евнух не был пристыжен
  rationale: Пассивная формулировка сохраняет возможность как публичного посрамления, так и переживания стыда, не сводя смысл только к одному из них.
theological_decisions:
- issue: Язык продажи и зависимого положения Иосифа
  choice: Прямо сохранены слова «продают», «купить», «цена», «забрал меня»
  alternative: Смягчить повествование до найма или поступления на домашнюю службу
  rationale: Греческий текст последовательно описывает коммерческую продажу человека; смягчение исказило бы повествование и его нравственное напряжение.
- issue: Мотив молчания Иосифа
  choice: 'Передана заявленная цель: не допустить посрамления евнуха'
  alternative: Добавить нравственную оценку обмана евнуха или объяснить молчание милосердием
  rationale: Текст сообщает поступок и цель, но не даёт развёрнутой богословской оценки; перевод не добавляет её.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным тоном. Торговая и социальная лексика передана прямо. В 16:4 сохранена смена числа в повелениях («заплатите» — «купи»), присутствующая в греческом тексте; она может отражать сложную текстовую историю стиха и потому не была молча унифицирована.
