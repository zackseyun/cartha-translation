  text: Ἐφυλακίσθην⁶, ἐτύφθην⁷, ⸢ἐξεμυκτηρίσθην⸣⁸, καὶ ἔδωκέ με⁹ ὁ¹⁰ Κύριος¹¹ εἰς οἰκτιρμοὺς ἐνώπιον τοῦ δεσμοφύλακος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/003.yaml
  text: I was imprisoned, I was beaten, I was mocked, and the Lord gave me compassion in the sight of the jailer.
translation:
  language: ru
  text: Меня заключили в темницу, били и осмеивали, и Господь внушил темничному стражу сострадание ко мне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐφυλακίσθην
  choice: Меня заключили в темницу
  rationale: Пассивная форма сохранена; «темница» соответствует контексту заключения и выдерживает достоинство повествования.
- source_word: ἐτύφθην
  choice: били
  rationale: Передаёт пассивный аорист τύπτω естественным современным русским выражением без неоправданного уточнения орудия или тяжести побоев.
- source_word: ἐξεμυκτηρίσθην
  choice: осмеивали
  rationale: Глагол обозначает насмешку, издевательство или глумление; «осмеивали» ясно и непосредственно передаёт смысл.
- source_word: ἔδωκέ με ὁ Κύριος εἰς οἰκτιρμοὺς ἐνώπιον τοῦ δεσμοφύλακος
  choice: Господь пробудил во мне сострадание в глазах темничного стража
  rationale: Греческая конструкция буквально связывает Иосифа с «состраданием/милосердием» перед стражем. Русская формулировка стремится сохранить οἰκτιρμούς, хотя подразумеваемый носитель сострадания в оригинале выражен не вполне явно.
- source_word: δεσμοφύλακος
  choice: темничного стража
  rationale: Точно передаёт должность человека, охраняющего узников; выражение естественно для данного историко-литературного регистра.
theological_decisions:
- issue: Действие Господа в отношении сострадания стража
  choice: Господь пробудил во мне сострадание в глазах темничного стража
  alternative: Господь даровал мне милость перед темничным стражем
  rationale: 'Не следует сводить οἰκτιρμούς к общему «расположению» или «благоволению»: существительное прямо означает сострадание, милосердие. При этом конструкция допускает понимание, что Господь сделал Иосифа предметом сострадания стража.'
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Однородные страдательные действия переданы компактно; союз «но» подчёркивает смысловой поворот от страданий к Божьему содействию, хотя в греческом стоит καί.
