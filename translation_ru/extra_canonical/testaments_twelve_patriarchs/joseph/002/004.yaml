base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/004.yaml
  text: For the Lord does not abandon those who fear him, not in darkness, or chains, or afflictions, or distress.
translation:
  language: ru
  text: Ибо Господь не оставляет боящихся Его — ни во тьме, ни в оковах, ни в скорбях, ни в нужде.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγκαταλείπει
  choice: не оставляет
  rationale: Передаёт значение «покидать, оставлять без помощи» естественным и привычным русским выражением.
- source_word: τοὺς φοβουμένους αὐτόν
  choice: боящихся Его
  rationale: Сохраняет традиционный библейский оборот о благоговейном страхе перед Господом, не сужая его до одного лишь почтения.
- source_word: δεσμοῖς
  choice: оковах
  rationale: В данном перечне испытаний слово естественно обозначает узы или заключение; «оковы» сохраняют конкретность и возвышенный регистр.
- source_word: θλίψεσιν
  choice: скорбях
  rationale: Передаёт страдания и притеснения широким библейским словом, не уточняя их характер без основания в тексте.
- source_word: ἀνάγκαις
  choice: бедствиях
  rationale: В контексте испытаний передаёт вынужденные, стеснённые и тяжёлые обстоятельства, при этом не дублирует полностью «скорби».
theological_decisions:
- issue: Объём обещания о том, что Господь не оставляет боящихся Его
  choice: Сохранена последовательность «ни во тьме, ни в оковах, ни в скорбях, ни в бедствиях» как указание на Божье присутствие среди испытаний.
  alternative: Понять фразу как обещание полностью избавлять боящихся Бога от перечисленных испытаний.
  rationale: Греческая конструкция утверждает, что Господь не покидает их в этих обстоятельствах; она не требует вывода, будто они никогда в них не окажутся.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Тире помогает естественно присоединить греческий ряд обстоятельств к основному утверждению; повтор «ни» ясно передаёт отрицательную координацию.
