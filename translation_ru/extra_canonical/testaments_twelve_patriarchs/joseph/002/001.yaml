  text: And this man, the captain of Pharaoh's guard, entrusted his house to me.
translation:
  language: ru
  text: И этот человек, начальник стражи фараона, доверил мне свой дом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρχιμάγειρος
  choice: начальник стражи
  rationale: В данном повествовательном контексте титул обозначает высокопоставленного служителя фараона, традиционно отождествляемого с начальником телохранителей или стражи; буквальное «главный повар» здесь вводило бы современного читателя в заблуждение.
- source_word: ἐπίστευσέ μοι
  choice: доверил мне
  rationale: Передаёт значение вверения кому-либо управления или попечения.
- source_word: τὸν οἶκον αὐτοῦ
  choice: свой дом
  rationale: '«Дом» сохраняет широту греческого οἶκος: это может включать домашнее хозяйство, имущество и людей дома, а не только здание.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; фраза краткая и повествовательная. Местоименное «этот человек» сохраняет указательный оборот оригинала, а титул передан функционально и понятно читателю.
