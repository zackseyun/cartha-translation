base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/002.yaml
  text: And I struggled against a shameless woman who kept pressing me to transgress with her, but the God of my father rescued me from a burning flame.
translation:
  language: ru
  text: И я боролся с бесстыдной женщиной, которая настойчиво склоняла меня нарушить закон вместе с нею, но Бог моего отца избавил меня от пылающего пламени.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγωνισάμην
  choice: боролся
  rationale: Передаёт напряжённое активное сопротивление без излишнего уточнения характера борьбы.
- source_word: γυναῖκα ἀναιδῆ
  choice: бесстыдной женщиной
  rationale: Прямо и естественно передаёт нравственную характеристику ἀναιδής в современном литературном русском.
- source_word: ἐπείγουσάν με
  choice: настойчиво склоняла меня
  rationale: Передаёт продолжительное настойчивое давление; буквальное «торопила/понуждала» здесь звучало бы менее естественно.
- source_word: παρανομεῖν μετʼ αὐτῆς
  choice: согрешить с ней
  rationale: В контексте домогательств выражение указывает на совместное беззаконное, сексуально окрашенное действие; русский вариант сохраняет нравственный смысл и естественность.
- source_word: ἐρρύσατό με
  choice: избавил меня
  rationale: Точно передаёт спасительное избавление из опасности.
- source_word: ἐκ φλογὸς καιομένης
  choice: от пылающего пламени
  rationale: Сохраняет образ огня; «пылающее пламя» естественнее буквального «горящего пламени».
theological_decisions:
- issue: τοῦ πατρός μου при Θεός
  choice: Бог моего отца
  alternative: Бог отца моего
  rationale: Сохранено указание на Бога отца Иосифа без добавления богословского толкования; выбран современный порядок слов.
- issue: Образ пылающего пламени
  choice: сохранён без объяснения
  alternative: истолковать как пламя страсти или наказания
  rationale: Греческий текст допускает образное прочтение, но не раскрывает образ однозначно, поэтому перевод не разрешает эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного повествования. Синтаксис ясен для широкого читателя; образность оригинала сохранена без конфессиональных добавлений.
