revisions:
- from: И я боролся с бесстыдной женщиной, которая настойчиво склоняла меня согрешить с ней, но Бог моего отца избавил меня от пылающего пламени.
  to: И я боролся с бесстыдной женщиной, которая настойчиво склоняла меня нарушить закон вместе с нею, но Бог моего отца избавил меня от пылающего пламени.
  rationale: 'Заменено только «согрешить с ней» на «нарушить закон вместе с нею», чтобы точнее передать παρανομεῖν μετʼ αὐτῆς и сохранить смысловую неопределённость оригинала. Сноски не добавлены: в предоставленном материале нет содержания критических примечаний, соответствующих надстрочным знакам исходного издания, поэтому создавать или переносить их без данных нельзя.'
