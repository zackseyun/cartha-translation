source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Οὐ γὰρ ὡς ἄνθρωπος ἐπαισχύνεται ὁ Θεός, Οὔτε¹⁶ ὡς υἱὸς ἀνθρώπου δειλιᾷ, Οὔτε¹⁷ ὡς γηγενὴς [ἀσθενεῖ ἢ]¹⁸ πτοεῖται¹⁹,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/005.yaml
  text: For God is not ashamed like a man, nor does he grow fearful like a son of man, nor, like one born of earth, [does he become weak or] is he terrified.
translation:
  language: ru
  text: Ибо Бог не стыдится, как человек, не робеет, как сын человеческий, и не [слабеет или] страшится, как рождённый от земли.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «слабеет или» соответствуют греческому выражению, которое издатель заключает в квадратные скобки; скобки сохранены в переводе как обозначение текстологической неопределённости.
    reason: Объясняет сохранение квадратных скобок и их объём, не изменяя смысла основного текста.
lexical_decisions:
- source_word: ἐπαισχύνεται
  choice: стыдится
  rationale: Прямо передаёт значение глагола «стыдиться» и сохраняет сопоставление Бога с человеком.
- source_word: δειλιᾷ
  choice: робеет
  rationale: Передаёт страх и утрату мужества; естественнее в данном параллелизме, чем описательное «становится боязливым».
- source_word: γηγενής
  choice: рождённый от земли
  rationale: Сохраняет буквальный образ греческого сложного слова и антропологическое противопоставление, не сводя его просто к «земному человеку».
- source_word: ἀσθενεῖ
  choice: слабеет
  rationale: Передаёт физическую или общую немощь без добавления причины; фраза сохранена в скобках согласно тексту издания.
- source_word: πτοεῖται
  choice: страшится
  rationale: Передаёт сильный испуг или устрашение, сохраняя различие с δειλιᾷ («робеет»).
theological_decisions:
- issue: Неизменность и бесстрашие Бога в антропоморфном сравнении
  choice: Сохранены три отрицательных сопоставления без поясняющего богословского расширения.
  alternative: Перевести как абсолютное утверждение «Бог не способен стыдиться, бояться или слабеть».
  rationale: Греческий текст формулирует мысль через сравнения; перевод не должен превращать их в более систематизированное догматическое утверждение.
- issue: Текстуально неустойчивая фраза ἀσθενεῖ ἢ
  choice: 'Передана в квадратных скобках: «[не слабеет и]».'
  alternative: Опустить слова либо включить их без скобок.
  rationale: Квадратные скобки в исходном издании обозначают сомнительный или восполненный элемент, что важно сохранить. Греческое ἢ буквально «или», однако в русском отрицательном перечислении естественно «и»; характер альтернативы отмечен в сноске.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным параллелизмом. Повтор «как» сохраняет риторическую структуру оригинала; «сын человеческий» здесь употреблено как семитизирующее обозначение человека, без навязывания титульного прочтения.
