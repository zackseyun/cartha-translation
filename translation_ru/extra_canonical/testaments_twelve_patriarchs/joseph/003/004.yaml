  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/004.yaml
  text: And I fasted during those seven years, and I appeared to the Egyptian as one living in luxury; because those who fast for God receive favor in their appearance.
translation:
  language: ru
  text: 4. И в те семь лет я постился, а египтянину я казался живущим в роскоши, потому что постящиеся ради Бога обретают привлекательность лица.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «получают благодать (или благосклонность) лица». Греческое χάρις может означать благодать, благосклонность, приятность или привлекательность; выражение относится к лицу, то есть к внешнему виду.'
    reason: Сохраняет многозначность χάρις и прямую связь выражения с «лицом», не приписывая ему исключительно богословский либо исключительно эстетический смысл.
lexical_decisions:
- source_word: ἐνήστευον
  choice: я постился
  rationale: Передаёт длительное или повторяющееся действие в течение указанного семилетнего периода.
- source_word: ἐφαινόμην τῷ Αἰγυπτίῳ
  choice: египтянину казалось
  rationale: Естественно передаёт значение «я представлялся/выглядел в глазах египтянина», не превращая субъективное впечатление в объективное утверждение.
- source_word: ὡς ἐν τρυφῇ διάγων
  choice: будто я живу в довольстве
  rationale: τρυφή обозначает изобилие, довольство или роскошную жизнь; «в довольстве» звучит естественно и не усиливает текст до непременно показной роскоши.
- source_word: διὰ τὸν θεόν
  choice: ради Бога
  rationale: Передаёт мотив или посвящённость поста; русское «для Бога» здесь менее естественно.
- source_word: τοῦ προσώπου τὴν χάριν λαμβάνουσιν
  choice: обретают благообразие лица
  rationale: 'Сохраняет прямую связь χάρις с πρόσωπον: постящимся даруется приятность, привлекательность или благодатный вид лица, а не абстрактное благоволение.'
theological_decisions:
- issue: Смысл поста «διὰ τὸν θεόν»
  choice: ради Бога
  alternative: для Бога / из-за Бога
  rationale: Фраза указывает на богобоязненный мотив поста, но не уточняет его конкретную аскетическую или конфессиональную практику.
- issue: Значение «χάρις лица»
  choice: благообразие лица
  alternative: благоволение по внешности / приятный вид
  rationale: Выбранная формулировка сохраняет образ лица и допускает как видимую привлекательность, так и дарованную Богом благодатность, не сводя выражение исключительно к общественному расположению.
translation_notes:
  register: Современный литературный русский язык с достоинством межзаветного наставительного текста. Противительный союз «но» естественно выражает подразумеваемый контраст между постом и впечатлением зажиточной жизни; пунктуация сохраняет причинную связь второй части.
