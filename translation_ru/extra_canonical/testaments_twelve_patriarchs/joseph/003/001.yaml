source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἐν δέκα²⁸ πειρασμοῖς *δόκιμον ἀπέδειξέ με²⁹ Καὶ ἐν πᾶσιν αὐτοῖς³⁰ ἐμακροθύμησα³¹. Ὅτι³² μέγα φάρμακόν ἐστιν *ἡ μακροθυμία³³ Καὶ πολλὰ³⁴ ἀγαθὰ δίδωσιν *ἡ ὑπομονή³⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/001.yaml
  text: In ten temptations he proved me approved, and in them all I was patient; for patience is a great remedy, and endurance gives many good things.
translation:
  language: ru
  text: В десяти испытаниях было показано, что я выдержал проверку[a], и во всех них я проявил долготерпение. Ибо долготерпение — великое лекарство, а стойкость приносит много благ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте подлежащее при глаголе «показал» не выражено. Безличная конструкция в переводе сохраняет эту неоднозначность; более широкий контекст допускает различное понимание действующего лица.
    reason: Отмечает отсутствие выраженного субъекта в ἀπέδειξέ и не вводит в основной текст не засвидетельствованный мужской род.
lexical_decisions:
- source_word: πειρασμοῖς
  choice: испытаниях
  rationale: Слово может означать как испытания, так и искушения; «испытания» здесь охватывает весь опыт проверки Иосифа, не устраняя возможного оттенка искушения.
- source_word: δόκιμον ἀπέδειξέ με
  choice: показал, что я выдержал проверку
  rationale: Передаёт результат испытания — подтверждённую добротность или верность — естественным современным русским языком, избегая неясного буквального «показал меня испытанным».
- source_word: ἐμακροθύμησα / ἡ μακροθυμία
  choice: проявлял долготерпение / долготерпение
  rationale: Сохраняет повтор одного греческого корня и выражает длительное самообладание перед лицом провокаций.
- source_word: φάρμακον
  choice: лекарство
  rationale: 'Сохраняет прямую метафору греческого текста: долготерпение названо целительным средством.'
- source_word: ἡ ὑπομονή
  choice: стойкость
  rationale: Обозначает выдержку и способность оставаться твёрдым под давлением; также отличает это понятие от μακροθυμία.
- source_word: πολλὰ ἀγαθὰ δίδωσιν
  choice: дарует много благ
  rationale: Передаёт буквальный образ «даёт многие блага» в естественном и достойном русском регистре.
theological_decisions:
- issue: Неуказанный субъект глагола ἀπέδειξέ
  choice: В основном тексте сохранено «он» по ближайшему консультационному чтению, а отсутствие явного субъекта в греческой форме отмечено в сноске.
  alternative: «Она показала» при отнесении действия к женщине-искусительнице либо безличная перестройка «было показано».
  rationale: Греческий глагол сам по себе не указывает род субъекта; не следует молча устранять эту реальную контекстуальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксис сделан ясным для обычного читателя; параллелизм «долготерпение… стойкость» и образ лекарства сохранены.
