  source_fidelity: Греческие ἐμνημόνευον и προσηυχόμην стоят в имперфекте. В данном контексте это естественно передать несовершенным видом («помнил», «молился»), не превращая оба действия в однократные завершённые события. Не выраженное в греческом притяжательное «свою» лучше не добавлять. Причастие κλαίων передано как одновременное действие («плача»).
  naturalness: Предлагаемая редакция сохраняет современный литературный строй фразы. «Плача» — умеренно книжная, но естественная для библейского повествования форма и точнее связывает плач с субъектом действия, чем «со слезами».
  terminology: «Господу» точно передаёт Κυρίῳ. «Комната» остаётся нейтральным и естественным соответствием ταμεῖον без неоправданной конкретизации назначения помещения.
