lexical_decisions:
- source_word: ἐμνημόνευον
  choice: вспомнил
  rationale: В данном повествовательном контексте передаёт обращение Иосифа к словам отца; русский совершенный вид естественно обозначает событие, предшествующее последующим действиям.
- source_word: λόγους πατρός μου
  choice: слова отца моего
  rationale: Сохраняет прямое значение λόγους и слегка возвышенный, но понятный современному читателю порядок слов.
- source_word: ταμεῖον
  choice: комнату
  rationale: Обозначает внутреннее, отдельное помещение; «комната» естественнее по-русски и не добавляет не указанного в тексте назначения.
- source_word: κλαίων
  choice: со слезами
  rationale: Передаёт сопутствующее состояние плача естественной русской конструкцией, не меняя последовательности основных действий.
- source_word: προσηυχόμην Κυρίῳ
  choice: помолился Господу
  rationale: Точно передаёт адресованную Господу молитву и согласует вид глагола с последовательностью завершённых повествовательных действий.
