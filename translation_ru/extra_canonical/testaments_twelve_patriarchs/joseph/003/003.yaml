  - severity: low
    issue: «Свою комнату» добавляет притяжательное значение, отсутствующее в греческом тексте.
    rationale: Артикль τὸ не содержит притяжательного местоимения; нейтральное «в комнату» достаточно передаёт ταμεῖον.
