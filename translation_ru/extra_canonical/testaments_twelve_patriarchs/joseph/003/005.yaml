  text: And if my master was away, I drank no wine; and for three days I would take my food and give it to the poor and the sick.
translation:
  language: ru
  text: А когда мой господин был в отъезде, я не пил вина; и в течение трёх дней брал свою пищу и отдавал её бедным и больным.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεδήμει
  choice: уезжал
  rationale: Глагол означает отсутствие вследствие отъезда или пребывания вдали; русское «уезжал» естественно передаёт повторяющуюся ситуацию.
- source_word: ὁ κύριός μου
  choice: мой господин
  rationale: В контексте речи Иосифа κύριος обозначает его земного хозяина; «господин» сохраняет историческое отношение, не смешивая его с обращением к Богу.
- source_word: τριημερίζων
  choice: по три дня
  rationale: Причастие буквально указывает на период в три дня. Перевод сохраняет временное значение, не добавляя прямо отсутствующего в тексте глагола «поститься».
- source_word: ἐλάμβανον μου τὴν τροφήν
  choice: я брал предназначенную мне пищу
  rationale: Местоимение μου естественно понимается как указание на долю пищи, принадлежавшую или полагавшуюся Иосифу; «предназначенную мне» яснее по-русски, чем буквальное «мою пищу».
- source_word: πένησιν
  choice: бедным
  rationale: πένης обозначает нуждающегося, небогатого человека; общеупотребительное «бедным» подходит по смыслу и регистру.
- source_word: ἀσθενοῦσιν
  choice: больным
  rationale: Субстантивированное причастие может означать слабых или больных; рядом с раздачей пищи наиболее естественно «больным», как и в консультационном английском тексте.
theological_decisions:
- issue: Выражает ли τριημερίζων трёхдневный пост?
  choice: 'Не вводить слово «постился», а передать нейтрально: «по три дня».'
  alternative: «По три дня я постился» или «три дня обходился без пищи».
  rationale: Контекст допускает понимание трёхдневного воздержания от собственной пищи, однако сам греческий текст не употребляет обычного глагола «поститься». Нейтральная формулировка сохраняет смысловую напряжённость и не превращает вывод из контекста в прямое утверждение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным тоном. Синтаксический параллелизм оригинала сохранён, но фраза сделана понятной обычному читателю; конфессионально маркированная терминология не вводилась.
