  text: И поскольку у неё не было сына, она притворялась…[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст данного фрагмента обрывается на словах «она притворялась»; продолжение подразумевается, но здесь не сохранилось.
    reason: Многоточие и примечание сохраняют синтаксическую незавершённость источника и не вносят догадочного дополнения.
lexical_decisions:
- source_word: τέκνον ἄρρεν
  choice: сына
  rationale: Буквально «ребёнка мужского пола»; в естественном современном русском контексте это точно и кратко передаётся словом «сына».
- source_word: προσεποιεῖτο
  choice: притворялась
  rationale: Глагол означает «делать вид, притворяться». Имперфект передан несовершенным видом, без добавления отсутствующего в данном фрагменте объекта или содержания притворства.
