  source_fidelity: Перевод точно передаёт повторяющееся действие несовершенного вида ὤρθριζον/ἔκλαιον и смысл πρὸς Κύριον как раннего молитвенного обращения к Господу. «Египтянка Мемфия» корректно воспроизводит Μεμφίας τῆς Αἰγυπτίας; «непрестанно и сильно докучала» сохраняет оба наречия, σφόδρα и ἀδιαλείπτως. Финальная фраза верно передаёт ночные посещения под заявленным предлогом визита (λόγῳ ἐπισκέψεως).
