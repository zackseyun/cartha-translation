source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὤρθριζον δὲ³⁵ πρὸς Κύριον καὶ ἔκλαιον περὶ Μεμφίας³⁶ τῆς Αἰγυπτίας, ὅτι σφόδρα³⁷ ἀδιαλείπτως ἠνόχλει³⁸ μοι³⁹. *καὶ γὰρ⁴⁰ ἐν νυκτὶ εἰσήιει⁴¹ *πρός με⁴² λόγῳ ἐπισκέψεως.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/006.yaml
  text: And I would rise early to the Lord and weep concerning Memphis the Egyptian woman, because she troubled me greatly without ceasing; for even at night she would come in to me under a pretext of visiting.
translation:
  language: ru
  text: А я вставал рано, чтобы молиться Господу, и плакал из-за египтянки Мемфии, потому что она непрестанно и сильно докучала мне; ведь даже ночью она входила ко мне под предлогом навестить меня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤρθριζον πρὸς Κύριον
  choice: вставал рано, чтобы молиться Господу
  rationale: Глагол ὀρθρίζω означает вставать или приходить рано; сочетание πρὸς Κύριον в данном молитвенном контексте естественно передано как обращение к Господу в молитве.
- source_word: ἔκλαιον περὶ Μεμφίας τῆς Αἰγυπτίας
  choice: плакал из-за египтянки Мемфии
  rationale: περί с родительным здесь обозначает предмет скорби; имя и характеристика женщины сохранены без отождествления с городом Мемфисом.
- source_word: σφόδρα ἀδιαλείπτως ἠνόχλει μοι
  choice: непрестанно и сильно докучала мне
  rationale: 'Сохранены оба наречия: σφόδρα передаёт интенсивность, ἀδιαλείπτως — непрерывность; ἐνοχλέω здесь означает настойчиво беспокоить или докучать.'
- source_word: λόγῳ ἐπισκέψεως
  choice: под предлогом навестить меня
  rationale: λόγῳ может указывать на заявленное основание или предлог, а ἐπίσκεψις — на посещение; по-русски цель визита естественно выражается инфинитивом.
theological_decisions:
- issue: Характер раннего обращения Иосифа к Господу
  choice: явно обозначить молитвенный смысл
  alternative: 'буквально: «вставал рано к Господу»'
  rationale: Русская буквальная конструкция неясна, тогда как плач перед Господом и оборот πρὸς Κύριον указывают на молитвенное обращение; дополнительных конфессиональных смыслов не внесено.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного религиозного текста. Синтаксис близок к греческому, но устранены неестественные для русского обороты. «Докучала» передаёт настойчивое нежелательное преследование без излишне конкретизирующей сексуальной лексики.
