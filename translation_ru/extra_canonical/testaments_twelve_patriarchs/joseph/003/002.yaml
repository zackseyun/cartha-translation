revisions:
- from: 'Сколько раз египтянка угрожала мне смертью! Сколько раз она отдавала меня на истязания, а потом звала обратно и угрожала мне снова![a] Когда же я не хотел сойтись с ней, она говорила мне: «Ты будешь властвовать и надо мной, и над всеми в моём доме, если отдашь себя мне, и станешь господином над нами».'
  to: 'Сколько раз египтянка угрожала мне смертью! Сколько раз она предавала меня наказаниям, а затем отзывала и снова угрожала мне![a] Когда я не хотел сойтись с ней, она говорила мне: «Ты будешь властвовать и надо мной, и над всеми, кто в моём доме, если отдашь себя мне, и станешь нашим господином».'
