source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ποσάκις ἡ Αἰγυπτία¹ ἠπείλησέ² μοι³ θάνατον; ποσάκις⁴ τιμωρίαις⁵ ⸀με⸀⁶ παραδοῦσα⁷ ἀνεκαλέσατο⁸ [καὶ ἠπείλησέ μοι⁹] *καὶ μὴ θέλοντός μου¹⁰ συνελθεῖν αὐτῇ ἔλεγέ¹¹ μοι· Κυριεύσεις¹² *κἀμοὶ καὶ πάντων τῶν ἐν τῷ οἴκῳ μου¹³, *ἐὰν ἐπιδῷς ἑαυτὸν¹⁴ εἰς ἐμέ, καὶ ἔσῃ ὡς δεσπότης ἡμῶν¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/002.yaml
  text: How many times the Egyptian woman threatened me with death! How many times, after handing me over to punishments, she called me back, and threatened me; and when I was unwilling to come together with her, she said to me, “You shall have authority over me also, and over all who are in my house, if you give yourself to me, and you shall be as our master.”
translation:
  language: ru
  text: 'Сколько раз египтянка угрожала мне смертью! Сколько раз она предавала меня наказаниям, а затем отзывала и снова угрожала мне![a] Когда я не хотел сойтись с ней, она говорила мне: «Ты будешь властвовать и надо мной, и над всеми, кто в моём доме, если отдашь себя мне, и станешь нашим господином».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «и снова угрожала мне» в греческой рукописной традиции текстуально неустойчивы.
    reason: В представленном критическом тексте καὶ ἠπείλησέ μοι заключено в квадратные скобки; поэтому слова сохранены в основном тексте, но отмечены как текстуально сомнительные.
lexical_decisions:
- source_word: ἡ Αἰγυπτία
  choice: египтянка
  rationale: Существительное с определённым артиклем буквально обозначает «египтянку»; такой вариант естественнее по-русски, чем пояснительное «египетская женщина», и сохраняет способ именования персонажа в источнике.
- source_word: τιμωρίαις με παραδοῦσα
  choice: отдавала меня на истязания
  rationale: Оборот означает передачу кого-либо наказаниям или карам. «Истязания» передаёт суровый характер происходящего и естественно сочетается с конструкцией «отдать на».
- source_word: ἀνεκαλέσατο
  choice: звала обратно
  rationale: Глагол передаёт возвращение или отзыв ранее удалённого человека; разговорно ясное «звала обратно» сохраняет направленность действия.
- source_word: συνελθεῖν αὐτῇ
  choice: сойтись с ней
  rationale: Буквально — «сойтись/быть вместе с ней». Русский оборот сохраняет эвфемистическую форму и понятный в контексте сексуальный смысл, не делая его более прямым, чем греческий текст.
- source_word: Κυριεύσεις
  choice: будешь властвовать
  rationale: Глагол означает господствовать, обладать властью; «властвовать» сохраняет связь с последующим δεσπότης и обещание власти.
- source_word: ἐπιδῷς ἑαυτὸν εἰς ἐμέ
  choice: отдашь себя мне
  rationale: Передаёт добровольную передачу себя во власть или распоряжение женщины, не уточняя сверх источника характер обещанного союза.
- source_word: δεσπότης ἡμῶν
  choice: господином над нами
  rationale: δεσπότης обозначает хозяина или полновластного господина; выбранный оборот естественен в современном литературном русском и согласуется с обещанием властвовать над домом.
theological_decisions:
- issue: Характер предложения египтянки
  choice: Сохранена эвфемистическая формулировка «сойтись с ней» и обещание власти в доме.
  alternative: Передать прямо как предложение вступить в половую связь или истолковать как предложение брака.
  rationale: Греческое συνελθεῖν αὐτῇ допускает понятный в контексте интимный смысл, но выражает его косвенно; перевод не должен ни смягчать нравственное испытание, ни вводить отсутствующее прямое уточнение.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью повествования. Риторическое повторение «Сколько раз» сохранено. Реплика женщины передана естественно, но с сохранением властной лексики и эвфемизма оригинала.
