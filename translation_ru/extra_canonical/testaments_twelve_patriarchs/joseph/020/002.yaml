base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/002.yaml
  text: And you shall carry up my bones with you. For when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.
translation:
  language: ru
  text: А вы поднимете мои кости и возьмёте их с собой, потому что, когда там будут подняты мои кости, Господь будет с вами во свете, а Велиар будет с египтянами во тьме.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνανοίσετε
  choice: возьмёте … с собой
  rationale: Передаёт совместное несение останков и естественно сочетается с μεθ᾽ ὑμῶν; будущее время оригинала сохранено.
- source_word: ἀναγομένων
  choice: будут перенесены
  rationale: Пассивная конструкция сохраняет смысл перенесения костей «туда», не добавляя прямо не названного места назначения.
- source_word: ἐν φωτί / ἐν σκότει
  choice: во свете / во тьме
  rationale: Сохраняет намеренный пространственно-образный параллелизм и богословское противопоставление греческого текста.
- source_word: Βελίαρ
  choice: Велиар
  rationale: Традиционная русская передача имени, без замены толкованием вроде «дьявол» или «лукавый».
theological_decisions:
- issue: Характер противопоставления Господа и Велиара
  choice: 'Сохранено буквальное: «Господь будет с вами во свете, а Велиар будет с египтянами во тьме»'
  alternative: Истолковать свет и тьму как благословение и осуждение
  rationale: Оригинал оставляет образы света и тьмы неразъяснёнными; перевод не должен сужать их возможное эсхатологическое, нравственное или символическое значение.
translation_notes:
  register: Современный литературный русский язык с dignified библейской интонацией. Синтаксический параллелизм финальной части сохранён; архаизмы и лишние пояснения не добавлены.
