  terminology: «Притеснять», «Бог», «отомстит за вас» и «обещания» уместны. Передача «обещаниям, данным вашим отцам» обоснованно раскрывает в данном контексте генитив τῶν πατέρων ὑμῶν как обещания, данные предкам; она не навязывает конфессионального толкования.
