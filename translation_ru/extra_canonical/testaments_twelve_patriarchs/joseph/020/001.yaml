  source_fidelity: 'Перевод верно передаёт все основные элементы греческого текста: γὰρ («Ибо»), будущее притеснение со стороны египтян, Божье воздаяние в пользу адресатов и приведение к обещаниям, связанным с их отцами. «Отомстит за вас» — естественная русская передача ποιήσει τὴν ἐκδίκησιν ὑμῶν и не привносит конкретизации исполнителя или способа воздаяния. «Приведёт» не добавляет отсутствующего в тексте значения возвращения.'
