id: T12P.JOS.20.1
reference: Testament of Joseph 20:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Οἶδα ⌜γὰρ⌉¹ ὅτι μετὰ *τὴν τελευτήν μου² οἱ Αἰγύπτιοι θλίψουσιν³ ὑμᾶς⁴, ἀλλ᾽ ὁ Θεὸς⁵ ποιήσει τὴν ἐκδίκησιν ὑμῶν⁶ καὶ ἐπάξει⁷ ὑμᾶς εἰς *τὰς ἐπαγγελίας⁸ τῶν πατέρων ὑμῶν⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/001.yaml
  text: For I know that after my death the Egyptians will oppress you, but God will execute your vengeance and bring you into the promises of your fathers.
translation:
  language: ru
  text: Ибо я знаю, что после моей смерти египтяне будут притеснять вас, но Бог отомстит за вас и приведёт вас к обещаниям, данным вашим отцам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θλίψουσιν
  choice: будут притеснять
  rationale: Передаёт будущее действие и значение давления, угнетения и причинения бедствий естественным современным русским выражением.
- source_word: ποιήσει τὴν ἐκδίκησιν ὑμῶν
  choice: отомстит за вас
  rationale: Идиоматично передаёт мысль о Божьем воздаянии за причинённое адресатам зло, не создавая неестественной конструкции «совершит ваше отмщение».
- source_word: ἐπάξει
  choice: приведёт
  rationale: Сохраняет простое каузативное значение глагола без добавления отсутствующего в греческом тексте смысла возвращения.
- source_word: εἰς τὰς ἐπαγγελίας τῶν πατέρων ὑμῶν
  choice: к обещаниям, данным вашим отцам
  rationale: 'Сохраняет множественное число ἐπαγγελίας и естественно раскрывает родительную связь: обещания принадлежат отцам как данные им.'
theological_decisions:
- issue: Субъект и направленность отмщения в выражении τὴν ἐκδίκησιν ὑμῶν
  choice: Бог отомстит за вас
  alternative: Бог совершит ваше отмщение
  rationale: Родительное ὑμῶν допускает буквальную формулировку «ваше отмщение», однако в контексте притеснения естественнее понимать её как воздаяние в защиту адресатов; перевод не указывает конкретного человеческого исполнителя мести.
- issue: Образ вхождения «в обещания»
  choice: приведёт вас к обещаниям
  alternative: введёт вас в обещания
  rationale: Сохранена необычная множественность «обещаний», но русское «к обещаниям» звучит естественнее и передаёт достижение обещанного, не конкретизируя его как землю или иное наследие.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Союз «ибо» сохраняет γὰρ и связь с предыдущим контекстом; формулировки ясны обычному читателю, без конфессиональных уточнений.
