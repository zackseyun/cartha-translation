base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/005.yaml
  text: And you shall carry up my bones with you. For when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.
translation:
  language: ru
  text: А вы унесёте мои кости с собой, потому что, когда мои кости будут перенесены туда, Господь будет с вами во свете, а Велиар — с египтянами во тьме.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνανοίσετε
  choice: возьмите с собой
  rationale: Передаёт совместное перемещение останков вместе с уходящими; повелительная форма по смыслу естественна в завещательном наставлении, хотя греческая форма может быть понята и как будущее время.
- source_word: ἀναγομένων τῶν ὀστέων ἐκεῖ
  choice: когда кости будут перенесены туда
  rationale: Сохраняет пассивную конструкцию и указание направления, не уточняя место, которое в данном стихе прямо не названо.
- source_word: ἐν φωτί / ἐν σκότει
  choice: во свете / во тьме
  rationale: Сохраняет буквальную антитезу света и тьмы и её богословскую напряжённость.
- source_word: Βελίαρ
  choice: Велиар
  rationale: Традиционная русская передача имени персонажа; имя не заменено толкованием вроде «дьявол».
theological_decisions:
- issue: Противопоставление присутствия Господа и Велиара
  choice: Господь будет с вами во свете, а Велиар — с египтянами во тьме
  alternative: Господь, пребывающий во свете, будет с вами, а Велиар, пребывающий во тьме, — с египтянами
  rationale: Выбранный вариант сохраняет наиболее прямое синтаксическое соответствие греческому и не решает однозначно, обозначают ли свет и тьма сферу присутствия, состояние сторон или образ божественной и враждебной силы.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным завещательным тоном. Синтаксис близок к греческому, без внесения отсутствующих в данном стихе сведений о выходе из земли, погребении в Хевроне или патриархах.
