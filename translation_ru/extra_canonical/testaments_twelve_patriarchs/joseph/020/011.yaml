id: T12P.JOS.20.11
reference: Testament of Joseph 20:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/011.yaml
  text: For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will be brought to completion, like a watchman’s hut in an orchard, which vanishes after the summer.
translation:
  language: ru
  text: Ибо его царство будет вечным царством, которое не пройдёт. Моё же царство среди вас[a] будет завершено, подобно сторожевой хижине в плодовом саду, которая исчезает после лета.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в вас»; возможно также: «внутри вас».'
    reason: Греческое ἐν ὑμῖν допускает как коллективное значение «среди вас», так и значение «в вас»; контекст не требует устранить эту неоднозначность.
lexical_decisions:
- source_word: βασιλεία αὐτοῦ
  choice: Его царство
  rationale: Сохраняет местоименную отсылку и возвышенное звучание исходного текста без уточнения личности, не названной в данном стихе.
- source_word: βασιλεία ἔσται αἰώνιος
  choice: будет вечным царством
  rationale: Формально передаёт именную конструкцию и подчёркивает противопоставление временному царству Иосифа.
- source_word: οὐ παρελεύσεται
  choice: не пройдёт
  rationale: Естественный библейский оборот, точно передающий идею непреходящего царства.
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: В данном контексте речь, вероятнее всего, идёт о царстве Иосифа среди его потомков; вариант сохраняет коллективный смысл местоимения множественного числа.
- source_word: ἐπιτελεῖται
  choice: завершится
  rationale: 'Передаёт многозначность глагола: царство достигнет завершения и тем самым придёт к своему пределу; более однозначное «прекратится» было бы истолкованием.'
- source_word: ὀπωροφυλάκιον
  choice: сторожевая хижина в плодовом саду
  rationale: Передаёт составное значение слова — временное укрытие сторожа, охраняющего плодовый сад или урожай.
- source_word: μετὰ τὸ θέρος ἐξαφανίζεται
  choice: исчезает по окончании лета
  rationale: Естественно по-русски передаёт временность сезонной хижины и прямой смысл греческой фразы.
theological_decisions:
- issue: Противопоставление вечного «Его царства» и временного «моего царства»
  choice: Сохранено без указания, кому именно принадлежит вечное царство
  alternative: Уточнить референта как Мессию или Бога
  rationale: Сам стих использует только местоимение; прямое уточнение сняло бы контекстуальную и богословскую напряжённость исходного текста.
- issue: Смысл ἐπιτελεῖται применительно к царству Иосифа
  choice: «завершится»
  alternative: «прекратится» или «достигнет полноты»
  rationale: Выбранный вариант не решает однозначно, означает ли глагол исполнение, доведение до конца или окончание существования; последующее сравнение раскрывает временный характер царства.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским ритмом. Синтаксический параллелизм двух царств сохранён; архаизмы и конфессионально нагруженные уточнения не вводились.
