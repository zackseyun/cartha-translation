lexical_decisions:
- source_word: ταῦτα εἰπών
  choice: Сказав это
  rationale: Естественная русская передача обстоятельственного причастного оборота; ταῦτα в данном контексте означает сказанное ранее.
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: он вытянул ноги
  rationale: Прямая и естественная передача греческого оборота без избыточного местоимения «свои».
- source_word: ἐκοιμήθη ὕπνῳ καλῷ
  choice: уснул крепким сном
  rationale: Сохраняет образ сна и внутренний объект при глаголе; «крепким» естественно выражает положительную характеристику καλῷ применительно ко сну, не подменяя текст упоминанием старости или прямым словом «умер».
theological_decisions:
- issue: Эвфемистическое описание смерти как сна
  choice: 'Сохранён буквальный образ: «уснул крепким сном»'
  alternative: «почил» или «умер»
  rationale: Греческий текст прямо говорит ἐκοιμήθη и ὕπνῳ, поэтому перевод не должен устранять образ сна, даже если по контексту имеется в виду смерть.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified формулировка с сохранением торжественной простоты исходного текста.
