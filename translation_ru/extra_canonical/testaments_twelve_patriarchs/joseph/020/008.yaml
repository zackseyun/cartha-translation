base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/008.yaml
  text: And in the exodus of the sons of Israel from Egypt they gathered up the bones of Joseph, and buried him in Hebron with his fathers; and the years of his life were one hundred and ten years.
translation:
  language: ru
  text: А при исходе сынов Израиля из Египта они собрали кости Иосифа и похоронили его в Хевроне вместе с его отцами. Всех лет его жизни было сто десять.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ ἐξόδῳ
  choice: при исходе
  rationale: Передаёт временное значение оборота и сохраняет библейски значимое слово «исход», не утяжеляя фразу.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: сынов Израиля
  rationale: Формально соответствует греческому выражению и естественно звучит в библейском повествовательном регистре.
- source_word: συνήγαγον τὰ ὀστᾶ
  choice: собрали кости
  rationale: Прямо передаёт значение глагола и существительного без добавления отсутствующих в тексте деталей.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: вместе с его отцами
  rationale: Сохраняет буквальный образ родовых предков и место погребения среди них; вариант «предками» был бы более пояснительным.
- source_word: ἐγένοντο δὲ τὰ ἔτη τῆς ζωῆς αὐτοῦ
  choice: Всех лет его жизни было
  rationale: Передаёт итоговую формулу возраста естественным, но всё ещё торжественным русским синтаксисом.
