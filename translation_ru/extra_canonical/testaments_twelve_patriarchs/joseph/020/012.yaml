source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/012.yaml
  text: For his kingdom will be an everlasting kingdom that will not pass away. But my kingdom among you is brought to completion, like a watchman’s hut in an orchard, which disappears after the summer.”
translation:
  language: ru
  text: Ибо его царство будет вечным царством, которое не пройдёт. Моё же царство среди вас завершается, подобно сторожевой хижине в плодовом саду, которая исчезает после лета».
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεία αἰώνιος
  choice: вечное царство
  rationale: Прямо передаёт продолжительность царства без добавления конфессиональных толкований.
- source_word: οὐ παρελεύσεται
  choice: не пройдёт
  rationale: Сохраняет обычный библейский образ непреходящего царства и видовременную форму будущего времени.
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: В данном контексте речь естественнее понимать о царстве Иосифа среди его потомков или народа; перевод не вводит более узкое пространственное либо мистическое толкование.
- source_word: ἐπιτελεῖται
  choice: подходит к концу
  rationale: Глагол может обозначать доведение до завершения; в противопоставлении вечному царству и в сравнении с исчезающей сезонной хижиной здесь выражено прекращение царства Иосифа.
- source_word: ὀπωροφυλάκιον
  choice: сторожевая хижина в плодовом саду
  rationale: Передаёт временное укрытие сторожа, охраняющего созревающие плоды, а не саму сторожевую башню.
- source_word: μετὰ τὸ θέρος ἐξαφανίζεται
  choice: исчезающей после лета
  rationale: Сохраняет сезонный образ и значение явного исчезновения после окончания летней поры.
theological_decisions:
- issue: Противопоставление «его царства» и «моего царства»
  choice: Сохранить оба местоимения без определения их референтов
  alternative: Назвать носителя вечного царства или пояснить, что «моё» относится к Иосифу
  rationale: Сам стих оставляет референт «его» зависимым от контекста; уточнение внесло бы в перевод толкование.
- issue: Значение завершения царства Иосифа
  choice: «подходит к концу»
  alternative: «достигает завершения» / «совершается»
  rationale: Контраст с непреходящим царством и образ исчезающей хижины указывают на окончание, однако формулировка «подходит к концу» не развивает это в учение о конкретном историческом событии.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис сохраняет параллелизм двух царств; образ временной садовой сторожки передан ясно и без архаизмов.
