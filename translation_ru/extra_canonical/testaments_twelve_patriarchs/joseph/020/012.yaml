revisions:
- from: Ибо его царство будет вечным царством, которое не пройдёт. Моё же царство среди вас подходит к концу, подобно сторожевой хижине в плодовом саду, исчезающей после лета».
  to: Ибо его царство будет вечным царством, которое не пройдёт. Моё же царство среди вас завершается, подобно сторожевой хижине в плодовом саду, которая исчезает после лета».
  rationale: Сделана минимальная правка для более точной передачи ἐπιτελεῖται и более плавного современного синтаксиса. Неясный в издании текстовый аппарат при ὀπωροφυλάκιον не позволяет безопасно вводить дополнительное примечание без содержания соответствующей сноски; смысловой образ, подтверждённый английской аудиторской версией, сохранён.
