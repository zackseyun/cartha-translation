lexical_decisions:
- source_word: ταῦτα εἰπών
  choice: сказав это
  rationale: 'Естественно и точно передаёт обстоятельственный оборот: «сказав эти слова / это».'
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: он вытянул ноги
  rationale: Сохраняет конкретный жест исходного текста, при этом притяжательное местоимение по-русски избыточно.
- source_word: ἐκοιμήθη ὕπνῳ καλῷ
  choice: уснул прекрасным сном
  rationale: Передаёт и глагол сна, и необычную положительную характеристику καλῷ, не заменяя её прямым указанием на смерть.
theological_decisions:
- issue: Эвфемистическое обозначение смерти через сон
  choice: уснул прекрасным сном
  alternative: почил мирным сном
  rationale: Выбранный вариант сохраняет буквальный образ сна и не снимает возможную смысловую многозначность глагола ἐκοιμήθη; «почил» сильнее и однозначнее маркировало бы смерть, а «мирным» подменяло бы καλῷ.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified повествовательная фраза. Необычное сочетание «прекрасным сном» сохранено ради образности и точности оригинала.
