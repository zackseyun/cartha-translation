  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/009.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a beautiful sleep.
translation:
  language: ru
  text: Сказав это, он вытянул ноги и уснул прекрасным сном.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα εἰπών
  choice: Сказав это
  rationale: Естественно передаёт греческий обстоятельственный причастный оборот со значением предшествующего действия.
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: он вытянул ноги
  rationale: Прямо и естественно передаёт жест, описанный греческим текстом; притяжательное местоимение в русском избыточно.
- source_word: ἐκοιμήθη ὕπνῳ καλῷ
  choice: уснул прекрасным сном
  rationale: Сохраняет глагольную игру корня сна и буквальную характеристику καλῷ. Контекст подразумевает смерть, но греческий текст здесь не говорит «вечным сном».
theological_decisions:
- issue: Обозначает ли образ сна смерть
  choice: 'Сохранён эвфемистический образ: «уснул прекрасным сном»'
  alternative: «почил» или «уснул вечным сном»
  rationale: ἐκοιμήθη буквально означает «уснул» и в данном контексте может эвфемистически обозначать смерть; добавление «вечным» не имеет опоры в представленном греческом тексте, а «почил» сильнее снимает образную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и естественная фраза без архаизации. Маркеры сносок не требуются.
