  source_fidelity: 'Текст точно передаёт греческую последовательность действий: ταῦτα εἰπών — «Сказав это», ἐκτείνας τοὺς πόδας αὐτοῦ — «он вытянул ноги», ἐκοιμήθη — «уснул». «Прекрасным сном» является допустимой прямой передачей ὕπνῳ καλῷ и сохраняет повтор образа сна. Смертный контекст не требует добавления слова «вечным».'
