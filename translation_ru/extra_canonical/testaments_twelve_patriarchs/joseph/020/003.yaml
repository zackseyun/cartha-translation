base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/003.yaml
  text: And bring Aseneth your mother [to the Hippodrome], and bury her near Rachel my mother.
translation:
  language: ru
  text: А Асенефу, вашу мать, отнесите [к Ипподрому][a] и похороните рядом с Рахилью, моей матерью.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «к Ипподрому» в греческом издании отмечены квадратными скобками как текстуально сомнительные.
    reason: Сохраняет обозначенную в исходном издании неопределённость текста, не решая её молча.
lexical_decisions:
- source_word: ἀγάγετε
  choice: отнесите
  rationale: Императив множественного числа означает «принесите/отведите». В контексте распоряжения о погребении естественное русское «отнесите» передаёт перемещение тела к месту захоронения, не добавляя отдельного глагола «умрёт».
- source_word: παρὰ τὸν Ἱππόδρομον
  choice: к Ипподрому
  rationale: Предлог παρά с винительным указывает направление или приближение; название места передано как имя собственное с прописной буквы.
- source_word: πλησίον Ῥαχιὴλ
  choice: рядом с Рахилью
  rationale: Естественно передаёт пространственное значение πλησίον; имя Рахиль склонено по нормам современного литературного русского языка.
- source_word: θάψατε
  choice: похороните
  rationale: Обычное и достойное русское соответствие повелительному «погребите»; сохраняет прямой смысл без архаизации.
