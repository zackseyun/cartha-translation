base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010.yaml
  text: '1[a]. See, then, my children, how much endurance accomplishes, and prayer with fasting.


    2. So you also, if you pursue self-control and purity with endurance, and prayer with fasting, in humility of heart, the Lord will dwell in you, because he loves self-control.


    3[b]. And where the Most High dwells, even if envy should befall someone, or slavery, or slander, the Lord dwelling in him, because of his self-control, not only rescues him from evils, but also exalts and glorifies him, as he did me.


    4. For every person, whether in deed or in word or in thought, comes together.


    5. My brothers knew how my father loved me, yet I was not exalted in my mind; but though I was a child, I had the fear of God in my heart, for I knew that all things will surely pass away.


    6. And I was not puffed up in evil; rather, I honored my brothers, and because of fear of them I kept silent, when I was being sold, so as not to tell the Ishmaelites that I was a son of Jacob[c], a great and mighty man.'
translation:
  language: ru
  text: '1. Итак, дети мои, посмотрите, как много совершают стойкость и молитва с постом.


    2. Так и вы: если будете со стойкостью стремиться к самообладанию и чистоте, молиться с постом в смирении сердца, то Господь будет обитать в вас, потому что Он любит самообладание.


    3. А там, где обитает Всевышний, даже если кого постигнут зависть, рабство или клевета[a], Господь, обитающий в нём, за его самообладание не только избавляет его от бед, но и возвышает и прославляет, как возвысил и прославил меня.


    4. Ведь [он] сходится со всеми людьми — делом ли, словом ли или мыслью[b].


    5. Мои братья знали, как любил меня отец, однако я не превозносился в своих мыслях. Хотя я был ещё ребёнком, в моём сердце был страх Божий, потому что я знал: всё пройдёт.


    6. Я не превозносился во зле, но почитал своих братьев и из страха перед ними молчал, когда меня продавали: не сказал измаильтянам, что я сын Иакова[c], великого и праведного человека.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «ложное обвинение». Греческое слово может обозначать злонамеренно выдвинутое или вымышленное обвинение, что соответствует истории Иосифа в Египте.'
    reason: lexical_alternative; anchor 10:3, after «клевета»
  - marker: b
    text: 'Греческий текст этого предложения труден и, вероятно, повреждён. Дословно его можно понять как: «Ибо со всеми людьми он сходится — делом ли, словом ли или мыслью»; не вполне ясно, кто именно подразумевается под действующим лицом.'
    reason: textual_variant; anchor 10:4, after «мыслью»
  - marker: c
    text: В рукописях эта часть предложения имеет разночтения, однако общий смысл состоит в том, что во время продажи Иосиф умолчал о своём происхождении.
    reason: textual_variant; anchor 10:6, after «Иакова»
lexical_decisions:
- source_word: ὑπομονή
  choice: стойкость
  rationale: Передаёт терпеливую твёрдость и постоянство в испытаниях; естественно звучит в современном русском наставлении.
- source_word: προσευχή μετὰ νηστείας
  choice: молитва с постом / молиться с постом
  rationale: Сохраняет значение сопровождения, выраженное μετά, и естественно встраивается в русский синтаксис.
- source_word: σωφροσύνη
  choice: самообладание
  rationale: Сохраняет широкий смысл дисциплинированного владения собой; ближайший контекст чистоты поддерживает также подразумеваемое половое воздержание.
- source_word: ἁγνεία
  choice: чистота
  rationale: Передаёт нравственную, и особенно половую, чистоту, не сужая значение до одного лишь целомудрия.
- source_word: ταπείνωσις καρδίας
  choice: смирение сердца
  rationale: Сохраняет внутреннюю направленность выражения и его достойный библейский регистр.
- source_word: κατοικέω
  choice: обитать
  rationale: Точно передаёт устойчивое присутствие Господа и звучит возвышенно, но понятно.
- source_word: ὁ ὕψιστος
  choice: Всевышний
  rationale: Устоявшаяся русская передача этого божественного титула.
- source_word: δουλεία
  choice: рабство
  rationale: В повествовании об Иосифе обозначает действительное порабощение, которое не следует смягчать словом «неволя» или «служение».
- source_word: συκοφαντία
  choice: клевета
  rationale: Кратко передаёт злонамеренное обвинение; возможность значения «ложное обвинение» отмечена в сноске.
- source_word: ῥύεται
  choice: избавляет
  rationale: Естественная русская передача спасения от постигших человека бед.
- source_word: ὑψοῖ καὶ δοξάζει
  choice: возвышает и прославляет
  rationale: Сохраняет два различных глагола и риторическую связь с возвышением Иосифа.
- source_word: δίκαιος
  choice: праведный
  rationale: Следует представленному греческому тексту καὶ δικαίου; не заменяет нравственную характеристику значением «могущественный».
theological_decisions:
- issue: Обитание Господа в праведном человеке
  choice: Передать κατοικήσει ἐν ὑμῖν и κατοικῶν ἐπ᾽ αὐτόν как «будет обитать в вас» и «обитающий в нём».
  alternative: Понимать выражение лишь как метафору благоволения либо переводить «среди вас».
  rationale: Греческий текст прямо выражает внутреннее божественное присутствие. Перевод сохраняет это напряжение, не уточняя его в категориях более поздней догматики.
- issue: Нравственный объём σωφροσύνη
  choice: «Самообладание»
  alternative: «Целомудрие» или «воздержанность»
  rationale: Контекст Иосифа включает половую чистоту, однако греческое слово обозначает более широкое разумное владение собой; сочетание с «чистотой» сохраняет обе стороны.
- issue: Связь избавления с самообладанием
  choice: Сохранить формулировку «за его самообладание».
  alternative: Переформулировать как безусловное обещание избавления независимо от нравственного контекста.
  rationale: Оборот διὰ τὴν σωφροσύνην явно связывает избавление с названной добродетелью; перевод не должен устранять эту этическую причинность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, наставительным библейским регистром. Избегнуты архаизмы и конфессионально нагруженные уточнения. В ст. 4 сохранена трудность греческого текста с пояснением в сноске; в ст. 6 характеристика Иакова переведена по данному греческому чтению «великий и праведный».
