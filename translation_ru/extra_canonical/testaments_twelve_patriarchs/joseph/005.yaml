base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/005.yaml
  text: 'And again, at another time, she said to me, “If you do not want to commit adultery, I will kill my husband with poison and take you as my husband.”


    2 So when I heard this, I tore my garments and said to her, “Woman, be ashamed before God, and do not do this lawless and evil deed, lest you be destroyed. For know this also: I will report your scheme to everyone.”


    3 Then she, being afraid, begged me not to report this scheme.


    4 And she went away, trying to win me over with gifts and every kind of pleasure.'
translation:
  language: ru
  text: '5 И ещё раз, в другое время, она сказала мне: «Если ты не хочешь прелюбодействовать, я отравлю своего мужа и возьму тебя себе в мужья».


    2 Услышав это, я разорвал на себе одежды и сказал ей: «Женщина, постыдись перед Богом и не совершай этого злого дела, чтобы тебе не погибнуть. И знай: я всем расскажу о твоём замысле».


    3 Тогда она испугалась и стала умолять меня никому не рассказывать об этом замысле.


    4 Затем она удалилась, пытаясь расположить меня к себе подарками и всевозможными удовольствиями.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μοιχεῦσαι
  choice: прелюбодействовать
  rationale: Прямо передаёт нравственно и брачно обусловленное значение греческого глагола, не смягчая его до общего «вступить в связь».
- source_word: αἰδέσθητι τὸν Θεόν
  choice: постыдись перед Богом
  rationale: Сохраняет значение стыда и нравственного благоговения перед Богом; не заменяет его близким, но иным призывом «бойся Бога».
- source_word: τὴν πρᾶξιν ταύτην τὴν πονηράν
  choice: этого злого дела
  rationale: 'Следует представленному греческому тексту: πονηράν означает «злое»; отдельного слова со значением «беззаконное» здесь нет.'
- source_word: ἐξολοθρευθῇς
  choice: тебе не погибнуть
  rationale: Естественно передаёт пассивную форму со значением полного уничтожения или гибели, не уточняя, кем будет исполнен суд.
- source_word: ἐπίνοιαν
  choice: замысел
  rationale: Передаёт обдуманный преступный план, не добавляя отсутствующих в тексте подробностей.
- source_word: ἐπιθάλπουσά με
  choice: продолжала стараться расположить меня к себе
  rationale: Передаёт длительную попытку склонить и смягчить Иосифа; «продолжала» проясняет обстоятельственное причастие после её ухода.
- source_word: ἀπολαύσεσι πάσαις
  choice: всевозможными удовольствиями
  rationale: Сохраняет широкий и намеренно не конкретизированный смысл выражения.
theological_decisions:
- issue: Характер обращения к женщине в αἰδέσθητι τὸν Θεόν
  choice: постыдись перед Богом
  alternative: бойся Бога
  rationale: Глагол αἰδέομαι прежде всего выражает стыд, почтение и нравственную сдержанность перед кем-либо. Перевод сохраняет эту грань и не подменяет её формулой о страхе Божьем.
- issue: Источник грозящей погибели
  choice: чтобы тебе не погибнуть
  alternative: чтобы Бог не погубил тебя
  rationale: Греческий пассив не называет действующее лицо. Перевод сохраняет эту открытость и не вводит Бога как явно названного исполнителя суда.
translation_notes:
  register: Современный литературный русский язык с достоинством повествования. Синтаксис сделан ясным для обычного читателя, при этом сохранены прямая нравственная резкость речи Иосифа, угроза убийства и неопределённость пассивной формы о погибели. Добавление английского консультационного слоя «беззаконное» не принято, поскольку в представленном греческом тексте ему нет отдельного соответствия.
