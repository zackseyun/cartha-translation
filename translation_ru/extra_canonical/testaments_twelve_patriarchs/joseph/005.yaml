  source_fidelity: 'В целом перевод точно передаёт содержание: угрозу отравления, разрывание одежд, призыв устыдиться перед Богом, нераскрытый субъект грозящей гибели и замысел женщины. Однако начальное καὶ πάλιν («и снова/ещё раз») в черновике не передано. В ст. 4 «но продолжала» создаёт невыраженное в греческом противопоставление и временной оттенок продолжения после ухода.'
  naturalness: Современный литературный русский в целом естественен. «И ещё раз, в другое время» несколько книжно, но уместно для повествовательного регистра и точно сохраняет двойное временное указание оригинала. «Удалившись, она пыталась расположить меня к себе…» естественно выражает греческое основное действие с обстоятельственным причастием.
  terminology: «Прелюбодействовать», «постыдись перед Богом», «злое дело», «замысел» и «всевозможные удовольствия» приемлемы. Перевод не вносит конфессиональных уточнений и не добавляет действующее лицо к пассивному ἐξολοθρευθῇς.
