  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/014.yaml
  text: 1[a]. And Memphis saw me being beaten through the windows—for her house was nearby—and she sent word to him, saying, “Your judgment is unjust[b], because you punish as a wrongdoer a free man who has been kidnapped.” 2. But since I did not alter my statement even while I was being beaten, he ordered that I be kept under guard until the masters of the boy should come. 3. And the woman kept saying to her husband[c],
translation:
  language: ru
  text: '1. Мемфис[a] увидела через оконные проёмы[b], как меня бьют, — ведь её дом был неподалёку, — и послала сказать ему: «Твой приговор несправедлив: ты наказываешь как преступника свободного человека, которого похитили[c]».


    2. Но поскольку я, даже когда меня били, не изменил своих показаний, он велел держать меня под стражей, пока не придут хозяева юноши.


    3. А женщина всё говорила своему мужу: «Зачем ты держишь в оковах этого пленённого юношу благородного происхождения? Его следовало бы, напротив, освободить, чтобы ему служили».


    4. Ведь она хотела видеть меня охваченным греховной страстью[d], но я обо всём этом ничего не знал.


    5. Он же ответил ей: «У египтян не принято отнимать чужое, прежде чем будут представлены доказательства».


    6. Это он сказал о торговце[e]. «А юноша должен оставаться взаперти».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Мемфис» — женское личное имя в греческом тексте, а не обозначение жительницы города Мемфиса.
    reason: lexical_alternative
  - marker: b
    text: Греческое слово может обозначать небольшие окна или оконные отверстия, а не застеклённые окна в современном смысле.
    reason: cultural_note
  - marker: c
    text: 'Буквально: «которого украли». О человеке это означает, что его незаконно захватили и обошлись с ним как с рабом или преступником.'
    reason: lexical_alternative
  - marker: d
    text: Слово «греховной» передаёт ἁμαρτίας, заключённое в редакторские скобки в данном греческом издании; в свидетельстве оно текстуально не вполне надёжно.
    reason: textual_variant
  - marker: e
    text: 'Или: «о меняле». Греческое слово редкое и может относиться к человеку, занимающемуся обменом или торговлей.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ Μεμφίς
  choice: мемфитянка
  rationale: Форма с женским артиклем и дальнейшее αὐτῆς указывают на женщину, связанную с Мемфисом; русский демоним естественнее, чем восприятие названия города как личного имени. Возможная трактовка как имени сохранена в примечании.
- source_word: θυρίδων
  choice: оконные проёмы
  rationale: Слово обозначает небольшие окна или оконные отверстия и не предполагает современного остекления.
- source_word: κλαπέντα ἐλεύθερον
  choice: свободного человека, которого похитили
  rationale: Передаёт юридический контраст между свободным статусом Иосифа и его насильственным захватом; примечание сохраняет буквальный образ «украденного» человека.
- source_word: οὐκ ἤλλαξα τὸν λόγον μου
  choice: не изменил своих показаний
  rationale: В судебно-следственном контексте λόγος означает изложение событий или показание, а не просто отдельное слово.
- source_word: οἱ κύριοι τοῦ παιδός
  choice: хозяева юноши
  rationale: κύριοι сохраняет социально-правовой смысл владения или господства, тогда как παῖς здесь обозначает молодого человека, находящегося в зависимом положении.
- source_word: αἰχμάλωτον καὶ εὐγενῆ παῖδα
  choice: пленённого юношу благородного происхождения
  rationale: 'Переданы оба определения: положение пленника и благородное происхождение; русская конструкция избегает двусмысленного сочетания «пленный и благородный».'
- source_word: ἐν πόθῳ ἁμαρτίας
  choice: охваченная греховной страстью
  rationale: Сохраняет нравственную оценку ἁμαρτίας и сильное желание πόθος, не уточняя сверх текста конкретный акт.
- source_word: μεταβόλου
  choice: торговце
  rationale: Редкое слово обозначает человека, занимающегося обменом или торговлей; в данном повествовательном контексте речь, вероятно, о торговце, через которого был приобретён Иосиф.
- source_word: ἐγκατάκλειστος εἶναι
  choice: оставаться взаперти
  rationale: Передаёт состояние строгого заключения без добавления не названного в тексте места содержания.
theological_decisions:
- issue: Социальный статус Иосифа и язык собственности
  choice: Сохранены выражения «свободный человек», «хозяева» и «чужая собственность»
  alternative: Смягчить их до «невиновный человек», «покровители» и «то, что принадлежит другому»
  rationale: Греческий текст намеренно сталкивает утверждение о свободном статусе Иосифа с общественным порядком, в котором его считают чьей-либо собственностью. Сглаживание устранило бы нравственное и правовое напряжение повествования.
- issue: Характер желания женщины
  choice: «греховная страсть»
  alternative: «желание согрешить со мной»
  rationale: Фраза ἐν πόθῳ ἁμαρτίας прямо связывает желание с грехом, но не формулирует дополнение «со мной»; выбранный перевод сохраняет и оценку, и некоторую грамматическую неопределённость.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной и судебной речи. Синтаксис сделан ясным для широкого читателя, но сохранены правовая лексика, социальная резкость текста и переход между репликами в стихах 5–6.
