base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002.yaml
  text: And this man[a], Pharaoh’s chief cook, entrusted his house to me. And I struggled against a shameless woman who kept pressing me to transgress with her, but the God of my father rescued me from a burning flame. I was imprisoned, I was beaten, I was mocked; and the Lord gave me compassion in the sight of the jailer. For the Lord does not abandon those who fear him, not in darkness, or chains, or afflictions, or distress[b]. For God is not ashamed like a man, nor does he grow fearful like a son of man, nor, like one born of earth, does he become weak or terrified. But in all these things he takes the lead[c], and in various ways he gives comfort.
translation:
  language: ru
  text: 1 И этот человек — главный повар фараона[a] — доверил мне свой дом. 2 Я вступил в борьбу с бесстыдной женщиной, которая настойчиво склоняла меня нарушить закон вместе с нею, но Бог моего отца избавил меня от пылающего пламени[b]. 3 Меня заключили в темницу, били и осмеивали, но Господь даровал мне милость в глазах темничного стража[c]. 4 Ведь Господь не оставляет боящихся Его — ни во тьме, ни в оковах, ни в скорбях, ни в бедствиях. 5 Ибо Бог не стыдится, как человек, не робеет, как сын человеческий, и не слабеет и не пугается, как рождённый от земли. 6 Напротив, во всём этом Он оказывает поддержку[d] и разными способами утешает. Ненадолго Он отступает[e], чтобы испытать намерение души. 7 В десяти искушениях Он явил меня испытанным, и во всех них я проявлял долготерпение. Ведь долготерпение — великое лекарство, а стойкость приносит много благ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. ἀρχιμάγειρος буквально связано с должностью главного повара, но могло обозначать придворный чин; в связи с рассказом об Иосифе его также понимают как «главный распорядитель» или «начальник стражи».
    reason: lexical_alternative
  - marker: b
    text: «Пылающее пламя», вероятно, образно обозначает всепоглощающую опасность сексуального искушения, однако греческий текст не раскрывает этот образ.
    reason: lexical_alternative
  - marker: c
    text: Буквально греческое выражение близко к «отдал меня в сострадание перед темничным стражем», то есть сделал так, что страж отнёсся к Иосифу с состраданием.
    reason: translation_clarity
  - marker: d
    text: Греческий глагол может означать «стоять над», «предстоять», «руководить» или «заботиться». Основной перевод передаёт здесь широкий смысл Божьей поддержки, не выбирая между этими оттенками.
    reason: alternative_reading
  - marker: e
    text: Слова о том, что Бог «ненадолго… отступает», стоят рядом с утверждением, что Он не оставляет боящихся Его. Перевод сохраняет это напряжение и не уточняет, в каком именно смысле Бог отступает.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ἀρχιμάγειρος
  choice: главный повар
  rationale: Сложное слово буквально обозначает начальника поваров; придворный контекст допускает понимание его как официального титула, что отмечено в сноске.
- source_word: ἠγωνισάμην
  choice: я вступил в борьбу
  rationale: Передаёт активное нравственное противостояние, не сводя глагол к физической схватке.
- source_word: ἐπείγουσάν με παρανομεῖν μετʼ αὐτῆς
  choice: настойчиво склоняла меня преступить закон вместе с ней
  rationale: Сохраняет продолжительное давление и морально-правовой оттенок παρανομεῖν, не подменяя его более узким названием конкретного греха.
- source_word: ἐρρύσατό με ἐκ φλογὸς καιομένης
  choice: избавил меня от пылающего пламени
  rationale: Сохраняет образ источника, не раскрывая метафору прямо как похоть или прелюбодеяние.
- source_word: ἔδωκέ με εἰς οἰκτιρμούς
  choice: даровал мне сострадание в глазах темничного стража
  rationale: 'По возможности сохраняет необычную греческую конструкцию: Бог сделал Иосифа предметом сострадания перед стражем; сноска поясняет смысл.'
- source_word: προΐσταται
  choice: стоит над нами
  rationale: Передаёт образ предстояния, надзора и покровительства, не сужая значение исключительно до руководства.
- source_word: Ἐν βραχεῖ ἀφίσταται
  choice: Ненадолго Он отступает
  rationale: Естественно передаёт кратковременное удаление, сохраняя напряжение между этим утверждением и словами о том, что Господь не оставляет боящихся Его.
- source_word: τῆς ψυχῆς τὸ διαβούλιον
  choice: намерение души
  rationale: διαβούλιον указывает на внутренний замысел, решение или намерение; русский вариант сохраняет внутренне-нравственный смысл.
- source_word: δόκιμον ἀπέδειξέ με
  choice: показал, что я выдержал испытание
  rationale: Передаёт игру понятий испытания и доказанной испытанности естественным современным русским выражением.
- source_word: μακροθυμία / ὑπομονή
  choice: долготерпение / стойкость
  rationale: 'Различает близкие добродетели: длительное терпение и способность выдерживать испытания.'
- source_word: φάρμακον
  choice: лекарство
  rationale: Сохраняет яркую лечебную метафору без абстрактного сглаживания до «средства».
theological_decisions:
- issue: Число в выражении «Бог моего отца»
  choice: 'Сохранено единственное число: «моего отца»'
  alternative: «Бог моих отцов»
  rationale: Греческий текст имеет единственное число и естественно указывает на личную связь Иосифа с его отцом Иаковом.
- issue: Смысл «пылающего пламени»
  choice: Образ сохранён без истолковывающей вставки
  alternative: «огонь похоти» или «прелюбодейная страсть»
  rationale: Контекст указывает на сексуальное искушение, однако сам греческий текст оставляет метафору нераскрытой.
- issue: Характер Божьего действия в προΐσταται
  choice: «стоит над нами»
  alternative: «предводительствует», «стоит рядом», «заботится»
  rationale: Формулировка сохраняет широту возможных значений — надзор, защиту, руководство и попечение.
- issue: Соотношение «не оставляет» и «ненадолго отступает»
  choice: Оба утверждения сохранены рядом без гармонизации
  alternative: Истолковать отступление лишь как сокрытие ощутимого присутствия
  rationale: Источник намеренно удерживает напряжение между неизменной верностью Бога и Его кратковременным отступлением ради испытания души.
- issue: Десять искушений и испытанность Иосифа
  choice: 'Сохранено активное Божье действие: «Он показал, что я выдержал испытание»'
  alternative: «я оказался испытанным» без явного субъекта
  rationale: Греческое ἀπέδειξέ με имеет действующий субъект, естественно соотносимый с Богом в предыдущем контексте.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным завещательным тоном. Сохранены традиционные библейские выражения «бояться Бога», «сын человеческий», «долготерпение», но синтаксис сделан понятным современному читателю. Риторические параллели стихов 4–7 и различие между долготерпением и стойкостью сохранены.
