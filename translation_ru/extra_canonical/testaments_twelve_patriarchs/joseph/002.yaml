    rationale: В исходном тексте это стих 1 главы II; повторное «2» создаёт неверную структуру отрывка.
  - severity: medium
    issue: «Господь даровал мне сострадание» меняет направленность εἰς οἰκτιρμούς.
    rationale: Русская формулировка предполагает, что Иосиф получил способность сострадать. Греческая идиома означает, что Бог устроил ему милостивое, сострадательное отношение со стороны стража.
  - severity: low
    issue: «Он стоит над нами» добавляет «нами», которого нет в греческом, и звучит не вполне естественно.
    rationale: προΐσταται употреблено без выраженного дополнения. Основной текст должен сохранить обобщённость, а варианты надзора, руководства и попечения следует оставить в сноске.
