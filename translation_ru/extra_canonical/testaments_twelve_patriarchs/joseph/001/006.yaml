source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Μόνος ἤμην²³, καὶ ὁ Θεὸς²⁴ παρεκάλεσέ με· Ἐν ἀσθενείᾳ ἤμην, καὶ ὁ Κύριος²⁵ ἐπεσκέψατό με²⁶· Ἐν φυλακῇ ἤμην, καὶ ὁ †σωτὴρ²⁷ ἐχαρίτωσέ με²⁸· [Ἐν δεσμοῖς καὶ ἔλυσέ με.]²⁹
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/006.yaml
  text: I was alone, and God comforted me. I was weak, and the Lord visited me. I was in prison, and the Savior showed me favor. [I was in chains, and he loosed me.]
translation:
  language: ru
  text: Я был один, и Бог утешил меня. Я был в немощи, и Господь посетил меня. Я был в темнице, и Спаситель явил мне милость. [Я был в узах, и Он освободил меня.][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «Я был в узах, и Он освободил меня» текстуально сомнительны и в греческом издании приведены в квадратных скобках.
    reason: Объясняет читателю значение квадратных скобок и сохраняет текстологическую прозрачность.
lexical_decisions:
- source_word: Μόνος
  choice: один
  rationale: Прямо передаёт одиночество Иосифа и сохраняет лаконичный параллелизм греческого текста.
- source_word: παρεκάλεσέ
  choice: утешил
  rationale: В данном контексте одиночества глагол παρακαλέω естественно означает ободрение и утешение.
- source_word: Ἐν ἀσθενείᾳ
  choice: в немощи
  rationale: Сохраняет широкое значение ἀσθένεια — слабость, бессилие или болезненное состояние — без неоправданного уточнения.
- source_word: ἐπεσκέψατό
  choice: посетил
  rationale: Передаёт библейское значение заботливого посещения и не сводит выражение лишь к помощи.
- source_word: φυλακῇ
  choice: темнице
  rationale: Контекст требует значения места заключения; «темница» соответствует возвышенному, но понятному библейскому регистру.
- source_word: ἐχαρίτωσέ
  choice: явил мне милость
  rationale: Передаёт дарование благоволения или милости; буквальное «облагодатствовал» в современном русском звучало бы неестественно.
- source_word: δεσμοῖς
  choice: в узах
  rationale: Сохраняет образ физических оков и параллель с заключением.
- source_word: ἔλυσέ
  choice: освободил
  rationale: В контексте уз передаёт буквальное «развязал/освободил» естественным современным выражением.
theological_decisions:
- issue: 'Обозначения Бога: ὁ Θεός, ὁ Κύριος и ὁ σωτήρ'
  choice: Бог, Господь и Спаситель
  alternative: Унифицировать все три обозначения как «Бог» или писать «спаситель» со строчной буквы
  rationale: Сохранена намеренная смена титулов в параллельных строках. Заглавная буква в «Спаситель» отражает употребление слова как божественного титула в данном контексте, не уточняя сверх текста личностное различение.
- issue: Подлежащее в заключительной фразе καὶ ἔλυσέ με
  choice: «Он освободил меня»
  alternative: «Спаситель освободил меня»
  rationale: В греческом подлежащее подразумевается; местоимение сохраняет связь с предыдущим именованием, не повторяя отсутствующее в источнике существительное.
- issue: Текстуальная неустойчивость заключительной строки
  choice: Сохранить строку в квадратных скобках и снабдить примечанием
  alternative: Включить без скобок или исключить из основного текста
  rationale: Квадратные скобки в исходной критической подаче указывают на сомнительность принадлежности слов тексту; это следует сделать видимым читателю.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Краткие повторяющиеся конструкции сохранены, чтобы передать риторический параллелизм оригинала. «Немощь», «темница» и «узы» понятны современному читателю и поддерживают торжественный регистр без архаизации.
