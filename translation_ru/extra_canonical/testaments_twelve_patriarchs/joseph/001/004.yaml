base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/004.yaml
  text: My brothers hated me, but the Lord loved me. They wanted to kill me, but the God of my fathers preserved me. They lowered me into a pit, and the Most High brought me up.
translation:
  language: ru
  text: Братья мои возненавидели меня, но Господь возлюбил меня. Они хотели убить меня, но Бог моих отцов сохранил меня. Они спустили меня в яму, а Всевышний поднял меня оттуда.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμίσησάν με
  choice: возненавидели меня
  rationale: Передаёт аорист ἐμίσησαν и сохраняет возвышенный, но понятный современному читателю библейский регистр.
- source_word: ἠγάπησέ με
  choice: возлюбил меня
  rationale: Точно отражает ἠγάπησεν и образует намеренный контраст с «возненавидели».
- source_word: ἀνελεῖν
  choice: убить
  rationale: В данном повествовательном контексте инфинитив означает лишить жизни; «убить» естественно и недвусмысленно.
- source_word: ἐφύλαξέν με
  choice: сохранил меня
  rationale: Передаёт защиту и сохранение жизни без добавления отсутствующих в тексте подробностей.
- source_word: ἐχάλασάν
  choice: спустили
  rationale: Глагол обозначает опускание вниз; выбор сохраняет способ помещения в яму и не усиливает его до «бросили».
- source_word: ἀνήγαγέν με
  choice: поднял меня оттуда
  rationale: Передаёт движение вверх; «оттуда» естественно указывает на ранее названную яму, не меняя смысла.
theological_decisions:
- issue: Контраст человеческой вражды и Божьего благоволения
  choice: Сохранены параллельные противопоставления «но Господь» и «но Бог моих отцов»
  alternative: Сгладить второе противопоставление союзом «а»
  rationale: Частица δέ в первых двух парах выражает контраст; повтор подчёркивает богословскую структуру свидетельства Иосифа.
- issue: Божественные наименования
  choice: «Господь», «Бог моих отцов», «Всевышний»
  alternative: Унифицировать все наименования как «Бог»
  rationale: 'Сохранены три различных греческих обозначения: Κύριος, Θεὸς τῶν πατέρων μου и ὕψιστος.'
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксический параллелизм оригинала сохранён; архаические формы и лишние пояснения исключены.
