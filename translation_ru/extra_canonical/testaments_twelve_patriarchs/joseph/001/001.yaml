base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/001.yaml
  text: 'The testament of Joseph, the eleventh son of Jacob and Rachel. A copy of the testament of Joseph. When he was about to die, he called his sons and his brothers and said to them:'
translation:
  language: ru
  text: 'Завещание Иосифа, одиннадцатого сына Иакова и Рахили. Копия завещания Иосифа. Когда он был близок к смерти, он созвал своих сыновей и своих братьев и сказал им:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: Завещание
  rationale: В заглавии обозначает предсмертное наставление и завещательное слово; «завещание» естественно и соответствует жанру произведения.
- source_word: τοῦ ἑνδεκάτου υἱοῦ
  choice: одиннадцатого сына
  rationale: Прямая передача порядкового числительного и родственной связи без добавочного толкования.
- source_word: Ἀντίγραφον
  choice: Копия
  rationale: Передаёт значение письменного списка или воспроизведения документа; более специальное «список» для современного читателя может быть двусмысленным.
- source_word: Ἐν τῷ μέλλειν αὐτὸν ἀποθνήσκειν
  choice: Когда он был при смерти
  rationale: Естественно передаёт обстоятельственную конструкцию со значением близкой смерти, не утверждая, что умирание уже началось.
- source_word: καλέσας
  choice: созвал
  rationale: Контекстуально выражает призыв нескольких родственников собраться перед Иосифом.
- source_word: εἶπεν αὐτοῖς
  choice: сказал им
  rationale: Простая и точная передача вводной формулы прямой речи.
