  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/005.yaml
  text: I was sold into slavery, and the Master of all set me free. I was taken into captivity, and his mighty hand helped me. I was confined by famine, and the Lord himself nourished me.
translation:
  language: ru
  text: Меня продали в рабство, и Владыка всего освободил меня. Меня взяли в плен, и Его могучая рука помогла мне. Голод сковал меня, и Сам Господь питал меня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπράθην εἰς δουλείαν
  choice: Меня продали в рабство
  rationale: Естественно и точно передаёт пассивный аорист ἐπράθην и направленность εἰς δουλείαν.
- source_word: ὁ πάντων δεσπότης
  choice: Владыка всего
  rationale: «Владыка» сохраняет смысл верховной власти δεσπότης, а «всего» естественно передаёт πάντων без излишнего уточнения.
- source_word: εἰς αἰχμαλωσίαν ἐλήφθην
  choice: Меня взяли в плен
  rationale: Современная русская формулировка, точно передающая пленение.
- source_word: ἡ κραταιὰ αὐτοῦ χεὶρ
  choice: Его могучая рука
  rationale: Сохраняет библейский образ и значение силы в κραταιά.
- source_word: Ἐν λιμῷ συνεσχέθην
  choice: Голод держал меня в заточении
  rationale: Передаёт не только бедствие голода, но и оттенок удерживания или стеснения в συνεσχέθην; образность исходного текста сохранена.
- source_word: αὐτὸς ὁ Κύριος διέθρεψέ με
  choice: Сам Господь питал меня
  rationale: «Сам» передаёт эмфатическое αὐτός, а «питал» — продолжительное обеспечение пищей, выраженное διατρέφω.
theological_decisions:
- issue: Соотношение титулов δεσπότης и Κύριος
  choice: «Владыка всего» и «Господь»
  alternative: Передать оба титула словом «Господь»
  rationale: Различение русских титулов сохраняет лексическую вариативность греческого текста и не навязывает дополнительного богословского отождествления сверх текста.
- issue: Референт местоимения αὐτοῦ
  choice: «Его» с прописной буквы как указание на Владыку всего
  alternative: «его» со строчной буквы
  rationale: В русском религиозном регистре прописная буква ясно показывает связь с божественным референтом; при этом содержание исходного местоимения не расширяется.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно библейской образностью. Трёхчастный параллелизм сохранён; союзы «но» естественно выражают контраст между бедствием и избавлением, который в греческом оформлен через καί.
