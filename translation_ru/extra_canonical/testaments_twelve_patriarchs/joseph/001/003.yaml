  source_fidelity: 'Греческое ἐπλανήθην — аорист страдательного залога: «не был введён в заблуждение / не был совращён». Формулировка «не сбился с пути» передаёт близкий результат, но заменяет страдательное значение активным, рефлексивным образом и ослабляет возможное указание на внешнее введение в заблуждение. Остальные соответствия точны: φθόνος — «зависть», θάνατος — «смерть», а ἔμενα передано несовершенным «оставался».'
