base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/003.yaml
  text: In my life I saw envy and death, and I was not led astray, but remained in the truth of the Lord.
translation:
  language: ru
  text: В своей жизни я видел зависть и смерть и не был введён в заблуждение, но оставался в истине Господа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνον
  choice: зависть
  rationale: Прямое и естественное соответствие греческому слову, сохраняющее нравственный смысл.
- source_word: θάνατον
  choice: смерть
  rationale: Буквальная передача исходного существительного без дополнительного толкования.
- source_word: οὐκ ἐπλανήθην
  choice: не сбился с пути
  rationale: Передаёт значение пассивной формы «не был введён в заблуждение / не уклонился» естественным русским выражением с образом ухода с верного пути.
- source_word: ἔμενα
  choice: оставался
  rationale: 'Сохраняет длительное значение имперфекта: Иосиф продолжал пребывать в истине.'
- source_word: ἐν τῇ ἀληθείᾳ Κυρίου
  choice: в истине Господа
  rationale: 'Формально сохраняет конструкцию с родительным падежом и её возможную смысловую широту: истина, принадлежащая Господу, исходящая от Него или определяемая Им.'
theological_decisions:
- issue: Смысл выражения «истина Господа»
  choice: Сохранено «в истине Господа»
  alternative: «в верности Господу»
  rationale: Греческое ἀλήθεια прямо означает «истина», хотя в контексте может включать верность. Перевод не сужает эту богословскую многозначность.
- issue: Залог и оттенок πλανάω
  choice: «не сбился с пути»
  alternative: «не был введён в заблуждение»
  rationale: Греческая форма допускает пассивное прочтение, однако в контексте нравственной стойкости русское выражение естественно передаёт результат, не уточняя без необходимости внешнего виновника заблуждения.
translation_notes:
  register: Современный литературный русский язык; краткий, достойный и понятный строй фразы. Сохранены последовательность образов и противопоставление греческого текста.
