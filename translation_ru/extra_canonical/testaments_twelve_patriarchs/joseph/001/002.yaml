source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἀδελφοί μου καὶ τέκνα μου⁵, Ἀκούσατε Ἰωσὴφ⁶ τοῦ ἠγαπημένου ὑπὸ⁷ Ἰσραήλ⁸, Ἐνωτίσασθε *ῥήματα τοῦ στόματός μου.⁹'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/002.yaml
  text: My brothers and children, listen to Joseph, the beloved of Israel. Pay attention, my children, to your father.
translation:
  language: ru
  text: Братья мои и дети мои, послушайте Иосифа, возлюбленного Израилем; внемлите словам моих уст.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀδελφοί μου καὶ τέκνα μου
  choice: Братья мои и дети мои
  rationale: Сохраняет оба обращения и их повторяющееся притяжательное местоимение, не устраняя возможное различие между братьями и потомками.
- source_word: Ἀκούσατε
  choice: послушайте
  rationale: Естественный современный императив, передающий призыв услышать говорящего и прислушаться к нему.
- source_word: τοῦ ἠγαπημένου ὑπὸ Ἰσραήλ
  choice: возлюбленного Израилем
  rationale: Передаёт пассивную конструкцию и не превращает Израиль в неоднозначное родительное определение «возлюбленного Израиля».
- source_word: Ἐνωτίσασθε
  choice: внемлите
  rationale: Передаёт усиленный призыв внимательно слушать; слово возвышенное, но понятное и уместное для завещательного наставления.
- source_word: ῥήματα τοῦ στόματός μου
  choice: словам моих уст
  rationale: Сохраняет семитизированный образ исходного текста вместо пересказа, присутствующего в английском консультационном слое.
theological_decisions:
- issue: Кого обозначает Израиль
  choice: Сохранено имя «Израиль» без пояснения
  alternative: «возлюбленного своим отцом Израилем» или «возлюбленного Иаковом»
  rationale: Греческий текст называет только Израиля; добавление «отцом» либо замена именем «Иаков» излишне разрешили бы подразумеваемую связь.
- issue: Содержание второго повеления
  choice: «внемлите словам моих уст»
  alternative: «обратите внимание, дети мои, на вашего отца»
  rationale: Английский POB здесь существенно отходит от засвидетельствованного греческого текста, добавляя повторное обращение к детям и упоминание отца; русский перевод следует первичному источнику.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Параллелизм двух повелений сохранён; архаическая формула «слова моих уст» оставлена ради образности и близости к греческому тексту.
