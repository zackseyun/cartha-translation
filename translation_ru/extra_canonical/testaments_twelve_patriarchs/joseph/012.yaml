  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012.yaml
  text: '3[a]. And the chief of them said to me, “You are not a servant, for your appearance also makes it plain.” But I told them plainly that I was their servant. 4. And when we had come into Egypt, they disputed concerning me, as to who would deceive the merchant and receive money for me. 5. So it seemed good to all of them to leave me in Egypt with the merchant of their trade until they should return bringing merchandise[b]. 6. But the Lord gave me favor in the eyes of the merchant, and he entrusted his house to me. 7. And God blessed him in my hands, and increased him on my account in gold and silver and work. 8. And I was with him three months.


    1. Now at that time the wife of Pentephri came down to Memphis with great display, because she had heard about me from her eunuchs. 2. And she said to her husband, “The merchant has grown rich by the hands of a certain young Hebrew; and they say that he was stolen away by theft from the land of Canaan. 3. Now therefore execute judgment concerning him, and take the young man into our house, and the God of the Hebrews will bless you[c], because grace from heaven is upon him.”'
translation:
  language: ru
  text: '3. Старший из них сказал мне: «Ты не раб — это видно и по твоему облику». Но я сказал им, что я их раб. 4. Когда мы пришли в Египет, они стали спорить обо мне: кто, продав меня, получит за меня золото.[a] 5. Тогда все решили оставить меня в Египте אצל торговца, связанного с их торговлей, пока не вернутся, привезя товар. 6. Но Господь даровал мне благосклонность в глазах торговца, и тот доверил мне свой дом. 7. И Бог благословил его через меня и умножил его богатство в золоте, серебре и хозяйстве.[b] 8. Я пробыл у него три месяца.



    12



    1. В то время жена Пентефрия[c] спустилась в Мемфис в носилках[d], с большой пышностью, потому что услышала обо мне от своих евнухов. 2. Она сказала мужу: «Торговец разбогател благодаря одному молодому еврею; говорят, его похитили из земли Ханаанской. 3. Так разбери же его дело и возьми юношу в наш дом. И Бог евреев благословит тебя, потому что на нём — благодать с небес».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст здесь синтаксически труден и, возможно, повреждён. Буквально речь идёт о споре, кто, «передав» или продав Иосифа, получит за него золото; это может быть сжатым описанием спора о его продаже.
    reason: textual_variant
  - marker: b
    text: 'Буквально: «в золоте, серебре и деле (труде)». Последнее слово может означать труд, производство, хозяйство или его плоды.'
    reason: lexical_alternative
  - marker: c
    text: Пентефрий — греческая форма египетского имени, которое в преданиях об Иосифе обычно связывают с Потифаром и его домом (ср. Быт. 39).
    reason: cross_reference
  - marker: d
    text: Греческое чтение «в носилках» отмечено в используемом издании как сомнительное; оно может быть текстуально неустойчивым.
    reason: textual_variant
lexical_decisions:
- source_word: δοῦλος
  choice: раб
  rationale: Контекст продажи Иосифа и принадлежности хозяину требует прямого обозначения рабского статуса; «слуга» неоправданно смягчило бы смысл.
- source_word: ἡ ὄψις σου δηλοῖ
  choice: это видно и по твоему облику
  rationale: Естественно передаёт вывод, сделанный по внешности и манере держаться, сохраняя значение δηλόω — «делать явным».
- source_word: τὸ τίς προδοὺς χρυσίον λάβῃ με
  choice: кто получит меня, отдав золото
  rationale: 'Синтаксически трудное выражение передано без добавления отсутствующего здесь слова «торговец»: προδούς может обозначать передачу или уплату, а λάβῃ με — получение Иосифа.'
- source_word: μετάβολος
  choice: торговец
  rationale: В данном повествовательном контексте слово обозначает посредника или торговца, которому доверяют Иосифа и товары.
- source_word: ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ
  choice: доверил мне свой дом
  rationale: Сохраняет краткость греческой идиомы и подразумеваемое управление всем домашним хозяйством.
- source_word: ἐν χειρί μου
  choice: через меня
  rationale: В современном русском это естественно передаёт библейскую идиому, обозначающую посредничество и управление, без неясного буквализма «в моей руке».
- source_word: ἔργῳ
  choice: плоды труда
  rationale: Трудное слово может относиться к работе, производству или хозяйственным результатам; «плоды труда» сохраняет широту смысла и естественно сочетается с умножением имущества.
- source_word: μετὰ δόξης πολλῆς
  choice: с большой пышностью
  rationale: В сцене прибытия δόξα означает внешнее великолепие и торжественность, а не богословскую «славу».
- source_word: εὐνοῦχοι
  choice: евнухи
  rationale: Сохраняет прямое значение греческого слова, которое в придворно-домашнем контексте могло также обозначать соответствующих служителей.
- source_word: ποίησον μετ᾿ αὐτοῦ κρίσιν
  choice: разбери его дело
  rationale: Передаёт требование провести разбирательство о положении Иосифа естественным современным русским языком, не превращая его в уже вынесенный приговор.
- source_word: χάρις ἐκ τοῦ οὐρανοῦ ἐστι πρὸς αὐτόν
  choice: на этом юноше — благодать с небес
  rationale: Сохраняет богословски значимое χάρις и образ небесной благодати, пребывающей на Иосифе.
theological_decisions:
- issue: Различение κύριος и θεός в рассказе о возвышении Иосифа
  choice: В стихе 6 — «Господь», в стихе 7 — «Бог»
  alternative: Унифицировать оба наименования как «Бог» или «Господь Бог»
  rationale: Смежные стихи используют разные греческие наименования; их различие сохранено, а не сглажено.
- issue: Благословение Богом евреев и небесная благодать на Иосифе
  choice: Сохранены оба утверждения без отождествления или дополнительного объяснения
  alternative: Перефразировать χάρις как общее «везение» или прямо отождествить её с действием Бога евреев
  rationale: Текст связывает ожидаемое благословение с небесной благодатью на Иосифе, но не формулирует их тождество отвлечённо; перевод сохраняет эту напряжённость.
- issue: Резкий переход от предыдущей главы к главе 12
  choice: Передан существующий греческий текст с явным заголовком главы 12 после стиха 8
  alternative: Реконструировать связующий материал или гармонизировать рассказ с Бытие 39
  rationale: Так сохраняется сегментация источника без внесения отсутствующих слов из канонического повествования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён там, где греческий текст шероховат, но смысловые неопределённости отмечены, а рабский статус, смена божественных наименований и небесная «благодать» не смягчены.
