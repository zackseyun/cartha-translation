  verdict: revise
  source_fidelity: В ст. 14:4 исходное ὁρᾶν με ἐν πόθῳ ἁμαρτίας означает, что женщина хотела видеть самого Иосифа «в/с греховным желанием», а не «увидеть, как я возжелаю греха». В 15:3 οὐκ οἶδα — просто «не знаю», без добавленного «об этом». В 15:4 следует сохранить образ «в их руках». Необычное ἐκδίκησιν κινδύνου в 15:5 действительно требует примечания, но основной текст не должен однозначно сводить его к возмездию «за причинённое зло».
  naturalness: Предлагаемая редакция сохраняет современный литературный русский и умеренно библейский регистр. «Охваченного греховным желанием», «в их руках» и «страшное возмездие» естественны в повествовательном контексте. Нумерация 14:4–6 устранит возможную неясность при публикации отрывка, включающего окончание предыдущей главы.
  terminology: «Раб», «торговец», «вретище и пепел», «пред Богом и людьми», «суд Потифара» и «измаильтяне» удачны. «Греховное желание» передаёт πόθος ἁμαρτίας, не конкретизируя характер греха. «Страшное возмездие» — осторожный контекстуальный вариант для спорного κινδύνου; примечание сохраняет альтернативы.
