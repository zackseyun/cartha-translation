lexical_decisions:
- source_word: ἐν πόθῳ ἁμαρτίας
  choice: как я возжелаю греха
  rationale: Передаёт желание, направленное ко греху, естественным русским оборотом; синтаксическая связь греческого выражения остаётся трудной, поэтому перевод не уточняет конкретный вид греха.
- source_word: ἠγνόουν
  choice: оставался несведущ
  rationale: Сохраняет значение незнания или неопытности, а не нравственной невиновности как истолкования.
- source_word: μετάβολος
  choice: торговец
  rationale: По контексту это торговец-посредник; «меняла» здесь звучало бы как лицо, обменивающее деньги, что не соответствует сцене.
- source_word: παῖς
  choice: юноша
  rationale: В контексте речь об Иосифе; слово может означать ребёнка, юношу или слугу. «Юноша» естественно и не смешивает его с последующим утверждением о рабском положении.
- source_word: δοῦλος
  choice: раб
  rationale: Прямо передаёт социально-правовое значение δοῦλος и соответствует продаже Иосифа.
- source_word: διελύθη τὰ σπλάγχνα μου
  choice: будто внутренности мои разрываются
  rationale: Сохраняет сильную телесную метафору греческого текста, слегка смягчая её сравнительным оборотом для естественного русского повествования.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: во вретище и пепле
  rationale: Устоявшаяся библейская формула, понятная в данном торжественном регистре.
- source_word: παρὰ Θεῷ καὶ ἀνθρώποις
  choice: пред Богом и людьми
  rationale: Естественная библейская формула, сохраняющая двойное признание величия Иакова.
- source_word: κρίσεως τοῦ Πεντεφρί
  choice: суда Потифара
  rationale: Сохраняет юридически неоднозначное «суд/решение/разбирательство», не заменяя его более узким толкованием.
- source_word: ἐν ἀργυρίῳ ἠγοράσθης ἡμῖν
  choice: мы купили тебя за серебро
  rationale: Естественно передаёт цену покупки и смысл пассивной греческой конструкции.
theological_decisions:
- issue: Мотив молчания Иосифа о братьях
  choice: «чтобы не опозорить своих братьев»
  alternative: «чтобы не посрамить своих братьев»
  rationale: Сохраняет заявленную нравственную мотивацию Иосифа без добавления учения о прощении или оправдания поступка братьев.
- issue: Величие Иакова
  choice: «велик пред Богом и людьми»
  alternative: «почитаем Богом и людьми»
  rationale: Формально сохраняет μέγας и не объясняет, означает ли величие благоволение, репутацию, силу или статус.
- issue: Возмездие Иакова
  choice: «возмездие за причинённое зло» с примечанием
  alternative: «опасное возмездие»
  rationale: Греческое ἐκδίκησιν κινδύνου необычно и допускает разные связи. Основной текст передаёт вероятный смысл, а примечание сохраняет текстовую неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Сохранены традиционные формы «земля Ханаанская», «во вретище и пепле», «пред Богом», но синтаксис сделан понятным современному читателю. Стихи 14:4–6 включены как продолжение предыдущей главы, затем явно обозначено начало 15-й главы.
