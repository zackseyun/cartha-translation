base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/005/002.yaml
  text: 'So when I heard this, I tore my garments and said to her, “Woman, have reverence for God, and do not do this evil deed, lest you be destroyed. For know this also: I will tell everyone of this scheme of yours.”'
translation:
  language: ru
  text: 'Итак, услышав это, я разорвал на себе одежды и сказал ей: «Женщина, убойся Бога и не совершай этого злого поступка, чтобы тебя не уничтожили. И знай: я всем расскажу об этом твоём замысле».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέρρηξα τὰ ἱμάτιά μου
  choice: я разорвал на себе одежды
  rationale: Передаёт жест раздирания собственных одежд как знак потрясения; оборот естественен для русского библейского повествования.
- source_word: αἰδέσθητι τὸν Θεόν
  choice: убойся Бога
  rationale: Глагол выражает благоговейный страх, почтение и стыд перед Богом; «убойся Бога» кратко сохраняет религиозно-нравственный оттенок исходного выражения.
- source_word: τὴν πρᾶξιν ταύτην τὴν πονηράν
  choice: этого злого поступка
  rationale: Точно передаёт πρᾶξις как поступок/деяние и πονηράν как нравственно злое; определения «беззаконный» в данном греческом тексте нет.
- source_word: ἵνα μὴ ἐξολοθρευθῇς
  choice: чтобы тебе не погибнуть
  rationale: Сохраняет предупреждение о гибели, не уточняя действующее лицо и способ уничтожения, которые в пассивной форме не названы.
- source_word: ἐπίνοιάν σου ταύτην
  choice: об этом твоём замысле
  rationale: ἐπίνοια здесь обозначает намерение или замысел; указательное местоимение и принадлежность переданы явно.
- source_word: ἐξαγγελῶ πᾶσιν
  choice: я всем расскажу
  rationale: Естественно передаёт открытое сообщение или оглашение всем, без излишне официального оттенка слова «донесу».
theological_decisions:
- issue: Значение αἰδέσθητι в отношении Бога
  choice: убойся Бога
  alternative: постыдись перед Богом / прояви почтение к Богу
  rationale: Выбранная формулировка сохраняет традиционно понятный призыв к благоговейному страху Божьему, хотя греческое слово также включает оттенки стыда и почтения.
- issue: Неуказанный деятель при ἐξολοθρευθῇς
  choice: чтобы тебе не погибнуть
  alternative: чтобы ты не была уничтожена
  rationale: Инфинитивная русская конструкция не вводит Бога явно как деятеля и сохраняет неопределённость греческого страдательного залога.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сделан естественным и ясным; архаизирующий глагол «убойся» сохранён как широко узнаваемая формула, точно подходящая религиозному контексту.
