  text: Καὶ *ἀνεχώρησεν, ἐπιθάλπουσά με δώροις²¹ καὶ *ἀπολαύσεσι πάσαις²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/005/004.yaml
  text: And she went away, enticing me with gifts and every kind of pleasure.
translation:
  language: ru
  text: И она удалилась, прельщая меня подарками и всевозможными удовольствиями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: удалилась
  rationale: Передаёт значение ухода или отступления, сохраняя несколько более возвышенный повествовательный регистр, чем разговорное «ушла».
- source_word: ἐπιθάλπουσά
  choice: прельщая
  rationale: Передаёт попытку привлечь и соблазнить посредством благ, не добавляя отсутствующей в греческом тексте цели или результата.
- source_word: δώροις
  choice: подарками
  rationale: Прямой и естественный современный эквивалент дательного множественного числа.
- source_word: ἀπολαύσεσι πάσαις
  choice: всевозможными удовольствиями
  rationale: Естественно передаёт полноту выражения «всеми удовольствиями», то есть удовольствиями всякого рода.
theological_decisions: []
