  language: ru
  text: Тогда она, испугавшись, умоляла меня не разглашать этот замысел.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φοβηθεῖσα
  choice: испугавшись
  rationale: Аористное причастие передаёт предшествующую или сопутствующую реакцию страха; естественный русский деепричастный оборот сохраняет связь с последующей просьбой.
- source_word: ἠξίου με
  choice: стала умолять меня
  rationale: В данном контексте ἀξιόω означает настойчиво просить; «умолять» естественно передаёт силу просьбы, а «стала» отражает имперфект без тяжеловесного буквального воспроизведения длительности.
- source_word: ἐξαγγελῶ
  choice: рассказывать
  rationale: Глагол означает сообщить, разгласить или донести. Нейтральное «рассказывать» сохраняет широту значения и не вводит отсутствующую в тексте официальную инстанцию.
- source_word: ἐπίνοιαν ταύτην
  choice: об этом замысле
  rationale: ἐπίνοια здесь обозначает намерение или замысел; «замысел» сохраняет контекстуально отрицательный оттенок, не усиливая его до «заговора».
