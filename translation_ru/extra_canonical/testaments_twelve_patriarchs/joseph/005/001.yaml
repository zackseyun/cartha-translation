base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/005/001.yaml
  text: And again, at another time, she said to me, “If you do not want to commit adultery, I will kill my husband with poison and take you as a husband.”
translation:
  language: ru
  text: 'И снова, в другой раз, она сказала мне: «Если ты не хочешь прелюбодействовать, я отравлю своего мужа и возьму тебя в мужья».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἑτέρῳ χρόνῳ
  choice: в другой раз
  rationale: 'Естественно передаёт временное значение выражения: «в иное время / в другой раз».'
- source_word: μοιχεῦσαι
  choice: прелюбодействовать
  rationale: Сохраняет прямое нравственно-религиозное значение греческого глагола, не смягчая его до общего «изменить».
- source_word: ἀνελῶ τὸν ἄνδρα μου φαρμάκῳ
  choice: я отравлю своего мужа
  rationale: Греческое выражение буквально означает «убью своего мужа ядом»; русский глагол «отравлю» кратко и естественно передаёт способ и предполагаемый смертельный исход.
- source_word: λήψομαί σε εἰς ἄνδρα
  choice: возьму тебя в мужья
  rationale: Устойчивое современное русское выражение точно передаёт «возьму тебя как мужа», не добавляя отсутствующего в греческом притяжательного местоимения.
