base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/003.yaml
  text: And Pentephris said to him, “From where, then, is this Hebrew boy?” And he said, “The Ishmaelites entrusted him to me until they return.”
translation:
  language: ru
  text: 'И Пентефрий спросил его: «Откуда же этот еврейский юноша[a]?» Тот ответил: «Измаильтяне доверили его мне, пока не вернутся».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «слуга»; греческое слово может также обозначать раба.'
    reason: Сохраняет реальную многозначность греческого παῖς.
lexical_decisions:
- source_word: Πεντεφρής
  choice: Пентефрий
  rationale: Передача греческой формы собственного имени без отождествления и замены его библейским именем Потифар.
- source_word: πόθεν ⌜οὖν⌉ ἐστιν
  choice: Откуда же
  rationale: Естественно передаёт вопрос о происхождении или месте, откуда прибыл человек, сохраняя значение частицы οὖν.
- source_word: ὁ παῖς ὁ Ἑβραῖος
  choice: этот еврейский юноша[a]
  rationale: В данном вопросе παῖς естественно понимается как обозначение молодого человека, но слово допускает также значение слуги или раба; эта неоднозначность отмечена в сноске.
- source_word: παρέθεντό μοι αὐτόν
  choice: доверили его мне
  rationale: Передаёт смысл вверения человека на попечение, не добавляя отсутствующей в греческом тексте оценки.
- source_word: ἕως ὅτου ἐπιστρέψωσιν
  choice: пока не вернутся
  rationale: 'Современная и точная передача временного предела: до возвращения измаильтян.'
theological_decisions:
- issue: Статус Иосифа, выраженный словом παῖς
  choice: В основном тексте — «юноша», с указанием лексической неоднозначности в сноске
  alternative: «слуга» или «раб»
  rationale: Греческое слово само по себе может обозначать и мальчика/юношу, и слугу/раба. Контекст вопроса позволяет выбрать естественное русское «юноша», однако социальный оттенок нельзя исключать, поэтому он сохранён в примечании, а не устранён молча.
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Историческая форма имени сохранена; речь персонажей звучит естественно и достойно. Настоящее историческое λέγει передано прошедшим временем для нормального русского повествования.
