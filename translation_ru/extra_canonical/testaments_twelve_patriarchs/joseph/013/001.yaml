  text: But Pentephris, persuaded by her words, ordered the broker to come, and said to him, “What is this that I hear concerning you, that you steal souls from the land of Canaan and sell them as servants?”
translation:
  language: ru
  text: 'А Пентефрис, поверив её словам, велел перекупщику прийти и сказал ему: «Что это я слышу о тебе? Ты похищаешь людей из земли Ханаанской и перепродаёшь их в рабство?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πεντεφρὶς
  choice: Пентефрис
  rationale: Транслитерация греческой формы имени, согласованная с исходным текстом.
- source_word: πεισθεὶς τοῖς λόγοις αὐτῆς
  choice: поверив её словам
  rationale: 'Естественно передаёт причинно-обстоятельственный смысл причастия πεισθείς: он поддался убеждению её слов.'
- source_word: τὸν μετάβολον
  choice: перекупщика
  rationale: В контексте продажи Иосифа обозначает посредника-торговца, перепродающего приобретённого человека.
- source_word: ψυχὰς
  choice: людей
  rationale: Хотя буквально это «души», здесь слово обозначает человеческие личности; русское «людей» естественно и не создаёт ложного представления о похищении бесплотных душ.
- source_word: εἰς παῖδας μεταπωλεῖς
  choice: перепродаёшь их в рабство
  rationale: μεταπωλεῖς означает последующую продажу или перепродажу, а εἰς παῖδας указывает на продажу людей в положение слуг или рабов.
theological_decisions:
- issue: Передача ψυχὰς
  choice: людей
  alternative: души
  rationale: В данном обвинении речь идёт о похищении и продаже людей; выбор не вносит богословского толкования природы души и сохраняет смысл контекста.
- issue: Статус παῖδας
  choice: в рабство
  alternative: в услужение / как слуг
  rationale: Контекст торговли похищенными людьми предполагает несвободное состояние. При этом формулировка описывает социальный статус, не добавляя конфессиональной оценки.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Реплика оформлена естественно для прямой речи; «земля Ханаанская» сохраняет библейский регистр, а «перекупщик» ясно обозначает роль посредника.
