- source_word: Τῶν Ἰσμαηλιτῶν
  choice: «Измаильтян»
  rationale: Родительный множественного числа служит эллиптическим ответом на вопрос «Чьих?»; русская форма сохраняет ту же краткость и синтаксическую связь.
- source_word: λέγει / λέγω
  choice: «спросил» / «ответил»
  rationale: 'По функции реплик в диалоге это естественные русские соответствия: первое высказывание является вопросом, второе — ответом; содержание не расширяется.'
