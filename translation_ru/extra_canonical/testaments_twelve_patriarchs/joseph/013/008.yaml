  text: '*Ὁ δὲ εἶπε⁴⁷· Πῶς αὐτῶν ἐγένου⁴⁸ δοῦλος; καὶ⁴⁹ εἶπον· Ὅτι ἐκ γῆς⁵⁰ Χαναὰν ἐπριάσαντό⁵¹ με.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/008.yaml
  text: But he said, “How did you become their servant?” And I said, “They bought me from the land of Canaan.”
translation:
  language: ru
  text: 'Но он спросил: «Как ты стал их рабом?» Я ответил: «Они купили меня из земли Ханаанской».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλος
  choice: рабом
  rationale: Прямое соответствие греческому слову, обозначающему человека в рабском положении; «слугой» здесь неоправданно смягчило бы смысл.
- source_word: ἐκ γῆς Χαναὰν
  choice: в земле Ханаанской
  rationale: В контексте глагола покупки ἐκ естественно указывает на место, откуда Иосиф был приобретён; по-русски формулировка «купили меня в земле Ханаанской» ясна и не создаёт впечатления, будто была куплена сама земля.
- source_word: εἶπε / εἶπον
  choice: спросил / ответил
  rationale: 'Контекстуальная передача речевых глаголов естественным русским языком: первая реплика является вопросом, вторая — ответом.'
