  text: '*Εἶπε δὲ πρός με⁵²· ⌜Ὄντως⌉⁵³ ψεύδῃ⁵⁴. Καὶ ⌜εὐθὺς⌉⁵⁵ *ἐκέλευσε κἀμὲ γυμνὸν⁵⁶ τύπτεσθαι.'
