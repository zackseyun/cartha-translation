  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/009.yaml
  text: But he said to me, “You are truly lying.” And immediately he ordered me also to be stripped naked and beaten.
translation:
  language: ru
  text: 'Но он сказал мне: «Ты и в самом деле лжёшь». И тотчас приказал также раздеть меня донага и бить.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὄντως
  choice: и в самом деле
  rationale: Передаёт усилительное значение наречия естественным современным русским выражением.
- source_word: ψεύδῃ
  choice: лжёшь
  rationale: Прямо передаёт настоящее время и обвинительный характер греческого глагола.
- source_word: εὐθὺς
  choice: тотчас
  rationale: Сохраняет значение немедленности и соответствует достойному повествовательному регистру.
- source_word: κἀμέ
  choice: также ... меня
  rationale: Передаёт слияние καὶ ἐμέ и смысл включения Иосифа в число подвергнутых наказанию.
- source_word: γυμνὸν τύπτεσθαι
  choice: раздеть меня донага и бить
  rationale: Естественно выражает приказ подвергнуть говорящего избиению в обнажённом виде, не устраняя последовательность действий, подразумеваемую контекстом.
