  text: And when I was brought in, I bowed down to Pentephris, for he was third in rank among Pharaoh’s rulers.
translation:
  language: ru
  text: Когда меня ввели, я поклонился Пентефрию, потому что среди правителей фараона он занимал третье место по положению.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσαχθείς
  choice: когда меня ввели
  rationale: Естественно передаёт обстоятельственный аорист страдательного залога, сохраняя последовательность событий.
- source_word: προσεκύνησα
  choice: я поклонился
  rationale: В контексте придворного обращения обозначает почтительный поклон, без обязательного смысла богопоклонения.
- source_word: Πεντεφρῇ
  choice: Пентефрию
  rationale: Передача греческой формы имени в русском дательном падеже.
- source_word: τρίτος ... ἐν ἀξιώματι
  choice: занимал третье место по положению
  rationale: Передаёт ранг или служебное положение, не уточняя искусственно конкретную должность.
- source_word: παρὰ τῶν Φαραὼ ἀρχόντων
  choice: среди правителей фараона
  rationale: Следует смыслу текста с учётом редакционной реконструкции ἀρχόντων и передаёт принадлежность к кругу фараоновых сановников.
