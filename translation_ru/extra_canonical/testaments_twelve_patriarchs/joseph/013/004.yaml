  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/004.yaml
  text: But he did not believe him; rather, he ordered him to be beaten naked. And when he persisted in these words, Pentephris said, “Then let the young man be brought.”
translation:
  language: ru
  text: 'Но тот не поверил ему и велел бить его нагим. Когда же он продолжал настаивать на этих словах, Пентефрий сказал: «Тогда пусть приведут юношу».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γυμνὸν τύπτεσθαι
  choice: раздеть его и бить
  rationale: 'Передаёт предикативное γυμνόν при пассивном инфинитиве естественным русским оборотом: наказание совершается над обнажённым человеком.'
- source_word: Ἐπιμένοντος ... αὐτοῦ τούτοις τοῖς λόγοις
  choice: когда же он продолжал настаивать на этих словах
  rationale: Сохраняет значение упорного продолжения прежнего утверждения, выраженное ἐπιμένω, и референцию к сказанным словам.
- source_word: Ἐναχθήτω
  choice: пусть приведут
  rationale: Естественно передаёт повелительное значение пассивного аориста без излишне буквального «да будет приведён».
- source_word: ὁ νεανίσκος
  choice: юношу
  rationale: Современный литературный эквивалент для молодого мужчины; определённость восстанавливается из контекста.
- source_word: ὁ Πεντεφρής
  choice: Пентефрий
  rationale: Транслитерация греческой формы имени, согласованная с данным источником и английским консультационным слоем.
