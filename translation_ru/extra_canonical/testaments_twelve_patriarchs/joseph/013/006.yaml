  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/006.yaml
  text: And after separating me from him, he said to me, “Are you a servant or free?” And I said, “A servant.”
translation:
  language: ru
  text: 'И, отведя меня от него, он спросил меня: «Ты раб или свободный?» Я ответил: «Раб».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαχωρίσας
  choice: отведя
  rationale: Причастие обозначает отделение Иосифа от другого человека; «отведя» естественно передаёт действие в данном повествовательном контексте.
- source_word: Δοῦλος
  choice: раб
  rationale: В противопоставлении ἐλεύθερος это обозначение несвободного правового и социального положения, поэтому «раб» точнее, чем более широкое «слуга».
- source_word: ἐλεύθερος
  choice: свободный
  rationale: Сохраняет прямое противопоставление рабу и естественно звучит в вопросе о статусе.
- source_word: λέγει
  choice: спросил
  rationale: Хотя буквально форма означает «говорит», последующая прямая речь является вопросом; русское «спросил» естественно и точно передаёт речевой акт.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с лаконичным повествовательным синтаксисом. Историческое настоящее λέγει передано прошедшим временем для естественной русской последовательности. Местоимение αὐτοῦ сохранено без уточнения референта, чтобы не устранять присущую контексту зависимость.
