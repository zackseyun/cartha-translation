  source_fidelity: 'Перевод точно передаёт βασовый смысл греческого текста: после отделения Иосифа от другого лица к нему обращаются с вопросом о его статусе, и он отвечает, что он раб. «Отведя меня от него» является допустимой контекстуальной передачей διαχωρίσας με ἀπ᾿ αὐτοῦ; референт «него» намеренно не уточнён. Передача исторического настоящего λέγει прошедшим временем естественна для русского повествования.'
