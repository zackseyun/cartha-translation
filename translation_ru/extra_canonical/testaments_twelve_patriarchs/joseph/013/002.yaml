  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/002.yaml
  text: But the broker fell at his feet and begged, saying, “I beg you, lord, I do not know what you are saying.”
translation:
  language: ru
  text: 'Но посредник пал к его ногам и умолял: «Прошу тебя, господин, я не знаю, о чём ты говоришь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετάβολος
  choice: посредник
  rationale: В данном повествовательном контексте слово обозначает посредника в сделке; «посредник» точнее и естественнее, чем буквальные либо устаревшие варианты.
- source_word: ἐδέετο / Δέομαί σου
  choice: стал умолять / Прошу тебя
  rationale: 'Передана повторяющаяся лексика просьбы, но по-русски использованы контекстуально естественные формы без тяжеловесного повтора «умолял, говоря: умоляю».'
- source_word: κύριε
  choice: господин
  rationale: Здесь это почтительное обращение к человеку, а не божественный титул; строчная буква сохраняет данное различие.
- source_word: οὐκ οἶδα ὃ λέγεις
  choice: я не знаю, о чём ты говоришь
  rationale: Естественное русское соответствие греческой конструкции, сохраняющее отрицание знания и содержание речи.
