  text: But I, understanding that the spirit of Beliar was troubling her, prayed to the Lord and said to her,
translation:
  language: ru
  text: 'Но я, поняв, что дух Велиара тревожит её, помолился Господу и сказал ей:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νοήσας
  choice: поняв
  rationale: Передаёт осознанное распознавание причины происходящего естественным современным русским языком.
- source_word: τὸ πνεῦμα τοῦ Βελίαρ
  choice: дух Велиара
  rationale: Сохраняет буквальную конструкцию греческого текста и традиционную форму имени.
- source_word: ἐνοχλεῖ
  choice: тревожит
  rationale: Передаёт продолжающееся беспокоящее воздействие, не уточняя его характер сверх исходного текста.
- source_word: προσευξάμενος τῷ Κυρίῳ
  choice: помолился Господу
  rationale: Естественно передаёт греческое причастие предшествующего действия и дательный адресата.
- source_word: εἶπον πρὸς αὐτήν
  choice: сказал ей
  rationale: Идиоматический русский эквивалент греческой конструкции со значением обращения к ней.
theological_decisions:
- issue: Характер воздействия духа Велиара
  choice: тревожит её
  alternative: мучит её / досаждает ей
  rationale: Выбрана нейтральная формулировка, сохраняющая широту значения ἐνοχλεῖ и не вводящая более определённого представления об одержимости или мучении.
translation_notes:
  register: Современный литературный русский язык; повествовательный тон остаётся сдержанным и достойным. Двоеточие сохраняет незавершённый переход к последующей прямой речи.
