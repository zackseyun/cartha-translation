  text: Then, when she found an opportunity, she rushed in to me while her husband was still outside, and said to me, “I am choking, or I will throw myself down a cliff, if you do not lie with me.”
translation:
  language: ru
  text: 'Тогда, улучив удобный момент, она ворвалась ко мне, пока её муж ещё был снаружи, и сказала мне: «Я задыхаюсь — или брошусь с обрыва, если ты не ляжешь со мной».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐκαιρίαν λαβοῦσα
  choice: улучив удобный момент
  rationale: Естественно передаёт буквальный смысл «воспользовавшись удобным случаем» и подчёркивает намеренность действия.
- source_word: εἰσεπήδησε πρός με
  choice: ворвалась ко мне
  rationale: Передаёт резкое, стремительное движение, выраженное глаголом εἰσεπήδησε.
- source_word: ἔτι ἔξω ὄντος τοῦ ἀνδρὸς αὐτῆς
  choice: пока её муж ещё был снаружи
  rationale: Сохраняет пространственное значение ἔξω без уточнения места, которого нет в греческом тексте.
- source_word: Ἄγχομαι
  choice: Я задыхаюсь
  rationale: Сохраняет форму настоящего времени и основной телесный образ глагола ἄγχομαι; контекст допускает эмоциональное удушье, но не требует его разъяснять.
- source_word: εἰς κρημνὸν ῥίπτω ἐμαυτήν
  choice: брошусь с обрыва
  rationale: Естественная русская передача угрозы бросить себя вниз с кручи; настоящее время в греческой угрозе идиоматично передано будущим.
- source_word: συγγενῇ μετ᾿ ἐμοῦ
  choice: ляжешь со мной
  rationale: Прямо и достойно передаёт сексуальный смысл выражения, не прибегая ни к расплывчатому эвфемизму, ни к грубой лексике.
