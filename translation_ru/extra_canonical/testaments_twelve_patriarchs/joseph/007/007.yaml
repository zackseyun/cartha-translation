review_pass:
  verdict: revise
  source_fidelity: 'Требуется небольшая, но существенная правка в заключительной части. Греческое ἀπολέσεις — будущее время, 2-е лицо ед. числа: «ты уничтожишь/погубишь», а не безличное «память ... исчезнет». Остальные смысловые элементы переданы точно: обращение ἄθλια, двойное смятение, образ самоослепления грехами, условие самоубийства, статус Астефо как наложницы и соперницы, а также угроза детям.'
  naturalness: Текст звучит естественно и соответствует современному литературному русскому. Конструкция с приложениями «Астефо, наложница твоего мужа, твоя соперница» ясна. Замена финального безличного оборота на личный немного усилит синтаксическую связь с греческим без ущерба для естественности.
  terminology: «Наложница» точно передаёт παλλακή в историческом контексте; «соперница» адекватно передаёт ἀντίζηλος. Передача имени «Астефо» допустима для Ἀστηθώ; примечание уместно отмечает вариантность формы. Богословски нагруженных терминов нет.
