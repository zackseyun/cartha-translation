revisions:
- from: '«Зачем ты, несчастная, тревожишься и мечешься, ослепляя себя грехами? Помни: если ты убьёшь себя, Астефо[a], наложница твоего мужа, твоя соперница, будет бить твоих детей, и память о тебе исчезнет с земли».'
  to: '«Зачем ты, несчастная, тревожишься и мечешься, ослепляя себя грехами? Помни: если ты убьёшь себя, Астефо[a], наложница твоего мужа, твоя соперница, будет бить твоих детей, и ты уничтожишь память о себе на земле».'
  rationale: Финальная клауза исправлена так, чтобы сохранить личную форму ἀπολέσεις («ты уничтожишь»), тогда как прежнее «память ... исчезнет» необоснованно превращало действие в безличное событие. Иные элементы текста и примечание не нуждаются в изменении.
