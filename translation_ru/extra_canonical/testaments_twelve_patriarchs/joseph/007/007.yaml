base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/007.yaml
  text: “Why, miserable woman, are you disturbed and thrown into turmoil, blinding yourself in sins? Remember that if you kill yourself, Astho, your husband’s concubine, your rival, will beat your children and wipe out your memory from the earth.”
translation:
  language: ru
  text: '«Зачем ты, несчастная, тревожишься и мечешься, ослепляя себя грехами? Помни: если ты убьёшь себя, Астефо[a], наложница твоего мужа, твоя соперница, будет бить твоих детей, и ты уничтожишь память о себе на земле».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Астефо — передача имени Ἀστηθώ; в рукописной традиции и переводах встречаются иные формы этого имени.
    reason: Греческое написание имени допускает различные способы транслитерации; примечание предупреждает читателя о вариантности.
lexical_decisions:
- source_word: ἄθλια
  choice: несчастная
  rationale: Передаёт прямое обращение с оттенком жалости и укоризны, не усиливая его до грубого оскорбления.
- source_word: τάρασσον καὶ θορυβῇ
  choice: тревожишься и мечешься
  rationale: 'Сохраняет парность близких по смыслу глаголов: внутреннюю тревогу и вызванное ею смятенное поведение.'
- source_word: ἐν ἁμαρτίαις τυφλώττουσα
  choice: ослепляя себя грехами
  rationale: 'Следует греческой образности и сохраняет неоднозначность оборота: грехи выступают средством или средой самоослепления.'
- source_word: ἀνέλῃς σεαυτήν
  choice: убьёшь себя
  rationale: Ясно передаёт эвфемистическое греческое выражение в данном контексте, не добавляя способа смерти.
- source_word: παλλακή
  choice: наложница
  rationale: Исторически и семантически точное современное обозначение женщины, состоящей с мужчиной в признанной, но не равной браку связи.
- source_word: ἀντίζηλος
  choice: соперница
  rationale: Передаёт женское соперничество в отношениях с одним мужчиной без излишнего уточнения мотива ревности.
- source_word: κονδυλίσει
  choice: будет бить
  rationale: Глагол обозначает нанесение ударов; нейтральное «бить» сохраняет угрозу физического насилия без недоказанной детализации.
- source_word: ἀπολέσεις τὸ μνημόσυνόν σου ἀπὸ τῆς γῆς
  choice: память о тебе исчезнет с земли
  rationale: Естественно передаёт итоговое уничтожение памяти о женщине; непереходная русская конструкция согласуется с тем, что её смерть приведёт к этому результату.
