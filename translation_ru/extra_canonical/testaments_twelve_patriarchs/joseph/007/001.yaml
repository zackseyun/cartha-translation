source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἵνα δὲ⁴⁵ μάθῃς⁴⁶, ὅτι⁴⁷ τῶν⁴⁸ ἐν σωφροσύνῃ θεοσεβούντων⁴⁹ οὐ κατισχύσει⁵⁰ κακία⁵¹ *τῶν ἀσεβούντων⁵². ⌈Ἰδοὺ⌉⁵³ λαβὼν⁵⁴ *ἐξ αὐτοῦ ἐνώπιόν σου ἐσθίων. Καὶ τοῦτο εἰπὼν εἶπον οὕτως⁵⁵. Ὁ Θεὸς τῶν πατέρων μου καὶ ὁ ἄγγελος Ἀβραὰμ⁵⁶ *ἔσται μετ᾽ ἐμοῦ⁵⁷. ⌈Ἔφαγον⌉⁵⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/001.yaml
  text: 'So that you may learn that the wickedness of the ungodly will not prevail over those who fear God with self-control, look: taking some of it in your presence, I will eat. And after saying this, I said thus, “The God of my fathers and the angel of Abraham will be with me.” And I ate.'
translation:
  language: ru
  text: 'Чтобы ты узнала, что зло нечестивых не одолеет тех, кто, соблюдая самообладание, чтит Бога, вот: взяв немного этого, я ем у тебя на глазах. Сказав это, я произнёс: «Бог моих отцов и ангел Авраама будут со мной». И я поел.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνῃ
  choice: в самообладании
  rationale: Передаёт широкий смысл σωφροσύνη — сдержанность, нравственную чистоту и владение собой, — не сужая его исключительно до полового целомудрия.
- source_word: θεοσεβούντων
  choice: тех, кто… чтит Бога
  rationale: Естественно передаёт причастие со значением благоговейного почитания Бога.
- source_word: οὐ κατισχύσει
  choice: не одолеет
  rationale: Сохраняет образ противоборства и значение «не окажется сильнее, не возьмёт верх».
- source_word: κακία τῶν ἀσεβούντων
  choice: зло нечестивых
  rationale: Кратко и непосредственно передаёт нравственное зло, исходящее от людей, не почитающих Бога.
- source_word: ἐνώπιόν σου
  choice: при тебе
  rationale: Передаёт действие в присутствии адресата; форма σου указывает на единственное число.
- source_word: ὁ ἄγγελος Ἀβραάμ
  choice: ангел Авраама
  rationale: Сохраняет необычную и богословски неоднозначную греческую формулировку, не подменяя её выражением «Бог Авраама» или «ангел Бога Авраама».
- source_word: ἔφαγον
  choice: я поел
  rationale: Передаёт завершённое действие аориста и отличает его от предшествующего объявления о намерении съесть пищу.
theological_decisions:
- issue: Связь σωφροσύνη с почитанием Бога
  choice: «кто в самообладании чтит Бога»
  alternative: «богобоязненных и целомудренных»
  rationale: Выбранная формулировка сохраняет грамматическую связь между образом жизни в σωφροσύνη и богопочитанием, а также не ограничивает смысл только сексуальной чистотой.
- issue: Выражение «ангел Авраама»
  choice: сохранить буквально
  alternative: уточнить как «ангел, хранивший Авраама» или «ангел Бога Авраама»
  rationale: Источник не объясняет отношения ангела к Аврааму; уточнение без текстового основания устранило бы подлинную неоднозначность.
translation_notes:
  register: 'Современный литературный русский язык с достойным повествовательным тоном. Обращение передано в женском роде («узнала») по контексту эпизода с женой Потифара. Эллиптическая греческая конструкция ἰδοὺ λαβὼν… ἐσθίων передана как естественное объявление непосредственно следующего действия: «смотри: я возьму… и съем».'
