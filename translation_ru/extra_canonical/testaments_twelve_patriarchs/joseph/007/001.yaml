    issue: Временная форма в описании еды
    rationale: '«Я возьму немного этого и съем» передаёт будущее намерение, тогда как λαβών ... ἐσθίων описывает действие как совершаемое: «взяв ... ем». Ввиду текстовой шероховатости не следует добавлять более определённую временную перспективу.'
  - severity: low
    issue: Связка «в самообладании чтит Бога»
    rationale: Формулировка допустима, но «соблюдая самообладание» звучит по-русски плавнее и сохраняет значение ἐν σωφροσύνῃ.
