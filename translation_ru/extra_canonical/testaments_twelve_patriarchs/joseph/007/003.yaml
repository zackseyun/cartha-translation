source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*ἡ δὲ⁶⁴ συνεθέτό μου⁶⁵ τοῦ⁶⁶ *μηκέτι ποιῆσαι⁶⁷ τὴν ἀσέβειαν ταύτην⁶⁸. **Ἔτι δὲ¹ ἡ καρδία αὐτῆς *ἔκειτο εἰς τὸ κακὸν καὶ περιεβλέπετο ποίῳ τρόπῳ με παγιδεύσῃ· στενάζουσα δὲ †συντόμως συνεπίπτε μὴ ἀσθενοῦσα².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/003.yaml
  text: And she agreed with me no longer to commit this impiety. Yet her heart was still set on evil, and she kept looking around for a way to ensnare me; and groaning, she would suddenly collapse, though she was not actually sick.
translation:
  language: ru
  text: И она согласилась со мной больше не совершать этого нечестия. Но сердце её по-прежнему было устремлено ко злу, и она высматривала, как бы заманить меня в ловушку; стеная, она быстро падала, хотя не испытывала слабости.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «хотя не была больна». Греческое слово может означать слабость, недомогание или болезнь.'
    reason: Сохраняет лексическую широту ἀσθενέω без необоснованного сужения значения в основном тексте.
lexical_decisions:
- source_word: συνεθέτό μου
  choice: согласилась со мной
  rationale: Передаёт значение взаимного соглашения; родительный/местоименный элемент понимается как указание на лицо, с которым она согласилась.
- source_word: ἀσέβειαν
  choice: нечестия
  rationale: Сохраняет нравственно-религиозную окраску слова, не сводя его просто к «злу» или «поступку».
- source_word: ἡ καρδία αὐτῆς ἔκειτο εἰς τὸ κακόν
  choice: сердце её по-прежнему было устремлено ко злу
  rationale: Естественно передаёт устойчивую внутреннюю направленность; «по-прежнему» выражает контекстуальную силу ἔτι.
- source_word: περιεβλέπετο ποίῳ τρόπῳ
  choice: высматривала, как бы
  rationale: Передаёт настойчивый поиск способа действия, сохраняя образ осматривания.
- source_word: παγιδεύσῃ
  choice: заманить меня в ловушку
  rationale: Сохраняет метафору западни и намерение обманом подчинить Иосифа своему замыслу.
- source_word: ἀσθενοῦσα
  choice: была больна
  rationale: В данном контексте притворного обморока естественнее означает физическое недомогание или болезнь; более широкое «была слаба» отмечено в сноске.
theological_decisions:
- issue: Нравственно-религиозная сила ἀσέβεια
  choice: нечестие
  alternative: беззаконие / постыдный поступок
  rationale: «Нечестие» сохраняет религиозно-нравственную оценку оригинала без добавления конкретной конфессиональной трактовки.
