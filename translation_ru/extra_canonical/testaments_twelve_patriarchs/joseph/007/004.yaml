  text: Ἰδὼν δὲ αὐτὴν ὁ *ἀνὴρ αὐτῆς⁴ λέγει⁶ πρὸς αὐτήν⁷· Τί συνέπεσε τὸ πρόσωπόν σου; ⌜πρὸς αὐτὸν⌝⁷ εἶπεν, ⌜ὅτι⌝⁷ *πόνον καρδίας ἐγὼ ἀλγῶ, καὶ οἱ τοῦ πνεύματος στεναγμοὶ συνέχουσί με⁸. *Ὁ δὲ⁹ ἐθεράπευσεν¹⁰ αὐτὴν *ἐν λόγοις¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/004.yaml
  text: And when her husband saw her, he said to her, “What has happened to your face?” She said to him, “I am in pain with anguish of heart, and the groanings of my spirit hold me fast.” And he healed her with words.
translation:
  language: ru
  text: 'Увидев её, муж спросил: «Что случилось с твоим лицом?» Она ответила ему: «Я страдаю от сердечной муки, и стоны моего духа не отпускают меня». И он исцелил её словами.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί συνέπεσε τὸ πρόσωπόν σου;
  choice: Что случилось с твоим лицом?
  rationale: Передаёт необычную греческую конструкцию естественным современным русским вопросом, не уточняя без основания, идёт ли речь о выражении лица или внешнем виде.
- source_word: πόνον καρδίας ἐγὼ ἀλγῶ
  choice: Я страдаю от сердечной муки
  rationale: Сохраняет образ сердца и усиленное выражение страдания, избегая современного медицинского смысла «боли в сердце».
- source_word: οἱ τοῦ πνεύματος στεναγμοὶ συνέχουσί με
  choice: стоны моего духа не отпускают меня
  rationale: Естественно передаёт στεναγμοί и удерживающую, стесняющую силу συνέχω, сохраняя внутренний, духовный характер переживания.
- source_word: ἐθεράπευσεν αὐτὴν ἐν λόγοις
  choice: он исцелил её словами
  rationale: Следует прямому значению аориста и не добавляет отсутствующего в источнике значения попытки; «словами» естественно передаёт инструментальный смысл ἐν λόγοις.
theological_decisions:
- issue: Значение πνεῦμα в описании страдания
  choice: дух
  alternative: душа
  rationale: Формально сохраняет лексическое различие и возможный религиозно-антропологический оттенок, не сводя πνεῦμα к психологическому состоянию.
- issue: Результативность ἐθεράπευσεν
  choice: исцелил
  alternative: пытался исцелить / утешил
  rationale: Греческий текст прямо утверждает действие без показателя попытки; более слабые варианты разрешали бы смысл вопреки источнику.
translation_notes:
  register: Современный литературный русский с достоинством повествовательного регистра. Реплики звучат естественно, но ключевые образы сердца, духа и исцеления сохранены. Стиховые или редакционные номера вариантов из критического текста не включены как не относящиеся к содержанию перевода.
