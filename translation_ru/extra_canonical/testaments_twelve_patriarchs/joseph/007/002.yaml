lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτῆς εἰς τοὺς πόδας μου
  choice: пала ниц к моим ногам
  rationale: Естественно передаёт буквальный образ падения лицом вниз у ног Иосифа, не утяжеляя русскую фразу.
- source_word: κλαίουσα
  choice: и заплакала
  rationale: Личная форма звучит естественнее русского деепричастия и сохраняет одновременную эмоциональную реакцию.
- source_word: ἀναστήσας αὐτήν
  choice: поднял её
  rationale: Передаёт действие Иосифа, который помог ей встать, без добавочных смыслов.
- source_word: ἐνουθέτησα
  choice: вразумил
  rationale: Сохраняет значение наставления с предостережением или исправлением; слово уместно в dignified biblical register.
