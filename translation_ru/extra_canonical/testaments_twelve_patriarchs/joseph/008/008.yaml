id: T12P.JOS.8.8
reference: Testament of Joseph 8:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἐὰν γάρ τις *ὑποπέσῃ πάθει⁵⁰ ἐπιθυμίας⁵¹ καὶ *δουλωθῇ αὐτῷ⁵² ὡς κἀκείνη, κἂν ἀγαθόν⁵³ τι ἀκούσῃ⁵⁴ εἰς *ἐκεῖνο τὸ⁵⁵ πάθος⁵⁶ *ἐκλαμβάνει αὐτὸ⁵⁷ πρὸς *τὴν πονηρὰν ἐπιθυμίαν⁵⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/008.yaml
  text: For if anyone falls under the passion of desire and is enslaved to it, as she also was, even if he hears something good, he takes it in relation to that passion, toward his evil desire.
translation:
  language: ru
  text: Ведь если кто подпадёт под власть страсти вожделения и станет её рабом, как и та женщина, то, даже услышав нечто доброе, он истолкует это применительно к той страсти — в угоду своему порочному вожделению.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποπέσῃ πάθει ἐπιθυμίας
  choice: подпадёт под власть страсти вожделения
  rationale: Передаёт образ подчинения страсти и сохраняет сочетание πάθος и ἐπιθυμία, не сводя их к одному понятию.
- source_word: δουλωθῇ αὐτῷ
  choice: станет её рабом
  rationale: Естественно и выразительно передаёт буквальный образ порабощения страстью.
- source_word: κἀκείνη
  choice: как и та женщина
  rationale: Женский референт местоимения выражен явно, чтобы русская фраза была понятна без утраты отсылки к женщине из контекста.
- source_word: ἀγαθόν τι ἀκούσῃ
  choice: услышав нечто доброе
  rationale: Сохраняет широкое и намеренно неопределённое значение ἀγαθόν τι.
- source_word: εἰς ἐκεῖνο τὸ πάθος ἐκλαμβάνει αὐτό
  choice: истолкует это применительно к той страсти
  rationale: ἐκλαμβάνει здесь обозначает восприятие или истолкование услышанного в рамках господствующей страсти.
- source_word: πρὸς τὴν πονηρὰν ἐπιθυμίαν
  choice: в угоду своему порочному вожделению
  rationale: Передаёт направленность восприятия к дурному желанию; «в угоду» естественно выражает его обслуживающую функцию, а притяжательное местоимение следует смыслу контекста.
theological_decisions:
- issue: Соотношение πάθος и ἐπιθυμία
  choice: страсть вожделения
  alternative: страсть желания
  rationale: Сохранены оба греческих понятия и их нравственно отрицательная окраска в данном контексте без сведения всякого желания как такового к греху.
- issue: Смысл ἐκλαμβάνει
  choice: истолкует
  alternative: воспримет
  rationale: Контекст говорит о том, что даже доброе высказывание получает искажённое толкование под влиянием страсти; при этом перевод не уточняет содержание услышанного.
translation_notes:
  register: Современный литературный русский язык с достоинством нравоучительного текста. Синтаксис упрощён лишь настолько, чтобы длинная условная конструкция оставалась ясной; образ рабства и повтор ключевых понятий сохранены.
