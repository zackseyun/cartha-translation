base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/001.yaml
  text: So I say to you, my children, that it was about the sixth hour when she left me. And after bending my knee to the Lord all day and all night, toward dawn I rose, weeping and asking for deliverance from her.
translation:
  language: ru
  text: 'Итак, говорю вам, дети мои: было около шестого часа, когда она ушла от меня. Преклонив колени перед Господом, я оставался так весь день и всю ночь; на рассвете я встал, плача и прося об избавлении от неё.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥρα ἦν ὡσεὶ ἕκτη
  choice: было около шестого часа
  rationale: Сохраняет древний способ обозначения времени и приблизительность ὡσεὶ, не переводя его без пояснений в современное время суток.
- source_word: ἐξῆλθεν ἀπ᾽ ἐμοῦ
  choice: она ушла от меня
  rationale: Естественно передаёт буквальное «вышла/удалилась от меня» в данном повествовательном контексте.
- source_word: κλίνας γόνυ πρὸς Κύριον
  choice: преклонив колени пред Господом
  rationale: Русская молитвенная формула естественна и достойна; множественное «колени» идиоматично передаёт греческое единственное собирательного характера.
- source_word: αἰτῶν λύτρωσιν ἐξ αὐτῆς
  choice: прося избавить меня от неё
  rationale: Передаёт λύτρωσιν как освобождение от опасного влияния или преследования этой женщины, не уточняя способ избавления.
theological_decisions:
- issue: Адресат молитвы в πρὸς Κύριον
  choice: пред Господом
  alternative: Господу
  rationale: Сохраняется прямое обозначение Господа без конфессионального уточнения личности или титула.
- issue: Характер λύτρωσις
  choice: избавить меня
  alternative: освободить меня
  rationale: «Избавить» естественно в контексте молитвы и сохраняет религиозный оттенок слова, не превращая его в специальный догматический термин.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Конструкция «провёл так» добавлена для естественной связи длительного коленопреклонения со словами «весь день и всю ночь», не меняя содержания.
