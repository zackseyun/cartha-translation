base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/004.yaml
  text: But she, having seized this while I was naked, slandered me; and when her husband came, he threw me into prison in his house, and on the next day, after flogging me, he sent me into Pharaoh’s dungeon.
translation:
  language: ru
  text: Она же, схватив мою одежду[a], оклеветала меня. Когда пришёл её муж, он бросил меня в темницу при своём доме, а на следующий день высек меня и отправил в темницу фараона.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «схватив его»; речь идёт о предмете одежды, упомянутом перед этим.'
    reason: Греческое указательное местоимение отсылает к предмету из предшествующего контекста; примечание объясняет экспликацию референта в русском переводе.
lexical_decisions:
- source_word: κρατήσασα τοῦτον
  choice: схватив мою одежду
  rationale: 'Буквально: «схватив его/это»; указательное местоимение мужского рода отсылает к названному в предшествующем контексте предмету одежды. Явное обозначение референта делает русский текст понятным, не добавляя отсутствующего в данной греческой фразе указания «когда я был наг».'
- source_word: ἐσυκοφάντησέ με
  choice: оклеветала меня
  rationale: Глагол означает ложное обвинение или клевету; «оклеветала» естественно и точно передаёт смысл.
- source_word: φυλακὴν ἐν τῷ αὐτοῦ οἴκῳ
  choice: в темницу при своём доме
  rationale: Сохраняет указание, что место заключения находилось в доме или при доме её мужа, не создавая впечатления обычной комнаты.
- source_word: μαστιγώσας
  choice: велел высечь меня
  rationale: Причастие буквально допускает «высекши»; по-русски каузативная формулировка естественна для хозяина дома, однако не утверждает орудие наказания.
- source_word: εἰρκτήν
  choice: темницу
  rationale: Передаёт строгое место заключения; повтор слова стилистически уместен и не вводит искусственного различия между близкими греческими обозначениями заключения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский с достоинством повествовательного регистра. «Темница» выбрана вместо разговорного «тюрьма», поскольку речь идёт о древнем домашнем и царском заключении; синтаксис упрощён без устранения последовательности событий.
