source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Οὐκ ἔγνω δὲ αὐτὴ⁴⁵ ὅτι διὰ τὸν⁴⁶ Κύριόν⁴⁷ μου εἶπον οὕτως ἐγώ⁴⁸, καὶ οὐχὶ⁴⁹ δι᾽ αὐτήν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/007.yaml
  text: But she did not know that I spoke thus because of my Lord, and not because of her.
translation:
  language: ru
  text: Но она не знала, что я сказал так ради моего Господа, а не ради неё.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐκ ἔγνω
  choice: она не знала
  rationale: Прямо передаёт отрицательную форму аориста γινώσκω без добавления оттенка, отсутствующего в греческом тексте.
- source_word: διὰ τὸν Κύριόν μου
  choice: ради моего Господа
  rationale: Передаёт διά с винительным как основание или побуждение поступка; «ради» естественно по-русски и сохраняет направленность на верность Господу.
- source_word: εἶπον οὕτως
  choice: я сказал так
  rationale: Естественный современный порядок слов, точно передающий глагол речи и наречие οὕτως.
- source_word: οὐχὶ δι᾽ αὐτήν
  choice: а не ради неё
  rationale: Сохраняет явное противопоставление и параллелизм двух оборотов с διά.
theological_decisions:
- issue: Значение обращения «мой Господь»
  choice: мой Господь
  alternative: Господь
  rationale: Притяжательное местоимение μου присутствует в греческом источнике и важно для личного характера верности Иосифа; оснований опускать его нет.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и dignified, синтаксис близок к греческому, но естественен для обычного читателя.
