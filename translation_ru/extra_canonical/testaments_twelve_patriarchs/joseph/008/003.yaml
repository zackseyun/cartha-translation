  text: Ὡς ⌜οὖν⌉¹⁴ εἶδον¹⁵ ὅτι μαινομένη¹⁶ κρατεῖ μου τὸν χιτῶνα, καταλείψας αὐτὸν [καὶ ἐκτιναξάμενος] ἔφυγον γυμνός¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/003.yaml
  text: Therefore, when I saw that she, in her frenzy, was seizing my tunic, leaving it [and shaking it off], I fled naked.
translation:
  language: ru
  text: Итак, когда я увидел, что она в исступлении держит мой хитон, я, оставив его [и стряхнув его с себя][a], убежал нагим.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «и стряхнув его с себя» в греческом издании заключены в квадратные скобки, что указывает на сомнение в их текстовой засвидетельствованности.
    reason: Сохранить отмеченную источником текстологическую неопределённость, не выдавая спорные слова за бесспорную часть текста.
lexical_decisions:
- source_word: μαινομένη
  choice: в исступлении
  rationale: Передаёт состояние неистовой, безрассудной одержимости без современного клинического оттенка слова «безумная».
- source_word: κρατεῖ μου τὸν χιτῶνα
  choice: держит мой хитон
  rationale: Сохраняет значение продолжающегося удерживания и конкретное название одежды; «хитон» уместен в древнем контексте и понятен современному читателю.
- source_word: καταλείψας αὐτόν
  choice: оставив его
  rationale: Местоимение относится к хитону; краткая формулировка сохраняет прямоту греческого текста.
- source_word: ἐκτιναξάμενος
  choice: стряхнув его с себя
  rationale: Средний залог передан как действие, которым Иосиф освобождается от удерживаемого хитона; квадратные скобки оригинального издания сохранены.
- source_word: γυμνός
  choice: нагим
  rationale: Прямо передаёт отсутствие одежды после оставления хитона и сохраняет достоинство повествовательного регистра.
theological_decisions: []
