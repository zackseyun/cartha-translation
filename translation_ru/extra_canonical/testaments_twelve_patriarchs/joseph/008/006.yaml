- from: 'И она сказала мне: «Вот, значит, ты любишь меня. Этого мне довольно. Только позаботься о моей жизни и о моих детях, и тогда у меня будет надежда получить и то, чего я желаю».'
  to: 'И она сказала мне: «Вот, значит, ты любишь меня. Пусть этого будет мне довольно. Только позаботься о моей жизни и о моих детях, и у меня есть надежда также получить то, чего я желаю».'
