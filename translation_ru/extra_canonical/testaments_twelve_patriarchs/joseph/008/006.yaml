base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/006.yaml
  text: 'And she said to me, “See then, you love me. Let this be enough for me: only take thought for my life and for my children, and I have hope that I shall also obtain my desire.”'
translation:
  language: ru
  text: 'И она сказала мне: «Вот, значит, ты любишь меня. Пусть этого будет мне довольно. Только позаботься о моей жизни и о моих детях, и у меня есть надежда также получить то, чего я желаю».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: сказала
  rationale: Греческая форма настоящего времени сама по себе не указывает на пол говорящего; женский род определяется повествовательным контекстом. В русском повествовании естественно употребить прошедшее время.
- source_word: ἀντιποιῆσαι τῆς ζωῆς μου καὶ τῶν τέκνων μου
  choice: позаботься о моей жизни и о моих детях
  rationale: ἀντιποιέομαι с родительным падежом здесь выражает деятельную заботу и защиту интересов; «позаботься» ясно и естественно передаёт смысл без излишней юридической окраски.
- source_word: ἀπολαῦσαι καὶ τῆς ἐπιθυμίας μου
  choice: получить и то, чего я желаю
  rationale: Передаёт надежду добиться желаемого, сохраняя намеренную недосказанность предмета желания и не усиливая чувственный оттенок глагола ἀπολαύω сверх требований контекста.
