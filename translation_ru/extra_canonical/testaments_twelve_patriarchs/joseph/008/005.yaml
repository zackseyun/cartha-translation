source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ ὡς²³ ἤμην ἐν τοῖς δεσμοῖς²⁴, ἡ Αἰγυπτία συνείχετο²⁵ ἀπὸ τῆς λύπης· ἐλθοῦσα δὲ ἐπηκροᾶτό μου πῶς ηὐχαρίστουν τῷ Κυρίῳ καὶ ὕμνουν ἐν οἴκῳ *τοῦ σκότους²⁶, καὶ ἔχαιρον ἐν *ἱλαρᾷ φωνῇ²⁷ δοξάζων τὸν Θεόν μου, ὅτι διὰ προφάσεως ἀπηλλάγην²⁸ τῆς Αἰγυπτίας.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/005.yaml
  text: And while I was in chains, the Egyptian woman was held together by grief; and when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and rejoiced with a cheerful voice, glorifying my God, because by a pretext I had been delivered from the Egyptian woman.
translation:
  language: ru
  text: И пока я был в оковах, египтянка была охвачена скорбью. Придя, она стала прислушиваться к тому, как я благодарил Господа и пел гимны в доме тьмы, радовался и радостным голосом прославлял моего Бога за то, что благодаря этому поводу[a] избавился от египтянки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «благодаря этому предлогу»; греческое слово может означать повод, предлог или мнимое основание. Вероятно, оно отсылает к обстоятельствам, приведшим к заключению Иосифа.'
    reason: Поясняет диапазон πρόφασις и возможную контекстуальную отсылку, не определяя в основном тексте, был ли этот повод ложным обвинением.
lexical_decisions:
- source_word: συνείχετο ἀπὸ τῆς λύπης
  choice: была охвачена скорбью
  rationale: Передаёт состояние сильной подавленности или стеснённости скорбью естественным современным русским языком; буквальное «удерживалась скорбью» здесь неясно.
- source_word: ἐπηκροᾶτό μου
  choice: она прислушивалась
  rationale: Глагол обозначает внимательное, возможно тайное слушание; несовершенный вид сохраняет длительность действия.
- source_word: ἐν οἴκῳ τοῦ σκότους
  choice: в доме тьмы
  rationale: Сохраняет выразительную и неоднозначную метафору греческого текста, относящуюся к месту заключения.
- source_word: ἐν ἱλαρᾷ φωνῇ
  choice: ликующим голосом
  rationale: Естественно передаёт радостный, бодрый характер голоса в данном контексте хвалы.
- source_word: διὰ προφάσεως
  choice: под этим предлогом
  rationale: 'Сохраняет парадоксальную мысль: ложное обвинение или мнимое основание для заключения стало средством избавления Иосифа от египтянки.'
- source_word: ἀπηλλάγην
  choice: избавился
  rationale: Средне-пассивная форма допускает смысл «был избавлен» или «избавился»; русский возвратный глагол звучит естественно и не уточняет явно действующего лица.
theological_decisions:
- issue: Кому приписано избавление Иосифа
  choice: не называть Бога прямо действующим лицом в придаточном предложении
  alternative: «Бог избавил меня» или «я был избавлен Богом»
  rationale: Греческий текст связывает благодарение и прославление с избавлением, но в самой форме ἀπηλλάγην не называет действующего лица; перевод не должен добавлять его явно.
- issue: Характер πρόφασις как средства избавления
  choice: сохранить слово «предлог» и его ироническую напряжённость
  alternative: «благодаря обвинению» или «воспользовавшись случаем»
  rationale: Исходный текст оставляет открытым, идёт ли речь о ложном предлоге обвинения или о возникшем поводе; основной перевод сохраняет эту неоднозначность, а сноска поясняет её.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; сохранены библейские образы «оковы» и «дом тьмы». Синтаксис слегка упрощён ради естественного чтения, при этом последовательность мыслей и аспект греческих глаголов сохранены.
