revisions:
- from: И пока я был в оковах, египтянка была охвачена скорбью. Придя, она прислушивалась, как я благодарил Господа и пел гимны в доме тьмы, как радовался и ликующим голосом прославлял моего Бога за то, что под этим предлогом[a] избавился от египтянки.
  to: И пока я был в оковах, египтянка была охвачена скорбью. Придя, она стала прислушиваться к тому, как я благодарил Господа и пел гимны в доме тьмы, радовался и радостным голосом прославлял моего Бога за то, что благодаря этому поводу[a] избавился от египтянки.
  rationale: Внесены минимальные правки для ясности референции πρόφασις, более естественного русского синтаксиса и более точной передачи ἱλαρᾷ. Не добавляется действующее лицо при ἀπηλλάγην и не уточняется природа повода как обвинения.
