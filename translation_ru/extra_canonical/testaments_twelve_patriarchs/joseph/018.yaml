    issue: 'Ст. 2: «вы отвечайте ему добрыми делами и молитесь за него»'
    rationale: 'Греческое τῇ ἀγαθοεργείᾳ εὔχεσθε ὑπὲρ αὐτοῦ буквально связывает благотворение с молитвой как обстоятельство/средство: «творя добро, молитесь за него». Исходная формулировка превращает это в два самостоятельных предписания и добавляет оттенок ответного действия.'
  - severity: medium
    issue: 'Ст. 3: «я получил в жёны дочь...»'
    rationale: 'ἔλαβον ἐμαυτῷ εἰς γυναῖκα имеет активный смысл: «я взял себе в жёны». «Получил» ослабляет действие субъекта и не передаёт ἐμαυτῷ («себе»).'
