base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018.yaml
  text: '1. If, then, you also walk in the commandments of the Lord, God will exalt you in good things forever.

    2. And if anyone wants to do evil to you, you, by doing good, pray for him, and you will be delivered from every evil by the Lord.

    3. For see, you yourselves know that through my humility and my long-suffering I took as my wife the daughter of the priest of Heliopolis, and a hundred talents of gold were given to me with her, and my Lord made them subject to me.

    4. Even so'
translation:
  language: ru
  text: '**Завещание Иосифа 18**


    **1.** Итак, если и вы будете следовать заповедям Господа, Бог возвысит вас во благах навеки.[a]


    **2.** И если кто-нибудь захочет причинить вам зло, творя добро, молитесь за него — и Господь избавит вас от всякого зла.


    **3.** Ведь вы видите: благодаря моему смирению и долготерпению я взял себе в жёны дочь жреца Илиополя; вместе с ней мне дали сто талантов золота, и мой Господь подчинил их мне.[b]


    **4.** Более того, Он наделил меня красотой, превосходившей красоту прекраснейших в Израиле, и до старости сохранял меня сильным и красивым, ибо во всём я был подобен Иакову.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «возвысит вас в благах навеки»; выражение может указывать как на пребывание среди благ, так и на благополучие.'
    reason: Сохраняет необычную греческую конструкцию и её смысловую широту.
  - marker: b
    text: К кому относится местоимение «их», в греческом тексте неясно; возможно, подразумеваются люди, оказавшиеся под властью Иосифа.
    reason: Форма αὐτούς мужского рода не согласуется с ближайшим существительным «таланты» среднего рода, поэтому референт нельзя уверенно определить.
lexical_decisions:
- source_word: πορευθῆτε ἐν ταῖς ἐντολαῖς
  choice: будете следовать заповедям
  rationale: Греческая идиома буквально означает «ходить в заповедях»; современное русское «следовать заповедям» естественно передаёт устойчивый смысл.
- source_word: ἐν ἀγαθοῖς εἰς αἰῶνας
  choice: во благах навеки
  rationale: Сохранена необычная и допускающая разные оттенки конструкция ἐν ἀγαθοῖς, без сведения её только к благополучию или добродетели.
- source_word: τῇ ἀγαθοεργείᾳ
  choice: отвечайте ему добрыми делами
  rationale: Передаёт противопоставление намерению причинить зло; добавленное по смыслу «отвечайте» делает синтаксис ясным, не меняя призыва к благодеянию и молитве.
- source_word: ταπείνωσιν καὶ μακροθυμίαν
  choice: смирение и долготерпение
  rationale: Устоявшиеся, но понятные русские эквиваленты, сохраняющие нравственный и богословский диапазон обоих слов.
- source_word: ἱερέως ἡλιουπόλεως
  choice: жреца Илиополя
  rationale: В языческом египетском контексте ἱερεύς естественно обозначает жреца, а не иудейского священника.
- source_word: ὡραιότητα … ὑπὲρ ὡραίους Ἰσραήλ
  choice: красотой, превосходившей красоту прекраснейших в Израиле
  rationale: Передаёт сравнительную силу ὑπέρ и избегает неестественного буквального «превыше красивых Израиля».
- source_word: ἐν δυνάμει καὶ ἐν κάλλει
  choice: сильным и красивым
  rationale: Динамически и естественно передаёт сохранение Иосифа «в силе и красоте» до старости.
theological_decisions:
- issue: Связь возвышения с соблюдением заповедей
  choice: 'Сохранено прямое условное высказывание: «если… будете следовать… Бог возвысит»'
  alternative: 'Ослабить причинно-условную связь, например: «когда вы следуете… Бог может возвысить»'
  rationale: Греческое ἐάν с сослагательным наклонением выражает реальное условие; текст не следует гармонизировать с позднейшими систематическими формулировками.
- issue: Освобождение от всякого зла
  choice: «Господь избавит вас от всякого зла»
  alternative: Ограничить обещание только злом со стороны названного обидчика
  rationale: Греческое ἀπὸ παντὸς κακοῦ сформулировано широко; сохранена напряжённость между всеобщностью обещания и повествовательным контекстом.
- issue: Фраза «мой Господь»
  choice: Сохранено «мой Господь»
  alternative: Унифицировать как «Господь» или истолковать титул как земного господина
  rationale: Исходный текст имеет Κύριός μου; притяжательное местоимение сохранено без навязывания конкретной христологической или светской интерпретации.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Архаизмы сведены к общеупотребительным библейским словам («Господь», «долготерпение»). Нумерация стихов сохранена; неоконченный английский консультационный слой не использован как предел текста, поскольку греческий источник содержит полный стих 4.
