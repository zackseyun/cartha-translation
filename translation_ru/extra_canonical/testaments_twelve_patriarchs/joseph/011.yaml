    rationale: Греческое τὸν μετάβολον τῆς ἐμπορίας αὐτῶν называет посредника/агента их торговли, но не говорит, что торговля велась «через» него. Это уточнение следует убрать.
  - severity: medium
    issue: '11:7: чрезмерное истолкование ἔργῳ'
    rationale: Перевод «всё нажитое трудом» превращает неясное, вероятно вариантное слово в конкретное объяснение и расширяет текст. Нужна более открытая передача с сохранением сноски.
  - severity: low
    issue: '11:1: ослаблен акцент καὶ ὑμεῖς'
    rationale: «Итак» передаёт οὖν, но не явно выражает «и вы». Добавление «И вы также» точнее без утраты естественности.
