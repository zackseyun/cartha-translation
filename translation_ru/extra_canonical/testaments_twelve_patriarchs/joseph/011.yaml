base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/011.yaml
  text: 'And so[a], my children, in every deed of yours keep the fear of God before your eyes, and honor your brothers; for everyone who does the law of the Lord will be loved by him.


    And when I was coming with the Ishmaelites, they kept asking me, saying[b], “Are you a servant?” And I said that I was a household servant, so that I might not put my brothers to shame.'
translation:
  language: ru
  text: '11:1 И вы также, дети мои, во всех своих делах держите страх Божий перед глазами и почитайте своих братьев, ибо всякий, кто исполняет закон Господа, будет любим Им.


    2 Когда я шёл с измаильтянами, они всё спрашивали меня: «Ты раб?» Я отвечал, что я домашний раб[a], чтобы не опозорить своих братьев.


    3 Но старший из них сказал мне: «Ты не раб — это видно даже по твоему облику». Я же сказал им, что я их раб[b].


    4 Когда мы прибыли в Египет, они стали спорить обо мне: кто заплатит золотом и заберёт меня.


    5 Тогда все решили, что я останусь в Египте у торгового посредника по их торговым делам, пока они не возвратятся с товаром.


    6 Но Господь даровал мне расположение посредника, и тот доверил мне свой дом.


    7 Бог благословил его через меня и приумножил его достаток в золоте, серебре и делах[c].


    8 Я пробыл у него три месяца.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «раб из дома»; выражение может означать домашнего или родившегося в доме раба.'
    reason: lexical_alternative
  - marker: b
    text: 'В некоторых рукописях слово «их» отсутствует; тогда: «Я же сказал им, что я раб».'
    reason: textual_variant
  - marker: c
    text: Слова «и делах» (или «и труде»; греч. ἔργῳ) засвидетельствованы не во всех рукописях; точный смысл выражения неясен.
    reason: textual_variant
lexical_decisions:
- source_word: φόβον τοῦ θεοῦ
  choice: страх Божий
  rationale: Сохраняет традиционную нравственно-религиозную силу выражения, не сводя его лишь к почтению или благоговению.
- source_word: πρὸ ὀφθαλμῶν ὑμῶν
  choice: перед глазами
  rationale: Передаёт конкретный греческий образ постоянной нравственной бдительности.
- source_word: τιμᾶτε
  choice: почитайте
  rationale: Естественный для возвышенного наставления эквивалент со значением уважения и оказания чести.
- source_word: ποιῶν νόμον Κυρίου
  choice: исполняет закон Господа
  rationale: Русское «исполняет закон» естественно передаёт буквальное греческое «делает закон», сохраняя деятельный смысл.
- source_word: δοῦλος
  choice: раб
  rationale: В повествовании речь идёт о продаже и принадлежности человека, поэтому более мягкое «слуга» затушевало бы социальный статус.
- source_word: ἐξ οἴκου
  choice: домашний раб
  rationale: Передаёт вероятный смысл раба, принадлежащего дому или служащего в доме; неоднозначность отмечена сноской.
- source_word: ἡ ὄψις σου δηλοῖ
  choice: это видно даже по твоему облику
  rationale: Естественно выражает мысль, что внешний вид Иосифа обнаруживает его несвободному статусу несоответствие; «даже» передаёт καί.
- source_word: μετάβολος τῆς ἐμπορίας
  choice: посредник, через которого они вели торговлю
  rationale: Контекст указывает на торгового посредника или поверенного, которому временно оставляют Иосифа; перевод избегает слишком узкого «меняла».
- source_word: ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ
  choice: доверил мне свой дом
  rationale: Сохраняет образ и значение порученного Иосифу домашнего хозяйства.
- source_word: ἐν χειρί μου
  choice: через меня
  rationale: Передаёт семитизированный оборот «в моей руке» как указание на посредство и управление Иосифа.
- source_word: ἐπλήθυνεν αὐτὸν ἐν χρυσίῳ καὶ ἀργυρίῳ καὶ ἔργῳ
  choice: умножил его богатство — золото, серебро и всё нажитое трудом
  rationale: Глагол с личным дополнением передаёт процветание хозяина; трудное ἔργῳ выражено содержательно, а его текстовая неустойчивость отмечена.
theological_decisions:
- issue: Кто любит исполняющего закон Господа
  choice: будет любим Им
  alternative: будет любим Господом / Богом
  rationale: Местоимение αὐτοῦ грамматически отсылает к Господу; местоименная форма сохраняет структуру источника без дополнительного уточнения.
- issue: Самоопределение Иосифа как раба
  choice: раб / домашний раб
  alternative: слуга / домашний слуга
  rationale: Сюжет продажи Иосифа делает юридическую и социальную несвободу существенной; «слуга» неоправданно смягчил бы смысл.
- issue: Причина сокрытия происхождения
  choice: чтобы не опозорить своих братьев
  alternative: чтобы не навлечь позор на дом своего отца
  rationale: Прямое дополнение в греческом — «своих братьев»; перевод не расширяет его до всего отцовского дома и сохраняет тему милосердия Иосифа к продавшим его братьям.
- issue: Благословение хозяина через Иосифа
  choice: Бог благословил его через меня
  alternative: Бог благословил его под моей рукой
  rationale: Передаётся божественный источник благословения и посредническая роль Иосифа без предположения, что благословляет сам Иосиф.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксис сделан ясным для обычного читателя, при этом сохранены ключевые образы («страх Божий перед глазами», «доверил мне свой дом») и социально резкое «раб». Торговая лексика передана без архаичных профессионализмов; подлинные текстовые и лексические неясности вынесены в сноски.
