base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020.yaml
  text: '1[[to the Hippodrome]]. For I know that after my death the Egyptians will oppress you, but God will execute your vengeance and bring you into the promises of your fathers.


    2. But you shall carry up my bones with you[3a], for when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.


    3. And bring Aseneth your mother [to the Hippodrome], and bury her near Rachel my mother.


    3a. But another reading says: “And bring up Zelpha your mother, and place her near Bilhah [by the Hippodrome], close to Rachel.”


    12. For my kingdom among you will be brought to completion like a watchman’s hut in an orchard[12b][12], which does not appear after the summer.”'
translation:
  language: ru
  text: 'Завещание Иосифа, глава 20


    1. Ибо я знаю, что после моей смерти египтяне будут притеснять вас. Но Бог отомстит за вас и приведёт вас к обещанному вашим отцам.


    2. Вы возьмёте с собой и мои кости, потому что, когда их перенесут туда, Господь будет с вами во свете, а Велиар — с египтянами во тьме.


    3. А вашу мать Асенефу отнесите [к Ипподрому][a] и похороните рядом с моей матерью Рахилью.


    4. Сказав это, он вытянул ноги и почил мирным сном.


    5. И весь Израиль и весь Египет оплакивали его великим плачем.


    6. Когда сыны Израиля выходили из Египта, они взяли с собой кости Иосифа и похоронили его в Хевроне вместе с его отцами. Всего он прожил сто десять лет.


    Его царство будет вечным царством, которое не исчезнет. Моё же царство среди вас завершится, словно сторожевой шалаш в саду, который исчезает после лета.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Слова «к Ипподрому» в греческом источнике заключены в скобки и текстуально неустойчивы; буквально они означают «у (возле) Ипподрома». В других свидетелях вся погребальная инструкция имеет иной вид: «Отнесите вашу мать Зелфу и положите её рядом с Валлой, у Ипподрома, близ Рахили».'
    reason: textual_variant
  - marker: b
    text: Заключительные слова о царствах в предоставленном источнике стоят после рассказа о смерти и погребении Иосифа, но отмечены как отголосок 19:12; вероятно, их положение связано с нарушенной или сокращённой передачей текста.
    reason: textual_variant
  - marker: c
    text: Образ сторожевого шалаша передаёт временное укрытие в плодовом саду, исчезающее после лета; ср. Ис. 1:8. В греческой фразе рядом с этим образом имеется испорченное, не поддающееся уверенному переводу чтение.
    reason: textual_variant
lexical_decisions:
- source_word: τελευτή
  choice: смерть
  rationale: В контексте предсмертного завещания слово прямо обозначает смерть Иосифа; более мягкое «уход» ослабило бы смысл.
- source_word: θλίψουσιν
  choice: будут притеснять
  rationale: Передаёт длительное угнетение со стороны египтян и соответствует контексту исхода.
- source_word: ποιήσει τὴν ἐκδίκησιν ὑμῶν
  choice: отомстит за вас
  rationale: Естественно по-русски передаёт активное Божье воздаяние и оправдание угнетённых, не превращая оборот в отвлечённое «совершит справедливость».
- source_word: ἐπάξει ... εἰς τὰς ἐπαγγελίας
  choice: приведёт ... к тому, что было обещано
  rationale: Греческий текст говорит о приведении к обещаниям; русская развёртка сохраняет смысл, избегая неестественного «в обещания» и не добавляя прямо отсутствующего «обратно».
- source_word: συνανοίσετε
  choice: возьмите с собой
  rationale: В контексте перенесения костей из Египта это естественный русский эквивалент; направление дальнейшего движения раскрывается следующим придаточным.
- source_word: ἐν φωτί / ἐν σκότει
  choice: во свете / во тьме
  rationale: Сохранены параллелизм и резкий символический контраст исходного текста.
- source_word: Βελίαρ
  choice: Велиар
  rationale: Передана именно греческая форма имени, без гармонизации с более привычным «Велиал» или истолкования как безличного зла.
- source_word: ἐκοιμήθη ὕπνῳ καλῷ
  choice: почил тихим сном
  rationale: Сохраняет эвфемистический образ смерти и положительную характеристику сна, звуча естественно и достойно по-русски.
- source_word: ὀπωροφυλάκιον
  choice: сторожевой шалаш в саду
  rationale: Обозначает временное укрытие сторожа при плодовых насаждениях; «шалаш» ясно передаёт сезонность образа.
- source_word: ἐπιτελεῖται
  choice: завершится
  rationale: Сохраняет значение доведения до конца; последующее «исчезнет» передаёт отдельный глагол ἐξαφανίζεται.
theological_decisions:
- issue: Смысл Божьего ἐκδίκησις
  choice: Бог активно отомстит за угнетённый народ.
  alternative: Бог лишь позаботится о народе или совершит отвлечённое правосудие.
  rationale: Существительное имеет значение воздаяния и отмщения; перевод сохраняет напряжённость исходной формулировки, не смягчая её.
- issue: Образ Велиара
  choice: Велиар сохранён как личностная фигура, находящаяся с египтянами во тьме.
  alternative: Передать как «зло» либо заменить именем «сатана».
  rationale: Греческий текст персонифицирует Велиара; демифологизация или отождествление с другой именованной фигурой вышли бы за пределы перевода.
- issue: Контраст вечного «его царства» и временного «моего царства»
  choice: Местоимения сохранены без определения того, кому принадлежит вечное царство.
  alternative: Явно назвать его Божьим, мессианским или иным царством.
  rationale: В предоставленном фрагменте антецедент αὐτοῦ отсутствует; перевод не восполняет лакуну богословским толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного повествования. Синтаксис сделан понятным обычному читателю, но сохранены библейские образы «света/тьмы», «почил» и «великий плач». Текст переведён по предоставленному греческому свидетельству полностью, включая стихи 4–6 и перемещённый заключительный фрагмент; текстовые нарушения вынесены в примечания, а не сглажены молча.
