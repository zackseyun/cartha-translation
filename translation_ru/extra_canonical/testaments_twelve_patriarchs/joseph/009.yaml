base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009.yaml
  text: '1[a]. But when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and with a cheerful voice, rejoicing, I glorified my God because by a pretext I had been delivered from the Egyptian woman. Many times she sent to me, saying, “Consent to fulfill my desire, and I will release you from your chains, and I will free you from the darkness.”


    2[b]. But I did not turn even in thought toward her; for God loves more the one who is faithful in self-control in a pit of darkness than the one who, as a king in storerooms, lives in luxury with lawlessness.


    3. But if one lives in self-control, and the Most High knows that glory also is fitting for him, he grants that too to him, as also to me.


    4. How often, though she was sick, she came down to me at an untimely hour, and heard my voice as I prayed; and I, understanding her groanings, kept silent.


    5. For when I was in her house, she would uncover her arms and her legs, so that I might fall into her. For she was very beautiful, especially adorned for my deception[c]. But the Lord guarded me from her schemes.'
translation:
  language: ru
  text: '1[a]. Когда я был в оковах, египтянка изнемогала от печали. Приходя, она подслушивала, как я благодарил Господа и пел гимны в доме тьмы, и как я радостным голосом, ликуя, прославлял моего Бога за то, что под предлогом был избавлен от египтянки. Много раз она посылала ко мне сказать: «Согласись удовлетворить моё желание, и я освобожу тебя от оков и избавлю от тьмы».


    2[b]. Но я даже в мыслях не склонился к ней, ибо Бог больше любит того, кто в яме тьмы верен в самообладании, нежели царя, который среди сокровищниц предаётся роскоши и распутству.


    3. Если же человек живёт в самообладании, желает также славы и Всевышний знает, что она пойдёт ему на пользу, Он дарует ему и её, как даровал мне.


    4. Сколько раз она, хотя и была больна, спускалась ко мне в неурочный час и слушала мой голос, когда я молился! А я, понимая её стоны, молчал.


    5. Ведь когда я был в её доме, она обнажала руки и голени, чтобы я пал к ней. Она была очень красива и особенно наряжалась, чтобы обольстить меня[c]. Но Господь хранил меня от её козней.


    [a] «Дом тьмы» — вероятно, место заключения Иосифа. Греческий текст сохраняет образ тьмы, не называя это место прямо тюрьмой.


    [b] Греческий текст здесь труден и допускает разные способы синтаксического членения; буквально противопоставлены «верный в самообладании в яме тьмы» и «царь в сокровищницах, живущий в роскоши с распущенностью».


    [c] Слово, переведённое как «голени», означает нижнюю часть ноги — голень.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Дом тьмы» — вероятно, место заключения Иосифа. Греческий текст сохраняет образ тьмы, не называя это место прямо тюрьмой.
    reason: cultural_note
  - marker: b
    text: Греческий текст здесь труден и допускает разные способы синтаксического членения; буквально противопоставлены «верный в самообладании в яме тьмы» и «царь в сокровищницах, живущий в роскоши с распущенностью».
    reason: textual_variant
  - marker: c
    text: Слово, переведённое как «голени», означает нижнюю часть ноги — голень.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηκροᾶτό μου
  choice: подслушивала
  rationale: Глагол обозначает внимательное слушание со стороны, возможно тайное; несовершенный вид передаёт повторяемость действия.
- source_word: ἐν οἴκῳ τοῦ σκότους / ἐκ τοῦ σκότους
  choice: в доме тьмы / от тьмы
  rationale: Сохранён греческий образ тьмы вместо поясняющей замены словом «тюрьма».
- source_word: ἐν ἱλαρᾷ φωνῇ
  choice: радостным голосом
  rationale: ἱλαρός выражает радость и бодрость; русский оборот естественен и подчёркивает контраст с заключением.
- source_word: διὰ προφάσεως ἀπηλλάγην
  choice: под предлогом избавился
  rationale: πρόφασις означает предлог или видимое основание; формулировка сохраняет не вполне ясную причинную связь исходного текста.
- source_word: Εὐδόκησον πληρῶσαι τὴν ἐπιθυμίαν μου
  choice: Согласись удовлетворить моё желание
  rationale: Передаёт просьбу о согласии и явный контекст соблазнения без эвфемистического затемнения.
- source_word: οὐδὲ ἕως ἐννοίας ἐξέκλινα
  choice: даже в мыслях не склонился к ней
  rationale: Идиома подчёркивает не только внешнее сопротивление, но и внутреннюю верность.
- source_word: σωφροσύνη
  choice: самообладание
  rationale: Слово включает целомудрие и нравственную сдержанность, но шире одного лишь полового воздержания.
- source_word: ἐν λάκκῳ σκότους
  choice: в яме тьмы
  rationale: Сохранён буквальный и риторически выразительный образ λάκκος, а не сглаживающее «темница».
- source_word: ἐν ταμείοις ... τρυφῶντα μετ’ ἀκολασίας
  choice: среди сокровищниц предаётся роскоши и распутству
  rationale: ταμεῖον допускает значение внутреннего помещения или кладовой/сокровищницы; контекст противопоставляет лишения привилегированной роскоши, а ἀκολασία здесь естественно передаётся как «распутство».
- source_word: συμφέρει
  choice: пойдёт ему на пользу
  rationale: Основное значение связано с пользой или благом; перевод не сводит Божье решение лишь к уместности почёта.
- source_word: τοὺς στεναγμούς
  choice: стоны
  rationale: 'Сохраняет более тяжёлую и неоднозначную окраску: это могут быть стоны болезни, печали или желания.'
- source_word: τὰς κνήμας
  choice: голени
  rationale: κνήμη точнее обозначает голень, а не ногу вообще.
- source_word: συμπέσω εἰς αὐτήν
  choice: пал с ней
  rationale: Греческая фраза текстуально трудна и буквально необычна; русский оборот передаёт сексуально-нравственное падение, не вводя лишних подробностей.
theological_decisions:
- issue: Божественное действие в стойкости и возвышении Иосифа
  choice: 'Сохранить прямые утверждения: Бог любит верного, Всевышний дарует славу, Господь хранит'
  alternative: Представить исход как результат одного лишь самообладания Иосифа
  rationale: Греческий текст прямо соединяет нравственную стойкость человека с Божьей благосклонностью, даром и защитой.
- issue: Значение σωφροσύνη в контексте соблазнения
  choice: самообладание
  alternative: целомудрие
  rationale: Контекст ясно включает половую чистоту, однако греческая добродетель имеет более широкий смысл рассудительной нравственной сдержанности.
- issue: Условие дарования славы в стихе 3
  choice: «Всевышний знает, что слава пойдёт ему на пользу»
  alternative: «Всевышний знает, что слава ему подобает»
  rationale: συμφέρει прежде всего указывает на пользу; перевод сохраняет провиденциальное суждение Бога, не превращая славу в заслуженное право.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены образы «дом тьмы» и «яма тьмы», а также неоднозначность стонов женщины. Начало включает продолжение VIII:5 («Когда я был в оковах…»), присутствующее в предоставленном греческом источнике, хотя английский консультационный слой его частично опускает.
