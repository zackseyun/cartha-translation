    reason: cultural_note
lexical_decisions:
- source_word: δόκιμον ἀπέδειξέ με
  choice: он показал, что я выдержал проверку
  rationale: Сохраняет связь между испытанием и подтверждённой испытанностью Иосифа. Подлежащее в данном отрывке не названо, поэтому в переводе не добавлено имя Бога.
- source_word: μακροθυμία / ἐμακροθύμησα
  choice: долготерпение / проявлял долготерпение
  rationale: «Долготерпение» передаёт продолжительное терпеливое самообладание перед лицом давления и сохраняет тематический повтор.
- source_word: ὑπομονή
  choice: стойкость
  rationale: Отличает выносливую стойкость от μακροθυμία, не сливая два близких понятия в одно русское слово.
- source_word: φάρμακον
  choice: лекарство
  rationale: Сохраняет прямую лечебную метафору греческого текста.
- source_word: συνελθεῖν αὐτῇ
  choice: сойтись с ней
  rationale: Передаёт сексуальный эвфемизм достаточно ясно, но без грубой конкретизации.
- source_word: ἐπιδῷς ἑαυτὸν εἰς ἐμέ
  choice: отдашься мне
  rationale: Естественно передаёт одновременно добровольную уступку и сексуальный смысл предложения женщины.
- source_word: ταμεῖον
  choice: внутренняя комната
  rationale: Обозначает уединённое внутреннее помещение и естественно звучит в сцене частной молитвы.
- source_word: ἐν τρυφῇ διάγων
  choice: живу в роскоши
  rationale: Сохраняет контраст между действительным постом Иосифа и впечатлением внешнего благополучия.
- source_word: τοῦ προσώπου τὴν χάριν
  choice: на лице появляется благодать
  rationale: Сохраняет и конкретный образ лица, и многозначность χάρις — благодать, благоволение, привлекательность.
- source_word: τριημερίζων
  choice: раз в три дня
  rationale: Передаёт наиболее вероятный здесь трёхдневный ритм поста; допустимая иная временная трактовка указана в сноске.
- source_word: λόγῳ ἐπισκέψεως
  choice: под предлогом проведать меня
  rationale: Передаёт посещение как заявленную причину, прикрывавшую действительное намерение женщины.
theological_decisions:
- issue: Подлежащее при ἀπέδειξέ в продолжении предшествующего предложения
  choice: сохранено местоимение «он» без добавления имени
  alternative: «Бог показал» или безличная перестройка
  rationale: Данный фрагмент начинается с продолжения контекста и не называет действующее лицо. Добавление «Бог» разрешило бы формальную неоднозначность сверх представленного греческого текста.
- issue: κύριος в молитвенном контексте и в обозначении земного хозяина
  choice: «Господь» в стихах 3 и 6; «господин» в стихах 2 и 5
  alternative: передавать все случаи одним словом без различения регистра
  rationale: Контекст молитвы указывает на Бога, тогда как предложение женщины и отъезд владельца дома относятся к человеческому господину.
- issue: Утверждение о посте и внешнем облике
  choice: «у тех, кто постится ради Бога, на лице появляется благодать»
  alternative: «становятся красивыми лицом» или «получают привлекательную внешность»
  rationale: Перевод сохраняет богословскую логику текста и широту χάρις, не сводя её только к физической красоте.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего наставительного повествования. Синтаксис сделан ясным для широкого читателя, при этом сохранены повторы, лечебная метафора, аскетическая логика и незавершённость последней фразы. Начальная строка передаёт только засвидетельствованное в предоставленном греческом фрагменте продолжение; отсутствующее в нём предшествующее предложение из консультационного английского слоя не добавлялось.
