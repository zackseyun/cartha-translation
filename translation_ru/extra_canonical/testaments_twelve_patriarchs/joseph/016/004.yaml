  text: Then she sent another eunuch, saying, “Even if they ask two minas, pay them. Do not spare the gold. Only buy the boy and bring him to me.”
translation:
  language: ru
  text: 'Тогда она послала другого евнуха, сказав: «Даже если они запросят две мины, заплатите им. Не жалейте золота. Только купи мальчика и приведи его ко мне».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχον ἕτερον
  choice: другого евнуха
  rationale: Прямо передаёт существительное и постпозитивное определение, сохраняя связь с предшествующим повествованием.
- source_word: δύο μνᾶς
  choice: две мины
  rationale: Сохранена древняя денежно-весовая единица; контекст ясно указывает на цену.
- source_word: παρέχετε
  choice: дайте им
  rationale: Множественная форма повелительного наклонения передана естественно; дополнение «им» восстанавливается из контекста как получатели запрошенной суммы.
- source_word: μὴ φείσασθε χρυσίου
  choice: не жалейте золота
  rationale: Естественная русская передача запрета со значением «не скупитесь, не берегите золото».
- source_word: τὸν παῖδα
  choice: юношу
  rationale: В данном контексте παῖς обозначает молодого Иосифа, выставленного на продажу; «юноша» естественнее и не создаёт ненужного впечатления о малолетнем ребёнке.
- source_word: πριασάμενος ... ἄγαγε
  choice: купи ... и приведи
  rationale: Греческое причастие, связанное с повелением, естественно развёрнуто в последовательность двух русских императивов.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с dignified повествовательным тоном. Переключение с множественного «дайте, не жалейте» на единственное «купи, приведи» сохранено по греческим формам; оно может отражать обращение к евнуху вместе с его людьми, а затем лично к посланнику.
