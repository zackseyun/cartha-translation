  text: So the eunuch came and gave them eighty pieces of gold and took me; but to the Egyptian woman he said, “I have given a hundred.”
translation:
  language: ru
  text: 'Итак, евнух пришёл, дал им восемьдесят золотых монет и забрал меня; египтянке же он сказал: «Я отдал сто».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχος
  choice: евнух
  rationale: Прямое и общепонятное соответствие греческому обозначению придворного евнуха.
- source_word: ὀγδοήκοντα χρυσοῦς
  choice: восемьдесят золотых монет
  rationale: Субстантивированное χρυσοῦς означает золотые денежные единицы; слово «монет» естественно восполняет подразумеваемое существительное, не уточняя неизвестный номинал.
- source_word: ἀνελάβετό με
  choice: забрал меня
  rationale: В данном контексте глагол обозначает принятие или взятие Иосифа после уплаты; «забрал» естественно передаёт совершившуюся передачу.
- source_word: τῇ δὲ Αἰγυπτίᾳ
  choice: египтянке же
  rationale: Сохраняет женский род, этническое обозначение и контраст, выраженный частицей δέ.
- source_word: δέδωκα
  choice: я отдал
  rationale: Перфект указывает на уже совершённую уплату с актуальным результатом; русское прошедшее время здесь звучит естественно.
