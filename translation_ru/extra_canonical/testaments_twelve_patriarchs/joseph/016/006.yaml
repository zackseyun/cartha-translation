lexical_decisions:
- source_word: εἰδὼς
  choice: зная об этом
  rationale: Причастие передано деепричастным оборотом; добавленное «об этом» естественно выражает подразумеваемый из контекста объект знания.
- source_word: ἐσιώπησα
  choice: молчал
  rationale: Передаёт продолженное намеренное молчание без ненужного усиления.
- source_word: αἰσχυνθῇ
  choice: не был посрамлён
  rationale: Сохраняет страдательную форму и смысл публичного стыда или бесчестья, не сводя его только к внутреннему чувству смущения.
- source_word: ὁ εὐνοῦχος
  choice: евнух
  rationale: Прямой и исторически уместный эквивалент греческого существительного.
