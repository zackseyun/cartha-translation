base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016/003.yaml
  text: But the eunuch, not wishing to buy me, withdrew after testing them, and reported to his mistress that they were asking a high price for the boy.
translation:
  language: ru
  text: Но евнух, не пожелав купить меня, ушёл, испытав их, и сообщил своей госпоже, что за мальчика просят высокую цену.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχος
  choice: евнух
  rationale: Прямой и общеупотребительный эквивалент, сохраняющий обозначение придворного слуги без домысливания его должности.
- source_word: ἀνεχώρησεν
  choice: ушёл
  rationale: Естественно передаёт удаление евнуха после переговоров.
- source_word: πειράσας αὐτούς
  choice: испытав их
  rationale: Сохраняет широкое значение глагола πειράζω и не уточняет без достаточных оснований, испытывал ли он продавцов вопросами, торгом или иным способом.
- source_word: δεσποίνῃ
  choice: госпоже
  rationale: Передаёт женскую форму обозначения владычицы или хозяйки в данном бытовом контексте.
- source_word: πολλὴν τιμὴν αἰτοῦσιν
  choice: просят высокую цену
  rationale: Естественная современная русская формулировка для требования большой покупной цены.
- source_word: παιδός
  choice: юношу
  rationale: В контексте продажи Иосифа обозначает молодого человека; «юноша» звучит естественнее и точнее по возрастному контексту, чем «мальчик».
