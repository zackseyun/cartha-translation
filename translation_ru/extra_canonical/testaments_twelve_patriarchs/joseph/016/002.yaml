  text: Εὐθέως δὲ ἀπέστειλεν εὐνοῦχον ἐν τοῖς Ἰσμαϊλίταις, αἰτοῦσά με εἰς διάπρασιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016/002.yaml
  text: So she immediately sent a eunuch among the Ishmaelites, asking for me to be sold.
translation:
  language: ru
  text: И она тотчас послала евнуха к измаильтянам, прося продать меня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐθέως δὲ
  choice: И она тотчас
  rationale: Передаёт немедленность действия и естественно связывает стих с предшествующим повествованием; подлежащее восстановлено из контекста.
- source_word: ἀπέστειλεν εὐνοῦχον
  choice: послала евнуха
  rationale: Прямое и естественное соответствие греческому выражению.
- source_word: ἐν τοῖς Ἰσμαϊλίταις
  choice: к измаильтянам
  rationale: Хотя ἐν буквально означает «среди», при глаголе посылания оборот естественно указывает на адресатов или среду поручения; русское «послала евнуха среди измаильтян» было бы двусмысленным и неестественным.
- source_word: αἰτοῦσά με εἰς διάπρασιν
  choice: прося продать меня
  rationale: Передаёт просьбу о совершении продажи; не добавляет отсутствующее в греческом уточнение «ей» или «для неё».
