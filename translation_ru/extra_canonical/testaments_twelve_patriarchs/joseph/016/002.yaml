  source_fidelity: «И она тотчас послала евнуха к измаильтянам, прося продать меня» точно передаёт последовательность действий и основные элементы греческого текста. «К измаильтянам» является естественной русской передачей ἐν τοῖς Ἰσμαηλίταις в контексте посылки человека и не добавляет конкретного получателя продажи. Оборот «прося продать меня» адекватно передаёт αἰτοῦσά με εἰς διάπρασιν.
