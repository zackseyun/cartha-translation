base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016/001.yaml
  text: But Memphis said to her husband, “Buy the young man, for I hear,” she says, “that they are selling him.”
translation:
  language: ru
  text: 'Мемфис же сказала своему мужу: «Купи юношу, ибо я слышу, — говорит она,[a] — что его продают».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «говорит она»; греческий текст внутри уже введённой прямой речи повторно употребляет глагол речи в настоящем времени.'
    reason: Примечание поясняет необычную для русского вставку и сохраняет повторное употребление глагола речи в греческом тексте.
lexical_decisions:
- source_word: Μεμφὶς
  choice: Мемфис
  rationale: Имя передано традиционной русской транслитерацией; в данном контексте оно обозначает женщину.
- source_word: Ἀγόρασον
  choice: Купи
  rationale: Аористный императив передаёт прямое, конкретное побуждение совершить покупку.
- source_word: τὸν νεανίαν
  choice: этого юношу
  rationale: Указательное «этого» естественно передаёт определённость греческого артикля и отсылает к известному собеседникам человеку.
- source_word: ἀκούω
  choice: я слышала
  rationale: Греческое настоящее буквально означает «слышу», но по-русски при сообщении полученной вести естественнее «я слышала», без изменения смысла.
- source_word: φησίν
  choice: говорит она
  rationale: Сохранено вводное авторское замечание и его историческое настоящее, хотя оно повторяет сказанное ранее «сказала».
- source_word: πωλοῦσιν αὐτόν
  choice: его продают
  rationale: Неопределённо-личная конструкция точно передаёт форму третьего лица множественного числа без названного деятеля; местоимение сохраняет αὐτόν.
