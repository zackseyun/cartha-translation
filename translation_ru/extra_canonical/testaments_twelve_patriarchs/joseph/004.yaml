  text: '9[a]. And when I understood, I was grieved unto death. But after she had gone out, I came to myself and mourned over her for many days, because I recognized her deceit and her delusion.

    10. And I spoke to her words of the Most High, to see whether perhaps she might turn back from her evil desire.

    11. So then, many times[b], as to a holy man, she flattered me with words; and with deceit she praised my self-control before her husband, wishing to trip me up when we were alone.

    12. For she openly extolled me as chaste with respect to the bed, but in secret she said to me, “Do not be afraid of my husband; for he is persuaded concerning your purity, and even if someone should tell him about us, he will not believe it.”

    13. In all these things I, lying low on the ground, kept begging the God of my fathers that he would rescue me from her deceit.

    14. Since she accomplished nothing in this way, again she began to come to me with words of instruction, wanting to learn the word of God.

    15. And she says to me, “If you want me to leave behind the idols, I will persuade my husband to withdraw from them, and we will go before your Lord, walking in the law of your Lord.”

    16. But I said to her, “The Lord does not will that those who revere him should be in uncleanness, nor does he delight in adulterers, but in those who draw near to him with a pure heart and undefiled lips.”

    17. But she kept contending, wanting to fulfill her desire.

    18. And I added fasting and prayer[d][c], so that the Lord might rescue me from her.'
translation:
  language: ru
  text: '9. Поняв это, я опечалился до смерти. Когда же она вышла, я пришёл в себя и много дней скорбел о ней, потому что распознал её коварство и заблуждение.


    10. Я говорил ей слова Всевышнего — не обратится ли она от своего злого желания.


    11. Итак, она часто льстила мне словами, обращаясь со мной как со святым мужем, и коварно хвалила моё самообладание перед своим мужем, желая наедине заставить меня пасть.


    12. Ведь при всех она превозносила меня как целомудренного, а наедине говорила мне: «Не бойся моего мужа: он убеждён в твоём целомудрии, и даже если кто-нибудь расскажет ему о нас, он не поверит».


    13. Во всём этом я, лёжа на земле, молил Бога, чтобы Он избавил меня от её коварства.


    14. Когда же этим она ничего не добилась, то снова стала приходить ко мне с наставительной беседой, желая узнать слово Бога.


    15. Она говорит мне: «Если хочешь, чтобы я оставила идолов, сойдись со мной, и я убежу своего мужа отступить от идолов, и мы пойдём пред лицом твоего Господа».[a]


    16. Я же сказал ей: «Господь не желает, чтобы почитающие Его пребывали в нечистоте, и не благоволит к прелюбодеям, но благоволит к тем, кто приближается к Нему с чистым сердцем и неосквернёнными устами».[b]


    17. Но она продолжала спорить, желая удовлетворить своё влечение.


    18. Я же прибавлял пост и молитву, чтобы Господь избавил меня от неё.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение «пред лицом твоего Господа» отмечено в данном греческом тексте как текстуально сомнительное. В некоторых формах предания после него встречается более пространное добавление: «ходя по закону твоего Господа».'
    reason: textual_variant
  - marker: b
    text: Заключительная часть стиха — «но благоволит к тем, кто приближается к Нему с чистым сердцем и неосквернёнными устами» — заключена в скобки в данном греческом издании и потому текстологически не вполне достоверна.
    reason: textual_variant
lexical_decisions:
- source_word: ἐλυπήθην ἕως θανάτου
  choice: опечалился до смерти
  rationale: Сохраняет интенсивность и возвышенный библейский оборот греческого текста без пояснительного расширения.
- source_word: ἦλθον εἰς ἐμαυτόν
  choice: пришёл в себя
  rationale: Естественно передаёт греческую идиому и сохраняет её возможный смысл внутреннего отрезвления.
- source_word: δόλος / πλάνη
  choice: коварство / заблуждение
  rationale: Различает намеренный обман и состояние нравственного заблуждения, не сводя оба слова к одному понятию.
- source_word: ῥήματα ὑψίστου
  choice: слова Всевышнего
  rationale: 'Сохраняет естественное значение родительного падежа: слова, исходящие от Всевышнего или принадлежащие Ему.'
- source_word: σωφροσύνη / σώφρονα
  choice: самообладание / целомудренного
  rationale: В первом случае сохраняется широкий смысл добродетели воздержания, а в прямой речи женщины контекстуально ясно выражена половая чистота.
- source_word: ὑποσκελίσαι
  choice: заставить меня пасть
  rationale: Передаёт образ подножки как нравственного падения и звучит естественно в данном контексте.
- source_word: χαμοκοιτῶν
  choice: лёжа на земле
  rationale: Редкое слово указывает на пребывание или сон у самой земли; перевод сохраняет телесную позу смиренной молитвы, не уточняя, что Иосиф лежал лицом вниз.
- source_word: λόγῳ κατηχήσεως
  choice: под предлогом наставления
  rationale: Контекст показывает, что просьба о наставлении служила способом приблизиться к Иосифу; формулировка избегает позднейшего специального значения слова «катехизация».
- source_word: συγγενοῦς μου
  choice: сойдись со мной
  rationale: Императив от συγγίγνομαι в данном контексте является предложением половой связи; перевод выражает это ясно, но без грубой лексики.
- source_word: ἀποστῆναι ἀπὸ τῶν εἰδώλων
  choice: отступить от идолов
  rationale: Сохраняет глагольный образ удаления и явный повтор слова «идолы».
- source_word: προσετιθέμην νηστείαν καὶ προσευχήν
  choice: прибавлял пост и молитву
  rationale: Передаёт продолжительный вид глагола и координацию двух существительных без превращения её в «пост к молитве».
theological_decisions:
- issue: К кому обращена молитва Иосифа в стихе 13
  choice: Бога
  alternative: Бога моих отцов
  rationale: Предоставленный греческий текст содержит τοῦ Θεοῦ и не содержит слов «моих отцов»; более пространное чтение не внесено по контексту.
- issue: Второе лицо в Κυρίου σου в стихе 15
  choice: твоего Господа
  alternative: Господа
  rationale: Сохранено притяжательное местоимение греческого свидетеля, не выровненное по привычной библейской формуле.
- issue: Предложение женщины как условие отказа от идолов
  choice: «сойдись со мной» переведено прямо
  alternative: опустить условие или передать неопределённо
  rationale: Греческое συγγενοῦς μου выражает центральную для эпизода попытку склонить Иосифа к связи; её нельзя устранять из-за богословской или стилистической неловкости.
- issue: Божье отношение к нечистоте и прелюбодеянию
  choice: сохранены разные конструкции «не желает» и «не благоволит»
  alternative: унифицировать как «не одобряет»
  rationale: Различие θέλει и εὐδοκεῖ сохранено, чтобы не сглаживать формулировку исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён там, где буквальное воспроизведение греческого было бы тяжеловесным, но повторения, нравственная напряжённость и прямота сексуального предложения сохранены. Нумерация продолжена как 9–18 в соответствии с заданным отрывком, хотя в греческом издании после 10 начинается глава IV с внутренней нумерацией 1–8.
