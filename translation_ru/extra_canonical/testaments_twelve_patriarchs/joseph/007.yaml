  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007.yaml
  text: '7. So that you may learn that the wickedness of the ungodly will not prevail over those who fear God in self-control, look: taking some of it before him, I ate it in your presence. And after saying this, I tasted it and said, “The God of my fathers and the angel of Abraham will be with me.” And I ate.


    8. But when she saw this, she fell on her face at my feet, weeping; and raising her up, I admonished her.


    9. And she agreed with me not to commit this impiety any longer. Yet her heart was still set on evil, and she kept looking around for a way to ensnare me; and groaning, she would collapse suddenly, though she was not sick.


    10. And when her husband saw her, he said to her, “What has happened to your face?” She said to him, “I am in pain with anguish of heart, and the groanings of my spirit hold me fast.” And he tried to heal her with words.


    11. Then, when she found an opportunity, she rushed in to me while her husband was still outside, and said to me, “I am choking; or I will throw myself down a cliff, if you do not join yourself with me.”


    12. But I, understanding that the spirit of Beliar was troubling her, prayed to the Lord and said to her,


    13. “Why, miserable woman, are you disturbed and thrown into turmoil, blinding yourself in sins? Remember that if you kill yourself, Astho, your husband''s concubine, your rival, will beat your children and wipe out your memory from the earth.”'
translation:
  language: ru
  text: '7. Чтобы ты узнала: зло нечестивых не одолеет тех, кто почитает Бога, храня целомудрие. Вот, я взял немного этого и съел у тебя на глазах. Сказав это, я произнёс: «Бог моих отцов и ангел Авраама будут со мной». И я съел.[a]


    8. Увидев это, она пала ниц к моим ногам и заплакала. Я поднял её и стал вразумлять.


    9. Она согласилась со мной, что больше не совершит этого нечестия. Но сердце её по-прежнему стремилось ко злу, и она всё высматривала, как бы заманить меня в ловушку. Она стонала и внезапно падала, хотя не была больна.[b]


    10. Увидев её, муж спросил: «Что случилось с твоим лицом?» Она ответила ему: «Я мучаюсь от сердечной боли, и стоны моего духа терзают меня». И он пытался утешить её словами.


    11. Затем, улучив удобный случай, она ворвалась ко мне, пока её муж ещё был снаружи, и сказала: «Я задыхаюсь! Если ты не сойдёшься со мной, я брошусь с обрыва».


    12. Я же понял, что её мучит дух Велиара, помолился Господу и сказал ей:


    13. «Зачем ты, несчастная, мечешься и тревожишься, ослепляя себя грехами? Помни: если ты лишишь себя жизни, Астефо, наложница твоего мужа и твоя соперница, будет бить твоих детей, а ты погубишь память о себе на земле».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Последовательность фраз в греческом тексте здесь затруднена: Иосиф сначала говорит, что ел у неё на глазах, затем произносит молитвенное исповедание и снова сообщает, что съел.'
    reason: Отмечает реальную шероховатость и возможную текстовую нарушенность источника, не сглаживая её молча.
  - marker: b
    text: Греческая фраза о стонах и внезапных падениях текстуально неясна; перевод передаёт наиболее вероятный смысл.
    reason: В издании оборот помечен как сомнительный, поэтому уверенная гладкая передача без оговорки скрыла бы состояние текста.
lexical_decisions:
- source_word: σωφροσύνῃ
  choice: храня целомудрие
  rationale: В данном контексте слово обозначает нравственное самообладание прежде всего в половой сфере; «целомудрие» естественно передаёт эту направленность, не сводя её к абстрактной сдержанности.
- source_word: θεοσεβούντων
  choice: тех, кто почитает Бога
  rationale: Передаёт деятельное благоговение перед Богом и сохраняет причастную конструкцию в ясной современной форме.
- source_word: ὁ ἄγγελος Ἀβραάμ
  choice: ангел Авраама
  rationale: Буквально сохраняет необычную связь родительного падежа и не уточняет без основания, является ли это ангелом-хранителем или иной фигурой.
- source_word: συγγενῇ μετ᾿ ἐμοῦ
  choice: сойдёшься со мной
  rationale: Греческий эвфемизм в контексте означает половую связь; русский глагол столь же ясно передаёт смысл без ненужной грубости.
- source_word: τὸ πνεῦμα τοῦ Βελίαρ
  choice: дух Велиара
  rationale: Сохраняет личностно-духовную формулировку источника и традиционную русскую передачу имени.
- source_word: κονδυλίσει
  choice: будет бить
  rationale: Глагол означает нанесение ударов, в том числе кулаком; нейтральное «бить» точно и естественно по-русски.
- source_word: ἀπολέσεις τὸ μνημόσυνόν σου
  choice: память о тебе исчезнет
  rationale: Передаёт обращённую ко второму лицу угрозу утраты памяти, не приписывая это действие сопернице вопреки грамматике греческого текста.
theological_decisions:
- issue: Связь богопочитания и σωφροσύνη
  choice: «почитает Бога, храня целомудрие»
  alternative: «боится Бога в самообладании»
  rationale: Выбранная формулировка сохраняет и благочестие, и нравственную чистоту в контексте искушения, не превращая целомудрие в самостоятельное основание спасения или защиты.
- issue: Образ «ангела Авраама»
  choice: Сохранить буквально без поясняющей идентификации
  alternative: «ангел, хранивший Авраама» или «ангел-хранитель Авраама»
  rationale: Источник не объясняет природу этой фигуры; добавление функции ангела внесло бы позднейшее богословское уточнение.
- issue: Дух Велиара
  choice: Передать как действующего духовного мучителя
  alternative: Психологизировать как «злой порыв» или «безумие»
  rationale: Так сохраняется собственная демонологическая картина текста без конфессионального развития её деталей.
- issue: Ответственность за исчезновение памяти
  choice: «память о тебе исчезнет с земли»
  alternative: «соперница сотрёт память о тебе с земли»
  rationale: Форма ἀπολέσεις относится к самой женщине; перевод сохраняет её ответственность и не переносит действие на Астефо.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего назидательного повествования. Синтаксис сделан понятным для обычного читателя, но необычные богословские выражения и текстовые трудности не устранены. Реплики естественны, без архаизмов и без разговорной сниженности.
