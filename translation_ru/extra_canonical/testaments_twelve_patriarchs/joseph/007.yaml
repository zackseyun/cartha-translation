    issue: В 13 утрачена личная активность формы ἀπολέσεις.
    rationale: 'Греческий глагол стоит во 2-м лице: условие самоубийства обращено к женщине, и она «погубит» собственную память. Безличное «память исчезнет» ослабляет эту грамматическую связь.'
  - severity: low
