  - severity: medium
    issue: 'Ст. 6: образ ἐξεχύθην заменён интерпретацией'
    rationale: «которому я отдался без остатка» поясняет смысл, но не передаёт пассивно-образное «я был излит / я излился». Поскольку английский audit trail намеренно сохраняет «I was poured out», русский также должен по возможности сохранить этот образ.
