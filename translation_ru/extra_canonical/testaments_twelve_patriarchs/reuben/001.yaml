  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001.yaml
  text: 'A copy of the testament of Reuben, what he commanded his sons before he died, in the one hundred and twenty-fifth year of his life.


    2 Two years after the death of Joseph his brother, when Reuben had fallen sick, the sons of Joseph and the sons of his sons were gathered to visit him. 3 And he said to them, “My children, behold, I am dying, and I am going the way of my fathers.” 4 Then, seeing there Judah and Gad and Asher, his brothers, he said to them, “Raise me up, so that I may tell my brothers and my children the things hidden in my heart; for behold, even now I am failing.” 5 And rising up, he kissed them and said to them, “Hear, my brothers and my sons; pay attention to Reuben your father in the things that I command you.


    6 “And behold, today I call the God of heaven to witness against you, that you not walk in the ignorance of youth and in sexual immorality, in which I was poured out and defiled the bed of my father Jacob. 7 And I tell you that he struck me with a severe blow in my loins for seven months; and if my father Jacob had not prayed for me to the Lord, the Lord would have been willing to destroy me. 8 For I was thirty years old when I did the evil thing before the Lord, and for seven months I was weakened to the point of death. 9 And after this, with the resolve of my soul, I repented before the Lord for seven years. 10 And I drank no wine or strong drink, and meat did not enter my mouth, and I ate no bread of desire; but I was mourning over my sin, for it was great—such a thing had not happened in Israel.”'
translation:
  language: ru
  text: 'Завещание Рувима


    1 Список завещания Рувима — того, что он заповедал своим сыновьям перед смертью, на сто двадцать пятом году своей жизни.


    2 Через два года после кончины его брата Иосифа, когда Рувим заболел, сыновья Иосифа и сыновья его сыновей собрались навестить его. 3 Он сказал им:


    — Дети мои, вот, я умираю и ухожу путём моих отцов.


    4 Увидев там своих братьев Иуду, Гада и Асира, он сказал им:


    — Поднимите меня, чтобы я поведал моим братьям и детям то, что сокрыто у меня в сердце, потому что вот, силы уже оставляют меня.


    5 Приподнявшись, он расцеловал их и сказал:


    — Слушайте, братья мои и сыновья мои; внимайте тому, что заповедует вам ваш отец Рувим.


    6 И вот, сегодня я призываю Бога небесного в свидетели против вас: не ходите в неразумии юности и распутстве, в котором я излился и осквернил ложе моего отца Иакова. 7 Говорю вам: Он поразил меня тяжким ударом в чресла на семь месяцев; и если бы мой отец Иаков не молился обо мне Господу, Господь пожелал бы погубить меня. 8 Ведь мне было тридцать лет, когда я совершил это зло пред Господом, и семь месяцев я изнемогал, будучи при смерти. 9 После этого я по решимости души моей семь лет каялся пред Господом. 10 Я не пил ни вина, ни крепкого напитка; мяса я не ел и никакого желанного хлеба не ел. Напротив, я скорбел о своём грехе, потому что он был велик: ничего подобного ещё не случалось в Израиле.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾿Αντίγραφον διαθήκης
  choice: Список завещания
  rationale: ᾿Αντίγραφον означает письменную копию или список, а διαθήκη в данном литературном жанре — предсмертное завещание-наставление.
- source_word: υἱοὶ αὐτοῦ καὶ υἱοὶ τῶν υἱῶν αὐτοῦ
  choice: его сыновья и внуки
  rationale: Местоимения естественно относятся к заболевшему Рувиму; второе выражение буквально означает «сыновья его сыновей».
- source_word: πορεύομαι ὁδὸν τῶν πατέρων μου
  choice: ухожу путём моих отцов
  rationale: Сохранён традиционный эвфемизм смерти и его образность.
- source_word: ἐκλείπω
  choice: силы уже оставляют меня
  rationale: В контексте умирающего глагол передаёт угасание и истощение; буквальное «я прекращаюсь» по-русски неестественно.
- source_word: κατεφίλησεν
  choice: расцеловал
  rationale: Приставочная форма выражает сердечный, многократный поцелуй, а не просто единичное действие.
- source_word: ἐνωτίσασθε
  choice: внимайте
  rationale: Передаёт призыв внимательно слушать и принимать сказанное всерьёз.
- source_word: ἀγνοίᾳ νεότητος
  choice: неразумии юности
  rationale: Сохраняет смысл незнания, неведения или безрассудства, связанного с юностью, без излишнего уточнения.
- source_word: πορνείᾳ
  choice: распутстве
  rationale: В данном контексте обозначает половую безнравственность; «распутство» естественно и достаточно широко передаёт термин.
- source_word: ἐξεχύθην
  choice: отдался без остатка
  rationale: Греческая форма буквально создаёт образ «излиться»; русский оборот сохраняет идею необузданной полной отдачи пороку, не превращая фразу в непонятный буквализм.
- source_word: λαγόνος
  choice: чресла
  rationale: Слово обозначает бок, паховую область или чресла; «чресла» сохраняет телесную локализацию и уместный для завещательной речи регистр.
- source_word: ἐν προαιρέσει ψυχῆς μου
  choice: по решимости души моей
  rationale: Передаёт сознательное внутреннее решение и волевую настроенность, а не только эмоциональное состояние.
- source_word: σίκερα
  choice: крепкий напиток
  rationale: Термин обозначает опьяняющий напиток, отличный от вина; современная формулировка не навязывает конкретного состава.
- source_word: ἄρτον ἐπιθυμίας
  choice: лакомой пищи
  rationale: Буквально «хлеб желания» означает желанную, приятную пищу; перевод сохраняет аскетический смысл и звучит естественно.
theological_decisions:
- issue: Кто нанёс Рувиму удар в стихе 7
  choice: «Он поразил меня», с прописной буквы
  alternative: «Бог поразил меня» или «Господь поразил меня»
  rationale: В греческом субъект прямо не назван. Контекст указывает на Бога/Господа, но перевод не добавляет отсутствующее существительное и сохраняет формальную неопределённость.
- issue: Фраза о желании Господа погубить Рувима
  choice: «Господь пожелал бы погубить меня»
  alternative: «Господь погубил бы меня»
  rationale: Сохранён выраженный глаголом ἤθελε оттенок воли или намерения, не сведённый к простому нереальному результату.
- issue: Покаяние в течение семи лет
  choice: «семь лет каялся пред Господом»
  alternative: «семь лет нёс покаяние»
  rationale: Перевод следует глаголу μετενόησα и не вводит позднейшую конфессиональную терминологию или установленную покаянную практику.
translation_notes:
  register: 'Современный литературный русский с достоинством завещательной речи. Синтаксис упрощён там, где буквальное следование греческому было бы тяжеловесным, но сохранены повторения, библейские образы и богословски значимые напряжения. Имена переданы в привычной русской библейской форме: Рувим, Иосиф, Иуда, Гад, Асир, Иаков.'
