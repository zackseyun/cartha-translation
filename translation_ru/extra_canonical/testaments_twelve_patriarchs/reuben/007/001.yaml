- source_word: ἐντειλάμενος
  choice: завещав
  rationale: Аористное причастие передаёт данное перед смертью наставление или распоряжение; «завещав» естественно звучит по-русски в данном контексте и сохраняет оттенок авторитетного наказа.
- source_word: ταῦτα
  choice: это
  rationale: Нейтральное указание на предшествующие наставления; русское собирательное «это» здесь естественнее буквального «эти вещи».
- source_word: τοῖς υἱοῖς αὐτοῦ
  choice: своим сыновьям
  rationale: Возвратное притяжательное местоимение ясно соотносит сыновей с подлежащим Рувимом и соответствует нормам современного русского языка.
