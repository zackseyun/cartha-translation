    **3** Первый — дух разврата: он пребывает в естестве и в чувствах. Второй — дух ненасытности чрева. **4** Третий — дух распри, находящийся в печени и желчи. Четвёртый — дух желания нравиться и колдовства, побуждающий человека с помощью всевозможных ухищрений казаться красивым. **5** Пятый — дух гордости, побуждающий хвалиться и высоко мнить о себе. Шестой — дух лжи, «в погибели и ревности»[a], побуждающий выдумывать речи и скрывать свои слова от родных и домашних. **6** Седьмой — дух неправедности, с которым сопряжены кражи и корыстные захваты[b], чтобы удовлетворить наслаждения его сердца. Ведь неправедность содействует прочим духам посредством даяния и получения.


    **7** Ко всем этим присоединяется дух сна — восьмой дух заблуждения и воображения. **8** Так гибнет всякий юноша: он омрачает свой разум, отвращаясь от истины, не постигает Божьего закона и не слушает наставлений своих отцов, как и я пострадал в юности.


    **9** А теперь, дети мои, любите истину, и она сохранит вас. Слушайте слова Рувима, вашего отца: я учу вас. **10** Не задерживайте взгляда на женской внешности, не проводите времени с замужней женщиной и не любопытствуйте о женских делах.'
