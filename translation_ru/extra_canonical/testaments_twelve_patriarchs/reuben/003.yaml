  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003.yaml
  text: 'And besides all these, there is an eighth spirit, the spirit of sleep, with which are created the trance of nature and the image of death.


    With these spirits are mixed the spirits of error. First, the spirit of sexual immorality is lodged in the nature and in the senses. Second, a spirit of insatiableness of the belly. Third, a spirit of fighting in the liver and in the gall. Fourth, a spirit of self-display and sorcery, so that through excessive meddling one may appear attractive. Fifth, a spirit of pride, so that one boasts and thinks grand thoughts. Sixth, a spirit of falsehood in destruction and jealousy, for shaping words and hiding one’s words from one’s own kin and household. Seventh, a spirit of injustice, with which come thefts and acts of greed, so that it may satisfy the pleasures of his heart. For injustice works together with the other spirits through taking and giving.


    And over all these the spirit of sleep is joined, which is the eighth spirit of error and fantasy. And so every young man is destroyed, darkening his mind from the truth and not understanding the law of God, nor listening to the instruction of his fathers, just as I also suffered in my youth.


    And now, my children, love the truth, and it will keep you safe. Hear the words of Reuben your father, as I teach you. Do not pay attention to a woman’s appearance, nor keep company with a married woman, nor pry into the affairs of women.'
translation:
  language: ru
  text: '**Завещание Рувима, 3**


    **1** Помимо всех этих есть восьмой дух — дух сна, вместе с которым созданы оцепенение естества и образ смерти. **2** С этими духами смешиваются духи заблуждения.


    **3** Первый — дух разврата: он пребывает в естестве и в чувствах. Второй — дух ненасытности чрева. **4** Третий — дух распри, находящийся в печени и желчи. Четвёртый — дух желания нравиться и колдовства, побуждающий человека с помощью всевозможных ухищрений казаться красивым. **5** Пятый — дух гордости, побуждающий хвалиться и высоко мнить о себе. Шестой — дух лжи, «в погибели и ревности»[a], побуждающий выдумывать речи и скрывать свои слова от родных и домашних. **6** Седьмой — дух неправедности, с которым сопряжены кражи и корыстные захваты[b], чтобы удовлетворить наслаждения его сердца. Ведь неправедность содействует прочим духам посредством даяния и получения.


    **7** Ко всем этим присоединяется дух сна — восьмой дух заблуждения и воображения. **8** Так гибнет всякий юноша: он омрачает свой разум, отвращаясь от истины, не постигает Божьего закона и не слушает наставлений своих отцов, как и я пострадал в юности.


    **9** А теперь, дети мои, любите истину, и она сохранит вас. Слушайте слова Рувима, вашего отца: я учу вас. **10** Не задерживайте взгляда на женской внешности, не проводите времени с замужней женщиной и не любопытствуйте о женских делах.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческие слова, переданные как «в погибели и ревности», по-видимому, повреждены в рукописной передаче; их связь с остальным предложением неясна.
    reason: Отмечает признанную издателем текстуальную порчу, не создавая искусственно гладкого смысла.
  - marker: b
    text: Редкое греческое слово здесь имеет не вполне ясный смысл; возможны значения «захваты», «вымогательства» или иные проявления алчности.
    reason: Сохраняет лексическую неопределённость γρηπίσματα и объясняет выбранное контекстуальное соответствие.
lexical_decisions:
- source_word: ἔκστασις φύσεως
  choice: оцепенение естества
  rationale: Сохраняет связь ἔκστασις с состоянием сна, при котором природные способности как бы приостанавливаются; «экстаз» в современном русском вызвал бы неверные ассоциации.
- source_word: πνεύματα τῆς πλάνης
  choice: духи заблуждения
  rationale: Передаёт πλάνη без преждевременного выбора между обманом, ошибкой и духовным уклонением.
- source_word: τὸ τῆς πορνείας πνεῦμα
  choice: дух разврата
  rationale: Πορνεία здесь обозначает половую безнравственность в широком смысле; «разврат» естественнее и шире, чем терминологическое «блудодеяние».
- source_word: ἀρεσκείας καὶ μαγγανείας
  choice: желания нравиться и колдовства
  rationale: 'Сохраняет два разных понятия: стремление произвести приятное впечатление и магические/чародейные ухищрения.'
- source_word: διὰ περιεργείας
  choice: с помощью всевозможных ухищрений
  rationale: В контексте внешней привлекательности περιεργία указывает на чрезмерно изощрённые занятия или приёмы; буквальное «через любопытство» здесь неясно.
- source_word: μεγαλοφρονῇ
  choice: высоко мнить о себе
  rationale: Естественно выражает надменное самомнение в паре с хвастовством.
- source_word: πλάττειν λόγους καὶ κρύπτειν λόγους
  choice: выдумывать речи и скрывать свои слова
  rationale: Сохраняет параллелизм исходного текста и смысл словесной лжи и сокрытия.
- source_word: δοσοληψίας
  choice: даяния и получения
  rationale: Буквально сохраняет двусторонность выражения, не сужая его без достаточных оснований до взяточничества или торговли.
- source_word: φαντασίας
  choice: воображения
  rationale: Передаёт способность создавать образы и грёзы; контекст допускает также оттенок иллюзии, который отмечен общей связью с заблуждением.
- source_word: μὴ προσέχετε ὄψει γυναικείᾳ
  choice: не засматривайтесь на женскую красоту
  rationale: Естественный русский запрет намеренно задерживать внимание на женском облике; ὄψις буквально означает вид или внешность.
- source_word: μήτε συνδιάζετε μετὰ θηλείας ὑπάνδρου
  choice: не проводите времени с замужней женщиной
  rationale: Передаёт продолжительное или близкое общение, выраженное συνδιάζετε, не добавляя отсутствующего в тексте указания на половой акт.
theological_decisions:
- issue: Онтологический статус перечисленных «духов»
  choice: Сохранено повторяющееся слово «дух» без пояснения, являются ли они личными существами, силами или склонностями.
  alternative: Передать как «склонность», «побуждение» или прямо назвать демонами.
  rationale: Греческое πνεῦμα допускает смысловой диапазон, а сам отрывок не разрешает неоднозначность окончательно.
- issue: Соотношение сна, заблуждения и воображения
  choice: Сохранена формулировка «восьмой дух заблуждения и воображения».
  alternative: Истолковать сон как демоническое наваждение или нейтральную телесную способность.
  rationale: Текст соединяет телесный сон с нравственным заблуждением, но не даёт основания систематизировать это учение.
- issue: Закон Бога
  choice: Переведено «Божьего закона» без отождествления с конкретным корпусом заповедей.
  alternative: Уточнить «закон Моисея» или «Тора».
  rationale: Исходный текст говорит обобщённо νόμος τοῦ θεοῦ; конкретизация была бы интерпретационным добавлением.
translation_notes:
  register: Современный литературный русский с достоинством завещательного наставления. Архаизмы ограничены прозрачными словами вроде «естество», «чрево» и «даяние», где они поддерживают ритм и образность древнего текста. Синтаксис местами разглажен для чтения вслух, но перечисление, телесная образность и смысловые напряжения оригинала сохранены.
