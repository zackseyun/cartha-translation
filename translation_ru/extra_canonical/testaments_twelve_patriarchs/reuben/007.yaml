  verdict: revise
  source_fidelity: 'Первая фраза точно передаёт сохранившийся греческий текст: καὶ ἀπέθανε, ἐντειλάμενος τοῖς υἱοῖς αὐτοῦ ταῦτα — Рувим умер после того, как дал своим сыновьям эти повеления. Вторая фраза до «до тех пор, пока» соответствует Καὶ ἔθεντο αὐτὸν ἐν σορῷ, ἕως. Сведения о перенесении из Египта, Хевроне и пещере являются восполнением после обрыва источника и надлежащим образом отмечены сноской.'
  naturalness: «Заповедав это своим сыновьям» грамматически возможно, но сочетание «заповедать это» несколько тяжеловесно и менее ясно в современном литературном русском. Конструкция «после того как дал своим сыновьям эти повеления» естественна, точно выражает предшествование действия и сохраняет властный характер ἐντειλάμενος.
  terminology: «Рувим», «сыновья», «гроб», «Египет» и «Хеврон» переданы удачно. «Повеления» точнее передаёт силу греческого ἐντειλάμενος, чем нейтральное «наставления». Сноска о текстологической границе должна говорить об имеющемся, а не «предоставленном», греческом свидетельстве.
