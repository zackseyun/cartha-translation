base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/007.yaml
  text: And Reuben died[a], after commanding these things to his sons. And they placed him in a coffin until he was brought up from Egypt and buried in Hebron[b], in the cave where his fathers were.
translation:
  language: ru
  text: И Рувим умер[a], после того как дал своим сыновьям эти повеления. Они положили его в гроб до тех пор, пока его не перенесли из Египта и не похоронили в Хевроне[b], в пещере, где покоились его отцы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имеющееся греческое свидетельство этой главы очень кратко и обрывается после слов «до тех пор, пока». Оставшаяся часть сообщения о погребении передана с минимальным восполнением по повествовательному контексту этого Завещания, а не по полностью восстановленному греческому тексту.
    reason: textual_variant
  - marker: b
    text: Хеврон и пещера, где покоились отцы, отсылают к преданию о родовой усыпальнице патриархов в книге Бытие.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπέθανε
  choice: умер
  rationale: Обычный греческий глагол со значением смерти передан прямо, без отсутствующего в оригинале эвфемизма вроде «уснул».
- source_word: ἐντειλάμενος
  choice: заповедав
  rationale: Причастие обозначает действие, предшествовавшее смерти Рувима, и сохраняет силу предсмертного повеления; форма естественна для достойного повествовательного регистра.
- source_word: υἱοῖς
  choice: сыновьям
  rationale: Греческое слово прямо называет сыновей, что соответствует обстановке патриархального завещания; более общее «детям» ослабило бы родственное обозначение.
- source_word: ἔθεντο
  choice: положили
  rationale: Простой глагол помещения передан естественным русским глаголом, уместным в описании погребального действия.
- source_word: σορῷ
  choice: в гроб
  rationale: Слово обозначает гроб или погребальный ларец. «Гроб» — наиболее ясный и не чрезмерно конкретизированный русский эквивалент.
- source_word: ἕως
  choice: до тех пор, пока не
  rationale: Сохраняется временное значение союза и мысль о временном помещении тела; такая конструкция естественна в русском предложении, хотя сохранившийся греческий текст обрывается сразу после этого слова.
theological_decisions:
- issue: Как передать крайне краткое и оборванное греческое свидетельство этой главы
  choice: Прямо перевести сохранившееся сообщение и лишь минимально завершить погребальный эпизод согласно повествовательному контексту
  alternative: Оставить предложение оборванным после «до тех пор, пока» либо полностью реконструировать окончание по другим свидетелям и изданиям
  rationale: Предоставленный греческий текст заканчивается на ἕως. Оборванная фраза была бы малопригодна как текст главы, тогда как развернутая реконструкция вышла бы за пределы данного свидетельства. Поэтому добавлено только необходимое завершение о перенесении из Египта и родовом погребении, а состояние источника открыто отмечено в сноске.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным звучанием. «Заповедав» сохраняет завещательный характер речи без излишней архаизации; «гроб» ясно передает погребальный предмет. Добавленное завершение сформулировано сдержанно, а граница сохранившегося греческого текста обозначена сноской.
