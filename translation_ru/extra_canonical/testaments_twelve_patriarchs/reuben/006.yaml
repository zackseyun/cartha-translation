  revised_text: '1. Итак, берегитесь разврата и храните свой ум в чистоте. Берегите также свои чувства от всякой женщины. 2. И женщинам также велите не сближаться с мужчинами, чтобы и они хранили свой ум в чистоте. 3. Ведь постоянные встречи, даже если нечестивый поступок не совершён, всё же становятся для них неисцелимой болезнью, а для нас — пагубным бесчестием от Велиара[a] и вечным позором. 4. Ибо в разврате нет ни разумения, ни благоговения перед Богом, и в его вожделении коренится всякая зависть. 5. Поэтому говорю вам: вы станете завидовать сыновьям Левия и захотите возвыситься над ними, но именно поэтому не одолеете. 6. Ибо Бог отомстит за них, а вы умрёте злой смертью. 7. Ведь Левию Бог дал священство, а Иуде вместе с ним — царство.[b] 8. Не превозноситесь над этими двумя, от которых Господь доведёт до конца то, что должно быть возвещено. 9. Заклинаю вас Богом небесным: пусть каждый поступает по истине со своим ближним[c] и любит своего брата. 10. Приближайтесь к Левию со смиренным
