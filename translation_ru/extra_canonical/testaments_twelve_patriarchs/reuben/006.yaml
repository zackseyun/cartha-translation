base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006.yaml
  text: '1. Guard yourselves, therefore, from sexual immorality, and be keeping your mind pure. Guard also your senses from every woman. 2. And command the women likewise not to associate closely with men, so that they too may keep their minds pure. 3. For constant encounters, even if the ungodly act is not carried out, are nevertheless for them an incurable disease, and for us a ruinous disgrace of Beliar and an everlasting reproach. 4. For sexual immorality has within itself neither understanding nor reverence for God, and every jealousy dwells in its desire. 5. Therefore I say to you: you will be jealous of the sons of Levi, and you will seek to exalt yourselves above them, but you will not prevail because of this. 6. For God will execute their vengeance, but you will die an evil death. 7. For to Levi God gave the priesthood, and to Judah with him the kingdom. 8. And do not be lifted up against these two, from whom the Lord will bring to completion what is to be spoken. 9. I adjure you
    by the God of heaven, that each of you practice truth toward his neighbor and that each have love toward his brother. 10. And draw near to Levi in humility of heart, so that you may receive a blessing from his mouth. 11. For he will bless Israel and Judah, because in him the Lord chose to reign before all the people. 12. And bow down to his seed, because for your sake it will die in visible and invisible wars, and among you there will be an everlasting king.'
translation:
  language: ru
  text: '1. Итак, берегитесь разврата и храните свой ум в чистоте. Берегите также свои чувства от всякой женщины. 2. И женщинам также велите не сближаться с мужчинами, чтобы и они хранили свой ум в чистоте. 3. Ведь постоянные встречи, даже если нечестивый поступок не совершён, всё же становятся для них неисцелимой болезнью, а для нас — пагубным бесчестием от Велиара[a] и вечным позором. 4. Ибо в разврате нет ни разумения, ни благоговения перед Богом, и в его вожделении коренится всякая зависть. 5. Поэтому говорю вам: вы станете завидовать сыновьям Левия и захотите возвыситься над ними, но именно поэтому не одолеете. 6. Ибо Бог отомстит за них, а вы умрёте злой смертью. 7. Ведь Левию Бог дал священство, а Иуде вместе с ним — царство.[b] 8. Не превозноситесь над этими двумя, от которых Господь доведёт до конца то, что должно быть возвещено. 9. Заклинаю вас Богом небесным: пусть каждый поступает по истине со своим ближним[c] и любит своего брата. 10. Приближайтесь к Левию со смиренным сердцем,
    чтобы получить благословение из его уст. 11. Ведь он благословит Израиля и Иуду, потому что в нём Господь избрал царствовать перед всем народом. 12. Поклонитесь и его потомству[d], потому что ради вас оно умрёт в войнах видимых и невидимых, и среди вас будет вечный Царь.


    [a] «Велиар» передаёт греческую форму имени; некоторым читателям оно известно в форме «Велиал».


    [b] Стихи 7–8 в сохранившемся греческом тексте сильно повреждены и трудны для восстановления. Перевод передаёт вероятный смысл: Левию дано священство, а Иуде — царская власть; автор предостерегает от противления обеим линиям.


    [c] Буквально: «творит истину по отношению к своему ближнему» — то есть поступает правдиво и верно, а не только говорит правду.


    [d] Выражение «поклонитесь его потомству» может означать почтение потомкам определённого рода, а не богопоклонение.'
  philosophy: optimal-equivalence
