lexical_decisions:
- source_word: φυλάξατε
  choice: берегитесь / берегите
  rationale: Императив сохраняет сильный увещательный тон и идею бдительной нравственной охраны.
- source_word: πορνεία
  choice: разврат
  rationale: Современное широкое обозначение недозволенного сексуального поведения без неоправданного сужения смысла до одного его вида.
- source_word: καθαρεύοντες τῇ διανοίᾳ
  choice: храните свой ум в чистоте
  rationale: Естественно передаёт как внутреннюю чистоту, так и длительное усилие её сохранять.
- source_word: αἰσθήσεις
  choice: чувства
  rationale: Передаёт способности чувственного восприятия как возможные пути возникновения желания; более естественно по-русски, чем «ощущения» в данном призыве.
- source_word: συνδιάζειν
  choice: сближаться
  rationale: Обозначает тесное общение, не утверждая, что половой поступок уже совершён.
- source_word: συνεχεῖς συντυχίαι
  choice: постоянные встречи
  rationale: Сохраняет акцент на повторяющемся контакте.
- source_word: ἀσέβημα
  choice: нечестивый поступок
  rationale: Сохраняет религиозно-нравственную оценку действия.
- source_word: νόσος ἀνίατος
  choice: неисцелимая болезнь
  rationale: Прямо сохраняет метафору болезни.
- source_word: Βελίαρ
  choice: Велиар
  rationale: Следует греческой форме имени, не гармонизируя её с более привычной формой «Велиал».
- source_word: σύνεσις
  choice: разумение
  rationale: Сохраняет нравственно-интеллектуальный оттенок и достоинство регистра.
- source_word: εὐσέβεια
  choice: благоговение перед Богом
  rationale: Ясно выражает направленность понятия к Богу, не прибегая к менее прозрачному слову «благочестие».
- source_word: ζῆλος / ζηλώσετε
  choice: зависть / станете завидовать
  rationale: Контекст говорит о враждебном соперничестве с сыновьями Левия, а не о похвальном усердии.
- source_word: ποιεῖν ἀλήθειαν
  choice: поступать по истине
  rationale: Передаёт семитизированную идиому как правдивое и верное поведение, сохраняя её образность.
- source_word: προσκυνήσατε
  choice: поклонитесь
  rationale: Сохраняет жест почтения; примечание не позволяет автоматически истолковать его как богопоклонение.
theological_decisions:
- issue: Текстуально повреждённые стихи 7–8
  choice: Переданы как дарование Левию священства, Иуде — царства и запрет превозноситься над обеими линиями.
  alternative: Оставить синтаксис фрагментарным либо не называть священство и царство.
  rationale: Сохранившиеся указания и контекст поддерживают традиционно восстанавливаемый смысл, но степень уверенности честно отмечена в сноске.
- issue: Соотношение Левия, Иуды и царского ожидания в стихах 11–12
  choice: Сохранены местоименная неоднозначность выражения «в нём», неопределённость потомственной линии и образ вечного Царя.
  alternative: Однозначно отнести потомство либо к священнической линии Левия, либо к мессианской линии Иуды.
  rationale: Текст соединяет мотивы Левия и Иуды и допускает многослойное прочтение; конфессиональная гармонизация устранила бы подлинное напряжение.
- issue: Значение поклонения потомству
  choice: Основной текст говорит «поклонитесь», а сноска поясняет возможность династического почтения.
  alternative: Перевести «почтите» или истолковать действие как богопоклонение.
  rationale: Так сохраняется сила προσκυνέω без навязывания объекту божественного статуса.
- issue: Средний род σπέρμα и глагол смерти в стихе 12
  choice: «Потомство… оно умрёт».
  alternative: Персонализировать как «потомок… он умрёт».
  rationale: Коллективное или индивидуальное значение «семени/потомства» в греческом не разрешено однозначно; русский средний род сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с ясным, достойным увещательным тоном. Архаизмы сведены к минимуму; сохранены библейски уместные слова «благоговение», «заклинаю», «потомство». Неясности повреждённого текста и родовой принадлежности в финальных стихах не устранены конфессиональной интерпретацией.
