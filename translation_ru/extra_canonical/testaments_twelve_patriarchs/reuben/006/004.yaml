id: T12P.REU.6.4
reference: Testament of Reuben 6:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Ὅτι ἣ²¹ πορνεία * οὔτε σύνεσιν οὔτε22 †εὐσέβειαν23 ἔχει ἐν ἑαυτῇ· καὶ24 πᾶς25 ζῆλος κατοικεῖ26 ἐν τῇ ἐπιθυμίᾳ αὐτῆς27.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/004.yaml
  text: For sexual immorality has within itself neither understanding nor godliness, and every jealousy dwells in its desire.
translation:
  language: ru
  text: Ибо блуд не имеет в себе ни разумения, ни благочестия, и всякая ревность обитает в его вожделении.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνεία
  choice: блуд
  rationale: Передаёт сексуальную распущенность как нравственную категорию; в контексте древнего иудео-христианского наставления это естественный и ёмкий русский эквивалент.
- source_word: σύνεσιν
  choice: разумения
  rationale: Сохраняет значение способности понимать и здраво рассуждать, а также возвышенный наставительный регистр.
- source_word: εὐσέβειαν
  choice: благочестия
  rationale: Прямой и традиционно понятный эквивалент для религиозно-нравственной добродетели εὐσέβεια без пояснительного расширения.
- source_word: ζῆλος
  choice: ревность
  rationale: Сохраняет неоднозначность греческого слова, которое может обозначать ревность, завистливое соперничество или пыл; контекст не требует сводить его только к зависти.
- source_word: ἐπιθυμίᾳ
  choice: вожделении
  rationale: Передаёт сильное, нравственно окрашенное желание и соответствует контексту πορνεία лучше, чем нейтральное «желание».
theological_decisions:
- issue: Характер εὐσέβεια
  choice: благочестие
  alternative: богобоязненность / почтение к Богу
  rationale: «Благочестие» сохраняет широкое значение религиозно-нравственной направленности и не добавляет в текст прямого упоминания Бога, отсутствующего в данной фразе.
- issue: Смысл ζῆλος
  choice: ревность
  alternative: зависть
  rationale: Оставлена присущая слову смысловая напряжённость; перевод «зависть» необоснованно сузил бы возможное значение.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего нравственного наставления. Синтаксис близок к греческому, но остаётся естественным; местоимение «его» согласовано с русским словом «блуд».
