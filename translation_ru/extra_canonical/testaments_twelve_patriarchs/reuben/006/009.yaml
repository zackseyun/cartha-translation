base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/009.yaml
  text: I adjure you by the God of heaven, that each of you do truth toward his neighbor and that each have love toward his brother.
translation:
  language: ru
  text: Заклинаю вас Богом небесным, чтобы каждый из вас был правдив со своим ближним и любил своего брата.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρκῶ ὑμᾶς
  choice: Заклинаю вас
  rationale: Передаёт торжественное обязательство, выраженное глаголом ὁρκῶ, без ослабления до простого «прошу».
- source_word: τὸν Θεὸν τοῦ οὐρανοῦ
  choice: Богом небесным
  rationale: Естественная для современного литературного русского языка передача греческого оборота «Богом неба» при сохранении возвышенного регистра.
- source_word: ποιεῖν ἀλήθειαν
  choice: поступает по правде
  rationale: Греческий семитизированный оборот буквально означает «делать истину»; выбранная формулировка сохраняет деятельный нравственный смысл и звучит естественно по-русски.
- source_word: πρὸς τὸν πλησίον αὐτοῦ
  choice: со своим ближним
  rationale: Предлог πρὸς здесь выражает направленность поведения по отношению к ближнему; «со своим ближним» идиоматично передаёт это отношение.
- source_word: ἀγάπην ἔχειν
  choice: любит
  rationale: Буквальное «имеет любовь» в данном наставлении неестественно по-русски; глагольная передача ясно выражает длительное отношение любви.
- source_word: ἀδελφὸν αὐτοῦ
  choice: своего брата
  rationale: Сохраняет родственный термин исходного текста и не расширяет его толкованием.
theological_decisions:
- issue: Смысл выражения ποιεῖν ἀλήθειαν
  choice: поступает по правде
  alternative: творит истину / делает правду
  rationale: Формулировка сохраняет связь истины с действием, но не навязывает метафизического смысла и не создаёт в современном русском неясного или искусственного оборота.
- issue: Объём значения слова ἀδελφός
  choice: брат
  alternative: собрат / ближний
  rationale: Сохранён прямой образ исходного текста; контекст не требует догматически уточнять, идёт ли речь только о кровном брате или о члене общины.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным наставительным тоном. Синтаксический параллелизм двух предписаний сохранён; архаизмы и конфессионально маркированная лексика не используются.
