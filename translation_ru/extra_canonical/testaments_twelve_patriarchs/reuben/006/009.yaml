review_pass:
  verdict: revise
  source_fidelity: «Заклинаю вас Богом небесным» точно передаёт торжественную формулу Ὁρκῶ ὑμᾶς τὸν Θεὸν τοῦ οὐρανοῦ. Однако «поступает по правде» может в современном русском означать прежде всего «поступает справедливо», тогда как ἀλήθεια — «истина, правдивость». Более точно передать этическую направленность ποιεῖν ἀλήθειαν как «быть правдивым».
  naturalness: Предложенная правка сохраняет современный литературный и наставительный регистр. Конструкция «чтобы каждый из вас был правдив... и любил...» естественно подчинена глаголу «заклинаю» и не требует повторять «пусть каждый».
  terminology: «Бог небесный», «ближний» и «брат» сохранены без конфессиональных или доктринальных уточнений. «Был правдив» передаёт ἀλήθεια как истину/правдивость, не подменяя её «справедливостью».
  issues:
  - severity: medium
    issue: «Поступает по правде» семантически смещает ἀλήθεια в сторону справедливости.
    rationale: В современном русском «по правде» часто характеризует справедливое или правильное действие. В греческом ἀλήθεια означает «истина; правдивость», а оборот ποιεῖν ἀλήθειαν в данном нравственном наставлении уместно передать как требование быть правдивым по отношению к ближнему.
