translation:
  language: ru
  text: до завершения времён [первосвященника-Мессии, о котором говорил Господь].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова в квадратных скобках так обозначены в используемом греческом издании; скобки указывают на сомнение в принадлежности этих слов исходному тексту.
    reason: Сохранить редакционную текстологическую оговорку источника и не представить спорную фразу как бесспорную.
lexical_decisions:
- source_word: ἕως τελειώσεως χρόνων
  choice: до завершения времён
  rationale: Передаёт значение предела, выраженного ἕως, и отглагольного существительного τελείωσις как достижения завершения; множественное число χρόνων сохранено.
- source_word: ἀρχιερέως χριστοῦ
  choice: первосвященника-Мессии
  rationale: ἀρχιερεύς передано обычным библейским термином «первосвященник», а χριστός — как титул «Мессия»; дефис показывает сочетание двух титульных обозначений одного лица, не превращая χριστός в личное имя.
- source_word: ὃν εἶπε Κύριος
  choice: о котором сказал Господь
  rationale: Относительное местоимение отнесено к первосвященнику-Мессии; конструкция с εἶπε передана естественным русским оборотом без добавления отсутствующего в греческом содержания речи.
theological_decisions:
- issue: Значение χριστοῦ в выражении ἀρχιερέως χριστοῦ
  choice: Мессии
  alternative: Помазанника / Христа
  rationale: Контекст сочетает священнический титул с χριστός. «Мессия» ясно сохраняет титульный смысл и не навязывает отождествление посредством личного имени «Христос»; «Помазанник» возможно, но в данном эсхатологическом выражении менее непосредственно распознаётся современным читателем.
- issue: Связь родительного ἀρχιερέως χριστοῦ с χρόνων
  choice: сохранена как «времён первосвященника-Мессии»
  alternative: вынести титул в отдельное обстоятельство или перефразировать
  rationale: Греческая форма допускает прямую зависимость родительного оборота от «времён». Перевод сохраняет эту синтаксическую связь и не уточняет характер принадлежащих Мессии времён.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской лексикой. Формула краткая и торжественная; необычное выражение «завершение времён» сохранено ради точности и эсхатологической многозначности оригинала.
