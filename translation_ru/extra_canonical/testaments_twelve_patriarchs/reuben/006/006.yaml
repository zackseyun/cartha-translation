  source_fidelity: '«Бог совершит над ними возмездие» точно передаёт ποιήσει τὴν ἐκδίκησιν αὐτῶν в его контекстуально обусловленном объективном понимании: Бог совершит возмездие над ними. Противопоставление δέ адекватно передано союзом «а». «Умрёте злой смертью» сохраняет усилительную родственную конструкцию ἀποθανεῖτε θανάτῳ и оставляет πονηρῷ в его намеренно широком, зловещем значении.'
