translation:
  language: ru
  text: Ибо Бог совершит над ними возмездие, а вы умрёте злой смертью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: совершит над ними возмездие
  rationale: Оборот передаёт действие Божьего воздаяния, направленного на них; местоимение αὐτῶν понято объективно, в соответствии с контекстом и аудированной редакцией.
- source_word: ἀποθανεῖτε θανάτῳ πονηρῷ
  choice: умрёте злой смертью
  rationale: Сохранена выразительная родственная конструкция оригинала и нравственно-зловещая окраска πονηρός без уточнения, которого нет в греческом тексте.
theological_decisions:
- issue: Характер Божьего действия в выражении ἐκδίκησις
  choice: возмездие
  alternative: месть
  rationale: «Возмездие» естественно обозначает справедливое наказание и не приписывает Богу импульсивной личной мстительности, при этом не ослабляя суровости высказывания.
- issue: Направленность местоимения αὐτῶν
  choice: над ними
  alternative: их возмездие
  rationale: Греческая форма допускает формальную двусмысленность, однако смысл «возмездие над ними» лучше соответствует синтаксическому и контекстуальному пониманию, отражённому в последней редакции консультационного перевода.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, торжественная и суровая. Союзы «ибо» и «а» сохраняют причинную связь и резкое противопоставление оригинала.
