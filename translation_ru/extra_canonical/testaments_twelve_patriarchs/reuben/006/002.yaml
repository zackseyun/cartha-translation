  text: Тем женщинам также велите не общаться с мужчинами, чтобы и они были чисты в мыслях.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κἀκείνας
  choice: и тем женщинам
  rationale: Слитная форма καὶ ἐκείνας указывает на ранее упомянутых женщин; существительное «женщинам» естественно восстанавливается из контекста.
- source_word: ἐντέλλεσθε
  choice: велите
  rationale: Передаёт повелительное значение глагола ἐντέλλομαι и сохраняет обращение во множественном числе.
- source_word: μὴ συνδιάζειν τοῖς ἀνδράσιν
  choice: не общаться с мужчинами
  rationale: Нейтрально передаёт совместное пребывание или общение, не добавляя отсутствующего в греческом уточнения о степени близости.
- source_word: καθαρεύωσι τῇ διανοίᾳ
  choice: сохраняли чистоту помыслов
  rationale: Естественная русская передача чистоты в сфере внутреннего мышления; «помыслы» отражают διάνοια точнее, чем физически окрашенное «разум».
