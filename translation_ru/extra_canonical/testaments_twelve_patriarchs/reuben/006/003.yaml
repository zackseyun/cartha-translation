id: T12P.REU.6.3
reference: Testament of Reuben 6:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '* Αἱ γὰρ συνεχεῖς συντυχίαι¹⁵, κἂν μὴ πραχθῇ¹⁶ τὸ ἀσέβημα, ὅμως αὐταῖς¹⁷ μὲν ἐστι νόσος ἀνίατος¹⁸, ἡμῖν¹⁹ δὲ * εἰς ὄλεθρον ὄνειδος Βελίαρ καὶ ὄνειδος αἰώνιον²⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/003.yaml
  text: For constant encounters, even if the ungodly act is not carried out, are nevertheless for them an incurable disease, and for us a destructive disgrace of Beliar and an everlasting reproach.
translation:
  language: ru
  text: Ибо постоянные встречи, даже если нечестивый поступок не будет совершён, всё же для них — неизлечимая болезнь, а для нас — ведущий к гибели позор Велиара[a] и вечное бесчестие.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая конструкция допускает также понимание: «позор от Велиара» или «Велиар — позор, ведущий к гибели».'
    reason: Неясна синтаксическая связь несклоняемого имени Βελίαρ с соседним словом ὄνειδος.
lexical_decisions:
- source_word: συνεχεῖς συντυχίαι
  choice: постоянные встречи
  rationale: Передаёт повторяющиеся или непрерывно возобновляющиеся встречи без добавления не выраженной в греческом причины или характера общения.
- source_word: τὸ ἀσέβημα
  choice: нечестивый поступок
  rationale: Сохраняет нравственно-религиозную окраску ἀσέβημα и не конкретизирует поступок сверх исходного текста.
- source_word: νόσος ἀνίατος
  choice: неизлечимая болезнь
  rationale: Прямой и естественный эквивалент греческого выражения.
- source_word: εἰς ὄλεθρον
  choice: ведущий к гибели
  rationale: Передаёт направленность или результат — к погибели, разрушению, — не сводя выражение лишь к качественному прилагательному.
- source_word: ὄνειδος αἰώνιον
  choice: вечное бесчестие
  rationale: Сохраняет значение непреходящего позора и позволяет избежать тяжёлого дословного повтора слова «позор».
theological_decisions:
- issue: Связь имени Βελίαρ со словом ὄνειδος
  choice: позор Велиара
  alternative: позор от Велиара / Велиар — позор, ведущий к гибели
  rationale: Краткая именная конструкция сохраняет синтаксическую неоднозначность греческого текста и не определяет без достаточного основания, является ли Велиар источником позора, его характеристикой или подлежащим подразумеваемой связки.
translation_notes:
  register: Современный литературный русский язык с сдержанным, нравоучительным звучанием. Синтаксис сохранён близким к греческому, но оформлен естественно для русского читателя; тире проясняют сопоставление «для них — для нас».
