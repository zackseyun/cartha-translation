source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Αὐτὸς γὰρ⁷⁰ εὐλογήσει τὸν Ἰσραὴλ καὶ τὸν Ἰούδαν· * ὅτι ἐν αὐτῷ⁷¹ ἐξελέξατο Κύριος⁷² βασιλεύειν⁷³ ἐνώπιον⁷⁴ * παντὸς τοῦ λαοῦ⁷⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/011.yaml
  text: For he will bless Israel and Judah, because in him the Lord chose to reign before all the people.
translation:
  language: ru
  text: Ибо он благословит Израиль и Иуду, потому что в нём Господь избрал царствовать перед всем народом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτὸς
  choice: он
  rationale: Сохранено эмфатическое личное местоимение; его референт определяется предшествующим контекстом.
- source_word: εὐλογήσει
  choice: благословит
  rationale: Будущее время и обычное библейское значение глагола переданы непосредственно.
- source_word: ἐν αὐτῷ
  choice: в нём
  rationale: Буквальная формулировка сохраняет неоднозначность связи местоимения, не подменяя её толкованием «через него» или «среди него».
- source_word: ἐξελέξατο
  choice: избрал
  rationale: Медиальная форма передаёт осознанный выбор Господа; естественное русское «избрал» не требует добавления объекта.
- source_word: βασιλεύειν
  choice: царствовать
  rationale: Инфинитив сохранён как дополнение к «избрал», без уточнения субъекта сверх того, что выражено греческим текстом.
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: перед всем народом
  rationale: Естественный русский эквивалент пространственно-публичного выражения, сохраняющий единственное число собирательного «народ».
theological_decisions:
- issue: Кто должен царствовать согласно сочетанию ἐξελέξατο Κύριος βασιλεύειν
  choice: Сохранена конструкция «Господь избрал царствовать», в которой Господь грамматически воспринимается субъектом инфинитива.
  alternative: «Господь избрал его, чтобы он царствовал» или «Господь избрал в нём царя».
  rationale: В греческом тексте нет явно выраженного дополнения «его» и нет слова «царь»; их добавление разрешило бы возможную богословскую напряжённость без достаточного текстового основания.
- issue: Значение ἐν αὐτῷ
  choice: «в нём»
  alternative: «через него»
  rationale: Предлог ἐν допускает различные контекстуальные оттенки; формальное «в нём» сохраняет подлинную неоднозначность исходного текста.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис намеренно близок к греческому там, где более свободная передача могла бы навязать толкование.
