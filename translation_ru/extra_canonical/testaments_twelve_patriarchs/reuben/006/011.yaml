  source_fidelity: 'Текст точно передаёт греческий порядок смысловых отношений: эмфатическое «он», будущее «благословит», оба имени, причинное ὅτι, формально неоднозначное «в нём», а также конструкцию «Господь избрал царствовать». Не добавлен отсутствующий в данном греческом тексте объект («его») и не устранена синтаксическая трудность через интерпретационный пересказ. «Перед всем народом» адекватно передаёт ἐνώπιον παντὸς τοῦ λαοῦ.'
