  text: And draw near to Levi in humility of your heart, so that you may receive a blessing from his mouth.
translation:
  language: ru
  text: И подойдите к Левию в смирении ваших сердец, чтобы принять благословение из его уст.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγίσατε
  choice: приближайтесь
  rationale: Передаёт повелительное значение аориста и направленность действия к Левию; форма несовершенного вида естественна для общего наставления на русском языке.
- source_word: ἐν ταπεινώσει καρδίας ὑμῶν
  choice: в смирении ваших сердец
  rationale: Сохраняет существительное «смирение» и явное местоимение ὑμῶν. Единственное число καρδίας имеет распределительное значение при обращении к нескольким слушателям, поэтому по-русски естественно множественное «сердец».
- source_word: δέξησθε εὐλογίαν
  choice: принять благословение
  rationale: «Принять» естественно передаёт δέχομαι как получение даруемого благословения, не уточняя его характер.
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: из его уст
  rationale: Сохраняет образное указание на благословение, произносимое Левием, без добавочного толкования.
theological_decisions:
- issue: Роль Левия как источника благословения
  choice: «благословение из его уст»
  alternative: «благословение, произнесённое им»
  rationale: Буквальный образ греческого текста сохранён; перевод не определяет, принадлежит ли благословение самому Левию или передаётся через него.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Союз «И» сохранён как связь с предшествующим наставлением; синтаксис остаётся ясным для обычного читателя.
