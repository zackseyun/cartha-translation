  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/005.yaml
  text: 'Therefore I say to you: you will envy the sons of Levi and seek to be exalted above them, but because of this you will not prevail.'
translation:
  language: ru
  text: 'Поэтому говорю вам: вы будете завидовать сыновьям Левия и добиваться, чтобы вас возвысили над ними, но из-за этого не одержите верх[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не будете иметь силы»; греческий глагол может означать как отсутствие силы или способности, так и неспособность одолеть либо добиться успеха.'
    reason: Сохраняет смысловой диапазон οὐ ἰσχύσετε, который контекст допускает передать и буквально, и как неудачу в соперничестве.
lexical_decisions:
- source_word: ζηλώσετε
  choice: будете завидовать
  rationale: 'В данном контексте глагол обозначает завистливое соперничество: потомки Рувима желают положения сыновей Левия.'
- source_word: ὑψωθῆναι ὑπὲρ αὐτούς
  choice: чтобы вас возвысили над ними
  rationale: Конструкция сохраняет страдательное значение аориста ὑψωθῆναι и сравнительное значение ὑπέρ, не превращая его без основания в возвратное «возвыситься».
- source_word: οὐ ἰσχύσετε
  choice: не одержите верх
  rationale: Передаёт значение отсутствия силы добиться превосходства или победы и естественно звучит в контексте соперничества.
theological_decisions:
- issue: Отношение потомков Рувима к сынам Левия
  choice: Сохранено предсказание зависти и безуспешной попытки занять более высокое положение.
  alternative: Истолковать фразу как конкретное учение о священнической или политической власти.
  rationale: Греческий текст говорит о сынах Левия и возвышении над ними, но в самом стихе не уточняет ни институт власти, ни богословский механизм неудачи.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Повтор «поэтому — из-за этого» сохранён, поскольку он отражает повтор διὰ τοῦτο в начале и конце греческой фразы; страдательная форма выражена явно.
