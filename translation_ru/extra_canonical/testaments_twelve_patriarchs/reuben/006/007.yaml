translation:
  language: ru
  text: Ибо Левию Бог дал священство, а Иуде вместе с ним — царство.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предоставленная греческая строка в данном месте сильно искажена и фрагментарна; перевод следует восстановимому смыслу стиха, отражённому в текстовой традиции и проверочном английском слое.
    reason: Читателю сообщается о ненадёжности непосредственно предоставленной формы исходного текста без сокрытия текстологической проблемы.
lexical_decisions:
- source_word: Λευί
  choice: Левию
  rationale: Передано как имя адресата дара в дательном падеже; форма соответствует смыслу засвидетельствованной традиции стиха.
- source_word: ἱερωσύνη
  choice: священство
  rationale: Естественный и точный русский эквивалент для священнического служения и достоинства; более узкое «первосвященство» не выбрано без надёжного подтверждения в предоставленном греческом фрагменте.
- source_word: Ἰούδας
  choice: Иуде
  rationale: 'Дательный падеж сохраняет параллель: Левию дано священство, Иуде — царство.'
- source_word: βασιλεία
  choice: царство
  rationale: Сохраняет смысл царской власти и царского удела, не сужая его до отвлечённого «правления».
- source_word: μετ’ αὐτοῦ
  choice: вместе с ним
  rationale: Сохраняет формальную неоднозначность связи Иуды с Левием и не заменяет её толкованием вроде «после него» или «под его началом».
theological_decisions:
- issue: Соотношение священства Левия и царства Иуды
  choice: Сохранена параллель двух даров и выражение «вместе с ним».
  alternative: Истолковать царство Иуды как подчинённое священству Левия либо как данное позднее.
  rationale: Текст утверждает различие даров, но краткая формула не объясняет точного характера их взаимосвязи; перевод не должен вносить конфессиональное толкование.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная синтаксическая параллель сохранена. Тире во второй части естественно восполняет опущенное «дал». Формулировка избегает архаизмов и не разрешает неоднозначность «вместе с ним».
