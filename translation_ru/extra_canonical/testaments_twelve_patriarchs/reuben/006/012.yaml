  to: И поклонитесь его потомству[a], потому что оно умрёт за вас в войнах видимых и невидимых. И среди вас будет вечный царь.
  rationale: 'Заменены «его потомку» и «он» на собирательные «его потомству» и «оно», чтобы не решать в переводе вопрос, который греческая грамматика не решает однозначно. Остальная формулировка сохранена: связь умершего потомства с вечным царём по-прежнему не утверждается прямо.'
