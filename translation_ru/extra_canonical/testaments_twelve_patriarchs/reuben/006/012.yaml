review_pass:
  verdict: revise
  source_fidelity: Основной текст точно передаёт повеление προσκυνήσατε, мотив ὅτι, формулу ὑπὲρ ὑμῶν, противопоставление видимых и невидимых войн и отдельное сообщение о вечном царе. Однако греческое τὸ σπέρμα — существительное среднего рода, а форма ἀποθανεῖται сама по себе не подтверждает личного мужского прочтения. Перевод «потомку … он умрёт» обоснованно возможен, но в основном тексте снимает сохраняемую оригиналом неоднозначность между одним потомком и потомством.
  naturalness: «Его потомству» и согласование «оно умрёт» литературно естественны в торжественном пророческом контексте. Сочетание «видимых и невидимых войнах» намеренно необычно, но соответствует образу источника и не нуждается в сглаживании.
  terminology: «Поклонитесь», «за вас» и «вечный царь» удачны и не навязывают конфессионального истолкования. «Потомство» лучше сохраняет семантический диапазон σπέρμα; возможность понимания как одного потомка следует оставить в сноске.
