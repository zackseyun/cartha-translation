source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ προσκυνήσατε⁷⁶ * τὸ σπέρμα⁷⁷ αὐτοῦ, ὅτι⁷⁸ ὑπὲρ ὑμῶν⁷⁹ ἀποθανεῖται⁸⁰ ἐν πολέμοις ὁρατοῖς καὶ⁸¹ ἀοράτοις. καὶ * ἐν ὑμῖν ἔσται⁸² * βασιλεὺς αἰώνιος⁸³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/012.yaml
  text: And bow down to his offspring, because for your sake it will die in visible and invisible wars, and among you there will be an eternal king.
translation:
  language: ru
  text: И поклонитесь его потомству[a], потому что оно умрёт за вас в войнах видимых и невидимых. И среди вас будет вечный царь.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греч. σπέρμα может означать «семя», «потомство» или отдельного «потомка».
    reason: Сноска сохраняет лексическую неоднозначность греческого слова, тогда как «потомство» в основном тексте передаёт его собирательное значение без исключения личного прочтения.
lexical_decisions:
- source_word: προσκυνήσατε
  choice: поклонитесь
  rationale: Передаёт жест почтения или поклонения, не снимая присущей греческому глаголу смысловой широты.
- source_word: τὸ σπέρμα αὐτοῦ
  choice: его потомку
  rationale: В данном контексте единственное число последующего глагола допускает личное прочтение; «потомок» естественнее в современном русском, а возможное собирательное значение отмечено в сноске.
- source_word: ὑπὲρ ὑμῶν
  choice: за вас
  rationale: Кратко и естественно передаёт действие ради или в пользу адресатов.
- source_word: ἐν πολέμοις ὁρατοῖς καὶ ἀοράτοις
  choice: в войнах видимых и невидимых
  rationale: Сохраняет необычное противопоставление оригинала без поясняющего истолкования.
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: Наиболее естественное пространственно-общественное значение ἐν с местоимением во множественном числе.
- source_word: βασιλεὺς αἰώνιος
  choice: вечный царь
  rationale: Прямо передаёт αἰώνιος и сохраняет именную формулировку оригинала.
theological_decisions:
- issue: Характер поклонения, выраженного προσκυνήσατε
  choice: поклонитесь
  alternative: почтите / поклоняйтесь
  rationale: «Поклонитесь» сохраняет возможность как почтительного преклонения, так и религиозного поклонения, не предрешая богословский статус потомка.
- issue: Единственное или собирательное значение σπέρμα
  choice: личное единственное число «потомку … он умрёт»
  alternative: собирательное «потомству … оно умрёт» или буквальное «семени»
  rationale: Согласование с глаголом в единственном числе и последующее упоминание царя поддерживают личное прочтение, однако лексическая неоднозначность σπέρμα сохранена в сноске.
- issue: Связь умершего потомка с вечным царём
  choice: не обозначать прямо, одно ли это лицо
  alternative: повторить местоимение «он будет вечным царём»
  rationale: Греческий текст вводит второе утверждение словами «и среди вас будет вечный царь», не устанавливая грамматически явного тождества; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский с кратким, торжественным синтаксисом. Сохранены образ «видимых и невидимых войн» и неоднозначная связь между потомком и вечным царём; архаизмы не использованы.
