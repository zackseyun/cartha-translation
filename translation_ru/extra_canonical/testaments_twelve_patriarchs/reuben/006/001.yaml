base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/001.yaml
  text: Guard yourselves, therefore, from sexual immorality, and keep your mind pure. Guard also your senses from every woman.
translation:
  language: ru
  text: Итак, берегитесь разврата и храните ум в чистоте. Берегите также свои чувства от всякой женщины.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνείας
  choice: разврата
  rationale: Передаёт сексуальную распущенность или недозволенные половые отношения; в данном наставлении естественнее современного узкого значения слова «блуд».
- source_word: καθαρεύοντες τῇ διανοίᾳ
  choice: сохраняйте чистоту помыслов
  rationale: Естественно передаёт продолжительный призыв быть чистыми в уме и внутреннем расположении, не утяжеляя фразу буквальным «будьте очищающимися умом».
- source_word: τὰς αἰσθήσεις ὑμῶν
  choice: свои чувства
  rationale: αἰσθήσεις обозначает способности чувственного восприятия; «чувства» сохраняет широту греческого выражения.
- source_word: ἀπὸ πάσης γυναικῶν
  choice: от всякой женщины
  rationale: Греческое выражение синтаксически необычно, но его очевидный практический смысл — предостережение в отношении каждой женщины; перевод следует засвидетельствованному английскому консультационному слою, не добавляя отсутствующих уточнений.
theological_decisions:
- issue: Объём запрета в заключительной фразе
  choice: Сохранено общее выражение «от всякой женщины»
  alternative: «от всякого женского соблазна»
  rationale: Альтернатива была бы более объяснительной и могла бы сузить либо истолковать резкую формулировку источника; перевод сохраняет её напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством наставительного завещательного жанра. Повтор глаголов «берегитесь / оберегайте» отражает повтор φυλάξατε, но избегает стилистической монотонности.
