  text: With these spirits are mixed the spirits of error.
translation:
  language: ru
  text: С этими духами смешиваются духи заблуждения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συμμίγνυται
  choice: смешиваются
  rationale: Передаёт буквальный образ соединения или смешения; греческое сказуемое стоит в единственном числе при подлежащем среднего рода множественного числа, тогда как по-русски требуется множественное число.
- source_word: τὰ πνεύματα τῆς πλάνης
  choice: духи заблуждения
  rationale: Сохраняет родительную конструкцию и смысл πλάνη как заблуждения, обмана или уклонения, не сужая его до одной возможной трактовки.
theological_decisions:
- issue: Характер «духов заблуждения»
  choice: Сохранено выражение «духи заблуждения» без пояснения их природы.
  alternative: «духи, вводящие в заблуждение» или «злые духи»
  rationale: 'Исходный текст допускает неоднозначность: родительный падеж может указывать на свойство, источник или действие этих духов; добавление определения «злые» отсутствовало бы в греческом тексте.'
translation_notes:
  register: Краткая, естественная и близкая к греческому синтаксису формулировка; повтор слова «духи» намеренно сохранён.
