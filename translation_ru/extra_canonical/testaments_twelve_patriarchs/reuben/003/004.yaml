  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/004.yaml
  text: Third, a spirit of fighting in the liver and in the gall. Fourth, a spirit of self-display and sorcery, so that through excessive meddling one may appear attractive.
translation:
  language: ru
  text: Третий — дух борьбы в печени и желчи. Четвёртый — дух желания нравиться и колдовства, чтобы благодаря чрезмерным ухищрениям выглядеть привлекательным.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάχης
  choice: вражды
  rationale: Родительное μάχης обозначает борьбу, распрю или склонность к конфликту; «вражда» естественно передаёт здесь порок, связанный с духом.
- source_word: ἀρεσκείας
  choice: желания нравиться
  rationale: Слово обозначает стремление угождать или производить приятное впечатление; развёрнутая передача яснее современному читателю и сохраняет направленность на одобрение окружающих.
- source_word: μαγγανείας
  choice: колдовства
  rationale: Обычное значение — магия, чародейство или колдовские ухищрения; «колдовство» является ясным и нейтральным по конфессиональной окраске соответствием.
- source_word: περιεργείας
  choice: чрезмерной заботе о внешности
  rationale: В данном контексте слово указывает на излишние, искусные или суетливые старания, направленные на то, чтобы хорошо выглядеть; контекстуальная передача избегает неясного буквального «праздного любопытства».
- source_word: ὡραῖος ὀφθῇ
  choice: казаться привлекательным
  rationale: ὡραῖος означает красивый или привлекательный, а пассивный конъюнктив ὀφθῇ — «показаться, предстать»; сочетание естественно передано целевой конструкцией.
theological_decisions:
- issue: Значение «духа» в перечне
  choice: Сохранено буквальное «дух» без пояснения его природы.
  alternative: Передать как «склонность» или уточнить, что речь о злом духе.
  rationale: Греческий текст говорит πνεῦμα и не разрешает однозначно, является ли это персонифицированной силой, внутренней склонностью или духовным существом.
- issue: Связь μαγγανείας с внешней привлекательностью
  choice: Колдовство сохранено как отдельный элемент сложного порока.
  alternative: Ослабить до «ухищрений».
  rationale: Прямое лексическое значение связано с магией; замена на общие «ухищрения» могла бы устранить религиозно-нравственное напряжение оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном. Эллиптическая структура греческого перечня сохранена. «В печени и желчи» передано прямо, без модернизирующего физиологического объяснения.
