  text: 4. Τρίτον πνεῦμα²¹ μάχης ἐν τῷ ἥπατι καὶ ἐν²² τῇ χόλῃ. Τέταρτον²³ πνεῦμα ἀρεσκείας²⁴ καὶ μαγ- γανείας²⁵, ἵνα διὰ²⁶ περιεργείας²⁷ ὡραῖος²⁸ ὀφθῇ²⁹.
