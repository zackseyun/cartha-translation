  source_fidelity: 'В первом члене μάχης точнее передавать как «борьбы»/«ссоры», а не как устойчивую «вражду»: речь названа духом борьбы. В заключительной цели περιεργείας не означает прямо «заботу о внешности»; это контекстуально чрезмерные, суетливые или искусственные ухищрения. Сохранение результата «выглядеть привлекательным» передаёт ὡραῖος ὀφθῇ без добавления того, чего греческий текст не уточняет.'
  naturalness: Перечислительная, слегка эллиптическая конструкция естественна для современного литературного русского в наставительном тексте. «Благодаря чрезмерным ухищрениям» ясно связывает средство с целью и не делает необоснованного физиологического либо психологического пояснения.
  terminology: '«Дух», «колдовство», «печень» и «желчь» сохранены буквально. «Желание нравиться» нейтрально и понятно передаёт ἀρεσκείας; «колдовство» соответствует μαγγανείας. '
