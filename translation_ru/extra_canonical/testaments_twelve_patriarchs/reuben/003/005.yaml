  source_fidelity: 'Первая фраза передана точно: «дух гордости» и два следствия — хвастовство и надменное самомнение — соответствуют греческому тексту. Во второй фразе сохранено намеренно неразрешённое «в погибели и зависти». Однако «своего рода и домашних» по-русски звучит неестественно и может означать «своего типа» либо домашнюю прислугу, тогда как γένους καὶ οἰκείων обозначает родню и людей собственного дома. Кроме того, αὐτοῦ в издании также отмечено как текстуально проблемное и требует отдельной сноски.'
  naturalness: «Высоко о себе думал» — естественное современное выражение. «В погибели и зависти» намеренно буквально, но «гибели» несколько естественнее в данном нравственно-назидательном контексте. «От своих родных и домочадцев» ясно и литературно передаёт противопоставленные группы.
  terminology: «Гордость», «ложь», «хвалился» и «выдумывать речи» приемлемы. «Домочадцы» точнее «домашних» для οἰκείων; «родные» естественно передаёт γένος в этой конструкции. Сноски сохраняют, а не устраняют, текстологическую неопределённость.
