  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/005.yaml
  text: Fifth, a spirit of pride, so that one boasts and thinks grand thoughts. Sixth, a spirit of falsehood, in destruction and jealousy, to forge words and hide words from his own family and household.
translation:
  language: ru
  text: Пятый — дух гордости, чтобы человек хвалился и высоко о себе думал. Шестой — дух лжи, в гибели и зависти,[a] чтобы выдумывать речи и скрывать слова от своих родных и домочадцев.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «в гибели и зависти» передают не вполне ясное и текстуально сомнительное место греческого текста; возможны и другие понимания связи этих слов с предложением.
    reason: Выражение †ἐν ἀπωλείᾳ καὶ ζήλῳ† отмечено в источнике как проблемное; сноска сохраняет эту неопределённость.
  - marker: b
    text: Слово «своих» передаёт греческое «его»; это слово также отмечено в издании как текстуально сомнительное.
    reason: αὐτοῦ помечено знаком † в исходном тексте. Перевод сохраняет наиболее прямое чтение, не скрывая текстологическую проблему.
lexical_decisions:
- source_word: ὑπερηφανείας
  choice: гордости
  rationale: Прямое и естественное соответствие, сохраняющее нравственный смысл греческого слова.
- source_word: καυχᾶται
  choice: хвалился
  rationale: Передаёт значение хвастовства или самовосхваления без добавления конфессиональной окраски.
- source_word: μεγαλοφρονῇ
  choice: высоко о себе думал
  rationale: Естественно по-русски выражает надменное самомнение, подразумеваемое контекстом.
- source_word: ψεύδους
  choice: лжи
  rationale: Основное и контекстуально точное значение.
- source_word: πλάττειν λόγους
  choice: выдумывать речи
  rationale: πλάττειν означает формировать, сочинять или измышлять; в сочетании с духом лжи «выдумывать» передаёт обманный характер действия, а «речи» сохраняет λόγους без искусственного русского оборота.
- source_word: κρύπτειν λόγους
  choice: скрывать слова
  rationale: Формально сохраняет повтор λόγους и не уточняет сверх источника, идёт ли речь о собственных словах, сведениях или высказываниях других.
- source_word: γένους καὶ οἰκείων
  choice: своего рода и домашних
  rationale: Сохраняет различие между родом/роднёй и людьми собственного дома; «домашние» имеет уместный литературный регистр.
theological_decisions:
- issue: Субъект при καυχᾶται и μεγαλοφρονῇ
  choice: явно выражено «человек»
  alternative: «чтобы хвалиться и высоко думать»
  rationale: Русская конструкция требует ясного носителя действия; добавление «человек» лишь раскрывает подразумеваемый субъект и не вводит отдельного толкования.
- issue: Неясная связь ἐν ἀπωλείᾳ καὶ ζήλῳ
  choice: 'сохранена буквально и структурно: «в погибели и зависти»'
  alternative: истолковать как результат («к погибели») или мотив («из зависти»)
  rationale: Текстовое чтение помечено издателем как сомнительное; перевод не должен молча разрешать синтаксическую и смысловую неопределённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, но понятным библейско-назидательным звучанием. Сохранена перечислительная форма оригинала и его смысловая напряжённость; неясное место не подвергнуто конфессиональному или догматическому уточнению.
