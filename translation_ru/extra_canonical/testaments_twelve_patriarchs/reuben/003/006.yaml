base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/006.yaml
  text: Seventh, a spirit of injustice, with thefts and acts of greed, so that it may fill the pleasures of the heart. For injustice works together with the other spirits through buying and selling.
translation:
  language: ru
  text: Седьмой — дух несправедливости; с ним приходят кражи и корыстные захваты, чтобы наполнить удовольствия сердца. Ведь несправедливость содействует остальным духам через сделки.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «через давание и получение»; выражение может означать обмен, взаимные расчёты или торговые операции.'
    reason: Греческое δοσοληψία имеет более широкий смысл, чем только «купля и продажа», поэтому примечание сохраняет его лексическую неоднозначность.
lexical_decisions:
- source_word: ἀδικίας
  choice: несправедливости
  rationale: Передаёт широкое значение неправедности и нарушения справедливости, не сужая его до беззакония в строго юридическом смысле.
- source_word: γρηπίσματα
  choice: корыстные захваты
  rationale: Редкое и текстуально трудное слово по контексту обозначает проявления хищной алчности; перевод сохраняет отличие от непосредственно предшествующих «краж».
- source_word: φιληδονίαν καρδίας
  choice: насытить сердце удовольствиями
  rationale: Естественно передаёт идею сердечной тяги к наслаждениям и образ наполнения, присутствующий в глаголе ἐμπλήσει, без введения специальной аскетической терминологии.
- source_word: δοσοληψίας
  choice: через сделки
  rationale: Слово буквально связано с даванием и получением и может обозначать обмен или деловые операции; «сделки» сохраняет коммерческий оттенок, не ограничивая смысл только куплей-продажей.
theological_decisions:
- issue: Соотношение духа несправедливости с прочими духами
  choice: «несправедливость содействует остальным духам»
  alternative: «дух несправедливости действует вместе с остальными духами»
  rationale: Сохранена грамматическая формулировка источника, где подлежащим выступает ἀδικία, без отождествления абстрактной несправедливости и духа сильнее, чем это делает греческий текст.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной речи. Синтаксис сделан ясным для широкого читателя; сохранены перечисление пороков и причинно-следственная связь оригинала.
