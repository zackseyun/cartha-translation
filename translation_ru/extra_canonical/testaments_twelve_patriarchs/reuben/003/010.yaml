  text: Do not look at a woman's appearance, nor associate with a married woman, nor pry into the affairs of women.
translation:
  language: ru
  text: Не обращайте внимания на внешность женщины, не общайтесь с замужней женщиной и не допытывайтесь о делах женщин.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχετε ὄψει γυναικείᾳ
  choice: обращайте внимания на внешность женщины
  rationale: Глагол προσέχω с дательным падежом означает «обращать внимание, сосредоточиваться»; «внешность» естественно передаёт ὄψις, не добавляя отсутствующего в тексте понятия красоты.
- source_word: συνδιάζετε μετὰ θηλείας ὑπάνδρου
  choice: сближайтесь с замужней женщиной
  rationale: συνδιάζω обозначает совместное пребывание или близкое общение; «сближаться» сохраняет предостерегающий смысл контекста, не уточняя без основания характер отношений. ὕπανδρος прямо указывает на замужнюю женщину.
- source_word: περιεργάζεσθε πρᾶξιν γυναικῶν
  choice: допытывайтесь о делах женщин
  rationale: περιεργάζομαι передаёт неуместное любопытство и вмешательство; «допытываться» звучит естественно и сохраняет отрицательную оценку. πρᾶξις здесь передано широким словом «дела».
