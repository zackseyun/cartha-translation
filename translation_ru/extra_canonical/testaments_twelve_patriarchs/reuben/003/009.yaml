  text: And now, my children, love the truth, and it will guard you. Hear the words of Reuben, your father, as I teach you.
translation:
  language: ru
  text: И теперь, дети мои, любите истину, и она сохранит вас. Послушайте слова Рувима, вашего отца, которыми я наставляю вас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν ἀλήθειαν ἀγαπᾶτε
  choice: любите истину
  rationale: Прямо и естественно передаёт греческое повеление, сохраняя олицетворение истины в следующей части фразы.
- source_word: φυλάξει ὑμᾶς
  choice: она сохранит вас
  rationale: «Сохранит» передаёт защитно-охранительное значение φυλάσσω и звучит естественно в современном литературном русском.
- source_word: Ἀκούσατε λόγους Ῥουβὴμ
  choice: Послушайте слова Рувима
  rationale: Сохраняет повелительную форму и самоназвание говорящего в третьем лице.
- source_word: διδάσκω ... ὑμᾶς
  choice: которыми я наставляю вас
  rationale: Передаёт значение обучения и нравственного наставления; связь «которыми» естественно соединяет оборот с «словами» при неровном порядке слов греческого текста.
