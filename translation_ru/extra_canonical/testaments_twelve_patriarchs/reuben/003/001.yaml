- from: Кроме всех этих есть и восьмой дух — дух сна, вместе с которым были сотворены исступление естества и образ смерти.
  to: Помимо всего этого есть и восьмой дух — дух сна, с которым были сотворены экстаз природы и образ смерти.
  rationale: 'Исправлены две безопасные точки: вводный оборот приведён к естественной современной русской форме, а ἔκστασις передано как «экстаз», что лучше сохраняет его многозначность. Родительный φύσεως, пассивное сотворение и образный характер «образа смерти» оставлены без толковательной конкретизации.'
