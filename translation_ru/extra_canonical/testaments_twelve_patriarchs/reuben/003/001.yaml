base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/001.yaml
  text: And besides all these, there is an eighth spirit, the spirit of sleep, with which trance and the image of death were created.
translation:
  language: ru
  text: Помимо всего этого есть и восьмой дух — дух сна, с которым были сотворены экстаз природы и образ смерти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπὶ πᾶσιν δὲ τούτοις
  choice: Кроме всех этих
  rationale: 'Передаёт добавочное значение оборота: помимо уже перечисленных духов существует ещё один.'
- source_word: ὄγδοον πνεῦμα τοῦ ὕπνου
  choice: восьмой дух — дух сна
  rationale: Сохраняет счёт, повтор слова «дух» и пояснительное отношение родительного оборота.
- source_word: ἔκστασις φύσεως
  choice: исступление естества
  rationale: 'Формально сохраняет неоднозначное сочетание: ἔκστασις может обозначать выход из обычного состояния или оцепенение, а φύσις — естество/природу. Архаизирующее, но понятное «естество» уместно в данном религиозно-философском контексте и не устраняет связь родительного падежа.'
- source_word: εἰκὼν τοῦ θανάτου
  choice: образ смерти
  rationale: Прямой и естественный эквивалент, сохраняющий метафорическое уподобление сна смерти.
- source_word: μεθ’ οὗ ἐκτίσθη
  choice: вместе с которым были сотворены
  rationale: Сохраняет совместность μετὰ и пассивное значение глагола κτίζω, не уточняя неназванного деятеля.
theological_decisions:
- issue: Онтологический смысл «духа сна»
  choice: Сохранено буквальное «дух сна» без пояснения его природы
  alternative: Передать как «сила сна» или «дух, вызывающий сон»
  rationale: Текст прямо говорит πνεῦμα и не определяет, является ли это личным существом, свойством человеческой природы или иной силой.
- issue: Связь сна, исступления естества и смерти
  choice: Сохранено утверждение об их совместном сотворении
  alternative: Истолковать сон как состояние, подобное трансу и смерти
  rationale: Греческий текст употребляет ἐκτίσθη и допускает космологическое высказывание; перевод не должен заменять его объясняющей парафразой.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Синтаксис остаётся ясным, а спорное выражение ἔκστασις φύσεως передано достаточно формально, чтобы не снять его смысловую неоднозначность.
