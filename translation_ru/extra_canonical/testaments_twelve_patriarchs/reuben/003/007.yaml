  text: And over all these, the spirit of sleep is joined, which is error and the eighth of fantasy.
translation:
  language: ru
  text: 7 Ко всем этим присоединяется дух сна, который есть заблуждение и восьмой [дух] воображения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст этой части фразы синтаксически не вполне ясен. Слово «дух» после «восьмой» восполнено по контексту; порядок и связь слов «заблуждение» и «воображения» в подлиннике остаются неясными.
    reason: Сноска объясняет контекстуальное восполнение и сохраняет неопределённость греческого текста, не навязывая реконструкцию.
lexical_decisions:
- source_word: Ἐπὶ πᾶσι δὲ τούτοις
  choice: Ко всему этому
  rationale: Передаёт присоединение к уже перечисленным духам; δέ естественно выражено ходом фразы без отдельного «но».
- source_word: τὸ πνεῦμα τοῦ ὕπνου
  choice: дух сна
  rationale: Сохраняет ключевую лексику и связь с перечнем духов в контексте.
- source_word: συνάπτεται
  choice: присоединяется
  rationale: Точно передаёт значение соединения или присовокупления и сохраняет страдательно-возвратный оттенок греческой формы.
- source_word: πλάνης
  choice: заблуждение
  rationale: Существительное πλάνη здесь обозначает ошибку, обман или заблуждение; выбран нейтральный и понятный русский эквивалент.
- source_word: φαντασίας
  choice: воображения
  rationale: Сохраняет широкое значение φαντασία — образное представление или воображение — без сужения до «иллюзии» или «видения».
theological_decisions:
- issue: Неясная связь слов πλάνης καὶ ὄγδοον φαντασίας
  choice: который есть заблуждение и восьмой [дух] воображения
  alternative: который является восьмым духом заблуждения и воображения
  rationale: Греческий текст в данной форме синтаксически труден и не позволяет уверенно объединить «заблуждение» и «воображение» как два определения одного «восьмого духа». Основной текст сохраняет порядок и напряжение источника, а восстановленное для русского синтаксиса слово отмечено квадратными скобками.
translation_notes:
  register: Современный литературный русский язык с достоинством межзаветного наставительного текста. Сохранена необычная формулировка источника; неизбежное восполнение отмечено квадратными скобками и пояснено в сноске.
