  source_fidelity: Основной перевод верно передаёт ἐπὶ πᾶσι ... τούτοις, τὸ πνεῦμα τοῦ ὕπνου и συνάπτεται. Однако греческий финал πλάνης καὶ ὄγδοον φαντασίας синтаксически труден; предлагаемая в сноске альтернатива «восьмым духом заблуждения и воображения» сглаживает эту трудность и перераспределяет определения без достаточного основания. В основном тексте восполнение «дух» допустимо только как контекстуально обозначенное восполнение.
  naturalness: «Ко всему этому» несколько менее точно по числу, чем «Ко всем этим», поскольку τούτοις относится к нескольким ранее названным духам. Сама намеренно шероховатая концовка оправданна как отражение неясного греческого текста; квадратные скобки и сноска делают её понятной читателю.
  terminology: '«Дух сна», «заблуждение» и «воображение» — приемлемые нейтральные соответствия. Не следует в сноске превращать «заблуждение» и «воображение» в два равноправных определения одного реконструированного «восьмого духа»: это лишь одна из возможных, но не подтверждённая данным текстом реконструкция.'
