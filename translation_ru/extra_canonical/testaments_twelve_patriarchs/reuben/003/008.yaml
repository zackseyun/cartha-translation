source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 8. Καὶ οὕτως ἀπόλλυται πᾶς νεώτερος⁵⁴, πνεῦμα. σκοτίζων⁵⁵ τὸν νοῦν ⌜αὐτοῦ⌝⁵⁶ ἀπὸ τῆς ἀληθείας, καὶ μὴ α, αe, *συνιὼν ἐν⁵⁷ τῷ νόμῳ τοῦ θεοῦ⁵⁸, μήτε⁵⁹ ἀκούων⁶⁰ νουθεσίας⁶¹ πλάνη καὶ φαν- πατέρων αὐτοῦ⁶² ὡς⁶³ κἀγὼ ἔπαθον⁶⁴ ἐν τῷ νεωτερισμῷ τασία. μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/008.yaml
  text: And so every young man is destroyed, darkening his mind from the truth and not understanding the law of God, nor listening to the instruction of his fathers, just as I also suffered in my youth.
translation:
  language: ru
  text: Так погибает всякий юноша, помрачая свой разум, отчуждая его от истины, не понимая закона Божьего и не внимая наставлениям отцов своих, — как и я пострадал в юности.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόλλυται
  choice: погибает
  rationale: Передаёт сильное значение гибели и нравственного падения, не ослабляя его до «сбивается с пути».
- source_word: πᾶς νεώτερος
  choice: всякий юноша
  rationale: Сохраняет обобщённое высказывание о молодом человеке мужского пола и соответствует контексту обращения Рувима.
- source_word: σκοτίζων τὸν νοῦν αὐτοῦ ἀπὸ τῆς ἀληθείας
  choice: омрачает свой разум, удаляясь от истины
  rationale: Естественно передаёт образ помрачения ума и конструкцию ἀπό, указывающую на отдаление от истины, без искусственного русского оборота.
- source_word: συνιὼν ἐν τῷ νόμῳ τοῦ θεοῦ
  choice: постигает закона Божьего
  rationale: Глагол συνίημι означает понимать, постигать; русская формулировка сохраняет познавательный смысл и звучит естественно.
- source_word: νουθεσίας πατέρων αὐτοῦ
  choice: наставлений своих отцов
  rationale: Νουθεσία — вразумляющее наставление; πατέρες оставлено как «отцы», без сужения до биологических родителей или расширения до предков.
- source_word: ἔπαθον ἐν τῷ νεωτερισμῷ μου
  choice: я пострадал в юности
  rationale: Ἔπαθον сохраняет смысл пережитого страдания или пагубных последствий, а νεωτερισμός в данном контексте естественно передаётся как период юности.
theological_decisions:
- issue: Характер «закона Божьего»
  choice: Сохранено прямое выражение «закон Божий» без конфессионального уточнения.
  alternative: Уточнить как Моисеев закон или как общее Божье установление.
  rationale: Греческий текст не вводит такого уточнения, поэтому перевод сохраняет исходную широту значения.
- issue: Причинность между гибелью и последующими причастными оборотами
  choice: Действия юноши представлены как описание пути его гибели.
  alternative: 'Передать их как строго формальную причину: «потому что он…».'
  rationale: Греческое причастие допускает обстоятельственный оттенок, но не требует однозначно причинной связки; двоеточие сохраняет эту смысловую открытость.
translation_notes:
  register: Современный литературный русский язык с достоинством нравственного завещания. Синтаксис упрощён ради ясности, но последовательность образов и богословская напряжённость оригинала сохранены.
