  source_fidelity: Требуется небольшая правка. «Человеческой» отсутствует в греческом τῇ φύσει и без необходимости сужает/эксплицирует формулировку. «Заложен» может подразумевать намеренное вложение; ἔγκειται нейтральнее говорит о нахождении или присущности. αἰσθήσεις — прежде всего чувственные восприятия/ощущения, тогда как русское «чувства» также обычно означает эмоции.
  naturalness: Исправленный текст сохраняет краткий, нравоучительный регистр и эллипсис второго пункта. «Кроется в природе и в ощущениях» естественно по-русски и не приписывает духу намеренного происхождения.
  terminology: «Дух блуда» уместно передаёт πνεῦμα πορνείας в данном древнем нравоучительном контексте. «Чрево» сохраняет образ γαστήρ; «ненасытность» точно передаёт ἀπληστία и не ограничивает значение одной лишь жадностью.
  issues:
