    rationale: В современном русском это нередко эмоции; «ощущения» яснее передаёт αἰσθήσεις как сферу чувственного восприятия.
  revised_text: Во-первых, дух блуда кроется в природе и в ощущениях. Во-вторых — дух ненасытности чрева.
