  text: 3. Πρῶτον¹² *τὸ τῆς πορνείας πνεῦμα¹³ ἐν τῇ φύσει¹⁴ καὶ¹⁵ *ταῖς αἰσθήσεσιν¹⁶ ἔγκειται¹⁷. *Δεύτερον πνεῦμα¹⁸ ἀπλη- στείας¹⁹ γαστρός²⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/003.yaml
  text: First, the spirit of sexual immorality is lodged in the nature and in the senses. Second, a spirit of greediness of the belly.
translation:
  language: ru
  text: Во-первых, дух блуда кроется в природе и в ощущениях. Во-вторых — дух ненасытности чрева.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνείας
  choice: блуда
  rationale: Передаёт сексуальную безнравственность кратким и уместным для древнего нравоучительного текста словом, сохраняющим достоинство стиля.
- source_word: ἐν τῇ φύσει
  choice: в человеческой природе
  rationale: Слово «человеческой» делает подразумеваемый смысл φύσις ясным по-русски, не меняя референта.
- source_word: ταῖς αἰσθήσεσιν
  choice: чувствах
  rationale: 'Сохраняет широту αἴσθησις: чувственное восприятие и ощущения; более естественно, чем техническое «органах чувств».'
- source_word: ἔγκειται
  choice: заложен
  rationale: Передаёт значение пребывания или укоренённости внутри природы и чувств без излишнего усиления.
- source_word: ἀπληστείας γαστρός
  choice: ненасытности чрева
  rationale: ἀπληστία обозначает ненасытность или алчность, а γαστήρ — чрево; сочетание сохраняет телесный образ и подразумеваемое обжорство.
theological_decisions:
- issue: Связь духа блуда с природой человека
  choice: «заложен в человеческой природе и чувствах»
  alternative: «присущ человеческой природе и чувствам»
  rationale: Формулировка следует ἔγκειται и не утверждает ни происхождение этого духа от Бога, ни тождество греха самой сотворённой природе; напряжение исходного высказывания сохранено.
- issue: Понимание «духа»
  choice: сохранено буквальное «дух»
  alternative: «склонность» или «порок»
  rationale: В контексте перечня πνεῦμα может иметь личностный либо диспозиционный оттенок; перевод не снимает эту неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно библейской окраской. Эллиптическая форма второго предложения сохранена, как в греческом тексте; «чрево» выбрано ради достоинства и телесной образности оригинала.
