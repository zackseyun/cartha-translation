    rationale: В τῇ φύσει нет слова «человеческой». Хотя подразумеваемый референт может быть человеческим, перевод не должен вносить это уточнение как часть текста.
  - severity: medium
    issue: «Заложен» излишне окрашивает ἔγκειται.
    rationale: Русское слово может наводить на мысль о намеренном вложении. Греческое слово здесь обозначает нахождение/присущность; нейтральное «кроется» лучше сохраняет смысл и богословскую неопределённость.
  - severity: low
