base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/008.yaml
  text: For you have heard about Joseph, how he guarded himself from a woman and cleansed his thoughts from all sexual immorality, and found favor before God and men.
translation:
  language: ru
  text: 'Ведь вы слышали об Иосифе: как он сохранил себя от женщины, очистил свои помыслы от всякой половой безнравственности и обрёл благоволение перед Богом и людьми.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφύλαξεν ἑαυτόν ἀπὸ γυναικός
  choice: оберегал себя от женщины
  rationale: Передаёт буквальный образ самосохранения и дистанцирования от женщины без добавления отсутствующего в греческом уточнения.
- source_word: τὰς ἐννοίας
  choice: свои помыслы
  rationale: «Помыслы» естественно и точно обозначают внутренние мысли и намерения в нравственном контексте.
- source_word: ἀπὸ πάσης πορνείας
  choice: от всякого разврата
  rationale: «Разврат» в данном контексте передаёт широкое значение πορνεία как половой безнравственности; «всякого» непосредственно отражает πάσης.
- source_word: εὗρεν χάριν
  choice: обрёл благоволение
  rationale: Устойчиво передаёт семитизированный греческий оборот «найти милость/благоволение», сохраняя возвышенный, но понятный регистр.
- source_word: ἐνώπιον θεοῦ καὶ ἀνθρώπων
  choice: перед Богом и людьми
  rationale: 'Формально и естественно сохраняет двойную соотнесённость: с Богом и людьми.'
theological_decisions:
- issue: Связь внутренней чистоты и обретения благоволения
  choice: Сохранено простое повествовательное соединение через «и»
  alternative: 'Передать как причинную связь: «поэтому обрёл благоволение»'
  rationale: Греческий текст не выражает причинность явно; перевод не должен превращать последовательность в сформулированное учение о заслуге.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Синтаксис сохранён компактным; двоеточие после имени естественно вводит пояснение к тому, что слушатели слышали об Иосифе.
