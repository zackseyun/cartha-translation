source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Βόθρος γάρ ἐστι ψυχῆς ἡ ἁμαρτία τῆς πορνείας⁵², χωρίζουσα ἀπὸ⁵³ θεοῦ καὶ προσεγγίζουσα *τοῖς εἰδώλοις⁵⁴, ὅτι αὕτη *ἐστὶν ἡ⁵⁵ πλανῶσα τὸν νοῦν *καὶ τὴν διάνοιαν⁵⁶, καὶ κατάγει⁵⁷ νεανί- σκους εἰς ᾅδην, οὐκ ἐν καιρῷ αὐτῶν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/006.yaml
  text: For the sin of sexual immorality is a pit for the soul, separating it from God and drawing it near to idols; for it is this that leads the mind and understanding astray, and brings young men down to Hades before their time.
translation:
  language: ru
  text: 'Ибо грех блуда — яма для души: он отделяет её от Бога и приближает к идолам, ведь именно он вводит в заблуждение ум и рассудок и низводит юношей в Аид[a] прежде их срока.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Аид — мир мёртвых; здесь не обязательно имеется в виду место окончательного наказания.
    reason: Предотвращает автоматическое отождествление греческого ᾅδης с позднейшим узким значением слова «ад».
lexical_decisions:
- source_word: ἡ ἁμαρτία τῆς πορνείας
  choice: грех блуда
  rationale: «Блуд» сохраняет нравственно-религиозный смысл πορνεία и обозначает недозволенные половые отношения без искусственного сужения значения.
- source_word: βόθρος ... ψυχῆς
  choice: яма для души
  rationale: Передаёт конкретный и опасный образ βόθρος; дательный оборот по-русски естественно выражает, что эта яма губительна для души.
- source_word: χωρίζουσα ἀπὸ θεοῦ καὶ προσεγγίζουσα τοῖς εἰδώλοις
  choice: он отделяет её от Бога и приближает к идолам
  rationale: Сохраняется параллельное противопоставление удаления от Бога и приближения к идолам; местоимение «её» явно отсылает к душе.
- source_word: τὸν νοῦν καὶ τὴν διάνοιαν
  choice: ум и рассудок
  rationale: Два близких русских слова сохраняют проведённое в греческом различие между способностью мыслить и рассудительным пониманием.
- source_word: κατάγει ... εἰς ᾅδην
  choice: низводит ... в Аид
  rationale: «Низводит» передаёт направленное вниз действие κατάγει, а «Аид» сохраняет образ подземного мира мёртвых.
- source_word: οὐκ ἐν καιρῷ αὐτῶν
  choice: прежде их срока
  rationale: Естественно выражает смысл преждевременной смерти, буквально наступающей «не в их время».
theological_decisions:
- issue: Значение ᾅδης
  choice: Аид — мир мёртвых
  alternative: ад как место окончательного наказания
  rationale: Греческое ᾅδης само по себе обозначает подземный мир или область мёртвых и не требует отождествления с окончательным местом наказания.
- issue: К чему относятся причастия женского рода χωρίζουσα и προσεγγίζουσα
  choice: к ἁμαρτία, то есть греху блуда
  alternative: к душе
  rationale: Грамматически причастия согласуются с существительным ἁμαρτία; душа выступает подразумеваемым объектом их действия.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Образность оригинала сохранена; синтаксис слегка уплотнён для ясного и естественного чтения.
