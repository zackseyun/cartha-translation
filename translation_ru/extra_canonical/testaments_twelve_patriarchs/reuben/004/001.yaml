  text: Μὴ οὖν προσέχετε, Γτέκνα μου1, κάλλος2 γυναικῶν3, μηδὲ ἐννοεῖσθε4 τὰς πράξεις αὐτῶν· ἀλλὰ πορεύεσθε ἐν5 ἁπλότητι καρδίας, ἐν φόβῳ κυρίου6, καὶ μοχθοῦντες7 ἐν ἔργοις *καλοῖς, καὶ8 *ἐν γράμμασι, καὶ ἐν τοῖς ποιμνίοις9 ὑμῶν, ἕως οὗ10 *ὁ κύριος δώῃ ὑμῖν11 *σύζυγον, ἣν αὐτὸς θέλει12, ἵνα μὴ πάθητε13, ὡς κἀγώ14.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/001.yaml
  text: Therefore, my children, do not pay attention to the beauty of women, nor dwell on their deeds; but walk in simplicity of heart, in the fear of the Lord, laboring in good works, and in learning, and in your flocks, until the Lord gives you a wife whom he himself chooses, so that you may not suffer as I did.
translation:
  language: ru
  text: Итак, дети мои, не обращайте внимания на красоту женщин и не размышляйте об их поступках; но ходите в простоте сердца, в страхе Господнем, трудясь в добрых делах, в учении и со своими стадами, пока Господь не даст вам жену, какую Он Сам пожелает, чтобы вы не пострадали, как и я.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχετε
  choice: засматривайтесь
  rationale: В сочетании с κάλλος обозначает направленное, увлечённое внимание к женской красоте; русское выражение естественно передаёт предостережение, не сводя его к нейтральному «обращать внимание».
- source_word: ἐννοεῖσθε
  choice: помышляйте
  rationale: Передаёт внутреннее сосредоточение мыслей на чьих-либо поступках и сохраняет более возвышенный нравоучительный регистр.
- source_word: ἁπλότητι καρδίας
  choice: простоте сердца
  rationale: Формально близкое и понятное библейское выражение, допускающее смысл искренности, цельности и отсутствия лукавства.
- source_word: ἐν γράμμασι
  choice: в учении
  rationale: γράμματα может относиться к письменности, занятиям и образованию; «в учении» естественно в данном перечне занятий и не ограничивает значение только письмом.
- source_word: σύζυγον
  choice: жену
  rationale: В контексте обращения к сыновьям слово означает супругу; «жену» является ясным современным эквивалентом.
- source_word: ἣν αὐτὸς θέλει
  choice: которую Он Сам пожелает
  rationale: Сохраняет буквальное значение θέλει и местоименное усиление αὐτός, не превращая желание Господа в более определённую формулу «изберёт».
theological_decisions:
- issue: Субъект выбора будущей жены
  choice: «которую Он Сам пожелает» — субъектом оставлен Господь
  alternative: «жену по своему желанию» или «жену, которую ты пожелаешь»
  rationale: Грамматически αὐτός относится к κύριος; перевод сохраняет утверждение о Божьем волеизъявлении и не переносит выбор на адресата.
- issue: Значение «простоты сердца»
  choice: Сохранена исходная метафора без истолковывающего расширения
  alternative: «с искренним сердцем» или «в чистосердечии»
  rationale: Так сохраняется смысловая широта ἁπλότης и возможные оттенки искренности, цельности и нелукавства.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским, нравоучительным звучанием. Синтаксическая последовательность оригинала в основном сохранена, но сочетание «трудясь… и в стадах» естественно развёрнуто как «трудясь… и заботясь о своих стадах».
