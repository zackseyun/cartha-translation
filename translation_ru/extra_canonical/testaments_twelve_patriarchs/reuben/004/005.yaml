  text: Διὰ τοῦτο⁴⁵ *τέκνα μου⁴⁶, *Γλέγω ὑμῖν⁴⁷, φυλάξατε⁴⁸ Γπάντα⁴⁹ ὅσα ἐντέλλομαι⁵⁰ ὑμῖν, καὶ οὐ μὴ ἁμάρτητε⁵¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/005.yaml
  text: Therefore, my children, I tell you, keep all that I command you, and you will certainly not sin.
translation:
  language: ru
  text: 'Поэтому, дети мои, говорю вам: соблюдайте всё, что я заповедую вам, и вы ни в коем случае не согрешите.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь с предшествующим контекстом.
- source_word: τέκνα μου
  choice: дети мои
  rationale: Прямое и естественное обращение, сохраняющее семейный тон наставления.
- source_word: φυλάξατε
  choice: соблюдайте
  rationale: В контексте заповедей означает хранить и исполнять предписанное; «соблюдайте» естественно передаёт оба оттенка.
- source_word: πάντα ὅσα
  choice: всё, что
  rationale: Точно воспроизводит всеохватность греческого оборота без стилистической тяжеловесности.
- source_word: ἐντέλλομαι
  choice: заповедую
  rationale: Сохраняет властный и наставительный характер глагола, не ослабляя его до простого совета.
- source_word: οὐ μὴ ἁμάρτητε
  choice: вы ни в коем случае не согрешите
  rationale: Усиленное греческое отрицание οὐ μή передано категорическим русским оборотом; аорист сослагательного наклонения в этой конструкции выражает решительное отрицание будущего действия.
theological_decisions:
- issue: Категоричность обещания не согрешить
  choice: «вы ни в коем случае не согрешите»
  alternative: «вы не будете грешить»
  rationale: Выбранный вариант сохраняет силу οὐ μή и не превращает высказывание в более общее утверждение о привычном образе жизни. Возможное напряжение между повелением и категорическим следствием оставлено без догматического пояснения.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Двоеточие после «говорю вам» естественно вводит содержание речи; повтор «вам» сохранён вслед за греческим текстом.
