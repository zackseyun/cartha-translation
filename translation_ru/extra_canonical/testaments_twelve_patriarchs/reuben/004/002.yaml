  text: For until my father's death I did not have the boldness to look my father in the face.
translation:
  language: ru
  text: Ведь до самой смерти моего отца я не осмеливался взглянуть ему в лицо.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄχρι τελευτῆς τοῦ πατρός μου
  choice: до самой смерти моего отца
  rationale: Передаёт временной предел; «самой» естественно подчёркивает продолжительность состояния вплоть до смерти отца.
- source_word: οὐκ εἶχον παρρησίαν
  choice: я не осмеливался
  rationale: В данном контексте выражение означает отсутствие внутренней смелости или свободы открыто действовать; глагольная передача звучит по-русски естественнее буквального «не имел смелости».
- source_word: ἀτενίσαι εἰς
  choice: взглянуть … в лицо
  rationale: ἀτενίζω обозначает направленный, прямой взгляд. Контекст стыда перед отцом поддерживает естественное русское выражение «взглянуть ему в лицо» без избыточного усиления «пристально».
theological_decisions:
- issue: Причина, по которой Рувим не мог смотреть отцу в лицо
  choice: Не добавлять причину в основной текст
  alternative: Добавить «из-за позора/совершённого мною»
  rationale: В предоставленном тексте данного стиха причина прямо не выражена; её добавление превратило бы контекстуальный вывод в часть перевода.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, повествовательная и исполненная стыда, без архаизмов. Повреждённые и аппаратные фрагменты после εἰς не включены, поскольку проверочный английский слой подтверждает завершение мысли выражением «в лицо».
