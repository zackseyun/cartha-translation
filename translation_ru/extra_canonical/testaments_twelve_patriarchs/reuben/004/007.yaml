base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/007.yaml
  text: For sexual immorality has destroyed many; for whether a man is old, or noble, or rich, or poor, he brings reproach on himself before the sons of men and a stumbling block to Beliar.
translation:
  language: ru
  text: Ибо блуд погубил многих; ведь стар ли человек, знатен ли, богат ли или беден, он навлекает на себя позор перед сынами человеческими и приносит Велиару камень преткновения.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «и [несёт/приносит] Велиару камень преткновения». Греческое выражение необычно: один глагол «несёт/приносит» относится и к «позору», и к «камню преткновения», а дательный «Велиару» не уточняет характера этой связи.'
    reason: Сохраняет необычный синтаксис φέρει … πρόσκομμα τῷ Βελίαρ, не заменяя его богословским или смысловым истолкованием.
lexical_decisions:
- source_word: πορνεία
  choice: блуд
  rationale: Передаёт половую безнравственность ёмким, понятным словом библейского регистра, не сужая значение до одного конкретного проступка.
- source_word: ἀπώλεσεν
  choice: погубил
  rationale: Сохраняет сильный смысл уничтожения или гибели, а также совершенный вид греческого аориста.
- source_word: εὐγενής
  choice: знатный
  rationale: В данном перечне общественных положений естественно обозначает человека благородного происхождения или высокого рода.
- source_word: ὀνειδισμός
  choice: позор
  rationale: Естественно передаёт публичное бесчестье и поношение в современном русском языке.
- source_word: οἱ υἱοὶ τῶν ἀνθρώπων
  choice: сыны человеческие
  rationale: Сохраняет характерный семитизированный оборот греческого текста и его возвышенный библейский регистр.
- source_word: πρόσκομμα
  choice: камень преткновения
  rationale: Сохраняет образ препятствия, вызывающего падение, и не устраняет необычность выражения в отношении Велиара.
- source_word: Βελίαρ
  choice: Велиар
  rationale: Передаёт греческую форму имени Βελίαρ, не подменяя её более привычным вариантом «Велиал».
theological_decisions:
- issue: Отношение выражения «камень преткновения» к Велиару
  choice: становится камнем преткновения для Велиара
  alternative: приносит Велиару камень преткновения
  rationale: Греческий дательный τῷ Βελίαρ допускает буквальную связь «для/Велиару», но смысл необычен. Перевод сохраняет эту богословскую напряжённость и не истолковывает Велиара как источник преткновения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Двоеточие естественно передаёт пояснительную связь второго γάρ с первым утверждением; повтор κἂν воспроизведён конструкцией «будь… или…». Необычный образ в последней части сохранён, а не сглажен толкованием.
