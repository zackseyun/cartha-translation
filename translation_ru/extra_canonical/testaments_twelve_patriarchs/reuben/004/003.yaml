lexical_decisions:
- source_word: ἕως νῦν
  choice: доныне
  rationale: Кратко и точно передаёт продолжающееся вплоть до настоящего времени действие; соответствует достоинству литературного регистра.
- source_word: ἡ συνείδησίς μου
  choice: совесть
  rationale: Прямой и естественный русский эквивалент понятия внутреннего нравственного сознания.
- source_word: τύπτει με
  choice: бичует меня
  rationale: Сохраняет сильный образ удара в τύπτει и при этом звучит по-русски естественнее, чем буквальное «бьёт меня»; не ослабляет выражение до одного лишь «укоряет».
- source_word: περὶ τῆς ἁμαρτίας μου
  choice: за мой грех
  rationale: В данном контексте естественно выражает причину угрызений совести и сохраняет единственное число исходного текста.
