source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Καὶ γὰρ⁶⁷ πολλὰ ἐποίησεν αὐτῷ ἡ Αἰγυπτία, καὶ μάγους προσεκάλεσεν⁶⁸ καὶ *φάρμακα αὐτῷ προσήνεγκε⁶⁹, ἐπειδὴ γὰρ ἐφύλαξεν ἑαυτὸν Ἰωσὴφ ἀπὸ πάσης. β, Α, S¹ κυρίου. καὶ⁷⁰ οὐκ ἐδέξατο⁷¹ τὸ διαβούλιον τῆς ψυχῆς αὐτοῦ⁷² ἐπιθυμίαν πονηράν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/009.yaml
  text: For the Egyptian woman did many things to him, and called in magicians and brought him potions; for Joseph guarded himself from every evil desire and did not accept the counsel of his soul for wicked desire.
translation:
  language: ru
  text: 'Ибо египтянка многое делала ему: призывала чародеев и приносила ему зелья. Ибо Иосиф сохранил себя от всякого злого желания[a] и не принял совета своей души, склонявшего его к порочному желанию.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст в этом месте сохранился в нарушенном виде; слова «злого желания» передают смысл фразы с учётом её продолжения.
    reason: После ἀπὸ πάσης текст повреждён или неполон; дополнение «злого желания» является контекстуальным восстановлением смысла, а не бесспорным непрерывным чтением.
lexical_decisions:
- source_word: ἡ Αἰγυπτία
  choice: египтянка
  rationale: Естественное современное обозначение египетской женщины; определённость передаётся контекстом.
- source_word: πολλὰ ἐποίησεν αὐτῷ
  choice: многое делала с ним
  rationale: Сохраняет широкое значение дательного αὐτῷ и не уточняет без достаточных оснований, были ли её действия направлены «против» Иосифа или совершались «по отношению к» нему.
- source_word: μάγους
  choice: чародеев
  rationale: Передаёт людей, прибегающих к магическим практикам, в dignified и понятной современной форме.
- source_word: φάρμακα
  choice: зелья
  rationale: В сочетании с чародеями слово указывает на магические или воздействующие снадобья; «зелья» сохраняет эту смысловую широту лучше, чем узкие «лекарства» или «яды».
- source_word: ἐφύλαξεν ἑαυτόν
  choice: оберегал себя
  rationale: Передаёт сознательное хранение себя от нравственного падения.
- source_word: τὸ διαβούλιον τῆς ψυχῆς αὐτοῦ
  choice: внушения собственной души
  rationale: Сохраняет внутренний характер совета или побуждения, не превращая ψυχή в отдельную от человека сущность.
- source_word: ἐπιθυμίαν πονηράν
  choice: порочной страсти
  rationale: В данном контексте сочетание обозначает нравственно дурное, сильное влечение; «страсть» естественнее в заключительной фразе, тогда как ранее употреблено более широкое «желание».
theological_decisions:
- issue: Связь внутреннего совета души со злым желанием
  choice: «внушения собственной души, побуждавшей его к порочной страсти»
  alternative: «совета своей души — злого желания»
  rationale: Греческий синтаксис с τὸ διαβούλιον … ἐπιθυμίαν πονηράν труден и допускает более чем одно понимание. Выбранный вариант делает русский текст читаемым, сохраняя мысль о внутреннем побуждении, но не вводит учение о самостоятельной природе души.
- issue: Логическая связь частей стиха
  choice: «Ведь … Но Иосиф…»
  alternative: повторное причинное «ведь … ведь Иосиф…»
  rationale: Начальное γάρ объясняет предшествующий контекст, а контраст между попытками египтянки и стойкостью Иосифа естественно выражается по-русски союзом «но». Это не меняет событийной связи и избегает тяжёлого буквального повторения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Избегаются архаизмы и конфессионально нагруженные формулы; синтаксис слегка сглажен ради ясности, а текстовая трудность отмечена сноской.
