id: T12P.REU.4.10
reference: Testament of Reuben 4:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Διὰ τοῦτο⁷³ ὁ θεὸς τῶν πατέρων ὑμῶν⁷⁴ ἐρρύσατο αὐτὸν ἀπὸ παντὸς πονηροῦ⁷⁵ κεκρυμμένου θανάτου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/010.yaml
  text: Therefore the God of your fathers delivered him from every hidden evil death.
translation:
  language: ru
  text: Поэтому Бог ваших отцов избавил его от всякой злой, сокрытой смерти[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «от всякой злой, скрытой смерти». Определения «злой» и «сокрытой» относятся к слову «смерть»; текст не говорит отдельно «от всякого скрытого зла и от смерти».'
    reason: Фраза необычна и в греческом; примечание сохраняет её структуру и предотвращает ошибочное разделение на два объекта избавления.
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт причинно-следственный переход без добавления новых смысловых оттенков.
- source_word: ὁ θεὸς τῶν πατέρων ὑμῶν
  choice: Бог ваших отцов
  rationale: Прямо сохраняет родительный оборот и обращение во втором лице множественного числа.
- source_word: ἐρρύσατο
  choice: избавил
  rationale: Естественно передаёт совершившееся спасение или избавление от угрозы.
- source_word: ἀπὸ παντὸς πονηροῦ κεκρυμμένου θανάτου
  choice: от всякой злой, сокрытой смерти
  rationale: Оба определения — πονηροῦ и κεκρυμμένου — согласованы с θανάτου; перевод не разделяет единое словосочетание на «зло» и «смерть».
theological_decisions:
- issue: Характер Божьего избавления
  choice: Сохранено простое утверждение «избавил его»
  alternative: Уточнить способ избавления или придать фразе доктринальный смысл
  rationale: Греческий текст утверждает факт избавления, но не объясняет его способ и не требует конфессионального истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Необычный образ «сокрытой смерти» сохранён, поскольку он присутствует в греческом источнике; синтаксис при этом сделан понятным для современного читателя.
