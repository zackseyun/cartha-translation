base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/003.yaml
  text: For an angel of God also told me and taught me concerning them that women are overcome by the spirit of sexual immorality more than men, and in their hearts they devise things against men; and by adornment they lead their minds astray, and through a glance they sow the poison, and first in thought and then by the act they take captive.
translation:
  language: ru
  text: Ведь и о них ангел Божий сказал мне и научил меня, что женщины более мужчин поддаются духу блуда и в сердцах замышляют против мужчин; украшениями они вводят их умы в заблуждение, а взглядом сеют яд; сперва — в помысле, а затем и самим делом — берут их в плен.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡττῶνται
  choice: поддаются
  rationale: Передаёт значение «оказываются слабее, бывают побеждены» естественным русским выражением, не устраняя образ подчинения воздействию.
- source_word: τῷ πνεύματι τῆς πορνείας
  choice: духу блуда
  rationale: Сохраняет буквальный и богословски неоднозначный образ πνεῦμα, а πορνεία передаёт традиционным, но понятным словом «блуд».
- source_word: διὰ τῆς κοσμήσεως
  choice: украшениями
  rationale: Обозначает внешнее украшение или наряд; творительный оборот естественно выражает средство действия.
- source_word: τὸν ἰὸν ἐνσπείρουσι
  choice: сеют яд
  rationale: Сохраняет сочетание образов посева и яда, присутствующее в греческом тексте.
- source_word: αἰχμαλωτίζουσιν
  choice: берут их в плен
  rationale: Сохраняет сильную метафору пленения, а не ослабляет её до «покоряют».
theological_decisions:
- issue: Онтологический или образный смысл «духа блуда»
  choice: Сохранено выражение «дух блуда» без толкования
  alternative: «склонность к распутству»
  rationale: Греческий текст допускает представление как о духовной силе, так и об олицетворённой склонности; перевод не должен устранять эту неоднозначность.
- issue: Сравнение женщин с мужчинами
  choice: «женщины более мужчин поддаются»
  alternative: «женщины слабее мужчины перед»
  rationale: Передаёт сравнительную конструкцию ὑπὲρ τὸν ἄνδρα в обобщённом смысле, не превращая её в утверждение об одном конкретном мужчине.
translation_notes:
  register: Современный литературный русский с достоинством завещательного увещания. Синтаксис слегка упрощён ради ясности, при этом сохранены резкие образы и обобщающий характер исходного высказывания.
