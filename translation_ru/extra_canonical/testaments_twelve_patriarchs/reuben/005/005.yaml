revisions:
- from: Итак, дети мои, бегите от разврата и велите вашим жёнам и дочерям не украшать головы и лица, чтобы не вводить других в заблуждение; ведь всякая женщина, обманывающая этим, сохраняется для вечного наказания.
  to: Итак, дети мои, бегите от разврата и велите своим жёнам и дочерям не украшать головы и лица для обмана ума; ибо всякая женщина, обманывающая посредством этого, сохранена для вечного наказания.
  rationale: Устранено не подтверждённое источником слово «других»; выражение πρὸς ἀπάτην διανοίας передано близко и без навязывания того, чей именно ум имеется в виду. Также уточнена инструментальная связь ἐν τούτοις и сглажена передача τετήρηται. Смысл и серьёзный наставительный регистр сохранены.
