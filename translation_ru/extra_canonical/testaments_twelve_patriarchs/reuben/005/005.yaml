source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Λοιπὸν φεύγετε ἄνθρω- τέκνα μου τὴν πορνείαν⁴², *καὶ προστάσσετε⁴³ ταῖς γυναιξὶν που βιά- ὑμῶν⁴⁴ καὶ ταῖς θυγατράσιν Γὑμῶν˥⁴⁵, ἵνα μὴ κοσμῶσι⁴⁶ σασθαι. τὰς⁴⁷ κεφαλὰς αὐτῶν⁴⁸ καὶ τὰς ὄψεις⁴⁹ *πρὸς ἀπάτην διανοίας⁵⁰, ὅτι πᾶσα γυνὴ⁵¹ δολιευομένη ἐν τούτοις εἰς κόλασιν⁵² αἰώνιον⁵³ τετήρηται⁵⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/005.yaml
  text: Therefore flee sexual immorality, my children, and command your wives and your daughters not to adorn their heads and faces for the deception of the mind; for every woman who deceives by these things is reserved for eternal punishment.
translation:
  language: ru
  text: Итак, дети мои, бегите от разврата и велите своим жёнам и дочерям не украшать головы и лица для обмана ума; ибо всякая женщина, обманывающая посредством этого, сохранена для вечного наказания.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνείαν
  choice: разврата
  rationale: Передаёт широкий смысл сексуальной безнравственности естественным и достойным современным русским словом.
- source_word: προστάσσετε
  choice: велите
  rationale: Сохраняет повелительный и властный оттенок греческого глагола, не смягчая его до «советуйте».
- source_word: κοσμῶσι
  choice: украшать
  rationale: Прямо соответствует значению «украшать, наряжать» и подходит к головам и лицам.
- source_word: πρὸς ἀπάτην διανοίας
  choice: чтобы не вводить других в заблуждение
  rationale: Греческое выражение буквально связано с обманом ума; в контексте естественно обозначает цель или направленность украшения. Добавление «других» проясняет подразумеваемый объект, не закрепляя более узкое толкование о соблазнении.
- source_word: δολιευομένη ἐν τούτοις
  choice: обманывающая этим
  rationale: Передаёт причастие непосредственно и связывает средство обмана с названными украшениями.
- source_word: εἰς κόλασιν αἰώνιον τετήρηται
  choice: сохраняется для вечного наказания
  rationale: Сохраняет результативный оттенок перфекта и эсхатологическую формулировку источника.
theological_decisions:
- issue: Характер «вечного наказания»
  choice: вечного наказания
  alternative: вечной кары
  rationale: Прямая передача κόλασις αἰώνιος без смягчения, усиления или конфессионального истолкования.
- issue: Референт обмана в πρὸς ἀπάτην διανοίας
  choice: вводить других в заблуждение
  alternative: для обмана ума
  rationale: Выбрана понятная русская формулировка, при этом не уточняется, идёт ли речь исключительно о сексуальном соблазнении; тем самым сохраняется смысловая широта источника.
translation_notes:
  register: Современный литературный русский язык с серьёзным наставительным тоном. Синтаксис остаётся близким к греческому ходу мысли, но устранены неестественные для русского буквальные обороты.
