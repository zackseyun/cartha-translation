review_pass:
  verdict: revise
  source_fidelity: Черновик в целом точно передаёт повеления, предмет украшения и заключительное утверждение о вечном наказании. Однако «вводить других в заблуждение» добавляет отсутствующий в греческом тексте объект («других») и тем самым сужает/конкретизирует неоднозначное πρὸς ἀπάτην διανοίας. Формулировка «для обмана ума» ближе к исходному выражению и сохраняет его неуточнённость.
  naturalness: «Сохраняется для вечного наказания» понятно, но несколько механически. «Сохранена для вечного наказания» естественнее по-русски и хорошо передаёт перфектное пассивное τετήρηται. Остальной наставительный регистр современен и литературен.
  terminology: «Разврат» допустимо передаёт πορνεία в данном наставительном контексте; «вечное наказание» точно соответствует κόλασις αἰώνιος. «Велите» сохраняет силу προστάσσετε. Для δολιευομένη ἐν τούτοις «обманывающая посредством этого» явнее передаёт инструментальное ἐν τούτοις, чем простое «этим».
  issues:
  - severity: medium
    issue: Добавлен референт «других» в цели украшения.
    rationale: В πρὸς ἀπάτην διανοίας нет выраженного объекта, соответствующего «другим». Добавление направляет фразу к определённой интерпретации и не сохраняет исходную неоднозначность.
  - severity: low
    issue: «Сохраняется» менее естественно, чем «сохранена».
    rationale: Греческий перфектный пассив обозначает уже установленное состояние; краткое страдательное причастие естественно передаёт это в русском.
  revised_text: Итак, дети мои, бегите от разврата и велите своим жёнам и дочерям не украшать головы и лица для обмана ума; ибо всякая женщина, обманывающая посредством этого, сохранена для вечного наказания.
