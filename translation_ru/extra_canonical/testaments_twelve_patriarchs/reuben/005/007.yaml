source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '* Κἀκεῖναι γὰρ⁷⁰ ἐπιθυμοῦσαι * τῇ διανοίᾳ τῆς φαντασίας⁷¹ αὐτῶν ἔτεκον⁷² γίγαντας. Ἐφαίνοντο γὰρ αὐταῖς⁷³ * οἱ Ἐγρήγοροι⁷⁴ * ἕως εἰ θέλετε τοῦ οὐρανοῦ φθάνοντες⁷⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/007.yaml
  text: And those women also, desiring in their minds their appearance, gave birth to giants. For the Watchers appeared to them as reaching to heaven.
translation:
  language: ru
  text: И те женщины, возжелав в мыслях своих их облика, родили исполинов. Ибо Стражи казались им достигающими неба.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κἀκεῖναι
  choice: И те женщины
  rationale: Указательное местоимение женского рода множественного числа отсылает к ранее названным женщинам; слово «женщины» добавлено для естественности и ясности по-русски.
- source_word: ἐπιθυμοῦσαι
  choice: возжелав
  rationale: Передаёт сильное желание и сохраняет приподнятый, но понятный литературный регистр.
- source_word: τῇ διανοίᾳ τῆς φαντασίας αὐτῶν
  choice: в мыслях своих их облика
  rationale: Сохраняет связь желания с внутренним представлением и не устраняет двусмысленность местоимения αὐτῶν, вероятнее всего относящегося к Стражам.
- source_word: ἔτεκον γίγαντας
  choice: родили исполинов
  rationale: Прямо передаёт рождение γίγαντες; «исполины» соответствует библейско-преданийной лексике без излишней архаизации.
- source_word: οἱ Ἐγρήγοροι
  choice: Стражи
  rationale: Традиционное и смыслово точное обозначение сверхъестественных «Бодрствующих» в литературе Второго храма.
- source_word: ἕως ... τοῦ οὐρανοῦ φθάνοντες
  choice: достигающими неба
  rationale: Передаёт кажущуюся огромную высоту фигур; испорченное или вариантное εἰ θέλετε не получает искусственно навязанного смысла.
theological_decisions:
- issue: Характер зачатия и рождения исполинов
  choice: Сохранена формулировка о желании мысленного образа и последующем рождении без объяснения механизма.
  alternative: Истолковать фразу как буквальный телесный союз женщин со Стражами.
  rationale: Греческий текст связывает желание, внутреннее представление и рождение, но сам по себе не разъясняет причинную или физическую связь; перевод не должен разрешать эту напряжённость.
- issue: Природа Стражей
  choice: Сохранён титул «Стражи» без пояснения, что это ангелы.
  alternative: Перевести как «ангелы-Стражи».
  rationale: Текст употребляет самостоятельное наименование Ἐγρήγοροι; добавление «ангелы» было бы толкованием.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Синтаксис близок к греческому, но остаётся понятным; подлинная неясность выражения о мысленном образе сохранена.
