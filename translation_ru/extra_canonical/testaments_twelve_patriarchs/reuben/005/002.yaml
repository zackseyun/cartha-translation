  text: А того, кого им не удаётся околдовать внешним видом, они одолевают обманом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦ σχήματος
  choice: внешним видом
  rationale: σχῆμα здесь обозначает внешний облик или вид; творительный оборот естественно передаёт средство воздействия.
- source_word: οὐκ ἰσχύουσιν
  choice: не удаётся
  rationale: В сочетании с инфинитивом выражает неспособность достичь результата; по-русски «не удаётся» звучит естественно и сохраняет смысл.
- source_word: καταγοητεῦσασθαι
  choice: околдовать
  rationale: Глагол связан с чарами и обольщением; «околдовать» сохраняет образ магического либо неотразимо обольстительного воздействия.
- source_word: δι᾿ ἀπάτης
  choice: обманом
  rationale: Передаёт способ действия кратко и непосредственно; ἀπάτη означает обман, хитрость или введение в заблуждение.
- source_word: καταγωνίζονται
  choice: одолевают
  rationale: Передаёт направленное преодоление и победу над человеком без излишне военной окраски.
