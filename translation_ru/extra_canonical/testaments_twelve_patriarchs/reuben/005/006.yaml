base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/006.yaml
  text: For in this way they also enticed the Watchers before the flood; for as they kept looking at them continually, they also came to be in desire for them, and they conceived the deed in their mind; for they were transforming themselves into the form of men and appearing to them while their husbands were with them.
translation:
  language: ru
  text: 'Так они соблазнили и Стражей перед потопом: те непрестанно смотрели на них, сами воспылали к ним желанием и замыслили в уме это деяние. Ведь Стражи принимали мужской облик и являлись женщинам во время их близости со своими мужьями.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческая заключительная конструкция содержит местоименные отсылки, которые могут передаваться по-разному. Здесь «им» относится к женщинам, а «их мужьями» — к мужьям женщин.
    reason: Поясняет референцию местоимений, не представляя текст как более повреждённый или неопределённый, чем позволяет контекст.
lexical_decisions:
- source_word: ἔθελξαν
  choice: соблазнили
  rationale: Передаёт воздействие, возбуждающее влечение, без более узкого оттенка колдовского «очаровали».
- source_word: τοὺς Ἐγρηγόρους
  choice: Стражей
  rationale: Традиционное название сверхъестественных существ (буквально «Бодрствующие»); прописная буква показывает, что это наименование группы.
- source_word: ἐν ἐπιθυμίᾳ
  choice: воспылали к ним желанием
  rationale: Естественно по-русски передаёт возникшее сильное влечение и сохраняет направленность αὐτῶν.
- source_word: συνέλαβον τῇ διανοίᾳ τὴν πρᾶξιν
  choice: замыслили это деяние
  rationale: Идиоматически передаёт буквальное «зачали/схватили в уме деяние», не добавляя фактического совершения поступка.
- source_word: μετεσχηματίζοντο ... εἰς ἄνδρα
  choice: принимали облик мужчин
  rationale: Передаёт изменение внешнего вида или формы; множественное «мужчин» естественно согласуется с групповым субъектом.
- source_word: συνεφαίνοντο αὐταῖς
  choice: являлись Стражам
  rationale: Следует смыслу чтения, отражённого в контексте и консультационном английском тексте; местоименная форма в греческой передаче текстуально затруднительна, поэтому адресат назван явно.
theological_decisions:
- issue: Природа превращения женщин
  choice: «принимали облик мужчин»
  alternative: «превращались в мужчин»
  rationale: Формулировка сохраняет возможность явления в мужском облике и не утверждает полного онтологического превращения.
- issue: Тождество Стражей
  choice: Оставлено традиционное наименование без поясняющего определения
  alternative: «ангелы-Стражи»
  rationale: Сам стих не называет их ангелами; добавление разрешило бы подразумеваемую традицией идентификацию прямо в основном тексте.
- issue: Смысл заключительной конструкции
  choice: Женщины являлись Стражам во время близости со своими мужьями
  alternative: Женщины являлись своим мужьям / Стражи являлись женщинам
  rationale: Синтаксис и рукописная передача заключительной фразы затруднены. Основной текст следует наиболее связному смыслу, представленному в английском аудированном слое, а неоднозначность отмечена сноской.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной традиционностью. Длинное греческое предложение разделено для ясности; причинные связи сохранены. Необычное содержание передано без смягчения, конфессиональных уточнений и лишней экспликации.
