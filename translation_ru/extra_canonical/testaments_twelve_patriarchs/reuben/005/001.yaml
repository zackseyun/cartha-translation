base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/001.yaml
  text: For women are evil, my children; and because they have no authority or power over the man, they scheme by their appearance how they may draw him to themselves.
translation:
  language: ru
  text: Ибо женщины злы, дети мои, и, поскольку у них нет власти или силы над мужчиной, они хитрят, используя свою внешность, чтобы привлечь его к себе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πονηραί
  choice: злы
  rationale: Прямо передаёт предикативное значение «злые, дурные», не смягчая резкое обобщение исходного текста.
- source_word: τέκνα μου
  choice: дети мои
  rationale: Естественное и точное обращение, сохраняющее наставительный тон.
- source_word: ἐξουσίαν ἢ δύναμιν
  choice: власти или силы
  rationale: 'Сохраняет два близких, но не тождественных понятия: право/власть и способность/силу.'
- source_word: ἐπὶ τὸν ἄνδρα
  choice: над мужчиной
  rationale: Предлог ἐπί в сочетании с существительными власти и силы естественно передаётся как «над»; определённый артикль не требует искусственного русского определённого указания.
- source_word: δολιεύονται
  choice: прибегают к ухищрениям
  rationale: Передаёт идею коварного замысла или хитрости без неестественного буквального глагола.
- source_word: ἐν σχήμασιν
  choice: во внешности
  rationale: В данном контексте σχήματα относится к наружному виду, облику или способам внешнего представления; русский вариант сохраняет эту направленность.
- source_word: πρὸς ἑαυτὰς ἐπισπάσωνται
  choice: привлечь его к себе
  rationale: Точно и естественно передаёт образ притягивания мужчины к ним самим.
theological_decisions:
- issue: Резкое обобщение о женщинах
  choice: Сохранено как «женщины злы»
  alternative: «женщины склонны ко злу» или «женщины коварны»
  rationale: Исходный текст прямо употребляет предикативное πονηραί; смягчение добавило бы отсутствующее в греческом ограничение и ослабило бы напряжённость высказывания.
translation_notes:
  register: Современный литературный русский с достоинством наставительного завещательного жанра. Синтаксис слегка упрощён для ясности, но резкость и логика греческого высказывания сохранены.
