  text: For a woman is not able to force a man openly, but by a harlot's manner she acts craftily against him.
translation:
  language: ru
  text: Ведь женщина не может принудить мужчину открыто, но в образе распутницы хитро действует против него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в облике (или манере) распутницы». Греческое выражение может указывать на внешний облик, принятую роль или поведение; буквально далее: «хитро действует против него».'
    reason: Сноска сохраняет диапазон значений σχῆμα и не сводит πανουργεύεται к соблазнению.
lexical_decisions:
- source_word: βιάσαι εἰς πρόσωπον
  choice: принудить мужчину открыто
  rationale: Выражение буквально связано с действием «в лицо» и в данном противопоставлении означает прямое, открытое принуждение.
- source_word: ἐν σχήματι πορνικοῖς
  choice: соблазнительным видом
  rationale: Передаёт образ или манеру распутницы естественным современным русским языком, не сводя выражение исключительно к одежде.
- source_word: πανουργεύεται
  choice: коварно завлекает
  rationale: Глагол обозначает хитрое, коварное воздействие; с учётом направленности на мужчину «завлекает» естественно передаёт смысл в контексте.
theological_decisions:
- issue: Обобщающее высказывание о женщине
  choice: Сохранена общая грамматическая формулировка исходного текста без расширения и смягчения.
  alternative: Уточнить, что речь идёт только о распутной женщине.
  rationale: Греческий текст начинает с общего γυνή, а характеристика распутства появляется в описании способа действия; перевод не должен молча снимать напряжение текста.
translation_notes:
  register: Современный литературный русский язык; формулировка сохраняет афористичность и контраст между открытым принуждением и скрытым соблазнением. Текст источника имеет редакционные пометы и некоторую синтаксическую шероховатость, поэтому спорное выражение пояснено сноской.
