  text: And after this, with the resolve of my soul, I repented before the Lord for seven years.
translation:
  language: ru
  text: И после этого я по решению своей души семь лет каялся пред Господом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ τοῦτο
  choice: после этого
  rationale: Прямо и естественно передаёт временную последовательность.
- source_word: ἐν προαιρέσει ψυχῆς μου
  choice: по решению своей души
  rationale: Сохраняет значение сознательного внутреннего решения или намерения, не сводя выражение лишь к эмоциональной решимости.
- source_word: ἑπτὰ ἔτη
  choice: семь лет
  rationale: Сохраняет указание на продолжительность покаяния; расположение перед глаголом естественно для русского языка.
- source_word: μετενόησα
  choice: каялся
  rationale: Несовершенный вид в русском контексте передаёт продолжавшееся семь лет покаяние, хотя греческая форма сама по себе аористная.
- source_word: ἐνώπιον Κυρίου
  choice: пред Господом
  rationale: Достоинная и понятная современному читателю формулировка, близкая буквальному «перед Господом».
theological_decisions:
- issue: Характер покаяния
  choice: каялся
  alternative: раскаялся
  rationale: При обстоятельстве «семь лет» форма «каялся» естественнее выражает длительный процесс и не добавляет идеи одномоментного завершённого действия.
- issue: Внутренняя воля человека
  choice: по решению своей души
  alternative: с решимостью в душе
  rationale: Выбор сохраняет формальную связь προαίρεσις с сознательным волевым решением, не усиливая текст до абсолютной непоколебимости.
translation_notes:
  register: Современный литературный русский с умеренно библейским оборотом «пред Господом». Синтаксис краткий и ясный; сохранены внутренняя волевая направленность и длительность покаяния.
