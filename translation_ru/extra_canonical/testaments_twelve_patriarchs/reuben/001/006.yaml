revisions:
- from: И вот, сегодня я призываю Бога небесного в свидетели против вас, чтобы вы не жили в неразумии юности и в разврате, которому предался я, осквернив ложе моего отца Иакова.
  to: И вот, сегодня я призываю Бога небесного в свидетели против вас, чтобы вы не жили в неведении юности и в разврате, в котором я был увлечён и осквернил ложе моего отца, Иакова.
  rationale: 'Устранено синтаксическое смещение между двумя греческими глаголами и уточнена передача ἀγνοία. Иных читательских сносок не требуется: варианты, обозначенные в критическом аппарате исходного издания, не требуют пояснения для выбранного связного текста.'
