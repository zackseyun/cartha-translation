  text: And behold, today I call the God of heaven to witness against you, that you not walk in the ignorance of youth and in sexual immorality, in which I was swept away and defiled the bed of my father Jacob.
translation:
  language: ru
  text: И вот, сегодня я призываю Бога небесного в свидетели против вас, чтобы вы не жили в неведении юности и в разврате, в котором я был увлечён и осквернил ложе моего отца, Иакова.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμαρτύρομαι ὑμῖν τὸν Θεὸν
  choice: призываю Бога… в свидетели против вас
  rationale: Передаёт юридически-вразумляющий оттенок глагола и конструкцию с адресатом ὑμῖν, не ослабляя серьёзности предупреждения.
- source_word: πορευθῆτε
  choice: жили
  rationale: Буквально «ходили», но в данном нравственном контексте естественная русская передача — «жили», то есть следовали определённому образу жизни.
- source_word: ἀγνοίᾳ νεότητος
  choice: неразумии юности
  rationale: Сохраняет значение незнания или неведения, окрашенного юношеской несдержанностью, без чрезмерного уточнения.
- source_word: πορνείᾳ
  choice: разврате
  rationale: Современное и ясное обозначение половой распущенности; подходит к рассказу Рувима об осквернении отцовского ложа.
- source_word: ἐν ᾗ ἐξεχύθην
  choice: которому предался я
  rationale: Греческое выражение буквально связано с «излиться/разлиться»; в контексте оно обозначает безудержное погружение в разврат. «Предался» естественно передаёт этот смысл, не вводя отсутствующего образа внешнего принуждения.
- source_word: ἐμίανα κοίτην
  choice: осквернив ложе
  rationale: Сохраняет сильную культово-нравственную окраску μιαίνω и традиционно-достоинное «ложе» для κοίτη.
theological_decisions:
- issue: Степень личной ответственности в выражении ἐξεχύθην
  choice: «которому предался я»
  alternative: «которым я был увлечён»
  rationale: Средняя/пассивная форма допускает оттенок захваченности страстью, однако контекст исповеди и предостережения подчёркивает ответственность Рувима. Выбранная формулировка не снимает возможной силы страсти, но не изображает его лишь пассивной жертвой.
- issue: Функция Бога как свидетеля
  choice: «в свидетели против вас»
  alternative: «свидетелем вам»
  rationale: Предостережение имеет обвинительно-заветный оттенок; «против вас» выражает его яснее, оставаясь в пределах значения конструкции.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан ясным для обычного читателя; сохранены формулы «Бог небесный», «осквернить ложе» и торжественный тон отцовского предостережения.
