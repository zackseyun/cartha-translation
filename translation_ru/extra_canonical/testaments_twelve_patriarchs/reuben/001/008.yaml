source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 8. Ἤμην γὰρ⁵⁸ ἐτῶν τριάκοντα ὅτε ἔπραξα τὸ πονηρὸν ἐνώπιον Κυρίου⁵⁹. καὶ ἐμαλακίσθην *μῆνας ἑπτὰ⁶⁰ ἕως θανάτου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/008.yaml
  text: For I was thirty years old when I did evil before the Lord, and for seven months I was weakened to the point of death.
translation:
  language: ru
  text: Мне было тридцать лет, когда я совершил зло пред Господом, и семь месяцев я изнемогал, находясь при смерти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπραξα τὸ πονηρόν
  choice: совершил зло
  rationale: Передаёт действие и субстантивированное τὸ πονηρόν естественно по-русски, не добавляя отсутствующего в греческом уточнения.
- source_word: ἐνώπιον Κυρίου
  choice: пред Господом
  rationale: Сохраняет библейскую формулу и смысл поступка, совершённого перед лицом Господа.
- source_word: ἐμαλακίσθην
  choice: изнемогал
  rationale: В данном контексте обозначает телесное ослабление или тяжёлое болезненное состояние; русский глагол звучит естественно и не привносит посторонних значений.
- source_word: ἕως θανάτου
  choice: находясь при смерти
  rationale: Передаёт крайнюю степень ослабления — состояние на грани смерти, а не утверждение, что смерть действительно наступила.
theological_decisions:
- issue: Характер зла в выражении τὸ πονηρόν
  choice: совершил зло
  alternative: совершил злое дело
  rationale: Текст не называет поступок внутри данного стиха; перевод сохраняет эту неопределённость и не конкретизирует вину.
- issue: Связь болезни с проступком
  choice: простое последовательное соединение через «и»
  alternative: явно представить болезнь как Божье наказание
  rationale: Греческий текст ставит события рядом, но не выражает причинную связь напрямую; поэтому она не добавлена.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Пред Господом» сохранено как узнаваемая библейская формула; синтаксис сделан ясным для обычного читателя.
