translation:
  language: ru
  text: Список завещания Рувима — того, что он заповедал своим сыновьям перед смертью, на сто двадцать пятом году своей жизни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: Список
  rationale: В заголовочной формуле означает письменную копию или запись документа; «список» сохраняет этот смысл и соответствует достоинству древнего текста.
- source_word: διαθήκης
  choice: завещания
  rationale: В данном литературном контексте речь о предсмертном наставлении, оформленном как завещание.
- source_word: ἐνετείλατο
  choice: заповедал
  rationale: Передаёт значение торжественного повеления или наставления и сохраняет связь с формой завещания.
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν
  choice: перед смертью
  rationale: Естественная русская передача греческой конструкции «прежде чем ему умереть» без изменения смысла.
- source_word: ἐν ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: на сто двадцать пятом году своей жизни
  rationale: Точно воспроизводит древний способ обозначения возраста и не превращает его без необходимости в современную формулу «в возрасте 125 лет».
