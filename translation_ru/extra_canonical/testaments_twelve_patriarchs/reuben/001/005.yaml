  text: And rising up, he kissed them and said to them, “Hear, my brothers and my sons; listen to Reuben your father in what I command you.”
translation:
  language: ru
  text: 'И, встав, он поцеловал их и сказал им: «Послушайте, братья мои и сыновья мои; внимайте Рувиму, отцу вашему, во всём, что я заповедую вам».'
