  source_fidelity: 'Текст точно передаёт греческую последовательность действий и речь Рувима. Два самостоятельных призыва к слушанию сохранены: «Послушайте» для Ἀκούσατε и «внимайте» для ἐνωτίσασθε. Самонаименование в третьем лице («Рувиму, отцу вашему») соответствует греческому Ῥουβὴμ τοῦ πατρὸς ὑμῶν. «Во всём, что я заповедую вам» естественно передаёт ὅσα ἐντέλλομαι ὑμῖν, не добавляя содержательных ограничений.'
