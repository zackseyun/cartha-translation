lexical_decisions:
- source_word: ἀναστάς
  choice: встав
  rationale: Передаёт обстоятельственное причастие аориста кратко и естественно.
- source_word: κατεφίλησεν
  choice: поцеловал
  rationale: В данном семейном контексте естественное русское соответствие; возможный усилительный оттенок приставки не следует преувеличивать.
- source_word: Ἀκούσατε
  choice: Послушайте
  rationale: Прямо передаёт призыв услышать последующее наставление.
- source_word: ἐνωτίσασθε
  choice: внимайте
  rationale: Сохраняет отдельный, усиленный призыв внимательно слушать, не сливая его с предыдущим Ἀκούσατε.
- source_word: ἐντέλλομαι
  choice: заповедую
  rationale: Соответствует торжественному отцовскому наставлению и значению повеления, не сводя его к простому совету.
