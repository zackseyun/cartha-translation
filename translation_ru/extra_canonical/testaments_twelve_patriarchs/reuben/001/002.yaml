  text: Two years after the death of Joseph his brother, when Reuben had fallen sick, his sons and the sons of his sons gathered to visit him.
translation:
  language: ru
  text: Через два года после смерти своего брата Иосифа Рувим заболел, и его сыновья и внуки собрались навестить его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ἔτη δύο τῆς τελευτῆς
  choice: Через два года после смерти
  rationale: Естественная современная передача временной конструкции; τελευτή здесь обозначает смерть.
- source_word: ἀρρωστήσαντος Ῥουβήμ
  choice: Рувим заболел
  rationale: Греческий абсолютный генитив передан самостоятельной частью предложения для ясности и естественности по-русски.
- source_word: υἱοὶ αὐτοῦ καὶ υἱοὶ τῶν υἱῶν αὐτοῦ
  choice: его сыновья и внуки
  rationale: Буквальное «сыновья его сыновей» естественно и точно выражается русским словом «внуки»; местоимение относится к Рувиму.
- source_word: συνήχθησαν ἐπισκέψασθαι αὐτόν
  choice: собрались навестить его
  rationale: Сохраняет значение совместного прихода с целью посетить больного; «навестить» в данном контексте звучит естественно.
