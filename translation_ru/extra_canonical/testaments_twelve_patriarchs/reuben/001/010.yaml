  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/010.yaml
  text: And I drank no wine or strong drink, and no meat entered my mouth, and I ate no bread of desire; but I was mourning over my sin, for it was great, such as had not happened in Israel.
translation:
  language: ru
  text: Я не пил ни вина, ни крепкого напитка, не брал в рот мяса и не ел никакого желанного хлеба, но скорбел о своём грехе, ибо он был велик — такого не бывало в Израиле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σίκερα
  choice: крепкий напиток
  rationale: Передаёт общее значение заимствованного слова, обозначающего опьяняющий напиток, отличный от вина, и остаётся понятным современному читателю.
- source_word: κρέας οὐκ εἰσῆλθεν ἐν τῷ στόματί μου
  choice: мясо не входило в мои уста
  rationale: Сохранён выразительный образ греческого текста без неестественного для русского уточнения.
- source_word: πᾶν ἄρτον ἐπιθυμίας
  choice: никакого желанного хлеба
  rationale: Сохраняет необычное и несколько неоднозначное сочетание «хлеб желания», не сужая его без достаточных оснований до лакомств или изысканной пищи.
- source_word: πενθῶν
  choice: скорбел
  rationale: Передаёт продолжительное покаянное горе; в русском контексте естественнее буквального «был в трауре».
theological_decisions:
- issue: Соотнесение заключительного οἷα с грехом Рувима
  choice: такого ещё не бывало в Израиле
  alternative: подобного греха ещё не совершали в Израиле
  rationale: Формулировка сохраняет отсылку к великому греху, но не добавляет отсутствующие в греческом тексте существительное и действующее лицо.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной речи. Синтаксический параллелизм трёх форм воздержания сохранён; заключение сделано естественным по-русски, без устранения лаконичности оригинала.
