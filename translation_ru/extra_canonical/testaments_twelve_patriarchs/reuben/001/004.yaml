  text: Then, seeing Judah and Gad and Asher there, his brothers, he said to them, “Raise me up, so that I may tell my brothers and my children the things hidden in my heart; for behold, even now I am passing away.”
translation:
  language: ru
  text: 'Увидев там своих братьев Иуду, Гада и Асира, он сказал им: «Поднимите меня, чтобы я рассказал моим братьям и моим детям о том, что сокрыто у меня в сердце, ибо вот, я уже угасаю».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδών ... ἐκεῖ
  choice: Увидев там
  rationale: Естественно передаёт обстоятельственный аористный причастный оборот и сохраняет указание места.
- source_word: Ἀναστήσατέ με
  choice: Приподнимите меня
  rationale: В сцене у смертного одра речь идёт о том, чтобы помочь лежащему приподняться; буквальное «поднимите» могло бы ошибочно подразумевать вставание на ноги.
- source_word: ὅσα ἔχω ἐν τῇ καρδίᾳ μου κρυπτά
  choice: о том, что сокрыто у меня в сердце
  rationale: Сохраняет образ сердца и значение скрытого, оставаясь естественным по-русски.
- source_word: ἐκλείπω
  choice: умираю
  rationale: В данном предсмертном контексте глагол означает угасание и уход из жизни; «умираю» ясно и естественно передаёт смысл без лишней образности.
