base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/007.yaml
  text: And I tell you that he struck me with a severe blow on my loins for seven months; and if my father Jacob had not prayed to the Lord for me, the Lord would have destroyed me.
translation:
  language: ru
  text: 'И говорю вам: он поразил меня тяжким ударом по пояснице на семь месяцев; и если бы мой отец Иаков не молился Господу за меня, Господь погубил бы меня.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπληξέ με πληγῇ μεγάλῃ
  choice: поразил меня тяжким ударом
  rationale: Сохраняет усиленную конструкцию с однокоренными глаголом и существительным, передавая тяжесть поражения естественным русским выражением.
- source_word: ἐπὶ τῆς λαγόνος μου
  choice: в поясницу
  rationale: λαγών обозначает бок, область бедра или поясницы; «в поясницу» понятно современному читателю и уместно при обозначении места удара.
- source_word: ἕως μῆνας ἑπτά
  choice: на семь месяцев
  rationale: Передаёт продолжительность поражения; буквальная конструкция «до семи месяцев» по-русски здесь неестественна.
- source_word: προσηύξατο περὶ ἐμοῦ πρὸς Κύριον
  choice: молился за меня Господу
  rationale: Сохраняет и ходатайственный смысл περὶ ἐμοῦ, и адрес молитвы πρὸς Κύριον.
- source_word: ἤθελε Κύριος ἀνελεῖν με
  choice: Господь погубил бы меня
  rationale: В условном контексте конструкция передаёт неосуществившийся исход; русская форма с «бы» звучит естественно и соответствует смыслу намерения, которое привело бы к гибели.
theological_decisions:
- issue: Не названный в первой части субъект глагола ἔπληξεν
  choice: Он
  alternative: Господь
  rationale: Греческий текст оставляет субъект подразумеваемым. Местоимение сохраняет эту зависимость от контекста и не вводит уточнение непосредственно в данный стих.
- issue: Смысл ἤθελε перед инфинитивом ἀνελεῖν
  choice: погубил бы
  alternative: хотел погубить
  rationale: Выбран естественный русский контрфактический оборот без утверждения отдельного богословского тезиса о Божьем желании; при этом сохраняется серьёзность угрожавшего исхода.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Избегнуты архаическое «чресла» и излишне медицинское «область поясницы»; синтаксис сохраняет двухчастную структуру греческого стиха.
