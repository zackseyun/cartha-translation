  text: 3. Καὶ¹⁸ εἶπεν αὐτοῖς¹⁹. Τέκνα²⁰ μου, *ἰδοὺ ἐγὼ²¹ ἀπο- θνήσκω καὶ πορεύομαι ὁδὸν²² τῶν²³ πατέρων μου²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/003.yaml
  text: And he said to them, “My children, behold, I am dying and going the way of my fathers.”
translation:
  language: ru
  text: 'И он сказал им: «Дети мои, вот, я умираю и ухожу путём моих отцов».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνα μου
  choice: Дети мои
  rationale: Прямое и естественное обращение, сохраняющее родственную теплоту греческого выражения.
- source_word: ἰδοὺ
  choice: вот
  rationale: Сохраняет указательно-эмфатическую функцию греческого слова и соответствует возвышенному, но понятному регистру.
- source_word: ἀποθνήσκω
  choice: умираю
  rationale: Настоящее время передаёт приближающуюся и уже происходящую смерть говорящего без добавочного толкования.
- source_word: πορεύομαι ὁδὸν τῶν πατέρων μου
  choice: ухожу путём моих отцов
  rationale: Сохраняет образ пути и эвфемистическое обозначение смерти, а также личное «моих».
theological_decisions:
- issue: Образ «пути отцов» как обозначение смерти
  choice: Сохранён буквально как «ухожу путём моих отцов»
  alternative: «отправляюсь туда, куда ушли мои предки»
  rationale: Буквальная образность ясна по контексту и не устраняет намеренную метафоричность исходного текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Союз «и» сохранён между двумя сказуемыми; пунктуация не создаёт лишнего разрыва единого высказывания.
