base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002.yaml
  text: 'And now, my children, hear me concerning what I saw about the seven spirits of deceit[a] in my repentance. There were given, then, seven spirits set against man, and these are the heads of the works of youthfulness[b].


    And seven other spirits were given to him at creation, so that every work of man might be in them. The first is the spirit of life, by which a person’s constitution is formed. The second is the spirit of sight, by which desire comes to be. The third is the spirit of hearing, by which instruction comes to be. The fourth is the spirit of smell, by which tastes are produced for the drawing in of air and breath[c]. The fifth is the spirit of speech, by which knowledge comes to be. The sixth is the spirit of taste, by which the eating of foods and drinks comes to be, and strength is formed by it, because in foods is the basis of strength. The seventh is the spirit of procreation and intercourse, by which sins come together through the love of pleasure. Therefore this spirit is last in creation and first in youth, because it is filled with ignorance, and it leads the young man like a blind man into a pit, and like an animal over a cliff.'
translation:
  language: ru
  text: 'И теперь, дети мои, послушайте, что я увидел о семи духах заблуждения[a] в моём покаянии. Итак, против человека были даны семь духов; они — начала дел юности[b].


    И ещё семь духов были даны ему при сотворении, чтобы в них было всякое человеческое дело. Первый — дух жизни, посредством которого создаётся устройство человека. Второй — дух зрения, посредством которого возникает желание. Третий — дух слуха, посредством которого приходит наставление. Четвёртый — дух обоняния, посредством которого возникают вкусовые ощущения, данные для втягивания воздуха и дыхания[c]. Пятый — дух речи, посредством которого возникает знание. Шестой — дух вкуса, посредством которого происходит употребление пищи и напитков, и в нём формируется сила, ибо в пище — основа силы. Седьмой — дух порождения и совокупления, посредством которого через любовь к наслаждению соединяются грехи. Поэтому этот дух — последний среди сотворённого и первый в юности, потому что он исполнен неведения; оно ведёт юношу, словно слепого, в яму и, словно животное, к обрыву.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духах обмана» либо «духах прельщения».'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «главы дел юности». Вероятно, имеются в виду главные источники или движущие начала грехов, свойственных юности; греческое слово может также оттенять новизну или юношескую порывистость.'
    reason: lexical_alternative
  - marker: c
    text: Греческая фраза об обонянии, вкусовых ощущениях, втягивании воздуха и дыхании трудна для понимания и, возможно, дошла в неустойчивой форме.
    reason: textual_variant
lexical_decisions:
- source_word: πνευμάτων τῆς πλάνης
  choice: духах заблуждения
  rationale: πλάνη охватывает заблуждение, обман и уклонение с пути. «Заблуждение» сохраняет смысл ошибочного и вводящего в заблуждение влияния, не утверждая однозначно, что речь только о преднамеренном обмане.
- source_word: ἐν τῇ μετανοίᾳ μου
  choice: во время моего покаяния
  rationale: В исповедальном контексте Рувима μετάνοια обозначает нравственное раскаяние и обращение от совершённого греха; «покаяние» естественно передаёт этот смысл.
- source_word: κατὰ τοῦ ἀνθρώπου
  choice: против человека были поставлены
  rationale: κατά с родительным выражает направленность против человека. Добавление «поставлены» естественно связано с ἐδόθη и подчёркивает противодействие.
- source_word: αἱ κεφαλαὶ τῶν ἔργων τοῦ νεωτερισμοῦ
  choice: начала дел юношеской необузданности
  rationale: κεφαλαί метафорически указывает на главные источники или начала. νεωτερισμός здесь связан не просто с молодостью, а с характерной для юности порывистостью и своеволием; примечание сохраняет буквальный образ.
- source_word: ἐπὶ τῆς κτίσεως
  choice: при сотворении
  rationale: Фраза обозначает время или обстоятельство наделения человека этими способностями.
- source_word: σύστασις
  choice: человеческое естество
  rationale: В данном антропологическом перечне слово означает состав, устройство или телесно-жизненную организацию человека. «Естество» звучит достойно и шире, чем одно лишь «тело».
- source_word: γίνονται γεύσεις δεδομέναι εἰς ὁλκὴν ἀέρος καὶ ἀναπνοῆς
  choice: возникают вкусовые ощущения при вдыхании воздуха
  rationale: Греческая формулировка семантически трудна и, вероятно, нестабильна. Перевод сохраняет связь обоняния, ощущений и втягивания воздуха, избегая бессмысленного буквального дублирования «воздуха и дыхания».
- source_word: λαλιᾶς
  choice: речи
  rationale: В перечне человеческих способностей «речь» является ясным и стилистически уместным соответствием.
- source_word: ἡ ὑπόστασις τῆς ἰσχύος
  choice: основа силы
  rationale: В бытовом физиологическом контексте ὑπόστασις означает основание или опору; «основа» не привносит позднейшего богословского значения «ипостась» или «сущность».
- source_word: σπορᾶς καὶ συνουσίας
  choice: семени и совокупления
  rationale: σπορά буквально связано с семенем и деторождением, а συνουσία здесь обозначает половое соединение. Формулировка сохраняет прямоту оригинала без грубости.
- source_word: συνέρχονται ... ἁμαρτίαι
  choice: соединяются грехи
  rationale: Сохранён необычный образ оригинала, где грехи «сходятся» или «соединяются», вместо пояснительного перефразирования вроде «входят в человека».
theological_decisions:
- issue: Смысл μετανοία в исповедальном завещании
  choice: во время моего покаяния
  alternative: когда я переменил образ мыслей
  rationale: Контекст связан с признанием Рувимом своего греха, поэтому нравственно-религиозный смысл «покаяния» здесь сильнее чисто интеллектуальной перемены мнения.
- issue: Статус раздела о семи сотворённых духах
  choice: включить в основной текст
  alternative: вынести как позднейшее добавление или опустить
  rationale: Этот раздел присутствует в предоставленном греческом тексте; его возможная литературная вторичность не даёт оснований исключать его из перевода данного свидетеля.
- issue: Характер «духов» в антропологическом перечне
  choice: сохранить слово «дух» без догматического уточнения
  alternative: перевести как «способность» или понимать как самостоятельное духовное существо
  rationale: πνεῦμα в тексте охватывает жизнь, чувства, речь и половую способность. Перевод не должен преждевременно решать, являются ли они персонифицированными силами или человеческими способностями.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксический параллелизм перечня сохранён, но чрезмерно буквальные обороты сглажены там, где они затемняли бы смысл. Термины, способные получить позднейшую догматическую окраску, переданы по непосредственному антропологическому контексту.
