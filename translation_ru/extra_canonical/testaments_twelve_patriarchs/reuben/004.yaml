base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004.yaml
  text: '1[a]. Therefore, my children, do not pay attention to the beauty of women, nor dwell on their deeds; but walk in simplicity of heart, in the fear of the Lord, laboring in good works, and in learning, and in your flocks, until the Lord gives you a wife whom he himself chooses, so that you may not suffer as I did.


    2[b]. For until my father''s death I did not have the boldness to look my father in the face.


    3. And because of the reproach of my sin, my mind was continually consumed within me.


    4. For seven months I was sick unto death, and after I had repented with purpose of soul before the Lord, the spirit of jealousy departed from me. Until now I have kept myself on guard, and I have not sinned.


    5. Therefore, my children, I tell you: keep everything that I command you, and you will certainly not sin.


    6. For the sin of sexual immorality is a pit for the soul, separating it from God and bringing it near to idols; for it is this that leads the mind and understanding astray, and brings young men down to Hades before their time.


    7. For sexual immorality has destroyed many. Whether a man is old, or noble, or rich, or poor, he brings reproach on himself before the sons of men and a stumbling block to Beliar.


    8. For you have heard about Joseph, how he guarded himself from a woman and cleansed his thoughts from every kind of sexual immorality, and found favor before God and men.


    9. For the Egyptian woman did many things against him, and called in magicians and brought him potions; but Joseph guarded himself from every evil desire and did not accept the counsel of his soul toward wicked lust.


    10[c][d]. Therefore the God of your fathers delivered him from every hidden evil and from death.'
translation:
  language: ru
  text: '1. Итак, дети мои, не обращайте внимания на красоту женщин и не размышляйте об их поступках. Напротив, живите в простоте сердца и страхе Господнем, усердствуя в добрых делах, учении и трудах со своими стадами, пока Господь не даст вам жену, которую Сам пожелает, чтобы вам не пострадать, как пострадал я.


    2. До самой смерти отца я не смел взглянуть ему в лицо.[a]


    3. Из-за позора моего греха разум мой непрестанно томился во мне.


    4. Семь месяцев я был болен и находился при смерти. Когда же я с твёрдым намерением души покаялся перед Господом, дух ревности отошёл от меня.[b] До сих пор я был настороже и не грешил.


    5. Поэтому, дети мои, говорю вам: соблюдайте всё, что я заповедую вам, и вы не согрешите.


    6. Ведь грех разврата — яма для души: он отделяет её от Бога и приближает к идолам. Именно он вводит в заблуждение ум и рассудок и низводит юношей в Аид прежде их срока.


    7. Разврат погубил многих. Будь человек стар или знатен, богат или беден, он навлекает на себя позор среди сынов человеческих и приносит преткновение для Велиара.[c]


    8. Вы ведь слышали об Иосифе: он уберёг себя от женщины, очистил свои помыслы от всякого разврата и обрёл благоволение перед Богом и людьми.


    9. Египтянка многое предпринимала по отношению к нему: призывала чародеев и подносила ему зелья.[d] Но Иосиф хранил себя от всякой злой страсти и не принял внушения собственной души, влекущего к порочной похоти.


    10. Поэтому Бог ваших отцов избавил его от всякого скрытого зла и от смерти.


    [a] Греческий текст в этом месте повреждён или сжат в доступном слое распознавания. Смысл, по-видимому, в том, что из-за своего греха Рувим до смерти отца не смел взглянуть ему в лицо.


    [b] Строка о семи месяцах болезни и об уходе духа ревности восстанавливается по сохранившейся последовательности текста этой части «Завещания Рувима»; доступный греческий текст здесь неполон, поэтому перевод передаёт смысл с осторожностью.


    [c] Выражение «преткновение для Велиара» в греческом тексте трудно для истолкования. Оно сохранено почти буквально, без подмены поясняющим толкованием.


    [d] Греческое φάρμακα может означать лекарства, снадобья, зелья или магические составы. Упоминание чародеев и контекст обольщения позволяют перевести его как «зелья».'
