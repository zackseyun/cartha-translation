lexical_decisions:
- source_word: προσέχετε
  choice: не засматривайтесь
  rationale: В контексте предостережения речь идёт о намеренном направлении внимания на привлекательность; русский глагол естественно передаёт этот оттенок, не сводя запрет к случайному взгляду.
- source_word: ἐννοεῖσθε
  choice: не размышляйте
  rationale: Глагол обозначает внутреннее обдумывание; перевод сохраняет переход от внешнего внимания к мысленной сосредоточенности.
- source_word: ἁπλότητι καρδίας
  choice: в простоте сердца
  rationale: Сохраняется характерное библейское выражение о цельности и незлобии сердца без сведения его только к искренности.
- source_word: φόβῳ κυρίου
  choice: страхе Господнем
  rationale: Устойчивое библейское выражение сохраняет нравственно-богословскую силу исходного текста и не смягчается до одного лишь почтения.
- source_word: γράμμασι
  choice: в учении
  rationale: Буквально слово связано с буквами и письменностью, но здесь, в перечне дисциплинирующих занятий, естественно означает обучение или учёность.
- source_word: σύζυγον
  choice: жену
  rationale: В обращении отца к сыновьям это прямой и контекстуально точный эквивалент.
- source_word: παρρησίαν
  choice: не смел
  rationale: В данном контексте существительное указывает на свободу и уверенность открыто предстать перед отцом; русская конструкция естественно выражает отсутствие такой смелости.
- source_word: πορνεία
  choice: разврат
  rationale: Современное и достаточно широкое нравственное обозначение половой распущенности; оно не сужает значение до одного конкретного вида нарушения.
- source_word: βόθρος
  choice: яма
  rationale: Сохраняется конкретная и резкая метафора опасной западни для души.
- source_word: ᾅδην
  choice: Аид
  rationale: Транслитерация сохраняет образ мира мёртвых в исходной среде и избегает преждевременного отождествления с doctrinally более узким понятием ада.
- source_word: φάρμακα
  choice: зелья
  rationale: Слово допускает значения лекарств, снадобий и магических составов; соседнее упоминание чародеев поддерживает выбранный вариант.
theological_decisions:
- issue: Связь разврата с идолами
  choice: приближает к идолам
  alternative: вводит в идолопоклонство
  rationale: Греческий текст выражает приближение, а не прямо утверждает полноценное служение идолам; сохранена степень утверждения источника.
- issue: Передача ᾅδης
  choice: Аид
  alternative: преисподняя / ад / могила
  rationale: «Аид» точнее сохраняет исходный образ области мёртвых и не вносит более поздней конфессиональной конкретизации.
- issue: Трудное выражение πρόσκομμα τῷ Βελίαρ
  choice: преткновение для Велиара
  alternative: соблазн от Велиара / повод к падению через Велиара
  rationale: Синтаксис и смысл выражения неясны. Почти буквальный перевод сохраняет неоднозначность, а примечание делает трудность прозрачной.
- issue: Дух ревности в рассказе о покаянии
  choice: дух ревности отошёл от меня
  alternative: ревнивый дух покинул меня
  rationale: Сохранена возможность понимать «дух» как самостоятельную действующую силу или как олицетворённое внутреннее состояние; перевод не решает эту напряжённость за читателя.
- issue: Обещание не согрешить в 4:5
  choice: и вы не согрешите
  alternative: и тогда непременно не согрешите
  rationale: Категорическая сила греческого отрицания сохранена, но не усилена дополнительным толкованием; условная связь с соблюдением заповеданного ясна из синтаксиса.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Сохранены узнаваемые выражения «простота сердца», «страх Господень», «сыны человеческие» и «обрести благоволение», но синтаксис преимущественно современный и понятный. Текстовые лакуны и трудные места не сглажены молча, а отмечены сносками.
