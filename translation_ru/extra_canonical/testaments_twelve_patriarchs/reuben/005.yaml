  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005.yaml
  text: 1[a]. For women are evil, my children; and because they do not have authority or power over a man, they scheme by their appearance how they may draw him to themselves. 2. And the one whom they are not able to enchant by appearance, him they overcome through deceit. 3[b]. For an angel of God also told me concerning them and taught me that women are overcome by the spirit of sexual immorality more than a man, and in their heart they devise things against men; and by adornment they lead their minds astray, and through a glance they sow the poison, and first in thought and then by the act they take captive. 4. For a woman is not able to force a man openly, but by a harlot's manner she acts craftily against him. 5. Therefore flee sexual immorality, my children, and command your wives and your daughters not to adorn their heads and their faces for the deception of the mind; for every woman who uses deceit in these things is reserved for eternal punishment. 6. For in this way they also
    charmed the Watchers before the flood; for as they kept looking at them continually, they also came to be in desire for them, and they conceived the deed in their mind; for they were changing themselves into the form of men and appearing to them while they were with their husbands. 7. And they also, desiring in their minds their appearance, gave birth to giants[d][c]. For the Watchers appeared to them as reaching up to heaven.
translation:
  language: ru
  text: '1[a]. Ибо женщины злы, дети мои; и, поскольку у них нет власти или силы над мужчиной, они хитрят, пользуясь своей внешностью, чтобы привлечь его к себе. 2. А кого они не могут околдовать внешностью, того одолевают обманом. 3. Ведь и ангел Божий рассказал мне о них и научил меня, что дух блуда одолевает женщин сильнее, чем мужчину; в сердце своём они замышляют недоброе против мужчин, украшениями вводят их мысли в заблуждение, взглядом сеют отраву и пленяют — сперва в мыслях, а затем и на деле. 4. Ведь женщина не может принудить мужчину открыто, но коварно действует против него распутным видом. 5. Поэтому бегите от блуда, дети мои, и велите своим жёнам и дочерям не украшать головы и лица ради обольщения ума, ибо всякая женщина, прибегающая в этом к обману, сохраняется для вечного наказания. 6. Так они обольстили и Стражей[b] перед потопом. Те непрестанно смотрели на них, возжелали их и задумали это дело в своём уме: они принимали облик мужчин и являлись им, когда они были со своими
    мужьями. 7. А женщины, возжелав в мыслях своих их облика, родили исполинов[c]. Ибо Стражи являлись им достигающими до самого неба[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В стихах 1–2 греческое слово может означать также «наружный облик», «вид» или «способ представлять себя».
    reason: lexical_alternative
  - marker: b
    text: «Стражи» — небесные существа, известные из иудейских преданий о времени перед потопом; ср. позднейшее истолкование Бытия 6, особенно в 1 Еноха.
    reason: cross_reference
  - marker: c
    text: Стихи 6–7 отражают развитое предание о Стражах, их вожделении и рождении исполинов.
    reason: cultural_note
  - marker: d
    text: 'Последние слова можно понимать как гиперболу: женщинам казалось, что Стражи возвышаются до самого неба.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηραί
  choice: злы
  rationale: Сохраняет резкую нравственную оценку греческого текста, не смягчая её до «плохи».
- source_word: δολιεύονται ἐν σχήμασιν
  choice: хитрят, пользуясь своей внешностью
  rationale: Передаёт намеренный обман и инструментальное употребление внешнего облика; σχήμα может означать вид, облик или способ представления себя.
- source_word: καταγοητεῦσασθαι
  choice: околдовать
  rationale: Сохраняет сильный образ обольщения, близкого к зачаровыванию, а не сводит его к нейтральному привлечению.
- source_word: ἡττῶνται τῷ πνεύματι τῆς πορνείας
  choice: дух блуда одолевает женщин
  rationale: Естественно по-русски передаёт пассивную идею поражения и сохраняет πνεῦμα как духовную либо персонифицированную силу.
- source_word: ἐν καρδίᾳ μηχανῶνται κατὰ τῶν ἀνθρώπων
  choice: в сердце своём они замышляют недоброе против мужчин
  rationale: Сохраняет внутреннее обдумывание и направленность против людей/мужчин; «недоброе» делает неполный объект естественным по-русски, не отождествляя глагол с δολιεύονται.
- source_word: διὰ τῆς κοσμήσεως
  choice: украшениями
  rationale: Передаёт украшение или наряжание как названное в тексте средство обольщения.
- source_word: διὰ τοῦ βλέμματος τὸν ἰὸν ἐνσπείρουσι
  choice: взглядом сеют отраву
  rationale: Сохраняет яркую метафору сеяния яда посредством взгляда.
- source_word: ἐν σχήματι πορνικοῖς
  choice: распутным видом
  rationale: Передаёт нравственно окрашенный внешний образ; формулировка учитывает неровность греческого чтения.
- source_word: Ἐγρηγόρους
  choice: Стражей
  rationale: Устоявшееся обозначение небесных существ в иудейском предании допотопного времени.
- source_word: μετεσχηματίζοντο ... συνεφαίνοντο
  choice: принимали облик ... и являлись
  rationale: Сохраняет различие между изменением облика и явлением женщинам.
- source_word: γίγαντας
  choice: исполинов
  rationale: Библейски узнаваемое и литературно естественное обозначение гигантов, не устраняющее связь с допотопным преданием.
theological_decisions:
- issue: Резкие обобщающие высказывания о женщинах
  choice: Передать их прямо как речь Рувима
  alternative: Ограничить высказывания только безнравственными женщинами или смягчить обобщение
  rationale: Греческий текст формулирует обобщение прямо; редакционное смягчение скрыло бы трудную риторику источника.
- issue: πνεῦμα τῆς πορνείας
  choice: «дух блуда»
  alternative: «похотливое влечение» или «склонность к распутству»
  rationale: Слово «дух» сохраняет богословскую неоднозначность между духовной силой и персонифицированным пороком.
- issue: Предание о Стражах и исполинах
  choice: Сохранить названия «Стражи» и «исполины» в основном тексте
  alternative: Истолковать их как могущественных людей либо пересказать без терминов предания
  rationale: Эти образы составляют неотъемлемую часть отражённого здесь иудейского предания эпохи Второго храма.
- issue: Способ явления Стражей женщинам
  choice: «являлись женщинам во время их соития с мужьями»
  alternative: «являлись им, когда они были со своими мужьями»
  rationale: Более прямо передаёт συνουσία, не устраняя необычный и богословски напряжённый образ текста.
- issue: Причинная связь образа Стражей и рождения исполинов
  choice: Сохранить утверждение о мысленном желании их образа без рационализации механизма
  alternative: Представить обычное физическое зачатие от Стражей
  rationale: Греческая формулировка связывает рождение с мысленным желанием/представлением; перевод не должен подменять её более привычной версией предания.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательно-наставительного жанра. Резкость исходной гендерной риторики сохранена без одобрительного комментария и без скрытого смягчения. «Блуд» выбран как понятный библейский термин; синтаксис сделан естественным для современного читателя, при этом необычные элементы предания и местоименная неоднозначность не рационализированы сверх необходимого.
