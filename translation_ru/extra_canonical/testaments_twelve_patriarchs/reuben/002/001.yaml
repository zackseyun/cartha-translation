  footnotes:
  - marker: a
    text: 'Или: «духах заблуждения»; или: «духах обольщения».'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατέ μου
  choice: послушайте меня
  rationale: Естественно передаёт повелительную форму и родительный при глаголе слушания.
- source_word: τῶν ἑπτὰ πνευμάτων τῆς πλάνης
  choice: семи духах обмана
  rationale: Сохраняет структуру греческого словосочетания; πλάνη допускает значения обмана, заблуждения и обольщения.
- source_word: ἐν τῇ μετανοίᾳ μου
  choice: во время моего покаяния
  rationale: Контекстуально ясное временное понимание ἐν; при этом сохраняется связь видения с периодом покаяния Рувима.
theological_decisions:
- issue: Характер семи духов
  choice: духи обмана
  alternative: духи заблуждения / духи обольщения
  rationale: Греческое πλάνη не уточняет, исходят ли ложь и заблуждение от самих духов или описывают их воздействие; основной текст оставляет родительное сочетание без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного обращения. Порядок обращения «дети мои» сохранён близко к греческому; тяжеловесное буквальное «услышьте меня о том» заменено естественным «послушайте меня… о том».
