base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/005.yaml
  text: The third is the spirit of hearing, by which instruction comes to be. The fourth is the spirit of smell, by which tastes are given for the drawing in of air and breath[c].
translation:
  language: ru
  text: Третий — дух слуха, посредством которого возникает наставление. Четвёртый — дух обоняния, посредством которого даны вкусовые ощущения для втягивания воздуха и дыхания[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческая формулировка об обонянии, вкусовых ощущениях и втягивании воздуха трудна для понимания и, возможно, отражает сжатый или текстуально неустойчивый оборот.
    reason: textual_variant
lexical_decisions:
- source_word: πνεῦμα ἀκοῆς
  choice: дух слуха
  rationale: Сохраняет повторяющуюся антропологическую формулу источника и прямое значение обоих слов.
- source_word: μεθ’ ἧς γίνεται διδασκαλία
  choice: посредством которого совершается обучение
  rationale: Передаёт инструментальное значение μεθ’ ἧς и процессуальный характер γίνεται, не сужая διδασκαλία до одного лишь «наставления».
- source_word: πνεῦμα ὀσφρήσεως
  choice: дух обоняния
  rationale: Естественный современный русский эквивалент, сохраняющий параллелизм с «духом слуха».
- source_word: γεύσεις δεδομέναι
  choice: даны вкусовые ощущения
  rationale: «Вкусовые ощущения» яснее русского «вкусы» обозначает способность или опыт восприятия, а «даны» непосредственно отражает δεδομέναι.
- source_word: εἰς ὁλκὴν ἀέρος καὶ ἀναπνοῆς
  choice: для втягивания воздуха и дыхания
  rationale: Сохраняет необычную и, вероятно, текстуально неустойчивую связь существительных, не исправляя её догадкой переводчика.
theological_decisions:
- issue: Антропологическое значение πνεῦμα
  choice: дух
  alternative: способность / чувство
  rationale: Буквальное «дух» сохраняет терминологию и возможную богословско-антропологическую многозначность текста; функциональное истолкование не внесено в основной текст.
translation_notes:
  register: Современный литературный русский язык с умеренно формальным, достоинственным звучанием. Синтаксический параллелизм двух предложений сохранён; неясность второй фразы не устранена предположительной физиологической интерпретацией.
