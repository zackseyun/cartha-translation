  source_fidelity: 'Начало точно передаёт Καὶ ἕτερα ἑπτὰ πνεύματα ἐδόθη αὐτῷ ἐπὶ τῆς κτίσεως: «ещё семь духов», пассив «были даны ему» и временная привязка «при сотворении» допустимы. Однако «чтобы в них совершалось» подменяет εἶναι ἐν αὐτοῖς («быть/находиться в них») динамическим совершением дела. Это добавляет оттенок действия духов, которого греческая формулировка прямо не выражает.'
