  text: And seven other spirits were given to him at creation, so that every work of man might be in them.
translation:
  language: ru
  text: И ещё семь духов были даны ему при сотворении, чтобы в них заключалось всякое человеческое дело.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερα ἑπτὰ πνεύματα
  choice: ещё семь духов
  rationale: ἕτερα обозначает дополнительные, иные по отношению к ранее названным духам; «ещё» естественно передаёт эту связь по-русски.
- source_word: ἐδόθη αὐτῷ
  choice: были даны ему
  rationale: Сохранены пассивная конструкция и местоименная отсылка греческого текста без уточнения подразумеваемого деятеля или адресата.
- source_word: ἐπὶ τῆς κτίσεως
  choice: при сотворении
  rationale: Оборот передаёт временную привязку к акту сотворения; выбранное выражение естественно и не уточняет сверх текста, о чьём именно сотворении идёт речь.
- source_word: πᾶν ἔργον ἀνθρώπου
  choice: всякое человеческое дело
  rationale: Передаёт обобщённое значение единственного числа ἀνθρώπου современным литературным русским языком.
- source_word: τοῦ εἶναι ἐν αὐτοῖς
  choice: чтобы в них совершалось
  rationale: Целевая конструкция передана естественным русским оборотом; «совершалось» проясняет связь слова «дело» с пребыванием или осуществлением в этих духах, не перечисляя сами духи.
theological_decisions:
- issue: Референт местоимения αὐτῷ («ему»)
  choice: Сохранить местоимение «ему»
  alternative: Уточнить как «человеку» или «Адаму»
  rationale: Сам стих не называет референта; его явное уточнение устранило бы сохраняемую греческим текстом контекстуальную зависимость.
- issue: Смысл существования человеческих дел «в» духах
  choice: «чтобы в них совершалось всякое человеческое дело»
  alternative: «чтобы в них заключалось всякое дело человека»
  rationale: Выбранная формулировка сохраняет инструментально-сферическую образность ἐν αὐτοῖς и не превращает духов в буквальные вместилища.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис близок к греческому, но целевая конструкция сформулирована естественно для обычного читателя.
