  terminology: «Духи» — точная и устойчивая передача πνεύματα. «Ещё семь» приемлемо передаёт ἕτερα в его связи с ранее упомянутыми семью; референт «ему» следует оставить неуточнённым. «Человеческое дело» адекватно передаёт πᾶν ἔργον ἀνθρώπου.
