base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/007.yaml
  text: The sixth is the spirit of taste, by which eating of foods and drinks comes to be, and strength is built up in it, because in foods is the basis of strength.
translation:
  language: ru
  text: Шестой — дух вкуса, посредством которого происходит употребление пищи и напитков; в нём созидается сила, ибо в пище — основа силы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα γεύσεως
  choice: дух вкуса
  rationale: Формально и естественно передаёт родительную конструкцию, сохраняя антропологическую терминологию контекста.
- source_word: γίνεται βρῶσις βρωμάτων τε καὶ πομάτων
  choice: совершается принятие пищи и питья
  rationale: Передаёт процесс еды и питья без неестественного русского повтора «ядение яств»; πομάτων понято как напитки/питьё.
- source_word: ἰσχὺς ἐν αὐτῷ κτίζεται
  choice: в нём созидается сила
  rationale: Сохраняет местоименную неоднозначность ἐν αὐτῷ и образное значение κτίζεται — «строится, созидается», не подменяя его более причинным «благодаря ему».
- source_word: ὑπόστασις τῆς ἰσχύος
  choice: основа силы
  rationale: В данном предметном контексте ὑπόστασις обозначает основание или основу; более техническое «сущность» звучало бы чрезмерно философски.
theological_decisions:
- issue: Референт местоимения ἐν αὐτῷ
  choice: сохранено буквальное «в нём»
  alternative: «благодаря ему» или «в принятой пище»
  rationale: Греческое местоимение допускает некоторую неясность; перевод не должен без необходимости устранять её.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего наставительного текста. Выбрано «принятие пищи и питья» ради ясности и естественности; синтаксис сохранён компактным, а причинная связь передана прямо.
