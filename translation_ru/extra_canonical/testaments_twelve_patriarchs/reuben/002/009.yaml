source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Διὰ τοῦτο *ἔσχατόν ἐστι τῆς κτίσεως³¹ καὶ πρῶτον τῆς νεότητος, ὅτι *ἀγνοίας πεπλήρωται³², καὶ αὕτη τὸν νεώτερον³³ ὁδηγεῖ ὥσπερ³⁴ τυφλὸν ἐπὶ βόθρον καὶ ὡς κτῆνος ἐπὶ κρημνόν³⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/009.yaml
  text: Therefore this spirit is last in creation and first in youth, because it is filled with ignorance, and it leads the younger man like a blind man into a pit and like an animal over a cliff.
translation:
  language: ru
  text: Поэтому этот дух — последний в творении и первый в юности, ибо он исполнен неведения и ведёт того, кто моложе, словно слепого — в яму и словно животное — к обрыву.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσχατόν ἐστι τῆς κτίσεως
  choice: последний в творении
  rationale: Сохраняет краткую и несколько загадочную формулировку оригинала, не уточняя без текстового основания, идёт ли речь о порядке сотворения или месте среди творения.
- source_word: πρῶτον τῆς νεότητος
  choice: первый в юности
  rationale: Передаёт параллелизм с «последний в творении» и сохраняет смысл первенства или преобладания в период юности.
- source_word: ἀγνοίας πεπλήρωται
  choice: исполнен неведения
  rationale: «Неведение» точно передаёт ἀγνοία и соответствует достоинству контекста; причастная конструкция отражена естественной русской формой.
- source_word: τὸν νεώτερον
  choice: младшего
  rationale: Сохраняет сравнительное значение νεώτερον («более молодого», «младшего»), не заменяя его общим «юношу».
- source_word: ἐπὶ βόθρον
  choice: в яму
  rationale: Естественно передаёт направление движения к яме с подразумеваемым падением в неё.
- source_word: ὡς κτῆνος ἐπὶ κρημνόν
  choice: словно животное — к обрыву
  rationale: κτῆνος обозначает животное или скотину; нейтральное «животное» сохраняет сравнение без ненужной грубости. «К обрыву» не усиливает оригинал утверждением о падении через край.
theological_decisions:
- issue: Референт подразумеваемого субъекта в начальной фразе
  choice: этот дух
  alternative: опустить «дух» и написать «он»
  rationale: В греческом данном фрагменте субъект подразумевается контекстом, однако английский консультационный слой указывает на дух; явное «этот дух» делает русский стих самостоятельным и не снимает богословского напряжения.
- issue: Смысл противопоставления «последний в творении — первый в юности»
  choice: сохранить буквально-параллельную и неоднозначную формулировку
  alternative: истолковать как «создан последним, но первым проявляется в юности»
  rationale: Оригинал допускает подобное понимание, но прямо не формулирует его; перевод не должен превращать возможное толкование в текст.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Синтаксический параллелизм и два образных сравнения сохранены; архаизмы и конфессионально окрашенная терминология не используются.
