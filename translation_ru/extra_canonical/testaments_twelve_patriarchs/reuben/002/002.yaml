lexical_decisions:
- source_word: κατὰ τοῦ ἀνθρώπου
  choice: против человека
  rationale: Сохраняет направленность и враждебный оттенок греческого κατά с родительным падежом, не уточняя сверх текста, кем именно даны духи.
- source_word: αἱ κεφαλαὶ
  choice: начала
  rationale: В данном образном употреблении κεφαλαί может обозначать главные источники или исходные, управляющие начала; буквальное «главы» по-русски здесь не передаёт смысла естественно.
- source_word: τῶν ἔργων τοῦ νεωτερισμοῦ
  choice: дел юности
  rationale: 'Передаёт конструкцию буквально по смысловым компонентам и сохраняет неоднозначность: речь может идти о поступках, свойственных юному возрасту, особенно о юношеских прегрешениях.'
theological_decisions:
- issue: Кем и с какой целью были даны семь духов
  choice: Сохранён безличный оборот «были даны»
  alternative: «Бог дал» или «были посланы»
  rationale: Греческий текст не называет действующего лица; богословское уточнение внесло бы отсутствующую в источнике мысль.
- issue: Характер отношения духов к человеку
  choice: «против человека»
  alternative: «человеку» или «для человека»
  rationale: Формулировка сохраняет напряжённость κατὰ τοῦ ἀνθρώπου и не смягчает возможный враждебный смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Итак» передаёт οὖν и связывает стих с предшествующим рассуждением; точка с запятой сохраняет тесную логическую связь двух частей.
