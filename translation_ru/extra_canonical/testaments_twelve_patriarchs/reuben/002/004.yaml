source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Πρῶτον πνεῦμα ζωῆς, μεθ’ ἧς ἡ σύστασις¹⁶ κτίζεται. Δεύτερον πνεῦμα ὁράσεως, μεθ’ ἧς γίνεται ἐπιθυμία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/004.yaml
  text: The first is the spirit of life, with which the constitution is formed. The second is the spirit of sight, with which desire arises.
translation:
  language: ru
  text: Первый — дух жизни, с которым создаётся состав. Второй — дух зрения, с которым возникает желание.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα ζωῆς
  choice: дух жизни
  rationale: Прямо передаёт греческое выражение и сохраняет последовательность перечисляемых «духов».
- source_word: σύστασις
  choice: телесный состав
  rationale: В контексте формирования человека σύστασις обозначает его устроение или состав; добавление «телесный» делает смысл естественным по-русски, не заменяя понятие более узким анатомическим термином.
- source_word: πνεῦμα ὁράσεως
  choice: дух зрения
  rationale: Сохраняет буквальную связь ὅρασις со способностью видеть и параллелизм с «духом жизни».
- source_word: ἐπιθυμία
  choice: желание
  rationale: Нейтрально передаёт широкий смысл греческого слова, не сужая его до похоти или греховного влечения.
- source_word: μεθ’ ἧς
  choice: вместе с которым
  rationale: Передаёт значение сопровождения в μετὰ с родительным падежом и сохраняет двусмысленность отношения, не превращая его однозначно в инструментальное «посредством которого».
theological_decisions:
- issue: Нравственная окраска ἐπιθυμία
  choice: желание
  alternative: вожделение
  rationale: Само греческое слово здесь не требует исключительно отрицательного или сексуального смысла; нейтральный перевод сохраняет смысловую открытость.
- issue: Характер связи духа с формированием и желанием
  choice: вместе с которым
  alternative: посредством которого
  rationale: Греческое μεθ’ ἧς буквально выражает сопутствие; перевод не должен без необходимости утверждать строгую причинность или инструментальность.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного характера перечня. Повтор конструкции «вместе с которым» воспроизводит синтаксический параллелизм греческого текста. Местоимение согласовано с русским словом «дух», хотя греческое относительное местоимение формально согласовано с πνεῦμα как существительным среднего рода.
