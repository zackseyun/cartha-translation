lexical_decisions:
- source_word: Πέμπτον πνεῦμα
  choice: Пятый — дух
  rationale: Сохранена эллиптическая нумерация греческого текста; связка и подразумеваемое слово «есть» естественно переданы тире.
- source_word: λαλιᾶς
  choice: речи
  rationale: «Речь» точно и естественно обозначает способность или проявление говорения в данном перечне.
- source_word: μεθ’ ἧς
  choice: через которую
  rationale: Передаёт инструментальное значение сочетания μετά с родительным; местоимение согласовано с ближайшим существительным «речь».
- source_word: γίνεται γνῶσις
  choice: возникает знание
  rationale: Сохраняет процессуальный смысл γίνεται и не усиливает его до значения «приобретается» или «передаётся».
