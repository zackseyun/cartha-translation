  source_fidelity: 'Перевод точно передаёт структуру греческого текста: «дух деторождения и соития» соответствует πνεῦμα σπορᾶς καὶ συνουσίας, а необычный образ συνέρχονται ἁμαρτίαι сохранён без неоправданного превращения в утверждение о происхождении грехов. «Через любовь к наслаждениям» адекватно передаёт διὰ τῆς φιληδονίας.'
