  text: Ἕβδομον πνεῦμα σπορᾶς καὶ συνουσίας²⁷, μεθ’ ἧς συνέρχονται²⁸ διὰ τῆς φιληδονίας²⁹ ἁμαρτίαι³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/008.yaml
  text: The seventh is the spirit of procreation and union, through which sins come together through love of pleasure.
translation:
  language: ru
  text: Седьмой — дух деторождения и соития, с которым через любовь к наслаждениям сходятся грехи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπορᾶς
  choice: деторождения
  rationale: Передаёт здесь значение порождения потомства, а не буквального «сеяния»; соответствует связи слова с συνουσία и не сводит выражение только к семени.
- source_word: συνουσίας
  choice: соития
  rationale: В данном контексте обозначает половое соединение; «соитие» точно, нейтрально и уместно в dignified literary register.
- source_word: συνέρχονται
  choice: сходятся
  rationale: Сохраняет образ совместного схождения грехов и не уточняет без основания, каким именно образом они возникают или действуют.
- source_word: φιληδονίας
  choice: любовь к наслаждениям
  rationale: Прямо передаёт составное значение «любовь к удовольствию/наслаждению» современным и понятным языком, не усиливая его до более оценочного «сластолюбия».
theological_decisions:
- issue: Связь грехов с седьмым духом
  choice: с которым ... сходятся грехи
  alternative: через который возникают грехи
  rationale: Греческий текст говорит о совместном схождении (συνέρχονται), а не прямо о причинном возникновении; перевод сохраняет необычную формулировку и не делает дух однозначной причиной грехов.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным звучанием. Синтаксическая необычность образа «грехи сходятся» сохранена как особенность оригинала; архаизмы и конфессиональная терминология не добавлены.
