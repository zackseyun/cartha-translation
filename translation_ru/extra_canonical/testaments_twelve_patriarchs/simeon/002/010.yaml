  text: Καὶ *ὁ Ῥουβὶμ ἀκούσας ταῦτα⁶⁴ ἐλυπήθη⁶⁵. ἤθελε⁶⁶ γὰρ αὐτὸν⁶⁷ ἀπαγαγεῖν⁶⁸ πρὸς τὸν πατέρα⁶⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/010.yaml
  text: And Reuben, hearing these things, was grieved, for he wanted to bring him safely back to his father.
translation:
  language: ru
  text: Рувим, услышав это, опечалился, потому что хотел отвести его к отцу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας ταῦτα
  choice: услышав это
  rationale: Деепричастный оборот прямо и естественно передаёт греческое обстоятельственное причастие; ταῦτα по-русски в данном контексте идиоматично выражено единственным числом «это».
- source_word: ἐλυπήθη
  choice: опечалился
  rationale: Передаёт внутреннюю скорбь или огорчение без излишнего усиления.
- source_word: ἤθελε
  choice: хотел
  rationale: Прямое соответствие значению намерения или желания в имперфекте.
- source_word: ἀπαγαγεῖν
  choice: отвести
  rationale: Глагол означает «увести/отвести»; идея безопасного возвращения, присутствующая в английском консультационном тексте, самим данным греческим глаголом явно не выражена.
- source_word: πρὸς τὸν πατέρα
  choice: к отцу
  rationale: Сохраняет направительное значение πρός; притяжательное местоимение в греческом отсутствует, поэтому не добавлено.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; изложение сдержанное и dignified. Синтаксис близок к греческому, но естественен по-русски. Неявные в исходном тексте значения «безопасно», «назад» и притяжательное «его» перед словом «отец» не добавлены.
