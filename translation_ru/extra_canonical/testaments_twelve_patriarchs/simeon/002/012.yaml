  text: Καίγε συνετρίβει με *ὁ Κύριος⁷⁸ καὶ ἐκώλυσεν δράσιν⁷⁹ *ἀπʼ ἐμοῦ⁸⁰. *ὅτι ἡ χείρ μου ἡ δεξιὰ ἡμίξηρος γέγονεν ἐπὶ ἡμέρας ἑπτά⁸¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/012.yaml
  text: And the Lord crushed me and held back action from me, for my right hand became half-withered for seven days.
translation:
  language: ru
  text: И Господь сокрушал меня и не дал мне действовать, потому что моя правая рука на семь дней частично отсохла.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «стала полусухой»; редкое греческое слово образно описывает частичное поражение руки.'
    reason: Поясняет необычное ἡμίξηρος, сохраняя образность и не навязывая конкретный медицинский диагноз.
lexical_decisions:
- source_word: συνετρίβει
  choice: сокрушил
  rationale: Глагол συντρίβω означает «разбивать, сокрушать»; здесь он передаёт тяжёлое Божье воздействие на Симеона. Совершенный вид по-русски естественно представляет событие как целое, хотя греческий имперфект может подчёркивать его протяжённость.
- source_word: ἐκώλυσεν δράσιν ἀπʼ ἐμοῦ
  choice: не дал мне действовать
  rationale: Буквально речь идёт о воспрепятствовании действию со стороны говорящего. Такой перевод сохраняет смысл и звучит естественнее, чем калька «удержал действие от меня».
- source_word: ἡμίξηρος
  choice: наполовину отсохла
  rationale: Редкое сложное прилагательное буквально означает «полусухая, наполовину иссохшая» и описывает частичное поражение руки; «отсохла» является понятным русским обозначением утраты её нормальной силы или подвижности.
theological_decisions:
- issue: Прямое действие Господа как причина наказания и ограничения Симеона
  choice: 'Сохранено прямое подлежащее «Господь»: «Господь сокрушил меня и не дал мне действовать»'
  alternative: Смягчить причинность формулировкой о том, что Господь лишь допустил случившееся
  rationale: Греческий текст прямо называет Господа субъектом обоих глаголов; перевод не должен ослаблять это утверждение или разрешать заключённое в нём богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с кратким, достойным повествовательным строем. Формулировка «не дал мне действовать» понятна широкому читателю, а «наполовину отсохла» сохраняет телесный образ греческого текста.
