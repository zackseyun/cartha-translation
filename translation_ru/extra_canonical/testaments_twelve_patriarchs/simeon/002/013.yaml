source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ἔγνων, τέκνα⁸², ὅτι *περὶ Ἰωσὴφ⁸³ *τοῦτό μοι συνέβη⁸⁴. καὶ⁸⁵ μετανοήσας ἔκλαυσα⁸⁶ καὶ⁸⁷ ηὐξάμην *Κυρίῳ τῷ Θεῷ⁸⁸ ἵνα⁸⁹ *ἀποκατασταθῇ ἡ χείρ μου⁹⁰ καὶ⁹¹ ἀποσχῶ⁹² ἀπὸ *παντὸς μολυσμοῦ καὶ φθόνου⁹³ Γκαὶ ἀπὸ πάσης ἀφροσύνης⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/013.yaml
  text: And I knew, my children, that this happened to me because of Joseph. And after repenting, I wept and prayed to the Lord God that my hand might be restored, and that I might abstain from every defilement and envy and from all foolishness.
translation:
  language: ru
  text: И я понял, дети мои, что это случилось со мной из-за Иосифа. Раскаявшись, я плакал и молился Господу Богу, чтобы рука моя исцелилась и чтобы я воздерживался от всякой скверны, зависти и всякого безрассудства.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ Ἰωσήφ
  choice: из-за Иосифа
  rationale: В данном контексте περί указывает на связь случившегося с отношением Симеона к Иосифу; краткая формулировка сохраняет некоторую смысловую открытость греческого выражения и не добавляет не названного в стихе поступка.
- source_word: μετανοήσας
  choice: раскаявшись
  rationale: Передаёт не просто перемену мнения, а покаянный поворот, подтверждаемый последующими плачем и молитвой.
- source_word: ἀποκατασταθῇ ἡ χείρ μου
  choice: чтобы рука моя исцелилась
  rationale: Глагол означает восстановление прежнего состояния; применительно к руке естественное русское выражение — «исцелилась».
- source_word: παντὸς μολυσμοῦ
  choice: от всякой скверны
  rationale: «Скверна» передаёт нравственно-религиозный оттенок μολυσμός и сохраняет достоинство завещательного наставления.
- source_word: πάσης ἀφροσύνης
  choice: всякого безрассудства
  rationale: Передаёт отсутствие здравого рассуждения без чрезмерно разговорного или оскорбительного оттенка.
theological_decisions:
- issue: Причинная связь между случившимся и Иосифом
  choice: «это случилось со мной из-за Иосифа»
  alternative: «это случилось со мной в связи с Иосифом»
  rationale: Контекст покаяния поддерживает причинное прочтение, но перевод не уточняет, был ли причиной сам Иосиф или проступок Симеона против него, поскольку греческий текст этого прямо не формулирует.
- issue: Смысл μετανοήσας
  choice: «раскаявшись»
  alternative: «изменив своё решение»
  rationale: Плач, молитва и намерение оставить скверну, зависть и безрассудство указывают на нравственное раскаяние, а не только на интеллектуальную перемену.
translation_notes:
  register: Современный литературный русский язык с dignified, но понятным библейско-завещательным звучанием. Обращение «дети мои» естественно для наставительной речи патриарха; синтаксис сохранён ясным и близким к последовательности греческого текста.
