lexical_decisions:
- source_word: Ἐν γὰρ τῷ καιρῷ τῆς νεότητός μου
  choice: Ведь в юности
  rationale: Передаёт причинно-пояснительное γάρ и естественно выражает временную конструкцию без тяжеловесного буквального оборота «во время моей юности».
- source_word: πολλὰ ἐζήλωσα
  choice: сильно завидовал
  rationale: В данном контексте ζηλόω обозначает зависть или ревность к Иосифу; наречное πολλά усиливает чувство.
- source_word: παρὰ πάντας
  choice: больше всех
  rationale: Сравнительный оборот указывает, что отец предпочитал Иосифа всем остальным; русский оборот сохраняет естественность и не уточняет сверх текста, кого именно включает «всех».
