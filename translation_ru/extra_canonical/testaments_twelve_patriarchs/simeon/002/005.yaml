  terminology: «Мужество» — точный и современный эквивалент ἀνδρεία. «Всевышний» соответствует ὕψιστος и сохраняет возвышенный религиозный регистр без конфессионального уточнения. «Душа и тело» передаёт исходную пару ψυχαῖς καὶ σώμασιν без интерпретации.
