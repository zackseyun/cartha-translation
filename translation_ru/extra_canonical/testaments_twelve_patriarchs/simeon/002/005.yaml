base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/005.yaml
  text: For courage also is given by the Most High to men in soul and body.
translation:
  language: ru
  text: Ведь и мужество даётся людям Всевышним — в душе и теле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνδρεία
  choice: мужество
  rationale: Передаёт доблесть и внутреннюю стойкость; в данном контексте естественнее и точнее, чем более узкое «храбрость».
- source_word: ἀπὸ ὑψίστου
  choice: Всевышним
  rationale: Греческая конструкция буквально указывает на источник («от Всевышнего»), но при страдательном δίδοται естественно по-русски передаётся творительным падежом, сохраняя Всевышнего как подателя.
- source_word: ἐν ψυχαῖς καὶ σώμασιν
  choice: в душе и теле
  rationale: Сохраняет обе сферы человеческого бытия без добавочного толкования; множественное число в греческом согласуется с множественным «людям», тогда как русский идиоматически употребляет распределительное единственное число.
theological_decisions:
- issue: Всевышний как источник мужества
  choice: «даётся людям Всевышним»
  alternative: «приходит к людям от Всевышнего»
  rationale: Сохранён страдательный смысл δίδοται и прямое утверждение о божественном даровании без уточнения способа действия.
- issue: Соотношение души и тела
  choice: «в душе и теле»
  alternative: «душе и телу»
  rationale: Предлог ἐν обозначает область проявления или пребывания дара; перевод не разрешает дополнительно, каким именно образом мужество относится к каждой сфере.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным звучанием. Начальное «Ведь и» передаёт связующий и пояснительный характер Ἐπειδὴ καὶ. Тире облегчает восприятие обстоятельственного оборота и не добавляет нового смыслового отношения.
