review_pass:
  verdict: revise
  source_fidelity: 'В целом переданы все основные элементы греческого текста: раздельные пути Симеона и Рувима, мазь для стад, место хранения припасов и продажа не названного местоимением лица. Однако ἐλθὼν τοῖς Ἰσμαηλίταις — обстоятельное причастие с обозначением тех, к кому пришёл Иуда; «пришёл и продал его измаильтянам» оставляет приход без дополнения и ослабляет эту связь.'
  naturalness: Текст в целом естественен для современного литературного русского. Перестановка приложения «мой брат» и деепричастный оборот сделают последнюю часть одновременно яснее и ближе к синтаксису оригинала.
  terminology: Сихем, Рувим, Дофан, Иуда и измаильтяне употреблены в нормативных библейских формах. «Мазь», «стада», «припасы» и «запасы» уместны; референт местоимения «его» не следует заменять именем Иосифа.
  issues:
  - severity: low
    issue: Не вполне передана связь ἐλθὼν τοῖς Ἰσμαηλίταις.
    rationale: В греческом причастие «придя» связано с дательным «к измаильтянам». Вариант «пришёл и продал его измаильтянам» не показывает, к кому именно пришёл Иуда. «Придя к измаильтянам, продал им его» сохраняет оба отношения без добавления имени объекта продажи.
  revised_text: Ведь когда я пошёл в Сихем, чтобы отнести мазь для наших стад, а Рувим — в Дофан, где находились необходимые нам припасы и все наши запасы, Иуда, мой брат, придя к измаильтянам, продал им его.
