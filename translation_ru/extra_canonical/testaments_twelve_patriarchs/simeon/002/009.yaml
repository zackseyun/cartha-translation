base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/009.yaml
  text: For when I went to Shechem to bring ointment for our flocks, and Reuben to Dothan, where our supplies and all our stores were, Judah my brother sold him to the Ishmaelites.
translation:
  language: ru
  text: Ведь когда я пошёл в Сихем, чтобы отнести мазь для наших стад, а Рувим — в Дофан, где находились необходимые нам припасы и все наши запасы, Иуда, мой брат, придя к измаильтянам, продал им его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν Σικίμοις
  choice: в Сихем
  rationale: Хотя греческая конструкция буквально допускает «в Сихеме», глагол движения и цель путешествия требуют в естественном русском обозначения направления.
- source_word: ἄλειμμα
  choice: мазь
  rationale: Сохранено прямое значение греческого слова «мазь, средство для умащения» без неподтверждённого уточнения состава или назначения.
- source_word: τοῖς ποιμνίοις
  choice: для наших стад
  rationale: Дательный передан как указание назначения; притяжательное «наших» естественно следует из контекста и согласуется с дальнейшим ἡμῖν.
- source_word: τὰ ἐγχρῄζοντα ἡμῖν καὶ πᾶσα ἡ ἀπόθεσις
  choice: необходимые нам припасы и все наши запасы
  rationale: Передаёт различие между нужными вещами/припасами и совокупностью отложенных на хранение запасов, избегая буквальной, но неестественной «кладовой».
- source_word: ἐλθὼν
  choice: пришёл и
  rationale: Греческое обстоятельственное причастие передано последовательными личными формами, что ясно и естественно по-русски и не добавляет причинной связи.
- source_word: τοῖς Ἰσμαηλίταις
  choice: измаильтянам
  rationale: Устоявшаяся русская библейская форма этнонима.
theological_decisions:
- issue: Неуказанный объект в выражении ἐπώλησεν αὐτόν
  choice: продал его
  alternative: продал Иосифа
  rationale: Сохранена местоименная форма источника; имя Иосифа не добавлено, поскольку референт определяется предшествующим контекстом.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного завещательного текста. Синтаксис слегка упрощён ради ясности, но последовательность действий и неоднозначность местоименного объекта сохранены.
