  verdict: revise
  source_fidelity: Греческое обращение передаёт призыв слушать, затем самоидентификацию говорящего как Симеона, их отца, и обещание возвестить то, что у него в сердце. В черновике смысл последней части передан точно, но «Слушайте ... Симеона ... и я возвещу» создаёт в русском несогласованную смену лица и воспринимается как призыв слушать третье лицо.
  naturalness: Форма «Слушайте Симеона, отца вашего, и я...» грамматически и стилистически неестественна для современного литературного русского. Ясная конструкция с «меня» и приложением «я, Симеон, ваш отец» естественно передаёт подразумеваемую самоидентификацию говорящего.
  terminology: «Возвещу» уместно для умеренно торжественного завещательного регистра. Оборот «то, что у меня на сердце» сохраняет образ оригинала и не вносит истолкования.
