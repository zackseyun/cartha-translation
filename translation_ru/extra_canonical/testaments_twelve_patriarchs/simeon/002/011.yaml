  text: But when I heard this, I was very angry with Judah, because he had let him go alive; and for five months I remained angry with him.
translation:
  language: ru
  text: Я же, услышав это, сильно разгневался на Иуду за то, что он отпустил его живым, и гневался на него пять месяцев.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθην ἐπὶ τὸν Ἰούδαν σφόδρα
  choice: сильно разгневался на Иуду
  rationale: Передаёт интенсивность σφόδρα и естественное для современного русского языка управление глагола «разгневаться».
- source_word: ζῶντα αὐτὸν ἀπέλυσεν
  choice: отпустил его живым
  rationale: Сохраняет эмфатически значимое указание, что он был отпущен живым, без добавочного истолкования.
- source_word: ἐποίησα μῆνας πέντε ὀργιζόμενος ἐπʼ αὐτῷ
  choice: гневался на него пять месяцев
  rationale: Естественно передаёт греческую перифразу длительности, сохраняя продолжительный характер гнева.
