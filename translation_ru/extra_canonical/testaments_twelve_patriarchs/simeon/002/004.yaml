  text: Ἡ γὰρ καρδία μου ἦν σκληρά, καὶ *τὰ ἤπατά¹⁵ μου ἀκίνητα καὶ τὰ σπλάγχνα μου ἀσυμπαθῆ¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/004.yaml
  text: For my heart was hard, and my liver unmoved, and my inward parts without compassion.
translation:
  language: ru
  text: Ибо сердце моё было жестоким, печень моя — неподвижной, а внутренности мои — лишёнными сострадания.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδία
  choice: сердце
  rationale: Прямой и естественный эквивалент, сохраняющий образ внутреннего средоточия чувств и воли.
- source_word: τὰ ἤπατα
  choice: печень
  rationale: Сохранён конкретный телесный образ греческого текста; форма множественного числа передаёт собирательное обозначение печени и по-русски естественно выражается единственным числом.
- source_word: ἀκίνητα
  choice: непреклонна
  rationale: Буквально слово означает «неподвижна», но в данном нравственно-эмоциональном контексте передаёт внутреннюю неподатливость; «непреклонна» сохраняет связь с предшествующей жестокостью сердца.
- source_word: σπλάγχνα
  choice: внутренности
  rationale: Сохранён древний телесный образ глубоких чувств, без замены его более отвлечённым словом «душа».
- source_word: ἀσυμπαθῆ
  choice: не знали сострадания
  rationale: Естественная русская передача значения «лишённые сочувствия, несострадательные» с сохранением нравственной силы высказывания.
theological_decisions:
- issue: Телесные органы как средоточие нравственных чувств
  choice: Сохранить образы сердца, печени и внутренностей
  alternative: Обобщить как «всё моё существо было бесчувственно»
  rationale: Конкретная антропологическая образность принадлежит исходному тексту и не должна устраняться ради привычной современной формулировки.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Параллельное построение трёх частей сохранено; связка во второй части опущена и обозначена тире ради естественного русского ритма.
