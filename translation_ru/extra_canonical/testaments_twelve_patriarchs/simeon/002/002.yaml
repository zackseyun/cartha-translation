base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/002.yaml
  text: I was born from Jacob, the second son to my father, and Leah my mother called me Simeon, because the Lord heard her petition.
translation:
  language: ru
  text: Я родился у Иакова, моего отца, вторым сыном, и моя мать Лия назвала меня Симеоном[a], потому что Господь услышал её моление.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Симеон» связано с еврейским глаголом «слышать»; ср. Быт. 29:33.
    reason: Поясняет игру слов между именем Симеона и тем, что Господь «услышал» моление Лии, которая не очевидна в русском переводе.
lexical_decisions:
- source_word: ἐγεννήθην ἐξ Ἰακώβ
  choice: Я родился у Иакова
  rationale: Естественная русская передача происхождения от Иакова; сохраняет смысл греческого ἐξ без неестественного буквального «из Иакова».
- source_word: υἱὸς δεύτερος τῷ πατρὶ μου
  choice: вторым сыном
  rationale: Передаёт положение Симеона как второго сына своего отца; упоминание Иакова в той же фразе делает повтор «моего отца» избыточным по-русски.
- source_word: τῆς δεήσεως αὐτῆς
  choice: её моление
  rationale: «Моление» точно передаёт настойчивую просьбу, обращённую к Богу, и сохраняет возвышенный, но понятный регистр.
theological_decisions:
- issue: Обозначение Бога словом Κύριος без артикля
  choice: Господь
  alternative: Господь Бог
  rationale: Перевод «Господь» точно следует греческому тексту и не добавляет отсутствующее в нём слово «Бог».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис сделан естественным для русского читателя, при этом последовательность мысли и причинная связь исходного текста сохранены.
