  text: For I became very strong; I did not shrink from any deed, nor was I afraid of anything.
translation:
  language: ru
  text: Ибо я стал весьма силён, не робел ни перед каким делом и ничего не боялся.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δυνατὸς ... ἐγενόμην
  choice: я стал весьма силён
  rationale: Передаёт становление, выраженное ἐγενόμην, и усиление σφόδρα; краткая именная форма естественна для современного литературного русского языка.
- source_word: οὐκ ἐδειλίασα πρᾶξιν
  choice: не отступал ни перед каким делом
  rationale: δειλιάω означает робеть, проявлять малодушие; в сочетании с πρᾶξιν естественно передаётся как отсутствие робости перед каким-либо поступком или делом. «Не отступал» сохраняет деятельный контекст, не добавляя конфессионального смысла.
- source_word: οὐδὲ ἐφοβήθην ἀπὸ παντὸς πράγματος
  choice: и ничего не боялся
  rationale: 'Русское обобщённое отрицание естественно передаёт греческое отрицание с παντός: страх не вызывало ничто. Буквальное «не боялся от всякого дела/обстоятельства» по-русски неестественно.'
