base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/007.yaml
  text: And I set my liver against him so as to kill him, because the ruler of deceit and the spirit of jealousy blinded my mind, so that I did not regard him as a brother, nor even spare Jacob my father.
translation:
  language: ru
  text: И я всем нутром восстал против него, чтобы убить его[a], потому что властитель обмана и дух зависти[b] ослепили мой разум, так что я не видел в нём брата и не щадил даже моего отца Иакова.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «я утвердил против него мои печени, чтобы убить его». В древней образной речи печень считалась средоточием сильных чувств и страстей.'
    reason: Поясняет сохранённый в адаптированной форме телесный идиоматический образ.
  - marker: b
    text: Греческое ζῆλος может означать ревность, зависть или пыл; здесь по контексту выбрано «зависть».
    reason: Фиксирует реальную лексическую неоднозначность исходного слова.
lexical_decisions:
- source_word: ἐστήριξα ἐπʼ αὐτὸν τὰ ἤπατά μου
  choice: я всем нутром восстал против него
  rationale: Буквально речь идёт о «печенях», которые в древней антропологии связывались с внутренними чувствами и страстями. Русское «всем нутром восстал» сохраняет телесный образ и передаёт решительную враждебную настроенность без неестественного буквального оборота.
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: властитель обмана
  rationale: «Властитель» передаёт ἄρχων, а «обман» — контекстуальное значение πλάνη как вводящей в заблуждение силы; выражение не отождествляется с каким-либо названным персонажем сверх того, что сказано в тексте.
- source_word: τὸ πνεῦμα τοῦ ζήλου
  choice: дух зависти
  rationale: В данном повествовательном контексте ζῆλος обозначает пагубную завистливую ревность Симеона к брату. «Зависть» яснее для современного читателя, тогда как «ревность» может ошибочно восприниматься как положительное усердие.
- source_word: μὴ προσέχειν αὐτῷ ὡς ἀδελφῷ
  choice: так что я не видел в нём брата
  rationale: Передаёт результат ослепления и смысл «не относиться к нему с вниманием/не считаться с ним как с братом» естественным современным русским оборотом.
- source_word: μηδὲ φείσασθαι τῷ πατρί μου Ἰακώβ
  choice: и не щадил даже моего отца Иакова
  rationale: 'Сохраняет усилительный смысл μηδέ: в своей вражде говорящий не пощадил даже собственного отца.'
theological_decisions:
- issue: Личностный или обобщённый смысл выражения «властитель обмана»
  choice: Сохранить личностно звучащий титул без добавления имени или отождествления
  alternative: Назвать его сатаной, Велиаром либо представить выражение как безличную силу
  rationale: Греческий текст использует определённый личностный титул ὁ ἄρχων, но в этом стихе не называет его; перевод не должен устранять эту недосказанность.
- issue: Соотношение «властителя обмана» и «духа зависти»
  choice: Передать оба выражения как два грамматически соединённых действующих начала
  alternative: Слить их в одну сущность или истолковать одно как пояснение другого
  rationale: Союз καί допускает тесную связь, но текст прямо не разъясняет, тождественны ли они; перевод сохраняет напряжение и не навязывает систематизацию.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного исповедального повествования. Телесная метафора сохранена в понятном русском идиоматическом виде; синтаксис сделан плавным, без устранения личностной и богословской недосказанности оригинала. Позднейшая ревизия, содержащая фразы «были его богом» и «Бог наших отцов послал ангела», не принята, поскольку этих слов нет в предоставленном греческом тексте данного стиха.
