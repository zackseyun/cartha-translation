base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/014.yaml
  text: For I knew that I had conceived an evil deed before the Lord and Jacob my father concerning Joseph my brother, being envious of him.
translation:
  language: ru
  text: Ибо я понял, что замыслил злое дело пред Господом и Иаковом, отцом моим, в отношении Иосифа, брата моего, позавидовав ему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔγνων
  choice: я понял
  rationale: Передаёт осознание совершённого внутреннего проступка; в данном контексте естественнее современного русского «я узнал».
- source_word: πονηρὸν πρᾶγμα
  choice: злое дело
  rationale: Сохраняет нравственную оценку πονηρόν и предметность πρᾶγμα, не подменяя задуманное уже совершённым поступком.
- source_word: ἐνεθυμήθην
  choice: замыслил
  rationale: Передаёт внутреннее обдумывание и возникновение злого намерения.
- source_word: ἐνώπιον κυρίου καὶ Ἰακὼβ τοῦ πατρός μου
  choice: пред Господом и Иаковом, отцом моим
  rationale: Формально сохраняет единое управление ἐνώπιον и не добавляет отсутствующего в греческом значения «против Иакова».
- source_word: διὰ Ἰωσὴφ τὸν ἀδελφόν μου
  choice: в отношении Иосифа, брата моего
  rationale: Передаёт контекстуальное значение διά как указание на лицо, которого касался злой замысел, не усиливая причинный оттенок.
- source_word: φθονήσας αὐτῷ
  choice: позавидовав ему
  rationale: Сохраняет причастную конструкцию и прямо называет зависть Симеона к Иосифу.
theological_decisions:
- issue: Отношение злого замысла к Господу и Иакову
  choice: Сохранено буквальное «пред Господом и Иаковом»
  alternative: «пред Господом и против Иакова, отца моего»
  rationale: Предлог «против» отсутствует в исходном греческом тексте; его добавление устранило бы подлинную синтаксическую напряжённость и усилило бы обвинительный смысл.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Оборот «пред Господом» сохранён как узнаваемый сакральный регистр; остальная фраза изложена ясно, без конфессионально обусловленных уточнений.
