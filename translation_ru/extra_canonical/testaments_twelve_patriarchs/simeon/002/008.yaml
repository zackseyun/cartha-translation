  text: But his God and the God of our fathers sent his angel and rescued him from my hands.
translation:
  language: ru
  text: Но его Бог и Бог наших отцов послал Своего ангела и спас его из моих рук.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλε
  choice: послал
  rationale: Прямое и естественное соответствие аористу глагола ἀποστέλλω.
- source_word: τὸν ἄγγελον αὐτοῦ
  choice: Своего ангела
  rationale: Возвратное притяжательное местоимение естественно указывает на Бога как подлежащее; слово «ангел» сохраняет обычное значение ἄγγελος в данном контексте.
- source_word: ἐρρύσατο
  choice: спас
  rationale: Передаёт избавление от непосредственной опасности; в современном русском звучит естественнее, чем более буквальное «избавил», при сохранении смысла.
- source_word: ἐκ τῶν χειρῶν μου
  choice: из моих рук
  rationale: Сохранён исходный образ власти и угрозы со стороны говорящего.
theological_decisions:
- issue: Соотношение выражений «его Бог» и «Бог наших отцов»
  choice: Сохранено соединение через «и» без пояснения тождества или различия
  alternative: «его Бог — Бог наших отцов»
  rationale: Греческий текст повторяет артикль и союз καί; перевод не должен устранять возможный риторический оттенок или превращать конструкцию в явное отождествление.
translation_notes:
  register: Современный литературный русский язык; синтаксис близок к греческому, но естественен и понятен. Заглавная буква в «Своего» употреблена как традиционное уважительное обозначение принадлежности Богу, не изменяющее смысла.
