base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005.yaml
  text: 'Therefore Joseph was handsome in form and beautiful in appearance, because nothing evil dwelt in him; for the face reveals the turmoil of the spirit.


    And now, my children, make your hearts good before the Lord, and make your ways straight before men, and you will be finding favor before the Lord and men.


    Guard yourselves, then, from sexual immorality, because sexual immorality is the mother of evils, separating from God and drawing near to Beliar.


    For I have seen in the writing of Enoch that your sons will be corrupted in sexual immorality, and they will wrong the sons of Levi with the sword.


    But they will not be able to stand against Levi, because he will fight the Lord’s war and will defeat your whole host.


    And they will be few in number, being divided in Levi and in Judah, and none from among you will be for leadership, just as our father also prophesied in his blessings.'
translation:
  language: ru
  text: '5:1 Поэтому Иосиф был красив обликом и прекрасен на вид, потому что в нём не обитало никакого зла; ведь лицо выдаёт смятение духа.


    5:2 И теперь, дети мои, сделайте сердца ваши добрыми перед Господом и выпрямите пути ваши перед людьми — и обретёте благоволение перед Господом и людьми.


    5:3 Итак, берегитесь разврата, потому что разврат — мать всех зол: он отдаляет от Бога и приближает к Велиару.


    5:4 Ведь я видел в письменном тексте Еноха, что ваши сыновья растлятся в разврате и с мечом причинят зло сыновьям Левия.


    5:5 Но они не смогут устоять против Левия, потому что он будет сражаться в войне Господа и победит всё ваше войско.[a]


    5:6 И будут они малочисленны, распределяясь среди Левия и Иуды; и никто из вас не станет правителем, как и пророчествовал наш отец в своих благословениях.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово, переведённое как «всё», в греческом издании заключено в угловые скобки и потому текстуально не вполне уверенно.
    reason: Угловые скобки вокруг πᾶσαν отмечают редакционную неуверенность; от этого зависит, относится ли предсказанная победа ко всему войску.
  - marker: b
    text: 'Греческая фраза о малочисленности и распределении «в Левии и в Иуде» синтаксически трудна. Возможен также перевод: «они будут малочисленны, разделяясь в Левии и Иуде».'
    reason: Примечание сохраняет неоднозначность ὀλιγοστοί ἐπιμεριζόμενοι ἐν τῷ Λευὶ καὶ ἐν τῷ Ἰούδᾳ и предупреждает, что основной перевод не устраняет её.
lexical_decisions:
- source_word: ὡραῖος τῷ εἴδει, καὶ καλὸς τῇ ὄψει
  choice: красив станом и прекрасен лицом
  rationale: Передаёт различие между телесным обликом и видимым выражением лица естественным, dignified русским языком.
- source_word: τῆς ταραχῆς τοῦ πνεύματος
  choice: смятение духа
  rationale: Сохраняет внутреннюю, духовно-психическую неоднозначность πνεῦμα и смысл беспокойства или возмущения в ταραχή.
- source_word: Ἀγαθύνατε τὰς καρδίας ὑμῶν
  choice: сделайте сердца ваши добрыми
  rationale: Формально близко к каузативному глаголу и не подменяет нравственное наставление более узким понятием очищения.
- source_word: εὐθύνατε τὰς ὁδοὺς ὑμῶν
  choice: выпрямите пути ваши
  rationale: Сохраняет библейскую метафору прямых путей и параллелизм стиха.
- source_word: πορνεία
  choice: разврат
  rationale: В данном нравоучительном контексте обозначает половую распущенность; «разврат» звучит естественно и сохраняет широкий охват термина.
- source_word: Βελίαρ
  choice: Велиар
  rationale: Сохраняет форму имени, представленную греческим Βελίαρ, не отождествляя её пояснительно с иным наименованием.
- source_word: ἐν χαρακτῆρι γραφῆς Ἐνώχ
  choice: в письменах Еноха
  rationale: Передаёт ссылку на записанное откровение Еноха без тяжеловесного буквального «в начертании писания».
- source_word: ἀδικήσουσιν ἐν ῥομφαίᾳ
  choice: с мечом причинят зло
  rationale: Сохраняет широкий смысл ἀδικέω и инструментальное значение ἐν ῥομφαίᾳ, не уточняя сверх текста характер нападения.
- source_word: πόλεμον Κυρίου πολεμήσει
  choice: будет вести войну Господа
  rationale: 'Сохраняет генитивную неоднозначность: это война, принадлежащая Господу или ведущаяся ради Него, без превращения в прямое утверждение, что Левий воюет против Господа.'
- source_word: παρεμβολὴν
  choice: войско
  rationale: В военном контексте означает стан или боевое соединение; «войско» естественно сочетается с победой.
- source_word: ἐπιμεριζόμενοι ἐν τῷ Λευὶ καὶ ἐν τῷ Ἰούδᾳ
  choice: распределённые между Левием и Иудой
  rationale: Передаёт трудную конструкцию как включение или рассеяние немногих среди двух колен, сохраняя её не вполне ясный характер.
- source_word: τις εἰς ἡγεμονίαν
  choice: никто из вас не станет правителем
  rationale: Идиоматически выражает отсутствие представителя Симеона, предназначенного для руководства или владычества.
theological_decisions:
- issue: Причина красоты Иосифа и связь внутреннего состояния с лицом
  choice: потому что в нём не обитало никакого зла; ведь лицо выдаёт смятение духа
  alternative: потому что зло не жило в его душе, а лицо отражает душевное смятение
  rationale: Сохранены буквальное «в нём» и многозначное «дух», без психологизирующего ограничения смысла.
- issue: Отношение разврата к Богу и Велиару
  choice: он отдаляет от Бога и приближает к Велиару
  alternative: отделяя человека от Бога и сближая его с Велиаром
  rationale: Греческие причастия не называют объект явно; русский текст передаёт действие разврата, не вводя дополнительного догматического субъекта.
- issue: «Война Господа»
  choice: он будет вести войну Господа
  alternative: он будет сражаться в войне Господа
  rationale: Генитив Κυρίου оставлен открытым для значений принадлежности и поручения; исключено ошибочное прочтение как войны против Господа.
- issue: Судьба немногих и отсутствие власти у Симеона
  choice: останутся лишь немногие, распределённые между Левием и Иудой; и никто из вас не станет правителем
  alternative: они будут малочисленны и разделятся в Левии и Иуде; и не будет из вас никого для начальствования
  rationale: Передан общий смысл сложной фразы, но примечания отмечают текстовую и синтаксическую неопределённость.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Сохранены повторы «перед Господом и людьми», «разврат» и «война Господа», поскольку они структурно и богословски значимы. Архаизмы ограничены традиционными именами и библейскими образами; нумерация стихов добавлена для удобства ссылки.
