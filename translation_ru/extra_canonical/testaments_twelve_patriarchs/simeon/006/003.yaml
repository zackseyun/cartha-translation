  text: Then the seed of Canaan will perish, and no remnant will remain in Amalek; all the Cappadocians will perish, and all the Hittites will be utterly destroyed.
translation:
  language: ru
  text: Тогда погибнет потомство Ханаана, и в Амалике не останется остатка; погибнут все каппадокийцы, и все хеттеи будут истреблены.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπέρμα Χαναάν
  choice: потомство Ханаана
  rationale: Буквально «семя Ханаана»; в данном контексте σπέρμα обозначает потомков, поэтому «потомство» естественно и точно передаёт смысл.
- source_word: ἐγκατάλειμμα
  choice: остаток
  rationale: Слово обозначает то, что осталось, в том числе уцелевшую часть народа; «остаток» сохраняет библейскую лексику и смысл исходного текста.
- source_word: ἐν τῷ Ἀμαλήκ
  choice: у Амалика
  rationale: Греческое ἐν буквально допускает «в», однако с названием народа по-русски естественнее «у Амалика», то есть среди его потомков или народа, без навязывания географического смысла.
- source_word: ἐξολοθρευθήσονται
  choice: будут истреблены
  rationale: Усиленный глагол выражает полное уничтожение; страдательная конструкция оригинала сохранена.
theological_decisions:
- issue: Объём пророчества об уничтожении народов
  choice: Сохранены без смягчения утверждения о гибели и истреблении названных народов.
  alternative: Передать эвфемистически как поражение или исчезновение.
  rationale: Исходный текст употребляет сильные глаголы ἀπόλλυμι и ἐξολοθρεύω; смягчение изменило бы его смысл и напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским регистром. Названия народов переданы традиционными русскими формами; синтаксический параллелизм греческого текста сохранён.
