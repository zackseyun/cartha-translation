    issue: «весь народ» передаёт πᾶς ὁ λαός слишком узко.
    rationale: Русское «весь народ» обычно означает народ как одну совокупность, тогда как греческая конструкция в данном пророческом обобщении допускает и, согласно английскому аудиторскому следу, требует дистрибутивного смысла «каждый/всякий народ». «Всякий народ» сохраняет единственное число греческого существительного, не превращая его в «все народы».
  revised_text: Тогда исчезнет земля Хама, и всякий народ погибнет. Тогда вся земля успокоится от смуты, и всё под небесами — от войны.
