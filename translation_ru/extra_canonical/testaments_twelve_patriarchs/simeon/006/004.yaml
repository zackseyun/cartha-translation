  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/004.yaml
  text: Then the land of Ham will perish, and every people will perish. Then all the earth will cease from turmoil, and all that is under heaven from war.
translation:
  language: ru
  text: Тогда исчезнет земля Хама, и всякий народ погибнет. Тогда вся земля успокоится от смуты, и всё под небесами — от войны.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκλείψει
  choice: исчезнет
  rationale: Глагол означает «иссякнуть, прекратиться, исчезнуть»; применительно к земле Хама передаёт её исчезновение или прекращение существования, не смешиваясь с последующим ἀπολεῖται.
- source_word: ἡ γῆ Χάμ
  choice: земля Хама
  rationale: Естественная передача географического выражения с сохранением имени Хам.
- source_word: πᾶς ὁ λαὸς
  choice: весь народ
  rationale: Сохраняет единственное число и определённость греческого выражения; контекст не требует превращать его во множественное «все народы».
- source_word: ἀπολεῖται
  choice: погибнет
  rationale: Точно передаёт гибель или уничтожение народа.
- source_word: καταπαύσει ... ἀπὸ ταραχῆς
  choice: успокоится от смуты
  rationale: Передаёт прекращение беспорядка и треволнения естественным современным русским оборотом.
- source_word: πᾶσα ἡ ὑπ᾿ οὐρανῶν
  choice: всё под небесами
  rationale: Сохраняет субстантивированное и несколько эллиптическое выражение оригинала, не добавляя отсутствующего существительного.
theological_decisions:
- issue: Объём выражения πᾶς ὁ λαός
  choice: весь народ
  alternative: все народы / каждый народ
  rationale: Греческий текст имеет единственное число с артиклем; перевод сохраняет эту форму и не расширяет пророчество толкованием.
- issue: Характер прекращения войны во второй части
  choice: 'сохранён эллипсис: «всё под небесами — от войны»'
  alternative: «всё под небесами прекратит воевать»
  rationale: Эллиптическая конструкция русского текста отражает параллелизм оригинала и не уточняет, каким именно образом прекратится война.
translation_notes:
  register: Современный литературный русский язык с торжественным пророческим ритмом. Синтаксический параллелизм двух предложений сохранён; архаизмы и конфессионально окрашенные формулировки не использованы.
