  source_fidelity: 'В первой части πᾶς ὁ λαός имеет формально единственное число, но πᾶς в такой конструкции может быть дистрибутивным: «всякий народ / каждый народ». Перевод «весь народ» естественно читается как один определённый народ и потому неоправданно сужает охват. «Исчезнет» допустимо передаёт ἐκλείψει в контексте гибели земли. Во второй части сохранены параллелизм и эллипсис оригинала; «успокоится от смуты» и «всё под небесами — от войны» не добавляют толковательных деталей.'
  naturalness: Текст в целом литературный и естественный. Замена «весь народ» на «всякий народ» одновременно точнее и сохраняет пророческую лаконичность. Тире во второй половине второго предложения удачно воспроизводит эллиптический параллелизм.
  terminology: Имя «Хам» передано последовательно. «Земля Хама», «смуты» и «войны» соответствуют нейтральному современному литературному регистру; специальных богословских терминов в отрывке нет.
