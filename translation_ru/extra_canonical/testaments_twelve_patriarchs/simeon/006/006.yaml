id: T12P.SIM.6.6
reference: Testament of Simeon 6:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Τότε δοθήσεται⁴⁸ πάντα τὰ πνεύματα τῆς πλάνης⁴⁹ εἰς καταπάτησιν⁵⁰ καὶ οἱ⁵¹ ἄνθρωποι⁵² βασιλεύσουσιν⁵³ τῶν⁵⁴ πονηρῶν πνευμάτων⁵⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/006.yaml
  text: Then all the spirits of deceit will be given over to trampling, and men will rule over the evil spirits.
translation:
  language: ru
  text: Тогда все духи заблуждения будут отданы на попрание, и люди будут властвовать над злыми духами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πνεύματα τῆς πλάνης
  choice: духи заблуждения
  rationale: Родительная конструкция сохранена без сужения значения πλάνη до одной лишь лжи или обмана; она может обозначать заблуждение, обольщение и увод с истинного пути.
- source_word: εἰς καταπάτησιν
  choice: на попрание
  rationale: Передаёт направленность и результат, выраженные εἰς с отглагольным существительным, сохраняя образ попрания.
- source_word: βασιλεύσουσιν τῶν πονηρῶν πνευμάτων
  choice: будут властвовать над злыми духами
  rationale: Хотя βασιλεύω буквально связано с царствованием, при управлении родительным падежом здесь естественно означает господство или власть над кем-либо; «властвовать» сохраняет высокий регистр и смысл превосходства.
theological_decisions:
- issue: Кто именно будет попирать духов заблуждения
  choice: Сохранена безличная конструкция «будут отданы на попрание»
  alternative: «будут отданы людям на попрание» или «будут попраны»
  rationale: Греческий текст не называет исполнителя попрания прямо; последующее упоминание власти людей над злыми духами не следует превращать в явно выраженного деятеля первой части.
- issue: Соотношение «духов заблуждения» и «злых духов»
  choice: Обе формулировки переданы отдельно, без явного отождествления
  alternative: Унифицировать обе группы как «злых духов»
  rationale: Текст использует разные выражения и допускает как отождествление, так и смысловое различение; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. «На попрание» и «властвовать» естественны в данном жанре и близко передают структуру греческого текста.
