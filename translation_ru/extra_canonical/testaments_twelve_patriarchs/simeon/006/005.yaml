  text: Then a great sign will be glorified for Israel.
translation:
  language: ru
  text: Тогда для Израиля прославится великое знамение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Тогда
  rationale: Передаёт временную последовательность без добавочного толкования.
- source_word: σημεῖον
  choice: знамение
  rationale: Обычный библейский эквивалент для знака, имеющего особое или сверхъестественное значение.
- source_word: ἐνδοξασθήσεται
  choice: прославится
  rationale: Сохраняет будущее время и пассивно-возвратный смысл греческой формы, не заменяя её более толковательным «явится во славе».
- source_word: μέγα
  choice: великое
  rationale: Согласовано со словом «знамение»; постпозиция в греческом подчёркивает величие знамения, но в русском естественнее препозиция.
- source_word: τῷ Ἰσραήλ
  choice: для Израиля
  rationale: Передаёт дательный падеж как отношение к Израилю, не уточняя сверх текста, означает ли это пользу, предназначение или явление перед Израилем.
theological_decisions:
- issue: Необычное выражение «знамение прославится»
  choice: Сохранено «прославится великое знамение»
  alternative: «явится великое знамение во славе»
  rationale: Греческий текст прямо употребляет ἐνδοξασθήσεται; более свободный вариант сгладил бы необычность и внёс толкование.
translation_notes:
  register: Современный литературный русский язык с библейски уместным словом «знамение». Порядок слов сделан естественным для русского, при этом смысловая неоднозначность дательного τῷ Ἰσραήλ сохранена.
