source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἰδοὺ εἴρηκα¹ ὑμῖν πάντα², *ὅπως δικαιωθῶ ἀπὸ τῆς ἁμαρτίας ὑμῶν³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/001.yaml
  text: Behold, I have told you everything, so that I may be justified from your sin.
translation:
  language: ru
  text: Вот, я сказал вам всё, чтобы быть оправданным от вашего греха.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «чтобы быть признанным непричастным к вашему греху». Греческое выражение буквально говорит об оправдании «от» греха адресатов.'
    reason: Поясняет необычную конструкцию δικαιωθῶ ἀπό, не подменяя её толкованием в основном тексте.
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Вот
  rationale: Передаёт указательно-эмфатическое введение без излишне архаичного «се».
- source_word: εἴρηκα ὑμῖν πάντα
  choice: я сказал вам всё
  rationale: Сохраняет значение перфекта как завершённого сообщения и прямой объём πάνта — «всё».
- source_word: δικαιωθῶ
  choice: быть оправданным
  rationale: Сохраняет пассивную форму и судебно-нравственный оттенок δικαιόω, не заменяя его более толковательным «оказаться непричастным».
- source_word: ἀπὸ τῆς ἁμαρτίας ὑμῶν
  choice: от вашего греха
  rationale: Формально сохраняет предлог отделения ἀπό и не устраняет необычную смысловую связь между оправданием говорящего и грехом адресатов.
theological_decisions:
- issue: Смысл оправдания говорящего «от» греха адресатов
  choice: Сохранена формулировка «быть оправданным от вашего греха»
  alternative: «быть признанным непричастным к вашему греху»
  rationale: Альтернатива звучит естественнее, но уже истолковывает характер связи; основной текст сохраняет напряжение и неоднозначность греческой конструкции.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном. «Вот» предпочтено архаичному «се»; необычная формула «оправданным от вашего греха» намеренно сохранена ради близости к источнику.
