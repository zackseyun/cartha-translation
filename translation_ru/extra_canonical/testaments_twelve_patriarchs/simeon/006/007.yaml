base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/007.yaml
  text: Then I also will arise in gladness, and I will bless the Most High for his wonders [because God, having taken a body and eaten with men, saved men].
translation:
  language: ru
  text: Тогда и я восстану в радости и благословлю Всевышнего за Его чудеса [ведь Бог, приняв тело и вкушая пищу вместе с людьми, спас людей][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Заключительная фраза в исходном издании заключена в квадратные скобки, что указывает на сомнение в её принадлежности к первоначальному тексту.
    reason: Сноска поясняет редакционные квадратные скобки и поставлена непосредственно после заключённого в них фрагмента.
lexical_decisions:
- source_word: ἀναστησόμαι
  choice: восстану
  rationale: Сохраняет возможный смысл воскресения и не сводит глагол к нейтральному «встану».
- source_word: ἐν εὐφροσύνῃ
  choice: в радости
  rationale: Естественная современная передача состояния ликования без стилистического утяжеления.
- source_word: εὐλογήσω τὸν ὕψιστον
  choice: благословлю Всевышнего
  rationale: Точно воспроизводит религиозную формулу и титул Бога.
- source_word: ἐπὶ τοῖς θαυμασίοις αὐτοῦ
  choice: за Его чудеса
  rationale: В данном контексте ἐπί обозначает основание хвалы; «чудеса» естественно передаёт θαυμάσια.
- source_word: σῶμα λαβών
  choice: принял тело
  rationale: Сохраняет буквальную инкарнационную формулировку, не уточняя её богословски сверх текста.
- source_word: συνεσθίων ἀνθρώποις
  choice: разделял трапезу с людьми
  rationale: Передаёт совместное принятие пищи естественным и достойным русским выражением.
theological_decisions:
- issue: Значение ἀναστησόμαι
  choice: восстану
  alternative: встану
  rationale: Контекст допускает эсхатологический оттенок воскресения; выбранный вариант сохраняет его, не добавляя прямого пояснения.
- issue: Статус заключительной фразы
  choice: сохранить в квадратных скобках
  alternative: включить без скобок или опустить
  rationale: Скобки присутствуют в предоставленном критическом тексте и указывают на текстологическую обособленность фразы; её содержание нельзя опускать.
- issue: σῶμα λαβών
  choice: принял тело
  alternative: воплотился
  rationale: Более формальная передача сохраняет исходный образ и не заменяет его позднейшим богословским термином.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной и религиозной речи. Синтаксис сделан естественным, при этом сохранены ключевые богословские формулировки и текстологическая неопределённость.
