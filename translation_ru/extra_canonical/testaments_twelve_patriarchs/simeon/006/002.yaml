source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἐὰν δὲ⁴ ἀφέλητε⁵ ἀφ᾽ ὑμῶν τὸν φθόνον καὶ πᾶσαν σκληροκαρδίαν⁶, Ὡς⁷ ῥόδον ἀνθήσει⁸ τὰ ὀστᾶ μου⁹ ἐν Ἰσραήλ, καὶ¹⁰ ὡς κρίνον *ἡ σάρξ μου¹⁰ ἐν Ἰακώβ, καὶ ἔσται¹¹ *ἡ ὀσμή μου ὡς¹² ὀσμὴ Λιβάνου,¹³ καὶ πληθυνθήσονται¹⁴ ἅγιοι¹⁵ *ἐξ ἐμοῦ¹⁶ *ἕως αἰῶνας¹⁷ αἰώνων¹⁷ καὶ *οἱ κλάδοι¹⁸ αὐτῶν¹⁹ εἰς μακρὰν ἔσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/002.yaml
  text: But if you remove from yourselves envy and every hardness of heart, my bones will blossom like a rose in Israel, and my flesh like a lily in Jacob; and my fragrance will be like the fragrance of Lebanon. Holy ones will be multiplied from me forever and ever, and their branches will extend far away.
translation:
  language: ru
  text: Но если вы удалите из себя зависть и всякую черствость сердца, то кости мои расцветут, как роза, в Израиле, и плоть моя — как лилия — в Иакове; благоухание моё будет подобно благоуханию Ливана. Святые, происходящие от меня, умножатся во веки веков, и ветви их прострутся далеко.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνον
  choice: зависть
  rationale: Прямое и естественное соответствие греческому слову, обозначающему зависть или недоброжелательную ревность.
- source_word: πᾶσαν σκληροκαρδίαν
  choice: всякое ожесточение сердца
  rationale: Сохраняет образ сердца и передаёт нравственную черствость без излишней буквальности «жестокосердие».
- source_word: ὡς ῥόδον ἀνθήσει τὰ ὀστᾶ μου
  choice: кости мои расцветут, как роза
  rationale: Сохраняет яркую и намеренно необычную метафору исходного текста.
- source_word: κρίνον
  choice: лилия
  rationale: Обычное литературное соответствие названию цветка в данном поэтическом сопоставлении.
- source_word: ὀσμὴ Λιβάνου
  choice: благоухание Ливана
  rationale: В положительном образном контексте ὀσμή естественно передаётся как «благоухание», при этом географический образ Ливана сохраняется.
- source_word: πληθυνθήσονται ἅγιοι ἐξ ἐμοῦ
  choice: Святые произойдут от меня во множестве
  rationale: Передаёт как идею происхождения «от меня», так и умножения, не уточняя без основания, идёт ли речь о потомках, праведниках или освящённом народе.
- source_word: οἱ κλάδοι αὐτῶν εἰς μακρὰν ἔσονται
  choice: ветви их прострутся далеко
  rationale: Сохраняет родословно-растительную метафору и естественно выражает дальнее распространение.
theological_decisions:
- issue: Кого обозначает ἅγιοι («святые»)
  choice: Оставлено общее существительное «Святые» без поясняющего определения.
  alternative: «святые потомки» или «праведники»
  rationale: Греческий текст не выражает слово «потомки» и не требует отождествления святости только с нравственной праведностью; перевод сохраняет смысловую открытость.
- issue: Образ останков, плоти и будущего потомства Симеона
  choice: Сохранены телесные образы «кости мои» и «плоть моя» без аллегорического истолкования.
  alternative: Передать их как прямое обозначение рода или потомков.
  rationale: Исходный текст соединяет телесную, растительную и родословную образность; её богословское напряжение не следует устранять толкованием внутри перевода.
- issue: ἕως αἰῶνας αἰώνων
  choice: во веки веков
  alternative: на вечные века
  rationale: Традиционная, понятная современному читателю формула точно сохраняет усиленное выражение длительности.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной речи. Синтаксис слегка приподнят, но не архаизирован; параллелизм цветочных образов и метафора ветвей сохранены.
