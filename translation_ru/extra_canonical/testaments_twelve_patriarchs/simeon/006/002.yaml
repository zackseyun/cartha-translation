revisions:
- from: Но если вы удалите из себя зависть и всякое ожесточение сердца, то кости мои расцветут, как роза, в Израиле, и плоть моя — как лилия в Иакове; благоухание моё будет подобно благоуханию Ливана. Святые произойдут от меня во множестве во веки веков, и ветви их прострутся далеко.
  to: Но если вы удалите из себя зависть и всякую черствость сердца, то кости мои расцветут, как роза, в Израиле, и плоть моя — как лилия — в Иакове; благоухание моё будет подобно благоуханию Ливана. Святые, происходящие от меня, умножатся во веки веков, и ветви их прострутся далеко.
  rationale: 'Исправлена передача πληθυνθήσονται: теперь перевод прямо говорит об умножении святых и одновременно сохраняет их происхождение «от меня». «Ожесточение сердца» заменено на более естественное в современном русском «черствость сердца» как передачу нравственной окаменелости/жестокосердия. Тире вокруг «как лилия» отмечают эллипсис повторяющегося глагола, присутствующий в греческом параллелизме.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T22:31:43Z'
review_pass:
  verdict: revise
  source_fidelity: Первая часть точно передаёт условие, нравственные понятия и намеренно необычные телесно-растительные образы. Однако «Святые произойдут от меня во множестве» ослабляет будущее страдательное/медиальное πληθυνθήσονται («умножатся, станут многочисленными»), заменяя его преимущественно идеей происхождения. В исправлении обе составляющие — происхождение ἐξ ἐμοῦ и умножение — сохранены.
  naturalness: Текст в целом литературен и хорошо держит возвышенный регистр. «Святые, происходящие от меня, умножатся» несколько эксплицирует синтаксическую связь, но по-русски ясно и не навязывает, кем именно являются «святые».
  terminology: «Зависть», «благоухание», «Ливан», «Иаков» и «лилия» удачны. «Черствость сердца» естественно выражает σκληροκαρδία без церковнославянизма и без изменения образа сердца. «Святые» сохранены без конфессионального или родословного уточнения.
  issues:
