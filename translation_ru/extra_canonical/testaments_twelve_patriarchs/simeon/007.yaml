  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007.yaml
  text: And now[[God and man]], my children, listen to Levi and to Judah, and do not exalt yourselves over these two tribes, because from them the salvation of God will arise for us. For the Lord will raise up from Levi as a high priest, and from Judah as a king, [God and man]; he will save [all the nations and] the race of Israel[[all the nations and]]. Therefore I command these things to you, so that you also may command your children[the race of Israel], that they may keep them throughout their generations.
translation:
  language: ru
  text: '**Завещание Симеона, 7**


    1 И теперь, дети мои, внимайте Левию и Иуде и не превозноситесь над этими двумя коленами, потому что от них взойдёт для нас спасение Божье. 2 Ибо Господь воздвигнет из Левия — как первосвященника, и из Иуды — как царя, [Бога и человека][a]. Он спасёт [все народы и][b] род Израиля[c]. 3 Поэтому я заповедую вам это, чтобы и вы заповедовали это своим детям, чтобы они хранили это из поколения в поколение.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «Бога и человека» в предоставленном греческом тексте заключены в скобки, что указывает на текстуальную неуверенность или возможное позднейшее расширение. Они сохранены здесь ради прозрачности.
    reason: textual_variant
  - marker: b
    text: Слова «все народы и» в предоставленном греческом тексте заключены в скобки и могут быть вторичным расширением.
    reason: textual_variant
  - marker: c
    text: 'Или: «народ Израиля». Греческое γένος подчёркивает общность происхождения или родства.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπακούσατε
  choice: внимайте
  rationale: Передаёт не просто физическое слушание, а внимательное, готовое к отклику восприятие наставления, не превращая глагол в однозначное «повинуйтесь».
- source_word: μὴ ἐπαίρεσθε
  choice: не превозноситесь над
  rationale: Сохраняет значение самовозвышения и направленность по отношению к двум названным коленам.
- source_word: γενεὰς
  choice: коленами
  rationale: В данном контексте Левий и Иуда обозначают родовые подразделения Израиля; «колена» ясно передаёт этот смысл, хотя обычное значение слова γενεά — «поколение».
- source_word: τὸ σωτήριον τοῦ Θεοῦ
  choice: спасение Божье
  rationale: Сохраняет возвышенное пророческое звучание и не устраняет возможную смысловую открытость между спасающим действием Бога и олицетворённым спасением.
- source_word: ἀναστήσει
  choice: воздвигнет
  rationale: Традиционный и уместный в пророческом контексте глагол о том, как Господь являет или поставляет будущего предводителя.
- source_word: ἀρχιερέα
  choice: первосвященника
  rationale: Точно передаёт конкретное священническое служение.
- source_word: βασιλέα
  choice: царя
  rationale: Сохраняет конкретный царский титул без ослабления до общего «правителя».
- source_word: σώσει
  choice: спасёт
  rationale: Сохраняет лексическую связь с ранее упомянутым «спасением».
- source_word: τὸ γένος τοῦ Ἰσραήλ
  choice: род Израиля
  rationale: Передаёт заложенный в γένος оттенок происхождения и родовой общности; вариант «народ Израиля» возможен, но менее явно выражает генеалогический смысл.
- source_word: φυλάξωσιν
  choice: хранить
  rationale: В контексте заповеди включает сохранение и соблюдение переданного наставления.
theological_decisions:
- issue: Текстуально неустойчивое выражение Θεὸν καὶ ἄνθρωπον
  choice: Сохранено в основном тексте как «[Бога и человека]» с примечанием.
  alternative: Опустить как позднейшее добавление либо истолковать как «божественного и человеческого».
  rationale: Предоставленный греческий текст отмечает выражение квадратными скобками. Буквальный перевод сохраняет богословское напряжение и не подменяет текст позднейшей догматической формулировкой.
- issue: Текстуально неустойчивое выражение πάντα τὰ ἔθνη
  choice: Сохранено в основном тексте как «[все народы и]» с примечанием.
  alternative: Опустить как вторичное расширение либо перевести «всех язычников и».
  rationale: Квадратные скобки в источнике указывают на неуверенность в чтении. «Народы» сохраняет возможный универсальный охват и не навязывает исключительно противопоставление язычников Израилю.
- issue: Соотношение левитского первосвященника и иудейского царя
  choice: 'Синтаксис оставлен близким к греческому: «из Левия — как первосвященника, и из Иуды — как царя».'
  alternative: Явно представить двух разных деятелей либо объединить обе роли в одном лице.
  rationale: Греческая формулировка допускает напряжение в отношении числа и тождества будущей фигуры или фигур. Перевод не разрешает эту неоднозначность догматически.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательно-пророческой речи. «Внимайте», «воздвигнет» и «хранить» поддерживают возвышенный регистр, оставаясь понятными современному читателю. Текстуально сомнительные слова обозначены квадратными скобками и снабжены обязательными маркерами примечаний.
