  source_fidelity: 'В целом перевод точно передаёт греческий текст: «колена» уместно для γενεά в ст. 1; τὸ σωτήριον τοῦ Θεοῦ корректно передано как «спасение Божье»; пророческое «воздвигнет» хорошо соответствует ἀναστήσει. Квадратные скобки при текстуально сомнительных выражениях сохранены. В ст. 2 единственное число οὗτος («Он») оставлено без догматического разрешения вопроса о соотношении священника и царя.'
  naturalness: 'Ст. 3 в исходной редакции синтаксически тяжеловесен: «заповедали своим детям хранить это во все их поколения» звучит не вполне естественно и размывает придаточное цели, где хранителями являются дети. Перестройка на «заповедовали это своим детям, чтобы они хранили это из поколения в поколение» ясна, современна и сохраняет структуру греческого текста.'
  terminology: Термины «первосвященник», «царь», «колена», «род Израиля» и «спасение Божье» уместны. «Род Израиля» хорошо передаёт генеалогический оттенок γένος; примечание с вариантом «народ Израиля» достаточно. «Бога и человека» следует оставить буквальным и в скобках, не заменяя догматически нагруженной интерпретацией.
