  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008.yaml
  text: 'And when Simeon had finished commanding his sons[a], he fell asleep with his fathers, being one hundred and twenty years old.


    And they placed him in a wooden coffin, to bring up his bones to Hebron. And they brought them up secretly during a war of the Egyptians.


    For the Egyptians were keeping the bones of Joseph in the tombs of the kings, so as to bring him up. For the enchanters were telling them that, when Joseph’s bones went out, there would be over all the land darkness and gloom and a great plague for the Egyptians[c][b], so that even with a lamp each man would not recognize his brother.'
translation:
  language: ru
  text: '8 Когда Симеон закончил наставлять своих сыновей, он почил с отцами своими в возрасте ста двадцати лет.


    2 Его положили в деревянный гроб, чтобы перенести его останки в Хеврон. И тайно перенесли их во время войны египтян.[a]


    3 Ведь египтяне держали останки Иосифа в царских гробницах.[b][c]


    4 Заклинатели говорили им, что, когда останки Иосифа будут вынесены, по всей земле настанут тьма и мрак и египтян постигнет великое бедствие, так что даже при свете светильника никто не узнает своего брата.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза сжата и может означать также: «тайно во время египетской войны» или «тайно во время войны среди египтян».'
    reason: alternative_reading
  - marker: b
    text: 'В некоторых рукописях вместо «гробниц» читается «кладовых»: «египтяне держали останки Иосифа в царских кладовых».'
    reason: textual_variant
  - marker: c
    text: Ср. Бытие 50:25 и Исход 13:19, где говорится о перенесении останков Иосифа.
    reason: cross_reference
lexical_decisions:
- source_word: συνετέλεσεν ἐντελλόμενος
  choice: закончил наставлять
  rationale: Передаёт завершение предсмертных наставлений и их авторитетный характер, не придавая русской фразе излишне жёсткого оттенка слова «приказывать».
- source_word: ἐκοιμήθη μετὰ τῶν πατέρων αὐτοῦ
  choice: почил с праотцами своими
  rationale: Сохраняет традиционную библейскую формулу смерти и возвышенный, но понятный регистр; глагол не сводится к нейтральному «умер».
- source_word: θήκῃ ξυλίνῃ
  choice: деревянный гроб
  rationale: В погребальном контексте это наиболее естественное обозначение деревянного вместилища для тела.
- source_word: τοῦ ἀναγαγεῖν τὰ ὀστᾶ αὐτοῦ
  choice: чтобы впоследствии перенести его останки
  rationale: Русское «останки» естественно передаёт погребальное значение «костей», а «перенести» выражает доставку к месту родового погребения; «впоследствии» проясняет цель помещения в гроб без добавления конкретного времени.
- source_word: ἐν πολέμῳ Αἰγυπτίων κρυφῇ
  choice: тайно перенесли их во время войны египтян
  rationale: Сохраняет сжатость и неоднозначность греческой конструкции относительно того, была ли это война египтян с внешним противником или война среди них.
- source_word: ἐφύλαττον
  choice: держали
  rationale: Передаёт длительное удержание останков египтянами, не уточняя сверх текста, охраняли ли они их или просто хранили.
- source_word: μνήμασι τῶν βασιλέων
  choice: в царских гробницах
  rationale: Естественная русская передача буквального смысла «в гробницах царей»; текстовый вариант отмечен в сноске.
- source_word: ἐπαοιδοί
  choice: заклинатели
  rationale: Точно обозначает людей, практиковавших заклинания, и лучше соответствует древнему контексту, чем широкое «маги».
- source_word: σκότος καὶ γνόφος
  choice: тьма и мрак
  rationale: Сохраняет усилительную пару исходного текста и её библейское звучание.
- source_word: πληγὴ μεγάλη
  choice: великое бедствие
  rationale: 'Не сужает многозначное πληγή до эпидемии: речь может идти о тяжком поражении, каре или бедствии.'
- source_word: μετὰ λύχνου μὴ ἐπιγινώσκειν ἕκαστος τὸν ἀδελφὸν αὐτοῦ
  choice: даже при свете светильника никто не узнает своего брата
  rationale: Естественно передаёт следствие непроглядной тьмы, сохраняя конкретный образ светильника и буквальное «брата».
theological_decisions:
- issue: Формула смерти ἐκοιμήθη
  choice: почил с праотцами своими
  alternative: умер; уснул с отцами своими
  rationale: Выбранная формула сохраняет библейский эвфемизм и литературный вес текста, не превращая его в отдельное утверждение о состоянии умерших.
- issue: Характер предсказанного египтянам бедствия
  choice: великое бедствие
  alternative: великая казнь; великая язва
  rationale: Греческое πληγή допускает значения удара, кары и бедствия. Более широкая передача сохраняет смысловую напряжённость и не навязывает конкретную форму наказания.
- issue: Неясное сообщение о хранении останков Иосифа
  choice: египтяне держали останки Иосифа в царских гробницах
  alternative: египтяне хранили останки Иосифа в царских кладовых
  rationale: Основной текст следует представленному греческому μνήμασι, а засвидетельствованная в консультационном слое вариантность вынесена в сноску и не скрыта.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Традиционные формулы сохранены там, где они несут литературный вес («почил с праотцами своими»), но синтаксис остаётся ясным для современного читателя. Нумерация стихов воспроизводит структуру главы; подлинные неясности вынесены в сноски.
