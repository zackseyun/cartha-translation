base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006.yaml
  text: '1 Behold, I have told you everything, so that I may be cleared from your sin. 2 But if you remove from yourselves envy and every hardness of heart, my bones will blossom like a rose in Israel, and my flesh like a lily in Jacob; and my fragrance will be like the fragrance of Lebanon. Holy ones will be multiplied from me forever and ever, and their branches will extend far away.


    3 Then the seed of Canaan will perish, and no remnant will remain for Amalek; all the Cappadocians will perish, and all the Hittites will be utterly destroyed. 4 Then the land of Ham will fail, and every people will perish. Then all the earth will cease from turmoil, and all that is under heaven from war.


    5 Then a great sign will be glorified for Israel, because the Lord God, appearing on the earth, will come and save Adam in him. 6 Then all the spirits of deceit will be given over to be trampled down, and men will rule over the evil spirits. 7 Then I also will arise in gladness, and I will bless the Most High for his wonders.'
translation:
  language: ru
  text: '1 Вот, я рассказал вам всё, чтобы мне быть свободным от вины за ваш грех. 2 Но если вы удалите из своей среды зависть и всякое жестокосердие, то кости мои расцветут, как роза, в Израиле, и плоть моя — как лилия в Иакове; благоухание моё будет подобно благоуханию Ливана. Святые, происходящие от меня, будут умножаться во веки веков, и ветви их прострутся далеко.


    3 Тогда погибнет потомство Ханаана, и в Амалике не останется остатка; погибнут все каппадокийцы, и все хеттеи будут истреблены. 4 Тогда исчезнет земля Хама, и всякий народ погибнет. Тогда вся земля успокоится от смуты, и всё, что под небесами, — от войны.


    5 Тогда великое знамение будет прославлено для Израиля.[a]


    6 Тогда все духи заблуждения будут отданы на попрание, и люди станут властвовать над злыми духами. 7 Тогда и я восстану в радости и благословлю Всевышнего за Его чудеса. [Ведь Бог, приняв тело и разделяя трапезу с людьми, спас людей.][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст этого стиха, по-видимому, повреждён. В иной форме текста далее говорится о Господе Боге, Который явится на земле и спасёт Адама.
    reason: Слово σημεῖον отмечено в издании как сомнительное, а консультационный английский текст отражает более пространное чтение, отсутствующее в приведённом греческом основном тексте.
  - marker: b
    text: Заключительное предложение в греческом издании заключено в квадратные скобки как текстологически сомнительное.
    reason: Необходимо показать читателю редакционную неуверенность в подлинности фразы, сохранив её перевод из предоставленного источника.
lexical_decisions:
- source_word: δικαιωθῶ ἀπὸ τῆς ἁμαρτίας ὑμῶν
  choice: чтобы мне быть свободным от вины за ваш грех
  rationale: Оборот с δικαιόω и ἀπό означает оправдание или освобождение от ответственности в связи с чужим грехом. Русская формулировка передаёт судебный оттенок, не утверждая, будто грех принадлежит самому Симеону.
- source_word: σκληροκαρδίαν
  choice: жестокосердие
  rationale: Сохраняет образ «жёсткого сердца» и звучит естественно в возвышенной современной русской речи.
- source_word: ἅγιοι
  choice: святые
  rationale: Буквальное и богословски нейтральное обозначение освящённых людей; контекст не позволяет точнее определить конкретную группу.
- source_word: ἐξ ἐμοῦ
  choice: происходящие от меня
  rationale: Явно передаёт происхождение или потомство, выраженное предлогом ἐκ, не сводя «святых» только к биологическим детям.
- source_word: σπέρμα Χαναάν
  choice: потомство Ханаана
  rationale: В данном этногенеалогическом контексте σπέρμα означает потомство, а не буквальное семя.
- source_word: καταπάτησιν
  choice: попрание
  rationale: Сохраняет сильный образ низвержения и хождения по побеждённому врагу.
- source_word: βασιλεύσουσιν τῶν πονηρῶν πνευμάτων
  choice: станут властвовать над злыми духами
  rationale: Передаёт необычное управление βασιλεύω с родительным как господство над кем-либо; «царствовать над» по-русски менее естественно.
- source_word: συνεσθίων ἀνθρώποις
  choice: разделяя трапезу с людьми
  rationale: Естественно передаёт буквальное «едя вместе с людьми» и сохраняет мотив совместной трапезы.
theological_decisions:
- issue: Связь Симеона с грехом слушателей в 6:1
  choice: «быть свободным от вины за ваш грех»
  alternative: «оправдаться от вашего греха»
  rationale: Выбранный вариант сохраняет идею снятия ответственности за чужой грех и не создаёт неясного впечатления, будто оправдание происходит посредством этого греха.
- issue: Значение «святых» в 6:2
  choice: Сохранено общее «святые»
  alternative: «праведные потомки» или конкретная религиозная группа
  rationale: Греческий текст не уточняет идентичность этих лиц; конфессиональная или мессианская конкретизация была бы привнесена извне.
- issue: Текстологически неустойчивое воплощенческое высказывание в 6:7
  choice: Сохранено в квадратных скобках с примечанием
  alternative: Опустить как позднюю вставку либо включить без оговорки
  rationale: Фраза присутствует в предоставленном греческом тексте, но редакционные квадратные скобки указывают на сомнение в её принадлежности исходному тексту. Перевод не должен ни скрывать её, ни представлять бесспорной.
- issue: Содержание 6:5
  choice: Переведён именно сохранившийся греческий текст без дополнения о явлении Господа Бога и спасении Адама
  alternative: 'Включить более пространное чтение: «Господь Бог, явившись на земле, придёт и спасёт Адама в нём»'
  rationale: Предоставленный основной греческий текст содержит только краткое и, вероятно, повреждённое предложение. Пространное чтение засвидетельствовано консультационным английским слоем, но отсутствует в данном греческом отрывке, поэтому отмечено лишь в текстологическом примечании.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным, завещательным звучанием. Сохранены библейские образы розы, лилии, Ливана, ветвей и попрания, но синтаксис сделан понятным обычному современному читателю. Архаизмы сведены к устойчивым и прозрачным формулам («во веки веков», «Всевышний»). Этнонимы переданы традиционными русскими формами.
