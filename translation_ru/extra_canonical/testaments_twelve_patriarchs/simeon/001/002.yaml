  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/001/002.yaml
  text: 'And when Simeon was sick, his sons came to visit him; and gathering his strength, he sat up, kissed them[b], and said:'
translation:
  language: ru
  text: 'Когда Симеон был болен, сыновья пришли навестить его. Собравшись с силами, он сел, расцеловал их[a] и сказал:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий глагол может подразумевать, что Симеон поцеловал их сердечно или несколько раз.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀρρωστοῦντος
  choice: Когда … был болен
  rationale: Передаёт обстоятельственный родительный абсолют со значением времени, не уточняя начало или характер болезни.
- source_word: ἐπισκέψασθαι
  choice: навестить
  rationale: В данном семейном контексте естественно передаёт посещение больного.
- source_word: ἐνισχύσας
  choice: Собравшись с силами
  rationale: Передаёт предшествующее усилие ослабевшего Симеона без излишне буквального или медицинского оттенка.
- source_word: ἐκάθισε
  choice: сел
  rationale: Соответствует простому значению греческого глагола; уточнение «сел в постели» или «приподнялся» в источнике отсутствует.
- source_word: κατεφίλησεν
  choice: расцеловал
  rationale: 'Русский глагол естественно передаёт усилительный характер формы: сердечные или неоднократные поцелуи.'
