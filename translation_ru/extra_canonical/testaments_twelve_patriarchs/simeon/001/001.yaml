  text: Διαθήκη Συμεὼν τοῦ δευτέρου υἱοῦ Ἰακὼβ καὶ Λίας¹. I. *¹Ἀντίγραφον λόγων² Συμεών, ἃ³ ἐλάλησε τοῖς υἱοῖς αὐτοῦ⁴, *πρὸ τοῦ ἀποθανεῖν⁵ αὐτὸν⁶ *ἐν ἑκατοστῷ εἰκοστῷ ἔτει⁷ τῆς ζωῆς αὐτοῦ⁸ *ἐν ᾧ χρόνῳ⁹ ἀπέθανεν Ἰωσὴφ ὁ ἀδελφὸς αὐτοῦ¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/001/001.yaml
  text: A copy[a] of the words of Simeon, which he spoke to his sons before he died, in the hundred and twentieth year of his life, at the time when Joseph his brother died.
translation:
  language: ru
  text: Копия[a] слов Симеона, которые он сказал своим сыновьям перед смертью, на сто двадцатом году своей жизни, в то время, когда умер его брат Иосиф.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Запись слов Симеона».'
    reason: Греческое ἀντίγραφον может обозначать как копию письменного текста, так и письменную запись.
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: Копия
  rationale: Основное значение — письменная копия или список; этот вариант сохраняет предметный характер греческого слова. Возможное значение «запись» вынесено в сноску.
- source_word: λόγων
  choice: слов
  rationale: Прямой и естественный эквивалент, обозначающий содержание сказанного Симеоном.
- source_word: πρὸ τοῦ ἀποθανεῖν αὐτόν
  choice: перед смертью
  rationale: Естественная русская передача оборота «прежде чем он умер» без изменения временного отношения.
- source_word: ἐν ἑκατοστῷ εἰκοστῷ ἔτει τῆς ζωῆς αὐτοῦ
  choice: на сто двадцатом году своей жизни
  rationale: Точно передаёт древний способ указания возраста и не превращает его без основания в утверждение о полных 120 годах.
