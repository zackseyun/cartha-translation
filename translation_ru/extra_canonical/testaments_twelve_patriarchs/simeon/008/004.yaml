source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Ἔλεγον γὰρ ⌜αὐτοῖς⌝¹⁷ οἱ ἐπαοιδοί¹⁸, ὅτι ἐν ἐξόδῳ τῶν¹⁹ ὀστῶν Ἰωσὴφ²⁰ ἔσται ἐν πάσῃ *τῇ γῇ²¹ σκότος καὶ γνόφος καὶ πληγὴ²² μεγάλη²³ τοῖς Αἰγυπτίοις, ὥστε μετὰ λύχνου²⁴ μὴ²⁵ ἐπιγινώσκειν ἕκαστος²⁶ *τὸν ἀδελφὸν²⁷ αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/004.yaml
  text: For the enchanters were telling them that, when Joseph’s bones went out, there would be over all the land darkness and gloom and a great plague on the Egyptians, so that each man would not recognize his brother, even with a lamp.
translation:
  language: ru
  text: Ведь заклинатели говорили им, что при вынесении костей Иосифа по всей земле настанут тьма и мгла, а египтян постигнет великое бедствие[a], так что даже при свете светильника никто не узнает своего брата.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «великое поражение»; греческое слово может также обозначать мор или бедствие.'
    reason: Греческое πληγή имеет широкий диапазон значений, и контекст не позволяет однозначно выбрать между бедствием, поражением и мором.
lexical_decisions:
- source_word: ἐπαοιδοί
  choice: заклинатели
  rationale: Слово обозначает людей, произносящих заклинания; «заклинатели» точно передаёт смысл и остаётся понятным в современном литературном русском.
- source_word: ἐν ἐξόδῳ τῶν ὀστῶν Ἰωσήφ
  choice: при вынесении костей Иосифа
  rationale: Оборот буквально указывает на «выход» костей; по-русски «при вынесении» естественно передаёт перенос останков, не уточняя названного исполнителя действия.
- source_word: σκότος καὶ γνόφος
  choice: тьма и мгла
  rationale: Сохранена пара близких, но не полностью тождественных обозначений густой темноты.
- source_word: πληγὴ μεγάλη
  choice: великое бедствие
  rationale: Передаёт масштаб и губительный характер πληγή без архаичного русского «язва»; неоднозначность слова отмечена в сноске.
- source_word: μετὰ λύχνου
  choice: даже при свете светильника
  rationale: 'Естественная русская передача обстоятельства: люди не смогут узнать друг друга даже при наличии искусственного света.'
theological_decisions:
- issue: Характер предсказанного поражения египтян
  choice: великое бедствие
  alternative: великая язва / великое поражение
  rationale: Греческое πληγή может означать удар, поражение, бедствие или мор. Контекст не требует сужать значение до конкретной болезни либо вводить представление о каре.
translation_notes:
  register: Современный литературный русский с умеренно торжественным повествовательным тоном. Сохранены образность и повтор смыслово близких слов исходника; синтаксис сделан естественным для широкого круга читателей.
