base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/003.yaml
  text: For the Egyptians were keeping Joseph’s bones in the tombs of the kings, so as to bring him up.
translation:
  language: ru
  text: Ибо египтяне хранили кости Иосифа в гробницах царей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφύλαττον
  choice: хранили
  rationale: 'Передаёт длительное действие имперфекта: египтяне держали кости Иосифа под сохранением.'
- source_word: ἐν τοῖς μνήμασι
  choice: в гробницах
  rationale: В данном погребальном контексте μνήματα естественно означает гробницы, а не памятники.
- source_word: τῶν βασιλέων
  choice: царей
  rationale: Сохранён родительный падеж и множественное число греческого текста без уточнения, отсутствующего в источнике.
theological_decisions:
- issue: Целевая фраза в английском консультационном тексте
  choice: Не включать «чтобы впоследствии вынести его»
  alternative: «…чтобы впоследствии вынести его»
  rationale: В предоставленном греческом тексте нет соответствующей целевой конструкции; перевод следует непосредственно исходному свидетельству и не добавляет отсутствующий смысл.
translation_notes:
  register: Современный литературный русский язык; краткий повествовательный синтаксис. Союз «ибо» сохраняет объяснительную связь γάρ с предшествующим контекстом. Формулировка намеренно не устраняет множественность «гробниц царей».
