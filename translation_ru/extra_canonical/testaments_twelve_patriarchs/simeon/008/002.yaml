  verdict: revise
  source_fidelity: 'Первая фраза точно передаёт помещение тела в деревянный гроб и цель перенесения костей в Хеврон. Однако «война с египтянами» делает египтян стороной, против которой ведётся война. Генитив Αἰγυπτίων этого не уточняет: речь может идти о войне египтян или о войне, связанной с ними. Более нейтральное «война египтян» сохраняет формулу источника и согласуется с английским audit trail («a war of the Egyptians»).'
  naturalness: Текст в целом современный и литературный. «Во время войны египтян» естественно в повествовательном контексте и точнее, чем конструкция с «с».
  terminology: «Деревянный гроб», «кости» и «Хеврон» уместны. «Перенести» — естественная передача ἀναγαγεῖν / ἀνήγαγον в контексте перемещения останков; не требуется искусственно воспроизводить буквальное пространственное значение «поднять».
