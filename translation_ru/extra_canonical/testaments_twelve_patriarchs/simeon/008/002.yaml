  text: Καὶ ἔθηκαν αὐτὸν ἐν *θήκῃ ξυλίνῃ⁹, *τοῦ ἀναγαγεῖν τὰ ὀστᾶ αὐτοῦ¹⁰ ἐν Χεβρών. Καὶ ἀνήγαγον¹¹ *αὐτὰ ἐν πολέμῳ Αἰγυπτίων κρυφῇ¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/002.yaml
  text: And they placed him in a wooden coffin, to bring up his bones to Hebron. And they brought them up secretly in a war of the Egyptians.
translation:
  language: ru
  text: И положили его в деревянный гроб, чтобы перенести его кости в Хеврон. И тайно перенесли их во время войны египтян.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θήκῃ ξυλίνῃ
  choice: в деревянный гроб
  rationale: θήκη обозначает вместилище или погребальный ларец; в данном погребальном контексте естественный русский эквивалент — «гроб».
- source_word: ἀναγαγεῖν / ἀνήγαγον
  choice: перенести / перенесли туда
  rationale: Глагол буквально передаёт движение вверх, но здесь означает доставку из Египта в Хеврон. «Перенести» естественно описывает перемещение останков, а «туда» ясно соотносится с Хевроном.
- source_word: τὰ ὀστᾶ αὐτοῦ
  choice: его кости
  rationale: Сохранено буквальное и ясное обозначение останков.
- source_word: ἐν πολέμῳ Αἰγυπτίων
  choice: во время войны с египтянами
  rationale: Генитив Αἰγυπτίων допускает связь войны с египтянами без однозначного указания, была ли это их война или война против них. Русская формулировка естественна, хотя предлог «с» слегка конкретизирует отношение.
- source_word: κρυφῇ
  choice: тайно
  rationale: Наречие непосредственно указывает на скрытный характер перенесения.
theological_decisions: []
