  text: Καὶ ὡς¹ συνετέλεσεν² Συμεὼν ἐντελλόμενος³ τοῖς υἱοῖς⁴ αὐτοῦ⁵, ἐκοιμήθη⁶ *μετὰ τῶν πατέρων αὐτοῦ⁷ *ὢν ἐτῶν ἑκατὸν εἴκοσι⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/001.yaml
  text: And when Simeon had finished commanding his sons, he fell asleep with his fathers, being one hundred and twenty years old.
translation:
  language: ru
  text: И когда Симеон закончил давать наставления своим сыновьям, он почил с отцами своими в возрасте ста двадцати лет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετέλεσεν ἐντελλόμενος
  choice: закончил давать наставления
  rationale: Передаёт завершённость действия συνετέλεσεν и смысл ἐντέλλομαι как наставления или завещательного повеления; по-русски звучит естественнее буквального «закончил, заповедуя».
- source_word: ἐκοιμήθη
  choice: почил
  rationale: Сохраняет традиционную метафору сна как смерти и достойный повествовательный регистр.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: с отцами своими
  rationale: 'Сохраняет библейскую формулу и её возможные оттенки: смерть и приобщение к предкам.'
- source_word: ὢν ἐτῶν ἑκατὸν εἴκοσι
  choice: в возрасте ста двадцати лет
  rationale: Естественная современная русская передача греческой возрастной конструкции.
theological_decisions:
- issue: Метафора смерти и связь с предками
  choice: «почил с отцами своими»
  alternative: «умер и присоединился к своим предкам»
  rationale: Выбранная формулировка не сводит образ к одному толкованию и сохраняет богословскую и образную напряжённость оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским, торжественным оттенком. Архаическая инверсия «с отцами своими» сохранена как устойчивая формула; остальной синтаксис сделан естественным и ясным.
