  text: Ἐὰν γάρ²¹ τις ἐπὶ Κύριον καταφύγῃ, *ἀποτρέχει τὸ πονηρὸν πνεῦμα ἀπʼ αὐτοῦ²², καὶ γίνεται ἡ διάνοια²³ κούφη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/005.yaml
  text: For if anyone takes refuge in the Lord, the evil spirit runs away from him, and the mind becomes light.
translation:
  language: ru
  text: Ибо если кто прибегает к Господу, злой дух убегает от него, и ум его становится лёгким.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «разум его становится лёгким»; образ может означать освобождение от гнетущей тяжести.'
    reason: Греческое κούφη буквально сохраняет образ «лёгкого» ума/разума и допускает близкие оттенки, которые не следует сводить к одному толкованию.
lexical_decisions:
- source_word: ἐπὶ Κύριον καταφύγῃ
  choice: прибегнет к Господу
  rationale: Передаёт образ обращения к Господу как к убежищу и естественно звучит в современном литературном русском.
- source_word: ἀποτρέχει
  choice: убежит
  rationale: 'Сохраняет конкретное и энергичное значение глагола: злой дух отбегает прочь от человека.'
- source_word: τὸ πονηρὸν πνεῦμα
  choice: злой дух
  rationale: Прямое и контекстуально естественное соответствие греческому выражению.
- source_word: ἡ διάνοια
  choice: разум
  rationale: Обозначает внутреннюю мыслительную способность, сознание или ум; «разум» здесь понятен и не сужает выражение до отдельной мысли.
- source_word: κούφη
  choice: лёгким
  rationale: 'Сохраняет образную неоднозначность греческого прилагательного: разум освобождается от тяжести или бремени.'
theological_decisions:
- issue: Характер связи между обращением к Господу и бегством злого духа
  choice: Сохранено прямое условно-следственное высказывание оригинала
  alternative: Ослабить связь формулировкой «может отступить»
  rationale: Греческий текст говорит определённо и не содержит модального смягчения.
- issue: Значение «разум станет лёгким»
  choice: Сохранена метафора лёгкости
  alternative: Истолковать как «разум обретёт покой» или «освободится»
  rationale: Такие варианты яснее, но устраняют подлинную образность и возможную смысловую многозначность κούφη.
translation_notes:
  register: Современный литературный русский с достоинством и библейской краткостью. Формула «прибегнет к Господу» естественна для религиозного контекста; образ «разум станет лёгким» намеренно сохранён и пояснён сноской.
