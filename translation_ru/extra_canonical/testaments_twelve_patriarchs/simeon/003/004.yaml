base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/004.yaml
  text: For two years, then, in fear of the Lord I afflicted my soul with fasting, and I learned that the release from envy comes through fear of God.
translation:
  language: ru
  text: Итак, два года в страхе Господнем я изнурял свою душу постом и понял, что освобождение от зависти приходит через страх Божий.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάκωσα τὴν ψυχήν μου
  choice: я изнурял свою душу
  rationale: Передаёт намеренное самоограничение и страдание посредством поста, сохраняя библейскую образность выражения «душу мою» без неестественного буквального «причинял зло».
- source_word: ἐν νηστείᾳ
  choice: постом
  rationale: Естественный русский инструментальный оборот точно указывает средство, посредством которого говорящий изнурял себя.
- source_word: ἡ λύσις τοῦ φθόνου
  choice: освобождение от зависти
  rationale: λύσις обозначает развязывание, прекращение или избавление; выбранная формулировка сохраняет образ выхода из власти зависти и соответствует управлению в современном русском языке.
- source_word: διὰ φόβου θεοῦ
  choice: через страх Божий
  rationale: Сохраняет причинно-посредническое значение διά с родительным и традиционный, понятный современному читателю библейский оборот.
theological_decisions:
- issue: Характер «страха Господня / Божия»
  choice: Сохранить выражения «в страхе Господнем» и «через страх Божий» без поясняющей замены.
  alternative: Передать как «в благоговении перед Господом» или «благодаря почтению к Богу».
  rationale: Греческий текст прямо употребляет φόβος; замена на «благоговение» сузила бы семантическое напряжение и внесла бы толкование в основной текст.
- issue: Связь между страхом Божиим и освобождением от зависти
  choice: «приходит через страх Божий»
  alternative: «достигается благодаря страху Божию».
  rationale: Формулировка сохраняет γενική конструкцию и γίνεται, не уточняя сверх текста, является ли страх причиной, средством или духовной средой освобождения.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. «Итак» отражает οὖν; традиционные сочетания «страх Господень» и «страх Божий» сохранены как общеупотребительные в религиозной речи. Маркеры сносок не требуются.
