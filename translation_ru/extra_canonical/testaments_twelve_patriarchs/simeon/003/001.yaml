  source_fidelity: '«И теперь, дети мои, послушайте меня и берегитесь духа заблуждения и зависти» точно передаёт последовательность греческого текста: καὶ νῦν, τέκνα μου, ἀκούσατέ μου, φυλάξασθε ἀπό. «Берегитесь» адекватно выражает φυλάξασθε ἀπό. Конструкция «духа заблуждения и зависти» сохраняет единственное πνεύματος и не вносит догматического уточнения; повторный артикль при τοῦ φθόνου может координировать второй родительный член и не требует перевода как двух отдельных «духов».'
  naturalness: Фраза звучит естественно на современном литературном русском и сохраняет краткий наставительный, несколько торжественный тон. Обращение «дети мои» уместно для завещательного наставления.
  terminology: «Дух заблуждения» является точным и нейтральным соответствием τὸ πνεῦμα τῆς πλάνης; он не сужает πλάνη до намеренного обмана. «Зависть» точно передаёт φθόνος. Имена и специальные термины отсутствуют. Отдельные переводные сноски или их якоря в представленном русском черновике не требуются.
