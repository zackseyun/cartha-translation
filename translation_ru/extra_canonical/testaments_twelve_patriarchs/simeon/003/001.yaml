  text: Καὶ νῦν, τέκνα¹ μου² Γἀκούσατέ μου καὶ¹³ φυλάξασθε⁴ ἀπὸ *τοῦ πνεύματος⁵ τῆς πλάνης καὶ τοῦ φθόνου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/001.yaml
  text: And now, my children, hear me and guard yourselves against the spirit of deceit and envy.
translation:
  language: ru
  text: И теперь, дети мои, послушайте меня и берегитесь духа заблуждения и зависти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: дети мои
  rationale: Естественное и достойное обращение, точно передающее родственное τέκνα и притяжательное μου.
- source_word: ἀκούσατέ μου
  choice: послушайте меня
  rationale: Императив аориста передан естественным русским призывом внимательно принять наставление.
- source_word: φυλάξασθε ἀπό
  choice: берегитесь
  rationale: Возвратный императив с ἀπό выражает предостережение и требование оградить себя от опасности; «берегитесь» кратко и естественно передаёт эту конструкцию.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: дух заблуждения
  rationale: Сохраняется буквальный образ «духа» и смысл πλάνη как заблуждения или уклонения от истины без неоправданного сужения до намеренного обмана.
- source_word: φθόνος
  choice: зависть
  rationale: Прямой и общепонятный русский эквивалент греческого обозначения зависти.
theological_decisions:
- issue: Связь родительных πλάνης и φθόνου со словом πνεύματος
  choice: «духа заблуждения и зависти» — оба понятия отнесены к одному духу
  alternative: «духа заблуждения и [духа] зависти» либо понимание зависти как отдельной опасности
  rationale: Единственный артикль и существительное πνεύματος естественно охватывают оба соединённых καί родительных; перевод сохраняет греческую синтаксическую компактность, не уточняя природу этого «духа».
translation_notes:
  register: Современный литературный русский; наставительный, торжественный, но понятный регистр. Пунктуация не перегружена, поскольку ряд императивов образует единый призыв.
