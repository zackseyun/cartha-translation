source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ γὰρ ὁ φθόνος κυριεύει *πάσης τῆς διανοίας τοῦ ἀνθρώπου⁶ καὶ οὐκ ἀφίησιν⁷ αὐτὸν Γοὔτε φαγεῖν, οὔτε πιεῖν, οὔτε¹ ποιῆσαί τι⁸ ἀγαθόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/002.yaml
  text: For envy masters the whole mind of a person, and does not allow him either to eat or to drink or to do anything good.
translation:
  language: ru
  text: Ибо зависть господствует над всем разумом человека и не позволяет ему ни есть, ни пить, ни делать ничего доброго.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνος
  choice: зависть
  rationale: Прямой и естественный русский эквивалент, сохраняющий нравственный смысл греческого слова.
- source_word: κυριεύει
  choice: овладевает
  rationale: Передаёт господство зависти над внутренней жизнью человека и звучит естественнее буквального «господствует над» в данном контексте.
- source_word: πάσης τῆς διανοίας
  choice: всеми помыслами
  rationale: «Помыслы» передают совокупность мыслей и внутренних устремлений; множественное число естественно выражает всеохватность πάσης.
- source_word: οὐκ ἀφίησιν
  choice: не позволяет
  rationale: Точно передаёт значение недопущения или воспрепятствования.
- source_word: ποιῆσαί τι ἀγαθόν
  choice: делать что-либо доброе
  rationale: Сохраняет неопределённость τι и нравственное содержание ἀγαθόν без стилистического утяжеления.
theological_decisions:
- issue: Степень власти зависти над человеком
  choice: «овладевает всеми помыслами человека»
  alternative: «господствует над всем разумом человека»
  rationale: Формулировка сохраняет сильный образ господства и всеохватность исходного текста, но не превращает высказывание в специальное учение о природе разума или свободной воли.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной речи; синтаксический параллелизм «ни есть, ни пить, ни делать» сохранён. Маркеры сносок не требуются.
