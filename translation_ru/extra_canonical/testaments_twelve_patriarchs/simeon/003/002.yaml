  to: Ибо зависть господствует над всем разумом человека и не позволяет ему ни есть, ни пить, ни делать ничего доброго.
  rationale: Заменено «овладевает всеми помыслами» на «господствует над всем разумом», чтобы сохранить единственное число и объём διανοία, а также прямое значение κυριεύει. В заключительной части «ничего доброго» естественно выражает невозможность совершить какой бы то ни было добрый поступок. Критические цифровые знаки в предоставленном греческом тексте не снабжены содержанием примечаний, поэтому переносить их в русский текст или создавать к ним примечания нельзя.
