id: T12P.SIM.3.3
reference: Testament of Simeon 3:3
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἀλλὰ⁹ *πάντοτε ὑποβάλλει¹⁰ ἀνελεῖν¹¹ τὸν φθονούμενον· *καὶ ὁ μὲν φθονούμενος πάντοτε ἀνθεῖ, ὁ δὲ φθονῶν μαραίνεται¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/003.yaml
  text: But it always urges him to kill the one envied; and the one envied always flourishes, while the one who envies wastes away.
translation:
  language: ru
  text: Но она постоянно подстрекает убить того, кому завидуют; и тот, кому завидуют, всегда расцветает, а завистник увядает.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποβάλλει
  choice: подстрекает
  rationale: Передаёт побуждение к злому действию естественным современным русским глаголом; подразумеваемое подлежащее женского рода восстанавливается из контекста как зависть.
- source_word: ἀνελεῖν
  choice: убить
  rationale: В данном контексте инфинитив означает лишить жизни, а не более общее «устранить».
- source_word: τὸν φθονούμενον
  choice: того, кому завидуют
  rationale: Точно и естественно передаёт страдательное причастие без тяжеловесного «объект зависти».
- source_word: ἀνθεῖ
  choice: расцветает
  rationale: Сохраняет растительную метафору процветания и явный контраст с μαραίνεται.
- source_word: ὁ φθονῶν μαραίνεται
  choice: завистник увядает
  rationale: Лаконично передаёт субстантивированное причастие и сохраняет образ увядания.
theological_decisions:
- issue: Подразумеваемое подлежащее глагола ὑποβάλλει
  choice: «она», то есть зависть, по контексту
  alternative: Безличное «это» или явное повторение «зависть»
  rationale: Греческий текст опускает подлежащее, опираясь на ближайший контекст; русское местоимение сохраняет связность, не добавляя толкования в сам стих.
translation_notes:
  register: Современный литературный русский язык; сохранены параллелизм, антитеза и метафорическая пара «расцветает — увядает». Терминология проста, но выдержана в достойном повествовательном регистре.
