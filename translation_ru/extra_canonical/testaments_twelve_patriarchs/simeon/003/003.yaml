  source_fidelity: 'Текст точно передаёт греческую антитезу: зависть побуждает к убийству того, кому завидуют; объект зависти «расцветает», тогда как завидующий «увядает». «Подстрекает убить» адекватно передаёт ὑποβάλλει ἀνελεῖν. Женское «она» оправданно восстанавливает зависть из непосредственного контекста, не внося нового смысла.'
