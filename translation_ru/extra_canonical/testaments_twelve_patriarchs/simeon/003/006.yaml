  text: Καὶ λοιπὸν συμπαθεῖ²⁴ τῷ φθονουμένῳ²⁵, καὶ²⁶ συγγινώσκει²⁷ *τοῖς ἀγαπῶσιν²⁸ αὐτόν²⁹, καὶ οὕτως³⁰ παύεται τοῦ φθόνου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/006.yaml
  text: And from then on he has compassion for the one envied, and forgives those who love him, and so he ceases from envy.
translation:
  language: ru
  text: И впредь он сочувствует тому, кому завидуют, прощает любящих его и так перестаёт завидовать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιπόν
  choice: с тех пор
  rationale: 'В данном контексте обозначает последующее изменение состояния: «отныне, впредь».'
- source_word: συμπαθεῖ τῷ φθονουμένῳ
  choice: сострадает тому, кому завидовал
  rationale: Передаёт сочувствие к объекту зависти; прошедшее «завидовал» естественно по-русски связывает выражение с последующим прекращением зависти.
- source_word: συγγινώσκει
  choice: прощает
  rationale: В контексте нравственного наставления глагол означает снисходительно относиться, прощать.
- source_word: παύεται τοῦ φθόνου
  choice: освобождается от зависти
  rationale: Естественно передаёт прекращение состояния зависти без добавления причинного толкования.
theological_decisions:
- issue: Референт местоимения αὐτόν во фразе τοῖς ἀγαπῶσιν αὐτόν
  choice: любящих его
  alternative: любящих того, кому он завидовал
  rationale: Греческое местоимение допускает референциальную неоднозначность; русский текст сохраняет её, не уточняя референта.
translation_notes:
  register: Современный литературный русский язык; лаконичный нравоучительный стиль. Синтаксис сохранён близким к греческой последовательности, но сделан естественным для русского читателя.
