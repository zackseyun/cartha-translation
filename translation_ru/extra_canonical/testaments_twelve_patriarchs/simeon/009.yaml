  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/009.yaml
  text: And the sons of Simeon wept for their father[c][b][a]. And they were in Egypt until the day of their departure by the hand of Moses.
translation:
  language: ru
  text: И оплакали сыновья Симеона своего отца. И были они в Египте до дня их исхода[a] рукою Моисея[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «до дня их выхода».'
    reason: lexical_alternative
  - marker: b
    text: «Рукою Моисея» — библейский оборот со значением «через Моисея» или «под предводительством Моисея».
    reason: cultural_note
  - marker: c
    text: 'Сразу после этой заключительной строки в источнике следует заглавие следующего произведения: «Завещание Левия, третьего сына Иакова и Лии». Оно не относится к девятой главе Завещания Симеона.'
    reason: textual_variant
lexical_decisions:
- source_word: ἔκλαυσαν
  choice: оплакали
  rationale: Аорист κλαίω с прямым дополнением обозначает плач по умершему. «Оплакали» естественно передаёт завершённое действие и не предполагает сверх текста установленных погребальных обрядов.
- source_word: υἱοὶ Συμεών
  choice: сыновья Симеона
  rationale: В патриархальном и родословном контексте υἱοί точнее передаётся как «сыновья», а не более широким «дети».
- source_word: εἰς Αἴγυπτον
  choice: в Египте
  rationale: При ἦσαν оборот с εἰς идиоматически обозначает местонахождение или продолжающееся пребывание, а не движение внутрь.
- source_word: ἕως ἡμέρας ἐξόδου αὐτῶν
  choice: до дня их исхода
  rationale: ἐξόδου означает выход или уход. Строчное «исхода» сохраняет значение нарицательного существительного и одновременно естественную историческую отсылку к выходу из Египта.
- source_word: ἐν χειρὶ Μωϋσῆ
  choice: рукою Моисея
  rationale: Сохранён библейский семитизированный оборот, выражающий посредничество или руководство Моисея; примечание разъясняет его смысл.
theological_decisions:
- issue: Следует ли понимать ἐξόδου как название события или книги
  choice: «исхода» со строчной буквы как нарицательное существительное
  alternative: «выхода» либо «Исхода» с прописной буквы
  rationale: В греческом тексте употреблено обычное существительное без указания на заглавие книги. Строчная буква сохраняет эту форму, не устраняя очевидной связи с историческим исходом из Египта.
- issue: Насколько буквально передавать ἐν χειρὶ Μωϋσῆ
  choice: Сохранить оборот «рукою Моисея»
  alternative: «через Моисея» или «под предводительством Моисея»
  rationale: Буквальный библейский оборот уместен в завещательном регистре и сохраняет образность источника; возможное значение посредничества и руководства раскрыто в примечании.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксический параллелизм двух предложений и начальное «И» сохранены. Архаизирующий оборот «рукою Моисея» оставлен намеренно ради образности и связи с языком Писания, но разъяснён в сноске.
