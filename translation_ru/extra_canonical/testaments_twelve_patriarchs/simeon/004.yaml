  text: 1[a]. Now my father kept asking about me, because he had seen me gloomy, and I told him, “My liver is swollen.” 2. For I was grieving more than all the others, because I was responsible for the sale of Joseph. 3. And when we went down into Egypt and he bound me as a spy, I knew that I was suffering justly, and I was not distressed. 4. But Joseph was a good man[b], and having the Spirit of God in him, being compassionate and merciful, he did not hold a grudge against me, but loved me along with my brothers. 5. Therefore guard yourselves, my children, from every jealousy and envy, and walk in simplicity of heart, so that God may also give you favor and glory and blessing upon your heads, just as you saw in Joseph. 6. All his days he did not reproach us about this matter, but he loved us as his own soul, and honored us above his own sons, and granted us riches and livestock and produce. 7. And you also, my children, let each one love his brother with a good heart, and the spirit of
    envy will depart from you. 8. For this makes the soul savage, and destroys the body; it brings anger and war to one’s designs, and provokes to bloodshed, and leads the mind into frenzy, and gives the soul upheaval and the body trembling. 9. For even in sleep envy, presenting to him visions of wickedness, consumes him and troubles his soul with evil spirits, and makes the body start up in fear, and wakes the mind in turmoil; and like an evil and venomous spirit[c][d], so he appears to people.
translation:
  language: ru
  text: '1. Отец всё расспрашивал обо мне, потому что видел меня мрачным, а я говорил ему: «У меня распухла печень».[a] 2. Ведь я скорбел больше всех, потому что был виновен в продаже Иосифа. 3. Когда мы сошли в Египет и он связал меня как лазутчика, я понял, что страдаю по справедливости, и не огорчался. 4. Но Иосиф был добрым человеком; имея в себе Дух Божий, он был сострадателен и милосерден, не держал на меня зла, а любил меня вместе с моими братьями. 5. Поэтому берегитесь, дети мои, всякой ревности и зависти и ходите в простоте сердца,[b] чтобы и вам Бог даровал милость, славу и благословение на ваши головы, как вы видели в Иосифе. 6. Во все свои дни он ни разу не упрекнул нас за это, но любил нас, как свою собственную душу, почитал нас выше своих сыновей и даровал нам богатство, скот и плоды земли. 7. И вы, дети мои, пусть каждый любит своего брата с добрым сердцем — и дух зависти отступит от вас. 8. Ведь зависть делает душу свирепой и разрушает тело; она вносит гнев и войну в помыслы,
    подстрекает к кровопролитию, доводит разум до исступления, повергает душу в смятение, а тело — в дрожь. 9. Даже во сне зависть пожирает человека, являя ему картины зла, тревожит его душу злыми духами, заставляет тело вздрагивать от страха, а ум пробуждает в смятении. И людям он кажется злым и ядовитым духом.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «у меня распухла печень» передают древний телесный образ внутренней муки или тяжёлого душевного состояния; Симеон объясняет отцу свой мрачный вид телесным недугом.
    reason: cultural_note
  - marker: b
    text: «Простота сердца» может также означать цельность, искренность и отсутствие лукавства.
    reason: lexical_alternative
  - marker: c
    text: 'Последнюю фразу можно понять и иначе: людям подобной злому и ядовитому духу кажется сама зависть, а не охваченный ею человек.'
    reason: alternative_reading
lexical_decisions:
- source_word: σκυθρωπόν
  choice: мрачным
  rationale: Передаёт заметное внешнее выражение подавленности естественным современным русским словом.
- source_word: τὰ ἤπατά μου ὀγκοῦμαι
  choice: у меня распухла печень
  rationale: Сохраняет конкретный древний телесный оборот, не подменяя его современным психологическим истолкованием; смысл пояснён в сноске.
- source_word: τῆς πράσεως Ἰωσήφ
  choice: в продаже Иосифа
  rationale: πρᾶσις конкретно обозначает продажу, а не предательство вообще.
- source_word: δικαίως πάσχω
  choice: страдаю по справедливости
  rationale: Сохраняет нравственно-судебный оттенок δικαίως без усилительного парафраза «получаю по заслугам».
- source_word: πνεῦμα θεοῦ ἐν αὐτῷ
  choice: имея в себе Дух Божий
  rationale: Следует причастной конструкции и сохраняет сильный богословский смысл выражения.
- source_word: ἁπλότητι καρδίας
  choice: в простоте сердца
  rationale: Сохраняет характерный этический образ внутренней цельности, искренности и отсутствия лукавства.
- source_word: ζήλου καὶ φθόνου
  choice: ревности и зависти
  rationale: Передаёт два близких, но отдельных греческих понятия; оба имеют здесь отрицательное значение.
- source_word: ἀγριοῖ
  choice: делает ... свирепой
  rationale: Передаёт буквальный образ одичания или озверения души.
- source_word: διαβουλίῳ
  choice: помыслы
  rationale: В контексте обозначает внутреннее обдумывание и намерения; русский вариант не сужает смысл до конкретного плана.
- source_word: εἰς ἔκστασιν ἄγει τὴν διάνοιαν
  choice: доводит разум до исступления
  rationale: Передаёт утрату нормального самообладания, не используя современное положительное значение слова «экстаз».
- source_word: ἰοβόλον
  choice: ядовитым
  rationale: Сохраняет образ несущего или извергающего яд зловредного духа.
theological_decisions:
- issue: πνεῦμα θεοῦ в Иосифе
  choice: Дух Божий
  alternative: дух Божий; дух от Бога
  rationale: Контекст естественно допускает действие или присутствие Божьего Духа; написание с прописной буквы отражает наиболее вероятное чтение, не развивая его в конфессиональную формулу.
- issue: Различение ψυχή, σῶμα, διάνοια и πνεῦμα
  choice: душа, тело, разум/ум и дух
  alternative: жизнь/я, тело, сознание и духовная сила
  rationale: Текст намеренно использует ряд различных антропологических понятий; их следует сохранять, а не сводить к единой современной психологической терминологии.
- issue: Неясный субъект финальной фразы 4:9
  choice: «он» — завистливый человек
  alternative: «она» — зависть
  rationale: Греческое οὕτως φαίνεται допускает связь как с человеком, так и с олицетворённой завистью; основной текст выбирает естественное грамматическое продолжение, а сноска сохраняет альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксис преимущественно ясный и плавный, но конкретные древние образы и различия между душой, телом, умом и духом сохранены. Архаизм «соглядатай» употреблён точечно как узнаваемое библейское обозначение шпиона.
