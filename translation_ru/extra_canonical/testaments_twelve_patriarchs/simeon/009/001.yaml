- from: И оплакивали сыновья Симеона своего отца. И были они в Египте до дня своего исхода под предводительством Моисея.
  to: И оплакивали сыновья Симеона своего отца. И были они в Египте до дня своего исхода рукою Моисея.
  rationale: Заменено только «под предводительством Моисея» на «рукою Моисея», чтобы не ограничивать ἐν χειρὶ одним толкованием и согласовать русский текст с греческим оригиналом и английским контрольным переводом «by the hand of Moses».
