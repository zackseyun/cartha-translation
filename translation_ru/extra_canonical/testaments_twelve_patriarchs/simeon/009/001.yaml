base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/009/001.yaml
  text: And the sons of Simeon wept for their father. And they were in Egypt until the day of their departure by the hand of Moses.
translation:
  language: ru
  text: И оплакивали сыновья Симеона своего отца. И были они в Египте до дня своего исхода рукою Моисея.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαυσαν
  choice: оплакивали
  rationale: В контексте смерти отца глагол означает не просто плач, а скорбный плач по умершему; «оплакивали» естественно и точно передаёт этот смысл.
- source_word: ἦσαν εἰς Αἴγυπτον
  choice: были в Египте
  rationale: Сохраняет простое значение ἦσαν и не добавляет оттенка «оставались», отсутствующего в греческом тексте.
- source_word: ἡμέρας ἐξόδου αὐτῶν
  choice: дня своего исхода
  rationale: «Исход» передаёт ἔξοδος и сохраняет вероятную связь с исходом из Египта, не сводя выражение к нейтральному «отправлению».
- source_word: ἐν χειρὶ Μωϋσῆ
  choice: под предводительством Моисея
  rationale: Буквальное «рукою Моисея» в данном контексте является семитизированным обозначением посредничества или руководства; выбранная формулировка естественна по-русски и передаёт роль Моисея.
theological_decisions:
- issue: Значение выражения ἐν χειρὶ Μωϋσῆ
  choice: под предводительством Моисея
  alternative: рукою Моисея
  rationale: Контекст говорит об исходе народа под руководством Моисея. Перевод не приписывает Моисею самостоятельной спасительной силы и не вводит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксический повтор «И… И…» сохранён как черта исходного повествования; устаревшие обороты не используются.
