  revised_text: '1. Послушайте, дети мои, Симеона, вашего отца, и я поведаю вам то, что у меня на сердце.


    2. Я родился у Иакова вторым сыном, и мать моя Лия назвала меня Симеоном, потому что Господь услышал её мольбу.


    3. Я стал очень силён: не отступал ни перед каким делом и ничего не боялся.


    4. Ибо сердце моё было жестоко, печень непреклонна, а внутренности не знали сострадания.[a]


    5. Ведь и мужество даётся Всевышним людям — в душе и теле.


    6. В юности я сильно завидовал Иосифу, потому что отец мой любил его больше всех.


    7. Я обратил против него свою печень, решив убить его, потому что властитель заблуждения и дух зависти ослепили мой ум, так что я не видел в нём брата и не щадил даже отца моего Иакова.[a]


    8. Но его Бог, Бог наших отцов, послал Своего ангела и избавил его от моих рук.


    9. Когда я пошёл в Сихем принести мазь для наших стад, а Рувим — в Дофан, где находились нужные нам припасы и все наши запасы, брат мой Иуда, придя к измаильтянам, продал им Иосифа.[b]


    10. Услышав об этом, Рувим опечалился, потому что хотел отвести его к отцу.


    11. Я же, услышав об этом, сильно разгневался на Иуду за то, что он отпустил Иосифа живым, и пять месяцев гневался на него.[c]


    12. Но Господь сокрушал меня и лишил меня силы действовать: моя правая рука на семь дней наполовину усохла.


    13. Тогда я понял, дети мои, что это случилось со мной из-за Иосифа. Я переменил образ мыслей, плакал и молился Господу Богу, чтобы рука моя восстановилась и чтобы я воздерживался от всякой скверны, зависти и всякого безрассудства.


    14. Ибо я понял, что замыслил зло пред Господом и пред отцом моим Иаковом из-за брата моего Иосифа, которому позавидовал.'
