  source_fidelity: В целом перевод точно следует греческому тексту и верно сохраняет телесно-эмоциональную образность, безымянность «властителя заблуждения» и личный характер выводов Симеона. Однако в ст. 5 конструкция «Всевышним — душе и телу» меняет греческое «людям в душах и телах» и по-русски неудачна. В ст. 7 полезно явнее сохранить образ «печени», намеренно направленной против Иосифа.
