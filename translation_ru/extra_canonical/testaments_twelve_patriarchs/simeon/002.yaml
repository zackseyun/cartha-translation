base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002.yaml
  text: '1. Hear, my children, Simeon your father, and I will declare to you what I have in my heart.

    2. I was born from Jacob as the second son to my father, and Leah my mother called me Simeon, because the Lord heard her petition.

    3. For I became very strong; I did not shrink from any deed, nor was I afraid in any matter.

    4. For my heart was hard, and my liver unmoved, and my inward parts without compassion.

    5. For courage also is given by the Most High to men in soul and in body.

    6. But in the time of my youth I was very jealous of Joseph, because my father loved him above all.

    7. And I set my liver against him so as to kill him, because the ruler of deceit and the spirit of jealousy blinded my mind, so that I did not regard him as a brother, nor even spare Jacob my father.

    8. But his God and the God of our fathers sent his angel and rescued him from my hands.

    9. For when I went to Shechem to bring ointment for our flocks, and Reuben to Dothan, where our supplies and all our stores were, Judah my brother sold him to the Ishmaelites.

    10. And when Reuben heard these things, he was grieved, for he wanted to bring him back safely to our father.

    11. But when I heard this, I was very angry with Judah, because he had let him go alive;

    12. and for five months I was sick in my liver. And the Lord struck me, and my hand was withered for seven days.

    13. And I knew, my children, that this happened to me because of Joseph. And after changing my mind I wept and prayed to the Lord God that my hand might be restored, and that I might abstain from every defilement and envy and from all foolishness.

    14. For I knew that I had devised an evil thing before the Lord and against Jacob my father concerning Joseph my brother, by envying him.'
translation:
  language: ru
  text: '1. Послушайте, дети мои, Симеона, вашего отца, и я поведаю вам то, что у меня на сердце.


    2. Я родился у Иакова вторым сыном, и мать моя Лия назвала меня Симеоном, потому что Господь услышал её мольбу.


    3. Я стал очень силён: не отступал ни перед каким делом и ничего не боялся.


    4. Ибо сердце моё было жестоко, печень непреклонна, а внутренности не знали сострадания.[a]


    5. Ведь и мужество даётся Всевышним людям — в душе и теле.


    6. В юности я сильно завидовал Иосифу, потому что отец мой любил его больше всех.


    7. Я обратил против него свою печень, решив убить его, потому что властитель заблуждения и дух зависти ослепили мой ум, так что я не видел в нём брата и не щадил даже отца моего Иакова.[a]


    8. Но его Бог, Бог наших отцов, послал Своего ангела и избавил его от моих рук.


    9. Когда я пошёл в Сихем принести мазь для наших стад, а Рувим — в Дофан, где находились нужные нам припасы и все наши запасы, брат мой Иуда, придя к измаильтянам, продал им Иосифа.[b]


    10. Услышав об этом, Рувим опечалился, потому что хотел отвести его к отцу.


    11. Я же, услышав об этом, сильно разгневался на Иуду за то, что он отпустил Иосифа живым, и пять месяцев гневался на него.[c]


    12. Но Господь сокрушал меня и лишил меня силы действовать: моя правая рука на семь дней наполовину усохла.


    13. Тогда я понял, дети мои, что это случилось со мной из-за Иосифа. Я переменил образ мыслей, плакал и молился Господу Богу, чтобы рука моя восстановилась и чтобы я воздерживался от всякой скверны, зависти и всякого безрассудства.


    14. Ибо я понял, что замыслил зло пред Господом и пред отцом моим Иаковом из-за брата моего Иосифа, которому позавидовал.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В древнем языке «печень» и «внутренности» могли обозначать средоточие чувств, воли и сострадания.
    reason: Без пояснения буквальный телесный образ может быть неверно понят современным русским читателем.
  - marker: b
    text: Смысл слова, переведённого как «мазь», и синтаксис этого предложения не вполне ясны; текст, вероятно, описывает раздельные поездки Симеона и Рувима.
    reason: Сохраняет реальную лексическую и синтаксическую неопределённость греческого текста.
  - marker: c
    text: Греческий текст говорит, что Симеон пять месяцев гневался на Иуду. Чтение английского консультационного текста «пять месяцев болел печенью» не соответствует приведённому греческому тексту.
    reason: Фиксирует существенное расхождение исходного греческого свидетельства с английским слоем и объясняет перевод.
lexical_decisions:
- source_word: τὰ ἤπατά / τὰ σπλάγχνα
  choice: печень / внутренности
  rationale: Сохранён древний телесно-эмоциональный образ исходного текста, хотя по-русски он непривычен; пояснение дано в сноске.
- source_word: ἀνδρεία
  choice: мужество
  rationale: Передаёт стойкость и отвагу, а не только физическую силу.
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: властитель заблуждения
  rationale: Сохраняет личностный титул и неоднозначность πλάνη, не отождествляя фигуру с конкретным именем.
- source_word: τὸ πνεῦμα τοῦ ζήλου
  choice: дух зависти
  rationale: В контексте отношения Симеона к Иосифу ζῆλος имеет отрицательный смысл ревнивой зависти.
- source_word: ἔλαιμμα
  choice: мазь
  rationale: Буквальное значение редкого слова; предмет и назначение остаются не вполне ясными.
- source_word: ἐκώλυσεν δράσιν ἀπ’ ἐμοῦ
  choice: лишил меня силы действовать
  rationale: Естественно передаёт буквальное «удержал/воспрепятствовал действию от меня» в связи с поражением руки.
- source_word: ἡμίξηρος
  choice: наполовину усохла
  rationale: Сохраняет компонент ἡμι- «наполовину», отсутствующий в более общем переводе «усохла».
- source_word: μετανοήσας
  choice: переменил образ мыслей
  rationale: Передаёт смысл внутренней перемены без автоматического привнесения поздней конфессиональной терминологии.
- source_word: μολυσμός
  choice: скверна
  rationale: Достоинственный и понятный эквивалент нравственного осквернения.
theological_decisions:
- issue: Личность «властителя заблуждения»
  choice: Сохранён безымянный титул
  alternative: дьявол / сатана
  rationale: Греческий текст не называет эту фигуру прямо; конкретизация сняла бы исходную неоднозначность.
- issue: Действие ангела в спасении Иосифа
  choice: Бог послал ангела и избавил Иосифа
  alternative: ангел самостоятельно спас Иосифа
  rationale: Сохранена грамматика текста, где Бог является действующим субъектом обоих глаголов.
- issue: Связь телесного наказания с Иосифом
  choice: Симеон сам понимает случившееся как следствие своего отношения к Иосифу
  alternative: прямое авторское утверждение универсального принципа воздаяния
  rationale: Перевод не расширяет личное истолкование Симеона до общего догматического положения.
- issue: μετανοέω в стихе 13
  choice: переменил образ мыслей
  alternative: покаялся
  rationale: 'Выбор сохраняет лексическую широту глагола и последовательность рассказа: внутренняя перемена выражается плачем, молитвой и отказом от пороков.'
translation_notes:
  register: 'Современный литературный русский с достоинством завещательной речи. Синтаксис упрощён там, где буквальное воспроизведение затемняло бы смысл, но сохранены древние антропологические образы, личностные духовные силы и неоднозначность редких слов. Имена переданы в привычной русской библейской форме: Симеон, Иаков, Лия, Иосиф, Рувим, Иуда, Сихем, Дофан.'
