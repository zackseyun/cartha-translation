  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003.yaml
  text: And now[a], my children, hear me, and guard yourselves from the spirit of deceit and envy. For envy masters a man's whole mind, and does not allow him either to eat or to drink or to do anything good. But it is always urging him to kill the one envied; and while the one envied is always flourishing, the one who envies wastes away[b]. For two years, then, in the fear of the Lord I afflicted my soul with fasting, and I learned that release from envy comes through the fear of God. For if anyone flees for refuge to the Lord, the evil spirit runs away from him, and his mind becomes light. And from then on he has compassion on the one envied, and forgives those who love him[c], and so he ceases from envy.
translation:
  language: ru
  text: III. И теперь, дети мои, послушайте меня и берегитесь духа обмана[a] и зависти. 2. Ведь зависть овладевает всем разумом человека и не даёт ему ни есть, ни пить, ни делать что-либо доброе. 3. Она непрестанно подстрекает его убить того, кому завидуют; и в то время как тот, кому завидуют, неизменно расцветает, завистник увядает[b]. 4. Итак, два года я в страхе Господнем изнурял свою душу постом и понял, что освобождение от зависти приходит через страх Божий. 5. Ведь если кто прибегает к Господу, злой дух бежит от него, и ум его становится лёгким. 6. И впредь он сочувствует тому, кому завидуют, прощает любящих его[c] и так перестаёт завидовать.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «духа заблуждения» либо «духа обольщения». Греческое πλάνη может обозначать как обман, так и уклонение в заблуждение.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «тот, кому завидуют… тот, кто завидует». Греческие причастия подчёркивают противопоставление между предметом зависти и завистником.'
    reason: lexical_alternative
  - marker: c
    text: Выражение «любящих его» может относиться либо к тому, кому завидуют, либо к человеку, исцеляющемуся от зависти; краткое греческое местоимение допускает оба понимания.
    reason: alternative_reading
lexical_decisions:
- source_word: φυλάξασθε
  choice: берегитесь
  rationale: Возвратный императив выражает предостережение и нравственную бдительность; «берегитесь» естественно звучит в отеческом наставлении.
- source_word: πνεῦμα τῆς πλάνης
  choice: дух обмана
  rationale: πλάνη может означать обман, заблуждение или введение в заблуждение. «Дух обмана» передаёт нравственно разлагающую силу выражения, а неоднозначность отмечена в сноске.
- source_word: φθόνος
  choice: зависть
  rationale: Речь идёт о враждебном недовольстве благополучием другого; единый перевод сохранён во всей главе.
- source_word: κυριεύει πάσης τῆς διανοίας τοῦ ἀνθρώπου
  choice: овладевает всеми помыслами человека
  rationale: κυριεύει обозначает господство, а διάνοια здесь охватывает мышление и внутренние намерения. «Помыслы» сохраняет нравственно-психологический оттенок.
- source_word: ὑποβάλλει ἀνελεῖν
  choice: подстрекает его убить
  rationale: ὑποβάλλει выражает постоянное внутреннее побуждение, а ἀνελεῖν имеет резкий смысл убийства или устранения; перевод не смягчает силу оригинала.
- source_word: ἀνθεῖ / μαραίνεται
  choice: расцветает / увядает
  rationale: Сохранена намеренная образная антитеза двух греческих глаголов.
- source_word: ἐκάκωσα τὴν ψυχήν μου ἐν νηστείᾳ
  choice: изнурял свою душу постом
  rationale: Перевод сохраняет суровый аскетический смысл выражения и передаёт пост как средство такого самоограничения.
- source_word: λύσις τοῦ φθόνου
  choice: освобождение от зависти
  rationale: λύσις означает развязывание или освобождение; русская формулировка сохраняет образ избавления от сковывающего порока.
- source_word: γίνεται ἡ διάνοια κούφη
  choice: ум его становится лёгким
  rationale: Буквальный образ облегчения сохранён без добавочного толкования вроде «успокаивается» или «освобождается».
- source_word: συμπαθεῖ τῷ φθονουμένῳ
  choice: начинает сочувствовать тому, кому завидовал
  rationale: συμπαθεῖ передаёт сострадание или сочувствие; добавленное временное значение «завидовал» ясно обозначает перемену, уже выраженную контекстом.
- source_word: συγγινώσκει τοῖς ἀγαπῶσιν αὐτόν
  choice: прощает любящих его
  rationale: συγγινώσκει допускает смысл снисхождения или прощения. Краткость местоименной конструкции сохранена, а неоднозначность её референта отмечена в сноске.
theological_decisions:
- issue: Передача κύριος и θεός в иудейском наставительном тексте
  choice: Господь / Бог
  alternative: ГОСПОДЬ / Бог
  rationale: Греческий текст употребляет Κύριον и θεοῦ без прямой ветхозаветной цитаты, поэтому обычные русские формы «Господь» и «Бог» точнее отражают непосредственный источник.
- issue: Личная духовная сила в выражении τὸ πονηρὸν πνεῦμα
  choice: злой дух
  alternative: злое побуждение
  rationale: Определённая форма и олицетворённое бегство поддерживают личностное прочтение; перевод сохраняет духовно-психологическое напряжение и не сводит выражение к одной лишь метафоре.
- issue: Связь освобождения от зависти со страхом Божьим
  choice: освобождение от зависти приходит через страх Божий
  alternative: зависть ослабевает благодаря благоговению перед Богом
  rationale: Более буквальная формулировка сохраняет одновременно образ освобождения и богословски весомое выражение «страх Божий», не заменяя его интерпретирующим парафразом.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксис сделан ясным для широкого читателя, при этом сохранены суровая образность поста, антитеза «расцветает / увядает», буквальный образ облегчённого ума и неоднозначность местоимения в стихе 6.
