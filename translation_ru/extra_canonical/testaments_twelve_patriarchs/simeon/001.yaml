base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/001.yaml
  text: 'A copy[a] of the words of Simeon, which he spoke to his sons before he died, in the hundred and twentieth year of his life, at the time when Joseph his brother died. And when Simeon was sick, his sons came to visit him; and gathering his strength, he sat up and kissed them[b], and said:'
translation:
  language: ru
  text: 'Завещание Симеона, второго сына Иакова и Лии


    1. Запись[a] слов Симеона, которые он произнёс своим сыновьям перед смертью, на сто двадцатом году своей жизни, в то время, когда умер его брат Иосиф. 2. Когда Симеон был болен, сыновья пришли навестить его. Собравшись с силами, он сел, расцеловал их[b] и сказал:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Копия слов Симеона».'
    reason: lexical_alternative
  - marker: b
    text: Греческий глагол может обозначать усиленное, неоднократное или особенно сердечное целование.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: Запись
  rationale: Слово обозначает письменное воспроизведение или документальную запись. «Запись» естественно звучит по-русски в заголовке и не сужает значение исключительно до физической копии; буквальная альтернатива указана в сноске.
- source_word: λόγων
  choice: слов
  rationale: Формально и без лишней интерпретации передаёт завещательные речи Симеона.
- source_word: πρὸ τοῦ ἀποθανεῖν
  choice: перед смертью
  rationale: Естественная русская временная конструкция, точно передающая действие до смерти Симеона.
- source_word: ἐν ἑκατοστῷ εἰκοστῷ ἔτει
  choice: на сто двадцатом году своей жизни
  rationale: Сохраняет формальную хронологическую формулу оригинала и отличается от более свободного «в возрасте ста двадцати лет».
- source_word: ἐν ᾧ χρόνῳ
  choice: в то время, когда
  rationale: Сохраняет явную временную связь между последними словами Симеона и смертью Иосифа.
- source_word: Ἀρρωστοῦντος
  choice: Когда Симеон был болен
  rationale: Естественно передаёт генитив абсолютный как обстоятельство состояния, на фоне которого сыновья пришли к нему.
- source_word: ἐπισκέψασθαι
  choice: навестить
  rationale: Передаёт посещение больного с подразумеваемыми заботой и участием, не добавляя прямо значения ухода.
- source_word: ἐνισχύσας
  choice: Собравшись с силами
  rationale: Передаёт физическое усилие больного Симеона перед тем, как он сел и начал говорить.
- source_word: ἐκάθισε
  choice: сел
  rationale: Точно передаёт греческий глагол без добавления невыраженного движения «приподнялся»; контекст болезни раскрывает ситуацию.
- source_word: κατεφίλησεν
  choice: расцеловал
  rationale: Русский глагол естественно выражает усиленный или неоднократный характер действия, заложенный в греческой форме, и уместен в семейной сцене прощания.
theological_decisions:
- issue: Хронологическая связь последних слов Симеона со смертью Иосифа
  choice: Сохранить оба хронологических сообщения как часть повествовательной рамки
  alternative: Считать упоминание смерти Иосифа поздней редакционной вставкой либо сгладить хронологию пересказом
  rationale: В представленном греческом тексте упоминание Иосифа является частью надписания и вступительного повествования. Оснований устранять или гармонизировать его нет.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным завещательным тоном. Синтаксис сделан ясным для широкого читателя; формальная хронология сохранена. Заголовок переведён из греческого текста. Нумерация 1–2 отражает деление исходного фрагмента.
