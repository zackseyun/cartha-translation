base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/002.yaml
  text: And now, my children, make your hearts good before the Lord, and make your ways straight before men, and you will find favor before the Lord and men.
translation:
  language: ru
  text: Итак, дети мои, сделайте ваши сердца добрыми перед Господом и выпрямите ваши пути перед людьми — и обретёте благоволение у Господа и людей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγαθύνατε τὰς καρδίας ὑμῶν
  choice: сделайте ваши сердца добрыми
  rationale: Передаёт каузативный императив ἀγαθύνω и сохраняет образ сердца без замены его толкованием вроде «очистите намерения».
- source_word: εὐθύνατε τὰς ὁδοὺς ὑμῶν
  choice: выпрямите ваши пути
  rationale: Сохраняет метафору прямых путей и повелительное значение глагола εὐθύνω.
- source_word: χάριν
  choice: благоволение
  rationale: В сочетании с εὑρίσκειν означает благосклонность или расположение, обретаемые перед Богом и людьми; «благоволение» естественно применимо к обоим.
- source_word: ἐνώπιον
  choice: перед
  rationale: Последовательно передаёт пространственно-оценочное значение «пред лицом, в глазах» в современном литературном русском языке.
theological_decisions:
- issue: Соотношение человеческого повеления и обещанного результата
  choice: «и обретёте»
  alternative: «и будете находить»
  rationale: Будущее ἔσεσθε εὑρίσκοντες буквально имеет перифрастическую форму, но здесь естественно выражает последующий результат. Формулировка не уточняет сверх текста, является ли благоволение наградой, следствием или даром.
- issue: Одинаковое благоволение перед Господом и людьми
  choice: сохранена единая конструкция «перед Господом и людьми»
  alternative: развести на «милость у Господа и расположение людей»
  rationale: Греческий текст употребляет одно χάριν для обоих объектов; перевод сохраняет эту богословски значимую общность и не вводит искусственного различия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Сохранены параллелизм двух повелений и метафоры сердца и путей; архаизмы вроде «пред» и «сыщете» не использованы.
