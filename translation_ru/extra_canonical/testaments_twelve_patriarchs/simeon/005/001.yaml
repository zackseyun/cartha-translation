base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/001.yaml
  text: Therefore Joseph was handsome in form and beautiful in appearance, because nothing evil dwelt in him; for the face reveals the turmoil of the spirit.
translation:
  language: ru
  text: Поэтому Иосиф был прекрасен обликом и красив с виду, потому что в нём не обитало ничего злого; ведь лицо обнаруживает смятение духа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡραῖος τῷ εἴδει, καὶ καλὸς τῇ ὄψει
  choice: прекрасен лицом и красив с виду
  rationale: Передаёт параллельные характеристики внешней красоты естественным современным русским языком, не сливая их полностью.
- source_word: οὐκ ἐνοίκησεν ἐν αὐτῷ οὐδὲν πονηρόν
  choice: в нём не обитало ничего злого
  rationale: Сохраняет образ внутреннего обитания, выраженный глаголом ἐνοικέω, и широкое значение πονηρόν.
- source_word: ἐκ γὰρ τῆς ταραχῆς τοῦ πνεύματος τὸ πρόσωπον δηλοῖ
  choice: ведь смятение духа отражается на лице
  rationale: Греческая фраза синтаксически сжата; по смыслу лицо обнаруживает внутреннее смятение. Русская формулировка передаёт это естественно, не уточняя природу «духа» сверх источника.
theological_decisions:
- issue: Значение πνεῦμα
  choice: дух
  alternative: душа / внутренний мир
  rationale: Сохранён прямой и богословски открытый эквивалент без сведения понятия к психологии.
- issue: Связь внутреннего зла с внешностью Иосифа
  choice: сохранена причинная связь «потому что»
  alternative: ослабить до описательного сопоставления
  rationale: ὅτι прямо вводит основание; текстовую антропологическую напряжённость не следует сглаживать.
translation_notes:
  register: Современный литературный русский язык с достоинством апокрифического завещательного текста. Синтаксис слегка упрощён ради ясности, при этом причинная структура и образ внутреннего обитания зла сохранены.
