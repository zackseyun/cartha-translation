base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/004.yaml
  text: For I have seen in the writing of Enoch that your sons will be corrupted in sexual immorality, and they will wrong the sons of Levi with the sword.
translation:
  language: ru
  text: Ведь я видел в писании Еноха, что ваши сыновья погрязнут в разврате и поступят несправедливо с сыновьями Левия, подняв на них меч.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν χαρακτῆρι γραφῆς Ἐνώχ
  choice: в писании Еноха
  rationale: Передаёт ссылку на письменное свидетельство Еноха естественно по-русски, без излишне буквального и неясного «в начертании писания».
- source_word: ἐν πορνείᾳ φθαρήσονται
  choice: погрязнут в разврате
  rationale: Сохраняет значение нравственного растления в сфере половой распущенности и конструкцию с ἐν, не представляя разврат исключительно внешней причиной.
- source_word: ἀδικήσουσιν ... ἐν ῥομφαίᾳ
  choice: несправедливо поднимут меч на
  rationale: Передаёт причинение зла или несправедливость посредством меча естественным русским выражением, не уточняя сверх текста исход конкретного насилия.
- source_word: τοῖς υἱοῖς Λευί
  choice: на сыновей Левия
  rationale: Сохраняет родовое обозначение потомков Левия.
theological_decisions:
- issue: Характер предсказанного растления
  choice: погрязнут в разврате
  alternative: будут развращены блудом
  rationale: Средний залог φθαρήσονται и ἐν πορνείᾳ допускают состояние или сферу растления; выбранная формулировка не навязывает внешнего деятеля и сохраняет нравственную ответственность.
- issue: Смысл ἀδικέω при упоминании меча
  choice: несправедливо поднимут меч на
  alternative: причинят зло мечом
  rationale: Сохранена нравственная оценка действия как неправедного, а меч представлен орудием враждебного насилия без добавления отсутствующих подробностей.
translation_notes:
  register: Современный литературный русский язык; тон пророческого наставления остаётся серьёзным и dignified. Формулировка ясна обычному читателю, избегает архаизма «блудодеяние» и чрезмерно технического буквального воспроизведения греческой фразы о писании.
