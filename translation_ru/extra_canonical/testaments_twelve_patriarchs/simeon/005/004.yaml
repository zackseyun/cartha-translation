revisions:
- from: Ведь я видел в писании Еноха, что ваши сыновья погрязнут в разврате и несправедливо поднимут меч на сыновей Левия.
  to: Ведь я видел в писании Еноха, что ваши сыновья погрязнут в разврате и поступят несправедливо с сыновьями Левия, подняв на них меч.
  rationale: Исправлена только вторая часть, чтобы сохранить значение ἀδικέω как неправедного причинения зла и одновременно передать ἐν ῥομφαίᾳ через естественный русский образ поднятого меча. Иных изменений не требуется.
