review_pass:
  verdict: revise
  source_fidelity: 'Начальная формула и указание на письменный текст Еноха переданы верно. «Погрязнут в разврате» естественно передаёт предсказанное нравственное растление в сфере πορνεία, хотя греческая форма φθαρήσονται имеет страдательный оттенок. Основная неточность находится во второй части: ἀδικήσουσιν означает «поступят несправедливо / причинят зло», тогда как «несправедливо поднимут меч» сужает глагол до одного жеста и переносит нравственную оценку в наречие.'
  naturalness: Текст в целом звучит как современный литературный русский. Предлагаемая замена сохраняет ясность и естественно связывает причинение несправедливости с мечом как орудием насилия.
  terminology: '«Писание Еноха», «разврат» и «сыновья Левия» приемлемы в данном контексте. Строчная буква в слове «писании» уместна: греческое выражение говорит о записи/писании Еноха, а не обязательно о каноническом Писании.'
  issues:
  - severity: medium
    issue: Сужение значения ἀδικήσουσιν
    rationale: Фраза «несправедливо поднимут меч на» передаёт враждебное насилие, но не сам смысл глагола ἀδικέω — причинить зло, поступить неправедно с кем-либо. Формулировка также делает «поднять меч» основным сказуемым, хотя в греческом это обозначение средства действия.
  revised_text: Ведь я видел в писании Еноха, что ваши сыновья погрязнут в разврате и поступят несправедливо с сыновьями Левия, подняв на них меч.
