base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/006.yaml
  text: And they will be few in number, being divided among Levi and among Judah, and none from among you will be for leadership, just as our father also prophesied in the blessings.
translation:
  language: ru
  text: Их будет мало, и они будут разделены между Левием и Иудой; и никто из вас не станет правителем, как и предсказал наш отец в благословениях.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀλιγοστοί
  choice: останется их мало
  rationale: Передаёт малочисленность естественным современным русским оборотом в контексте будущего положения потомков.
- source_word: ἐπιμεριζόμενοι
  choice: будут рассеяны
  rationale: Причастие указывает на распределение по частям; «рассеяны среди» ясно передаёт разделение и пребывание внутри групп Левия и Иуды.
- source_word: ἐν τῷ Λευὶ καὶ ἐν τῷ Ἰούδᾳ
  choice: среди Левия и Иуды
  rationale: Названия понимаются как колена или потомство патриархов; «среди» звучит по-русски естественнее буквального «в».
- source_word: εἰς ἡγεμονίαν
  choice: не станет правителем
  rationale: Греческое выражение обозначает достижение руководящего или властного положения; личная конструкция естественна в русском и не уточняет вид власти сверх источника.
- source_word: ἐν ταῖς εὐλογίαις
  choice: в своих благословениях
  rationale: Сохраняется множественное число и подразумевается известное благословение отца, состоящее из благословений, обращённых к сыновьям.
theological_decisions:
- issue: Кого обозначают Левий и Иуда
  choice: Сохранены личные имена «Левий» и «Иуда» без поясняющего добавления «колена».
  alternative: «среди колен Левия и Иуды»
  rationale: Источник использует имена без существительного «колено»; русский текст позволяет сохранить эту метонимию и не снимать исходную смысловую открытость.
- issue: Характер ἡγεμονία
  choice: «правителем»
  alternative: «вождём» или «руководителем»
  rationale: «Правитель» передаёт властное положение, не привязывая его специально к военной, религиозной или административной должности.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис упрощён ради ясности, но пророческая направленность, множественное «благословения» и неопределённость вида власти сохранены.
