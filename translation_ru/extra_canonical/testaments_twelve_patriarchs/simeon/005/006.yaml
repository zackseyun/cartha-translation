revisions:
- from: 'И останется их мало: они будут рассеяны среди Левия и Иуды, и никто из вас не станет правителем, как и предсказал наш отец в своих благословениях.'
  to: Их будет мало, и они будут разделены между Левием и Иудой; и никто из вас не станет правителем, как и предсказал наш отец в благословениях.
  rationale: Исправлена передача малочисленности и распределения, чтобы не вносить смысл рассеяния. Сохранены личные имена, неопределённость характера ἡγεμονία и множественное число «благословения». Союзное «и» перед заключительным утверждением сохранено, а точка с запятой помогает различить два самостоятельных пророческих следствия.
