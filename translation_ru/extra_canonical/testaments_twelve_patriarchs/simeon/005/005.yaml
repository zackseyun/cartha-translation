  source_fidelity: 'Текст точно передаёт греческий оригинал: ἀντιστῆναι — «противостоять», πόλεμον Κυρίου πολεμήσει — «будет вести войну Господа», νικήσει — «одолеет», а πᾶσαν παρεμβολὴν ὑμῶν — «весь ваш стан». Будущее время и причинная связь ὅτι сохранены. Формулировка «войну Господа» удерживает неуточнённость родительного падежа Κυρίου, не превращая его без основания в «войну за Господа».'
