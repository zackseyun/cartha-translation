source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἀλλ' οὐ δυνήσονται πρὸς Λευὶ ἀντιστῆναι³², ὅτι *πόλεμον Κυρίου πολεμήσει³³ καὶ νικήσει ⌜πᾶσαν⌝³⁴ παρεμβολὴν³⁵ ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/005.yaml
  text: But they will not be able to stand against Levi, because he will wage the Lord’s war and will defeat your whole camp.
translation:
  language: ru
  text: Но они не смогут противостоять Левию, потому что он будет вести войну Господа и одолеет весь ваш стан.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντιστῆναι
  choice: противостоять
  rationale: Точно передаёт значение «встать против, оказать сопротивление» и естественно сочетается с дательным «Левию».
- source_word: πόλεμον Κυρίου πολεμήσει
  choice: будет вести войну Господа
  rationale: 'Сохраняет внутренний повтор греческого оборота «воевать войну» в естественной русской идиоме и не снимает неоднозначность родительного Κυρίου: война может пониматься как принадлежащая Господу или ведущаяся ради Него.'
- source_word: νικήσει
  choice: одолеет
  rationale: Передаёт победу над противостоящей силой и естественно управляет прямым дополнением.
- source_word: πᾶσαν παρεμβολὴν ὑμῶν
  choice: весь ваш стан
  rationale: παρεμβολή в военном контексте прежде всего означает лагерь или стан; «стан» сохраняет военный и несколько возвышенный регистр. Чтение πᾶσαν отмечено в издании как текстуально не вполне уверенное, но принято в основном тексте.
theological_decisions:
- issue: Связь войны с Господом в выражении πόλεμον Κυρίου
  choice: войну Господа
  alternative: войну за Господа
  rationale: Буквальный родительный падеж сохраняет богословскую неоднозначность оригинала и не уточняет без достаточных оснований, является ли это войной Господа, войной по Его поручению или войной ради Него.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оттенком. «Стан» выбран вместо более бытового «лагерь», поскольку речь идёт о военном противостоянии; синтаксис остаётся ясным для современного читателя.
