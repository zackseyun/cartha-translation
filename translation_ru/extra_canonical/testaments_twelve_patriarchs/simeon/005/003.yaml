base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/003.yaml
  text: Guard yourselves, then, from sexual immorality, because sexual immorality is the mother of evils, separating from God and drawing near to Beliar.
translation:
  language: ru
  text: 'Итак, берегитесь разврата, потому что разврат — мать зол: он отдаляет от Бога и приближает к Велиару.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: берегитесь
  rationale: Естественно передаёт повелительный аорист среднего залога со значением бдительной самозащиты.
- source_word: πορνεία
  choice: разврат
  rationale: Передаёт широкое значение недозволенного полового поведения и сохраняет повтор исходного текста.
- source_word: μήτηρ τῶν κακῶν
  choice: мать всех зол
  rationale: Идиоматичный русский оборот, близкий к буквальному «мать зол»; «всех» естественно выражает родовое множество греческого τῶν κακῶν.
- source_word: χωρίζουσα ἀπὸ τοῦ θεοῦ
  choice: он отдаляет от Бога
  rationale: Причастие описывает действие разврата; личная конструкция по-русски яснее, а «отдаляет» сохраняет идею разъединения.
- source_word: προσεγγίζουσα τῷ Βελίαρ
  choice: приближает к Велиару
  rationale: Сохраняет пространственно-реляционную антитезу удалению от Бога и транслитерирует имя Βελίαρ как «Велиар».
theological_decisions:
- issue: Подразумеваемое дополнение при причастиях χωρίζουσα и προσεγγίζουσα
  choice: Не добавлять явное «человека» или «вас»
  alternative: «отделяя человека от Бога и приближая его к Велиару»
  rationale: В греческом дополнение не выражено; русская формулировка сохраняет эту обобщённость и не сужает смысл.
- issue: Образ «мать зол»
  choice: Сохранить метафору
  alternative: «источник всех зол»
  rationale: Метафора прямо присутствует в источнике и несёт риторическую и богословскую напряжённость, которую не следует сглаживать.
translation_notes:
  register: Современный литературный русский язык; наставительный, серьёзный и доступный регистр. Синтаксис слегка перестроен ради естественности, при этом повтор ключевого слова и противопоставление Бога Велиару сохранены.
