source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ νῦν, τέκνα¹ μου, ἐπακούσατε² τοῦ³ Λευὶ καὶ τοῦ⁴ Ἰούδα⁵ καὶ⁷ μὴ ἐπαίρεσθε⁸ ἐπὶ τὰς δύο γενεὰς⁹ ταύτας, ὅτι ἐξ αὐτῶν¹⁰ ἀνατελεῖ ἡμῖν¹¹ τὸ σωτήριον ⌜τοῦ Θεοῦ⌝¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007/001.yaml
  text: And now, my children, listen to Levi and to Judah, and do not exalt yourselves over these two tribes, because from them the salvation of God will rise for us.
translation:
  language: ru
  text: И теперь, дети мои, послушайте Левия и Иуду и не превозноситесь над этими двумя коленами, ибо от них взойдёт для нас Божье спасение.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «Божье» передаёт выражение τοῦ Θεοῦ, заключённое в греческом издании в критические угловые скобки; его присутствие в тексте не вполне уверенно.
    reason: Нужно обозначить текстологическую неопределённость выражения τοῦ Θεοῦ, не устраняя его из основного текста и не меняя смысла фразы.
lexical_decisions:
- source_word: ἐπακούσατε
  choice: слушайтесь
  rationale: Глагол с родительным падежом здесь означает не просто услышать, а внимать и следовать наставлению; «слушайтесь» естественно передаёт этот призыв.
- source_word: γενεὰς
  choice: коленами
  rationale: В контексте Левия и Иуды речь идёт о родовых объединениях Израиля; «колена» точнее и естественнее буквального «роды» или «поколения».
- source_word: ἀνατελεῖ
  choice: взойдёт
  rationale: Сохранён образ восхода или появления, заложенный в греческом глаголе, без уточнения того, относится ли он к личности, событию или дару спасения.
- source_word: τὸ σωτήριον
  choice: спасение
  rationale: Субстантивированное прилагательное обозначает спасение или спасительное избавление; нейтральное «спасение» сохраняет широту смысла.
theological_decisions:
- issue: Что именно «взойдёт» от Левия и Иуды
  choice: спасение Божье
  alternative: Спаситель от Бога
  rationale: Греческий текст имеет средний род τὸ σωτήριον, то есть «спасение/спасительное», а не прямо личное обозначение «Спаситель»; личностное мессианское прочтение не навязывается.
- issue: Образ глагола ἀνατελεῖ
  choice: взойдёт
  alternative: явится
  rationale: «Взойдёт» сохраняет образную неоднозначность греческого слова и не решает заранее, имеется ли в виду восход светила, произрастание отрасли или общее появление.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Формы «Левия», «Иуды», «коленами» и «спасение Божье» понятны широкому читателю; синтаксис остаётся близким к греческому, но звучит естественно.
