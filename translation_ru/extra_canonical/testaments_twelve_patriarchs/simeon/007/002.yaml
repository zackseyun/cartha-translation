base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007/002.yaml
  text: For the Lord will raise up from Levi a high priest, and from Judah a king, [God and man]; he will save [all the nations and] the race of Israel.
translation:
  language: ru
  text: Ибо Господь воздвигнет из колена Левия первосвященника, а из колена Иуды — царя, [Бога и человека][a]. Он спасёт [все народы и][b] род Израиля.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «Бога и человека» имеют сомнительную текстуальную засвидетельствованность и в некоторых свидетелях отсутствуют.
    reason: Объясняет квадратные скобки критического издания, не представляя спорное чтение как бесспорную часть текста.
  - marker: b
    text: Слова «все народы и» имеют сомнительную текстуальную засвидетельствованность и в некоторых свидетелях отсутствуют.
    reason: Отмечает текстовый вариант, существенно влияющий на объём обещанного спасения.
lexical_decisions:
- source_word: Ἀναστήσει
  choice: поставит
  rationale: В данном контексте глагол означает, что Господь воздвигнет или поставит человека на служение; «поставит» естественно звучит по-русски и не вызывает ненужной ассоциации с воскресением.
- source_word: ἐκ τοῦ Λευὶ / ἐκ τοῦ Ἰούδα
  choice: из Левия / из Иуды
  rationale: Сохранено обозначение происхождения из соответствующих колен; краткая форма соответствует греческому тексту.
- source_word: ὡς ἀρχιερέα / ὡς βασιλέα
  choice: первосвященника / царя
  rationale: Русское именное дополнение после «поставит» естественно передаёт назначение на эти роли; отдельное «как» здесь звучало бы двусмысленно или неестественно.
- source_word: τὸ γένος τοῦ Ἰσραήλ
  choice: род Израиля
  rationale: «Род» сохраняет широкий смысл γένος — народ, потомство или род — не сужая его до одного толкования.
theological_decisions:
- issue: Соотнесение слов Θεὸν καὶ ἄνθρωπον с упомянутыми фигурами
  choice: Сохранить буквальное «[Бога и человека]» после «царя», не поясняя синтаксическую связь
  alternative: Передать как однозначную характеристику одного мессианского лица или распределить «Бога» и «человека» между царём и первосвященником
  rationale: Греческая формулировка и её положение допускают напряжение и неоднозначность; перевод не должен молча навязывать конкретное христологическое прочтение.
- issue: Текстуальный статус Θεὸν καὶ ἄνθρωπον и πάντα τὰ ἔθνη καὶ
  choice: Сохранить обе фразы в квадратных скобках и снабдить текстологическими примечаниями
  alternative: Включить их без скобок либо исключить из основного текста
  rationale: Скобки в представленном критическом тексте указывают на сомнительность или вариантность этих слов; это значимо и для смысла, и для истории текста.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис сделан естественным для русского читателя, при этом сохранены параллелизм Левия и Иуды, текстуальные скобки и богословская неоднозначность спорной вставки.
