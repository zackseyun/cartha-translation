  - severity: low
    issue: «поставит» для ἀναστήσει
    rationale: «Поставит» возможно в значении назначения, но ἀναστήσει буквально и традиционно в мессианско-пророческом контексте означает «воздвигнет». Последнее лучше сохраняет образ и исходную лексику без обязательной ассоциации с воскресением.
