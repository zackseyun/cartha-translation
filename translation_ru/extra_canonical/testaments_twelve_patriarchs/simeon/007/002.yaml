  source_fidelity: Греческое ἀναστήσει точнее передаётся «воздвигнет», а конструкции ἐκ τοῦ Λευὶ и ἐκ τοῦ Ἰούδα в данном контексте обозначают происхождение из колен. «Из Левия» и «из Иуды» могут по-русски ошибочно восприниматься как происхождение от отдельных лиц, поэтому требуют уточнения.
  naturalness: «Воздвигнет из колена Левия… а из колена Иуды…» — естественная литературная библейская формулировка, сохраняющая исходный параллелизм. Остальная фраза ясна и стилистически уместна.
  terminology: «Первосвященник», «царь», «Господь» и «род Израиля» адекватны. Квадратные скобки и сноски корректно сохраняют сомнительный статус двух чтений; спорное «[Бога и человека]» не следует догматически истолковывать.
