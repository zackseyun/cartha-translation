  text: Therefore I command these things to you, so that you also may command your children, that they may keep them for their generations.
translation:
  language: ru
  text: Поэтому я заповедую вам это, чтобы и вы заповедали своим детям, чтобы они соблюдали это во все свои поколения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντέλλομαι / ἐντέλλεσθε
  choice: заповедую / заповедали
  rationale: Повтор одного корня сохраняет явную лексическую связь греческого текста и передаёт не просто совет, а обязательное наставление.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: своим детям
  rationale: Естественный современный русский эквивалент; добавление смыслов вроде «роду Израиля» источником не поддерживается.
- source_word: φυλάξωσιν αὐτά
  choice: хранить это
  rationale: «Хранить» передаёт соблюдение и бережное сохранение данных заповедей; местоимение среднего множественного числа по-русски естественно передано собирательным «это».
- source_word: εἰς τὰς γενεὰς αὐτῶν
  choice: из поколения в поколение
  rationale: Идиоматично выражает направленность предписания на последовательные поколения, не перегружая фразу буквальным оборотом.
