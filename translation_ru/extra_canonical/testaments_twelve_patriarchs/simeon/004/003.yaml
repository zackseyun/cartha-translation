base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/003.yaml
  text: And when we went down into Egypt and he bound me as a spy, I knew that I was suffering justly, and I was not grieved.
translation:
  language: ru
  text: И когда мы спустились в Египет и он связал меня, считая разведчиком, я понял, что страдаю заслуженно, и не печалился.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέβημεν
  choice: мы спустились
  rationale: Сохранён обычный библейский способ говорить о путешествии в Египет как о движении вниз; форма передаёт аорист первого лица множественного числа.
- source_word: κατάσκοπον
  choice: разведчика
  rationale: В контексте задержания обозначает человека, подозреваемого в тайном сборе сведений; современное «разведчик» естественнее и точнее, чем стилистически окрашенное «соглядатай».
- source_word: δικαίως πάσχω
  choice: страдаю по справедливости
  rationale: Передаёт признание заслуженности происходящего, не уточняя сверх греческого текста ни вину, ни характер наказания.
- source_word: οὐκ ἐλυπούμην
  choice: не скорбел
  rationale: Глагол λυπέομαι выражает печаль или скорбь; «не скорбел» сохраняет смысл и достоинство регистра.
theological_decisions:
- issue: Осмысление страдания как справедливого
  choice: «страдаю по справедливости»
  alternative: «страдаю заслуженно»
  rationale: Выбранная формулировка ближе к наречию δικαίως и сохраняет нравственно-судебный оттенок, не превращая высказывание в более явное признание конкретной вины.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксический параллелизм греческой фразы сохранён, но формулировки остаются понятными современному читателю.
