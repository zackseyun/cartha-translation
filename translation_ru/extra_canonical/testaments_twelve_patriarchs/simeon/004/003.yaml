revisions:
- from: И когда мы спустились в Египет и он связал меня как разведчика, я понял, что страдаю по справедливости, и не скорбел.
  to: И когда мы спустились в Египет и он связал меня, считая разведчиком, я понял, что страдаю заслуженно, и не печалился.
  rationale: Исправление устраняет синтаксическую двусмысленность при передаче ὡς κατάσκοπον и делает формулировку δικαίως πάσχω естественной для современного русского. Последовательность действий, первое лицо повествователя, образ спуска в Египет и несовершенное «не печалился» сохранены.
