source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἦν δὲ ὁ πατήρ μου ἐρωτῶν¹ ⌈περὶ ἐμοῦ⌉² *ὅτι ἑώρακέ με σκυθρωπόν³, καὶ⁴ ἔλεγον αὐτῷ⁵ *ὅτι τὰ ἤπατά μου ὀγκοῦμαι⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/001.yaml
  text: My father kept asking about me, because he had seen me gloomy, and I said to him, “My liver is swollen.”
translation:
  language: ru
  text: 'Мой отец всё спрашивал обо мне[a], потому что видел меня мрачным, а я говорил ему: «У меня распухла печень».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «обо мне» в греческом тексте имеют неуверенную текстовую засвидетельствованность.
    reason: В издании выражение περὶ ἐμοῦ отмечено специальными скобками как текстуально не вполне надёжное; примечание сохраняет прозрачность исходных данных.
lexical_decisions:
- source_word: ἦν … ἐρωτῶν
  choice: всё спрашивал
  rationale: Перифрастическая конструкция передаёт продолжительное или повторяющееся действие; частица «всё» естественно выражает это по-русски.
- source_word: περὶ ἐμοῦ
  choice: обо мне
  rationale: Сохранено буквальное и несколько неоднозначное «обо мне», без уточнения, спрашивал ли отец самого Симеона или других людей.
- source_word: σκυθρωπόν
  choice: мрачным
  rationale: Слово обозначает заметно подавленный, угрюмый вид; «мрачным» естественно в данном контексте и не сводит состояние только к печали.
- source_word: ἔλεγον αὐτῷ
  choice: я говорил ему
  rationale: Имперфект согласован с продолжительным расспрашиванием отца и передаёт повторяемое или развёртывающееся в прошлом действие.
- source_word: τὰ ἤπατά μου ὀγκοῦμαι
  choice: У меня распухла печень
  rationale: Передано естественным русским описанием телесного недуга. Греческое множественное τὰ ἤπατα в анатомическом употреблении по-русски требует единственного числа «печень».
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с простым, достойным повествовательным тоном. Необычное «спрашивал обо мне» сохранено ради неоднозначности греческого выражения; телесная жалоба передана естественно для русского читателя.
