reference: Testament of Simeon 4:9
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Ὅτι καὶ⁷¹ ἐν ὕπνῳ *τις ζῆλος⁷² κακίας αὐτὸν⁷³ φαντάζουσα⁷⁴ κατεσθίει⁷⁵ καὶ⁷⁶ πνεύμασι πονηροῖς⁷⁷ διαταράσσει⁷⁸ τὴν ψυχὴν αὐτοῦ, καὶ ἐκθροεῖσθαι τὸ σῶμα ποιεῖ, καὶ ἐν ταραχῇ διυπνίζει⁷⁹ τὸν νοῦν, καὶ ὡς⁸⁰ πνεῦμα πονηρὸν *καὶ ἰοβόλον⁸¹, *οὕτως φαίνεται⁸² τοῖς ἀνθρώποις⁸³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/009.yaml
  text: For even in sleep envy, presenting to him visions of wickedness, consumes him and troubles his soul with evil spirits, and makes the body shudder, and wakes the mind in turmoil; and like an evil and venomous spirit, so he appears to people.
translation:
  language: ru
  text: Ибо даже во сне зависть, являя ему образы зла, пожирает его, тревожит его душу злыми духами, заставляет тело содрогаться и пробуждает ум в смятении; и людям он кажется злым и ядовитым духом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος
  choice: зависть
  rationale: В данном контексте слово обозначает разрушительную зависть, а не положительное рвение; это подтверждается сочетаниями с κακίας и πνεῦμα πονηρόν.
- source_word: φαντάζουσα
  choice: являя ему образы
  rationale: Передаёт причиняемые завистью ночные видения, не уточняя сверх греческого текста, являются ли они снами, образами или призраками.
- source_word: κατεσθίει
  choice: пожирает
  rationale: Сохраняет сильную метафору греческого глагола, а не ослабляет её до «изнуряет».
- source_word: ἐκθροεῖσθαι τὸ σῶμα ποιεῖ
  choice: заставляет тело содрогаться
  rationale: Естественно передаёт телесное потрясение или дрожь, не добавляя отсутствующую в тексте причину вроде страха.
- source_word: διυπνίζει τὸν νοῦν
  choice: пробуждает ум
  rationale: Сохраняет образ пробуждения сознания и объект νοῦς без излишнего психологического истолкования.
- source_word: ἰοβόλον
  choice: ядовитым
  rationale: Передаёт образ несущего или испускающего яд духа ясным современным русским словом.
theological_decisions:
- issue: Персонификация зависти и связь со злыми духами
  choice: Сохранить зависть как действующую силу, тревожащую душу злыми духами
  alternative: Истолковать зависть как самостоятельного злого духа
  rationale: Греческий текст сближает зависть со злым духом, но прямо не отождествляет их до заключительного сравнения; перевод сохраняет это напряжение.
- issue: Смысл заключительного сравнения
  choice: «людям он кажется злым и ядовитым духом»
  alternative: «людям зависть представляется злым и ядовитым духом»
  rationale: Ближайший естественный референт мужского αὐτός — человек, которого пожирает зависть; это также соответствует английскому консультационному тексту. При этом формула сравнения сохранена без утверждения, что человек буквально становится духом.
translation_notes:
  register: Современный литературный русский язык с достоинством и выразительностью исходной нравоучительной речи. Синтаксис сделан плавным, но последовательность образов и их интенсивность сохранены.
