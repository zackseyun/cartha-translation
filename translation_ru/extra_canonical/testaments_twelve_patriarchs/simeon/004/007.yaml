source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Καὶ ὑμεῖς⁵², τέκνα μου⁵³, ἀγαπήσατε⁵⁴ ἕκαστος τὸν ἀδελφὸν⁵⁵ αὐτοῦ⁵⁶ ἐν ἀγαθῇ καρδίᾳ, καὶ *ἀποστήσεται ἀφ᾽ ὑμῶν τὸ πνεῦμα τοῦ φθόνου⁵⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/007.yaml
  text: And you also, my children, let each one love his brother with a good heart, and the spirit of envy will depart from you.
translation:
  language: ru
  text: И вы также, дети мои, пусть каждый любит своего брата с добрым сердцем, и дух зависти отступит от вас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπήσατε
  choice: пусть каждый любит
  rationale: Греческий аорист повелительного наклонения передаёт прямое наставление; в сочетании с ἕκαστος естественная русская конструкция «пусть каждый любит» сохраняет его побудительную силу.
- source_word: τὸν ἀδελφὸν αὐτοῦ
  choice: своего брата
  rationale: Возвратное притяжательное местоимение естественно передаёт соотнесённость αὐτοῦ с каждым отдельным адресатом.
- source_word: ἐν ἀγαθῇ καρδίᾳ
  choice: с добрым сердцем
  rationale: Сохраняется образ сердца как внутреннего нравственного расположения без излишней интерпретации.
- source_word: τὸ πνεῦμα τοῦ φθόνου
  choice: дух зависти
  rationale: Формально и ясно сохраняется выражение источника; πνεῦμα не сводится к настроению или чувству.
- source_word: ἀποστήσεται ἀφ᾽ ὑμῶν
  choice: отступит от вас
  rationale: Будущее время и образ удаления переданы прямо; «отступит» соответствует контексту ухода духа зависти.
theological_decisions:
- issue: Смысл выражения «дух зависти»
  choice: Сохранить буквальное «дух зависти»
  alternative: «зависть покинет вас»
  rationale: Греческий текст допускает как персонифицированное нравственное начало, так и духовную силу; буквальная формулировка сохраняет эту неоднозначность.
- issue: Связь между любовью и удалением духа зависти
  choice: Сохранить последовательность наставления и будущего результата через «и»
  alternative: Явно причинное «тогда дух зависти отступит от вас»
  rationale: Оригинал употребляет καί и не маркирует причинно-следственную связь словом «тогда»; её не следует усиливать.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Обращение «дети мои» и параллельная структура оригинала сохранены; фраза остаётся понятной обычному читателю без конфессионально окрашенной терминологии.
