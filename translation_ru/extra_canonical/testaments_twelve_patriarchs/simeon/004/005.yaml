base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/005.yaml
  text: Therefore guard yourselves, my children, from every jealousy and envy, and walk in simplicity of heart, so that God may also give you grace and glory and blessing upon your heads, just as you saw in Joseph.
translation:
  language: ru
  text: Итак, дети мои, берегитесь всякой ревности и зависти и ходите в простоте сердца, чтобы Бог и вам даровал благодать, славу и благословение на ваши головы, как вы видели это в Иосифе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζήλου καὶ φθόνου
  choice: ревности и зависти
  rationale: 'Сохранены два близких, но не тождественных понятия: ζῆλος здесь обозначает ревнивое соперничество, а φθόνος — зависть.'
- source_word: ἁπλότητι καρδίας
  choice: в простоте сердца
  rationale: Формально близкая и понятная по-русски формулировка сохраняет нравственный смысл искренности и отсутствия двоедушия, не сужая его до одного толкования.
- source_word: χάριν
  choice: благодать
  rationale: «Благодать» точно передаёт χάρις в контексте дара от Бога и соответствует возвышенному религиозному регистру.
- source_word: ἐπὶ τὰς κεφαλὰς ὑμῶν
  choice: на ваши головы
  rationale: Сохранён конкретный библейский образ нисходящего благословения, хотя по-русски возможна более свободная передача «на вас».
- source_word: ἐν Ἰωσήφ
  choice: на Иосифе
  rationale: Передано как наблюдаемое на Иосифе действие Божьей благодати и благословения; буквальная конструкция сохраняет связь с образом предыдущей части стиха.
theological_decisions:
- issue: Соотношение Божьего дара и нравственного наставления
  choice: «чтобы Бог и вам даровал»
  alternative: «и тогда Бог даст вам»
  rationale: Конструкция ἵνα с сослагательным наклонением передана как цель или ожидаемый результат, без превращения Божьего дара в механически гарантированное воздаяние.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Повеления переданы ясно и естественно; ключевые образы «простота сердца» и «благословение на головы» сохранены без конфессионального истолкования.
