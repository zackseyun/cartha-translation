  rationale: 'Исправлено только заключительное сравнение: добавлено «это» и выбран предлог «в», чтобы по-русски ясно передать проявление упомянутых Божьих даров в Иосифе. Смысл, синтаксическая зависимость и образ благословения «на головы» сохранены. Дополнительные сноски не нужны: цифровые знаки в приведённой критической публикации относятся к её аппарату, а не к требующим переноса смысловым примечаниям данного перевода.'
