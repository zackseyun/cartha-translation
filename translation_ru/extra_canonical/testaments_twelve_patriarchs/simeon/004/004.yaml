base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/004.yaml
  text: But Joseph was a good man, and having the Spirit of God in him, being compassionate and merciful, he did not hold a grudge against me, but loved me along with my brothers.
translation:
  language: ru
  text: Иосиф же был добрым человеком и имел в себе Дух Божий. Будучи сострадательным и милосердным, он не держал на меня зла, но любил меня вместе с моими братьями.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὸς ἀνήρ
  choice: добрым человеком
  rationale: Естественная современная передача выражения «добрый муж/человек», сохраняющая нравственную характеристику Иосифа без архаизма.
- source_word: ἔχων πνεῦμα θεοῦ ἐν αὐτῷ
  choice: имел в себе Дух Божий
  rationale: Сохраняет значение причастной конструкции и местонахождение «в нём», не добавляя причинной связи, которой греческий текст прямо не выражает.
- source_word: εὔσπλαγχνος καὶ ἐλεήμων
  choice: сострадательным и милосердным
  rationale: 'Передаёт оба близких, но не тождественных качества: внутреннее сострадание и деятельное милосердие.'
- source_word: οὐκ ἐμνησικάκησέν με
  choice: не держал на меня зла
  rationale: Современный русский идиоматический эквивалент со значением «не затаил обиды/не был злопамятен по отношению ко мне».
- source_word: ἠγάπησέ με σὺν τοῖς ἀδελφοῖς μου
  choice: любил меня вместе с моими братьями
  rationale: Сохраняет явное включение рассказчика в любовь Иосифа наряду с его братьями.
theological_decisions:
- issue: Связь присутствия Духа Божьего с состраданием и незлопамятностью Иосифа
  choice: Не выражать причинность прямо
  alternative: «поскольку в нём был Дух Божий»
  rationale: Греческое ἔχων является причастием и допускает смысловую связь, но не маркирует её однозначно как причинную; перевод сохраняет эту открытость.
- issue: Написание наименования πνεῦμα θεοῦ
  choice: «Дух Божий» с прописной буквы
  alternative: «дух Божий»
  rationale: В контексте речь естественно понимается как о Божьем Духе; прописная буква соответствует достоинству религиозного регистра, не вводя дополнительного определения природы Духа.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Длинная греческая конструкция разделена на два предложения для ясности, при этом логическая последовательность и богословская неоднозначность сохранены.
