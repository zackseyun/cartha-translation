id: T12P.SIM.4.6
reference: Testament of Simeon 4:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Πάσας⁴⁰ τὰς ἡμέρας⁴¹ οὐκ⁴² ὠνείδισεν ἡμᾶς⁴³ *περὶ τοῦ πράγματος τούτου⁴⁴, ἀλλ᾿⁴⁵ ἠγάπησεν ἡμᾶς ὡς τὴν *ψυχὴν αὐτοῦ⁴⁶ καὶ ὑπὲρ τοὺς υἱοὺς αὐτοῦ⁴⁷ ἐδόξασεν⁴⁸ ἡμᾶς, καὶ⁴⁹ *πλοῦτον καὶ κτήνη καὶ καρπὸν⁵⁰ *ἐχαρίσατο ἡμῖν⁵¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/006.yaml
  text: All his days he did not reproach us about this matter, but he loved us as his own soul, and honored us above his own sons, and granted us wealth and livestock and produce.
translation:
  language: ru
  text: Во все свои дни он ни разу не упрекнул нас за это дело, но любил нас, как собственную душу, почитал нас выше своих сыновей и даровал нам богатство, скот и плоды земли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάσας τὰς ἡμέρας
  choice: Во все свои дни
  rationale: Естественная русская передача временного оборота со значением «на протяжении всей своей жизни / всех своих дней».
- source_word: οὐκ ὠνείδισεν
  choice: ни разу не упрекнул
  rationale: Глагол означает укорять или попрекать; «ни разу» естественно выражает отрицание в пределах всего указанного периода.
- source_word: περὶ τοῦ πράγματος τούτου
  choice: за это дело
  rationale: Сохраняет обобщённость πράγμα и связь упрёка с ранее упомянутым поступком или обстоятельством.
- source_word: ὡς τὴν ψυχὴν αὐτοῦ
  choice: как собственную душу
  rationale: Сохраняет образность греческого текста и не сводит ψυχή к более истолковывающему «самого себя».
- source_word: ὑπὲρ τοὺς υἱοὺς αὐτοῦ ἐδόξασεν
  choice: почитал нас выше своих сыновей
  rationale: Передаёт сравнительное ὑπέρ и значение ἐδόξασεν как оказание чести, а не только внутреннее уважение.
- source_word: πλοῦτον καὶ κτήνη καὶ καρπὸν
  choice: богатство, скот и плоды земли
  rationale: πλοῦτος передан как «богатство», κτήνη как домашний скот, а единственное собирательное καρπός — естественным русским «плоды земли», то есть урожай.
- source_word: ἐχαρίσατο
  choice: даровал
  rationale: Передаёт благосклонное и щедрое предоставление благ, сохраняя возвышенный повествовательный регистр.
