source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἐπένθουν γὰρ *παρὰ πάντας⁷ ὅτι ἐγὼ ἤμην⁸ αἴτιος *τῆς πράσεως⁹ Ἰωσήφ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/002.yaml
  text: For I was grieving more than all the others, because I was responsible for the sale of Joseph.
translation:
  language: ru
  text: Ведь я скорбел больше всех остальных, потому что был виновником продажи Иосифа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπένθουν
  choice: я скорбел
  rationale: Глагол πενθέω обозначает глубокую скорбь или печаль; форма имперфекта передаёт продолжавшееся состояние.
- source_word: παρὰ πάντας
  choice: больше всех остальных
  rationale: В данном сравнительном обороте παρά с винительным означает превосходство по степени; «остальных» естественно уточняет подразумеваемых братьев.
- source_word: αἴτιος
  choice: виновником
  rationale: Слово указывает не просто на причастность, а на причинную и нравственную ответственность говорящего.
- source_word: τῆς πράσεως Ἰωσήφ
  choice: продажи Иосифа
  rationale: В контексте повествования πρᾶσις имеет конкретное значение «продажа», а родительный Ἰωσήφ обозначает проданного.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; сохранены причинная связь и признание личной вины. Союз «ведь» передаёт пояснительное γάρ, а имперфект выражен глаголом несовершенного вида.
