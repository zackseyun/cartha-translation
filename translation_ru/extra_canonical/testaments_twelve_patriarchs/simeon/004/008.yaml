source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ὅτι⁵⁸ ἀγριοῖ τοῦτο⁵⁹ τὴν ψυχήν⁶⁰, καὶ φθείρει *τὸ σῶμα⁶¹, *ὀργὴν καὶ πόλεμον παρέχει τῷ διαβουλίῳ⁶², καὶ εἰς⁶³ αἵματα⁶⁴ παροξύνει, καὶ εἰς ἔκστασιν ἄγει⁶⁵ *τὴν διάνοιαν⁶⁶, καὶ κλόνον⁶⁹ παρέχει τῇ ψυχῇ⁷⁰ καὶ τρόμον τῷ σώματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/008.yaml
  text: For this makes the soul savage, and destroys the body; it brings anger and war into one’s plans, and provokes to bloodshed, and leads the mind into frenzy, and gives the soul upheaval and the body trembling.
translation:
  language: ru
  text: Ибо это делает душу свирепой и губит тело; вносит в замысел гнев и войну, подстрекает к кровопролитию, доводит разум до исступления, повергает душу в смятение, а тело — в трепет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγριοῖ
  choice: делает… свирепой
  rationale: 'Передаёт каузативный смысл глагола: душа становится дикой, неукротимой и жестокой.'
- source_word: φθείρει
  choice: губит
  rationale: Ёмко выражает разрушение или порчу тела, не уточняя способ.
- source_word: τῷ διαβουλίῳ
  choice: в помыслах
  rationale: Редкая форма связана с обдумыванием и замыслами; «в помыслах» естественно по-русски и сохраняет внутреннюю сферу планов и рассуждений.
- source_word: εἰς αἵματα παροξύνει
  choice: подстрекает к кровопролитию
  rationale: Множественное αἵματα идиоматически обозначает пролитие крови, а παροξύνει — побуждение или подстрекательство.
- source_word: εἰς ἔκστασιν ἄγει τὴν διάνοιαν
  choice: доводит разум до исступления
  rationale: ἔκστασις здесь означает выход рассудка из нормального состояния; «исступление» передаёт это без положительного мистического оттенка.
- source_word: κλόνον
  choice: смятение
  rationale: Передаёт потрясение, внутреннюю неустойчивость и душевную сумятицу.
- source_word: τρόμον
  choice: трепет
  rationale: Сохраняет телесный смысл дрожи и возвышенный, но понятный регистр.
theological_decisions: []
