  text: Διαθήκη Βενιαμὴν τοῦ ιβ´ υἱοῦ Ἰακὼβ καὶ Ῥαχήλ¹. I. Ἀντίγραφον λόγων² Βενιαμήν³, ὧν⁴ διέθετο⁵ *τοῖς υἱοῖς⁶ αὐτοῦ⁷, ζήσας⁸ *ἔτη ἑκατὸν εἴκοσι πέντε⁹. 2. *Καταφιλήσας δὲ αὐτοὺς¹⁰ εἶπεν¹¹. Ὥσπερ¹² Ἰσαὰκ *ἐτέχθη τῷ Ἀβραὰμ ἐν γήρει αὐτοῦ¹³, οὕτως κἀγὼ τῷ¹⁴ Ἰακώβ¹⁵. 3. *Καὶ ἐπειδὴ¹⁶ Ῥαχὴλ *ἡ μήτηρ μου¹⁷ τέθνηκε¹⁸ γεννῶσά με, *γάλα οὐκ ἔσχον· Βαλλὰν οὖν τὴν παιδίσκην αὐτῆς ἐθήλασα¹⁹. 4. Ἡ γὰρ²⁰ Ῥαχὴλ μετὰ τὸ τεκεῖν²¹ τὸν Ἰωσὴφ δώδεκα ἔτη ἐστείρευσεν· καὶ προσηύξατο *πρὸς Κύριον²² μετὰ νηστείας²³, καὶ συλλαβοῦσα τέτοκέ²⁴ με. 5. Σφόδρα γὰρ²⁵ *ἠγάπα ὁ πατήρ μου²⁶ τὴν Ῥαχήλ²⁷, καὶ ηὔχετο δύο υἱοὺς ἰδεῖν ἐξ αὐτῆς²⁸. 6. Διὰ τοῦτο ἐκλήθην²⁹ *Βενιαμίν, ὅ ἐστιν υἱὸς ἡμερῶν³⁰.
