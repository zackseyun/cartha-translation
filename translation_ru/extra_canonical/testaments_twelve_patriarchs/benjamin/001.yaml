base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001.yaml
  text: 'The Copy of the Words of Benjamin[a], the twelfth son of Jacob, which he set in order for his sons, having lived one hundred and twenty-five years.


    And after kissing them, he said:


    Just as Isaac was born to Abraham in his old age, so I also was born to Jacob. And since Rachel my mother died while giving birth to me, I had no milk; so I was nursed by Bilhah, her maidservant. For Rachel was barren for twelve years after she had borne Joseph; and she prayed to the Lord with fasting, and after conceiving she bore me. For my father loved Rachel exceedingly, and he prayed to see two sons from her. Because of this I was called Benjamin[b], which means son of days.'
translation:
  language: ru
  text: 'Завещание Вениамина, двенадцатого сына Иакова и Рахили


    1. Список слов Вениамина, которые он завещал своим сыновьям, прожив сто двадцать пять лет.


    2. Расцеловав их, он сказал:


    «Как Исаак родился у Авраама в его старости, так и я родился у Иакова. 3. Поскольку моя мать Рахиль умерла, рождая меня[a], я не получил её молока, и меня вскормила Валла, её служанка. 4. Ведь после рождения Иосифа Рахиль оставалась бесплодной двенадцать лет. Она с постом молилась Господу и, зачав, родила меня. 5. Мой отец очень любил Рахиль и молился о том, чтобы увидеть двух сыновей от неё. 6. Поэтому меня назвали Вениамином, что означает „сын дней“[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческая строка о смерти Рахили при рождении Вениамина имеет несколько неловкую текстовую форму, однако из контекста ясно, что она умерла во время родов.
    reason: textual_variant
  - marker: b
    text: В книге Бытия имя Вениамин обычно объясняется иначе; здесь греческое завещание прямо даёт значение «сын дней».
    reason: cross_reference
lexical_decisions:
- source_word: διέθετο
  choice: завещал
  rationale: В контексте предсмертного наставления глагол обозначает торжественную передачу последних слов сыновьям; «завещал» естественно передаёт этот смысл и согласуется с жанром произведения.
- source_word: Καταφιλήσας
  choice: расцеловав
  rationale: Приставочный глагол выражает сердечные, возможно неоднократные поцелуи; русское «расцеловав» сохраняет теплоту сцены.
- source_word: ἐν γήρει αὐτοῦ
  choice: в его старости
  rationale: Прямое и естественное соответствие греческому выражению, сохраняющее сопоставление с Авраамом.
- source_word: τέθνηκε γεννῶσά με
  choice: умерла, рождая меня
  rationale: Передаёт смерть Рахили в связи с родами, не сглаживая несколько неловкую форму данной греческой строки.
- source_word: γάλα οὐκ ἔσχον
  choice: я не получил её молока
  rationale: Буквальное «у меня не было молока» по-русски двусмысленно; выбранная формулировка ясно передаёт отсутствие материнского кормления, непосредственно обусловленное смертью Рахили.
- source_word: ἐθήλασα
  choice: меня вскормила
  rationale: По контексту Валла кормила младенца своим молоком; «вскормила» естественно и кратко выражает это по-русски.
- source_word: ἐστείρευσεν
  choice: оставалась бесплодной
  rationale: Форма указывает на продолжавшееся двенадцать лет бесплодие после рождения Иосифа.
- source_word: πρὸς Κύριον
  choice: Господу
  rationale: Дательный падеж при «молилась» естественно передаёт направленность молитвы к Господу.
- source_word: μετὰ νηστείας
  choice: с постом
  rationale: Сохраняет краткое упоминание поста как сопровождавшего молитву.
- source_word: συλλαβοῦσα
  choice: зачав
  rationale: Деепричастие точно и плавно передаёт предшествующее зачatie.
- source_word: Σφόδρα ἠγάπα
  choice: очень любил
  rationale: Передаёт усилительное σφόδρα современным литературным русским языком без неестественной архаизации.
- source_word: υἱὸς ἡμερῶν
  choice: сын дней
  rationale: Это явное внутреннее толкование имени в греческом тексте; оно сохранено буквально, несмотря на отличающееся объяснение имени в Бытии.
theological_decisions:
- issue: Толкование имени Вениамин в греческом свидетельстве
  choice: «сын дней»
  alternative: «сын правой руки» или истолковательное «сын старости»
  rationale: Греческий текст прямо поясняет имя словами υἱὸς ἡμερῶν. Перевод сохраняет именно данное текстовое свидетельство и не согласовывает его молча с иной этимологией в книге Бытия.
- issue: Кто молился в стихе 4
  choice: Рахиль
  alternative: Иаков
  rationale: Ближайшим подлежащим является Рахиль, а последующие причастия «зачав, родила» продолжают говорить о ней. Отдельная молитва отца упомянута далее, в стихе 5.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным завещательным тоном. Библейские имена переданы в привычной русской форме: Иаков, Рахиль, Иосиф, Вениамин, Валла. Синтаксис сделан доступным для обычного читателя, при этом необычная этимология имени и текстовая неловкость строки о смерти Рахили не устранены.'
