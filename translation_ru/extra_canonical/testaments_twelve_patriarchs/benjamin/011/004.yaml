  text: And in holy books he shall be recorded, both his work and his word; and he shall be God's chosen one forever.
translation:
  language: ru
  text: И он будет записан в священных книгах — вместе со своим делом и своим словом; и он будет избранником Божьим навеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν βίβλοις ἁγίαις
  choice: в священных книгах
  rationale: Прямо передаёт греческое выражение, сохраняя множественное число и сакральный регистр.
- source_word: ἀναγραφόμενος
  choice: записан
  rationale: Естественно выражает внесение письменного свидетельства в книги; пассивная конструкция оригинала сохранена.
- source_word: τὸ ἔργον καὶ ὁ λόγος αὐτοῦ
  choice: и дело его, и слово его
  rationale: Сохраняет разграничение между деянием и словом, а также эмфатическое повторение притяжательного местоимения.
- source_word: ἐκλεκτὸς Θεοῦ
  choice: избранником Божьим
  rationale: Передаёт субстантивированное прилагательное как обозначение избранного Богом лица, не уточняя сверх текста характер избрания.
- source_word: ἕως τοῦ αἰῶνος
  choice: навеки
  rationale: Идиоматически передаёт значение неограниченной длительности в данном контексте.
theological_decisions:
- issue: Статус названного лица в выражении ἐκλεκτὸς Θεοῦ
  choice: избранник Божий
  alternative: избранный Богом
  rationale: Субстантивное «избранник» близко греческой форме и сохраняет титульный оттенок, не вводя конкретной конфессиональной идентификации.
- issue: Временной смысл ἕως τοῦ αἰῶνος
  choice: навеки
  alternative: до века
  rationale: «Навеки» естественно для современного русского и соответствует идиоматическому смыслу; буквальное «до века» сегодня неясно и может ошибочно предполагать конечный срок.
translation_notes:
  register: Современный литературный русский с достоинством и умеренно библейским звучанием. Порядок парных понятий и богословская неопределённость оригинала сохранены; архаизмы не используются.
