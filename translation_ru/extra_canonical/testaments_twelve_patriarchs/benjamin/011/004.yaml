  source_fidelity: 'Греческое ἀναγραφόμενος передаётся как «будет записан», а ἐκλεκτὸς Θεοῦ — как «избранник Божий». Однако исходная русская пунктуация с тире создаёт неясную, почти отождествляющую конструкцию: «он будет записан ... — и дело его, и слово его». Координацию τὸ ἔργον καὶ ὁ λόγος αὐτοῦ следует выразить как включение его дела и слова в запись.'
  naturalness: «Вместе со своим делом и своим словом» устраняет синтаксический сбой и сохраняет современный литературный, сдержанно возвышенный регистр. Повтор «своим» естественно выделяет обе части пары.
  terminology: «Священные книги», «избранник Божий» и «навеки» точно и стилистически уместно передают βίβλοις ἁγίαις, ἐκλεκτὸς Θεοῦ и ἕως τοῦ αἰῶνος. Не следует добавлять конфессиональную идентификацию названного лица. Содержание текстологических примечаний 23 и 24 в предоставленных данных отсутствует, поэтому создавать их или приписывать им варианты нельзя.
  issues:
  - severity: medium
    issue: Неясная связь «и дело его, и слово его» с «будет записан».
    rationale: В оригинале после ἀναγραφόμενος названы его дело и слово; в русском тире оставляет фрагмент без ясной синтаксической функции и может звучать как отождествление человека с его делом и словом. Явное «вместе со» передаёт включительный смысл без добавления толкования.
  revised_text: И он будет записан в священных книгах — вместе со своим делом и своим словом; и он будет избранником Божьим навеки.
