base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/005.yaml
  text: And through them he will visit as Jacob my father, saying, “He will fill up what is lacking in your tribe.”
translation:
  language: ru
  text: 'И через них он будет приходить, как Иаков, мой отец, говоря: «Он восполнит недостающее в твоём колене».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза допускает и другое понимание: «…как говорил Иаков, мой отец: “Он восполнит…”». Не вполне ясно, относится ли «говоря» к приходящему или к Иакову.'
    reason: Сохраняет существенную синтаксическую неоднозначность оборота ὡς Ἰακὼβ ὁ πατήρ μου, λέγων, не навязывая один из возможных способов связи.
lexical_decisions:
- source_word: δι᾽ αὐτῶν
  choice: через них
  rationale: Сохраняет множественное число местоимения и инструментально-посредническое значение διά с родительным падежом.
- source_word: φοιτήσει
  choice: будет приходить
  rationale: φοιτάω обозначает приход, посещение или повторяющееся хождение; конструкция «будет приходить» естественно передаёт возможный повторный характер действия, не добавляя отсутствующего в греческом тексте объекта.
- source_word: ἀναπληρώσει τὰ ὑστερήματα
  choice: восполнит недостающее
  rationale: Передаёт идею заполнения недостатка без уточнения, в чём именно он состоит.
- source_word: φυλῆς
  choice: колене
  rationale: В библейско-родословном контексте «колено» — естественный русский эквивалент греческого φυλή в значении племенной ветви Израиля.
theological_decisions:
- issue: Референт местоимения αὐτός и возможный сакральный статус действующего лица
  choice: он / Он внутри цитаты не выделяется сакральной капитализацией
  alternative: Он
  rationale: Сам стих не называет действующее лицо и не требует отождествлять его с Богом или Мессией; строчная буква не навязывает богословского решения.
- issue: Синтаксическая связь оборота ὡς Ἰακὼβ ὁ πατήρ μου, λέγων
  choice: «как Иаков, отец мой, говоря» с сохранением последовательности оригинала
  alternative: «как говорил Иаков, отец мой»
  rationale: 'Греческий текст допускает неясность: λέγων может описывать приходящего либо вводить слова Иакова. Основной текст не устраняет эту неоднозначность конъектурой.'
translation_notes:
  register: Современный литературный русский с умеренно библейской лексикой («колено», «восполнит»). Порядок фразы оставлен близким к греческому ради сохранения синтаксического напряжения; отсутствующий объект при φοιτήσει не добавлен.
