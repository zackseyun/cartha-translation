revisions:
- from: И в последние времена восстанет возлюбленный Господа [из семени Иуды и Левия][a], исполняющий благоугодное устами своими, [озаряющий все народы новым знанием][b], — свет знания, приходящий к Израилю со спасением, похищающий у них, как волк, и отдающий собранию народов.
  to: И в последние времена восстанет возлюбленный Господа [из семени Иуды и Левия][a], творящий благоугодное устами своими, [озаряющий все народы новым знанием][b], — свет знания, приходящий на Израиль со спасением, похищающий у них, как волк, и отдающий собранию народов.
  rationale: 'Внесены только безопасные правки: «творящий» лучше передаёт ποιῶν в данном контексте, а «приходящий на Израиль» сохраняет объектную направленность ἐπεμβαίνων τὸν Ἰσραήλ и его смысловую напряжённость. Неуказанный объект заключительных причастий, самостоятельная формула «свет знания» и текстологические скобки сохранены.'
