source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἀναστήσεται ἐν ὑστέροις] ἀγαπητὸς Κυρίου [ἐκ σπέρματος Ἰούδα καὶ Λευί]⁶ ποιῶν εὐδοκίαν *ἐν στόματι αὐτοῦ⁷, [γνῶσιν καινὴν φωτίζων πάντα τὰ ἔθνη]⁸ *φῶς γνώσεως¹⁴, ἐπεμβαίνων¹⁵ *τὸν Ἰσραὴλ¹⁶ ἐν σωτηρίᾳ, καὶ ἁρπάζων ὡς λύκος ἀπ᾽ αὐτῶν¹⁷, καὶ *διδοὺς τῇ συναγωγῇ τῶν ἐθνῶν¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/002.yaml
  text: And in the last times a beloved one of the Lord shall arise [from the seed of Judah and Levi], doing good pleasure with his mouth, [enlightening all the nations with new knowledge], a light of knowledge, coming upon Israel in salvation, and snatching from them like a wolf, and giving to the assembly of the nations.
translation:
  language: ru
  text: И в последние времена восстанет возлюбленный Господа [из семени Иуды и Левия][a], творящий благоугодное устами своими, [озаряющий все народы новым знанием][b], — свет знания, приходящий на Израиль со спасением, похищающий у них, как волк, и отдающий собранию народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «из семени Иуды и Левия» в используемом критическом тексте заключены в квадратные скобки, что указывает на текстологическую неуверенность.
    reason: Сохранить отмеченную в источнике неопределённость текста.
  - marker: b
    text: Слова «озаряющий все народы новым знанием» в используемом критическом тексте заключены в квадратные скобки, что указывает на текстологическую неуверенность.
    reason: Сохранить отмеченную в источнике неопределённость текста.
lexical_decisions:
- source_word: ἐν ὑστέροις
  choice: в последние времена
  rationale: Передаёт эсхатологически окрашенное, но само по себе достаточно широкое указание на позднейшее время.
- source_word: ἀγαπητὸς Κυρίου
  choice: возлюбленный Господа
  rationale: Сохраняет субстантивированное прилагательное и отношение принадлежности/любви, не уточняя личность.
- source_word: ποιῶν εὐδοκίαν ἐν στόματι αὐτοῦ
  choice: исполняющий благоугодное устами своими
  rationale: Сохраняет необычное сочетание действия, благоугодности и уст, не добавляя отсутствующих в данном греческом тексте слов о воле или голосе.
- source_word: γνῶσιν καινὴν φωτίζων πάντα τὰ ἔθνη
  choice: озаряющий все народы новым знанием
  rationale: Естественно передаёт образ света при φωτίζων и инструментальный смысл «новым знанием».
- source_word: φῶς γνώσεως
  choice: свет знания
  rationale: Сохранена самостоятельная именная формула и её возможная приложительная связь с «возлюбленным».
- source_word: ἐπεμβαίνων τὸν Ἰσραὴλ ἐν σωτηρίᾳ
  choice: приходящий к Израилю со спасением
  rationale: Контекстуально передаёт движение/приближение к Израилю и сочетание ἐν σωτηρίᾳ, избегая чрезмерно военного оттенка русского «наступающий».
- source_word: ἁρπάζων ὡς λύκος ἀπ᾽ αὐτῶν
  choice: похищающий у них, как волк
  rationale: Сохраняет волчий образ, исходную неопределённость подразумеваемого объекта и множественное местоимение «у них».
- source_word: τῇ συναγωγῇ τῶν ἐθνῶν
  choice: собранию народов
  rationale: Нейтрально передаёт συναγωγή как собрание, не превращая его автоматически в техническое обозначение синагоги или церкви.
theological_decisions:
- issue: Личность «возлюбленного Господа»
  choice: Не отождествлять его в переводе с конкретной фигурой
  alternative: Передать мессианским титулом или прямо назвать Мессией
  rationale: Греческий текст использует только ἀγαπητός; конкретизация была бы толкованием.
- issue: Необычная связь спасения с Израилем
  choice: «приходящий к Израилю со спасением»
  alternative: «приносящий спасение Израилю» или «наступающий на Израиль во спасении»
  rationale: Выбранная формулировка остаётся понятной, но не превращает двусмысленную конструкцию в однозначное утверждение о даровании спасения.
- issue: Неуказанный объект похищения и отдачи
  choice: Сохранить пропуск объекта
  alternative: Добавить «добычу», «их» или «похищенное»
  rationale: В представленном греческом тексте прямой объект не назван; дополнение могло бы навязать конкретную богословскую связь.
translation_notes:
  register: Современный литературный русский с достоинством псевдоэпиграфического пророческого речения. Синтаксис сделан читаемым, но намеренные смысловые разрывы и неуказанный объект последних причастий не устранены. Квадратные скобки исходного критического текста сохранены.
