base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/001.yaml
  text: No longer shall I be called a ravening wolf because of your acts of plunder, but [a worker of the Lord, distributing food to those who do what is good].
translation:
  language: ru
  text: И больше не будут называть меня хищным волком из-за ваших грабежей, но [работником Господа, раздающим пищу тем, кто делает добро].
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκέτι κληθήσομαι
  choice: уже не будут называть меня
  rationale: Естественно передаёт будущее пассивного залога и значение прекращения прежнего именования.
- source_word: λύκος ἅρπαξ
  choice: хищным волком
  rationale: Сохраняет образ волка, который хватает добычу; «хищный» звучит естественно и достойно по-русски.
- source_word: διὰ τὰς ἁρπαγὰς ὑμῶν
  choice: из-за ваших грабежей
  rationale: ἁρπαγή обозначает насильственное присвоение или грабёж; множественное число сохранено собирательным естественным выражением.
- source_word: ἐργάτης Κυρίου
  choice: работником Господа
  rationale: Прямо передаёт ἐργάτης как трудящегося или работника, не вводя церковного титула.
- source_word: διαδιδὼν τροφὴν
  choice: раздающим пищу
  rationale: Передаёт причастие настоящего времени и конкретный смысл распределения пищи.
- source_word: τοῖς ἐργαζομένοις τὸ ἀγαθόν
  choice: тем, кто делает добро
  rationale: Естественно передаёт субстантивированное причастие и объект τὸ ἀγαθόν без тяжеловесного буквального оборота.
theological_decisions:
- issue: Статус заключительной части стиха в греческой редакции
  choice: Сохранены квадратные скобки вокруг слов «работником Господа… делает добро»
  alternative: Печатать заключительную часть без скобок
  rationale: В предоставленном греческом источнике эта часть отмечена как текстологически обособленная; скобки сохраняют свидетельство редакции, не решая вопрос молча.
translation_notes:
  register: Современный литературный русский язык с ясным, dignified повествовательным тоном. Синтаксис близок к греческому, но не калькирован; квадратные скобки исходной редакции сохранены.
