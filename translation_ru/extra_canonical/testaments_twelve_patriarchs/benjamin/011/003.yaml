source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἕως¹⁹ συντελείας *τοῦ αἰῶνος²⁰ ἔσται ἐν συναγωγαῖς²¹ ἐθνῶν καὶ ἐν τοῖς ἄρχουσιν αὐτῶν, ὡς μουσικὸν μέλος ἐν στόματι πάντων²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/003.yaml
  text: Until the consummation of the age he shall be in the assemblies of the nations and among their rulers, like a musical strain in the mouth of all.
translation:
  language: ru
  text: До завершения века он будет в собраниях народов и среди их правителей, словно напев на устах у всех.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἕως συντελείας τοῦ αἰῶνος
  choice: До завершения века
  rationale: Передаёт временной предел и эсхатологический оттенок выражения, не конкретизируя неоднозначное αἰών как «мир» или «история».
- source_word: ἐν συναγωγαῖς ἐθνῶν
  choice: в собраниях народов
  rationale: В данном контексте συναγωγή имеет общее значение собрания, а ἔθνη — народов; вариант не вносит более поздней узкоконфессиональной окраски слова «синагога».
- source_word: ἐν τοῖς ἄρχουσιν αὐτῶν
  choice: среди их правителей
  rationale: Естественно передаёт личное множественное ἄρχοντες и сохраняет параллель с пребыванием среди народов.
- source_word: ὡς μουσικὸν μέλος
  choice: словно напев
  rationale: Кратко и естественно выражает образ музыкальной мелодии; «музыкальный напев» по-русски было бы избыточно.
- source_word: ἐν στόματι πάντων
  choice: на устах у всех
  rationale: Идиоматичный современный русский оборот, сохраняющий образ всеобщего устного произнесения или воспевания.
theological_decisions:
- issue: Значение τοῦ αἰῶνος
  choice: века
  alternative: мира / эпохи
  rationale: «Век» сохраняет традиционную эсхатологическую многозначность αἰών и не решает преждевременно, идёт ли речь об эпохе или мировом порядке.
- issue: Характер присутствия, выраженного ἔσται ἐν
  choice: он будет в собраниях… и среди правителей
  alternative: о нём будут говорить в собраниях… и среди правителей
  rationale: Сохранена необычная формулировка источника без истолкования образа как известности, упоминания или прославления.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной речи. Синтаксис близок к греческому, но звучит естественно; образность и возможная богословская неоднозначность сохранены.
