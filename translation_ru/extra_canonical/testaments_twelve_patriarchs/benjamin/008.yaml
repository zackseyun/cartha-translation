  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/008.yaml
  text: '1[a]. Therefore, if you also walk in holiness according to the Lord’s commands, you will dwell with me in safety, and all Israel will be gathered to the Lord.


    2. And I will no longer be called a ravening wolf because of your ravaging, but a worker of the Lord, distributing food to those who do what is good.


    3. And there will arise in the latter times one beloved of the Lord, from the tribe of Judah and Levi, who will accomplish the good pleasure of God with a new understanding for all the nations.


    4. His presence is in the mouth of all, and he will be chosen forever by the Lord, and through him the knowledge of the Lord will be given on the earth in portions of joy; and through him Israel will be enlightened.


    5. Then he will enter into the first temple, and there the Lord will be abused, and he will be lifted up upon a tree.


    6[b]. And the veil of the temple will be torn, and the Spirit of God will pass on to the nations like fire poured out.


    7. And he will ascend from Hades and will pass from earth into heaven.


    8. And I know how lowly he will be on earth, and how glorious in heaven.


    9. Now when Joseph was in Egypt, I longed to see his figure and appearance; and through the prayers of Jacob my father I saw him, while awake, that a spotless and holy virgin was giving birth to a lamb,


    10. and on its left side there was as it were a lion; and all the beasts rushed against him, and the lamb overcame them and destroyed them, and trampled them underfoot.


    11. And because of him the angels and men rejoiced, and all the land.


    12. These things will happen in their proper times. Therefore, my children, when you see that all these things have happened in Israel, know that the kingdom of the Lord is near.


    13. Then flee from every lawless deed and from the works of Beliar, and cling to what is good and to the law of the Lord.


    14. And bury me near my fathers.


    15. And he finished his commands, and said, “I am going to sleep with my fathers.”


    16. And he stretched out his feet and died in a beautiful and good old age.


    17. And each of his sons did as he had commanded them, and they put him in a coffin and kept him in Egypt until the day of the exodus.


    18. And when the sons of Israel went up from Egypt, they carried up the bones of Benjamin also[c], and buried them in Hebron at the right side of Abraham and Isaac and Jacob.'
translation:
  language: ru
  text: 'VIII


    1. Вы же, дети мои, бегите от зла, зависти и ненависти к братьям и прилепляйтесь к доброте и любви.


    2. Ибо чистый ум не оскверняется навозом и грязью, но, напротив, охлаждает и то и другое и устраняет зловоние[a]. Так и чистый ум, даже находясь среди скверны земной, скорее созидает[b], а сам не оскверняется.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст этого сравнения труден: буквально в нём говорится, что чистый ум «не имеет осквернения от навоза и грязи», но «охлаждает и то и другое и прогоняет зловоние». Возможно, текст дошёл в повреждённом виде.'
    reason: textual_difficulty
  - marker: b
    text: 'Греческое слово, переведённое как «созидает», помечено в издании как сомнительное: в данном контексте его первоначальный смысл неясен.'
    reason: textual_variant
lexical_decisions:
- source_word: ἀπόδρατε
  choice: бегите
  rationale: Глагол выражает не просто уклонение, а решительное бегство от зла; «бегите» естественно передаёт эту настоятельность.
- source_word: μισαδελφία
  choice: ненависть к братьям
  rationale: Сложное слово буквально обозначает ненависть к брату или братьям. Развёрнутый перевод ясен по-русски и не сужает смысл до семейной вражды.
- source_word: προσκολλᾶσθε
  choice: прилепляйтесь
  rationale: Сохранён сильный образ тесной и постоянной привязанности; возвышенное, но понятное «прилепляйтесь» соответствует наставительному регистру.
- source_word: ἀγαθότης
  choice: доброта
  rationale: В данном перечне нравственных качеств «доброта» естественнее отвлечённого «благость» и остаётся достаточно ёмкой.
- source_word: καθαρὸς νοῦς
  choice: чистый ум
  rationale: Буквальный и естественный эквивалент, сохраняющий нравственно-духовный смысл без замены на более толковательное «чистое сердце».
- source_word: μιασμός / μιαίνεται
  choice: скверна / оскверняется
  rationale: Однокоренные русские слова сохраняют повтор и выраженную в греческом категорию ритуально-нравственного загрязнения.
- source_word: ψύγει
  choice: охлаждает
  rationale: Передано обычное значение глагола, хотя образ в дошедшем тексте труден; перевод не подменяет его догадкой.
- source_word: οἰκοδομεῖ
  choice: созидает
  rationale: Передано засвидетельствованное значение «строит, созидает», но слово отмечено как текстуально сомнительное из-за нарушения смысла сравнения.
theological_decisions:
- issue: Природа «чистого ума» среди земной скверны
  choice: Сохранено утверждение, что чистый ум находится среди скверны, но сам не оскверняется.
  alternative: Истолковать фразу как обещание полной безгрешности либо как призыв к ритуальному очищению.
  rationale: Текст соединяет нравственную чистоту с пребыванием в осквернённой среде, но не разъясняет ни метафизический статус такой чистоты, ни ритуальные последствия; перевод сохраняет эту напряжённость.
- issue: Трудный образ навоза, грязи, охлаждения и устранения зловония
  choice: Образ переведён буквально с примечанием о неясности текста.
  alternative: Исправить подразумеваемый субъект на «чистую воду» или свободно пересказать как нравственное очищение окружающего мира.
  rationale: Дошедший греческий текст называет субъектом «чистый ум» и содержит ψύγει. Конъектура могла бы сделать сравнение понятнее, но не должна молча заменять источник.
translation_notes:
  register: Современный литературный русский с достоинством завещательного наставления. Сохранены традиционно-библейские, но понятные слова «прилепляйтесь», «скверна» и «созидает». Английский консультационный текст относится к иному по содержанию фрагменту и потому не использован как основа; перевод выполнен по предоставленному греческому тексту.
