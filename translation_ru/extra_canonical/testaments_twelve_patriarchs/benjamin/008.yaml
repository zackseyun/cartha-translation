  source_fidelity: Русский текст верно передаёт предоставленный греческий текст Testament of Benjamin 8:1–2, включая настоятельное ἀπόδρατε («бегите»), перечень пороков, образ «прилепляться» к доброте и любви и намеренно трудную метафору во 2-м стихе. Множественное τῶν μιασμῶν передано собирательным «среди скверны земной» без существенной потери смысла. Английский POB audit trail относится к другому, значительно более длинному фрагменту и не может служить контрольным текстом для данного греческого отрывка; перевод обоснованно следует первоисточнику.
  naturalness: Текст написан естественным современным литературным русским при сохранении подобающего завещательному наставлению возвышенного регистра. «Прилепляйтесь», «скверна» и «созидает» уместны и понятны в этом жанре. Необычное «охлаждает» намеренно сохраняет трудность греческого образа и объяснено в примечании.
  terminology: «Ненависть к братьям» точно передаёт μισαδελφία, «чистый ум» — καθαρὸς νοῦς, а повтор «скверна / оскверняется» удачно отражает семейство μιασμός / μιαίνεται. «Доброта» и «любовь» соответствуют ἀγαθότης и ἀγάπη. Термины не навязывают конфессионального истолкования.
