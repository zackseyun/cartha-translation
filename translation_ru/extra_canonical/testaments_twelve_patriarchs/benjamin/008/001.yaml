source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: VIII. *Ὑμεῖς δέ¹, *τέκνα μου², ἀπόδρατε³ τὴν κακίαν, Γ*τὸν φθόνον⁴ καὶ τὴν⁵ μισαδελφίαν⁶, καὶ προσκολλᾶσθε⁶ τῇ ἀγαθότητι Γκαὶ τῇ ἀγάπῃ⁷⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/008/001.yaml
  text: But you, my children, flee evil — envy and hatred of brothers — and cling to goodness and love.
translation:
  language: ru
  text: Но вы, дети мои, бегите от зла, зависти и ненависти к братьям и держитесь добра и любви.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδρατε
  choice: бегите
  rationale: Передаёт сильный призыв не просто избегать, а удаляться от зла.
- source_word: κακίαν
  choice: зла
  rationale: В данном перечислении обозначает нравственное зло в целом, далее поясняемое завистью и ненавистью.
- source_word: φθόνον
  choice: зависти
  rationale: Прямой современный эквивалент греческого термина.
- source_word: μισαδελφίαν
  choice: ненависти к братьям
  rationale: 'Сохраняет составное значение слова: ненависть, направленная на братьев; более ясно по-русски, чем редкое «братоненавистничество».'
- source_word: προσκολλᾶσθε
  choice: держитесь
  rationale: Естественно передаёт настойчивое прилепление и верность добру и любви без стилистической архаики.
- source_word: ἀγαθότητι
  choice: добра
  rationale: В контексте нравственного наставления естественное русское обозначение доброты и благости как противоположности злу.
- source_word: ἀγάπῃ
  choice: любви
  rationale: Сохраняет широкое значение нравственной, деятельной любви без конфессионального уточнения.
theological_decisions:
- issue: Отношение общего понятия «зло» к последующему перечню
  choice: Передать зависть и ненависть к братьям как пояснение через тире
  alternative: 'Соединить однородно: «бегите от зла, зависти и ненависти к братьям»'
  rationale: Греческая структура и консультационный английский текст допускают понимание последующих пороков как конкретизации κακίαν; тире ясно сохраняет эту связь, не добавляя доктринального толкования.
translation_notes:
  register: Современный литературный русский язык; наставительный и dignified тон сохранён. Обращение «дети мои» естественно для завещательного жанра. Архаичные «чада», «прилепляйтесь» и искусственное «братоненавистничество» не использованы.
