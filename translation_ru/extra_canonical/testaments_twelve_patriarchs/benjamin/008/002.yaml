source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ὁ γὰρ καθαρὸς νοῦς οὐκ ἔχει μιασμὸν ἐπὶ¹⁷ κόπρου¹⁸ καὶ¹⁹ βόρβορον²⁰, Γ*ἀλλὰ μᾶλλον²¹ ἀμφότερα ψύγει²² καὶ ἀπελαύνει τὴν δυσωδίαν⁷, οὕτω καὶ ὁ καθαρὸς²³ νοῦς ἐν τοῖς μιασμοῖς²⁴ τῆς¹⁷ γῆς συνεχόμενος μᾶλλον †οἰκοδομεῖ²⁶, αὐτὸς δὲ οὐ μιαίνεται⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/008/002.yaml
  text: For the pure mind has no defilement from dung or filth, but rather repels both and drives away the stench; thus also the pure mind, when held among the defilements of the earth, rather †builds up†, and is itself not defiled.
translation:
  language: ru
  text: Ибо чистый ум не оскверняется ни навозом, ни грязью, но, напротив, охлаждает и то и другое и прогоняет зловоние. Так и чистый ум, будучи окружён земными сквернами, скорее †созидает†[a], а сам не оскверняется.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое чтение в этом месте отмечено как сомнительное или испорченное; буквально: «созидает».'
    reason: В издании οἰκοδομεῖ снабжено знаком †. Сноска сохраняет видимую текстуальную неопределённость, не навязывая реконструкцию или толкование.
lexical_decisions:
- source_word: καθαρὸς νοῦς
  choice: чистый ум
  rationale: Прямо передаёт нравственно-духовную чистоту νοῦς, не сужая значение до «разума» или «помыслов».
- source_word: κόπρου καὶ βόρβορον
  choice: навозом, ни грязью
  rationale: Сохраняет конкретный и резкий образ оригинала; βόρβορος означает вязкую грязь или нечистоты.
- source_word: ψύγει
  choice: охлаждает
  rationale: Сохранено буквальное и несколько необычное чтение греческого текста, а не подмена его смыслом английского consultation layer «отталкивает».
- source_word: συνεχόμενος
  choice: даже находясь среди
  rationale: Естественно передаёт состояние пребывания или удерживания среди осквернений без чрезмерно буквального «будучи удерживаем».
- source_word: οἰκοδομεῖ
  choice: созидает
  rationale: Передаёт текстуально сомнительный глагол в его обычном переносном значении «укрепляет, созидает», сохраняя crux знаком †.
theological_decisions:
- issue: Неоскверняемость чистого ума среди земной скверны
  choice: Передана как утверждение текста без пояснения механизма или абсолютных богословских выводов
  alternative: Истолковать как учение о безгрешности либо лишь как нравственный призыв
  rationale: Оригинал формулирует парадокс чистоты среди осквернения, но не раскрывает его догматически; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский с достоинством и сохранением резкой телесной образности. Необычное «охлаждает» оставлено ради верности сохранившемуся греческому чтению; текстуальная неуверенность при «созидает» обозначена обелисками и сноской.
