  text: Τὸ¹⁶ ἀγαθὸν διαβούλιον *οὐ δέχεται δόξης ⌈οὐκ ἀτιμίας⌉¹⁷ ἀνθρώπων, *καὶ πάντα δόλον¹⁸ ἢ¹⁹ ψεῦδος ἢ²⁰ μάχην *ἢ λοιδωρίαν²¹ *οὐκ οἶδε²². *Κύριος γὰρ²³ ἐν αὐτῷ κατοικεῖ²⁴, καὶ φωτίζει τὴν²⁵ ψυχὴν αὐτοῦ, καὶ χαίρει²⁶ πρὸς πάντας²⁷ ἐν παντὶ καιρῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/004.yaml
  text: A good purpose does not accept glory or dishonor from people, and it knows no deceit or falsehood or strife or reviling. For the Lord dwells in him, and he lights up his soul, and he rejoices toward all at every time.
translation:
  language: ru
  text: Доброе намерение не принимает от людей ни славы, ни бесчестия¹ и не знает ни обмана, ни лжи, ни распри, ни злословия. Ибо Господь обитает в таком человеке, озаряет его душу и всегда радуется всем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸ ἀγαθὸν διαβούλιον
  choice: Доброе намерение
  rationale: Передаёт нравственно направленный замысел или расположение воли; «намерение» естественнее по-русски, чем буквальное «доброе решение/совещание».
- source_word: οὐ δέχεται δόξης ⌈οὐκ ἀτιμίας⌉ ἀνθρώπων
  choice: не принимает от людей ни славы, ни бесчестия
  rationale: Сохраняет текстуально засвидетельствованную парную противоположность «слава — бесчестие» и связь с людьми как источником оценки.
- source_word: δόλον ἢ ψεῦδος ἢ μάχην ἢ λοιδωρίαν
  choice: ни обмана, ни лжи, ни распри, ни злословия
  rationale: Сохраняет четырёхчастное перечисление; «распря» уместно передаёт межличностный конфликт, а «злословие» — оскорбительную или поносительную речь.
- source_word: ἐν αὐτῷ κατοικεῖ
  choice: обитает в таком человеке
  rationale: Местоимение относится к человеку, обладающему добрым намерением, а не к абстрактному намерению; добавление «таком человеке» делает референт ясным без догматического расширения.
- source_word: φωτίζει τὴν ψυχὴν αὐτοῦ
  choice: озаряет его душу
  rationale: «Озаряет» естественно и достаточно прямо передаёт φωτίζει в духовно-нравственном контексте.
- source_word: χαίρει πρὸς πάντας ἐν παντὶ καιρῷ
  choice: радуется обо всех во всякое время
  rationale: Сохраняет необычную направленность πρὸς πάντας и временную всеохватность, не сводя выражение к более узкому «доброжелателен ко всем».
theological_decisions:
- issue: Кто является субъектом глагола χαίρει
  choice: «тот» — человек с добрым намерением
  alternative: «Господь» радуется обо всех
  rationale: Ближайший грамматический субъект в предыдущих глаголах — Господь, поэтому альтернатива возможна; однако общий ход описания качеств доброго человека и английский консультационный слой поддерживают возврат к человеку. Указательное «тот» явно обозначает принятое прочтение.
- issue: В ком обитает Господь
  choice: в человеке, обладающем добрым намерением
  alternative: в самом добром намерении
  rationale: Мужской/средний референт αὐτῷ при последующем «его душу» указывает на носителя доброго намерения, поскольку абстрактное намерение не имеет души.
translation_notes:
  register: Современный литературный русский с достоинством и умеренной формальностью. Синтаксический параллелизм и богословская образность оригинала сохранены; архаизмы сведены к понятным словам «обитает», «злословие», «озаряет».
