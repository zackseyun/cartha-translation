base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/003.yaml
  text: He does not delight in pleasure, [does not grieve his neighbor, does not fill himself with luxury, does not go astray by the wanderings of the eyes]. For the Lord is his portion.
translation:
  language: ru
  text: Он не находит радости в наслаждениях, [не огорчает ближнего, не пресыщается роскошью и не сбивается с пути из-за блуждания глаз].[a] Ибо Господь — его удел.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Квадратные скобки воспроизводят особое текстологическое выделение этого отрывка в используемом греческом издании.
    reason: Сохраняет разграничение, данное источником, и не представляет заключённые в скобки слова как текст без текстологической оговорки.
lexical_decisions:
- source_word: τέρπεται ἐν ἡδονῇ
  choice: не находит удовольствия в наслаждении
  rationale: Передаёт различие между глаголом «услаждаться, находить удовольствие» и существительным «наслаждение», сохраняя намеренную смысловую близость греческих слов.
- source_word: λυπεῖ τὸν πλησίον
  choice: не огорчает ближнего
  rationale: Прямо передаёт λυπέω как причинение печали или огорчения, а πλησίον — традиционным и понятным словом «ближний».
- source_word: οὐκ ἐμπίπλαται τρυφῇ
  choice: не пресыщается роскошью
  rationale: Средне-страдательная форма ἐμπίπλαται означает «наполняется, насыщается», тогда как τρυφή здесь обозначает роскошь и изнеженность; «пресыщается» естественно выражает чрезмерное наполнение.
- source_word: οὐ πλανᾶται μετεωρισμοῖς ὀφθαλμῶν
  choice: не сбивается с пути из-за блуждания глаз
  rationale: Сохраняет образ уклонения с пути и необычное выражение о беспокойных, блуждающих движениях глаз, не сводя его к одному конкретному виду желания.
- source_word: Κύριος γάρ ἐστι ἡ μερὶς αὐτοῦ
  choice: Ибо Господь — его удел
  rationale: «Удел» точно и традиционно передаёт μερίς как назначенную долю или наследственную часть и сохраняет богословский образ без поясняющего расширения.
theological_decisions:
- issue: Господь как μερίς человека
  choice: Господь — его удел
  alternative: Господь — его доля
  rationale: «Удел» сохраняет библейский образ Бога как наследственной части человека; формулировка не уточняет, каким именно образом этот образ следует понимать.
- issue: Смысл «блуждания глаз»
  choice: сохранён образ без конкретизации
  alternative: не соблазняется тем, что видят глаза
  rationale: Греческое выражение допускает связь с рассеянностью, беспокойством или влечением к увиденному; конкретизация как «соблазн» преждевременно сняла бы неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис сохраняет параллельный ряд отрицаний; архаизмы сведены к уместному и широко понятному слову «удел».
