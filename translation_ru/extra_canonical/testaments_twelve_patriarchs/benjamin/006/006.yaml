source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Οὐκ ἔχει *ὅρασιν οὔτε ἀκοὴν³⁶ διπλῆν· *πᾶν γὰρ ὃ³⁷ ποιεῖ, Γἢ³⁸ λαλεῖ, *ἢ ὁρᾷ³⁸, οἶδεν ὅτι³⁹ Κύριος ἐπισκέπτει⁴⁰ τὴν⁴¹ ψυχὴν αὐτοῦ. Καὶ καθαίρει τὴν διάνοιαν αὐτοῦ πρὸς⁴² τὸ μὴ καταγνωσθῆναι ὑπὸ *τῶν ἀνθρώπων, ὁμοίως καὶ ὑπὸ Θεοῦ. Ὁμοίως δὲ καὶ τοῦ Βελίαρ τὰ ἔργα διπλᾶ ἐστιν, καὶ ἀπλότητα ἐν αὐτοῖς οὐκ ἔχουσιν⁴³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/006.yaml
  text: It has neither double sight nor double hearing; for in everything it does, or speaks, or sees, it knows that the Lord watches over his soul. And he cleanses his mind so as not to be condemned by men, likewise also by God. And in the same way the works of Beliar are twofold, and they have no singleness in them.
translation:
  language: ru
  text: У него нет ни двойственного взгляда, ни двойственного слуха[a]; ведь, что бы он ни делал, ни говорил и ни видел, он знает, что Господь наблюдает за его душой[b]. И он очищает свой разум, чтобы не быть осуждённым людьми, равно как и Богом. Подобным образом и дела Велиара двойственны, и нет в них простоты[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ни двойного зрения, ни двойного слуха»; речь идёт о внутренней двойственности или двоедушии.'
    reason: Поясняет необычную греческую метафору, не устраняя её образность из основного текста.
  - marker: b
    text: Греческое слово может также означать «посещает» или «исследует».
    reason: Сохраняет смысловую широту ἐπισκέπτει при основном значении внимательного Божьего надзора.
  - marker: c
    text: «Простота» здесь может означать цельность, искренность и отсутствие двоедушия.
    reason: Предохраняет нравственное значение ἁπλότης от понимания как наивности или интеллектуальной примитивности.
lexical_decisions:
- source_word: ὅρασιν ... ἀκοὴν διπλῆν
  choice: двойственного взгляда ... двойственного слуха
  rationale: Сохраняет повтор и нравственную метафору внутренней раздвоенности; «двойной» могло бы звучать преимущественно как указание на количество.
- source_word: ἐπισκέπτει
  choice: испытывает
  rationale: В данном контексте передаёт Божье внимательное исследование и надзор, не сводя смысл лишь к зрительному «наблюдает».
- source_word: διάνοιαν
  choice: разум
  rationale: Естественное современное обозначение внутренней мыслительной и нравственной установки человека.
- source_word: Βελίαρ
  choice: Велиар
  rationale: Традиционная русская передача имени в иудейско-христианской литературе.
- source_word: ἁπλότητα
  choice: простоты
  rationale: 'Сохраняет противопоставление двойственности: цельность, искренность и отсутствие двоедушия, не ограничивая многозначность одним толкованием.'
theological_decisions:
- issue: Значение Божьего ἐπισκέπτει по отношению к душе
  choice: Господь испытывает его душу
  alternative: Господь наблюдает за его душой / посещает его душу
  rationale: Глагол допускает оттенки посещения, надзора и исследования. Контекст очищения разума и возможного осуждения поддерживает значение испытующего Божьего внимания, однако неоднозначность отмечена в сноске.
- issue: Переход от среднего рода к мужскому в местоимениях
  choice: «У него» и далее личное «он»
  alternative: «Оно» с подразумеваемым качеством или началом
  rationale: Греческое начало продолжает предшествующий контекст и грамматически допускает отсылку к подразумеваемому лицу или качеству. Русский личный строй делает высказывание естественным, не добавляя конкретной идентификации.
- issue: Осуждение людьми и Богом
  choice: чтобы не быть осуждённым людьми, а также Богом
  alternative: чтобы люди не осудили его, равно как и Бог
  rationale: Пассивная конструкция сохраняет форму и напряжение оригинала, не объясняя, каким образом человеческий и Божий суд соотносятся.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной речи. Сохранены параллелизм, повтор «двойственности» и противопоставление ей «простоты»; синтаксис слегка упорядочен для естественного русского чтения.
