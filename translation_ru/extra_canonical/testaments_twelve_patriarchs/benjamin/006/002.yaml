  text: He does not look upon perishable things with passion, nor does he gather wealth for pleasure.
translation:
  language: ru
  text: И[a] он не смотрит на тленное со страстью и не копит богатство ради удовольствий.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начальное «и» заключено в квадратные скобки в греческом издании; его принадлежность тексту не вполне определённа.
    reason: Отражает текстологическую неопределённость [Καὶ], не приписывая предпочтение какой-либо рукописной или конфессиональной традиции.
lexical_decisions:
- source_word: ἐμπαθῶς
  choice: со страстью
  rationale: Передаёт наречие как внутренне пристрастное, страстное отношение, не сводя его лишь к желанию обладать.
- source_word: τὰ φθαρτά
  choice: тленное
  rationale: 'Сохраняет обобщённое субстантивированное значение множественного числа: преходящие и подверженные тлению вещи.'
- source_word: συνάγει πλοῦτον
  choice: копит богатство
  rationale: Естественно по-русски передаёт накопление или собирание богатства.
- source_word: εἰς φιληδονίαν
  choice: ради удовольствий
  rationale: Передаёт целевое значение εἰς и любовь к удовольствиям без более узкого или конфессионально окрашенного толкования.
theological_decisions:
- issue: Нравственная оценка материального мира и богатства
  choice: Сохранено различие между страстным отношением к тленному и накоплением богатства ради удовольствий.
  alternative: Передать стих как безусловное осуждение любых материальных вещей или всякого обладания богатством.
  rationale: Греческий текст порицает именно страстный взгляд и гедонистическую цель накопления, а не формулирует прямой запрет на всякое имущество.
translation_notes:
  register: Современный литературный русский язык; краткая афористическая структура оригинала сохранена. Союз οὐδὲ естественно передан как «и не» после первого отрицания.
