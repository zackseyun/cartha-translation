- from: 'Добрый ум не говорит на двух языках: благословения и проклятия, оскорбления и почтения, спокойствия и смятения, лицемерия и истины, [бедности и богатства], но ко всем относится одинаково — искренне и чисто.'
  to: Добрый ум не имеет двух языков — языка благословения и языка проклятия, языка оскорбления и языка почтения, языка спокойствия и языка смятения, языка лицемерия и языка истины, [языка бедности и языка богатства], — но имеет ко всем одно искреннее и чистое расположение.
