  text: Ἡ ἀγαθὴ διάνοια²⁸ οὐκ ἔχει δύο γλώσσας²⁹ εὐλογίας καὶ κατάρας³⁰, ὕβρεως καὶ ⌈τιμῆς⌉³¹, ἡσυχίας καὶ ταραχῆς, ὑποκρίσεως καὶ ἀληθείας, [πενίας καὶ πλούτου]³², ἀλλὰ *μίαν ἔχει περὶ πάντας³³ εἰλικρινῆ³⁴ καὶ³⁵ καθαρὰν ⌈διάθεσιν⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/005.yaml
  text: The good mind does not have two tongues, of blessing and cursing, of insult and honor, of quietness and disturbance, of hypocrisy and truth, [of poverty and wealth], but rather has one sincere and pure disposition toward all.
translation:
  language: ru
  text: Добрый ум не имеет двух языков — языка благословения и языка проклятия, языка оскорбления и языка почтения, языка спокойствия и языка смятения, языка лицемерия и языка истины, [языка бедности и языка богатства], — но имеет ко всем одно искреннее и чистое расположение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἡ ἀγαθὴ διάνοια
  choice: Добрый ум
  rationale: Передаёт нравственно направленный образ мыслей; «ум» здесь естественнее и доступнее, чем более отвлечённое «расположение ума».
- source_word: οὐκ ἔχει δύο γλώσσας
  choice: не говорит на двух языках
  rationale: Сохраняет метафору двух языков и естественно выражает непоследовательную, двойственную речь.
- source_word: ὕβρεως καὶ τιμῆς
  choice: оскорбления и почтения
  rationale: ὕβρις в данном перечне обозначает унижение или оскорбление, а τιμή — оказываемую честь, переданную современным словом «почтение».
- source_word: ἡσυχίας καὶ ταραχῆς
  choice: спокойствия и смятения
  rationale: Сохраняет противопоставление мирного состояния возмущению или беспорядку без неоправданного сужения смысла.
- source_word: μίαν ... εἰλικρινῆ καὶ καθαρὰν διάθεσιν
  choice: ко всем относится одинаково — искренне и чисто
  rationale: Идиоматично раскрывает единое, нелицемерное расположение ко всем; «одинаково» передаёт μίαν, а наречная конструкция избегает тяжеловесного «имеет одно расположение».
theological_decisions:
- issue: Нравственная цельность «доброго ума»
  choice: Сохранить образ противоположных видов речи и единого отношения ко всем
  alternative: Истолковать стих как запрет конкретных форм поведения или как учение о внутренней природе человека
  rationale: Греческий текст подчёркивает недвойственность и искренность, но не уточняет богословскую систему или отдельную доктрину.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Квадратные скобки вокруг «бедности и богатства» сохранены как текстологический сигнал исходного издания; отдельная сноска не добавлена, поскольку пользователь не предоставил содержания критического примечания 32.
