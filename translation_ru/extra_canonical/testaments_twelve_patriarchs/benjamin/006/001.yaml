source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: VI. Τὸ διαβούλιον τοῦ ἀγαθοῦ ἀνδρὸς οὐκ ἔστιν ἐν χειρὶ πλάνης¹ πνεύματος² Βελίαρ· ὁ γὰρ ἄγγελος τῆς εἰρήνης ὁδηγεῖ τὴν ψυχὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/001.yaml
  text: The purpose of a good man is not in the hand of the spirit of Beliar's error, for the angel of peace guides his soul.
translation:
  language: ru
  text: VI. Намерение доброго человека не во власти духа заблуждения Велиара, ибо ангел мира направляет его душу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ διαβούλιον
  choice: намерение
  rationale: Передаёт замысел или внутреннее решение человека; в данном контексте естественнее современного русского «совет» и не сужает значение до отдельной цели.
- source_word: τοῦ ἀγαθοῦ ἀνδρός
  choice: доброго человека
  rationale: Ἀνήρ здесь обозначает человека мужского пола, но высказывание носит нравственно-обобщающий характер; формула сохраняет привычную и понятную передачу исходного выражения.
- source_word: οὐκ ἔστιν ἐν χειρί
  choice: не во власти
  rationale: Греческая идиома буквально говорит «не в руке»; русский эквивалент «не во власти» ясно передаёт смысл контроля или господства.
- source_word: πλάνης πνεύματος Βελίαρ
  choice: духа заблуждения Велиара
  rationale: 'Сохраняет порядок смысловых связей греческого текста: πλάνης определяет πνεύματος, а Βελίαρ может пониматься как относящийся к духу. «Заблуждение» передаёт πλάνη без обязательного оттенка намеренного обмана.'
- source_word: ὁ ἄγγελος τῆς εἰρήνης
  choice: ангел мира
  rationale: Формально и естественно передаёт родительный оборот, сохраняя религиозный образ и возможную смысловую широту εἰρήνη.
- source_word: ὁδηγεῖ τὴν ψυχὴν αὐτοῦ
  choice: направляет его душу
  rationale: Передаёт значение ведения и руководства, не добавляя идеи принуждения или полного контроля.
theological_decisions:
- issue: Характер отношения между добрым человеком и силами Велиара
  choice: «не во власти»
  alternative: «не в руке»
  rationale: Выбрана естественная русская идиома, сохраняющая утверждение об отсутствии господства духа заблуждения, но не развивающая его в доктрину о безгрешности или невозможности искушения.
- issue: Связь Велиара с «духом заблуждения»
  choice: «духа заблуждения Велиара»
  alternative: «духа Велиарова заблуждения» / «духа заблуждения, то есть Велиара»
  rationale: Греческая конструкция синтаксически сжата. Перевод сохраняет её неоднозначность и не отождествляет без необходимости самого Велиара с духом.
translation_notes:
  register: Современный литературный русский язык с достоинством межзаветного религиозно-нравственного текста. Сохранён номер главы «VI». Формулировка ясна обычному читателю, без архаизмов и конфессионально нагруженных уточнений.
