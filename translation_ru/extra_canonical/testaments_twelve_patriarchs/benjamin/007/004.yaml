  source_fidelity: 'Перевод точно передаёт последовательность и основные элементы греческого текста: двухсотлетнее страдание, опустошение в девятисотом году, суд Каина в связи с Авелем и «всеми бедствиями», неполно выраженное сопоставление с Ламехом («семьдесят раз по семь»), а также будущее наказание подражающих Каину в зависти и ненависти к братьям. Сохранены настоящее время в πάσχει и ἐρημοῦται, пассивный характер суда и намеренная эллиптичность после «Ламех же».'
  naturalness: Текст написан естественным современным литературным русским языком и удерживает торжественный, наставительный регистр. «На девятисотом году» и «подвергается разорению» несколько формальны, но уместны для передачи необычного и не вполне определённого образа оригинала. Тире в сопоставлении с Ламехом удачно сохраняет неполноту исходной конструкции без искусственного восполнения сказуемого.
  terminology: «Терпит страдания», «осуждён на всевозможные бедствия», «зависть», «ненависть к братьям» и «суд» адекватно передают соответствующие греческие выражения. «До конца века» согласуется с английской аудиторской передачей и снабжено необходимой сноской, отмечающей возможное значение «навеки», без догматического сужения смысла. Сноска a обоснованно поясняет семантическую неопределённость ἐρημοῦται.
