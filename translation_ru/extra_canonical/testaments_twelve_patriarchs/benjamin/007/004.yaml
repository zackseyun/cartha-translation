source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Διακοσίων ἐτῶν πάσχει, καὶ ἐννακοσιοστῷ²⁶ ἔτει ἐρημοῦται²⁷· διὰ γὰρ Ἄβελ τὸν ἀδελφὸν αὐτοῦ * ἐν πᾶσι τοῖς κακοῖς ἐκρίνετο, ὁ δὲ Λαμὲχ ἐν ἑβδομηκοντάκις ἑπτά. Ὅτι³⁶ *ἕως τοῦ αἰῶνος³⁷ οἱ ὁμοιούμενοι *τῷ Καὶν³⁸ Γ*ἐπὶ φθόνῳ καὶ μισαδελφίᾳ τοιαύτῃ⁷ κολασθήσονται Γκρίσει⁷³⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/004.yaml
  text: For two hundred years he suffers, and in the nine-hundredth year he was made desolate; for because of Abel his brother he was judged in all evils, but Lamech in seventy times seven. Because to the end of the age, those who become like Cain in envy and hatred of brothers will be punished with similar judgment.
translation:
  language: ru
  text: Двести лет он терпит страдания, а на девятисотом году подвергается разорению[a]. Ибо за Авеля, своего брата, он был осуждён на всевозможные бедствия, Ламех же — в семьдесят раз по семь. Ведь до конца века[b] те, кто уподобляется Каину в зависти и ненависти к братьям, подвергнутся такому же суду.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «опустошается»; возможно также: «оказывается опустошённым» или «гибнет».'
    reason: Глагол ἐρημόω имеет образное значение опустошения и разорения, но применительно к человеку точный оттенок неясен.
  - marker: b
    text: 'Или: «навеки».'
    reason: Выражение ἕως τοῦ αἰῶνος может обозначать как предел века, так и неограниченную длительность.
lexical_decisions:
- source_word: πάσχει
  choice: терпит страдания
  rationale: Передаёт длительное настоящее время и широкий смысл глагола «страдать, претерпевать», не уточняя природу наказания.
- source_word: ἐρημοῦται
  choice: подвергается разорению
  rationale: Сохраняет пассивность и образ опустошения/разорения; менее определённо, чем «погибает» или «уничтожается».
- source_word: ἐν πᾶσι τοῖς κακοῖς ἐκρίνετο
  choice: был осуждён на всевозможные бедствия
  rationale: Греческое выражение буквально связывает суд со «всеми бедами/злами»; по-русски конструкция «осуждён на» естественно выражает наказание, не превращая κακά в нравственные проступки Каина.
- source_word: ἐν ἑβδομηκοντάκις ἑπτά
  choice: в семьдесят раз по семь
  rationale: Сохраняет формулу семидесятикратного семикратия и её намеренно необычную числовую форму.
- source_word: μισαδελφίᾳ
  choice: ненависти к братьям
  rationale: Передаёт редкое сложное существительное буквально по смыслу и естественно для современного русского языка; множественное число соответствует общему нравственному наставлению.
- source_word: κολασθήσονται κρίσει
  choice: подвергнутся ... суду
  rationale: Передаёт будущую пассивную форму наказания через суд, избегая избыточного русского сочетания «будут наказаны судом».
theological_decisions:
- issue: Характер суда над Каином и уподобляющимися ему
  choice: Сохранена связь суда с бедствиями и будущим наказанием без уточнения, земное оно или посмертное.
  alternative: Истолковать как вечное посмертное наказание.
  rationale: Сам греческий текст не даёт достаточных оснований для такого догматического уточнения.
- issue: Значение ἕως τοῦ αἰῶνος
  choice: до конца века
  alternative: навеки
  rationale: Фраза допускает временно-эсхатологическое и идиоматически вечное понимание; основной текст сохраняет формулировку консультационного слоя и исходную напряжённость, а сноска отмечает альтернативу.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксис сделан ясным для широкого читателя, однако временные числа, пассивный характер суда и неоднозначность эсхатологической формулы сохранены. Эллипсис после «Ламех же» передан тире без добавления отсутствующего в греческом сказуемого.
