source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: VII. ΓΔιὰ τοῦτο¹, τέκνα μου, Γλέγω ὑμῖν¹¹, φεύγετε τὴν κακίαν² †Γτοῦ Βελίαρ³ ὅτι μάχαιραν³ δίδωσιν⁴ τοῖς πειθομένοις αὐτόν⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/001.yaml
  text: Therefore, my children, I tell you, flee the evil of Beliar, because he gives a sword to those who obey him.
translation:
  language: ru
  text: 'Поэтому, дети мои, говорю вам: бегите от зла Велиара, потому что он даёт меч тем, кто ему повинуется.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт вывод или следствие, выраженное греческим оборотом, и естественно связывает наставление с предшествующим контекстом.
- source_word: φεύγετε
  choice: бегите
  rationale: Сохраняет прямой и настоятельный образ физического удаления, употреблённый как нравственный призыв.
- source_word: τὴν κακίαν
  choice: от зла
  rationale: Греческое существительное может обозначать зло, порочность или нечестие; общее «зло» сохраняет широту значения.
- source_word: τοῦ Βελίαρ
  choice: Велиара
  rationale: Передаёт традиционное имя собственное без истолкования его природы или роли.
- source_word: μάχαιραν
  choice: меч
  rationale: В данном афористическом контексте «меч» естественно передаёт оружие и образ насилия; более узкое «короткий меч» было бы излишне конкретным.
- source_word: τοῖς πειθομένοις αὐτόν
  choice: тем, кто ему повинуется
  rationale: Средняя форма πείθομαι с дательным лицом здесь означает подчинение или послушание, а не просто интеллектуальную убеждённость.
theological_decisions:
- issue: Связь зла с Велиаром
  choice: «зло Велиара»
  alternative: «зло, исходящее от Велиара» / «порочность Велиара»
  rationale: Родительный падеж в источнике допускает оттенки принадлежности или происхождения; буквальная конструкция сохраняет эту неоднозначность и не вводит дополнительного толкования.
- issue: Смысл образа меча
  choice: 'Сохранён буквальный образ: «он даёт меч»'
  alternative: Истолковать как «он ведёт к насилию/гибели»
  rationale: Источник не поясняет, является ли меч орудием насилия, раздора или наказания; перевод не должен устранять эту богословскую и образную напряжённость.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксис краткий и прямой; обращение «дети мои» сохранено, имя передано как «Велиар» в соответствии с формой греческого текста.
