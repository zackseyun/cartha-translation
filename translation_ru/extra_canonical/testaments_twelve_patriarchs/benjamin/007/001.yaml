  source_fidelity: 'Текст точно передаёт греческий оригинал: Διὰ τοῦτο — «Поэтому», обращение τέκνα μου — «дети мои», повеление φεύγετε сохранено в его настоятельности, а ὅτι и последующее объяснение переданы без добавочного истолкования. «Зло Велиара» сохраняет исходную неоднозначность родительного падежа; образ меча оставлен буквальным.'
