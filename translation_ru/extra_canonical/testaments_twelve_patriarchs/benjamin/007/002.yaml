  text: Ἡ δὲ μάχαιρα⁶ ἑπτὰ κακῶν μήτηρ ἐστί. *πρῶτον συλλαμβάνει ἡ διάνοια διὰ τοῦ Βελίαρ⁷. †*Καὶ ἔστιν πρῶτον⁸ ὁ †φθόνος⁹, δεύτερον¹⁰ ἡ¹¹ †ἀπώλεια¹², τρίτον ἡ¹¹ θλῖψις, τέταρτον ἡ¹¹ θεηλασία¹³, πέμπτον ἡ¹¹ ἔνδεια, ἕκτον ἡ¹¹ ταραχή, ἕβδομον ἡ¹¹ ἐρήμωσις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/002.yaml
  text: 'And the sword is the mother of seven evils. First the mind conceives through Beliar, and these are its births: first envy, second destruction, third affliction, fourth captivity, fifth want, sixth turmoil, seventh desolation.'
translation:
  language: ru
  text: А меч — мать семи зол. Сначала разум зачинает через Велиара[a]. Первое — зависть; второе — погибель; третье — скорбь; четвёртое — пленение[b]; пятое — нужда; шестое — смятение; седьмое — опустошение.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Велиар — одно из древних именований олицетворённого зла, противника Бога.
    reason: Имя может быть незнакомо современному читателю и требует краткого нейтрального пояснения.
  - marker: b
    text: Греческое слово в этом месте редкое и, возможно, искажённое; возможны значения, связанные с пленением, разорением или бедствием, посланным свыше.
    reason: Необходимо обозначить реальную лексическую и текстологическую неопределённость.
lexical_decisions:
- source_word: μάχαιρα
  choice: меч
  rationale: В данном нравоучительном контексте обозначает оружие и связанное с ним насилие; «меч» естественно и традиционно передаёт образ по-русски.
- source_word: συλλαμβάνει ἡ διάνοια
  choice: разум зачинает
  rationale: Сохранена метафора зачатия, которая объясняет последующее перечисление порождённых зол, хотя текст в этом месте испорчен.
- source_word: Βελίαρ
  choice: Велиар
  rationale: Передано как имя собственное в форме, близкой греческому написанию и принятой в русской библейской традиции.
- source_word: φθόνος
  choice: зависть
  rationale: Прямое и естественное соответствие основному значению слова.
- source_word: ἀπώλεια
  choice: погибель
  rationale: Сохраняет широкий смысл гибели, разрушения или уничтожения, не сужая его до одного вида бедствия.
- source_word: θλῖψις
  choice: скорбь
  rationale: Передаёт бедствие, страдание и тяжесть положения в достоинном литературном регистре.
- source_word: θεηλασία
  choice: пленение
  rationale: Редкое и текстуально трудное слово; по контексту перечня последствий меча и по древней переводческой традиции наиболее вероятен смысл увода в плен или разорительного захвата.
- source_word: ἔνδεια
  choice: нужда
  rationale: Передаёт недостаток необходимого и бедность без излишнего уточнения.
- source_word: ταραχή
  choice: смятение
  rationale: Сохраняет значения беспорядка, тревоги и потрясения.
- source_word: ἐρήμωσις
  choice: опустошение
  rationale: Точно передаёт итоговое разорение и запустение.
theological_decisions:
- issue: Посредничество Велиара в возникновении зла
  choice: «разум зачинает через Велиара»
  alternative: «Велиар первым овладевает разумом»
  rationale: Греческий текст грамматически связывает зачатие с разумом и выражением «через Велиара»; перевод сохраняет эту напряжённую причинную формулировку, не превращая её в более определённое учение об одержимости.
- issue: Связь перечня с метафорой рождения
  choice: «И вот что возникает первым»
  alternative: «и вот его порождения»
  rationale: Исходный текст в переходе к перечню испорчен и не содержит надёжно засвидетельствованного существительного «порождения»; выбранная формулировка делает синтаксис понятным, сохраняя метафору в глаголе «зачинает» и не добавляя спорного чтения.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Сохранены образ меча как «матери» зол и метафора зачатия. Нумерованный ряд передан ритмично и ясно; текстологическая неустойчивость переходной фразы и четвёртого элемента не скрыта.
