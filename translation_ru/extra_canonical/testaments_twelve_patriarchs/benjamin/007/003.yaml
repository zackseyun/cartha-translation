  source_fidelity: 'Перевод точно передаёт основные элементы греческого текста: причинную связь и усилительное καί («Поэтому и»), пассив παρεδόθη с явно названным деятелем ὑπὸ τοῦ Θεοῦ («был предан Богом»), семь ἐκδικίαι, а также распределительное κατὰ ἑκατοστὸν ἔτος («в каждый сотый год»). Формула «поражал его одной язвой» адекватно передаёт πληγὴν ἐπήγαγεν ἐπʼ αὐτόν. Не добавляется отсутствующее в источнике объяснение связи между семью карами и периодическими язвами.'
