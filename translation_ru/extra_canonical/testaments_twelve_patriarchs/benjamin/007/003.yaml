  terminology: «Каин», «Бог», «Господь» и «язва» выдержаны последовательно и соответствуют исходным формам Κάϊν, Θεός, Κύριος и πληγή. «Кары» удачно сохраняет множественность и карательно-возмездный характер ἐκδικίαις, не навязывая более узкого толкования.
