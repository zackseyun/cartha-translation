source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Διὰ τοῦτο καὶ¹⁸ ὁ Κάϊν ἑπτὰ ἐκδικίαις¹⁹ παρεδόθη²⁰ ὑπὸ τοῦ Θεοῦ²¹. *κατὰ γὰρ²² ἑκατοστὸν ἔτος²³ μίαν πληγὴν ἐπήγαγεν *ἐπʼ αὐτὸν²⁴ ⸀Κύριος²⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/003.yaml
  text: Because of this also, Cain was handed over by God to seven acts of vengeance. For every hundredth year the Lord brought one plague upon him.
translation:
  language: ru
  text: Поэтому и Каин был предан Богом семи карам. Ибо в каждый сотый год Господь поражал его одной язвой.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκδικίαις
  choice: карам
  rationale: Передаёт множественное число и смысл возмездия или наказания, не сужая его до отдельных «актов мести».
- source_word: παρεδόθη
  choice: был предан
  rationale: Сохраняет пассивную конструкцию и явное указание на Бога как действующее лицо.
- source_word: κατὰ ἑκατοστὸν ἔτος
  choice: в каждый сотый год
  rationale: Передаёт распределительное значение κατά и порядковое числительное ἑκατοστόν, не превращая выражение в общий период продолжительностью сто лет.
- source_word: πληγὴν ἐπήγαγεν ἐπʼ αὐτόν
  choice: поражал его одной язвой
  rationale: Естественная русская формулировка, сохраняющая значение нанесения одного бедствия или поражения; «язва» соответствует библейскому регистру πληγή.
theological_decisions:
- issue: Соотношение семи кар и периодических язв
  choice: Не уточнять, каким образом семь кар распределены по времени
  alternative: Добавить, что язвы следовали одна за другой либо продолжались семь столетий
  rationale: Греческий текст этого прямо не объясняет; добавление устранило бы сохраняющуюся в источнике неопределённость.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Союз «и» после «поэтому» сохраняет καὶ; «Господь» передаёт Κύριος, а «Богом» — ὑπὸ τοῦ Θεοῦ.
