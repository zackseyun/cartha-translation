review_pass:
  verdict: revise
  source_fidelity: Требуется точечная правка ст. 7 и 10. В ст. 7 греческое ἐπὶ σκήπτρον ἡμῶν содержит притяжательное местоимение 1-го лица множественного числа («нашим»), тогда как «со своим скипетром» незаметно заменяет его на индивидуальное. В ст. 10 исходная конструкция синтаксически крайне трудна; перевод с «так что те ... стали» слишком определённо относит последующее «стали» к обманутым братьям. Исправленный текст сохраняет эту неясность и снабжает её примечанием. Скобочное окончание ст. 5 переведено верно и не должно быть переставлено вслед за английским аудиторским слоем, где нарушено членение греческого текста.
  naturalness: В целом регистр современный литературный и соответствует завещательному наставлению. В ст. 1 слегка перестроена заключительная тавтологическая формула, чтобы она звучала по-русски естественнее, но сохраняла усилительное повторение исходника. В ст. 11 сохранена намеренная трудность выражения «во мне с надеждой»; примечание объясняет его, не подменяя толкованием.
  terminology: «Ближний», «закон», «заповеди», «Господь», «Бог», «слава» и «бесчестие» последовательны и уместны. Имена Енох, Сиф, Авраам, Исаак, Иаков и Исав переданы нормативно. «Блуд» и «идолослужение» сохраняют возвышенно-библейский, но понятный современному читателю регистр.
  issues:
  - severity: medium
    issue: 'Ст. 7: «каждый со своим скипетром»'
    rationale: Это заменяет ἡμῶν («нашим», 1-е лицо множественного числа) на «своим». Поскольку фраза текстуально трудна, перевод не должен устранять эту особенность.
  - severity: high
    issue: 'Ст. 10: чрезмерное разрешение синтаксической неоднозначности'
    rationale: Слова «так что те ... и таким образом стали» относят и отчуждение, и становление «детьми» к обманутым братьям. В греческом связь инфинитива γενέσθαι, формы ἀπηλλοτριώθησαν и причастия γενόμενοι не позволяет уверенно установить референт. Нужна более нейтральная передача и примечание.
  - severity: low
    issue: 'Ст. 1: заключительная формула звучит по-русски тяжеловесно'
    rationale: «таким, каким был весь его облик» формально близко к греческому, но неестественно. Небольшая перестройка сохраняет повтор «облик», не меняя смысла.
  revised_text: '1. Когда Иосиф был в Египте, я жаждал увидеть его облик и черты его лица. И по молитвам моего отца Иакова я увидел его днём, бодрствуя, — таким, каков был его облик во всей полноте.


    2. Сказав это, он обратился к ним: «Знайте же, дети мои, что я умираю. 3. Поэтому поступайте по истине[a], каждый по отношению к своему ближнему, и соблюдайте закон Господа и Его заповеди. 4. Всё это я оставляю вам вместо всякого наследства. И вы передайте это своим детям как вечное достояние, ибо так поступили Авраам, Исаак и Иаков. 5. Всё это они дали нам в наследство, говоря: „Соблюдайте заповеди Бога, пока [Господь не явит Своё спасение всем народам]“.[b]


    6. И тогда вы увидите Еноха, Сифа, Авраама, Исаака и Иакова, воскресших по правую руку от Него и ликующих. 7. Тогда и мы воскреснем, каждый — с нашим скипетром[c], и поклонимся Царю небес, [явившемуся на земле в человеческом облике, в смирении; и все, кто поверит в Него на земле, будут радоваться вместе с Ним].


    8. И все воскреснут: одни — для славы, другие — для бесчестия. И Господь прежде всего осудит Израиль за его неправедность, [потому что они не поверили Богу, пришедшему во плоти]. 9. Затем Он осудит все народы, [которые не поверили Ему, когда Он явился на земле]. 10. И через избранных из народов Он обличит Израиль, как обличил Исава среди мадианитян, обманувших своих братьев, [так что те через блуд и идолослужение отчуждились от Бога], и таким образом ставших детьми в уделе боящихся Господа[e].


    11. Итак, дети мои, если вы будете ходить в святости, соблюдая заповеди Господа, то вновь будете пребывать во мне с надеждой[d], и весь Израиль соберётся к Господу».'
