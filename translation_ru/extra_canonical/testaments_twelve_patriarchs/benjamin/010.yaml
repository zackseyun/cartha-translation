base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010.yaml
  text: '1[a]. Now when Joseph was in Egypt, I longed to see his appearance and the form of his face; and through the prayers of Jacob my father I saw him, while awake by day, exactly as his whole appearance was.


    2. And after saying these things he said to them, “Know then, my children, that I am dying. 3[b]. Therefore do truth, each one toward his neighbor, and keep the law of the Lord and his commandments. 4. For these things I leave you instead of every inheritance. And you also give them to your children as an everlasting possession; for thus Abraham and Isaac and Jacob did. 5. For they gave all these things to us as an inheritance, saying, ‘Keep the commandments of God until the time when you will see Enoch and Seth and Abraham and Isaac and Jacob risen up at his right hand in rejoicing.’


    6. Then we also will rise, each with our scepter, and we will worship the King of the heavens. 7. [the one who appeared on earth in the form of a man in humility; and all who believe in him on the earth will rejoice with him.]


    8. And all will rise, some to glory and some to dishonor; and the Lord will judge Israel first for their unrighteousness [because when God came to them in flesh, they did not believe him]. 9. And then he will judge all the nations [which did not believe him when he appeared on earth]. 10. And through the chosen ones from among the nations he will convict Israel, just as he convicted Esau through the Midianites, who deceived their brothers into becoming, through sexual immorality and idolatry, estranged from God, and so they became children in the portion of those who fear the Lord.


    11. You therefore, my children, if you walk in holiness in the commandments of the Lord, you will dwell again with confidence in me[d][c], and all Israel will be gathered to the Lord.'
translation:
  language: ru
  text: '1. Когда Иосиф был в Египте, я жаждал увидеть его облик и черты его лица. И по молитвам моего отца Иакова я увидел его днём, бодрствуя, — таким, каким был весь его облик.


    2. Сказав это, он обратился к ним: «Знайте же, дети мои, что я умираю. 3. Поэтому поступайте по истине[a] каждый со своим ближним и соблюдайте закон Господа и Его заповеди. 4. Всё это я оставляю вам вместо всякого наследства. И вы передайте это своим детям как вечное достояние, ибо так поступили Авраам, Исаак и Иаков. 5. Всё это они дали нам в наследство, говоря: „Соблюдайте заповеди Бога, пока [Господь не явит Своё спасение всем народам]“.[b]


    6. И тогда вы увидите Еноха, Сифа, Авраама, Исаака и Иакова, воскресших по правую руку от Него и ликующих. 7. Тогда и мы воскреснем, каждый со своим скипетром[c], и поклонимся Царю небес, [явившемуся на земле в человеческом облике, в смирении; и все, кто поверит в Него на земле, будут радоваться вместе с Ним].


    8. И все воскреснут: одни — для славы, другие — для бесчестия. И Господь прежде всего осудит Израиль за его неправедность, [потому что они не поверили Богу, пришедшему во плоти]. 9. Затем Он осудит все народы, [которые не поверили Ему, когда Он явился на земле]. 10. И через избранных из народов Он обличит Израиль, как обличил Исава через мадианитян, обманувших своих братьев, [так что те впали в блуд и идолослужение и отчуждились от Бога], и таким образом стали детьми среди удела боящихся Господа.


    11. Итак, дети мои, если вы будете ходить в святости, соблюдая заповеди Господа, то вновь будете пребывать во мне с надеждой[d], и весь Израиль соберётся к Господу».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможен перевод: «творите истину». Греческая идиома обозначает конкретную праведную жизнь и честные поступки.'
    reason: lexical_alternative
  - marker: b
    text: Квадратные скобки передают редакционное обозначение спорных фрагментов в греческом источнике. Особенно явно христианская формулировка в ст. 7–10 нередко считается позднейшим расширением текста.
    reason: textual_variant
  - marker: c
    text: Греческое выражение буквально близко к «каждый при нашем скипетре» и текстуально трудно; вероятно, оно связано с восстановленным достоинством или властью колен при воскресении.
    reason: cultural_note
  - marker: d
    text: 'Греческая фраза буквально говорит о пребывании «в надежде во мне» и остаётся неясной. Возможны варианты: «будете жить со мной в уверенности» или «обретёте во мне надежду».'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδέα / μόρφωσις / ὄψις
  choice: облик / черты / лицо
  rationale: 'Сохранено нагромождение близких по значению слов, подчёркивающее желание Вениамина ясно увидеть Иосифа, но по-русски сочетание сделано естественным: «облик и черты лица».'
- source_word: ἐν ἡμέρᾳ γρηγορῶν
  choice: днём, бодрствуя
  rationale: Передаёт противопоставление сну, не вводя отсутствующего в греческом тексте технического обозначения видения.
- source_word: ποιήσατε ... ἀλήθειαν
  choice: поступайте по истине
  rationale: Сохраняет конкретный этический характер греческой идиомы и её несколько необычное библейское звучание.
- source_word: πλησίον
  choice: ближний
  rationale: Обычное и узнаваемое русское соответствие для нравственно-заветного контекста.
- source_word: νόμος ... ἐντολαί
  choice: закон ... заповеди
  rationale: Сохранены устойчивые заветные термины и различие между ними.
- source_word: ἀντὶ πάσης κληρονομίας
  choice: вместо всякого наследства
  rationale: 'Передана противопоставительная сила ἀντί: наставления составляют оставляемое Вениамином истинное наследие.'
- source_word: κατάσχεσιν αἰώνιον
  choice: вечное достояние
  rationale: Естественно выражает нечто прочно сохраняемое и передаваемое из поколения в поколение.
- source_word: ἀνασταμένους ἐκ δεξιῶν αὐτοῦ
  choice: воскресших по правую руку от Него
  rationale: Контекст указывает на воскресение, а местоимение сохранено без уточнения его неоднозначного антецедента.
- source_word: ἐπὶ σκήπτρον ἡμῶν
  choice: каждый со своим скипетром
  rationale: Фраза текстуально трудна; выбран осторожный и понятный образ восстановленного достоинства без замены скипетра престолом или коленом.
- source_word: ἀτιμία
  choice: бесчестие
  rationale: Сохраняет формальную антитезу со «славой» в сцене всеобщего воскресения и суда.
- source_word: ἐπʼ ἐλπίδι ἐν ἐμοί
  choice: пребывать во мне с надеждой
  rationale: Максимально сохраняет трудную структуру греческой фразы, не превращая «надежду» без достаточного основания в субъективную уверенность.
theological_decisions:
- issue: Заключённые в квадратные скобки фрагменты в ст. 5 и 7–10
  choice: Переведены в основном тексте и сохранены в квадратных скобках.
  alternative: Опустить как позднейшие вставки либо печатать без каких-либо обозначений.
  rationale: Они присутствуют в предоставленном греческом свидетельстве, но редакционное оформление источника указывает на текстологическую неуверенность. Скобки позволяют не скрывать ни сам текст, ни его спорный статус.
- issue: Антецедент αὐτοῦ в выражении «по правую руку от Него»
  choice: Сохранено местоимение без поясняющей вставки.
  alternative: 'Уточнить: «по правую руку Бога» или «Господа».'
  rationale: В непосредственной греческой формулировке антецедент не назван явно; уточнение разрешило бы подлинную неоднозначность.
- issue: Воскресение и суд в ст. 6–10
  choice: Переданы как всеобщее воскресение с различными исходами и судом сначала над Израилем, затем над народами.
  alternative: Истолковать воскресение метафорически как национальное восстановление.
  rationale: Повторение глагола воскресения вместе с противопоставлением славы и бесчестия и последующим судом естественнее всего имеет эсхатологический смысл.
- issue: Субъект множественного «стали детьми» в ст. 10
  choice: Синтаксическая неоднозначность в основном сохранена.
  alternative: Явно отнести слова либо к мадианитянам, либо к обманутым братьям.
  rationale: Греческая конструкция повреждена или крайне трудна, поэтому категорическое уточнение внесло бы в текст недоказанное толкование.
- issue: Трудная фраза ἐπʼ ἐλπίδι ἐν ἐμοί в ст. 11
  choice: «будете пребывать во мне с надеждой»
  alternative: «будете вновь жить со мной в уверенности» или «обретёте во мне надежду».
  rationale: Выбранный вариант сохраняет как предлог ἐν, так и существительное «надежда», не снимая неясности фразы богословским перефразированием.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного и апокалиптического наставления. Синтаксис по возможности естественный, но необычные этические и эсхатологические формулы сохранены там, где сглаживание устранило бы смысловую или текстологическую напряжённость. В отличие от английского консультационного слоя, восстановлено присутствующее в греческом тексте окончание ст. 5 о явлении спасения всем народам, а перечисление воскресших праотцев отнесено к ст. 6.
