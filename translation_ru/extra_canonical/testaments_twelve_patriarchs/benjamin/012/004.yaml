lexical_decisions:
- source_word: ἐπέστρεψαν
  choice: вернулись
  rationale: Прямо передаёт значение возвращения; контекст не требует добавлять направление.
- source_word: γῆς Χαναάν
  choice: земли Ханаанской
  rationale: Естественное для современного литературного русского библейское географическое обозначение.
- source_word: ᾤκησαν
  choice: жили
  rationale: Нейтрально и ясно передаёт длительное проживание, не перегружая текст архаизмом «обитали».
- source_word: ἕως ἡμέρας ἐξόδου αὐτῶν
  choice: до дня своего исхода
  rationale: Сохраняет буквальный образ определённого дня и существительное «исход», уместное в данном библейском контексте.
- source_word: ἐκ γῆς Αἰγύπτου
  choice: из земли Египетской
  rationale: Сохраняет повтор слова «земля» в греческом тексте и его торжественный библейский регистр.
