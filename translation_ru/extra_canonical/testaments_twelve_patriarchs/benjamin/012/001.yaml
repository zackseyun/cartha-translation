  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012/001.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a good [and good] sleep.
translation:
  language: ru
  text: И, сказав всё это, он вытянул ноги и уснул добрым [и благим] сном.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «и благим» имеются не во всех греческих текстовых свидетелях.
    reason: Квадратные скобки в используемом издании отмечают текстуально неопределённое чтение; примечание объясняет их читателю.
lexical_decisions:
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: вытянул ноги
  rationale: Естественная русская передача греческого оборота с сохранением конкретного телесного действия.
- source_word: ἐκοιμήθη
  choice: уснул
  rationale: Передаёт прямое значение глагола и одновременно сохраняет возможный эвфемистический оттенок смерти, не делая его явным.
- source_word: ὕπνῳ καλῷ
  choice: сном прекрасным
  rationale: Сохраняет фигуру внутреннего дополнения и положительную характеристику сна; «прекрасным» точнее отражает καλός, чем простое «хорошим».
- source_word: καὶ ἀγαθῷ
  choice: и благим
  rationale: Сохраняет отдельный эпитет ἀγαθός и его отличие от καλός, а также рукописную неопределённость посредством скобок.
theological_decisions:
- issue: ἐκοιμήθη может описывать как обычный сон, так и смерть эвфемистически
  choice: уснул
  alternative: почил
  rationale: Нейтральное «уснул» сохраняет образ и не устраняет смысловую напряжённость контекста; «почил» однозначнее направляло бы читателя к смерти.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного повествования. Сохранены образное «уснул» и стилистически заметное сочетание «сном прекрасным»; bracketed variant отражён в основном тексте и пояснён сноской.
