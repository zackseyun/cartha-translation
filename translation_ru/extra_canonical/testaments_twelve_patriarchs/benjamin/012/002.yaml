base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012/002.yaml
  text: 'And his sons did as he had commanded them, and they carried his body and buried him in Hebron with his fathers.


    And when he had finished his words, he said, “I command you, my children, carry my bones up out of Egypt, and bury me in Hebron near my fathers.”

    And Benjamin died at one hundred and twenty-five years, in a good old age; and they placed him in a coffin.'
translation:
  language: ru
  text: 'И сыновья его поступили так, как он им повелел: подняли его тело и похоронили его в Хевроне вместе с его отцами.


    Окончив свои слова, он сказал: «Заповедую вам, дети мои: вынесите мои кости из Египта и похороните меня в Хевроне, рядом с моими отцами».


    И умер Вениамин, прожив сто двадцать пять лет, в доброй старости; и положили его в гроб.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄραντες τὸ σῶμα αὐτοῦ
  choice: взяли его тело
  rationale: Передаёт действие без излишнего уточнения способа переноса; последующее погребение ясно из контекста.
- source_word: ἀνενέγκατε τὰ ὀστᾶ μου ἐξ Αἰγύπτου
  choice: вынесите мои кости из Египта
  rationale: Глагол обозначает перенесение вверх или из указанного места; по-русски естественнее «вынесите из Египта», без навязанного географического пояснения.
- source_word: μετὰ / ἐγγὺς τῶν πατέρων
  choice: вместе с его отцами / рядом с моими отцами
  rationale: Сохраняется родовой и погребальный смысл слова «отцы», а различие между «вместе с» и «рядом с» отражает разные греческие предлоги.
- source_word: ἐν γήρει καλῷ
  choice: в доброй старости
  rationale: Сохраняет положительную оценку старости в оригинале и библейски достоинный тон.
- source_word: ἐν παραθήκῃ
  choice: в гроб
  rationale: В данном погребальном контексте речь идёт о помещении тела для сохранения; «гроб» ясно и естественно передаёт подразумеваемый предмет.
theological_decisions:
- issue: Повторное упоминание погребения до рассказа о смерти Вениамина
  choice: Сохранить последовательность исходного греческого текста без гармонизации
  alternative: Переставить первое предложение или истолковать его как относящееся к другому лицу
  rationale: Предоставленный текст содержит напряжённую последовательность, и перевод не должен молча устранять её редакционной перестановкой.
- issue: Обозначение предков словом πατέρες
  choice: Перевести буквально как «отцы»
  alternative: «предки»
  rationale: «Отцы» сохраняет характерную родовую формулу и её связь с местом погребения, оставаясь понятным в контексте.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис упрощён там, где буквальное воспроизведение греческого было бы неестественным («Закончив говорить, он сказал»), но содержание и композиционная напряжённость источника сохранены.
