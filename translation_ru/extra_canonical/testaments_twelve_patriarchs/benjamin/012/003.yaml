  text: And in the ninety-first year after the departure of the sons of Israel from Egypt, they and their brothers brought up the bones of their fathers secretly in the war in Canaan, and buried them in Hebron beside the feet of their fathers[c].
translation:
  language: ru
  text: И в девяносто первом году после исхода сынов Израиля из Египта они и их братья тайно перенесли кости своих отцов во время войны в Ханаане и похоронили их в Хевроне, возле ног своих отцов[a].
  philosophy: optimal-equivalence
  footnotes:
