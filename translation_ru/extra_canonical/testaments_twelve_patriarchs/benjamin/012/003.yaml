    text: Выражение «возле ног своих отцов» буквально передаёт греческий текст и, возможно, указывает на место погребения рядом с гробницами предков, а не непосредственно у их ног.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξόδου
  choice: исхода
  rationale: Слово «исход» точно передаёт выход из Египта и естественно звучит в данном историческом контексте.
- source_word: ἀνήγαγον
  choice: перенесли
  rationale: Буквально глагол может означать «подняли» или «принесли наверх», но применительно к костям и месту погребения русское «перенесли» яснее передаёт действие без ненужной пространственной конкретизации.
- source_word: ἐν τῷ πολέμῳ Χαναάν
  choice: в ходе войны в Ханаане
  rationale: Сохранена связь перенесения костей с войной в Ханаане; формулировка не уточняет, была ли это война за Ханаан или иная война на его территории.
- source_word: παρὰ τοὺς πόδας τῶν πατέρων αὐτῶν
  choice: возле ног своих отцов
  rationale: Сохранён буквальный и необычный образ греческого текста; возможный погребальный смысл пояснён в сноске.
