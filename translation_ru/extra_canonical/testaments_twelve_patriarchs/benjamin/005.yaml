base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005.yaml
  text: '1[a]. If, then, you also have a good mind, even wicked people will be at peace with you, and the lawless[b], being put to shame before you, will turn back to what is good; and those who are greedy will not only withdraw from their passion, but will also give to those in distress the things of greed that they had possessed.


    2. If you are doing good, even the unclean spirits will flee from you, and the wild beasts will fear you.


    3. For where there is the fear of good works and light in the mind, darkness flees away from it.


    4. For if anyone does violence to a holy man, he changes his mind; for the holy one has mercy on those who revile him and keeps silent.


    5. And if anyone betrays a righteous soul and insults a righteous soul, the righteous man prays; and even if for a little while he is brought low, before long he appears far more radiant[e][d][c], as Joseph my brother also became.'
translation:
  language: ru
  text: '1. Итак, если и у вас будет добрый образ мыслей, то даже злые люди будут жить с вами в мире, а беспутные[a], устыдившись перед вами, обратятся к добру. Алчные же не только откажутся от своей страсти, но и отдадут бедствующим то, что было у них от алчности[b].


    2. Если вы будете делать добро, то даже нечистые духи побегут от вас, и дикие звери будут вас бояться.


    3. Ибо там, где есть страх добрых дел[c] и свет в разуме, тьма бежит прочь от него.


    4. Если кто оскорбит благочестивого человека, то переменит свой образ мыслей[d], потому что благочестивый милует тех, кто его поносит, и молчит.


    5. И если кто предаст праведника, праведник молится. Пусть он и будет ненадолго унижен, вскоре он явится ещё более сияющим — таким, каким стал мой брат Иосиф[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «распутные», «безудержные»; слово ἄσωτοι может также подразумевать расточительных людей.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «то, что у них было от алчности»; возможный смысл: то, что связано с их алчностью, в том числе нажитое или приобретённое из алчности.'
    reason: lexical_alternative
  - marker: c
    text: Выражение «страх добрых дел» в греческом тексте трудно для понимания. Оно может означать благоговение, связанное с добрыми делами, либо страх, который внушает жизнь, исполненная добра.
    reason: alternative_reading
  - marker: d
    text: 'Или: «раскается». Глагол μετανοεῖ буквально указывает на перемену ума или образа мыслей.'
    reason: lexical_alternative
  - marker: e
    text: История Иосифа показывает, как временное унижение сменилось возвышением и оправданием. См. Бытие 37; 39–45.
    reason: cross_reference
lexical_decisions:
- source_word: διάνοιαν
  choice: образ мыслей / разум
  rationale: В ст. 1 выражение «добрый образ мыслей» естественно передаёт нравственно-интеллектуальную направленность; в ст. 3 «разум» сохраняет образ внутреннего света.
- source_word: ἄσωτοι
  choice: беспутные
  rationale: Слово обозначает людей распущенных, безудержных или расточительных; «беспутные» передаёт нравственную неупорядоченность, не сужая смысл до финансовой расточительности.
- source_word: εἰρηνεύσουσιν μεθʼ ὑμῶν
  choice: будут жить с вами в мире
  rationale: Передаёт будущие мирные отношения с адресатами и естественно звучит по-русски.
- source_word: πλεονεκτοῦντες
  choice: алчные
  rationale: Передаёт корыстное стремление иметь больше и согласуется с последующим упоминанием приобретённого из алчности.
- source_word: τοῦ πάθους
  choice: от своей страсти
  rationale: Сохраняет нравственно-психологический смысл πάθος как внутреннего влечения, связанного здесь с алчностью.
- source_word: τὰ τῆς πλεονεξίας ἃ εἶχον
  choice: то, чем завладели из алчности
  rationale: Передаёт сжатую греческую конструкцию понятным русским языком, не определяя точный способ приобретения сверх того, что подразумевает алчность.
- source_word: θλιβομένοις
  choice: бедствующим
  rationale: Охватывает людей, находящихся под гнётом, в скорби или нужде, без неоправданного сужения смысла.
- source_word: ἀκάθαρτα πνεύματα
  choice: нечистые духи
  rationale: Устоявшееся и точное обозначение духовных существ, связанных с нечистотой.
- source_word: φόβος ἀγαθῶν ἔργων
  choice: страх добрых дел
  rationale: Формулировка намеренно сохраняет трудную и неоднозначную связь родительного падежа в греческом тексте; возможные понимания вынесены в примечание.
- source_word: ὑβρίσει
  choice: оскорбит
  rationale: В данном контексте глагол означает дерзкое, унизительное обращение; «оскорбит» не требует добавлять физическое насилие, которого контекст однозначно не устанавливает.
- source_word: φαιδρότερος
  choice: ещё более сияющим
  rationale: Сохраняет образ яркости и славного оправдания после временного унижения.
theological_decisions:
- issue: Значение μετανοεῖ в ст. 4
  choice: переменит свой образ мыслей
  alternative: раскается
  rationale: Греческий глагол обозначает перемену ума или отношения; основной текст сохраняет этот смысл, не сводя его автоматически к более богословски нагруженному «раскается».
- issue: Неоднозначное выражение φόβος ἀγαθῶν ἔργων в ст. 3
  choice: страх добрых дел
  alternative: благоговение, связанное с добрыми делами / страх, внушаемый добрыми делами
  rationale: Греческая конструкция допускает разные отношения между «страхом» и «добрыми делами»; буквальная формулировка и примечание сохраняют эту напряжённость.
- issue: Объект предательства в ст. 5
  choice: предаст праведника
  alternative: предаст праведную душу и оскорбит праведную душу
  rationale: Предоставленный греческий текст содержит только δίκαιον προδώσει и не поддерживает повторное упоминание «праведной души» или добавление об оскорблении, присутствующее в английском консультационном слое.
translation_notes:
  register: 'Современный литературный русский язык с достоинством поучительного завещательного текста. Синтаксис сделан ясным для обычного читателя, но трудные места греческого текста не сглажены: «страх добрых дел» оставлен неоднозначным, а μετανοεῖ передано как перемена образа мыслей. В ст. 5 исключена не подтверждаемая данным греческим текстом английская вставка о «праведной душе» и её оскорблении.'
