  text: For Rachel was barren for twelve years after she had borne Joseph; and she prayed to the Lord with fasting, and having conceived, she bore me.
translation:
  language: ru
  text: Ведь Рахиль после рождения Иосифа оставалась бесплодной двенадцать лет. Она молилась Господу и постилась, а зачав, родила меня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐστείρευσεν
  choice: оставалась бесплодной
  rationale: Передаёт продолжительное состояние бесплодия в течение названных двенадцати лет естественным современным русским языком.
- source_word: προσηύξατο πρὸς Κύριον
  choice: молилась Господу
  rationale: Естественная русская передача направленной к Господу молитвы без избыточно буквального «к Господу».
- source_word: μετὰ νηστείας
  choice: с постом
  rationale: Сохраняет связь поста с молитвой; греческий текст не утверждает однозначно, что зачатие произошло именно во время поста.
- source_word: συλλαβοῦσα τέτοκέ με
  choice: зачав, родила меня
  rationale: Сохраняет последовательность двух причастно-глагольных действий и повествование от лица Вениамина.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством древнего завещательного повествования. Точка вместо точки с запятой улучшает читаемость, не меняя логической связи. Не внесено отсутствующее в греческом тексте утверждение «зачав во время поста».
