  text: The Testament of Benjamin, the twelfth son of Jacob and Rachel. The Copy of the Words of Benjamin, which he set in order for his sons, after he had lived one hundred and twenty-five years.
translation:
  language: ru
  text: 'Завещание Вениамина, двенадцатого сына Иакова и Рахили.


    1. Запись слов Вениамина, которые он изложил[a] для своих сыновей, прожив сто двадцать пять лет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «установил для своих сыновей», «завещал своим сыновьям».'
    reason: 'Глагол διέθετο имеет широкий диапазон значений: распорядиться, установить, упорядочить или изложить; жанровый контекст также допускает передачу «завещал».'
lexical_decisions:
- source_word: Διαθήκη
  choice: Завещание
  rationale: Основное жанровое значение в заглавии; сохраняет связь с глаголом διέθετο и соответствует характеру произведения.
- source_word: Ἀντίγραφον λόγων
  choice: Запись слов
  rationale: Передаёт смысл письменной копии или записи речей естественным современным русским языком; буквальное «копия слов» звучало бы неясно.
- source_word: διέθετο
  choice: завещал
  rationale: Средний залог διατίθημι может означать распоряжение, установление или завещательное наставление; в данном жанровом контексте «завещал» естественно и сохраняет лексическую перекличку с заглавием.
- source_word: ζήσας ἔτη ἑκατὸν εἴκοσι πέντε
  choice: прожив сто двадцать пять лет
  rationale: Прямо передаёт аористное причастие и указание на возраст, не добавляя отсутствующего в греческом тексте уточнения о смерти.
theological_decisions:
- issue: Связь заглавия Διαθήκη с глаголом διέθετο
  choice: Передать как «Завещание» и «завещал»
  alternative: «Наставление» и «изложил» либо «распорядился»
  rationale: Выбранная формулировка сохраняет намеренную словесную и жанровую связь, но сноска отмечает более широкий смысл глагола, чтобы не сужать его без оговорки.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Заглавие отделено от первого стиха; римское обозначение раздела передано арабским номером. Имена даны в традиционной русской библейской форме.
