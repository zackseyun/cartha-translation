base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/003.yaml
  text: And since Rachel, my mother, died while giving birth to me, I had no milk; so I was nursed by Bilhah, her servant-girl.
translation:
  language: ru
  text: А поскольку Рахиль, моя мать, умерла при моём рождении, у меня не было молока; поэтому меня кормила грудью Валла, её рабыня.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέθνηκε
  choice: умерла
  rationale: Перфект употреблён в повествовании о смерти Рахили; по-русски естественно передать простым прошедшим временем.
- source_word: γεννῶσά με
  choice: рожая меня
  rationale: Причастный оборот прямо указывает, что смерть произошла во время родов, и сохраняет связь с первым лицом.
- source_word: γάλα οὐκ ἔσχον
  choice: у меня не было молока
  rationale: 'Сохранён буквальный образ греческого выражения: после смерти матери младенец остался без материнского молока.'
- source_word: ἐθήλασα
  choice: меня вскормила
  rationale: Греческая активная форма буквально допускает значение «я сосал грудь», однако в данном контексте естественный русский оборот передаёт кормление грудью со стороны Валлы без двусмысленности.
- source_word: Βαλλὰν
  choice: Валла
  rationale: Использована традиционная русская библейская форма имени служанки Рахили.
- source_word: παιδίσκην
  choice: рабыня
  rationale: Слово обозначает зависимую служанку или рабыню; «рабыня» точнее сохраняет социальный статус, чем нейтральное «служанка».
