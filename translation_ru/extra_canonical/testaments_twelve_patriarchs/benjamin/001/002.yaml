  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/002.yaml
  text: 'And after kissing them, he said: “Just as Isaac was born to Abraham in his old age, so I also was born to Jacob.”'
translation:
  language: ru
  text: 'Расцеловав их, он сказал: «Как Исаак родился у Авраама, когда тот был уже стар, так и я родился у Иакова».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καταφιλήσας
  choice: Поцеловав
  rationale: Причастие передаёт действие, предшествующее словам Вениамина; нейтральное современное выражение сохраняет смысл сердечного прощального жеста без излишнего усиления.
- source_word: ἐτέχθη τῷ Ἀβραὰμ
  choice: родился у Авраама
  rationale: Греческий пассив с дательным лицом естественно передаётся по-русски конструкцией «родился у»; она сохраняет сопоставление с последующим «у Иакова».
- source_word: ἐν γήρει αὐτοῦ
  choice: в его старости
  rationale: Буквально и ясно передаёт обстоятельство рождения Исаака, относя местоимение к Аврааму.
- source_word: οὕτως κἀγὼ τῷ Ἰακώβ
  choice: так и я родился у Иакова
  rationale: Для естественного русского предложения глагол восстанавливается из первой части сравнения, как подразумевается и в греческом тексте.
