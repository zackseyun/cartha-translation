  text: For my father loved Rachel exceedingly, and he prayed to see two sons from her.
translation:
  language: ru
  text: Ибо мой отец очень любил Рахиль и молился о том, чтобы увидеть двух сыновей от неё.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σφόδρα
  choice: очень
  rationale: Передаёт усилительное значение наречия естественным современным русским языком.
- source_word: ἠγάπα
  choice: любил
  rationale: Обычный и точный эквивалент длительного действия, выраженного имперфектом.
- source_word: ηὔχετο
  choice: молился
  rationale: В данном контексте глагол естественно означает обращение к Богу с просьбой, а не просто желание или обет.
- source_word: ἰδεῖν
  choice: увидеть
  rationale: Сохраняет буквальный образ греческого инфинитива и не подменяет его более толковательным «иметь».
- source_word: δύο υἱοὺς ... ἐξ αὐτῆς
  choice: двух сыновей от неё
  rationale: Точно и естественно передаёт число, родство и происхождение детей от Рахили.
