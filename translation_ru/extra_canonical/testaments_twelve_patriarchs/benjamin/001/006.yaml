lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Поэтому
  rationale: 'Естественно и точно передаёт причинно-следственную связь: «по этой причине».'
- source_word: ἐκλήθην
  choice: меня назвали
  rationale: Русская личная пассивная конструкция здесь звучала бы неестественно; неопределённо-личная форма сохраняет смысл аориста.
- source_word: Βενιαμίν
  choice: Вениамином
  rationale: Использована традиционная русская форма библейского имени.
- source_word: υἱὸς ἡμερῶν
  choice: сын дней
  rationale: Сохранено буквальное и необычное толкование имени в греческом источнике, без замены более привычным значением «сын правой руки».
