  text: 1[a]. Now therefore, my children, you also must love the Lord, the God of heaven and earth, and keep his commandments, imitating the good and holy man Joseph. 2. And let your mind be set on what is good, as you know mine is. For the one who has a right mind sees everything rightly. 3. Fear the Lord and love your neighbor; and if the spirits of Beliar should drive you into every wickedness of affliction, they will certainly not rule over you, just as they did not over Joseph my brother. 4. How many men wanted to kill him, yet God sheltered him[b]. For the one who fears God and loves his neighbor cannot be struck by the spirit of Beliar, being sheltered by the fear of God. 5. And he cannot be mastered by the plots of men or of beasts, since the Lord helps him through the love that he has toward his neighbor. 6. For Joseph also begged our father to pray for his brothers, so that the Lord would not reckon sin to them, because they had done evil against him. 7. And thus Jacob cried out,
    “O good child, you have stirred the inward affection of Jacob your father”; and embracing him, for two hours he kept kissing him, saying, 8. “The heavenly prophecy will be fulfilled upon you.”
translation:
  language: ru
  text: '1. Итак, дети мои, и вы любите Господа, Бога неба и земли, соблюдайте Его заповеди и подражайте доброму и благочестивому Иосифу. 2. Пусть ваши мысли будут обращены к добру, как вы знаете обо мне. Ведь тот, чьи мысли правы, всё видит правильно. 3. Бойтесь Господа и любите ближнего. И если духи Велиара станут толкать вас ко всякому злодеянию, связанному со страданием, они ни за что не овладеют вами, как не овладели и моим братом Иосифом. 4. Сколько людей хотели убить его, но Бог укрыл его! Ведь того, кто боится Бога и любит ближнего, дух Велиара поразить не может, потому что страх Божий служит ему защитой. 5. И ни человеческие козни, ни звери не могут одолеть его: его поддерживает любовь, которую он питает к ближнему.[a] 6. Ведь Иосиф просил нашего отца помолиться за своих братьев, чтобы Господь не вменил им греха за то зло, которое они ему причинили. 7. Тогда Иаков воскликнул: «О добрый сын, ты покорил отцовское сердце Иакова!» Обняв Иосифа, он два часа осыпал его поцелуями и говорил:
    8. «На тебе исполнится небесное пророчество».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Текст в этом месте повреждён и нестабилен. В греческом тексте после слов «поддерживает любовь» стоит неясное чтение; некоторые свидетели содержат дополнительные слова о зверях или о «воздушном духе».
    reason: textual_variant
  - marker: b
    text: 'В некоторых свидетелях: «О тебе исполнится небесное пророчество». В данном критическом издании далее в квадратных скобках приведено расширение: пророчество об Агнце Божьем и Спасителе мира, который, будучи непорочным и безгрешным, будет предан беззаконниками и умрёт за нечестивых ради спасения народов и Израиля и низложения Велиара и его служителей.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγαπήσατε
  choice: любите
  rationale: Обычный и естественный русский императив, сохраняющий этическую и заветную силу глагола.
- source_word: φυλάξατε ἐντολὰς αὐτοῦ
  choice: соблюдайте Его заповеди
  rationale: Устойчивое современное выражение для верности заповедям; точнее по смыслу, чем буквальное «храните».
- source_word: μιμούμενοι
  choice: подражайте
  rationale: Передаёт нравственный призыв следовать примеру Иосифа и сохраняет силу греческого причастия в естественной русской конструкции.
- source_word: διάνοια ... εἰς τὸ ἀγαθόν
  choice: мысли ... обращены к добру
  rationale: Передаёт нравственно-интеллектуальную направленность διάνοια и направительное значение εἰς, не сводя термин только к рассудку.
- source_word: ὀρθὴν ... ὀρθῶς
  choice: мысли правы ... видит правильно
  rationale: Сохраняет намеренный повтор однокоренных греческих форм настолько, насколько это естественно по-русски.
- source_word: τὸν πλησίον
  choice: ближнего
  rationale: Традиционный и понятный современному читателю библейский этический термин.
- source_word: τὰ πνεύματα τοῦ Βελίαρ
  choice: духи Велиара
  rationale: Сохраняет форму имени Βελίαρ данного греческого свидетеля и апокалиптическую образность текста.
- source_word: ἐκστήσωσι
  choice: станут толкать
  rationale: Выражает принуждающее движение ко злу, не усиливая его до полной утраты воли или безумия.
- source_word: κατακυριεύσωσιν ὑμῶν
  choice: не овладеют вами
  rationale: Передаёт враждебное господство и хорошо сочетается с усиленным греческим отрицанием οὐ μή.
- source_word: ἐσκέπασεν / σκεπαζόμενος
  choice: укрывал / служит защитой
  rationale: Сохраняет повторяющийся образ покрова и защиты, избегая неестественного буквального повтора.
- source_word: ἐνίκησας τὰ σπλάγχνα
  choice: ты покорил ... сердце
  rationale: Греческая идиома говорит о глубочайшей внутренней привязанности; русское «покорил сердце» естественно передаёт образ, сохраняя глагольную идею победы.
- source_word: κατεφίλει
  choice: осыпал его поцелуями
  rationale: Передаёт длительное и усиленное действие формы imperfect без архаизма.
theological_decisions:
- issue: Защитная сила страха Божьего в стихе 4
  choice: Страх Божий служит защитой человеку, боящемуся Бога и любящему ближнего.
  alternative: Понимать страх Божий лишь как внутреннее психологическое состояние человека.
  rationale: Фраза σκεπαζόμενος ὑπὸ τοῦ φόβου τοῦ Θεοῦ прямо представляет страх Божий как укрывающую силу; образ сохранён без догматического объяснения его механизма.
- issue: Ходатайство Иосифа в стихе 6
  choice: Иосиф просит отца молиться, чтобы Господь не вменил братьям греха.
  alternative: Передать эпизод только как личное прощение Иосифом братьев.
  rationale: Греческий текст недвусмысленно связывает милость Иосифа с ходатайственной молитвой и Божьим невменением греха.
- issue: Редакционно заключённые в скобки христологические расширения стиха 8
  choice: Не включать их в основной текст, но отметить в сноске.
  alternative: Включить в основной текст упоминания Агнца Божьего, Спасителя мира, смерти безгрешного за нечестивых и низложения Велиара.
  rationale: В данной критической форме источника эти слова отмечены квадратными скобками как вторичный материал; их включение без оговорки скрыло бы текстологическую напряжённость.
translation_notes:
  register: Современный литературный русский язык с достойным библейско-наставительным звучанием. Синтаксис умеренно формален, но понятен обычному читателю; архаизмы устранены. Написание местоимений, относящихся к Богу, дано с прописной буквы в соответствии с распространённой русской издательской практикой. Подлинная неопределённость повреждённого стиха 5 и вторичный характер расширений стиха 8 вынесены в сноски, а не сглажены в основном тексте.
