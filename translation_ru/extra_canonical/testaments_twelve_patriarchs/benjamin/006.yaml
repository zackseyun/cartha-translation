base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006.yaml
  text: The purpose of a good man is not in the hand of the spirit of Beliar’s deceit[a], for the angel of peace guides his soul. He does not look with passion on perishable things, nor does he gather wealth for pleasure. He does not delight in pleasure, nor grieve his neighbor; he is not filled with luxury, nor led astray by the wanderings of the eyes. For the Lord is his portion. A good purpose does not accept the glory or the dishonor that comes from men, and it knows no deceit or falsehood or strife or reviling. For the Lord dwells in him and gives light to his soul, and he rejoices toward all people at all times. The good mind does not have two tongues, of blessing and cursing, of insult and honor, of quietness and disturbance, of hypocrisy and truth, of poverty and wealth; rather, it has one sincere and pure disposition toward all. It does not have double sight or hearing; for in everything that it does, or speaks, or sees, it knows that the Lord is looking on his soul. And it cleanses
    the mind, so as not to be condemned by men and by God. But the disposition of Beliar is twofold, and it has no singleness. Flee, therefore, evil-mindedness, my children, and love the good mind, which the law of God knows, so that you may rest in hope, because the good-minded man does not have a darkened eye. He shows mercy to all, even if they are sinners; even if they devise evil against him, by doing good he overcomes evil, being shielded by what is good. And he loves the righteous as his own soul. If anyone is glorified, he does not envy him; if anyone is enriched, he is not jealous; if anyone is valiant, he praises him; the virtuous man he commends; on the poor man he has mercy; with the weak he has compassion; to God he sings praise[d][c][b]. The one who has the grace of a good spirit he loves as his own soul.
translation:
  language: ru
  text: '**Завещание Вениамина, 6**


    **1** Намерение доброго человека не находится во власти духа заблуждения Велиара[a], потому что ангел мира направляет его душу. **2** Он не смотрит со страстью на тленные вещи и не собирает богатства ради удовольствия. **3** Он не услаждается удовольствием, не огорчает ближнего, не пресыщается роскошью и не даёт блужданиям глаз ввести себя в заблуждение. Ведь Господь — его доля. **4** Доброе намерение не приемлет ни славы, ни бесчестья от людей и не знает никакого коварства, лжи, распри или злословия. Ведь Господь обитает в нём, озаряет его душу, и он всегда радуется всем. **5** Добрый ум не имеет двух языков: благословения и проклятия, оскорбления и почтения, спокойствия и смятения, лицемерия и истины, бедности и богатства. Напротив, ко всем он сохраняет одно искреннее и чистое расположение. **6** У него нет двойного зрения или слуха[b], потому что во всём, что он делает, говорит или видит, он знает: Господь наблюдает за его душой[c]. **7** Он очищает свой ум, чтобы не быть осуждённым
    ни людьми, ни Богом. Так и дела Велиара двойственны и не имеют в себе простоты[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом свидетельстве стоит форма «Велиар»; более привычная форма этого имени — «Велиал». Выражение «дух заблуждения» можно также перевести как «дух обмана» или «дух, вводящий в заблуждение».
    reason: lexical_alternative
  - marker: b
    text: «Двойное зрение или слух» — буквальный образ внутренней двойственности, противопоставленной цельности и простоте.
    reason: lexical_alternative
  - marker: c
    text: 'Или: «Господь посещает его душу» или «внимательно взирает на его душу». Греческий глагол может обозначать посещение, надзор или внимательное рассмотрение.'
    reason: lexical_alternative
  - marker: d
    text: Здесь «простота» означает не наивность, а цельность, прямоту и отсутствие раздвоенности.
    reason: clarification
lexical_decisions:
- source_word: διαβούλιον
  choice: намерение
  rationale: В данном нравственно-наставительном контексте слово обозначает внутренний замысел или устойчивую направленность воли. «Намерение» естественно по-русски и сохраняет волевой смысл; возможные значения «решение» и «замысел» уже и потому не вынесены в основной текст.
- source_word: πλάνης πνεύματος Βελίαρ
  choice: духа заблуждения Велиара
  rationale: Родительный πλάνης допускает оттенки заблуждения, обмана и введения в заблуждение. «Дух заблуждения» сохраняет эту смысловую широту и не сводит выражение только к сознательному обману.
- source_word: ἐμπαθῶς
  choice: со страстью
  rationale: Наречие указывает на подчинённый страсти, вожделеющий взгляд в широком смысле, не обязательно только сексуальном.
- source_word: τὰ φθαρτά
  choice: тленные вещи
  rationale: «Тленные» сохраняет противопоставление преходящих благ Господу как истинной доле человека и поддерживает достойный библейский регистр.
- source_word: μετεωρισμοῖς ὀφθαλμῶν
  choice: блужданиям глаз
  rationale: Сохранён образ беспокойного, увлекаемого желаниями взгляда; буквальная метафора понятна современному читателю.
- source_word: μερὶς
  choice: доля
  rationale: «Доля» естественно передаёт смысл принадлежащего человеку удела и сохраняет библейскую образность без архаизации.
- source_word: διάνοια
  choice: ум
  rationale: Здесь слово обозначает внутреннюю нравственно-мыслящую способность. «Ум» позволяет последовательно передать повторяющийся термин.
- source_word: ἐπισκέπτει
  choice: испытывает
  rationale: Глагол может означать посещение, надзор или внимательное рассмотрение. В контексте последующего суда «испытывает» передаёт внимательное Божье наблюдение, не заменяя его простым «видит».
- source_word: ἀπλότητα
  choice: простоты
  rationale: Слово противопоставлено «двойственности» и означает цельность, прямоту, отсутствие раздвоенности. «Простота» сохраняет ключевую антитезу главы.
theological_decisions:
- issue: Объём перевода при расхождении греческого источника и английского консультационного слоя
  choice: Переведён только предоставленный греческий текст, заканчивающийся словами об отсутствии простоты в делах Велиара.
  alternative: Добавить продолжение главы из английского POB после этого места.
  rationale: Английский текст содержит продолжение, греческий оригинал которого в запросе не приведён. Поскольку перевод должен исходить прежде всего из оригинально-языкового свидетельства, неподтверждённое данным источником продолжение не включено.
- issue: Субъект фразы καὶ καθαίρει τὴν διάνοιαν αὐτοῦ
  choice: «Он очищает свой ум» — субъектом остаётся добрый человек.
  alternative: «Господь очищает его ум».
  rationale: Ближайшее упоминание Господа допускает второе прочтение, однако возврат к нравственной деятельности доброго человека лучше соответствует продолжению «чтобы не быть осуждённым». Неоднозначность не превращена в утверждение об особом учении о способе очищения.
- issue: Передача τὰ ἔργα ... διπλᾶ
  choice: «дела Велиара двойственны».
  alternative: «расположение Велиара двойственно».
  rationale: Греческий текст прямо говорит о «делах», а не о расположении или природе Велиара. Формулировка сохраняет нравственный акцент на проявлениях двойственности.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, библейски созвучным регистром. Сохранены повторяющиеся антитезы «двойственность — простота», образы двух языков, двойного зрения и слуха, а также «Господь — его доля». Избегались как тяжёлая церковнославянская архаика, так и разговорное упрощение.
