  naturalness: После исправления прямой речи и минимальной правки синтаксиса перевод звучит как современный литературный русский, сохраняя сдержанный повествовательный регистр. «Набедренная повязка», «высекли плетью» и «посохом» понятны и не архаизируют текст.
  terminology: «Хитон» точно передаёт χιτών и позволяет избежать неясной в данном контексте «одежды». «Измаильтяне», «набедренная повязка», «спутники» и «поступки наших братьев» уместны. Формула «пусть эти слова не войдут в сердце моего отца» сохраняет образ греческого εἰς καρδίαν.
