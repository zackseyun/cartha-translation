  text: '1 And when we went down into Egypt[a], Joseph my brother recognized me and said to me, “They smeared your tunic with blood and said, ‘See whether this is your son’s tunic.’”

    2 And he said to me, “Yes, brother. For when the Ishmaelites took me, one of them stripped me of my tunic and gave me a loincloth; and after flogging me, he told me to run.

    3 And while he was going away to hide my garment, a lion met him and killed him.

    4 So his companions, being afraid, sold me to others of their company.

    5 Thus Joseph did not lie in saying these things; for he wanted to hide from me the deeds of our brothers.

    6 And he called his brothers to himself and said,

    7 ‘Do not tell my father what you did to me, but speak in this way, just as I explained it to Benjamin.

    8 And let such thoughts be in you[b][c][d], and let not the words come…’'
translation:
  language: ru
  text: 'Завещание Вениамина, глава 2


    2 Когда я пришёл в Египет, мой брат узнал меня. Я сказал ему: «Они вымазали твою одежду кровью и сказали: “Посмотри, та ли это одежда”».[a]


    3 Он ответил мне: «Да, брат. Когда с меня сняли мою одежду, меня отдали измаильтянам. Они дали мне набедренную повязку и, избив плетью, велели бежать.


    4 Один из них бил меня палкой, но навстречу ему вышел лев и убил его.


    5 Тогда его спутники испугались и стали держать меня без притеснений».[b]


    6 Говоря это, они не лгали, ведь Иосиф хотел скрыть от меня поступки наших братьев. Затем он позвал к себе своих братьев и сказал:


    7 «Не рассказывайте моему отцу, что вы сделали со мной, но говорите так, как я объяснил Вениамину.


    8 Пусть и у вас будут такие мысли, и пусть эти слова не дойдут до сердца моего отца».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начало рассказа передаётся в рукописях по-разному. В некоторых свидетелях сказано полнее: «Они послали её и сказали: “Посмотри, одежда ли это твоего сына”».'
    reason: textual_variant
  - marker: b
    text: Греческий текст в конце этого стиха повреждён. Буквально сохранившиеся слова допускают смысл «держали меня без притеснений»; в других свидетелях говорится, что спутники продали Иосифа другим торговцам.
    reason: textual_variant
  - marker: c
    text: В некоторых свидетелях текст обрывается после слов о таких мыслях; предоставленный греческий текст сохраняет продолжение о том, чтобы эти слова не дошли до сердца отца.
    reason: textual_variant
lexical_decisions:
- source_word: ἐγνώρισέν με
  choice: узнал меня
  rationale: В данном контексте глагол обозначает узнавание человека при встрече; это естественная русская передача без добавления возвратного значения «открылся мне».
- source_word: ἔφυραν ... αἵματι
  choice: вымазали ... кровью
  rationale: Хотя глагол буквально связан со смешиванием или разминанием, при одежде и крови он описывает нанесение крови на ткань. «Вымазали» сохраняет конкретность и намеренный характер действия.
- source_word: χιτών
  choice: одежда
  rationale: χитон — нательная одежда; общеупотребительное «одежда» здесь звучит естественнее специального «хитон» и не создаёт ложного образа современного пальто или рубашки.
- source_word: περίζωμα
  choice: набедренная повязка
  rationale: Термин означает ткань, обёрнутую вокруг бёдер; выбран точный и понятный современному читателю эквивалент.
- source_word: φραγγελλώσαντες
  choice: избив плетью
  rationale: Передаёт жестокое телесное наказание и инструмент, подразумеваемый заимствованным греческим глаголом, без архаичного «бичевав».
- source_word: ῥάβδῳ μαστίζων
  choice: бил ... палкой
  rationale: Сохраняет различие между предшествующим избиением плетью и ударом жезлом или палкой в следующем эпизоде.
- source_word: ὑπήντησεν αὐτῷ λέων
  choice: навстречу ему вышел лев
  rationale: Естественно передаёт повествовательную образность греческого выражения, не усиливая его до «напал» до последующего сообщения об убийстве.
- source_word: μέτοχοι
  choice: спутники
  rationale: В контексте речь о товарищах человека по группе; «спутники» ясно и нейтрально передаёт связь между ними.
- source_word: τὰ ἔργα τῶν ἀδελφῶν ἡμῶν
  choice: поступки наших братьев
  rationale: «Поступки» сохраняет нравственный вес выражения и звучит естественно в современном русском повествовании.
- source_word: ἐξηγησάμην
  choice: объяснил
  rationale: Глагол может означать изложение или разъяснение; здесь Иосиф указывает на уже сообщённую Вениамину версию событий.
- source_word: εἰς καρδίαν τοῦ πατρός μου
  choice: до сердца моего отца
  rationale: Сохранён образ сердца как внутреннего мира отца; более свободное «чтобы отец не узнал» устранило бы метафору оригинала.
theological_decisions:
- issue: Сокрытие Иосифом вины братьев
  choice: Иосиф намеренно скрывает от Вениамина поступки братьев и просит их не причинять отцу боли этой вестью.
  alternative: Представить Иосифа лишь передающим факты без особого мотива сокрытия.
  rationale: Фраза ἤθελεν γὰρ κρύπτειν ἀπʼ ἐμοῦ τὰ ἔργα τῶν ἀδελφῶν ἡμῶν прямо называет его намерение. Перевод сохраняет нравственное напряжение между правдой о содеянном и милосердным сокрытием.
- issue: Неустойчивое число в утверждении об истинности рассказа
  choice: 'Сохранить множественное число: «они не лгали», а затем явно назвать Иосифа субъектом следующего действия.'
  alternative: 'Исправить по смыслу и некоторым формам передачи на единственное число: «Иосиф не лгал».'
  rationale: В предоставленном греческом тексте стоит αὐτοὶ, множественное число. Его референт не вполне ясен, поэтому перевод не исправляет текст молча; имя Иосиф добавлено только для прояснения субъекта последующего глагола, который контекст связывает с братом Вениамина.
- issue: Состояние заключительной фразы
  choice: Перевести стих 8 как завершённое увещание по предоставленному греческому тексту.
  alternative: Оборвать фразу после «пусть у вас будут такие мысли…».
  rationale: 'В представленном греческом источнике имеется полное продолжение: «и пусть эти слова не дойдут до сердца моего отца». Оборванная форма относится к иной текстовой традиции и отмечена в сноске, но не поставлена в основной текст.'
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного повествования. Синтаксис сделан ясным для обычного читателя, но необычные черты и текстовая неустойчивость не сглажены без оговорки. Нумерация сохранена по предоставленному греческому разделу (2–8), а не по перенумерованному английскому консультационному слою.
