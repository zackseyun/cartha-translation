source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: ⸢Κἂν *μὴ βούλωνται περὶ αὐτοῦ εἰς καλά¹⁴, *οὗτος τὸ ἀγαθὸν ποιῶν¹⁵ νικᾷ τὸ κακόν, σκεπόμενος¹⁶ ὑπὸ τοῦ Θεοῦ¹⁷⸣. τοὺς †ἀδικοῦντας¹⁸ ἀγαπᾷ ὡς τὴν ψυχὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/003.yaml
  text: And even if they do not intend good toward him, by doing good he overcomes evil, being sheltered by God. He loves those who wrong him as his own soul.
translation:
  language: ru
  text: И даже если они не желают ему добра, он, делая добро, побеждает зло, находясь под защитой Бога. Тех, кто поступает с ним несправедливо, он любит, как собственную душу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ βούλωνται περὶ αὐτοῦ εἰς καλά
  choice: не желают ему добра
  rationale: Естественно передаёт направленное к человеку недоброе намерение; множественное καλά здесь идиоматически выражено собирательным «добра».
- source_word: τὸ ἀγαθὸν ποιῶν
  choice: делая добро
  rationale: Сохраняет причастную конструкцию и лексическую связь с τὸ ἀγαθόν без излишнего истолкования.
- source_word: νικᾷ τὸ κακόν
  choice: побеждает зло
  rationale: Прямое и естественное соответствие греческому выражению.
- source_word: σκεπόμενος ὑπὸ τοῦ Θεοῦ
  choice: находясь под защитой Бога
  rationale: Передаёт значение покровительства и защищённости; пассивная форма сохраняет Бога как действующего защитника.
- source_word: τοὺς ἀδικοῦντας
  choice: тех, кто поступает с ним несправедливо
  rationale: Передаёт широкий смысл ἀδικέω — причинять несправедливость, поступать неправедно — без сужения до одного вида обиды.
- source_word: ὡς τὴν ψυχὴν αὐτοῦ
  choice: как собственную душу
  rationale: Сохраняет образ и семитически окрашенную формулировку оригинала, не заменяя её толкованием «как самого себя».
theological_decisions:
- issue: Соотношение человеческого доброделания и Божьей защиты
  choice: «он, делая добро, побеждает зло, находясь под защитой Бога»
  alternative: «Бог защищает его, и потому добром он побеждает зло»
  rationale: 'Сохранена грамматическая и богословская напряжённость оригинала: победа связана с деланием добра, а Божья защита выражена сопутствующим пассивным причастием; причинная связь прямо не добавляется.'
- issue: Объект любви
  choice: «тех, кто поступает с ним несправедливо»
  alternative: «своих обидчиков»
  rationale: Более широкая передача не ограничивает ἀδικοῦντας эмоциональной обидой и сохраняет этический охват выражения.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Сохранены параллелизм «добро — зло», образ души и неоднозначность связи между доброделанием и Божьим покровительством.
