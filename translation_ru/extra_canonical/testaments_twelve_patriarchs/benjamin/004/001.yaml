base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/001.yaml
  text: See then, my children, the end of the good man. Imitate [in goodness] because of his compassion, so that you also may wear crowns of glory.
translation:
  language: ru
  text: 4:1 Итак, дети мои, посмотрите на конец доброго человека. Подражайте ему [в добре][a] ради его сострадания, чтобы и вам носить венцы славы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «в добре» в греческом тексте переданы в скобках; чтение и связь этой фразы с окружающими словами не вполне ясны.
    reason: Сохраняет видимую текстологическую неуверенность исходного издания и объясняет квадратные скобки читателю.
lexical_decisions:
- source_word: Ἴδετε οὖν
  choice: Итак… посмотрите
  rationale: Передаёт призыв обратить внимание и логическую связь οὖν с предшествующим контекстом.
- source_word: τοῦ ἀγαθοῦ ἀνδρὸς τὸ τέλος
  choice: конец доброго человека
  rationale: Сохраняет прямое значение τέλος и не сужает его до «результата» или «судьбы».
- source_word: μιμήσασθε
  choice: Подражайте ему
  rationale: Русский глагол обычно требует указания объекта; местоимение естественно отсылает к только что названному доброму человеку.
- source_word: ἐν ἀγαθῇ
  choice: '[в добре]'
  rationale: Формально сохраняет необычное и текстуально отмеченное выражение, не превращая его без достаточных оснований в «его доброту».
- source_word: διὰ τὴν εὐσπλαγχνίαν αὐτοῦ
  choice: ради его сострадания
  rationale: Передаёт причинно-мотивирующий смысл διά с винительным и сохраняет отнесение сострадания к доброму человеку.
- source_word: στεφάνους δόξης φορέσητε
  choice: носить венцы славы
  rationale: Сохраняет образ множественных венцов и буквальный глагол ношения.
theological_decisions:
- issue: Значение τέλος применительно к доброму человеку
  choice: конец
  alternative: исход / итог
  rationale: «Конец» сохраняет смысловую широту греческого слова и возможный акцент на завершении жизни, не разрешая неоднозначность в пользу результата.
- issue: Неясная конструкция призыва к подражанию
  choice: Подражайте ему [в добре]
  alternative: Подражайте его доброте
  rationale: Выбранный вариант не делает «доброту» прямым объектом глагола и сохраняет отмеченные издателем скобки вокруг спорного выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Обращение «дети мои» и образ «венцов славы» сохранены; синтаксис сделан естественным без устранения текстовой неоднозначности.
