  text: And he loves the one who has the grace of a good spirit as his own soul.
translation:
  language: ru
  text: И того, кто обладает благодатью доброго духа, он любит, как свою душу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν ἔχοντα χάριν ἀγαθοῦ πνεύματος
  choice: имеющего благодать доброго духа
  rationale: 'Сохраняет родительный оборот греческого текста и его возможную смысловую неоднозначность: благодать может пониматься как исходящая от доброго духа либо как свойственная ему.'
- source_word: ἀγαπᾷ
  choice: любит
  rationale: Прямое и естественное соответствие глаголу ἀγαπάω в современном русском литературном языке.
- source_word: κατὰ τὴν ψυχὴν αὐτοῦ
  choice: как собственную душу
  rationale: Передаёт сравнительный смысл оборота в данном контексте и традиционную библейскую антропологическую лексику, не заменяя ψυχή словом «себя».
theological_decisions:
- issue: Значение сочетания χάριν ἀγαθοῦ πνεύματος
  choice: благодать доброго духа
  alternative: благодать благого Духа / дар доброго духа
  rationale: Строчная форма «доброго духа» не навязывает отождествление со Святым Духом, а «благодать» сохраняет обычное значение χάρις и богословскую открытость выражения.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Синтаксис слегка упрощён по сравнению с буквальной калькой, при этом исходная образность и неоднозначность сохранены.
