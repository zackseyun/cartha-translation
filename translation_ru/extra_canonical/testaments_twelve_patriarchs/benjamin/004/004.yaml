base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/004.yaml
  text: If anyone is glorified, he does not envy him; if anyone becomes rich, he is not jealous; if anyone is brave, he praises him; he loves the self-controlled man; he has mercy on the poor; he suffers together with the weak; he fears God.
translation:
  language: ru
  text: Если кого-то прославляют, он не завидует ему; если кто-то богат, он не испытывает к нему ревности; если кто-то храбр, он хвалит его; любит того, кто владеет собой; оказывает милость бедному; сострадает немощному; боится Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζηται
  choice: прославляют
  rationale: Пассивная форма передана неопределённо-личной конструкцией, естественной для современного русского языка и сохраняющей значение признания или прославления.
- source_word: ζηλοῖ
  choice: ревнует
  rationale: Сохранено отличие от предшествующего φθονεῖ («завидует»); здесь слово выражает ревнивую зависть или соперничество.
- source_word: σώφρονα
  choice: воздержанного
  rationale: Передаёт нравственное самообладание и умеренность, не сужая смысл до одной лишь рассудительности.
- source_word: πένητα
  choice: бедного
  rationale: Прямое и понятное обозначение нуждающегося человека.
- source_word: ἀσθενοῦντι
  choice: немощному
  rationale: Сохраняет широту греческого слова, которое может обозначать физически слабого или больного, а также вообще немощного.
- source_word: συμπάσχει
  choice: сострадает
  rationale: Естественно передаёт буквальное «страдает вместе», сохраняя смысл деятельного соучастия в чужом страдании.
- source_word: τὸν Θεὸν φοβεῖται
  choice: боится Бога
  rationale: Прямо отражает засвидетельствованный греческий текст и не следует иному чтению о хвале Богу.
theological_decisions:
- issue: Значение выражения «боится Бога»
  choice: боится Бога
  alternative: благоговеет перед Богом
  rationale: Выбран более формально точный вариант, сохраняющий библейскую смысловую напряжённость понятия страха Божьего и не сводящий его только к благоговению.
translation_notes:
  register: Современный литературный русский язык с достоинством и лаконичным параллелизмом исходного перечня. Повторение местоимения «он» после первых трёх условных конструкций далее опущено как естественно подразумеваемое; единый субъект сохраняется.
