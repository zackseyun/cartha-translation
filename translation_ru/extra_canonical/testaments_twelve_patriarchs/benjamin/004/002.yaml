  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/002.yaml
  text: For the good man does not have a dark eye, for he has mercy on all, even if they are sinners.
translation:
  language: ru
  text: Ибо у доброго человека нет тёмного глаза[a], ведь он милосерден ко всем, даже если они грешники.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тёмного глаза»; вероятно, имеется в виду мрачный, недоброжелательный или немилосердный взгляд.'
    reason: Образ в русском языке необычен, поэтому примечание поясняет вероятный смысл, не подменяя метафору в основном тексте.
lexical_decisions:
- source_word: ἀγαθὸς ἄνθρωπος
  choice: добрый человек
  rationale: Прямо передаёт нравственную характеристику человека без введения более узкого богословского смысла.
- source_word: σκοτεινὸν ὀφθαλμόν
  choice: тёмный глаз
  rationale: Сохраняет конкретную и несколько необычную метафору греческого текста; более свободное «злой взгляд» преждевременно устранило бы её образность и возможную многозначность.
- source_word: ἐλεεῖ
  choice: милует
  rationale: Передаёт деятельное проявление милости и естественно сочетается с прямым дополнением «всех».
- source_word: κἂν ἁμαρτωλοὶ ὦσιν
  choice: даже если они грешники
  rationale: Сохраняет уступительное условие и именную характеристику исходного текста, не заменяя её выражением «даже если они грешат».
theological_decisions:
- issue: Отношение доброго человека к грешникам
  choice: «милует всех, даже если они грешники»
  alternative: «сострадает всем, хотя они и грешат»
  rationale: Выбранный вариант сохраняет универсальность πάντας, силу глагола ἐλεεῖ и условно-уступительную форму, не превращая стих в утверждение об одобрении греха.
translation_notes:
  register: Современный литературный русский язык с сохранением лаконичного назидательного строя оригинала. Союз «ибо» поддерживает достоинство и причинную связь; двоеточие естественно передаёт второе γάρ без тяжеловесного повтора «ибо».
