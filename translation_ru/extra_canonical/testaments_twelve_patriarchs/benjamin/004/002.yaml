  source_fidelity: 'Основной образ σκοτεινὸν ὀφθαλμόν точно сохранён как «тёмный глаз» и снабжён уместным пояснением. Уступительное κἂν ... ὦσιν передано точно: «даже если они грешники». Однако «милует» в современном русском нередко означает щадить или не наказывать и потому может неоправданно сузить ἐλεεῖ до акта помилования. «Милосерден ко всем» надёжно передаёт смысл глагола «оказывает/имеет милость» без такого оттенка.'
