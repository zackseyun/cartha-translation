lexical_decisions:
- source_word: ἐκοιμήθη ὕπνῳ καλῷ
  choice: заснул добрым сном
  rationale: Сохраняет эвфемистическое обозначение смерти через сон и намеренный повтор однокоренной образности греческого выражения, не сводя его к толкованию «мирно умер».
- source_word: ἄραντες τὸ σῶμα αὐτοῦ
  choice: подняли его тело
  rationale: Передаёт конкретное значение αἴρω — поднять и понести; не навязывает глаголу направление движения, хотя дальнейший контекст подразумевает перенесение к месту погребения.
- source_word: ἐντέλλομαι
  choice: повелеваю
  rationale: Сохраняет силу последнего отцовского распоряжения и соответствует возвышенному, но понятному современному русскому регистру.
- source_word: ἀνενέγκατε τὰ ὀστᾶ μου ἐξ Αἰγύπτου
  choice: вынесите мои кости из Египта
  rationale: Естественно передаёт перемещение останков из Египта в Ханаан и сохраняет конкретное слово «кости», не заменяя его обобщённым «останки».
- source_word: ἐγγὺς τῶν πατέρων μου
  choice: рядом с моими отцами
  rationale: Сохраняет пространственный смысл и родственную лексику, не уточняя устройство места погребения сверх текста.
- source_word: ἐν γήρει καλῷ
  choice: достигнув доброй старости
  rationale: Передаёт положительную оценку старости в греческом тексте и звучит естественно в русском библейском повествовании.
- source_word: ἐν παραθήκῃ
  choice: в гроб
  rationale: Хотя буквальное значение связано с помещением на хранение, в погребальном контексте речь, вероятнее всего, идёт о гробе или погребальном вместилище; выбран понятный русский эквивалент без излишней конкретизации «саркофаг».
- source_word: ἐν κρυφῇ
  choice: тайно
  rationale: Кратко и точно передаёт наречное значение скрытного совершения действия.
- source_word: παρὰ τοὺς πόδας τῶν πατέρων αὐτῶν
  choice: у ног своих отцов
  rationale: Сохраняет необычную телесно-пространственную образность греческого текста, не сглаживая её до общего «рядом с предками»; возможный более широкий смысл отмечен в сноске.
theological_decisions:
- issue: Повторяющиеся заключительные сообщения о смерти и погребении Вениамина
  choice: Перевести все сохранившиеся сообщения, включая повтор возраста, смерти и погребения.
  alternative: Объединить сообщения в одно последовательное окончание или опустить предполагаемые позднейшие строки.
  rationale: Греческая текстовая традиция в представленном виде сохраняет перекрывающиеся окончания. Их молчаливое согласование скрыло бы реальную сложность источника.
- issue: Хронологическое указание на девяносто первый год после исхода
  choice: Передать конкретное хронологическое утверждение прямо, без исправления.
  alternative: Исправить число, истолковать его приблизительно или перестроить хронологию ради согласования.
  rationale: Источник содержит определённое временное указание; перевод сохраняет присущее тексту историко-хронологическое напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан понятным для широкого читателя, но необычные повторы, хронологическое напряжение и конкретная погребальная образность источника сохранены. Повторяющаяся нумерация «2» оставлена вслед за предоставленным критически проверенным консультационным слоем, поскольку она отражает сложное составное окончание главы.
