  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012.yaml
  text: '1. And after saying these things, he stretched out his feet and fell asleep in a good sleep[a].

    2. And his sons did as he had commanded them, and they carried up his body and buried him in Hebron with his fathers.


    2. The number of his life was one hundred and twenty-five years[b]. And when he had finished his words, he said, “I command you, my children, carry up my bones out of Egypt, and bury me in Hebron near my fathers.”

    2. And Benjamin died at one hundred and twenty-five years, in a good old age; and they placed him in a coffin.

    3. And in the ninety-first year after the departure of the sons of Israel from Egypt, they and their brothers brought up the bones of their fathers secretly during the war in Canaan, and buried them in Hebron beside the feet of their fathers[c].

    4. And they returned from the land of Canaan, and lived in Egypt until the day of their departure from the land of Egypt.'
translation:
  language: ru
  text: '1. Сказав это, он вытянул ноги и заснул добрым сном[a].


    2. Его сыновья исполнили всё, что он им повелел: подняли его тело и похоронили в Хевроне вместе с его отцами.


    2. Всего он прожил сто двадцать пять лет[b]. Завершив свои слова, он сказал: «Повелеваю вам, дети мои: вынесите мои кости из Египта и похороните меня в Хевроне, рядом с моими отцами».


    2. И умер Вениамин ста двадцати пяти лет от роду, достигнув доброй старости, и его положили в гроб.


    3. В девяносто первый год после исхода сынов Израиля из Египта они вместе со своими братьями тайно, во время войны в Ханаане, перенесли кости своих отцов и похоронили их в Хевроне, у ног своих отцов[c].


    4. Затем они вернулись из земли Ханаанской и жили в Египте до дня своего исхода из земли Египетской.


    [a] В некоторых греческих рукописях после слов «добрым сном» добавлено: «и благим».


    [b] В этой главе сохранились перекрывающиеся друг с другом заключительные сообщения о смерти и погребении Вениамина, а также о последующем перенесении костей праотцов. Вероятно, повторения объясняются сложной историей передачи текста; здесь они переведены в том виде, в каком дошли в греческом тексте.


    [c] Выражение «у ног своих отцов» буквально передаёт греческий текст. Возможно, речь идёт о месте погребения возле гробниц предков, а не непосредственно у их ног.'
