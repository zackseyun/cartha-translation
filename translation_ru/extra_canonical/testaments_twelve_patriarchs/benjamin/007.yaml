  terminology: «Велиар», «меч», «разум», «зачинает», «зависть», «погибель», «нужда», «смятение», «опустошение» и «возмездия» удачны. Форма «Велиал» в примечании уместна как знакомый читателю вариант. Четвёртый член перечня следует передать как «плен» с текстологическим примечанием, а не как богословски конкретизированную «кару свыше».
