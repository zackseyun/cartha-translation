base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007.yaml
  text: '7[a]. And he purifies his mind so as not to be condemned by men, and likewise by God. In the same way, the works of Beliar also are twofold, and they have no simplicity in them.


    Therefore, my children[b], I tell you: flee the evil of Beliar, because he gives a sword to those who obey him. And the sword is the mother of seven evils. First the mind conceives through Beliar, and these are its births: first envy, second destruction, third affliction, fourth captivity, fifth want, sixth turmoil, seventh desolation.


    Because of this, Cain was handed over to seven acts of vengeance. For in one hundred years the Lord brought one plague upon him after another[c], and in the nine-hundredth year he was made desolate.'
translation:
  language: ru
  text: '7


    1 Поэтому, дети мои, говорю вам: бегите от зла Велиара[a], потому что он даёт меч тем, кто ему повинуется.


    2 А меч — мать семи зол. Сначала разум зачинает через Велиара, и вот что рождается: первое — зависть, второе — погибель, третье — скорбь, четвёртое — плен[b], пятое — нужда, шестое — смятение, седьмое — опустошение.


    3 Поэтому и Каин был предан семи возмездиям: каждые сто лет Господь навлекал на него одно бедствие.


    4 Двести лет он страдает, а на девятисотом году подвергается опустошению[c]. Ибо за брата своего Авеля он был осуждён всеми этими бедствиями, Ламех же — на семьдесят раз по семь.


    5 Ибо вовеки те, кто уподобляется Каину завистью и такой ненавистью к брату, будут наказаны судом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Велиар — форма имени в данном греческом тексте; многим читателям оно известно в форме «Велиал».
    reason: lexical_alternative
  - marker: b
    text: 'Греческое слово, обозначающее четвёртое зло, текстуально неустойчиво: в предоставленной строке стоит редкое θεηλασία, тогда как некоторые свидетельства дают чтение со значением «плен». Здесь принято «плен» как наиболее вероятное чтение в этом перечне бедствий.'
    reason: textual_variant
  - marker: c
    text: 'Числовая последовательность в греческом тексте трудна: сказано, что Каин страдает двести лет, а на девятисотом году подвергается опустошению. Перевод сохраняет эти числа без попытки согласовать их с другой хронологией.'
    reason: textual_difficulty
lexical_decisions:
- source_word: Βελίαρ
  choice: Велиар
  rationale: Сохранена форма имени в данном греческом свидетельстве; более знакомая форма «Велиал» указана в примечании.
- source_word: μάχαιρα
  choice: меч
  rationale: Передаёт образ оружия и сохраняет связь с последующим рядом губительных последствий.
- source_word: πειθομένοις αὐτόν
  choice: тем, кто ему повинуется
  rationale: В нравственном увещании причастие означает не только убеждённость, но и подчинение влиянию Велиара.
- source_word: διάνοια
  choice: разум
  rationale: Обозначает внутреннюю мыслительную и нравственную способность; русское «разум» естественно сочетается с метафорой зачатия.
- source_word: συλλαμβάνει
  choice: зачинает
  rationale: 'Сохраняет метафору рождения: меч назван матерью семи зол, после чего перечисляется рождаемое.'
- source_word: ἀπώλεια
  choice: погибель
  rationale: Передаёт сильное значение гибели или разорения, не превращая слово в узкий богословский термин.
- source_word: θλῖψις
  choice: скорбь
  rationale: Достоинственное и понятное обозначение тяжёлого страдания в перечне бедствий.
- source_word: θεηλασία
  choice: кара свыше
  rationale: Редкое и текстуально неустойчивое слово, по форме указывающее на бедствие, насылаемое божественной силой; неопределённость отражена в примечании.
- source_word: ἔνδεια
  choice: нужда
  rationale: Кратко и точно обозначает лишение необходимого.
- source_word: ταραχή
  choice: смятение
  rationale: Сохраняет широкий смысл беспорядка, тревоги и потрясения.
- source_word: ἐρήμωσις / ἐρημοῦται
  choice: опустошение / подвергается опустошению
  rationale: Единообразно передана повторяющаяся лексема и сохранён образ доведения до запустения.
- source_word: ἐκδικίαις
  choice: возмездиям
  rationale: Форма указывает на карательные акты воздаяния; множественное число сохранено.
- source_word: μισαδελφία
  choice: ненависть к брату
  rationale: Прозрачно передаёт составное значение слова без неестественного русского абстрактного существительного.
theological_decisions:
- issue: Источник и направленность зла
  choice: «бегите от зла Велиара, потому что он даёт меч тем, кто ему повинуется»
  alternative: «бегите от порока... тем, кого он убеждает»
  rationale: Перевод сохраняет личностное действие Велиара и одновременно ответственность повинующихся ему, не усиливая это до полной причинной предопределённости.
- issue: Метафора зачатия и рождения семи зол
  choice: Сохранены «мать», «зачинает» и «рождается».
  alternative: Сгладить образ как «в разуме возникают семь зол».
  rationale: Греческий текст намеренно связывает меч, материнство и зачатие; устранение образа ослабило бы нравственно-богословскую аргументацию.
- issue: Хронология наказания Каина
  choice: Числа и последовательность сохранены без согласования с Бытие.
  alternative: Обобщить или гармонизировать сроки с библейской хронологией.
  rationale: Текст свидетельства формулирует собственную хронологию; её шероховатость нельзя молча исправлять.
- issue: Сопоставление Каина и Ламеха
  choice: «Каин... на все эти бедствия, Ламех же — на семьдесят раз по семь».
  alternative: Истолковать числа как срок, меру мести или число наказаний.
  rationale: Краткая греческая конструкция допускает более одного понимания. Русский перевод сохраняет эллиптичность и не уточняет то, чего текст прямо не уточняет.
- issue: Будущий суд над уподобляющимися Каину
  choice: «будут наказаны судом»
  alternative: «будут осуждены» или «понесут кару по приговору».
  rationale: Формулировка сохраняет оба элемента κολασθήσονται и κρίσει, не определяя природу или исполнителя суда сверх текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, увещательным тоном. Синтаксическая шероховатость числовых высказываний и краткость сопоставления Каина с Ламехом сохранены там, где они отражают подлинную неоднозначность греческого текста. Материал английского консультационного слоя, отсутствующий в предоставленном греческом отрывке, не включён.
