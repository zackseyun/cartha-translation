lexical_decisions:
- source_word: οἱ μέτοχοι αὐτοῦ
  choice: его спутники
  rationale: Передаёт участников или сообщников названного лица без излишнего уточнения характера их связи.
- source_word: φοβηθέντες
  choice: испугавшись
  rationale: Естественно передаёт аористное причастие от φοβέομαι и сохраняет причинно-временную связь.
- source_word: ἐν ἀνέσει
  choice: в покое
  rationale: Буквально отражает ἄνεσις — облегчение, покой или послабление; чтение находится внутри повреждённого места.
- source_word: με κατέσχεν
  choice: удерживали меня
  rationale: Передаёт основной смысл κατέχω; число согласовано с подлежащим «спутники», поскольку форма рукописного текста, вероятно, повреждена.
