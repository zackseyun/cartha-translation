  text: And they themselves did not lie in saying these things; for he wanted to hide from me the deeds of our brothers.
translation:
  language: ru
  text: И они сами не лгали, говоря это, потому что он хотел скрыть от меня поступки наших братьев.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἐψεύσαντο αὐτοὶ
  choice: сами они не лгали
  rationale: Сохранены множественное число подлежащего и усилительное αὐτοὶ; «не лгали» естественно передаёт аорист глагола ψεύδομαι в данном контексте.
- source_word: ταῦτα λέγοντες
  choice: говоря это
  rationale: Прямая и естественная передача причастного оборота без добавления отсутствующих в греческом уточнений.
- source_word: ἤθελεν γὰρ κρύπτειν
  choice: потому что он хотел скрыть
  rationale: Сохранено единственное число субъекта ἤθελεν и причинное значение γάρ; референт местоимения не уточняется, чтобы не устранять неоднозначность текста.
- source_word: τὰ ἔργα τῶν ἀδελφῶν ἡμῶν
  choice: поступки наших братьев
  rationale: В контексте ἔργα обозначает совершённые действия; «поступки» звучит естественнее и точнее, чем общее «дела».
theological_decisions:
- issue: Неодинаковое число субъектов в двух частях стиха
  choice: «сами они не лгали… он хотел скрыть»
  alternative: Назвать первого или второго субъекта по имени
  rationale: Греческий текст явно различает множественное αὐτοὶ и единственное ἤθελεν, но не называет референтов; перевод сохраняет эту формальную и смысловую напряжённость.
translation_notes:
  register: Современный литературный русский язык; синтаксис ясный и достойный, без архаизмов и конфессионально окрашенных добавлений.
