lexical_decisions:
- source_word: ἔννοιαι
  choice: помыслы
  rationale: Передаёт внутренние мысли и намерения; слово уместно в нравственно-назидательном контексте и сохраняет возвышенный, но понятный регистр.
- source_word: γένωνται ἐν ὑμῖν
  choice: пусть и у вас будут
  rationale: Естественно по-русски передаёт греческую повелительно-пожелательную форму и буквальное «возникнут/будут в вас» без излишней тяжеловесности.
- source_word: οἱ λόγοι οὗτοι
  choice: эти слова
  rationale: Прямое и контекстуально нейтральное соответствие, не сужающее значение до «известия» или «слуха».
- source_word: εἰς καρδίαν τοῦ πατρός μου
  choice: в сердце моего отца
  rationale: Сохраняет образное выражение оригинала и его возможный эмоциональный смысл, не заменяя его толкованием вроде «не станет известно моему отцу».
