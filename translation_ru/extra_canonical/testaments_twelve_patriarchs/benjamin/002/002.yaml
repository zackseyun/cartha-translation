  text: Καὶ λέγει μοι· Ναί, ἀδελφέ¹⁶. καὶ ὅτε¹⁷ ἐξέδυσάν με τὸν χιτῶνά μου δέδωκάν με τοῖς Ἰσμαηλίταις· καὶ δέδωκάν μοι περίζωμα, καὶ φραγγελλώσαντες εἰπόν μοι τρέχειν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/002.yaml
  text: And he said to me, “Yes, brother. And when they stripped me of my tunic they gave me to the Ishmaelites; and they gave me a loincloth, and after flogging me they told me to run.”
translation:
  language: ru
  text: 'И он сказал мне: «Да, брат. И когда они сняли с меня хитон, то отдали меня измаильтянам; они дали мне набедренную повязку и, высекши меня, велели мне бежать».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀδελφέ
  choice: брат
  rationale: Сохраняет прямое обращение и родственную лексику греческого текста; по-русски в звательном употреблении форма совпадает с именительным падежом.
- source_word: χιτῶνά
  choice: хитон
  rationale: Точный и узнаваемый термин для нижней/основной одежды древнего мира, уместный в библейском контексте.
- source_word: Ἰσμαηλίταις
  choice: измаильтянам
  rationale: Стандартная русская библейская передача этнонима.
- source_word: περίζωμα
  choice: набедренную повязку
  rationale: Передаёт предмет одежды естественным современным русским выражением без излишней конкретизации его формы.
- source_word: φραγγελλώσαντες
  choice: высекши меня
  rationale: Причастие обозначает бичевание или порку; выбранное выражение сохраняет предшествование действию «велели» и естественно звучит по-русски.
- source_word: τρέχειν
  choice: бежать
  rationale: Прямое соответствие инфинитиву; сохраняет возможную неоднозначность цели или направления бега.
