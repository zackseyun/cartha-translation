  source_fidelity: 'Перевод точно передаёт последовательность и агентность греческого текста: неназванные «они» снимают с говорящего хитон и отдают его измаильтянам; затем те же лица дают ему набедренную повязку, подвергают порке и велят бежать. Множественное число и отсутствие неоговорённого индивидуального исполнителя сохранены. «Хитон», «измаильтяне», «набедренная повязка» и «бежать» соответствуют χιτών, Ἰσμαηλίται, περίζωμα и τρέχειν. Формула «высекши меня» адекватно передаёт предшествующее действие φραγγελλώσαντες.'
