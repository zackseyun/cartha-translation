  text: Εἰς δὲ ἐξ αὐτῶν ῥάβδῳ μαστίζων με, ὑπήντησεν αὐτῷ λέων καὶ ἀνεῖλεν αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/003.yaml
  text: And one of them, while he was striking me with a rod, was met by a lion, and the lion killed him.
translation:
  language: ru
  text: Но когда один из них бил меня палкой, ему встретился лев и убил его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδῳ
  choice: палкой
  rationale: В данном контексте орудия побоев естественное современное соответствие слову ῥάβδος — «палка»; «жезл» звучал бы неуместно торжественно, а «розга» чрезмерно конкретизировала бы вид предмета.
- source_word: μαστίζων
  choice: бил
  rationale: Причастие обозначает нанесение ударов; сочетание «бил меня палкой» естественно передаёт действие без искусственной буквальности «бичевал палкой».
- source_word: ὑπήντησεν αὐτῷ
  choice: навстречу ему вышел
  rationale: Передаёт значение встречи и сохраняет льва как действующее лицо, при этом звучит естественнее буквального пассивного оборота.
- source_word: ἀνεῖλεν
  choice: убил
  rationale: Прямое и точное соответствие значению «лишил жизни» в данном повествовательном контексте.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с ясным повествовательным синтаксисом. Перевод следует предоставленному греческому тексту, где человек бьёт Вениамина палкой; не принято позднейшее содержание ревизии о том, что он уходил прятать одежду, поскольку оно не соответствует указанному греческому источнику.
