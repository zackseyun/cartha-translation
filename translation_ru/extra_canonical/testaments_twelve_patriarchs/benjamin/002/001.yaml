  text: And when I went into Egypt, my brother recognized me and said to me, “They smeared your tunic with blood,” they said. “See whether this is the tunic.”
translation:
  language: ru
  text: 'Когда же я пришёл в Египет, брат мой узнал меня и сказал мне: «Они измазали твою одежду кровью, — сказали они. — Узнай, та ли это одежда».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительная фраза в греческом тексте эллиптична и синтаксически неровна; буквально: «Узнай, та ли это одежда». Слова «твоего сына», известные по сходному месту в Бытии 37:32, здесь отсутствуют.'
    reason: Сохраняет неопределённость и сжатость греческого текста, не внося слова из библейского параллельного рассказа.
lexical_decisions:
- source_word: ἦλθον
  choice: я пришёл
  rationale: Форма единственного числа передана без добавления отсутствующего в греческом тексте направления «спустился».
- source_word: ἐγνώρισέν με
  choice: узнал меня
  rationale: Сохраняет обычное значение глагола в данном контексте и соответствует сцене узнавания.
- source_word: ὁ ἀδελφός μου
  choice: брат мой
  rationale: Имя Иосиф в греческом тексте отсутствует, поэтому оно не добавлено.
- source_word: λέγει μοι
  choice: говорит мне
  rationale: Сохранено историческое настоящее греческого текста, естественно допустимое и в русском повествовании.
- source_word: ἔφυραν
  choice: испачкали
  rationale: Передаёт смысл «запачкали, измазали» без усиления до более специального действия.
- source_word: χιτών
  choice: одежда
  rationale: Понятное современному читателю соответствие; «хитон» было бы более специальным и архаизирующим термином.
- source_word: ἐπίγνωθι
  choice: узнай
  rationale: Повелительная форма означает «распознай, определи»; «узнай» естественно передаёт проверку принадлежности одежды.
