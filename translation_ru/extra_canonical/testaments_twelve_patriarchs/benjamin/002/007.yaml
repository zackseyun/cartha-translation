lexical_decisions:
- source_word: Μὴ λέγετε
  choice: Не говорите
  rationale: Настоящий императив с отрицанием естественно передан как прямой запрет, обращённый к нескольким лицам.
- source_word: ἃ ἐποιήσατέ μοι
  choice: что вы со мной сделали
  rationale: Передаёт относительную конструкцию и дательный объект естественным современным русским выражением без смягчения смысла.
- source_word: ἀλλʼ οὕτως λέξατε
  choice: но скажите так
  rationale: Аористный императив передан повелительной формой совершенного вида; οὕτως сохранено наречием «так».
- source_word: καθὼς ἐξηγησάμην τῷ Βενιαμίν
  choice: как я объяснил Вениамину
  rationale: Сохраняется отсутствие выраженного прямого дополнения после глагола; имя Βενιαμίν передано в принятой русской библейской форме.
