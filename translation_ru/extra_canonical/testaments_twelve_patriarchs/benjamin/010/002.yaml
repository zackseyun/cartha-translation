  text: 'И, сказав это, он сказал им: «Знайте же, дети мои, что я умираю».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ταῦτα εἰπὼν
  choice: И, сказав это
  rationale: Естественно передаёт греческую обстоятельственную конструкцию, сохраняя связь с предшествующей речью.
- source_word: λέγει αὐτοῖς
  choice: он сказал им
  rationale: Историческое настоящее передано русским прошедшим временем для естественного повествования; адресаты сохранены явно.
- source_word: Γινώσκετε οὖν
  choice: Знайте же
  rationale: Императив передан прямо; частица οὖν выражена словом «же», обозначающим вывод и переход к заключению.
- source_word: τέκνα μου
  choice: дети мои
  rationale: Буквальный и естественный эквивалент обращения.
- source_word: ἀποθνῄσκω
  choice: я умираю
  rationale: Настоящее время сохраняет непосредственный смысл процесса приближающейся смерти, не заменяя его выражением «скоро умру».
