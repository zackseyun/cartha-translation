  text: '*Ταῦτα γὰρ πάντα δέδωκαν ἡμῖν εἰς κληρονομίαν¹⁹ *εἰπόντες· Φυλάξατε τὰς ἐντολὰς τοῦ Θεοῦ²⁰ ἕως ὅτου²¹ ἀποκαλύψει [Κύριος τὸ σωτήριον αὐτοῦ πᾶσι τοῖς ἔθνεσι].'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/005.yaml
  text: For they gave us all these things as an inheritance, saying, ‘Keep the commandments of God until the time when [the Lord reveals his salvation to all the nations].’
translation:
  language: ru
  text: 'Ведь всё это они передали нам в наследие, сказав: «Соблюдайте заповеди Бога до тех пор, пока [Господь не откроет своё спасение всем народам]».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова в квадратных скобках текстологически сомнительны. В иной форме текста после «до тех пор, пока» говорится, что адресаты увидят Еноха, Сифа, Авраама, Исаака и Иакова, восставших по правую руку его в радости.
    reason: Сноска объясняет квадратные скобки и сообщает существенный альтернативный вариант, не уточняя неоднозначный референт местоимения в этом варианте.
lexical_decisions:
- source_word: δέδωκαν ἡμῖν εἰς κληρονομίαν
  choice: передали нам в наследие
  rationale: Передаёт результативное значение перфекта δέδωκαν и естественно выражает εἰς κληρονομίαν по-русски.
- source_word: Φυλάξατε
  choice: Соблюдайте
  rationale: В контексте заповедей φυλάσσω означает бережно хранить их посредством исполнения; «соблюдайте» — естественный современный эквивалент.
- source_word: ἕως ὅτου ἀποκαλύψει
  choice: до тех пор, пока … не откроет
  rationale: Русская конструкция с «пока не» естественно передаёт предел действия, обозначенный ἕως ὅτου с будущим временем.
- source_word: τὸ σωτήριον αὐτοῦ
  choice: Своё спасение
  rationale: Субстантивированное σωτήριον допускает значение Божьего спасения/спасительного деяния; возвратное «Своё» ясно соотносит его с Господом.
- source_word: πᾶσι τοῖς ἔθνεσι
  choice: всем народам
  rationale: Сохраняет универсальный охват πᾶσι и обычное библейское значение ἔθνη — народы, включая языческие народы.
theological_decisions:
- issue: Способ выражения Божьего спасения
  choice: Господь откроет Своё спасение
  alternative: Господь явит Своё спасение
  rationale: «Откроет» ближе к ἀποκαλύψει и не уточняет, идёт ли речь об откровении, публичном явлении или осуществлении спасения.
- issue: Текст в квадратных скобках
  choice: Сохранить квадратные скобки в основном тексте
  alternative: Печатать без скобок
  rationale: Скобки присутствуют в предоставленном критическом исходном тексте и указывают на текстологическую особенность; перевод не должен скрывать её.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского наставления. Синтаксис сделан естественным для широкого читателя; сохранены причинное «ведь», повелительная сила наставления и квадратные скобки критического текста.
