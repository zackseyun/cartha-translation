source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: ⌜Ὑμεῖς οὖν, τέκνα μου⁶⁷, ἐὰν⁶⁸ πορευθῆτε⁶⁹ ἐν ἁγιασμῷ ⌜*ἐν ταῖς ἐντολαῖς⁷⁰ Κυρίου⌝, πάλιν κατοικήσετε⁷¹ ⌜ἐπʼ ἐλπίδι⌝ *ἐν ἐμοί⁷², καὶ συναχθήσεται⁷³ *πρὸς Κύριον⁷⁴ πᾶς Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/011.yaml
  text: You therefore, my children, if you walk in holiness in the commandments of the Lord, you will again dwell in hope with me, and all Israel will be gathered to the Lord.
translation:
  language: ru
  text: Итак, дети мои, если вы будете ходить в святости, следуя заповедям Господа, то вновь поселитесь со мной, сохраняя надежду[a], и весь Израиль соберётся к Господу.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможный перевод: «то вновь поселитесь, возлагая надежду на меня».'
    reason: Фраза ἐπʼ ἐλπίδι ἐν ἐμοί допускает отнесение «во мне / на меня» к надежде, а не к глаголу «поселитесь».
lexical_decisions:
- source_word: πορευθῆτε ἐν ἁγιασμῷ
  choice: будете ходить в святости
  rationale: Сохранён библейский образ «хождения» как образа жизни; ἁγιασμός передан как «святость», без сужения значения до одного лишь нравственного поведения.
- source_word: ἐν ταῖς ἐντολαῖς Κυρίου
  choice: следуя заповедям Господа
  rationale: Буквальное «в заповедях» по-русски звучит неестественно; «следуя» естественно выражает жизнь в рамках Господних заповедей и не добавляет конфессиональной окраски.
- source_word: πάλιν κατοικήσετε
  choice: вновь поселитесь
  rationale: κατοικέω обозначает проживание или поселение; «вновь» сохраняет πάλιν и подразумеваемое восстановление совместного пребывания.
- source_word: συναχθήσεται πρὸς Κύριον
  choice: соберётся к Господу
  rationale: 'Сохранено направительное значение πρὸς: Израиль собирается именно к Господу, а не просто Господом или перед Ним.'
theological_decisions:
- issue: Связь выражения ἐπʼ ἐλπίδι ἐν ἐμοί
  choice: со мной, сохраняя надежду
  alternative: возлагая надежду на меня
  rationale: 'Греческая последовательность допускает различное синтаксическое членение: ἐν ἐμοί может относиться к совместному пребыванию либо к надежде. Основной текст следует пониманию «со мной», засвидетельствованному консультационным английским слоем, а примечание сохраняет альтернативу.'
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Образ «ходить» сохранён, тогда как вторая предложная конструкция передана естественным русским оборотом. Синтаксис сделан ясным для широкого читателя без устранения текстовой неоднозначности.
