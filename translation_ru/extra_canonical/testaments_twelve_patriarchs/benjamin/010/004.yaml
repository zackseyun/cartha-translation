id: T12P.BEN.10.4
reference: Testament of Benjamin 10:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Ταῦτα γὰρ ὑμῖν ἀντὶ πάσης κληρονομίας καταλειμπάνω¹⁴. καὶ ὑμεῖς Γοὖν δότε αὐτὰ¹⁵ τοῖς τέκνοις ὑμῶν *εἰς κατάσχεσιν¹⁶ αἰώνιον· οὕτω¹⁷ Γγὰρ˥ ἐποίησεν¹⁸ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/004.yaml
  text: For these things I leave to you instead of every inheritance. And you, therefore, give them to your children as an everlasting possession; for thus Abraham and Isaac and Jacob did.
translation:
  language: ru
  text: Ибо это я оставляю вам вместо всякого наследства. Поэтому и вы передайте это своим детям во владение навеки, ведь так поступили Авраам, Исаак и Иаков.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: это
  rationale: Указательное местоимение во множественном числе относится к ранее изложенным наставлениям; в естественном русском языке совокупность наставлений уместно передать собирательным «это».
- source_word: ἀντὶ πάσης κληρονομίας
  choice: вместо всякого наследства
  rationale: Сохраняет значение замещения у ἀντί и широкий охват πάσης, не сводя выражение только к материальному имуществу.
- source_word: καταλειμπάνω
  choice: оставляю
  rationale: Прямо передаёт действие завещательного оставления и хорошо сочетается с образом наследства.
- source_word: οὖν
  choice: поэтому
  rationale: 'Передаёт вывод или следствие: полученное духовное наследие надлежит передать следующему поколению.'
- source_word: δότε
  choice: передайте
  rationale: В контексте межпоколенческой передачи наставлений естественнее буквального «дайте», при этом сохраняется императив.
- source_word: εἰς κατάσχεσιν αἰώνιον
  choice: во владение навеки
  rationale: κατάσχεσις обозначает обладание или владение; «навеки» естественно передаёт αἰώνιον без тяжеловесного «вечное владение».
- source_word: ἐποίησεν
  choice: поступили
  rationale: Русское «так поступили» идиоматично передаёт греческое «так сделали»; единственное число греческого сказуемого при перечисленных лицах не воспроизводится как ненормативное для современного русского.
theological_decisions:
- issue: Характер наследства
  choice: Сохранён образ наследства и вечного владения без уточнения, являются ли «это» заповедями, добродетелями или учением.
  alternative: Явно назвать предмет «наставлениями» или «заповедями».
  rationale: Греческое Ταῦτα анафорично и само по себе не называет предмет; добавление конкретного существительного устранило бы исходную открытость.
- issue: Значение αἰώνιον
  choice: «навеки»
  alternative: «вечное» или «непреходящее»
  rationale: Формулировка сохраняет сильное временное значение и не вносит дополнительного догматического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксис слегка приподнят, но понятен обычному читателю; архаизмы и конфессионально окрашенные формулы исключены.
