source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Τότε καὶ ἡμεῖς ἀναστησόμεθα³³ ἕκαστος *ἐπὶ σκήπτρον ἡμῶν³⁴ προσκυνοῦντες τὸν βασιλέα *τῶν οὐρανῶν³⁵ [τὸν ἐπὶ γῆς φανέντα³⁶ ἐν³⁷ μορφῇ ἀνθρώπου *ἐν ταπεινώσει³⁸, καὶ ὅσοι πιστεύσωσιν³⁹ αὐτῷ⁴⁰ ἐπὶ τῆς⁴¹ γῆς *χαρίσονται σὺν αὐτῷ⁴²].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/007.yaml
  text: Then we also will rise, each on our scepter, worshiping the king of the heavens, [the one who appeared on earth in the form of a man in humility; and as many as believed in him on the earth will rejoice with him].
translation:
  language: ru
  text: Тогда и мы воскреснем — каждый при своём скипетре[a] — и поклонимся Царю небес, [Тому, Кто явился на земле в человеческом облике, в смирении; и все, кто уверует в Него на земле, возрадуются вместе с Ним].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «каждый — при скипетре нашем». Слово «скипетр» может обозначать не только царский жезл, но и знак власти либо принадлежности к колену; точный смысл выражения неясен.'
    reason: Необычная греческая конструкция и многозначность σκήπτρον требуют краткого пояснения без устранения неоднозначности.
  - marker: b
    text: Слова от «Тому, Кто явился…» до конца стиха в используемом греческом издании заключены в квадратные скобки, что указывает на их текстологическую обособленность или сомнительность.
    reason: Необходимо отразить квадратные скобки исходного издания и предупредить читателя о текстовой неопределённости.
lexical_decisions:
- source_word: ἀναστησόμεθα
  choice: воскреснем
  rationale: Будущая форма ἀνίστημι в данном эсхатологическом контексте естественно обозначает воскресение из мёртвых.
- source_word: ἕκαστος ἐπὶ σκήπτρον ἡμῶν
  choice: каждый при своём скипетре
  rationale: Сохранён необычный образ σκήπτρον («скипетр», также знак власти или колена), но русская притяжательная конструкция согласована с distributive ἕκαστος («каждый»). Неясность образа не заменена толкованием вроде «на своём престоле».
- source_word: προσκυνοῦντες
  choice: и поклонимся
  rationale: Греческое причастие передано сочинённым глаголом для естественного русского синтаксиса; смысл почитания и поклонения сохранён.
- source_word: τὸν βασιλέα τῶν οὐρανῶν
  choice: Царю небес
  rationale: Сохранён множественный образ греческого οὐρανῶν и традиционно-достоинственный, но понятный титул.
- source_word: ἐν μορφῇ ἀνθρώπου ἐν ταπεινώσει
  choice: в человеческом облике, в смирении
  rationale: μορφή передано нейтральным «облик», без привнесения позднейшей догматической терминологии; отдельное ἐν ταπεινώσει сохранено как характеристика смиренного явления.
- source_word: ὅσοι πιστεύσωσιν αὐτῷ
  choice: все, кто уверует в Него
  rationale: Аорист конъюнктива в обобщённо-будущей конструкции передан будущим совершенного вида. Дательный αὐτῷ передан обычным русским управлением «уверовать в».
- source_word: χαρίσονται σὺν αὐτῷ
  choice: возрадуются вместе с Ним
  rationale: Следует смыслу, засвидетельствованному консультационным английским слоем, при сохранении совместности σὺν αὐτῷ; форма в данном месте допускает текстовую/лексическую трудность, поэтому не развёрнута в более специальное богословское утверждение.
theological_decisions:
- issue: Кого обозначает «Царь небес» и последующие местоимения
  choice: Сохранена грамматическая связь Царя небес с Тем, Кто явился в человеческом облике
  alternative: Разделить эти обозначения как относящиеся к разным лицам
  rationale: Приложение τὸν ἐπὶ γῆς φανέντα грамматически продолжает винительный объект τὸν βασιλέα; перевод не добавляет конфессионального пояснения.
- issue: Условие участия верующих
  choice: «все, кто уверует в Него»
  alternative: «все, кто верил в Него» или «все верующие»
  rationale: Будущая обобщённость πιστεύσωσιν сохранена без превращения высказывания в формулу о конкретной эпохе или группе.
- issue: Редакционные квадратные скобки в исходном тексте
  choice: Скобки сохранены и объяснены в примечании
  alternative: Включить фрагмент без обозначения его текстовой обособленности
  rationale: Так сохраняется представленная издателем текстологическая неопределённость и не создаётся ложного впечатления бесспорности всего фрагмента.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Использованы понятные формы «воскреснем», «человеческом облике», «возрадуются»; сохранены ключевые образы «скипетр» и «Царь небес». Заглавные буквы в местоимениях служат принятому русскому религиозному регистру и не добавляют отдельного толкования.
