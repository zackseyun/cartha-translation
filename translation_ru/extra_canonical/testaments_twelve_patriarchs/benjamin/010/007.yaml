review_pass:
  verdict: revise
  source_fidelity: Основная конструкция передана в целом верно, включая редакционно обособленный фрагмент в квадратных скобках. Однако «каждый при своём скипетре» заменяет исходное ἡμῶν («нашем») на «своём». Кроме того, «возрадуются» соответствует английскому контрольному слою, но не прямо форме χαρίσονται данного греческого текста (обычно от χαρίζομαι, «окажут милость/даруют»); это место лексически и, вероятно, текстологически затруднительно.
  naturalness: Русский текст литературный и читаемый; торжественный регистр уместен. «При нашем скипетре» намеренно необычно, но это оправдано неясностью исходного образа и поясняется примечанием.
  terminology: «Воскреснем», «поклонимся», «Царю небес», «в человеческом облике» и «в смирении» удачны. Заглавные буквы в местоимениях допустимы в выбранном религиозном регистре. Для χαρίσονται нельзя без оговорки выдавать «возрадуются» за прямой перевод греческой формы.
  issues:
  - severity: medium
    issue: Притяжательное местоимение при σκήπτρον
    rationale: В тексте стоит ἡμῶν («нашем»), тогда как основной перевод даёт «своём». Хотя это может быть попыткой осмыслить сочетание с ἕκαστος, перевод не должен молча устранять исходную неоднозначность.
  - severity: high
    issue: Передача χαρίσονται как «возрадуются»
    rationale: Указанная греческая форма не является обычной формой глагола «радоваться» (χαίρω). Английский POB даёт «will rejoice», но приоритет имеет предоставленный греческий текст. Нужен осторожный перевод по значению χαρίζομαι и примечание о трудности; вероятная текстологическая причина английского чтения не должна исправляться без внешнего текстологического решения.
  - severity: low
    issue: Оформление знака примечания после квадратной скобки
    rationale: Точка перед [b] создаёт избыточное «].[b]». Маркер следует поставить непосредственно после закрывающей квадратной скобки, а завершающую точку — после маркера.
  revised_text: Тогда и мы воскреснем — каждый при нашем скипетре[a] — и поклонимся Царю небес, [Тому, Кто явился на земле в человеческом облике, в смирении; и все, кто уверует в Него на земле, окажут милость вместе с Ним][b].
  revised_footnotes:
  - marker: a
    text: 'Буквально: «каждый — при скипетре нашем». Слово «скипетр» может обозначать не только царский жезл, но и знак власти либо принадлежности к колену; синтаксис и точный смысл выражения неясны.'
    reason: Сохраняет «нашем» (ἡμῶν) и объясняет необычное выражение, не подменяя его толкованием.
  - marker: b
    text: Слова от «Тому, Кто явился…» до конца стиха в используемом греческом издании заключены в квадратные скобки, что указывает на их текстологическую обособленность или сомнительность. Греческое «окажут милость» передаёт χαρίσονται; в данном контексте форма необычна. Английский контрольный перевод понимает это слово как «возрадуются», однако такое значение не является прямым для данной греческой формы.
    reason: Передаёт значение предоставленного греческого текста, сохраняет редакционные скобки и прозрачно отмечает существенную лексическую трудность и расхождение с английским audit trail.
  revision_rationale: 'Исправлены два содержательных расхождения с предоставленным греческим текстом: «своём» заменено на «нашем», а «возрадуются» — на осторожное буквальное «окажут милость». Последняя передача семантически неудобна в русском контексте, но именно поэтому снабжена примечанием; более гладкое «возрадуются» следовало бы принять лишь при подтверждённом ином греческом чтении, а не на основании одного английского контрольного перевода. Также исправлено положение маркера примечания.'
