  text: '*Καὶ οἱ⁴³ πάντες ἀναστήσονται, οἱ μὲν εἰς δόξαν, οἱ δὲ εἰς ἀτιμίαν, καὶ κρινεῖ Κύριος⁴⁴ ἐν πρώτοις τὸν Ἰσραὴλ⁴⁵ περὶ τῆς *ἀδικίας αὐτῶν⁴⁶ [ὅτι παραγενόμενον⁴⁷ Θεὸν⁴⁴ ἐν σαρκί⁴⁸, οὐκ ἐπίστευσαν αὐτῷ⁴⁹].'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/008.yaml
  text: And all will rise, some to glory and some to dishonor; and the Lord will judge Israel first concerning their unrighteousness, [because when God came to them in flesh, they did not believe him].
translation:
  language: ru
  text: 'И все воскреснут: одни — для славы, другие — для бесчестия. И Господь сначала будет судить Израиль за его неправедность [потому что, когда Бог пришёл во плоти, они не поверили Ему].[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «потому что, когда Бог пришёл во плоти, они не поверили Ему» в греческом издании заключены в квадратные скобки как текстуально сомнительные.
    reason: Примечание объясняет квадратные скобки, сохранённые в переводе вслед за исходным изданием, и не предрешает текстологический вопрос.
lexical_decisions:
- source_word: ἀναστήσονται
  choice: воскреснут
  rationale: В эсхатологическом контексте глагол означает восстание из мёртвых; «воскреснут» естественно и точно передаёт смысл.
- source_word: εἰς δόξαν … εἰς ἀτιμίαν
  choice: для славы… для бесчестия
  rationale: Сохранены параллелизм и направленность конструкции εἰς; «бесчестие» передаёт противопоставление славе без добавления идеи осуждения, прямо не выраженной существительным.
- source_word: ἐν πρώτοις
  choice: прежде всего
  rationale: Передаёт приоритет суда над Израилем; греческое выражение допускает смысл «в числе первых», но в данном синтаксисе естественнее «прежде всего».
- source_word: περὶ τῆς ἀδικίας αὐτῶν
  choice: за их неправедность
  rationale: «За» естественно выражает основание суда, а множественное «их» сохраняет согласование по смыслу с собирательным «Израиль».
- source_word: παραγενόμενον Θεὸν ἐν σαρκί
  choice: когда Бог пришёл во плоти
  rationale: Временная придаточная конструкция по-русски естественно передаёт обстоятельственное значение причастия, сохраняя утверждение о пришествии Бога во плоти.
theological_decisions:
- issue: Суд над Израилем «ἐν πρώτοις»
  choice: Господь прежде всего будет судить Израиль
  alternative: Господь будет судить Израиль в числе первых
  rationale: Основной перевод отражает наиболее естественный здесь смысл очередности, не уточняя основания этой очередности.
- issue: Текстуально отмеченная христологическая причинная оговорка
  choice: Сохранить её в квадратных скобках и снабдить примечанием
  alternative: Включить без обозначения либо исключить из основного текста
  rationale: Квадратные скобки исходного издания сигнализируют текстуальную неуверенность; её нельзя скрывать или молча разрешать.
- issue: Референт Θεὸν / αὐτῷ
  choice: «Бог… Ему»
  alternative: Заменить на явно христологическое именование, например «Христос»
  rationale: Перевод сохраняет прямую лексику греческого текста и не вводит отсутствующее в нём имя.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной и эсхатологической речи. Сохранены краткость, параллелизм и богословская напряжённость оригинала; синтаксис слегка перестроен ради ясности.
