  text: And then you will see Enoch and Seth and Abraham and Isaac and Jacob raised up at his right hand in rejoicing.
translation:
  language: ru
  text: И тогда вы увидите Еноха, Сифа, Авраама, Исаака и Иакова, восставших по правую руку от Него в ликовании.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄψεσθε
  choice: вы увидите
  rationale: Прямо передаёт форму будущего времени второго лица множественного числа.
- source_word: ἀνασταμένους
  choice: восставших
  rationale: Причастие от ἀνίστημι может обозначать вставание или воскресение; «восставших» сохраняет эту смысловую широту и естественно звучит в эсхатологическом контексте.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: по правую руку от Него
  rationale: Устойчивая и достойная русская формула для положения справа от названного ранее лица; прописная буква не добавляет имени, но отражает подразумеваемого Господа в контексте.
- source_word: ἐν ἀγαλλιάσει
  choice: в ликовании
  rationale: Передаёт сильную, торжественную радость без ослабления до общего «в радости».
theological_decisions:
- issue: Значение ἀνασταμένους
  choice: восставших
  alternative: воскресшими
  rationale: Более узкое «воскресшими» возможно, однако греческая форма сама по себе допускает значение «вставших»; выбранный вариант сохраняет эсхатологический оттенок и исходную неоднозначность.
- issue: Референт местоимения αὐτοῦ
  choice: от Него
  alternative: от него
  rationale: Контекст указывает на возвышенного божественного референта, но стих не называет его заново; местоимение сохранено без поясняющей вставки.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Перечень имён передан без избыточного повторения союза, что естественно для русского и сохраняет структуру греческой фразы.
