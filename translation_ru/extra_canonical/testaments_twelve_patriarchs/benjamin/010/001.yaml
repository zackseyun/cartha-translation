base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/001.yaml
  text: When Joseph was in Egypt, I longed to see his appearance and the form of his face; and through the prayers of Jacob my father I saw him, while awake by day, just as his whole appearance was.
translation:
  language: ru
  text: Когда Иосиф был в Египте, я страстно желал увидеть его облик и черты его лица. И по молитвам Иакова, отца моего, я увидел его днём, бодрствуя, во всём его облике — таким, каков он был.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или, ближе к порядку слов греческого текста: «я увидел его, бодрствуя днём, таким, каков был весь его облик».'
    reason: Греческое заключение καθ᾽ ὃ ἦν πᾶσα ἡ εἰδέα αὐτοῦ синтаксически неровно; примечание сохраняет возможное более буквальное членение без устранения неоднозначности.
lexical_decisions:
- source_word: ἐπεθύμουν
  choice: страстно желал
  rationale: Передаёт сильное, продолжительное желание, выраженное имперфектом, естественным современным русским языком.
- source_word: τὴν εἰδέαν αὐτοῦ
  choice: его облик
  rationale: «Облик» естественно обозначает видимую внешность человека и не сужает значение до отдельных черт.
- source_word: τὴν μόρφωσιν τῆς ὄψεως αὐτοῦ
  choice: черты его лица
  rationale: Идиоматично передаёт форму или очертания лица, избегая тяжеловесного буквального «форму его лица».
- source_word: ἐν ἡμέρᾳ γρηγορῶν
  choice: днём, не во сне
  rationale: Передаёт одновременно дневное время и состояние бодрствования; отрицательная формулировка естественна по-русски и подчёркивает, что это не был сон.
- source_word: καθ᾽ ὃ ἦν πᾶσα ἡ εἰδέα αὐτοῦ
  choice: во всём его облике
  rationale: Компактно и естественно выражает, что Иосиф был увиден таким, каков был весь его внешний облик, без усиления вроде «точно».
theological_decisions:
- issue: Характер видения Иосифа
  choice: я увидел его днём, не во сне
  alternative: я увидел его, бодрствуя днём
  rationale: Текст указывает на сверхобычное видение, полученное по молитвам, но не определяет его механизм; перевод сохраняет это и лишь ясно отличает видение от сна.
- issue: Посредство молитв Иакова
  choice: по молитвам Иакова
  alternative: через молитвы Иакова
  rationale: «По молитвам» естественно по-русски выражает обусловленность видения молитвами, не приписывая Иакову самостоятельной чудотворной силы.
translation_notes:
  register: Современный литературный русский с достоинством завещательной речи. Синтаксис упрощён ради ясности, но повторное указание на внешний облик и необычный характер видения сохранены.
