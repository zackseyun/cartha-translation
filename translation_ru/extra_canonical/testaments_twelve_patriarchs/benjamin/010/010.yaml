source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἐλέγξει ἐν τοῖς ἐκλεκτοῖς *τῶν ἐθνῶν⁵⁸ τὸν Ἰσραήλ, ὥσπερ ἤλεγξεν τὸν Ἡσαῦ ἐν τοῖς Μαδιωαίοις τοῖς †ἀπατήσασιν⁵⁹ *ἀδελφοὺς αὐτῶν⁶⁰ [γενέσθαι διὰ τῆς πορνείας καὶ τῆς εἰδωλολατρείας, καὶ⁶¹ ἀπηλλοτριώθησαν Θεοῦ]⁶², γενόμενοι⁶³ οὖν⁶⁴ τέκνα ἐν μερίδι φοβουμένων⁶⁵ Κύριον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/010.yaml
  text: And he will convict Israel among the chosen of the nations, just as he convicted Esau among the Midianites, who deceived their brothers [to become through fornication and idolatry, and they were alienated from God], thus becoming children in the portion of those who fear the Lord.
translation:
  language: ru
  text: И Он обличит Израиль среди избранных из народов, как обличил Исава среди мадианитян, обманувших своих братьев, [так что те предались блуду и идолопоклонству и отчуждились от Бога], и таким образом ставших детьми в уделе боящихся Господа.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст этого места повреждён и имеет несколько разночтений; особенно неясны связь слов в квадратных скобках и то, к кому относится выражение «ставших детьми».
    reason: Необходимо предупредить читателя о подлинной синтаксической и текстологической неопределённости, которую нельзя надёжно устранить переводом.
lexical_decisions:
- source_word: ἐλέγξει / ἤλεγξεν
  choice: обличит / обличил
  rationale: 'Сохраняет судебно-нравственный оттенок ἐλέγχω: выявить вину и подвергнуть обличению; более естественно здесь, чем узкое «осудит».'
- source_word: ἐν τοῖς ἐκλεκτοῖς τῶν ἐθνῶν
  choice: среди избранных из народов
  rationale: Передаёт ἐν как «среди», а родительный τῶν ἐθνῶν — как принадлежность или происхождение избранных, не устраняя возможной неоднозначности.
- source_word: Μαδιωαίοις
  choice: мадианитян
  rationale: Устоявшаяся русская библейская форма этнонима «мадианитяне».
- source_word: ἀπατήσασιν ἀδελφοὺς αὐτῶν
  choice: обманувших своих братьев
  rationale: Прямо сохраняет действие причастия и возвратное отношение αὐτῶν.
- source_word: διὰ τῆς πορνείας καὶ τῆς εἰδωλολατρείας
  choice: предались блуду и идолопоклонству
  rationale: В повреждённой конструкции выражает подразумеваемое наступившее состояние естественным русским языком, сохраняя оба названных порока.
- source_word: ἀπηλλοτριώθησαν Θεοῦ
  choice: отчуждились от Бога
  rationale: Близко передаёт идею удаления и утраты связи с Богом.
- source_word: τέκνα ἐν μερίδι φοβουμένων Κύριον
  choice: детьми в уделе боящихся Господа
  rationale: Сохраняет необычный образ «детей» и «удела», не заменяя его более интерпретирующим выражением.
theological_decisions:
- issue: Лицо подлежащего в начале стиха
  choice: «Он» с прописной буквы
  alternative: «он» со строчной буквы или явное наименование действующего лица
  rationale: Греческий текст содержит лишь форму глагола третьего лица без выраженного подлежащего. Прописная буква указывает на вероятную отсылку к Богу в контексте, но не добавляет отсутствующего имени.
- issue: К кому относится причастие γενόμενοι («ставшие»)?
  choice: Сохранено грамматическое согласование с мадианитянами через «ставших»
  alternative: 'Отнести становление к обманутым братьям: «так что те стали…»'
  rationale: Мужской именительный множественного числа γενόμενοι естественнее всего возвращается к теме/субъекту более широкой конструкции, однако синтаксис повреждён и смысл остаётся неуверенным; это отмечено в сноске.
- issue: Статус текста в квадратных скобках
  choice: Сохранён в квадратных скобках
  alternative: Включить без скобок или исключить как вторичную вставку
  rationale: Источник явно маркирует этот фрагмент скобками; сохранение оформления честно отражает текстологическую неуверенность.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Сохранены непривычные образы оригинала и квадратные скобки источника; синтаксис слегка упорядочен ради понятности без сокрытия повреждённости текста.
