review_pass:
  verdict: revise
  source_fidelity: 'Начальное «Он» не имеет выраженного антецедента в самом стихе; прописная буква неоправданно конкретизирует его как божественное лицо. Вставка в скобках передаётся слишком свободно: «так что те предались» добавляет причинно-следственную связь, определяет референт «те» и заменяет инфинитив γενέσθαι («стать») иной мыслью. Синтаксическая повреждённость исходника должна остаться заметной.'
  naturalness: Основной русский синтаксис понятен, однако сочетание «так что те ... и таким образом ставших» одновременно меняет смысл скобочного фрагмента и создаёт неясную соотнесённость причастия. Более буквальная передача внутри квадратных скобок с многоточием честнее отражает лакуну/сбой текста.
  terminology: «Обличит», «избранные из народов», «мадианитяне», «блуд», «идолопоклонство», «отчуждились от Бога» и «боящиеся Господа» уместны. Строчная буква в «он» сохраняет отсутствие названного подлежащего в греческом тексте и не навязывает богословской идентификации.
  issues:
  - severity: medium
    issue: Необоснованная прописная буква в «Он».
    rationale: В греческом стихе субъект при ἐλέγξει не назван. Прописная буква интерпретирует референт, которого текст данного стиха не выражает.
  - severity: high
    issue: Скобочный фрагмент истолкован вместо сохранения его повреждённого синтаксиса.
    rationale: '«Так что те предались» отсутствует в греческом: добавлены «те», следственная связь и глагол «предались», тогда как в источнике стоит проблемное γενέσθαι («стать») и далее finite ἀπηλλοτριώθησαν.'
  - severity: medium
    issue: Связь «ставших» с предшествующим фрагментом затемнена изменённой конструкцией.
    rationale: γενόμενοι следует после закрывающей скобки и его референт спорен. Перевод должен не закреплять связь с «теми», введёнными только переводчиком.
  revised_text: И он обличит Израиль среди избранных из народов, как обличил Исава среди мадианитян, обманувших своих братьев, [стать через блуд и идолопоклонство ... и отчуждились от Бога], — ставших детьми в уделе боящихся Господа.[a]
  revised_footnotes:
  - marker: a
    text: Греческий текст этого места повреждён и имеет несколько разночтений. Фрагмент в квадратных скобках передан предельно буквально, хотя его синтаксис нарушен; в частности, неясны связь слов «стать через блуд и идолопоклонство» и то, к кому относится «ставших детьми».
    reason: Сноска поясняет сохранённую в переводе текстологическую и синтаксическую неопределённость, не разрешая её догматически или интерпретационно.
  revision_rationale: Исправление устраняет богословски конкретизирующую прописную букву и снимает добавленные переводчиком причинно-следственные отношения и референт внутри повреждённой вставки. Многоточие в квадратных скобках обозначает фактический синтаксический разрыв исходного текста; тире перед «ставших» помогает русскому читателю увидеть, что это внешнее по отношению к скобочной вставке продолжение столь же неясной конструкции.
