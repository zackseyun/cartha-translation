  text: Therefore, each one should practice truth toward his neighbor, and keep the law of the Lord and his commandments.
translation:
  language: ru
  text: Итак, пусть каждый поступает по правде со своим ближним и соблюдает закон Господа и Его заповеди.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποιήσατε ... ἀλήθειαν
  choice: поступайте по правде
  rationale: Греческое буквальное выражение «делайте истину» естественно передано устойчивым современным оборотом, сохраняющим смысл правдивого и справедливого поведения, а не только правдивой речи.
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  choice: каждый ... со своим ближним
  rationale: Сохранены индивидуальная обращённость ἕκαστος и отношение к ближнему; предлог πρὸς в данном контексте естественно передаётся как «с».
- source_word: φυλάξατε
  choice: соблюдайте
  rationale: Императив аориста передаёт прямое наставление хранить и исполнять закон и заповеди; «соблюдайте» естественно для русского библейского регистра.
- source_word: τὸν νόμον Κυρίου, καὶ τὰς ἐντολὰς αὐτοῦ
  choice: закон Господа и Его заповеди
  rationale: Сохранены оба однородных объекта без сведения заповедей к закону или устранения возможного смыслового различия между ними.
theological_decisions:
- issue: Соотношение закона Господа и Его заповедей
  choice: Сохранить оба выражения как отдельные однородные дополнения
  alternative: Объединить их в одно понятие или истолковать заповеди как пояснение закона
  rationale: Греческий текст соединяет два выражения союзом καί; перевод не должен устранять их риторическое или смысловое различие.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Формула «поступайте по правде» понятна широкому читателю и избегает неестественного буквализма «делайте истину».
