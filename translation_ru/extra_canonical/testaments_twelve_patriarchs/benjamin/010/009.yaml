  source_fidelity: 'Основной смысл передан верно: κρινεῖ — «будет судить», πάντα τὰ ἔθνη — «все народы», а явление на земле не получает добавочного богословского истолкования. Однако ὅσα грамматически отсылает к τὰ ἔθνη («народы»), тогда как «всех, кто» переводит уточнение как группу лиц и тем самым меняет референт.'
  naturalness: Фраза в целом естественна для современного литературного русского. Относительное придаточное с «которые» точнее и столь же естественно; тире внутри редакционных скобок не требуется.
  terminology: «Судить», «народы», «поверили ему» и «явился на земле» уместны. Строчная буква в «он/ему» обоснованно сохраняет местоименную неопределённость оригинала.
  issues:
