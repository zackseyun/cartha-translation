revisions:
- from: И тогда он будет судить все народы [— всех, кто не поверил ему, когда он явился на земле].[a]
  to: И тогда он будет судить все народы [которые не поверили ему, когда он явился на земле].[a]
  rationale: Заменено «всех, кто» на «которые», чтобы сохранить связь скобочного уточнения с «народами», как в греческом тексте и английском аудиторском переводе. Убрано необоснованное тире. Редакционные скобки и примечание сохранены; смысл и степень текстологической неопределённости не изменены.
