  text: Καὶ τότε κρινεῖ πάντα τὰ ἔθνη [ὅσα οὐκ ἐπίστευσαν αὐτῷ ἐπὶ τῆς⁵⁰ γῆς φανέντι⁵⁷].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/009.yaml
  text: And then he will judge all the nations, [as many as did not believe him when he appeared on earth].
translation:
  language: ru
  text: И тогда он будет судить все народы [которые не поверили ему, когда он явился на земле].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова в квадратных скобках в исходном издании выделены как текстуально не вполне надёжные.
    reason: Необходимо обозначить редакционную неопределённость скобочного фрагмента и не представить его бесспорно установленной частью текста.
lexical_decisions:
- source_word: κρινεῖ
  choice: будет судить
  rationale: Будущее время и основное судебное значение глагола переданы прямо и естественно.
- source_word: πάντα τὰ ἔθνη
  choice: все народы
  rationale: Сохраняется всеобщий охват πάντα и обычное значение ἔθνη — «народы».
- source_word: ὅσα οὐκ ἐπίστευσαν αὐτῷ
  choice: всех, кто не поверил ему
  rationale: ὅσα вводит группу внутри упомянутых народов; конструкция «всех, кто» естественна по-русски и сохраняет отрицание и дательный объект при πιστεύω.
- source_word: ἐπὶ τῆς γῆς φανέντι
  choice: когда он явился на земле
  rationale: Причастие φανέντι согласовано с αὐτῷ и описывает его явление на земле; временная придаточная конструкция ясно и естественно передаёт обстоятельственное отношение, не уточняя природу явления.
theological_decisions:
- issue: Кого обозначает местоимение αὐτός
  choice: местоимение «он» со строчной буквы
  alternative: «Он» с прописной буквы либо явное именование лица
  rationale: Греческий текст оставляет референта местоименным; перевод не добавляет имени и не вводит конфессионально обусловленную практику почтительного написания.
- issue: Соотношение суда над всеми народами и последующего уточнения
  choice: сохранить «все народы» и вынесенное в скобки пояснение «всех, кто не поверил»
  alternative: слить в «все народы, которые не поверили»
  rationale: Так сохраняются и универсальная формулировка πάντα τὰ ἔθνη, и текстуально выделенное уточнение, без преждевременного разрешения возможного напряжения между ними.
translation_notes:
  register: Современный литературный русский язык; фраза краткая, торжественная и понятная. Редакционные квадратные скобки сохранены, а строчное написание местоимений избегает добавочной богословской маркировки.
