source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἔσται τὸ ἅπλωμα τοῦ ναοῦ σχιζόμενον²⁴ καὶ μεταβήσεται²⁵ τὸ πνεῦμα τοῦ Θεοῦ ἐπὶ τὰ ἔθνη, ὥσπερ²⁶ πῦρ ἐκχυνόμενον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/004.yaml
  text: And the veil of the temple will be torn, and the Spirit of God will pass over to the nations, like fire being poured out.
translation:
  language: ru
  text: И завеса храма разорвётся, и Дух Божий перейдёт к народам, как изливаемый огонь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἅπλωμα τοῦ ναοῦ
  choice: завеса храма
  rationale: Хотя ἅπλωμα буквально обозначает нечто простёртое или расстеленное, в храмовом контексте естественное и точное русское соответствие — «завеса».
- source_word: σχιζόμενον
  choice: разорвётся
  rationale: Передаёт образ разрывания завесы и согласуется с будущей направленностью конструкции ἔσται ... σχιζόμενον.
- source_word: μεταβήσεται
  choice: перейдёт
  rationale: Сохраняет пространственно-направленное значение глагола — переход к народам — без добавочного истолкования.
- source_word: τὰ ἔθνη
  choice: народы
  rationale: Нейтрально передаёт греческое множественное число и не сужает значение до конфессионально окрашенного «язычники».
- source_word: πῦρ ἐκχυνόμενον
  choice: изливающийся огонь
  rationale: Сохраняет необычное сочетание образов огня и излияния в греческом тексте, не заменяя его более привычной метафорой.
theological_decisions:
- issue: Направление действия Духа Божьего к τὰ ἔθνη
  choice: Дух Божий перейдёт к народам
  alternative: Дух Божий сойдёт на народы
  rationale: «Перейдёт к» точнее сохраняет μεταβήσεται и не вносит отсутствующий в глаголе образ сошествия; формулировка оставляет открытым точный богословский смысл перехода.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским ритмом. Необычный образ изливающегося огня намеренно сохранён как в источнике.
