source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἀνελθὼν ἐκ τοῦ ᾅδου²⁷ ἔσται²⁸ μεταβαίνων²⁹ ἀπὸ³⁰ τῆς³¹ γῆς πρὸς³² οὐρανόν³³. Ἔγνων³⁴ δὲ οἷος ἔσται³⁵ ταπεινὸς ἐπὶ³⁵ γῆς, καὶ οἷος ἔνδοξος *ἐν οὐρανῷ³⁶].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/005.yaml
  text: And having gone up from Hades, he will pass from earth to heaven. And I knew how lowly he would be on earth, and how glorious in heaven.
translation:
  language: ru
  text: И, поднявшись из преисподней[a], он перейдёт с земли на небо. И я узнал, каким смиренным он будет на земле и каким славным — на небе.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: То есть из мира мёртвых.
    reason: Уточняет значение ᾅδης и предотвращает автоматическое отождествление с местом окончательного наказания.
lexical_decisions:
- source_word: ᾅδου
  choice: преисподней
  rationale: Передаёт греческий ᾅδης как мир мёртвых, не отождествляя его без пояснения с местом окончательного наказания.
- source_word: ἀνελθών
  choice: поднявшись
  rationale: Сохраняет пространственное значение восхождения и форму предшествующего действия, не добавляя более узкого толкования «воскреснув».
- source_word: ἔσται μεταβαίνων
  choice: перейдёт
  rationale: Естественно передаёт перифрастическую будущую конструкцию и направленное перемещение от земли к небу.
- source_word: ἔγνων
  choice: я узнал
  rationale: Аорист передан прошедшим временем, в отличие от настоящего «я знаю».
- source_word: ταπεινός
  choice: смирен
  rationale: Сохраняет смысл непритязательности и уничижённого земного положения, не усиливая его до значения полного унижения.
- source_word: ἔνδοξος
  choice: славен
  rationale: Прямо передаёт противопоставление земной смиренности небесной славе.
theological_decisions:
- issue: Значение ᾅδης
  choice: преисподняя, то есть мир мёртвых
  alternative: ад как место окончательного наказания
  rationale: Греческое слово само по себе обозначает область мёртвых; перевод не должен заранее навязывать более узкое позднейшее понимание.
- issue: Характер восхождения из преисподней
  choice: нейтральное «поднявшись»
  alternative: «воскреснув»
  rationale: Контекст может подразумевать воскресение, однако сам глагол выражает восхождение; нейтральная передача сохраняет богословскую открытость формулировки.
translation_notes:
  register: Современный литературный русский язык с краткими именными сказуемыми «смирен» и «славен», сохраняющими торжественность и параллелизм греческой фразы.
