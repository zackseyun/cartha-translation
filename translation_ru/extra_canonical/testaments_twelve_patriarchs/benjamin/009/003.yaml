  text: '[3. Καὶ εἰσελεύσεται εἰς τὸν πρῶτον ναόν, καὶ ἐκεῖ Κύριος ὑβρισθήσεται²² *καὶ ἐπὶ ξύλου ὑψωθήσεται²³.]'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/003.yaml
  text: And he will enter into the first temple, and there the Lord will be insulted and will be lifted up on wood.[a]
translation:
  language: ru
  text: '[3. И он войдёт в первый храм, и там Господь подвергнется поруганию и будет вознесён на древе.[a]]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Стихи 3–5 имеют ненадёжное текстовое подтверждение в рукописной традиции и часто считаются позднейшим расширением; здесь они переведены, поскольку присутствуют в предоставленном греческом тексте.
    reason: textual_variant
lexical_decisions:
- source_word: τὸν πρῶτον ναόν
  choice: первый храм
  rationale: Прямо сохраняет порядковое определение πρῶτον и обычное значение ναός в данном контексте.
- source_word: ὑβρισθήσεται
  choice: подвергнется поруганию
  rationale: Передаёт страдательное значение глагола и оттенок оскорбительного, унизительного обращения в естественном для литературного русского языка выражении.
- source_word: ἐπὶ ξύλου ὑψωθήσεται
  choice: будет вознесён на древе
  rationale: Сохраняет буквальный образ ξύλον («дерево, древесина; деревянное орудие») и страдательное «будет вознесён», не заменяя выражение истолковывающим словом «крест».
theological_decisions:
- issue: Референт подразумеваемого подлежащего перед εἰσελεύσεται
  choice: он
  alternative: Господь
  rationale: Греческий текст до слова Κύριος имеет лишь подразумеваемое подлежащее; местоимение «он» сохраняет связь с контекстом, не отождествляя его заранее с Господом.
- issue: Подлежащее второго сказуемого ὑψωθήσεται
  choice: Господь будет вознесён
  alternative: он будет вознесён
  rationale: В русском предложении ближайшее явно названное подлежащее «Господь» естественно относится к обоим однородным страдательным сказуемым, как и в греческом; отдельное местоимение не добавляется.
- issue: Интерпретация ξύλον
  choice: древо
  alternative: крест
  rationale: Выбрано неистолковывающее соответствие, которое сохраняет образ исходного слова и его богословскую многозначность.
translation_notes:
  register: Современный литературный русский с достоинством апокалиптического и религиозного повествования. «Подвергнется поруганию» естественнее буквального пассива «будет оскорблён» в этом торжественном контексте; «на древе» сохраняет традиционно понятный, но не чрезмерно истолковывающий образ. Квадратные скобки исходного издания сохранены как указание на текстуальную неуверенность; сноска [a] помещена в основном тексте.
