base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/002.yaml
  text: Nevertheless, in your allotted portion there will be the temple of God, and the latter will be more glorious than the former; and there the twelve tribes and all the nations will be gathered, until the Most High sends his salvation in the visitation of an only-begotten prophet.
translation:
  language: ru
  text: Однако в вашем уделе будет храм Божий, и последний будет славнее первого. Там соберутся двенадцать колен и все народы, пока Всевышний не пошлёт Своё спасение во время посещения единородного пророка[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «при посещении единственного в своём роде пророка». Греческое выражение допускает разные оттенки: «единородный» может означать также «единственный, уникальный», а «посещение» — особое явление или вмешательство.'
    reason: Поясняет лексическую и синтаксическую неоднозначность ἐν ἐπισκοπῇ μονογενοῦς προφήτου, не разрешая её в основном тексте.
lexical_decisions:
- source_word: ἐν μερίδι ὑμῶν
  choice: в вашем уделе
  rationale: «Удел» естественно передаёт назначенную племени долю земли и сохраняет библейский оттенок выражения.
- source_word: ὁ ἔσχατος … τὸν πρῶτον
  choice: последний … первого
  rationale: Сохраняется буквальное временное противопоставление двух храмов без добавления отсутствующего в греческом тексте пояснения.
- source_word: τὸ σωτήριον αὐτοῦ
  choice: Своё спасение
  rationale: Передаёт субстантивированное «спасительное [деяние/средство]» без сужения смысла до избавителя или конкретного события.
- source_word: ἐν ἐπισκοπῇ
  choice: во время посещения
  rationale: Сохраняет основной смысл божественного или пророческого посещения и не превращает неясную конструкцию в однозначное «явление».
- source_word: μονογενοῦς προφήτου
  choice: единородного пророка
  rationale: Передаёт традиционный и этимологически близкий смысл μονογενής, сохраняя необычность и богословскую напряжённость выражения.
theological_decisions:
- issue: Связь «посещения» с единородным пророком
  choice: во время посещения единородного пророка
  alternative: когда явится единственный в своём роде пророк
  rationale: Родительный падеж в греческом допускает некоторую смысловую неоднозначность; основной текст не уточняет, совершает ли пророк посещение или сам становится его средоточием.
- issue: Значение μονογενής
  choice: единородного
  alternative: единственного в своём роде
  rationale: «Единородный» сохраняет возможный богословский резонанс и не устраняет заложенную в исходном слове двусмысленность между происхождением и уникальностью.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Синтаксис разделён на два предложения ради ясности; перечисление показывает, что и двенадцать колен, и все народы являются подлежащими глагола «соберутся». Фрагмент, обозначенный в источнике как стих 3, не включён, поскольку запрошен только Завет Вениамина 9:2.
