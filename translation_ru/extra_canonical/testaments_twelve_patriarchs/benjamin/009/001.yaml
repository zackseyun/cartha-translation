source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: IX. Λέγω δὲ ὑμῖν καὶ πράξεις ἀπὸ λογίων Ἐνὼχ τοῦ δικαίου, *ὅτι πορνεύ(σ)ετε¹ πορνείαν Σοδόμων καὶ ἀπολε(ῖ)σθε ἕως βραχύ. Καὶ πάλιν ἀνανεωθήσεσθε καὶ ἡ βασιλεία Κυρίου οὐκ ἔσται ἐν ὑμῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/001.yaml
  text: And I tell you also, from the words of Enoch the righteous, that you will commit the fornication of Sodom, and you will perish for a little while. Then you will be renewed again, and the kingdom of the Lord will not be among you.
translation:
  language: ru
  text: 'И ещё говорю вам, опираясь на изречения праведного Еноха: вы предадитесь разврату Содома и на краткое время погибнете. Затем вы вновь обновитесь, но Царства Господа среди вас не будет.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πράξεις ἀπὸ λογίων
  choice: опираясь на изречения
  rationale: Греческое выражение в данном виде необычно; перевод передаёт смысл сообщения, основанного на изречениях Еноха, не воспроизводя неестественную для русского языка конструкцию «дела из изречений».
- source_word: πορνεύ(σ)ετε πορνείαν Σοδόμων
  choice: вы предадитесь разврату Содома
  rationale: Сохраняется усиленная конструкция с однокоренными глаголом и существительным по смыслу; «разврат» естественно и достаточно широко передаёт πορνεία, а родительный «Содома» оставляет характер греха неуточнённым.
- source_word: ἀπολε(ῖ)σθε ἕως βραχύ
  choice: на краткое время погибнете
  rationale: Передаёт временное ограничение ἕως βραχύ и сохраняет напряжение между «погибнете» и последующим обновлением.
- source_word: ἀνανεωθήσεσθε
  choice: вновь обновитесь
  rationale: Передаёт пассивно-возвратный смысл будущего времени и усиление, уже заложенное приставкой ἀνα- и наречием πάλιν.
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: В контексте обращения к группе наиболее естественно означает присутствие Царства в их среде; возможное «в вас» не навязывается.
theological_decisions:
- issue: Соотношение гибели и последующего обновления
  choice: 'Сохранить буквальное напряжение: «погибнете» — «вновь обновитесь»'
  alternative: Ослабить ἀπόλλυμι до «придёте в упадок» или «будете уничтожены»
  rationale: Текст сам соединяет временную гибель с обновлением; перевод не должен заранее объяснять природу этой гибели.
- issue: Значение «разврата Содома»
  choice: Не уточнять конкретный вид греха
  alternative: Передать как определённую сексуальную практику либо как совокупность пороков Содома
  rationale: Греческий текст использует γενитивную конструкцию без дальнейшего определения, поэтому конкретизация была бы толкованием.
- issue: Отрицание присутствия Царства Господа после обновления
  choice: Сохранить союз «но» и прямое отрицание
  alternative: Сгладить кажущееся противоречие или понимать фразу как относящуюся к иному времени
  rationale: Оригинал сохраняет богословское напряжение между обновлением адресатов и отсутствием среди них Царства Господа.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного пророческого обращения. Синтаксис слегка упрощён ради ясности, при этом неоднозначности и резкие смысловые переходы оригинала сохранены.
