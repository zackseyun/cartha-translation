source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Ἐὰν γὰρ˥²⁶ ὑβρίσει²⁷ *ἄνδρα ὅσιον²⁸ μετανοεῖ²⁹, ἐλεεῖ γὰρ ⌈ὁ ὅσιος⌉ τῶν λοιδορούν³⁰ καὶ σιωπᾷ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/004.yaml
  text: For if anyone insults a holy man, he repents; for the holy one has mercy on those who revile him and keeps silent.
translation:
  language: ru
  text: Ведь если кто оскорбит благочестивого человека, то раскается; ибо благочестивый милует тех, кто злословит его, и молчит.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑβρίσει
  choice: оскорбит
  rationale: Передаёт нанесение словесного оскорбления в данном контексте и не вносит неподтверждённой идеи физического насилия.
- source_word: ἄνδρα ὅσιον / ὁ ὅσιος
  choice: благочестивого человека / благочестивый
  rationale: ὅσιος обозначает человека, отличающегося благочестием и верностью Богу; повтор корня сохраняет связь между обеими частями фразы, а «человек» естественно передаёт ἄνδρα без излишнего акцента на поле.
- source_word: μετανοεῖ
  choice: раскается
  rationale: Передаёт перемену отношения, выраженную μετανοέω, в естественной для русского условной конструкции форме.
- source_word: τῶν λοιδορούν
  choice: тех, кто злословит
  rationale: Сохраняет значение поношения и оскорбительной речи, отличая его от более общего недоброжелательства.
- source_word: σιωπᾷ
  choice: молчит
  rationale: Прямо и лаконично передаёт отказ благочестивого отвечать на злословие.
theological_decisions:
- issue: Кто раскаивается после оскорбления
  choice: Подлежащим подразумевается тот, кто оскорбил благочестивого человека.
  alternative: Отнести μετανοεῖ к благочестивому человеку.
  rationale: В условной части естественным подразумеваемым субъектом ὑβρίσει и следующего μετανοεῖ является неопределённое «кто»; последующее явное ὁ ὅσιος вводит благочестивого как отдельного деятеля, который милует и молчит.
- issue: Характер благочестивого человека
  choice: Сохранено нравственно-религиозное обозначение «благочестивый», без отождествления с канонизированным святым.
  alternative: Перевести ὅσιος как «святой».
  rationale: Такой выбор передаёт смысл греческого слова в контексте поведения и не привносит позднейшего конфессионального статуса.
translation_notes:
  register: Современный литературный русский язык; синтаксис сохраняет причинную связь двух частей и афористическую сжатость оригинала. Повтор слова «благочестивый» намеренно отражает повтор ὅσιος.
