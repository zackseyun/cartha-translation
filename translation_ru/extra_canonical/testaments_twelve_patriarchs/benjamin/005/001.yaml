  text: V. Ἐὰν ⸀οὖν καὶ ὑμεῖς¹· ἔχετε² ἀγαθὴν³ ⸀διάνοιαν⁴, καὶ⸃ οἱ πονηροὶ ἄνθρωποι⁵ *εἰρηνεύσουσιν μεθʼ ὑμῶν⁶, καὶ οἱ ἄσωτοι αἰδεσθέντες⁷ ὑμᾶς⁸ ⸀ἐπιστρέψουσιν⁹ εἰς *τὸ ἀγαθόν¹⁰, καὶ οἱ πλεονεκτοῦντες¹¹ οὐ μόνον ἀποστήσονται *τοῦ πάθους¹² ἀλλὰ καὶ *τὰ τῆς¹³ πλεονεξίας *ἃ εἶχον¹⁴ δώσουσιν¹⁵ τοῖς θλιβομένοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/001.yaml
  text: If, then, you also have a good mind, even wicked people will be at peace with you, and the profligate, being put to shame by you, will turn to what is good; and those who are greedy will not only turn away from their passion, but will also give to those in distress the things of greed that they had.
translation:
  language: ru
  text: Итак, если и вы будете иметь добрый образ мыслей, даже злые люди будут жить с вами в мире; распутные, устыдившись перед вами, обратятся к добру, а алчные не только отступятся от своей страсти, но и отдадут бедствующим нажитое алчностью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάνοιαν
  choice: образ мыслей
  rationale: Передаёт внутренний склад ума и нравственную настроенность, не сужая значение до отдельных «намерений».
- source_word: ἄσωτοι
  choice: распутные
  rationale: Обозначает людей нравственно разнузданных или ведущих беспутную жизнь; здесь точнее, чем слишком общее «беззаконные».
- source_word: αἰδεσθέντες ὑμᾶς
  choice: устыдившись вас
  rationale: Сохраняет прямое дополнение греческого выражения и естественно передаёт стыд, вызванный нравственным примером адресатов.
- source_word: πλεονεκτοῦντες
  choice: алчные
  rationale: Передаёт стремление присваивать больше и корыстолюбие без ограничения значения одной только скупостью.
- source_word: τοῦ πάθους
  choice: от своей страсти
  rationale: Сохраняет широкое значение πάθος как владеющей человеком порочной страсти; по контексту она связана с алчностью, но прямо с ней не отождествляется.
- source_word: τὰ τῆς πλεονεξίας ἃ εἶχον
  choice: нажитое алчностью
  rationale: Естественно по-русски передаёт имущество, которым они располагали вследствие алчности, не вводя лишней конкретизации.
- source_word: τοῖς θλιβομένοις
  choice: бедствующим
  rationale: Передаёт людей, находящихся в стеснённых и тяжёлых обстоятельствах, что соответствует контексту материальной помощи.
theological_decisions:
- issue: Связь πάθος с πλεονεξία
  choice: Сохранено более широкое «своя страсть»
  alternative: «страсть к наживе» или «алчность»
  rationale: Хотя контекст связывает страсть с алчностью, греческий текст использует общее πάθος, поэтому перевод не делает неявное отождествление однозначным.
translation_notes:
  register: Современный литературный русский язык с назидательным, но не архаичным звучанием. Синтаксический параллелизм исходного перечисления сохранён; формулировки рассчитаны на ясное чтение обычным современным читателем.
