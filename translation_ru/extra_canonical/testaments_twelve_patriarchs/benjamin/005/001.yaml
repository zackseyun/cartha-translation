review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод точно передаёт условную конструкцию и три следствия: мир со злыми людьми, обращение распутных к добру и отказ алчных от страсти с помощью бедствующим. «Устыдившись вас» в русском языке может означать, что адресаты сами являются предметом стыда, тогда как αἰδεσθέντες ὑμᾶς означает стыд, испытанный перед адресатами / вызванный ими.'
  naturalness: Современный литературный регистр выдержан. Формулировка «если и у вас будет добрый образ мыслей» несколько менее прямолинейна, чем обращённое к адресатам «если и вы будете иметь добрый образ мыслей». «Устыдившись перед вами» естественно и снимает нежелательную двусмысленность.
  terminology: «Добрый образ мыслей» адекватно передаёт διάνοια; «распутные» — ἄσωτοι; «алчные» — πλεονεκτοῦντες; «страсть» сохраняет намеренную широту πάθος. «Нажитое алчностью» приемлемо передаёт имущество, связанное с πλεονεξία, без конфессиональной интерпретации.
  issues:
  - severity: medium
    issue: Двусмысленность выражения «распутные, устыдившись вас»
    rationale: По-русски это может быть понято как «распутные постыдятся вас», то есть будут стыдиться самих адресатов. В греческом αἰδεσθέντες ὑμᾶς адресаты выступают теми, перед кем они испытывают стыд; «устыдившись перед вами» передаёт это яснее.
  - severity: low
    issue: Безличное «если и у вас будет»
    rationale: Греческое ἔχετε непосредственно обращено к «вы». Личная конструкция «если и вы будете иметь» точнее сохраняет адресность и звучит естественно.
  revised_text: Итак, если и вы будете иметь добрый образ мыслей, даже злые люди будут жить с вами в мире; распутные, устыдившись перед вами, обратятся к добру, а алчные не только отступятся от своей страсти, но и отдадут бедствующим нажитое алчностью.
