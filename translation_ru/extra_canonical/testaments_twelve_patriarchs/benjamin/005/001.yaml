  to: Итак, если и вы будете иметь добрый образ мыслей, даже злые люди будут жить с вами в мире; распутные, устыдившись перед вами, обратятся к добру, а алчные не только отступятся от своей страсти, но и отдадут бедствующим нажитое алчностью.
