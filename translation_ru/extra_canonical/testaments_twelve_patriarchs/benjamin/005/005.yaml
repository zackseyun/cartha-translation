source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Κἄν³¹ τις *δίκαιον προδώσει³², *ὁ δίκαιος προσεύχεται· εἰ καὶ πρὸς³³ ὀλίγον ταπεινωθῇ, *μετʼ οὐ³⁴ πολὺ φαιδρότερος³⁵ ἀναφαίνεται, οἷος γέγονεν³⁶ Ἰωσὴφ ὁ ἀδελφός μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/005.yaml
  text: And if anyone betrays a righteous man, the righteous man prays; and even if for a little while he is brought low, before long he reappears far more radiant, as Joseph my brother became.
translation:
  language: ru
  text: И если кто-нибудь предаст[a] праведника, праведник молится. И хотя он ненадолго будет унижен, вскоре он вновь предстанет ещё более сияющим, каким стал Иосиф, брат мой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «выдаст».'
    reason: Греческое προδίδωμι может обозначать как предательство, так и выдачу человека другому лицу или во власть других.
lexical_decisions:
- source_word: προδώσει
  choice: предаст
  rationale: Глагол может означать «предать» или «выдать»; «предаст» естественно передаёт нравственный смысл поступка и соответствует контексту истории Иосифа, а возможный оттенок передачи во власть другого отмечен в сноске.
- source_word: ταπεινωθῇ
  choice: будет унижен
  rationale: Страдательная форма сохраняет мысль о том, что праведника подвергают унижению или низводят в бедственное положение, не уточняя действующее лицо.
- source_word: φαιδρότερος
  choice: ещё более сияющим
  rationale: Сравнительная степень передаёт образ возросшего блеска, славы и благополучия, не сводя его лишь к эмоциональной радости.
- source_word: ἀναφαίνεται
  choice: вновь предстанет
  rationale: Передаёт значение появления после периода унижения и естественно звучит в современном литературном русском языке.
- source_word: οἷος γέγονεν Ἰωσὴφ ὁ ἀδελφός μου
  choice: каким стал Иосиф, брат мой
  rationale: Сохраняет сравнительную конструкцию и прямую связь преображения праведника с судьбой Иосифа.
theological_decisions:
- issue: Ответ праведника на предательство
  choice: «праведник молится» без указания содержания или адресата молитвы
  alternative: Уточнить, что он молится за предателя либо Богу об избавлении
  rationale: Греческий текст сообщает лишь сам факт молитвы; такое изложение сохраняет исходную неопределённость и не вводит богословского уточнения.
- issue: Характер последующего возвышения
  choice: Сохранён образ сияния
  alternative: Передать как «становится славнее» или «обретает большее благополучие»
  rationale: Образное φαιδρότερος допускает несколько смысловых оттенков; буквальный образ сияния сохраняет их совокупность и богословскую напряжённость текста.
translation_notes:
  register: Современный литературный русский с достоинством завещательной речи. Синтаксис упрощён до двух предложений ради ясности, при этом логическая последовательность и образность греческого текста сохранены.
