translation:
  language: ru
  text: Ибо там, где есть страх перед добрыми делами и свет в разуме, тьма бежит от него.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое «от него» не вполне ясно по референту; русское местоимение по грамматическому роду естественнее всего относится к «разуму».
    reason: Уточняет, что греческая неоднозначность не может быть полностью воспроизведена русским местоимением мужского рода, не навязывая окончательного толкования оригиналу.
lexical_decisions:
- source_word: φόβος ἀγαθῶν ἔργων
  choice: страх перед добрыми делами
  rationale: Сохранено прямое и необычное сочетание греческого текста, не заменяя «страх» толковательным «благоговением» и не устраняя смысловое напряжение.
- source_word: φῶς εἰς διάνοιαν
  choice: свет в разуме
  rationale: Греческое εἰς при существительном διάνοιαν здесь естественно передаётся по-русски как нахождение света в сфере разума; формулировка остаётся ясной и близкой к источнику.
- source_word: ἀποδιδράσκει
  choice: бежит
  rationale: Глагол обозначает бегство или поспешное удаление; «бежит» сохраняет образ и звучит естественно.
theological_decisions:
- issue: Значение выражения «страх перед добрыми делами»
  choice: Сохранить буквальную смысловую напряжённость
  alternative: «благоговение перед добрыми делами» или «страх Божий, ведущий к добрым делам»
  rationale: Греческий текст не содержит ни слова «благоговение», ни явного упоминания Бога или причинной связи; уточнение внесло бы в перевод толкование.
- issue: Референт местоимения αὐτοῦ
  choice: Передать местоимением «от него» и отметить неоднозначность
  alternative: «от разума», «от света» или «от такого человека»
  rationale: Источник не называет референт однозначно, поэтому перевод не должен безоговорочно закреплять одно толкование.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным строем. Необычное выражение «страх перед добрыми делами» намеренно сохранено как особенность источника; сноска отмечает местоименную неоднозначность.
