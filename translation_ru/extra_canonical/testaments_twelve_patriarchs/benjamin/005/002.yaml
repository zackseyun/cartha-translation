  text: Ἐὰν ἦτε ἀγαθοποιοῦντες καὶ *τὰ ἀκάθαρτα¹⁶ πνεύματα φεύξονται¹⁷ *ἀφʼ ὑμῶν¹⁸, καὶ¹⁹ τὰ θηρία²⁰ *φοβηθήσονται ὑμᾶς²¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/002.yaml
  text: If you are doing good, even the unclean spirits will flee from you, and the wild beasts will fear you.
translation:
  language: ru
  text: Если будете делать добро, то и нечистые духи убегут от вас, и дикие звери будут бояться вас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοποιοῦντες
  choice: делать добро
  rationale: Передаёт длительное или привычное совершение добра естественным современным русским выражением.
- source_word: τὰ ἀκάθαρτα πνεύματα
  choice: нечистые духи
  rationale: Прямой и устоявшийся эквивалент, сохраняющий религиозный смысл греческого выражения.
- source_word: φεύξονται ἀφʼ ὑμῶν
  choice: убегут от вас
  rationale: Сохраняет конкретную и энергичную образность глагола φεύγω и значение удаления от адресатов.
- source_word: τὰ θηρία
  choice: дикие звери
  rationale: В данном контексте ясно выражает значение опасных недомашних животных.
- source_word: φοβηθήσονται ὑμᾶς
  choice: будут бояться вас
  rationale: Естественно передаёт прямое дополнение при греческом глаголе страха, не усиливая его до «ужасаться».
theological_decisions:
- issue: Связь доброделания с отступлением духов и страхом зверей
  choice: Сохранено прямое условно-следственное утверждение текста
  alternative: Ослабить утверждение словами «могут убежать» или истолковать его исключительно метафорически
  rationale: Греческий текст использует будущие формы без модального смягчения и не обозначает высказывание как метафору.
- issue: Значение καί перед «нечистые духи»
  choice: Передано усилительным «и» в сочетании «то и»
  alternative: Передать как простое соединительное «и» либо «даже»
  rationale: В контексте καί может иметь усилительный оттенок; конструкция «то и» естественна по-русски и сохраняет этот оттенок без чрезмерного уточнения.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской лексикой там, где она остаётся общепонятной. Синтаксис простой и достоинственный; подлинная категоричность греческого условного высказывания сохранена.
