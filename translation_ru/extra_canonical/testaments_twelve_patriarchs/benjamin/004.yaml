base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004.yaml
  text: '1[a]. See then, my children, the outcome of the good man. Imitate the good, because of his compassion, so that you also may wear crowns of glory.


    2. For the good man does not have a darkened eye, for he shows mercy to all, even if they are sinners.


    3[b]. And even if they do not intend good toward him, by doing good he overcomes evil, being sheltered by God. He loves those who wrong him as his own soul.


    4. If anyone is glorified, he does not envy him; if anyone becomes rich, he is not jealous; if anyone is brave, he praises him; he loves the self-controlled man; he has mercy on the poor; he suffers together with the weak; he fears God.


    5. He defends the one who has the fear of the Lord; he helps the one who loves God; by admonishing, he turns back the one who rejects the Most High; and he loves, as his own soul[c], the one who has the grace of a good spirit.'
translation:
  language: ru
  text: '**Завещание Вениамина, глава 4**


    **1.** Итак, дети мои, посмотрите, каков конец доброго человека. Подражайте доброму человеку ради его милосердия[a], чтобы и вы носили венцы славы.


    **2.** Ведь у доброго человека нет помрачённого ока[b]: он милует всех, даже грешников.


    **3.** Даже если ему не желают добра, он, делая добро, побеждает зло, пребывая под Божьим покровом. Тех, кто поступает с ним несправедливо, он любит, как свою душу.


    **4.** Если кого-нибудь прославляют, он ему не завидует; если кто-нибудь богатеет, он не завидует ему; если кто-нибудь отважен, он хвалит его. Он любит владеющего собой, милует бедняка, разделяет страдания немощного и боится Бога.


    **5.** А того, кто обладает благодатью доброго духа[c], он любит, как свою душу.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст после слова «подражайте» не вполне устойчив и допускает разные способы членения. Возможен более буквальный перевод: «подражайте в добром ради его милосердия».'
    reason: textual_variant
  - marker: b
    text: «Помрачённое око» можно также понимать как «злой глаз», то есть завистливый или недоброжелательный взгляд.
    reason: lexical_alternative
  - marker: c
    text: Некоторые текстовые свидетели расширяют это место перечнем добродетельных поступков; предоставленный греческий текст содержит только краткое чтение, переведённое здесь.
    reason: textual_variant
lexical_decisions:
- source_word: τέλος
  choice: конец
  rationale: 'Сохраняет смысловую широту греческого слова: речь может идти как об исходе или итоге жизни доброго человека, так и о его конечной участи. Контекст не требует сужать значение до одного из этих вариантов.'
- source_word: μιμήσασθε
  choice: подражайте ему
  rationale: Прямой повелительный призыв к нравственному подражанию доброму человеку; местоимение естественно восполняет подразумеваемый объект по-русски.
- source_word: εὐσπλαγχνία
  choice: милосердие
  rationale: Передаёт глубокое сердечное сострадание и соответствует этической направленности отрывка.
- source_word: σκοτεινὸν ὀφθαλμόν
  choice: помрачённое око
  rationale: Сохраняет греческий образ и его возможную связь с завистливым, недоброжелательным взглядом, не подменяя образ толкованием.
- source_word: ἐλεεῖ
  choice: милует
  rationale: Передаёт деятельное проявление милости, оставаясь кратким и соответствующим возвышенному нравоучительному регистру.
- source_word: νικᾷ τὸ κακόν
  choice: побеждает зло
  rationale: Точно сохраняет нравственное противопоставление добра и зла без усиления военной образности.
- source_word: σκεπόμενος ὑπὸ τοῦ Θεοῦ
  choice: пребывая под Божьим покровом
  rationale: Естественно передаёт одновременно образ укрытия и смысл Божьей защиты.
- source_word: ἀδικοῦντας
  choice: тех, кто поступает с ним несправедливо
  rationale: Сохраняет значение причиняемой человеку несправедливости, не ограничивая его только прямым оскорблением.
- source_word: σώφρονα
  choice: владеющего собой
  rationale: В перечне добродетелей слово обозначает нравственную сдержанность и самообладание; эта формулировка понятна современному читателю и не сужает значение до полового целомудрия.
- source_word: συμπάσχει
  choice: разделяет страдания
  rationale: Передаёт буквальную силу составного глагола — не только сочувствие, но и участие в страдании другого.
- source_word: χάριν ἀγαθοῦ πνεύματος
  choice: благодать доброго духа
  rationale: Сохраняет богословскую и грамматическую неоднозначность выражения, не решая без достаточных оснований, обозначает ли «дух» божественный дар или нравственное качество.
theological_decisions:
- issue: Значение образа «помрачённое око»
  choice: Образ сохранён в основном тексте без истолкования.
  alternative: «Злой глаз» или «завистливый взгляд».
  rationale: Выражение может обозначать зависть или недоброжелательность, однако ближайший контекст сам раскрывает нравственный смысл через милость и отсутствие зависти.
- issue: Объём стиха 5
  choice: Переведён краткий текст, непосредственно засвидетельствованный в предоставленном греческом источнике.
  alternative: 'Расширенный перечень: защита боящегося Господа, помощь любящему Бога и увещание отвергающего Всевышнего.'
  rationale: Эти расширения присутствуют в консультационном английском слое и некоторых свидетелях, но отсутствуют в предоставленном греческом тексте; поэтому они не внесены в основной перевод.
- issue: Выражение «благодать доброго духа»
  choice: Сохранены строчная форма и неоднозначность принадлежности духа.
  alternative: «Благодать Доброго Духа» как однозначная ссылка на Святого Духа либо «дар доброго нрава».
  rationale: Греческая конструкция сама по себе не требует ни однозначно личностно-пневматологического, ни исключительно нравственно-психологического прочтения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, завещательно-наставительным звучанием. Синтаксис сделан ясным для широкого читателя; сохранены ключевые греческие образы («конец», «помрачённое око», «под Божьим покровом», «как свою душу») и не устранены смысловые и богословские неоднозначности.
