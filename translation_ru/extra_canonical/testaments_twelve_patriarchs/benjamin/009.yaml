base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009.yaml
  text: '1. And I tell you also, from the words of Enoch the righteous, that you will commit the fornication of Sodom, and you will perish for a little while. Then you will be renewed again[b], and the kingdom of the Lord will not be among you. 2. Nevertheless, in your allotted portion there will be the temple of God, and the last will be more glorious than the first; and there the twelve tribes will be gathered, and all the nations, until the Most High sends his salvation in the visitation of an only-begotten prophet.


    3. And he will enter into the first temple, and there the Lord will be treated with outrage, and he will be lifted up on wood. 4. And the curtain-spread of the temple will be torn, and the Spirit of God will pass over to the nations, like fire being poured out. 5. And when he has gone up from Hades, he will pass from earth to heaven. And I know how lowly he will be on earth[e][d][c], and how glorious in heaven.'
translation:
  language: ru
  text: '1. И ещё говорю вам, опираясь на речения праведного Еноха: вы предадитесь содомскому блуду и на недолгое время погибнете. Затем вы вновь обновитесь, и Царства Господа среди вас не будет. 2. Однако в вашем уделе будет храм Бога, и последний будет славнее первого; там соберутся двенадцать колен и все народы, пока Всевышний не пошлёт Своё спасение при посещении единородного пророка[b].


    3.[a] И он войдёт в первый храм, и там Господь подвергнется поруганию и будет вознесён на дереве[c]. 4. И полотнище храма разорвётся[d], а Дух Бога перейдёт к народам, словно изливаемый огонь. 5. И, поднявшись из ада[e], он перейдёт от земли к небу. Я знаю, каким смиренным он будет на земле и каким славным — на небе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Стихи 3–5 имеют не вполне надёжное текстологическое засвидетельствование и нередко считаются позднейшим расширением; здесь они переведены, поскольку присутствуют в предоставленном греческом тексте.
    reason: textual_variant
  - marker: b
    text: 'Возможно также: «при посещении единственного (или уникального) пророка».'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «вознесён на дереве (или на древесине)»; выражение может подразумевать поднятие на деревянном столбе или древе.'
    reason: lexical_alternative
  - marker: d
    text: Греческое слово необычно и буквально обозначает нечто распростёртое, полотнище; вероятно, имеется в виду храмовая завеса.
    reason: lexical_alternative
  - marker: e
    text: Здесь «ад» означает мир мёртвых и не обязательно место окончательного наказания.
    reason: cultural_note
lexical_decisions:
- source_word: πορνεύ(σ)ετε πορνείαν Σοδόμων
  choice: вы предадитесь содомскому блуду
  rationale: Сочетание «предадитесь… блуду» передаёт усиленную конструкцию с однокоренными глаголом и существительным, не создавая неестественного русского повтора; «содомскому» сохраняет прямую аллюзию без уточнения характера греха.
- source_word: ἀπολε(ῖ)σθε ἕως βραχύ
  choice: на недолгое время погибнете
  rationale: Формулировка сохраняет временное ограничение погибели перед последующим обновлением и не превращает выражение в значение «вскоре».
- source_word: ἀνανεωθήσεσθε
  choice: вновь обновитесь
  rationale: Передаёт будущее страдательное значение восстановления/обновления и словесную идею новизны.
- source_word: ἐν μερίδι ὑμῶν
  choice: в вашем уделе
  rationale: «Удел» естественно обозначает племенную территорию и сохраняет смысл распределённого наследия.
- source_word: ὁ ἔσχατος ἔνδοξος ὑπὲρ τὸν πρῶτον
  choice: последний будет славнее первого
  rationale: Сохраняет эллиптическое сопоставление двух храмов или этапов, не добавляя отсутствующего в этой части греческой фразы существительного.
- source_word: τὸ σωτήριον αὐτοῦ
  choice: Своё спасение
  rationale: Сохраняет краткую пророческую формулу и возможный смысл как спасения, так и спасительной помощи.
- source_word: ἐν ἐπισκοπῇ μονογενοῦς προφήτου
  choice: при посещении единородного пророка
  rationale: «Посещение» передаёт ἐπισκοπή как решительное явление/посещение, а «единородного» сохраняет необычную и богословски напряжённую лексику μονογενής; альтернативное значение отмечено в сноске.
- source_word: ὑβρισθήσεται
  choice: подвергнется поруганию
  rationale: Передаёт оскорбительное и насильственное обращение, не уточняя его форму сверх текста.
- source_word: ἐπὶ ξύλου ὑψωθήσεται
  choice: будет вознесён на дереве
  rationale: Буквально сохраняет как многозначность глагола «вознести/поднять», так и ξύλον «дерево, древесина» без немедленной замены на конфессионально истолкованный предмет.
- source_word: τὸ ἅπλωμα τοῦ ναοῦ
  choice: полотнище храма
  rationale: «Полотнище» сохраняет необычность слова ἅπλωμα — чего-либо распростёртого — и не отождествляет его безоговорочно со стандартным термином для храмовой завесы.
- source_word: μεταβήσεται τὸ πνεῦμα τοῦ Θεοῦ ἐπὶ τὰ ἔθνη
  choice: Дух Бога перейдёт к народам
  rationale: Сохраняет выраженное глаголом движение/переход к народам и не заменяет его более истолковывающим «сойдёт».
- source_word: ᾅδου
  choice: ада
  rationale: Традиционный русский эквивалент названия мира мёртвых сохранён, а его возможное ошибочное понимание как исключительно места окончательного наказания исправляется сноской.
- source_word: ταπεινὸς
  choice: смиренным
  rationale: Передаёт низкое, непритязательное положение или облик без искусственного разрешения нюанса между «смиренный» и «уничижённый».
theological_decisions:
- issue: Включение заключённого в скобки материала стихов 3–5
  choice: Стихи включены в основной текст и снабжены текстологической сноской [a].
  alternative: Опустить стихи 3–5 как позднейшее расширение или печатать их отдельно.
  rationale: Они присутствуют в предоставленном греческом тексте, но скобки издания указывают на особый и не вполне надёжный статус; перевод не должен ни скрывать их, ни представлять их историю как бесспорную.
- issue: Значение μονογενοῦς προφήτου
  choice: «единородного пророка»
  alternative: «единственного / уникального пророка»
  rationale: Выбран буквальный и традиционно узнаваемый эквивалент, сохраняющий богословское напряжение необычной фразы; менее онтологически нагруженное значение указано в сноске.
- issue: К кому относится «Господь» в стихе 3
  choice: Сохранено прямое «там Господь подвергнется поруганию».
  alternative: Заменить на «помазанник Господа» или отнести происходящее к пророку.
  rationale: В греческом прямо стоит Κύριος; подмена референта была бы истолкованием и сглаживанием напряжения текста.
- issue: Христологическое прочтение «вознесён на дереве»
  choice: Сохранён буквальный образ без замены словом «крест».
  alternative: Перевести «будет вознесён на кресте».
  rationale: Хотя выражение естественно вызывает христианскую ассоциацию, греческий текст использует ξύλον, а не прямое слово «крест»; буквальная формулировка оставляет аллюзию открытой.
- issue: Движение Духа Бога к народам
  choice: «перейдёт к народам»
  alternative: «сойдёт на язычников» или «будет дан народам».
  rationale: Сохраняется образ перехода, выраженный μεταβαίνω, без догматического уточнения механизма и без сужения πάντα τὰ ἔθνη/τὰ ἔθνη до конфессионального термина.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего пророческого завещания. Синтаксис умеренно торжественный, но понятный; традиционные библейские слова «удел», «колена», «Всевышний», «Дух» сохранены там, где они точны и общеупотребительны. Необычные выражения греческого текста не сглажены без пояснения.
