base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/001.yaml
  text: Now therefore, my children, you also must love the Lord, the God of heaven and earth, and keep his commandments, imitating the good and holy man Joseph.
translation:
  language: ru
  text: Итак, дети мои, и вы любите Господа, Бога неба и земли, и соблюдайте Его заповеди, подражая доброму и святому человеку Иосифу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπήσατε
  choice: любите
  rationale: Повелительная форма передана естественным русским императивом; настоящее видовое значение уместно выражает постоянную установку жизни.
- source_word: φυλάξατε ἐντολὰς αὐτοῦ
  choice: соблюдайте Его заповеди
  rationale: Устойчивое и понятное библейское выражение точно передаёт идею хранения и исполнения заповедей.
- source_word: μιμούμενοι
  choice: подражая
  rationale: Деепричастие сохраняет зависимость от основных призывов и ясно передаёт образец поведения.
- source_word: ἀγαθὸν καὶ ὅσιον
  choice: доброму и святому
  rationale: «Добрый» передаёт нравственную благость ἀγαθός, а «святой» — благочестие и посвящённость, выраженные ὅσιος.
theological_decisions:
- issue: Титул Бога как Владыки творения
  choice: Господа, Бога неба и земли
  alternative: Господа Бога небес и земли
  rationale: Сохранены оба обозначения исходного текста без их слияния; единственное число «неба» соответствует греческому οὐρανοῦ и звучит естественно.
- issue: Характеристика Иосифа словом ὅσιος
  choice: святому
  alternative: благочестивому
  rationale: «Святой» сохраняет религиозно-нравственную силу термина, не добавляя конфессионального толкования; в сочетании «добрый и святой человек» речь ясно идёт о нравственном образце.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Обращение «дети мои» и последовательность увещеваний сохранены; синтаксис сделан плавным и доступным.
