  source_fidelity: 'Перевод точно передаёт основную синтаксическую линию греческого текста: исполнение пророчества, передачу непорочного беззаконниками и смерть безгрешного за нечестивых. ὑπὲρ передано намеренно широко словом «за», без навязывания частного богословского толкования. Заключённое в скобки ἐν αἵματι διαθήκης … καταλύσει … передано как именная целевая конструкция, что возможно для καταλύσει; сноска корректно отмечает альтернативное прочтение как будущей личной формы «уничтожит».'
