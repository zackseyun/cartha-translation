reference: Testament of Benjamin 3:8
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Πληρωθήσεται⁴⁵ *περὶ σοῦ⁴⁶ προφητεία οὐράνιος⁴⁷ [περὶ⁴⁸ τοῦ ἀμνοῦ τοῦ Θεοῦ καὶ σωτῆρος τοῦ κόσμου], ὅτι ἄμωμος ὑπὸ⁴⁹ ἀνόμων παραδοθήσεται καὶ ὁ⁵⁰ ἀναμάρτητος ὑπὲρ ἀσεβῶν ἀποθανεῖται [ἐν αἵματι διαθήκης ἐπὶ σωτηρίᾳ ἐθνῶν καὶ τοῦ⁵¹ Ἰσραὴλ καὶ καταλύσει⁵² *Βελίαρ καὶ τοὺς ὑπηρέτας αὐτοῦ⁵³].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/008.yaml
  text: “The heavenly prophecy concerning you will be fulfilled, [concerning the lamb of God and savior of the world,] for the blameless one will be handed over by lawless men, and the sinless one will die for the ungodly [in the blood of the covenant, for the salvation of the nations and of Israel, and for the destruction of Beliar and his servants].”
translation:
  language: ru
  text: '«О тебе исполнится небесное пророчество — [об Агнце Божьем и Спасителе мира][a]: непорочный будет предан беззаконниками, и безгрешный умрёт за нечестивых — [в крови завета, ради спасения народов и Израиля и уничтожения Велиара и его слуг][b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «об Агнце Божьем и Спасителе мира» в используемом греческом издании заключены в квадратные скобки как текстологически неуверенный фрагмент.
    reason: Нужно явно обозначить статус фрагмента, отмеченный в исходном издании.
  - marker: b
    text: 'Весь заключительный фрагмент, начиная со слов «в крови завета», в используемом греческом издании заключён в квадратные скобки; его греческий синтаксис также допускает иное понимание концовки: «и уничтожит Велиара и его слуг».'
    reason: Сохраняет текстологическую и синтаксическую неопределённость исходного текста.
lexical_decisions:
- source_word: προφητεία οὐράνιος
  choice: небесное пророчество
  rationale: Прямо передаёт греческое словосочетание, сохраняя его возвышенный и несколько загадочный характер.
- source_word: ἄμωμος
  choice: непорочный
  rationale: Передаёт отсутствие порока или изъяна и сохраняет возможный жертвенный оттенок слова.
- source_word: ἀνόμων
  choice: беззаконниками
  rationale: Сохраняет связь с нарушением закона, не сводя значение просто к общей порочности.
- source_word: ὁ ἀναμάρτητος
  choice: безгрешный
  rationale: Точно передаёт значение отсутствия греха и субстантивированное употребление прилагательного.
- source_word: ὑπὲρ ἀσεβῶν
  choice: за нечестивых
  rationale: Предлог ὑπέρ здесь естественно означает действие ради или в пользу нечестивых; русский оборот сохраняет также богословскую ёмкость оригинала.
- source_word: ἐν αἵματι διαθήκης
  choice: в крови завета
  rationale: Формально сохраняет предлог ἐν и устойчивую библейскую образность, не уточняя сверх текста, идёт ли речь о средстве, сфере или основании.
- source_word: ἐθνῶν
  choice: народов
  rationale: В данном контексте это естественная передача, сохраняющая противопоставление народов Израилю без добавления слова «язычники».
- source_word: Βελίαρ
  choice: Велиара
  rationale: Сохраняет форму имени, представленную в источнике, с необходимым русским падежным окончанием.
theological_decisions:
- issue: Отнесение пророчества к Агнцу Божьему и Спасителю мира
  choice: Фраза сохранена в квадратных скобках
  alternative: Включить её в основной текст без скобок или исключить
  rationale: Издание источника отмечает этот фрагмент скобками; перевод не должен скрывать текстологическую неуверенность или превращать спорное чтение в бесспорное.
- issue: Значение смерти ὑπὲρ ἀσεβῶν
  choice: «умрёт за нечестивых»
  alternative: «умрёт вместо нечестивых» или «ради нечестивых»
  rationale: Русское «за» сохраняет широту ὑπέρ и не навязывает исключительно заместительное либо исключительно благотворное толкование.
- issue: Финальная фраза о крови завета, спасении и уничтожении Велиара
  choice: Сохранена в квадратных скобках и передана как целевая конструкция
  alternative: 'Считать καταλύσει личной формой глагола: «и уничтожит Велиара и его слуг»'
  rationale: Синтаксис греческого места неровен, а консультационный английский слой понимает καταλύσει как существительное «уничтожение». Выбранный вариант согласуется с ἐπὶ σωτηρίᾳ и сохраняет параллельные цели, не устраняя текстологической сложности.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. Конструкция остаётся понятной широкому читателю; архаизмы избегаются, кроме укоренённых слов «Агнец», «завет», «нечестивые», уместных в данном жанре. Квадратные скобки исходного издания сохранены, а сноски вынесены сразу после соответствующих фрагментов.
