revisions:
- from: И пусть ваши мысли будут устремлены к добру, как, вы знаете, устремлены мои. Ведь тот, чьи мысли праведны, всё видит верно.
  to: Пусть ваши мысли будут устремлены к добру, как вы знаете, устремлены и мои. Ведь тот, кто мыслит здраво, всё видит верно.
  rationale: Убрано чрезмерно специализированное «праведны»; «мыслит здраво» естественно выражает обладание правильной διάνοια и не навязывает конфессионального толкования. Первая фраза стилистически выправлена при сохранении настоящего подразумеваемого сказуемого и сопоставления с мыслями говорящего.
