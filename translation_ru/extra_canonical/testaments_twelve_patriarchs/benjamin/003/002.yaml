  text: Καὶ ἔστω ἡ διάνοια ὑμῶν *εἰς τὸ ἀγαθόν⁶, ὡς κἀμὲ οἴδατε⁷. Ὅτι⁸ ὁ ἔχων τὴν⁹ διάνοιαν ὀρθὴν¹⁰ πάντα βλέπει ὀρθῶς¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/002.yaml
  text: And let your mind be set on what is good, as you know mine is. For the one who has a right mind sees everything rightly.
translation:
  language: ru
  text: Пусть ваши мысли будут устремлены к добру, как вы знаете, устремлены и мои. Ведь тот, кто мыслит здраво, всё видит верно.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάνοια
  choice: мысли
  rationale: В обоих случаях передаёт направленность и внутренний строй мышления; повтор сохраняет связь между двумя предложениями.
- source_word: εἰς τὸ ἀγαθόν
  choice: устремлены к добру
  rationale: Передаёт направленность, выраженную εἰς, естественным современным русским оборотом.
- source_word: ὀρθὴν / ὀρθῶς
  choice: праведны / верно
  rationale: 'Сохраняет смысловую игру однокоренных греческих слов настолько, насколько это допускает естественный русский: внутренне правильный, нравственно прямой строй мысли ведёт к верному восприятию.'
theological_decisions:
- issue: Значение ὀρθός в описании διάνοια
  choice: праведны
  alternative: правильны / прямы
  rationale: В данном нравственном наставлении слово обозначает не просто интеллектуальную безошибочность, а внутреннюю нравственную прямоту; при этом заключительное ὀρθῶς естественно передано как «верно».
translation_notes:
  register: Современный литературный русский, ясный и наставительный. Формулировка «как, вы знаете, устремлены мои» восполняет подразумеваемое греческое сказуемое и сохраняет настоящее значение κἀμὲ οἴδατε.
