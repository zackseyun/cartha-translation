base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/006.yaml
  text: For Joseph also begged our father to pray for his brothers, so that the Lord would not reckon sin to them, because they had done evil against him.
translation:
  language: ru
  text: Ведь и Иосиф просил нашего отца помолиться за своих братьев, чтобы Господь не вменил им греха за то, что они причинили ему зло.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεήθη
  choice: просил
  rationale: Передаёт настойчивую просьбу естественным современным русским языком без излишнего усиления.
- source_word: τοῦ πατρὸς ἡμῶν
  choice: нашего отца
  rationale: Сохраняет форму первого лица множественного числа и семейную перспективу повествователя.
- source_word: προσεύξηται ὑπὲρ τῶν ἀδελφῶν αὐτοῦ
  choice: помолиться за своих братьев
  rationale: Прямо и естественно передаёт ходатайственную молитву; «своих» ясно соотносится с Иосифом.
- source_word: λογίσηται ... αὐτοῖς ἁμαρτίαν
  choice: не вменил им греха
  rationale: Сохраняет судебно-счётный оттенок λογίζομαι и традиционно понятную библейскую формулировку.
- source_word: ἐποίησαν πονηρὸν εἰς αὐτόν
  choice: причинили ему зло
  rationale: Идиоматично передаёт совершённое против Иосифа зло, не конкретизируя его сверх греческого текста.
theological_decisions:
- issue: Субъект невменения греха
  choice: Господь
  alternative: Бог
  rationale: Следует засвидетельствованному чтению Κύριος и не заменяет титул интерпретирующим эквивалентом.
- issue: Характер просьбы Иосифа
  choice: молитва отца за братьев
  alternative: прощение Иосифом братьев
  rationale: Текст говорит именно о ходатайстве перед Господом; личное прощение Иосифа здесь прямо не утверждается.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Формула «вменил им греха» сохранена ради точности и богословской напряжённости исходного текста; синтаксис сделан естественным для широкого читателя.
