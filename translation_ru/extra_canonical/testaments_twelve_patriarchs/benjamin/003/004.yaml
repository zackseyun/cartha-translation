source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Πόσοι¹⁸ τῶν ἀνθρώπων *ἤθελον αὐτὸν ἀνελεῖν¹⁹, καὶ ὁ Θεὸς ἐσκέπασεν αὐτόν²⁰· ὁ γὰρ φοβούμενος τὸν Θεὸν καὶ ἀγαπῶν τὸν πλησίον²¹ ὑπὸ *τοῦ πνεύματος²² τοῦ Βελίαρ οὐ δύναται πληγῆναι, σκεπαζόμενος²³ ὑπὸ τοῦ φόβου τοῦ Θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/004.yaml
  text: How many men wanted to kill him, and God sheltered him; for the one who fears God and loves his neighbor cannot be struck by the spirit of Beliar, being sheltered by the fear of God.
translation:
  language: ru
  text: Сколь многие из людей хотели убить его, и Бог укрыл его; ибо тот, кто боится Бога и любит ближнего, не может быть поражён духом Велиара, будучи укрыт страхом Божьим.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πόσοι τῶν ἀνθρώπων
  choice: Сколько людей
  rationale: Естественно передаёт восклицательное указание на многочисленность желавших его смерти, не добавляя отсутствующего в греческом точного числа.
- source_word: ἀνελεῖν
  choice: убить
  rationale: В данном контексте инфинитив означает лишение жизни; современное и ясное русское соответствие.
- source_word: ἐσκέπασεν / σκεπαζόμενος
  choice: укрывал / служит ему укрытием
  rationale: Сохраняется общий образ покрова и защиты. Имперфектное «укрывал» отражает греческий аорист в повествовательном контексте без неестественной буквальности, а финальная конструкция естественно передаёт причастие.
- source_word: φοβούμενος τὸν Θεὸν
  choice: боится Бога
  rationale: Сохраняет традиционный и контекстуально значимый язык богобоязненности без перетолкования как простого уважения.
- source_word: τὸν πλησίον
  choice: ближнего
  rationale: Устоявшийся русский библейский эквивалент, понятный современному читателю.
- source_word: πληγῆναι
  choice: быть поражён
  rationale: 'Сохраняет пассивность и некоторую широту греческого глагола: речь может идти об ударе, вреде или поражении, а не обязательно о физической ране.'
- source_word: Βελίαρ
  choice: Велиара
  rationale: Передаёт форму имени Βελίαρ, засвидетельствованную именно в исходном тексте, без замены на более привычное «Велиал».
theological_decisions:
- issue: Характер защиты богобоязненного человека
  choice: не может быть поражён духом Велиара
  alternative: дух Велиара не может нанести ему удар
  rationale: Сохранена сильная модальная формулировка οὐ δύναται и пассивная конструкция исходника, без уточнения природы поражения.
- issue: Связь страха Божьего с защитой
  choice: страх Божий служит ему укрытием
  alternative: он укрыт страхом Божьим
  rationale: Передаёт причинно-обстоятельственное причастие σκεπαζόμενος и образ защитного покрова, не устраняя богословское напряжение выражения «укрыт страхом».
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис источника сохранён в двух связанных частях, но финальное пассивное причастие передано более естественной русской конструкцией. Союз καί передан контрастным «но», поскольку в русском контекст противопоставляет намерение людей Божьей защите; это функциональное, а не догматическое уточнение.
