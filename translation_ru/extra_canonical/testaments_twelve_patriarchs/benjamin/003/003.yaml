source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Φοβεῖσθε¹² Κύριον καὶ ἀγαπᾶτε τὸν πλησίον¹³, καὶ ἐὰν τὰ πνεύματα τοῦ Βελίαρ εἰς πᾶσαν πονηρίαν θλίψεως ἐκστήσωσι¹⁴ ὑμᾶς, οὐ μὴ *κατακυριεύσωσιν ὑμῶν¹⁵, *ὡς οὔτε¹⁶ Ἰωσὴφ *τὸν ἀδελφόν¹⁷ μου.
