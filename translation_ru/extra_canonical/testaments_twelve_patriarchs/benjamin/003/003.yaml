revisions:
- from: Бойтесь Господа и любите ближнего. И даже если духи Велиара ввергнут вас во всевозможные тяжкие беды, они ни за что не завладеют вами, как не завладели и моим братом Иосифом.
  to: Бойтесь Господа и любите ближнего; если духи Велиара ввергнут вас во всякое пагубное бедствие, они ни за что не будут господствовать над вами, как не господствовали над моим братом Иосифом.
  rationale: 'Исправлены три точечных расхождения с греческим текстом: восстановлена отрицательная характеристика πονηρίαν, устранено добавочное «даже» и «завладеют» заменено на «будут господствовать». Эллипсис в заключительном сравнении восполнен тем же глаголом, как и в английском аудиторском следе. Отдельные сноски не добавлены: в проекте нет содержания для маркеров исходного издания, а самостоятельное создание текстологических примечаний было бы спекулятивным.'
