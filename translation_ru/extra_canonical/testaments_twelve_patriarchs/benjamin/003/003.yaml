base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/003.yaml
  text: Fear the Lord and love your neighbor; and if the spirits of Beliar should drive you into every evil affliction, they will certainly not rule over you, just as they did not over Joseph my brother.
translation:
  language: ru
  text: Бойтесь Господа и любите ближнего; если духи Велиара ввергнут вас во всякое пагубное бедствие, они ни за что не будут господствовать над вами, как не господствовали над моим братом Иосифом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φοβεῖσθε Κύριον
  choice: Бойтесь Господа
  rationale: Передаёт обычное библейское значение благоговейного страха перед Господом без ослабления исходного повеления.
- source_word: ἀγαπᾶτε τὸν πλησίον
  choice: любите ближнего
  rationale: Естественная и узнаваемая русская передача; определённый артикль не требует притяжательного местоимения.
- source_word: τὰ πνεύματα τοῦ Βελίαρ
  choice: духи Велиара
  rationale: Сохраняет личное имя Βελίαρ и зависимость духов от него, не подменяя имя толкованием.
- source_word: εἰς πᾶσαν πονηρίαν θλίψεως
  choice: во всевозможные тяжкие беды
  rationale: Греческое сочетание синтаксически шероховато. Перевод естественно выражает широкий охват πᾶσαν, бедственный характер θλίψεως и отрицательную окраску πονηρίαν, не превращая её в нравственную вину адресатов.
- source_word: ἐκστήσωσι ὑμᾶς
  choice: ввергнут вас
  rationale: Передаёт насильственное выведение из устойчивого состояния и хорошо сочетается с последующим обозначением бед.
- source_word: οὐ μὴ κατακυριεύσωσιν ὑμῶν
  choice: они ни за что не завладеют вами
  rationale: «Ни за что не» отражает усиленное отрицание οὐ μή, а «завладеют» — властное господство κατακυριεύω.
- source_word: ὡς οὔτε Ἰωσὴφ τὸν ἀδελφόν μου
  choice: как не завладели и моим братом Иосифом
  rationale: Восстанавливает подразумеваемый глагол из предыдущей части и передаёт Иосифа как объект господства; это соответствует контексту и принятому исправлению текста.
theological_decisions:
- issue: Соотношение внешнего бедствия и власти злых духов
  choice: 'Сохранено различие: духи могут ввергнуть людей в беды, но не завладеть ими.'
  alternative: Сказать, что духи вообще не смогут причинить им зло.
  rationale: Исходный текст допускает тяжёлое испытание, но решительно отрицает окончательное господство духов; сглаживание уничтожило бы эту богословскую напряжённость.
- issue: Значение «бояться Господа»
  choice: Сохранено прямое «бойтесь».
  alternative: «Почитайте Господа» или «благоговейте перед Господом».
  rationale: Прямая передача не исключает благоговения, но и не ослабляет мотив страха, присутствующий в φοβεῖσθε.
translation_notes:
  register: Современный литературный русский с библейской торжественностью, но без архаизмов. Два повеления переданы кратко и параллельно; усиленное обещание выражено разговорно понятным, но достойным оборотом «ни за что не».
