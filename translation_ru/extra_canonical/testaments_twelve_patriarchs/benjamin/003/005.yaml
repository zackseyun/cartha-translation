  text: Καὶ ἀπὸ²⁴ ἐπιβουλῆς ἀνθρώπων ἢ θηρίων οὐ δύναται κυριευθῆναι²⁸, βοηθούμενος *†ζῆν ἀπ᾽ αὐτῆς† ὑπὸ τῆς ἀγάπης²⁹ ἧς³⁰ ἔχει πρὸς τὸν πλησίον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/005.yaml
  text: And he cannot be mastered by the plots of men or of beasts, being helped †to live from it† by the love which he has toward his neighbor.
translation:
  language: ru
  text: И его не могут одолеть ни козни людей, ни звери, ибо он получает помощь от любви, которую питает к ближнему, †жить благодаря ей†.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст слов «жить благодаря ей» испорчен; точный первоначальный смысл неизвестен.
    reason: Читателю необходимо сообщить о подлинной текстологической неопределённости, отмеченной в исходном издании крестами.
lexical_decisions:
- source_word: ἐπιβουλῆς
  choice: козни
  rationale: Передаёт злонамеренный умысел или заговор естественным современным русским словом; конструкция перестроена, чтобы избежать неясного сочетания «козни зверей».
- source_word: κυριευθῆναι
  choice: одолеть
  rationale: Сохраняет смысл подчинения чужой власти или превосходящей силе и естественно сочетается как с кознями людей, так и со зверями.
- source_word: ἀγάπης … πρὸς τὸν πλησίον
  choice: любовь, которую он питает к ближнему
  rationale: Точно передаёт направленность любви к другому человеку и звучит естественно и достойно по-русски.
- source_word: ὑπὸ τῆς ἀγάπης
  choice: любовь … помогает ему
  rationale: 'Греческая пассивная конструкция «получая помощь от любви» преобразована в естественную русскую активную без изменения действующего начала: помощь исходит от любви, а не явно от Господа.'
theological_decisions:
- issue: Кто оказывает помощь
  choice: Помогающей силой названа любовь к ближнему.
  alternative: «Господь помогает ему через любовь к ближнему».
  rationale: В представленном греческом тексте действующее начало выражено словами ὑπὸ τῆς ἀγάπης («любовью / от любви»); слова «Господь» в нём нет, поэтому оно не добавлено.
- issue: Неясное чтение ζῆν ἀπ᾽ αὐτῆς
  choice: Сохранено как «†жить благодаря ей†» с обозначением испорченного места.
  alternative: Опустить неясные слова либо исправить их предположительно.
  rationale: Источник прямо отмечает выражение крестами как текстуально сомнительное. Перевод сохраняет доступный буквальный смысл, не выдавая предположение за установленный текст.
translation_notes:
  register: 'Современный литературный русский язык с достоинством завещательной речи. Синтаксис слегка перестроен ради ясности: «ни козни людей, ни звери» позволяет не приписывать зверям буквально продуманные заговоры. Текстологическая трудность сохранена видимыми крестами и пояснена сноской.'
