  text: And thus Jacob cried out, “O good child, you have stirred the inward affection of Jacob your father”; and embracing him, he kept kissing him for two hours, saying,
translation:
  language: ru
  text: 'Так Иаков воскликнул: «О доброе дитя, ты покорил чувства Иакова, твоего отца!» И, обняв его, он два часа не переставал целовать его, говоря:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως ἐβόα
  choice: тогда Иаков воскликнул
  rationale: Передаёт громкое, эмоциональное восклицание; οὕτως здесь естественно связывается с последующей прямой речью.
- source_word: τέκνον χρηστόν
  choice: доброе дитя
  rationale: Сохраняет прямое обращение и положительную нравственную характеристику χρηστόν без излишней конфессиональной окраски.
- source_word: ἐνίκησας τὰ σπλάγχνα
  choice: ты одолел сердце
  rationale: Буквально образ связан с внутренностями как средоточием глубоких чувств; русское «сердце» естественно передаёт этот антропологический образ, а «одолел» сохраняет метафору победы в ἐνίκησας.
- source_word: περιλαβών
  choice: обняв
  rationale: Прямое и естественное соответствие причастию со значением охватить руками.
- source_word: ἐπὶ δύο ὥρας κατεφίλει
  choice: два часа не переставал целовать
  rationale: Передаёт длительность ἐπὶ δύο ὥρας и повторно-продолжительный оттенок κατεφίλει.
theological_decisions:
- issue: Образ τὰ σπλάγχνα как вместилища глубокой привязанности
  choice: сердце
  alternative: внутренности / глубины души / отцовские чувства
  rationale: «Сердце» в современном литературном русском сохраняет образ внутреннего центра чувств; перевод не уточняет природу переживания сверх того, что выражено греческим текстом.
translation_notes:
  register: Современный литературный русский с dignified повествовательным тоном. Эмоциональная интенсивность сохранена без архаизмов; финальное «говоря» оставляет синтаксическое продолжение стиха открытым.
