base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011.yaml
  text: '1 No longer shall I be called a ravening wolf because of your ravaging[a], but a worker of the Lord, distributing food to those who do what is good.

    2 And in the last times there shall arise from my seed one beloved of the Lord, hearing his voice and doing the good pleasure of his will, enlightening all the nations with new knowledge, entering upon Israel in salvation, and snatching away from them as a wolf, and giving to the gathering of the nations.

    3 Until the consummation of the age he shall be in the assemblies of the nations and among their rulers, like a musical strain in the mouth of all.

    4 And in holy books he shall be recorded, both his work and his word; and he shall be God''s chosen one forever.

    5 And through him he shall pass through again as Jacob my father, saying[e][d][c][b], “He will fill up what is lacking in your tribe.”'
translation:
  language: ru
  text: '1 И уже не назовут меня хищным волком за ваши грабежи[a], но — тружеником Господа, раздающим пищу тем, кто делает добро.


    2 И в последние времена восстанет возлюбленный Господа, из потомства Иуды и Левия[b], творящий благоволение устами своими, просвещающий все народы новым знанием — светом знания; он приступит к Израилю со спасением[c], будет, словно волк, похищать у них и отдавать собранию народов.


    3 До завершения века он будет пребывать в собраниях народов и среди их правителей, словно напев на устах у всех.


    4 И будет записан он в священных книгах — и дело его, и слово его; и будет он избранником Божьим вовеки.


    5 И через них он будет приходить, как Иаков, отец мой, говоря[d]: «Он восполнит то, чего недостаёт твоему колену».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст этой главы, особенно стиха 2, текстологически труден: в нём заметны расширения и частично повторяющиеся выражения. Перевод следует представленному греческому свидетельству и не устраняет его неясностей.'
    reason: textual_variant
  - marker: b
    text: Слова «из потомства Иуды и Левия» присутствуют в представленном греческом тексте; иная текстовая традиция связывает будущую фигуру с потомством самого Вениамина.
    reason: textual_variant
  - marker: c
    text: 'Трудный греческий оборот может также означать: «вступит на Израиль со спасением» или «вмешается в судьбу Израиля со спасением».'
    reason: lexical_alternative
  - marker: d
    text: Заключительная фраза неясна. Греческое «через них» имеет множественное число, его отнесение спорно, а глагол может означать также «посещать» или «ходить».
    reason: textual_variant
lexical_decisions:
- source_word: λύκος ἅρπαξ / ἁρπαγάς
  choice: хищный волк / грабежи
  rationale: Сохраняется образ волка и смысл насильственного присвоения; полную однокоренную игру по-русски естественно передать невозможно.
- source_word: ἐργάτης Κυρίου
  choice: труженик Господа
  rationale: Передаёт конкретное значение работника или трудящегося и сохраняет противопоставление хищнику.
- source_word: ἐργαζομένοις τὸ ἀγαθόν
  choice: тем, кто делает добро
  rationale: Прямо передаёт действие ἐργάζομαι с объектом τὸ ἀγαθόν, не превращая выражение в отвлечённое нравственное качество.
- source_word: ἀγαπητὸς Κυρίου
  choice: возлюбленный Господа
  rationale: Точное и достойное по регистру обозначение человека, любимого Господом.
- source_word: γνῶσιν καινὴν φωτίζων πάντα τὰ ἔθνη / φῶς γνώσεως
  choice: просвещающий все народы новым знанием — светом знания
  rationale: Сохранены обе близкие формулы наличного греческого текста и заметная между ними смысловая избыточность.
- source_word: ἐπεμβαίνων τὸν Ἰσραὴλ ἐν σωτηρίᾳ
  choice: придёт к Израилю со спасением
  rationale: Естественно по-русски передаёт трудную конструкцию со значением приближения или вмешательства, не уточняя, кому именно предназначено спасение.
- source_word: συναγωγή / συναγωγαί
  choice: собрание / собрания
  rationale: Передаёт коллективный смысл без анахронического отождествления с позднейшими церковными структурами или исключительно иудейскими синагогами.
- source_word: συντέλεια τοῦ αἰῶνος
  choice: завершение века
  rationale: Сохраняет эсхатологический оттенок и буквальный образ доведения века до полноты.
- source_word: φοιτήσει
  choice: будет приходить
  rationale: Глагол допускает значения хождения, посещения и появления; выбранное выражение сохраняет неопределённость направления.
- source_word: τὰ ὑστερήματα τῆς φυλῆς σου
  choice: то, чего недостаёт твоему колену
  rationale: Передаёт идею недостатка, который будет восполнен, а φυλή в родовом контексте переводится как «колено».
theological_decisions:
- issue: Происхождение будущего возлюбленного Господа
  choice: из потомства Иуды и Левия
  alternative: из моего потомства / из потомства Вениамина
  rationale: В предоставленном греческом тексте прямо названы Иуда и Левий. Возможную сложную историю редакции нельзя устранять заменой на вениаминово происхождение.
- issue: Образ будущей фигуры в стихах 2–5
  choice: Сохранить возвышенные пророческие определения без прямого именования фигуры Мессией
  alternative: Явно назвать её Мессией либо только племенным вождём
  rationale: Греческий текст называет её возлюбленным Господа и избранником Божьим, но не даёт однозначного титула, поэтому богословская идентификация оставлена открытой.
- issue: ἔθνη
  choice: народы
  alternative: язычники
  rationale: «Народы» сохраняет широкий коллективный смысл и не навязывает позднейшее конфессиональное противопоставление.
- issue: Неясный субъект и референт в стихе 5
  choice: Сохранить «через них он» без уточняющей подстановки
  alternative: «через него он» или явное отождествление местоимений с книгами, делами либо будущей фигурой
  rationale: Форма αὐτῶν множественная, а субъект φοιτήσει не выражен; уточнение разрешило бы подлинную неясность текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным завещательно-пророческим звучанием. Синтаксис сделан понятным для обычного читателя, но повторы, невыраженные объекты и местоименная неясность греческого текста не сглажены богословскими догадками.
