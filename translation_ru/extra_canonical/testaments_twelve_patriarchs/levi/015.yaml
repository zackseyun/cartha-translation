base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015.yaml
  text: Therefore the temple which the Lord will choose will become desolate in your uncleanness[a], and you will be taken captive among all the nations. And you will be an abomination to them, and you will receive reproach and everlasting shame from the righteous judgment of God. And all who hate you will rejoice over your destruction. And if it were not for Abraham and Isaac and Jacob our fathers, you would receive no mercy[b][c]; not one from your seed would be left upon the earth.
translation:
  language: ru
  text: 15:1 Поэтому храм[a], который изберёт Господь, опустеет в вашей нечистоте[b], а вы окажетесь в плену среди всех народов. 2 Вы станете для них мерзостью и по праведному суду Бога[c] подвергнетесь поношению и вечному позору. 3 Все ненавидящие вас будут радоваться вашей гибели. 4 И если бы не Авраам, Исаак и Иаков, наши отцы, вы не получили бы милости, и ни одного из вашего семени[d] не осталось бы на земле.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «святилище». Греческое ναός обозначает святую часть храма или храм как святыню.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «в вашей нечистоте»; выражение может указывать как на сопутствующее обстоятельство, так и на причину запустения.'
    reason: source_ambiguity
  - marker: c
    text: 'Или: «справедливому суду Бога».'
    reason: lexical_alternative
  - marker: d
    text: То есть из вашего потомства. Греческий текст буквально говорит «из вашего семени», сохраняя язык родовой и заветной преемственности.
    reason: lexical_alternative
lexical_decisions:
- source_word: ναός
  choice: храм
  rationale: В данном иудейском контексте слово обозначает избранный Богом святой храм; «храм» естественно и точно передаёт смысл, тогда как «святилище» возможно как более узкий вариант.
- source_word: ἐκλέξεται
  choice: изберёт
  rationale: Будущее время передаёт избрание Господом места богослужения; «изберёт» сохраняет библейский и заветный оттенок без излишней архаики.
- source_word: ἔρημος ἔσται
  choice: опустеет
  rationale: Кратко передаёт состояние запустения и оставленности как следствие суда.
- source_word: ἐν τῇ ἀκαθαρσίᾳ ὑμῶν
  choice: при вашей нечистоте
  rationale: Предлог ἐν буквально означает «в», но здесь допускает обстоятельственный или причинный оттенок. «При вашей нечистоте» сохраняет эту неоднозначность лучше, чем однозначное «из-за».
- source_word: αἰχμάλωτοι ἔσεσθε εἰς πάντα τὰ ἔθνη
  choice: вы окажетесь в плену среди всех народов
  rationale: Формулировка естественно передаёт пленение и рассеяние по народам, не добавляя конкретного механизма изгнания.
- source_word: βδέλυγμα
  choice: мерзость
  rationale: Сохраняет сильную лексику отвращения и библейскую окраску греческого слова.
- source_word: ὄνειδος καὶ αἰσχύνην αἰώνιον
  choice: поношение и вечный позор
  rationale: «Поношение» передаёт публичное бесчестие, а «вечный позор» — длительный и тяжёлый характер стыда.
- source_word: δικαιοκρισίας
  choice: праведный суд
  rationale: Сложное слово характеризует Божий суд как праведный; вариант «справедливый суд» также лексически возможен.
- source_word: ἀπωλείᾳ
  choice: гибель
  rationale: В контексте речь идёт о падении и уничтожении общины; «гибель» звучит естественно и не навязывает позднейших представлений о погибели.
- source_word: ἔλεος λήψεσθε
  choice: получили милость
  rationale: Передаёт милость как даруемое избавление и сохраняет условную конструкцию греческого текста.
- source_word: σπέρματος
  choice: семени
  rationale: Буквальный заветный термин сохранён в основном тексте; более гладкое «потомства» отмечено в сноске.
- source_word: οὐ μὴ καταλειφθῇ
  choice: ни одного ... не осталось бы
  rationale: Русская отрицательная конструкция передаёт усиленное греческое отрицание и полноту угрожающего истребления.
theological_decisions:
- issue: Милость ради Авраама, Исаака и Иакова
  choice: 'Условие передано прямо: без милости, полученной ради праотцов, никто из потомства не уцелел бы.'
  alternative: Истолковать праотцов лишь как нравственные примеры или устранить их заветную роль.
  rationale: Греческое δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ непосредственно связывает получение милости с праотцами. Перевод сохраняет эту богословскую напряжённость, не объясняя её в терминах какой-либо конфессии.
- issue: Характер «вечного позора»
  choice: Сохранено выражение «вечный позор» без уточнения, исторический это суд или эсхатологический.
  alternative: Ограничить выражение временным национальным бесчестием либо истолковать как окончательное эсхатологическое осуждение.
  rationale: αἰώνιον выражает продолжительность и тяжесть позора, но сам отрывок не даёт оснований однозначно систематизировать его смысл.
- issue: Связь запустения храма с нечистотой адресатов
  choice: Переведено «при вашей нечистоте» с пояснением буквального значения предлога.
  alternative: Однозначно причинное «из-за вашей нечистоты» или строго пространственное «в вашей нечистоте».
  rationale: Греческое ἐν допускает более одного оттенка; перевод не должен скрыто устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский с торжественной пророческой интонацией. Синтаксис сделан ясным для широкого читателя, но сохранены сильные образы суда, заветная лексика «семени» и неоднозначность оборота с ἐν.
