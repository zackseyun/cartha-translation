  text: And their father said to them, “The Lord is witness, and his angels are witnesses, and you are witnesses, and I am a witness concerning the word of your mouth.” And his sons said to him, “We are witnesses.”
translation:
  language: ru
  text: 'И сказал им их отец: «Господь — свидетель, и Его ангелы — свидетели, и вы — свидетели, и я — свидетель о слове ваших уст». И сказали ему его сыновья: «Мы — свидетели».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάρτυς / μάρτυρες
  choice: свидетель / свидетели
  rationale: Прямо передаёт юридически окрашенный язык свидетельства и сохраняет повтор, значимый для торжественности высказывания.
- source_word: περὶ τοῦ λόγου τοῦ στόματος ὑμῶν
  choice: слов ваших уст
  rationale: Сохраняет семитизированную образность греческого выражения и его собирательный смысл; форма «слов» естественнее по-русски в данном контексте.
- source_word: κύριος
  choice: Господь
  rationale: Обычный и контекстуально уместный русский эквивалент титула κύριος.
theological_decisions:
- issue: Свидетельство Господа, ангелов и людей
  choice: Сохранён параллельный ряд свидетелей без пояснений.
  alternative: Истолковать свидетельство как клятвенное призывание или судебное удостоверение.
  rationale: Греческий текст не уточняет точный ритуальный или юридический характер формулы, поэтому перевод не должен снимать эту неоднозначность.
- issue: Краткий ответ сыновей «Μάρτυρες»
  choice: «Мы — свидетели».
  alternative: «Свидетели».
  rationale: В греческом сказуемое употреблено без явно выраженного подлежащего; добавление «мы» необходимо для естественного русского ответа и не меняет смысла.
translation_notes:
  register: Современный литературный русский язык с сохранением торжественного повторения исходного текста. Синтаксис слегка формальный, но понятный обычному читателю; местоимение «Его» написано с прописной буквы в соответствии с традиционным русским религиозным регистром.
