  text: Καὶ *ἀπεκρίθησαν αὐτῷ οἱ υἱοὶ αὐτοῦ λέγοντες⁸. Ἐνώπιον κυρίου πορευσόμεθα⁹ ⌜καὶ⌝¹⁰ κατὰ τὸν νόμον αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/019/002.yaml
  text: And his sons answered him, saying, “Before the Lord we will walk according to his law.”
translation:
  language: ru
  text: 'И ответили ему его сыновья: «Мы будем ходить пред Господом согласно Его закону».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐνώπιον κυρίου πορευσόμεθα
  choice: Мы будем ходить пред Господом
  rationale: Сохраняет библейский образ хождения перед Господом как жизни в Его присутствии и верности Ему; «пред» поддерживает достойный библейский регистр.
- source_word: κατὰ τὸν νόμον αὐτοῦ
  choice: согласно Его закону
  rationale: 'Передаёт нормирующее значение κατά с винительным падежом: жить в соответствии с Его законом.'
- source_word: ἀπεκρίθησαν αὐτῷ οἱ υἱοὶ αὐτοῦ λέγοντες
  choice: ответили ему его сыновья
  rationale: Естественно передаёт греческую формулу; отдельное «говоря» в современном русском избыточно перед прямой речью.
theological_decisions:
- issue: Образ хождения перед Господом
  choice: Сохранить метафору «ходить пред Господом»
  alternative: «жить перед Господом» или «поступать пред Господом»
  rationale: Греческое πορεύομαι допускает буквальный образ пути, традиционно выражающий весь образ жизни; его не следует сводить к одному аспекту поведения.
- issue: Связь хождения с законом
  choice: «ходить пред Господом согласно Его закону»
  alternative: «ходить пред Господом и согласно Его закону»
  rationale: Текстуально отмеченное καί неустойчиво; без союза фраза естественно понимается как единое обещание жить перед Господом в соответствии с Его законом.
translation_notes:
  register: Современный литературный русский с умеренно библейским, торжественным оттенком. Формула «пред Господом» намеренно сохранена; синтаксически лишнее причастие «говоря» опущено. Местоимение «Его» написано с прописной буквы согласно распространённой русской религиозной издательской норме.
