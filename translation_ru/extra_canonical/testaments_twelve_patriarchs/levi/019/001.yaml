  text: And now, my children, you have heard everything. Choose for yourselves either the light or the darkness, either the law of the Lord or the works of Beliar.
translation:
  language: ru
  text: 'И теперь, дети мои, вы всё услышали. Выберите для себя: либо свет, либо тьму; либо закон Господа, либо дела Велиара.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: дети мои
  rationale: Прямое и естественное обращение, сохраняющее родительский тон греческого текста.
- source_word: πάντα ἠκούσατε
  choice: вы всё услышали
  rationale: Сохраняет значение завершённого восприятия всего ранее сказанного без добавления толкования.
- source_word: Ἐκλέξασθε ἑαυτοῖς
  choice: Выберите для себя
  rationale: Передаёт императив среднего залога и подчёркивает личный выбор адресатов.
- source_word: τὸ φῶς / τὸ σκότος
  choice: свет / тьму
  rationale: Сохраняет образную и нравственную антитезу оригинала.
- source_word: νόμον κυρίου
  choice: закон Господа
  rationale: Формально и богословски нейтрально передаёт νόμος и родительный оборот.
- source_word: τὰ ἔργα τοῦ Βελίαρ
  choice: дела Велиара
  rationale: Сохраняет личное имя Βελίαρ в традиционной русской форме и прямое противопоставление закону Господа.
theological_decisions:
- issue: Структура двух параллельных альтернатив
  choice: «либо свет, либо тьму; либо закон Господа, либо дела Велиара»
  alternative: «свет или тьму, закон Господа или дела Велиара»
  rationale: Повторение разделительных союзов сохраняет риторическую напряжённость и симметрию греческого текста, не устанавливая сверх текста точного соответствия между членами двух пар.
translation_notes:
  register: Современный литературный русский язык; речь торжественная, но доступная. Синтаксис и параллелизм оригинала сохранены без архаизации.
