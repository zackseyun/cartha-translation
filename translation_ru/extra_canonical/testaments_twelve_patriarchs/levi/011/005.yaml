  text: '*Καὶ εἶδον ἐν ὁράματι· μέσος ἐν ὑψηλοῖς ἵστατο πάσης τῆς συναγωγῆς²⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/005.yaml
  text: And I saw in the vision that he stood in the midst of the congregation, in the heights.
translation:
  language: ru
  text: 'И увидел я в видении: он стоял среди всего собрания, на высотах.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в небесных высях».'
    reason: Греческое ἐν ὑψηλοῖς может относиться к небесным высотам, но само по себе не исключает более общего пространственного смысла «на высотах».
lexical_decisions:
- source_word: ἐν ὁράματι
  choice: в видении
  rationale: Прямой и естественный эквивалент, сохраняющий характер пророческого видения.
- source_word: μέσος … πάσης τῆς συναγωγῆς
  choice: среди всего собрания
  rationale: Передаёт положение в самой середине всей собравшейся общины; πάσης отражено словом «всего».
- source_word: ἐν ὑψηλοῖς
  choice: в вышних
  rationale: Сохраняет возвышенно-пространственный и, возможно, небесный смысл греческого выражения, не сводя его однозначно к земным возвышенностям.
- source_word: ἵστατο
  choice: стоял
  rationale: Передаёт имперфект как состояние, наблюдаемое в ходе видения.
theological_decisions:
- issue: Пространственный смысл ἐν ὑψηλοῖς
  choice: в вышних
  alternative: на высотах
  rationale: Контекст допускает как небесную сферу, так и буквальную высоту. Формулировка «в вышних» сохраняет эту напряжённость и не навязывает конкретной космологии.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской формулой «в вышних». Двоеточие естественно вводит содержание увиденного; порядок фразы делает принадлежность «в вышних» к положению стоящего ясной, не устраняя исходной пространственной неоднозначности.
