  text: And I saw concerning him that he was not in the first rank.
translation:
  language: ru
  text: И я увидел, что он не принадлежит к первому чину.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περὶ αὐτόν
  choice: о нём
  rationale: Сохраняет значение греческого оборота «относительно него» и естественно звучит по-русски.
- source_word: οὐκ ἔστιν ἐν
  choice: не принадлежит к
  rationale: В сочетании с обозначением упорядоченной группы передаёт не просто местонахождение, а отсутствие принадлежности к данному разряду.
- source_word: τῇ πρώτῃ τάξει
  choice: к первому чину
  rationale: τάξις обозначает порядок, разряд или чин; в контексте небесной иерархии «чин» естественен, но не уточняет её устройство сверх текста.
theological_decisions:
- issue: Характер «первого чина»
  choice: Сохранено общее обозначение «первый чин» без отождествления с конкретной ангельской категорией.
  alternative: «первый ряд» или указание конкретного ангельского чина
  rationale: Греческий текст говорит лишь о πρώτῃ τάξει и не называет определённую категорию; конкретизация внесла бы чуждую тексту интерпретацию.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной интонацией; синтаксис близок к греческому, но принадлежность к разряду выражена естественным русским оборотом.
