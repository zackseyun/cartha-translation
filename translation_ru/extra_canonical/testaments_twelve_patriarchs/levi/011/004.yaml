lexical_decisions:
- source_word: Καὰθ
  choice: Кааф
  rationale: Традиционная русская форма библейского имени Кааф, сына Левия; она узнаваема и соответствует современному литературному употреблению библейских имён.
- source_word: ἐν τῷ τριακοστῷ πέμπτῳ ἔτει τῆς ζωῆς μου
  choice: на тридцать пятом году моей жизни
  rationale: Естественно и точно передаёт указание на событие, произошедшее в течение тридцать пятого года жизни говорящего.
- source_word: πρὸς ἀνατολὰς ἡλίου
  choice: к восходу солнца
  rationale: Сохраняет образ и неоднозначную связь оборота с предшествующим сообщением, не уточняя без достаточных оснований, обозначает ли он направление, место или время.
