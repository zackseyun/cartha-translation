  source_fidelity: 'Перевод точно передаёт греческий текст: Διὰ τοῦτο — «Поэтому», ἐκάλεσα τὸ ὄνομα αὐτοῦ — «я нарёк ему имя», Καάθ — «Кааф», а ἀρχὴ μεγαλείου καὶ συμβιβασμός — «начало величия и единение». В исходном греческом тексте отсутствует дополнение «всех»; русская версия обоснованно не воспроизводит это добавление из поздней английской редакторской линии. Квадратные скобки, отмечающие текстологически выделенную фразу в издании, сохранены.'
