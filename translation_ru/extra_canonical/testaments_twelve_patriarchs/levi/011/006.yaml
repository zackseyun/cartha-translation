base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/006.yaml
  text: Therefore I called his name Kohath, [which is, the beginning of majesty and uniting].
translation:
  language: ru
  text: Поэтому я нарёк ему имя Кааф[a] — [что означает «начало величия и единение»][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Кааф — традиционная русская форма имени; также передаётся как Коаф.
    reason: Уточняет форму имени для читателя, поскольку греческое Καάθ и современные транслитерации могут передаваться по-разному.
  - marker: b
    text: Слова в квадратных скобках текстуально отмечены в используемом греческом издании; «единение» можно также понять как «соединение», «согласование» или «примирение».
    reason: Сохраняет издательскую неопределённость фразы и смысловую многозначность συμβιβασμός.
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Поэтому
  rationale: Передаёт причинно-следственную связь естественным современным русским языком.
- source_word: ἐκάλεσα τὸ ὄνομα αὐτοῦ
  choice: я нарёк ему имя
  rationale: Устойчивое, достойное выражение для библейского именования, сохраняющее смысл греческой конструкции.
- source_word: Καάθ
  choice: Кааф
  rationale: Традиционная русская библейская форма имени Кааф (Коаф), соответствующая греческому Καάθ.
- source_word: ἀρχὴ μεγαλείου
  choice: начало величия
  rationale: Формально сохраняет значения ἀρχή («начало») и μεγαλείου («величия»), не конкретизируя неясную этимологическую связь.
- source_word: συμβιβασμός
  choice: единение
  rationale: Передаёт идею соединения или сведения воедино; не добавляет отсутствующего в представленном греческом тексте значения «всех».
theological_decisions:
- issue: Характер толкования имени Кааф
  choice: Сохранено как авторское объяснение значения имени без утверждения его историко-лингвистической точности.
  alternative: Переформулировать как прямую научную этимологию имени.
  rationale: Греческий текст предлагает традиционное смысловое толкование; перевод не должен усиливать его до современного этимологического утверждения.
- issue: Объём значения συμβιβασμός
  choice: «единение»
  alternative: «собрание», «согласие» или «примирение»
  rationale: Слово допускает несколько оттенков — соединение, согласование, примирение. «Единение» сохраняет широту и естественно сочетается с пояснением имени.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Нарёк ему имя» сохраняет торжественный регистр, оставаясь понятным; квадратные скобки источника сохранены, и каждый сносочный маркер присутствует в основном тексте.
