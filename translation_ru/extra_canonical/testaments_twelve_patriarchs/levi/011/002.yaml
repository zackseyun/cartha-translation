  source_fidelity: Начальная часть передана точно. Однако ἦμεν означает «мы были», а не прямо «мы жили»; кроме того, ἐν γῇ παροικίας обозначает землю пребывания в качестве пришельцев. Исправление сохраняет и пространственный образ «земли», и статус пришельцев.
  naturalness: Предлагаемая формулировка естественна для современного литературного русского и сохраняет краткий повествовательный регистр.
  terminology: «Гирсам» соответствует традиционной русской библейской форме имени и допустимо передаёт Γηρσάμ. «Пришельцы» точно передаёт смысл παροικία в данном контексте, без конфессионально обусловленного толкования.
