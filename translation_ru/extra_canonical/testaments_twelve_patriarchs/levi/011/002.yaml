  text: And she conceived and bore a son, and I called his name Gersam, because we were in a land of sojourning.
translation:
  language: ru
  text: Она зачала и родила сына, и я назвал его Гирсамом, потому что мы были пришельцами в чужой земле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συλλαβοῦσα ἔτεκεν υἱόν
  choice: зачала и родила сына
  rationale: Сохраняет последовательность и простоту греческого повествования.
- source_word: ἐκάλεσα τὸ ὄνομα αὐτοῦ Γηρσάμ
  choice: я назвал его Гирсамом
  rationale: Естественная современная русская передача семитской формулы «назвал имя его»; «Гирсам» — традиционная русская форма имени.
- source_word: ἐν γῇ παροικίας ἦμεν
  choice: мы жили на чужбине
  rationale: Передаёт положение временных жителей или пришельцев в чужой земле без тяжеловесного буквального выражения «в земле проживания пришельцами».
