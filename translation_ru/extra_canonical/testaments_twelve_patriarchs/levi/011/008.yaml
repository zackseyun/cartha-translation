  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/008.yaml
  text: And Jochebed was born in Egypt, in the sixty-fourth year of my life, for at that time I was illustrious among my brothers.
translation:
  language: ru
  text: А Иохаведа родилась в Египте, на шестьдесят четвёртом году моей жизни, ибо в то время я пользовался почётом среди моих братьев.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰωχαβέδ
  choice: Иохаведа
  rationale: Традиционная русская библейская форма имени матери Моисея (ср. Исх. 6:20), соответствующая греческому написанию.
- source_word: τῷ ἑξηκοστῷ τετάρτῳ μου ἔτει
  choice: на шестьдесят четвёртом году моей жизни
  rationale: Естественно передаёт указание на возраст говорящего, сохраняя порядковую форму греческого выражения.
- source_word: ἔνδοξος
  choice: пользовался почётом
  rationale: В данном контексте передаёт значение уважаемого, почитаемого положения без неестественного для современной русской речи «славен».
- source_word: ἐν μέσῳ τῶν ἀδελφῶν μου
  choice: среди моих братьев
  rationale: Прямое и естественное соответствие греческому обороту.
