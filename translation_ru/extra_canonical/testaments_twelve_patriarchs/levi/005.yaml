  verdict: revise
  source_fidelity: Требуются правки в ст. 3, 5 и 6. В ст. 3 ἐν Συχέμ означает «в Сихеме», а не «над Сихемом»; ὑπὲρ Δείνας относится к Дине. В ст. 5 διδάξόν με τὸ ὄνομά σου — «научи меня имени твоему», не «открой мне имя». В ст. 6 наличный греческий текст содержит активный инфинитив τοῦ μὴ πατάξαι αὐτούς («чтобы не поразить их»); пассивное «чтобы их не поразили» снимает существенную синтаксическую неоднозначность и не соответствует данной форме. Добавления из расширенных свидетелей должны оставаться только в сноске.
  naturalness: После правок текст остаётся современным литературным русским с умеренно возвышенным регистром. «Научи меня имени твоему» естественно в сакрально-литературном контексте. «Соверши возмездие в Сихеме за Дину» ясно разводит место действия и основание возмездия.
  terminology: '«Святой Всевышний», «благословения священства», «скрижали отцов» и «род Израиля» приемлемы. Местоимения ангела в ст. 3 следует писать со строчной буквы: ангел прямо отличает себя от Господа, который его послал; прописные формы здесь могут зрительно затушевать это различие.'
