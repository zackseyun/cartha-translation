    reason: lexical_alternative
  - marker: c
    text: 'Греческий текст стиха труден. Буквально: «ангел, ходатайствующий за род Израиля, чтобы не поразить их»; субъект инфинитива «поразить» подразумевается. В некоторых свидетелях строка развёрнута: «чтобы они не были поражены окончательно, ибо всякий злой дух нападает на него [род Израиля]».'
    reason: textual_variant
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: в это время
  rationale: Выражение повреждено или не вполне ясно; временная передача естественна в контексте и не пытается чрезмерно конкретизировать связь.
- source_word: ἅγιον ὕψιστον
  choice: святого Всевышнего
  rationale: Передаёт оба определения как титульное наименование Бога и сохраняет возвышенный регистр.
- source_word: τὰς εὐλογίας τῆς ἱερατείας
  choice: благословения священства
  rationale: 'Сохраняет родительную связь: речь о благословениях, принадлежащих священническому служению.'
- source_word: ἕως ἐλθὼν κατοικήσω ἐν μέσῳ τοῦ Ἰσραήλ
  choice: до тех пор, пока не приду и не поселюсь среди Израиля
  rationale: Сохраняет первое лицо и временную конструкцию, но выражает её естественно по-русски.
- source_word: ὅπλον καὶ ῥομφαίαν
  choice: оружие и меч
  rationale: ὅπλον имеет широкое значение «оружие, воинское снаряжение»; «щит» возможен, но не выражен однозначно.
- source_word: Ποίησον ἐκδίκησιν ἐν Συχὲμ
  choice: соверши возмездие над Сихемом
  rationale: Сохраняет повелительную и карательно-судебную силу выражения; ἐν допускает связь действия с местом, однако контекст Быт 34 позволяет понять Сихем и как объект возмездия.
- source_word: συνετέλεσα τοὺς υἱοὺς Ἐμμώρ
  choice: я истребил сынов Еммора
  rationale: В данном насильственном контексте глагол означает доведение до конца, то есть уничтожение.
- source_word: ἐν πλαξὶ τῶν πατέρων
  choice: на скрижалях отцов
  rationale: Передаёт наличный греческий текст без добавления отсутствующего прилагательного «небесных».
- source_word: ἐν ἡμέρᾳ θλίψεως
  choice: в день бедствия
  rationale: Естественный русский библейский оборот, сохраняющий единственное число и смысл тяжёлого испытания.
- source_word: ὁ ἄγγελος ὁ παραιτούμενος τὸ γένος Ἰσραήλ
  choice: ангел, который ходатайствует за род Израиля
  rationale: παραιτέομαι может обозначать просьбу, мольбу или заступничество; последующая цель указывает на защитительное ходатайство, хотя текст труден.
- source_word: ἔξυπνος γενόμενος
  choice: я пробудился
  rationale: Естественно передаёт причастный оборот после описания видения.
theological_decisions:
- issue: Кто говорит в стихе 2
  choice: 'Сохранена речь от первого лица: «пока не приду и не поселюсь»'
  alternative: Считать, что ангел лишь передаёт слова Бога или говорит от Его имени
  rationale: Греческий текст не устраняет переход между явлением Всевышнего и речью; перевод сохраняет эту напряжённость, не назначая говорящего пояснительной вставкой.
- issue: Смена регистра первого лица в стихе 3
  choice: «Я буду с тобой… Господь послал Меня» с прописными местоимениями в прямой речи
  alternative: Строчные местоимения или истолкование говорящего как самого Господа
  rationale: Говорящий прямо назван ангелом и отличает себя от пославшего Господа. Прописные формы отражают традиционный русский благоговейный регистр, не отождествляя ангела с Богом.
- issue: Скрижали отцов
  choice: Не добавлять в основной текст определение «небесные»
  alternative: «небесные скрижали отцов» как апокалиптические предвечные записи
  rationale: Апокалиптический контекст поддерживает альтернативу, но слово «небесные» отсутствует в представленном греческом тексте.
- issue: Роль ангела в стихе 6
  choice: Защитный ходатай за Израиль
  alternative: Более буквальное, но неясное «отклоняющий/отказывающий род Израиля»
  rationale: Значение ходатайства соответствует семантике παραιτέομαι и целевой фразе о предотвращении поражения; трудность текста отмечена сноской.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Архаизмы сведены к общеупотребительным сакральным словам («Всевышний», «престол», «скрижали», «ходатайствует»). Прописные местоимения в прямой сакральной речи употреблены согласно русской религиозно-издательской традиции; при этом различие между ангелом и Господом сохранено.
