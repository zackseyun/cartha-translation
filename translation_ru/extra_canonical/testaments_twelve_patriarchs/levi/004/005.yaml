base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/005.yaml
  text: And for this reason counsel and understanding have been given to you, so that you may instruct your sons concerning this.
translation:
  language: ru
  text: И потому тебе даны совет и разумение, чтобы ты вразумил своих сыновей относительно этого.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βουλή
  choice: совет
  rationale: Передаёт значение обдуманного совета или наставления, сохраняя координацию с «разумением».
- source_word: σύνεσις
  choice: разумение
  rationale: Отражает способность понимать и рассуждать; слово естественно для современного литературного русского и сохраняет возвышенный регистр.
- source_word: τοῦ συνετίσαι
  choice: чтобы ты вразумил
  rationale: Инфинитив цели означает привести других к пониманию, наставить их; «вразумил» точнее простого «научил» сохраняет связь с σύνεσις.
- source_word: περὶ τούτου
  choice: относительно этого
  rationale: Сохраняет неопределённую отсылку греческого выражения, не конкретизируя её без основания.
