  source_fidelity: 'Текст точно передаёт греческое построение: «διὰ τοῦτο» — «И потому», «δέδωταί σοι» — «тебе даны», «βουλὴ καὶ σύνεσις» — «совет и разумение», а целевой оборот «τοῦ συνετίσαι» корректно выражен через «чтобы ты вразумил». Неопределённая анафора «περὶ τούτου» сохранена в «относительно этого».'
