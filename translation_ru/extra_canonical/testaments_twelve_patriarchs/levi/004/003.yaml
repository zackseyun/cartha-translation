  text: You shall shine the light of knowledge in Jacob, and you shall be like the sun to all the seed of Israel.
translation:
  language: ru
  text: Ты будешь светить светом знания в Иакове и будешь как солнце для всего потомства Израиля.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωτιεῖς
  choice: озаришь
  rationale: Глагол передаёт действие просвещения или освещения; «озаришь ... светом» естественно по-русски и сохраняет образ света.
- source_word: φῶς γνώσεως
  choice: светом знания
  rationale: Сохранена метафора и родительная связь «свет знания», оформленная творительным падежом при глаголе «озаришь».
- source_word: ἐν τῷ Ἰακώβ
  choice: Иакова
  rationale: Греческое выражение буквально допускает «в Иакове», однако в сочетании с φωτιεῖς естественно понимать Иакова как сферу или объект озарения; русский винительный передаёт это без тяжеловесности.
- source_word: ὡς ἥλιος ἔσῃ
  choice: будешь как солнце
  rationale: Прямо сохранено сравнение без добавочного истолкования.
- source_word: παντὶ σπέρματι Ἰσραήλ
  choice: для всего потомства Израиля
  rationale: σπέρμα в данном коллективном родословном употреблении означает потомство; «потомство» понятно современному читателю и не создаёт неуместного биологического оттенка слова «семя».
theological_decisions:
- issue: Образ просвещения Иакова и Израиля
  choice: Сохранить поэтические образы света и солнца без пояснения их богословского носителя или способа исполнения.
  alternative: Конкретизировать как духовное наставление, откровение или мессианское служение.
  rationale: Сам стих не раскрывает точного способа исполнения образа; конкретизация устранила бы исходную смысловую открытость.
translation_notes:
  register: Современный литературный русский с возвышенным, но ясным библейским звучанием. Архаическое «семя Израиля» заменено естественным коллективным «потомство Израиля»; параллелизм двух частей сохранён.
