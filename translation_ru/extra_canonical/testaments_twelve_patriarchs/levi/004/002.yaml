base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/002.yaml
  text: Therefore the Most High has heard your prayer, to separate you from unrighteousness and for you to become to him a son and a servant and a minister before him.
translation:
  language: ru
  text: Итак, Всевышний услышал твою молитву о том, чтобы отделить тебя от неправедности и чтобы ты стал Его сыном, слугой и служителем пред лицом Его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὕψιστος
  choice: Всевышний
  rationale: Устоявшееся и естественное в русском библейском регистре обозначение Бога, точно передающее превосходную степень.
- source_word: τοῦ διελεῖν σε ἀπὸ ἀδικίας
  choice: о том, чтобы отделить тебя от неправедности
  rationale: Передаёт содержание молитвы и сохраняет образ отделения от ἀδικία без сужения смысла до отдельного проступка.
- source_word: θεράποντα
  choice: слугой
  rationale: Передаёт личное служение и сохраняет отличие от следующего λειτουργόν; слово «рабом» здесь было бы семантически жёстче исходного.
- source_word: λειτουργὸν τοῦ προσώπου αὐτοῦ
  choice: служителем пред лицом Его
  rationale: «Служитель» передаёт λειτουργός, а «пред лицом Его» естественно воспроизводит идею служения в непосредственном присутствии Бога.
theological_decisions:
- issue: Значение выражения «сыном» по отношению к Всевышнему
  choice: Сохранено буквальное «сыном» без поясняющей квалификации
  alternative: «подобным сыну» или «приёмным сыном»
  rationale: В тексте стоит υἱόν без уточнения; добавление характера сыновства устранило бы сохраняемую оригиналом богословскую напряжённость.
- issue: Связь инфинитивных оборотов с молитвой
  choice: Оба оборота переданы как содержание услышанной молитвы
  alternative: Передать их как отдельную цель действия Всевышнего
  rationale: Родительный артикль перед инфинитивом допускает целевой оттенок, однако в данном контексте естественно относится к просьбе; русская конструкция сохраняет смысл, не уточняя способ исполнения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Формула «пред лицом Его» намеренно сохранена как понятная традиционная конструкция; архаические формы вне этой формулы не используются.
