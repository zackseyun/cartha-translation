  rationale: Будущая перифрастическая форма сохранена как предсказание состояния или результата.
- source_word: οἱ καταρώμενοι
  choice: проклинающие
  rationale: Передаёт противопоставленное действие без добавочного толкования.
- source_word: ἀπολοῦνται
  choice: погибнут
  rationale: Средне-залоговая форма будущего времени допускает значение гибели; выбор сохраняет силу греческого глагола и соответствует контексту.
