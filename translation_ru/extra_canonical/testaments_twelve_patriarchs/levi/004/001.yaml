source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Νῦν οὖν γίνωσκε¹ ὅτι ποιήσει Κύριος κρίσιν ἐπὶ τοὺς υἱοὺς τῶν ἀνθρώπων. Ὅτι² πετρῶν³ σχιζομένων, καὶ τοῦ ἡλίου σβεννυμένου⁴ καὶ ὑδάτων⁵ ξηραινομένων καὶ τοῦ⁶ πυρὸς καταπτήσσοντος⁷ καὶ πάσης [τῆς]⁸ κτίσεως κλονουμένης⁹ καὶ τῶν ἀοράτων πνευμάτων¹⁰ τηκομένων¹¹ καὶ¹² τοῦ ᾅδου σκυλευομένου¹³ [ἐπὶ τῷ πάθει τοῦ ὑψίστου]¹⁴ *οἱ ἄνθρωποι ἀπειθοῦντες ἐπιμενοῦσι ταῖς ἀδικίαις¹⁵, διὰ τοῦτο ἐν Γτῇ¹⁶ κολάσει κριθήσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/001.yaml
  text: Now therefore know that the Lord will execute judgment upon the sons of men. For when rocks are split, and the sun is extinguished, and waters dry up, and fire cowers, and all creation is shaken, and the invisible spirits melt away, and Hades is plundered at the suffering of the Most High[a], disobedient men will persist in their injustices; therefore they will be judged in punishment.
translation:
  language: ru
  text: 'Итак, знай же: Господь совершит суд над сынами человеческими. Ибо, когда скалы расколются, солнце погаснет, воды иссякнут, огонь съёжится, всё творение поколеблется, невидимые духи истают и Аид будет разграблен при страдании Всевышнего[a], люди, проявляющие непослушание, будут упорно оставаться в своих неправдах; поэтому они будут судимы в наказание.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «при страдании Всевышнего» текстологически неустойчивы в греческой традиции и, возможно, являются позднейшим расширением; здесь они переведены, поскольку присутствуют в предоставленном тексте.
    reason: textual_variant
lexical_decisions:
- source_word: ποιήσει ... κρίσιν
  choice: совершит суд
  rationale: Передаёт устойчивое греческое сочетание естественным и торжественным русским выражением, не сводя его только к вынесению приговора.
- source_word: τοὺς υἱοὺς τῶν ἀνθρώπων
  choice: сынов человеческих
  rationale: Сохраняет семитизированную форму исходного текста и её возвышенный библейский регистр.
- source_word: τοῦ πυρὸς καταπτήσσοντος
  choice: огонь съёживается
  rationale: Глагол обозначает испуганное сжатие или припадание; образ сохранён как намеренно необычная персонификация огня.
- source_word: τῶν ἀοράτων πνευμάτων τηκομένων
  choice: невидимые духи тают
  rationale: Буквально сохраняет образ растворения или таяния духов без рационализирующего истолкования.
- source_word: τοῦ ᾅδου σκυλευομένου
  choice: ад подвергается разграблению
  rationale: Передаёт пассивную форму и военный оттенок σκυλεύω — разорять или брать добычу.
- source_word: οἱ ἄνθρωποι ἀπειθοῦντες ἐπιμενοῦσι ταῖς ἀδικίαις
  choice: непокорные люди продолжают творить беззакония
  rationale: ἀπειθοῦντες характеризует людей как непокорных, а ἐπιμενοῦσι выражает упорное продолжение; множественное ταῖς ἀδικίαις естественно передано собирательным «беззакония».
- source_word: ἐν ... κολάσει κριθήσονται
  choice: будут осуждены на наказание
  rationale: Сохраняет связь судебного решения с наказанием; не добавляет сравнительной степени «большее», отсутствующей в представленном исправленном греческом тексте.
theological_decisions:
- issue: Страдание Всевышнего
  choice: при страдании Всевышнего
  alternative: опустить как позднейшую вставку
  rationale: Фраза присутствует в предоставленном тексте, поэтому переведена, но её текстовая неуверенность явно отмечена в сноске; богословское напряжение не снимается перефразированием.
- issue: Ад как объект разграбления
  choice: ад подвергается разграблению
  alternative: ад опустошается
  rationale: Более буквально передаёт мотив победоносного разграбления, не уточняя неназванного деятеля и не привязывая образ к определённой конфессиональной схеме.
- issue: Характер последнего суда
  choice: Господь совершит суд ... будут осуждены на наказание
  alternative: Господь покарает ... будут наказаны
  rationale: Сохранена судебная лексика κρίσις/κριθήσονται и различие между судом и следующим за ним наказанием.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно библейским звучанием. Цепочка образов передана в настоящем времени, как в греческих причастных конструкциях, а необычные апокалиптические образы сохранены без поясняющей гармонизации.
