review_pass:
  verdict: revise
  source_fidelity: В целом последовательность образов и судебная лексика переданы верно. Однако будущие формы греческого периода лучше отразить будущим временем по-русски; ἀπειθοῦντες следует передать как продолжающееся непослушание, а ἐπιμενοῦσι ταῖς ἀδικίαις — как упорное пребывание в неправдах, а не как просто «творить беззакония». Для ᾅδης предпочтительно «Аид», сохраняющее термин исходного текста без преждевременной конфессиональной конкретизации.
  naturalness: Исправленный текст сохраняет торжественный, современный литературный регистр. «Когда скалы расколются...» естественно оформляет цепочку греческих генитивных абсолютов. «Огонь съёжится» намеренно сохраняет необычную персонификацию καταπτήσσω, но звучит литературнее в будущем времени.
  terminology: «Совершит суд», «сыны человеческие», «Всевышний» и «наказание» уместны. «Аид» точнее соответствует ᾅδης, чем «ад», и не устраняет образ насильственного разграбления, выраженный σκυλευομένου.
  issues:
