    issue: Временная перспектива апокалиптической цепочки
    rationale: В тексте стоят будущие формы и конструкции, связанные с будущим судом; настоящее время в черновике способно представить события как общее описание, а не как ожидаемые события.
  - severity: medium
    issue: Передача ἀπειθοῦντες ἐπιμενοῦσι ταῖς ἀδικίαις
    rationale: «Непокорные люди продолжают творить беззакония» ослабляет причастное значение продолжающегося непослушания и заменяет «упорствовать в неправдах» активным совершением беззаконий. Исправление сохраняет оба элемента.
  - severity: low
