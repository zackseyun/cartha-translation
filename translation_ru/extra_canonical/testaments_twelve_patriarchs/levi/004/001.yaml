revisions:
- from: Итак, знай теперь, что Господь совершит суд над сынами человеческими. Ибо, когда скалы раскалываются, солнце гаснет, воды высыхают, огонь съёживается, всё творение содрогается, невидимые духи тают и ад подвергается разграблению при страдании Всевышнего[a], непокорные люди продолжают творить беззакония; поэтому они будут осуждены на наказание.
  to: 'Итак, знай же: Господь совершит суд над сынами человеческими. Ибо, когда скалы расколются, солнце погаснет, воды иссякнут, огонь съёжится, всё творение поколеблется, невидимые духи истают и Аид будет разграблен при страдании Всевышнего[a], люди, проявляющие непослушание, будут упорно оставаться в своих неправдах; поэтому они будут судимы в наказание.'
  rationale: 'Внесены только безопасные изменения: будущая перспектива согласована с греческим текстом, сочетание «проявляющие непослушание ... оставаться в своих неправдах» точнее передаёт ἀπειθοῦντες ἐπιμενοῦσι ταῖς ἀδικίαις, а «Аид» сохраняет термин ᾅδης. Текстологически спорная вставка сохранена и снабжена сноской с тем же маркером.'
