base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/004.yaml
  text: And a blessing shall be given to you and to all your seed, until the Lord visits all the nations in the tender mercies of his son[a] forever.
translation:
  language: ru
  text: И благословение будет дано тебе и всему твоему потомству, доколе Господь не посетит все народы в глубоком милосердии Сына Своего[a] — навеки.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В некоторых рукописях этот стих расширен прямым утверждением, что Бог пошлёт Своего Сына спасти творение, а сыновья Левия возложат на Него руки и предадут Его казни через посажение на кол. Здесь принят более краткий текст; само слово «Сына» также текстуально не вполне достоверно.
    reason: textual_variant
lexical_decisions:
- source_word: σπέρματί
  choice: потомству
  rationale: В данном контексте собирательное «потомство» естественно передаёт значение «семя, потомки» и сохраняет обращение ко всему роду Левия.
- source_word: ἐπισκέψεται
  choice: посетит
  rationale: 'Сохраняет библейскую многозначность глагола: прийти, обратить внимание, явить попечение или совершить суд; перевод не уточняет её односторонне.'
- source_word: ἐν σπλάγχνοις
  choice: в глубоком милосердии
  rationale: Греческая идиома буквально связана с «внутренностями» как средоточием сострадания; по-русски её смысл естественно передаёт выражение «в глубоком милосердии».
- source_word: ἕως αἰῶνος
  choice: навеки
  rationale: Кратко и достойно передаёт устойчивое значение выражения, не устраняя напряжение между предшествующим ἕως («доколе») и заключительным указанием на вечность.
theological_decisions:
- issue: Текстуально неустойчивое упоминание υἱοῦ αὐτοῦ
  choice: Своего Сына[a]
  alternative: Своём милосердии
  rationale: Упоминание Сына присутствует в предоставленном греческом тексте, хотя заключено в редакционные скобки. Оно сохранено в основном тексте с примечанием о вариантах, а прописная буква указывает на титульное употребление, не добавляя отсутствующего в греческом догматического пояснения.
- issue: Неясная синтаксическая связь ἐν σπλάγχνοις [υἱοῦ] αὐτοῦ
  choice: в глубоком милосердии Своего Сына
  alternative: по Своему глубокому милосердию через Сына
  rationale: Выбранный вариант близко сохраняет родительную связь «милосердие Сына» и не вводит инструментального значения «через», которого в тексте прямо нет.
- issue: Заключительное ἕως αἰῶνος при предшествующем ἕως
  choice: сохранить «навеки» как отдельное заключительное определение
  alternative: сгладить фразу как «и пребудет это вовеки»
  rationale: Неровность исходной конструкции оставлена заметной, поскольку её сглаживание потребовало бы добавить подлежащее и разрешить реальную синтаксическую неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис сделан понятным, но необычное сочетание «доколе… навеки» сохранено, чтобы не скрывать напряжение греческого текста.
