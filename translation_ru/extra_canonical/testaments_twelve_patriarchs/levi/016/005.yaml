source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *τόπος ὑμῖν καθαρὸς οὐκ ἔσται³², ἀλλ᾽ ἔσεσθε³³ ἐν τοῖς ἔθνεσιν εἰς κατάραν καὶ *εἰς διασκορπισμόν³⁴, ἕως³⁵ *αὐτὸς πάλιν³⁶ ἐπισκέψηται³⁷ καὶ *οἰκτειρήσῃ καὶ³⁸ προσδέξηται³⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/005.yaml
  text: And no clean place will be for you, but you will be among the nations of the earth for a curse and for scattering, until he himself visits again and shows compassion and receives you.
translation:
  language: ru
  text: И не будет для вас чистого места, но среди народов вы станете проклятием и будете рассеяны, пока он сам вновь не посетит вас, не сжалится над вами и не примет вас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τόπος ὑμῖν καθαρὸς οὐκ ἔσται
  choice: не будет для вас чистого места
  rationale: Близко передаёт греческую конструкцию и сохраняет возможный смысл как ритуальной чистоты, так и неосквернённости места.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: среди народов
  rationale: Передаёт ἔθνη без отсутствующего в греческом тексте добавления «земли».
- source_word: εἰς κατάραν καὶ εἰς διασκορπισμόν
  choice: станете проклятием и будете рассеяны
  rationale: Греческие отвлечённые существительные переданы естественной русской фразой; «проклятием» сохраняет образ, а «будете рассеяны» ясно выражает участь адресатов.
- source_word: ἐπισκέψηται
  choice: посетит вас
  rationale: Сохраняет основной смысл глагола — милостивое обращение и посещение; подразумеваемое дополнение выражено ради естественности русского языка.
- source_word: οἰκτειρήσῃ
  choice: сжалится над вами
  rationale: Точно передаёт сострадание и милость, не добавляя конфессиональной интерпретации.
- source_word: προσδέξηται
  choice: примет вас
  rationale: Передаёт значение благосклонного принятия; подразумеваемое дополнение восстановлено из обращения к «вам».
theological_decisions:
- issue: Кто обозначен местоимением αὐτός
  choice: он сам
  alternative: Сам Бог
  rationale: В данном стихе референт прямо не назван, поэтому перевод сохраняет местоименную неоднозначность и не вводит имени Бога.
- issue: Связь трёх глаголов в заключительной части
  choice: посетит вас, сжалится над вами и примет вас
  alternative: посетит, помилует и примет
  rationale: Сохранена последовательность трёх самостоятельных действий и единый подразумеваемый объект, без сведения их к одному богословскому понятию.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис сохраняет пророческую строгость оригинала, избегая архаизмов и отсутствующего в греческом тексте выражения «народы земли».
