source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '[Καὶ ἄνδρα καινοποιοῦντα¹⁵ νόμον *ἐν δυνάμει ὑψίστου¹⁶ πλάνου¹⁷ προσαγορεύσετε, καὶ τέλος †ὁρμήσετε τοῦ ἀποκτεῖναι¹⁸ αὐτόν, οὐκ εἰδότες¹⁹ αὐτοῦ τὸ ἀνάστημα†²⁰, τὸ²¹ ἀθῷον αἷμα²² *ἐν κακίᾳ²³ ἐπὶ τῆς²⁴ κεφαλῆς²⁵ ὑμῶν ἀναδεχόμενοι²⁶.]'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/003.yaml
  text: '[And a man who renews the law in the power of the Most High you will call a deceiver, and at last you will rush to kill him, not knowing his rising, taking innocent blood in wickedness upon your heads.]'
translation:
  language: ru
  text: '[И человека, обновляющего Закон силой Всевышнего, вы назовёте обманщиком; наконец вы броситесь, чтобы убить его, не зная его восхождения[a], и, творя зло, примете на свои головы невинную кровь.]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «роста», «стати», «положения»; возможно также: «воскресения». Греческое слово допускает несколько значений.'
    reason: Сохраняет лексическую неоднозначность ἀνάστημα, включая возможный смысл подъёма или воскресения, без навязывания его как единственного.
lexical_decisions:
- source_word: καινοποιοῦντα νόμον
  choice: обновляющего Закон
  rationale: Причастие καινοποιοῦντα буквально указывает на того, кто делает нечто новым; «обновляющего» естественно передаёт это значение, не предполагая отмены или замены Закона.
- source_word: ἐν δυνάμει ὑψίστου
  choice: силой Всевышнего
  rationale: Оборот передан инструментально и, согласно наиболее естественной смысловой связи, относится к обновлению Закона; исходный порядок допускает некоторую синтаксическую неоднозначность.
- source_word: πλάνου
  choice: обманщиком
  rationale: Существительное обозначает вводящего в заблуждение, обманщика; это точнее и современнее, чем «прельстителем».
- source_word: τέλος ὁρμήσετε τοῦ ἀποκτεῖναι αὐτόν
  choice: в конце концов вы броситесь убить его
  rationale: Сохраняет значение порывистого, враждебного действия ὁρμάω и целевое значение необычной конструкции с τοῦ и инфинитивом.
- source_word: ἀνάστημα
  choice: величия
  rationale: Слово может означать рост, стать, положение или величие; в данном контексте «величие» звучит естественно, при этом неоднозначность отмечена в сноске.
- source_word: ἀναδεχόμενοι
  choice: принимая на свои головы
  rationale: Сохраняет образ принятия на себя ответственности за пролитую кровь, выраженный греческим текстом.
theological_decisions:
- issue: К кому относится оборот «силой Всевышнего»
  choice: К обновлению Закона
  alternative: К именованию человека обманщиком либо к самому «обманщику»
  rationale: Такое чтение соответствует смысловой цельности высказывания и консультационному английскому тексту, хотя порядок слов греческого источника не исключает иной синтаксической связи.
- issue: Значение ἀνάστημα
  choice: «величие» с примечанием о буквальных вариантах
  alternative: «рост», «стать», «возвышение» или толкование как намёка на воскресение
  rationale: Лексема неоднозначна. Перевод «величие» подходит контексту незнания истинного достоинства человека, но сноска не позволяет превратить возможный смысл в однозначное богословское толкование.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной библейской интонацией. Сохранены квадратные скобки исходного издания, указывающие на особый текстологический статус всего фрагмента. Конструкция «кровь на головах» удержана как значимый древний образ коллективной ответственности.
