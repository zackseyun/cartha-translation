  text: But I tell you that because of him, your holy places will be laid waste to the ground.
translation:
  language: ru
  text: Но говорю вам, что из-за него ваши святыни будут разорены до основания.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι᾽ αὐτόν
  choice: из-за него
  rationale: Передаёт причинное значение διά с винительным падежом и сохраняет местоименную неоднозначность источника.
- source_word: τὰ ἅγια ὑμῶν
  choice: ваши святыни
  rationale: Субстантивированное среднее множественное τὰ ἅγια естественно обозначает святые места или святилища; «святыни» сохраняет некоторую широту выражения.
- source_word: ἔρημα ἕως ἐδάφους
  choice: разорены до основания
  rationale: Идиоматично передаёт полное опустошение вплоть до земли, не вводя более конкретного образа разрушения, чем допускает греческий текст.
theological_decisions:
- issue: Референт местоимения αὐτόν
  choice: него
  alternative: конкретно назвать подразумеваемое лицо
  rationale: Греческий стих оставляет референт зависимым от контекста; перевод не должен молча устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткая пророческая формулировка сохранена. «Но говорю вам» передаёт δὲ без излишнего усиления, а «святыни» звучит естественно и достойно.
