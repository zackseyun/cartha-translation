review_pass:
  verdict: revise
  source_fidelity: Нужна небольшая правка. Будущее «станете презирать» добавляет оттенок становления, которого нет в ἐξουδενώσετε; достаточно прямого будущего действия. Притяжательное «своём» не выражено в греческом и излишне сужает оборот ἐν διαστροφῇ κακῇ. Родительный ἀληθινῶν естественно передать как «правдивых [людей]»; это сохраняет субстантивированное употребление без добавления, что именно эти люди „говорят истину“.
  naturalness: Исправленный текст остаётся современным литературным русским и сохраняет суровый пророчески-обличительный регистр. «Презрите» точнее и компактнее, чем «станете презирать»; «словами правдивых» — естественная эллиптическая конструкция в данном возвышенном регистре.
  terminology: «Закон» уместен для νόμος в сочетании со «словами пророков». «Праведники» точно передаёт δίκαιοι, «благочестивые» — εὐσεβεῖς, а «гнушаться» сохраняет интенсивность βδελύξεσθε. Для ἐν διαστροφῇ κακῇ выбрано «в порочном извращении», без непереведённого притяжательного уточнения.
  issues:
  - severity: medium
    issue: Добавлен оттенок становления в «станете презирать».
    rationale: ἐξουδενώσετε — простое будущее «будете презирать/презрите», без значения начала или становления действия.
  - severity: low
    issue: «В своём злом извращении» вводит притяжательное «своём».
    rationale: В греческом ἐν διαστροφῇ κακῇ притяжательное определение отсутствует; его лучше не добавлять, чтобы не сужать способную шире относиться к действиям характеристику.
  - severity: medium
    issue: «Тех, кто говорит истину» чрезмерно конкретизирует ἀληθινῶν.
    rationale: Форма допускает субстантивированное «правдивых/истинных [людей]»; исходник не утверждает специально, что они выступают как говорящие.
  revised_text: И вы отвергнете Закон и в порочном извращении презрите слова пророков. Вы будете преследовать праведников, ненавидеть благочестивых и гнушаться словами правдивых.
