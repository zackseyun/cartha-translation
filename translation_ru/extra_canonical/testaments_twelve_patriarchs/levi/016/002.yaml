base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/002.yaml
  text: And you will set aside the law and treat the words of the prophets with contempt in evil perversity. You will persecute righteous men, and you will hate the godly; you will loathe the words of the truthful.
translation:
  language: ru
  text: И вы отвергнете Закон и в порочном извращении презрите слова пророков. Вы будете преследовать праведников, ненавидеть благочестивых и гнушаться словами правдивых.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀθετήσετε
  choice: отвергнете
  rationale: Глагол означает отвергать, упразднять или не признавать обязательной силу чего-либо; «отвергнете Закон» естественно по-русски и сохраняет серьёзность сознательного отказа.
- source_word: ἐξουδενώσετε
  choice: станете презирать
  rationale: Передаёт отношение как к ничтожному и не заслуживающему внимания; это соответствует семантике греческого глагола и современному литературному регистру.
- source_word: ἐν διαστροφῇ κακῇ
  choice: в своём злом извращении
  rationale: Сохраняет сочетание нравственной порочности и искажения; притяжательное «своём» естественно связывает оборот с действиями адресатов, не устраняя возможной широты связи в оригинале.
- source_word: διώξετε
  choice: будете преследовать
  rationale: Обычное и точное соответствие глаголу в контексте гонения на праведных.
- source_word: εὐσεβεῖς
  choice: благочестивых
  rationale: Передаёт людей, почитающих Бога и живущих в благоговении, без введения конфессиональной окраски.
- source_word: ἀληθινῶν λόγους
  choice: словами тех, кто говорит истину
  rationale: 'Греческая форма допускает понимание ἀληθινῶν как субстантивированного определения людей: «слова правдивых/истинных». Развёрнутый перевод звучит естественнее и не создаёт неясного русского сочетания «слова истинных».'
- source_word: βδελύξεσθε
  choice: гнушаться
  rationale: Сохраняет сильное значение отвращения и омерзения, более интенсивное, чем простое «не любить».
theological_decisions:
- issue: Значение νόμος
  choice: Закон с прописной буквы
  alternative: закон
  rationale: В контексте речения о пророках речь, вероятнее всего, идёт о данном Богом Законе; прописная буква помогает обозначить этот конкретный религиозный референт, не добавляя деноминационной трактовки.
- issue: Референт ἀληθινῶν
  choice: те, кто говорит истину
  alternative: истинные слова
  rationale: Родительный падеж множественного числа ἀληθινῶν лучше согласуется с подразумеваемыми людьми, чьи λόγους отвергают. Перевод сохраняет акцент на неприятии свидетельства правдивых людей.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного пророческого обличения. Синтаксис слегка выровнен ради ясности, но последовательность обвинений и нарастающая сила глаголов сохранены.
