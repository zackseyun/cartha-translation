id: T12P.LEV.16.1
reference: Testament of Levi 16:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ νῦν *ἐγὼ ἔγνωκα¹ ὅτι ἑβδομήκοντα ἑβδομάδας² πλανηθήσεσθε³, καὶ τὴν ἱερωσύνην βεβηλώσετε⁴ καὶ *τὰ θυσιαστήρια⁵ μιανεῖτε⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/001.yaml
  text: And now I know that for seventy weeks you will go astray, and you will profane the priesthood and defile the altars.
translation:
  language: ru
  text: И теперь я знаю, что семьдесят седмин вы будете блуждать, и оскверните священство, и запятнаете жертвенники.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑβδομήκοντα ἑβδομάδας
  choice: семьдесят седмин
  rationale: Сохраняет буквальную меру «семьдесят семёрок/седмин» и присущую выражению временную неоднозначность, не подменяя её прямо годами или неделями.
- source_word: πλανηθήσεσθε
  choice: будете блуждать
  rationale: Передаёт будущее пассивной формы с непереходным значением «сбиваться с пути, заблуждаться», сохраняя образ пути и нравственный оттенок.
- source_word: βεβηλώσετε
  choice: оскверните
  rationale: Выражает лишение священного статуса, профанацию священства.
- source_word: ἱερωσύνην
  choice: священство
  rationale: Может обозначать и священническое служение, и институт священства; русский выбор сохраняет этот диапазон.
- source_word: μιανεῖτε
  choice: запятнаете
  rationale: Различает это слово от предыдущего βεβηλώσετε и передаёт культовое загрязнение жертвенников естественным русским выражением.
- source_word: θυσιαστήρια
  choice: жертвенники
  rationale: Стандартное и точное обозначение культовых алтарей для жертвоприношений; множественное число сохранено.
theological_decisions:
- issue: Продолжительность «семидесяти седмин»
  choice: Не уточнять единицу времени сверх «седмин».
  alternative: «семьдесят недель» или «семьдесят семилетий»
  rationale: Греческое ἑβδομάς означает группу из семи и само по себе не разрешает, о днях или годах идёт речь; перевод сохраняет эту апокалиптическую неоднозначность.
- issue: Характер заблуждения
  choice: «будете блуждать» без добавления объекта или виновника
  alternative: «будете введены в заблуждение» либо «отступите»
  rationale: Форма πλανηθήσεσθε допускает оттенки заблуждения и сбивания с пути; контекст не требует ни внешнего виновника, ни более узкого понятия вероотступничества.
translation_notes:
  register: Современный литературный русский с достоинством завещательного пророческого высказывания. Повтор союза «и» сохранён как черта греческой координации; лексическое различие между βεβηλόω и μιαίνω передано словами «оскверните» и «запятнаете».
