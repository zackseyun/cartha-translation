lexical_decisions:
- source_word: ἔλαβον γυναῖκα
  choice: взял себе жену
  rationale: Передаёт обычную библейскую идиому вступления в брак и сохраняет завещательный регистр, оставаясь понятной современному читателю.
- source_word: ἐν γῇ παροικίας
  choice: жили в чужой земле
  rationale: παροικία обозначает проживание пришельцами вне своей земли. Формулировка естественна по-русски и сохраняет связь с объяснением имени Гирсама.
- source_word: πρώτῃ τάξει
  choice: в первом ряду
  rationale: Сохраняет возможные значения порядка, места и ранга, не превращая краткое видение в явное учение о позднейшей священнической иерархии.
- source_word: πρὸς ἀνατολὰς ἡλίου
  choice: при восходе солнца
  rationale: Оборот буквально отсылает к восходу солнца; в данном положении после сообщения о рождении естественно передать его как указание времени, не перенося слов в следующий стих.
- source_word: ἐν ὑψηλοῖς
  choice: в вышних
  rationale: Сохраняет возвышенный и, возможно, небесный оттенок субстантивированного множественного числа, не уточняя космологию видения.
- source_word: συναγωγῆς
  choice: собрания
  rationale: Нейтрально передаёт общину или собравшихся и не вносит более поздних конфессиональных ассоциаций слова «синагога».
- source_word: ἀρχὴ μεγαλείου καὶ συμβιβασμός
  choice: начало величия и соединение
  rationale: 'Близко следует трудному греческому пояснению имени: ἀρχή передано как «начало», а συμβιβασμός — как «соединение», без попытки искусственно сгладить неясную этимологию.'
- source_word: ἐδυστόκησεν
  choice: рожала с трудом
  rationale: Прямо и естественно передаёт тяжёлые роды и сохраняет связь с последующим объяснением имени Мерари.
- source_word: πικριασμός
  choice: горечь
  rationale: Передаёт основное значение слова и сохраняет данное текстом этимологическое толкование имени.
- source_word: ἔνδοξος
  choice: был в почёте
  rationale: Передаёт общественное признание и отличие без излишне торжественного или специально богословского оттенка.
theological_decisions:
- issue: Провидческая оценка Гирсама и Каафа
  choice: 'Передана как краткое сообщение о месте сыновей в увиденном порядке: Гирсам не находится «в первом ряду», а Кааф стоит «в вышних, посреди всего собрания».'
  alternative: Истолковать видение как прямое предсказание конкретной позднейшей левитской и священнической иерархии.
  rationale: Греческий текст допускает связь с будущим положением родов, но не раскрывает её явно; перевод сохраняет эту богословскую напряжённость и не добавляет исторической схемы.
- issue: Субъект заключительного пояснения в 11:8
  choice: 'В основном тексте субъектом принят Левий: «я был в почёте среди своих братьев».'
  alternative: 'Отнести ἔνδοξος к Иохаведе: «она была прославлена среди моих братьев».'
  rationale: Ближайший грамматический субъект допускает отнесение к Иохаведе, однако форма свидетельства и смысл «среди моих братьев» поддерживают традиционное понимание о Левии; нестабильность текста отмечена в сноске.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сделан ясным для обычного читателя, но сохранены краткость видений, трудная именная этимология и неустойчивость заключительной фразы. Имена переданы в формах, близких русской библейской традиции: Мелха, Гирсам, Кааф, Мерари, Иохаведа.'
