  revised_text: '1 И там я вновь увидел видение, подобное прежнему, после того как мы пробыли там семьдесят дней. 2 Я увидел семь мужей в белых одеждах. Они сказали мне: «Встань и облачись в одеяние священства, надень венец праведности, нагрудник разумения, длинное одеяние истины, налобную пластину веры, головной тюрбан[a] и эфод пророчества». 3 Каждый из них держал эти вещи; они возложили их на меня и сказали: «Отныне стань священником — ты и всё твоё потомство».


    4 Первый помазал меня святым маслом и дал мне жезл. 5 Второй омыл меня чистой водой Господа, накормил святым хлебом и напоил святым вином, а затем облачил меня в святое и славное одеяние. 6 Третий надел на меня льняное одеяние, подобное эфоду. 7 Четвёртый опоясал меня поясом, подобным пурпуру. 8 Пятый дал мне ветвь тучной маслины[b]. 9 Шестой возложил мне на голову венец. 10 Седьмой возложил на меня священническую диадему и наполнил мои руки благовониями, чтобы я служил священником Господу Богу.


    11 Они сказали мне: «Левий, твоё потомство разделится на три чина[c] в знак славы грядущего Господа. 12 Первый удел будет велик, и выше него не возникнет другого. 13 Второй будет пребывать в священстве. 14 Третий будет назван новым именем, потому что из Иуды восстанет царь и учредит новое священство — по образцу народов, для всех народов[d]. 15 Его явление будет желанным, как явление пророка Всевышнего из потомства Авраама, отца нашего[e]. 16 Поэтому всё желанное в Израиле будет принадлежать тебе и твоему потомству; вы будете вкушать всё прекрасное на вид, и твоё потомство будет делить трапезу Господа. 17 Среди них будут священники, судьи и книжники, и по слову их будет принято святое[f]».


    18 Пробудившись, я понял, что это видение подобно первому.'
