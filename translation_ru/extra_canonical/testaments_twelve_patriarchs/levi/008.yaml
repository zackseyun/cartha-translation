  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008.yaml
  text: '1 And there again I saw a vision like the former one, after we had remained there seventy days. 2 And I saw seven men in white clothing, saying to me, “Rise, put on the robe of the priesthood, and the crown of righteousness, and the oracle of understanding, and the full-length robe of truth, and the plate of faith, and the turban of the head, and the ephod of prophecy.” 3 And each one of them was carrying these things, and they put them on me and said to me, “From now on, become a priest—you and all your seed.”


    4 And the first anointed me with holy oil and gave me a priestly staff. 5 And the second washed me with pure water of the Lord, and fed me holy bread and wine, and put around me a holy and glorious robe. 6 And the third put on me a linen garment, like an ephod. 7 And the fourth wrapped around me a girdle, like purple. 8 And the fifth gave me a branch of rich olive. 9 And the sixth placed a crown on my head. 10 And the seventh put on me a diadem of priesthood and filled my hands with incense, so that I might serve as priest before the Lord God.


    11 And they say to me, “Levi, your seed will be divided into three offices, for a sign of the glory of the Lord who is coming. 12 And the first lot will be great; none will arise greater than it. 13 And the second will be in priesthood. 14 And the third will be called by a new name, because a king will arise from Judah and will establish a new priesthood, after the pattern of the nations, for all the nations. 15 And his presence is beloved, like a prophet of the Most High, from the seed of Abraham our father. 16 Therefore every desirable thing in Israel will be for you and for your seed, and your seed will eat every beautiful thing, and will apportion the table of the Lord. 17 And from among them there will be priests and judges and scribes, and by their mouth the holy thing will be received.”


    18 So when I awoke, I understood that this was like the first vision.'
translation:
  language: ru
  text: '1 И там я вновь увидел видение, подобное прежнему, после того как мы пробыли там семьдесят дней. 2 Я увидел семь мужей в белых одеждах. Они сказали мне: «Встань и облачись в одеяние священства, надень венец праведности, нагрудник разумения, длинное одеяние истины, налобную пластину веры, головной тюрбан[a] и эфод пророчества». 3 Каждый из них держал эти вещи; они возложили их на меня и сказали: «Отныне стань священником — ты и всё твоё потомство».


    4 Первый помазал меня святым маслом и дал мне жезл. 5 Второй омыл меня чистой водой Господа, накормил святым хлебом и напоил святым вином, а затем облачил меня в святое и славное одеяние. 6 Третий надел на меня льняное одеяние, подобное эфоду. 7 Четвёртый опоясал меня поясом, подобным пурпуру. 8 Пятый дал мне ветвь тучной маслины[b]. 9 Шестой возложил мне на голову венец. 10 Седьмой возложил на меня священническую диадему и наполнил мои руки благовониями, чтобы я служил священником Господу Богу.


    11 Они сказали мне: «Левий, твоё потомство разделится на три чина[c] в знак славы грядущего Господа. 12 Первый удел будет велик, и выше него не возникнет другого. 13 Второй будет пребывать в священстве. 14 Третий будет назван новым именем, потому что из Иуды восстанет царь и учредит новое священство — по образцу народов, для всех народов[d]. 15 Его явление будет желанным, как явление пророка Всевышнего из потомства Авраама, отца нашего[e]. 16 Поэтому всё желанное в Израиле будет принадлежать тебе и твоему потомству; вы будете вкушать всё прекрасное на вид, и твоё потомство будет делить трапезу Господа. 17 Среди них будут священники, судьи и книжники, и по слову их будет принято святое[f]».


    18 Пробудившись, я понял, что это видение подобно первому.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тюрбан головы»; слова «головы» в греческом тексте, вероятно, являются повреждённым или избыточным чтением.'
    reason: Текстологически сомнительная фраза отмечена в издании крестами.
  - marker: b
    text: 'Буквально: «ветвь маслины тучности»; вероятный смысл — ветвь плодородной, богатой маслом маслины.'
    reason: Сохраняет необычный образ и поясняет неестественную для русского буквальную конструкцию.
  - marker: c
    text: Греческое слово может означать также «начала», «власти», «первенства» или «области служения».
    reason: Значение ἀρχαί в данном пророческом контексте не вполне определённо.
  - marker: d
    text: Выражение «по образцу народов, для всех народов» допускает разные синтаксические и смысловые толкования.
    reason: Неясно, относится ли оборот к устройству нового священства, его сфере служения или к обоим.
  - marker: e
    text: 'Греческая фраза сжата и допускает также передачу: «Его присутствие желанно, словно пророк Всевышнего…»'
    reason: Синтаксическая связь сравнительного оборота ὡς προφήτης с παρουσία и подразумеваемым лицом неоднозначна.
  - marker: f
    text: 'Или: «святыня»; греческий текст этого места, вероятно, повреждён, и точный смысл выражения неясен.'
    reason: Издание отмечает глагольную фразу как сомнительную, а τὸ ἅγιον допускает несколько переводов.
lexical_decisions:
- source_word: λόγιον
  choice: нагрудник
  rationale: В перечне священнических облачений слово обозначает нагрудник первосвященника (ср. LXX Исх. 28), а не отвлечённое «изречение» или «оракул».
- source_word: ποδήρη
  choice: длинное одеяние
  rationale: Передаёт основное значение одежды, доходящей до ног, естественно и без излишней технической архаики.
- source_word: πέταλον
  choice: налобная пластина
  rationale: Это металлическая пластина священнического убора; «пластина» точнее общего «знак».
- source_word: ῥάβδον
  choice: жезл
  rationale: Греческий текст говорит просто о жезле; определение «священнический» не добавлено.
- source_word: κλάδον ... ἐλαίας ... πιότητος
  choice: ветвь тучной маслины
  rationale: Сохраняет необычную конструкцию источника и образ маслины, богатой соком и плодом.
- source_word: ἀρχὰς
  choice: чины
  rationale: В контексте трёх групп или служений потомства «чины» понятно передаёт институциональный смысл, не сводя его исключительно к должностям.
- source_word: παρουσία
  choice: явление
  rationale: Сохраняет широкий смысл присутствия или явления и не закрепляет позднейшее техническое толкование словом «пришествие».
- source_word: τὴν τράπεζαν Κυρίου διανεμεῖται
  choice: будет распределять пищу со стола Господа
  rationale: Глагол означает распределять или уделять; добавление «пищу» делает русскую фразу понятной, не меняя храмового образа.
theological_decisions:
- issue: К кому относится пророчество о царе и новом священстве в стихах 14–15
  choice: Сохранено местоименное и образное описание без отождествления с конкретной фигурой.
  alternative: Прямо назвать мессию или определённого исторического первосвященника.
  rationale: Сам греческий текст не даёт имени, а его синтаксис допускает напряжение между царской, священнической и пророческой ролями.
- issue: «По образцу народов» в стихе 14
  choice: Формулировка сохранена буквально и снабжена примечанием о неоднозначности.
  alternative: Истолковать как священство «среди язычников» либо «по чину Мелхиседека».
  rationale: Ни одно из таких уточнений прямо не выражено в данном греческом тексте.
- issue: τὸ ἅγιον в стихе 17
  choice: «святое»
  alternative: «святость», «святыня» или «Святой Дух».
  rationale: Субстантивированное среднее прилагательное неоднозначно; нейтральная передача не навязывает предметного или пневматологического прочтения.
translation_notes:
  register: Современный литературный русский с достоинством древнего завещательного видения. Сохранены библейские термины «эфод», «жезл», «венец», «диадема», «книжники», но синтаксис сделан доступным обычному читателю. «Потомство» предпочтено буквальному и потенциально двусмысленному «семя».
