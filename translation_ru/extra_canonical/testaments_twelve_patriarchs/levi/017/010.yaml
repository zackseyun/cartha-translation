source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καὶ ἐν τῇ πέμπτῃ⁴⁷ ἑβδομάδι⁴⁸ ἐπιστρέψουσιν εἰς γῆν ἐρημώσεως αὐτῶν, καὶ⁴⁹ ἀνακαινοποιήσουσιν οἶκον κυρίου⁵⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/010.yaml
  text: And in the fifth week they will return to the land of their desolation, and they will renew the house of the Lord.
translation:
  language: ru
  text: И в пятую седмицу они возвратятся в землю своего запустения и обновят дом Господа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑβδομάδι
  choice: седмицу
  rationale: В данном апокалиптическом хронологическом контексте слово обозначает период-седмицу; «седмица» сохраняет смысл и возвышенный библейский регистр лучше, чем бытовое «неделя».
- source_word: γῆν ἐρημώσεως αὐτῶν
  choice: землю своего запустения
  rationale: Родительная конструкция передана без уточнения причины или принадлежности запустения, сохраняя емкость греческого выражения.
- source_word: ἀνακαινοποιήσουσιν
  choice: обновят
  rationale: Передает восстановление или обновление без чрезмерного уточнения как «перестроят» либо «освятят заново».
- source_word: οἶκον κυρίου
  choice: дом Господа
  rationale: Буквально сохраняет храмовое обозначение и традиционную библейскую формулу.
theological_decisions:
- issue: Значение «дома Господа»
  choice: дом Господа
  alternative: храм Господа
  rationale: Оставлена исходная метафора οἶκος, хотя по контексту речь, вероятно, идет о храме; это сохраняет формальную и богословскую широту выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Союз «и» сохранен в начале в соответствии с последовательным повествованием оригинала.
