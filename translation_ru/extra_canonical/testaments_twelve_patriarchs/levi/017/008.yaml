base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/008.yaml
  text: But in the seventh there will be defilement, which I cannot speak of before men, because those who do these things will know them.
translation:
  language: ru
  text: Но в седьмом будет осквернение, о котором я не могу сказать в присутствии людей, потому что сами совершающие это будут знать.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν δὲ τῷ ἑβδόμῳ
  choice: Но в седьмом
  rationale: 'Сохранена эллиптичность греческого текста: подразумеваемое существительное не добавлено, поскольку ближайший контекст данного фрагмента не представлен.'
- source_word: μιασμός
  choice: осквернение
  rationale: Передаёт религиозно-нравственный смысл загрязнения или нечистоты, не конкретизируя её характер.
- source_word: ἐνώπιον ἀνθρώπων
  choice: перед людьми
  rationale: Естественный современный русский эквивалент с сохранением значения открытого произнесения в присутствии людей.
- source_word: αὐτοὶ γνώσονται
  choice: сами узнают
  rationale: «Сами» передаёт эмфатическое αὐτοί; будущее «узнают» сохраняет форму γνώσονται и не заменяет её более определённым «знают».
- source_word: οἱ ποιοῦντες αὐτά
  choice: совершающие это
  rationale: Причастная конструкция сохранена; множественное αὐτά идиоматично передано собирательным «это», без добавления конкретных названий деяний.
theological_decisions:
- issue: Характер осквернения
  choice: Оставить без уточнения
  alternative: «греховное осквернение», «ритуальная нечистота» или перечисление деяний
  rationale: Греческое μιασμός само по себе не устанавливает здесь точный вид нечистоты; конфессиональная или нравственная конкретизация сузила бы смысл.
- issue: Референт «седьмого»
  choice: Сохранить субстантивированное «в седьмом»
  alternative: Добавить «в седьмом священстве/поколении/периоде»
  rationale: В предоставленной строке существительное отсутствует, поэтому перевод сохраняет исходную эллиптичность и не разрешает её предположительно.
translation_notes:
  register: Современный литературный русский язык, сдержанный и возвышенный без архаизмов. Синтаксис близок к греческому, но фраза сделана естественной для обычного читателя.
