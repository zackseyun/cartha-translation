  text: But the third priest will be taken away with grief.
translation:
  language: ru
  text: А третий священник будет унесён скорбью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ δὲ τρίτος ἱερεύς
  choice: А третий священник
  rationale: Частица δέ передана естественным русским связующим «а», сохраняющим переход и лёгкое противопоставление; порядковое определение и существительное переведены прямо.
- source_word: λύπῃ
  choice: скорбью
  rationale: Дательный падеж может обозначать средство или сопутствующее обстоятельство. Творительный «скорбью» сохраняет краткость и допускает обе смысловые грани, не уточняя сверх текста, была ли скорбь причиной или сопровождением.
- source_word: παραληφθήσεται
  choice: будет унесён
  rationale: Будущее страдательное от παραλαμβάνω передано как удаление/взятие пассивным действием. «Будет унесён» естественно сочетается со «скорбью» и не вводит явно ни смерть, ни божественное восхищение.
theological_decisions:
- issue: Смысл удаления третьего священника
  choice: Не уточнять, означает ли «будет унесён» смерть, отстранение или иное удаление.
  alternative: «умрёт от скорби» / «будет взят»
  rationale: Греческий глагол сам по себе не называет смерть и не указывает действующего; конкретизация сняла бы присущую тексту неоднозначность.
translation_notes:
  register: Краткая, торжественная синтаксическая конструкция в современном литературном русском. Архаизмы и конфессионально окрашенные уточнения исключены.
