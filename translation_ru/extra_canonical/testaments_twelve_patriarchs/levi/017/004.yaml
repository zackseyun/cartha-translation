  source_fidelity: '«А третий священник будет унесён скорбью» точно передаёт Ὁ δὲ τρίτος ἱερεύς λύπῃ παραληφθήσεται: сохранены связующее δέ, порядковое определение, будущее пассивное значение παραληφθήσεται и дативное λύπῃ без неоправданного уточнения механизма или действующего лица. Оборот не сводит «взятие/удаление» прямо к смерти.'
