source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καὶ ὅτι ἠκούσατε¹ περὶ τῶν ἑβδομήκοντα² ἑβδομάδων³, ἀκούσατε καὶ⁴ περὶ τῆς ἱερωσύνης⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/001.yaml
  text: And since you have heard about the seventy weeks, hear also about the priesthood.
translation:
  language: ru
  text: И поскольку вы слышали о семидесяти седминах, послушайте также о священстве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑβδομήκοντα ἑβδομάδων
  choice: семидесяти седминах
  rationale: Сочетание буквально означает «семьдесят семёрок/недель». «Седмина» сохраняет апокалиптическую и библейскую многозначность периода, не сводя его непременно к обычной календарной неделе.
- source_word: ἱερωσύνης
  choice: священстве
  rationale: Передаёт как священническое служение, так и институт священства, сохраняя широту греческого существительного.
- source_word: ἀκούσατε
  choice: послушайте
  rationale: Естественный русский императив, здесь означающий призыв внимательно выслушать последующее.
- source_word: καὶ ὅτι
  choice: И поскольку
  rationale: Сохраняет соединительную и причинно-обстоятельственную связь с предшествующим рассуждением.
theological_decisions:
- issue: Характер «семидесяти седмин»
  choice: Оставлена формулировка «семьдесят седмин» без указания длительности каждой седмины.
  alternative: «семьдесят недель» или истолковывающее «семьдесят семилетий»
  rationale: Греческий текст не уточняет, следует ли понимать периоды как буквальные недели или символические/годовые циклы; перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно библейским словом «седмина». Синтаксис близок к греческому, но естественен для чтения вслух.
