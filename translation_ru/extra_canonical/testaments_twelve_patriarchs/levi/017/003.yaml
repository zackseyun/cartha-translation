base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/003.yaml
  text: In the second jubilee, the anointed one will be seized in mourning for a beloved one, and his priesthood will be honored, and he will be glorified by all.
translation:
  language: ru
  text: Во время второго юбилея помазанник будет схвачен во время скорби по любимому, и его священство будет в чести, и все прославят его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν τῷ δευτέρῳ ἰωβηλαίῳ
  choice: Во втором юбилее
  rationale: Прямо передаёт временную формулу и сохраняет специальный термин «юбилей».
- source_word: ὁ χριόμενος
  choice: помазанник
  rationale: Субстантивированное причастие буквально означает «тот, кого помазывают / помазанный»; «помазанник» естественно и не требует преждевременно превращать выражение в титул «Мессия».
- source_word: ἐν πένθει ἀγαπητοῦ
  choice: во время скорби по любимому
  rationale: Родительный ἀγαπητοῦ допускает понимание любимого лица как предмета скорби; формулировка сохраняет отсутствие уточнения, кто именно назван любимым.
- source_word: συλληφθήσεται
  choice: будет схвачен
  rationale: Будущее страдательного залога от συλλαμβάνω здесь естественнее всего передать как насильственное задержание или пленение, а не как зачатие.
- source_word: ἡ ἱερωσύνη αὐτοῦ τιμία
  choice: священство его будет в чести
  rationale: Передаёт предикативное τιμία как признанную ценность и почёт, сохраняя отдельный акцент на его священстве.
- source_word: παρὰ πάντων δοξασθήσεται
  choice: все прославят его
  rationale: Естественная русская активная перестройка греческого пассива с указанием действующих лиц; значение всеобщего прославления сохранено.
theological_decisions:
- issue: Статус выражения ὁ χριόμενος
  choice: помазанник
  alternative: тот, кого помазывают; Помазанник; Мессия
  rationale: Выбор сохраняет культово-служебный и потенциально мессианский смысл, но не навязывает ни титульную капитализацию, ни прямое отождествление с Мессией.
- issue: Связь ἀγαπητοῦ со скорбью
  choice: скорбь по любимому
  alternative: скорбь любимого; скорбь из-за возлюбленного
  rationale: Контекстуально наиболее естественно понимать родительный как указание на того, по кому скорбят, однако личность любимого оставлена неопределённой.
translation_notes:
  register: Современный литературный русский с достоинством завещательно-пророческой речи. Синтаксис слегка ритмизован повтором «и», соответствующим греческому тексту, но без архаизмов.
