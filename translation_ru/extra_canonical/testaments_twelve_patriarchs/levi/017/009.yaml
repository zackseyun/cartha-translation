  text: Поэтому они будут в плену и станут добычей, а их земля и имущество будут уничтожены.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αἰχμαλωσίᾳ
  choice: в плену
  rationale: Естественно и точно передаёт состояние плена, сохраняя предложную конструкцию источника.
- source_word: ἐν προνομῇ
  choice: будут разграблены
  rationale: Греческое существительное обозначает разграбление или добычу; глагольная передача по-русски ясно выражает участь людей и избегает неестественного «в разграблении».
- source_word: ἡ ὕπαρξις
  choice: имущество
  rationale: В данном сочетании слово означает наличное достояние, собственность; «имущество» — современный и контекстуально точный эквивалент.
- source_word: ἀφανισθήσεται
  choice: будут уничтожены
  rationale: Передаёт полное исчезновение или истребление земли и имущества; множественное число требуется русским составным подлежащим.
