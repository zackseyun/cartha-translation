base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/005.yaml
  text: And the fourth will be in pains, because lawlessness will increase upon him to abundance, and all Israel will hate each one his neighbor.
translation:
  language: ru
  text: А четвёртый будет в муках, потому что при нём беззаконие чрезвычайно умножится, и все в Израиле возненавидят — каждый своего ближнего.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ὀδύναις
  choice: в муках
  rationale: Передаёт состояние тяжёлого страдания; множественное число греческого выражения естественно воспроизводится русским устойчивым оборотом.
- source_word: ἡ ἀδικία
  choice: беззаконие
  rationale: В данном контексте речь идёт не просто об отдельной несправедливости, а о широко распространившемся нравственном нарушении; «беззаконие» сохраняет эту силу и соответствует контексту эпох священства.
- source_word: προσθήσει ... εἰς πλῆθος
  choice: чрезвычайно умножится
  rationale: Греческая конструкция буквально выражает возрастание до множества; выбранная формулировка естественна по-русски и сохраняет идею резкого количественного роста.
- source_word: ἐπ’ αὐτῷ
  choice: при нём
  rationale: Местоимение может относиться к четвёртому периоду либо его представителю; «при нём» сохраняет эту референциальную открытость лучше, чем причинное или направительное толкование.
- source_word: ἕκαστος τὸν πλησίον αὐτοῦ
  choice: каждый ... своего ближнего
  rationale: Близко передаёт распределительную конструкцию оригинала и сохраняет традиционно понятное, но современное слово «ближний».
theological_decisions:
- issue: Характер ἀδικία
  choice: беззаконие
  alternative: неправедность / несправедливость
  rationale: «Беззаконие» здесь обозначает общее нравственное разложение, не сводя смысл исключительно к юридической несправедливости и не вводя конфессионального толкования.
- issue: Референт выражения ἐπ’ αὐτῷ
  choice: при нём
  alternative: на нём / в его время
  rationale: Формулировка не решает принудительно, означает ли «четвёртый» период, священство или отдельного носителя власти.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего пророческого изложения. Тире выделяет пояснительное распределительное «каждый», сохраняя смысл, что ненависть охватит Израиль на уровне отношений между людьми.
