  source_fidelity: '«В муках», «при нём» и «беззаконие ... умножится» в целом точно передают ἐν ὀδύναις, ἐπ’ αὐτῷ и ἡ ἀδικία ... προσθήσει εἰς πλῆθος. «При нём» удачно сохраняет неуточнённый референт местоимения. Однако заключительная конструкция должна яснее передавать πᾶς Ἰσραὴλ ... ἕκαστος τὸν πλησίον αὐτοῦ: речь о всеобщей взаимной ненависти среди Израиля, распределённой как «каждый — своего ближнего».'
  naturalness: 'Сочетание «весь Израиль — каждый возненавидит» синтаксически сбито: коллективное подлежащее «весь Израиль» сталкивается с выделенным одиночным «каждый». «Все в Израиле возненавидят — каждый своего ближнего» естественно для современного литературного русского и сохраняет распределительный акцент оригинала.'
  terminology: «Беззаконие» допустимо для ἀδικία в пророческом контексте и не требует замены. «Ближний» точно передаёт πλησίον и уместен в данном регистре. «Муки» адекватно передают ὀδύναις.
