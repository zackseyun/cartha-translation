lexical_decisions:
- source_word: Ὁ πέμπτος
  choice: Пятый
  rationale: Сохранено субстантивированное порядковое числительное мужского рода; контекст подразумевает пятого священника.
- source_word: ἐν σκότει
  choice: во тьме
  rationale: Прямо передаёт обстоятельственный оборот, не устраняя возможной образности слова σκότος.
- source_word: παραληφθήσεται
  choice: будет взят
  rationale: Пассивная форма будущего времени сохранена; нейтральное «взят» не уточняет ни действующее лицо, ни характер взятия.
theological_decisions:
- issue: Смысл выражения «будет взят»
  choice: Сохранить неопределённую пассивную конструкцию
  alternative: «будет унесён», «будет отстранён» или «будет схвачен»
  rationale: Греческий глагол допускает разные контекстуальные оттенки, а краткая фраза не даёт оснований однозначно выбрать один из них.
- issue: Значение тьмы
  choice: Передать буквально как «во тьме»
  alternative: Истолковать как духовную тьму, безвестность или бедствие
  rationale: Источник не поясняет природу тьмы, поэтому перевод сохраняет богословскую и образную неоднозначность.
translation_notes:
  register: Краткая, естественная и торжественно-нейтральная формулировка; синтаксический параллелизм и лаконичность греческого текста сохранены.
