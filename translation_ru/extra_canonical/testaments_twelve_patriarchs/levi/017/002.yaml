source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καθ’ ἕκαστον γὰρ ἰωβηλαῖον⁶ ἔσται ἱερωσύνη⁷. Καὶ⁸ ἐν τῷ⁹ πρώτῳ ἰωβηλαίῳ ὁ *χριόμενος πρῶτος¹⁰ εἰς ἱερωσύνην *ἔσται μέγας¹¹, καὶ λαλήσει¹² Θεῷ ὡς πατρί· καὶ ἡ ἱερωσύνη αὐτοῦ πλήρης μετὰ¹³ κυρίου· [καὶ ἐν ἡμέραις¹⁴ χαρᾶς αὐτοῦ¹⁵ *ἐπὶ σωτηρίᾳ¹⁶ κόσμου *αὐτὸς ἀναστήσεται]¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/002.yaml
  text: For in each jubilee there will be a priesthood. And in the first jubilee, the one first anointed for the priesthood will be great, and he will speak to God as to a father; and his priesthood will be full with the Lord. [And in the days of his joy, he will arise for the salvation of the world.]
translation:
  language: ru
  text: Ибо в каждый юбилей будет священство. И в первый юбилей тот, кто первым будет помазан для священства, будет велик и будет говорить Богу, как отцу; и его священство будет в полноте с Господом. [И в дни его радости он восстанет ради спасения мира.][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Заключительная фраза заключена в квадратные скобки в греческом издании, что указывает на неуверенность в её текстуальной принадлежности.
    reason: Сохранение обозначенной источником текстологической неопределённости.
lexical_decisions:
- source_word: Καθ’ ἕκαστον ... ἰωβηλαῖον
  choice: в каждый юбилей
  rationale: Передаёт распределительное значение выражения естественным современным русским языком.
- source_word: ἱερωσύνη
  choice: священство
  rationale: Сохраняет возможное значение как священнического служения или института, не сужая его до отдельного священника.
- source_word: ὁ χριόμενος πρῶτος εἰς ἱερωσύνην
  choice: тот, кто первым будет помазан на священство
  rationale: Отражает причастную конструкцию, первенство помазания и направленность εἰς ἱερωσύνην.
- source_word: πλήρης μετὰ κυρίου
  choice: исполнено Господом
  rationale: Буквальное «полно с Господом» неестественно по-русски; формулировка сохраняет образ полноты и непосредственную связь священства с Господом, не добавляя конфессиональной терминологии.
- source_word: ἐπὶ σωτηρίᾳ κόσμου
  choice: ради спасения мира
  rationale: Естественно передаёт целевое значение ἐπί с дательным в данном контексте.
- source_word: ἀναστήσεται
  choice: восстанет
  rationale: 'Сохраняет неоднозначность глагола: он может означать «встанет/явится» и в соответствующем контексте допускать оттенок воскресения.'
theological_decisions:
- issue: Отношение помазанника к Богу
  choice: будет говорить с Богом как с отцом
  alternative: будет говорить Богу как отцу
  rationale: Сохраняет сравнительное ὡς πατρί и личностную близость, не превращая сравнение в более определённое утверждение о статусе.
- issue: Значение ἀναστήσεται
  choice: восстанет
  alternative: воскреснет
  rationale: «Воскреснет» однозначно задавало бы воскресение, тогда как греческий глагол здесь допускает более широкий смысл; сохранена богословская напряжённость.
- issue: Текстуальный статус заключительной фразы
  choice: сохранить квадратные скобки и снабдить примечанием
  alternative: включить фразу без обозначения
  rationale: Квадратные скобки исходного издания указывают на текстуальную неуверенность, которую нельзя скрывать в переводе.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего завещательного пророчества. Синтаксис сделан понятным для обычного читателя; сохранены повтор союза «и», ключевой термин «священство», образ помазания и неоднозначность глагола «восстанет».
