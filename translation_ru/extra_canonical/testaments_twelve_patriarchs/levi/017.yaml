base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017.yaml
  text: 'And since you have heard about the seventy weeks[1], hear also about the priesthood. For in each jubilee there will be a priesthood. In the first jubilee, the one first anointed for the priesthood will be great, and he will speak to God as to a father; and his priesthood will be complete with the Lord. [And in the days of his joy he will arise for the salvation of the world.]


    In the second jubilee, the one anointed will be conceived in the sorrow of a beloved one, and his priesthood will be honored, and he will be glorified by all.


    But the third priest will be taken in grief. And the fourth will be in pains, because unrighteousness will increase upon him in abundance, and all Israel will hate, each one, his neighbor. The fifth will be taken in darkness. Likewise also the sixth and the seventh.


    But in the seventh there will be a defilement which I cannot speak of before men, for those who do these things will know them. Therefore they will be in captivity and in plundering, and their land and their possessions will be destroyed.


    And in the fifth week they will return to the land of their desolation[4][3][2], and they will renew the house of the Lord.'
translation:
  language: ru
  text: '**17**


    **1** И поскольку вы слышали о семидесяти седминах[a], послушайте также о священстве. **2** Ибо в каждый юбилей будет священство. В первый юбилей тот, кто первым будет помазан на священство, станет великим и будет говорить с Богом как с отцом; и его священство достигнет полноты с Господом. [И в дни своей радости он восстанет ради спасения мира.][b]


    **3** Во второй юбилей помазанный будет зачат в скорби возлюбленного; его священство будет почитаемо, и все прославят его.


    **4** Третий же священник будет взят в скорби. **5** А четвёртый будет в мучениях, потому что беззаконие во множестве умножится против него, и весь Израиль — каждый — возненавидит своего ближнего. **6** Пятый будет взят во тьме. **7** Так же и шестой, и седьмой.


    **8** Но в седьмом будет осквернение[c], о котором я не могу говорить перед людьми, ибо совершающие это сами будут знать. **9** Поэтому они окажутся в плену и среди грабежа, а их земля и имущество будут уничтожены.


    **10** И в пятую седмину они возвратятся в свою разорённую землю и обновят дом Господа[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Семьдесят седмин» — отзвук апокалиптического исчисления времени, известного по книге Даниила; автор предполагает, что слушатели уже слышали предшествующее объяснение.
    reason: cross_reference
  - marker: b
    text: Фраза «И в дни своей радости он восстанет ради спасения мира» текстологически не вполне надёжна в использованной здесь греческой традиции и может быть позднейшим расширением; поэтому она сохранена в квадратных скобках.
    reason: textual_variant
  - marker: c
    text: Слово «осквернение» здесь может иметь и культовый, и нравственный смысл, особенно в контексте порчи священства.
    reason: lexical_alternative
  - marker: d
    text: Слова «обновят дом Господа» могут подразумевать восстановление или отстройку храма после разорения.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑβδομήκοντα ἑβδομάδων
  choice: семидесяти седминах
  rationale: «Седмины» сохраняют апокалиптическую формулу, созвучную книге Даниила, и не сводят единицы счёта к обычным календарным неделям.
- source_word: ἱερωσύνη
  choice: священство
  rationale: Передаёт как священническое служение, так и соответствующий институт, не сужая значение до должности отдельного лица.
- source_word: ἰωβηλαῖον
  choice: юбилей
  rationale: Сохраняет календарно-пророческий термин и последовательность периодов исходного текста.
- source_word: χριόμενος
  choice: тот, кто будет помазан / помазанный
  rationale: Передаёт причастие в непосредственном священническом контексте, не превращая его без достаточного основания в титул «Помазанник».
- source_word: λαλήσει Θεῷ ὡς πατρί
  choice: будет говорить с Богом как с отцом
  rationale: Сохраняет выразительное сыновнее сравнение и естественно звучит по-русски.
- source_word: πλήρης μετὰ κυρίου
  choice: его священство достигнет полноты с Господом
  rationale: Греческое выражение сжато и необычно. Перевод сохраняет идею полноты и связь «с Господом», не заменяя её более определённым толкованием вроде «будет совершенно перед Господом».
- source_word: ἐπὶ σωτηρίᾳ κόσμου
  choice: ради спасения мира
  rationale: Естественно передаёт целевое значение оборота; текстовая неуверенность всей фразы обозначена скобками и примечанием.
- source_word: συλληφθήσεται
  choice: будет зачат
  rationale: В контексте последовательности священников значение зачатия вероятнее значений «будет схвачен» или «будет принят», хотя необычность сочетания сохранена.
- source_word: ἐν πένθει ἀγαπητοῦ
  choice: в скорби любимого
  rationale: Сохраняет неоднозначность родительного падежа и не уточняет, кто именно является любимым и кому принадлежит скорбь.
- source_word: τιμία
  choice: будет почитаемо
  rationale: В отношении священства передаёт общественное уважение точнее, чем буквальное «драгоценно».
- source_word: παραληφθήσεται
  choice: будет взят
  rationale: Сдержанный перевод сохраняет неясность пассивной формы, не подменяя её толкованием «будет охвачен» или «будет унесён».
- source_word: ὀδύναις
  choice: в мучениях
  rationale: Передаёт сильную боль и страдание, не ограничивая их исключительно телесным смыслом.
- source_word: μιασμός
  choice: осквернение
  rationale: Слово допускает одновременно культовый и нравственный смысл, особенно в повествовании об упадке священства.
- source_word: ἀνακαινοποιήσουσιν οἶκον κυρίου
  choice: обновят дом Господа
  rationale: Сохраняет широкий смысл восстановления или обновления храма после запустения, не навязывая исключительно полную перестройку.
theological_decisions:
- issue: Возможный вторичный характер заключительной фразы стиха 2
  choice: 'Фраза переведена и оставлена в квадратных скобках: «[И в дни своей радости он восстанет ради спасения мира.]»'
  alternative: Опустить её как позднюю вставку либо включить без скобок как бесспорную часть текста.
  rationale: Предоставленный греческий источник сам отмечает этот отрывок скобками. Перевод прозрачно сохраняет его, не решая текстологический вопрос за читателя.
- issue: Отождествление священников и пророческих периодов с конкретными историческими лицами
  choice: Последовательность передана как данная в тексте схема юбилеев и седмин без исторических имён.
  alternative: Прямо отождествить каждого священника с определённой исторической фигурой либо истолковать всех только как символические эпохи.
  rationale: Сам греческий текст не называет этих лиц. Внесение конкретных отождествлений устранило бы сохраняемую источником историко-богословскую неоднозначность.
- issue: Возможные мессианские оттенки χριόμενος и фразы о спасении мира
  choice: Χριόμενος передано описательно как священническое помазание, а фраза о спасении мира переведена буквально и отмечена как текстологически сомнительная.
  alternative: Использовать титул «Помазанник» и тем самым прямо обозначить мессианское прочтение.
  rationale: Контекст непосредственно говорит о поставлении на священство. Перевод не исключает более широкого богословского прочтения, но и не встраивает его в терминологию текста.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. «Седмина» сохранена как понятный в апокалиптическом контексте специальный термин; архаические синтаксические обороты сведены к минимуму. Необычные и неоднозначные выражения оригинала не сглажены до однозначного исторического или конфессионального толкования.
