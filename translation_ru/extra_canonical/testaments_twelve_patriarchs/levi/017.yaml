  rationale: Исправлены две смысловые точки, в которых черновик либо сглаживал синтаксическую направленность греческого текста, либо создавал неестественную русскую конструкцию. Скобки и примечание к сомнительной фразе ст. 2, терминология пророческого счёта и неидентифицированная последовательность священников сохранены. В ст. 5 «против него» является несколько более конкретным, чем греческое ἐπ’ αὐτῷ, но точнее сохраняет неблагоприятную направленность, чем временное «при нём».
