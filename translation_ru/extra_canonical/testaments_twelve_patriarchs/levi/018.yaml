  revised_text: 1 После того как Господь совершит над ними возмездие, священство прекратится. 2 Тогда Господь воздвигнет нового священника, которому будут открыты все слова Господа; и он будет много дней вершить на земле суд истины. 3 Его звезда взойдёт на небе, как царь, озаряя светом знания, подобно солнцу днём, и он возвеличится во всём обитаемом мире. 4 Он воссияет, как солнце над землёй, рассеет всю тьму под небом, и по всей земле воцарится мир. 5 Небеса будут ликовать в его дни, земля возрадуется, и облака будут веселиться; ангелы славы пред лицом Господа возрадуются о нём.[a] 6 Небеса откроются, и из храма славы на него сойдёт освящение, сопровождаемое отеческим голосом, подобным голосу Авраама, обращённому к Исааку. 7 Над ним будет провозглашена слава Всевышнего, и дух разумения и освящения почиет на нём.[b] 8 Ибо он навеки передаст своим сыновьям величие Господа в истине, и не будет ему преемника из поколения в поколение, вовеки. 9 Во время его священства народы умножатся в знании
