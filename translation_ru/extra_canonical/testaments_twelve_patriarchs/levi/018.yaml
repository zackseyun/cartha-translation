  text: 1 And after their vengeance has come from the Lord[5], the priesthood will fail. 2 Then the Lord will raise up a new priest, to whom all the words of the Lord will be revealed; and he will execute a judgment of truth upon the earth for many days. 3 And his star will rise in heaven like a king, giving light with the light of knowledge like the sun by day, and he will be magnified in the inhabited world. 4 He will shine forth like the sun upon the earth, and he will remove all darkness from under heaven, and there will be peace in all the earth. 5 The heavens will rejoice in his days, and the earth will be glad, and the clouds will rejoice; and the angels of the glory of the Lord's presence will be glad in him. 6 The heavens will be opened, and from the temple of glory sanctification will come upon him with a fatherly voice, as from Abraham to Isaac. 7 And the glory of the Most High will be spoken over him, and a spirit of understanding and sanctification will rest upon him. 8 For
    he will give the majesty of the Lord to his sons in truth forever, and there will be no successor to him for generation upon generation, forever. 9 And during his priesthood the nations will be multiplied in knowledge upon the earth, and they will be enlightened by the grace of the Lord. During his priesthood sin will fail, and the lawless will cease from evil. 10 And indeed he will open the gates of paradise, and he will remove the threatening sword against Adam. 11 And he will give the holy ones to eat from the tree of life, and the spirit of holiness will be upon them. 12 And Beliar will be bound by him, and he will give authority to his children to trample on evil spirits. 13 And the Lord will rejoice over his children, and he will take pleasure in his beloved ones forever. 14 Then Abraham and Isaac and Jacob will exult, and I will be glad[10][9b][9a][7], and all the holy ones will put on righteousness.
translation:
  language: ru
  text: 1 После того как Господь совершит над ними возмездие, священство прекратится. 2 Тогда Господь воздвигнет нового священника, которому будут открыты все слова Господа; и он будет много дней вершить на земле суд истины. 3 Его звезда взойдёт на небе, как царь, озаряя светом знания, подобно солнцу днём, и он возвеличится во всём обитаемом мире. 4 Он воссияет, как солнце над землёй, рассеет всю тьму под небом, и по всей земле воцарится мир. 5 Небеса будут ликовать в его дни, земля возрадуется, и облака будут веселиться; ангелы славы пред лицом Господа возрадуются о нём.[a] 6 Небеса откроются, и из храма славы на него сойдёт освящение, сопровождаемое отеческим голосом, подобным голосу Авраама, обращённому к Исааку. 7 Над ним будет провозглашена слава Всевышнего, и дух разумения и освящения почиет на нём.[b] 8 Ибо он навеки передаст своим сыновьям величие Господа в истине, и не будет ему преемника из поколения в поколение, вовеки. 9 Во время его священства народы умножатся в знании на земле
    и будут просвещены благодатью Господа.[c] Во время его священства исчезнет грех, и беззаконные перестанут творить зло.[d] 10 Он же откроет врата рая и отведёт меч, угрожающий Адаму.[e] 11 Он даст святым вкусить от дерева жизни, и дух святости будет на них. 12 Велиар будет связан им, а своим детям он даст власть попирать злых духов. 13 Господь возрадуется о своих детях и будет благоволить к своим возлюбленным вовеки. 14 Тогда возликуют Авраам, Исаак и Иаков, и я возрадуюсь, и все святые облекутся в праведность.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Некоторые рукописи добавляют: «И знание Господа изольётся на землю, как воды морей».'
    reason: textual_variant
  - marker: b
    text: 'Некоторые рукописи добавляют: «в воде».'
    reason: textual_variant
  - marker: c
    text: 'Некоторые рукописи добавляют: «Израиль же умалится в неведении и омрачится в скорби».'
    reason: textual_variant
  - marker: d
    text: 'Некоторые рукописи добавляют: «а праведные обретут покой в нём».'
    reason: textual_variant
  - marker: e
    text: Имеется в виду меч, поставленный стеречь путь к дереву жизни после изгнания Адама из Эдема (Быт. 3:24).
    reason: cross_reference
lexical_decisions:
- source_word: ἱερωσύνη
  choice: священство
  rationale: Передаёт как священническое служение, так и центральную для главы идею прекращения и обновления священства.
- source_word: ἱερέα καινόν
  choice: нового священника
  rationale: Сохраняет эпохальную новизну фигуры, не отождествляя её с конкретным лицом.
- source_word: κρίσιν ἀληθείας
  choice: суд истины
  rationale: Сохраняет необычную генитивную конструкцию и пророческую торжественность оригинала.
- source_word: οἰκουμένη
  choice: обитаемый мир
  rationale: Передаёт значение населённой земли, а не мира или космоса вообще.
- source_word: ἀναλάμψει
  choice: воссияет
  rationale: Естественно продолжает образный ряд звезды, света и солнца.
- source_word: ἁγίασμα
  choice: освящение
  rationale: Сохраняет абстрактный сакральный смысл, не уточняя природу нисходящего дара сверх текста.
- source_word: φωνῆς πατρικῆς
  choice: отеческий голос
  rationale: Передаёт отцовский характер голоса в достойном современном регистре.
- source_word: πνεῦμα συνέσεως καὶ ἁγιασμοῦ
  choice: дух разумения и освящения
  rationale: Сохраняет формально-пророческий характер пары понятий и не превращает её в позднейший фиксированный титул.
- source_word: μεγαλωσύνην
  choice: величие
  rationale: Передаёт божественное величие без ненужного усиления до более узкого понятия царского величества.
- source_word: διαδοχή
  choice: преемник
  rationale: Русская личная конструкция ясно выражает уникальность и непередаваемость служения.
- source_word: τὰ ἔθνη
  choice: народы
  rationale: Нейтрально передаёт внешний по отношению к Израилю круг народов, не навязывая поздней терминологии.
- source_word: φωτισθήσονται
  choice: будут просвещены
  rationale: Сохраняет одновременно познавательный и откровенческий оттенки образа света.
- source_word: Βελίαρ
  choice: Велиар
  rationale: Традиционная русская передача имени, сохраняющая его как личное обозначение противника.
theological_decisions:
- issue: Личность «нового священника»
  choice: Оставить обобщённое обозначение «новый священник»
  alternative: Назвать его Мессией, Христом либо историческим первосвященником
  rationale: Текст изображает единственную возвышенную священническую фигуру с космическими и спасительными чертами, но прямо её не отождествляет; перевод сохраняет эту напряжённость.
- issue: Текстуально неустойчивые добавления в стихах 5, 7 и 9
  choice: Вынести их в примечания
  alternative: Включить в основной текст
  rationale: Квадратные скобки в исходном издании указывают на сомнительность или вторичность фраз; примечания обеспечивают прозрачность.
- issue: πνεῦμα ἁγιωσύνης в стихе 11
  choice: «дух святости» со строчной буквы
  alternative: «Святой Дух»
  rationale: Фраза может иметь глубокое богословское значение, однако греческая формулировка не требует превращать её в однозначный позднейший тринитарный титул.
- issue: Субъект местоимений «его дети/сыновья»
  choice: Сохранить местоименную неоднозначность оригинала
  alternative: Явно отнести детей либо к Господу, либо к новому священнику
  rationale: Цепочка местоимений допускает смысловое напряжение; перевод не устраняет его посредством толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно возвышенным пророческим звучанием. Сохранены повторения «во время его священства», световая образность и богословски значимая местоименная неоднозначность. Текстуально сомнительные добавления вынесены в примечания; все маркеры примечаний присутствуют в основном тексте.
