  text: 1[a]. Therefore I, my children, have known that at the end of the ages you will act ungodly against the Lord, laying hands on him in wickedness, and among all the nations you will become a mockery[b]. 2. For our father Israel is pure from the ungodliness of the chief priests, who will lay their hands on the savior of the world. 3. For just as the sun is pure before the Lord upon the earth, so also...
translation:
  language: ru
  text: 1. Итак, дети мои, я знаю, что в конце веков вы будете поступать нечестиво против Господа, в злобе налагая руки [на Него][a], и станете посмешищем среди всех народов. 2. Ведь отец наш Израиль чист от нечестия первосвященников, [которые наложат руки на Спасителя мира][b]. 3. Ибо как солнце чисто пред Господом на земле[c], так и вы — светила Израиля, превыше всех народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «на Него» в предоставленном греческом тексте заключены в редакционные квадратные скобки, что указывает на текстологическую неуверенность.
    reason: textual_variant
  - marker: b
    text: Вся фраза «которые наложат руки на Спасителя мира» заключена в предоставленном греческом тексте в квадратные скобки и может быть более поздним расширением; здесь она переведена, поскольку присутствует в данном свидетельстве.
    reason: textual_variant
  - marker: c
    text: Греческий текст выражения «солнце чисто пред Господом на земле» отмечен издателем как повреждённый или неуверенный; перевод следует сохранившейся формулировке, не пытаясь её реконструировать.
    reason: textual_variant
lexical_decisions:
- source_word: ἔγνων
  choice: я знаю
  rationale: Греческий аорист здесь выражает обретённое и сохраняющееся знание; настоящее «я знаю» естественно передаёт результат без неуклюжего «я познал».
- source_word: ἐπὶ τὰ τέλη τῶν αἰώνων
  choice: при завершении веков
  rationale: Сохраняет эсхатологическое множественное число αἰώνων и передаёт временное значение выражения.
- source_word: ἀσεβήσετε ἐπὶ Κυρίου
  choice: будете поступать нечестиво против Господа
  rationale: Глагольная формулировка передаёт действие, а «против» соответствует враждебному контексту ἐπί.
- source_word: χεῖρας ἐπιβάλλοντες
  choice: поднимая руки на Него
  rationale: Русская библейская идиома сохраняет враждебный смысл, не уточняя, идёт ли речь о задержании или насилии.
- source_word: χλευασμός
  choice: посмешище
  rationale: Краткое и естественное русское обозначение того, кто стал предметом публичного осмеяния.
- source_word: καθαρός ἀπὸ τῆς ἀσεβείας
  choice: чист от нечестия
  rationale: Сохраняет нравственно-религиозную семантику обоих слов и их противопоставление.
- source_word: ἀρχιερέων
  choice: первосвященников
  rationale: Обычный русский библейский эквивалент множественного ἀρχιερεῖς в контексте храмового руководства.
- source_word: σωτῆρα τοῦ κόσμου
  choice: Спасителя мира
  rationale: Прямо передаёт греческое выражение; богословски значимое наименование не ослабляется и не истолковывается сверх текста.
- source_word: φωστῆρες τοῦ Ἰσραήλ
  choice: светила Израиля
  rationale: Сохраняет образ небесных светил и связь с предшествующим сравнением с солнцем.
- source_word: παρὰ πάντα τὰ ἔθνη
  choice: превыше всех народов
  rationale: Передаёт сравнительно-превосходящий смысл παρά с винительным, не заменяя его более нейтральным «среди».
theological_decisions:
- issue: К кому относится «на Него» в стихе 1
  choice: Местоимение сохранено с непосредственной отсылкой к Господу
  alternative: Истолковать как общее восстание против власти Господа либо прямо отождествить с последующим «Спасителем мира»
  rationale: Синтаксис связывает местоимение с Господом, однако текст сам не разъясняет соотношение этого наименования со «Спасителем мира»; напряжение сохранено.
- issue: Заключённая в скобки фраза о Спасителе мира в стихе 2
  choice: Включена в основной текст и отмечена сноской
  alternative: Исключить как позднейшее христианское расширение
  rationale: Фраза присутствует в предоставленном греческом тексте, хотя редакционные скобки указывают на её текстологическую неуверенность; её нельзя молча устранять.
- issue: Утверждение, что Израиль чист от нечестия первосвященников
  choice: Сохранено буквально без богословского сглаживания
  alternative: Пояснить как невиновность праотца Израиля в грехах его потомков
  rationale: Такое пояснение вероятно, но оно уже было бы интерпретацией; перевод сохраняет формулировку и внутреннее напряжение текста.
translation_notes:
  register: 'Современный литературный русский язык с умеренно библейским достоинством: «пред Господом», «светила Израиля», «Спаситель мира». Синтаксис упрощён лишь там, где это не снимает неоднозначности. В отличие от английского консультационного слоя, переведён весь предоставленный греческий текст стиха 3, который не обрывается после «так и».'
