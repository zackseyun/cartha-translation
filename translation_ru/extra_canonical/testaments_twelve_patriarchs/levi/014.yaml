  naturalness: Текст в целом естественен для современного литературного русского с умеренным библейским регистром. «В конце веков» звучит несколько естественнее, чем «при завершении веков». «Налагая руки» в данном контексте — ясная библейская формула; примечание не позволяет принять её за обрядовый жест.
  terminology: «Господь», «нечестие», «первосвященники», «Спаситель мира» и «светила Израиля» уместны и последовательно передают ключевую лексику. Скобочную фразу во 2-м стихе следует сохранить в основном тексте и отметить как возможное позднее расширение. Не следует согласовывать «Господа» в ст. 1 со «Спасителем мира» сверх того, что сообщает текст.
