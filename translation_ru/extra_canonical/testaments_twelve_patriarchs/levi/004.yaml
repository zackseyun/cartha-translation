- issue: Страдание Всевышнего в 4:1
  choice: при страдании Всевышнего
  alternative: из-за страдания, связанного со Всевышним
  rationale: Генитив τοῦ ὑψίστου естественнее всего выражает принадлежность страдания Всевышнему; формулировка сохранена без догматического объяснения.
- issue: Слово «сына» в 4:4
  choice: своего сына с текстологической сноской
  alternative: своего [сына] или без слова «сына»
  rationale: Слово присутствует в редакционном тексте в квадратных скобках и потому переведено, но его текстологическая неуверенность явно отмечена.
- issue: Предполагаемая вторичная фраза о распятии в 4:4
  choice: не включать в основной текст, привести в сноске
  alternative: 'включить: «Однако твои сыновья наложат на него руки, чтобы распять его»'
  rationale: В исходном издании вся фраза заключена в квадратные скобки, а проверенный консультационный слой её не принимает в основной текст; сноска сохраняет доступ к варианту.
- issue: Антецедент αὐτόν в 4:6
  choice: неуточнённое «его» со сноской
  alternative: «Сына», «Всевышнего» или «тебя»
  rationale: Греческое местоимение само по себе не называет референта; перевод не должен устранять эту неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством завещательного и апокалиптического жанра. Архаизмы ограничены устойчивыми библейскими выражениями («сыны человеческие», «перед его лицом»); местоимения, относящиеся к Богу, даны со строчной буквы, чтобы не добавлять в неоднозначных местах редакционного истолкования.
