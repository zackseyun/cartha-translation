- source_word: ἐν τῇ κολάσει
  choice: на ещё более тяжкое наказание
  rationale: Следует поддержанному редакционным текстом и консультационным слоем пониманию сравнительной степени, хотя передача чтения в предоставленном греческом тексте повреждена.
- source_word: λειτουργὸν τοῦ προσώπου αὐτοῦ
  choice: служителем перед его лицом
  rationale: Сохраняет образ лица/присутствия, не заменяя его конфессионально нагруженным термином.
- source_word: Φῶς γνώσεως φωτιεῖς ἐν τῷ Ἰακώβ
  choice: Ты воссияешь светом знания в Иакове
  rationale: Сохраняет световую метафору и местную конструкцию ἐν τῷ Ἰακώβ, избегая искусственного переходного оборота.
- source_word: ἐν σπλάγχνοις
  choice: в милосердии
  rationale: Передаёт идиоматическое значение внутренней, глубокой жалости, а не буквальное обозначение внутренностей.
- source_word: βουλὴ καὶ σύνεσις
  choice: мудрый совет и разумение
  rationale: Различает практическую рассудительность/совет и способность понимать.
