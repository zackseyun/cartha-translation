  rationale: Глагол передаёт не обычное угасание, а сжатие или отступление от страха; выбран естественный русский образ без сведения его к σβέννυμι, уже употреблённому о солнце.
- source_word: ᾅδου σκυλευομένου
  choice: ад подвергается разграблению
