base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/019.yaml
  text: '1[a]. And now, my children, you have heard everything. Choose for yourselves either the light or the darkness, either the law of the Lord or the works of Beliar[b].

    2. And his sons answered him, saying, “Before the Lord we will walk, and according to his law.”

    3. And their father said to them, “The Lord is witness, and his angels are witnesses, and you are witnesses, and I am a witness concerning the word of your mouth.” And his sons said to him[c], “Witnesses.”'
translation:
  language: ru
  text: '**19**


    **1.** И теперь, дети мои, вы всё услышали. Изберите для себя: либо свет, либо тьму, либо закон Господа, либо дела Велиара[a].


    **2.** Сыновья ответили ему: «Мы будем ходить перед Господом[b] и следовать Его закону».


    **3.** Их отец сказал им: «Господь — свидетель, и ангелы Его — свидетели, и вы — свидетели, и я — свидетель сказанного вашими устами». Сыновья сказали ему: «Свидетели».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Велиар — засвидетельствованная здесь форма имени, известного также как Велиал.
    reason: alternative_reading
  - marker: b
    text: «Ходить перед Господом» — библейское выражение, означающее жить перед Богом, сознавая свою ответственность перед Ним и повинуясь Ему.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐκλέξασθε ἑαυτοῖς
  choice: Изберите для себя
  rationale: Средний залог повелительного наклонения передаёт личный, обязывающий характер выбора; формулировка сохраняет торжественный регистр.
- source_word: ἢ τὸ φῶς ἢ τὸ σκότος
  choice: либо свет, либо тьму
  rationale: Прямо сохраняется резкое нравственно-символическое противопоставление исходного текста.
- source_word: νόμον κυρίου
  choice: закон Господа
  rationale: Сохраняет формальную заветную лексику и передаёт κύριος как «Господь».
- source_word: ἔργα τοῦ Βελίαρ
  choice: дела Велиара
  rationale: «Дела» естественно передаёт ἔργα в нравственно-религиозном контексте; Βελίαρ транслитерируется в засвидетельствованной греческой форме.
- source_word: Ἐνώπιον κυρίου πορευσόμεθα
  choice: Мы будем ходить перед Господом
  rationale: Сохранён библейский образ хождения перед Богом; примечание поясняет идиому без её замены толкованием в основном тексте.
- source_word: κατὰ τὸν νόμον αὐτοῦ
  choice: следовать Его закону
  rationale: Естественно по-русски выражает нормативную силу оборота κατὰ с винительным падежом и удачно сочетается с предшествующей идиомой.
- source_word: περὶ τοῦ λόγου τοῦ στόματος ὑμῶν
  choice: сказанного вашими устами
  rationale: Передаёт конкретный акцент на произнесённом обещании, избегая неестественного буквального выражения «слово ваших уст».
- source_word: Μάρτυρες
  choice: Свидетели
  rationale: Сохранён краткий, формально неоднозначный ответ сыновей и юридически-заветный тон сцены.
theological_decisions:
- issue: Этическое противопоставление света и тьмы, закона Господа и дел Велиара
  choice: Передать обе пары прямо, сохранив образность и параллелизм.
  alternative: Разъяснить их как «добро и зло» или «праведность и нечестие».
  rationale: Исходный текст намеренно формулирует резкий двоичный выбор; абстрактная замена ослабила бы его апокалиптическую и нравственную выразительность.
- issue: Передача имени Βελίαρ
  choice: Велиар
  alternative: Велиал
  rationale: Греческий источник содержит форму Βελίαρ; её сохранение прозрачно отражает данный текст и не нормализует его по иной, более известной форме имени.
- issue: Однословный ответ Μάρτυρες
  choice: «Свидетели»
  alternative: «Мы свидетели» или «Будем свидетелями».
  rationale: Буквальная краткость сохраняет юридическую напряжённость и не добавляет отсутствующего в греческом глагола или временного значения.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным завещательным и заветно-юридическим звучанием. Синтаксис сделан ясным для широкого читателя; ключевые образы, повтор слова «свидетель» и краткость заключительного ответа сохранены.
