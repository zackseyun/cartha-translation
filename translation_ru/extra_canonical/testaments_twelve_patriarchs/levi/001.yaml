  source_fidelity: 'В целом содержание передано точно: сохранены заголовок, указание на третьего сына Иакова и Лии, перспективы будущих действий и событий до дня суда, безлично-пассивное «ему было открыто» и последовательность повествования. Однако «список» в современном русском прежде всего означает перечень, тогда как Ἀντίγραφον означает копию/экземпляр записи; кроме того, «слова, которые он заповедал» по-русски двусмысленно и менее естественно передаёт формулу διέθετο τοῖς υἱοῖς αὐτοῦ.'
