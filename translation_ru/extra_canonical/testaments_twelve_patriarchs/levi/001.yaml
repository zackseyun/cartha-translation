base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/001.yaml
  text: 'A copy of the words of Levi, which he ordained for his sons concerning all that they would do, and what would happen to them[a] until the day of judgment.


    For he was in sound health when he called them to himself; but it was revealed to him that he was about to die. And when they had gathered together, he said to them:'
translation:
  language: ru
  text: 'Завещание Левия, третьего сына Иакова и Лии


    1. Копия слов Левия, которые он оставил своим сыновьям обо всём, что они совершат, и обо всём, что случится с ними[a] до дня суда.


    2. Ибо он был здоров, когда призвал их к себе; но ему было открыто, что ему предстоит умереть. Когда же они собрались, он сказал им:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что постигнет их». Греческое выражение буквально говорит о том, что «встретится им» в будущем.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαθήκη
  choice: Завещание
  rationale: В заглавии обозначает предсмертное наставление патриарха и соответствует жанру произведения.
- source_word: Ἀντίγραφον
  choice: Список
  rationale: Слово обозначает письменную копию или запись; «список» сохраняет документальный оттенок и уместен в торжественном заглавном обороте.
- source_word: λόγων
  choice: слов
  rationale: Широкий и естественный эквивалент, сохраняющий формальный тон вводной формулы.
- source_word: διέθετο
  choice: заповедал
  rationale: В контексте завещания глагол означает торжественно распорядиться или предписать; «заповедал» передаёт эту силу без сведения смысла к простому «сказал».
- source_word: κατὰ πάντα ἃ ποιήσουσιν
  choice: обо всём, что они совершат
  rationale: Сохраняет направленность высказывания в будущее и близко передаёт структуру греческого выражения.
- source_word: συναντήσει αὐτοῖς
  choice: что случится с ними
  rationale: Передаёт естественным современным русским языком греческую идиому о событиях, которые ожидают их; буквальный образ отмечен в сноске.
- source_word: ἕως ἡμέρας κρίσεως
  choice: до дня суда
  rationale: Сохраняет формальную эсхатологическую формулу, не добавляя позднейшей доктринальной конкретизации.
- source_word: Ὑγιαίνων
  choice: был здоров
  rationale: Подчёркивает, что Левий не был явно болен, когда созвал сыновей.
- source_word: ἀπεκαλύφθη
  choice: было открыто
  rationale: Пассивная форма сохраняет оттенок откровения, не называя прямо не указанного в тексте деятеля.
- source_word: μέλλει ἀποθνήσκειν
  choice: ему предстоит умереть
  rationale: Естественно и торжественно передаёт близость предстоящей смерти.
- source_word: συνήχθησαν
  choice: они собрались
  rationale: Ясно передаёт завершившееся собрание сыновей в ответ на призыв Левия.
theological_decisions:
- issue: Эсхатологическое выражение ἕως ἡμέρας κρίσεως
  choice: до дня суда
  alternative: до Судного дня
  rationale: Строчное написание и формула «день суда» ближе к греческому родительному обороту и не превращают его в закреплённое позднейшей традицией собственное наименование.
- issue: Неуказанный источник откровения в ἀπεκαλύφθη
  choice: ему было открыто
  alternative: Бог открыл ему
  rationale: Греческий текст использует безличную пассивную конструкцию и не называет Бога прямо; перевод сохраняет эту сдержанность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном завещательного произведения. Синтаксис сделан понятным для широкого читателя; сохранены документальная вводная формула, причинное «ибо» и не названный прямо источник откровения.
