  terminology: «Завещание», «Левий», «Иаков», «Лия», «день суда» и безличное «ему было открыто» уместны. «День суда» сохраняет эсхатологическую формулу без навязывания позднейшего терминологического оформления. Сноска корректно отмечает образный смысл συναντήσει αὐτοῖς.
