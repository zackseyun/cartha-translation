  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/007.yaml
  text: And he taught me the law of the priesthood, of sacrifices, of whole burnt offerings, of freewill offerings, and of peace offerings.
translation:
  language: ru
  text: И он учил меня закону о священстве, жертвах, всесожжениях, начатках, добровольной жертве и мирной жертве.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νόμον ἱερωσύνης
  choice: закону о священстве
  rationale: Родительный падеж передан естественной русской конструкцией со значением закона, относящегося к священническому служению.
- source_word: θυσιῶν
  choice: жертвах
  rationale: Общее обозначение жертвоприношений сохранено без неоправданного сужения значения.
- source_word: ὁλοκαυτωμάτων
  choice: всесожжениях
  rationale: Традиционный и точный термин для жертв, сжигаемых целиком.
- source_word: ἀπαρχῶν
  choice: начатках
  rationale: Слово явно присутствует в предоставленном греческом тексте и означает первые плоды или начатки; оно сохранено вопреки английской ревизии, назвавшей его не засвидетельствованным.
- source_word: ἑκουσίου
  choice: добровольной жертве
  rationale: Субстантивированное прилагательное передано с подразумеваемым словом «жертва», чтобы по-русски ясно выразить добровольное приношение.
- source_word: σωτηρίου
  choice: мирной жертве
  rationale: В жертвенном контексте термин обозначает мирную, или спасительную, жертву; выбран устоявшийся русский библейский эквивалент «мирная жертва».
theological_decisions:
- issue: Наличие начатков в перечне
  choice: Сохранено «начатках»
  alternative: Опустить вслед за последней английской ревизией
  rationale: ἀπαρχῶν непосредственно засвидетельствовано в предоставленном греческом источнике. Окончательный перевод должен исходить прежде всего из оригинального текста, а не из противоречащего ему английского слоя.
- issue: Значение σωτηρίου
  choice: «мирной жертве»
  alternative: «спасительной жертве» или «жертве благополучия»
  rationale: В данном культовом перечне «мирная жертва» наиболее естественно обозначает соответствующий вид жертвоприношения и не превращает термин в отвлечённое богословское утверждение.
translation_notes:
  register: Современный литературный русский язык с традиционной библейской культовой лексикой. Перечень сохранён компактным; эллиптически употреблённые греческие прилагательные раскрыты словом «жертва» ради ясности.
