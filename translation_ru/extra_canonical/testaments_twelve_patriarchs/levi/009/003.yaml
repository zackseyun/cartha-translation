  source_fidelity: 'Перевод точно передаёт структуру и смысл греческого текста: «Когда же» соответствует Ὡς δέ, «Вефиль» — Βεθήλ, «мой отец Иаков увидел ... видение» — εἶδεν ὁ πατήρ μου Ἰακώβ ὅραμα, «обо мне» — περὶ ἐμοῦ. Будущее «я стану» верно передаёт ἔσομαι, а неопределённое «для них» сохраняет неуказанный в стихе референт αὐτοῖς.'
