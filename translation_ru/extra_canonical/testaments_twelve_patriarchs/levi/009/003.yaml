translation:
  language: ru
  text: 'Когда же мы пришли в Вефиль, мой отец Иаков увидел обо мне видение: я стану для них священником.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βεθήλ
  choice: Вефиль
  rationale: Устоявшаяся русская библейская форма названия места.
- source_word: ὅραμα
  choice: видение
  rationale: Прямое и естественное соответствие греческому слову в контексте откровения.
- source_word: περὶ ἐμοῦ
  choice: обо мне
  rationale: Точно и естественно передаёт значение оборота без добавочного толкования.
- source_word: ἔσομαι αὐτοῖς εἰς ἱερέα
  choice: я стану для них священником
  rationale: Передаёт предикативное значение εἰς ἱερέα и отношение к αὐτοῖς современным литературным русским языком.
theological_decisions:
- issue: Круг лиц, обозначенный местоимением αὐτοῖς
  choice: сохранено неопределённое «для них»
  alternative: уточнить как «для своих братьев» или «для народа»
  rationale: Греческий текст в самом стихе не называет референта; уточнение преждевременно сняло бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования; порядок фраз слегка упрощён для естественности, содержание и неоднозначность оригинала сохранены.
