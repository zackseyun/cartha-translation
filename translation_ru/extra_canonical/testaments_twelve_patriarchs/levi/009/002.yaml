  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/002.yaml
  text: And my grandfather blessed me because of the visions that I had seen, and he was not willing to go with us to Bethel.
translation:
  language: ru
  text: И мой дед благословил меня за видения, которые я видел, и не захотел пойти с нами в Вефиль.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πατὴρ τοῦ πατρός μου
  choice: дед мой
  rationale: Буквально «отец моего отца»; естественный и точный русский эквивалент — «мой дед».
- source_word: κατὰ τῶν ὁραμάτων
  choice: за видения
  rationale: Предлог κατά в данном контексте передаёт основание благословения; «за видения» звучит естественно и не уточняет сверх текста, каким именно образом видения послужили основанием.
- source_word: οὐκ ἠθέλησε
  choice: не захотел
  rationale: Передаёт волевое значение глагола θέλω без усиления до категорического отказа.
- source_word: Βεθήλ
  choice: Вефиль
  rationale: Устоявшаяся русская библейская форма топонима Бет-Эль.
