  naturalness: 'Исходная фраза понятна, но сочетание «без порока, не осквернённую и не из рода…» образует не вполне ровный ряд: последний член выглядит как неполная конструкция. Явное «не происходящую» делает современную литературную фразу синтаксически цельной.'
