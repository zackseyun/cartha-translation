base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/010.yaml
  text: Therefore take for yourself a wife while you are still young, one who has no blemish or defilement, and not from the stock of foreign nations.
translation:
  language: ru
  text: 'Итак, возьми себе жену, пока ты ещё молод: не имеющую изъяна, не осквернённую и не происходящую из рода чужеземных народов.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λαβὲ οὖν σεαυτῷ γυναῖκα
  choice: Итак, возьми себе жену
  rationale: Сохраняет прямое наставление и возвратное значение σεαυτῷ; оборот естественен для возвышенного современного русского языка.
- source_word: ἔτι νέος ὤν
  choice: пока ты ещё молод
  rationale: Естественно передаёт обстоятельственный причастный оборот с временным оттенком.
- source_word: μὴ ἔχουσαν μῶμον
  choice: без порока
  rationale: μῶμος может обозначать изъян, пятно или предосудительный недостаток; «без порока» сохраняет нравственно-репутационную широту выражения без излишней конкретизации.
- source_word: μήτε βεβηλωμένην
  choice: не осквернённую
  rationale: Причастие от βεβηλόω обозначает осквернение или профанацию; буквальное «не осквернённую» сохраняет напряжение и не уточняет не названный в тексте вид осквернения.
- source_word: μήτε ἀπὸ γένους ἀλλοφύλων ἐθνῶν
  choice: и не из рода чужеземных народов
  rationale: Передаёт происхождение, выраженное ἀπὸ γένους, и сохраняет сочетание ἀλλοφύλων ἐθνῶν без сведения его к одной конкретной этнической группе.
theological_decisions:
- issue: Характер «порока» и «осквернения» женщины
  choice: 'Сохранить два отдельных, не конкретизированных определения: «без порока, не осквернённую».'
  alternative: Объединить их как «не имеющую никакого изъяна или нечистоты» либо истолковать как указание на сексуальную непорочность.
  rationale: Греческий текст использует два разных выражения и не поясняет природу порока или осквернения; перевод не должен вводить более узкое конфессиональное или нравственное толкование.
- issue: Запрет брака с женщиной чужеземного происхождения
  choice: 'Передать историческое наставление прямо: «не из рода чужеземных народов».'
  alternative: Смягчить до «не принадлежащую к иной вере» или обобщить как запрет духовно смешанного брака.
  rationale: Источник формулирует ограничение через род и народы, а не прямо через веру; богословское переосмысление устранило бы историко-этническую напряжённость текста.
translation_notes:
  register: Современный литературный русский с достоинством завещательного наставления. Синтаксис сделан плавным, но параллельные отрицательные характеристики и историческая резкость заключительной фразы сохранены.
