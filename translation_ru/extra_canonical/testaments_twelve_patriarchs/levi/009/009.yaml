base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/009.yaml
  text: Take heed to yourself from the spirit of sexual immorality, for this is persistent and is about to defile the holy things through your offspring.
translation:
  language: ru
  text: Береги себя от духа разврата, ибо он неотступен[a] и готов через твоё потомство осквернить святыни.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст слов «он неотступен» повреждён или не вполне ясен; возможный смысл: «он действует постоянно».'
    reason: Издание отмечает выражение ἐνδελεχῆ ἐστιν крестами как текстуально сомнительное, поэтому уверенность перевода следует ограничить.
lexical_decisions:
- source_word: Πρόσεχε σεαυτῷ ἀπό
  choice: Береги себя от
  rationale: Естественно передаёт предостережение и требование быть настороже, не воспроизводя неуклюже греческое управление буквально.
- source_word: τοῦ πνεύματος τῆς πορνείας
  choice: духа разврата
  rationale: Сохраняет персонифицированный «дух» и передаёт πορνεία современным, понятным словом, охватывающим половую безнравственность.
- source_word: ἐνδελεχῆ
  choice: неотступен
  rationale: Передаёт смысл постоянства и упорного воздействия; чтение греческой фразы текстуально сомнительно и отмечено сноской.
- source_word: διὰ τοῦ σπέρματός σου
  choice: через твоё потомство
  rationale: В данном контексте σπέρμα обозначает потомков; предлог διά сохранён как указание на средство или посредство.
- source_word: τὰ ἅγια
  choice: святыни
  rationale: Сохраняет множественное число и намеренно не уточняет, идёт ли речь о священных предметах, установлениях или более широком понятии святого.
theological_decisions:
- issue: Референт местоимения и субъект осквернения
  choice: «он … осквернит» относится к духу разврата
  alternative: «это … осквернит» относится к разврату как явлению
  rationale: Мужской род русского слова «дух» позволяет естественно сохранить ближайший греческий референт без дополнительного толкования.
- issue: Значение τὰ ἅγια
  choice: святыни
  alternative: святое / священное
  rationale: Так сохраняются число и смысловая широта греческого выражения без конфессионального уточнения.
- issue: Оттенок μέλλει
  choice: 'будущее действие: «осквернит»'
  alternative: «намеревается осквернить» / «готов осквернить»
  rationale: Простое будущее естественно по-русски выражает грозящее действие; точный модальный оттенок конструкции остаётся зависимым от контекста.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным предостережением. «Разврат» понятнее широкой аудитории, чем архаичное «блуд», а «святыни» сохраняет достоинство и неоднозначность исходного текста.
