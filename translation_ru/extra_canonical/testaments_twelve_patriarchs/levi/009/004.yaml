  text: And rising early in the morning, he tithed everything through me to the Lord.
translation:
  language: ru
  text: И, встав рано утром, он через меня отдал Господу десятину от всего.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς τῷ πρωὶ
  choice: встав рано утром
  rationale: Естественно и точно передаёт причастную конструкцию и утреннее время действия.
- source_word: ἀπεδεκάτωσε πάντα
  choice: отдал десятину от всего
  rationale: Передаёт значение глагола «отделить/дать десятину» ясным современным русским оборотом; «от всего» сохраняет объём πάντα, не создавая впечатления, будто целиком было отдано всё имущество.
- source_word: δι’ ἐμοῦ
  choice: через меня
  rationale: Сохраняет инструментально-посредническую неоднозначность греческого выражения без уточнения роли говорящего.
- source_word: τῷ Κυρίῳ
  choice: Господу
  rationale: Стандартная русская передача дательного падежа κύριος в религиозном контексте.
theological_decisions:
- issue: Роль говорящего при передаче десятины
  choice: через меня
  alternative: посредством меня / мне как посреднику
  rationale: Буквальная формулировка сохраняет неуточнённым, каким именно образом говорящий участвовал в приношении.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified повествовательная формулировка. Синтаксис близок к греческому, но звучит естественно по-русски.
