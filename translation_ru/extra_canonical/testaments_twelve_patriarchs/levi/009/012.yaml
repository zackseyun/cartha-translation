  source_fidelity: 'Перевод точно передаёт основные элементы греческого текста: исходный оборот «от двенадцати деревьев с листьями», выводное οὖν («итак»), повеление ἀνάγαγε, адресата τῷ Κυρίῳ и ссылку на наставление Авраама. Не названный в оригинале объект действия обоснованно не восполняется.'
