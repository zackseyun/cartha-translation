  terminology: «Господу» — точная и устойчивая передача τῷ Κυρίῳ; «вознеси» адекватно передаёт ἀνάγαγε с его возможным культовым оттенком, не добавляя слова «дары». Имя «Авраам» передано нормативно. «Как и меня научил Авраам» сохраняет усилительное καί в κἀμέ.
