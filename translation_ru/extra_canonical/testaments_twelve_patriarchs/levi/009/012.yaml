  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/012.yaml
  text: From twelve trees having leaves, then offer to the Lord, as Abraham taught me.
translation:
  language: ru
  text: Итак, от двенадцати деревьев с листьями вознеси Господу, как и меня научил Авраам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δώδεκα οὖν δένδρων ἐχόντων φύλλα
  choice: Итак, от двенадцати деревьев с листьями
  rationale: Сохранены число, родительный оборот с исходным значением и упоминание листьев; οὖν естественно передано как «итак».
- source_word: ἀνάγαγε
  choice: вознеси
  rationale: Повелительный аорист ἀνάγαγε буквально обозначает действие вознесения/принесения вверх; «вознеси» сохраняет культовый оттенок, не добавляя отсутствующий в тексте объект.
- source_word: τῷ Κυρίῳ
  choice: Господу
  rationale: Дательный падеж передаёт адресата приношения.
- source_word: ὡς κἀμὲ Ἀβραὰμ ἐδίδαξε
  choice: как и меня научил Авраам
  rationale: κἀμέ передано сочетанием «и меня», сохраняющим акцент на том, что Авраам прежде научил говорящего.
theological_decisions:
- issue: Неуказанный предмет, который следует вознести Господу
  choice: Не восполнять объект
  alternative: «принеси [дары] Господу» или «вознеси их Господу»
  rationale: Греческий текст не называет предмет прямо; добавление «дары» либо местоимения «их» могло бы неоправданно связать действие с деревьями или листьями и устранить синтаксическую неясность источника.
translation_notes:
  register: Современный литературный русский с достоинством наставления. Синтаксическая шероховатость исходного эллиптического оборота частично сохранена, чтобы не разрешать искусственно, что именно надлежит вознести Господу.
