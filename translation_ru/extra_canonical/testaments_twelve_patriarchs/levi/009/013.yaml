  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/013.yaml
  text: And from every clean animal and bird offer a sacrifice to the Lord.
translation:
  language: ru
  text: И из всякого чистого животного и птицы приноси жертву Господу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ παντὸς ζώου καθαροῦ
  choice: из всякого чистого животного
  rationale: Сохраняет греческую конструкцию с ἐκ и культовое различение между чистыми и нечистыми животными.
- source_word: πετεινοῦ
  choice: птицы
  rationale: Естественный современный русский эквивалент общего обозначения птицы; в данном контексте речь идёт о пригодных для жертвы птицах.
- source_word: πρόσφερε θυσίαν
  choice: приноси жертву
  rationale: Передаёт императив настоящего времени как продолжающееся или повторяемое предписание и сохраняет обычную культовую формулу.
- source_word: τῷ Κυρίῳ
  choice: Господу
  rationale: Стандартная и естественная передача адресата жертвоприношения в библейском регистре.
theological_decisions:
- issue: Объём определения «чистого»
  choice: Грамматически отнести «чистого» непосредственно к «животному», не добавляя его перед словом «птицы».
  alternative: «из всякого чистого животного и всякой чистой птицы»
  rationale: В представленном греческом тексте καθαροῦ явно согласуется с ζώου; распространять определение на πετεινοῦ возможно по смыслу, но это означало бы сделать подразумеваемое явным и снять формальную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Форма «приноси» отражает аспектуальную силу настоящего императива и звучит как постоянное предписание.
