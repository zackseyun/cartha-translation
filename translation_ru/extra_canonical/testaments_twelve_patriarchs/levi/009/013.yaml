  source_fidelity: 'Перевод точно передаёт Καὶ ἐκ παντὸς ζώου καθαροῦ καὶ πετεινοῦ πρόσφερε θυσίαν τῷ Κυρίῳ: сохранены начальное «и», источник жертвы с ἐκ, настоящее повелительное πρόσφερε, жертва и адресат. Определение «чистого» в русском, как и формально в греческом, непосредственно относится к «животного» и не распространяется эксплицитно на «птицы». Это надлежащим образом сохраняет синтаксическую неоднозначность, не навязывая смыслового расширения.'
