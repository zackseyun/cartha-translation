lexical_decisions:
- source_word: ἐκάλει με συνεχῶς
  choice: постоянно звал меня к себе
  rationale: Передаёт повторяющееся действие и естественно выражает в русском контексте призывание к личному наставлению.
- source_word: τοῦ ὑπομνῆσαί με νόμον Κυρίου
  choice: чтобы напоминать мне закон Господа
  rationale: Сохраняет целевое значение конструкции с τοῦ и прямую связь глагола с «законом Господа».
- source_word: καθὼς ἔδειξέ μοι ὁ ἄγγελος
  choice: как показал мне ангел
  rationale: Близко передаёт греческую формулировку, не уточняя сверх текста, что именно и каким образом показал ангел.
theological_decisions:
- issue: Объект действия ангела
  choice: Сохранить неявную отсылку к закону Господа
  alternative: 'Развернуть: «как прежде показал мне закон ангел»'
  rationale: В греческом объект при ἔδειξέ не повторён; русская формулировка сохраняет эту лаконичность и возможную смысловую напряжённость.
