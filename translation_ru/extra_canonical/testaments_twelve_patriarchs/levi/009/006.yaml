  - severity: low
    issue: «Напоминать мне закон» неудачно передаёт управление глагола.
    rationale: 'При значении ὑπομιμνῄσκω «напоминать кому-либо о чём-либо» естественная русская конструкция — «напоминать мне о законе». Она также согласуется с английским audit trail: «remind me of the law».'
  revised_text: Исаак постоянно звал меня, чтобы напоминать мне о законе Господа, как показал мне ангел.
