source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *παντὸς πρωτογεννήματός σου⁶⁰ καὶ οἴνου⁶¹ πρόσφερε *ἀπαρχὰς εἰς θυσίαν Κυρίῳ⁶² Γτῷ θεῷ⁶³⁾. *Καὶ πᾶσαν θυσίαν ἅλατι ἁλιεῖς⁶⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/014.yaml
  text: And of all your first produce and of wine offer firstfruits as a sacrifice to the Lord God. And every sacrifice you shall salt with salt.
translation:
  language: ru
  text: От всех твоих первых плодов и от вина приноси начатки в жертву Господу Богу. И всякую жертву соли солью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παντὸς πρωτογεννήματός σου
  choice: от всякого первородного плода твоего
  rationale: Сохраняет необычное, но понятное обозначение первых плодов; «первородный» передаёт πρωτογέννημα и не сводит его без пояснения к более привычным «первинам».
- source_word: ἀπαρχὰς
  choice: начатки
  rationale: Традиционное и понятное в библейском контексте обозначение первой части урожая, посвящаемой Богу; позволяет отличить ἀπαρχάς от πρωτογέννημα.
- source_word: εἰς θυσίαν
  choice: в жертву
  rationale: Естественно передаёт целевое значение εἰς и жертвенный характер приношения.
- source_word: Κυρίῳ τῷ θεῷ
  choice: Господу Богу
  rationale: Прямо передаёт единый божественный титул в дательном падеже без внесения дополнительного толкования.
- source_word: ἅλατι ἁλιεῖς
  choice: соли солью
  rationale: Сохраняет внутренний повтор существительного и глагола в греческом тексте и конкретное требование именно солить жертву, а не просто «приправлять» её.
theological_decisions:
- issue: Соотношение «первородного плода» и «начатков»
  choice: Сохранены оба разных греческих выражения
  alternative: 'Сгладить их в одно выражение: «от всех первых плодов... приноси первины»'
  rationale: Источник использует πρωτογέννημα и ἀπαρχάς; различие не следует устранять, даже если по-русски возникает намеренный смысловой повтор.
- issue: Формулировка заповеди о соли
  choice: «всякую жертву соли солью»
  alternative: «всякую жертву приправляй солью»
  rationale: Более буквальная формула сохраняет культовую конкретность и риторический повтор оригинала, не ослабляя предписание до общего кулинарного действия.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Формы «твоего», «приноси» и «соли» передают обращение к одному лицу; синтаксис остаётся ясным для современного читателя. Кавычка в конце английского консультационного текста не воспроизведена, поскольку в данном изолированном греческом стихе её основание не представлено.
