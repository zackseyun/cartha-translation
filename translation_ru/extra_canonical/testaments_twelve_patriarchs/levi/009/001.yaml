base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/001.yaml
  text: And after two days, I and Judah went up with our father Jacob to Isaac our grandfather.
translation:
  language: ru
  text: И через два дня мы с Иудой поднялись вместе с нашим отцом Иаковом к Исааку, нашему праотцу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας δύο
  choice: через два дня
  rationale: Естественная русская передача временного оборота со значением «по прошествии двух дней».
- source_word: ἀνέβην
  choice: поднялись
  rationale: Сохранён пространственный образ глагола «подниматься, восходить»; форма множественного числа естественно согласуется с составным субъектом «мы с Иудой».
- source_word: ἐγὼ καὶ Ἰούδας
  choice: мы с Иудой
  rationale: Идиоматичная современная русская конструкция, сохраняющая участие рассказчика и Иуды без тяжеловесного «я и Иуда».
- source_word: μετὰ τοῦ πατρὸς ἡμῶν Ἰακὼβ
  choice: вместе с нашим отцом Иаковом
  rationale: Передаёт совместность и ясно обозначает Иакова как отца рассказчика и Иуды.
- source_word: τὸν προπάτορα ἡμῶν
  choice: нашему праотцу
  rationale: «Праотец» точно передаёт προπάτωρ и соответствует достоинству древнего повествования; «дед» было бы разговорнее и уже по смыслу.
