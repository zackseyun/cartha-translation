review_pass:
  verdict: revise
  source_fidelity: 'Первые два предписания переданы верно: πρὸ τοῦ εἰσελθεῖν ... εἰς τὰ ἅγια соответствует «прежде чем войти в святилище», а θύειν — «приносить жертву». Не добавлены отсутствующие в греческом тексте «руки», «перед Господом» или «перед ним». Однако в заключительной фразе πάλιν стоит при причастной конструкции ἀπαρτίζων ... τὴν θυσίαν; перевод «снова омойся» однозначно относит «снова» к омовению и меняет синтаксический охват. Перевод следует скорректировать так, чтобы «снова» сохраняло связь с завершающим жертвоприношение действием, как в источнике и английской аудиторской версии.'
  naturalness: Текст краток, ясен и выдержан в современном литературном, ритуально-наставительном регистре. «Омойся» допустимо как общее предписание омовения. Перенос «снова» в позицию при «завершив» остаётся естественным, хотя сохраняет несколько сжатую, свойственную оригиналу формулу.
  terminology: «Святилище» — удачная контекстуальная передача τὰ ἅγια при глаголе «войти». «Приносить жертву» и «жертвоприношение» адекватно передают θύειν и θυσία. Различие λούου/νίπτου не следует искусственно конкретизировать словами «тело» или «руки», поскольку объект νίπτου в тексте не указан.
  issues:
  - severity: medium
    issue: Синтаксическая связь πάλιν в заключительном предписании передана неточно.
    rationale: В греческом πάλιν находится внутри оборота ἀπαρτίζων πάλιν τὴν θυσίαν, а не после императива νίπτου. Формула «завершив жертвоприношение, снова омойся» переносит наречие к омовению. «Снова завершив жертвоприношение, омойся» ближе воспроизводит расположение и не навязывает иной охват наречия.
  revised_text: И прежде чем войти в святилище, омойся; и когда будешь приносить жертву, омойся; и, снова завершив жертвоприношение, омойся.
