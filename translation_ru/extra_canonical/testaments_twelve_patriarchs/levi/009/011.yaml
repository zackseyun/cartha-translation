revisions:
- from: И прежде чем войти в святилище, омойся; и когда будешь приносить жертву, омойся; и, завершив жертвоприношение, снова омойся.
  to: И прежде чем войти в святилище, омойся; и когда будешь приносить жертву, омойся; и, снова завершив жертвоприношение, омойся.
  rationale: 'Исправлено только место и синтаксическая связь «снова» в последней части, чтобы точнее передать πάλιν при ἀπαρτίζων τὴν θυσίαν. Остальные решения сохранены: они естественны по-русски и не добавляют в текст невыраженных деталей.'
