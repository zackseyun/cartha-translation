source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ πρὸ⁴⁶ τοῦ εἰσελθεῖν σε⁴⁷ εἰς τὰ ἅγια, λούου· καὶ ἐν τῷ θύειν σε⁴⁸, νίπτου⁴⁹· καὶ ἀπαρτίζων πάλιν⁵⁰ τὴν θυσίαν, νίπτου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/011.yaml
  text: And before you enter into the holy things, wash; and when you sacrifice, wash; and again, when you finish the sacrifice, wash.
translation:
  language: ru
  text: И прежде чем войти в святилище, омойся; и когда будешь приносить жертву, омойся; и, снова завершив жертвоприношение, омойся.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τὰ ἅγια
  choice: в святилище
  rationale: Субстантивированное множественное τὰ ἅγια в культовом контексте обозначает святое место или святилище; буквальное «в святыни» здесь по-русски неестественно и может ошибочно подразумевать предметы.
- source_word: λούου
  choice: омойся
  rationale: Средний императив λούου обозначает омовение тела; «омойся» передаёт ритуальный контекст и отличается по оттенку от последующего νίπτου.
- source_word: θύειν
  choice: приносить жертву
  rationale: В данном культовом контексте θύω естественно передаётся устойчивым русским выражением «приносить жертву».
- source_word: νίπτου
  choice: омойся
  rationale: νίπτω обычно относится к омовению части тела, однако объект в греческом тексте не назван. Поэтому не добавлено «руки», а повторено более общее «омойся», чтобы сохранить недосказанность источника.
- source_word: ἀπαρτίζων
  choice: завершив
  rationale: Причастие обозначает доведение действия до конца. Русское деепричастие ясно связывает последнее омовение с завершением жертвоприношения.
- source_word: πάλιν
  choice: снова
  rationale: Наречие относится к повторному омовению и естественнее всего стоит непосредственно перед «омойся».
theological_decisions:
- issue: Объект омовения при νίπτου
  choice: Не уточнять часть тела
  alternative: «вымой руки»
  rationale: Хотя νίπτω нередко означает мытьё рук или ног, в данном стихе объект отсутствует; его добавление превратило бы вероятный смысл в явно выраженное предписание.
- issue: Значение τὰ ἅγια
  choice: «святилище»
  alternative: «святыни» или «святое»
  rationale: Контекст входа указывает прежде всего на сакральное пространство, но текст не уточняет его внутреннее подразделение; нейтральное «святилище» не вводит лишней храмовой классификации.
translation_notes:
  register: Современный литературный русский язык с краткими ритуальными повелениями и сохранённым трёхчастным повтором. Не внесены отсутствующие в представленном греческом тексте выражения «пред Господом», «пред ним» или «руки»; поздняя редакционная запись, по-видимому, относится к иной текстовой форме и не согласуется с указанным источником.
