  text: '*Καὶ τανῦν¹ φυλάξατε² *ὅσα ἐγὼ ἐντέλλομαι ὑμῖν, τέκνα, ἐπειδὴ ὅσα ἐγὼ ἤκουσα παρὰ τῶν πατέρων μου Γἀνήγγειλα ὑμῖν³⁾.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/001.yaml
  text: And now, children, keep what I command you, since I have declared to you all that I heard from my fathers.
translation:
  language: ru
  text: И теперь, дети, соблюдайте всё, что я заповедую вам, ибо я возвестил вам всё, что услышал от моих отцов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τανῦν
  choice: теперь
  rationale: Передаёт временной переход; усилительная частица «и» сохранена отдельно.
- source_word: φυλάξατε
  choice: соблюдайте
  rationale: В контексте заповедей означает хранить и исполнять сказанное, а не просто оберегать.
- source_word: ἐντέλλομαι
  choice: заповедую
  rationale: Сохраняет смысл авторитетного наставления и связь с языком заповеди.
- source_word: ἀνήγγειλα
  choice: возвестил
  rationale: Передаёт сообщение полученного предания с уместным возвышенным, но понятным оттенком.
- source_word: παρὰ τῶν πατέρων μου
  choice: от моих отцов
  rationale: Формально сохраняет множественное число и допускает значение предков, не устраняя исходную формулировку.
