base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/005.yaml
  text: For the house that the Lord will choose shall be called Jerusalem, as the book of Enoch the righteous contains.
translation:
  language: ru
  text: Ибо дом, который изберёт Господь, будет назван Иерусалимом, как сказано в книге праведного Еноха.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶκος
  choice: дом
  rationale: 'Прямое и естественное соответствие, сохраняющее возможную многозначность: здание, святилище или дом как установление.'
- source_word: ἐκλέξεται
  choice: изберёт
  rationale: Передаёт будущее время и идею суверенного выбора без добавочного толкования.
- source_word: κληθήσεται
  choice: будет назван
  rationale: Точно передаёт пассивную форму будущего времени.
- source_word: περιέχει
  choice: сказано
  rationale: В контексте ссылки на письменный источник естественно передаёт значение «содержит/заключает в себе»; буквальное «как содержит книга» по-русски неидиоматично.
- source_word: Ἐνὼχ τοῦ δικαίου
  choice: праведного Еноха
  rationale: Родительный оборот естественно передаёт характеристику Еноха как праведного.
theological_decisions:
- issue: Отождествление избранного дома с Иерусалимом
  choice: сохранено прямое утверждение исходного текста
  alternative: уточнить «храм» или истолковать «дом» как народ/династию
  rationale: Греческое οἶκος допускает несколько оттенков; перевод не должен устранять эту смысловую напряжённость.
- issue: Добавленная в истории редакций фраза «и для проклятия»
  choice: не включена
  alternative: добавить «и для проклятия»
  rationale: В предоставленном греческом тексте καὶ εἰς κατάραν отсутствует; перевод следует предъявленному оригинальному свидетельству, а не противоречащей ему поздней английской правке.
translation_notes:
  register: Современный литературный русский язык; возвышенный, но ясный библейский регистр. Порядок слов слегка адаптирован ради естественности без устранения неоднозначности слова «дом».
