review_pass:
  verdict: revise
  source_fidelity: 'Основная передача точна: сохранены будущее время, пассивное «будет назван» и намеренная многозначность οἶκος («дом»). Однако περιέχει буквально имеет субъектом «книгу» и означает «содержит»; безличное «как сказано» несколько ослабляет эту синтаксическую и смысловую связь.'
  naturalness: «Как говорится в книге праведного Еноха» — естественная современная литературная русская формула для ссылки на письменный источник и при этом ближе к греческому, чем «как сказано».
  terminology: «Господь», «дом», «Иерусалим» и «праведный Енох» переданы последовательно и в подходящем библейском регистре. «Дом» не следует сужать до храма. Английская редакционная запись о добавлении «и для проклятия» противоречит предъявленному греческому тексту; добавлять эти слова в русский перевод нельзя.
  issues:
  - severity: low
    issue: περιέχει передано безличным «как сказано».
    rationale: Греческий текст прямо говорит, что это содержится/говорится «в книге праведного Еноха». Формула «как говорится в книге...» сохраняет ссылку на книгу и звучит естественно по-русски.
  - severity: high
    issue: 'Противоречие в английском audit trail: в истории заявлено добавление «и для проклятия», которого нет в представленном греческом источнике.'
    rationale: Русский перевод должен следовать предоставленному оригинальному тексту. Никакого соответствующего словосочетания в перевод не вносится.
  revised_text: Ибо дом, который изберёт Господь, будет назван Иерусалимом, как говорится в книге праведного Еноха.
  revised_footnotes: []
  revision_rationale: 'Исправлена только передача περιέχει: «как говорится в книге...» естественно для русского языка и точнее сохраняет функцию книги как письменного источника. Остальная формулировка сохранена. Слова «и для проклятия» не включены, поскольку они отсутствуют в предъявленном греческом тексте.'
