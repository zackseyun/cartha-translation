  source_fidelity: Перевод точно передаёт будущее беззаконие адресатов, образ Иерусалима, не способного «вынести» их порочность, и разрыв храмовой завесы как следствие, после которой она более не скрывает их позор. «В Израиле» следует греческому ἐν τῷ Ἰσραήλ; перевод не навязывает возможное расширительное толкование «против Израиля».
