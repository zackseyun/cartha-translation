source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἀνομήσετε¹⁸ *ἐν τῷ¹⁹ Ἰσραήλ²⁰, ὥστε μὴ βαστάζειν²¹ τὴν²² Ἱερουσαλήμ²³ ἀπὸ προσώπου τῆς²⁴ πονηρίας ὑμῶν, ἀλλὰ σχισθήσεται²⁵ τὸ καταπέτασμα²⁶ τοῦ ναοῦ, ὥστε μὴ καλύψαι²⁷ τὴν²⁸ ἀσχημοσύνην ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/003.yaml
  text: And you will act lawlessly in Israel, so that Jerusalem will not be able to bear your wickedness; but the veil of the temple will be torn, so as no longer to cover your shame.
translation:
  language: ru
  text: И вы будете творить беззаконие в Израиле, так что Иерусалим не сможет вынести вашего нечестия; но завеса храма разорвётся и уже не будет скрывать вашего позора.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνομήσετε
  choice: будете творить беззаконие
  rationale: Передаёт будущее время и смысл нарушения Божьего закона; выражение естественно для возвышенного библейского регистра.
- source_word: βαστάζειν
  choice: вынести
  rationale: Сохраняет образ несения бремени и одновременно естественно выражает неспособность терпеть тяжесть нечестия.
- source_word: πονηρίας
  choice: нечестия
  rationale: В контексте религиозно-нравственного осуждения передаёт порочность и злонамеренность поступков, не сужая значение до отдельного преступления.
- source_word: καταπέτασμα
  choice: завеса
  rationale: Обычный и точный русский термин для храмовой завесы.
- source_word: σχισθήσεται
  choice: разорвётся
  rationale: Точно передаёт пассивную форму будущего времени без добавления явно названного деятеля.
- source_word: ἀσχημοσύνην
  choice: позора
  rationale: Передаёт публично постыдный, непристойный характер обозначенного состояния; в данной конструкции естественнее буквального «безобразия».
theological_decisions:
- issue: Связь Иерусалима с нечестием адресатов
  choice: Иерусалим не сможет вынести вашего нечестия
  alternative: Иерусалим не устоит из-за вашего нечестия
  rationale: Сохраняет персонификацию Иерусалима и прямой объект при βαστάζειν, не вводя отсутствующей в тексте идеи разрушения или падения.
- issue: Результат разрыва храмовой завесы
  choice: и уже не будет скрывать вашего позора
  alternative: так что не сможет скрыть вашего позора
  rationale: Передаёт результативное ὥστε μή с инфинитивом естественным русским оборотом, не уточняя сверх текста, каким именно образом завеса связана с позором адресатов.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис упрощён лишь настолько, чтобы фраза оставалась ясной; образ Иерусалима, который «выносит» нечестие, и богословская напряжённость между беззаконием, завесой и позором сохранены.
