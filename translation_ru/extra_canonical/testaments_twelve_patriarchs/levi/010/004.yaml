  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/004.yaml
  text: And you will be scattered as captives among the nations, and there you will be for a reproach and a curse.
translation:
  language: ru
  text: И вы будете рассеяны пленниками среди народов, и там станете предметом поношения и проклятия.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διασπαρήσεσθε
  choice: будете рассеяны
  rationale: Точно передаёт будущую пассивную форму и образ насильственного рассеяния.
- source_word: αἰχμάλωτοι
  choice: пленниками
  rationale: 'Сохраняет предикативный смысл: адресаты будут рассеяны именно как пленники.'
- source_word: ἐν τοῖς ἔθνεσιν
  choice: среди народов
  rationale: Естественное русское соответствие, сохраняющее множественное число и пространственно-социальный смысл ἐν.
- source_word: εἰς ὄνειδος
  choice: предметом поношения
  rationale: Передаёт состояние, в котором адресаты становятся объектом поругания; формула естественнее по-русски, чем буквальное «в поношение».
- source_word: εἰς κατάραν
  choice: проклятия
  rationale: В парной конструкции с «предметом» передаёт κατάρα как проклятие, с которым будут связывать адресатов.
- source_word: ἐκεῖ
  choice: там
  rationale: Сохраняет явное указание на место — среди народов.
