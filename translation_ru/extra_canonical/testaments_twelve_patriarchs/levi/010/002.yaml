source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: ΓΚαὶ ἰδοὺ⁴⁾ ἀθῷός εἰμι⁵ τῆς⁶ ἀσεβείας⁷ ὑμῶν⁸ *καὶ παραβάσεως⁹ ἣν ποιήσετε ἐπὶ *τῇ συντελείᾳ¹⁰ *τῶν αἰώνων¹¹ [εἰς τὸν σωτῆρα τοῦ κόσμου χριστόν]¹² *πλανῶντες τὸν Ἰσραήλ¹³, καὶ ἐπεγείροντες¹⁴ *ἐπ᾿ αὐτὸν¹⁵ κακὰ μεγάλα¹⁶ *παρὰ Κυρίου¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/002.yaml
  text: And behold, I am innocent of your ungodliness and transgression, which you will commit at the consummation of the ages [against the Savior of the world, the Messiah], misleading Israel and stirring up great evils against him from the Lord.
translation:
  language: ru
  text: И вот, я невиновен в вашем нечестии и в том преступлении, которое вы совершите в конце веков [против Спасителя мира, Мессии][a], вводя Израиль в заблуждение и навлекая на него великие бедствия от Господа.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова в квадратных скобках имеют неясный текстуальный статус в греческой традиции.
    reason: Скобки воспроизводят текстологическую помету предоставленного греческого источника, а не обычный авторский знак.
lexical_decisions:
- source_word: ἀθῷός εἰμι
  choice: я невиновен
  rationale: Передаёт судебно-нравственный смысл выражения без архаичного «неповинен».
- source_word: ἀσεβείας
  choice: нечестии
  rationale: «Нечестие» точно выражает отсутствие благоговения перед Богом и сохраняет возвышенный библейский регистр.
- source_word: παραβάσεως
  choice: преступлении
  rationale: Передаёт переход установленной границы и нарушение заповеди; в паре с «нечестием» звучит естественно.
- source_word: ἐπὶ τῇ συντελείᾳ τῶν αἰώνων
  choice: при завершении веков
  rationale: Сохраняет множественное число «веков» и эсхатологическую формулировку оригинала, не заменяя её более истолковывающим «в конце мира».
- source_word: πλανῶντες τὸν Ἰσραήλ
  choice: вводя Израиль в заблуждение
  rationale: 'Естественно передаёт каузативный смысл πλανάω: заставлять заблуждаться, сбивать с верного пути.'
- source_word: ἐπεγείροντες ἐπ᾿ αὐτὸν κακὰ μεγάλα παρὰ Κυρίου
  choice: поднимая против него великие бедствия от Господа
  rationale: По возможности сохраняет образ «поднимать/возбуждать», порядок смысловых компонентов и неоднозначную связь выражения «от Господа».
theological_decisions:
- issue: Референт местоимения αὐτόν («него»)
  choice: Сохранено местоимение «него» без поясняющей замены существительным.
  alternative: Явно указать «против Мессии» или «против Израиля».
  rationale: Греческая синтаксическая цепочка допускает неоднозначность референта; перевод не должен устранять её догматическим уточнением.
- issue: Текстуальный статус фразы εἰς τὸν σωτῆρα τοῦ κόσμου χριστόν
  choice: Фраза сохранена в квадратных скобках с примечанием.
  alternative: Включить её без скобок либо удалить из основного текста.
  rationale: Предоставленный греческий источник сам отмечает эту фразу квадратными скобками; такой статус следует сделать видимым читателю, не вынося окончательного текстологического суждения.
- issue: Источник великих бедствий в выражении παρὰ Κυρίου
  choice: Передано буквально как «от Господа».
  alternative: Истолковать как «навлекая на него великие бедствия от Господа» или связать «от Господа» с деятелями.
  rationale: Буквальная конструкция сохраняет богословское напряжение и синтаксическую неоднозначность источника.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены эсхатологическая формула «завершение веков», квадратные скобки источника и неоднозначность местоимения; избегнуты конфессионально нагруженные пояснения.
