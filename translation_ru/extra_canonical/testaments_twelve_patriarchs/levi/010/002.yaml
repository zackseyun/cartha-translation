revisions:
- from: И вот, я невиновен в вашем нечестии и преступлении, которое вы совершите при завершении веков [против Спасителя мира, Мессии][a], вводя Израиль в заблуждение и поднимая против него великие бедствия от Господа.
  to: И вот, я невиновен в вашем нечестии и в том преступлении, которое вы совершите в конце веков [против Спасителя мира, Мессии][a], вводя Израиль в заблуждение и навлекая на него великие бедствия от Господа.
  rationale: 'Исправлены две безопасные редакторские проблемы: неестественная сочетаемость «поднимая ... бедствия» заменена на нормативное «навлекая ... бедствия», а отнесённость «которое» к «преступлению» сделана ясной. Квадратные скобки, примечание, неопределённое «него» и формула «от Господа» сохранены, чтобы не устранять текстологическую и синтаксическую неоднозначность оригинала.'
