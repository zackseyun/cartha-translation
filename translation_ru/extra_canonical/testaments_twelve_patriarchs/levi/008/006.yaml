  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/006.yaml
  text: And the third put on me a linen garment, like an ephod.
translation:
  language: ru
  text: А третий облачил меня в льняное одеяние, подобное эфоду.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βυσσίνην
  choice: льняное одеяние
  rationale: Прилагательное от βύσσος обозначает изготовленное из тонкого льна; существительное подразумевается, поэтому в русском оно восполнено как «одеяние».
- source_word: περιέθηκεν
  choice: облачил меня
  rationale: Глагол выражает действие надевания или возложения одежды на человека; «облачил» естественно передаёт церемониальный контекст.
- source_word: ὁμοίαν ἐφούδ
  choice: подобное эфоду
  rationale: Сохранено сравнение, а культовый термин ἐφούδ передан традиционным заимствованием «эфод», без отождествления льняного одеяния с самим эфодом.
theological_decisions:
- issue: Степень отождествления одеяния с эфодом
  choice: «подобное эфоду»
  alternative: «эфодоподобное» или «как эфод»
  rationale: Греческое ὁμοίαν обозначает подобие, а не тождество; формулировка сохраняет эту смысловую границу и не усиливает священническую идентификацию.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественной лексикой, уместной для сцены церемониального облачения. Синтаксис краток и следует структуре греческого текста.
