- from: И второй омыл меня чистой водой Господа, накормил святым хлебом и вином и облачил меня в святую и славную одежду.
  to: И второй омыл меня чистой Господней водой, накормил хлебом и святым вином и облачил меня в святую и славную одежду.
  rationale: Исправлено синтаксическое соотнесение «святого» с «вином» согласно греческому согласованию. Оборот о воде слегка перестроен ради естественного современного русского, без смыслового расширения. Остальные формулировки сохранены.
