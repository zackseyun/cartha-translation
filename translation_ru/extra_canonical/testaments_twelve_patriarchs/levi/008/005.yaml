  text: And the second washed me with the Lord's pure water, and fed me holy bread and wine, and put around me a holy and glorious robe.
translation:
  language: ru
  text: И второй омыл меня чистой Господней водой, накормил хлебом и святым вином и облачил меня в святую и славную одежду.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: второй
  rationale: Сохранено порядковое обозначение участника видения без добавления отсутствующего в данном стихе существительного.
- source_word: ἔλουσέ με
  choice: омыл меня
  rationale: «Омыл» естественно для возвышенного повествования и точно передаёт ритуально окрашенное омовение.
- source_word: ὕδατι κυρίου καθαρῷ
  choice: чистой водой Господа
  rationale: 'Сохранена формальная неоднозначность родительного κυρίου: вода характеризуется как принадлежащая Господу или исходящая от Него; перестановка слов делает выражение естественным по-русски.'
- source_word: ἐψώμισέν με
  choice: накормил
  rationale: Глагол означает «дал есть, накормил»; выбран ясный современный эквивалент без чрезмерной буквальности.
- source_word: ἄρτον καὶ οἶνον ἅγιον
  choice: святым хлебом и вином
  rationale: По смыслу прилагательное относится к хлебу и вину как к единой паре; русская форма творительного падежа естественно согласуется с «накормил».
- source_word: περιέθηκε μοι στολὴν
  choice: облачил меня в … одежду
  rationale: Передаёт действие окружения/облачения одеждой более естественно и достойно, чем буквальное «положил вокруг меня».
- source_word: ἁγίαν καὶ ἔνδοξον
  choice: святую и славную
  rationale: Сохранены оба параллельных определения одежды; «славная» передаёт ἔνδοξον без истолковывающего расширения.
theological_decisions:
- issue: Возможные культовые или сакраментальные ассоциации воды, хлеба, вина и одежды
  choice: Сохранить образы без поясняющей конфессиональной терминологии
  alternative: Истолковать их как прямые указания на конкретные таинства или обряды
  rationale: Греческий текст представляет символические действия, но сам стих не называет и не определяет их конфессионально; перевод не должен снимать эту открытость.
- issue: Связь родительного κυρίου с «водой»
  choice: «водой Господа»
  alternative: «Господней водой» или «водой от Господа»
  rationale: Выбранная конструкция наиболее прямо сохраняет родительный и не уточняет, означает ли он принадлежность, источник или качество.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской окраской. Синтаксис плавный и доступный; архаизмы и конфессионально нагруженные уточнения не вводятся.
