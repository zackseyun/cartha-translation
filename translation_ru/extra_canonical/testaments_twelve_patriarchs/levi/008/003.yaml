base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/003.yaml
  text: And each one of them was carrying something, and they placed it on me and said to me, “From now on, become a priest—you and all your seed.”
translation:
  language: ru
  text: 'И каждый из них что-то нёс; они возложили это на меня и сказали мне: «Отныне стань священником — ты и всё твоё потомство».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαστάζοντες
  choice: нёс
  rationale: Передаёт значение «нести»; неопределённое «что-то» восполняет отсутствующее в греческом тексте дополнение, не конкретизируя предмет.
- source_word: ἐπέθηκαν μοι
  choice: возложили это на меня
  rationale: Глагол ἐπιτίθημι здесь обозначает помещение предметов на человека; «возложили» сохраняет торжественный регистр и возможный обрядовый оттенок.
- source_word: ἱερέα
  choice: священником
  rationale: Прямой и естественный русский эквивалент для культового служителя.
- source_word: σπέρμα
  choice: семя
  rationale: Сохраняет библейский собирательный образ потомства и формальную связь с греческим словом, не заменяя его более истолковывающим выражением.
theological_decisions:
- issue: Распространение священнического призвания на Левия и его потомство
  choice: «ты и всё твоё семя»
  alternative: «ты и все твои потомки»
  rationale: Формулировка сохраняет собирательное единственное число σπέρμα и не уточняет характер или пределы обещания сверх сказанного в источнике.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксическая неровность греческого текста сглажена естественным переходом от «каждый» к множественному «они», при этом содержание не конкретизировано.
