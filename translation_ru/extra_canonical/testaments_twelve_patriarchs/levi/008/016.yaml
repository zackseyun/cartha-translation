id: T12P.LEV.8.16
reference: Testament of Levi 8:16
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Πᾶν οὖν ἐπιθυμητὸν⁸⁶ ἐν Ἰσραὴλ⁸⁷ σοὶ⁸⁸ ἔσται καὶ τῷ σπέρματί σου⁸⁹, καὶ ἔδεσθε⁹⁰ πᾶν ὡραῖον ἐν⁹¹ ὁράσει, καὶ τὴν τράπεζαν Κυρίου διανεμεῖται⁹² τὸ σπέρμα σου⁹³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/016.yaml
  text: Therefore every desirable thing in Israel will be for you and for your seed, and you will eat every beautiful thing for the eye, and your seed will apportion the table of the Lord.
translation:
  language: ru
  text: Итак, всё желанное в Израиле будет принадлежать тебе и твоему потомству; вы будете вкушать всё, что прекрасно на вид, и твоё потомство будет распределять трапезу Господа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμητόν
  choice: желанное
  rationale: Передаёт значение «то, чего желают; желанное, вожделенное», сохраняя положительную оценку контекста.
- source_word: σπέρμα
  choice: потомство
  rationale: В данном обещании естественно обозначает потомков; буквальное «семя» в современном русском звучало бы менее ясно.
- source_word: ἔδεσθε
  choice: вы будете вкушать
  rationale: Форма второго лица множественного числа; «вкушать» уместно для торжественного контекста трапезы, оставаясь понятным.
- source_word: πᾶν ὡραῖον ἐν ὁράσει
  choice: всё, что прекрасно на вид
  rationale: Естественно передаёт буквальную конструкцию «всё прекрасное в видении/для зрения» без неподтверждённого чтения ἐν δράσει.
- source_word: τὴν τράπεζαν Κυρίου διανεμεῖται
  choice: будет распределять трапезу Господа
  rationale: Сохраняет образ Господней трапезы и основное значение глагола «распределять, разделять»; намеренно не уточняет, идёт ли речь о пище, долях или служении при трапезе.
theological_decisions:
- issue: Объём обещания, данного Левию и его потомству
  choice: Сохранено различие между «тебе и твоему потомству» и последующим множественным «вы будете вкушать»
  alternative: Отнести вкушение только к потомству, как в английском консультационном тексте
  rationale: Греческое ἔδεσθε — второе лицо множественного числа, тогда как τὸ σπέρμα σου далее является отдельным подлежащим в единственном числе.
- issue: Смысл распределения трапезы Господа
  choice: Оставлен без конфессионального истолкования
  alternative: Передать как священническое распоряжение жертвенными дарами или как раздачу святой пищи
  rationale: Греческий текст допускает культовый контекст, но сам не выражает такого уточнения явно.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Перевод следует представленному греческому тексту; поздняя ревизионная ссылка на ἐν δράσει ему не соответствует, поскольку в источнике дано ἐν ὁράσει.
