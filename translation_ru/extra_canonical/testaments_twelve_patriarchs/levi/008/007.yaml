  text: And the fourth wrapped around me a belt, like purple.
translation:
  language: ru
  text: А четвёртый опоясал меня поясом, подобным пурпуру.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «похожим на пурпур»; греческое выражение допускает отнесение к пурпурному цвету или материалу.'
    reason: Примечание сохраняет лексическую неоднозначность πορφύρα и необычность сравнения.
lexical_decisions:
- source_word: ζώνην
  choice: поясом
  rationale: «Пояс» — естественный современный эквивалент, сохраняющий предметное значение греческого слова.
- source_word: περιέβαλεν
  choice: опоясал меня
  rationale: Передаёт действие окружения поясом и по-русски звучит естественнее буквального «обернул вокруг меня».
- source_word: ὁμοίαν πορφύρας
  choice: подобным пурпуру
  rationale: Сохраняет необычную и несколько шероховатую конструкцию источника, не уточняя без текстового основания, идёт ли речь прежде всего о цвете, ткани или царском пурпуре.
