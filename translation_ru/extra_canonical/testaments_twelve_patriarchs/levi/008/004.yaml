  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/004.yaml
  text: And the first anointed me with holy oil and gave me a priestly staff.
translation:
  language: ru
  text: И первый помазал меня святым елеем и дал мне жезл.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «посох».'
    reason: ῥάβδος допускает оба значения; «жезл» лучше передаёт символический характер предмета, но неоднозначность следует отметить.
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: первый
  rationale: Сохраняет определённое обозначение первого из ранее упомянутых действующих лиц без добавочного толкования.
- source_word: ἤλειψέ με ἐλαίῳ ἁγίῳ
  choice: помазал меня святым елеем
  rationale: Передаёт ритуальное помазание и сохраняет традиционную, понятную в библейском контексте лексику.
- source_word: ῥάβδον
  choice: жезл
  rationale: Греческое слово само по себе означает жезл или посох и не содержит явно выраженного определения «священнический».
theological_decisions:
- issue: Священническое назначение жезла
  choice: Не добавлять определение «священнический» в основной текст
  alternative: «священнический жезл»
  rationale: В греческом тексте стоит только ῥάβδον; священнический смысл возможен из контекста, но его не следует вводить как явное содержание стиха.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Елей» выбран вместо нейтрального «масло» ввиду ритуального контекста; синтаксис остаётся простым и близким к греческому.
