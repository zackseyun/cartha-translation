base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/014.yaml
  text: And the third will be called by a new name, because a king will arise from Judah and will establish a new priesthood, according to the pattern of the nations, for all the nations.
translation:
  language: ru
  text: И третий будет назван новым именем, потому что из Иуды восстанет царь и установит новое священство — по образцу народов, для всех народов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по образцу народов, во все народы». Греческое выражение необычно и допускает разные понимания связи между «образцом народов» и предназначением священства для всех народов.'
    reason: Сохраняет и отмечает подлинную синтаксическую и смысловую неоднозначность κατὰ τὸν τύπον τῶν ἐθνῶν εἰς πάντα τὰ ἔθνη.
lexical_decisions:
- source_word: ἐπικληθήσεται αὐτῷ ὄνομα καινόν
  choice: будет назван новым именем
  rationale: Естественная русская передача греческой конструкции со значением наречения новым именем без уточнения, кем именно оно будет дано.
- source_word: βασιλεὺς ἐκ τοῦ Ἰούδα ἀναστήσεται
  choice: из Иуды восстанет царь
  rationale: Сохранены исходный образ «восстанет» и неоднозначность имени «Иуда», которое может обозначать как праотца, так и происходящее от него колено.
- source_word: ποιήσει ἱερατείαν νέαν
  choice: установит новое священство
  rationale: Глагол ποιήσει буквально означает «сделает», но в сочетании со «священством» современное русское «установит» точнее передаёт смысл учреждения.
- source_word: κατὰ τὸν τύπον τῶν ἐθνῶν
  choice: по образцу народов
  rationale: Формально и намеренно неоднозначно передаёт необычное выражение источника; «образец» соответствует τύπος, а «народы» — ἔθνη.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: для всех народов
  rationale: Передаёт направленность или предназначение, выраженные εἰς, и сохраняет повтор слова ἔθνη.
theological_decisions:
- issue: Соотношение царя из Иуды и нового священства
  choice: Сохранить прямое утверждение, что царь установит новое священство
  alternative: Истолковать царя как священника или явно отождествить его с определённой мессианской фигурой
  rationale: Греческий текст связывает учреждение священства с царём, но не разъясняет природу этого священства и не называет царя; перевод не должен добавлять конфессиональное толкование.
- issue: Смысл выражения «по образцу народов»
  choice: Сохранить буквальную и напряжённую формулировку с пояснением в сноске
  alternative: Сгладить как «особое священство для всех народов» или «по образцу священства народов»
  rationale: Добавление подразумеваемого существительного или богословское переосмысление сняло бы реальную неоднозначность κατὰ τὸν τύπον τῶν ἐθνῶν.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Повтор «народов» сохранён вслед за греческим текстом; тире помогает прочитать тяжёлую заключительную конструкцию, не устраняя её неоднозначности.
