lexical_decisions:
- source_word: Κἀκεῖ πάλιν
  choice: И там я снова
  rationale: Передаёт соединительное καί, указание на место ἐκεῖ и повторность πάλιν естественным современным русским выражением.
- source_word: ὅραμα ὡς τὸ πρότερον
  choice: видение, подобное прежнему
  rationale: ὡς выражает уподобление; «подобное прежнему» сохраняет сопоставление с предыдущим видением, не утверждая полного тождества.
- source_word: μετὰ τὸ ποιῆσαι ἡμᾶς ἐκεῖ ἡμέρας ἑβδομήκοντα
  choice: после того как мы провели там семьдесят дней
  rationale: Идиоматически передаёт конструкцию μετὰ с субстантивированным инфинитивом и употребление ποιεῖν о проведённом времени.
