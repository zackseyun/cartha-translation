id: T12P.LEV.8.2
reference: Testament of Levi 8:2
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ εἶδον⁵ ἑπτὰ ἄνδρας⁶ ἐν ἐσθῆτι⁷ λευκῇ⁸ *λέγοντάς μοι⁹· Ἀναστὰς ἔνδυσαι τὴν στολὴν τῆς ἱερατείας, καὶ¹⁰ τὸν στέφανον τῆς δικαιοσύνης¹¹, *καὶ τὸ λόγιον¹² τῆς συνέσεως καὶ τὸν ποδήρη¹³ τῆς ἀληθείας καὶ τὸ πέταλον¹⁴ τῆς πίστεως καὶ τὴν μίτραν¹⁵ †τῆς κεφαλῆς†¹⁶ καὶ τὸ ἐφοὺδ τῆς προφητείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/002.yaml
  text: And I saw seven men in white clothing, saying to me, “Rise, put on the robe of the priesthood, and the crown of righteousness, and the breastpiece of understanding, and the full-length robe of truth, and the plate of faith, and the turban for the head, and the ephod of prophecy.”
translation:
  language: ru
  text: 'И увидел я семерых мужей в белых одеждах. Они сказали мне: «Встань и облачись в одеяние священства, венец праведности, нагрудник разумения, длинную ризу истины, налобную пластину веры, тюрбан[a] и эфод пророчества».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «тюрбан головы»; слова «головы» в греческом тексте текстологически сомнительны.'
    reason: В издании выражение τῆς κεφαλῆς отмечено крестами как повреждённое или сомнительное; основной текст передаёт несомненное μίτραν естественным русским словом.
lexical_decisions:
- source_word: ἐσθῆτι λευκῇ
  choice: в белых одеждах
  rationale: Греческое выражение стоит в единственном числе собирательно; русский множественный оборот естественно относится ко всем семерым мужам.
- source_word: στολὴν τῆς ἱερατείας
  choice: одеяние священства
  rationale: Сохраняет образ особого священнического облачения и абстрактный родительный падеж исходного текста.
- source_word: λόγιον τῆς συνέσεως
  choice: нагрудник разумения
  rationale: В контексте перечня священнических облачений λόγιον обозначает нагрудник, а не словесное изречение или оракул; «разумение» передаёт σύνεσις в возвышенном, но понятном регистре.
- source_word: ποδήρη τῆς ἀληθείας
  choice: длинную ризу истины
  rationale: ποδήρης означает одежду, доходящую до ног; «длинная риза» передаёт вид облачения без громоздкого буквального описания.
- source_word: πέταλον τῆς πίστεως
  choice: налобную пластину веры
  rationale: В священническом контексте πέταλον — металлическая пластина на головном уборе; уточнение «налобная» делает предмет понятным современному читателю.
- source_word: μίτραν
  choice: тюрбан
  rationale: Передаёт древний священнический головной убор и избегает ассоциации русского слова «митра» исключительно с позднейшей церковной формой.
- source_word: ἐφοὺδ τῆς προφητείας
  choice: эфод пророчества
  rationale: Сохранён традиционный библейский термин для особого священнического облачения.
theological_decisions:
- issue: Метафорическая связь предметов облачения с добродетелями и дарами
  choice: Сохранить все родительные сочетания без истолковывающих добавлений
  alternative: 'Передать их как символы: «венец, символизирующий праведность» и т. п.'
  rationale: Исходный текст не поясняет, являются ли эти названия символическими, тождественными или титульными; перевод сохраняет эту богословскую многозначность.
translation_notes:
  register: Современный литературный русский с торжественным библейским звучанием. Формула «увидел я» и глагол «облачись» поддерживают визионерский и священнический регистр, а специальные предметы облачения названы достаточно ясно для обычного читателя.
