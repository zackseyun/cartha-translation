  verdict: approve
  source_fidelity: 'Текст точно передаёт греческий смысл: λέγουσι сохранено настоящим временем («говорят»), σπέρμα естественно передано как «потомство», а пассивное διαιρεθήσεται εἰς τρεῖς ἀρχάς — как «будет разделено на три части». Оборот εἰς σημεῖον верно передан «в знак». Родительный оборот δόξης Κυρίου ἐπερχομένου корректно понимается как «славы грядущего Господа»: мужское ἐπερχομένου согласуется с Κυρίου, а не с δόξης.'
  naturalness: Фраза звучит естественно на современном литературном русском, сохраняя уместный для пророческой речи умеренно торжественный регистр. Тире перед «в знак» ясно связывает заключительный оборот со всем предшествующим сообщением.
  terminology: «Левий», «потомство», «Господь» и «грядущий» последовательно и уместно передают имена и ключевые понятия. Нейтральное «три части» не навязывает спорного понимания ἀρχάς как должностей, чинов или властей. Сноска с маркером [a] поставлена непосредственно после соответствующего выражения и адекватно поясняет сохранённую неоднозначность.
