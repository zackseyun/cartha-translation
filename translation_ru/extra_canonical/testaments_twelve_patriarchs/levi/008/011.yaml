source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καὶ λέγουσι⁶¹ πρός με· Λευί⁶², εἰς τρεῖς ἀρχὰς διαιρεθήσεται⁶³ τὸ σπέρμα σου⁶⁴, εἰς⁶⁵ σημεῖον⁶⁶ *δόξης Κυρίου ἐπερχομένου⁶⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/011.yaml
  text: And they say to me, “Levi, your seed will be divided into three divisions, as a sign of the glory of the Lord who is coming.”
translation:
  language: ru
  text: 'И говорят мне: «Левий, твоё потомство будет разделено на три части[a] — в знак славы грядущего Господа».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово ἀρχάς может означать «начала», «главенства», «области власти» или «чины»; точный характер этих трёх частей здесь не уточняется.
    reason: Сохранить лексическую неоднозначность, которую невозможно естественно воспроизвести одним русским словом в основном тексте.
lexical_decisions:
- source_word: σπέρμα
  choice: потомство
  rationale: В данном контексте слово обозначает потомков Левия; «потомство» передаёт смысл естественнее современного буквального «семя».
- source_word: διαιρεθήσεται εἰς τρεῖς ἀρχάς
  choice: будет разделено на три части
  rationale: Передаёт само действие разделения и не приписывает трём группам определённых должностей, которых греческий текст прямо не называет; неоднозначность ἀρχάς отмечена в сноске.
- source_word: εἰς σημεῖον
  choice: в знак
  rationale: Естественное русское соответствие целевому или знаковому значению оборота с εἰς.
- source_word: Κυρίου ἐπερχομένου
  choice: грядущего Господа
  rationale: Причастие ἐπερχομένου согласуется с Κυρίου и описывает Господа как приходящего; «грядущий» сохраняет торжественный эсхатологический оттенок.
theological_decisions:
- issue: К кому относится ἐπερχομένου
  choice: 'к Господу: «грядущего Господа»'
  alternative: 'к славе: «грядущей славы Господа»'
  rationale: По грамматическому согласованию мужская форма ἐπερχομένου непосредственно относится к мужскому Κυρίου, тогда как δόξης — существительное женского рода.
- issue: Характер тройного разделения потомства Левия
  choice: нейтральное «три части»
  alternative: «три чина», «три служения» или «три начальства»
  rationale: Текст не определяет однозначно, являются ли эти группы чинами, служениями или областями власти; нейтральная формулировка не вводит конфессионального истолкования.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Настоящее время «говорят» сохранено вслед за греческим λέγουσι; «грядущего» уместно передаёт возвышенный оттенок пророческой речи.
