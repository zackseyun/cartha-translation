  text: Ὁ⁵⁵ ἕβδομος *διάδημά μοι ἱερατείας περιέθηκεν καὶ⁵⁶ ἐπλήρωσε⁵⁷ τὰς χεῖράς μου θυμιάματος⁵⁸, ὥστε ἱερατεύειν με⁵⁹ Κυρίῳ, *τῷ θεῷ⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/010.yaml
  text: And the seventh put on me a diadem of priesthood and filled my hands with incense, so that I might serve as priest before the Lord God.
translation:
  language: ru
  text: А седьмой возложил на меня венец священства и наполнил мне руки фимиамом, чтобы я совершал священническое служение Господу Богу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάδημα
  choice: венец
  rationale: «Венец» естественно и достойно передаёт знак высокого сана; более узкое «диадема» в современном русском может прежде всего ассоциироваться с женским украшением.
- source_word: ἱερατείας
  choice: священства
  rationale: Родительный падеж сохраняет характеристику венца как знака священнического служения.
- source_word: ἐπλήρωσε τὰς χεῖράς μου θυμιάματος
  choice: наполнил мои руки благовонием
  rationale: Сохранён конкретный образ исходного текста без замены его предполагаемым обрядовым смыслом; «благовоние» передаёт вещество для воскурения.
- source_word: ἱερατεύειν
  choice: служил священником
  rationale: Глагольная конструкция ясно передаёт исполнение священнического служения и звучит естественно по-русски.
- source_word: Κυρίῳ, τῷ θεῷ
  choice: Господу Богу
  rationale: Сохраняет обращённость священнического служения к Господу Богу; дательный падеж соответствует греческому тексту.
theological_decisions:
- issue: Направленность выражения ἱερατεύειν ... Κυρίῳ, τῷ θεῷ
  choice: служил священником Господу Богу
  alternative: служил священником перед Господом Богом
  rationale: В греческом стоит дательный без предлога со значением служения Богу; слово «перед» присутствует в английском консультационном слое, но не выражено непосредственно в исходном тексте.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным библейским звучанием. Синтаксис и предметные образы греческого текста сохранены без излишней архаизации.
