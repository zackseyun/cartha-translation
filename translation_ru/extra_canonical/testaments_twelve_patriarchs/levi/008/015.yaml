base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/015.yaml
  text: And his appearance is beloved, like a prophet of the Most High, from the seed of Abraham our father.
translation:
  language: ru
  text: И его появление дорого, подобно появлению пророка Всевышнего, из семени Авраама, отца нашего.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρουσία
  choice: явление
  rationale: В данном контексте обозначает явление или появление человека; «явление» сохраняет достоинство стиля и не навязывает специального эсхатологического смысла.
- source_word: ἀγαπητή
  choice: любимо
  rationale: Формально сохраняет предикативное значение греческого прилагательного «любезно, любимо», не подменяя его оценками вроде «желанно» или «приятно».
- source_word: ὡς προφήτης ὑψίστου
  choice: как явление пророка Всевышнего
  rationale: Повтор слова «явление» делает естественным по-русски вероятное сравнение его явления с явлением пророка, при этом не превращает самого человека в прямое именное сказуемое.
- source_word: ἐκ σπέρματος Ἀβραὰμ
  choice: из семени Авраама
  rationale: Сохраняет библейский образ происхождения и родословной.
- source_word: τοῦ πατρὸς ἡμῶν
  choice: отца нашего
  rationale: Передаёт приложение к имени Авраама в традиционном, но понятном литературном порядке слов.
theological_decisions:
- issue: Значение παρουσία
  choice: «явление»
  alternative: «присутствие» или «пришествие»
  rationale: Контекст допускает значение появления/явления; «пришествие» могло бы необоснованно внести специальную мессианско-эсхатологическую терминологию, а «присутствие» здесь менее естественно.
- issue: Синтаксическая связь сравнения ὡς προφήτης
  choice: 'Понимать как эллиптическое сравнение: «как [явление] пророка»'
  alternative: «он любим как пророк Всевышнего»
  rationale: Сохраняется связь с подлежащим παρουσία и грамматическая напряжённость греческой фразы без молчаливого превращения её в однозначное утверждение о статусе лица.
translation_notes:
  register: Современный литературный русский с сохранением библейских выражений «Всевышний» и «семя Авраама». Формулировка намеренно несколько возвышенная и близкая к синтаксису источника.
