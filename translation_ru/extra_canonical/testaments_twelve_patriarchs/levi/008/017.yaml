source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἐξ αὐτῶν⁹⁴ ἔσονται ἱερεῖς⁹⁵ καὶ⁹⁶ κριταὶ καὶ⁹⁶ γραμματεῖς· καὶ⁹⁷ ἐπὶ στόματος αὐτῶν †ληφθήσεται⁹⁸ τὸ ἅγιον⁹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/017.yaml
  text: And from among them there will be priests and judges and scribes, and by their mouth the holy thing will be received.”
translation:
  language: ru
  text: И из их числа будут священники, судьи и книжники; по их слову будет принято святое[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст в этом месте не вполне ясен: форма «будет принято» (ληφθήσεται) в издании отмечена как сомнительная. Выражение ἐπὶ στόματος αὐτῶν буквально означает «при/по их устам» и может быть передано как «по их слову»; не уточняется, что именно означает «святое».'
    reason: Отмечает текстологическую помету † при ληφθήσεται, объясняет передачу ἐπὶ στόματος и сохраняет открытый смысл τὸ ἅγιον.
lexical_decisions:
- source_word: ἐξ αὐτῶν
  choice: из их числа
  rationale: Передаёт происхождение людей из упомянутой ранее группы естественным современным русским выражением.
- source_word: ἱερεῖς καὶ κριταὶ καὶ γραμματεῖς
  choice: священники, судьи и книжники
  rationale: Сохраняет три общественно-религиозные роли исходного текста; «книжники» соответствует историческому значению γραμματεῖς.
- source_word: ἐπὶ στόματος αὐτῶν
  choice: из их уст
  rationale: Сохраняет образ речи, исходящей из уст, не уточняя, идёт ли речь об учении, решении или провозглашении.
- source_word: τὸ ἅγιον
  choice: святое
  rationale: 'Субстантивированное прилагательное оставлено столь же открытым по смыслу, как в греческом: не добавлены отсутствующие существительные вроде «учение», «слово» или «служение».'
theological_decisions:
- issue: Что обозначает τὸ ἅγιον
  choice: святое
  alternative: святое учение / святыня
  rationale: Контекст допускает разные понимания, поэтому перевод не навязывает конкретного богословского референта.
- issue: Связь святого с устами священников, судей и книжников
  choice: из их уст будет принято
  alternative: по их слову будет установлено / их устами будет воспринято
  rationale: Сохранён пассив и необычная образность греческой фразы без истолкования характера их авторитета.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным синтаксисом. Перечень передан сжато; необычность заключительной фразы сохранена, поскольку она присуща источнику.
