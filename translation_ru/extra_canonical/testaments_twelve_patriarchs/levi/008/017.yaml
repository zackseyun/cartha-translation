  naturalness: «Из их уст будет принято святое» по-русски звучит неестественно и затрудняет понимание. «По их слову будет принято святое» сохраняет намеренно необычную и не до конца ясную конструкцию оригинала, но читается литературно.
  terminology: «Священники, судьи и книжники» — удачная исторически и терминологически точная передача. Субстантивированное «святое» обоснованно сохраняет неопределённость τὸ ἅγιον; заменять его на «святыню», «учение» или иной конкретный референт не следует.
