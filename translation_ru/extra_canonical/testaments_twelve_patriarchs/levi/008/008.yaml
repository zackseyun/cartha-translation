  text: And the fifth gave me a branch of a rich olive tree.
translation:
  language: ru
  text: А пятый дал мне ветвь тучной маслины.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ πέμπτος
  choice: пятый
  rationale: Субстантивированное порядковое числительное сохранено без добавления слова «ангел», поскольку оно не выражено в данном стихе и определяется контекстом.
- source_word: κλάδον
  choice: ветвь
  rationale: Прямое и естественное соответствие греческому существительному в данном образе.
- source_word: ἐλαίας
  choice: маслины
  rationale: Родительный падеж от ἐλαία обозначает оливковое дерево; «маслина» — традиционное и литературно уместное русское наименование дерева.
- source_word: πιότητος
  choice: тучной
  rationale: Родительный качественной характеристики от πιότης передаёт полноту, жирность и плодородную насыщенность; «тучной» сохраняет конкретную библейскую образность лучше, чем более расплывчатое «богатой».
