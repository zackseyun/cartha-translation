  text: And the first lot will be great, and no other will arise above it.
translation:
  language: ru
  text: И первый жребий будет велик, и другой не возникнет выше него.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλῆρος
  choice: жребий
  rationale: Сохраняет основной образ греческого слова — назначенную по жребию долю или удел — и не сужает его заранее до должности, чина или священнического служения.
- source_word: μέγας
  choice: велик
  rationale: Прямо передаёт качественную характеристику «великий», не подменяя её сравнительной формой «величайший».
- source_word: ὑπὲρ αὐτόν
  choice: выше него
  rationale: Сохраняет образ превосходства или положения над первым жребием, не сводя выражение лишь к «больше него».
- source_word: ἕτερος
  choice: другого
  rationale: Передаёт явно выраженное значение «другой, иной».
- source_word: οὐ γενήσεται
  choice: не возникнет
  rationale: Отражает динамику γενήσεται — «не появится, не возникнет, не станет существовать», а не только статичное «не будет».
theological_decisions:
- issue: Характер превосходства первого жребия
  choice: «выше него не возникнет другого»
  alternative: «не будет другого более великого, чем он»
  rationale: 'Выбранный вариант сохраняет неоднозначность ὑπέρ: речь может идти о превосходстве по величию, положению или достоинству; перевод не уточняет это богословски сверх текста.'
translation_notes:
  register: Современный литературный русский с торжественной, но понятной формулировкой. Повтор союза «и» сохранён вслед за греческим текстом; синтаксис намеренно близок к оригиналу, чтобы не устранять его смысловую напряжённость.
