  source_fidelity: 'Смысл передан точно: πρῶτος κλῆρος — «первый жребий», ἔσται μέγας — «будет велик», а οὐ γενήσεται ἕτερος ὑπὲρ αὐτόν сохранено как отсутствие иного, который возник бы выше него. Исправление лишь делает эллиптическое ἕτερος более естественным в русском синтаксисе, не конкретизируя характер превосходства.'
