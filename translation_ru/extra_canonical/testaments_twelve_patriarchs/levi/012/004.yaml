  text: And in the ninety-fourth year of my life, Abraham took Jochebed my daughter as a wife for himself, because he and my daughter were born on one and the same day.
translation:
  language: ru
  text: И на девяносто четвёртом году моей жизни Авраам взял мою дочь Иохаведу себе в жёны, потому что он и моя дочь родились в один и тот же день.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ ἐνενηκοστῷ τετάρτῳ μου ἔτει
  choice: на девяносто четвёртом году моей жизни
  rationale: Точно передаёт порядковое числительное и естественно звучит по-русски.
- source_word: Ἀβραὰμ
  choice: Авраам
  rationale: Следует представленному греческому тексту, несмотря на возможное ожидание другого имени в данном родословном контексте.
- source_word: Ἰωχαβὲδ
  choice: Иохавед
  rationale: Использована узнаваемая русская библейская форма имени.
- source_word: ἔλαβεν ... ἑαυτῷ εἰς γυναῖκα
  choice: взял ... себе в жёны
  rationale: Естественная современная русская передача брачной формулы с сохранением значения ἑαυτῷ.
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: в один и тот же день
  rationale: Передаёт подчеркнутое совпадение дня рождения обоих лиц.
theological_decisions:
- issue: Необычное имя жениха в греческом источнике
  choice: Сохранено «Авраам»
  alternative: Исправить на «Амрам» по родословной традиции
  rationale: Перевод следует явно засвидетельствованному чтению Ἀβραὰμ и не вносит молчаливую конъектуру.
translation_notes:
  register: Современный литературный русский язык; повествовательная фраза выдержана в dignified, но доступном регистре. Подлинная текстовая необычность имени сохранена без гармонизации.
