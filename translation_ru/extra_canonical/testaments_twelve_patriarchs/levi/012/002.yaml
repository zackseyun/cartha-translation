  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/012/002.yaml
  text: And the sons of Kohath were Amram, Issachar, Hebron, and Uzziel.
translation:
  language: ru
  text: А сыновья Каафа — Авраам[a], Иссахар, Хеврон и Озиил.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Так в представленном греческом тексте; в библейской родословной сыном Каафа назван Амрам (Исх. 6:18).
    reason: Сноска сохраняет чтение источника и предупреждает о заметном расхождении с параллельной библейской традицией.
lexical_decisions:
- source_word: Καὰθ
  choice: Кааф
  rationale: Употреблена традиционная русская библейская форма имени, соответствующая греческому Καὰθ.
- source_word: Ἀβραάμ
  choice: Авраам
  rationale: Перевод следует непосредственно представленному греческому тексту, хотя в параллельной родословной обычно ожидается имя Амрам.
- source_word: Ἰσαχάρ
  choice: Иссахар
  rationale: Передана именно засвидетельствованная греческая форма имени, без исправления по параллельной родословной.
- source_word: Χεβρών
  choice: Хеврон
  rationale: Выбрана устоявшаяся русская библейская форма имени.
- source_word: Ὀζηήλ
  choice: Озиил
  rationale: Выбрана традиционная русская форма имени Уззиила, соответствующая греческой передаче.
theological_decisions:
- issue: Расхождение имени первого сына Каафа с библейской родословной
  choice: Сохранено чтение «Авраам»
  alternative: «Амрам»
  rationale: Исходный греческий текст данной единицы ясно содержит Ἀβραάμ. Молчаливое исправление устранило бы реальное текстовое расхождение; пояснение вынесено в сноску.
- issue: Отсутствующая в представленном греческом тексте фраза о смерти
  choice: Фраза не добавлена
  alternative: Добавить «Он умер» по замечанию в истории английской редакции
  rationale: В предоставленном оригинальном тексте нет ἀπέθνησκεν или иной соответствующей формы; перевод не дополняется материалом, не засвидетельствованным источником.
translation_notes:
  register: Краткая именная родословная передана современным литературным русским языком. Связка «были» опущена как необязательная и менее естественная в русском перечислении. Имена даны в привычных русских библейских формах там, где это не подменяет чтение греческого источника.
