revisions:
- from: Мне было восемь лет, когда я вошёл в землю Ханаанскую; восемнадцать лет, когда я убил Сихема; девятнадцать лет, когда стал священником; двадцать восемь лет, когда взял себе жену; и сорок восемь лет, когда вошёл в Египет.
  to: Мне было восемь лет, когда я вошёл в землю Ханаана; мне было восемнадцать лет, когда я убил Сихема; мне было девятнадцать лет, когда я служил священником; мне было двадцать восемь лет, когда я взял себе жену; и мне было сорок восемь лет, когда я вошёл в Египет.
  rationale: Заменено ингрессивное «стал священником» на «служил священником», что сохраняет значение греческого ἱεράτευσα без добавления обстоятельства посвящения. Формулировка «земля Ханаана» и полное повторение возрастной конструкции обеспечивают нейтральный современный литературный стиль при сохранении структуры оригинала.
