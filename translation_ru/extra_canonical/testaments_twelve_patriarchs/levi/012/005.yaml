  text: I was eight years old when I entered the land of Canaan, and eighteen years old when I killed Shechem, and nineteen years old when I served as priest, and twenty-eight years old when I took a wife, and forty-eight years old when I entered Egypt.
translation:
  language: ru
  text: Мне было восемь лет, когда я вошёл в землю Ханаана; мне было восемнадцать лет, когда я убил Сихема; мне было девятнадцать лет, когда я служил священником; мне было двадцать восемь лет, когда я взял себе жену; и мне было сорок восемь лет, когда я вошёл в Египет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσῆλθον εἰς γῆν Χανάαν
  choice: вошёл в землю Ханаанскую
  rationale: Сохраняет пространственный образ греческого текста и звучит естественно в русском библейском повествовании.
- source_word: ἀπέκτεινα τὸν Συχέμ
  choice: убил Сихема
  rationale: Передаёт прямое значение глагола ἀποκτείνω; Συχέμ в данном контексте понимается как личное имя.
- source_word: ἱεράτευσα
  choice: стал священником
  rationale: Контекст перечисляет возраст наступления событий, поэтому ингрессивная передача естественно выражает начало священнического служения, не добавляя конфессиональной терминологии.
- source_word: ἔλαβον γυναῖκα
  choice: взял себе жену
  rationale: Сохраняет идиому оригинала в понятной современной форме со значением вступления в брак.
- source_word: εἰσῆλθον εἰς Αἴγυπτον
  choice: вошёл в Египет
  rationale: Последовательно передаёт повторяющийся глагол εἰσέρχομαι.
