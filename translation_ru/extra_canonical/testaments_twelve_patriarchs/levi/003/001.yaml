base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/003/001.yaml
  text: 'Listen, then, concerning the heavens that were shown to you. The lowest is gloomy for this reason: because it sees all the injustices of people.'
translation:
  language: ru
  text: Итак, послушай же о небесах, показанных тебе. Нижнее из них мрачно, потому что видит все несправедливости людей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄκουσον
  choice: выслушай
  rationale: Повелительное наклонение передано естественным русским глаголом, вводящим последующее объяснение.
- source_word: περὶ τῶν δειχθέντων σοι οὐρανῶν
  choice: об увиденных тобою небесах
  rationale: Причастная конструкция передана кратко и естественно; пассивное значение «показанных тебе» в контексте видения выражено как «увиденных тобою».
- source_word: ὁ κατώτερος
  choice: нижнее из них
  rationale: Субстантивированная сравнительная степень указывает на нижнее небо среди ранее упомянутых небес.
- source_word: στυγνός
  choice: мрачно
  rationale: Слово обозначает мрачный, угрюмый, зловещий вид; «мрачно» сохраняет образ и не сводит его лишь к отсутствию света.
- source_word: ἀδικίας
  choice: беззакония
  rationale: Множественное число обозначает неправедные и несправедливые поступки; «беззакония» естественно для возвышенного религиозного повествования и сохраняет нравственный оттенок.
- source_word: τῶν ἀνθρώπων
  choice: людей
  rationale: Общее обозначение человечества передано современным инклюзивным словом «людей».
theological_decisions:
- issue: Олицетворение нижнего неба в выражении ὁρᾷ
  choice: «видит» сохранено буквально
  alternative: «в нём видны» или «оно отражает»
  rationale: Греческий текст прямо приписывает нижнему небу способность видеть; образная напряжённость не устранена толкованием.
- issue: Нравственный смысл ἀδικίας
  choice: «беззакония»
  alternative: «несправедливости» или «неправедные дела»
  rationale: Выбор сохраняет широкий религиозно-нравственный смысл, не ограничивая его социальной несправедливостью и не добавляя отсутствующее существительное «дела».
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейско-завещательным регистром. Синтаксис сделан ясным для обычного читателя; олицетворение неба и причинная связь оригинала сохранены.
