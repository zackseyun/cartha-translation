  - severity: low
    issue: «беззакония» для ἀδικίας
    rationale: Возможный, но более узкий и религиозно-юридически окрашенный выбор. «Несправедливости» ближе к греческому и английской контрольной формулировке.
  revised_text: Итак, послушай же о небесах, показанных тебе. Нижнее из них мрачно, потому что видит все несправедливости людей.
