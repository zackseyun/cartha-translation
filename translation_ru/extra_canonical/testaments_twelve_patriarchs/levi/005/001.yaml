source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ †ἐν τούτῳ¹ ἤνοιξέ μοι² *ὁ ἄγγελος³ τὰς πύλας τοῦ οὐρανοῦ· καὶ εἶδον τὸν *ἅγιον ὕψιστον ἐπὶ θρόνου καθήμενον⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/001.yaml
  text: And in this, the angel opened to me the gates of heaven, and I saw the Holy Most High seated on a throne.
translation:
  language: ru
  text: И при этом ангел открыл мне врата небес, и я увидел Святого Всевышнего, сидящего на престоле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: при этом
  rationale: Передаёт связь с происходящим или увиденным в ближайшем контексте, не уточняя её сверх того, что выражено греческим оборотом.
- source_word: ὁ ἄγγελος
  choice: ангел
  rationale: Прямое и естественное соответствие греческому обозначению небесного посланника.
- source_word: τὰς πύλας τοῦ οὐρανοῦ
  choice: врата небес
  rationale: Сохраняет возвышенный образ множественных небесных врат и соответствует литературному регистру видения.
- source_word: τὸν ἅγιον ὕψιστον
  choice: Святого Всевышнего
  rationale: Сохраняет оба титульных определения и их субстантивированное употребление, не сводя одно из них к наречному усилению другого.
- source_word: ἐπὶ θρόνου καθήμενον
  choice: сидящего на престоле
  rationale: Точно передаёт положение фигуры и традиционный возвышенный образ престола.
theological_decisions:
- issue: Соотношение определений ἅγιον и ὕψιστον
  choice: Святого Всевышнего
  alternative: Святейшего Всевышнего
  rationale: Греческий текст допускает чтение обоих слов как самостоятельных титульных определений. Выбранный вариант сохраняет эту структуру и не превращает ἅγιον в превосходную степень, которой в форме слова нет.
- issue: Определённость небесной фигуры
  choice: Заглавные буквы в «Святого Всевышнего»
  alternative: святого Всевышнего
  rationale: Субстантивированные эпитеты в единственном числе в сцене небесного престола функционируют как божественное именование; заглавные буквы ясно передают это, не добавляя имени, отсутствующего в источнике.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной лексикой, уместной для апокалиптического видения. «Врата» и «престол» сохраняют достоинство и образность оригинала, оставаясь понятными современному читателю.
