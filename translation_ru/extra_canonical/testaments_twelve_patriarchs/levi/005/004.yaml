base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/004.yaml
  text: And in that time I destroyed the sons of Hamor, as it is written on the tablets of the fathers.
translation:
  language: ru
  text: И в то время я истребил сыновей Хамора, как написано на табличках отцов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετέλεσα
  choice: истребил
  rationale: В данном повествовательном контексте глагол передаёт доведение уничтожения до конца; «истребил» естественно и точно выражает этот смысл по-русски.
- source_word: τοὺς υἱοὺς Ἐμμώρ
  choice: сыновей Хамора
  rationale: υἱούς передано буквально как «сыновей»; для имени выбран узнаваемый русский библейский облик «Хамор», соответствующий греческому Ἐμμώρ.
- source_word: ἐν πλαξὶ τῶν πατέρων
  choice: на табличках отцов
  rationale: Сохранены множественное число πλαξί и родительный оборот τῶν πατέρων; определение «небесных» не добавлено, поскольку в греческом тексте его нет.
theological_decisions:
- issue: Характер «табличек отцов»
  choice: Не уточнять их как небесные или земные
  alternative: «на небесных табличках отцов»
  rationale: Исходный греческий текст содержит только πλαξὶ τῶν πατέρων; добавление «небесных» устранило бы оставленную текстом неопределённость.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и торжественная, без архаизации. Синтаксис близок к греческому, но естественен для русского читателя.
