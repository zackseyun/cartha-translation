  text: And I said to him, “I beg you, Lord, teach me your name, so that I may call on you in the day of affliction.”
translation:
  language: ru
  text: 'И я сказал ему: «Прошу Тебя, Господи, научи меня Твоему имени, чтобы в день скорби я мог призвать Тебя».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δέομαί σου
  choice: Прошу Тебя
  rationale: Передаёт настойчивую почтительную просьбу естественным современным русским языком.
- source_word: δίδαξόν με τὸ ὄνομά σου
  choice: открой мне имя Твоё
  rationale: Греческое выражение буквально означает «научи меня Твоему имени», но в данном контексте речь идёт о сообщении имени; «открой мне» естественно передаёт этот смысл, не добавляя толкования.
- source_word: ἐπικαλέσομαί σε
  choice: я мог призвать Тебя
  rationale: Глагол ἐπικαλέομαι здесь означает обратиться с призывом о помощи; «призвать» сохраняет библейский регистр и прямую связь с именем.
- source_word: ἐν ἡμέρᾳ θλίψεως
  choice: в день скорби
  rationale: Сохраняет единственное число и устойчиво передаёт θλῖψις как тяжёлое бедствие или тесноту.
theological_decisions:
- issue: Обращение Κύριε
  choice: Господи
  alternative: Владыка
  rationale: «Господи» — прямое, традиционное и конфессионально нейтральное обращение, соответствующее звательной функции греческого Κύριε.
- issue: Значение знания имени
  choice: открой мне имя Твоё
  alternative: научи меня Твоему имени
  rationale: Выбран естественный русский оборот, который не уточняет сверх текста, означает ли знание имени откровение личности, власти или способ обращения.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Заглавные буквы в местоимениях обращения к Господу поддерживают принятую русскую религиозную орфографическую традицию. Синтаксис краткий и прозрачный; маркеры сносок не требуются.
