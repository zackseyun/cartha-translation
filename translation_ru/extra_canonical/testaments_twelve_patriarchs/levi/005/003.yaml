base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/003.yaml
  text: Then the angel brought me down to the earth and gave me a weapon and a sword, and said to me, “Execute vengeance in Shechem for Dinah your sister, and I will be with you, because the Lord has sent me.”
translation:
  language: ru
  text: 'Тогда ангел спустил меня на землю, дал мне оружие и меч и сказал: «Отомсти в Сихеме за твою сестру Дину, и я буду с тобой, потому что Господь послал меня».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατήγαγέν
  choice: низвёл
  rationale: Передаёт направленное движение вниз и сохраняет возвышенный, но понятный современному читателю регистр.
- source_word: ὅπλον
  choice: оружие
  rationale: Греческое слово имеет широкое значение «оружие, воинское снаряжение»; перевод «щит» был бы неоправданным сужением смысла.
- source_word: ῥομφαίαν
  choice: меч
  rationale: В данном повествовательном контексте естественное общее обозначение клинкового оружия; более узкая реконструкция его типа не требуется.
- source_word: Ποίησον ἐκδίκησιν
  choice: Отомсти
  rationale: Кратко и естественно выражает повеление совершить возмездие, не ослабляя его силы.
- source_word: ὑπὲρ Δείνας
  choice: за Дину
  rationale: В сочетании с идеей возмездия ὑπέρ указывает, за кого надлежит отомстить.
- source_word: ἐν Συχὲμ
  choice: в Сихеме
  rationale: Сохраняет неоднозначность названия, которое в контексте может обозначать место, не подменяя его уточняющим толкованием.
theological_decisions:
- issue: Основание обещанного ангельского содействия
  choice: «потому что Господь послал меня»
  alternative: «ибо Господь отправил меня»
  rationale: Сохранена прямая причинная связь ὅτι и личная миссия ангела без богословского расширения.
- issue: Божественно санкционированное возмездие
  choice: 'Повеление передано прямо: «Отомсти»'
  alternative: «Соверши возмездие»
  rationale: Текст не смягчён и не дополнен нравственным комментарием; напряжение между ангельским повелением и насилием оригинала сохранено.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской окраской. Инверсия «Дину, сестру твою» сохраняет торжественный тон и тесное приложение оригинала, оставаясь понятной современному читателю.
