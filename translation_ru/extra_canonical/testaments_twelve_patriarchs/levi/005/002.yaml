  text: And he said to me, “Levi, to you I have given the blessings of the priesthood until I come and dwell in the midst of Israel.”
translation:
  language: ru
  text: 'И он сказал мне: «Левий, тебе я дал благословения священства, пока не приду и не поселюсь среди Израиля».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς εὐλογίας τῆς ἱερατείας
  choice: благословения священства
  rationale: Буквально и естественно передаёт множественное число εὐλογίας и родительную конструкцию τῆς ἱερατείας, не сводя смысл к одному благословению или к самому священническому служению.
- source_word: ἕως ἐλθὼν κατοικήσω
  choice: пока не приду и не поселюсь
  rationale: Передаёт временной предел ἕως и последовательность двух действий; русская конструкция «пока не» здесь звучит естественно и сохраняет возможное напряжение относительно продолжительности данных благословений.
- source_word: ἐν μέσῳ τοῦ Ἰσραήλ
  choice: среди Израиля
  rationale: Естественный современный эквивалент выражения «в середине/посреди Израиля», где Израиль может обозначать народ как целое.
theological_decisions:
- issue: Кто говорит и следует ли обозначать говорящего как Бога прописными местоимениями
  choice: Сохранено «он» и обычное строчное «я» без дополнительного отождествления говорящего
  alternative: «Он» и «Я» с прописной буквы, явно подразумевающие божественного говорящего
  rationale: Греческий текст сам по себе не кодирует русское конфессионально-редакционное употребление прописных местоимений. Строчная форма сохраняет референциальную неоднозначность ближайшего контекста и не вносит дополнительного богословского решения.
- issue: Объём действия временного оборота ἕως
  choice: 'Оборот присоединён ко всему утверждению о даровании благословений: «дал… пока не приду…»'
  alternative: Переформулировать так, будто священство несомненно продолжается и после прихода говорящего
  rationale: Исходный синтаксис допускает напряжённое прочтение временного предела; перевод не устраняет его поясняющей вставкой.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; сохранены краткость исходника, прямая речь и повтор личной направленности «Левий, тебе я дал».
