source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ εἶπεν³⁸· Ἐγώ εἰμι ὁ ἄγγελος ὁ *παραιτούμενος τὸ γένος³⁹ Ἰσραήλ, τοῦ μὴ πατάξαι⁴⁰ αὐτούς⁴¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/006.yaml
  text: And he said, “I am the angel who intercedes for the race of Israel, so that they may not be struck down.”
translation:
  language: ru
  text: 'И он сказал: «Я — ангел, ходатайствующий за народ Израиля, чтобы они не были поражены».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραιτούμενος
  choice: ходатайствующий
  rationale: В данном контексте причастие означает просьбу или заступничество за других; «ходатайствующий» естественно передаёт посредническое заступничество, не уточняя его механизм.
- source_word: τὸ γένος Ἰσραήλ
  choice: народ Израиля
  rationale: Буквальное «род Израиля» возможно, но в современном русском может звучать как указание лишь на родословную; «народ Израиля» ясно и естественно передаёт коллективный смысл γένος.
- source_word: τοῦ μὴ πατάξαι αὐτούς
  choice: чтобы они не были поражены
  rationale: Пассивная конструкция сохраняет невыраженного в греческом деятеля и значение цели, не добавляя прямого указания на того, кто наносит удар.
theological_decisions:
- issue: Кто может поразить Израиль
  choice: Сохранить деятеля невыраженным посредством пассивной конструкции
  alternative: «чтобы Бог не поразил их»
  rationale: В греческом тексте субъект инфинитива прямо не назван; добавление «Бог» сняло бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис прост и понятен; термин «ходатайствующий» сохранён как широко узнаваемое религиозно-литературное слово.
