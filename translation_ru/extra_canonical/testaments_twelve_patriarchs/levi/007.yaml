  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/007.yaml
  text: And I said to my father Jacob[a], “In you the Lord will bring the Canaanites to nothing, and he will give their land to you and to your seed after you. For from this day the city called Sychem shall be a city of fools. For just as one mocks a fool, so we mocked them, because they indeed committed folly in Israel by defiling my sister. Then, after taking her up[b], we came to Bethel.”
translation:
  language: ru
  text: '7 И я сказал моему отцу Иакову: «В тебе Господь обратит хананеев в ничто и отдаст их землю тебе и твоему потомству после тебя. 2 Ибо с этого дня город, называемый Сихемом[a], станет городом безумцев: как насмехаются над глупцом, так и мы насмеялись над ними. 3 Ведь они и в самом деле совершили безумие в Израиле, осквернив мою сестру. 4 Затем, уведя Дину с собой[b], мы пришли в Вефиль».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте — Σύκημα (Сикема), форма названия города, обычно именуемого по-русски Сихемом.
    reason: lexical_alternative
  - marker: b
    text: 'Или: «забрав Дину оттуда». Текст этого места труден; вероятнее всего, речь идёт о том, что Дину увели с собой перед уходом в Вефиль.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ἐν σοὶ
  choice: в тебе
  rationale: Сохраняет необычную формулировку греческого текста и её патриархально-заветный оттенок, не сводя её однозначно к более толковательному «через тебя».
- source_word: ἐξουδενώσει
  choice: обратит ... в ничто
  rationale: Передаёт решительное уничижение и лишение силы в контексте судьбы хананеев, оставаясь близким к образу исходного глагола.
- source_word: σπέρματί
  choice: потомству
  rationale: В современном русском «потомство» естественно и ясно передаёт собирательное значение «семени», сохраняя язык патриархального обетования без неестественной буквальности.
- source_word: ἀσυνέτων
  choice: безумцев
  rationale: Генитив передан естественным сочетанием «город безумцев»; слово поддерживает смысловую связь с последующим «безумие».
- source_word: χλευάσει / ἐχλευάσαμεν
  choice: насмехаются / насмеялись
  rationale: Сохраняется намеренный лексический повтор и обобщающий характер сравнения.
- source_word: ἀφροσύνην
  choice: безумие
  rationale: Передаёт нравственную глупость поступка и сохраняет узнаваемую связь с формулой «совершить безумие в Израиле».
- source_word: μιάναντες
  choice: осквернив
  rationale: Сохраняет нравственно-религиозный оттенок загрязнения, не добавляя отсутствующей в греческом тексте конкретизации насилия.
- source_word: Ἀπάραντες ... Δίναν
  choice: уведя Дину с собой
  rationale: 'Передаёт наиболее вероятный смысл трудного места: Дину забрали оттуда перед дальнейшим путём в Вефиль; неоднозначность отмечена в сноске.'
- source_word: Βεθήλ
  choice: Вефиль
  rationale: Употреблена закрепившаяся в русской библейской традиции форма географического имени.
- source_word: Σύκημα
  choice: Сихем
  rationale: Употреблена узнаваемая русская библейская форма названия; греческая форма имени пояснена в сноске.
theological_decisions:
- issue: Язык обетования о земле и потомстве в речи Левия к Иакову
  choice: Сохранить прямое действие Господа, дарование земли и собирательное «потомство»
  alternative: Передать как общее предсказание победы и употребить «потомки»
  rationale: Греческий текст явно перекликается с патриархальными обетованиями о земле и семени; перевод сохраняет этот богословский фон, не навязывая более позднего толкования.
- issue: Нравственная характеристика поступка сихемлян
  choice: «совершили безумие в Израиле, осквернив мою сестру»
  alternative: «совершили бесчестье» либо более явно описать сексуальное насилие
  rationale: Выбранная формулировка сохраняет нравственно-религиозную лексику греческого текста и его напряжение, не ослабляя и не конкретизируя сказанное сверх источника.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены повтор «насмехаются — насмеялись», формула «безумие в Израиле» и напряжённая конструкция «в тебе», тогда как географические имена даны в привычных русских библейских формах.
