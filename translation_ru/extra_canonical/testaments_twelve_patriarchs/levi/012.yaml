  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/012.yaml
  text: 1. And Gersam took a wife, and by her he fathered Lomne and Semee. 2. And the sons of Kaath were Ambram, Isachar, Chebron, and Ozeel. 3. And the sons of Merari were Mooli and Mouses. 4. And in the sixty-fourth year of my life, Ambram took Jochebed my daughter as a wife for himself, because he and my daughter were born on one and the same day. 5. I was eight years old when I entered the land of Canaan, and eighteen years old when I killed Shechem, and nineteen years old when I served as priest, and twenty-eight years old when I took a wife, and forty-eight years old when I entered Egypt. 6. And behold, my children, you are the third generation. 7. Joseph died in the one hundred eighteenth year of my life.
translation:
  language: ru
  text: 1. Герсам взял себе жену, и от неё у него родились Ломни и Семей. 2. Сыновьями Каата были Авраам, Исахар, Хеврон и Озиил.[a] 3. Сыновьями Мерари были Мооли и Моисей.[b] 4. На девяносто четвёртом году моей жизни Авраам взял себе в жёны мою дочь Иохавед,[c] потому что он и моя дочь родились в один и тот же день. 5. Мне было восемь лет, когда я вошёл в землю Ханаанскую; восемнадцать — когда убил Сихема; девятнадцать — когда стал совершать священническое служение; двадцать восемь — когда взял себе жену; и сорок восемь — когда вошёл в Египет.[d] 6. И вот, дети мои, вы — третье поколение. 7. Иосиф умер на сто восемнадцатом году моей жизни.
  philosophy: optimal-equivalence
