  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/004.yaml
  text: And I was grieved over the race of the sons of men, and I prayed to the Lord that I might be saved.
translation:
  language: ru
  text: И я скорбел о роде сынов человеческих и молился Господу, чтобы мне спастись.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤμην λυπούμενος
  choice: я скорбел
  rationale: Перифрастическая конструкция передаёт продолжительное состояние глубокой печали; «скорбел» естественно и достойно звучит по-русски.
- source_word: ὑπὲρ γένους τῶν υἱῶν τῶν ἀνθρώπων
  choice: о роде сынов человеческих
  rationale: Сохраняется родовая лексика и традиционный библейский оборот без сведения γένος лишь к «поколению».
- source_word: ηὐξάμην τῷ Κυρίῳ
  choice: молился Господу
  rationale: Обычное русское управление точно передаёт обращение с молитвой к Господу.
- source_word: ὅπως σωθῶ
  choice: чтобы мне спастись
  rationale: Сохраняет форму первого лица и неопределённость относительно характера спасения.
theological_decisions:
- issue: Смысл σωθῶ
  choice: мне спастись
  alternative: я был спасён / меня избавили
  rationale: Греческий аорист пассивного сослагательного в целевой конструкции говорит о желаемом спасении или избавлении, не уточняя его духовный либо физический характер; перевод не снимает эту неоднозначность.
translation_notes:
  register: Современный литературный русский с умеренно традиционной библейской окраской. Синтаксис близок к греческому, но естественен для русского читателя.
