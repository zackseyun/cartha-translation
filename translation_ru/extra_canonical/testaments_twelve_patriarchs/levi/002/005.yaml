  text: Тогда меня одолел сон, и я увидел высокую гору, и я был на ней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέπεσέν με ὕπνος
  choice: меня одолел сон
  rationale: Естественная современная передача греческого оборота «сон напал/сошёл на меня», сохраняющая внезапность наступления сна.
- source_word: ἐθεασάμην
  choice: я увидел
  rationale: Передаёт зрительное восприятие в видении без добавления отсутствующего в тексте пояснения.
- source_word: ὄρος ὑψηλόν
  choice: высокую гору
  rationale: Прямое и естественное соответствие греческому словосочетанию.
- source_word: ἤμην ἐν αὐτῷ
  choice: оказался на ней
  rationale: Для горы русский предлог «на» естественнее буквального «в»; «оказался» связно передаёт смену положения внутри видения, хотя формально греческое выражение означает «я был на ней».
