  source_fidelity: 'В целом перевод точно передаёт возрастную характеристику, совместное действие с Симеоном, Дину и Еммора. Однако καὶ τότε («и тогда») не следует заменять придаточным «когда»: в оригинале это самостоятельное последовательное указание, а не временная конструкция, связывающая действие с возрастом.'
