  text: And I was still young, about twenty years old, and then I carried out vengeance with Simeon for our sister Dinah against Hamor.
translation:
  language: ru
  text: Я был ещё молод, лет двадцати, и тогда вместе с Симеоном отомстил Еммору за нашу сестру Дину.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεώτερος
  choice: ещё молод
  rationale: Передаёт сравнительную форму в естественном русском повествовании без неуместного уточнения, с кем именно сравнивается возраст.
- source_word: ὡς ἐτῶν εἴκοσι
  choice: лет двадцати
  rationale: Сохраняет приблизительность ὡς и звучит естественно на современном литературном русском.
- source_word: ἐποίησα τὴν ἐκδίκησιν
  choice: отомстил
  rationale: Идиоматично и точно передаёт греческое выражение «совершил возмездие/месть» в личном повествовании.
- source_word: μετὰ Συμεών
  choice: вместе с Симеоном
  rationale: Ясно передаёт совместное действие.
- source_word: ἀπὸ Ἐμμώρ
  choice: Еммору
  rationale: В данном контексте ἀπό обозначает того, на ком была вымещена месть; русский дательный при глаголе «отомстить» передаёт это естественно.
