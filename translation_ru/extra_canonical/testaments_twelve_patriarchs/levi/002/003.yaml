source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὡς δὲ ἐποίμαινον¹⁸ ἐν Ἀβελμαούλ¹⁹, πνεῦμα συνέσεως Κυρίου ἦλθεν ἐπʼ ἐμέ²⁰, καὶ *ἐθεώρουν πάντας ἀνθρώπους²¹ *ἀφανίσαντας τὴν ὁδὸν αὐτῶν²², καὶ *ἐπὶ τείχους οἰκοδομεῖτο ἡ ἁμαρτία καὶ ἐπὶ πύργους ἡ ἀδικία ἐκάθητο²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/003.yaml
  text: And as I was shepherding in Abelmaul, a spirit of understanding from the Lord came upon me, and I saw all people destroying their way, and sin was being built upon a wall, and injustice sat upon towers.
translation:
  language: ru
  text: Когда я пас стада в Авелмауле, на меня сошёл дух разумения от Господа, и я увидел всех людей, погубивших свой путь; грех возводился на стене, а неправда восседала на башнях.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίμαινον
  choice: пас стада
  rationale: Передаёт продолжительное действие «пас, был пастухом» естественным современным русским выражением; дополнение «стада» ясно подразумевается глаголом.
- source_word: πνεῦμα συνέσεως Κυρίου
  choice: дух разумения от Господа
  rationale: Сохраняет отсутствие артикля при πνεῦμα и связь с Господом, не предрешая, обозначает ли выражение особое действие Божьего Духа или дарованное Богом духовное состояние.
- source_word: ἀφανίσαντας τὴν ὁδὸν αὐτῶν
  choice: губят свой путь
  rationale: Глагол ἀφανίζω здесь выражает разрушение или погубление, а не просто нравственное искажение; настоящее время по-русски согласуется с продолжающимся видением после ἐθεώρουν.
- source_word: οἰκοδομεῖτο
  choice: возводится
  rationale: Сохраняет строительную метафору и страдательный характер формы без добавления неуказанного деятеля.
- source_word: ἐκάθητο
  choice: восседает
  rationale: Передаёт олицетворённую неправду, занимающую господствующее место на башнях, и сохраняет возвышенный образный регистр.
theological_decisions:
- issue: Природа «духа разумения»
  choice: строчная форма «дух разумения»
  alternative: «Дух разумения» как явное личное именование Святого Духа
  rationale: В греческом тексте πνεῦμα стоит без артикля, поэтому перевод не должен типографически устранять возможную неоднозначность.
- issue: Образ человеческого пути
  choice: сохранить «губят свой путь»
  alternative: «развращают свой образ жизни»
  rationale: Буквальный образ пути и сильное значение ἀφανίζω сохраняют как лексическую остроту, так и богословскую напряжённость текста.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренно возвышенной образностью. Необычные пространственные образы стены и башен сохранены, а не истолкованы или сглажены.
