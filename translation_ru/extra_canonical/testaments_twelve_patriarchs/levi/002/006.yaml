  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/006.yaml
  text: And behold, the heavens were opened, and an angel of the Lord said to me, “Levi, Levi, enter.”
translation:
  language: ru
  text: 'И вот, небеса раскрылись, и ангел Господень сказал мне: «Левий, Левий, войди».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: И вот
  rationale: Сохраняет повествовательный переход и оттенок внезапного видения, оставаясь естественным для литературного русского языка.
- source_word: ἀνεῴχθησαν οἱ οὐρανοί
  choice: небеса раскрылись
  rationale: Передаёт множественное число οἱ οὐρανοί и пассивно-возвратный смысл действия без ненужного уточнения действующего лица.
- source_word: ἄγγελος Κυρίου
  choice: ангел Господень
  rationale: Традиционная и понятная русская передача конструкции без определённого артикля; не вводит более определённого смысла, чем допускает греческий текст.
- source_word: εἴσελθε
  choice: войди
  rationale: Прямой эквивалент повелительной формы аориста со значением вступления внутрь.
theological_decisions:
- issue: Число в выражении «небеса»
  choice: 'Сохранено множественное число: «небеса»'
  alternative: «небо»
  rationale: Греческий источник прямо использует множественное число, которое может быть значимо для дальнейшего небесного видения Левия.
- issue: Определённость ангела
  choice: «ангел Господень»
  alternative: «Ангел Господень» или «один из ангелов Господа»
  rationale: Строчная буква не превращает выражение в специальный титул, а добавление «один из» отсутствует в источнике.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Повтор имени сохранён. Кавычки оформлены по нормам русского языка.
