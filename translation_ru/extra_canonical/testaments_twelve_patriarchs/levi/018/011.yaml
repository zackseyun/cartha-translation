  text: And he will give the holy ones to eat from the tree of life, and the spirit of holiness will be upon them.
translation:
  language: ru
  text: И он даст святым есть от дерева жизни, и дух святости будет на них.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς ἁγίοις
  choice: святым
  rationale: Сохраняет субстантивированное значение греческого прилагательного во множественном числе и естественно звучит в русском библейском регистре.
- source_word: φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: вкусить от дерева жизни
  rationale: Передаёт инфинитив «есть» и конструкцию с ἐκ; «вкусить» создаёт естественную и торжественную библейскую формулировку без изменения смысла.
- source_word: πνεῦμα ἁγιωσύνης
  choice: Дух святости
  rationale: Буквально отражает родительную конструкцию и не заменяет её более толковательным выражением «Святой Дух».
- source_word: ἔσται ἐπ᾿ αὐτοῖς
  choice: пребудет на них
  rationale: Передаёт будущее значение ἔσται и пространственно-реляционное ἐπί; «пребудет» уместно для устойчивого действия или состояния в возвышенном регистре.
theological_decisions:
- issue: Личностное или неличностное понимание πνεῦμα ἁγιωσύνης
  choice: Дух святости
  alternative: дух святости
  rationale: Заглавная буква согласуется с вероятной отсылкой к Божьему Духу, однако сама формула сохранена буквально и не нормализована до «Святой Дух», благодаря чему смысловая напряжённость оригинала остаётся видимой.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксический параллелизм оригинала сохранён; текст остаётся понятным без архаизации.
