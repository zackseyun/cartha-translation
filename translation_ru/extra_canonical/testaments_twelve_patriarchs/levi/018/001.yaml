  language: ru
  text: И после того как от Господа придёт их возмездие, священство прекратится.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ τὸ γενέσθαι
  choice: после того, как … совершится
  rationale: Передаёт временную конструкцию с субстантивированным инфинитивом естественным русским придаточным предложением.
- source_word: τὴν ἐκδίκησιν αὐτῶν
  choice: возмездие над ними
  rationale: Родительный αὐτῶν формально допускает неоднозначность, но сочетание с παρὰ κυρίου наиболее естественно обозначает возмездие, направленное на них, а не совершаемое ими.
- source_word: παρὰ κυρίου
  choice: от Господа
  rationale: Сохраняет указание на Господа как источник возмездия без добавочного истолкования.
- source_word: ἐκλείψει ἡ ἱερωσύνη
  choice: священство прекратится
  rationale: ἐκλείπω здесь означает прекращение существования или действия; «прекратится» звучит современно и не уточняет, временно это или окончательно.
theological_decisions:
- issue: Направленность выражения ἐκδίκησιν αὐτῶν
  choice: возмездие над ними
  alternative: их отмщение / возмездие за них
  rationale: Источник возмездия обозначен словами «от Господа», поэтому контекстуально вероятнее объективное понимание αὐτῶν. При этом не добавляется указание, за какое именно деяние следует возмездие.
- issue: Характер прекращения священства
  choice: священство прекратится
  alternative: священство оскудеет / потерпит крах
  rationale: Текст утверждает прекращение священства, но не раскрывает его продолжительность или богословский механизм; перевод не должен это конкретизировать.
translation_notes:
