revisions:
- from: И после того, как от Господа совершится возмездие над ними, священство прекратится.
  to: И после того как от Господа придёт их возмездие, священство прекратится.
  rationale: Заменено «возмездие над ними» на «их возмездие», чтобы не разрешать неоднозначность родительного αὐτῶν. Глагол «придёт» делает сочетание с «от Господа» более естественным по-русски и сохраняет указание на Господа как источник возмездия. Остальная структура и смысл не изменены.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T22:29:35Z'
review_pass:
  verdict: revise
  source_fidelity: 'Греческое τὴν ἐκδίκησιν αὐτῶν допускает более одной связи родительного αὐτῶν: «их возмездие» может означать возмездие, относящееся к ним, без явного уточнения, направлено ли оно на них или совершается ими/ради них. Вариант «возмездие над ними» снимает эту неоднозначность. Временная последовательность, παρὰ κυρίου и предсказание прекращения священства в остальном переданы верно.'
  naturalness: «После того, как от Господа совершится…» грамматически возможно, но несколько тяжеловесно. «После того как от Господа придёт их возмездие» естественно для современного литературного русского и сохраняет сдержанную библейскую окраску.
  terminology: «Господь» и «священство» переданы последовательно и точно. «Прекратится» адекватно передаёт ἐκλείψει, не конкретизируя характер или длительность прекращения. «Их возмездие» ближе к английскому audit trail («their vengeance») и не навязывает одно толкование αὐτῶν.
  issues:
  - severity: medium
    issue: Не сохранена синтаксико-семантическая неоднозначность αὐτῶν в τὴν ἐκδίκησιν αὐτῶν.
    rationale: Формулировка «возмездие над ними» однозначно делает их объектом возмездия, тогда как греческий родительный и английское «their vengeance» не требуют такого уточнения. Без текстологического или контекстуального основания предпочтительно сохранить неоднозначность.
  revised_text: И после того как от Господа придёт их возмездие, священство прекратится.
