  source_fidelity: Требуется две точечные правки. Греческое ὕδωρ стоит в единственном числе, поэтому «как вода морей» точнее, чем «как воды морей». Кроме того, ἐν αὐτῷ буквально сохраняет связь радости «в нём»; «о нём» сдвигает значение к радости по поводу кого-либо.
  naturalness: После замены «воды» на «вода» текст остаётся естественным современным литературным русским с уместным торжественным параллелизмом. «Возрадуются в нём» несколько возвышенно, но оправдано жанром и необходимо для сохранения греческой конструкции.
  terminology: «Господь», «знание Господа», «лицо Господне» переданы последовательно. Формула «ангелы славы лица Господня» намеренно сохраняет трудную цепочку родительных падежей и не навязывает богословского истолкования.
