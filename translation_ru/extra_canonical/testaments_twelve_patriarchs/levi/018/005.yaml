  - severity: medium
    issue: Передача ἐν αὐτῷ как «о нём»
    rationale: Предлог ἐν с дательным падежом означает «в нём». Вариант «о нём» передаёт иной тип отношения и устраняет сохранённую в английском аудите формулировку «in him».
