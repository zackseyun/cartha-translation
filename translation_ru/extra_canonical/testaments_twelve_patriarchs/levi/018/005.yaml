base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/005.yaml
  text: The heavens will rejoice in his days, and the earth will be glad, and the clouds will rejoice; [and the knowledge of the Lord will be poured out upon the earth like the water of the seas;] and the angels of the glory of the Lord's presence will be glad in him.
translation:
  language: ru
  text: В его дни возликуют небеса, возрадуется земля и будут ликовать облака.[a] [И знание Господа изольётся на землю, как вода морей.][b] И ангелы славы лица Господня возрадуются в нём.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте слово, переведённое как «облака», отмечено издателем как текстологически сомнительное.
    reason: Кресты в исходном критическом тексте указывают на повреждённое или неуверенно восстановленное чтение.
  - marker: b
    text: Слова в квадратных скобках имеют неуверенную текстовую засвидетельствованность.
    reason: Необходимо сохранить редакционный статус заключённого в скобки греческого фрагмента.
  - marker: c
    text: Выражение «ангелы славы лица Господня» допускает более одного синтаксического понимания; перевод сохраняет неоднозначность греческого текста.
    reason: Предотвращает незаметное закрепление одного богословского истолкования сложной цепочки родительных падежей.
lexical_decisions:
- source_word: ἀγαλλιάσονται / χαρήσεται / εὐφρανθήσονται
  choice: «возликуют / возрадуется / будут ликовать / возрадуются»
  rationale: Переданы близкие, но не вполне тождественные греческие глаголы радости; русский текст сохраняет поэтический параллелизм без искусственного единообразия.
- source_word: ἐν ταῖς ἡμέραις αὐτοῦ
  choice: «в его дни»
  rationale: Прямое и естественное соответствие, сохраняющее мессиански окрашенную, но грамматически неуточнённую отсылку местоимения.
- source_word: ἡ γνῶσις κυρίου
  choice: «знание Господа»
  rationale: 'Сохраняет возможную двойственность: знание о Господе и знание, связанное с Ним; более конкретное «познание» могло бы сузить смысл.'
- source_word: ἐκχυθήσεται
  choice: «изольётся»
  rationale: Сохраняет образ обильного излияния, выраженный пассивной формой греческого глагола.
- source_word: ὡς ὕδωρ θαλασσῶν
  choice: «как воды морей»
  rationale: Передаёт множественное число обоих значимых образов и не исправляет необычное сравнение в более привычную библейскую формулу.
- source_word: οἱ ἄγγελοι τῆς δόξης τοῦ προσώπου κυρίου
  choice: «ангелы славы лица Господня»
  rationale: Формально сохраняет цепочку родительных падежей и её подлинную смысловую неоднозначность, не превращая её без текстовых оснований в «славных ангелов пред лицом Господа».
- source_word: ἐν αὐτῷ
  choice: «о нём»
  rationale: По-русски естественно при глаголе радости и сохраняет личную отсылку; буквальное «в нём» возможно, но здесь звучит менее ясно и естественно.
theological_decisions:
- issue: Референт местоимений αὐτοῦ и αὐτῷ
  choice: «его / о нём» со строчной буквы
  alternative: «Его / о Нём» с прописной буквы
  rationale: Греческая орфография сама по себе не кодирует богословское отождествление референта; строчная буква не навязывает читателю вывод о его божественном статусе.
- issue: Статус фразы о знании Господа
  choice: Сохранить квадратные скобки в основном тексте
  alternative: Включить без скобок или исключить
  rationale: Предоставленный критический текст отмечает эту фразу квадратными скобками; публикационный перевод должен явно сохранять текстологическую неуверенность.
- issue: «Слава лица Господня»
  choice: Сохранить синтаксическую напряжённость выражения
  alternative: Истолковать как «ангелы, предстоящие славному лицу Господа» или «славные ангелы присутствия Господа»
  rationale: Греческая цепочка допускает разные способы связи родительных определений; уточняющая перестройка внесла бы интерпретацию в основной текст.
translation_notes:
  register: 'Современный литературный русский с торжественным пророческим ритмом. Сохранены параллелизм, образность и повтор лексики радости. Архаизирующий элемент «лица Господня» употреблён ограниченно: он позволяет точно и компактно передать трудную греческую конструкцию, не устраняя её неоднозначности.'
