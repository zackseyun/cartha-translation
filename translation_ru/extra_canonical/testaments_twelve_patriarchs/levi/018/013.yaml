source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ εὐφρανθήσεται κύριος ἐπὶ τοῖς τέκνοις αὐτοῦ⁷⁰, καὶ εὐδοκήσει⁷¹ ἐπὶ *τοῖς ἀγαπητοῖς⁷² αὐτοῦ *ἕως αἰῶνος⁷³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/013.yaml
  text: And the Lord will rejoice over his children, and he will take pleasure in his beloved ones forever.
translation:
  language: ru
  text: И возрадуется Господь о Своих детях, и будет благоволить к Своим возлюбленным вовеки.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐφρανθήσεται
  choice: возрадуется
  rationale: Будущее время передано прямо; «возрадуется» сохраняет возвышенный, но понятный современному читателю библейский регистр.
- source_word: τέκνοις
  choice: детях
  rationale: Обычное и точное соответствие для τέκνα в отношении Господа к принадлежащим Ему людям.
- source_word: εὐδοκήσει ἐπί
  choice: будет благоволить к
  rationale: Передаёт положительное расположение и довольство, выраженные глаголом εὐδοκέω, не сводя смысл лишь к эмоциональному удовольствию.
- source_word: τοῖς ἀγαπητοῖς
  choice: Своим возлюбленным
  rationale: Субстантивированное прилагательное сохранено как обозначение любимых Господом людей; вариант соответствует множественному числу и не уточняет их статус сверх текста.
- source_word: ἕως αἰῶνος
  choice: вовеки
  rationale: Кратко и естественно передаёт неограниченную длительность в возвышенном регистре.
theological_decisions:
- issue: Кого обозначают «дети» и «возлюбленные»
  choice: Сохранены два параллельных обозначения без отождествляющего пояснения.
  alternative: Явно назвать их Божьим народом или праведниками.
  rationale: Греческий текст не вводит такого уточнения; перевод сохраняет исходную смысловую открытость.
- issue: Смысл εὐδοκήσει
  choice: «будет благоволить»
  alternative: «будет находить удовольствие» / «будет доволен»
  rationale: Выбранная формулировка сохраняет богословски насыщенное значение благосклонности, не исключая оттенка удовольствия.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Притяжательное местоимение оформлено с прописной буквы по русской религиозно-издательской традиции; структура двух параллельных частей сохранена.
