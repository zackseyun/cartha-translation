source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἐπὶ *τῆς ἱερωσύνης⁵² αὐτοῦ⁵³ *τὰ ἔθνη⁵⁴ πληθυνθήσονται⁵⁵ ἐν γνώσει ἐπὶ τῆς γῆς, καὶ φωτισθήσονται διὰ χάριτος κυρίου. [ὁ δὲ Ἰσραὴλ ἐλαττωθήσεται ἐν ἀγνωσίᾳ καὶ σκοτισθήσεται ἐν πένθει]⁵⁶. ἐπὶ τῆς ἱερωσύνης αὐτοῦ ἐκλείψει⁵⁷ ἡ⁵⁸ ἁμαρτία καὶ οἱ ἄνομοι *καταπαύσουσιν εἰς κακά⁵⁹, [οἱ δὲ δίκαιοι καταπαύσουσιν ἐν αὐτῷ]⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/009.yaml
  text: And during his priesthood the nations will be multiplied in knowledge upon the earth, and they will be enlightened by the grace of the Lord. [But Israel will be diminished in ignorance and darkened in mourning.] During his priesthood sin will cease, and the lawless will cease from evil; [and the righteous will rest in him].
translation:
  language: ru
  text: И во время его священства народы умножатся в познании на земле и будут просвещены благодатью Господа. [А Израиль умалится в неведении и будет омрачён во скорби.][a] Во время его священства грех прекратится, и беззаконные перестанут творить зло; [а праведные обретут покой в нём].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «А Израиль умалится в неведении и будет омрачён во скорби» текстологически не вполне определённы и в издании заключены в квадратные скобки.
    reason: Обозначить текстологическую неуверенность, отражённую квадратными скобками исходного критического текста.
  - marker: b
    text: Слова «а праведные обретут покой в нём» текстологически не вполне определённы и в издании заключены в квадратные скобки.
    reason: Обозначить текстологическую неуверенность, отражённую квадратными скобками исходного критического текста.
lexical_decisions:
- source_word: ἐπὶ τῆς ἱερωσύνης αὐτοῦ
  choice: во время его священства
  rationale: Предлог ἐπί с родительным здесь естественно обозначает период, в течение которого совершается действие; формулировка сохраняет повтор исходного текста.
- source_word: τὰ ἔθνη
  choice: народы
  rationale: Передаёт множественное число и обычное значение ἔθνη, не сужая его до какого-либо одного этнического или религиозного обозначения.
- source_word: πληθυνθήσονται ἐν γνώσει
  choice: умножатся в познании
  rationale: 'Сохраняет необычную конструкцию греческого текста и её смысловую неоднозначность: речь может идти как о возрастании народов, так и о распространении познания среди них.'
- source_word: φωτισθήσονται διὰ χάριτος κυρίου
  choice: будут просвещены благодатью Господа
  rationale: Естественно передаёт страдательный залог и инструментальное значение διά с родительным, сохраняя богословский образ просвещения.
- source_word: ἐκλείψει ἡ ἁμαρτία
  choice: грех прекратится
  rationale: ἐκλείπω здесь означает исчезновение или прекращение; «прекратится» звучит естественно и не усиливает утверждение до полного уничтожения греха.
- source_word: οἱ ἄνομοι καταπαύσουσιν εἰς κακά
  choice: беззаконные перестанут творить зло
  rationale: Передаёт трудную и несколько неровную греческую конструкцию идиоматически, в соответствии с вероятным смыслом прекращения злых дел.
- source_word: καταπαύσουσιν ἐν αὐτῷ
  choice: обретут покой в нём
  rationale: Передаёт значение покоя или успокоения и сохраняет местоименную отсылку без уточнения, относится ли «в нём» к священнику или иному подразумеваемому лицу.
theological_decisions:
- issue: Кто просвещает народы и каким образом
  choice: будут просвещены благодатью Господа
  alternative: просветятся по благодати Господа
  rationale: Выбрана страдательная форма исходного глагола; при этом не добавляется прямо названный деятель, которого греческий текст не указывает.
- issue: Отсылка местоимения ἐν αὐτῷ
  choice: в нём
  alternative: в его священстве / в Господе
  rationale: Сохранена неоднозначная местоименная отсылка исходника, чтобы не навязывать богословское толкование.
- issue: Смысл умножения народов в познании
  choice: народы умножатся в познании
  alternative: познание умножится среди народов
  rationale: Альтернатива делает «познание» подлежащим, хотя в греческом подлежащее — «народы»; буквенная структура сохранена несмотря на её необычность.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной и пророческой речи. Сохранены параллелизм, повтор «во время его священства» и квадратные скобки критического издания. Необычное «умножатся в познании» оставлено намеренно ради смысловой неоднозначности греческого текста.
