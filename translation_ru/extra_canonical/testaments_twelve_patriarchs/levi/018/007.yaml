base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/007.yaml
  text: And the glory of the Most High will be spoken over him, and a spirit of understanding and sanctification will rest upon him [in the water].
translation:
  language: ru
  text: И слава Всевышнего будет произнесена над ним, и дух разумения и освящения почиет на нём [в воде][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «в воде» в греческом тексте заключены в квадратные скобки и, вероятно, представляют собой текстуально неуверенное добавление.
    reason: Сноска поясняет редакционные квадратные скобки в исходном тексте и текстуальную неуверенность данного словосочетания.
lexical_decisions:
- source_word: δόξα ὑψίστου
  choice: слава Всевышнего
  rationale: Прямо передаёт греческое выражение, сохраняя возвышенный, но понятный современному читателю библейский регистр.
- source_word: ἐπ’ αὐτὸν ῥηθήσεται
  choice: будет возвещена над ним
  rationale: Сохраняет пассивную форму ῥηθήσεται и пространственный оттенок ἐπί; необычность исходного выражения не устраняется толкованием вроде «будет дарована ему».
- source_word: πνεῦμα συνέσεως
  choice: дух разумения
  rationale: «Разумение» передаёт способность постигать и понимать, обозначенную συνέσις, и соответствует торжественному контексту.
- source_word: ἁγιασμοῦ
  choice: освящения
  rationale: Сохраняет процессуально-сакральный оттенок существительного ἁγιασμός, не сводя его без необходимости к качеству «святость».
- source_word: καταπαύσει ἐπ’ αὐτόν
  choice: почиет на нём
  rationale: Естественная русская передача образа пребывающего на человеке духа; сохраняет направленность конструкции с ἐπί.
theological_decisions:
- issue: Связь славы Всевышнего с избранной фигурой
  choice: «будет возвещена над ним»
  alternative: «будет изречена о нём»
  rationale: Выбранная формулировка сохраняет буквальный пространственный оттенок ἐπί и не решает однозначно, говорится ли о провозглашении славы относительно него или о нисхождении славы на него.
- issue: Значение ἁγιασμός
  choice: «освящение»
  alternative: «святость»
  rationale: Перевод не подменяет возможное действие или состояние освящения отвлечённым нравственным качеством.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Формы «Всевышнего», «разумения» и «почиет» поддерживают торжественный тон, не делая текст архаичным; необычная формула о славе намеренно сохранена.
