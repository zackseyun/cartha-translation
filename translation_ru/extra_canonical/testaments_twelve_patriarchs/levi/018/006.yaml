    rationale: Греческий глагол означает «придёт, явится, достигнет»; нисхождение может подразумеваться контекстом, но не выражено самим словом.
  - severity: low
    issue: Сравнение эксплицировано как голос Авраама, обращённый к Исааку
    rationale: Греческое ὡς ἀπὸ Ἀβραὰμ πρὸς Ἰσαάκ эллиптично. Такая расшифровка возможна, но в основном тексте чрезмерно фиксирует синтаксическую связь; её лучше дать как вероятное пояснение в сноске.
