base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/006.yaml
  text: The heavens will be opened, and from the temple of glory holiness will come upon him with a fatherly voice, as from Abraham to Isaac.
translation:
  language: ru
  text: Небеса откроются, и из храма славы придёт на него святыня с отеческим голосом, словно от Авраама к Исааку.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «с отеческим голосом, как от Авраама к Исааку». Греческое сравнение эллиптично; вероятно, оно уподобляет голос голосу Авраама, обращённому к Исааку.'
    reason: Сохраняет неоднозначную форму исходного сравнения в основном тексте, не скрывая его наиболее естественного понимания.
lexical_decisions:
- source_word: Οἱ οὐρανοὶ ἀνοιγήσονται
  choice: Небеса откроются
  rationale: Прямо передаёт пассивную форму будущего времени и сохраняет возвышенный, но понятный русский регистр.
- source_word: ἐκ τοῦ ναοῦ τῆς δόξης
  choice: из храма славы
  rationale: Сохраняет исходную именную конструкцию и её возможную богословскую многозначность.
- source_word: ἥξει ἐπ᾽ αὐτὸν ἁγίασμα
  choice: сойдёт на него святыня
  rationale: ἁγίασμα обозначает освящённую реальность или святыню; «сойдёт» естественно выражает движение свыше, не превращая существительное в отвлечённый процесс «освящения».
- source_word: μετὰ φωνῆς πατρικῆς
  choice: сопровождаемая отеческим голосом
  rationale: Передаёт совместность, выраженную μετά, и устраняет неестественную русскую связь «с голосом», не отождествляя при этом святыню с голосом.
- source_word: ὡς ἀπὸ Ἀβραὰμ πρὸς Ἰσαάκ
  choice: подобным голосу Авраама, обращённому к Исааку
  rationale: Делает понятным эллиптическое греческое сравнение, сохраняя направление речи от Авраама к Исааку.
theological_decisions:
- issue: Значение ἁγίασμα
  choice: святыня
  alternative: святость / освящение
  rationale: Форма является существительным, способным обозначать святую или освящённую реальность. «Святыня» сохраняет предметную неопределённость текста; «освящение» сильнее навязывало бы процессуальное толкование.
- issue: Связь отеческого голоса со сравнением об Аврааме и Исааке
  choice: голос уподоблен голосу Авраама, обращённому к Исааку
  alternative: голос исходит буквально от Авраама к Исааку
  rationale: ὡς указывает на сравнение, тогда как ἀπό и πρός задают образ направления речи. Перевод не утверждает тождества небесного голоса с голосом Авраама.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Архаизмы и конфессионально нагруженные уточнения не использованы; синтаксис слегка прояснён ради естественности.
