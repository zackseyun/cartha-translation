  source_fidelity: 'Греческое ἀγαλλιάσεται стоит в единственном числе, тогда как в черновике «возликуют» — множественное. Хотя английская аудиторская версия нормализует это в множественное число, русский перевод должен прежде всего отражать форму исходного текста. Единственное число перед последующим рядом имён возможно в русском литературном, возвышенном регистре и сохраняет особенность греческого текста. Остальные соответствия точны: χαρήσομαι — «возрадуюсь», οἱ ἅγιοι — «святые», ἐνδύσονται δικαιοσύνην — «облекутся в праведность».'
