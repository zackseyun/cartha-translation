  text: Τοτὲ ἀγαλλιάσεται Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ, κἀγὼ χαρήσομαι⁷⁴, καὶ πάντες οἱ ἅγιοι ἐνδύσονται⁷⁵ δικαιοσύνην⁷⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/014.yaml
  text: Then Abraham and Isaac and Jacob will exult, and I will rejoice, and all the holy ones will put on righteousness.
translation:
  language: ru
  text: Тогда возликует Авраам, Исаак и Иаков, и я возрадуюсь, и все святые облекутся в праведность.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαλλιάσεται
  choice: возликуют
  rationale: Глагол передаёт сильную, торжественную радость; множественное число по-русски согласовано с однородным составным подлежащим «Авраам, Исаак и Иаков».
- source_word: χαρήσομαι
  choice: возрадуюсь
  rationale: Сохраняет значение будущей радости и возвышенный регистр, при этом отличает этот глагол от предшествующего ἀγαλλιάσεται.
- source_word: οἱ ἅγιοι
  choice: святые
  rationale: Субстантивированное прилагательное естественно передаётся как «святые», без добавления отсутствующего в греческом существительного.
- source_word: ἐνδύσονται δικαιοσύνην
  choice: облекутся в праведность
  rationale: Сохранён образ облачения и прямое богословски значимое понятие δικαιοσύνη — «праведность».
theological_decisions:
- issue: Образ облачения в праведность
  choice: облекутся в праведность
  alternative: станут праведными
  rationale: Буквальный образ текста сохранён без сведения метафоры к одному возможному богословскому толкованию.
- issue: Значение οἱ ἅγιοι
  choice: все святые
  alternative: все освящённые
  rationale: «Святые» сохраняет смысловую ёмкость греческого выражения и не уточняет, идёт ли речь о людях, небесных существах или обеих группах.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Архаизирующее «облекутся» оправдано сохранением центральной метафоры и остаётся понятным современному читателю.
