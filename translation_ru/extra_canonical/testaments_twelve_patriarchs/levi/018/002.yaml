source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ³ τότε ἐγερεῖ⁴ κύριος ἱερέα καινόν⁵, ᾧ⁶ πάντες οἱ λόγοι κυρίου⁷ ἀποκαλυφθήσονται⁸, καὶ αὐτὸς ποιήσει κρίσιν⁹ ἀληθείας¹⁰ ἐπὶ τῆς γῆς¹¹ *ἐν πλήθει¹² ἡμερῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/002.yaml
  text: Then the Lord will raise up a new priest, to whom all the words of the Lord will be revealed; and he will execute true judgment upon the earth for many days.
translation:
  language: ru
  text: Тогда Господь воздвигнет нового священника, которому будут открыты все слова Господа; и он будет вершить истинный суд на земле многие дни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερεῖ
  choice: воздвигнет
  rationale: Передаёт действие Бога, который поставит и явит нового священника; это естественная для возвышенного библейского регистра формулировка.
- source_word: ἱερέα καινόν
  choice: нового священника
  rationale: Прямо сохраняет значение καινός и не уточняет, в каком именно смысле священник будет новым.
- source_word: πάντες οἱ λόγοι κυρίου
  choice: все слова Господа
  rationale: Сохраняет множественное число λόγοι и повтор титула κύριος без сведения выражения к более узкому понятию откровений или заповедей.
- source_word: ποιήσει κρίσιν ἀληθείας
  choice: будет вершить истинный суд
  rationale: Естественно по-русски передаёт семитизированное сочетание «суд истины», сохраняя смысл правдивого и справедливого суда.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Прямой и контекстуально нейтральный эквивалент; не устраняет возможную широту значения γῆ.
- source_word: ἐν πλήθει ἡμερῶν
  choice: многие дни
  rationale: Передаёт длительность выражения буквально по смыслу, не превращая её в неопределённое «долгое время».
theological_decisions:
- issue: Личность нового священника
  choice: Не идентифицировать его в переводе и сохранить неопределённое описание исходного текста.
  alternative: Назвать его Мессией или иным конкретным лицом.
  rationale: Греческий текст говорит только о «новом священнике»; конкретизация была бы толкованием.
- issue: Характер κρίσιν ἀληθείας
  choice: «истинный суд»
  alternative: «суд истины» или «справедливый суд»
  rationale: Выбранная формулировка естественна в современном русском и не сужает ἀλήθεια только до юридической справедливости.
translation_notes:
  register: Современный литературный русский с достоинством библейского повествования. Синтаксис близок к греческому, но не калькирован; двоеточие или примечания не требуются.
