source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ὁ Βελίαρ δεθήσεται ὑπ᾿ αὐτοῦ, καὶ δώσει ἐξουσίαν τοῖς τέκνοις αὐτοῦ⁶⁹ πατεῖν ἐπὶ τὰ πονηρὰ πνεύματα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/012.yaml
  text: And Beliar will be bound by him, and he will give authority to his children to trample on the evil spirits.
translation:
  language: ru
  text: И Велиар будет связан им, и он даст своим детям власть попирать злых духов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βελίαρ
  choice: Велиар
  rationale: Сохранена традиционная передача имени греческой формы Βελίαρ.
- source_word: δεθήσεται ὑπ᾿ αὐτοῦ
  choice: будет связан им
  rationale: Точно передаёт будущий пассив и указание на действующее лицо; неоднозначность местоимения сохранена.
- source_word: ἐξουσίαν
  choice: власть
  rationale: Естественный русский эквивалент со значением предоставленного права и силы действовать.
- source_word: τοῖς τέκνοις αὐτοῦ
  choice: своим детям
  rationale: Передаёт родственную образность τέκνοις; возвратное «своим» естественно соотносит детей с подлежащим «он».
- source_word: πατεῖν ἐπὶ τὰ πονηρὰ πνεύματα
  choice: попирать злых духов
  rationale: Сохранён сильный пространственно-победный образ глагола πατεῖν ἐπί; определённый артикль передаётся контекстуально без неестественного русского указателя.
theological_decisions:
- issue: Неоднозначность местоимений αὐτοῦ
  choice: «им» и «он» без поясняющей идентификации
  alternative: Назвать подразумеваемое лицо явно
  rationale: Греческий текст не повторяет имя референта; перевод не должен молча устранять возможную неоднозначность.
- issue: Образ власти над злыми духами
  choice: «попирать злых духов»
  alternative: «побеждать злых духов» или «наступать на злых духов»
  rationale: «Попирать» сохраняет буквальную метафору господства и победы, не сводя её к отвлечённому толкованию.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским звучанием. Синтаксический параллелизм оригинала сохранён; чрезмерная архаизация исключена.
