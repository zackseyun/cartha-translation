  source_fidelity: 'Нужно исправить пространственный оборот: греч. ἐν τῇ γῇ означает «на земле» (буквально «в земле/на земле» в данном контексте), а не «над землёй». Вариант «над землёй» переносит сияние в небо и тем самым меняет образ источника. Остальные смысловые элементы переданы верно: будущее действие, сравнение с солнцем, устранение всякой тьмы из-под неба и всеобщий мир.'
