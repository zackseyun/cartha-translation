  terminology: Термины и образность не содержат конфессионально окрашенных добавлений. «Воссияет», «тьма» и «мир» сохраняют широкий, неистолкованный образный диапазон оригинала. Личное «Он» допустимо как контекстуальное продолжение Οὗτος.
