base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/004.yaml
  text: He will shine forth like the sun upon the earth, and he will remove all darkness from under heaven, and there will be peace in all the earth.
translation:
  language: ru
  text: Он воссияет, как солнце, на земле, и удалит всю тьму из-под неба, и на всей земле воцарится мир.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλάμψει
  choice: воссияет
  rationale: Передаёт будущее время и образ яркого явления света; сохраняет возвышенный, но понятный современному читателю регистр.
- source_word: ὡς ὁ ἥλιος ἐν τῇ γῇ
  choice: как солнце, над землёй
  rationale: Сравнение сохранено прямо; «над землёй» естественно по-русски передаёт пространственный образ сияющего солнца, не меняя смысла.
- source_word: ἐξαρεῖ
  choice: удалит
  rationale: Нейтрально и точно передаёт устранение тьмы без добавления толковательного оттенка уничтожения или изгнания.
- source_word: ἐκ τῆς ὑπ᾽ οὐρανὸν
  choice: из-под неба
  rationale: Сохраняет греческий космологический оборот и его широкий охват.
- source_word: ἔσται εἰρήνη
  choice: воцарится мир
  rationale: Естественная русская формулировка наступления всеобщего мира; не вводит дополнительного действующего лица.
theological_decisions:
- issue: Личность подлежащего Οὗτος
  choice: Он
  alternative: Этот
  rationale: Местоимение указывает на ранее названного персонажа; «Он» естественно продолжает контекст и не уточняет его личность сверх источника.
- issue: Образ света и тьмы
  choice: Сохранён без пояснения как буквальный или духовный
  alternative: Истолковать тьму как зло или неведение
  rationale: Источник оставляет метафорический диапазон открытым, поэтому перевод не должен сужать его богословским толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской образностью. Синтаксический параллелизм греческого текста сохранён, при этом заключительное «воцарится мир» звучит естественнее буквального «будет мир».
