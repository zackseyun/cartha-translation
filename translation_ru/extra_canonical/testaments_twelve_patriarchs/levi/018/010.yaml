  text: Καίγε⁶¹ αὐτὸς⁶² ἀνοίξει τὰς θύρας⁶³ τοῦ παραδείσου, *καὶ ἀποστήσει⁶⁴ τὴν ἀπειλοῦσαν ῥομφαίαν⁶⁵ κατὰ τοῦ⁶⁶ Ἀδάμ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/010.yaml
  text: And indeed he will open the gates of paradise, and he will remove the threatening sword against Adam.
translation:
  language: ru
  text: И он сам воистину откроет врата рая и отведёт меч, угрожающий Адаму.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: И … воистину
  rationale: Передаёт усилительное значение сочетания καί γε естественным и торжественным русским оборотом.
- source_word: ἀνοίξει τὰς θύρας τοῦ παραδείσου
  choice: откроет врата рая
  rationale: Сохраняет образ множественного числа θύρας и возвышенный регистр текста; «врата» понятно современному читателю.
- source_word: ἀποστήσει
  choice: отведёт
  rationale: Передаёт каузативное значение «заставит отступить, удалит», не уточняя способ действия.
- source_word: τὴν ἀπειλοῦσαν ῥομφαίαν κατὰ τοῦ Ἀδάμ
  choice: угрожающий Адаму меч
  rationale: Причастие и оборот κατά с родительным естественно переданы как направленная против Адама угроза; «меч» — ясный эквивалент ῥομφαία в данном образном контексте.
theological_decisions:
- issue: Отношение меча к Адаму
  choice: угрожающий Адаму меч
  alternative: меч, направленный против Адама
  rationale: Выбор сохраняет явное значение ἀπειλοῦσαν и не добавляет предположений о наказании, охране или окончательном уничтожении меча.
- issue: Характер устранения меча
  choice: отведёт
  alternative: удалит
  rationale: Глагол оставляет открытым, будет ли меч устранён окончательно или лишь отведён в сторону, сохраняя смысловую широту ἀποστήσει.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской лексикой («врата рая», «воистину»); синтаксис краткий и доступный.
