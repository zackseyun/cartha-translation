revisions:
- from: Ибо Он навеки даст Своим сыновьям величие Господа в истине, и не будет после Него преемства из поколения в поколение — до вечности.
  to: Ибо он навеки даст своим сыновьям величие Господа в истине, и не будет ему преемства из поколения в поколение — до вечности.
  rationale: 'Исправлена передача διαδοχὴ αὐτοῦ: «не будет ему преемства» ближе к исходной конструкции и к английскому аудиторскому следу, чем «не будет после Него преемства». Местоимения приведены к строчной форме, чтобы не вносить доктринально окрашенной идентификации. Остальные смысловые решения сохранены, включая намеренное различение двух эсхатологических временных формул.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T22:29:45Z'
review_pass:
  verdict: revise
  source_fidelity: 'Первая часть передана близко к греческому: сохранены «величие Господа», адресат «его сыновьям», оборот «в истине» и различие между εἰς τὸν αἰῶνα и ἕως τοῦ αἰῶνος. Однако «после Него» подменяет конструкцию διαδοχὴ αὐτοῦ («преемство ему / его преемство») явно временным отношением и несколько меняет синтаксическую неопределённость оригинала. Заглавные местоимения также добавляют конфессионально-интерпретационное обозначение референта, которого греческий текст сам по себе не маркирует.'
  naturalness: Фраза в целом литературна. «Не будет после Него преемства» менее естественно и менее точно, чем «не будет ему преемства». «До вечности» намеренно отражает необычную заключительную формулу и допустимо в торжественном контексте, хотя это выражение менее идиоматично, чем «вовеки».
  terminology: «Величие Господа», «сыновья», «в истине» и «преемство» удачно сохраняют терминологическую и синтаксическую широту. Строчные местоимения лучше сохраняют неразрешённость отношения между αὐτός и «Господом», не навязывая сакральную идентификацию посредством русской орфографии.
  issues:
  - severity: medium
    issue: «после Него» вместо передачи αὐτοῦ при διαδοχή
    rationale: Греческое διαδοχὴ αὐτοῦ не содержит предлога «после»; английский аудиторский текст также понимает оборот как «succession to him». Русское «ему преемства» сохраняет абстрактное существительное и не добавляет временного предлога.
  - severity: low
    issue: Заглавные местоимения
    rationale: Они интерпретационно маркируют референта как сакрального. Поскольку текст допускает различение «он» и «Господь», строчные формы нейтральнее и лучше сохраняют исходную неоднозначность.
  revised_text: Ибо он навеки даст своим сыновьям величие Господа в истине, и не будет ему преемства из поколения в поколение — до вечности.
