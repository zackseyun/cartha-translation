source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Αὐτὸς γὰρ⁴⁵ δώσει τὴν μεγαλωσύνην⁴⁶ κυρίου⁴⁷ τοῖς υἱοῖς αὐτοῦ⁴⁸ ἐν ἀληθείᾳ εἰς τὸν αἰῶνα, καὶ οὐκ ἔσται διαδοχὴ⁴⁹ αὐτοῦ⁵⁰ εἰς γενεὰς *καὶ γενεὰς⁵¹ ἕως τοῦ αἰῶνος.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/008.yaml
  text: For he will give the majesty of the Lord to his sons in truth forever, and there will be no succession to him for generations and generations, until eternity.
translation:
  language: ru
  text: Ибо он навеки даст своим сыновьям величие Господа в истине, и не будет ему преемства из поколения в поколение — до вечности.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεγαλωσύνην κυρίου
  choice: величие Господа
  rationale: Прямо передаёт сочетание существительных и сохраняет возможное различие между действующим лицом и Господом.
- source_word: τοῖς υἱοῖς αὐτοῦ
  choice: Своим сыновьям
  rationale: Возвратное притяжательное местоимение естественно по-русски соотносится с подлежащим «Он».
- source_word: ἐν ἀληθείᾳ
  choice: в истине
  rationale: Сохраняет формальную и смысловую широту греческого выражения, не сужая его до «верно» или «поистине».
- source_word: εἰς τὸν αἰῶνα
  choice: навеки
  rationale: Естественная русская передача устойчивого указания на неограниченную длительность.
- source_word: διαδοχὴ αὐτοῦ
  choice: после Него преемства
  rationale: Передаёт абстрактное существительное διαδοχή как «преемство», а местоимение — естественной русской конструкцией «после Него», не превращая его в конкретного «преемника».
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: из поколения в поколение
  rationale: Современный и идиоматичный русский эквивалент повторной формулы о последовательных поколениях.
- source_word: ἕως τοῦ αἰῶνος
  choice: до вечности
  rationale: Отличает эту формулу от предшествующего εἰς τὸν αἰῶνα и сохраняет необычное временное выражение исходного текста.
theological_decisions:
- issue: Соотношение местоимения Αὐτός и выражения «Господа»
  choice: 'Сохранено потенциальное различие: «Он ... величие Господа»'
  alternative: Отождествить действующее лицо с Господом посредством перефразирования
  rationale: Греческий синтаксис не требует явного отождествления или различения; перевод сохраняет эту неоднозначность.
- issue: Смысл отсутствия διαδοχή
  choice: «не будет после Него преемства»
  alternative: «не будет у Него преемника»
  rationale: Абстрактное «преемство» точнее соответствует существительному διαδοχή и не утверждает сверх текста отсутствие конкретного лица-преемника.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного и эсхатологического контекста. Заглавные буквы в «Он», «Своим», «Него» обозначают вероятного мессианского/сакрального референта, не устраняя синтаксической неоднозначности. Архаизмы избегаются; необычное «до вечности» сохранено ради различия двух греческих временных формул.
