  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/003.yaml
  text: And his star will rise in heaven like a king, giving the light of knowledge like the sun by day, and he will be magnified in the inhabited world.
translation:
  language: ru
  text: И его звезда взойдёт на небе, как звезда царя, излучая свет знания, подобно солнцу днём,[a] и он будет возвеличен в обитаемом мире.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст в словах, переданных как «подобно солнцу днём», повреждён; буквальное чтение рукописной формы не вполне ясно.
    reason: В издании оборот †ἐν ἡλίῳ ἡμέρα† отмечен крестами как испорченный, поэтому читателю следует сообщить о текстовой неуверенности.
lexical_decisions:
- source_word: ἀνατελεῖ
  choice: взойдёт
  rationale: Обычное русское обозначение восхода светила, точно передающее будущую форму глагола.
- source_word: ὡς βασιλέως
  choice: словно звезда царя
  rationale: В греческом стоит эллиптическое «как [звезда] царя»; существительное повторено по-русски для ясности без устранения возможной связи звезды с царём.
- source_word: φωτίζων φῶς γνώσεως
  choice: озаряя светом знания
  rationale: Сохраняет образ света и родительную конструкцию γνώσεως, избегая тяжеловесного буквального повтора «светя светом».
- source_word: μεγαλυνθήσεται
  choice: возвеличится
  rationale: Передаёт пассивно-возвратную форму и возвышенный смысл, не уточняя, кем именно он будет возвеличен.
- source_word: οἰκουμένῃ
  choice: обитаемой земле
  rationale: Традиционное значение слова — населённый, обитаемый мир; «земля» здесь естественнее современного калькированного «обитаемый мир».
theological_decisions:
- issue: К кому относится αὐτοῦ и подразумеваемое подлежащее μεγαλυνθήσεται
  choice: Сохранены местоимения «его» и «он» без отождествления личности.
  alternative: Назвать фигуру царём, священником или Мессией.
  rationale: Стих сам по себе не называет фигуру прямо; конкретизация внесла бы интерпретацию, которой нет в данной греческой формулировке.
- issue: Значение ὡς βασιλέως
  choice: «словно звезда царя»
  alternative: «как царь» или «подобно царю»
  rationale: Родительный βασιλέως грамматически естественнее связывать с подразумеваемым ἄστρον; при этом формулировка сохраняет образ царской звезды.
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенной библейской образностью. Синтаксис сделан плавным, а повреждение греческого текста не замаскировано: принято контекстуально вероятное чтение и добавлена краткая текстологическая сноска.'
