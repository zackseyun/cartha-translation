  text: For everyone who comes to know the law of the Lord will be honored, and he will not be a stranger wherever he goes.
translation:
  language: ru
  text: Ведь всякий, кто познает закон Господа, будет почитаем и не будет чужим, куда бы он ни пошёл.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνώσεται
  choice: познает
  rationale: Передаёт приобретение глубокого знания закона, сохраняя будущую форму греческого глагола.
- source_word: νόμον Κυρίου
  choice: закон Господа
  rationale: Прямое и естественное соответствие греческому выражению без конфессионального уточнения смысла закона.
- source_word: τιμηθήσεται
  choice: будет почитаем
  rationale: 'Сохраняет страдательное значение будущего времени: такой человек будет удостоен уважения.'
- source_word: ξένος
  choice: чужим
  rationale: В данном контексте охватывает значение постороннего, не принятого окружающими человека.
- source_word: ὅπου ὑπάγει
  choice: куда бы он ни пошёл
  rationale: Естественно по-русски передаёт обобщённое значение места назначения при глаголе движения.
