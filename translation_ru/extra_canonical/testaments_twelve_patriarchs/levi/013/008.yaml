base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/008.yaml
  text: For if anyone keeps himself from these evil works, then wisdom will become for him splendid even among enemies, and in a foreign land a homeland, and in the midst of foes he will be found a friend.
translation:
  language: ru
  text: Ибо если кто убережёт себя от этих злых дел, тогда мудрость станет для него славной даже среди врагов, чужая земля — родиной, и среди врагов он окажется другом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξῃ αὐτὸν ἐκ
  choice: сохранит себя от
  rationale: Передаёт идею сознательного ограждения себя от злых поступков и сохраняет возвратное местоимение греческого текста.
- source_word: πονηρῶν τούτων ἔργων
  choice: этих злых дел
  rationale: Прямое и естественное соответствие греческому выражению с сохранением указательного элемента.
- source_word: σοφία ... λαμπρά
  choice: мудрость ... славной
  rationale: λαμπρά буквально обозначает нечто яркое, блистательное или славное; применительно к мудрости «славной» звучит по-русски естественно и сохраняет образ возвышенности.
- source_word: γῆς ἀλλοτρίας ... πατρίς
  choice: чужая земля — родиной
  rationale: Сохраняет выразительное противопоставление чужбины и родины без добавления отсутствующего в греческом глагола.
- source_word: ἐν μέσῳ ἐχθρῶν εὑρηθήσεται φίλος
  choice: среди недругов он обретёт друга
  rationale: Греческая конструкция буквально допускает «найдётся друг»; по-русски выбранное выражение естественно передаёт получение дружеской поддержки среди врагов.
