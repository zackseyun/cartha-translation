revisions:
- from: Ибо если кто сохранит себя от этих злых дел, тогда мудрость сделается для него славной даже среди врагов, чужая земля — родиной, и среди недругов он обретёт друга.
  to: Ибо если кто убережёт себя от этих злых дел, тогда мудрость станет для него славной даже среди врагов, чужая земля — родиной, и среди врагов он окажется другом.
  rationale: 'Исправлен финальный образ согласно пассивной конструкции εὑρηθήσεται φίλος, без доктринальных добавлений. Сохранены параллельная афористическая структура, указание «этих» и противопоставление чужой земли родине. Сноски не требуются: в переводе нет спорного решения, нуждающегося в отдельном пояснении, а номера критического аппарата исходного издания не являются переводческими якорями.'
