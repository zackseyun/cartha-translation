  terminology: '«Цари» точно передаёт βασιλέων. Не следует заменять образ выражением «будет царствовать» или «будет царём»: это добавило бы утверждение, которого в греческом прямо нет. Имя «Иосиф» передано в нормативной русской библейской форме.'
