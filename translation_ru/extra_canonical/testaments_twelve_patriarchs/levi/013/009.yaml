  verdict: revise
  source_fidelity: Греческое Πᾶς ὃς ἂν передано точно обобщающим «Всякий, кто». «Учит добру и творит добро» верно воспроизводит καλὰ как объект обоих глаголов. Однако σύνθρονος ἔσται βασιλέων означает быть сопрестольным царям, то есть разделять с ними престольное достоинство; «восседать на престоле вместе с царями» в целом близко, но порядок слов несколько размывает именно сопрестольный образ. Сравнение с Иосифом следует сформулировать так, чтобы оно явно относилось к обещанному положению, а не могло быть прочитано лишь как приложение «мой брат Иосиф».
