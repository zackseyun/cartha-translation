  text: '*Πᾶς ὃς ἂν διδάσκει καλὰ καὶ πράττει⁶⁰ σύνθρονος ἔσται⁶¹ βασιλέων⁶², ὥσπερ⁶³ καὶ Ἰωσὴφ ὁ ἀδελφός⁶⁴ μου⁶⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/009.yaml
  text: Everyone who teaches good things and does them will be enthroned with kings, just as Joseph my brother also was.
translation:
  language: ru
  text: Всякий, кто учит добру и творит добро, будет восседать с царями на престоле, подобно моему брату Иосифу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλὰ
  choice: добру / добро
  rationale: Субстантивированное среднее множественного числа обозначает доброе вообще; по-русски естественно передано как «учит добру» и, в подразумеваемом объекте при πράττει, «творит добро».
- source_word: πράττει
  choice: творит добро
  rationale: Глагол означает «делает, совершает, исполняет на деле». Повтор слова «добро» естественно восполняет подразумеваемый объект и сохраняет противопоставление учения и поступков.
- source_word: σύνθρονος ἔσται βασιλέων
  choice: будет восседать на престоле вместе с царями
  rationale: σύνθρονος буквально указывает на совместное пребывание на престоле. Формулировка передаёт образ сопrestольности, не превращая его без основания в прямое утверждение «будет царём» или «будет царствовать».
- source_word: ὥσπερ καὶ Ἰωσὴφ ὁ ἀδελφός μου
  choice: как и мой брат Иосиф
  rationale: Сохранено краткое греческое сравнение с эллиптически подразумеваемым сказуемым; русский порядок слов звучит естественно и ясно передаёт родство.
theological_decisions:
- issue: Характер обещанной награды
  choice: восседание на престоле вместе с царями
  alternative: будет царствовать вместе с царями
  rationale: Исходный текст говорит о σύνθρονος — совместном пребывании на престоле, но прямо не называет этого человека царём и не употребляет глагол «царствовать». Поэтому сохранён более точный образ без усиления его смысла.
translation_notes:
  register: Современный литературный русский язык с достоинством афористического наставления. Выражение «творит добро» несколько возвышенно, но общепонятно и уместно в этическом контексте; «восседать на престоле» сохраняет царский образ греческого текста без архаической формы «сопрестольник».
