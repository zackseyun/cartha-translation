base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/001.yaml
  text: 'And now, my children, I command you: fear the Lord your God with all your heart, and walk in simplicity in accordance with all his law.'
translation:
  language: ru
  text: 'И теперь, дети мои, заповедую вам: бойтесь Господа, вашего Бога, всем сердцем вашим и живите в простоте, в согласии со всем его законом.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντέλλομαι
  choice: заповедую
  rationale: Передаёт сильное отцовское повеление и сохраняет библейский регистр исходного глагола.
- source_word: φοβεῖσθε
  choice: бойтесь
  rationale: Сохраняет прямое значение призыва к благоговейному страху перед Богом, не сводя его лишь к почтению.
- source_word: πορεύεσθε
  choice: живите
  rationale: В данном нравственном наставлении глагол означает образ жизни; «живите» естественнее для современного русского языка, чем буквальное «ходите».
- source_word: ἐν ἁπλότητι
  choice: в простоте
  rationale: Сохраняет ёмкое значение цельности, искренности и отсутствия лукавства, не ограничивая его одним толкованием.
- source_word: κατὰ πάντα τὸν νόμον αὐτοῦ
  choice: следуя всему Его закону
  rationale: Естественно передаёт соответствие всей полноте Божьего закона без добавления более узкого понятия «исполнять».
theological_decisions:
- issue: Значение φοβεῖσθε в отношении Бога
  choice: бойтесь
  alternative: почитайте / благоговейте перед
  rationale: Исходный текст прямо говорит о страхе Господнем; более мягкие варианты могли бы устранить присущее выражению богословское напряжение.
- issue: Смысл ἁπλότης
  choice: простота
  alternative: искренность / чистосердечие
  rationale: «Простота» сохраняет широту греческого понятия и не фиксирует исключительно психологическое или нравственное толкование.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Синтаксис сделан ясным и естественным; местоимение «Его» написано с прописной буквы по устойчивой русской религиозно-издательской традиции.
