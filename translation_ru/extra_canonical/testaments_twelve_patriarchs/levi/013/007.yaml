source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Σοφίαν κτήσασθε³⁵ *ἐν φόβῳ³⁶ Θεοῦ³⁷, ὅτι³⁸ ἐὰν *γένηται αἰχμαλωσία, καὶ ὀλοθρευθῶσι πόλεις καὶ χῶραι³⁹ *καὶ χρυσὸς καὶ ἄργυρος καὶ πᾶσα⁴⁰ κτῆσις⁴¹ ἀπολεῖται⁴², *τοῦ σοφοῦ τὴν σοφίαν⁴³ †οὐδεὶς⁴⁴ δύναται⁴⁵ ἀφελέσθαι⁴⁶ εἰ μὴ τύφλωσις⁴⁷ ἀσεβείας⁴⁸ καὶ πώρωσις⁴⁹ ἁμαρτίας⁵⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/007.yaml
  text: Acquire wisdom in the fear of God, because if captivity comes, and cities and lands are destroyed, and gold and silver and every possession perish, no one can take away the wise man's wisdom, except the blindness of ungodliness and the hardening of sin.
translation:
  language: ru
  text: Приобретайте мудрость в страхе Божьем, потому что, если случится пленение, города и земли будут разорены, а золото, серебро и всё имущество пропадут, то никто не сможет отнять у мудрого его мудрость — разве что слепота нечестия и ожесточение греха.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σοφίαν κτήσασθε
  choice: Приобретайте мудрость
  rationale: Передаёт повелительное значение аориста κτήσασθε и идею обретения мудрости без излишне архаичного «стяжайте».
- source_word: ἐν φόβῳ Θεοῦ
  choice: в страхе Божьем
  rationale: Сохраняет устойчивое библейское выражение и прямую связь мудрости с благоговейным страхом перед Богом.
- source_word: αἰχμαλωσία
  choice: пленение
  rationale: Передаёт бедствие попадания в плен; формулировка «если случится пленение» сохраняет неопределённость греческого текста.
- source_word: πόλεις καὶ χῶραι
  choice: города и земли
  rationale: χῶραι может обозначать земли, области или сельские территории; «земли» сохраняет широкое значение.
- source_word: πᾶσα κτῆσις
  choice: всё имущество
  rationale: В данном перечне материальных утрат κτῆσις естественно означает собственность или имущество.
- source_word: τύφλωσις ἀσεβείας
  choice: слепота нечестия
  rationale: Сохраняет образность и родительную конструкцию оригинала, не уточняя, означает ли она слепоту, вызванную нечестием, или присущую ему.
- source_word: πώρωσις ἁμαρτίας
  choice: ожесточение греха
  rationale: Передаёт πώρωσις как нравственное очерствение и сохраняет неоднозначную связь с «грехом».
theological_decisions:
- issue: Что способно лишить мудрого его мудрости
  choice: «никто не сможет отнять — кроме слепоты нечестия и ожесточения греха»
  alternative: «никто не сможет отнять, если только его не ослепит нечестие и не ожесточит грех»
  rationale: Выбрана более формальная передача εἰ μὴ, сохраняющая необычное олицетворение абстрактных сил и не вводящая в текст подразумеваемого личного объекта.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис упрощён для ясности, но параллелизм перечня утрат и богословское напряжение заключительного исключения сохранены.
