revisions:
- from: Приобретайте мудрость в страхе Божьем, потому что, если случится пленение, города и земли будут разорены, а золото, серебро и всё имущество пропадут, мудрости у мудрого никто не сможет отнять — кроме слепоты нечестия и ожесточения греха.
  to: Приобретайте мудрость в страхе Божьем, потому что, если случится пленение, города и земли будут разорены, а золото, серебро и всё имущество пропадут, то никто не сможет отнять у мудрого его мудрость — разве что слепота нечестия и ожесточение греха.
  rationale: 'Внесены только стилистико-синтаксические правки: уточнён порядок слов при «мудрости мудрого», условный период сделан более прозрачным, а εἰ μὴ передано естественным русским «разве что». Неоднозначные родительные конструкции в «слепоте нечестия» и «ожесточении греха» сохранены.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T22:29:19Z'
review_pass:
  verdict: revise
  source_fidelity: 'Смысл передан точно: повеление приобрести мудрость, страх Божий, возможное пленение и утрата материальных благ, а также заключительное исключение сохранены. Однако в заключении греческое τοῦ σοφοῦ τὴν σοφίαν прямо выражает «мудрость мудрого» как объект отнятия; русский порядок слов следует сделать более прозрачным. «Земли» допустимо для χῶραι и сохраняет его широту.'
  naturalness: Текст в целом литературный, но сочетание «мудрости у мудрого никто не сможет отнять» звучит несколько тяжеловесно и допускает краткую синтаксическую неясность. Конструкция «никто не сможет отнять у мудрого его мудрость» естественнее. Добавление «то» после условной цепочки делает период яснее; «разве что» естественно передаёт εἰ μὴ при сохранении олицетворённого исключения.
  terminology: «Приобретайте мудрость», «в страхе Божьем», «пленение», «нечестие» и «ожесточение» уместны в современном литературном русском с библейским регистром. «Ожесточение греха» сохраняет намеренно нераскрытую родительную связь πώρωσις ἁμαρτίας. «Всё имущество» адекватно πᾶσα κτῆσις.
