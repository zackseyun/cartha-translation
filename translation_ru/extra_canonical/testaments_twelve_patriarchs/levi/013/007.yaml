    rationale: Греческое ἐὰν охватывает последующую картину бедствий; частица «то» в русском помогает связать эту цепочку с главным утверждением, не меняя смысла.
  revised_text: Приобретайте мудрость в страхе Божьем, потому что, если случится пленение, города и земли будут разорены, а золото, серебро и всё имущество пропадут, то никто не сможет отнять у мудрого его мудрость — разве что слепота нечестия и ожесточение греха.
