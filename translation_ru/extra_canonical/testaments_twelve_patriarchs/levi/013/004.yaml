source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καίγε πολλοὺς φίλους ὑπὲρ γονεῖς κτήσεται¹⁹ καὶ ἐπιθυμήσουσι πολλοὶ τῶν ἀνθρώπων δουλεῦσαι αὐτῷ²⁰ καὶ ἀκοῦσαι νόμου²¹ ἐκ τοῦ²² στόματος αὐτοῦ²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/004.yaml
  text: Indeed, he will gain many friends beyond his parents, and many among men will desire to serve him and to hear the law from his mouth.
translation:
  language: ru
  text: И действительно, он приобретёт много друзей — больше, чем родителей,[a] и многие люди пожелают служить ему и слушать закон из его уст.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «приобретёт многих друзей сверх родителей». Вероятнее всего, речь идёт о том, что друзей у него будет больше, чем родителей; возможен также смысл: «обретёт друзей помимо родителей».'
    reason: Греческое ὑπὲρ γονεῖς — эллиптическое сравнительное выражение. Сноска сохраняет возможное более широкое значение, не добавляя отсутствующего в оригинале мотива любви.
lexical_decisions:
- source_word: Καίγε
  choice: Да
  rationale: Передаёт усилительно-связочное значение частицы естественным русским вводом.
- source_word: πολλοὺς φίλους ὑπὲρ γονεῖς κτήσεται
  choice: он приобретёт друзей, которых будет любить больше родителей
  rationale: κτήσεται означает «приобретёт, обретёт»; сравнительная конструкция ὑπὲρ γονεῖς буквально указывает на превосходство над родителями, но эллиптична, поэтому подразумеваемое отношение вынесено в примечание как неоднозначное.
- source_word: πολλοὶ τῶν ἀνθρώπων
  choice: многие люди
  rationale: Естественный современный русский эквивалент партитивной конструкции «многие из людей».
- source_word: δουλεῦσαι αὐτῷ
  choice: служить ему
  rationale: Сохраняет обычное значение δουλεύω с дательным дополнением без излишнего усиления до «быть рабами».
- source_word: ἀκοῦσαι νόμου ἐκ τοῦ στόματος αὐτοῦ
  choice: слышать закон из его уст
  rationale: Сохраняет библейский образ передачи наставления непосредственно из уст говорящего; νόμου передано определённо как «закон».
theological_decisions:
- issue: Характер закона в выражении ἀκοῦσαι νόμου
  choice: закон
  alternative: учение / наставление закона
  rationale: Греческое νόμος прямо означает «закон»; контекст не требует конфессионального уточнения его содержания.
- issue: Смысл сравнения ὑπὲρ γονεῖς
  choice: любить больше родителей с указанием неоднозначности в примечании
  alternative: обретёт друзей помимо родителей / больше, чем родителей
  rationale: Конструкция эллиптична и допускает различное восстановление отношения. Основной текст передаёт вероятный сравнительный смысл, а примечание сохраняет подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским оборотом «из его уст». Синтаксис сделан ясным для широкого читателя, при этом неоднозначность сравнительной конструкции не скрыта.
