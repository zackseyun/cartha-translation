  text: Итак, поступайте праведно, дети мои, на земле, чтобы вы были найдены на небесах.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перед греческим εὕρητε стоит знак повреждённого или сомнительного текста. Напечатанная форма буквально означает: «чтобы вы нашли»; перевод следует вероятному исправлению с пассивным смыслом: «чтобы вы были найдены».'
    reason: Сноска прямо различает форму сохранившегося греческого текста и вероятное пассивное прочтение, принятое в основном переводе.
lexical_decisions:
- source_word: Ποιήσατε … δικαιοσύνην
  choice: поступайте праведно
  rationale: Естественная современная передача буквального «творите праведность», сохраняющая призыв к деятельной праведности.
- source_word: τέκνα μου
  choice: дети мои
  rationale: Прямое и естественное обращение, соответствующее наставительному тону.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Обычная русская передача пространственного выражения.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: на небесах
  rationale: Сохраняет множественное число греческого οὐρανοῖς в принятой русской библейской формуле.
theological_decisions:
- issue: Синтаксис спорного εὕρητε
  choice: чтобы вам быть обретёнными
  alternative: чтобы вы обрели [это]
  rationale: Форма в источнике текстуально сомнительна; перевод следует контекстуальному пассивному пониманию, отражённому в проверенном консультационном слое, но не скрывает трудность текста.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Выражение «быть обретёнными» намеренно несколько формально, поскольку оно сохраняет вероятный пассивный смысл спорного греческого чтения.
