source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Διδάξατε δὲ καὶ ὑμεῖς⁷ τὰ τέκνα ὑμῶν γράμματα⁸ ἵνα ἔχωσι⁹ σύνεσιν ἐν *πάσῃ τῇ ζωῇ αὐτῶν¹⁰, ἀναγινώσκοντες¹¹ ἀδιαλείπτως¹² τὸν νόμον τοῦ Θεοῦ¹³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/002.yaml
  text: And you also, teach your children letters, so that they may have understanding throughout all their life, reading the law of God without ceasing.
translation:
  language: ru
  text: И вы также учите своих детей грамоте, чтобы они имели разумение на протяжении всей своей жизни, непрестанно читая Закон Божий.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γράμματα
  choice: грамоте
  rationale: В данном контексте означает обучение чтению и письму, а не просто отдельным «буквам»; «учите грамоте» естественно передаёт смысл по-русски.
- source_word: σύνεσιν
  choice: разумение
  rationale: Сохраняет значение понимания и рассудительности, не сводя его лишь к знаниям.
- source_word: ἐν πάσῃ τῇ ζωῇ αὐτῶν
  choice: на протяжении всей своей жизни
  rationale: Естественно передаёт временной охват греческого выражения.
- source_word: ἀδιαλείπτως
  choice: непрестанно
  rationale: Передаёт идею постоянного, неослабевающего занятия без необходимости понимать наречие как буквальное отсутствие любых перерывов.
- source_word: τὸν νόμον τοῦ Θεοῦ
  choice: Закон Божий
  rationale: Традиционное и ясное обозначение Божьего Закона; прописная буква указывает на конкретный священный Закон.
theological_decisions:
- issue: Связь разумения с чтением Закона
  choice: Сохранён деепричастный оборот «непрестанно читая Закон Божий»
  alternative: «чтобы… непрестанно читали Закон Божий»
  rationale: Греческое ἀναγινώσκοντες грамматически характеризует детей и оставляет открытым точный оттенок связи между обладанием разумением и постоянным чтением; перевод не превращает причастие в отдельную целевую конструкцию.
translation_notes:
  register: Современный литературный русский язык с достоинством и лёгкой библейской окраской. Формулировка понятна широкому читателю; синтаксическая связь греческих причастных конструкций сохранена без конфессиональных добавлений.
