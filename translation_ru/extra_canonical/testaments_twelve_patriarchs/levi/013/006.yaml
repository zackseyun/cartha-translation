source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ σπείρατε²⁷ ἐν *ταῖς ψυχαῖς²⁸ ὑμῶν²⁹ ἀγαθὰ *καὶ εὑρήσετε³⁰ αὐτὰ³¹ *ἐν τῇ ζωῇ ὑμῶν³². *Ἐὰν δὲ σπείρητε πονηρὰ³³ *πᾶσαν ταραχὴν καὶ θλίψιν θερίσετε³⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/006.yaml
  text: And sow good things in your souls, and you will find them in your life. But if you sow evil things, you will reap every turmoil and affliction.
translation:
  language: ru
  text: И сейте доброе в душах ваших — и найдёте его в своей жизни. Если же посеете злое, пожнёте всякое смятение и скорбь.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὰ
  choice: доброе
  rationale: Субстантивированное прилагательное во множественном числе передано естественным русским собирательным выражением, сохраняющим нравственный смысл.
- source_word: ἐν ταῖς ψυχαῖς ὑμῶν
  choice: в душах ваших
  rationale: Сохранён внутренний, антропологический образ оригинала без замены на более толковательное «в сердцах».
- source_word: εὑρήσετε αὐτὰ ἐν τῇ ζωῇ ὑμῶν
  choice: найдёте его в своей жизни
  rationale: Глагол εὑρίσκω переведён прямо как «найдёте»; местоимение согласовано с естественным русским «доброе». «В своей жизни» ясно соотносится с субъектом и сохраняет значение греческого выражения.
- source_word: πονηρὰ
  choice: злое
  rationale: Передано симметрично слову «доброе», без сужения до конкретных злых поступков.
- source_word: πᾶσαν ταραχὴν καὶ θλίψιν
  choice: всякое смятение и скорбь
  rationale: «Смятение» передаёт ταραχή как беспорядок или тревожное потрясение, а «скорбь» сохраняет широкий смысл θλίψις — бедствие, теснота, страдание.
theological_decisions:
- issue: Образ сеяния и жатвы как нравственного воздаяния
  choice: Сохранить образ буквально, не уточняя механизм и время воздаяния.
  alternative: Истолковать как прямое обещание земных последствий или как эсхатологическое воздаяние.
  rationale: Греческий текст не определяет, когда и каким образом человек найдёт добро или пожнёт скорбь; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Инверсия «в душах ваших» сохраняет достоинство и близость к греческой форме; тире делает связь между сеянием и обретением ясной без добавления толкования.
