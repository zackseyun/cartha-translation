  text: For just as the sun is pure before the Lord upon the earth, so also you are, the lights of Israel, beyond all the nations.
translation:
  language: ru
  text: Ибо как солнце чисто пред Господом над землёй, так и вы, светила Израиля, чисты пред Господом, превыше всех народов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθαρὸς
  choice: чисто
  rationale: Сохраняет прямой смысл греческого прилагательного и его нравственно-культовую многозначность без дополнительного толкования.
- source_word: ἐνώπιον κυρίου
  choice: пред Господом
  rationale: Достоинственный и естественный библейский оборот, точно передающий значение «перед лицом / в присутствии Господа».
- source_word: οἱ φωστῆρες τοῦ Ἰσραήλ
  choice: светила Израиля
  rationale: «Светила» передаёт φωστῆρες как небесные источники света и сохраняет связь с образом солнца.
- source_word: παρὰ πάντα τὰ ἔθνη
  choice: превосходите все народы
  rationale: В данном сравнительном построении παρά с винительным выражает превосходство; глагольная передача звучит по-русски естественно.
theological_decisions:
- issue: Характер чистоты солнца и адресатов
  choice: Сохранена формулировка «чисто пред Господом» без уточнения вида чистоты.
  alternative: «безупречно пред Господом» или явное истолкование как ритуальной либо нравственной чистоты.
  rationale: Греческое καθαρός допускает более одного оттенка; перевод не должен снимать эту смысловую напряжённость.
- issue: Превосходство Израиля над народами
  choice: 'Сравнение передано прямо: «превосходите все народы».'
  alternative: «ярче всех народов» или «среди всех народов».
  rationale: В оригинале основание превосходства не выражено явно, поэтому добавление «ярче» чрезмерно связывало бы сравнение только с образом света, а «среди» ослабляло бы сравнительный смысл παρά.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Синтаксис сделан естественным, при этом образ солнца и «светил Израиля» сохранён. Текстологические кресты и цифровые знаки издания не воспроизводятся как часть читаемого текста.
