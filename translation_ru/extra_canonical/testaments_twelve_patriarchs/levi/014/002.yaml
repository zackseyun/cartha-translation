source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ γὰρ ὁ πατὴρ ἡμῶν Ἰσραὴλ καθαρός ἐστιν¹⁸ ἀπὸ τῆς¹⁹ ἀσεβείας²⁰ τῶν ἀρχιερέων [οἵτινες ἐπιβαλοῦσι²¹ τὰς χεῖρας αὐτῶν ἐπὶ τὸν σωτῆρα τοῦ κόσμου]²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/014/002.yaml
  text: For our father Israel is pure from the ungodliness of the chief priests [who will lay their hands on the Savior of the world].
translation:
  language: ru
  text: Ибо и отец наш Израиль чист от нечестия первосвященников, [которые возложат руки на Спасителя мира].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «которые возложат руки на Спасителя мира» в используемом греческом издании заключены в квадратные скобки, что отмечает их особый текстологический статус.
    reason: Сохраняет редакционную маркировку исходного издания, не утверждая сверх имеющихся данных конкретную причину текстологической неуверенности.
lexical_decisions:
- source_word: καθαρός ... ἀπό
  choice: чист от
  rationale: Сохраняет образ и синтаксическую связь греческого выражения, оставаясь естественным и понятным по-русски.
- source_word: ἀσέβεια
  choice: нечестие
  rationale: Передаёт религиозно-нравственный смысл слова без сужения до простого беззакония или неверия.
- source_word: ἀρχιερεῖς
  choice: первосвященники
  rationale: Устоявшийся русский эквивалент для иудейских высших священнослужителей во множественном числе.
- source_word: ἐπιβαλοῦσι τὰς χεῖρας ... ἐπί
  choice: возложат руки на
  rationale: Формально передаёт греческую идиому; в данном контексте она означает враждебное задержание или насилие, но перевод не устраняет образную неоднозначность.
- source_word: σωτὴρ τοῦ κόσμου
  choice: Спаситель мира
  rationale: Точно воспроизводит титульное выражение; прописная буква уместна в данном мессианском употреблении и в русском религиозном регистре.
theological_decisions:
- issue: Отделение праотца Израиля от нечестия первосвященников
  choice: Сохранено буквальное утверждение «отец наш Израиль чист от нечестия»
  alternative: «наш отец Израиль непричастен нечестию»
  rationale: Греческий текст утверждает чистоту Израиля по отношению к нечестию первосвященников; перевод не расширяет это до общего учения о безгрешности и не переосмысливает Израиль как народ.
- issue: Мессианское обозначение σωτήρ
  choice: «Спаситель мира»
  alternative: «спаситель мира»
  rationale: Титульное оформление соответствует контексту, не добавляя в текст имени или более узкого конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной речи. Сохранены причинное «ибо», родственное обозначение «отец наш» и квадратные скобки исходного издания; синтаксис остаётся ясным для обычного читателя.
