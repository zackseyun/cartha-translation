    rationale: '«В злобе» обычно означает действовать из злобы или с враждебным чувством, тогда как κακία шире: зло, порочность, нечестие. «В нечестии» сохраняет нравственно-религиозный характер контекста без излишней психологизации.'
  - severity: low
    issue: Недостаточно явная связь «возложив руки» с текстологически сомнительным объектом
    rationale: При сохранении [ἐπ᾿ αὐτόν] русский оборот лучше строить как «наложив [на Него] руки», чтобы читатель ясно видел, к какому выражению относится вариантное местоимение.
