source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ἐγὼ¹ οὖν, τέκνα μου², ἔγνων³ ὅτι ἐπὶ τὰ τέλη τῶν αἰώνων ἀσεβήσετε⁴ *ἐπὶ Κυρίου, χεῖρας ἐπιβάλλοντες⁵ ἐν⁶ κακίᾳ [ἐπ᾿ αὐτὸν]⁷ καὶ ἐν⁸ πᾶσι τοῖς ἔθνεσιν γενήσεσθε⁹ χλευασμός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/014/001.yaml
  text: Therefore I, my children, have known that at the end of the ages you will act ungodly against the Lord, laying hands in wickedness [upon him], and among all the nations you will become a mockery.
translation:
  language: ru
  text: Итак, дети мои, я узнал, что в конце веков вы поступите нечестиво против Господа, наложив [на Него] руки в нечестии[a], и станете посмешищем среди всех народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «на Него» в некоторых текстовых свидетельствах отсутствуют.
    reason: Квадратные скобки в исходном критическом тексте отмечают сомнительность слов ἐπ᾿ αὐτόν; сноска сообщает читателю об этой текстовой вариантности.
lexical_decisions:
- source_word: ἔγνων
  choice: я узнал
  rationale: Аористная форма передаёт обретённое знание; «я узнал» естественно по-русски и не превращает её в простое настоящее «я знаю».
- source_word: ἐπὶ τὰ τέλη τῶν αἰώνων
  choice: в конце веков
  rationale: Сохраняет эсхатологический образ множественного αἰώνων и звучит естественно в возвышенной русской прозе.
- source_word: ἀσεβήσετε ἐπὶ Κυρίου
  choice: поступите нечестиво против Господа
  rationale: Передаёт глагольный характер ἀσεβέω и направленность действия, выраженную ἐπί.
- source_word: χεῖρας ἐπιβάλλοντες
  choice: возложив руки
  rationale: Близко передаёт устойчивый греческий оборот о насильственном посягательстве, не добавляя отсутствующего в тексте уточнения.
- source_word: χλευασμός
  choice: посмешищем
  rationale: Краткий и прямой русский эквивалент существительного со значением предмета насмешек.
theological_decisions:
- issue: Объект выражения «возложив руки»
  choice: Сохранить «на Него» в квадратных скобках и снабдить сноской
  alternative: Опустить местоимение либо включить его без скобок
  rationale: ἐπ᾿ αὐτόν присутствует как текстуально сомнительное добавление в источнике; скобки сохраняют свидетельство издания и не скрывают неопределённость.
- issue: Направленность нечестия
  choice: «против Господа»
  alternative: «перед Господом» или «в отношении Господа»
  rationale: Контекст последующего посягательства поддерживает враждебное значение ἐπί, но перевод не уточняет христологическую или иную идентификацию референта сверх греческого текста.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Обращение «дети мои» и выражения «в конце веков», «возложив руки» сохраняют жанровый тон, оставаясь понятными современному читателю.
