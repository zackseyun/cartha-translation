  text: 1 And as I was going to my father[a], I found a bronze shield; therefore the name of the mountain is Aspis, which is near Gebal, on the right of Abim. 2 And I kept these words in my heart. 3 After this I took counsel with my father and with Reuben, that he should tell the sons of Emmor not to circumcise themselves, because I was zealous on account of the abomination which they had committed against my sister. 4 And I killed Shechem first, and Simeon killed Emmor. 5 And after this my brothers came and struck that city with the edge of the sword. 6 And my father heard these things, and being angry he was grieved because they had accepted circumcision and died, and in his blessings he passed over us. 7 For we sinned, because we had done this contrary to his judgment, though he became weak on that day. 8 But I saw that it was a decree of God for evil against them, because they intended to do to Sarah and Rebekah as they had done to Dinah our sister; and the Lord restrained them. 9 And
    they pursued Abraham our father when he was a stranger, and they oppressed his flocks when they were swollen with increase, and they cruelly mistreated Eblan his home-born servant. 10 And indeed in this way they used to act toward all strangers, seizing foreign women by force and driving them away[b][c][d][e]. 11 But the wrath of God came upon them completely.
translation:
  language: ru
  text: '1 Когда я шёл к своему отцу, я нашёл бронзовый щит; поэтому гора называется Аспис[a]. Она находится близ Гевала, справа от Авима. 2 И я хранил эти слова в своём сердце. 3 После этого я посоветовался со своим отцом и с Рувимом, чтобы отец сказал сыновьям Еммора не обрезываться, потому что я пылал ревностью из-за мерзости, которую они совершили над моей сестрой. 4 Я первым убил Сихема, а Симеон — Еммора. 5 Затем пришли мои братья и поразили тот город остриём меча. 6 Мой отец услышал об этом и, разгневавшись, опечалился, потому что они приняли обрезание и погибли; и в своих благословениях он обошёл нас[b]. 7 Ведь мы согрешили, сделав это вопреки его решению, хотя в тот день он ослабел[c]. 8 Но я увидел, что это было Божье постановление против них, им во зло: они намеревались поступить с Саррой и Ревеккой так же, как поступили с Диной, нашей сестрой[d], но Господь воспрепятствовал им. 9 Они преследовали Авраама, нашего отца, когда он был пришельцем, угнетали его умножавшиеся стада и
    жестоко истязали Евлана, раба, рождённого в его доме[e]. 10 Так они поступали со всеми пришельцами: силой похищали чужеземных женщин и изгоняли их. 11 Но гнев Божий постиг их окончательно[f].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Аспис» (греч. ἀσπίς) означает «щит».
    reason: lexical_alternative
  - marker: b
    text: 'Возможный перевод: «не удостоил нас внимания в благословениях», то есть Иаков не оказал Левию и Симеону благоволения, произнося благословения.'
    reason: lexical_alternative
  - marker: c
    text: Греческий глагол труден для истолкования и может означать, что в тот день Иаков смягчился, ослабел или был сломлен.
    reason: textual_variant
  - marker: d
    text: Текст этого стиха труден. Судя по греческому тексту, жители Сихема намеревались поступить с Саррой и Ревеккой так же, как поступили с Диной.
    reason: textual_variant
  - marker: e
    text: Имя «Евлан» не вполне надёжно сохранилось в рукописной традиции; общий смысл состоит в том, что рождённый в доме Авраама раб подвергся жестокому обращению.
    reason: textual_variant
  - marker: f
    text: 'Буквально: «гнев Божий постиг их до конца» — то есть суд был полным или окончательным.'
    reason: cross_reference
lexical_decisions:
- source_word: ἀσπίδα χαλκῆν
  choice: бронзовый щит
  rationale: Точно передаёт предмет и сохраняет этимологическую связь с названием горы Аспис.
- source_word: συνετήρουν ... ἐν τῇ καρδίᾳ μου
  choice: хранил ... в своём сердце
  rationale: Естественная русская формула внутреннего памятования, сохраняющая возвышенный регистр.
- source_word: συνεβούλευσα
  choice: посоветовался
  rationale: Передаёт обсуждение и совместное обдумывание без архаизации.
- source_word: μὴ περιτμηθῆναι αὐτούς
  choice: не обрезываться
  rationale: Естественно передаёт требование воздержаться от принятия обрезания.
- source_word: ἐζήλωσα
  choice: пылал ревностью
  rationale: Выражает сильное нравственное негодование, а не зависть.
- source_word: βδέλυγμα
  choice: мерзость
  rationale: Сохраняет сильную нравственную окраску греческого слова.
- source_word: ἐν στόματι μαχαίρας
  choice: остриём меча
  rationale: Передаёт традиционную идиому естественным современным русским выражением.
- source_word: παρεῖδεν ἡμῖν
  choice: обошёл нас
  rationale: В контексте благословений означает, что Иаков не оказал Левию и Симеону благоволения; неоднозначность отмечена в сноске.
- source_word: παρὰ γνώμην αὐτοῦ
  choice: вопреки его решению
  rationale: γνώμη здесь обозначает обдуманное суждение или волевое решение Иакова.
- source_word: ἐμαλακίσθη
  choice: ослабел
  rationale: Сдержанный перевод трудного глагола; возможные значения приведены в сноске.
- source_word: ἀπόφασις θεοῦ
  choice: Божье решение
  rationale: Передаёт определённое Богом судебное решение без излишне конфессиональной терминологии.
- source_word: εἰς κακά
  choice: им во зло
  rationale: Сохраняет резкость и направленность неблагоприятного решения против сихемлян.
- source_word: τὰς ξένας
  choice: чужеземных женщин
  rationale: Передаёт женский род и значение чужих либо иноземных женщин, не подменяя его притяжательным смыслом.
- source_word: εἰς τέλος
  choice: окончательно
  rationale: Передаёт полноту или завершённость постигшего их суда.
theological_decisions:
- issue: Провиденциальное истолкование расправы в Сихеме
  choice: Сохранены одновременно признание «мы согрешили» и утверждение, что случившееся было Божьим решением им во зло.
  alternative: Представить расправу либо целиком оправданной, либо только греховной и никак не связанной с Божьим судом.
  rationale: Стихи 7–11 намеренно удерживают оба утверждения; перевод не должен устранять это богословское напряжение.
- issue: Упоминание Сарры и Ревекки в стихе 8
  choice: Имена сохранены, а намерение сихемлян выражено прямо.
  alternative: Опустить трудную строку или заменить имена общим упоминанием праматерей.
  rationale: Несмотря на текстовую трудность, греческое свидетельство называет Сарру и Ревекку; трудность прозрачным образом отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного повествования. Синтаксис умеренно формальный, но без славянизмов и устаревших оборотов. Имена переданы в привычных русских библейских формах; редкие топонимы и имя Евлан транслитерированы.
