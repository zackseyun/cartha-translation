  to: '1 Когда я шёл к своему отцу, я нашёл бронзовый щит; поэтому гора называется Аспис[a]. Она находится близ Гевала, справа от Авима. 2 И я хранил эти слова в своём сердце. 3 После этого я посоветовался со своим отцом и с Рувимом, чтобы отец сказал сыновьям Еммора не обрезываться, потому что я пылал ревностью из-за мерзости, которую они совершили над моей сестрой. 4 Я первым убил Сихема, а Симеон — Еммора. 5 Затем пришли мои братья и поразили тот город остриём меча. 6 Мой отец услышал об этом и, разгневавшись, опечалился, потому что они приняли обрезание и погибли; и в своих благословениях он обошёл нас[b]. 7 Ведь мы согрешили, сделав это вопреки его решению, хотя в тот день он ослабел[c]. 8 Но я увидел, что это было Божье постановление против них, им во зло: они намеревались поступить с Саррой и Ревеккой так же, как поступили с Диной, нашей сестрой[d], но Господь воспрепятствовал им. 9 Они преследовали Авраама, нашего отца, когда он был пришельцем, угнетали его умножавшиеся стада и жестоко
