  rationale: 'Исправлено значение ἐξενηλάτουν в ст. 10: речь идёт об изгнании женщин, а не только об их уводе. В ст. 3 явно назван отец как субъект речи, согласно наиболее естественному синтаксическому прочтению греческого единственного числа. В ст. 8 слегка перестроена фраза для ясности, без изменения текстовой и богословской неоднозначности. Все имеющиеся сноски сохранены с теми же маркерами и размещены у соответствующих мест.'
