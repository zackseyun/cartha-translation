source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ εἶπον¹ Γἐγὼ²⁾ τῷ πατρί μου³, Ἰακώβ⁴, ὅτι ἐν σοὶ ἐξουδενώσει⁵ Κύριος⁶ τοὺς Χαναναίους⁷ καὶ δώσει⁸ τὴν γῆν αὐτῶν σοι καὶ τῷ σπέρματί σου μετὰ σε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/007/001.yaml
  text: And I said to my father Jacob, “In you the Lord will bring the Canaanites to nothing, and he will give their land to you and to your seed after you.”
translation:
  language: ru
  text: 'И я сказал моему отцу Иакову: «Через тебя[a] Господь обратит хананеев в ничто и отдаст их землю тебе и твоему потомству после тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в тебе»; выражение может также означать «посредством тебя» или указывать на связь этого события с Иаковом.'
    reason: Сохраняет смысловой диапазон греческого ἐν σοὶ, не перегружая основной текст.
lexical_decisions:
- source_word: ἐν σοὶ
  choice: через тебя
  rationale: Предлог ἐν с дательным падежом здесь естественно допускает значение посредства; по-русски «через тебя» ясно передаёт участие Иакова, а буквальная форма отмечена в сноске для сохранения неоднозначности.
- source_word: ἐξουδενώσει
  choice: обратит … в ничто
  rationale: Передаёт сильное значение глагола «считать ничем, уничтожить, свести на нет» и соответствует контексту будущей участи хананеев.
- source_word: σπέρματί
  choice: потомству
  rationale: Греческое существительное употреблено собирательно и обозначает потомков Иакова; «потомство» естественно и точно в современном русском языке.
theological_decisions:
- issue: Роль Иакова в выражении ἐν σοὶ
  choice: В основном тексте передано «через тебя», при этом буквальная форма сохранена в сноске.
  alternative: «в тебе»
  rationale: Греческое выражение может указывать как на посредство, так и на связь события с Иаковом. Русское «в тебе» без пояснения звучит неестественно и неясно, поэтому неоднозначность не устраняется молча, а фиксируется сноской.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. «Хананеи» — общепринятое русское наименование; «отдаст» естественно передаёт дарование земли во владение.
