base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/007/002.yaml
  text: For from this day the city called Sychem shall be a city of senseless people. For just as someone mocks a fool, so we mocked them,
translation:
  language: ru
  text: Ибо с сегодняшнего дня город, называемый Сихемом, будет городом неразумных людей, ибо, как кто-нибудь будет насмехаться над глупцом, так мы насмеялись над ними.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ Σύκημα λεγομένη πόλις
  choice: город, называемый Сихемом
  rationale: Передаёт греческую конструкцию естественно для современного русского языка и сохраняет традиционную русскую форму топонима.
- source_word: ἀσυνέτων
  choice: неразумных
  rationale: Сохраняет значение отсутствия разумения или рассудительности, не отождествляя слово с более резким μωρός далее в стихе.
- source_word: μωρόν
  choice: глупцом
  rationale: Передаёт более прямое обозначение глупого человека и сохраняет лексическое различие с ἀσυνέτων.
- source_word: ἐχλευάσαμεν
  choice: насмеялись
  rationale: Точно передаёт издевательскую насмешку; форма совершенного вида соответствует греческому аористу.
