lexical_decisions:
- source_word: Ἀπάραντες
  choice: отправившись в путь
  rationale: Аористное причастие от ἀπαίρω в данном повествовательном контексте естественно обозначает отбытие или выступление в путь; в греческом тексте нет выраженного объекта, который требовал бы перевода «взяв это».
- source_word: ἤλθομεν εἰς
  choice: мы пришли в
  rationale: Сохраняет простое повествовательное значение глагола движения и направление, выраженное εἰς.
- source_word: Δίναν Βεθήλ
  choice: Динан-Вефиль
  rationale: Оба элемента греческого топонимического выражения сохранены; дефис по-русски ясно представляет их как составное название места, не отождествляя Динан с Диной и не устраняя необычность исходного текста.
