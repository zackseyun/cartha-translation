  text: A copy of the words of Levi, which he ordained for his sons about all that they would do, and all that would happen to them[a] until the day of judgment.
translation:
  language: ru
  text: Копия слов Левия, которые он установил для своих сыновей, — обо всём, что они совершат, и обо всём, что случится с ними[a] до дня суда.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «что постигнет их». Греческий оборот буквально говорит о том, что в будущем «встретит» их.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντίγραφον λόγων
  choice: Список слов
  rationale: Ἀντίγραφον обозначает письменную копию или список; сочетание передано естественно и с сохранением смысла заголовочной формулы.
- source_word: διέθετο
  choice: завещал
  rationale: Средний залог διατίθημι здесь указывает на торжественное распоряжение, данное потомкам; «завещал» естественно передаёт этот оттенок.
- source_word: κατὰ πάντα ἃ ποιήσουσιν
  choice: обо всём, что они совершат
  rationale: Сохраняется полнота πάντα и будущее время; «совершат» соответствует достойному повествовательному регистру.
- source_word: ὅσα συναντήσει αὐτοῖς
  choice: обо всём, что случится с ними
  rationale: Греческая идиома буквально говорит о том, что «встретит» их; по-русски естественным эквивалентом является «случится с ними».
- source_word: ἕως ἡμέρας κρίσεως
  choice: до дня суда
  rationale: Прямое и традиционно понятное соответствие греческой эсхатологической формуле без добавочной интерпретации.
theological_decisions:
- issue: Характер слов Левия, выраженный διέθετο
  choice: завещал
  alternative: предписал
  rationale: «Завещал» сохраняет возможный оттенок предсмертного распоряжения и не сводит слова исключительно к обязательным заповедям.
- issue: Смысл «дня суда»
  choice: оставлено без уточнения, чей это суд и каков его характер
  alternative: день Божьего суда
  rationale: В исходном тексте нет явного определения «Божий»; добавление неоправданно устранило бы формальную открытость выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством заголовочной формулы. Синтаксис слегка торжественный, но понятный обычному читателю; повтор «обо всём» сохраняет параллелизм оригинала.
