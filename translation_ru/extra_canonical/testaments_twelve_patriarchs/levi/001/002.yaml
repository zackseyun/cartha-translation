base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/001/002.yaml
  text: 'For he was in sound health when he called them to himself; but it was revealed to him that he was about to die. And when they had gathered together, he said to them:'
translation:
  language: ru
  text: 'Ведь он был здоров, когда призвал их к себе; но ему было открыто, что ему предстоит умереть. И когда они собрались, он сказал им:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑγιαίνων
  choice: был здоров
  rationale: Причастие обозначает хорошее физическое состояние; естественная русская конструкция передаёт его обстоятельственное значение вместе с ἦν.
- source_word: ἀπεκαλύφθη
  choice: ему было открыто
  rationale: Сохранён страдательный залог и подразумеваемый сверхъестественный характер полученного знания без уточнения того, кто совершил откровение.
- source_word: μέλλει ἀποθνήσκειν
  choice: скоро умрёт
  rationale: Передаёт предстоящее и близкое событие естественным современным русским языком.
- source_word: συνήχθησαν
  choice: собрались
  rationale: Нейтрально и точно передаёт совместное собирание упомянутых лиц.
theological_decisions:
- issue: Источник откровения
  choice: Не называть того, кто открыл Левию его близкую смерть
  alternative: «Бог открыл ему»
  rationale: Греческий текст использует безличную пассивную конструкцию и не называет действующее лицо; перевод сохраняет эту неопределённость.
translation_notes:
  register: Современный литературный русский язык с повествовательной торжественностью; синтаксические связи оригинала сохранены без архаизмов. Двоеточие в конце отражает переход к последующей прямой речи.
