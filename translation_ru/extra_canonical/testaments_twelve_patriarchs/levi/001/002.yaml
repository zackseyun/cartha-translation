  text: Ὑγιαίνων⁹ γὰρ¹⁰ ἦν ὅτε ἐκάλεσεν αὐτοὺς πρὸς ἑαυτόν· *ἀπεκαλύφθη δὲ¹¹ αὐτῷ ὅτι μέλλει ἀποθνήσκειν¹². *Καὶ ὅτε¹³ συνήχθησαν¹⁴, *εἶπεν πρὸς αὐτούς¹⁵.
