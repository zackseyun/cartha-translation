lexical_decisions:
- source_word: στυγνός
  choice: мрачным
  rationale: Передаёт тёмный, суровый характер нижнего неба, не приписывая ему прямо чувство ненависти.
- source_word: ἀδικίας
  choice: неправедные дела
  rationale: Сохраняет нравственно-религиозный смысл и конкретность человеческих поступков.
- source_word: κρύσταλλον
  choice: лёд
  rationale: В ряду «огонь, снег и κρύσταλλος» слово естественно обозначает лёд; буквальное «кристалл» отмечено в сноске.
- source_word: πνεύματα τῶν ἐπαγωγῶν
  choice: духи бедствий
  rationale: ἐπαγωγή здесь обозначает ниспосланное бедствие или кару; сноска сохраняет диапазон возможных значений.
- source_word: δυνάμεις τῶν παρεμβολῶν
  choice: силы небесных воинств
  rationale: παρεμβολή в апокалиптическом контексте означает стан или войско; русская формулировка ясно передаёт организованные небесные силы.
- source_word: ἐκδίκησις
  choice: возмездие
  rationale: Передаёт судебно-карательный смысл без оттенка личной мстительности, возможного у слова «месть».
- source_word: Βελίαρ
  choice: Велиар
  rationale: Сохраняет форму имени в греческом свидетельстве, не гармонизируя её с более привычным «Велиал».
- source_word: ἡ μεγάλη δόξα
  choice: великая Слава
  rationale: Сохраняет благоговейное иносказательное наименование Божьего присутствия; прописная буква отмечает титульную функцию.
- source_word: λειτουργοῦντες
  choice: совершают священное служение
  rationale: Отражает культовый оттенок глагола и при этом остаётся понятным современному читателю.
- source_word: ἐξιλασκόμενοι
  choice: совершают ... умилостивление
  rationale: Сохраняет явную культовую образность; альтернативное значение очищения указано в сноске.
- source_word: ἀγνοίαι
  choice: грехи, совершённые ... по неведению
  rationale: Передаёт не просто отсутствие знания, а проступки по неведению в жертвенно-культовом контексте.
- source_word: ὀσμὴν εὐωδίας
  choice: благоухание
  rationale: Естественно воспроизводит традиционный жертвенный образ приятного благоухания.
- source_word: λογικὴν
  choice: разумную
  rationale: Сохраняет прямое значение многозначного слова; возможное контекстуальное «духовную» вынесено в сноску.
- source_word: ἄγγελοι τοῦ προσώπου κυρίου
  choice: ангелы, предстоящие пред лицом Господа
  rationale: Делает понятным семитизированное выражение, сохраняя идею непосредственного Божьего присутствия.
- source_word: ἀναισθητοῦντες
  choice: оставаясь бесчувственными
  rationale: Передаёт духовную невосприимчивость людей, а не только недостаток интеллектуального понимания.
theological_decisions:
- issue: Небесное культовое служение архангелов за праведников
  choice: Архангелы совершают священное служение и умилостивление за грехи праведников по неведению.
  alternative: Понять действие как общее ходатайство либо перевести как «совершают очищение».
  rationale: Греческий текст использует культовый глагол ἐξιλάσκομαι и далее прямо говорит о приношении и жертве; перевод сохраняет эту напряжённую жертвенную образность, не сводя её к молитвенному ходатайству.
- issue: Иносказательный божественный титул
  choice: «великая Слава» сохранено как титульное обозначение.
  alternative: Заменить на «Бог» или передать как «величественная Слава».
  rationale: Прямое сохранение образа не устраняет благоговейную иносказательность исходного текста.
- issue: Объект возмездия на втором небе
  choice: «над духами заблуждения и Велиаром».
  alternative: Истолковать Велиара как определение духов или изменить синтаксическую связь.
  rationale: Перевод следует координации греческого текста и не уточняет сверх источника отношения между Велиаром и духами заблуждения.
- issue: Небесная иерархия в повреждённых стихах 5 и 8
  choice: Связи переданы контекстуально, а повреждение текста отмечено в сносках.
  alternative: Безоговорочно выстроить семиярусную схему небес или буквально оставить грамматически неясное «после них».
  rationale: Так сохраняется читаемость без сокрытия реальной текстологической неопределённости.
- issue: Всеобщий трепет при Божьем взоре
  choice: 'Сохранено чтение греческого текста: «все мы трепещем», а не расширенная картина из иной текстовой традиции.'
  alternative: 'Следовать английскому консультационному слою: небеса содрогаются, а земля движется от оснований.'
  rationale: Предоставленный греческий источник прямо содержит πάντες τρέμομεν и перечисляет небо, землю и бездну как колеблющиеся пред Божьим величием.
translation_notes:
  register: Современный литературный русский язык с достоинством апокалиптического и культового регистра. Синтаксис умеренно приподнят, но избегает архаизмов и конфессионально маркированной терминологии. Повторяющаяся небесная топография передана ясно, а повреждённые места не замаскированы.
