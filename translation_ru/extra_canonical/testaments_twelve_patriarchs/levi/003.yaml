base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/003.yaml
  text: 'Listen, then, concerning the heavens that were shown to you. The lowest is dark for this reason: because it sees all the unrighteous deeds of men. And it has fire, snow, and ice prepared for the day determined by God, as a righteous judgment of God upon men. In it are all the spirits of the punishments for vengeance on the lawless. Above this is the holy place, and in it are the hosts of the armies appointed for the day of judgment, to carry out vengeance on the spirits of deceit and of Beliar[b]. Above them are the holy ones. In the highest of all dwells the Great Glory, far above all holiness. In the heaven next to it are the archangels, who minister and make propitiation[a] to the Lord for all the sins committed in ignorance by the righteous, offering to the Lord a sweet-smelling fragrance, a reasonable and bloodless offering[c]. And in the heaven below this are the angels who bear answers to the angels of the presence of the Lord. But in the heaven next below are thrones and
    dominions, in which hymns are continually offered to God. Therefore, when the Lord looks upon us through the degree of his holiness, the heavens are shaken. And the earth also is moved from its foundations, and, trembling, it is shaken to its depths. But the sons of men, having no understanding of these things, go astray and provoke him to anger.'
translation:
  language: ru
  text: 'Завещание Левия, глава 3


    1 Итак, выслушай об увиденных тобою небесах. Нижнее небо потому и кажется тебе мрачным, что видит все неправедные дела людей. 2 В нём хранятся огонь, снег и лёд[a], приготовленные ко дню суда, когда Бог будет судить праведно. В нём же находятся все духи бедствий[b], предназначенные совершить возмездие над людьми. 3 На втором небе находятся силы небесных воинств, поставленные на день суда, чтобы совершить возмездие над духами заблуждения и Велиаром[c]; а над ними находятся святые. 4 В высшей из всех обителей пребывает великая Слава, превыше всякой святости. 5 На небе, следующем за ним[d], находятся архангелы, которые совершают священное служение и умилостивление[e] пред Господом за все грехи, совершённые праведниками по неведению. 6 Они приносят Господу благоухание — разумную[f] и бескровную жертву. 7 А на небе под ним находятся ангелы, которые передают ответы ангелам, предстоящим пред лицом Господа[g]. 8 На следующем за ними небе[h] находятся престолы и власти; там непрестанно возносятся
    Богу хвалебные песни. 9 Итак, когда Господь обращает на нас взор, все мы трепещем, и небо, земля и бездна колеблются пред лицом Его величия. 10 Но сыны человеческие, оставаясь бесчувственными ко всему этому, грешат и вызывают гнев Всевышнего.


    [a] Буквально: «кристалл»; в данном перечне греч. κρύσταλλος означает лёд.


    [b] Греч. ἐπαγωγαί может означать бедствия, кары или наказания, ниспосылаемые свыше.


    [c] «Велиар» передаёт греческую форму имени, которое в других традициях часто звучит как «Велиал».


    [d] Греческий текст здесь повреждён: буквально сохранилось «следующем за ними». По контексту речь, вероятно, идёт о небе, расположенном рядом с высшей обителью.


    [e] Или: «совершают очищение». Греческий глагол имеет культовое значение и может обозначать умилостивление или искупительное очищение.


    [f] Или: «духовную». Греч. λογικήν буквально означает «разумную», но в культовом контексте допускает значение «духовную».


    [g] Буквально: «ангелам лица Господа»; то есть ангелам, пребывающим в непосредственном присутствии Господа.


    [h] Греческий текст здесь также повреждён: буквально сохранилось «в следующем за ними». Точное место этого неба в последовательности не вполне ясно.'
  philosophy: optimal-equivalence
