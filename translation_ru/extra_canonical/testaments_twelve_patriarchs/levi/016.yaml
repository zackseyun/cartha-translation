base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016.yaml
  text: 'And now I know that for seventy weeks you will go astray[a], and you will profane the priesthood and defile the altars. And you will set aside the law and treat the words of the prophets with contempt in evil perversity. You will persecute righteous men, and you will hate the godly; you will loathe the words of the truthful.


    And a man who renews the law in the power of the Most High you will call a deceiver, and at last you will rush to kill him, not knowing his stature, taking innocent blood upon your heads in wickedness.


    But I tell you that because of him your holy places will be laid waste to the ground. And no clean place will remain for you, but you will be among the nations of the earth for a curse and for scattering[b][a][a], until he himself visits again and shows compassion and receives you.'
translation:
  language: ru
  text: '16 И теперь я знаю, что в течение семидесяти седмин вы будете введены в заблуждение; вы оскверните священство и оскверните жертвенники. 2 Вы отвергнете Закон и, злонамеренно извращая слова пророков, выкажете к ним презрение. Вы будете преследовать праведных и ненавидеть благочестивых, будете гнушаться словами правдивых.


    3 Человека, обновляющего Закон силой Всевышнего, вы назовёте обманщиком и в конце концов устремитесь убить его, не зная его величия; навлекая на свои головы невинную кровь в нечестии.[a][b][c]


    4 Но говорю вам: из-за него ваши святыни будут разорены до основания. 5 И не будет у вас чистого места; среди народов вы станете проклятием и будете рассеяны, пока он сам вновь не посетит вас, не явит сострадание и не примет вас.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст этого стиха труден и имеет признаки текстуальной нарушенности; возможно, перед нами расширение или позднейшая вставка. Перевод следует представленному греческому свидетельству.
    reason: textual_variant
  - marker: b
    text: 'Или: «человека, делающего Закон новым». Эти слова можно понимать и как враждебное обвинение против человека, стремящегося обновить Закон.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «не зная его роста (или стати)»; по смыслу возможно: «его истинного достоинства» или «его величия».'
    reason: lexical_alternative
  - marker: d
    text: Под словами «он сам вновь посетит» можно понимать Бога или, возможно, ранее упомянутого человека; греческий текст не требует однозначного выбора.
    reason: alternative_reading
