- source_word: θυσιαστήρια μιανεῖτε
  choice: запятнаете жертвенники
  rationale: Различает два близких греческих глагола осквернения; «запятнаете» естественно передаёт ритуальную нечистоту в данном параллелизме.
- source_word: τὸν νόμον ἀθετήσετε
  choice: отвергнете Закон
  rationale: Передаёт отказ признавать обязательность Закона без привнесения позднейшей технической богословской терминологии.
- source_word: λόγους προφητῶν ἐξουδενώσετε
  choice: выкажете презрение к словам пророков
  rationale: Ясно выражает значение пренебрежения и презрения, оставаясь естественным по-русски.
- source_word: ἐν διαστροφῇ κακῇ
  choice: в злом извращении
  rationale: Сохраняет образ нравственной искривлённости, а не сводит выражение к общему наречию «злобно».
- source_word: εὐσεβεῖς
  choice: благочестивых
  rationale: Современное литературное слово, точно обозначающее людей, почитающих Бога.
- source_word: ἀληθινῶν λόγους
  choice: словами правдивых
  rationale: Сохраняет субстантивированное личное значение «правдивых [людей]» при сжатом строе греческой фразы.
- source_word: ἄνδρα καινοποιοῦντα νόμον
  choice: человека, обновляющего Закон
  rationale: Передаёт идею «делающего новым» и не решает заранее, является ли это одобрительным описанием или враждебным обвинением.
- source_word: ἐν δυνάμει ὑψίστου
  choice: силой Всевышнего
  rationale: Естественно передаёт инструментальный смысл и сохраняет божественный титул.
- source_word: τὸ ἀνάστημα
  choice: величия
  rationale: В контексте речь, вероятно, о подлинном достоинстве или величии человека; буквальная телесная «стать/рост» отмечена в сноске.
- source_word: τὰ ἅγια
  choice: святыни
  rationale: Собирательное «святыни» сохраняет возможность понимать выражение как святые места или священные предметы.
- source_word: εἰς διασκορπισμόν
  choice: будете рассеяны
  rationale: Естественно выражает состояние рассеяния среди народов и сохраняет библейскую образность.
theological_decisions:
- issue: Текстуально трудный фрагмент 16:3 о человеке, обновляющем Закон
  choice: Фрагмент включён в основной текст и переведён без явной мессианской идентификации; его состояние отмечено в сноске.
  alternative: Исключить фрагмент как позднейшую вставку либо перевести его с явной мессианской трактовкой.
  rationale: Предоставленный греческий свидетель содержит эти слова, хотя скобки и порча текста требуют прозрачного предупреждения читателя, а не молчаливого исключения или конфессиональной конкретизации.
- issue: Значение τὸ ἀνάστημα применительно к преследуемому человеку
  choice: В основном тексте — «его величия», с буквальным значением в сноске.
  alternative: «Его роста» или «его стати».
  rationale: Переносный смысл лучше соответствует обвинению, убийству и неузнанному достоинству, однако буквальная возможность не скрывается.
- issue: Причинная связь δι᾽ αὐτόν в 16:4
  choice: «Из-за него» без уточнения, означает ли это вину людей за его убийство или иную причинную связь.
  alternative: «За то, что вы сделали с ним» либо «ради него».
  rationale: Греческий предлог допускает контекстуальную причинность, но не формулирует её точнее; перевод сохраняет напряжение.
- issue: Референт αὐτός в заключении 16:5
  choice: «Он сам» без определения лица.
  alternative: «Бог сам» либо ранее названный человек.
  rationale: Грамматика не вынуждает выбрать единственный антецедент. Неопределённость сохранена в основном тексте и пояснена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательно-пророческой речи. Сохранены культовые термины («священство», «жертвенники», «святыни»), апокалиптическое «семьдесят седмин» и намеренная неоднозначность заключительного местоимения. Архаизмы ограничены словом «седмины», оправданным жанром и устойчивым библейским эхом.
