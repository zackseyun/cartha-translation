base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/011.yaml
  text: But the wrath of God came upon them fully.
translation:
  language: ru
  text: Но гнев Божий обрушился на них в полной мере.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «окончательно».'
    reason: Выражение εἰς τέλος может подчёркивать окончательность, наряду с переданной в основном тексте полнотой.
lexical_decisions:
- source_word: Ἔφθασε
  choice: постиг
  rationale: Глагол здесь означает, что гнев достиг их, настиг или обрушился на них; «постиг» естественно передаёт наступившее действие суда.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: гнев Божий
  rationale: Точная и традиционно понятная передача родительного сочетания, сохраняющая высокий, но современно доступный регистр.
- source_word: εἰς τέλος
  choice: до конца
  rationale: Буквально сохраняет образ предела и допускает оттенки полного осуществления либо окончательности, не сводя выражение только к наречию «полностью».
theological_decisions:
- issue: Смысл εἰς τέλος применительно к Божьему гневу
  choice: до конца
  alternative: в полной мере / окончательно
  rationale: Греческое выражение может указывать как на полноту, так и на доведение до окончательного предела. Основной текст сохраняет эту смысловую напряжённость, а примечание обозначает возможные оттенки.
translation_notes:
  register: Современный литературный русский язык с кратким, торжественным библейским звучанием. Союз «Но» передаёт δέ; инверсия не используется, чтобы фраза оставалась естественной и ясной.
