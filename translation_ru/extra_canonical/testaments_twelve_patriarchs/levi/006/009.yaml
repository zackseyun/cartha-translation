  text: And they pursued Abraham our father while he was a stranger, and they oppressed his flocks while they were increasing, and they cruelly mistreated Eblan, his home-born servant.
translation:
  language: ru
  text: И они преследовали Авраама, отца нашего, когда он был пришельцем, угнетали его умножавшиеся стада и жестоко истязали Эблана, его доморождённого слугу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδίωξαν
  choice: преследовали
  rationale: Передаёт обычное значение глагола в данном враждебном контексте, не уточняя способ преследования.
- source_word: ξένον ὄντα
  choice: когда он был пришельцем
  rationale: «Пришелец» сохраняет смысл человека, живущего на чужой земле, и соответствует библейскому регистру без излишней архаики.
- source_word: κατεπόνησαν
  choice: угнетали
  rationale: Глагол выражает причинение тягот и притеснение; выбранное слово естественно сочетается со стадами и не добавляет конкретного вида ущерба.
- source_word: τὰ ποίμνια ὀγκούμενα ὄντα
  choice: его умножавшиеся стада
  rationale: Причастие ὀγκούμενα буквально связано с увеличением; в отношении стад здесь естественно передать рост их численности.
- source_word: Ἐβλαὴν
  choice: Эвлана
  rationale: Транслитерация греческой формы собственного имени Ἐβλαήν с русским падежным оформлением.
- source_word: τὸν οἰκογενῆ αὐτοῦ
  choice: его доморождённого слугу
  rationale: οἰκογενής означает рождённого в доме или принадлежащего к домочадцам; слово «слуга» проясняет подразумеваемое положение лица вслед за контекстом, а «доморождённый» сохраняет специфический оттенок.
- source_word: σφόδρα ἠκίσαντο
  choice: жестоко истязали
  rationale: Сочетание обозначает крайне суровое, позорящее или мучительное обращение; «жестоко истязали» передаёт усиление σφόδρα и силу глагола.
