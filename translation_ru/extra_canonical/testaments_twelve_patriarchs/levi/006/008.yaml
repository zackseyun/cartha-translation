source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Ἀλλ᾿ ἐγὼ εἶδον ὅτι ἀπόφασις θεοῦ ἦν εἰς κακὰ³⁸ διότι ἤθελον ἐποίησεν *καὶ τὴν Σαρρὰ³⁹ ⌈καὶ τὴν Ῥεβέκκα⌉⁴⁰ ποιῆσαι ⌈ὃν τρόπον ἐποίησαν *τὴν Δείναν⁴¹ *τὴν ἀδελφὴν ἡμῶν⁴²⌉, καὶ ὁ⁴³ Κύριος ἐκώλυσεν αὐτούς.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/008.yaml
  text: But I saw that it was a decree of God for evil against them, because they intended to do to Sarah and Rebekah as they had done to Dinah our sister; and the Lord restrained them.
translation:
  language: ru
  text: Но я увидел, что Божий приговор нёс им бедствия, потому что они намеревались поступить с Саррой и Ревеккой так же, как поступили с Диной, нашей сестрой; и Господь воспрепятствовал им.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόφασις θεοῦ
  choice: Божий приговор
  rationale: Сочетание означает вынесенное Богом решение или приговор; «приговор» естественно передаёт судебный оттенок ἀπόφασις.
- source_word: εἰς κακά
  choice: бедствие
  rationale: Множественное κακά здесь обозначает зло или беды, направленные против виновных; «бедствие» сохраняет неблагоприятный смысл, не представляя Бога нравственно злым.
- source_word: ἤθελον
  choice: намеревались
  rationale: В данном контексте глагол выражает намерение, а не просто желание.
- source_word: ὃν τρόπον ἐποίησαν
  choice: так же, как поступили
  rationale: Передаёт сравнительную конструкцию и избегает ненужного уточнения характера насилия, которого сам стих прямо не называет.
- source_word: ἐκώλυσεν
  choice: воспрепятствовал
  rationale: Точно передаёт действие по предотвращению задуманного и соответствует достоинству повествовательного регистра.
theological_decisions:
- issue: Божье решение «εἰς κακά»
  choice: Божий приговор им был — бедствие
  alternative: Божье решение было направлено им во зло
  rationale: Выбранная формулировка сохраняет Божий судебный приговор и направленность бедствия против них, но не создаёт лишнего впечатления, будто Бог совершает нравственное зло.
- issue: Соотношение приговора Бога и человеческого умысла
  choice: сохранена причинная связь «потому что они намеревались»
  alternative: смягчить до простого временного или повествовательного перехода
  rationale: διότι прямо связывает Божий приговор с их намерением; эту богословскую напряжённость следует сохранить.
translation_notes:
  register: Современный литературный русский язык с достойным повествовательным тоном. Синтаксис остаётся близким к греческому, но устранена неестественная буквальность; неоднозначное κακά передано контекстуально как «бедствие».
