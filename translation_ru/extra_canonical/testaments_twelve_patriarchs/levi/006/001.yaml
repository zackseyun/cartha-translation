base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/001.yaml
  text: And as I was going to my father, I found a bronze shield; therefore the name of the mountain is Aspis, which is near Gebal, to the right of Abim.
translation:
  language: ru
  text: И когда я шёл к своему отцу, то нашёл бронзовый щит; поэтому гора и называется Аспис[a]. Она находится близ Гевала, справа от Авимы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Аспис» по-гречески означает «щит».
    reason: Поясняет основание названия горы и сохраняет игру слов, которую невозможно полностью воспроизвести одной транслитерацией.
  - marker: b
    text: 'Или: «по правую сторону от Авимы». Точная идентификация этого места неясна.'
    reason: Отмечает допустимый буквальный оттенок ἐκ δεξιῶν и неопределённость топонима.
lexical_decisions:
- source_word: ἀσπίδα χαλκῆν
  choice: медный щит
  rationale: Прямо передаёт предмет и материал; «медный» естественнее в данном древнем контексте, чем технически более узкое «бронзовый», поскольку χαλκοῦς может обозначать изделие из меди или медного сплава.
- source_word: Ἄσπις
  choice: Аспис
  rationale: Название горы передано транслитерацией, чтобы сохранить явную греческую игру между ἀσπίς («щит») и топонимом Ἄσπις.
- source_word: ἐγγὺς Γεβάλ
  choice: близ Гевала
  rationale: Сохраняет пространственное значение ἐγγύς и передаёт географическое имя Γεβάλ как «Гевал».
- source_word: ἐκ δεξιῶν Ἀβιμά
  choice: справа от Авимы
  rationale: Естественная русская передача относительного пространственного положения; форма «Авимы» отражает греческий топоним Ἀβιμά, хотя его точная идентификация неясна.
