lexical_decisions:
- source_word: ἀνεῖλον
  choice: убил
  rationale: Аорист от ἀναιρέω здесь прямо обозначает лишение жизни; «убил» естественно и точно передаёт смысл.
- source_word: ἐν πρώτοις
  choice: первым
  rationale: Выражение имеет значение первенства в последовательности действий; в данном контексте естественно передаётся наречным «первым».
- source_word: Συχὲμ
  choice: Сихема
  rationale: Традиционная русская библейская передача имени Shechem.
- source_word: Συμεὼν
  choice: Симеон
  rationale: Устоявшаяся русская форма библейского имени.
- source_word: Ἐμμώρ
  choice: Еммора
  rationale: Передаёт греческую форму имени Ἐμμώρ и согласуется с традиционным русским написанием в Быт 34.
