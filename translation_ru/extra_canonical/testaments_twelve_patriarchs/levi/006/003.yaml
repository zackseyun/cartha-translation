base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/003.yaml
  text: After this I took counsel with my father and with Reuben, that he should tell the sons of Emmor not to circumcise themselves, because I was zealous because of the abomination which they had committed against my sister.
translation:
  language: ru
  text: После этого я посоветовался с отцом и Рувимом, чтобы он[a] сказал сыновьям Еммора не подвергаться обрезанию, ибо я воспылал ревностью[b] из-за мерзости, которую они совершили над моей сестрой.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В греческом тексте сказуемое стоит в единственном числе: «чтобы он сказал»; к кому именно относится «он» — к отцу или к Рувиму, — не уточняется.'
    reason: Сохранить грамматическую неоднозначность исходного текста, не назначая референта без достаточных оснований.
  - marker: b
    text: 'Или: «я исполнился ревностного негодования».'
    reason: Отразить смысловой диапазон греческого ἐζήλωσα; «ревность» здесь может означать пылкое усердие или негодование, а не зависть.
lexical_decisions:
- source_word: συνεβούλευσα
  choice: я посоветовался с
  rationale: Передаёт совместное обсуждение, предполагаемое сочетанием глагола с дательными τῷ πατρί μου и τῷ Ῥουβήμ, и соответствует естественной русской речи.
- source_word: τοῦ μὴ περιτμηθῆναι αὐτούς
  choice: не подвергаться обрезанию
  rationale: Сохраняет отрицание и пассивную форму греческого аористного инфинитива, не превращая её в повеление самим совершить обрезание.
- source_word: ἐζήλωσα
  choice: меня охватила ревность
  rationale: Сохраняет смысл сильной ревности или ревностного негодования, не сводя его только к гневу или зависти.
- source_word: βδέλυγμα
  choice: мерзость
  rationale: Точное и стилистически уместное обозначение отвратительного, постыдного деяния.
- source_word: ἐπὶ τῇ ἀδελφῇ μου
  choice: над моей сестрой
  rationale: Естественно по-русски обозначает злодеяние, совершённое в отношении сестры, без излишней конкретизации.
theological_decisions:
- issue: Ревность Левия как мотив поступка
  choice: меня охватила ревность
  alternative: я вознегодовал
  rationale: Греческое ἐζήλωσα допускает оттенки ревности, пылкого усердия и негодования. Основной текст сохраняет более широкий смысл и не даёт однозначной нравственной оценки состоянию Левия.
- issue: Неопределённый субъект глагола εἴπῃ
  choice: чтобы он сказал
  alternative: чтобы они сказали
  rationale: В греческом стоит глагол в единственном числе, хотя перед ним названы отец и Рувим. Перевод сохраняет это текстовое напряжение, а сноска отмечает неясность референта.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования. Синтаксис сделан понятным для обычного читателя, при этом сохранены необычное единственное число «он» и смысловая широта слова «ревность».
