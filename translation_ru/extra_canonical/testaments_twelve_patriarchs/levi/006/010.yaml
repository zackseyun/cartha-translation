source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καίγε οὕτως⁵⁵ ἐποίουν *πᾶσι τοῖς ξένοις⁵⁶, *ἐν δυναστείᾳ ἁρπάζοντες⁵⁷ *τὰς ξένας⁵⁸ καὶ †ἐξενηλάτουν⁵⁹ αὐτάς⁶⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/010.yaml
  text: And indeed in this way they used to act toward all strangers, seizing the foreign women by force and driving them away.
translation:
  language: ru
  text: 'Именно так они поступали со всеми чужеземцами: силой похищали чужеземных женщин и прогоняли их.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε οὕτως
  choice: Именно так
  rationale: Передаёт усилительное καίγε и указательное οὕτως естественным современным русским оборотом.
- source_word: πᾶσι τοῖς ξένοις
  choice: со всеми чужеземцами
  rationale: ξένοι здесь обозначает чужеземцев или посторонних; «чужеземцы» сохраняет связь с последующим τὰς ξένας.
- source_word: ἐν δυναστείᾳ ἁρπάζοντες
  choice: силой похищали
  rationale: ἐν δυναστείᾳ указывает на применение силы, а ἁρπάζω — на насильственный захват или похищение.
- source_word: τὰς ξένας
  choice: чужеземных женщин
  rationale: Субстантивированное прилагательное женского рода означает женщин-чужеземок; перевод не вносит значения принадлежности «их женщин».
- source_word: ἐξενηλάτουν αὐτάς
  choice: прогоняли их
  rationale: Глагол означает изгонять или прогонять, а местоимение женского рода относится к упомянутым женщинам.
