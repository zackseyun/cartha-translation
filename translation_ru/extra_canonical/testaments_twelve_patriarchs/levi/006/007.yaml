source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Διότι ἡμάρτομεν ἐπειδὴ³⁵ παρὰ γνώμην αὐτοῦ τοῦτο πεποιήκαμεν³⁶, καίγε ἐμαλακίσθη³⁷ ἐν τῇ ἡμέρᾳ ἐκείνῃ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/007.yaml
  text: For we sinned, because we had done this contrary to his will, although he became weak on that day.
translation:
  language: ru
  text: Ибо мы согрешили, потому что сделали это вопреки его воле, хотя в тот день он ослабел.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ γνώμην αὐτοῦ
  choice: вопреки его воле
  rationale: В данном контексте γνώμη обозначает намерение или волю, а оборот παρά с винительным указывает на действие вопреки ей.
- source_word: ἐμαλακίσθη
  choice: ослабел
  rationale: Пассивная форма может означать «стал слабым, ослабел»; перевод сохраняет смысл без уточнения, была ли слабость физической или душевной.
theological_decisions:
- issue: Связь собственного греха говорящих с действием вопреки воле неназванного лица
  choice: 'Сохранена прямая причинная связь: «мы согрешили, потому что сделали это вопреки его воле»'
  alternative: «мы ошиблись» или уточнение лица и характера его воли
  rationale: ἡμάρτομεν имеет нравственно весомое значение «согрешили», тогда как источник не называет лицо прямо и не позволяет добавлять богословское уточнение.
- issue: Уступительное значение καίγε
  choice: «хотя»
  alternative: «и всё же»
  rationale: «Хотя» естественно передаёт напряжение между поступком вопреки его воле и тем, что в тот день он ослабел, не устраняя возможной неоднозначности связи.
translation_notes:
  register: Современный литературный русский язык; фраза сохраняет лаконичность, причинную конструкцию и неоднозначную отсылку местоимения «его/он» исходного текста.
