  to: И мой отец услышал всё это и, разгневавшись, опечалился из-за того, что они приняли обрезание и умерли; а в своих благословениях он обошёл нас.
  rationale: Минимальная правка уточняет передачу ταῦτα («всё это») и выравнивает порядок слов без изменения смысла. Синтаксическое соединение «приняли обрезание и умерли» сохранено без добавления противительного оттенка; текстологически отмеченная заключительная фраза не требует пояснительной сноски, поскольку её основной смысл передаётся уверенно.
