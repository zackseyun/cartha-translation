  source_fidelity: 'Перевод в целом точно передаёт греческий текст: сохранены реакция отца (гнев и скорбь), две причины, соединённые καὶ, и смысл παρεῖδεν как исключения «нас» из благословений. Однако ταῦτα стоит передать множественным/собирательным указанием («всё это»), а не более узким «об этом».'
