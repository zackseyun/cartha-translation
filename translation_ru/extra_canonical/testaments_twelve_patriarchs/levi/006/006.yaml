source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἤκουσεν²⁶ ὁ πατήρ *μου ⌈ταῦτα⌉²⁷ *καὶ ὀργισθεὶς²⁸ ἐλυπήθη²⁹ ὅτι κατεδέξαντο³⁰ τὴν περιτομὴν καὶ³¹ ἀπέθανον³², *καὶ ἐν ταῖς εὐλογίαις³³ †παρεῖδεν ἡμῖν³⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/006.yaml
  text: And my father heard these things, and being angry, he was grieved because they had accepted circumcision and died, and in his blessings he passed over us.
translation:
  language: ru
  text: И мой отец услышал всё это и, разгневавшись, опечалился из-за того, что они приняли обрезание и умерли; а в своих благословениях он обошёл нас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσεν … ταῦτα
  choice: услышал … об этом
  rationale: Естественная русская передача буквального «услышал это» при сохранении отсылки к предшествующим событиям.
- source_word: ὀργισθεὶς ἐλυπήθη
  choice: разгневавшись, опечалился
  rationale: Сохраняет различие между гневом и скорбью, а также причастную конструкцию исходного текста.
- source_word: κατεδέξαντο τὴν περιτομήν
  choice: приняли обрезание
  rationale: Передаёт добровольное согласие принять обрезание без добавочного истолкования.
- source_word: ἐν ταῖς εὐλογίαις … παρεῖδεν ἡμῖν
  choice: в своих благословениях он обошёл нас
  rationale: Передаёт смысл оставления без упоминания или благословения; местоимение «своих» естественно указывает на благословения отца.
theological_decisions:
- issue: Причина скорби отца
  choice: из-за того, что они приняли обрезание и умерли
  alternative: из-за того, что они приняли обрезание, но умерли
  rationale: Греческое καὶ связывает два обстоятельства без явного противительного оттенка; перевод не вводит отсутствующее в тексте «но».
- issue: Смысл παρεῖδεν в контексте благословений
  choice: обошёл нас
  alternative: не заметил нас / пренебрёг нами
  rationale: «Обошёл нас» естественно выражает то, что отец оставил говорящих без благословения, не усиливая фразу до сознательного пренебрежения.
translation_notes:
  register: Современный литературный русский язык; повествование звучит ясно и достойно. Точка с запятой разграничивает скорбь отца и последующее упоминание о благословениях. Повреждённость последней греческой фразы отмечена в издании, однако основной синтаксический смысл передан без конъектур.
