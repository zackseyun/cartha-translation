  text: После этого пришли мои братья и поразили тот[a] город лезвием меча.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «тот» в греческом тексте отмечено издателем как текстуально неуверенное.
    reason: В исходном тексте ἐκείνην заключено в критические скобки; примечание сохраняет эту текстологическую неопределённость.
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: после этого
  rationale: Естественно передаёт временную последовательность без излишне буквального «после этих событий».
- source_word: ἐλθόντες οἱ ἀδελφοί μου
  choice: пришли мои братья
  rationale: Греческое причастие передано личной формой в последовательном русском повествовании.
- source_word: ἐπάταξαν τὴν πόλιν
  choice: поразили город
  rationale: Сохраняет прямой объект греческого текста и его военную образность, не подменяя город явно названными жителями.
- source_word: ἐν στόματι μαχαίρας
  choice: остриём меча
  rationale: Передаёт устойчивый библейский оборот о поражении мечом в понятной современной формулировке; «устами меча» было бы неестественной калькой.
