- source_word: οἱ μισοῦντες ὑμᾶς
  choice: ненавидящие вас
  rationale: Причастная конструкция передана естественным русским причастным оборотом с сохранением настоящего времени и прямого объекта.
- source_word: χαρήσονται
  choice: будут радоваться
  rationale: Будущее изъявительное среднего/депонентного глагола χαίρω передано формой будущего времени без добавочной интерпретации.
- source_word: ἐπὶ τῇ ἀπωλείᾳ ὑμῶν
  choice: вашей гибели
  rationale: ἀπώλεια здесь обозначает гибель или уничтожение; «гибель» естественно сочетается с «радоваться» и сохраняет смысл бедственного окончательного исхода.
