  text: Therefore the temple which the Lord will choose will become desolate in your uncleanness, and you will be taken captive to all the nations.
translation:
  language: ru
  text: Поэтому храм, который изберёт Господь, запустеет в вашей нечистоте, а вы будете уведены в плен ко всем народам.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ναός
  choice: храм
  rationale: Прямое и естественное соответствие греческому ναός в данном контексте.
- source_word: ἐκλέξεται
  choice: изберёт
  rationale: Будущее время и значение выбора сохранены без уточнения, отсутствующего в источнике.
- source_word: ἔρημος ἔσται
  choice: опустеет
  rationale: Естественно передаёт предикативное «станет пустынным, запустеет» применительно к храму.
- source_word: ἐν τῇ ἀκαθαρσίᾳ ὑμῶν
  choice: из-за вашей нечистоты
  rationale: ἐν здесь естественно понимается как обстоятельство причины; «нечистота» сохраняет культовую и нравственную многозначность ἀκαθαρσία.
- source_word: αἰχμάλωτοι ἔσεσθε
  choice: будете уведены в плен
  rationale: Передаёт состояние пленников естественной русской конструкцией, не добавляя субъекта действия.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: ко всем народам
  rationale: Сохраняет направительное значение εἰς, в отличие от локативного «среди всех народов».
theological_decisions:
- issue: Характер «нечистоты»
  choice: нечистота
  alternative: осквернение
  rationale: «Нечистота» не сужает смысл до одного лишь действия осквернения и сохраняет возможные культовые и нравственные оттенки.
- issue: Связь запустения храма с нечистотой
  choice: из-за вашей нечистоты
  alternative: в вашей нечистоте
  rationale: Причинное прочтение наиболее естественно в контексте, хотя широкий инструментально-сферический оттенок греческого ἐν полностью не исключается.
translation_notes:
  register: Современный литературный русский язык; торжественный, но понятный библейский регистр. Синтаксис краткий и прямой, без архаизмов и конфессионально окрашенных уточнений.
