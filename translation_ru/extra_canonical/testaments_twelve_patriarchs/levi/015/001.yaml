  terminology: '«Храм», «Господь», «нечистота» и «уведены в плен» точны и стилистически уместны. «Нечистота» сохраняет как культовый, так и нравственный потенциал ἀκαθαρσία. Дополнительные сноски не требуются: в предоставленном исходном тексте нет содержания текстологических примечаний, которое следовало бы переносить.'
