source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ¹⁷ εἰ μὴ¹⁸ δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ *τῶν πατέρων ἡμῶν ἔλεος λήψεσθε¹⁹, εἷς²⁰ ἐκ τοῦ σπέρματος²¹ ὑμῶν²² *οὐ μὴ²³ καταλειφθῇ²⁴ ἐπὶ τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015/004.yaml
  text: And if it were not for Abraham and Isaac and Jacob, our fathers, you would receive no mercy; not one of your seed would be left on the earth.
translation:
  language: ru
  text: И если бы не Авраам, Исаак и Иаков, отцы наши, вы не получили бы милости; ни один из вашего потомства не остался бы на земле.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεος λήψεσθε
  choice: вы не получили бы милости
  rationale: Сочетание буквально означает «вы получили бы милость»; в условной конструкции с εἰ μή оно естественно передаётся по-русски отрицательным сослагательным оборотом.
- source_word: ἐκ τοῦ σπέρματος ὑμῶν
  choice: из вашего потомства
  rationale: σπέρμα здесь обозначает потомство, а не буквальное семя; предлог ἐκ сохранён оборотом «из вашего потомства».
- source_word: οὐ μὴ καταλειφθῇ
  choice: не остался бы
  rationale: Усиленное греческое отрицание передаёт категоричность; в русском условном контексте естественна форма сослагательного наклонения.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Прямое и естественное соответствие пространственному выражению источника.
theological_decisions:
- issue: Основание проявления милости ради патриархов
  choice: «если бы не Авраам, Исаак и Иаков... вы не получили бы милости»
  alternative: «если бы не ради Авраама, Исаака и Иакова... вам не было бы милости»
  rationale: 'Выбранный вариант сохраняет возможную смысловую широту δι᾽: патриархи представлены как основание или причина пощады, без уточнения конкретного богословского механизма.'
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Аппозиция «отцы наши» выделена запятыми; точка с запятой сохраняет тесную логическую связь двух следствий.
