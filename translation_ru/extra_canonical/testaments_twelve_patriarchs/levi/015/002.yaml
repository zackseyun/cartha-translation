base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015/002.yaml
  text: And you will be an abomination to them, and you will receive reproach and everlasting shame from the righteous judgment of God.
translation:
  language: ru
  text: И вы станете для них мерзостью, и примете поношение и вечный позор от праведного суда Божьего.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βδέλυγμα
  choice: мерзостью
  rationale: Передаёт сильное значение отвращения и сохраняет библейский регистр существительного.
- source_word: ὄνειδος
  choice: поношение
  rationale: Точно выражает публичное бесчестие и укор; слово понятно в современном литературном и библейском русском.
- source_word: αἰσχύνην αἰώνιον
  choice: вечный позор
  rationale: Естественная русская передача устойчивого сочетания со значением непреходящего бесчестия.
- source_word: δικαιοκρισίας
  choice: праведного суда
  rationale: Сохраняет составное значение справедливого, праведного судебного решения и соответствует контексту Божьего суда.
theological_decisions:
- issue: Источник поношения и позора при обороте παρὰ τῆς δικαιοκρισίας τοῦ Θεοῦ
  choice: «от праведного суда Божьего»
  alternative: «по праведному суду Божьему»
  rationale: Буквально сохраняет греческий предлог παρά с родительным и не устраняет возможный оттенок происхождения последствий от Божьего суда.
translation_notes:
  register: Современный литературный русский с достоинством библейского регистра. Синтаксический параллелизм греческого текста сохранён; «Божьего» выбрано как естественная современная форма без снижения стиля.
