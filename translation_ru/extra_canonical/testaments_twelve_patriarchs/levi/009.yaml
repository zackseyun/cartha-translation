  text: 'And after two days[a], I and Judah went up with our father Jacob to Isaac our grandfather. And the father of my father blessed me according to the visions that I had seen, and he was not willing to go with us to Bethel.


    And when we came to Bethel, my father Jacob saw a vision concerning me, that I would be a priest for them. And rising early in the morning, he gave a tenth of everything through me to the Lord.


    And so we came to Hebron to remain there. And Isaac kept calling me continually to remind me of the law of the Lord, just as the angel had shown me. And he taught me the law of the priesthood, of sacrifices, of whole burnt offerings, of firstfruits, of freewill offerings, and of peace offerings. And every day he kept instructing me in freewill offerings, and giving his attention to me he said:


    “Take heed to yourself from the spirit of sexual immorality[b], for this persists and is about to defile the holy things through your offspring. Therefore take for yourself a wife while you are still young, one having no blemish and not defiled, and not from the stock of foreign nations.


    And before you enter into the holy things, wash; and when you sacrifice in the presence of the Lord, wash your hands. And when you complete the sacrifice again, wash.


    And from twelve trees having leaves offer to the Lord, as Abraham taught me. And from every clean animal and bird offer a sacrifice to the Lord. And from all your first produce and wine offer firstfruits as a sacrifice to the Lord God[c][d]. And season every sacrifice with salt.”'
translation:
  language: ru
  text: '**Завещание Левия 9**


    1 Через два дня мы с Иудой вместе с нашим отцом Иаковом поднялись к Исааку, нашему праотцу. 2 Отец моего отца благословил меня сообразно видениям, которые я видел, но не пожелал идти с нами в Вефиль.


    3 Когда мы пришли в Вефиль, мой отец Иаков увидел обо мне видение: я стану для них священником. 4 Встав рано утром, он ради меня отдал Господу десятую часть всего.


    5 Так мы пришли в Хеврон, чтобы остаться там. 6 Исаак постоянно обращался ко мне, чтобы напоминать мне закон Господа, как показал мне ангел. 7 Он учил меня закону священства, жертв, всесожжений, начатков, добровольных приношений и мирных жертв.[a] 8 Каждый день он наставлял меня и, уделяя мне особое внимание, говорил:


    9 «Берегись духа разврата, ибо он неотступен[b] и через твоё потомство осквернит святыни. 10 Поэтому, пока ты ещё молод, возьми себе жену без порока, неосквернённую и не из рода иноплеменных народов.


    11 Прежде чем приступить к святыням, омойся; когда будешь приносить жертву — омойся; и, завершив жертвоприношение, снова омойся.[c]


    12 Приноси Господу от двенадцати деревьев, на которых есть листья,[d] как научил меня Авраам. 13 От всякого чистого животного и птицы приноси жертву Господу. 14 От всякого своего первенца и от вина приноси начатки в жертву Господу Богу. Всякую жертву посыпай солью».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Мирные жертвы» можно понимать шире — как жертвы, связанные с благополучием или избавлением.
    reason: lexical_alternative
  - marker: b
    text: 'Греческий текст в этом месте повреждён. Вероятный смысл выражения: дух разврата действует постоянно или упорно.'
    reason: textual_variant
  - marker: c
    text: Повторяемое повеление «омойся», вероятно, относится к ритуальному омовению, в том числе рук, при жертвоприношении; сам греческий текст здесь не называет часть тела.
    reason: cultural_note
  - marker: d
    text: Предписание о «двенадцати деревьях, на которых есть листья» неясно. Перевод следует греческой формулировке, не пытаясь восстановить неизвестный обряд.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεδεκάτωσε πάντα
  choice: отдал ... десятую часть всего
  rationale: Передаёт конкретное значение глагола — выделить и отдать десятую часть, — не прибегая к менее общеупотребительному «десятину дал».
- source_word: ἱερέα
  choice: священником
  rationale: Обычное и точное обозначение культового служителя в данном контексте.
- source_word: νόμον ἱερωσύνης
  choice: закону священства
  rationale: Сохраняет родительную конструкцию и торжественный наставительный характер текста.
- source_word: ὁλοκαυτωμάτων
  choice: всесожжений
  rationale: Устоявшийся русский культовый термин, сохраняющий смысл полного сожжения жертвы.
- source_word: ἀπαρχῶν
  choice: начатков
  rationale: Устоявшийся термин для приношения первой части урожая или произведённого продукта.
- source_word: ἑκουσίου
  choice: добровольных приношений
  rationale: Ясно передаёт добровольный характер этой категории жертв.
- source_word: σωτηρίου
  choice: мирных жертв
  rationale: Традиционное и узнаваемое обозначение соответствующей жертвенной категории; более широкий смысл благополучия или избавления отмечен в сноске.
- source_word: πρόσεχε σεαυτῷ
  choice: берегись
  rationale: Естественный современный русский императив, сохраняющий серьёзность патриархального предостережения.
- source_word: πνεύματος τῆς πορνείας
  choice: духа разврата
  rationale: Сохраняет персонифицированный духовный аспект выражения и ясно обозначает половую распущенность без архаической тяжеловесности.
- source_word: †ἐνδελεχῆ ἐστιν†
  choice: он неотступен
  rationale: Передаёт вероятный смысл постоянства или упорного действия, одновременно сохраняя осторожность ввиду повреждённого греческого чтения.
- source_word: μιαίνειν τὰ ἅγια
  choice: осквернит святыни
  rationale: Сохраняет культовую лексику нечистоты и конкретную связь с тем, что посвящено Богу.
- source_word: μὴ ἔχουσαν μῶμον
  choice: без порока
  rationale: Позволяет сохранить возможный нравственный и культово-телесный оттенок слова μῶμος, не сужая его до одного значения.
- source_word: λούου / νίπτου
  choice: омойся
  rationale: Греческие формы различаются, но в контексте обе обозначают ритуальное омовение; единый русский глагол сохраняет повтор наставления, не добавляя отсутствующего в тексте объекта.
- source_word: παντὸς πρωτογεννήματός σου
  choice: от всякого своего первоплода
  rationale: В сочетании с вином выражение естественно относится к первым плодам или первой продукции; «первоплод» сохраняет отличие от последующего ἀπαρχάς — «начатки».
theological_decisions:
- issue: Осквернение святынь через потомство Левия
  choice: Предостережение прямо связывает разврат с будущим осквернением святынь через потомков Левия.
  alternative: Общее нравственное предостережение без особой связи со священническим потомством.
  rationale: Греческий текст явно содержит διὰ τοῦ σπέρματός σου и τὰ ἅγια; наследственно-священническую направленность нельзя устранять обобщением.
- issue: Значение культового термина σωτηρίου
  choice: мирные жертвы
  alternative: жертвы благополучия; жертвы избавления
  rationale: Перечень указывает на техническую категорию жертв, но семантическая широта термина сохранена в примечании.
- issue: Что обозначает τὰ ἅγια в стихах 9 и 11
  choice: святыни
  alternative: святое место; священные предметы
  rationale: Обобщённое «святыни» сохраняет референциальную неоднозначность греческого множественного числа и не решает без достаточных оснований, идёт ли речь о месте, предметах или священной сфере в целом.
translation_notes:
  register: Современный литературный русский язык с dignified, наставительно-патриархальным звучанием. Культовые термины переданы узнаваемой библейской лексикой без излишней архаизации. Синтаксическая неоднозначность и текстуальная трудность не сглажены догматическими или реконструктивными добавлениями.
