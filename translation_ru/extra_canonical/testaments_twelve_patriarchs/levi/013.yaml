  text: '1[a]. And now, my children, I command you: fear the Lord your God with all your heart, and walk in simplicity according to all his law. 2. And you also, teach your children letters, so that they may have understanding throughout all their life, reading the law of God without ceasing. 3. For everyone who comes to know the law of the Lord will be honored, and he will not be a stranger wherever he goes. 4[b]. Indeed, he will gain many friends more than parents, and many among men will desire to serve him and to hear the law from his mouth. 5. Therefore do righteousness, my children, upon the earth, so that you may find it in the heavens. 6. And sow good things in your souls, and you will find them in your life. But if you sow evil things, you will reap every turmoil and affliction. 7. Acquire wisdom in the fear of God, because if captivity comes, and cities and lands are destroyed, and gold and silver and every possession perishes, no one can take away the wise man''s wisdom, except
    the blindness of ungodliness and the hardening of sin. 8. For if anyone keeps himself from these evil works, then wisdom will become for him splendid even among enemies, and in a foreign land a homeland, and in the midst of foes he will be found a friend. 9. Everyone who teaches good things and does them will share the throne of kings[c], just as Joseph my brother also did.'
translation:
  language: ru
  text: '1. И теперь, дети мои, заповедую вам: бойтесь Господа, Бога вашего, всем сердцем и ходите в простоте, во всём следуя Его Закону. 2. И вы обучайте своих детей грамоте, чтобы они всю жизнь обладали разумением, непрестанно читая Закон Божий. 3. Ведь всякий, кто познает Закон Господа, будет почитаем и, куда бы ни пришёл, нигде не окажется чужим. 4. Более того, он приобретёт множество друзей — больше, чем родителей[a], — и многие люди захотят служить ему и слушать Закон из его уст. 5. Итак, дети мои, творите праведность на земле, чтобы обрести её на небесах[b]. 6. Сейте доброе в своих душах — и найдёте его в своей жизни. Если же посеете злое, то пожнёте всякое смятение и скорбь. 7. Приобретайте мудрость в страхе Божьем. Ведь даже если наступит плен, будут разрушены города и земли, погибнут золото, серебро и всё имущество, никто не сможет отнять у мудрого его мудрость, кроме ослепления нечестия и ожесточения греха. 8. Если человек хранит себя от этих злых дел, тогда мудрость его будет
    блистательна даже среди врагов; чужая земля станет ему родиной, и среди недругов он окажется другом[c]. 9. Всякий, кто учит добру и сам творит его, будет восседать на престоле вместе с царями, как и Иосиф, брат мой.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое выражение буквально означает «приобретёт многих друзей больше родителей». Возможно, смысл в том, что круг друзей образованного человека будет шире семейного круга или что друзья дадут ему больше поддержки, чем положение его родителей.
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «творите праведность… чтобы найти [это] на небесах». После глагола «обрести» дополнение в греческом тексте не названо.'
    reason: alternative_reading
  - marker: c
    text: 'Греческая фраза предельно сжата: мудрость становится «блистательной среди врагов», чужая земля — «родиной», а сам человек среди врагов оказывается другом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁπλότης
  choice: простодушно
  rationale: Передаёт прямоту, цельность и отсутствие лукавства в поведении; русское слово здесь не означает интеллектуальной наивности.
- source_word: γράμματα
  choice: грамота
  rationale: В контексте последующего постоянного чтения Закона речь прежде всего идёт об обучении чтению и письму; «обучать грамоте» естественно по-русски.
- source_word: σύνεσις
  choice: разумение
  rationale: Сохраняет сочетание умственного понимания и нравственной рассудительности.
- source_word: ξένος
  choice: чужой
  rationale: Передаёт не только иностранное происхождение, но и положение постороннего, не принятого окружающими.
- source_word: δουλεῦσαι
  choice: служить
  rationale: В данном контексте обозначает добровольное служение почитаемому наставнику, а не обязательно рабство.
- source_word: δικαιοσύνη
  choice: праведность
  rationale: Сохраняет нравственно-религиозную силу слова и не сужает его до судебной справедливости.
- source_word: ψυχαῖς
  choice: души
  rationale: Сохраняет образ сеяния во внутреннем человеке.
- source_word: ταραχή
  choice: смятение
  rationale: Передаёт как внутреннее беспокойство, так и внешние потрясения и естественно сочетается со «скорбью».
- source_word: κτήσασθε
  choice: приобретайте
  rationale: Воспроизводит образ мудрости как драгоценного достояния, которое следует обрести.
- source_word: φόβῳ Θεοῦ
  choice: в страхе Божьем
  rationale: Сохраняет традиционную библейскую формулу без сведения её только к почтительности.
- source_word: πώρωσις
  choice: ожесточение
  rationale: Обычное русское библейское обозначение нравственной нечувствительности и упорства во грехе.
- source_word: παρὰ τοῖς πολεμίοις λαμπρά
  choice: будет блистательна даже среди врагов
  rationale: Сохраняет сжатый греческий образ мудрости, которая сияет и получает признание даже во враждебном окружении.
- source_word: σύνθρονος
  choice: будет восседать на престоле вместе с царями
  rationale: Передаёт буквальную идею совместного пребывания на престоле, то есть участия в царской чести.
theological_decisions:
- issue: Земная праведность и её обретение на небесах в ст. 5
  choice: «творите праведность на земле, чтобы обрести её на небесах»
  alternative: «чтобы обрести сокровище на небесах» или «чтобы самим быть найденными на небесах»
  rationale: После εὕρητε дополнение не выражено. Местоимение «её» связывает обретение с ранее названной праведностью, но примечание сохраняет грамматическую неоднозначность и не уточняет характер небесного воздаяния.
- issue: Исключение в утверждении о неотъемлемости мудрости в ст. 7
  choice: Только нравственно-духовное ослепление и ожесточение способны лишить мудрости
  alternative: Ослепление и ожесточение могут пониматься как внешне персонифицированные силы либо как позднее пояснение
  rationale: 'Греческий синтаксис представляет их как единственное исключение: внешние бедствия не отнимают мудрость, но нечестие и грех способны разрушить её изнутри.'
- issue: Обещание совместного престола с царями в ст. 9
  choice: Сохранён образ участия в царской чести без уточнения его земного или эсхатологического характера
  alternative: «будет равен царям» или «будет сидеть на престолах с царями»
  rationale: σύνθρονος выражает совместное восседание на престоле; упоминание Иосифа допускает историко-придворный смысл, поэтому перевод не навязывает исключительно эсхатологического толкования.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксис сделан ясным для чтения вслух, но ключевые библейские формулы («Закон Господа», «страх Божий», «творить праведность») сохранены. Метафорические и грамматически сжатые места не истолкованы конфессионально; существенная неоднозначность отмечена в сносках.
