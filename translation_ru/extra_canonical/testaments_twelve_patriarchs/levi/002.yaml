  text: 1[a]. I, Levi, was born in Haran, and I came with my father to Shechem. 2. And I was still young, about twenty years old, and then I carried out vengeance with Simeon for our sister Dinah against Hamor. 3[b]. And as I was shepherding in Abelmaul, a spirit of understanding from the Lord came upon me, and I saw all people destroying their way, and sin was being built upon a wall, and injustice sat upon towers. 4. And I was grieved over the race of the sons of men, and I prayed to the Lord that I might be saved. 5. Then sleep fell upon me, and I saw a high mountain, and I was on it. 6. And behold, the heavens were opened, and an angel of the Lord said to me, “Levi, Levi[c], enter.”
translation:
  language: ru
  text: '1. Я, Левий, родился в Харране и пришёл вместе с отцом в Сихем. 2. Я был ещё молод, лет двадцати, когда вместе с Симеоном совершил возмездие над Еммором за нашу сестру Дину. 3. Когда я пас стада в Авелмауле, на меня сошёл дух разумения от Господа, и я увидел всех людей, погубивших свой путь[a], а также грех, воздвигавшийся на стене, и неправду, восседавшую на башнях. 4. Я скорбел о роде сынов человеческих[b] и молился Господу, чтобы я спасся. 5. Тогда на меня пал сон, и я увидел высокую гору, а себя — на ней. 6. И вот, небеса отверзлись[c], и ангел Господень сказал мне: «Левий, Левий, войди».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «уничтоживших (или погубивших) свой путь»; «путь» здесь означает образ жизни и поведения.'
    reason: lexical_alternative
  - marker: b
    text: «Род сынов человеческих» — торжественный оборот в семитском стиле, обозначающий человеческий род.
    reason: cultural_note
  - marker: c
    text: Отверзшиеся небеса — характерный образ апокалиптических видений в библейской и древней иудейской литературе.
    reason: cross_reference
lexical_decisions:
- source_word: ἐποίησα τὴν ἐκδίκησιν
  choice: совершил возмездие
  rationale: Передаёт деятельное участие Левия в ответном насилии, сохраняя торжественную тяжесть выражения и не смягчая его до одного чувства мести.
- source_word: νεώτερος
  choice: был ещё молод
  rationale: В автобиографическом указании возраста естественно выражает относительную молодость Левия.
- source_word: πνεῦμα συνέσεως Κυρίου
  choice: от Господа дух разумения
  rationale: Неопределённая конструкция не превращена в позднейший титул; сохранены божественный источник и значение дарованного понимания.
- source_word: ἀφανίσαντας τὴν ὁδὸν αὐτῶν
  choice: губят свой путь
  rationale: Сохраняет сильное значение глагола «уничтожать, губить» и библейскую метафору пути как образа поведения.
- source_word: ἁμαρτία ... οἰκοδομεῖτο
  choice: грех воздвигается
  rationale: Сохранена архитектурная метафора пассивного построения; «воздвигается» естественно сочетается со стеной и высоким регистром видения.
- source_word: ἀδικία ἐκάθητο
  choice: неправда восседает
  rationale: Сохраняет олицетворение и статичный образ неправды, сидящей на башнях.
- source_word: γένος τῶν υἱῶν τῶν ἀνθρώπων
  choice: род сынов человеческих
  rationale: Передаёт торжественный семитизированный оборот, не сводя его к нейтральному «человечество».
- source_word: ὅπως σωθῶ
  choice: чтобы мне спастись
  rationale: Сохраняет широту смысла спасения или избавления без искусственного ограничения физической безопасностью.
- source_word: ἐπέπεσέ με ὕπνος
  choice: на меня напал сон
  rationale: Воспроизводит яркую исходную идиому, а не упрощает её до «я заснул».
- source_word: ἀνεῴχθησαν οἱ οὐρανοί
  choice: небеса отверзлись
  rationale: Сохраняет множественное число и возвышенную апокалиптическую образность.
theological_decisions:
- issue: Природа πνεῦμα συνέσεως
  choice: дух разумения от Господа, без прямого отождествления со Святым Духом как титулом
  alternative: Дух разумения; Святой Дух разумения
  rationale: Греческий текст указывает на божественное происхождение духа разумения, но не требует более поздней догматической конкретизации.
- issue: Смысл σωθῶ в молитве Левия
  choice: спастись
  alternative: быть избавленным; уцелеть
  rationale: Контекст допускает как избавление среди нравственного развращения, так и более широкое богословское значение; «спастись» сохраняет эту напряжённость.
- issue: Образ возмездия за Дину
  choice: сохранить прямое указание на совершённое возмездие без нравственного оправдания или осуждения со стороны переводчика
  alternative: отомстил; покарал
  rationale: Текст сообщает о насильственном поступке Левия; перевод не должен ни смягчать его, ни добавлять отсутствующую оценку.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, библейски узнаваемым регистром. Архаизирующие формы ограничены устойчивыми и прозрачными выражениями («ангел Господень», «небеса отверзлись», «восседает»). Все сноски закреплены непосредственно в основном тексте.
