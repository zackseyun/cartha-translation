review_pass:
  verdict: revise
  source_fidelity: 'В целом переданы содержание, собственные имена и образность. Однако в ст. 3 греческие формы ἀφανίσαντας (причастие совершенного вида) и οἰκοδομεῖτο (имперфект пассива) не поддерживают настоящее время «губят» / «воздвигается»: речь идёт о людях, уже погубивших свой путь, и о продолжающемся в видении возведении греха. В ст. 5 «пал на меня сон» точнее и естественнее передаёт ἐπέπεσέ με ὕπνος, чем «напал сон».'
  naturalness: Исправленный текст сохраняет современный литературный русский с умеренно возвышенным регистром. «Дух разумения от Господа» снимает несколько неестественный порядок слов исходного варианта; «чтобы я спасся» естественнее, чем инфинитивный оборот «чтобы мне спастись».
  terminology: '«Возмездие», «дух разумения», «грех», «неправда», «род сынов человеческих», «спасся», «ангел Господень» уместны и не навязывают конфессионального толкования. «Еммор», «Левий», «Симеон», «Дина», «Харран», «Сихем» сохранены. Название местности передано слитно: «Авелмаул», что ближе к единому греческому топониму Ἀβελμαούλ.'
  issues:
