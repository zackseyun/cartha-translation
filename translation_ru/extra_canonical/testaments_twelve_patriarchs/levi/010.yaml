base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010.yaml
  text: 1[v2]. And now, children, keep what I command you, since I have declared to you all that I heard from my fathers. 2[v2]. And behold, I am innocent of your ungodliness and transgression, which you will commit at the consummation of the ages [against the Savior of the world, the Messiah], misleading Israel and stirring up great evils from the Lord against him. 3. And you will act lawlessly in Israel, so that Jerusalem will not be able to bear it because of your wickedness; but the veil of the temple will be torn, so as no longer to cover your shame. 4. And you will be scattered as captives among the nations, and there you will be for reproach and for a curse. 5. For the house which the Lord will choose shall be called Jerusalem[v5][v3], as the book of Enoch the righteous contains.
translation:
  language: ru
  text: '1. И теперь, дети, соблюдайте всё, что я заповедую вам, потому что я возвестил вам всё, что слышал от своих отцов.


    2. И вот, я невиновен в вашем нечестии и преступлении, которое вы совершите при завершении веков [против Спасителя мира, Мессии][a], вводя Израиль в заблуждение и навлекая от Господа великие бедствия на него[b].


    3. И вы будете творить беззаконие в Израиле, так что Иерусалим не сможет вынести вашего нечестия; но завеса храма разорвётся и уже не будет скрывать ваш позор[c].


    4. Вас рассеют в плену среди народов, и там вы станете предметом поношения и проклятия.


    5. Ибо дом, который изберёт Господь, будет назван Иерусалимом, как гласит книга праведного Еноха[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «против Спасителя мира, Мессии» присутствуют в использованном здесь греческом свидетельстве, но многие исследователи считают их позднейшим христианским расширением; поэтому они сохранены в квадратных скобках.
    reason: textual_variant
  - marker: b
    text: Оборот «навлекая от Господа великие бедствия на него» синтаксически труден. К кому относится местоимение «него», можно понимать по-разному.
    reason: alternative_reading
  - marker: c
    text: 'Или: «занавес». Имеется в виду внутренняя завеса храма.'
    reason: lexical_alternative
  - marker: d
    text: Ссылка на Еноха отражает литературную среду эпохи Второго храма, когда авторитетные книги предков могли цитироваться и за пределами состава позднее сложившегося библейского канона.
    reason: cultural_note
lexical_decisions:
- source_word: φυλάξατε
  choice: соблюдайте
  rationale: В контексте заповедей передаёт не просто хранение, а послушное исполнение, сохраняя повелительную силу греческого глагола.
- source_word: ἐντέλλομαι
  choice: заповедую
  rationale: Соответствует торжественному завещательному наставлению Левия и естественно сочетается с «соблюдайте».
- source_word: ἀθῷός εἰμι
  choice: я невиновен
  rationale: Передаёт непричастность Левия к предсказанным грехам потомков.
- source_word: ἀσεβείας
  choice: нечестии
  rationale: Сохраняет религиозное измерение проступка, а не сводит его к общей безнравственности.
- source_word: παραβάσεως
  choice: преступлении
  rationale: Передаёт нарушение установленной границы или заповеди; в единственном числе соответствует форме источника.
- source_word: συντέλεια τῶν αἰώνων
  choice: завершении веков
  rationale: Сохраняет апокалиптическое звучание и идею достижения веками своей полноты, не сводя выражение к разговорному «концу времён».
- source_word: σωτῆρα
  choice: Спасителя
  rationale: Прямо передаёт весомый титул σωτήρ.
- source_word: χριστόν
  choice: Мессии
  rationale: Передаёт титульное значение «Помазанник» и его иудейский контекст, не превращая титул в личное имя.
- source_word: πλανῶντες
  choice: вводя Израиль в заблуждение
  rationale: Естественно выражает причиняемое общине уклонение с верного пути.
- source_word: ἐπεγείροντες
  choice: навлекая
  rationale: 'В данном контексте передаёт причинительное значение: поступки адресатов вызывают или навлекают грядущие бедствия.'
- source_word: κακὰ μεγάλα
  choice: великие бедствия
  rationale: Контекст указывает на губительные кары или несчастья; «бедствия» естественно по-русски передаёт смысл, не ослабляя пророческой суровости.
- source_word: ἀνομήσετε
  choice: будете творить беззаконие
  rationale: Сохраняет активный и продолжающийся характер нарушения закона.
- source_word: καταπέτασμα
  choice: завеса
  rationale: Традиционное и точное обозначение внутренней храмовой завесы; возможное «занавес» отмечено в сноске.
- source_word: εἰς ὄνειδος καὶ εἰς κατάραν
  choice: предметом поношения и проклятия
  rationale: Идиоматично по-русски передаёт состояние, выраженное двумя конструкциями εἰς.
- source_word: περιέχει ἡ βίβλος
  choice: как гласит книга
  rationale: Естественно передаёт смысл «как содержит/сообщает книга», не утверждая дословной цитаты.
theological_decisions:
- issue: Заключённые в скобки слова о «Спасителе мира, Мессии»
  choice: Сохранены в основном тексте в квадратных скобках с текстологической сноской.
  alternative: Опустить как позднейшую христианскую вставку либо напечатать без скобок как бесспорно первоначальный текст.
  rationale: Предоставленный греческий свидетель содержит эти слова, однако их нередко считают вторичным христианским расширением. Скобки сохраняют свидетельство рукописной формы текста и одновременно обозначают сомнение в первоначальности.
- issue: Смысл выражения «навлекая на него великие бедствия от Господа»
  choice: Сохранено трудное место с местоимением «на него» и пояснено в сноске.
  alternative: Истолковать местоимение как относящееся исключительно к Израилю, Мессии либо самим нарушителям и соответственно перефразировать.
  rationale: Греческий синтаксис и референт местоимения допускают разные толкования; перевод не должен устранять эту неоднозначность.
- issue: Разрыв храмовой завесы
  choice: Передан как пророческий образ суда и обнажения позора без дополнительного истолкования.
  alternative: Прямо связать строку с евангельским рассказом о страстях либо истолковать её исключительно символически.
  rationale: Сам греческий текст говорит о разрыве завесы, после которого она не скрывает позора; конфессионально обусловленное объяснение в строку не внесено.
- issue: Ссылка на книгу Еноха
  choice: Сохранена как ссылка на почитаемый древний авторитетный текст.
  alternative: Представить её как ссылку на часть позднейшего библейского канона или, напротив, обесценить как неавторитетную легенду.
  rationale: Перевод отражает литературную среду эпохи Второго храма, не навязывая более позднего канонического суждения.
translation_notes:
  register: Современный литературный русский язык с торжественным завещательным и пророческим звучанием. Синтаксис сделан понятным для широкого читателя, но апокалиптическая лексика, повторения и подлинная неоднозначность греческого текста сохранены.
