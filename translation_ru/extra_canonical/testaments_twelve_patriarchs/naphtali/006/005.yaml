  text: And we, being storm-tossed on the sea, were being driven over the waters, and the ship was filled and battered in the storms, so that it was in danger of breaking apart.
translation:
  language: ru
  text: А нас, застигнутых бурей в открытом море, носило по волнам; корабль наполнился водой, и волны били его со всех сторон, так что он грозил разбиться.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χειμαζόμενοι
  choice: застигнутых бурей
  rationale: Причастие передаёт состояние людей, терпящих бедствие от бури; русская формулировка естественна и сохраняет страдательный оттенок.
- source_word: ἐπὶ τὸ πέλαγος
  choice: в открытом море
  rationale: πέλαγος обозначает морской простор, открытое море; выбран естественный русский оборот.
- source_word: ἐφερόμεθα
  choice: носило по волнам
  rationale: Имперфект выражает продолжительное невольное движение под действием стихии. Упоминание волн контекстуально передаёт водную поверхность, не превращая глагол в добровольное плавание.
- source_word: ἐπληρώθη τὸ πλοῖον ὑδάτων
  choice: корабль наполнился водой
  rationale: Прямо воспроизводит образ заполнения корабля водой; единственное число естественно для русского языка.
- source_word: ἐν τρικυμίαις περιρησσόμενον
  choice: бури били его со всех сторон
  rationale: περιρήσσω передаёт удары или сокрушительное воздействие вокруг, а τρικυμίαι — сильные бури и волнение моря. Формулировка сохраняет интенсивность образа без неестественной буквальности.
- source_word: ὥστε καὶ συντρίβεσθαι αὐτό
  choice: так что он едва не развалился
  rationale: Передаёт результат, близкий к разрушению судна, не утверждая однозначно, что корабль уже распался.
