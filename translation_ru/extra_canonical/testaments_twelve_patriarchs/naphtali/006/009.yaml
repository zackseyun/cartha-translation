source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 9. Ὡς δὲ ἐπαύσατο ὁ χειμών, *ἔφθασε τὸ σκάφος ἐπὶ τῆς γῆς⁴⁶, Γὥσπερ⁴⁷ ἐν εἰρήνῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/009.yaml
  text: And when the winter ceased, the ship came to the land, as it were in peace.
translation:
  language: ru
  text: Когда же зима миновала, судно достигло земли, словно в мире.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «как будто в покое»; греч. «словно в мире».'
    reason: εἰρήνη буквально означает «мир», но в данном образном обороте может также передавать оттенок покоя или безопасности; это не указание на «мирное время».
lexical_decisions:
- source_word: χειμών
  choice: зима
  rationale: Основное значение слова — «зима»; оно сохранено вслед за прямым смыслом греческого текста, хотя в некоторых контекстах слово может обозначать зимнюю непогоду или бурю.
- source_word: ἔφθασε τὸ σκάφος ἐπὶ τῆς γῆς
  choice: судно достигло земли
  rationale: Передаёт прибытие судна к земле естественным современным русским выражением, не уточняя, пристало ли оно к берегу или оказалось на суше.
- source_word: ὥσπερ ἐν εἰρήνῃ
  choice: словно в мирное время
  rationale: Сохраняет сравнительную и несколько необычную формулировку оригинала, не превращая «мир» в описание внутреннего спокойствия.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествовательная фраза сохранена краткой и торжественно-нейтральной. «Судно» соответствует σκάφος и звучит естественнее, чем уменьшительное «лодка».
