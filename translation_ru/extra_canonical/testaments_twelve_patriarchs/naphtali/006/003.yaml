  text: And our father said to us, “Come, let us go up into our ship.”
translation:
  language: ru
  text: 'И наш отец сказал нам: «Пойдём, поднимемся на наш корабль».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῦτε ἀνέλθωμεν
  choice: Пойдём, поднимемся
  rationale: Сохраняет побуждение «пойдём» и выраженное глаголом ἀναβαίνω движение на корабль; по-русски сочетание звучит естественно и передаёт оба элемента греческой фразы.
- source_word: εἰς τὸ πλοῖον ἡμῶν
  choice: на наш корабль
  rationale: Русское «подняться на корабль» естественно передаёт направление εἰς и морское судно πλοῖον, сохраняя притяжательное «наш».
- source_word: ὁ πατὴρ ἡμῶν
  choice: наш отец
  rationale: Прямое и естественное соответствие греческому выражению без добавочной интерпретации.
