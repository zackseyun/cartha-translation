  text: And we were scattered, all of us, to the ends of the earth[c].
translation:
  language: ru
  text: И все мы были рассеяны до краёв земли[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Рассеяние «до краёв земли», вероятно, символизирует рассеяние по разным странам, хотя в тексте оно представлено как часть сна Неффалима.
    reason: cross_reference
lexical_decisions:
- source_word: διεσπάρημεν
  choice: были рассеяны
  rationale: Пассивная форма точно передаёт греческий аорист и сохраняет неуказанным того, кто совершил рассеяние.
- source_word: πάντες
  choice: все мы
  rationale: Естественно по-русски подчёркивает полноту группы, выраженную греческим πάντες.
- source_word: εἰς τὰ πέρατα τῆς γῆς
  choice: до краёв земли
  rationale: Сохраняет пространственный образ исходного текста и его возможную символическую силу, не сводя выражение только к значению «повсюду».
theological_decisions:
- issue: Характер рассеяния в повествовании о сне
  choice: Сохранён буквальный образ «до краёв земли» без пояснения внутри стиха.
  alternative: Передать как «по всей земле», явно истолковав образ как всеобщее рассеяние.
  rationale: Греческий текст допускает как пространственное, так и символическое восприятие; примечание отмечает возможную символику, не устраняя повествовательную форму сна.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и естественная формулировка. Порядок слов слегка адаптирован ради русской плавности, при этом усиление «все» и образ краёв земли сохранены.
