  text: And when we had entered, a violent storm arose, and a whirlwind of wind; and our father withdrew from us, holding the rudders[b].
translation:
  language: ru
  text: Когда же мы вошли, разразилась сильная буря и поднялся мощный вихрь; а наш отец удалился от нас, держа рули[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение, переведённое как «держа рули», текстуально неясно: употреблённое здесь слово обычно буквально означает «шеи», однако контекст, по-видимому, связан с управлением судном.'
    reason: textual_variant
lexical_decisions:
- source_word: χειμὼν σφοδρός
  choice: сильная буря
  rationale: В данном морском контексте χειμών обозначает бурю, а σφοδρός передаёт её силу; сочетание естественно звучит по-русски.
- source_word: λαῖλαψ ἀνέμου μέγας
  choice: мощный вихрь
  rationale: Передаёт образ сильного вихревого ветра без неестественного для современного русского языка сочетания «вихрь ветра».
- source_word: ἀφίσταται ἀφʼ ἡμῶν
  choice: удалился от нас
  rationale: Сохраняет пространственный смысл отделения или отхода, не усиливая его до намеренного оставления.
- source_word: ὁ κρατῶν τοὺς αὐχένας
  choice: державший рули
  rationale: Хотя αὐχένες обычно означает «шеи», морской контекст указывает на элементы управления судном; текстовая трудность открыто отмечена в сноске.
