base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/002.yaml
  text: 'And behold, a ship was coming, sailing beside us, with sailors and pilots. And on the ship was written this: “Jacob’s ship.”'
translation:
  language: ru
  text: 'И вот, шёл корабль под парусом, без моряков и кормчих. На корабле же было написано: «Корабль Иакова».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρχετο
  choice: приближался
  rationale: Передаёт имперфект как продолжающееся движение корабля в сторону наблюдателя.
- source_word: ἁρμενίζον
  choice: шедший под парусом
  rationale: Естественное русское морское выражение, точно передающее плавание под парусом.
- source_word: ἐκτὸς ναυτῶν καὶ κυβερνητῶν
  choice: без моряков и кормчих
  rationale: 'Следует печатному греческому тексту: ἐκτός с родительным падежом означает отсутствие; κυβερνήτης здесь — управляющий судном кормчий.'
- source_word: ἐπεγέγραπτο
  choice: было написано
  rationale: Передаёт состояние, возникшее в результате нанесения надписи на корабль.
- source_word: πλοῖον Ἰακώβ
  choice: Корабль Иакова
  rationale: Сохраняет краткую форму надписи без добавления отсутствующего в греческом тексте артикля или пояснения.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным повествовательным оборотом «И вот». Перевод следует представленному греческому тексту, а не английскому консультационному слою в месте, где тот передаёт противоположный смысл («с моряками» вместо греческого «без моряков»).
