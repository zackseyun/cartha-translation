revisions:
- from: 'И вот, приближался корабль, шедший под парусом без моряков и кормчих. На корабле же было написано: «Корабль Иакова».'
  to: 'И вот, шёл корабль под парусом, без моряков и кормчих. На корабле же было написано: «Корабль Иакова».'
  rationale: 'Внесена минимальная правка: «приближался» заменено на «шёл», чтобы не добавлять невыраженное в греческом указание на приближение к наблюдателю. Остальные элементы сохранены: отсутствие экипажа передаётся согласно греческому ἐκτὸς ναυτῶν καὶ κυβερνητῶν, независимо от расходящегося английского audit trail.'
