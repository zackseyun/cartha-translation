base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/006.yaml
  text: But Joseph went away on a small boat, and we were separated on nine planks; and Levi and Judah were together.
translation:
  language: ru
  text: Иосиф же отплыл на небольшой лодке, а мы разделились, оказавшись на девяти досках; Левий же и Иуда были вместе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκάτιον
  choice: небольшая лодка
  rationale: Уменьшительная форма обозначает малое судно или лодку; нейтральное современное выражение сохраняет смысл без излишней технической конкретизации.
- source_word: ἐπορεύθη
  choice: отплыл
  rationale: В морском контексте естественно передаёт движение Иосифа на лодке.
- source_word: διεχωρίσθημεν
  choice: мы разделились, оказавшись
  rationale: Сохраняет пассивно-результативный смысл разъединения группы и естественно связывает его с распределением по доскам.
- source_word: σανίδων ἐννέα
  choice: на девяти досках
  rationale: Формально передаёт конкретный образ исходного текста, не уточняя, были ли это обломки судна, плоты или отдельные доски.
- source_word: ἐπὶ τὸ αὐτό
  choice: были вместе
  rationale: Обычное значение выражения в данном контексте — совместное пребывание в одном месте.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; повествование краткое и ясное. Повтор частицы δέ передан сочетанием «же» и союзом «а», чтобы сохранить смену участников, не перегружая фразу.
