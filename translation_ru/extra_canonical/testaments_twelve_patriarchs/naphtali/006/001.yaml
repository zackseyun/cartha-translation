lexical_decisions:
- source_word: πάλιν
  choice: снова
  rationale: Естественно передаёт повторность видения.
- source_word: μετὰ ἡμέρας ἑπτά
  choice: через семь дней
  rationale: Идиоматично передаёт временной промежуток в современном русском языке.
- source_word: ἐν τῇ θαλάσσῃ Ἀμνείας
  choice: у моря Амнии
  rationale: Предлог ἐν при обозначении местоположения естественно передан как «у»; греческое название сохранено без попытки отождествить место.
- source_word: ἡμεῖς σὺν αὐτῷ
  choice: мы были с ним
  rationale: Глагол-связка, подразумеваемый в греческом, выражен явно для естественности русского текста.
