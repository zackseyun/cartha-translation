  language: ru
  text: И вот, пришёл наш отец, и все мы единодушно возрадовались.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: и вот
  rationale: Сохраняет повествовательный сигнал, привлекающий внимание к наступлению события.
- source_word: ὁ πατὴρ ἡμῶν
  choice: наш отец
  rationale: Прямая и естественная передача греческого выражения без добавления имени или пояснения.
- source_word: πάντες ὁμοθυμαδόν
  choice: все мы единодушно
  rationale: Передаёт как всеобщность, так и совместность, согласие участников; местоимение «мы» естественно следует из формы глагола.
- source_word: ἠγαλλιασάμεθα
  choice: возрадовались
  rationale: Передаёт сильную, торжественную радость аористной формы и соответствует достойному литературному регистру.
theological_decisions:
- issue: Дополнительная фраза из истории редакций
  choice: Не включать «Он умолял нас»
  alternative: Добавить «Он умолял нас» вслед за последней английской редакцией
  rationale: В предоставленном греческом тексте такой фразы нет; перевод следует исходному свидетельству и не восполняет его по ошибочной редакционной заметке.
translation_notes:
