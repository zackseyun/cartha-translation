  - severity: low
    issue: В ст. 3 выражение исполнения распоряжений несколько ослаблено.
    rationale: «Поступили так, как заповедал» допустимо, но «исполнили всё, что заповедал» яснее передаёт ποιέω и полноту κατὰ πάντα ὅσα.
  - severity: low
