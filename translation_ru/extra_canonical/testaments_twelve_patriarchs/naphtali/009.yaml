  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/009.yaml
  text: 'And after commanding them many such things[[Here begins ...]], he urged them to carry his bones to Hebron and bury him with his fathers.


    2. And after eating and drinking with gladness of soul, he covered his face and died.


    3. And his sons did in every respect all that Naphtali their father had commanded them.


    [Here begins the Testament of Gad, the ninth son of Jacob and Zilpah.]'
translation:
  language: ru
  text: '1. Дав им много таких повелений, он настоятельно попросил их перенести его кости в Хеврон и похоронить его вместе с его отцами.


    2. Поев и выпив в радости души, он накрыл своё лицо и умер.


    3. И его сыновья во всём исполнили всё, что заповедал им их отец Неффалим.


    [Здесь начинается «Завещание Гада, девятого сына Иакова и Зелфы».][a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В используемом греческом тексте вслед за этой главой помещён зачин следующего произведения: «Завещание Гада, девятого сына Иакова и Зелфы». Здесь он сохранён как переходная редакционная строка, а не как часть последних слов Неффалима.'
    reason: textual_variant
lexical_decisions:
- source_word: ἐντειλάμενος
  choice: дав им ... повелений
  rationale: Передаёт обязательный характер последних распоряжений Неффалима, сохраняя при этом естественный для современного русского языка завещательный тон.
- source_word: παρεκάλεσεν
  choice: настоятельно попросил
  rationale: Сочетает значение личной просьбы с настойчивостью увещания; это естественнее по-русски, чем книжное «увещевал», и не превращает просьбу о погребении в сухой приказ.
- source_word: μετακομίσωσι τὰ ὀστᾶ αὐτοῦ
  choice: перенести его кости
  rationale: Сохраняет конкретное обозначение костей и выражает перемещение останков к месту погребения без неоправданного смягчения до общего слова «останки».
- source_word: ἐν Χεβρών
  choice: в Хеврон
  rationale: При глаголе движения русское «в Хеврон» естественно передаёт направительное значение предложной конструкции.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: вместе с его отцами
  rationale: Сохраняет древний семейно-погребальный оборот и патриархальный регистр, не заменяя «отцов» более широким словом «предки».
- source_word: ἐν ἱλαρότητι ψυχῆς
  choice: в радости души
  rationale: Передаёт внутреннюю светлую радость и сохраняет возвышенную лексику исходной фразы.
- source_word: συνεκάλυψε τὸ πρόσωπον αὐτοῦ
  choice: накрыл своё лицо
  rationale: 'Близко передаёт конкретное действие: Неффалим покрыл лицо; возвратное местоимение естественно для русского при совпадении деятеля и обладателя.'
- source_word: κατὰ πάντα ὅσα ἐνετείλατο
  choice: во всём поступили так, как заповедал
  rationale: Естественно выражает полноту исполнения всех данных распоряжений, избегая тяжеловесного буквального повтора «во всём всё».
- source_word: Νεφθαλείμ
  choice: Неффалим
  rationale: Использована традиционная русская библейская форма имени.
theological_decisions:
- issue: Статус заключительной строки, вводящей следующее завещание
  choice: Сохранить её в квадратных скобках как паратекстуальный переход и снабдить примечанием.
  alternative: Опустить её как заголовок следующего произведения либо напечатать без скобок как часть повествования.
  rationale: Строка не является последними словами Неффалима, но в консультационном слое засвидетельствована как переход к следующему сочинению. Скобки и примечание прозрачно отличают её от текста главы, не приписывая ей богословского значения.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательно-патриархального повествования. Конкретные образы исходного текста («кости», «отцы», «радость души», покрытое лицо) сохранены; синтаксис умеренно сглажен ради ясности без устранения смысловых оттенков.
