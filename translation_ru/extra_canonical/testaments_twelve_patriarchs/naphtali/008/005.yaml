  text: As when someone has reared a child well, he has a good remembrance of him, so also for a good work there is a good remembrance before God.
translation:
  language: ru
  text: Как у того, кто хорошо воспитал ребёнка, остаётся о нём добрая память, так и о добром деле у Бога остаётся добрая память.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκθρέψῃ καλῶς
  choice: хорошо воспитал
  rationale: Передаёт завершённое и успешное взращивание ребёнка естественным современным русским выражением.
- source_word: μνείαν ἔχει καλήν
  choice: оставляет по себе добрую память
  rationale: Сохраняет смысл доброй памяти о воспитавшем человеке и делает подразумеваемое отношение ясным по-русски.
- source_word: ἐπὶ τοῦ καλοῦ ἔργου
  choice: доброе дело
  rationale: Естественно передаёт предмет сравнения без добавления конфессиональной окраски.
- source_word: μνήμη παρὰ Θεοῦ ἀγαθή
  choice: хранится в благой памяти у Бога
  rationale: Сохраняет образ памяти и двусмысленность παρὰ Θεοῦ, которая может указывать на память у Бога или на исходящее от Бога благоприятное поминание.
theological_decisions:
- issue: Характер Божьей памяти о добром деле
  choice: доброе дело хранится в благой памяти у Бога
  alternative: Бог благосклонно помнит доброе дело
  rationale: Выбранная формулировка не превращает образ памяти в более определённое утверждение о награде или заслуге и сохраняет богословскую сдержанность греческого текста.
translation_notes:
  register: Современный литературный русский; достоинство и параллелизм исходного сравнения сохранены. Формулировка доступна обычному читателю и не вводит отсутствующих в греческом тексте доктринальных уточнений.
