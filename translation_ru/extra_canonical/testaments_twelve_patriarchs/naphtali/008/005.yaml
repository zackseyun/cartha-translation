revisions:
- from: Как тот, кто хорошо воспитал ребёнка, оставляет по себе добрую память, так и доброе дело хранится в благой памяти у Бога.
  to: Как у того, кто хорошо воспитал ребёнка, остаётся о нём добрая память, так и о добром деле у Бога остаётся добрая память.
  rationale: Исправлено направление отношения в первом сравнении и устранён добавленный образ «хранения» во втором. Формула «у Бога» сохраняет допустимую сдержанность παρὰ Θεοῦ, а параллельное «остаётся ... добрая память» передаёт повтор μνεία/μνήμη.
  reviewer_model: gpt-5.6-terra
