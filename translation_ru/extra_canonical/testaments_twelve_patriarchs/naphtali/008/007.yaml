  text: For the commandments of the law are twofold, and they are fulfilled with skill.
translation:
  language: ru
  text: Ибо заповеди Закона двояки и исполняются с умением.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Ибо и
  rationale: Сохраняет как пояснительную связь γάρ, так и добавочное значение καί.
- source_word: αἱ ἐντολαὶ τοῦ νόμου
  choice: заповеди Закона
  rationale: Прямо передаёт греческое словосочетание; прописная буква указывает на Закон как религиозно-нравственный корпус, не добавляя конфессиональной конкретизации.
- source_word: διπλαῖ
  choice: двойственны
  rationale: Передаёт буквальное значение «двойные, двоякие», сохраняя неуточнённость того, в каком именно смысле заповеди имеют две стороны.
- source_word: μετὰ τέχνης
  choice: с искусностью
  rationale: Сохраняет значение умелого, искусного совершения, не сужая τέχνη до ремесла или хитрости.
- source_word: πληροῦνται
  choice: исполняются
  rationale: Естественный русский эквивалент применительно к заповедям; медиально-пассивная форма исходного текста сохранена.
theological_decisions:
- issue: Смысл двойственности заповедей
  choice: Оставить формулировку «двойственны» без пояснения.
  alternative: «имеют две стороны» или уточнение двух видов исполнения
  rationale: Греческий текст не раскрывает здесь природу двойственности; конкретизация устранила бы подлинную неоднозначность.
- issue: Характер исполнения заповедей
  choice: «исполняются с искусностью»
  alternative: «исполняются умело»
  rationale: Существительное лучше сохраняет выразительность конструкции μετὰ τέχνης и возможный оттенок искусства или мастерства, не превращая её в чисто практическую оценку.
translation_notes:
  register: Современный литературный русский с кратким, афористичным синтаксисом. Формулировка намеренно сохраняет смысловую напряжённость между двойственностью Закона и искусностью его исполнения.
