base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/002.yaml
  text: And now, behold, command your children that they be united with Levi and with Judah. For through Judah salvation will arise for Israel, and in him Jacob will be blessed.
translation:
  language: ru
  text: Итак, и вы заповедайте своим детям быть едиными с Левием и Иудой. Ибо через Иуду взойдёт спасение для Израиля, и в нём благословится Иаков.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ὑμεῖς Γοὖν
  choice: Итак, и вы
  rationale: Передаёт выводное значение οὖν и сохраняет обращение к слушателям; частица, отражённая в английском как behold, в представленном греческом тексте явно не засвидетельствована.
- source_word: ἐντείλασθε
  choice: заповедайте
  rationale: Императив передан прямым и торжественным глаголом, естественным для завещательного наставления.
- source_word: ἵνα ἑνοῦνται
  choice: быть едиными
  rationale: Сохраняет значение единения и устойчивого союза, не сужая его до простого согласия или физического соединения.
- source_word: ἀνατελεῖ
  choice: взойдёт
  rationale: Сохраняет образ восхода или появления, присутствующий в греческом глаголе, вместо нейтрального «явится».
- source_word: ἡ σωτηρία
  choice: спасение
  rationale: Прямое соответствие, сохраняющее как избавительный, так и богословский потенциал слова.
- source_word: ἐν αὐτῷ εὐλογηθήσεται
  choice: в нём благословится
  rationale: Сохраняет местоименную неоднозначность и пассивную форму, не уточняя без достаточных оснований, относится ли местоимение к Иуде как лицу, колену или иному подразумеваемому референту.
theological_decisions:
- issue: Посредство Иуды в явлении спасения
  choice: через Иуду взойдёт спасение
  alternative: от Иуды произойдёт спасение
  rationale: Формулировка следует διὰ и сохраняет образ ἀνατελεῖ, не добавляя конкретной мессианской идентификации, которой стих прямо не формулирует.
- issue: Референт местоимения αὐτῷ
  choice: в нём
  alternative: в Иуде
  rationale: Местоимение в источнике допускает смысловую напряжённость; явное повторение имени устранило бы её и навязало толкование.
translation_notes:
  register: Современный литературный русский с умеренно торжественным библейским звучанием. Синтаксис сделан ясным для широкого читателя, при этом сохранены образ «восхода» спасения и неоднозначность местоимения.
