base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/003.yaml
  text: Through his scepter God will appear on the earth, dwelling among men, to save the people of Israel, and he will gather the righteous from among the nations.
translation:
  language: ru
  text: Посредством его скипетра Бог явится на земле, обитая среди людей[a], чтобы спасти народ Израиля, и соберёт праведников из народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «обитая среди людей» в греческом тексте заключены издателем в квадратные скобки, что указывает на текстологическую неуверенность.
    reason: Необходимо обозначить отмеченную в исходном издании сомнительность этих слов, не исключая их из основного текста.
lexical_decisions:
- source_word: Διὰ τοῦ σκήπτρου αὐτοῦ
  choice: Через его скипетр
  rationale: Сохраняет инструментальное значение διά с родительным падежом и образ «скипетра», не уточняя, к кому относится местоимение «его», поскольку сам стих этого не разъясняет.
- source_word: ὀφθήσεται
  choice: явится
  rationale: Естественно передаёт будущее пассивной формы ὁράω в значении «станет видимым, явится».
- source_word: κατοικῶν ἐν ἀνθρώποις
  choice: обитая среди людей
  rationale: Причастный оборот отнесён к Богу и передан без превращения его в отдельное законченное утверждение.
- source_word: τὸ γένος τοῦ Ἰσραήλ
  choice: народ Израиля
  rationale: В данном контексте γένος обозначает род или народ Израиля; «народ» звучит естественно и не вносит современного расового оттенка.
- source_word: ἐπισυνάξει δικαίους ἐκ τῶν ἐθνῶν
  choice: соберёт праведников из народов
  rationale: Сохраняет значение собирания и конструкцию ἐκ, допускающую понимание праведников как происходящих из разных народов.
theological_decisions:
- issue: Отнесение причастия κατοικῶν
  choice: «обитая» грамматически относится к Богу
  alternative: Понять оборот как самостоятельное утверждение либо отнести его к иному подразумеваемому лицу
  rationale: Именительный падеж мужского рода естественно согласуется с ὁ Θεός; перевод не развивает это в более определённую христологическую формулу.
- issue: Значение «его» в выражении «его скипетр»
  choice: Сохранено местоимение без пояснения референта
  alternative: Назвать владельца скипетра по контексту
  rationale: В предоставленном греческом стихе референт αὐτοῦ не назван, поэтому его не следует догматически уточнять.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской лексикой. Синтаксис остаётся близким к греческому, но читается естественно; местоименная и богословская неоднозначность не устранена.
