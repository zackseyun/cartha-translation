source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: VIII. Καὶ¹ ἰδού², τέκνα μου³, ὑπέδειξα ὑμῖν καιροὺς ἐσχάτους †ὅτι⁴ πάντα γενήσεται ἐν Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/001.yaml
  text: And behold, my children, I have shown you the times, that all will happen in Israel.
translation:
  language: ru
  text: И вот, дети мои, я указал вам на последние времена — всё произойдёт в Израиле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст в этом месте не вполне ясен; буквально: «я указал вам последние времена, что (или: потому что) всё произойдёт в Израиле».'
    reason: Издательский знак † указывает на текстуальную трудность, а союз ὅτι допускает более одного понимания.
lexical_decisions:
- source_word: ὑπέδειξα
  choice: указал вам на
  rationale: Глагол означает «показать, указать, дать понять»; выбран естественный русский оборот, сохраняющий направленность наставления.
- source_word: καιροὺς ἐσχάτους
  choice: последние времена
  rationale: Передаёт эсхатологически окрашенное выражение буквально и привычно для русской библейской речи.
- source_word: πάντα
  choice: всё
  rationale: Сохраняет неопределённую полноту греческого слова и не добавляет отсутствующее в источнике «это».
- source_word: ἐν Ἰσραήλ
  choice: в Израиле
  rationale: Прямое соответствие греческому выражению без уточнения, означает ли «Израиль» народ или землю.
theological_decisions:
- issue: Связь последних времён с происходящим в Израиле
  choice: Сохранена формулировка «всё произойдёт в Израиле» без конкретизации.
  alternative: Уточнить «с народом Израиля» или «в земле Израиля».
  rationale: Греческое ἐν Ἰσραήλ допускает понимание Израиля как народа или как сферы/места событий; перевод не должен устранять эту неоднозначность.
- issue: Синтаксическая роль ὅτι
  choice: Связь предложений передана тире, без однозначного перевода союза.
  alternative: «потому что», «что» или «когда».
  rationale: Текст в данном месте отмечен издателем как сомнительный, а греческая конструкция допускает разные способы понимания; тире сохраняет смысловую связь, не навязывая конкретного толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Обращение «дети мои» и вводное «И вот» сохранены; синтаксис упрощён лишь настолько, чтобы фраза звучала естественно, при этом текстуальная неясность отмечена сноской.
