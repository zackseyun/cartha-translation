base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/010.yaml
  text: Therefore become wise in God, my children, and prudent, perceiving the order of his commandments and the ordinances of every matter, so that the Lord may love you.
translation:
  language: ru
  text: Итак, дети мои, становитесь мудрыми в Боге и благоразумными, постигая порядок Его заповедей и установления, относящиеся ко всякому делу, чтобы Господь любил вас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σοφοὶ ἐν θεῷ
  choice: мудрыми в Боге
  rationale: Сохраняет необычную, но значимую предложную конструкцию оригинала и не сводит её однозначно к «мудрыми перед Богом» или «мудрыми благодаря Богу».
- source_word: φρόνιμοι
  choice: благоразумными
  rationale: Передаёт практическую рассудительность в отличие от более общего σοφοί — «мудрыми».
- source_word: ἰδόντες
  choice: постигая
  rationale: В данном контексте причастие от «видеть» обозначает осмысленное распознавание; «постигая» естественно связывается с мудростью и благоразумием.
- source_word: τάξιν ἐντολῶν αὐτοῦ
  choice: порядок Его заповедей
  rationale: Формально передаёт τάξιν и родительную конструкцию, не уточняя без основания, означает ли это строй, последовательность или установленный порядок.
- source_word: θεσμοὺς παντὸς πράγματος
  choice: установления, относящиеся ко всякому делу
  rationale: θεσμοί передано как нормативные «установления»; добавленная связка «относящиеся» делает неоднозначную родительную конструкцию понятной по-русски, не превращая её в явно целевое «для каждого дела».
- source_word: ὅπως ἀγαπήσει ὑμᾶς ὁ Κύριος
  choice: чтобы Господь любил вас
  rationale: Естественно передаёт целевую конструкцию ὅπως с будущим временем, сохраняя её прямую богословскую напряжённость.
theological_decisions:
- issue: Связь человеческого послушания с любовью Господа
  choice: «чтобы Господь любил вас»
  alternative: «и тогда Господь будет любить вас» / «чтобы вы были угодны Господу»
  rationale: Греческий текст прямо говорит ἀγαπήσει ὑμᾶς — «полюбит/будет любить вас». Перевод не смягчает условно-целевую связь и не заменяет любовь понятием благоволения или угодности.
- issue: Значение ἐν θεῷ
  choice: «в Боге»
  alternative: «пред Богом» / «с Божьей помощью»
  rationale: Буквальная форма сохраняет возможные оттенки сферы, отношения и источника мудрости, не выбирая один из них без достаточных оснований.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным завещательным тоном. Обращение «дети мои» вынесено ближе к началу для естественного русского порядка слов; синтаксический параллелизм «мудрыми… и благоразумными» сохранён.
