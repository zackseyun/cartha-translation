base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/004.yaml
  text: Therefore, if you also do what is good, people and angels will bless you, and God will be glorified among the nations through you, and the devil will flee from you, and the wild beasts will fear you, and the Lord will love you, and the angels will stand by you.
translation:
  language: ru
  text: Итак, если и вы будете делать добро, люди и ангелы благословят вас, Бог будет прославлен среди народов через вас, дьявол убежит от вас, дикие звери будут бояться вас, Господь полюбит вас, и ангелы поддержат вас.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Заключительные слова «и ангелы поддержат вас» в греческом издании отмечены как текстуально не вполне уверенные.
    reason: В исходном тексте эта фраза заключена в квадратные скобки; примечание сохраняет свидетельство издания, не исключая чтение из основного текста.
lexical_decisions:
- source_word: ἐργάσησθε τὸ καλόν
  choice: будете делать добро
  rationale: Естественно передаёт совершение доброго на деле, сохраняя условную конструкцию.
- source_word: οἱ ἄνθρωποι
  choice: люди
  rationale: Современное нейтральное соответствие, не сужающее значение до мужчин.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: среди народов
  rationale: Сохраняет множественное число и публично-межэтнический смысл выражения.
- source_word: τὰ θηρία
  choice: дикие звери
  rationale: Передаёт значение животных вне человеческого обихода и звучит естественно по-русски.
- source_word: ἀνθέξονται ὑμῶν
  choice: поддержат вас
  rationale: Глагол ἀντέχομαι с родительным может означать держаться за кого-либо, быть преданным ему или оказывать поддержку; «поддержат вас» естественно выражает контекстуальный смысл без излишней конкретизации.
theological_decisions:
- issue: Связь Божьего прославления с поступками адресатов
  choice: Бог будет прославлен среди народов через вас
  alternative: Бог прославит Себя среди народов посредством вас
  rationale: Сохранён пассив δοξασθήσεται и не добавлено явное указание на действующего, которого греческий текст не называет.
- issue: Смысл обещания ὁ Κύριος ἀγαπήσει ὑμᾶς
  choice: Господь полюбит вас
  alternative: Господь будет любить вас
  rationale: Будущее время передано прямо, без богословского сглаживания возможного условного оттенка в связи с предшествующим «если».
- issue: Текстуальная неустойчивость заключительной фразы
  choice: Фраза включена в основной текст с примечанием
  alternative: Опустить фразу или заключить её в скобки
  rationale: Она присутствует в предоставленном тексте и в консультационном английском переводе, но квадратные скобки источника указывают на текстуальную неуверенность, которую следует обозначить читателю.
translation_notes:
  register: Современный литературный русский язык с ясным, достоинственным назидательным звучанием. Цепочка будущих следствий сохранена, синтаксис слегка упорядочен для естественного русского чтения.
