  text: 9. Καὶ *αἱ δύο τοῦ Θεοῦ εἰσι⁵⁵, καὶ εἰ μὴ ἐγένοντο⁵⁶ ἐν τῇ⁵⁷ τάξει αὐτῶν ἁμαρτίαν *μεγίστην παρεῖχον τοῖς ἀνθρώποις· τὸ αὐτὸ⁵⁸ καὶ *ἐπὶ τῶν λοιπῶν ἐντολῶν⁵⁹ ἐστι⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/009.yaml
  text: And both are from God, and if they do not occur in their proper order, they bring very great sin upon men. The same is true also of the rest of the commandments.
translation:
  language: ru
  text: 9. И обе — от Бога; но если они происходят не в установленном для них порядке, то приводят людей к величайшему греху. То же относится и к остальным заповедям.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἱ δύο
  choice: обе
  rationale: Сохранены женский род и отсылка к двум упомянутым ранее реалиям; более конкретное обозначение не добавляется, поскольку его нет в данном стихе.
- source_word: ἐν τῇ τάξει αὐτῶν
  choice: в должном порядке
  rationale: Передаёт идею установленного для них надлежащего порядка естественным современным русским языком.
- source_word: ἁμαρτίαν μεγίστην παρεῖχον τοῖς ἀνθρώποις
  choice: навлекают на людей величайший грех
  rationale: Сохраняет сильную степень μεγίστην и причинно-негативный смысл παρεῖχον, не уточняя сверх текста, кто именно совершает грех.
- source_word: ἐπὶ τῶν λοιπῶν ἐντολῶν
  choice: к остальным заповедям
  rationale: Русское «то же относится к» идиоматично передаёт τὸ αὐτὸ ... ἐπὶ и сохраняет прямое упоминание прочих заповедей.
theological_decisions:
- issue: Происхождение обеих реалий от Бога и необходимость их надлежащего порядка
  choice: И обе — от Бога; но если они совершаются не в должном порядке
  alternative: И обе принадлежат Богу, и если они не возникают в установленном для них порядке
  rationale: 'Формулировка сохраняет утверждение греческого текста и его внутреннее напряжение: божественное происхождение само по себе не исключает греховного последствия при нарушении порядка. Союз «но» делает подразумеваемое противопоставление естественным по-русски, не разрешая его богословски.'
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис умеренно формальный; неоднозначная отсылка «обе» сохранена, а отсутствующий контекст не восполнен догадкой.
