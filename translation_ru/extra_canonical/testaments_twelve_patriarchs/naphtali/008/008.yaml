  text: 8. Καιρὸς γὰρ συνουσίας⁵¹ γυναικός⁵², καὶ καιρὸς ἐγκρατείας⁵³ εἰς προσευχὴν αὐτοῦ⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/008.yaml
  text: For there is a time for a man to come together with a woman, and a time for self-control for his prayer.
translation:
  language: ru
  text: Ибо есть время для близости с женщиной и время для воздержания ради молитвы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνουσίας γυναικός
  choice: супружеской близости
  rationale: Выражение обозначает интимное соединение с женщиной; в данном контексте естественная и достойная русская передача — «супружеская близость», без излишней буквальности.
- source_word: ἐγκρατείας
  choice: воздержания
  rationale: Здесь слово указывает на самоограничение, конкретно на временное половое воздержание ради молитвы; «воздержание» точнее контекстуального «самообладание».
- source_word: εἰς προσευχὴν αὐτοῦ
  choice: ради молитвы
  rationale: εἰς выражает цель; притяжательное αὐτοῦ в естественном русском не требуется, поскольку субъект ясен из контекста.
theological_decisions:
- issue: Соотношение супружеской близости и молитвенного воздержания
  choice: Сохранено утверждение о надлежащем времени как для близости, так и для воздержания ради молитвы.
  alternative: Передать стих как общее противопоставление половой жизни и аскетического самообладания.
  rationale: Греческий текст говорит о разных временах и связывает воздержание с молитвой, не объявляя супружескую близость нечистой и не устанавливая постоянного аскетизма.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмически уравновешенная формулировка. Слово «супружеской» слегка конкретизирует подразумеваемый нравственный контекст, сохраняя достоинство выражения.
