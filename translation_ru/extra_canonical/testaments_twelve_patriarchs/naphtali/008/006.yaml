source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 6. Τὸν δὲ μὴ *ποιοῦντα τὸ³⁸ καλόν, καταράσονται αὐτὸν³⁹ καὶ⁴⁰ *οἱ ἄγγελοι καὶ οἱ ἄνθρωποι⁴¹, *καὶ ὁ Θεὸς ἀδοξήσει ἐν τοῖς ἔθνεσιν διʼ αὐτοῦ⁴², *καὶ ὁ⁴³ διάβολος οἰκειοῦται *αὐτὸν ὡς ἴδιον σκεῦος⁴⁴, καὶ πᾶν θηρίον κατακυριεύσει αὐτῷ⁴⁵, καὶ⁴⁶ ὁ Κύριος μισήσει αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/006.yaml
  text: But the one who does not do good, angels and men will curse him, and God will be dishonored among the nations through him, and the devil claims him as his own vessel, and every wild beast will lord it over him, and the Lord will hate him.
translation:
  language: ru
  text: А того, кто не делает добра, проклянут и ангелы, и люди; и Бог будет обесчещен среди народов из-за него; и дьявол присваивает его себе как собственный сосуд; и всякий дикий зверь будет господствовать над ним; и Господь возненавидит его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν δὲ μὴ ποιοῦντα τὸ καλόν
  choice: А того, кто не делает добра
  rationale: Передаёт субстантивированное причастие и τὸ καλόν естественным современным русским оборотом без добавочного истолкования.
- source_word: καταράσονται
  choice: проклянут
  rationale: Будущее время и прямое значение глагола сохранены.
- source_word: ἀδοξήσει
  choice: будет обесчещен
  rationale: 'Контекст требует пассивного смысла: Бог лишается чести в глазах народов из-за поведения человека.'
- source_word: οἰκειοῦται αὐτὸν
  choice: присвоит его себе
  rationale: Передаёт идею обращения кого-либо в свою собственность; русское будущее согласует ряд предсказанных последствий.
- source_word: ὡς ἴδιον σκεῦος
  choice: как собственный сосуд
  rationale: Сохраняет предметную метафору σκεῦος и её возможный смысл орудия, не подменяя образ толкованием.
- source_word: πᾶν θηρίον κατακυριεύσει αὐτῷ
  choice: всякий дикий зверь будет господствовать над ним
  rationale: θηρίον обозначает дикого зверя, а κατακυριεύω — властное господство; необычное управление в греческом передано нормативно по-русски.
- source_word: μισήσει
  choice: возненавидит
  rationale: Точно сохраняет сильное значение глагола и форму будущего времени.
theological_decisions:
- issue: Божье бесчестие среди народов
  choice: Бог будет обесчещен среди народов из-за него
  alternative: Бог лишится славы среди народов через него
  rationale: Выбранная формулировка естественно выражает репутационный смысл ἀδοξήσει и не предполагает, будто Божья слава сущностно уменьшается.
- issue: Отношение Господа к творящему зло
  choice: Господь возненавидит его
  alternative: Господь отвергнет его
  rationale: Сохранено прямое и богословски напряжённое μισήσει; смягчение до «отвергнет» было бы интерпретацией.
translation_notes:
  register: Современный литературный русский язык с dignified библейским звучанием. Повтор союзов «и» сохранён как заметная риторическая цепь греческого текста; синтаксис разделён точками с запятой для ясности.
