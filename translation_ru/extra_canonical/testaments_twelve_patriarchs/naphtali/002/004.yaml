  text: 4. Καὶ καθὼς²⁵ οἶδεν²⁶ ὁ κεραμεὺς ἑνὸς ἑκάστου τὴν χρῆσιν †ὡς²⁷ ἱκανή²⁸, οὕτω²⁹ καὶ ὁ Κύριος οἶδε τὸ σῶμα, ἕως τίνος διαρκέσει ἐν *τῷ ἀγαθῷ³⁰, καὶ πότε ἔρχεται³¹ *ἐν κακῷ³².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/004.yaml
  text: And just as the potter knows the use of each one, as it is fit, so also the Lord knows the body, how long it will endure in good, and when it comes into evil.
translation:
  language: ru
  text: 'И как горшечник знает назначение каждого — какое ему подходит, — так и Господь знает тело: сколько оно продержится в добре и когда придёт ко злу.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение, переданное словами «какое ему подходит», текстуально затруднено; возможен более буквальный, но неясный перевод: «назначение каждого, как [оно] достаточно/подобает». Заключительные слова также могут быть переданы: «как долго оно продержится в добре и когда приходит во зле».'
    reason: Отмечает действительную трудность греческой фразы ὡς ἱκανή и сохраняет сжатую неоднозначность ἐν κακῷ, не заявляя о неподтверждённой текстуальной неясности всего окончания.
lexical_decisions:
- source_word: κεραμεύς
  choice: горшечник
  rationale: Прямой и естественный русский эквивалент, сохраняющий образ мастера, работающего с глиной.
- source_word: ἑνὸς ἑκάστου τὴν χρῆσιν
  choice: назначение каждого
  rationale: Сохраняет отсутствие выраженного существительного после «каждого» в греческом тексте и передаёт χρῆσις как предназначение или применение.
- source_word: ὡς ἱκανή
  choice: для чего тот пригоден
  rationale: Греческое чтение текстуально затруднено; перевод естественно передаёт смысл пригодности, не добавляя конкретного предмета вроде «сосуда».
- source_word: διαρκέσει ἐν τῷ ἀγαθῷ
  choice: пребудет в добре
  rationale: Передаёт длительность διαρκέσει и сохраняет абстрактное ἀγαθόν без уточняющего богословского истолкования.
- source_word: ἔρχεται ἐν κακῷ
  choice: придёт ко злу
  rationale: Сохраняет динамический глагол «приходить» и смысловое противопоставление добру; предлог передан идиоматично по-русски.
theological_decisions:
- issue: Отношение тела к добру и злу
  choice: Сохранить формулировку о теле, пребывающем в добре и приходящем ко злу
  alternative: Истолковать это как нравственное поведение человека или телесное состояние
  rationale: Исходный текст выражается сжато и неоднозначно; перевод не должен заранее решать, идёт ли речь о нравственном уклонении, состоянии тела или более широком человеческом опыте.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Синтаксис сохраняет параллель «как… так и…»; тире поясняет трудное греческое выражение, не вводя отсутствующее в оригинале слово «сосуд».
