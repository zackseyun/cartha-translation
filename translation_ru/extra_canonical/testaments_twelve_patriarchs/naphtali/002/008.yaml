source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 8. *Πάντα ⌜γὰρ⌝⁶⁰ ἐν τάξει ἐποίησεν ὁ Θεὸς καλά· τὰς πέντε αἰσθήσεις ἐν τῇ κεφαλῇ *καὶ τὸν τράχηλον συνάψας τῇ κεφαλῇ⁶¹, *προσθεὶς αὐτῇ καὶ τρίχας εἰς εὐπρέπειαν καὶ δόξαν⁶², εἶτα⁶³ καρδίαν *εἰς φρόνησιν⁶⁴, κοιλίαν εἰς †διάκρισιν⁶⁵, *στόμαχον εἰς †ἀλεσμόν⁶⁶, †κάλαμον⁶⁷ πρὸς †ὑγείαν⁶⁸, ἧπαρ⁶⁹ πρὸς θυμόν, χολὴν πρὸς πικρίαν, ⌜καὶ⌝⁷⁰ *σπλῆνα πρὸς γέλωτα⁷¹, νεφροὺς ⌜εἰς πανουργίαν⁷², ψύας⁷³⌝ εἰς δύναμιν, *†πλευρὰν εἰς τὸ καθεύδειν†⁷⁴, ὀσφὺν⁷⁵ εἰς ἰσχύν, καὶ τὰ ἑξῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/008.yaml
  text: 'For God made all things good in their order: the five senses in the head, and he joined the neck to the head; and he added hair for beauty, and the heart for understanding, the belly for excrement, the stomach for grinding, the windpipe for taking in air, the liver for anger, the gall for bitterness, the spleen for laughter, the kidneys for craftiness, the loins for strength, and the lungs for drawing in; and so the rest.'
translation:
  language: ru
  text: 'Ведь Бог всё устроил хорошо и в должном порядке: пять чувств поместил в голове, шею соединил с головой и добавил голове волосы для красоты и славы; затем дал сердце для разумения, живот — для различения[a], желудок — для перемалывания, дыхательное горло — для здоровья[b], печень — для гнева, желчь — для горечи, селезёнку — для смеха, почки — для изворотливости, поясничные мышцы — для силы, бок — для сна[c], поясницу — для крепости и так далее.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «живот — для различения (или распознавания)». Греческое чтение в этом месте сомнительно; в других текстовых свидетельствах смысл связывается с выведением нечистот.'
    reason: В издании слово διάκρισιν отмечено как проблемное, а консультационный английский текст отражает иной смысл; основной текст сохраняет засвидетельствованный греческий вариант.
  - marker: b
    text: 'Буквально: «трубку — для здоровья». Вероятно, имеется в виду дыхательное горло, однако и название органа, и обозначение его функции в греческом тексте не вполне надёжны.'
    reason: Оба слова в издании отмечены как сомнительные; требуется сохранить текстовую и анатомическую неопределённость.
  - marker: c
    text: 'Греческий текст буквально читается: «бок (или ребро) — для сна», но всё выражение повреждено. Возможно, первоначально здесь упоминались лёгкие и втягивание воздуха.'
    reason: Издание отмечает весь оборот как испорченный, тогда как английский консультационный слой следует реконструкции «лёгкие — для втягивания [воздуха]».
lexical_decisions:
- source_word: ἐν τάξει ... καλά
  choice: хорошо и в должном порядке
  rationale: Передаёт и оценку καλά («хорошо, прекрасно»), и упорядоченность ἐν τάξει, не превращая фразу в отвлечённое учение о творении.
- source_word: εὐπρέπεια καὶ δόξα
  choice: красота и великолепие
  rationale: 'Сохраняет два близких, но не тождественных понятия: благовидность и славное великолепие внешнего вида.'
- source_word: φρόνησις
  choice: разумение
  rationale: Обозначает практический разум и рассудительность; «разумение» естественно связывается с сердцем в древней антропологии.
- source_word: στόμαχος ... ἀλεσμός
  choice: желудок — для перемалывания
  rationale: Сохраняет конкретную метафору измельчения пищи.
- source_word: κάλαμος
  choice: дыхательное горло
  rationale: Буквально «трубка, трость»; в анатомическом перечне вероятнее всего обозначает дыхательное горло, то есть трахею.
- source_word: θυμός
  choice: гнев
  rationale: В связи с печенью слово обозначает вспыльчивый гнев; более широкое «дух/пыл» здесь менее ясно.
- source_word: πανουργία
  choice: изворотливость
  rationale: Сохраняет неоднозначную отрицательно окрашенную идею хитрости или лукавой находчивости, не усиливая её до «злодейства».
- source_word: ψύαι
  choice: поясничные мышцы
  rationale: Анатомический термин обозначает поясничные мышцы; это точнее общего «чресла» и отличает их от следующего ὀσφύς.
- source_word: ὀσφύς
  choice: поясница
  rationale: Передаёт область поясницы/чресел и не смешивает её с предшествующими поясничными мышцами.
theological_decisions:
- issue: Оценка Божьего устройства творения
  choice: «Бог всё устроил хорошо и в должном порядке»
  alternative: «Бог сотворил всё прекрасным по порядку»
  rationale: Формулировка сохраняет утверждение о благости и упорядоченности Божьего дела, не вводя дополнительного догматического смысла и не утверждая временную последовательность там, где речь может идти об устройстве.
- issue: Древние соответствия органов душевным свойствам
  choice: Передать соответствия буквально
  alternative: Объяснить их как символические или заменить современными физиологическими функциями
  rationale: Текст излагает древнюю антропологию без пояснения её статуса; перевод не должен ни утверждать её как современную медицину, ни устранять присущую тексту связь телесного и душевного.
translation_notes:
  register: 'Современный литературный русский с достоинством древнего наставительного текста. Эллиптический греческий перечень раскрыт повторяемой конструкцией «для», но его ритм сохранён. Сомнительные места не исправлены молча по английскому слою: засвидетельствованный греческий текст оставлен в основном переводе, а вероятные альтернативы вынесены в примечания.'
