source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 3. Καὶ¹⁸ οὐκ *ἔστιν ἐνλεῖπον¹⁹ *ἐκ τοῦ ἑνὸς²⁰ *τρίτου τριχός²¹· *σταθμῷ γὰρ καὶ μέτρῳ²² καὶ κανόνι πᾶσα Γἡ¹²³ *κτίσις ἐγένετο²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/003.yaml
  text: And there is no deficiency in it, not even by a third of a hair; for by weight and measure and rule every creation was made.
translation:
  language: ru
  text: И в нём нет недостатка ни на треть волоса, ибо всё творение возникло по весу, мере и правилу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνλεῖπον
  choice: недостатка
  rationale: Передаёт отсутствие какой-либо недостачи или отклонения от полноты; по смыслу подразумевается ранее названный предмет мужского рода («в нём»).
- source_word: ἐκ τοῦ ἑνὸς τρίτου τριχός
  choice: даже на треть волоса
  rationale: Сохраняет необычную греческую меру предельно малого отклонения, не заменяя её более привычным русским оборотом.
- source_word: σταθμῷ καὶ μέτρῳ καὶ κανόνι
  choice: по весу, мере и правилу
  rationale: 'Воспроизводит трёхчленную формулу: σταθμός — вес или взвешивание, μέτρον — мера, κανών — правило, образец либо норма.'
- source_word: πᾶσα ἡ κτίσις
  choice: всякое творение
  rationale: Передаёт собирательный смысл всего сотворённого, сохраняя соотнесённость каждого элемента творения с названным порядком.
- source_word: ἐγένετο
  choice: возникло
  rationale: Отражает значение «стало, появилось, произошло» и не усиливает глагол до прямого «было сотворено», поскольку творческий субъект здесь не выражен.
theological_decisions:
- issue: Способ возникновения творения
  choice: «возникло по весу, мере и правилу»
  alternative: «было создано по весу, мере и правилу»
  rationale: Греческое ἐγένετο буквально обозначает становление или возникновение. Выбранный вариант не устраняет возможный подразумеваемый акт творения, но и не вводит в глагол отсутствующий в форме пассив «было создано».
- issue: Значение κανών
  choice: «правило»
  alternative: «образец» или «мерило»
  rationale: «Правило» сохраняет идею установленной нормы и не сужает слово исключительно до пространственного измерительного инструмента.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной буквальностью. Сохранён афористический ритм исходной фразы и её необычный образ «треть волоса»; богословские уточнения, отсутствующие в греческом тексте, не добавлялись.
