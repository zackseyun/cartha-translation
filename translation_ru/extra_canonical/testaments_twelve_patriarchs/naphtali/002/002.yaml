revisions:
- from: Ибо как горшечник знает, сколько вмещает сосуд, и сообразно с этим берёт для него глину, так и Господь создаёт тело сообразно с подобием духа и сообразно с возможностями тела помещает в него дух.
  to: Ибо как горшечник знает, сколько вмещает сосуд, и сообразно с этим приносит для него глину, так и Господь создаёт тело сообразно с подобием духа и сообразно со способностью тела помещает в него дух.
  rationale: 'Исправлены два небольших расхождения с греческим: действие φέρει передано как «приносит», а единственное число δύναμιν сохранено в выражении «со способностью тела». Синтаксический параллелизм и богословская неопределённость исходника сохранены.'
  reviewer_model: gpt-5.6-terra
