source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Καθὼς⁹ γὰρ *οἶδεν ὁ κεραμεὺς¹⁰ τὸ σκεῦος πόσον χωρεῖ, καὶ πρὸς αὐτὸ¹¹ φέρει τὸν¹² πηλόν, οὕτω¹³ καὶ ὁ Κύριος πρὸς ὁμοίωσιν τοῦ πνεύματος¹⁴ ποιεῖ¹⁵ τὸ σῶμα, καὶ πρὸς τὴν δύναμιν τοῦ σώματος¹⁶ *τὸ πνεῦμα ἐπιτίθησιν¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/002.yaml
  text: For just as the potter knows how much the vessel can hold, and according to that brings the clay for it, so also the Lord, according to the likeness of the spirit, makes the body, and according to the body's capacity places the spirit in it.
translation:
  language: ru
  text: Ибо как горшечник знает, сколько вмещает сосуд, и сообразно с этим приносит для него глину, так и Господь создаёт тело сообразно с подобием духа и сообразно со способностью тела помещает в него дух.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κεραμεύς
  choice: горшечник
  rationale: Прямой и естественный русский эквивалент, сохраняющий образ мастера, изготовляющего сосуд.
- source_word: πόσον χωρεῖ
  choice: сколько вмещает
  rationale: Передаёт меру вместимости сосуда без добавления отсутствующего в греческом дополнения.
- source_word: πρὸς αὐτὸ φέρει τὸν πηλόν
  choice: сообразно с этим берёт для него глину
  rationale: πρὸς αὐτό передано как соотнесение с вместимостью сосуда; местоимение «него» относится к сосуду. «Берёт» звучит по-русски естественнее буквального «приносит» в описании работы горшечника.
- source_word: πρὸς ὁμοίωσιν τοῦ πνεύματος
  choice: сообразно с подобием духа
  rationale: Сохраняет необычную и неоднозначную формулировку источника, не подменяя «подобие» более толковательным понятием вроде «образ» или «свойство».
- source_word: πρὸς τὴν δύναμιν τοῦ σώματος
  choice: сообразно с возможностями тела
  rationale: δύναμις здесь обозначает силу или способность тела; множественное «возможностями» естественно передаёт совокупную способность тела, не сводя смысл только к физической силе.
- source_word: τὸ πνεῦμα ἐπιτίθησιν
  choice: помещает в него дух
  rationale: Контекстуально передаёт вложение или возложение духа применительно к телу; сохраняет нейтральное «дух» без уточнения его природы.
theological_decisions:
- issue: Соотношение духа и тела при творении
  choice: 'Сохранена двусторонняя формулировка: тело создаётся сообразно с подобием духа, а дух помещается сообразно с возможностями тела.'
  alternative: Истолковать текст как утверждение первенства духа либо как учение о заранее определённой вместимости тела.
  rationale: Греческий текст удерживает оба соотнесения и не объясняет их систематически; перевод не должен устранять это напряжение.
- issue: Значение πνεῦμα
  choice: дух
  alternative: душа
  rationale: Обычный прямой эквивалент πνεῦμα; замена на «душа» внесла бы антропологическое разграничение, которого данная формулировка явно не устанавливает.
translation_notes:
  register: Современный литературный русский язык с достойным, слегка возвышенным библейским ритмом. Повтор «сообразно с» сохранён ради параллелизма греческой фразы; архаизмы и конфессионально окрашенные уточнения исключены.
