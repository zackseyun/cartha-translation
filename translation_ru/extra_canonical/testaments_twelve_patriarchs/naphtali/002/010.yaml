id: T12P.NAP.2.10
reference: Testament of Naphtali 2:10
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 10. *Ὅτι ἐὰν εἴπῃς τῷ ὀφθαλμῷ, Ἄκουε, οὐ δυνήσεται⁸²· οὕτως οὐδὲ *ἐν σκότει⁸³ *ὄντες δύνασθε ποιεῖν⁸⁴ ἔργα⁸⁵ φωτός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/010.yaml
  text: For if you say to the eye, “Hear,” it cannot; so neither, being in darkness, can you do the works of light.
translation:
  language: ru
  text: 'Ведь если ты скажешь глазу: «Слушай», — он не сможет; так и вы, находясь во тьме, не можете совершать дела света.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφθαλμῷ
  choice: глазу
  rationale: Прямой и естественный эквивалент, сохраняющий образ противопоставления органов чувств.
- source_word: Ἄκουε
  choice: Слушай
  rationale: Императив настоящего времени передан обычной русской повелительной формой.
- source_word: ἐν σκότει ὄντες
  choice: находясь во тьме
  rationale: Причастная конструкция передана деепричастным оборотом без уточнения, является ли тьма нравственной или духовной.
- source_word: ποιεῖν ἔργα φωτός
  choice: совершать дела света
  rationale: Сохраняются библейская метафора и лексическая связь между действием, делами и светом.
theological_decisions:
- issue: Значение образов тьмы и света
  choice: Сохранить метафоры без поясняющих добавлений
  alternative: Передать как «живя во зле, творить добро»
  rationale: Греческий текст оставляет образ богословски ёмким; конкретизация неоправданно сузила бы его смысл.
- issue: Модальность δύνασθε
  choice: «не можете»
  alternative: «не способны»
  rationale: Форма обозначает невозможность или неспособность; нейтральное «не можете» сохраняет напряжение текста, не определяя её источник.
translation_notes:
  register: Современный литературный русский язык с краткой, dignified афористичной структурой. Единственное число в первой части и множественное во второй сохранены по греческому тексту.
