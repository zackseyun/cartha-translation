translation_notes:
  register: Современный литературный русский с достоинством древнего завещательного повествования. Имена приведены преимущественно в узнаваемых русских библейских формах; синтаксис упрощён лишь там, где буквальное воспроизведение было бы тяжеловесным или неясным.
