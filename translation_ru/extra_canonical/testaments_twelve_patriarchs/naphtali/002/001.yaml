  text: My mother Bilhah was the daughter of Rotheus, the brother of Deborah, the nurse of Rebecca; she was born on the same day as Rachel. 10 And Rotheus was of the lineage of Abraham, a Chaldean, God-fearing, freeborn and noble. 11 And having been taken captive, he was bought by Laban; and Laban gave him his maidservant Eunan as a wife, and she bore a daughter, and he called her name Zelpha, after the name of the city in which he had been taken captive. 12 And after this she bore Bilhah, saying, ‘My daughter is one who renews.’ II. I was swift on my feet like a deer, and my father Jacob appointed me for every errand; and he indeed blessed me as a deer.
translation:
  language: ru
  text: 'Моя мать Валла была дочерью Руфея, брата Деворы, кормилицы Ревекки; Девора родилась в один день с Рахилью. 10 Руфей происходил из рода Авраама; он был халдеем, богобоязненным, свободнорождённым и знатным. 11 Попав в плен, он был куплен Лаваном; Лаван дал ему в жёны свою служанку Еунан. Она родила дочь, и он назвал её Зелфой — по имени города, в котором был взят в плен. 12 После этого она родила Валлу, сказав: «Моя дочь — обновительница».[a]


    2:1 Я был быстроног, как олень, и мой отец Иаков назначил меня исполнять всякое поручение; он и благословил меня, уподобив оленю.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «Моя дочь всё обновляет». Греческое выражение необычно, и точный смысл возгласа не вполне ясен.'
    reason: Сохраняется лексическая и синтаксическая неоднозначность Καινοποιός μου ἡ θυγάτηρ.
  - marker: b
    text: 'Буквально: «благословил меня как оленя».'
    reason: Показывает форму сравнения в греческом тексте, которую основной перевод передаёт более естественно по-русски.
lexical_decisions:
- source_word: Βάλλα
  choice: Валла
  rationale: Традиционная русская библейская форма имени Билхи (Быт. 29:29), уместная для узнаваемости персонажа.
- source_word: Ῥουθαῖος
  choice: Руфей
  rationale: Русская передача греческого имени с учётом традиционной передачи θ через «ф» в библейских именах.
- source_word: ἐλεύθερος καὶ εὐγενής
  choice: свободнорождённым и знатным
  rationale: В контексте пленения ἐλεύθερος обозначает свободный статус по рождению, а εὐγενής — благородное, знатное происхождение.
- source_word: Καινοποιός
  choice: обновительница
  rationale: Сохраняет необычное именное определение со значением того, кто делает новым или обновляет.
- source_word: κοῦφος τοῖς ποσίν
  choice: быстроног
  rationale: Естественная русская передача буквального «лёгок ногами», выражающая проворство.
- source_word: εἰς πᾶσαν ἀγγελίαν
  choice: исполнять всякое поручение
  rationale: ἀγγελία здесь обозначает посыльную службу или поручение, а не отвлечённую «весть».
- source_word: ὡσεὶ ἔλαφόν με ηὐλόγησεν
  choice: благословил меня, уподобив оленю
  rationale: Передаёт сравнительное ὡσεὶ и избегает неестественного русского «благословил меня как оленя».
