source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 7. Καὶ ὡς⁵³ κεχώρισται ἀνάμεσον *τοῦ φωτὸς καὶ ἀνάμεσον τοῦ σκότους⁵⁴ *δράσεώς τε καὶ ἀκοῆς⁵⁵, οὕτως⁵⁶ κεχώρισται ἀνάμεσον ἀνδρὸς καὶ *ἀνδρός, καὶ ἀνάμεσον γυναικὸς καὶ⁵⁷ γυναικός⁵⁸, καὶ οὐκ ἔστιν εἰπεῖν ὅτι †*ἐν τῷ ἑνὶ τοῖς προσώποις ἡττόμενον ἦν †⁵⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/007.yaml
  text: And just as there is a division between light and darkness, and between sight and hearing, so there is also a division between man and man, and between woman and woman; and it is not possible to say that in appearance one is inferior to another.
translation:
  language: ru
  text: И как существует различие между светом и тьмой и между зрением и слухом, так существует различие между мужчиной и мужчиной и между женщиной и женщиной; и нельзя сказать, что по внешности один уступает другому.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст заключительной части стиха повреждён и допускает иные варианты понимания; перевод передаёт наиболее вероятный смысл.
    reason: В издании заключительная фраза отмечена как текстуально сомнительная, а её синтаксис нерегулярен.
lexical_decisions:
- source_word: κεχώρισται
  choice: существует различие
  rationale: Греческая форма выражает состояние разделённости или различия; этот вариант естественно звучит по-русски и сохраняет повторяющуюся структуру стиха.
- source_word: δράσεώς τε καὶ ἀκοῆς
  choice: между зрением и слухом
  rationale: δρᾶσις здесь обозначает способность видеть, а ἀκοή — слух; пара передана симметричными существительными.
- source_word: ἀνάμεσον ἀνδρὸς καὶ ἀνδρός … γυναικὸς καὶ γυναικός
  choice: между мужчиной и мужчиной … между женщиной и женщиной
  rationale: Сохранено буквальное сопоставление отдельных людей одного пола, без внесения идеи противопоставления полов.
- source_word: τοῖς προσώποις
  choice: по внешности
  rationale: πρόσωπον может обозначать лицо, облик или внешний вид; в трудной заключительной фразе «по внешности» лучше всего передаёт вероятный смысл, не сводя его только к чертам лица.
- source_word: ἡττόμενον
  choice: уступает
  rationale: Передаёт сравнительный смысл «быть хуже, ниже, слабее» без уточнения, в чём именно состоит предполагаемая неполноценность.
theological_decisions:
- issue: Смысл заключительного сравнения людей
  choice: «нельзя сказать, что по внешности один уступает другому»
  alternative: «нельзя сказать, что одно лицо хуже другого»
  rationale: Выбран естественный русский оборот, сохраняющий утверждение об отсутствии основания считать одного человека ниже другого по облику; при этом не добавляется богословское объяснение, отсутствующее в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясной параллельной структурой. Повтор «между мужчиной и мужчиной … между женщиной и женщиной» намеренно сохранён ради близости к греческому тексту.
