  terminology: «Зрение и слух» удачно передаёт пару δράσις и ἀκοή в соответствии с английским аудит-следом. «По внешности» сохраняет семантический диапазон πρόσωπα («лица», «облик») без неопоснованного сужения. Богословски нагруженных терминов нет.
