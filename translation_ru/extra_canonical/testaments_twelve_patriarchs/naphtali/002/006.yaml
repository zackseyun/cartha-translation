id: T12P.NAP.2.6
reference: Testament of Naphtali 2:6
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 6. *Ὡς γὰρ ἡ ἰσχὺς αὐτοῦ, οὕτως⁴⁸ καὶ ὁ λόγος αὐτοῦ⁵⁰, ἢ ἐν νόμῳ Κυρίου, ἢ ἐν νόμῳ⁵¹ τοῦ⁵² Βελίαρ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/006.yaml
  text: As a person's strength is, so also is his word, whether in the law of the Lord or in the works of Beliar.
translation:
  language: ru
  text: Какова его сила, таково и его слово — будь то в законе Господа или в законе[a] Велиара.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'В иной греческой текстовой форме: «в делах Велиара».'
    reason: Предоставленный греческий текст читает νόμῳ («в законе»), тогда как консультационный английский слой свидетельствует о варианте ἔργοις («в делах»); сноска сохраняет текстологическое различие.
lexical_decisions:
- source_word: ἰσχύς
  choice: сила
  rationale: Прямое и естественное соответствие, сохраняющее сопоставление силы человека с его словом.
- source_word: λόγος
  choice: слово
  rationale: Передаёт указанное в греческом тексте λόγος; вариант «дело» здесь не отражал бы основной приведённый текст.
- source_word: νόμος Κυρίου
  choice: закон Господа
  rationale: Формально и богословски нейтрально передаёт греческое выражение.
- source_word: Βελίαρ
  choice: Велиар
  rationale: Сохраняет форму имени Βελίαρ, традиционную для русской библейской и межзаветной литературы.
theological_decisions:
- issue: Параллелизм между законом Господа и законом Велиара
  choice: Сохранено повторение «в законе» согласно предоставленному греческому тексту.
  alternative: «в делах Велиара»
  rationale: Основной приведённый текст содержит νόμῳ в обеих частях. Альтернативное чтение отмечено в сноске, а не внесено молча в основной текст.
- issue: Референт местоимения αὐτοῦ
  choice: «его»
  alternative: «человека»
  rationale: Греческий текст использует местоимение и предполагает референт из контекста; перевод сохраняет эту контекстуальную зависимость, не добавляя существительного.
translation_notes:
  register: Современный литературный русский язык; краткий афористический параллелизм оригинала сохранён. Конструкция «будь то… или…» естественно передаёт греческое ἢ… ἢ и не устраняет противопоставление двух сфер.
