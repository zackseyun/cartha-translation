  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/009.yaml
  text: So then, my children, let all your works be in order for good in the fear of God, and do nothing disorderly in contempt, nor outside its proper time.
translation:
  language: ru
  text: Итак, дети мои, пусть все ваши дела совершаются в должном порядке, ко благу и в страхе Божьем; ничего не делайте беспорядочно, с презрением или не в своё время.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τάξει
  choice: в должном порядке
  rationale: Передаёт идею упорядоченности и сохраняет смысловую связь с последующим ἄτακτον.
- source_word: εἰς ἀγαθόν
  choice: ко благу
  rationale: Сохраняет направленность действия к добру, выраженную предлогом εἰς, без излишнего уточнения.
- source_word: ἐν φόβῳ Θεοῦ
  choice: в страхе Божьем
  rationale: Традиционное и понятное русское выражение, точно передающее благоговейный страх перед Богом.
- source_word: ἄτακτον
  choice: беспорядочно
  rationale: Естественно по-русски передаёт нарушение порядка и поддерживает контраст с ἐν τάξει.
- source_word: ἐν καταφρονήσει
  choice: из пренебрежения
  rationale: Передаёт καταφρόνησις как презрительное или небрежное отношение, не уточняя объект пренебрежения.
- source_word: ἔξω καιροῦ αὐτοῦ
  choice: не в своё время
  rationale: Естественно выражает действие вне подобающего ему срока и сохраняет неуточнённую соотнесённость местоимения αὐτοῦ.
