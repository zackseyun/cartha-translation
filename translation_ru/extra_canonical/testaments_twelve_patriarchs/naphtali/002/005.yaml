base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/005.yaml
  text: For there is no creation and no thought that the Lord does not know; for he created all things, and he created man in his own image.
translation:
  language: ru
  text: Ибо нет ни одного творения и ни одной мысли, которых Господь не знал бы; ведь Он сотворил всё и создал человека по Своему образу.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст второй части стиха сохранился в грамматически неровной форме; перевод следует наиболее вероятному смыслу: Господь сотворил всё и создал человека по Своему образу.'
    reason: Предупреждает читателя о текстологической трудности, стоящей за синтаксически восстановленным переводом, не перегружая основной текст.
lexical_decisions:
- source_word: πλάσμα
  choice: творение
  rationale: Сохраняет конкретное значение созданного существа или предмета и соответствует противопоставленному далее «всё»; не сужает смысл до замысла или цели.
- source_word: πᾶσα ἔννοια
  choice: ни одной мысли
  rationale: ἔννοια обозначает мысль, представление или замысел; в отрицательной конструкции естественный русский эквивалент — «ни одной мысли», без искусственного снятия смысловой широты слова.
- source_word: ἔγνω
  choice: не знал бы
  rationale: 'Передаёт значение знания и сохраняет обобщённую относительную конструкцию: не существует ничего, что могло бы быть неизвестно Господу.'
- source_word: πάντα
  choice: всё
  rationale: Передаёт универсальный охват греческого πάντα без сужения до «всех людей».
- source_word: ἄνθρωπον
  choice: человека
  rationale: Сохраняет единственное число и родовое значение греческого существительного.
- source_word: κατʼ εἰκόνα ἑαυτοῦ
  choice: по Своему образу
  rationale: Устойчиво и точно передаёт выражение «по образу самого себя», сохраняя отнесение возвратного местоимения к Творцу.
theological_decisions:
- issue: Всеобъемлющее знание Господа
  choice: «нет ни одного творения и ни одной мысли, которых Господь не знал бы»
  alternative: «нет замысла Его творения, которого Господь не знает»
  rationale: Греческий текст координирует πλάσμα и πᾶσα ἔννοια; перевод не объединяет их в более узкое богословское понятие «замысел творения».
- issue: Человек как созданный по образу Бога
  choice: «создал человека по Своему образу»
  alternative: «создал каждого человека по Своему образу»
  rationale: Единственное число ἄνθρωπον лучше передать родовым «человека», не добавляя явно отсутствующее «каждого».
translation_notes:
  register: Современный литературный русский язык; синтаксис ясный и торжественный без архаизмов. Повтор «ни одного… ни одной…» естественно подчёркивает всеохватность утверждения. Прописное «Он» и «Своему» соответствует принятой в русском религиозном письме уважительной норме.
