  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007.yaml
  text: '1[a]. I told these two dreams to my father, and he said to me, “These things must be fulfilled in their appointed times, after Israel has endured much.”


    2. Then my father said to me[b], “I believe God that Joseph is alive; for I always see that the Lord counts him as being with us.”


    3. And weeping he said, “Alas, my child Joseph, you are alive, and I do not see you; and you do not see Jacob, the one who fathered you.”


    4. So by these words he made me weep also. But I was burning in my inward parts to tell him that Joseph had been sold[c], yet I was afraid of my brothers.'
translation:
  language: ru
  text: '1. Эти два сна я рассказал своему отцу, и он сказал мне: «Всё это должно исполниться в свои сроки[a], после того как Израиль много претерпит».


    2. Тогда мой отец сказал мне: «Я верю Богу, что Иосиф жив, потому что я всегда вижу: Господь причисляет его к нам[b]».


    3. И, плача, он говорил: «Увы, сын мой Иосиф! Ты жив, но я не вижу тебя, и ты не видишь Иакова, который дал тебе жизнь».


    4. От этих слов он заставил и меня заплакать. У меня всё горело внутри[c], когда я хотел рассказать, что Иосиф был продан, но я боялся своих братьев.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «в назначенные времена». Греческое слово καιροί может обозначать подобающие или назначенные времена.'
    reason: lexical_alternative
  - marker: b
    text: 'Возможные варианты: «считает его находящимся с нами» или «включает его в наше число». Греческое выражение сохраняет образ счёта и допускает несколько оттенков смысла.'
    reason: lexical_alternative
  - marker: c
    text: 'Буквально: «я горел в своих внутренностях». Это греческий телесный образ сильного внутреннего мучения и непреодолимого побуждения высказаться.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐνύπνια
  choice: сны
  rationale: Обычное значение слова в данном повествовательном контексте; более возвышенное «видения» здесь не требуется.
- source_word: δεῖ ... πληρωθῆναι
  choice: должно исполниться
  rationale: Передаёт и необходимость, выраженную δεῖ, и пророческий оттенок исполнения в πληρωθῆναι.
- source_word: καιροὺς
  choice: назначенные времена
  rationale: Сохраняет смысл не просто хронологических моментов, а подобающих или определённых сроков.
- source_word: ὑπομείναντος
  choice: когда ... многое претерпит
  rationale: Передаёт стойкое перенесение тяжёлых испытаний, не добавляя отсутствующих в тексте подробностей.
- source_word: πιστεύω τῷ θεῷ
  choice: я верю Богу
  rationale: Дательный падеж указывает на доверие Богу, а не просто на утверждение о существовании Бога.
- source_word: ἀριθμεῖ
  choice: причисляет
  rationale: Сохраняет образ счёта или включения в число и при этом звучит естественно по-русски.
- source_word: Οἴμοι
  choice: горе мне
  rationale: Передаёт возглас скорби в dignified, но понятном современном русском регистре.
- source_word: γεννήσαντά
  choice: который дал тебе жизнь
  rationale: Естественно выражает отцовство Иакова без архаического «породил»; родственная связь ясна из имени и контекста.
- source_word: ἐκαιόμην τοῖς σπλάγχνοις
  choice: у меня всё горело внутри
  rationale: Сохраняет телесно-эмоциональный образ сильного внутреннего мучения, не делая русскую фразу неестественной.
- source_word: πέπραται
  choice: был продан
  rationale: Точно отсылает к продаже Иосифа; русская форма страдательного прошедшего времени естественна в ретроспективном рассказе.
theological_decisions:
- issue: Пророческая необходимость в ответе Иакова
  choice: всё это должно исполниться в назначенные для него времена
  alternative: всё это должно произойти в свои сроки
  rationale: Формулировка сохраняет провиденциальный оттенок и лексику исполнения, не превращая её в более разработанное богословское утверждение.
- issue: Значение ἀριθμεῖ αὐτὸν μεθ’ ἡμῶν
  choice: Господь причисляет его к нам
  alternative: Господь считает его находящимся с нами
  rationale: Выбор сохраняет метафору включения Иосифа в число семьи и не устраняет неоднозначность того, идёт ли речь о его принадлежности к семье, присутствии или пребывании среди живых.
- issue: Референт имени «Израиль» в 7:1
  choice: Израиль
  alternative: народ Израиля / Иаков
  rationale: Имя оставлено без поясняющего истолкования, поскольку греческий текст допускает восприятие Израиля как Иакова либо как народа.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным тоном завещательного повествования. Плач Иакова передан эмоционально, но без избыточной архаизации. Неоднозначность имени «Израиль» и образного глагола ἀριθμεῖ сохранена; телесная идиома в стихе 4 сделана понятной в основном тексте и уточнена в сноске.
