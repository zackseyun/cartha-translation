  naturalness: Текст выдержан в современном литературном регистре. Предлагаемая правка делает первый стих более естественным, а небольшая перестройка второй реплики Иакова улучшает русскую сочетаемость без изменения смысла.
  terminology: Имена Иосиф, Иаков и Израиль переданы правильно. «Исполниться», «верю Богу», «причисляет его к нам» и «был продан» адекватно отражают ключевые греческие выражения. Неоднозначность «Израиля» и образность ἀριθμεῖ сохранены.
