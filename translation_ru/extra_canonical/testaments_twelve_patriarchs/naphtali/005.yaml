  text: '**Завещание Неффалима, 5**


    **1.** На сороковом году моей жизни я увидел видение на Масличной горе, к востоку от Иерусалима: солнце и луна стояли неподвижно.


    **2.** И вот, Исаак, отец моего отца, сказал нам: «Подбегите, и пусть каждый ухватится за них по мере своей силы. Тому, кто схватит их, будут принадлежать солнце и луна».


    **3.** Мы все побежали вместе. Левий ухватился за солнце, а Иуда, добежав первым, схватил луну; и оба поднялись вместе с ними.


    **4.** И когда Левий был как солнце, некий юноша подал ему двенадцать пальмовых ветвей. Иуда же засиял, как луна, а под их ногами было двенадцать лучей.


    **5.** И эти двое — Левий и Иуда — подбежали и крепко удержали их.[a]


    **6.** И вот, на земле был бык с двумя большими рогами и орлиными крыльями на спине. Мы хотели схватить его, но не смогли.


    **7.** Тогда пришёл Иосиф, схватил его и вместе с ним поднялся на высоту.


    **8.** И я увидел, что нахожусь там неподалёку. И вот, нам явилось священное писание, гласившее: «Ассирийцы, мидяне, персы, халдеи и сирийцы получат в удел пленение двенадцати скипетров Израиля».


    [a] Этот стих в дошедшем до нас греческом тексте заключён в скобки и выражен неясно; возможно, это повторная или позднейшая строка, вновь подчёркивающая роль Левия и Иуды.'
  philosophy: optimal-equivalence
