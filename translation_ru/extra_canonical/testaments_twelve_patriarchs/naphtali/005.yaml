lexical_decisions:
- source_word: ὄραμα
  choice: видение
  rationale: Обычное обозначение откровенного видения; соответствует апокалиптическому характеру повествования.
- source_word: ἕστηκαν
  choice: стояли неподвижно
  rationale: Перфект передаёт устойчивое, зафиксированное состояние солнца и луны в видении.
- source_word: Προσδραμόντες
  choice: подбегите
  rationale: Сохраняет направленное и энергичное движение, выраженное глаголом.
- source_word: κρατήσατε
  choice: ухватится
  rationale: Передаёт сильное схватывание, но естественно звучит в русском повелительном обороте.
- source_word: κατὰ δύναμιν
  choice: по мере своей силы
  rationale: 'Сохраняет распределительный смысл: каждый действует соответственно собственной силе.'
- source_word: φθάσας
  choice: добежав первым
  rationale: В данном контексте выражает то, что Иуда первым достиг луны.
- source_word: ὑψώθησαν
  choice: поднялись
  rationale: Передаёт прежде всего пространственный образ, не навязывая значения прославления.
- source_word: βαΐα φοινίκων
  choice: пальмовые ветви
  rationale: Прямое и понятное обозначение конкретного предмета.
- source_word: ἀκτῖνες
  choice: лучи
  rationale: Естественно соответствует солнечно-лунной образности.
- source_word: κατέλαβεν
  choice: овладел им
  rationale: Передаёт успешное схватывание и удержание быка, отличая его от повторяющихся форм πιάζω и κρατέω.
- source_word: γραφὴ ἁγία
  choice: священное писание
  rationale: Сохраняет неопределённый характер явившегося текста; строчная буква не отождествляет его автоматически с установленным каноном.
- source_word: κληρονομήσουσιν αἰχμαλωσίαν
  choice: получат в удел пленение
  rationale: Сохраняет необычное и напряжённое сочетание глагола наследования с пленением, не устраняя неясность исходного выражения.
- source_word: τὰ δώδεκα σκῆπτρα τοῦ Ἰσραήλ
  choice: двенадцати скипетров Израиля
  rationale: Формально сохраняет образ двенадцати скипетров, вероятно обозначающих колена, не подменяя метафору толкованием.
theological_decisions:
- issue: Символическое значение Левия и Иуды
  choice: Передать образы без истолкования в основном тексте.
  alternative: Прямо назвать Левия носителем священнической власти, а Иуду — царской или мессианской власти.
  rationale: Греческий текст изображает символические действия, но в этой главе прямо не объясняет их значения.
- issue: Значение γραφὴ ἁγία
  choice: «священное писание» со строчной буквы
  alternative: «Священное Писание» или «священная книга»
  rationale: Оборот описывает явившийся в видении текст и сам по себе не требует отождествления с позднее очерченным каноном.
- issue: Образ двенадцати скипетров
  choice: Сохранить метафору «двенадцать скипетров Израиля».
  alternative: Разъяснить как «двенадцать колен Израиля».
  rationale: Исходный текст употребляет σκῆπτρα, а не обычное слово «колена»; перевод не должен молча заменять образ толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским ритмом. Сохранены повторяющееся «И вот», символические образы и синтаксическая напряжённость там, где она смыслоразличительна. Перевод следует всему предоставленному греческому тексту стиха 8, включая народы после персов и заключительное пророческое высказывание; ошибочное указание консультационного английского слоя о том, что свидетель обрывается после слова «персы», не принято.
