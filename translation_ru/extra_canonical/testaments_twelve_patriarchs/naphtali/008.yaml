  source_fidelity: 'В целом перевод близок к греческому тексту и удачно сохраняет царскую образность, спасение, скипетр и обе практики в ст. 8–9. Однако ст. 5 передан слишком свободно: греческий текст говорит о «доброй памяти» у/перед Богом в связи с добрым делом, а не о том, что дело само «хранится». В ст. 10 следует сохранить охват «всякого дела/предмета», не превращая его в установления, специально предназначенные для каждого дела. В ст. 8 желательно передать притяжательное αὐτοῦ («его молитвы»).'
  naturalness: Русский язык в основном современный, литературный и выдержанный. «Заповедайте» и «двояки» уместны в возвышенном наставительном регистре. Для ст. 5 предложена более естественная и более близкая к источнику формулировка.
  terminology: «Левий», «Иуда», «спасение», «скипетр», «Господь», «дьявол», «заповеди Закона» и «воздержание» выбраны удачно. Сноска о «последних временах» не должна утверждать текстологическую неустойчивость первой фразы без приведённого аппарата; достаточно пояснить буквальное значение. Текстологическую оговорку для заключённого в скобки выражения ст. 3 следует сохранить.
  issues:
  - severity: medium
    issue: 'Ст. 5: «доброе дело хранится в доброй памяти у Бога»'
    rationale: Греческое μνήμη ... ἀγαθή описывает добрую память/памятование перед Богом, а не действие, совершаемое самим «добрым делом». Формулировка нуждается в более прямой передаче.
  - severity: low
    issue: 'Ст. 8: опущено αὐτοῦ («его») при «молитве»'
    rationale: «Ради молитвы» передаёт общий смысл, но греческий текст содержит личное притяжательное; его можно сохранить без неестественности.
  - severity: low
    issue: 'Ст. 10: «установления для всякого дела»'
    rationale: Генитив παντὸς πράγματος естественнее передать как установления, относящиеся ко всякому делу/предмету; вариант «для» может сузить или изменить связь.
  - severity: low
    issue: Сноска [a] о текстологической неустойчивости ст. 1
    rationale: В предоставленном материале нет аппарата, который позволял бы обосновать это утверждение. Буквальное пояснение «последние времена» безопасно; текстологическую сноску следует оставить при скобочном чтении ст. 3.
  revised_text: '1. И вот, дети мои, я указал вам на последние времена: всё это произойдёт в Израиле.[a]


    2. Итак, и вы заповедайте своим детям быть в единстве с Левием и Иудой. Ведь через Иуду взойдёт спасение для Израиля, и в нём будет благословлён Иаков.


    3. Через его скипетр[b] Бог явится на земле, обитая среди людей[c], чтобы спасти род Израиля, и соберёт праведных из народов.


    4. Итак, если и вы будете делать добро, вас благословят люди и ангелы; Бог будет прославлен среди народов через вас, дьявол убежит от вас, дикие звери будут бояться вас, Господь полюбит вас, и ангелы поддержат вас.


    5. Как человек, хорошо воспитавший ребёнка, сохраняет добрую память, так и доброе дело остаётся в доброй памяти у Бога.


    6. А того, кто не делает добра, проклянут и ангелы, и люди; из-за него Бог будет обесславлен среди народов, дьявол присвоит его как собственный сосуд, всякий дикий зверь возьмёт над ним верх, и Господь возненавидит его.


    7. Ведь заповеди Закона двояки и требуют умелого исполнения.


    8. Есть время для близости с женщиной[d] и время для воздержания ради его молитвы[e].


    9. И то и другое — от Бога; но если они совершаются не в должном порядке, то навлекают на людей величайший грех. То же относится и к остальным заповедям.


    10. Поэтому, дети мои, будьте мудры в Боге и рассудительны: понимайте порядок Его заповедей и установления, относящиеся ко всякому делу, чтобы Господь любил вас.'
