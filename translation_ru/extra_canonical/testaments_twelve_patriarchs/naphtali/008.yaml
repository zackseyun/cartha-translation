base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008.yaml
  text: '1[a]. And behold, my children, I have shown you the times, that all these things will happen in Israel.

    2. And now, behold, command your children that they be united with Levi and with Judah. For through Judah salvation will arise for Israel, and in him Jacob will be blessed.

    3. Through his scepter God will appear on the earth, dwelling among men[b], to save the race of Israel, and he will gather the righteous from among the nations.

    4. Therefore, if you also do what is good, men and angels will bless you, and God will be glorified among the nations through you, and the devil will flee from you, and the wild beasts will fear you, and the Lord will love you, and the angels will stand by you.

    5. As when someone has reared a child well, he has a good remembrance of him, so also for a good work there is a good remembrance before God.

    6. But the one who does not do what is good, angels and men will curse him, and God will be dishonored among the nations through him, and the devil claims him as his own vessel, and every wild beast will lord it over him, and the Lord will hate him.

    7. For the commandments of the law are twofold, and they are fulfilled with skill.

    8. For there is a time for a man''s coming together with a woman, and a time for restraint for his prayer.

    9. And both are from God, and if they do not take place in their proper order, they bring very great sin upon men. The same is true also of the rest of the commandments.

    10. Therefore become wise in God, my children, and prudent, perceiving the order of his commandments and the ordinances of every matter[d][c], so that the Lord may love you.'
translation:
  language: ru
  text: '1. И вот, дети мои, я указал вам на последние времена: всё это произойдёт в Израиле.[a]


    2. Итак, и вы заповедайте своим детям быть в единстве с Левием и Иудой. Ведь через Иуду взойдёт спасение для Израиля, и в нём будет благословлён Иаков.


    3. Через его скипетр[b] Бог явится на земле, обитая среди людей[c], чтобы спасти род Израиля, и соберёт праведных из народов.


    4. Итак, если и вы будете делать добро, вас благословят люди и ангелы; Бог будет прославлен среди народов через вас, дьявол убежит от вас, дикие звери будут бояться вас, Господь полюбит вас, и ангелы поддержат вас.


    5. Как человек, хорошо воспитавший ребёнка, сохраняет добрую память, так и доброе дело остаётся в доброй памяти у Бога.


    6. А того, кто не делает добра, проклянут и ангелы, и люди; из-за него Бог будет обесславлен среди народов, дьявол присвоит его как собственный сосуд, всякий дикий зверь возьмёт над ним верх, и Господь возненавидит его.


    7. Ведь заповеди Закона двояки и требуют умелого исполнения.


    8. Есть время для близости с женщиной[d] и время для воздержания ради его молитвы[e].


    9. И то и другое — от Бога; но если они совершаются не в должном порядке, то навлекают на людей величайший грех. То же относится и к остальным заповедям.


    10. Поэтому, дети мои, будьте мудры в Боге и рассудительны: понимайте порядок Его заповедей и установления, относящиеся ко всякому делу, чтобы Господь любил вас.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «последние времена».'
    reason: lexical_alternative
  - marker: b
    text: Слова «через Иуду» и «через его скипетр» несут царскую образность и могут пониматься мессиански, однако сам греческий текст не уточняет это толкование.
    reason: cross_reference
  - marker: c
    text: 'Слова «обитая среди людей» заключены в скобки в представленном греческом тексте и могут отражать текстуальное расширение или вариант. Перевод следует приведённому полному чтению; буквально возможно также: «обитая в людях».'
    reason: textual_variant
  - marker: d
    text: Выражение «близость с женщиной» благопристойно передаёт греческое обозначение полового союза.
    reason: cultural_note
  - marker: e
    text: 'Или: «время самообладания для его молитвы»; по контексту речь идёт о воздержании от супружеской близости в надлежащее время для молитвы.'
    reason: lexical_alternative
lexical_decisions:
- source_word: καιροὺς ἐσχάτους
  choice: последние времена
  rationale: Передаёт оба элемента греческого выражения и его эсхатологическую направленность, не сводя καιρός к простому хронологическому времени.
- source_word: ἑνοῦνται
  choice: быть в единстве
  rationale: Естественно передаёт призыв к единению с Левием и Иудой, не уточняя сверх текста характер этого единства.
- source_word: σωτηρία
  choice: спасение
  rationale: Сохраняет богословскую насыщенность слова и допускает также более широкий смысл избавления.
- source_word: σκήπτρου
  choice: скипетр
  rationale: Сохраняет конкретную царскую и династическую образность греческого текста.
- source_word: ὀφθήσεται
  choice: явится
  rationale: Передаёт значение зримого явления Бога естественным русским глаголом без добавления позднейшей догматической терминологии.
- source_word: κατοικῶν ἐν ἀνθρώποις
  choice: обитая среди людей
  rationale: Наиболее естественно в контексте передаёт присутствие Бога среди человечества; возможное значение «в людях» отмечено в сноске.
- source_word: ἐπισυνάξει
  choice: соберёт
  rationale: Прямо передаёт собирание праведных из народов.
- source_word: τὸ καλόν
  choice: делать добро / добро
  rationale: Современная и идиоматичная передача субстантивированного прилагательного в нравственном смысле.
- source_word: ἀνθέξονται ὑμῶν
  choice: поддержат вас
  rationale: Передаёт значение держаться за кого-либо, помогать и поддерживать; соответствует защитному параллелизму стиха.
- source_word: διπλαῖ
  choice: двояки
  rationale: Сохраняет намеренно краткое и несколько загадочное утверждение о двойственности заповедей, раскрываемое примером в следующих стихах.
- source_word: μετὰ τέχνης πληροῦνται
  choice: требуют умелого исполнения
  rationale: Передаёт τέχνη как умение и разумное соблюдение надлежащего порядка, избегая неестественного буквального оборота.
- source_word: συνουσίας γυναικός
  choice: близости с женщиной
  rationale: Благопристойная современная передача полового союза без эвфемистического затемнения смысла.
- source_word: ἐγκρατείας
  choice: воздержание
  rationale: В противопоставлении половой близости и в связи с молитвой слово обозначает своевременное воздержание; более широкое «самообладание» отмечено как возможность.
- source_word: θεσμοὺς παντὸς πράγματος
  choice: установления для всякого дела
  rationale: Передаёт установленные нормы или правила, относящиеся к каждой сфере поступков, без чрезмерного уточнения.
theological_decisions:
- issue: Царская и возможная мессианская образность Иуды в стихах 2–3
  choice: Прямо сохранить формулировки о спасении через Иуду, его скипетре и явлении Бога на земле.
  alternative: Истолковать отрывок только как политико-династическую надежду либо ослабить его как позднюю вставку.
  rationale: Данный греческий свидетель содержит сильное спасительное пророчество с царской образностью. Перевод сохраняет его силу, а возможное мессианское прочтение отмечает, не навязывая.
- issue: κατοικῶν ἐν ἀνθρώποις в стихе 3
  choice: «обитая среди людей» в основном тексте с текстологической и лексической оговоркой.
  alternative: «обитая в людях» либо опущение слов как вторичного расширения.
  rationale: В контексте наиболее естественно понимание пребывания Бога среди людей. Поскольку чтение текстуально сложно, слова сохранены по представленному греческому тексту, а неоднозначность вынесена в сноску.
- issue: Двойственность заповедей и порядок супружеской близости и молитвы в стихах 7–9
  choice: 'Сохранить конкретный пример: надлежащее время для половой близости и для воздержания ради молитвы.'
  alternative: Обобщить до неопределённого учения об умеренности либо ввести не названную прямо ритуальную нечистоту.
  rationale: Греческий текст говорит именно о двух действиях, каждое из которых имеет установленное Богом время. Перевод не расширяет наставление до конфессиональной дисциплины.
- issue: «И то и другое — от Бога» в стихе 9
  choice: Отнести утверждение и к близости, и к воздержанию, сохранив их положительное место в должном порядке.
  alternative: Считать божественно установленным лишь воздержание или лишь общий принцип порядка.
  rationale: Ближайший грамматический антецедент αἱ δύο — две названные практики; перевод сохраняет богословское напряжение текста, не отдавая одной из них безусловного превосходства.
translation_notes:
  register: 'Современный литературный русский язык с dignified библейским тоном: «скипетр», «род Израиля», «заповеди Закона» сохраняют возвышенный регистр, тогда как синтаксис остаётся понятным широкому читателю. Архаизмы и конфессионально маркированные формулы избегаются. Неоднозначные и текстуально сложные места сохранены в основном тексте и пояснены в сносках.'
