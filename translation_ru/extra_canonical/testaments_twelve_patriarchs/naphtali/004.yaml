base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/004.yaml
  text: These things I say to you[a], my children, because I learned from the writing of Enoch that you also will surely depart from the Lord, walking in every lawlessness of the nations and doing all the wickedness of Sodom. And the Lord will bring captivity upon you, and there you will serve your enemies and the land will be laid waste and your holy places will be desolate. And you will be scattered to the four corners of the earth, and you will be as something despised among the nations, a curse and a dispersion, until the Most High visits the earth. He himself will come, saving Israel and all the nations, God speaking in the person of man. And after he has entered, unrighteousness will again increase upon the earth, and all the nations will be gathered against him. But whoever believes in him shall not be condemned in his name. And you, my children, shall rise up from your tribes with Levi and Judah; and there shall be war among you. And the Lord will be seen among men, and he will save
    Israel and all the nations. Therefore do not be divided into two heads, because every division among brothers is evil in the sight of the Lord. For the Lord loves singleness of purpose. And if you also walk in singleness of purpose according to his law[b], my children, no evil spirit will have power over you. For he knows that the God of heaven is one, and he will not accept a divided mind. Love the Lord through all your life[c], and one another with a true heart.
translation:
  language: ru
  text: 'IV


    1 Вот что я говорю вам, дети мои: в сочинении Еноха[a] я узнал, что и вы отступите от Господа, пойдёте путём всякого беззакония народов и станете творить всё зло Содома.


    2 И Господь предаст вас в плен; там вы будете служить своим врагам и жить среди всяческих бедствий и скорбей[b], пока Господь не истребит всех вас.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «сочинение Еноха» может обозначать книгу или письменное предание, связанное с Енохом; само по себе оно не решает вопроса о каноническом статусе этого текста.
    reason: cultural_note
  - marker: b
    text: Греческий текст этой фразы труден и имеет признаки текстуальной неустойчивости. Буквально здесь говорится о пребывании вместе «со всяким бедствием и скорбью»; возможны и другие реконструкции и переводы.
    reason: textual_variant
lexical_decisions:
- source_word: ἔγνων
  choice: я узнал
  rationale: В сочетании с указанием на сочинение глагол обозначает знание, полученное из письменного источника; «я узнал» естественно передаёт этот смысл.
- source_word: γραφή
  choice: сочинение
  rationale: Передаёт письменный труд, связанный с Енохом, не утверждая его канонического статуса, как могло бы подразумевать слово «Писание».
- source_word: ἀποστήσεσθε
  choice: отступите
  rationale: Глагол означает отход от Господа; «отступите» сохраняет религиозно-нравственную силу выражения без позднейшей специальной терминологии.
- source_word: ἀνομία
  choice: беззаконие
  rationale: Сохраняет представление о нарушении Божьего порядка, а не только об общем зле.
- source_word: ἐθνῶν
  choice: народов
  rationale: Нейтрально передаёт ἔθνη и не сужает значение до конфессионально окрашенного «язычников».
- source_word: πονηρία
  choice: зло
  rationale: В выражении πᾶσαν πονηρίαν Σοδόμων естественное русское «всё зло Содома» сохраняет нравственную тяжесть и не конкретизирует не названные в тексте пороки.
- source_word: αἰχμαλωσία
  choice: плен
  rationale: Контекст говорит о суде, порабощении и служении врагам; «предаст вас в плен» идиоматично передаёт греческую конструкцию.
- source_word: συναναστραφήσεσθε
  choice: жить среди
  rationale: Буквально глагол связан с пребыванием или совместной жизнью; ввиду трудного сочетания с κακώσει и θλίψει выбран естественный перевод, не устраняющий образ длительного пребывания в бедствии.
- source_word: ἀναλώσει
  choice: истребит
  rationale: Глагол означает уничтожить или погубить. «Истребит» ясно передаёт суровый смысл предсказания, не смягчая его.
theological_decisions:
- issue: Статус сочинения Еноха
  choice: «из сочинения Еноха»
  alternative: «в Писании Еноха» или «в книге Еноха»
  rationale: γραφή допускает значения «письменный текст» и «Писание». Нейтральное «сочинение» сохраняет ссылку на письменный источник, не решая вопрос о каноническом статусе.
- issue: Окончательность угрозы суда
  choice: «пока Господь не истребит всех вас»
  alternative: Смягчённые варианты вроде «пока Господь не положит этому конец»
  rationale: Прямой объект πάντας ὑμᾶς относится к адресатам, а ἀναλίσκω имеет значение уничтожения. Суровое напряжение текста сохранено без богословского смягчения.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательно-пророческой речи. Переведён только засвидетельствованный в предоставленном греческом источнике текст IV.1–2; более длинный английский консультационный слой не использован там, где ему не соответствует приведённый греческий текст.
