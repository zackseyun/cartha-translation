  language: ru
  text: И, поев и выпив с радостью в душе, он закрыл своё лицо и умер.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φαγὼν καὶ πιὼν
  choice: поев и выпив
  rationale: Деепричастия естественно передают греческие аористные причастия, обозначающие действия, предшествующие основному.
- source_word: ἐν ἱλαρότητι ψυχῆς
  choice: с радостью в душе
  rationale: Современное и естественное выражение, сохраняющее значение внутренней радости; буквальное «в радости души» по-русски звучит менее естественно.
- source_word: συνεκάλυψε τὸ πρόσωπον αὐτοῦ
  choice: закрыл своё лицо
  rationale: Передаёт обычное значение глагола и возвратное отношение притяжательного местоимения к подлежащему без добавления неуказанного предмета, которым было закрыто лицо.
- source_word: ἀπέθανε
  choice: умер
  rationale: Прямой и стилистически нейтральный эквивалент греческого глагола.
