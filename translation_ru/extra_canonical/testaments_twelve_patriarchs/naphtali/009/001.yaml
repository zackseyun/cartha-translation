  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/009/001.yaml
  text: And after instructing them in many such things, he urged them to carry his bones to Hebron and bury him with his fathers.
translation:
  language: ru
  text: И, дав им много подобных наставлений, он настоятельно попросил их перенести его кости в Хеврон и похоронить его вместе с его отцами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντειλάμενος
  choice: дав … наставлений
  rationale: Причастие передано естественным русским оборотом; в контексте предсмертных наставлений это точнее по регистру, чем буквальное «заповедав».
- source_word: παρεκάλεσεν
  choice: настоятельно попросил
  rationale: Передаёт усиленную просьбу или призыв, не превращая её в приказ.
- source_word: μετακομίσωσι τὰ ὀστᾶ αὐτοῦ
  choice: перенести его кости
  rationale: Сохранён конкретный образ греческого текста и древняя практика перенесения костей, а не более общее «останки».
- source_word: ἐν Χεβρών
  choice: в Хеврон
  rationale: Несмотря на предлог ἐν, глагол μετακομίζω и контекст обозначают направление перенесения; русская конструкция требует винительного падежа направления.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: вместе с его отцами
  rationale: Сохранена традиционная родственная формула и её связь с погребением среди предков.
