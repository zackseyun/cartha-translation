lexical_decisions:
- source_word: ἐποίησαν
  choice: сделали
  rationale: Прямо передаёт совершённое действие, не добавляя отсутствующих в греческом тексте смысловых оттенков.
- source_word: κατὰ πάντα ὅσα
  choice: всё, что
  rationale: Естественный современный русский эквивалент конструкции «согласно всему, что», сохраняющий полноту исполнения.
- source_word: ἐνετείλατο
  choice: повелел
  rationale: Передаёт значение данного авторитетного предписания и соответствует достоинству завещательного контекста.
- source_word: Νεφθαλείμ
  choice: Неффалим
  rationale: Традиционная русская библейская форма имени.
