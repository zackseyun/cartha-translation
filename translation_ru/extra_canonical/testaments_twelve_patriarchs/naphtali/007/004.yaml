    rationale: Оно передаёт образ внутренностей, но несколько снижает литературный регистр. Более нейтральная формулировка сохраняет образ и лучше соответствует целевому варианту русского языка.
  - severity: low
    issue: «Сказать ему» ослабляет оттенок ἀναγγεῖλαι.
    rationale: Глагол означает возвестить, сообщить, объявить; «сообщить ему» точнее, не меняя смысла.
