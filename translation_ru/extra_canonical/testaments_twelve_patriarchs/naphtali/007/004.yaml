  verdict: revise
  source_fidelity: 'Смысл в целом передан точно: сохранены причинная роль слов, стремление открыть продажу Иосифа и страх перед братьями. Однако ἀναγγεῖλαι точнее передаётся как «сообщить», а образ τοῖς σπλάγχνοις μου лучше выразить без разговорного оттенка «нутром».'
  naturalness: «Всем нутром горел желанием» экспрессивно, но имеет разговорно-разговорный оттенок и стилистически менее уместно для современного литературного повествования. «Внутри меня всё горело от желания» естественно и сохраняет телесно-эмоциональный образ.
  terminology: Имя «Иосиф» передано нормативно. Специальных богословских терминов и требующих сохранения терминологических соответствий в стихе нет.
