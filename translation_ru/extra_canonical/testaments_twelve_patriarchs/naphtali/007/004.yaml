  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/004.yaml
  text: So by these words he made me weep also. But I was burning in my inward parts to tell him that Joseph had been sold, yet I was afraid of my brothers.
translation:
  language: ru
  text: Этими словами он заставил и меня заплакать. Но внутри меня всё горело от желания сообщить ему, что Иосиф продан, однако я боялся своих братьев.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τοῖς λόγοις τούτοις
  choice: от этих слов
  rationale: Естественно передаёт причинный смысл греческого оборота в данном контексте.
- source_word: ἐκαιόμην τοῖς σπλάγχνοις μου
  choice: всем нутром горел желанием
  rationale: Сохраняет телесно-эмоциональный образ внутреннего горения, оставаясь понятным современному читателю.
- source_word: ἀναγγεῖλαι
  choice: сказать ему
  rationale: Передаёт значение сообщения; адресат восстанавливается из ближайшего контекста, как и в английском консультационном тексте.
- source_word: πέπραται Ἰωσήφ
  choice: Иосиф продан
  rationale: Сохраняет перфектное пассивное состояние и лаконичность оригинала.
- source_word: ἐφοβούμην τοὺς ἀδελφούς μου
  choice: боялся своих братьев
  rationale: Прямо и естественно передаёт объект страха.
