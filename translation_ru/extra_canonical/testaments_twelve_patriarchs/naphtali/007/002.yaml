source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Τότε⁸ λέγει μοι ὁ πατήρ μου· Πιστεύω⁹ *τῷ θεῷ¹⁰ ὅτι ζῇ¹¹ Ἰωσήφ¹²· ὁρῶ γὰρ ⌜πάντοτε⌝¹³ ὅτι Κύριος ἀριθμεῖ¹⁴ αὐτὸν μεθʼ ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/002.yaml
  text: Then my father said to me, “I believe God that Joseph is alive; for I always see that the Lord counts him as being with us.”
translation:
  language: ru
  text: 'Тогда отец мой сказал мне: «Я верю Богу, что Иосиф жив, потому что всегда вижу: Господь причисляет его к нам».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιστεύω τῷ θεῷ
  choice: Я верю Богу
  rationale: Сохранена конструкция с дательным падежом и смысл доверия Богу; вариант «верю в Бога» выражал бы прежде всего веру в его существование.
- source_word: ζῇ Ἰωσήφ
  choice: Иосиф жив
  rationale: Прямо и естественно передаёт греческое утверждение.
- source_word: ὁρῶ ... ὅτι
  choice: 'вижу:'
  rationale: Двоеточие естественно вводит содержание того, что видит говорящий, не добавляя толкования.
- source_word: πάντοτε
  choice: всегда
  rationale: Сохранено временное наречие исходного текста.
- source_word: ἀριθμεῖ αὐτὸν μεθʼ ἡμῶν
  choice: причисляет его к нам
  rationale: Передаёт буквальный образ счёта и включения Иосифа в число семьи; не заменяет его более истолковывающим выражением.
theological_decisions:
- issue: Объект и характер веры Иакова
  choice: «верю Богу»
  alternative: «верю в Бога»
  rationale: Греческое τῷ θεῷ указывает на доверие Богу или принятие его свидетельства, а не просто на исповедание существования Бога.
- issue: Смысл того, что Господь «считает» Иосифа с братьями
  choice: 'Сохранён образ: «причисляет его к нам»'
  alternative: «считает его одним из нас» / «считает, что он с нами»
  rationale: Исходная формулировка допускает оттенки принадлежности, включения в число семьи и продолжающегося присутствия; перевод не устраняет эту неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Порядок «отец мой» сохранён как уместный для древнего повествования, но синтаксис остаётся понятным современному читателю.
