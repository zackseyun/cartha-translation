  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/001.yaml
  text: I told these two dreams to my father, and he said to me, “These things must be fulfilled in their appointed times, after Israel has endured much.”
translation:
  language: ru
  text: 'Эти два сна я рассказал отцу, и он сказал мне: «Всё это должно исполниться в свои сроки, после того как Израиль многое претерпит».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα τὰ δύο ἐνύπνια
  choice: Эти два сна
  rationale: Прямо и естественно передаёт указательное сочетание и обычное значение ἐνύπνια в данном контексте.
- source_word: εἶπον τῷ πατρί μου
  choice: я пересказал своему отцу
  rationale: Глагол εἶπον буквально означает «сказал», но по-русски применительно к снам естественнее «пересказал»; адресат сохранён без добавления значения.
- source_word: Δεῖ ταῦτα πληρωθῆναι
  choice: Всё это должно исполниться
  rationale: Сохраняет выраженную безличной конструкцией необходимость и пассивный инфинитив «исполниться».
- source_word: κατὰ τοὺς καιροὺς αὐτῶν
  choice: в назначенные сроки
  rationale: Передаёт множественное число καιρούς и идею соответствующих каждому событию времён; «назначенные» естественно выражает уместность или определённость сроков, не уточняя, кем они установлены.
- source_word: πολλὰ τοῦ Ἰσραὴλ ὑπομείναντος
  choice: после того как Израиль многое претерпит
  rationale: Родительный абсолют передан придаточным времени; аористное причастие указывает на предшествование исполнению, а πολλά сохраняет неопределённое «многое».
theological_decisions:
- issue: Характер необходимости исполнения
  choice: «должно исполниться»
  alternative: «необходимо, чтобы это исполнилось»
  rationale: Формулировка сохраняет утверждение необходимости в Δεῖ, не поясняя её источник и не вводя дополнительной доктринальной интерпретации.
- issue: Отнесение страданий Израиля ко времени исполнения
  choice: «после того как Израиль многое претерпит»
  alternative: «когда Израиль многое претерпит»
  rationale: Генитив абсолютный с аористным причастием наиболее естественно указывает на предшествующее обстоятельство; при этом не конкретизируются ни природа страданий, ни отдельное историческое исполнение.
translation_notes:
  register: Современный литературный русский язык, ясный и достойный по тону. Синтаксис слегка возвышенный, но доступный; архаизмы и конфессионально окрашенные добавления отсутствуют.
