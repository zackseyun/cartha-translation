  text: And weeping, he said, “Alas, my child Joseph, you are alive, and I do not see you; and you do not see Jacob, who fathered you.”
translation:
  language: ru
  text: 'И, плача, он сказал: «Горе мне, дитя моё Иосиф! Ты жив, а я не вижу тебя; и ты не видишь Иакова, породившего тебя».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἴμοι
  choice: Горе мне
  rationale: Передаёт скорбное восклицание естественно и с подобающей тексту торжественностью.
- source_word: τέκνον μου
  choice: дитя моё
  rationale: Сохраняет родительскую нежность и возвышенный регистр; «сын мой» было бы естественнее, но менее буквально.
- source_word: ζῇς
  choice: ты жив
  rationale: Прямо передаёт настоящее время и эмоционально значимое открытие того, что Иосиф жив.
- source_word: τὸν γεννήσαντά σε
  choice: родившего тебя
  rationale: Формально сохраняет активное значение греческого причастия γεννήσαντα и его связь с Иаковом, не подменяя его более общим «твоего отца».
theological_decisions:
- issue: Иаков назван «родившим» Иосифа
  choice: Сохранено буквальное выражение «Иакова, родившего тебя»
  alternative: «Иакова, твоего отца» или «Иакова, давшего тебе жизнь»
  rationale: Греческий текст прямо употребляет активное причастие от γεννάω. Хотя по-русски о мужчине обычно говорят «породивший» или «ставший отцом», буквальная формулировка сохраняет необычность и телесную силу исходного выражения, не сглаживая её богословски или культурно.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной библейской интонацией. Повтор «не вижу / не видишь» сохранён как значимый параллелизм. Союз «а» в первой паре естественно выражает заложенный контраст между жизнью Иосифа и невозможностью увидеть его; перед второй частью сохранено «и».
