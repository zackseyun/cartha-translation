  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/001.yaml
  text: And being brought low, you will turn back and acknowledge the Lord your God, and he will bring you back into your land according to his great mercy. 4 And it shall come to pass, when they go out into the land of their fathers, again they will forget the Lord and act impiously. 5 And the Lord will scatter them upon the face of all the earth, until the compassion of the Lord shall come, a man working righteousness and showing mercy to all who are far off and to those who are near.
translation:
  language: ru
  text: 3 И, будучи унижены, вы обратитесь и познаете Господа, вашего Бога, и Он возвратит вас в вашу землю по великой Своей милости. 4 Но когда они отправятся в землю своих отцов, то снова забудут Господа и будут поступать нечестиво. 5 И Господь рассеет их по лицу всей земли, пока не придёт милосердие Господа[a] — человек, творящий праведность и оказывающий милость всем дальним и ближним.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «внутренность» (или «утроба») Господа; греческое слово образно обозначает глубокое сострадание, милосердие.'
    reason: Поясняет исходный телесный образ σπλάγχνον, переданный переносно как «милосердие», и не истолковывает спорное соположение с последующим словом «человек».
lexical_decisions:
- source_word: σμικρυνθέντες
  choice: смирённые
  rationale: Причастие буквально указывает на тех, кто был «умалён» или «унижен»; «смирённые» естественно передаёт состояние после постигшего унижения, не уточняя его причины.
- source_word: ἐπιστρέψετε / ἐπιστρέψει
  choice: обратитесь / возвратит
  rationale: 'Сохранена игра одного греческого корня: сначала обращение народа к Богу, затем возвращение Богом народа в землю.'
- source_word: ἐπιγνώσεσθε
  choice: познаете
  rationale: Глагол означает признать или познать; «познаете» сохраняет библейскую ёмкость выражения и не сводит его лишь к интеллектуальному признанию.
- source_word: ἐξέλθωσιν εἰς τὴν γῆν
  choice: придут в землю
  rationale: Буквальное «выйдут в землю» по-русски неестественно; в контексте возвращения к земле отцов направление передано глаголом «придут».
- source_word: σπλάγχνον Κυρίου
  choice: милосердие Господа
  rationale: Буквально σπλάγχνον обозначает «внутренности, утробу», а переносно глубокое сострадание или милосердие. Выбран естественный переносный эквивалент, при этом необычная персонификация сохранена.
- source_word: ποιῶν δικαιοσύνην καὶ ποιῶν ἔλεος
  choice: творящий праведность и оказывающий милость
  rationale: Различены два одинаковых греческих причастия по нормам русского сочетания слов; пара «праведность — милость» сохранена.
- source_word: τοὺς μακρὰν καὶ τοὺς ἐγγύς
  choice: всем дальним и ближним
  rationale: Сохранена традиционная пространственно-образная антитеза без уточнения, какие именно группы имеются в виду.
theological_decisions:
- issue: Соотношение выражений «милосердие Господа» и «человек»
  choice: 'Сохранено приложение: «милосердие Господа — человек»'
  alternative: Истолковать это как «придёт человек, исполненный сострадания Господа» либо прямо обозначить мессианский титул
  rationale: Греческий текст грамматически ставит «человек» рядом с «милосердием Господа» и допускает необычную персонификацию. Перевод не разрешает эту богословскую напряжённость и не добавляет отсутствующего в тексте титула.
- issue: Кто является субъектом возвращения и последующего забвения
  choice: Сохранён переход от второго лица «вы» к третьему лицу «они»
  alternative: Унифицировать местоимения ради плавности
  rationale: Такой переход присутствует в греческом тексте и может отражать смену адресата или перспективы; его не следует молча сглаживать.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сделан понятным для широкого читателя, но сохранены повторения, переход между лицами и необычное отождествление милосердия Господа с человеком.
