  - severity: low
    issue: «Придут в землю» для ἐξέλθωσιν εἰς τὴν γῆν
    rationale: «Придут» передаёт лишь прибытие и устраняет движение, выраженное ἐξέλθωσιν. «Отправятся в землю своих отцов» сохраняет направленность глагола, не создавая неестественного буквального оборота «выйдут в землю».
