  source_fidelity: В целом перевод точно передаёт последовательность, смену 2-го лица на 3-е, возвращение тем же корнем, рассеяние и намеренно необычное соположение «милосердия Господа» с «человеком». Однако «смирённые» может означать добровольно кротких, тогда как σμικρυνθέντες прежде всего говорит об умалении или унижении, которому люди подверглись. Кроме того, «придут» сглаживает направленный глагол ἐξέλθωσιν («выйдут/отправятся»).
  naturalness: Предлагаемая правка сохраняет современный литературный и сдержанно библейский регистр. «Будучи унижены» и «отправятся в землю своих отцов» естественны по-русски и точнее передают исходные формы. Синтаксически необычная конструкция в ст. 5 намеренно сохранена.
  terminology: «Господь», «Бог», «праведность», «милость», «дальние и ближние» уместны. «Милосердие Господа» является хорошим переносным соответствием σπλάγχνον Κυρίου; сноска надлежащим образом отмечает буквальный телесный образ, не навязывая богословского истолкования.
  issues:
