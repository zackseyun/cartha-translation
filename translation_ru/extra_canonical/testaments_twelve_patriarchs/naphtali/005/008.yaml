base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/008.yaml
  text: And I saw that I was there, and behold, a holy writing appeared to us, saying, “Assyrians, Medes, Persians, Chaldeans, Syrians shall inherit in captivity the twelve sceptres of Israel.”
translation:
  language: ru
  text: 'И я увидел, что находился там. И вот, нам явилось священное писание, гласившее: «Ассирийцы, мидяне, персы, халдеи и сирийцы получат в удел пленных[a] — двенадцать скипетров Израиля[b]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «получат в удел пленение». Греческое слово может также иметь собирательное значение «пленные»; конструкцию возможно понимать и как указание на захват в плен.'
    reason: Сохраняет необычность и неоднозначность сочетания κληρονομήσουσιν αἰχμαλωσίαν, не выдавая одно его прочтение за несомненное.
  - marker: b
    text: «Двенадцать скипетров» — образ двенадцати колен Израиля, представленных через знаки власти их вождей.
    reason: Разъясняет непривычную современному читателю метафору, не заменяя её в основном тексте.
lexical_decisions:
- source_word: παρεκεῖ
  choice: находился там
  rationale: Передаёт пространственный смысл редкой или текстуально неустойчивой формы без добавления не выраженного в тексте действия.
- source_word: γραφὴ ἁγία
  choice: священное писание
  rationale: Сохраняет буквальный образ явившегося письменного откровения; строчная буква не отождествляет его без основания с определённым каноническим корпусом.
- source_word: κληρονομήσουσιν
  choice: получат в удел
  rationale: Передаёт значение получения наследственной доли и при этом естественно звучит в данном пророческом контексте.
- source_word: αἰχμαλωσίαν
  choice: пленённых
  rationale: В контексте последующего обозначения двенадцати скипетров слово понято собирательно — как захваченные в плен люди; неоднозначность греческой конструкции отмечена в сноске.
- source_word: σκῆπτρα
  choice: скипетров
  rationale: Сохранена политико-родовая метафора оригинала, вероятно обозначающая двенадцать колен под властью их вождей.
theological_decisions:
- issue: Кого или что наследуют перечисленные народы
  choice: получат в удел пленённых — двенадцать скипетров Израиля
  alternative: унаследуют пленение двенадцати скипетров Израиля
  rationale: Выбранная формулировка делает русскую фразу понятной, но посредством сноски сохраняет грамматическую напряжённость и возможное абстрактное значение αἰχμαλωσίαν.
- issue: Значение двенадцати скипетров
  choice: образ сохранён в основном тексте
  alternative: двенадцать колен Израиля
  rationale: Прямая замена метафоры её толкованием устранила бы образность и могла бы чрезмерно сузить референт.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным пророческим звучанием. Формулы «И вот» и «гласившее» сохраняют торжественность повествования, оставаясь понятными; перечень народов передан традиционными русскими этнонимами.
