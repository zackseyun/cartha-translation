  text: But Joseph came and seized him, and went up with him to the height.
translation:
  language: ru
  text: Но Иосиф пришёл, схватил его и вместе с ним поднялся на высоту.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: пришёл
  rationale: Аористное причастие передано естественной для русского повествования личной формой, обозначающей предшествующее действие.
- source_word: κατέλαβεν
  choice: схватил
  rationale: Глагол допускает значения овладения, захвата или удержания; «схватил» сохраняет энергичный характер действия и соответствует одушевлённому местоимению αὐτόν.
- source_word: συνανῆλθεν αὐτῷ
  choice: вместе с ним поднялся
  rationale: Передаёт совместность, выраженную приставкой συν-, и восходящее движение ἀνῆλθεν; мужской род местоимения сохраняет αὐτῷ.
- source_word: εἰς τὸ ὕψος
  choice: на высоту
  rationale: Естественная русская передача направленного движения к возвышенному месту без конкретизации, отсутствующей в греческом тексте.
