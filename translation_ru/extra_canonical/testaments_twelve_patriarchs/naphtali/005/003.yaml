  naturalness: После правки текст звучит естественно в современном литературном русском и сохраняет сжатую образность повествования.
  terminology: Имена «Левий» и «Иуда» переданы нормативно. «Схватил / схватил» здесь предпочтительнее стилистического варьирования «ухватился за», поскольку оба греческих глагола описывают захват, а второй не требует возвратной конструкции.
