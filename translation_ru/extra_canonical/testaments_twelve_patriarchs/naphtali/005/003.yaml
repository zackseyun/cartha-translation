base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/003.yaml
  text: And we all ran together, and Levi seized the sun, and Judah, arriving first, took hold of the moon; and both of them were lifted up with them.
translation:
  language: ru
  text: И мы все побежали вместе, и Левий схватил солнце, а Иуда, первым добежав, схватил луну; и оба они были подняты вместе с ними.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Вероятно, имеются в виду солнце и луна; греческое местоимение «ними» формально неоднозначно.
    reason: Поясняет вероятный референт αὐτοῖς, не заменяя неоднозначное местоимение в основном тексте.
lexical_decisions:
- source_word: ἐδράμομεν πάντες ὁμοῦ
  choice: мы все побежали вместе
  rationale: Прямо и естественно передаёт совместное действие всех участников.
- source_word: ἐκράτησε τὸν ἥλιον
  choice: схватил солнце
  rationale: Глагол κρατέω здесь обозначает овладение или крепкий захват; «схватил» сохраняет яркость образа.
- source_word: φθάσας
  choice: опередив его
  rationale: Причастие φθάσας выражает достижение цели прежде другого; добавленное «его» естественно указывает на Левия как подразумеваемого участника сравнения.
- source_word: ἔπιασε τὴν σελήνην
  choice: ухватился за луну
  rationale: Передаёт физический захват, при этом позволяет избежать однообразного повторения «схватил».
- source_word: ὑψώθησαν ἀμφότεροι σὺν αὐτοῖς
  choice: оба они поднялись вместе с ними
  rationale: Сохраняет пассивную форму и неоднозначную отсылку местоимения αὐτοῖς.
theological_decisions:
- issue: Неоднозначность того, к чему относится αὐτοῖς («с ними»)
  choice: сохранить местоименное выражение «вместе с ними» в основном тексте
  alternative: 'уточнить: «вместе с солнцем и луной»'
  rationale: Греческий текст допускает естественное понимание солнца и луны как референтов, но не называет их повторно; перевод не должен устранять эту формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; повествование передано ясно и образно, без архаизации. Пунктуация разделяет последовательные действия и сохраняет заключительную смысловую связь.
