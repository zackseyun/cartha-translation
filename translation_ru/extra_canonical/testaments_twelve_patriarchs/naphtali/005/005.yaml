  text: И оба — Левий и Иуда — подбежали и схватили их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσδραμόντες
  choice: подбежали
  rationale: Причастие от προστρέχω передаёт быстрое приближение бегом; в естественном русском повествовании уместна личная форма однородного сказуемого.
- source_word: ἐκράτησαν
  choice: схватили
  rationale: В данном контексте κρατέω означает физически схватить или задержать; «схватили» прямо передаёт действие, не добавляя оттенка длительного удерживания.
- source_word: αὐτούς
  choice: их
  rationale: Сохранена референциальная неоднозначность местоимения исходного отрывка без уточнения его антецедента.
- source_word: οἱ δύο ... Λευὶ καὶ Ἰούδας
  choice: эти двое, Левий и Иуда
  rationale: Сохранена аппозиционная конструкция, в которой двое затем названы по имени; указательное «эти» естественно связывает фразу с предшествующим контекстом.
