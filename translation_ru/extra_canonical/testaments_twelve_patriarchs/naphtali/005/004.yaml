base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/004.yaml
  text: And while Levi was like the sun, behold, a certain young man gives him twelve palm branches; and Judah became bright like the moon, and beneath their feet were twelve rays.
translation:
  language: ru
  text: И когда Левий был подобен солнцу, вот, некий юноша подаёт ему двенадцать пальмовых ветвей; Иуда же засиял, как луна, и под их ногами было двенадцать лучей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄντος τοῦ Λευὶ ὡς ὁ ἥλιος
  choice: когда Левий был подобен солнцу
  rationale: Передаёт генитивную конструкцию и образное сравнение естественным литературным русским языком.
- source_word: ἰδοὺ νέος τις
  choice: вот, некий юноша
  rationale: «Вот» сохраняет зрительную выразительность ἰδού, а «некий юноша» — неопределённость τις и возрастное обозначение νέος.
- source_word: ἐπιδίδωσιν
  choice: подаёт
  rationale: Настоящее время сохраняет живое повествовательное настоящее греческого текста; «подаёт» естественно описывает передачу предметов.
- source_word: βαΐα φοινίκων δώδεκα
  choice: двенадцать пальмовых ветвей
  rationale: Устойчивое и понятное русское обозначение пальмовых ветвей; число сохранено без изменения.
- source_word: ἐγένετο λαμπρὸς
  choice: стал сияющим
  rationale: Сохраняет значение наступившего состояния и световую образность прилагательного λαμπρός.
- source_word: ὑπὸ τοὺς πόδας αὐτῶν
  choice: под их ногами
  rationale: Местоимение во множественном числе сохранено без снятия возможной неоднозначности его соотнесения.
- source_word: δώδεκα ἀκτῖνες
  choice: двенадцать лучей
  rationale: Прямо передаёт световой образ ἀκτῖνες в контексте солнца и луны.
theological_decisions:
- issue: Соотнесение местоимения αὐτῶν («их»)
  choice: 'сохранить множественное число: «под их ногами»'
  alternative: 'уточнить: «под ногами Левия и Иуды»'
  rationale: Греческий текст использует местоимение без явного разъяснения; перевод не должен молча устранять референциальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством визионерского повествования. Сохранены «вот» и настоящее время «подаёт» как элементы живой сцены; синтаксис слегка упорядочен для ясности без устранения образной напряжённости оригинала.
