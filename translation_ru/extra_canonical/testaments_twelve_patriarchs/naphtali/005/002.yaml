    rationale: Это создаёт неверную привязку текста к источнику. Безопасная правка — обозначить текст как V.1; полную V.1 включать нельзя, поскольку её первое предложение отсутствует в черновике.
  - severity: medium
    issue: «Пусть каждый схватит» и «кто схватит» без дополнения грамматически возможны, но в современном русском заметно шероховаты.
    rationale: Греческое κρατήσατε/πιάσαντος допускает отсутствие явно названного объекта. Русское «возьмёт, сколько сможет» передаёт побуждение к завладению по мере сил, не добавляя «их».
  - severity: low
    issue: Частица «же» в «тому же, кто схватит» не имеет соответствия в греческом тексте.
