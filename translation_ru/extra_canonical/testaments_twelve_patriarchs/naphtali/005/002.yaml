  text: V. For in the fortieth year of my life, I saw a vision on the Mount of Olives, east of Jerusalem, that the sun and the moon were standing still. 2 And behold, Isaac, the father of my father, said to us, “Run up, and let each of you seize according to his strength; and the one who takes hold shall have the sun and the moon.”
translation:
  language: ru
  text: 'V.1 И вот Исаак, отец моего отца, сказал нам: «Подбегите, и пусть каждый возьмёт, сколько сможет; тому, кто возьмёт, будут принадлежать солнце и луна».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσδραμόντες
  choice: Подбегите
  rationale: 'Аористное причастие перед повелительной формой передаёт сопутствующее побуждение: сначала приблизиться бегом, чтобы затем схватить.'
- source_word: κρατήσατε
  choice: пусть каждый схватит
  rationale: Передаёт решительное завладение или удержание; объект, как и в греческом тексте, прямо не назван.
- source_word: κατὰ δύναμιν
  choice: по мере своих сил
  rationale: Естественное современное соответствие выражению «сообразно силе/способности».
- source_word: τοῦ πιάσαντος
  choice: тому, кто схватит
  rationale: Сохраняет повтор глагола близкого значения и не добавляет отсутствующего в греческом тексте прямого объекта.
- source_word: ἔσται ὁ ἥλιος καὶ ἡ σελήνη
  choice: достанутся солнце и луна
  rationale: Естественно выражает принадлежность или получение, подразумеваемые конструкцией с дательным по смыслу, без излишне буквального и тяжеловесного оборота.
theological_decisions:
- issue: Неуказанный объект глаголов «схватить»
  choice: Оставить объект невыраженным
  alternative: Добавить «их», относя местоимение к солнцу и луне
  rationale: Греческий текст не содержит прямого объекта при κρατήσατε и πιάσαντος; контекст допускает отнесение к солнцу и луне, но перевод не должен устранять эту формальную неоднозначность.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенной библейской интонацией. Родственная формула «отец моего отца» сохранена близко к оригиналу вместо более разговорного «дед».
