base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/006.yaml
  text: And behold, a bull was on the earth, having two great horns and the wings of an eagle on its back; and though we wanted to seize it, we were not able.
translation:
  language: ru
  text: И вот, на земле был бык с двумя большими рогами и орлиными крыльями на спине; мы хотели поймать его, но не смогли.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: И вот
  rationale: Сохраняет вводную формулу видения и привлекает внимание читателя естественным для русского повествования способом.
- source_word: ταῦρος
  choice: бык
  rationale: Прямое и однозначное соответствие греческому существительному.
- source_word: ἐπὶ τῆς γῆς
  choice: на земле
  rationale: Передаёт пространственное значение выражения без избыточного уточнения.
- source_word: δύο κέρατα μεγάλα
  choice: два больших рога
  rationale: Естественный русский порядок слов при полном сохранении числа и признака.
- source_word: πτέρυγας ἀετοῦ
  choice: орлиные крылья
  rationale: Естественная русская передача родительного определения «крылья орла»; не меняет образ и не уточняет, принадлежали ли они конкретному орлу.
- source_word: ἐπὶ νώτου αὐτοῦ
  choice: на спине
  rationale: Контекст ясно указывает на спину быка; местоимение по-русски избыточно.
- source_word: πιάσαι
  choice: поймать
  rationale: Передаёт попытку захватить живое существо; звучит естественнее, чем более книжное «схватить».
- source_word: οὐκ ἠδυνήθημεν
  choice: не смогли
  rationale: Кратко и точно передаёт невозможность осуществить намерение.
