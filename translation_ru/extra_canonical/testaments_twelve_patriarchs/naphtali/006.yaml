  text: 'And again, after seven days, I saw that my father Jacob was standing by the sea of Amnia[a], and we were with him. And behold, a ship came sailing by us, with sailors and pilots. And written on the ship was this: “The Ship of Jacob.”


    And our father said to us, “Come, let us go up into our ship.” And when we had entered, a violent storm arose, and a whirlwind of wind; and our father was separated from us, holding the rudders[b]. And we, being storm-tossed upon the sea, were driven along over the waters, while the ship was filled and battered by the waves, so that it was about to be broken up.


    But Joseph went away on a small boat, and we were separated on nine planks; and Levi and Judah were together. And we were scattered, all of us, to the ends of the earth[c]. But Levi, clothed in sackcloth, prayed to the Lord. And when the storm ceased, the ship reached the land as though in peace. And behold, our father came, and we all rejoiced with one accord.'
translation:
  language: ru
  text: '**Завещание Неффалима, 6**


    1 И снова, через семь дней, я увидел, что мой отец Иаков стоит у моря Амнии[a], а мы — вместе с ним. 2 И вот, к нам под парусами приблизился корабль без моряков и кормчих. На нём было написано: «Корабль Иакова».


    3 Наш отец сказал нам: «Идём, взойдём на наш корабль». 4 Когда мы вошли в корабль, разразилась жестокая буря и налетел сильный вихрь. Наш отец отделился от нас, держась за «шеи»[b]. 5 А нас, застигнутых бурей, понесло по открытому морю. Корабль наполнился водой; его било могучими волнами, так что он едва не разбился.


    6 Иосиф же уплыл на небольшой лодке, а мы оказались порознь на девяти досках; только Левий и Иуда были вместе. 7 Так все мы были рассеяны до краёв земли[c]. 8 Левий, облачившись во вретище, молился Господу. 9 Когда буря утихла, судно достигло суши, словно в полном спокойствии. 10 И вот, пришёл наш отец, и все мы единодушно возрадовались.


    [a] Местонахождение моря Амнии точно не установлено; в переводе сохранена передача греческого названия без попытки отождествить его с известной местностью.


    [b] Греческое слово буквально означает «шеи», но в этом морском контексте смысл выражения неясен; возможно, речь идёт о частях рулевого устройства.


    [c] Рассеяние «до краёв земли», вероятно, имеет символический смысл, однако здесь оно передано как часть сна Неффалима без дополнительного истолкования.'
  philosophy: optimal-equivalence
  footnotes:
