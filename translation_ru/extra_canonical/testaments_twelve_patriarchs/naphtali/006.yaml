lexical_decisions:
- source_word: θάλασσα Ἀμνείας
  choice: море Амнии
  rationale: Сохраняет греческую форму неустановленного географического названия и не предлагает недоказанного отождествления.
- source_word: ἐκτὸς ναυτῶν καὶ κυβερνητῶν
  choice: без моряков и кормчих
  rationale: ἐκτός естественно означает отсутствие моряков и управляющих судном; это чтение следует представленному греческому тексту, несмотря на противоположное решение английского консультационного слоя.
- source_word: ἁρμενίζον
  choice: под парусами приблизился
  rationale: Передаёт движение судна под парусом живым и естественным русским выражением.
- source_word: κυβερνητῶν
  choice: кормчих
  rationale: В морском контексте слово обозначает управляющих судном; «кормчие» сохраняет достоинство и библейскую окраску без неясного современного значения слова «пилоты».
- source_word: χειμὼν σφοδρός
  choice: жестокая буря
  rationale: В морском контексте χειμών означает бурю, а σφοδρός подчёркивает её силу.
- source_word: λαῖλαψ ἀνέμου μέγας
  choice: сильный вихрь
  rationale: Естественно передаёт стремительный разрушительный ветер, не дублируя неуклюже слово «ветер».
- source_word: ἀφίσταται
  choice: оказался отделён от нас
  rationale: Передаёт возникшее во сне разделение, не приписывая Иакову намеренного ухода.
- source_word: τοὺς αὐχένας
  choice: рулевые вёсла
  rationale: Буквальное значение «шеи» здесь непонятно; морской контекст предполагает часть рулевого устройства. Неуверенность сохранена в сноске.
- source_word: ἐπὶ τὸ πέλαγος ἐφερόμεθα
  choice: нас понесло по открытому морю
  rationale: πέλαγος обозначает открытое море, а пассивная конструкция подчёркивает беспомощность людей перед бурей.
- source_word: ἐν τρικυμίαις περιρησσόμενον
  choice: его било могучими волнами
  rationale: Передаёт образ судна, яростно терзаемого тяжёлым волнением, естественным современным русским языком.
- source_word: ἀκάτιον
  choice: небольшая лодка
  rationale: Точный общий эквивалент для малого судна без неоправданно конкретного определения его типа.
- source_word: σανίδων ἐννέα
  choice: девять досок
  rationale: Сохраняет конкретное число и образ отдельных частей разбитого судна.
- source_word: σάκκος
  choice: вретище
  rationale: Устоявшийся и понятный в библейском регистре термин для грубой покаянной одежды.
theological_decisions:
- issue: Символика рассеяния во сне
  choice: Передать крушение и рассеяние прямо как повествование о сне
  alternative: Явно истолковать их как будущее изгнание или рассеяние колен Израиля
  rationale: Греческий текст не разъясняет символы внутри главы; перевод не должен подменять образ его вероятным толкованием.
- issue: Передача Κυρίου в иудейском завещании
  choice: Господу
  alternative: ГОСПОДУ; Владыке
  rationale: Греческий текст содержит κύριος, а не непосредственно засвидетельствованный тетраграмматон; «Господь» сохраняет традиционный благоговейный регистр без излишнего уточнения.
- issue: Образ чудесного корабля
  choice: без моряков и кормчих
  alternative: с моряками и кормчими
  rationale: Предоставленный греческий текст имеет ἐκτός, обычно означающее «без»; необычность образа не следует устранять вслед за английским слоем.
translation_notes:
  register: Современный литературный русский язык с умеренным библейским достоинством. Синтаксис сделан ясным для обычного читателя; сохранены традиционные имена «Неффалим», «Иаков», «Иосиф», «Левий», «Иуда», а также слова «Господь», «вретище» и «возрадовались». Подлинные неясности исходного текста вынесены в сноски, а символика сна не раскрывается конфессионально или догматически.
