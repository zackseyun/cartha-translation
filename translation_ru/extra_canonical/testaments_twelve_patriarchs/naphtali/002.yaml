  text: '**Завещание Неффалима, глава 2**


    **1.** Я был лёгок на ногу, словно олень, и отец мой Иаков посылал меня со всяким поручением; он и благословил меня, уподобив оленю.[a]


    **2.** Ведь как горшечник знает, сколько вмещает сосуд, и сообразно этому берёт для него глину, так и Господь создаёт тело сообразно образу духа и сообразно способности тела помещает в него дух.


    **3.** И нет в этом недостатка даже на треть волоса, ибо всякое творение создано по весу, мере и правилу.


    **4.** И как горшечник знает назначение каждого сосуда и то, насколько он пригоден, так и Господь знает тело: до каких пор оно устоит в добре и когда придёт ко злу.


    **5.** Ибо нет ни создания, ни замысла, которого не знал бы Господь: ведь всякого человека Он сотворил по Своему образу.


    **6.** Какова сила человека, таково и слово его — либо в законе Господа, либо в законе Велиара.[b]


    **7.** И как отделены друг от друга свет и тьма, зрение и слух, так различаются мужчина и мужчина, женщина и женщина; и нельзя сказать, будто одно лицо во всём подобно другому.[c]


    **8.** Ибо Бог всё устроил прекрасным и в должном порядке: пять чувств поместил в голове, шею соединил с головой и добавил к ней волосы для красоты и славы; затем дал сердце для разумения, живот — для выделения, желудок — для перемалывания пищи, дыхательное горло — для дыхания, печень — для гнева, желчь — для горечи, селезёнку — для смеха, почки — для хитрости, чресла — для силы, бок — для сна, поясницу — для крепости; и так далее.[d]


    **9.** Итак, дети мои, пусть все ваши дела совершаются в должном порядке, ради добра и в страхе Божьем. Не делайте ничего беспорядочного — ни из пренебрежения, ни вне подобающего времени.


    **10.** Ведь если скажешь глазу: «Слушай», — он не сможет. Так и вы, пребывая во тьме, не можете творить дела света.


    [a] Начало главы в греческом тексте сохранилось с разночтениями. Общий смысл состоит в том, что Неффалим был быстроног, подобно оленю, и потому исполнял поручения отца.


    [b] Велиар — традиционное имя силы, противостоящей Богу и Его закону, в древней иудейской литературе.


    [c] Греческий текст стиха местами неустойчив. По ходу рассуждения, где различаются назначение органов и чувств, вероятнее всего, противопоставлены зрение и слух; заключительная фраза также передана по смыслу повреждённого текста.


    [d] Перечень частей тела и их назначений дошёл в текстуально повреждённом виде. Перевод следует основному смыслу греческого текста, сохраняя главную мысль: Бог определил каждой части тела её место и назначение.'
  philosophy: optimal-equivalence
