lexical_decisions:
- source_word: κοῦφος τοῖς ποσίν ὡς ἡ ἔλαφος
  choice: лёгок на ногу, словно олень
  rationale: Передаёт буквальный образ лёгкости и быстроты движений естественным современным русским выражением.
- source_word: ἀγγελία
  choice: поручение
  rationale: В контексте речь идёт о практических поручениях, включая доставку известий; слово не следует сужать только до «сообщения».
- source_word: πρὸς ὁμοίωσιν τοῦ πνεύματος
  choice: сообразно образу духа
  rationale: Сохраняет идею соответствия тела духу, не превращая её в позднейшую систематическую антропологию.
- source_word: πρὸς τὴν δύναμιν τοῦ σώματος τὸ πνεῦμα ἐπιτίθησιν
  choice: сообразно способности тела помещает в него дух
  rationale: δύναμις здесь обозначает вместимость или способность, а ἐπιτίθησιν — размещение духа применительно к телу.
- source_word: σταθμῷ καὶ μέτρῳ καὶ κανόνι
  choice: по весу, мере и правилу
  rationale: Сохранена трёхчастная формула упорядоченности творения; κανών передан как мерило или правило.
- source_word: διαρκέσει ἐν τῷ ἀγαθῷ
  choice: устоит в добре
  rationale: Формулировка сохраняет нравственную и экзистенциальную широту выражения, не сводя добро к благополучию.
- source_word: ἔννοια
  choice: замысел
  rationale: В контексте божественного знания и творения слово обозначает мысль, намерение или замысел.
- source_word: ὁ λόγος αὐτοῦ
  choice: слово его
  rationale: Перевод следует засвидетельствованному λόγος, не подменяя его реконструированным «делом», хотя контекст допускает связь слова с нравственным образом действий.
- source_word: νόμῳ Κυρίου ... νόμῳ τοῦ Βελίαρ
  choice: в законе Господа ... в законе Велиара
  rationale: Прямо сохраняется резкое противопоставление двух сфер нравственной принадлежности и собственное имя Велиара.
- source_word: δράσεώς τε καὶ ἀκοῆς
  choice: зрение и слух
  rationale: Передача учитывает текстуальную неустойчивость и ближайший контекст, посвящённый различным телесным чувствам и их функциям.
- source_word: ἄτακτον ... ἔξω καιροῦ αὐτοῦ
  choice: беспорядочного ... вне подобающего времени
  rationale: Сохраняется связь нравственного порядка как с надлежащим устройством, так и с подходящим временем.
theological_decisions:
- issue: Соотношение тела и духа в стихах 2–4
  choice: Передать установленное Богом соответствие между телом и духом без определения их отношений в категориях позднейшей догматики.
  alternative: Истолковать отрывок как строгий метафизический дуализм тела и души.
  rationale: Образ горшечника подчёркивает соразмерность, способность и божественный порядок, но не даёт оснований устранять присущую тексту антропологическую напряжённость.
- issue: «Закон Господа» и «закон Велиара»
  choice: Сохранить Велиара как названную противостоящую силу и передать обе стороны словом «закон».
  alternative: Обезличить Велиара и перевести как абстрактное «зло» или «нечестие».
  rationale: Греческий текст представляет Велиара собственным именем и формулирует нравственное противопоставление как две сферы принадлежности.
- issue: Божественное знание творения в стихе 5
  choice: Передать, что Господу известно всякое создание и всякий замысел, сохранив связь с сотворением человека по Божьему образу.
  alternative: Сузить утверждение только до предведения человеческих поступков.
  rationale: Текст говорит шире — о Божьем знании творения и замысла; его не следует ограничивать одной системой учения о предведении.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего наставления. Синтаксис умеренно приподнятый, но понятный обычному читателю. Образы горшечника, оленя, света и тьмы сохранены; повреждённые места не догматизированы и отмечены сносками. Переведены только стихи 1–10, представленные в исходном греческом свидетельстве для этой главы.
