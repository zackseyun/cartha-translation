base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001.yaml
  text: 'A copy of the testament of Naphtali, the eighth son of Jacob, which he set in order at the time of his departure, in the hundred and thirtieth year of his life.


    2 When his sons had gathered together in the seventh month, on the first day of the month, he made a feast for them. 3 And in the morning, after he awoke, he said to them, “I am dying”; but they did not believe him. 4 And while blessing and glorifying the Lord, he grew strong and said, “After the feast yesterday, my flesh failed and died.”


    5 Then he began to speak: “Hear, my children, sons of Naphtali; hear the words of your father. 6 I was born from Bilhah, because Rachel acted with cunning and gave Bilhah to Jacob in her place; and Bilhah conceived and bore me upon Rachel’s knees, and for this reason she called my name Naphtali. 7 For Rachel loved me greatly, because I was born upon her knees; and when I was still a tender child she kissed me, saying, ‘May I be given a brother from my own womb, like you.’ 8 Therefore Joseph also was like me in every way, according to the prayers of Rachel.”'
translation:
  language: ru
  text: 'Завещание Неффалима, восьмого сына Иакова и Валлы


    1 Вот запись завещания Неффалима, которое он составил перед своим уходом из жизни, на сто тридцатом году своей жизни.


    2 В первый день седьмого месяца, когда его сыновья собрались вместе, он устроил для них пир. 3 Наутро, пробудившись, он сказал им: «Я умираю». Но они ему не поверили. 4 Тогда он, прославляя Господа, укрепился и сказал: «После вчерашнего пира плоть моя умерла».


    5 И он начал говорить: «Послушайте, дети мои, сыновья Неффалима, послушайте слова вашего отца. 6 Я родился от Валлы. Рахиль поступила хитро: вместо себя она дала Иакову Валлу, и та зачала и родила меня на коленях Рахили. Потому Рахиль и нарекла мне имя Неффалим. 7 Она очень любила меня, потому что я родился на её коленях. Когда я был ещё совсем мал, она целовала меня и говорила: „Да будет дан мне из моей утробы твой брат, подобный тебе“. 8 Поэтому Иосиф и был во всём подобен мне — по благословениям Рахили[a]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «по благословениям Рахили»; выражение допускает понимание благословений как её молитвенных пожеланий.'
    reason: Греческое εὐλογίας буквально означает «благословения», тогда как контекст может указывать на пожелание или молитву Рахили.
lexical_decisions:
- source_word: διαθήκη
  choice: завещание
  rationale: В данном произведении слово обозначает предсмертное наставление и распоряжение патриарха; «завещание» естественно передаёт жанр и сохраняет связь с названием.
- source_word: ἐν καιρῷ τῆς ἐξόδου αὐτοῦ
  choice: перед своим уходом из жизни
  rationale: «Исход/уход» здесь служит эвфемизмом смерти; перевод сохраняет образ ухода, но делает смысл понятным современному читателю.
- source_word: ἐποίησε δεῖπνον
  choice: устроил для них пир
  rationale: δεῖπνον может означать вечернюю трапезу или праздничное угощение; контекст собрания сыновей перед смертью допускает естественное русское «пир».
- source_word: ἐκραταιώθη
  choice: укрепился
  rationale: Передаёт буквальный смысл обретения силы без добавления отсутствующего в приведённом греческом тексте «благословляя».
- source_word: ἀπέθανεν ἡ σάρξ μου
  choice: плоть моя умерла
  rationale: Сохраняет резкое и парадоксальное выражение греческого текста, не смягчая его добавлением «ослабела».
- source_word: ἐπὶ τῶν γονάτων τῆς Ῥαχιήλ
  choice: на коленях Рахили
  rationale: Сохраняет древний образ признания ребёнка и явную связь с повествованием Бытия.
- source_word: Δοίη μοι ἀδελφόν σου
  choice: Пусть Бог даст мне… твоего брата
  rationale: Глагол стоит в форме пожелания без выраженного подлежащего; в таком благочестивом пожелании подразумевается Бог. «Твоего брата» точнее передаёт ἀδελφόν σου.
- source_word: εὐλογίας
  choice: благословениям
  rationale: Это прямое значение засвидетельствованного слова; необычность выражения сохранена, а возможное понимание отмечено в сноске.
theological_decisions:
- issue: Неявное подлежащее в пожелании Рахили
  choice: «Пусть Бог даст мне…»
  alternative: «Да будет дан мне…»
  rationale: Указание Бога естественно раскрывает подразумеваемого деятеля, не привнося конфессиональной особенности и не меняя смысла молитвенного пожелания.
- issue: Высказывание «плоть моя умерла»
  choice: Сохранено буквально
  alternative: «Плоть моя ослабела и умерла» или «тело моё отказало»
  rationale: В приведённом греческом тексте присутствует только глагол «умерла»; буквальная формулировка сохраняет богословскую и антропологическую напряжённость образа.
- issue: εὐλογίας Рахили
  choice: «по благословениям Рахили» с пояснительной сноской
  alternative: «по молитвам Рахили»
  rationale: Основной текст следует засвидетельствованному греческому чтению и не устраняет его неоднозначность молча.
translation_notes:
  register: 'Современный литературный русский язык с достоинством завещательной речи. Имена переданы в привычной русской библейской форме: Неффалим, Иаков, Валла, Рахиль, Иосиф. Синтаксис упрощён там, где греческая фраза была тяжеловесна, но повторы обращения и парадоксальные формулировки сохранены.'
