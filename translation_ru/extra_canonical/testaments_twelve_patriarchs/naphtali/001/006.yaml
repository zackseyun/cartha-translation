base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/006.yaml
  text: I was born from Bilhah, because Rachel acted with cunning and gave Bilhah to Jacob in her place; and Bilhah conceived and bore me on Rachel’s knees, and for this reason she called my name Naphtali.
translation:
  language: ru
  text: 'Я родился от Валлы, потому что Рахиль поступила хитро: вместо себя она отдала Валлу Иакову. Валла зачала и родила меня на коленях Рахили, и потому Рахиль дала мне имя Неффалим.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγεννήθην ἀπὸ Βάλλας
  choice: Я родился от Валлы
  rationale: Естественно передаёт происхождение по матери, сохраняя прямую форму греческого выражения.
- source_word: ἐν πανουργίᾳ ἐποίησε Ῥαχιήλ
  choice: Рахиль поступила хитро
  rationale: Передаёт наречное значение выражения без усиления до однозначно отрицательного «коварно»; при этом сохраняется оценочный оттенок πανουργία.
- source_word: ἀντʼ αὐτῆς
  choice: вместо себя
  rationale: Точно и естественно обозначает передачу Валлы Иакову как заместительницы Рахили.
- source_word: ἐπὶ τῶν γονάτων τῆς Ῥαχιήλ
  choice: на коленях Рахили
  rationale: Сохраняет конкретный древний образ и его возможный юридико-родственный смысл, не объясняя его внутри текста.
- source_word: ἐκάλεσε τὸ ὄνομά μου Νεφθαλείμ
  choice: дала мне имя Неффалим
  rationale: Современная русская формулировка вместо буквального «назвала имя моё»; традиционная русская форма имени облегчает узнавание персонажа.
theological_decisions:
- issue: Смысл рождения «на коленях Рахили»
  choice: Сохранить образ буквально без толкования
  alternative: Передать как усыновление или признание ребёнка сыном Рахили
  rationale: Греческий текст описывает действие образно и не формулирует его правовое или богословское значение напрямую.
- issue: Нравственная оценка действий Рахили
  choice: «поступила хитро»
  alternative: «поступила коварно» или нейтральное «устроила так»
  rationale: Выбранная формулировка сохраняет оценочный оттенок πανουργίᾳ, но не делает обвинение сильнее, чем позволяет контекст.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис упрощён для ясности, но последовательность событий и повтор имени Валлы сохранены. Имя Νεφθαλείμ передано традиционной русской библейской формой «Неффалим».
