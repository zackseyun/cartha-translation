  rationale: Добавлено пропущенное имя Валлы в соответствии с греческим заглавием. Синтаксис обстоятельства времени слегка выправлен для естественного современного русского, без замены образного «ухода» прямым указанием на смерть. Смысл, жанровое обозначение и возрастная формула сохранены.
