  text: A copy of the testament of Naphtali, the eighth son of Jacob, which he ordained at the time of his departure, in the hundred and thirtieth year of his life.
translation:
  language: ru
  text: Копия завещания Неффалима, восьмого сына Иакова и Валлы, которое он составил, когда пришло время его ухода, на сто тридцатом году жизни.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντίγραφον
  choice: копия
  rationale: Прямо передаёт значение письменной копии или списка документа.
- source_word: διαθήκης
  choice: завещания
  rationale: В данном литературном жанре слово обозначает предсмертное завещание-наставление патриарха.
- source_word: διέθετο
  choice: составил
  rationale: Естественный современный русский глагол для оформления завещания; он передаёт действие по составлению документа без неуместного оттенка церковного установления.
- source_word: ἐν καιρῷ τῆς ἐξόδου αὐτοῦ
  choice: когда пришло время ему уйти
  rationale: Сохраняет эвфемистическую открытость слова ἔξοδος, которое может подразумевать уход из жизни, не заменяя его прямо словом «смерть».
- source_word: ἐν ἔτει ἑκατοστῷ καὶ τριακοστῷ τῆς ζωῆς αὐτοῦ
  choice: на сто тридцатом году его жизни
  rationale: Точно и идиоматично передаёт указание на год жизни, не превращая его в утверждение о числе уже исполнившихся лет.
theological_decisions:
- issue: Значение «ухода» Неффалима
  choice: Сохранён эвфемизм «уйти»
  alternative: «перед смертью»
  rationale: Греческое ἔξοδος в контексте, вероятно, указывает на приближение смерти, однако прямое называние смерти устранило бы образность и некоторую смысловую открытость оригинала.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным тоном завещательного текста. Конструкция «составил завещание» предпочтена более архаичным или конфессионально окрашенным вариантам. Заголовочное определение «восьмого сына Иакова» сохранено в соответствии с исходным заглавием и консультационным английским текстом; упоминание Валлы относится к расширенному заглавию источника, а не к собственно тексту 1:1.
