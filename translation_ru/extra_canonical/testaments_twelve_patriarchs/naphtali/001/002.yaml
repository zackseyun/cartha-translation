  text: 2. Συνελθόντων⁸ τῶν υἱῶν αὐτοῦ⁹ ἐν τῷ¹⁰ ἑβδόμῳ μηνί, μιᾷ¹¹ τοῦ μηνός¹², ἐποίησε δεῖπνον αὐτοῖς¹³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/002.yaml
  text: When his sons had gathered together in the seventh month, on the first day of the month, he made a feast for them.
translation:
  language: ru
  text: Когда его сыновья собрались в седьмом месяце, в первый день месяца, он устроил для них пир.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνελθόντων
  choice: Когда … собрались
  rationale: Греческий родительный абсолют передан естественным русским придаточным времени, с сохранением предшествующего обстоятельства.
- source_word: μιᾷ τοῦ μηνός
  choice: в первый день месяца
  rationale: Буквально «в один [день] месяца»; в данном календарном выражении естественное значение — первый день месяца.
- source_word: ἐποίησε δεῖπνον
  choice: устроил … пир
  rationale: Передаёт приготовление праздничной общей трапезы; «пир» здесь точнее контекстуально, чем нейтральный «ужин».
- source_word: αὐτοῖς
  choice: для них
  rationale: Естественная русская передача дательного лица, в пользу которого была устроена трапеза.
