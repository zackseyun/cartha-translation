lexical_decisions:
- source_word: Ἥρξατο δὲ λέγειν
  choice: Тогда он начал говорить
  rationale: Передаёт начало речи естественным русским оборотом; δέ здесь служит переходом в повествовании.
- source_word: Ἀκούσατε
  choice: Послушайте
  rationale: Повтор повелительной формы сохранён; «послушайте» естественно вводит отцовское наставление и включает смысл внимательного слушания.
- source_word: τέκνα μου
  choice: дети мои
  rationale: Прямое и естественное соответствие греческому обращению.
- source_word: υἱοὶ Νεφθαλείμ
  choice: сыновья Неффалима
  rationale: Сохраняет родовое обращение к потомкам патриарха, а не сужает его до непосредственных сыновей говорящего.
- source_word: λόγους πατρὸς ὑμῶν
  choice: слова вашего отца
  rationale: Формально и естественно передаёт родительный оборот без добавочного толкования.
