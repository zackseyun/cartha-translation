  text: And in the morning, after he awoke, he said to them, “I am dying”; but they did not believe him.
translation:
  language: ru
  text: 'А утром, пробудившись, он сказал им: «Я умираю». Но они ему не поверили.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πρωί
  choice: утром
  rationale: Естественная современная передача обстоятельства времени без лишнего уточнения.
- source_word: μετὰ τὸ ἐξυπνισθῆναι αὐτόν
  choice: пробудившись
  rationale: Деепричастная конструкция кратко и точно передаёт предшествующее пробуждение того же субъекта.
- source_word: Ἀποθνήσκω
  choice: Я умираю
  rationale: Настоящее время сохраняет непосредственный смысл греческой формы и не заменяет её предсказанием «я умру».
- source_word: οὐκ ἐπίστευσαν αὐτῷ
  choice: они ему не поверили
  rationale: В данном контексте πιστεύω с дательным обозначает доверие сказанному человеком; «не поверили ему» естественно передаёт этот смысл.
