  text: 3. *Καὶ τὸ πρωὶ¹⁴ μετὰ τὸ ἐξυπνισθῆναι¹⁵ αὐτὸν εἶπεν αὐτοῖς¹⁶ ὅτι¹⁷ Ἀποθνήσκω· καὶ¹⁸ οὐκ ἐπίστευσαν¹⁹ αὐτῷ.
