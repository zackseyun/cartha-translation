  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/007.yaml
  text: For Rachel loved me greatly, because I was born upon her knees; and while I was still tender she kept kissing me, saying, ‘May I be given from my own womb a brother like you.’
translation:
  language: ru
  text: 'Ибо Рахиль очень любила меня, потому что я родился у неё на коленях; и, пока я был ещё совсем мал, она целовала меня, говоря: «Да будет дан мне брат тебе — из моего чрева, подобный тебе».


    [a] Буквально: «Да даст мне брата тебе из моего чрева, по тебе». В греческом тексте податель дара не назван; «брат тебе» означает брата для Неффалима, а «из моего чрева» относится к происхождению этого брата.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «Да даст мне брата тебе из моего чрева, по тебе». В греческом тексте податель дара не назван; «брат тебе» означает брата для Неффалима, а «из моего чрева» относится к происхождению этого брата.'
    reason: Сохраняет неназванный субъект δοίη и поясняет необычный для русского, но важный синтаксис пожелания без внесения слова «Бог» или глагола «родить».
lexical_decisions:
- source_word: ἐπὶ τῶν γονάτων αὐτῆς
  choice: у неё на коленях
  rationale: Естественно передаёт греческий оборот и сохраняет вероятную отсылку к обычаю символического принятия ребёнка.
- source_word: ἔτι ἁπαλὸν ὄντα με
  choice: пока я был ещё совсем мал
  rationale: ἁπαλός буквально означает «нежный, хрупкий»; в отношении ребёнка современное русское «совсем мал» ясно передаёт возраст и беспомощность без неестественной буквальности.
- source_word: κατεφίλει
  choice: всё целовала
  rationale: Имперфект с усиленным глаголом указывает на повторяющееся или продолжительное ласковое действие.
- source_word: ἀδελφόν σου ... κατά σε
  choice: твоего брата, подобного тебе
  rationale: Сохраняет прямое отношение будущего сына к Неффалиму и выраженное κατά σε уподобление ему.
- source_word: ἐκ τῆς κοιλίας μου
  choice: родить
  rationale: В контексте пожелания ребёнка естественно выражает смысл «из моего чрева»; буквальная форма пояснена в примечании.
theological_decisions:
- issue: Не названный в форме δοίη податель желаемого ребёнка
  choice: '[Бог] в квадратных скобках'
  alternative: 'Оставить субъект полностью невыраженным: «Да будет мне дано родить…»'
  rationale: В контексте подразумевается Бог, однако в греческом тексте субъект прямо не назван. Скобки одновременно делают русскую фразу естественной и сохраняют прозрачность текстового дополнения.
translation_notes:
  register: Современный литературный русский с достойной, слегка торжественной формой пожелания «Да даст». Повторность κατεφίλει передана разговорно понятным, но не сниженным оборотом «всё целовала». В поданном греческом тексте нет отдельной фразы «и Рахиль родила меня», поэтому она не включена, несмотря на указанную историю английской редакции.
