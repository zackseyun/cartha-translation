  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/004.yaml
  text: And while blessing and glorifying the Lord, he grew strong and said, “After yesterday’s meal, my flesh died.”
translation:
  language: ru
  text: 'И, прославляя Господа, он укрепился и сказал: «После вчерашней трапезы плоть моя умерла».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζων
  choice: прославляя
  rationale: Передаёт причастие настоящего времени как действие, сопровождающее последующее укрепление; в представленном греческом тексте нет отдельного глагола со значением «благословлять».
- source_word: ἐκραταιώθη
  choice: укрепился
  rationale: Сохраняет значение обретения силы и естественно звучит по-русски, не уточняя без достаточных оснований, была ли сила дарована извне.
- source_word: δεῖπνον
  choice: трапеза
  rationale: Обозначает приём пищи; «трапеза» соответствует достоинству регистра и не превращает его в пир или празднество.
- source_word: ἡ σάρξ μου
  choice: плоть моя
  rationale: Буквально сохраняет σάρξ и возможную антропологическую или богословскую напряжённость; более свободное «моё тело» её сгладило бы.
theological_decisions:
- issue: Смысл выражения «плоть моя умерла»
  choice: Сохранена буквальная формулировка без поясняющей интерпретации.
  alternative: «Тело моё обессилело и умерло» или «я умер».
  rationale: Греческий текст прямо говорит ἀπέθανεν ἡ σάρξ μου; добавление идеи изнеможения или замена на личное «я» устранили бы необычность и возможную богословскую значимость выражения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Порядок «плоть моя» выбран ради достоинства речи и смыслового акцента; архаичные формы не используются.
