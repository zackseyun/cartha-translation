base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/004/001.yaml
  text: These things I say to you, my children, because I have learned in the writing of Enoch that you too will depart from the Lord, walking in all the lawlessness of the nations and doing all the wickedness of Sodom.
translation:
  language: ru
  text: Я говорю вам это, дети мои, потому что в писании Еноха я узнал, что и вы отступите от Господа, следуя всякому беззаконию народов и совершая всякое зло содомлян.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ γραφῇ Ἐνώχ
  choice: из писания Еноха
  rationale: По-русски источник полученного знания естественно обозначается предлогом «из»; «писание» сохраняет значение письменного произведения без обязательного отождествления с каноническим Писанием.
- source_word: ἀποστήσεσθε ἀπὸ Κυρίου
  choice: отступите от Господа
  rationale: «Отступите» точно передаёт отделение и религиозную измену, заложенные в ἀφίστημι с ἀπό, не добавляя усиления.
- source_word: πορευόμενοι κατὰ πᾶσαν ἀνομίαν ἐθνῶν
  choice: следуя всякому беззаконию народов
  rationale: Причастие передано деепричастной конструкцией; «следуя» естественно выражает образ жизни по образцу беззакония народов.
- source_word: πᾶσαν πονηρίαν Σοδόμων
  choice: всякое зло Содома
  rationale: «Зло» передаёт широкое значение πονηρία, не сужая его до конкретного вида порока; единственное число «Содома» соответствует греческой форме в данном издании.
- source_word: καίγε ὑμεῖς
  choice: и вы
  rationale: Сочетание указывает, что потомки Неффалима также отступят; русское «и вы» сохраняет этот присоединительно-усилительный оттенок без избыточного «непременно».
theological_decisions:
- issue: Характер предсказанного отступления
  choice: «отступите от Господа»
  alternative: «отпадёте от Господа»
  rationale: Выбрана нейтральная и традиционно понятная формулировка, которая сохраняет серьёзность религиозного отступления, но не навязывает специальной доктрины об окончательности отпадения.
- issue: Объём «зла Содома»
  choice: сохранено обобщённое выражение
  alternative: уточнить конкретный грех Содома
  rationale: Греческий текст говорит широко о πονηρία и не определяет здесь отдельный вид греха, поэтому конкретизация была бы толкованием.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным завещательным тоном. Синтаксис близок к греческому, но выстроен естественно для русского читателя; неоднозначные нравственно-богословские выражения не конкретизированы сверх источника.
