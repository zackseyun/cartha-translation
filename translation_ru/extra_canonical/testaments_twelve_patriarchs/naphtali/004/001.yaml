review_pass:
  verdict: revise
  source_fidelity: 'Черновик в целом точно передаёт синтаксис и смысл греческого текста: обращение к детям, знание из писания Еноха, предсказание отступления от Господа и два последующих деепричастных оборота сохранены. Однако греческое Σοδόμων имеет форму родительного множественного числа; формулировка «зло Содома» сглаживает этот нюанс до обозначения города. Безопаснее передать его как «зло содомлян», не уточняя характер этого зла.'
  naturalness: Текст литературен и понятен. «Я говорю вам это» несколько прямее соответствует Ταῦτα λέγω ὑμῖν, чем разговорное «Вот что я говорю вам». «Совершая» естественно сочетается со «злом» и сохраняет значение ποιήσετε без излишне архаичного оттенка «творя».
  terminology: «Господь», «отступите от Господа», «беззаконие» и «писание Еноха» уместны. Строчная буква в «писании» не отождествляет произведение Еноха с библейским Писанием. «Зло содомлян» сохраняет обобщённость πονηρία и не навязывает конкретного толкования.
  issues:
  - severity: medium
    issue: Σοδόμων передано как «Содома»
    rationale: В представленном греческом тексте стоит родительный множественного числа Σοδόμων. Хотя название города в русском возможно по смыслу, «содомлян» лучше сохраняет грамматический и коллективный оттенок источника. Также пояснение в черновике о якобы единственном числе греческой формы неточно.
  revised_text: Я говорю вам это, дети мои, потому что в писании Еноха я узнал, что и вы отступите от Господа, следуя всякому беззаконию народов и совершая всякое зло содомлян.
