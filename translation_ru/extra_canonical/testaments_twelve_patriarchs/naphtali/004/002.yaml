base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/004/002.yaml
  text: And the Lord will bring captivity upon you, and there you will serve your enemies, and you will be afflicted with every kind of evil and tribulation, until the Lord has consumed you all.
translation:
  language: ru
  text: И Господь наведёт на вас плен, и там[a] вы будете служить своим врагам. Вы будете терпеть всевозможные бедствия и скорби[b], пока Господь не истребит всех вас.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «там» в греческом тексте имеет текстологически неуверенное засвидетельствование.
    reason: В издании ἐκεῖ заключено в специальные скобки, указывающие на сомнение в чтении.
  - marker: b
    text: 'Греческая формулировка этой части стиха текстологически и синтаксически не вполне ясна; возможно также: «вы будете жить среди всевозможных бедствий и скорбей».'
    reason: Форма συναναστραφήσεσθε отмечена издателем как проблемная. Основной перевод следует контекстуальному пониманию, отражённому и в английском консультационном тексте, не скрывая альтернативу.
lexical_decisions:
- source_word: ἐπάξει … αἰχμαλωσίαν
  choice: наведёт … плен
  rationale: 'Сохраняет каузативный смысл греческого оборота: Господь приводит на адресатов состояние плена.'
- source_word: δουλεύσετε
  choice: будете служить
  rationale: Передаёт принудительное подчинение в плену, не сужая значение до конкретного вида рабского труда.
- source_word: πάσῃ κακώσει καὶ θλίψει
  choice: среди всевозможных бедствий и скорбей
  rationale: «Всевозможных» естественно передаёт обобщающее πάσῃ; «бедствия и скорби» сохраняет сочетание внешнего несчастья и тяжёлого притеснения.
- source_word: συναναστραφήσεσθε
  choice: будете жить среди
  rationale: Глагол буквально связан с пребыванием и образом жизни среди чего-либо; такой перевод сохраняет образ греческого текста, не превращая его без необходимости в пассивное «будете подвергнуты».
- source_word: ἀναλώσει
  choice: истребит
  rationale: Передаёт сильное значение полного уничтожения или поглощения в данном контексте угрозы.
theological_decisions:
- issue: Господь как деятель суда
  choice: «Господь наведёт… пока Господь не истребит»
  alternative: 'Смягчить причинность: «Господь допустит плен… пока вы не погибнете»'
  rationale: Греческий текст прямо называет Господа субъектом обоих глаголов; перевод сохраняет эту богословскую напряжённость.
- issue: Объём выражения πάντας ὑμᾶς
  choice: «всех вас»
  alternative: «вас окончательно»
  rationale: Сохраняется прямое указание на всех адресатов, а не только идея полноты действия.
translation_notes:
  register: Современный литературный русский язык с торжественным, но понятным звучанием. Синтаксис разделён на два предложения для ясности; повтор «Господь» сохранён вслед за греческим текстом.
