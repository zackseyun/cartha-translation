base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003.yaml
  text: '1. So then, do not be eager in greed to corrupt your deeds, or by empty words to deceive your souls. For if, in purity of heart, you keep silence, you will understand how to hold fast the will of God and to cast away the will of Beliar.


    2. The sun and the moon and the stars do not alter their appointed order; so you also must not alter the law of God through the disorder of your deeds.


    3. The nations, having gone astray and having forsaken the Lord, altered their order, and gave heed to wood and stone, to spirits of deceit.


    4. But you, my children, must not be so. Rather, know in the firmament, on the earth, and in the sea, and in all created things, the Lord who made all things, so that you may not become like Sodom, which changed the order of its nature.


    5. In the same way also the Watchers changed the order of their nature, and the Lord cursed them at the time of the flood; because of them he made the earth desolate and without fruit.'
translation:
  language: ru
  text: '1. Итак, не стремитесь из алчности губить свои дела и не обманывайте свои души пустыми словами. Ибо, храня молчание в чистоте сердца, вы поймёте, как держаться воли Божьей и отвергать волю Велиара.


    2. Солнце, луна и звёзды не нарушают установленного им порядка[a]; так и вы не нарушайте закона Божьего беспорядочностью своих дел.


    3. Народы, впавшие в заблуждение и оставившие Господа, нарушили установленный им порядок и стали повиноваться дереву и камню, духам заблуждения.


    4. Но вы, дети мои, не поступайте так. Познавайте Господа, сотворившего всё, в небесном своде, на земле, в море и во всех творениях, чтобы вам не уподобиться Содому, который изменил естественный для него порядок.


    5. Так же и Стражи[b] изменили естественный для них порядок, и Господь проклял их во время потопа; из-за них Он сделал землю необитаемой и бесплодной[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально в сохранившемся греческом тексте: «не скроют своего порядка»; чтение, по-видимому, повреждено. Перевод следует смыслу контекста: небесные светила не изменяют назначенного им порядка.'
    reason: Отмечает текстологически трудное чтение †καλύψουσι и не выдаёт контекстуальное восстановление за бесспорный буквальный текст.
  - marker: b
    text: Стражи — название небесных существ, известное из древней иудейской традиции, особенно из преданий о событиях перед потопом.
    reason: Поясняет непривычный специальный термин Ἐγρήγοροι без навязывания более узкой интерпретации.
  - marker: c
    text: Конец греческого предложения передан в рукописной традиции с нарушенной грамматической связью; общий смысл — земля стала необитаемой и бесплодной.
    reason: Сигнализирует о повреждённости или неустойчивости текста в заключительной фразе и об основании смыслового перевода.
lexical_decisions:
- source_word: ἐν πλεονεξίᾳ
  choice: из алчности
  rationale: Передаёт мотив корыстного, ненасытного стремления, не утяжеляя русскую фразу буквальным «в алчности».
- source_word: διαφθεῖραι τὰς πράξεις ὑμῶν
  choice: губить свои дела
  rationale: Сохраняет сильное значение διαφθείρω — портить, разлагать, губить — применительно к поступкам.
- source_word: σιωπῶντες ἐν καθαρότητι καρδίας
  choice: храня молчание в чистоте сердца
  rationale: Причастная конструкция передана без добавления явного условия «если», которого в греческом тексте нет.
- source_word: κρατεῖν ... ἀπορρίπτειν
  choice: держаться ... отвергать
  rationale: Передаёт противопоставление стойкой приверженности Божьей воле и решительного отвержения воли Велиара.
- source_word: τάξις
  choice: установленный порядок / естественный порядок
  rationale: В космическом контексте обозначает назначенный строй, а в отношении Содома и Стражей — порядок, относящийся к их природе.
- source_word: οἱ Ἐγρήγοροι
  choice: Стражи
  rationale: Традиционное и понятное обозначение сверхъестественных существ в иудейской апокалиптической литературе; сохраняет связь с образом бодрствующих.
- source_word: στερέωμα
  choice: небесный свод
  rationale: Передаёт древний космологический термин естественным литературным русским выражением.
- source_word: ἄκαρπον
  choice: бесплодной
  rationale: Прямо передаёт отсутствие плодовитости земли и соответствует контексту потопа.
theological_decisions:
- issue: Связь молчания с постижением Божьей воли
  choice: «храня молчание… вы поймёте»
  alternative: «если вы будете хранить молчание…»
  rationale: Греческое причастие допускает обстоятельственный оттенок, но не выражает условие явно; перевод не превращает духовную связь в однозначную формулу условия.
- issue: «Порядок природы» Содома и Стражей
  choice: «естественный для него/них порядок»
  alternative: «порядок своей природы»
  rationale: Сохраняет напряжение исходного выражения, не уточняя, какие именно действия подразумеваются и не привнося конфессионального толкования.
- issue: Личность Велиара
  choice: сохранено имя «Велиар» без отождествления
  alternative: «дьявол» или «сатана»
  rationale: Текст употребляет собственное имя Βελίαρ; отождествление с иной фигурой было бы толковательным добавлением.
translation_notes:
  register: Современный литературный русский с достоинством завещательного наставления. Синтаксис сделан ясным для обычного читателя, но ключевые повторения — «порядок», «воля», «дела» — сохранены. Архаизмы ограничены именем Велиар и термином Стражи, причём последний пояснён в сноске.
