base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/005.yaml
  text: In the same way also the Watchers changed the order of their nature, whom the Lord cursed at the time of the flood, because of whom he made the earth uninhabited and fruitless.
translation:
  language: ru
  text: Подобным образом и Стражи изменили порядок своей природы — тех, кого Господь проклял во время потопа и из-за кого сделал землю необитаемой и бесплодной.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ Ἐγρήγοροι
  choice: Стражи
  rationale: Традиционное и понятное обозначение сверхъестественных «Наблюдающих»; написание с прописной буквы передаёт употребление как названия группы.
- source_word: ἐνήλλαξαν τάξιν φύσεως αὐτῶν
  choice: изменили порядок своей природы
  rationale: Сохраняет необычную и богословски значимую формулировку оригинала, не уточняя, в чём именно состояло нарушение природного порядка.
- source_word: ἐπὶ τοῦ κατακλυσμοῦ
  choice: во время потопа
  rationale: Естественно передаёт временное значение оборота; «потоп» оставлен без добавочного толкования.
- source_word: ἀπὸ κατοικησίας … [ἀοίκητον]
  choice: необитаемой
  rationale: Передаёт смысл отсутствия обитания, поддержанный редакционным чтением ἀοίκητον; повреждённость греческой конструкции не воспроизводится как неестественный русский синтаксис.
- source_word: ἄκαρπον
  choice: бесплодной
  rationale: Прямой и естественный эквивалент, обозначающий неспособность земли приносить плод.
theological_decisions:
- issue: Природа Стражей и характер её изменения
  choice: Сохранено буквальное «изменили порядок своей природы»
  alternative: «нарушили установленный для них природный порядок»
  rationale: Оригинал не объясняет конкретно ни природу Стражей, ни вид нарушения; более разъясняющий вариант мог бы преждевременно разрешить эту неоднозначность.
- issue: Связь опустошения земли со Стражами
  choice: «из-за них сделал землю…»
  alternative: Безличное «из-за них земля стала…»
  rationale: Греческая форма τάξας указывает на действие подразумеваемого Господа; активная конструкция сохраняет эту причинную и богословскую связь.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Относительные конструкции оригинала разделены точкой с запятой и сочинительной связью ради ясности, при сохранении последовательности утверждений и их причинной связи.
