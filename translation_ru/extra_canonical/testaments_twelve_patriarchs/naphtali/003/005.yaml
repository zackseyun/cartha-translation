  source_fidelity: 'Нужна небольшая правка синтаксиса: в греческом оба относительных местоимения (οὓς … διʼ οὓς) относятся к «Стражам». В черновике смысл понятен, но замена относительных конструкций на «их» и «из-за них» несколько ослабляет явную структуру исходного текста. «Необитаемой и бесплодной» корректно передаёт трудное, вероятно повреждённое место ἀπὸ κατοικησίας … [ἀοίκητον] καὶ ἄκαρπον, не выдавая редакционное решение за бесспорное уточнение.'
