source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: III. Μὴ οὖν σπουδάζετε¹ *ἐν πλεονεξίᾳ² *διαφθεῖραι τὰς πράξεις ὑμῶν³, ἢ ἐν *λόγοις κενοῖς ἀπατᾶν⁴ τὰς ψυχὰς ὑμῶν, ὅτι⁵ σιωπῶντες⁶ ἐν *καθαρότητι καρδίας⁷ συνήσετε⁸ τὸ θέλημα τοῦ Θεοῦ⁹ κρατεῖν¹⁰, καὶ ἀπορρίπτειν τὸ θέλημα τοῦ Βελίαρ¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/001.yaml
  text: Therefore, do not be eager in greed to corrupt your deeds, or by empty words to deceive your souls, because by keeping silent in purity of heart you will understand to hold fast the will of God and to cast away the will of Beliar.
translation:
  language: ru
  text: Итак, не стремитесь из корысти портить свои дела и пустыми словами обманывать свои души, ибо, храня молчание в чистоте сердца, вы поймёте, как держаться воли Бога и отвергать волю Велиара.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδάζετε
  choice: стремитесь
  rationale: Передаёт усердное, намеренное стремление без излишне буквального оттенка поспешности.
- source_word: ἐν πλεονεξίᾳ
  choice: из корысти
  rationale: πλεονεξία обозначает алчность, корыстолюбие, стремление иметь больше; причинное «из корысти» естественно связано с порчей поступков.
- source_word: διαφθεῖραι τὰς πράξεις ὑμῶν
  choice: портить свои дела
  rationale: Сохраняет нравственный смысл διαφθείρω и широкий смысл πράξεις как поступков или дел.
- source_word: λόγοις κενοῖς
  choice: пустыми словами
  rationale: Прямой и естественный эквивалент, сохраняющий образ бессодержательной речи.
- source_word: σιωπῶντες ἐν καθαρότητι καρδίας
  choice: храня молчание в чистоте сердца
  rationale: Передаёт обстоятельственное причастие без добавления отсутствующего в греческом условия; формулировка сохраняет внутреннюю связь молчания и чистоты сердца.
- source_word: συνήσετε
  choice: вы поймёте
  rationale: Будущее время от συνίημι означает понимание или постижение.
- source_word: κρατεῖν
  choice: держаться
  rationale: В сочетании с «волей Бога» выражает твёрдую приверженность, не создавая неестественного образа физического удерживания.
- source_word: ἀπορρίπτειν
  choice: отвергать
  rationale: Передаёт активное отбрасывание и отказ.
- source_word: Βελίαρ
  choice: Велиара
  rationale: Сохраняется форма имени, представленная в греческом тексте и характерная для литературы Заветов двенадцати патриархов.
theological_decisions:
- issue: Соотношение молчания, чистоты сердца и понимания Божьей воли
  choice: «потому что, храня молчание в чистоте сердца, вы поймёте»
  alternative: «ибо если вы будете молчать с чистым сердцем, то поймёте»
  rationale: Греческий текст содержит обстоятельственное причастие σιωπῶντες, а не условную конструкцию; перевод не добавляет явного «если» и сохраняет некоторую неоднозначность логической связи.
- issue: κρατεῖν τὸ θέλημα τοῦ Θεοῦ
  choice: «держаться воли Бога»
  alternative: «удерживать волю Бога» / «исполнять волю Бога»
  rationale: «Держаться» сохраняет значение твёрдой приверженности; «исполнять» было бы более истолковывающим, а «удерживать» неестественно по-русски и может исказить смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством парабиблейского наставления. Синтаксис сделан естественным для обычного читателя, при этом причинная связь ὅτι и неусловный характер причастия сохранены. Маркеры сносок не требуются, поскольку сносок нет.
