  text: The sun and the moon and the stars do not alter their order; so you also must not alter the law of God through the disorder of your deeds.
translation:
  language: ru
  text: Солнце, луна и звёзды не изменяют своего порядка; так и вы не изменяйте закон Божий своими беспорядочными поступками.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τάξιν
  choice: порядка
  rationale: Передаёт установленную упорядоченность движения небесных светил, не добавляя отсутствующего в греческом тексте определения «назначенного».
- source_word: μὴ ἀλλοιώσητε
  choice: не нарушайте
  rationale: В данном контексте естественно передаёт запрет изменять или искажать закон Божий своими поступками и сохраняет параллель с ненарушимым порядком светил.
- source_word: ἐν ἀταξίᾳ τῶν πράξεων ὑμῶν
  choice: беспорядочностью своих поступков
  rationale: 'Инструментальное понимание ἐν уместно в контексте: нарушение закона происходит посредством неупорядоченного поведения; «поступки» точно передаёт πράξεις.'
theological_decisions:
- issue: Характер связи между человеческими поступками и законом Божьим
  choice: «не нарушайте закон Божий беспорядочностью своих поступков»
  alternative: «не изменяйте закон Божий в беспорядке ваших поступков»
  rationale: Выбранный вариант звучит естественно по-русски и не утверждает, что человеческие действия буквально меняют сам закон; он сохраняет нравственное предостережение и образную параллель исходного текста.
translation_notes:
  register: Современный литературный русский язык; краткая, ритмичная и назидательная формулировка. Сохранён параллелизм между космическим порядком и человеческим повиновением без добавления слова «установленный».
