revisions:
- from: Солнце, луна и звёзды не нарушают своего порядка; так и вы не нарушайте закон Божий беспорядочностью своих поступков.
  to: Солнце, луна и звёзды не изменяют своего порядка; так и вы не изменяйте закон Божий своими беспорядочными поступками.
  rationale: 'Исправлен глагол во второй части для более точной передачи ἀλλοιώσητε и сохранения параллелизма с образом небесных светил. Текстологически затруднённое чтение первого глагола не снабжается догматизирующей сноской: перевод следует уже принятой в английском аудиторском тексте контекстуальной трактовке «не изменяют».'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T22:30:05Z'
review_pass:
  verdict: revise
  source_fidelity: 'Вторая половина точнее передаётся с глаголом «изменять»: ἀλλοιώσητε означает «изменить, исказить», а не прежде всего «нарушить». Это также сохраняет словесно-смысловой параллелизм с первой половиной. В первом предложении чтение καλύψουσι в приведённом греческом тексте отмечено † и в данном контексте явно проблемно; вариант «не изменяют своего порядка» следует английской аудиторской трактовке текстологически испорченного места и хорошо согласуется с контекстом.'
  naturalness: «Своими беспорядочными поступками» — естественная современная русская передача ἐν ἀταξίᾳ τῶν πράξεων ὑμῶν, без тяжеловесной абстрактной формы «беспорядочностью». Фраза остаётся краткой и назидательной.
  terminology: «Закон Божий» уместно и точно передаёт νόμον Θεοῦ. «Порядок» точно соответствует τάξις; «изменяют / не изменяйте» передаёт параллель с ἀλλοιόω, не добавляя богословских выводов о природе закона.
  issues:
  - severity: medium
    issue: «Не нарушайте» вместо «не изменяйте»
    rationale: «Нарушать закон» звучит естественно, но сужает ἀλλοιώσητε до неповиновения и устраняет намеренную параллель с первой частью. «Не изменяйте» ближе к лексике оригинала и английскому аудиторскому тексту.
  - severity: low
    issue: «Беспорядочностью своих поступков»
    rationale: Передача понятна, но абстрактное существительное стилистически тяжеловесно. «Своими беспорядочными поступками» сохраняет инструментальный смысл и звучит современнее.
  revised_text: Солнце, луна и звёзды не изменяют своего порядка; так и вы не изменяйте закон Божий своими беспорядочными поступками.
  revised_footnotes: []
