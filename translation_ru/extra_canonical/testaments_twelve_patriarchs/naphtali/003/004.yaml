revisions:
- from: Но вы, дети мои, не поступайте так, познавая в небесной тверди, на земле и в море и во всех творениях Господа, сотворившего всё, чтобы вам не стать подобными Содому, который изменил порядок своей природы.
  to: Но вы, дети мои, не будьте такими, зная в небесной тверди, на земле, в море и во всех творениях Господа, сотворившего всё, чтобы вам не стать подобными Содому, который изменил порядок своей природы.
  rationale: Исправлено только неоправданное сужение эллиптического μὴ οὕτως и слегка сглажена русская лексика. Сохранены причастно-деепричастная связь γινώσκοντες, космологический образ στερέωμα и намеренно нераскрытая формула τάξιν φύσεως αὐτῆς.
