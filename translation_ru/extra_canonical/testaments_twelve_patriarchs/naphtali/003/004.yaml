review_pass:
  verdict: revise
  source_fidelity: 'Основной смысл передан верно: познание Господа во всём творении противопоставлено примеру Содома, а неоднозначное выражение «порядок своей природы» сохранено без доктринального уточнения. Однако «не поступайте так» сужает греческое μὴ οὕτως до конкретного действия, тогда как в тексте стоит более широкое, эллиптическое «не будьте таковыми / не будьте такими».'
  naturalness: Фраза в целом литературна, но «познавая в небесной тверди ... Господа» несколько тяжеловесна. Замена «познавая» на «зная» делает деепричастную конструкцию естественнее в современном русском, не меняя её синтаксического статуса.
  terminology: «Небесная твердь», «творения», «Господь» и «порядок своей природы» уместны и точно сохраняют образность и терминологическую неопределённость греческого текста. «Содом» следует оставить в мужском роде в соответствии с русской грамматической нормой.
  issues:
  - severity: medium
    issue: «Не поступайте так»
    rationale: Греческое μὴ οὕτως не содержит глагола действия и не ограничивает предостережение поступком. Формулировка «не будьте такими» точнее передаёт эллиптическое и более широкое выражение оригинала, а также английское audit-trail «must not be so».
  - severity: low
    issue: «Познавая» в деепричастном обороте
    rationale: Это допустимо, но «зная» естественнее по-русски и ближе к обычному значению γινώσκοντες в данной конструкции; деепричастная неоднозначность при этом сохраняется.
  revised_text: Но вы, дети мои, не будьте такими, зная в небесной тверди, на земле, в море и во всех творениях Господа, сотворившего всё, чтобы вам не стать подобными Содому, который изменил порядок своей природы.
