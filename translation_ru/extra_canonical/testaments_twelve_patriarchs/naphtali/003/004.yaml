base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/004.yaml
  text: But you, my children, must not be so, knowing in the firmament, on the earth, and in the sea, and in all created things, the Lord who made all things, so that you may not become like Sodom, which changed the order of its nature.
translation:
  language: ru
  text: Но вы, дети мои, не будьте такими, зная в небесной тверди, на земле, в море и во всех творениях Господа, сотворившего всё, чтобы вам не стать подобными Содому, который изменил порядок своей природы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στερέωμα
  choice: небесная твердь
  rationale: Традиционный и понятный библейский эквивалент, сохраняющий космологический образ исходного текста.
- source_word: δημιουργήματα
  choice: творения
  rationale: Естественно передаёт все созданные Богом существа и предметы без излишне технического оттенка слова «создания».
- source_word: τάξιν φύσεως αὐτῆς
  choice: порядок своей природы
  rationale: Формально сохраняет неоднозначное сочетание «порядок» и «природа», не уточняя, в чём именно состояло изменение.
theological_decisions:
- issue: Значение предостережения о Содоме
  choice: Сохранить общее утверждение об изменении порядка собственной природы
  alternative: Уточнить это как нарушение определённой нравственной или половой нормы
  rationale: Греческий текст в данном стихе не называет конкретного нарушения; уточнение привнесло бы конфессиональное или интерпретационное решение.
- issue: Синтаксическая связь γινώσκοντες
  choice: Передать деепричастием «познавая»
  alternative: Оформить как отдельное повеление «познавайте»
  rationale: Так сохраняется причастная конструкция греческого текста и её некоторая смысловая напряжённость без добавления отсутствующего повелительного наклонения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис близок к греческому, но остаётся читаемым; подлинная неоднозначность причастия и выражения о «порядке природы» сохранена.
