revisions:
- from: Народы, впав в заблуждение и оставив Господа, изменили установленный для них порядок и стали внимать дереву и камню — духам заблуждения.
  to: Народы, впав в заблуждение и оставив Господа, изменили свой порядок и повиновались дереву и камню, духам заблуждения.
  rationale: Исправлено перечисление дополнений при «повиновались», чтобы не отождествлять материальные предметы с духами посредством авторского пояснительного тире. Убрано не выраженное в греческом уточнение о происхождении порядка; сохранены исходная последовательность действий, множественное «народы» и сдержанный библейский регистр.
