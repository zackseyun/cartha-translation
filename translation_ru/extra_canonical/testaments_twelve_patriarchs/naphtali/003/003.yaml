source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 3. Ἔθνη πλανηθέντα *καὶ ἀφέντα Κύριον²⁰ ἠλλοίωσαν²¹ τὴν²² τάξιν αὐτῶν, καὶ *ὑπήκουσαν ξύλοις καὶ λίθοις²³, πνεύμασι²⁴ πλάνης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/003.yaml
  text: The nations, having gone astray and having forsaken the Lord, altered their order, and gave heed to wood and stone, to spirits of deceit.
translation:
  language: ru
  text: Народы, впав в заблуждение и оставив Господа, изменили свой порядок и повиновались дереву и камню, духам заблуждения.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθνη
  choice: народы
  rationale: Обычное и точное соответствие греческому множественному числу; контекст говорит о языческих народах.
- source_word: πλανηθέντα
  choice: впав в заблуждение
  rationale: Передаёт аористное причастие от πλανάω естественно по-русски, сохраняя смысл уклонения от истины.
- source_word: ἀφέντα
  choice: оставив
  rationale: Прямо передаёт действие ἀφίημι и временно-логическую связь с основным сказуемым.
- source_word: ἠλλοίωσαν τὴν τάξιν αὐτῶν
  choice: изменили установленный для них порядок
  rationale: ἠλλοίωσαν означает «изменили, исказили», а τάξις — «порядок, устроение». Добавление «установленный для них» делает смысл αὐτῶν ясным, не определяя сверх текста, кем именно этот порядок установлен.
- source_word: ὑπήκουσαν
  choice: стали внимать
  rationale: Сохраняет значение послушного внимания или подчинения, не сужая его до формального поклонения.
- source_word: ξύλοις καὶ λίθοις
  choice: дереву и камню
  rationale: Собирательное единственное число естественно для русского библейского регистра и точно выражает материал идолов.
- source_word: πνεύμασι πλάνης
  choice: духам заблуждения
  rationale: 'Буквально сохраняет конструкцию с родительным падежом πλάνης и её возможные оттенки: духи, вводящие в заблуждение, либо принадлежащие сфере заблуждения.'
theological_decisions:
- issue: Связь выражения «духам заблуждения» с «дереву и камню»
  choice: Передать через тире как пояснение к дереву и камню
  alternative: 'Перечислить отдельно: «дереву и камню, духам заблуждения»'
  rationale: Греческая пунктуация допускает приложение, при котором за материальными идолами подразумеваются обманчивые духовные силы. Тире показывает эту вероятную связь, не утверждая полного тождества вещества идолов и духов.
- issue: Значение ὑπήκουσαν в контексте идолопоклонства
  choice: «стали внимать»
  alternative: «покорились» или «поклонялись»
  rationale: Выбор сохраняет лексическую широту глагола и не вводит более специальный культовый термин, отсутствующий в греческом тексте.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Причастные конструкции упрощены до естественных деепричастных оборотов; сохранены параллелизм и богословская напряжённость оригинала.
