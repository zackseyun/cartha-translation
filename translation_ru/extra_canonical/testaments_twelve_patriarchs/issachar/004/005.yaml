  text: 5. Οὐ²³ ζηλοῖ ἐν διαβουλίοις [οὐ βάσκανος²⁶ ἐκτήκει τὴν ψυχὴν αὐτοῦ]²⁷ *οὐδὲ ⌜περισπασμὸς⌝ ἐν ἀπληστείᾳ ἐν νοΐ²⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/004/005.yaml
  text: He does not envy in deliberations, nor does malicious envy consume his soul, nor is there distraction in greed in his mind.
translation:
  language: ru
  text: Он не завидует при обсуждениях, и злонамеренная зависть не иссушает его душу, и в его уме нет рассеянности из-за алчности.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζηλοῖ
  choice: завидует
  rationale: В отрицательном контексте глагол передаёт завистливое соперничество; «завидует» естественно и не привносит положительного смысла ревности.
- source_word: ἐν διαβουλίοις
  choice: при обсуждениях
  rationale: Множественное число διαβούλια может обозначать совещания или обсуждения; оборот сохраняет общественно-совещательный оттенок без добавления притяжательного «своих».
- source_word: βάσκανος
  choice: злобная зависть
  rationale: Прилагательное substantivировано либо характеризует подразумеваемую зависть; перевод передаёт злонамеренный, пагубный оттенок.
- source_word: ἐκτήκει
  choice: иссушает
  rationale: Глагол буквально описывает истощение или изнурение; «иссушает душу» звучит образно и достойно, сохраняя силу метафоры.
- source_word: περισπασμὸς
  choice: рассеивает
  rationale: Существительное означает отвлечение или рассеянность; в русском предложении оно естественно передано глагольной конструкцией.
- source_word: ἐν ἀπληστείᾳ
  choice: алчность
  rationale: ἀπληστία означает ненасытность, жадность или алчность; «алчность» кратко передаёт нравственно отрицательный смысл.
- source_word: ἐν νοΐ
  choice: мысли
  rationale: νοῦς здесь обозначает ум, внутренний строй мысли; множественное «мысли» позволяет естественно выразить рассеянность ума.
theological_decisions:
- issue: Связь алчности и рассеянности ума
  choice: «алчность не рассеивает его мысли»
  alternative: «в его уме нет рассеянности из-за алчности»
  rationale: Греческая конструкция с повторным ἐν сжата и допускает разные синтаксические связи. Выбран естественный русский оборот, сохраняющий причинно-смысловую связь без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык, сдержанный нравоучительный тон. Синтаксис выровнен для ясности, но трёхчастная отрицательная структура оригинала сохранена.
