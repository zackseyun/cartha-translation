  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/004/006.yaml
  text: But he walks in simplicity of soul; he sees all things with uprightness of heart, not accepting evil eyes from the world’s error, so that he may not see the commandments of the Lord as distorted.
translation:
  language: ru
  text: Но он ходит в простоте души, всё видит с прямотой сердца, не перенимая порочного взгляда, порождённого заблуждением мира, чтобы не увидеть заповеди Господа в искажённом виде.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορεύεται
  choice: ходит
  rationale: Передаёт образ постоянного жизненного пути, а не единичного передвижения.
- source_word: ἁπλότητι ψυχῆς
  choice: в простоте души
  rationale: Сохраняет ключевой для контекста смысл цельности, искренности и отсутствия двоедушия без чрезмерного истолкования.
- source_word: πάντα ὁρᾷ
  choice: всё видит
  rationale: Естественная русская передача всеохватного πάντα при сохранении зрительного образа.
- source_word: εὐθύτητι καρδίας
  choice: с прямотой сердца
  rationale: Сохраняет метафору нравственной прямоты и семитически окрашенное упоминание сердца.
- source_word: μὴ ἐπιδεχόμενος ὀφθαλμοὺς πονηρούς
  choice: не перенимая порочного взгляда
  rationale: Буквальное «не принимая злых глаз» по-русски неясно; оборот передаёт отказ усвоить нравственно испорченный способ смотреть и судить.
- source_word: ἀπὸ τῆς πλάνης τοῦ κόσμου
  choice: порождённого заблуждением мира
  rationale: Относит источник порочного взгляда к обману или заблуждению мира, сохраняя генитивную неоднозначность без введения конкретной доктрины.
- source_word: ἵνα μὴ ἴδῃ διεστραμμένας τὰς ἐντολὰς τοῦ Κυρίου
  choice: чтобы не увидеть заповеди Господа в искажённом виде
  rationale: Сохраняет буквальный образ восприятия заповедей как искажённых и не утверждает, будто искажены сами заповеди.
theological_decisions:
- issue: Что именно искажено в заключительной фразе
  choice: Заповеди воспринимаются «в искажённом виде»
  alternative: «чтобы не увидеть искажённые заповеди Господа»
  rationale: Так сохраняется напряжение греческой конструкции и одновременно исключается естественное, но богословски более сильное русское прочтение, будто сами Господни заповеди объективно искажены.
- issue: Значение «злых глаз»
  choice: Порочный взгляд как усвоенный способ восприятия
  alternative: Буквальное «злые глаза» или идиоматическое «завистливый взгляд»
  rationale: Контекст связывает глаза с заблуждением мира и искажённым восприятием заповедей; сужение до одной лишь зависти не подтверждено непосредственно.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной мудрости. Сохранён параллелизм «простота души — прямота сердца»; неестественная калька «принимать злые глаза» заменена ясным, но образным выражением.
