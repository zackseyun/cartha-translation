  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/002/001.yaml
  text: Then an angel of the Lord appeared to Jacob, saying, “Rachel will bear children, because she despised intercourse with a husband and chose self-control.”
translation:
  language: ru
  text: 'Тогда ангел Господа явился Иакову и сказал: «Рахиль родит детей, потому что она презрела супружескую близость и избрала воздержание».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη τῷ Ἰακώβ
  choice: Иакову явился
  rationale: Естественная русская передача греческой пассивной формы со значением явления кому-либо.
- source_word: τέκνα τέξει
  choice: родит детей
  rationale: Сохраняет неопределённое множественное число оригинала; числительное «двоих» в основном тексте отсутствует.
- source_word: κατέπτυσεν συνουσίαν ἀνδρός
  choice: отвергла близость с мужем
  rationale: καταπτύω выражает сильное пренебрежение или отвержение; «близость с мужем» естественно и достойно передаёт сексуальный смысл συνουσία, не делая формулировку излишне медицинской.
- source_word: ἐξελέξατο τὴν ἐγκράτειαν
  choice: избрала воздержание
  rationale: Передаёт осознанный выбор, выраженный медиальной формой ἐξελέξατο, и сохраняет нравственно-аскетический оттенок ἐγκράτεια.
- source_word: εἶπε λέγων
  choice: сказал
  rationale: В русском языке сочетание «сказал, говоря» тяжеловесно; один глагол естественно передаёт семитизированную греческую формулу.
theological_decisions:
- issue: Основание обещания Рахили
  choice: 'Сохранена прямая причинная связь: «потому что…»'
  alternative: Ослабить связь формулировкой «после того как…»
  rationale: ἐπειδή прямо вводит причину; необычное богословское напряжение текста не следует сглаживать.
- issue: Характер воздержания Рахили
  choice: «избрала воздержание» без пояснения мотивов или длительности
  alternative: «решила хранить целомудрие» или «на время отказалась от супружеских отношений»
  rationale: Оригинал не уточняет ни длительность, ни мотив и говорит именно об ἐγκράτεια; добавочные толкования сузили бы смысл.
translation_notes:
  register: Современный литературный русский язык с достоинством библейского повествования. Формулировка ясна обычному читателю, при этом резкая причинная логика и смысловая напряжённость оригинала сохранены.
