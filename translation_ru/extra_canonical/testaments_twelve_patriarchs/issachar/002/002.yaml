  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/002/002.yaml
  text: And had Leah my mother not given over the two fruits in exchange for intercourse, she would have been about to bear eight sons; for this reason she bore six, and Rachel bore the two — because in the mandrakes the Lord visited her.
translation:
  language: ru
  text: И если бы моя мать Лия не отдала два плода в обмен на близость с мужем, ей предстояло бы родить восемь сыновей. Поэтому она родила шестерых, а Рахиль родила тех двоих, ибо в мандрагорах Господь посетил её.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντὶ συνουσίας
  choice: в обмен на близость с мужем
  rationale: Передаёт обмен ради супружеского соития естественно и достойно, не делая выражение излишне медицинским; контекст Быт 30 уточняет, что речь о муже.
- source_word: τὰ δύο μῆλα
  choice: два плода
  rationale: Буквально μῆλα означает «плоды/яблоки»; нейтральное «плода» сохраняет связь с последующим упоминанием мандрагор и не вводит современное понимание яблок.
- source_word: ἔμελλε τεκεῖν
  choice: ей предстояло бы родить
  rationale: Сохраняет контрфактическую модальность и смысл ожидаемого числа сыновей.
- source_word: τοὺς δύο
  choice: тех двоих
  rationale: Сохраняет определённость греческого оборота и отсылку к двум сыновьям, которые, согласно утверждению текста, иначе родились бы у Лии.
- source_word: ἐν τοῖς μανδραγόροις
  choice: через мандрагоры
  rationale: Греческое ἐν допускает инструментально-обстоятельственное понимание; «через» естественно передаёт приписанную мандрагорам роль, не утверждая самостоятельной магической силы.
- source_word: ἐπεσκέψατο αὐτὴν ὁ Κύριος
  choice: Господь посетил её
  rationale: Сохраняет библейскую формулу божественного посещения, здесь означающую милостивое вмешательство, приведшее к зачатию.
theological_decisions:
- issue: Соотношение мандрагор и Божьего действия
  choice: ибо через мандрагоры Господь посетил её
  alternative: ибо при мандрагорах Господь вспомнил о ней
  rationale: Выбранный вариант сохраняет необычную причинно-инструментальную формулировку текста и его богословское напряжение, не заменяя ἐπεσκέψατο выражением из канонического рассказа.
- issue: Условное утверждение о восьми сыновьях Лии
  choice: ей предстояло бы родить восемь сыновей
  alternative: она родила бы восемь сыновей
  rationale: Формулировка отражает конструкцию с ἔμελλε и не усиливает её до более прямого утверждения сверх исходного текста.
translation_notes:
  register: Современный литературный русский язык с библейски достойным регистром. Синтаксис сделан прозрачным, при этом сохранены необычная логика повествования, определённость «тех двоих» и буквальная формула о посещении Рахили Господом.
