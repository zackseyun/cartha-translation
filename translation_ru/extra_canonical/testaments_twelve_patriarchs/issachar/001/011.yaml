id: T12P.ISS.1.11
reference: Testament of Issachar 1:11
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 11. *Καὶ εἰ μὴ ὁ δόλος ἐπλήθυνεν ἐπὶ τῆς γῆς καὶ ἡ πονηρία τῶν ἀνθρώπων ἐχώρησεν, οὐκ ἂν εἶ σὺ ὁρῶσα τὸ πρόσωπον τοῦ Ἰακώβ⁵³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/011.yaml
  text: And had guile not multiplied upon the earth and the wickedness of men advanced, you would not be looking on the face of Jacob.
translation:
  language: ru
  text: И если бы на земле не умножилось коварство и не распространилась людская порочность, ты не видела бы лица Иакова.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «ты не была бы видящей лицо Иакова»; форма «видящей» в греческом тексте указывает на обращение к женщине.'
    reason: Примечание сохраняет заметную грамматическую особенность оригинала и поясняет длительный оттенок перифрастической конструкции.
lexical_decisions:
- source_word: ὁ δόλος
  choice: коварство
  rationale: Передаёт обманный, вероломный характер δόλος и сохраняет нравственную окраску существительного.
- source_word: ἐπλήθυνεν
  choice: умножилось
  rationale: Формально и естественно воспроизводит образ возрастания или увеличения.
- source_word: ἡ πονηρία τῶν ἀνθρώπων
  choice: людская порочность
  rationale: Естественное русское выражение, сохраняющее обобщённое указание на нравственное зло людей.
- source_word: ἐχώρησεν
  choice: распространилась
  rationale: В данном контексте передаёт продвижение и расширение зла, не сужая значение до одного конкретного действия.
- source_word: οὐκ ἂν εἶ σὺ ὁρῶσα
  choice: ты не видела бы
  rationale: Передаёт ирреальное условное следствие и женский род причастия ὁρῶσα; русское несовершенное «видела бы» сохраняет состояние созерцания, а не единичное действие.
- source_word: τὸ πρόσωπον τοῦ Ἰακώβ
  choice: лица Иакова
  rationale: Сохраняет библейскую формулу «видеть лицо» и прямое значение πρόσωπον.
theological_decisions:
- issue: Причинная связь между распространением человеческого зла и тем, что адресат видит Иакова
  choice: Сохранить контрфактическое утверждение без пояснения его богословского или сюжетного смысла
  alternative: Истолковать зло как конкретный обман либо как промыслительное средство встречи с Иаковом
  rationale: Греческий текст утверждает связь, но не объясняет её; перевод не должен устранять эту напряжённость или вводить частное толкование.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. Порядок двух однородных условий сохранён; «людская порочность» выбрано вместо более архаичного «нечестие людей». Женский род адресата выражен формой «видела бы».
