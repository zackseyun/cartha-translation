  text: 6. Εἶπε δὲ Ῥαχήλ· οὐ δώσω *σοι ταῦτα²⁸, *ἀλλ᾽ ἵνα σχῶ ταῦτα²⁹ ἀντὶ τέκνων· *παρεῖδε γάρ με ὁ Κύριος, καὶ τέκνα οὐκ ἐγέννησα τῷ Ἰακώβ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/006.yaml
  text: And Rachel said, "I will not give these to you, but I will keep them in exchange for children; for the Lord has overlooked me, and I have borne no children to Jacob."
translation:
  language: ru
  text: 'И Рахиль сказала: «Я не отдам тебе этого, а оставлю это себе вместо детей, потому что Господь оставил меня без внимания[a], и я не родила Иакову детей».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «не обратил на меня внимания»; греческий глагол может также означать «не заметил», «оставил без внимания».'
    reason: Уточняет отрицательный смысл многозначного παρεῖδε в жалобе Рахили, не устраняя возможную смысловую вариативность.
lexical_decisions:
- source_word: ταῦτα
  choice: это
  rationale: Указательное местоимение передано явно и одинаково по смыслу в обеих частях фразы; русское собирательное «это» естественно для подразумеваемых предметов.
- source_word: ἵνα σχῶ ταῦτα ἀντὶ τέκνων
  choice: оставлю у себя в обмен на детей
  rationale: 'Буквально: «чтобы мне иметь это вместо/в обмен на детей». Формулировка передаёт намерение сохранить предметы и естественно звучит по-русски, не устраняя необычности обмена.'
- source_word: παρεῖδε
  choice: обошёл меня вниманием
  rationale: Глагол παροράω здесь указывает на то, что Рахиль чувствует себя оставленной без Божьего внимания; последующее бесплодие поддерживает отрицательный смысл, а не значение «благосклонно взглянул».
- source_word: τέκνα οὐκ ἐγέννησα τῷ Ἰακώβ
  choice: я не родила Иакову ни одного ребёнка
  rationale: Передаёт отрицание естественным современным русским языком и сохраняет дательный τῷ Ἰακώβ как «Иакову».
theological_decisions:
- issue: Смысл παρεῖδε как описания отношения Господа к Рахили
  choice: Господь обошёл меня вниманием
  alternative: Господь взглянул на меня
  rationale: Положительное «взглянул на меня» плохо согласуется с причинным пояснением о том, что она не родила детей. Выбранное чтение сохраняет жалобу Рахили, не превращая её слова в объективное богословское утверждение от лица повествователя.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Прямая речь остаётся эмоционально понятной; архаизмы и конфессионально окрашенные формулы не используются.
