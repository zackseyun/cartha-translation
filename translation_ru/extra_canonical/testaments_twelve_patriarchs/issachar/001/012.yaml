base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/012.yaml
  text: But Laban deceived me with guile, and removed me that night, and did not allow Jacob to see me; for if I had been there, this would not have happened to him.
translation:
  language: ru
  text: Но Лаван обманул меня хитростью, увёл меня той ночью и не позволил Иакову увидеть меня; ведь если бы я была там, этого с ним не случилось бы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν δόλῳ ἠπάτησέ με
  choice: обманул меня хитростью
  rationale: Сохраняет как значение глагола «обманул», так и обстоятельство образа действия «хитростью», не сглаживая их кажущуюся избыточность.
- source_word: μετέστησέ με
  choice: увёл меня оттуда
  rationale: В данном повествовательном контексте глагол означает перемещение человека с прежнего места; «увёл» естественно по-русски, а «оттуда» передаёт идею удаления, заключённую в приставке μετα-.
- source_word: οὐκ εἴασε τῷ Ἰακὼβ ἰδεῖν με
  choice: не позволил Иакову увидеть меня
  rationale: Прямо передаёт разрешительную конструкцию с εἴασε и инфинитивом.
- source_word: τοῦτο αὐτῷ οὐκ ἐγένετο
  choice: этого с ним не случилось бы
  rationale: Русская идиома «случилось с ним» естественно передаёт αὐτῷ ἐγένετο и сохраняет неопределённую отсылку местоимения «этого».
theological_decisions:
- issue: Неясная отсылка τοῦτο («это»)
  choice: сохранить неопределённое «этого»
  alternative: уточнить событие как подмену или брак с Лией
  rationale: Греческий текст сам не называет событие прямо; экспликация устранила бы подлинную повествовательную неоднозначность.
- issue: Контрфактическое условие ἐὰν ἤμην... οὐκ ἐγένετο
  choice: «если бы я была... не случилось бы»
  alternative: буквальное сочетание условной части с изъявительным наклонением
  rationale: Русское сослагательное наклонение ясно и естественно выражает контрфактический смысл греческой конструкции.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Женский род «была» определяется говорящей в контексте отрывка. Формулировка не вводит конфессиональных толкований и сохраняет неуточнённую отсылку «этого».
