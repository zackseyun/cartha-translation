lexical_decisions:
- source_word: Ἔστω σοι ὁ Ἰακὼβ
  choice: Пусть Иаков будет с тобой
  rationale: Передаёт повелительно-разрешительную конструкцию ἔστω σοι естественным современным русским языком, не добавляя отсутствующего в греческом «тогда».
- source_word: τῇ νυκτὶ ταύτῃ
  choice: этой ночью
  rationale: Прямое и естественное соответствие указательной конструкции со значением конкретной предстоящей ночи.
- source_word: ἀντὶ τῶν μανδραγόρων τοῦ υἱοῦ σου
  choice: в обмен на мандрагоры твоего сына
  rationale: Сохраняет значение ἀντί как обмена и явную принадлежность мандрагор сыну собеседницы.
