source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 14. ⌈Καὶ προσέθηκε Ῥαχὴλ λαλεῖν καὶ εἶπεν. Ἕνα τῶν μανδραγόρων λήψομαι, καὶ ἀντὶ τοῦ ἑνὸς ἐκμισθώσω σοι ἐν τῇ νυκτί⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/014.yaml
  text: And Rachel went on speaking and said, "I will take one of the mandrakes, and in exchange for the one I will hire him out to you for the night."
translation:
  language: ru
  text: 'И Рахиль продолжила говорить и сказала: «Я возьму одну из мандрагор, а в обмен на неё уступлю тебе его на эту ночь».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сдам его тебе внаём на ночь».'
    reason: Греческое ἐκμισθώσω имеет значение «отдам (или сдам) внаём»; примечание сохраняет выраженный в источнике язык сделки.
lexical_decisions:
- source_word: προσέθηκε ... λαλεῖν
  choice: продолжила говорить
  rationale: Передаёт семитизированную греческую конструкцию со значением продолжения речи естественным современным русским языком.
- source_word: ἕνα τῶν μανδραγόρων
  choice: одну из мандрагор
  rationale: Сохраняет партитивную конструкцию и множественное число источника.
- source_word: ἐκμισθώσω σοι
  choice: уступлю тебе
  rationale: Буквально глагол связан с наймом за плату, однако в данном обмене речь идёт о предоставлении Иакова другой женщине на ночь; «уступлю» естественно передаёт смысл без неуместного коммерческого оттенка.
- source_word: ἐν τῇ νυκτί
  choice: на эту ночь
  rationale: 'Контекстуально естественная передача временного выражения: Иаков уступается на одну конкретную ночь.'
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательной речи. Местоимение «его» сохраняет присутствующую в греческом тексте отсылку к мужчине, понятному из контекста; неоднозначность не устраняется добавлением имени.
