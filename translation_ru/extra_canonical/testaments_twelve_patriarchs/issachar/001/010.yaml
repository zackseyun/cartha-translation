base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/010.yaml
  text: And Rachel said, “Do not boast, nor glorify yourself, for he was joined to me before you, and because of me he served our father fourteen years.”
translation:
  language: ru
  text: 'И Рахиль сказала: «Не хвались и не превозноси себя: ведь он был обручён со мной прежде, чем с тобой, и ради меня служил нашему отцу четырнадцать лет».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ καυχῶ μηδὲ δόξαζε σεαυτήν
  choice: Не хвались и не прославляй себя
  rationale: Переданы два параллельных запрета; «прославляй себя» сохраняет различие между καυχάομαι и δοξάζω и естественно звучит по-русски.
- source_word: ἡρμόσατο
  choice: был обручён
  rationale: Глагол ἁρμόζω в брачном контексте может обозначать соединение или обручение. Страдательная русская конструкция сохраняет форму греческого текста, а «обручён» естественно выражает первичную брачную связь с Рахилью, не утверждая, что брак уже был заключён.
- source_word: δι᾽ ἐμὲ
  choice: ради меня
  rationale: 'Передаёт причинно-целевой смысл: служение Иакова было предпринято ради Рахили.'
- source_word: τῷ πατρὶ ἡμῶν
  choice: нашему отцу
  rationale: Прямо сохраняет родственное обозначение и общий для сестёр притяжательный смысл.
- source_word: ἔτη δεκατέσσαρα
  choice: четырнадцать лет
  rationale: Точная и естественная передача продолжительности.
theological_decisions:
- issue: Характер связи, выраженной ἡρμόσατο
  choice: был обручён со мной
  alternative: был соединён со мной / предназначил себя мне
  rationale: Выбрана брачная формулировка, соответствующая повествованию об Иакове и Рахили; она сохраняет напряжение между первоначальным обручением с Рахилью и более ранним фактическим браком с Лией, не устраняя его толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством прямой речи. Синтаксис близок к греческому, но не буквалистичен; двоеточие естественно вводит основание запрета.
