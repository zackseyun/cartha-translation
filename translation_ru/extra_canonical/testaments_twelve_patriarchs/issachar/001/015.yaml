  text: And Jacob knew Leah, and she conceived and bore me; and because of this — the wages — I was called Issachar.
translation:
  language: ru
  text: Иаков познал Лию, и она зачала и родила меня; поэтому — из-за платы — меня назвали Иссахаром[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Иссахар» здесь связывается с платой или вознаграждением; ср. Быт. 30:16–18.
    reason: В русском языке заключённая в имени игра слов без пояснения не видна.
lexical_decisions:
- source_word: ἔγνω
  choice: познал
  rationale: Сохранён библейский эвфемизм со значением супружеской близости; он естественен для литературного библейского регистра.
- source_word: συλλαβοῦσα
  choice: зачала
  rationale: Причастная форма естественно передана личным глаголом в последовательности действий.
- source_word: τὸν μισθόν
  choice: этой платы
  rationale: μισθός означает плату или вознаграждение; «плата» сохраняет связь с рассказом о том, как Лия получила право провести ночь с Иаковом, и одновременно передаёт этимологическую игру с именем Иссахар.
- source_word: ἐκλήθην Ἰσαχάρ
  choice: меня назвали Иссахаром
  rationale: Естественная русская передача пассивной конструкции без уточнения неназванного деятеля.
theological_decisions:
- issue: Связь имени Иссахара с μισθός
  choice: Сохранить прямое упоминание «платы» и пояснить игру слов в сноске.
  alternative: Передать как «в награду» или устранить этимологическую связь.
  rationale: Греческий текст явно связывает наречение имени с μισθός; перевод не должен сглаживать эту связь или подменять её толкованием.
translation_notes:
  register: Современный литературный русский язык с традиционным библейским эвфемизмом «познал». Синтаксис сделан ясным и плавным, при этом сохранены причинная связь и этимологическое напряжение исходного текста.
