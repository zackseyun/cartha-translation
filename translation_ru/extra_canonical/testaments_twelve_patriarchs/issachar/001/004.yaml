lexical_decisions:
- source_word: Ἔκλαιε
  choice: плакал
  rationale: Имперфект передаёт продолжавшееся действие; нейтральное «плакал» сохраняет смысл без добавления оттенка рыдания.
- source_word: ἐπὶ τῇ φωνῇ αὐτοῦ
  choice: на его крик
  rationale: Буквально «на его голос»; в данном контексте речь о плаче, который побудил Лию выйти, поэтому естественное русское соответствие — «на его крик».
- source_word: ἐξῆλθεν
  choice: вышла
  rationale: Прямое и естественное соответствие аористу ἐξῆλθεν.
- source_word: Λεία ἡ μήτηρ μου
  choice: Лия, моя мать
  rationale: Сохранено приложение и повествование от первого лица; запятая соответствует естественному русскому синтаксису.
