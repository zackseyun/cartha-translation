  text: I was born as the fifth son to Jacob, as the wages for the mandrakes.
translation:
  language: ru
  text: Я родился пятым сыном Иакова — в уплату за мандрагоры.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ср. Быт. 30:14–18: Рахиль получила у Лии мандрагоры, а Лия в обмен получила право провести ночь с Иаковом; после этого она зачала Иссахара.'
    reason: Сжатое выражение отсылает к рассказу Бытия и без пояснения может быть неясно современному читателю.
lexical_decisions:
- source_word: Ἐγὼ ἐτέχθην
  choice: Я родился
  rationale: Прямо и естественно передаёт греческий аорист пассивной формы в современном русском языке.
- source_word: πέμπτος υἱὸς τῷ Ἰακώβ
  choice: пятым сыном у Иакова
  rationale: Сохраняет порядковое определение и дательный связи с Иаковом, не утяжеляя фразу буквальным «Иакову».
- source_word: ἐν μισθῷ τῶν μανδραγόρων
  choice: как плата за мандрагоры
  rationale: Передаёт μισθός как «плата» и сохраняет явную отсылку к повествованию Быт. 30:14–18, где за мандрагоры была достигнута договорённость.
theological_decisions:
- issue: Характер связи рождения Иссахара с мандрагорами
  choice: как плата за мандрагоры
  alternative: в награду за мандрагоры
  rationale: «Плата» точнее соответствует μισθός и сохраняет мотив договорной цены, не превращая выражение в богословское утверждение о награде.
translation_notes:
  register: Современный литературный русский язык; фраза краткая и повествовательная. Тире помогает естественно выразить обстоятельственное ἐν μισθῷ, сохраняя образность исходного текста.
