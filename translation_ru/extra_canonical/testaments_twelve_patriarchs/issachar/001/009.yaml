lexical_decisions:
- source_word: ἐμός ἐστιν ὁ Ἰακώβ
  choice: «Иаков — мой»
  rationale: Сохраняет прямое и emphатическое заявление Лии о притязании на Иакова; именная конструкция с тире естественна в современном русском языке.
- source_word: ὅτι
  choice: «потому что»
  rationale: Передаёт причинное значение союза в данном контексте без ослабления логической связи.
- source_word: γυνὴ νεότητος αὐτοῦ
  choice: «жена его юности»
  rationale: Близко передаёт греческую конструкцию и сохраняет её библейски узнаваемый, dignified образ без истолковывающего расширения.
