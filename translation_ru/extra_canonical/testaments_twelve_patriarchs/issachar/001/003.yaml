  register: Современный литературный русский язык с умеренно формальным библейским звучанием. Частица γὰρ передана как «ибо», поскольку стих объясняет предшествующее повествование. Порядок слов слегка адаптирован ради естественности, без устранения смысловой лаконичности греческого текста.
