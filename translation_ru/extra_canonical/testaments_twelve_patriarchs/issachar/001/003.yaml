  text: For Reuben my brother brought mandrakes from the field, and Rachel met him and took them from him.
translation:
  language: ru
  text: Ибо мой брат Рувим принёс с поля мандрагоры, и Рахиль, встретив его, взяла их.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μανδραγόρους
  choice: мандрагоры
  rationale: Прямое и общепринятое название растения, соответствующее греческому слову и контексту Бытия 30:14–16.
- source_word: προσαπαντήσασα
  choice: встретив его
  rationale: Причастие передаёт действие Рахили, которая встретила Рувима; формулировка сохраняет смысл без добавления отсутствующего в тексте указания, что она «вышла» навстречу.
- source_word: ἔλαβεν αὐτούς
  choice: взяла их
  rationale: Местоимение мужского рода множественного числа относится к мандрагорам; источник не уточняет здесь «у него», поэтому это не добавлено в основной текст.
