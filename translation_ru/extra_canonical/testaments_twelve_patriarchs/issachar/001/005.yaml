  source_fidelity: Передача μῆλα как «плоды» обоснованно сохраняет лексическую широту, а «благоухающие» точно передаёт εὔοσμα. Однако φάραγγος означает прежде всего ущелье, теснину или долину, а не сам водный поток; «водного потока» смещает референт.
