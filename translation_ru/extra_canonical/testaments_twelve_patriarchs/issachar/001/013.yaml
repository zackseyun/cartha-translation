  text: But still, in exchange for the mandrakes I hire out to you one night with Jacob.
translation:
  language: ru
  text: 13. Но всё же в обмен на мандрагоры я уступлю тебе одну ночь с Иаковом.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сдам тебе внаём одну ночь с Иаковом»; смысл — уступлю тебе возможность провести с ним одну ночь.'
    reason: Греческое ἐκμισθῶ имеет коммерческий оттенок «отдать за плату, сдать внаём», который трудно сохранить в основном русском тексте без неестественности или двусмысленности.
lexical_decisions:
- source_word: Ἀλλ᾽ οὖν
  choice: Но всё же
  rationale: Передаёт противительный переход с оттенком уступки или подведения итога, не перегружая русскую фразу.
- source_word: ἀντὶ τῶν μανδραγόρων
  choice: в обмен на мандрагоры
  rationale: Прямо выражает обменное значение ἀντί с родительным падежом.
- source_word: ἐκμισθῶ σοι
  choice: я уступлю тебе
  rationale: Буквально глагол связан с отдачей за плату или наймом, однако в данном брачном контексте естественное русское «уступлю тебе» ясно передаёт временную договорённость и избегает ошибочного впечатления, будто говорящая нанимает адресата.
- source_word: μίαν νύκτα τῷ Ἰακώβ
  choice: Иакова на одну ночь
  rationale: Дательный τῷ Ἰακώβ здесь понимается как указание на совместное пребывание с Иаковом; русская конструкция естественно передаёт смысл, сохраняя длительность «одна ночь».
theological_decisions:
- issue: Характер сделки между жёнами Иакова
  choice: Сохранён язык обмена и временной уступки без нравственной оценки.
  alternative: 'Сделать формулировку более явной: «уступлю тебе право провести одну ночь с Иаковом».'
  rationale: Греческий текст сообщает о договорённости, но сам по себе не даёт богословской или нравственной оценки; её не следует привносить.
translation_notes:
  register: Современный литературный русский язык; тон сдержанный и повествовательный. Выражение «уступлю тебе Иакова на одну ночь» выбрано как ясное и естественное, а более буквальная коммерческая образность сохранена в примечании.
