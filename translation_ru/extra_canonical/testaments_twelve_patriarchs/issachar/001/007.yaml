  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/007.yaml
  text: So there were two fruits. And Leah said to Rachel, “Let it be enough for you that you have taken my husband; will you also take these from me?”
translation:
  language: ru
  text: 'Итак, плодов было два. И Лия сказала Рахили: «Пусть тебе будет довольно того, что ты взяла моего мужа; неужели ты возьмёшь у меня ещё и эти плоды?»'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ μῆλα
  choice: плодов
  rationale: μῆλα может обозначать плоды вообще или яблоки; контекст данного стиха не позволяет уверенно уточнить вид, поэтому сохранено более широкое значение.
- source_word: Ἱκανούσθω σοι
  choice: Пусть тебе будет довольно
  rationale: Передаёт повелительно-желательную форму ἱκανούσθω, не превращая её в самостоятельный риторический вопрос.
- source_word: ἔλαβες
  choice: ты взяла
  rationale: Прямое соответствие аористу λαμβάνω; сохраняет обвинительный тон слов Лии.
- source_word: μὴ καὶ ταῦτα λήψῃ ἀπ᾿ ἐμοῦ
  choice: неужели ты возьмёшь у меня ещё и эти плоды?
  rationale: Вопрос с μή естественно передан как вопрос, ожидающий отрицательного ответа; «у меня» соответствует ἀπ᾿ ἐμοῦ, а повтор существительного устраняет неестественную для русского двусмысленность указательного местоимения.
theological_decisions: []
