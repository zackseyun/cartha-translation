  text: A copy of the words of Issachar. For he called his sons and said to them, "Listen, children, to Issachar your father; give ear to the words of one beloved by the Lord.
translation:
  language: ru
  text: 'Копия слов Иссахара. Созвав своих сыновей, он сказал им: «Слушайте, дети, вашего отца Иссахара; внимайте словам того, кого возлюбил Господь».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: Копия
  rationale: Прямо передаёт значение письменной копии или списка, не добавляя отсутствующего в греческом жанрового определения.
- source_word: ἀκούσατε
  choice: Слушайте
  rationale: Естественный русский повелительный глагол, сохраняющий прямой призыв к сыновьям.
- source_word: ἐνωτίσασθε
  choice: внимайте
  rationale: Передаёт усиленный параллельный призыв внимательно выслушать сказанное и сохраняет возвышенный тон.
- source_word: ἠγαπημένου ὑπὸ Κυρίου
  choice: того, кого возлюбил Господь
  rationale: Сохраняет пассивную конструкцию и ясно обозначает Господа как действующее лицо; не превращает её в расплывчатое качественное определение.
theological_decisions:
- issue: Значение причастия ἠγαπημένου
  choice: того, кого возлюбил Господь
  alternative: возлюбленного Господом
  rationale: Оба варианта грамматически возможны; развёрнутая конструкция звучит естественнее и сохраняет богословски значимое указание на Божью любовь без уточнения её основания или характера.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным патриархальным тоном. Обращение «дети» сохраняет форму исходного текста; порядок «Иссахара, отца вашего» удерживает приложение к подразумеваемому «слушайте [меня]» и не допускает ошибочного понимания «дети Иссахара».
