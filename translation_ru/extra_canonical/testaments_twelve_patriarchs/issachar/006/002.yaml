source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 2. Καὶ ἀφέντες⁷ τὸ¹⁰ γεωργεῖν¹¹ ἐξακολουθήσουσι¹² τοῖς Γπονηροῖς¹¹³ διαβουλίοις αὐτῶν καὶ διασπαρήσονται ἐν τοῖς ἔθνεσιν καὶ δουλεύσουσιν¹⁴ τοῖς ἐχθροῖς αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/002.yaml
  text: And leaving farming, they will follow their evil schemes, and they will be scattered among the nations and will servant for their enemies.
translation:
  language: ru
  text: И, оставив земледелие, они последуют своим злым замыслам, будут рассеяны среди народов и станут рабами своих врагов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γεωργεῖν
  choice: земледелие
  rationale: Инфинитив обозначает занятие обработкой земли; существительное «земледелие» естественно передаёт его после оборота «оставив».
- source_word: ἐξακολουθήσουσι
  choice: последуют
  rationale: Передаёт будущее время и смысл следования избранному пути или намерению.
- source_word: τοῖς πονηροῖς διαβουλίοις αὐτῶν
  choice: своим злым замыслам
  rationale: «Замыслы» естественно передаёт διαβούλια как обдуманные намерения или планы; возвратное «своим» ясно соотносит их с подлежащим.
- source_word: διασπαρήσονται ἐν τοῖς ἔθνεσιν
  choice: будут рассеяны среди народов
  rationale: Сохраняет пассивную форму и обычное библейское значение ἔθνη в данном контексте без искусственного уточнения.
- source_word: δουλεύσουσιν τοῖς ἐχθροῖς αὐτῶν
  choice: станут рабами своих врагов
  rationale: Передаёт сильное значение δουλεύω — находиться в рабской зависимости, а не просто служить; по-русски это естественнее буквального «будут рабствовать врагам».
theological_decisions:
- issue: Характер подчинения врагам
  choice: станут рабами своих врагов
  alternative: будут служить своим врагам
  rationale: Выбрана формулировка, сохраняющая присущий δουλεύω смысл рабской зависимости и не ослабляющая его до общего служения.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксический параллелизм трёх будущих последствий сохранён; неясности, требующей примечания, нет.
