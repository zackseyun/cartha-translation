id: T12P.ISS.6.1
reference: Testament of Issachar 6:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: VI. *Γινώσκετε οὖν¹, τέκνα² μου, ὅτι ἐν ἐσχάτοις καιροῖς καταλείψουσιν³ οἱ υἱοὶ ὑμῶν τὴν ἁπλότητα Γκαὶ κολληθήσονται τῇ ἀπληστίᾳ˥, Γκαὶ⁷ ἀφέντες⁴ Γτὴν ἀκακίαν⁵ προσπελάσουσι⁶ τῇ πανουργίᾳ⁷, *καὶ καταλιμπάνοντες⁸ τὰς ἐντολὰς Κυρίου *κολληθήσονται τῷ Βελίαρ⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/001.yaml
  text: Know therefore, my children, that in the last times your sons will abandon simplicity and attach themselves to greed; and leaving innocence[a], they will draw near to cunning, and abandoning the commandments of the Lord, they will attach themselves to Beliar[b].
translation:
  language: ru
  text: Итак, знайте, дети мои, что в последние времена ваши сыновья оставят простоту и прилепятся к алчности; оставив незлобие[a], они обратятся к коварству, а оставив заповеди Господа, прилепятся к Велиару[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бесхитростность». Греческое ἀκακία указывает на отсутствие зла и обмана, а не только на невиновность.'
    reason: lexical_alternative
  - marker: b
    text: Велиар — греческая форма имени в этом тексте; многим читателям оно известно в форме «Велиал».
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁπλότης
  choice: простота
  rationale: Сохраняет нравственный смысл прямоты и цельности, не сводя слово к наивности.
- source_word: ἀπληστία
  choice: алчность
  rationale: Передаёт ненасытное стремление приобретать и составляет ясный нравственный контраст с простотой.
- source_word: ἀκακία
  choice: незлобие
  rationale: Отражает отсутствие зла и злого умысла; вариант «бесхитростность» отмечен в сноске как подчёркивающий отсутствие обмана.
- source_word: πανουργία
  choice: коварство
  rationale: В данном отрицательном контексте обозначает порочную изворотливость и противопоставлено незлобию.
- source_word: κολλάω
  choice: прилепиться
  rationale: Сохраняет сильный образ тесной привязанности; одинаковый перевод в обоих случаях передаёт словесный повтор оригинала.
- source_word: Βελίαρ
  choice: Велиар
  rationale: Передаёт именно греческую форму имени, засвидетельствованную в данном тексте.
theological_decisions:
- issue: Выражение «последние времена»
  choice: последние времена
  alternative: последние дни
  rationale: Буквально передаёт ἐν ἐσχάτοις καιροῖς и не уточняет сверх текста характер или продолжительность этого периода.
- issue: Личное имя Βελίαρ
  choice: Велиар
  alternative: Велиал
  rationale: Сохранена форма рукописного греческого текста; более знакомая библейская форма указана в сноске без отождествляющего толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Повтор «оставив… оставив» и глагол «прилепятся» сохранены ради риторической структуры и образности греческого текста.
