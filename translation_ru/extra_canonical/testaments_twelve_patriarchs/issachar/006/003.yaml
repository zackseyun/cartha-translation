base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/003.yaml
  text: Therefore you also tell these things to your children, so that, if they sin, they may turn back more quickly to the Lord[c],
translation:
  language: ru
  text: Поэтому и вы скажите это своим детям, чтобы, если они согрешат, они скорее обратились к Господу[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «обратиться к Господу» подразумевает покаяние и возвращение к Нему.
    reason: cross_reference
lexical_decisions:
- source_word: εἴπατε
  choice: говорите
  rationale: Императив аориста в контексте наставления передан естественным русским повелительным оборотом, применимым к дальнейшей передаче детям.
- source_word: ταῦτα
  choice: это
  rationale: Нейтрально отсылает к предшествующим наставлениям без добавочного уточнения.
- source_word: τέκνοις
  choice: детям
  rationale: Обычный современный эквивалент, сохраняющий семейный контекст.
- source_word: ἐὰν ἁμάρτωσι
  choice: если согрешат
  rationale: Условная конструкция сохранена без предположения, что грех непременно будет совершён.
- source_word: τάχιον
  choice: скорее
  rationale: Передаёт сравнительно-наречное значение «быстрее, скорее» естественно для русского контекста.
- source_word: ἐπιστρέψωσι πρὸς τὸν Κύριον
  choice: обратились к Господу
  rationale: «Обратиться к Господу» передаёт направленность ἐπιστρέφω πρός и присущий контексту смысл покаяния и возвращения к Богу.
theological_decisions:
- issue: Смысл ἐπιστρέφω в выражении о Господе
  choice: обратились к Господу
  alternative: вернулись к Господу
  rationale: Выбранный вариант сохраняет одновременно идею изменения направления, покаяния и восстановления отношений, не сводя выражение только к пространственному возвращению.
translation_notes:
  register: Современный литературный русский язык; наставительный и достойный тон. Синтаксис близок к греческому, но звучит естественно. Подлинная условность «если согрешат» сохранена.
