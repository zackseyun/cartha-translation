translation:
  language: ru
  text: потому что Он милостив и избавит их, чтобы возвратить их на их землю[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Заключительные слова можно также понять как: «и вернёт их на их землю» или «чтобы они возвратились на свою землю».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεήμων
  choice: милостив
  rationale: Передаёт Божье качество милосердия естественным и достойным русским выражением.
- source_word: ἐξελεῖται
  choice: избавит
  rationale: Будущая форма глагола ἐξαιρέω здесь означает освобождение или избавление; выбор сохраняет прямой смысл без уточнения характера бедствия.
- source_word: τοῦ ἐπιστρέψαι
  choice: чтобы возвратить
  rationale: Артикль с инфинитивом может обозначать цель или результат. В данном контексте каузативное «возвратить» естественно связывает избавление с возвращением народа.
- source_word: εἰς τὴν γῆν αὐτῶν
  choice: в их землю
  rationale: Буквально и ясно передаёт направление возвращения и принадлежность земли.
theological_decisions:
- issue: Субъект милости и избавления
  choice: Местоимение «Он» написано с прописной буквы как указание на Бога в ближайшем контексте.
  alternative: «он» со строчной буквы
  rationale: Прописная буква соответствует достоинству русского религиозного регистра, не добавляя к тексту нового догматического содержания.
- issue: Связь заключительного инфинитивного оборота с избавлением
  choice: 'Целевая связь: «чтобы возвратить».'
  alternative: 'Сочинительная передача: «и вернёт их»; либо более буквальное «чтобы они возвратились».'
  rationale: Конструкция τοῦ с аористным инфинитивом допускает цель или результат, а активная форма ἐπιστρέψαι без явно выраженного подлежащего допускает как каузативное «возвратить их», так и понимание возвращения самих людей. Основной текст следует контекстуальному каузативному прочтению, а неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с краткой, торжественной синтаксической формой. Сохранена логическая связь с предшествующей фразой посредством начального «потому что». Местоименное повторение «их в их землю» оставлено ради точности, хотя по-русски возможно более плавное «в свою землю».
