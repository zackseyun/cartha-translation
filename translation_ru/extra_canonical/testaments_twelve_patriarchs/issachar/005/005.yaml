  text: For no other portion has been given to you except the richness of the earth by the labor of fruits.
translation:
  language: ru
  text: Ибо не дано вам иного удела, кроме плодородия земли, обретаемого трудами ради её плодов[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческое выражение необычно и буквально может быть передано: «в трудах плодов». Связь слов «труды» и «плоды» не вполне ясна; перевод понимает их как труды ради плодов земли.'
    reason: Поясняет необычную конструкцию ἐν πόνοις καρπῶν и отмечает её синтаксическую неоднозначность, не выдавая одно толкование за несомненное.
lexical_decisions:
- source_word: μερὶς
  choice: удел
  rationale: Передаёт назначенную или доставшуюся долю; в данном контексте звучит естественнее и возвышеннее, чем «часть».
- source_word: πιότης τῆς γῆς
  choice: плодородие земли
  rationale: Буквальное «тучность земли» в современном русском неестественно; выражение обозначает богатство, плодородность почвы.
- source_word: ἐν πόνοις καρπῶν
  choice: и труда ради её плодов
  rationale: Сохраняет связь труда с плодами земли и сельскохозяйственный смысл, не вводя более конкретного толкования вроде «земледелия»; необычная конструкция пояснена в сноске.
