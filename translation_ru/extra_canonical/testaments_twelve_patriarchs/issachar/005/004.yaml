  text: For in the firstfruits of the produce of the land the Lord will bless you, just as he blessed all the holy ones from Abel until now.
translation:
  language: ru
  text: Ибо в первых плодах земного урожая Господь благословит вас, как благословил всех святых от Авеля доныне.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πρωτογεννήμασιν καρπῶν τῆς γῆς
  choice: через первые плоды земли
  rationale: Предлог ἐν здесь естественно передаёт средство или сферу благословения; «первые плоды» понятно современному читателю и сохраняет сельскохозяйственный образ исходного текста.
- source_word: εὐλογήσει ὑμᾶς Κύριος
  choice: Господь благословит вас
  rationale: Сохранены будущее время, обращение во множественном числе и традиционное соответствие Κύριος.
- source_word: πάντας τοὺς ἁγίους
  choice: всех святых
  rationale: Буквально передаёт субстантивированное прилагательное и не уточняет сверх текста, идёт ли речь исключительно о канонизированных лицах или шире — о людях, посвящённых Богу.
- source_word: ἀπὸ Ἀβὲλ ἕως τοῦ νῦν
  choice: от Авеля и доныне
  rationale: Сохраняет временной диапазон исходной формулы в естественной литературной русской форме.
theological_decisions:
- issue: Характер благословения через первые плоды
  choice: «через первые плоды земли»
  alternative: «в первых плодах земли»
  rationale: Греческое ἐν допускает оттенки сферы и средства. Выбранная формулировка звучит естественно и не превращает благословение исключительно в материальное содержание самих плодов.
- issue: Обозначение прежних праведников
  choice: «всех святых»
  alternative: «всех праведников»
  rationale: «Святые» точнее соответствует ἅγιοι и сохраняет богословскую лексику источника, не подменяя святость праведностью.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис краткий и ясный; тире выделяет итоговую временную формулу без изменения смысла.
