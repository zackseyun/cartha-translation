  source_fidelity: 'Смысл в целом передан точно: сохранены побудительный характер, телесный образ «спины», земледельческий труд во всём его объёме и приношение даров Господу с благодарением. Однако «во всяком деле возделывания» звучит как калька и недостаточно ясно передаёт греческое указание на всякий земледельческий труд.'
