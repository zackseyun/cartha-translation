  text: Bend your back to farming, and labor in every work of cultivation, offering gifts to the Lord with thanksgiving.
translation:
  language: ru
  text: Склоняйте спину к земледелию и трудитесь во всяком земледельческом деле, принося Господу дары с благодарностью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑποτίθετε τὸν νῶτον ὑμῶν
  choice: Склоняйте спину свою
  rationale: Сохраняет телесный земледельческий образ греческого выражения и его побудительный характер, не заменяя его отвлечённым «усердно трудитесь».
- source_word: εἰς τὸ γεωργεῖν
  choice: к земледелию
  rationale: Передаёт конкретное значение возделывания земли и естественно сочетается с образом склонённой спины.
- source_word: ἐργάζεσθε ἐν ἔργοις καθ᾽ ἑκάστην γεωργίαν
  choice: трудитесь во всяком деле возделывания
  rationale: Воспроизводит повтор корней «работать/дело» в умеренно естественной русской форме и сохраняет широкий охват всех земледельческих работ.
- source_word: δῶρα μετ᾽ εὐχαριστείας Κυρίῳ προσφέροντες
  choice: с благодарностью принося дары Господу
  rationale: Сохраняет обстоятельственное причастие, адресата приношения и явное значение благодарности.
theological_decisions:
- issue: Характер «даров» Господу
  choice: дары
  alternative: приношения
  rationale: Греческое δῶρα буквально означает «дары» и не требует уточнения, являются ли они культовыми приношениями, плодами урожая или более общими дарами; двусмысленность сохранена.
translation_notes:
  register: Современный литературный русский с достоинством увещания. Синтаксис близок к греческому, но остаётся понятным; конкретная земледельческая образность сохранена.
