base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/008.yaml
  text: Therefore obey them, and walk in the simplicity of your father. [But to Gad it was given to destroy the marauding bands coming upon Israel.]
translation:
  language: ru
  text: Итак, и вы повинуйтесь им и живите в простоте вашего отца. [А Гаду было дано уничтожить разбойничьи отряды, идущие на Израиль.][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Предложение о Гаде заключено в квадратные скобки в используемом греческом издании, что указывает на текстологическую неуверенность.
    reason: Объясняет редакционные скобки источника и сохраняет прозрачность текстовой традиции.
lexical_decisions:
- source_word: ὑπακούετε
  choice: повинуйтесь
  rationale: Передаёт прямой призыв слушаться и подчиняться, сохраняя повелительную силу греческой формы.
- source_word: ἁπλότης
  choice: простота
  rationale: Сохраняет ключевое для завещания понятие цельности, прямоты и отсутствия двоедушия, не сужая его до одной добродетели.
- source_word: περιπατεῖτε
  choice: ходите
  rationale: Сохранена библейская метафора образа жизни, естественная и узнаваемая в русском религиозном регистре.
- source_word: πειρατήρια
  choice: разбойничьи отряды
  rationale: Редкое слово обозначает разбойничьи или налётнические формирования; «отряды» естественно передаёт действующих нападающих, а не сами набеги.
- source_word: ἐπερχόμενα
  choice: нападавшие
  rationale: В контексте вражеских отрядов естественно выражает их движение против Израиля; временная соотнесённость согласована с «было дано».
theological_decisions:
- issue: К кому относится «им» в αὐτοῖς
  choice: Сохранено местоимение «им» без уточнения референта.
  alternative: Назвать предполагаемых лиц прямо.
  rationale: Стих сам по себе не раскрывает референт; его экспликация устранила бы присущую контексту зависимость и могла бы внести толкование.
- issue: Значение «простоты» отца
  choice: Сохранён широкий термин «простота».
  alternative: «искренность», «чистосердечие» или «непорочность».
  rationale: Греческое ἁπλότης допускает смысл прямоты, цельности и искренности; более узкий эквивалент преждевременно разрешил бы смысловое напряжение.
- issue: Текст в квадратных скобках
  choice: Сохранён в квадратных скобках и снабжён текстологической сноской.
  alternative: Включить без скобок либо опустить.
  rationale: Скобки исходного издания сигнализируют текстологическую особенность, которую следует сделать понятной читателю, не вынося решения о подлинности.
translation_notes:
  register: Современный литературный русский с умеренно библейским достоинством. «Ходите в простоте» намеренно сохраняет образность и ключевую лексику оригинала; конструкция о разбойничьих отрядах сделана естественной для современного читателя.
