  text: But love the Lord and your neighbor. Show mercy to the poor and the weak.
translation:
  language: ru
  text: Но любите Господа и ближнего. Будьте милосердны к бедному и немощному.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπήσατε
  choice: любите
  rationale: Императив аориста передан естественным русским повелительным глаголом несовершенного вида, выражающим устойчивое нравственное требование.
- source_word: τὸν πλησίον
  choice: ближнего
  rationale: Традиционный и понятный русский эквивалент для обозначения другого человека как того, к кому обращена любовь.
- source_word: πένητα
  choice: бедному
  rationale: Передаёт человека, живущего в нужде и вынужденного трудиться ради пропитания, без более узкого оттенка полного нищенства.
- source_word: ἀσθενῆ
  choice: немощному
  rationale: Сохраняет широкое значение физической или общей слабости и звучит достойно в увещательном контексте.
- source_word: ἐλεήσατε
  choice: будьте милосердны
  rationale: Естественно передаёт призыв проявлять милость; форма во множественном числе согласована с двумя субстантивированными определениями в единственном числе как собирательными категориями нуждающихся.
theological_decisions:
- issue: Объекты заповеди любви
  choice: «Господа и ближнего» сохранены как два прямо названных объекта любви
  alternative: Переформулировать как две отдельные заповеди
  rationale: Греческий текст соединяет оба дополнения одним глаголом; перевод не добавляет разграничений или богословских пояснений.
- issue: Число у «бедного и немощного»
  choice: Сохранено единственное число
  alternative: «бедным и немощным» во множественном числе
  rationale: Единственное число следует греческим πένητα καὶ ἀσθενῆ и представляет типичного нуждающегося человека, не исключая общего применения.
