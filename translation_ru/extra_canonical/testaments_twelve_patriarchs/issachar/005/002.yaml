  naturalness: Текст краткий, ясный и соответствует современному литературному русскому с уместно возвышенным увещательным регистром. «Будьте милосердны к...» — естественная русская передача ἐλεήσατε; точка между двумя побуждениями не искажает синтаксис или смысл.
