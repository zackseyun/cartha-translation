translation:
  language: ru
  text: Ведь и отец мой Иаков благословил меня благословениями земли и начатков плодов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτι καὶ
  choice: Ведь и
  rationale: Передаёт пояснительно-причинный оттенок ὅτι и присоединительное значение καί, естественно связывая фразу с предшествующим контекстом.
- source_word: ἐν εὐλογίαις
  choice: благословениями
  rationale: Творительный падеж естественно передаёт греческое ἐν в значении средства или содержания благословения и сохраняет намеренный повтор «благословил… благословениями».
- source_word: τῆς γῆς
  choice: земли
  rationale: Сохраняет прямое родительное определение без сужения значения до поля, страны или урожая.
- source_word: ἀπαρχῶν καρπῶν
  choice: начатков плодов
  rationale: «Начатки» точно передают культовое и сельскохозяйственное значение ἀπαρχαί, а «плодов» сохраняет явное καρπῶν, не заменяя его более узким словом «урожай».
