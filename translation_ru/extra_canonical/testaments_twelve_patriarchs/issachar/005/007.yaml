base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/007.yaml
  text: 'And Levi and Judah were glorified by the Lord among the sons of Jacob. And the Lord allotted to them their inheritance: to Levi, the priesthood; and to Judah, the kingdom.'
translation:
  language: ru
  text: 'И Левий, и Иуда были прославлены Господом среди сыновей Иакова. Господь дал им их удел: Левию — священство, а Иуде — царство.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδοξάσθησαν παρὰ Κυρίου
  choice: были прославлены Господом
  rationale: Пассивная конструкция точно передаёт греческий аорист и сохраняет Господа как действующее лицо.
- source_word: ἐν υἱοῖς Ἰακώβ
  choice: среди сыновей Иакова
  rationale: Предлог ἐν здесь естественно выражает положение Левия и Иуды в кругу сыновей Иакова.
- source_word: ἐκληροδότησεν αὐτούς
  choice: дал им их удел
  rationale: Передаёт идею наследственного наделения, выраженную редким глаголом ἐκληροδοτέω, и естественно звучит по-русски; последующие уточнения показывают содержание удела каждого.
- source_word: τὴν ἱερατείαν
  choice: священство
  rationale: Обозначает священническое служение и достоинство, предназначенные Левию.
- source_word: τὴν βασιλείαν
  choice: царство
  rationale: Прямое соответствие βασιλεία, сохраняющее возможный смысл царской власти и царства без излишнего уточнения.
theological_decisions:
- issue: Характер дара Левию и Иуде
  choice: дал им их удел
  alternative: передал им в наследие
  rationale: Выбранная формулировка сохраняет наследственно-распределительный оттенок ἐκληροδότησεν и не утверждает сверх текста, что речь идёт только о собственности либо только о должности.
- issue: Значение βασιλεία применительно к Иуде
  choice: царство
  alternative: царская власть
  rationale: «Царство» ближе к обычному диапазону βασιλεία и сохраняет смысловую широту между царской властью, царским достоинством и царством.
translation_notes:
  register: Современный литературный русский язык; торжественный, но понятный синтаксис. Параллелизм «Левию — …, а Иуде — …» сохраняет структуру и риторический баланс греческого текста.
