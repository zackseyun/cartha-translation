source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: V. Φυλάξατε οὖν *τέκνα μου νόμον Θεοῦ¹, καὶ *τὴν ἁπλότητα κτήσασθε², ⌜καὶ ἐν ἀκακίᾳ πορεύεσθε, μὴ περιαργαζόμενοι τοῦ³ πλησίον⁴ τὰς πράξεις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/001.yaml
  text: Therefore, my children, keep the law of God, and acquire simplicity, and walk in innocence, not concerning yourselves with the deeds of your neighbor.
translation:
  language: ru
  text: Итак, дети мои, соблюдайте закон Божий, обретайте простоту и живите в незлобии, не вмешиваясь в дела ближнего.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξατε
  choice: соблюдайте
  rationale: В сочетании с «законом» глагол означает хранить его посредством исполнения; «соблюдайте» естественно передаёт этот смысл по-русски.
- source_word: τὴν ἁπλότητα κτήσασθε
  choice: обретайте простоту
  rationale: ἁπλότης здесь обозначает простоту и цельность нрава, а κτάομαι — приобретение этого качества. Формулировка сохраняет образ нравственного обретения, не сводя его только к искренности.
- source_word: ἐν ἀκακίᾳ πορεύεσθε
  choice: живите в незлобии
  rationale: ἀκακία означает отсутствие зла, беззлобие или невинность. «Живите» естественно передаёт переносное значение πορεύεσθε («ходите», то есть ведите жизнь), а «незлобие» сохраняет нравственный оттенок исходного слова.
- source_word: μὴ περιαργαζόμενοι ... τὰς πράξεις
  choice: не вмешиваясь в дела
  rationale: περιαργάζομαι выражает излишнее занятие чужими делами, вплоть до назойливого вмешательства. Русская формулировка передаёт запрет на такое вмешательство без разговорного оттенка.
- source_word: τοῦ πλησίον
  choice: ближнего
  rationale: Традиционное и точное обозначение другого человека как ближнего; родственное единственное число исходного текста сохранено.
theological_decisions:
- issue: Смысл «закона Божия»
  choice: Сохранено общее выражение «закон Божий» без уточнения его объёма.
  alternative: Уточнить как Моисеев закон или как все Божьи заповеди.
  rationale: Греческий текст не конкретизирует значение νόμον Θεοῦ, поэтому перевод не должен вводить конфессиональное или историко-богословское толкование.
- issue: Соотношение ἁπλότης и ἀκακία
  choice: Переданы раздельно как «простота» и «незлобие».
  alternative: Передать оба понятия близкими словами, например «искренность» и «невинность».
  rationale: Исходный текст называет два взаимосвязанных, но не тождественных качества; раздельная передача сохраняет их смысловое напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис остаётся ясным для широкого читателя; буквальное «ходите» заменено естественным переносным «живите», тогда как выражение «закон Божий» сохранено.
