revisions:
- from: 'Завещание Иссахара, пятого сына Иакова и Лии


    1. Список слов Иссахара.[a] Созвав своих сыновей, он сказал им: «Слушайте, дети, Иссахара, отца вашего; внимайте словам того, кого возлюбил Господь.


    2. Я родился у Иакова пятым сыном — как плата за мандрагоры.[b]


    3. Ибо мой брат Рувим принёс с поля мандрагоры, а Рахиль встретила его и забрала их.


    4. Рувим заплакал, и на его плач вышла моя мать Лия.


    5. Это были благоуханные плоды,[c] которые растут в земле Харранской ниже водного потока.


    6. Рахиль сказала: „Я не отдам их тебе, но оставлю себе вместо детей, потому что Господь обошёл меня вниманием, и я не родила Иакову детей“.


    7. Плодов же было два. И Лия сказала Рахили: „Разве мало тебе, что ты забрала моего мужа? Неужели заберёшь у меня и это?“


    8. Рахиль ответила ей: „Пусть тогда Иаков будет с тобой этой ночью в обмен на мандрагоры твоего сына“.


    9. Но Лия сказала ей: „Иаков — мой, потому что я жена его юности“.


    10. Рахиль ответила: „Не хвались и не превозноси себя: он был обручён со мной прежде, чем с тобой, и ради меня служил нашему отцу четырнадцать лет.


    11. Если бы обман не умножился на земле и людское зло не распространилось, ты не видела бы лица Иакова.


    12. Лаван коварно обманул меня и в ту ночь увёл меня оттуда, не позволив Иакову увидеть меня. Ведь если бы я была там, этого с ним не случилось бы.


    13. Но всё же за мандрагоры я уступлю тебе одну ночь с Иаковом“.


    14. И Рахиль продолжила: „Я возьму один из мандрагоров и за него уступлю тебе эту ночь“.[d]


    15. Иаков познал Лию, и она зачала и родила меня; поэтому, в связи с этой платой, меня назвали Иссахаром».[e]'
