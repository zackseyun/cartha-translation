base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006.yaml
  text: Know therefore, my children, that in the last times your sons will abandon simplicity and attach themselves to greed; and leaving innocence[a], they will draw near to cunning, and abandoning the commandments of the Lord, they will attach themselves to Beliar[b]. And leaving farming, they will follow their evil schemes, and they will be scattered among the nations and will serve their enemies. Therefore you also tell these things to your children, so that, if they sin, they may return more quickly to the Lord[c], because he is merciful and will deliver them, to bring them back into their land[d].
translation:
  language: ru
  text: 6 Знайте же, дети мои, что в последние времена ваши сыновья оставят простоту и прилепятся к алчности; оставив незлобие[a], они обратятся к коварству, а оставив заповеди Господа, прилепятся к Велиару[b]. 2 Оставив земледелие, они последуют своим злым замыслам, будут рассеяны среди народов и станут служить своим врагам. 3 Поэтому и вы скажите об этом своим детям, чтобы они, если согрешат, поскорее вернулись к Господу[c], 4 потому что Он милосерден и избавит их, чтобы вернуть их на их землю[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «бесхитростность». Греческое слово ἀκακία подчёркивает отсутствие злого умысла и обмана, а не только невиновность.'
    reason: lexical_alternative
  - marker: b
    text: Велиар — форма имени в данном греческом тексте; более известный вариант имени — «Велиал».
    reason: lexical_alternative
  - marker: c
    text: «Вернуться к Господу» означает также раскаяться и вновь обратиться к Нему.
    reason: cross_reference
  - marker: d
    text: 'Последнюю часть фразы можно также понять так: «и вернёт их на их землю».'
    reason: alternative_reading
lexical_decisions:
- source_word: ἁπλότης
  choice: простота
  rationale: 'В Завещании Иссахара это тематическая добродетель: цельность и нераздвоенность нравственного устремления. «Простота» сохраняет повторяющуюся лексику произведения, не сводя смысл к наивности.'
- source_word: ἀπληστία
  choice: алчность
  rationale: Слово обозначает ненасытное, корыстное стремление приобретать. «Алчность» естественно и весомо противопоставлена простоте.
- source_word: ἀκακία
  choice: незлобие
  rationale: Термин означает отсутствие зла, злого умысла или коварства. «Незлобие» точнее русского «невинность» передаёт нравственную неиспорченность и хорошо контрастирует с последующим коварством; сноска сохраняет возможный оттенок бесхитростности.
- source_word: πανουργία
  choice: коварство
  rationale: Здесь речь об изощрённой, нравственно порочной хитрости. «Коварство» ясно передаёт отрицательную оценку и образует естественный контраст с незлобием.
- source_word: κολλάω / κολληθήσονται
  choice: прилепятся к
  rationale: Одинаковый перевод в обоих случаях сохраняет риторический параллелизм и выражает тесную привязанность или переход на сторону алчности и Велиара.
- source_word: Βελίαρ
  choice: Велиар
  rationale: Передана непосредственно форма имени в греческом свидетельстве, без нормализации к более знакомому библейскому варианту «Велиал».
- source_word: γεωργεῖν
  choice: земледелие
  rationale: Инфинитив обозначает возделывание земли — важную часть идеала жизни Иссахара. «Земледелие» звучит естественно в литературном повествовании и точнее, чем общее «труд».
- source_word: πονηροῖς διαβουλίοις
  choice: злым замыслам
  rationale: Сочетание указывает на нравственно порочные намерения и планы. «Злые замыслы» передают как оценку, так и деятельное планирование.
- source_word: διασπαρήσονται
  choice: будут рассеяны
  rationale: Страдательный залог и образ рассеяния среди народов сохранены; выражение несёт оттенок изгнания и диаспоры.
- source_word: δουλεύσουσιν
  choice: станут служить
  rationale: Глагол допускает смысл рабского подчинения, но непосредственная конструкция естественно передаётся как «служить своим врагам», сохраняя возможность понимания как порабощения.
- source_word: τάχιον
  choice: скорее
  rationale: Русское «скорее» естественно передаёт сравнительное наречие и призыв не медлить с возвращением после греха.
- source_word: ἐπιστρέψωσι πρὸς τὸν Κύριον
  choice: возвратились к Господу
  rationale: Выражение сохраняет одновременно смысл покаяния, восстановления отношений и возвращения к прежней верности.
theological_decisions:
- issue: Значение ἐν ἐσχάτοις καιροῖς
  choice: в последние времена
  alternative: в позднейшие времена; в конце времён
  rationale: Фраза указывает на грядущие последние дни, но сама по себе не задаёт подробной апокалиптической хронологии. Буквально близкий вариант сохраняет пророческий регистр и напряжение текста.
- issue: Связь τοῦ ἐπιστρέψαι αὐτοὺς εἰς τὴν γῆν αὐτῶν с предшествующим глаголом
  choice: избавит их, чтобы возвратить их в их землю
  alternative: избавит их и возвратит их в их землю; избавит их, когда возвратит их в их землю
  rationale: Греческая инфинитивная конструкция сжата и может выражать цель или результат избавления. Основной текст передаёт целевое прочтение, а сноска сохраняет альтернативу восстановления.
- issue: Религиозный смысл возвращения к Господу
  choice: сохранить глагол «возвратиться» без поясняющей вставки «покаяться»
  alternative: покаяться и обратиться к Господу
  rationale: ἐπιστρέφω включает покаянный смысл, но также несёт образ возвращения и восстановления. Явная вставка сузила бы многозначность исходного выражения.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного и пророческого наставления. Сохранены повтор «оставив» и параллельное «прилепятся», формирующие риторику отступничества. Нумерация стихов включена; местоимение «Он» написано с прописной буквы в соответствии с устойчивой русской религиозно-литературной нормой, без внесения дополнительного толкования.
