base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005.yaml
  text: '1 Therefore[a], my children, keep the law of God, and acquire simplicity, and walk in innocence, not meddling in the deeds of your neighbor. 2 But love the Lord and your neighbor; show mercy to the poor and the weak. 3 Set your back to farming, and labor in every work of cultivation, offering gifts to the Lord with thanksgiving. 4 For in the firstfruits of the produce of the land the Lord will bless you, just as he blessed all the holy ones from Abel until now[b]. 5 For no other portion has been given to you except the richness of the earth in the toils of its fruits. 6 For my father Jacob also blessed me with blessings of the earth and of firstfruits of produce. 7 And Levi and Judah were glorified by the Lord among the sons of Jacob. And the Lord gave them their inheritance: to Levi, the priesthood; and to Judah, the kingdom. 8 Therefore obey them, and walk in the simplicity of your father[c]. [But to Gad it was given to destroy the marauding raids coming upon Israel.]'
translation:
  language: ru
  text: '1 Итак, дети мои, соблюдайте Закон Божий, стяжайте простоту и ходите в незлобии, не вмешиваясь в дела ближнего. 2 Но любите Господа и ближнего; будьте милосердны к бедному и немощному. 3 Склоняйте спину за земледельческим трудом и занимайтесь всякими полевыми работами, с благодарностью принося дары Господу. 4 Ибо в первинках плодов земли Господь благословит вас, как благословил всех святых от Авеля и доныне[a]. 5 Ведь не дано вам иного удела, кроме плодородия земли, обретаемого трудами над её плодами[b]. 6 Ибо и отец мой Иаков благословил меня благословениями земли и первинок её плодов. 7 Левий и Иуда были прославлены Господом среди сыновей Иакова. Господь дал им удел: Левию — священство, а Иуде — царство. 8 Итак, повинуйтесь им и ходите в простоте вашего отца. [А Гаду было дано уничтожать разбойничьи набеги, обрушивающиеся на Израиль.][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Все святые от Авеля и доныне», вероятно, означает череду угодных Богу поклонников, начинающуюся с Авеля; ср. тему первинок в Бытии 4:3–5 и последующей библейской традиции.
    reason: cross_reference
  - marker: b
    text: 'Буквально: «кроме тучности земли». Это древний земледельческий образ плодородной, обильной земли.'
    reason: lexical_alternative
  - marker: c
    text: Заключительная фраза о Гаде контекстуально выглядит неуместной и может быть поздней вставкой или строкой, перемещённой со своего первоначального места. Она переведена, поскольку присутствует в греческом свидетельстве.
    reason: textual_variant
lexical_decisions:
- source_word: νόμον Θεοῦ
  choice: Закон Божий
  rationale: Сохраняет объективный родительный падеж и возвышенный характер завещательного наставления; прописная буква указывает на Божий Закон как установленную норму, не добавляя конфессионального толкования.
- source_word: ἁπλότητα
  choice: простоту
  rationale: Передаёт сквозную тему цельности, прямоты и отсутствия двоедушия, не сводя слово исключительно к простодушию или интеллектуальной простоте.
- source_word: ἀκακίᾳ
  choice: незлобии
  rationale: Выражает отсутствие злобы и дурного умысла и естественно сочетается с «простотой» в нравственном наставлении.
- source_word: μὴ περιαργαζόμενοι τοῦ πλησίον τὰς πράξεις
  choice: не вмешиваясь в дела ближнего
  rationale: Передаёт неодобряемое любопытство и суетливое вмешательство в поступки или дела другого человека; «дела» сохраняет широту πράξεις.
- source_word: πένητα καὶ ἀσθενῆ ἐλεήσατε
  choice: будьте милосердны к бедному и немощному
  rationale: Естественный русский императив сохраняет активный нравственный призыв; «немощный» охватывает слабость без неоправданного сведения только к болезни.
- source_word: Ὑποτίθετε τὸν νῶτον ὑμῶν εἰς τὸ γεωργεῖν
  choice: Склоняйте спину за земледельческим трудом
  rationale: Сохраняет телесный образ тяжёлого труда, избегая неестественного буквального «подставляйте спину для земледелия».
- source_word: δῶρα μετ᾽ εὐχαριστείας Κυρίῳ προσφέροντες
  choice: с благодарностью принося дары Господу
  rationale: Сохраняет культовый оттенок προσφέροντες и прямое значение δῶρα, а также благодарственный характер приношения.
- source_word: ἐν πρωτογεννήμασιν καρπῶν τῆς γῆς
  choice: через первинки плодов земли
  rationale: «Первинки» сохраняют библейский земледельческий и культовый образ; «через» допустимо передаёт неоднозначное ἐν, не превращая первинки безусловно в содержание благословения.
- source_word: ἁγίους
  choice: святых
  rationale: Прямой и узнаваемый эквивалент, не заменяющий исходное слово толкующим «праведников».
- source_word: πιότητος τῆς γῆς
  choice: плодородия земли
  rationale: Передаёт аграрную идиому «тучность земли» современным и ясным языком; буквальный образ отмечен в сноске.
- source_word: ἐκληροδότησεν αὐτούς
  choice: дал им удел
  rationale: Кратко выражает наделение наследственным уделом и согласуется с последующим распределением священства и царства.
- source_word: τὰ ἐπερχόμενα πειρατήρια
  choice: разбойничьи отряды, нападающие
  rationale: В сухопутном контексте πειρατήρια обозначает грабительские или налётные отряды, а не обязательно морских пиратов; причастие передано как нападение на Израиль.
theological_decisions:
- issue: Кого обозначают «все святые от Авеля и доныне»
  choice: Сохранено общее «всех святых», без замены на «праведников» или «угодных Богу».
  alternative: «всех праведников от Авеля и доныне»
  rationale: Греческое ἁγίους буквально означает «святых». Вероятная отсылка к череде угодных Богу поклонников, начинающейся с Авеля, вынесена в примечание, а не встроена в перевод.
- issue: Статус заключительной фразы о Гаде
  choice: Фраза переведена в квадратных скобках и снабжена текстологическим примечанием.
  alternative: Опустить её как позднюю глоссу либо печатать без скобок как бесспорно исходную часть текста.
  rationale: Фраза присутствует в данном греческом свидетельстве, но нарушает ход наставления после повеления повиноваться Левию и Иуде. Скобки сохраняют свидетельство и одновременно честно показывают его контекстуальную неустойчивость.
- issue: Связь благословения с первинками в стихе 4
  choice: Неоднозначное ἐν передано как «через первинки».
  alternative: «первыми плодами земли Господь благословит вас» или «при принесении первинок Господь благословит вас».
  rationale: Греческая конструкция допускает инструментальный или обстоятельственный оттенок. Выбранный вариант не решает окончательно, являются ли первинки средством, обстоятельством или содержанием благословения.
translation_notes:
  register: Современный литературный русский с достоинством завещательного наставления. Сохранены библейские термины «Закон Божий», «первинки», «священство», «царство» и «удел», но синтаксис сделан понятным обычному читателю. Архаизирующие формы используются лишь там, где они живы в религиозно-литературном регистре («доныне», «незлобие»); тяжёлые кальки с греческого устранены.
