    rationale: Оборот ἐν ἁπλότητι καρδίας допускает связь с Божьим сопутствием людям, живущим в простоте сердца, но греческая конструкция не выражена как русское относительное придаточное. Следует сохранить более открытую формулировку и отметить альтернативное членение в примечании.
