base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007.yaml
  text: '1[a]. See then, as you see: I am one hundred and twenty-six years old, and I am not conscious of committing any sin unto death. 2. Except for my wife, I have not known another woman. I did not commit sexual immorality with wandering eyes. 3. I did not drink wine for deception[b], and I did not desire anything of my neighbor. 4. No deceit came to be in my heart, and no lie went up through my lips. 5. I groaned together with every person in pain, and I shared my bread with the poor. I practiced godliness in all my days; I kept truth. 6. I loved the Lord with all my strength, and likewise I loved every person with all my heart, more than my children. 7. You also, my children, do these things, and every spirit of Beliar will flee from you, and no deed of wicked people will rule over you; and you will subdue every wild beast, having with you the God of heaven and earth, who walks with people in simplicity of heart. 8. And after saying these things he commanded his sons to carry him up
    to Hebron and bury him there with his fathers in the cave. 9. And stretching out his feet, he fell asleep in a good old age, sound in every limb and strong[d][c], and slept the eternal sleep.'
translation:
  language: ru
  text: '1. Итак, вот, как вы видите: мне сто двадцать шесть лет, и я не знаю за собой греха, ведущего к смерти.[a] 2. Кроме своей жены, я не познал другой женщины. Я не предавался разврату, блуждая глазами. 3. Я не пил вина, чтобы оно вводило меня в заблуждение,[b] и не желал ничего, что принадлежит ближнему. 4. В сердце моём не было коварства, и ложь не исходила из моих уст. 5. Я стонал вместе со всяким страдающим и делился своим хлебом с бедным. Во все дни моей жизни я поступал благочестиво и хранил истину. 6. Всем сердцем я любил Господа и каждого человека — больше, чем собственных детей. 7. Так поступайте и вы, дети мои, и всякий дух Велиара[c] убежит от вас; никакое дело злых людей не будет властвовать над вами, и вы покорите всякого дикого зверя, имея с собой Бога неба и земли, идущего с людьми в простоте сердца.[d] 8. Сказав это, он велел своим сыновьям отнести его в Хеврон и там похоронить вместе с его отцами. 9. Затем он вытянул ноги и в доброй старости уснул вечным сном.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Возможно также: «я не сознаю в себе греха, ведущего к смерти». Глагол «знать» здесь имеет смысл нравственного осознания; выражение не обязательно утверждает полную безгрешность.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «я не пил вина для введения в заблуждение». Речь может идти как о заблуждении и уклонении с пути, так и о самообмане, вызванном вином.'
    reason: ambiguity
  - marker: c
    text: «Велиар» — форма имени в греческом тексте; в других традициях употребляется форма «Велиал».
    reason: alternative_reading
  - marker: d
    text: 'Оборот «идущего с людьми в простоте сердца» можно понять и так: Бог неба и земли сопутствует людям, когда они живут в простоте сердца. Греческая конструкция не вполне определяет смысловую связь этого оборота.'
    reason: alternative_reading
  - marker: e
    text: 'Текстовые формы заключительного стиха различаются: в некоторых встречаются формулировка о смерти в доброй старости и расширение о том, что Иссахар сохранил крепость и целость всех членов. В представленном греческом тексте сказано, что он «уснул в доброй старости вечным сном».'
    reason: textual_variant
lexical_decisions:
- source_word: ἔγνων ἐν ἐμοὶ ἁμαρτίαν εἰς θάνατον
  choice: не знаю за собой греха, ведущего к смерти
  rationale: «Знать за собой» естественно передаёт нравственное самосознание, выраженное ἔγνων ἐν ἐμοί, а «ведущего к смерти» сохраняет направленность εἰς θάνατον и не вводит позднейший термин «смертный грех».
- source_word: Πλὴν τῆς συμβίου μου ... οὐκ ἔγνων ἄλλην
  choice: Кроме своей жены, я не познал другой женщины
  rationale: «Познал» сохраняет понятный библейский эвфемизм сексуальных отношений; σύμβιος в данном контексте естественно передано как «жена».
- source_word: ἐν μετεωρισμῷ ὀφθαλμῶν μου
  choice: блуждая глазами
  rationale: Оборот передаёт беспокойный, вожделеющий взгляд без тяжеловесного буквализма.
- source_word: οἶνον εἰς ἀποπλάνησιν
  choice: вина, чтобы оно вводило меня в заблуждение
  rationale: Сохранена неоднозначная мысль о вине как причине уклонения или самообмана; значение не сужено до простого опьянения.
- source_word: πᾶν ἐπιθύμημα τοῦ πλησίου
  choice: ничего, что принадлежит ближнему
  rationale: Передан запрет желать принадлежащего ближнему; буквальное «всякого желания ближнего» в русском языке исказило бы смысл.
- source_word: συνεστέναξα
  choice: стонал вместе
  rationale: Сохраняет телесно и эмоционально сильный образ соучастия в чужом страдании.
- source_word: Εὐσέβειαν ἐποίησα
  choice: поступал благочестиво
  rationale: Естественный русский эквивалент идиоматического греческого выражения, обозначающего постоянную благочестивую жизнь.
- source_word: ὑπὲρ τὰ τέκνα μου
  choice: больше, чем собственных детей
  rationale: Сравнительное значение ὑπέρ передано прямо, без смягчения напряжённого утверждения текста.
- source_word: Βελίαρ
  choice: Велиар
  rationale: Сохранена греческая форма имени, засвидетельствованная в данном тексте.
- source_word: ἐκοιμήθη ... ὕπνον αἰώνιον
  choice: уснул вечным сном
  rationale: Сохранена эвфемистическая метафора смерти и повтор сна в греческом тексте, но по-русски выражена без неестественного удвоения глагола.
theological_decisions:
- issue: Степень утверждения Иссахара о собственной безгрешности
  choice: «не знаю за собой греха, ведущего к смерти»
  alternative: «во мне нет греха к смерти» или «я не совершил смертного греха»
  rationale: Формулировка сохраняет характер личного нравственного свидетельства и ограничение εἰς θάνατον, не превращая слова в утверждение абсолютной безгрешности и не вводя позднюю догматическую категорию.
- issue: К кому относится причастие συμπορευόμενον в стихе 7
  choice: Оно относится к Богу неба и земли, который сопутствует людям с простым сердцем
  alternative: Оно описывает сыновей, идущих с Богом в простоте сердца
  rationale: Ближайший грамматический референт — «Бог неба и земли»; вместе с тем примечание отмечает возможное различие в смысловом членении заключительной фразы.
- issue: Любовь к Господу и людям в стихе 6
  choice: Оба дополнения связаны с единым выражением «всем сердцем»
  alternative: «Господа — всей силой, а людей — всем сердцем»
  rationale: В представленном греческом тексте отсутствует отдельное выражение «всей силой»; ἐξ ὅλης τῆς καρδίας естественно относится к составному высказыванию о любви к Господу и каждому человеку.
- issue: Окончание повествования в стихе 9
  choice: Переводить краткий представленный греческий текст без вставки о телесной крепости
  alternative: Добавить «целый всеми членами и сильный» по расширенным текстовым формам
  rationale: Основной перевод следует предоставленному греческому чтению; расширения вынесены в текстологическое примечание.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным завещательным звучанием. Сохранены конкретные образы сердца, уст, хлеба, блуждающих глаз и сна; устранены отсутствующие в представленном греческом тексте английские добавления «всей силой», «в пещере» и «крепкий, целый всеми членами».
