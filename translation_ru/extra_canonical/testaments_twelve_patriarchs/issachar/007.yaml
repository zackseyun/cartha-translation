    issue: 'Стих 7: добавлены причинная связь и временная конкретизация.'
    rationale: Греческое ἔχοντες («имея с собой») не содержит союза «потому что», а настоящее причастие συμπορευόμενον не требует будущего «будет». Эти добавления сужают синтаксическую связь обещания.
  - severity: medium
    issue: 'Стих 7: «не одолеет» недостаточно точно передаёт κυριεύσει.'
    rationale: κυριεύω означает господствовать, властвовать, иметь власть над кем-либо; «не будет властвовать над вами» сохраняет образ подчинения.
  - severity: medium
