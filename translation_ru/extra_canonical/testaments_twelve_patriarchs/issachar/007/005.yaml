source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 5. ⌈Παντὶ ἀνθρώπῳ ὀδυνομένῳ συνεστέναξα καὶ πτωχῷ μετέδωκα ἄρτον¹² μου⁷. Εὐσέβειαν ἐποίησα¹⁴ ἐν πάσαις ταῖς¹⁵ ἡμέραις μου, *᾿Αλήθειαν ἐφύλαξα¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/005.yaml
  text: I groaned together with every person in pain, and I shared my bread with the poor. I practiced godliness in all my days; I kept truth.
translation:
  language: ru
  text: Я стонал вместе со всяким страдающим и делился своим хлебом с бедняком. Во все мои дни я жил благочестиво и хранил истину.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀδυνομένῳ
  choice: страдающим
  rationale: Причастие обозначает человека, испытывающего боль или мучение; «страдающий» естественно передаёт широкий смысл без ограничения только телесной болью.
- source_word: συνεστέναξα
  choice: стонал вместе
  rationale: Сохраняет образ совместного стона и сострадания, выраженный приставкой συν-.
- source_word: πτωχῷ
  choice: бедняком
  rationale: Передаёт социальную нужду и соответствует контексту разделённого хлеба.
- source_word: μετέδωκα
  choice: делился
  rationale: Глагол означает давать другому долю; русское «делился своим хлебом» звучит естественно и точно.
- source_word: Εὐσέβειαν ἐποίησα
  choice: поступал благочестиво
  rationale: Буквально «совершал благочестие»; глагольная формулировка по-русски естественнее и сохраняет практический характер εὐσέβεια.
- source_word: ᾿Αλήθειαν ἐφύλαξα
  choice: хранил истину
  rationale: Сохраняет буквальный образ соблюдения и оберегания истины, не сводя ἀλήθεια лишь к правдивости.
theological_decisions:
- issue: Значение εὐσέβεια как образа жизни или религиозного почитания
  choice: поступал благочестиво
  alternative: чтил Бога
  rationale: Греческий термин допускает оттенок почитания Бога, однако здесь акцент на постоянном нравственно-религиозном поведении; выбранная формулировка не добавляет отсутствующий в тексте объект.
- issue: Значение ἀλήθεια
  choice: истину
  alternative: верность / правдивость
  rationale: Сохранён широкий и богословски значимый диапазон греческого слова без преждевременного сведения его к одному нравственному качеству.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксис ясен и ритмичен; конкретные образы совместного стона, хлеба, благочестивого поведения и хранения истины сохранены.
