  text: And he stretched out his feet and died in a good old age, having every limb sound, and being strong he slept the eternal sleep.
translation:
  language: ru
  text: И он вытянул ноги и умер в доброй старости; все члены его тела были здоровы, и, оставаясь крепким, он уснул вечным сном.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέτεινε τοὺς πόδας αὐτοῦ
  choice: вытянул ноги
  rationale: Прямо передаёт греческое выражение, описывающее предсмертное движение, без добавления невыраженных обстоятельств.
- source_word: ἐν γήρει καλῷ
  choice: в доброй старости
  rationale: Сохраняет библейскую формулу о благополучной, достойной старости и близко следует греческому тексту.
- source_word: πᾶν μέλος ἔχων ὑγιές
  choice: все члены его тела были здоровы
  rationale: Естественно по-русски передаёт состояние каждого телесного члена; добавление «тела» лишь проясняет значение слова μέλος.
- source_word: ἰσχύων
  choice: оставаясь крепким
  rationale: Причастие обозначает сохранённую силу в момент смерти; «оставаясь» естественно выражает сопутствующее состояние, не превращая его в отдельное событие.
- source_word: ὕπνωσεν ὕπνον αἰώνιον
  choice: уснул вечным сном
  rationale: Сохраняет этимологическую фигуру греческого текста и его эвфемистический образ смерти.
theological_decisions:
- issue: Значение выражения «вечный сон»
  choice: Сохранён буквальный образ «уснул вечным сном» без толкования.
  alternative: Передать просто как «умер» либо уточнить последующее воскресение.
  rationale: Греческий текст использует образ вечного сна; перевод не должен молча разрешать возможное напряжение с представлениями о воскресении или состоянии умерших.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного повествования. Синтаксис слегка сглажен для ясности, при этом последовательность образов и повтор «уснул… сном» сохранены.
