source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 7. *Ταῦτα καὶ ὑμεῖς, τέκνα μου, ποιεῖτε²², καὶ²³ πᾶν πνεῦμα τοῦ Βελίαρ φεύξεται ἀφ᾽ ὑμῶν καὶ πᾶσα πρᾶξις πονηρῶν ἀνθρώπων οὐ κυριεύσει ὑμῶν²⁴ καὶ¹¹ πᾶν ἄγριον θηρίον²⁵ καταδουλώσετε²⁶ ἔχοντες μεθ᾽ ὑμῶν²⁷ τὸν θεὸν τοῦ οὐρανοῦ *καὶ τῆς γῆς²⁸ *συμπορευόμενον τοῖς ἀνθρώποις ἐν ἁπλότητι καρδίας²⁹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/007.yaml
  text: You also, my children, do these things, and every spirit of Beliar will flee from you, and every deed of wicked people will not rule over you; and you will subdue every wild beast, having with you the God of heaven and earth, who goes with people in simplicity of heart.
translation:
  language: ru
  text: И вы, дети мои, поступайте так, и всякий дух Велиара убежит от вас, и ни одно деяние злых людей не будет властвовать над вами; и вы покорите всякого дикого зверя, имея с собой Бога неба и земли, идущего вместе с людьми в простоте сердца.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιεῖτε
  choice: поступайте
  rationale: В данном увещательном контексте естественнее русского буквального «делайте это» и передаёт призыв следовать описанному образу действий.
- source_word: πᾶν πνεῦμα τοῦ Βελίαρ
  choice: всякий дух Велиара
  rationale: Сохраняет универсальность πᾶν и традиционную передачу имени Βελίαρ как «Велиар».
- source_word: πᾶσα πρᾶξις πονηρῶν ἀνθρώπων οὐ κυριεύσει ὑμῶν
  choice: ни одно деяние злых людей не будет властвовать над вами
  rationale: Русская отрицательная конструкция «ни одно… не» естественно передаёт сочетание πᾶσα с отрицанием, не ослабляя всеобщего охвата.
- source_word: καταδουλώσετε
  choice: покорите
  rationale: Передаёт сильное значение подчинения власти, избегая неестественного в данном контексте буквального «поработите» применительно к зверям.
- source_word: συμπορευόμενον
  choice: идущий вместе
  rationale: Сохраняет образ совместного пути и значение сопровождения, выраженное приставкой συν-.
- source_word: ἐν ἁπλότητι καρδίας
  choice: в простоте сердца
  rationale: Формально и естественно сохраняет древний нравственный образ цельности, искренности и отсутствия двоедушия, не сводя его лишь к одному толкованию.
theological_decisions:
- issue: Связь оборота «в простоте сердца»
  choice: Сохранить его после слов «идущий вместе с людьми»
  alternative: Явно отнести простоту сердца только к людям или только к Богу
  rationale: Греческий порядок слов не требует однозначно снимать возможную смысловую широту оборота; перевод не навязывает частное богословское истолкование.
- issue: Обещание победы над злом
  choice: Передать будущим временем без добавочных условий
  alternative: Истолковать как общую вероятность или нравственный совет
  rationale: Формы φεύξεται, κυριεύσει и καταδουλώσετε являются будущими; перевод сохраняет категоричность увещания и обещания.
translation_notes:
  register: Современный литературный русский язык с достойным завещательно-наставительным тоном. Синтаксис слегка приподнят, но понятен обычному читателю; архаизмы и конфессионально маркированная лексика не вводятся.
