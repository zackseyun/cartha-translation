revisions:
- from: Так поступайте и вы, дети мои, и всякий дух Велиара убежит от вас, и ни одно деяние злых людей не будет властвовать над вами. Вы покорите всякого дикого зверя, потому что с вами будет Бог неба и земли, идущий вместе с людьми в простоте сердца.
  to: И вы, дети мои, поступайте так, и всякий дух Велиара убежит от вас, и ни одно деяние злых людей не будет властвовать над вами; и вы покорите всякого дикого зверя, имея с собой Бога неба и земли, идущего вместе с людьми в простоте сердца.
  rationale: Исправлена только передача причастного оборота ἔχοντες μεθ᾽ ὑμῶν, чтобы сохранить его непредикативный характер, настоящее значение и связь с обещанием покорения зверей. Значение остального текста и намеренная неоднозначность заключительного оборота сохранены.
