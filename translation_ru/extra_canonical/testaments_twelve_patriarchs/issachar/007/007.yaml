review_pass:
  verdict: revise
  source_fidelity: 'Нужна правка оборота ἔχοντες μεθ᾽ ὑμῶν: это настоящее причастие со значением «имея с собой / при себе», а не причинное «потому что с вами будет». В черновике также необоснованно введено будущее «будет». Остальные основные соответствия точны: «всякий дух Велиара», отрицательное «ни одно деяние… не будет властвовать», обещание покорения зверей и образ «простоты сердца» переданы приемлемо.'
  naturalness: Текст в целом литературен и понятен. «Поступайте так» естественно передаёт увещательное ποιεῖτε; «покорите всякого дикого зверя» сохраняет высокий наставительный регистр. Конструкция с «имея с собой» несколько формальнее, но естественна для этого регистра и необходима для точности.
  terminology: «Велиар» — уместная традиционная передача Βελίαρ. «Бог неба и земли» и «в простоте сердца» сохранены без конфессионального переосмысления. Оборот «идущего вместе с людьми в простоте сердца» сохраняет синтаксическую и смысловую широту греческого выражения, не закрепляя «простоту сердца» исключительно за Богом либо людьми.
  issues:
  - severity: medium
    issue: «потому что с вами будет Бог» вместо ἔχοντες μεθ᾽ ὑμῶν τὸν θεόν
    rationale: 'ἔχοντες — настоящее причастие, относящееся к адресатам: «имея с собой Бога». Черновой вариант меняет конструкцию на причинное придаточное и вводит отсутствующее в источнике будущее время для пребывания Бога с ними.'
  revised_text: И вы, дети мои, поступайте так, и всякий дух Велиара убежит от вас, и ни одно деяние злых людей не будет властвовать над вами; и вы покорите всякого дикого зверя, имея с собой Бога неба и земли, идущего вместе с людьми в простоте сердца.
