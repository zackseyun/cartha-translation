  text: And stretching out his feet, he fell asleep in a good old age the eternal sleep.
translation:
  language: ru
  text: И, вытянув ноги, он почил в доброй старости вечным сном.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: вытянув ноги
  rationale: Естественно и точно передаёт действие, выраженное аористным причастием и прямым дополнением; притяжательное местоимение по-русски избыточно.
- source_word: ἐκοιμήθη
  choice: почил
  rationale: Сохраняет эвфемистический образ сна как смерти и соответствует достоинству завещательного повествования.
- source_word: ἐν γήρει καλῷ
  choice: в доброй старости
  rationale: Близко воспроизводит греческое выражение, обозначающее благополучную, достойную старость, без добавления отсутствующих в предоставленном греческом тексте сведений о телесной крепости.
- source_word: ὕπνον αἰώνιον
  choice: вечным сном
  rationale: Сохраняет прямой образ «вечного сна»; творительный падеж естественно сочетается с русским глаголом «почил».
theological_decisions:
- issue: Образ смерти как вечного сна
  choice: 'Сохранить буквально: «почил… вечным сном»'
  alternative: «умер» или «уснул навеки»
  rationale: Греческий текст намеренно использует лексику сна; перевод не должен устранять возможное богословское напряжение или превращать образ в догматическое пояснение.
translation_notes:
  register: Современный литературный русский с торжественным, но понятным библейским оттенком. Добавления из более пространной текстовой формы, отражённой в истории английских редакций, не включены, поскольку их нет в предоставленном греческом источнике.
