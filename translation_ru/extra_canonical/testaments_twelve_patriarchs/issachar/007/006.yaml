  text: I loved the Lord and every person with all my heart, more than my children.
translation:
  language: ru
  text: Я любил Господа и каждого человека всем сердцем своим — больше, чем собственных детей.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸν Κύριον ἠγάπησα
  choice: Я любил Господа
  rationale: Прямо передаёт объект и глагол в аористе; прошедшее время естественно в контексте итогового свидетельства говорящего.
- source_word: πάντα ἄνθρωπον
  choice: каждого человека
  rationale: Распределительное значение сочетания точнее и естественнее передаётся как «каждого человека», а не как «всех людей».
- source_word: ἐξ ὅλης τῆς καρδίας μου
  choice: всем сердцем своим
  rationale: Сохраняет библейскую образность полноты любви и возвышенный, но понятный русский регистр.
- source_word: ὑπὲρ τὰ τέκνα μου
  choice: больше, чем собственных детей
  rationale: ὑπέρ с винительным выражает сравнение «больше/выше, чем»; «собственных» ясно восстанавливает притяжательное μου и делает русскую фразу однозначной.
theological_decisions:
- issue: Сравнительная сила ὑπὲρ τὰ τέκνα μου
  choice: больше, чем собственных детей
  alternative: превыше детей моих
  rationale: Выбрано прямое сравнительное прочтение, поддержанное греческой конструкцией и английским консультационным текстом; оно сохраняет напряжённое утверждение автора, не смягчая его богословски.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Тире подчёркивает итоговое сравнение и устраняет риск ошибочно связать его только с ближайшими словами.
