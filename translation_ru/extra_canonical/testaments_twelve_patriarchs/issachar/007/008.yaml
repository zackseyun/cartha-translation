  text: And after saying these things, he commanded his sons to carry him up to Hebron, and there to bury him with his fathers.
translation:
  language: ru
  text: Сказав это, он велел своим сыновьям отнести его в Хеврон и там похоронить вместе с его отцами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναγάγωσιν
  choice: отнести
  rationale: В контексте предстоящего погребения означает доставить тело в Хеврон; русское «отнести» естественно передаёт движение к месту назначения, не перегружая фразу буквальным «поднять».
- source_word: ἐν Χεβρών
  choice: в Хеврон
  rationale: 'Несмотря на греческое ἐν, глагол движения и смысл контекста требуют по-русски направления: «в Хеврон».'
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: вместе с его отцами
  rationale: Сохранён буквальный библейский образ погребения рядом с предками, без пояснительного расширения.
