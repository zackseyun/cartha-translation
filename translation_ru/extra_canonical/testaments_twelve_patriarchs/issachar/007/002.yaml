  source_fidelity: 'Первое предложение точно передаёт τῆς συμβίου μου ... οὐκ ἔγνων ἄλλην, сохраняя эвфемизм «познал» и не добавляя слова «женщину». Во втором предложении «глядя по сторонам» слишком конкретизирует и ослабляет образ μετεωρισμῷ ὀφθαλμῶν μου: речь идёт о неустойчивом, блуждающем или устремлённом взгляде, а не просто об осматривании вокруг. «Разврат» несколько шире, чем πορνεύω.'
