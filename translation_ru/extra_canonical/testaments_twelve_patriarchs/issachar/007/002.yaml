  text: Except for my wife, I have not known another. I did not commit sexual immorality with wandering eyes.
translation:
  language: ru
  text: Кроме своей жены, я не познал другой. Я не совершал блуда с блуждающим взглядом.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῆς συμβίου μου
  choice: своей жены
  rationale: Существительное σύμβιος буквально обозначает спутницу совместной жизни; в данном контексте естественное и точное русское соответствие — «жена».
- source_word: οὐκ ἔγνων ἄλλην
  choice: я не познал другой
  rationale: Сохранены эвфемистическое «познал» и субстантивированное «другой» без добавления отсутствующего в греческом слова «женщины».
- source_word: οὐκ ἐπόρνευσα
  choice: я не предавался разврату
  rationale: Глагол πορνεύω обозначает сексуально безнравственное поведение; «предавался разврату» передаёт его значение в достойном современном регистре.
- source_word: ἐν μετεωρισμῷ ὀφθαλμῶν μου
  choice: глядя по сторонам
  rationale: Оборот описывает блуждание или беспокойное устремление глаз. Идиоматическое выражение передаёт направленный вовне, ищущий взгляд, не утверждая более конкретного действия, чем позволяет греческий текст.
theological_decisions:
- issue: Связь разврата с направлением взгляда
  choice: «не предавался разврату, глядя по сторонам»
  alternative: «не совершал блуда блуждающими глазами»
  rationale: Выбран естественный русский оборот, сохраняющий нравственную связь между сексуальной распущенностью и ищущим взглядом, но не превращающий образное выражение в отдельную разработанную доктрину.
translation_notes:
  register: Современный литературный русский язык с достойным завещательным тоном. Библейский эвфемизм «познал» сохранён; тяжеловесная калька «в блуждании моих глаз» заменена естественным русским выражением.
