  source_fidelity: 'Перевод полно передаёт основные элементы греческого текста: выводное οὖν («итак»), указательное ἰδού («вот»), обращение ὡς ὁρᾶτε («как вы видите»), возраст, а также намеренно неоднозначную конструкцию οὐκ ἔγνων ἐν ἐμοὶ ἁμαρτίαν εἰς θάνατον. «Не познал в себе» удачно не сужает ἔγνων до одного лишь сознательного совершения греха.'
  naturalness: Фраза выдержана в современном литературном русском с уместно возвышенным, завещательным оттенком. Начальное «Итак, вот, как вы видите» несколько формально, но приемлемо как передача риторически накопленного греческого начала; дальнейшая фраза ясна и естественна для данного регистра.
  terminology: «Грех, ведущий к смерти» точно и нейтрально передаёт ἁμαρτίαν εἰς θάνατον, не навязывая позднейшую терминологию «смертный грех». Сноска корректно фиксирует допустимую более буквальную альтернативу и объясняет, почему терминологически нагруженный вариант не выбран.
