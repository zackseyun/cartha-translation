id: T12P.ISS.7.1
reference: Testament of Issachar 7:1
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: VII. *Ἰδοὺ οὖν ὡς ὁρᾶτε, ἑκατὸν εἴκοσι καὶ ἓξ ἐτῶν ὑπάρχω¹, καὶ οὐκ *ἔγνων †ἐν ἐμοὶ ἁμαρτίαν Γεἰς θάνατον⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/001.yaml
  text: 'See then, as you see: I am one hundred and twenty-six years old, and I have not known any sin in me leading to death.'
translation:
  language: ru
  text: 'Итак, вот, как вы видите: мне сто двадцать шесть лет, и я не познал в себе греха, ведущего к смерти.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «греха к смерти». Греческое выражение может обозначать грех, направляющий или приводящий к смерти; перевод «смертного греха» был бы более истолковывающим.'
    reason: Сохранить неоднозначность εἰς θάνατον и не импортировать позднейшую конфессиональную терминологию.
lexical_decisions:
- source_word: Ἰδοὺ οὖν
  choice: Итак, вот
  rationale: Сохраняет и выводное οὖν, и привлекающее внимание ἰδού, не сливая их в один элемент.
- source_word: ὡς ὁρᾶτε
  choice: как вы видите
  rationale: Прямо передаёт зрительный глагол ὁράω и естественно звучит в обращении к присутствующим.
- source_word: ἑκατὸν εἴκοσι καὶ ἓξ ἐτῶν ὑπάρχω
  choice: мне сто двадцать шесть лет
  rationale: Естественная русская передача греческого выражения возраста без потери содержания.
- source_word: οὐκ ἔγνων ἐν ἐμοὶ ἁμαρτίαν
  choice: я не познал в себе греха
  rationale: Сохраняет необычную, но значимую конструкцию с ἔγνων и ἐν ἐμοί, не подменяя её более узким толкованием «не сознаю, что совершил».
- source_word: εἰς θάνατον
  choice: ведущего к смерти
  rationale: Передаёт направленность εἰς и сохраняет возможность понимать выражение как характеристику греха по его исходу.
theological_decisions:
- issue: Связь выражения εἰς θάνατον с ἁμαρτίαν
  choice: греха, ведущего к смерти
  alternative: греха к смерти / смертного греха
  rationale: Формулировка сохраняет направленность и богословскую напряжённость греческого выражения, не вводя позднейшую категорию «смертного греха» как готовый термин.
- issue: Смысл οὐκ ἔγνων ἐν ἐμοὶ
  choice: не познал в себе
  alternative: не сознавал за собой / не совершил
  rationale: Более буквальная передача не решает без достаточных оснований, означает ли фраза отсутствие внутреннего осознания, обнаружения в себе или совершения такого греха.
translation_notes:
  register: Современный литературный русский с умеренно торжественным завещательным тоном. Оборот «не познал в себе» намеренно сохраняет формальную и смысловую необычность греческого текста; пунктуация делает длинную реплику ясной для обычного читателя.
