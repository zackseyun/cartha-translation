  naturalness: Фраза звучит естественно в современном литературном русском, сохраняя сдержанный нравственный регистр исповедального высказывания. «Ради обмана» несколько компактнее, чем развёрнутые варианты с «вводить в заблуждение», и уместно сохраняет целевую окраску εἰς.
