  text: 3. Οἶνον⁶ εἰς ἀποπλάνησιν οὐκ ἔπιον· ⌈πᾶν ἐπιθύμημα τοῦ πλησίου οὐκ ἐπεθύμησα⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/003.yaml
  text: I did not drink wine for deception, and I did not desire anything that belonged to my neighbor.
translation:
  language: ru
  text: Я не пил вина ради обмана и не желал ничего из того, что принадлежало моему ближнему.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἀποπλάνησιν
  choice: ради обмана
  rationale: Предлог εἰς с отглагольным существительным здесь естественно передаёт цель или направленность действия. «Ради обмана» сохраняет смысл намеренного введения в заблуждение, не уточняя, кого именно обманывают.
- source_word: πᾶν ἐπιθύμημα τοῦ πλησίου
  choice: ничего из того, что принадлежало моему ближнему
  rationale: В отрицательной конструкции πᾶν естественно передаётся русским «ничего». Родительный τοῦ πλησίου допускает связь с желаемым предметом как принадлежащим ближнему; такая формулировка ясна и соответствует контексту запрета желать чужого.
- source_word: ἐπεθύμησα
  choice: не желал
  rationale: Глагол обозначает сильное желание или вожделение. Нейтральное «желал» сохраняет широту значения и не вводит исключительно сексуальной окраски, возможной у слова «вожделел» в современном русском.
theological_decisions:
- issue: Характер желания имущества ближнего
  choice: не желал ничего из того, что принадлежало моему ближнему
  alternative: не возжелал никакого желания ближнего
  rationale: Хотя поверхностно родительный может показаться неоднозначным, сочетание πᾶν ἐπιθύμημα τοῦ πλησίου в данном нравственном контексте лучше понимать как желание того, что относится к ближнему или принадлежит ему. Перевод сохраняет отсылку к этике недопустимости посягательства на чужое без добавления конкретного перечня имущества.
translation_notes:
  register: Современный литературный русский язык; речь от первого лица сохранена. Формулировка выдержана в dignified, но понятном регистре, без архаизмов. Footnote-маркеры отсутствуют, поскольку пояснительные сноски для данного стиха не требуются.
