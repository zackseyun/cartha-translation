source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 3. *Καὶ οὐκ εἰμὶ¹⁵ περίεργος *ἐν ταῖς πράξεσίν μου¹⁶, Γοὐδὲ φθονερὸς¹⁷ καὶ¹⁸ βάσκανος *τῷ πλησίον μου¹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/003.yaml
  text: And I am not meddlesome in my actions, nor envious and malicious toward my neighbor.
translation:
  language: ru
  text: И в своих делах я не вмешиваюсь в чужое и не питаю к ближнему ни зависти, ни злобы.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίεργος ἐν ταῖς πράξεσίν μου
  choice: в своих делах я не вмешиваюсь в чужое
  rationale: Передаёт περίεργος как склонность неуместно заниматься чужими делами; естественнее по-русски, чем буквальное «не назойлив в своих поступках».
- source_word: φθονερὸς
  choice: не питаю… зависти
  rationale: Сохраняет обычное значение «завистливый» и естественно сочетается с направленностью на ближнего.
- source_word: βάσκανος
  choice: не питаю… злобы
  rationale: В данном нравственном перечне слово обозначает злобную, недоброжелательную настроенность; «злоба» не смешивает его с предшествующей завистью.
- source_word: τῷ πλησίον μου
  choice: к ближнему
  rationale: Сохраняет традиционное и понятное обозначение другого человека, находящегося рядом, а также дательную направленность отношения.
theological_decisions:
- issue: Связь τῷ πλησίον μου с двумя прилагательными φθονερὸς и βάσκανος
  choice: Отнести выражение «к ближнему» к обоим качествам
  alternative: Связать его только с βάσκανος
  rationale: Положение общей зависимой группы после соединённых καὶ прилагательных естественно допускает её отношение к обоим; русский порядок слов ясно передаёт это без догматического расширения.
translation_notes:
  register: Современный литературный русский язык; фраза звучит достойно и понятно, при этом сохраняет настоящее время греческого εἰμί и различает зависть и злобу.
