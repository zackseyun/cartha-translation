source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 7. Καὶ ὁ⁴⁵ Κύριος ἐμυριοπλασίασε⁴⁶ τὰ ἀγαθὰ ⌜ἐν ταῖς χερσί⁴⁷ μου· ᾔδει δὲ καὶ Ἰακὼβ *ὁ πατήρ μου⁴⁸, ὅτι ὁ Θεὸς συνεργεῖ⁴⁸ τῇ ἁπλότητί μου⌝. *Πάντα γὰρ πένησι καὶ θλιβομένοις⁴⁹ παρεῖχον *ἐκ τῶν ἀγαθῶν τῆς γῆς⁵⁰ ἐν ἁπλότητι καρδίας μου⁵¹˥.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/007.yaml
  text: And the Lord multiplied the good things ten thousandfold in my hands; and Jacob my father also knew that God was working together with my simplicity. For I provided to all the poor and afflicted from the good things of the earth, in the simplicity of my heart.
translation:
  language: ru
  text: И Господь умножил блага в моих руках в десять тысяч раз; и Иаков, отец мой, знал, что Бог содействует моей простоте. Ведь всем бедным и угнетённым я давал от благ земли в простоте сердца моего.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμυριοπλασίασε
  choice: умножил… в десять тысяч раз
  rationale: Передаёт усиленное числовое значение глагола буквально и сохраняет возвышенную гиперболу источника.
- source_word: τὰ ἀγαθὰ
  choice: блага
  rationale: Охватывает материальные дары и достаток, не сужая значение до конкретных продуктов или имущества.
- source_word: συνεργεῖ τῇ ἁπλότητί μου
  choice: содействует моей простоте
  rationale: 'Сохраняет конструкцию и её смысловую напряжённость: Бог действует совместно с прямотой и бескорыстием Иссахара, без добавления причинного или конфессионального толкования.'
- source_word: πένησι καὶ θλιβομένοις
  choice: бедным и угнетённым
  rationale: πένητες обозначает нуждающихся, а θλιβόμενοι — людей, испытывающих притеснение или тяготы.
- source_word: ἐν ἁπλότητι καρδίας μου
  choice: в простоте сердца моего
  rationale: Сохраняет библейский образ искренней, цельной и бескорыстной внутренней установки.
theological_decisions:
- issue: Связь Божьего действия с человеческой простотой
  choice: «Бог содействует моей простоте»
  alternative: «Бог благоприятствует моей искренности»
  rationale: Выбранный вариант ближе к συνεργεῖ и сохраняет возможность понимать выражение как совместное действие, не превращая его лишь в одобрение или награду.
- issue: Характер «простоты»
  choice: Сохранить слово «простота»
  alternative: «искренность», «бескорыстие», «чистосердечие»
  rationale: ἁπλότης включает прямоту, цельность и щедрое бескорыстие; одно более узкое русское слово сняло бы часть смысловой многозначности.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Инверсия «отец мой» и «сердца моего» поддерживает достоинство завещательного жанра, оставаясь понятной. Рукописно-критические знаки и поздняя английская ревизия не приняты против приведённого греческого текста.
