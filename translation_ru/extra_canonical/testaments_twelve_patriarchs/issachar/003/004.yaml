lexical_decisions:
- source_word: κατελάλησά τινος
  choice: ни о ком не говорил злого
  rationale: Передаёт значение «говорить против кого-либо, злословить», не сужая его до юридически или фактически ложной клеветы.
- source_word: ἔψεξα
  choice: осуждал
  rationale: Глагол означает порицать, хулить или выражать неодобрение; «осуждал» естественно звучит по-русски и сохраняет нравственную направленность высказывания.
- source_word: βίον ἀνθρώπου
  choice: образ жизни другого человека
  rationale: βίος здесь обозначает жизнь в смысле поведения или уклада; «другого» естественно выражает неопределённого человека в соотнесении с говорящим, не привнося гендерной маркированности.
