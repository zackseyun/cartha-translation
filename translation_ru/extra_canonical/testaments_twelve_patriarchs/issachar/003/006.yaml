base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/006.yaml
  text: And my father always rejoiced in my simplicity, because I offered every firstborn through the priest to the Lord, and then also to my father.
translation:
  language: ru
  text: И отец мой всегда радовался моей простоте, потому что всякого первенца я приносил Господу через священника, а затем — и отцу моему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В греческом тексте после слов «а затем — и отцу моему» глагол опущен; подразумеваемое действие прямо не уточняется.
    reason: Передаёт и поясняет эллипсис оригинала, не добавляя конкретного действия или предмета передачи.
lexical_decisions:
- source_word: ἁπλότητί
  choice: простоте
  rationale: Сохраняет основное значение искренности, прямодушия и отсутствия корысти, не сводя слово к наивности.
- source_word: πᾶν πρῶτον γέννημα
  choice: всякого первенца
  rationale: Естественная русская передача выражения о первом приплоде; форма не уточняет вид животных сверх источника.
- source_word: διὰ τοῦ ἱερέως
  choice: через священника
  rationale: Формально и ясно передаёт посредническую функцию священника.
- source_word: προσέφερον
  choice: приносил
  rationale: Передаёт культовое принесение Господу; в русском контексте подразумевается приношение, но без добавления отсутствующего существительного.
- source_word: ἔπειτα καὶ τῷ πατρί μου
  choice: а затем давал долю и отцу моему
  rationale: Дополнение «давал долю» делает по-русски понятным эллиптическое продолжение, поскольку буквальное повторение «приносил отцу» могло бы ошибочно звучать как жертвоприношение отцу.
theological_decisions:
- issue: Соотношение приношения Господу и последующего дара отцу
  choice: Различить культовое принесение Господу и последующую передачу доли отцу
  alternative: «приносил Господу через священника, а затем и отцу моему»
  rationale: Греческий текст эллиптичен, однако буквальная русская конструкция может создать ложное впечатление, будто отец также является адресатом культовой жертвы. Слово «долю» отмечено сноской как смысловое восполнение.
translation_notes:
  register: Современный литературный русский язык с умеренно библейской торжественностью. Порядок фразы выровнен для естественного чтения; «отцу моему» сохраняет достоинство древнего повествовательного регистра.
