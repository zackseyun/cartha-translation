  text: At thirty-five years of age I took a wife for myself, for my labor consumed my strength, and I did not think about a woman's pleasure; rather, because of my toil, sleep came over me.
translation:
  language: ru
  text: В тридцать пять лет я взял себе жену, ибо труд истощал мои силы, и я не помышлял о наслаждении с женщиной; но от труда меня одолевал сон.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κάματος κατήσθιε τὴν ἰσχύν μου
  choice: труд изнурял меня
  rationale: 'Буквально: «труд пожирал мою силу». Русское «изнурял меня» естественно передаёт продолжающееся истощение сил, не перегружая текст чуждым образным оборотом.'
- source_word: οὐκ ἐνενόουν ἡδονὴν γυναικός
  choice: я не помышлял о наслаждении с женщиной
  rationale: ἐννοέω здесь означает «думать, помышлять», а ἡδονὴ γυναικός допускает понимание женского или связанного с женщиной наслаждения. Формулировка сохраняет сексуальный смысл и не уточняет сверх греческого текста, кому именно принадлежит наслаждение.
- source_word: διὰ τοῦ κόπου
  choice: от тяжёлой работы
  rationale: κόπος обозначает изнурительный труд, тяготу или усталость от труда; «тяжёлая работа» ясно передаёт причинную связь.
- source_word: ὁ ὕπνος μοι περιεγένετο
  choice: меня одолевал сон
  rationale: περιγίνομαι буквально связано с преобладанием или одерживанием верха. Идиоматическое «одолевал сон» сохраняет этот оттенок и естественно звучит по-русски.
