revisions:
- from: В тридцать пять лет я взял себе жену, потому что труд изнурял меня, и я не помышлял о наслаждении с женщиной; напротив, от тяжёлой работы меня одолевал сон.
  to: В тридцать пять лет я взял себе жену, ибо труд истощал мои силы, и я не помышлял о наслаждении с женщиной; но от труда меня одолевал сон.
  rationale: The revision restores the explicit reference to the speaker’s strength and uses a straightforward Russian adversative for ἀλλά. The disputed compact genitive in «ἡδονὴ γυναικός» remains expressed without doctrinal or interpretive expansion.
