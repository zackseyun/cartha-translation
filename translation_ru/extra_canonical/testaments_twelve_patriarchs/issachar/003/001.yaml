  text: When therefore I grew up, my children, I walked in uprightness of heart, and I became a farmer for my father and for my brothers, and I brought in fruits from the fields in their season.
translation:
  language: ru
  text: Итак, когда я достиг зрелости, дети мои, я жил в прямоте сердца, трудился земледельцем для отца моего и братьев моих и приносил с полей урожай в положенное ему время.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В ряде рукописных свидетельств слова «в положенное ему время» отсутствуют или текстуально неустойчивы.
    reason: Угловые скобки в критическом тексте отмечают сомнительно засвидетельствованную фразу; она сохранена в основном тексте с текстологической оговоркой.
lexical_decisions:
- source_word: ἡδρύνθην
  choice: я вырос
  rationale: В данном повествовательном контексте глагол обозначает достижение зрелости; естественное современное соответствие — «вырос».
- source_word: ἐπορεύθην ἐν εὐθύτητι καρδίας
  choice: я ходил в прямоте сердца
  rationale: Сохранён библейский образ нравственного пути и буквальная метафора внутренней прямоты без пояснительного истолкования.
- source_word: γεωργός
  choice: земледельцем
  rationale: Передаёт занятие обработкой земли точнее и литературнее, чем более широкое «фермером».
- source_word: ἔφερον καρπούς
  choice: приносил плоды
  rationale: Сохранена формулировка источника; по контексту речь об урожае, доставляемом с полей.
- source_word: κατὰ καιρὸν αὐτῶν
  choice: в своё время
  rationale: Передаёт соответствие плодов их надлежащему сроку или сезону, сохраняя естественную русскую идиому.
