base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/004.yaml
  text: He does not envy in his deliberations[a], nor does malicious envy consume his soul, nor is there distraction in greed in his mind. But he walks in simplicity of soul; he sees everything with uprightness of heart, not accepting evil eyes from the world’s error[b], so that he may not see the commandments of the Lord as distorted.
translation:
  language: ru
  text: Он не завидует в своих помыслах; и завистник не изнуряет его душу[a], и в уме его нет рассеянности от алчности. Но он живёт в простоте души и на всё смотрит с прямотой сердца, не принимая злых взглядов[b] от заблуждения мира, чтобы не видеть заповеди Господа искажёнными.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «и завистник не изнуряет его душу» заключены в печатном греческом тексте в скобки и, вероятно, представляют собой текстовое расширение; здесь они переведены как часть данного греческого свидетельства.
    reason: textual_variant
  - marker: b
    text: 'Буквально: «не принимая злых глаз». Выражение может вызывать ассоциацию с «дурным глазом», то есть с враждебным или завистливым взглядом.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῖ ἐν διαβουλίοις
  choice: завидует в своих помыслах
  rationale: В контексте перечисления пороков ζηλοῖ означает зависть, а διαβουλίοις указывает на внутренние размышления или намерения. «Помыслы» естественно передают эту внутреннюю сферу.
- source_word: βάσκανος ἐκτήκει τὴν ψυχὴν αὐτοῦ
  choice: злобная зависть не изнуряет его душу
  rationale: βάσκανος выражает злонамеренную, недоброжелательную зависть, а ἐκτήκει — постепенное истощение или изнурение. Формулировка сохраняет образ внутреннего разрушения.
- source_word: περισπασμὸς ἐν ἀπληστείᾳ ἐν νοΐ
  choice: в уме его нет рассеянности от алчности
  rationale: περισπασμός обозначает отвлечение и внутреннюю раздвоенность, а ἀπληστία — ненасытность или алчность. Конструкция сохраняет существительные исходника и остаётся понятной по-русски.
- source_word: ἁπλότητι ψυχῆς
  choice: в простоте души
  rationale: Буквальное и тематически значимое выражение передаёт цельность, искренность и отсутствие лукавства, не сводя смысл к одной из этих граней.
- source_word: εὐθύτητι καρδίας
  choice: с прямотой сердца
  rationale: εὐθύτης буквально связана с прямизной и в нравственном контексте означает внутреннюю правоту. «Прямота сердца» сохраняет образ исходника и звучит достойно и понятно.
- source_word: μὴ ἐπιδεχόμενος ὀφθαλμοὺς πονηροὺς
  choice: не перенимая дурного взгляда
  rationale: ἐπιδέχομαι допускает смысл принятия или допущения, а образ «злых глаз» указывает на нравственно испорченный либо завистливый взгляд. «Не перенимая» естественно выражает отказ усвоить такой взгляд; примечание сохраняет буквальный образ и его идиоматическую возможность.
- source_word: πλάνης τοῦ κόσμου
  choice: от заблуждения мира
  rationale: πλάνη может означать заблуждение, обман или блуждание. «Заблуждение мира» сохраняет смысловую широту и не решает преждевременно, идёт ли речь прежде всего об ошибке или об обольщении.
- source_word: διεστραμμένας τὰς ἐντολὰς τοῦ Κυρίου
  choice: видеть заповеди Господа искажёнными
  rationale: Причастие διεστραμμένας характеризует заповеди так, как их начинает воспринимать человек с испорченным взглядом. Предикативное «искажёнными» сохраняет эту связь с восприятием, не утверждая, будто искажены сами заповеди.
theological_decisions:
- issue: Неявно выраженное подлежащее в нравоучительном описании
  choice: 'Мужской род единственного числа: «он»'
  alternative: Безличное «человек» либо прямое обращение «ты»
  rationale: Греческий текст даёт обобщённое описание в третьем лице. «Он» сохраняет характер портрета праведного, цельного человека и не превращает описание в прямое повеление.
- issue: Отношение искажения к заповедям Господа
  choice: Искажение относится к тому, как человек видит заповеди
  alternative: Утверждение, что заповеди объективно искажены
  rationale: Конструкция с ἴδῃ и предикативным διεστραμμένας описывает искажённое восприятие. Перевод сохраняет неприкосновенность заповедей и причинную связь с «дурным взглядом», не добавляя конфессионального толкования.
