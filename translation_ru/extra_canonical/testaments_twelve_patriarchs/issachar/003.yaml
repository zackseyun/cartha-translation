  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003.yaml
  text: 'For if Leah my mother had not given up marital union in exchange for the two apples[a], she would still have been destined to bear eight sons. Therefore she bore six, and Rachel bore the two, because through the mandrakes the Lord visited her. For he saw that Leah desired to be with Jacob for the sake of children, and not for the sake of pleasure. For on the next day also she again gave Jacob over. Therefore through the mandrakes the Lord listened to Rachel. For although she longed for these, she did not eat them, but dedicated them in the house of the Lord, after bringing them to the priest.


    When therefore I grew to manhood, my children, I walked in uprightness of heart, and I became a farmer for my father and for my brothers. And my father blessed me, seeing that I walked before him in simplicity. And I was not meddlesome in my actions, nor envious and malicious toward my neighbor. I never slandered anyone, nor did I criticize a man''s way of life. At thirty-five years of age I took a wife for myself, for my labor consumed my strength, and I did not think about a woman''s pleasure; rather, because of my toil, sleep came over me. And my father always rejoiced in my simplicity, because I offered every firstborn through the priest to the Lord, and then also to my father. And the Lord multiplied my good things ten thousandfold[d][c][b], and my father likewise increased the good things for me twofold.'
translation:
  language: ru
  text: '3


    1 Когда же я возмужал, дети мои, то ходил в правоте сердца и стал земледельцем для отца моего и братьев моих, принося с полей плоды в надлежащее для них время. 2 Отец мой благословлял меня, видя, что я хожу перед ним в простоте сердца[a]. 3 В делах своих я не вмешиваюсь в чужое, не завидую ближнему и не питаю к нему недоброжелательства[b]. 4 Я никогда ни на кого не клеветал и не осуждал образ жизни другого человека. 5 В тридцать пять лет я взял себе жену, потому что труд поглощал мои силы. Я не помышлял об удовольствии от женщины: от тяжёлой работы сон одолевал меня. 6 Отец мой всегда радовался моей простоте, потому что каждого первенца[c] я через священника приносил Господу, а затем приносил и отцу моему. 7 И Господь в десять тысяч раз умножил блага в руках моих; и отец мой Иаков знал, что Бог содействует моей простоте.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Простота» здесь означает искренность, цельность и отсутствие лукавства, а не наивность или недостаток разумения.
    reason: lexical_alternative
  - marker: b
    text: Буквально соответствующее греческое слово может означать также «с дурным глазом», то есть завистливо и недоброжелательно настроенный к ближнему.
    reason: lexical_alternative
  - marker: c
    text: Выражение «каждый первенец» может обозначать шире всякий первый приплод или первые плоды.
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθύτητι καρδίας
  choice: в правоте сердца
  rationale: Сохраняет образ внутренней нравственной прямоты и звучит естественно в возвышенном повествовательном регистре.
- source_word: ἁπλότης / ἁπλότητι
  choice: простота / простота сердца
  rationale: Последовательно передаёт ключевую для завещания добродетель — цельность, искренность и отсутствие лукавства; примечание предотвращает понимание в смысле наивности или глупости.
- source_word: περίεργος ἐν ταῖς πράξεσίν μου
  choice: в делах своих я не вмешивался в чужое
  rationale: Передаёт неодобрительный смысл назойливого вмешательства, а не нейтральную любознательность.
- source_word: φθονερὸς καὶ βάσκανος
  choice: не завидовал ... и не был ... недоброжелателен
  rationale: Различает зависть и враждебно-завистливое отношение; более буквальный образ «дурного глаза» вынесен в примечание.
- source_word: οὐ κατελάλησά τινος
  choice: ни на кого не клеветал
  rationale: Глагол означает порочащую речь против другого человека; «клеветал» ясно выражает нравственный смысл.
- source_word: ἔψεξα βίον ἀνθρώπου
  choice: осуждал образ жизни другого человека
  rationale: βίος здесь обозначает жизненный уклад или поведение, а ἔψεξα — порицание.
- source_word: ἡδονὴν γυναικός
  choice: удовольствии от женщины
  rationale: Сохраняет сдержанный и несколько общий характер родительного оборота, не уточняя сверх текста, идёт ли речь исключительно о половом наслаждении.
- source_word: πᾶν πρῶτον γέννημα
  choice: всякого первенца
  rationale: Краткий традиционный эквивалент; возможный более широкий смысл первого приплода или первых плодов отмечен в сноске.
- source_word: ἐμυριοπλασίασε
  choice: во много тысяч раз умножил
  rationale: Передаёт гиперболическое «умножил мириады раз» естественным русским выражением, не сводя его к неопределённому «обильно».
- source_word: ὁ Θεὸς συνεργεῖ τῇ ἁπλότητί μου
  choice: Бог содействует моей простоте
  rationale: 'Сохраняет необычную конструкцию и богословское напряжение: Божье действие сопровождает названную добродетель, без уточнения механизма награды.'
theological_decisions:
- issue: Значение ἁπλότης как центральной добродетели Иссахара
  choice: Последовательно переводить как «простота», один раз уточнив «простота сердца» и снабдив примечанием
  alternative: «Искренность», «цельность», «чистосердечие»
  rationale: Единообразие сохраняет тематическую нить главы, а примечание исключает современную отрицательную ассоциацию с недалёкостью.
- issue: Божье содействие простоте Иссахара в ст. 7
  choice: 'Передать буквально: «Бог содействует моей простоте»'
  alternative: «Бог вознаграждает меня за простоту» или «Бог помогает мне благодаря моей простоте»
  rationale: Исходный текст говорит о συνεργεῖ и не формулирует точной причинно-наградной схемы; буквальная формулировка сохраняет эту открытость.
- issue: Приношение через священника в патриархальном повествовании
  choice: Сохранить прямое упоминание священника в основном тексте
  alternative: Смягчить или устранить культовую деталь ради согласования с повествованием Бытия
  rationale: Греческий источник прямо содержит διὰ τοῦ ἱερέως; историко-литературную напряжённость нельзя устранять молчаливой гармонизацией.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, завещательно-библейским звучанием. Синтаксис сделан ясным для обычного читателя, но сохранены повтор ключевого слова «простота», формула «ходить перед» и напряжённые культовые и богословские детали исходного текста.
