base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003.yaml
  text: 'If you lose truth and patience[a], you will perish.


    2 Anger is blindness, for it does not allow one to see anyone’s face truly. 3 Even if it is a father or a mother, it regards them as enemies. If it is a brother, it does not know him. If it is a prophet of the Lord, it disobeys him; if a righteous man, it does not see him; if a friend, it does not recognize him. 4 For the spirit of anger wraps him in the net of deceit and blinds his eyes, and through falsehood it darkens his mind and gives him his own vision. 5 And with what does it veil his eyes? With hatred of heart against his brother, leading to envy.


    6 For anger is evil, my children, because it throws even the soul itself into turmoil. 7 And it gives strength to the body, so that it may commit every lawless deed. 8 And when the body has done all these things, the soul justifies what has been done, because it does not see rightly. 9 Therefore the one who is angry, if he is physically strong, has his soul’s power for anger threefold: one from the help of attendants, by which he justifies the deed; a second through wealth, persuading and overpowering unjustly[b]; and a third, because he has natural strength, by it he does evil. 10 But if the one who is angry is weak, he has the passion of wrath in him twofold[d][c], for anger always helps him toward wrongdoing.'
translation:
  language: ru
  text: '1 Если вы утратите истину и долготерпение[a], то погибнете.


    2 Ведь гнев — это слепота: он не даёт видеть человека таким, каков он в действительности[b]. 3 Будь то отец или мать — гнев смотрит на них как на врагов; будь то брат — не узнаёт его; будь то пророк Господа — не слушается его; праведника — не видит; друга — не признаёт. 4 Ибо дух гнева опутывает человека сетью заблуждения, ослепляет его глаза, ложью омрачает его разум и даёт ему собственное видение[c]. 5 А чем он застилает ему глаза? Сердечной ненавистью к брату, ведущей к зависти.


    6 Ибо гнев зол, дети мои: он приводит в смятение даже саму душу. 7 Он присваивает себе тело разгневанного, овладевает его душой и даёт телу силу совершить всякое беззаконие. 8 А когда тело всё это совершит, душа оправдывает содеянное, потому что не видит верно.


    9 Поэтому разгневанный, если он силён телом, обладает в своём гневе тройной силой: во-первых, силой, которую даёт помощь прислужников; во-вторых, силой богатства, с помощью которого он убеждает и несправедливо одолевает; в-третьих, природной силой, посредством которой он творит зло. 10 Если же разгневанный слаб, страсть ярости возрастает в нём вдвойне[d], потому что гнев всегда помогает ему творить беззаконие.


    11 Этот дух всегда идёт вместе с ложью по правую руку сатаны, чтобы его дела совершались с жестокостью и ложью[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «терпение», «снисходительность». Греческое μακροθυμία обозначает терпеливую сдержанность и способность долго переносить обиды.'
    reason: lexical_alternative
  - marker: b
    text: 'Буквально: «не даёт видеть лицо кого-либо в истине», то есть воспринимать человека верно.'
    reason: lexical_alternative
  - marker: c
    text: В контексте образов слепоты, заблуждения и лжи это означает, что дух гнева подменяет верное восприятие собственным взглядом.
    reason: ambiguity_explanation
  - marker: d
    text: В этом стихе употреблено ὀργή («ярость»), тогда как основной термин отрывка — θυμός («гнев»). Насколько строго автор различает эти слова, неясно.
    reason: lexical_alternative
  - marker: e
    text: 'Не вполне ясно, чьи именно дела имеются в виду: сатаны, духа гнева или человека, которым овладел гнев.'
    reason: referent_ambiguity
lexical_decisions:
- source_word: μακροθυμία
  choice: долготерпение
  rationale: Передаёт длительное терпеливое самообладание точнее, чем общее «терпение», и остаётся понятным в современном литературном русском.
- source_word: θυμός
  choice: гнев
  rationale: Основной термин отрывка; «гнев» естественно обозначает и состояние, и нравственный порок, не усиливая значение до «ярости».
- source_word: τύφλωσις
  choice: слепота
  rationale: Сохраняет афористическую форму и сквозной образ ослепления.
- source_word: ὁρᾶν πρόσωπόν τινος ἐν ἀληθείᾳ
  choice: видеть человека таким, каков он в действительности
  rationale: Естественно передаёт смысл конкретного греческого образа «видеть лицо в истине»; буквальный образ отмечен в сноске.
- source_word: δίκτυον τῆς πλάνης
  choice: сеть заблуждения
  rationale: Сохраняет образ сети и допускает как обман, так и внутреннее заблуждение; непосредственное ψεῦδος далее передано словом «ложь».
- source_word: τὴν ἰδίαν ὅρασιν παρέχει αὐτῷ
  choice: навязывает ему собственное видение
  rationale: Передаёт персонифицированный гнев как силу, подменяющую реальность своим искажённым взглядом.
- source_word: ἐκταράσσει
  choice: приводит в смятение
  rationale: Передаёт усилительное значение глагола без неестественной тяжеловесности.
- source_word: ὀργή
  choice: ярость
  rationale: Сохраняет лексическое различие с θυμός («гнев») в стихе 10, не превращая его в жёсткое техническое различение.
- source_word: ἐκ δεξιῶν τοῦ Σατανᾶ
  choice: по правую руку сатаны
  rationale: Сохраняет пространственный и союзнический образ греческого выражения.
theological_decisions:
- issue: Персонификация духа гнева
  choice: Сохранить выражение «дух гнева» и его действия без пояснения природы этого духа.
  alternative: Свести выражение к психологической метафоре либо представить его как однозначно отдельное демоническое существо.
  rationale: Текст приписывает духу гнева активность и связывает его с сатаной, но не даёт достаточных оснований для более разработанной демонологии.
- issue: προφήτης Κυρίου
  choice: пророк Господа
  alternative: пророк Бога
  rationale: Передаёт явно употреблённый в греческом титул Κυρίου, не обобщая его.
- issue: Неясный референт αὐτοῦ в заключении
  choice: Сохранить местоимение «его» и отметить двусмысленность сноской.
  alternative: Явно назвать дела сатаны, духа гнева или разгневанного человека.
  rationale: Греческая форма допускает несколько ближайших смысловых отнесений; перевод не должен молча устранять эту неопределённость.
translation_notes:
  register: Современный литературный русский с назидательной, но не архаизированной интонацией. Сохранены образы слепоты, сети, омрачения и тройной силы. Текст переведён по всему предоставленному греческому фрагменту, включая строки III.2 и III.6, отсутствующие или сокращённые в английском консультационном слое; сквозная нумерация продолжает формат этого слоя.
