source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/002.yaml
  text: 'Anger is an evil thing, my children[b], because it troubles even the soul itself. And the body of the angry man it makes its own, and over his soul it gains mastery, and it bestows power on the body, so that it works every lawless deed. And when the body does all these things, the soul justifies what is done, because it does not see rightly. Therefore he who is wrathful, if he is a mighty man, has a threefold power in his anger: one from the help of his servants, and a second from his wealth, by which he persuades and overcomes unjustly, and a third, because he has his own natural power, and by it he works evil. And if the wrathful man is also poor, he has a twofold power of anger; for it always helps him toward wrongdoing.'
translation:
  language: ru
  text: 'И теперь, дети мои, вот, я умираю. Истинно говорю вам: если вы не будете беречь себя от духа лжи и от гнева и не будете любить истину и долготерпение, то погибнете.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: вот
  rationale: Сохраняет указательно-эмфатическую силу греческого слова и естественно звучит в торжественном обращении.
- source_word: φυλάξητε ἑαυτούς
  choice: будете беречь себя
  rationale: Передаёт значение самохранения и бдительности без излишне буквального или архаического оборота.
- source_word: τὸ πνεῦμα τοῦ ψεύδους
  choice: дух лжи
  rationale: Формально сохраняет образ и возможную персонификацию зла, не сводя выражение лишь к склонности лгать.
- source_word: θυμός
  choice: гнев
  rationale: В данном нравственном предостережении обозначает сильный, разрушительный гнев; это естественный и достаточно широкий русский эквивалент.
- source_word: μακροθυμία
  choice: долготерпение
  rationale: Сохраняет нравственное значение стойкого терпения и сдержанности перед лицом раздражения; слово укоренено в литературном русском и соответствует контрасту с гневом.
- source_word: ἀπολεῖσθε
  choice: погибнете
  rationale: Передаёт сильное предупреждение о гибели, не уточняя её как исключительно физическую или духовную.
theological_decisions:
- issue: Статус выражения «дух лжи»
  choice: Сохранено буквальное выражение «дух лжи»
  alternative: «лживый дух» или «склонность ко лжи»
  rationale: Греческий текст допускает понимание как духовной силы, так и господствующей нравственной установки; перевод не должен устранять эту неоднозначность.
- issue: Характер обещанной гибели
  choice: Использовано неуточнённое «погибнете»
  alternative: «будете уничтожены» или «духовно погибнете»
  rationale: Глагол ἀπόλλυμι сам по себе не определяет здесь точный вид гибели, поэтому конкретизация внесла бы отсутствующее в источнике толкование.
- issue: Логическая структура условия
  choice: Обе обязанности — избегать зла и любить добродетель — сохранены в едином условном предупреждении
  alternative: Разделить их на самостоятельные наставления
  rationale: 'Греческое ἐὰν μή охватывает составное условие: хранить себя от духа лжи и гнева и любить истину и долготерпение.'
translation_notes:
  register: Современный литературный русский с достоинством завещательного наставления. Синтаксис слегка разгружен делением после сообщения о смерти, но логическая связь и напряжённость исходного предупреждения сохранены. Архаизмы сведены к минимуму; «долготерпение» оставлено как точный и понятный нравственный термин.
