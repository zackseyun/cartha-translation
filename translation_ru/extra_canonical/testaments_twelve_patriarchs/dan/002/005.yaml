  source_fidelity: 'Русский текст точно передаёт все элементы данного греческого фрагмента: обращение к детям, предсмертное заявление, заверение в истинности слов, условное предостережение, «дух лжи и гнева», любовь к истине и долготерпению и итоговую угрозу гибели. Единственное число «дух» и широкое значение ἀπολεῖσθε сохранены. Английский audit trail в исходной редакции относился к другому тексту, но последняя зафиксированная правка подтверждает именно это греческое содержание; русский перевод с ним согласуется.'
