source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/005.yaml
  text: If you fall into any loss or ruin, my children, do not be distressed; for this very spirit makes a man desire what is perishable, in order that he may be angered through the distress. And if the loss comes willingly or unwillingly, do not be vexed; for from vexation false anger is born. Moreover, a twofold mischief is anger with falsehood; and they help one another to destroy the heart. And when the soul is continually disturbed, the Lord departs from it[c], and Beliar rules over it.
translation:
  language: ru
  text: 'И теперь, дети мои, вот, я умираю и истинно говорю вам: если вы не будете беречь себя от духа лжи и гнева и не полюбите истину и долготерпение, то погибнете.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: вот
  rationale: Сохраняет указательно-эмфатическую силу греческого слова и торжественный тон предсмертного обращения.
- source_word: φυλάξητε ἑαυτούς
  choice: будете беречь себя
  rationale: Естественно по-русски передаёт призыв хранить и оберегать себя от пагубного влияния.
- source_word: τὸ πνεῦμα τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: дух лжи и гнева
  rationale: Формально сохраняет единственное число «дух» и два зависимых определения, не решая, понимается ли здесь дух как личностная сила или как внутреннее расположение.
- source_word: μακροθυμίαν
  choice: долготерпение
  rationale: Передаёт стойкое терпение и сдержанность перед лицом раздражения; слово уместно в религиозно-нравственном контексте и понятно современному читателю.
- source_word: ἀπολεῖσθε
  choice: погибнете
  rationale: Сохраняет сильное и широкое значение гибели, не сужая его до физической смерти или духовного осуждения.
theological_decisions:
- issue: Природа «духа лжи и гнева»
  choice: Сохранить буквальное «дух», без пояснения его онтологического статуса
  alternative: Передать как «склонность ко лжи и гневу» либо как явно личностного злого духа
  rationale: Греческий текст допускает понимание как духовной силы, так и господствующего нравственного расположения; перевод не должен устранять эту неоднозначность.
- issue: Характер грозящей гибели
  choice: Передать общим глаголом «погибнете»
  alternative: «Будете погублены», «духовно погибнете» или «умрёте»
  rationale: Форма ἀπολεῖσθε и контекст не требуют однозначно определять вид гибели; общее выражение сохраняет богословское напряжение.
translation_notes:
  register: 'Современный литературный русский с достоинством завещательного наставления. Синтаксис слегка торжественный, но без архаизмов; союзная конструкция сохраняет условие и две противопоставленные пары: ложь/истина и гнев/долготерпение.'
