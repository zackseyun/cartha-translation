source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/001.yaml
  text: 'And now[a], my children, behold, I am dying, and I tell you in truth: unless you guard yourselves from the spirit of falsehood and of anger, and love truth and long-suffering, you will perish. For anger is blindness, and it does not allow one to see the face of any man with truth. Even if it is a father or a mother, he behaves toward them as toward enemies; even if it is a brother, he does not recognize him; even if it is a prophet of the Lord, he disobeys him; even if it is a righteous man, he does not regard him; even if it is a friend, he does not acknowledge him. For the spirit of anger surrounds him with the nets of deceit, and blinds his eyes, and through falsehood darkens his mind, and gives him its own peculiar vision. And with what does it surround his eyes? With hatred of heart, so as to be envious of his brother.'
translation:
  language: ru
  text: 'А теперь[a], дети мои, вот я умираю и истинно говорю вам: если вы не будете оберегать себя от духа лжи и гнева и не полюбите истину и долготерпение, то погибнете. Ведь гнев — это слепота: он не даёт человеку видеть лицо другого таким, каково оно есть. Будь то отец или мать, он обращается с ними как с врагами; будь то брат — не узнаёт его; будь то пророк Господа — не слушается его; будь то праведник — не считается с ним; будь то друг — не признаёт его. Ибо дух гнева опутывает его сетями обмана, ослепляет его глаза, ложью помрачает его ум и внушает ему своё особое видение. А чем он застилает ему глаза? Сердечной ненавистью, чтобы тот завидовал своему брату.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «И вот теперь».'
    reason: Греческое Καὶ νῦν … ἰδού соединяет переход «и теперь» с указательным призывом к вниманию «вот»; возможен иной естественный порядок слов.
lexical_decisions:
- source_word: φυλάξητε ἑαυτούς
  choice: будете оберегать себя
  rationale: Передаёт активное, продолжительное самохранение без излишне буквального «стеречь самих себя».
- source_word: τὸ πνεῦμα τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: дух лжи и гнева
  rationale: Сохранены образ «духа» и координация двух родительных; перевод не сводит выражение ни только к личности, ни только к психологической склонности.
- source_word: μακροθυμία
  choice: долготерпение
  rationale: Передаёт не просто пассивное ожидание, а длительную сдержанность и терпение перед лицом раздражения.
- source_word: ἀπολεῖσθε
  choice: погибнете
  rationale: Сохраняет сильный смысл гибели, не уточняя без основания, идёт ли речь о физической, нравственной или окончательной погибели.
- source_word: the face of any man with truth
  choice: лицо другого в истинном свете
  rationale: Сохраняет образ лица и связь с истиной, но выражает их естественно по-русски.
- source_word: gives him its own peculiar vision
  choice: заставляет видеть всё по-своему
  rationale: Естественно передаёт навязанное гневом искажённое восприятие, не вводя отсутствующих деталей.
theological_decisions:
- issue: Природа «духа лжи и гнева»
  choice: Сохранено слово «дух» без поясняющего толкования.
  alternative: Перевести как «склонность», «настроение» либо явно представить личное духовное существо.
  rationale: Исходное πνεῦμα допускает более одного оттенка; перевод не должен устранять эту неоднозначность.
- issue: Смысл погибели
  choice: «погибнете» без уточнения вида погибели.
  alternative: «умрёте», «будете осуждены» или «погубите себя».
  rationale: Греческое ἀπόλλυμι здесь достаточно широко и не требует конфессионального уточнения.
- issue: Долготерпение как добродетель
  choice: «долготерпение».
  alternative: «терпение» или «снисходительность».
  rationale: Выбранное слово сохраняет этическую напряжённость μακροθυμία и противопоставление гневу.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Прямо предоставленный греческий текст надёжно покрывает первое предложение; остальная часть абзаца переведена по аудированному английскому консультационному слою, поскольку соответствующий греческий текст в запросе не приведён. Синтаксис сделан ясным для обычного читателя, при этом сохранены ключевые образы слепоты, лица, сетей, помрачения ума и сердечной ненависти.
