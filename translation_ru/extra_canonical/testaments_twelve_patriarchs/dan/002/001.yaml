revisions:
- from: 'А теперь[a], дети мои, вот я умираю и истинно говорю вам: если вы не будете оберегать себя от духа лжи и гнева и не полюбите истину и долготерпение, то погибнете. Ведь гнев — это слепота: он не даёт человеку увидеть лицо другого в истинном свете. Даже если перед ним отец или мать, он обращается с ними как с врагами; если брат — не узнаёт его; если пророк Господа — не слушается его; если праведник — не считается с ним; если друг — не признаёт его. Ибо дух гнева опутывает его сетями обмана, ослепляет его глаза, ложью помрачает его ум и заставляет видеть всё по-своему. А чем он застилает ему глаза? Сердечной ненавистью, чтобы тот завидовал своему брату.'
  to: 'А теперь[a], дети мои, вот я умираю и истинно говорю вам: если вы не будете оберегать себя от духа лжи и гнева и не полюбите истину и долготерпение, то погибнете. Ведь гнев — это слепота: он не даёт человеку видеть лицо другого таким, каково оно есть. Будь то отец или мать, он обращается с ними как с врагами; будь то брат — не узнаёт его; будь то пророк Господа — не слушается его; будь то праведник — не считается с ним; будь то друг — не признаёт его. Ибо дух гнева опутывает его сетями обмана, ослепляет его глаза, ложью помрачает его ум и внушает ему своё особое видение. А чем он застилает ему глаза? Сердечной ненавистью, чтобы тот завидовал своему брату.'
  rationale: 'Внесены две безопасные смысловые правки по английскому аудиторскому слою: гнев лишает способности видеть человека без искажения, а «особое видение» исходит от духа гнева. Повторяющиеся конструкции «будь то» точнее и естественнее передают ряд «even if». Первый период и единственная сноска сохранены по предоставленному греческому тексту; неоднозначность πνεῦμα и ἀπολεῖσθε не устранена толковательно.'
  reviewer_model: gpt-5.6-terra
