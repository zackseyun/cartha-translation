  source_fidelity: 'Черновик в целом соответствует греческому фрагменту: сохранены обращение, заявление о близкой смерти, условное предупреждение, единое «дух» и неопределённая по характеру гибель. Однако «будете хранить себя от» является буквальной, не вполне естественной передачей φυλάξητε ἑαυτούς ἀπό. Кроме того, отрицание в условии следует оформить так, чтобы оно, как и в греческом, распространялось на оба соединённых требования, без добавления отдельного смыслового акцента на «не полюбите».'
