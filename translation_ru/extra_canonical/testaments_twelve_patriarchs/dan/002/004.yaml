base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/004.yaml
  text: Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy men, do not be exalted, either to delight or to disgust. For first it is pleasing to the hearing, and so the mind is stirred to perceive the grounds for provocation; and then, becoming angry, he thinks that he is justly angry.
translation:
  language: ru
  text: 'И вот, дети мои, я умираю и истинно говорю вам: если вы не будете беречь себя от духа лжи и гнева и любить истину и долготерпение, то погибнете.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: вот
  rationale: Сохраняет указательно-эмфатическую силу греческого слова и естественно звучит в торжественном предсмертном обращении.
- source_word: φυλάξητε ἑαυτούς
  choice: будете хранить себя
  rationale: Передаёт значение осознанной бдительности и самосохранения, не сводя выражение лишь к однократному уклонению.
- source_word: τὸ πνεῦμα τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: дух лжи и гнева
  rationale: Сохраняет единственное число πνεῦμα и координацию двух родительных определений, не превращая их без основания в двух отдельных духов.
- source_word: μακροθυμία
  choice: долготерпение
  rationale: Передаёт не просто пассивное терпение, а длительную сдержанность, особенно уместную в противопоставлении гневу.
- source_word: ἀπολεῖσθε
  choice: погибнете
  rationale: Сохраняет сильное предупреждение источника, не уточняя без основания, идёт ли речь о физической, нравственной или окончательной гибели.
theological_decisions:
- issue: Характер выражения «дух лжи и гнева»
  choice: Сохранено как один «дух», характеризуемый ложью и гневом.
  alternative: «духов лжи и гнева» или «духа лжи и духа гнева»
  rationale: В греческом πνεῦμα стоит в единственном числе; перевод не должен вводить отдельные духовные сущности, которых текст прямо не называет.
- issue: Смысл грозящей гибели
  choice: Оставлено обобщённое «погибнете».
  alternative: «будете осуждены», «погубите свои души» или «умрёте»
  rationale: Глагол ἀπόλλυμι допускает широкий диапазон смысла, а контекст данного фрагмента не позволяет догматически сузить его.
translation_notes:
  register: Современный литературный русский с достоинством завещательного наставления. Синтаксис слегка возвышенный, но понятный; устаревшие формы избегаются. Перевод следует предоставленному греческому фрагменту, а не нерелевантному английскому тексту прежней редакции.
