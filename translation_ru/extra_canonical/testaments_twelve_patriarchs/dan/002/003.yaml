base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/003.yaml
  text: This spirit goes always with falsehood at the right hand of Satan, so that with cruelty and falsehood his works may be accomplished. Understand, therefore, the power of anger, that it is empty. For first it gives provocation by word; then by deeds it strengthens the one who is angry, and with sharp losses it disturbs his mind, and so it stirs up his soul with great wrath.
translation:
  language: ru
  text: 'И теперь, дети мои, знайте: я умираю и истинно говорю вам: если вы не оградите себя от духа лжи и гнева и не возлюбите истину и долготерпение, то погибнете.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξητε ἑαυτούς
  choice: будете беречь себя
  rationale: Передаёт значение самосохранения и бдительной защиты без излишне архаичного оттенка.
- source_word: τοῦ πνεύματος τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: от духа лжи и гнева
  rationale: Сохраняет единственное число «дух» и два зависимых родительных понятия, не решая, обозначены ли ими две стороны одного духа.
- source_word: μακροθυμίαν
  choice: долготерпение
  rationale: Передаёт не просто терпение, а длительную выдержку и сдержанность перед лицом причиняемого зла.
- source_word: ἀπολεῖσθε
  choice: погибнете
  rationale: Сохраняет сильное и открытое по характеру значение гибели, не уточняя, является ли она физической, нравственной или эсхатологической.
theological_decisions:
- issue: Характер «духа лжи и гнева»
  choice: Сохранена формулировка «дух лжи и гнева».
  alternative: «духи лжи и гнева» или пояснение как безличного настроя
  rationale: В греческом тексте стоит единственное число πνεύματος; перевод не должен заранее определять личностный или безличный характер этого духа.
- issue: Значение обещанной гибели
  choice: Употреблено непояснённое «погибнете».
  alternative: «будете уничтожены», «погибнете духовно»
  rationale: Греческое ἀπολεῖσθε допускает широкий смысл; конкретизация сняла бы присущую тексту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Слово «долготерпение» сохранено ради точности; синтаксис сделан ясным и естественным. Перевод следует представленному греческому фрагменту, а не не совпадающему с ним английскому консультационному тексту.
