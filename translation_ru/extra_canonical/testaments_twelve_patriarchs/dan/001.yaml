  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001.yaml
  text: 'In the fifth year of his life[a], Dan called together his family and said:


    2. “Hear my words, sons of Dan, and pay attention to the words of your father.

    3. I have tested in my heart, and in all my life, that truth with righteous conduct is good and pleasing to God, and that falsehood and anger are evil, teaching a person every wickedness.

    4. So I confess to you today, my children, that in my heart I resolved concerning the death of Joseph my brother, that good and true man.

    5. And I rejoiced over his being sold, because his father loved him more than us.

    6. For the spirit of jealousy and of arrogance kept saying to me, ‘You yourself also are his son.’

    7. And one of the spirits of Beliar was working with me, saying, ‘Take this sword and kill Joseph, and your father will love you when he is dead.’

    8. Now this was the spirit of anger persuading me, that just as a leopard devours a young goat, so I too should destroy Joseph.

    9. But the God of my fathers did not give him into my hands[b], so that I might find him alone and kill him and commit this lawless deed[c], lest two tribes be destroyed from Israel.”'
translation:
  language: ru
  text: '**Завещание Дана, седьмого сына Иакова и Валлы**


    **1.** Запись слов Дана, которые он сказал своим сыновьям на исходе своих дней, на сто двадцать пятом году жизни.


    **2.** Созвав весь свой род, он сказал: «Слушайте мои слова, сыновья Дана, и внимайте речам вашего отца.


    **3.** Сердцем своим и всей своей жизнью я убедился, что истина вместе с праведными делами добра и угодна Богу, а ложь и гнев злы и приучают человека ко всякому злу.


    **4.** Поэтому сегодня я признаюсь вам, дети мои: в сердце своём я замыслил смерть моего брата Иосифа, человека доброго и верного.


    **5.** Я радовался тому, что его продали, потому что отец любил его больше, чем нас.


    **6.** Ведь дух ревности и высокомерия твердил мне: «Ты и сам его сын».


    **7.** И один из духов Велиара действовал заодно со мной, говоря: «Возьми меч и убей им Иосифа. Когда он умрёт, отец полюбит тебя».


    **8.** Это дух гнева убеждал меня: как леопард пожирает козлёнка, так и мне следует погубить Иосифа[a].


    **9.** Но Бог моих отцов[b] не допустил, чтобы он попал мне в руки, чтобы я, застав его одного, не убил его и не уничтожил второй скипетр Израиля[c]».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческий текст в этом месте повреждён. Сохранившиеся формы могут передавать более натуралистический образ леопарда, высасывающего кровь козлёнка; основной текст передаёт общий смысл сравнения, не выдавая спорную реконструкцию за несомненную.
    reason: textual_variant
  - marker: b
    text: 'В некоторых формах текста: «Бог моего отца Иакова».'
    reason: alternative_reading
  - marker: c
    text: 'Буквально: «и не сделал так, чтобы второй скипетр Израиля был уничтожен». Точный смысл образа «второго скипетра» неясен; вероятно, он связан с продолжением одного из колен Израиля, но текст не позволяет уверенно уточнить это.'
    reason: textual_difficulty
lexical_decisions:
- source_word: πατρία
  choice: весь свой род
  rationale: Слово обозначает родственную общность или отцовский дом; «весь свой род» естественно передаёт собравшуюся семью и сохраняет более широкий смысл, чем только ближайшие домочадцы.
- source_word: προσέχετε
  choice: внимайте
  rationale: Повелительная форма призывает не просто услышать, но сосредоточенно отнестись к отцовским словам. «Внимайте» сохраняет торжественный регистр, оставаясь понятным.
- source_word: ἀλήθεια
  choice: истина
  rationale: В контрасте с ψεῦδος слово имеет и нравственный оттенок правдивости, но «истина» сохраняет широту греческого понятия.
- source_word: δικαιοπραγία
  choice: праведные дела
  rationale: Сложное существительное указывает на практическое совершение праведного, а не только на отвлечённое качество.
- source_word: ψεῦδος
  choice: ложь
  rationale: Абстрактное существительное прямо противопоставлено истине; «ложь» естественна в современном русском и сохраняет нравственный смысл.
- source_word: θυμός
  choice: гнев
  rationale: Это сквозное обозначение порочной страсти в завещании; «гнев» достаточно сильно и не вносит излишнего уточнения вроде «ярости».
- source_word: ζῆλος
  choice: ревность
  rationale: Контекст — болезненное соперничество из-за отцовской любви к Иосифу. «Ревность» сохраняет эту реляционную окраску, не сводя её только к зависти.
- source_word: ἀλαζονεία
  choice: высокомерие
  rationale: Слово обозначает самопревозношение и заносчивость; выбранный эквивалент ясен современному читателю.
- source_word: πνευμάτων τοῦ Βελίαρ
  choice: духов Велиара
  rationale: Сохранено собственное имя в форме греческого свидетеля, без замены на обобщённое «злые духи».
- source_word: ἄνελε
  choice: убей
  rationale: Повеление прямое и резкое; «убей» точно передаёт его смертоносный смысл без архаизации.
- source_word: σκῆπτρον δεύτερον
  choice: второй скипетр
  rationale: Буквальный образ греческого текста сохранён, поскольку его точный референт неясен и не должен молча заменяться толкованием о двух коленах.
theological_decisions:
- issue: Велиар как именованная сила личного зла
  choice: «один из духов Велиара» с сохранением собственного имени
  alternative: «один из злых духов» или «один из духов Велиала»
  rationale: Греческий текст прямо называет Велиара и говорит о принадлежащих ему духах. Перевод сохраняет демонологическую картину текста, не превращая её в безличный психологический импульс.
- issue: Божье удержание Дана от убийства Иосифа
  choice: «Бог моих отцов не допустил, чтобы он попал мне в руки»
  alternative: «Бог не отдал его в мои руки»
  rationale: 'Так передано οὐκ εἴασεν αὐτὸν ἐμπεσεῖν εἰς τὰς χεῖράς μου: Бог удерживает развитие событий, при этом вина за убийственный замысел остаётся на Дане.'
- issue: Образ «второго скипетра» Израиля
  choice: сохранить образ без догматического или племенного уточнения
  alternative: «погубить два колена Израиля» или «совершить беззаконие»
  rationale: Представленный греческий источник говорит о том, чтобы «уничтожить второй скипетр Израиля». Хотя смысл образа труден, замена его более определённым толкованием устранила бы подлинную неоднозначность.
translation_notes:
  register: Современный литературный русский с достоинством патриархального наставления. Синтаксис сделан ясным для чтения вслух, но ключевые образы и неоднозначности греческого текста сохранены. Архаизмы сведены к умеренному «внимайте», уместному в торжественном обращении; собственное имя «Велиар» не нормализовано по позднейшей привычной форме.
