  text: Καὶ⁴¹ ἐὰν ζημιωθῆτε ἑκουσίως *ἢ ἀκουσίως⁴² *μὴ λυπεῖσθε⁴³· ἀπὸ γὰρ λύπης⁴⁴ ἐγείρεται⁴⁵ καὶ⁴⁶ θυμός⁴⁷ ⌈μετὰ ψεύδους⁷⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/006.yaml
  text: And if you suffer loss willingly or unwillingly, do not be grieved; for from grief anger also arises with falsehood.
translation:
  language: ru
  text: И если вы понесёте ущерб — по своей воле или против воли, — не печальтесь, ибо из печали возникает также гнев вместе с ложью.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζημιωθῆτε
  choice: понесёте ущерб
  rationale: Передаёт значение претерпеть потерю или ущерб, не сужая смысл до материального убытка.
- source_word: ἑκουσίως ἢ ἀκουσίως
  choice: по своей воле или против воли
  rationale: Естественно по-русски сохраняет противопоставление добровольного и недобровольного.
- source_word: μὴ λυπεῖσθε
  choice: не печальтесь
  rationale: Сохраняет эмоциональный смысл глагола и связь с последующим существительным «печаль».
- source_word: ἐγείρεται
  choice: рождается
  rationale: В данном контексте естественно передаёт возникновение гнева из печали.
- source_word: θυμός
  choice: гнев
  rationale: Соответствует контексту сильного гневного чувства.
- source_word: μετὰ ψεύδους
  choice: соединённый с ложью
  rationale: Сохраняет связь гнева с ложью, не уточняя сверх греческого текста характер этой связи.
theological_decisions:
- issue: Связь выражения μετὰ ψεύδους с θυμός
  choice: гнев, соединённый с ложью
  alternative: гнев вместе с ложью
  rationale: Причастный оборот даёт ясный русский синтаксис, но сохраняет смысловую неопределённость предлога μετά и не утверждает причинной либо тождественной связи.
translation_notes:
  register: Современный литературный русский язык; краткий назидательный стиль, с сохранением причинной структуры и лексической связи между «печальтесь» и «печали».
