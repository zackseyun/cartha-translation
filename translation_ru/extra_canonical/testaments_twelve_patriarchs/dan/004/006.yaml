review_pass:
  verdict: revise
  source_fidelity: В целом перевод верно передаёт условное увещание, потерю/ущерб, противопоставление добровольного и недобровольного и причинную связь печали с возникновением гнева. Однако καί при θυμός передано неявно, а оборот «гнев, соединённый с ложью» чрезмерно закрепляет синтаксическую связь μετά ψεύδους именно как определение гнева.
  naturalness: Текст литературен и понятен. Более прямое «возникает ... вместе с ложью» естественно для русского и ближе к открытому синтаксису греческого.
  terminology: «Понесёте ущерб», «не печальтесь», «печаль» и «гнев» уместны. «Вместе с ложью» точнее сохраняет значение μετά и не истолковывает характер связи как внутреннее свойство гнева.
  issues:
  - severity: medium
    issue: Не выражено καί при θυμός.
    rationale: 'В конструкции ἐγείρεται καὶ θυμός καί имеет значение «также/и»: наряду с чем-либо возникает и гнев. Его следует отразить, не добавляя объект, с которым гнев сопоставляется.'
  - severity: medium
    issue: «Соединённый с ложью» сужает функцию μετὰ ψεύδους.
    rationale: Μετά с родительным прежде всего означает «с, вместе с». Причастная конструкция представляет ложь как квалифицирующий признак гнева, тогда как греческий порядок допускает более открытую связь сопутствия при возникновении.
  revised_text: И если вы понесёте ущерб — по своей воле или против воли, — не печальтесь, ибо из печали возникает также гнев вместе с ложью.
