  terminology: '«Горькие потери» и «замысел» хорошо передают ζημίαις πικραῖς и τὸ διαβούλιον. Для τὸν ὀργιζόμενον предпочтительно «того, кто гневается»: это сохраняет настоящее значение причастия, не представляя гнев уже завершившимся состоянием.'
