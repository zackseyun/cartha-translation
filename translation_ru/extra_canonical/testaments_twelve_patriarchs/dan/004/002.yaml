source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἐν γὰρ λόγῳ παροξύνεται⁵ πρῶτον εἶτα⁶ *ἐν ἔργοις⁷ †δυναμοῖ⁸ τὸν ὀργιζόμενον⁹, καὶ¹⁰ ἐν *ζημίαις πικραῖς διαταράσσει τὸ διαβούλιον αὐτοῦ¹¹, καὶ οὕτως διεγείρει ἐν θυμῷ μεγάλῳ τὴν ψυχὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/002.yaml
  text: For first he is provoked by a word; then by deeds it strengthens the one who is becoming angry; and by bitter losses it throws his purpose into confusion, and so it stirs up his soul in great wrath.
translation:
  language: ru
  text: Ведь сначала человек раздражается от слова; затем гнев через поступки укрепляет того, кто гневается, горькими потерями приводит его замысел в смятение и так возбуждает его душу в сильном гневе.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παροξύνεται
  choice: раздражается
  rationale: Передаёт значение внутреннего возбуждения и раздражения без чрезмерного усиления до открытой ярости, которая появляется в конце стиха.
- source_word: ἐν λόγῳ
  choice: из-за слова
  rationale: В данном контексте ἐν указывает на повод или средство, которым вызывается раздражение; по-русски причинное «из-за» звучит естественно.
- source_word: ἐν ἔργοις
  choice: находя выход в поступках
  rationale: Сохраняет связь с «делами/поступками», одновременно делая понятным развитие гнева от слова к действию; буквальное «поступками придаёт силы» по-русски неясно.
- source_word: δυναμοῖ τὸν ὀργιζόμενον
  choice: придаёт силы разгневанному
  rationale: 'Близко передаёт спорную, но ясную синтаксическую конструкцию: не названный прямо деятель усиливает человека, который гневается.'
- source_word: ζημίαις πικραῖς
  choice: горькими потерями
  rationale: Сохраняет конкретный смысл ущерба или утрат и эмоциональную окраску прилагательного πικραῖς.
- source_word: τὸ διαβούλιον αὐτοῦ
  choice: его намерение
  rationale: διαβούλιον обозначает замысел, намерение или обдуманное решение; «намерение» естественно сочетается с приведением в смятение и не сужает смысл до интеллектуальной способности.
- source_word: ἐν θυμῷ μεγάλῳ
  choice: до великой ярости
  rationale: Передаёт сильный, вспыхивающий гнев θυμός; «до» естественно выражает итог возбуждения души, хотя греческое ἐν буквально означает «в».
theological_decisions:
- issue: Не выраженный явно деятель в формах δυναμοῖ, διαταράσσει и διεγείρει
  choice: Обозначить его словом «гнев» и далее местоимением «он»
  alternative: Оставить деятель грамматически неопределённым или вставить «дух гнева»
  rationale: Контекст и последовательность действий указывают на гнев как действующую силу. «Дух гнева» был бы более конфессионально или интерпретационно нагруженной вставкой, отсутствующей в данном греческом предложении; полностью безличная конструкция сделала бы русский текст неясным.
- issue: Смена между испытывающим раздражение человеком и действующим гневом
  choice: Явно назвать человека в первой части и гнев во второй
  alternative: Сделать человека подлежащим всего стиха
  rationale: 'Так сохраняется напряжение греческого синтаксиса: παροξύνεται относится к подразумеваемому человеку, тогда как τὸν ὀργιζόμενον стоит в винительном падеже как объект последующего воздействия.'
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис сохраняет причинно-поступательное развитие оригинала, но избегает неестественных буквальных оборотов.
