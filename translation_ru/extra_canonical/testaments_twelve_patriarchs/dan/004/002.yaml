revisions:
- from: Ведь сначала человек раздражается из-за слова; затем гнев, находя выход в поступках, придаёт силы разгневанному; горькими потерями он приводит его намерение в смятение и так возбуждает его душу до великой ярости.
  to: Ведь сначала человек раздражается от слова; затем гнев через поступки укрепляет того, кто гневается, горькими потерями приводит его замысел в смятение и так возбуждает его душу в сильном гневе.
  rationale: 'Убрана не подтверждаемая оригиналом идея о том, что гнев «находит выход». Неявный деятель последующих глаголов назван «гневом», как это допускает контекст и английская аудиторская версия, без внесения термина «дух». Сохранена исходная цепь средств воздействия: слово, поступки, горькие потери; заключительное ἐν передано как состояние, а не как результативный предел.'
