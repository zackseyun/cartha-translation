  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/004.yaml
  text: For first it pleases the hearing, and so it sharpens the mind to perceive the provocation; and when he has become wrathful, he thinks that he is justly angry.
translation:
  language: ru
  text: Ибо сначала он услаждает слух, а затем обостряет ум, чтобы распознать повод к раздражению[a]; и человек, разгневавшись, думает, что гневается справедливо.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «то, что было раздражено (возбуждено)». Греческое выражение необычно; в данном контексте его можно понимать как «повод к раздражению» или «провокацию».'
    reason: Сохраняет пассивную форму и семантическую неопределённость τὸ ἐρεθισθέν, одновременно объясняя контекстуальный перевод основного текста.
lexical_decisions:
- source_word: τέρπει τὴν ἀκοήν
  choice: услаждает слух
  rationale: Передаёт образ приятного воздействия на слух без сведения выражения к простому «нравится слышать».
- source_word: ὀξύνει τὸν νοῦν
  choice: изощряет ум
  rationale: Сохраняет метафору заострения и одновременно передаёт направленную, но нравственно искажённую работу ума.
- source_word: τὸ ἐρεθισθέν
  choice: то, что вызвало раздражение
  rationale: Передаёт субстантивированное страдательное причастие, не фиксируя его однозначно как объективную «обиду» или «провокацию».
- source_word: θυμωθεὶς
  choice: разгневавшись
  rationale: Естественно передаёт наступившее состояние гнева и сохраняет временно-обстоятельственную связь с последующим суждением.
- source_word: δικαίως ὀργίζεσθαι
  choice: гневается справедливо
  rationale: Сохраняет утверждение о мнимой правомерности гнева, не усиливая его до морального оправдания переводчиком.
theological_decisions:
- issue: Неявный субъект первых глаголов и последующего причастия
  choice: Сохранить «он» для ранее названного действующего начала, а перед θυμωθείς пояснить субъект словом «человек»
  alternative: Сделать один и тот же субъект явным на протяжении всего стиха либо оставить субъект полностью невыраженным
  rationale: В греческом субъект определяется контекстом, тогда как буквальное сохранение одной мужской формы в русском могло бы ошибочно представить ранее названное начало как того, кто лично считает свой гнев справедливым. Уточнение «человек» делает смену смыслового носителя ясной, не добавляя конфессионального толкования.
- issue: Объективность повода для гнева
  choice: Не называть раздражившее событие действительной «обидой»
  alternative: «чтобы заметить нанесённую обиду» или «распознать провокацию»
  rationale: Фраза описывает работу гнева и самооправдание человека; перевод не должен заранее подтверждать, что повод действительно был несправедливостью или намеренной провокацией.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной речи. Синтаксис сохранён как единая причинно-последовательная цепь; лексика «услаждает» и «изощряет» удерживает образность оригинала, оставаясь понятной современному читателю.
