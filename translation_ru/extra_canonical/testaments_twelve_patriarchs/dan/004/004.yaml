    issue: «Изощряет ум» для ὀξύνει τὸν νοῦν
    rationale: Русское «изощрять» обычно означает развивать утончённость, изобретательность или хитрость. Греческий образ — заострение/обострение ума; дополнительный оттенок следует убрать.
  - severity: medium
    issue: Основной перевод τὸ ἐρεθισθέν и формулировка примечания
    rationale: «То, что вызвало раздражение» — интерпретация пассивной формы как причины раздражения. Она оправдана контекстом и английским audit trail, но её следует обозначить как «повод к раздражению», а в сноске сохранить буквальное пассивное значение и не выдавать причинное прочтение за единственно возможное.
