  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/003.yaml
  text: Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy, do not be exalted. Be changed neither to delight nor to disgust.
translation:
  language: ru
  text: Итак, когда кто-нибудь говорит против вас, не поддавайтесь гневу; и если кто-нибудь хвалит вас как святых, не превозноситесь. Не переходите ни к удовольствию, ни к отвращению.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαλεῖ ... καθ᾽ ὑμῶν
  choice: говорит против вас
  rationale: Прямо передаёт враждебную направленность речи, не сужая значение до клеветы или обвинения.
- source_word: μὴ κινεῖσθε εἰς ὀργήν
  choice: не поддавайтесь гневу
  rationale: Естественная русская передача буквального «не приводитесь в движение к гневу», сохраняющая призыв не позволять чужим словам вызвать гнев.
- source_word: ἐπαινέσῃ ... ὡς ἁγίους
  choice: хвалит вас как святых
  rationale: Сохраняет сравнительно-предикативное ὡς и не превращает похвалу в утверждение бесспорного статуса.
- source_word: μὴ ἐπαίρεσθε
  choice: не превозноситесь
  rationale: Передаёт переносное значение «не возноситесь, не становитесь надменными» в достойном современном регистре.
- source_word: μήτε μεταβάλλεσθε ... εἰς τέρψιν μήτε εἰς ἀηδίαν
  choice: Не меняйтесь ни от удовольствия, ни от отвращения
  rationale: Сохраняет повторный призыв не менять внутреннего состояния под влиянием противоположных эмоциональных реакций; «от» звучит по-русски естественнее буквального «в».
theological_decisions:
- issue: Значение ἁγίους
  choice: святых
  alternative: праведных
  rationale: Оставлен обычный и формально точный эквивалент «святых» без конфессионального уточнения смысла.
- issue: Характер заключительного наставления
  choice: Не меняйтесь ни от удовольствия, ни от отвращения
  alternative: Не переходите ни к удовольствию, ни к отвращению
  rationale: 'Сохранена намеренная общность текста: он предостерегает от внутренней перемены в обе стороны, не уточняя конкретную психологическую или аскетическую схему.'
translation_notes:
  register: Современный литературный русский язык с наставительным, сдержанно-достоинственным звучанием. Добавление «дети мои» не принято, поскольку его нет в представленном греческом тексте. Пунктуация следует трёхчастной структуре оригинала.
