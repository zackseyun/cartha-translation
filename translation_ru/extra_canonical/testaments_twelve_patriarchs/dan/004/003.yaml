review_pass:
  verdict: revise
  source_fidelity: 'Первые две части точно передают греческий текст: «говорит против вас» соответствует λαλεῖ ... καθ᾽ ὑμῶν; «не поддавайтесь гневу» удачно выражает μὴ κινεῖσθε εἰς ὀργήν; «не превозноситесь» передаёт предостережение μὴ ἐπαίρεσθε. В заключительной части черновик меняет направленность εἰς («в, к») на причинное «от».'
  naturalness: Текст в целом естественен для современного литературного русского и сохраняет спокойный наставительный регистр. «Не переходите ни к удовольствию, ни к отвращению» несколько ближе к греческому, чем исходная конструкция, и остаётся понятным в контексте нравственного наставления.
  terminology: «Святых» — точный, нейтральный по отношению к конфессиональным толкованиям эквивалент ἁγίους. «Удовольствие» и «отвращение» приемлемо передают τέρψις и ἀηδία; не следует конкретизировать их как телесное наслаждение либо моральное омерзение.
  issues:
  - severity: medium
    issue: Неверно передано направление в заключительной клаузе.
    rationale: μήτε μεταβάλλεσθε ... εἰς τέρψιν μήτε εἰς ἀηδίαν говорит о переходе/изменении «к, в» удовольствие или отвращение. Формула «не меняйтесь ни от удовольствия, ни от отвращения» делает эти состояния причиной перемены, чего греческий текст не утверждает.
  revised_text: Итак, когда кто-нибудь говорит против вас, не поддавайтесь гневу; и если кто-нибудь хвалит вас как святых, не превозноситесь. Не переходите ни к удовольствию, ни к отвращению.
