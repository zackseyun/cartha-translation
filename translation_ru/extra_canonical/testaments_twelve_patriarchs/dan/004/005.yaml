  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/005.yaml
  text: But if you fall into any loss or destruction, children, do not be thrown into confusion. For that very spirit causes one to desire to be angry over what is perishing, so that he may fall into anger through passion.
translation:
  language: ru
  text: Если же, дети, вы столкнётесь с какой-либо потерей или гибелью, не приходите в смятение. Ведь именно этот дух побуждает желать того, что гибнет, чтобы через страсть человек впал в гнев.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «…побуждает желать погибающего». Слово «страсть» (πάθος) может также означать «страдание» или «переживание».'
    reason: Примечание отмечает возможные оттенки τοῦ ἀπολλυμένου и πάθος, не заменяя в основном тексте настоящее значение причастия прошедшим.
lexical_decisions:
- source_word: ζημίᾳ ἢ ἀπωλείᾳ
  choice: ущерб или утрата
  rationale: 'Передаёт два близких, но не тождественных понятия: понесённый ущерб и потерю/гибель чего-либо; по-русски «утрата» естественнее в контексте последующего τοῦ ἀπολλυμένου.'
- source_word: μὴ ἐκθροεῖσθε
  choice: не приходите в смятение
  rationale: Сохраняет значение сильного внутреннего волнения и растерянности, не сводя его лишь к печали.
- source_word: αὐτὸ τὸ πνεῦμα
  choice: именно этот дух
  rationale: Передаёт усиление αὐτό и указание на дух, о котором говорится в ближайшем контексте.
- source_word: ποιεῖ ἐπιθυμῆσαι τοῦ ἀπολλυμένου
  choice: побуждает страстно желать того, что утрачено
  rationale: ἐπιθυμέω обозначает сильное желание; родительный τοῦ ἀπολλυμένου передан как объект желания без искусственного добавления «гневаться», которого непосредственно при инфинитиве нет.
- source_word: θυμῷ πέσῃ
  choice: впал в гнев
  rationale: Естественная русская передача буквального образа «пасть в гнев».
- source_word: διὰ τοῦ πάθους
  choice: через эту страсть
  rationale: πάθος здесь обозначает овладевшее человеком сильное влечение или страсть; указательное «эту» связывает выражение с только что названным желанием.
theological_decisions:
- issue: Связь желания утраченного с гневом
  choice: 'Сохранена последовательность: дух возбуждает страстное желание утраченного, а через эту страсть человек впадает в гнев.'
  alternative: Дух заставляет желать разгневаться из-за гибнущего.
  rationale: Греческая конструкция естественнее связывает τοῦ ἀπολλυμένου с ἐπιθυμῆσαι, тогда как гнев выражен последующим θυμῷ πέσῃ. Перевод не добавляет отсутствующий инфинитив «гневаться».
- issue: Подлежащее при πέσῃ
  choice: человек
  alternative: вы / подразумеваемое лицо без называния
  rationale: В греческом подлежащее не выражено. «Человек» делает русский синтаксис ясным, сохраняя обобщённый смысл и не ограничивая его только непосредственными адресатами.
translation_notes:
  register: Современный литературный русский язык с наставительным, достойным тоном. Обращение «дети» сохранено без добавления «мои». Синтаксис упрощён лишь настолько, чтобы причинная цепочка была ясна обычному читателю.
