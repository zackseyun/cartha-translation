    issue: «того, что утрачено» вместо τοῦ ἀπολλυμένου
    rationale: 'Утрачено обозначает уже произошедшую потерю, тогда как ἀπολλυμένου — причастие настоящего времени: «гибнущего», «того, что погибает». Существующее примечание признаёт вариант, но основной текст должен отражать форму оригинала.'
  - severity: low
    issue: «вы понесёте какой-либо ущерб или утрату» для περιπέσητε
    rationale: Глагол περιπίπτω означает «попасть, столкнуться с, подвергнуться». Формулировка с «понесёте ... утрату» менее точно передаёт конструкцию и несколько неестественна рядом с «ущербом».
