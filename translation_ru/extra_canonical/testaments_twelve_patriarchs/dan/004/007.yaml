source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ἔστι δὲ διπρόσωπον κακὸν ὁ θυμὸς μετὰ ψεύδους⁴⁸, καὶ συναίρονται⁴⁹ ἀλλήλοις ἵνα ταράξωσι⁵⁰ *τὴν καρδίαν⁵¹· ταρασσομένης δὲ τῆς ψυχῆς συνεχῶς, ἀφίσταται ὁ⁵² Κύριος ἀπ᾽ αὐτῆς καὶ κυριεύει αὐτῆς ὁ Βελίαρ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/007.yaml
  text: And anger with falsehood is a two-faced evil, and they join with one another in order to trouble the heart; and when the soul is continually troubled, the Lord departs from it, and Beliar rules over it.
translation:
  language: ru
  text: Гнев вместе с ложью — двуликое зло; они соединяются друг с другом, чтобы смутить сердце. Когда же душа непрестанно пребывает в смятении, Господь отступает от неё, и Велиар господствует над ней.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμὸς
  choice: гнев
  rationale: В данном нравственном контексте слово обозначает гнев или ярость; «гнев» естественно звучит по-русски и не усиливает значение без необходимости.
- source_word: ψεύδους
  choice: ложью
  rationale: Передаёт абстрактное существительное ψεῦδος и сохраняет представленное в тексте сочетание гнева с ложью.
- source_word: διπρόσωπον κακὸν
  choice: двуликое зло
  rationale: Сохраняет выразительный образ буквального «двуликого зла» и связь с двумя далее названными действующими началами.
- source_word: συναίρονται ἀλλήλοις
  choice: соединяются друг с другом
  rationale: Передаёт взаимное содействие гнева и лжи без чрезмерно буквального или специального оттенка.
- source_word: ταράξωσι τὴν καρδίαν
  choice: смутить сердце
  rationale: Сохраняет библейский образ сердца как внутреннего средоточия человека и значение тревожащего расстройства.
- source_word: ταρασσομένης ... τῆς ψυχῆς συνεχῶς
  choice: душа непрестанно пребывает в смятении
  rationale: Естественно передаёт длительное состояние, выраженное причастием настоящего времени и наречием συνεχῶς.
- source_word: ἀφίσταται
  choice: отступает
  rationale: Сохраняет прямое утверждение греческого текста о том, что Господь удаляется от души, не смягчая его богословской напряжённости.
- source_word: κυριεύει
  choice: воцаряется над
  rationale: Передаёт господство и власть; в русском предложении «над ней воцаряется» звучит естественнее, чем буквальное «господствует ею».
- source_word: Βελίαρ
  choice: Велиар
  rationale: Традиционная русская передача греческой формы имени Βελίαρ.
theological_decisions:
- issue: Утверждение об отступлении Господа от непрестанно смятённой души
  choice: Господь отступает от неё
  alternative: Господь оставляет её
  rationale: Выбранная формулировка близка к ἀφίσταται и сохраняет напряжённость исходного утверждения, не уточняя его в рамках какой-либо конфессиональной системы.
- issue: Характер власти Велиара над душой
  choice: над ней воцаряется Велиар
  alternative: Велиар господствует над ней
  rationale: Оба варианта передают κυριεύει; «воцаряется» ясно выражает установление власти и сохраняет торжественно-библейский регистр.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис разделён на два предложения для ясности, при этом причинно-временная связь и параллелизм исходного текста сохранены. Сноски не требуются.
