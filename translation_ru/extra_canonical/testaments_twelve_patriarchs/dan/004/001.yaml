  text: IV. Οὐκοῦν σύνετε¹ τὴν δύναμιν τοῦ θυμοῦ² ὅτι³ *ματαία ἐστίν⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/001.yaml
  text: Therefore understand the power of anger, that it is futile.
translation:
  language: ru
  text: Итак, поймите, что сила гнева тщетна.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐκοῦν
  choice: Итак
  rationale: 'Передаёт выводный характер частицы: автор призывает сделать заключение из предшествующего.'
- source_word: σύνετε
  choice: поймите
  rationale: Естественная современная передача повелительной формы со значением осознания и уразумения.
- source_word: τὴν δύναμιν τοῦ θυμοῦ
  choice: силу гнева
  rationale: Сохраняет прямую метафору δύναμις и обычное значение θυμός в данном нравоучительном контексте.
- source_word: ματαία ἐστίν
  choice: он тщетен
  rationale: Сохраняет значение пустоты, бесплодности и безрезультатности, не сужая его до одного лишь «бессилен».
theological_decisions:
- issue: К чему относится местоименно подразумеваемое подлежащее при ἐστίν
  choice: 'К гневу: «он тщетен»'
  alternative: 'К силе гнева: «она тщетна»'
  rationale: Греческое ματαία грамматически согласуется с δύναμις («сила»), однако по смыслу характеризует силу гнева и тем самым сам гнев. Русское «он тщетен» естественно передаёт общий тезис, хотя формальное согласование источника отражено менее явно.
translation_notes:
  register: Современный литературный русский язык; краткая, назидательная и достоинственная формулировка. Двоеточие естественно выражает пояснительное ὅτι.
