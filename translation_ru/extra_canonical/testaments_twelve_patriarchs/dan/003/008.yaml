- from: И когда тело совершит всё это, душа оправдывает содеянное, потому что не видит верно.
  to: Когда тело совершит всё это, душа оправдывает содеянное, потому что не видит правильно.
  rationale: 'Внесена только стилистически необходимая правка: «не видит верно» заменено на естественное современное «не видит правильно»; также начальное «И» опущено как не обязательное для русского самостоятельного предложения. Смысл, временные отношения и антропологическое противопоставление оригинала сохранены.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T21:10:52Z'
review_pass:
  verdict: revise
  source_fidelity: 'Греческая конструкция передана в целом точно: aorist conjunctive πράξῃ после ὅταν требует будущего значения («совершит»), δικαιοῖ сохраняет настоящее время, а τὰ πραχθέντα — совершённость действия. Однако «не видит верно» в современном русском звучит неестественно и несколько неясно; ὀρθῶς здесь естественнее передать наречием «правильно», сохраняя образ зрения.'
  naturalness: «И когда» допустимо, но при ὅταν с будущим значением более естественно «Когда». «Содеянное» литературно уместно и хорошо передаёт нравственно окрашенное субстантивированное причастие. Замена «верно» на «правильно» делает фразу современной и идиоматичной.
  terminology: «Тело» (σῶμα), «душа» (ψυχή) и «оправдывает» (δικαιοῖ) сохранены без догматического переосмысления. «Оправдывает содеянное» корректно выражает не юридическое оправдание лица, а признание или рационализацию уже совершённых дел.
  issues:
  - severity: low
    issue: Неестественная коллокация «не видит верно».
    rationale: Хотя она формально близка к οὐ βλέπει ὀρθῶς, в современном литературном русском обычнее «не видит правильно». Это сохраняет зрительную метафору и смысл неверного восприятия.
  revised_text: Когда тело совершит всё это, душа оправдывает содеянное, потому что не видит правильно.
  revised_footnotes: []
