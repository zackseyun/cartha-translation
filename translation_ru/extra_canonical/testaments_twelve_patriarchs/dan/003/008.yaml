source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Καὶ ὅταν ταῦτα πάντα πράξῃ τὸ σῶμα, δικαιοῖ τὰ πραχθέντα καὶ ἡ ψυχή¹⁰, ἐπειδὴ οὐ βλέπει ὀρθῶς.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/008.yaml
  text: And when the body has done all these things, the soul justifies what has been done, because it does not see rightly.
translation:
  language: ru
  text: Когда тело совершит всё это, душа оправдывает содеянное, потому что не видит правильно.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πράξῃ
  choice: совершит
  rationale: Передаёт совершение поступков в данном контексте естественным современным русским глаголом.
- source_word: δικαιοῖ
  choice: оправдывает
  rationale: 'Сохраняет прямой смысл настоящего времени: душа признаёт уже совершённое правомерным или находит ему оправдание.'
- source_word: τὰ πραχθέντα
  choice: содеянное
  rationale: Кратко передаёт субстантивированное причастие «то, что было сделано», сохраняя нравственный оттенок контекста.
- source_word: οὐ βλέπει ὀρθῶς
  choice: не видит верно
  rationale: Сохраняет зрительную метафору и смысл искажённого нравственного восприятия, не сводя выражение только к рассуждению.
theological_decisions:
- issue: Соотношение тела и души в оправдании поступка
  choice: 'Сохранено прямое различение: тело совершает, а душа оправдывает содеянное.'
  alternative: Передать душу как «разум» или пояснить, что она одобряет поступки тела.
  rationale: Греческий текст говорит именно о σῶμα и ψυχή; замена или пояснение устранили бы заложенное в тексте антропологическое напряжение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Формулировка близка к греческому синтаксису, но естественна по-русски.
