  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/002.yaml
  text: For anger is blindness, and it does not allow one to see anyone’s face in truth.
translation:
  language: ru
  text: Ведь гнев — это слепота, и он не позволяет увидеть лицо кого бы то ни было таким, каково оно есть на самом деле.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Букв.: «увидеть лицо кого-либо в истине».'
    reason: Сохраняет необычное греческое выражение ἐν ἀληθείᾳ («в истине») и показывает, что основной текст раскрывает его смысл, не устраняя образ «лица».
lexical_decisions:
- source_word: θυμός
  choice: гнев
  rationale: Передаёт сильное негодование или ярость в данном нравственном наставлении естественным и традиционным русским словом.
- source_word: Τύφλωσις
  choice: слепота
  rationale: Сохраняет прямую метафору греческого текста, где гнев отождествляется со слепотой.
- source_word: πρόσωπόν τινος ἐν ἀληθείᾳ
  choice: другого человека таким, каков он на самом деле
  rationale: Естественно по-русски выражает смысл буквального оборота «лицо кого-либо в истине», то есть неспособность воспринимать человека верно, без искажения гневом.
theological_decisions: []
translation_notes:
  register: Современный литературный русский язык; наставительный и достойный тон. Союз γάρ передан словом «ведь», а καί — союзом «и»; метафора слепоты сохранена без конфессионального истолкования.
