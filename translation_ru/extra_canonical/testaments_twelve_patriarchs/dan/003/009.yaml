  naturalness: «В гневе обладает тройной силой» естественнее и точнее, чем «в своём гневе обретает тройную силу». Явное обозначение трёх частей как «одна… вторая… третья» делает эллиптическое перечисление ясным по-русски.
  terminology: «Силён телом», «прислужники», «природная сила» и «творит зло» приемлемы для современного литературного русского и соответствуют исходному тексту. «Побеждая» точнее передаёт νικῶν, чем «одолевая», хотя оба варианта возможны.
