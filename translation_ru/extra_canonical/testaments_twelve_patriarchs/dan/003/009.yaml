source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Διὰ τοῦτο¹¹ ὁ θυμούμενος¹², *ἐὰν μὲν ᾖ¹³ *δυνατὸς ⌈τῷ σώματι⌉¹⁴, *τριπλῆν ἐν τῷ θυμῷ τὴν δύναμιν κέκτηται¹⁵· μίαν¹⁶ μὲν ἀπὸ¹⁷ τῆς βοηθείας *τῶν ὑπουργούντων¹⁸. *δεύτερον δὲ¹⁹ διὰ τοῦ πλούτου *πείθων καὶ νικῶν [αὐτὸν] ἀδίκως²⁰. *τρίτον τὴν²¹ φυσικὴν ἔχων *δύναμιν δι'' αὐτῆς δρᾷ²² τὸ κακόν²³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/009.yaml
  text: 'Therefore the one who is angry, if he is strong in body, has acquired threefold power in his anger: one from the help of attendants; a second through wealth, persuading and prevailing unjustly; and a third, having natural strength, by it he does evil.'
translation:
  language: ru
  text: 'Поэтому разгневанный, если он силён телом, в гневе обладает тройной силой: одна — от помощи прислужников; вторая — через богатство, убеждая и несправедливо побеждая [его][a]; третья — имея природную силу, посредством неё он творит зло.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Слово «его» соответствует греческому αὐτόν, заключённому издателем в скобки как текстуально сомнительному. Без него выражение можно понимать в общем смысле: «убеждая и несправедливо побеждая».'
    reason: Передаёт редакторские скобки в исходном греческом тексте и сохраняет неоднозначность объекта действий.
lexical_decisions:
- source_word: ὁ θυμούμενος
  choice: разгневанный
  rationale: Причастие обозначает человека, охваченного гневом; субстантивированное «разгневанный» естественно и точно передаёт греческую форму.
- source_word: τριπλῆν ἐν τῷ θυμῷ τὴν δύναμιν κέκτηται
  choice: в своём гневе обретает тройную силу
  rationale: Передаёт трёхкратное усиление способности действовать во гневе, не добавляя отсутствующего в данном греческом тексте упоминания души.
- source_word: τῶν ὑπουργούντων
  choice: прислужников
  rationale: Слово обозначает тех, кто служит или содействует человеку; в данном отрицательном контексте «прислужники» естественно выражает их вспомогательную роль.
- source_word: πείθων καὶ νικῶν
  choice: убеждая и … одолевая
  rationale: 'Сохраняются два раздельных действия: воздействие убеждением и достижение превосходства или победы.'
- source_word: φυσικὴν … δύναμιν
  choice: природной силой
  rationale: Буквально и ясно передаёт присущую человеку от природы силу, в отличие от силы, получаемой от помощников или богатства.
- source_word: δρᾷ τὸ κακόν
  choice: творит зло
  rationale: Достоинственная и естественная русская передача выражения «делает зло».
theological_decisions:
- issue: Источник тройной силы разгневанного человека
  choice: Не добавлять «в душе» и представить помощь, богатство и природную силу как три средства совершения зла.
  alternative: «Сила его души для гнева становится тройной».
  rationale: В предоставленном греческом тексте слова «душа» нет; его добавление из иной текстовой формы или толкования необоснованно сужало бы смысл.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксический параллелизм «одну — …; вторую — …; третью — …» сохраняет структуру греческого перечисления; формулировки остаются понятными широкому читателю.
