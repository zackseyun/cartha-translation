source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἐὰν δὲ ἀσθενὴς ᾖ ὁ²⁴ θυμούμενος²⁵, *διπλοῦν τὸ τῆς ὀργῆς πάθος ἐν αὐτῷ ἀναφύει²⁶· βοηθεῖ *γὰρ αὐτῷ ὁ θυμὸς²⁷ πάντοτε ἐν παρανομίᾳ²⁸. 6. Τοῦτο τὸ πνεῦμα ἀεὶ μετὰ τοῦ ψεύδους *ἐκ δεξιῶν τοῦ Σατανᾶ πορεύεται, ἵνα ἐν ὠμότητι καὶ ψεύδει³⁰ γίνωνται³¹ αἱ πράξεις αὐτοῦ³².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/010.yaml
  text: But if the one who is angry is weak, the passion of wrath grows in him twofold, for anger always helps him in wrongdoing. This spirit always proceeds with falsehood at the right hand of Satan, so that his deeds may be done in cruelty and falsehood.
translation:
  language: ru
  text: Но если тот, кто гневается, слаб, страсть гнева разрастается в нём вдвойне, ведь гнев всегда помогает ему творить беззаконие. Этот дух всегда идёт вместе с ложью по правую руку от Сатаны, чтобы дела его совершались в жестокости и лжи.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσθενὴς
  choice: слаб
  rationale: Прямо передаёт физическую или внутреннюю слабость, не устраняя намеренно оставленную в греческом тексте широту значения.
- source_word: ὁ θυμούμενος
  choice: разгневанный
  rationale: Естественно и сжато обозначает человека, охваченного гневом.
- source_word: διπλοῦν ... ἀναφύει
  choice: разрастается ... вдвойне
  rationale: Передаёт образ возникновения и усиленного роста, выраженный глаголом ἀναφύει, а также значение διπλοῦν.
- source_word: ἐν παρανομίᾳ
  choice: творить беззаконие
  rationale: Динамически и естественно передаёт содействие гнева человеку в совершении противозаконного или неправедного поступка.
- source_word: ἐκ δεξιῶν τοῦ Σατανᾶ
  choice: по правую руку от Сатаны
  rationale: Сохраняет пространственный и образный смысл греческого оборота без дополнительного истолкования.
- source_word: ἐν ὠμότητι καὶ ψεύδει
  choice: с жестокостью и ложью
  rationale: Передаёт обстоятельственный смысл ἐν и сохраняет парность двух нравственных характеристик.
theological_decisions:
- issue: Референт местоимения αὐτοῦ в заключительной части
  choice: дела его
  alternative: дела Сатаны / дела этого духа
  rationale: Греческое местоимение допускает некоторую синтаксическую неоднозначность. Формулировка «дела его» сохраняет её и не навязывает конкретный референт.
- issue: Связь духа гнева с ложью и Сатаной
  choice: Этот дух всегда идёт вместе с ложью по правую руку от Сатаны
  alternative: Этот дух вместе с ложью всегда исходит от правой руки Сатаны
  rationale: Глагол πορεύεται означает движение или хождение, а ἐκ δεξιῶν здесь естественнее понимать как положение по правую сторону; перевод не усиливает текст до идеи происхождения от Сатаны.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Сохранены повтор ключевых слов «гнев» и «ложь», образ роста страсти и неоднозначность заключительного местоимения.
