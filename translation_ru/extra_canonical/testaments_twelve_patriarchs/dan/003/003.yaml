base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/003.yaml
  text: Even if it is a father or a mother, it regards them as enemies. If it is a brother, it does not know him. If it is a prophet of the Lord, it disobeys him; if a righteous man, it does not see him; if a friend, it does not recognize him.
translation:
  language: ru
  text: Ведь даже если это отец или мать, он относится к ним как к врагам. Если это брат, он его не знает; если это пророк Господа, он не повинуется ему; если это праведник, он не видит его; если это друг, он не узнаёт его.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς πολεμίοις προσέχει αὐτοῖς
  choice: относится к ним как к врагам
  rationale: Передаёт направленность отношения и враждебное восприятие без неестественного буквального оборота «внимает им как врагам».
- source_word: παρακούει
  choice: не повинуется ему
  rationale: Глагол в данном контексте выражает отказ слушаться; вариант сохраняет более сильный смысл, чем простое «не слушает».
- source_word: οὐ βλέπει
  choice: не видит его
  rationale: Сохранено прямое значение βλέπει и намеренная образность исходного текста, без истолковывающего «не замечает».
- source_word: οὐ γνωρίζει
  choice: не узнаёт его
  rationale: Отличает γνωρίζει от предшествующего οἶδεν («знает») и естественно передаёт отказ признавать знакомого или близкого человека.
theological_decisions:
- issue: Не названный в стихе субъект мужского рода
  choice: сохранить местоимение «он» без добавления имени субъекта
  alternative: вставить «гнев» или иное название субъекта из контекста
  rationale: Греческий текст данного стиха полагается на предшествующий контекст; явная вставка сняла бы формальную неоднозначность и внесла толкование в основной текст.
- issue: Генитив Κυρίου
  choice: «пророк Господа»
  alternative: «пророк Господень»
  rationale: Современная конструкция точно выражает принадлежность и служение Господу, не добавляя конфессионального оттенка.
translation_notes:
  register: Современный литературный русский язык с достойным библейским звучанием. Параллельная условная структура греческого текста сохранена; различие между «не знает» и «не узнаёт» передано явно. Начальное Ὅτι отражено словом «Ведь» как связка с предшествующим рассуждением.
