  text: III. *Καὶ γὰρ πονηρὸς ὁ θυμός¹, τέκνα μου, *ὡς καὶ αὐτὴν τὴν ψυχὴν ἐκταράσσει².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/006.yaml
  text: For anger is evil, my children, because it throws even the soul itself into turmoil.
translation:
  language: ru
  text: 'Ибо гнев — зло, дети мои: он приводит в смятение даже саму душу.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυμός
  choice: гнев
  rationale: В данном нравственном наставлении слово обозначает гнев как разрушительную страсть; «гнев» естественно и точно передаёт смысл в современном русском языке.
- source_word: πονηρός
  choice: зло
  rationale: Предикативная конструкция передана существительным «зло», чтобы естественно выразить нравственную оценку гнева, не ослабляя её до «плох» или «вреден».
- source_word: ἐκταράσσει
  choice: приводит в смятение
  rationale: Глагол с усилительной приставкой обозначает глубокое внутреннее потрясение или возмущение; выбранный оборот сохраняет интенсивность и звучит литературно.
- source_word: αὐτὴν τὴν ψυχήν
  choice: даже саму душу
  rationale: Сочетание усилительных элементов передано словами «даже саму», сохраняя эмфазу греческого текста.
theological_decisions:
- issue: Нравственная характеристика гнева
  choice: «гнев — зло»
  alternative: «гнев зол» / «гнев пагубен»
  rationale: Формулировка сохраняет прямую нравственную оценку πονηρός и не вводит дополнительных богословских разграничений между видами гнева, которых стих явно не выражает.
translation_notes:
  register: Современный литературный русский язык с кратким, афористичным и наставительным звучанием. Обращение «дети мои» сохранено; двоеточие естественно связывает оценку гнева с пояснением его воздействия.
