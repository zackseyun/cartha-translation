  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/005.yaml
  text: And with what does it cover his eyes? With hatred of heart against his brother, unto envy.
translation:
  language: ru
  text: И чем же он застилает свои глаза? Сердечной ненавистью к своему брату — до зависти.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιβάλλει τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: застилает ему глаза
  rationale: Передаёт образ покрывания глаз естественным русским выражением, сохраняя идею помрачённого восприятия без лишнего истолкования.
- source_word: ἐν μίσει καρδίας
  choice: сердечной ненавистью
  rationale: Компактно и естественно передаёт буквальное «ненавистью сердца», сохраняя указание на внутренний источник ненависти.
- source_word: κατὰ τοῦ ἀδελφοῦ αὐτοῦ
  choice: к своему брату
  rationale: Нормальное русское управление для направленной на человека ненависти; «своему» ясно передаёт αὐτοῦ.
- source_word: εἰς φθόνον
  choice: до зависти
  rationale: Сохраняет неоднозначную направленность εἰς и не уточняет жёстко, является ли зависть результатом, целью или крайней степенью состояния.
theological_decisions:
- issue: Связь ненависти и зависти в выражении εἰς φθόνον
  choice: до зависти
  alternative: ведущей к зависти
  rationale: Выбран менее интерпретирующий вариант, который сохраняет смысловую напряжённость греческого εἰς и не навязывает однозначную причинно-следственную связь.
translation_notes:
  register: Современный литературный русский язык; образность исходного текста сохранена, синтаксис сделан естественным и понятным. Местоимение «он» оставлено в соответствии с контекстуальной отсылкой греческого текста.
