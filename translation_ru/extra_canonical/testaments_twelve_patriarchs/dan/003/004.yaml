source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Περιβάλλεται γὰρ ⌈αὐτὸν⌉⁷ τὸ πνεῦμα τοῦ θυμοῦ τὸ δίκτυον τῆς πλάνης²¹ καὶ τυφλοῖ τοὺς²² ὀφθαλμοὺς αὐτοῦ, καὶ¹ διὰ τοῦ ψεύδους σκοτοῖ²³ τὴν διάνοιαν ⌈αὐτοῦ⌉⁷²⁴, καὶ τὴν ἰδίαν ὅρασιν παρέχει αὐτῷ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/004.yaml
  text: For the spirit of anger wraps him in the net of deceit and blinds his eyes, and through falsehood it darkens his mind and gives him his own vision.
translation:
  language: ru
  text: Ведь дух гнева опутывает его сетью заблуждения, ослепляет его глаза, через ложь омрачает его разум и даёт ему своё ви́дение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ θυμοῦ
  choice: дух гнева
  rationale: Формально и естественно передаёт греческое выражение, не устраняя возможную персонификацию.
- source_word: τὸ δίκτυον τῆς πλάνης
  choice: сеть заблуждения
  rationale: Сохраняет образ сети и смысл πλάνη как заблуждения/обмана; контекст последующего ψεῦδος передан отдельно словом «ложь».
- source_word: σκοτοῖ τὴν διάνοιαν
  choice: омрачает его разум
  rationale: Русское «омрачает» сохраняет метафору тьмы, а «разум» естественно передаёт διάνοια в данном контексте.
- source_word: τὴν ἰδίαν ὅρασιν
  choice: собственное ви́дение
  rationale: 'Местоимение ἰδίαν грамматически соотнесено с духом гнева: он передаёт человеку присущий ему способ видеть. «Ви́дение» сохраняет неоднозначность между зрительным восприятием и картиной действительности.'
theological_decisions:
- issue: Степень персонификации духа гнева
  choice: Сохранено выражение «дух гнева» и действие «передаёт», без пояснения его природы.
  alternative: 'Передать как безличную силу или состояние: «гнев опутывает… и навязывает свой взгляд».'
  rationale: Греческий текст представляет πνεῦμα как действующего субъекта; перевод не должен заранее решать, понимается ли он буквально, олицетворённо или психологически.
- issue: Чья «собственная» картина зрения имеется в виду
  choice: «собственное ви́дение» относится к духу гнева.
  alternative: «его собственное ви́дение» можно ошибочно отнести к ослеплённому человеку.
  rationale: Форма ἰδίαν наиболее естественно указывает на субъект παρέχει — дух гнева; русская формулировка без второго «его» уменьшает местоименную двусмысленность, сохраняя необычный образ оригинала.
translation_notes:
  register: Современный литературный русский язык, с достоинством и без архаизации. Синтаксический параллелизм исходного перечисления сохранён; ударение в слове «ви́дение» обозначено, чтобы исключить чтение «ведение».
