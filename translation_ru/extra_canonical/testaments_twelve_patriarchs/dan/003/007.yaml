id: T12P.DAN.3.7
reference: Testament of Dan 3:7
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ τὸ μὲν σῶμα *ἴδιον ποιεῖται³ τοῦ θυμουμένου⁴, *τῆς δὲ ψυχῆς⁵ κατακυριεύει, καὶ παρέχει σώματι⁶· ⌈δύναμιν⌉⁷, ἵνα ποιήσῃ⁸ πᾶσαν⁹ ἀνομίαν⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/007.yaml
  text: And it makes the body of the angry man its own, and gains mastery over the soul, and gives the body strength so that it may commit every lawless deed.
translation:
  language: ru
  text: И оно присваивает себе тело разгневанного, подчиняет себе душу и даёт телу силу, чтобы совершить всякое беззаконие.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴδιον ποιεῖται
  choice: присваивает себе
  rationale: Передаёт буквальный образ «делает своим» естественным современным русским выражением.
- source_word: τοῦ θυμουμένου
  choice: разгневанного
  rationale: Субстантивированное причастие обозначает человека, охваченного гневом; русский вариант сохраняет связь с предшествующим подразумеваемым действующим началом.
- source_word: κατακυριεύει
  choice: подчиняет себе
  rationale: Передаёт сильное значение установления господства над душой без излишне архаичного «овладевает».
- source_word: δύναμιν
  choice: силу
  rationale: Прямое и естественное соответствие в контексте способности тела действовать.
- source_word: πᾶσαν ἀνομίαν
  choice: всякое беззаконие
  rationale: Сохраняет религиозно-нравственный смысл ἀνομία и обобщающую силу πᾶσαν.
theological_decisions:
- issue: Референт среднего местоимения, подразумеваемого в глаголах
  choice: оно
  alternative: гнев
  rationale: Греческий текст продолжает описание ранее названной силы или состояния; местоимение сохраняет межстиховую зависимость и не уточняет референт сверх данного стиха.
- issue: Отношение души и тела под властью гнева
  choice: подчиняет себе душу и даёт телу силу
  alternative: овладевает душой и предоставляет её телу
  rationale: Пунктуация и синтаксис издания поддерживают понимание σώματι как дательного адресата при παρέχει, а δύναμιν — как дополнения; перевод не вводит дополнительного представления о передаче души телу.
translation_notes:
  register: Современный литературный русский язык; синтаксис близок к греческому, но звучит естественно. Сохранена напряжённая персонификация действующего начала и последовательность «тело — душа — тело».
