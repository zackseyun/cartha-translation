  text: …истину и долготерпение — погибнете.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Стих дошёл как конец предложения; слова «истину и долготерпение» грамматически зависят от предшествующего, отсутствующего здесь контекста.
    reason: Предоставленный греческий источник начинается с винительных форм без управляющего слова, поэтому фрагментарность следует обозначить, не восполняя текст догадкой.
lexical_decisions:
- source_word: τὴν ἀλήθειαν
  choice: истину
  rationale: Прямое соответствие греческому существительному; винительный падеж сохраняет связь с утраченной в данном фрагменте предшествующей частью предложения.
- source_word: τὴν μακροθυμίαν
  choice: долготерпение
  rationale: Передаёт стойкое, терпеливое перенесение и сдержанность; сохраняет традиционную богословскую лексику, оставаясь понятным в современном литературном русском.
- source_word: ἀπολεῖσθε
  choice: погибнете
  rationale: Форма будущего времени, 2-е лицо множественного числа; перевод сохраняет прямое предупреждение без уточнения характера гибели.
theological_decisions:
- issue: Характер гибели в ἀπολεῖσθε
  choice: погибнете
  alternative: будете уничтожены / пропадёте
  rationale: Греческая форма допускает широкий смысл — гибель, уничтожение или утрату. Нейтральное «погибнете» сохраняет эту смысловую широту и не навязывает конкретного богословского толкования.
translation_notes:
  register: Современный литературный русский с достоинством и лаконичностью. Начальное многоточие сохраняет фрагментарный характер источника; тире отмечает резкий переход к предупреждению, не восполняя отсутствующую синтаксическую связь.
