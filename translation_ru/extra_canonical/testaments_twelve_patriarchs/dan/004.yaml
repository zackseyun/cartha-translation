  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004.yaml
  text: '1[a]. For anger is blindness. It does not allow one to see the face of any man with truth.


    2. For first it is stirred up by a word; then by deeds it strengthens the one who is becoming angry; and by bitter losses it provokes him. It throws his purpose into confusion, and so it rouses his soul in great fury.


    3[b]. Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy, do not be exalted. Be changed neither to delight nor to disgust.


    4. For first it pleases the hearing, and so it sharpens the mind to perceive the provocation; and when he has become wrathful, he thinks that he is justly angry.


    5. But if you fall into any loss or ruin, children, do not be distressed. For this very spirit makes one desire to be angry over what is perishing, so that he may fall into anger through affliction.


    6. And if you suffer loss willingly or unwillingly, do not be grieved; for from grief anger also arises with falsehood.


    7. And anger with falsehood is a two-faced evil, and they join with one another in order to trouble the heart; and when the soul is continually troubled, the Lord departs from it[c][d], and Beliar rules over it.'
translation:
  language: ru
  text: '**Завещание Дана, 4**


    1. Итак, поймите, какова сила гнева: она тщетна.[a]


    2. Сначала он возбуждается от слова, затем через поступки придаёт сил разгневанному, а при горьких потерях приводит его рассудок в смятение и так возбуждает его душу до великой ярости.


    3. Поэтому, когда кто-нибудь говорит против вас, не поддавайтесь гневу; и если кто-нибудь хвалит вас как святых, не превозноситесь. Не переходите ни к восторгу, ни к отвращению.


    4. Ведь сначала это услаждает слух, а затем изощряет ум, чтобы он распознал возникшее раздражение;[b] и, разгневавшись, человек думает, что гневается справедливо.


    5. Но если вас постигнет какая-либо потеря или утрата, дети, не приходите в смятение. Ведь этот самый дух заставляет человека желать того, что утрачивается, чтобы через страдание он впал в гнев.


    6. И если вы понесёте ущерб по своей или не по своей воле, не предавайтесь печали, потому что из печали возникает и гнев, сопровождаемый ложью.[d]


    7. Гнев вместе с ложью — двуликое зло; они содействуют друг другу, чтобы возмутить сердце. Когда же душа непрестанно пребывает в смятении, Господь отступает от неё, и над ней воцаряется Велиар.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Начальная строка переданного греческого текста гласит: «поймите силу гнева, что она тщетна». В иной реконструкции текстовой традиции начало передаётся как: «гнев есть слепота; он не позволяет истинно видеть лицо человека».'
    reason: textual_variant
  - marker: b
    text: 'Греческий текст здесь не вполне ясен. Причастие может означать «то, что было возбуждено (вызвано)», либо «раздражение»; возможны также переводы: «чтобы осознать возникшее возбуждение» и «чтобы заметить раздражение».'
    reason: alternative_reading
  - marker: d
    text: Выражение «с ложью» может означать, что гнев возникает в сопровождении лжи, либо что возникший из печали гнев затем усиливается ложью.
    reason: alternative_reading
  - marker: c
    text: Велиар — традиционное в древней иудейской литературе имя злой силы, противостоящей Богу; встречается также форма «Велиал».
    reason: cultural_note
lexical_decisions:
- source_word: ματαία
  choice: тщетна
  rationale: Передаёт прямое значение сохранившегося греческого текста, не заменяя его реконструированным чтением о «слепоте».
- source_word: παροξύνεται
  choice: возбуждается
  rationale: 'Сохраняет страдательно-начинательный оттенок: слово приводит гнев в действие.'
- source_word: δυναμοῖ
  choice: придаёт сил
  rationale: Передаёт образ усиления разгневанного человека; форма в издании текстуально отмечена, но общий смысл контекста ясен.
- source_word: ζημίαις πικραῖς
  choice: горькими потерями
  rationale: Сохраняет как значение ущерба или утраты, так и эмоциональную окраску определения.
- source_word: διαβούλιον
  choice: рассудок
  rationale: В данном нравственно-психологическом контексте речь идёт о способности обдумывать и принимать решения, которую гнев расстраивает.
- source_word: κινεῖσθε εἰς ὀργήν
  choice: поддавайтесь гневу
  rationale: Естественная современная русская формулировка сохраняет представление о переходе под власть гнева.
- source_word: ἐπαίρεσθε
  choice: превозноситесь
  rationale: Точно выражает самовозвышение вследствие похвалы и соответствует достоинству увещательного стиля.
- source_word: τέρψιν ... ἀηδίαν
  choice: восторгу ... отвращению
  rationale: Передаёт противоположные эмоциональные крайности, не сводя первую лишь к спокойному удовольствию.
- source_word: ὀξύνει τὸν νοῦν
  choice: изощряет ум
  rationale: Сохраняет метафору обострения умственного внимания, которое начинает искать повод для раздражения.
- source_word: ἐρεθισθέν
  choice: то, что его раздражает
  rationale: Оставляет возможной как объективную провокацию, так и субъективно воспринятый раздражитель.
- source_word: ἐκθροεῖσθε
  choice: не приходите в смятение
  rationale: Передаёт сильное внутреннее беспокойство, не сужая значение до одного лишь страха.
- source_word: Βελίαρ
  choice: Велиар
  rationale: Сохраняет традиционную форму имени злой духовной силы, отличную от нарицательного обозначения зла.
theological_decisions:
- issue: Дух как нравственно-духовная действующая сила
  choice: «этот самый дух»
  alternative: «этот порыв» или «это расположение»
  rationale: Греческое πνεῦμα допускает духовно-нравственную персонификацию; её нельзя без основания сводить к чисто психологическому импульсу.
- issue: Значение Κύριος
  choice: «Господь»
  alternative: «Владыка»
  rationale: Обычное религиозное значение κύριος уместно в контексте отступления Бога от постоянно возмущённой души.
- issue: Отступление Господа от смятённой души
  choice: сохранено прямое выражение «Господь отступает от неё»
  alternative: смягчить до «душа удаляется от Господа»
  rationale: Источник прямо делает Господа грамматическим субъектом; перевод не должен устранять возникающее богословское напряжение.
- issue: Гнев и ложь как духовно-нравственные союзники
  choice: «они содействуют друг другу»
  alternative: «это действует сообща»
  rationale: Множественное число греческого сказуемого представляет гнев и ложь как две взаимно поддерживающие силы, хотя вместе они названы одним двуликим злом.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего нравственного наставления. Синтаксис умеренно возвышенный, но понятный обычному читателю. Обращение τέκνα передано буквально как «дети», без добавления отсутствующего в греческом притяжательного местоимения. Текстовые трудности отмечены в сносках, а не разрешены молча.
