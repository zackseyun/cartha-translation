  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005.yaml
  text: '1 Therefore[v6], my children, keep the commandment of the Lord, and keep his law. Depart from anger, and hate falsehood, so that the Lord may dwell in you and Beliar may flee from you.


    2 Speak truth, each one to his neighbor, and you will certainly not fall into wrath and tumults; rather, you will be in peace, having the God of peace[v8], and war will certainly not prevail against you.


    3 Love the Lord throughout all your life, and one another with a true heart.


    4 I know that in the last days you will depart from the Lord, and you will provoke Levi, and you will set yourselves in battle array against Judah, but you will not prevail against them. For an angel of the Lord guides them both, because by them Israel will stand.


    5 And whenever you depart from the Lord, walking in every wickedness, you will do the abominations of the nations, prostituting yourselves with lawless women, and the spirits of wickedness working among you in every evil.


    6 For I have read in the book of Enoch the righteous, and I learned that your ruler is Satan, and that the spirits of wickedness and of pride will attend on the sons of Levi, to make them sin before the Lord.


    7 And my sons will draw near to Levi and will sin together with them in all things. But the sons of Judah will be greedy, snatching what belongs to others like lions.


    8 Therefore you will be led away with them into captivity, and there you will receive all the plagues of Egypt and all the evils of the nations.


    9 And so, when you return to the Lord, you will receive mercy, and he will bring you into his sanctuary, and he will give you peace.


    10 And for you the salvation of the Lord will arise from the tribe of Judah and of Levi. For he himself will make war against Beliar, and he will grant the vengeance of victory to your fathers.


    11 And he will take the captivity from Beliar, even the souls of the holy ones, and he will turn disobedient hearts to the Lord, and he will give eternal peace to those who call on him.


    12 And the holy ones will rest in Eden, and the righteous will rejoice over the new Jerusalem, which is the eternal glory of God.


    13 And Jerusalem will no longer endure desolation, nor will Israel be taken captive, because the Lord will be in her midst[v13][v12][v11][v10], and the Holy One of Israel will reign over her.'
translation:
  language: ru
  text: 'Завещание Дана, глава 5


    1 Итак, дети мои, храните заповедь Господа и соблюдайте Его закон. Отступитесь от гнева и возненавидьте ложь, чтобы Господь обитал в вас, а Велиар бежал от вас.


    2 Говорите правду каждый своему ближнему — и тогда вы не впадёте в ярость и смуты, но будете жить в мире, имея с собой Бога мира, и война не одолеет вас.


    3 Любите Господа всю вашу жизнь, а друг друга — искренним сердцем.


    4 Я знаю, что в последние дни вы отступите от Господа, вызовете негодование Левия и выстроитесь на битву против Иуды, но не одолеете их. Ведь ангел Господа ведёт их обоих, потому что благодаря им устоит Израиль.


    5 Когда же вы отступите от Господа, то, идя путём всякого зла, станете совершать мерзости народов, предаваясь разврату с беззаконными женщинами, а духи зла будут действовать среди вас во всяком злодействе.


    6 Ведь я прочёл в книге праведного Еноха[a] и узнал, что ваш правитель — Сатана и что духи зла и гордыни будут прислуживать сынам Левия[b], побуждая их грешить перед Господом.


    7 И мои сыновья сблизятся с Левием и будут грешить вместе с ними во всём. А сыновья Иуды, охваченные алчностью, будут, словно львы, похищать чужое.


    8 Поэтому вас вместе с ними[c] уведут в плен, и там вы испытаете все египетские казни и всё зло народов.


    9 И тогда, обратившись к Господу, вы будете помилованы: Он приведёт вас в Своё святилище и даст вам мир.


    10 И для вас из племени Иуды и Левия[d] взойдёт спасение Господа. Ибо сам он вступит в войну с Велиаром и дарует вашим отцам отмщение победы[e].


    11 Он отнимет у Велиара пленников — души святых[f], — обратит непокорные сердца к Господу и даст вечный мир тем, кто призывает Его.


    12 Святые обретут покой в Эдеме, а праведники возрадуются о новом Иерусалиме[g], который есть вечная слава Бога.


    13 Иерусалим уже не подвергнется опустошению, и Израиль больше не будет уведён в плен, потому что Господь будет посреди него, а Святой Израилев будет царствовать над ним.[h]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Упоминание «книги праведного Еноха» прямо присутствует в греческом тексте и, вероятно, отсылает к енохическим преданиям эпохи Второго храма.
    reason: cross_reference
  - marker: b
    text: Греческий текст в этом месте повреждён или неясен. Буквально он может означать, что духи будут «присутствовать при» сынах Левия или «служить при» них.
    reason: textual_variant
  - marker: c
    text: Слова «вместе с ними», связывающие пленение с Левием и Иудой, присутствуют не во всех свидетельствах.
    reason: textual_variant
  - marker: d
    text: Слова «Иуды и» текстуально неустойчивы; однако чтение о происхождении спасения одновременно из Иуды и Левия хорошо засвидетельствовано в традиции.
    reason: textual_variant
  - marker: e
    text: Чтение «вашим отцам» в греческом тексте сомнительно; выражение «отмщение победы» сохранено без попытки устранить его необычность догадкой.
    reason: textual_variant
  - marker: f
    text: Слова «души святых» текстуально неустойчивы, но поясняют, что освобождение из плена Велиара касается людей.
    reason: textual_variant
  - marker: g
    text: «Новый Иерусалим» — эсхатологический образ восстановленного и прославленного Сиона, а не просто исторического города в его нынешнем состоянии.
    reason: cultural_note
  - marker: h
    text: Некоторые свидетельства добавляют, что Господь будет жить среди людей, а Святой Израилев — царствовать в смирении и бедности; далее говорится, что верующий в Него будет истинно царствовать среди людей. Эти фразы часто считают позднейшим расширением, поэтому они не включены в основной текст.
    reason: textual_variant
lexical_decisions:
- source_word: φυλάξατε / τηρήσατε
  choice: храните / соблюдайте
  rationale: Передаёт параллелизм двух близких глаголов без механического повтора и естественно сочетается с «заповедью» и «законом».
- source_word: θυμός
  choice: гнев
  rationale: Ясное современное обозначение нравственно опасной страсти в наставительном контексте.
- source_word: ψεῦδος
  choice: ложь
  rationale: Обозначает не отдельное ложное высказывание, а ложь как порок, противопоставленный правдивой речи.
- source_word: Βελίαρ
  choice: Велиар
  rationale: Сохранена греческая форма имени в данном свидетельстве, без замены на более привычную еврейскую форму «Велиал».
- source_word: μῆνις / ταραχαί
  choice: ярость / смуты
  rationale: «Ярость» сильнее «гнева» в стихе 1, а множественное «смуты» передаёт общественные потрясения, а не только внутреннее беспокойство.
- source_word: παρατάξεσθε
  choice: выстроитесь на битву
  rationale: Сохранён явный военный образ греческого глагола, но выражение остаётся понятным современному читателю.
- source_word: τὸ σωτήριον Κυρίου
  choice: спасение Господа
  rationale: Средний род греческого выражения обозначает «спасение», а не однозначно личного «Спасителя»; местоимения далее согласованы с этим открытым чтением.
- source_word: κατισχύσει
  choice: одолеет
  rationale: Естественно передаёт превосходство и победу в контексте войны.
theological_decisions:
- issue: Сатана и духи зла в стихах 5–7
  choice: Сверхъестественные силы названы прямо, как в греческом свидетельстве.
  alternative: Истолковать их как олицетворение дурных склонностей.
  rationale: Текст соединяет нравственное наставление с явной демонологической картиной; перевод не должен сводить её к метафоре.
- issue: «Спасение Господа» из Иуды и Левия в стихе 10
  choice: Сохранено безличное и неоднозначное «спасение Господа», а дальнейшие местоимения относятся к слову «спасение».
  alternative: Перевести как личный титул «Спаситель Господа» или прямо отождествить фигуру с определённым позднейшим учением.
  rationale: Греческое τὸ σωτήριον допускает персонифицированное понимание, но грамматически означает «спасение»; перевод сохраняет эту богословскую напряжённость.
- issue: Текстуально неустойчивые эсхатологические фразы в стихах 10–13
  choice: Краткие варианты, важные для связности, отмечены сносками; расширенное окончание стиха 13 не включено в основной текст.
  alternative: Включить все заключённые в скобки расширения либо удалить весь раздел как вторичный.
  rationale: Так читатель видит и основной ход текста, и реальную нестабильность рукописной традиции без скрытой гармонизации.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксис по возможности прямой и доступный; военные, нравственные и эсхатологические образы сохранены. Местоимения, относящиеся к Господу, написаны с прописной буквы по принятой русской религиозной издательской традиции; местоимения при «спасении» в стихах 10–11 также выделены прописной буквой из-за тесной связи с божественным действием, но перевод не превращает неоднозначное греческое выражение в однозначный личный титул.
