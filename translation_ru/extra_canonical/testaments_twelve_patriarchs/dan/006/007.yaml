  text: And his name will be in every place in Israel and among the nations.
translation:
  language: ru
  text: И имя его будет во всяком месте Израиля и среди народов.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «и среди народов» имеют текстовые разночтения в греческой рукописной традиции.
    reason: В исходном издании эта часть отмечена критическими скобками, указывающими на неустойчивость текста.
lexical_decisions:
- source_word: Τὸ δὲ ὄνομα αὐτοῦ
  choice: И имя его
  rationale: Частица δέ передана нейтральным связующим «и»; «имя» сохранено буквально, без истолкования как славы или известности.
- source_word: ἐν παντὶ τόπῳ Ἰσραήλ
  choice: во всяком месте Израиля
  rationale: Сохранена конкретная пространственная формулировка греческого текста; более свободное «по всему Израилю» было бы естественнее, но менее точно передавало бы πᾶς τόπος.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: среди народов
  rationale: ἔθνη здесь обозначает народы вне Израиля; «среди народов» звучит современно и не вводит конфессионально окрашенного термина «язычники».
theological_decisions:
- issue: Отсутствие выраженной связки и времени в греческой именной конструкции
  choice: будет
  alternative: есть / станет известным
  rationale: Будущее «будет» восполняет подразумеваемую связку в соответствии с пророческим контекстом и консультационным переводом, не добавляя идеи известности, которой прямо нет в греческом тексте.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским звучанием. Синтаксис близок к греческому, но понятен обычному читателю.
