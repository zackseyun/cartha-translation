  source_fidelity: 'Текст точно передаёт греческое Τὸ δὲ ὄνομα αὐτοῦ ἐν παντὶ τόπῳ Ἰσραὴλ καὶ ἐν τοῖς ἔθνεσιν: сохранены «имя», всеохватность «во всяком месте», Израиль и добавление «среди народов». Будущее «будет» оправдано контекстуально и согласуется с английским контрольным переводом, хотя в данном греческом фрагменте связка не выражена.'
