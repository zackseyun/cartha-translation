source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἐγγίσατε⁴ τῷ θεῷ καὶ τῷ ἀγγέλῳ *τῷ παραιτουμένῳ ὑμᾶς⁵· ὅτι οὗτός ἐστι μεσίτης θεοῦ καὶ ἀνθρώπων καὶ⁶ ἐπὶ τῆς εἰρήνης τοῦ⁷ Ἰσραὴλ κατέναντι⁸ *τῆς βασιλείας τοῦ †θεοῦ στήσεται⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/002.yaml
  text: Draw near to God and to the angel who intercedes for you, for he is a mediator between God and men[a], and for the peace of Israel he will stand against the kingdom of the enemy.
translation:
  language: ru
  text: Приблизьтесь к Богу и к ангелу, который ходатайствует за вас, ибо он — посредник между Богом и людьми[a] и ради мира Израиля встанет пред Царством Божьим[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «посредник между Богом и людьми» непосредственно передаёт греческий текст. Поскольку в этом же предложении речь идёт об «ангеле», перевод не отождествляет его с какой-либо позднейшей доктринальной фигурой.
    reason: lexical_alternative
  - marker: b
    text: Греческое чтение «пред Царством Божьим» отмечено в издании как текстуально сомнительное. Предлог может означать как «перед, пред лицом», так и «напротив, против»; чтение «против царства врага» представляет иную реконструкцию и в данном тексте буквально не засвидетельствовано.
    reason: textual_variant
lexical_decisions:
- source_word: Ἐγγίσατε
  choice: Приблизьтесь
  rationale: Передаёт повелительное наклонение аориста во множественном числе и естественно звучит в современном литературном русском.
- source_word: τῷ ἀγγέλῳ τῷ παραιτουμένῳ ὑμᾶς
  choice: к ангелу, который ходатайствует за вас
  rationale: παραιτέομαι в данном контексте понимается как просьба или заступничество; добавление «остаётся с вами» не имеет опоры в приведённом греческом тексте.
- source_word: μεσίτης θεοῦ καὶ ἀνθρώπων
  choice: посредник между Богом и людьми
  rationale: Естественная русская передача греческой конструкции, сохраняющая прямое обозначение ангела как посредника.
- source_word: κατέναντι … στήσεται
  choice: встанет пред
  rationale: κατέναντι допускает значения «напротив», «перед, пред лицом»; «пред» сохраняет пространственно-реляционную неопределённость и не вынуждает понимать действие как враждебное Богу.
- source_word: τῆς βασιλείας τοῦ θεοῦ
  choice: Царством Божьим
  rationale: Следует приведённому греческому чтению «Царства Бога», несмотря на его текстовую помету и отличающееся чтение консультационного английского перевода.
theological_decisions:
- issue: Ангел назван посредником между Богом и людьми
  choice: Сохранить это обозначение без отождествления ангела с какой-либо иной фигурой
  alternative: Истолковать посредника как позднейшую доктринальную фигуру
  rationale: Греческий текст прямо продолжает говорить об «ангеле»; перевод не должен устранять сохраняющееся в источнике богословское напряжение.
- issue: Отношение ангела к Царству Божьему
  choice: «встанет пред Царством Божьим»
  alternative: «встанет против царства врага» или «встанет против Царства Божьего»
  rationale: В предоставленном греческом тексте стоит «Бога», а не «врага». Значение «пред» для κατέναντι позволяет не приписывать ангелу враждебность Богу, одновременно не заменяя текст неподтверждённой конъектурой.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским регистром. Форма «пред» выбрана ради краткости и для сохранения неоднозначности κατέναντι; архаичная синтаксическая тяжеловесность избегается.
