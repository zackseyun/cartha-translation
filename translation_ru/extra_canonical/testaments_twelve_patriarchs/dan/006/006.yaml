  text: But in the time of Israel’s lawlessness, the Lord will not depart from them, but will pass over to a nation that seeks his will, for none of the angels will be equal to him[a].
translation:
  language: ru
  text: Но во время беззакония Израиля Господь не отступит от них, но перейдёт к народу, который ищет Его воли, ибо никто из ангелов не будет равен Ему.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческая фраза трудна для понимания: в представленном тексте сказано, что Господь «не отступит от них», и вместе с тем — что Он «перейдёт к народу, который ищет Его воли». Перевод сохраняет это напряжение, не сглаживая его.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνομίας
  choice: беззакония
  rationale: Передаёт нарушение Божьего закона и сохраняет нравственно-религиозный оттенок греческого слова.
- source_word: ἀφιστάμενος ἀπ᾽ αὐτῶν
  choice: не отступит от них
  rationale: Сохраняет явное отрицание в представленном греческом тексте и не устраняет возникающее напряжение со следующей фразой.
- source_word: μετελεύσεται ἐπ᾽ ἔθνει
  choice: перейдёт к народу
  rationale: Естественно передаёт направленное движение к другому народу, не уточняя сверх текста характер этого перехода.
- source_word: ζητοῦντι τὸ θέλημα αὐτοῦ
  choice: который ищет Его воли
  rationale: Сохраняет активный смысл ζητεῖν и возвышенный, но понятный русский оборот.
- source_word: οὐδεὶς τῶν ἀγγέλων ἔσται ἴσος αὐτῷ
  choice: никто из ангелов не будет равен Ему
  rationale: Прямо сохраняет сравнительное утверждение греческого текста и неоднозначность референта местоимения.
theological_decisions:
- issue: Соотношение слов «не отступит от них» и «перейдёт к народу»
  choice: Обе формулировки сохранены без согласования или поясняющей вставки.
  alternative: Исправить отрицание либо истолковать переход как оставление Израиля.
  rationale: Представленный греческий текст содержит смысловое напряжение; перевод не должен молча устранять его на основании богословского предположения.
- issue: Референт αὐτῷ в заключительной фразе
  choice: Местоимение передано как «Ему» без дополнительного названия.
  alternative: Явно написать «Господу» или отнести местоимение к народу.
  rationale: Наиболее естественный ближайший богословский референт — Господь, однако формальная местоименная конструкция сохраняет структуру и некоторую неоднозначность оригинала.
translation_notes:
  register: Современный литературный русский язык с достоинством, уместным для древнего религиозного текста. Синтаксис сделан ясным для широкого читателя; традиционные слова «беззаконие» и «Господь» сохранены как точные и общеупотребительные в библейском контексте.
