base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/010.yaml
  text: Therefore depart from all unrighteousness and cling to the righteousness of God, and your offspring will be for salvation forever. And bury me near my fathers.
translation:
  language: ru
  text: Итак, отступите от всякой неправедности и прилепитесь к праведности Бога, и ваш род будет ко спасению вовек. И похороните меня рядом с моими отцами.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπόστητε
  choice: отступите
  rationale: Передаёт повеление удалиться и решительно отказаться от неправедности.
- source_word: κολλήθητε
  choice: прилепитесь
  rationale: Сохраняет сильный образ тесной и постоянной приверженности, характерный для библейского языка.
- source_word: τῇ δικαιοσύνῃ τοῦ Θεοῦ
  choice: к праведности Божьей
  rationale: 'Сохраняет родительный оборот и его возможную смысловую широту: Божья праведность или праведность, исходящая от Бога.'
- source_word: τὸ γένος ὑμῶν
  choice: ваш род
  rationale: γένος здесь естественно обозначает род, потомство или линию потомков; «ваш род» сохраняет коллективный оттенок.
- source_word: εἰς σωτηρίαν ἕως τοῦ αἰῶνος
  choice: будет спасён навеки
  rationale: Естественная русская передача результата/предназначения «к спасению» и временного выражения «вовек».
- source_word: ἐγγὺς τῶν πατέρων μου
  choice: рядом с моими отцами
  rationale: Сохраняет древний семейно-погребальный смысл слова «отцы», не заменяя его более узким «предки».
theological_decisions:
- issue: Значение выражения «праведность Божья»
  choice: Сохранён прямой родительный оборот без пояснения.
  alternative: «праведность, которую даёт Бог» или «праведный путь Бога»
  rationale: Греческий текст не уточняет вид связи; перевод не должен устранять возможную богословскую многозначность.
- issue: Связь рода со спасением
  choice: «ваш род будет спасён навеки»
  alternative: «ваш род будет служить спасению навеки» или «будет предназначен для спасения»
  rationale: εἰς σωτηρίαν допускает оттенок направленности или результата; выбранная формулировка естественна по-русски, хотя слегка конкретизирует синтаксис.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. «Прилепитесь» и «отцы» сохранены как понятные устойчивые библейские слова; архаичные формы и тяжёлый буквальный синтаксис исключены.
