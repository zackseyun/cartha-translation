  source_fidelity: 'В первой части передача в целом точна: повеления Ἀπόστητε и κολλήθητε, а также образ «праведности Бога» сохранены. Однако «ваш род будет спасён навеки» преобразует εἰς σωτηρίαν («ко/для спасения») в прямое утверждение о состоянии спасённости и тем самым сужает синтаксическую и смысловую направленность оригинала.'
