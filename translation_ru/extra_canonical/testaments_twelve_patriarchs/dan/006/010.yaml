  terminology: «Праведность Бога» непосредственно воспроизводит τοῦ Θεοῦ и сохраняет открытую генитивную связь без конфессионального истолкования. «Род» хорошо передаёт γένος; «отцы» оправдано для πατέρες в контексте семейного погребения.
