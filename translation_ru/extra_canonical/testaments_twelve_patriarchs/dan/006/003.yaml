  text: Because of this the enemy is eager to trip up all who call on the Lord.
translation:
  language: ru
  text: Поэтому враг старается подставить подножку всем, кто призывает Господа.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Поэтому
  rationale: Естественно и точно передаёт причинно-следственную связь «по этой причине».
- source_word: σπουδάζει
  choice: старается
  rationale: Передаёт усердное, настойчивое стремление; «спешит» здесь звучало бы слишком буквально и менее естественно.
- source_word: ὁ ἐχθρός
  choice: враг
  rationale: Сохраняет определённое обозначение противника без добавочного толкования его личности.
- source_word: ὑποσκελίζειν
  choice: сбить с пути
  rationale: Глагол буквально связан с подножкой и падением, а переносно означает заставить оступиться или привести к падению; выбранная формулировка ясна современному читателю и сохраняет нравственно-духовный смысл.
- source_word: τοὺς ἐπικαλουμένους τὸν Κύριον
  choice: тех, кто призывает Господа
  rationale: Устойчивая библейская формулировка, точно передающая обращение к Господу в молитве или исповедании.
theological_decisions:
- issue: Личность «врага»
  choice: Сохранено слово «враг» без пояснения
  alternative: «дьявол» или «сатана»
  rationale: Греческий текст прямо не называет врага дьяволом; уточнение неоправданно устранило бы возможную неоднозначность.
- issue: Смысл ὑποσκελίζειν
  choice: «сбить с пути»
  alternative: «поставить подножку», «заставить пасть»
  rationale: Перевод сохраняет образ духовного противодействия, не уточняя, идёт ли речь исключительно о грехопадении, отступничестве или иной неудаче.
translation_notes:
  register: Современный литературный русский язык; краткая, dignified библейская фраза без архаизмов и конфессиональных добавлений.
