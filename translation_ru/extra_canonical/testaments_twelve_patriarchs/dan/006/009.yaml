  text: Καὶ ἃ ἠκούσατε³⁸ παρὰ τοῦ πατρὸς ὑμῶν, μεταδοτε³⁹ ⌈καὶ⁴⁰ ὑμεῖς⁴¹⌉ τοῖς τέκνοις ὑμῶν⁴², [ἵνα δέξηται⁴³ ὑμᾶς ὁ Σωτὴρ⁴⁴ τῶν ἐθνῶν· *ἐστὶ γὰρ ἀληθὴς καὶ μακρόθυμος, πρᾷος καὶ ταπεινός⁴⁵, καὶ⁴⁶ ἐκδιδάσκων⁴⁷ διὰ τῶν ἔργων *τὸν νόμον Κυρίου⁴⁸].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/009.yaml
  text: And what you have heard from your father, pass on also to your children, so that the Savior of the nations may receive you; for he is true and patient, gentle and humble, and by his works he teaches the law of the Lord[a].
translation:
  language: ru
  text: И то, что вы слышали от вашего отца, передайте и вы своим детям, [чтобы Спаситель народов принял вас, ибо он истинен и долготерпелив, кроток и смирен и своими делами преподаёт закон Господа].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Заключённое в квадратные скобки предложение нередко считают позднейшим расширением или вставкой; здесь оно переведено, поскольку присутствует в предоставленном греческом свидетельстве.
    reason: textual_variant
lexical_decisions:
- source_word: μετάδοτε
  choice: передайте
  rationale: Повелительная форма естественно передаёт призыв сообщить детям полученное от отца наставление.
- source_word: ὁ Σωτὴρ τῶν ἐθνῶν
  choice: Спаситель народов
  rationale: Сохраняет прямое значение родительного оборота и возможный универсальный охват ἐθνῶν.
- source_word: μακρόθυμος
  choice: долготерпелив
  rationale: Традиционное и точное русское соответствие, передающее терпеливую сдержанность и выдержку.
- source_word: ἐκδιδάσκων διὰ τῶν ἔργων
  choice: Своими делами учит
  rationale: Передаёт инструментальное значение διὰ и смысл обучения посредством совершаемых дел.
- source_word: τὸν νόμον Κυρίου
  choice: закону Господа
  rationale: Дательный падеж после русского «учит» естественно передаёт греческий объект обучения без богословского уточнения.
theological_decisions:
- issue: Референт местоимения в описании Спасителя
  choice: Он / Своими с прописной буквы
  alternative: он / своими со строчной буквы
  rationale: В современном русском библейском регистре прописная буква ясно связывает местоимения с титулом «Спаситель», не добавляя нового содержания.
- issue: Текстуальный статус заключительной части стиха
  choice: Перевести весь засвидетельствованный греческий текст и обозначить квадратными скобками с примечанием
  alternative: Опустить предполагаемую позднюю вставку
  rationale: Предоставленный греческий свидетель содержит этот материал, но редакционные скобки и текстологическое примечание сохраняют сведения о его спорном статусе.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным библейским регистром. Синтаксическая связь целевого оборота с повелением сохранена; квадратные скобки отражают текстологическую разметку источника.
