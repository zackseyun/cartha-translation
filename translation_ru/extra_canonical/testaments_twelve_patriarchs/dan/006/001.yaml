source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: VI. Καὶ νῦν *φοβήθητε τὸν Κύριον¹, τέκνα μου, καὶ προσέχετε ἑαυτοῖς² ἀπὸ τοῦ Σατανᾶ καὶ *τῶν πνευμάτων³ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/001.yaml
  text: And now, my children, fear the Lord, and watch yourselves against Satan and his spirits.
translation:
  language: ru
  text: И теперь, дети мои, бойтесь Господа и берегитесь сатаны и его духов.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβήθητε
  choice: бойтесь
  rationale: Прямо передаёт повеление испытывать благоговейный страх перед Господом, не сводя его лишь к почтению.
- source_word: προσέχετε ἑαυτοῖς ἀπό
  choice: берегитесь
  rationale: Естественный русский способ передать призыв быть настороже и ограждать себя от опасности.
- source_word: Σατανᾶ
  choice: сатаны
  rationale: Устоявшееся русское соответствие греческому личному наименованию; строчная буква допустима как традиционное обозначение противника.
- source_word: τῶν πνευμάτων αὐτοῦ
  choice: его духов
  rationale: Сохраняет буквальную множественность и принадлежность, не уточняя природу духов сверх исходного текста.
theological_decisions:
- issue: Значение страха перед Господом
  choice: бойтесь Господа
  alternative: почитайте Господа
  rationale: Исходный глагол φοβέομαι обозначает страх; более мягкий вариант устранил бы присутствующее в тексте напряжение.
- issue: Статус духов сатаны
  choice: его духов
  alternative: злых духов
  rationale: Определение «злых» подразумевается контекстом, но отсутствует в греческом тексте, поэтому не добавлено.
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная отцовская заповедь. Синтаксис естественный, при этом параллель двух повелений сохранён.
