  source_fidelity: 'Текст точно передаёт оба греческих повеления: φοβήθητε передано как «бойтесь», а προσέχετε ἑαυτοῖς ἀπό — естественным русским «берегитесь». Сохранены адресат («дети мои»), «Господь», Сатана и множественное «его духи». Добавочных характеристик духов не внесено.'
