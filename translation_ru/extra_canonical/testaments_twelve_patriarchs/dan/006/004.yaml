id: T12P.DAN.6.4
reference: Testament of Dan 6:4
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Οἶδε γὰρ ὅτι *ἐν ᾗ ἡμέρᾳ¹³ ἐπιστρέψει¹⁴ Ἰσραήλ, συντελεσθήσεται ἡ βασιλεία τοῦ ἐχθροῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/004.yaml
  text: For he knows that on the day when Israel turns back, the kingdom of the enemy will be brought to an end.
translation:
  language: ru
  text: Ведь он знает, что в тот день, когда Израиль обратится, царству врага придёт конец.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψει
  choice: обратится
  rationale: Глагол передаёт возвращение или обращение Израиля; «обратится» естественно по-русски и сохраняет возможный духовно-нравственный смысл без его излишнего уточнения.
- source_word: συντελεσθήσεται
  choice: придёт конец
  rationale: Пассивная форма означает завершение или прекращение; русское выражение точно и естественно передаёт итог, не уточняя прямо действующее лицо.
- source_word: ἡ βασιλεία τοῦ ἐχθροῦ
  choice: царству врага
  rationale: «Царство врага» формально сохраняет родительный оборот и не отождествляет врага с конкретной фигурой сверх того, что сказано в источнике.
theological_decisions:
- issue: Характер обращения Израиля
  choice: Израиль обратится
  alternative: Израиль вернётся
  rationale: Греческое ἐπιστρέφω допускает и возвращение, и обращение. «Обратится» сохраняет религиозный оттенок контекста, но не добавляет явно не названного объекта обращения.
- issue: Кто прекращает царство врага
  choice: царству врага придёт конец
  alternative: царство врага будет положено конец / будет уничтожено
  rationale: Источник использует пассивную форму и не называет деятеля; безличное русское выражение сохраняет эту неопределённость и не усиливает значение до «уничтожения».
translation_notes:
  register: Современный литературный русский язык; краткая, торжественная и общедоступная формулировка. Причинное γάρ передано словом «ведь», а конструкция ἐν ᾗ ἡμέρᾳ — естественным оборотом «в тот день, когда».
