  source_fidelity: Текст точно передаёт греческую причинную связь γάρ, временную конструкцию ἐν ᾗ ἡμέρᾳ и будущее значение обоих глаголов. «Обратится» обоснованно сохраняет возможные значения ἐπιστρέψει («вернётся/обратится») без добавления объекта или конфессионального толкования. «Царству врага придёт конец» естественно передаёт συντελεσθήσεται, не называя деятеля и не усиливая значение до уничтожения.
