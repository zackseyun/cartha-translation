base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/008.yaml
  text: Keep yourselves, then, my children, from every evil work, and cast away from yourselves anger and falsehood, and love truth and patience.
translation:
  language: ru
  text: Итак, дети мои, храните себя от всякого злого дела, отбросьте от себя гнев и ложь и любите истину и долготерпение.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διατηρήσατε ... ἑαυτούς
  choice: храните себя
  rationale: Передаёт усиленное значение глагола διατηρέω — тщательно оберегать, сохранять — вместе с возвратным местоимением.
- source_word: τέκνα μου
  choice: дети мои
  rationale: Естественное и точное обращение в современном литературном русском языке.
- source_word: ἀπὸ παντὸς ἔργου πονηροῦ
  choice: от всякого злого дела
  rationale: Сохраняет конкретное значение ἔργον как поступка или дела и нравственную характеристику πονηρός.
- source_word: ἀπορρίψατε ἀφ᾽ ὑμῶν
  choice: отвергните
  rationale: Русский глагол передаёт образ решительного удаления от себя без тяжеловесного повтора «отбросьте от себя».
- source_word: τὸν θυμὸν
  choice: гнев
  rationale: В данном нравственном перечне θυμός обозначает вспыльчивый гнев или ярость; «гнев» наиболее естественен и достаточно широк.
- source_word: τὸ ψεῦδος
  choice: ложь
  rationale: Прямой эквивалент, сохраняющий общее значение неправды и обмана.
- source_word: τὴν ἀλήθειαν
  choice: истину
  rationale: Точно передаёт ἀλήθεια, не сужая его до одной лишь правдивости речи.
- source_word: τὴν μακροθυμίαν
  choice: долготерпение
  rationale: Передаёт стойкое, длительное терпение и сдержанность перед лицом провокации; «терпение» было бы более общим.
theological_decisions:
- issue: Значение μακροθυμία
  choice: долготерпение
  alternative: терпение
  rationale: Сохранён характерный нравственно-богословский оттенок длительной выдержки и медленности на гнев без привнесения конфессионального толкования.
translation_notes:
  register: Современный литературный русский с достоинством завещательного наставления. Синтаксис сделан плавным, а противопоставление «гнев и ложь» — «истина и долготерпение» подчёркнуто союзом «а». Квадратные примечания не требуются.
