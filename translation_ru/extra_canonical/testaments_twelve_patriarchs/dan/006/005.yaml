  text: For he himself, the angel of peace, will strengthen Israel so that it will not fall into uttermost evils.
translation:
  language: ru
  text: Ибо сам ангел мира укрепит Израиль, чтобы тот не впал в крайние бедствия[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «в конец (до предела) зол/бедствий». Греческое выражение может означать как крайние бедствия, так и предельное зло.'
    reason: Уточняет форму и предельный смысл εἰς τέλος κακῶν, сохраняя неоднозначность κακῶν без изменения основного текста.
lexical_decisions:
- source_word: Αὐτὸς
  choice: сам
  rationale: 'Передаёт эмфатическое выделение подлежащего: именно сам ангел мира укрепит Израиль.'
- source_word: ὁ ἄγγελος τῆς εἰρήνης
  choice: ангел мира
  rationale: Прямое и естественное соответствие греческому выражению; сохраняет достоинство и краткость оригинала.
- source_word: ἐνισχύσει
  choice: укрепит
  rationale: Будущее время и значение усиления или придания сил переданы непосредственно.
- source_word: μὴ ἐμπεσεῖν αὐτὸν
  choice: чтобы тот не впал
  rationale: Инфинитив цели или результата естественно передан русским придаточным; «тот» ясно отсылает к Израилю и избегает ошибочной отсылки к ангелу.
- source_word: εἰς τέλος κακῶν
  choice: в крайние бедствия
  rationale: Передаёт идею предельной тяжести; «бедствия» уместно выражает возможное значение κακά в данном контексте, а неоднозначность отмечена в сноске.
theological_decisions:
- issue: К кому относится αὐτόν
  choice: 'к Израилю: «чтобы тот не впал»'
  alternative: 'к ангелу: «чтобы он не впал»'
  rationale: Местоимение мужского рода грамматически может отсылать к Израилю; синтаксис и смысл укрепления Израиля делают эту связь наиболее естественной.
- issue: Значение κακῶν
  choice: «бедствия» в основном тексте
  alternative: «зло», «злые дела» или буквально «зла»
  rationale: Греческое κακά допускает как нравственное зло, так и несчастья или бедствия. Контекст укрепления Израиля поддерживает значение тяжёлых бедствий, однако иной оттенок не исключён и отражён в сноске.
translation_notes:
  register: Современный литературный русский язык с кратким, возвышенным библейским звучанием. Формулировка остаётся понятной широкому читателю; неоднозначность заключительной греческой конструкции вынесена в сноску.
