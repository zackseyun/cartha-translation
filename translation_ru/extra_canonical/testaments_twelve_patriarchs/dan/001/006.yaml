base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/006.yaml
  text: For the spirit of jealousy and arrogance kept saying to me, ‘You yourself also are his son.’
translation:
  language: ru
  text: 'Ибо дух ревности и высокомерия твердил мне: «Ведь и ты сам — его сын».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα
  choice: дух
  rationale: Прямое соответствие греческому слову; сохраняет представление о действующей духовной силе, не сводя его к чувству или настроению.
- source_word: ζήλου
  choice: ревности
  rationale: В данном контексте ζῆλος обозначает завистливую ревность; «ревность» сохраняет присущую исходному слову смысловую широту.
- source_word: ἀλαζονείας
  choice: высокомерия
  rationale: Передаёт хвастливую самонадеянность и надменность, выражаемые ἀλαζονεία, естественным современным русским словом.
- source_word: ἔλεγέ μοι
  choice: твердил мне
  rationale: Имперфект указывает на продолжавшееся или повторявшееся внушение; «твердил» естественно передаёт эту аспектуальную силу.
- source_word: Καίγε σὺ αὐτὸς
  choice: Ведь и ты сам
  rationale: Сохраняет усиление καίγε и эмфатическое σὺ αὐτός, подчёркивающее, что сам Дан также является сыном того же отца.
theological_decisions:
- issue: Характер «духа ревности и высокомерия»
  choice: Сохранена личностно звучащая формулировка «дух… твердил»
  alternative: 'Передать как внутреннее чувство или побуждение: «ревность и высокомерие подсказывали мне»'
  rationale: Греческий текст прямо называет πνεῦμα и приписывает ему речь; перевод не должен заранее решать, идёт ли речь об отдельном духовном существе, персонифицированной силе или внутреннем воздействии.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью. Частица «ведь» передаёт убеждающе-подстрекательный оттенок реплики, а тире естественно выделяет именную часть сказуемого и усиление «ты сам».
