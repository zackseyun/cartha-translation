source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ἐγὼ¹⁸ ἐπείρασα ἐν καρδίᾳ μου¹⁹ καὶ²⁰ ἐν πάσῃ²¹ ζωῇ μου²², ὅτι καλὸν²³ *καὶ θεῷ εὐάρεστον ἡ ἀλήθεια²⁴ μετὰ δικαιοπραγίας²⁵ *καὶ ⸀ὅτι⸁ πονηρὸν τὸ ψεῦδος²⁶ καὶ ὁ θυμὸς²⁷ πᾶσαν κακίαν *ἐκδιδάσκοντα τὸν ἄνθρωπον²⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/003.yaml
  text: I have tested in my heart and in all my life that truth with righteous conduct is good and pleasing to God, and that falsehood and anger are evil, teaching a person every wickedness.
translation:
  language: ru
  text: Я испытал в своём сердце и во всей своей жизни, что истина вместе с праведными поступками добра и угодна Богу, а ложь и гнев — зло, научающее человека всякому злу.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείρασα
  choice: испытал
  rationale: Передаёт проверку и познание на личном опыте, сохраняя образный язык сердца и жизни.
- source_word: ἡ ἀλήθεια μετὰ δικαιοπραγίας
  choice: истина вместе с праведными поступками
  rationale: Сохраняет сочетание истины с практическим праведным поведением; δικαιοπραγία обозначает совершение праведных дел, а не абстрактную праведность.
- source_word: ὁ θυμός
  choice: гнев
  rationale: В данном нравственном контексте обычное значение — гнев или ярость; «гнев» естественно и достаточно широко.
- source_word: πᾶσαν κακίαν
  choice: всякому нечестию
  rationale: Передаёт нравственное зло как совокупность порочных проявлений и естественно сочетается с глаголом «научать».
- source_word: ἐκδιδάσκοντα
  choice: научающее
  rationale: Сохраняет усиленное значение наставления или обучения; причастие согласовано с совокупным понятием «ложь и гнев — зло».
theological_decisions:
- issue: Соотношение истины и праведных дел
  choice: «истина вместе с праведными поступками»
  alternative: «истина, сопровождаемая праведностью»
  rationale: Греческое μετὰ не определяет точнее характер связи; буквальное «вместе с» сохраняет эту открытость и не превращает праведные поступки лишь в следствие истины.
- issue: Число и синтаксическая связь в заключительной части
  choice: «ложь и гнев — зло, научающее…»
  alternative: «ложь и гнев злы и учат…»
  rationale: В греческом πονηρόν и ἐκδιδάσκοντα стоят в единственном числе и могут характеризовать ложь и гнев как единое зло; русский текст сохраняет эту грамматическую особенность без догматического уточнения.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной нравственной речи. Синтаксис близок к греческому, но естественен для широкого читателя; архаизмы и конфессионально окрашенные формулы исключены.
