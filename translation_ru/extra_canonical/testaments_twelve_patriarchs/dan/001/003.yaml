revisions:
- from: Я испытал в своём сердце и всей своей жизнью, что истина вместе с праведными поступками добра и угодна Богу, а ложь и гнев — зло, научающее человека всякому нечестию.
  to: Я испытал в своём сердце и во всей своей жизни, что истина вместе с праведными поступками добра и угодна Богу, а ложь и гнев — зло, научающее человека всякому злу.
  rationale: 'Исправлены две безопасные лексико-синтаксические неточности: обстоятельство жизни передано предложным, а не инструментальным оборотом; κακία передана широким нравственным термином «зло». Сохранены исходные смысловые связи, регистр и синтаксическая возможность понимать ложь и гнев как единое злое начало.'
