base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/002.yaml
  text: Hear my words, sons of Dan, and pay attention to the words of your father.
translation:
  language: ru
  text: 'Ибо, собрав свою семью, он сказал: «Слушайте мои слова, сыновья Дана, и внимайте словам вашего отца».'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν πατρίαν αὐτοῦ
  choice: своих родных
  rationale: В данном контексте πατριά обозначает семью или род; «своих родных» естественно передаёт собранных Даном членов семьи, не сужая значение до одних сыновей.
- source_word: ᾿Ακούσατε
  choice: Слушайте
  rationale: Повелительная форма аориста призывает адресатов выслушать последующее наставление; «слушайте» ясно и естественно по-русски.
- source_word: υἱοὶ Δάν
  choice: сыновья Дана
  rationale: Сохранена форма обращения исходного текста — буквально «сыновья Дана»; современное «сыновья» предпочтено более архаичному «сыны».
- source_word: προσέχετε
  choice: внимайте
  rationale: Глагол выражает сосредоточенное внимание к сказанному; «внимайте» сохраняет торжественный, но понятный литературный регистр.
- source_word: λόγων μου / ῥήμασι τοῦ πατρὸς ὑμῶν
  choice: мои слова / речам вашего отца
  rationale: Различение «слова» и «речи» отражает два греческих обозначения речи без навязывания существенной смысловой разницы между ними.
