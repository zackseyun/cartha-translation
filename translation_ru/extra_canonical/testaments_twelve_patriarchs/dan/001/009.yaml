    issue: Неверная сфера отрицания в «чтобы я ... не убил его и не привёл».
    rationale: Греческий текст не отрицает убийство и последствие внутри придаточного. Он сообщает, что Бог предотвратил ситуацию, в которой Дан совершил бы эти действия. Русская формулировка с «не убил» выражает противоположную логику.
  - severity: medium
    issue: Сноска передаёт λυθῆναι только через «упразднён» в буквальной цитате.
    rationale: Для λυθῆναι невозможно с уверенностью закрепить один оттенок; в примечании нужны также «развязан» и «распался», тогда как «уничтожение» остаётся контекстуальным толкованием в основном тексте.
