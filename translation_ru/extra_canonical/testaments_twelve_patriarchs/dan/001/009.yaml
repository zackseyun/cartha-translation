source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: ᾿Αλλ᾿ ὁ Θεὸς *τῶν πατέρων⁵³ μου οὐκ εἴασεν αὐτὸν ἐμπεσεῖν εἰς τὰς χεῖράς μου, ἵνα κατὰ μόνας εὑρὼν αὐτὸν ἀνελῶ, καὶ ποιήσω⁶¹ λυθῆναι σκῆπτρον δεύτερον τῷ Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/009.yaml
  text: But the God of my fathers did not allow him to fall into my hands, so that I might find him alone and kill him, and bring about the loosing of a second tribe from Israel.”
translation:
  language: ru
  text: Но Бог моих отцов не дал ему попасть мне в руки — иначе, найдя его одного, я убил бы его и тем самым погубил бы для Израиля второе колено[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «сделал бы так, чтобы для Израиля был развязан (или упразднён, распался) второй скипетр». «Скипетр», вероятно, образно обозначает колено; значение глагола допускает также мысль об отделении или распаде, а не только об уничтожении.'
    reason: Сохраняет буквальный образ σκῆπτρον и спорную семантику λυθῆναι, тогда как «второе колено» и «погубил» передают наиболее вероятный смысл в контексте.
lexical_decisions:
- source_word: ὁ Θεὸς τῶν πατέρων μου
  choice: Бог моих отцов
  rationale: Естественная и точная передача родительного оборота, сохраняющая традиционное библейское выражение.
- source_word: ἐμπεσεῖν εἰς τὰς χεῖράς μου
  choice: попасться мне в руки
  rationale: Современная русская идиома точно передаёт образ попадания во власть говорящего.
- source_word: κατὰ μόνας εὑρὼν αὐτόν
  choice: застав его одного
  rationale: 'Передаёт обстоятельственный причастный оборот: встретить или обнаружить человека без сопровождающих.'
- source_word: ἀνελῶ
  choice: убил
  rationale: В данном контексте ἀναιρέω означает лишить жизни, а не просто убрать.
- source_word: ποιήσω λυθῆναι
  choice: привёл к уничтожению
  rationale: Сохраняет каузативную конструкцию ποιέω с инфинитивом и сильное значение λυθῆναι — распад, упразднение или уничтожение.
- source_word: σκῆπτρον δεύτερον τῷ Ἰσραήλ
  choice: второго колена Израиля
  rationale: «Скипетр» здесь метонимически обозначает племенную ветвь или колено; русский перевод раскрывает референт, а буквальный образ отмечен в сноске.
theological_decisions:
- issue: Что означает «второй скипетр» и каков результат предполагаемого убийства
  choice: уничтожение второго колена Израиля
  alternative: освобождение или отпадение второго колена от Израиля; букв. «разрешение второго скипетра у Израиля»
  rationale: Греческое λυθῆναι допускает оттенки распада, упразднения и освобождения, а σκῆπτρον может метонимически обозначать колено. Контекст убийства поддерживает отрицательный результат — уничтожение, однако неоднозначность исходного образа сохранена в сноске.
- issue: Сфера отрицания при οὐκ εἴασεν ... ἵνα
  choice: Бог не позволил совершиться всей последующей цепочке действий
  alternative: 'чисто целевое прочтение: «не позволил ему попасть в мои руки, чтобы я мог…»'
  rationale: Русская конструкция «не позволил…, чтобы… не…» естественно показывает, что Божье воспрепятствование относится к убийству и его последствиям, не меняя синтаксической зависимости греческого текста.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис сделан ясным для обычного читателя; архаизмы исключены. Необычная метафора σκῆπτρον раскрыта в основном тексте как «колено», но буквально зафиксирована в сноске.
