base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/004.yaml
  text: So I confess to you today, my children, that in my heart I resolved concerning the death of Joseph my brother, that good and true man.
translation:
  language: ru
  text: 'Итак, сегодня я признаюсь вам, дети мои: в сердце своём я принял решение о смерти Иосифа, моего брата, доброго и честного человека.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμολογῶ
  choice: я признаюсь
  rationale: Передаёт личное признание в нравственно предосудительном намерении; в данном контексте естественнее современного русского «исповедую».
- source_word: ἐν καρδίᾳ μου ἐθέμην
  choice: в сердце своём я принял решение
  rationale: Сохраняет внутренний, обдуманный характер решения, выраженный сочетанием ἐν καρδίᾳ и медиальной формой τίθημι, не добавляя отсутствующих в тексте подробностей.
- source_word: περὶ τοῦ θανάτου Ἰωσήφ
  choice: о смерти Иосифа
  rationale: Формально сохраняет конструкцию с περί и не уточняет сверх греческого текста, было ли это намерением убить Иосифа лично или согласием на его смерть.
- source_word: ἀγαθοῦ ἀνδρὸς καὶ ἀληθινοῦ
  choice: человека доброго и правдивого
  rationale: «Человек» звучит естественно в современном русском и передаёт ἀνήρ без ненужной архаизации; «правдивый» здесь яснее характеризует нравственное качество, чем отвлечённое «истинный».
theological_decisions:
- issue: Степень причастности Дана к предполагаемой смерти Иосифа
  choice: Сохранена неопределённость выражением «принял решение о смерти»
  alternative: «решил убить Иосифа»
  rationale: Греческое περὶ τοῦ θανάτου указывает на смерть как предмет решения, но само по себе не обозначает прямо личное совершение убийства.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного признания. Обращение «дети мои» и инверсия «в сердце своём» поддерживают торжественный тон без чрезмерной архаики.
