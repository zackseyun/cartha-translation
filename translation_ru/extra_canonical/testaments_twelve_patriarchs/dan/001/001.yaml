  text: Testament of Dan, the seventh son of Jacob and Bilhah. A copy of the words of Dan, which he spoke to his sons in the last days of his life, in the 125th year of his life.
translation:
  language: ru
  text: 'Завещание Дана, седьмого сына Иакова и Валлы.


    1 Копия слов Дана, которые он сказал своим сыновьям в последние дни своей жизни, на сто двадцать пятом году своей жизни.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: Завещание
  rationale: В заглавии обозначает предсмертное наставление патриарха; «завещание» естественно передаёт жанр и сохраняет традиционное название произведения.
- source_word: Ἀντίγραφον λόγων
  choice: Вот запись слов
  rationale: Ἀντίγραφον буквально означает «копия, список, письменное воспроизведение». «Запись слов» звучит естественно по-русски и не создаёт лишнего акцента на поздней переписке; «вот» вводит заголовочную формулу.
- source_word: ἐπʼ ἐσχάτων τῶν ἡμερῶν αὐτοῦ
  choice: в последние дни своей жизни
  rationale: Контекстуально раскрывает местоименное «его» и передаёт устойчивый греческий оборот ясным современным русским языком.
- source_word: ἐν τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: на сто двадцать пятом году жизни
  rationale: Точно передаёт указание на текущий год жизни, не утверждая непременно, что Дану уже исполнилось 125 полных лет.
- source_word: Βάλλας
  choice: Валлы
  rationale: Использована традиционная русская библейская форма имени; родительный падеж обусловлен конструкцией «сына … Валлы».
