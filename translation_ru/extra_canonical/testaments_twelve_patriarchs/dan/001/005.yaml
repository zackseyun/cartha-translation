  text: And I rejoiced over his being sold, because his father loved him more than us.
translation:
  language: ru
  text: И я радовался его продаже, потому что отец любил его больше, чем нас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχαιρον ἐπὶ τῇ πράσει αὐτοῦ
  choice: я радовался его продаже
  rationale: Передаёт длительное/состоявшееся злорадное отношение говорящего и прямо сохраняет значение πράσις — «продажа».
- source_word: ὑπὲρ ἡμᾶς
  choice: больше, чем нас
  rationale: В сочетании с ἀγαπάω оборот выражает сравнительную степень любви; естественная русская передача сохраняет сопоставление Иосифа с братьями.
- source_word: ὁ πατὴρ αὐτὸν ἠγάπα
  choice: отец любил его
  rationale: Сохранён субъект «отец» без добавления притяжательного местоимения, как в греческом тексте; местоимение «его» относится к проданному брату.
