  text: Καὶ ἔχαιρον ἐπὶ τῇ πράσει αὐτοῦ³⁵, ὅτι³⁶ *ὑπὲρ ἡμᾶς³⁷ *ὁ πατὴρ αὐτὸν ἠγάπα³⁸.
