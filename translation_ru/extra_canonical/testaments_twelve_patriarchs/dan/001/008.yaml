base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/008.yaml
  text: This was the spirit of anger persuading me, that just as a leopard sucks out a young goat, so it put into me to suck out Joseph.
translation:
  language: ru
  text: 'Это был дух гнева, убеждавший меня: как леопард высасывает козлёнка, так он внушил мне высосать Иосифа.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Греческий текст этой фразы местами повреждён и необычен; буквально: «как леопард высасывает козлёнка, так он вложил в меня высосать Иосифа».'
    reason: Предупреждает читателя о текстовой и синтаксической трудности и показывает буквальную основу непривычного образа, не заменяя её догадкой.
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ θυμοῦ
  choice: дух гнева
  rationale: Сохраняет олицетворённую духовную силу и прямое значение θυμός — «гнев, ярость».
- source_word: τὸ πεῖθόν με
  choice: убеждал меня
  rationale: Передаёт продолженное воздействие причастия настоящего времени, не усиливая его до принуждения.
- source_word: ἐκμύζουσα / ἐκμυζῆσαι
  choice: высасывает / высосать
  rationale: Сохраняет намеренно жестокий и необычный повтор одного глагольного образа; замены вроде «терзает» или «уничтожить» устранили бы конкретную метафору греческого текста.
- source_word: ἐμοὶ ἐνέβαλεν
  choice: он внушил мне
  rationale: Естественно по-русски передаёт идею вложенного внутрь побуждения; субъектом по контексту остаётся «дух гнева».
- source_word: ἔριφον
  choice: козлёнка
  rationale: Обычное современное соответствие слову, обозначающему молодого козла.
theological_decisions:
- issue: Агент греховного побуждения
  choice: Сохранён «дух гнева» как действующий и убеждающий субъект.
  alternative: Передать выражение как простое внутреннее чувство гнева.
  rationale: Греческий текст грамматически олицетворяет πνεῦμα и приписывает ему действие; перевод не решает сверх текста, является ли это самостоятельной духовной сущностью или персонификацией страсти.
- issue: Смысл насильственного образа
  choice: Сохранено буквальное «высосать Иосифа».
  alternative: «Лишить Иосифа жизни» или «высосать кровь из Иосифа».
  rationale: Первая альтернатива стирает образ, а вторая добавляет отсутствующее в сохранившемся греческом тексте слово «кровь».
translation_notes:
  register: Современный литературный русский язык с достоинством, но без архаизмов. Необычная жестокая метафора сохранена намеренно; синтаксис слегка упорядочен ради понятности.
