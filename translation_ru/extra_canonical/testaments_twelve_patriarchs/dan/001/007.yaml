source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *ἐκ τῶν πνευμάτων⁴³ τοῦ Βελίαρ †συνήργει⁴⁴ μοι, ὅτι⁴⁵· *Λαβὲ τὸ ξίφος καὶ ⌜ἐν τούτῳ⌝⁴⁶ ἄνελε τὸν Ἰωσήφ⁴⁷, καὶ ἀγαπήσει σε ὁ πατήρ⁴⁸, ἀποθανόντος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/007.yaml
  text: And one of the spirits of Beliar was working with me, saying, ‘Take this sword and kill Joseph, and your father will love you after he dies.’
translation:
  language: ru
  text: 'И один из духов Велиара действовал вместе со мной, говоря: «Возьми меч и убей им Иосифа — и после его смерти[a] отец полюбит тебя».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «когда он умрёт»; греческий текст не уточняет однозначно, относится ли «он» к Иосифу или к отцу.'
    reason: Сохранить реальную грамматическую неоднозначность местоимения в исходном тексте.
lexical_decisions:
- source_word: ἐκ τῶν πνευμάτων τοῦ Βελίαρ
  choice: один из духов Велиара
  rationale: Греческая конструкция буквально указывает на кого-то «из духов Велиара»; по контексту естественно передать партитивное значение как «один из».
- source_word: συνήργει μοι
  choice: действовал вместе со мной
  rationale: Передаёт значение совместного действия или содействия, не ослабляя мысль до простого внутреннего внушения.
- source_word: ξίφος
  choice: меч
  rationale: Обычное и точное соответствие греческому названию клинкового оружия.
- source_word: ἐν τούτῳ
  choice: им
  rationale: 'Естественная русская передача инструментального значения: убить этим мечом.'
- source_word: ἄνελε
  choice: убей
  rationale: Прямой повелительный призыв лишить Иосифа жизни; современная и ясная формулировка.
theological_decisions:
- issue: К кому относится местоимение αὐτοῦ в обороте ἀποθανόντος αὐτοῦ
  choice: после его смерти
  alternative: после смерти Иосифа / после смерти отца
  rationale: Греческое местоимение допускает формальную неоднозначность. Русская формулировка сохраняет её, не навязывая толкование, хотя ближайшим возможным антецедентом является Иосиф.
- issue: Характер воздействия духа Велиара
  choice: действовал вместе со мной
  alternative: помогал мне / действовал во мне
  rationale: Выбранная формулировка сохраняет идею συνεργέω — совместного действия — и не решает сверх текста вопрос о точном механизме духовного влияния.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью повествования. Прямая речь звучит естественно; имя «Велиар» сохранено в традиционной форме. Неоднозначность заключительного местоимения намеренно не устранена.
