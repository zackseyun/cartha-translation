  text: Любите Господа всю вашу жизнь и друг друга — с искренним сердцем.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγαπήσατε
  choice: Любите
  rationale: Повелительная форма передаёт прямое и продолжающееся нравственное наставление; по-русски несовершенный вид здесь естественнее и не ограничивает любовь единичным действием.
- source_word: ἐν πάσῃ τῇ ζωῇ ὑμῶν
  choice: всю вашу жизнь
  rationale: 'Естественно передаёт временной охват: любить Господа на протяжении всей жизни.'
- source_word: ἀλλήλους
  choice: друг друга
  rationale: Прямое соответствие взаимному местоимению.
- source_word: ἐν ἀληθινῇ καρδίᾳ
  choice: с искренним сердцем
  rationale: ἀληθινός здесь обозначает подлинность и нелицемерность внутреннего отношения; «искренним» звучит естественно в современном русском, сохраняя образ сердца.
theological_decisions:
- issue: Связь обстоятельства «с искренним сердцем»
  choice: Сохранена наиболее непосредственная связь с заповедью любить друг друга.
  alternative: Отнести выражение к обеим заповедям — любви к Господу и друг к другу.
  rationale: В греческом выражение следует непосредственно после ἀλλήλους, поэтому синтаксически прежде всего характеризует взаимную любовь; пунктуация не исключает более широкого смыслового применения.
translation_notes:
  register: Современный литературный русский; краткая, dignified формулировка наставления. Тире помогает ясно отделить второе обстоятельство и избежать ошибочного чтения «всю вашу жизнь и друг друга» как однородных дополнений.
