source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *ὡς ἂν ἀποστήσεσθε⁴⁰ ἀπὸ⁴¹ Κυρίου⁴², *ἐν πάσῃ κακίᾳ⁴³ *πορευόμενοι ποιήσετε τὰ βδελύγματα τῶν ἐθνῶν ἐκπορνεύοντες ἐν⁴⁴ γυναιξὶν ἀνόμων⁴⁵ καὶ ἐν πάσῃ πονηρίᾳ⁴⁶ ἐνεργούντων⁴⁷ ⌈ἐν ὑμῖν⌉¹ *τῶν πνευμάτων⁴⁸ τῆς πονηρίας⁴⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/005.yaml
  text: And whenever you depart from the Lord, walking in every wickedness, you will do the abominations of the nations, prostituting yourselves with lawless women, and every evil will be at work among you through the spirits of wickedness.
translation:
  language: ru
  text: И всякий раз, когда вы отступите от Господа, ходя во всяком зле, вы будете творить мерзости язычников, предаваясь блуду с женщинами беззаконников[a], а духи зла будут действовать среди вас во всяком зле[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Или: «с жёнами беззаконников». Греческое слово может означать и «женщин», и «жён».'
    reason: Сохраняет лексическую неоднозначность γυνή, тогда как родительный ἀνόμων указывает на связь женщин с «беззаконниками».
  - marker: b
    text: 'Буквально: «в вас». В данном издании эти слова заключены в квадратные скобки, поскольку их присутствие в тексте не вполне несомненно.'
    reason: Передаёт как возможный смысл ἐν ὑμῖν, так и отмеченную в исходном издании текстологическую неопределённость.
lexical_decisions:
- source_word: ἀποστήσεσθε ἀπὸ Κυρίου
  choice: отступите от Господа
  rationale: Передаёт идею отхода и отпадения от Господа без добавления конфессионально окрашенного толкования.
- source_word: ἐν πάσῃ κακίᾳ πορευόμενοι
  choice: станете ходить путями всякого зла
  rationale: Сохраняет библейскую метафору хождения как образа поведения, но выражает её естественно для современного русского языка.
- source_word: τὰ βδελύγματα τῶν ἐθνῶν
  choice: мерзости язычников
  rationale: «Мерзости» сохраняет сильную нравственно-религиозную оценку βδελύγματα; τὰ ἔθνη в данном контексте естественно передаётся как «язычники».
- source_word: ἐκπορνεύοντες
  choice: предаваясь блуду
  rationale: Передаёт сексуальную распущенность исходного глагола в dignified biblical register без излишне современного или узко коммерческого оттенка слова «проституироваться».
- source_word: γυναιξὶν ἀνόμων
  choice: с жёнами беззаконников
  rationale: ἀνόμων имеет форму родительного множественного числа, поэтому наиболее формально вероятно значение «жёны/женщины беззаконников», а не согласованное «беззаконные женщины».
- source_word: ἐν ὑμῖν
  choice: среди вас
  rationale: В данном контексте допускает коллективное действие зла в общине; буквальное «в вас» также возможно и отмечено в сноске.
- source_word: τῶν πνευμάτων τῆς πονηρίας
  choice: под действием духов зла
  rationale: Сохраняет духов как действующих лиц причастной конструкции и ясно передаёт их причинную роль в естественном русском синтаксисе.
theological_decisions:
- issue: Соотношение человеческого отступления и действия злых духов
  choice: 'Сохранены оба элемента: люди отступают и творят мерзости, а духи зла действуют среди них.'
  alternative: Представить злых духов единственной причиной человеческого зла либо свести их к метафоре.
  rationale: Греческий текст удерживает вместе человеческую ответственность и действие духов, не объясняя их соотношение; перевод не должен устранять это напряжение.
- issue: Смысл γυναιξὶν ἀνόμων
  choice: «с жёнами беззаконников»
  alternative: «с беззаконными женщинами»
  rationale: Родительный ἀνόμων грамматически поддерживает чтение «[жёнами] беззаконников»; при этом лексическая неоднозначность γυνή между «женщина» и «жена» отмечена в сноске.
- issue: 'Местонахождение действия духов: ἐν ὑμῖν'
  choice: «среди вас»
  alternative: «в вас»
  rationale: Оба значения возможны. Контекст обращения к группе допускает коллективное «среди вас», но более буквальная возможность внутреннего действия сохранена в сноске.
translation_notes:
  register: Современный литературный русский с умеренно библейской торжественностью. Сохранены традиционные и понятные выражения «отступить от Господа», «ходить путями», «мерзости язычников» и «предаваться блуду»; синтаксис последней греческой конструкции перестроен для ясности без устранения её богословского напряжения.
