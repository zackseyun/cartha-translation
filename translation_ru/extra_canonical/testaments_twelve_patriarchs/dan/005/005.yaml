revisions:
- from: И когда вы отступите от Господа и станете ходить путями всякого зла, вы будете творить мерзости язычников, предаваясь блуду с жёнами беззаконников[a], и всякое зло будет совершаться среди вас под действием духов зла[b].
  to: И всякий раз, когда вы отступите от Господа, ходя во всяком зле, вы будете творить мерзости язычников, предаваясь блуду с женщинами беззаконников[a], а духи зла будут действовать среди вас во всяком зле[b].
  rationale: Правка восстанавливает духов зла как субъектов причастной конструкции, устраняет необязательное добавление «путями», не сужает значение γυνή до «жён» и отмечает скобочное, текстологически не вполне твёрдое ἐν ὑμῖν. Смысл последовательности — отступление, злое поведение, подражание языческим мерзостям и действие духов зла — сохранён без конфессионального истолкования.
