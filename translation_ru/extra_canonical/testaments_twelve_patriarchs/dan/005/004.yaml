  to: Я знаю, что в последние дни вы отступите от Господа, вызовете гнев Левия и выступите против Иуды, но не одолеете их. Ведь ангел Господа ведёт их обоих, потому что в них утвердится Израиль.
  rationale: Исправлен только заключительный оборот, чтобы точнее передать ἐν αὐτοῖς и сохранить образ утверждения Израиля в Левии и Иуде без интерпретации его как исключительно опосредованного действия.
