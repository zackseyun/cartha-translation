source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ἐγὼ οἶδα²⁷ ὅτι ἐν ταῖς²⁸ ἐσχάταις ἡμέραις ἀποστήσεσθε²⁹ τοῦ Κυρίου, καὶ προσοχθιεῖτε³⁰ τῷ³¹ Λευί, καὶ πρὸς τῷ³² Ἰουδὰ³³ παρατάξεσθε³⁴, ἀλλ᾽ οὐ δυνήσεσθε³⁵ πρὸς αὐτούς³⁶. *ἄγγελος γὰρ Κυρίου ὁδηγεῖ ἑκατέρους³⁷, ὅτι ἐν αὐτοῖς³⁸ στήσεται ὁ³⁹ Ἰσραήλ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/004.yaml
  text: I know that in the last days you will depart from the Lord, and you will provoke Levi to anger, and you will array yourselves against Judah, but you will not prevail against them. For an angel of the Lord guides them both, because by them Israel will stand.
translation:
  language: ru
  text: Я знаю, что в последние дни вы отступите от Господа, вызовете гнев Левия и выступите против Иуды, но не одолеете их. Ведь ангел Господа ведёт их обоих, потому что в них утвердится Израиль.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστήσεσθε τοῦ Κυρίου
  choice: отступите от Господа
  rationale: Прямо передаёт идею отпадения или отхода от Господа и сохраняет религиозно-нравственную силу греческого выражения.
- source_word: προσοχθιεῖτε τῷ Λευί
  choice: вызовете гнев Левия
  rationale: Глагол обозначает причинение раздражения или гнева; такая формулировка естественна по-русски и не превращает Левия в прямое дополнение действия.
- source_word: πρὸς τῷ Ἰουδὰ παρατάξεσθε
  choice: выступите против Иуды
  rationale: Передаёт враждебное построение или противостояние без тяжеловесного буквального оборота «выстроитесь в боевой порядок».
- source_word: οὐ δυνήσεσθε πρὸς αὐτούς
  choice: не одолеете их
  rationale: В контексте противостояния выражение означает неспособность устоять против них или взять над ними верх.
- source_word: ὁδηγεῖ ἑκατέρους
  choice: ведёт их обоих
  rationale: Сохраняет настоящее время и явно относит действие ангела к Левию и Иуде вместе.
- source_word: ἐν αὐτοῖς στήσεται ὁ Ἰσραήλ
  choice: через них устоит Израиль
  rationale: «Устоит» сохраняет образ утверждения и стойкости; «через них» естественно передаёт инструментальный смысл ἐν αὐτοῖς в данном контексте.
theological_decisions:
- issue: Роль Левия и Иуды в сохранении Израиля
  choice: через них устоит Израиль
  alternative: в них утвердится Израиль
  rationale: Выбранный вариант сохраняет коллективную роль обоих родоначальников/колен и не уточняет сверх текста, идёт ли речь о политическом, культовом или эсхатологическом утверждении Израиля.
- issue: Личность ангела Господа
  choice: ангел Господа
  alternative: Ангел Господень
  rationale: Нейтральная современная формулировка не отождествляет этого ангела с Богом и не вводит конфессионального толкования.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Синтаксис сделан ясным и естественным; военная образность παρατάξεσθε передана глаголом «выступите», а неоднозначность основания стойкости Израиля сохранена без догматического уточнения.
