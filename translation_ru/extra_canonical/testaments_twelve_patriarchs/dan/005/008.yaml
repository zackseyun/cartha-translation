source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: ⌈Καὶ⌉⁶⁹ διὰ τοῦτο ἀπαχθήσεσθε⁷⁰ [σὺν αὐτοῖς]⁷¹ *εἰς αἰχμαλωσίαν⁷², κἀκεῖ ἀπολήψεσθε⁷³ *πάσας τὰς πληγὰς Αἰγύπτου⁷⁴ καὶ πάσας τὰς⁷⁵ πονηρίας⁷⁶ τῶν ἐθνῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/008.yaml
  text: Therefore you will be led away with them into captivity, and there you will receive all the plagues of Egypt and all the evils of the nations.
translation:
  language: ru
  text: Поэтому вас уведут [вместе с ними][a] в плен, и там вы испытаете все бедствия Египта и всё зло народов.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «вместе с ними» отсутствуют в части текстовой традиции.
    reason: Греческое σὺν αὐτοῖς дано издателем в квадратных скобках как текстуально сомнительное; примечание сохраняет чтение в основном тексте и обозначает вариант.
lexical_decisions:
- source_word: ἀπαχθήσεσθε
  choice: вас уведут
  rationale: Передаёт пассивную форму будущего времени и принудительное удаление без ненужного уточнения действующего лица.
- source_word: εἰς αἰχμαλωσίαν
  choice: в плен
  rationale: Естественное современное русское соответствие выражению о насильственном отведении в плен.
- source_word: ἀπολήψεσθε
  choice: испытаете
  rationale: В данном контексте глагол означает получение своей доли бедствий; «испытаете» звучит естественно и сохраняет смысл претерпевания.
- source_word: πληγὰς Αἰγύπτου
  choice: египетские кары
  rationale: Сохраняет библейскую отсылку к бедствиям, постигшим Египет; «кары» в русском литературном употреблении точнее по контексту, чем телесные «удары».
- source_word: πονηρίας τῶν ἐθνῶν
  choice: всё зло народов
  rationale: Сохраняет широкое значение πονηρίαι и не сужает его до конкретных пороков или бедствий; ἔθνη передано нейтральным «народы».
theological_decisions:
- issue: Характер «египетских кар»
  choice: Не уточнять, являются ли они буквальным повторением казней Египта или образным обозначением бедствий.
  alternative: Перевести как «все казни египетские», усилив прямую формульную связь с Исходом.
  rationale: Греческий текст допускает отсылку к бедствиям Египта, но не разъясняет способ её исполнения; перевод сохраняет эту напряжённость.
translation_notes:
  register: Современный литературный русский язык с умеренно библейским достоинством. Синтаксис ясен для широкого читателя; архаизмы и конфессионально окрашенные уточнения исключены.
