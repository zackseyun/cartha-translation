  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ ἀνατελεῖ ὑμῖν *ἐκ τῆς φυλῆς [Ἰούδα καὶ] τοῦ Λευὶ τὸ σωτήριον Κυρίου⁸³, *αὐτὸς γὰρ⁸⁴ ποιήσει πρὸς τὸν Βελίαρ πόλεμον⁸⁵, καὶ τὴν ἐκδίκησιν τοῦ νίκους δώσει τοῖς⁸⁶ †πατράσιν⁸⁷ ὑμῶν⁸⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/010.yaml
  text: And for you the salvation of the Lord will arise from the tribe of Judah and Levi. For he himself will make war against Beliar, and he will grant the vengeance of victory to your fathers.
translation:
  language: ru
  text: И для вас из колена Иуды и Левия[a] взойдёт спасение Господне. Ибо Он Сам поведёт войну против Велиара и дарует вашим отцам возмездие победы[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «Иуды и» в греческом тексте имеют текстуальную неопределённость.
    reason: В издании Ἰούδα καὶ заключено в квадратные скобки.
  - marker: b
    text: Греческое выражение «возмездие победы» необычно; слово, переведённое как «отцам», также отмечено в издании как текстуально сомнительное.
    reason: Необходимо сохранить лексическую неоднозначность ἐκδίκησιν τοῦ νίκους и сигнализировать о критическом знаке при πατράσιν.
lexical_decisions:
- source_word: ἀνατελεῖ
  choice: взойдёт
  rationale: Сохраняет образ восхода или появления, заложенный в глаголе, и естественно сочетается с «спасением Господним».
- source_word: τὸ σωτήριον Κυρίου
  choice: спасение Господне
  rationale: Передаёт субстантивированное «спасительное/спасение» и сохраняет возвышенный, но понятный библейский регистр.
- source_word: αὐτὸς
  choice: Он Сам
  rationale: Сохраняет мужской род и эмфатический характер местоимения; не устраняет напряжение между безлично звучащим «спасением» и последующим личным деятелем.
- source_word: ποιήσει ... πόλεμον
  choice: поведёт войну
  rationale: Естественный современный русский эквивалент буквального «сотворит/совершит войну».
- source_word: Βελίαρ
  choice: Велиара
  rationale: Транслитерация греческой формы имени Βελίαρ, без отождествления с иными именованиями.
- source_word: τὴν ἐκδίκησιν τοῦ νίκους
  choice: возмездие победы
  rationale: Сохраняет необычную и неоднозначную греческую конструкцию, не сводя её молча ни к «победному возмездию», ни к «отмщению, ведущему к победе».
theological_decisions:
- issue: Личный характер грядущего спасения
  choice: «Он Сам» с прописной буквы
  alternative: «оно само» или безличная перестройка
  rationale: Греческое αὐτός имеет мужской род и представляет спасение как личного деятеля; перевод сохраняет это мессиански окрашенное напряжение, не уточняя личность сверх текста.
- issue: Происхождение спасения из Иуды и Левия
  choice: сохранить оба колена
  alternative: оставить только Левия ввиду текстуальной неопределённости слов «Иуды и»
  rationale: Печатный основной текст включает Ἰούδα καὶ, а консультационный английский слой также принимает эту форму; неопределённость отражена в сноске.
- issue: Адресаты дара возмездия
  choice: «вашим отцам»
  alternative: предположительная конъектура вместо πατράσιν
  rationale: Основной греческий текст читает πατράσιν, хотя слово отмечено как сомнительное; перевод не заменяет его недоказанной реконструкцией.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным библейским звучанием. Синтаксис сделан естественным, но образы «взойдёт спасение» и «возмездие победы» сохранены ради близости к греческому тексту и его подлинной неоднозначности.
