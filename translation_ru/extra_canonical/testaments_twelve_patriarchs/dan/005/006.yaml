revisions:
- from: Ибо я прочёл в книге праведного Еноха и узнал, что ваш правитель — сатана и что духи злобы и гордости будут повиноваться ему, находясь при сынах Левия, чтобы заставлять их грешить перед Господом.[a]
  to: Ибо я прочёл в книге Еноха, праведника, и узнал, что ваш правитель — сатана и что духи злобы и гордости будут повиноваться[a], служа сыновьям Левия, чтобы побуждать их грешить перед Господом.
  rationale: Устранено добавленное «ему», поскольку оно задаёт невыраженный в греческом объект повиновения. «Находясь при» заменено на «служа», чтобы передать служебно-сопроводительное значение παρεδρεύειν. Формула о Енохе перестроена для ясной передачи приложения «праведник». Сноска перенесена непосредственно к спорному глаголу и ограничена текстологически значимой неоднозначностью.
