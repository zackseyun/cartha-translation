  verdict: revise
  source_fidelity: 'Добавленное «ему» необоснованно устраняет существенную неоднозначность: у ὑπακούσονται в данном греческом построении объект не выражен. Кроме того, παρεδρεύειν с τοῖς υἱοῖς Λευί означает не просто пребывание рядом, а служение/прислуживание при них. «Книга праведного Еноха» может по-русски двусмысленно обозначать принадлежность книги; греческое τοῦ δικαίου характеризует Еноха.'
  naturalness: Исправленный текст остаётся современным литературным русским. Необъектное «будут повиноваться» допустимо в контексте и точнее сохраняет форму оригинала; последующее «служа сыновьям Левия» делает синтаксическую связь понятной без внесения неназванного адресата повиновения.
  terminology: «Правитель», «сатана», «духи злобы и гордости», «сыны Левия» и «Господь» уместны. «Служа сыновьям Левия» лучше передаёт παρεδρεύειν, чем нейтральное «находясь при».
