source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '[᾿Ανέγνων γὰρ⁵⁰ ἐν βίβλῳ Ἐνὼχ⁵¹ τοῦ δικαίου ⌈καὶ ἔγνων⌉¹⁵² ὅτι ὁ⁵³ ἄρχων ὑμῶν⁵⁴ ὁ Σατανᾶς ἐστιν⁵⁵ *καὶ ὅτι⁵⁶ τὰ πνεύματα τῆς πονηρίας⁵⁷ καὶ τῆς ὑπερηφανίας †ὑπακούσονται⁵⁸ *τοῦ παρεδρεύειν⁵⁹ τοῖς υἱοῖς Λευί, τοῦ ποιεῖν⁶⁰ αὐτοὺς ἐξαμαρτάνειν ἐνώπιον Κυρίου.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/006.yaml
  text: For I have read in the book of Enoch the righteous, and I learned that your ruler is Satan, and that the spirits of wickedness and pride will obey in attending the sons of Levi, to make them sin before the Lord.
translation:
  language: ru
  text: Ибо я прочёл в книге Еноха, праведника, и узнал, что ваш правитель — сатана и что духи злобы и гордости будут повиноваться[a], служа сыновьям Левия, чтобы побуждать их грешить перед Господом.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое построение в этом месте трудно, а объект глагола «будут повиноваться» (ὑπακούσονται) прямо не назван. Далее стоит выражение, буквально означающее «служить при сынах Левия»; поэтому не следует безоговорочно добавлять, кому именно духи повинуются.
    reason: Сохраняет неназванный объект ὑπακούσονται и поясняет значение παρεδρεύειν, не внося в основной текст интерпретацию «ему».
lexical_decisions:
- source_word: ἄρχων
  choice: правитель
  rationale: Передаёт значение властителя или начальствующего лица, не сужая его до политического титула.
- source_word: τὰ πνεύματα τῆς πονηρίας καὶ τῆς ὑπερηφανίας
  choice: духи злобы и гордости
  rationale: Сохраняет родительные конструкции как обозначение духов, связанных со злом и гордостью; «злоба» здесь естественнее и предметнее абстрактной «порочности».
- source_word: ὑπακούσονται
  choice: будут повиноваться ему
  rationale: Сохраняет явное значение повиновения. Местоимение «ему» введено для естественности русского текста, однако подразумеваемый объект в греческом прямо не назван и отмечен в сноске.
- source_word: παρεδρεύειν
  choice: находясь при
  rationale: Передаёт присутствие рядом, прислуживание или сопровождение без чрезмерного уточнения характера этой деятельности.
- source_word: ἐξαμαρτάνειν ἐνώπιον Κυρίου
  choice: грешить перед Господом
  rationale: Прямо и естественно передаёт действие и его совершение пред лицом Господа.
theological_decisions:
- issue: К кому относится «ваш» в выражении ὁ ἄρχων ὑμῶν
  choice: сохранено «ваш правитель»
  alternative: «правитель их» или уточнение конкретной группы
  rationale: В стихе адресат обозначен вторым лицом множественного числа; конкретизацию не следует вносить без контекста.
- issue: Неназванный объект глагола ὑπακούσονται
  choice: в основном тексте добавлено «ему» с оговоркой в сноске
  alternative: «будут повиноваться, находясь при сынах Левия» без названного объекта
  rationale: Русский глагол «повиноваться» обычно требует дополнения; ближайшим вероятным референтом является сатана, но греческий оставляет объект невыраженным, поэтому неоднозначность раскрыта в примечании.
- issue: Причинитель действия в τοῦ ποιεῖν αὐτοὺς ἐξαμαρτάνειν
  choice: «чтобы заставлять их грешить»
  alternative: «чтобы они согрешали»
  rationale: Конструкция ποιεῖν с инфинитивом имеет причинительное значение; местоимение αὐτούς естественно относится к сынам Левия.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательной речи. Синтаксис сделан ясным для широкого читателя, при этом спорное место не сглажено и вынесено в текстологическую сноску.
