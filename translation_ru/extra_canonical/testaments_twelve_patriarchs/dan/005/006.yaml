  - severity: medium
    issue: «Находясь при сынах Левия» ослабляет значение παρεδρεύειν.
    rationale: Глагол обозначает нахождение при ком-либо в качестве служащего, помощника или прислужника; простое присутствие не передаёт эту функцию.
  - severity: low
    issue: Оборот «в книге праведного Еноха» двусмыслен.
    rationale: Он может быть понят как книга, принадлежащая Еноху. «В книге Еноха, праведника» яснее отражает приложенное τοῦ δικαίου.
