base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/002.yaml
  text: Speak truth, each one to his neighbor, and you will certainly not fall into wrath and tumults; rather, you will be in peace, having the God of peace, and no war will prevail against you.
translation:
  language: ru
  text: Говорите правду каждый своему ближнему — и вы ни за что не впадёте в гнев и смятение, но будете пребывать в мире, имея Бога мира, и никакая война вас не одолеет.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλήθειαν φθέγγεσθε
  choice: Говорите правду
  rationale: Передаёт повеление говорить истину естественным современным русским выражением, сохраняя предмет ἀλήθειαν.
- source_word: πρὸς τὸν πλησίον αὐτοῦ
  choice: своему ближнему
  rationale: Традиционное и понятное соответствие πλησίον; местоимение отражает αὐτοῦ при распределительном ἕκαστος.
- source_word: οὐ μὴ ἐμπέσητε
  choice: ни за что не впадёте
  rationale: Сохраняет усиленное отрицание οὐ μή и образ глагола ἐμπίπτω.
- source_word: μῆνιν καὶ ταραχάς
  choice: гнев и смятение
  rationale: «Гнев» передаёт сильную, устойчивую ярость μῆνις; собирательное «смятение» естественно охватывает множественное ταραχαί — волнения, беспорядки и потрясения.
- source_word: ἔσεσθε ἐν εἰρήνῃ
  choice: будете пребывать в мире
  rationale: Естественно выражает состояние нахождения в мире, обозначенное конструкцией εἶναι ἐν.
- source_word: ἔχοντες τὸν θεὸν τῆς εἰρήνης
  choice: имея Бога мира
  rationale: Формально сохраняет причастную конструкцию и богословски значимое определение «Бог мира», не уточняя невыраженную логическую связь.
- source_word: οὐ μὴ κατισχύσει ὑμῶν πόλεμος
  choice: никакая война вас не одолеет
  rationale: Передаёт усиленное отрицание и значение κατισχύω с родительным ὑμῶν как превосходство или победу над адресатами.
theological_decisions:
- issue: Связь правдивой речи, мира и Божьего присутствия
  choice: Сохранена последовательность утверждений без добавления причинных союзов
  alternative: «Потому что с вами будет Бог мира» или иное явное причинное толкование
  rationale: Греческий текст использует причастие ἔχοντες и оставляет точную логическую связь открытой.
- issue: Обещание о войне
  choice: «никакая война вас не одолеет»
  alternative: «война не возобладает над вами»
  rationale: Выбран ясный современный оборот, сохраняющий категоричность οὐ μή и не уточняющий, идёт ли речь о буквальной войне или более широком конфликте.
translation_notes:
  register: Современный литературный русский с достойным наставительным тоном. Синтаксис близок к греческой последовательности, но упорядочен для естественного русского звучания; подлинная неопределённость причастия «имея» сохранена.
