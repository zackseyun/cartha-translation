source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *ἀναπαύσονται ἐν Ἐδὲμ ἅγιοι⁹⁵, καὶ ἐπὶ *τῆς νέας⁹⁶ Ἱερουσαλὴμ εὐφρανθήσονται δίκαιοι, *ἥτις ἐστι δόξα θεοῦ αἰώνιος⁹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/012.yaml
  text: And the holy ones will rest in Eden, and the righteous will rejoice over the new Jerusalem, which is the eternal glory of God.
translation:
  language: ru
  text: И святые обретут покой в Эдеме, и праведники возрадуются новому Иерусалиму, который есть вечная слава Бога.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναπαύσονται
  choice: обретут покой
  rationale: Передаёт будущее значение «будут отдыхать, упокоятся», не создавая в современном русском ненужной ассоциации исключительно со смертью.
- source_word: ἐπὶ τῆς νέας Ἱερουσαλήμ
  choice: новому Иерусалиму
  rationale: Русская дательная конструкция после «возрадуются» естественно выражает радость по поводу нового Иерусалима и сохраняет направленность ἐπί без искусственного пространственного толкования.
- source_word: ἥτις ἐστι δόξα θεοῦ αἰώνιος
  choice: который есть вечная слава Бога
  rationale: Относительное предложение прямо соотнесено с Иерусалимом; связка «есть» сохраняет явное отождествление, а не ослабляет его до сравнения.
theological_decisions:
- issue: Соотношение нового Иерусалима и вечной славы Бога
  choice: 'Сохранено прямое утверждение: новый Иерусалим «есть вечная слава Бога».'
  alternative: «в котором пребывает вечная слава Бога» или «который являет вечную славу Бога»
  rationale: Такие альтернативы разъясняли бы образ, но добавляли бы отсутствующие в греческом тексте отношения пребывания или явления и тем самым снимали бы его богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с торжественным библейским звучанием. «Обретут покой» и «возрадуются» передают эсхатологический тон, оставаясь понятными обычному читателю.
