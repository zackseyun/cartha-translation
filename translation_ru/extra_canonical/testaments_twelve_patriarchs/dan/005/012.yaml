  terminology: «Святые», «праведники», «Эдем», «новый Иерусалим» и «вечная слава Бога» передают ключевые термины без конфессиональных уточнений. Относительное «который» однозначно относится к Иерусалиму и сохраняет прямое сказуемое «есть».
