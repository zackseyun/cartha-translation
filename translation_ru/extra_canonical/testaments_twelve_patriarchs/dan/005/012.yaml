  source_fidelity: 'Греческий текст передан в целом точно: ἀναπαύσονται — «обретут покой», ἐν Ἐδέμ — «в Эдеме», δίκαιοι — «праведники», а отождествление нового Иерусалима с вечной славой Бога сохранено. Дательный оборот «возрадуются новому Иерусалиму» естественно передаёт радость по поводу Иерусалима и не навязывает пространственного значения предлогу ἐπί. Однако союз «а» вводит отсутствующее в оригинале противопоставление между святыми и праведниками: в греческом оба члена соединены καί.'
