  terminology: «Господь», «помилованы», «святилище» и «мир» — уместные и устойчивые соответствия. «Мир» сохраняет широкую семантику εἰρήνη, не сужая её до отсутствия войны либо внутреннего покоя. Уважительное написание «Он», «Своё» соответствует заявленному регистру.
