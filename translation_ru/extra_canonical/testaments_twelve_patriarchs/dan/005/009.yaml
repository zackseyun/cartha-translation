  source_fidelity: 'Перевод точно передаёт греческую последовательность: οὕτως — «итак», аористное причастие ἐπιστρέψαντες — «обратившись», будущий пассив ἐλεηθήσεσθε — «будете помилованы», а также два будущих сказуемых ἄξει и δώσει. «Введёт ... в Своё святилище» адекватно передаёт движение εἰς τὸ ἁγίασμα αὐτοῦ. Добавленного условия или причинности нет.'
