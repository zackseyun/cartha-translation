source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ οὕτως⁷⁷ ἐπιστρέψαντες⁷⁸ πρὸς Κύριον ἐλεηθήσεσθε⁷⁹ καὶ ἄξει ὑμᾶς⁸⁰ εἰς τὸ ἁγίασμα αὐτοῦ *καὶ δώσει⁸¹ ὑμῖν εἰρήνην⁸².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/009.yaml
  text: And so, having returned to the Lord, you will receive mercy, and he will bring you into his sanctuary and give you peace.
translation:
  language: ru
  text: Итак, обратившись к Господу, вы будете помилованы, и Он введёт вас в Своё святилище и даст вам мир.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψαντες πρὸς Κύριον
  choice: обратившись к Господу
  rationale: Деепричастная конструкция передаёт греческое причастие аориста и духовный смысл возвращения/обращения к Господу, не превращая его в отдельное условное предложение.
- source_word: ἐλεηθήσεσθε
  choice: вы будете помилованы
  rationale: Страдательная форма сохраняет прямое значение будущего пассива и подразумеваемое действие Божьего милосердия.
- source_word: ἄξει ὑμᾶς
  choice: Он введёт вас
  rationale: В контексте движения εἰς τὸ ἁγίασμα естественное русское «введёт» точнее, чем общее «приведёт», передаёт движение внутрь святилища.
- source_word: τὸ ἁγίασμα αὐτοῦ
  choice: Своё святилище
  rationale: «Святилище» соответствует сакральному значению ἁγίασμα; возвратное «Своё» естественно указывает на Господа как владельца.
- source_word: δώσει ὑμῖν εἰρήνην
  choice: даст вам мир
  rationale: 'Сохраняет прямую формулировку и широкую смысловую ёмкость εἰρήνη: мир, благополучие и покой.'
theological_decisions:
- issue: Связь обращения и помилования
  choice: Сохранена последовательность «обратившись… будете помилованы»
  alternative: «когда вы обратитесь…» или причинное «за то, что обратитесь…»
  rationale: Греческое причастие обозначает предшествующее действие, но само по себе не требует превращать связь в явно временную, условную или причинную.
- issue: Подлежащее глаголов «введёт» и «даст»
  choice: Местоимение «Он» относится к Господу
  alternative: Повторить «Господь» либо оставить подлежащее только подразумеваемым
  rationale: Так естественно раскрывается подразумеваемое греческое подлежащее без добавления отдельного богословского утверждения.
translation_notes:
  register: Современный литературный русский язык; торжественный, но понятный регистр. Заглавное «Он» употреблено как традиционное уважительное обозначение Господа. Синтаксис сохраняет единую последовательность греческого предложения без лишнего повторения подлежащего.
