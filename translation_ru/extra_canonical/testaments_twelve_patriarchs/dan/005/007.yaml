source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *οἱ ἐμοὶ υἱοὶ⁶¹ συνεγγίζοντές⁶² εἰσι τοῦ⁶³ Λευὶ καὶ συναμαρτάνοντες⁶⁴ αὐτοῖς⁶⁵ ἐν πᾶσιν. *οἱ δὲ υἱοὶ τοῦ⁶⁶ Ἰούδα ἔσονται ἐν πλεονεξίᾳ ἁρπάζοντες⁶⁷ ἀλλότρια ὡς⁶⁸ λέοντες.]
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/007.yaml
  text: And my sons are drawing near to Levi and sinning together with them in all things. But the sons of Judah will be in greed, snatching what belongs to others like lions.
translation:
  language: ru
  text: И мои сыновья приближаются к Левию и во всём грешат вместе с ними[a]. А сыновья Иуды будут алчны, похищая чужое, словно львы.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Неясно, к кому относится «с ними»: в греческом тексте после единственного имени «Левий» стоит местоимение во множественном числе.'
    reason: Сохраняет грамматическую и референциальную неоднозначность исходного текста, не подменяя её догадкой.
lexical_decisions:
- source_word: συνεγγίζοντές εἰσι τοῦ Λευὶ
  choice: сближаются с Левием
  rationale: Настоящая перифрастическая конструкция передаёт происходящее действие; συνεγγίζω с родительным означает приближение или сближение.
- source_word: συναμαρτάνοντες αὐτοῖς ἐν πᾶσιν
  choice: во всём грешат вместе с ними
  rationale: Сохранены совместность действия, всеохватность ἐν πᾶσιν и множественное местоимение αὐτοῖς.
- source_word: ἐν πλεονεξίᾳ
  choice: будут алчны
  rationale: Естественная русская передача состояния, выраженного оборотом «быть в алчности»; πλεονεξία здесь означает алчность, стремление присваивать больше.
- source_word: ἁρπάζοντες ἀλλότρια ὡς λέοντες
  choice: станут похищать чужое, словно львы
  rationale: ἁρπάζω передаёт насильственное присвоение или захват, ἀλλότρια — принадлежащее другим; сравнение со львами сохранено.
theological_decisions:
- issue: Неясный референт αὐτοῖς после единственного «Левием»
  choice: вместе с ними
  alternative: вместе с ним / вместе с сыновьями Левия
  rationale: Греческое местоимение стоит во множественном числе. Перевод не исправляет его на единственное и не вводит прямо отсутствующее в тексте уточнение «сыновья Левия».
translation_notes:
  register: Современный литературный русский язык с сдержанным библейским достоинством. Настоящее время первой части и будущее время второй сохранены; синтаксис сделан естественным для обычного читателя.
