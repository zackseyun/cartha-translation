  text: Καὶ τὴν αἰχμαλωσίαν λήψεται⁸⁹ ἀπὸ τοῦ Βελίαρ, [τὰς ψυχὰς τῶν ἁγίων]⁹⁰, *καὶ ἐπιστρέψει⁹¹ καρδίας⁹² ἀπειθεῖς⁹³ πρὸς Κύριον. καὶ δώσει *τοῖς ἐπικαλουμένοις αὐτὸν⁹⁴ εἰρήνην αἰώνιον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/011.yaml
  text: And he will take the captivity from Beliar, even the souls of the holy ones, and he will turn disobedient hearts to the Lord, and he will give eternal peace to those who call on him.
translation:
  language: ru
  text: И он отнимет у Велиара пленников — [души святых] — и обратит непокорные сердца к Господу, и даст призывающим его вечный мир.
  philosophy: optimal-equivalence
  footnotes:
  - marker: души святых
    text: Слова заключены в квадратные скобки в критическом греческом тексте.
    reason: Сохраняет текстологическую оговорку исходного издания, не решая вопрос о принадлежности слов к первоначальному тексту.
lexical_decisions:
- source_word: τὴν αἰχμαλωσίαν λήψεται ἀπὸ τοῦ Βελίαρ
  choice: отнимет у Велиара пленников
  rationale: Греческое сочетание буквально говорит о взятии «плена/пленения» у Велиара; по следующей поясняющей фразе речь идет о находящихся в плену душах, поэтому по-русски естественно передать объект как «пленников».
- source_word: τὰς ψυχὰς τῶν ἁγίων
  choice: души святых
  rationale: Сохранено прямое пояснение того, кого подразумевают пленники; «святых» передает принадлежность людей Богу без конфессионального уточнения.
- source_word: ἐπιστρέψει καρδίας ἀπειθεῖς πρὸς Κύριον
  choice: обратит непокорные сердца к Господу
  rationale: «Обратит» передает направление перемены к Господу; ἀπειθεῖς означает непослушные, непокорные или неверующие, и «непокорные» сохраняет нравственно-религиозную широту слова.
- source_word: τοῖς ἐπικαλουμένοις αὐτόν
  choice: призывающим его
  rationale: Формально передает тех, кто обращается к нему с призывом или молитвой, не конкретизируя сверх текста.
- source_word: εἰρήνην αἰώνιον
  choice: вечный мир
  rationale: Прямой и естественный эквивалент, сохраняющий богословскую полноту понятия мира.
theological_decisions:
- issue: Референт местоимений «он/его»
  choice: Сохранить местоимения без добавления имени или титула
  alternative: Явно назвать Мессию, Господа или Спасителя
  rationale: В предоставленном стихе субъект определяется контекстом, а сам греческий текст использует местоимение; эксплицитное именование устранило бы исходную контекстуальную зависимость.
- issue: Характер «непокорных сердец»
  choice: непокорные сердца
  alternative: неверующие сердца / сердца непослушных
  rationale: Форма ἀπειθεῖς допускает оттенки неверия и непослушания; «непокорные» не сводит смысл только к интеллектуальному неверию.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Синтаксис сохраняет последовательность греческих действий, но «пленение» передано конкретным «пленниками» ради ясности в связи с приложением «души святых».
