source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: V. Φυλάξατε¹ οὖν, *τέκνα μου², *τὴν ἐντολὴν³ τοῦ⁴ Κυρίου καὶ τὸν νόμον αὐτοῦ τηρήσατε⁵· ἀπόστητε⁶ ἀπὸ τοῦ⁷ θυμοῦ⁸, καὶ μισήσατε⁹ τὸ ψεῦδος, ἵνα¹⁰ *Κύριος κατοικήσει ἐν ὑμῖν¹¹ καὶ φεύξεται¹² *ἀφ᾽ ὑμῶν¹³ ὁ Βελίαρ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/001.yaml
  text: Therefore, my children, keep the commandment of the Lord, and keep his law. Depart from anger, and hate falsehood, so that the Lord may dwell in you and Beliar may flee from you.
translation:
  language: ru
  text: Итак, дети мои, храните заповедь Господа и соблюдайте Его закон. Удалитесь от гнева и возненавидьте ложь, чтобы Господь обитал в вас, а Велиар бежал от вас.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξατε
  choice: храните
  rationale: Передаёт повеление беречь и неуклонно держаться заповеди; позволяет сохранить отличие от следующего τηρήσατε.
- source_word: τηρήσατε
  choice: соблюдайте
  rationale: Естественное русское сочетание с «законом», выражающее верность его предписаниям.
- source_word: ἀπόστητε ἀπὸ τοῦ θυμοῦ
  choice: удалитесь от гнева
  rationale: Точно передаёт призыв отступить, отойти от гнева и звучит естественно в современном литературном русском.
- source_word: τὸ ψεῦδος
  choice: ложь
  rationale: Передаёт общее значение неправды и лживости без неоправданного сужения смысла.
- source_word: κατοικήσει ἐν ὑμῖν
  choice: обитал в вас
  rationale: Сохраняет образ пребывания Господа внутри адресатов; русское множественное «в вас» не устраняет возможный коллективный оттенок.
- source_word: ὁ Βελίαρ
  choice: Велиар
  rationale: Традиционная русская передача имени Βελίαρ; имя оставлено без поясняющей интерпретации.
theological_decisions:
- issue: Значение ἐν ὑμῖν
  choice: в вас
  alternative: среди вас
  rationale: Предлог ἐν допускает как внутреннее, так и общинное понимание; буквальное «в вас» сохраняет исходную формулировку и её смысловую напряжённость.
- issue: Связь с ἵνα при формах будущего времени
  choice: чтобы Господь обитал в вас, а Велиар бежал от вас
  alternative: и тогда Господь будет обитать в вас, а Велиар убежит от вас
  rationale: ἵνα естественно выражает цель или ожидаемый результат; конструкция с «чтобы» сохраняет эту связь, не превращая высказывание в безусловное обещание.
translation_notes:
  register: Современный литературный русский с достоинством завещательного наставления. Пара «храните заповедь / соблюдайте закон» сохраняет различие греческих глаголов и избегает тяжеловесного повтора.
