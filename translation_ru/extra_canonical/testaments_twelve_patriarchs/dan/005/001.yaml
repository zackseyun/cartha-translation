  source_fidelity: 'Перевод точно передаёт все основные элементы греческого текста: вводное οὖν («Итак»), обращения τέκνα μου, два повеления с сохранением различия между φυλάξατε и τηρήσατε, призыв отойти от гнева и ненавидеть ложь, целевую связь ἵνα и противопоставление пребывания Господа бегству Велиара. «В вас» корректно сохраняет формулировку ἐν ὑμῖν, не исключая коллективного оттенка.'
