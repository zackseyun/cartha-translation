source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ οὐκέτι ὑπομενεῖ⁹⁸ Ἱερουσαλὴμ ἐρήμωσιν *οὐδὲ αἰχμαλωτισθήσεται Ἰσραήλ⁹⁹, ὅτι¹⁰⁰ Κύριος ἔσται¹⁰¹ *ἐν μέσῳ¹⁰² αὐτῆς¹⁰³ [τοῖς ἀνθρώποις συναναστρεφόμενος]¹⁰⁴ καὶ §¹⁰⁵ Ἅγιος Ἰσραὴλ βασιλεύων¹⁰⁶ ἐπ᾽ αὐτῆς¹⁰⁷ [ἐν *ταπεινώσει καὶ πτωχείᾳ¹⁰⁸, καὶ ὁ πιστεύων *ἐπ᾽ αὐτῷ¹⁰⁹ *βασιλεύσει ἐν τοῖς ἀνθρώποις ἐν ἀληθείᾳ¹¹⁰].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/013.yaml
  text: And Jerusalem will no longer endure desolation, nor will Israel be taken captive, because the Lord will be in her midst [dwelling among men], and the Holy One of Israel reigning over her [in humility and poverty; and the one who believes in him will reign among men in truth].
translation:
  language: ru
  text: И Иерусалим больше не будет терпеть запустения, и Израиль не будет уведён в плен, потому что Господь будет среди него[a], [живя среди людей][b], и Святой Израилев, царствующий над ним[c] [в смирении и бедности; и верующий в Него будет царствовать среди людей в истине][d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «среди неё»; греческое местоимение согласовано с подразумеваемым Иерусалимом как словом женского рода.'
    reason: Русский перевод требует смены грамматического рода.
  - marker: b
    text: Слова «живя среди людей» заключены в скобки в используемом греческом издании и имеют текстуальную неопределённость.
    reason: Отмечает редакционные скобки источника и не выдаёт спорный материал за бесспорный.
  - marker: c
    text: 'Буквально: «и Святой Израилев, царствующий над ней». В греческом стоит причастие, а не отдельная форма будущего времени.'
    reason: Объясняет сохранение причастной конструкции и смену рода местоимения в русском.
  - marker: d
    text: Весь заключённый в скобки фрагмент текстуально неопределён в используемом греческом издании.
    reason: Сохраняет сведения исходного издания о статусе расширенного окончания стиха.
lexical_decisions:
- source_word: οὐκέτι ὑπομενεῖ … ἐρήμωσιν
  choice: уже не будет терпеть опустошение
  rationale: Сохраняет значение ὑπομένω («переносить, претерпевать») и эсхатологическое отрицание οὐκέτι, не заменяя образ более свободным «не будет опустошён».
- source_word: οὐδὲ αἰχμαλωτισθήσεται Ἰσραήλ
  choice: и Израиль не будет уведён в плен
  rationale: Естественно передаёт пассивную форму αἰχμαλωτισθήσεται и значение пленения.
- source_word: ἐν μέσῳ αὐτῆς
  choice: посреди него
  rationale: Местоимение относится к Иерусалиму; в русском названию города соответствует мужской род, хотя в греческом αὐτῆς грамматически женского рода.
- source_word: τοῖς ἀνθρώποις συναναστρεφόμενος
  choice: живя среди людей
  rationale: Причастие означает пребывание и совместную жизнь/общение; «живя среди» звучит естественно и не сужает выражение до одного лишь разговора.
- source_word: Ἅγιος Ἰσραὴλ
  choice: Святой Израилев
  rationale: Устоявшаяся и понятная библейская передача титула «Святой Израиля».
- source_word: βασιλεύων ἐπ᾽ αὐτῆς
  choice: царствуя над ним
  rationale: Сохраняет причастную форму βασιλεύων, не добавляя отдельного будущего глагола; местоимение согласовано в русском с «Иерусалимом».
- source_word: ἐν ταπεινώσει καὶ πτωχείᾳ
  choice: в смирении и бедности
  rationale: Прямо передаёт оба существительных, сохраняя напряжение между царствованием и униженным состоянием.
- source_word: ἐν ἀληθείᾳ
  choice: в истине
  rationale: Формальная и богословски открытая передача, не сводящая выражение только к «по правде» или «подлинно».
theological_decisions:
- issue: Связь титула «Святой Израилев» с Господом
  choice: Сохранена конструкция с союзом «и» и причастием «царствуя» без добавления личной формы глагола
  alternative: «и Святой Израилев будет царствовать над ним»
  rationale: Греческий текст имеет βασιλεύων, причастие, и допускает тесную аппозиционную связь с предшествующим «Господь»; добавление «будет» сделало бы Святого Израилева более явно отдельным грамматическим субъектом.
- issue: Референт местоимения в ἐπ᾽ αὐτῷ
  choice: «верующий в Него» с прописной буквы, относя к Господу / Святому Израилеву
  alternative: «верующий в него» с возможной отсылкой к Иерусалиму
  rationale: Мужской род αὐτῷ естественнее всего отсылает к божественному лицу, тогда как Иерусалим в греческом контексте представлен местоимением женского рода αὐτῆς.
- issue: Смысл «будет царствовать среди людей»
  choice: Сохранено буквальное «будет царствовать», без пояснения природы или сферы этого царствования
  alternative: «будет властвовать над людьми» или «будет жить среди людей как царь»
  rationale: Так сохраняется необычное и богословски напряжённое утверждение исходного текста без конфессионального истолкования.
translation_notes:
  register: Современный литературный русский с достоинством библейской речи. Синтаксис намеренно сохраняет необычную причастную конструкцию оригинала. Квадратные скобки воспроизводят текстуальную маркировку исходного издания; все примечания обозначены в основном тексте.
