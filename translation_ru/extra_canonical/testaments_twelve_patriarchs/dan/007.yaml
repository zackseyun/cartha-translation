base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/007.yaml
  text: 'And when he had said these things, he kissed them affectionately and fell asleep in a good sleep.

    2 And his sons buried him. And after this they carried up his bones to the place where Abraham and Isaac and Jacob were.

    3 Nevertheless, Dan prophesied to them that they would forget their God and would be estranged from the land of their inheritance and from the race of Israel and from the family of their offspring.'
translation:
  language: ru
  text: '7 Сказав это, он нежно поцеловал их и уснул добрым сном.


    2 Его сыновья похоронили его. После этого они перенесли его кости туда, где были Авраам, Исаак и Иаков.


    3 Однако Дан предсказал им[a], что они забудут своего Бога и отдалятся от земли своего наследия, от рода Израиля и от родства своих потомков.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Сохранившийся здесь греческий текст обрывается в начале предсказания; окончание стиха передано по восстановленному тексту данной редакции и её текстовой традиции.
    reason: Примечание отмечает, что содержание пророчества после его начала не засвидетельствовано полностью в приведённом греческом фрагменте.
lexical_decisions:
- source_word: καταφιλήσας
  choice: нежно поцеловал
  rationale: Глагол выражает сердечный, исполненный привязанности поцелуй; наречие передаёт усилительный оттенок естественно для современного русского языка.
- source_word: ὕπνωσεν ὕπνῳ καλῷ
  choice: уснул добрым сном
  rationale: Сохранён образный эвфемизм смерти и необычное определение «добрым», без истолковывающей замены на «умер» или «почил».
- source_word: ἀπήνεγκαν τὰ ὀστᾶ αὐτοῦ
  choice: перенесли его кости
  rationale: ἀπήνεγκαν означает унесение или перенесение; нейтральное «перенесли» не навязывает направление, которого данная греческая форма сама по себе ясно не выражает.
- source_word: ἔνθα ἦν Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: туда, где были Авраам, Исаак и Иаков
  rationale: Сохранена лаконичная формулировка источника без добавления прямо не названного места погребения.
- source_word: ἀποστήσονται / estranged (consultation layer)
  choice: отдалятся
  rationale: Передаёт отчуждение и удаление, не уточняя насильно, было ли оно географическим, общественным или духовным.
theological_decisions:
- issue: Образ сна как обозначение смерти
  choice: сохранить «уснул добрым сном»
  alternative: «мирно умер» или «почил»
  rationale: Исходный текст выражается метафорически; буквальный образ сохраняет богословскую и литературную многозначность.
- issue: Отдаление от земли, рода и семьи
  choice: сохранить три параллельных объекта без пояснительного толкования
  alternative: объяснить это как изгнание, отступничество или смешение с народами
  rationale: Текст допускает несколько взаимосвязанных смыслов, поэтому перевод не закрепляет одну конфессиональную или историческую трактовку.
