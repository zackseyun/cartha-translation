base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002.yaml
  text: 'And now[a], my children, behold, I am dying, and I tell you in truth: unless you guard yourselves from the spirit of falsehood and of anger, and love truth and long-suffering, you will perish. For anger is blindness, and it does not allow one to see the face of any man with truth. Even if it is a father or a mother, he behaves toward them as toward enemies; even if it is a brother, he does not recognize him; even if it is a prophet of the Lord, he disobeys him; even if it is a righteous man, he does not regard him; even if it is a friend, he does not acknowledge him. For the spirit of anger surrounds him with the nets of deceit, and blinds his eyes, and through falsehood darkens his mind, and gives him its own peculiar vision. And with what does it surround his eyes? With hatred of heart, so as to be envious of his brother. Anger is an evil thing, my children[b], because it troubles even the soul itself. And the body of the angry man it makes its own, and over his soul it gains
    mastery, and it bestows power on the body, so that it works every lawless deed. And when the body does all these things, the soul justifies what is done, because it does not see rightly. Therefore he who is wrathful, if he is a mighty man, has a threefold power in his anger: one from the help of his servants, and a second from his wealth, by which he persuades and overcomes unjustly, and a third, because he has his own natural power, and by it he works evil. And if the wrathful man is also poor, he has a twofold power of anger; for it always helps him toward wrongdoing. This spirit goes always with falsehood at the right hand of Satan, so that with cruelty and falsehood his works may be accomplished. Understand, therefore, the power of anger, that it is empty. For first it gives provocation by word; then by deeds it strengthens the one who is angry, and with sharp losses it disturbs his mind, and so it stirs up his soul with great wrath. Therefore, when anyone speaks against you, do
    not be moved to anger; and if anyone praises you as holy men, do not be exalted, either to delight or to disgust. For first it is pleasing to the hearing, and so the mind is stirred to perceive the grounds for provocation; and then, becoming angry, he thinks that he is justly angry. If you fall into any loss or ruin, my children, do not be distressed; for this very spirit makes a man desire what is perishable, in order that he may be angered through the distress. And if the loss comes willingly or unwillingly, do not be vexed; for from vexation false anger is born. Moreover, a twofold mischief is anger with falsehood; and they help one another to destroy the heart. And when the soul is continually disturbed, the Lord departs from it[c], and Beliar rules over it.'
translation:
  language: ru
  text: '2. И теперь, дети мои, вот, я умираю и поистине говорю вам: если вы не будете беречь себя от духа лжи[a] и гнева и не будете любить истину и долготерпение[b], то погибнете.


    Ведь гнев — это слепота: он не позволяет человеку поистине видеть лицо другого. Будь то отец или мать — разгневанный обращается с ними как с врагами; будь то брат — он его не узнаёт; будь то пророк Господа — он ему не повинуется; будь то праведник — он с ним не считается; будь то друг — он его не признаёт. Ибо дух гнева опутывает человека сетями обмана, ослепляет его глаза, ложью омрачает его разум и навязывает ему свой особый взгляд. Чем же он застилает ему глаза? Ненавистью в сердце, чтобы тот завидовал своему брату.


    Гнев — зло, дети мои, потому что он приводит в смятение даже саму душу. Тело разгневанного он делает своим, над его душой обретает власть, а телу придаёт силу совершать всякое беззаконие. И когда тело всё это совершает, душа оправдывает содеянное, потому что не видит верно.


    Поэтому гневливый человек, если он могуществен, в своём гневе обладает тройной силой: первая — помощь его слуг; вторая — богатство, которым он убеждает и несправедливо одерживает верх; третья — его собственная природная сила, посредством которой он творит зло. Если же гневливый человек беден, у него двойная сила гнева, ибо гнев всегда помогает ему творить неправду. Этот дух всегда идёт вместе с ложью по правую руку Сатаны, чтобы дела совершались с жестокостью и ложью.


    Итак, поймите, что сила гнева пуста. Сначала он вызывает раздражение словом, затем делами укрепляет разгневанного, тяжкими потерями приводит его разум в смятение и так возбуждает в его душе великую ярость. Поэтому, когда кто-нибудь говорит против вас, не поддавайтесь гневу; и если кто-нибудь восхваляет вас как святых, не превозноситесь — ни от удовольствия, ни от досады. Сначала это приятно слуху, а затем разум возбуждается, усматривая причины для раздражения; после же человек, разгневавшись, думает, будто гневается справедливо.


    Если вы понесёте какой-либо ущерб или потерпите разорение, дети мои, не приходите в смятение, потому что этот самый дух заставляет человека желать тленного, чтобы из-за утраты он разгневался. И если потеря случилась добровольно или невольно, не досадуйте, ибо из досады рождается ложный гнев.


    Более того, гнев вместе с ложью — двойное зло, и они помогают друг другу погубить сердце. Когда же душа непрестанно пребывает в смятении, Господь отступает от неё, и ею начинает править Велиар[c].


    [a] Или «духа обмана». Греческое слово может означать как ложь в речи, так и более широкую склонность к обману.


    [b] «Долготерпение» можно также передать как «снисходительность» или «терпение», однако выбранное слово полнее сохраняет нравственную весомость призыва.


    [c] Велиар — традиционная форма имени Велиал в иудейской и раннехристианской литературе.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Или «духа обмана». Греческое слово может означать как ложь в речи, так и более широкую склонность к обману.
    reason: lexical_alternative
  - marker: b
    text: «Долготерпение» можно также передать как «снисходительность» или «терпение», однако выбранное слово полнее сохраняет нравственную весомость призыва.
    reason: lexical_alternative
  - marker: c
    text: Велиар — традиционная форма имени Велиал в иудейской и раннехристианской литературе.
    reason: cultural_note
lexical_decisions:
- source_word: πνεῦμα
  choice: дух
  rationale: В наставительном контексте слово обозначает деятельную нравственно-духовную силу, а не просто настроение; это подтверждается дальнейшей связью с Сатаной и Велиаром.
- source_word: ψεύδους
  choice: ложь
  rationale: Абстрактное «ложь» охватывает как неправдивую речь, так и искажение восприятия; «обман» сохранён в сноске как допустимая альтернатива.
- source_word: θυμός
  choice: гнев
  rationale: Это широкое и естественное русское обозначение главного порока главы; при усилении риторики употреблено «ярость».
- source_word: ἀλήθεια
  choice: истина
  rationale: Сохраняет противопоставление лжи и охватывает как истинность, так и нравственную правдивость.
- source_word: μακροθυμία
  choice: долготерпение
  rationale: Передаёт стойкое терпение перед лицом провокации и сохраняет нравственную весомость увещевания.
- source_word: δίκτυα
  choice: сети
  rationale: Сохраняет конкретный образ опутывания обманом.
- source_word: ἴδιον ὅρασιν
  choice: свой особый взгляд
  rationale: Передаёт навязанное гневом искажённое видение, не делая русскую фразу чрезмерно искусственной.
- source_word: φθονεῖν
  choice: завидовать
  rationale: Прямо и естественно обозначает возникающее отношение к брату.
- source_word: ἀνομία
  choice: беззаконие
  rationale: Сохраняет нравственно-правовой оттенок поступков, противных Божьему порядку.
- source_word: κρατεῖ
  choice: обретает власть
  rationale: Выражает господствующий контроль гнева над душой.
- source_word: κενόν
  choice: пуста
  rationale: Сохраняет образ мнимой, обманчивой и в конечном счёте тщетной силы гнева.
- source_word: παροξυσμός / παροξύνειν
  choice: раздражение / возбуждать
  rationale: По контексту передаёт и повод к гневу, и процесс его нарастания; варьирование необходимо для естественного русского синтаксиса.
theological_decisions:
- issue: Нравственно-духовная действенность гнева и лжи
  choice: Сохранить термин «дух» и олицетворённое действие пороков.
  alternative: Свести πνεῦμα к «настроению», «склонности» или психологическому состоянию.
  rationale: Текст связывает эти силы с Сатаной и Велиаром и говорит об их власти над человеком; психологизирующий пересказ ослабил бы мировоззрение источника.
- issue: Отступление Господа от души
  choice: 'Передать прямо: «Господь отступает от неё».'
  alternative: Истолковать как утрату мира, благодати или нравственной ясности.
  rationale: Прямое утверждение сохраняет резкость богословского предостережения и не разрешает его напряжение посредством поясняющего пересказа.
- issue: Сатана и Велиар в одной главе
  choice: Сохранить оба имени раздельно.
  alternative: Отождествить Велиара с Сатаной или заменить одно имя другим.
  rationale: Передача различает фигуры так, как они представлены в текстовой традиции, не навязывая гармонизацию.
translation_notes:
  register: Современный литературный русский язык с достоинством завещательного наставления. Синтаксис сделан ясным для обычного читателя, при этом сохранены повторения, олицетворение гнева и лжи, телесно-зрительные образы и резкие богословские формулировки. Сноски размещены непосредственно при словах, которых они касаются, поскольку маркеры в английском консультационном слое были смещены.
