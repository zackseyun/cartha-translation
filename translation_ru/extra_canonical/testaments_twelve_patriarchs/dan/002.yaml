  revised_text: '2. И теперь, дети мои, вот, я умираю и поистине говорю вам: если вы не будете беречь себя от духа лжи[a] и гнева и не будете любить истину и долготерпение[b], то погибнете.


    Ведь гнев — это слепота: он не позволяет человеку поистине видеть лицо другого. Будь то отец или мать — разгневанный обращается с ними как с врагами; будь то брат — он его не узнаёт; будь то пророк Господа — он ему не повинуется; будь то праведник — он с ним не считается; будь то друг — он его не признаёт. Ибо дух гнева опутывает человека сетями обмана, ослепляет его глаза, ложью омрачает его разум и навязывает ему свой особый взгляд. Чем же он застилает ему глаза? Ненавистью в сердце, чтобы тот завидовал своему брату.


    Гнев — зло, дети мои, потому что он приводит в смятение даже саму душу. Тело разгневанного он делает своим, над его душой обретает власть, а телу придаёт силу совершать всякое беззаконие. И когда тело всё это совершает, душа оправдывает содеянное, потому что не видит верно.


    Поэтому гневливый человек, если он могуществен, в своём гневе обладает тройной силой: первая — помощь его слуг; вторая — богатство, которым он убеждает и несправедливо одерживает верх; третья — его собственная природная сила, посредством которой он творит зло. Если же гневливый человек беден, у него двойная сила гнева, ибо гнев всегда помогает ему творить неправду. Этот дух всегда идёт вместе с ложью по правую руку Сатаны, чтобы дела совершались с жестокостью и ложью.


    Итак, поймите, что сила гнева пуста. Сначала он вызывает раздражение словом, затем делами укрепляет разгневанного, тяжкими потерями приводит его разум в смятение и так возбуждает в его душе великую ярость. Поэтому, когда кто-нибудь говорит против вас, не поддавайтесь гневу; и если кто-нибудь восхваляет вас как святых, не превозноситесь — ни от удовольствия, ни от досады. Сначала это приятно слуху, а затем разум возбуждается, усматривая причины для раздражения; после же человек, разгневавшись, думает, будто гневается справедливо.


    Если вы понесёте какой-либо ущерб или потерпите разорение, дети мои, не приходите в смятение, потому что этот самый дух заставляет человека желать тленного, чтобы из-за утраты он разгневался. И если потеря случилась добровольно или невольно, не досадуйте, ибо из досады рождается ложный гнев.


    Более того, гнев вместе с ложью — двойное зло, и они помогают друг другу погубить сердце. Когда же душа непрестанно пребывает в смятении, Господь отступает от неё, и ею начинает править Велиар[c].


    [a] Или «духа обмана». Греческое слово может означать как ложь в речи, так и более широкую склонность к обману.


    [b] «Долготерпение» можно также передать как «снисходительность» или «терпение», однако выбранное слово полнее сохраняет нравственную весомость призыва.


    [c] Велиар — традиционная форма имени Велиал в иудейской и раннехристианской литературе.'
