  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006.yaml
  text: And now, my children, fear the Lord, and watch yourselves against Satan and his spirits. Draw near to God and to the angel who intercedes for you, for he is a mediator between God and men[a], and for the peace of Israel he will stand against the kingdom of the enemy. Because of this the enemy is eager to trip up all who call on the Lord. For he knows that on the day when Israel turns back, the kingdom of the enemy will be brought to an end. For the very angel of peace will strengthen Israel, so that he may not fall into the uttermost evil. But in the time of the lawlessness of Israel, the Lord will not depart from them, but will pass over to a nation that seeks his will, for none of the angels will be equal to him[b]. And his name will be in every place in Israel and among the nations. Keep yourselves, then, my children, from every evil work, and cast away from yourselves anger and falsehood, and love truth and patience. And what you have heard from your father, pass on also to your
    children, so that the Savior of the nations may receive you; for he is true and patient, gentle and humble, and by his works he teaches the law of the Lord.[c] Therefore depart from all unrighteousness and cling to the righteousness of God, and your offspring will be for salvation forever.
translation:
  language: ru
  text: '1 И теперь, дети мои, бойтесь Господа и берегитесь Сатаны и его духов. 2 Приблизьтесь к Богу и к ангелу, который ходатайствует за вас, потому что он — посредник между Богом и людьми[a] и ради мира Израиля восстанет против царства врага. 3 Поэтому враг старается заставить споткнуться всех, кто призывает Господа. 4 Ведь он знает, что в тот день, когда Израиль обратится, царству врага придёт конец. 5 Ибо сам ангел мира укрепит Израиль, чтобы тот не впал в крайнее зло. 6 Но во время беззакония Израиля Господь не отступит от них, а перейдёт к народу, который ищет Его воли, потому что ни один из ангелов не будет равен Ему[b]. 7 И имя Его будет повсюду в Израиле и среди народов.


    8 Итак, дети мои, берегите себя от всякого злого дела, отбросьте от себя гнев и ложь и любите истину и долготерпение. 9 А то, что вы услышали от своего отца, передайте и вы своим детям, [чтобы Спаситель народов принял вас; ибо Он истинен и долготерпелив, кроток и смирен и Своими делами учит Закону Господа][c]. 10 Итак, отступите от всякой неправедности и держитесь праведности Божьей, и ваш род будет во спасение навеки. 11 И похороните меня рядом с моими отцами.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Выражение «посредник между Богом и людьми» прямо передаёт греческий текст. При этом речь по-прежнему идёт об «ангеле», поэтому перевод не отождествляет его с какой-либо позднее определённой богословской фигурой.
    reason: lexical_alternative
  - marker: b
    text: 'Греческая фраза трудна: в представленном тексте сказано, что Господь «не отступит от них», но затем — что Он «перейдёт к народу, который ищет Его воли». Перевод сохраняет это напряжение, не сглаживая его.'
    reason: alternative_reading
  - marker: c
    text: Заключённая в скобки часть нередко считается позднейшим расширением или вставкой. Здесь она переведена, поскольку присутствует в предоставленном греческом свидетельстве.
    reason: textual_variant
lexical_decisions:
- source_word: φοβήθητε τὸν Κύριον
  choice: бойтесь Господа
  rationale: Сохраняет силу повеления и библейский смысл благоговейного страха; «почитайте» было бы слабее греческого выражения.
- source_word: προσέχετε ἑαυτοῖς ἀπὸ τοῦ Σατανᾶ
  choice: берегитесь Сатаны
  rationale: Естественно передаёт возвратную бдительность и конструкцию со значением предостережения.
- source_word: τῶν πνευμάτων αὐτοῦ
  choice: его духов
  rationale: Передаёт принадлежность или связь духов с Сатаной, не уточняя их функцию сверх сказанного в греческом.
- source_word: τῷ ἀγγέλῳ τῷ παραιτουμένῳ ὑμᾶς
  choice: к ангелу, который ходатайствует за вас
  rationale: Контекст последующего слова «посредник» поддерживает значение заступничества или ходатайства.
- source_word: μεσίτης θεοῦ καὶ ἀνθρώπων
  choice: посредник между Богом и людьми
  rationale: Прямо и естественно передаёт греческое выражение, не устанавливая личность посредника помимо обозначения «ангел».
- source_word: ὑποσκελίζειν
  choice: заставить споткнуться
  rationale: Сохраняет наглядную метафору подножки и падения, избегая более общего «погубить».
- source_word: ἐπιστρέψει Ἰσραήλ
  choice: Израиль обратится
  rationale: В контексте возвращения к Богу «обратится» передаёт религиозно-нравственный смысл глагола, оставаясь обычным библейским русским выражением.
- source_word: συντελεσθήσεται ἡ βασιλεία τοῦ ἐχθροῦ
  choice: царству врага придёт конец
  rationale: По контексту глагол обозначает прекращение царства врага, а не его положительное завершение или исполнение.
- source_word: εἰς τέλος κακῶν
  choice: в крайнее зло
  rationale: Сохраняет идею предельной степени зла и трудность греческого оборота, не заменяя её конкретным толкованием.
- source_word: μετελεύσεται ἐπ᾽ ἔθνει ζητοῦντι τὸ θέλημα αὐτοῦ
  choice: перейдёт к народу, который ищет Его воли
  rationale: Точно сохраняет значение ζητοῦντι «ищущему» и напряжение с предшествующим утверждением, что Господь не отступит от Израиля.
- source_word: κολλήθητε τῇ δικαιοσύνῃ τοῦ Θεοῦ
  choice: держитесь праведности Божьей
  rationale: Передаёт настойчивое присоединение к праведности естественным современным русским оборотом; буквальное «прилепитесь» звучало бы заметно архаичнее.
- source_word: τὸ γένος ὑμῶν ... εἰς σωτηρίαν ἕως τοῦ αἰῶνος
  choice: ваш род обретёт спасение навеки
  rationale: Даёт понятный русский смысл эллиптической конструкции «будет во спасение», не уточняя механизм или богословский статус спасения.
theological_decisions:
- issue: Личность ангела, названного посредником между Богом и людьми
  choice: 'Сохранены оба определения: это «ангел», который «ходатайствует» и является «посредником».'
  alternative: Отождествить его с небесным покровителем Израиля, Мессией или поздней христианской фигурой.
  rationale: Греческий текст соединяет эти определения, но не объясняет личность фигуры; перевод не разрешает эту богословскую неоднозначность.
- issue: Напряжение в стихе 6 между неотступностью Господа от Израиля и переходом к иному народу
  choice: Переданы оба утверждения без согласующего перефразирования.
  alternative: Перевести, что Господь оставит Израиль, либо сменить субъект второго глагола.
  rationale: Предоставленный греческий текст содержит отрицание при отступлении и затем говорит о переходе к народу, ищущему Божьей воли; примечание сообщает о трудности текста.
- issue: Вставной отрывок о Спасителе народов в стихе 9
  choice: Отрывок переведён и заключён в квадратные скобки.
  alternative: Опустить его как позднейшую вставку либо напечатать без текстологического обозначения.
  rationale: Он присутствует в предоставленном греческом свидетельстве, но выделен как текстологически сомнительный; скобки сохраняют и текст, и прозрачность.
- issue: Формула «ваш род будет во спасение навеки»
  choice: Передано как «ваш род обретёт спасение навеки».
  alternative: «Ваш род будет служить спасению навеки» или буквально «будет во спасение».
  rationale: Греческая конструкция допускает некоторую смысловую широту; выбранное чтение наиболее естественно в контексте нравственного увещания, но не разворачивается в конфессиональную доктрину.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским звучанием. Сохранены привычные формы «бойтесь Господа», «праведность Божья», «долготерпение», но избегнуты избыточно архаические обороты. Прописные местоимения при обращении к Богу помогают различать возможные референты в сложном стихе 6; они не используются для навязывания личности ангела-посредника. Стих 11 переведён непосредственно с греческого, хотя в английском консультационном тексте он отсутствует.
