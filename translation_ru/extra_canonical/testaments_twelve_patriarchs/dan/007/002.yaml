  text: And his sons buried him. And after this they carried up his bones to the place where Abraham and Isaac and Jacob were.
translation:
  language: ru
  text: И его сыновья похоронили его. После этого они перенесли его кости туда, где были Авраам, Исаак и Иаков.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθαψαν
  choice: похоронили
  rationale: Естественный современный эквивалент со значением предания погребению.
- source_word: ἀπήνεγκαν
  choice: перенесли
  rationale: Передаёт перемещение останков; русское «отнесли» здесь менее естественно, а направление «вверх», присутствующее в английском слое, не выражено данным греческим глаголом.
- source_word: τὰ ὀστᾶ αὐτοῦ
  choice: его кости
  rationale: Прямое и ясное соответствие греческому выражению.
- source_word: ἔνθα
  choice: туда, где
  rationale: Естественно связывает глагол движения с указанным местом.
theological_decisions:
- issue: Смысл слов «где были Авраам, Исаак и Иаков»
  choice: Сохранена буквальная пространственная формулировка без уточнения, были ли там их тела, гробницы или сами патриархи.
  alternative: «где были погребены Авраам, Исаак и Иаков»
  rationale: Греческий текст не содержит глагола «были погребены»; добавление сняло бы исходную неоднозначность.
translation_notes:
  register: Современный литературный русский язык; краткий, повествовательный и достойный регистр. Союз καί во втором предложении передан не отдельным «и», а естественной русской последовательностью «После этого».
