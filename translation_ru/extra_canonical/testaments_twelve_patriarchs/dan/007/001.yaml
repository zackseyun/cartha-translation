lexical_decisions:
- source_word: καταφιλήσας
  choice: с любовью поцеловал
  rationale: Глагол καταφιλέω обозначает сердечный, нежный поцелуй; оборот передаёт усиленный оттенок естественным современным русским языком.
- source_word: ὕπνωσεν ὕπνῳ καλῷ
  choice: уснул добрым сном
  rationale: Сохранены однокоренная конструкция оригинала и буквальный смысл καλῷ, несмотря на слегка необычное для русского языка сочетание; возможный эвфемистический намёк на смерть не раскрывается прямо.
theological_decisions:
- issue: Возможное употребление сна как образа смерти
  choice: уснул добрым сном
  alternative: почил мирно
  rationale: Выбранный вариант сохраняет образ и неоднозначность греческого текста, не превращая возможный эвфемизм в однозначное указание на смерть.
translation_notes:
  register: Современный литературный русский язык; краткая и торжественно-спокойная повествовательная фраза. Причастная конструкция Καὶ ταῦτα εἰπὼν естественно передана деепричастным оборотом «Сказав это».
