  text: '[3. Πλὴν οὖν¹⁰ προεφήτευσεν αὐτοῖς¹¹ ⌈Δὰν⌉¹² ὅτι ἐπιλά...]'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/007/003.yaml
  text: Nevertheless Dan prophesied to them that they would forget [their God and would be estranged from the land of their inheritance and from the race of Israel and from the family of their offspring].
translation:
  language: ru
  text: И всё же Дан предсказал им, что они забудут [своего Бога, отдалятся от земли своего наследия, от народа Израиля и от рода своих потомков].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: После слов «что они забудут» приведённый греческий текст обрывается; заключённые в квадратные скобки слова представляют восстановление по дополнительному текстовому свидетельству.
    reason: Необходимо явно обозначить границу непосредственно сохранившегося греческого текста и восстановленной части.
lexical_decisions:
- source_word: Πλὴν οὖν
  choice: И всё же
  rationale: Передаёт противительно-переходное значение сочетания естественным и литературным русским оборотом.
- source_word: προεφήτευσεν
  choice: предсказал
  rationale: В данном контексте глагол обозначает пророческое возвещение будущего; «предсказал» понятно современному читателю и не добавляет конфессионального оттенка.
- source_word: ἐπιλά...
  choice: забудут
  rationale: Сохранившееся начало слова согласуется с формой от ἐπιλανθάνομαι — «забывать»; продолжение восстанавливается по привлечённому текстовому свидетельству.
- source_word: γένος Ἰσραήλ
  choice: народ Израиля
  rationale: В этом контексте γένος указывает на общность происхождения; «народ Израиля» звучит по-русски естественнее буквального «род Израиля».
- source_word: οἶκος τοῦ σπέρματος αὐτῶν
  choice: род своих потомков
  rationale: Передаёт семейно-родовое значение οἶκος и значение потомства у σπέρμα, не сводя выражение к буквальному и неясному «дому семени».
theological_decisions:
- issue: Объект забвения и последующее отчуждение находятся в восстановленной части текста
  choice: Включить восстановление в квадратных скобках
  alternative: 'Ограничить перевод сохранившимся фрагментом: «И всё же Дан предсказал им, что они забудут…»'
  rationale: Квадратные скобки позволяют дать связный текст по консультационному свидетельству, одновременно честно обозначая, что эта часть не сохранилась в приведённом греческом фрагменте.
- issue: Ревизионный вариант о перенесении костей
  choice: Не включать его в основной текст
  alternative: «И всё же Дан предсказал им, что после этого они перенесли его кости и положили их неподалёку»
  rationale: Приведённый греческий источник содержит προεφήτευσεν αὐτοῖς ὅτι ἐπιλά..., что непосредственно поддерживает начало «предсказал им, что они забудут…», тогда как слов о костях в представленном фрагменте нет.
translation_notes:
  register: Современный литературный русский язык; тон сдержанный и пророческий. Синтаксис сделан ясным для широкого читателя, а квадратные скобки и примечание сохраняют текстологическую неопределённость.
