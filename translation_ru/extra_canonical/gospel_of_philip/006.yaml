base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/006.yaml
  text: “Jesus” is a hidden name; “Christ” is a revealed name. So “Jesus” is not translated, but he is called by his name “Jesus.” But the name “Christ” in Syriac is “Messiah,” in Greek “Christ,” and all the others have it according to their own language. “The Nazarene” reveals what is hidden. Christ has everything within himself, whether human or angel or mystery, and the Father.
translation:
  language: ru
  text: '«Иисус» — имя скрытое, а «Христос» — имя явленное. Поэтому «Иисус» не переводится: его называют собственным именем — «Иисус». Имя же «Христос» по-сирийски — «Мессия», по-гречески — «Христос», а у всех остальных народов оно звучит на их собственном языке. «Назарянин» являет скрытое. Христос заключает в себе всё — и человеческое, и ангельское, и тайну, и Отца.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: он выполнен по указанному общедоступному английскому свидетельству; непосредственная сверка с коптским текстом ещё не проведена.'
    reason: Предоставленные данные прямо указывают, что проверка по исходному коптскому тексту ожидается; читателю важно знать степень текстовой уверенности.
lexical_decisions:
- source_word: Jesus
  choice: Иисус
  rationale: Традиционная русская форма личного имени; сохранена как непереводимое имя в соответствии с прямым утверждением текста.
- source_word: Christ
  choice: Христос
  rationale: Устоявшаяся русская передача греческого титула; контраст между непереводимым именем и переводимым/явленным титулом сохранён.
- source_word: Messiah
  choice: Мессия
  rationale: Нормальная русская форма семитского титула, указанного свидетельством как сирийское соответствие слову «Христос».
- source_word: revealed / reveals
  choice: явленное / являет
  rationale: Единый корень сохраняет внутреннюю словесную связь отрывка и противопоставление скрытого явленному.
- source_word: The Nazarene
  choice: Назарянин
  rationale: Передаёт титульное употребление существительным и не устраняет возможную игру имени или эпитета.
- source_word: mystery
  choice: тайну
  rationale: «Тайна» естественно и достаточно широко передаёт религиозно-мистериальный смысл, не навязывая узкого технического толкования.
theological_decisions:
- issue: Содержание заключительной фразы о том, что Христос имеет всё внутри себя
  choice: Христос заключает в себе всё — и человеческое, и ангельское, и тайну, и Отца
  alternative: 'У Христа внутри есть всё: человек, ангел, тайна и Отец'
  rationale: Выбранная формулировка звучит естественно по-русски, но сохраняет напряжённое перечисление и включение Отца, не объясняя метафизическое отношение между перечисленными категориями.
- issue: Связь титула «Назарянин» со скрытым
  choice: «Назарянин» являет скрытое
  alternative: «Назарянин» раскрывает то, что скрыто
  rationale: Более буквальная и компактная формулировка сохраняет лексическую связь с «явленным именем» и не уточняет механизм откровения.
translation_notes:
  register: Современный литературный русский язык с достоинством афористического религиозного текста. Синтаксический параллелизм и повтор ключевых слов сохранены. Архаизмы и конфессионально окрашенные пояснения не вводились.
