  text: 'When Abraham […] to see what he was going to see, [he] circumcised the flesh of the foreskin, [telling] us that it is necessary to destroy the flesh.


    [Most (things)] of [the] world can stand and live as long as their [insides are hidden. If they are revealed], they die, as [illustrated] by the visible human being. [As long as] a person’s insides are hidden, that person is alive. If their insides are exposed and come out of them, the person will die. It is the same with a tree. While its root is hidden, it blossoms and grows. If its root is exposed, the tree dries up. This is how it is with everything born in the world, not only the revealed but also the hidden, because as long as the root of evil is hidden, it is strong. But if it is recognized, it dissolves, and if it is revealed, it dies. So the Word says, “Already the axe is laid at the root of the trees.” It will not merely cut, because that which will be cut blossoms again. Instead, the axe digs down into the ground until it brings up the root. Jesus pulled out the root completely, but others did so only partially. As for us, let every one of us dig down to the root of the evil
    within and pull it out from its root in us. It will be uprooted if we recognize it. But if we do not recognize it, it takes root within us and bears its fruit in us. It masters us, and we are forced to serve it. It captures us so that we do what we do [not] want to do, and we do [not] do what we want to do. [It is] powerful because we have not recognized it. It remains active as long as [it exists]. [Ignorance] is the mother of [all evil]. Ignorance will cause [death, because] what exists from [ignorance] did not exist, nor [does it exist], nor will they come into being […] they will be perfected when the whole truth is revealed, because truth is like ignorance. When it is hidden, it rests within itself, but if it is revealed and recognized, it is glorified because it is stronger than ignorance and error. It gives freedom. The Word says, “If you know the truth, the truth will make you free.” Ignorance is slavery; knowledge is freedom. If we know the truth, we will find the fruits of
    truth within us. If we unite with it, it will receive our fullness.


    Now we have what is revealed of creation. We say, “Those who are strong are honorable, but those who are hidden are weak and scorned.” This is how it is with those who are revealed of the truth: they are weak and scorned, but the hidden are strong and honorable. Yet the mysteries of the truth are revealed in types and images.


    The chamber, however, is hidden; it is the Holy within the Holy. At first, the veil concealed how God managed creation, but when the veil is torn and what is inside is revealed, this house will be left behind [like] a desert—or rather, it will be [destroyed]. And all divinity will flee [from] these places, not into the Holies [of the] Holies, because it will not be able to unite with the pure [light] and the [flawless] fullness, [but] it will come to be under the wings of the cross [and under] its arms. This ark will [become their] salvation when the floodwaters surge over them. If some belong to the priesthood, they will be able to enter inside the veil with the high priest. So the veil was not torn only at the top, since then it would have been open only to those at the top. Nor was it torn only at the bottom, since then it would have been revealed only to those at the bottom. Instead, it was torn from top to bottom. Those at the top opened the bottom to us so that we may enter the
    secret of the truth. This truly is what is honorable and strong, but we will enter there through scorned types and weaknesses. They are humbled in the presence of the perfect glory. There is glory better than glory; there is power better than power. So the perfect was opened to us together with the secrets of the truth, the Holies of the Holies were revealed, and the chamber invited us in.


    As long as it is hidden, evil is inactive, but it has not been removed from among the Holy Spirit’s seed. They are servants of evil. But whenever it is revealed, the perfect light will flow out upon everyone, and all who are in it will [receive the chrism]. Then the servants will be set free, and the captives will be redeemed. “[Every] plant [which] my Father who is in heaven [has not] planted [will be] uprooted.” Those who are separated will unite […] will be filled.'
translation:
  language: ru
  text: 'Когда Авраам […] увидеть то, что ему предстояло увидеть, [он] обрезал плоть крайней плоти, [показывая] нам, что плоть необходимо уничтожить.


    [Большинство вещей] этого мира могут существовать и жить, пока их [внутренности скрыты. Если же их открыть], они умирают, как [показывает] видимый человек. [Пока] внутренности человека скрыты, человек жив. Если же внутренности обнажатся и выйдут наружу, человек умрёт. Так же и с деревом. Пока его корень скрыт, оно цветёт и растёт. Если корень обнажить, дерево засохнет. Так происходит со всем рождённым в мире — не только с явным, но и со скрытым. Пока корень зла скрыт, он силён. Но если его распознать, он распадается, а если вывести на свет — умирает. Поэтому Слово говорит: «Уже и топор лежит у корня деревьев».[a] Он не просто срубит дерево, ведь срубленное снова даёт побеги. Напротив, топор углубляется в землю, пока не извлечёт корень. Иисус вырвал корень целиком, другие же — лишь отчасти. Что до нас, пусть каждый докопается до корня зла внутри себя и вырвет его с корнем из себя. Оно будет искоренено, если мы его распознаем. Но если не распознаем, оно укоренится в нас и принесёт в нас
    свой плод. Оно господствует над нами, и мы вынуждены ему служить. Оно берёт нас в плен, так что мы делаем то, чего [не] хотим, и [не] делаем того, чего хотим.[b] [Оно] сильно потому, что мы его не распознали. Пока [оно существует], оно действует. [Неведение] — мать [всякого зла]. Неведение принесёт [смерть, потому что] возникшее из [неведения] не существовало, [не существует] и не возникнет […] они достигнут совершенства, когда откроется вся истина. Ведь истина подобна неведению: пока она скрыта, она покоится сама в себе; когда же она открыта и познана, её прославляют, ибо она сильнее неведения и заблуждения. Она даёт свободу. Слово говорит: «Если вы познаете истину, истина сделает вас свободными».[c] Неведение — рабство, знание — свобода. Если мы познаем истину, то найдём в себе плоды истины. Если соединимся с ней, она примет нашу полноту.


    Теперь перед нами то, что явлено в творении. Мы говорим: «Сильные почитаемы, а скрытые слабы и презираемы». Так же и с явленным от истины: оно слабо и презираемо, а скрытое сильно и почитаемо. Однако тайны истины открываются в прообразах и образах.


    Чертог же скрыт; он — Святое во Святом. Сначала завеса скрывала, как Бог устроял творение. Но когда завеса разорвётся и откроется то, что внутри, этот дом будет оставлен [словно] пустыня — вернее, будет [разрушен]. И вся божественность покинет эти места, но не войдёт во Святое [Святых], потому что не сможет соединиться с чистым [светом] и [непорочной] полнотой, [а] окажется под крыльями креста [и под] его руками. Этот ковчег [станет для них] спасением, когда их захлестнут воды потопа. Если некоторые принадлежат к священству, они смогут войти за завесу вместе с первосвященником. Поэтому завеса разорвалась не только наверху — иначе вход открылся бы лишь тем, кто наверху; и не только внизу — иначе открытое было бы явлено лишь тем, кто внизу. Она разорвалась сверху донизу.[d] Те, кто наверху, открыли нам низ, чтобы мы вошли в тайну истины. Вот что поистине почитаемо и сильно. Но войдём мы туда через презираемые прообразы и немощи. Они умаляются перед совершенной славой. Есть слава, превосходящая
    славу, и сила, превосходящая силу. Так совершенное открылось нам вместе с тайнами истины, Святое Святых было явлено, и чертог пригласил нас войти.


    Пока зло скрыто, оно бездейственно, но ещё не удалено из среды семени Святого Духа. Они — рабы зла. Когда же оно откроется, совершенный свет изольётся на всех, и все пребывающие в нём [получат помазание].[e] Тогда рабы станут свободными, а пленники будут искуплены. «[Всякое] растение, [которое] не [насадил] Мой Небесный Отец, [будет] вырвано с корнем».[f] Разделённые соединятся […] исполнятся.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ср. Мф 3:10; Лк 3:9.
    reason: Указание на цитатный источник образа топора у корня деревьев.
  - marker: b
    text: Ср. Рим 7:15–20.
    reason: Отмечает явную словесно-смысловую параллель, не утверждая прямого цитирования.
  - marker: c
    text: Ср. Ин 8:32.
    reason: Указание на источник изречения об истине и свободе.
  - marker: d
    text: Ср. Мф 27:51; Мк 15:38; Лк 23:45.
    reason: Указание на евангельские рассказы о разорванной храмовой завесе.
  - marker: e
    text: 'Буквально в доступном английском свидетельстве: «получат хрисму»; то есть священное помазание. Восстановленные слова отмечены квадратными скобками.'
    reason: Поясняет редкий обрядовый термин и редакционную реконструкцию.
  - marker: f
    text: Ср. Мф 15:13.
    reason: Указание на источник изречения о растении, не насаждённом Небесным Отцом.
lexical_decisions:
- source_word: flesh
  choice: плоть
  rationale: Сохранён богословски нагруженный термин и намеренная резкость исходного высказывания; он не сводится к нейтральному «тело».
- source_word: recognized / know
  choice: распознать / познать
  rationale: «Распознать» передаёт выявление скрытого зла, тогда как «познать» уместно для цитаты об истине и более широкого духовного знания.
- source_word: Word
  choice: Слово
  rationale: Заглавная буква сохраняет возможную персонификацию или авторитетное речеизречение, не решая однозначно, имеется ли в виду Христос-Логос или Писание.
- source_word: types and images
  choice: прообразы и образы
  rationale: «Прообразы» естественно передаёт символико-типологический смысл; «образы» сохраняет второй, близкий, но не тождественный термин.
- source_word: chamber
  choice: чертог
  rationale: Достоинством и сакральной окраской соответствует таинственному помещению; не добавлено «брачный», поскольку этого уточнения в данном свидетельстве нет.
- source_word: fullness
  choice: полнота
  rationale: Сохранён потенциально технический богословский термин без замены конфессионально или гностически истолкованным эквивалентом.
- source_word: chrism
  choice: помазание
  rationale: Передаёт обрядово-богословский смысл понятным современным словом, не уточняя вещество или конкретный ритуал сверх текста.
- source_word: divinity
  choice: божественность
  rationale: Сохранена абстрактность и необычность выражения; перевод «божество» мог бы ошибочно обозначить отдельное божественное существо.
theological_decisions:
- issue: Уничтожение плоти
  choice: Сохранено прямое «плоть необходимо уничтожить»
  alternative: Смягчить до «отвергнуть плотское»
  rationale: Смягчение разрешило бы богословское напряжение и внесло толкование, которого нет в свидетельстве.
- issue: Статус Слова
  choice: «Слово» с заглавной буквы без пояснения
  alternative: «Писание говорит» или «Логос говорит»
  rationale: Текст допускает более одного понимания; перевод не должен выбирать одно из них без коптской сверки.
- issue: Онтологические утверждения о неведении
  choice: Сохранена повреждённая и грамматически напряжённая последовательность с квадратными скобками и многоточием
  alternative: Перестроить её в связное учение о небытии зла
  rationale: Реконструкция была бы богословским истолкованием и скрыла бы испорченность текста.
- issue: Святое во Святом и Святое Святых
  choice: Сохранены обе разные формулы
  alternative: Унифицировать обе как «Святое Святых»
  rationale: Различие формулировок может быть значимым и не должно устраняться.
- issue: Божественность, покидающая места
  choice: Сохранено необычное высказывание без объяснения субъекта
  alternative: Отождествить её с божественными силами или Духом
  rationale: Такое отождествление отсутствует в доступном свидетельстве и преждевременно снимало бы неясность.
- issue: Семя Святого Духа и местоимение «они»
  choice: Сохранён переход от собирательного «семени» к множественному «они»
  alternative: Исправить на единственное число или явно назвать людей
  rationale: Несогласованность отражает доступный текст и может указывать на подразумеваемых носителей семени.
translation_notes:
  register: Современный литературный русский язык с умеренно сакральной лексикой. Квадратные скобки и многоточия сохранены как сигналы лакун и редакционных восстановлений. Черновик основан на предоставленном публичнодоступном английском свидетельстве; прямая сверка с коптским текстом Nag Hammadi Codex II,3 ещё требуется. Синтаксис местами намеренно сохраняет неясность и напряжение повреждённого источника.
