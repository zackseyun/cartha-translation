base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/009.yaml
  text: 'The children of the heavenly human are more numerous than the children of the earthly human. If Adam has so many children, even though they die, how many children does the perfect human have—those who do not die but are begotten continually?


    The father produces a son, but a son cannot produce a son, because someone who has been born cannot beget sons. The son begets brothers, not sons. All who are begotten in the world are begotten physically, and the others in […] are begotten by him […] out there to the human […] in the […] heavenly place […] it from the mouth […] the Word came out from there. They would be nourished from the mouth [and] become perfect. The perfect are conceived and begotten through a kiss. This is why we also kiss one another, conceiving from the grace within one another.


    There were three who traveled with the Lord all the time: his mother Mary, her sister, and Magdalene, who is called his companion; because Mary is his sister, his mother, and his partner.


    “The Father” and “the Son” are single names. “The Holy Spirit” is a double name, because they are everywhere. They are in heaven and below; they are hidden and revealed. The Holy Spirit is revealed below and hidden in heaven.


    The holy ones are served by the evil powers, because the Holy Spirit has blinded these powers so that they think they are serving an ordinary human when they are actually working for the holy ones. So one day a disciple asked the Lord about a worldly matter. He told him, “Ask your Mother, and she will give you from someone else.”


    The apostles said to the disciples, “May our entire offering acquire salt.” They called […] “salt.” Without it, the offering does not [become] acceptable. But Wisdom [is] childless. Because of this, [she is] called […], this of salt, the place they will […] in their own way. The Holy Spirit […] […] many children.


    What belongs to the father belongs to the son. But as long as the son is little, he is not entrusted with what is his. When he becomes a man, his father gives him everything that belongs to him.


    Those who have been begotten by the Spirit and go astray also go astray through it. Because of this, through this one Spirit it blazes—that is, the fire—and it is extinguished.


    Echamoth is one thing, and Echmoth is another. Echamoth is simply Wisdom, but Echmoth is the Wisdom of Death, which knows death. This is called “the little Wisdom.”'
translation:
  language: ru
  text: 'Дети небесного человека многочисленнее детей земного человека. Если у Адама так много детей, хотя они и умирают, то сколько же детей у совершенного человека — тех, кто не умирает, но непрестанно рождается?


    Отец рождает сына, но сын не может родить сына, потому что рождённый не может рождать сыновей. Сын рождает братьев, а не сыновей. Все рождённые в мире рождены телесно, а другие в […] рождены им […] там, человеку […] в […] небесном месте […] это из уст […] оттуда вышло Слово. Они питались бы из уст [и] стали бы совершенными.[a] Совершенные зачинаются и рождаются через поцелуй. Поэтому и мы целуем друг друга, принимая зачатие от благодати, которая пребывает друг в друге.


    Трое всегда сопровождали Господа: его мать Мария, её сестра и Магдалина, которую называют его спутницей; ведь Мария — его сестра, его мать и его спутница.


    «Отец» и «Сын» — имена одинарные, а «Святой Дух» — имя двойное, потому что они повсюду. Они на небе и внизу; они сокрыты и явлены. Святой Дух явлен внизу и сокрыт на небе.


    Святым служат злые силы, потому что Святой Дух ослепил эти силы, и им кажется, будто они служат обычному человеку, тогда как на самом деле они трудятся для святых. Так, однажды ученик спросил Господа о мирском деле. Тот сказал ему: «Попроси свою Мать, и она даст тебе то, что получит от другого».


    Апостолы сказали ученикам: «Пусть вся наша жертва обретёт соль». Они называли […] «солью». Без неё жертва не [становится] угодной. Но Мудрость бездетна. Поэтому [её] называют […], это соли, место, где они […] по-своему. Святой Дух […] […] много детей.


    Принадлежащее отцу принадлежит и сыну. Но пока сын мал, ему не доверяют того, что принадлежит ему. Когда он становится взрослым, отец отдаёт ему всё, что ему принадлежит.


    Рождённые от Духа, если сбиваются с пути, то и сбиваются через него. Поэтому через один и тот же Дух огонь разгорается и угасает.


    Эхамот — одно, а Эхмот — другое.[b] Эхамот — просто Мудрость, а Эхмот — Мудрость Смерти, которая знает смерть. Её называют «малой Мудростью».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Многоточия в квадратных скобках обозначают утраты или неразборчивые места рукописи; слова в квадратных скобках представляют неполно сохранившийся либо восстановленный текст. Поэтому синтаксис этого фрагмента остаётся прерывистым.
    reason: Необходимо предупредить читателя, что неясность обусловлена состоянием рукописи, а не свободой перевода.
  - marker: b
    text: «Эхамот» и «Эхмот» — транслитерации двух намеренно различённых в тексте имён; далее автор поясняет их как два вида Мудрости.
    reason: Близкие по звучанию незнакомые имена иначе могут показаться опечаткой.
lexical_decisions:
- source_word: heavenly human / earthly human / perfect human
  choice: небесный человек / земной человек / совершенный человек
  rationale: Сохранён повтор ключевого антропологического термина и его противопоставления; «человек» естественнее и шире, чем гендерно маркированное «муж».
- source_word: beget / begotten
  choice: рождать / рождённый; зачинаются и рождаются
  rationale: Повтор корня по возможности сохранён. В высказывании о поцелуе различены зачатие и рождение, как в свидетельстве.
- source_word: physically
  choice: телесно
  rationale: Передаёт противопоставление способа рождения без добавления доктринального толкования.
- source_word: companion / partner
  choice: спутница
  rationale: Слово сохраняет неоднозначность близких отношений и не навязывает значений «жена» или «супруга».
- source_word: single names / double name
  choice: имена одинарные / имя двойное
  rationale: Сохранена необычная формулировка и последующий переход к множественному числу без попытки объяснить его.
- source_word: offering
  choice: жертва
  rationale: В контексте соли и приемлемости это естественный русский культовый термин; не уточняется вид приношения.
- source_word: acceptable
  choice: угодной
  rationale: Передаёт культовую приемлемость жертвы, не добавляя явно не названного адресата.
- source_word: Echamoth / Echmoth
  choice: Эхамот / Эхмот
  rationale: Транслитерация сохраняет намеренное различие двух близких имён.
theological_decisions:
- issue: Личность Святого Духа и множественное число в фразе «они повсюду»
  choice: Сохранено «они», без замены на единственное число
  alternative: 'Согласовать местоимение только со Святым Духом: «он повсюду»'
  rationale: Множественное число является частью трудной аргументации текста и не должно молча исправляться.
- issue: Три Марии и формула «Мария — его сестра, его мать и его спутница»
  choice: Формула переведена буквально, без распределения ролей между разными женщинами
  alternative: Разъяснить, что речь идёт о трёх женщинах по имени Мария
  rationale: Свидетельство допускает такую связь, но прямо её не разъясняет; перевод сохраняет напряжение.
- issue: «Мать» в словах Господа
  choice: Написано с прописной буквы и оставлено без идентификации
  alternative: Отождествить её с Марией или Святым Духом
  rationale: Контекст может предполагать символическое или богословское значение, однако данное место его не раскрывает.
- issue: Дух как средство заблуждения, воспламенения и угасания
  choice: Сохранена причинно-инструментальная формулировка «через него / через один и тот же Дух»
  alternative: Истолковать «дух» как иной, злой дух либо изменить субъект
  rationale: Текст содержит намеренно трудное утверждение; конфессиональное или систематическое сглаживание было бы необоснованным.
- issue: Мудрость, Эхамот и Эхмот
  choice: Персонифицированная «Мудрость» передана с прописной буквы, а термины оставлены именами
  alternative: Развернуть валентинианскую космологическую интерпретацию в основном тексте
  rationale: Это сохраняет собственную терминологию отрывка без привнесения внешней системы.
