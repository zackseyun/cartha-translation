review_pass:
  verdict: revise
  source_fidelity: 'Сверка с предоставленным английским свидетельством показывает несколько устранимых отклонений: «produces/makes» в логионе об отце и сыне точнее передаётся «порождает», а не «рождает»; в речи Господа добавлено отсутствующее в свидетельстве «то, что получит»; в заключительном высказывании огонь был введён как прямой субъект, хотя свидетельство сохраняет сбивчивую конструкцию «it blazes—that is, the fire». Повреждённые фрагменты и их неопределённость сохранены. Прямую проверку по коптскому тексту выполнить нельзя, поскольку в материалах дан только английский witness и прямо указано, что source-language review pending.'
  naturalness: Текст в целом литературен. Исправлены неестественные «имена одинарные / имя двойное» на более ясные «однословные / двусоставное», а также неудачное «принимая зачатие». В повреждённом соляном фрагменте намеренная синтаксическая обрывочность сохранена, но слегка обозначена пунктуацией.
  terminology: Сохранены «небесный/земной/совершенный человек», «Мудрость», «Святой Дух», «спутница», а также намеренно сходные имена «Эхамот» и «Эхмот». Прописная буква в «Мать» сохраняет обращение без конфессиональной идентификации.
  issues:
  - severity: medium
    issue: «Отец рождает сына»
    rationale: В свидетельстве противопоставлены father produces/makes a son и son begets brothers. «Порождает» лучше удерживает это различие, не приписывая отцу именно физическое рождение.
  - severity: medium
    issue: Добавление «то, что получит от другого»
    rationale: Witness говорит лишь «she will give you from someone else». Упоминание получения добавляет невыраженное действие.
  - severity: medium
    issue: Перестройка фразы об огне
    rationale: Формулировка «через один и тот же Дух огонь разгорается и угасает» снимает часть синтаксической неясности witness. Следует сохранить вставное, сбивчивое уточнение «то есть огонь».
  - severity: low
    issue: «Имена одинарные / имя двойное»
    rationale: Это калька, звучащая по-русски неестественно. «Однословные имена» и «двусоставное имя» передают наблюдаемое различие названий без богословского истолкования.
  - severity: low
    issue: «Принимая зачатие от благодати»
    rationale: Русское выражение меняет образ на пассивное получение зачатия. В свидетельстве участники сами conceiving; «зачимая от благодати» точнее.
  revised_text: 'Дети небесного человека многочисленнее детей земного человека. Если у Адама так много детей, хотя они и умирают, то сколько же детей у совершенного человека — тех, кто не умирает, но непрестанно рождается?


    Отец порождает сына, но сын не может породить сына, потому что рождённый не может рождать сыновей. Сын рождает братьев, а не сыновей. Все рождённые в мире рождены телесно, а другие в […] рождены им […] там, человеку […] в […] небесном месте […] это из уст […] оттуда вышло Слово. Они питались бы из уст [и] стали бы совершенными.[a] Совершенные зачинаются и рождаются через поцелуй. Поэтому и мы целуем друг друга, зачиная от благодати, пребывающей друг в друге.


