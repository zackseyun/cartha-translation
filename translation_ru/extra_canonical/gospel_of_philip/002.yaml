  terminology: «Иной век», «залог», «купить/искупить», «положить жизнь», «раствориться/нерастворимы» последовательно передают ключевые образы английского свидетеля. Пассивное «возвышены над миром» не привносит учения, но точнее сохраняет направленность исходной формулировки.
