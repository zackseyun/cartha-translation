base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/002.yaml
  text: 'Those who sow in winter reap in summer. Winter is the world; summer is the other age. Let us sow in the world so that we may reap in summer. For this reason, it is not right for us to pray in winter. Summer follows winter. But if someone reaps in winter, they will not reap but will uproot, since this kind will not produce fruit […] it does not merely come out […] but in the other Sabbath […] it is fruitless.


    Christ came to buy some, to save others, and to redeem still others. He bought those who were strangers, made them his own, and set them apart as a pledge, as he wished. It was not only when he appeared that he laid down his life when he wished; rather, since the day the world came into being, he laid down his life when he wished. Then he came first to take it, since it had been pledged. It was under the power of the robbers who had captured it, but he saved it. He also redeemed those who are good in the world, as well as those who are bad.


    Light and darkness, right and left, are brothers to each other. They are inseparable. Therefore, those who are good are not good, those who are bad are not bad, life is not really life, and death is not really death. For this reason, each one will be dissolved into its origin from the beginning. But those who are exalted above the world cannot be dissolved and are eternal.'
translation:
  language: ru
  text: 'Те, кто сеет зимой, пожинают летом. Зима — это мир, а лето — иной век. Будем сеять в мире, чтобы пожать летом. Поэтому нам не следует молиться зимой.[a] За зимой приходит лето. Но если кто станет жать зимой, тот не пожнёт, а вырвет с корнем, потому что такое не принесёт плода […] оно не просто выходит […] но в иную субботу […] оно бесплодно.[b]


    Христос пришёл, чтобы одних купить, других спасти, а третьих искупить.[c] Чужих Он купил, сделал Своими и, как пожелал, отделил их как залог.[d] Он положил Свою жизнь, когда пожелал, не только тогда, когда явился: с того дня, как возник мир, Он полагал Свою жизнь, когда желал.[e] Затем Он первым пришёл забрать её, поскольку она была отдана в залог. Она находилась во власти разбойников, захвативших её, но Он спас её. И Он искупил как добрых в мире, так и злых.


    Свет и тьма, правое и левое — братья друг другу. Они неразделимы. Поэтому добрые не добры, злые не злы, жизнь на самом деле не жизнь, и смерть на самом деле не смерть.[f] Поэтому каждый растворится в своём изначальном истоке.[g] Но возвысившиеся над миром нерастворимы и вечны.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Фраза «не следует молиться зимой» передана по имеющемуся английскому свидетелю. Её точный смысл и чтение нуждаются в сверке с коптским текстом.
    reason: Необычное утверждение может зависеть от лексики или состояния исходного текста.
  - marker: b
    text: Многоточия в квадратных скобках обозначают утраты текста или места с неуверенным восстановлением; связь сохранившихся частей не вполне ясна.
    reason: Необходимо явно обозначить фрагментарность рукописного места.
  - marker: c
    text: «Купить» и «искупить» передают разные глаголы английского свидетеля; их смысловая близость намеренно сохранена.
    reason: Различие терминов может быть значимо для структуры высказывания.
  - marker: d
    text: Не вполне ясно, кто именно или что именно выступает «залогом» и как это связано с последующим местоимением «она».
    reason: Свидетель сохраняет неоднозначную местоименную референцию.
  - marker: e
    text: 'Буквально по свидетелю: Христос «положил Свою жизнь, когда пожелал» уже со дня возникновения мира. Парадоксальная хронология не разъясняется переводом.'
    reason: Следует сохранить богословское и временное напряжение текста.
  - marker: f
    text: Слова «на самом деле» поясняют подразумеваемое усиление в английском свидетеле, где оно было отмечено скобками.
    reason: Указывает на переводческое уточнение, отсутствующее как бесспорный отдельный элемент источника.
  - marker: g
    text: 'Возможен и более буквальный смысл: «растворится в своём происхождении от начала». Точная формулировка требует проверки по коптскому тексту.'
    reason: Исходное выражение семантически сжато и допускает более одного способа членения.
lexical_decisions:
- source_word: the other age
  choice: иной век
  rationale: Сохраняет эсхатологическое значение «века/эпохи» и не сужает выражение до места или просто будущего времени.
- source_word: pray
  choice: молиться
  rationale: Передаёт свидетельство буквально; необычность утверждения не исправляется толкованием.
- source_word: buy / redeem
  choice: купить / искупить
  rationale: Сохранено намеренное различие коммерчески родственных глаголов, важное для трёхчастной конструкции.
- source_word: pledge
  choice: залог
  rationale: Сохраняет юридико-экономический образ и его связь с последующим возвращением заложенного.
- source_word: laid down his life
  choice: положил Свою жизнь / полагал Свою жизнь
  rationale: Передаёт традиционный образ добровольной отдачи жизни, сохраняя повтор и временное напряжение текста.
- source_word: brothers
  choice: братья
  rationale: Сохранена родственная метафора, а не ослабленное «пары» или «соответствия».
- source_word: dissolved / indissoluble
  choice: растворится / нерастворимы
  rationale: Сохраняет лексическую связь противопоставленных терминов и не подменяет её конфессионально нагруженным «погибнет/нетленны».
- source_word: origin from the beginning
  choice: изначальный исток
  rationale: Естественно по-русски передаёт совмещение понятий начала и происхождения без навязывания конкретной космологии.
theological_decisions:
- issue: Запрет или отрицание молитвы «зимой»
  choice: нам не следует молиться зимой
  alternative: нам неправильно просить зимой
  rationale: Сохранено прямое и богословски напряжённое чтение английского свидетеля; возможная многозначность исходного коптского требует последующей проверки.
- issue: Различие покупки, спасения и искупления
  choice: одних купить, других спасти, а третьих искупить
  alternative: всех приобрести и спасти
  rationale: Не сведены воедино три категории и три действия, поскольку такое сглаживание устранило бы смысловое напряжение текста.
- issue: Предвечное положение Христом жизни
  choice: с того дня, как возник мир, Он полагал Свою жизнь
  alternative: Он предназначил Свою жизнь к отдаче
  rationale: Сохранена странная временная формулировка свидетеля без догматизирующего объяснения.
- issue: Относительность добра, зла, жизни и смерти
  choice: добрые не добры… жизнь на самом деле не жизнь
  alternative: так называемые добрые не являются истинно добрыми
  rationale: Перевод не объясняет парадокс через частную богословскую систему и сохраняет его резкость.
- issue: Конечное растворение и вечность возвысившихся
  choice: каждый растворится… возвысившиеся… нерастворимы и вечны
  alternative: всё возвратится… духовные останутся нетленными
  rationale: Сохранено внутреннее терминологическое противопоставление без импорта учения о конкретных классах людей.
translation_notes:
  register: 'Современный литературный русский язык с достоинством и умеренной формальностью. Синтаксис по возможности ясен для широкого читателя, но парадоксы, повторы, местоименная неоднозначность и фрагментарность сохранены. Заглавные буквы в местоимениях о Христе применены как русская издательская конвенция, не как отдельное богословское утверждение. Проект предварительный: предоставлен только английский публичный свидетель, а прямая сверка с коптским источником ожидается.'
