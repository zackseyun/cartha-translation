id: GPHIL.014
reference: Gospel of Philip — Adam, Eve, and the Bridal Chamber
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  text: 'When Eve was [in] Adam, death didn''t exist. When she separated from him, death came into being. If he [enters] again and receives it for himself, there will be no death.


    "[My] God, my God, why, Lord, [have] you forsaken me?" He said this on the cross, because he was divided in that place. […] that he was begotten through that which […] from God. The […] from the dead […] exists, but […] he''s perfect […] of flesh, but this […] is true flesh […] isn''t true, [but …] image of the true.


    A bridal chamber isn''t for the animals, nor for the slaves, nor for the impure, but it''s for free people and virgins.


    We''re begotten again through the Holy Spirit, but we''re begotten through Christ by two things. We''re anointed through the Spirit. When we were begotten, we were united.


    Without light, no one can see themselves in water or in a mirror; nor again will you be able to see in light without water or mirror. Because of this, it''s necessary to baptize in both: in the light and in the water, but the light is the chrism.


    There were three houses of offering in Jerusalem. The one which opens to the west is called "the Holy." The other one, which opens to the south, is called "the Holy of the Holy." The third, which opens to the east, is called "the Holy of the Holies," the place where the high priest enters alone. Baptism is "the Holy" house. [Redemption] is "the Holy of the Holy." "The [Holy] of the Holies" is the bridal chamber. The [baptism] includes the resurrection [with] the redemption. The redemption is in the bridal chamber. But [the] bridal chamber is better than […] You won''t find its […] those who pray […] Jerusalem. […] Jerusalem who [… Jerusalem], being seen […] these that are called "[the Holies] of the Holies" [… the] veil torn […] bridal chamber except the image [… which] [is above. So] its veil was torn from top to bottom, because it was necessary for some from below to go up above.


    The powers can''t see those who have put on the perfect light, and they can''t bind them. But one will put on that light in the mystery of the union.


    If the female wouldn''t have been separated from the male, she wouldn''t have died with the male. His separation was the beginning of death. Because of this, Christ came to repair the separation that existed since the beginning by uniting the two again. He''ll give life to those who died as a result of the separation by uniting them. Now, the wife unites with her husband in the bridal chamber, and those who have united in the bridal chamber won''t be separated any longer. Because of this, Eve separated from Adam, because she didn''t unite with him in the bridal chamber.


    It was through a breath that Adam''s soul came into being. Its partner was the spirit. That which was given to him was his mother. His soul was [taken] and he was given [life] (Eve) in its place. When he was united […] words that were better than the powers, and they envied him […] spiritual partner […] hidden […] that is, the […] themselves […] bridal chamber so that […] Jesus appeared [… the] Jordan, the [fullness of the kingdom] of heaven. He who [was begotten] before everything was begotten again. He [who was anointed] first was anointed again. He who was redeemed, redeemed again.


    If it''s necessary to speak of a mystery: the Father of everything united with the virgin who came down, and a fire enlightened him on that day. He revealed the great bridal chamber, so his body came into being on that day. He came out of the bridal chamber like the one who came into being from the groom and the bride. That''s the way Jesus established everything within himself. It''s also necessary for each of the disciples to enter into his rest through these things.


    Adam came into being from two virgins: from the Spirit and from the virgin earth. So Christ was begotten from a virgin, to rectify the fall that occurred in the beginning.


    There are two trees growing in Paradise. One begets [animals], the other begets humans. Adam [ate] from the tree that begot animals, [and he] became an animal, and he begot [animals]. So Adam''s children worship the [animals]. The tree […] is fruit […] this they […] ate the […] fruit of the […] beget humans […] of the human of […] God makes the human, [… humans] make [God]. That''s what it''s like in the world: humans make gods and worship their creation. It would be better for the gods to worship humans!


    The truth is that the work of humankind comes from their power, so they''re called "the powers." Their works are their children, who come into being through rest; so their power exists in their works, but the rest is revealed in their children. And you''ll find that this extends to the image. And this is the person in the image: they do their works through their power, but they beget their children through rest.


    In this world, the slaves work for the free. In the kingdom of heaven, the free will serve the slaves. The children of the bridal chamber will serve the children of the [marriage. The] children of the bridal chamber have a [single] name: "Rest." [Being] together they don''t need to take form, [because they have] contemplation […] they''re many […] with those who are in the […] the glories of the […] not […] them […] go down to the [water …] they''ll redeem themselves […] that is, those who have […] in his name, because he said: "[That''s the way] we''ll fulfill all righteousness."'
