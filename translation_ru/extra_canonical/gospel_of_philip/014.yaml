translation:
  language: ru
  text: 'Когда Ева была [в] Адаме, смерти не существовало. Когда она отделилась от него, возникла смерть. Если он снова [войдёт] и примет её в себя, смерти не будет.


    «[Боже] мой, Боже мой, почему, Господи, Ты [оставил] меня?» Он сказал это на кресте, потому что там был разделён. […] что он был рождён через то, что […] от Бога. […] из мёртвых […] существует, но […] он совершенен […] плоти, однако это […] истинная плоть […] не истинна, [но …] образ истинного.


    Брачный чертог — не для животных, не для рабов и не для нечистых, а для свободных и дев.


    Мы рождаемся вновь через Святого Духа, но через Христа мы рождаемся посредством двух вещей. Через Духа мы принимаем помазание. Когда мы родились, мы соединились.


    Без света никто не может увидеть себя в воде или в зеркале; но и в свете ты не сможешь увидеть себя без воды или зеркала. Поэтому необходимо креститься в обоих: в свете и в воде. Свет же — это миро.[a]


    В Иерусалиме было три дома приношения. Тот, что открывается на запад, называется «Святое». Другой, открывающийся на юг, называется «Святое Святого». Третий, открывающийся на восток, называется «Святое святых» — место, куда один лишь первосвященник входит. Крещение — это дом «Святое». [Искупление] — «Святое Святого». «[Святое] святых» — брачный чертог. [Крещение] включает воскресение [вместе с] искуплением. Искупление — в брачном чертоге. Но [брачный] чертог лучше, чем […] Ты не найдёшь его […] молящиеся […] Иерусалим. […] Иерусалим, которые [… Иерусалим], будучи видимым […] те, что называются «[Святое] святых» [… завеса] разорвана […] брачный чертог, кроме образа [… который] [наверху. Поэтому] его завеса разорвалась сверху донизу, ибо некоторым из тех, кто внизу, надлежало подняться наверх.


    Силы не могут увидеть тех, кто облёкся в совершенный свет, и не могут связать их. Но в этот свет человек облечётся в таинстве единения.[b]


    Если бы женское не отделилось от мужского, оно не умерло бы вместе с мужским. Его отделение стало началом смерти. Поэтому Христос пришёл исправить разделение, существовавшее от начала, вновь соединив обоих. Соединяя их, Он даст жизнь тем, кто умер вследствие разделения. Ныне жена соединяется со своим мужем в брачном чертоге, и соединившиеся в брачном чертоге уже не будут разлучены. Потому Ева и отделилась от Адама, что не соединилась с ним в брачном чертоге.


    Душа Адама возникла через дуновение. Её спутником был дух. То, что было дано ему, было его матерью. Его душа была [взята], и вместо неё ему была дана [жизнь] (Ева). Когда он соединился […] слова, превосходившие силы, и они позавидовали ему […] духовный спутник […] сокрытый […] то есть […] самих себя […] брачный чертог, чтобы […] Иисус явился [… в] Иордане — [полнота Царства] Небесного. Тот, кто [был рождён] прежде всего, родился вновь. Тот, кто [был помазан] прежде, был вновь помазан. Тот, кто был искуплен, был вновь искуплен.


    Если надлежит говорить о тайне: Отец всего соединился с девой, сошедшей свыше, и в тот день огонь озарил его. Он явил великий брачный чертог, и потому в тот день возникло его тело. Он вышел из брачного чертога как тот, кто произошёл от жениха и невесты. Так Иисус утвердил всё внутри Себя. И каждому ученику также надлежит через это войти в Его покой.[c]


    Адам возник от двух дев: от Духа и от девственной земли. Так и Христос был рождён от девы, чтобы исправить падение, случившееся в начале.


    В раю растут два дерева. Одно рождает [животных], другое — людей. Адам [вкусил] от дерева, рождавшего животных, [и] стал животным, и породил [животных]. Поэтому дети Адама поклоняются [животным]. Дерево […] есть плод […] это они […] вкусили […] плод […] рождать людей […] человека […] Бог создаёт человека, [… люди] создают [Бога]. Так бывает в мире: люди создают богов и поклоняются своему творению. Лучше было бы богам поклоняться людям!


    Истина в том, что дело людей происходит от их силы, поэтому они называются «силами». Их дела — их дети, возникающие через покой. Итак, их сила пребывает в их делах, а покой открывается в их детях. И ты обнаружишь, что это распространяется и на образ. Таков человек в образе: свои дела он совершает силой, а детей рождает в покое.


    В этом мире рабы трудятся для свободных. В Царстве Небесном свободные будут служить рабам. Дети брачного чертога будут служить детям [брака. У] детей брачного чертога [одно] имя: «Покой». [Пребывая] вместе, они не нуждаются в том, чтобы принимать облик, [потому что обладают] созерцанием […] их много […] с теми, кто пребывает в […] славы […] не […] их […] сойдут в [воду …] они искупят себя […] то есть те, кто […] во имя Его, ибо Он сказал: «[Так] мы исполним всякую праведность».


    [a] «Миро» передаёт обозначение помазания (хризмы); здесь свет отождествляется с обрядовым помазанием.

    [b] «Силы» сохранено как намеренно многозначное обозначение сверхчеловеческих властей; контекст не позволяет безоговорочно уточнить их природу.

    [c] Местоимения в этом повреждённом отрывке допускают разные соотнесения; перевод не устраняет эту неопределённость.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Миро» передаёт обозначение помазания (хризмы); здесь свет отождествляется с обрядовым помазанием.
    reason: Разъясняет непривычное для современного читателя ритуальное значение.
  - marker: b
    text: «Силы» сохранено как намеренно многозначное обозначение сверхчеловеческих властей; контекст не позволяет безоговорочно уточнить их природу.
    reason: Предотвращает необоснованное отождествление с конкретным классом духовных существ.
  - marker: c
    text: Местоимения в этом повреждённом отрывке допускают разные соотнесения; перевод не устраняет эту неопределённость.
    reason: Предупреждает о текстовой и референциальной неясности.
lexical_decisions:
- source_word: bridal chamber
  choice: брачный чертог
  rationale: Сохраняет ритуально-символический характер выражения и звучит достоинственно; «брачная комната» было бы чрезмерно бытовым.
- source_word: chrism
  choice: миро
  rationale: Естественный русский термин для вещества и обряда помазания; связь с помазанием разъяснена в сноске.
- source_word: powers
  choice: силы
  rationale: Сохраняет терминологическую неоднозначность названия сверхчеловеческих властей и словесную связь с «силой» далее в тексте.
- source_word: rest
  choice: покой
  rationale: Передаёт как состояние прекращения труда, так и мистико-эсхатологический смысл, не сводя его к обычному отдыху.
- source_word: redemption
  choice: искупление
  rationale: Сохраняет традиционный религиозный термин и связь с искуплением как отдельной ступенью в последовательности таинств.
- source_word: virgins
  choice: девы
  rationale: Достоинный литературный термин, подходящий к символическому и сакральному регистру.
theological_decisions:
- issue: Единение мужского и женского и происхождение смерти
  choice: Сохранить буквальную образность разделения и повторного единения
  alternative: Истолковать её как исключительно духовную целостность или как учение о браке
  rationale: Текст намеренно связывает Адама, Еву, смерть и брачный чертог; перевод не должен заранее выбирать одну доктринальную интерпретацию.
- issue: «Совершенный свет» и «силы»
  choice: Сохранить мифологически и ритуально насыщенные термины без конфессионального уточнения
  alternative: Назвать силы демонами или ангелами, а свет — благодатью
  rationale: Свидетельство не требует таких однозначных отождествлений.
- issue: Повторное рождение, помазание и искупление Иисуса
  choice: Передать повторяемость формулировок буквально
  alternative: Сгладить их ради согласования с позднейшей ортодоксальной христологией
