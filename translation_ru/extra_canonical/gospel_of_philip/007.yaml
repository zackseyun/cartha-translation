  - severity: medium
    issue: Неточная передача chrism
    rationale: 'Chrism — освящённое ароматическое масло, по-русски «миро», а не действие «помазание миром». Замена необходима также для образной параллели: «в воде есть вода, а в мире — огонь».'
  - severity: medium
