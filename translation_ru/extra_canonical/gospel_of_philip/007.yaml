  naturalness: Регистр в целом удачен. Фраза с лакуной «Те, кто […] совлечь с себя одежду» грамматически не складывается по-русски; её можно сделать читаемой, сохранив указание на повреждение текста. «Но и это изречение» естественнее передать как «Но и это высказывание».
  terminology: «Воскресение», «плоть», «Слово» и «Святой Дух» переданы последовательно и без навязывания конфессионального толкования. «Миро» — точное русское соответствие chrism в данном контексте.
