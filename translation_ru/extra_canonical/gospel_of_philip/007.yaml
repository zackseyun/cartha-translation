translation:
  language: ru
  text: 'Воскресение


    Те, кто говорит, что Господь сначала умер, а потом воскрес, заблуждаются, потому что Он сначала воскрес, а затем умер. Тот, кто прежде не обрёл воскресения, не умрёт. Жив Бог — такой /умрёт\![a]


    Никто не станет прятать нечто великое и ценное в большой вещи; но нередко кто-нибудь помещал несметные тысячи в вещь, стоящую всего одну мелкую монету. Так же и с душой: нечто ценное оказалось в презренном теле.


    Некоторые боятся, что воскреснут нагими. Поэтому они хотят воскреснуть во плоти и не знают, что те, кто носит [плоть], наги. Те, кто […] совлечь с себя одежду, не наги.[b] «Плоть [и кровь не] наследуют Царства [Божьего]». Что же не наследует? То, что на нас. А что тогда наследует? (Плоть) и кровь Иисуса. Поэтому Он сказал: «Кто не ест Моей плоти и не пьёт Моей крови, тот не имеет в себе жизни». Что такое Его плоть? Это Слово, а Его кровь — Святой Дух. Получивший их имеет пищу, питьё и одежду.


    Итак, я не согласен и с теми, кто говорит: «Она не воскреснет». Обе стороны неправы. Вы, говорящие: «Плоть не воскреснет», — скажите мне, что воскреснет, чтобы мы могли воздать вам честь. Вы говорите: «Дух во плоти и этот иной свет во плоти». Но и это изречение — во плоти, потому что, что бы вы ни говорили, вы не можете говорить вне плоти. Необходимо воскреснуть в этой плоти, ведь в ней существует всё. В этом мире люди лучше одежды, которую носят; в Царстве Небесном одежда лучше тех, кто её носит.


    Всё очищается водой и огнём: видимое — видимым, сокрытое — сокрытым. Некоторые вещи сокрыты посредством видимых вещей. В воде есть вода, а в помазании миром — огонь.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Косые черты воспроизводят необычное оформление слова «умрёт» в предоставленном свидетельстве; смысл фразы неясен и, возможно, текст повреждён.
    reason: Сохраняет отмеченную издателем аномалию, не исправляя парадокс предположением.
  - marker: b
    text: Многоточие в квадратных скобках обозначает лакуну рукописи; грамматика и точный смысл фразы остаются неполными.
    reason: Предупреждает читателя, что шероховатость возникла из-за утраты текста, а не из-за стилистики перевода.
lexical_decisions:
- source_word: arose / resurrection
  choice: воскрес / воскресение
  rationale: Сохраняет повтор ключевого слова и парадокс текста; «обрёл воскресение» передаёт acquire без догматического уточнения.
- source_word: flesh
  choice: плоть
  rationale: Традиционный и понятный библейский термин, необходимый для сохранения словесной связи между телесностью, цитатами и спором о воскресении.
- source_word: Word
  choice: Слово
  rationale: Заглавная буква отражает личностно-богословское употребление термина без дополнительного истолкования.
- source_word: Holy Spirit
  choice: Святой Дух
  rationale: Устоявшееся русское соответствие, сохраняющее прямое отождествление крови со Святым Духом в данном тексте.
- source_word: chrism
  choice: помазание миром
  rationale: Передаёт обрядовое значение chrism и избегает непреднамеренной двусмысленности русской формы «в мире».
- source_word: countless thousands / penny
  choice: несметные тысячи / одна мелкая монета
  rationale: Сохраняет резкий контраст огромной ценности и ничтожной вместилищной стоимости, не навязывая исторически конкретный номинал.
theological_decisions:
- issue: 'Парадокс: Господь сначала воскрес, затем умер'
  choice: Сохранён буквально, без согласования с привычной хронологией страстей и воскресения
  alternative: Истолковать «воскрес» как духовное воскресение до телесной смерти
  rationale: Текст намеренно формулирует богословское напряжение; перевод не должен молча разрешать его.
- issue: Что именно воскресает
  choice: Сохранён спор между отрицанием воскресения плоти и необходимостью воскреснуть «в этой плоти»
  alternative: Однозначно представить учение либо о телесном, либо исключительно о духовном воскресении
  rationale: Отрывок критикует обе названные позиции и использует парадокс одежды; однозначная систематизация исказила бы аргумент.
- issue: Плоть и кровь Иисуса как Слово и Святой Дух
  choice: Прямые отождествления сохранены
  alternative: Перефразировать их в сакраментальных или исключительно символических категориях
  rationale: Источник сам предлагает эти определения, но не объясняет точный характер связи; конфессиональное уточнение неуместно.
- issue: Местоимение в «Она не воскреснет»
  choice: Женский род отнесён к плоти по непосредственному контексту
  alternative: Безличное «ничто не воскреснет» или мужское «он не воскреснет»
  rationale: Следующее обращение прямо цитирует тезис «Плоть не воскреснет», поэтому грамматическое восполнение наиболее вероятно, хотя английское it формально допускает более широкую отсылку.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным библейским регистром. Повторы «плоть», «воскреснуть», «одежда» и намеренные парадоксы сохранены. Квадратные скобки, круглые скобки, лакуна и косые черты воспроизводят сигналы предоставленного английского свидетельства. Проект предварительный: выполнен по открытому английскому свидетельству, поскольку непосредственная сверка с коптским текстом Nag Hammadi Codex II,3 ещё ожидается.'
