    reason: Не допустить молчаливого сведения ключевого термина к одной конфессиональной или эзотерической интерпретации.
lexical_decisions:
- source_word: mystery of marriage
  choice: тайна брака
  rationale: Сохраняет религиозно-символическую многозначность слова «тайна» и не подменяет «брак» более узким сакраментальным термином.
- source_word: structure
  choice: устройство
  rationale: Передаёт идею устройства или строения мира, не устраняя лакуну и синтаксическую неясность повреждённого места.
- source_word: impure spirits
  choice: нечистые духи
  rationale: Естественное для русской религиозной речи соответствие, сохраняющее нравственно-ритуальный оттенок определения.
- source_word: male power and a female one
  choice: мужскую и женскую силу
  rationale: Сохраняет парность и намеренно не уточняет, означает ли «сила» духовную способность, сущность или символическое начало.
- source_word: bridal chamber
  choice: брачный чертог
  rationale: Достоинный и понятный термин, сохраняющий особую символику брачного помещения, важную для произведения.
- source_word: image
  choice: образ
  rationale: Не сводит термин ни к внешнему изображению, ни к богословски истолкованному подобию.
- source_word: go inside
  choice: войти в
  rationale: Сохраняет резкий пространственный образ исходного свидетельства, не заменяя его толкованием вроде «овладеть» или «вселиться».
theological_decisions:
- issue: Природа мужской и женской силы
  choice: Сохранено буквальное выражение «мужскую и женскую силу».
  alternative: Истолковать как мужское и женское духовные начала либо как таинственное единство супругов.
  rationale: Текст допускает несколько антропологических и ритуальных прочтений; перевод не должен выбирать одно из них.
- issue: Значение брачного чертога
  choice: Передано как символический «образ брачного чертога» без поясняющего догматического определения.
  alternative: Назвать его таинством, обрядом или небесным союзом.
  rationale: Такие уточнения разрешили бы богословскую напряжённость, которой сам фрагмент не разрешает.
- issue: Соединение образа с ангелом
  choice: Формулировка сохранена без объяснения природы «образа» и «ангела».
  alternative: Отождествить ангела с небесным двойником, хранителем или высшим «я».
  rationale: Свидетельство не даёт достаточных оснований для выбора конкретной интерпретации.
- issue: Пол нечистых духов и человеческие облики
  choice: В контексте духов употреблены выражения «духи мужского/женского пола», а человеческие объекты названы мужчиной и женщиной.
  alternative: Повсюду использовать только «самцы/самки» или только «мужчины/женщины».
  rationale: Так различаются духи, принимающие половые формы, и люди, с которыми они взаимодействуют, без устранения образной параллели.
translation_notes:
  register: Современный литературный русский с достоинством религиозно-философского текста. Синтаксис сделан понятным для обычного читателя, но разрывы, скобки, телесная образность и богословская неоднозначность сохранены. Основа черновика — предоставленное англоязычное свидетельство; прямая проверка по коптскому оригиналу остаётся необходимой.
