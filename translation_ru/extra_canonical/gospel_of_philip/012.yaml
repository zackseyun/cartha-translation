    Нечистые духи принимают мужские и женские [обличья]. Мужские духи — те, что вступают в близость с душами, обитающими в женском облике, а женские — те, что из-за непослушания соединяются с пребывающими в мужском облике. Никто не сможет избежать их пут, если не получит мужскую и женскую силу — жениха и невесту — по образу брачного чертога.[b] Когда неразумные женские существа видят мужчину, сидящего в одиночестве, они набрасываются на него, заигрывают с ним и оскверняют его. Так же и неразумные мужские существа, увидев красивую женщину, сидящую в одиночестве, обольщают её и принуждают её, желая осквернить. Но если они видят мужа и жену, сидящих вместе, то женские существа не могут войти в мужа, а мужские — в жену. Так бывает, когда образ соединяется с ангелом: никто не осмелится войти ни в [мужчину], ни в женщину.'
