translation:
  language: ru
  text: '[Тайна] брака [велика], потому что [без] него мир [не существовал бы]; ведь [устройство мира…], но устройство [… брак]. Задумайся об осквернённой [близости…], потому что она обладает […] силой. Её образ существует в [осквернении].[a]


    Нечистые духи принимают мужские и женские [обличья]. Мужские — это те, что вступают в близость с душами, обитающими в женском облике, а женские — те, что из-за непослушания соединяются с пребывающими в мужском облике. Никто не сможет освободиться от их уз, если не получит мужскую и женскую силу — жениха и невесту — по образу брачного чертога.[b] Когда неразумные духи женского пола видят мужчину, сидящего в одиночестве, они набрасываются на него, заигрывают с ним и оскверняют его. Так же и неразумные духи мужского пола, увидев красивую женщину, сидящую в одиночестве, обольщают её и принуждают, желая осквернить. Но если они видят мужа и жену, сидящих вместе, то женские духи не могут войти в мужа, а мужские — в жену. Так бывает, когда образ соединяется с ангелом: никто не осмелится войти ни в [мужчину], ни в женщину.'
  philosophy: optimal-equivalence
  footnotes:
