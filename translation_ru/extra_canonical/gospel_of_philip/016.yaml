    Домовладелец приобрёл всё: и ребёнка, и раба, и скот, и собаку, и свинью, и пшеницу, [и] ячмень, и солому, и сено, и […], и мясо, и жёлуди. [Но он] мудр и знает, чем кормить каждого. Детям он подал хлеб […], а […] рабам подал […]; скоту [бросил ячмень], солому и сено; собакам бросил кости, [а свиньям] — жёлуди и помои. Так и с учеником Бога. Если он мудр, то понимает, что значит быть учеником. Телесные обличья не обманут его: он посмотрит на состояние души каждого и будет говорить с ним. В мире много животных, которым придан человеческий облик. Ученик распознаёт их. Свиньям он бросит жёлуди, скоту — ячмень с соломой и сеном, собакам — кости, рабам даст закуску, а детям — совершенную [пищу].[d]



