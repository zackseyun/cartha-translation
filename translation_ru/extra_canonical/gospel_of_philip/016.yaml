    Никто [не сможет] узнать, [когда муж] и жена соединяются друг с другом, кроме них самих, потому что мирской брак — тайна для вступивших в него. Если осквернённый брак сокрыт, то насколько же более неосквернённый брак есть истинная тайна! Он не плотский, но чистый; он не от вожделения, но от воли; он не от тьмы или ночи, но от дня и света. Если брак обнажён, он становится порнографией — и не только если невеста принимает семя другого мужчины: даже если она выходит из брачного чертога и её видят, она совершает прелюбодеяние. Пусть она открывается своему отцу, своей матери, другу жениха и детям жениха. Им позволено каждый день входить в брачный чертог. Другие же пусть жаждут хотя бы услышать её голос и насладиться её благоуханием и, словно собаки, едят крошки, падающие со стола. Женихи и невесты принадлежат брачному чертогу. Никто не сможет увидеть жениха и невесту, если [не станет] таким же.[f]'
