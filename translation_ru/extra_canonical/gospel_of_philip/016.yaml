translation:
  language: ru
  text: 'Мир возделывают посредством четырёх вещей. Урожай собирают в житницы благодаря воде, земле, ветру и свету. Так же и Бог возделывает посредством четырёх вещей: веры, надежды, любви и знания. Наша земля — вера, в которой мы укоренены. [А] [вода] — надежда, которой [мы] питаемся. Ветер — любовь, благодаря которой мы растём. А свет — знание, благодаря которому мы [созреваем]. Благодать существует в [четырёх видах. Она] земная, она [небесная, …] небо небес […] через […].[a]


    Блажен тот, у кого нет […] души.[b] Таков Иисус Христос. Он повсюду ходил и никого не обременял. Поэтому блажен такой человек: он человек совершенный, ибо Слово говорит нам, как трудно этому соответствовать. Как нам достичь столь великого? Как он даст покой всем? Прежде всего, не следует причинять скорбь никому — ни великому, ни малому, ни неверующему, ни верующему, — а затем давать покой тем, кто [уже] покоится среди благополучных. Есть такие, кому полезно давать покой благополучному. Тот, кто творит добро, не может дать им покой, потому что не может просто делать всё, что захочет; он не может причинить скорбь, потому что не может причинить страдание. Но порой благополучный причиняет ему скорбь. Не он таков — это их [собственное] зло причиняет им скорбь. Тот, кто обладает природой [совершенного человека], радует доброго, но некоторые из-за этого тяжко скорбят.[c]


    Домовладелец приобрёл всё: и ребёнка, и раба, и скот, и собаку, и свинью, и пшеницу, [и] ячмень, и солому, и сено, и […], и мясо, и жёлуди. [Но он] мудр и знает, чем кормить каждого. Детям он подал хлеб […], а […] рабам подал […]; скоту [бросил ячмень], солому и сено; собакам бросил кости, [а свиньям] — жёлуди и помои. Так и с учеником Бога. Если он мудр, то понимает, что значит быть учеником. Телесные обличья не обманут его: он посмотрит на состояние души каждого и будет говорить с ним сообразно этому. В мире много животных, которым придан человеческий облик. Ученик распознаёт их. Свиньям он бросит жёлуди, скоту — ячмень с соломой и сеном, собакам — кости, рабам даст закуску, а детям — совершенную [пищу].[d]


    Есть Сын Человека, и есть сын Сына Человека. Господь — Сын Человека, а сын Сына Человека — тот, кто творит через Сына Человека. Сын Человека получил от Бога способность творить. Есть у него и способность рождать. Получивший способность творить — творение; получивший способность рождать — рождённый. Тот, кто творит, не может рождать; тот, кто рождает, может творить. Говорят: «Тот, кто творит, рождает». Но рождённое ими — творение. [Поэтому] рождённые ими — не их дети, но они […]. Тот, кто творит, действует [явно] и сам [явлен]. Тот, кто рождает, рождает [тайно], и они сокрыты […] образ. [И ещё:] тот, кто [творит, творит] явно, а тот, кто рождает, [рождает] детей тайно.[e]


    Никто [не сможет] узнать, [когда муж] и жена соединяются друг с другом, кроме них самих, потому что мирской брак — тайна для вступивших в него. Если осквернённый брак сокрыт, то насколько же более неосквернённый брак есть истинная тайна! Он не плотский, но чистый; он не от вожделения, но от воли; он не от тьмы или ночи, но от дня и света. Если брак обнажают, он становится непристойным зрелищем — и не только если невеста принимает семя другого мужчины: даже если она выходит из брачного чертога и её видят, она совершает прелюбодеяние. Пусть она открывается своему отцу, своей матери, другу жениха и детям жениха. Им позволено каждый день входить в брачный чертог. Другие же пусть жаждут хотя бы услышать её голос и насладиться её благоуханием и, словно собаки, едят крошки, падающие со стола. Женихи и невесты принадлежат брачному чертогу. Никто не сможет увидеть жениха и невесту, если [не станет] таким же.[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Квадратные скобки отмечают восстановленные или неуверенно читаемые слова; многоточия в скобках — утраты текста. Весь перевод предварителен до непосредственной сверки с коптским текстом.
    reason: Исходные данные основаны на английском публичном свидетельстве и прямо указывают, что проверка по языку рукописи ещё не проведена.
  - marker: b
    text: После слов «нет» в рукописи имеется утрата; поэтому смысл высказывания о душе остаётся неопределённым.
    reason: Не позволяет воспринять повреждённую фразу как полное и несомненное учение текста.
  - marker: c
    text: Место о том, кто даёт покой, благополучных людях и причиняемой скорби синтаксически неясно; местоименные связи могут пониматься иначе.
    reason: Английское свидетельство само сохраняет трудный и местами неоднозначный ход мысли.
  - marker: d
    text: «Совершенная пища» может обозначать пищу для зрелых или полноту наставления; текст оставляет метафору без разъяснения.
    reason: Сохраняет педагогический и возможный сакральный оттенки без выбора одного из них.
  - marker: e
    text: Этот абзац существенно повреждён. Различие между «творить» и «рождать», а также субъекты некоторых фраз остаются не вполне ясными.
    reason: Предупреждает о невозможности уверенно выстроить законченную онтологическую схему по лакунам.
  - marker: f
    text: 'Выражение «не станет таким же» допускает разные соотнесения: с женихом и невестой, с принадлежащими брачному чертогу или с их состоянием.'
    reason: Сохраняет неопределённость последнего местоименного оборота.
lexical_decisions:
- source_word: farm / is farmed
  choice: возделывать / возделывают
  rationale: Сохраняет земледельческую метафору и её перенос на действие Бога, не сужая смысл до пахоты или посева.
- source_word: knowledge
  choice: знание
  rationale: Передаёт термин нейтрально, без автоматического введения специального термина «гнозис», который мог бы навязать конфессионально-историческую интерпретацию.
- source_word: give rest
  choice: давать покой
  rationale: Сохраняет повторяющийся образ покоя и не подменяет его более узкими значениями вроде утешения или облегчения.
- source_word: slave
  choice: раб
  rationale: Соответствует исторической социальной категории исходного свидетельства; смягчение до «слуги» изменило бы контраст домочадцев.
- source_word: Son of Humanity
  choice: Сын Человека
  rationale: Естественная русская формула, сохраняющая традиционную библейскую узнаваемость и связь между обоими повторными выражениями.
- source_word: create / beget
  choice: творить / рождать
  rationale: Поддерживает ключевое противопоставление произведения творения и рождения потомства.
- source_word: mystery
  choice: тайна
  rationale: Сохраняет двусмысленность между сокрытым действием и сакральной тайной, не фиксируя техническое «таинство».
- source_word: bridal chamber
  choice: брачный чертог
  rationale: Достоинная и узнаваемая формула для помещения и символического образа; последовательность важна для заключительного рассуждения.
- source_word: pornography
  choice: непристойное зрелище
  rationale: Избегает явно современного жанрово-технического оттенка слова «порнография», сохраняя смысл публичного непристойного обнажения.
theological_decisions:
- issue: Статус «знания» в ряду веры, надежды и любви
  choice: Оставлено «знание» без поясняющей догматической квалификации
  alternative: «гнозис» или «богопознание»
  rationale: Свидетельство допускает специальный религиозный оттенок, но предоставленная база не позволяет надёжно определить его границы.
- issue: Неясная фраза «у кого нет […] души»
  choice: Сохранён разрыв рукописи и буквальная напряжённость фразы
  alternative: Восстановить предполагаемое утраченное отрицание или качество души
  rationale: Без коптологической проверки восстановление могло бы радикально изменить антропологический смысл.
- issue: «Сын Человека» и производный «сын Сына Человека»
  choice: Сохранена одинаковая формула и различие прописной/строчной буквы
  alternative: Истолковать вторую фигуру как ученика, творца или духовного потомка
  rationale: Текст сам развивает трудное различение творения и рождения; перевод не должен заранее определять личность второй фигуры.
- issue: Неосквернённый брак и брачный чертог
  choice: Сохранён образ брака как истинной тайны без обозначения его как церковного таинства либо исключительно аллегории
  alternative: «таинство брака» или явно «духовный союз»
  rationale: Так сохраняется одновременно буквальная и символическая напряжённость отрывка.
- issue: Дегуманизирующая образность о животных в человеческом облике
  choice: Передана прямо как риторика самого текста
  alternative: Смягчить до различий в духовной зрелости
  rationale: Смягчение скрыло бы резкость древнего свидетельства; добавленная фраза «сообразно этому» лишь делает синтаксическую связь естественной, не оправдывая образ.
translation_notes:
  register: Современный литературный русский с достоинством древнего поучительного текста. Синтаксис по возможности ясен, но повреждения, резкие переходы и подлинные смысловые напряжения не сглажены. Термины «житницы», «Сын Человека» и «брачный чертог» сохраняют библейскую и раннехристианскую узнаваемость без намеренной архаизации. Черновик основан на предоставленном англоязычном свидетельстве; прямой анализ коптского текста остаётся необходимым.
