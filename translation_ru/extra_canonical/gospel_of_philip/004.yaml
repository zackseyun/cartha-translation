translation:
  language: ru
  text: 'Правители хотели обмануть человечество, потому что увидели, что оно родственно тем, кто поистине добр. Они взяли имена добрых и дали их недобрым, чтобы именами обмануть людей и привязать их к недобрым. И тогда — какое же благодеяние они им оказывают! Они забирают их от недобрых и помещают среди добрых. Правители знали, что делали, ведь они хотели взять свободных и навеки обратить их в рабство.


    Есть силы, которые существуют […] человечество, не желая, чтобы оно было [спасено], дабы оно могло быть […] потому что, если бы человечество [было спасено], жертвоприношений [не] совершалось бы […] и животных не приносили бы силам, ибо те, кому приносили жертвы, были животными. Их приносили в жертву живыми, но, когда их приносили, они умирали. Человек был принесён Богу мёртвым — и ожил.


    До пришествия Христа в мире не было хлеба. Так и в раю, где был Адам, росло много деревьев, чтобы кормить животных, но не было пшеницы, чтобы кормить человечество. Люди питались, как животные. Но когда пришёл Христос, совершенный человек, Он принёс хлеб с небес, чтобы человечество питалось человеческой пищей.


    Правители думали, что действуют собственной силой и волей, но Святой Дух через них тайно совершал всё, что желал. Истина, существующая от начала, сеется повсюду. Многие видят, как её сеют, но лишь немногие видят, как её пожинают.[a]'
