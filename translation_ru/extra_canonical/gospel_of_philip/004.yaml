lexical_decisions:
- source_word: rulers
  choice: правители
  rationale: Сохраняет нейтральное обозначение космических властителей в данном свидетельстве, не вводя без прямой опоры термин «архонты».
- source_word: humanity
  choice: человечество / люди
  rationale: «Человечество» сохраняет собирательный смысл; «люди» употреблено там, где повторение отвлекало бы или требовалась естественная русская фраза.
- source_word: kinship
  choice: родственно
  rationale: Передаёт отношение происхождения или сродства, не уточняя его как исключительно духовное либо природное.
- source_word: powers
  choice: силы
  rationale: Сохраняет отличие от ранее названных «правителей» и возможный смысл сверхъестественных властей.
- source_word: the perfect human
  choice: совершенный человек
  rationale: Формально сохраняет антропологическое именование Христа и не заменяет его конфессионально нагруженным титулом.
- source_word: food of humanity
  choice: человеческая пища
  rationale: Сохраняет противопоставление пище животных, выражая его естественно по-русски.
- source_word: reaped
  choice: пожинают
  rationale: Сохраняет последовательную метафору сеяния и жатвы.
theological_decisions:
- issue: Действия правителей и промыслительное действие Святого Духа
  choice: «Святой Дух через них тайно совершал всё, что желал»
  alternative: Уточнить, что Дух лишь обращал их злые действия ко благу
  rationale: Текст сохраняет напряжение между намерением правителей и действием Духа; пояснение о «благе» отсутствует в предоставленном свидетельстве и потому не добавлено.
- issue: Принесённый Богу мёртвый человек
  choice: «Человек был принесён Богу мёртвым — и ожил»
  alternative: Прямо отождествить человека с Христом и распятием
  rationale: Вероятная христологическая отсылка не раскрыта прямо в данном фрагменте; сохранена исходная неоднозначность.
- issue: «Те, кому приносили жертвы, были животными»
  choice: Сохранено буквально
  alternative: Истолковать власти как звероподобные существа или идолов
  rationale: Необычное утверждение намеренно не сглажено и не истолковано сверх доступного свидетельства.
- issue: Местоимение о Святом Духе
  choice: «всё, что желал»
  alternative: «всё, чего Он желал»
  rationale: Форма согласована с грамматическим родом русского слова «Дух» и остаётся естественной; отсутствие прописного местоимения не умаляет личностного смысла.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Повторы ключевых слов сохранены там, где они несут риторическую или богословскую функцию. Архаизмы сведены к минимуму; оборот «дабы» оставлен лишь внутри сильно фрагментированного предложения, чтобы не создавать ложной разговорной связности. Прописные местоимения применены к Христу по русской издательской норме данного проекта, но не использованы повсеместно как средство конфессионального толкования.
