  naturalness: 'Русский текст в целом литературен и сохраняет афористическую плотность оригинала. Форму «[людей] такого рода называют „прозелитом“» следует согласовать: при множественном указательном обороте естественно «[таких] называют „прозелитами“».'
  terminology: «Еврей», «прозелит», «раб», «Истина», «язычник», а также субстантивированные «живое/мёртвое» приемлемы и не навязывают истолкования. «Благоустраиваются» является осторожной предварительной передачей спорного/непроверенного по коптскому словоупотребления; примечание об этой неопределённости оправдано.
  issues:
