translation:
  language: ru
  text: 'Еврей порождает еврея, и [людей] такого рода называют «прозелитом».[a] Но [прозелит] не порождает другого прозелита. Они подобны […] и порождают других […] им достаточно того, что они появляются на свет.


    Раб ищет лишь свободы; он не ищет имущества своего господина. Но сын — не просто сын: он заявляет права на наследство своего отца. Наследующие мёртвое сами мертвы и наследуют мёртвое. Наследующие живое сами живы и наследуют и живое, и мёртвое. Мёртвые ничего не могут унаследовать — как могут мёртвые наследовать? Если мёртвый унаследует живое, он не умрёт; напротив, мёртвый оживёт ещё больше! Язычник не умирает, потому что он никогда не жил, чтобы умереть. Кто поверил в Истину, тот ожил и рискует умереть, потому что жив с того дня, когда пришёл Христос. Мир создаётся, города благоустраиваются,[b] а мёртвых выносят.


    Когда мы были евреями, мы были без отца — у нас была [только] мать. Но когда мы стали христианами, мы обрели и отца, и мать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова в квадратных скобках восстановлены или подразумеваются переводчиком там, где рукопись повреждена либо формулировка неполна; многоточия в квадратных скобках обозначают утрату текста.
    reason: Необходимо явно объяснить сигналы реконструкции и лакун, сохранённые из свидетельства.
  - marker: b
    text: Смысл соответствующего слова или выражения не вполне ясен; возможны оттенки «украшаются», «устраиваются» или «облагораживаются».
    reason: Передача английского gentrified как современного социально-экономического термина была бы анахроничной, а исходный коптский текст ещё не проверен.
lexical_decisions:
- source_word: Hebrew
  choice: еврей
  rationale: В данном противопоставлении евреев, язычников и христиан современное «еврей» естественнее русского «еврей/иудей»; «древнееврейский» здесь неприменимо.
- source_word: proselyte
  choice: прозелит
  rationale: Сохранён традиционный религиоведческий термин, поскольку значение обращения в иудаизм существенно для хода мысли.
- source_word: slave
  choice: раб
  rationale: Сохраняет резкий юридический и социальный контраст с сыном и наследником; смягчённое «слуга» ослабило бы противопоставление.
- source_word: claims his father’s inheritance for himself
  choice: заявляет права на наследство своего отца
  rationale: Передаёт не просто получение, а притязание сына на принадлежащее ему наследство без излишней юридической тяжеловесности.
- source_word: Truth
  choice: Истина
  rationale: Прописная буква сохраняет вероятное персонифицированное или богословски нагруженное употребление, не определяя его точнее.
- source_word: gentrified
  choice: благоустраиваются
  rationale: Контекстуально передаёт преобразование или украшение городов; современное «джентрифицируются» внесло бы анахроничный социально-экономический оттенок.
- source_word: fatherless
  choice: без отца
  rationale: Прямо сохраняет образ родительства и параллель с последующим обретением отца и матери; «сироты» добавило бы отсутствие обоих родителей.
theological_decisions:
- issue: Жизнь и смерть язычника и верующего
  choice: Сохранить парадоксальную формулировку без пояснительного истолкования
  alternative: Явно определить жизнь и смерть как духовные
  rationale: Текст намеренно удерживает напряжение между буквальным и духовным смыслами; уточнение сузило бы его богословскую многозначность.
- issue: Наследование живого и мёртвого
  choice: Сохранить субстантивированные «живое» и «мёртвое»
  alternative: Перевести как «живые» и «мёртвые»
  rationale: Английское свидетельство допускает предметное или собирательное понимание; средний род сохраняет эту неоднозначность.
- issue: Отец и мать христиан
  choice: Не отождествлять образы с конкретными божественными или церковными реальностями
  alternative: Пояснить мать как Духа, Церковь либо иную фигуру
  rationale: В данном отрывке референты не названы, поэтому конфессиональное или частное толкование было бы импортировано в перевод.
- issue: Приход Христа
  choice: «с того дня, когда пришёл Христос»
  alternative: «с того дня, как пришёл Христос» или истолковать как личное обращение
  rationale: 'Сохранена временная и богословская открытость высказывания: оно может указывать на явление Христа или на иной момент, не уточнённый фрагментом.'
translation_notes:
  register: 'Современный литературный русский с достоинством раннехристианского афористического текста. Повторы «наследуют», «живое/мёртвое» и парадоксы сохранены намеренно. Проект предварительный: он основан на предоставленном англоязычном свидетельстве, поскольку прямая сверка с коптским источником ожидается. Родовые формы в русском выбраны по грамматике и образному строю текста, без попытки сделать их утверждением о поле всех упоминаемых групп.'
