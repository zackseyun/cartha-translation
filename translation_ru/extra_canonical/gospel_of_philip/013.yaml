  text: 'Whoever comes out of the world can no longer be bound, because they were in the world. They are revealed to be above the desire of the [… and] fear. They are master over […]; they are better than envy. If […] come, they—the powers—bind and choke [them]. How will [they] be able to escape the [great powers …]? How will they be able to […]? Some [say], “We are faithful,” so that […] [impure spirit] and demon, because if they had the Holy Spirit, no impure spirit would cling to them. Do not fear the flesh or love it. If you fear it, it will master you; if you love it, it will swallow and choke you.


    A person exists either in this world, in the resurrection, or in the middle places. May I never be found there! There is both good and evil in this world. Its good things are not good, and its evil things are not evil. But there is an evil after this world that is truly evil: what is called “the middle.” It is death. While we are in this world, it is right for us to acquire the resurrection for ourselves, so that when we are stripped of the flesh, we will be found in the rest and will not travel in the middle, because many stray along the way.


    It is good to come out of the world before one sins. Some neither want to nor can, but others, even if they wanted to, would not benefit, because they did not act. Their wanting makes them sinners. But even if they do not want, justice will still be hidden from them. It is not the will, and it is not the act.


    An apostle saw [in a] vision some people confined in a burning house and bound with burning […], thrown […] of the burning […] them in […], and they said to them [… able] to be saved […] they did not want to, and they received […] punishment, which is called “the [outer] darkness,” because it […].


    The soul and the spirit came into being from water and fire. The offspring of the bridal chamber came from water and fire and light. The fire is the chrism; the light is the fire. I am not talking about that formless fire, but about the other one, whose form is white, which is bright and beautiful and gives beauty.


    Truth did not come into the world naked, but came in types and images. It—the world—will not receive truth in any other way. There is a rebirth and an image of rebirth. It is truly necessary to be begotten again through the image. What’s the resurrection and the image? Through the image, it is necessary for it to arise. The bridal chamber and the image? Through the image, it is necessary for them to enter the truth, which is the restoration. It is not only necessary for those who acquire the name of the Father and the Son and the Holy Spirit, but they too have been acquired for you. If someone does not acquire them, the name will also be taken from them. But they are received in the chrism of the […] of the power of the cross. The apostles called this “[the] right and the left,” because this person is no longer a [Christian], but a Christ.


    The Lord [did] everything in a mystery: a baptism, a chrism, a Eucharist, a redemption, a bridal chamber […]. He [said], “I came to make [the below] like the [above and the outside] like the [inside, and to unite] them in the place.” […] here through [types …] Those who say, “[…] there is one above […,” are wrong, because] what is revealed is that […], that [which] is called “what is below,” and what is hidden is to it what is above it, because it is good, and they say “inside and what is outside and what is outside the outside.” So the Lord called destruction “the outer darkness.” There is nothing outside it.


    He said, “My Father who is hidden.” He said, “Enter your closet, shut the door behind you, and pray to your Father who is hidden,” that is, the one who is within all of them. But the one who is within all of them is the fullness. Beyond that, there is nothing else within. This is what is called “that which is above them.”


    Before Christ, some came from where they were no longer able to enter, and they went where they were no longer able to come out. Then Christ came. He brought out those who entered and brought in those who went out.'
translation:
  language: ru
  text: 'Тот, кто выходит из мира, уже не может быть связан, потому что он был в мире. Обнаруживается, что он выше желания [… и] страха. Он господствует над […]; он выше зависти. Если […] приходят, они — силы — связывают и душат [их]. Как смогут [они] избежать [великих сил…]? Как смогут они […]? Некоторые [говорят]: «Мы верны», чтобы […] [нечистый дух] и демон, ведь если бы у них был Святой Дух, никакой нечистый дух к ним не прилепился бы. Не бойся плоти и не люби её. Если боишься её, она станет господствовать над тобой; если любишь её, она поглотит и задушит тебя.


    Человек пребывает либо в этом мире, либо в воскресении, либо в промежуточных местах. Да не окажусь я там! В этом мире есть и добро, и зло. Его блага — не благо, и его зло — не зло. Но после этого мира есть зло, которое поистине является злом: то, что называют «промежуточным». Это смерть. Пока мы в этом мире, нам следует обрести для себя воскресение, чтобы, когда мы снимем с себя плоть, оказаться в покое и не странствовать в промежуточном, потому что многие сбиваются с пути.


    Хорошо выйти из мира прежде, чем согрешишь. Некоторые и не хотят, и не могут; другим же, даже если бы они захотели, это не принесло бы пользы, потому что они не действовали. Само желание делает их грешниками. Но даже если они не хотят, праведность всё равно будет скрыта от них. Дело не в воле и не в поступке.


    Апостол увидел [в] видении людей, заключённых в пылающем доме и связанных пылающими […], брошенных […] пылающего […] их в […]. И им сказали: «[… могут] спастись […]». Они не захотели и получили […] наказание, которое называют «[внешней] тьмой», потому что оно […].


    Душа и дух возникли из воды и огня. Порождение брачного чертога возникло из воды, огня и света. Огонь — это помазание, а свет — огонь. Я говорю не о том бесформенном огне, но о другом, чей облик бел, который сияет, прекрасен и наделяет красотой.


    Истина пришла в мир не обнажённой, но в прообразах и образах. Иначе он — мир — её не примет. Есть рождение свыше и образ рождения свыше. Поистине необходимо вновь родиться через образ. Что такое воскресение и образ? Через образ ему надлежит восстать. Брачный чертог и образ? Через образ им надлежит войти в истину, которая есть восстановление. Не только необходимо обрести имя Отца, и Сына, и Святого Духа — они и сами были обретены для вас. Если кто не обретёт их, у него будет отнято и имя. Но их принимают в помазании […] силы креста. Апостолы назвали это «[правым] и левым», потому что такой человек уже не [христианин], а Христос.[a]


    Господь [совершил] всё в таинстве: крещение, помазание, Евхаристию, искупление, брачный чертог […]. Он [сказал]: «Я пришёл, чтобы сделать [нижнее] подобным [верхнему, а внешнее] — [внутреннему, и соединить] их в этом месте». […] здесь через [прообразы…] Те, кто говорит: «[…] есть один наверху […», ошибаются, потому что] открытое есть то […], что называют «нижним», а скрытое по отношению к нему — то, что выше него, потому что это благо; и говорят: «внутреннее, и внешнее, и то, что вне внешнего». Поэтому Господь назвал погибель «внешней тьмой». За её пределами нет ничего.


    Он сказал: «Отец Мой, Который сокрыт». Он сказал: «Войди в свою кладовую, затвори за собой дверь и молись Отцу твоему, Который сокрыт», то есть Тому, Кто внутри всего. Но Тот, Кто внутри всего, — полнота. За этим внутри нет ничего иного. Это и называют «тем, что выше всего».[b]


    До Христа одни пришли оттуда, куда уже не могли войти, и ушли туда, откуда уже не могли выйти. Затем пришёл Христос. Он вывел вошедших и ввёл вышедших.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Место повреждено. Формула «не христианин, а Христос» сохранена без смягчения; она может опираться на связь слова «Христос» с помазанием.
    reason: Предотвращает ошибочное восприятие редакционного утверждения и указывает на лексическую связь, не разрешая богословскую неоднозначность.
  - marker: b
    text: Последнее место допускает и перевод «тем, что выше них»; из-за неясности соотнесения местоимения выбран контекстуальный вариант «выше всего».
    reason: Фиксирует реальную неоднозначность местоименной отсылки.
lexical_decisions:
- source_word: world
  choice: мир
  rationale: Сохраняет ключевой космологический термин и его намеренно напряжённое противопоставление воскресению и промежуточным местам.
- source_word: middle / middle places
  choice: промежуточное / промежуточные места
  rationale: Передаёт пространственно-состоянийную неоднозначность, не подменяя её позднейшим конфессиональным термином.
- source_word: rest
  choice: покой
  rationale: Естественный русский эквивалент с сохранением эсхатологического оттенка.
- source_word: chrism
  choice: помазание
  rationale: Понятное обозначение ритуала и его вещества; не сужает смысл до одного только масла.
- source_word: bridal chamber
  choice: брачный чертог
  rationale: Сохраняет устойчивый символический и ритуальный образ текста.
- source_word: types and images
  choice: прообразы и образы
  rationale: Различает два связанных понятия и сохраняет их репрезентативный смысл.
- source_word: rebirth / be begotten again
  choice: рождение свыше / вновь родиться
  rationale: Передаёт повторное или высшее рождение естественно по-русски, не устраняя возможную двусмысленность.
- source_word: fullness
  choice: полнота
  rationale: Сохраняет технически нагруженный, но понятный термин без доктринального разъяснения.
- source_word: powers
  choice: силы
  rationale: Сохраняет обозначение надмирных властей, не конкретизируя их природу сверх свидетельства.
theological_decisions:
- issue: Статус «мира» и его добра и зла
  choice: Сохранено парадоксальное утверждение без поясняющей гармонизации.
  alternative: Истолковать добро и зло как лишь кажущиеся или относительные.
  rationale: Текст намеренно создаёт богословское напряжение; уточнение было бы интерпретацией.
- issue: «Не христианин, а Христос»
  choice: Формула переведена буквально и отмечена примечанием о повреждении контекста.
  alternative: Смягчить до «подобен Христу» или «помазанник».
  rationale: Смягчение устранило бы радикальность и возможную техническую терминологию исходного свидетельства.
- issue: Обретение имени и лиц Троицы
  choice: 'Сохранена взаимность формулировки: люди обретают имя, а «они» обретены для людей.'
  alternative: Переформулировать как одностороннее принятие крещения.
  rationale: Место неоднозначно, и конфессиональная конкретизация не оправдана.
- issue: Отец «внутри всего» и полнота
  choice: Сохранён имманентный язык текста без пантеистического или ортодоксально-догматического толкования.
  alternative: Пояснить как присутствие Бога в верующих или в творении.
  rationale: Свидетельство не позволяет уверенно выбрать одно из этих прочтений.
- issue: Таинства
  choice: Слово «таинство» употреблено для mystery, а перечисленные действия названы прямо.
  alternative: Перевести как «тайна» или «тайным образом».
  rationale: Контекст перечисляет ритуальные действия, однако число или позднейшая система таинств не подразумеваются.
translation_notes:
  register: Современный литературный русский с достоинством и умеренной архаической окраской только в цитатах и сакральной лексике. Квадратные скобки и многоточия сохранены как сигналы лакун и редакционных восстановлений. Из-за отсутствия прямой коптологической сверки проект остаётся предварительным и основан на предоставленном публичном английском свидетельстве.
