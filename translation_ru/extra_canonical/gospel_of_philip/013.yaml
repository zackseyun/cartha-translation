  revised_text: "Тот, кто выходит из мира, уже не может быть связан, потому что он был в мире. Обнаруживается, что он выше желания [… и] страха. Он господствует над […]; он выше зависти. Если […] приходят, они — силы — связывают и душат [их]. Как смогут [они] избежать [великих сил …]? Как смогут они […]? Некоторые [говорят]: «Мы верны», чтобы […] [нечистый дух] и демон, ведь если бы у них был Святой Дух, никакой нечистый дух к ним не прилепился бы. Не бойся плоти и не люби её. Если боишься её, она станет господствовать над тобой; если любишь её, она поглотит и задушит тебя.\n\n\n      Человек пребывает либо в этом мире, либо в воскресении, либо в промежуточных местах. Да не окажусь я там! В этом мире есть и добро, и зло. Его блага — не благо, и его зло — не зло. Но после этого мира есть зло, которое поистине является злом: то, что называют «промежуточным». Это смерть. Пока мы в этом мире, нам следует обрести для себя воскресение, чтобы, когда мы будем совлечены с плоти, оказаться в покое\
    \ и не странствовать в промежуточном, потому что многие сбиваются с пути.\n\n\n      Хорошо выйти из мира прежде, чем согрешишь. Некоторые и не хотят, и не могут; другим же, даже если бы они захотели, это не принесло бы пользы, потому что они не действовали. Само желание делает их грешниками. Но даже если они не хотят, праведность всё равно будет скрыта от них. Дело не в воле и не в поступке.\n\n\n      Апостол увидел [в] видении людей, заключённых в пылающем доме и связанных пылающими […], брошенных […] пылающего […] их в […]; и им сказали [… могут] спастись […]. Они не захотели и получили […] наказание, которое называют «[внешней] тьмой», потому что оно […] .\n\n\n      Душа и дух возникли из воды и огня. Порождение брачного чертога возникло из воды, огня и света. Огонь — это помазание, а свет — огонь. Я говорю не о том бесформенном огне, но о другом, чей облик бел, который сияет, прекрасен и наделяет красотой.\n\n\n      Истина пришла в мир не обнажённой, но в прообразах и образах.\
    \ Иначе он — мир — не примет её. Есть новое рождение и образ нового рождения. Поистине необходимо снова быть рождённым через образ. Что такое воскресение и образ? Через образ ему надлежит восстать. Брачный чертог и образ? Через образ им надлежит войти в истину, которая есть восстановление. Не только тем, кто обретает имя Отца, и Сына, и Святого Духа, это необходимо, но и они сами были обретены для вас. Если кто не обретёт их, у него будет отнято и имя. Но их принимают в помазании […] силы креста. Апостолы назвали это «[правое] и левое», потому что такой человек уже не [христианин], а Христос.[a]\n\n\n      Господь [совершил] всё в таинстве: крещение, помазание, Евхаристию, искупление, брачный чертог […]. Он [сказал]: «Я пришёл, чтобы сделать [нижнее] подобным [верхнему, а внешнее] — [внутреннему, и соединить] их в том месте». […] здесь через [прообразы …] Те, кто говорит: «[…] есть один наверху […», ошибаются, потому что] открытое есть то […], что называют «нижним», а скрытое по отношению\
    \ к нему — то, что выше него, потому что это благо; и говорят: «внутреннее, и внешнее, и то, что вне внешнего». Поэтому Господь назвал погибель «внешней тьмой». За её пределами нет ничего.\n\n\n      Он сказал: «Отец Мой, Который сокрыт». Он сказал: «Войди в свою комнату, затвори за собой дверь и молись Отцу твоему, Который сокрыт», то есть Тому, Кто внутри всех их. Но Тот, Кто внутри всех их, — полнота. За этим внутри нет ничего иного. Это и называют «тем, что выше них».[b]\n\n\n      До Христа одни пришли оттуда, куда уже не могли войти, и ушли туда, откуда уже не могли выйти. Затем пришёл Христос. Он вывел вошедших и ввёл вышедших."
