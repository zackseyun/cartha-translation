  yaml_path: translation/extra_canonical/gospel_of_philip/010.yaml
  text: 'Some animals submit to humans, such as the calf, the donkey, and others of this kind. Others are not submissive and live alone in the wilderness. Humanity plows the field with the submissive animals and, consequently, nourishes itself and the animals, whether submissive or not. That''s what it''s like with the perfect human: they plow with the submissive powers, preparing for everyone that will exist. So because of this the whole place stands, whether the good or the evil, and the right and the left. The Holy Spirit shepherds everyone and rules all the powers—those that are submissive, those that [aren''t], and those that are alone—because truly it […] confines them [so that …] want to, they won''t be able to [leave].


    [The one who''s been] formed [is beautiful, but] you''d find his children being noble forms. If he weren''t formed but begotten, you''d find that his seed was noble. But now he was formed, and he begot. What nobility is this? First there was adultery, and then murder; and he (Cain) was begotten in adultery, because he was the son of the serpent. Because of this he became a murderer like his father too, and he killed his brother (Abel). Every partnership between those who are dissimilar is adultery.'
translation:
  language: ru
  text: 'Есть животные, которые покоряются человеку, например телёнок, осёл и другие подобные им. Другие не покоряются и живут одни в пустыне. Человек пашет поле с помощью покорных животных и благодаря этому кормит и себя, и животных — как покорных, так и непокорных. Так же и совершенный человек: он пашет с помощью покорных сил, готовя всё для каждого, кто будет существовать. Поэтому всё это место[a] сохраняется — и доброе, и злое, и правое, и левое. Святой Дух пасёт всех и властвует над всеми силами — покорными, [непокорными] и теми, что пребывают одни, — потому что Он поистине […] удерживает их, [так что, даже если они …] захотят, то не смогут [уйти].[b]


    [Тот, кто был] создан, [прекрасен, но] его дети, как можно было бы увидеть, — благородные образы. Если бы он был не создан, а рождён, то его семя, как можно было бы увидеть, было бы благородным. Но он был создан и породил. Что же это за благородство? Сначала было прелюбодеяние, а затем убийство. И он, Каин, был рождён от прелюбодеяния, потому что был сыном змея. Поэтому и он стал убийцей, подобно своему отцу, и убил своего брата, Авеля. Всякое соединение несходных — прелюбодеяние.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по доступному английскому свидетелю: «всё место». Возможно, выражение имеет космологический смысл, но прямой разбор коптского текста ещё не выполнен.'
    reason: Необычное выражение неоднозначно и не должно молча заменяться толкованием.
  - marker: b
    text: Квадратные скобки обозначают восстановленный или утраченный текст рукописи, а многоточие — лакуну. Синтаксис этого места остаётся неполным.
    reason: Необходимо явно сохранить сигналы повреждения рукописи и не создавать ложной уверенности в реконструкции.
  - marker: c
    text: «Соединение» передаёт слово английского свидетеля partnership; возможны также значения «союз», «общность» или «сопряжение». Что именно делает стороны «несходными», текст здесь не уточняет.
    reason: Ключевой заключительный афоризм допускает несколько смысловых оттенков.
lexical_decisions:
- source_word: submit / submissive
  choice: покоряться / покорный
  rationale: Сохраняет повтор ключевого понятия и связь между животными и «силами», не сужая смысл до приручённости или послушания.
- source_word: perfect human
  choice: совершенный человек
  rationale: Формально передаёт антропологический термин и избегает гендерно неестественных конструкций во множественном числе.
- source_word: powers
  choice: силы
  rationale: Сохраняет широкое и потенциально космологическое значение, не уточняя природу этих сил.
- source_word: the whole place
  choice: всё это место
  rationale: Сохраняет необычную пространственную формулировку свидетеля, не заменяя её толкованием вроде «мир» или «творение».
- source_word: formed / begotten
  choice: создан / рождён
  rationale: Передаёт намеренное противопоставление изготовления или создания и рождения; одинаковые корни последовательно повторены.
- source_word: noble forms
  choice: благородные образы
  rationale: «Образы» естественнее буквального «формы» применительно к детям, при этом метафизическая оттеночность выражения сохраняется.
- source_word: partnership
  choice: соединение
  rationale: Позволяет сохранить общий характер заключительного афоризма и его связь с сексуальной метафорой, не ограничивая смысл браком или деловым союзом.
- source_word: dissimilar
  choice: несходные
  rationale: Сохраняет неопределённость критерия различия и не вводит доктринального объяснения.
theological_decisions:
- issue: Роль Святого Духа по отношению ко всем силам
  choice: «пасёт всех и властвует над всеми силами»
  alternative: «ведёт всех» или «управляет всеми духовными властями»
  rationale: Сохранены пастырский образ и всеобщность власти без уточнения онтологического статуса «сил».
- issue: Доброе и злое, правое и левое
  choice: Сохранены обе пары без истолкования
  alternative: Объяснить их как нравственные или космологические стороны
  rationale: Текст намеренно ставит противоположности рядом; перевод не должен устранять богословское напряжение.
- issue: Каин как сын змея
  choice: Передано как прямое утверждение текста
  alternative: Смягчить до метафоры или снабдить догматическим опровержением
  rationale: Задача перевода — точно представить собственное утверждение произведения, не гармонизируя его с иной традицией.
- issue: «Отец» Каина
  choice: «подобно своему отцу» без поясняющей подстановки
  alternative: «подобно змею, своему отцу»
  rationale: Сохранена референциальная связь исходного отрывка без дополнительного усиления толкования.
- issue: Заключительное определение прелюбодеяния
  choice: «Всякое соединение несходных — прелюбодеяние»
  alternative: Уточнить, какие именно существа или категории считаются несходными
  rationale: Афоризм оставлен широким и резким, как в свидетеле; предполагаемая система категорий не реконструируется.
translation_notes:
  register: 'Современный литературный русский язык с достоинством и умеренной формальностью. Повторы «покорный», «создан/рождён» и «благородный» сохранены как смысловые связки. Местоимение «Он» применительно к Святому Духу выбрано по русской грамматике и христианской письменной норме, хотя доступная английская форма it сама по себе не решает вопрос персонификации. Черновик предварительный: он основан на предоставленном англоязычном публичном свидетеле; требуется непосредственная сверка с коптским текстом Nag Hammadi Codex II,3.'
