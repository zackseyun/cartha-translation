  revised_text: 'Бог — красильщик. Подобно тому как хорошие краски — их называют истинными — умирают вместе с тем, что ими окрашено, так и те, кого окрасил Бог. Поскольку его краски бессмертны, они становятся бессмертными благодаря его цветам. Но Бог крестит в воде.


