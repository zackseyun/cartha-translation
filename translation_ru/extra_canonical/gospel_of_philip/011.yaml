    Стеклянные и глиняные сосуды возникают посредством огня. Но если стеклянные сосуды разбиваются, их делают заново, потому что они возникли посредством дыхания; если же разбиваются глиняные сосуды, их уничтожают, потому что они возникли без дыхания.


