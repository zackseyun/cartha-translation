translation:
  language: ru
  text: 'Бог — красильщик. Хорошие краски — их называют стойкими — умирают вместе с тем, что ими окрашено; так же происходит и с теми, кого окрасил Бог. Поскольку его краски бессмертны, они становятся бессмертными благодаря его цветам. Но Бог крестит в воде.


    Никому невозможно увидеть что-либо истинно существующее, если он не уподобится увиденному. В мире всё не так: человек видит солнце, не становясь солнцем, и видит небо, землю и всё прочее, не становясь ими. Но там иначе. Ты увидел нечто из того места и стал этим. Ты увидел Духа — стал духом; увидел Христа — стал Христом; увидел [Отца —] станешь отцом. Поэтому [здесь] ты видишь всё, но не [видишь себя]; там же ты видишь себя, потому что [станешь] тем, что видишь.


    Вера принимает, любовь даёт. [Никто не сможет] [принять] без веры, и никто не сможет дать без любви. Поэтому мы верим, чтобы принять, и даём, чтобы любить, ведь тот, кто даёт не с любовью, не получает от этого никакой пользы. Кто ещё не принял Господа, тот всё ещё еврей.


    Апостолы, жившие прежде нас, называли его «Иисус Назарянин Мессия», то есть «Иисус Назарянин Христос». Последнее имя — «Христос», первое — «Иисус», а среднее — «Назарянин». «Мессия» имеет два значения: и «Христос», и «отмеренный». «Иисус» по-еврейски означает «искупление». «Назара» означает «истина». Поэтому «Назарянин» — это «истина». «Христос» — тот, кто был отмерен. «Назарянин» и «Иисус» — те, кто были отмерены.[a]


    Жемчужина не становится менее ценной, если её бросить в грязь, и не становится более ценной, если её умастить бальзамом: она всегда ценна для своего владельца. Так и дети Божьи: где бы они ни находились, они по-прежнему ценны для своего Отца.


    Если ты скажешь: «Я иудей», никто не дрогнет. Если скажешь: «Я римлянин», никто не встревожится. Если скажешь: «Я грек», «варвар», «раб», [«свободный»], никто не смутится. [Если] ты [скажешь]: «Я христианин», — […] содрогнется. Если бы только [… такого] рода — тот, кто […] не сможет вынести, [услышав] его имя.


    Бог — пожиратель людей. Поэтому человек [приносится] ему [в жертву]. Прежде чем в жертву был принесён человек, приносили животных, потому что те, кому их приносили, не были богами.


    Стеклянные и глиняные сосуды возникают посредством огня. Но если стеклянные сосуды разбиваются, их делают заново, потому что они возникли посредством дыхания; если же разбиваются глиняные сосуды, их уничтожают, потому что они возникли без дыхания.


    Осёл, вращавший жернов, прошёл сто миль. Когда его отвязали, он обнаружил, что всё ещё находится на том же месте. Многие люди странствуют, но никуда не приходят. Когда настал вечер, они не увидели ни города, ни селения, ни чего-либо сотворённого или природного, ни силы, ни ангела. Несчастные трудились напрасно.


    Евхаристия — это Иисус, потому что по-сирийски его называют «Фарисата», то есть «тот, кто распростёрт», ведь Иисус пришёл, чтобы распять мир.[b]


    Господь вошёл в красильню Левия. Он взял семьдесят две краски и бросил их в чан. Он вынул их все белыми и сказал: «Вот так Сын Человеческий пришёл [как] красильщик».


    Премудрость, которую называют «бесплодной», — Мать [ангелов] и спутница […] Мария Магдалина [… он любил её] больше учеников [… он] целовал её в […] много раз. Остальные […] […] сказали ему: «Почему ты любишь её больше всех нас?» Спаситель ответил им: «Почему я не люблю вас так, как её? Когда слепой и зрячий оба находятся во тьме, между ними нет различия. Когда приходит свет, зрячий увидит свет, а слепой останется во тьме».


    Господь сказал: «Блажен тот, кто существует прежде, чем обрести существование, потому что существующий существовал и будет существовать».[c]


    Превосходство человека проявляется не в видимом, а заключено в сокрытом. Поэтому человек господствует над животными, которые сильнее и больше его как в видимом, так и в сокрытом. Благодаря этому животные остаются в живых; но если человек отдаляется от них, они убивают, кусают и пожирают друг друга, потому что не находят пищи. Теперь же они нашли пищу, потому что человек возделал землю.


    Если кто-либо сходит в воду и выходит из неё, ничего не получив, а затем говорит: «Я христианин», он взял это имя взаймы под проценты. Но если он принимает Святого Духа, то получает имя в дар. У получившего дар его не отнимают, а взявший взаймы под проценты должен возвратить долг. Так происходит, когда человек обретает существование в таинстве.


    [a] Приведённые в тексте толкования имён и игра слов переданы буквально по имеющемуся свидетельству; они не соответствуют общепринятой еврейской этимологии.

    [b] Связь сирийского слова «Фарисата» с выражением «тот, кто распростёрт», а также образ «распять мир» сохранены без смыслового сглаживания.

    [c] Парадоксальная формулировка сохранена; текст допускает разные понимания соотношения предсуществования и обретения существования.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Приведённые в тексте толкования имён и игра слов переданы буквально по имеющемуся свидетельству; они не соответствуют общепринятой еврейской этимологии.
    reason: Предупреждает читателя, что древняя игра слов не является современной филологической этимологией, не исправляя авторский текст.
  - marker: b
    text: Связь сирийского слова «Фарисата» с выражением «тот, кто распростёрт», а также образ «распять мир» сохранены без смыслового сглаживания.
    reason: Отмечает необычную и филологически трудную словесную связь.
  - marker: c
    text: Парадоксальная формулировка сохранена; текст допускает разные понимания соотношения предсуществования и обретения существования.
    reason: Сохраняет богословскую неоднозначность афоризма и предотвращает чрезмерно уверенное прочтение.
lexical_decisions:
- source_word: dyer / dyed / dyes
  choice: красильщик / окрасил / краски
  rationale: Сохранён сквозной образ окрашивания и его связь с крещением; естественные русские соответствия позволяют удержать словесный повтор.
- source_word: true (dyes)
  choice: стойкие
  rationale: В контексте красок речь, вероятно, о прочности и неизменности цвета; буквальное «истинные» по-русски звучало бы неясно. Реальная образная неоднозначность далее сохранена.
- source_word: human-eater
  choice: пожиратель людей
  rationale: Резкое и необычное выражение передано прямо, без богословской гармонизации.
- source_word: Pharisatha
  choice: Фарисата
  rationale: Транслитерация сохраняет засвидетельствованное сирийское наименование; предлагаемая самим текстом глосса переведена отдельно.
- source_word: Son of Humanity
  choice: Сын Человеческий
  rationale: Устойчивое и понятное русское выражение, сохраняющее титульный характер формулы.
- source_word: mystery
  choice: таинство
  rationale: В контексте крещения и принятия Духа слово обозначает сакральное посвящение; «таинство» естественно в русском религиозном регистре, не уточняя конфессиональную систему.
- source_word: comes into being
  choice: обретает существование
  rationale: Передаёт философский оттенок возникновения и позволяет сохранить парадокс последующих формулировок.
theological_decisions:
- issue: Окрашивание Богом и крещение
  choice: Сохранить оба образа рядом без отождествляющего пояснения
  alternative: Истолковать окрашивание как прямую метафору водного крещения
  rationale: Текст сам создаёт напряжение между бессмертными красками и крещением в воде; перевод не должен разрешать его за автора.
- issue: Становление Духом, Христом и отцом
  choice: Передать утверждения буквально и сохранить восстановленные места в квадратных скобках
  alternative: Ослабить их до «уподобился Духу/Христу/Отцу»
  rationale: Ослабление устранило бы характерное для текста учение о становлении тем, что созерцается.
- issue: «Бог — пожиратель людей» и жертвоприношение человека
  choice: Сохранить шокирующую формулировку
  alternative: Истолковать её как евхаристическую или мученическую метафору
  rationale: Контекст допускает разные богословские прочтения, и ни одно не следует навязывать переводом.
- issue: Евхаристия есть Иисус
