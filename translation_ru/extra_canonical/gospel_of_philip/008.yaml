    rationale: Русская формула означает, что Иисус неожиданно застиг людей, тогда как английское свидетельство говорит о скрытном способе действия Иисуса. Это меняет направленность и смысл образа.
  - severity: medium
    issue: Не сохранен сигнал восстановления в «[they'd] be able»
    rationale: 'В переводе необходимо передать квадратные скобки: «таким, каким [они могли] его увидеть», поскольку редакционная неопределённость входит в предоставленное свидетельство.'
  - severity: medium
    issue: Неоправданная разнородность «великим ... малому»
    rationale: 'Английский текст имеет параллельные адресатные конструкции «to the great» и «to the small». Русский должен сохранить параллелизм: «великим ... малым».'
  - severity: low
