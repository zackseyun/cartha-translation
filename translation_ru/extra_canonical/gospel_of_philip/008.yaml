translation:
  language: ru
  text: 'Иисус застал всех их врасплох[a], потому что являлся не таким, каков он был, а таким, каким они могли его увидеть. Он являлся им [всеми этими] способами: великим он [являлся] как великий, малому — как малый, ангелам — как ангел, а людям — как человек. Поэтому его Слово скрывало себя от всех. Некоторые видели его, думая, что видят самих себя. Но когда он явился своим ученикам во славе на горе, он не был малым. Он стал великим, но сделал великими и учеников, чтобы они могли увидеть его великим.


    В тот день во время евхаристии[b] он сказал: «Ты, соединивший совершенный свет со Святым Духом, соедини и ангелов с нами, с образами!»[c]


    Не пренебрегай агнцем[d], потому что без него невозможно увидеть дверь. Никто не сможет приблизиться к царю нагим.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по данному английскому свидетельству: «взял всех их скрытно» или «хитростью». Перевод предварительный: прямая сверка с коптским оригиналом ещё не проведена.'
    reason: Исходная идиома необычна и допускает несколько оттенков.
  - marker: b
    text: 'Или: «при благодарении»; греческое по происхождению слово «евхаристия» означает благодарение и здесь может обозначать священную трапезу.'
    reason: Сохранить как терминологическое, так и обычное значение слова.
  - marker: c
    text: Фраза «с нами, с образами» синтаксически и богословски неясна; «образы» могут пониматься как изображения, подобия или носители образа.
    reason: Не скрывать трудность текста и не закреплять одно толкование.
  - marker: d
    text: 'Или: «ягнёнком». «Агнец» сохраняет традиционный сакральный оттенок образа.'
    reason: Показать буквальный вариант и объяснить регистровый выбор.
lexical_decisions:
- source_word: took all of them by stealth
  choice: застал всех их врасплох
  rationale: Передаёт смысл скрытого, нераспознанного действия без неестественного буквального «взял хитростью»; формулировка остаётся предварительной ввиду отсутствия прямой сверки с коптским текстом.
- source_word: appeared
  choice: являлся / явился
  rationale: Сохраняет мотив проявления облика и подходит возвышенному, но современному регистру.
- source_word: his Word
  choice: его Слово
  rationale: Заглавная буква сохраняет вероятный богословский вес выражения, не уточняя насильственно, означает ли оно речь, учение или личностный Логос.
- source_word: the great / the small
  choice: великим / малому
  rationale: 'Сохранена неодинаковая форма английского свидетельства: первое может описывать облик, второе — адресата. Неясность не выровнена без коптской сверки.'
- source_word: Eucharist
  choice: евхаристии
  rationale: Устоявшийся русский термин, непосредственно соответствующий свидетельству и не вводящий конфессионального уточнения обряда.
- source_word: images
  choice: образами
  rationale: 'Буквально сохраняет многозначность: изображения, подобия или духовные образы.'
- source_word: lamb
  choice: агнцем
  rationale: «Агнец» естественен в сакрально-символическом контексте и сохраняет вероятный христологический оттенок, не проговаривая его прямо.
- source_word: naked
  choice: нагим
  rationale: Сохраняет буквальный образ и возможный ритуальный или духовный подтекст без истолкования.
theological_decisions:
- issue: Изменение облика Иисуса в зависимости от воспринимающего
  choice: Сохранить прямое описание различных явлений
  alternative: Объяснить это как приспособление восприятия или как буквальное преображение
  rationale: Текст оставляет отношение между реальным обликом и способностью видеть напряжённым и неоднозначным.
- issue: «Его Слово скрывало себя»
  choice: Сохранить возвратную конструкцию и заглавную букву
  alternative: Перевести «его речь была скрыта» или отождествить Слово с Христом
  rationale: Так не устраняется возможная персонификация и не навязывается одно догматическое прочтение.
- issue: Великий и малый
  choice: Не объяснять эти категории
  alternative: Истолковать их как духовную зрелость, возраст или небесный ранг
  rationale: Свидетельство не определяет их однозначно.
- issue: Ангелы и образы в евхаристическом изречении
  choice: Сохранить синтаксическую и смысловую трудность
  alternative: Перестроить фразу так, чтобы «образы» однозначно относились к людям или ангелам
  rationale: Связь выражения «с образами» с другими членами фразы неясна; богословское разрешение было бы спекулятивным.
- issue: Агнец, дверь и нагота перед царём
  choice: Сохранить символы без пояснительной подстановки
  alternative: Назвать агнца Христом, дверь — спасением, а одежду — таинством или праведностью
  rationale: Такие отождествления возможны, но сам отрывок не формулирует их явно.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной лексикой. Квадратные скобки сохранены только там, где английское свидетельство отмечает восстановленный или повреждённый текст; круглые скобки свидетельства переданы естественным русским синтаксисом. Черновик неизбежно предварительный, поскольку предоставлена английская публикация коптского свидетельства, а прямая коптологическая сверка ещё ожидается.
