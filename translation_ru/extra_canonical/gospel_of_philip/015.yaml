translation:
  language: ru
  text: 'Те, кто говорит, что сначала умрёт, а потом воскреснет, заблуждаются. Если они прежде не примут воскресения, пока живы, то, умерев, не получат ничего. Так же бывает, когда они говорят о крещении: «Крещение — великое дело», потому что принявшие его будут жить.


    Апостол Филипп сказал: «Плотник Иосиф посадил сад, потому что ему была нужна древесина для ремесла. Именно он сделал крест из посаженных им деревьев, и его потомок был повешен на том, что он посадил. Его потомком был Иисус, а растением — крест». Но Древо жизни находится посреди рая; от маслины произошло помазание, а от него — воскресение.


    Этот мир пожирает мёртвые тела. Всё, что в нём съедается, тоже умирает. Истина питается жизнью, поэтому никто, питаемый [Истиной], не умрёт. Иисус пришёл оттуда и принёс оттуда пищу; тем, кто хотел, Он дал её [есть, чтобы] они не умерли.


    [Бог…] рай, [человек…] рай; там есть […] и […] Бога […] те, кто в [нём…] Я желаю, чтобы [рай…] мне скажут: «[… ешь] это» или «не ешь [того…] желаю». Древо познания — то место, где я съем всё. Оно умертвило Адама, но здесь оно даёт человеку жизнь. Законом было древо. У него есть сила дать познание добра и зла. Оно и не удержало их от зла, и не утвердило в добре, но породило смерть для вкусивших от него. Ведь когда оно сказало: «Ешь это, не ешь того», оно стало началом смерти.


    Помазание лучше крещения, поскольку «христианами» нас называют из-за помазания, а не из-за крещения.[a] И Христос получил Своё имя из-за помазания, потому что Отец помазал Сына, Сын помазал апостолов, а апостолы помазали нас. У помазанного есть всё: воскресение, свет, крест и Святой Дух. Отец дал ему это в брачном чертоге, и он принял. Отец был в Сыне, а Сын — в Отце. Это и есть [Царство] Небесное.


    Господь хорошо сказал: «Некоторые вошли в Царство Небесное смеясь и вышли […] христианин […] и как только [… сошёл] в воду, он […] всё об […] это [словно] игра, [но… пренебречь] этим […] в Царство [Небесное…] если они пренебрегут […] и если отнесутся к этому с презрением, как к игре, [… выйдут] смеясь». Так же и с хлебом, чашей и елеем, хотя есть нечто превосходящее их.


    Мир возник вследствие проступка, потому что создавший его хотел сотворить его нетленным и бессмертным. Он отпал и не достиг желаемого: мир не оказался нетленным, да и создавший его не был нетленным. Ведь нетленны не вещи, а дети. Ничто не сможет принять нетление, не став ребёнком. А кто не способен принять, тем более не сможет дать.


    В чаше молитвы есть вино и вода, поскольку она служит образом крови, за которую возносят благодарение. Она наполняется Святым Духом и принадлежит всецело совершенному человеку. Всякий раз, когда мы пьём это, мы принимаем совершенного человека. Живая вода — это тело. Нам необходимо облечься в живого человека. Поэтому, сходя в воду, люди снимают одежду, чтобы облечься в него.


    Конь рождает коня, человек рождает человека, а бог рождает бога. Так же и с [женихом] и [невестами]. Они [происходят] от […] Ни один иудей […] от […] существует, и […] от иудеев […] христиане […] назвали их […] «избранным родом […]», и «истинным человеком», и «Сыном Человеческим», и «семенем Сына Человеческого». Этот истинный род известен в мире. Вот места, где пребывают дети брачного чертога.


    В этом мире соединение происходит между мужчиной и женщиной — это место силы и слабости. В [грядущем] веке соединение иное, хотя мы называем его теми же словами. Однако есть другие имена, которые выше всякого произносимого имени; они превосходят сильных, потому что там, где есть сила, существуют и те, кто ещё могущественнее. Это не две разные вещи: обе — одно и то же. Вот что не сможет снизойти на плотское сердце.


    Разве не следует каждому, кто имеет всё, полностью познать себя? Некоторые, не знающие себя, не смогут насладиться тем, что имеют; но познавшие себя будут этим наслаждаться.


    Совершенного человека не только не смогут связать — его не смогут и увидеть, потому что, если увидят, свяжут. Нет иного пути приобрести эту благодать, [кроме как] облечься в совершенный свет [и] стать совершенным [светом. Облекшийся в него] пойдёт […] это совершенное […] чтобы нам стать […] прежде чем мы пришли к […] тот, кто принимает всё […] эти места, сможет […] то место, но они […] [середину] как несовершенные. Только Иисус знает конец этого.


    Святой человек — священник — свят всецело, вплоть до самого тела. Ведь если он принимает хлеб, то освящает его; так же и чашу или всё иное, что он берёт и очищает. Почему же ему не очистить и тело?


    Как Иисус сделал совершенной воду крещения, так Он излил смерть. Поэтому мы сходим в воду, но не сходим в смерть, чтобы не быть излитыми в дух мира. Когда веет он, приходит зима; когда дышит Святой Дух, приходит лето.


    Кто знает истину, тот свободен, а свободный не грешит, потому что «всякий, кто грешит, — раб греха». Истина — Мать, а познание — соединение. Тех, кто не предаётся греху, мир называет «свободными». Познание истины побуждает тех, кто не предаётся греху, возноситься. Именно оно делает их свободными и возвышает над всем. Но «любовь созидает», и тот, кто через познание стал свободным, из любви становится рабом тех, кто ещё не способен достичь свободы познания; [но] познание даёт им возможность стать свободными. Любовь […] что-либо своим […] она […] своё. Она никогда [не говорит: «…»] или «это моё», [но: «…] ваше». Духовная любовь — благоуханное вино. Все, кто помажет себя им, наслаждаются им. Пока помазанные остаются рядом, находящиеся возле них тоже наслаждаются благоуханием. Если же помазанные благовонием покинут их и уйдут, непомазанные, которые лишь находились рядом, останутся в своём зловонии.

    Самарянин не дал раненому ничего, кроме вина с маслом. Это было не что иное, как целебное умащение, и оно исцелило раны, потому что «любовь покрывает множество грехов».


