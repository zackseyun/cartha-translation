review_pass:
  verdict: revise
  source_fidelity: В целом перевод точно следует предоставленному английскому свидетельству и бережно сохраняет лакуны, скобочные восстановления, повтор «сила/силы» и неразрешённую формулировку «другой отец». Однако «(их) апостольскими (преемниками)» добавляет притяжательную связь («их»), которой в английском свидетельстве нет и которая меняет синтаксическую неоднозначность фразы.
  naturalness: Современный литературный регистр выдержан. «Разве когда-нибудь женщина зачинала от женщины?» естественно передаёт риторический вопрос; намеренная смысловая странность оправданно поясняется сноской. Фрагментарность последнего высказывания не сглажена.
  terminology: «Святой Дух», «сила/силы», «осквернить», «дом Отца» выбраны последовательно и без конфессионально направляющих уточнений. В сноске а лучше не утверждать слишком определённо о «языковой среде данного высказывания», поскольку прямая проверка коптского текста пока отсутствует; уместнее обозначить вероятную семитоязычную предпосылку как объяснение полемики.
  issues:
  - severity: medium
    issue: Добавлено слово «их» в описании апостольских преемников.
    rationale: Английское свидетельство содержит «(the) apostolic (successors)», но не «their successors». Добавление «их» делает преемников именно преемниками названных апостолов, тогда как свидетельство этого синтаксически не уточняет.
  - severity: low
    issue: Сноска а слишком категорично локализует игру рода в «языковой среде данного высказывания».
    rationale: 'При отсутствии прямой сверки с коптским источником следует формулировать филологическое объяснение осторожно: полемика, вероятно, опирается на женский грамматический род обозначения духа в семитской традиции.'
  revised_text: 'Некоторые говорят: «Мария зачала от Святого Духа». Они заблуждаются и не понимают, что говорят. Разве когда-нибудь женщина зачинала от женщины?[a] «Мария — дева, которую не осквернила никакая сила», — таково великое свидетельство тех евреев, которые стали (первыми) апостолами и (апостольскими) (преемниками).[b] Дева, которую не осквернила никакая сила, […] силы осквернили сами себя.



    И Господь [не стал бы] говорить: «Мой [Отец, сущий на] небесах», — если бы у [него] не было другого отца. Иначе он сказал бы просто: [«Мой Отец».][c] Господь сказал [ученикам: «…] [из] каждого [дома] и приносите в дом Отца, но ничего не крадите из дома Отца и не уносите оттуда».[d]'
  revised_footnotes:
