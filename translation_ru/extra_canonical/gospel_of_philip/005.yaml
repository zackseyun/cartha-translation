    And the Lord [wouldn''t] have said, "my [Father who is in] heaven" unless [he] had another father. Instead, he would simply have said ["my Father."] The Lord said to the [disciples, "…] [from] every [house] and bring into the Father''s house, but don''t steal (anything) from the Father''s house or carry it away."'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_philip/005.yaml
  text: 'Some say, “Mary conceived by the Holy Spirit.” They are wrong; they do not know what they are saying. When has a woman ever conceived by a woman? “Mary is the virgin whom no power defiled” is the great testimony of those Hebrews who became (the first) apostles and (the) apostolic (successors). The virgin whom no power defiled […] the powers defiled themselves.


    And the Lord [would not] have said, “My [Father who is in] heaven,” unless [he] had another father. Instead, he would simply have said, [“My Father.”] The Lord said to the [disciples, “…] [from] every [house] and bring into the Father’s house, but do not steal anything from the Father’s house or carry it away.”'
translation:
  language: ru
  text: 'Некоторые говорят: «Мария зачала от Святого Духа». Они заблуждаются и не понимают, что говорят. Разве когда-нибудь женщина зачинала от женщины?[a] «Мария — дева, которую не осквернила никакая сила», — таково великое свидетельство тех евреев, которые стали (первыми) апостолами и (их) апостольскими (преемниками).[b] Дева, которую не осквернила никакая сила, […] силы осквернили сами себя.


    И Господь [не стал бы] говорить: «Мой [Отец, сущий на] небесах», — если бы у [него] не было другого отца. Иначе он сказал бы просто: [«Мой Отец».][c] Господь сказал [ученикам: «…] [из] каждого [дома] и приносите в дом Отца, но ничего не крадите из дома Отца и не уносите оттуда».[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Логика вопроса связана с тем, что в языковой среде данного высказывания слово «дух» могло восприниматься как грамматически женского рода. Русское «Дух» имеет мужской род, поэтому словесная связь менее очевидна.
    reason: Поясняет непередаваемую напрямую игру грамматического рода, не устраняя её из основного текста.
  - marker: b
    text: Слова в круглых скобках передают поясняющие или восстановленные элементы предоставленного английского свидетельства; их точная форма требует сверки с коптским текстом.
    reason: Отмечает меньшую текстуальную уверенность и промежуточный характер источниковой базы.
  - marker: c
    text: Квадратные скобки обозначают утраченный или восстановленный текст рукописи.
    reason: Разъясняет принятую систему обозначения лакун и реконструкций.
  - marker: d
    text: Начало высказывания и часть слов утрачены; неизвестно, что именно следовало приносить из каждого дома.
    reason: Предотвращает ложное впечатление связности и полноты повреждённого места.
lexical_decisions:
- source_word: Holy Spirit
  choice: Святой Дух
  rationale: Устоявшееся и естественное русское соответствие; последующий каламбур о женщине сохранён без попытки согласовать его с мужским грамматическим родом русского слова «Дух».
- source_word: power / powers
  choice: сила / силы
  rationale: Сохранён повтор одного и того же термина и возможный смысл духовных или космических сил; более толковательное «власть» не выбрано.
- source_word: defiled
  choice: осквернила / осквернили
  rationale: Передаёт религиозно-нравственный оттенок глагола и позволяет сохранить контраст между непорочной девой и силами, осквернившими самих себя.
- source_word: conceived
  choice: зачала / зачинала
  rationale: «Зачать» точно передаёт телесное зачатие; в риторическом вопросе употреблён несовершенный вид для обобщённого действия.
- source_word: Father’s house
  choice: дом Отца
  rationale: Буквальное выражение сохраняет образ и его возможную богословскую многозначность.
theological_decisions:
- issue: Риторический вопрос о зачатии «от женщины»
  choice: Сохранить буквально, не объясняя внутри текста грамматический род слова «дух» в исходной языковой традиции
  alternative: Переформулировать вопрос так, чтобы он был логически понятнее русскому читателю
  rationale: Переформулировка устранила бы намеренную полемическую напряжённость и внесла бы толкование, не удостоверенное предоставленным свидетельством.
- issue: «Никакая сила» и «силы»
  choice: Сохранить одинаковую лексику в единственном и множественном числе
  alternative: Передать как «власть» в первом случае и «силы» во втором
  rationale: Лексический повтор, вероятно, значим; его нельзя без необходимости скрывать.
- issue: «Другой отец» Господа
  choice: Передать без уточнения, кто имеется в виду
  alternative: Добавить «земной отец»
  rationale: Источник оставляет референта неопределённым, поэтому перевод не должен разрешать богословскую неоднозначность.
- issue: Повреждённое наставление о доме Отца
  choice: Сохранить фрагментарность, квадратные скобки и синтаксический обрыв
  alternative: Реконструировать недостающий объект и сделать предложение гладким
  rationale: Реконструкция была бы спекулятивной и создала бы ложное впечатление сохранности текста.
translation_notes:
  register: Современный литературный русский язык с достоинством, но без архаизации. Полемический тон первого абзаца сохранён прямо. Рукописные лакуны и восстановления отмечены квадратными скобками и многоточием; синтаксические шероховатости повреждённого последнего высказывания намеренно не сглажены. Проект предварительный, поскольку предоставлена лишь англоязычная публикация-свидетель, а прямая сверка с коптским оригиналом ещё не выполнена.
