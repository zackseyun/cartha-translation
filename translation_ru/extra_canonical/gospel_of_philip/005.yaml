source:
  text: 'Some say that "Mary conceived by the Holy Spirit." They''re wrong; they don''t know what they''re saying. When did a woman ever conceive by a woman? "Mary is the virgin whom no power defiled" is the great testimony of those Hebrews who became (the first) apostles and (the) apostolic (successors). The virgin whom no power defiled […] the powers defiled themselves.


    And the Lord [wouldn''t] have said, "my [Father who is in] heaven" unless [he] had another father. Instead, he would simply have said ["my Father."] The Lord said to the [disciples, "…] [from] every [house] and bring into the Father''s house, but don''t steal (anything) from the Father''s house or carry it away."'
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex II,3, 51.29-86.19
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
