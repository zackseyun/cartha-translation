translation:
  language: ru
  text: 'Каждый, кто [войдёт] в чертог, зажжёт свой [светильник], потому что [это] подобно бракам, которые […] совершаются ночью: огонь […] ночью и гаснет. Но таинства этого брака совершаются днём и при свете. Ни тот день, ни его свет никогда не заходят.


    Если кто станет дитём брачного чертога, тот получит свет. Если кто не получит его, пока находится здесь, то не сможет получить его в ином месте. Получивший тот свет не будет ни видим, ни связан, и никто не сможет потревожить такого человека, даже пока он живёт в мире. Более того, покидая мир, он уже получил Истину в образах. Мир стал вечными веками[a], потому что вечный век — полнота для него. И вот как это происходит: она открывается лишь ему. Она не сокрыта во тьме и ночи, но сокрыта в совершенном дне и святом свете.


    Евангелие


    от Филиппа'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слова «вечными» и «вечный» передают заключённое в круглые скобки уточнение английского свидетеля; непосредственная сверка с коптским текстом ещё требуется.
    reason: Перевод основан на указанном английском публичном свидетеле, где eternal дано в круглых скобках, что сигнализирует редакционное уточнение.
lexical_decisions:
- source_word: chamber / bridal chamber
  choice: чертог / брачный чертог
  rationale: Сохраняет различие между кратким обозначением в первом абзаце и устойчивым сакрально-брачным образом далее; «чертог» звучит достойно и понятно в религиозном контексте.
- source_word: mysteries
  choice: таинства
  rationale: Передаёт ритуально-сакральный смысл, не сводя выражение ни к тайнам как сведениям, ни к конкретному позднейшему церковному учению.
- source_word: child of the bridal chamber
  choice: дитя брачного чертога
  rationale: Сохраняет необычную метафору источника и не заменяет её истолкованием.
- source_word: Truth
  choice: Истина
  rationale: Прописная буква отражает персонифицированный или высший концептуальный характер термина в данном контексте.
- source_word: images
  choice: образы
  rationale: 'Буквально сохраняет многозначность: речь может идти о символах, отображениях или явленных формах.'
- source_word: age(s)
  choice: вечный век / вечные века
  rationale: Сохраняет космологическую лексику и различие числа; добавленное свидетелем «eternal» отражено, но отмечено сноской.
- source_word: fullness
  choice: полнота
  rationale: Сохраняет богословски нагруженный, но не истолкованный термин.
theological_decisions:
- issue: Смысл «света» и «брачного чертога»
  choice: Сохранить образный язык без догматического пояснения
  alternative: Истолковать как конкретный обряд, спасение или мистическое соединение
  rationale: Текст не даёт достаточных оснований однозначно отождествить эти образы с одной конфессиональной схемой.
- issue: Кто или что открывается в заключительных фразах
  choice: Местоимение «она» соотнесено с ближайшим смысловым центром — «Истиной»
  alternative: Отнести местоимение к «полноте» либо безлично перевести «это открывается»
  rationale: Английский свидетель допускает неопределённость; выбран естественный русский синтаксис, при этом связь остаётся контекстуальной, а не догматически утверждённой.
- issue: «Не будет видим»
  choice: Сохранить прямое утверждение «не будет … видим»
  alternative: Смягчить до «останется незамеченным» или истолковать как духовную невидимость
  rationale: Буквальная формулировка удерживает напряжение и не навязывает метафорическое толкование.
translation_notes:
  register: 'Современный литературный русский с умеренно сакральной лексикой. Квадратные скобки и многоточия сохранены как сигналы реконструкции и повреждения рукописи. Черновик предварительный: прямая проверка по коптскому источнику ещё не выполнена.'
