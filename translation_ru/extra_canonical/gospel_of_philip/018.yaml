review_pass:
  verdict: revise
  source_fidelity: 'Требуется исправление заключительных местоимений и числа: английский свидетель говорит о «них» (them), тогда как черновик необоснованно переходит к единственному числу («для него», «лишь ему») и относит «она» к Истине. Такая отсылка не задана свидетелем. Редакционные круглые скобки при eternal следует сохранить в самом тексте, а не заменять ими примечанием. Формулу о дне и свете также лучше передать по-русски раздельными сказуемыми: день «не заходит», свет «не меркнет».'
  naturalness: 'В целом регистр удачен: «чертог», «брачный чертог», «таинства», «Истина» и «образы» естественны для умеренно сакрального литературного русского. Однако «ни тот день, ни его свет никогда не заходят» неестественно, поскольку свет по-русски обычно не «заходит». Фрагментированное «огонь […] ночью и гаснет» оставлено намеренно: повреждение рукописи не позволяет безопасно восстанавливать пропущенный глагол.'
  terminology: 'Термины «чертог / брачный чертог», «таинства», «дитя», «Истина», «образы» и «полнота» сохранены. «Век / века» удерживает различие числа в свидетеле. Parenthetical editorial qualification передано круглыми скобками: «(вечными) веками», «(вечный) век».'
  issues:
  - severity: high
    issue: Смена числа и навязанная референция в заключении
    rationale: В свидетельстве сказано «the age is the fullness for them» и «it is revealed to them alone». Черновик меняет это на «для него» и «лишь ему», а «она» определённо относит к «Истине». Это не следует из текста и сужает его неоднозначность.
  - severity: medium
    issue: Не сохранены круглые скобки редакционного уточнения eternal
    rationale: Свидетель отмечает eternal круглыми скобками. Сноска не заменяет этот текстологический сигнал в основном тексте; скобки нужно воспроизвести непосредственно.
  - severity: medium
    issue: Неестественный оборот о заходящем свете
    rationale: «Свет ... заходит» в современном русском не является обычным употреблением. Разделение образов на «день не заходит» и «свет не меркнет» сохраняет поэтический смысл без добавления толкования.
  revised_text: 'Каждый, кто [войдёт] в чертог, зажжёт свой [светильник], потому что [это] подобно бракам, которые […] совершаются ночью: огонь […] ночью и гаснет. Но таинства этого брака совершаются днём и при свете. Ни тот день никогда не заходит, ни его свет не меркнет.


    Если кто станет дитём брачного чертога, тот получит свет. Если кто не получит его, пока находится здесь, то не сможет получить его в ином месте. Получивший тот свет не будет видим и не будет связан, и никто не сможет потревожить такого человека, даже пока он живёт в мире. Более того, покидая мир, он уже получил Истину в образах. Мир стал (вечными) веками, потому что (вечный) век есть для них полнота. И вот как: это открывается лишь им. Это не скрыто во тьме и ночи, но скрыто в совершенном дне и святом свете.


