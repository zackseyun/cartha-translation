translation:
  language: ru
  text: 'Имена, которые дают людям этого мира, весьма обманчивы, потому что уводят сердце от истинного к ложному. Услышав слово «Бог», человек думает не об истинном, а о ложном. Так же и со словами «Отец», «Сын», «Святой Дух», «жизнь», «свет», «воскресение», «церковь» и всеми прочими: люди думают не об [истинном], а о [ложном], [если только] не познали истинного. [Услышанные имена] существуют в мире […] [обманывают. Если бы они существовали] в вечном веке[a], их не употребляли бы как имена в мире и не помещали бы среди мирского. Их конец — в вечном веке.[b]


    Есть одно имя, которое не произносят в мире: имя, данное Отцом Сыну. Оно превыше всего; это имя Отца, ибо Сын не стал бы отцом, если бы не принял имя Отца. Те, у кого есть это имя, знают его, но не произносят; а те, у кого его нет, не знают его. Но Истина принесла для нас имена в мир, потому что без этих имён нам невозможно познать её — Истину. Истина одна, но для нас она становится многим, чтобы через многое в любви научить нас этому одному.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Вечный век» передаёт выражение, которое может обозначать вечный эон — надмирную или грядущую реальность.
    reason: Поясняет непривычный русский оборот, не устраняя неоднозначность термина.
  - marker: b
    text: Предшествующие слова частично утрачены или восстановлены; квадратные скобки и многоточие отмечают повреждение текста. Смысл фразы «Их конец — в вечном веке» также допускает разные толкования.
    reason: Честно обозначает текстологическую неуверенность и не выдаёт реконструкцию за сохранившийся текст.
  - marker: c
    text: 'Буквально мысль построена как парадокс: одна Истина становится для нас «многим», чтобы через многое научить одному.'
    reason: Сохраняет необычную концептуальную структуру заключительной фразы.
lexical_decisions:
- source_word: what's right / what's not right
  choice: истинное / ложное
  rationale: В контексте рассуждения об именах и Истине речь, вероятнее всего, идёт не просто о нравственно правильном и неправильном, а об истинной и ложной реальности или понимании. Формы среднего рода сохраняют некоторую отвлечённость выражения.
- source_word: worldly / world
  choice: люди этого мира / мир
  rationale: Естественная современная передача, сохраняющая противопоставление нынешнего мира вечному веку без добавления отрицательной нравственной характеристики вроде «мирские».
- source_word: (eternal) age
  choice: вечный век
  rationale: Передаёт эонную лексику свидетельства и её эсхатологическую либо надмирную неоднозначность; слово «вечность» чрезмерно сгладило бы образ века/эона.
- source_word: church
  choice: церковь
  rationale: Обычный и понятный эквивалент; строчная буква соответствует перечислению понятий и не навязывает конкретную институциональную трактовку.
- source_word: have this name
  choice: у кого есть это имя
  rationale: Буквальная конструкция сохраняет загадочный смысл обладания именем и не истолковывает его как простое знание, принадлежность или посвящение.
- source_word: Truth brought names into the world
  choice: Истина принесла для нас имена в мир
  rationale: Персонификация Истины сохранена, как и направленность дара к людям; формулировка не уточняет метафизический механизм.
- source_word: it's many things for us
  choice: для нас она становится многим
  rationale: Сохраняет напряжение между единством Истины и множественностью её явлений или имён, не сводя «многое» лишь к словам.
theological_decisions:
- issue: Смысл противопоставления right/not right
  choice: «истинное / ложное»
  alternative: «правильное / неправильное»
  rationale: Ближайший контекст прямо говорит об Истине и обманчивости имён, поэтому эпистемический и онтологический оттенок существеннее чисто нравственного; при этом отвлечённые формы не определяют природу «истинного».
- issue: Отношение Сына к отцовству
  choice: «Сын не стал бы отцом»
  alternative: «Сын не сделался бы Отцом»
  rationale: 'Строчная буква в слове «отцом» сохраняет реальную двусмысленность: фраза может говорить о принятии отцовского имени или статуса, но перевод не отождествляет Сына с Отцом как лицом.'
- issue: Единство и множественность Истины
  choice: «Истина одна, но для нас она становится многим»
  alternative: «Истина одна, но открывается нам во множестве образов»
  rationale: Выбранная формулировка ближе к парадоксальности свидетельства и не вводит отсутствующее в нём понятие образов или способов откровения.
- issue: «Их конец — в вечном веке»
  choice: сохранить краткое парадоксальное утверждение
  alternative: «они прекращаются с наступлением вечного века»
  rationale: Синтаксис и смысл повреждённого отрывка не позволяют уверенно определить, означает ли это прекращение имён, их предел или завершение; буквальная формулировка сохраняет напряжение.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского религиозно-философского текста. Перевод предварительный: предоставленное основание представляет собой англоязычное публичнодоменное свидетельство, а непосредственная сверка с коптским текстом ещё не выполнена. Квадратные скобки и многоточие сохранены как сигналы лакун и редакторского восстановления.'
