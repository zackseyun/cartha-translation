  terminology: «Воскресение», «нетленность», «тленное», «Полнота» и «Недостаток» сохранены удачно. Заглавные буквы в последних двух понятиях оправданно удерживают возможный терминологический статус без доктринального истолкования. «Действительность, которая остаётся незыблемой» адекватно передаёт reality that remains firm.
