  - severity: low
    issue: Пустые квадратные скобки лакуны заменены на «[…]».
    rationale: Предоставленное свидетельство специально содержит «[] [will descend]». Для прозрачного сохранения его сигнала повреждения в русском тексте нужно оставить «[] [сойдёт]».
