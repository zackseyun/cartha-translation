base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/009.yaml
  text: 'Yet what am I telling you? Will those who are alive die? How can they live in an illusion? The rich have become poor, and kings have been brought down. Everything is subject to change. The world is an illusion, if indeed I am not exaggerating the situation.


    The resurrection, however, does not have that (illusory, passing) nature, because it is the reality that remains firm. It is the revelation of what exists, even the transfiguration of things and a transformation into what is new. For imperishability [] [will descend] upon the perishable. Light will flow down upon darkness and swallow it up. Then the Fullness will fill the Deficiency. These are symbols and images of the resurrection. This brings about what is good.'
translation:
  language: ru
  text: 'Но что я вам говорю? Неужели живые умрут? Как могут они жить в иллюзии? Богатые обеднели, а цари низвергнуты. Всё подвержено переменам. Мир — иллюзия, если только я и вправду не преувеличиваю.


    Воскресение, однако, не имеет такой — иллюзорной и преходящей — природы, потому что оно есть действительность, которая остаётся незыблемой. Оно — откровение существующего, преображение вещей и превращение их в новое. Ибо нетленность […] [сойдёт] на тленное.[a] Свет изольётся на тьму и поглотит её. Тогда Полнота восполнит Недостаток.[b] Таковы символы и образы воскресения. Это приводит к благому.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Многоточие в квадратных скобках обозначает повреждение или лакуну в текстовом свидетельстве; слово «[сойдёт]» представляет редакционное восстановление, сохранённое из предоставленного английского свидетельства.
    reason: Необходимо явно сохранить сигналы повреждения рукописи и редакционного восстановления.
  - marker: b
    text: «Полнота» и «Недостаток» могут быть специальными понятиями данного трактата; перевод не уточняет их значение сверх доступного свидетельства.
    reason: Сохраняет возможную терминологическую нагрузку без привнесения конфессионального или частного толкования.
lexical_decisions:
- source_word: illusion
  choice: иллюзия
  rationale: Сохраняет повтор ключевого понятия и его смысловую связь с изменчивостью мира; более узкие варианты вроде «обман» или «мираж» преждевременно уточняли бы образ.
- source_word: reality that remains firm
  choice: действительность, которая остаётся незыблемой
  rationale: Передаёт противопоставление иллюзорному и преходящему, не сводя выражение лишь к отвлечённой «истине».
- source_word: imperishability / perishable
  choice: нетленность / тленное
  rationale: Сохраняет контраст однокоренных богословски значимых понятий и естественно звучит в русском религиозно-философском регистре.
- source_word: Fullness / Deficiency
  choice: Полнота / Недостаток
  rationale: Заглавные буквы сохраняют вероятный технический и олицетворённый характер понятий; «восполнит» естественно выражает действие Полноты по отношению к Недостатку.
- source_word: transfiguration / transformation
  choice: преображение / превращение
  rationale: Различает соседние термины исходного свидетельства, не устраняя их смысловую близость.
theological_decisions:
- issue: Онтологический статус воскресения
  choice: «оно есть действительность, которая остаётся незыблемой»
  alternative: «оно есть истина, которая остаётся твёрдой»
  rationale: Выбранный вариант сохраняет онтологическое противопоставление воскресения иллюзорному миру и не превращает высказывание только в утверждение об истинности.
- issue: Направление образа нетленности
  choice: «[сойдёт] на тленное»
  alternative: «покроет тленное» или «сменит тленное»
  rationale: Сохранено пространственное движение, засвидетельствованное английским свидетельством, а редакционное восстановление явно отмечено скобками.
- issue: Полнота и Недостаток
  choice: Сохранить как именованные понятия без поясняющего толкования
  alternative: Передать строчными буквами как обычные нарицательные существительные
  rationale: Это не навязывает конкретную доктринальную систему, но сохраняет возможный технический смысл и богословское напряжение текста.
translation_notes:
  register: 'Современный литературный русский язык с достоинством религиозно-философского трактата. Риторические вопросы и параллелизм сохранены. Проект предварительный: выполнен по предоставленному публичному английскому свидетельству; прямая сверка с коптским текстом ещё требуется.'
