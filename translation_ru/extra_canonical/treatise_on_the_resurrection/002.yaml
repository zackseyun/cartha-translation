base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/002.yaml
  text: In what way did the Lord preach while he lived in the flesh and after he revealed himself to be the Son of God? He lived in this place where you live, speaking about the law of natural things, which I, however, call “death.” Rheginos, the Son of God was the Son of Man. He took both upon himself, having humanity and divinity. Consequently, on the one hand, as the Son of God he could banish death, and on the other hand, as the Son of Man he brought about the restoration of the Fullness. This was because his origin was from above, as a seed of truth, before (his lower) structure came into existence. In this (lower structure) many dominions and divinities came into being.
translation:
  language: ru
  text: Каким образом проповедовал Господь, когда жил во плоти и после того, как явил себя Сыном Божьим? Он обитал здесь, где пребываете вы, рассуждая о законе природных вещей, который я, однако, называю «смертью». Регин, Сын Божий был Сыном Человеческим. Он соединил в себе и то и другое, обладая человечеством и божеством. Поэтому, с одной стороны, как Сын Божий он мог изгнать смерть, а с другой — как Сын Человеческий он принёс восстановление Полноты[a]. Ибо его происхождение было свыше, как семени истины, прежде чем возникло его низшее устроение[b]. В этом низшем устроении возникли многие власти и божества.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Полнота» — вероятно, специальный космологический термин; его точный коптский эквивалент требует проверки по рукописи.
    reason: Предотвращает восприятие слова только в обычном русском значении, не навязывая конкретной гностической системы.
  - marker: b
    text: 'Буквально по имеющемуся английскому свидетельству: «его (низшая) структура». Возможны иные понимания; чтение нуждается в сверке с коптским текстом.'
    reason: Фиксирует неопределённость исходной основы и предварительный характер формулировки.
lexical_decisions:
- source_word: lived in the flesh
  choice: жил во плоти
  rationale: Сохраняет телесно-богословскую формулировку свидетельства и звучит естественно в русском религиозном регистре.
- source_word: law of natural things
  choice: закон природных вещей
  rationale: Передаёт необычную и не вполне ясную формулировку буквально, не сводя её самовольно к «закону природы».
- source_word: Fullness
  choice: Полнота
  rationale: Заглавная буква сохраняет вероятный специальный космологический смысл термина, не подменяя его толкованием.
- source_word: dominions
  choice: власти
  rationale: Нейтрально передаёт сверхчеловеческие или космические силы, не уточняя их иерархию без коптской проверки.
- source_word: divinities
  choice: божества
  rationale: Сохраняет множественное число и космологическую неоднозначность исходного свидетельства.
theological_decisions:
- issue: Соотношение Сына Божьего и Сына Человеческого
  choice: Сохранено прямое утверждение «Сын Божий был Сыном Человеческим» и различение действий в двух качествах.
  alternative: Сгладить до позднейшей догматической формулы о двух природах.
  rationale: Текст должен сохранять собственную формулировку трактата и её напряжение, не импортируя конфессиональную терминологию.
- issue: Humanity and divinity
  choice: «обладая человечеством и божеством»
  alternative: «будучи человеком и Богом» или «имея человеческую и божественную природы»
  rationale: Выбранная передача следует абстрактным существительным английского свидетельства и избегает более определённой догматической интерпретации.
- issue: Lower structure
  choice: «низшее устроение» с примечанием
  alternative: «земное тело», «нижнее образование», «плотское устройство»
  rationale: Смысл выражения неясен, а прямая проверка коптского текста ещё не проведена; поэтому сохранена космологическая и антропологическая неоднозначность.
translation_notes:
  register: 'Современный литературный русский с достоинством трактатного и религиозно-философского стиля. Архаизмы сведены к устойчивому выражению «во плоти». Проект предварительный: предоставлена лишь англоязычная публикация-свидетельство, а непосредственная сверка с коптским текстом Nag Hammadi Codex I,4 ожидается.'
