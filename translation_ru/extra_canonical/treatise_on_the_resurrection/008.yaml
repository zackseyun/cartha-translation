base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/008.yaml
  text: 'There are some, however, who, in the course of their investigation, want to understand whether a person who is saved will be saved immediately upon casting off the body. Let no one doubt this. [...]. In fact, the visible limbs that are dead [] will not be saved, for in that case the living [limbs] that exist within them would rise.


    Then what is the resurrection? It is the continuing revelation of those who have risen. For if you remember reading in the gospel that Elijah appeared, with Moses beside him, do not think that the resurrection is an illusion. It is no illusion; rather, it is a reality! In fact, it would be more accurate to say that the world is an illusion than to say that the resurrection—which has taken place through our Lord, the Savior, Jesus Christ—is an illusion.'
translation:
  language: ru
  text: 'Однако некоторые в ходе своих изысканий хотят понять, будет ли спасённый, оставив тело, спасён сразу же. Пусть никто в этом не сомневается. […]. В самом деле, видимые члены, которые мертвы, [] не будут спасены, ведь тогда воскресли бы живые [члены], находящиеся в них.


    Что же такое воскресение? Это непрестанное явление тех, кто воскрес. Ведь если вы помните, как читали в Евангелии, что явился Илия, а с ним Моисей, не считайте воскресение иллюзией. Оно не иллюзия, а реальность! В самом деле, вернее было бы назвать иллюзией мир, нежели воскресение, совершившееся через нашего Господа и Спасителя Иисуса Христа.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: discarding the body
  choice: оставив тело
  rationale: Передаёт отделение от тела без усиления оттенка презрения, возможного в выражении «сбросив тело».
- source_word: immediately
  choice: сразу же
  rationale: Сохраняет временной акцент вопроса естественным современным русским языком.
- source_word: limbs
  choice: члены
  rationale: Сохраняет телесную и одновременно потенциально метафорическую широту свидетельства; «конечности» было бы чрезмерно узким.
- source_word: continuing revelation
  choice: непрестанное явление
  rationale: Сохраняет процессуальный смысл и связь с последующим явлением Илии и Моисея; «откровение» могло бы неоправданно сузить фразу до передачи учения.
- source_word: illusion
  choice: иллюзия
  rationale: Прямо сохраняет противопоставление кажимости и реальности, повторяющееся в отрывке.
- source_word: has come to pass through
  choice: совершившееся через
  rationale: Сохраняет совершившийся характер события и посредническую формулу, не уточняя её богословский механизм.
theological_decisions:
- issue: Момент спасения после оставления тела
  choice: 'Сохранено как вопрос с последующим уверенным утверждением: «Пусть никто в этом не сомневается»'
  alternative: Разъяснить, что именно подтверждается — немедленное спасение или более широкий тезис
  rationale: Повреждение текста и структура свидетельства не позволяют безопасно устранить референциальную неоднозначность.
- issue: Смысл «живых членов» внутри мёртвых видимых членов
  choice: Сохранена буквальная и трудная формулировка
  alternative: Истолковать «живые члены» как духовное тело или внутреннего человека
  rationale: Свидетельство допускает несколько антропологических прочтений; перевод не должен вводить частное доктринальное толкование.
- issue: Определение воскресения как continuing revelation
  choice: «непрестанное явление тех, кто воскрес»
  alternative: «продолжающееся откровение воскресших»
  rationale: Выбор поддерживает связь с явлением Илии и Моисея, но не превращает воскресение лишь в видение или символ.
- issue: Противопоставление мира и воскресения
  choice: Сохранено риторическое утверждение, что мир вернее назвать иллюзией
  alternative: Смягчить до «преходящего» или «нереального» мира
  rationale: Смягчение устранило бы намеренную богословскую напряжённость исходного свидетельства.
translation_notes:
  register: Современный литературный русский язык с достоинством трактатного стиля. Эллипсис, пустые квадратные скобки и восстановленное слово в квадратных скобках сохранены как сигналы повреждения или редакционного восстановления в предоставленном свидетельстве. Прямой разбор коптского текста ещё не выполнен, поэтому проект остаётся предварительным и основан на указанном англоязычном публичном свидетельстве.
