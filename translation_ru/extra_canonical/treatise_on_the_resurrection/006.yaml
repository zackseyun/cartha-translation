  source_fidelity: 'Перевод в целом точно следует доступному английскому свидетельству и English POB: сохранены избрание, предопределение, различие между Полнотой и Всем, а также лакуна после «не». Однако «действительно» в фразе об истине естественно читается как характеристика того, насколько надёжно «они хранят» истину, тогда как в свидетельстве emphatic «in fact» предпочтительнее отнести к утверждению о неутрачиваемости истины.'
  naturalness: Современный литературный регистр в целом выдержан. Небольшая перестановка усилительного слова делает фразу об истине более естественной и точнее передаёт логический акцент, не добавляя толкования.
  terminology: Термины «Полнота» и «Всё», а также «спасение», «искупление» и «предопределено» сохранены. «Порядок» для system допустим как нетехническая передача устроенного целого; оснований заменять его на «систему» нет. Скобочное «[спасение]» и лакуна после «не» сохранены с примечаниями.
