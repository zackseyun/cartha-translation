base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/006.yaml
  text: What those who are saved have thought will not perish. The minds of those who have known (salvation) will not perish. Therefore, we were chosen for salvation and redemption, because it was predetermined from the beginning that we would not fall into the foolishness of the ignorant, but would enter into the wisdom of those who know the truth. The truth they preserve cannot and will not be lost. The system of the Fullness is strong. What broke loose and became (the) world is weak. The All, however, is what is preserved. It did not [] come into being; it already existed.
translation:
  language: ru
  text: 'То, что помыслили спасённые, не погибнет. Не погибнет и ум тех, кто познал [спасение][a]. Поэтому мы были избраны для спасения и искупления: ведь от начала было предопределено, что мы не впадём в безрассудство неведающих, но войдём в мудрость тех, кто знает истину. Истина, которую они действительно хранят, не может и не будет утрачена. Крепок порядок Полноты. Слабо то, что отделилось и стало миром. Однако сохраняется именно Всё. Оно не [b] возникло — оно уже существовало.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «спасение» в доступном английском свидетельстве дано в круглых скобках как подразумеваемое дополнение; проверка по коптскому тексту ещё требуется.
    reason: Отмечает редакционное восполнение и не выдаёт его за бесспорно сохранившееся чтение.
  - marker: b
    text: После «не» в рукописи обозначена лакуна; её объём и утраченный текст по доступному свидетельству не устанавливаются.
    reason: Сохраняет видимой повреждённость рукописи и неопределённость синтаксиса.
lexical_decisions:
- source_word: mind
  choice: ум
  rationale: Передаёт способность разумения и сохраняет отличие от предшествующего «то, что помыслили», не сводя выражение к отдельным мыслям.
- source_word: redemption
  choice: искупление
  rationale: Обычный и понятный русский религиозный термин, достаточно широкий для данного контекста.
- source_word: the Fullness
  choice: Полнота
  rationale: Сохраняет терминологический и, вероятно, космологический характер понятия; прописная буква отличает его от бытового значения.
- source_word: system
  choice: порядок
  rationale: Естественнее по-русски, чем буквальное «система», и передаёт устроенное целое, не навязывая позднейшей технической схемы.
- source_word: what broke loose
  choice: то, что отделилось
  rationale: Передаёт разрыв или обособление без чрезмерно конкретного образа бегства либо падения.
- source_word: the All
  choice: Всё
  rationale: Сохраняет всеохватное субстантивированное понятие и его отличие от «Полноты», не отождествляя термины без достаточных оснований.
theological_decisions:
- issue: Предопределённое избрание к спасению
  choice: Сохранена прямая формулировка «мы были избраны» и «было предопределено».
  alternative: Ослабить до предведения, намерения или приглашения.
  rationale: Свидетель прямо говорит об избрании и предопределении; перевод не должен заранее согласовывать это с какой-либо конфессиональной системой.
- issue: Соотношение Полноты, мира и Всего
  choice: Полнота и Всё переданы как два формально различных термина, а возникновение мира — как отделение.
  alternative: Отождествить Полноту со Всем либо истолковать отделение как творение, падение или эманацию.
  rationale: Текст допускает космологические толкования, но данный фрагмент не определяет отношения терминов достаточно ясно, чтобы выбрать одно из них.
- issue: Неуничтожимость познания и истины
  choice: Сохранены категорические утверждения «не погибнет», «не может и не будет утрачена».
  alternative: Передать их как пожелание, нравственное наставление или условное обещание.
  rationale: В свидетельстве употреблены безусловные утверждения, и их богословское напряжение следует сохранить.
translation_notes:
  register: Современный литературный русский с краткими, торжественными фразами. Терминологические слова «Полнота» и «Всё» выделены прописной буквой. Перевод остаётся предварительным, поскольку непосредственная сверка с коптским источником ещё не проведена; доступный английский текст использован как публичное свидетельство, а English POB — как консультационный слой.
