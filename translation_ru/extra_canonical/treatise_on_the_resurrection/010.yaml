review_pass:
  verdict: revise
  source_fidelity: Проект в целом точно передаёт предоставленное английское свидетельство и сохраняет его намеренные богословские напряжения. Однако «достигшим цели» вносит отсутствующую в свидетельстве цель, а «люди освободятся» заменяет пассивное «будут освобождены» активной конструкцией. «Вновь обрести» также несколько смещает «receive again» («получить вновь»). Прямая сверка с коптским текстом по-прежнему необходима.
  naturalness: Стиль в целом современный литературный и соответствует наставительному регистру. Формулу «не мысли частичными истинами» можно сохранить как намеренно необычную; она отражает необычность исходного выражения. Убрано усилительное «лишь», отсутствующее в свидетельстве. «Прийти к такому выводу» делает переход естественным, не добавляя содержания.
  terminology: «Регин», «плоть», «оковы», «воскресение», «упражняться» и «эта стихия» приемлемы. Неоднозначное «эта стихия» сохранено и снабжено сноской. «Уже прибывшим» ближе к формулировке свидетельства, чем «достигшим цели», и не конкретизирует пункт прибытия.
  issues:
  - severity: medium
    issue: Добавлена «цель» в выражении «уже достигшим цели».
    rationale: English witness говорит лишь «having arrived» и не называет ни цели, ни места прибытия. Добавление цели разрешает намеренно неразъяснённый образ.
  - severity: medium
    issue: Пассивное «they shall be released» передано активным «люди освободятся».
    rationale: 'Активная возвратная конструкция меняет способ представления освобождения; безопаснее сохранить пассив: «они будут освобождены».'
  - severity: low
    issue: «Вновь обрести» вместо «receive again».
    rationale: «Обрести» может означать найти или достичь, тогда как свидетельство прямо говорит о повторном получении.
  - severity: low
    issue: Слово «лишь» в «лишь ради согласия с другими» не имеет прямой опоры в свидетельстве.
    rationale: Оно усиливает ограничительный смысл; для оптимально-эквивалентного перевода его лучше не добавлять.
  revised_text: 'Итак, о Регин, не мысли частичными истинами и не живи согласно этой плоти ради согласия с другими. Напротив, избегай разделений и оков — и ты уже теперь испытаешь воскресение. Ведь если смертное знает, что умрёт, то, хотя оно и проводит в этой жизни много лет, оно приходит к такому выводу: почему же тебе не считать себя воскресшим и уже прибывшим?


    Если ты обладаешь воскресением, зачем и дальше поступать так, словно тебе ещё предстоит умереть? Тебе следует знать, что ты уже умер. Ты не осознаёшь этого из-за недостатка упражнения. Каждому подобает упражняться различными способами, и они будут освобождены от этой стихии[b], чтобы не впасть в заблуждение, но вновь получить то, что было от начала.'
  revised_footnotes:
  - marker: b
    text: «Эта стихия» — неясное выражение; оно может обозначать некое начало, область или составную часть действительности. Точное значение требует сверки с коптским текстом.
    reason: Сохраняет неоднозначность выражения «this element» в предоставленном свидетельстве и не отождествляет его с телом, плотью, миром либо иным конкретным понятием.
  revision_rationale: Исправления устраняют не подкреплённые свидетельством уточнения («цели», «лишь»), восстанавливают пассивную форму освобождения и передают «receive again» без смыслового сдвига. Сноска [a] больше не требуется, поскольку «уже прибывшим» сохраняет неуказанность пункта прибытия непосредственно в тексте. Неоднозначность «этой стихии» сохранена в тексте и сноске.
