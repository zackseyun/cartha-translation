id: TRES.010
reference: Treatise on the Resurrection — Experience the Resurrection Now
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  text: 'So, O Rheginos, think not in partial (truths), and live not according to this flesh for the sake of agreeing (with others). Instead, flee divisions and bondages, and you will experience the resurrection now. Because if what is mortal knows that it will die, even though it passes many years in this life, it arrives at this: Why not consider yourself as risen and having arrived?


    If you possess the resurrection, why continue acting as if you will still die? You should know that you are already dead. You ignore this because of your lack of training. It is appropriate for everyone to train in various ways, and they shall be released from this element so that they will not fall into error, but shall receive again what was from the beginning.'
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/resurrection
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: 'So, O Rheginos, think not in partial (truths), and live not according to this flesh for the sake of agreeing (with others). Instead, flee divisions and bondages, and you will experience the resurrection now. Because if what is mortal knows that it will die, even though it passes many years in this life, it arrives at this: Why not consider yourself as risen and having arrived?


    If you possess the resurrection, why continue acting as if you will still die? You should know that you are already dead. You ignore this because of your lack of training. It is appropriate for everyone to train in various ways, and they shall be released from this element so that they will not fall into error, but shall receive again what was from the beginning.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/010.yaml
  text: 'So, O Rheginos, think not in partial (truths), and live not according to this flesh for the sake of agreeing with others. Instead, flee divisions and bondages, and you will experience the resurrection now. Because if what is mortal knows that it will die, even though it passes many years in this life, it arrives at this: Why not consider yourself as risen and having arrived?


    If you possess the resurrection, why continue acting as if you will still die? You should know that you are already dead. You ignore this because of your lack of training. It is appropriate for everyone to train in various ways, and they shall be released from this element so that they will not fall into error, but shall receive again what was from the beginning.'
translation:
  language: ru
  text: 'Итак, о Регин, не мысли частичными истинами и не живи согласно этой плоти лишь ради согласия с другими. Напротив, избегай разделений и оков — и ты уже теперь испытаешь воскресение. Ведь если смертное знает, что умрёт, то, хотя оно и проводит в этой жизни долгие годы, оно приходит к этому. Почему же тебе не считать себя воскресшим и уже достигшим цели?[a]


    Если ты обладаешь воскресением, зачем и дальше поступать так, словно тебе ещё предстоит умереть? Тебе следует знать, что ты уже умер. Ты не осознаёшь этого из-за недостатка упражнения. Каждому подобает упражняться различными способами; тогда люди освободятся от этой стихии[b], чтобы не впасть в заблуждение, но вновь обрести то, что было от начала.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по английскому свидетельству: «считать себя воскресшим и прибывшим (достигшим)». Точная цель прибытия не названа.'
    reason: Перевод «достигшим цели» делает фразу естественной по-русски, но исходное выражение остаётся неоднозначным.
  - marker: b
    text: «Эта стихия» — неясное выражение; оно может обозначать некое начало, область или составную часть действительности. Точное значение требует сверки с коптским текстом.
    reason: Необходимо сохранить отмеченную в консультационном слое неоднозначность и предупредить против отождествления с конкретным понятием.
lexical_decisions:
- source_word: partial (truths)
  choice: частичными истинами
  rationale: Сохраняет необычное и, вероятно, техническое выражение английского свидетельства, не сводя его к более однозначным «полуправдам».
- source_word: flesh
  choice: плоть
  rationale: Традиционный и понятный религиозно-философский термин; сохраняет возможное противопоставление телесного и духовного.
- source_word: bondages
  choice: оковы
  rationale: Передаёт состояние несвободы естественно и образно, не уточняя его природу.
- source_word: experience the resurrection now
  choice: уже теперь испытаешь воскресение
  rationale: Передаёт именно переживание воскресения в настоящем, не подменяя его отвлечённым знанием.
- source_word: having arrived
  choice: уже достигшим цели
  rationale: По-русски простое «прибывшим» здесь неясно; «достигшим цели» выражает завершённость пути, но отмечено сноской из-за неоднозначности.
- source_word: training / train
  choice: упражнение / упражняться
  rationale: Сохраняет мотив практического духовного обучения и повтор слова, не уточняя конкретную дисциплину.
- source_word: this element
  choice: эта стихия
  rationale: Сохраняет неясность исходного свидетельства и возможный космологический оттенок, не отождествляя выражение самовольно с телом или миром.
- source_word: what was from the beginning
  choice: то, что было от начала
  rationale: Сохраняет неопределённость предмета восстановления и характерную формулу начала.
theological_decisions:
- issue: Воскресение как настоящее переживание
  choice: «уже теперь испытаешь воскресение» и «обладаешь воскресением»
  alternative: Истолковать речь исключительно как образ нравственного обновления или исключительно как будущее телесное воскресение
  rationale: Текст намеренно говорит о воскресении как о нынешней реальности, не отменяя и не разъясняя иных его аспектов.
- issue: Утверждение «ты уже умер»
  choice: Сохранено буквально
  alternative: Смягчить до «считай себя умершим для прежней жизни»
  rationale: Добавление объекта смерти разрешило бы богословское напряжение, которого само свидетельство не разрешает.
- issue: Освобождение «от этой стихии»
  choice: Референт оставлен неопределённым
  alternative: Передать как освобождение от тела, плоти, мира или материального начала
  rationale: Ни предоставленное свидетельство, ни текущий уровень источниковой проверки не позволяют уверенно выбрать одно толкование.
- issue: «Вновь обрести то, что было от начала»
  choice: Объект не конкретизирован
  alternative: Назвать его первоначальной природой, образом, жизнью или состоянием
  rationale: Так сохраняется смысловая открытость текста без внесения частной доктрины.
translation_notes:
  register: 'Современный литературный русский язык с достоинством философско-наставительного трактата. Обращение «о Регин» сохраняет риторическую форму. Перевод предварительный: выполнен по предоставленному общественнодоступному английскому свидетельству; прямая сверка с коптским оригиналом ещё требуется.'
