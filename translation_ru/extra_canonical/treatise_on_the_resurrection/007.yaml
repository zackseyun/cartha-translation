translation:
  language: ru
  text: 'Итак, никогда не сомневайся в воскресении, сын мой Регин! Ведь если некогда ты не жил во плоти, то, войдя в этот мир, ты облёкся в плоть.


    Почему же тебе не облечься в плоть, когда ты (вернёшься и) взойдёшь в эон?[a] То, что лучше плоти, — это то, что даёт жизнь. Разве возникшее ради тебя не принадлежит тебе? Разве то, что принадлежит тебе, не пребывает с тобой? Но пока ты в этом мире, чего тебе недостаёт? Именно это ты с таким усердием пытался открыть.


    Послед[b] тела — старость, и ты пребываешь в состоянии смертности. То, чего тебе недостаёт, — приобретение, ведь если ты уйдёшь, то не утратишь лучшего. Худшее приходит в упадок, но и для него есть благодать.


    Итак, ничто не может искупить нас от этого мира.[c] Однако мы — Всё, и потому мы спасены.[d] Мы обрели спасение от начала до конца. Будем так мыслить. Будем так понимать.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Эон» — буквальная передача специального термина; здесь он может обозначать вечную или надмирную область бытия. Слова «вернёшься и» в доступном английском свидетельстве стоят в скобках и потому сохранены как текстуально неуверенные.
    reason: Пояснить технический термин и отметить редакционную неопределённость скобочного восстановления.
  - marker: b
    text: 'Буквально: «послед тела». Образ необычен и, по-видимому, представляет старость как завершающий остаток или поздний плод телесного существования.'
    reason: Русское слово точно, но редко и требует краткого пояснения метафоры.
  - marker: c
    text: 'В доступном свидетельстве фраза буквально означает: «ничто не может искупить нас от этого мира». Это трудное чтение сохранено без исправления до прямой сверки с коптским текстом.'
    reason: Предупредить читателя о возможной текстовой или переводческой трудности.
  - marker: d
    text: «Всё» может быть специальным обозначением полноты бытия; текст не уточняет его смысл. Связка «и потому» передаёт логическую связь, отмеченную в свидетельстве скобками.
    reason: Сохранить терминологическую неоднозначность и обозначить менее уверенный характер связки.
lexical_decisions:
- source_word: flesh
  choice: плоть / облечься в плоть
  rationale: Сохраняет повтор ключевого понятия и естественно передаёт принятие плоти при вхождении в мир, не сводя «плоть» просто к телу.
- source_word: aeon
  choice: эон
  rationale: Сохраняет специальный космологический термин и его неоднозначность; не заменяет его толкованием вроде «вечность» или «небесный мир».
- source_word: the All
  choice: Всё
  rationale: Передаёт технически нагруженное обозначение совокупной полноты без внесения более узкого термина «Плерома».
- source_word: afterbirth
  choice: послед
  rationale: Буквально сохраняет резкий телесный образ исходного свидетельства; значение поясняется сноской.
- source_word: grace
  choice: благодать
  rationale: Сохраняет религиозно-богословскую ёмкость слова, не уточняя, означает ли оно милость, дар или восстановление.
theological_decisions:
- issue: Характер плоти при восхождении в эон
  choice: Сохранён парадоксальный вопрос «облечься в плоть»
  alternative: Истолковать как получение духовного или воскресшего тела
  rationale: Свидетельство говорит о flesh и оставляет напряжение с последующим утверждением о том, что лучше плоти; перевод не должен заранее разрешать это напряжение.
- issue: «Ничто не может искупить нас от этого мира»
  choice: Сохранена отрицательная формулировка
  alternative: Исправить по предполагаемому смыслу на «ничто в этом мире не может искупить нас» или «нечто может искупить»
  rationale: При отсутствии прямой коптской сверки нельзя молча исправлять трудное чтение английского свидетельства.
- issue: «Мы — Всё» как основание спасения
  choice: Сохранено «мы — Всё, и потому мы спасены»
  alternative: Понимать «Всё» как Бога, Церковь или полноту избранных
  rationale: Текст не определяет референт однозначно; перевод сохраняет его космологическую и сотериологическую напряжённость.
- issue: Благодать для «худшего»
  choice: Сохранено «и для него есть благодать»
  alternative: Истолковать как окончательное уничтожение или обязательное восстановление тела
  rationale: Фраза допускает разные богословские прочтения, ни одно из которых не следует вносить в основной текст.
translation_notes:
  register: 'Современный литературный русский с наставительным, достоинственным тоном. Повторы и краткие параллельные призывы сохранены. Проект предварительный: он основан на предоставленном публичнодоступном английском свидетельстве; прямая сверка с коптским текстом Nag Hammadi Codex I,4 ещё требуется.'
