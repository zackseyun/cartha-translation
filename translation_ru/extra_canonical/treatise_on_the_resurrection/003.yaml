id: TRES.003
reference: Treatise on the Resurrection — The Savior Swallowed Up Death
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  text: 'I realize I am giving [] the answer in complex language. There is nothing, however, hard (to understand about) the word of truth. Because, however, the answer appeared so nothing would remain hidden, but to make all things about existence manifest, (the result was) the obliteration of evil on the one hand, (and) on the other hand the revelation of the chosen ones. (All) this is the emanation of truth and spirit, grace being from truth.


    People do not consider you unaware that the Savior swallowed up death, because he dispensed with the perishable world. He transformed [it] into an imperishable aeon and raised himself up, swallowing up the visible by means of the invisible, thus paving the way for us to our immortality.'
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/resurrection
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: 'I realize I am giving [] the answer in complex language. There is nothing, however, hard (to understand about) the word of truth. Because, however, the answer appeared so nothing would remain hidden, but to make all things about existence manifest, (the result was) the obliteration of evil on the one hand, (and) on the other hand the revelation of the chosen ones. (All) this is the emanation of truth and spirit, grace being from truth.


    People do not consider you unaware that the Savior swallowed up death, because he dispensed with the perishable world. He transformed [it] into an imperishable aeon and raised himself up, swallowing up the visible by means of the invisible, thus paving the way for us to our immortality.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/003.yaml
  text: 'I realize that I am giving [] the answer in complex language. Yet there is nothing difficult to understand about the word of truth. The answer appeared so that nothing would remain hidden, but so that everything about existence would be revealed. The result was, on the one hand, the obliteration of evil and, on the other, the revelation of the chosen ones. All this is the emanation of truth and spirit, with grace coming from truth.


    People do not think that you are unaware that the Savior swallowed up death, because he did away with the perishable world. He transformed [it] into an imperishable aeon and raised himself up, swallowing up the visible by means of the invisible and thus preparing the way for us to our immortality.'
translation:
  language: ru
  text: 'Я понимаю, что излагаю [] ответ сложным языком.[a] Однако в слове истины нет ничего трудного для понимания. Ответ явился для того, чтобы ничто не осталось сокрытым, но чтобы открылось всё, что относится к существованию. Результатом стало, с одной стороны, уничтожение зла, а с другой — явление избранных. Всё это — истечение истины и духа, причём благодать исходит от истины.


    Люди не считают, что ты не знаешь: Спаситель поглотил смерть, поскольку упразднил тленный мир. Он преобразил [его] в нетленный эон[b] и вознёсся сам, поглотив видимое посредством невидимого и тем самым проложив нам путь к бессмертию.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Пустые квадратные скобки обозначают утрату или неразборчивое место в рукописной традиции; отсутствующее слово не восстанавливается.
    reason: Необходимо объяснить видимый лакунарный знак, сохранённый в основном тексте.
  - marker: b
    text: «Эон» может означать век, эпоху, вечность либо особую область или порядок бытия; термин сохранён из-за неопределённости контекста.
    reason: Предотвращает неоправданное сужение многозначного древнего термина.
lexical_decisions:
- source_word: word of truth
  choice: слово истины
  rationale: Сохраняет формулу свидетельства и её возможный богословский вес, не сводя её к «истинному учению» или «верному сообщению».
- source_word: emanation
  choice: истечение
  rationale: Передаёт образ происхождения или исхождения и не вводит более узкий технический термин без прямой сверки с коптским текстом.
- source_word: aeon
  choice: эон
  rationale: Термин сохранён транслитерацией, поскольку здесь он может обозначать век, область или порядок бытия; перевод «вечность» либо «мир» преждевременно устранил бы неоднозначность.
- source_word: swallowed up
  choice: поглотил
  rationale: Сохраняет сильный образ полного одоления смерти и параллель с последующим поглощением видимого.
- source_word: dispensed with / did away with
  choice: упразднил
  rationale: Передаёт прекращение власти или существования тленного мира, не усиливая формулировку до физического уничтожения.
- source_word: raised himself up
  choice: вознёсся сам
  rationale: Сохраняет возвратный оттенок свидетельства и допускает как пространственное, так и возвышающее значение, не подменяя его однозначным «воскресил себя».
theological_decisions:
- issue: Связь Спасителя с преодолением смерти и тленного мира
  choice: Сохранена причинная конструкция «поскольку упразднил тленный мир»
  alternative: «тем самым покончив с тленным миром»
  rationale: Исходное свидетельство формально связывает поглощение смерти с устранением тленного мира; перевод не должен уточнять механизм этой связи.
- issue: Смысл преобразования мира в нетленный эон
  choice: «преобразил [его] в нетленный эон»
  alternative: «превратил его в вечный мир»
  rationale: Сохраняются редакторские скобки и терминологическая открытость «эона», чтобы не навязывать конкретную космологию.
- issue: «Истечение истины и духа»
  choice: Сохранено сочинение двух понятий без уточнения их отношения
  alternative: «истечение истинного Духа»
  rationale: Свидетельство допускает понимание истины и духа как двух координированных понятий; объединение их в одно выражение устранило бы подлинную неоднозначность.
translation_notes:
  register: 'Современный литературный русский язык с возвышенным, но доступным регистром. Синтаксис слегка упрощён ради ясности, при этом сохранены параллелизм «с одной стороны… с другой» и ключевые образы свидетельства. Проект предварительный: он основан на предоставленном англоязычном публичном свидетельстве; прямая сверка с коптским источником ещё требуется.'
