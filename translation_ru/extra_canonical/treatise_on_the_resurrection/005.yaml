  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/005.yaml
  text: 'However, if some do not believe, (this is because) they cannot be convinced. For, my son, that the dead will rise pertains to faith, and not to argumentation.


    Of philosophers in this world, there are some who believe, so that at least they will rise. And let not the philosopher who is in this world feel justified in believing that he returns himself (to life from death) by himself. For on account of our faith we know the Son of Man, and we believe he rose from among the dead, of whom we declare, “He became the obliteration of death.” For great is belief and <great> are those who believe.'
translation:
  language: ru
  text: 'Однако если некоторые не верят, то потому, что их невозможно убедить. Ведь, сын мой, то, что мёртвые воскреснут, относится к вере, а не к рассуждениям.


    Среди философов этого мира есть такие, которые верят, чтобы хотя бы они воскресли. И пусть философ этого мира не считает себя правым, полагая, будто он сам возвращает себя к жизни после смерти. Ибо благодаря нашей вере мы знаем Сына Человеческого и верим, что Он воскрес из мёртвых. О Нём мы возвещаем: «Он стал уничтожением смерти». Ведь велика вера и <велики> верующие.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «велики» восстановлено издателями в повреждённом или неполном месте текста; угловые скобки сохраняют обозначение реконструкции в используемом английском свидетельстве.
    reason: Необходимо явно сохранить текстологическую отметку <great>, присутствующую в предоставленном свидетельстве.
lexical_decisions:
- source_word: cannot be convinced
  choice: их невозможно убедить
  rationale: Передаёт невозможность убедить этих людей, не уточняя без достаточных оснований, вызвана ли она их неспособностью, нежеланием или непреклонностью.
- source_word: pertains to faith, and not to argumentation
  choice: относится к вере, а не к рассуждениям
  rationale: Сохраняет противопоставление веры и рассудочного доказательства, не добавляя мысли о бездумной или иррациональной вере.
- source_word: philosophers in this world
  choice: философы этого мира
  rationale: Естественное русское выражение, сохраняющее повторяющийся в свидетельстве мотив «этого мира».
- source_word: returns himself (to life from death) by himself
  choice: он сам возвращает себя к жизни после смерти
  rationale: Сохраняет подчёркнутое двойное указание на самостоятельное возвращение к жизни и раскрывает пояснение, данное в английском свидетельстве в скобках.
- source_word: obliteration of death
  choice: уничтожение смерти
  rationale: Передаёт сильный образ полного устранения смерти; более мягкие варианты вроде «победа над смертью» ослабили бы формулировку.
- source_word: belief / those who believe
  choice: вера / верующие
  rationale: Сохраняет смысловую и корневую связь настолько, насколько это естественно по-русски.
theological_decisions:
- issue: Связь воскресения с верой, а не с аргументацией
  choice: Сохранить прямое противопоставление без поясняющей гармонизации
  alternative: Истолковать фразу как отрицание всякой разумной защиты веры либо, напротив, смягчить её до утверждения о первенстве веры
  rationale: Свидетельство формулирует напряжённое противопоставление; перевод не должен заранее разрешать его богословский смысл.
- issue: Способ воскресения философа
  choice: Сохранить отрицание самостоятельного возвращения себя к жизни
  alternative: Прямо добавить, что воскресение совершает Бог или Христос
  rationale: Контекст предполагает несамостоятельность воскресения, но в данном отрывке действующее лицо прямо не названо; добавление устранило бы исходную недосказанность.
- issue: Местоимение в отношении Сына Человеческого
  choice: Передать «О Нём» и «Он» с прописной буквы
  alternative: Использовать строчные местоимения
  rationale: Такой выбор соответствует современному русскому библейскому регистру и ясно связывает цитируемое высказывание с Сыном Человеческим, не вводя дополнительного толкования.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского наставления. Обращение «сын мой» и формула «Сын Человеческий» сохранены. Перевод предварительный: он основан на предоставленном общедоступном английском свидетельстве; непосредственная сверка с коптским текстом Nag Hammadi Codex I,4 ещё не выполнена. Необычная логика фразы о верующих философах сохранена, а не сглажена догадкой.'
