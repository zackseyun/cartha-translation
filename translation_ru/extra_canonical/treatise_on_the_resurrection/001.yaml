  text: '[] My son Rheginos, some wish to learn many things. This is their objective when preoccupied with questions whose answers they lack. If they are successful with these, they tend to think of themselves as quite important. I, however, do not believe they have attained to the word of truth. Instead, they look out for their own satisfaction, when we have received (true satisfaction) through our Savior, our Lord Christ. [] We obtained it when we knew the truth and found our repose in it.


    Since, however, you politely request what is the correct (interpretation) of the resurrection, I write to you what is essential. Many surely put no faith in it. A few, however, find it. Let us then discuss the topic.'
translation:
  language: ru
  text: '[] Сын мой Регин, некоторые желают узнать многое. К этому они и стремятся, погружаясь в вопросы, на которые у них нет ответов. Если им удаётся найти ответы, они склонны считать себя весьма значительными. Я же не думаю, что они достигли слова истины. Они ищут лишь собственного удовлетворения, тогда как мы обрели истинное удовлетворение через нашего Спасителя, Господа нашего Христа. [] Мы обрели его, когда познали истину и нашли в ней покой.


    Но поскольку ты учтиво спрашиваешь, каково правильное понимание воскресения[a], я пишу тебе о самом существенном. Многие, конечно, в него не верят, однако немногие обретают его[b]. Итак, обсудим эту тему.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «понимание» передаёт восстановление, отмеченное в английском свидетельстве круглыми скобками; прямую проверку по коптскому тексту ещё предстоит провести.
    reason: Указывает на текстологическую неуверенность и не выдаёт редакционное восполнение за несомненный текст.
  - marker: b
    text: 'Буквально по представленному свидетельству: «немногие, однако, находят его». Возможно также понимание: «немногие приходят к нему».'
    reason: Сохраняет неоднозначность того, означает ли «обрести» принятие, понимание или переживание воскресения.
lexical_decisions:
- source_word: Rheginos
  choice: Регин
  rationale: Передача личного имени в форме, естественной для русской литературной и историко-религиозной традиции.
- source_word: word of truth
  choice: слово истины
  rationale: Сохранён буквальный и богословски ёмкий оборот без сведения его к «истинному учению».
- source_word: satisfaction
  choice: удовлетворение
  rationale: Сохранён контраст между своекорыстным поиском удовлетворения и удовлетворением, обретённым через Спасителя; добавленное в свидетельстве уточнение «истинное» передано без скобок для ясности.
- source_word: repose
  choice: покой
  rationale: «Покой» естественно передаёт состояние обретённой завершённости и сохраняет возможный духовно-богословский оттенок.
- source_word: resurrection
  choice: воскресение
  rationale: Стандартный русский религиозный термин, не уточняющий заранее природу воскресения.
- source_word: find it
  choice: обретают его
  rationale: Сохранён необычный переход от неверия в воскресение к его «обретению», не заменённый более истолковывающим «понимают».
theological_decisions:
- issue: Что именно означает «правильное» применительно к воскресению
  choice: правильное понимание воскресения
  alternative: истинное истолкование воскресения
  rationale: Формулировка отражает дополненное в английском свидетельстве слово «interpretation», но не утверждает, что оно непосредственно засвидетельствовано в повреждённом коптском тексте.
- issue: Объект местоимения в выражении «немногие находят его»
  choice: 'сохранить отсылку к воскресению: «немногие обретают его»'
  alternative: «немногие приходят к вере в него»
  rationale: Более толковательный вариант снял бы смысловое напряжение между верой в воскресение и его обретением.
- issue: Контраст двух видов удовлетворения
  choice: «собственное удовлетворение» и «истинное удовлетворение»
  alternative: «самоуслаждение» и «подлинное удовлетворение»
  rationale: Выбран современный и нейтральный язык, сохраняющий противопоставление без внесения аскетической или конфессиональной оценки.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского наставительного письма. Синтаксис упрощён лишь там, где это необходимо для ясности. Обозначения лакун [] сохранены по свидетельству. Проект предварительный: коптский оригинал не был предоставлен для прямой сверки, поэтому перевод опирается на указанное общедоступное английское свидетельство.'
