  source_fidelity: 'Предварительная сверка возможна только с предоставленным английским свидетельством: лакуна после «my» сохранена, включение «brothers and sisters» передано явно, а двусмысленность/смысловое напряжение в наставлении о передаче текста не снято. Веб-материалы после названия корректно исключены. Прямая проверка по коптскому тексту Nag Hammadi I,4 всё ещё необходима.'
