  terminology: «Милость», «Господь», «братья и сёстры», «мир» и «благодать» уместны и не вносят конфессиональной интерпретации. «Объяснение слова» точнее передаёт supplied witness «explanation of the word», не превращая «слово» в заранее определённое «учение».
  issues:
