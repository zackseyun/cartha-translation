translation:
  language: ru
  text: 'По милости моего […] Господа Иисуса Христа я получил всё это. Обо всём этом я наставил вас и ваших братьев и сестёр, дети мои, не упустив ничего, что могло бы укрепить вас. Если же в моём изложении слова я написал что-либо неясное, то объясню вам, если вы спросите.


    Теперь же не беспокойтесь о том, чтобы поделиться этим с кем-либо из вашей среды, потому что это может принести пользу.[a]


    Многие исследуют вопросы, о которых я написал вам. Им я говорю: мир им и благодать.


    Приветствую вас и тех, кто любит вас братской любовью.


    «Трактат о воскресении»'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Смысл фразы в доступном английском свидетельстве не вполне ясен: она может относиться либо к беспокойству по поводу передачи текста, либо к самой его передаче. Перевод сохраняет эту неопределённость; требуется сверка с коптским текстом.'
    reason: Не допустить безосновательного устранения смыслового напряжения до прямой проверки источника.
lexical_decisions:
- source_word: graciousness
  choice: милость
  rationale: Передаёт дарующую благосклонность Господа естественным и богословски нейтральным русским словом.
- source_word: my [] Lord
  choice: моего […] Господа
  rationale: Сохранён сигнал лакуны или повреждения рукописи без попытки восстановить отсутствующий текст.
- source_word: the word
  choice: слово
  rationale: 'Сохранена возможная многозначность: речь может идти как о содержании учения, так и об изложенном послании.'
- source_word: brothers and sisters
  choice: братьев и сестёр
  rationale: Явно передаёт смешанную общину, как это отражено в предоставленном свидетельстве.
- source_word: looking into
  choice: исследуют
  rationale: Передаёт активное рассмотрение поставленных вопросов без добавления оттенка сомнения или спора.
- source_word: love of brothers and sisters
  choice: братской любовью
  rationale: Естественная русская формулировка для взаимной любви членов общины; не ограничивает её биологическим родством.
- source_word: The Treatise on the Resurrection
  choice: «Трактат о воскресении»
  rationale: Устоявшийся и ясный перевод названия произведения.
theological_decisions:
- issue: Характер «слова» в выражении «explanation of the word»
  choice: «в моём изложении слова»
  alternative: «в моём толковании учения»
  rationale: Буквальное «слово» сохраняет неопределённость и не навязывает отождествление с конкретным учением или Писанием.
- issue: Адресаты выражения «brothers and sisters»
  choice: «братьев и сестёр»
  alternative: «братьев» как родовое обозначение общины
  rationale: Предоставленное свидетельство прямо включает оба пола; явная формулировка понятна современному читателю и не вносит конфессиональной специфики.
- issue: Неясная логика наставления о распространении текста
  choice: Сохранить формулировку и снабдить примечанием
  alternative: Исправить смысл на «не медлите делиться» или «не стремитесь делиться»
  rationale: Английское свидетельство сочетает запрет не беспокоиться о распространении с указанием на возможную пользу. Поскольку прямой разбор коптского источника ещё не выполнен, неоднозначность нельзя молча устранять.
translation_notes:
  register: 'Современный литературный русский язык с достоинством эпистолярного заключения. Перевод предварительный: он основан на предоставленном англоязычном свидетельстве, поскольку прямая сверка с коптским текстом Наг-Хаммади I,4 ещё не проведена. Квадратная лакуна сохранена как […]. Позднейшие элементы веб-страницы — FAQ, контактные данные и рекламное уведомление — исключены как редакционная обвязка, не принадлежащая древнему произведению.'
