id: TRES.004
reference: Treatise on the Resurrection — The Spiritual Resurrection
language:
  code: ru
  name: Russian
  native_name: Русский
  variant: modern literary Russian
source:
  text: Then, as the apostle in fact said, “We suffered with him, and we rose with him, and we ascended to heaven with him.” Now if we visibly live in this world, we wear this world. We are his radiant beams, and we continue with him until our setting, that is, our death in this life. By him we are drawn to heaven, like beams by the sun, constrained by nothing. This is the spiritual resurrection, [] swallowing up the soul just as it does the flesh.
  text_scope: public_domain_english_witness
  manuscript: Nag Hammadi Codex I,4
  ancient_language: Coptic (source-language review pending)
  drafting_basis: Public-domain English translation witness; direct source-language review pending
  witness_url: https://www.luminescence-llc.net/resurrection
  witness_translator: Samuel Zinner / Mark M. Mattison
  witness_license: Public domain witness
  english_witness: Then, as the apostle in fact said, “We suffered with him, and we rose with him, and we ascended to heaven with him.” Now if we visibly live in this world, we wear this world. We are his radiant beams, and we continue with him until our setting, that is, our death in this life. By him we are drawn to heaven, like beams by the sun, constrained by nothing. This is the spiritual resurrection, [] swallowing up the soul just as it does the flesh.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/treatise_on_the_resurrection/004.yaml
  text: Then, as the apostle truly said, “We suffered with him, and we rose with him, and we ascended to heaven with him.” If we live visibly in this world, we wear this world. We are his radiant beams, and we remain with him until our setting—that is, our death in this life. Through him we are drawn to heaven, like rays drawn by the sun, with nothing holding us back. This is the spiritual resurrection, [] swallowing up the soul just as it swallows up the flesh.
translation:
  language: ru
  text: 'Итак, как верно сказал апостол: «Мы страдали вместе с Ним, и вместе с Ним воскресли, и вместе с Ним взошли на небо». Если же мы зримым образом живём в этом мире, то носим на себе этот мир. Мы — Его сияющие лучи и остаёмся с Ним до нашего заката, то есть до нашей смерти в этой жизни. Им мы влечёмся на небо, как лучи — солнцем, и ничто нас не удерживает. Это и есть духовное воскресение, [a] поглощающее душу так же, как и плоть.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В рукописи в этом месте имеется повреждение или невосстановленный пропуск; его объём и содержание неясны.
    reason: Пустые квадратные скобки в английском публичном свидетеле обозначают лакуну, которую необходимо отметить в основном тексте.
lexical_decisions:
- source_word: we wear this world
  choice: носим на себе этот мир
  rationale: Сохранён необычный образ английского свидетеля без сведения его к более однозначному «облекаемся в этот мир»; добавление «на себе» делает фразу естественнее по-русски.
- source_word: radiant beams
  choice: сияющие лучи
  rationale: Передаёт световой образ, который продолжается в последующем сравнении с солнцем.
- source_word: our setting
  choice: нашего заката
  rationale: Сохранена метафора захода светила; следующая пояснительная фраза прямо связывает её со смертью.
- source_word: By him we are drawn to heaven
  choice: Им мы влечёмся на небо
  rationale: Сохраняет агентность Христа и образ притяжения, не уточняя его механизм.
- source_word: spiritual resurrection
  choice: духовное воскресение
  rationale: Прямой и традиционно понятный эквивалент, сохраняющий богословский термин исходного свидетеля.
- source_word: swallowing up
  choice: поглощающее
  rationale: Сохраняет сильный и богословски напряжённый образ, не заменяя его истолкованием.
theological_decisions:
- issue: Соучастие верующих в страдании, воскресении и вознесении Христа
  choice: Сохранены параллельные формулы «вместе с Ним»
  alternative: Передать как уже завершённое мистическое единение без повторов
  rationale: Повтор отражает риторическую структуру свидетеля и не разрешает временное или мистическое значение утверждений.
- issue: Духовное воскресение поглощает душу и плоть
  choice: Сохранена формулировка о поглощении и души, и плоти
  alternative: Истолковать как спасение, преображение или уничтожение души и плоти
  rationale: Свидетель допускает напряжённую неоднозначность; конкретизация внесла бы чуждое толкование.
- issue: Кто обозначен местоимением «Он/Им»
  choice: Местоимения сохранены без вставки имени «Христос»
  alternative: Явно назвать Христа
  rationale: Контекст указывает на Христа, но исходный свидетель использует местоимение; явное уточнение не требуется.
translation_notes:
  register: Современный литературный русский язык с достоинством трактатного стиля. Сохранены световые метафоры, риторический параллелизм и богословская неоднозначность. Черновик основан на публичном английском свидетеле; прямая сверка с коптским текстом пока не выполнена.
