review_pass:
  verdict: revise
  source_fidelity: Черновик в целом точно следует предоставленному английскому свидетелю и сохраняет его образность, параллелизм и намеренную неопределённость. Однако «верно сказал» несколько смещает смысл *in fact / truly* к оценке правильности высказывания; безопаснее передать вводное усиление как «действительно сказал».
  naturalness: Текст написан современным литературным русским; «носим на себе этот мир», «наш закат» и «влечёмся» намеренно сохраняют необычность образов трактата. Небольшая правка вводной формулы делает её естественнее и точнее.
  terminology: «Духовное воскресение», «плоть», «сияющие лучи» и повтор «вместе с Ним» удачны. Местоименная отсылка к Христу не раскрывается без необходимости. Лакуна отмечена в тексте и снабжена корректной сноской.
  issues:
  - severity: low
    issue: «как верно сказал апостол»
    rationale: «Верно» может означать, что апостол сказал нечто правильно, тогда как свидетель употребляет усилительную вводную формулу (*in fact*, в POB *truly*). «Как действительно сказал апостол» точнее сохраняет её функцию.
  revised_text: 'Итак, как действительно сказал апостол: «Мы страдали вместе с Ним, и вместе с Ним воскресли, и вместе с Ним взошли на небо». Если же мы зримым образом живём в этом мире, то носим на себе этот мир. Мы — Его сияющие лучи и остаёмся с Ним до нашего заката, то есть до нашей смерти в этой жизни. Им мы влечёмся на небо, как лучи — солнцем, и ничто нас не удерживает. Это и есть духовное воскресение, [a] поглощающее душу так же, как и плоть.'
