    issue: «Почему вы […] скрылись?»
    rationale: Совершенный вид добавляет оттенок завершённого действия, которого в повреждённом английском свидетельстве нет. «Почему вы […] прячетесь?» сохраняет вопрос и лакуну, не конкретизируя аспект.
