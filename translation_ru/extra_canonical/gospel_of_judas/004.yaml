    rationale: Черновик неявно передаёт «of the stars» как простое «звёзд». «[…] из звёзд» точнее отражает английское свидетельство и остаётся фрагментарным.
  revised_text: 'В другой день Иисус пришёл к ним. Они сказали Ему: «Учитель, мы видели Тебя во сне, потому что прошлой ночью нам приснились великие [сны]».


    Но Иисус сказал: «Почему вы […] прячетесь?»[a]


    И они [сказали: «Мы увидели] большой [дом, а в нём — большой] жертвенник, [и] двенадцать человек — мы бы сказали, что это священники, — а также некое имя.[b] Множество людей ожидало у жертвенника, [пока] священники [не закончат принимать] приношения. Мы тоже продолжали ждать».


    [Иисус спросил]: «Какими они были?»


    Они ответили: «[Одни] постятся [по] две недели. Другие приносят в жертву собственных детей; иные — своих жён, восхваляя и унижая себя друг перед другом. Другие ложатся с мужчинами; иные убивают; а иные совершают множество грехов и преступлений. [И] люди, стоящие [перед] жертвенником, призывают Твоё [имя]! И всеми своими жертвоприношениями они наполняют [жертвенник] приношениями». Сказав это, [они] умолкли, потому что были встревожены.


    Иисус сказал им: «Почему вы встревожены? Истинно говорю вам: все священники, стоящие перед тем жертвенником, призывают Моё имя. И [ещё] говорю вам: человеческие поколения написали Моё имя на этом [доме] поколений звёзд.[c] [И они] постыдно насадили бесплодные деревья во имя Моё».


    Иисус сказал им: «Это вы принимаете приношения на жертвеннике, который видели. Вот Бог, которому вы служите, а вы — те двенадцать человек, которых видели. Животные же, которых вы видели приведёнными на заклание, — это множество людей, которых вы вводите в заблуждение перед тем жертвенником. [Ваш служитель] встанет и будет так пользоваться Моим именем, и [поколения] благочестивых останутся ему верны. После него другой представит [предающихся распутству], ещё другой — убивающих детей, ещё один — тех, кто ложится с мужчинами, а также постящихся и всё остальное — нечистоту, преступление и заблуждение. А говорящие: „Мы равны ангелам“ — это звёзды, которые всё доводят до конца.[d] Человеческим поколениям сказано: „Вот, Бог принял вашу жертву из рук священников, то есть из рук служителя заблуждения“. Но повелевающий Господь — Господь над всем. В последний день они будут признаны виновными».


    Иисус сказал [им]: «Перестаньте [приносить животных в жертву]. Вы [принесли их] над жертвенником, над вашими звёздами вместе с вашими ангелами, где они уже достигли завершения.[e] Так пусть они станут […] с вами и пусть [станут] явными».[f]


    Его ученики [сказали Ему]: «Очисти нас от наших [грехов], которые мы совершили из-за обмана ангелов».


    Иисус сказал им: «Это невозможно […], как не [может] источник погасить огонь всей обитаемой земли. И колодец [одного города] не может напоить все поколения — только великий, неколебимый.[g] Один светильник не осветит всех миров — только второе поколение; и один пекарь не может накормить всё творение под [небом]».


    И [когда ученики услышали] это, они сказали [Ему]: «Учитель, помоги нам и спаси нас!»


    Иисус сказал им: «Перестаньте бороться со Мной. У каждого из вас есть своя звезда, [и …] из звёзд […] то, что принадлежит ей […].[h] Я был послан не к тленному поколению, но к сильному и нетленному поколению, потому что над тем поколением не властвовал ни один враг и ни одна из звёзд. Истинно говорю вам: огненный столп скоро падёт, но то поколение звёзды не поколеблют».[i]'
