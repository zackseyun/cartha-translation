review_pass:
  verdict: revise
  source_fidelity: 'Черновик в целом точно следует предоставленному английскому свидетелю и последовательно сохраняет квадратные скобки и лакуны. Однако несколько мест нуждаются в уточнении: реплика о сокрытии не должна без необходимости превращать неустановленную форму в совершенное «скрылись»; «a name» лучше передать как отдельный, столь же неясный элемент видения; а фраза об «из рук священников, то есть служителя заблуждения» требует грамматического исправления без снятия её исходной неясности. Во фрагменте о звёздах следует явнее сохранить элемент «… of the stars».'
  naturalness: 'Регистр современный литературный, достаточно сдержанный и пригодный для трудного древнего текста. Исправлены отдельные шероховатости: «великие сны» заменено более естественным «великие сны приснились» при сохранении буквального эпитета; «не может напоить все поколения» оставлено как образная трудность оригинала; фрагмент с лакуной о звёздах оформлен так, чтобы русская фраза не создавала ложной синтаксической определённости.'
  terminology: «Учитель», «жертвенник», «приношения», «поколения», «звёзды», «ангелы», «служитель», «тленное/нетленное» и «огненный столп» переданы последовательно. Терминологические решения не навязывают конфессионального истолкования. Прямая проверка по коптскому Codex Tchacos остаётся необходимой, поскольку предоставлено англоязычное свидетельство.
