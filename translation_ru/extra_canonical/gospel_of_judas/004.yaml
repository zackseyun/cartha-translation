translation:
  language: ru
  text: 'В другой день Иисус пришёл к ним. Они сказали Ему: «Учитель, мы видели Тебя во сне, потому что прошлой ночью нам снились великие [сны]».


    Но Иисус сказал: «Почему вы […] скрылись?»[a]


    И они [сказали: «Мы увидели] большой [дом, а в нём — большой] жертвенник, [и] двенадцать человек — мы бы сказали, что это священники, — и некое имя.[b] Множество людей ожидало у жертвенника, [пока] священники [не закончат принимать] приношения. Мы тоже продолжали ждать».


    [Иисус спросил]: «Какими они были?»


    Они ответили: «[Одни] постятся [по] две недели. Другие приносят в жертву собственных детей; иные — своих жён, восхваляя и унижая себя друг перед другом. Другие ложатся с мужчинами; иные убивают; а иные совершают множество грехов и преступлений. [И] люди, стоящие [перед] жертвенником, призывают Твоё [имя]! И всеми своими жертвоприношениями они наполняют [жертвенник] приношениями». Сказав это, [они] умолкли, потому что были встревожены.


    Иисус сказал им: «Почему вы встревожены? Истинно говорю вам: все священники, стоящие перед тем жертвенником, призывают Моё имя. И [ещё] говорю вам: человеческие поколения написали Моё имя на этом [доме] поколений звёзд.[c] [И они] постыдно насадили бесплодные деревья во имя Моё».


    Иисус сказал им: «Это вы принимаете приношения на жертвеннике, который видели. Вот Бог, которому вы служите, а вы — те двенадцать человек, которых видели. Животные же, которых вы видели приведёнными на заклание, — это множество людей, которых вы вводите в заблуждение перед тем жертвенником. [Ваш служитель] встанет и будет так пользоваться Моим именем, и [поколения] благочестивых останутся ему верны. После него другой представит [предающихся распутству], ещё другой — убивающих детей, ещё один — тех, кто ложится с мужчинами, а также постящихся и всё остальное — нечистоту, преступление и заблуждение. А говорящие: „Мы равны ангелам“ — это звёзды, которые всё доводят до конца.[d] Человеческим поколениям сказано: „Вот, Бог принял вашу жертву из рук священников“, то есть служителя заблуждения. Но повелевающий Господь — Господь над всем. В последний день они будут признаны виновными».


    Иисус сказал [им]: «Перестаньте [приносить животных в жертву]. Вы [принесли их] над жертвенником, над вашими звёздами вместе с вашими ангелами, где они уже достигли завершения.[e] Так пусть они станут […] с вами и пусть [станут] явными».[f]


    Его ученики [сказали Ему]: «Очисти нас от наших [грехов], которые мы совершили из-за обмана ангелов».


    Иисус сказал им: «Это невозможно […], как не [может] источник погасить огонь всей обитаемой земли. И колодец [одного города] не может напоить все поколения — только великий, неколебимый.[g] Один светильник не осветит всех миров — только второе поколение; и один пекарь не может накормить всё творение под [небом]».


    И [когда ученики услышали] это, они сказали [Ему]: «Учитель, помоги нам и спаси нас!»


    Иисус сказал им: «Перестаньте бороться со Мной. У каждого из вас есть своя звезда, [и …] звёзд […] то, что принадлежит ей […][h] Я был послан не к тленному поколению, но к сильному и нетленному поколению, потому что над тем поколением не властвовал ни один враг и ни одна из звёзд. Истинно говорю вам: огненный столп скоро падёт, но то поколение звёзды не поколеблют».[i]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Рукопись здесь повреждена; глагольная форма и точная связь слов не восстанавливаются уверенно.
    reason: Предупреждает читателя, что неестественная реплика обусловлена лакуной, а не свободным переводом.
  - marker: b
    text: Упоминание «имени» синтаксически неясно из-за повреждения текста; неясно также, к чему именно оно относится.
    reason: Сохраняет подлинную неясность свидетеля.
  - marker: c
    text: 'Буквальный смысл фразы неясен: «дом поколений звёзд» может обозначать космическую или культовую область, но текст этого не поясняет.'
    reason: Не позволяет превратить трудное космологическое выражение в догматическое утверждение.
  - marker: d
    text: 'Или: «звёзды, которые завершают всё». Кто именно назван звёздами и что означает «завершают», остаётся неясным.'
    reason: Фиксирует лексическую и референциальную неоднозначность.
  - marker: e
    text: Местоимение «они» может относиться к звёздам, ангелам или ранее упомянутым жертвам; «достигли завершения» также допускает иные оттенки.
    reason: Сохраняет неоднозначность повреждённого синтаксиса.
  - marker: f
    text: В этом предложении имеются лакуны; последовательность мысли не поддаётся надёжному восстановлению.
    reason: Объясняет фрагментарность перевода.
  - marker: g
    text: 'Неясно, что названо «великим, неколебимым»: колодец, поколение или иной подразумеваемый источник.'
    reason: Не закрепляет один из возможных референтов.
  - marker: h
    text: Значительная часть фразы утрачена, поэтому отношение звёзд к «принадлежащему ей» неизвестно.
    reason: Отмечает невозможность связного восстановления.
  - marker: i
    text: «Поколение» в этом отрывке — повторяющийся космологический термин. Его точный объём и отношение к звёздам требуют сверки с коптским текстом.
    reason: Предотвращает преждевременное отождествление с этнической, исторической или конфессиональной группой.
lexical_decisions:
- source_word: Master
  choice: Учитель
  rationale: Естественное и достоинственное обращение к Иисусу; не вносит оттенка рабовладельческого «господин» и соответствует контексту наставления.
- source_word: altar
  choice: жертвенник
  rationale: Передаёт культовый жертвенный объект точнее, чем нейтральное «алтарь», особенно при многократном упоминании приношений и заклания.
- source_word: generations
  choice: поколения
  rationale: Сохранён повторяющийся космологический термин свидетеля без подмены на «роды», «расы» или «эоны».
- source_word: stars
  choice: звёзды
  rationale: Сохранена буквальная космологическая лексика текста без истолкования звёзд как ангелов, властей или судьбы.
- source_word: minister
  choice: служитель
  rationale: Позволяет сохранить неопределённость роли; «священник» или «предстоятель» были бы более узкими толкованиями.
- source_word: inhabited world
  choice: обитаемая земля
  rationale: Передаёт смысл ойкумены и отличает её от последующего обозначения космических «миров».
- source_word: realms
  choice: миры
  rationale: Естественное русское обозначение космических областей; точная коптская лексема требует будущей проверки.
- source_word: incorruptible
  choice: нетленное
  rationale: Сохраняет антитезу «тленное — нетленное» и богословскую напряжённость без пояснительного перефразирования.
- source_word: pillar of fire
  choice: огненный столп
  rationale: Устойчивое библейское выражение, при этом без утверждения, что здесь непременно подразумевается исход из Египта.
theological_decisions:
- issue: Отождествление учеников с двенадцатью священниками
  choice: 'Передано прямо, как в свидетеле: «вы — те двенадцать человек»'
  alternative: Смягчить как сравнение или видение будущих церковных служителей
  rationale: Текст намеренно полемичен; смягчение устранило бы его подлинное богословское напряжение.
- issue: Фраза «Вот Бог, которому вы служите»
  choice: Сохранено указательное и обвинительное высказывание
  alternative: Пояснить, что речь идёт о ложном боге
  rationale: Сам текст не даёт такого существительного или пояснения; читатель должен видеть двусмысленность и контекстуальную критику культа.
- issue: Космологическая роль звёзд и ангелов
  choice: Звёзды и ангелы оставлены отдельными терминами без систематизации
  alternative: Отождествить их с демоническими властями или судьбой
  rationale: Такая идентификация была бы интерпретацией, не установленной данным английским свидетелем.
- issue: «Второе поколение»
  choice: Сохранено буквально
  alternative: Исправить или объяснить как «иной род», «грядущее поколение» либо определённую гностическую группу
  rationale: Фраза трудна и, возможно, повреждена; конфессиональное или систематическое разрешение неоправданно до сверки с коптским текстом.
- issue: Адресат миссии Иисуса
  choice: «послан не к тленному поколению, но к сильному и нетленному поколению»
  alternative: Переформулировать универсалистски или применить к спасённым вообще
  rationale: Сохранено резкое противопоставление источника без согласования с каноническими Евангелиями.
- issue: Финальное действие огненного столпа
  choice: Сохранено «скоро падёт»
  alternative: Толковать как суд, гибель космоса или нисхождение откровения
  rationale: Образ не разъяснён в отрывке; перевод не должен назначать ему единственное богословское значение.
translation_notes:
  register: 'Современный литературный русский язык с достоинственным повествовательным тоном. Синтаксис упрощён лишь там, где это не скрывает фрагментарность. Квадратные скобки и многоточия сохранены как сигналы повреждения рукописи и редакционного восстановления. Черновик неизбежно предварительный: представленное основание — англоязычный публичный свидетель, а прямая сверка с коптским Codex Tchacos 3 ещё не выполнена.'
