  revised_text: 'Иисус сказал:


    — [Подойди], и Я научу тебя [тайнам, которых ни один] человек [не] увидит. Есть великая и беспредельная область, чьих пределов не видел ни один ангельский род. [В] ней пребывает [великий] невидимый Дух, которого никогда не видел ни один [ангельский] глаз, которого не постигало ни одно сердце и который никогда не был назван никаким именем.


    И там появилось сияющее облако. И Он — Дух — сказал: «Пусть возникнет ангел, чтобы служить Мне». И из облака вышел великий ангел — Саморождённый, Бог Света. Благодаря ему из другого облака возникли ещё четыре ангела, и они стали служить ангельскому Саморождённому. И [Саморождённый] сказал: «Пусть возникнет [область]», — и она возникла, [как он и сказал]. И он [сотворил] первое светило, чтобы оно властвовало над ней. Он сказал: «Пусть возникнут ангелы, чтобы служить [ему]», — и возникли [бесчисленные мириады]. Он сказал: «[Пусть возникнет] сияющая область», — и она возникла. Он сотворил второе светило, чтобы оно властвовало над ней, а вместе с ним — бесчисленные мириады ангелов для служения. Так он сотворил и остальные области света. Он сделал их владыками и сотворил для них бесчисленные мириады ангелов, чтобы те им помогали.


    А Адамас пребывал в первом облаке света, которого не мог увидеть ни один ангел среди всех именуемых «Богом». И [Адамас породил Сифа в] том [месте по] образу […], по подобию [этого] ангела. Он явил нетленный [род] Сифа двенадцати двуполым [светилам. Затем] по воле Духа он явил в нетленном роде семьдесят два светила. А сами семьдесят два светила по воле Духа явили в нетленном роде триста шестьдесят светил, чтобы каждому из них соответствовало по пять. Двенадцать областей двенадцати светил составляют их отца; каждой области принадлежат шесть небес, так что для семидесяти двух светил существует семьдесят два неба, и для каждого [из них — пять] небесных сводов, [всего] триста шестьдесят [сводов. Им] были даны власть и [великое] бесчисленное воинство ангелов для почитания и служения, а также девственные духи — для почитания и [служения] всем областям и небесам с их сводами.


    Всё множество этих бессмертных отец и семьдесят два светила вместе с Саморождённым и его семьюдесятью двумя областями называют «космосом», то есть «тленным». Там появился первый человек со своими нетленными силами. В области, появившейся вместе с его родом, находятся облако знания и ангел по имени [Элелет…] После этого [Элелет] сказал: «Пусть возникнут двенадцать ангелов, [чтобы] властвовать над Хаосом и [Адом]». И вот, из облака явился [ангел], чьё лицо сверкало [огнём], а облик был [осквернён] кровью. Его звали Небро, что означает «Мятежник». Другие называют его Ялдаваофом. Из облака вышел и другой ангел — Саклас. Тогда Небро сотворил шесть ангелов, и Саклас — тоже, чтобы они были помощниками. Они произвели двенадцать ангелов на небесах, и каждый из них получил свою долю на небесах.


    И двенадцать правителей сказали двенадцати ангелам: «Пусть каждый из вас […] и пусть они […] род [… пять] ангелов:


    первый — [Яоф], называемый Благим;


    второй — Харматоф, [огненное око];


    [третий] — Галила;


    четвёртый — [Йовел];


    пятый — Адонайос».


    Это те пятеро, которые властвовали над Адом и были первыми над Хаосом.


    Тогда Саклас сказал своим ангелам: «Сотворим человека по подобию и образу». И они создали Адама и его жену Еву, которая в облаке зовётся Жизнью, потому что под этим именем все роды ищут его и каждый из них называет её своими именами. Саклас же не [повелел…] рождать, кроме […] среди родов […] который это […] И [ангел] сказал ему: «Твоя жизнь вместе с твоими детьми будет длиться лишь ограниченное время».


    Тогда Иуда спросил Иисуса:


    — [Как] долго может жить человек?


    Иисус ответил:


    — Почему ты удивляешься тому, что срок жизни Адама и его рода ограничен в том месте, где он получил своё царство вместе со своим правителем?


    Иуда спросил Иисуса:


    — Умирает ли человеческий дух?


    Иисус ответил:


    — Вот как это происходит. Бог повелел Михаилу одалживать людям духи, чтобы они служили. Затем Великий повелел Гавриилу давать духи великому роду, над которым нет царя, — дух вместе с душой. Поэтому [остальные] души […] свет [… этот] Хаос […] ищут дух внутри тебя, которому ты дал жить в этой плоти, происходящей от ангельских родов. Затем Бог велел принести знание Адаму и тем, кто был с ним, чтобы цари Хаоса и Ада не властвовали над ними.


    [Тогда] Иуда спросил Иисуса:


    — Что же будут делать те роды?


    Иисус ответил:


    — Истинно говорю тебе: всё это доводят до завершения звёзды. Когда Саклас завершит назначенный ему срок, вместе с родами появится их первая звезда, и они исполнят сказанное. Затем они будут предаваться разврату во имя Моё, убивать своих детей и [они…] зло и […] области, приводя роды и отдавая их Сакласу. [И] после этого […] приведёт двенадцать колен [Израиля] из […], и все [роды] будут служить Сакласу, греша во имя Моё. А твоя звезда будет [властвовать] над тринадцатой областью.


    Тогда Иисус [рассмеялся].


    [Иуда] спросил:


    — Учитель, почему [Ты смеёшься надо мной?]


    [Иисус] ответил:


    — Я смеюсь не [над тобой, а] над заблуждением звёзд, потому что эти шесть звёзд заблуждаются вместе с пятью воинами, и все они будут уничтожены вместе со своими творениями.


    Тогда Иуда спросил Иисуса:


    — Что будут делать те, кто крещён во имя Твоё?'
