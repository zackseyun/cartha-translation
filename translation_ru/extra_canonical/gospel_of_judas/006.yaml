  terminology: 'Ключевые решения удачны: «область» для realm, «Саморождённый» для Self-Begotten, «светило» для luminary, «нетленный/тленный», «род» для generation. Имена и термины «Хаос» и «Ад» сохранены. «Владыками» в одном месте точнее передаёт функцию световых областей и не вводит отдельный класс правителей.'
