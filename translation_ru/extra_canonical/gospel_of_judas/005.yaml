review_pass:
  verdict: revise
  source_fidelity: Проект в целом бережно следует предоставленному английскому свидетельству и сохраняет лакуны, скобочные восстановления и ряд принципиальных неоднозначностей. Однако в нескольких местах русская формулировка либо добавляет оттенок, которого нет в свидетельстве («не погубит» вместо «не испортит/не повредит»), либо слишком сглаживает повреждённый синтаксис. Прямая сверка с коптским текстом по-прежнему невозможна на основании предоставленных данных и должна оставаться оговорённой.
  naturalness: 'Регистр в целом удачен: современный литературный русский с умеренно возвышенной окраской. Требуются небольшие правки для более естественного управления («научил тебя заблуждению звёзд») и для менее интерпретирующей передачи ряда фрагментов. Намеренная шероховатость в местах лакун сохранена.'
  terminology: Последовательное «род» для generation/race, «правитель» для ruler, «сила» для power, «семя» для seed и «демон» для demon приемлемо как предварительное решение, не навязывающее догматической интерпретации. «Вышние области» и «двенадцать областей» адекватно отражают realm в космологическом контексте.
  issues:
  - severity: medium
    issue: «не погубит [образ жизни] того рода»
    rationale: Witness имеет «won’t corrupt that generation’s [walk of life]». «Погубить» сильнее и меняет смысл на уничтожение; безопаснее «не испортит».
  - severity: medium
    issue: «наполнить водой… источник»
    rationale: Witness сохраняет повреждённую последовательность «[water … the well]». Добавление глагола «наполнить» — не отмеченное скобками толковательное восстановление. Следует оставить фрагмент без такого дополнения.
  - severity: low
    issue: «научил тебя о заблуждении звёзд»
    rationale: В современном литературном русском естественнее «научил тебя заблуждению звёзд» или «научил тебя тому, в чём состоит заблуждение звёзд». Первый вариант ближе к краткости witness.
  - severity: low
    issue: «глубоко скорбеть»
    rationale: Witness говорит «grieve greatly»; «глубоко скорбеть» возможно, но «сильно скорбеть» ближе к степени без дополнительного стилистического оттенка.
  revised_text: 'Когда Иисус [сказал] это, он ушёл, [взяв] с собой Иуду Искариота. Он сказал ему: «Вода на высокой горе — [из] […]. Она пришла не для того, чтобы [напоить … источник] дерева [плода …] этого мира […] спустя время […], но пришла напоить Божий рай и непреходящий [плод], потому что [она] не испортит [образ жизни] того рода, но [будет существовать] во веки веков».


    Иуда сказал [ему: «Скажи] мне, какой плод приносит этот род?»


    Иисус сказал: «Души всех человеческих родов умрут. Однако, когда эти люди завершат отпущенное им время в царстве и дух покинет их, тела их умрут, но души будут жить и будут вознесены».


    Иуда спросил: «Что же будут делать остальные человеческие роды?»


    Иисус сказал: «Невозможно сеять на [камне] и собирать с него плод. Так же [невозможно сеять среди] [осквернённого] рода вместе с тленной мудростью [и] рукой, сотворившей смертных людей, чтобы их души могли подняться в вышние области».[a] «[Истинно] говорю тебе: ни один [правитель], ни ангел, [ни] сила не смогут увидеть тех [мест], которые увидит [этот великий] святой род».[b] Сказав это, Иисус ушёл.


    Иуда сказал: «Учитель, как ты выслушал их всех, так теперь выслушай и меня, потому что я видел великое видение».


    Услышав это, Иисус засмеялся и сказал ему: «Что ты так взволнован, тринадцатый демон? Но говори — я потерплю тебя».[c]


    Иуда сказал ему: «В видении я увидел самого себя. Двенадцать учеников побивали меня камнями и [стремительно] преследовали. Я пришёл также к тому месту, где [следовал] за тобой. Там я увидел [дом], и глаза мои не могли [измерить] его величину. Его окружали великие люди, а крыша того дома была покрыта зеленью. Посреди дома находилось [множество людей…]. Учитель, прими меня к этим людям!»


    [Иисус] ответил: «Твоя звезда ввела тебя в заблуждение, Иуда. Ни один человек, рождённый смертным, недостоин войти в дом, который ты видел, потому что это место предназначено для святых. Там не будут властвовать ни солнце, ни луна, ни день, но святые будут вечно пребывать в той области со святыми ангелами. Вот, я поведал тебе тайны царства и научил тебя заблуждению звёзд, и […] послано [ввысь] над двенадцатью областями».[d]


    Иуда спросил: «Учитель, ведь моё семя не властвует над правителями, не так ли?»[e]


    Иисус ответил ему: «Подойди, и я [расскажу] тебе [о святом роде. Не для того, чтобы ты вошёл туда], но ты будешь сильно скорбеть, когда увидишь царство и весь его род».


    Услышав это, Иуда сказал ему: «Что пользы мне от того, что ты отделил меня от того рода?»


    Иисус ответил: «Ты станешь тринадцатым, и другие роды проклянут тебя, но ты будешь властвовать над ними. В последние дни они […] к тебе, а ты не взойдёшь к святому роду».[f]'
