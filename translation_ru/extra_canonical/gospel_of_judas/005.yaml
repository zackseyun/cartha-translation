  yaml_path: translation/extra_canonical/gospel_of_judas/005.yaml
  text: 'When Jesus [said] these things, he left, [taking] Judas Iscariot with him. He said to him, “The water on the exalted mountain is [from] […] it didn’t come to [water … the well] of the tree of [the fruit …] of this realm […] after a time […], but it came to water God’s paradise and the enduring [fruit], because [it] will not corrupt that generation’s [way of life], but [it will exist] for all eternity.”


    Judas said to [him, “Tell] me, what kind of fruit does this generation have?”


    Jesus said, “The souls of every human generation will die. However, when these people have completed their time in the kingdom and the spirit leaves them, their bodies will die, but their souls will live and will be taken up.”


    Judas said, “What will the rest of the human generations do?”


    Jesus said, “It is not possible to sow on [rock] and harvest its fruit. In the same way, it is [not possible to sow on] the [defiled] race, together with perishable wisdom [and] the hand that created mortal humans so that their souls may ascend to the realms above. [Truly] I say to you, [no ruler], angel, [or] power will be able to see the [places] that [this great], holy generation [will see].” When Jesus said this, he left.


    Judas said, “Master, just as you have listened to all of them, now listen to me too, because I have seen a great vision.”


    But Jesus laughed when he heard this. He said to him, “Why are you so agitated, you thirteenth demon? But speak, and I will bear with you.”


    Judas said to him, “In the vision, I saw myself. The twelve disciples were stoning me and chasing [me rapidly]. I also came to the place where [I had followed] you. I saw [a house in this place], and my eyes could not [measure] its size. Great people surrounded it, and that house had a roof of greenery. In the middle of the house was [a crowd …]. Master, take me in with these people!”


    [Jesus] answered and said, “Your star has led you astray, Judas,” and, “No person of mortal birth is worthy to enter the house you have seen, because that place is reserved for those who are holy. Neither the sun nor the moon will rule there, nor the day, but those who are holy will always stand in the realm with the holy angels. Look, I have told you the mysteries of the kingdom, and I have taught you about the error of the stars and […] sent [on high] over the twelve realms.”


    Judas said, “Master, surely my seed does not dominate the rulers, does it?”


    Jesus answered and said to him, “Come, let me [tell] you [about the holy generation. Not so that you’ll go there], but you will grieve greatly when you see the kingdom and all its generation.”


    When Judas heard this, he said to him, “What good has it done me that you have separated me from that generation?”


    Jesus answered and said, “You will become the thirteenth, and you will be cursed by the other generations and will rule over them. In the last days they will […] to you, and you will not ascend to the holy generation.”'
translation:
  language: ru
  text: 'Когда Иисус [сказал] это, он ушёл, [взяв] с собой Иуду Искариота. Он сказал ему: «Вода на высокой горе — [из] […]. Она пришла не для того, чтобы [наполнить водой… источник] дерева [плода…] этого мира […] спустя время […], но чтобы напоить Божий рай и непреходящий [плод], потому что [она] не погубит [образ жизни] того рода, но [будет существовать] во веки веков».


    Иуда сказал [ему: «Скажи] мне, какой плод приносит этот род?»


    Иисус сказал: «Души всех человеческих родов умрут. Однако, когда эти люди завершат отпущенное им время в царстве и дух покинет их, тела их умрут, но души будут жить и будут вознесены».


    Иуда спросил: «Что же будут делать остальные человеческие роды?»


    Иисус сказал: «Невозможно сеять на [камне] и собирать с него плод. Так же [невозможно сеять среди] [осквернённого] рода вместе с тленной мудростью [и] рукой, сотворившей смертных людей, чтобы их души могли подняться в вышние области.[a] [Истинно] говорю тебе: ни один [правитель], ни ангел, [ни] сила не смогут увидеть тех [мест], которые увидит [этот великий] святой род».[b] Сказав это, Иисус ушёл.


    Иуда сказал: «Учитель, как ты выслушал их всех, так теперь выслушай и меня, потому что я видел великое видение».


    Услышав это, Иисус засмеялся и сказал ему: «Что ты так взволнован, тринадцатый демон? Но говори — я потерплю тебя».[c]


    Иуда сказал ему: «В видении я увидел самого себя. Двенадцать учеников побивали меня камнями и [стремительно] преследовали. Я пришёл также к тому месту, где [следовал] за тобой. Там я увидел [дом], и глаза мои не могли [измерить] его величину. Его окружали великие люди, а крыша того дома была покрыта зеленью. Посреди дома находилось [множество людей…]. Учитель, прими меня к этим людям!»


    [Иисус] ответил: «Твоя звезда ввела тебя в заблуждение, Иуда. Ни один человек, рождённый смертным, недостоин войти в дом, который ты видел, потому что это место предназначено для святых. Там не будут властвовать ни солнце, ни луна, ни день, но святые будут вечно пребывать в той области со святыми ангелами. Вот, я поведал тебе тайны царства и научил тебя о заблуждении звёзд, и […] послано [ввысь] над двенадцатью областями».[d]


    Иуда спросил: «Учитель, ведь моё семя не властвует над правителями, не так ли?»[e]


    Иисус ответил ему: «Подойди, и я [расскажу] тебе [о святом роде. Не для того, чтобы ты вошёл туда], но ты будешь глубоко скорбеть, когда увидишь царство и весь его род».


    Услышав это, Иуда сказал ему: «Что пользы мне от того, что ты отделил меня от того рода?»


    Иисус ответил: «Ты станешь тринадцатым, и другие роды проклянут тебя, но ты будешь властвовать над ними. В последние дни они […] к тебе, а ты не взойдёшь к святому роду».[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Связи между частями этой фразы не вполне ясны: рукопись повреждена, а перевод пока основан на английском свидетельстве. Квадратные скобки отмечают восстановленный или утраченный текст.'
    reason: Предупредить читателя о синтаксической и текстологической неуверенности в важном космологическом высказывании.
  - marker: b
    text: «Правитель» может обозначать земного или небесного властителя; специальный термин «архонт» здесь не введён до прямой сверки с коптским текстом.
    reason: Сохранить возможный технический смысл без преждевременной терминологической фиксации.
  - marker: c
    text: Выражение «тринадцатый демон» сохранено по английскому свидетельству. Его точный оттенок — оскорбительный, иронический или космологический — остаётся спорным.
    reason: Не сглаживать резкость и не навязывать единственное толкование.
  - marker: d
    text: Конец предложения сильно повреждён; субъект слова «послано» и точная связь с «двенадцатью областями» неясны.
    reason: Обозначить невозможность надёжно восстановить грамматику фрагмента.
  - marker: e
    text: «Семя» может означать потомство, род или духовную принадлежность. Вопросительная форма допускает оттенок ожидания подтверждения.
    reason: Сохранить лексическую и прагматическую неоднозначность.
  - marker: f
    text: 'В заключительной фразе имеется лакуна: действие других родов по отношению к Иуде неизвестно. Поэтому пропуск сохранён.'
    reason: Не восполнять богословски значимый пробел догадкой.
lexical_decisions:
- source_word: generation / race (Coptic review pending)
  choice: род
  rationale: «Род» естественно передаёт повторяющееся обозначение духовно или человечески определённой общности и сохраняет неоднозначность между поколением, происхождением и группой; «поколение» было бы слишком хронологическим, а «раса» — неуместным в современном русском.
- source_word: realm
  choice: мир / область / царство по контексту
  rationale: Английское свидетельство, вероятно, сводит разные контекстные значения. В «этого мира» имеется в виду порядок бытия, в «вышние области» и «двенадцать областей» — пространственно-космологические сферы, а kingdom передано как «царство».
- source_word: enduring fruit
  choice: непреходящий плод
  rationale: Сохраняет противопоставление тлению и вечности, не уточняя природу плода.
- source_word: ruler
  choice: правитель
  rationale: Не вводит специальный гностический термин «архонт» без прямой сверки коптского текста и остаётся понятным обычному читателю.
- source_word: power
  choice: сила
  rationale: Сохраняет возможный смысл небесной силы или власти, не превращая его в однозначно личное существо.
- source_word: seed
  choice: семя
  rationale: 'Сохранена образность и неоднозначность: потомство, происхождение или духовная принадлежность.'
- source_word: demon
  choice: демон
  rationale: Передаёт резкое обращение буквально и не смягчает его богословское напряжение.
- source_word: star
  choice: звезда
  rationale: Сохранён космологический термин текста без истолкования звезды как судьбы, ангела или небесного двойника.
theological_decisions:
- issue: Судьба душ и тел
  choice: «тела их умрут, но души будут жить и будут вознесены»
  alternative: Истолковать как всеобщее бессмертие души или как участь только святого рода
  rationale: Формулировка следует свидетельству и не разрешает напряжение между «душами всех человеческих родов» и последующим указанием на «этих людей».
- issue: Святой род и возможность вхождения Иуды
  choice: 'Сохранено прямое отрицание: «ты не взойдёшь к святому роду»'
  alternative: Истолковать слова об Иуде как обещание высшего спасения
  rationale: Данный отрывок явно удерживает отрицательное или трагическое напряжение; его нельзя согласовывать с заранее выбранной конфессиональной трактовкой Иуды.
- issue: «Тринадцатый демон»
  choice: Передано без эвфемизма
  alternative: «тринадцатый дух» или почётный титул
  rationale: Свидетельство имеет demon; смягчение заранее решило бы спорный смысл обращения.
- issue: Власть Иуды над другими родами
  choice: «будешь властвовать над ними»
  alternative: «превзойдёшь их» или «станешь их правителем»
  rationale: Сохранена политико-космологическая многозначность глагола без утверждения, что власть спасительна или почётна.
- issue: Рука, создавшая смертных людей
  choice: Сохранена необычная конструкция без отождествления её обладателя
  alternative: Назвать Творца Богом, демиургом или архонтом
  rationale: Повреждённый контекст и отсутствие прямой сверки с коптским не позволяют безопасно определить субъект; богословская неоднозначность должна остаться.
translation_notes:
  register: 'Современный литературный русский язык с достоинством и умеренной библейской окраской. Повторы «род», «святой», «царство» и космологические термины сохранены ради связности. Квадратные скобки и многоточия воспроизводят повреждения и восстановления в предоставленном свидетельстве. Проект предварительный: древний язык указан как коптский, однако прямая проверка Codex Tchacos 3 ещё не выполнена; поэтому решения не претендуют на исправление английского публичного свидетельства по коптскому оригиналу.'
