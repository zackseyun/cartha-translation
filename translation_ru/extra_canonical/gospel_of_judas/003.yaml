  text: 'The next morning, he appeared to his disciples. [And] they said to him, “Master, where did [you] go, and what did you do when you left us?”


    Jesus said to them, “I went to another great and holy generation.”


    His disciples said to him, “Lord, what great generation is better and holier than we are, that is not in these realms?”


    When Jesus heard this, he laughed. He said to them, “Why are you wondering in your hearts about the strong and holy generation? Truly I say to you, no one born [of] this realm will see that [generation]. No army of angels from the stars will rule over it, and no mortal-born person will be able to join it, because that generation does not come from […] that has become […] the generation of the people among [them] is from the generation of the great people […] the powerful authorities who […] nor the powers […] those by which you rule.”


    When his disciples heard these things, each of them was troubled in their spirit. They could not say anything.'
translation:
  language: ru
  text: 'На следующее утро он явился своим ученикам.[a] [И] они спросили его: «Учитель, куда [ты] ходил и что делал, когда ушёл от нас?»


    Иисус ответил им: «Я ходил к иному великому и святому роду».


    Ученики сказали ему: «Господь, что это за великий род, который лучше и святее нас и которого нет в этих областях?»


    Услышав это, Иисус рассмеялся. Он сказал им: «Почему вы размышляете в сердцах своих о могучем и святом роде? Истинно говорю вам: никто, рождённый [в] этой области, не увидит тот [род]. Ни одно воинство ангелов со звёзд не будет властвовать над ним, и ни один человек, рождённый смертным, не сможет к нему присоединиться, потому что тот род происходит не от […] ставшего […] род людей среди [них] — от рода великих людей […] могущественные власти, которые […] ни силы […] те, которыми вы правите».[b]


    Услышав это, каждый из учеников смутился духом. Они не могли вымолвить ни слова.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: он выполнен по предоставленному англоязычному свидетельству; прямая сверка с коптским текстом Кодекса Чакос ещё не проведена. Квадратные скобки обозначают восстановленные или неуверенно читаемые слова.'
    reason: Честно обозначает ограниченность источниковой основы и объясняет редакционные знаки.
  - marker: b
    text: Многоточия в квадратных скобках обозначают утраты рукописного текста. Поэтому синтаксис и точный смысл этой части высказывания остаются неясными.
    reason: Предотвращает ложное впечатление связности и не позволяет молча восполнить существенные лакуны.
lexical_decisions:
- source_word: generation
  choice: род
  rationale: В контексте речь идёт не просто о современниках или временном поколении, а об особой совокупности существ, объединённых происхождением; «род» естественно передаёт это значение и позволяет сохранить повтор ключевого слова.
- source_word: realms
  choice: области
  rationale: Нейтральное пространственно-космологическое обозначение, не уточняющее повреждённую и пока не проверенную по коптскому оригиналу терминологию как «миры» или «эоны».
- source_word: strong
  choice: могучий
  rationale: Передаёт силу или могущество рода без сведения выражения к физической крепости.
- source_word: army of angels from the stars
  choice: воинство ангелов со звёзд
  rationale: Сохранена возможная синтаксическая связь ангелов со звёздами без догматического отождествления их со «звёздными ангелами».
- source_word: mortal-born person
  choice: человек, рождённый смертным
  rationale: Сохраняет необычную формулировку свидетельства и её возможную антропологическую значимость вместо сглаживания до простого «смертный человек».
theological_decisions:
- issue: Природа «великого и святого рода»
  choice: Сохранить обозначение «род», не объясняя, кто к нему относится
  alternative: Передать как «поколение», «народ» или прямо назвать небесными существами
  rationale: Текст противопоставляет этот род ученикам и существам данных областей, но не даёт в сохранившемся отрывке достаточного основания для более узкого определения.
- issue: Космологическое значение realms
  choice: Передать нейтрально как «области»
  alternative: «миры», «сферы» или «эоны»
  rationale: До прямой сверки с коптским текстом нельзя уверенно устанавливать специальный гностический термин.
- issue: Власть учеников в повреждённом высказывании
  choice: Сохранить «те, которыми вы правите» и разрывы текста
  alternative: Перестроить фразу так, чтобы ученики либо правили силами, либо сами находились под их властью
  rationale: Рукописные лакуны не позволяют надёжно восстановить синтаксис и богословский смысл фразы.
translation_notes:
  register: Современный литературный русский язык с достоинством повествовательного и речевого регистра. Повторы слова «род» сохранены как смысловая связка. Повреждённый фрагмент намеренно не сглажен; квадратные скобки и лакуны воспроизведены. Формы обращения «Учитель» и «Господь» различены в соответствии со свидетельством.
