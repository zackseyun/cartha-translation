review_pass:
  verdict: revise
  source_fidelity: В целом перевод бережно следует предоставленному английскому свидетельству, сохраняет повторы «род», квадратные скобки и лакуны. Однако «Я ходил к ... роду» по-русски создаёт неуместное впечатление регулярного посещения; английское went в данном контексте лучше передать совершенным направительным глаголом. Формула «человек, рождённый смертным» в русском означает рождение от смертного человека и не передаёт естественно противопоставление «mortal-born person»; безопаснее «смертный человек».
  naturalness: 'Нужны небольшие стилистические исправления: «какой великий род» естественнее, чем «что это за великий род» в вопросе, непосредственно воспроизводящем определение рода; «не могли ничего сказать» современно и точно передаёт исходное could not say anything. Повреждённый длинный фрагмент намеренно остаётся синтаксически неполным.'
  terminology: Выбор «род» для generation последователен и уместен в данном контексте. «Области» как нейтральная передача realms допустимо сохраняет космологическую неопределённость. «Воинство ангелов со звёзд» сохраняет исходную неоднозначную связь. «Учитель» и «Господь» различены правильно. Поскольку непосредственная сверка с коптским текстом ещё не проведена, специальные термины и реконструкции не следует уточнять сверх английского свидетельства.
  issues:
  - severity: medium
    issue: «Я ходил к иному великому и святому роду»
    rationale: Русский глагол несовершенного вида «ходил» обычно подразумевает повторяемое или длительное действие, тогда как свидетельство сообщает об одном уходе и возвращении. «Я отправился к другому великому и святому роду» естественнее без смыслового расширения.
  - severity: medium
    issue: «человек, рождённый смертным»
    rationale: Конструкция по-русски читается как «рождённый смертным [родителем]», а не как человек смертного происхождения. «Смертный человек» передаёт противопоставление и не вносит неясной родительской семантики.
  - severity: low
    issue: «что это за великий род» и «не могли вымолвить ни слова»
    rationale: Обе формулы возможны, но «какой великий род» ближе к структуре свидетельства, а «не могли ничего сказать» точнее воспроизводит could not say anything и звучит нейтральнее в современном литературном русском.
  revised_text: 'На следующее утро он явился своим ученикам.[a] [И] они спросили его: «Учитель, куда [ты] ходил и что делал, когда ушёл от нас?»


    Иисус сказал им: «Я отправился к другому великому и святому роду».


    Ученики сказали ему: «Господь, какой великий род лучше и святее нас, и его нет в этих областях?»


    Услышав это, Иисус рассмеялся. Он сказал им: «Почему вы размышляете в сердцах своих о могучем и святом роде? Истинно говорю вам: никто, рождённый [в] этой области, не увидит тот [род]. Никакое воинство ангелов со звёзд не будет властвовать над ним, и ни один смертный человек не сможет к нему присоединиться, потому что тот род происходит не от […] ставшего […] род людей среди [них] — от рода великих людей […] могущественные власти, которые […] ни силы […] те, которыми вы правите».[b]


    Услышав это, каждый из учеников смутился духом. Они не могли ничего сказать.'
