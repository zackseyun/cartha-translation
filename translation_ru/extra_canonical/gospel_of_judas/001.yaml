  yaml_path: translation/extra_canonical/gospel_of_judas/001.yaml
  text: 'This is the secret message of judgment Jesus spoke with Judas Iscariot over a period of eight days, three days before he celebrated Passover.


    When he appeared on earth, he did signs and great wonders for the salvation of humanity. Some [walked] in the way of righteousness, but others walked in their transgression, so the twelve disciples were called. He started to tell them about the mysteries beyond the world and what would happen at the end. Often he didn''t reveal himself to his disciples, but you''d find him in their midst as a child.'
translation:
  language: ru
  text: 'Вот тайное послание о суде, которое Иисус сообщил Иуде Искариоту в беседах на протяжении восьми дней — за три дня до того, как он отпраздновал Пасху.


    Явившись на земле, он совершал знамения и великие чудеса ради спасения человечества. Одни [шли][a] путём праведности, другие же шли путём своего беззакония, и тогда были призваны двенадцать учеников. Он начал рассказывать им о тайнах за пределами мира и о том, что произойдёт в конце. Часто он не являл себя ученикам, однако они обнаруживали его среди себя в облике ребёнка.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Слово «шли» восстановлено переводчиком источника; квадратные скобки обозначают восстановленный или неуверенно читаемый текст рукописи.
    reason: Необходимо сохранить явно отмеченную текстуальную неуверенность английского публичного свидетельства.
lexical_decisions:
- source_word: secret message
  choice: тайное послание
  rationale: Передаёт характер скрытого откровения естественным и достойным русским выражением, не сужая значение до книги или отдельной речи.
- source_word: judgment
  choice: о суде
  rationale: Сохраняет прямое значение английского свидетельства и возможную богословскую многозначность суда, не уточняя его как осуждение или приговор.
- source_word: spoke with
  choice: сообщил Иуде Искариоту в беседах
  rationale: Формулировка согласует сообщение с продолжительным периодом восьми дней и сохраняет личный характер общения.
- source_word: mysteries beyond the world
  choice: тайнах за пределами мира
  rationale: Сохраняет пространственно-космологическую неопределённость выражения, не подменяя её толкованием о небесном мире.
- source_word: in their midst as a child
  choice: среди себя в облике ребёнка
  rationale: Естественно передаёт явление Иисуса как ребёнка, не утверждая превращения и не объясняя природу этого явления.
theological_decisions:
- issue: Связь тайного послания с «судом»
  choice: послание о суде
  alternative: послание-приговор / тайное слово осуждения
  rationale: Выбрана нейтральная конструкция, сохраняющая возможность различных смысловых связей и не усиливающая отрицательный оттенок.
- issue: Причина призвания двенадцати учеников
  choice: и тогда были призваны двенадцать учеников
  alternative: поэтому были призваны двенадцать учеников
  rationale: Связь в свидетельстве может быть как причинной, так и повествовательно-временной; «и тогда» не навязывает строгой причинности.
- issue: Неузнаваемое присутствие Иисуса
  choice: не являл себя ученикам, однако они обнаруживали его... в облике ребёнка
  alternative: не открывался ученикам / являлся среди них ребёнком
  rationale: Сохранено напряжение между сокрытием и присутствием, без догматического объяснения природы явления.
translation_notes:
  register: 'Современный литературный русский язык с умеренно торжественным повествовательным регистром. Черновик предварительный: он основан на предоставленном публичном английском свидетельстве Codex Tchacos 3; прямая сверка с коптским текстом ещё требуется. Местоимения об Иисусе даны со строчной буквы по нормам современного издательского текста и без конфессионального акцента.'
