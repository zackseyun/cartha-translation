review_pass:
  verdict: revise
  source_fidelity: Черновик в целом точно передаёт предоставленное английское свидетельство, включая неуверенно восстановленное «[walked]» и не уточняет космологические «тайны за пределами мира». Однако «и тогда» ослабляет явно указанную в свидетельстве связь so («поэтому»), а «обнаруживали его» звучит так, будто ученики разыскивали Иисуса, тогда как you'd find him означает, что его можно было застать среди них.
  naturalness: '«Явившись на земле» неестественно для современного литературного русского: естественно «Когда он явился на земле». «Не открывался им» точнее и плавнее, чем «не являл себя ученикам», а «можно было застать его» естественно передаёт неопределённо-личную конструкцию английского текста.'
  terminology: «Тайное послание о суде», «Иуда Искариот», «Пасха», «знамения», «чудеса», «спасение человечества» и «тайны за пределами мира» приемлемы. «Путь своего беззакония» заменён на более прямое «в своём преступлении», без дополнительного образа «пути», которого во второй половине английской фразы нет.
  issues:
  - severity: medium
    issue: Ослаблена связка so перед призванием двенадцати.
    rationale: «И тогда» передаёт лишь последовательность, тогда как английское so отмечает вывод или следствие. «Поэтому» сохраняет эту связь, не истолковывая её богословски.
  - severity: medium
    issue: «Они обнаруживали его» неточно передаёт you'd find him.
    rationale: Глагол «обнаруживать» в русском предполагает нахождение или выявление. Исходная неопределённо-личная конструкция сообщает, что Иисуса можно было застать среди учеников.
  - severity: low
    issue: «Явившись на земле» стилистически неудачно.
    rationale: Деепричастный оборот здесь звучит искусственно; временное придаточное точнее воспроизводит When he appeared on earth.
  revised_text: 'Вот тайное послание о суде, которое Иисус сообщил Иуде Искариоту в беседах на протяжении восьми дней — за три дня до того, как он отпраздновал Пасху.


    Когда он явился на земле, он совершал знамения и великие чудеса ради спасения человечества. Одни [шли][a] путём праведности, другие же пребывали в своём преступлении, поэтому были призваны двенадцать учеников. Он начал рассказывать им о тайнах за пределами мира и о том, что произойдёт в конце. Часто он не открывался своим ученикам, но его можно было застать среди них в облике ребёнка.'
  revised_footnotes:
  - marker: a
    text: Слово «шли» восстановлено переводчиком источника; квадратные скобки обозначают восстановленный или неуверенно читаемый текст рукописи.
    reason: Сохраняет явно отмеченную текстуальную неуверенность предоставленного английского свидетельства и её привязку к восстановленному слову.
  revision_rationale: Правки ограничены передачей синтаксических и семантических оттенков английского свидетельства и улучшением современного литературного русского. Неоднозначность местоимения «он» в датировке перед Пасхой, значение «суда», характер «тайн за пределами мира» и природа явления «в облике ребёнка» сохранены без конфессионального истолкования. Прямая сверка с коптским текстом по-прежнему нужна, поскольку исходным основанием служит английское публичное свидетельство.
