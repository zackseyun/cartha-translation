  footnotes:
  - marker: a
    text: Квадратные скобки по всему отрывку обозначают восстановленные слова, неуверенно читаемый текст или лакуны рукописи; многоточие в скобках означает утрату текста.
    reason: Необходимо явно сохранить сигналы повреждения и редакционного восстановления в Codex Tchacos.
  - marker: b
    text: Варвело — имя небесной сущности или области в ряде древних гностических текстов; здесь выражение буквально связывает происхождение Иисуса с её бессмертной областью.
    reason: Редкий космологический термин нуждается в краткой нейтральной справке без конфессионального толкования.
  - marker: c
    text: Слово «составляющих» восстановлено предположительно. «Двенадцать» может указывать на полноту группы учеников, однако повреждённый текст не позволяет установить точный смысл.
    reason: Предотвращает превращение текстуальной реконструкции в уверенное толкование.
  - marker: d
    text: Конец вопроса повреждён; неясно, какое именно поколение названо и как продолжалась фраза.
    reason: Сохраняет существенную неопределённость лакуны.
lexical_decisions:
- source_word: practicing their piety
  choice: совершающими благочестивый обряд
  rationale: Передаёт наблюдаемое религиозное действие, не сводя выражение ни к искреннему благочестию, ни к лицемерию.
- source_word: praying over the bread
  choice: молились над хлебом
  rationale: Сохраняет буквальную предметную связь и не отождествляет действие с конкретным позднейшим евхаристическим чином.
- source_word: the perfect Humanity / perfect human
  choice: совершенного Человека
  rationale: Формулировка сохраняет возможность понимать выражение как идеального или небесного Человека; прописная буква отмечает его вероятный титульный характер, не поясняя доктрину в самом тексте.
- source_word: immortal realm of Barbelo
  choice: бессмертной области Варвело
  rationale: «Область» естественно передаёт пространственно-космологическое realm, а имя транслитерируется в принятой русской форме «Варвело».
- source_word: complete the twelve [elements]
  choice: восполнить двенадцать [составляющих]
  rationale: «Восполнить» сохраняет идею доведения нарушенного числа до полноты; восстановленное существительное оставлено в скобках из-за повреждения текста.
- source_word: what is exalted
  choice: о возвышенном
  rationale: 'Сохраняет неопределённость: текст не уточняет, идёт ли речь о высшей области, тайне или возвышенных предметах.'
theological_decisions:
- issue: Обозначение Бога учеников
  choice: ваш Бог / наш Бог / их Бог
  alternative: Бог
  rationale: Притяжательные формы принципиальны для полемики произведения; их нельзя сглаживать так, будто все говорящие безусловно имеют в виду одного и того же Бога.
- issue: Сыновство Иисуса
  choice: «Сын нашего Бога»
  alternative: «Сын Божий»
  rationale: Сохранено именно исповедание учеников с притяжательным местоимением и последующий вызов Иисуса, без согласования с канонической формулой.
- issue: «Бог, пребывающий в вас, и его звёзды»
  choice: сохранена двойственная и космологическая формулировка
  alternative: истолковать Бога как внутренний дух или звёзды как ангелов
  rationale: Свидетель допускает несколько космологических прочтений; перевод не подменяет необычный образ толкованием.
- issue: Судьба Иуды и тайны Царства
  choice: '«Не для того, чтобы ты вошёл туда: тебе предстоит много скорбеть»'
  alternative: представить откровение как обещание Иуде войти в Царство
  rationale: Сохранено напряжение между особым откровением Иуде и отрицанием его вхождения, без богословского примирения этих утверждений.
- issue: Совершенный Человек
  choice: титульно окрашенное «совершенного Человека»
  alternative: «совершенную человечность»
  rationale: Личное «пусть встанет передо мной» и контекст испытания учеников лучше согласуются с личностным выражением, но доктринальная идентификация не добавляется.
translation_notes:
  register: 'Современный литературный русский с достоинством древнего религиозного диалога. Реплики оформлены естественно, без церковнославянизмов и без разговорной сниженности. Повторы, притяжательные обозначения Бога, космологические термины и богословские напряжения сохранены. Проект предварительный: он основан на предоставленном англоязычном публичном свидетельстве; прямая сверка с коптским текстом Codex Tchacos остаётся необходимой.'
