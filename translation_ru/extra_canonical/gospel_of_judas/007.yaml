translation:
  language: ru
  text: 'Иисус сказал: «Истинно говорю [вам]: это крещение, [которое они приняли] во имя Моё, […] погубит весь род земного Адама. Завтра они будут мучить того, кто носит Меня. Истинно [говорю] вам: рука смертного человека [не падёт] на Меня. Истинно [говорю] тебе, Иуда: те, кто приносит жертвы Сакласу, […] всё злое. Но ты превзойдёшь их всех, потому что принесёшь в жертву человека, который носит Меня. Твой рог уже поднят, твой гнев разгорелся, твоя звезда взошла, а сердце твоё [сбилось с пути]. Истинно [говорю тебе]: твой последний [… и] […] престолы области [повержены], цари ослабели, ангельские роды опечалились, зло, [которое они посеяли, …] уничтожено, [и] [правитель] стёрт с лица земли. [И] тогда [плод] великого рода Адама будет возвышен, ибо прежде неба, земли и ангелов существует тот род, что происходит из областей. Вот, тебе сказано всё. Подними глаза и посмотри на облако, внутри которого свет, и на звёзды вокруг него. А звезда, идущая впереди, — твоя звезда».


    Тогда Иуда поднял глаза, увидел светящееся облако и вошёл в него. Стоявшие на земле услышали голос из облака, говоривший: «[… великий] род […] и […]». И Иуда больше не видел Иисуса.


    Тотчас среди [иудеев] возникло смятение, большее, чем […]. Их первосвященники роптали, потому что Он вошёл в комнату для гостей, чтобы помолиться. Там же находились некоторые книжники и пристально следили за Ним, чтобы схватить Его во время молитвы. Они боялись народа, потому что все считали Его пророком.


    Они подошли к Иуде и сказали ему:


    — Что ты здесь делаешь? Разве ты не ученик Иисуса?


    Тогда он ответил им так, как они хотели. Иуда получил немного денег и предал Его им.


    Евангелие


    от Иуды[a]'
