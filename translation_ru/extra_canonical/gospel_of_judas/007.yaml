lexical_decisions:
- source_word: generation
  choice: род
  rationale: «Род» естественно передаёт общность происхождения и сохраняет повторяющийся термин; «поколение» могло бы неоправданно сузить смысл до современников одной эпохи.
- source_word: the one who bears me / the human who bears me
  choice: тот, кто носит Меня / человека, который носит Меня
  rationale: Сохранён буквальный и богословски напряжённый образ носителя без подстановки толкований вроде «тело» или «телесная оболочка».
- source_word: Saklas
  choice: Саклас
  rationale: Имя передано транслитерацией без поясняющего отождествления, которого нет в данном свидетельстве.
- source_word: horn
  choice: рог
  rationale: Образ сохранён буквально; его возможный символический смысл не разрешён переводчиком.
- source_word: realm / realms
  choice: область / области
  rationale: Нейтральное соответствие сохраняет пространственно-космологическую неопределённость и не вводит специальный термин «эон» без проверки коптского текста.
- source_word: luminous cloud
  choice: светящееся облако
  rationale: Передаёт видимое свечение естественным современным русским языком, не усиливая образ до «облака славы».
- source_word: handed him over
  choice: предал Его им
  rationale: В контексте выдачи Иисуса властям «предал» является естественным русским соответствием и перекликается с заголовком фрагмента, не добавляя мотивации Иуды.
theological_decisions:
- issue: Соотношение Иисуса и «того, кто носит Меня»
  choice: Сохранить разграничивающую формулировку источника
  alternative: Истолковать носителя как тело Иисуса или как отдельное человеческое лицо
  rationale: Текст допускает богословски значимые прочтения; перевод не должен выбирать одно из них вместо читателя.
- issue: Оценка поступка Иуды
  choice: Передать «превзойдёшь их всех» и «принесёшь в жертву» без морального пояснения
  alternative: Представить поступок как однозначно похвальный либо однозначно более злой
  rationale: Фраза содержит напряжение, которое следует сохранить, а не разрешать конфессиональным или интерпретационным комментарием.
- issue: Предсуществование великого рода Адама
  choice: «прежде неба, земли и ангелов существует тот род»
  alternative: Уточнить, что род был сотворён, избран или пребывает в конкретном небесном мире
  rationale: Сохранена временная и онтологическая формулировка свидетельства без добавления космологической схемы.
- issue: Вхождение Иуды в светящееся облако
  choice: Передать событие прямо, без оценки
  alternative: Объяснить его как вознесение, прославление, смерть или осуждение
  rationale: Повреждённый контекст не позволяет надёжно установить точное значение сцены.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Повторы, резкие переходы, космологические образы и повреждённый синтаксис по возможности сохранены. Местоимения, относящиеся к Иисусу, оформлены с прописной буквы как устойчивая русская издательская норма, без изменения содержания.
