review_pass:
  verdict: revise
  source_fidelity: Сверка возможна лишь с предоставленным английским свидетельством, а не непосредственно с коптским текстом. В черновике пропущено отрицательно-обобщающее значение "no hand", сужена область квадратной скобки в "received in my name", утрачена часть отмеченного восстановления о престолах, а выражение «стёрт с лица земли» добавляет отсутствующее в свидетельстве «земли». Маркер [the] перед «Jews» отражает восстановление английского артикля и не должен переноситься как неопределённость самого слова «иудеи».
  naturalness: 'После исправлений текст остаётся современным литературным русским. Формула «никакая рука смертного человека [не падёт] на Меня» намеренно несколько буквальна: она сохраняет образ и границу реконструированного участка; сглаживание до «не коснётся» изменило бы образ источника.'
  terminology: «Род», «Саклас», «рог», «область/области» и «носит Меня» сохранены. «Предал Его им» уместно передаёт передачу властям без дополнительной оценки. Прописные буквы в местоимениях, относимых к Иисусу, допустимы в избранной издательской норме и не меняют смысл.
  issues:
  - severity: high
    issue: Пропущено значение "no" в фразе о руке смертного человека.
    rationale: '«Рука смертного человека [не падёт] на Меня» не исключает всякую такую руку, тогда как свидетельство говорит: «no hand». Исправлено на «никакая рука...».'
  - severity: medium
    issue: Неверно передана граница восстановления в «baptism[which they've received in] my name».
    rationale: 'В черновике «во имя Моё» оказалось вне скобок, хотя предлог «in» входит в отмеченный реконструированный сегмент. Исправлено: «крещение[, которое они приняли во] имя Моё».'
  - severity: medium
    issue: Утрачен отмеченный текст «the thrones» и нарушена структура лакуны.
    rationale: В свидетельстве слово «thrones» находится внутри повреждённого/восстановленного комплекса. В исправлении оно сохранено как «[… престолы] области».
  - severity: medium
    issue: Добавлено «с лица земли» при передаче «the ruler is wiped out».
    rationale: Свидетельство не содержит «земли»; добавление конкретизирует образ. Исправлено на «[правитель] стёрт».
  - severity: low
    issue: Квадратные скобки вокруг «иудеев» создают ложную неопределённость.
    rationale: В английском [the] — восстановленный артикль, а не сам этноним. В русском артикль не передаётся, поэтому нужно «среди иудеев».
  - severity: low
    issue: Голос из облака передан с иной сегментацией повреждённого текста.
    rationale: «[… великий] род» помещает «великий» в скобочный сегмент, хотя в свидетельстве утрата предшествует сохранённому «great». Исправлено на «[…] великий род […] и […]».
