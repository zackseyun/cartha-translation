base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/022.yaml
  text: 'When the archons realized that (Adam and Eve) had broken their commandments (to them), they came into Paradise and approached Adam and Eve with an earthquake and great threats, to see the result of the help they had received. Adam and Eve shook violently and hid beneath the trees in Paradise. The archons did not know where they were and said, “Adam, where are you?”


    He said, “Here I am. I hid because I was afraid of you and was embarrassed.” In their ignorance, they said to him, “Who told you about the embarrassment with which you have clothed yourself, unless you have eaten from that tree?”


    He said, “The woman you gave me—she gave it to me, and I ate.”


    Then they said to the woman: [] “What have you done?”


    She answered, “The teacher incited me, and I ate.”


    Then the archons approached the teacher. Because of him, their eyes grew foggy, and they were unable to do anything against him. Since they were powerless, they cursed him.


    After this, they approached the woman and cursed her and her descendants.


    After the woman, they cursed Adam and, because of him, the land and the crops as well. They cursed everything they had created. They possess no blessing. Good cannot result from evil.


    From that day on, the authorities truly realized that there was something more powerful than they were.


    They knew only that their commandments had not been obeyed. Tremendous jealousy entered the world solely because of the deathless man.


    When the archons realized that their Adam had gained a different kind of knowledge, they wanted to test him. They gathered every tame animal, the wild beasts of the earth, and the birds of heaven, and brought them before Adam to learn what he would call them. When he saw them, he gave names to their creatures.


    They became disturbed because Adam recovered from every test. They gathered together and devised schemes, saying, “Look at Adam! He has become like one of us, because he knows the difference between light and darkness. Perhaps now he will be deceived, as happened with the tree of knowledge, and will even approach the tree of life, eat from it, become deathless, and become lord. Then he will loathe and despise us and all our glory. He will condemn us together with our universe. Come, let us banish him [] from Paradise, down to the earth from which he was taken, so that from now on he will be unable to know anything beyond what we are capable of.” In this way, they banished Adam from Paradise together with his wife. But this act they committed was not enough for them. Instead, they became afraid.


    They entered (Paradise, approaching) the tree of life and enclosed it with large, fearsome beings—fiery living creatures called “Cherubin.” They placed a flaming sword among them, fearsomely and continuously turning, to prevent any earthly being from ever entering that place.


    Because the archons became jealous of Adam, they wanted to shorten their lifespans. They were unable to do so because of fate, which had been established from the beginning, for each one had been assigned a lifespan of 1,000 years in accordance with the orbit of the radiant bodies. Nevertheless, although the archons were unable to accomplish this, each of the perpetrators of evil subtracted ten years, and the full lifespan came to 930 years. These years pass in suffering, weakness, and malevolent disruption. This is how life has been from that day until the consummation of the age.'
translation:
  language: ru
  text: 'Когда архонты поняли, что Адам и Ева нарушили данные им повеления, они пришли в рай и приблизились к Адаму и Еве, сопровождаемые землетрясением и грозными угрозами, чтобы увидеть, к чему привела оказанная им помощь.[a] Адам и Ева сильно задрожали и спрятались под деревьями в раю. Архонты не знали, где они, и сказали:


    — Адам, где ты?


    Он ответил:


    — Я здесь. Я спрятался, потому что испугался вас и устыдился.


    По неведению своему они сказали ему:


    — Кто сообщил тебе о стыде, в который ты облёкся? Не ел ли ты от того дерева?


    Он ответил:


    — Женщина, которую вы дали мне, дала мне плод, и я ел.


    Тогда они сказали женщине:[b]


    — Что ты сделала?


    Она ответила:


    — Учитель побудил меня, и я ела.[c]


    Тогда архонты приблизились к учителю. Из-за него их глаза затуманились, и они ничего не могли с ним сделать. Будучи бессильны, они прокляли его.


    После этого они приблизились к женщине и прокляли её и её потомков.


    После женщины они прокляли Адама, а из-за него — также землю и посевы. Они прокляли всё, что сами создали. Благословения у них нет: добро не может произойти от зла.


    С того дня власти действительно поняли, что существует нечто более могущественное, чем они.


    Они знали лишь, что их повеления не были исполнены. Только из-за бессмертного человека в мир вошла великая зависть.


    Когда архонты поняли, что их Адам обрёл знание иного рода, они захотели испытать его. Они собрали всех домашних животных, земных зверей и небесных птиц и привели их к Адаму, чтобы узнать, как он их назовёт. Увидев их, он дал имена созданным ими существам.


    Архонты встревожились, потому что Адам оправлялся после каждого испытания.[d] Они собрались вместе, замышляя козни, и сказали:


    — Вот Адам! Он стал как один из нас, потому что знает различие между светом и тьмой. Быть может, теперь он будет обманут, как было с деревом познания, и даже приблизится к дереву жизни, вкусит от него, станет бессмертным и сделается владыкой. Тогда он возненавидит и станет презирать нас и всю нашу славу, а затем осудит нас вместе с нашей вселенной. Давайте изгоним его из рая[c] вниз, на землю, из которой он был взят, чтобы отныне он не мог познать ничего превосходящего наши возможности.


    Так они изгнали Адама из рая вместе с его женой. Но содеянного им было недостаточно: они испугались.


    Они вошли в рай, приблизились к дереву жизни и окружили его огромными грозными существами — огненными живыми созданиями, называемыми «херувимами». Среди них они поместили пламенный меч, который непрестанно и грозно вращался, чтобы ни одно земное существо никогда не вошло в то место.


    Позавидовав Адаму, архонты захотели сократить срок их жизни.[f] Но не смогли из-за судьбы, установленной от начала: каждому был назначен срок жизни в тысячу лет, сообразно движению светил. И всё же, хотя архонты не могли этого совершить, каждый из творящих зло отнял по десять лет, так что полный срок жизни составил девятьсот тридцать лет. Эти годы проходят в страдании, немощи и злобной смуте. Такова жизнь с того дня и до завершения века.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение «оказанная им помощь» двусмысленно: из доступного английского свидетельства не вполне ясно, кто именно оказал помощь и в чём она состояла. Прямой пересмотр коптского текста ещё требуется.'
    reason: Сохранение реальной синтаксической и сюжетной неоднозначности исходного свидетельства.
  - marker: b
    text: В свидетельстве здесь отмечена лакуна рукописи.
    reason: Квадратные скобки исходного материала обозначают повреждение или пропуск; в русском тексте оно обозначено сноской.
  - marker: c
    text: «Учитель» — обозначение персонажа в данном тексте; перевод не отождествляет его со змеем без дополнительного текстового основания.
    reason: Предотвращение молчаливого внесения традиционной идентификации.
  - marker: d
    text: «Оправлялся после каждого испытания» передаёт чтение английского свидетельства; точный смысл соответствующего коптского выражения нуждается в проверке.
    reason: Фраза семантически необычна и основана на промежуточном публичном переводе.
  - marker: f
    text: Местоимение «их» может относиться к Адаму и его потомкам либо к людям в целом; предоставленное свидетельство не устраняет неоднозначности.
    reason: Сохранение неясного референта множественного числа.
lexical_decisions:
- source_word: archons
  choice: архонты
  rationale: Сохранён технический термин гностического текста, уже укоренившийся в русскоязычной научной и переводной традиции; перевод «правители» стёр бы особую космологическую роль.
- source_word: authorities
  choice: власти
  rationale: Передано отдельно от «архонтов», чтобы сохранить лексическое различие свидетельства, не утверждая при этом, что речь непременно идёт о другой группе.
- source_word: teacher
  choice: учитель
  rationale: Буквальная и намеренно неопределённая передача; персонаж не отождествлён в основном тексте со змеем или иным существом без прямого основания в данном отрывке.
- source_word: deathless
  choice: бессмертный
  rationale: Естественный русский эквивалент, сохраняющий идею неподвластности смерти; не заменён богословски нагруженными выражениями.
- source_word: Paradise
  choice: рай
  rationale: Общеупотребительное современное русское обозначение, соответствующее библейско-апокрифическому контексту.
- source_word: Cherubin
  choice: херувимами
  rationale: Использована нормативная русская форма множественного числа; необычная форма английского свидетеля не перенесена как отдельное имя.
- source_word: consummation of the age
  choice: завершения века
  rationale: Сохранена эсхатологическая формула и многозначность «века/эпохи» без уточняющего толкования «конец мира».
theological_decisions:
- issue: Природа «учителя»
  choice: Сохранено обозначение «учитель» без идентификации.
  alternative: «Змей» или конкретное небесное существо.
  rationale: Предоставленное свидетельство называет персонажа teacher; идентификация разрешила бы заложенную в тексте неоднозначность.
- issue: Источник проклятия и благословения
  choice: 'Сохранено резкое утверждение: «Благословения у них нет: добро не может произойти от зла».'
  alternative: Смягчить до оценки отдельных поступков архонтов.
  rationale: Фраза выражает собственную космологическую и нравственную аргументацию произведения; её нельзя согласовывать с позднейшими конфессиональными системами.
- issue: Судьба и назначенный срок жизни
  choice: «Судьба, установленная от начала» сохранена как действующая граница власти архонтов.
  alternative: Заменить судьбу Божьим предопределением или природным законом.
  rationale: Такая замена импортировала бы чуждое тексту богословское объяснение.
- issue: Местоимение во фразе о сроках жизни
  choice: Сохранено «срок их жизни» с примечанием о неясном референте.
  alternative: Однозначно отнести срок только к Адаму и его потомкам.
  rationale: Английское свидетельство содержит множественное their, а прямой коптский контроль пока не выполнен.
- issue: «Наша вселенная»
  choice: Сохранено «наша вселенная».
  alternative: «Наш мир» или «всё мироздание».
  rationale: Формулировка передаёт притязание архонтов на принадлежащий им космос, не решая вопрос о масштабе этого космоса.
translation_notes:
  register: Современный литературный русский язык с достоинством апокрифического повествования. Диалоги оформлены естественно, без церковнославянизмов; техническое «архонты» сохранено. Перевод является осторожным черновиком по публичному английскому свидетелю, поскольку непосредственная сверка с коптскими рукописями обозначена как ожидающая выполнения. Лакуны перенесены в примечания, а не оставлены пустыми квадратными скобками.
