review_pass:
  verdict: revise
  source_fidelity: 'Черновик в целом аккуратно следует предоставленному английскому свидетельству и сохраняет его космологическую лексику и неоднозначности. Однако в реплике Адама добавлено отсутствующее в свидетельстве слово «плод». Кроме того, два разных обозначения лакуны/редакторской неопределённости оформлены несогласованно: маркер [c] после «изгоним его» ошибочно отсылает к примечанию об «Учителе», а скобочное место перед «деревом жизни» в основном тексте было безоговорочно разрешено.'
  naturalness: Русский текст литературный, связный и соответствует возвышенному повествовательному регистру. Диалоги естественны. Формула «дала мне, и я ел» намеренно несколько эллиптична, но оправдана точностью к свидетельству и читается по контексту.
  terminology: «Архонты», «власти», «Учитель», «бессмертный», «херувимы» и «завершение века» переданы последовательно. «Учитель» не идентифицируется конфессионально; это верно. «Рай» уместен в данном контексте.
  issues:
  - severity: medium
    issue: Добавлено слово «плод» в ответе Адама.
    rationale: 'Свидетельство говорит только: «она дала мне, и я ел»; объект не назван. Добавление «плод» вероятно контекстуально, но снимает эллипсис исходного текста.'
  - severity: medium
    issue: Неверная привязка сноски после слов «изгоним его».
    rationale: В этом месте свидетельство содержит отдельную лакуну ([]), но маркер [c] ведёт к примечанию об обозначении «Учитель». Следует дать отдельное примечание о лакуне.
  - severity: low
    issue: Скобочное редакторское уточнение перед «деревом жизни» не отмечено.
    rationale: Свидетельство содержит «(Paradise, approaching)». Его безоговорочное превращение в гладкое «вошли в рай, приблизились к…» скрывает редакторскую неопределённость. Её следует обозначить примечанием.
  revised_text: 'Когда архонты поняли, что Адам и Ева нарушили данные им повеления, они пришли в рай и приблизились к Адаму и Еве, сопровождаемые землетрясением и грозными угрозами, чтобы увидеть, к чему привела оказанная им помощь.[a] Адам и Ева сильно задрожали и спрятались под деревьями в раю. Архонты не знали, где они, и сказали:


    — Адам, где ты?


    Он ответил:


    — Я здесь. Я спрятался, потому что испугался вас и устыдился.


    По неведению своему они сказали ему:


    — Кто сообщил тебе о стыде, в который ты облёкся? Не ел ли ты от того дерева?


    Он ответил:


    — Женщина, которую вы дали мне, дала мне, и я ел.


    Тогда они сказали женщине:[b]


    — Что ты сделала?


    Она ответила:


    — Учитель побудил меня, и я ела.[c]


    Тогда архонты приблизились к Учителю. Из-за него их глаза затуманились, и они ничего не могли с ним сделать. Будучи бессильны, они прокляли его.


    После этого они приблизились к женщине и прокляли её и её потомков.


    После женщины они прокляли Адама, а из-за него — также землю и посевы. Они прокляли всё, что сами создали. Благословения у них нет: добро не может произойти от зла.


    С того дня власти действительно поняли, что существует нечто более могущественное, чем они.


    Они знали лишь, что их повеления не были исполнены. Только из-за бессмертного человека в мир вошла великая зависть.


    Когда архонты поняли, что их Адам обрёл знание иного рода, они захотели испытать его. Они собрали всех домашних животных, земных зверей и небесных птиц и привели их к Адаму, чтобы узнать, как он их назовёт. Увидев их, он дал имена их существам.


    Архонты встревожились, потому что Адам оправлялся после каждого испытания.[d] Они собрались вместе, замышляя козни, и сказали:


    — Вот Адам! Он стал как один из нас, потому что знает различие между светом и тьмой. Быть может, теперь он будет обманут, как было с деревом познания, и даже приблизится к дереву жизни, вкусит от него, станет бессмертным и сделается владыкой. Тогда он возненавидит и станет презирать нас и всю нашу славу, а затем осудит нас вместе с нашей вселенной. Давайте изгоним его из рая[e] вниз, на землю, из которой он был взят, чтобы отныне он не мог познать ничего превосходящего наши возможности.


    Так они изгнали Адама из рая вместе с его женой. Но содеянного им было недостаточно: они испугались.


    Они вошли в рай, приблизились к дереву жизни и окружили его огромными грозными существами — огненными живыми созданиями, называемыми «херувимами».[f] Среди них они поместили пламенный меч, который непрестанно и грозно вращался, чтобы ни одно земное существо никогда не вошло в то место.


    Позавидовав Адаму, архонты захотели сократить срок их жизни.[g] Но не смогли из-за судьбы, установленной от начала: каждому был назначен срок жизни в тысячу лет, сообразно движению светил. И всё же, хотя архонты не могли этого совершить, каждый из творящих зло отнял по десять лет, так что полный срок жизни составил девятьсот тридцать лет. Эти годы проходят в страдании, немощи и злобной смуте. Такова жизнь с того дня и до завершения века.'
