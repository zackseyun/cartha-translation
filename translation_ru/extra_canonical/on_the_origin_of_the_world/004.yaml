base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/004.yaml
  text: 'Seven androgynous beings appeared in Chaos. They have both masculine and feminine names:


    The feminine name is Pronoia, Sambathas, which means “week,”

    and his son is named Yao, whose feminine name is Rulership.

    Sabaoth, whose feminine name is Divinity.

    Adonaios, whose feminine name is Kingship.

    Elaios, whose feminine name is Jealousy.

    Oraios, whose feminine name is Wealth,

    and Astaphaios, whose [feminine] name [] is Sophia.


    These are the seven powers belonging to the seven heavens of Chaos. They were born as androgynous beings, corresponding to the deathless structure that existed before them, in accordance with the desire of Pistis—namely, that the likeness of what had existed from the beginning would rule until the end.


    You will discover the power exerted by these names, as well as the power of the male beings, in the (book) The Archangelic (Nature) of the Prophet Moses, and the power of the names of the female beings in the First Book of Noraia.


    Now the Primal Parent Yaldabaoth, since he possessed great authorities, created heavens for each of his offspring by speaking them into being. He made them good as dwelling places, and in each heaven he created great glories, each seven times as excellent: thrones, palaces, temples, chariots, and virginal spirits, (all the way) up to an unseen one, along with their glories. Each one possessed these in its own heaven: mighty hosts of gods, lords, angels, and archangels, countless myriads, so that they might serve.


    You will find the account of these events precisely described in the First Narration of Oraia.


    And they were completed, from this heaven up to the sixth heaven, which belongs to Sophia.


    This heaven and earth were attacked by the mischief-maker who lived beneath them all, and the six heavens trembled violently, because the hosts of Chaos knew who had attacked the heaven located beneath them. When Pistis became aware of the fracture caused by the mischief-maker, she sent out her spirit, bound him, and cast him down into Tartaros.


    [From that day], the heaven, together with [] its earth, has been established through Sophia, the daughter of Yaldabaoth, who dwells beneath them all.'
translation:
  language: ru
  text: 'Семь двуполых существ явились в Хаосе. У них есть и мужские, и женские имена:


    Женское имя — Проноя, Самбатас, что означает «неделя»;

    а его сын носит имя Яо, и его женское имя — Владычество.

    Саваоф — его женское имя Божество.

    Адонайос — его женское имя Царство.

    Элайос — его женское имя Ревность.

    Орайос — его женское имя Богатство.

    Астафайос — его [женское] имя […] София.[a]


    Таковы семь сил, принадлежащих семи небесам Хаоса. Они родились двуполыми, сообразно бессмертному устроению, которое существовало прежде них, по желанию Пистис: чтобы подобие существовавшего от начала владычествовало до конца.


    Какую силу проявляют эти имена, а также какова сила мужских существ, ты узнаешь из книги «Архангельская природа пророка Моисея», а о силе имён женских существ — из «Первой книги Норайи».[b]


    И вот, Прародитель Ялдаваоф, обладавший великими властями, словом сотворил небеса для каждого из своих потомков. Он создал их благими жилищами, а в каждом небе сотворил великие славы, одна другой превосходнее в семь раз: престолы, дворцы, храмы, колесницы и девственные духи — вплоть до невидимого — вместе с их славами. Каждый обладал всем этим в своём небе: могучими воинствами богов, господ, ангелов и архангелов — бесчисленными мириадами, чтобы они служили.


    Точное изложение этих событий ты найдёшь в «Первом повествовании Орайи».[c]


    И они были завершены — от этого неба до шестого неба, принадлежащего Софии.


    На это небо и землю напал вредитель, обитавший ниже их всех, и шесть небес сильно содрогнулись, потому что воинства Хаоса знали, кто напал на расположенное под ними небо. Когда Пистис узнала о разломе, который устроил вредитель, она послала свой дух, связала его и низвергла в Тартар.


    [С того дня] небо вместе со […] своей землёй утвердилось посредством Софии, дочери Ялдаваофа, обитающей ниже их всех.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Начало перечня и строка об Астафайосе повреждены или синтаксически неполны; знак […] отмечает лакуну в рукописном свидетельстве. Поэтому соотношение первого имени «Проноя, Самбатас» и точная форма последней строки остаются не вполне ясными.
    reason: Сохранение рукописной лакуны и подлинной неопределённости перечня.
  - marker: b
    text: Названия упомянутых произведений переданы буквально по доступному свидетельству; их точная древняя форма требует сверки с коптским текстом.
    reason: Исходные данные основаны на английском публичном свидетельстве, а прямая проверка коптского источника ещё не выполнена.
  - marker: c
    text: Имя Орайя связано с формой «Норайя» в предыдущем названии, однако в доступном свидетельстве употреблены разные формы; они сохранены раздельно.
    reason: Не унифицировать возможные варианты имени без источниковедческой проверки.
  - marker: d
    text: Квадратные скобки передают восстановленные или утраченные места текста. В последнем предложении после «со» в рукописном свидетельстве имеется лакуна, поэтому связь слов может быть понята не вполне однозначно.
    reason: Явно обозначить текстологическую неопределённость.
lexical_decisions:
- source_word: androgynous
  choice: двуполые
  rationale: Передаёт сочетание мужского и женского в самих существах; современнее и прозрачнее для широкого читателя, чем транслитерация «андрогинные».
- source_word: Pronoia / Pistis / Sophia
  choice: Проноя / Пистис / София
  rationale: Имена транслитерированы как имена персонажей, а не переведены как «Промысл», «Вера» и «Мудрость», чтобы не устранять их персонифицированный и технический смысл.
- source_word: Rulership / Divinity / Kingship
  choice: Владычество / Божество / Царство
  rationale: Абстрактные женские имена переданы существительными среднего рода по естественным русским лексическим соответствиям; грамматический род русского слова не подменяет обозначенную текстом женскую ипостась.
- source_word: authorities
  choice: власти
  rationale: Сохранён технический космологический оттенок, а не обобщённое «могущество».
- source_word: verbal articulation
  choice: словом сотворил
  rationale: Естественно выражает создание посредством произнесения, не усиливая текст до более специфической доктрины.
- source_word: glories
  choice: славы
  rationale: Сохранён необычный множественный образ исходного свидетельства, а не истолкован как «великолепие» или «славные создания».
- source_word: mischief-maker
  choice: вредитель
  rationale: Передаёт деятеля, причиняющего разрушение, без добавления идентификации с дьяволом или иной фигурой.
- source_word: Tartaros
  choice: Тартар
  rationale: Устоявшееся русское название космологического места заключения.
theological_decisions:
- issue: Имена женских соответствий семи существ
  choice: Сохранить как титульные абстрактные имена с прописной буквы
  alternative: Согласовать их как личные женские имена или заменить пояснительными формами
  rationale: Так сохраняется напряжение между заявленной женской принадлежностью и грамматическим родом русских эквивалентов без конфессионального истолкования.
- issue: «подобие существовавшего от начала»
  choice: Сохранить неопределённую референцию
  alternative: Уточнить, чьё именно это подобие и что существовало от начала
  rationale: Свидетельство не называет референт явно; уточнение было бы интерпретацией.
- issue: Сотворение небес речью
  choice: «словом сотворил»
  alternative: «вызвал к бытию своим словом»
  rationale: Первый вариант сохраняет мотив речевого творения, но не импортирует формулу из определённой богословской традиции.
- issue: Пославшая дух и связавшая вредителя Пистис
  choice: Сохранить последовательность с Пистис как действующим лицом
  alternative: Сделать дух самостоятельным субъектом связывания
  rationale: Английское свидетельство допускает синтаксическое напряжение, но ближайшая грамматика продолжает действия Пистис; текст не уточняет автономность духа.
- issue: Утверждение неба посредством Софии
  choice: «утвердилось посредством Софии»
  alternative: «было установлено Софией»
  rationale: Сохранён посреднический оборот и не решён вопрос о прямой причинности.
translation_notes:
  register: Современный литературный русский с достоинством и умеренной архаической окраской, уместной для древнего космологического трактата. Синтаксис сделан читаемым, но необычная структура перечня, технические космологические термины, множественное «славы» и рукописные лакуны сохранены. Черновик необходимо впоследствии сверить непосредственно с коптским текстом Nag Hammadi Codex II,5; данная версия опирается на предоставленное публичное английское свидетельство.
