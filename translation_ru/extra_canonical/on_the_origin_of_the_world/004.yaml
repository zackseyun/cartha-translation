review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод следует предоставленному английскому свидетельству, сохраняя имена, лакуны, скобки и неопределённые космологические формулы. Однако оборот «одна другой превосходнее в семь раз» вводит сравнение между «славами», которого в свидетельстве нет: «seven times as excellent» характеризует созданное устройство/славы, а не их взаимное превосходство. Начальная строка перечня остаётся текстологически неясной и должна быть оформлена без видимости уверенного синтаксического решения.'
  naturalness: Русский литературный регистр в основном удачен. Уточнены пунктуация и синтаксис перечня, а также референция «каждое [небо]», чтобы русская фраза была читаемой без добавления содержания. «Вплоть до невидимого» сохранено как намеренно неполное выражение свидетельства.
  terminology: Транслитерации Проноя, Самбатас, Яо, Саваоф, Адонайос, Элайос, Орайос, Астафайос, Пистис, София, Ялдаваоф и Тартар сохранены. Титульные абстрактные имена и технические «власти», «славы» также сохранены. Названия упомянутых книг остаются предварительными, поскольку прямая сверка с коптским текстом в данных не представлена.
  issues:
  - severity: medium
    issue: «одна другой превосходнее в семь раз»
    rationale: Формула делает «славы» объектами взаимного сравнения и добавляет значение, отсутствующее в английском свидетельстве. Следует передать «each seven times as excellent» без сравнительного «одна другой».
  - severity: medium
    issue: Синтаксическая определённость первой строки перечня
    rationale: Свидетельство содержит повреждённую либо неполную последовательность «Pronoia, [2] Sambathas». Перевод не должен оформлять её как ясное приложение или надёжно установленное соотношение имён.
  - severity: low
    issue: «Каждый обладал всем этим»
    rationale: В русском «каждый» не имеет ясного референта. Добавление в квадратных скобках «небо» проясняет грамматику, отмечая, что слово вставлено переводчиком.
