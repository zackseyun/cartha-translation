base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/024.yaml
  text: 'Let us return to the archons we discussed earlier, so that we can explain them.


    When the seven archons had been thrown down from their heavens to the earth, they made many demonic angels to serve them. These angels taught humanity various kinds of error, magic, potions, idol worship, bloodshed, altars, temples, sacrifices, and drink offerings to all the earthly demons. They worked together with fate, who came into being through the agreement between the gods of injustice and justice. In this way, once the world had come into being, it went astray and remained continually confused, because all people on earth worshiped demons from the creation to the consummation of the age, both the angels of righteousness and the humans of unrighteousness.


    In this way, the world came to exist in confusion, ignorance, and a stupor. They had all gone astray until the true man appeared.


    Let this be enough concerning the subject.'
translation:
  language: ru
  text: 'Вернёмся к архонтам, о которых мы говорили прежде, чтобы дать им объяснение.


    Когда семь архонтов были низвергнуты со своих небес на землю, они создали себе множество демонических ангелов, чтобы те им служили. Эти ангелы научили человечество разного рода заблуждениям, магии, изготовлению зелий, поклонению идолам, кровопролитию, а также устройству жертвенников и храмов, принесению жертв и возлияний всем земным демонам. Они действовали сообща с судьбой, которая возникла по соглашению между богами неправедности и праведности. Так мир, возникнув, сбился с пути и пребывал в постоянном смятении, потому что все люди на земле поклонялись демонам — от сотворения до завершения века: и ангелы праведности, и люди неправедности.[a]


    Так мир стал существовать в смятении, неведении и оцепенении. Все сбились с пути — до явления истинного человека.


    Сказанного об этом достаточно.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Связь последних слов с предыдущей фразой не вполне ясна: «ангелы праведности» и «люди неправедности» могут обозначать тех, кто поклонялся демонам, однако грамматическое построение допускает и иное понимание.'
    reason: Сохранение отмеченной в английском консультационном слое подлинной грамматической неоднозначности.
lexical_decisions:
- source_word: archons
  choice: архонты
  rationale: Сохранён устоявшийся русский термин для космических властителей в гностическом контексте; перевод «правители» чрезмерно сгладил бы специальное значение.
- source_word: demonic angels
  choice: демонические ангелы
  rationale: Передаёт внутреннее сочетание категорий исходного свидетельства, не заменяя его толкованием вроде «злые духи».
- source_word: potions
  choice: изготовление зелий
  rationale: По контексту это оккультные или вредоносные составы; «зелья» естественно по-русски, а добавление «изготовлению» согласует элемент с перечнем того, чему учили.
- source_word: fate
  choice: судьба
  rationale: Сохранена персонификация посредством женского рода и относительного местоимения «которая».
- source_word: consummation (of the age)
  choice: завершение века
  rationale: Сохраняет эсхатологический смысл «века», не подменяя его более определённым «концом света».
- source_word: true man
  choice: истинный человек
  rationale: Буквальное и богословски открытое соответствие, не определяющее без достаточных оснований личность или природу этой фигуры.
- source_word: stupor
  choice: оцепенение
  rationale: Передаёт состояние духовной и умственной неподвижности естественным современным словом; «ступор» был бы стилистически менее достоинным.
theological_decisions:
- issue: Статус архонтов
  choice: Сохранить транслитерацию «архонты»
  alternative: «правители» или «властители»
  rationale: Специальный мифологический статус фигур нельзя без потери свести к обычной политической или духовной власти.
- issue: Происхождение судьбы
  choice: «возникла по соглашению между богами неправедности и праведности»
  alternative: «возникла из согласия богов несправедливости и справедливости»
  rationale: Сохранены одновременно персонификация судьбы и напряжённое противопоставление двух групп богов; формулировка не объясняет природу их соглашения.
- issue: Неясная заключительная конструкция о поклоняющихся демонам
  choice: Сохранить обе группы в приложении после двоеточия и снабдить примечанием
  alternative: Однозначно отнести «ангелов праведности» и «людей неправедности» к поклоняющимся либо перестроить их как отдельное противопоставление
  rationale: Предоставленное свидетельство грамматически двусмысленно, поэтому нельзя молча разрешать, кто именно включён в утверждение и как группы связаны с предыдущей частью.
- issue: «Истинный человек»
  choice: Не отождествлять фигуру в основном тексте
  alternative: «Истинный Человек» с титульной прописной буквой или прямое мессианское отождествление
  rationale: Строчная буква и буквальная передача сохраняют возможность титульного смысла, не навязывая определённой конфессиональной идентификации.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего религиозно-философского повествования. Синтаксис умеренно упрощён ради ясности, но специальные понятия и богословские напряжения сохранены. Поскольку прямая сверка с коптским источником ожидается, решения считаются публикационным черновиком на основании предоставленного публичного английского свидетельства.
