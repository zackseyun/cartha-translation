  source_fidelity: В целом перевод точно передаёт предоставленное английское свидетельство и сохраняет различение архонта, властей, Света, духа, души и земли. Однако «предведение» означает прежде всего предзнание, тогда как forethought здесь обозначает предварительный замысел. Эпитет lowly не следует передавать словом «малый». Сигнал лакуны после восстановленного [following] должен быть виден непосредственно в тексте, а не только объяснён в сноске.
  naturalness: Регистр современный литературный и в целом естественный. «Предварительный замысел» яснее «предведения»; «низшим Днём Покоя» передаёт оценочный/иерархический эпитет без разговорного усиления. Формула с квадратными скобками сохранена намеренно, поскольку отражает состояние свидетельства.
  terminology: «Архонт», «власти», «Прародитель», «Праматерь», «Правосудие», «человек Закона» и «День Покоя» сохранены. «Оформленные образы» приемлемо передаёт shaped forms. Терминологической догматизации не внесено.
