base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/020.yaml
  text: 'She first became pregnant with Abel by the first archon. By the seven authorities and their angels, she had the other children. Everything happened according to the forethought of the Primal Parent, so that the Primal Mother could bear every seed within her, mixed and joined with the destiny of the universe and its structures. A plan designed beforehand by Justice was set in motion concerning Eve: the shaped forms of the authorities would become places enclosing the light, and through their shaped forms the light would condemn them.


    The Primal Adam, who is from the Light, is filled with spirit, and he appeared on the first day. The second Adam is filled with soul, and he appeared on the sixth day, called “Aphrodite.” The third Adam is a created being from the earth, namely, the man of the Law. He appeared on the eighth day, called “Sun-Day,” [following] [] the lowly Rest-Day. The descendants of the earthly Adam multiplied and filled the earth, and from within themselves they produced all kinds of technological skills possessed by the Adam filled with soul. However, they all lived in ignorance.'
translation:
  language: ru
  text: 'Сначала она зачала Авеля от первого архонта, а от семи властей и их ангелов родила остальных детей. Всё произошло по предведению Прародителя, чтобы Праматерь могла носить в себе всякое семя, смешанное и соединённое с судьбой вселенной и её устройствами. Тогда был приведён в действие замысел о Еве, заранее составленный Правосудием: оформленные образы властей должны были стать вместилищами, заключающими в себе свет, а свет через эти образы должен был обличить их.


    Первый Адам — от Света, исполненный духа; он явился в первый день. Второй Адам исполнен души; он явился в шестой день, называемый «Афродитой». Третий Адам — сотворённое существо из земли, то есть человек Закона; он явился в восьмой день, называемый «Днём Солнца», [следующим] [a] за малым Днём Покоя. Потомки земного Адама размножились и наполнили землю. Из собственной среды они произвели всевозможные ремёсла и умения, которыми обладал Адам, исполненный души. Однако все они пребывали в неведении.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В источнике перед словами «за малым Днём Покоя» отмечен неясный или утраченный фрагмент; слово «следующим» является восстановлением.
    reason: Необходимо сохранить сигнал повреждения или редакционного восстановления, представленный квадратными скобками в исходном свидетельстве.
lexical_decisions:
- source_word: archon
  choice: архонт
  rationale: Сохраняет специальный космологический термин трактата и отличает его от следующих далее «властей».
- source_word: forethought
  choice: предведение
  rationale: Передаёт идею заранее существующего замысла, не отождествляя её без необходимости с конфессиональным понятием промысла.
- source_word: Primal Parent / Primal Mother
  choice: Прародитель / Праматерь
  rationale: Сохраняет парность и первичность фигур, употребляя понятные и торжественные русские наименования.
- source_word: shaped forms
  choice: оформленные образы
  rationale: Передаёт как приданную форму, так и образ-воплощение, не сводя выражение только к физическим телам.
- source_word: imbued with spirit / soul
  choice: исполненный духа / души
  rationale: Сохраняет параллелизм трёх антропологических типов и естественно звучит по-русски.
- source_word: technological skills
  choice: ремёсла и умения
  rationale: Современное «технологические навыки» звучало бы анахронично; выбранное выражение обозначает практические искусства и мастерство.
- source_word: Rest-Day
  choice: День Покоя
  rationale: Сохраняет буквальную игру с названиями дней и не подменяет необычную формулировку просто словом «суббота».
theological_decisions:
- issue: Кто обличает власти
  choice: «свет ... должен был обличить их»
  alternative: «она/оно осудило бы их» без явного подлежащего
  rationale: Ближайшим смысловым субъектом выступает свет; при этом «обличить» сохраняет оттенок осуждения, не усиливая его до окончательного приговора.
- issue: Соотношение трёх Адамов
  choice: 'Сохранены различия: от Света и исполненный духа; исполненный души; сотворённый из земли'
  alternative: Унифицировать их как три воплощения одного Адама
  rationale: Текст проводит антропологические и космологические различия, которые не следует догматически сглаживать.
- issue: Правосудие как действующее лицо
  choice: «Правосудие» с прописной буквы
  alternative: «справедливость» как отвлечённое качество
  rationale: Контекст представляет Justice как персонифицированную космическую силу, составившую замысел.
- issue: Человек Закона
  choice: «человек Закона»
  alternative: «законный человек»
  rationale: Сохраняет вероятную титульность и богословскую напряжённость выражения, не объясняя, какой именно закон имеется в виду.
translation_notes:
  register: 'Современный литературный русский с умеренно торжественным регистром. Специальные термины космологии сохранены там, где их упрощение могло бы стереть различия. Проект предварительный: он основан на предоставленном англоязычном публичном свидетельстве; прямая сверка с коптским текстом ещё требуется.'
