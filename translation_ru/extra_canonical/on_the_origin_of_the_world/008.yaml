translation:
  language: ru
  text: 'Так, когда Прародитель Хаоса увидел своего сына Саваофа и славу, в которой тот пребывал, и понял, что тот стал величайшим среди всех властей Хаоса, он позавидовал ему. В ярости он породил Смерть из собственной смерти. Смерть была поставлена над шестым небом, потому что Саваоф был вознесён оттуда. Так исполнилось число шести властей Хаоса.


    Затем Смерть, существо двуполое, соединилась со своей собственной природой и породила семь двуполых детей. Вот имена детей мужского пола:


    Ревность,

    Ярость,

    Слёзы,

    Стоны,

    Страдание,

    Плач,

    Горькое рыдание.


    А вот имена детей женского пола:


    Ярость,

    Боль,

    Вожделение,

    Стоны,

    Проклятие,

    Горечь,

    Сварливость.


    Они соединились друг с другом, и каждый породил семерых детей; всего получилось [a] сорок девять двуполых демонов.


    Их имена и их воздействия ты найдёшь в Книге Соломона.


    Перед ними же Зоя[b], пребывавшая с Саваофом, сотворила семь добрых двуполых сил. Вот имена мужских: Независтливый, Благословенный, Радостный, Истинный, Неревнивый, Возлюбленный, Верный. А имена женских таковы: Мир, Веселье, Радость, Блаженство, Истина, Любовь, Пистис[c]. От этих сил происходят многие добрые и чистые духи.


    Их воздействия и деяния ты найдёшь в «Устроениях судьбы неба под Двенадцатью»[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В свидетельстве перед словами «сорок девять» отмечен пробел или повреждение рукописи.
    reason: Сохраняет текстологический сигнал пустых квадратных скобок, не нарушая чтение основного текста.
  - marker: b
    text: Зоя — греческое имя, означающее «Жизнь».
    reason: Объясняет значимое имя без замены его переводом в основном тексте.
  - marker: c
    text: Пистис — греческое слово, означающее «вера» или «верность»; здесь оно выступает как имя.
    reason: Сохраняет лексическую и богословскую многозначность имени.
  - marker: d
    text: Название произведения и точный смысл выражения «под Двенадцатью» неясны; перевод предварительный.
    reason: Предупреждает о неопределённости заглавия при отсутствии прямой проверки коптского текста.
lexical_decisions:
- source_word: Primal Parent of Chaos
  choice: Прародитель Хаоса
  rationale: Передаёт первичное родительство без необоснованного уточнения пола и сохраняет мифологический титул.
- source_word: authority / authorities
  choice: власть / власти
  rationale: Сохраняет персонифицированное космологическое значение и не подменяет его более конфессионально окрашенным словом «начало».
- source_word: androgynous
  choice: двуполый
  rationale: Понятное современному читателю обозначение существа, совмещающего мужскую и женскую природу; избегает медицинского оттенка слова «гермафродитный».
- source_word: mixed himself together with his (own) nature
  choice: соединилась со своей собственной природой
  rationale: Сохраняет необычность и неясность исходного выражения, не конкретизируя способ соединения сверх свидетельства.
- source_word: Argumentativeness
  choice: Сварливость
  rationale: Естественное русское имя персонифицированного порока, выражающее склонность к распрям.
- source_word: Zoe
  choice: Зоя
  rationale: Транслитерация имени; его смысл «Жизнь» не подставлен в основной текст, чтобы сохранить статус имени.
- source_word: Pistis
  choice: Пистис
  rationale: Транслитерация сохраняет имя; возможное смысловое значение «Вера» отмечено в сноске.
- source_word: impacts and effects
  choice: воздействия и деяния
  rationale: Сохраняет парность выражения, избегая неестественного буквального повтора близких слов.
theological_decisions:
- issue: Происхождение Смерти из собственной смерти Прародителя
  choice: «породил Смерть из собственной смерти»
  alternative: «породил Смерть из своей мёртвости»
  rationale: Сохранена парадоксальная формулировка свидетеля без догматического истолкования природы Смерти.
- issue: Пол Смерти в русском грамматическом оформлении
  choice: После первого предложения использован женский грамматический род по русскому слову «Смерть»
  alternative: Последовательно употреблять мужской род вслед за английским местоимением he
  rationale: Женский род естественен в русском и не отменяет прямо названной двуполости существа.
- issue: Различение Jealousy и Non-Envying / Non-Jealous One
  choice: Jealousy — «Ревность»; Non-Jealous One — «Независтливый»; Non-Envying One — «Неревнивый»
  alternative: Унифицировать корни как «Зависть / Независтливый» и «Ревность / Неревнивый»
  rationale: Сохранено формальное различие элементов в предоставленном свидетельстве, хотя смысловые поля частично перекрываются.
- issue: Название последней книги
  choice: «Устроения судьбы неба под Двенадцатью»
  alternative: «Устройства рока нижнего неба Двенадцати»
  rationale: Неясный космологический заголовок передан максимально близко и без попытки определить, кто или что подразумевается под Двенадцатью.
translation_notes:
  register: 'Современный литературный русский с достоинством древнего мифологического повествования. Перевод предварительный: предоставлена английская версия, тогда как непосредственная сверка с коптским источником ещё не выполнена. Удалён внедрённый номер рукописной страницы [6]; повреждение перед числом сорок девять отражено сноской. Перечни оформлены ритмично, имена персонифицированных сил даны с прописной буквы.'
