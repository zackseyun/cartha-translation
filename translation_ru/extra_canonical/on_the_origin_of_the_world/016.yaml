base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/016.yaml
  text: 'Eve is the first virgin, the one who bore her first child without a husband. She acted as her own midwife, and because of this she is said to have declared:


    I am the one who is part of my mother,

    and I am the one who is the mother.

    I am the one who is the wife;

    I am the one who is the virgin.

    I am the one who is pregnant;

    I am the one who is the midwife.

    I am the one who eases the pains of childbirth.

    My husband is the one who gave birth to me,

    and I am the one who is his mother,

    and he is the one who is my father and my lord.

    He is the one who is my strength.

    Whatever he wishes, he speaks with reason.

    I am on the way to becoming,

    although I have already given birth to a man as a lord.


    Now these things were revealed, by the will of Sabaoth and his Christ, to the souls that were to enter the shaped forms of the authorities. Concerning these, the holy voice said, “Multiply and flourish; rule over all created beings.” They were the ones who, according to their destinies, were taken captive by the Primal Parent. In this way they were locked inside the prisons of the shaped forms <. . .> until the consummation of the age.'
translation:
  language: ru
  text: 'Ева — первая дева, родившая своего первенца без мужа. Она сама приняла у себя роды, поэтому считается, что она сказала:


    «Я — та, что является частью моей матери,

    и я — та, что является матерью.

    Я — та, что является женой;

    я — та, что является девой.

    Я — та, что беременна;

    я — та, что принимает роды.

    Я — та, что облегчает родовые муки.

    Мой муж — тот, кто родил меня,

    а я — та, что является его матерью,

    и он — тот, кто является моим отцом и моим господином.

    Он — тот, кто является моей силой.

    Чего бы он ни пожелал, он говорит разумно.

    Я нахожусь на пути становления,

    хотя уже родила мужа как господина».[a]


    И вот, по воле Саваофа и его Христа, это было открыто душам, которым предстояло войти в образованные формы властей.[b] О них святой голос сказал: «Множьтесь и процветайте; владычествуйте над всеми сотворёнными существами». Именно их, согласно их уделам, взял в плен Прародитель. Так они были заключены в темницах образованных форм <…>[c] вплоть до завершения века.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В строке «родила мужа как господина» слово, переданное как «мужа», может также означать «мужчину» или «человека»; выражение «как господина» допускает более одного синтаксического оттенка.
    reason: Сохраняет лексическую и синтаксическую неоднозначность английского свидетельства.
  - marker: b
    text: «Образованные формы властей» — вероятно, сформированные вместилища, связанные с космическими властями; перевод не заменяет их прямо словом «тела».
    reason: Предотвращает преждевременное устранение космологической образности.
  - marker: c
    text: Знак <…> обозначает повреждение или утрату текста в рукописной традиции.
    reason: Объясняет сохранённый маркер лакуны.
  - marker: d
    text: «Завершение века» можно также передать как «исполнение эпохи»; речь идёт об эсхатологическом завершении, а не обязательно о физическом уничтожении мира.
    reason: Сохраняет смысловую широту традиционной формулы.
lexical_decisions:
- source_word: first virgin
  choice: первая дева
  rationale: Сохраняет возвышенный и религиозный регистр; «девственница» было бы более бытовым и физиологическим.
- source_word: served as her own midwife
  choice: сама приняла у себя роды
  rationale: Естественно передаёт парадоксальную мысль оригинала без неуклюжего «была собственной повитухой».
- source_word: travail
  choice: родовые муки
  rationale: Сохраняет интенсивность и поэтический оттенок выражения.
- source_word: speaks with reason
  choice: говорит разумно
  rationale: Не устраняет возможную неоднозначность между разумностью речи и речью посредством Разума/Логоса.
- source_word: on the way to becoming
  choice: нахожусь на пути становления
  rationale: Сохраняет философскую незавершённость формулы и не уточняет, кем или чем говорящая становится.
- source_word: shaped forms
  choice: образованные формы
  rationale: Передаёт формы как сформированные или вылепленные вместилища, не сводя их без достаточных оснований просто к телам.
- source_word: authorities
  choice: власти
  rationale: Буквальное космологическое обозначение; написание со строчной буквы избегает навязывания статуса имени собственного.
- source_word: flourish
  choice: процветайте
  rationale: Сохраняет отличие этой формулировки от привычного библейского «наполняйте землю».
- source_word: Primal Parent
  choice: Прародитель
  rationale: Передаёт первичное родительство без внесения пола, которого английское свидетельство здесь не определяет.
- source_word: consummation of the age
  choice: завершение века
  rationale: Сохраняет эсхатологическую формулу и её отличие от более интерпретирующего «конца мира».
theological_decisions:
- issue: Парадокс отношений Евы, мужа, матери и отца
  choice: Сохранить повторяющиеся отождествления и родовые парадоксы буквально
  alternative: Сгладить их в связное генеалогическое объяснение
  rationale: Текст намеренно удерживает взаимно пересекающиеся образы рождения, супружества и родительства; их нельзя разрешать догматически.
- issue: Значение «man» в строке о рождении
  choice: «мужа»
  alternative: «человека» или «мужчину»
  rationale: Контекст связывает рождённого с господством и супружеской фигурой, однако возможная широта значения отмечена в сноске.
- issue: Статус Саваофа и его Христа
  choice: Передать без поясняющего отождествления с иными божественными фигурами
  alternative: Добавить конфессиональное или космологическое толкование
  rationale: Отрывок называет фигуры, но не даёт достаточных оснований для их дальнейшей идентификации.
- issue: Пленение душ и их уделы
  choice: «согласно их уделам»
  alternative: «по предопределению»
  rationale: Так сохраняется напряжение между назначенной долей, судьбой и возможным предопределением без навязывания одной системы.
- issue: Формы как темницы
  choice: Сохранить метафору буквально
  alternative: Истолковать формы прямо как физические тела
  rationale: Хотя телесное прочтение вероятно, свидетельство говорит о «формах»; перевод не должен устранять эту образность.
translation_notes:
  register: 'Современный литературный русский язык с достоинством и умеренно возвышенным ритмом. Анафорическое «Я — та» сохранено ради гимнической структуры. Перевод предварительный: предоставлена английская версия-свидетельство, а прямая сверка с коптским текстом ещё не выполнена.'
