base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/013.yaml
  text: 'The primal Psyche loved Eros, who lived with her, and poured her blood over him and over the earth. From that blood, the first rose sprouted from the earth, emerging from the thorn bush as a source of gladness for the light that was to appear from within the bush.


    In addition, after this, lovely flowers with pleasant fragrances sprouted from the earth in different varieties. They came from each of the virgin daughters of Pronoia, and when the daughters fell in love with Eros, they poured out their blood over him and over the earth.


    After these, all the plants sprouted from the earth in different varieties, bearing within themselves the seed of the authorities and their angels.


    After these, the authorities created different varieties of animal species from the waters, including reptiles and birds, bearing within themselves the seed of the authorities and their angels.


    However, before all these, when he appeared on the first day, he remained on earth for about two days. Then he departed from the lower Pronoia in heaven and ascended toward his light. Immediately, darkness obscured the entire cosmos.'
translation:
  language: ru
  text: 'Изначальная Психея полюбила Эроса, который пребывал с ней, и пролила свою кровь на него и на землю. Из этой крови из земли проросла первая роза: она вышла из тернового куста и стала источником радости для света, которому предстояло явиться изнутри этого куста.


    Затем из земли проросли прекрасные благоуханные цветы, различные по виду, — от каждой из девственных дочерей Пронойи. Полюбив Эроса, они пролили свою кровь на него и на землю.


    После них из земли проросли всевозможные растения, несущие в себе семя властей и их ангелов.


    После них власти создали из вод различные виды животных, в том числе пресмыкающихся и птиц, несущих в себе семя властей и их ангелов.


    Однако прежде всего этого, явившись в первый день, он пробыл на земле около двух дней, затем покинул нижнюю Пронойю на небе и восшел к своему свету. И тотчас тьма окутала весь космос.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Референт местоимения «он» в последнем абзаце в доступном английском свидетеле не назван; хронологическое сочетание «в первый день» и «около двух дней» также передано без сглаживания. Перевод предварительный: прямая сверка с коптским текстом еще не проведена.'
    reason: Необходимо обозначить подлинную неоднозначность свидетеля и ограничение источниковой базы.
lexical_decisions:
- source_word: Psyche
  choice: Психея
  rationale: Сохранено греческое мифологико-космологическое имя в укоренившейся русской форме, а не переведено как «душа», чтобы не устранить возможную персонификацию.
- source_word: Eros
  choice: Эрос
  rationale: Сохранено имя персонифицированного Эроса, а не абстрактное «любовь».
- source_word: Pronoia
  choice: Пронойя
  rationale: Термин передан транслитерацией как имя персонифицированного Промысла; это сохраняет специфику космологии текста.
- source_word: authorities
  choice: власти
  rationale: Выбрано буквальное и традиционно понятное обозначение космических сил; нейтральнее, чем интерпретирующие варианты «архонты» или «правители».
- source_word: cosmos
  choice: космос
  rationale: Сохранен космологический термин, который в данном сочинении может означать упорядоченную мировую целостность, а не только землю или вселенную в современном смысле.
- source_word: reptiles
  choice: пресмыкающиеся
  rationale: Естественный современный русский эквивалент, достаточно широкий для переданного английским свидетелем класса существ.
- source_word: thorn bush
  choice: терновый куст
  rationale: Передает конкретный образ колючего куста и сохраняет повтор слова «куст» в последующей фразе.
theological_decisions:
- issue: Неясный референт местоимения «he» в последнем абзаце
  choice: Сохранено местоимение «он» без названного референта
  alternative: Назвать Эроса или иное действующее лицо
  rationale: Свидетель не устанавливает референт однозначно; уточнение внесло бы интерпретацию в основной текст.
- issue: Статус Психеи, Эроса и Пронойи
  choice: Имена сохранены как персонифицированные фигуры
  alternative: Перевести как «Душа», «Любовь» и «Промысел»
  rationale: Транслитерация не сводит космологических персонажей к абстрактным понятиям и сохраняет напряжение между именем и понятием.
- issue: «Семя властей и их ангелов»
  choice: Образ сохранен буквально
  alternative: Истолковать как сущность, природу или потомство властей
  rationale: Буквальный образ допускает несколько космогонических прочтений и не разрешает их искусственно.
- issue: 'Хронологическое напряжение: «в первый день» и «около двух дней»'
  choice: Обе временные формулы сохранены
  alternative: Сгладить последовательность или заменить на неопределенное время
  rationale: Возможная текстовая или концептуальная трудность принадлежит источнику и не должна молча исправляться.
- issue: «Нижняя Пронойя на небе»
  choice: Сохранено пространственно-космологическое сочетание
  alternative: Перефразировать как «нижняя область Пронойи»
  rationale: Перефразирование могло бы преждевременно решить, обозначает ли Пронойя личность, силу или область.
translation_notes:
  register: Современный литературный русский язык с достоинством, соответствующим древнему космогоническому повествованию. Синтаксис умеренно формальный, но доступный. Повторы последовательности «после них» сохранены как композиционный прием. Проект основан на предоставленном общедоступном английском свидетеле; проверка по коптскому оригиналу ожидается.
