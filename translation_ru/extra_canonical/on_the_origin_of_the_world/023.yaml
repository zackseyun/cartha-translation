base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/023.yaml
  text: 'So, when Sophia Zoe saw the archons of darkness placing a curse on her companions, she became furious. Leaving the first heaven with full power, she pursued those archons, drove them out of [their] heavens, and threw them down into the world of transgression, making them dwell there as wicked demons on the earth.


    [She sent out a bird], [] which would spend its thousand years in Paradise in their world—a living creature endowed with soul, called the “phoenix.” It kills itself and comes back to life in order to bear witness to the judgment (decreed) against them, because they mistreated Adam and his race, even to the consummation of the age.


    There are three kinds of men, along with their descendants, until the consummation of the world: those endowed with spirit, those endowed with soul, and the earthly. Similarly, there are three phoenixes <inside> Paradise: the first is deathless, and the second lives for 1,000 years. Concerning the third, it is written in the sacred Scripture that it is consumed. Similarly, there are also three baptisms: the first is spiritual, the second is with fire, and the third is with water.


    Just as the phoenix symbolizes the angels, so also does the water hydri in Egypt symbolize those who descend into the baptism of a true man.


    The two bulls in Egypt have a symbolic meaning, [14] namely, the sun and the moon. This is a symbol of Sabaoth, because Sophia obtained the universe from the day she fashioned the sun and the moon, placing a seal on her heaven until the age ends.


    The worm born from the phoenix also symbolizes a human being, concerning whom it is written, “The just man will blossom like a phoenix,” [15] and the phoenix first appears alive, then dies and rises again, serving as a symbol of what will happen at the consummation of the age.


    These powerful symbols appeared only in Egypt and nowhere else, to indicate [] that it resembles the Paradise of God.'
translation:
  language: ru
  text: 'Когда София-Жизнь[a] увидела, что архонты тьмы проклинают её соратников, она пришла в ярость. Покинув первое небо во всей полноте власти, она погналась за этими архонтами, изгнала их из [их] небес и низвергла в мир преступления, чтобы они обитали там на земле в облике злых демонов.


    [Она послала птицу] [текст утрачен][b], которая в их мире проводит свою тысячу лет в Раю, — одушевлённое живое существо, называемое «фениксом». Она сама себя умерщвляет и вновь оживает, чтобы свидетельствовать о суде, вынесенном над ними за то, что они дурно обращались с Адамом и его родом, — вплоть до завершения века.


    До завершения мира существуют три рода людей вместе с их потомками: наделённые духом, наделённые душой и земные. Подобным образом, в Раю есть три феникса: первый бессмертен, второй живёт тысячу лет, а о третьем в священном Писании сказано, что он сгорает. Подобным образом есть и три крещения: первое — духовное, второе — огнём, третье — водой.


    Как феникс служит образом ангелов, так и египетская «водяная гидри»[c] служит образом тех, кто нисходит в крещение истинного человека.


    Два египетских быка имеют символическое значение: они означают солнце и луну. Это — символ Саваофа, поскольку София обрела вселенную с того дня, когда сотворила солнце и луну и наложила печать на своё небо до завершения века.


    Червь, рождающийся из феникса, также служит образом человека, о котором написано: «Праведник расцветёт, как феникс»[d]. Феникс сначала является живым, затем умирает и воскресает, служа образом того, что произойдёт при завершении века.


    Эти могущественные знамения явились только в Египте и нигде более, чтобы показать [текст утрачен][e], что он подобен Божьему Раю.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Буквально имя-титул означает «София (Мудрость) — Жизнь»; его также можно передать как «София Зоя».
    reason: Поясняет смысл составного имени без устранения его именного характера.
  - marker: b
    text: В рукописном свидетельстве перед этим описанием имеется повреждение текста; восстановление «Она послала птицу» предположительно.
    reason: Отмечает редакционное восстановление и лакуну, которые нельзя выдавать за бесспорно сохранившийся текст.
  - marker: c
    text: Выражение, переданное как «водяная гидри», неясно; возможное обозначение животного или иного египетского образа остаётся неопределённым.
    reason: Предупреждает читателя о лексической неуверенности и избегает неподтверждённой идентификации.
  - marker: d
    text: 'Ср. Пс. 91:13 по греческой традиции (в обычной русской передаче — «Праведник цветёт, как пальма»): греческое слово phoinix может обозначать и пальму, и феникса, что позволяет автору трактата построить такое толкование.'
    reason: Объясняет цитатную игру слов, без которой упоминание феникса выглядит как прямой текст Псалтири.
  - marker: e
    text: В этом месте текст повреждён, поэтому точная связь заключительных слов неясна; местоимение «он», вероятнее всего, относится к Египту.
    reason: Сохраняет лакуну и указывает на реальную синтаксическую неоднозначность.
lexical_decisions:
- source_word: Sophia Zoe
  choice: София-Жизнь
  rationale: Передаёт составное имя и смысл греческого Zoe («жизнь»), не сводя Софию к отвлечённому понятию.
- source_word: archons
  choice: архонты
  rationale: Сохраняет устойчивый термин данного космологического текста; замена на «властители» могла бы скрыть его специальное значение.
- source_word: plenary power
  choice: во всей полноте власти
  rationale: Естественно по-русски передаёт полноту полномочия и силы, не уточняя её источник.
- source_word: those imbued with spirit / soul, and the earthly
  choice: наделённые духом, наделённые душой и земные
  rationale: Сохраняет трёхчастное различение текста и параллелизм, не навязывая позднейшую конфессиональную классификацию.
- source_word: water hydri
  choice: «водяная гидри»
  rationale: Неясный термин оставлен в осторожной транслитерации, поскольку его уверенное отождествление с гидрой, гидрией или животным было бы спекулятивным.
- source_word: consummation of the age
  choice: завершение века
  rationale: Сохраняет эсхатологическую формулу и её отличие от «завершения мира», встречающегося рядом.
- source_word: powerful symbols
  choice: могущественные знамения
  rationale: Учитывает, что речь идёт не только об отвлечённых символах, но и о явившихся знаках; формулировка сохраняет необычную силу исходного выражения.
theological_decisions:
- issue: Статус трёх родов людей
  choice: Сформулировано как утверждение самого трактата без дальнейшего догматического пояснения
  alternative: Истолковать их как фиксированные классы спасаемых и погибающих
  rationale: Отрывок перечисляет категории, но здесь не раскрывает полностью их судьбу; перевод не должен разрешать эту напряжённость за текст.
- issue: Самоумерщвление и оживление феникса
  choice: «сама себя умерщвляет и вновь оживает»
  alternative: «умирает и воскресает»
  rationale: Первое предложение прямо сообщает о добровольном причинении себе смерти; это необычное утверждение сохранено, тогда как далее передана отдельная формула смерти и воскресения.
- issue: Связь солнца, луны, Саваофа и Софии
  choice: Синтаксическая связь сохранена без богословской гармонизации
  alternative: Перестроить фразу так, чтобы однозначно определить, что именно символизирует Саваофа и кому принадлежит вселенная
  rationale: Свидетель допускает неясность в отношениях между символом, Саваофом и властью Софии; уверенное прояснение превысило бы данные.
- issue: «Крещение истинного человека»
  choice: Сохранён родительный оборот «крещение истинного человека»
  alternative: «крещение, совершаемое истинным человеком» или «крещение в истинного Человека»
  rationale: Исходная формула допускает разные отношения; перевод сохраняет неоднозначность.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего религиозно-философского трактата. Специальные термины («архонты», «Саваоф») сохранены, а тяжёлые кальки по возможности заменены ясными русскими конструкциями. Квадратные скобки внутри текста отмечают редакционные восстановления или утраты рукописи; буквенные маркеры отсылают к примечаниям. Поскольку прямой разбор коптского источника ещё не выполнен, черновик осторожно следует представленному публичному английскому свидетельству и явно отмечает его неясности.
