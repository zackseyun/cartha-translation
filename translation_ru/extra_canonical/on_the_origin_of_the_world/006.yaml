    text: В рукописном свидетельстве в этом месте отмечен пропуск; его объём и содержание неизвестны.
    reason: Явно обозначить лакуну, присутствующую в исходном свидетельстве.
  - marker: c
    text: 'Так в свидетельстве: после шестидесяти четырёх образов и семи архангелов Саваоф назван восьмым, а итог указан как семьдесят два. Способ подсчёта в тексте не разъяснён.'
    reason: Сохранить арифметическое напряжение текста, не исправляя его молча.
lexical_decisions:
- source_word: Pistis / Pistis Sophia
  choice: Пистис / Пистис София
  rationale: Имена переданы транслитерацией, а не переведены как «Вера» и «Вера-Премудрость», чтобы сохранить их функцию собственных имён в космологии трактата.
- source_word: Sabaoth / Yaldabaoth
  choice: Саваоф / Иалдаваоф
  rationale: Использованы устоявшиеся русские формы имён, узнаваемые в библейской и русскоязычной гностической традиции.
- source_word: deathless man
  choice: бессмертный человек
  rationale: Естественная русская передача, сохраняющая антропологический титул без дополнительного истолкования.
- source_word: hosts of Chaos
  choice: воинства Хаоса
  rationale: «Воинства» сохраняет военный и космический смысл слова hosts и поддерживает последующий титул «Господь Воинств».
- source_word: authorities
  choice: власти
  rationale: Сохранён технический космологический термин без замены на более конфессионально окрашенное «начала».
- source_word: Primal Parent
  choice: Прародитель
  rationale: Кратко передаёт родительский и первичный смысл титула, не определяя пол существа сверх данных свидетельства.
- source_word: Zoe
  choice: Зои
  rationale: Передано как собственное имя; перевод «Жизнь» мог бы устранить намеренную двойственность имени и понятия.
- source_word: Cherubin / Seraphin
  choice: Херувим / Серафим
  rationale: Сохранены формы единственного числа, которыми в тексте названы колесница и класс ангелов; они не нормализованы во множественное «херувимы/серафимы».
- source_word: four-faced chariot
  choice: четырёхликая колесница
  rationale: Сохранён буквальный образ четырёх лиц, важный для последующего перечисления форм.
theological_decisions:
- issue: Титул “Lord of Hosts”
  choice: «Господь Воинств»
  alternative: «Господь Саваоф»
  rationale: Выбран смысловой перевод титула, чтобы читатель видел его связь с властью над воинствами Хаоса; имя Саваоф при этом остаётся собственным именем персонажа.
- issue: Отношение Саваофа к отцу
  choice: «отверг» и «в осуждение»
  alternative: «осудил» в обоих случаях
  rationale: 'Разные русские слова позволяют сохранить возможный диапазон английского denounce: публичное отречение/обличение и знак осуждения, не сводя оба употребления к одной догматической формуле.'
- issue: repentance
  choice: раскаяние
  alternative: покаяние
  rationale: «Раскаяние» здесь яснее обозначает перемену отношения персонажа и меньше вносит позднейшую церковно-сакраментальную окраску.
- issue: kingdom that is over everyone
  choice: царство, которое превыше всех
  alternative: царство над всеми
  rationale: 'Сохранена пространственно-властная двусмысленность: царство одновременно находится выше и обладает превосходством.'
- issue: Мысль Прародителя как сестра
  choice: сохранено буквально
  alternative: объяснить через гностическую генеалогию
  rationale: Не добавлено толкование, которого нет в данном отрывке; необычная родственная связь сохранена как элемент его собственной космологии.
translation_notes:
  register: Современный литературный русский с достоинством древнего космологического повествования. Синтаксис упрощён там, где английское свидетельство перегружено сочинением, но повторения и технические образы сохранены. Проект остаётся предварительным, поскольку прямая сверка с коптским текстом ещё не проведена; перевод выполнен по предоставленному публичному английскому свидетельству с осторожным сохранением лакун и неоднозначностей.
