base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/003.yaml
  text: 'When the archon saw his size—though he saw no one but himself, since he could see nothing beyond water and darkness—he imagined that he was the only one who existed. His [. . .] was completed through verbal articulation, which [] manifested itself as a spirit moving back and forth over the waters. When that spirit had appeared, the archon separated the watery substance, and the dry substance was set apart in another place. From matter he fashioned a dwelling place for himself and called it “Heaven.” From matter the archon also fashioned a footstool and called it “Earth.”


    Then a thought occurred to the archon, in agreement with his nature, and through verbal articulation he created an androgyne. He opened his mouth and made a cooing sound to him. When his eyes opened, he looked at his father and made the sound “eee!” His father then named him “Eee-a-o.” [1]


    Then he created the second son, making a cooing sound to him. When the son opened his eyes, he made the sound “eh!” to his father. His father named him “Eloai.”


    Then he created the third son, making a cooing sound to him. When the son opened his eyes, he made the sound “asss!” to his father. His father named him “Astaphaios.”


    These three are the sons of their father.'
translation:
  language: ru
  text: 'Когда архонт увидел собственную величину — хотя никого, кроме себя, он не видел, поскольку дальше воды и тьмы ничего разглядеть не мог, — он вообразил, что существует лишь он один. Его […] завершилось посредством произнесённого слова, которое […] явилось как дух, движущийся над водами. Когда этот дух явился, архонт отделил водную стихию, а суша была отведена в другое место. Из материи он устроил себе обиталище и назвал его «Небом». Из материи архонт устроил также подножие и назвал его «Землёй».


    Затем у архонта возникла мысль, созвучная его природе, и посредством произнесённого слова он создал двуполое существо[a]. Он открыл рот и издал, обращаясь к нему, воркующий звук. Когда у того открылись глаза, он взглянул на своего отца и произнёс: «И-и-и!» Тогда отец назвал его «Ии-а-о»[b].


    Затем он создал второго сына и издал, обращаясь к нему, воркующий звук. Когда тот открыл глаза, он произнёс, обращаясь к отцу: «Э!» Отец назвал его «Элоай».


    Затем он создал третьего сына и издал, обращаясь к нему, воркующий звук. Когда тот открыл глаза, он произнёс, обращаясь к отцу: «Ас-с-с!» Отец назвал его «Астафайос».


    Эти трое — сыновья своего отца.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «андрогина», то есть существо, соединяющее мужское и женское начала.'
    reason: Поясняет древний термин современному читателю, не разрешая его космологический смысл.
  - marker: b
    text: Имя передаёт последовательность звуков, произнесённых сыном. Написание условно; в рукописной передаче встречаются варианты.
    reason: В предоставленном свидетеле стоял маркер [1] без текста примечания; новая сноска объясняет звуковую этимологию и отмечает текстологическую неуверенность.
lexical_decisions:
- source_word: archon
  choice: архонт
  rationale: Сохранён устойчивый термин для властителя в гностических текстах; замена на «правитель» могла бы стереть специфический характер персонажа.
- source_word: verbal articulation
  choice: посредством произнесённого слова
  rationale: Передаёт творческое действие через членораздельное произнесение естественнее, чем буквальное «словесная артикуляция», не отождествляя выражение с богословским термином «Слово».
- source_word: spirit
  choice: дух
  rationale: Сохраняет многозначность исходного понятия — дух, дыхание или ветер — без преждевременного уточнения.
- source_word: aqueous substance
  choice: водная стихия
  rationale: Достоинный и понятный русский эквивалент, сохраняющий представление о первичной водной массе.
- source_word: footstool
  choice: подножие
  rationale: Сохраняет космологический и библейский образ земли как подножия.
- source_word: androgyne
  choice: двуполое существо
  rationale: Понятно современному читателю и не сводит древнее космогоническое существо к современной идентичности; термин отмечен сноской.
- source_word: cooing sound
  choice: воркующий звук
  rationale: Передаёт неартикулированный мягкий голосовой звук без добавления отсутствующих деталей.
- source_word: Eee-a-o / Eloai / Astaphaios
  choice: Ии-а-о / Элоай / Астафайос
  rationale: Имена транслитерированы по звучанию данного свидетеля; связь первого имени с предшествующим возгласом сохранена.
theological_decisions:
- issue: Дух над водами и возможная аллюзия на Бытие 1:2
  choice: «дух, движущийся над водами»
  alternative: «ветер, носившийся над водами»
  rationale: Сохранена богословская и лексическая неоднозначность образа; текст не идентифицирует этот дух с Духом Божьим.
- issue: Статус творения архонта
  choice: Последовательно использованы «устроил/создал» в соответствии с формулировками свидетеля
  alternative: Везде использовать «сотворил»
  rationale: Различение между созданием сыновей посредством речи и устройством неба и земли из уже существующей материи сохраняет внутреннее напряжение текста.
- issue: Пол созданного существа при последующем мужском местоимении
  choice: «двуполое существо», далее мужское местоимение согласно повествованию
  alternative: «андрогин» или нейтральные местоименные конструкции
  rationale: Сохранены и двуполость существа, и последующая грамматическая/повествовательная мужская отнесённость без попытки устранить напряжение.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным космогоническим регистром. Повторы сохранены там, где они образуют повествовательный ритм. Лакуны переданы квадратными скобками с многоточием. Проект основан на предоставленном англоязычном публичном свидетеле; прямая сверка с коптским текстом ещё требуется.
