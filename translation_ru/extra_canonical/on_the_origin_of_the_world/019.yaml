base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/019.yaml
  text: 'Then it was reported to the authorities that the form they had shaped was alive and had stood up, and they were deeply disturbed. They sent seven archangels to learn what had happened.


    They approached Adam. When they saw Eve speaking with him, they said to one another, “What kind of being is this radiant woman? She is like that likeness which appeared to us within the light. Come, let us seize her and cast our seed into her, so that when she is defiled, she will be unable to ascend into her light. Instead, those to whom she gives birth will be under our command. But let us not tell Adam, because he is not one of us. Instead, let us put him into a deep sleep, and while he sleeps, let us teach him that she came from his rib, so that his wife will obey him and he will be lord over her.”


    Because she was a force, Eve laughed at their decision. She made a mist enter their eyes and secretly left her likeness with Adam.


    She entered the tree of knowledge and remained there. They chased after her, and she revealed to them that she had entered the tree and had become a tree. Then the blind beings fell into great fear and fled.


    After they had shaken off their stupor, they approached Adam. When they saw the likeness of this woman [] with him, they were deeply troubled, believing that she was the actual Eve, and they acted impulsively. They approached her, seized her, and cast their seed upon her.


    They did this in wickedness, defiling her by natural and obscene means. First they defiled the seal of her voice, [13] which had spoken with them, saying, “What existed before you?” In this way, they meant to defile, at the consummation (of the age), those who might declare through verbal expression that they were born of the true man. They went astray, unaware that they had defiled their own body, since it was the likeness that the authorities and their angels defiled by every means.'
translation:
  language: ru
  text: 'Тогда властям донесли, что созданный ими образ ожил и поднялся, и они пришли в глубокое смятение. Они послали семь архангелов узнать, что произошло.


    Они подошли к Адаму. Увидев, что Ева разговаривает с ним, они сказали друг другу: «Что это за существо — эта сияющая женщина? Ведь она подобна тому образу, который явился нам внутри света. Давайте схватим её и изольём в неё наше семя, чтобы, осквернившись, она уже не смогла подняться в свой свет. Тогда те, кого она родит, будут в нашей власти. Но не станем говорить об этом Адаму, потому что он не из нас. Лучше погрузим его в глубокий сон и, пока он спит, внушим ему, что она произошла из его ребра, чтобы жена повиновалась ему, а он господствовал над ней».


    Но Ева была силой и потому рассмеялась над их замыслом. Она напустила туман им на глаза и тайно оставила у Адама свой образ.


    Она вошла в дерево познания и осталась там. Они погнались за ней, и она открыла им, что вошла в дерево и стала деревом. Тогда слепые существа объял великий страх, и они бежали.


    Позднее, придя в себя после оцепенения, они подошли к Адаму. Увидев рядом с ним образ этой женщины [a], они пришли в глубокое смятение: они решили, что перед ними сама Ева, и поступили безрассудно. Они приблизились к ней, схватили её и излили на неё своё семя.


    Они совершили это со злобой, оскверняя её естественными и постыдными способами. Прежде всего они осквернили печать её голоса — того голоса, который говорил с ними: «Что существовало прежде вас?» Так они намеревались при завершении века осквернить тех, кто посредством словесного изречения мог бы объявить, что рождён от истинного человека.[b] Но они заблуждались, не ведая, что осквернили собственное тело, ибо именно образ власти и их ангелы осквернили всеми способами.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В предоставленном текстовом свидетельстве после слов «этой женщины» отмечена лакуна или место неуверенного восстановления; утраченный текст не восполняется.
    reason: Сохраняет сигнал о повреждении рукописного текста, заменяя немую пару пустых скобок понятной читателю сноской.
  - marker: b
    text: 'Синтаксис этого места труден: выражение «при завершении века» и связь между осквернением, словесным изречением и рождением от истинного человека допускают иное членение.'
    reason: Предупреждает читателя о подлинной текстовой неоднозначности и не выдаёт выбранное членение за несомненное.
lexical_decisions:
- source_word: authorities
  choice: власти
  rationale: Передаёт обозначение космических правителей без внесения специального термина «архонты», которого в предоставленном свидетельстве здесь нет.
- source_word: shaped form / likeness
  choice: созданный ими образ / образ
  rationale: Сохраняет связь между ожившей сформированной фигурой и оставленным Евой подобием, не отождествляя их сильнее, чем позволяет свидетельство.
- source_word: force
  choice: сила
  rationale: Буквальное и контекстуально значимое обозначение природы Евы; замена на «могущественная» ослабила бы возможный космологический смысл.
- source_word: tree of knowledge
  choice: дерево познания
  rationale: Естественная русская библейская формулировка, сохраняющая связь повествования с мотивом Бытия.
- source_word: seal of her voice
  choice: печать её голоса
  rationale: Необычный образ сохранён буквально, поскольку его смысл неясен и его не следует истолковывать внутри перевода.
- source_word: true man
  choice: истинный человек
  rationale: Сохраняет формулировку источника и её антропологическую напряжённость без догматического уточнения.
- source_word: verbal articulation
  choice: словесное изречение
  rationale: Передаёт действие выражения или провозглашения посредством речи, не сводя его к обычному разговору.
theological_decisions:
- issue: Происхождение Евы из ребра Адама
  choice: Представлено как внушение властей спящему Адаму
  alternative: Изложить это как объективное происхождение Евы
  rationale: В данном произведении это утверждение вложено в уста властей как часть их замысла; перевод сохраняет повествовательную перспективу, не согласуя её искусственно с иными текстами.
- issue: Статус оставленного Евой образа
  choice: Сохранено различие между самой Евой и её образом
  alternative: Назвать образ телом или двойником Евы
  rationale: Свидетельство последовательно противопоставляет Еву её likeness; более конкретное определение было бы толкованием.
- issue: Смысл осквернения «собственного тела» властей
  choice: Сохранена парадоксальная формулировка без объяснения
  alternative: Уточнить, чьим именно телом являлся образ и каким образом
  rationale: Заключительная фраза богословски и синтаксически напряжённа; предоставленное свидетельство не даёт оснований однозначно разрешить её.
- issue: «При завершении века» и связь с последующей фразой
  choice: Отнесено к намерению осквернить будущих исповедующих
  alternative: Связать выражение с самим словесным провозглашением или иным элементом фразы
  rationale: Это наиболее связное чтение предоставленного английского свидетельства, однако неоднозначность отмечена в сноске.
translation_notes:
  register: Современный литературный русский язык с достоинством и ясностью; сохранены резкие и необычные образы трактата. Сексуальное насилие передано прямо, но без добавочной натуралистичности. Черновик основан на предоставленном публичнодоступном английском свидетельстве; прямая сверка с коптским текстом ещё требуется. Рукописный номер страницы [13] как часть основного текста не воспроизводится, поскольку это не смысловой элемент произведения.
