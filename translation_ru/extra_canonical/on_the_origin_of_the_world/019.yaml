  naturalness: Регистр современный литературный и в целом естественный. Небольшая правка заключительного периода необходима для грамматической завершённости и ясной, но не чрезмерно интерпретирующей передачи трудного референта.
  terminology: «Власти», «образ», «сила», «дерево познания», «печать её голоса» и «истинный человек» сохранены удачно. Не следует заменять «власти» на «архонтов» без основания в заданном свидетельстве.
  issues:
  - severity: medium
    issue: 'Заключительное предложение грамматически и смыслово сбоит: «ибо именно образ власти и их ангелы осквернили всеми способами».'
    rationale: В данной конструкции «образ» оказывается прямым дополнением без относительного слова, а связь с предшествующим «собственное тело» не выражена. Английское свидетельство сообщает, что они не знали, что осквернили собственное тело, поскольку им был образ, который власти и их ангелы осквернили всеми способами. Русский текст должен сохранить эту напряжённую связь, не решая спорный вопрос, чьё именно тело имеется в виду.
  revised_text: 'Тогда властям донесли, что созданный ими образ ожил и поднялся, и они пришли в глубокое смятение. Они послали семь архангелов узнать, что произошло.



    Они подошли к Адаму. Увидев, что Ева разговаривает с ним, они сказали друг другу: «Что это за существо — эта сияющая женщина? Ведь она подобна тому образу, который явился нам внутри света. Давайте схватим её и изольём в неё наше семя, чтобы, осквернившись, она уже не смогла подняться в свой свет. Тогда те, кого она родит, будут в нашей власти. Но не станем говорить об этом Адаму, потому что он не из нас. Лучше погрузим его в глубокий сон и, пока он спит, внушим ему, что она произошла из его ребра, чтобы жена повиновалась ему, а он господствовал над ней».



    Но Ева была силой и потому рассмеялась над их замыслом. Она напустила туман им на глаза и тайно оставила у Адама свой образ.



    Она вошла в дерево познания и осталась там. Они погнались за ней, и она открыла им, что вошла в дерево и стала деревом. Тогда слепые существа объял великий страх, и они бежали.



    Позднее, придя в себя после оцепенения, они подошли к Адаму. Увидев рядом с ним образ этой женщины [a], они пришли в глубокое смятение: они решили, что перед ними сама Ева, и поступили безрассудно. Они приблизились к ней, схватили её и излили на неё своё семя.



    Они совершили это со злобой, оскверняя её естественными и постыдными способами. Прежде всего они осквернили печать её голоса — того голоса, который говорил с ними: «Что существовало прежде вас?» Так они намеревались при завершении века осквернить тех, кто посредством словесного изречения мог бы объявить, что рождён от истинного человека.[b] Но они заблуждались, не ведая, что осквернили собственное тело, которым был образ, осквернённый властями и их ангелами всеми способами.'
