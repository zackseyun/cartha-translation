    When all the perfect ones appeared in the forms shaped by the archons, and when they revealed the truth beyond compare, they humiliated all the wisdom of the gods, and their fate was found to be a censure, and their host withered away. Their lordship dissipated. Their forethought became nothing, together with their glory.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/026.yaml
  text: 'The all-surpassing Logos was sent for this reason alone: so that he could announce the unknown. He said, “Nothing hidden remains unrevealed, and what is unknown will become known.” And these were sent to make known what is hidden, including the seven authorities of Chaos and their impiety. In this way, they were sentenced to death.


    When all the perfect ones appeared in the forms shaped by the archons, and when they revealed the incomparable truth, they humiliated all the wisdom of the gods. Their fate was found to be a censure, and their host withered away. Their dominion dissolved. Their forethought came to nothing, along with their glory.'
translation:
  language: ru
  text: 'Всепревосходящий Логос был послан лишь для того, чтобы возвестить неведомое. Он сказал: «Нет ничего сокрытого, что не было бы открыто, и неведомое станет известным». И эти были посланы, чтобы сделать известным сокрытое — в том числе семь властей Хаоса и их нечестие. Так они были приговорены к смерти.


    Когда все совершенные явились в обликах, созданных архонтами, и открыли несравненную истину, они посрамили всю мудрость богов. Их судьба оказалась осуждением, и их воинство иссохло. Их владычество рассеялось. Их замысел вместе с их славой обратился в ничто.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: all-superior Logos
  choice: Всепревосходящий Логос
  rationale: Сохранён титул «Логос» и необычная превосходная характеристика; форма передаёт возвышенный смысл, не сводя его к более привычному «всевышний».
- source_word: unknown
  choice: неведомое
  rationale: Субстантивированное прилагательное сохраняет абстрактный и таинственный характер обозначения.
- source_word: authorities of Chaos
  choice: власти Хаоса
  rationale: «Власти» передаёт обозначение сверхъестественных сил или правителей без преждевременного уточнения их природы; «Хаос» сохранён как космологическое имя.
- source_word: archons
  choice: архонты
  rationale: Технический термин сохранён транслитерацией, поскольку «правители» могло бы скрыть его специфическое значение в тексте.
- source_word: forms shaped
  choice: обликах, созданных
  rationale: Естественная русская формулировка, сохраняющая идею форм, которым архонты придали вид.
- source_word: host
  choice: воинство
  rationale: Передаёт организованное множество сил и соответствует возвышенному регистру.
- source_word: lordship
  choice: владычество
  rationale: Сохраняет значение господства или властного правления, а не только территории власти.
- source_word: forethought
  choice: замысел
  rationale: В данном контексте естественно обозначает предусмотренный план; более буквальное «предвидение» возможно, но менее ясно связано с крахом деятельности властей.
theological_decisions:
- issue: Неясный референт множественного «these were dispatched»
  choice: «эти были посланы»
  alternative: Уточнить субъект как «совершенные» или иные существа
  rationale: Свидетель не устанавливает референт однозначно; намеренно сохранена грамматическая неопределённость без внесения толкования.
- issue: Отнесение смертного приговора
  choice: «Так они были приговорены к смерти»
  alternative: Явно назвать семь властей Хаоса
  rationale: Местоименная связь в свидетельстве допускает контекстуальное понимание, но явное именование сузило бы сохраняемую исходным текстом неоднозначность.
- issue: «Perfect ones» как группа существ
  choice: «все совершенные»
  alternative: «все совершенные существа» или «все достигшие совершенства»
  rationale: Краткая субстантивированная форма сохраняет терминологическую открытость и не определяет природу или путь этой группы.
- issue: «Their fate was found to be a censure»
  choice: «Их судьба оказалась осуждением»
  alternative: «Их участь была признана укором»
  rationale: Передана судебно-оценочная напряжённость выражения без попытки объяснить, кто именно вынес оценку.
translation_notes:
  register: Современный литературный русский язык с возвышенным, но доступным регистром. Технические космологические термины «Логос», «архонты» и «Хаос» сохранены. Поскольку прямая сверка с коптским источником ещё не выполнена, проект следует считать предварительным переводом по предоставленному публичному английскому свидетельству.
