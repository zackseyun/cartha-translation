review_pass:
  verdict: revise
  source_fidelity: 'Сверка возможна только с предоставленным англоязычным свидетельством; прямой коптский контроль обозначен как ожидающий. Существенная проблема в черновике — местоимение «она» после «эта тень»: по логике свидетельства предшествующей Хаосу названа именно «сотворённая сущность» (ср. «the latter ... subsequent to the former created entity»), а не тень. Исправление снимает русскую анафорическую двусмысленность и восстанавливает последовательность аргумента.'
  naturalness: Стиль в целом современный литературный и соответствует трактатному вступлению. «Разновидность тьмы» точнее передаёт «a type of darkness», чем разговорно-неопределённое «некую тьму».
  terminology: «Хаос», «космические боги», «корень», «тень», «Тьма» и «сотворённая сущность» переданы последовательно. Кавычки у имени «Тьма» сохранены. Пустые квадратные скобки сохранены на обоих местах как сигналы лакуны/повреждения.
  issues:
  - severity: medium
    issue: Неясный и, вероятно, неверный референт местоимения «она» в третьем предложении второго абзаца.
    rationale: 'В русском «она» непосредственно отсылает к «тени», однако свидетельство противопоставляет Хаос «сотворённой сущности»: Хаос возник после этой сущности. Явное повторение существительного необходимо для точности.'
  - severity: low
    issue: «Некая тьма» недостаточно точно передаёт классифицирующее «a type of darkness».
    rationale: «Разновидность тьмы» сохраняет смысл отнесения Хаоса к виду/типу тьмы, не отождествляя его с Тьмой, именем которой названа тень.
  revised_text: '[] Поскольку все — и космические боги, и люди — говорят, что до Хаоса ничего не существовало, я, вопреки им, докажу, что все они заблуждаются, потому что не знают ни происхождения Хаоса, ни его корня. Вот доказательство:


    Что касается Хаоса, то [] всем людям угодно утверждать, будто он представляет собой разновидность тьмы, тогда как на самом деле он происходит от тени, называемой «Тьмой», а эта тень происходит от сотворённой сущности, существующей от начала. Более того, ясно, что эта сотворённая сущность существовала прежде, чем возник Хаос, а Хаос возник уже после неё.


    Итак, обратимся к тому, как всё было в действительности, а также к первой сотворённой сущности, из которой был исторгнут Хаос; тогда истина будет ясно доказана.'
  revised_footnotes: []
  revision_rationale: 'Исправлена анафора, чтобы недвусмысленно передать указанную в свидетельстве временно-причинную последовательность: сотворённая сущность → тень, именуемая «Тьмой» → Хаос. Также «a type of darkness» передано как «разновидность тьмы». Смысл, лакуны и терминологическая неопределённость исходного текста сохранены; никаких доктринальных отождествлений не добавлено.'
