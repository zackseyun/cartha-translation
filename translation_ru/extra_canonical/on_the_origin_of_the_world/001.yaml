translation:
  language: ru
  text: '[] Поскольку все — и космические боги, и люди — говорят, что до Хаоса ничего не существовало, я, вопреки им, докажу, что все они заблуждаются, потому что не знают ни происхождения Хаоса, ни его корня. Вот доказательство:


    Что касается Хаоса, то [] всем людям угодно утверждать, будто он представляет собой некую тьму, тогда как на самом деле он происходит от тени, называемой «Тьмой», а эта тень происходит от сотворённой сущности, существующей от начала. Более того, ясно, что она существовала прежде, чем возник Хаос, а Хаос возник уже после этой сотворённой сущности.


    Итак, обратимся к тому, как всё было в действительности, а также к первой сотворённой сущности, из которой был исторгнут Хаос; тогда истина будет ясно доказана.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Chaos
  choice: Хаос
  rationale: Сохранён термин и собственное имя космогонической реальности; написание с прописной буквы отражает его персонифицированный или определённый характер в данном рассуждении.
- source_word: cosmic gods
  choice: космические боги
  rationale: Буквально и без конфессионального переосмысления передаёт указание на божественные существа космоса.
- source_word: root
  choice: корень
  rationale: Сохранена исходная метафора первоисточника, не сведённая к более однозначным словам «причина» или «начало».
- source_word: shadow
  choice: тень
  rationale: Сохранена космогоническая образность и смысловая связь тени с именем «Тьма».
- source_word: created entity
  choice: сотворённая сущность
  rationale: Передаёт одновременно сотворённость и онтологически неопределённый характер обозначаемого; не уточняет пол, личность или природу сущности сверх свидетельства.
- source_word: propelled
  choice: исторгнут
  rationale: Передаёт направленное происхождение Хаоса из первой сущности, сохраняя необычность и силу исходного образа без попытки объяснить механизм.
- source_word: realities of the case
  choice: то, как всё было в действительности
  rationale: Естественное русское выражение, передающее призыв рассмотреть фактическое положение вещей.
theological_decisions:
- issue: Существование сотворённой сущности «от начала»
  choice: «сотворённой сущности, существующей от начала»
  alternative: «первоначально возникшего творения»
  rationale: Сохранено напряжение между сотворённостью сущности и её существованием «от начала»; текст не уточняет времени или способа её сотворения.
- issue: Связь Хаоса, тени и Тьмы
  choice: Хаос происходит от тени, называемой «Тьмой»
  alternative: Хаос есть тьма или происходит непосредственно из Тьмы
  rationale: 'Сохранена последовательность свидетельства: Хаос происходит от тени; тень носит имя «Тьма»; сама тень происходит от сотворённой сущности.'
- issue: Статус «первой сотворённой сущности»
  choice: не конкретизировать её природу и личность
  alternative: отождествить её с определённым божеством, эоном или материей
  rationale: Введение лишь обещает дальнейшее рассмотрение этой сущности и пока не даёт основания для догматического отождествления.
translation_notes:
  register: Современный литературный русский с достоинством трактатного вступления. Синтаксис умеренно упрощён ради ясности, но логическая последовательность и повтор ключевых терминов сохранены. Пустые квадратные скобки оставлены как сигналы повреждения или предполагаемой лакуны в рукописи. Поскольку прямая сверка с коптским источником ещё не выполнена, перевод носит предварительный характер и основан на предоставленном англоязычном публичном свидетельстве.
