  revised_text: 'После того как природный облик бессмертных сущностей завершил своё развитие из беспредельности, от Пистис произошёл образ, называемый Софией. Она проявила свою волю и стала сотворённой сущностью, подобной изначальному свету. И тотчас её воля явилась в образе неба, обладавшего непостижимой величиной между бессмертными сущностями и сущностями, возникшими позднее, уподобляясь […].[a] Она была словно завеса, отделявшая человечество от вышних сущностей.



    Эон Истины не имеет внешней тени, потому что беспредельный свет повсюду пребывает внутри него. Однако снаружи от него находится тень, именуемая «Тьмой». Из неё явился сонм, властвовавший над тьмой, а сонмы, возникшие после него, назвали эту тень «Беспредельным Хаосом». Из него устремились ввысь всевозможные божества […] вместе со всем пространством; вследствие этого тень появилась после первой […] сотворённой сущности.[b] Она возникла <внутри> Бездны, ведя своё начало от упомянутой прежде Пистис.



    Затем тень поняла, что существует нечто более могущественное, чем она, и стала завидовать. Зачав по собственной воле, она тотчас породила ревность. С того дня стал явным закон ревности, господствующий во всех эонах и их мирах. Эта ревность оказалась выкидышем, лишённым всякого духа. Этот выкидыш возник как тень в огромной водной стихии. Затем желчь, возникшая из тени, была выброшена в одну из областей Хаоса.



    С того дня стала явной водная стихия, а то, что погрузилось в неё, хлынуло прочь, оставаясь видимым внутри Хаоса. Как у женщины при рождении ребёнка изливается всё скопившееся в ней вещество, так из тени возникла материя и была исторгнута из неё, но из Хаоса не вышла.



    Явление Ялдаваофа



    Материя пребывала внутри Хаоса, в одной из его областей. Когда всё это произошло, Пистис пришла и явилась над материей Хаоса, исторгнутой, словно выкидыш, поскольку в ней не пребывало ничего духовного: она была всецело беспредельной тьмой и бездонной водой. Увидев то, что произошло из-за её изъяна, Пистис пришла в смятение. Её смятение проявилось как устрашающая сотворённая сущность, которая устремилась к ней в Хаосе. Она повернулась к ней и дохнула ей в лицо внутри Бездны, лежащей под […] всеми небесами.[c] И когда Пистис София пожелала, чтобы сущность, лишённая духа, обрела образ и стала властвовать над материей, а также над всеми её сонмами, тогда впервые из вод явился двуполый архонт, обликом подобный льву. В нём была великая власть, но он не знал, откуда произошёл.



    Пистис София смотрела, как он движется в водных глубинах, и сказала ему: «Дитя, перейди сюда», то есть ялда-ваоф. С того дня явился закон членораздельной речи, распространившийся на богов, ангелов и людей; то, что возникло вследствие членораздельной речи, было завершено богами, ангелами и людьми.



    Архонт Ялтаваоф не знал о силе Пистис. Он не видел её лица, но видел в воде говоривший с ним образ. Из-за этого голоса он назвал себя «Ялд<ав>аоф».[d] Совершенные же называют его «Ариаэл», потому что он был подобен льву.



    Когда он обрёл власть над материей, Пистис София удалилась ввысь, в свой свет.'
