  text: 'After the natural form of the deathless beings had finished developing out of infinity, a likeness called Sophia emanated from Pistis. She exercised her will and became a created being like the primordial light. Immediately, her will appeared in the likeness of heaven, possessing an incomprehensible size between the deathless beings and the beings that came into existence afterward, resembling [. . .]. She acted as a veil separating humanity from the beings above.


    Now, the aeon of Truth has no external shadow, because the infinite light dwells everywhere within it. Its exterior, however, is a shadow called “Darkness.” From it appeared a host that ruled over the darkness, and the hosts that came into being afterward called the shadow “Infinite Chaos.” From it every kind of divinity sprang upward [. . .] together with the entire place, with the further result that shadow came after the first [] created being. It appeared <inside> the Abyss, originating from the previously mentioned Pistis.


    The shadow then realized that something more powerful than itself existed and became envious. When it had become pregnant through its own will, it immediately gave birth to jealousy. From that day, the law of jealousy prevailing among all the aeons and their worlds has been evident. Now, this jealousy was found to be an aborted fetus with no spirit within it. It came into being as a shadow within an immense watery substance. The bile that had come from the shadow was then thrust into a region of Chaos.


    From that day, a watery substance has been evident, and what sank down within it gushed away while remaining visible within Chaos. As with a woman giving birth to a child, when all her accumulated matter gushes out, so matter came into being from a shadow and was driven away from it, yet it did not leave Chaos.


    The Manifestation of Yaldabaoth


    Instead, matter remained within Chaos, dwelling in one of its regions. After these things had happened, Pistis arrived and appeared above the matter of Chaos, which had been expelled like an aborted fetus, since no spirit dwelled within it, for it was entirely infinite darkness and bottomless water. When Pistis saw what had resulted from her defect, she became troubled. Her distress appeared as a frightful created being that hurried toward her in Chaos. She turned toward it and blew into its face within the Abyss, which lies beneath [] all the heavens. Pistis Sophia then willed that the being without spirit should be formed into a likeness and should rule over matter and all her hosts. For the first time, an androgynous archon resembling a lion appeared from the waters, possessing great authority within himself and not knowing where he had come from.


    As Pistis Sophia watched him moving about in the watery depths, she said to him, “Child, pass over here,” which is the same as yalda-baoth. From that day, the law of articulate speech appeared and extended to the gods, the angels, and humanity. What had come into being through articulate speech was brought to completion by the gods, the angels, and humanity.


    Now, the archon Yaltabaoth was unaware of the power of Pistis. He did not see her face but instead saw in the water the likeness that spoke with him. Because of that voice, he called himself “Yald<ab>aoth.” The perfect ones, however, call him “Ariael,” because he resembled a lion.


    When he had gained authority over matter, Pistis Sophia withdrew upward into her light.'
translation:
  language: ru
  text: 'После того как естественный облик бессмертных сущностей завершил своё развитие из беспредельности, от Пистис изошёл образ, называемый Софией. Она проявила свою волю и стала сотворённой сущностью, подобной изначальному свету. И тотчас её воля явилась в образе неба — непостижимого по величине, расположенного между бессмертными сущностями и теми сущностями, которые возникли позднее, уподобляясь […].[a] Она была словно завеса, отделявшая человечество от вышних сущностей.


    Эон Истины не имеет внешней тени, потому что беспредельный свет повсюду пребывает внутри него. Однако снаружи от него находится тень, именуемая «Тьмой». Из неё явился сонм, властвовавший над тьмой, а сонмы, возникшие после него, назвали эту тень «Беспредельным Хаосом». Из него устремились ввысь всевозможные божества […] вместе со всей областью; вследствие этого тень появилась после первой […] сотворённой сущности.[b] Она возникла <внутри> Бездны, ведя своё начало от упомянутой прежде Пистис.


    Затем тень поняла, что существует нечто более могущественное, чем она, и стала завидовать. Зачав по собственной воле, она тотчас породила ревность. С того дня обнаруживает себя закон ревности, господствующий во всех эонах и их мирах. Эта ревность оказалась недоноском, в котором вовсе не было духа. Она возникла как тень в огромной водной стихии. Затем желчь, возникшая из тени, была выброшена в одну из областей Хаоса.


    С того дня обнаруживает себя водная стихия, а то, что погрузилось в неё, хлынуло прочь, оставаясь видимым внутри Хаоса. Как у женщины при рождении ребёнка изливается всё скопившееся в ней вещество, так из тени возникла материя и была исторгнута из неё, но из Хаоса не вышла.


    Явление Ялдаваофа


    Материя осталась внутри Хаоса, пребывая в одной из его областей. Когда всё это произошло, Пистис пришла и явилась над материей Хаоса, исторгнутой, словно недоносок, поскольку в ней не обитало ничего духовного: она была всецело беспредельной тьмой и бездонной водой. Увидев то, что произошло из-за её изъяна, Пистис пришла в смятение. Это смятение явилось в виде устрашающей сотворённой сущности, которая устремилась к ней в Хаосе. Она повернулась к ней и дохнула ей в лицо внутри Бездны, лежащей под […] всеми небесами.[c] И когда Пистис София пожелала, чтобы сущность, лишённая духа, обрела образ и стала властвовать над материей, а также над всеми её сонмами, тогда впервые из вод явился двуполый архонт, обликом подобный льву. В нём была великая власть, но он не знал, откуда произошёл.


    Пистис София смотрела, как он движется в водных глубинах, и сказала ему: «Дитя, перейди сюда», что означает ялда-ваоф. С того дня явился закон членораздельной речи, распространившийся на богов, ангелов и людей; и боги, ангелы и люди довершили то, что возникло благодаря членораздельной речи.


    Архонт Ялтаваоф не знал о силе Пистис. Он не видел её лица, но видел в воде говоривший с ним образ. Из-за этого голоса он назвал себя «Ялд<ав>аоф».[d] Совершенные же называют его «Ариаэль», потому что он был подобен льву.


    Когда он обрёл власть над материей, Пистис София удалилась ввысь, в свой свет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В рукописном свидетельстве после слова «уподобляясь» имеется лакуна; окончание мысли утрачено.
    reason: Сигнализирует неполноту текста и не позволяет переводу искусственно завершить сравнение.
  - marker: b
    text: В этом предложении рукописный текст повреждён в двух местах; слова в квадратных скобках не восстановлены. Связь между «тенью» и «первой сотворённой сущностью» поэтому остаётся не вполне ясной.
    reason: Предупреждает читателя о синтаксической и смысловой неопределённости повреждённого места.
  - marker: c
    text: Перед словами «всеми небесами» в рукописи имеется лакуна.
    reason: Сохраняет текстологический сигнал в месте, где утраченное слово могло уточнять устройство Бездны.
  - marker: d
    text: Угловые скобки в имени «Ялд<ав>аоф» обозначают редакционное восстановление букв; варианты «Ялдаваоф», «Ялтаваоф» и «ялда-ваоф» сохранены по свидетельству.
    reason: Объясняет различия в написании имени и не создаёт ложного впечатления полной рукописной сохранности.
lexical_decisions:
- source_word: deathless entities
  choice: бессмертные сущности
  rationale: «Сущности» сохраняет отвлечённо-космологический характер обозначения и не сужает его до людей или личностных существ.
- source_word: likeness
  choice: образ
  rationale: «Образ» естественен по-русски и сохраняет значение подобия или явленного отображения, не уточняя его природу.
- source_word: aeon
  choice: эон
  rationale: Устоявшийся термин для космологической области или порядка в подобных текстах; перевод «век» здесь создал бы ложную однозначность.
- source_word: host(s)
  choice: сонм(ы)
  rationale: Передаёт коллектив небесных или космических сил в возвышенном, но понятном регистре.
- source_word: watery substance
  choice: водная стихия
  rationale: Избегает тяжеловесного «водянистое вещество» и передаёт первозданную водную массу без отождествления с обычной водой.
- source_word: matter
  choice: материя
  rationale: Сохраняет космогонический и философский смысл и словесное отличие от «вещества» в образе родов.
- source_word: archon
  choice: архонт
  rationale: Сохраняет специальное наименование космического правителя, не подменяя его более общим словом «властитель».
- source_word: androgynous
  choice: двуполый
  rationale: Современное и ясное обозначение существа, соединяющего мужское и женское; не вводит современную идентичностную коннотацию существительного «андрогин».
- source_word: articulate speech
  choice: членораздельная речь
  rationale: Передаёт именно способность к словесному выражению, а не речь вообще.
- source_word: Pistis / Sophia
  choice: Пистис / София
  rationale: Имена транслитерированы, а не переведены как «Вера» и «Мудрость», чтобы не устранять возможное напряжение между именем персонажа и значением греческого слова.
theological_decisions:
- issue: Статус Софии как образа и сотворённой сущности
  choice: Сохранены формулировки «образ» и «стала сотворённой сущностью» без догматического пояснения.
  alternative: Истолковать Софию как персонифицированную Премудрость или как самостоятельное божество.
  rationale: Текст описывает космогоническую последовательность неоднозначно; перевод не должен заранее определять онтологический статус Софии.
- issue: Отношение Пистис и Пистис Софии
  choice: Обе формы имени сохранены так, как они чередуются в свидетельстве.
  alternative: Везде унифицировать как «Пистис София» либо разделить на двух персонажей.
  rationale: Чередование может быть значимым, а доступное свидетельство не оправдывает его устранения.
- issue: Происхождение зла, ревности и материи
  choice: 'Сохранена образная цепь: тень — зависть — ревность — недоносок — желчь — материя.'
  alternative: Рационализировать её как отвлечённое учение о происхождении зла.
  rationale: Телесные и космогонические образы составляют смысловую ткань текста и не должны заменяться систематической теологией.
- issue: Сила Ялдаваофа
  choice: Переведено «в нём была великая власть», при сохранении его неведения о собственном происхождении.
  alternative: Представить его власть как исключительно заимствованную или мнимую.
  rationale: Источник удерживает напряжение между реальной властью архонта и его неведением; перевод не разрешает его конфессионально.
- issue: Этимология имени ялда-ваоф
  choice: Фраза «что означает ялда-ваоф» сохранена без исправления или разъяснения предполагаемого арамейского смысла.
  alternative: Перевести имя как «дитя, перейди сюда» или предложить реконструированную этимологию.
  rationale: Свидетельство само связывает фразу с именем, но точная лингвистическая реконструкция при отсутствии прямой проверки коптского текста остаётся неуверенной.
translation_notes:
  register: 'Современный литературный русский язык с умеренно возвышенным космогоническим регистром. Синтаксис упрощён там, где буквальное воспроизведение английского свидетельства было бы неестественным, но повторы, телесные метафоры и смысловые напряжения сохранены. Проект предварительный: он основан на предоставленном общедоступном английском свидетельстве; непосредственная сверка с коптским текстом Nag Hammadi Codex II,5 ещё требуется. Лакуны обозначены квадратными скобками, редакционное восстановление — угловыми.'
