translation:
  language: ru
  text: 'Перед завершением века всё это место содрогнётся от громового раската. Тогда архонты опечалятся из-за [страха перед] своей близкой […] смертью[a]. Ангелы будут скорбеть о принадлежащем им человеческом роде, демоны — плакать о своих временах, а принадлежащий им человеческий род будет стонать и вопить перед близкой смертью.


    Тогда начнётся век, и они придут в смятение[b]. Их цари опьянеют от огненного меча и начнут воевать друг с другом, так что земля опьянеет от пролитой крови, а моря придут в волнение из-за этих войн. Тогда солнце померкнет, и луна затмит свой свет. Небесные звёзды перестанут следовать своими путями, и громовой раскат раздастся из великого воинства, стоящего над всеми воинствами Хаоса, там, где находится твердь женщины.


    Создав первое творение, она отложит мудрый огонь разума и облечётся в неразумный гнев.


    Затем она станет преследовать богов Хаоса, которых сотворила вместе с Прародителем. Она низвергнет их в Бездну. За своё зло они будут уничтожены: уподобившись огнедышащим горам, они станут пожирать друг друга, пока сила Прародителя не истребит их.


    Уничтожив их, он обратится против самого себя и будет уничтожать себя, пока не перестанет существовать[c]. Их небеса обрушатся друг на друга, а их воинства пожрёт огонь. Их эоны также будут низвергнуты, и его небо рухнет и расколется надвое. Его [звёзды…] упадут на землю, [и земля не сможет] выдержать их[d]. Они низринутся в Бездну, и Бездна будет ниспровергнута. Свет [одолеет] тьму и уничтожит её. Она станет словно […] то, чего никогда не существовало[e]. Исток тьмы исчезнет, а недостаток будет вырван с корнем и низвергнут во тьму. Свет возвратится ввысь, к своему корню, и явится слава Нерождённого. Она наполнит каждый эон, когда пророчества и писания царей будут раскрыты и исполнены теми, кого называют совершенными.


    Но те, кто не стал совершенным в Нерождённом Отце, обретут славу в своих эонах и в царствах бессмертных, однако никогда не войдут в эон, где нет царя. Ведь каждый должен уйти туда, откуда пришёл. Своими делами и своим знанием каждый обнаружит присущую ему природу.'
