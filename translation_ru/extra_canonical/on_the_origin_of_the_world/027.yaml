  footnotes:
  - marker: a
    text: Квадратные скобки и многоточие обозначают восстановленный текст и утрату в рукописи; точная формулировка повреждённого места не сохранилась.
    reason: Сохранить сигналы реконструкции и лакуны в первом абзаце.
  - marker: b
    text: Фраза «начнётся век» передана по имеющемуся английскому свидетельству, хотя в контексте завершения века её смысл остаётся трудным.
    reason: Не исправлять возможную текстовую или переводческую трудность без проверки коптского источника.
  - marker: c
    text: К кому относится местоимение «он», из имеющегося свидетельства не вполне ясно.
    reason: Обозначить реальную референтную неоднозначность.
  - marker: d
    text: Слова в квадратных скобках восстановлены в повреждённом тексте; многоточие отмечает пропуск.
    reason: Сохранить степень текстуальной уверенности.
  - marker: e
    text: В этом предложении рукопись имеет утрату; «она» грамматически относится к тьме.
    reason: Отметить лакуну и прояснить неизбежную в русском языке местоименную связь без восстановления пропущенного слова.
lexical_decisions:
- source_word: archons
  choice: архонты
  rationale: Сохранён технический термин космологии трактата; замена на «правители» могла бы скрыть его специальный смысл.
- source_word: age / aeon
  choice: век / эон
  rationale: В эсхатологическом выражении «завершение века» употреблено естественное русское «век», тогда как для персонифицированных или космологических областей сохранён термин «эон».
- source_word: Primal Parent
  choice: Прародитель
  rationale: Передаёт первичность и родительскую функцию без уточнения пола, которого английское свидетельство не определяет.
- source_word: Abyss
  choice: Бездна
  rationale: Прописная буква отражает употребление слова как названия космической области.
- source_word: unbegotten one / unbegotten Father
  choice: Нерождённый / Нерождённый Отец
  rationale: Сохраняет богословски значимое отрицание происхождения, не подменяя его конфессиональным термином.
- source_word: deficiency
  choice: недостаток
  rationale: Буквальная и достаточно нейтральная передача космологического понятия; более интерпретативные варианты вроде «ущербность» не выбраны.
- source_word: kingless aeon
  choice: эон, где нет царя
  rationale: Развёрнутая формулировка яснее по-русски и сохраняет необычное отрицательное определение, не истолковывая его как политический термин.
- source_word: their humanity
  choice: принадлежащий им человеческий род
  rationale: Сохранена неясная притяжательная связь английского свидетельства; выражение не сведено ни к «человечности», ни к конкретным людям.
theological_decisions:
- issue: Неясный референт мужского местоимения после уничтожения богов Хаоса
  choice: Сохранено «он» без явного наименования действующего лица
  alternative: Назвать Прародителя или иного персонажа прямо
  rationale: Свидетельство допускает неясность референта; её устранение внесло бы толкование в текст.
- issue: Соотношение «века» и «эонов»
  choice: 'Различено по контексту: эсхатологический век и космологические эоны'
  alternative: Везде переводить одним словом
  rationale: Так русский текст остаётся понятным, но не стирает терминологический оттенок космологических областей.
- issue: Образ принадлежности человеческого рода ангелам, демонам или архонтам
  choice: Притяжательная конструкция сохранена
  alternative: Истолковать как скорбь ангелов о человечестве вообще
  rationale: Исходное свидетельство необычно и неоднозначно; богословская связь не уточняется сверх доступных данных.
translation_notes:
  register: 'Современный литературный русский язык с достоинством апокалиптической прозы. Технические космологические термины («архонты», «эоны», «Хаос», «Бездна») сохранены, но синтаксис сделан доступным обычному читателю. Проект предварительный: он основан на предоставленном общедоступном английском свидетельстве; прямая сверка с коптским текстом ещё требуется. Вставной номер страницы рукописи [17] в основной текст не включён.'
