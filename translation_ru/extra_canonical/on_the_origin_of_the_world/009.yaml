base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/009.yaml
  text: 'After witnessing the likeness of Pistis in the waters, the Primal Parent became deeply sorrowful, especially when he heard her voice. It resembled the first voice that had called to him from the waters. He groaned when he realized that she was the one who had given him a name. He was ashamed of his sin. And when he truly learned that a deathless man of light had existed before him, he became deeply troubled, because he had previously declared to all the gods and their angels, “I am the one who is God. Apart from me, nothing else exists.” He had been afraid that they might discover someone else had existed before him and might denounce him.


    But because he lacked discernment, he laughed at (the possibility of) denunciation and acted rashly. He said, “If [] something existed before I did, let it come forward so that we may see its light.” And immediately, look! Light came out from the eighth heaven above and passed through all the heavens of the earth.'
translation:
  language: ru
  text: 'Увидев в водах образ Пистис, Прародитель глубоко опечалился, особенно когда услышал её голос, похожий на тот первый голос, что воззвал к нему из вод. Он застонал, осознав, что именно она дала ему имя. Ему стало стыдно за свой грех. А когда он доподлинно узнал, что прежде него существовал бессмертный человек света, то пришёл в великое смятение, потому что ранее объявил всем богам и их ангелам: «Я — Бог, и кроме меня ничего не существует». Ведь он боялся, что они могут узнать: прежде него существовал кто-то другой — и тогда обличат его.


    Но, будучи неразумным, он посмеялся над возможностью обличения и поступил дерзко. Он сказал: «Если [a] прежде меня что-то существовало, пусть оно явится, чтобы мы увидели его свет». И тотчас — вот! — из восьмого неба в вышине явился свет и прошёл через все небеса земли.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В источнике перед словом «что-то» отмечена лакуна; утраченный текст не восстанавливается.
    reason: Необходимо явно передать сигнал повреждения рукописи, обозначенный пустыми квадратными скобками в свидетельстве.
lexical_decisions:
- source_word: Pistis
  choice: Пистис
  rationale: Собственное имя передано транслитерацией, а не переведено как «Вера», чтобы не устранять возможную персонификацию и терминологическую специфику трактата.
- source_word: Primal Parent
  choice: Прародитель
  rationale: Естественное и достаточно формальное обозначение первичного родителя; сохраняет гендерную неоднозначность английского свидетельства лучше, чем «Праотец».
- source_word: deathless man of light
  choice: бессмертный человек света
  rationale: Близко воспроизводит структуру свидетельства и не превращает выражение в позднейший закреплённый титул.
- source_word: denounce
  choice: обличат
  rationale: Передаёт публичное разоблачение и осуждение, не сужая смысл до простого доноса.
- source_word: eighth heaven
  choice: восьмое небо
  rationale: Сохранён космологический термин исходного свидетельства без поясняющей интерпретации.
- source_word: heavens of the earth
  choice: небеса земли
  rationale: Необычное сочетание сохранено ради космологической неоднозначности текста.
theological_decisions:
- issue: Самообъявление Прародителя Богом
  choice: «Я — Бог, и кроме меня ничего не существует»
  alternative: «Я тот, кто есть Бог; помимо меня нет ничего иного сущего»
  rationale: Выбрана ясная современная формулировка, сохраняющая исключительное притязание персонажа без привнесения библейской формулы имени.
- issue: Природа предсуществующего существа
  choice: «бессмертный человек света»
  alternative: «нетленный светлый человек»
  rationale: Сохранены одновременно человечность, бессмертие и связь со светом; их отношение намеренно не истолковано.
- issue: Реальность или возможность обличения
  choice: Первое упоминание дано как ожидаемое обличение, второе — как «возможность обличения»
  alternative: В обоих случаях категорическое «обличение»
  rationale: Это отражает различие контекста в английском свидетельстве и сохраняет скобочную оговорку второго употребления.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Короткие фразы в кульминационных местах улучшают ясность; необычная космологическая лексика сохранена. Поскольку непосредственная сверка с коптским текстом ещё не проведена, решения остаются предварительными и основаны на предоставленном публичном английском свидетельстве.
