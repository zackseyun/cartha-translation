base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/011.yaml
  text: 'As an androgynous being, Eros appeared from that primal blood. His masculine element is Himireris, which is fire from light. His feminine element that dwells together with him is a soul consisting of blood and originates from the substance of Pronoia. He is exceedingly lovely in his beauty, possessing a charm surpassing that of all the created entities of Chaos.


    Then all the gods and their angels, when they gazed upon Eros, fell in love with him. By manifesting himself within all of them, he set them ablaze. Just as several lamps are lit from a single lamp, and one and the same light is present while the lamp is not diminished, so Eros dispersed himself within all the created entities of Chaos and was not diminished. Just as Eros appeared at the center of light and darkness, and just as the sexual union of Eros was consummated at the center of the angels and humanity, so the primal pleasure blossomed from the earth. Woman followed Earth; marriage followed Woman. Birth followed marriage; decline followed birth.


    After Eros, the grapevine sprouted from the blood that had been shed upon the earth. Because of this, those who drink from it develop a desire for sexual union.


    After the grapevine, a fig tree and a pomegranate tree sprouted from the earth, together with the remainder of the trees, every species, possessing their seed from the [] seed of the authorities and of their angels.'
translation:
  language: ru
  text: 'Будучи двуполым существом, Эрос явился из той первозданной крови. Его мужское начало — Химирерис, огонь от света. Его женское начало, обитающее вместе с ним, — душа, состоящая из крови и происходящая из сущности Пронойи. Он необычайно прекрасен и обладает очарованием, превосходящим очарование всех сотворённых существ Хаоса.


    Тогда все боги и их ангелы, увидев Эроса, влюбились в него. Явившись внутри каждого из них, он воспламенил их. Подобно тому как от одного светильника зажигают несколько и во всех пребывает один и тот же свет, а первый светильник не становится слабее, так и Эрос распространился внутри всех сотворённых существ Хаоса, но не умалился. Как Эрос явился посреди света и тьмы и как соитие Эроса совершилось посреди ангелов и человечества, так из земли расцвело первозданное наслаждение. За Землёй последовала Женщина; за Женщиной — брак; за браком — рождение; за рождением — упадок.


    После Эроса из крови, пролитой на землю, проросла виноградная лоза. Поэтому у тех, кто пьёт вино из неё, возникает желание соития.


    После виноградной лозы из земли проросли смоковница и гранатовое дерево, а вместе с ними и все прочие деревья, каждое по своему виду; их семя происходило от [a] семени властей и их ангелов.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В рукописи перед словом «семени» имеется лакуна; утраченный текст не восполняется.
    reason: Сохраняет отмеченный в источнике пробел и не предлагает недоказанной реконструкции.
lexical_decisions:
- source_word: androgynous entity
  choice: двуполое существо
  rationale: Передаёт сочетание мужского и женского начал понятным современным русским языком; более узкое заимствование «андрогинное» не требуется контекстом.
- source_word: Himireris
  choice: Химирерис
  rationale: Имя транслитерировано без попытки истолковать его этимологически.
- source_word: Pronoia
  choice: Пронойя
  rationale: Сохранено как собственное имя персонифицированной сущности, а не истолковано как обычное слово «Промысл».
- source_word: created entities of Chaos
  choice: сотворённые существа Хаоса
  rationale: Сохраняет космогоническую персонификацию Хаоса и не уточняет неясный статус этих сущностей.
- source_word: set them ablaze
  choice: воспламенил их
  rationale: Сохраняет образ огня и одновременно допускает эротический смысл исходного контекста.
- source_word: sexual union
  choice: соитие
  rationale: Прямой, литературный и неэвфемистический эквивалент, подходящий для космогонического повествования.
- source_word: primal pleasure
  choice: первозданное наслаждение
  rationale: «Первозданное» естественно обозначает изначальность в космогоническом контексте, а «наслаждение» сохраняет чувственную окраску.
- source_word: decline
  choice: упадок
  rationale: Сохраняет широкую семантику ослабления или нисхождения после рождения, не сводя её без достаточных оснований к смерти или тлению.
- source_word: authorities
  choice: власти
  rationale: Буквально сохраняет обозначение космических сил и не заменяет его интерпретирующим термином «архонты».
theological_decisions:
- issue: Статус Пронойи
  choice: передать как имя «Пронойя»
  alternative: перевести как «Провидение» или «Промысл»
  rationale: Контекст представляет её как источник или персонифицированную сущность; транслитерация сохраняет эту неоднозначность.
- issue: Распространение Эроса среди существ Хаоса
  choice: «распространился внутри ... но не умалился»
  alternative: истолковать как разделение сущности или эманацию
  rationale: Образ одного света во многих светильниках сохранён без догматического объяснения природы этого присутствия.
- issue: Последовательность Земля — Женщина — брак — рождение — упадок
  choice: сохранить краткую цепочку с персонифицированными «Землёй» и «Женщиной»
  alternative: раскрыть её как причинную или хронологическую схему
  rationale: Источник оставляет характер связи между звеньями кратким и допускающим несколько прочтений.
- issue: Космические «власти»
  choice: не отождествлять прямо с архонтами
  alternative: перевести «архонты»
  rationale: Так сохраняется терминологическая осторожность при отсутствии завершённой сверки с коптским текстом.
translation_notes:
  register: 'Современный литературный русский язык с достоинством и умеренной формальностью; космогонические повторы и параллелизм сохранены. Голые номера страниц английского свидетеля не перенесены. Проект предварительный: он основан на указанном общедоступном английском свидетеле, поскольку прямая сверка с коптским оригиналом ещё не проведена.'
