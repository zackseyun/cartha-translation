translation:
  language: ru
  text: 'И прежде чем Адам Света удалился внутрь Хаоса, власти заметили его и стали насмехаться над Прародителем, потому что он солгал им, сказав: «Это я — Бог. До меня никого не существовало».


    Подойдя к нему, они спросили: «Не тот ли это бог, который испортил наше творение?»


    Он ответил: «Да. Если вы хотите, чтобы он больше не мог портить наше творение, придите, создадим человека из земли, чтобы он служил нам, по образу нашего тела и по подобию [a] этого существа. Тогда, увидев собственное подобие, он полюбит его и больше не будет портить наше творение. А тех, кто рождён из света, мы на всё время этого эона сделаем своими слугами».


    Всё это произошло согласно предведению Пистис, чтобы человек явился по его подобию и обличил их из-за созданного ими облика; и этот облик стал вместилищем, заключившим в себе свет.


    Тогда власти обрели знание, необходимое для создания человека. София Зоя, пребывающая вместе с Саваофом, предвидела, что они сделают, и посмеялась над их замыслом, потому что они слепы. Действуя против собственных интересов, они по неведению создали его и не понимали, за что собираются взяться.


    Она опередила их и первой создала своего человека, чтобы он научил созданный ими облик ненавидеть их и таким образом вырваться от них.


    Учитель появился так. Когда София ниспослала каплю света, та стекла на воду, и тотчас появился двуполый человек. Сначала она придала этой капле облик женского тела. Затем, воспользовавшись этим телом, она придала ей подобие матери, которая явилась прежде, и завершила её за двенадцать месяцев.


    Так появился двуполый человек, которого греки называют Гермафродитом, а его мать евреи называют Евой Зои, то есть женщиной — учительницей жизни. Её дитя — сотворённое существо, которое есть господин. Впоследствии власти [b] назвали его «Зверем», чтобы оно могло вводить в заблуждение сотворённых существ, которые создали. Значение имени «Зверь» — «Учитель», потому что он оказался самым разумным из всех существ.'
