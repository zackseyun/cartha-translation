lexical_decisions:
- source_word: authorities
  choice: власти
  rationale: Сохранён характерный для произведения космологический термин без конфессиональной конкретизации как «архонты»; при необходимости термин может быть уточнён после сверки с коптским текстом.
- source_word: Primal Parent
  choice: Прародитель
  rationale: Передаёт родительский и первичный смысл титула, сохраняя его неопределённость по роду.
- source_word: aeon
  choice: эон
  rationale: Транслитерация сохраняет специальное космологическое значение и не сводит его просто к «веку».
- source_word: Pistis
  choice: Пистис
  rationale: Имя/персонифицированное понятие передано транслитерацией, без истолковывающего перевода «Вера».
- source_word: Sophia Zoe
  choice: София Зоя
  rationale: Оба элемента сохранены как имена; это не смешивает имя с последующим толкованием жизни.
- source_word: androgynous human
  choice: двуполый человек
  rationale: Естественная современная передача человека, соединяющего признаки обоих полов; связь с последующим «Гермафродитом» остаётся ясной.
- source_word: the Beast
  choice: Зверь
  rationale: Сохранено титульное употребление с прописной буквы и внутренняя текстовая связь с толкованием имени.
- source_word: Teacher
  choice: Учитель
  rationale: Сохранено повторяющееся обозначение функции персонажа и предложенная самим текстом интерпретация имени.
theological_decisions:
- issue: К кому относится местоимение в выражении «по его подобию»
  choice: Сохранено «по его подобию» без уточнения референта
  alternative: «по подобию Адама Света» или «по подобию Пистис»
  rationale: Английское свидетельство допускает референциальную неоднозначность; без прямой сверки с коптским текстом её нельзя надёжно разрешить.
- issue: Оценка действий властей при создании человека
  choice: 'Сохранено напряжение: они создают человека по неведению и вопреки своим интересам, тогда как событие соответствует предведению Пистис'
  alternative: Гармонизировать рассказ как единый заранее определённый замысел
  rationale: Текст одновременно утверждает предведение высшей силы и неведение властей; перевод не устраняет это богословское напряжение.
- issue: Неясный синтаксис финального абзаца
  choice: 'Передано максимально близко: «сотворённых существ, которые создали»'
  alternative: Уточнить субъект как «которых создали власти» или «которые создали его»
  rationale: Свидетель прямо предупреждает о неоднозначности; добавление субъекта искусственно разрешило бы повреждённое или неясное место.
- issue: Род и референция «сотворённого существа»
  choice: Использованы формы среднего рода «существо/оно», затем мужской род в толковании «Учитель/он»
  alternative: Последовательно назвать персонажа мужчиной или женщиной
  rationale: Так сохраняются грамматическое колебание свидетельства и андрогинный характер персонажа.
translation_notes:
  register: 'Современный литературный русский язык с достоинством и ясностью повествования. Специальные космологические имена и термин «эон» сохранены. Перевод предварительный: предоставлено английское публично-доменное свидетельство, а прямая сверка с коптским источником ещё не выполнена; поэтому лакуны и подлинные неоднозначности не сглажены.'
