  source_fidelity: 'В целом перевод точно передаёт предоставленное английское свидетельство и сохраняет его редакционные сигналы: вставки в угловых скобках, лакуну перед «трубами», различение между созданным существом «Иисус Христос» и спасителем восьмого неба, а также технический термин «эон». Без прямого коптского текста независимая проверка ограничена свидетельством-посредником. Нужна безопасная правка синтаксиса в эпизоде, где Пистис София призывает его к своей правой стороне: исходная русская конструкция звучит неполно.'
  naturalness: 'Регистр удачен: «сонм», «престол» и «воинства» литературны и соответствуют возвышенному космологическому повествованию. Формулировка «призвала по правую руку от себя» нормативно и смыслово шероховата, поскольку не выражает объекта действия и может ошибочно восприниматься как характеристика самого призывания.'
  terminology: Термины «сонм», «эон», «Прародитель», «Пистис София», «София» и «Хаос» переданы последовательно. «Дева святого Духа» намеренно сохранена без догматического истолкования. Маркер лакуны и сноска адекватно фиксируют отсутствие текста в свидетельстве.
