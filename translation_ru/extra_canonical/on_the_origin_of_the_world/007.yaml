base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/007.yaml
  text: 'After this, he created an assembly of angels—countless thousands and tens of thousands—which looked like the assembly in the eighth heaven. He also created a firstborn called “Israel,” that is, “the Man Who Sees God,” and another being called “Jesus Christ.” This being looks like the savior who lives above in the eighth heaven and sits at his right hand on a holy throne. At his left hand, the Virgin of the holy Spirit sits on a throne, glorifying him. The seven virgins stand before her, holding thirty harps, lyres, and [] trumpets and glorifying him. All the angelic hosts glorify him and praise him.


    The place where he sits is a throne of light <in a> great cloud that covers him. No one lived with him inside the cloud except Sophia, <the daughter of> Pistis. She taught him about all the beings that exist within the eighth heaven so that he could create likenesses of them and his reign could last until the consummation of the heavens of Chaos and their hosts.


    Now Pistis Sophia separated him from the darkness and called him to her right, and she placed the Primal Parent at her left. From that day on, the right has been called “justice,” and the left has been called “evil.” Because of this, all of them received an aeon in the assembly of justice, and evil stands over every created being [5].'
translation:
  language: ru
  text: 'После этого он сотворил сонм ангелов — несчётные тысячи и десятки тысяч, — подобный сонму на восьмом небе. Он сотворил также первенца по имени «Израиль», то есть «Человек, видящий Бога», и ещё одно существо, называемое «Иисус Христос». Оно подобно спасителю, который обитает вверху, на восьмом небе, и сидит по правую руку от него на святом престоле. По левую руку от него на престоле сидит Дева святого Духа и прославляет его. Перед ней стоят семь дев, держа тридцать арф, лиры и [a] трубы, и прославляют его. И все ангельские воинства прославляют и восхваляют его.


    Место, где он сидит, — престол света <в> великом облаке, которое покрывает его. Никто не пребывал с ним внутри облака, кроме Софии, <дочери> Пистис. Она наставляла его обо всех существах, пребывающих на восьмом небе, чтобы он мог создать их подобия и чтобы его царствование продолжалось до завершения небес Хаоса и их воинств.


    Пистис София отделила его от тьмы и призвала по правую руку от себя, а Прародителя поставила по левую. С того дня правая сторона называется «справедливостью», а левая — «злом». Поэтому все они получили эон в сонме справедливости, а зло господствует над всяким сотворённым существом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В рукописном свидетельстве перед словом «трубы» имеется лакуна; утраченное слово или слова не восстанавливаются.
    reason: Пустые квадратные скобки исходного witness были преобразованы в читаемый сносочный маркер, при этом текстовая неопределённость сохранена.
lexical_decisions:
- source_word: assembly
  choice: сонм
  rationale: В небесном контексте «сонм» естественно и достоинственно передаёт собрание множества ангельских существ, не сводя его к административному «собранию».
- source_word: myriads
  choice: десятки тысяч
  rationale: Сохраняет числовой образ греческого по происхождению термина и параллелизм с «тысячами».
- source_word: eighth heaven
  choice: восьмое небо
  rationale: Прямо сохраняет космологическую терминологию памятника без истолкования.
- source_word: entity / entities
  choice: существо / существа
  rationale: Нейтральное и понятное обозначение небесных сущностей; не уточняет их природу сверх свидетельства.
- source_word: holy Spirit
  choice: святой Дух
  rationale: Сохранена необычная конструкция «Дева святого Духа» без конфессионального переосмысления; строчная буква в прилагательном следует современному русскому оформлению внутри титула.
- source_word: consummation
  choice: завершение
  rationale: Передаёт окончание установленного срока или порядка, не навязывая значение уничтожения.
- source_word: Primal Parent
  choice: Прародитель
  rationale: Краткий титульный эквивалент, сохраняющий родительскую и первичную семантику без уточнения пола.
- source_word: aeon
  choice: эон
  rationale: Сохранён технический космологический термин, поскольку «век» или «мир» преждевременно устранили бы многозначность.
- source_word: stands over
  choice: господствует над
  rationale: По контексту выражает положение власти над творением; буквальное «стоит над» в современном русском было бы неясно.
theological_decisions:
- issue: Отношение созданного «Иисуса Христа» к вышнему спасителю
  choice: 'Различие сохранено: созданное существо «подобно спасителю» восьмого неба.'
  alternative: Отождествить их как одного Иисуса Христа.
  rationale: Свидетельство описывает одно существо как подобие другого; отождествление сняло бы существенное космологическое напряжение текста.
- issue: Неясность местоимений в сцене престолов
  choice: Местоименная структура в основном сохранена, без добавления имён там, где свидетель их не называет.
  alternative: Повторить «Саваоф» или назвать иного референта для каждого местоимения.
  rationale: Явное называние референтов потребовало бы толкования, которое не обеспечено предоставленным английским свидетелем.
- issue: Символика правой и левой сторон
  choice: Переданы как «справедливость» и «зло».
  alternative: «Праведность» и «неправедность» либо «добро» и «зло».
  rationale: «Справедливость» ближе к данному witness justice и сохраняет юридико-космический оттенок; «зло» прямо соответствует evil.
- issue: Статус Пистис Софии и Софии
  choice: Имена транслитерированы, редакционное восстановление «<дочери>» сохранено.
  alternative: Перевести Пистис как «Вера» и убрать угловые скобки.
  rationale: Транслитерация сохраняет имена-понятия гностической космологии, а скобки честно отмечают редакционное дополнение.
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенной лексикой («сонм», «престол», «воинства»), подходящей древнему космологическому повествованию. Угловые скобки сохранены как редакционные сигналы supplied witness. Перевод предварительный: прямое сопоставление с коптским текстом ещё требуется.'
