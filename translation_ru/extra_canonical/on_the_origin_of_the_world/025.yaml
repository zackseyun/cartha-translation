review_pass:
  verdict: revise
  source_fidelity: В целом перевод бережно следует предоставленному английскому свидетельству и сохраняет технические термины, лакуны и редакторские восстановления. Однако несколько оборотов либо неестественны по-русски, либо несколько ослабляют образную связь с «формами, созданными властями».
  naturalness: Современный литературный регистр в основном выдержан. Нужна правка тяжеловесной конструкции «Пред Отцом он не лишён силы, чтобы…», а также более ясная передача «церкви, сделанной видимой созданными формами погибели» и синтаксически повреждённого места о прочих существах.
  terminology: «Эон», «архонты», «власти», «нерушимость», «Святое место» и «воинства» употреблены последовательно и уместно. «Блаженные существа» соответствует нейтральному обозначению beings/entities; «род» оправданнее, чем современно-биологизирующее «раса».
  issues:
  - severity: medium
    issue: Неестественная конструкция о силе ангела
    rationale: Фраза «Пред Отцом он не лишён силы, чтобы <он> дал им знание» грамматически тяжела и может создать впечатление, что «пред Отцом» — пространственное обстоятельство. Свидетельство утверждает, что ангел не лишён силы в присутствии/перед лицом Отца, чтобы дать знание; при этом восстановленное <он> и неясность его референции должны остаться отмечены.
  - severity: medium
    issue: Ослаблен мотив приданных формы
    rationale: '«Церковь, ставшая видимой через созданные облики погибели» звучит не по-русски и менее ясно отражает пассивную формулу witness: church made visible by the shaped forms of perdition. Безопаснее сохранить связь с формами, которым придали облик.'
  - severity: low
    issue: Синтаксис фразы о прочих существах чрезмерно сглажен
    rationale: Исходное свидетельство в конце фразы синтаксически неровно. Следует сохранить ясный русский текст, но явно отделить сообщение о «нескольких других существах» и сохранить примечание о повреждённости, не выдавая реконструкцию за несомненный текст.
  revised_text: 'Теперь перейдём к рассмотрению нашего мира, чтобы точно завершить описание его устройства и управления. Тогда станет ясно, как была обретена верность незримому эону, являвшая себя от сотворения до завершения века.


    Итак, я перехожу к главным вопросам о бессмертном человеке. Я расскажу о существах, принадлежащих ему, и покажу, как они оказались здесь.


    Когда появилось множество людей, произошедших от [Адама, который] [a] был создан даже из материи, и когда мир уже вполне населился, его владыками были архонты, то есть они держали его в рабстве посредством неведения. Почему же? Вот по какой причине. Бессмертный Отец знает, что среди эонов и их вселенной возник недостаток истины. Когда он пожелал обратить в ничто архонтов погибели посредством созданий, которым те придали облик, он ниспослал ваши подобия в мир погибели — то есть малых блаженных духов невинности. Знание им не чуждо, потому что всё знание пребывает в одном ангеле, явившемся им. В присутствии Отца он не лишён силы и может <он>[b] дать им знание. Являясь в мире погибели, они тотчас открывают устройство нерушимости, тем самым обличая архонтов и их воинства.


    И вот, когда блаженные существа явились в обликах, созданных властями, те позавидовали им. Из зависти власти соединили своё семя с их семенем, желая осквернить их, но не смогли этого сделать.


    Затем блаженные существа явились в сияющем облике, причём являлись по-разному. Они происходили из разных эонов и открывали своё знание церкви, ставшей видимой благодаря обликам, которым придали форму силы погибели. Оказалось, что в ней есть семя всякого рода, поскольку с [нею][c] было соединено семя властей.


    Тогда Спаситель сделал их всех [(как) одно][d]. Их духи явно превосходнее: они блаженны, [] и избраны различным образом. Есть также несколько других существ, не имеющих царя и превосходящих всех тех, кто существовал прежде них.[e]


    Итак, существуют четыре рода. Три принадлежат царям восьмого неба, а четвёртый род — без царя и совершенен; он выше всех. Именно они войдут в Святое место своего Отца и обретут покой и отдохновение, вечную, неизреченную славу и беспредельную радость.


    Более того, в пределах царства смерти они — цари, поскольку бессмертны. Они обличат богов Хаоса и их воинства.'
