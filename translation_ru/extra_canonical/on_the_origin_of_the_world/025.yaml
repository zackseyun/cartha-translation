  text: 'Now we will move on to consider our world, so that we can accurately complete the description of its structure and governance. Then it will become clear how faithfulness to the unseen aeon was found, which has been revealed from creation until the consummation of the age.


    Consequently, I come to the main themes concerning the deathless man. I will discuss the beings that belong to him, showing how they came to be here.


    When a multitude of humans had come into existence through descent from [the Adam who] [] had been made, even out of matter, and when the world had already become fully populated, the archons were its masters; that is, they kept it enslaved through ignorance. And why? For the following reason: The deathless father knows that a deficiency in truth came into existence among the aeons and their universe. When he desired to bring the archons of perdition to nothing by means of the creatures they had shaped, he sent your likenesses down into the world of perdition—that is, the blessed little spirits of innocence. They are not strangers to knowledge, because all knowledge dwells in a single angel who appeared to them. He does not lack power in the presence of the father, even for <him> to give them knowledge. When they appear in the world of perdition, they immediately reveal the structure of indestructibility as a condemnation of the archons and their hosts.


    In this way, when the blessed beings appeared in forms shaped by the authorities, they were envied. Out of envy, the authorities joined their seed with the seed of the blessed beings, wishing to defile them. But they were unable to do so.


    Then, when the blessed beings appeared in a radiant form, they appeared in several ways. They came from different aeons, revealing their knowledge to the church made visible through the shaped forms of perdition. She [16] was found to contain every kind of seed because the seed of the authorities had been joined [with her].


    The savior then made all of them [(as) one], and their spirits are clearly superior, being blessed [] and chosen in various ways. There are also several other beings who have no king and are superior to all those who existed before them.


    Therefore, four races exist. Three belong to the kings of the eighth heaven, but the fourth race is kingless and perfect, and it is the highest of them all. For these are the ones who will enter the Holy Place of their father, and they will obtain rest together with repose, eternal and ineffable glory, and infinite joy.


    What is more, they are kings within the realm of death, since they are deathless. They will condemn the gods of Chaos and their hosts.'
translation:
  language: ru
  text: 'Теперь перейдём к рассмотрению нашего мира, чтобы точно завершить описание его устройства и управления. Тогда станет ясно, как была обретена верность незримому эону, являвшая себя от сотворения до завершения века.


    Итак, я перехожу к главным вопросам о бессмертном человеке. Я расскажу о существах, принадлежащих ему, и покажу, как они оказались здесь.


    Когда появилось множество людей, произошедших от [Адама, который] [a] был создан даже из материи, и когда мир уже вполне населился, его владыками были архонты, то есть они держали его в рабстве посредством неведения. Почему же? Вот по какой причине. Бессмертный Отец знает, что среди эонов и их вселенной возник недостаток истины. Когда он пожелал обратить в ничто архонтов погибели посредством созданий, которым те придали облик, он ниспослал ваши подобия в мир погибели — то есть малых блаженных духов невинности. Знание им не чуждо, потому что всё знание пребывает в одном ангеле, явившемся им. Пред Отцом он не лишён силы, чтобы <он>[b] дал им знание. Являясь в мире погибели, они тотчас открывают устройство нерушимости, тем самым обличая архонтов и их воинства.


    И вот, когда блаженные существа явились в обликах, созданных властями, те позавидовали им. Из зависти власти соединили своё семя с их семенем, желая осквернить их, но не смогли этого сделать.


    Затем блаженные существа явились в сияющем облике, причём являлись по-разному. Они происходили из разных эонов и открывали своё знание церкви, ставшей видимой через созданные облики погибели. Оказалось, что в ней есть семя всякого рода, поскольку с [нею][c] было соединено семя властей.


    Тогда Спаситель сделал их всех [(как) одно][d]. Их духи явно превосходнее: они блаженны, [] и избраны различным образом. Есть также и другие существа, не имеющие царя и превосходящие всех тех, кто существовал прежде них.[e]


    Итак, существуют четыре рода. Три принадлежат царям восьмого неба, а четвёртый род — без царя и совершенен; он выше всех. Именно они войдут в Святое место своего Отца и обретут покой и отдохновение, вечную, неизреченную славу и беспредельную радость.


    Более того, в пределах царства смерти они — цари, поскольку бессмертны. Они обличат богов Хаоса и их воинства.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: После слов «[Адама, который]» в рукописном свидетельстве имеется лакуна; её объём и утраченный текст неизвестны.
    reason: Сохранение отмеченного в источнике повреждения текста.
  - marker: b
    text: Местоимение <он> восстановлено издателями; из сохранившейся фразы не вполне ясно, относится ли оно к ангелу или к Отцу.
    reason: Фиксация редакторского восстановления и грамматической неоднозначности.
  - marker: c
    text: Слова «с нею» восполняются по смыслу; речь, по-видимому, идёт о церкви, но повреждение не позволяет считать это совершенно бесспорным.
    reason: Обозначение восстановления, присутствующего в свидетельстве.
  - marker: d
    text: Слова «(как) одно» передают неуверенное восстановление повреждённого места.
    reason: Сохранение текстологической неопределённости.
  - marker: e
    text: Конец предложения в исходном свидетельстве синтаксически неровен и, вероятно, повреждён; перевод передаёт наиболее вероятный смысл без попытки восстановить утраченные слова.
    reason: Предупреждение о повреждении, влияющем на смысл фразы.
lexical_decisions:
- source_word: aeon
  choice: эон
  rationale: Сохранён характерный для трактата технический термин, который может обозначать как вечность/век, так и надмирную область или сущность; перевод одним обычным русским словом сузил бы смысл.
- source_word: archons
  choice: архонты
  rationale: Транслитерация сохраняет специальное космологическое значение правящих сил, не отождествляя их без пояснения с земными правителями.
- source_word: deathless
  choice: бессмертный / бессмертны
  rationale: Естественное русское соответствие, сохраняющее смысл неподвластности смерти.
- source_word: indestructibility
  choice: нерушимость
  rationale: Передаёт состояние или устройство того, что невозможно разрушить, и звучит естественнее буквального «неразрушимость» в данном возвышенном контексте.
- source_word: authorities
  choice: власти
  rationale: Сохранено различие между «архонтами» и более общим обозначением правящих сверхмирных сил.
- source_word: church
  choice: церковь
  rationale: Сохранён экклезиологический термин свидетельства без замены на интерпретирующее «собрание».
- source_word: races
  choice: роды
  rationale: В космологическом контексте речь идёт о разрядах или происхождениях существ; «роды» избегает современных биологических и этнических коннотаций слова «расы».
- source_word: Holy Place
  choice: Святое место
  rationale: Буквальное и нейтральное обозначение сакральной области; прописная буква отражает его статус как особого топоса.
- source_word: hosts
  choice: воинства
  rationale: Сохраняет образ организованных небесных или космических сил.
theological_decisions:
- issue: «Верность незримому эону»
  choice: Сохранено «верность», не заменено на «вера» или «истина».
  alternative: «вера в незримый эон»
  rationale: Свидетельство допускает необычную и не вполне ясную формулировку; конфессионально привычная замена сняла бы подлинную неоднозначность.
- issue: Средство уничтожения архонтов
  choice: «посредством созданий, которым те придали облик»
  alternative: «посредством сотворённых ими существ»
  rationale: Формулировка сохраняет повторяющийся мотив придания формы и не приписывает архонтам абсолютного творения из ничего.
- issue: Ангел и местоимение в повреждённой фразе
  choice: Сохранено восстановленное <он> с отдельной сноской.
  alternative: Уточнить, что знание даёт ангел или Отец.
  rationale: Антецедент местоимения не вполне ясен; перевод не должен без основания разрешать, кто именно даёт знание.
- issue: Обличение архонтов и богов Хаоса
  choice: «обличая / обличат»
  alternative: «осуждая / осудят»
  rationale: Исходное значение допускает порицание, изобличение или осуждение; «обличать» сохраняет напряжение, не обязательно подразумевая судебный приговор.
- issue: Четвёртый, безцарный род
  choice: Сохранено парадоксальное сочетание безцарности, превосходства и последующего царствования в области смерти.
  alternative: Истолковать «без царя» как полную непричастность всякой власти.
  rationale: Текст сам удерживает это напряжение; перевод не согласовывает утверждения искусственно.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной возвышенностью. Технические термины гностической космологии («эон», «архонты») сохранены. Архаизмы ограничены устойчивыми формами вроде «пред Отцом» и «воинства». Рукописные лакуны и редакторские восстановления обозначены скобками и снабжены сносками; голый номер страницы [16] не включён, поскольку он не относится к содержанию.
