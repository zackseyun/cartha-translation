base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/005.yaml
  text: 'When the heavens had established themselves, together with their hosts and all their government, the Primal Parent grew arrogant. The entire host of angels worshiped him, and all the gods and their angels offered him praise and worship. He became elated and repeatedly boasted to them, “I am self-sufficient.”


    He said, “I am the one who is God, and apart from me nothing else exists.” When he had said this, he transgressed against all the deathless ones who speak with words, and they accused him because of it.


    When Pistis witnessed the impiety of the chief archon, she became enraged. Though unseen, she said, “You are mistaken, Samael”—that is, “Blind God.” “There is a deathless man of light who existed before you, and he will appear among the forms you have shaped. He will trample you in contempt, as a potter’s vessel is trampled, and you will plunge down to your mother, the Abyss, together with those who belong to you. For when all your works are completed, the whole deficiency exposed by the truth will be abolished. Its existence will end, and it will be as though it had never existed.”


    After saying this, Pistis revealed the likeness of her greatness in the waters. Having done this, she withdrew back up into her light.'
translation:
  language: ru
  text: 'Когда небеса утвердились вместе со своими воинствами и всем своим управлением, Прародитель возгордился. Ему поклонялось всё ангельское воинство, и все боги и их ангелы воздавали ему хвалу и поклонение. Он возликовал и снова и снова хвалился перед ними: «Я самодостаточен».


    Он сказал: «Это я — Бог, и кроме меня ничто иное не существует». Сказав это, он согрешил против всех бессмертных, наделённых речью, и они обвинили его в этом.


    Когда Пистис увидела нечестие верховного архонта, она разгневалась. Оставаясь невидимой, она сказала: «Ты заблуждаешься, Самаэль[a]», — то есть «слепой бог». — «Есть бессмертный человек света, существовавший прежде тебя, и он явится среди созданных тобою образов. Он с презрением растопчет тебя, как топчут глиняный сосуд, и ты низвергнешься к своей матери, Бездне, вместе со всеми своими. Ибо, когда завершатся все твои дела, вся ущербность, которую обнажила истина, будет упразднена. Её существование прекратится, и станет так, словно её никогда не было».


    Сказав это, Пистис явила в водах подобие своего величия. Затем она вновь поднялась и удалилась в свой свет.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Самаэль — имя, которое далее истолковано в самом тексте как «слепой бог».
    reason: Поясняет необычное имя, сохраняя внутреннее толкование текста и не добавляя спорной этимологии.
lexical_decisions:
- source_word: Primal Parent
  choice: Прародитель
  rationale: Передаёт первичное родительство персонажа без искусственного уточнения пола и без привнесения более узкого титула «Отец».
- source_word: hosts
  choice: воинства
  rationale: Сохраняет традиционное космологическое значение небесных сонмов, оставаясь понятным в контексте ангелов.
- source_word: government
  choice: управление
  rationale: Сохраняет широкое значение устроенной власти и порядка, не сводя его исключительно к властителям или чинам.
- source_word: deathless ones who use verbal articulation
  choice: бессмертные, наделённые речью
  rationale: Естественно передаёт способность к членораздельной речи, не устраняя необычность исходного определения.
- source_word: chief archon
  choice: верховный архонт
  rationale: Сохраняет технический термин «архонт», а chief передаёт как положение главы.
- source_word: forms you have shaped
  choice: созданные тобою образы
  rationale: Передаёт одновременно форму/образ и действие формирования, не конкретизируя природу этих созданий.
- source_word: deficiency
  choice: ущербность
  rationale: Сохраняет абстрактный космологический смысл недостаточности или изъяна; «ущербность» здесь понятнее, чем калька «дефицит».
- source_word: Abyss
  choice: Бездна
  rationale: Заглавная буква показывает, что это персонифицированная или космологически определённая реальность, названная матерью архонта.
- source_word: Pistis
  choice: Пистис
  rationale: Имя транслитерировано, а не переведено как «Вера», чтобы не предрешать, является ли оно здесь именем, персонификацией или понятием.
theological_decisions:
- issue: Самопровозглашение Прародителя Богом
  choice: «Это я — Бог, и кроме меня ничто иное не существует»
  alternative: «Я — единственный Бог, и кроме меня никого нет»
  rationale: Выбранная форма сохраняет напряжённое и несколько избыточное самоутверждение свидетеля, не добавляя отсутствующего слова «единственный» и сохраняя более широкое «ничто».
- issue: Характер проступка против бессмертных
  choice: «согрешил против»
  alternative: «преступил против»
  rationale: «Согрешил» естественно выражает религиозно-нравственное transgressed, но не уточняет, какой именно закон или граница были нарушены.
- issue: Способ явления человека света
  choice: «явится среди созданных тобою образов»
  alternative: «проявится в твоих формах»
  rationale: «Среди» сохраняет пространственно-коллективную неоднозначность witness и не утверждает воплощение внутри конкретной формы.
- issue: Конечная участь ущербности
  choice: «будет упразднена… словно её никогда не было»
  alternative: «будет уничтожена… словно она никогда не существовала»
  rationale: «Упразднена» сохраняет оттенок прекращения порядка или состояния и не усиливает текст до физического уничтожения.
- issue: Возвращение Пистис в свет
  choice: «вновь поднялась и удалилась в свой свет»
  alternative: «отступила обратно вверх, в свой свет»
  rationale: Передаёт вертикальное движение и возвращение естественным русским языком, не превращая его в бегство.
translation_notes:
  register: Современный литературный русский с возвышенным, но доступным повествовательным регистром. Технический термин «архонт» и имя «Пистис» сохранены как элементы особой космологии произведения. Черновик основан на предоставленном англоязычном публичном свидетеле; прямая сверка с коптским текстом Наг-Хаммади ещё требуется.
