    rationale: «Глиняный сосуд» конкретизирует potter’s vessel как глиняный, хотя предоставленный свидетель называет лишь сосуд горшечника.
  - severity: low
    issue: Ослаблено определение бессмертных
    rationale: Формула «наделённые речью» передаёт общий смысл, но не вполне сохраняет акцент witness на verbal articulation; «обладающие членораздельной речью» точнее.
  - severity: low
    issue: Не вполне точно передано возвращение Пистис
    rationale: «Вновь поднялась и удалилась» не столь ясно выражает retreat back up into her light, как «вернулась вверх, в свой свет».
