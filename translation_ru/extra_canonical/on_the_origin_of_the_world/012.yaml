lexical_decisions:
- source_word: Justice
  choice: Справедливость
  rationale: Сохранена персонификация абстрактного начала; прописная буква показывает, что оно действует как именованный субъект.
- source_word: Paradise
  choice: Рай
  rationale: Устоявшийся русский эквивалент, сохранённый как название космологического места.
- source_word: Land of Delight
  choice: Земля Наслаждения
  rationale: Формально передаёт название области и сохраняет его мифологический характер.
- source_word: lowly shaped forms
  choice: низменные телесные образы
  rationale: Передаёт уничижительный смысл lowly и идею сформированных воплощённых форм, не сводя выражение просто к «телам».
- source_word: knowledge
  choice: познание
  rationale: «Дерево познания» естественно для русского библейского регистра и не сужает смысл до набора сведений.
- source_word: lethargy of the demons
  choice: бесовское оцепенение
  rationale: Передаёт состояние духовной неподвижности естественным русским выражением, сохраняя связь с демонами.
- source_word: denounce
  choice: обличить
  rationale: Сохраняет смысл открытого осуждения и подходит возвышенному религиозному регистру; не заменено более сильным «отречься».
- source_word: authorities
  choice: власти
  rationale: Буквальный и традиционный термин для надмирных правящих сил; неоднозначность между политическим и космическим значением не устраняется пояснением в тексте.
- source_word: anointing
  choice: помазание
  rationale: Устоявшийся сакральный термин, связанный с оливой, царями и первосвященниками.
theological_decisions:
- issue: Назначение дерева познания
  choice: 'Сохранено положительное действие: оно пробуждает души и ведёт их к дереву жизни.'
  alternative: Согласовать описание с отрицательной оценкой дерева познания в отдельных библейских традициях.
  rationale: Источник прямо приписывает дереву освобождающую функцию; богословское напряжение нельзя сглаживать.
- issue: Статус «властей и их ангелов»
  choice: Оставлено без отождествления с конкретной демонологической системой.
  alternative: Назвать их архонтами или демонами.
  rationale: Свидетельство использует различимые обозначения; перевод не должен импортировать специальную интерпретацию.
- issue: Первый Адам и свет
  choice: Сохранена формула «из света первого Адама».
  alternative: Истолковать свет как духовную сущность либо сияние.
  rationale: Метафизическая связь намеренно остаётся неразъяснённой, как в доступном свидетельстве.
- issue: Священное Писание
  choice: Сохранено как утверждение самого трактата.
  alternative: Уточнить или оспорить канонический статус цитаты.
  rationale: Перевод передаёт внутреннюю аргументацию источника, не вынося конфессионального суждения.
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенным религиозным регистром. Перевод предварительный: он выполнен по предоставленному англоязычному свидетельству, поскольку прямая сверка с коптским текстом ещё не проведена. Удалены голые номера рукописных страниц [11] и [12]; единственный редакционный знак [a] помещён в основной текст.'
