translation:
  language: ru
  text: 'Затем Справедливость сотворила Рай. Он был прекрасен и находился за пределами кругов луны и солнца, в Земле Наслаждения, на востоке, среди камней. Среди прекрасных деревьев, дающих желанное насыщение, обитает желание. А к северу от Рая, по воле Бога, явилось дерево вечной жизни, чтобы души святых — тех, кто при завершении века выйдет из низменных телесных образов, — могли стать бессмертными. Цвет дерева жизни подобен солнцу, и ветви его прекрасны. Листья его подобны листьям кипариса. Плод его подобен грозди белого винограда. Высотой оно достигает неба, а рядом с ним находится дерево познания, обладающее силой Бога. Сияние его подобно луне в полнолуние, и ветви его прекрасны. Листья его подобны листьям смоковницы. Плод его подобен хорошему финику, дающему насыщение. Это дерево находится к северу от Рая, чтобы пробуждать души от бесовского оцепенения, дабы они могли приблизиться к дереву жизни, вкусить его плода и таким образом обличить власти и их ангелов.


    О воздействии этого дерева подробно сказано в священном Писании[a]: «Ты — дерево познания, которое находится в Раю, от которого вкусил первый человек и которое открыло его разум; и он полюбил свою спутницу и обличил […] другие, чуждые подобия, даже презрев их».


    После этого произросло оливковое дерево, чтобы освятить царей и первосвященников праведности, которым надлежало явиться в последние дни, поскольку оливковое дерево явилось из света первого Адама, чтобы дать им помазание, которое им предстояло получить.'
  philosophy: optimal-equivalence
