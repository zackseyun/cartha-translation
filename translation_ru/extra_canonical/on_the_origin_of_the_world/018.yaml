base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/018.yaml
  text: 'After the day of rest, Sophia sent her daughter Zoe, who is called Eve, as a teacher. She was to make Adam, who had no soul, stand up, so that those whom he would beget could become vessels of light.


    [When] [] Eve saw her male companion lying face down, she had compassion on him and said, “Adam, live! Stand up on the earth!”


    Her words were immediately fulfilled in action. Adam stood up and quickly opened his eyes. When he saw her, he said, “You will be called ‘Mother of the Living,’ because you are the one who has given me life.”'
translation:
  language: ru
  text: 'После дня покоя София послала свою дочь Зою, называемую Евой,[a] как наставницу, чтобы она подняла бездушного Адама и чтобы те, кого он породит, стали сосудами света.


    [Когда] […] [b] Ева увидела своего спутника, лежащего ничком, она сжалилась над ним и сказала: «Адам, живи! Встань на земле!»


    Сказанное ею тотчас воплотилось в действие: Адам встал и сразу открыл глаза. Увидев её, он сказал: «Тебя назовут Матерью живых, потому что именно ты дала мне жизнь».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имена «София» и «Зоя» восходят к греческим словам со значениями «Мудрость» и «Жизнь»; «Ева» далее связывается с титулом «Матерь живых».
    reason: Помогает увидеть смысловую игру имён, существенную для эпизода, не заменяя имена истолковывающими переводами в основном тексте.
  - marker: b
    text: Квадратные скобки и многоточие обозначают неуверенно восстановленное слово и утрату текста в доступном свидетеле.
    reason: Сохраняет сигнал текстуальной неопределённости, присутствующий в предоставленном исходном материале.
lexical_decisions:
- source_word: Sophia
  choice: София
  rationale: Сохранено личное имя персонажа; оно также несёт значение «Мудрость», однако переводить его только как нарицательное здесь было бы чрезмерным истолкованием.
- source_word: Zoe
  choice: Зоя
  rationale: Сохранена именная форма; заложенная в имени связь с жизнью остаётся слышимой в последующих словах о даровании жизни и поясняется в сноске.
- source_word: teacher
  choice: наставница
  rationale: Естественное современное обозначение женской роли обучения и руководства; «учительница» могло бы звучать слишком по-школьному.
- source_word: soulless
  choice: бездушный
  rationale: Передаёт отсутствие души или жизненного начала, не подменяя исходную антропологическую формулировку более узким толкованием вроде «мёртвый».
- source_word: vessels of light
  choice: сосуды света
  rationale: Сохранён конкретный и богословски значимый образ вместилища, без поясняющей замены.
- source_word: lying prostrate
  choice: лежащий ничком
  rationale: Передаёт распростёртое положение лицом вниз ясным современным выражением.
- source_word: utterance ... fulfilled in act
  choice: сказанное ею тотчас воплотилось в действие
  rationale: Сохраняет противопоставление слова и действия, избегая тяжеловесной буквальности.
- source_word: Mother of the Living
  choice: Матерь живых
  rationale: Сохранён титульный, возвышенный характер наименования и связь с последующим утверждением о даровании жизни.
theological_decisions:
- issue: Состояние Адама до вмешательства Евы
  choice: «бездушного Адама»
  alternative: «безжизненного Адама»
  rationale: Первый вариант сохраняет более резкое и неоднозначное утверждение свидетеля об отсутствии души, не сводя его лишь к физической неподвижности.
- issue: Роль Евы по отношению к Адаму
  choice: «как наставницу»
  alternative: «чтобы она научила»
  rationale: Сохранено прямое именование её роли, не ослабляющее необычную богословскую конструкцию текста.
- issue: Причинная связь между Евой и жизнью Адама
  choice: «именно ты дала мне жизнь»
  alternative: «через тебя я ожил»
  rationale: Прямая субъектность Евы сохранена, поскольку она явно выражена в доступном свидетеле; перевод не смягчает её богословское напряжение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным повествовательным регистром. Синтаксис упрощён там, где буквальное воспроизведение английского свидетеля было бы неестественным, но ключевые образы и богословские напряжения сохранены. Черновик остаётся предварительным, поскольку непосредственная сверка с коптским текстом ещё не выполнена; основанием служит предоставленный англоязычный публичнодоступный свидетель.
