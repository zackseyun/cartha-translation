  terminology: «Прародитель», «архонты», «душа», «дух», «дыхание», «Пистис», «София Зоя» и «Рай» уместны. Разведение души, духа и дыхания сохранено. Сноски к внутритекстовой этимологии, лакунарно-неопределённым местоимениям и именам полезны; сноска e должна соответствовать исправленной реплике.
  issues:
