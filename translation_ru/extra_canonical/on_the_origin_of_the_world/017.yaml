  text: 'Then the Primal Parent gave those who dwelt with him an opinion regarding the man. Each one of them then cast his sperm into the center of the navel of the earth.


    From that day, the seven archons fashioned man together with his body to resemble their own body, yet his likeness resembled the man who had appeared to them. His shaping occurred one part at a time, and their leader formed the brain as well as the nervous system.


    Afterward, he appeared like the one who had existed prior to him. He became [] a man possessing a soul, and he was called Adam, that is, “Father,” in accord with the name of the one who had existed prior to him. When they had completed Adam, he forsook him like a lifeless vessel, since he had taken on form like an abortion, without a spirit inside him.


    When the chief archon recalled the speech of Pistis, he feared that the true man might enter into his shaped form and become its lord. This is why he departed from his shaped form for forty days; it then lacked a soul. He retreated and forsook it.


    On the fortieth day, Sophia Zoe sent her breath into Adam, who was without soul. He began to move on the ground, and he was unable to stand erect.


    Next, when the seven archons arrived, they saw him and became deeply troubled. They approached him and seized him, and he spoke to the breath inside him: “Who are you? And from where did you come to here?”


    It answered and said: “I have come from the force of the man in order to ruin your work.” Upon hearing this, they glorified him, because he granted them respite from the fear and the apprehension in which they found themselves.


    They then called that day “Rest,” because they had rested from work. When they saw that Adam was able to stand erect, they rejoiced, and they took him and placed him inside Paradise, and they retreated up to their heavens.'
translation:
  language: ru
  text: 'Затем Прародитель высказал тем, кто обитал с ним, своё суждение о человеке. И каждый из них излил своё семя в середину пупа земли.


    С того дня семь архонтов вместе создавали человека и его тело по подобию собственного тела, однако обликом он был подобен человеку, который явился им. Они создавали его по частям, и их предводитель образовал головной мозг и нервную систему.


    После этого он стал выглядеть как тот, кто существовал прежде него. Он стал [] человеком, обладающим душой, и его назвали Адамом, то есть «Отцом»[a], по имени того, кто существовал прежде него. Когда они завершили Адама, он[b] оставил его, словно безжизненный сосуд, потому что тот принял облик недоноска и в нём не было духа.


    Когда главный архонт вспомнил слова Пистис[c], он испугался, что истинный человек может войти в созданный им образ и стать его господином. Поэтому он на сорок дней отошёл от созданного им образа, который тогда был без души; он удалился и оставил его.


    На сороковой день София Зоя[d] послала своё дыхание в Адама, который был без души. Он начал двигаться по земле, но не мог выпрямиться.


    Затем пришли семь архонтов. Увидев его, они сильно встревожились. Они приблизились, схватили его, и он сказал находившемуся в нём дыханию: «Кто ты и откуда пришло сюда?»[e]


    Оно ответило: «Я пришло от силы человека, чтобы разрушить ваше дело». Услышав это, они прославили его[f], потому что он избавил их от страха и тревоги, в которых они пребывали.


    Тогда они назвали тот день «Покоем», потому что отдохнули от своего труда. Увидев, что Адам может стоять прямо, они обрадовались, взяли его, поместили в Рай, а сами удалились в свои небеса.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Толкование имени «Адам» как «Отец» принадлежит самому произведению; оно не соответствует обычной этимологии древнееврейского имени.
    reason: Предотвращает принятие внутритекстовой этимологии за общепринятую языковую этимологию.
  - marker: b
    text: 'Не вполне ясно, кто именно здесь оставил Адама: предводитель архонтов или иной упомянутый деятель.'
    reason: Сохраняет местоименную неоднозначность доступного свидетельства.
  - marker: c
    text: Пистис — имя, означающее «Вера».
    reason: Поясняет значимое греческое имя без замены имени абстрактным понятием в основном тексте.
  - marker: d
    text: «София Зоя» означает «Премудрость Жизнь».
    reason: Поясняет семантику греческих имён, сохраняя их форму в тексте.
  - marker: e
    text: Вопрос обращён к «дыханию» среднего рода; поэтому ответ далее передан формами среднего рода.
    reason: Объясняет непривычное, но грамматически и референциально точное согласование.
  - marker: f
    text: 'Неясно, кого обозначает «его»: Адама, дыхание или связанного с ними высшего человека.'
    reason: Сохраняет богословски значимую неоднозначность местоимения.
lexical_decisions:
- source_word: Primal Parent
  choice: Прародитель
  rationale: Передаёт первичность и родительскую функцию без уточнения пола, насколько это позволяет естественный русский язык.
- source_word: archons
  choice: архонты
  rationale: Сохранён технический термин гностического текста; перевод «правители» мог бы затушевать его особое космологическое значение.
- source_word: navel of the earth
  choice: пуп земли
  rationale: Сохранён телесный и космологический образ источника, без рационализирующего пересказа вроде «центр земли».
- source_word: soul / spirit / breath
  choice: душа / дух / дыхание
  rationale: Три понятия разведены последовательно, поскольку их различие существенно для повествования и не должно сглаживаться.
- source_word: shaped form
  choice: созданный им образ
  rationale: Естественная русская формулировка, сохраняющая представление о сформированном вместилище; связь с создателем выражена явно по контексту.
- source_word: Paradise
  choice: Рай
  rationale: Общепонятный и традиционный русский эквивалент, уместный как название места.
theological_decisions:
- issue: Соотношение телесного образа архонтов и подобия явившегося человека
  choice: 'Сохранено различие: тело создаётся по подобию тела архонтов, а облик подобен ранее явившемуся человеку.'
  alternative: Свести оба выражения к единому «образу и подобию».
  rationale: Источник удерживает напряжение между телесным образцом архонтов и высшим человеческим прообразом.
- issue: Различие души, духа и дыхания
  choice: Термины не отождествлены.
  alternative: Передавать их одним словом «дух» или «жизнь».
  rationale: Сюжет зависит от последовательных состояний Адама и вселения дыхания Софии Зои.
- issue: Местоименная неоднозначность после завершения Адама
  choice: В основном тексте сохранено «он оставил его», а неоднозначность отмечена сноской.
  alternative: Определить субъект как главного архонта или всех семерых.
  rationale: Английское свидетельство не позволяет уверенно установить антецедент; преждевременное уточнение разрешило бы реальную текстовую неопределённость.
- issue: Кого архонты прославили
  choice: Сохранено местоимение «его» без уточнения.
  alternative: Назвать Адама, дыхание или высшего человека.
  rationale: Антецедент в доступном свидетельстве неоднозначен, а богословское истолкование не должно подменять перевод.
translation_notes:
  register: Современный литературный русский с достоинством древнего космологического повествования. Техническое слово «архонт» сохранено, а имена Пистис и София Зоя транслитерированы и пояснены. Пустые квадратные скобки [] оставлены как обозначение лакуны или неуверенной реконструкции в рукописной традиции. Поскольку прямое изучение коптского источника ещё не выполнено, проект остаётся предварительным и основан на предоставленном публичном английском свидетельстве.
