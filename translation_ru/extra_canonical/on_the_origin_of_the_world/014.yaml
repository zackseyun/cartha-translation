base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/014.yaml
  text: '[] As she desired, Sophia, who lived in the lower heaven, received authority from Pistis. She formed great shining bodies and every star, and she placed them in the sky to shine on the earth and to determine signs of time, seasons, years, months, days, nights, minutes, and so on. In this way, the whole expanse of the sky was adorned.


    Now, when Adam of Light desired to enter his light, namely, the eighth heaven, he could not do so because of the poverty that had mingled with his light. Then he created an immense aeon for himself. Within that aeon he created six aeons and their adornments, six in number, which were seven times greater than the heavens of Chaos and their adornments.


    Now all these aeons and their adornments exist within the infinity that lies between the eighth heaven and the Chaos beneath it. They are counted together with the universe that belongs to poverty.


    If you wish to learn their structure, you will find it written in the Seventh World of the Prophet Hieralias.'
translation:
  language: ru
  text: '[] По своему желанию София, обитавшая на нижнем небе, получила власть от Пистис. Она создала великие светила и все звёзды и поместила их на небе, чтобы они светили на землю и определяли знамения времён, поры, годы, месяцы, дни, ночи, минуты и всё прочее. Так украсился весь небесный простор.


    Когда же Адам Света пожелал войти в свой свет, то есть в восьмое небо, он не смог этого сделать из-за бедности[a], примешавшейся к его свету. Тогда он сотворил для себя необъятный эон, а внутри него — шесть эонов и их убранство, также числом шесть; они были в семь раз превосходнее небес Хаоса и их убранства.


    Все эти эоны и их убранство пребывают в беспредельности между восьмым небом и находящимся под ним Хаосом и причисляются ко вселенной, принадлежащей бедности.


    Если хочешь узнать об их устройстве, найдёшь это записанным в «Седьмом мире» пророка Иералия[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Бедность» здесь, вероятно, является космологическим понятием и может быть персонифицирована; перевод сохраняет неоднозначность доступного свидетеля.
    reason: Предотвращает ошибочное сведение термина лишь к материальной нищете, не навязывая статуса собственного имени.
  - marker: b
    text: Названия «Седьмой мир» и имя «Иералий» переданы по доступному английскому свидетелю; их точная коптская форма требует проверки по тексту рукописи.
    reason: Прямое сопоставление с коптским источником пока не выполнено.
lexical_decisions:
- source_word: Sophia / Pistis
  choice: София / Пистис
  rationale: Имена-титулы переданы традиционной транслитерацией, а не переведены как «Мудрость» и «Вера», поскольку в данном мифологическом повествовании они обозначают персонифицированные существа.
- source_word: large shining bodies
  choice: великие светила
  rationale: Естественное русское обозначение крупных небесных источников света; контекст отличает их от упомянутых далее звёзд.
- source_word: temporal signs, and seasons
  choice: знамения времён, поры
  rationale: Сохранены как знаковая функция небесных тел, так и отдельная категория установленных периодов; «поры» не сужены до времён года.
- source_word: aeon
  choice: эон
  rationale: Технический космологический термин сохранён транслитерацией, поскольку здесь он обозначает особую область или век бытия и не имеет одного исчерпывающего русского эквивалента.
- source_word: adornments
  choice: убранство
  rationale: Сохраняет повторяющийся образ устроенного и украшенного космоса и подходит как к небу, так и к эонам.
- source_word: infinity
  choice: беспредельность
  rationale: Передаёт пространственно-космологический смысл без современного математического оттенка слова «бесконечность».
- source_word: structure
  choice: устройство
  rationale: Нейтрально охватывает строение и порядок описанных эонов.
theological_decisions:
- issue: Статус «бедности»
  choice: бедность
  alternative: Недостаток / Бедность как собственное имя
  rationale: Сохранена буквальная и намеренно напряжённая формулировка свидетеля; контекст допускает космологически персонифицированный смысл, но имеющихся данных недостаточно, чтобы однозначно оформить слово как имя собственное.
- issue: «Свой свет», отождествлённый с восьмым небом
  choice: войти в свой свет, то есть в восьмое небо
  alternative: войти в Свет — в восьмое небо
  rationale: Сохранены притяжательное местоимение и явное пояснение источника без догматического уточнения природы этого света.
- issue: Превосходство эонов
  choice: в семь раз превосходнее
  alternative: в семь раз больше
  rationale: Английский свидетель допускает качественное или количественное сравнение; выбран более широкий вариант, не сводящий превосходство только к размеру.
- issue: Вселенная, принадлежащая бедности
  choice: вселенная, принадлежащая бедности
  alternative: мир Недостатка
  rationale: Сохранена необычная принадлежность и космологическое напряжение исходного свидетельства без интерпретирующего переименования.
translation_notes:
  register: 'Современный литературный русский с достоинством древнего космологического повествования. Синтаксис упрощён лишь там, где это улучшает ясность, при сохранении повторов ключевых терминов. Начальные квадратные скобки оставлены как переданный свидетелем сигнал лакуны или редакционного восстановления. Проект предварительный: он основан на публичном английском свидетеле, поскольку проверка по коптскому оригиналу ещё ожидается.'
