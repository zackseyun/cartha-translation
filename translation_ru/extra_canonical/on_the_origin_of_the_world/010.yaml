base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/010.yaml
  text: 'When the Primal Parent saw how beautifully the light glowed, he was astonished and became deeply ashamed. As that light came forth, a truly wondrous human likeness appeared within it. No one saw it except the Primal Parent and Pronoia, who lived with him. Nevertheless, its light appeared to all the hosts of heaven, and because of this they were all troubled.


    When Pronoia saw that messenger, she fell in love with him. But he loathed her because she lived in darkness. She wanted to embrace him, but she could not. When she could not quench her love, she poured out her light upon the earth. From that day, that messenger has been called “Adam of Light,” which translated means “the radiant man of blood.” And the earth was spread out above him, [7] the holy Adaman, which translated means “the Holy Land of the Adamantine.”


    From that day, every authority has honored the blood of the virgin, and the earth was purified because of the blood of the virgin. In addition, the water was purified through the likeness of Pistis Sophia, who had appeared to the Primal Parent within the waters. Therefore, it has rightly been said, “(it appeared) through the waters.” Because it gives life to everything, [] the holy water purifies everything.'
translation:
  language: ru
  text: 'Когда Прародитель увидел, как прекрасно сияет свет, он изумился и испытал глубокий стыд. Когда этот свет явился, внутри него возник удивительный человеческий образ. Никто не видел его, кроме Прародителя и жившей с ним Пронойи. Однако его свет стал виден всем небесным воинствам, и оттого все они пришли в смятение.


    Увидев того вестника, Пронойя влюбилась в него. Но он питал к ней отвращение, потому что она жила во тьме. Она хотела обнять его, но не смогла. Не в силах угасить свою любовь, она излила свой свет на землю. С того дня того вестника называют «Адамом Света», что в переводе означает «сияющий человек крови». А над ним простёрлась земля — святой Адаман[a], что в переводе означает «Святая Земля Адамантовая».


    С того дня всякая власть чтит кровь девы, и благодаря крови девы земля очистилась. Кроме того, вода очистилась посредством образа Пистис Софии[b], явившегося Прародителю в водах. Поэтому справедливо сказано: «[Он явился] через воды»[c]. Поскольку святая вода даёт жизнь всему, она всё очищает[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Адаман» и «Адамантовая» передают словесную игру исходного свидетельства. Точное написание и этимологическое толкование требуют сверки с коптским текстом. Стоявшее в предоставленном свидетельстве обозначение страницы рукописи [7] в основной текст не включено.
    reason: Нужно объяснить необычное имя, переводной глосс и удаление вторичного номера страницы.
  - marker: b
    text: Имя «Пистис София» можно буквально понять как «Вера-Премудрость», однако здесь оно сохранено как имя собственное.
    reason: Сохранение лексико-богословской неоднозначности.
  - marker: c
    text: 'В предоставленном английском свидетельстве сказано: «(it appeared) through the waters»; подлежащее неясно, а слова «Он явился» представляют собой редакционное восполнение.'
    reason: Исходное свидетельство явно отмечает восполнение скобками и допускает несколько антецедентов.
  - marker: d
    text: Заключительная фраза в предоставленном свидетельстве содержит пустые квадратные скобки, вероятно указывающие на лакуну или неуверенность восстановления. Здесь она передана связно; окончательное решение требует проверки коптской рукописи.
    reason: Читатель должен знать о текстологической неопределённости, не воспроизведённой как немая лакуна в гладком основном тексте.
lexical_decisions:
- source_word: Primal Parent
  choice: Прародитель
  rationale: Передаёт первичность и родительскую функцию персонажа без уточнения пола и без привнесения более привычного богословского титула «Отец».
- source_word: Pronoia
  choice: Пронойя
  rationale: Сохранено как имя собственное в принятой русской транслитерации; перевод «Промысл» мог бы преждевременно устранить персонификацию и грамматический женский род персонажа.
- source_word: human likeness
  choice: человеческий образ
  rationale: Сохраняет значение подобия или явленного образа, не отождествляя его безоговорочно с телесным человеком.
- source_word: messenger
  choice: вестник
  rationale: Нейтрально передаёт функцию посланника, не навязывая более специального обозначения «ангел».
- source_word: Adam of Light
  choice: Адам Света
  rationale: Формально сохраняет титул и его связь со следующим авторским толкованием.
- source_word: radiant man of blood
  choice: сияющий человек крови
  rationale: Сохраняет необычную и, вероятно, этимологическую формулу свидетеля, не сглаживая её до более естественной, но толковательной конструкции.
- source_word: Adaman / Adamantine
  choice: Адаман / Адамантовая
  rationale: Сохранена словесная игра имени и прилагательного. «Адамантовая» передаёт связь с адамантом, хотя точная этимология требует сверки с коптским текстом.
- source_word: authority
  choice: власть
  rationale: Сохраняет технически возможное наименование космической силы и одновременно общую семантику исходного свидетельства.
- source_word: Pistis Sophia
  choice: Пистис София
  rationale: Имя сохранено транслитерацией, чтобы не решить за текст, следует ли понимать его как собственное имя или как выражение «Вера-Премудрость».
theological_decisions:
- issue: К кому относится местоимение в выражении «его свет»
  choice: Сохранено «его свет» без пояснения, относится ли оно к свету как явлению или к человеческому образу/вестнику.
  alternative: «Свет этого образа» или «этот свет».
  rationale: Английский свидетель допускает неоднозначность антецедента; её не следует устранять без проверки коптского текста.
- issue: Характер Пронойи
  choice: Пронойя представлена как персонаж с женским грамматическим родом, без отождествления с христианским учением о Промысле.
  alternative: Перевести имя как «Промысл» или «Предведение».
  rationale: Транслитерация сохраняет мифологическую и персонифицированную функцию имени без конфессионального переосмысления.
- issue: «Кровь девы» и очищение стихий
  choice: Формулировка сохранена буквально и без христологического либо сакраментального пояснения.
  alternative: Истолковать кровь как менструальную, жертвенную или символическую.
  rationale: Сам отрывок не даёт достаточного основания выбрать одно из возможных толкований.
- issue: Цитата о явлении через воды
  choice: Подразумеваемое подлежащее передано как «[Он явился]» с редакционными скобками.
  alternative: «Это явилось через воды» или «она явилась через воды».
  rationale: В свидетельстве подлежащее восстановлено и остаётся неясным; квадратные скобки прямо отмечают редакционное восполнение.
- issue: Святая вода как подлежащее заключительной фразы
  choice: 'Фразы объединены естественным русским синтаксисом: «Поскольку святая вода даёт жизнь всему, она всё очищает».'
  alternative: 'Сохранить разрыв и лакуну: «Поскольку она даёт жизнь всему, […] святая вода очищает всё».'
  rationale: Порядок английского свидетельства, вероятно, отражает повреждение или редакционную реконструкцию. Связный перевод возможен, но отмечен сноской из-за отсутствия прямой сверки с коптским источником.
translation_notes:
  register: Современный литературный русский язык с достоинством и умеренной формальностью. Синтаксис упрощён там, где английский свидетель тяжеловесен, но повтор ключевых слов «свет», «явился», «кровь девы», «очистилась» сохранён. Мифологические имена транслитерированы, а не подменены конфессионально нагруженными эквивалентами. Проект остаётся предварительным, поскольку заявленная прямая проверка коптского источника ещё не выполнена.
