base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/021.yaml
  text: 'Allow me to say next that, once the archons had seen him and the female being who lived with him unknowingly going astray like beasts, they were extremely happy.


    When they learned that the deathless man would not ignore them, they became upset, because they would instead have to fear the female being who had turned herself into a tree. They said, “Perhaps this is the real man, this being who cast a mist over us and taught us that she who had been defiled resembles him. Then we will be defeated.”


    Then all seven devised schemes together. They nervously approached Adam and Eve and said to him, “You may eat the fruit of any of the trees created for you in Paradise. But concerning the tree of knowledge, restrain yourself and do not eat from it. If you eat, you will die.” After causing deep anxiety within them, they withdrew to their authorities.


    Then the cleverest of all creatures approached, the one called “Beast.” When he saw the likeness of their mother Eve, he said to her, “What did God say to you? Was it, ‘Do not eat from the tree of knowledge’?”


    She said, “He not only said, ‘Do not eat from it,’ but also, ‘Do not touch it, or you will die.’”


    He said to her, “Do not be afraid. With death you will not die, because he knows that when you eat [] from it, your reasoning will become sober, and you will become like gods, knowing the difference between evil and good humans. In fact, he said this to you out of jealousy, to keep you from eating from it.”


    Eve now had confidence in the teacher’s words. She looked at the tree and recognized that it was beautiful and satisfying, and she desired it. She took some of its fruit and ate it. She also gave some to her husband, and he ate it as well. Then their minds were opened, because when they ate, the light of knowledge shone upon them. When they clothed themselves with embarrassment, they realized that they were naked without knowledge. When they became sober, they realized that they were naked, and they fell in love with each other. When they realized that those who had shaped them had the forms of beasts, they hated them. They had become acutely aware.'
translation:
  language: ru
  text: '**О происхождении мира — Древо познания**


    Позвольте мне далее сказать: когда архонты увидели, что он и жившая с ним женщина, сами того не ведая, блуждают, словно звери, они чрезвычайно обрадовались.


    Но, узнав, что бессмертный человек не оставит их без внимания, они встревожились: теперь им самим придётся бояться женщины, превратившей себя в дерево. Они сказали: «Возможно, это и есть настоящий человек — та, что окутала нас туманом и показала нам, что осквернённая подобна ему. Тогда мы будем побеждены».


    И тогда все семеро сообща замыслили свои козни. Они с тревогой приблизились к Адаму и Еве и сказали ему[b]: «Вы можете есть плоды любого из деревьев, созданных для вас в Раю. Но что касается древа познания — воздержись и не ешь от него. Если съешь, то умрёшь». Посеяв в них глубокую тревогу, они удалились к своим властям.


    Тогда приблизилось самое разумное из всех творений, называемое Зверем. Увидев образ их матери Евы, оно сказало ей: «Что сказал вам Бог? Неужели: “Не ешьте от древа познания”?»


    Она ответила: «Он сказал не только: “Не ешьте от него”, но и: “Не прикасайтесь к нему, иначе умрёте”».


    Оно сказало ей: «Не бойтесь: смертью вы не умрёте. Ведь он знает, что, когда вы вкусите от него[a], ваш разум отрезвеет и вы станете подобны богам, различая злых и добрых людей. На самом деле он сказал вам это из ревности, чтобы вы не ели от него».


    И Ева прониклась доверием к словам учителя. Она посмотрела на дерево и поняла, что оно прекрасно, приятно и желанно для неё. Она взяла его плод и съела. Дала также своему мужу, и он тоже съел. Тогда их разум открылся, потому что, когда они вкусили плод, их озарил свет знания. Облекшись в стыд, они поняли, что наги и лишены знания. Отрезвев, они осознали, что наги, и полюбили друг друга. А когда они поняли, что создавшие их имеют облик зверей, то возненавидели их. Они обрели острую осознанность.


    [a] В доступном английском свидетельстве после слов «вкусите» отмечена лакуна или место с неуверенным восстановлением.


    [b] В свидетельстве употреблено единственное число: архонты подошли к Адаму и Еве, но обратились «к нему». Эта грамматическая неровность сохранена.'
