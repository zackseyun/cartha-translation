lexical_decisions:
- source_word: archons
  choice: архонты
  rationale: Сохранён устойчивый термин для правящих космических сил в наг-хаммадийской литературе; замена на «правители» могла бы стереть специфический контекст.
- source_word: deathless man
  choice: бессмертный человек
  rationale: Передаёт буквальное противопоставление смертности без догматического уточнения личности этого персонажа.
- source_word: female being / woman
  choice: женщина
  rationale: В русском контексте естественно передаёт женское существо и согласуется с дальнейшим отождествлением с Евой; искусственное «женская сущность» было бы тяжеловесным.
- source_word: Beast
  choice: Зверь
  rationale: Сохранено как именующее обозначение персонажа с прописной буквы, а не как обычное нарицательное.
- source_word: your reasoning will grow sober
  choice: ваш разум отрезвеет
  rationale: Сохранена образность пробуждения от опьянения, повторяющаяся далее в повествовании.
- source_word: as gods
  choice: подобны богам
  rationale: Сохранено множественное число доступного свидетельства без гармонизации с иной библейской формулировкой.
- source_word: knowing the difference between evil and good humans
  choice: различая злых и добрых людей
  rationale: Передано именно различение людей, а не отвлечённых категорий добра и зла, как указано в доступном свидетельстве.
- source_word: light of knowledge
  choice: свет знания
  rationale: Сохранена центральная для отрывка метафора знания как озаряющего света.
- source_word: acutely aware
  choice: обрели острую осознанность
  rationale: Передаёт усиленное состояние сознания, хотя выражение остаётся необычным, как и формулировка свидетельства.
theological_decisions:
- issue: Кто назван «настоящим человеком»
  choice: 'Сохранена двусмысленная связь выражения с женщиной, превратившейся в дерево: «это и есть настоящий человек — та, что…»'
  alternative: Согласовать грамматику и представить «настоящего человека» отдельным мужским персонажем.
  rationale: Доступное свидетельство смешивает мужское обозначение «man» и женскую референцию «this being / she»; перевод не должен молча устранять эту смысловую напряжённость.
- issue: Оценка древа и поступка Евы
  choice: События изложены в положительных для знания образах самого трактата без богословской коррекции по каноническому рассказу Бытия.
  alternative: Смягчить или переосмыслить обретение знания как исключительно греховное падение.
  rationale: Перевод должен отражать собственную перспективу древнего произведения и не вносить конфессиональную гармонизацию.
- issue: Формула о смерти
  choice: «смертью вы не умрёте»
  alternative: Естественное «вы вовсе не умрёте».
  rationale: Формально необычный оборот сохраняет эмфатическую конструкцию свидетельства и её связь с традиционной формулой рассказа о Рае.
- issue: «Создавшие их» и звериный облик
  choice: Сохранено множественное число и отрицательная оценка создателей людей.
  alternative: Отождествить создателя с единым Богом или заменить формулировку нейтральной.
  rationale: Множественность создателей и их звериный облик существенны для космологии произведения; их нельзя согласовывать с иной богословской системой.
translation_notes:
  register: Современный литературный русский язык с достоинством древнего повествования и умеренно формальной синтаксической структурой. Термин «архонты» сохранён как контекстуально значимый. Проект основан на предоставленном публично-доступном английском свидетельстве; прямая сверка с коптским текстом Наг-Хаммади пока не выполнена, поэтому спорные места отмечены осторожно и без чрезмерной реконструкции.
