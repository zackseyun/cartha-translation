base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/006.yaml
  text: 'But the Lord says, “No servant can serve two masters.” If we desire to serve both God and wealth, it is of no benefit to us.


    For what advantage is there if someone gains the whole world and forfeits his soul?


    Now this age and the age to come are two enemies.


    The one speaks of adultery, defilement, greed, and deceit, but the other bids these things farewell.


    Therefore, we cannot be friends with both. We must bid farewell to one and keep company with the other.


    Let us consider that it is better to hate the things that are here, because they are worthless, short-lived, and perishable, and to love the things that are there, because they are good and imperishable.


    For if we do the will of Christ, we will find rest. But if we do not, then nothing will deliver us from eternal punishment if we disobey his commandments.


    Scripture also says in Ezekiel, “Even if Noah, Job, and Daniel should rise up, they will not deliver their children in the captivity.”


    But if even righteous men such as these cannot deliver their children by their righteous deeds, with what confidence will we enter the kingdom of God if we do not keep our baptism pure and undefiled? Or who will be our advocate unless we are found to have holy and righteous works?'
translation:
  language: ru
  text: 'Но Господь говорит: «Никакой слуга не может служить двум господам». Если мы хотим служить и Богу, и богатству[a], это не принесёт нам пользы.


    Ведь какая польза человеку, если он приобретёт весь мир, но погубит свою душу?


    Нынешний век и будущий — враги друг другу.


    Один говорит о прелюбодеянии, нечистоте, алчности и обмане, а другой велит со всем этим распрощаться.


    Поэтому мы не можем быть друзьями обоих: мы должны распрощаться с одним и держаться другого.


    Будем же считать, что лучше отвергать здешнее, потому что оно ничтожно, недолговечно и тленно, и любить то, что ожидает нас там, потому что оно благо и нетленно.


    Ведь если мы исполняем волю Христа, то обретём покой. Если же нет, то ничто не избавит нас от вечного наказания, если мы не повинуемся Его заповедям.


    И Писание говорит у Иезекииля: «Даже если бы восстали Ной, Иов и Даниил, они не избавили бы своих детей из плена»[b].


    Но если даже такие праведники не могут избавить своих детей своими праведными делами, то с какой уверенностью войдём в Царство Божье мы, если не сохраним своё крещение чистым и незапятнанным? И кто будет нашим заступником, если не окажется, что у нас есть святые и праведные дела?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «маммоне» — богатству или имуществу, которому служат как господину.'
    reason: Сохраняет связь с традиционной формой евангельского изречения и поясняет смысл заменённого заимствования.
  - marker: b
    text: Цитата передаётся в форме, приведённой автором; ср. Иез. 14:14, 16, 18, 20. В книге Иезекииля названы Ной, Даниил и Иов, а речь идёт о спасении сыновей и дочерей, не о плене в такой точной формулировке.
    reason: Отмечает расхождение цитаты с известным текстом Иезекииля, не исправляя древнего автора молча.
lexical_decisions:
- source_word: mammon
  choice: богатство
  rationale: Передаёт смысл арамейского заимствования понятным современным русским словом, не превращая богатство в имя собственное.
- source_word: this age / the future
  choice: нынешний век / будущий
  rationale: Сохраняет раннехристианское противопоставление двух веков и его эсхатологическую окраску.
- source_word: find rest
  choice: обретём покой
  rationale: Сохраняет богословски насыщенный образ покоя, не сужая его до бытового отдыха.
- source_word: keep our baptism pure and undefiled
  choice: сохраним своё крещение чистым и незапятнанным
  rationale: 'Сохраняет необычную метонимию источника: речь идёт именно о сохранении крещения, а не о свободно истолкованной «крещальной жизни».'
- source_word: advocate
  choice: заступник
  rationale: Естественное религиозно-нравственное обозначение того, кто выступает в защиту, без добавления конкретной христологической идентификации.
theological_decisions:
- issue: Связь послушания, дел и вхождения в Царство
  choice: Сохранена прямая условная и увещательная формулировка текста.
  alternative: Ослабить её пояснением, что дела лишь свидетельствуют о вере или спасении.
  rationale: Источник оставляет напряжение между заповедями, праведными делами, крещением и вхождением в Царство; перевод не должен навязывать позднейшую конфессиональную схему.
- issue: Личность возможного заступника
  choice: Оставлено неопределённое «кто будет нашим заступником».
  alternative: Назвать Христа или иного небесного ходатая.
  rationale: Сам отрывок не называет заступника, поэтому неопределённость следует сохранить.
- issue: «Ненавидеть» здешнее
  choice: Передано как «отвергать здешнее».
  alternative: Буквальное «ненавидеть здешнее».
  rationale: В контексте этического противопоставления двух веков выражение обозначает отказ от привязанности и выбора; «отвергать» естественно передаёт прагматический смысл, не создавая впечатления призыва ненавидеть творение как таковое.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис умеренно формальный, но без архаизмов вроде «ибо», «сей» и «дабы». Цитатные формулы и параллелизм сохранены. Поскольку предоставленный drafting basis прямо отмечает, что непосредственная сверка с греческим источником ещё не выполнена, draft остаётся предварительным и не претендует на разрешение текстологических вопросов.
