base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/001.yaml
  text: 'Brethren, we ought to think of Jesus Christ as of God, as the Judge of the living and the dead.


    And we ought not to think mean things of our Salvation; for when we think mean things of Him, we also expect to receive mean things. And those who listen as concerning mean things do wrong; and we ourselves do wrong, not knowing whence and by whom and unto what place we were called, and how many things Jesus Christ endured to suffer for our sakes.


    What recompense, then, shall we give to Him? Or what fruit worthy of His own gift to us? And how many mercies do we owe to Him!


    For He bestowed the light upon us; He spoke to us as a father to his sons; He saved us when we were perishing.


    What praise, then, shall we give to Him? Or what payment of recompense for those things which we received?


    We were maimed in our understanding, and worshipped stocks and stones and gold and silver and bronze, the works of men; and our whole life was nothing else but death. While we were thus wrapped in darkness and oppressed with this thick mist in our vision, we recovered our sight, putting off by His will the cloud in which we were wrapped.


    For He had mercy on us and, in His compassion, saved us, having beheld in us much error and perdition, even when we had no hope of salvation except that which came from Him.


    For He called us when we were not, and from not being He willed us to be.'
translation:
  language: ru
  text: 'Братья, нам следует думать об Иисусе Христе как о Боге, как о Судье живых и мёртвых.


    И нам не следует низко ценить своё спасение, потому что, если мы низко ценим Его, то и получить ожидаем малое. И те, кто слушает это как нечто маловажное, грешат; грешим и мы, не понимая, откуда, Кем и куда были призваны и сколько страданий Иисус Христос претерпел ради нас.


    Чем же мы воздадим Ему? Какой плод принесём, достойный дара, который Он дал нам? И сколь многими милостями мы Ему обязаны!


    Ведь Он даровал нам свет; говорил с нами, как отец со своими сыновьями; спас нас, когда мы погибали.


    Какую же хвалу мы воздадим Ему? И чем отплатим за то, что получили?


    Мы были увечны разумом и поклонялись дереву, камню, золоту, серебру и бронзе — делам человеческих рук; и вся наша жизнь была не чем иным, как смертью. Окутанные тьмой, с глазами, застланными густым туманом, мы прозрели: по Его воле с нас спала пелена, которой мы были окутаны.


    Он помиловал нас и по Своему состраданию спас, увидев, как глубоко мы заблуждались и погибали, хотя у нас не было никакой надежды на спасение, кроме той, что пришла от Него.


    Он призвал нас, когда нас не было, и пожелал, чтобы мы из небытия пришли к бытию.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Когда нас не было… из небытия пришли к бытию» можно понимать как речь о даровании существования, о призвании прежде не принадлежавших Божьему народу или о переходе из духовного небытия к новой жизни; краткая формула сама по себе не уточняет смысл.
    reason: Сохраняет существенную смысловую неоднозначность заключительной фразы и предостерегает от преждевременного догматического уточнения.
lexical_decisions:
- source_word: ἀδελφοί
  choice: Братья
  rationale: Естественное и достойное обращение; сохраняет семейный язык раннехристианской общины.
- source_word: μικρά / μικρὰ φρονεῖν
  choice: низко ценить / как нечто маловажное / малое
  rationale: Повтор корня передан варьированно ради естественного русского, сохраняя сквозную мысль о недооценке Христа, спасения и услышанного возвещения.
- source_word: σωτηρία
  choice: спасение
  rationale: Основной и контекстуально точный русский эквивалент.
- source_word: ξύλα καὶ λίθους
  choice: дереву, камню
  rationale: Передаёт материал идолов, а не буквально «брёвна»; единственное число употреблено собирательно и естественно по-русски.
- source_word: ἀναβλέψαμεν
  choice: мы прозрели
  rationale: Сохраняет одновременно образ возвращённого зрения и духовного просвещения.
- source_word: ἐκ τοῦ μὴ εἶναι ... εἶναι
  choice: из небытия пришли к бытию
  rationale: Формально сохраняет онтологическую формулу и не сводит её к одному возможному толкованию.
theological_decisions:
- issue: Наименование Иисуса Христа Богом и Судьёй живых и мёртвых
  choice: как о Боге, как о Судье живых и мёртвых
  alternative: как о боге / как о Боге и Судье
  rationale: Сохранено прямое и неоговорённое утверждение текста без конфессионального пояснения или ослабления.
- issue: Референт местоимения в высказывании о «малом»
  choice: если мы низко ценим Его
  alternative: если мы низко ценим спасение
  rationale: Свидетель и известная греческая форма допускают напряжение между Христом и спасением; местоимение сохранено, а не заменено истолкованием.
- issue: Призвание тех, «кого не было»
  choice: когда нас не было ... из небытия пришли к бытию
  alternative: когда мы ещё не существовали как народ / были ничем
  rationale: Не разрешает двусмысленность в пользу творения из ничего, обращения язычников или образования народа Божьего.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным церковно-нравственным регистром. Синтаксис местами упрощён ради ясности, риторические вопросы и повторения сохранены. Черновик сверялся с общедоступным английским свидетельством и известной греческой традицией; перед публикацией желательна полная построчная проверка критического греческого текста.
