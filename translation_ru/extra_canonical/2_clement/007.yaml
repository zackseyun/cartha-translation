base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/007.yaml
  text: 'So then, my brethren, let us compete, knowing that the contest is near at hand; and though many resort to corruptible contests, not all are crowned, but only those who have toiled hard and competed bravely.


    Let us then compete, that we all may be crowned.


    Therefore let us run in the straight course, the incorruptible contest. Let us resort to it in throngs and compete, that we too may be crowned. And if we cannot all be crowned, let us at least come near to the crown.


    We ought to know that one who competes in a corruptible contest, if found dealing corruptly with it, is first flogged and then removed and driven out of the racecourse.


    What do you think? What shall be done to one who has dealt corruptly with the contest of incorruption?


    For concerning those who have not kept the seal, he says, “Their worm shall not die, and their fire shall not be quenched, and they shall be a spectacle unto all flesh.”'
translation:
  language: ru
  text: 'Итак, братья мои, будем состязаться, зная, что состязание уже близко. Ведь многие выходят на тленные состязания, но венчаются не все, а лишь те, кто много потрудился и состязался доблестно.


    Будем же состязаться, чтобы всем нам получить венец.


    Поэтому побежим прямым путём в нетленном состязании. Будем во множестве выходить на него и состязаться, чтобы и нам получить венец. А если не все мы можем получить венец, то хотя бы приблизимся к нему.


    Мы должны знать: если участвующий в тленном состязании будет уличён в нечестной борьбе, его сначала бичуют, а затем удаляют и изгоняют со стадиона.


    Как вы думаете, что будет сделано с тем, кто поступил нечестно в нетленном состязании?


    Ведь о тех, кто не сохранил печати, Он говорит: «Червь их не умрёт, и огонь их не угаснет, и будут они зрелищем для всякой плоти».[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ср. Ис. 66:24. Последняя фраза следует форме цитаты, засвидетельствованной во 2 Клименте; её точное греческое чтение и соотношение с текстом Исайи требуют сверки с греческой рукописной традицией.
    reason: Указывает источник цитаты и честно отмечает, что представленный исходный материал основан на английском свидетеле, а прямая проверка греческого текста ещё не выполнена.
lexical_decisions:
- source_word: contest / contend (Greek review pending)
  choice: состязание / состязаться
  rationale: Сохраняет сквозной атлетический образ и связь с венцом и стадионом; звучит естественно в современном литературном русском.
- source_word: corruptible
  choice: тленный
  rationale: Передаёт противопоставление преходящего и нетленного, не сводя смысл лишь к нравственной испорченности.
- source_word: crowned / crown
  choice: получить венец / венец
  rationale: «Венец» сохраняет античный образ награды победителю и его раннехристианские ассоциации.
- source_word: straight course
  choice: прямым путём
  rationale: Сохраняет пространственно-нравственную двусмысленность образа, хотя точная греческая формулировка требует проверки.
- source_word: seal
  choice: печать
  rationale: Буквально сохраняет раннехристианский образ, не определяя без достаточных оснований его точное сакраментальное или эсхатологическое значение.
- source_word: all flesh
  choice: всякая плоть
  rationale: Сохраняет библейскую формулу цитаты и её коллективный охват.
theological_decisions:
- issue: Значение «печати»
  choice: Оставлено как «печать» без поясняющей подстановки
  alternative: Передать как крещение, исповедание веры или знак принадлежности Богу
  rationale: Контекст допускает богословские ассоциации, но сам текст их здесь однозначно не устанавливает.
- issue: Возможность получить венец всем
  choice: Сохранено напряжение между призывом всем получить венец и условной фразой «если не все мы можем»
  alternative: Сгладить как чисто риторическое увещание
  rationale: Авторская логика содержит реальное напряжение, которое не следует устранять переводом.
- issue: Местоимение при цитате
  choice: «Он говорит» с прописной буквы
  alternative: «он говорит» без явного указания на Бога
  rationale: Формула вводит авторитетное пророческое изречение; прописная буква отражает вероятного подразумеваемого божественного говорящего, не добавляя имени.
- issue: Образ наказания
  choice: Сохранены червь, неугасимый огонь и публичное зрелище
  alternative: Обобщить как вечное наказание
  rationale: Конкретная образность и её богословская напряжённость принадлежат тексту и не должны быть гармонизированы.
translation_notes:
  register: 'Современный литературный русский с достоинством раннехристианского увещания. Сквозная атлетическая метафора передана последовательно: состязание, венец, стадион. Архаизмы сведены к библейски значимым словам «венец», «печать», «плоть». Черновик остаётся предварительным, поскольку предоставленный источник является английским публично-доменным свидетелем, а прямая сверка с греческим текстом ожидается.'
