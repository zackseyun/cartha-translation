review_pass:
  verdict: revise
  source_fidelity: Сквозной образ атлетического состязания, противопоставление тленного и нетленного, венец, «печать» и цитата Ис. 66:24 переданы в целом верно. Однако «во множестве выходить на него» неестественно и недостаточно ясно передаёт призыв приходить/стекаться к состязанию толпами; «нечестная борьба» излишне сужает более общее нарушение правил состязания. «Прямой путь» также несколько ослабляет образ бега/дорожки, присутствующий в свидетельстве и, вероятно, в греческом атлетическом словаре.
  naturalness: Текст в целом литературен и выдержан по регистру. Следует исправить неудачное «во множестве выходить на него» и сделать формулировку о дисциплинарном проступке более естественной для спортивного контекста. «Будем бежать прямым бегом» сохраняет образ, хотя намеренная необычность обусловлена метафорой оригинала.
  terminology: «Состязание», «тленный/нетленный», «венец», «печать», «всякая плоть» удачны и последовательны. «Печать» правильно оставлена без конфессионального истолкования. Прописная буква в «Он говорит» допустима в русском библейском регистре, но не обязательна; она сохранена как отсылка к Богу в пророческой формуле.
  issues:
  - severity: medium
    issue: Неестественная конструкция «Будем во множестве выходить на него».
    rationale: Она звучит не по-русски и неясно обозначает отношение участников к состязанию. Свидетельство говорит о массовом приходе/стечении к нему; «будем приходить на него толпами» передаёт это прямо.
  - severity: medium
    issue: «Будет уличён в нечестной борьбе» сужает смысл проступка.
    rationale: Формула свидетельства обозначает нечестное/неправомерное обращение с состязанием, то есть нарушение его правил, не обязательно манеру ведения именно «борьбы». «Нарушит правила состязания» точнее в русском.
  - severity: low
    issue: «Прямым путём» ослабляет атлетический образ бега.
    rationale: 'В контексте состязания предпочтительно сохранить беговую образность: «будем бежать прямым бегом — в нетленном состязании». Необычность конструкции отражает сжатую метафору источника.'
  revised_text: 'Итак, братья мои, будем состязаться, зная, что состязание уже близко. Ведь многие приходят на тленные состязания, но венчаются не все, а лишь те, кто много потрудился и доблестно состязался.


