base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/004.yaml
  text: 'Therefore, let us not only call him Lord, for this will not save us:


    For he says, “Not everyone who says to me, ‘Lord,’ will be saved, but the one who does righteousness.”


    So then, brethren, let us confess him by our works: by loving one another, by not committing adultery, nor speaking evil against one another, nor envying, but by being temperate, merciful, and kind. We ought to have fellow-feeling for one another and not be covetous. By these works let us confess him, and not by the contrary.


    And we ought to fear not men but God.


    For this cause, if you do these things, the Lord said, “Though you are gathered together with me in my bosom, if you do not do my commandments, I will cast you away and say to you, ‘Depart from me; I do not know you, whence you are, workers of iniquity.’”'
translation:
  language: ru
  text: '4 Итак, не будем лишь называть Его Господом, ведь это нас не спасёт.


    Ибо Он говорит: «Не всякий, кто говорит Мне: „Господи“, будет спасён, но тот, кто поступает праведно».


    Итак, братья, будем исповедовать Его своими делами: любить друг друга, не прелюбодействовать, не злословить друг друга и не завидовать, но быть воздержанными, милосердными и добрыми. Нам следует сочувствовать друг другу и не быть корыстолюбивыми. Будем исповедовать Его этими делами, а не противоположными им.


    И бояться нам следует не людей, а Бога.


    Поэтому, если вы поступаете так, но не исполняете Моих заповедей, Господь сказал: «Даже если вы собраны со Мной у Меня на груди,[a] Я отвергну вас и скажу вам: „Отойдите от Меня; Я не знаю, откуда вы, творящие беззаконие“».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «со Мной на Моей груди»; смысл необычного образа не вполне ясен. Вероятно, речь идёт о предельной близости к Господу или принадлежности к собранию вокруг Него.'
    reason: Сохраняет трудное чтение и его образность, одновременно предупреждая читателя о смысловой неопределённости.
lexical_decisions:
- source_word: call Him Lord
  choice: называть Его Господом
  rationale: Передаёт различие между одним лишь устным именованием и последующим исповеданием делами.
- source_word: doeth righteousness
  choice: поступает праведно
  rationale: Естественно по-русски передаёт деятельный смысл выражения, не сводя его к отвлечённому качеству.
- source_word: confess Him in our works
  choice: исповедовать Его своими делами
  rationale: Сохраняет богословски значимый глагол «исповедовать» и поясняет средство исповедания.
- source_word: temperate
  choice: воздержанными
  rationale: Передаёт нравственное самообладание, а не только умеренность в одном частном отношении.
- source_word: fellow-feeling
  choice: сочувствовать друг другу
  rationale: Современное и понятное выражение взаимного участия и сострадания.
- source_word: covetous
  choice: корыстолюбивыми
  rationale: Охватывает жадное стремление к приобретению и выгоде шире, чем просто скупость.
- source_word: in My bosom
  choice: у Меня на груди
  rationale: Сохраняет телесный и образный характер необычного выражения, не истолковывая его как абстрактную близость.
- source_word: workers of iniquity
  choice: творящие беззаконие
  rationale: Сохраняет активный характер формулы и её связь с евангельской речью.
theological_decisions:
- issue: Связь спасения с праведными делами
  choice: «будет спасён, но тот, кто поступает праведно»
  alternative: «спасётся лишь исполняющий волю Отца»
  rationale: Сохранена формулировка данного свидетеля без гармонизации с канонической параллелью и без ослабления напряжения между исповеданием и делами.
- issue: Исповедание Христа делами
  choice: Сохранено прямое «исповедовать Его своими делами»
  alternative: «свидетельствовать о Нём делами»
  rationale: «Исповедовать» удерживает религиозный вес выражения и противопоставление пустому обращению «Господи».
- issue: Необычное изречение о собрании у груди Господа
  choice: Образ сохранён буквально с примечанием
  alternative: «даже если вы пребываете рядом со Мной»
  rationale: Неясный образ не следует молча рационализировать или сводить к общему понятию близости.
- issue: Условная структура заключительного изречения
  choice: «если вы поступаете так, но не исполняете Моих заповедей»
  alternative: «если вы сделаете это... и не исполните»
  rationale: Передан очевидный контраст между внешней близостью/собранием и непослушанием; формулировка остаётся зависимой от предоставленного английского свидетеля ввиду отсутствия прямой сверки с греческим.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным раннехристианским звучанием. Синтаксис упрощён там, где это повышает ясность, но риторические повторы «исповедовать Его» и контраст между словами и делами сохранены. Поскольку прямой обзор греческого источника обозначен как ожидающий выполнения, проект опирается на предоставленное публично-доменное английское свидетельство и требует последующей сверки, особенно в заключительном изречении.
