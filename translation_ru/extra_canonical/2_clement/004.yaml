review_pass:
  verdict: revise
  source_fidelity: 'В заключительном изречении черновик существенно меняет условную конструкцию: слова «если вы поступаете так» не соответствуют свидетельству. Условие относится к тому, что слушатели «собраны со Мной у Меня на груди» и при этом не исполняют заповедей. Остальная передача в целом верно сохраняет противопоставление одного именования Господа и исповедания делами, перечень нравственных требований и формулу «творящие беззаконие».'
  naturalness: Русский текст в целом естественен и выдержан в современном литературном, умеренно возвышенном регистре. Формула «Даже если вы собраны со Мной у Меня на груди» сохраняет намеренно странный образ и читается яснее, чем нынешняя перестройка фразы.
  terminology: «Господь», «исповедовать», «праведно», «воздержанными», «милосердными», «корыстолюбивыми» и «творящие беззаконие» уместны. Необычный образ «у Меня на груди» следует оставить с примечанием, не превращая его в догматическое либо экклезиологическое толкование.
  issues:
  - severity: high
    issue: Искажена условная структура заключительного изречения.
    rationale: Черновик вводит отсутствующее в свидетельстве условие «если вы поступаете так» и синтаксически отделяет его от образа собрания со Христом. В источнике именно близость/собрание «со Мной ... на Моей груди» не отменяет отвержения при неисполнении заповедей.
  - severity: low
    issue: Примечание чрезмерно конкретизирует одну из возможных интерпретаций образа.
    rationale: Указание на «принадлежность к собранию вокруг Него» допустимо как возможность, но лучше сформулировать примечание нейтральнее, поскольку значение образа спорно.
