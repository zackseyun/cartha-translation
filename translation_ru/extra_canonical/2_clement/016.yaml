base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/016.yaml
  text: 'Therefore, brothers and sisters, since we have found no small opportunity for repentance, seeing that we have time, let us return to God who called us, while we still have One who receives us.


    For if we bid farewell to these enjoyments and conquer our soul by refusing to fulfill its evil desires, we shall be partakers of the mercy of Jesus.


    But you know that the day of judgment comes even now as a burning oven, and the powers of the heavens shall melt, and all the earth as lead melting on the fire; and then the secret and open works of human beings shall appear.


    Almsgiving, therefore, is a good thing, even as repentance from sin&gt; Fasting is better than prayer, but almsgiving better than both. And love covers a multitude of sins, but prayer out of a good conscience delivers from death. Blessed is everyone found full of these. For almsgiving lifts off the burden of sin.'
translation:
  language: ru
  text: 'Итак, братья и сёстры, поскольку нам дана немалая возможность покаяться и у нас ещё есть время, обратимся вновь к призвавшему нас Богу, пока ещё есть Тот, кто принимает нас.


    Ведь если мы простимся с этими удовольствиями и одолеем свою душу, не позволяя ей исполнять злые желания, то станем причастниками милости Иисуса.


    Но вы знаете, что день суда уже приближается, словно пылающая печь; небесные силы расплавятся, и вся земля — словно свинец в огне. Тогда обнаружатся и тайные, и явные дела людей.


    Поэтому милостыня — доброе дело, как и покаяние в грехе. Пост лучше молитвы, а милостыня лучше их обоих. Любовь покрывает множество грехов, а молитва от чистой совести избавляет от смерти. Блажен всякий, кто окажется исполнен всего этого, ведь милостыня снимает бремя греха.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: brethren
  choice: братья и сёстры
  rationale: Передаёт обращение ко всей общине естественным современным русским языком, не ограничивая его мужчинами.
- source_word: repentance
  choice: покаяться / покаяние
  rationale: Сохраняет традиционный богословский термин и одновременно звучит понятно в современном русском.
- source_word: conquer our soul
  choice: одолеем свою душу
  rationale: Сохраняет напряжённый образ борьбы с собственными влечениями, не заменяя его более интерпретирующим выражением вроде «обуздаем себя».
- source_word: partakers
  choice: причастниками
  rationale: Передаёт идею участия в милости, сохраняя возвышенный раннехристианский регистр.
- source_word: powers of the heavens
  choice: небесные силы
  rationale: 'Сохраняет неоднозначность: это могут быть небесные силы или космические структуры; перевод её не разрешает.'
- source_word: almsgiving
  choice: милостыня
  rationale: Обычный и исторически уместный русский термин для помощи нуждающимся из милосердия.
- source_word: good conscience
  choice: чистая совесть
  rationale: Естественное русское выражение для нравственно незапятнанной совести; «добрая совесть» было бы формальнее, но менее идиоматично.
theological_decisions:
- issue: Соотношение милостыни, поста, молитвы и прощения грехов
  choice: Сохранена прямая сравнительная и сотериологическая формулировка текста
  alternative: Ослабить её пояснением, что эти дела лишь свидетельствуют о вере или покаянии
  rationale: Источник выражается намеренно резко; добавление конфессионального объяснения устранило бы подлинное богословское напряжение.
- issue: «Тот, кто принимает нас»
  choice: Сохранено неопределённое личное обозначение с прописной буквы
  alternative: Прямо назвать Бога или Христа
  rationale: Формулировка свидетельства не уточняет референта; перевод не должен молча разрешать эту неоднозначность.
- issue: «Молитва от чистой совести избавляет от смерти»
  choice: Сохранена причинно-средственная связь без поясняющей оговорки
  alternative: Перевести как молитву, которая «свидетельствует об избавлении»
  rationale: Альтернатива внесла бы отсутствующее в тексте богословское толкование.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным церковно-литературным оттенком. Архаизмы устранены, но ключевые раннехристианские термины («покаяние», «причастники», «милостыня», «блажен») сохранены. Черновик опирается на предоставленное английское общественное достояние; прямая сверка с греческим источником ещё требуется. Повреждённое «sin&gt;» понято как конец предложения.
