    text: 'Местоимения в этой фразе допускают некоторую неоднозначность: речь идёт о познании Отца через Христа и о том, чтобы не отрекаться от Христа, через Которого Отец был познан.'
    reason: Сохранить референциальную неоднозначность текста, одновременно помогая современному читателю проследить ход мысли.
  - marker: b
    text: Ср. Мф. 10:32; Лк. 12:8. Формулировка здесь не полностью совпадает ни с одной из канонических форм цитаты.
    reason: Указать евангельскую традицию цитаты, не создавая ложного впечатления дословного совпадения.
  - marker: c
    text: Ис. 29:13; ср. Мф. 15:8; Мк. 7:6. Цитата приведена в форме, близкой к греческой библейской традиции.
    reason: Обозначить источник и возможное посредство евангельской цитатной традиции.
lexical_decisions:
- source_word: ὁ πατὴρ τῆς ἀληθείας / Father of truth (witness)
  choice: Отец истины
  rationale: 'Сохранена формальная и богословски открытая конструкция: она может обозначать Отца, Которому принадлежит истина или Который является её источником; уточняющее толкование не внесено.'
- source_word: ὁμολογεῖν / confess
  choice: исповедовать
  rationale: «Исповедовать» передаёт публичное признание верности Христу и сохраняет связь между цитатой и последующим нравственным объяснением автора.
- source_word: μὴ ἀρνεῖσθαι / not deny
  choice: не отрекаться
  rationale: Выбрано «отрекаться», а не более нейтральное «отрицать», поскольку речь идёт о личном отказе признать Того, через Кого дано познание Бога.
- source_word: νοῦς / mind (witness)
  choice: разум
  rationale: Современное и достоинственное соответствие, обозначающее внутреннее мышление и осмысление, наряду с «сердцем».
- source_word: ἀπειθεῖν / be disobedient (witness)
  choice: противиться
  rationale: Передаёт не просто единичное непослушание, а установку непокорности заповедям; синтаксис при этом остаётся естественным по-русски.
theological_decisions:
- issue: Неясность местоимений в вопросе о познании
  choice: «наше познание Его… не отрекаться от Того, через Кого мы Его познали»
  alternative: «познание по отношению к Нему… не отрицать Того, через Кого мы познали Отца»
  rationale: Основной текст сохраняет цепочку местоимений и риторическую напряжённость свидетельства, не подменяя её явными именами; сноска отмечает возможную референцию.
- issue: Исповедание Христа как условие награды
  choice: «если мы поистине исповедуем»
  alternative: «если только исповедуем»
  rationale: «Поистине» сохраняет усиление, которое далее раскрывается как исповедание делами, сердцем и разумом, но не превращает фразу в утверждение отдельной конфессиональной схемы спасения.
- issue: Отношение устного исповедания к послушанию
  choice: Сохранено авторское объяснение, что исповедание выражается в исполнении заповедей и цельном почитании
  alternative: Свести «исповедовать» исключительно к устному заявлению веры
  rationale: Контекст прямо расширяет исповедание до поведения и внутренней преданности; это напряжение следует сохранить без систематического догматического вывода.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианской проповеди. Сохранены риторические повторы «исповедуем» и «через Кого», а также контраст между устами и сердцем. Архаизмы вроде «сего», «дабы» и «непокорны» избегаются. Поскольку в предоставленных данных прямая сверка с греческим источником обозначена как предстоящая, решения осторожно опираются на засвидетельствованный текст и известную греческую традицию 2 Клим. 3; перед публикацией желательна окончательная рукописная сверка.
