base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/003.yaml
  text: 'Seeing, then, that he showed us such great mercy—first of all, that we who are alive do not sacrifice to these dead gods or worship them, but through him have come to know the Father of truth—what else is this knowledge toward him except not denying him through whom we have known him?


    Yes, he himself says, “Whoever confesses me, I will confess before the Father.”


    This, then, is our reward, if we truly confess him through whom we were saved.


    But how do we confess him? By doing what he says, not disobeying his commandments, and honoring him not only with our lips but with our whole heart and our whole mind.


    Now he also says in Isaiah, “This people honors me with their lips, but their heart is far from me.”'
translation:
  language: ru
  text: 'Итак, поскольку Он явил нам столь великую милость — прежде всего в том, что мы, живые, не приносим жертв этим мёртвым богам и не поклоняемся им, но через Него познали Отца истины, — чем ещё может быть наше познание Его, как не тем, чтобы не отрекаться от Того, через Кого мы Его познали?[a]


    Ведь Он Сам говорит: «Кто исповедует Меня, того и Я исповедую перед Отцом».[b]


    Итак, вот наша награда, если мы поистине исповедуем Того, через Кого были спасены.


    Но как мы исповедуем Его? Когда исполняем то, что Он говорит, не ослушиваемся Его заповедей и почитаем Его не только устами, но всем сердцем и всем разумом.


    Он также говорит у Исаии: «Этот народ чтит Меня устами, но сердце его далеко от Меня».[c]'
  philosophy: optimal-equivalence
  footnotes:
