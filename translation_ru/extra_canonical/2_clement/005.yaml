  text: 'Therefore, brethren, let us forsake our sojourn in this world and do the will of Him who called us, and let us not be afraid to depart from this world.


    For the Lord says, “You shall be as lambs in the midst of wolves.”


    But Peter answered and said to Him, “What then, if the wolves should tear the lambs?”


    Jesus said to Peter, “Let not the lambs fear the wolves after they are dead; and you also, do not fear those who kill you and are not able to do anything to you; but fear Him who, after you are dead, has power over soul and body to cast them into the Gehenna of fire.”


    And you know, brethren, that the sojourn of this flesh in this world is mean and for a short time, but the promise of Christ is great and marvelous, even the rest of the kingdom that shall be and of life eternal.


    What then can we do to obtain them, but walk in holiness and righteousness, consider these worldly things as alien to us, and not desire them?


    For when we desire to obtain these things, we fall away from the righteous path.'
translation:
  language: ru
  text: 'Итак, братья, оставим наше временное пребывание в этом мире, будем исполнять волю Призвавшего нас и не станем бояться ухода из этого мира.


    Ведь Господь говорит: «Вы будете как ягнята среди волков».


    Но Пётр спросил Его: «А что, если волки растерзают ягнят?»


    Иисус сказал Петру: «Пусть ягнята не боятся волков после своей смерти. И вы не бойтесь тех, кто убивает вас, а больше ничего не может вам сделать; бойтесь же Того, кто после вашей смерти властен над душой и телом — ввергнуть их в огненную геенну».[a]


    Вы знаете, братья: пребывание этой плоти в нынешнем мире незначительно и кратковременно, а обещание Христа велико и дивно — покой грядущего Царства и вечной жизни.


    Что же нам делать, чтобы обрести их? Жить в святости и праведности, считать всё мирское чуждым нам и не желать его.


    Ведь когда мы желаем приобрести мирское, то сходим с праведного пути.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Это изречение известно здесь в форме, не совпадающей дословно с каноническими Евангелиями; ср. Мф. 10:16, 28; Лк. 10:3; 12:4–5.
    reason: Помогает читателю распознать евангельские параллели и одновременно не выдаёт составную цитату за точное воспроизведение одного канонического места.
lexical_decisions:
- source_word: παροικία / sojourn (as reflected in the witness)
  choice: временное пребывание
  rationale: Передаёт образ земной жизни как недолгого пребывания не на родине, не вводя архаичное или узкоспециальное «странничество» во всех случаях.
- source_word: ἀποτάσσω / forsake (as reflected in the witness)
  choice: оставим
  rationale: Естественный современный призыв к отказу от привязанности к нынешнему миру; смысл не усилен до физического бегства.
- source_word: mean (Greek review pending)
  choice: ничтожно
  rationale: По контрасту с великим обещанием Христа выражает малость и незначительность земного пребывания, а не нравственную низость плоти.
- source_word: Gehenna of fire
  choice: огненная геенна
  rationale: Сохранено традиционное географически и богословски значимое название, а не заменено интерпретирующим словом «ад».
- source_word: rest
  choice: покой
  rationale: Сохраняет эсхатологический образ обещанного покоя без пояснительного расширения.
- source_word: walk in holiness and righteousness
  choice: жить в святости и праведности
  rationale: Русская идиоматика требует естественного «жить»; этические категории исходного свидетельства сохранены.
theological_decisions:
- issue: Кого следует бояться после смерти
  choice: «Того» с прописной буквы без добавления имени
  alternative: прямо назвать Бога или истолковать референта иначе
  rationale: Сохраняется референциальная сдержанность свидетельства и одновременно русская традиция обозначения божественного адресата; частное толкование не добавляется.
- issue: Отношение к миру
  choice: «считать всё мирское чуждым нам»
  alternative: призвать буквально покинуть общество или отвергнуть материальное творение как злое
  rationale: Текст говорит об отказе от желания мирских благ и о земном пребывании как временном; дуалистическое осуждение творения не вносится.
- issue: Душа и тело в огненной геенне
  choice: сохранить обе составляющие и множественное «их»
  alternative: свести наказание только к душе или сгладить грамматическое напряжение
  rationale: Сохранено антропологическое и эсхатологическое напряжение текста без конфессиональной систематизации.
- issue: Получение обещанного
  choice: вопрос и ответ об этической жизни сохранены как увещание
  alternative: добавить формулу о заслуживании спасения или, напротив, ослабить условный характер фразы
  rationale: Необходимо оставить собственную риторическую и богословскую силу текста, не разрешая её позднейшими спорами.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Обращение «братья» сохранено. Синтаксис цитат осовременен без разговорности. Поскольку прямой разбор греческого источника в предоставленных данных обозначен как ожидающий проверки, спорные лексемы переданы осторожно по древнему английскому свидетельству и отмечены в решениях; искусственная уверенность в реконструкции греческой формы не создаётся.
