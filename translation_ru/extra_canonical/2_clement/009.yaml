base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/009.yaml
  text: 'Let none of you say that this flesh is not judged and does not rise again.


    Understand this: In what were you saved? In what did you recover your sight, if not in this flesh?


    Therefore, we ought to guard the flesh as a temple of God.


    For just as you were called in the flesh, you will also come in the flesh.


    If Christ the Lord, who saved us, was first spirit and then became flesh, and called us in that way, in the same way we also will receive our reward in this flesh.


    Therefore, let us love one another, so that we all may enter the kingdom of God.


    While we have time to be healed, let us place ourselves in the hands of God the physician, giving him something in return.


    What shall we give in return? Repentance from a sincere heart.


    For he discerns all things beforehand and knows what is in our hearts.


    Therefore, let us give him eternal praise, not only from our lips but also from our hearts, so that he may receive us as sons.


    For the Lord also said, “These are my brothers, those who do the will of my Father.”'
translation:
  language: ru
  text: 'Пусть никто из вас не говорит, что эта плоть не будет судима и не воскреснет.


    Поймите: в чём вы были спасены? В чём прозрели, если не в этой плоти?


    Поэтому мы должны хранить плоть как храм Божий.


    Ибо как вы были призваны во плоти, так и придёте во плоти.


    Если Христос Господь, спасший нас, вначале был духом, а затем стал плотью и так призвал нас, то и мы подобным образом получим награду в этой плоти.[a]


    Итак, будем любить друг друга, чтобы всем нам войти в Царство Божье.


    Пока у нас есть время исцелиться, отдадим себя в руки Бога-Врача, воздавая Ему за это.


    Чем же воздадим? Искренним сердечным покаянием.


    Ведь Он заранее различает всё и знает, что у нас в сердце.


    Поэтому будем воздавать Ему вечную хвалу — не только устами, но и сердцем, — чтобы Он принял нас как сыновей.


    Ибо Господь сказал: «Вот Мои братья — те, кто исполняет волю Моего Отца».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Фраза «вначале был духом, а затем стал плотью» дословно следует предоставленному древнему переводному свидетельству. Сверка с греческой рукописной традицией пока не проведена.
    reason: Формулировка богословски значима и допускает различные способы понимания; важно обозначить предварительность источниковой проверки.
  - marker: b
    text: Ср. Мф. 12:50; Мк. 3:35. Здесь цитата дана в форме, представленной во Втором послании Климента.
    reason: Указание вероятного евангельского параллельного места без унификации древней цитаты с поздней текстовой формой.
lexical_decisions:
- source_word: flesh (Greek source review pending)
  choice: плоть
  rationale: Сохраняет повторяющийся ключевой термин и телесно-богословскую аргументацию отрывка; замена на «тело» сгладила бы связь между воплощением, нынешней телесной жизнью и воскресением.
- source_word: guard
  choice: хранить
  rationale: Естественно передаёт требование беречь плоть как Божий храм, не сужая смысл до физической защиты.
- source_word: come
  choice: придёте
  rationale: Сохранена необычная и не вполне определённая формулировка свидетельства вместо поясняющего «предстанете» или «воскреснете».
- source_word: recompense / something in return
  choice: воздавая Ему за это
  rationale: Передаёт образ ответного дара или воздаяния, после чего сам текст определяет его как покаяние.
- source_word: repentance from a sincere heart
  choice: искренним сердечным покаянием
  rationale: Современная естественная формулировка, сохраняющая акцент на внутренней искренности.
- source_word: receive us as sons
  choice: принял нас как сыновей
  rationale: Сохраняет семейный образ и мужской род исходной формулировки, не уточняя сверх свидетельства смысл усыновления.
theological_decisions:
- issue: Суд и воскресение плоти
  choice: «эта плоть не будет судима и не воскреснет»
  alternative: «тело не подлежит суду и не воскресает»
  rationale: Будущее время соответствует эсхатологическому контексту, а повтор слова «плоть» сохраняет ход рассуждения автора.
- issue: Предсуществование и воплощение Христа
  choice: «вначале был духом, а затем стал плотью»
  alternative: «сначала был духовным, а потом воплотился»
  rationale: Сохранена напряжённая формулировка имеющегося древнего свидетельства без её согласования с позднейшими догматическими терминами. Прямое сопоставление с греческим текстом ещё требуется.
- issue: Условие принятия как сыновей
  choice: «чтобы Он принял нас как сыновей»
  alternative: «и тогда Он усыновит нас»
  rationale: Не вводится более специальная доктринальная терминология, которой нет в предоставленном свидетельстве.
- issue: Цитата о братьях Господа
  choice: «Вот Мои братья — те, кто исполняет волю Моего Отца»
  alternative: «Это братья Мои, исполняющие волю Отца Моего»
  rationale: Передан смысл цитаты ясным современным русским языком без попытки искусственно привести её к формулировке какого-либо одного канонического перевода.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианской проповеди. Сохранены повтор «плоть», увещательные переходы и краткие риторические вопросы. Черновик основан на предоставленном англоязычном публичном свидетельстве и консультационном слое POB; прямая проверка греческого текста остаётся необходимой.
