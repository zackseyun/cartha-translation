review_pass:
  verdict: revise
  source_fidelity: 'Нужна безопасная правка в двух местах. Греч. γυμναζόμεθα обозначает упражнение/подготовку, а не собственно «испытание»; στεφανωθῶμεν — пассивное «быть увенчанными», не активное «получить венец». Остальные основные соответствия переданы верно: нужда слуг Бога, медленное созревание плода, противопоставление благочестия и выгоды, образ суда и цепей, а также адресованное единому невидимому Богу славословие.'
  naturalness: Текст в целом естественный и выдержан в современном литературном, увещательном регистре. «Готовимся в нынешней жизни» и «быть увенчанными в будущей» звучат по-русски плавно и точнее передают исходный образ. «Вождь бессмертия» допустим как современная передача титула ἀρχηγός.
  terminology: «Неправедные», «слуги Божьи», «благочестие», «Божий суд», «Спаситель» и «Вождь бессмертия» уместны. «Угодное Богу» в данном контексте адекватно передаёт τὸ εὐσεβές, не навязывая более узкого толкования. Прописные буквы в именовании Бога соответствуют выбранному русскому религиозно-литературному регистру.
  issues:
  - severity: medium
    issue: «В нынешней жизни мы проходим испытание»
    rationale: Это сужает γυμναζόμεθα до перенесения испытания, тогда как исходный образ — упражнение, подготовка или воспитание. Следует сохранить связь с повтором того же глагола в рассуждении о «торговле».
  - severity: medium
    issue: «чтобы в будущей получить венец»
    rationale: 'Исходное στεφανωθῶμεν имеет страдательную форму: «чтобы быть увенчанными». Активное «получить венец» несколько меняет образ и агентность.'
