base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/020.yaml
  text: 'Do not let this trouble your minds either: that we see the unrighteous possessing wealth while the servants of God suffer hardship.


    Therefore, let us have faith, brothers and sisters. We are being trained by this present life so that we may be crowned in the life to come.


    No righteous person has quickly reaped the fruit but waits for it.


    For if God had quickly given the righteous their reward, we would immediately have been training ourselves in commerce rather than godliness. We would appear to be righteous, though we were pursuing not what is godly but what is profitable. For this reason, divine judgment overtakes a spirit that is not just and weighs it down with chains.


    To the only invisible God, the Father of truth, who sent to us the Savior and Prince of immortality, through whom he also revealed to us the truth and the heavenly life—to him be the glory forever and ever. Amen.'
translation:
  language: ru
  text: 'Пусть вас не смущает и то, что, как мы видим, неправедные богатеют, а слуги Божьи терпят нужду.


    Итак, будем верить, братья и сёстры. В нынешней жизни мы проходим испытание, чтобы в будущей получить венец.


    Ни один праведник не пожинает плод сразу, но ожидает его.


    Ведь если бы Бог тотчас воздавал праведникам, мы сразу стали бы упражняться не в благочестии, а в торговле: мы казались бы праведными, хотя стремились бы не к угодному Богу, а к выгодному. Поэтому Божий суд настигает неправедный дух и обременяет его цепями.


    Единому невидимому Богу, Отцу истины, пославшему нам Спасителя и Вождя бессмертия, через которого Он также открыл нам истину и небесную жизнь, — Ему слава во веки веков. Аминь.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Перевод подготовлен по предоставленному древнему английскому свидетельству; для окончательного издания необходима прямая сверка с греческой рукописной традицией.
    reason: В исходных данных прямо указано, что проверка по греческому тексту ещё не проведена; примечание честно обозначает ограничение источниковой основы.
lexical_decisions:
- source_word: straitened
  choice: терпят нужду
  rationale: Передаёт материальные лишения и стеснённые обстоятельства естественным современным русским выражением, не сужая смысл до одного вида страдания.
- source_word: trained / training ourselves
  choice: проходим испытание / упражняться
  rationale: Контекст допускает значения обучения, воспитания и испытания. В первом случае «проходим испытание» естественно связывает нынешнюю жизнь с будущим венцом; во втором «упражняться» сохраняет ироническую мысль о сознательной практике ради выгоды.
- source_word: commerce
  choice: торговле
  rationale: 'Сохраняет образ корыстного обмена: внешняя праведность превращается в средство получения скорого вознаграждения.'
- source_word: that which is godly
  choice: угодному Богу
  rationale: Естественно передаёт направленность к благочестию и сохраняет противопоставление выгоде.
- source_word: Prince of immortality
  choice: Вождя бессмертия
  rationale: «Вождь» сохраняет титульный и ведущий смысл слова Prince/ἀρχηγός, не сводя его ни к политическому князю, ни исключительно к источнику бессмертия.
- source_word: loadeth it with chains
  choice: обременяет его цепями
  rationale: Сохраняет образ тяжести и уз, не конкретизируя природу суда сверх данного свидетельства.
theological_decisions:
- issue: Образ нынешней жизни как подготовки к будущему венцу
  choice: «В нынешней жизни мы проходим испытание, чтобы в будущей получить венец»
  alternative: «Нынешняя жизнь воспитывает нас, чтобы мы были увенчаны в будущей»
  rationale: Выбран естественный русский оборот, сохраняющий эсхатологическое напряжение между настоящим испытанием и будущей наградой, без утверждения механической заслуженности спасения.
- issue: Объект Божьего суда
  choice: «неправедный дух»
  alternative: «дух, который неправеден»
  rationale: 'Сохранена формулировка свидетельства и её неоднозначность: не уточняется, идёт ли речь о человеческом духе, нравственном состоянии или иной духовной реальности.'
- issue: Титул Спасителя
  choice: «Вождь бессмертия»
  alternative: «Начальник бессмертия»
  rationale: «Вождь» в современном литературном русском лучше выражает первенство и ведение, тогда как «Начальник» звучит административно; при этом не вводится конфессионально обусловленное толкование.
- issue: Прославление Бога через Христа
  choice: Сохранена синтаксическая отнесённость «Ему слава» к единому невидимому Богу
  alternative: Отнести славословие одновременно к Богу и Спасителю
  rationale: Такова наиболее непосредственная грамматическая структура предоставленного свидетельства; расширять адресата славословия без прямой проверки греческого текста не следует.
translation_notes:
  register: 'Современный литературный русский с достоинством раннехристианского увещания. Синтаксис упрощён там, где буквальное воспроизведение английского свидетельства было бы тяжеловесным, но сохранены риторические противопоставления: неправедное богатство и нужда слуг Божьих; нынешнее испытание и будущий венец; благочестие и выгода. Формы «братья и сёстры» соответствуют консультационному слою POB; местоимения о Боге оформлены с прописной буквы в рамках русского религиозно-литературного регистра.'
