review_pass:
  verdict: revise
  source_fidelity: В целом смысл четырёх абзацев передан точно. Однако «обретите для себя спасение и жизнь» смягчает прямой побудительный оборот свидетельства «give ... to yourselves» по богословскому соображению, а «покажем цель» неточно и неестественно передаёт «set a goal». «Пусть они недолго терпят...» ослабляет уступительно-временную конструкцию оригинала.
  naturalness: Текст в основном литературен и выдержан по регистру. Следует заменить неестественное «покажем цель всем молодым людям» и более точно оформить условно-уступительную фразу о скорби.
  terminology: «Бог истины», «увещание», «двоедушие», «праведность», «блаженны», «нетленный плод воскресения» уместны. Не следует устранять богословскую напряжённость фразы о спасении толковательным смягчением.
  issues:
  - severity: medium
    issue: Смягчение «дайте самим себе спасение и жизнь»
    rationale: «Обретите для себя» заменяет прямой каузативный призыв английского свидетельства и мотивировано конфессиональным опасением, а не текстом. Перевод должен сохранять формулировку источника без доктринального исправления.
  - severity: medium
    issue: «Покажем цель всем молодым людям»
    rationale: Русская конструкция не передаёт действия «set a goal» достаточно прямо и звучит неестественно. Нужна формула «поставим цель перед всеми молодыми людьми».
  - severity: low
    issue: Ослаблена логика фразы о краткой скорби
    rationale: '«Пусть они недолго терпят...» приобретает оттенок пожелания. В свидетельстве это уступительное утверждение: «Хотя они... они соберут...».'
  - severity: low
    issue: «Ему тяжело» менее определённо, чем «he is miserable»
    rationale: «Несчастен» точнее передаёт состояние, не добавляя конкретного вида страдания.
  revised_text: 'Итак, братья и сёстры, выслушав Бога истины, я читаю вам увещание, чтобы вы внимали написанному и тем самым могли спасти и самих себя, и того, кто читает среди вас. В награду я прошу вас об одном: покайтесь всем сердцем и дайте самим себе спасение и жизнь.[a] Поступая так, мы поставим цель перед всеми молодыми людьми, которые желают усердно трудиться, изучая благочестие и Божью благость.


    И не будем досадовать и раздражаться — неразумные, каковы мы есть, — когда кто-нибудь вразумляет нас и обращает от неправедности к праведности. Ведь порой мы творим зло и не сознаём этого из-за двоедушия и неверия, живущих в нашей груди; суетные желания омрачают наш разум.


    Итак, будем поступать праведно, чтобы спастись до конца.[b] Блаженны повинующиеся этим наставлениям. Хотя они и недолго терпят скорбь в этом мире, они соберут нетленный плод воскресения.


    Поэтому пусть благочестивый человек не скорбит, если в нынешнее время он несчастен: его ожидает блаженное время. Он вновь будет жить на небесах вместе с нашими отцами и радоваться в лишённой скорби вечности.'
  revised_footnotes:
  - marker: a
    text: 'Буквально: «дайте самим себе спасение и жизнь». Формулировка передаёт прямой призыв свидетельства и не уточняет, каким именно образом покаяние связано со спасением и жизнью.'
    reason: Сохраняет необычный и богословски напряжённый оборот без конфессионального истолкования.
  - marker: b
    text: Выражение «спастись до конца» можно также понять как «в конце быть спасёнными».
    reason: Сохранение временной неоднозначности исходного свидетельства.
  revision_rationale: Исправления восстанавливают прямоту свидетельства в призыве «дайте самим себе», устраняют неестественную и неточную формулировку о цели для молодых людей, а также точнее передают уступительную связь между временной скорбью и плодом воскресения. Общинно-проповеднический современный литературный регистр сохранён.
