base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/019.yaml
  text: 'Therefore, brothers and sisters, after the God of truth has been heard, I read you an exhortation so that you may pay attention to what is written, for you may save both yourselves and the one who reads among you. For I ask you, as a reward, to repent with your whole heart and give salvation and life to yourselves. By doing this, we will set a goal for all the young people who desire to labor in the study of godliness and of the goodness of God.


    And let us not be displeased and annoyed, foolish as we are, whenever anyone warns us and turns us away from unrighteousness toward righteousness. For sometimes, while we do evil things, we do not realize it because of the divided minds and unbelief within our hearts, and our understanding is darkened by our vain lusts.


    Therefore, let us practice righteousness so that we may be saved to the end. Blessed are those who obey these ordinances. Though they may endure affliction for a short time in the world, they will gather the immortal fruit of the resurrection.


    Therefore, let the godly person not be grieved if he is miserable in the present times; a blessed time awaits him. He will live again in heaven with our fathers and will rejoice throughout a sorrowless eternity.'
translation:
  language: ru
  text: 'Итак, братья и сёстры, после того как мы услышали Бога истины, я читаю вам увещание, чтобы вы внимали написанному и тем самым могли спасти и самих себя, и того, кто читает среди вас. В награду я прошу вас об одном: покайтесь всем сердцем и обретите для себя спасение и жизнь.[a] Поступая так, мы покажем цель всем молодым людям, которые желают усердно постигать благочестие и Божью благость.


    И не будем досадовать и раздражаться — неразумные, каковы мы есть, — когда кто-нибудь вразумляет нас и обращает от неправедности к праведности. Ведь порой мы творим зло и не сознаём этого из-за двоедушия и неверия, живущих в нашей груди; суетные желания омрачают наш разум.


    Итак, будем поступать праведно, чтобы спастись до конца.[b] Блаженны повинующиеся этим наставлениям. Пусть они недолго терпят скорбь в этом мире — они соберут нетленный плод воскресения.


    Поэтому пусть благочестивый человек не скорбит, если в нынешнее время ему тяжело: его ожидает блаженное время. Он вновь будет жить на небесах вместе с нашими отцами и радоваться в лишённой скорби вечности.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по английскому свидетельству: «дайте самим себе спасение и жизнь». Перевод «обретите для себя» сохраняет призыв к деятельному покаянию, не называя человека источником спасения.'
    reason: Исходная формулировка богословски напряжённая и в буквальном русском виде может получить более сильный причинный смысл, чем предполагает контекст.
  - marker: b
    text: Выражение «спастись до конца» можно также понять как «в конце быть спасёнными».
    reason: Сохранение временной неоднозначности исходного свидетельства.
lexical_decisions:
- source_word: brothers and sisters
  choice: братья и сёстры
  rationale: Инклюзивное обращение передано естественной современной формой, соответствующей смыслу общинного обращения.
- source_word: God of truth
  choice: Бога истины
  rationale: Сохранён формальный и богословски ёмкий оборот без подмены толкованием «истинный Бог».
- source_word: exhortation
  choice: увещание
  rationale: «Увещание» передаёт одновременно наставительный и побудительный характер речи и сохраняет достойный церковно-литературный регистр.
- source_word: double-mindedness
  choice: двоедушия
  rationale: Традиционно понятное русское слово сохраняет идею внутренней раздвоенности, а не просто нерешительности.
- source_word: ordinances
  choice: наставлениям
  rationale: В контексте речь идёт о данных нравственных предписаниях; «наставления» естественнее и не навязывает юридического оттенка слова «постановления».
- source_word: immortal fruit of the resurrection
  choice: нетленный плод воскресения
  rationale: «Нетленный» звучит естественно в русской библейской речи и сохраняет противопоставление временной скорби непреходящему плоду.
theological_decisions:
- issue: Фраза «give salvation and life to yourselves» и роль человеческого покаяния
  choice: «обретите для себя спасение и жизнь»
  alternative: «дайте самим себе спасение и жизнь»
  rationale: Выбранная формулировка сохраняет сильный призыв к личному отклику, но не создаёт в русском языке более категоричного, чем свидетельство, утверждения о том, что человек сам является источником спасения.
- issue: «that we may be saved unto the end»
  choice: «чтобы спастись до конца»
  alternative: «чтобы в конце быть спасёнными»
  rationale: 'Сохранена временная неоднозначность: оборот может указывать как на стойкость до конца, так и на окончательное спасение; вариант не разрешает эту напряжённость однозначно.'
- issue: «live again in heaven with our fathers»
  choice: «вновь будет жить на небесах вместе с нашими отцами»
  alternative: «оживёт на небесах с нашими праотцами»
  rationale: Сохранено утверждение о будущей жизни и общении с отцами без уточнения механизма, времени или состояния воскресения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенной, общинно-проповеднической интонацией. Архаизмы сведены к минимуму; слова «увещание», «двоедушие», «блаженный» и «нетленный» сохранены как понятные и уместные для раннехристианского текста. Поскольку прямое сопоставление с греческим источником обозначено как ожидающее проверки, решения не претендуют на устранение неясностей английского публичного свидетельства.
