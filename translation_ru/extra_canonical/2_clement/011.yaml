base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/011.yaml
  text: 'Therefore, let us serve God with a pure heart, and we shall be righteous; but if we do not serve him because we do not believe the promise of God, we shall be wretched.


    For the word of prophecy also says: “Wretched are the double-minded, who doubt in their hearts and say, ‘We heard these things long ago, in the days of our fathers also; yet we have waited day after day and seen none of them.’”


    You fools! Compare yourselves to a tree; take a vine. First it sheds its leaves, then a shoot comes, after this a sour berry, then a fully ripe grape.


    So likewise my people had tumults and afflictions, but afterward they shall receive good things.


    Therefore, my brethren, let us not be double-minded, but endure patiently in hope, that we also may obtain our reward.


    For faithful is he who promised to pay to each person the recompense of their works.


    Therefore, if we shall have wrought righteousness in the sight of God, we shall enter into his kingdom and receive the promises which ear has not heard, nor eye seen, nor eye seen, neither has it entered into the heart of man.'
translation:
  language: ru
  text: 'Итак, будем служить Богу с чистым сердцем — и будем праведны. Если же мы не служим Ему потому, что не верим Божьему обещанию, то будем несчастны.


    Ведь и пророческое слово говорит:


    «Несчастны двоедушные,


    те, кто сомневается в сердцах своих и говорит:


    “Обо всём этом мы слышали ещё во времена наших отцов. Но вот мы ждём день за днём и ничего из этого не увидели”».[a]


    Неразумные! Сравните себя с деревом — возьмите виноградную лозу. Сначала она сбрасывает листья, затем появляется побег, после него — незрелая ягода и наконец — спелая виноградная гроздь.


    Так и у Моего народа были смуты и скорби, но после этого он получит блага.


    Поэтому, братья мои, не будем двоедушными, но станем стойко терпеть, сохраняя надежду, чтобы и нам получить свою награду.


    Ведь верен Тот, Кто обещал дать каждому награду за его дела.


    Итак, если мы будем творить праведность перед Богом, то войдём в Его Царство и получим то, что было обещано, — то, чего ухо не слышало, глаз не видел и что не приходило на сердце человеку.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Источник этого «пророческого слова» достоверно не установлен.
    reason: Предупреждает читателя, что цитату не следует без основания приписывать определённой библейской книге.
  - marker: b
    text: Ср. 1 Кор. 2:9. В предоставленном английском свидетельстве слова «глаз не видел» повторены; в греческом тексте они стоят один раз.
    reason: Отмечает вторичное повторение в английском свидетельстве и объясняет его отсутствие в переводе.
lexical_decisions:
- source_word: δουλεύσωμεν
  choice: будем служить
  rationale: Передаёт призыв к деятельному и постоянному служению Богу без ненужного усиления значения до «рабствовать».
- source_word: δίψυχοι / διψυχῶμεν
  choice: двоедушные / не будем двоедушными
  rationale: Сохраняет повтор ключевого образа внутренней раздвоенности; последующее упоминание сомнений поясняет этот несколько необычный, но понятный термин.
- source_word: ταλαίπωροι
  choice: несчастны
  rationale: Естественно передаёт состояние бедствия и жалкости, не превращая высказывание в формулу проклятия.
- source_word: ὄμφαξ … σταφυλὴ παρεστηκυῖα
  choice: незрелая ягода … спелая виноградная гроздь
  rationale: 'Ясно воспроизводит последовательность созревания лозы: от отдельного незрелого плода к зрелой грозди.'
- source_word: ἀκαταστασίας καὶ θλίψεις
  choice: смуты и скорби
  rationale: Сохраняет различие между нестроениями или потрясениями и страданиями.
- source_word: μισθόν
  choice: награду
  rationale: В контексте обещанного воздаяния это современный и понятный эквивалент, не исключающий исходного значения платы за труд.
- source_word: ποιήσωμεν τὴν δικαιοσύνην
  choice: будем творить праведность
  rationale: Сохраняет деятельную формулировку оригинала, а не сводит её только к состоянию или юридическому статусу.
- source_word: λημψόμεθα τὰς ἐπαγγελίας
  choice: получим то, что было обещано
  rationale: По-русски естественнее говорить о получении обещанного, чем о буквальном «получении обещаний»; связь с Божьим обещанием в начале главы сохранена.
theological_decisions:
- issue: Связь служения, праведности и вхождения в Царство
  choice: 'Сохранены условные и деятельные формулировки автора: «будем служить… будем праведны» и «если… будем творить праведность… войдём».'
  alternative: Ослабить условность или истолковать праведность исключительно как вменённый статус либо исключительно как нравственную заслугу.
  rationale: Текст сам связывает верное служение, праведные дела, обещание и награду, но не объясняет механизм этой связи; перевод не должен разрешать богословское напряжение за автора.
- issue: Божье воздаяние за дела
  choice: «воздать каждому за его дела»
  alternative: «дать каждому заслуженную плату» или «воздать каждому по благодати».
  rationale: Формулировка сохраняет тему воздаяния и дел, не добавляя ни жёсткой идеи заслуги, ни отсутствующего в этой фразе уточнения о благодати.
- issue: Неидентифицированное пророческое слово
  choice: Оставлено как «пророческое слово» без приписывания конкретной канонической книге.
  alternative: Назвать предполагаемый источник или представить весь отрывок как прямую речь Бога.
  rationale: Источник цитаты не установлен с достаточной уверенностью, а вводная формула автора не называет пророка.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Сохранены риторические повторы, обращение «братья мои» и образ «двоедушия»; устаревшие синтаксические формы и чрезмерная церковнославянизация устранены. Поэтическая цитата оформлена отдельными строками для ясности.
