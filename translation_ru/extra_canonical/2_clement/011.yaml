  source_fidelity: В целом перевод точно передаёт ход увещания, образ виноградной лозы и условные формулировки текста. Однако в пророческой цитате греческое множественное число («сомневающиеся... говорящие») передано смешением множественного и единственного числа. Кроме того, в фразе о Божьем обещании воздать пропущено явно выраженное μισθός — «награда/воздаяние», так как «воздать каждому за его дела» не передаёт предмет обещанного воздаяния.
