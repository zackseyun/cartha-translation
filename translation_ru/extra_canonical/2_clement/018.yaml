base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/018.yaml
  text: 'Therefore, let us also be found among those who give thanks, among those who have served God, and not among the ungodly who are judged.


    For I myself am also an utter sinner. I have not yet escaped temptation but am still surrounded by the devices of the devil. Yet I strive to pursue righteousness, so that I may at least succeed in coming near to it, because I fear the judgment to come.'
translation:
  language: ru
  text: 'Поэтому пусть и мы окажемся среди благодарящих, среди тех, кто послужил Богу, а не среди нечестивых, которых судят.


    Ведь и я сам — великий грешник: я ещё не избежал искушения и всё ещё нахожусь среди козней дьявола. И всё же я стараюсь следовать за праведностью, чтобы мне удалось хотя бы приблизиться к ней, потому что я страшусь грядущего суда.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Перевод выполнен по предоставленному древнему английскому свидетельству; прямая сверка с греческим текстом ещё не проведена.
    reason: Исходные данные прямо указывают, что проверка по греческой рукописной традиции ожидается; примечание честно обозначает ограниченность текстовой основы.
lexical_decisions:
- source_word: give thanks
  choice: благодарящих
  rationale: Передаёт действие без добавления не названного прямо объекта благодарности; выражение остаётся естественным в контексте служения Богу.
- source_word: served God
  choice: послужил Богу
  rationale: Современное и достойное выражение, сохраняющее завершённый аспект английского свидетельства.
- source_word: utter sinner
  choice: великий грешник
  rationale: Естественно передаёт усилительное значение без неуклюжего буквального «совершенный грешник».
- source_word: engines of the devil
  choice: козней дьявола
  rationale: «Козни» естественно передают смысл враждебных замыслов или средств; буквальные «орудия/машины» в современном русском вводили бы ложный технический оттенок.
- source_word: follow after righteousness
  choice: следовать за праведностью
  rationale: Сохраняет образ настойчивого движения вслед за праведностью и связь с последующим «приблизиться к ней».
- source_word: judgment to come
  choice: грядущего суда
  rationale: Устойчивое и понятное обозначение будущего Божьего суда без дополнительного догматического уточнения.
theological_decisions:
- issue: Кого судят в первой фразе
  choice: нечестивых, которых судят
  alternative: нечестивых, которые осуждены
  rationale: 'Сохранено различие между судом и обвинительным приговором: свидетельство говорит о judged, не вынуждая перевод заранее уточнять исход суда.'
- issue: Степень достижимости праведности
  choice: чтобы мне удалось хотя бы приблизиться к ней
  alternative: чтобы мне удалось обрести её
  rationale: 'Сохранена авторская скромность и напряжение: речь идёт по меньшей мере о приближении к праведности, а не о заявленном полном её достижении.'
- issue: Связь страха суда со стремлением к праведности
  choice: потому что я страшусь грядущего суда
  alternative: при этом страшась грядущего суда
  rationale: Причинная связь следует английскому свидетельству, но не разворачивается в более узкое учение о мотивации спасения.
translation_notes:
  register: Современный литературный русский язык с достойным раннехристианским звучанием. Синтаксис упрощён по сравнению с английским свидетельством, но риторическое противопоставление и исповедальный тон сохранены. Маркер [a] присутствует в основном тексте.
