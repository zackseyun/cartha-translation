base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/013.yaml
  text: 'Therefore, brothers and sisters, let us repent at once. Let us be sober-minded about what is good, for we are full of much foolishness and wickedness. Let us wipe away our former sins, and let us not be found to be people-pleasers. Let us not desire to please only one another, but also those who are outside, through our righteousness, so that the Name may not be blasphemed because of us.


    For the Lord says, “In every way my Name is blasphemed among all the Gentiles”; and again, “Woe to the one because of whom my Name is blasphemed.” How is it blasphemed? Because you do not do the things I desire.


    For when the Gentiles hear the oracles of God from our mouths, they marvel at their beauty and greatness. Then, when they discover that our works are not worthy of the words we speak, they immediately turn to blasphemy, saying that it is an empty story and a delusion.


    For when they hear from us that God says, “It is no credit to you if you love those who love you, but this is credit to you if you love your enemies and those who hate you,” when they hear these things, I say, they marvel at their extraordinary goodness. But when they see that we not only do not love us, they ridicule us, and the Name is blasphemed.'
translation:
  language: ru
  text: '**2 Климента 13**


    Итак, братья и сёстры, покаемся же немедленно. Будем трезвиться ради добра, ибо мы исполнены великого безрассудства и зла. Изгладим с себя прежние грехи и не станем человекоугодниками. Не будем желать угождать только друг другу, но и тем, кто вне общины, своей праведностью, чтобы из-за нас Имя не подвергалось хуле.


    Ибо Господь говорит: «Всячески Моё Имя хулится среди всех язычников»; и ещё: «Горе тому, из-за кого хулится Моё Имя». Чем оно хулится? Тем, что вы не делаете того, чего Я желаю.


    Когда язычники слышат из наших уст Божьи изречения, они восхищаются их красотой и величием. Но, обнаружив затем, что наши дела недостойны слов, которые мы говорим, они тотчас переходят к хуле, говоря, что это пустая история и заблуждение.


    Когда они слышат от нас, что Бог говорит: «Если вы любите тех, кто любит вас, какая вам за это благодарность? Но если вы любите своих врагов и тех, кто вас ненавидит, вот за что вам благодарность».[a] Услышав это, говорю я, они восхищаются необычайной добротой. Но когда видят, что мы не только не любим тех, кто нас ненавидит, но даже и тех, кто нас любит, они насмехаются над нами, и Имя хулится.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Греческое слово, переданное как «благодарность», в этом контексте может означать также признание, похвалу или заслугу.
    reason: Сохраняет смысловую широту χάρις, не навязывая богословского истолкования.
