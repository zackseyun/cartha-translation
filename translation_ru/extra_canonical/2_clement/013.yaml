  - severity: medium
    issue: «Очистимся от прежних грехов» ослабляет образ исходного глагола.
    rationale: Исходник призывает изгладить/стереть прежние грехи «с себя»; «изгладим с себя» передаёт образ точнее.
  - severity: medium
    issue: «Они сразу начинают хулить их» имеет неясную референцию местоимения.
    rationale: В следующей реплике язычники называют услышанное пустой историей и заблуждением; лучше передать переход к хуле без ошибочно заданного объекта.
