- issue: Смысл выражения «the Name»
  choice: Сохранить «Имя» без подстановки конкретного имени или титула
  alternative: «Имя Бога» или конкретный божественный титул
  rationale: Источник использует абсолютное выражение; конкретизация могла бы снять намеренную традиционную ёмкость формулы.
- issue: Значение «thank/credit» в этическом изречении
  choice: «заслуга» с примечанием об альтернативе
  alternative: «благодарность» или «благодать»
  rationale: «Заслуга» ясно передаёт риторическое противопоставление, однако богословски значимая многозначность не замалчивается.
- issue: Незавершённая последняя конструкция
  choice: Сохранить обрыв с многоточием и сноской
  alternative: Конъектурно восстановить недостающие объекты любви
  rationale: Предоставленное свидетельство синтаксически повреждено или неполно; до прямой сверки с греческой традицией восстановление было бы неоправданным.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис сделан ясным для широкого читателя; традиционные формулы «Имя» и «те, кто вне общины» сохранены без конфессиональной конкретизации. Проект остаётся предварительным, поскольку прямая сверка с греческим источником ещё не выполнена.
