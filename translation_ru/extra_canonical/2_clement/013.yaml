revisions:
- from: '**2 Климента 13**


    Итак, братья и сёстры, покаемся немедленно. Будем трезво стремиться к добру, ведь в нас так много безрассудства и зла. Очистимся от прежних грехов и не будем угождать людям. Будем стараться угодить своей праведной жизнью не только друг другу, но и тем, кто вне общины, чтобы из-за нас не хулили Имя.


    Ведь Господь говорит: «Имя Моё всячески хулится среди всех язычников»; и ещё: «Горе тому, из-за кого хулится Моё Имя». Чем оно хулится? Тем, что вы не делаете того, чего Я желаю.


    Когда язычники слышат из наших уст Божьи изречения, они восхищаются их красотой и величием. Но затем, обнаружив, что наши дела недостойны произносимых нами слов, они сразу начинают хулить их, говоря, что всё это — пустая сказка и обман.


    Они слышат от нас, что Бог говорит: «Если вы любите тех, кто любит вас, в этом нет вам заслуги; но если вы любите своих врагов и тех, кто ненавидит вас, в этом вам заслуга».[a] Услышав это, говорю я, они восхищаются необычайной добротой этих слов. Но когда видят, что мы не только не любим…[b] — они насмехаются над нами, и Имя хулится.'
