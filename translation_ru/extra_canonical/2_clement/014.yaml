- from: 'Итак, братья и сёстры, если мы исполняем волю Бога, нашего Отца, то будем принадлежать к первой Церкви — духовной, сотворённой прежде солнца и луны. Если же мы не исполняем волю Господа, то к нам отнесутся слова Писания: «Дом Мой стал притоном разбойников».[a] Поэтому изберём лучше принадлежать к Церкви жизни, чтобы спастись.


    Полагаю, вы знаете, что живая Церковь — это тело Христа, ведь Писание говорит: «Бог сотворил человека мужчиной и женщиной».[b] Мужчина — это Христос, а женщина — Церковь. И Книги[c], и апостолы ясно возвещают, что Церковь возникла не только теперь, но существует от начала. Она была духовной, как духовен был и наш Иисус, а в последние дни явилась, чтобы Он спас нас.[d]


    Итак, духовная Церковь явилась в плоти Христа, тем самым показывая нам: если кто-либо из нас сохранит её в плоти и не осквернит, тот вновь получит её в Святом Духе.[e] Ибо эта плоть — образ и подобие духа. Поэтому тот, кто осквернил подобие, не получит в удел первообраз. Вот что это значит, братья и сёстры: «Храните плоть, чтобы приобщиться к духу».


    Но если мы говорим, что плоть — это Церковь, а дух — Христос, тогда тот, кто надругался над плотью, надругался над Церковью. Поэтому такой человек не приобщится к духу, то есть ко Христу.


    Вот сколь прекрасны жизнь и бессмертие, которые эта плоть может получить в удел, если соединится с ней Святой Дух! Никто не может ни выразить, ни поведать того, что Господь приготовил Своим избранным.[f]'
