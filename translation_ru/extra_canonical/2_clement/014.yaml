    rationale: «К нам отнесутся слова Писания» истолковывает и сглаживает необычный предикативный оборот. Его следует оставить в основном тексте максимально буквально и пояснить сноской.
  - severity: medium
    issue: «Образ и подобие» вместо пары «counterpart and copy/image»
    rationale: Русская библейская формула создаёт дополнительную интертекстуальную окраску и не сохраняет различие между отображением/соответствием и образом. Нужна более нейтральная пара.
  - severity: low
    issue: «Вот сколь прекрасны жизнь и бессмертие»
    rationale: Исходное выражение характеризует величие или значительность жизни и бессмертия, а не их эстетическую красоту.
  - severity: low
    issue: Сноска d чрезмерно предварительна
