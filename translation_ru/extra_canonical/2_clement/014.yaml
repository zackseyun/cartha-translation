base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/014.yaml
  text: 'Therefore, brothers and sisters, if we do the will of God our Father, we will belong to the first church, which is spiritual and was created before the sun and the moon. But if we do not do the will of the Lord, we will belong to the scripture that says, “My house was made a den of robbers.” So then, let us choose instead to belong to the church of life, so that we may be saved.


    I do not suppose that you are unaware that the living church is the body of Christ, for the scripture says, “God made the human being male and female.” The male is Christ, and the female is the church. And the Books and the Apostles plainly declare that the church does not exist now for the first time, but has existed from the beginning. For she was spiritual, just as our Jesus also was spiritual, but she was revealed in the last days so that he might save us.


    Now the church, being spiritual, was revealed in the flesh of Christ, thereby showing us that if any of us guards her in the flesh and does not defile her, that person will receive her again in the Holy Spirit. For this flesh is the counterpart and copy of the spirit. Therefore, no one who has defiled the copy will receive the original as their portion. This, then, is what he means, brothers and sisters: “Guard the flesh, so that you may partake of the spirit.”


    But if we say that the flesh is the church and the spirit is Christ, then whoever has treated the flesh wantonly has treated the church wantonly. Such a person, therefore, will not partake of the spirit, which is Christ>.


    So excellent are the life and immortality that this flesh can receive as its portion if the Holy Spirit is joined to it. No one can declare or tell the things that the Lord has prepared for his elect.'
translation:
  language: ru
  text: 'Итак, братья и сёстры, если мы исполняем волю Бога, нашего Отца, то будем принадлежать к первой Церкви — духовной, сотворённой прежде солнца и луны. Если же мы не исполняем волю Господа, то будем от того Писания, которое говорит: «Дом Мой стал притоном разбойников».[a] Поэтому лучше изберём принадлежать к Церкви жизни, чтобы нам спастись.


    Думаю, вам известно, что живая Церковь — это тело Христа, ибо Писание говорит: «Бог сотворил человека мужчиной и женщиной».[b] Мужчина — это Христос, а женщина — Церковь. И Книги[c], и апостолы ясно возвещают, что Церковь существует не впервые теперь, но существует от начала. Ведь она была духовной, как духовен был и наш Иисус, а в последние дни явилась, чтобы Он спас нас.[d]


    Итак, духовная Церковь явилась в плоти Христа, тем самым показывая нам: если кто-либо из нас сохранит её в плоти и не осквернит её, тот вновь получит её в Святом Духе.[e] Ибо эта плоть — отображение и образ духа. Поэтому никто, осквернив отображение, не получит в удел первообраз. Вот что это значит, братья и сёстры: «Храните плоть, чтобы стать причастными духу».


    Но если мы говорим, что плоть — это Церковь, а дух — Христос, тогда тот, кто обесчестил плоть, обесчестил Церковь. Поэтому такой человек не станет причастным духу, то есть Христу.


    Столь велики жизнь и бессмертие, которые эта плоть может получить в удел, когда с нею соединяется Святой Дух! Никто не может ни изречь, ни возвестить того, что Господь приготовил Своим избранным.[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ср. Иер. 7:11; Мф. 21:13 и параллельные места. Оборот «будем от того Писания» необычен; его точный смысл остаётся неясным.
    reason: Сохраняет необычную формулировку текста и отмечает её библейский фон без истолковательного сглаживания.
  - marker: b
    text: 'Ср. Быт. 1:27. Цитата приведена в форме единственного числа: «человека».'
    reason: Указывает источник и существенную грамматическую особенность цитаты.
  - marker: c
    text: «Книги» — вероятно, священные книги Писания; слово стоит рядом с «апостолами» и не позволяет уверенно определить конкретный канон.
    reason: Не сужает неоднозначное обозначение до определённого состава книг.
  - marker: d
    text: В этой фразе «явилась» относится к Церкви, тогда как подразумеваемый субъект глагола «спас» — Иисус. Перевод сохраняет эту смену референта.
    reason: Сохраняет грамматическую и смысловую напряжённость текста без богословской гармонизации.
  - marker: e
    text: Неясно, означает ли «вновь получит её» получение Церкви, её духовной реальности или соответствующего ей удела; перевод сохраняет местоименную неоднозначность.
    reason: Предупреждает о подлинной референциальной неоднозначности.
  - marker: f
    text: Ср. 1 Кор. 2:9; Ис. 64:4.
    reason: Отмечает вероятную библейскую аллюзию.
lexical_decisions:
- source_word: brethren (Greek source review pending)
  choice: братья и сёстры
  rationale: Передаёт обращение ко всей общине естественным современным русским языком; греческая форма требует проверки по источнику.
- source_word: first Church
  choice: первая Церковь
  rationale: Сохранена необычная формулировка свидетеля и её богословская напряжённость, без истолкования как «первоначальная» или «древняя».
- source_word: Church of life
  choice: Церковь жизни
  rationale: Формальное и понятное соответствие, сохраняющее возможную многозначность родительного оборота.
- source_word: counterpart and copy
  choice: образ и подобие
  rationale: Достоинный русский оборот, выражающий связь земного изображения с духовным первообразом; далее «original» передано как «первообраз» для ясности этой пары.
- source_word: dealt wantonly with
  choice: надругался над
  rationale: Передаёт тяжёлое нравственное осквернение сильнее, чем нейтральное «плохо обошёлся», не конкретизируя его вид.
- source_word: partake of
  choice: приобщиться к
  rationale: Естественное для религиозно-нравственного контекста обозначение участия, без обязательной сакраментальной конкретизации.
theological_decisions:
- issue: Предсуществование духовной Церкви
  choice: Сохранено утверждение, что первая духовная Церковь сотворена прежде солнца и луны и существует от начала.
  alternative: Смягчить до предвечного Божьего замысла о Церкви.
  rationale: Текст прямо высказывает более сильное положение; перевод не должен заменять его позднейшей богословской гармонизацией.
- issue: Типологическое толкование мужчины и женщины
  choice: 'Сохранено: мужчина — Христос, женщина — Церковь.'
  alternative: Передать лишь как сравнение или символ.
  rationale: Свидетель формулирует прямое отождествление, и его следует оставить явным.
- issue: Местоименная неоднозначность в «was manifested ... that He might save us»
  choice: «Она ... явилась, чтобы Он спас нас».
  alternative: «Он явился ... чтобы спасти нас» или «она явилась ... чтобы спасти нас».
  rationale: 'Так сохраняется смена референта, отражённая английским свидетелем: явление относится к Церкви, спасение — ко Христу; греческий текст нуждается в прямой проверке.'
- issue: Соотношение Церкви, плоти, духа и Христа
  choice: Сохранены последовательные отождествления автора без систематического согласования.
  alternative: Истолковать «плоть» исключительно как индивидуальное тело верующего либо исключительно как историческое тело Христа.
  rationale: Отрывок намеренно переходит между экклезиологическим, христологическим и антропологическим уровнями; перевод не должен устранять эту напряжённость.
- issue: Условие получения жизни и бессмертия
  choice: «если соединится с ней Святой Дух».
  alternative: «если в неё вселится Святой Дух» или «если она соединится со Святым Духом».
  rationale: Сохранена направленность формулировки свидетеля и не уточнён механизм соединения.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным церковным регистром. «Церковь» пишется с прописной буквы, когда обозначает духовную реальность/сообщество в авторском рассуждении. Архаизмы по возможности устранены, но ключевые термины «плоть», «дух», «удел», «первообраз» сохранены ради смысловой точности. Проект остаётся предварительным, поскольку предоставлен английский публичнодоменный свидетель, а прямая сверка с греческой рукописной традицией ещё не выполнена.
