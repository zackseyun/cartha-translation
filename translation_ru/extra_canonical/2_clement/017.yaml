base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/017.yaml
  text: 'Therefore, let us repent with our whole heart, so that none of us perishes along the way. For if we have received commands to make it our business to draw people away from idols and instruct them, how much more wrong is it for a soul that already knows God to perish!


    Therefore, let us help one another, so that we may also lead the weak upward toward what is good, so that we may all be saved. And let us convert and admonish one another.


    Let us not think that we need to pay attention and believe only now. When we have gone home, let us remember the commandments of the Lord and not allow ourselves to be dragged in the other direction by our worldly desires. Instead, let us come here more frequently and strive to advance in the commandments of the Lord, so that, all having the same mind, we may be gathered together into life.


    For the Lord said, “I come to gather together all the nations, tribes, and languages.” Here he speaks about the day of his appearing, when he will come and redeem us, each person according to his works.


    And the unbelievers will see his glory and his power, and they will be amazed when they see the kingdom of the world given to Jesus. They will say, “Woe to us, for you wast, and we did not know it or believe, and we did not obey the presbyters when they told us about our salvation.” And “Their worm will not die, and their fire will not be quenched, and they will be a spectacle to all flesh.”


    He speaks about that day of judgment, when people will see those among us who live ungodly lives and have dealt falsely with the commandments of Jesus Christ.


    But when the righteous—who have done good, endured torments, and hated the pleasures of the soul—see those who have done wrong and denied Jesus by their words or their deeds being punished with severe torments in unquenchable fire, they will give glory to God and say, “There will be hope for the one who has served God with his whole heart.”'
translation:
  language: ru
  text: 'Итак, покаемся всем сердцем, чтобы никто из нас не погиб на пути. Ведь если нам заповедано считать своим делом отвращать людей от идолов и наставлять их, то тем более недопустимо, чтобы погибла душа, уже знающая Бога!


    Поэтому будем помогать друг другу, чтобы и слабых вести к добру и чтобы всем нам спастись. Будем обращать и вразумлять друг друга.


    Не будем думать, будто внимать и верить нужно лишь сейчас. Когда уйдём домой, будем помнить заповеди Господа и не позволим мирским страстям увлечь нас в другую сторону. Напротив, будем чаще приходить сюда и стараться преуспевать в заповедях Господа, чтобы всем нам, единодушным, быть собранными к жизни.


    Ибо Господь сказал: «Я иду собрать все народы, племена и языки».[a] Здесь Он говорит о дне Своего явления, когда придёт и воздаст каждому по его делам.[b]


    Тогда неверующие увидят Его славу и могущество и изумятся, увидев, что царство мира отдано Иисусу. Они скажут: «Горе нам! Ведь Ты был, а мы не знали Тебя и не верили; мы не слушались пресвитеров, когда они говорили нам о нашем спасении». И: «Червь их не умрёт, и огонь их не угаснет, и будут они зрелищем для всякой плоти».[c]


    Он говорит о том дне суда, когда люди увидят тех из нашей среды, кто живёт нечестиво и лукаво обходится с заповедями Иисуса Христа.


    А праведные, творившие добро, перенёсшие мучения и возненавидевшие наслаждения души, увидят тех, кто поступал дурно и отрёкся от Иисуса словом или делом, как те терпят тяжкие мучения в неугасимом огне. Тогда они прославят Бога и скажут: «Есть надежда для того, кто служил Богу всем сердцем».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ср. Ис. 66:18. Цитата приведена в форме, отличающейся от привычного текста пророчества.
    reason: Указывает вероятный библейский источник и сохраняет особую форму цитаты.
  - marker: b
    text: В доступном английском свидетельстве стоит «искупит нас», однако греч. ἀποδώσει в контексте слов «каждому по его делам» означает «воздаст».
    reason: Фиксирует существенное лексическое расхождение английского свидетельства с греческим текстом.
  - marker: c
    text: Ср. Ис. 66:24; выражение о неумирающем черве и неугасимом огне также использовано в Мк. 9:48.
    reason: Обозначает библейскую аллюзию.
lexical_decisions:
- source_word: repent
  choice: покаемся
  rationale: Передаёт призыв к нравственному обращению и покаянию в естественной для раннехристианского текста русской форме.
- source_word: convert
  choice: исправлять
  rationale: В данном взаимном увещании речь, вероятнее всего, об обращении человека от ошибочного пути; «исправлять» естественно сочетается с «вразумлять» и не предполагает конфессионального перехода.
- source_word: presbyters
  choice: пресвитеров
  rationale: Сохранён раннехристианский служебный термин без подмены более поздним или конфессионально окрашенным названием.
- source_word: redeem
  choice: воздаст нам
  rationale: Контекст «каждому по делам» и доступные греческие данные для 2 Клим. 17 поддерживают значение воздаяния; английское witness-rendering «redeem» отмечено как спорное.
- source_word: pleasures of the soul
  choice: душевные наслаждения
  rationale: Сохранено необычное и потенциально неоднозначное выражение, не сведённое молча к телесным удовольствиям.
- source_word: dealt falsely with the commandments
  choice: поступает вероломно по отношению к заповедям
  rationale: Сохраняет моральную силу образа неверности заповедям, не сужая его до простого нарушения.
theological_decisions:
- issue: Связь спасения с делами и будущим судом
  choice: Сохранены формулировки «каждому по его делам» и призывы к деятельному послушанию
  alternative: Смягчить их систематическим пояснением о вере или благодати
  rationale: Текст намеренно связывает эсхатологическое воздаяние с делами; добавочное догматическое согласование исказило бы его напряжение.
- issue: Субъект отречения
  choice: «отрекался от Иисуса словом или делом»
  alternative: «отвергал Иисуса» или «не признавал Иисуса»
  rationale: «Отрекался» сохраняет личный и исповедальный характер отрицания, включая поступки.
- issue: Статус финального утверждения о надежде
  choice: «Есть надежда для того, кто служил Богу всем сердцем»
  alternative: «Есть надежда, потому что он служил Богу...»
  rationale: Сохранена общая сентенция и её условно-нравственная сила без уточнения механизма спасения.
translation_notes:
  register: Современный литературный русский язык с достойным раннехристианским проповедническим звучанием. Архаизмы сведены к минимуму; сохранены термины «пресвитеры», «всякая плоть» и эсхатологическая образность. Проект подготовлен с учётом предоставленного английского свидетельства и выборочной сверки доступных греческих форм; полный критический обзор греческой рукописной традиции всё ещё желателен.
