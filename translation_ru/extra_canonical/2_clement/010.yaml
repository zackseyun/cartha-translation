base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/010.yaml
  text: 'Wherefore, my brethren, let us do the will of the Father who called us, that we may live; and let us rather pursue virtue, but forsake vice as the forerunner of our sins, and let us flee from ungodliness, lest evils overtake us.


    For if we are diligent in doing good, peace will pursue us.


    For this cause a person is unable to attain happiness, seeing that they call in the fears of men, preferring the enjoyment that is here to the promise that is to come.


    For they do not know how great a torment the enjoyment that is here brings, and what delight the promise that is to come brings.


    And if indeed they were doing these things by themselves alone, it would have been tolerable; but now they continue teaching evil to innocent souls, not knowing that they shall have their condemnation doubled, both themselves and their hearers.'
translation:
  language: ru
  text: '10


    Итак, братья мои, будем исполнять волю призвавшего нас Отца, чтобы нам жить. Будем прежде всего стремиться к добродетели, а порок оставим, ведь он предшествует нашим грехам; будем бежать от нечестия, чтобы нас не настигли беды.


    Ведь если мы будем усердно делать добро, мир последует за нами.


    Вот почему человек не может обрести блаженство[a]: люди поддаются человеческим страхам, предпочитая здешнее наслаждение грядущему обещанию.


    Они не знают, какое великое мучение приносит здешнее наслаждение и какую отраду — грядущее обещание.


    Если бы они сами только так поступали, это ещё можно было бы вынести. Но теперь они упорно учат злу невинные души, не зная, что понесут двойное осуждение — и за себя, и за тех, кто их слушает.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Место в греческой рукописной традиции передаётся и понимается не вполне уверенно; «обрести блаженство» — контекстуальное восполнение смысла.
    reason: Предоставленный английский свидетель отмечает соответствующие слова как добавленные переводчиком, а прямая сверка всего греческого чтения ещё требуется.
lexical_decisions:
- source_word: τὸ θέλημα
  choice: волю
  rationale: Передаёт волю Отца как то, что надлежит исполнять, без конфессионального уточнения.
- source_word: ἀρετήν
  choice: добродетели
  rationale: Обычное и содержательно широкое соответствие нравственной доблести или благого образа жизни.
- source_word: κακίαν
  choice: порок
  rationale: Сохраняет противопоставление добродетели; слово может охватывать зло, порочность и дурное поведение.
- source_word: πρόδρομον
  choice: предшествует
  rationale: Естественно передаёт образ предвестника или предшественника грехов, не усиливая причинную связь.
- source_word: ἀσέβειαν
  choice: нечестия
  rationale: Передаёт отсутствие должного почтения к Богу и нравственную безбожность без узкого догматического смысла.
- source_word: εἰρήνη
  choice: мир
  rationale: 'Сохраняет персонифицированный образ: мир сам следует за делающими добро.'
- source_word: ἀπόλαυσιν
  choice: наслаждение
  rationale: Сохраняет контраст между временным удовольствием и будущим обещанием, включая отрицательный оттенок контекста.
- source_word: ἐπαγγελίαν
  choice: обещанию
  rationale: Не уточняет содержание обещанного и тем самым сохраняет лаконичность источника.
- source_word: ἀκεραίους ψυχάς
  choice: невинные души
  rationale: Передаёт смысл неискушённых, неиспорченных или чистых душ в понятной современной форме.
theological_decisions:
- issue: Связь исполнения воли Отца с жизнью
  choice: «будем исполнять… чтобы нам жить»
  alternative: «будем исполнять… и тогда получим жизнь»
  rationale: Сохранена целевая конструкция без решения вопроса о точном богословском характере этой связи.
- issue: Будущее обещание
  choice: «грядущее обещание»
  alternative: «обещанная будущая жизнь»
  rationale: Источник не называет содержание обещания прямо, поэтому оно не конкретизировано.
- issue: Двойное осуждение учителей зла
  choice: «и за себя, и за тех, кто их слушает»
  alternative: «и они сами, и их слушатели»
  rationale: Формулировка показывает ответственность развращающих других, но не утверждает, что вина слушателей полностью переносится на учителей.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Синтаксис упрощён лишь там, где это необходимо для ясности; параллелизм, повтор «обещание» и образ мира, следующего за человеком, сохранены. Поскольку в задании греческая сверка обозначена как ожидающая выполнения, спорное место отмечено сноской, а перевод не выдаёт реконструкцию за бесспорное чтение.
