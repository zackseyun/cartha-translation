base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/015.yaml
  text: 'Now I do not think that I have given any insignificant counsel concerning self-control, and whoever performs it will not regret it, but will save both himself and me, his counselor. For it is no small reward to convert a wandering and perishing soul, so that it may be saved.


    For this is the recompense that we are able to pay to God who created us: if he who speaks and he who hears both speak and hear with faith and love.


    Let us therefore abide in the things we have believed, in righteousness and holiness, that we may be with boldness before God, who says, “While you are still speaking, I will say, ‘Behold, I am here.’”


    For this word is the token of a great promise; for the Lord says of himself that he is more ready to give than the one who asks is to ask.


    Seeing, then, that we are partakers of so great kindness, let us not begrudge ourselves the obtaining of so many good things. For in proportion as the pleasure is great which these words bring to those who have performed them, so also is the condemnation great which they bring to those who have disobeyed.'
translation:
  language: ru
  text: 'Я не думаю, что дал вам маловажный совет о воздержании. Кто исполнит его, тот не пожалеет об этом, но спасёт и себя, и меня, своего советчика. Ведь немалая награда — обратить заблудшую и погибающую душу, чтобы она спаслась.


    Именно такое воздаяние мы можем принести сотворившему нас Богу, если и говорящий, и слушающий говорят и слушают с верой и любовью.


    Итак, будем твёрдо держаться того, во что уверовали, живя в праведности и святости, чтобы смело обращаться с просьбой к Богу, Который говорит: «Пока ты ещё говоришь, Я скажу: „Вот Я!“»[a]


    Эти слова — знак великого обещания, ведь Господь говорит о Себе, что Он ещё охотнее даёт, чем просящий обращается к Нему с просьбой.


    Итак, поскольку мы причастны столь великой благости, не станем лишать самих себя множества благ. Ведь сколь велика радость, которую эти слова приносят исполняющим их, столь же велико осуждение, которое они приносят ослушавшимся.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ср. Ис. 58:9. Цитата передана в форме, засвидетельствованной во 2 Климента; её формулировка может отличаться от текста современных переводов книги Исаии.
    reason: Указывает библейский источник и объясняет различие цитатной формы, не подменяя текст позднейшей стандартизацией.
lexical_decisions:
- source_word: ἐγκράτεια (передано в английском свидетельстве как continence / self-control)
  choice: воздержание
  rationale: Сохраняет раннехристианский нравственно-аскетический смысл и звучит естественно в современном литературном русском; более широкое «самообладание» могло бы ослабить контекст.
- source_word: πλανωμένην … καὶ ἀπολλυμένην ψυχήν (ср. wandering and perishing soul)
  choice: заблудшую и погибающую душу
  rationale: Передаёт одновременно уклонение с верного пути и продолжающуюся опасность погибели, не превращая второе причастие в утверждение об уже окончательной участи.
- source_word: ἀντιμισθία / recompense
  choice: воздаяние
  rationale: Сохраняет идею ответного дара или отплаты Богу, не сводя её к денежному «вознаграждению».
- source_word: παρρησία / boldness
  choice: смело
  rationale: В контексте молитвенного обращения обозначает открытость и дерзновение перед Богом; наречие обеспечивает естественный русский синтаксис.
- source_word: χρηστότης / kindness
  choice: благость
  rationale: Передаёт деятельную доброту Бога в возвышенном, но понятном регистре.
theological_decisions:
- issue: Утверждение, что исполнивший совет «спасёт и себя, и советчика»
  choice: Сохранена прямая формулировка без поясняющего ограничения
  alternative: «послужит спасению и себя, и меня»
  rationale: Исходное свидетельство выражается резко и прямо; смягчение могло бы преждевременно разрешить богословское напряжение между человеческим содействием и Божьим спасением.
- issue: Ответное воздаяние сотворившему нас Богу
  choice: «воздаяние мы можем принести… Богу»
  alternative: «так мы можем отблагодарить Бога»
  rationale: Выбранный вариант сохраняет образ ответного воздаяния, не предполагая, будто человек способен полностью отплатить Богу.
- issue: Готовность Господа дать прежде полноты человеческой просьбы
  choice: 'Передано сравнением: Он охотнее даёт, чем просящий обращается с просьбой'
  alternative: «Он готов дать прежде, чем просящий успеет попросить»
  rationale: Сравнительная форма ближе к свидетельству и сохраняет его риторическую парадоксальность.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным церковно-нравственным регистром. Архаизмы и тяжёлые кальки устранены, но ключевые образы — спасение души, праведность, святость, воздаяние, благость и осуждение — сохранены. Поскольку прямой разбор греческого источника в предоставленных данных отмечен как ожидающий проверки, спорные места сверены по доступному свидетельству и сформулированы без излишней догматической конкретизации.
