    Именно такое воздаяние мы можем принести сотворившему нас Богу: пусть и говорящий, и слушающий говорят и слушают с верой и любовью.


    Итак, будем твёрдо держаться того, во что уверовали, живя в праведности и святости, чтобы смело просить Бога, Который говорит: «Ты ещё будешь говорить, а Я уже скажу: „Вот Я!“»[a]


