base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_clement/002.yaml
  text: '“Rejoice, you barren woman who never gave birth. Break out and cry aloud, you who were never in labor, for the children of the desolate woman are more numerous than the children of the woman who has a husband.” When he said, “Rejoice, you barren woman who never gave birth,” he was speaking about us, for our church was barren before children were given to her.


    And when he said, “Cry aloud, you who were never in labor,” he meant this: Let us not grow weary, like women in labor, of offering our prayers to God with simplicity.


    Again, when he said, “For the children of the desolate woman are more numerous than those of the woman who has a husband,” he spoke this way because our people seemed desolate and abandoned by God. But now, having believed, we have become more numerous than those who seemed to have God.


    Again, another Scripture says, “I did not come to call the righteous, but sinners.”


    He means this: It is right to save those who are perishing.


    For this truly is a great and marvelous work: to establish not the things that are standing, but the things that are falling.


    So Christ also desired to save the things that were perishing. And he saved many, coming and calling us when we were already perishing.'
translation:
  language: ru
  text: '«Возрадуйся, бесплодная, не рождавшая! Воскликни и возгласи, не мучившаяся родами, потому что у оставленной детей больше, чем у той, у которой есть муж».[a] Сказав: «Возрадуйся, бесплодная, не рождавшая», Писание говорило о нас, ведь наша церковь была бесплодна, прежде чем ей были даны дети.


    А сказав: «Возгласи, не мучившаяся родами», оно говорит вот что: не будем, словно роженицы, изнемогать, вознося к Богу наши прошения с простотой.


    И ещё, сказав: «У оставленной детей больше, чем у той, у которой есть муж», оно выразилось так потому, что наш народ казался оставленным и покинутым Богом. Теперь же, уверовав, мы стали многочисленнее тех, кто, казалось, имел Бога.


    И ещё другое место Писания говорит: «Я пришёл призвать не праведников, а грешников».[b]


    Это означает, что надлежит спасать погибающих.


    Ибо поистине великое и дивное дело — укреплять не то, что стоит, а то, что падает.


    Так и Христос пожелал спасти погибавших. Он спас многих, придя и призвав нас, когда мы уже погибали.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ср. Ис. 54:1.
    reason: Опознаёт цитируемое место Писания без включения ссылки в основной текст.
  - marker: b
    text: Ср. Мф. 9:13; Мк. 2:17; Лк. 5:32.
    reason: Указывает синоптические параллели приведённого евангельского изречения.
lexical_decisions:
- source_word: στεῖρα
  choice: бесплодная
  rationale: Сохраняет образ женщины, не способной родить, и обеспечивает связь цитаты с последующим толкованием о бесплодной церкви.
- source_word: ἔρημος
  choice: оставленная
  rationale: В цитате слово описывает женщину, лишённую семейной опоры; «оставленная» естественно по-русски и поддерживает дальнейшее пояснение об оставленном народе.
- source_word: ἐκκλησία
  choice: церковь
  rationale: Здесь речь идёт о собрании верующих как о матери, получившей детей; общеупотребительное «церковь» сохраняет раннехристианский образ.
- source_word: δεήσεις
  choice: прошения
  rationale: Передаёт конкретные молитвенные обращения и не сводит выражение к молитве вообще.
- source_word: ἁπλότης
  choice: простота
  rationale: Сохраняет широкое значение искренности, цельности и отсутствия лукавства, не сужая его до одного толкования.
- source_word: ἀπολλυμένους / ἀπολλύμενα
  choice: погибающих / погибавших
  rationale: Причастная форма обозначает находящихся в процессе гибели; это важнее, чем более статичное «погибших».
- source_word: στηρίζειν
  choice: укреплять
  rationale: Сохраняет метафорическую пару со стоящим и падающим, не подменяя её более отвлечённым «поддерживать».
theological_decisions:
- issue: Кто говорит в толковании цитаты из Исаии
  choice: «Писание говорило… оно говорит»
  alternative: «Он говорил… он имеет в виду»
  rationale: В ближайшем контексте автор истолковывает слова Писания, а явный личный субъект в переданном тексте не назван. Формулировка избегает необоснованного отождествления говорящего с Богом, Христом или пророком.
- issue: Фраза о тех, кто «имел Бога»
  choice: «кто, казалось, имел Бога»
  alternative: «кто считался Божьим народом»
  rationale: Более буквальная формулировка сохраняет резкость и богословскую напряжённость оригинального сопоставления, не объясняя заранее, какую именно группу имеет в виду автор.
- issue: Христос и погибающие
  choice: «пожелал спасти погибавших»
  alternative: «пришёл спасти погибших»
  rationale: Сохраняются и волевое выражение автора, и незавершённый аспект состояния тех, кого Христос призвал.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианской проповеди. Синтаксис сделан ясным для чтения вслух; повторения цитаты и ключевых образов бесплодия, родов, оставленности, стояния и падения сохранены. Формы «возрадуйся», «возгласи», «надлежит» поддерживают библейский регистр, не создавая чрезмерно архаичной речи. Черновик сверен с доступными данными греческой традиции и предоставленным публичным английским свидетелем; перед окончательной публикацией желательна полная текстологическая сверка с критическим греческим изданием.
