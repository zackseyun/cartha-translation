  revision_rationale: 'Исправлены две существенные смысловые детали греческого текста: ἔρημος в пояснении о церкви передано отдельно от στεῖρα в цитате, а средний род τὰ ἀπολλύμενα сохранён в заключительном обобщении. Личный субъект авторского толкования не отождествлён с Писанием, Богом, Христом или пророком: местоимение «он» намеренно сохраняет исходную референциальную неявность. Сноски структурно корректны и оставлены без изменения.'
