review_pass:
  verdict: revise
  source_fidelity: 'Нужна правка по греческой форме и образности. В толковании Ис 54:1 церковь названа ἔρημος («оставленной», «безлюдной», «пустующей»), а не στεῖρα («бесплодной»): слово «бесплодна» в этом предложении смешивает два различных образа. Кроме того, в заключении автор сначала говорит средним родом о «том, что погибало» (τὰ ἀπολλύμενα), а затем — о людях, которых Христос призвал; это различие следует сохранить. Личный субъект в формулах «сказав… он говорил/имел в виду» следует передать личным местоимением, а не подменять его словом «Писание».'
  naturalness: Текст в целом звучит естественно и соответствует современному литературному регистру. «Безлюдна» в контексте церкви-матери и данных ей детей ясно передаёт образ пустоты; «искренне» несколько естественнее наречия «с простотой» в сочетании с молитвами, но не исключает широкого смысла ἁπλῶς.
  terminology: «Церковь», «прошения», «погибающие», «укреплять» уместны. «Оставленная» в цитате сохраняет ἔρημος. В пояснении «безлюдна» отличает ἔρημος от στεῖρα. Евангельская цитата и ссылки на Ис 54:1 и синоптические параллели сохранены.
  issues:
  - severity: medium
    issue: В пояснении церковь названа «бесплодной».
    rationale: 'В данном предложении греческий текст имеет ἔρημος, тогда как «бесплодная» соответствует στεῖρα в самой цитате. Следует передать иной образ: церковь была безлюдна/оставлена до того, как ей были даны дети.'
  - severity: medium
    issue: «Писание говорило… оно говорит» заменяет личный субъект оригинала.
    rationale: В тексте стоят личные формы с подразумеваемым мужским субъектом («сказав…, он говорил/имел в виду»). Замена на «Писание» является интерпретационной и меняет референцию; нейтральное «он» сохраняет исходную недосказанность.
  - severity: medium
    issue: В последнем абзаце «погибавших» не сохраняет средний род τὰ ἀπολλύμενα.
    rationale: 'Автор сначала говорит обобщённо: Христос хотел спасти «то, что погибало», затем конкретно — что Он спас многих, призвав «нас», погибавших. Русский перевод должен сохранить этот переход.'
  revised_text: '«Возрадуйся, бесплодная, не рождавшая! Воскликни и возгласи, не мучившаяся родами, потому что у оставленной детей больше, чем у той, у которой есть муж».[a] Сказав: «Возрадуйся, бесплодная, не рождавшая», он говорил о нас, ведь наша церковь была безлюдна, прежде чем ей были даны дети.


    А сказав: «Возгласи, не мучившаяся родами», он имел в виду вот что: не будем, словно роженицы, изнемогать в наших искренних прошениях к Богу.


    И ещё, сказав: «У оставленной детей больше, чем у той, у которой есть муж», он выразился так потому, что наш народ казался оставленным и покинутым Богом. Теперь же, уверовав, мы стали многочисленнее тех, кто, казалось, имел Бога.


    И ещё другое место Писания говорит: «Я пришёл призвать не праведников, а грешников».[b]


    Это означает, что надлежит спасать погибающих.


    Ибо поистине великое и дивное дело — укреплять не то, что стоит, а то, что падает.


    Так и Христос пожелал спасти то, что погибало. Он спас многих, придя и призвав нас, когда мы уже погибали.'
  revised_footnotes:
