  yaml_path: translation/extra_canonical/2_clement/012.yaml
  text: 'Therefore let us await the kingdom of God betimes in love and righteousness, since we do not know the day of God’s appearing.


    For the Lord himself, being asked by a certain person when his kingdom would come, said, “When the two shall be one, and the outside as the inside, and the male with the female, neither male nor female.”


    Now the two are one when we speak truth among ourselves, and in two bodies there shall be one soul, without dissimulation.


    And by the outside as the inside he means this: by the inside he means the soul, and by the outside the body. Therefore, in like manner as the body appears, so also let your soul be manifest by its good works.


    And by the male with the female, neither male nor female, he means this: that a brother seeing a sister should have no thought of her as a female, and that a sister seeing a brother should have no thought of him as a male.


    “These things, if you do,” he says, “the kingdom of my Father shall come.”'
translation:
  language: ru
  text: 'Итак, будем постоянно[a] ожидать Царства Божьего в любви и праведности, потому что не знаем дня явления Божьего.


    Ведь Сам Господь, когда некто спросил Его, когда придёт Его Царство, сказал: «Когда двое станут одним, внешнее — как внутреннее, а мужское с женским — ни мужским, ни женским».[b]


    Двое же — одно, когда мы говорим друг другу истину и в двух телах пребывает одна душа без всякого притворства.


    А слова «внешнее — как внутреннее» означают вот что: внутреннее — это душа, а внешнее — тело. Поэтому, как видно твоё тело, так пусть и душа твоя станет видна в добрых делах.


    А слова «мужское с женским — ни мужским, ни женским» означают вот что: чтобы брат, увидев сестру, не помышлял о ней как о женщине, а сестра, увидев брата, не помышляла о нём как о мужчине.[c]


    «Если вы это исполните, — говорит Он, — придёт Царство Моего Отца».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Выражение можно передать более буквально: «с часу на час» или «час за часом»; оно подчёркивает постоянную готовность и ожидание.'
    reason: Сохраняет переводческую альтернативу, не представляя предварительную реконструкцию греческой формы как уже проверенный факт.
  - marker: b
    text: Это изречение не содержится в таком виде в канонических Евангелиях; близкие формы известны по раннехристианской традиции. Здесь оно сохранено именно в той форме, в какой его приводит автор.
    reason: Предотвращает ошибочное отождествление цитаты с конкретным каноническим стихом, не ставя под сомнение авторскую атрибуцию Господу.
  - marker: c
    text: То есть, согласно данному здесь объяснению, брат и сестра не должны смотреть друг на друга прежде всего как на лиц противоположного пола. Необычная формулировка сохранена без дальнейшего догматического уточнения.
    reason: Поясняет ход авторского толкования, не сводя неоднозначное выражение к одной поздней интерпретации.
