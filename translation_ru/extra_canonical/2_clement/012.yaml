  rationale: Современная и ясная передача идеи нелицемерного единства.
- source_word: ἄρρεν … θῆλυ (предполагаемый греческий текст традиции)
  choice: мужское … женское / мужским … женским
  rationale: Субстантивированные формы сохраняют необычную формулировку изречения; в авторском толковании употреблены естественные «мужчина» и «женщина».
theological_decisions:
- issue: Необычное изречение о двух, внешнем и внутреннем, мужском и женском
  choice: Сохранено как самостоятельное изречение Господа и передано без гармонизации с каноническими Евангелиями
  alternative: Переформулировать по Гал 3:28 или связать с конкретным каноническим евангельским текстом
  rationale: Автор сам приводит и истолковывает это изречение; отождествление с иным текстом устранило бы его подлинную форму и богословское напряжение.
- issue: Приход Царства как следствие исполнения наставлений
  choice: Сохранена условная конструкция «Если вы это исполните… придёт»
  alternative: Ослабить причинно-условную связь выражением вроде «тогда вы увидите Царство»
  rationale: Исходное свидетельство формулирует прямое условие; перевод не должен заранее согласовывать его с определённой системой учения о спасении.
- issue: Толкование различия между мужчиной и женщиной
  choice: Сохранено нравственно-аскетическое объяснение автора без дополнительных уточнений
  alternative: Истолковать как отрицание половых различий или исключительно как запрет похоти
  rationale: Фраза допускает вопросы о точном объёме смысла; перевод сохраняет её формулировку и не навязывает более узкое догматическое прочтение.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным раннехристианским регистром. Синтаксис упрощён там, где это улучшает ясность, но параллелизм и повтор ключевых формул сохранены. Заглавные буквы в местоимениях, относящихся к Господу, применены последовательно по принятой русской религиозной издательской норме. Поскольку в задании приведён английский публично-доменный свидетель, а прямая сверка с полной греческой рукописной и критической традицией обозначена как ожидающая выполнения, решения по греческим лексемам считаются предварительными и основаны на известной форме греческого текста 2 Клим. 12.
