translation:
  language: ru
  text: 'Итак, пока мы на земле, будем каяться, ведь мы — глина в руках мастера.


    Когда гончар делает сосуд и тот в его руках искривится или сомнётся, он снова придаёт ему форму. Но если он уже поставил его в огненную печь, то больше не сможет его исправить. Так и мы, пока находимся в этом мире, будем всем сердцем каяться в том зле, которое совершили во плоти, чтобы Господь спас нас, пока у нас ещё есть время для покаяния.


    Ведь после того, как мы уйдём из этого мира, мы уже не сможем там ни исповедаться, ни покаяться.


    Поэтому, братья, если мы исполним волю Отца, сохраним плоть в чистоте и соблюдём заповеди Господа, то получим вечную жизнь.


    Ведь Господь говорит в Евангелии: «Если вы не сохранили малого, кто даст вам великое? Говорю вам: верный в малом верен и во многом».[a]


    Итак, смысл этих слов таков: «Храните плоть в чистоте, а печать — незапятнанной, чтобы нам получить жизнь».[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Это изречение соединяет формулировки, близкие к Лк. 16:10–12; в сохранившихся канонических Евангелиях оно не встречается дословно в таком виде.
    reason: Помогает читателю распознать евангельскую традицию, не создавая впечатления точной дословной цитаты.
  - marker: b
    text: «Печать» оставлена без поясняющего толкования; возможный специальный смысл этого образа по данному свидетельству нельзя установить с полной уверенностью.
    reason: Сохраняет подлинную неоднозначность и предупреждает конфессионально обусловленное прочтение.
lexical_decisions:
- source_word: clay under the craftsman's hand
  choice: глина в руках мастера
  rationale: Сохранён образ податливой глины и власти мастера; выражение естественно звучит по-русски.
- source_word: twisted or crushed
  choice: искривится или сомнётся
  rationale: Переданы два вида повреждения сосуда без сведения их к одному общему понятию.
- source_word: make confession
  choice: исповедаться
  rationale: Передаёт признание грехов без уточнения церковного обряда, которого сам текст прямо не оговаривает.
- source_word: kept the flesh pure
  choice: сохраним плоть в чистоте
  rationale: Сохранено буквальное и богословски напряжённое выражение «плоть», без замены толкованием вроде «тело» или «нравственная чистота».
- source_word: the seal unstained
  choice: печать — незапятнанной
  rationale: Образ печати сохранён без попытки определить, означает ли она крещение, веру, принадлежность Богу или нечто иное.
theological_decisions:
- issue: Возможность покаяния после ухода из мира
  choice: утверждение сохранено прямо и без смягчения
  alternative: истолковать как пастырское предостережение, не формулирующее учения о посмертной участи
  rationale: Текст прямо говорит, что после ухода из мира уже нельзя исповедаться или покаяться; перевод не должен ни усиливать, ни устранять эту напряжённость.
- issue: Чистота плоти
  choice: сохранён термин «плоть»
  alternative: передать как «тело» или истолковать как половую/нравственную чистоту
  rationale: Более конкретные варианты преждевременно разрешили бы смысловую неоднозначность.
- issue: Значение печати
  choice: образ оставлен без толкования
  alternative: уточнить как «крещальная печать»
  rationale: Предоставленные данные не дают достаточного основания вводить конфессионально окрашенное уточнение.
- issue: Связь исполнения заповедей и вечной жизни
  choice: условная конструкция сохранена
  alternative: переформулировать так, чтобы явно согласовать её с определённым учением о спасении
  rationale: Перевод сохраняет собственную аргументацию автора и не привносит систематического богословского разрешения.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Архаические формы устранены, но ключевые образы — глина, гончар, плоть и печать — сохранены. Поскольку предоставлен лишь английский публичнодоступный свидетель и прямой анализ греческого текста ещё не выполнен, формулировки следует считать источниково осторожным предварительным проектом.
