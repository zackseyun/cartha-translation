  yaml_path: translation/extra_canonical/epistle_of_barnabas/011.yaml
  text: 'But let us ask whether the Lord took care to reveal beforehand anything about the water and the cross. Now concerning the water, it is written with reference to Israel that they would not receive the baptism that brings forgiveness of sins, but would build for themselves.


    For the prophet says, “Be astonished, heaven, and let the earth shudder even more at this, for this people has done two evil things: they abandoned me, the fountain of life, and they dug for themselves a pit of death.


    “Is my holy mountain of Sinai a desert rock? For you shall be like the young birds that flutter aloft when deprived of their nest.”


    And again the prophet says, “I will go before you and level mountains, crush gates of bronze, and break iron bars in pieces. I will give you treasures—dark, concealed, and unseen—so that they may know that I am the Lord God.”


    And, “You shall dwell in a lofty cave of a strong rock.” And, “His water shall be sure. You shall see the King in glory, and your soul shall meditate on the fear of the Lord.”


    And again he says in another prophet, “The one who does these things shall be like the tree planted beside divided streams of water, which shall yield its fruit in its proper season. Its leaf shall not fall off, and everything he does shall prosper.


    “Not so the ungodly, not so. Instead, they are like the dust that the wind scatters from the face of the earth. Therefore, ungodly people shall not stand in the judgment, nor sinners in the council of the righteous. For the Lord knows the way of the righteous, but the way of the ungodly shall perish.”


    You understand how he pointed out the water and the cross at the same time. For this is the meaning: Blessed are those who set their hope on the cross and go down into the water. For he speaks of the reward “in its proper season.” “Then,” he says, “I will repay.” But what does he say about the present? “Its leaves shall not fall off.” By this he means that every word that comes from your mouth in faith and love shall lead many to conversion and hope.


    And again another prophet says, “The land of Jacob was praised above the whole earth.” He means this: He glorifies the vessel of his Spirit.


    What does he say next? “There was a river flowing from the right hand, and beautiful trees grew up from it. Whoever eats from them shall live forever.”


    He says this because we go down into the water burdened with sins and filth, and we rise from it bearing fruit in the heart, resting our fear and hope on Jesus in the spirit. “Whoever eats from these shall live forever.” He means this: “Whoever,” he says, “hears these things being spoken and believes shall live forever.”'
translation:
  language: ru
  text: 'Но исследуем, позаботился ли Господь заранее указать на воду и крест. О воде применительно к Израилю написано, что они не примут крещения, приносящего прощение грехов, но станут строить для себя.[a]


    Ибо пророк говорит: «Изумись, небо, и ещё сильнее содрогнись, земля, оттого, что народ этот совершил два зла: они оставили Меня, источник жизни, и выкопали себе яму смерти.


    Разве святая гора Моя Синай — пустынная скала? Вы будете словно птенцы, которые, лишившись гнезда, порхают в вышине».


    И снова пророк говорит: «Я пойду перед тобою, сровняю горы, сокрушу медные ворота и сломаю железные засовы. Я дам тебе сокровища — тёмные, сокрытые, невидимые, — чтобы узнали, что Я — Господь Бог».


    И ещё: «Ты будешь жить в высокой пещере крепкой скалы». И: «Вода его будет верна; вы увидите Царя во славе, и душа ваша будет размышлять о страхе Господнем».


    И снова Он говорит у другого пророка: «Тот, кто поступает так, будет словно дерево, посаженное у разделяющихся потоков вод: оно принесёт плод свой в надлежащее время, лист его не опадёт, и во всём, что он делает, будет успех.


    Не так нечестивые, не так: они — словно прах, который ветер развеивает с лица земли. Поэтому нечестивые не устоят на суде и грешники — в собрании праведных. Ибо Господь знает путь праведных, а путь нечестивых погибнет».


    Вы понимаете, как Он одновременно указал на воду и крест. Смысл таков: блаженны те, кто возложил надежду на крест и сходит в воду. Ведь, говоря о воздаянии, Он сказал: «в надлежащее время»; «тогда, — говорит Он, — Я воздам». А что Он говорит о настоящем? «Лист его не опадёт». Этим Он подразумевает, что всякое слово, которое в вере и любви выйдет из ваших уст, приведёт многих к обращению и надежде.


    И снова другой пророк говорит: «Земля Иакова была прославлена превыше всей земли». Смысл таков: Он прославляет сосуд Своего Духа.[b]


    Что же Он говорит далее? «С правой стороны текла река, и от неё выросли прекрасные деревья; всякий, кто вкусит от них, будет жить вовеки».


    Он говорит это потому, что мы сходим в воду, отягощённые грехами и нечистотой, а восходим из неё, принося плод в сердце и в духе утверждая свой страх и надежду на Иисуса.[c] «Всякий, кто вкусит от них, будет жить вовеки». Смысл таков: «Всякий, — говорит Он, — кто услышит эти слова и уверует, будет жить вовеки».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Фраза «но станут строить для себя» в сохранившемся тексте обрывается; подразумеваемое дополнение не внесено.
    reason: Предупредить читателя о подлинной текстовой неполноте и не заполнять лакуну догадкой.
  - marker: b
    text: Выражение «сосуд Своего Духа» оставлено как метафора исходного текста; кого или что именно оно обозначает, здесь прямо не поясняется.
    reason: Сохранить референтную неоднозначность авторского толкования.
  - marker: c
    text: Греческий текст этого места нуждается в непосредственной сверке; перевод следует представленному древнему текстовому свидетельству через опубликованный английский перевод.
    reason: Отметить повышенную синтаксическую и смысловую неуверенность в формулировке о страхе и надежде.
lexical_decisions:
- source_word: βάπτισμα / baptism (witness)
  choice: крещение
  rationale: Сохраняет раннехристианский сакраментальный термин и прямую связь последующего толкования с вхождением в воду.
- source_word: ἄφεσις ἁμαρτιῶν / remission of sins (witness)
  choice: прощение грехов
  rationale: Естественное современное русское выражение, не ослабляющее богословского содержания.
- source_word: φόβος Κυρίου / fear of the Lord (scriptural citation)
  choice: страх Господень
  rationale: Сохранён традиционный библейский оборот; не заменён словом «благоговение», чтобы не снимать смысловое напряжение.
- source_word: σκεῦος τοῦ πνεύματος / vessel of the Spirit (probable source sense)
  choice: сосуд Своего Духа
  rationale: Сохраняет конкретную метафору вместилища и допускает исходную неоднозначность её референта.
- source_word: μετάνοια / conversion (witness)
  choice: обращение
  rationale: В данном контексте речь о воздействии слов на многих; «обращение» естественнее и не сводит смысл только к внутреннему раскаянию.
theological_decisions:
- issue: Связь воды, крещения и прощения грехов
  choice: Сохранена прямая формулировка «крещения, приносящего прощение грехов»
  alternative: «крещения в знак прощения грехов»
  rationale: Альтернатива внесла бы отсутствующее толкование и ослабила бы причинно-смысловую связь текста.
- issue: Первое лицо в авторском толковании крещения
  choice: Сохранено «мы сходим… восходим»
  alternative: Обобщённое «человек сходит…»
  rationale: Первое лицо выражает участие автора и общины и не должно нейтрализоваться.
- issue: Надежда на крест
  choice: Сохранено буквальное «возложил надежду на крест»
  alternative: «на распятого Христа»
  rationale: Текст намеренно называет крест; явная христологическая экспликация была бы добавлением.
- issue: Фраза о страхе и надежде на Иисуса
  choice: «в духе утверждая свой страх и надежду на Иисуса»
  alternative: «имея в духе страх Божий и надежду на Иисуса»
  rationale: Сохранена синтаксическая связь обоих существительных с Иисусом, насколько это передаёт данный свидетель, без богословского перераспределения объектов.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского поучения. Библейские цитаты переданы слегка возвышенным, но понятным синтаксисом; архаизмы сведены к устойчивым формулам («Господь», «вовеки», «блаженны»). Перевод предварительный, поскольку предоставленный материал прямо указывает, что непосредственная сверка с греческими и латинскими свидетелями ещё не выполнена.
