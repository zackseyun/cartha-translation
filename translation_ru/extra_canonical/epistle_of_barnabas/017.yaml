base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/017.yaml
  text: 'As far as I was able to explain everything to you simply, my soul hopes that I have not left out anything [about the matters relating to salvation and thus failed in my desire].


    For if I were to write to you about things present or future, you would not understand them, because they are expressed in parables. So much for this.'
translation:
  language: ru
  text: 'Насколько было возможно изложить вам всё со всей простотой, душа моя надеется, что я ничего не упустил [из относящегося к спасению и тем самым не остался в своём стремлении неисполненным].[a]


    Ведь если бы я стал писать вам о настоящем или будущем, вы не поняли бы этого, потому что оно изложено в притчах. На этом об этом довольно.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Слова в квадратных скобках текстологически не вполне надёжны: они переданы по предоставленному английскому свидетельству как восстановленный или повреждённый фрагмент.'
    reason: Прямой анализ греческих и латинских свидетелей ещё не выполнен; необходимо честно сохранить сигнал неопределённости исходного материала.
lexical_decisions:
- source_word: with all simplicity
  choice: со всей простотой
  rationale: Сохраняет акцент на простом и ясном изложении без добавления идеи упрощённости содержания.
- source_word: my soul hopeth
  choice: душа моя надеется
  rationale: Сохранён характерный древний оборот и личный, сердечный тон автора; русская формулировка остаётся понятной.
- source_word: things immediate or future
  choice: о настоящем или будущем
  rationale: Передаёт временное противопоставление, засвидетельствованное английским источником, не конкретизируя неясный предмет речи.
- source_word: parables
  choice: притчах
  rationale: Традиционный и естественный русский эквивалент, сохраняющий возможный смысл образных или загадочных речений.
- source_word: So much then for this
  choice: На этом об этом довольно
  rationale: Достоинственно передаёт краткую заключительную формулу раздела.
theological_decisions:
- issue: Статус слов об относящемся к спасению
  choice: Сохранить слова в квадратных скобках и снабдить примечанием
  alternative: Включить их в основной текст без обозначения либо удалить
  rationale: Предоставленный свидетель прямо обозначает этот фрагмент скобками как текстологически неуверенный; его нельзя молча нормализовать.
- issue: Референт местоимения в выражении «оно изложено в притчах»
  choice: Сохранить обобщённый и неоднозначный референт
  alternative: 'Уточнить: «эти истины», «события» или «тайны»'
  rationale: Источник не даёт основания богословски конкретизировать предмет речи.
translation_notes:
  register: Современный литературный русский с умеренно возвышенным раннехристианским звучанием. Синтаксис сделан ясным для обычного читателя, но сохранены формулы «душа моя» и «в притчах». Перевод предварительный, поскольку предоставлена английская публикация-свидетель, а непосредственная сверка с греческим и латинским текстом ожидается.
