base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/013.yaml
  text: 'Now let us see whether this people or the first people has the inheritance, and whether the covenant had reference to us or to them.


    Hear, then, what the Scripture says concerning the people: “Isaac prayed concerning Rebekah his wife, for she was barren. And she conceived. Then Rebekah went out to inquire of the Lord. And the Lord said to her, ‘Two nations are in your womb, and two peoples in your belly, and one people shall vanquish another people, and the greater shall serve the less.’”


    You ought to understand who Isaac is, who Rebekah is, and in whose case he has shown that the one people is greater than the other.


    And in another prophecy Jacob speaks more plainly to Joseph his son, saying, “Behold, the Lord has not bereft me of your face; bring me your sons, that I may bless them.”


    And he brought Ephraim and Manasseh, desiring that Manasseh should be blessed, because he was the elder; for Joseph led him by the right hand of his father Jacob. But Jacob saw in the Spirit a type of the people that should come afterward. And what does he say? “Jacob crossed his hands and placed his right hand on the head of Ephraim, the second and younger, and blessed him. And Joseph said to Jacob, ‘Transfer your right hand to the head of Manasseh, for he is my firstborn son.’ And Jacob said to Joseph, ‘I know it, my son, I know it; but the greater shall serve the less. Yet this one also shall be blessed.’”


    Mark in whose cases he ordained that this people should be first and heir of the covenant.


    If then, besides this, he also recorded it through Abraham, we attain the completion of our knowledge. What, then, does he say to Abraham when he alone believed, and was ascribed for righteousness? “Behold, I have made you, Abraham, a father of nations that believe in God in uncircumcision.”'
translation:
  language: ru
  text: 'Теперь посмотрим, этот ли народ получает наследие или прежний народ, и к нам ли относится завет или к ним.


    Итак, послушайте, что Писание говорит о народах: «Исаак молился о Ревекке, своей жене, потому что она была бесплодна. И она зачала. Тогда Ревекка пошла вопросить Господа. И Господь сказал ей: “Два народа в твоём чреве, и два племени в твоей утробе; один народ одолеет другой, и больший будет служить меньшему”».[a]


    Вам следует понять, кто такой Исаак, кто такая Ревекка и на чьём примере Он показал, что один народ больше другого.


    И в другом пророчестве Иаков ещё яснее говорит своему сыну Иосифу: «Вот, Господь не лишил меня возможности видеть твоё лицо; приведи ко мне своих сыновей, чтобы я благословил их».


    И тот привёл Ефрема и Манассию, желая, чтобы благословение получил Манассия, потому что он был старшим; поэтому Иосиф подвёл его к правой руке своего отца Иакова. Но Иаков в Духе увидел прообраз народа, которому предстояло прийти впоследствии. И что говорит Писание? «Иаков скрестил руки, возложил правую руку на голову Ефрема, второго и младшего, и благословил его. Иосиф сказал Иакову: “Переложи правую руку на голову Манассии, потому что он мой первенец”. Иаков сказал Иосифу: “Знаю, сын мой, знаю; но больший будет служить меньшему. Впрочем, и этот будет благословлён”».[b]


    Заметьте, на чьём примере Он предопределил, чтобы этот народ стал первым и наследником завета.


    Если же вдобавок к этому Он засвидетельствовал то же и через Авраама, наше знание становится полным. Что же Он говорит Аврааму, когда тот один поверил и это было вменено ему в праведность? «Вот, Я поставил тебя, Авраам, отцом народов, которые верят в Бога, оставаясь необрезанными».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Цитата представляет свободное соединение и изложение Быт. 25:21–23. Формулировка «больший будет служить меньшему» следует данному текстовому свидетелю; привычный текст Бытия передаёт: «старший будет служить младшему».'
    reason: Нужно отметить отличие цитаты от знакомой читателю канонической формулировки и её составной характер.
  - marker: b
    text: 'Изложение опирается на Быт. 48:8–20, но включает формулу из рассказа об Исаве и Иакове (Быт. 25:23). В данном свидетеле она звучит: «больший будет служить меньшему».'
    reason: Автор типологически связывает два эпизода; примечание предотвращает ошибочное впечатление, будто вся цитата дословно находится в Быт. 48.
  - marker: c
    text: Здесь соединены мотивы Быт. 15:6 и 17:5 с истолкованием Авраама как отца верующих из необрезанных; ср. Рим. 4:9–12, 17.
    reason: Фраза является раннехристианским составным изложением, а не дословной цитатой одного стиха.
lexical_decisions:
- source_word: this people / the first people
  choice: этот народ / прежний народ
  rationale: Сохраняет противопоставление автора, не подменяя его конфессионально нагруженными наименованиями; «прежний» естественнее буквального «первый» в исходном вопросе.
- source_word: inheritance
  choice: наследие
  rationale: Передаёт библейско-заветный смысл и связь с последующим «наследником завета».
- source_word: vanquish
  choice: одолеет
  rationale: Сохраняет значение превосходства или победы, засвидетельствованное данным английским свидетелем, без излишней конкретизации.
- source_word: type
  choice: прообраз
  rationale: Общепонятный богословский термин для типологического соответствия между прежним событием и будущим народом.
- source_word: ascribed for righteousness
  choice: это было вменено ему в праведность
  rationale: Устойчиво и точно передаёт библейскую формулу вменения веры в праведность.
- source_word: in uncircumcision
  choice: оставаясь необрезанными
  rationale: Естественно выражает состояние народов, верующих без обрезания, не создавая неясной русской конструкции «в необрезании».
theological_decisions:
- issue: Кого обозначает «этот народ» и кого — «прежний народ»
  choice: Сохранены указательные обозначения автора без явной идентификации.
  alternative: Назвать христиан и Израиль прямо.
  rationale: Исходный текст строит аргумент через эти обозначения; явная подстановка сняла бы риторическую и богословскую напряжённость.
- issue: Референт местоимения «Он» в толковании Писания
  choice: Сохранено прописное «Он», допускающее отнесение к Богу как действующему через Писание и праотцов.
  alternative: Заменить на «Писание», «Бог» или имя конкретного персонажа.
  rationale: Свидетель допускает некоторую референтную неоднозначность; её не следует молча устранять.
- issue: «Больший будет служить меньшему» в цитатах
  choice: Сохранена именно представленная в свидетеле формула.
  alternative: Исправить на канонически привычное «старший будет служить младшему».
  rationale: Задача требует переводить представленное текстовое свидетельство и сохранять его особенности, хотя формула отличается от привычного текста Бытия.
- issue: Вера Авраама и праведность
  choice: «тот один поверил, и это было вменено ему в праведность».
  alternative: «он один уверовал и был признан праведным».
  rationale: Выбранная формулировка сохраняет грамматическую и богословскую связь веры с вменением, не развивая частную доктрину оправдания.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Архаизмы сведены к минимуму, но сохранены библейские термины «завет», «наследие», «вменено в праведность», «первородный/первенец». Из-за отсутствия прямой сверки с греческими и латинскими свидетелями перевод осторожно следует предоставленному публичному английскому свидетельству; спорные текстовые особенности не нормализованы.
