    issue: «этот ли народ получает наследие»
    rationale: Английское witness «hath the inheritance» говорит об обладании/принадлежности наследия, а не о его получении.
  - severity: low
    issue: «Писание говорит о народах»
    rationale: 'В witness стоит единственное число: «concerning the people».'
  - severity: medium
    issue: «И что говорит Писание?» и «предопределил»
    rationale: «Писание» подменяет референт местоимения в свидетельстве, а «предопределил» добавляет сильный богословски нагруженный смысл к «ordained». Нейтральные «Что же он говорит?» и «установил» точнее сохраняют текстовую неоднозначность и смысл.
  - severity: low
    issue: «оставаясь необрезанными»
    rationale: Деепричастие может подчеркнуть длительное сохранение состояния; исходное «in uncircumcision» обозначает состояние необрезания без этого дополнительного аспекта.
