base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/004.yaml
  text: 'Therefore, we ought to investigate the present deeply and search out the things that have power to save us. Let us flee completely from all the works of lawlessness, so that the works of lawlessness do not overpower us. Let us hate the error of the present age, so that we may be loved for what is to come.


    Let us give our soul no relief that would allow it to associate with sinners and wicked people, so that we are not made like them.


    The last offense is at hand, concerning which Scripture speaks, as Enoch says. For this reason the Master has shortened the seasons and the days, so that his beloved may hasten and come to His inheritance.


    The prophet also speaks in this way: “Ten reigns shall reign upon the earth, and after them another king will arise, who will bring three of the kings low under one.”


    In the same way Daniel speaks concerning the same thing: “I saw the fourth beast, wicked and strong and more unmanageable than all the beasts of the earth. I saw ten horns arise from it, and from these a little horn, an outgrowth, and I saw how it brought three of the great horns low under one.”


    Therefore, you ought to understand. Moreover, I ask you this one thing as one of you, loving each of you more than my own soul: pay attention to yourselves now, and do not become like certain people who pile sin upon sin, saying that our covenant also remains theirs.


    It is ours, but they lost it forever in this way, just after Moses had received it. For Scripture says: “Moses was on the mountain, fasting for forty days and forty nights, and he received the covenant from the Lord—tablets of stone written by the finger of the Lord’s hand.”


    But they lost it by turning to idols. For the Lord says: “Moses, Moses, come down quickly, for your people, whom you brought out of the land of Egypt, have acted lawlessly.” Moses understood and threw the two tablets from his hands. Their covenant was shattered, so that the covenant of the beloved Jesus might be sealed upon our hearts in the hope that springs from faith in him.


    Although I would gladly write many things—not as a teacher, but as is fitting for one who loves you, so that you may not fall short of what we possess—I was eager to write to you, since I am your devoted servant. Therefore, let us be watchful in these last days. For the whole time of our faith will benefit us nothing unless now, in the season of lawlessness and amid the offenses that are to come, we resist as is fitting for God’s sons, so that the Black One may not gain an entrance.


    Let us flee from all vanity. Let us completely hate the works of the evil way. Do not, entering in privately, stand apart by yourselves, as though you were already justified, but gather together and consult about the common good.


    For Scripture says: “Woe to those who are wise for themselves and understanding in their own sight.” Let us become spiritual. Let us become a temple made perfect for God. As far as it lies within us, let us train ourselves in the fear of God, [and] let us strive to keep his commandments, so that we may rejoice in his ordinances.


    The Lord judges the world without partiality. Each person will receive according to his deeds. If someone is good, his righteousness will go before him on the way. If someone is evil, the repayment for his evildoing is before him, so that perhaps,


    if we relax as people who are called, we may fall asleep over our sins, and the prince of evil may gain power against us and thrust us out of the Lord’s kingdom.


    Moreover, understand this also, my brothers. When you see that, even after so many signs and wonders were performed in Israel, they were still abandoned, let us pay attention, so that perhaps we are not found to be, as Scripture says, “Many are called, but few are chosen.”'
translation:
  language: ru
  text: 'Итак, нам следует глубоко исследовать настоящее и отыскивать то, что способно нас спасти. Будем же всячески избегать всех дел беззакония, чтобы дела беззакония не одолели нас; возненавидим заблуждение нынешнего века, чтобы быть возлюбленными ради века грядущего.


    Не будем давать своей душе послабления, позволяя ей водиться с грешниками и нечестивцами, чтобы нам не уподобиться им.


    Близок последний соблазн, о котором говорит Писание, как свидетельствует Енох.[a] Ради этого Владыка сократил времена и дни, чтобы Его Возлюбленный поспешил и пришёл к Своему наследию.[b]


    И пророк говорит так: «Десять царств будут царствовать на земле, а после них восстанет иной царь, который низложит сразу трёх царей».[c]


    Подобным образом Даниил говорит о том же: «И увидел я четвёртого зверя — злого, сильного и более неукротимого, чем все звери земные; и увидел я, как выросли у него десять рогов, а среди них — малый рог, словно отросток, и как он низложил сразу три больших рога».[d]


    Итак, вам следует это понять. Кроме того, я прошу вас ещё об одном — как один из вас, любящий каждого из вас больше собственной души: будьте теперь внимательны к себе и не уподобляйтесь тем, кто нагромождает грех на грех, говоря, что наш завет остаётся также и их заветом.


    Он — наш; они же навсегда утратили его таким образом, едва Моисей его получил. Ибо Писание говорит: «Моисей был на горе, постясь сорок дней и сорок ночей, и получил от Господа завет — каменные скрижали, написанные перстом руки Господа».[e]


    Но они утратили его, обратившись к идолам. Ибо так говорит Господь: «Моисей, Моисей, скорее сойди, потому что народ твой, который ты вывел из земли Египетской, поступил беззаконно».[f] Моисей понял и бросил обе скрижали из рук. Их завет разбился, чтобы завет возлюбленного Иисуса был запечатлён в наших сердцах надеждой, рождающейся от веры в Него.


    Хотя я охотно написал бы о многом — не как учитель, но как подобает тому, кто любит вас и не хочет, чтобы вы лишились того, чем мы обладаем, — я поспешил написать вам, будучи вашим преданным слугой. Итак, будем бодрствовать в эти последние дни. Ведь всё время нашей веры не принесёт нам никакой пользы, если теперь, во время беззакония и среди грядущих соблазнов, мы не окажем сопротивления, как подобает сынам Божьим, чтобы Чёрный не нашёл себе доступа.[g]


    Будем избегать всякой суеты и совершенно возненавидим дела злого пути. Не уединяйтесь, тайком отделяясь друг от друга, словно вы уже оправданы, но собирайтесь вместе и сообща ищите общего блага.


    Ибо Писание говорит: «Горе тем, кто мудр сам для себя и разумен в собственных глазах».[h] Будем духовными, станем совершенным храмом для Бога. Насколько это в наших силах, будем упражняться в страхе Божьем [и] стараться соблюдать Его заповеди, чтобы радоваться Его установлениям.[i]


    Господь судит мир нелицеприятно: каждый получит по своим делам. Если человек добр, праведность его будет идти впереди него по пути; если же зол, воздаяние за его злодеяние — перед ним. Поэтому как бы нам,


    расслабившись как уже призванным, не уснуть в своих грехах, а властитель зла не получил власти над нами и не вытолкнул нас из Царства Господа.


    Поймите и это, братья мои. Вы видите: даже после стольких знамений и чудес, совершённых среди Израиля, они всё же были оставлены. Поэтому будем внимательны, чтобы и мы не оказались среди тех, о ком Писание говорит: «Много званых, но мало избранных».[j]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Высказывание приписывается Еноху, однако точной параллели в сохранившемся тексте 1 Еноха не установлено.
    reason: Сигнализирует неопределённость источника цитаты.
  - marker: b
    text: 'Возможна иная пунктуация и отнесённость местоимений: речь может идти о возлюбленном народе Бога и его наследии. Прямую сверку греческих и латинских свидетелей ещё необходимо провести.'
    reason: Сохраняет подлинную референциальную неоднозначность промежуточного свидетеля.
  - marker: c
    text: Ср. Дан. 7:24. Буквальная форма «десять царств будут царствовать» сохраняет риторический повтор источника.
    reason: Указывает библейскую аллюзию и объясняет необычную формулу.
  - marker: d
    text: Ср. Дан. 7:7–8, 20, 24. Перед нами свободная цитата или пересказ; выражение о малом роге и «отростке» не совпадает дословно с обычным текстом Даниила.
    reason: Поясняет составной и недословный характер цитаты.
  - marker: e
    text: Ср. Исх. 24:18; 31:18; 34:28; Втор. 9:9–11. Цитата объединяет несколько формулировок Пятикнижия.
    reason: Документирует составную библейскую цитату.
  - marker: f
    text: Ср. Исх. 32:7–8; Втор. 9:12. В исходной библейской формулировке народ «развратился» или «поступил беззаконно»; здесь подчёркнуто беззаконие.
    reason: Показывает источник и особенность цитирования.
  - marker: g
    text: «Чёрный» — персонифицированное обозначение дьявола или властителя зла; необычное именование сохранено в основном тексте.
    reason: Необходимое пояснение редкого титула без его замены толкованием.
  - marker: h
    text: Ср. Ис. 5:21.
    reason: Указывает источник цитаты.
  - marker: i
    text: Слово «и» в этом месте восстановлено в используемом английском свидетеле и поэтому отмечено квадратными скобками; прямую проверку рукописных вариантов ещё необходимо провести.
    reason: Сохраняет переданный пользователем сигнал текстуальной реставрации.
  - marker: j
    text: Ср. Мф. 22:14.
    reason: Указывает источник цитаты.
lexical_decisions:
- source_word: present / present time
  choice: настоящее / нынешний век
  rationale: В первом случае сохранён предмет исследования — нынешнее положение, во втором временно-эсхатологический контраст с грядущим веком.
- source_word: offence
  choice: соблазн
  rationale: В раннехристианском эсхатологическом контексте слово обозначает испытание или повод к отпадению; «преступление» было бы чрезмерно узким.
- source_word: Master
  choice: Владыка
  rationale: Достоинственный и традиционно понятный эквивалент титула, отличающий его от обычного «учителя».
- source_word: under one
  choice: сразу
  rationale: Неясная формула английского свидетеля передаёт одновременное низложение трёх; перевод остаётся сдержанным и не вводит конкретной исторической идентификации.
- source_word: Black One
  choice: Чёрный
  rationale: Сохранено необычное персонифицированное наименование зла, а не заменено толкованием «дьявол».
- source_word: vanity
  choice: суета
  rationale: Сохраняет широкий нравственно-духовный смысл пустоты и тщеты.
- source_word: ordinances
  choice: установления
  rationale: Нейтрально передаёт предписанный Богом порядок без сведения к одному виду закона.
- source_word: without respect of persons
  choice: нелицеприятно
  rationale: Устойчивое современное литературное обозначение беспристрастного суда.
theological_decisions:
- issue: Принадлежность и утрата завета
  choice: 'Сохранено резкое утверждение автора: «Он — наш; они же навсегда утратили его»'
  alternative: Смягчить формулировку как временное лишение или участие в одном завете
  rationale: Текст выражает собственную полемическую богословскую позицию; переводчик не должен её смягчать или согласовывать с позднейшими системами.
- issue: Кто назван «Возлюбленным» и чьё наследие имеется в виду
  choice: Сохранены прописные местоимения и формальная двусмысленность конструкции
  alternative: Однозначно отнести выражение к общине или к Христу
  rationale: Посредующий свидетель допускает напряжение в референции; без прямой сверки греческого текста безопаснее не разрешать его толковательно.
- issue: Вера и итоговый суд по делам
  choice: Оба утверждения переданы без гармонизации
  alternative: Ослабить формулу воздаяния по делам или объяснить её через конкретную доктрину оправдания
  rationale: Автор рядом говорит о вере, заповедях, делах и возможности отпадения; эта богословская напряжённость должна сохраниться.
- issue: Возможность отпадения призванных
  choice: Сохранено реальное предостережение о лишении Царства
  alternative: Перевести как чисто гипотетическое событие, невозможное для призванных
  rationale: Текст прямо использует предостережение как основание бодрствовать; конфессиональное переосмысление недопустимо.
- issue: Иисус и завет
  choice: «завет возлюбленного Иисуса»
  alternative: «возлюбленный завет Иисуса»
  rationale: Синтаксис английского свидетеля относит «возлюбленного» к Иисусу; сохранено это наиболее непосредственное чтение.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Архаизмы сведены к минимуму, но сохранены уместные библейские слова («Владыка», «скрижали», «нелицеприятно»). Риторические повторы и резкие предостережения автора не сглажены. Проект остаётся предварительным, поскольку предоставленная база — публичный английский свидетель, а прямая проверка греческих и латинских чтений ещё не выполнена.
