review_pass:
  verdict: revise
  source_fidelity: 'В целом смысл и последовательность английского свидетельства переданы точно. Однако «ради века грядущего» меняет значение целевой конструкции: речь о том, чтобы быть возлюбленными в грядущем. Оборот «сразу/под одним» в апокалиптических цитатах лучше передать как «одним ударом», не приписывая ему узко хронологическое значение. В увещании против обособления «тайком отделяясь друг от друга» слишком конкретизирует трудный оборот свидетеля; безопаснее сохранить мысль о замыкании поодиночке.'
  naturalness: 'Русский текст в целом литературный и хорошо выдерживает увещевательный регистр. Исправлены несколько менее естественных или чрезмерно толковательных оборотов: «ради века грядущего», «тайком отделяясь друг от друга» и финальная конструкция «оказаться среди тех».'
  terminology: 'Ключевые термины сохранены последовательно: «беззаконие», «завет», «скрижали», «страх Божий», «установления», «Чёрный». «Чёрный» оставлен как необычный персонифицированный титул с поясняющей сноской. Квадратные скобки при [и] сохранены.'
  issues:
  - severity: medium
    issue: «чтобы быть возлюбленными ради века грядущего»
    rationale: Английское witness reading «that we may be loved for that which is to come» выражает цель/перспективу грядущего, а не основание любви («ради»). «Чтобы в грядущем быть возлюбленными» сохраняет эту направленность.
  - severity: medium
    issue: «тайком отделяясь друг от друга»
    rationale: Это добавляет тайность и взаимное разделение, которых нельзя уверенно извлечь из трудной формулы английского свидетеля. «Не замыкайтесь в себе поодиночке» передаёт увещание не обособляться, не разрешая спорную деталь.
  - severity: low
    issue: «сразу трёх» в цитатах Даниила
    rationale: «Under one» — необычная и текстуально трудная формула. «Одним ударом» сохраняет образ единого действия, не сводя выражение к простой одновременности.
  - severity: low
    issue: Финальное «оказались среди тех»
    rationale: Оригинальная конструкция предупреждает, чтобы не обнаружилось, что адресаты подпадают под формулу «много званых…». Более прямое «чтобы не оказалось, что и о нас сказано» естественнее и точнее сохраняет синтаксическую неопределённость.
  revised_text: 'Итак, нам следует глубоко исследовать настоящее и отыскивать то, что способно нас спасти. Будем же всячески избегать всех дел беззакония, чтобы дела беззакония не одолели нас; возненавидим заблуждение нынешнего века, чтобы в грядущем быть возлюбленными.


    Не будем давать своей душе послабления, позволяя ей водиться с грешниками и нечестивцами, чтобы нам не уподобиться им.


    Близок последний соблазн, о котором говорит Писание, как свидетельствует Енох.[a] Ради этого Владыка сократил времена и дни, чтобы Его Возлюбленный поспешил и пришёл к Своему наследию.[b]


    И пророк говорит так: «Десять царств будут царствовать на земле, а после них восстанет иной царь, который одним ударом низложит трёх царей».[c]


    Подобным образом Даниил говорит о том же: «И увидел я четвёртого зверя — злого, сильного и более неукротимого, чем все звери земные; и увидел я, как выросли у него десять рогов, а среди них — малый рог, словно отросток, и как он одним ударом низложил три больших рога».[d]


    Итак, вам следует это понять. Кроме того, я прошу вас ещё об одном — как один из вас, любящий каждого из вас больше собственной души: будьте теперь внимательны к себе и не уподобляйтесь тем, кто нагромождает грех на грех, говоря, что наш завет остаётся также и их заветом.


    Он — наш; они же навсегда утратили его таким образом, едва Моисей его получил. Ибо Писание говорит: «Моисей был на горе, постясь сорок дней и сорок ночей, и получил от Господа завет — каменные скрижали, написанные перстом руки Господа».[e]


    Но они утратили его, обратившись к идолам. Ибо так говорит Господь: «Моисей, Моисей, скорее сойди, потому что народ твой, который ты вывел из земли Египетской, поступил беззаконно».[f] Моисей понял и бросил обе скрижали из рук. Их завет разбился, чтобы завет возлюбленного Иисуса был запечатлён в наших сердцах надеждой, рождающейся от веры в Него.


    Хотя я охотно написал бы о многом — не как учитель, но как подобает тому, кто любит вас и не хочет, чтобы вы лишились того, чем мы обладаем, — я поспешил написать вам, будучи вашим преданным слугой. Итак, будем бодрствовать в эти последние дни. Ведь всё время нашей веры не принесёт нам никакой пользы, если теперь, во время беззакония и среди грядущих соблазнов, мы не окажем сопротивления, как подобает сынам Божьим, чтобы Чёрный не нашёл себе доступа.[g]


    Будем избегать всякой суеты и совершенно возненавидим дела злого пути. Не замыкайтесь в себе поодиночке, словно вы уже оправданы, но собирайтесь вместе и сообща ищите общего блага.


    Ибо Писание говорит: «Горе тем, кто мудр сам для себя и разумен в собственных глазах».[h] Будем духовными, станем совершенным храмом для Бога. Насколько это в наших силах, будем упражняться в страхе Божьем [и] стараться соблюдать Его заповеди, чтобы радоваться Его установлениям.[i]


    Господь судит мир нелицеприятно: каждый получит по своим делам. Если человек добр, праведность его будет идти впереди него по пути; если же зол, воздаяние за его злодеяние — перед ним. Поэтому как бы нам,


    расслабившись как уже призванным, не уснуть в своих грехах, а властитель зла не получил власти над нами и не вытолкнул нас из Царства Господа.


    Поймите и это, братья мои. Вы видите: даже после стольких знамений и чудес, совершённых среди Израиля, они всё же были оставлены. Поэтому будем внимательны, чтобы не оказалось, что и о нас сказано: «Много званых, но мало избранных».[j]'
