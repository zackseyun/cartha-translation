    Итак, я нахожу, что храм существует. Но как он будет построен во имя Господа? Поймите. Прежде чем мы уверовали в Бога, обиталище нашего сердца было испорченным и немощным — поистине храмом, построенным руками. Оно было полно идолослужения и служило жилищем демонов, потому что мы делали всё противное Богу.


