base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/016.yaml
  text: 'Moreover, I will also tell you about the temple: how these wretched men were led astray and placed their hope in the building, rather than in their God who made them, as though it were a house of God.


    For, almost like the Gentiles, they consecrated him in the temple. But what does the Lord say when abolishing the temple? Learn: “Who has measured heaven with a span, or measured the earth with his hand? Have not I?” says the Lord. “Heaven is my throne, and the earth is the footstool of my feet. What kind of house will you build for me? Or what will be my resting place?” You perceive that their hope is vain.


    Furthermore, he says again, “Behold, those who pulled down this temple will themselves build it.”


    And so it happens. Because they went to war, it was pulled down by their enemies. Now even the servants of their enemies will build it up.


    Again, it was revealed how the city, the temple, and the people of Israel would be betrayed. For Scripture says, “And it shall be in the last days that the Lord will deliver the sheep of the pasture, and the fold and its tower, over to destruction.” And it happened as the Lord had spoken.


    But let us inquire whether there is any temple of God. There is, in the place where he himself undertakes to make and complete it. For it is written, “And it shall come to pass, when the week is being completed, that the temple of God will be built gloriously in the name of the Lord.”


    I find, then, that there is a temple. How, then, will it be built in the name of the Lord? Understand. Before we believed in God, the dwelling place of our heart was corrupt and weak, truly a temple built by hands. For it was full of idolatry and was a house of demons, because we did everything that was contrary to God.


    But it will be built in the name of the Lord. Pay attention, then, so that the temple of the Lord may be built gloriously.


    How? Understand. By receiving the forgiveness of our sins and hoping in the Name, we became new, created afresh from the beginning. Therefore God truly dwells in our habitation, within us. How? The word of his faith, the calling of his promise, the wisdom of the ordinances, the commandments of the teaching—he himself prophesying in us, he himself dwelling in us, opening for us who had been enslaved to death the door of the temple, which is the mouth, and giving us repentance—leads us to the incorruptible temple.


    For the one who desires to be saved does not look to the person, but to him who dwells and speaks within that person, being amazed that he has never before heard these words from the speaker’s mouth, nor ever desired to hear them. This is the spiritual temple built for the Lord.'
translation:
  language: ru
  text: 'Кроме того, я расскажу вам и о храме: как эти несчастные, впав в заблуждение, возложили надежду на здание, а не на сотворившего их Бога, словно это здание и в самом деле было домом Божьим.


    Ведь они, почти как язычники, заключили Его в храме[a]. Но что говорит Господь, упраздняя храм? Узнайте: «Кто измерил небо пядью или землю — ладонью? Не Я ли? — говорит Господь. — Небо — престол Мой, а земля — подножие ног Моих. Какой дом построите Мне? Или где будет место Моего покоя?» Вы видите, что надежда их тщетна.


    И ещё Он говорит: «Вот, разрушившие этот храм сами его и построят».


    Так и происходит: из-за того, что они пошли войной, храм был разрушен их врагами; а теперь его будут отстраивать даже слуги их врагов[b].


    Было также открыто, что город, храм и народ Израиля будут преданы. Ибо Писание говорит: «И будет в последние дни: Господь предаст на погибель овец пастбища, и загон, и его башню». И произошло так, как сказал Господь.


    Но исследуем, существует ли храм Божий. Да, существует — там, где Он Сам берётся создать и завершить его. Ибо написано: «И будет, когда завершится седмина[c], храм Божий будет славно построен во имя Господа».


    Итак, я нахожу, что храм существует. Но как он будет построен во имя Господа? Поймите. Прежде чем мы уверовали в Бога, обиталище нашего сердца было тленным и немощным — поистине храмом, построенным руками. Оно было полно идолослужения и служило жилищем демонов, потому что мы делали всё противное Богу.


    Но «он будет построен во имя Господа». Так внимайте же, чтобы храм Господа был построен во славе.


    Как? Поймите. Получив прощение грехов и возложив надежду на Имя, мы стали новыми, словно вновь сотворёнными от начала. Поэтому Бог истинно обитает внутри нас, в нашем жилище. Каким образом? Слово Его веры, призвание Его обетования, мудрость установлений, заповеди учения; Он Сам пророчествует в нас, Он Сам обитает в нас. Нам, порабощённым смертью, Он открывает дверь храма — уста — и, даруя покаяние, вводит нас в нетленный храм[d].


    Ведь желающий спастись взирает не на человека, а на Того, Кто обитает и говорит в нём. Он изумляется тому, что прежде никогда не слышал таких слов из уст говорящего и сам никогда не желал их услышать. Вот духовный храм, созидаемый для Господа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по представленному свидетельству: «почти как язычники, они освятили Его в храме». Смысл фразы не вполне ясен; перевод «заключили Его в храме» передаёт контекст, где Бога мыслят ограниченным храмовым зданием.'
    reason: Сохранить сведения о буквальной форме и обозначить смысловую неуверенность до прямой сверки с греческими и латинскими свидетелями.
  - marker: b
    text: Вероятно, речь идёт о послевоенном восстановлении храма по распоряжению или силами представителей победившей державы; историческая отсылка автора спорна.
    reason: Не навязывать читателю единственную историческую идентификацию.
  - marker: c
    text: «Седмина» может означать неделю или символический семилетний период. Цитата не совпадает дословно с сохранившимся текстом канонических книг.
    reason: Сохранить пророческую неоднозначность термина и обозначить характер цитаты.
  - marker: d
    text: 'Синтаксис перечня допускает некоторую неоднозначность: вводящим в нетленный храм может мыслиться Сам Бог либо совокупность названных даров Его присутствия.'
    reason: Не скрывать грамматико-богословское напряжение фразы.
lexical_decisions:
- source_word: temple / house of God (ναός, presumed from the Greek tradition)
  choice: храм / дом Божий
  rationale: «Храм» последовательно сохраняет ведущий образ главы, а «дом Божий» естественно передаёт формулировку о месте Божьего обитания.
- source_word: building
  choice: здание
  rationale: Так подчёркнут контраст между материальным сооружением и Богом, а далее — духовным храмом.
- source_word: the Name
  choice: Имя
  rationale: Прописная буква сохраняет самостоятельное сакральное употребление выражения и не подменяет его поясняющим именованием.
- source_word: week
  choice: седмина
  rationale: Редкое, но понятное библейское слово сохраняет возможный смысл не обычной календарной недели, а пророческого периода; неоднозначность отмечена в сноске.
- source_word: incorruptible
  choice: нетленный
  rationale: Сохраняет эсхатологическую и антитезную связь с прежде «тленным» обиталищем сердца.
- source_word: mouth, door of the temple
  choice: дверь храма — уста
  rationale: Сохранена резкая авторская метафора без рационализирующего пересказа.
theological_decisions:
- issue: Отношение материального храма к духовному храму
  choice: 'Сохранён ход рассуждения автора: тщетность надежды на здание и созидание храма внутри верующих.'
  alternative: Свести текст к общему утверждению, что Бог не обитает в рукотворных зданиях.
  rationale: Более общий пересказ устранил бы напряжение между упразднением одного храма и утверждением существования другого.
- issue: Кто обитает и говорит в человеке
  choice: «Тот, Кто обитает и говорит в нём» оставлено без более точного догматического именования.
  alternative: Явно назвать говорящего Богом, Христом или Святым Духом.
  rationale: Свидетель формулирует референт местоименно; уточнение внесло бы конфессиональную гармонизацию.
- issue: «Он Сам» в перечне признаков Божьего обитания
  choice: Местоименная отсылка сохранена и связана с Богом из предыдущего предложения.
  alternative: Заменить на конкретное лицо Троицы.
  rationale: Исходная формулировка не даёт основания для такого уточнения.
- issue: Риторика об Израиле
  choice: Сохранены резкие авторские слова «эти несчастные» и утверждение о предании города, храма и народа.
  alternative: Смягчить или обобщить полемические выражения.
  rationale: Смягчение исказило бы историческую риторику произведения; при этом перевод не расширяет обвинение и не добавляет враждебных характеристик.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Архаизмы сведены к минимуму; «седмина» сохранена как точный термин с пояснением. Императивы переданы кратко и прямо («Узнайте», «Поймите», «внимайте»), а цепочки образов и повторов намеренно не сглажены. Поскольку предоставленный drafting basis прямо отмечен как английское публично-доменное свидетельство, а сверка с древнегреческим и латинским текстом ещё ожидается, спорные места снабжены оговорками и не представлены как окончательно установленные.
