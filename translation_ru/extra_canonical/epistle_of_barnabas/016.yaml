    Ведь они, почти как язычники, освятили Его в храме[a]. Но что говорит Господь, упраздняя храм? Узнайте: «Кто измерил небо пядью или землю — ладонью? Не Я ли? — говорит Господь. — Небо — престол Мой, а земля — подножие ног Моих. Какой дом построите Мне? Или где будет место Моего покоя?» Вы видите, что надежда их тщетна.


