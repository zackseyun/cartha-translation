lexical_decisions:
- source_word: ordinances (Greek source review pending)
  choice: установления
  rationale: Передаёт нормативные предписания Господа без излишне узкого значения «заповеди» или юридически-бюрократического оттенка.
- source_word: spirits (Greek source review pending)
  choice: души
  rationale: В обращении к людям русское «души» звучит естественнее буквального «духи»; формулировка не отрицает возможной отсылки к духовному состоянию адресатов.
- source_word: knowledge (Greek source review pending)
  choice: знание
  rationale: Сохранено общее значение познания и наставления без привнесения позднейшего технического смысла «гносис».
- source_word: firstfruits of the taste
  choice: вкусить начатки
  rationale: Сохраняет обе образные составляющие свидетельства — вкушение и начаток — в естественной русской конструкции.
- source_word: fear of Him
  choice: чтить Его
  rationale: Передаёт религиозный страх как благоговейное почитание; буквальное чтение и неясность сравнительной конструкции отмечены в сноске.
theological_decisions:
- issue: «Жизнь, которая от Него» / принадлежит Ему
  choice: жизнь, которая от Него
  alternative: жизнь, принадлежащая Ему / Его жизнь
  rationale: Контекст связывает надежду верующих с даруемой Господом жизнью; при этом формулировка оставлена достаточно открытой и не превращена в специальное догматическое утверждение.
- issue: Три установления и синтаксис их описания
  choice: Сохранены три параллельных пункта без богословского переистолкования
  alternative: Перестроить как систему трёх добродетелей или этапов спасения
  rationale: Исходное свидетельство формулирует плотные и отчасти загадочные параллели; перевод не должен разрешать их в пользу определённой конфессиональной схемы.
- issue: Награда за служение
  choice: «служение таким душам станет для меня наградой»
  alternative: «это зачтётся мне в награду»
  rationale: Сохранена связь награды со служением без уточнения механизма заслуги или оправдания.
translation_notes:
  register: Современный литературный русский язык с достойным раннехристианского послания тоном. Архаизмы и тяжёлые кальки устранены, длинный период разделён ради ясности. Черновик основан на предоставленном англоязычном публичном свидетельстве; прямая сверка с греческим и латинским текстом пока невозможна и необходима перед окончательной публикацией.
