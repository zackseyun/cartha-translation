review_pass:
  verdict: revise
  source_fidelity: 'Черновик в целом следует предоставленному английскому свидетельству, однако в нескольких местах заменяет его образы и термины толкованием: «духи» переданы как «души», желанный «вид» адресатов — как «встреча», «небольшое нечто» — как «краткое наставление», а образ приношения в страхе перед Господом — как почитание. Также «жизнь, которая от Него» сужает более буквальное и потенциально неоднозначное «жизнь, которая Его». Исправленный текст сохраняет эти особенности и трудный синтаксис без догматического уточнения.'
  naturalness: Русский текст в основном литературен и ясен. В исправлении устранены неестественные либо семантически смещённые обороты («радуюсь за себя», «встреча с вами») и сохранён достойный посланнический регистр. Необычность выражения о приношении в благоговейном страхе отмечена сноской, а не сглажена ценой образности.
  terminology: «Установления» допустимо для ordinances, но «духи» следует сохранить там, где свидетельство говорит spirits. «Знание», «праведность», «вера», «любовь», «Дух» и «начатки» переданы последовательно. Для трёх δόγματα/ordinances сохранено нейтральное «установления» без навязывания позднейшей систематической терминологии.
  issues:
  - severity: medium
    issue: «Души» вместо «духов»
    rationale: Английское свидетельство дважды имеет spirits. Замена на «души» меняет термин и ослабляет возможную связь с духовным даром; современное русское «духи» здесь допустимо.
  - severity: medium
    issue: Интерпретирующие замены исходных образов
    rationale: «Встреча с вами», «краткое наставление» и «чтить Его» не воспроизводят соответственно желанный вид адресатов, «небольшое нечто» и приношение, связанное со страхом перед Ним. Эти замены не нужны для естественности русского текста.
  - severity: medium
    issue: Сужение формулы о жизни
    rationale: «Жизнь, которая от Него» толкует формулу «life which is His». «Жизнь, которая принадлежит Ему» сохраняет принадлежность и не определяет её как происхождение жизни.
  - severity: low
    issue: Необходима сверка с греческими и латинскими свидетелями
    rationale: Предоставленное основание является английским публично-доменным свидетельством; особенно нуждаются в проверке «установления», трудный перечень трёх положений и образ приношения в страхе перед Ним.
  revised_text: 'Приветствую вас, сыновья и дочери, во имя Господа, возлюбившего нас, — с миром.


    Видя, сколь велики и обильны для вас установления Божьи, я радуюсь чрезвычайно великой и преизобильной радостью о ваших блаженных и славных духах: столь глубоко присуща вам благодать полученного вами духовного дара.


    Поэтому я тем более считаю себя счастливым, надеясь быть спасённым, ибо поистине вижу, что Дух излился среди вас из богатства источника Господа. Я был весьма изумлён тем, что увидел у вас, — а ведь я так желал вас увидеть.


    Убеждённый в этом и сознавая, что, хотя я много говорил среди вас, Господь шёл со мной путём праведности, я также всецело побуждён любить вас больше собственной души: ведь великая вера и любовь пребывают в вас через надежду на жизнь, которая принадлежит Ему. Поэтому, принимая во внимание, что, если я позабочусь сообщить вам некоторую часть того, что получил сам, это послужит мне наградой за служение таким духам, я поспешил послать вам нечто небольшое, чтобы вместе с верой вы обрели и полноту знания.


    Итак, есть три установления Господа: надежда на жизнь — начало и конец нашей веры; праведность — начало и конец суда; любовь, являемая в радости и ликовании, — свидетельство дел праведности.[a]


    Ибо Господь через Своих пророков открыл нам прошлое и настоящее и также дал нам начатки вкушения будущего. Видя, как каждое из этого одно за другим сбывается, согласно Его слову, мы должны приносить всё более богатое и возвышенное приношение в благоговейном страхе перед Ним.[b] Я же, не как учитель, а как один из вас, изложу несколько мыслей, которыми вы будете обрадованы в нынешних обстоятельствах.'
