base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/003.yaml
  text: 'Therefore he speaks to them again concerning these things: “Why do you fast for me,” says the Lord, “so that your voice is heard crying aloud today? This is not the fast that I have chosen,” says the Lord, “nor is it a man humbling his soul;


    not even if you bend your neck like a hoop, put on sackcloth, and make your bed in ashes. Not even then will you call it an acceptable fast.


    But to us he says, “Behold, this is the fast that I have chosen,” says the Lord: “Loosen every bond of wickedness, untie the tightened cords of forced contracts, send the broken away in freedom, and tear apart every unjust bond. Break your bread for the hungry, and if you see someone naked, clothe him. Bring the homeless into your house, and if you see a humble person, do not despise him, nor anyone of your household and your own offspring.


    Then your light will break forth in the morning, and your healing will arise quickly. Righteousness will go before your face, and the glory of God will surround you.


    Then you will cry out, and God will hear you. While you are still speaking, he will say, ‘Behold, I am here,’ if you remove from yourself the yoke, the pointing of the finger, and the word of murmuring; if you give your bread wholeheartedly to the hungry and have pity on the humbled soul.”


    For this purpose, therefore, my brothers, the one who is patient, foreseeing that the people whom he had prepared in his well-beloved would believe in simplicity, revealed everything to us beforehand, so that we, as novices, might not shipwreck ourselves on their law.'
translation:
  language: ru
  text: 'Итак, Он снова говорит им об этом: «Зачем вы поститесь ради Меня, — говорит Господь, — чтобы сегодня ваш громкий крик был услышан? Не такой пост Я избрал, — говорит Господь, — и не то, чтобы человек смирял свою душу.


    Даже если вы согнёте шею, как обруч, наденете вретище и постелете себе пепел, и тогда вы не назовёте такой пост угодным.


    Но нам Он говорит: „Вот пост, который Я избрал, — говорит Господь: — развяжи всякие узы нечестия, распусти туго стянутые путы насильственных договоров,[a] отпусти сокрушённых на свободу и разорви всякое несправедливое ярмо. Раздели свой хлеб с голодным; если увидишь нагого — одень его; бездомного введи в свой дом; если увидишь униженного — не презирай ни его, ни кого-либо из твоих домашних и твоего собственного потомства.[b]


    Тогда твой свет пробьётся, как утренняя заря, и исцеление твоё скоро явится; праведность пойдёт перед тобой, и слава Божья окружит тебя.


    Тогда ты воззовёшь — и Бог услышит тебя; ты ещё будешь говорить, а Он скажет: ‘Вот Я’. Это будет, если ты удалишь от себя ярмо, указующий перст и ропот; если от всего сердца отдашь свой хлеб голодному и пожалеешь душу униженную“.


    Для того, братья мои, Долготерпеливый, предвидя, что народ, который Он приготовил в Своём Возлюбленном,[c] уверует в простоте, заранее открыл нам всё это, чтобы мы, словно новички, не потерпели кораблекрушения, наткнувшись на их закон.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по предоставленному свидетельству: «туго стянутые верёвки насильственных договоров». Формулировка трудна; возможен общий смысл долговых или принудительных обязательств.'
    reason: Отмечает текстуально и лексически неясное социально-юридическое выражение, не скрывая неопределённости.
  - marker: b
    text: 'Фраза допускает понимание: «не пренебрегай родственниками, людьми своего дома и своего рода».'
    reason: Русский основной текст следует синтаксису свидетельства, но родственно-домашняя формула допускает более идиоматическое толкование.
  - marker: c
    text: «Возлюбленный» — вероятный титул Христа, однако в переданном тексте Он прямо не назван.
    reason: Сохраняет христологическую отсылку без добавления отсутствующего слова.
  - marker: d
    text: «Их закон» передаёт полемическое местоимение исходного свидетельства; кого именно автор здесь противопоставляет «нам», следует определять из более широкого контекста послания.
    reason: Не позволяет переводу молча разрешить богословски значимую референцию местоимения.
lexical_decisions:
- source_word: abasing / humbling his soul
  choice: смирял свою душу
  rationale: Сохраняет библейскую формулу самоумаления и связь поста с внутренним состоянием, не сводя её к одному лишь телесному изнурению.
- source_word: forcible contracts
  choice: насильственных договоров
  rationale: Передаёт необычную юридико-социальную формулировку свидетельства буквально настолько, насколько позволяет русский язык; не подменяет её более привычным текстом Ис 58.
- source_word: the broken ones
  choice: сокрушённых
  rationale: Сохраняет образ людей, сломленных притеснением, и не сужает его до одной социальной категории.
- source_word: acceptable
  choice: угодным
  rationale: Естественная для русского библейского регистра передача поста, принимаемого Богом.
- source_word: stretching forth of the finger
  choice: указующий перст
  rationale: Сохраняет телесный образ обвиняющего или презрительного жеста; «перст» поддерживает достоинство цитатного пророческого регистра.
- source_word: in simplicity
  choice: в простоте
  rationale: 'Оставляет открытой смысловую широту: искренность, бесхитростность или простодушие; не вводит оценочного толкования.'
- source_word: shipwreck ourselves upon their law
  choice: не потерпели кораблекрушения, наткнувшись на их закон
  rationale: Сохраняет резкую морскую метафору автора и направленность местоимения «их», не сглаживая полемическое напряжение.
theological_decisions:
- issue: К кому относятся местоимения в пророческой цитате
  choice: Сохранены переходы «им» и «нам»
  alternative: Унифицировать адресатов или пояснить их как Израиль и церковь
  rationale: Автор намеренно противопоставляет адресатов; конкретизировать их внутри текста означало бы добавить толкование.
- issue: Личность «Долготерпеливого»
  choice: Титул передан как «Долготерпеливый» без добавления имени
  alternative: «долготерпеливый Бог»
  rationale: Контекст указывает на Бога, однако исходная номинализация сохраняет риторическую форму и не требует вставки.
- issue: «В Своём Возлюбленном»
  choice: Сохранено как титульное выражение без уточнения
  alternative: «в Своём возлюбленном Сыне» или прямое именование Христа
  rationale: Вероятная христологическая отсылка ясна, но слово «Сыне» отсутствует в предоставленном свидетельстве; двусмысленность не устранена.
- issue: Отношение автора к «их закону»
  choice: Сохранена полемическая формулировка
  alternative: Смягчить до «неправильного понимания закона»
  rationale: Смягчение импортировало бы богословское объяснение, которого нет в тексте.
translation_notes:
  register: Современный литературный русский с возвышенным, но понятным библейским регистром. Архаизмы ограничены узнаваемыми словами «вретище» и «перст» внутри пророческой цитаты. Единственное и множественное число сохранены по риторическим переходам свидетельства. Поскольку прямая сверка с греческими и латинскими рукописями в предоставленных данных отмечена как предстоящая, проект осторожно опирается на публичное английское свидетельство и аудированный английский слой, а спорные места явно вынесены в примечания.
