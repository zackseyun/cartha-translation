review_pass:
  verdict: revise
  source_fidelity: 'Проект в целом точно передаёт ход аргумента и сохранённые в цитате переключения между множественным и единственным числом. Однако несколько мест нуждаются в более точной и естественной передаче: «ради Меня» способно означать мотив поста, тогда как вопрос обращён к постящимся Богу; «постелете себе пепел» неестественно; «насильственные договоры» чрезмерно узко передаёт трудное социально-юридическое выражение; заключительное «Для того» синтаксически и логически не связывает вывод автора с предыдущей цитатой.'
  naturalness: Русский регистр удачно сочетает современную литературность с библейской возвышенностью. Исправлены неестественные сочетания «постелете себе пепел», «праведность пойдёт перед тобой» и «Для того, братья мои». Прямая речь и риторические переходы сохранены.
  terminology: «Вретище», «ярмо», «перст», «Долготерпеливый» и «Возлюбленный» уместны в цитатном библейском регистре. Для βίαια συναλλάγματα предпочтено более широкое «насильственные обязательства», не сводящее выражение к современным договорам. Христологическая отсылка «в Своём Возлюбленном» оставлена без конфессионально обусловленного уточнения.
  issues:
  - severity: medium
    issue: «Ради Меня» в вопросе о посте
    rationale: Оборот может читаться как «поститься в Моих интересах». «Поститесь Мне» точнее сохраняет библейскую конструкцию поста, обращённого к Богу.
  - severity: medium
    issue: «Постелете себе пепел»
    rationale: Это неестественное русское выражение. «Устроите себе ложе из пепла» сохраняет образ исходного текста.
  - severity: medium
    issue: «Насильственные договоры»
    rationale: Трудное выражение обозначает не только формальные договоры, но принудительные сделки или обязательства. Более широкая передача лучше сохраняет неопределённость.
  - severity: low
    issue: Связка «Для того» в заключении
    rationale: Она не образует ясной связи с предшествующим материалом. «Вот почему» естественно передаёт выводный характер фразы.
