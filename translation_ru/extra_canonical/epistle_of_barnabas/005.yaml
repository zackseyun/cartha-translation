    Ибо Писание о Нём говорит частью об Израиле, частью о нас. Оно говорит: «Он был изранен за ваши беззакония и сокрушён за наши грехи; Его ранами мы исцелились. Как овца, Он был ведён на заклание и, как ягнёнок безгласен перед стригущим его».[b]


    Поэтому нам следует быть глубоко благодарными Господу: Он открыл нам прошлое, вразумил нас о настоящем и не оставил без понимания будущего.


    Писание говорит: «Не без справедливого основания расставляется сеть для птиц».[c] Это значит, что справедливо погибнет человек, который, зная путь праведности, сам принуждает себя идти путём тьмы.


    Есть и ещё нечто, братья мои. Если Господь, Владыка всего мира, претерпел страдания ради наших душ — Тот, Кому Бог при основании мира сказал: «Сотворим человека по образу Нашему и по подобию», — то как же Он претерпел страдания от рук людей?


    Поймите: пророки, получив от Него благодать, пророчествовали о Нём. Сам же Он претерпел страдания, чтобы уничтожить смерть и явить воскресение мёртвых, потому что Ему надлежало явиться во плоти;


    чтобы вместе с тем исполнить обещание, данное отцам, и, приготовив Себе новый народ, ещё во время пребывания на земле показать, что, совершив воскресение, Он Сам будет судить.


    Кроме того, Он проповедовал, наставляя Израиль и совершая столько знамений и чудес, и чрезвычайно любил его.


    Когда же Он избрал Своих апостолов, которым предстояло возвещать Его Евангелие, — людей, бывших величайшими грешниками, чтобы показать, что Он пришёл призвать не праведников, а грешников, — тогда Он явил Себя Сыном Божьим.[d]


    Ведь если бы Он не пришёл во плоти, люди не смогли бы взирать на Него и спастись: они не могут смотреть прямо даже на лучи солнца, которому предстоит исчезнуть и которое является творением Его рук.


    Итак, Сын Божий пришёл во плоти, чтобы довести до полноты меру грехов тех, кто преследовал и убивал Его пророков.[e]


    Для того Он и претерпел страдания. Ведь Бог говорит, что раны Его плоти были нанесены ими: «Когда поразят своего пастыря, тогда овцы стада погибнут».[f]


    Но Он Сам пожелал пострадать таким образом, ибо Ему надлежало пострадать на древе. Пророк говорит о Нём: «Сохрани душу Мою от меча» и «Пронзите гвоздями плоть Мою, ибо сборища злодеев восстали против Меня».[g]


