  yaml_path: translation/extra_canonical/epistle_of_barnabas/005.yaml
  text: 'For this purpose the Lord endured handing over his flesh to corruption, so that we might be cleansed by the forgiveness of sins, a cleansing that comes through the blood of his sprinkling.


    For the Scripture concerning him contains some things relating to Israel and some relating to us. It says: “He was wounded for your transgressions, and he was bruised for our sins. By his stripes we were healed. Like a sheep he was led to slaughter, and like a lamb silent before its shearer.”


    Therefore, we ought to be very thankful to the Lord, because he has revealed the past to us, made us wise concerning the present, and not left us without understanding concerning the future.


    Now the Scripture says, “Not unjustly is the net spread for the birds.” He means that a person will justly perish if, despite knowing the way of righteousness, he forces himself onto the way of darkness.


    There is also this, my brothers: If the Lord endured suffering for our souls, though he was Lord of the whole world—the one to whom God said at the foundation of the world, “Let us make man in our image and likeness”—then how did he endure suffering at the hands of human beings?


    Understand this. The prophets, having received grace from him, prophesied concerning him. But he himself endured suffering so that he might destroy death and show forth the resurrection of the dead, because it was necessary for him to be manifested in the flesh;


    so that at the same time he might redeem the promise made to the fathers and, by preparing the new people for himself, show while he was on earth that, having brought about the resurrection, he himself will exercise judgment.


    Furthermore, he preached, teaching Israel and performing so many wonders and miracles, and he loved him exceedingly.


    When he chose his own apostles, who were to proclaim his gospel—men who were sinners beyond every sin, so that he might show that he came not to call the righteous but sinners—then he manifested himself to be the Son of God.


    For if he had not come in the flesh, people could not have looked upon him and been saved, since they cannot face the rays of the sun, which will cease to be and is the work of his own hands.


    Therefore, the Son of God came in the flesh for this purpose: to sum up the complete tale of their sins against those who persecuted and killed his prophets.


    For this purpose, then, he endured. For God says that the wounds of his flesh came from them: “When they strike their own shepherd, then the sheep of the flock will be lost.”


    But he himself desired to suffer in this way, for it was necessary for him to suffer on a tree. For he that prophesied said concerning him, “Spare my soul from the sword,” and, “Pierce my flesh with nails, for the congregations of evildoers have risen up against me.”


    And again he says, “Behold, I have given my back to stripes and my cheeks to smitings, and I have set my face as a hard rock.”'
translation:
  language: ru
  text: 'Для того Господь и претерпел предание Своей плоти тлению, чтобы мы очистились прощением грехов — очищением через кровь Его окропления.[a]


    Ибо Писание о Нём говорит частью об Израиле, частью о нас. Оно говорит: «Он был изранен за ваши беззакония и сокрушён за наши грехи; Его ранами мы исцелились. Как овца, Он был ведён на заклание и, как ягнёнок безгласен перед стригущим его».[b]


    Поэтому нам следует быть глубоко благодарными Господу: Он открыл нам прошлое, вразумил нас о настоящем и не оставил без понимания будущего.


    Писание говорит: «Не без справедливого основания расставляется сеть для птиц».[c] Это значит, что справедливо погибнет человек, который, зная путь праведности, сам принуждает себя идти путём тьмы.


    Есть и ещё нечто, братья мои. Если Господь, Владыка всего мира, претерпел страдания ради наших душ — Тот, Кому Бог при основании мира сказал: «Сотворим человека по образу Нашему и по подобию», — то как же Он претерпел страдания от рук людей?


    Поймите: пророки, получив от Него благодать, пророчествовали о Нём. Сам же Он претерпел страдания, чтобы уничтожить смерть и явить воскресение мёртвых, потому что Ему надлежало явиться во плоти;


    чтобы вместе с тем исполнить обещание, данное отцам, и, приготовив Себе новый народ, ещё во время пребывания на земле показать, что, совершив воскресение, Он Сам будет судить.


    Кроме того, Он проповедовал, наставляя Израиль и совершая столько знамений и чудес, и чрезвычайно любил его.


    Когда же Он избрал Своих апостолов, которым предстояло возвещать Его Евангелие, — людей, бывших величайшими грешниками, чтобы показать, что Он пришёл призвать не праведников, а грешников, — тогда Он явил Себя Сыном Божьим.[d]


    Ведь если бы Он не пришёл во плоти, люди не смогли бы взирать на Него и спастись: они не могут смотреть прямо даже на лучи солнца, которому предстоит исчезнуть и которое является творением Его рук.


    Итак, Сын Божий пришёл во плоти, чтобы довести до полноты меру грехов тех, кто преследовал и убивал Его пророков.[e]


    Для того Он и претерпел страдания. Ведь Бог говорит, что раны Его плоти были нанесены ими: «Когда поразят своего пастыря, тогда овцы стада погибнут».[f]


    Но Он Сам пожелал пострадать таким образом, ибо Ему надлежало пострадать на древе. Пророк говорит о Нём: «Сохрани душу Мою от меча» и «Пронзите гвоздями плоть Мою, ибо сборища злодеев восстали против Меня».[g]


    И ещё Он говорит: «Вот, Я отдал спину Мою на бичевание и щёки Мои — на удары, а лицо Моё сделал подобным твёрдой скале».[h]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Кровь Его окропления» — образ ритуального очищения кровью; ср. язык окропления в Лев. 16 и Исх. 24:8.
    reason: Выражение непривычно современному читателю и несёт важную культовую образность.
  - marker: b
    text: Свободное соединение Ис. 53:5, 7; местоимения «ваши» и «наши» переданы в той форме, в какой они приведены автором.
    reason: Цитата отличается от привычных библейских формулировок и намеренно чередует лица.
  - marker: c
    text: Ср. Притч. 1:17. Автор понимает изречение как предупреждение человеку, который сознательно выбирает путь тьмы.
    reason: Авторское толкование отличается от наиболее очевидного смысла пословицы.
  - marker: d
    text: Ср. Мф. 9:13; Мк. 2:17; Лк. 5:32. Характеристика апостолов как величайших грешников отражает гиперболическую формулировку автора.
    reason: Необходимо сохранить трудное утверждение, не выдавая его за прямую евангельскую цитату целиком.
  - marker: e
    text: Буквально мысль может быть передана как «подвести полный итог их грехам». Местоимение относится к гонителям и убийцам пророков.
    reason: 'Исходная конструкция сжата и допускает несколько оттенков: завершить, суммировать или довести до полной меры.'
  - marker: f
    text: 'Свободная форма Зах. 13:7. В известных библейских текстах обычно: «порази пастыря, и рассеются овцы».'
    reason: Цитатная форма автора заметно отличается и не должна молча исправляться по каноническому тексту.
  - marker: g
    text: Первая цитата соотносится с Пс. 21:21 (22:20); вторая, о пронзении плоти гвоздями, не совпадает дословно с сохранившимся текстом Псалма и может отражать раннюю цитатную традицию.
    reason: Предотвращает ложное впечатление, будто обе фразы дословно находятся в современном тексте Псалма.
  - marker: h
    text: Свободное соединение образов Ис. 50:6–7.
    reason: Авторская форма цитаты объединяет бичевание, удары по щекам и лицо, подобное твёрдой скале.
lexical_decisions:
- source_word: παρέδωκεν τὴν σάρκα εἰς φθοράν (as reflected in the witness)
  choice: предание Своей плоти тлению
  rationale: Сохраняет резкий образ передачи плоти разрушению/тлению, не сглаживая его до общего «умереть».
- source_word: τὸ αἷμα τοῦ ῥαντίσματος αὐτοῦ (as reflected in the witness)
  choice: кровь Его окропления
  rationale: Сохранена культовая образность окропления и намеренно не подменена более конфессионально определённой формулой.
- source_word: ἀνακεφαλαιώσηται (probable underlying reading)
  choice: довести до полноты меру
  rationale: В данном контексте речь, вероятно, о завершении/подведении итога грехам гонителей; буквальное «возглавить» по-русски затемнило бы смысл.
- source_word: ξύλον
  choice: древо
  rationale: Передаёт традиционно многозначное «дерево/древо» без прямой замены словом «крест».
- source_word: κύριος
  choice: Господь / Владыка
  rationale: «Господь» сохранено как основной титул; в сочетании «Господь всего мира» употреблено естественное русское «Владыка всего мира».
theological_decisions:
- issue: К кому относится Божье «Сотворим человека»
  choice: 'Сохранена авторская отсылка ко Христу: «Тот, Кому Бог... сказал»'
  alternative: Обезличить цитату или представить её лишь как внутрибожественное множественное число
  rationale: Аргумент главы прямо связывает адресата слов Бытия с предсуществующим Господом; перевод должен сохранять эту раннехристианскую христологическую логику.
- issue: «Искупить обещание» в английском свидетеле
  choice: «исполнить обещание»
  alternative: «искупить обещание» или «осуществить обещание»
  rationale: Русское «искупить обещание» неестественно; «исполнить» передаёт реализацию обещанного, не добавляя теории искупления.
- issue: Статус апостолов как «грешников превыше всякого греха»
  choice: «людей, бывших величайшими грешниками»
  alternative: «грешников хуже всех»
  rationale: Сохранена провокационная гипербола текста, но в современном литературном русском без непонятной кальки.
- issue: Будущий суд Христа
  choice: «Он Сам будет судить»
  alternative: «Он Сам совершит суд»
  rationale: Прямо сохраняет утверждение автора о личном осуществлении суда Христом.
- issue: Ответственность за смерть пророков и страдания Христа
  choice: Сохранено ограниченное контекстом «тех, кто преследовал и убивал»
  alternative: Расширить обвинение на Израиль или иной народ целиком
  rationale: Не следует усиливать полемику текста коллективным этническим обвинением, которого данная формулировка не требует.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского наставления. Синтаксис разделён там, где это нужно для ясности, но сохранены риторические повторы «для того», напряжённые причинно-целевые связи и формулы цитирования Писания. Архаизмы ограничены словами, несущими библейскую образность («древо», «заклание»). Поскольку прямой анализ греческих и латинских свидетелей обозначен как ожидающий проверки, трудные места переведены осторожно по предоставленному публичному свидетелю и снабжены примечаниями.
