base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/008.yaml
  text: 'But what do you think the type means, where the commandment is given to Israel that those men whose sins are full grown must offer a heifer, slaughter it, and burn it; and then that the children must take up the ashes and cast them into vessels, and twist the scarlet wool on a tree—see, here again is the type of the cross and the scarlet wool—and the hyssop; and that, this done, the children should sprinkle the people one by one, that they may be purified from their sins?


    Understand how plainly it is spoken to you: the calf is Jesus; the men who offer it, being sinners, are those who offered him for slaughter. After this it is no more men (who offer); the glory is no more for sinners.


    The children who sprinkle are those who preached to us the forgiveness of sins and the purification of our hearts, those to whom, being twelve in number for a testimony to the tribes—for there are twelve tribes of Israel—he gave authority over the Gospel, that they should preach it.


    But why are the children who sprinkle three in number? For a testimony to Abraham, Isaac, and Jacob, because these are mighty before God.


    Then there is the placing of the wool on the tree. This means that the kingdom of Jesus is on the cross, and that those who set their hope on him shall live forever.


    And why are the wool and the hyssop at the same time? Because in his kingdom there shall be evil and foul days, in which we shall be saved; for he who suffers pain in the flesh is healed through the foulness of the hyssop.


    Now to us indeed it is manifest that these things so befell for this reason, but to them they were dark, because they did not hear the voice of the Lord.'
translation:
  language: ru
  text: '**Послание Варнавы 8**


    Как вы думаете, что означает этот прообраз? Израилю было заповедано, чтобы мужи, чьи грехи достигли полноты, принесли в жертву тёлку, закололи и сожгли её. Затем дети должны были собрать пепел, положить его в сосуды, обвить вокруг дерева алую шерсть — вот здесь снова прообраз креста и алая шерсть — и иссоп. После этого дети должны были окропить каждого из народа, чтобы люди очистились от своих грехов.


    Поймите, как ясно это сказано вам: телец[a] — это Иисус, а принесшие его мужи, сами будучи грешниками, — те, кто предал Его на заклание. После этого уже не мужи приносят жертву; грешникам больше нет славы.[b]


    Окропляющие дети — это те, кто возвестил нам прощение грехов и очищение наших сердец. Их было двенадцать — в свидетельство о коленах, ведь колен Израиля двенадцать. Им Он дал власть возвещать Евангелие.


    Но почему окропляющих детей трое? В свидетельство об Аврааме, Исааке и Иакове, потому что они велики пред Богом.


    Далее шерсть возлагают на дерево. Это означает, что царство Иисуса — на кресте и что возлагающие на Него надежду будут жить вовеки.


    А почему шерсть и иссоп берутся вместе? Потому что в Его царстве наступят злые и скверные дни, в которые мы будем спасены: ведь страдающий плотью исцеляется через скверность иссопа.[c]


    Итак, нам ясно, что всё это произошло именно по этой причине, а для них это оставалось тёмным, потому что они не услышали голоса Господа.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: В описании заповеди выше названа тёлка, а в её истолковании — телец; эта смена обозначения сохранена по древнему свидетельству.
    reason: Предупреждает читателя, что различие не является случайной непоследовательностью русского перевода.
  - marker: b
    text: Фраза «После этого уже не мужи приносят жертву; грешникам больше нет славы» в сохранившемся свидетельстве неясна; перевод не устраняет её неоднозначность.
    reason: Отмечает текстуальную и смысловую трудность, не навязывая реконструкцию.
  - marker: c
    text: Выражение «через скверность иссопа» передано буквально по доступному свидетельству; вероятно, автор связывает непривлекательный или горький иссоп со страданием плоти, однако точный смысл неясен.
    reason: Поясняет необычную формулировку и отделяет возможное понимание от самого перевода.
lexical_decisions:
- source_word: type
  choice: прообраз
  rationale: Передаёт типологический смысл отрывка естественным для русского богословского и литературного языка словом, не сводя его к простому символу.
- source_word: heifer / calf
  choice: тёлка / телец
  rationale: 'Сохранена смена обозначения животного внутри древнего свидетельства: сначала тёлка в описании обряда, затем телец в истолковании.'
- source_word: children
  choice: дети
  rationale: Буквальное обозначение сохранено, поскольку на нём строится дальнейшее толкование чисел двенадцать и три; замена на «юноши» или «отроки» могла бы неоправданно уточнить возраст.
- source_word: tree
  choice: дерево
  rationale: Сохраняет предметный образ и его последующее сопоставление с крестом; архаическое «древо» не требуется для современного литературного регистра.
- source_word: scarlet wool
  choice: алая шерсть
  rationale: Естественное и точное обозначение материала и цвета без искусственной библейской архаизации.
- source_word: foulness of the hyssop
  choice: скверность иссопа
  rationale: Сохранено трудное и нарочито резкое выражение свидетельства, а не заменено объясняющим толкованием.
theological_decisions:
- issue: Фраза о царстве Иисуса и кресте
  choice: «царство Иисуса — на кресте»
  alternative: «царство Иисуса утверждается через крест»
  rationale: Сохранена напряжённая и неоднозначная формулировка свидетельства; причинное или инструментальное толкование не внесено.
- issue: Власть над Евангелием
  choice: «Им Он дал власть возвещать Евангелие»
  alternative: «Он дал им власть над Евангелием»
  rationale: Русская формулировка связывает власть с прямо названной целью — проповедью, не создавая лишнего представления о господстве апостолов над содержанием Евангелия.
- issue: Двенадцать и трое окропляющих детей
  choice: Оба числа сохранены без согласования
  alternative: Истолковать их как две разные группы или исправить одно из чисел
  rationale: Кажущееся расхождение присутствует в предоставленном свидетельстве и не должно устраняться догадкой переводчика.
- issue: Неясное высказывание о мужах и славе грешников
  choice: Сохранена последовательность двух кратких утверждений
  alternative: Перефразировать как окончание роли распявших Иисуса
  rationale: Смысл текста не вполне ясен, поэтому перевод не закрепляет единственное богословское объяснение.
translation_notes:
  register: Современный литературный русский язык с умеренно торжественным раннехристианским звучанием. Архаизмы сведены к устойчивым и понятным формам («пред Богом», «вовеки», «на заклание»). Проект основан на предоставленном англоязычном публичном свидетельстве; прямая сверка с греческими и латинскими источниками ещё требуется.
