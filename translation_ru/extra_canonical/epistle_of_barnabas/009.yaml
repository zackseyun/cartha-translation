  yaml_path: translation/extra_canonical/epistle_of_barnabas/009.yaml
  text: 'Furthermore, concerning the ears, he says that it is our heart that he circumcised. The Lord says in the prophet, “With the hearing of the ears they listened to me.” And again he says, “Those who are far away will hear with their ears and will understand what I have done.” And, “Be circumcised in your hearts,” says the Lord.


    And again he says, “Hear, Israel, for this is what the Lord your God says. Whoever desires to live forever, let him hear with his ears the voice of my servant. ~y” And again he says, “Hear, heaven, and give ear, earth, for the Lord has spoken these things as a testimony.” And again he says, “Hear the words of the Lord, you rulers of this people.” And again he says, “Hear, my children, the voice of one crying in the wilderness.” Therefore he circumcised our ears so that, by hearing the word, we might believe.


    But moreover, the circumcision in which they place their confidence is abolished, for he has said that a circumcision not of the flesh should be practiced. But they transgressed, because an evil angel taught them cleverness.


    He says to them, “This is what the Lord your God says”—so I find the commandment—“Do not sow among thorns; be circumcised into your Lord.” And what does he say? “Be circumcised in the hardness of your heart, and then you will not harden your neck.” Take this also: “Behold,” says the Lord, “all the Gentiles are uncircumcised in their foreskin, but this people is uncircumcised in their hearts.”


    But you will say, “In truth, the people has been circumcised as a seal.” No, for so likewise is every Syrian and Arabian and all the priests of the idols. Do all those, then, also belong to their covenant? Moreover, the Egyptians are also included among the circumcised.


    Therefore learn fully about all things, children of love: Abraham, who first appointed circumcision, looked forward in the spirit to Jesus when he circumcised, having received the ordinances of three letters.


    For Scripture says, “And Abraham circumcised of his household eighteen males and three hundred.” What, then, was the knowledge given to him? Understand that he says the eighteen first, and then, after an interval, three hundred. In the eighteen, “I” stands for ten and “H” for eight. Here you have JESUS (IHSOYS). And because the cross in the “T” was to have grace, he also says three hundred. Thus he reveals Jesus in the two letters, and the cross in the remaining one.


    He who placed within us the innate gift of his covenant knows: no one has ever learned from me a more genuine word. But I know that you are worthy.'
translation:
  language: ru
  text: '**9:1** Далее, говоря об ушах, Он объясняет, что обрезал наше сердце. Господь говорит через пророка: «Ушами они услышали Меня». И ещё Он говорит: «Далёкие услышат ушами и узнают, что Я сделал». И ещё: «Обрежьте ваши сердца, — говорит Господь».


    **9:2** И ещё Он говорит: «Слушай, Израиль, ибо так говорит Господь, Бог твой: кто желает жить вечно, пусть ушами услышит голос Моего Слуги». И ещё Он говорит: «Слушай, небо, и внимай, земля, ибо Господь изрёк это во свидетельство». И ещё Он говорит: «Слушайте слово Господа, правители этого народа». И ещё Он говорит: «Слушайте, дети Мои, голос взывающего в пустыне». Итак, Он обрезал наши уши, чтобы мы, услышав слово, уверовали.


    **9:3** Но и обрезание, на которое они полагаются, упразднено, потому что Он заповедал совершать обрезание не плоти. Однако они преступили заповедь, потому что злой ангел научил их лукавой мудрости.


    **9:4** Он говорит им: «Так говорит Господь, Бог ваш» — вот какую заповедь я нахожу: «Не сейте среди терновника; обрежьте себя для Господа вашего».[a] И что Он говорит? «Обрежьте ожесточение вашего сердца — и тогда не будете упорствовать».[b] Возьми и другое место: «Вот, — говорит Господь, — все народы необрезаны во плоти, а этот народ необрезан сердцем».


    **9:5** Но ты скажешь: «Народ действительно принял обрезание как печать». Нет, ведь обрезаны также каждый сириец и араб и все жрецы идолов. Неужели и все они принадлежат к их завету? Более того, к числу обрезанных относятся и египтяне.


    **9:6** Итак, дети любви, в полноте узнайте обо всём этом: Авраам, первым совершивший обрезание, духом взирал вперёд, на Иисуса, когда обрезывал свой дом, получив установление о трёх буквах.[c]


    **9:7** Ибо Писание говорит: «И обрезал Авраам из своего дома восемнадцать и триста мужчин».[d] Какое же знание было ему дано? Поймите: сначала сказано «восемнадцать», а затем, отдельно, «триста». В числе восемнадцать буква «Ι» означает десять, а «Η» — восемь. Получается «ΙΗ» — начало имени Иисуса.[e] А поскольку крест, изображённый буквой «Τ», должен был принести благодать, сказано также «триста». Итак, в двух буквах Он открывает Иисуса, а в оставшейся — крест.[f]


    **9:8** Знает Тот, Кто вложил в нас врождённый дар Своего завета: никто не слышал от меня слова более подлинного. Но я знаю, что вы достойны его.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально: «обрежьтесь Господу вашему»; смысл выражения — посвятить себя Господу посредством внутреннего обрезания.'
    reason: Необычное управление допускает более буквальный вариант, который по-русски звучал бы неясно.
  - marker: b
    text: 'Буквально: «не будете ожесточать шею», то есть не будете упорно противиться.'
    reason: В основном тексте употреблён естественный русский эквивалент древней идиомы, а буквальный образ сохранён в примечании.
  - marker: c
    text: Речь идёт о древнем способе записи чисел греческими буквами и о последующем истолковании числа 318.
    reason: Современному читателю необходим контекст для понимания перехода от обрезания дома Авраама к трём буквам.
  - marker: d
    text: То есть 318 мужчин; автор намеренно разделяет число на 18 и 300 ради буквенно-числового толкования. Ср. Быт. 14:14.
    reason: Форма цитаты отличается от привычной записи числа и требует пояснения.
  - marker: e
    text: 'В греческой цифровой записи Ι = 10, Η = 8. Буквы ΙΗ — первые две буквы греческого имени Иисуса: ΙΗΣΟΥΣ.'
    reason: Сохранены греческие буквы, на которых основан довод; русские буквы не передают числовой игры.
  - marker: f
    text: В греческой цифровой записи Τ = 300; её начертание автор связывает с формой креста.
    reason: Поясняет буквенно-числовую и визуальную связь, не очевидную в русском переводе.
lexical_decisions:
- source_word: περιτέμνω / circumcise
  choice: обрезать / совершать обрезание
  rationale: 'Сохранена сквозная телесно-метафорическая лексика главы: сердце, уши и плоть намеренно связаны одним глагольным корнем.'
- source_word: κατήργηται / is abolished
  choice: упразднено
  rationale: Передаёт сильное утверждение автора о недействительности упования на плотское обрезание, не добавляя позднейшей конфессиональной терминологии.
- source_word: ἄγγελος πονηρός / evil angel
  choice: злой ангел
  rationale: Буквальное и богословски нейтральное соответствие; не отождествляется прямо с сатаной.
- source_word: ἐσόφιζεν / taught cleverness
  choice: научил их лукавой мудрости
  rationale: Сохранена игра с мудростью и одновременно отрицательная оценка контекста; одно «хитрости» ослабило бы связь с корнем σοφ-.
- source_word: τέκνα ἀγάπης / children of love
  choice: дети любви
  rationale: Сохранено необычное обращение автора, а не сглажено до «возлюбленные дети».
- source_word: δόγματα τριῶν γραμμάτων / ordinances of three letters
  choice: установление о трёх буквах
  rationale: Формулировка сохраняет необычность исходного рассуждения и вводит последующее буквенно-числовое толкование.
- source_word: γνήσιος / genuine
  choice: подлинный
  rationale: Естественное современное русское слово, сохраняющее заверение автора в достоверности изложенного толкования.
theological_decisions:
- issue: Соотношение телесного и сердечного обрезания
  choice: Сохранено категоричное противопоставление самого автора без расширения его до общего тезиса о замещении Израиля или отмене библейского завета.
  alternative: Сформулировать в терминах позднейшей доктрины о «замещении» либо смягчить полемику.
  rationale: Текст содержит резкую раннехристианскую полемику, но не даёт основания импортировать в перевод более позднюю богословскую систему.
- issue: Референт местоимения «Он»
  choice: Сохранено прописное «Он» там, где речь в цитатной цепочке идёт о Господе, без уточнения Лица.
  alternative: В каждом случае заменить на «Бог», «Христос» или «Господь Иисус».
  rationale: Исходная референция местами допускает богословское напряжение; уточнение молча разрешило бы его.
- issue: Типологическое толкование числа 318
  choice: Передана собственная буквенно-числовая аргументация автора как утверждение текста.
  alternative: Исправить её по современным историко-грамматическим методам или представить лишь как примечание.
  rationale: Это существенная часть богословской аргументации Послания Варнавы и должна оставаться в основном тексте.
- issue: «Врождённый дар завета»
  choice: Сохранена трудная формулировка свидетельства без догматического разъяснения природы дара.
  alternative: Перевести как «духовное понимание завета» или «знание завета».
  rationale: Такие варианты делают неявное толкование явным и устраняют необычность фразы.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Библейские цитаты переданы узнаваемо, но не приведены насильно к формулировкам одной поздней русской версии, поскольку автор часто цитирует свободно и соединяет разные места. Архаизмы вроде «сей», «изрёк» употреблены ограниченно внутри пророческих цитат; повествовательная речь остаётся современной. Посторонний знак «~y» из английского свидетеля не воспроизведён как очевидный технический артефакт. Поскольку прямая сверка полного греческого/латинского критического текста обозначена как ожидающая выполнения, спорные места отмечены сдержанно и без ложной уверенности.
