lexical_decisions:
- source_word: Ten Words
  choice: Десять слов
  rationale: Сохранено древнее наименование Декалога, а не заменено более привычным выражением «Десять заповедей».
- source_word: hallow / make holy
  choice: освящать
  rationale: Единообразно передаёт сакральное отделение дня и последующее освящение людей.
- source_word: bring all things to an end / finished
  choice: привести всё к завершению / окончить
  rationale: Сохраняет словесную связь между завершением творения и эсхатологическим завершением всего, не сводя речь к уничтожению мира.
- source_word: the Lawless One
  choice: Беззаконник
  rationale: Определённость и олицетворение сохранены прописной буквой; термин не отождествлён редакционно с какой-либо конкретной фигурой.
- source_word: the eighth day
  choice: восьмой день
  rationale: Сохранён символический язык автора без замены конфессионально нагруженным календарным термином.
- source_word: another world
  choice: иной мир
  rationale: Передаёт эсхатологическую новизну, не уточняя спорно, имеется ли в виду эпоха, век или мироздание.
theological_decisions:
- issue: Шесть дней как шесть тысяч лет
  choice: Передать толкование автора прямо и без редакционного одобрения либо опровержения
  alternative: Смягчить его как метафору или снабдить полемическим пояснением
  rationale: Это собственная эсхатологическая аргументация послания; перевод должен сохранить её в исходной форме.
- issue: Лицо, которое будет почивать в седьмой день
  choice: Сохранить местоимение «Он» без дополнительного отождествления
  alternative: Явно назвать Бога Отца или Сына
  rationale: Контекст допускает синтаксическое напряжение после упоминания Сына; уточнение разрешило бы неоднозначность за автора.
- issue: Оправдание, обещание и освящение
  choice: 'Сохранить последовательность: оправдание и получение обещанного предшествуют способности освятить день'
  alternative: Переформулировать согласно позднейшей систематической схеме спасения
  rationale: Так сохраняется богословская логика самого текста без внесения конфессиональной доктрины.
- issue: Восьмой день
  choice: Передать как практику радостного празднования, связанную с воскресением Иисуса
  alternative: Назвать его воскресеньем или днём обязательного богослужения
  rationale: Исходный текст говорит о «восьмом дне» и радости, но не формулирует здесь позднейших дисциплинарных норм.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Синтаксис сделан понятным для обычного читателя, но повторения «освятить», «покой», «день» и внутренняя логика древнего толкования сохранены. Проект основан на предоставленном публично-доступном английском свидетельстве; прямая сверка с греческими и латинскими рукописными данными ещё требуется.
