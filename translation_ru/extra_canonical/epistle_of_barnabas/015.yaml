    Вдумайтесь, дети, что значат слова: «Он окончил за шесть дней». Они означают, что за шесть тысяч лет Господь приведёт всё к завершению, потому что у Него один день означает тысячу лет. Он Сам свидетельствует мне об этом, говоря: «Вот, день Господень будет как тысяча лет». Итак, дети, за шесть дней, то есть за шесть тысяч лет, всё придёт к завершению.


    «И почил в седьмой день». Это означает следующее: когда придёт Его Сын, упразднит время Беззаконника, осудит нечестивых и изменит солнце, луну и звёзды, тогда Он поистине будет почивать в седьмой день.


