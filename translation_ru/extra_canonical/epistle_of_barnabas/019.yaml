  revised_text: 'Итак, вот путь света. Если кто желает идти этим путём к предназначенной ему цели, пусть будет ревностен в своих делах. А знание, данное нам, чтобы мы могли идти этим путём, состоит в следующем.


    Люби Того, Кто сотворил тебя; бойся Того, Кто создал тебя; прославляй Того, Кто искупил тебя от смерти. Будь прост сердцем и богат духом. Не примыкай к тем, кто идёт путём смерти. Ненавидь всё, что неугодно Богу. Ненавидь всякое лицемерие. Никогда не оставляй заповедей Господа.


    Не превозносись, но во всём будь смирен. Не присваивай себе славы. Не замышляй зла против ближнего и не допускай дерзости в свою душу.


    Не предавайся разврату, не прелюбодействуй, не растлевай мальчиков. Слово Божье да не исходит от тебя там, где есть нечистые[a]. Обличая человека за проступок, не будь лицеприятен. Будь кроток, будь спокоен, благоговей перед словами, которые ты услышал. Не таи зла на своего брата.


    Не колеблись, будет ли чему-либо быть или нет[b]. Не произноси имени Господа напрасно. Люби ближнего больше собственной души. Не умерщвляй ребёнка во чреве и не убивай его после рождения. Не удерживай руки своей от сына или дочери[c], но с юности учи их страху Божьему.


    Не желай имущества ближнего и не будь корыстолюбив. Не прилепляйся душой к знатным[d], но ходи со смиренными и праведными. Всё, что с тобой случается, принимай как благо, зная, что ничто не бывает без Бога[e]. Не будь двоедушен и двуязычен.


    Подчиняйся своим господам, как образу Бога, со стыдом и страхом[f]. Не приказывай с ожесточением своему рабу или рабыне, которые надеются на того же Бога, чтобы они не перестали бояться Бога, стоящего над вами обоими. Ведь Он пришёл призвать не взирая на лица, но тех, кого приготовил Дух[g].


    Делай ближнего участником во всём и не говори, что что-либо принадлежит только тебе. Ведь если вы сообща причастны нетленному, то тем более — тленному. Не будь скор на язык, ибо уста — западня смерти. Насколько можешь, храни чистоту ради своей души.


    Не протягивай рук, чтобы получить, и не отдёргивай их, когда нужно дать. Люби как зеницу ока всякого, кто возвещает тебе слово Господа.


    День и ночь помни о дне суда и каждый день ищи общения со святыми: либо служи словом — иди увещевать их и размышляй, как словом своим спасти душу[h], — либо трудись своими руками ради искупления своих грехов[i].


    Не медли давать и не ропщи, когда даёшь; знай, кто есть добрый Воздаятель твоей награды[j]. Храни то, что принял, ничего не прибавляя и не убавляя. Всем сердцем ненавидь Злого[k]. Суди праведно.


    Не производи раскола, но примиряй враждующих, сводя их вместе. Исповедуй свои грехи. Не приступай к молитве с нечистой совестью. Вот путь света.'
