  text: 'This, then, is the way of light: if anyone desires to travel on the way to his appointed place, he should be zealous in his works. The knowledge given to us, by which we may walk in it, is as follows.


    You shall love the One who made you. You shall fear the One who created you. You shall glorify the One who redeemed you from death. You shall be simple in heart and rich in spirit. You shall not cleave to those who walk the way of death. You shall hate everything that is not pleasing to God. You shall hate all hypocrisy. You shall never forsake the commandments of the Lord.


    You shall not exalt yourself, but shall be lowly minded in all things. You shall not assume glory for yourself. You shall not entertain a wicked design against your neighbor. You shall not admit boldness into your soul.


    You shall not commit fornication. You shall not commit adultery. You shall not corrupt boys. The word of God shall not come forth from you where any are unclean. You shall not make a difference in a person when reproving him for a transgression. You shall be meek. You shall be quiet. You shall fear the words you have heard. You shall not bear a grudge against your brother.


    You shall not doubt whether a thing shall be or not be. You shall not take the name of the Lord in vain. You shall love your neighbor more than your own soul. You shall not murder a child by abortion, nor shall you kill it when it is born. You shall not withhold your hand from your son or daughter, but from their youth you shall teach them the fear of God.


    You shall not be found coveting your neighbor''s goods. You shall not be found greedy for gain. Neither shall you cleave with your soul to the lofty, but you shall walk with the humble and righteous. You shall receive the accidents that befall you as good, knowing that nothing is done without God. You shall not be double-minded or double-tongued.


    You shall be subject to your masters as to a type of God, in shame and fear. You shall not command your bondservant or handmaid in bitterness, though they set their hope on the same God, lest perhaps they cease to fear the God who is over both of you; for He came not to call with respect of persons, but to call those whom the Spirit has prepared.


    You shall make your neighbor partake in all things, and shall not say that anything is your own. For if you are fellow partakers in that which is imperishable, how much rather shall you be in the things that are perishable? You shall not be hasty with your own tongue, for the mouth is the snare of death. So far as you are able, you shall be pure for your soul''s sake.


    Do not be found holding out your hands to receive and drawing them in to give. You shall love as the apple of your eye everyone who speaks to you the word of the Lord.


    You shall remember the day of judgment night and day, and day by day you shall seek out the persons of the saints, either laboring by word and going to exhort them and meditating how you may save souls by your word, or working with your hands for a ransom for your sins.


    You shall not hesitate to give, nor shall you murmur when giving, but you shall know who is the good paymaster of your reward. You shall keep the things you have received, neither adding to them nor taking away from them. You shall utterly hate the Evil One. You shall judge righteously.


    You shall not make a schism, but shall pacify those who contend by bringing them together. You shall confess your sins. You shall not betake yourself to prayer with an evil conscience. This is the way of light.'
translation:
  language: ru
  text: 'Итак, вот путь света. Если кто желает пройти этим путём к назначенному ему месту, пусть будет ревностен в своих делах. А знание, данное нам, чтобы мы могли идти этим путём, состоит в следующем.


    Люби Того, Кто сотворил тебя; бойся Того, Кто создал тебя; прославляй Того, Кто искупил тебя от смерти. Будь прост сердцем и богат духом. Не примыкай к тем, кто идёт путём смерти. Ненавидь всё, что неугодно Богу. Ненавидь всякое лицемерие. Никогда не оставляй заповедей Господа.


    Не превозносись, но во всём будь смирен. Не присваивай себе славы. Не замышляй зла против ближнего и не допускай дерзости в свою душу.


    Не предавайся разврату, не прелюбодействуй, не растлевай мальчиков. Слово Божье да не исходит от тебя там, где есть нечистые[a]. Обличая человека за проступок, не будь лицеприятен. Будь кроток, будь спокоен, благоговей перед услышанными тобою словами. Не таи зла на своего брата.


    Не сомневайся, сбудется ли что-либо или нет[b]. Не произноси имени Господа напрасно. Люби ближнего больше собственной души. Не умерщвляй ребёнка во чреве и не убивай его после рождения. Не удерживай руки своей от сына или дочери[c], но с юности учи их страху Божьему.


    Не желай имущества ближнего и не будь корыстолюбив. Не прилепляйся душой к знатным[d], но общайся со смиренными и праведными. Всё, что с тобой случается, принимай как благо, зная, что ничто не бывает без Бога[e]. Не будь двоедушен и двуязычен.


    Подчиняйся своим господам, как образу Бога, со стыдом и страхом[f]. Не приказывай с ожесточением своему рабу или рабыне, которые надеются на того же Бога, чтобы они не перестали бояться Бога, стоящего над вами обоими. Ведь Он пришёл призвать не взирая на лица, но тех, кого приготовил Дух[g].


    Во всём делись с ближним и не говори, что что-либо принадлежит только тебе. Ведь если вы сообща причастны нетленному, то тем более должны сообща владеть тленным. Не будь скор на язык, ибо уста — западня смерти. Насколько можешь, храни чистоту ради своей души.


    Не протягивай рук, чтобы получить, и не отдёргивай их, когда нужно дать. Люби как зеницу ока всякого, кто возвещает тебе слово Господа.


    День и ночь помни о дне суда и каждый день ищи общения со святыми: либо служи словом — иди увещевать их и размышляй, как словом своим спасти душу[h], — либо трудись своими руками ради искупления своих грехов[i].


    Не медли давать и не ропщи, когда даёшь; и узнаешь, Кто щедро воздаёт тебе награду[j]. Храни то, что принял, ничего не прибавляя и не убавляя. Всем сердцем ненавидь Злого[k]. Суди праведно.


    Не производи раскола, но примиряй враждующих, сводя их вместе. Исповедуй свои грехи. Не приступай к молитве с нечистой совестью. Вот путь света.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Смысл фразы не вполне ясен: возможно также понимание «не говори слова Божьего нечистыми устами» или «в присутствии нечистых людей».'
    reason: Предоставленное английское свидетельство сохраняет неясную конструкцию; без прямой сверки греческих и латинских чтений нельзя уверенно выбрать одно толкование.
  - marker: b
    text: То есть не будь раздвоен в вере относительно того, исполнится ли сказанное Богом.
    reason: Буквальная формула может быть непонятна современному читателю, но основной текст сохраняет её открытую форму.
  - marker: c
    text: Вероятно, имеется в виду воспитательная забота и наставление, а не отказ от телесного наказания как такового.
    reason: Идиома «не удерживай руки» допускает различные оттенки; контекст непосредственно говорит об обучении страху Божьему.
  - marker: d
    text: Возможны переводы «к высокопоставленным», «к надменным» или «к возвышенному»; текстовое основание этого места требует сверки с греческими и латинскими свидетелями.
    reason: Смысл переданного английским witness слова «lofty» неоднозначен.
  - marker: e
    text: Эта формула утверждает Божье провидение, но сама по себе не уточняет, каким образом Бог соотносится с каждым событием.
    reason: Необходимо сохранить богословское напряжение, не добавляя детерминистического или иного конфессионального толкования.
  - marker: f
    text: Такова социальная форма наставления в древнем тексте; её воспроизведение не означает одобрения рабства.
    reason: Историческая дистанция важна для современного читателя, при этом сам текст не должен быть анахронически переписан.
  - marker: g
    text: Местоимение «Он» в данном контексте, вероятнее всего, относится к Богу; древняя формулировка не уточняет это прямо.
    reason: Сохраняется референтная неоднозначность.
  - marker: h
    text: В ряде параллельных текстов традиции «двух путей» смысл может быть «как спасти душу словом» — свою или другого человека; формулировка допускает неоднозначность.
    reason: Предоставленное свидетельство имеет «souls», но источник требует прямой проверки.
  - marker: i
    text: Вероятно, речь идёт о труде, позволяющем подавать милостыню; выражение «ради искупления грехов» сохранено как особенность древнего наставления.
    reason: Не следует молча заменять древнюю сотериологически напряжённую формулу позднейшим объяснением.
  - marker: j
    text: 'Возможно и чтение: «и узнаешь, Кто добрый Воздаятель награды».'
    reason: Греческая идиома о воздаятеле допускает несколько естественных русских передач.
  - marker: k
    text: «Злой» может обозначать как дьявола лично, так и зло; написание с прописной буквы отражает вероятный личный смысл, не устраняя полностью двусмысленность.
    reason: Сохраняется возможная богословская и грамматическая неоднозначность.
lexical_decisions:
- source_word: ὁδὸς τοῦ φωτός (reconstructed from the Greek tradition)
  choice: путь света
  rationale: Сохраняет ключевой образ двух путей и традиционную библейскую лексику без архаизации.
- source_word: ἁπλοῦς τῇ καρδίᾳ / rich in spirit (witness wording)
  choice: прост сердцем и богат духом
  rationale: Сохраняет параллелизм и положительный смысл цельности, не подменяя «прост» словами «наивен» или «простодушен».
- source_word: παιδοφθορήσεις / corrupt boys
  choice: не растлевай мальчиков
  rationale: Передаёт конкретный объект запрета и сексуально-нравственный смысл, не сужая его до одного современного юридического термина.
- source_word: μετεωρισμός / the lofty (probable textual background uncertain)
  choice: знатным
  rationale: В контексте противопоставления смиренным и праведным речь, вероятно, о людях высокого положения; решение отмечено как не вполне уверенное.
- source_word: δίγνωμος / double-minded
  choice: двоедушен
  rationale: Кратко передаёт внутреннюю раздвоенность и сохраняет параллель с «двуязычен».
- source_word: τύπος θεοῦ / type of God
  choice: образу Бога
  rationale: «Образ» понятнее современному читателю, чем техническое «прообраз», и не усиливает онтологический смысл.
- source_word: πονηρός / Evil One
  choice: Злого
  rationale: Сохраняет возможность личного обозначения противника, отражённую определённой формой и прописной буквой в свидетельстве.
theological_decisions:
- issue: Божье провидение в словах о происходящих событиях
  choice: «ничто не бывает без Бога»
  alternative: «ничто не происходит без Божьей воли»
  rationale: Не добавляет более сильного утверждения о непосредственном волении каждого события и сохраняет напряжение исходной формулы.
- issue: Служение господам «как образу Бога»
  choice: Сохранено сравнение без пояснительного смягчения
  alternative: «как поставленным Богом»
  rationale: Альтернатива истолковывает образ и могла бы придать тексту более разработанное учение о власти, которого формула сама по себе не выражает.
- issue: Искупление грехов трудом рук
  choice: Сохранена древняя формулировка с примечанием
  alternative: «чтобы помогать нуждающимся»
  rationale: Нельзя молча устранять историко-богословское напряжение текста; примечание указывает вероятный милостынный контекст, не переписывая фразу.
- issue: «Кого приготовил Дух»
  choice: Сохранён Дух как деятель приготовления
  alternative: «кто приготовил себя для Духа»
  rationale: Следует представленному свидетельству и не переносит действие с Духа на человека.
- issue: Запрет аборта и убийства новорождённого
  choice: «Не умерщвляй ребёнка во чреве и не убивай его после рождения»
  alternative: «Не делай аборта и не совершай детоубийства»
  rationale: Передаёт древнюю конкретную антитезу естественным русским языком, не превращая её в современную терминологическую формулу.
translation_notes:
  register: 'Современный литературный русский язык с достоинством раннехристианского наставления. Единственное число повелений сохранено, поскольку глава обращается к отдельному слушателю; формы на «ты» выражены глаголами без частого местоимения. Архаические «да не», «ибо», «зеница ока» употреблены выборочно там, где они поддерживают афористичность и остаются понятными. Драфт остаётся предварительным: в метаданных прямо указано, что непосредственная сверка греческого и латинского источников ещё не проведена; поэтому спорные места не представлены с ложной уверенностью.'
