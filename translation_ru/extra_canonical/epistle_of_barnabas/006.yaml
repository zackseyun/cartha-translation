  footnotes:
  - marker: a
    text: В доступном английском свидетельстве стоит необычное чтение «в источниках Сиона»; оно сохранено без исправления на более знакомую библейскую формулу.
    reason: Текстологическая прозрачность при отсутствии завершённой сверки с греческими и латинскими свидетелями.
  - marker: b
    text: Буквально — «я, отброс вашей любви»; это резкое выражение самоуничижения и расположения автора к адресатам.
    reason: Пояснение необычной идиомы.
  - marker: c
    text: Выражение «страдающая земля» необычно и допускает неясность; оно сохранено по доступному свидетельству, не будучи заменено толкованием.
    reason: Сохранение подлинной трудности текста.
  - marker: d
    text: Слово «ныне» отмечено скобками уже в доступном исходном свидетельстве и может отражать текстуальное или редакционное уточнение.
    reason: Сохранение явного текстового сигнала источника.
lexical_decisions:
- source_word: servant of the Lord
  choice: слуга Господа
  rationale: Сохранено общее значение служителя без преждевременного отождествления с конкретной мессианской фигурой.
- source_word: offscouring
  choice: сор
  rationale: Передаёт намеренно самоуничижительный и резкий образ, оставаясь понятным современному читателю.
- source_word: earth suffering
  choice: страдающая земля
  rationale: Сохранена необычная и трудная формулировка свидетельства, поскольку гармонизация устранила бы подлинную неоднозначность.
- source_word: new type
  choice: новый образ
  rationale: «Образ» естественнее по-русски и сохраняет связь с последующим языком нового творения, не вводя специальной конфессиональной терминологии.
- source_word: be lords / rule
  choice: владычествовать
  rationale: Последовательно передаёт идею данной власти и господства, на которой строится заключительный аргумент.
- source_word: fleshly hearts
  choice: сердца плотяные
  rationale: Сохранён контраст с каменными сердцами и игра с явлением «во плоти»; «плотяные» здесь означает живые, из плоти, а не нравственно греховные.
theological_decisions:
- issue: Местоимения в цитатах и их христологическое применение
  choice: Сохранены заглавные местоимения там, где автор применяет высказывание к Господу/Иисусу
  alternative: Оформить все местоимения со строчной буквы как в древних рукописях
  rationale: Заглавные буквы помогают русскому читателю проследить авторскую аргументацию, но перевод не расширяет отождествления сверх явно данного контекста.
- issue: Надежда, возложенная на камень
  choice: Сохранён риторический вопрос и немедленное отрицание буквального понимания
  alternative: Истолковать камень прямо как символ Христа внутри самой цитаты
  rationale: Автор сам объясняет образ через явление Господа во плоти; перевод не должен заранее снимать эту ступенчатую аргументацию.
- issue: Новое творение и слова к Сыну
  choice: 'Передано как собственное толкование автора: «Эти слова относятся к Сыну»'
  alternative: Встроить Сына непосредственно в ветхозаветную цитату
  rationale: Так разграничиваются цитируемый текст и его христологическое прочтение автором послания.
- issue: Будущее владычество
  choice: Сохранена эсхатологическая направленность без уточнения её системы
  alternative: Назвать конкретное тысячелетнее царство или духовное владычество
  rationale: Текст говорит лишь о будущем совершенстве и наследовании завета; более точная схема была бы привнесённой доктриной.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Архаические формы устранены, но повторяющиеся формулы «что говорит?» и цепочки цитат сохранены как часть риторики. Термины «плоть», «завет», «краеугольный», «владычествовать» удержаны там, где они несут смысловую нагрузку. Поскольку прямая сверка с древнеязычными свидетелями ещё не завершена, спорные чтения не гармонизированы и отмечены сносками.
