  yaml_path: translation/extra_canonical/epistle_of_barnabas/012.yaml
  text: 'In the same way again he defines concerning the cross in another prophet, who says, “And when will these things be accomplished?” says the Lord. “Whenever a tree is bent and stands upright, and whenever blood drips from a tree.” Again you are taught concerning the cross and him who was to be crucified.


    And again he says in Moses, when war was waged against Israel by people of another nation, and so that he might remind them, when war was waged against them, that because of their sins they had been delivered unto death: the Spirit says to the heart of Moses that he should make a type of the cross and of him who was to suffer, for unless, he says, they set their hope on him, war will be waged against them forever. Therefore Moses piles arms one upon another in the midst of the encounter, and, standing on higher ground than anyone else, stretches out his hands; and so Israel again is victorious. But whenever he lowers them, they are slain with the sword.


    Why was this? That they might learn that they cannot be saved unless they set their hope on him.


    And again, in another prophet, he says, “The whole day long I have stretched out my hands to a disobedient people who gainsaid my righteous way.”


    Again Moses makes a type of Jesus: how he must suffer, and how he himself, whom they will think to have destroyed, shall make alive in an emblem when Israel was falling. For the Lord caused all kinds of serpents to bite them, and they died—for the transgression was wrought in Eve through the serpent—so that he might convince them that, because of their transgression, they would be delivered over to the affliction of death.


    Furthermore, though Moses gave the command, “You shall not have a molten or carved image for your God,” he himself made one, that he might show them a type of Jesus. So Moses makes a bronze serpent, sets it up conspicuously, and summons the people by proclamation.


    When they had assembled together, they entreated Moses that he should offer intercession for them, so that they might be healed. And Moses said to them, “Whenever one of you is bitten, let him come to the serpent placed on the tree, and let him believe and hope that the serpent, being itself dead, can make alive; and immediately he shall be saved.” And so they did. Here again, in these things also, you have the glory of Jesus: in him and unto him are all things.


    What again does Moses say to Jesus—Joshua—the son of Nun, when he gives him this name, as being a prophet, so that all the people might give ear to him alone, because the Father reveals all things concerning his Son Jesus?


    Therefore Moses says to Jesus the son of Nun, giving him this name, when he sent him as a spy into the land, “Take a book in your hands, and write what the Lord says: how the Son of God shall cut up by the roots all the house of Amalek in the last days.”


    Behold, again it is Jesus—not a son of man, but the Son of God—and he was revealed in the flesh in a figure. Since people will say that Christ is the son of David, David himself prophesies, being afraid and understanding the error of sinners: “The Lord said to my Lord, ‘Sit at my right hand until I set your enemies as a footstool under your feet.’”


    And again Isaiah says, “The Lord said unto my Christ the Lord, of whose right hand I laid hold, that the nations should give ear before him, and I will break down the strength of kings.” See how David calls him Lord and does not call him Son.'
translation:
  language: ru
  text: 'Подобным образом Он вновь определяет смысл креста через другого пророка, который говорит: «И когда это исполнится? — говорит Господь. — Когда дерево будет согнуто, а затем выпрямится, и когда с дерева закапает кровь».[a] Так ты вновь получаешь наставление о кресте и о Том, Кому предстояло быть распятым.


    И ещё Он говорит через Моисея. Когда иноплеменники воевали против Израиля, Бог хотел напомнить израильтянам, что из-за своих грехов они были преданы смерти. Поэтому Дух внушил сердцу Моисея изобразить прообраз креста и Того, Кому предстояло пострадать: ведь если они не возложат надежду на Него, говорит Он, против них будут воевать вечно. И вот, в разгар сражения Моисей сложил оружие одно на другое[b] и, встав на возвышении выше всех, простёр руки. Тогда Израиль снова одерживал верх; но всякий раз, когда он опускал их, израильтян поражали мечом.


    Для чего это было? Чтобы они поняли: им невозможно спастись, если они не возложат надежду на Него.


    И ещё Он говорит через другого пророка: «Весь день Я простирал руки к народу непокорному, противящемуся Моему праведному пути».[c]


    И вновь Моисей создаёт прообраз Иисуса: Ему надлежало пострадать, и Тот Самый, Кого они сочтут уничтоженным, оживит их. Этот образ был дан, когда Израиль погибал. Господь послал на них всевозможных змей, которые жалили их, и они умирали, — ведь через змея было совершено преступление Евы. Так Он хотел удостоверить их в том, что за своё преступление они будут преданы смертной муке.


    Более того, хотя Моисей дал заповедь: «Не делайте себе литого или резного изображения как своего бога»,[d] он сам сделал такое изображение, чтобы показать им прообраз Иисуса. Моисей сделал медного змея, выставил его на виду и через глашатая созвал народ.


    Когда все собрались, они стали просить Моисея помолиться за них, чтобы они исцелились. Моисей сказал им: «Если кого-нибудь из вас ужалят, пусть он подойдёт к змею, помещённому на древе, и с верой возложит надежду на то, что змей, сам будучи мёртвым, может оживить; и тотчас он будет спасён».[e] Так они и поступали. Здесь ты вновь видишь славу Иисуса: всё существует в Нём и для Него.[f]


    И что ещё говорит Моисей Иисусу — Иисусу Навину, сыну Нуна, — когда даёт ему это имя[g] как пророку, чтобы весь народ слушал только его, поскольку Отец открывает всё о Своём Сыне Иисусе?


    Итак, Моисей, дав Иисусу, сыну Нуна, это имя, говорит ему, посылая его разведать землю: «Возьми книгу и запиши в ней слова Господа о том, как в последние дни Сын Божий искоренит весь дом Амалика».[h]


    Вот опять Иисус — не сын человеческий, а Сын Божий, явленный во плоти в прообразе. Поскольку люди будут говорить, что Христос — сын Давида, сам Давид пророчествует, страшась и понимая заблуждение грешников: «Сказал Господь Господу моему: “Сиди по правую руку от Меня, пока Я не положу врагов Твоих под ноги Твои”».[i]


    И ещё Исаия говорит так: «Господь сказал моему Христу, Господу, Которого Я взял за правую руку, чтобы народы повиновались Ему; и Я сокрушу силу царей».[j] Видишь, как Давид называет Его Господом, а не сыном.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Источник этой цитаты достоверно не установлен; её необычная формулировка сохранена по древнему свидетельству.
    reason: Предупреждает читателя, что это не легко идентифицируемая каноническая цитата, не исправляя её по догадке.
  - marker: b
    text: 'Буквально по представленному свидетельству: «сложил оружие одно на другое». В других реконструкциях текста речь может идти о том, что Моисей встал на сложенное оружие; прямой разбор греческих и латинских свидетелей необходим.'
    reason: Фраза текстуально и предметно неясна; сноска сохраняет неуверенность.
  - marker: c
    text: Ср. Ис. 65:2. Здесь цитата приведена в форме, связывающей простёртые руки с крестом.
    reason: Указывает аллюзию и объясняет её функцию без гармонизации.
  - marker: d
    text: Ср. Исх. 20:4; Втор. 5:8. Формулировка автора отличается от привычного текста заповеди.
    reason: Идентифицирует библейский фон и сохраняет вариант цитирования.
  - marker: e
    text: Ср. Чис. 21:6–9. Слова о мёртвом змее, способном оживить, представляют собой авторское типологическое изложение, а не дословную цитату из книги Чисел.
    reason: Различает библейское повествование и его интерпретацию в послании.
  - marker: f
    text: Формулировка «в Нём и для Него всё» сохранена без сведения к одному значению.
    reason: Отмечает богословски значимую и необычную конструкцию.
  - marker: g
    text: В греческом языке имена Иисус и Иисус Навин имеют одну форму — Ἰησοῦς. Аргумент автора основан на этом совпадении.
    reason: Без данного пояснения русскоязычному читателю непонятна логика следующего рассуждения.
  - marker: h
    text: Ср. Исх. 17:14. В книге Исход повеление записать относится к истреблению памяти об Амалике; слова о Сыне Божьем и последних днях выражают толкование автора.
    reason: Необходимо отличить цитату от включённой в неё христологической интерпретации.
  - marker: i
    text: Пс. 109:1 по нумерации Септуагинты; Пс. 110:1 в иной распространённой нумерации.
    reason: Помогает найти цитату при разных системах нумерации псалмов.
  - marker: j
    text: Ср. Ис. 45:1. В известном тексте Исаии эти слова обращены к Киру; автор приводит их в христологической форме, включая наименование «Господь».
    reason: Сохраняет вариант послания и одновременно показывает отличие от контекста Исаии.
lexical_decisions:
- source_word: τύπος / typus (предполагаемая лексема по свидетельству)
  choice: прообраз
  rationale: 'Передаёт раннехристианское типологическое значение: событие или предмет заранее изображает Христа, не сводясь к простому «символу».'
- source_word: ξύλον (вероятное чтение в цитатах)
  choice: дерево / древо
  rationale: В повествовании употреблено обычное «дерево», а в сакрально-типологическом контексте — «древо»; сохранена связь дерева, креста и шеста без искусственного сведения всех случаев к слову «крест».
- source_word: Ἰησοῦς
  choice: Иисус; Иисус Навин при уточнении личности
  rationale: Один и тот же греческий антропоним обозначает Иисуса Христа и Иисуса Навина; авторский довод зависит от совпадения имени, поэтому оно сохранено, а традиционное уточнение «Навин» добавлено для ясности.
- source_word: ἐλπίζειν (предполагаемая лексема)
  choice: возложить надежду
  rationale: Сохраняет смысл упования на личность, а не только интеллектуального согласия.
- source_word: ἀναζωοποιεῖν / ζωοποιεῖν (по смыслу свидетельства)
  choice: оживить
  rationale: Не уточняет, идёт ли речь об исцелении, возвращении к жизни или богословском животворении; напряжение исходной формулировки сохранено.
- source_word: Χριστός
  choice: Христос
  rationale: В цитате из Исаии сохранено титульное значение «Помазанник», выраженное привычным русским библейским термином.
theological_decisions:
- issue: Христологическое прочтение ветхозаветных эпизодов
  choice: Сохранить утверждения автора как прямую типологическую аргументацию
  alternative: Смягчить формулами «по мнению автора» или заменить прообраз символом
  rationale: Текст сам утверждает, что крест, змей и Иисус Навин служат прообразами Иисуса; перевод не должен ни дистанцироваться от этого, ни усиливать выводы.
- issue: «В Нём и для Него всё»
  choice: 'Сохранить обе направленности: «в Нём и для Него»'
  alternative: «Всё принадлежит Ему» или «всё — о Нём»
  rationale: Более гладкие варианты устраняют необычную и богословски насыщенную двойную конструкцию свидетельства.
- issue: «Не сын человеческий, а Сын Божий»
  choice: 'Передать буквально с различием регистра: «сын человеческий» / «Сын Божий»'
  alternative: Отождествить первое выражение с титулом «Сын Человеческий»
  rationale: Здесь, вероятно, противопоставляется человеческое происхождение божественному сыновству, однако текст допускает слышимое совпадение с титулом; строчная буква не навязывает титульное толкование.
- issue: Давид «страшится» заблуждения грешников
  choice: Сохранить необычное «страшась и понимая»
  alternative: Упростить до «предвидя заблуждение»
  rationale: Необычная психологическая характеристика присутствует в данном свидетельстве и не должна быть бесследно гармонизирована.
- issue: Мёртвый змей «может оживить»
  choice: Сохранить парадоксальную причинную формулировку
  alternative: Объяснить, что исцеляет Бог через взгляд на изображение
  rationale: Автор намеренно строит христологический образ на парадоксе мёртвого изображения, дающего жизнь; конфессиональное разъяснение изменило бы аргумент.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского поучения. Архаические формы устранены, но риторические вопросы, повтор «и ещё / вновь», типологическая терминология и резкость богословских утверждений сохранены. Местоимения, относящиеся к Богу и Иисусу, даны с прописной буквы по принятой русской религиозно-издательской норме; местоимения о народе и библейских персонажах — со строчной. Проект остаётся предварительным, поскольку предоставленная основа — английское публично-доменное свидетельство, а непосредственная сверка греческих и латинских чтений ещё требуется.
