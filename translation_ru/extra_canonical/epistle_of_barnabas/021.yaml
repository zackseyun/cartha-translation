base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/021.yaml
  text: 'Therefore, it is good to learn the ordinances of the Lord, as many as have been written above, and to walk in them. For whoever does these things will be glorified in the kingdom of God, but whoever chooses their opposites will perish together with their works. This is why there is the resurrection; this is why there is the recompense.


    I urge those of you who are in a higher position: if you are willing to receive any good advice from me, keep among you those to whom you can do good. Do not fail.


    The day is near when everything will be destroyed together with the Evil One. The Lord is near, and his reward.


    Again and again I urge you: be good lawgivers for one another; remain faithful counselors to yourselves; remove all hypocrisy from among you.


    And may God, who is Lord of the whole world, give you wisdom, judgment, learning, knowledge of his ordinances, and patience.


    Be taught by God, diligently seeking what the Lord requires of you, and act so that you may be found on the day of judgment.


    But if you have any remembrance of what is good, remember me when you practice these things, these things, so that both my desire and my watchfulness may lead to some good result. I urge you, asking this as a favor.


    As long as the good vessel (of the body) is with you, do not lack any of these things, but search them out constantly and fulfill every commandment, for they deserve it.


    For this reason I was all the more eager to write to you as far as I was able, so that I might give you joy. Farewell, children of love and peace. May the Lord of glory and of every grace be with your spirit.'
translation:
  language: ru
  text: 'Итак, хорошо узнать установления Господа — всё, что написано выше, — и жить согласно им. Ведь тот, кто поступает так, будет прославлен в Царстве Божьем, а тот, кто избирает противоположное, погибнет вместе со своими делами. Для этого — воскресение, для этого — воздаяние.



    Прошу тех из вас, кто занимает более высокое положение: если вы готовы принять от меня какой-либо добрый совет, пусть среди вас будут те, кому вы делаете добро. Не упускайте этого.



    Близок день, когда всё погибнет вместе со Злым. Близок Господь, и награда Его.



    Снова и снова прошу вас: будьте добрыми законодателями для самих себя, оставайтесь верными советниками самим себе, удалите из своей среды всякое лицемерие.



    И пусть Бог, Владыка всего мира, даст вам мудрость, разумение, наставление, знание Его установлений и терпение.



    Будьте научены Богом, усердно ища, чего Господь требует от вас, и поступайте так, чтобы вы были найдены в день суда.



    Если же вы помните что-либо доброе, вспоминайте обо мне, когда будете исполнять это, чтобы и моё желание, и моё бодрствование привели к какому-нибудь доброму результату. Прошу вас об этом как о милости.



    Пока прекрасный сосуд[a] ещё с вами, не оставайтесь без ничего из этого, но постоянно ищите этого и исполняйте каждую заповедь, ведь они того достойны.



    Поэтому я тем усерднее старался написать вам, насколько был способен, чтобы доставить вам радость. Будьте здравы, дети любви и мира. Господь славы и всякой благодати да будет с вашим духом.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Прекрасный сосуд» — вероятно, образ тела; слово «тело» в самом выражении отсутствует.
    reason: Сноска поясняет вероятный смысл метафоры, не вводя толкование в основной текст и не утверждая его как несомненное.
lexical_decisions:
- source_word: δικαιώματα
  choice: установления
  rationale: Передаёт предписания или установленные требования Господа, не сужая значение до гражданских «законов» или исключительно судебных «постановлений».
- source_word: περιπατεῖν
  choice: жить согласно им
  rationale: Естественно передаёт этическую метафору «ходить в них» на современном русском языке.
- source_word: ὁ πονηρός / τῷ πονηρῷ
  choice: Злой / вместе со Злым
  rationale: Субстантивированное выражение, вероятно обозначающее личного противника; форма «Злой» сохраняет связь с греческим определением и не подменяет её именем «дьявол».
- source_word: νομοθέται
  choice: законодателями
  rationale: Сохраняет сильную и необычную метафору исходного текста.
- source_word: θεοδίδακτοι
  choice: учитесь у Бога
  rationale: Естественный русский эквивалент буквального «будьте научены Богом», сохраняющий Бога как источник наставления.
- source_word: τὸ καλὸν σκεῦος
  choice: прекрасный сосуд
  rationale: Сохраняет образ и оценочное слово καλόν, не вводя в основной текст отсутствующее в греческой формулировке пояснение «тело».
- source_word: σώζεσθε
  choice: будьте здравы
  rationale: В заключительной формуле может означать прощальное пожелание благополучия; перевод не сводит многозначное слово исключительно к формуле «спасайтесь».
theological_decisions:
- issue: Связь воскресения и воздаяния
  choice: «Для этого — воскресение, для этого — воздаяние»
  alternative: «Вот почему существует воскресение; вот почему существует воздаяние»
  rationale: Краткая эллиптическая конструкция сохраняет риторическую сжатость и не уточняет сверх источника, к чему именно относится «для этого».
- issue: Кому адресованы образы законодателя и советника
  choice: «сами для себя… сами себе»
  alternative: «друг для друга»
  rationale: Греческое ἑαυτῶν указывает на рефлексивное значение; поэтому исправлено смысловое отклонение английского консультационного слоя «one another».
- issue: «Чтобы вы были найдены» в день суда
  choice: оставлена открытая формулировка без дополнения
  alternative: «чтобы в день суда вы были найдены достойными»
  rationale: В доступной греческой формулировке нет прилагательного «достойными»; добавление разрешило бы намеренную или текстуально обусловленную недосказанность.
- issue: Образ прекрасного сосуда
  choice: в основном тексте не отождествлён прямо с телом
  alternative: «прекрасный сосуд тела»
  rationale: Контекст допускает понимание сосуда как тела или земной жизни, но само слово «тело» в греческом выражении отсутствует.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского увещания. Сохранены повторные просьбы, эсхатологическая напряжённость и необычные метафоры. Повтор «these things, these things» из английского свидетеля не воспроизведён как вероятная механическая ошибка, поскольку доступная греческая формулировка содержит однократное ταῦτα. Перевод опирается на доступные чтения греческой традиции при сверке с предоставленным публичным английским свидетелем.
