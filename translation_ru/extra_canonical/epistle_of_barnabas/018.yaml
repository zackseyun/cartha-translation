base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/018.yaml
  text: 'But let us move on to another lesson and teaching. There are two ways of teaching and power: one of light and the other of darkness. There is a great difference between the two ways. For on one are stationed God’s light-giving angels, and on the other, Satan’s angels.


    The one is the Lord from all eternity and to all eternity, while the other is Lord of the present season of iniquity.'
translation:
  language: ru
  text: 'Но перейдём к другому наставлению и учению. Есть два пути учения и силы: один — света, другой — тьмы; и между этими двумя путями великая разница. Ибо на одном поставлены светоносные ангелы Бога, а на другом — ангелы сатаны.


    Один есть Господь от вечности и до вечности, другой же — господин нынешнего времени беззакония.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Перевод предварительный: выполнен по предоставленному древнему английскому свидетельству; непосредственная сверка с греческими и латинскими рукописными свидетелями ещё требуется.'
    reason: В исходных данных прямо указано, что проверка по древним языкам пока не проведена; примечание честно обозначает ограниченность текстовой основы.
lexical_decisions:
- source_word: lesson and teaching
  choice: наставлению и учению
  rationale: Сохранена парная формула английского свидетеля без искусственного сведения двух понятий к одному.
- source_word: two ways of teaching and of power
  choice: два пути учения и силы
  rationale: 'Формулировка сохраняет синтаксическую неоднозначность: «учение и сила» могут характеризовать оба пути, а не только слово «пути».'
- source_word: light giving angels
  choice: светоносные ангелы
  rationale: Естественное и возвышенное русское соответствие, передающее ангелов как несущих или дарующих свет.
- source_word: Lord / lord
  choice: Господь / господин
  rationale: Различие регистра и прописной буквы передаёт противопоставление вечного Господа и ограниченного властителя нынешнего времени, не уравнивая их достоинство.
- source_word: season of iniquity that now is
  choice: нынешнего времени беззакония
  rationale: «Время» понятно современному читателю и сохраняет временную ограниченность власти второго персонажа.
theological_decisions:
- issue: К кому относятся «один» и «другой» в заключительном предложении
  choice: Сохранены местоименные обозначения без добавления имён
  alternative: Явно назвать Бога и сатану
  rationale: Свидетель оставляет референты подразумеваемыми; экспликация могла бы устранить подлинную риторическую сжатость и внести толкование.
- issue: Титул второго властителя
  choice: «господин» со строчной буквы
  alternative: «Господь» либо «владыка»
  rationale: Так сохраняется словесная параллель при ясном различии между вечным Господом и временно действующим властителем беззакония.
- issue: Характер власти сатаны
  choice: Передана как ограниченная нынешним временем беззакония
  alternative: Уточнить, что власть лишь мнимая или дозволенная
  rationale: Такие уточнения богословски возможны, но отсутствуют в предоставленном текстовом свидетельстве.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным, раннехристианским звучанием. Сохранены параллелизм, контраст света и тьмы и различие между вечным Господом и временным господином беззакония; архаизмы сведены к минимуму.
