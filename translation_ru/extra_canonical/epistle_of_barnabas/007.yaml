    Что же Он говорит у пророка? «Пусть едят от козла, приносимого во время поста за все их грехи». Вслушайтесь внимательно: «Пусть одни лишь священники едят все внутренности — немытыми, с уксусом».[a]


    Почему? «Поскольку вы дадите Мне, готовящемуся принести Свою плоть за грехи Моего нового народа, пить желчь с уксусом, ешьте вы одни, пока народ постится и скорбит во вретище и пепле». Так Он показал, что должен пострадать от их рук.


    Обратите внимание на данные Им повеления: «Возьмите двух козлов, красивых и похожих друг на друга, и принесите их. Пусть священник возьмёт одного во всесожжение за грехи».


    А что надлежит сделать с другим? «Этот проклят», — говорит Он. Смотрите, как открывается образ Иисуса.


    «Плюйте на него все и колите его; обвяжите его голову багряной шерстью, а затем изгоните его в пустыню». Когда это исполнено, тот, кто уводит козла в пустыню, ведёт его туда, снимает шерсть и кладёт её на ветвь растения, называемого Рахия,[b] — того самого, чьи побеги мы обычно едим, когда находим их в поле. Только у этого колючего растения плод столь сладок.


    Что же это значит? Обратите внимание: один — у жертвенника, а другой — проклят; к тому же проклятый увенчан. Ибо в тот день они увидят Его в длинном багряном одеянии на Его теле и скажут: «Не Тот ли это, Кого мы некогда распяли, унизили и оплевали? Воистину, это Тот, Кто тогда говорил, что Он — Сын Божий».


    Но чем Он подобен козлу? Потому и сказано, что козлы должны быть красивыми и похожими друг на друга: увидев Его грядущим тогда, они поразятся Его сходству с козлом. Итак, вот образ Иисуса, Которому предстояло пострадать.


    Но что означает шерсть, положенная среди колючек? Это образ Иисуса, явленный Церкви: ведь желавший снять багряную шерсть должен был многое претерпеть из-за страшных колючек и через страдание одолеть их. Так Он говорит: «Желающие увидеть Меня и достичь Моего Царства должны ухватиться за Меня через скорбь и страдание».'
