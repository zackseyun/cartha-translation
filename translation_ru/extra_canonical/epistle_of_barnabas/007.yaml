base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/007.yaml
  text: 'Understand, therefore, children of gladness, that the good Lord revealed everything to us beforehand, so that we might know to whom we ought to give thanks and praise in all things.


    If, then, the Son of God, who is Lord and future Judge of the living and the dead, suffered so that his wound might give us life, let us believe that the Son of God could not have suffered except for our sake.


    Moreover, when he was crucified, he was given vinegar and gall to drink. Hear how the priests of the temple revealed this matter. Scripture contains a commandment: “Whoever does not observe the fast shall surely die.” Because the Lord was about to offer the vessel of his Spirit in his own person as a sacrifice for our sins, he commanded that the symbol given in Isaac, who was offered on the altar, should also be fulfilled.


    What, then, does he say in the prophet? “Let them eat from the goat that is offered during the fast for all their sins.” Pay careful attention: “Let the priests alone eat all the entrails, unwashed, with vinegar.”


    Why? “Since you are going to give me—who am about to offer my flesh for the sins of my new people—gall with vinegar to drink, you alone must eat, while the people fast and mourn in sackcloth and ashes.” This was to show that he must suffer at their hands.


    Pay attention to the commands he gave: “Take two goats, fair and alike, and offer them. Let the priest take one as a whole burnt offering for sins.”


    But what must they do with the other one? “The one is accursed,” he says. Notice how the symbol of Jesus is revealed.


    “All of you must spit on it and goad it, place scarlet wool around its head, and then let it be cast into the wilderness.” When this has been done, the one who takes the goat into the wilderness leads it away, removes the wool, and puts it on the branch called Rachia, the same plant whose shoots we are accustomed to eat when we find them in the countryside. The fruit of this briar alone is so sweet.


    What, then, does this mean? Pay attention. The one is at the altar, and the other is accursed. Moreover, the accursed one is crowned. For they will see him on that day wearing the long scarlet robe around his flesh, and they will say, “Is this not the one whom we once crucified, treated with contempt, and spat on? Truly, this was the one who then said that he was the Son of God.”


    For how is he like the goat? For this reason it says that the goats must be fair and alike, so that when they see him coming at that time, they may be astonished at his likeness to the goat. See, therefore, the symbol of Jesus who was to suffer.


    But what does it mean that they place the wool among the thorns? It is a symbol of Jesus set forth for the church, since whoever wished to remove the scarlet wool had to suffer many things because of the thorn’s terrible nature and, through affliction, gain mastery over it. Thus he says, “Those who desire to see me and to attain my kingdom must take hold of me through tribulation and affliction.”'
translation:
  language: ru
  text: 'Поймите же, дети радости, что благой Господь заранее открыл нам всё, чтобы мы знали, Кому должны за всё воздавать благодарение и хвалу.


    Итак, если Сын Божий, Господь и грядущий Судья живых и мёртвых, пострадал, чтобы Его рана даровала нам жизнь, будем верить, что Сын Божий мог пострадать только ради нас.


    Более того, когда Он был распят, Ему дали пить уксус с желчью. Послушайте, как священники храма открыли это. В Писании есть заповедь: «Кто не соблюдёт поста, непременно умрёт».[a] Господь дал это повеление потому, что Сам намеревался принести сосуд Своего Духа в жертву за наши грехи, чтобы исполнился также образ, данный в Исааке, который был принесён на жертвенник.


    Что же Он говорит у пророка? «Пусть едят от козла, приносимого во время поста за все их грехи». Вслушайтесь внимательно: «Пусть одни лишь священники едят все внутренности неомытыми, с уксусом».[a]


    Почему? «Поскольку вы дадите Мне, готовящемуся принести Свою плоть за грехи Моего нового народа, пить желчь с уксусом, ешьте вы одни, пока народ постится и скорбит во вретище и пепле». Так Он показал, что должен пострадать от их рук.


    Обратите внимание на данные Им повеления: «Возьмите двух козлов, красивых и похожих друг на друга, и принесите их. Пусть священник возьмёт одного во всесожжение за грехи».


    А что надлежит сделать с другим? «Этот проклят», — говорит Он. Смотрите, как открывается образ Иисуса.


    «Плюйте на него все и колите его; обвяжите его голову багряной шерстью, а затем изгоните его в пустыню». Когда это исполнено, тот, кто уводит козла в пустыню, снимает шерсть и кладёт её на ветвь растения, называемого Рахия,[b] — того самого, чьи побеги мы обычно едим, когда находим их в поле. Только у этого колючего растения плод столь сладок.


    Что же это значит? Обратите внимание: один — у жертвенника, а другой — проклят; к тому же проклятый увенчан. Ибо в тот день они увидят Его в длинном багряном одеянии, окутывающем Его тело, и скажут: «Не Тот ли это, Кого мы некогда распяли, унизили и оплевали? Воистину, это Тот, Кто тогда говорил, что Он — Сын Божий».


    Но чем Он подобен козлу? Потому и сказано, что козлы должны быть красивыми и похожими друг на друга: увидев Его грядущим в тот день, они поразятся Его сходству с козлом. Итак, вот образ Иисуса, Которому предстояло пострадать.


    Но что означает шерсть, положенная среди колючих ветвей? Это образ Иисуса, явленный Церкви: ведь желавший снять багряную шерсть должен был многое претерпеть из-за страшных колючек и с трудом овладеть ею. Так Он говорит: «Желающие увидеть Меня и достичь Моего Царства должны ухватиться за Меня среди скорби и страдания».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Приведённые здесь предписания о посте, козле, внутренностях и уксусе не являются точной цитатой из сохранившегося текста Ветхого Завета; автор передаёт и истолковывает известную ему обрядовую традицию.
    reason: Предотвращает ошибочное восприятие составной ритуальной формулы как дословной цитаты из канонического текста, не отвергая авторскую атрибуцию Писанию и пророку.
  - marker: b
    text: Рахия — переданное по звучанию название растения; какой именно вид имеется в виду, достоверно не установлено.
    reason: Сохраняет неидентифицированное древнее название и честно обозначает лексическую неопределённость.
lexical_decisions:
- source_word: children of gladness
  choice: дети радости
  rationale: Сохранено образное обращение источника в естественной и понятной русской форме.
- source_word: quick and dead
  choice: живых и мёртвых
  rationale: Современная русская формула точно передаёт противопоставление living/dead без архаизма.
- source_word: vessel of His Spirit
  choice: сосуд Своего Духа
  rationale: Сохранена необычная антропологическая метафора источника без истолковывающей замены словом «тело».
- source_word: type / symbol
  choice: образ
  rationale: «Образ» сохраняет типологический смысл и звучит естественнее для широкого русского читателя, не навязывая узкотехническую терминологию.
- source_word: goad it
  choice: колите его
  rationale: Передаёт физическое причинение боли животному, не уточняя орудие, которого свидетель не называет.
- source_word: scarlet
  choice: багряный
  rationale: Устоявшееся библейское цветообозначение, пригодное и для шерсти, и для одеяния.
- source_word: take hold of me
  choice: ухватиться за Меня
  rationale: Сохранена телесная сила метафоры, связанная с добыванием шерсти из колючек.
theological_decisions:
- issue: Причина страданий Сына Божьего
  choice: «мог пострадать только ради нас»
  alternative: «не мог пострадать иначе как из-за нас»
  rationale: Формулировка сохраняет искупительную направленность и вместе с тем не решает сверх текста вопрос, означает ли выражение цель или причину.
- issue: «Новый народ»
  choice: Сохранено авторское выражение «Моего нового народа»
  alternative: Заменить на «Церкви» или конкретную этнорелигиозную группу
  rationale: Источник сам позднее упоминает Церковь, но здесь употребляет отдельную формулу; их нельзя молча отождествлять или противопоставлять.
- issue: Кто причиняет страдания
  choice: «от их рук» без дополнительного определения
  alternative: Явно назвать иудеев, римлян или храмовых служителей
  rationale: Местоименная неоднозначность источника сохранена; конкретизация могла бы привнести полемическое толкование.
- issue: Типология двух козлов
  choice: Передана как авторское истолкование «образа Иисуса»
  alternative: Представить ритуальные детали как прямое дословное ветхозаветное пророчество
  rationale: Тексту позволено выдвигать собственное типологическое утверждение, но перевод не усиливает его статус сверх формулировки автора.
- issue: Обращение к Иисусу через скорбь
  choice: «ухватиться за Меня среди скорби и страдания»
  alternative: «заслужить Моё Царство страданиями»
  rationale: Сохранена метафора приближения и обретения без внесения учения о заслуживании спасения.
translation_notes:
  register: Современный литературный русский язык с умеренно возвышенным библейским регистром. Архаические синтаксические обороты устранены, но ключевые культовые слова («жертвенник», «всесожжение», «вретище») сохранены ради исторической и образной точности. Заглавные местоимения при обращении ко Христу использованы последовательно как русская издательская конвенция. Черновик основан на предоставленном англоязычном свидетельстве; прямая сверка с греческими и латинскими чтениями ещё требуется.
