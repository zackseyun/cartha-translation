base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/002.yaml
  text: 'Seeing, then, that the days are evil and that the Active One himself has the authority, we ought to pay attention to ourselves and seek out the ordinances of the Lord.


    The aids of our faith are fear and patience, and our allies are long-suffering and self-restraint.


    While these abide in a pure spirit in matters relating to the Lord, wisdom, understanding, science, and knowledge rejoice with them.


    For he has made known to us by all the prophets that he desires neither sacrifices nor whole burnt offerings nor oblations, saying at one time:


    “What is the multitude of your sacrifices to me?” says the Lord. “I am full of whole burnt offerings, and I do not desire the fat of lambs or the blood of bulls and goats—not even if you come to be seen by me. Or who required these things at your hands? You shall no longer continue to tread my court. If you bring fine flour, it is in vain; incense is an abomination to me. Your new moons and your Sabbaths I cannot endure.”


    Therefore, he annulled these things so that the new law of our Lord Jesus Christ, being free from the yoke of constraint, might have an oblation not made by human hands.


    And he says to them again: “Did [I] command your fathers, when they went forth from the land of Egypt, to bring me whole burnt offerings and sacrifices?


    “No. This was my command to them: Let none of you bear an evil grudge against his neighbor in his heart, and do not love a false oath.”


    So, unless we are without understanding, we ought to perceive the mind of the goodness of our Father. For he speaks to us, desiring that we should not go astray like them but should seek how we may approach him.


    Thus he speaks to us: “The sacrifice to God is a broken heart; the smell of a sweet savor to the Lord is a heart that glorifies its Maker.” Therefore, brethren, we ought to learn accurately concerning our salvation, lest the Evil One, having effected an entrance of error in us, should fling us away from our life.'
translation:
  language: ru
  text: 'Поскольку дни злы и сам Действующий[a] обладает властью, нам следует быть внимательными к себе и исследовать установления Господа.


    Опоры нашей веры — страх и терпение, а наши союзники — долготерпение и воздержание.


    Пока они пребывают в чистоте духа в том, что относится к Господу, вместе с ними радуются мудрость, разумение, ведение и знание[b].


    Ведь через всех пророков Он открыл нам, что не желает ни жертв, ни всесожжений, ни приношений. Так, однажды Он сказал:


    «Что Мне множество ваших жертв? — говорит Господь. — Я пресыщен всесожжениями и не желаю ни жира ягнят, ни крови быков и козлов, даже если вы приходите, чтобы предстать предо Мною. Кто потребовал этого от ваших рук? Не продолжайте попирать Мой двор. Если вы приносите лучшую муку — это напрасно; курение отвратительно Мне. Ваших новомесячий и суббот Я не могу терпеть».


    Итак, Он упразднил это, чтобы новый закон Господа нашего Иисуса Христа, свободный от ярма принуждения, имел приношение, совершённое не человеческими руками[c].


    И ещё Он говорит им: «Разве Я повелел вашим отцам, когда они вышли из земли Египетской, приносить Мне всесожжения и жертвы?


    Нет. Вот что Я повелел им: пусть никто из вас не держит в сердце злого умысла против своего ближнего и не любит ложной клятвы».


    Итак, если мы не лишены разумения, нам следует постичь замысел благости нашего Отца[d]. Ведь Он обращается к нам, желая, чтобы мы не заблудились, как они, но искали, как приблизиться к Нему.


    Так Он говорит нам: «Жертва Богу — сокрушённое сердце; благоухание, приятное Господу, — сердце, прославляющее своего Создателя». Поэтому, братья, нам следует в точности узнать всё, что касается нашего спасения, чтобы Злой, открыв в нас вход заблуждению, не отбросил нас прочь от нашей жизни[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Действующий» — необычное обозначение того, кто теперь обладает властью. По контексту речь, вероятно, идёт о действующей злой силе; точное наименование в тексте не дано.
    reason: Сохранить лексическую и богословскую неоднозначность исходного выражения.
  - marker: b
    text: 'В тексте стоят рядом четыре близких понятия: мудрость, разумение, ведение и знание. Их точное разграничение не поясняется.'
    reason: Объяснить намеренное сохранение четырёхчленного ряда и избежать современного узкого понимания «science» как естественной науки.
  - marker: c
    text: 'Буквально: «имело приношение не человеческими руками». Образ противопоставляет новое приношение рукотворным жертвам, не называя здесь единственного конкретного обряда.'
    reason: Сохранить образность и не навязывать сакраментальное либо антисакраментальное толкование.
  - marker: d
    text: 'Возможен также перевод: «понять, что имеет в виду благость нашего Отца».'
    reason: Отметить синтаксическую шероховатость и возможный смысл родительного сочетания.
  - marker: e
    text: «От нашей жизни» может означать как жизнь, которой верующие уже живут, так и жизнь спасения; текст не уточняет.
    reason: Не снимать эсхатологическую и нравственную смысловую напряжённость.
lexical_decisions:
- source_word: 'ὁ ἐνεργῶν (as reflected in the witness: “the Active One”)'
  choice: Действующий
  rationale: Сохранено необычное и потенциально двусмысленное обозначение лица, обладающего властью; контекст допускает отнесение к злой силе, но не требует молча подменять титул словом «Злой».
- source_word: φόβος
  choice: страх
  rationale: Передаёт буквальный образ одной из опор веры и не уточняет его как «благоговение», поскольку такое уточнение сузило бы смысл.
- source_word: μακροθυμία / ἐγκράτεια
  choice: долготерпение / воздержание
  rationale: Сохраняет различие между стойкостью по отношению к испытаниям или людям и самообладанием.
- source_word: σοφία, σύνεσις, ἐπιστήμη, γνῶσις (probable Greek sequence behind the witness)
  choice: мудрость, разумение, ведение и знание
  rationale: Четырёхчленный ряд сохранён без сведения близких понятий к одному; «ведение» позволяет отличить ἐπιστήμη от γνῶσις, не вводя современное узкое значение слова «наука».
- source_word: προσφορά
  choice: приношение
  rationale: Нейтральное культовое слово, не ограничивающее смысл кровной жертвой.
- source_word: ἀχειροποίητος / μη ἀνθρωποποίητος sense reflected by “not made by human hands”
  choice: совершённое не человеческими руками
  rationale: Сохраняет контраст с рукотворным культовым приношением и естественно согласуется с «приношением».
- source_word: ὁ πονηρός (reflected in “the Evil One”)
  choice: Злой
  rationale: Передано как личностное обозначение с прописной буквы, без добавления имени или конфессионального толкования.
theological_decisions:
- issue: Кто назван «Действующим» в начале главы
  choice: Не отождествлять прямо; сохранить «Действующий» и пояснить двусмысленность в сноске.
  alternative: Перевести «лукавый», «злой дух» или «сатана».
  rationale: Грамматика и контекст могут указывать на действующую злую силу, однако необычная формулировка источника заслуживает сохранения, особенно при ожидаемой прямой сверке с греческими и латинскими свидетелями.
- issue: Упразднение ветхозаветных жертв
  choice: 'Передать авторское утверждение прямо: «Он упразднил это», не расширяя его до упразднения всего Закона.'
  alternative: Сформулировать как отмену Моисеева закона вообще либо смягчить до одного лишь осуждения злоупотреблений.
  rationale: Контекст непосредственно перечисляет жертвы, всесожжения и приношения; перевод сохраняет напряжение аргумента, но не распространяет его дальше текста.
- issue: «Новый закон» и его приношение
  choice: Сохранить культовую лексику и образ нерукотворного приношения.
  alternative: Истолковать приношение как Евхаристию, молитву, хвалу или нравственную жизнь.
  rationale: Дальнейшие цитаты связывают его с сокрушённым и прославляющим сердцем, но текст не требует назвать конкретный обряд или дать исчерпывающее догматическое определение.
- issue: «Замысел благости нашего Отца»
  choice: Сохранить сочетание «замысел благости» с пояснительной сноской.
  alternative: Перевести более гладко как «благой замысел нашего Отца» или «что имеет в виду наш благой Отец».
  rationale: Исходное выражение допускает связь мысли/намерения именно с благостью Отца; буквальная напряжённость богословски значима и не должна исчезать без следа.
- issue: «Отбросил нас от нашей жизни»
  choice: Сохранить «наша жизнь» без отождествления с земной или вечной жизнью.
  alternative: Перевести «лишил нас вечной жизни» или «погубил нашу жизнь».
  rationale: Источник оставляет объём понятия открытым; экспликация вечной жизни была бы вероятным, но всё же добавленным толкованием.
translation_notes:
  register: Современный литературный русский язык с достоинством раннехристианского наставления. Архаизмы сведены к минимуму; библейские цитаты сохраняют возвышенный ритм, но не воспроизводят дореформенный или синодальный синтаксис механически. Формы «братья», «установления», «приношение», «всесожжение» выбраны как понятные и устойчивые в религиозно-историческом контексте. Поскольку предоставленный материал прямо отмечает, что сверка с древнегреческими и латинскими свидетелями ещё предстоит, места, зависящие от реконструкции исходной лексики, обозначены осторожно и без ложной уверенности.
