review_pass:
  verdict: revise
  source_fidelity: 'В целом перевод точно передаёт ход аргумента и сохраняет важные неоднозначности: необычное «Действующий», четырёхчленный ряд познавательных качеств, «новый закон» и открытый смысл «нашей жизни». Однако несколько формулировок либо добавляют оттенок, отсутствующий в свидетельстве, либо недостаточно естественны по-русски. В частности, «совершённое не человеческими руками» заменяет признак приношения его способом совершения, а «узнать всё, что касается» добавляет слово «всё».'
  naturalness: 'Регистр в целом удачен: современный литературный, с уместной библейской торжественностью. Нужны точечные правки для более естественного синтаксиса: «в чистоте духа» в данном построении звучит неясно, «злой умысел ... не держит» неточно передаёт нравственный запрет, а «открыв в нас вход заблуждению» тяжеловесно и не по-русски.'
  terminology: '«Страх», «терпение», «долготерпение», «воздержание», «всесожжения», «приношение», «Злой» и «Создатель» выбраны последовательно. «Фимиам» точнее и естественнее для культового контекста, чем «курение». Для ἀχειροποίητος-смысла предпочтительно «нерукотворное приношение»: это прямее сохраняет определение самого приношения и не предрешает его конкретного истолкования.'
  issues:
  - severity: medium
    issue: «Приношение, совершённое не человеческими руками»
    rationale: Фраза может означать, что люди не совершили приношение, тогда как свидетельство характеризует само приношение как «not made by human hands». «Нерукотворное приношение» передаёт этот признак непосредственно.
  - severity: medium
    issue: «Пусть никто ... не держит в сердце злого умысла»
    rationale: «Bear a grudge of evil» говорит о злобе/вражде против ближнего, а не обязательно о намерении совершить зло. «Не питает в сердце злобы против ближнего» точнее и естественнее.
  - severity: low
    issue: «В чистоте духа в том, что относится к Господу»
    rationale: Сочетание синтаксически неясно. Следует явно отнести «чистый дух» к пребыванию перечисленных добродетелей, сохранив оговорку «в том, что относится к Господу».
  - severity: low
    issue: «Узнать всё, что касается нашего спасения»
    rationale: Слово «всё» отсутствует в английском свидетельстве и чрезмерно расширяет объект познания. Достаточно «тщательно узнать о нашем спасении».
  - severity: low
    issue: «Открыв в нас вход заблуждению»
    rationale: Образ входа заблуждения сохранён, но русская конструкция неестественна. «Добившись, чтобы в нас проникло заблуждение» передаёт причинный смысл без доктринального уточнения.
  revised_text: 'Поскольку дни злы и сам Действующий[a] обладает властью, нам следует быть внимательными к себе и исследовать установления Господа.


    Опоры нашей веры — страх и терпение, а наши союзники — долготерпение и воздержание.


    Когда всё это пребывает в чистом духе в том, что относится к Господу, вместе с ними радуются мудрость, разумение, ведение и знание[b].


    Ведь через всех пророков Он открыл нам, что не желает ни жертв, ни всесожжений, ни приношений. Так, однажды Он сказал:


    «Что Мне множество ваших жертв? — говорит Господь. — Я пресыщен всесожжениями и не желаю ни жира ягнят, ни крови быков и козлов, даже если вы приходите, чтобы предстать предо Мною. Кто потребовал этого от ваших рук? Не продолжайте попирать Мой двор. Если вы приносите лучшую муку — это напрасно; фимиам отвратителен Мне. Ваших новомесячий и суббот Я не могу терпеть».


    Итак, Он упразднил это, чтобы новый закон Господа нашего Иисуса Христа, свободный от ярма принуждения, имел нерукотворное приношение[c].


