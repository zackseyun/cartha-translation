review_pass:
  verdict: revise
  source_fidelity: 'В целом перечень пороков передан полно и в исходном порядке. Однако английское «exhalation of power» не следует представлять как определяющее исходное чтение: за ним, по-видимому, стоит греческое ὕψωμα δυνάμεως («возвышение/превозношение силы»). Кроме того, «не трудятся ради изнурённого» звучит как добровольная работа вместо помощи человеку, изнурённому трудом; это нуждается в уточнении.'
  naturalness: Текст в основном литературен и сохраняет нравоучительную торжественность. «Путь Чёрного» и «двоедушие» уместно сохраняют архаически-образный регистр. Формулировка «не помогают тому, кто изнурён трудом» естественнее и яснее, чем «не трудятся ради изнурённого».
  terminology: «Чёрный» сохранён как необычное персонифицированное обозначение без догматического отождествления. «Страх Божий», «идолопоклонство», «прелюбодеяние», «колдовство» и «чародейство» выдержаны последовательно. Для ὕψωμα δυνάμεως сохранено осторожное «превозношение силой», но сноска должна ссылаться на вероятное греческое выражение, а не на странность английского свидетельства.
  issues:
  - severity: medium
    issue: Сноска b опирается на английское «exhalation of power» как на нерешённое основание перевода.
    rationale: Вероятное греческое выражение ὕψωμα δυνάμεως указывает на «возвышение/превозношение силы», поэтому примечание должно пояснять этот образ, а не создавать впечатление, что русский текст следует непонятному английскому «выдыханию силы».
  - severity: medium
    issue: «Не трудятся ради изнурённого» двусмысленно и неточно передаёт отношение к человеку, измученному трудом.
    rationale: В контексте обвинений речь о безучастности к нуждающемуся; «не помогают тому, кто изнурён трудом» выражает это по-русски без изменения смысла.
  - severity: low
    issue: «Не знают награды за праведность» несколько ослабляет образ «не воспринимают/не признают награды праведности».
    rationale: «Не считаются с наградой за праведность» лучше передаёт нравственную невосприимчивость, не предполагая простого незнания.
  revised_text: 'Но путь Чёрного[a] крив и исполнен проклятия. Это путь вечной смерти и наказания; на нём — всё, что губит человеческие души: идолопоклонство, дерзость, превозношение силой[b], лицемерие, двоедушие, прелюбодеяние, убийство, грабёж, гордость, беззаконие, вероломство, злоба, упрямство, колдовство, чародейство, алчность, отсутствие страха Божьего.


    Идущие этим путём преследуют добрых, ненавидят истину, любят ложь, не считаются с наградой за праведность, не держатся ни добра, ни праведного суда, не заботятся о вдове и сироте, бодрствуют не ради страха Божьего, а ради зла. Кротость и терпение далеки от них. Они любят суетное, гонятся за воздаянием[c], не милуют бедного, не помогают тому, кто изнурён трудом, готовы к клевете, не признают Сотворившего их. Они убивают детей, губят Божье творение, отворачиваются от нуждающегося, угнетают страдающего, защищают богатых, несправедливо судят бедных и грешны во всём.'
