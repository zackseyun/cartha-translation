translation:
  language: ru
  text: 'Но путь Чёрного[a] крив и исполнен проклятия. Это путь вечной смерти и наказания; на нём — всё, что губит человеческие души: идолопоклонство, дерзость, превозношение силой[b], лицемерие, двоедушие, прелюбодеяние, убийство, грабёж, гордость, беззаконие, вероломство, злоба, упрямство, колдовство, чародейство, алчность, отсутствие страха Божьего.


    Идущие этим путём преследуют добрых, ненавидят истину, любят ложь, не знают награды за праведность, не держатся добра и праведного суда, не заботятся о вдове и сироте, бодрствуют не ради страха Божьего, а ради зла. Кротость и терпение далеки от них. Они любят суетное, гонятся за воздаянием[c], не милуют бедного, не трудятся ради изнурённого, готовы к клевете, не признают Сотворившего их. Они убивают детей, губят Божье творение, отворачиваются от нуждающегося, угнетают страдающего, защищают богатых, несправедливо судят бедных и грешны во всём.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Чёрный» — буквальное персонифицированное обозначение того, кому принадлежит этот путь; возможный смысл — противник Бога или воплощение тьмы.
    reason: Сохраняет необычный образ и предупреждает против молчаливой замены его традиционным титулом.
  - marker: b
    text: Выражение в доступном английском свидетельстве передано необычно («exhalation of power»); вероятный смысл — высокомерное превозношение своей силой или властью. Требуется сверка с греческими и латинскими свидетелями.
    reason: Исходные данные прямо указывают, что непосредственная проверка древнеязычного текста ещё не завершена.
  - marker: c
    text: 'Или: «добиваются отплаты»; слово может указывать как на корыстное вознаграждение, так и на возмездие.'
    reason: Сохраняет лексическую неоднозначность выражения о воздаянии.
lexical_decisions:
- source_word: the Black One / τοῦ μέλανος
  choice: Чёрного
  rationale: Сохранена персонификация противника и связь с образом двух путей; прилагательное передано как субстантивированное имя с прописной буквы.
- source_word: crooked / σκολιά
  choice: крив
  rationale: Передаёт как нравственную извращённость пути, так и исходный пространственный образ.
- source_word: boldness / θρασύτης
  choice: дерзость
  rationale: В данном перечне пороков речь идёт не о добродетельной смелости, а о наглой самоуверенности.
- source_word: exhalation/exaltation of power
  choice: превозношение силой
  rationale: Английское «exhalation» выглядит как неустойчивое или ошибочное чтение; выбран смысл высокомерного возвышения вследствие силы или власти, однако необычность выражения отмечена сноской.
- source_word: doubleness of heart / διπλοκαρδία
  choice: двоедушие
  rationale: Естественный русский нравственный термин, сохраняющий образ внутренней раздвоенности.
- source_word: wakeful
  choice: бодрствуют
  rationale: Сохранён образ напряжённой бдительности, направленной не к Богу, а ко злу.
- source_word: pursuing a recompense / διώκοντες ἀνταπόδομα
  choice: гонятся за воздаянием
  rationale: 'Сохранена неоднозначность: выражение может обозначать корыстную погоню за отплатой, выгодой или ответным вознаграждением.'
- source_word: corrupters of the creatures/creation of God / φθορεῖς πλάσματος θεοῦ
  choice: губят Божье творение
  rationale: Передаёт широкий смысл разрушения или порчи сотворённого Богом, не сужая его до одной конкретной практики.
theological_decisions:
- issue: Личность «Чёрного»
  choice: Персонифицированное обозначение сохранено без прямого отождествления
  alternative: «лукавого», «дьявола» или «пути тьмы»
  rationale: Текст использует необычный титул; явное отождествление с конкретным существом сняло бы сохраняющуюся в формулировке образную неоднозначность.
- issue: «Не признают Сотворившего их» и последующий перечень
  choice: Фраза завершена точкой, а следующие обвинения оформлены отдельными предложениями
  alternative: 'Читать всё как одну синтаксическую цепь: «не признают Сотворившего их убийцами детей…»'
  rationale: Пунктуация устраняет ложное впечатление, будто Бог сделал их убийцами; при этом сами обвинения и их последовательность сохранены.
- issue: «Вечная смерть с наказанием»
  choice: «путь вечной смерти и наказания»
  alternative: «путь вечной смерти с наказанием»
  rationale: Русская координация звучит естественно и не определяет сверх текста точное соотношение смерти и наказания.
translation_notes:
  register: Современный литературный русский язык с торжественной, но понятной нравоучительной интонацией. Длинный каталог пороков разделён на два абзаца и несколько предложений ради ясности; анафорическое «они» поддерживает ритм. Черновик остаётся предварительным, поскольку предоставленная основа — английское свидетельство, а прямая сверка с греческими и латинскими источниками обозначена как незавершённая.
