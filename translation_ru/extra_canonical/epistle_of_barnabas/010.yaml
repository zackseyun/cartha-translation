    **4** «Не ешь также орла, ястреба, коршуна и ворона». То есть: «Не прилепляйся к таким людям и не уподобляйся тем, кто не умеет добывать себе пищу трудом и потом, но беззаконно присваивает чужое. Делая вид, будто ходят в простоте, они высматривают и выискивают, кого бы ограбить в своей алчности». Ведь только эти птицы не добывают себе пищу, но сидят без дела и высматривают, как бы поживиться чужим мясом; их злодеяния пагубны.


    **5** «Не ешь, — говорит он, — ни мурены, ни осьминога, ни каракатицы». То есть: «Не уподобляйся людям, которые крайне нечестивы и уже осуждены на смерть». Ибо только эти рыбы прокляты и плавают в глубине: они не держатся у поверхности, как остальные, а обитают у дна, под морской пучиной.


    **6** Кроме того: «Не ешь зайца». Почему? «Не становись растлителем мальчиков и не уподобляйся таким людям». Ведь у зайца каждый год появляется в теле новый проход, так что число отверстий соответствует числу прожитых им лет.[b]


    **7** И ещё: «Не ешь гиену». То есть: «Не становись ни прелюбодеем, ни блудником и не уподобляйся таким людям». Почему? Потому что это животное из года в год меняет свой пол, становясь то самцом, то самкой.[c]


