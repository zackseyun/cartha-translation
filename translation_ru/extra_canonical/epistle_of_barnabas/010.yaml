translation:
  language: ru
  text: '**Послание Варнавы, 10**


    **1** Моисей сказал: «Не ешьте свиньи[a], ни орла, ни ястреба, ни ворона, ни какой-либо рыбы, на которой нет чешуи». Он духовно постиг в этом три установления.


    **2** И далее Бог говорит им во Второзаконии: «Я положу Мои установления как завет для этого народа». Итак, Божья заповедь не в том, чтобы они не брали пищу зубами, но Моисей говорил духовно.


    **3** Поэтому о свинье он упомянул с таким смыслом: «Не прилепляйся к людям, подобным свиньям». Ведь, живя в изобилии, они забывают Господа, а терпя нужду, признают Его. Так и свинья, когда ест, не знает своего хозяина, но, проголодавшись, визжит, а получив корм, снова умолкает.


    **4** «Не ешь также орла, ястреба, коршуна и ворона». То есть: «Не прилепляйся к таким людям и не уподобляйся тем, кто не умеет добывать себе пищу трудом и потом, но беззаконно присваивает чужое. Делая вид, будто ходят в простоте, они высматривают и выискивают, кого бы ограбить в своей алчности». Ведь и эти птицы не добывают себе пищу, но сидят без дела и высматривают, как бы поживиться чужим мясом; своими злодеяниями они несут погибель.


    **5** «Не ешь, — говорит он, — ни мурены, ни осьминога, ни каракатицы». То есть: «Не уподобляйся людям, которые до конца погрязли в нечестии и уже осуждены на смерть». Подобно им, лишь эти рыбы прокляты и плавают в глубине: они не держатся у поверхности, как остальные, а обитают у дна, под морской пучиной.


    **6** Кроме того: «Не ешь зайца». Почему? «Не становись растлителем мальчиков и не уподобляйся таким людям». Ведь у зайца, как полагали, каждый год появляется в теле новый проход, так что число отверстий соответствует числу прожитых им лет.[b]


    **7** И ещё: «Не ешь гиену». То есть: «Не становись ни прелюбодеем, ни блудником и не уподобляйся таким людям». Почему? Потому что, как полагали, это животное из года в год меняет свой пол, становясь то самцом, то самкой.[c]


    **8** Также он отверг ласку, и не без причины. «Не становись, — говорит он, — подобным тем людям, о которых мы слышим, что они совершают устами нечистое беззаконие; и не прилепляйся к нечистым женщинам, которые устами совершают беззаконие». Ведь считалось, что это животное зачинает через рот.[d]


    **9** Итак, о пище Моисей получил три установления такого рода и изложил их в духовном смысле; они же из-за плотского желания поняли их так, будто речь шла о еде.


    **10** Давид также познал эти три установления и говорит: «Блажен человек, который не ходил на совет нечестивых» — подобно рыбам, уходящим во мраке в глубину; «и не стоял на пути грешников» — подобно тем, кто притворяется боящимся Господа, но грешит, как свинья; «и не сидел на месте губителей» — подобно птицам, сидящим в ожидании добычи. Теперь вы получили полное наставление о пище.


    **11** Далее Моисей говорит: «Ешьте всё, что имеет раздвоенное копыто и жуёт жвачку». Что он имеет в виду? Получающий пищу знает Того, кто дал её ему, и, насытившись, радуется о Нём. Хорошо сказал Моисей, имея в виду заповедь. Что же это значит? Прилепляйтесь к боящимся Господа — к тем, кто размышляет в сердце над точным смыслом полученного слова; кто возвещает установления Господа и соблюдает их; кто знает, что размышление — радостное дело, и пережёвывает слово Господа. Но почему сказано о раздвоенном копыте? Потому что праведник и ходит в этом мире, и в то же время ожидает грядущего святого мира. Видите, каким мудрым законодателем был Моисей!


    **12** Но как могли они постичь или понять это? Мы же, верно поняв заповеди, излагаем их так, как пожелал Господь. Для того Он и обрезал наши уши и сердца, чтобы мы это понимали.


    [a] В дошедшем английском издании в этом месте стоит очевидная опечатка *seine*; по контексту и древнему тексту речь идёт о свинье.


    [b] Здесь сохранено древнее представление о строении тела зайца; оно не соответствует современным зоологическим знаниям.


    [c] Здесь сохранено распространённое в древности представление о гиене; оно не соответствует современным зоологическим знаниям.


    [d] Здесь сохранено древнее представление о размножении ласки; оно не соответствует современным зоологическим знаниям.'
  philosophy: optimal-equivalence
