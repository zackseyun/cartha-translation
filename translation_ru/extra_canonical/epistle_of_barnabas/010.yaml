lexical_decisions:
- source_word: χοῖρος / swine
  choice: свинья
  rationale: Исправляет очевидную опечатку английского свидетеля «seine» по контексту пищевых запретов и последующему толкованию образа свиньи.
- source_word: σμύραινα / lamprey
  choice: мурена
  rationale: Предполагаемое греческое название точнее соответствует мурене, чем миноге; выбран источник-ориентированный зооним.
- source_word: πολύπους
  choice: осьминог
  rationale: Современное и точное русское название животного, буквально обозначенного греческим словом «многоног».
- source_word: σηπία
  choice: каракатица
  rationale: Устоявшийся русский эквивалент древнегреческого названия.
- source_word: δόγματα / ordinances, decrees
  choice: установления
  rationale: Передаёт нормативный характер высказываний, не придавая им позднейшего конфессионального смысла слова «догматы».
- source_word: κολλᾶσθαι / cleave
  choice: прилепляться
  rationale: Сохраняет библейскую образность прочной нравственной связи и при этом остаётся понятным в современном русском.
- source_word: παιδοφθόρος / corrupter of boys
  choice: растлитель мальчиков
  rationale: Прямо и сдержанно передаёт осуждаемую автором сексуальную эксплуатацию несовершеннолетних, без смягчения смысла.
- source_word: ἀκριβολογία / distinction of the word
  choice: точный смысл слова
  rationale: Передаёт идею внимательного, точного постижения принятого слова естественным русским выражением.
- source_word: μηρυκᾶσθαι / chew the cud
  choice: жевать жвачку; пережёвывать
  rationale: В цитате употреблён буквальный зоологический оборот, а в толковании — намеренно сохранённая метафора повторного размышления над словом.
theological_decisions:
- issue: Характер пищевых заповедей
  choice: Сохранено утверждение автора, что Моисей говорил духовно и что смысл заповедей нравственно-аллегорический.
  alternative: Представить буквальные пищевые запреты и духовное прочтение как два одновременно обязательных уровня.
  rationale: Текст сам резко противопоставляет духовный замысел пониманию заповедей как относящихся к еде; перевод не должен согласовывать это с позднейшими богословскими системами.
- issue: Кто говорит в формулах «говорит он» и «Он обрезал»
  choice: В месте цитаты из Второзакония субъект обозначен как Бог, а в заключении сохранено местоимение «Он» с заглавной буквы.
  alternative: Везде оставить двусмысленное «он» со строчной буквы или везде назвать Господа.
  rationale: Контекст различает Моисея как истолкователя и Бога как говорящего; в финале референт богословски ясен, но формулировка оригинала остаётся местоименной.
- issue: «Грядущий святой мир»
  choice: Сохранено эсхатологическое ожидание грядущего святого мира без дополнительного определения.
  alternative: Заменить на «Царство Небесное» или «вечную жизнь».
  rationale: Такие замены конкретизировали бы образ и вносили терминологию, которой в данном месте нет.
- issue: «Уже осуждены на смерть»
  choice: Сохранена напряжённая формулировка без уточнения, является ли смерть физической, духовной или окончательной.
  alternative: Истолковать как духовную погибель или вечное осуждение.
  rationale: Источник не разрешает эту неоднозначность, поэтому перевод её не снимает.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания. Архаические формы второго лица заменены современными; библейские цитаты и повторяющиеся формулы сохранены ритмически. Непристойные и сексуальные темы переданы прямо, но без вульгарности. Поскольку заявлена ожидающая выполнения сверка с греческими и латинскими свидетелями, места, зависящие от реконструкции древней лексики, переведены осторожно; явные ошибки английского печатного свидетеля не воспроизводятся.
