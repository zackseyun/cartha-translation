base_translation:
  language: en
  yaml_path: translation/extra_canonical/epistle_of_barnabas/014.yaml
  text: 'Yes, truly. But concerning the covenant that he swore to the fathers to give to the people, let us see whether he has actually given it. He has given it, but they themselves were not found worthy to receive it because of their sins.


    For the prophet says, “And Moses fasted on Mount Sinai for forty days and forty nights, so that he might receive the covenant of the Lord to give to the people. And [Moses] received from the Lord the two tablets, which were written by the finger of the Lord’s hand in the spirit.” And Moses took them and brought them down to give them to the people.


    And the Lord said to Moses, “Moses, Moses, go down quickly, for your people, whom you led out of the land of Egypt, have acted wickedly.” And Moses realized that they had again made cast-metal images for themselves, and he threw the tablets from his hands, and the tablets of the Lord’s covenant were shattered.


    Moses received them, but they themselves were not found worthy. But how did we receive them? Notice this: Moses received them as a servant, but the Lord himself gave them to us to be the people of his inheritance, having patiently endured for our sakes.


    But he was revealed so that, at the same time, they might be brought to completion in their sins, and we might receive the covenant through him who inherited it, namely the Lord Jesus. He was prepared beforehand for this purpose, so that by appearing in person he might redeem from darkness our hearts, which had already been handed over to death and delivered up to the iniquity of error, and so establish the covenant in us through the word.


    For it is written how the Father commands him to deliver us from darkness and to prepare a holy people for himself.


    Therefore the prophet says, “I, the Lord your God, called you in righteousness. I will take hold of your hand and strengthen you. I have given you as a covenant for the race, a light to the Gentiles, to open the eyes of the blind, to bring those who are bound out from their chains, and those who sit in darkness out from their prison house.” We understand, then, from where we were ransomed.


    Again the prophet says, “Behold, I have appointed you as a light to the Gentiles, that you should be for salvation to the ends of the earth.” Thus says the Lord who ransomed you, namely God.


    Again the prophet says, “The Spirit of the Lord is upon me; therefore he anointed me to proclaim good news to the humble. He has sent me to heal the brokenhearted, to proclaim release to the captives and recovery of sight to the blind, to proclaim the acceptable year of the Lord and the day of repayment, and to comfort all who mourn.”'
translation:
  language: ru
  text: 'Да, истинно. Но посмотрим, действительно ли Он дал народу завет, который поклялся дать отцам. Он дал его, однако сами они из-за своих грехов оказались недостойны принять его.


    Ибо пророк говорит: «И Моисей постился на горе Синай сорок дней и сорок ночей, чтобы принять завет Господа и передать его народу. И [Моисей][a] принял от Господа две скрижали, написанные в духе перстом руки Господней». Моисей взял их и понёс вниз, чтобы передать народу.


    И Господь сказал Моисею: «Моисей, Моисей, скорее спустись, ибо народ твой, который ты вывел из земли Египетской, поступил нечестиво». И Моисей увидел, что они снова сделали себе литых идолов; он бросил скрижали из рук, и скрижали завета Господнего разбились.


    Моисей принял их, но сами они оказались недостойны. Как же приняли их мы? Обратите внимание: Моисей принял их как слуга, а Сам Господь, претерпев ради нас, дал их нам, чтобы мы стали народом Его наследия.


    Он явился для того, чтобы одновременно они достигли полноты своих грехов, а мы приняли завет через унаследовавшего его — Господа Иисуса. Он был предуготовлен для этого: явившись лично, выкупить из тьмы наши сердца, уже отданные смерти и преданные беззаконию заблуждения, и тем самым утвердить в нас завет через слово.


    Ибо написано, как Отец повелевает Ему избавить нас от тьмы и приготовить Себе святой народ.


    Поэтому пророк говорит: «Я, Господь, Бог твой, призвал Тебя в праведности; возьму Тебя за руку и укреплю Тебя. Я дал Тебя как завет для рода[b], как свет для народов, чтобы открыть глаза слепым, вывести узников из оков и сидящих во тьме — из темницы». Итак, мы понимаем, откуда были выкуплены.


    И ещё пророк говорит: «Вот, Я поставил Тебя светом для народов, чтобы Ты был спасением до края земли». Так говорит выкупивший Тебя Господь, Бог.


    И ещё пророк говорит: «Дух Господа на Мне, потому что Он помазал Меня возвещать благую весть смиренным; послал Меня исцелять сокрушённых сердцем, провозглашать пленным освобождение и слепым прозрение, возвещать благоприятный год Господень и день воздаяния, утешать всех скорбящих».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Имя «Моисей» в этом месте восстановлено в предоставленном текстовом свидетеле; прямую рукописную основу чтения следует проверить по греческим и латинским свидетелям.
    reason: Сохраняет редакционный сигнал квадратных скобок и честно отмечает текстологическую неопределённость.
  - marker: b
    text: 'Буквально по предоставленному свидетелю: «завет рода». Возможны и иные передачи после сверки с греческим текстом, например «завет народу».'
    reason: Выражение отличается от знакомой формы Ис 42:6 и требует прямой проверки древнего текста.
lexical_decisions:
- source_word: covenant (Greek διαθήκη presumed; direct review pending)
  choice: завет
  rationale: Устоявшийся и понятный библейский эквивалент, сохраняющий как отношение, установленное Богом, так и связь со скрижалями.
- source_word: people of His inheritance
  choice: народ Его наследия
  rationale: Сохраняет необычную генитивную конструкцию и её возможную двусмысленность, не заменяя её более толковательным «народ, принадлежащий Ему».
- source_word: redeem / ransom
  choice: выкупить / быть выкупленными
  rationale: Передаёт образ освобождения ценой выкупа и поддерживает лексическую связь между христологическим утверждением и последующим выводом автора.
- source_word: in the spirit
  choice: в духе
  rationale: Формально сохраняет неясное выражение свидетеля и не решает без достаточных исходных данных, относится ли оно к способу написания, Святому Духу или духовному смыслу.
- source_word: humble
  choice: смиренным
  rationale: Сохраняет чтение предоставленного свидетеля и не подменяет его привычным по синодальной традиции «нищим» без прямой сверки с греческим текстом Варнавы.
- source_word: race
  choice: род
  rationale: Близко передаёт предоставленное чтение race и сохраняет отличие от следующего выражения «народы».
theological_decisions:
- issue: К кому относятся местоимения в противопоставлении «они — мы»
  choice: Сохранено прямое противопоставление без поясняющих идентификаций.
  alternative: Явно назвать Израиль и церковь/христиан.
  rationale: Авторская аргументация ясна из контекста, но введение конфессионально нагруженных обозначений сверх текста сузило бы смысл.
- issue: «Они достигли полноты своих грехов»
  choice: Сохранена напряжённая целевая формулировка.
  alternative: Смягчить до «их грехи обнаружились во всей полноте».
  rationale: Смягчение устранило бы подлинную причинно-целевую напряжённость фразы и изменило бы богословскую риторику автора.
- issue: Кто «унаследовал» завет
  choice: «через унаследовавшего его — Господа Иисуса»
  alternative: «через наследника — Господа Иисуса» или «через Господа Иисуса, которому принадлежит завет».
  rationale: Выбранная формулировка сохраняет глагольное понятие наследования из свидетеля и не объясняет его догматически.
- issue: Кому Отец готовит святой народ
  choice: «приготовить Себе святой народ»
  alternative: «приготовить Ему святой народ».
  rationale: Следует предоставленному английскому свидетелю, где reflexive himself естественнее относится к Отцу; при сверке с оригиналом референцию следует проверить.
- issue: Божественные местоимения
  choice: В повествовательном тексте сохранены прописные формы для Бога и Христа.
  alternative: Современные строчные формы.
  rationale: Это поддерживает достоинство русского религиозного регистра и помогает различать референтов, не добавляя отдельного догматического тезиса.
translation_notes:
  register: Современный литературный русский с достоинством раннехристианского увещания; цитаты сохраняют библейский ритм без избыточной архаизации. Из-за отсутствия в задании непосредственно приведённого греческого/латинского текста проект остаётся предварительным и опирается на указанный публичный английский свидетель как на консультационный слой. При публикационной подготовке необходима прямая сверка Codex Sinaiticus и связанных греческих/латинских свидетелей, особенно для «в духе», «завет для рода», местоименных референтов и формы ветхозаветных цитат.
