review_pass:
  verdict: revise
  source_fidelity: Черновик в целом близко следует предоставленному английскому свидетелю, однако «каков ты теперь» добавляет временное значение, которого в формуле «the mode in which you are» нет, и сглаживает её намеренную необычность. Кроме того, «ты уже постиг себя» превращает заключённое в скобки «(yourself)» в безусловное утверждение. Ввиду отсутствия прямой сверки с коптским текстом эту неопределённость следует сохранить.
  naturalness: Русский текст в целом литературен и имеет уместно возвышенный регистр. «Исследуй себя» и «сокрытое от людей» звучат естественно в данном жанре. Формулу титульного наименования лучше передать как «познавший себя», а не творительным «познавшим себя» внутри цитатного названия.
  terminology: «Истинное знание», «самого себя», «глубокое знание обо всём» последовательно передают ключевые понятия свидетеля без конфессионального истолкования. «В неведении о самих себе» приемлемо передаёт (self-)ignorance.
  issues:
  - severity: medium
    issue: Добавлено значение «теперь» в описании способа бытия Фомы.
    rationale: Свидетель говорит «the mode in which you are», противопоставляя это будущему, но не содержит наречия «now». Более буквальная формула «каким образом ты существуешь» сохраняет необычность и не добавляет временной оттенок.
  - severity: medium
    issue: Скобочная неопределённость «have comprehended (yourself)» устранена.
    rationale: '«Ты уже постиг себя» утверждает дополнение, которое в английском свидетеле помечено как неопределённое. До прямой проверки коптского текста следует сохранить скобки: «ты уже постиг (себя)».'
  - severity: low
    issue: Форма титула «познавшим себя» в кавычках тяжеловесна.
    rationale: 'После «будешь назван» она грамматически мотивирована, но как цитируемое наименование естественнее и яснее дать словарную форму: «будешь называться „познавший себя“».'
  - severity: low
    issue: Сноска неточно характеризует английскую формулу как буквальное «как ты соглашаешься».
    rationale: В свидетельстве стоит «as you concur with me»; русский вариант должен отмечать возможные значения без утверждения несуществующей буквальной формы.
  revised_text: 'Спаситель сказал: «Брат Фома, внимай Мне, пока у тебя ещё остаётся время в мире, и Я открою тебе то, о чём ты размышлял в своём уме.


    Говорят, что ты Мой близнец и истинный друг. Поэтому исследуй себя и узнай, кто ты, каким образом ты существуешь и каким будешь в будущем. Поскольку тебя назовут Моим братом, тебе не подобает не знать самого себя. Но Я знаю, что ты уже постиг (себя), потому что уже постиг, что Я — истинное знание. Итак, хотя ты и не постиг, поскольку ты согласен со Мной[a], ты уже обрёл знание и потому будешь называться „познавший себя“. Ведь тот, кто не знает себя, не знает ничего; а тот, кто познал себя, вместе с этим уже обрёл глубокое знание обо всём. Поэтому, брат Мой Фома, ты увидел сокрытое от людей — то самое, обо что они спотыкаются в неведении о самих себе».'
  revised_footnotes:
  - marker: a
    text: 'Или: «будучи в согласии со Мной», «единодушно со Мной». Английский свидетель отмечает эту фразу сноской 1; её точное значение требует прямой проверки коптского текста.'
    reason: Сохраняет привязку к сноске свидетеля и отмечает смысловую неопределённость без навязывания одного толкования.
  revision_rationale: 'Исправления минимальны: устранено добавленное «теперь», сохранена скобочная неопределённость свидетеля, улучшено оформление титульного обозначения и уточнена сноска. Смысловой парадокс между непостижением и уже обретённым знанием сохранён, равно как прямое утверждение «Я — истинное знание».'
