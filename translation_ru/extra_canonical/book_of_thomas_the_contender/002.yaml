base_translation:
  language: en
  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/002.yaml
  text: 'The Savior said, “Brother Thomas, listen to me while you have time (left) in the world, and I will reveal to you the things you have wondered about in your mind.


    “It has been said that you are my twin and true friend. Therefore, examine yourself and discover who you are, the mode in which you are, and how you will be (in the future). Since you will be called ‘my brother,’ it is not fitting for you to be ignorant of yourself. Yet I know that you have understood (yourself), because you have already understood that I am true knowledge. Thus, even though you do not understand, as you concur with me 1, you have already attained knowledge, and (so) you will be called ‘the one of self-knowledge.’ For whoever has no knowledge of himself knows nothing, but whoever knows himself has, along with that, already gained deep knowledge about everything. Consequently, my brother Thomas, you have looked upon what is hidden from human beings—namely, that which they stumble over in (self-)ignorance.”'
translation:
  language: ru
  text: 'Спаситель сказал: «Брат Фома, внимай Мне, пока у тебя ещё остаётся время в мире, и Я открою тебе то, о чём ты размышлял в своём уме.


    Говорят, что ты Мой близнец и истинный друг. Поэтому исследуй себя и узнай, кто ты, каков ты теперь и каким станешь в будущем. Поскольку тебя назовут Моим братом, тебе не подобает не знать самого себя. Но Я знаю, что ты уже постиг себя, потому что понял: Я — истинное знание. Итак, даже если ты ещё не постиг, то, соглашаясь со Мной[a], ты уже обрёл знание и потому будешь назван „познавшим себя“. Ведь тот, кто не знает себя, не знает ничего; а тот, кто познал себя, вместе с этим уже обрёл глубокое знание обо всём. Поэтому, брат Мой Фома, ты увидел сокрытое от людей — то самое, обо что они спотыкаются, пребывая в неведении о самих себе».'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Буквально по данному английскому свидетелю: «как ты соглашаешься со Мной»; возможны также оттенки «единодушен со Мной» или «находишься в согласии со Мной».'
    reason: Фраза отмечена в свидетеле сноской 1 и семантически неоднозначна; коптский текст требует прямой проверки.
lexical_decisions:
- source_word: heed me
  choice: внимай Мне
  rationale: Сохраняет настойчивый призыв слушать и принимать сказанное, оставаясь естественным для возвышенной современной русской речи.
- source_word: the mode in which you are
  choice: каков ты теперь
  rationale: Передаёт трудную и не вполне ясную формулу свидетеля без искусственного философского термина; временное «теперь» обусловлено последующим противопоставлением будущему.
- source_word: true knowledge
  choice: истинное знание
  rationale: Формально сохраняет предикативное отождествление говорящего со знанием и не заменяет его толкованием вроде «источник истины».
- source_word: the one of self-knowledge
  choice: познавшим себя
  rationale: Естественно по-русски выражает титульное обозначение человека, достигшего самопознания, не вводя поздней специализированной терминологии.
- source_word: know-nothing
  choice: не знает ничего
  rationale: Сохраняет афористический параллелизм с «знает себя» и избегает разговорно-пренебрежительного существительного «невежда».
- source_word: what is veiled to humans
  choice: сокрытое от людей
  rationale: Передаёт образ недоступного человеческому восприятию без добавления причины или агента сокрытия.
theological_decisions:
- issue: Отождествление Спасителя с «истинным знанием»
  choice: Я — истинное знание
  alternative: во Мне истинное знание / Я обладаю истинным знанием
  rationale: Свидетель даёт прямое предикативное утверждение; его напряжённость сохранена без догматического разъяснения.
- issue: Парадокс «даже если ты не постиг… уже обрёл знание»
  choice: даже если ты ещё не постиг… ты уже обрёл знание
  alternative: хотя ты не вполне понимаешь…
  rationale: Сохранено внутреннее напряжение текста. Добавленное «ещё» делает русский ход речи понятнее, не устраняя парадокса между непостижением и уже достигнутым знанием.
- issue: Значение братства Фомы со Спасителем
  choice: тебя назовут Моим братом
  alternative: ты станешь Моим братом
  rationale: Сохраняется формула называния, не превращаемая в онтологическое или ритуальное утверждение.
- issue: Самопознание и знание обо всём
  choice: вместе с этим уже обрёл глубокое знание обо всём
  alternative: тем самым познал всё
  rationale: Не усиливает свидетель до абсолютного всеведения и сохраняет формулировку о глубоком знании.
translation_notes:
  register: 'Современный литературный русский с умеренно возвышенным, диалогическим звучанием. Местоимения, относящиеся к Спасителю, написаны с прописной буквы как издательская норма данного проекта, без изменения смысла. Перевод остаётся предварительным: предоставлена только английская публикационная версия, а прямая сверка с коптским текстом Nag Hammadi Codex II,7 ещё не выполнена. Скобочные пояснения свидетеля по возможности раскрыты в гладком русском тексте; рукописная пагинация не воспроизводится.'
