translation:
  language: ru
  text: 'Фома сказал Господу:


    — Итак, прошу Тебя: прежде Своего вознесения ответь на то, о чём я спрашиваю. Когда я услышу от Тебя о сокрытом, тогда смогу говорить об этом открыто. Ведь мне ясно, что творить истину перед другими трудно.


    Спаситель ответил:


    — Если от тебя сокрыто видимое, как ты сможешь услышать о невидимом? Если тебе трудно совершать дела истины, видимые в этом мире, то как же ты совершишь дела, относящиеся к невидимой вышней высоте и Полноте?[a] И как вас назовут «делателями»? В этом отношении вы ещё ученики и пока не достигли вершины совершенства.


    Фома сказал Спасителю в ответ:


    — Объясни нам то, что Ты называешь невидимым, [но что всё же] сокрыто от нас.


    Спаситель сказал:


    — [Все] тела […] животные рождаются […] это явлено, подобно […] также и это; те, кто наверху […] видимое, но [они] видимы [] в собственном корне, и их плод питает их.[b] Эти же видимые тела поддерживают жизнь, поедая подобных им животных, вследствие чего тела изменяются. То, что изменяется, придёт в упадок и погибнет, а после этого утратит всякую надежду на жизнь, потому что оно — животное тело. Поэтому, как погибают тела животных, так погибнут и эти [телесные] облики. Они возникают от соития, как и тела животных, не так ли? Если и они возникают от соития, то как породят нечто отличное от животных? Поэтому вы останетесь младенцами, пока не станете зрелыми.


    Фома ответил:


    — Потому я и говорю Тебе, Господи: рассуждающие о невидимом и о том, что трудно истолковать, подобны людям, которые ночью пускают стрелы в мишень. Они пускают стрелы так же, как и все прочие, потому что целятся в мишень, но её не видно. Когда же явится свет и покроет тьму, тогда обнаружится дело каждого. О Господи, Свет наш, просвети нас!


    Иисус сказал:


    — Природа света — свет.[c]


    Фома спросил:


    — Господи, почему этот видимый свет, сияющий для людей, восходит и заходит?


    Спаситель ответил:


    — О блаженный Фома! Этот видимый свет сияет для вас, конечно, не для того, чтобы вы оставались здесь, но чтобы вы ушли отсюда. Когда все избранные оставят животное состояние, тогда этот свет возвратится ввысь, к своей сущности, и приветствует [тот свет], потому что он — добрый служитель.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: «Полнота» — буквальная передача особого термина; здесь он обозначает невидимую высшую реальность, но точный объём понятия текст не разъясняет.
    reason: Термин богословски нагружен и допускает несколько исторических толкований.
  - marker: b
    text: Начало этой речи сильно повреждено. Многоточия обозначают утраты текста, квадратные скобки — редакционные восстановления; пустые скобки [] сохранены из используемого свидетельства как знак неуточнённой лакуны. Поэтому синтаксис и ход мысли здесь остаются неясными.
    reason: Необходимо явно отличить сохранившийся текст от реконструкции и не создавать ложной связности.
  - marker: c
    text: 'Возможен также более пояснительный перевод: «Свет по природе своей есть свет». Краткая тавтологическая форма исходного свидетельства сохранена.'
    reason: Фраза допускает как онтологическое, так и афористическое прочтение.
  - marker: d
    text: 'Конец фразы неоднозначен: не вполне ясно, какой именно свет приветствует другой свет и к кому относится определение «добрый служитель». Слова «[тот свет]» отражают редакционное восполнение в используемом свидетельстве.'
    reason: Русская грамматика побуждает уточнить референты, тогда как повреждённый текст не позволяет сделать это уверенно.
lexical_decisions:
- source_word: do the truth
  choice: творить истину / совершать дела истины
  rationale: 'Сохранён необычный деятельный смысл выражения: истина здесь не только познаётся или говорится, но осуществляется поступками. В первом случае оставлена более резкая формула, во втором естественно передана связь с «делами».'
- source_word: Fullness
  choice: Полнота
  rationale: Термин передан буквально и с прописной буквы как обозначение трансцендентной реальности; не заменён конфессионально нагруженным толкованием.
- source_word: workers
  choice: делатели
  rationale: Выбор сохраняет связь с предшествующим глаголом «совершать» и возвышенный характер речи, не сужая значение до ремесла или наёмного труда.
- source_word: animal body / animal state
  choice: животное тело / животное состояние
  rationale: Буквальная лексическая связь сохранена по всему отрывку; варианты вроде «плотское» внесли бы дополнительное богословское толкование.
- source_word: summit of perfection
  choice: вершина совершенства
  rationale: Сохранён пространственный образ достижения высшей меры зрелости.
- source_word: The nature of light is light
  choice: Природа света — свет
  rationale: Намеренно сохранена краткая парадоксальная формула без поясняющей перефразировки.
theological_decisions:
- issue: Соотношение видимого и невидимого
  choice: 'Сохранён парадокс: видимое может быть сокрыто, а невидимое требует практического исполнения истины.'
  alternative: Объяснить «сокрыто» как духовное непонимание.
  rationale: Такое объяснение возможно, но отсутствует в предоставленном свидетельстве и сняло бы намеренную напряжённость высказывания.
- issue: Полнота
  choice: Оставлено термином «Полнота».
  alternative: Передать как «совершенство», «полнота Божества» или использовать термин «Плерома».
  rationale: «Полнота» доступна современному читателю и не отождествляет термин заранее с конкретной догматической системой.
- issue: Гибель телесных обликов
  choice: Утверждение передано прямо, без согласования с позднейшими учениями о теле и воскресении.
  alternative: Смягчить формулировку или истолковать её как гибель исключительно греховного состояния.
  rationale: Перевод должен сохранять собственное богословское напряжение данного текста.
- issue: Отказ избранных от animal state
  choice: «оставят животное состояние».
  alternative: «отрекутся от плотской природы» или «покинут тела».
  rationale: Выбранная формула ближе к свидетельству и не решает, означает ли речь нравственное преображение, освобождение от телесности или иное состояние.
- issue: Возвращение света к сущности и приветствие света
  choice: Сохранено различение «этот свет» и восстановленное «[тот свет]», с отмеченной неясностью.
  alternative: Отождествить оба света или истолковать сцену как возвращение души к Богу.
  rationale: Повреждённое и неоднозначное свидетельство не позволяет уверенно закрепить такое толкование.
translation_notes:
  register: 'Современный литературный русский с достоинством диалогической учительной речи. Местоимения обращения к Господу пишутся с прописной буквы как элемент русского благоговейного регистра, без добавления конфессиональной интерпретации. Архаизмы сведены к минимуму; «делатели» сохранено как уместное возвышенное слово. Перевод предварительный: выполнен по предоставленному публичному английскому свидетельству, поскольку непосредственная сверка с коптским текстом ещё ожидается. Лакуны, редакционные скобки и смысловые напряжения не сглажены.'
