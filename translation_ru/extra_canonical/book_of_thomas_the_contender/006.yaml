review_pass:
  verdict: revise
  source_fidelity: Сверка возможна только с предоставленным английским свидетельством; непосредственная проверка коптского текста пока невозможна. В целом образный ряд и последовательность соответствуют свидетельству. Однако в повреждённом месте «and [you] have failed to understand» черновик вводит [не], то есть меняет утверждение на отрицание. Кроме того, пустые лакуны, обозначенные в свидетельстве как «[]», несколько раз заменены на «[…]», что стирает различие между пустой лакуной и лакуной с обозначенным пропуском.
  naturalness: Русский текст в целом литературный, ритмичный и соответствует торжественно-обличительному регистру. Некоторые намеренно странные формулы сохранены там, где они отражают неясность или образность свидетеля. Формула о «мёртвой земле» уточнена так, чтобы передать сравнительную конструкцию и скобочное слово оригинального свидетельства.
  terminology: «Безбожные», «плоть», «нетленное», «темница», «виноградная лоза» и «соитие» уместны и не навязывают конфессионального толкования. «Друзья» и космологические образы солнца и луны оставлены без интерпретирующего уточнения.
  issues:
  - severity: high
    issue: Вставлено отрицание «[не] поняли».
    rationale: 'Английское свидетельство имеет «and [you] have failed to understand», без отрицания: адресаты «не сумели/не смогли понять», а не «поняли». Вставка «не» меняет смысл и не отмечена как лакуна свидетельства.'
  - severity: medium
    issue: Пустые лакуны «[]» переданы как «[…]» в нескольких местах.
    rationale: Свидетельство различает пустые квадратные скобки и скобки с многоточием. Это различие следует сохранять, особенно в финальном повреждённом фрагменте.
  - severity: low
    issue: Финал притчи о лозе не вполне передаёт «became as (dead) as the soil».
    rationale: Фраза «стали подобны мёртвой земле» сглаживает сравнительную конструкцию и не сохраняет заключённое в скобки «(dead)». Более точная, хотя и намеренно шероховатая передача сохраняет оба признака.
