  yaml_path: translation/extra_canonical/book_of_thomas_the_contender/006.yaml
  text: 'The Savior then continued: “Woe to you who are godless, who are without hope, expecting what will never happen! Woe to you whose hope is in the flesh, in the prison destined to perish! How long will you remain forgetful? And how long will you assume that imperishable things will also perish? Your hope is fixed on the world, and your god is this life! You are destroying yourselves!


    Woe to you because of the fire that scorches you from within, for it cannot be quenched! Woe to you because of the wheel that spins inside your minds! Woe to you in the grip of the scorching that dwells within you, for it will visibly consume your flesh and invisibly tear apart your souls, and it will prepare you to join your friends! Woe to you prisoners, for you are chained in caves!


    “You mock and smirk with insane laughter! You are unaware of your damnation, and you do not consider your condition, and [you] have failed to understand that you live in darkness and [death]! Instead, you are intoxicated with fire and [filled] with bitterness. Your mind is insane because of the [scorching that is inside] you, and the venom and attacks of your enemies are sweet to you! Gloom rose for you like light because you surrendered your freedom for slavery! You blackened your hearts and gave up your thoughts to foolishness, and you filled your thoughts with the fiery smoke inside you! And your light [was obscured] in the cloud [of . . .], and the clothes that cover you, you [. . .]. And [you] were captured by an empty [hope]. And whom did [you] believe? Do you [not understand that] all of [you] live among those who [. . .] you as though [you . . .].


    [] You immersed yourselves in the water of gloom! You acted according to your own urges! Woe to you who live in error, who neglect the light of the sun that judges the world and gazes down upon it, and that will encircle all things in order to enslave enemies. Nor do you perceive the moon, which by night and day gazes down, beholding the corpses from your slaughtering! Woe to you who love being close to women and (who love) unclean intercourse with them! Woe to you who are caught in the grip of your bodily powers, for they will torment you! Woe to you who are caught in the grip of the forces of evil demons! Woe to you who lure your limbs with fire!


    “Who will send a shower of cool dew upon you to quench the cloud of fire engulfing you together with your scorching? Who will make the sun shine upon you to dispel the gloom within you and to conceal the gloom and impure water? The sun and moon, together with the air, the wind, the earth, and the water, will grant you a fragrant scent, because if the sun does not shine upon these bodies, they will wither and perish, just like weeds and grass. If the sun shines upon them, they take over and strangle the grapevine. If, however, the grapevine takes over and shades all the weeds and other bushes growing beside them, and [spreads] and increases, it alone will receive the land where it grows and will dominate every place it has overshadowed. When it matures, it will control the entire land and produce abundantly for its master, and it will please him even more, because he will have avoided the great trouble of uprooting these plants. Instead, the grapevine itself got rid of them, even choking
    them, and they died and became as (dead) as the soil.”


    Jesus then continued and said: “Woe to you, because you did not accept the teaching, and those who [. . .] will work at preaching [. . .]. And [you] are running into [. . .] will drive [them] downward [. . .] by day you kill them [] so that they could rise from death.”'
translation:
  language: ru
  text: 'Затем Спаситель продолжил: «Горе вам, безбожным, лишённым надежды и ожидающим того, что не сбудется! Горе вам, чья надежда — на плоть, на темницу, обречённую погибнуть! Долго ли вы будете пребывать в забвении? И долго ли будете полагать, что нетленное тоже погибнет? Ваша надежда обращена к миру, и ваш бог — эта жизнь! Вы губите самих себя!


    Горе вам из-за огня, который палит вас изнутри, ибо его не угасить!


    Горе вам из-за колеса, вращающегося в ваших умах!


    Горе вам, оказавшимся во власти жара, живущего внутри вас, ибо он на глазах пожрёт вашу плоть и незримо растерзает ваши души, приготовив вас к соединению с вашими друзьями!


    Горе вам, узники, ибо вы скованы в пещерах!


    Вы насмехаетесь и безумно хохочете! Вы не сознаёте, что осуждены, не задумываетесь о своём положении и [не] поняли, что живёте во тьме и [смерти]![a] Напротив, вы опьянены огнём и [наполнены] горечью. Ваш ум обезумел от [жара, который внутри] вас; яд и нападения ваших врагов сладки вам! Мрак стал для вас словно свет, потому что вы отдали свою свободу в рабство! Вы очернили свои сердца, предали свои мысли безумию и наполнили их огненным дымом, который внутри вас! И ваш свет [померк] в облаке […], и одежды, покрывающие вас, вы […]. И [вы] оказались в плену у пустой [надежды]. И кому [вы] поверили? [Разве вы не понимаете, что] все [вы] живёте среди тех, кто […] вас, словно [вы …].[b]


    […] Вы погрузились в воду мрака!


    Вы поступали по собственным влечениям!


    Горе вам, живущим в заблуждении и пренебрегающим светом солнца, которое судит мир и взирает на него свыше, которое окружит всё, чтобы поработить врагов.


    Не замечаете вы и луны, которая ночью и днём взирает свыше, видя трупы тех, кого вы убили!


    Горе вам, любящим близость с женщинами и нечистое соитие с ними!


    Горе вам, оказавшимся во власти сил вашего тела, ибо они будут мучить вас!


    Горе вам, оказавшимся во власти сил злых демонов!


    Горе вам, завлекающим свои члены огнём!


    Кто пошлёт на вас прохладную росу, чтобы погасить облако огня, которое охватывает вас вместе с вашим жаром? Кто заставит солнце воссиять над вами, чтобы рассеять мрак внутри вас и скрыть мрак и нечистую воду? Солнце и луна вместе с воздухом, ветром, землёй и водой даруют вам благоухание. Ведь если солнце не светит на эти тела, они увядают и гибнут, подобно сорнякам и траве. Если же солнце светит на них, они разрастаются и душат виноградную лозу. Но если верх возьмёт лоза, осенит тенью все сорняки и прочие кусты, растущие рядом с ними, [распространится] и разрастётся, то она одна завладеет землёй, на которой растёт, и станет господствовать над всяким местом, которое покрыла своей тенью. Когда же она созреет, то овладеет всей землёй и принесёт своему хозяину обильный плод, ещё больше порадовав его, ведь ему не придётся брать на себя тяжкий труд — вырывать эти растения. Сама лоза избавилась от них, задушив их; и они умерли и стали подобны мёртвой земле».


    Затем Иисус продолжил: «Горе вам, потому что вы не приняли учения, и те, кто […] будут трудиться, проповедуя […]. И [вы] устремляетесь в […] низвергнет [их] вниз […] днём вы убиваете их […], чтобы они могли восстать из смерти».[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Квадратные скобки отмечают восстановленный или повреждённый текст рукописи; многоточия в скобках указывают на утрату слов.
    reason: Необходимо явно объяснить читателю сигналы повреждения рукописи, последовательно сохранённые в основном тексте.
  - marker: b
    text: В этом месте рукопись сильно повреждена, поэтому связный смысл предложения восстановить невозможно.
    reason: Предотвращает ложное впечатление, будто обрывочная русская фраза является намеренно завершённым высказыванием.
  - marker: c
    text: Заключительные строки дошли с большими лакунами; связи между проповедью, низвержением, убийством и восстанием из смерти остаются неясными.
    reason: Сохраняет текстовую и богословскую неопределённость финального фрагмента.
lexical_decisions:
- source_word: godless
  choice: безбожным
  rationale: Прямо передаёт религиозно-нравственную характеристику, не добавляя конфессионального оттенка.
- source_word: flesh
  choice: плоть
  rationale: Сохраняет традиционный антропологический термин и его возможное богословское напряжение, не сводя его просто к «телу».
- source_word: prison
  choice: темницу
  rationale: Сохраняет метафору плоти как заключения и образный строй отрывка.
- source_word: imperishable things
  choice: нетленное
  rationale: Передаёт контраст тленного и нетленного без уточнения спорного референта.
- source_word: wheel
  choice: колесо
  rationale: Неясный образ сохранён буквально, без попытки истолковать его.
- source_word: bodily powers
  choice: сил вашего тела
  rationale: Сохраняет неоднозначность между телесными способностями, страстями и персонифицированными силами.
- source_word: intercourse
  choice: соитие
  rationale: Достоинный современный литературный термин, достаточно прямой и не эвфемистический.
- source_word: grapevine
  choice: виноградная лоза
  rationale: Естественный русский образ, сохраняющий противопоставление лозы сорнякам.
- source_word: rise from death
  choice: восстать из смерти
  rationale: Сохраняет необычную формулировку повреждённого места и не заменяет её более привычным «воскреснуть из мёртвых».
theological_decisions:
- issue: Отношение к плоти и миру
  choice: Сохранена резкая отрицательная образность источника
  alternative: Смягчить её как осуждение лишь греховных желаний
  rationale: Текст прямо связывает надежду на плоть и мир с погибелью; перевод не должен заранее согласовывать это с определённой богословской системой.
- issue: Солнце и луна как действующие лица
  choice: 'Сохранены грамматически одушевлённые действия: судит, взирает, видит'
  alternative: Истолковать солнце и луну как простые символы Бога или откровения
  rationale: Источник допускает космологическое, символическое или персонифицированное прочтение; выбор не разрешён в переводе.
- issue: «Ваши друзья»
  choice: Не уточнено, кто именно имеется в виду
  alternative: Передать как демонов, сообщников или прочих осуждённых
  rationale: Референт не определён, поэтому подлинная неоднозначность сохранена.
- issue: Нечистое соитие с женщинами
  choice: Передано прямо, без универсализации и без догматического комментария
  alternative: Истолковать как осуждение всякой половой жизни либо только конкретной распущенности
  rationale: Фраза отражает аскетическую риторику документа, но её точный объём нельзя надёжно установить по данному свидетелю.
- issue: Финальное «восстать из смерти»
  choice: Фрагментарная причинно-целевая связь сохранена
  alternative: Исправить на ясное утверждение о воскресении мучеников
  rationale: Повреждение рукописи не позволяет уверенно восстановить синтаксис и богословский смысл.
translation_notes:
  register: 'Современный литературный русский язык с торжественным пророческим ритмом. Повторы «горе вам» и параллельные конструкции сохранены. Архаизмы используются умеренно только там, где они естественны для религиозно-литературного регистра («плоть», «нетленное», «воссиять»). Перевод предварительный: предоставлен английский публично-доступный свидетель, а непосредственная сверка с коптским текстом Nag Hammadi Codex II,7 ещё требуется.'
