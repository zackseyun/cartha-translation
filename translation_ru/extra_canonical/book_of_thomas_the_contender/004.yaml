translation:
  language: ru
  text: 'Тогда Спаситель продолжил: «О непостижимая любовь к свету! О горечь огня, горящего в телах и костном мозге людей, день и ночь разгорающегося в них, опаляющего человеческие члены, [опьяняющего] их умы и доводящего их души до безумия […] их в мужчинах и женщинах […] ночью, и они совершают движения […] тайно и явно, ибо мужчины [совершают движения… на женщинах], а женщины — на [мужчинах]. [Поэтому и] сказано: “Все, кто ищет истину, исходя из истинной мудрости, обретут крылья, чтобы лететь, избегая вожделения, которое опаляет человеческие души, и обретут крылья, чтобы избегать всякого [злого] духа, которого увидят”».[a]


    Фома ответил: «Господи, именно об этом я и спрашиваю Тебя, потому что понял: как Ты и говоришь, Ты — наш благодетель».


    Спаситель вновь ответил: «Потому-то Нам и надлежит говорить с тобой, ведь это учение для зрелых. Если теперь ты хочешь стать зрелым, то исполнишь это. Если же нет, имя тебе — Невежда, ибо разумный не может жить с глупцом: разумный зрел во всякой мудрости. Ибо мудрый будет вскормлен истиной и “будет как дерево, растущее у извилистого потока” (Псалом 1:3).[b] Для глупца же добро и зло одинаковы: хотя у некоторых и есть крылья, они всё же устремляются к видимому, далёкому от истины. Ведь ведущий их огонь создаёт для них подобие истины, озаряет их [тленной] красотой, заключает в сладостный мрак и околдовывает благоуханным наслаждением.


    Он ослепит их неугасимым вожделением, опалит их души и станет для них словно кол, вбитый в сердце, которого им никогда не вынуть. Он водит их куда пожелает, словно удилами во рту. Горечью рабства — вожделением к видимому, которое внезапно вырождается, изменяется и уклоняется, — он связал их своими цепями и сковал каждый их член. Их неизменно влечёт вниз. Когда их умерщвляют, их пожирают все звери тленного мира».


    Фома ответил: «Это ясно, как и было сказано: [“Много… тех, кто не знает] […] души”».[c]


    И [Спаситель] ответил: «[Блажен] мудрый, который [искал истину и], найдя её, навеки обрёл в ней покой и не боялся тех, кто пытался лишить его покоя».[d]


    Фома спросил: «Хорошо ли нам, Господи, обрести покой среди того, что принадлежит нам?»


    Спаситель сказал: «Да, это полезно и хорошо для вас, ибо видимое среди людей исчезнет, поскольку их плотский сосуд исчезнет; и когда он обратится в ничто, то окажется среди видимого, среди того, что можно увидеть.[e] Тогда огонь, который они видят, причинит им боль из-за их прежней любви к вере.[f] Они вновь будут собраны к видимому. Кроме того, те, кто способен видеть среди невидимого, но не обладает величайшей любовью, погибнут из-за поглощённости этой жизнью и опаляющего огня. Пройдёт совсем немного времени — и видимое исчезнет. Тогда выйдут бесформенные тени; среди могил они будут вечно пребывать при трупах, страдая, а их душа — разлагаться».[g]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Квадратные скобки и многоточия здесь и далее обозначают утраты рукописи либо предложенное восстановление текста. Перевод предварительный: прямая сверка с коптским текстом ещё не выполнена.'
    reason: Читателю необходимо различать сохранившийся текст, лакуны и редакционные восстановления.
  - marker: b
    text: Ср. Псалом 1:3. Формулировка «у извилистого потока» следует данному текстовому свидетелю и отличается от привычной формы псалма «при потоках вод».
    reason: Отмечает цитатную связь и необычное чтение без исправления по каноническому тексту.
  - marker: c
    text: Из-за значительной лакуны смысл цитаты восстановить невозможно.
    reason: Предотвращает ложное впечатление связности повреждённого фрагмента.
  - marker: d
    text: Начало ответа частично восстановлено; выражение о покое может означать как утверждение в истине, так и окончательное успокоение.
    reason: Сохраняет смысловую неоднозначность повреждённого текста.
  - marker: e
    text: 'Фраза парадоксальна: после исчезновения плотского сосуда он, согласно сохранившемуся свидетелю, оказывается «среди видимого». Возможная порча текста не исправлялась.'
    reason: Сигнализирует о внутренней трудности источника, не предлагая догматической гармонизации.
  - marker: f
    text: Чтение «любви к вере» следует английскому свидетелю, но в данном контексте остаётся неясным и требует проверки по коптскому тексту.
    reason: Это потенциально существенная текстовая или переводческая проблема.
  - marker: g
    text: Заключительные слова о разложении души переданы буквально по смыслу свидетеля; текст не уточняет, является ли это образом, состоянием наказания или онтологическим утверждением.
    reason: Не допускает преждевременного богословского разрешения напряжённой формулировки.
lexical_decisions:
- source_word: mature
  choice: зрелые / зрелым
  rationale: Сохраняет ключевой повтор и идею духовно-интеллектуальной зрелости, не вводя конфессионального термина «совершенные».
- source_word: Ignoramus
  choice: Невежда
  rationale: Передаёт данное человеку имя-характеристику естественным русским существительным с прописной буквы.
- source_word: reposed on it
  choice: обрёл в ней покой
  rationale: Сохраняет образ покоя и его связь с истиной; формула «почил на ней» в современном русском вызвала бы ассоциацию со смертью.
- source_word: visible things
  choice: видимое
  rationale: Субстантивированное прилагательное удерживает философское противопоставление видимого и невидимого и избегает лишней конкретизации.
- source_word: lust
  choice: вожделение
  rationale: Достоинный современный термин, способный обозначать как половую страсть в повреждённом начале, так и более широкое страстное желание далее.
- source_word: perishable realm
  choice: тленный мир
  rationale: Естественно передаёт область распада и смертности без добавления специальной космологической схемы.
- source_word: spirits
  choice: души
  rationale: В данной фразе выбор следует смысловой линии свидетеля о внутренней человеческой жизни, однако исходный английский имеет «spirits»; неопределённость отмечена состоянием источника и подлежит проверке по коптскому.
theological_decisions:
- issue: «Teaching for the mature» и возможное значение «совершенные»
  choice: учение для зрелых
  alternative: учение для совершенных
  rationale: «Зрелые» сохраняет развитие мысли и не превращает выражение в техническое обозначение особой духовной группы.
- issue: Природа огня и вожделения
  choice: Огонь оставлен как образ с неоднозначным референтом
  alternative: Прямо назвать его адским огнём, плотской страстью или отдельной злой силой
  rationale: Текст персонифицирует огонь, но не даёт достаточного основания однозначно отождествить его с конкретной догматической сущностью.
- issue: «Former love for the faith»
  choice: прежняя любовь к вере
  alternative: прежняя любовь к неверию / прежняя страсть к вере
  rationale: Сохранено трудное чтение свидетеля без богословского исправления; возможная порча или неточность требует сверки с коптским.
- issue: Судьба души в заключении
  choice: а их душа — разлагаться
  alternative: а их душа будет пребывать в тлении
  rationale: Сохранена резкая и богословски напряжённая формулировка свидетеля, без гармонизации с позднейшими учениями о природе души.
- issue: Первое лицо множественного числа в «we must speak»
  choice: Нам надлежит говорить
  alternative: Мне надлежит говорить / нужно говорить
  rationale: Сохранено грамматическое число английского свидетеля и связанная с ним неоднозначность говорящего состава.
translation_notes:
  register: Современный литературный русский с торжественной, но понятной речью. Повторы «огонь», «видимое», «крылья», «зрелый», «покой» намеренно сохранены как смысловые связки. Синтаксис повреждённых мест не сглажен до ложной ясности. Архаизмы ограничены общеупотребительными формулами вроде «ибо» и «надлежит»; местоимения при обращении к Спасителю написаны с прописной буквы по русской религиозно-литературной норме.
