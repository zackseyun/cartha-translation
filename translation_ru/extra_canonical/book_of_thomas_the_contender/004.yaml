    rationale: Для современного русского литературного издания предпочтительны русские вложенные кавычки „…“.
  revised_text: 'Тогда Спаситель продолжил: «О непостижимая любовь к свету! О горечь огня, горящего в телах и костном мозге людей, день и ночь разгорающегося в них, опаляющего человеческие члены, [опьяняющего] их умы и доводящего их души до безумия […] их в мужчинах и женщинах […] ночью, и они совершают движения […] тайно и явно, ибо мужчины [совершают движения… на женщинах], а женщины — на [мужчинах]. [Поэтому и] сказано: „Все, кто ищет истину, исходя из истинной мудрости, обретут крылья, чтобы лететь, избегая вожделения, которое опаляет человеческие духи, и обретут крылья, чтобы избегать всякого [злого] духа, которого увидят“».[a]


    Фома ответил: «Господи, именно об этом я и спрашиваю Тебя, потому что понял: как Ты и говоришь, Ты — наш благодетель».


    Спаситель вновь ответил: «Потому-то Нам и надлежит говорить с тобой, ведь это учение для зрелых. Если теперь ты хочешь стать зрелым, то исполнишь это. Если же нет, имя тебе — Невежда, ибо разумный не может жить с глупцом: разумный зрел во всякой мудрости. Ибо мудрый будет вскормлен истиной и „будет как дерево, растущее у извилистого потока“ (Псалом 1:3).[b] Для глупца же добро и зло одинаковы: хотя у некоторых и есть крылья, они всё же устремляются к видимому, далёкому от истины. Ведь ведущий их огонь создаёт для них подобие истины, озаряет их [тленной] красотой, заключает в сладостный мрак и околдовывает благоуханным наслаждением.


    Он ослепит их неугасимым вожделением, опалит их души и станет для них словно кол, вбитый в сердце, которого им никогда не вынуть. Он водит их куда пожелает, словно удилами во рту. Горечью рабства — вожделением к видимому, которое самопроизвольно вырождается, изменяется и уклоняется, — он связал их своими цепями и сковал каждый их член. Их неизменно влечёт вниз. Когда их умерщвляют, их пожирают все животные тленного мира».


    Фома ответил: «Это ясно, как и было сказано: [„Много… тех, кто не знает] […] души“».[c]


    И [Спаситель] ответил: «[Блажен] мудрый, который [искал истину и], найдя её, навеки обрёл в ней покой и не боялся тех, кто пытался лишить его покоя».[d]


    Фома спросил: «Хорошо ли нам, Господи, обрести покой среди того, что принадлежит нам?»


    Спаситель сказал: «Да, это полезно и хорошо для вас, ибо видимое среди людей исчезнет, поскольку их плотский сосуд исчезнет; и когда он обратится в ничто, то окажется среди видимого, среди того, что можно увидеть.[e] Тогда огонь, который они видят, причинит им боль из-за их прежней любви к вере.[f] Они вновь будут собраны к видимому. Кроме того, те, кто способен видеть среди невидимого, но не обладает величайшей любовью, погибнут из-за поглощённости этой жизнью и опаляющего огня. Пройдёт совсем немного времени — и видимое исчезнет. Тогда выйдут бесформенные тени; среди могил они будут вечно пребывать при трупах, страдая, а их душа — разлагаться».[g]'
